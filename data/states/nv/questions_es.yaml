questions:
- id: 1
  category: driver_testing
  question: ¿En qué material se basa el examen de conocimientos para obtener su licencia
    de conducir de Nevada?
  choices:
    A: Únicamente en los Estatutos Revisados de Nevada
    B: En la información del Manual del Conductor de Nevada
    C: En las pautas federales de conducción
    D: En el libro de texto del curso de educación vial
  answer: B
  explanation: De acuerdo con la introducción del manual, el examen de conocimientos
    para su licencia de Nevada se basa en la información contenida en este manual.
- id: 2
  category: driver_responsibility
  question: Si necesita encontrar la redacción exacta de leyes de tránsito específicas,
    ¿a qué debe referirse?
  choices:
    A: Al Manual del Conductor de Nevada
    B: A los Estatutos Revisados de Nevada (NRS)
    C: Al manual del Departamento de Transporte
    D: A las pautas del departamento de policía local
  answer: B
  explanation: El manual establece que no proporciona la redacción exacta de las leyes
    de tránsito. Para leyes específicas, debe consultar los Estatutos Revisados de
    Nevada (NRS).
- id: 3
  category: driver_responsibility
  question: ¿Dónde puede encontrar copias de los Estatutos Revisados de Nevada (NRS)?
  choices:
    A: Solo en la oficina del DMV
    B: En bibliotecas públicas y en línea
    C: Exclusivamente en el capitolio estatal
    D: Solo comprándolas en la imprenta estatal
  answer: B
  explanation: La introducción especifica que las copias de los NRS están disponibles
    en bibliotecas públicas y en línea en leg.state.nv.us/law1.html.
- id: 4
  category: sharing_the_road
  question: De acuerdo con los cambios clave en la edición 2024 del manual, ¿qué información
    nueva se agregó con respecto a los peatones?
  choices:
    A: Información sobre los guardias de cruce en zonas escolares
    B: Información sobre peatones ciegos
    C: Información sobre las sanciones por cruzar imprudentemente
    D: Información sobre el derecho de paso de los peatones en las rotondas
  answer: B
  explanation: La sección de 'Cambios clave en esta edición' señala que se agregó
    información sobre peatones ciegos en la página 67.
- id: 5
  category: license_system
  question: ¿Qué significan las siglas 'DAC' en el Manual del Conductor de Nevada?
  choices:
    A: Tarjeta de Autorización de Conducir (Driver Authorization Card)
    B: Curso de Evaluación de Conducción (Driving Assessment Course)
    C: Departamento de Control de Automóviles (Department of Automobile Control)
    D: Certificación de Concientización del Conductor (Driver Awareness Certification)
  answer: A
  explanation: El índice del Capítulo 1 enumera la 'Tarjeta de Autorización de Conducir
    (DAC)' como una sección.
- id: 6
  category: license_system
  question: ¿Qué significan las siglas 'CDL' en las clasificaciones de licencias?
  choices:
    A: Licencia de Conducir Certificada (Certified Driver License)
    B: Licencia de Conducir Comercial (Commercial Driver License)
    C: Licencia Clase D (Class D License)
    D: Licencia de Conducir de la Ciudad (City Driver License)
  answer: B
  explanation: El índice del Capítulo 1 incluye una sección titulada 'Licencia de
    Conducir Comercial (CDL)'.
- id: 7
  category: license_system
  question: De acuerdo con los cambios clave del manual, ¿qué información se agregó
    a la página 20?
  choices:
    A: Indicadores médicos
    B: Donantes de órganos
    C: Designación de veterano
    D: Tarjetas de identificación
  answer: A
  explanation: La sección de 'Cambios clave en esta edición' establece que se agregó
    información sobre Indicadores Médicos en la página 20.
- id: 8
  category: safe_driving_rules
  question: ¿Cuál de los siguientes temas se cubre bajo 'Conducción en autopista'
    en el Capítulo 3?
  choices:
    A: Rotondas
    B: Carriles para vehículos de alta ocupación (HOV)
    C: Rebasar a ciclistas
    D: Vueltas en U
  answer: B
  explanation: El índice enumera los 'Carriles para vehículos de alta ocupación' como
    un subtema bajo 'Conducción en autopista' en el Capítulo 3.
- id: 9
  category: safe_driving_rules
  question: ¿En qué capítulo del Manual del Conductor de Nevada encontrará información
    sobre 'Niños y mascotas sin supervisión'?
  choices:
    A: Capítulo 1 - Cómo obtener su licencia de conducir de Nevada
    B: Capítulo 2 - Abróchese el cinturón
    C: Capítulo 3 - Conducir de forma segura
    D: Capítulo 4 - Condiciones especiales de conducción
  answer: B
  explanation: El índice muestra que 'Niños y mascotas sin supervisión' se encuentra
    en el Capítulo 2 - Abróchese el cinturón.
- id: 10
  category: driver_responsibility
  question: ¿Cuál es el propósito principal del Manual del Conductor de Nevada?
  choices:
    A: Proporcionar la redacción legal exacta de todas las leyes de tránsito
    B: Servir como una guía de defensa legal integral
    C: Proporcionar información sobre los conocimientos, habilidades, destrezas y
      actitudes necesarias para conducir de forma segura
    D: Reemplazar los Estatutos Revisados de Nevada
  answer: C
  explanation: 'La introducción establece: ''A medida que lea, encontrará información
    sobre los conocimientos, habilidades, destrezas y actitudes que necesita para
    conducir de forma segura''.'
- id: 11
  category: sharing_the_road
  question: ¿Cuál de los siguientes se enumera como un subtema bajo 'Rebasar a otro
    vehículo' en el Capítulo 3?
  choices:
    A: Rebasar a ciclistas
    B: Rebasar por el arcén (hombro)
    C: Rebasar en una zona escolar
    D: Rebasar vehículos de emergencia
  answer: A
  explanation: El índice del Capítulo 3 enumera 'Rebasar a ciclistas' y 'Rebasar vehículos
    estacionados' inmediatamente después de 'Rebasar a otro vehículo'.
- id: 12
  category: license_system
  question: ¿Dónde se encuentra la sede del Departamento de Vehículos Motorizados
    (DMV) de Nevada según el manual?
  choices:
    A: Las Vegas
    B: Reno
    C: Carson City
    D: Henderson
  answer: C
  explanation: La página del título indica la dirección del Departamento de Vehículos
    Motorizados como 555 Wright Way, Carson City, Nevada 89711-0400.
- id: 13
  category: license_system
  question: ¿Cuál de los siguientes temas se incluye en el Capítulo 1, 'Obtención
    de su licencia de conducir de Nevada'?
  choices:
    A: Sistemas de frenos antibloqueo (ABS)
    B: 'Trata de personas: ningún niño a la venta'
    C: Teléfonos celulares y mensajes de texto
    D: Semáforos de rampa (Ramp meters)
  answer: B
  explanation: 'El índice enumera ''Trata de personas: ningún niño a la venta'' bajo
    el Capítulo 1.'
- id: 14
  category: driver_responsibility
  question: ¿Qué establece el manual sobre su cobertura de las leyes de tránsito?
  choices:
    A: Proporciona la redacción exacta de todas las leyes de tránsito
    B: Analiza todas las leyes de tránsito en Nevada
    C: No proporciona la redacción exacta de las leyes de tránsito y no las analiza
      todas
    D: Es el único documento legalmente vinculante para las leyes de tránsito en Nevada
  answer: C
  explanation: 'La introducción establece explícitamente: ''Sin embargo, este manual
    no proporciona la redacción exacta de las leyes de tránsito y no las analiza todas''.'
- id: 15
  category: license_system
  question: ¿Cuántos días tienen los conductores que se mudan a Nevada desde otro
    estado para solicitar una licencia de conducir de Nevada?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Según el manual, los conductores que se mudan a Nevada desde otro estado
    deben solicitar una licencia dentro de los 30 días posteriores a convertirse en
    residentes.
- id: 16
  category: license_system
  question: ¿Cuál de las siguientes personas que viven o trabajan en Nevada NO está
    obligada a obtener una licencia de conducir de Nevada?
  choices:
    A: Un trabajador a tiempo parcial de otro estado
    B: Un miembro militar estacionado en Nevada
    C: Un estudiante universitario que acaba de establecer su residencia
    D: Un nuevo residente que se mudó desde un país extranjero
  answer: B
  explanation: El manual establece que se necesita una licencia de conducir de Nevada
    si vive o trabaja en Nevada, excluyendo a los empleados de estados fronterizos
    o a los miembros militares estacionados en Nevada.
- id: 17
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para solicitar una licencia de conducir
    de Nevada?
  choices:
    A: 15 años
    B: 15 años y medio
    C: 16 años
    D: 18 años
  answer: C
  explanation: Para obtener una licencia de Nevada, debe completar un formulario de
    solicitud, visitar una oficina del DMV de servicio completo y tener al menos 16
    años de edad.
- id: 18
  category: license_system
  question: ¿Para cuál de los siguientes documentos NO es necesario un número de Seguro
    Social para obtenerlo en Nevada?
  choices:
    A: Una licencia de conducir comercial (CDL)
    B: Una Tarjeta de Autorización de Conducir (DAC)
    C: Una licencia de conducir estándar
    D: Una licencia de motocicleta
  answer: B
  explanation: El manual establece explícitamente que no es necesario un número de
    Seguro Social para obtener una Tarjeta de Autorización de Conducir (DAC).
- id: 19
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir de Nevada por primera
    vez para personas menores de 65 años?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Una licencia de conducir de Nevada por primera vez emitida a personas
    menores de 65 años será válida por ocho años.
- id: 20
  category: license_system
  question: ¿Cuál es el período de validez de una licencia de conducir para personas
    de 65 años o más en Nevada?
  choices:
    A: 2 años
    B: 4 años
    C: 6 años
    D: 8 años
  answer: B
  explanation: Según el manual, las licencias de conducir para personas de 65 años
    o más son válidas por cuatro años.
- id: 21
  category: license_system
  question: ¿Por cuánto tiempo son válidas las tarjetas de identificación de Nevada?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: El manual establece que las tarjetas de identificación son válidas
    por ocho años.
- id: 22
  category: license_system
  question: Si presenta documentos de inmigración de duración limitada sin una fecha
    de salida proporcionada por el Departamento de Seguridad Nacional (DHS), ¿cuándo
    vencerá su licencia de conducir de Nevada?
  choices:
    A: En 1 año
    B: En 4 años
    C: En 8 años
    D: En su próximo cumpleaños
  answer: A
  explanation: Si se utilizan documentos de inmigración de duración limitada, el vencimiento
    de su licencia de conducir coincidirá con la fecha de salida verificada por el
    DHS, o un año si el DHS no proporciona ninguna fecha.
- id: 23
  category: driver_responsibility
  question: ¿Qué responsabilidad asume un cosignatario al firmar la solicitud de un
    conductor menor de 18 años?
  choices:
    A: Debe viajar en el asiento del pasajero en todo momento.
    B: Comparte la responsabilidad civil por cualquier daño causado por la negligencia
      o conducta dolosa del menor al conducir.
    C: Debe pagar el registro del vehículo del menor.
    D: Se le requiere realizar un examen escrito junto con el menor.
  answer: B
  explanation: Si es menor de 18 años, un cosignatario debe firmar su solicitud. El
    cosignatario comparte la responsabilidad civil por cualquier daño causado por
    la negligencia o conducta dolosa del menor al conducir.
- id: 24
  category: license_system
  question: ¿Cuántas licencias de conducir o tarjetas de identificación puede tener
    un residente de Nevada a la vez?
  choices:
    A: Una licencia de conducir y una tarjeta de identificación
    B: Solo una licencia de conducir o una tarjeta de identificación
    C: Hasta dos licencias de conducir de diferentes estados
    D: Una licencia comercial y una licencia estándar
  answer: B
  explanation: Un residente de Nevada puede tener solo una licencia de conducir o
    una tarjeta de identificación.
- id: 25
  category: license_system
  question: ¿Qué sucede con su licencia de conducir de otro estado cuando solicita
    una licencia de Nevada?
  choices:
    A: Es destruida por el DMV.
    B: Es enviada de vuelta a su estado anterior.
    C: Se le permite conservarla como una identificación secundaria válida.
    D: Debe ser entregada, anulada y luego devuelta a usted.
  answer: D
  explanation: Si tiene una licencia o tarjeta de identificación de otra jurisdicción,
    debe entregarla. Todas las licencias y tarjetas de identificación entregadas serán
    anuladas y devueltas a usted.
- id: 26
  category: driver_testing
  question: ¿Qué examen es obligatorio para todos los nuevos residentes que solicitan
    una licencia de conducir de Nevada, incluso si se exoneran otros exámenes?
  choices:
    A: Un examen de conocimientos por escrito
    B: Un examen de habilidades de conducción
    C: Un examen de la vista
    D: Un examen de audición
  answer: C
  explanation: Su visión será examinada cuando solicite su licencia de conducir de
    Nevada. Todos los demás exámenes pueden ser exonerados si se aplican ciertos criterios.
- id: 27
  category: driver_testing
  question: Para un nuevo residente de Nevada, los exámenes escritos y de conducción
    pueden ser exonerados si ha tenido menos de ¿cuántas infracciones de tránsito
    en movimiento en los últimos 4 años?
  choices:
    A: '1'
    B: '2'
    C: '3'
    D: '4'
  answer: C
  explanation: Todos los demás exámenes pueden ser exonerados si ha tenido menos de
    3 infracciones de tránsito en movimiento en los últimos 4 años.
- id: 28
  category: license_system
  question: ¿En qué día vence normalmente una licencia de conducir estándar de Nevada
    por primera vez?
  choices:
    A: En el aniversario de la fecha de emisión
    B: El 31 de diciembre del año de vencimiento
    C: En su cumpleaños
    D: Exactamente 8 años después de la fecha en que la solicitó
  answer: C
  explanation: Una licencia de conducir de Nevada por primera vez emitida a personas
    menores de 65 años será válida por ocho años y vence en su cumpleaños.
- id: 29
  category: license_system
  question: ¿Cuál de los siguientes NO figura explícitamente como un requisito para
    proporcionar prueba al solicitar una licencia de conducir de Nevada?
  choices:
    A: Nombre legal completo
    B: Residencia en Nevada
    C: Edad
    D: Diploma de escuela secundaria o equivalente
  answer: D
  explanation: Para obtener una licencia de Nevada, debe proporcionar prueba de su
    nombre legal completo, edad, Número de Seguro Social (si se le ha emitido) y residencia
    en Nevada. No se requiere un diploma de escuela secundaria.
- id: 30
  category: driver_testing
  question: ¿Bajo qué condición pueden exonerarse los exámenes de conducir (que no
    sean el examen de la vista) al solicitar una licencia de conducir de Nevada?
  choices:
    A: No ha tenido condenas por DUI en los últimos 7 años.
    B: Tiene al menos 18 años de edad.
    C: Ha tenido menos de 5 infracciones de tránsito en movimiento en los últimos
      4 años.
    D: Entrega un pasaporte extranjero.
  answer: A
  explanation: Los exámenes pueden ser exonerados si cumple con varios criterios,
    incluyendo no tener condenas por DUI en los últimos 7 años, tener 21 años o más,
    y tener menos de 3 infracciones de tránsito en movimiento en los últimos 4 años.
- id: 31
  category: license_system
  question: ¿Quién NO está obligado a obtener una licencia de conducir de Nevada para
    conducir en el estado?
  choices:
    A: Un nuevo residente que acaba de mudarse a Nevada permanentemente.
    B: Un miembro en servicio activo de las Fuerzas Armadas de los EE. UU. con una
      licencia válida de su estado de origen.
    C: Una persona cuya licencia de otro estado está actualmente suspendida.
    D: Un turista de 15 años de otro estado.
  answer: B
  explanation: No necesita una licencia de Nevada si es un miembro en servicio activo
    de las Fuerzas Armadas de los EE. UU. y tiene una licencia válida de su estado
    de origen.
- id: 32
  category: license_system
  question: Si su privilegio de conducir está actualmente suspendido o revocado en
    otro estado, ¿para qué puede calificar en Nevada?
  choices:
    A: Una licencia de conducir restringida de Nevada
    B: Un permiso de conducir temporal
    C: Una tarjeta de identificación
    D: Una Tarjeta de Autorización de Conducir (DAC)
  answer: C
  explanation: Si su privilegio de conducir está suspendido o revocado en otro estado,
    no se le permitirá obtener una licencia de Nevada hasta que se resuelva el problema,
    pero puede calificar para una tarjeta de identificación durante este período.
- id: 33
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para demostrar su Número
    de Seguro Social?
  choices:
    A: Un talón de pago escrito a mano
    B: Un formulario W-2 con su SSN completo
    C: Un certificado de nacimiento emitido por un hospital
    D: Una tarjeta de Medicare
  answer: B
  explanation: La evidencia aceptable de un Número de Seguro Social incluye una tarjeta
    de Seguro Social, un W-2 (con el SSN completo), el formulario 1099 del IRS o un
    talón de pago impreso con el nombre legal completo. Los talones de pago escritos
    a mano no son aceptables.
- id: 34
  category: license_system
  question: ¿Cómo se marca una licencia de conducir o tarjeta de identificación de
    Nevada que cumple con Real ID?
  choices:
    A: Con un holograma plateado del sello del estado
    B: Con un contorno dorado de Nevada y un recorte de estrella
    C: Con la frase 'FEDERAL ID APPROVED'
    D: Con un borde rojo alrededor de la fotografía
  answer: B
  explanation: Las licencias o tarjetas de identificación Real ID están marcadas con
    un contorno dorado de Nevada y un recorte de estrella, lo que indica que la tarjeta
    cumple con los estándares federales de identificación.
- id: 35
  category: license_system
  question: ¿Qué frase se marca en una licencia de conducir o tarjeta de identificación
    estándar de Nevada que no cumple con los estándares federales de identificación?
  choices:
    A: NOT FOR REAL ID PURPOSES
    B: STATE USE ONLY
    C: LIMITED TERM
    D: UNVERIFIED IDENTITY
  answer: A
  explanation: Las licencias o tarjetas de identificación estándar están marcadas
    con la frase 'NOT FOR REAL ID PURPOSES', lo que indica que la tarjeta no cumple
    con los estándares federales de identificación.
- id: 36
  category: license_system
  question: ¿Cuántos documentos que demuestren la residencia en Nevada deben presentar
    los solicitantes para cumplir con los requisitos de Real ID?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para cumplir con los nuevos requisitos de Real ID, los solicitantes
    deben presentar dos documentos que demuestren la residencia en Nevada, como facturas
    de servicios públicos o estados de cuenta bancarios.
- id: 37
  category: license_system
  question: ¿Por cuánto tiempo es válida una Tarjeta de Autorización de Conducir (DAC)
    de Nevada?
  choices:
    A: Dos años
    B: Cuatro años
    C: Seis años
    D: Ocho años
  answer: B
  explanation: Una Tarjeta de Autorización de Conducir es válida por cuatro años y
    vencerá en su cumpleaños.
- id: 38
  category: license_system
  question: ¿Cómo deben completarse todas las renovaciones y cambios de dirección
    para una Tarjeta de Autorización de Conducir (DAC)?
  choices:
    A: En línea a través del sitio web del DMV
    B: Enviando un formulario por correo al DMV
    C: Por teléfono
    D: En persona
  answer: D
  explanation: Para una Tarjeta de Autorización de Conducir, todas las renovaciones
    y cambios de dirección deben realizarse en persona.
- id: 39
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a una Tarjeta
    de Autorización de Conducir (DAC)?
  choices:
    A: Es válida para abordar aviones comerciales.
    B: Puede usarse para determinar la elegibilidad para beneficios estatales.
    C: No es válida para fines de identificación federal o estatal.
    D: Está marcada con un contorno dorado de Nevada y un recorte de estrella.
  answer: C
  explanation: Una Tarjeta de Autorización de Conducir no es válida para fines de
    identificación federal o estatal y no puede usarse para determinar la elegibilidad
    para ningún beneficio, licencia o servicio emitido o proporcionado por el Estado
    de Nevada.
- id: 40
  category: license_system
  question: ¿Qué se requiere si presenta un documento en un idioma extranjero al DMV
    de Nevada?
  choices:
    A: Debe ir acompañado de una traducción abstracta.
    B: Debe ser traducido al inglés por un traductor aprobado por el DMV.
    C: Debe ser notarizado por un consulado extranjero.
    D: Debe ser traducido por el solicitante.
  answer: B
  explanation: Cualquier documento en un idioma extranjero debe ser traducido correctamente
    al inglés por un traductor aprobado por el DMV antes de que pueda ser aceptado.
    No se aceptarán traducciones abstractas.
- id: 41
  category: license_system
  question: Si su nombre es diferente al que figura en su documento de identidad,
    ¿qué debe presentar?
  choices:
    A: Una carta escrita a mano que explique el cambio de nombre
    B: Una declaración jurada ante notario de un familiar
    C: Documentación legal, como un certificado de matrimonio o una orden judicial
    D: Una factura de servicios públicos que muestre su nuevo nombre
  answer: C
  explanation: Si su nombre es diferente, se le pedirá que presente documentación
    legal que refleje su cambio de nombre, como un certificado de matrimonio, una
    sentencia de divorcio, un certificado de defunción del cónyuge, un registro de
    adopción o una orden judicial.
- id: 42
  category: license_system
  question: ¿Cuántos documentos debe presentar un solicitante para demostrar su estado
    de residencia en Nevada?
  choices:
    A: Un documento original
    B: Dos copias originales o certificadas
    C: Tres copias originales o certificadas
    D: Cuatro documentos de cualquier tipo
  answer: B
  explanation: Cada solicitante debe presentar una copia original o certificada de
    dos documentos aprobados cualesquiera que reflejen una dirección residencial en
    Nevada para demostrar la residencia.
- id: 43
  category: driver_testing
  question: ¿Cuál es la tarifa para un examen inicial de conocimientos o de habilidades
    en Nevada?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $25.00
  answer: D
  explanation: Se cobra una tarifa de $25.00 por todos los exámenes iniciales de conocimientos
    y/o habilidades administrados.
- id: 44
  category: driver_testing
  question: ¿Qué resultará en una reprobación automática durante su examen de habilidades
    de conducción?
  choices:
    A: Usar los limpiaparabrisas
    B: Usar un teléfono celular
    C: Hacerle una pregunta al examinador
    D: Detenerse en una pendiente
  answer: B
  explanation: El manual establece que el uso de un teléfono celular durante un examen
    de conducción resultará en una reprobación automática.
- id: 45
  category: driver_testing
  question: ¿A quién se le permite viajar en el vehículo con usted durante su examen
    de carretera?
  choices:
    A: Un padre o tutor legal
    B: Un instructor de manejo con licencia
    C: Un traductor de idiomas
    D: No se permiten pasajeros ni animales
  answer: D
  explanation: No se permiten pasajeros ni animales en el vehículo durante el examen
    de carretera.
- id: 46
  category: driver_testing
  question: ¿Cuál de las siguientes funciones del vehículo NO se le permite usar durante
    su examen de conducción?
  choices:
    A: Luces direccionales
    B: Limpiaparabrisas
    C: Asistente de estacionamiento y control de crucero
    D: Frenos y faros delanteros
  answer: C
  explanation: Al realizar su examen de conducción, no se le permitirá utilizar ciertas
    funciones de seguridad como el asistente de estacionamiento, el control de crucero,
    etc.
- id: 47
  category: penalties_and_points
  question: 'Si es menor de 18 años, su licencia puede ser revocada por 185 días si
    una prueba indica que su concentración de alcohol en sangre (BAC) es:'
  choices:
    A: Al menos 0.01% pero menos de 0.05%
    B: Al menos 0.02% pero menos de 0.08%
    C: Al menos 0.04% pero menos de 0.10%
    D: Al menos 0.08% pero menos de 0.15%
  answer: B
  explanation: La licencia de un conductor joven puede ser revocada por 185 días si
    una prueba de sangre, aliento u orina indica al menos un 0.02% pero menos de un
    0.08% en peso de alcohol en la sangre.
- id: 48
  category: penalties_and_points
  question: ¿Cuál es la sanción por la primera infracción de un conductor joven por
    ausentismo escolar habitual?
  choices:
    A: Licencia suspendida por al menos 30 días pero no más de 6 meses
    B: Licencia suspendida por exactamente 1 año
    C: Licencia revocada por 185 días
    D: Licencia suspendida por hasta 2 años
  answer: A
  explanation: Por una primera infracción de ausentismo escolar habitual, la licencia
    de un conductor joven será suspendida por al menos 30 días pero no más de 6 meses,
    o se retrasará su emisión por 30 días.
- id: 49
  category: penalties_and_points
  question: 'Si un conductor menor de 18 años es declarado culpable de manejar o poseer
    un arma de fuego en violación de NRS 202.300 por primera vez, su licencia será:'
  choices:
    A: Suspendida por 30 días
    B: Revocada por 185 días
    C: Suspendida o su emisión retrasada por hasta un año
    D: Suspendida o su emisión retrasada por dos años
  answer: C
  explanation: Por una primera infracción de manejo o posesión de un arma de fuego
    en violación de NRS 202.300, su licencia será suspendida o su emisión se retrasará
    por hasta un año.
- id: 50
  category: driver_testing
  question: ¿Qué color de tinta se debe usar para completar el Registro de Experiencia
    del Conductor Principiante (Beginning Driver Experience Log)?
  choices:
    A: Tinta roja o negra
    B: Tinta azul o negra
    C: Solo lápiz
    D: Cualquier color de tinta
  answer: B
  explanation: El Registro de Experiencia del Conductor Principiante debe completarse
    con tinta azul o negra antes de llegar para su examen de conducción.
- id: 51
  category: license_system
  question: ¿Qué tan reciente debe ser la firma y la fecha en el formulario de Certificación
    de Asistencia DMV-301 al momento de presentarlo?
  choices:
    A: Dentro de los 14 días anteriores
    B: Dentro de los 30 días anteriores
    C: Dentro de los 60 días anteriores
    D: Dentro de los 90 días anteriores
  answer: C
  explanation: El formulario DMV-301 debe estar firmado y fechado dentro de los 60
    días anteriores a la fecha en que se presenta el formulario.
- id: 52
  category: driver_testing
  question: Si no se encuentra a menos de 30 millas de una escuela aprobada por el
    DMV y no puede acceder a internet, ¿cuántas horas de experiencia de conducción
    al volante debe completar?
  choices:
    A: 40 horas
    B: 50 horas
    C: 80 horas
    D: 100 horas
  answer: D
  explanation: Si no se encuentra a menos de 30 millas de una escuela aprobada por
    el DMV y no es posible acceder a internet, debe completar 100 horas de experiencia
    de conducción al volante.
- id: 53
  category: driver_testing
  question: Si está solicitando una licencia de motocicleta y debe completar las 100
    horas de experiencia de conducción, ¿cuál es la regla con respecto a conducir
    en la oscuridad?
  choices:
    A: Se deben completar 10 horas en la oscuridad.
    B: Se deben completar 20 horas en la oscuridad.
    C: La mitad de las horas se deben completar en la oscuridad.
    D: Las 100 horas deben completarse únicamente durante las horas de luz diurna.
  answer: D
  explanation: Si está solicitando una licencia de motocicleta, las 100 horas de experiencia
    de conducción deben completarse únicamente durante las horas de luz diurna.
- id: 54
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor menor de 18 años que sea declarado
    culpable de participar en una competencia de velocidad no autorizada?
  choices:
    A: Licencia suspendida por 30 días
    B: Licencia suspendida por 90 días
    C: Licencia suspendida por no menos de seis meses pero no más de dos años
    D: Licencia revocada permanentemente
  answer: C
  explanation: Su licencia puede ser suspendida por un período no menor de seis meses
    pero no mayor de dos años si es declarado culpable de participar en, u organizar,
    una competencia de velocidad no autorizada.
- id: 55
  category: driver_testing
  question: ¿De cuánto es la tarifa por cada reexamen de conocimientos o habilidades
    necesario antes de poder obtener su licencia?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $25.00
  answer: B
  explanation: Se cobra una tarifa de $10 por cada reexamen necesario antes de que
    pueda obtener su licencia.
- id: 56
  category: safe_driving_rules
  question: ¿Entre qué horas tiene prohibido un menor operar un vehículo motorizado,
    a menos que conduzca hacia o desde un evento programado?
  choices:
    A: 9 p.m. y 6 a.m.
    B: 10 p.m. y 5 a.m.
    C: 11 p.m. y 5 a.m.
    D: Medianoche y 6 a.m.
  answer: B
  explanation: El manual establece que un menor no debe operar un vehículo motorizado
    entre las 10 p.m. y las 5 a.m., a menos que conduzca hacia o desde un evento programado.
- id: 57
  category: license_system
  question: 'Durante los primeros 6 meses después de recibir su licencia de conducir,
    los conductores de 16 y 17 años no tienen permitido llevar pasajeros menores de
    18 años, EXCEPTO:'
  choices:
    A: Compañeros de clase de la escuela
    B: Miembros de la familia inmediata
    C: Compañeros de trabajo
    D: Pasajeros con una licencia de conducir válida
  answer: B
  explanation: A los solicitantes que tengan 16 o 17 años no se les permitirá llevar
    pasajeros menores de 18 años (excepto miembros de la familia inmediata) durante
    los primeros 6 meses que conduzcan.
- id: 58
  category: license_system
  question: 'Al conducir con un Permiso de Instrucción Clase C, debe estar acompañado
    por un conductor con licencia que esté sentado a su lado, tenga al menos un año
    de experiencia de conducción con licencia y tenga al menos:'
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: 19 años de edad
  answer: B
  explanation: Al conducir con un Permiso de Instrucción Clase C, debe estar acompañado
    por un conductor con licencia que tenga 21 años de edad o más, tenga al menos
    un año de experiencia de conducción con licencia y esté sentado a su lado.
- id: 59
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito para el conductor supervisor cuando
    usted conduce con un Permiso de Instrucción Clase M (Motocicleta)?
  choices:
    A: Debe seguirlo de cerca en un automóvil o camión.
    B: Debe viajar como pasajero en su motocicleta.
    C: Debe estar bajo supervisión visual directa mientras viaja en una motocicleta.
    D: Debe tener al menos 18 años con seis meses de experiencia de conducción.
  answer: C
  explanation: Debe estar bajo la supervisión visual directa de un conductor de motocicleta
    con licencia que viaje en una motocicleta y tenga 21 años de edad o más. El conductor
    supervisor no tiene permitido estar en un automóvil o camión.
- id: 60
  category: license_system
  question: ¿Qué clasificación de licencia de conducir le permite conducir un solo
    vehículo con una Clasificación de Peso Bruto Vehicular (GVWR) de más de 26,000
    libras y remolcar un vehículo de menos de 10,000 libras?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase M
  answer: B
  explanation: Una licencia Clase B le permite conducir un solo vehículo con una Clasificación
    de Peso Bruto Vehicular (GVWR) de más de 26,000 libras y puede remolcar un vehículo
    de menos de 10,000 libras.
- id: 61
  category: license_system
  question: ¿Qué indica la Restricción G en una licencia de conducir de Nevada?
  choices:
    A: El conductor debe usar anteojos o lentes de contacto
    B: Se requiere un examen de la vista anual
    C: Conducir únicamente durante el día
    D: Se requieren espejos retrovisores adicionales
  answer: C
  explanation: Según la lista de restricciones en el manual, la Restricción G significa
    'Conducir únicamente durante el día'.
- id: 62
  category: license_system
  question: Si usted tiene 18 años de edad o más, ¿por cuánto tiempo es válido un
    permiso de instrucción de motocicleta?
  choices:
    A: Seis meses
    B: Un año
    C: Dos años
    D: Cinco años
  answer: A
  explanation: Los permisos de instrucción de motocicleta emitidos a personas de 18
    años de edad o más son válidos por seis meses y pueden renovarse solo una vez
    cada cinco años.
- id: 63
  category: driver_testing
  question: ¿Cuál es la sanción por reprobar el examen de habilidades de motocicleta
    administrado por el DMV dos o más veces?
  choices:
    A: Un período de espera obligatorio de 30 días antes de volver a tomar el examen
    B: Denegación permanente de futuros permisos de instrucción de motocicleta
    C: Revocación de su licencia de conducir Clase C
    D: Finalización obligatoria de un curso de seguridad para motocicletas aprobado
  answer: B
  explanation: Reprobar el examen de habilidades de motocicleta administrado por el
    DMV dos o más veces resultará en una denegación permanente de futuros permisos
    de instrucción de motocicleta según NRS 483.280.
- id: 64
  category: driver_responsibility
  question: Antes de recibir una licencia de conducir, ¿durante cuántos meses deben
    los menores permanecer libres de choques con culpa, condenas por infracciones
    de tránsito y condenas por alcohol o drogas?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Los menores deben permanecer libres de choques con culpa, condenas
    por infracciones de tránsito y cualquier tipo de condena por alcohol o drogas
    durante seis meses antes de recibir una licencia de conducir.
- id: 65
  category: license_system
  question: ¿El Endoso F proporciona una exención de Licencia Comercial para cuál
    de los siguientes grupos?
  choices:
    A: Conductores de taxis y de servicios de transporte compartido
    B: Conductores de entrega que operan dentro de un radio de 50 millas
    C: Bomberos mientras operan equipo contra incendios
    D: Conductores que transportan cantidades de materiales peligrosos que requieren
      carteles
  answer: C
  explanation: El Endoso F es una exención de Licencia Comercial para bomberos mientras
    operan equipo contra incendios, agricultores bajo condiciones específicas y militares
    que conducen vehículos militares en servicio activo.
- id: 66
  category: vehicle_information
  question: Al conducir un vehículo Clase C, ¿la combinación del vehículo remolcador
    y el vehículo(s) remolcado(s) no puede exceder qué longitud máxima?
  choices:
    A: 50 pies
    B: 60 pies
    C: 70 pies
    D: 80 pies
  answer: C
  explanation: Bajo las secciones de Clase C y Endoso J, el manual establece que la
    combinación de vehículos no puede exceder los 70 pies de longitud.
- id: 67
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una restricción al conducir con un permiso
    de instrucción de motocicleta?
  choices:
    A: Solo puede conducir en autopistas de acceso limitado.
    B: Puede llevar un máximo de un pasajero.
    C: Puede conducir únicamente durante las horas del día.
    D: Debe conducir dentro de un radio de 30 millas de su hogar.
  answer: C
  explanation: Al conducir con un permiso de instrucción de motocicleta, puede conducir
    únicamente durante las horas del día. No puede llevar pasajeros ni conducir en
    autopistas u otras vías de alta velocidad.
- id: 68
  category: license_system
  question: ¿Un vehículo motorizado comercial requiere una Licencia de Conducir Comercial
    (CDL) si está diseñado para transportar a cuántos pasajeros, incluyendo al conductor?
  choices:
    A: 8 o más
    B: 10 o más
    C: 12 o más
    D: 16 o más
  answer: D
  explanation: Un vehículo motorizado comercial se define como aquel que tiene un
    GVWR/GCWR de 26,001 libras o más, está diseñado para transportar 16 o más pasajeros
    incluyendo al conductor, o transporta materiales peligrosos.
- id: 69
  category: license_system
  question: ¿Qué tipo de licencia de conducir se requiere para operar un ciclomotor
    (moped) en Nevada?
  choices:
    A: Solo es aceptable una licencia Clase M.
    B: Cualquier clasificación de licencia de conducir de Nevada.
    C: Una licencia Clase C con un Endoso J.
    D: Una Licencia de Conducir Comercial (CDL).
  answer: B
  explanation: 'El manual establece: ''Puede operar un ciclomotor si tiene una licencia
    de conducir de Nevada (de cualquier clasificación) o puede solicitar una licencia
    Clase M con una restricción acompañante que le permitirá operar únicamente un
    ciclomotor''.'
- id: 70
  category: license_system
  question: ¿De quién es la responsabilidad de renovar una licencia de conducir de
    Nevada en o antes de su fecha de vencimiento?
  choices:
    A: El DMV
    B: El conductor
    C: El servicio postal
    D: El departamento de policía local
  answer: B
  explanation: Aunque se envía un aviso de renovación por correo a la dirección registrada,
    es su responsabilidad renovarla en o antes de su fecha de vencimiento.
- id: 71
  category: license_system
  question: ¿Cómo maneja Nevada las fechas de vencimiento de la licencia de conducir
    para el personal militar?
  choices:
    A: Se extienden automáticamente por cinco años.
    B: Nunca vencen mientras estén en servicio activo.
    C: Nevada no extiende automáticamente la fecha de vencimiento.
    D: Se extienden hasta 30 días después de la baja del servicio.
  answer: C
  explanation: Nevada no extiende automáticamente la fecha de vencimiento de la licencia
    para el personal militar. El personal militar en servicio activo que se encuentre
    temporalmente fuera del estado puede renovarla por correo.
- id: 72
  category: license_system
  question: Según la ley de Nevada, ¿cuántos días tiene para notificar al DMV sobre
    un cambio de dirección o de nombre?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Según la ley de Nevada, usted está obligado a notificar al DMV cualquier
    cambio de dirección o de nombre en un plazo de 30 días.
- id: 73
  category: license_system
  question: Si posee una licencia de conducir comercial (CDL), ¿cómo debe completar
    un cambio de dirección?
  choices:
    A: En línea en el sitio web del DMV
    B: Enviando por correo el formulario DMV-22
    C: Por teléfono
    D: En persona
  answer: D
  explanation: Los cambios de dirección deben realizarse en persona si usted posee
    una licencia de conducir comercial (CDL).
- id: 74
  category: license_system
  question: ¿Cuál de los siguientes es necesario para cambiar su nombre en su licencia
    de conducir de Nevada?
  choices:
    A: Debe completar el cambio en línea.
    B: Debe enviar una solicitud por escrito al DMV.
    C: Debe realizar el cambio en persona en una oficina local del DMV.
    D: Debe esperar hasta que su licencia deba ser renovada.
  answer: C
  explanation: Los cambios de nombre deben realizarse en persona en una oficina local
    del DMV. Se le pedirá que complete una solicitud y proporcione la documentación
    legal aceptable.
- id: 75
  category: license_system
  question: ¿Bajo qué circunstancias especiales se podría emitir una licencia restringida
    a un joven de 14 o 15 años?
  choices:
    A: Si han mantenido un promedio de calificaciones (GPA) de 4.0
    B: Si han demostrado dificultades familiares o necesidad de conducir a la escuela
    C: Si están inscritos en un curso de educación vial
    D: Si tienen un empleo a tiempo parcial
  answer: B
  explanation: Se pueden emitir licencias restringidas, bajo circunstancias especiales,
    a conductores de 14 y 15 años que hayan demostrado dificultades familiares o que
    necesiten conducir hacia y desde la escuela.
- id: 76
  category: penalties_and_points
  question: 'Se puede emitir una licencia restringida a una persona cuya licencia
    esté suspendida o revocada si ha cumplido al menos:'
  choices:
    A: Una cuarta parte de su período de suspensión o revocación requerido.
    B: La mitad de su período de suspensión o revocación requerido.
    C: Tres cuartas partes de su período de suspensión o revocación requerido.
    D: 30 días de su período de suspensión o revocación requerido.
  answer: B
  explanation: Se pueden emitir licencias restringidas a personas que hayan cumplido
    la mitad de sus períodos de suspensión o revocación requeridos.
- id: 77
  category: license_system
  question: ¿Por cuánto tiempo es válida una tarjeta de identificación estándar de
    Nevada antes de que venza?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Una tarjeta de identificación de Nevada es válida por ocho años y vence
    en su cumpleaños, a menos que se presenten documentos de inmigración de duración
    limitada.
- id: 78
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener una tarjeta de identificación
    de Nevada?
  choices:
    A: 10 años
    B: 12 años
    C: 14 años
    D: 16 años
  answer: A
  explanation: Si desea una tarjeta de identificación de Nevada, debe tener al menos
    10 años de edad.
- id: 79
  category: penalties_and_points
  question: ¿Qué sucede si recibe 12 o más puntos de demérito en un período de 12
    meses mientras posee una tarjeta de identificación de Nevada?
  choices:
    A: Su tarjeta de identificación será revocada permanentemente.
    B: Se le requerirá restablecer sus privilegios de conducción antes de ser elegible
      para recibir una licencia de conducir.
    C: Se le multará con $1,000 y enfrentará tiempo en la cárcel.
    D: Los puntos de demérito se ignoran porque no posee una licencia de conducir.
  answer: B
  explanation: Si recibe 12 o más puntos de demérito en un período de 12 meses mientras
    posee una tarjeta de identificación, se le requerirá restablecer sus privilegios
    de conducción antes de ser elegible para recibir una licencia de conducir.
- id: 80
  category: driver_responsibility
  question: ¿Cómo puede un conductor agregar un indicador médico a su licencia de
    conducir o tarjeta de identificación de Nevada?
  choices:
    A: Informando verbalmente al empleado del DMV durante la renovación.
    B: Presentando un Informe Confidencial del Médico (Formulario del DMV DLD-7) completado.
    C: Mostrando un frasco de prescripción médica con su nombre.
    D: Pagando una tarifa adicional de $15 al momento de la emisión.
  answer: B
  explanation: Para agregar un indicador médico, debe presentar un Informe Confidencial
    del Médico (Formulario del DMV DLD-7) completado que indique uno de los códigos
    médicos que figuran en el formulario.
- id: 81
  category: driver_responsibility
  question: ¿Qué se requiere para que un menor de edad se convierta en donante de
    órganos en su licencia de conducir de Nevada?
  choices:
    A: Deben esperar hasta cumplir los 18 años.
    B: Un padre o tutor debe firmar una declaración jurada (affidavit) en la solicitud
      DMV-002.
    C: Deben pagar una tarifa de registro especial.
    D: Deben proporcionar una nota del médico que apruebe la donación.
  answer: B
  explanation: Los menores que deseen ser donantes de órganos pueden pedir que un
    padre o tutor firme una declaración jurada (affidavit) en la solicitud DMV-002
    indicando que el padre o tutor comprende que no puede enmendar ni revocar la donación.
- id: 82
  category: driver_responsibility
  question: Si usted es un donante de órganos registrado y lo llevan a un hospital
    por enfermedad o lesión, ¿cuál es la primera prioridad del personal médico?
  choices:
    A: Contactar al registro de donación de órganos.
    B: Salvar su vida.
    C: Notificar a su familia sobre su condición de donante.
    D: Prepararse para la extracción de órganos.
  answer: B
  explanation: Su vida siempre es lo primero. Si está enfermo o lesionado y lo llevan
    a un hospital, la prioridad es siempre salvar su vida.
- id: 83
  category: driver_responsibility
  question: ¿Cuál de las siguientes se menciona como una posible señal de alerta (red
    flag) de la trata de personas con fines de explotación sexual?
  choices:
    A: Viajar solo con exceso de equipaje
    B: No tener el control de sus propios documentos de identificación
    C: Pedir direcciones a la estación de policía más cercana
    D: Conducir un vehículo con placas de otro estado
  answer: B
  explanation: 'Las señales de alerta de la trata de personas con fines de explotación
    sexual incluyen: falta de conocimiento de su paradero, no tener el control de
    sus propios documentos de identificación (ID/pasaporte), comunicación restringida
    y una actitud temerosa o sumisa.'
- id: 84
  category: driver_responsibility
  question: ¿Qué debe hacer si sospecha que alguien es víctima de trata de personas?
  choices:
    A: Confrontar directamente al presunto traficante.
    B: Alertar a la víctima sobre sus sospechas.
    C: Intentar realizar un arresto ciudadano.
    D: Reportar la actividad sospechosa al Departamento de Seguridad Nacional de los
      EE. UU. (U.S. Department of Homeland Security) sin confrontar al traficante.
  answer: D
  explanation: No intente en ningún momento confrontar directamente a un presunto
    traficante ni alertar a una víctima de sus sospechas. Reporte la sospecha de trata
    de personas al Departamento de Seguridad Nacional de los EE. UU. (U.S. Department
    of Homeland Security).
- id: 85
  category: penalties_and_points
  question: ¿Cuál es la tarifa de reinstalación por una infracción relacionada con
    el alcohol o sustancias controladas, excluyendo la tarifa de la víctima?
  choices:
    A: $35.00
    B: $75.00
    C: $120.00
    D: $155.00
  answer: C
  explanation: El manual establece que la tarifa de reinstalación por una infracción
    relacionada con el alcohol o sustancias controladas es de $120.00 (con una tarifa
    adicional de $35.00 para la víctima).
- id: 86
  category: license_system
  question: ¿Cuánto cuesta cambiar únicamente su dirección en su licencia de conducir?
  choices:
    A: $3.25
    B: $8.25
    C: $10.00
    D: $17.25
  answer: A
  explanation: El programa de tarifas indica que un "Cambio de dirección únicamente"
    cuesta $3.25.
- id: 87
  category: vehicle_information
  question: Si su vehículo es un modelo de 1970 o más reciente, ¿qué tipo de cinturones
    de seguridad debe tener?
  choices:
    A: Cinturones de seguridad de tipo regazo solo para los pasajeros del asiento
      delantero
    B: Cinturones de seguridad de tipo regazo para cada pasajero y arneses de hombro
      para el asiento delantero
    C: Arneses de hombro para cada pasajero en el vehículo
    D: Cinturones de seguridad de tipo regazo solo para pasajeros menores de 18 años
  answer: B
  explanation: Si un vehículo es un modelo de 1970 o más reciente, debe tener cinturones
    de seguridad de tipo regazo para cada pasajero y arneses de hombro para su uso
    en el asiento delantero.
- id: 88
  category: safe_driving_rules
  question: ¿A qué edad se requiere que los pasajeros usen cinturones de seguridad
    si el vehículo está equipado con ellos, asumiendo que no requieren un sistema
    de retención infantil?
  choices:
    A: 4 años o más
    B: 6 años o más
    C: 8 años o más
    D: 12 años o más
  answer: B
  explanation: El manual establece que el conductor y cualquier pasajero de seis años
    o más deben usar cinturones de seguridad si el vehículo está equipado con ellos.
- id: 89
  category: safe_driving_rules
  question: 'Según la ley de Nevada, los niños deben estar en un sistema de retención
    infantil aprobado si:'
  choices:
    A: Tienen menos de 5 años y miden menos de 40 pulgadas de altura
    B: Tienen menos de 6 años y miden menos de 57 pulgadas de altura
    C: Tienen menos de 7 años y miden menos de 60 pulgadas de altura
    D: Tienen menos de 8 años y miden menos de 50 pulgadas de altura
  answer: B
  explanation: Los niños menores de seis años y aquellos que miden menos de 57 pulgadas
    de altura deben estar en un sistema de retención infantil aprobado de conformidad
    con NRS 484B.157.
- id: 90
  category: safe_driving_rules
  question: ¿Dónde y cómo debe asegurarse a un niño menor de dos años en un vehículo
    motorizado?
  choices:
    A: En un sistema de retención infantil orientado hacia adelante en el asiento
      trasero
    B: En un sistema de retención infantil orientado hacia atrás en el asiento trasero
    C: En un sistema de retención infantil orientado hacia atrás en el asiento delantero
    D: En un asiento elevado (booster seat) en el asiento trasero
  answer: B
  explanation: Los niños menores de dos años deben estar asegurados en un sistema
    de retención infantil orientado hacia atrás en el asiento trasero del vehículo
    motorizado.
- id: 91
  category: driver_responsibility
  question: 'Es ilegal dejar a un niño de 7 años o menos desatendido en un vehículo
    si existe un riesgo significativo, A MENOS que esté supervisado por una persona
    que tenga al menos:'
  choices:
    A: 10 años de edad
    B: 12 años de edad
    C: 14 años de edad
    D: 16 años de edad
  answer: B
  explanation: Nunca deje a un niño de 7 años o menos desatendido en un vehículo si
    las condiciones presentan un riesgo significativo, a menos que esté supervisado
    y a la vista de una persona de al menos 12 años de edad.
- id: 92
  category: driver_responsibility
  question: ¿Cuál es la clasificación legal para la infracción de dejar a un perro
    o gato desatendido en un vehículo durante períodos de calor o frío extremos?
  choices:
    A: Una infracción civil
    B: Un delito menor (misdemeanor)
    C: Un delito menor grave (gross misdemeanor)
    D: Un delito grave (felony)
  answer: B
  explanation: El manual señala que las violaciones de las leyes relativas a niños
    y mascotas desatendidos en vehículos son delitos menores (misdemeanors).
- id: 93
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una posible sanción por no sujetar adecuadamente
    a un niño menor de seis años que mide menos de 57 pulgadas?
  choices:
    A: Incautación del vehículo
    B: Tiempo de cárcel obligatorio
    C: Suspensión de su licencia de conducir
    D: Revocación permanente de su licencia de conducir
  answer: C
  explanation: No sujetar a niños menores de seis años y a aquellos que miden menos
    de 57 pulgadas puede resultar en multas, servicio comunitario y/o la suspensión
    de su licencia de conducir.
- id: 94
  category: defensive_driving
  question: ¿Por qué nunca se debe colocar a un bebé en el asiento delantero si el
    automóvil tiene una bolsa de aire (airbag) en el lado del pasajero?
  choices:
    A: La bolsa de aire puede explotar desde el tablero a 200 mph y chocar contra
      el asiento de seguridad
    B: El bebé bloqueará la vista del conductor del espejo lateral derecho
    C: La bolsa de aire no se desplegará si el asiento se echa demasiado hacia atrás
    D: Los asientos delanteros no tienen los anclajes adecuados para los asientos
      de seguridad para niños
  answer: A
  explanation: En un choque, la bolsa de aire explota desde el tablero a 200 mph,
    golpeando el asiento de seguridad y la parte posterior de la cabeza del bebé.
- id: 95
  category: safe_driving_rules
  question: Si un niño mayor debe viajar en el asiento delantero de un vehículo equipado
    con bolsas de aire (airbags), ¿qué debe hacer?
  choices:
    A: Desactivar la bolsa de aire del lado del pasajero
    B: Mover el asiento del vehículo lo más atrás posible
    C: Hacer que el niño se siente sobre un cojín grueso
    D: Usar solo el cinturón de regazo sin el arnés de hombro
  answer: B
  explanation: Los niños mayores pueden viajar en la parte delantera si es necesario,
    pero el asiento del vehículo debe moverse lo más atrás posible para proteger la
    cabeza del contacto con una bolsa de aire que se infla rápidamente.
- id: 96
  category: defensive_driving
  question: Según la sección 'Preparándose para conducir' (Getting Ready to Drive),
    ¿qué debe hacer antes de arrancar el motor?
  choices:
    A: Encender la radio para consultar las actualizaciones de tráfico
    B: Ajustar el asiento del conductor para mejorar la visibilidad
    C: Acelerar el motor para calentarlo
    D: Revisar la presión de los neumáticos
  answer: B
  explanation: Antes de arrancar el motor, debe ajustar el asiento del conductor para
    mejorar la visibilidad y para que todos los controles se puedan alcanzar cómodamente.
- id: 97
  category: penalties_and_points
  question: ¿Qué se requiere para restablecer una licencia suspendida, revocada o
    cancelada?
  choices:
    A: Pago de una tarifa de restablecimiento, la tarifa de la licencia original y
      las tarifas de examen correspondientes
    B: Pago de una tarifa de restablecimiento únicamente
    C: Completar un curso de conducción defensiva
    D: Una orden judicial de un juez
  answer: A
  explanation: Cualquier suspensión, revocación o cancelación de licencia requiere
    el pago de la tarifa de restablecimiento, la tarifa de una licencia original y
    cualquier tarifa de examen aplicable.
- id: 98
  category: driver_responsibility
  question: ¿Quién está autorizado a utilizar una fuerza razonable para rescatar a
    un perro o gato dejado desatendido en un vehículo durante temperaturas extremas?
  choices:
    A: Cualquier ciudadano preocupado
    B: Solo el dueño del vehículo
    C: Fuerzas del orden, bomberos y otros oficiales
    D: Solo voluntarios de refugios de animales
  answer: C
  explanation: Es ilegal dejar a un perro o gato desatendido en un vehículo durante
    períodos de calor o frío extremos. Las fuerzas del orden, los bomberos y otros
    oficiales pueden utilizar una fuerza razonable para rescatar al animal.
- id: 99
  category: vehicle_information
  question: ¿Cómo puede un conductor usar la 'prueba del centavo' (penny test) para
    verificar el desgaste de los neumáticos?
  choices:
    A: Colocar un centavo plano sobre la pared lateral del neumático.
    B: Colocar la cabeza de Lincoln en una de las ranuras.
    C: Dejar caer un centavo desde un pie por encima del neumático.
    D: Frotar el centavo contra la banda de rodadura para comprobar la fricción.
  answer: B
  explanation: Según el manual, para comprobar el desgaste mediante la prueba del
    centavo, debe seleccionar un punto donde la banda de rodadura parezca más baja
    y colocar la cabeza de Lincoln en una de las ranuras.
- id: 100
  category: vehicle_information
  question: ¿Dónde puede encontrar las libras por pulgada cuadrada (psi) recomendadas
    para los neumáticos de su vehículo?
  choices:
    A: Solo en la pared lateral del neumático.
    B: En el manual del propietario del vehículo o en el marco de la puerta del lado
      del conductor.
    C: En la columna del volante.
    D: Bajo el capó, en el bloque del motor.
  answer: B
  explanation: El manual indica que se debe verificar la presión de los neumáticos
    utilizando los psi recomendados que se encuentran en el manual del propietario
    del vehículo o en el marco de la puerta del lado del conductor del vehículo.
- id: 101
  category: signs_and_signals
  question: ¿Qué indica una señal de carretera de color marrón?
  choices:
    A: Servicios para el conductor, como comida y alojamiento.
    B: Advertencia de construcción o reparación de carreteras.
    C: Información sobre áreas recreativas y paisajísticas.
    D: Advertencia general.
  answer: C
  explanation: Los colores estándar de las señales dictan que el marrón significa
    información sobre áreas recreativas y paisajísticas.
- id: 102
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de tráfico con forma de banderín
    (pennant)?
  choices:
    A: Zona escolar.
    B: Ceder el paso.
    C: Prohibido adelantar.
    D: Cruce de ferrocarril más adelante.
  answer: C
  explanation: Según la sección de formas estándar, un banderín (que tiene forma de
    bandera) significa 'prohibido adelantar'.
- id: 103
  category: safe_driving_rules
  question: ¿Cómo debe proceder en una parada de cuatro vías (four-way stop)?
  choices:
    A: El vehículo más grande siempre tiene el derecho de paso.
    B: Permita que los vehículos que lleguen a la intersección antes que usted pasen
      primero.
    C: Proceda de inmediato sin detenerse si la intersección está despejada.
    D: Toque la bocina para indicar que usted pasará primero.
  answer: B
  explanation: 'El manual establece: ''En una parada de cuatro vías, espere a los
    otros vehículos que ya están en la intersección. Permita que los vehículos que
    lleguen a la intersección antes que usted pasen primero. ¡Espere su turno!'''
- id: 104
  category: sharing_the_road
  question: ¿Qué debe hacer cuando se le acerque un vehículo de emergencia que use
    sirena y luces rojas?
  choices:
    A: Detenerse inmediatamente en la intersección.
    B: Aumentar la velocidad para mantenerse delante del vehículo de emergencia.
    C: Conducir hacia el borde derecho de la carretera y detenerse.
    D: Moverse al carril izquierdo y reducir la velocidad.
  answer: C
  explanation: Debe conducir hacia el borde derecho de la carretera y detenerse hasta
    que el vehículo de emergencia haya pasado. Nunca debe detenerse en una intersección.
- id: 105
  category: penalties_and_points
  question: ¿Cuál es la consecuencia de las infracciones de tráfico en las zonas de
    obras?
  choices:
    A: Aumento de las multas de tráfico.
    B: Suspensión inmediata de la licencia.
    C: Servicio comunitario obligatorio.
    D: Confiscación del vehículo.
  answer: A
  explanation: El manual establece explícitamente que las infracciones en zonas de
    obras resultan en un aumento de las multas de tráfico.
- id: 106
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor al acercarse a una intersección donde los
    semáforos no funcionan?
  choices:
    A: Tratar la intersección como una señal de ceda el paso.
    B: Detenerse por completo antes de cruzar la intersección.
    C: Proceder al límite de velocidad normal si no hay otros autos visibles.
    D: Esperar a que llegue un oficial de policía antes de cruzar.
  answer: B
  explanation: Cuando los semáforos no funcionan, los conductores deben detenerse
    por completo antes de cruzar la intersección.
- id: 107
  category: signs_and_signals
  question: ¿Cuál es la respuesta adecuada ante una luz amarilla fija si ya se encuentra
    en la intersección?
  choices:
    A: Detenerse inmediatamente donde esté.
    B: Retroceder para salir de la intersección.
    C: Aumentar la velocidad para 'ganarle a la luz'.
    D: Continuar avanzando y despejar la intersección de manera segura.
  answer: D
  explanation: 'Si un conductor ya está en la intersección durante una luz amarilla
    fija, debe continuar avanzando y despejarla de manera segura. El manual advierte:
    ''NO aumente la velocidad para ganarle a la luz''.'
- id: 108
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente?
  choices:
    A: Proceder con precaución sin detenerse.
    B: Detenerse por completo, ya que tiene el mismo significado que una señal de
      alto (stop).
    C: Ceder el paso al tráfico que viene en sentido contrario pero no detenerse.
    D: El semáforo está a punto de ponerse en verde.
  answer: B
  explanation: Una luz roja intermitente significa que los conductores deben detenerse
    por completo. La señal tiene el mismo significado que una señal de alto (stop).
- id: 109
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente?
  choices:
    A: Los conductores deben ceder el paso al tráfico que viene en sentido contrario
      y a los peatones antes de completar el giro.
    B: Los conductores tienen un giro protegido y no necesitan ceder el paso.
    C: Los conductores no pueden realizar el movimiento indicado por la flecha.
    D: La señal está averiada y los conductores deben esperar a que la luz se ponga
      en verde.
  answer: A
  explanation: Una flecha amarilla intermitente significa que los conductores deben
    ceder el paso al tráfico que viene en sentido contrario y a los peatones. Pueden
    completar el giro cuando sea seguro hacerlo.
- id: 110
  category: safe_driving_rules
  question: ¿Bajo qué condición puede un conductor girar a la izquierda con luz roja?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de sentido único.
    B: Al girar desde una calle de sentido único hacia otra calle de sentido único
      que tenga el tráfico moviéndose hacia la izquierda.
    C: En cualquier intersección entre la medianoche y las 6 AM.
    D: Nunca se permite girar a la izquierda en rojo bajo ninguna circunstancia.
  answer: B
  explanation: Los conductores pueden girar a la izquierda con luz roja solo cuando
    giran desde una calle de sentido único hacia otra calle de sentido único que tenga
    el tráfico moviéndose hacia la izquierda.
- id: 111
  category: signs_and_signals
  question: ¿Qué forma se utiliza exclusivamente para zonas escolares y cruces escolares?
  choices:
    A: Octágono
    B: Diamante
    C: Pentágono
    D: Círculo
  answer: C
  explanation: Un pentágono (5 lados) es la forma estándar utilizada para zonas escolares
    y cruces escolares.
- id: 112
  category: safe_driving_rules
  question: Al acercarse a una señal de ceda el paso (yield), ¿qué debe hacer con
    respecto a los vehículos que realizan un giro en U desde una intersección?
  choices:
    A: Tocar la bocina para advertirles que usted va a avanzar.
    B: Cederles el derecho de paso.
    C: Avanzar primero, ya que los vehículos que giran en U deben ceder el paso a
      todo el tráfico.
    D: Detenerse y esperar a que la luz esté en verde.
  answer: B
  explanation: El manual establece que ante una señal de ceda el paso, usted debe
    'ceder el derecho de paso a los vehículos que realizan un giro en U desde una
    intersección'.
- id: 113
  category: sharing_the_road
  question: ¿Cómo debe responder un peatón ante una flecha verde de giro en una intersección?
  choices:
    A: Puede cruzar inmediatamente porque los vehículos deben cederle el paso.
    B: Debe cruzar rápidamente antes de que la flecha cambie a amarillo.
    C: No debe cruzar a menos que una señal peatonal o un oficial de policía se lo
      permita.
    D: Puede cruzar solo si se encuentra en un cruce peatonal marcado.
  answer: C
  explanation: 'El manual establece: ''Los peatones que se enfrenten a una flecha
    verde de giro no deben cruzar a menos que una señal peatonal o un oficial de policía
    se lo permita''.'
- id: 114
  category: signs_and_signals
  question: ¿Qué debe hacer un peatón si la señal de 'No cruzar' (Don't Walk) está
    parpadeando sin un temporizador de cuenta regresiva y aún no ha entrado en la
    calzada?
  choices:
    A: Avanzar rápidamente a través de la calzada.
    B: Ceder el paso a los vehículos y luego cruzar.
    C: No avanzar a través de la calzada.
    D: Cruzar solo si se encuentra en un cruce peatonal marcado.
  answer: C
  explanation: Según el manual, mientras la indicación de 'No cruzar' esté parpadeando
    pero no esté acompañada por un temporizador de cuenta regresiva, el peatón no
    puede avanzar a través de la calzada.
- id: 115
  category: safe_driving_rules
  question: Según el manual, ¿dónde ocurre la mayoría de las muertes de peatones?
  choices:
    A: En paradas de cuatro vías
    B: Entre intersecciones (a mitad de cuadra)
    C: En zonas escolares
    D: En cruces ferroviarios
  answer: B
  explanation: El manual señala que la mayoría de las muertes de peatones ocurren
    entre intersecciones (a mitad de cuadra).
- id: 116
  category: signs_and_signals
  question: ¿Cuál es el significado de las líneas blancas continuas cuando separan
    carriles de tráfico?
  choices:
    A: Separan el tráfico que se mueve en direcciones opuestas y se permite rebasar.
    B: Separan el tráfico que se mueve en la misma dirección y no se debe cambiar
      de carril ni rebasar.
    C: Indican un carril central de giro.
    D: Significan que puede rebasar cuando sea seguro hacerlo.
  answer: B
  explanation: Cuando las líneas blancas continuas separan carriles de tráfico que
    se mueven en la misma dirección, los conductores no deben cambiar de carril ni
    rebasar.
- id: 117
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima que un conductor puede recorrer en un carril
    central de giro antes de realizar un giro a la izquierda?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: C
  explanation: Los conductores no pueden recorrer más de 200 pies en un carril central
    de giro antes de realizar un giro a la izquierda.
- id: 118
  category: safe_driving_rules
  question: Si viene un tren y hay una señal de alto en el cruce ferroviario, ¿a qué
    distancia de las vías debe detenerse un conductor?
  choices:
    A: Al menos 5 pies
    B: Al menos 10 pies
    C: Al menos 15 pies
    D: Al menos 50 pies
  answer: C
  explanation: Si hay una señal de alto en el cruce y viene un tren, los conductores
    deben detenerse al menos a 15 pies de las vías.
- id: 119
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla que debe seguir al conducir a través
    de las vías del tren?
  choices:
    A: Siempre cambie a una marcha más baja mientras cruza.
    B: No cambie de marcha (velocidad) mientras cruza las vías.
    C: Deténgase en las vías para verificar si vienen trenes.
    D: Acelere rápidamente para cruzar lo más rápido posible.
  answer: B
  explanation: El manual establece explícitamente que no se deben cambiar las marchas
    o velocidades mientras se cruzan las vías del tren.
- id: 120
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener al estacionarse cerca del
    riel más cercano de un ferrocarril?
  choices:
    A: 15 pies
    B: 25 pies
    C: 50 pies
    D: 100 pies
  answer: C
  explanation: Nunca debe estacionarse a menos de 50 pies del riel más cercano de
    un ferrocarril.
- id: 121
  category: penalties_and_points
  question: ¿Cuál es la sanción en Nevada por desobedecer las indicaciones de un guardia
    de cruce escolar?
  choices:
    A: Una advertencia por la primera infracción
    B: Un delito menor (misdemeanor)
    C: Un delito grave (felony)
    D: Una suspensión de la licencia por 30 días
  answer: B
  explanation: Desobedecer las indicaciones de un guardia de cruce escolar es un delito
    menor (misdemeanor) en Nevada.
- id: 122
  category: safe_driving_rules
  question: ¿Bajo qué condición se permite dar una vuelta en U en una zona escolar
    en Nevada?
  choices:
    A: Cuando hay niños presentes pero en la acera
    B: Cuando el guardia de cruce le indica que pase
    C: En un día en que no hay clases
    D: Durante la media hora antes de que comiencen las clases
  answer: C
  explanation: La ley de Nevada prohíbe las vueltas en U en una zona escolar, excepto
    cuando no hay niños presentes, es un día en que no hay clases, fuera de las horas
    escolares designadas o cuando las señales indican que la zona no está en vigor.
- id: 123
  category: driver_responsibility
  question: ¿Cuál es la causa principal de choques en Nevada?
  choices:
    A: Exceso de velocidad
    B: Conducir bajo la influencia
    C: Conducción distraída
    D: No ceder el paso
  answer: D
  explanation: El manual establece que no ceder el paso es la causa principal de choques
    en Nevada.
- id: 124
  category: safe_driving_rules
  question: En una intersección donde no hay señales de tráfico ni semáforos, ¿qué
    vehículo debería pasar primero por lo general?
  choices:
    A: El vehículo a su izquierda
    B: El vehículo a su derecha
    C: El vehículo que viaja más rápido
    D: El vehículo que gira a la izquierda
  answer: B
  explanation: En una intersección donde no hay señales de tráfico ni semáforos, el
    vehículo a su derecha generalmente debe pasar primero.
- id: 125
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando un vehículo de emergencia que se aproxima desde
    cualquier dirección hace sonar una sirena o utiliza luces intermitentes?
  choices:
    A: Detenerse inmediatamente en su carril actual.
    B: Acelerar para despejar la intersección rápidamente.
    C: Conducir hacia el lado derecho de la carretera, fuera de cualquier intersección,
      y detenerse.
    D: Entrar en el carril central de giro y reducir la velocidad.
  answer: C
  explanation: Debe conducir inmediatamente hacia el lado derecho de la carretera,
    fuera de cualquier intersección, y detenerse hasta que el vehículo de emergencia
    haya pasado.
- id: 126
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en una carretera cuando va a pie y utiliza
    un perro guía o lleva un bastón blanco?
  choices:
    A: Solo los peatones en un cruce peatonal marcado
    B: Una persona ciega o con discapacidad visual
    C: Los vehículos que viajan al límite de velocidad indicado
    D: Solo los vehículos de emergencia
  answer: B
  explanation: Una persona ciega o con discapacidad visual, que va a pie y utiliza
    un perro guía o lleva un bastón blanco, tiene el derecho de paso en una carretera.
- id: 127
  category: safe_driving_rules
  question: Si está girando a la izquierda en una intersección, ¿cómo se aplican las
    reglas de derecho de paso a un vehículo que va recto y que ya está en la intersección?
  choices:
    A: Usted tiene el derecho de paso porque está girando.
    B: El vehículo que va recto tiene el derecho de paso.
    C: El vehículo de la izquierda siempre tiene el derecho de paso.
    D: Quien haya entrado más rápido en la intersección tiene el derecho de paso.
  answer: B
  explanation: Un vehículo que va recto y que ya está en la intersección tiene el
    derecho de paso sobre uno que gira a la izquierda.
- id: 128
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor al encontrarse con una persona ciega que
    utiliza un bastón blanco o un perro guía en la carretera?
  choices:
    A: Tocar la bocina para avisarles que usted está allí
    B: Ceder el derecho de paso y detenerse por completo si es necesario
    C: Conducir a su alrededor lentamente
    D: Continuar al límite de velocidad normal
  answer: B
  explanation: Según el manual, un conductor debe ceder el derecho de paso, detenerse
    por completo si es necesario y tomar precauciones para evitar un choque al encontrarse
    con una persona ciega o con discapacidad visual que utilice un perro guía o un
    bastón blanco.
- id: 129
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en zonas comerciales y residenciales en
    Nevada, a menos que se indique lo contrario?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El manual establece que el límite de velocidad es de 25 mph en zonas
    comerciales y residenciales y en zonas escolares.
- id: 130
  category: safe_driving_rules
  question: Bajo la Regla Básica de conducción de Nevada, ¿qué significa una velocidad
    'razonable o adecuada'?
  choices:
    A: Puede conducir hasta 10 mph por encima del límite de velocidad si el clima
      está despejado.
    B: Siempre debe conducir exactamente al límite de velocidad indicado.
    C: Debe considerar el tráfico, el clima, la visibilidad y las condiciones de la
      carretera además de los límites indicados.
    D: Debe conducir a la velocidad del vehículo más rápido en la carretera.
  answer: C
  explanation: La Regla Básica de Nevada significa que, además de los límites de velocidad
    indicados, los conductores deben considerar la cantidad de tráfico, el clima,
    la visibilidad, las condiciones de la superficie de la carretera y el tipo de
    carretera.
- id: 131
  category: safe_driving_rules
  question: ¿Qué debe hacer si conduce más lento que el resto del tráfico en una carretera
    con dos o más carriles que circulan en la misma dirección?
  choices:
    A: Moverse a la derecha y permitir que otros conductores pasen.
    B: Permanecer en el carril izquierdo para controlar el flujo del tráfico.
    C: Encender las luces de emergencia y mantener su carril.
    D: Acelerar para igualar la velocidad del vehículo más rápido.
  answer: A
  explanation: El manual establece que cuando hay dos o más carriles de tráfico circulando
    en la misma dirección, el tráfico más lento debe moverse a la derecha y permitir
    que otros conductores pasen.
- id: 132
  category: safe_driving_rules
  question: Al entrar en una autopista utilizando un carril de incorporación o de
    aceleración, ¿qué debe hacer?
  choices:
    A: Detenerse al final de la rampa y esperar un espacio en el tráfico.
    B: Acelerar hasta alcanzar o acercarse a la velocidad del tráfico de la autopista
      y buscar un espacio.
    C: Conducir despacio hasta estar completamente en el carril derecho.
    D: Esperar que el tráfico de la autopista le ceda el paso.
  answer: B
  explanation: Al entrar en una autopista, debe usar el carril de incorporación o
    aceleración para buscar un espacio, usar su señal de giro y acelerar hasta alcanzar
    o acercarse a la velocidad del tráfico de la autopista. No debe detenerse antes
    de incorporarse a menos que sea necesario.
- id: 133
  category: defensive_driving
  question: ¿A qué distancia hacia adelante debe mirar en la carretera cuando conduce
    por una autopista?
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: De 45 a 60 segundos
  answer: C
  explanation: El manual aconseja a los conductores mantenerse alerta y mirar mucho
    más adelante en la carretera en las autopistas, al menos de 20 a 30 segundos.
- id: 134
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor cuando una entrada a la autopista está equipada
    con un semáforo de rampa (ramp meter) activo?
  choices:
    A: Tratarlo como una señal de ceda el paso e incorporarse sin detenerse.
    B: Avanzar hasta la línea de parada, detenerse ante la luz roja y esperar a la
      luz verde.
    C: Detenerse solo si hay tráfico aproximándose por el carril derecho.
    D: Evitar el semáforo conduciendo por el arcén (hombro).
  answer: B
  explanation: Si una entrada de autopista tiene los semáforos de rampa encendidos,
    debe avanzar hasta la línea de parada, detenerse ante la luz roja, esperar a la
    luz verde y luego continuar.
- id: 135
  category: safe_driving_rules
  question: ¿Cuál de los siguientes vehículos tiene permitido usar un carril de derivación
    de semáforo de rampa para vehículos de alta ocupación (HOV) sin detenerse?
  choices:
    A: Un automóvil eléctrico con un solo ocupante
    B: Un vehículo de viaje compartido (carpool) con dos o más personas
    C: Un camión con dos o más ejes
    D: Un taxi con un solo ocupante
  answer: B
  explanation: Si viaja en un vehículo compartido de dos o más personas, puede usar
    el carril de derivación del semáforo de rampa HOV sin detenerse.
- id: 136
  category: signs_and_signals
  question: ¿Qué indica una X amarilla con la palabra 'MERGE' (incorporarse) en una
    señal de control de uso de carril?
  choices:
    A: El carril está abierto y puede conducir al límite de velocidad indicado.
    B: Puede usar el carril pero debe tener precaución debido al tráfico lento.
    C: El carril está terminando y debe prepararse para incorporarse de manera segura
      a otro carril abierto.
    D: El carril está cerrado y no puede conducir en él bajo ninguna circunstancia.
  answer: C
  explanation: Una X amarilla con MERGE significa que el carril está terminando y
    el conductor debe prepararse para incorporarse de manera segura a otro carril
    abierto.
- id: 137
  category: signs_and_signals
  question: ¿Qué acción debe tomar si ve una X roja con la palabra 'CLOSED' (cerrado)
    sobre su carril?
  choices:
    A: Reducir la velocidad y proceder con precaución.
    B: Detenerse inmediatamente en el carril.
    C: Incorporarse de manera segura a otro carril abierto porque no puede conducir
      en el carril cerrado.
    D: Aumentar su velocidad para pasar rápidamente la sección cerrada.
  answer: C
  explanation: Una X roja con CLOSED significa que los conductores no pueden circular
    por el carril debajo de la X roja. Por la seguridad del conductor y la de los
    demás, los conductores deben incorporarse de manera segura a otro carril abierto.
- id: 138
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los carriles
    para vehículos de alta ocupación (HOV) en Nevada?
  choices:
    A: Las mascotas cuentan para el requisito de más de 2 personas.
    B: Las motocicletas son elegibles para usar el carril incluso con una sola persona.
    C: Los autos eléctricos con una sola persona siempre son elegibles.
    D: Los camiones con 2 o más ejes son elegibles si llevan 2 o más personas.
  answer: B
  explanation: Las reglas de los carriles HOV establecen que las motocicletas son
    elegibles (incluso con 1 persona). Las mascotas no cuentan, los autos eléctricos
    necesitan 2 o más personas y los camiones con 2 o más ejes no son elegibles incluso
    con 2 o más personas.
- id: 139
  category: penalties_and_points
  question: ¿Cuál es la multa por violar las reglas del carril para vehículos de alta
    ocupación (HOV) en Nevada?
  choices:
    A: $100
    B: $150
    C: $250
    D: $500
  answer: C
  explanation: El manual indica que la multa por una infracción en el carril HOV es
    de $250.
- id: 140
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad típico en las autopistas interestatales
    rurales en Nevada?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70+ mph
    D: 80 mph
  answer: C
  explanation: El manual enumera '70+ mph' como el ejemplo de límite de velocidad
    para las autopistas interestatales rurales en Nevada.
- id: 141
  category: safe_driving_rules
  question: Al conducir en una autopista con varios carriles en cada dirección, ¿para
    qué está destinado el carril del extremo izquierdo?
  choices:
    A: Tráfico más lento
    B: Tráfico más rápido
    C: Tráfico que se incorpora
    D: Tráfico que sale
  answer: B
  explanation: En las autopistas con varios carriles en cada dirección, los conductores
    deben dejar el carril del extremo izquierdo para el tráfico más rápido.
- id: 142
  category: signs_and_signals
  question: ¿Qué significa una flecha verde hacia abajo con la palabra 'OPEN' en una
    señal de control de carril de autopista?
  choices:
    A: Los conductores deben salir de la autopista desde este carril.
    B: Los conductores pueden circular al límite de velocidad indicado en el carril
      debajo de la flecha.
    C: El carril está reservado únicamente para vehículos de alta ocupación (HOV).
    D: Los conductores deben reducir la velocidad y prepararse para incorporarse a
      la derecha.
  answer: B
  explanation: Una flecha verde hacia abajo con la palabra OPEN significa que los
    conductores pueden circular al límite de velocidad indicado en el carril debajo
    de la flecha verde.
- id: 143
  category: signs_and_signals
  question: ¿Qué indica una línea blanca continua doble al conducir cerca de un carril
    para viajes compartidos (HOV)?
  choices:
    A: Puede entrar o salir del carril para viajes compartidos en cualquier momento.
    B: No puede cruzar las líneas para entrar o salir del carril para viajes compartidos.
    C: El carril para viajes compartidos está actualmente cerrado a todo el tráfico.
    D: Solo las motocicletas y los vehículos de emergencia pueden cruzar las líneas.
  answer: B
  explanation: Según el manual, una línea blanca continua doble significa que no se
    pueden cruzar las líneas para entrar o salir del carril para viajes compartidos
    (carpool).
- id: 144
  category: safe_driving_rules
  question: ¿Cuál de los siguientes vehículos NO es elegible para usar un carril HOV
    (viajes compartidos)?
  choices:
    A: Una motocicleta
    B: Un vehículo de emergencia respondiendo a una emergencia
    C: Un vehículo de pasajeros con 3 personas
    D: Un vehículo con más de 2 ejes
  answer: D
  explanation: Las reglas de los carriles HOV establecen que los vehículos con más
    de 2 ejes (o combinaciones de vehículo y remolque) no son elegibles para usarlos.
- id: 145
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su rampa de salida de la autopista?
  choices:
    A: Detenerse en el arcén y retroceder con cuidado hasta la salida.
    B: Hacer un giro en U en el siguiente cruce de mediana disponible.
    C: Ir a la siguiente salida, volver a entrar en la autopista en la dirección opuesta
      y regresar a la salida.
    D: Detenerse en el carril derecho y esperar un hueco en el tráfico antes de retroceder.
  answer: C
  explanation: 'El manual establece explícitamente: ''Si se pasa de la rampa de salida,
    nunca dé la vuelta ni retroceda. Vaya a la siguiente salida, vuelva a entrar en
    la autopista en la dirección opuesta y regrese a la salida''.'
- id: 146
  category: vehicle_information
  question: ¿Cómo debe utilizar correctamente los frenos antibloqueo (ABS) en las
    cuatro ruedas en una situación de emergencia?
  choices:
    A: Bombear los frenos rápidamente para evitar derrapes.
    B: Presionar el pedal del freno con fuerza, mantenerlo presionado firmemente y
      maniobrar.
    C: Presionar el pedal del freno ligeramente y aplicar el freno de mano.
    D: Girar el volante con fuerza en una dirección mientras frena.
  answer: B
  explanation: Para el ABS en las cuatro ruedas, el manual instruye a los conductores
    a 'presionar el pedal del freno con fuerza, mantenerlo presionado firmemente y
    maniobrar en la dirección en la que desea que vaya el automóvil'.
- id: 147
  category: vehicle_information
  question: ¿Qué sucederá si bombea los frenos en un vehículo equipado con un sistema
    de frenos antibloqueo (ABS)?
  choices:
    A: El vehículo se detendrá mucho más rápido.
    B: Desactivará o 'apagará' el ABS.
    C: El volante se bloqueará.
    D: Las ruedas traseras derraparán lateralmente.
  answer: B
  explanation: Los conductores deben saber que dejar de presionar constantemente el
    pedal del freno o bombear los frenos desactivará, o 'apagará', el ABS.
- id: 148
  category: defensive_driving
  question: ¿Cuál es el tipo de choque número uno en las calles y autopistas de Nevada?
  choices:
    A: Colisiones frontales
    B: Colisiones por raspado lateral
    C: Colisiones por alcance (traseras)
    D: Colisiones laterales en intersecciones (tipo T)
  answer: C
  explanation: El manual establece que la colisión por alcance (trasera) es el tipo
    de choque número uno en las calles y autopistas de Nevada.
- id: 149
  category: safe_driving_rules
  question: Según los estudios de seguridad vial, ¿cuál es el tiempo de reacción normal
    de un conductor?
  choices:
    A: 0.5 a 1 segundo
    B: 1 a 1.5 segundos
    C: 2 a 2.5 segundos
    D: 3 a 4 segundos
  answer: C
  explanation: Los estudios de seguridad vial muestran que los tiempos de reacción
    normales son de 2 a 2.5 segundos.
- id: 150
  category: safe_driving_rules
  question: Si duplica su velocidad de 30 mph a 60 mph, ¿cómo cambia su distancia
    de frenado?
  choices:
    A: Se mantiene igual.
    B: Se vuelve el doble de larga.
    C: Se vuelve tres veces más larga.
    D: Se vuelve cuatro veces más larga.
  answer: D
  explanation: El punto más importante que cualquier conductor debe recordar es que
    si duplica su velocidad, su distancia de frenado no se vuelve el doble de larga;
    se vuelve cuatro veces más larga.
- id: 151
  category: defensive_driving
  question: ¿A qué velocidades la mayoría de los autos comienzan a perder tracción
    e hidroplanear (hydroplane) en condiciones de lluvia intensa?
  choices:
    A: Entre 15 y 25 mph
    B: Entre 25 y 35 mph
    C: Entre 35 y 55 mph
    D: Entre 55 y 75 mph
  answer: C
  explanation: La mayoría de los autos comenzarán a perder tracción e hidroplanear
    a velocidades de entre 35 y 55 mph en condiciones de lluvia intensa.
- id: 152
  category: defensive_driving
  question: ¿Qué tan adelante debe mirar cuando conduce a velocidades de autopista?
  choices:
    A: Al menos de 5 a 10 segundos
    B: Al menos 12 segundos
    C: Al menos de 20 a 30 segundos
    D: Al menos 45 segundos
  answer: C
  explanation: Cuando conduce a velocidades de autopista, debe mirar hacia adelante
    al menos de 20 a 30 segundos.
- id: 153
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento mínima recomendada si conduce a 40
    mph o menos?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Cuatro segundos
    D: Siete segundos
  answer: B
  explanation: Si conduce a 40 mph o menos, manténgase al menos dos segundos detrás
    del vehículo que está delante de usted. Esta es la distancia de seguimiento mínima.
- id: 154
  category: defensive_driving
  question: ¿En qué orden debe mirar al acercarse a una intersección?
  choices:
    A: Derecha, izquierda y derecha otra vez
    B: Izquierda, derecha y hacia adelante
    C: Izquierda, derecha e izquierda otra vez
    D: Hacia adelante, izquierda y derecha
  answer: C
  explanation: Al acercarse a una intersección, debe mirar a la izquierda, a la derecha
    y a la izquierda otra vez justo antes de entrar en la intersección.
- id: 155
  category: driver_responsibility
  question: ¿Cuándo está permitido usar un teléfono celular de mano para reportar
    una emergencia mientras conduce?
  choices:
    A: En cualquier momento, siempre que conduzca por debajo del límite de velocidad.
    B: Solo si detener el vehículo no fuera aconsejable, práctico o fuera peligroso.
    C: Solo cuando se conduce por el carril derecho.
    D: No está permitido en ninguna circunstancia.
  answer: B
  explanation: Puede usar el dispositivo para reportar una emergencia si detener el
    vehículo no fuera aconsejable, práctico o fuera peligroso.
- id: 156
  category: vehicle_information
  question: ¿Cómo sabe si su sistema de frenos antibloqueo (ABS) NO está funcionando?
  choices:
    A: El pedal del freno se siente inusualmente blando al presionarlo.
    B: El vehículo se desvía hacia un lado al frenar.
    C: El símbolo de ABS permanece encendido en el tablero mucho después de haber
      arrancado el auto.
    D: El volante vibra al arrancar el motor.
  answer: C
  explanation: Sabrá que su ABS no está funcionando si el símbolo de ABS permanece
    encendido en el tablero mucho después de haber arrancado el auto.
- id: 157
  category: safe_driving_rules
  question: ¿Qué tres cosas deben ocurrir para detener su vehículo?
  choices:
    A: Percepción, reacción y frenado
    B: Aceleración, desaceleración y frenado
    C: Observación, señalización y frenado
    D: Percepción, dirección y frenado
  answer: A
  explanation: 'Para detener su vehículo, deben ocurrir tres cosas: ver el motivo
    para detenerse (percepción), enviar el mensaje a su pie (reacción) y presionar
    el pedal del freno (frenado).'
- id: 158
  category: safe_driving_rules
  question: ¿Qué debe hacer si un oficial de la ley lo detiene por la noche?
  choices:
    A: Salir del vehículo inmediatamente para hablar con el oficial
    B: Apagar las luces delanteras y esperar en la oscuridad
    C: Encender la luz interior para ayudar a una buena comunicación
    D: Buscar en la guantera para sacar su registro
  answer: C
  explanation: El manual establece que si lo detienen por la noche, debe encender
    la luz interior porque una buena iluminación ayuda a una buena comunicación.
- id: 159
  category: driver_responsibility
  question: Cuando lo detiene un oficial de la ley, ¿dónde debe mantener las manos?
  choices:
    A: En su regazo o en los bolsillos
    B: A la vista en todo momento, preferiblemente en el volante
    C: Apoyadas en el marco de la ventana
    D: Detrás de su cabeza
  answer: B
  explanation: Se instruye a los conductores a mantener las manos a la vista en todo
    momento (preferiblemente en el volante) y abstenerse de realizar movimientos bruscos.
- id: 160
  category: safe_driving_rules
  question: ¿En qué dirección se mueve todo el tráfico alrededor de una rotonda?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: Tanto en el sentido de las agujas del reloj como en sentido contrario
    D: Directo a través de la isla central
  answer: B
  explanation: 'Según el manual, todo el tráfico se mueve en UNA DIRECCIÓN alrededor
    de la rotonda: en SENTIDO CONTRARIO A LAS AGUJAS DEL RELOJ.'
- id: 161
  category: vehicle_information
  question: ¿A quién se le permite utilizar el delantal para camiones (truck apron)
    provisto alrededor de la isla central de una rotonda?
  choices:
    A: Automóviles que rebasan el tráfico más lento
    B: Ciclistas que no se sienten cómodos en el carril principal
    C: Camiones comerciales grandes y remolques
    D: Peatones que cruzan la intersección
  answer: C
  explanation: El manual especifica que los camiones comerciales grandes y los remolques
    tienen permitido usar el delantal para camiones para maniobrar en el radio de
    giro cerrado, y que los automóviles no deben usarlo.
- id: 162
  category: sharing_the_road
  question: ¿Por dónde deben caminar los peatones al navegar por una rotonda?
  choices:
    A: A través de la isla central
    B: En la calzada circular junto con los vehículos
    C: En el pavimento elevado del delantal para camiones
    D: Permanecer siempre en los pasos de peatones designados
  answer: D
  explanation: El manual establece explícitamente que los peatones deben 'permanecer
    siempre en los pasos de peatones designados' y 'nunca cruzar hacia la isla central'.
- id: 163
  category: signs_and_signals
  question: Si las señales de giro de su vehículo están temporalmente fuera de servicio,
    ¿cuál es la señal manual adecuada para un giro a la derecha?
  choices:
    A: Extender el brazo izquierdo horizontalmente hacia afuera de la ventana abierta
    B: Extender el brazo izquierdo hacia abajo, con la palma de la mano hacia atrás
    C: Extender el brazo izquierdo con el codo doblado hacia arriba en un ángulo de
      aproximadamente 90 grados
    D: Extender el brazo derecho horizontalmente hacia afuera de la ventana del pasajero
  answer: C
  explanation: El manual indica que la señal manual para un giro a la derecha es extender
    el brazo izquierdo con el codo doblado hacia arriba en un ángulo de aproximadamente
    90 grados.
- id: 164
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalar su giro en carreteras abiertas?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: D
  explanation: Los conductores deben señalar su giro al menos 100 pies antes en calles
    de la ciudad o 300 pies (30 largos de vehículo) en carreteras abiertas.
- id: 165
  category: defensive_driving
  question: Al esperar para realizar un giro a la izquierda, ¿cómo debe posicionar
    las ruedas de su vehículo?
  choices:
    A: Apuntando hacia adelante hasta que comience a completar el giro realmente
    B: Giradas ligeramente hacia la izquierda para prepararse para el giro
    C: Giradas ligeramente hacia la derecha para evitar el tráfico que viene de frente
    D: Apuntando hacia el bordillo más cercano
  answer: A
  explanation: 'El manual instruye: ''Al girar a la izquierda, mantenga las ruedas
    apuntando hacia adelante hasta que comience a completar el giro realmente''.'
- id: 166
  category: safe_driving_rules
  question: ¿En cuál de los siguientes lugares es ilegal realizar un giro en U?
  choices:
    A: A través de una línea amarilla doble cuando sea seguro y legal
    B: En una intersección con una luz de semáforo en verde
    C: En o sobre un cruce de ferrocarril
    D: En una carretera dividida si hay una apertura en el divisor central
  answer: C
  explanation: El manual enumera 'En o sobre un cruce de ferrocarril' bajo la sección
    de 'Giros en U ilegales'.
- id: 167
  category: safe_driving_rules
  question: ¿Cuándo es legal realizar un giro en U en una zona escolar en Nevada?
  choices:
    A: En cualquier momento, siempre que ceda el paso a los peatones
    B: Solo cuando haya niños presentes en la zona
    C: Cuando sea un día en el que no haya clases
    D: Durante la media hora antes de que comience la siguiente sesión escolar
  answer: C
  explanation: La ley de Nevada prohíbe los giros en U en una zona escolar excepto
    bajo condiciones específicas, una de las cuales es 'cuando sea un día en el que
    no haya clases'.
- id: 168
  category: safe_driving_rules
  question: Al rebasar a otro vehículo en una carretera de dos carriles, ¿cuándo es
    seguro volver a su carril?
  choices:
    A: Tan pronto como su parachoques delantero esté por delante del vehículo rebasado
    B: Cuando pueda ver el vehículo que rebasó en su espejo retrovisor
    C: Después de haber viajado exactamente 100 pies más allá del vehículo
    D: Cuando el conductor del vehículo rebasado toque la bocina
  answer: B
  explanation: 'El manual establece: ''Después de haber rebasado, vuelva a su carril
    cuando pueda ver el vehículo que rebasó en su espejo retrovisor''.'
- id: 169
  category: safe_driving_rules
  question: ¿Cuál es una regla estricta con respecto a su velocidad al rebasar a otro
    vehículo?
  choices:
    A: Puede exceder el límite de velocidad hasta por 10 mph para rebasar rápidamente
    B: Nunca debe exceder el límite de velocidad para rebasar
    C: Debe acelerar al menos 15 mph por encima de la velocidad del vehículo que está
      rebasando
    D: Puede exceder el límite de velocidad solo en carreteras divididas
  answer: B
  explanation: 'El manual establece explícitamente: ''nunca debe exceder el límite
    de velocidad para rebasar''.'
- id: 170
  category: sharing_the_road
  question: ¿Cómo debe navegar un ciclista por una rotonda si se siente cómodo circulando
    entre el tráfico?
  choices:
    A: Circular por el delantal para camiones para mantenerse fuera del camino de
      los autos
    B: Ocupar el carril y circular con los vehículos
    C: Circular en dirección opuesta al tráfico para mantener la visibilidad
    D: Desmontar y caminar con la bicicleta por la calzada circular
  answer: B
  explanation: Para los ciclistas que se sienten cómodos circulando entre el tráfico,
    el manual aconseja 'ocupar el carril y circular con los vehículos, asegurándose
    de ceder el paso al tráfico en el círculo al entrar'.
- id: 171
  category: signs_and_signals
  question: ¿Qué significa cuando un conductor extiende su brazo izquierdo hacia abajo,
    con la palma de la mano hacia atrás?
  choices:
    A: Se está preparando para girar a la izquierda
    B: Se está preparando para girar a la derecha
    C: Está disminuyendo la velocidad o deteniéndose
    D: Está indicando a un vehículo que lo pase
  answer: C
  explanation: El manual define la señal manual para "Disminuir la velocidad o detenerse"
    como extender el brazo izquierdo hacia abajo, con la palma de la mano hacia atrás.
- id: 172
  category: safe_driving_rules
  question: Al prepararse para rebasar en una carretera de dos carriles en una zona
    comercial o residencial, ¿con cuánta anticipación debe encender su señal de giro
    a la izquierda?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Al rebasar en una carretera de dos carriles, debe encender la luz de
    señal izquierda con 100 pies de anticipación en zonas comerciales o residenciales.
- id: 173
  category: safe_driving_rules
  question: Al rebasar en una carretera de dos carriles fuera de zonas comerciales
    o residenciales, ¿con cuánta anticipación debe hacer la señal?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Al rebasar en una carretera de dos carriles, encienda la luz de señal
    izquierda con 300 pies de anticipación en áreas que no sean comerciales ni residenciales.
- id: 174
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es ilegal rebasar a otro vehículo
    en una carretera de dos carriles?
  choices:
    A: Cuando hay una línea amarilla discontinua en su carril
    B: En o dentro de los 100 pies de un cruce de calles
    C: Cuando el vehículo de adelante circula por debajo del límite de velocidad
    D: Cuando puede ver claramente hacia adelante y no hay tráfico en sentido contrario
  answer: B
  explanation: No debe rebasar en una carretera de dos carriles en o dentro de los
    100 pies de un cruce de calles.
- id: 175
  category: safe_driving_rules
  question: 'Generalmente es ilegal circular por el carril del extremo izquierdo por
    debajo del límite de velocidad cuando alguien intenta rebasarlo, EXCEPTO cuando
    usted está:'
  choices:
    A: Conduciendo en una carretera rural
    B: Preparándose para girar a la izquierda en una intersección
    C: Conduciendo un vehículo comercial
    D: Circulando en un carril para bicicletas marcado
  answer: B
  explanation: La regla contra circular por el carril del extremo izquierdo por debajo
    del límite de velocidad mientras se es rebasado no se aplica cuando se prepara
    para un giro a la izquierda en una intersección.
- id: 176
  category: safe_driving_rules
  question: 'Al rebasar a otro vehículo por la derecha, nunca debe:'
  choices:
    A: Revisar sus puntos ciegos antes de cambiar de carril
    B: Usar su señal de giro
    C: Conducir fuera de la parte pavimentada de la carretera
    D: Rebasar si la calle está marcada con dos o más carriles en su dirección
  answer: C
  explanation: Nunca rebase por la derecha cuando hacerlo implique conducir fuera
    de la parte pavimentada de la carretera.
- id: 177
  category: sharing_the_road
  question: Si no existe un carril adyacente, ¿cuál es la distancia mínima de seguridad
    que debe mantener al rebasar a un ciclista?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: Si no existe un carril adyacente, rebase por la izquierda de la bicicleta
    a una distancia segura, que debe ser de al menos tres pies.
- id: 178
  category: safe_driving_rules
  question: ¿Cuál es la posición legal de estacionamiento con respecto a la distancia
    de las ruedas al bordillo?
  choices:
    A: Dentro de 12 pulgadas
    B: Dentro de 18 pulgadas
    C: Dentro de 24 pulgadas
    D: Dentro de 30 pulgadas
  answer: B
  explanation: La posición legal de estacionamiento es con las ruedas delanteras y
    traseras a menos de 18 pulgadas del bordillo.
- id: 179
  category: safe_driving_rules
  question: Al estar estacionado, ¿su vehículo debe ser visible desde al menos qué
    distancia en cada dirección?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Su vehículo debe ser visible a 200 pies (aproximadamente 20 largos
    de automóvil) en cada dirección cuando esté estacionado.
- id: 180
  category: vehicle_information
  question: ¿Por qué nunca debe girar el encendido de su vehículo a la posición de
    "bloqueo" (lock) mientras aún está en movimiento?
  choices:
    A: Agotará inmediatamente la batería
    B: Hará que el motor se sobrecaliente
    C: Hará que el volante se bloquee y perderá el control
    D: Dañará permanentemente la transmisión
  answer: C
  explanation: Nunca gire el encendido de su vehículo a la posición de "bloqueo" (lock)
    mientras esté en movimiento. Esto hará que la dirección se bloquee si intenta
    girar el volante y perderá el control de su vehículo.
- id: 181
  category: signs_and_signals
  question: ¿Qué indica una marca de bordillo (curb) de color verde?
  choices:
    A: Prohibido detenerse, pararse o estacionarse
    B: Una zona de carga
    C: Estacionamiento solo para personas con discapacidad
    D: Se permite estacionar por un tiempo limitado
  answer: D
  explanation: El color verde permite estacionar por un tiempo limitado. El tiempo
    permitido generalmente se muestra en un letrero.
- id: 182
  category: safe_driving_rules
  question: ¿Hacia dónde debe girar las ruedas cuando está estacionado cuesta arriba
    junto a un bordillo?
  choices:
    A: Gire las llantas delanteras hacia el bordillo
    B: Gire las llantas delanteras en dirección contraria al bordillo
    C: Mantenga las llantas delanteras perfectamente rectas
    D: Gire las llantas traseras hacia el bordillo
  answer: B
  explanation: Cuando esté cuesta arriba y haya un bordillo, gire las llantas delanteras
    en dirección contraria al bordillo.
- id: 183
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios está prohibido estacionar
    su vehículo en un lugar donde se permite el estacionamiento en paralelo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: No puede estacionar su vehículo a menos de 15 pies de un hidrante de
    incendios en un lugar donde se permite el estacionamiento en paralelo.
- id: 184
  category: safe_driving_rules
  question: ¿A cuántos pies del riel más cercano de un ferrocarril es ilegal estacionar
    su vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: D
  explanation: No puede estacionar su vehículo a menos de 50 pies del riel más cercano
    de un ferrocarril.
- id: 185
  category: defensive_driving
  question: Si tiene problemas con el vehículo y debe usar un área de parada de emergencia
    en una autopista, ¿qué debe hacer?
  choices:
    A: Caminar por la autopista para encontrar la salida más cercana
    B: Encender las luces intermitentes de emergencia (luces de cuatro vías) para
      advertir al resto del tráfico
    C: Pararse en el carril de tráfico para hacer señas a un vehículo que pase
    D: Apagar todas las luces para ahorrar energía de la batería
  answer: B
  explanation: Si tiene problemas con el vehículo, diríjase al acotamiento (shoulder)
    o al área de parada de emergencia tan pronto como pueda hacerlo de manera segura.
    Encienda las luces intermitentes de emergencia para advertir al resto del tráfico.
    Caminar por una autopista es peligroso.
- id: 186
  category: safe_driving_rules
  question: ¿Cuándo es aceptable detener su vehículo en una autopista?
  choices:
    A: Cuando necesite consultar su mapa o GPS.
    B: Solo en caso de emergencia.
    C: Cuando quiera atender una llamada telefónica.
    D: Si se pasa de su salida y necesita retroceder.
  answer: B
  explanation: 'El manual establece estrictamente: ''NO SE DETENGA EN UNA AUTOPISTA
    EXCEPTO EN CASO DE EMERGENCIA''.'
- id: 187
  category: safe_driving_rules
  question: Si tiene problemas con el vehículo en la autopista y debe detenerse, ¿qué
    debe hacer para advertir al resto del tráfico?
  choices:
    A: Tocar la bocina continuamente.
    B: Encender las luces intermitentes de emergencia.
    C: Pararse en el carril y agitar los brazos.
    D: Apagar todas las luces para no ser una distracción.
  answer: B
  explanation: Si tiene problemas con el vehículo, debe dirigirse al acotamiento o
    al área de parada de emergencia y 'encender las luces intermitentes de emergencia
    para advertir al resto del tráfico'.
- id: 188
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por estacionarse ilegalmente en un espacio marcado
    con el símbolo internacional de acceso?
  choices:
    A: $100
    B: $150
    C: $250
    D: $500
  answer: C
  explanation: El manual establece que es ilegal que cualquier persona sin un cartel
    (placard) o placa válida se estacione en estos espacios, y 'la multa mínima por
    hacerlo es de $250'.
- id: 189
  category: driver_responsibility
  question: ¿Por qué las personas con carteles de discapacidad deben ser conscientes
    de usar espacios con zonas de carga cuando sea posible?
  choices:
    A: Están reservados únicamente para vehículos de entrega comercial.
    B: Cuesta más estacionar en ellos que en los espacios estándar para personas con
      discapacidad.
    C: Pueden ser necesarios para personas que requieren maquinaria, como elevadores,
      para salir y entrar de su vehículo.
    D: Tienen un límite de tiempo más corto que los espacios regulares para personas
      con discapacidad.
  answer: C
  explanation: El manual pide a las personas que sean conscientes de los espacios
    con zonas de carga porque 'pueden ser necesarios para personas con un mayor grado
    de discapacidad, que requieren la asistencia de maquinaria, como elevadores, para
    salir y entrar de su vehículo'.
- id: 190
  category: vehicle_information
  question: ¿Cuál es una característica clave de los Sistemas Avanzados de Asistencia
    al Conductor (ADAS)?
  choices:
    A: Están diseñados para reemplazar por completo la necesidad de un conductor humano.
    B: Asisten al conductor pero no conducen el vehículo por sí mismos.
    C: Permiten que el conductor duerma mientras viaja por autopistas.
    D: Solo están activos cuando el vehículo viaja a más de 50 mph.
  answer: B
  explanation: El manual establece que las tecnologías ADAS 'asisten al conductor
    pero no conducen el vehículo por sí mismas'.
- id: 191
  category: vehicle_information
  question: 'La mayoría de los sistemas de advertencia de vehículos se consideran
    ''pasivos'', lo que significa que:'
  choices:
    A: Dirigen automáticamente el vehículo lejos del peligro.
    B: Aplican los frenos con fuerza para evitar un choque.
    C: Advierten al conductor de un problema potencial pero no previenen automáticamente
      un problema o choque.
    D: Solo funcionan cuando el vehículo está en reversa.
  answer: C
  explanation: El manual explica que la mayoría de las tecnologías de advertencia
    son pasivas, 'lo que significa que advierten al conductor de un problema potencial
    pero no previenen automáticamente un problema o choque'.
- id: 192
  category: defensive_driving
  question: Incluso si su vehículo está equipado con un sistema de advertencia de
    marcha atrás o una cámara trasera, ¿qué debe seguir haciendo al retroceder?
  choices:
    A: Confiar totalmente en la pantalla del tablero.
    B: Monitorear y maniobrar de manera segura revisando los espejos y mirando por
      encima del hombro.
    C: Acelerar rápidamente para minimizar el tiempo que pasa en reversa.
    D: Apagar el sistema de advertencia para evitar distracciones.
  answer: B
  explanation: El manual establece que el conductor no debe confiarse y debe 'monitorear
    y maniobrar su vehículo de manera segura durante la marcha atrás... Esto incluye
    revisar los espejos laterales, el espejo retrovisor y mirar por encima del hombro
    (giros de cabeza)...'
- id: 193
  category: safe_driving_rules
  question: 'Los monitores de punto ciego advierten a los conductores de otros vehículos
    en sus puntos ciegos. Antes de cambiar de carril, un conductor siempre debe:'
  choices:
    A: Revisar sus espejos y mirar por encima de sus hombros.
    B: Esperar a que el monitor de punto ciego dirija automáticamente el automóvil.
    C: Tocar la bocina para alertar a los vehículos en el punto ciego.
    D: Apagar el monitor de punto ciego.
  answer: A
  explanation: 'El manual establece: ''El conductor siempre debe revisar sus espejos
    y mirar por encima de sus hombros antes de cambiar de carril'', incluso cuando
    el vehículo esté equipado con monitores de punto ciego.'
- id: 194
  category: vehicle_information
  question: ¿Qué tecnología de cámara ayuda a los conductores a estacionar mostrando
    una vista aérea virtual sobre el vehículo?
  choices:
    A: Alerta de tráfico cruzado trasero (Rear Cross-Traffic Alert)
    B: Monitor de visión periférica (Surround-View Monitor)
    C: Advertencia de velocidad en curva (Curve Speed Warning)
    D: Advertencia de colisión frontal (Forward Collision Warning)
  answer: B
  explanation: El monitor de visión periférica (Surround-View Monitor) o el sistema
    de monitor de visión panorámica ayuda a los conductores a estacionar 'mostrando
    los alrededores del vehículo a través de una vista aérea virtual sobre el vehículo'.
- id: 195
  category: vehicle_information
  question: 'Las tecnologías de detección generalmente alertan al conductor sobre
    bicicletas, peatones u obstáculos cuando conduce a bajas velocidades de aproximadamente:'
  choices:
    A: 10 mph
    B: 25 mph
    C: 40 mph
    D: 55 mph
  answer: B
  explanation: El manual señala que estos sistemas alertan al conductor cuando se
    ha detectado un obstáculo 'mientras se conduce a bajas velocidades, generalmente
    alrededor de 25 mph'.
- id: 196
  category: defensive_driving
  question: ¿Cuál es una limitación de un sistema de advertencia de colisión frontal
    (Forward Collision Warning System)?
  choices:
    A: Solo funciona cuando el vehículo está en reversa.
    B: El sistema de advertencia por sí solo no frenará automáticamente por el conductor.
    C: Solo detecta peatones, no otros vehículos.
    D: Requiere que el conductor use auriculares especiales.
  answer: B
  explanation: 'El manual establece explícitamente con respecto a los sistemas de
    advertencia de colisión frontal: ''El sistema de advertencia por sí solo no frenará
    automáticamente por el conductor''.'
- id: 197
  category: vehicle_information
  question: Al usar sensores de estacionamiento, ¿qué indica un tono de advertencia
    constante?
  choices:
    A: El sistema ha fallado.
    B: El vehículo está perfectamente centrado en el espacio de estacionamiento.
    C: El vehículo está demasiado cerca de un objeto.
    D: El freno de estacionamiento está puesto.
  answer: C
  explanation: Según el manual, al escuchar los sensores de estacionamiento, 'un tono
    constante significa que el vehículo está demasiado cerca de un objeto'.
- id: 198
  category: vehicle_information
  question: A diferencia de los sistemas de advertencia pasivos, ¿cuál es el propósito
    principal de las tecnologías de sistemas de asistencia al conductor (Driver Assistance
    Systems)?
  choices:
    A: Tomar completamente el control de la conducción en autopistas.
    B: Realizar un componente de la función de conducción, como asistir con el frenado
      o la dirección.
    C: Alertar a los servicios de emergencia si ocurre un choque.
    D: Grabar video de los alrededores del vehículo para fines de seguro.
  answer: B
  explanation: El manual establece que el propósito principal de las tecnologías de
    sistemas de asistencia al conductor es 'realizar un componente de la función de
    conducción en circunstancias específicas... como el frenado o la dirección'.
- id: 199
  category: vehicle_information
  question: ¿Qué hará un sistema de frenado de emergencia automático (Automatic Emergency
    Braking System) si detecta tráfico detenido adelante y el conductor no responde?
  choices:
    A: Aplicará los frenos con urgencia.
    B: Dirigirá el vehículo hacia el carril adyacente.
    C: Encenderá las luces de emergencia y tocará la bocina.
    D: Acelerará para despejar el peligro rápidamente.
  answer: A
  explanation: El manual establece que estos sistemas 'detectan tráfico lento o detenido
    u objetos adelante y aplicarán los frenos con urgencia si el conductor no responde'.
- id: 200
  category: vehicle_information
  question: ¿Qué tecnología está diseñada para devolver su vehículo a su carril si
    comienza a salirse de él?
  choices:
    A: Alerta de tráfico cruzado trasero (Rear Cross-Traffic Alert)
    B: Asistencia de mantenimiento de carril (Lane Keeping Assist)
    C: Monitor de punto ciego (Blind Spot Monitor)
    D: Advertencia de velocidad en curva (Curve Speed Warning)
  answer: B
  explanation: 'El manual establece: ''Los sistemas de asistencia de carril lo devuelven
    a su carril si se sale de él''.'
- id: 201
  category: vehicle_information
  question: ¿Qué puede suceder si un conductor no reacciona a una alerta del Asistente
    de Mantenimiento de Carril (Lane Keeping Assist)?
  choices:
    A: El vehículo se detendrá automáticamente a un lado de la carretera.
    B: La función puede dirigir suavemente al conductor de regreso a su carril.
    C: El motor se apagará automáticamente.
    D: Se aplicará el freno de estacionamiento de emergencia.
  answer: B
  explanation: Según el manual, si el conductor no actúa después de recibir una alerta
    del Asistente de Mantenimiento de Carril (Lane Keeping Assist), la función puede
    dirigir suavemente al conductor hacia su carril.
- id: 202
  category: vehicle_information
  question: ¿Cuándo se recomienda NO usar el Control de Crucero Adaptativo (ACC)?
  choices:
    A: Durante viajes largos por carretera en autopistas abiertas
    B: Al conducir a más de 50 mph
    C: En condiciones climáticas adversas y otras condiciones de conducción inseguras
    D: Durante las horas del día
  answer: C
  explanation: El manual establece que en condiciones climáticas adversas y otras
    condiciones de conducción inseguras, se recomienda no utilizar el Control de Crucero
    Adaptativo (ACC).
- id: 203
  category: vehicle_information
  question: Durante el proceso de estacionamiento en paralelo automático, ¿de qué
    sigue siendo responsable el conductor?
  choices:
    A: De girar el volante
    B: De encontrar el lugar de estacionamiento
    C: De acelerar hasta el límite de velocidad
    D: De frenar
  answer: D
  explanation: Si bien el sistema de estacionamiento en paralelo automático guía al
    vehículo y puede requerir quitar las manos del volante, el manual especifica que
    el conductor sigue siendo responsable de frenar.
- id: 204
  category: safe_driving_rules
  question: Para evitar el deslumbramiento de los faros de los vehículos que vienen
    en sentido contrario por la noche, ¿hacia dónde debe mirar?
  choices:
    A: Directamente a los faros que vienen en sentido contrario
    B: Hacia abajo y hacia el lado derecho de su carril
    C: A su espejo retrovisor
    D: Hacia arriba, a las luces de la calle
  answer: B
  explanation: Para que la conducción nocturna sea más segura, el manual aconseja
    a los conductores no mirar directamente a los faros de los vehículos que vienen
    en sentido contrario, sino mirar hacia abajo y hacia el lado derecho de su carril.
- id: 205
  category: safe_driving_rules
  question: ¿Cuándo es legalmente obligatorio encender los faros según la hora del
    día?
  choices:
    A: Desde la puesta del sol hasta la salida del sol
    B: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol
    C: Desde media hora después de la puesta del sol hasta media hora antes de la
      salida del sol
    D: Solo cuando se conduce por carreteras sin iluminación por la noche
  answer: C
  explanation: Los faros son legalmente obligatorios desde media hora después de la
    puesta del sol hasta media hora antes de la salida del sol.
- id: 206
  category: safe_driving_rules
  question: ¿A cuántos pies de distancia, como mínimo, debe cambiar a luces bajas
    antes de encontrarse con vehículos que vienen en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: El manual establece que se debe cambiar a luces bajas cuando se encuentre
    al menos a 500 pies de cualquier vehículo que venga en sentido contrario.
- id: 207
  category: safe_driving_rules
  question: ¿A cuántos pies de distancia debe cambiar a luces bajas cuando sigue a
    otro vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Los conductores deben cambiar a luces bajas cuando se encuentren a
    300 pies de cualquier vehículo al que estén siguiendo.
- id: 208
  category: defensive_driving
  question: ¿Cuánto mayor puede ser la distancia de frenado en carreteras resbaladizas
    en comparación con el pavimento seco?
  choices:
    A: 1.5 a 2 veces mayor
    B: 2 a 10 veces mayor
    C: 5 a 15 veces mayor
    D: 10 a 20 veces mayor
  answer: B
  explanation: El manual advierte que las distancias de frenado en carreteras resbaladizas
    pueden ser de 2 a 10 veces mayores que en el pavimento seco.
- id: 209
  category: defensive_driving
  question: Si su vehículo tiene un sistema de frenos antibloqueo (ABS), ¿cómo debe
    frenar sobre nieve y hielo?
  choices:
    A: Bombear los frenos rápidamente
    B: Usar un patrón lento y ligero de tocar y soltar
    C: Aplicar una presión firme y continua en el pedal del freno
    D: Usar solo el freno de estacionamiento de emergencia
  answer: C
  explanation: Si su vehículo tiene un sistema de frenos antibloqueo (ABS), se necesita
    una presión firme y continua en el pedal del freno para activar la función antibloqueo.
- id: 210
  category: vehicle_information
  question: ¿Entre qué fechas se permite el uso de neumáticos para nieve con clavos?
  choices:
    A: Noviembre 1 al 31 de marzo
    B: Septiembre 1 al 31 de mayo
    C: Diciembre 1 al 28 de febrero
    D: Octubre 1 al 30 de abril
  answer: D
  explanation: Los neumáticos para nieve con clavos solo pueden utilizarse desde el
    1 de octubre hasta el 30 de abril.
- id: 211
  category: defensive_driving
  question: Si los frenos fallan mientras conduce, ¿qué es lo PRIMERO que debe intentar
    hacer?
  choices:
    A: Cambiar a la posición de estacionamiento ("park")
    B: Apagar el motor (ignición)
    C: Bombear el pedal del freno
    D: Dirigirse hacia una zanja
  answer: C
  explanation: Si los frenos fallan, el manual indica que primero debe intentar bombear
    el pedal del freno.
- id: 212
  category: defensive_driving
  question: ¿Qué es lo que NUNCA debe hacer si fallan los frenos?
  choices:
    A: Usar el freno de mano o de emergencia
    B: Cambiar a una marcha más baja
    C: Poner el vehículo en la posición de estacionamiento ("park")
    D: Bombear el pedal del freno
  answer: C
  explanation: En caso de falla de los frenos, el manual establece explícitamente
    que NUNCA se debe poner el vehículo en la posición de estacionamiento ("park").
- id: 213
  category: defensive_driving
  question: ¿Cómo debe secar los frenos mojados después de conducir por agua profunda?
  choices:
    A: Conducir a alta velocidad para que se sequen con el aire
    B: Poner el vehículo en una marcha baja, conducir lentamente y presionar ligeramente
      los frenos
    C: Poner el vehículo en punto muerto (neutral) y acelerar el motor
    D: Bombear los frenos lo más rápido posible durante una milla
  answer: B
  explanation: Para secar los frenos mojados, ponga su vehículo en una marcha baja,
    conduzca lentamente y presione ligeramente los frenos, probándolos aproximadamente
    cada 200 pies.
- id: 214
  category: defensive_driving
  question: Si el acelerador (pedal del gas) se queda pegado y presionarlo con fuerza
    no lo libera, ¿qué debe hacer a continuación?
  choices:
    A: Cambiar a punto muerto (neutral), aplicar los frenos y salir de la carretera
    B: Cambiar a reversa
    C: Apagar el motor inmediatamente mientras está en marcha
    D: Aplicar únicamente el freno de mano o de emergencia
  answer: A
  explanation: Si el pedal del acelerador se queda pegado y presionarlo con fuerza
    no lo libera, debe cambiar a punto muerto (neutral), aplicar los frenos y salir
    de la carretera.
- id: 215
  category: safe_driving_rules
  question: 'Los faros delanteros son obligatorios por ley siempre que no se pueda
    ver claramente a personas o vehículos a una distancia de:'
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: B
  explanation: Los faros delanteros son obligatorios por ley siempre que no se pueda
    ver claramente a personas o vehículos a una distancia de 1,000 pies.
- id: 216
  category: vehicle_information
  question: ¿Qué es lo que NUNCA debe hacer si el acelerador (pedal del gas) de su
    vehículo se queda pegado?
  choices:
    A: Cambiar a punto muerto (neutral)
    B: Aplicar los frenos
    C: Poner el vehículo en la posición de estacionamiento ("park")
    D: Salir de la autopista hacia la derecha
  answer: C
  explanation: El manual establece que si el acelerador se queda pegado, debe cambiar
    a punto muerto (neutral), aplicar los frenos y salir de la autopista, pero NUNCA
    poner el vehículo en la posición de estacionamiento ("park").
- id: 217
  category: safe_driving_rules
  question: Si el motor de su vehículo se incendia, ¿por qué debe evitar el uso de
    agua para extinguirlo?
  choices:
    A: El agua dañará el bloque del motor
    B: La gasolina encendida flotará sobre el agua y propagará el incendio
    C: El agua creará humo tóxico
    D: El agua se evaporará demasiado rápido para ser efectiva
  answer: B
  explanation: 'El manual establece explícitamente: "NO USE AGUA porque la gasolina
    encendida flotará sobre el agua y propagará el incendio".'
- id: 218
  category: vehicle_information
  question: ¿Cuál es la acción correcta a seguir si pierde repentinamente el control
    de la dirección y su vehículo continúa manteniéndose en el carril?
  choices:
    A: Aplicar los frenos rápidamente usando la máxima presión
    B: Poner el vehículo en la posición de estacionamiento ("park") inmediatamente
    C: Dejar de presionar el acelerador, reducir la velocidad y aplicar suavemente
      los frenos
    D: Girar el volante bruscamente hacia la derecha
  answer: C
  explanation: Si su automóvil continúa manteniéndose en el carril después de perder
    el control de la dirección, debe dejar de presionar el acelerador, reducir la
    velocidad y luego aplicar suavemente los frenos mientras usa las luces intermitentes
    de emergencia.
- id: 219
  category: defensive_driving
  question: Si ve un vehículo que viene hacia usted en su carril, ¿por qué debe evitar
    desviarse hacia el carril que el vehículo que se aproxima ha dejado?
  choices:
    A: Es ilegal cruzar la línea central
    B: El otro conductor puede darse cuenta repentinamente de su error y regresar
      al carril correcto
    C: Perderá sus privilegios de derecho de paso
    D: Su vehículo puede perder tracción en la línea central
  answer: B
  explanation: El manual advierte que no debe desviarse hacia el carril que el vehículo
    que se aproxima ha dejado porque el otro conductor puede darse cuenta repentinamente
    de su error y regresar al carril correcto.
- id: 220
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un factor principal en los choques de un solo
    vehículo en los que un vehículo se sale de la autopista?
  choices:
    A: Fatiga del conductor
    B: Neumáticos inflados en exceso
    C: Conducir demasiado lento
    D: Usar las luces altas
  answer: A
  explanation: Según el manual, la fatiga del conductor, la falta de atención y el
    exceso de velocidad son factores principales en los choques en los que un vehículo
    se sale del pavimento.
- id: 221
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo se desvía hacia el acotamiento o si se
    ve obligado a salirse de la carretera?
  choices:
    A: Virar bruscamente hacia el pavimento de inmediato
    B: Pisar los frenos a fondo para detenerse rápidamente
    C: Permanecer en el acotamiento hasta que tenga su vehículo completamente bajo
      control
    D: Acelerar para recuperar la tracción
  answer: C
  explanation: Si se sale del pavimento, no intente virar bruscamente de regreso.
    En su lugar, permanezca en el acotamiento hasta que tenga su vehículo bajo control
    total y regrese suavemente a la carretera.
- id: 222
  category: vehicle_information
  question: ¿Qué es lo primero que debe hacer si experimenta el reventón de un neumático?
  choices:
    A: Frenar de inmediato
    B: Sujetar el volante con firmeza
    C: Poner la marcha en punto muerto (neutral)
    D: Encender los limpiaparabrisas
  answer: B
  explanation: Para recuperarse de forma segura de un reventón, el manual aconseja
    sujetar primero el volante con firmeza y soltar el pedal del acelerador, pero
    no pisar los frenos.
- id: 223
  category: safe_driving_rules
  question: Según el manual, ¿cuánta agua puede hacer que un conductor pierda el control
    de su automóvil?
  choices:
    A: Menos de 1 pulgada
    B: Exactamente 6 pulgadas
    C: 12 pulgadas
    D: 2 pies
  answer: A
  explanation: El manual establece que menos de 1 pulgada de agua puede hacer que
    un conductor pierda el control de su vehículo.
- id: 224
  category: safe_driving_rules
  question: ¿En qué profundidad de agua pueden flotar la mayoría de los vehículos?
  choices:
    A: 6 pulgadas o menos
    B: 1 pie o menos
    C: 2 pies o menos
    D: 3 pies o menos
  answer: C
  explanation: El manual señala que la mayoría de los vehículos pueden flotar en 2
    pies de agua o menos.
- id: 225
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de obras en la
    carretera?
  choices:
    A: Una advertencia por la primera infracción
    B: Las multas por exceso de velocidad se duplican
    C: Suspensión inmediata de la licencia
    D: Las multas se triplican
  answer: B
  explanation: El manual establece explícitamente que las multas por exceso de velocidad
    se duplican en las zonas de obras.
- id: 226
  category: signs_and_signals
  question: En una zona de obras en la carretera, ¿qué indican las señales de límite
    de velocidad de color naranja?
  choices:
    A: Son reglamentarias y deben obedecerse estrictamente
    B: Son informativas e indican velocidades más lentas y seguras
    C: Indican la velocidad mínima permitida
    D: Se aplican únicamente a vehículos comerciales
  answer: B
  explanation: Las señales de límite de velocidad en blanco y negro son reglamentarias,
    mientras que las señales de límite de velocidad naranjas son informativas (de
    advertencia) e indican velocidades más lentas y seguras.
- id: 227
  category: sharing_the_road
  question: Al acercarse a un vehículo de emergencia detenido con luces azules no
    intermitentes, ¿qué debe hacer un conductor si no puede cambiar de carril de manera
    segura?
  choices:
    A: Mantener el límite de velocidad establecido y continuar
    B: Detenerse inmediatamente en el carril de circulación
    C: Disminuir la velocidad a menos del límite de velocidad establecido y proceder
      con precaución
    D: Tocar la bocina para alertar a los trabajadores de emergencia
  answer: C
  explanation: Al acercarse a vehículos de emergencia detenidos, los conductores deben
    reducir su velocidad a menos del límite de velocidad establecido, proceder con
    precaución y estar preparados para detenerse si no pueden moverse de manera segura
    a un carril no adyacente.
- id: 228
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está autorizado a utilizar un acotamiento
    pavimentado de la carretera marcado para uso de emergencia?
  choices:
    A: Un automóvil de pasajeros con un neumático desinflado
    B: Un autobús de transporte público
    C: Un camión de reparto comercial
    D: Una motocicleta
  answer: B
  explanation: El manual enumera los vehículos autorizados que pueden utilizar un
    acotamiento pavimentado, lo que incluye a las fuerzas del orden, camiones de bomberos,
    ambulancias, grúas, vehículos del forense y autobuses de transporte público.
- id: 229
  category: sharing_the_road
  question: ¿Quién causa la mayoría de los choques entre camiones comerciales grandes
    y automóviles más pequeños?
  choices:
    A: Los conductores de camiones comerciales
    B: Los conductores de automóviles
    C: Los peatones
    D: Las malas condiciones de la carretera
  answer: B
  explanation: El manual establece que la mayoría de los choques entre camiones comerciales
    grandes y automóviles más pequeños son causados por los conductores de los automóviles.
- id: 230
  category: sharing_the_road
  question: ¿Qué es una "zona prohibida" (no-zone) en relación con los vehículos comerciales
    grandes?
  choices:
    A: Un área de estacionamiento designada solo para camiones
    B: Un carril de la carretera donde los vehículos comerciales están prohibidos
    C: El área alrededor de camiones o autobuses grandes donde los automóviles desaparecen
      en los puntos ciegos
    D: La distancia de frenado requerida para un vehículo comercial
  answer: C
  explanation: La "zona prohibida" (no-zone) se define como el área alrededor de camiones
    o autobuses comerciales grandes donde los automóviles "desaparecen" en los puntos
    ciegos.
- id: 231
  category: sharing_the_road
  question: ¿Qué es una 'zona de no visibilidad' (no-zone) alrededor de un camión
    comercial grande o un autobús?
  choices:
    A: Un área de estacionamiento designada solo para camiones.
    B: El área donde los autos desaparecen en los puntos ciegos.
    C: Una zona donde la ley prohíbe estrictamente rebasar.
    D: El carril dedicado a vehículos comerciales en las autopistas.
  answer: B
  explanation: La 'zona de no visibilidad' (no-zone) es el área alrededor de los grandes
    camiones comerciales o autobuses donde los autos 'desaparecen' en los puntos ciegos,
    lo que aumenta enormemente la posibilidad de una colisión.
- id: 232
  category: sharing_the_road
  question: En comparación con los autos de pasajeros, ¿cuánto tiempo y distancia
    necesitan los camiones comerciales grandes y los autobuses para detenerse?
  choices:
    A: Aproximadamente el mismo tiempo y distancia.
    B: Casi la mitad del tiempo y la distancia.
    C: Casi el doble de tiempo y distancia.
    D: Casi tres veces el tiempo y la distancia.
  answer: C
  explanation: Según el manual, los vehículos comerciales grandes necesitan casi el
    doble de tiempo y distancia para detenerse que los autos.
- id: 233
  category: defensive_driving
  question: ¿Por qué es peligroso intentar 'apretarse' entre un vehículo comercial
    y el bordillo en una intersección?
  choices:
    A: Los vehículos comerciales a menudo se abren ampliamente para girar de forma
      segura y no pueden ver a los autos que están directamente a su lado.
    B: El carril junto al bordillo está legalmente reservado solo para bicicletas
      y ciclomotores.
    C: Los vehículos comerciales aceleran mucho más rápido que los autos al girar.
    D: Es ilegal que los vehículos de pasajeros circulen por el carril derecho cerca
      de las intersecciones.
  answer: A
  explanation: Los conductores de camiones comerciales grandes y autobuses a veces
    necesitan abrirse ampliamente para realizar un giro de manera segura. No pueden
    ver los autos que están directamente detrás o al lado de ellos, lo que convierte
    esta maniobra de 'apretón' en una invitación al desastre.
- id: 234
  category: sharing_the_road
  question: Según la ley de Nevada, ¿cuándo pueden circular las motocicletas una al
    lado de la otra en un solo carril de tráfico?
  choices:
    A: En todo momento, independientemente del consentimiento de los conductores.
    B: Solo cuando viajan a menos de 30 mph.
    C: Con el consentimiento mutuo de los conductores.
    D: Nunca se permite que las motocicletas circulen una al lado de la otra.
  answer: C
  explanation: Según NRS 486.351 (3), las motocicletas y los ciclomotores pueden circular
    no más de dos a la par en un solo carril de tráfico con el consentimiento de los
    conductores.
- id: 235
  category: safe_driving_rules
  question: ¿Por qué es especialmente importante atenuar las luces delanteras al acercarse
    a una motocicleta?
  choices:
    A: Las luces altas harán que el motor de la motocicleta se apague.
    B: El efecto cegador de las luces altas puede ser mucho más peligroso para los
      motociclistas porque usan el equilibrio para maniobrar.
    C: Las luces delanteras de las motocicletas no son tan brillantes como las de
      los autos.
    D: Las luces altas se reflejan en los espejos de la motocicleta y ciegan al conductor
      que va detrás de ellos.
  answer: B
  explanation: Debido a que los motociclistas utilizan su equilibrio para maniobrar
    sus vehículos, el efecto cegador de las luces altas puede ser mucho más peligroso
    para ellos que para los conductores de autos o camiones comerciales grandes.
- id: 236
  category: vehicle_information
  question: En Nevada, ¿un ciclomotor (moped) se define como aquel que tiene una velocidad
    máxima de cuántas millas por hora en una superficie plana?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Nevada define los ciclomotores (mopeds) basándose en el tamaño del
    motor, los caballos de fuerza y una velocidad máxima de 30 millas por hora en
    una superficie plana o casi plana.
- id: 237
  category: safe_driving_rules
  question: 'Los operadores de ciclomotores deben permanecer en el carril del extremo
    derecho de cualquier carretera EXCEPTO cuando:'
  choices:
    A: El ciclomotor viaja a su velocidad máxima.
    B: Se preparan para dar un giro a la izquierda dentro de un cuarto de milla.
    C: Conducen en un vecindario residencial.
    D: El operador lleva un casco de color brillante.
  answer: B
  explanation: Los operadores de ciclomotores deben permanecer en el carril del extremo
    derecho a menos que haya un solo carril de tráfico, se estén preparando para girar
    a la izquierda (dentro de un cuarto de milla), sea inseguro o lo indique un oficial
    de policía.
- id: 238
  category: safe_driving_rules
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar que muestra
    una señal roja intermitente?
  choices:
    A: Cuando viaja en la dirección opuesta en una carretera dividida.
    B: Cuando viaja en la dirección opuesta en una carretera de dos carriles.
    C: Cuando llega tarde a una emergencia.
    D: Cuando el autobús escolar está detenido en un cruce de ferrocarril.
  answer: A
  explanation: 'Hay una excepción a la regla de detenerse ante un autobús escolar
    con luces rojas intermitentes: en carreteras divididas, solo es obligatorio detenerse
    cuando se viaja en la misma dirección que el autobús escolar.'
- id: 239
  category: penalties_and_points
  question: ¿A qué sanción puede enfrentarse un automovilista por causar incluso una
    colisión menor con una bicicleta o interferir intencionadamente con su movimiento?
  choices:
    A: Una advertencia verbal de un oficial de policía.
    B: Un curso obligatorio de conducción defensiva.
    C: Un cargo de conducción temeraria y la suspensión de la licencia de conducir.
    D: La revocación permanente del registro de su vehículo.
  answer: C
  explanation: Los automovilistas que causen incluso una colisión menor con una bicicleta
    o un peatón, o que interfieran intencionadamente con el movimiento de una bicicleta,
    pueden ser acusados de conducción temeraria. Las sanciones incluyen la suspensión
    de la licencia de conducir.
- id: 240
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia se le permite a un automovilista conducir en un
    carril para bicicletas designado?
  choices:
    A: Al rebasar a un vehículo más lento por la derecha.
    B: Cuando el tráfico está muy congestionado.
    C: Al entrar o salir de un callejón o entrada privada.
    D: Al prepararse para estacionar en el lado opuesto de la calle.
  answer: C
  explanation: Los automovilistas no pueden detenerse, estacionarse ni conducir en
    un sendero o carril para bicicletas designado a menos que estén entrando o saliendo
    de un callejón o entrada privada, realizando tareas oficiales, reciban instrucciones
    de un oficial de policía o exista una situación de emergencia.
- id: 241
  category: safe_driving_rules
  question: 'En Nevada, es ilegal que cualquier persona menor de 18 años viaje en
    la caja de una camioneta pickup en una carretera pavimentada A MENOS QUE:'
  choices:
    A: Lleven puesto un cinturón de seguridad sujeto a la caja de la camioneta.
    B: El vehículo se esté utilizando en labores agrícolas o ganaderas.
    C: La camioneta circule a menos de 25 mph.
    D: Estén acompañados por un adulto en la caja de la camioneta.
  answer: B
  explanation: Cualquier persona menor de 18 años no puede viajar en la caja de un
    camión de plataforma o camioneta pickup en una carretera pavimentada en Nevada.
    Las excepciones incluyen participar en un desfile autorizado o si el vehículo
    se utiliza en labores agrícolas o ganaderas.
- id: 242
  category: sharing_the_road
  question: ¿Qué debe tener en cuenta con respecto a las señales de giro de una motocicleta?
  choices:
    A: Suelen ser más brillantes que las señales de giro de un automóvil.
    B: No se cancelan automáticamente en la mayoría de las motocicletas.
    C: Solo son obligatorias en la parte trasera de la motocicleta.
    D: Se activan automáticamente cuando la motocicleta se inclina.
  answer: B
  explanation: Las señales de giro no se cancelan automáticamente en la mayoría de
    las motocicletas. Antes de realizar un cambio de carril o un giro que dependa
    de la trayectoria de una motocicleta, asegúrese de saber qué está haciendo el
    motociclista.
- id: 243
  category: sharing_the_road
  question: ¿Cuál de las siguientes acciones NO le está permitida a un ciclista mientras
    conduce?
  choices:
    A: Usar ropa de colores brillantes.
    B: Circular por un carril de tráfico.
    C: Usar su brazo derecho para señalar un giro a la derecha.
    D: Usar auriculares o un auricular de teléfono celular.
  answer: D
  explanation: Según la sección 'Los ciclistas no deben...' del manual, los ciclistas
    no deben usar auriculares (audífonos, auricular de teléfono celular, etc.) al
    conducir.
- id: 244
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor si está girando a la derecha y un peatón
    está cruzando la calle con luz verde?
  choices:
    A: Tocar la bocina para advertir al peatón que se mueva más rápido.
    B: Proceder con cuidado si hay suficiente espacio para rodearlo.
    C: Ceder el paso al peatón.
    D: El peatón debe ceder el paso al vehículo que gira.
  answer: C
  explanation: El manual establece que cuando un semáforo se pone en verde, los conductores
    deben ceder el paso a las personas que aún están cruzando la calle, y los peatones
    tienen el derecho de paso sobre los automovilistas que realizan un giro a la derecha.
- id: 245
  category: safe_driving_rules
  question: Según el manual, ¿dónde existe un cruce de peatones?
  choices:
    A: Solo donde hay líneas blancas pintadas en la carretera.
    B: En cualquier lugar donde se crucen dos calles, incluso si no está pintado o
      marcado.
    C: Solo en intersecciones controladas por semáforos o señales de alto.
    D: Solo en zonas escolares designadas.
  answer: B
  explanation: El manual especifica que existe un cruce de peatones en cualquier lugar
    donde se crucen dos calles, incluso en una intersección en 'T', y existe aunque
    no esté pintado o marcado.
- id: 246
  category: safe_driving_rules
  question: Si un vehículo delante de usted está disminuyendo la velocidad o se detiene
    en una intersección, ¿qué es ilegal que usted haga?
  choices:
    A: Detenerse detrás del vehículo y esperar.
    B: Tocar la bocina para alertar al conductor.
    C: Rebasar al vehículo antes de determinar por qué disminuyó la velocidad o se
      detuvo.
    D: Encender las luces de emergencia.
  answer: C
  explanation: Es ilegal que los automovilistas rebasen a cualquier vehículo que esté
    disminuyendo la velocidad o detenido hasta que el automovilista reduzca la velocidad
    lo suficiente como para determinar por qué el otro vehículo ha disminuido la velocidad
    o se ha detenido.
- id: 247
  category: sharing_the_road
  question: ¿Por qué no debe detener su automóvil a más de cinco pies de un cruce
    de peatones cuando un peatón ciego o con discapacidad visual está esperando?
  choices:
    A: El peatón utiliza el sonido de su motor como guía.
    B: Bloquea la vista de otros conductores que se acercan a la intersección.
    C: Es ilegal detenerse tan atrás de cualquier intersección.
    D: El peatón necesita poder tocar su automóvil con su bastón.
  answer: A
  explanation: El manual aconseja no detener el automóvil a más de cinco pies del
    cruce de peatones porque un peatón ciego o con discapacidad visual utiliza el
    sonido del motor como guía.
- id: 248
  category: sharing_the_road
  question: ¿Cómo indica un peatón ciego o con discapacidad visual que usted puede
    continuar?
  choices:
    A: Haciendo una señal con la mano hacia su vehículo.
    B: Haciendo contacto visual directo con usted.
    C: Dando un paso atrás y retirando su bastón.
    D: Apuntando con su bastón hacia su vehículo.
  answer: C
  explanation: El manual establece que si un peatón ciego o con discapacidad visual
    da un paso atrás y retira su bastón, le está indicando que puede pasar.
- id: 249
  category: vehicle_information
  question: ¿Cuál es la longitud total máxima de una combinación de vehículos que
    un conductor de Clase C no comercial puede remolcar?
  choices:
    A: 50 pies
    B: 60 pies
    C: 70 pies
    D: 80 pies
  answer: C
  explanation: Los conductores de Clase C no comerciales pueden remolcar un solo vehículo
    o una combinación de vehículos con una clasificación de peso bruto vehicular (GVWR)
    de 10,000 libras o menos y una longitud total de no más de 70 pies.
- id: 250
  category: vehicle_information
  question: ¿A qué se refiere el Peso Bruto Combinado (GCW)?
  choices:
    A: El peso total de un solo vehículo más su carga.
    B: El peso máximo seguro que un neumático puede soportar a una presión específica.
    C: El peso total de una unidad motorizada más el remolque(s) más la carga.
    D: El peso transmitido al suelo por un conjunto de ejes.
  answer: C
  explanation: El peso bruto combinado (GCW) se define como el peso total de una unidad
    motorizada más el remolque(s) más la carga.
- id: 251
  category: vehicle_information
  question: ¿Cuál es una consecuencia de tener demasiado peso en el eje de dirección
    de un vehículo de remolque?
  choices:
    A: Las ruedas motrices pueden patinar fácilmente debido a la mala tracción.
    B: Puede dificultar la dirección y causar daños al eje de dirección y a los neumáticos.
    C: El vehículo ganará demasiada velocidad en pendientes ascendentes.
    D: Es más probable que el remolque vuelque en las curvas.
  answer: B
  explanation: El equilibrio de peso inadecuado puede hacer que el manejo sea inseguro.
    Demasiado peso en el eje de dirección puede dificultar la dirección y causar daños
    al eje de dirección y a los neumáticos.
- id: 252
  category: vehicle_information
  question: ¿Qué sucede si hay muy poco peso en los ejes de tracción de un vehículo
    de remolque?
  choices:
    A: El eje de dirección se dañará.
    B: El vehículo tendrá poca tracción y las ruedas motrices pueden patinar fácilmente.
    C: El remolque tendrá el centro de gravedad demasiado alto.
    D: Los frenos fallarán inmediatamente.
  answer: B
  explanation: El manual establece que muy poco peso en los ejes de tracción puede
    causar una mala tracción y las ruedas motrices pueden patinar fácilmente.
- id: 253
  category: vehicle_information
  question: Al enganchar un remolque a un vehículo usando un acoplador de bola y enganche,
    ¿cómo deben configurarse las cadenas de seguridad?
  choices:
    A: Sujetas y cruzadas.
    B: Colgando flojas hasta tocar el suelo.
    C: Sujetas solo al lado derecho del enganche.
    D: Envueltas firmemente alrededor del accesorio de la bola.
  answer: A
  explanation: Al enganchar un remolque, debe asegurarse de que las cadenas de seguridad
    estén sujetas y cruzadas, y que no estén enredadas, pellizcadas ni arrastrándose.
- id: 254
  category: sharing_the_road
  question: Si no hay una acera disponible, ¿por dónde deben caminar los peatones?
  choices:
    A: En el lado derecho de la carretera, moviéndose con el tráfico.
    B: En el centro de la carretera.
    C: En el lado de la carretera de frente al tráfico.
    D: No se permiten peatones en carreteras sin aceras.
  answer: C
  explanation: 'El manual establece: ''Si hay una acera, los peatones deben usarla.
    Si no hay acera, los peatones deben caminar por el lado de la carretera de frente
    al tráfico''.'
- id: 255
  category: sharing_the_road
  question: Si hay un guardia de cruce presente en un paso de peatones, ¿cuándo puede
    avanzar un automovilista?
  choices:
    A: Tan pronto como el guardia baje su señal de alto.
    B: Cuando el guardia esté completamente fuera del paso de peatones.
    C: Cuando los niños hayan cruzado, incluso si el guardia todavía está en la carretera.
    D: Después de detenerse por completo durante 3 segundos.
  answer: B
  explanation: Si hay un guardia de cruce presente, los automovilistas deben esperar
    hasta que el guardia esté completamente fuera del paso de peatones antes de avanzar.
- id: 256
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una acción recomendada al encontrarse con un
    peatón ciego o con discapacidad visual?
  choices:
    A: Darles instrucciones verbales para ayudarlos a cruzar de manera segura.
    B: Tocar la bocina ligeramente para avisarles que su vehículo está allí.
    C: Esperar 3-4 segundos para darles tiempo a decidir si quieren cruzar.
    D: Detenerse en medio del paso de peatones para bloquear el resto del tráfico
      por ellos.
  answer: C
  explanation: El manual sugiere dar a los peatones ciegos o con discapacidad visual
    tiempo para decidir si quieren cruzar la calle, señalando que esperar 3-4 segundos
    es una buena regla general. Dice explícitamente que NO se deben dar instrucciones
    verbales, tocar la bocina ni detenerse en medio de un paso de peatones.
- id: 257
  category: defensive_driving
  question: ¿Cuáles son dos cosas que un conductor puede hacer para evitar que un
    remolque vuelque?
  choices:
    A: Ir rápido en las curvas y mantener la carga apilada en alto.
    B: Ir despacio en las curvas y mantener la carga lo más cerca posible del suelo.
    C: Sobrecargar el eje delantero y usar un enganche de quinta rueda.
    D: Poner los artículos más pesados arriba y frenar firmemente en las curvas.
  answer: B
  explanation: 'El manual establece que hay dos cosas que un conductor puede hacer
    para evitar un vuelco: ir despacio en las curvas y mantener la carga lo más cerca
    posible del suelo.'
- id: 258
  category: vehicle_information
  question: ¿Cuál es una desventaja de usar un enganche de quinta rueda?
  choices:
    A: Es muy inestable y propenso a problemas de distribución de peso.
    B: Ocupa la mayor parte del espacio en la caja del camión.
    C: No se puede usar con líneas eléctricas o cadenas de seguridad.
    D: Requiere que el remolque tenga una parte delantera completamente plana.
  answer: B
  explanation: Según el manual, una desventaja de un enganche de quinta rueda es que
    ocupa la mayor parte del espacio en la caja del camión y requiere que el espacio
    restante detrás del conjunto del enganche se mantenga despejado para girar en
    las esquinas.
- id: 259
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de retroceder su vehículo debajo de un remolque
    de quinta rueda?
  choices:
    A: Asegurarse de que los frenos del remolque estén bloqueados.
    B: Desconectar todas las líneas eléctricas.
    C: Asegurarse de que el brazo de liberación esté en la posición cerrada.
    D: Vaciar completamente la caja del camión.
  answer: A
  explanation: 'El manual establece: ''Antes de retroceder su vehículo debajo del
    remolque, asegúrese de que los frenos del remolque estén bloqueados''.'
- id: 260
  category: safe_driving_rules
  question: Después de comenzar un viaje largo, ¿dentro de cuántas millas debe inspeccionar
    nuevamente el remolque y los dispositivos de sujeción de la carga?
  choices:
    A: 10 millas
    B: 100 millas
    C: 50 millas
    D: 200 millas
  answer: C
  explanation: 'El manual aconseja: ''Inspeccione el remolque y los dispositivos de
    sujeción de la carga nuevamente dentro de las 50 millas posteriores al inicio
    de un viaje largo''.'
- id: 261
  category: safe_driving_rules
  question: ¿Durante un viaje prolongado, con qué frecuencia debe realizar los ajustes
    necesarios e inspeccionar el remolque después de la revisión inicial de las 50
    millas?
  choices:
    A: Cada 3 horas o 150 millas
    B: Cada 2 horas o 100 millas
    C: Cada 4 horas o 200 millas
    D: Cada 5 horas o 250 millas
  answer: A
  explanation: Después de la revisión inicial de las 50 millas, debe "realizar los
    ajustes necesarios e inspeccionar nuevamente después de haber conducido durante
    3 horas o 150 millas".
- id: 262
  category: vehicle_information
  question: ¿Cómo afecta el peso de un vehículo pesado a su distancia de frenado?
  choices:
    A: Los camiones vacíos requieren distancias de frenado mayores porque tienen menos
      tracción.
    B: Los camiones totalmente cargados requieren distancias de frenado mucho mayores
      que los camiones vacíos.
    C: El peso del vehículo no tiene efecto en su distancia de frenado.
    D: Los camiones vacíos frenan más rápido porque los frenos tienen menos peso que
      absorber.
  answer: A
  explanation: El manual explica que los frenos, neumáticos, resortes y amortiguadores
    en vehículos pesados están diseñados para funcionar mejor cuando están totalmente
    cargados. "Los camiones vacíos en realidad requieren distancias de frenado mayores
    porque tienen menos tracción".
- id: 263
  category: safe_driving_rules
  question: Al retroceder un vehículo con un remolque, ¿en qué dirección debe girar
    inicialmente el volante?
  choices:
    A: En la dirección en la que desea que vaya el remolque.
    B: Mantenga el volante perfectamente recto.
    C: Gire el volante bruscamente a la derecha sin importar la dirección.
    D: En la dirección opuesta a la que desea que vaya el remolque.
  answer: D
  explanation: Al retroceder con un remolque, el manual indica "girar el volante en
    la dirección opuesta. Una vez que el remolque comience a girar, debe girar el
    volante hacia el otro lado para seguir al remolque".
- id: 264
  category: defensive_driving
  question: ¿Por qué se considera muy peligroso retroceder hacia el lado derecho con
    un remolque?
  choices:
    A: Es más probable que el remolque se desconecte del enganche.
    B: El volante se bloquea al girar a la derecha en reversa.
    C: No se puede ver tan bien por el lado derecho.
    D: Hace que fallen los frenos del remolque.
  answer: C
  explanation: 'El manual establece: "Retroceder hacia el lado derecho es muy peligroso
    porque no se puede ver tan bien. Si retrocede y gira hacia el lado del conductor,
    vigile la parte trasera de su vehículo mirando por la ventana lateral".'
- id: 265
  category: safe_driving_rules
  question: Si ve que su remolque se desvía de su curso mientras retrocede, ¿cómo
    debe corregir la desviación?
  choices:
    A: Acelerar para enderezar el remolque.
    B: Aplicar los frenos del remolque inmediatamente.
    C: Girar la parte superior del volante en dirección opuesta a la desviación.
    D: Girar la parte superior del volante en la dirección de la desviación.
  answer: D
  explanation: Para corregir la desviación de inmediato, "tan pronto como vea que
    el remolque se desvía de su curso, corríjalo girando la parte superior del volante
    en la dirección de la desviación".
- id: 266
  category: safe_driving_rules
  question: Si conduce un vehículo grande que debe abrirse para hacer un giro a la
    derecha, ¿cómo debe ejecutar el giro?
  choices:
    A: Ábrase al completar el giro, manteniendo la parte trasera cerca de la acera.
    B: Ábrase hacia la izquierda al comenzar el giro.
    C: Retroceda antes de hacer el giro para obtener un mejor ángulo.
    D: Entre en el carril de tráfico en sentido contrario antes de comenzar el giro.
  answer: A
  explanation: 'El manual aconseja: "Si conduce un vehículo que no puede hacer el
    giro a la derecha sin entrar en otro carril, ábrase al completar el giro. Mantenga
    la parte trasera de su remolque cerca de la acera".'
- id: 267
  category: defensive_driving
  question: ¿Por qué NO debe abrirse hacia la izquierda al comenzar un giro a la derecha
    con un vehículo grande?
  choices:
    A: Hará que el remolque se desvíe hacia la acera.
    B: Requiere demasiado esfuerzo de dirección y puede bloquear las ruedas.
    C: Un conductor que le sigue puede pensar que va a girar a la izquierda e intentar
      adelantarle por la derecha.
    D: Las cadenas de seguridad del remolque pueden romperse por la tensión.
  answer: C
  explanation: 'El manual advierte: "No se abra hacia la izquierda al comenzar el
    giro. Un conductor que le sigue puede pensar que va a girar a la izquierda e intentar
    adelantarle por la derecha. Podría chocar con el otro vehículo al completar su
    giro".'
- id: 268
  category: safe_driving_rules
  question: Al hacer un giro a la izquierda con un vehículo grande, ¿por qué debe
    llegar al centro de la intersección antes de comenzar el giro?
  choices:
    A: Para permitir que el tráfico en sentido contrario pase por su derecha.
    B: Para activar los sensores del semáforo en la intersección.
    C: Para dar a los peatones más tiempo para cruzar la calle.
    D: Para evitar que el lado izquierdo de su vehículo golpee a otro vehículo debido
      a la desviación de la trayectoria (off-tracking).
  answer: D
  explanation: En un giro a la izquierda, asegúrese de haber llegado al centro de
    la intersección antes de comenzar el giro porque "si gira demasiado pronto, el
    lado izquierdo de su vehículo puede golpear a otro vehículo debido a la desviación
    de la trayectoria (off-tracking)".
- id: 269
  category: safe_driving_rules
  question: Si hay dos carriles de giro para un giro a la izquierda, ¿qué carril debe
    tomar el conductor de un vehículo grande?
  choices:
    A: El carril de giro de la derecha.
    B: El carril de giro interior (izquierdo).
    C: Cualquier carril que tenga menos tráfico.
    D: El carril más cercano a la línea central.
  answer: A
  explanation: 'El manual establece: "Si hay dos carriles de giro, tome siempre el
    carril de giro de la derecha. No comience en el carril interior porque es posible
    que tenga que abrirse a la derecha para hacer el giro".'
- id: 270
  category: vehicle_information
  question: ¿Cómo afecta la carga de un remolque a su altura libre (overhead clearance)?
  choices:
    A: Un remolque cargado es más alto que uno vacío.
    B: La carga no tiene efecto en la altura del remolque.
    C: Un remolque vacío es más alto que uno cargado.
    D: Un remolque cargado es más ancho, pero la altura sigue siendo la misma.
  answer: C
  explanation: Según el manual, "El peso de un vehículo cambia su altura. Un remolque
    vacío es más alto que uno cargado".
- id: 271
  category: defensive_driving
  question: ¿Por qué no debe asumir que la altura indicada en puentes y pasos elevados
    es siempre correcta?
  choices:
    A: El repavimentado o la nieve acumulada pueden haber reducido el espacio libre
      desde que se publicó la altura.
    B: Las señales suelen ser vandalizadas o estar desactualizadas.
    C: Los puentes se expanden significativamente en climas cálidos, reduciendo el
      espacio libre.
    D: La altura indicada solo se aplica a vehículos de pasajeros, no a vehículos
      comerciales.
  answer: A
  explanation: 'El manual advierte: ''No asuma que la altura indicada en puentes y
    pasos elevados es correcta. El repavimentado o la nieve acumulada pueden haber
    reducido los espacios libres desde que se publicó la altura''.'
- id: 272
  category: vehicle_information
  question: ¿Cuál de los siguientes peligros puede causar que un vehículo muy cargado
    se arrastre o se quede atascado por debajo?
  choices:
    A: Pasos de cebra recién pintados.
    B: Bandas sonoras (rumble strips) en la carretera.
    C: Asfalto mojado.
    D: Vías de ferrocarril que sobresalen varias pulgadas.
  answer: D
  explanation: El manual señala que el espacio debajo puede ser muy pequeño cuando
    el vehículo está muy cargado, y 'las vías del ferrocarril pueden sobresalir varias
    pulgadas... No se arriesgue a quedarse atascado a mitad del camino'.
- id: 273
  category: vehicle_information
  question: Al remolcar una combinación de vehículos, ¿dónde debe colocarse el vehículo
    más pesado?
  choices:
    A: En la posición trasera
    B: En la primera posición detrás del vehículo remolcador
    C: En la posición intermedia
    D: No importa, siempre que esté asegurado
  answer: B
  explanation: Al remolcar una combinación de vehículos, el vehículo más pesado siempre
    debe estar en la primera posición detrás del vehículo remolcador. El vehículo
    más ligero debe ir en la parte trasera.
- id: 274
  category: defensive_driving
  question: ¿Cómo cambia la distancia de frenado de un vehículo de combinación grande
    cuando está vacío en comparación con cuando está totalmente cargado?
  choices:
    A: Tarda menos tiempo en detenerse cuando está vacío.
    B: Tarda más tiempo en detenerse cuando está vacío.
    C: La distancia de frenado es exactamente la misma.
    D: No se puede determinar sin conocer la velocidad.
  answer: B
  explanation: Los vehículos de combinación grandes que están vacíos tardan más en
    detenerse que cuando están totalmente cargados. Cuando están poco cargados, los
    resortes de suspensión rígidos y los frenos potentes proporcionan una tracción
    deficiente.
- id: 275
  category: safe_driving_rules
  question: ¿Cuál es la acción correcta a tomar si las ruedas de su remolque se bloquean
    y este comienza a derrapar?
  choices:
    A: Aplicar el freno de mano del remolque inmediatamente.
    B: Girar bruscamente en la dirección opuesta.
    C: Soltar los frenos para recuperar la tracción.
    D: Acelerar para enderezar el remolque.
  answer: C
  explanation: Para recuperarse de un derrape del remolque, debe soltar los frenos
    para recuperar la tracción. No use el freno de mano del remolque, ya que los frenos
    en las ruedas del remolque fueron los que causaron el derrape en primer lugar.
- id: 276
  category: defensive_driving
  question: ¿Cuál es la forma más temprana y mejor de reconocer que su remolque ha
    comenzado a derrapar?
  choices:
    A: Sentir un tirón en el volante
    B: Escuchar el chirrido de los neumáticos
    C: Verlo en sus espejos
    D: Sentir que el vehículo reduce la velocidad bruscamente
  answer: C
  explanation: La forma más temprana y mejor de reconocer que el remolque ha comenzado
    a derrapar es viéndolo en sus espejos. Cada vez que se apliquen los frenos con
    fuerza, revise los espejos.
- id: 277
  category: driver_responsibility
  question: ¿Cuál es la cobertura mínima de seguro de responsabilidad civil requerida
    por lesiones corporales o muerte de una persona en cualquier accidente en Nevada?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: El estado de Nevada requiere una cobertura mínima de $25,000 por lesiones
    corporales o muerte de una persona en cualquier accidente.
- id: 278
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una posible sanción por una interrupción en
    la cobertura del seguro del vehículo en Nevada?
  choices:
    A: Una sentencia de cárcel obligatoria de 6 meses
    B: Confiscación del vehículo
    C: Una tarifa de restablecimiento y multas que comienzan en $250
    D: Revocación permanente de su licencia de conducir
  answer: C
  explanation: Si se suspende un registro por falta de seguro, el conductor deberá
    pagar una tarifa de restablecimiento y las multas correspondientes que comienzan
    en $250 y suman hasta $1,750.
- id: 279
  category: driver_responsibility
  question: Si usted se ve involucrado en un accidente que NO es investigado por las
    autoridades, ¿bajo qué circunstancias debe presentar un Formulario de Informe
    de Accidente (SR-1)?
  choices:
    A: Solo si el accidente involucra a un vehículo comercial
    B: Si el accidente causa $750 o más en daños o si alguien resulta herido
    C: Si el accidente causa $1,000 o más en daños
    D: Solo si el otro conductor no tiene seguro
  answer: B
  explanation: Si usted se ve involucrado en un accidente que no es investigado por
    las autoridades y el accidente causa $750 o más en daños o alguien resulta herido,
    debe completar y enviar un Formulario de Informe de Accidente (SR-1).
- id: 280
  category: driver_responsibility
  question: ¿Cuántos días tiene para enviar un Formulario de Informe de Accidente
    (SR-1) al DMV si es necesario?
  choices:
    A: 3 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Debe completar y enviar un Formulario de Informe de Accidente (SR-1)
    en un plazo de 10 días al Departamento de Vehículos Motorizados (DMV) de Nevada.
- id: 281
  category: safe_driving_rules
  question: ¿Qué debe hacer si se ve involucrado en un choque con solo daños a la
    propiedad (sin lesiones) y su vehículo puede moverse de manera segura?
  choices:
    A: Dejar los vehículos exactamente donde están hasta que llegue la policía.
    B: Moverse a un lugar que no obstruya el tráfico y regresar a la escena.
    C: Conducir a casa y reportar el choque en línea.
    D: Esperar en medio de la carretera con las luces de emergencia encendidas.
  answer: B
  explanation: Si solo hay daños a un vehículo u otra propiedad (sin lesiones) y el
    vehículo puede moverse de manera segura, muévase a un lugar que no obstruya el
    tráfico y regrese a la escena.
- id: 282
  category: driver_responsibility
  question: ¿Qué debe hacer si choca contra un vehículo desatendido?
  choices:
    A: Abandonar la escena inmediatamente si no hay daños visibles.
    B: Esperar junto al vehículo hasta por una hora.
    C: Proporcionar al propietario su información, ya sea en persona o dejando una
      nota.
    D: Llamar a una grúa para retirar el vehículo desatendido.
  answer: C
  explanation: Si el choque involucra un vehículo desatendido u otra propiedad, debe
    proporcionar al propietario su nombre, dirección, número de licencia de conducir,
    registro e información del seguro, ya sea en persona o dejando una nota.
- id: 283
  category: penalties_and_points
  question: ¿Cómo maneja el DMV de Nevada las infracciones de tráfico que ocurren
    en otros estados?
  choices:
    A: Se ignoran siempre que pague la multa en el otro estado.
    B: Se agregan a su historial de conducción de Nevada.
    C: Solo afectan su historial si involucran un DUI.
    D: Se colocan en un historial de conducción de fuera del estado por separado.
  answer: B
  explanation: La información sobre choques de tráfico y condenas pasa a formar parte
    de su historial de conducción. Incluso las infracciones de tráfico que ocurren
    en otros estados se agregan a su historial de conducción de Nevada.
- id: 284
  category: alcohol_drugs_health
  question: ¿Cuánto tiempo permanecen en su historial de conducción de Nevada las
    condenas relacionadas con DUI (conducir bajo la influencia)?
  choices:
    A: 3 años
    B: 5 años
    C: 7 años
    D: 10 años
  answer: C
  explanation: La mayoría de las infracciones se pueden reportar a su compañía de
    seguros durante tres años. Las condenas relacionadas con DUI (conducir bajo la
    influencia) permanecen en su historial durante siete años.
- id: 285
  category: penalties_and_points
  question: Bajo el sistema de puntos de demérito de Nevada, ¿su licencia será suspendida
    si recibe cuántos puntos en cualquier período de 12 meses?
  choices:
    A: 6 puntos o más
    B: 8 puntos o más
    C: 10 puntos o más
    D: 12 puntos o más
  answer: D
  explanation: Si recibe 12 puntos o más en cualquier período de 12 meses, su licencia
    será suspendida.
- id: 286
  category: penalties_and_points
  question: Si ha acumulado entre tres y 11 puntos de demérito, ¿cómo puede hacer
    que se eliminen tres puntos de su historial?
  choices:
    A: Pagando una multa de $150 al DMV
    B: Completando un curso de seguridad vial en una escuela aprobada por el DMV
    C: Conduciendo sin infracciones durante 6 meses
    D: Volviendo a tomar el examen de conducir escrito
  answer: B
  explanation: Si ha acumulado entre tres y 11 puntos, puede hacer que se eliminen
    tres puntos completando un curso de seguridad vial en una escuela aprobada por
    el DMV.
- id: 287
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito acumulados en un período de 12 meses resultarán
    en la suspensión de la licencia de conducir en Nevada?
  choices:
    A: 8 o más
    B: 10 o más
    C: 12 o más
    D: 15 o más
  answer: C
  explanation: Según el manual, si recibe 12 puntos o más en cualquier período de
    12 meses, su licencia será suspendida.
- id: 288
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito se asignan a su historial de conducción por
    conducción temeraria?
  choices:
    A: '4'
    B: '6'
    C: '8'
    D: '10'
  answer: C
  explanation: El manual establece que a la conducción temeraria se le asignan 8 puntos
    de demérito en su historial de conducción.
- id: 289
  category: penalties_and_points
  question: ¿Qué sucede con sus puntos de demérito si es condenado por una infracción
    de tráfico grave, como un DUI?
  choices:
    A: Recibe 12 puntos.
    B: Recibe 8 puntos.
    C: Recibe 6 puntos.
    D: No se asignan puntos de demérito, pero se le revoca la licencia.
  answer: D
  explanation: Una condena por una infracción de tráfico grave, como DUI o causar
    daños corporales sustanciales, resultará en la revocación de su licencia. A estas
    infracciones no se les asignan puntos de demérito.
- id: 290
  category: alcohol_drugs_health
  question: 'Según la ley de Nevada, es ilegal conducir con una cantidad de marihuana
    en la sangre superior a:'
  choices:
    A: 2 nanogramos por mililitro
    B: 5 nanogramos por mililitro
    C: 8 nanogramos por mililitro
    D: 10 nanogramos por mililitro
  answer: A
  explanation: Es ilegal que cualquier persona conduzca con una cantidad de marihuana
    en su sistema superior a dos nanogramos por mililitro de sangre.
- id: 291
  category: alcohol_drugs_health
  question: Según la Ley de Consentimiento Implícito de Nevada, ¿cuál es la sanción
    por negarse a someterse a una prueba de sangre, aliento u orina en su primera
    infracción?
  choices:
    A: Licencia revocada por 90 días
    B: Licencia revocada por 185 días
    C: Licencia revocada por 1 año
    D: Licencia revocada por 3 años
  answer: C
  explanation: Si no se somete a estas pruebas, su licencia será revocada y no será
    elegible para obtener una licencia por un período de un año en el caso de una
    primera infracción.
- id: 292
  category: alcohol_drugs_health
  question: Según la Ley de Ilegalidad Per Se (Illegal Per Se Law), ¿qué medida administrativa
    se toma si un conductor menor de 21 años tiene una concentración de alcohol de
    .02%?
  choices:
    A: La licencia de conducir se suspende por 90 días
    B: La licencia de conducir se revoca por 185 días
    C: La licencia de conducir se revoca por 1 año
    D: La licencia de conducir se revoca por 3 años
  answer: B
  explanation: Para una concentración de alcohol del .02% en conductores menores de
    21 años, la sanción administrativa es la revocación de la licencia de conducir
    por 185 días.
- id: 293
  category: penalties_and_points
  question: ¿Cuál es la sentencia mínima de cárcel o confinamiento residencial por
    una segunda infracción de DUI dentro de un periodo de 7 años?
  choices:
    A: 2 días
    B: 10 días
    C: 30 días
    D: 6 meses
  answer: B
  explanation: Para una segunda infracción de DUI dentro de 7 años, la acción penal
    incluye una sentencia de cárcel o confinamiento residencial de 10 días a 6 meses.
- id: 294
  category: penalties_and_points
  question: ¿Cuál es la sentencia de prisión por un DUI que cause la muerte o lesiones
    graves?
  choices:
    A: 1 a 6 años
    B: 2 a 10 años
    C: 2 a 20 años
    D: 5 a 25 años
  answer: C
  explanation: Por un DUI que cause la muerte o lesiones graves, la acción penal incluye
    una sentencia de prisión de 2 a 20 años.
- id: 295
  category: alcohol_drugs_health
  question: Si posee una Licencia de Conducir Comercial (CDL), ¿qué concentración
    de alcohol activará una revocación administrativa por Ilegalidad Per Se?
  choices:
    A: .02% o más
    B: .04% o más pero menos del .08%
    C: .06% o más
    D: .10% o más
  answer: B
  explanation: Se aplica una Medida Administrativa por Ilegalidad Per Se para una
    concentración de alcohol del .04% o más, pero menos del .08%, si posee una licencia
    de conducir comercial.
- id: 296
  category: alcohol_drugs_health
  question: ¿Cómo pueden los infractores de DUI restablecer inmediatamente sus privilegios
    de conducción?
  choices:
    A: Pagando una multa de $1,000
    B: Completando 200 horas de servicio comunitario
    C: Instalando un dispositivo de bloqueo de encendido (ignition interlock device)
      a su propio costo
    D: Asistiendo a un programa de tratamiento de 3 meses
  answer: C
  explanation: Los privilegios de conducción de los infractores de DUI pueden restablecerse
    de inmediato si se emite una licencia de conducir con una restricción de bloqueo
    de encendido y se instala un dispositivo de bloqueo de encendido en cualquier
    vehículo que el automovilista opere, a su propio costo.
- id: 297
  category: driver_responsibility
  question: ¿Cuál de las siguientes acciones con respecto a su licencia de conducir
    de Nevada es ilegal?
  choices:
    A: Registrarse para una cuenta gratuita del DMV en línea
    B: Prestar su licencia a otra persona
    C: Verificar la fecha de vencimiento de su licencia en línea
    D: Imprimir su historial de conductor
  answer: B
  explanation: Es ilegal alterar su licencia de cualquier manera, prestarla a otra
    persona o usar la licencia de otra persona.
- id: 298
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito se asignan por seguir a otro vehículo demasiado
    cerca?
  choices:
    A: '2'
    B: '4'
    C: '6'
    D: '8'
  answer: B
  explanation: Según la lista parcial de infracciones de tránsito, seguir a otro vehículo
    demasiado cerca conlleva 4 puntos de demérito.
- id: 299
  category: alcohol_drugs_health
  question: ¿Qué exige el tribunal para un conductor menor de 18 años que sea declarado
    culpable de conducir bajo la influencia?
  choices:
    A: Una sentencia mínima de 1 año de prisión
    B: Descalificación de por vida para conducir
    C: Evaluación por abuso de alcohol o drogas
    D: Una multa de $2,000
  answer: C
  explanation: Un conductor menor de 18 años que sea declarado por un tribunal de
    menores culpable de haber conducido bajo la influencia será obligado por el tribunal
    a someterse a una evaluación por abuso de alcohol o drogas.
- id: 300
  category: penalties_and_points
  question: ¿Cuál es el rango de la multa por una primera infracción de DUI?
  choices:
    A: $100 a $300
    B: $400 a $1,000
    C: $750 a $1,000
    D: $2,000 a $5,000
  answer: B
  explanation: Para una primera infracción de DUI, la acción penal incluye una multa
    de $400 a $1,000.
- id: 301
  category: alcohol_drugs_health
  question: ¿Cuál es un requisito judicial para un conductor menor de 21 años que
    es condenado por conducir bajo la influencia (DUI)?
  choices:
    A: Pérdida permanente de los privilegios de conducir
    B: Someterse a una evaluación por abuso de alcohol o drogas
    C: Un mínimo de 30 días en la cárcel
    D: Entrega del título del vehículo
  answer: B
  explanation: Un conductor menor de 21 años que es condenado por un DUI será requerido
    por el tribunal a someterse a una evaluación por abuso de alcohol o drogas.
- id: 302
  category: alcohol_drugs_health
  question: ¿A cuál de las siguientes áreas NO se aplica la ley de envases abiertos
    de Nevada?
  choices:
    A: El área de pasajeros de una camioneta pickup estándar
    B: El asiento trasero de un automóvil de pasajeros estándar
    C: Las áreas residenciales de una casa rodante o remolque vivienda
    D: El maletero de cualquier vehículo
  answer: C
  explanation: La ley de envases abiertos de Nevada no se aplica a las áreas residenciales
    de casas rodantes o remolques vivienda, ni a las áreas de pasajeros de autobuses
    comerciales, limusinas o taxis.
- id: 303
  category: penalties_and_points
  question: Si se le declara culpable de un delito de DUI, ¿qué considerará el tribunal
    como un factor agravante al determinar su sentencia?
  choices:
    A: Tener pasajeros menores de 15 años en el vehículo
    B: Conducir un vehículo fabricado antes de 1968
    C: Tener una licencia de conducir de otro estado
    D: Conducir durante las horas del día
  answer: A
  explanation: Si se le declara culpable de un delito de DUI y tenía pasajeros menores
    de 15 años en el vehículo que conducía, el tribunal considerará eso como un factor
    agravante al determinar su sentencia.
- id: 304
  category: penalties_and_points
  question: Si se declara o se le declara culpable de un DUI y se realizó una prueba
    química, ¿qué multa adicional impondrá el tribunal?
  choices:
    A: $25
    B: $60
    C: $100
    D: $250
  answer: B
  explanation: Si se declara culpable o se le declara culpable de DUI y se realizó
    una prueba química, el tribunal impondrá una multa adicional de $60 para cubrir
    los costos del análisis químico.
- id: 305
  category: defensive_driving
  question: ¿Cuál de los siguientes comportamientos al conducir es una pista de que
    un conductor puede estar bajo la influencia del alcohol o las drogas?
  choices:
    A: Conducir con el flujo del tráfico
    B: Usar las señales de giro antes de cambiar de carril
    C: Conducir de noche con los faros apagados
    D: Detenerse en un semáforo en rojo
  answer: C
  explanation: Conducir de noche con los faros apagados figura en el manual como una
    de las pistas de conducir bajo la influencia del alcohol o las drogas.
- id: 306
  category: safe_driving_rules
  question: ¿Cómo puede reportar a un sospechoso de conducir ebrio o una emergencia
    en la carretera con un teléfono celular en cualquier lugar de Nevada?
  choices:
    A: Marque *DUI (*384)
    B: Marque *NHP (*647)
    C: Marque *SOS (*767)
    D: Marque *911 (*911)
  answer: B
  explanation: Puede reportar a un sospechoso de conducir ebrio o cualquier emergencia
    en la carretera con un teléfono celular en cualquier lugar de Nevada marcando
    *NHP (*647).
- id: 307
  category: penalties_and_points
  question: ¿Se suspenderá la licencia de conducir si se acumulan cuántos puntos de
    demérito en un período de 12 meses?
  choices:
    A: 6 o más
    B: 8 o más
    C: 10 o más
    D: 12 o más
  answer: D
  explanation: Una suspensión por puntos ocurre cuando un conductor acumula 12 o más
    puntos de demérito en su licencia en un período de 12 meses.
- id: 308
  category: penalties_and_points
  question: ¿Se suspenderán su licencia de conducir y el registro del vehículo si
    no tiene seguro de responsabilidad civil y se ve involucrado en un choque con
    daños superiores a qué cantidad?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $1,500
  answer: B
  explanation: Si ocurre un choque con más de $750 en daños (lesiones personales o
    daños a la propiedad) y usted no tiene seguro de responsabilidad civil, se suspenden
    su licencia de conducir y el registro del vehículo.
- id: 309
  category: penalties_and_points
  question: ¿Cuál de los siguientes delitos no relacionados con la conducción puede
    resultar en que una persona pierda sus privilegios de conducir en Nevada?
  choices:
    A: Ausentismo escolar (truancy)
    B: Ser declarado culpable de una infracción por grafiti
    C: Violar una ordenanza municipal sobre ruidos
    D: Reprobar una clase de secundaria
  answer: B
  explanation: La licencia de una persona puede ser suspendida o revocada si es declarada
    culpable de una infracción por grafiti.
- id: 310
  category: vehicle_information
  question: ¿Cuánto tiempo tienen los nuevos residentes para registrar sus vehículos
    después de establecer su residencia en Nevada?
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Los conductores deben registrar sus vehículos dentro de los 30 días
    posteriores a establecer su residencia en Nevada o al momento de obtener una licencia
    de conducir, lo que ocurra primero.
- id: 311
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al seguro
    de responsabilidad civil del vehículo para los nuevos residentes de Nevada?
  choices:
    A: El seguro de otro estado se acepta durante los primeros 90 días.
    B: No se acepta el seguro de otro estado.
    C: El seguro es opcional si el vehículo está pagado.
    D: Puede usar un seguro de otro estado si su proveedor es reconocido a nivel nacional.
  answer: B
  explanation: No se acepta el seguro de otro estado. Debe notificar a su compañía
    de seguros que se ha mudado o adquirir una nueva póliza en Nevada.
- id: 312
  category: vehicle_information
  question: ¿Qué debe hacer el mismo día si cancela su seguro de vehículo de Nevada
    y no obtiene un seguro nuevo?
  choices:
    A: Estacionar el vehículo en un garaje privado
    B: Notificar al departamento de policía local
    C: Cancelar el registro de su vehículo en Nevada y entregar sus placas de matrícula
    D: Solicitar un permiso de no operación
  answer: C
  explanation: Si un conductor cancela su seguro de Nevada y no obtiene un seguro
    nuevo, debe cancelar el registro de su vehículo en Nevada y entregar sus placas
    de matrícula el mismo día.
- id: 313
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos está exento del Informe de Inspección
    de Vehículos de Control de Emisiones (Smog Check) en los condados de Clark y Washoe?
  choices:
    A: Un vehículo a gasolina del año de modelo 2010
    B: Un vehículo a diésel del año de modelo 2005
    C: Un vehículo híbrido-eléctrico que tenga hasta cinco años de antigüedad de modelo
    D: Un vehículo a gasolina del año de modelo 1995
  answer: C
  explanation: Los vehículos híbridos-eléctricos que tienen hasta cinco años de antigüedad
    de modelo están exento del requisito de la prueba de emisiones (smog check).
- id: 314
  category: license_system
  question: ¿Qué sucede con la licencia de conducir después de un período de suspensión
    o revocación?
  choices:
    A: Se restablece automáticamente y se envía por correo al conductor.
    B: El conductor debe volver a solicitarla en una oficina del DMV y pagar las tarifas
      de restablecimiento.
    C: El conductor debe volver a tomar únicamente el examen de habilidades de conducción.
    D: La compañía de seguros del conductor la restablecerá automáticamente.
  answer: B
  explanation: Las licencias no se restablecen automáticamente después de una suspensión
    o revocación. Los conductores deben volver a solicitarlas en una oficina del DMV,
    presentar los documentos requeridos, cumplir con los requisitos y pagar las tarifas
    de restablecimiento.
- id: 315
  category: license_system
  question: ¿Qué eslogan utiliza el DMV de Nevada para animar a los clientes a usar
    su sitio web en lugar de visitar una oficina?
  choices:
    A: Evite la espera, actualice su placa
    B: Conéctese en línea, no haga fila (Get online, not in line)
    C: Conduzca seguro, ahorre tiempo
    D: Su DMV, en cualquier momento
  answer: B
  explanation: El manual anima a los clientes a ahorrar tiempo con el eslogan 'GET
    ONLINE, NOT IN LINE' (Conéctese en línea, no haga fila) visitando dmv.nv.gov.
- id: 316
  category: license_system
  question: ¿Aproximadamente cuántos servicios en línea ofrece el DMV de Nevada?
  choices:
    A: Exactamente diez
    B: Más de una docena
    C: Más de dos docenas
    D: Más de cincuenta
  answer: C
  explanation: Según el manual, 'El DMV de Nevada ofrece más de dos docenas de servicios
    en línea'.
- id: 317
  category: license_system
  question: ¿Cuál de los siguientes se enumera explícitamente como un servicio en
    línea ofrecido por el DMV de Nevada?
  choices:
    A: Cambios de dirección
    B: Exámenes de la vista
    C: Exámenes de conducir
    D: Inspecciones de vehículos
  answer: A
  explanation: El manual establece que los servicios en línea incluyen 'cambios de
    dirección, permisos de movimiento y pedidos de placas personalizadas'.
- id: 318
  category: vehicle_information
  question: ¿Qué tipo de permiso se puede obtener a través de los servicios en línea
    del DMV de Nevada?
  choices:
    A: Permisos de portación de armas ocultas
    B: Permisos de movimiento
    C: Permisos de construcción
    D: Permisos de estacionamiento comercial
  answer: B
  explanation: El manual enumera los 'permisos de movimiento' como uno de los servicios
    disponibles en línea.
- id: 319
  category: vehicle_information
  question: Si desea pedir placas de matrícula personalizadas, ¿cómo recomienda el
    DMV de Nevada que lo haga?
  choices:
    A: Llamando a la Patrulla de Caminos
    B: A través de sus servicios en línea
    C: Visitando una estación de policía local
    D: Enviando un formulario en papel por correo
  answer: B
  explanation: El manual incluye los 'pedidos de placas personalizadas' entre los
    servicios en línea ofrecidos en dmv.nv.gov.
- id: 320
  category: license_system
  question: ¿En cuál de las siguientes ciudades puede programar una cita en persona
    en una oficina del DMV de Nevada?
  choices:
    A: Elko
    B: Henderson
    C: Winnemucca
    D: Ely
  answer: B
  explanation: El manual establece que se puede programar una cita en las oficinas
    de 'Carson City, Henderson, Las Vegas y Reno'.
- id: 321
  category: license_system
  question: ¿Qué servicio de notificación ofrece el DMV de Nevada para las citas programadas?
  choices:
    A: Llamadas telefónicas automatizadas
    B: Recordatorios por mensaje de texto
    C: Recordatorios por correo postal
    D: Notificaciones push a través de una aplicación móvil
  answer: B
  explanation: 'Al programar una cita, el manual indica: "Le enviaremos recordatorios
    por mensaje de texto".'
- id: 322
  category: license_system
  question: ¿Cuál es el beneficio de programar una cita antes de visitar el DMV en
    persona?
  choices:
    A: Recibe un descuento en sus tarifas de registro
    B: No tiene que realizar un examen de la vista
    C: Hay una fila de registro separada una vez que llega
    D: Se le garantiza que aprobará su examen de conducir
  answer: C
  explanation: El manual establece que si programa una cita, "hay una fila de registro
    separada una vez que llega".
- id: 323
  category: vehicle_information
  question: ¿Qué artículo relacionado con el vehículo se puede imprimir en el acto
    en un quiosco DMV NOW?
  choices:
    A: Títulos de propiedad del vehículo
    B: Calcomanías de la placa de matrícula
    C: Certificados de control de emisiones (smog check)
    D: Tarjetas de seguro
  answer: B
  explanation: Según el manual, "los quioscos imprimen calcomanías de placas de matrícula
    e historiales de conductor en el acto".
- id: 324
  category: license_system
  question: Además de las calcomanías de las placas de matrícula, ¿qué más se puede
    imprimir en un quiosco DMV NOW?
  choices:
    A: Historiales de conductor
    B: Certificados de nacimiento
    C: Tarjetas de registro de votantes
    D: Solicitudes de pasaporte
  answer: A
  explanation: El manual establece explícitamente que los quioscos imprimen "calcomanías
    de placas de matrícula e historiales de conductor en el acto".
- id: 325
  category: license_system
  question: ¿Qué método de pago se menciona explícitamente como aceptado por muchos
    quioscos DMV NOW?
  choices:
    A: Cheques personales
    B: Criptomonedas
    C: Efectivo
    D: Giros postales
  answer: C
  explanation: El manual señala con respecto a los quioscos DMV NOW que "muchos aceptan
    efectivo".
- id: 326
  category: license_system
  question: ¿Dónde debe buscar en línea para encontrar la ubicación de un quiosco
    DMV NOW?
  choices:
    A: dmv.nv.gov/locations
    B: dmv.nv.gov/kiosk
    C: nv.gov/dmv-kiosk
    D: dmv.nv.gov/appointments
  answer: B
  explanation: El manual dirige a los usuarios a "consulte dmv.nv.gov/kiosk para ver
    las ubicaciones".
- id: 327
  category: safe_driving_rules
  question: ¿Cuál de las siguientes organizaciones es reconocida por contribuir al
    manual del conductor de Nevada?
  choices:
    A: Motorcycle Safety Foundation (Fundación para la Seguridad de las Motocicletas)
    B: Sociedad Nacional de Peatones
    C: Asociación de Camioneros de Nevada
    D: Cruz Roja Americana
  answer: A
  explanation: La "Motorcycle Safety Foundation" figura entre las organizaciones y
    agencias reconocidas por sus contribuciones y asistencia.
- id: 328
  category: license_system
  question: ¿Cuál de las siguientes ciudades figura como un lugar donde se puede programar
    una cita en el DMV?
  choices:
    A: Sparks
    B: Carson City
    C: Boulder City
    D: Mesquite
  answer: B
  explanation: El manual enumera a Carson City, Henderson, Las Vegas y Reno como oficinas
    donde se puede programar una cita.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 329
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 330
- image: wrong_way.png
  category: signs_and_signals
  question: ¿Qué debe hacer si ve esta señal?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 331
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 332
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 333
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 334
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 335
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 336
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 337
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 338
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril se coloca en
    los cruces de tren. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 339
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa giro a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 340
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    gire primero hacia un lado y luego hacia el otro.
  id: 341
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 342
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 343
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 344
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 345
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    vigente pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 346
