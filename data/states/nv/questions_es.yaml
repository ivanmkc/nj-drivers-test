questions:
- id: 1
  category: license_system
  question: ¿En Nevada, cuál es la edad mínima a la que una persona puede solicitar
    un permiso de instrucción?
  choices:
    A: 15 años
    B: 15 años y medio
    C: 16 años
    D: 14 años y medio
  answer: B
  explanation: Según el Manual del Conductor de Nevada, una persona debe tener al
    menos 15 años y medio para solicitar un permiso de instrucción.
- id: 2
  category: license_system
  question: ¿El titular de un permiso de instrucción de Nevada debe estar acompañado
    por un conductor con licencia que tenga al menos cuántos años?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: B
  explanation: El conductor supervisor debe tener al menos 21 años, contar con al
    menos un año de experiencia de conducción con licencia y estar sentado junto al
    titular del permiso.
- id: 3
  category: license_system
  question: 'Durante los primeros seis meses después de recibir una licencia de conducir
    de Nevada, un conductor menor de 18 años no puede transportar a ningún pasajero
    menor de 18 años, excepto por:'
  choices:
    A: Amigos de la escuela
    B: Compañeros de trabajo
    C: Miembros de la familia inmediata
    D: No se permiten excepciones
  answer: C
  explanation: La ley de Nevada prohíbe a los conductores menores de 18 años transportar
    pasajeros menores de 18 años (excepto familiares inmediatos) durante los primeros
    seis meses de haber obtenido la licencia.
- id: 4
  category: license_system
  question: ¿Cuál es el toque de queda estatal para los conductores de Nevada menores
    de 18 años?
  choices:
    A: 9 PM a 6 AM
    B: 10 PM a 5 AM
    C: 11 PM a 5 AM
    D: Medianoche a 6 AM
  answer: B
  explanation: Por lo general, a los conductores menores de 18 años no se les permite
    conducir entre las 10 PM y las 5 AM, a menos que viajen hacia o desde un evento
    programado como la escuela o el trabajo.
- id: 5
  category: license_system
  question: Para solicitar una licencia de conducir de Nevada, ¿cuántas horas de práctica
    de conducción supervisada debe completar un menor?
  choices:
    A: 30 horas en total, 5 por la noche
    B: 40 horas en total, 10 por la noche
    C: 50 horas en total, 10 por la noche
    D: 100 horas en total, 20 por la noche
  answer: C
  explanation: Nevada requiere 50 horas de experiencia supervisada, 10 de las cuales
    deben ser por la noche, documentadas en un registro aprobado por el DMV.
- id: 6
  category: license_system
  question: ¿Los nuevos residentes de Nevada deben obtener una licencia de conducir
    de Nevada dentro de cuántos días después de establecer la residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La ley de Nevada exige que los nuevos residentes transfieran su licencia
    de otro estado a una licencia de Nevada en un plazo de 30 días.
- id: 7
  category: license_system
  question: Si cambia su dirección dentro de Nevada, ¿dentro de cuántos días debe
    notificar al DMV?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Nevada le exige notificar al DMV sobre un cambio de dirección
    o de nombre en un plazo de 30 días.
- id: 8
  category: license_system
  question: ¿Cuál es el requisito mínimo de visión para obtener una licencia de conducir
    de Nevada sin restricciones?
  choices:
    A: 20/20 en ambos ojos
    B: 20/40 en ambos ojos
    C: 20/50 en un ojo
    D: 20/100 en ambos ojos
  answer: B
  explanation: Nevada requiere una visión mínima de 20/40 en ambos ojos. Si necesita
    anteojos o lentes de contacto para lograr esto, se colocará una restricción en
    su licencia.
- id: 9
  category: license_system
  question: En Nevada, ¿su licencia de conducir será suspendida si acumula cuántos
    puntos en un período de 12 meses?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: El DMV de Nevada suspenderá su licencia por 6 meses si recibe 12 o
    más puntos de demérito en cualquier período de 12 meses.
- id: 10
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    para un vehículo motorizado en Nevada?
  choices:
    A: 15/30/10
    B: 25/50/20
    C: 50/100/50
    D: 10/20/10
  answer: B
  explanation: Nevada requiere una cobertura mínima de responsabilidad civil de $25,000
    por lesiones corporales a una persona, $50,000 por lesiones corporales a dos o
    más personas y $20,000 por daños a la propiedad.
- id: 11
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción de Nevada a partir
    de la fecha de emisión?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que el solicitante cumpla 18 años
  answer: B
  explanation: Un permiso de instrucción de Nevada es válido por un año a partir de
    la fecha en que se emite.
- id: 12
  category: license_system
  question: ¿Qué clase de licencia de conducir de Nevada se requiere para operar automóviles
    de pasajeros y camiones estándar?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase M
  answer: C
  explanation: La Clase C es la licencia de conducir estándar para automóviles, camionetas
    y furgonetas con una Clasificación de Peso Bruto Vehicular (GVWR) de menos de
    26,001 libras.
- id: 13
  category: license_system
  question: En Nevada, ¿por cuál de las siguientes razones no relacionadas con la
    conducción se puede suspender la licencia de conducir de un menor?
  choices:
    A: Ausentismo escolar habitual
    B: No pagar multas de la biblioteca
    C: Bajas calificaciones en educación física
    D: No participar en actividades extracurriculares
  answer: A
  explanation: La ley de Nevada permite la suspensión de la licencia de un menor o
    el retraso de su emisión por ausentismo escolar habitual o por ciertos delitos
    relacionados con el alcohol o las drogas.
- id: 14
  category: license_system
  question: 'Al registrar un vehículo en Nevada, debe proporcionar evidencia de seguro.
    Este seguro debe ser emitido por:'
  choices:
    A: Cualquier compañía de seguros en los Estados Unidos
    B: Una compañía autorizada para realizar negocios en Nevada
    C: Una compañía con sede en el estado de residencia anterior del propietario
    D: El gobierno federal
  answer: B
  explanation: Nevada requiere que el seguro sea proporcionado por una compañía autorizada
    para realizar negocios en el estado de Nevada.
- id: 15
  category: license_system
  question: Para obtener una licencia de Nevada que cumpla con la 'Real ID', ¿cuál
    de los siguientes debe proporcionar?
  choices:
    A: Prueba de identidad, número de Seguro Social y dos comprobantes de residencia
      en Nevada
    B: Solo un certificado de nacimiento
    C: Solo una factura de servicios públicos
    D: Una declaración verbal de residencia
  answer: A
  explanation: Los requisitos federales de Real ID adoptados por Nevada exigen prueba
    de identidad (como un pasaporte o certificado de nacimiento), número de Seguro
    Social y dos documentos que demuestren la dirección residencial en Nevada.
- id: 16
  category: license_system
  question: En Nevada, si completa una escuela de seguridad vial aprobada por el DMV,
    ¿cuántos puntos de demérito se eliminarán de su historial de conducción?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: Según la ley de Nevada, completar una escuela de seguridad vial aprobada
    resultará en una reducción de 3 puntos en su historial de conducción, pero esto
    solo se puede hacer una vez cada 12 meses.
- id: 17
  category: license_system
  question: ¿Por cuántos años son válidas la mayoría de las licencias de conducir
    de Nevada emitidas a residentes de entre 16 y 64 años?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: En Nevada, las licencias de conducir estándar para residentes de 16
    a 64 años se emiten normalmente por un período de 8 años.
- id: 18
  category: license_system
  question: Para las personas que no pueden cumplir con los requisitos de presencia
    legal para una licencia estándar de Nevada, ¿qué documento alternativo ofrece
    el estado para fines de conducción?
  choices:
    A: Permiso de Conducción Temporal
    B: Tarjeta de Autorización de Conducir (DAC)
    C: Certificado de Conducción para No Residentes
    D: Licencia de Propósito Limitado
  answer: B
  explanation: La Tarjeta de Autorización de Conducir (DAC) está disponible para los
    residentes de Nevada que no pueden cumplir con los requisitos de prueba de identidad/presencia
    legal para una licencia estándar o Real ID.
- id: 19
  category: license_system
  question: En el sistema de puntos de demérito de Nevada, ¿cuánto tiempo permanecen
    los puntos en su historial de conductor desde la fecha de la condena?
  choices:
    A: 6 meses
    B: 12 meses
    C: 24 meses
    D: 36 meses
  answer: B
  explanation: Los puntos de demérito permanecen en su historial de conducción de
    Nevada durante 12 meses a partir de la fecha de la condena.
- id: 20
  category: license_system
  question: Si su licencia de conducir de Nevada ha estado vencida por más de ________,
    se le requerirá volver a tomar los exámenes de la vista, de conocimientos y de
    habilidades.
  choices:
    A: 30 días
    B: 6 meses
    C: Un año
    D: Dos años
  answer: C
  explanation: Si una licencia de Nevada está vencida por un año o más, el solicitante
    debe volver a tomar todos los exámenes requeridos (vista, escrito y conducción).
- id: 21
  category: license_system
  question: ¿En Nevada, conducir de 1 a 10 millas por hora sobre el límite de velocidad
    establecido resulta en cuántos puntos de demérito?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: A
  explanation: El sistema de puntos de Nevada asigna 1 punto de demérito por exceder
    el límite de velocidad de 1 a 10 mph.
- id: 22
  category: license_system
  question: Según la ley de Nevada, ¿una condena por 'Conducción Temeraria' (Reckless
    Driving) resulta en cuántos puntos de demérito agregados a su registro?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: La conducción temeraria es una infracción grave en Nevada y conlleva
    una penalización de 8 puntos de demérito.
- id: 23
  category: license_system
  question: Para mantener su privilegio de conducir en Nevada, un menor de 18 años
    debe cumplir con ¿cuál de los siguientes requisitos escolares?
  choices:
    A: Mantener un promedio de calificaciones (GPA) de 3.0
    B: No tener más de 5 ausencias injustificadas
    C: Cumplir con un registro de asistencia escolar mínima del 90%
    D: Estar inscrito en al menos dos actividades extracurriculares
  answer: C
  explanation: La ley de Nevada exige que los menores mantengan al menos un 90% de
    asistencia escolar para conservar su licencia o permiso de conducir.
- id: 24
  category: license_system
  question: 'En Nevada, a un infractor de DUI por primera vez con un nivel de alcohol
    en sangre (BAC) de 0.08% o superior generalmente se le requiere instalar un Dispositivo
    de Bloqueo de Encendido (IID) por un mínimo de:'
  choices:
    A: 30 días
    B: 90 días
    C: 185 días
    D: Un año
  answer: C
  explanation: La ley de Nevada exige que la mayoría de los infractores de DUI por
    primera vez instalen un IID durante 185 días (aproximadamente 6 meses) como condición
    para restablecer su privilegio de conducir.
- id: 25
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción de motocicleta
    de Nevada (Clase M)?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que el conductor cumpla 21 años
  answer: B
  explanation: Un permiso de instrucción de motocicleta de Nevada es válido por un
    año a partir de la fecha de emisión.
- id: 26
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un Permiso de Aprendizaje Comercial
    (CLP) en Nevada?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Un solicitante debe tener al menos 18 años para solicitar un Permiso
    de Aprendizaje Comercial en Nevada.
- id: 27
  category: license_system
  question: Si recibe una citación de tráfico en Nevada y no comparece ante el tribunal
    o no paga la multa, ¿qué medida tomará el DMV?
  choices:
    A: Emitir una multa doble
    B: Suspender su licencia de conducir
    C: Confiscar su vehículo
    D: Requerir que vuelva a tomar el examen de conducir
  answer: B
  explanation: El DMV de Nevada suspenderá su licencia de conducir si no comparece
    ante el tribunal por una citación de tráfico o si no paga las multas requeridas.
- id: 28
  category: license_system
  question: Para que la designación de 'VETERANO' aparezca impresa en una licencia
    de conducir de Nevada, ¿qué debe proporcionar el solicitante al DMV?
  choices:
    A: Una carta de su oficial al mando
    B: Una tarjeta de identificación militar válida
    C: Un formulario DD-214 u otro comprobante de baja honorable
    D: Evidencia de inscripción actual en el VA
  answer: C
  explanation: Los veteranos de Nevada deben proporcionar un DD-214 u otra documentación
    oficial que muestre una baja honorable para recibir la designación de veterano
    en su licencia.
- id: 29
  category: license_system
  question: ¿Con qué total de puntos de demérito el DMV de Nevada envía por primera
    vez una carta de advertencia a un conductor con respecto a su registro?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 9 puntos
    D: 12 puntos
  answer: A
  explanation: El DMV de Nevada envía una carta de advertencia a los conductores que
    han acumulado entre 3 y 11 puntos en su registro.
- id: 30
  category: license_system
  question: En Nevada, si un conductor es condenado por 'No ceder el paso' (Failure
    to yield the right-of-way), ¿cuántos puntos de demérito se asignan a su registro
    de conducir?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: No ceder el paso es una infracción de 4 puntos en el sistema de puntos
    de demérito de Nevada.
- id: 31
  category: driver_testing
  question: ¿Si reprueba el examen de conocimientos escrito de Nevada, qué tan pronto
    se le permite volver a tomarlo?
  choices:
    A: Inmediatamente
    B: El siguiente día hábil
    C: Después de 7 días
    D: Después de 30 días
  answer: B
  explanation: Según el DMV de Nevada, si reprueba el examen de conocimientos, puede
    volver a tomarlo tan pronto como el siguiente día hábil. Las repeticiones están
    sujetas a cargos de examen adicionales.
- id: 32
  category: driver_testing
  question: Al llegar para su examen de habilidades (práctico) de Nevada, ¿cuál de
    los siguientes debe proporcionar para el vehículo que está utilizando?
  choices:
    A: Un certificado de inspección del vehículo de un mecánico privado
    B: Una factura de venta con fecha de los últimos 30 días
    C: Registro vigente y comprobante de seguro de responsabilidad civil de Nevada
    D: El título del vehículo (título de propiedad)
  answer: C
  explanation: Para el examen práctico de Nevada, el vehículo debe estar debidamente
    registrado y asegurado. Debe presentar la tarjeta de registro y el comprobante
    de seguro de responsabilidad civil de Nevada al momento del examen.
- id: 33
  category: driver_testing
  question: En el sistema de puntos de demérito de Nevada, ¿cuántos puntos se asignan
    a su historial de conducción por una condena de Conducción Temeraria (Reckless
    Driving)?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: La conducción temeraria se considera una infracción de tráfico grave
    en Nevada y resulta en la adición de 8 puntos de demérito al historial del conductor.
- id: 34
  category: driver_testing
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) para un
    conductor que opera un vehículo motorizado comercial en Nevada?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Si bien el límite legal para los conductores estándar es del 0.08%,
    el límite para los conductores comerciales (titulares de CDL) en Nevada es del
    0.04%.
- id: 35
  category: driver_testing
  question: 'En Nevada, se considera que un conductor menor de 21 años conduce bajo
    la influencia si su concentración de alcohol en sangre (BAC) es de al menos:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Nevada tiene una política de 'Tolerancia Cero' para menores. Se prohíbe
    a los conductores menores de 21 años conducir con un BAC de 0.02% o superior.
- id: 36
  category: driver_testing
  question: ¿Cuántos puntos de demérito se asignan a un conductor de Nevada por 'Rebasar
    a un autobús escolar cuando las señales están parpadeando'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Rebasar ilegalmente a un autobús escolar que tiene sus luces rojas
    parpadeando y el brazo de parada extendido resulta en 4 puntos de demérito en
    Nevada.
- id: 37
  category: driver_testing
  question: En Nevada, una primera infracción por usar un dispositivo de comunicación
    inalámbrico portátil mientras se conduce no es una infracción de movimiento. Sin
    embargo, ¿una segunda infracción dentro de 7 años resultará en cuántos puntos
    de demérito?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Según NRS 484B.165, una segunda condena o posterior por usar un dispositivo
    portátil mientras se conduce dentro de un período de 7 años se considera una infracción
    de movimiento y conlleva 4 puntos de demérito.
- id: 38
  category: driver_testing
  question: ¿Hacer una vuelta en U ilegal en Nevada resultará en cuántos puntos de
    demérito agregados a su historial de conducción?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: El DMV de Nevada asigna 3 puntos de demérito por condenas relacionadas
    con realizar una vuelta en U ilegal.
- id: 39
  category: driver_testing
  question: En el sistema de puntos de demérito de Nevada, la 'Conducción Descuidada'
    (Careless Driving) conlleva una penalización de ¿cuántos puntos?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción descuidada se penaliza con 6 puntos de demérito en Nevada,
    lo cual es ligeramente inferior a los 8 puntos por conducción temeraria.
- id: 40
  category: driver_testing
  question: No ceder el paso a un vehículo de emergencia (violando la ley 'Move Over'
    o de 'Hacerse a un lado') en Nevada resulta en ¿cuántos puntos de demérito?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: No ceder el paso a un vehículo de emergencia es una infracción de movimiento
    que conlleva 4 puntos de demérito en Nevada.
- id: 41
  category: driver_testing
  question: Si su licencia de Nevada es suspendida por un DUI o por otras infracciones
    de alto puntaje, ¿por cuánto tiempo se le puede exigir que mantenga un certificado
    de responsabilidad financiera SR-22?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: La ley de Nevada generalmente requiere que los conductores mantengan
    un SR-22 (Certificado de Responsabilidad Financiera) durante 3 años tras la restitución
    de una licencia después de ciertas suspensiones.
- id: 42
  category: driver_testing
  question: ¿A cuál de las siguientes restricciones está sujeto el titular de un permiso
    de instrucción de motocicleta en Nevada?
  choices:
    A: Solo puede conducir durante las horas de luz diurna
    B: No puede llevar pasajeros
    C: No puede conducir en autopistas o carreteras de alta velocidad
    D: Todas las anteriores
  answer: D
  explanation: Los titulares de permisos de motocicleta en Nevada están limitados
    únicamente a las horas de luz diurna, tienen prohibido llevar pasajeros y no pueden
    conducir en autopistas o carreteras de acceso limitado.
- id: 43
  category: driver_testing
  question: 'En Nevada, una condena por grafiti (vandalismo) puede resultar en la
    suspensión de su licencia de conducir por hasta:'
  choices:
    A: 30 días
    B: 90 días
    C: 1 año
    D: 2 años
  answer: D
  explanation: Según la ley NRS 206.330, un tribunal puede suspender la licencia de
    conducir de Nevada de una persona por un periodo de 6 meses a 2 años por una condena
    relacionada con grafiti.
- id: 44
  category: driver_testing
  question: ¿Cuántos puntos de demérito se asignan por conducir a 41 millas por hora
    o más sobre el límite de velocidad señalizado en Nevada?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: En Nevada, conducir a 41 mph o más sobre el límite es el nivel más
    alto de infracciones por exceso de velocidad y conlleva 5 puntos de demérito.
- id: 45
  category: driver_testing
  question: Para aprobar el examen de conocimientos (escrito) de Nevada, ¿cuál es
    el puntaje mínimo requerido?
  choices:
    A: 70% (35 de 50 preguntas correctas)
    B: 75% (38 de 50 preguntas correctas)
    C: 80% (40 de 50 preguntas correctas)
    D: 85% (43 de 50 preguntas correctas)
  answer: C
  explanation: El examen de conocimientos del DMV de Nevada consta de 50 preguntas
    de opción múltiple. El puntaje de aprobación es del 80%, lo que significa que
    debe responder correctamente al menos 40 preguntas.
- id: 46
  category: driver_testing
  question: Al realizar el examen de habilidades (práctico) de Nevada, ¿cuál de los
    siguientes es responsabilidad del solicitante proporcionar?
  choices:
    A: Un vehículo con registro válido y comprobante de seguro
    B: Un vehículo proporcionado por el DMV mediante el pago de una tarifa
    C: Un vehículo con al menos una luz de freno que funcione
    D: Un vehículo con solo un permiso temporal
  answer: A
  explanation: Los solicitantes deben proporcionar su propio vehículo para el examen
    de carretera. El vehículo debe estar debidamente registrado, asegurado y en condiciones
    seguras de funcionamiento (incluyendo luces, frenos y neumáticos en buen estado).
- id: 47
  category: driver_testing
  question: En Nevada, ¿cuántos puntos de demérito se asignan a su historial de conducción
    por una condena de 'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 10 puntos
  answer: C
  explanation: Bajo el sistema de puntos de demérito de Nevada, la Conducción Temeraria
    es una infracción mayor que conlleva 8 puntos de demérito.
- id: 48
  category: driver_testing
  question: Si es condenado por exceso de velocidad de 11 a 20 millas por hora sobre
    el límite señalizado en Nevada, ¿cuántos puntos de demérito se añadirán a su licencia?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Nevada asigna 2 puntos de demérito por exceso de velocidad de 11 a
    20 mph sobre el límite. (De 1 a 10 mph sobre el límite es 1 punto; de 21 a 30
    mph sobre el límite son 3 puntos).
- id: 49
  category: driver_testing
  question: Bajo la ley de 'Consentimiento Implícito' (Implied Consent) de Nevada,
    ¿qué sucede si se niega a someterse a una prueba química de aliento, sangre u
    orina cuando lo solicita un oficial?
  choices:
    A: Se le dará una advertencia por la primera negativa
    B: Su licencia de conducir será revocada por al menos un año
    C: Se le exigirá pagar una multa de $100 y podrá seguir conduciendo
    D: Su vehículo será confiscado por 30 días pero conservará su licencia
  answer: B
  explanation: Al conducir en Nevada, usted ha dado su consentimiento para realizar
    pruebas químicas. La negativa resulta en la incautación inmediata de su licencia
    y un periodo de revocación de al menos un año.
- id: 50
  category: driver_testing
  question: 'Si se ve involucrado en un accidente de tráfico en Nevada que resulte
    en daños a la propiedad de $750 o más, y el accidente no fue investigado por la
    policía, debe informarlo al DMV en un plazo de:'
  choices:
    A: 24 horas
    B: 48 horas
    C: 5 días
    D: 10 días
  answer: D
  explanation: Si un accidente no es investigado por un oficial de la ley e involucra
    lesiones o daños a la propiedad de $750 o más, debe completar y enviar un Informe
    de Accidente de Tráfico (SR-1) al DMV en un plazo de 10 días.
- id: 51
  category: driver_testing
  question: En Nevada, ¿a cuántos pies de distancia de un vehículo que viene en sentido
    contrario debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Nevada exige que los conductores cambien a luces bajas cuando
    se encuentren a menos de 500 pies de un vehículo que viene en sentido contrario.
- id: 52
  category: driver_testing
  question: El Manual del Conductor de Nevada recomienda una distancia de seguimiento
    de al menos ¿cuántos segundos detrás del vehículo que va delante de usted?
  choices:
    A: 1 segundo
    B: 2 a 4 segundos
    C: 5 a 7 segundos
    D: 10 segundos
  answer: B
  explanation: Nevada recomienda una distancia de seguimiento de al menos 2 a 4 segundos
    para permitir suficiente tiempo para reaccionar ante peligros o paradas repentinas.
- id: 53
  category: driver_testing
  question: 'En Nevada, los giros en U generalmente están prohibidos en distritos
    comerciales, excepto:'
  choices:
    A: Durante las horas nocturnas
    B: Cuando no hay tráfico en 500 pies
    C: En intersecciones o en autopistas divididas donde exista una apertura adecuada
    D: Si el vehículo mide menos de 20 pies de largo
  answer: C
  explanation: En Nevada, los giros en U están prohibidos en distritos comerciales,
    excepto en intersecciones o en autopistas divididas donde se proporcione una apertura
    o señal adecuada.
- id: 54
  category: driver_testing
  question: Cuando un autobús escolar se detiene en una autopista dividida con una
    mediana física o barrera, ¿qué vehículos deben detenerse ante las luces rojas
    intermitentes del autobús?
  choices:
    A: Vehículos en todos los carriles y en ambas direcciones
    B: Solo los vehículos que viajan en la misma dirección que el autobús
    C: Solo los vehículos que viajan en la dirección opuesta al autobús
    D: No se requiere que ningún vehículo se detenga en una autopista dividida
  answer: B
  explanation: En Nevada, si una barrera física o mediana separa la carretera, solo
    el tráfico que viaja en la misma dirección que el autobús escolar debe detenerse.
    En carreteras no divididas, el tráfico en ambas direcciones debe detenerse.
- id: 55
  category: driver_testing
  question: La ley de "Hacerse a un lado" (Move Over) de Nevada exige que los conductores
    se muevan a un carril adyacente (si es seguro) o reduzcan la velocidad al acercarse
    a ¿qué tipo de vehículo estacionado con luces intermitentes?
  choices:
    A: Solo vehículos de emergencia
    B: Solo grúas
    C: Solo vehículos de servicios públicos y del NDOT
    D: Todos los anteriores
  answer: D
  explanation: La ley de Nevada exige que los conductores reduzcan la velocidad y,
    si es posible, se muevan a un carril no adyacente al pasar cualquier vehículo
    de emergencia, grúa o vehículo de servicios públicos estacionado con luces intermitentes.
- id: 56
  category: driver_testing
  question: Según la ley de Nevada, ¿quién debe usar el cinturón de seguridad en un
    vehículo motorizado en movimiento?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: El conductor y todos los pasajeros en todas las posiciones de asiento
    D: Solo el conductor
  answer: C
  explanation: En Nevada, el conductor y todos los pasajeros de 6 años o más (o que
    pesen más de 60 libras) deben usar el cinturón de seguridad si el vehículo está
    equipado con ellos.
- id: 57
  category: driver_responsibility
  question: ¿Cuál es la multa por una primera infracción de un vehículo registrado
    en Nevada que tiene un lapso de seguro de 1 a 30 días (sin lapsos previos)?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: La ley de Nevada exige una multa de $250 por el primer lapso de seguro
    del registro de un vehículo, además de las tarifas de restablecimiento.
- id: 58
  category: driver_responsibility
  question: Cuando vende o entrega su vehículo como parte de pago en Nevada, ¿qué
    debe hacer con las placas de matrícula?
  choices:
    A: Dejarlas en el vehículo para el nuevo propietario
    B: Destruirlas inmediatamente
    C: Conservarlas y entregarlas al DMV en un plazo de 60 días si no se transfieren
      a otro vehículo
    D: Conservarlas y entregarlas al DMV en un plazo de 1 año
  answer: C
  explanation: En Nevada, las placas de matrícula permanecen con el propietario, no
    con el vehículo. Debe quitarlas y transferirlas a otro vehículo o entregarlas
    al DMV en un plazo de 60 días.
- id: 59
  category: driver_responsibility
  question: En las áreas urbanas de los condados de Clark y Washoe, ¿durante cuántos
    años están exentos de las pruebas de emisiones (smog) la mayoría de los vehículos
    de gasolina después de su registro inicial?
  choices:
    A: Solo el primer año
    B: Los primeros dos años
    C: Los primeros cinco años
    D: Nunca están exentos
  answer: B
  explanation: Los vehículos nuevos están exentos de las pruebas de emisiones durante
    sus dos primeros años de registro en Nevada.
- id: 60
  category: driver_responsibility
  question: 'Bajo la ley de "Consentimiento Implícito" (Implied Consent) de Nevada,
    al conducir un vehículo usted ha aceptado:'
  choices:
    A: Llevar siempre a un pasajero
    B: Someterse a una prueba química de aliento, sangre u orina si lo solicita un
      oficial
    C: Permitir que cualquier persona tome prestado su vehículo
    D: Pagar por cualquier daño que cause independientemente de la culpa
  answer: B
  explanation: La ley de Consentimiento Implícito significa que al operar un vehículo
    en las carreteras de Nevada, usted ha dado su consentimiento para realizar pruebas
    químicas de alcohol o drogas si un oficial tiene motivos razonables para creer
    que está conduciendo bajo la influencia (DUI).
- id: 61
  category: driver_responsibility
  question: ¿Bajo el sistema de puntos de demérito de Nevada, cuántos puntos se asignan
    por 'Seguir demasiado de cerca'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Seguir demasiado de cerca es una infracción de 4 puntos en el sistema
    de puntos de demérito de Nevada.
- id: 62
  category: driver_responsibility
  question: ¿Cuántos puntos de demérito se añaden a su historial de conducción de
    Nevada por exceder el límite de velocidad establecido por 11–20 millas por hora?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Exceder el límite de velocidad por 11–20 mph resulta en 2 puntos de
    demérito en Nevada.
- id: 63
  category: driver_responsibility
  question: En Nevada, ¿es ilegal fumar tabaco en un vehículo si está presente un
    niño de qué edad?
  choices:
    A: Menor de 6 años
    B: Menor de 12 años
    C: Menor de 18 años
    D: Menor de 21 años
  answer: C
  explanation: La ley de Nevada (NRS 202.2491) prohíbe fumar en un vehículo cuando
    está presente un niño menor de 18 años.
- id: 64
  category: driver_responsibility
  question: ¿Cuál es la multa base por una primera condena por usar un teléfono celular
    portátil mientras se conduce en Nevada?
  choices:
    A: $25
    B: $50
    C: $150
    D: $250
  answer: B
  explanation: La multa base por una primera infracción por usar un dispositivo de
    comunicaciones inalámbricas portátil mientras se conduce es de $50. Las multas
    aumentan por infracciones posteriores.
- id: 65
  category: driver_responsibility
  question: En Nevada, ¿quién es responsable de asegurar que todos los pasajeros menores
    de 18 años lleven puesto el cinturón de seguridad o estén en un sistema de retención
    infantil apropiado?
  choices:
    A: El pasajero mismo
    B: Los padres del pasajero, incluso si no están en el auto
    C: El conductor
    D: Nadie; es opcional para los pasajeros en el asiento trasero
  answer: C
  explanation: El conductor es responsable de asegurar que todos los pasajeros menores
    de 18 años estén debidamente sujetos. La ley de Nevada exige el uso del cinturón
    de seguridad para todos los ocupantes.
- id: 66
  category: driver_responsibility
  question: La ley de 'Contenedor Abierto' de Nevada prohíbe la posesión de un contenedor
    abierto de una bebida alcohólica ¿en qué parte del vehículo?
  choices:
    A: Solo en el maletero
    B: En el área de pasajeros
    C: Solo en la guantera
    D: Detrás del asiento trasero en un vehículo con puerta trasera (hatchback)
  answer: B
  explanation: Es ilegal tener un contenedor abierto de una bebida alcohólica en el
    área de pasajeros de un vehículo motorizado en una vía pública.
- id: 67
  category: driver_responsibility
  question: En Nevada, si usted está involucrado en un accidente de tráfico que cause
    daños a la propiedad de $_______ o más, debe presentar un Informe de Accidente
    de Tráfico (SR-1) ante el DMV.
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: De acuerdo con la ley de Nevada, cualquier accidente que resulte en
    lesiones corporales o daños a la propiedad de $750 o más debe ser reportado al
    DMV utilizando el formulario SR-1.
- id: 68
  category: driver_responsibility
  question: Si un conductor de Nevada está involucrado en un accidente que debe reportarse,
    ¿dentro de cuántos días debe presentarse el Informe de Accidente de Tráfico (SR-1)
    ante el DMV?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: La ley de Nevada exige que los conductores presenten el Informe de
    Accidente de Tráfico SR-1 dentro de los 10 días posteriores al suceso si hay lesiones,
    muerte o daños que superen los $750.
- id: 69
  category: driver_responsibility
  question: Bajo el programa LIVE de Nevada, ¿cuál es la multa por una primera interrupción
    del seguro de 1 a 30 días?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Para una primera interrupción del seguro de 1 a 30 días, Nevada impone
    una multa de $250 además de las tarifas de restablecimiento.
- id: 70
  category: driver_responsibility
  question: Si el registro de su vehículo en Nevada es suspendido debido a una interrupción
    del seguro, ¿cuál es la tarifa estándar de restablecimiento por una primera infracción?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: Para restablecer un registro suspendido por una interrupción del seguro
    en Nevada, el propietario debe pagar una tarifa de restablecimiento de $250 más
    cualquier multa aplicable.
- id: 71
  category: driver_responsibility
  question: ¿En Nevada, si la interrupción de su seguro excede los 90 días, por cuánto
    tiempo se le requiere mantener un certificado SR-22?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Si un conductor de Nevada tiene una interrupción del seguro de más
    de 90 días, debe presentar un SR-22 (Certificado de Responsabilidad Financiera)
    durante tres años.
- id: 72
  category: driver_responsibility
  question: ¿En qué condados de Nevada se requiere generalmente una inspección de
    smog (prueba de emisiones) para el registro del vehículo?
  choices:
    A: En todos los condados de Nevada
    B: Solo en los condados de Clark y Washoe
    C: Solo en los condados de Clark y Elko
    D: Solo en Carson City y el condado de Washoe
  answer: B
  explanation: Se requieren pruebas de emisiones en los condados de Clark y Washoe
    para la mayoría de los vehículos impulsados por gasolina y diésel.
- id: 73
  category: driver_responsibility
  question: Si el sistema Nevada LIVE no puede verificar su seguro, el DMV enviará
    una solicitud de verificación. ¿Cuántos días tiene para responder antes de que
    se suspenda su registro?
  choices:
    A: 10 días
    B: 15 días
    C: 20 días
    D: 30 días
  answer: B
  explanation: Si el sistema Nevada LIVE no logra verificar el seguro, el DMV envía
    un aviso. Debe proporcionar prueba de cobertura dentro de los 15 días para evitar
    la suspensión.
- id: 74
  category: driver_responsibility
  question: 'Si choca con un vehículo desatendido en Nevada y no puede encontrar al
    propietario, usted debe:'
  choices:
    A: Esperar al menos dos horas a que regrese el dueño
    B: Dejar una nota con su nombre, dirección e información del vehículo en un lugar
      visible
    C: Conducir a la estación de policía más cercana dentro de las 48 horas
    D: Llamar a una grúa para mover el otro vehículo
  answer: B
  explanation: La ley de Nevada exige que localice al propietario o deje un aviso
    por escrito con su información de contacto y los detalles del vehículo en un lugar
    seguro y visible en el vehículo desatendido.
- id: 75
  category: driver_responsibility
  question: Si se ve involucrado en un accidente en Nevada y no tiene seguro de responsabilidad
    civil, ¿qué podría exigirle el DMV que haga para cubrir posibles daños?
  choices:
    A: Realizar 100 horas de servicio comunitario
    B: Depositar una garantía (efectivo o fianza) ante el DMV
    C: Entregar su vehículo al estado
    D: Pagar una tarifa fija de $5,000 a la víctima
  answer: B
  explanation: Bajo las leyes de responsabilidad financiera de Nevada, si no tiene
    seguro al momento de un accidente, se le puede requerir que deposite una garantía
    ante el DMV para cubrir posibles sentencias no satisfechas.
- id: 76
  category: driver_responsibility
  question: ¿Cuál es la multa por una tercera o subsiguiente interrupción del seguro
    dentro de un período de cinco años en Nevada?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: D
  explanation: Una tercera o subsiguiente interrupción del seguro dentro de cinco
    años resulta en una multa de $1,000, una tarifa de restablecimiento de $250 y
    una suspensión mínima de la licencia de conducir de 30 días.
- id: 77
  category: driver_responsibility
  question: 'Para registrar un vehículo en Nevada, su póliza de seguro debe ser emitida
    por:'
  choices:
    A: Cualquier compañía de seguros en los Estados Unidos
    B: Una compañía de seguros con licencia para operar en Nevada
    C: Un proveedor de seguros de propiedad federal
    D: Una compañía con sede en su estado de residencia anterior
  answer: B
  explanation: La ley de Nevada exige que el seguro de su vehículo motorizado sea
    proporcionado por una compañía autorizada para emitir pólizas en el estado de
    Nevada.
- id: 78
  category: driver_responsibility
  question: 'Si se muda fuera de Nevada, debe devolver sus placas de matrícula de
    Nevada al DMV:'
  choices:
    A: Inmediatamente al llegar al nuevo estado
    B: Solo si las placas son personalizadas
    C: Dentro de los 60 días posteriores a la mudanza
    D: Antes de cancelar su seguro de Nevada
  answer: D
  explanation: En Nevada, debe devolver sus placas de matrícula al DMV antes o al
    mismo tiempo que cancela su póliza de seguro de Nevada para evitar ser señalado
    por una interrupción de cobertura.
- id: 79
  category: driver_responsibility
  question: En Nevada, ¿cuál de las siguientes es una forma aceptable de mostrar evidencia
    de seguro a un oficial de la ley?
  choices:
    A: Solo una tarjeta de seguro impresa
    B: Una imagen electrónica mostrada en un dispositivo móvil
    C: Una declaración verbal del número de póliza
    D: Una copia del título del vehículo
  answer: B
  explanation: La ley de Nevada permite a los conductores presentar evidencia de seguro
    ya sea en formato impreso o como una imagen electrónica en un dispositivo móvil.
- id: 80
  category: driver_responsibility
  question: 'Cuando un residente de Nevada compra un vehículo a un concesionario de
    Nevada, el concesionario proporciona un documento que permite conducir el vehículo
    durante 30 días. Esto se llama:'
  choices:
    A: Factura de venta (Bill of Sale)
    B: Certificado de título
    C: Informe electrónico de venta (EROS)
    D: Permiso temporal de conducir
  answer: C
  explanation: Los concesionarios de Nevada emiten un Informe Electrónico de Venta
    (EROS, por sus siglas en inglés), que actúa como registro temporal durante 30
    días hasta que el propietario complete el proceso de registro permanente.
- id: 81
  category: safe_driving_rules
  question: ¿En Nevada, cuál es la distancia máxima que puede recorrer en un carril
    central compartido para girar antes de realizar un giro?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Según el Manual del Conductor de Nevada, no puede recorrer más de 200
    pies en un carril central para girar antes de realizar un giro a la izquierda.
- id: 82
  category: safe_driving_rules
  question: En Nevada, los giros en U están prohibidos en distritos comerciales, excepto
    en ¿cuál de los siguientes lugares?
  choices:
    A: En medio de una cuadra
    B: Solo en zonas residenciales
    C: En intersecciones o donde las señales lo permitan específicamente
    D: Los giros en U nunca están permitidos en distritos comerciales
  answer: C
  explanation: La ley de Nevada (NRS 484B.403) establece que los giros en U están
    prohibidos en distritos comerciales, excepto en intersecciones o en una carretera
    dividida donde se proporcione una apertura o señal apropiada.
- id: 83
  category: safe_driving_rules
  question: Al estacionar cerca de un hidrante de incendios en Nevada, ¿cuál es la
    distancia mínima requerida que debe mantener?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Nevada prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 84
  category: safe_driving_rules
  question: 'Al rebasar una bicicleta en Nevada en una carretera con dos o más carriles
    que circulan en la misma dirección, el conductor debe:'
  choices:
    A: Tocar la bocina para advertir al ciclista y permanecer en el carril
    B: Cambiarse al carril de la izquierda si es seguro y posible
    C: Pasar a menos de 2 pies del ciclista
    D: Esperar detrás del ciclista hasta que este le indique que puede pasar
  answer: B
  explanation: La 'regla de los 3 pies' de Nevada (NRS 484B.270) exige que los automovilistas
    se cambien al carril de la izquierda si hay más de un carril en la misma dirección.
    Si no es así, deben rebasar con al menos 3 pies de espacio entre el vehículo y
    la bicicleta.
- id: 85
  category: safe_driving_rules
  question: Al estacionar en paralelo en una calle de Nevada, ¿a cuántas pulgadas
    del bordillo (acera) deben estar las ruedas de su vehículo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: En Nevada, al estacionar en una calle pública, su vehículo debe estar
    paralelo y a no más de 18 pulgadas del bordillo.
- id: 86
  category: safe_driving_rules
  question: 'En las zonas escolares de Nevada, los límites de velocidad se aplican
    estrictamente y generalmente se establecen en:'
  choices:
    A: 10 o 20 mph
    B: 15 o 25 mph
    C: 20 o 30 mph
    D: 25 o 35 mph
  answer: B
  explanation: Los límites de velocidad en las zonas escolares de Nevada suelen ser
    de 15 o 25 mph y están vigentes durante los horarios publicados o mientras las
    luces intermitentes estén encendidas.
- id: 87
  category: safe_driving_rules
  question: 'Según la ley de Nevada, las luces delanteras (faros) deben encenderse
    desde:'
  choices:
    A: La puesta del sol hasta la salida del sol
    B: Una hora después de la puesta del sol hasta una hora antes de la salida del
      sol
    C: Media hora después de la puesta del sol hasta media hora antes de la salida
      del sol
    D: Cuando la visibilidad es inferior a 1,000 pies
  answer: C
  explanation: La ley de Nevada exige que las luces delanteras estén encendidas desde
    media hora después de la puesta del sol hasta media hora antes de la salida del
    sol, o siempre que la visibilidad sea insuficiente para ver claramente a personas
    o vehículos a una distancia de 1,000 pies.
- id: 88
  category: safe_driving_rules
  question: 'Si se le condena por exceso de velocidad en una zona de obras viales
    en Nevada cuando hay trabajadores presentes:'
  choices:
    A: Su licencia es revocada automáticamente
    B: La multa se duplica
    C: Debe cumplir 48 horas de servicio comunitario
    D: La multa se triplica
  answer: B
  explanation: Bajo la ley de Nevada, las multas por exceso de velocidad y otras infracciones
    de tráfico se duplican en las zonas de obras designadas cuando hay trabajadores
    presentes.
- id: 89
  category: safe_driving_rules
  question: 'Para indicar un giro a la derecha utilizando señales manuales y del brazo,
    un conductor en Nevada debe:'
  choices:
    A: Extender el brazo y la mano izquierda rectos hacia afuera
    B: Extender el brazo y la mano izquierda hacia abajo
    C: Extender el brazo y la mano izquierda hacia arriba
    D: Extender el brazo y la mano derecha hacia arriba
  answer: C
  explanation: La señal manual estándar para un giro a la derecha es el brazo y la
    mano izquierda extendidos hacia arriba en un ángulo de 90 grados.
- id: 90
  category: safe_driving_rules
  question: 'El Manual del Conductor de Nevada recomienda mantener una distancia de
    seguimiento de al menos:'
  choices:
    A: Un segundo
    B: Dos segundos
    C: Cinco segundos
    D: La longitud de un automóvil por cada 10 mph
  answer: B
  explanation: El Manual del Conductor de Nevada recomienda una distancia de seguimiento
    de al menos dos segundos en condiciones normales de conducción.
- id: 91
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso al entrar en una glorieta (roundabout)
    en Nevada?
  choices:
    A: El tráfico que entra a la glorieta
    B: El tráfico que ya se encuentra en la glorieta
    C: El vehículo que se encuentra a la derecha
    D: El vehículo que circula a la mayor velocidad
  answer: B
  explanation: Los conductores que entran en una glorieta deben ceder el derecho de
    paso al tráfico que ya está circulando dentro de ella.
- id: 92
  category: safe_driving_rules
  question: 'Al estacionar un vehículo cuesta arriba en una calle de doble sentido
    con bordillo (curb), debe girar las ruedas delanteras:'
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: Hacia la derecha
  answer: B
  explanation: Al estacionar cuesta arriba con bordillo, gire las ruedas en dirección
    contraria al bordillo para que, si el vehículo rueda, la parte trasera de la llanta
    delantera golpee el bordillo y detenga el auto.
- id: 93
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo permitido en ciertos tramos designados
    de autopistas interestatales rurales en Nevada?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: Aunque muchas autopistas de Nevada tienen un límite de 65 o 70 mph,
    ciertos tramos rurales de la I-80 tienen un límite de velocidad señalizado de
    80 mph.
- id: 94
  category: safe_driving_rules
  question: En Nevada, al indicar que va a realizar un giro en un distrito comercial
    o residencial, ¿durante cuántos pies como mínimo debe señalizar continuamente
    antes de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Según el Manual del Conductor de Nevada, debe señalizar al menos con
    100 pies de antelación en las calles de la ciudad y con 300 pies de antelación
    en las carreteras abiertas.
- id: 95
  category: safe_driving_rules
  question: Según la ley de Nevada, ¿cuál es la distancia mínima que debe mantener
    al adelantar a una bicicleta que circula en la misma dirección?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Nevada (NRS 484B.270) exige que los automovilistas se muevan
    al carril de la izquierda si es posible, o que dejen al menos 3 pies de espacio
    entre el vehículo y la bicicleta.
- id: 96
  category: safe_driving_rules
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de control de
    tráfico temporal designada (zona de obras) en Nevada?
  choices:
    A: Un recargo fijo de $500
    B: Suspensión obligatoria de la licencia por 30 días
    C: Las multas pueden duplicarse
    D: Se requiere servicio comunitario
  answer: C
  explanation: Bajo la ley de Nevada (NRS 484B.600), una persona que comete ciertas
    infracciones de tráfico en una zona de obras, incluyendo el exceso de velocidad,
    puede estar sujeta a una multa que es el doble del monto impuesto habitualmente.
- id: 97
  category: safe_driving_rules
  question: En Nevada, ¿a cuántos pies de un hidrante de incendios no se permite estacionar
    su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: El Manual del Conductor de Nevada especifica que está prohibido estacionar
    a menos de 15 pies de un hidrante de incendios.
- id: 98
  category: safe_driving_rules
  question: 'Al acercarse desde cualquier dirección a un autobús escolar que está
    detenido con sus luces rojas intermitentes y el brazo de parada extendido en una
    carretera sin mediana física, usted debe:'
  choices:
    A: Reducir la velocidad a 15 mph y pasar con precaución
    B: Detenerse solo si viaja en la misma dirección que el autobús
    C: Detenerse y permanecer detenido hasta que el conductor del autobús le indique
      que avance
    D: Detenerse y permanecer detenido hasta que las luces intermitentes del autobús
      se apaguen
  answer: D
  explanation: En Nevada, debe detenerse ante un autobús escolar con luces rojas intermitentes
    en cualquier carretera, a menos que sea una autopista dividida con una barrera
    física y el autobús esté en el lado opuesto. Debe permanecer detenido hasta que
    las luces se apaguen.
- id: 99
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    una zona comercial o residencial en Nevada?
  choices:
    A: 15 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: El límite de velocidad predeterminado para zonas comerciales y residenciales
    en Nevada es de 25 mph, a menos que las señales indiquen lo contrario.
- id: 100
  category: safe_driving_rules
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección no controlada
    (sin señales ni semáforos), ¿qué conductor tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que circula por la carretera más ancha
    D: El conductor que circula a mayor velocidad
  answer: B
  explanation: En Nevada, en una intersección donde no hay señales de tráfico ni semáforos,
    el conductor de la izquierda debe ceder el derecho de paso al conductor de la
    derecha.
- id: 101
  category: safe_driving_rules
  question: ¿En Nevada, es obligatorio usar los faros delanteros cuando la visibilidad
    se reduce a cuántos pies o menos?
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: B
  explanation: La ley de Nevada exige que los faros se enciendan desde media hora
    después de la puesta del sol hasta media hora antes de la salida del sol, y siempre
    que no se pueda ver claramente a personas o vehículos a una distancia de 1,000
    pies.
- id: 102
  category: defensive_driving
  question: Según el Manual del Conductor de Nevada, ¿con cuánta anticipación debe
    observar el camino para identificar posibles peligros?
  choices:
    A: 5 segundos
    B: 12 segundos
    C: 20 segundos
    D: 30 segundos
  answer: B
  explanation: La ley de Nevada y el manual del conductor recomiendan mirar al menos
    12 segundos hacia adelante para tener suficiente tiempo de reaccionar ante los
    cambios en las condiciones.
- id: 103
  category: defensive_driving
  question: En Nevada, ¿cuál es la distancia de seguimiento mínima recomendada detrás
    del vehículo que está frente a usted bajo condiciones de conducción ideales?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 5 segundos
    D: 10 segundos
  answer: B
  explanation: El Manual del Conductor de Nevada sugiere una distancia de seguimiento
    mínima de al menos 2 segundos, la cual debe aumentarse a 4 segundos o más a velocidades
    más altas o con mal tiempo.
- id: 104
  category: defensive_driving
  question: 'En Nevada, debe bajar las luces altas (dim) cuando siga a otro vehículo
    a una distancia de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: Al seguir a otro vehículo desde atrás, debe cambiar a luces bajas cuando
    se encuentre a menos de 300 pies de ese vehículo.
- id: 105
  category: defensive_driving
  question: Si se encuentra con una tormenta de polvo severa mientras conduce por
    una carretera de Nevada, ¿cuál es la acción de conducción defensiva más segura
    que debe tomar?
  choices:
    A: Encender las luces altas y continuar a una velocidad más lenta.
    B: Detenerse en medio del carril de circulación y encender las luces de emergencia.
    C: Salirse de la carretera lo más lejos posible, apagar todas las luces y quitar
      el pie del freno.
    D: Acelerar para atravesar la nube de polvo lo más rápido posible.
  answer: C
  explanation: En las tormentas de polvo de Nevada, debe salirse de la carretera,
    apagar todas las luces (incluidas las de freno) para que otros conductores no
    lo sigan fuera de la carretera pensando que todavía está en la autopista, y esperar
    a que mejore la visibilidad.
- id: 106
  category: defensive_driving
  question: El hidroplaneo (hydroplaning) puede comenzar a velocidades tan bajas como
    _____ mph en Nevada si hay suficiente agua en la carretera.
  choices:
    A: 25 mph
    B: 35 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: El hidroplaneo (donde los neumáticos pierden contacto con la carretera
    y 'surfean' sobre el agua) puede comenzar a velocidades tan bajas como 35 mph.
- id: 107
  category: defensive_driving
  question: 'Al rebasar una bicicleta en Nevada, la ley exige que los automovilistas
    mantengan una distancia mínima de al menos:'
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La 'Regla de los 3 pies' de Nevada exige que los automovilistas dejen
    al menos tres pies de espacio entre su vehículo y la bicicleta al rebasar.
- id: 108
  category: defensive_driving
  question: 'En Nevada, si conduce por una carretera con dos o más carriles en la
    misma dirección y se aproxima a un vehículo de emergencia detenido con luces intermitentes,
    usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril.
    B: Cambiarse a un carril que no esté junto al vehículo de emergencia, si es seguro
      hacerlo.
    C: Mantener su velocidad y permanecer en su carril.
    D: Acelerar para pasar la escena rápidamente.
  answer: B
  explanation: La ley de Nevada de 'Moverse al carril contiguo' (Move Over law) exige
    que los conductores se muevan a un carril adyacente (lejos del vehículo de emergencia)
    si es seguro hacerlo, o que reduzcan la velocidad si no es posible cambiarse de
    carril.
- id: 109
  category: defensive_driving
  question: Bajo la ley de Nevada, las vueltas en U están específicamente prohibidas
    en ¿cuál de los siguientes lugares?
  choices:
    A: En un distrito residencial.
    B: En cualquier intersección con luz verde.
    C: En un distrito comercial, excepto en una intersección o en una carretera dividida
      donde haya una apertura disponible.
    D: En cualquier carretera con un límite de velocidad superior a 35 mph.
  answer: C
  explanation: La ley de Nevada prohíbe las vueltas en U en distritos comerciales,
    excepto en una intersección o en una carretera dividida donde exista una apertura
    adecuada.
- id: 110
  category: defensive_driving
  question: 'Si su vehículo comienza a derrapar en una carretera resbaladiza de Nevada,
    usted debe:'
  choices:
    A: Pisar los frenos a fondo inmediatamente.
    B: Girar el volante en la dirección opuesta al derrape.
    C: Girar el volante en la dirección en la que desea que vaya la parte delantera
      del vehículo.
    D: Poner el auto en punto muerto (neutral) y apagar el motor.
  answer: C
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que desea que vaya el vehículo.
- id: 111
  category: defensive_driving
  question: ¿En Nevada, cuál es el valor de los puntos de demérito por 'Conducción
    Temeraria' (Reckless Driving)?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: La conducción temeraria es una infracción de tráfico grave en Nevada
    y resulta en la adición de 8 puntos de demérito a su historial de conducción.
- id: 112
  category: defensive_driving
  question: Al conducir en una carretera de Nevada, ¿cuál es la distancia mínima que
    un camión o un vehículo que remolca a otro debe mantener con respecto a otro vehículo
    similar?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Nevada exige que los camiones o vehículos que remolquen a
    otros mantengan al menos 500 pies de distancia entre ellos en carreteras abiertas
    para permitir que otros vehículos rebasen de manera segura.
- id: 113
  category: defensive_driving
  question: 'En Nevada, si se le condena por exceso de velocidad en una zona escolar
    designada o en una zona de seguridad para peatones, la multa se:'
  choices:
    A: Reduce a la mitad.
    B: Mantiene igual que una multa normal por exceso de velocidad.
    C: Duplica.
    D: Reemplaza únicamente por servicio comunitario.
  answer: C
  explanation: La ley de Nevada exige que las multas por infracciones de tráfico (como
    el exceso de velocidad) se dupliquen cuando se cometen en una zona escolar o en
    una zona de seguridad para peatones.
- id: 114
  category: defensive_driving
  question: 'Para evitar la ''hipnosis de carretera'' durante viajes largos en las
    carreteras interestatales de Nevada, usted debe:'
  choices:
    A: Mirar fijamente la línea central de la carretera.
    B: Mantener los ojos en movimiento y observar la carretera cada pocos segundos.
    C: Escuchar música muy fuerte durante todo el viaje.
    D: Beber café cada 30 minutos.
  answer: B
  explanation: La conducción defensiva implica mantener los ojos en movimiento y observar
    el entorno para permanecer alerta y evitar el estado de trance conocido como hipnosis
    de carretera.
- id: 115
  category: defensive_driving
  question: 'En Nevada, debe usar sus faros delanteros siempre que no pueda ver objetos
    con claridad a una distancia de:'
  choices:
    A: 500 pies
    B: 750 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: La ley de Nevada exige que los faros se enciendan desde media hora
    después de la puesta del sol hasta media hora antes de la salida del sol, y siempre
    que la visibilidad sea inferior a 1,000 pies.
- id: 116
  category: defensive_driving
  question: ¿A qué velocidades puede comenzar a ocurrir el hidroplaneo (hydroplaning)
    en las carreteras de Nevada durante una lluvia intensa?
  choices:
    A: A velocidades tan bajas como 35 mph
    B: Solo a velocidades superiores a 55 mph
    C: Solo a velocidades superiores a 65 mph
    D: El hidroplaneo solo ocurre en agua estancada, independientemente de la velocidad
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una lluvia intensa, los neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 117
  category: defensive_driving
  question: 'Si su vehículo está equipado con un Sistema de Frenos Antibloqueo (ABS)
    y necesita detenerse rápidamente en una carretera resbaladiza de Nevada, usted
    debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante al pedal del freno
    C: Presionar ligeramente los frenos para evitar que se bloqueen
    D: Cambiar a neutral y usar el freno de emergencia
  answer: B
  explanation: Con el ABS, debe aplicar una presión firme y constante. No bombee los
    frenos, ya que esto activará y desactivará el sistema ABS.
- id: 118
  category: defensive_driving
  question: 'Al entrar en una glorieta (roundabout) en Nevada, debe ceder el paso
    a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en el círculo
    C: El tráfico que sale del círculo
    D: Nadie; el tráfico que entra tiene la prioridad de paso
  answer: B
  explanation: En las glorietas de Nevada, el tráfico que entra debe ceder el paso
    al tráfico que ya está circulando en la glorieta.
- id: 119
  category: defensive_driving
  question: ¿Qué exige la ley de 'Moverse al Carril de al Lado' (Move Over) de Nevada
    que hagan los conductores al acercarse a un vehículo de emergencia detenido con
    luces intermitentes?
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Disminuir la velocidad y moverse a un carril no adyacente si es seguro hacerlo
    C: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    D: Acelerar para pasar por la escena lo más rápido posible
  answer: B
  explanation: La ley de Nevada exige que los conductores disminuyan la velocidad
    y, si es posible, se muevan a un carril que no esté al lado del vehículo de emergencia.
- id: 120
  category: defensive_driving
  question: En las zonas escolares de Nevada, los límites de velocidad se aplican
    estrictamente durante ¿cuál de los siguientes horarios?
  choices:
    A: Solo cuando los niños están físicamente presentes en la acera
    B: Durante las horas indicadas en las señales o cuando las luces amarillas están
      parpadeando
    C: Solo entre las 8:00 AM y las 3:00 PM
    D: Solo durante el primer y último mes del año escolar
  answer: B
  explanation: Los límites de velocidad en zonas escolares están vigentes durante
    los horarios indicados en las señales o mientras las luces de advertencia (beacons)
    estén parpadeando.
- id: 121
  category: defensive_driving
  question: ¿Qué luces debe utilizar al conducir con niebla densa en Nevada?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia
  answer: B
  explanation: Las luces bajas son las mejores para la niebla porque las luces altas
    se reflejan en la niebla y crean un resplandor, lo que dificulta la visión.
- id: 122
  category: defensive_driving
  question: Al conducir cerca de camiones comerciales grandes (semirremolques) en
    Nevada, debe evitar la "Zona No" (No-Zone). ¿Qué es la "Zona No"?
  choices:
    A: El área directamente delante del camión
    B: El área directamente detrás del camión
    C: Las áreas a ambos lados del camión donde el conductor no puede verlo
    D: Todas las anteriores
  answer: D
  explanation: 'La "Zona No" se refiere a los grandes puntos ciegos alrededor de un
    camión comercial: la parte delantera, la trasera y ambos lados.'
- id: 123
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    un conductor de Nevada menor de 21 años?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Nevada tiene una política de tolerancia cero para los menores; se considera
    que los conductores menores de 21 años conducen bajo la influencia si su BAC es
    de 0.02% o superior.
- id: 124
  category: alcohol_drugs_health
  question: Por una primera infracción de DUI en Nevada, ¿por cuánto tiempo se suele
    revocar la licencia de conducir?
  choices:
    A: 30 días
    B: 90 días
    C: 185 días
    D: 1 año
  answer: C
  explanation: Una condena por DUI por primera vez en Nevada resulta en un período
    de revocación de la licencia de conducir de 185 días.
- id: 125
  category: alcohol_drugs_health
  question: En Nevada, ¿con qué cantidad de marihuana (THC) en la sangre puede ser
    acusado un conductor de DUI?
  choices:
    A: Cualquier cantidad detectable
    B: 2 nanogramos por mililitro
    C: 5 nanogramos por mililitro
    D: 10 nanogramos por mililitro
  answer: B
  explanation: La ley de Nevada establece el límite prohibido de marihuana (THC) en
    2 nanogramos por mililitro de sangre.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la ley
    de envases abiertos de Nevada?
  choices:
    A: Es legal si el conductor no es quien está bebiendo
    B: Es legal si el envase está en la guantera
    C: Es ilegal tener un envase abierto de una bebida alcohólica en el área de pasajeros
      de un vehículo motorizado en una vía pública
    D: Solo se aplica a conductores menores de 21 años
  answer: C
  explanation: La ley de Nevada prohíbe la posesión de un envase abierto de una bebida
    alcohólica en el área de pasajeros de un vehículo motorizado mientras se encuentra
    en una vía pública.
- id: 127
  category: alcohol_drugs_health
  question: Si un conductor de Nevada se niega a someterse a una prueba química requerida
    de alcohol o drogas, ¿cuál es la consecuencia inmediata?
  choices:
    A: Solo una multa de $500
    B: Su licencia será confiscada y revocada
    C: Se le requerirá asistir a 10 horas de escuela de tránsito
    D: No hay consecuencia inmediata hasta que vayan a la corte
  answer: B
  explanation: Si se niega a una prueba química, el oficial puede confiscar su licencia
    y sus privilegios de conducir serán revocados, a menudo por un período más largo
    que por fallar una prueba de DUI estándar.
- id: 128
  category: alcohol_drugs_health
  question: Además de la revocación de la licencia y las multas, ¿cuál es un requisito
    obligatorio para una condena por DUI por primera vez en Nevada?
  choices:
    A: Pérdida permanente del vehículo
    B: Asistencia a un Panel de Impacto de Víctimas
    C: Volver a tomar el examen de equivalencia de secundaria
    D: Una sentencia de 5 años de prisión
  answer: B
  explanation: La ley de Nevada exige que los infractores de DUI por primera vez asistan
    a un Panel de Impacto de Víctimas y a una escuela de DUI aprobada por Nevada.
- id: 129
  category: alcohol_drugs_health
  question: 'En Nevada, una condena por DUI que cause "daño corporal sustancial" o
    la muerte a otra persona se clasifica como:'
  choices:
    A: Un delito menor
    B: Un delito menor grave
    C: Un delito grave de Categoría B
    D: Una infracción civil
  answer: C
  explanation: Un DUI que resulte en muerte o daño corporal sustancial es un delito
    grave de Categoría B en Nevada, lo que conlleva penas de prisión y multas significativas.
- id: 130
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado, ¿quién es responsable de asegurarse
    de que está en condiciones de conducir en Nevada?
  choices:
    A: Solo el farmacéutico
    B: Solo el médico
    C: El conductor
    D: La policía
  answer: C
  explanation: Es responsabilidad del conductor conocer los efectos de cualquier medicamento
    que tome. Conducir bajo los efectos de medicamentos recetados se trata de la misma
    manera que conducir bajo los efectos del alcohol.
- id: 131
  category: alcohol_drugs_health
  question: Según la ley de Nevada, si un conductor es condenado por conducir bajo
    la influencia (DUI), ¿qué dispositivo se le puede exigir que instale en su vehículo
    para recuperar sus privilegios de conducción?
  choices:
    A: Un rastreador GPS
    B: Un limitador de velocidad
    C: Un dispositivo de bloqueo de encendido (IID)
    D: Una cámara de tablero
  answer: C
  explanation: Nevada exige que muchos infractores por DUI instalen un dispositivo
    de bloqueo de encendido (IID), el cual evita que el automóvil arranque si se detecta
    alcohol en el aliento del conductor.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál es la multa mínima por una primera infracción de DUI en Nevada (excluyendo
    los costos judiciales)?
  choices:
    A: $100
    B: $400
    C: $1,000
    D: $2,500
  answer: B
  explanation: La multa por una primera infracción de DUI en Nevada oscila entre $400
    y $1,000, más costos y cargos judiciales adicionales.
- id: 133
  category: alcohol_drugs_health
  question: Si tiene una condición médica que pueda afectar su capacidad para conducir
    de manera segura, como la epilepsia, ¿qué debe hacer en Nevada?
  choices:
    A: Entregar su licencia inmediatamente
    B: Informar la condición al DMV y proporcionar un informe médico de un médico
    C: Solo conducir durante las horas del día
    D: Nada, siempre que se sienta bien
  answer: B
  explanation: Nevada exige que los conductores con ciertas condiciones médicas las
    informen al DMV. Un médico debe autorizar al conductor para asegurar que pueda
    operar un vehículo de manera segura.
- id: 134
  category: alcohol_drugs_health
  question: En Nevada, ¿cuántas condenas por DUI en un período de 7 años resultan
    en que la infracción sea tratada como un delito grave (felony)?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Una tercera condena por DUI en un período de 7 años en Nevada se clasifica
    como un delito grave (felony) de Categoría B.
- id: 135
  category: alcohol_drugs_health
  question: En Nevada, ¿con qué nivel de concentración de alcohol en sangre (BAC)
    es ilegal que un conductor de 21 años o más opere un vehículo motorizado?
  choices:
    A: 0.02% o superior
    B: 0.05% o superior
    C: 0.08% o superior
    D: 0.10% o superior
  answer: C
  explanation: En Nevada, el límite legal de concentración de alcohol en sangre (BAC)
    es de 0.08% para conductores de 21 años o más.
- id: 136
  category: alcohol_drugs_health
  question: 'Para un conductor menor de 21 años, la ley de Nevada considera que es
    un DUI si su concentración de alcohol en sangre (BAC) es de al menos:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Nevada tiene una política de tolerancia cero para menores; un BAC de
    0.02% o superior resultará en un DUI para conductores menores de 21 años.
- id: 137
  category: alcohol_drugs_health
  question: 'Si un conductor de Nevada es condenado por un DUI y un pasajero menor
    de 15 años estaba en el vehículo, el tribunal considerará esto como:'
  choices:
    A: Una razón para desestimar el caso
    B: Un factor agravante que puede aumentar las penas
    C: Una infracción menor
    D: Irrelevante para la sentencia
  answer: B
  explanation: Tener un pasajero menor de 15 años en el vehículo durante un DUI se
    considera un factor agravante en Nevada, lo que puede llevar a una sentencia más
    severa.
- id: 138
  category: alcohol_drugs_health
  question: Según la ley reciente de Nevada, ¿qué dispositivo debe instalarse en un
    vehículo durante al menos 185 días después de una primera condena por DUI?
  choices:
    A: Un rastreador GPS
    B: Un dispositivo de bloqueo de encendido (IID)
    C: Un limitador de velocidad
    D: Un sistema de frenado de emergencia automático
  answer: B
  explanation: Nevada exige la instalación de un dispositivo de bloqueo de encendido
    (IID) para todas las condenas por DUI, incluidas las primeras infracciones, por
    un mínimo de 185 días.
- id: 139
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un requisito obligatorio para un infractor
    de DUI por primera vez en Nevada?
  choices:
    A: Asistir a un Panel de Impacto de Víctimas
    B: Pérdida permanente de los privilegios de conducción
    C: Un mínimo de 5 años de prisión
    D: Confiscación del vehículo por parte del estado
  answer: A
  explanation: Los infractores de DUI por primera vez en Nevada deben pagar una multa,
    asistir a la escuela de DUI y asistir a un Panel de Impacto de Víctimas.
- id: 140
  category: alcohol_drugs_health
  question: 'En Nevada, una tercera condena por DUI en un período de 7 años se clasifica
    como:'
  choices:
    A: Una infracción civil
    B: Un delito grave (felony) de Categoría E
    C: Un delito grave (felony) de Categoría B
    D: Un delito menor (misdemeanor)
  answer: C
  explanation: Una tercera infracción de DUI en un plazo de 7 años en Nevada es un
    delito grave (felony) de Categoría B, castigado con 1 a 6 años de prisión y una
    multa de $2,000 a $5,000.
- id: 141
  category: alcohol_drugs_health
  question: 'La ley de "Contenedor Abierto" (Open Container) de Nevada prohíbe:'
  choices:
    A: Cualquier cantidad de alcohol en el maletero de un automóvil
    B: Botellas de vino sin abrir en el área de pasajeros
    C: Bebidas alcohólicas abiertas en el área de pasajeros de un vehículo en una
      vía pública
    D: Transportar alcohol si usted es mayor de 21 años
  answer: C
  explanation: Es ilegal en Nevada tener un contenedor abierto de una bebida alcohólica
    en el área de pasajeros de un vehículo motorizado mientras se encuentra en una
    vía pública.
- id: 142
  category: alcohol_drugs_health
  question: ¿Puede ser condenado por un DUI en Nevada por conducir bajo la influencia
    de medicamentos recetados legalmente?
  choices:
    A: No, si el medicamento fue recetado por un médico
    B: No, siempre que tenga el frasco de la receta con usted
    C: Sí, si el medicamento afecta su capacidad para conducir de manera segura
    D: Sí, pero solo si también consumió alcohol
  answer: C
  explanation: En Nevada, se le puede acusar de un DUI por cualquier sustancia que
    afecte su conducción, incluidos los medicamentos recetados o de venta libre.
- id: 143
  category: alcohol_drugs_health
  question: 'Si se niega a someterse a una prueba química requerida en Nevada, su
    licencia de conducir será revocada por al menos:'
  choices:
    A: 90 días
    B: 185 días
    C: 1 año
    D: 3 años
  answer: C
  explanation: Negarse a una prueba química resulta en una revocación administrativa
    inmediata de su licencia por 1 año por una primera negativa.
- id: 144
  category: alcohol_drugs_health
  question: 'Una condena por DUI que resulte en la muerte o lesiones corporales graves
    de otra persona en Nevada es punible con:'
  choices:
    A: 2 a 20 años de prisión
    B: Un máximo de 6 meses de cárcel
    C: Solo servicio comunitario
    D: Una multa de $500
  answer: A
  explanation: Un DUI que cause la muerte o daños corporales sustanciales es un delito
    grave de Categoría B en Nevada, que conlleva una sentencia de prisión de 2 a 20
    años.
- id: 145
  category: alcohol_drugs_health
  question: 'Si tiene una condición médica que pueda afectar su capacidad para conducir,
    como epilepsia o una afección cardíaca, la ley de Nevada le exige:'
  choices:
    A: Dejar de conducir inmediata y permanentemente
    B: Informar la condición al DMV al solicitar o renovar una licencia
    C: Solo conducir durante las horas del día
    D: Mantener a un médico en el automóvil en todo momento
  answer: B
  explanation: Nevada exige que los conductores revelen condiciones físicas o mentales
    que puedan interferir con la conducción segura. El DMV puede requerir la evaluación
    de un profesional médico.
- id: 146
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones conlleva el mayor número de puntos
    de demérito (8 puntos) en el estado de Nevada?
  choices:
    A: Conducción descuidada (Careless driving)
    B: Conducción temeraria (Reckless driving)
    C: No ceder el paso a un peatón
    D: Rebasar un autobús escolar cuando las señales están parpadeando
  answer: B
  explanation: La conducción temeraria se considera una infracción mayor en Nevada
    y se le asignan 8 puntos de demérito.
- id: 147
  category: penalties_and_points
  question: Según la Ley de Consentimiento Implícito de Nevada, ¿cuál es la sanción
    por negarse por primera vez a someterse a una prueba de aliento, sangre u orina
    solicitada por un oficial de policía?
  choices:
    A: Solo una multa de $500
    B: Revocación de licencia por 90 días
    C: Revocación de licencia por 1 año
    D: Suspensión de licencia por 30 días
  answer: C
  explanation: Según la ley de Nevada, si se niega a una prueba química, su licencia
    de conducir será revocada por 1 año por una primera infracción.
- id: 148
  category: penalties_and_points
  question: En Nevada, las multas de tráfico se ________ en las zonas de obras viales
    designadas cuando hay trabajadores presentes.
  choices:
    A: Triplican
    B: Reducen a la mitad
    C: Duplican
    D: Aumentan en una tarifa fija de $500
  answer: C
  explanation: La ley de Nevada exige que las multas de tráfico se dupliquen por las
    infracciones cometidas en zonas de obras.
- id: 149
  category: penalties_and_points
  question: En Nevada, ¿cuántos puntos de demérito se emiten por "Seguir demasiado
    de cerca" (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: Seguir demasiado de cerca es una infracción de 4 puntos en el sistema
    de puntos de demérito de Nevada.
- id: 150
  category: penalties_and_points
  question: ¿Cuál es la multa estándar por una primera infracción del cinturón de
    seguridad en Nevada?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: A
  explanation: En Nevada, la multa por no usar el cinturón de seguridad es de $25.
- id: 151
  category: penalties_and_points
  question: 'Una primera condena por DUI en Nevada puede incluir una sentencia de
    cárcel que oscila entre:'
  choices:
    A: 24 horas a 30 días
    B: 2 días a 6 meses
    C: 10 días a 1 año
    D: 6 meses a 2 años
  answer: B
  explanation: Un DUI (conducir bajo la influencia) por primera ofensa en Nevada conlleva
    una posible sentencia de cárcel de 2 días a 6 meses.
- id: 152
  category: penalties_and_points
  question: En Nevada, ¿cuántos puntos de demérito resultan de no detenerse ante un
    autobús escolar con sus luces rojas parpadeando?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: No detenerse ante un autobús escolar es una infracción de 4 puntos
    en Nevada.
- id: 153
  category: penalties_and_points
  question: Según la ley de Nevada, ¿cuántos puntos de demérito se emiten por una
    segunda o subsiguiente condena por usar un teléfono celular portátil mientras
    se conduce?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Si bien la primera ofensa por usar un dispositivo portátil no se trata
    como una infracción de tránsito (sin puntos), una segunda o subsiguiente condena
    resulta en 4 puntos de demérito.
- id: 154
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito se asignan por no ceder el paso a un peatón
    en un cruce peatonal en Nevada?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: No ceder el paso a un peatón resulta en 4 puntos de demérito en su
    historial de conducción de Nevada.
- id: 155
  category: penalties_and_points
  question: En Nevada, si es condenado por 'Conducción Agresiva', ¿cuántos puntos
    se añaden a su historial?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 10 puntos
  answer: B
  explanation: La conducción agresiva es una ofensa específica en Nevada que conlleva
    una penalización de 6 puntos de demérito.
- id: 156
  category: penalties_and_points
  question: 'Si un conductor de Nevada se niega a someterse a una prueba química requerida
    de alcohol o drogas bajo la Ley de Consentimiento Implícito, su licencia será
    revocada por al menos:'
  choices:
    A: 90 días
    B: 185 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: Bajo la Ley de Consentimiento Implícito de Nevada, negarse a una prueba
    química resulta en la incautación inmediata de su licencia y un período de revocación
    de 1 año por una primera ofensa.
- id: 157
  category: penalties_and_points
  question: ¿Cuál es la penalización en puntos de demérito por rebasar a un autobús
    escolar cuando sus luces rojas están parpadeando y el brazo de parada está extendido?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Rebasar ilegalmente a un autobús escolar en Nevada es una infracción
    grave que resulta en 4 puntos de demérito.
- id: 158
  category: penalties_and_points
  question: En Nevada, si su cobertura de seguro caduca de 1 a 30 días por primera
    vez, ¿cuál es la tarifa de restablecimiento requerida?
  choices:
    A: $100
    B: $251
    C: $500
    D: $750
  answer: B
  explanation: Para una primera caducidad del seguro de 1 a 30 días, Nevada requiere
    una tarifa de restablecimiento de $251. Se añaden multas si la caducidad supera
    los 30 días o por reincidencia.
- id: 159
  category: penalties_and_points
  question: Después de una condena por DUI en Nevada, ¿por cuántos años debe un conductor
    mantener típicamente un certificado SR-22 (Prueba de Responsabilidad Financiera)?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: La ley de Nevada exige que los conductores mantengan el seguro SR-22
    durante 3 años tras el restablecimiento de la licencia después de un DUI u otras
    infracciones graves.
- id: 160
  category: penalties_and_points
  question: En Nevada, ¿qué sucede con la multa por una infracción de exceso de velocidad
    que ocurre en una zona de obras viales designada cuando hay trabajadores presentes?
  choices:
    A: La multa se triplica
    B: La multa se duplica
    C: La multa aumenta en $1,000
    D: La multa sigue siendo la misma pero los puntos se duplican
  answer: B
  explanation: La ley de Nevada exige que las multas por infracciones de tránsito,
    incluido el exceso de velocidad, se dupliquen en las zonas de obras viales y en
    las zonas de seguridad peatonal.
- id: 161
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito se asignan por participar en una 'competencia
    de velocidad' (carreras callejeras) en una calle pública de Nevada?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: Participar en una competencia de velocidad o carreras callejeras se
    categoriza de manera similar a la conducción temeraria y resulta en 8 puntos de
    demérito.
- id: 162
  category: sharing_the_road
  question: Usted está conduciendo en una carretera de Nevada con una barrera física
    de mediana. Un autobús escolar está detenido en el lado opuesto de la mediana
    con sus luces rojas parpadeando y el brazo de parada extendido. ¿Debe detenerse?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar con luces rojas parpadeantes.
    B: Sí, pero solo si hay niños presentes.
    C: No, no es obligatorio detenerse si la carretera está dividida por una barrera
      física.
    D: No, pero debe reducir la velocidad a 15 mph.
  answer: C
  explanation: En Nevada, si una carretera está dividida por una barrera física o
    mediana, los vehículos que viajan en la dirección opuesta a un autobús escolar
    no están obligados a detenerse.
- id: 163
  category: sharing_the_road
  question: Bajo la ley 'Move Over' (Hacerse a un lado) de Nevada, ¿qué debe hacer
    al acercarse a un vehículo de emergencia estacionario con luces parpadeantes al
    costado de la carretera?
  choices:
    A: Detenerse inmediatamente en su carril.
    B: Mantener su velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia.
    C: Reducir la velocidad y, si es seguro/posible, cambiarse a un carril que no
      esté adyacente al vehículo de emergencia.
    D: Aumentar la velocidad para pasar la escena lo más rápido posible.
  answer: C
  explanation: La ley de Nevada (NRS 484B.607) exige que los conductores reduzcan
    la velocidad a menos del límite publicado y se muevan a un carril no adyacente
    si es seguro hacerlo al acercarse a vehículos de emergencia o de servicios públicos
    estacionarios.
- id: 164
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es VERDADERA con respecto a la división
    de carriles (lane splitting) por motocicletas en Nevada?
  choices:
    A: Es legal a velocidades inferiores a 30 mph.
    B: Es legal solo en los carriles HOV.
    C: Es ilegal que una motocicleta circule entre carriles de tráfico.
    D: Es legal si el motociclista lleva puesto un casco.
  answer: C
  explanation: En Nevada, la división de carriles (conducir entre dos carriles de
    tráfico) es ilegal para las motocicletas (NRS 486.351).
- id: 165
  category: sharing_the_road
  question: 'Al seguir a un camión comercial grande en Nevada, si no puede ver la
    cara del conductor del camión en sus espejos laterales, usted está:'
  choices:
    A: En la 'No-Zone' (punto ciego).
    B: A una distancia de seguimiento segura.
    C: En la 'Zona Segura' del camión.
    D: Listo para adelantar al camión.
  answer: A
  explanation: Los camiones grandes tienen puntos ciegos significativos conocidos
    como 'No-Zones'. Si no puede ver al conductor en sus espejos laterales, él no
    puede verlo a usted.
- id: 166
  category: sharing_the_road
  question: En Nevada, ¿cuál es la sanción por la primera infracción de rebasar o
    adelantar a un autobús escolar que tiene sus luces rojas parpadeando?
  choices:
    A: Una multa de $100 y 1 punto de demérito.
    B: Una multa de $250 a $500 y 4 puntos de demérito.
    C: Sentencia obligatoria de 30 días de cárcel.
    D: Revocación permanente de la licencia de conducir.
  answer: B
  explanation: Adelantar a un autobús escolar con luces rojas parpadeantes es una
    infracción grave en Nevada, que conlleva una multa de $250 a $500 y 4 puntos de
    demérito por la primera infracción.
- id: 167
  category: sharing_the_road
  question: 'Cuando un ciclista utiliza un carril de circulación en Nevada, generalmente
    se le requiere circular:'
  choices:
    A: Por la acera en su lugar.
    B: En sentido contrario al flujo del tráfico.
    C: Tan cerca del lado derecho de la carretera como sea practicable.
    D: En el centro exacto del carril en todo momento.
  answer: C
  explanation: Los ciclistas en Nevada deben circular lo más cerca posible del lado
    derecho de la carretera, excepto al girar a la izquierda o evitar peligros (NRS
    484B.763).
- id: 168
  category: sharing_the_road
  question: En Nevada, ¿es ilegal seguir a menos de cuántos pies de un aparato de
    bomberos (camión de bomberos) que está respondiendo a una alarma?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Nevada (NRS 484B.700) prohíbe a los conductores seguir a
    un camión de bomberos que responde a una alarma a una distancia menor de 500 pies.
- id: 169
  category: sharing_the_road
  question: Cuando un peatón cruza una carretera en un cruce peatonal, ¿quién tiene
    el derecho de paso en Nevada?
  choices:
    A: El vehículo, porque es más grande.
    B: El peatón, y los vehículos deben ceder el paso.
    C: El vehículo, a menos que el peatón esté en una zona escolar.
    D: El peatón, pero solo si el cruce está marcado con pintura.
  answer: B
  explanation: En Nevada, los conductores deben ceder el derecho de paso a los peatones
    tanto en los cruces peatonales marcados como en los no marcados en las intersecciones.
- id: 170
  category: sharing_the_road
  question: 'La ley de Nevada exige que todos los conductores y pasajeros de motocicletas
    usen:'
  choices:
    A: Chaquetas de cuero protectoras.
    B: Chalecos reflectantes.
    C: Cascos protectores.
    D: Guantes y botas.
  answer: C
  explanation: La norma NRS 486.231 exige que todos los conductores y pasajeros de
    motocicletas y ciclomotores usen cascos protectores que cumplan con los estándares
    de seguridad.
- id: 171
  category: sharing_the_road
  question: 'Cuando un camión grande está girando a la derecha en una calle con dos
    carriles en cada dirección, el camión a menudo puede:'
  choices:
    A: Girar desde el carril izquierdo.
    B: Abrirse hacia la izquierda para completar el giro.
    C: Detenerse y esperar a que todo el tráfico despeje la intersección.
    D: Girar desde la acera.
  answer: B
  explanation: Los camiones grandes necesitan más espacio para girar. A menudo se
    abren hacia la izquierda para no golpear el bordillo al realizar un giro a la
    derecha.
- id: 172
  category: sharing_the_road
  question: 'En Nevada, si conduce por una carretera con un solo carril en su dirección
    y necesita adelantar a una bicicleta, usted debe:'
  choices:
    A: Tocar la bocina y esperar a que el ciclista se detenga a un lado.
    B: Adelantar en el mismo carril con al menos 1 pie de espacio libre.
    C: Moverse a la izquierda hacia el carril de tráfico en sentido contrario si es
      seguro hacerlo para proporcionar el margen de 3 pies.
    D: Esperar hasta que la carretera se ensanche a al menos tres carriles.
  answer: C
  explanation: Si solo hay un carril en la dirección de viaje, la ley de Nevada exige
    que se mueva hacia la izquierda para adelantar a un ciclista de manera segura,
    siempre que sea seguro entrar en el carril contrario.
- id: 173
  category: sharing_the_road
  question: 'Si ve a un peatón usando un bastón blanco o un perro guía en una intersección,
    usted debe:'
  choices:
    A: Tocar la bocina para que sepan que usted está allí.
    B: Ceder el paso y detener su vehículo.
    C: Conducir alrededor de ellos lo más rápido posible.
    D: Gritar instrucciones por su ventana.
  answer: B
  explanation: La ley de Nevada exige que los conductores cedan el paso a los peatones
    ciegos que utilicen un bastón blanco o un animal de servicio.
- id: 174
  category: sharing_the_road
  question: 'Cuando un autobús escolar en Nevada muestra luces ámbar (amarillas) intermitentes,
    significa que:'
  choices:
    A: El autobús está a punto de detenerse y usted debe prepararse para parar.
    B: El autobús está acelerando.
    C: Debe detenerse inmediatamente.
    D: El autobús tiene problemas mecánicos.
  answer: A
  explanation: Las luces ámbar intermitentes en un autobús escolar indican que el
    autobús se está preparando para detenerse para subir o bajar niños. Los conductores
    deben reducir la velocidad y prepararse para parar.
- id: 175
  category: sharing_the_road
  question: Al adelantar a una bicicleta en Nevada, ¿cuál es la distancia mínima que
    debe mantener entre su vehículo y la bicicleta si no hay un carril adyacente al
    cual moverse?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Nevada exige que los automovilistas se muevan a un carril
    adyacente a la izquierda si es posible. Si no, debe adelantar con al menos 3 pies
    de espacio entre su vehículo y la bicicleta.
- id: 176
  category: sharing_the_road
  question: En Nevada, ¿cuál es el estatus legal de la 'división de carril' (lane
    splitting) (conducir entre filas de vehículos detenidos o en movimiento en el
    mismo carril) para las motocicletas?
  choices:
    A: Es legal a velocidades inferiores a 30 mph
    B: Es legal solo durante una fuerte congestión de tráfico
    C: Es ilegal
    D: Es legal si la motocicleta está refrigerada por aire
  answer: C
  explanation: La ley de Nevada prohíbe que las motocicletas realicen la 'división
    de carril' (lane splitting) o el 'filtrado' entre filas de vehículos en el mismo
    carril.
- id: 177
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima de seguimiento que debe mantener detrás de
    una motocicleta en Nevada para garantizar la seguridad?
  choices:
    A: At menos 1 segundo
    B: Al menos 2 segundos
    C: Al menos 4 segundos
    D: Al menos 10 segundos
  answer: C
  explanation: El Manual del Conductor de Nevada recomienda una distancia de seguimiento
    de al menos 4 segundos detrás de las motocicletas porque pueden detenerse mucho
    más rápido que los automóviles.
- id: 178
  category: sharing_the_road
  question: 'Cuando un peatón cruza una calle guiado por un animal de servicio o llevando
    un bastón blanco, la ley de Nevada exige que los conductores:'
  choices:
    A: Toquen la bocina para que sepan que usted está allí
    B: Hagan una parada completa y cedan el paso
    C: Conduzcan alrededor de ellos lentamente
    D: Solo se detengan si hay un cruce de peatones marcado
  answer: B
  explanation: La ley de Nevada exige que los conductores cedan el paso y realicen
    una parada completa ante cualquier persona ciega que utilice un animal de servicio
    o lleve un bastón blanco.
- id: 179
  category: sharing_the_road
  question: Los camiones comerciales grandes tienen 'Zonas Prohibidas' (No-Zones).
    ¿Dónde se encuentra el punto ciego más grande en un camión comercial?
  choices:
    A: Directamente frente a la cabina
    B: En el lado izquierdo del remolque
    C: Directamente detrás del remolque
    D: En el lado derecho del remolque
  answer: D
  explanation: Aunque los camiones tienen puntos ciegos en todos los lados, el punto
    ciego del lado derecho es la 'Zona Prohibida' (No-Zone) más grande y peligrosa.
- id: 180
  category: sharing_the_road
  question: Según la ley de Nevada, ¿cuál de las siguientes afirmaciones es verdadera
    con respecto a los cascos para los motociclistas?
  choices:
    A: Los cascos solo son obligatorios para conductores menores de 21 años
    B: Los cascos solo son obligatorios en las autopistas
    C: Tanto los conductores como los pasajeros están obligados a usar casco
    D: Los cascos son opcionales si el conductor tiene 5 años de experiencia
  answer: C
  explanation: La ley de Nevada exige que tanto los conductores de motocicletas como
    los pasajeros usen cascos de protección que cumplan con los estándares de seguridad.
- id: 181
  category: sharing_the_road
  question: Si un conductor de Nevada es condenado por "Conducción Agresiva" (una
    serie de actos que incluyen exceso de velocidad y no ceder el paso), ¿cuántos
    puntos de demérito se asignan?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: La conducción agresiva es una infracción grave en Nevada y da como
    resultado la adición de 6 puntos de demérito al registro del conductor.
- id: 182
  category: sharing_the_road
  question: 'Cuando una bicicleta circula por una calzada en Nevada, el ciclista generalmente
    debe:'
  choices:
    A: Circular en sentido contrario al flujo del tráfico
    B: Circular tan cerca del lado derecho de la carretera como sea practicable
    C: Permanecer en la acera en todo momento
    D: Circular únicamente por los carriles designados para bicicletas
  answer: B
  explanation: Los ciclistas en Nevada deben circular lo más a la derecha posible,
    excepto cuando vayan a girar a la izquierda o para evitar peligros.
- id: 183
  category: sharing_the_road
  question: 'Cuando un cortejo fúnebre es encabezado por un vehículo con luces ámbar
    intermitentes en Nevada, los otros conductores deben:'
  choices:
    A: Ceder el derecho de paso a todo el cortejo
    B: Solo ceder el paso al vehículo que encabeza
    C: Rebasar al cortejo por la derecha
    D: Tocar la bocina para indicar que están pasando
  answer: A
  explanation: La ley de Nevada otorga el derecho de paso a los cortejos fúnebres.
    Los conductores no deben cruzarse en el cortejo ni rebasarlo a menos que puedan
    hacerlo de manera segura y sin interferencias.
- id: 184
  category: vehicle_information
  question: 'En Nevada, debe encender sus faros delanteros cuando no haya luz suficiente
    o cuando no se pueda ver claramente a personas o vehículos a una distancia de:'
  choices:
    A: 500 pies
    B: 750 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Según el Manual del Conductor de Nevada, los faros delanteros deben
    utilizarse cuando la visibilidad sea inferior a 1,000 pies.
- id: 185
  category: vehicle_information
  question: 'Según la ley de Nevada, es ilegal operar un vehículo con neumáticos que
    tengan una profundidad de la banda de rodadura inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Nevada (NRS 484D.560) especifica que los neumáticos se consideran
    inseguros si la profundidad de la banda de rodadura es inferior a 2/32 de pulgada.
- id: 186
  category: vehicle_information
  question: En Nevada, cada automóvil de pasajeros debe estar equipado con un sistema
    de frenos de servicio que pueda detener el vehículo en cuántos pies a una velocidad
    de 20 mph?
  choices:
    A: 15 pies
    B: 25 pies
    C: 35 pies
    D: 50 pies
  answer: B
  explanation: El Manual del Conductor de Nevada establece que el freno de servicio
    debe ser capaz de detener un vehículo de pasajeros que circula a 20 mph en una
    distancia de 25 pies.
- id: 187
  category: vehicle_information
  question: La ley de Nevada exige que el espejo retrovisor de su vehículo le permita
    ver la carretera por al menos cuántos pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las regulaciones de equipamiento de Nevada requieren un espejo retrovisor
    que proporcione una visión de la carretera de al menos 200 pies hacia la parte
    trasera del vehículo.
- id: 188
  category: vehicle_information
  question: ¿En cuál de los siguientes condados de Nevada se requiere generalmente
    una prueba de emisiones para la renovación del registro del vehículo?
  choices:
    A: En todos los condados de Nevada
    B: Solo en los condados de Clark y Washoe
    C: Solo en los condados de Clark, Washoe y Elko
    D: Solo en Carson City
  answer: B
  explanation: Se requiere una prueba de emisiones para la mayoría de los vehículos
    en las áreas urbanas de los condados de Clark (Las Vegas) y Washoe (Reno).
- id: 189
  category: vehicle_information
  question: Según la ley de Nevada, el tinte de las ventanas laterales delanteras
    de un vehículo debe permitir que pase al menos qué porcentaje de luz?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: La norma NRS 484D.440 establece que las ventanas laterales delanteras
    deben tener una transmitancia de luz no inferior al 35 por ciento, más o menos
    un 7 por ciento.
- id: 190
  category: vehicle_information
  question: 'En Nevada, la bocina de un vehículo motorizado debe ser audible en condiciones
    normales desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los estándares de equipamiento de Nevada requieren que una bocina debe
    escucharse desde una distancia no inferior a 200 pies.
- id: 191
  category: vehicle_information
  question: 'La ley de Nevada exige que una luz blanca ilumine la matrícula (placa)
    trasera de modo que sea claramente legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El Manual del Conductor de Nevada especifica que la matrícula trasera
    debe estar iluminada por una luz blanca para que pueda verse desde una distancia
    de 50 pies.
- id: 192
  category: vehicle_information
  question: 'En Nevada, las luces de las señales de giro deben ser visibles bajo la
    luz solar normal desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Las regulaciones de equipo de Nevada establecen que las señales de
    giro deben ser visibles desde al menos 300 pies bajo la luz solar normal.
- id: 193
  category: vehicle_information
  question: ¿La ley de Nevada exige que todos los vehículos motorizados (excepto motocicletas
    y ciclomotores) fabricados después de qué año estén equipados con cinturones de
    seguridad de arnés de hombro para los asientos delanteros?
  choices:
    A: '1960'
    B: '1968'
    C: '1975'
    D: '1984'
  answer: B
  explanation: La ley de Nevada exige cinturones de regazo para los modelos de 1968
    y posteriores, y arneses de hombro para los modelos de 1970 y posteriores (aunque
    1968 es el estándar general para los requisitos de cinturones en el manual).
- id: 194
  category: vehicle_information
  question: 'En Nevada, si su vehículo está equipado con un parabrisas, también debe
    tener:'
  choices:
    A: Un desempañador
    B: Limpiaparabrisas en buen estado de funcionamiento
    C: Una franja solar en la parte inferior
    D: Un revestimiento protector
  answer: B
  explanation: La ley de Nevada exige que cada parabrisas esté equipado con un dispositivo
    para limpiar la lluvia, la nieve u otra humedad (limpiaparabrisas) que se mantenga
    en buen estado de funcionamiento.
- id: 195
  category: vehicle_information
  question: A excepción de los vehículos de emergencia autorizados, ¿la ley de Nevada
    prohíbe que cualquier vehículo muestre una luz de qué color que sea visible directamente
    desde el frente del centro del vehículo?
  choices:
    A: Blanco
    B: Ámbar
    C: Rojo
    D: Amarillo
  answer: C
  explanation: La norma NRS 484D.200 prohíbe que los vehículos que no sean de emergencia
    muestren una luz roja visible directamente desde el frente del vehículo.
- id: 196
  category: vehicle_information
  question: Según el Manual del Conductor de Nevada, ¿cuándo deben encenderse las
    luces delanteras de su vehículo?
  choices:
    A: Desde la puesta del sol hasta el amanecer
    B: Desde una hora después de la puesta del sol hasta una hora antes del amanecer
    C: Desde media hora después de la puesta del sol hasta media hora antes del amanecer
    D: Solo cuando esté lloviendo o nevando
  answer: C
  explanation: La ley de Nevada exige que las luces delanteras se enciendan desde
    media hora después de la puesta del sol hasta media hora antes del amanecer, o
    siempre que no se pueda ver claramente a personas o vehículos a una distancia
    de 1,000 pies.
- id: 197
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para un vehículo de pasajeros en Nevada?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Nevada exige que los neumáticos tengan una profundidad de
    banda de rodadura mínima de al menos 2/32 de pulgada en cada ranura principal.
- id: 198
  category: vehicle_information
  question: 'La ley de Nevada prohíbe el tintado de las ventanas laterales delanteras
    que reduzca la transmisión de luz a menos del:'
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: La norma NRS 484D.440 establece que el tinte no reflectante en las
    ventanas laterales delanteras debe permitir el paso de al menos el 35% de la luz
    (más o menos un 7%).
- id: 199
  category: vehicle_information
  question: 'Todo vehículo motorizado en Nevada debe estar equipado con una bocina
    que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Nevada exige una bocina que sea audible en condiciones normales
    desde una distancia no menor a 200 pies.
- id: 200
  category: vehicle_information
  question: 'En Nevada, la luz trasera que ilumina la matrícula (placa) trasera debe
    hacer que la placa sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La matrícula trasera debe estar iluminada por una luz blanca para que
    pueda leerse desde una distancia de 50 pies hacia atrás.
- id: 201
  category: vehicle_information
  question: ¿Al conducir en una carretera de Nevada, con cuántos pies de antelación
    como mínimo debe señalizar su intención de girar?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: En Nevada, debe señalizar al menos 100 pies antes de girar en zonas
    comerciales o residenciales, y al menos 300 pies en carreteras abiertas.
- id: 202
  category: vehicle_information
  question: Según la ley de Nevada, ¿cuál es el requisito para los limpiaparabrisas?
  choices:
    A: Solo son obligatorios si el vehículo se utiliza para fines comerciales
    B: Deben ser operados manualmente por el conductor
    C: Deben mantenerse en buen estado de funcionamiento y ser capaces de limpiar
      la lluvia o la nieve
    D: Solo son obligatorios en el condado de Washoe
  answer: C
  explanation: Todo vehículo de motor con parabrisas debe estar equipado con limpiaparabrisas
    automáticos mantenidos en buen estado de funcionamiento para limpiar la lluvia,
    la nieve u otra humedad.
- id: 203
  category: vehicle_information
  question: En Nevada, si un vehículo está equipado con cinturones de seguridad, ¿quién
    está obligado a usarlos?
  choices:
    A: Solo el conductor
    B: Solo el conductor y los pasajeros del asiento delantero
    C: El conductor y todos los pasajeros de 6 años de edad o más
    D: Solo los pasajeros menores de 18 años
  answer: C
  explanation: La ley de Nevada exige que el conductor y todos los pasajeros de 6
    años o más (o que pesen más de 60 libras) usen cinturones de seguridad si el vehículo
    está equipado con ellos.
- id: 204
  category: vehicle_information
  question: 'En Nevada, los camiones y remolques deben estar equipados con guardabarros
    si tienen una clasificación de peso bruto vehicular (GVWR) del fabricante de más
    de:'
  choices:
    A: 10,000 libras
    B: 15,000 libras
    C: 20,000 libras
    D: 26,000 libras
  answer: D
  explanation: La ley de Nevada (NRS 484D.435) exige guardabarros en las ruedas traseras
    de cada vehículo de motor con un GVWR de más de 26,000 libras.
- id: 205
  category: signs_and_signals
  question: En Nevada, ¿qué significa una señal de flecha amarilla intermitente?
  choices:
    A: Deténgase y espere a una flecha verde
    B: La señal está a punto de ponerse roja; despeje la intersección
    C: Ceda el paso al tráfico en sentido contrario y a los peatones, luego proceda
      con precaución en la dirección de la flecha
    D: Usted tiene el derecho de paso para girar a la izquierda
  answer: C
  explanation: Según el Manual del Conductor de Nevada, una flecha amarilla intermitente
    significa que puede girar en la dirección de la flecha después de ceder el paso
    al tráfico en sentido contrario y a los peatones.
- id: 206
  category: signs_and_signals
  question: En Nevada, ¿cuál es el límite de velocidad estándar en una zona escolar
    cuando las señales están parpadeando o durante las horas publicadas?
  choices:
    A: 10 mph
    B: 15 o 25 mph
    C: 20 mph
    D: 30 mph
  answer: B
  explanation: Los límites de velocidad en las zonas escolares de Nevada son normalmente
    de 15 o 25 mph y están en vigor durante los horarios publicados o cuando las luces
    amarillas están parpadeando.
- id: 207
  category: signs_and_signals
  question: Según la ley de Nevada, ¿cuándo se le permite dar una vuelta en U en un
    distrito comercial?
  choices:
    A: En cualquier lugar, siempre que sea seguro
    B: Solo en una intersección o en una carretera dividida donde exista una apertura
      apropiada
    C: Nunca en un distrito comercial
    D: Solo en medio de una cuadra si no vienen autos
  answer: B
  explanation: La norma NRS 484B.403 prohíbe las vueltas en U en distritos comerciales,
    excepto en una intersección o en una carretera dividida donde exista una apertura
    apropiada.
- id: 208
  category: signs_and_signals
  question: ¿Qué indica una línea blanca continua pintada en el pavimento entre los
    carriles de tráfico?
  choices:
    A: Usted está en una calle de un solo sentido
    B: Se desaconsejan los cambios de carril; debe permanecer en su carril
    C: Debe girar en la dirección de la flecha
    D: El tráfico se mueve en direcciones opuestas
  answer: B
  explanation: En Nevada, una línea blanca continua indica que se desaconsejan los
    cambios de carril por razones de seguridad, aunque no es estrictamente ilegal
    como una línea blanca continua doble.
- id: 209
  category: signs_and_signals
  question: En Nevada, ¿qué indica una 'X roja' sobre un carril de tráfico?
  choices:
    A: El carril es solo para vehículos de emergencia
    B: Debe detenerse por completo en ese carril
    C: No debe conducir por este carril
    D: El carril está a punto de cerrarse; incorpórese de inmediato
  answer: C
  explanation: Una señal de X roja sobre un carril significa que el carril está cerrado
    al tráfico en su dirección y no debe usarlo.
- id: 210
  category: signs_and_signals
  question: Al acercarse a un cruce de ferrocarril en Nevada, ¿a cuántos pies de la
    vía más cercana debe detener su vehículo si una señal está parpadeando?
  choices:
    A: Entre 5 y 25 pies
    B: Entre 10 y 30 pies
    C: Entre 15 y 50 pies
    D: Exactamente 20 pies
  answer: C
  explanation: La norma NRS 484B.553 exige que los conductores se detengan entre 15
    y 50 pies de la vía más cercana de un cruce de ferrocarril cuando las señales
    de advertencia estén activas.
- id: 211
  category: signs_and_signals
  question: En Nevada, ¿cuál es el significado de una señal de "ceder el paso" (yield)?
  choices:
    A: Reducir la velocidad y estar preparado para detenerse si es necesario para
      dejar pasar a otros conductores o peatones
    B: Detenerse por completo siempre antes de continuar
    C: Aumentar la velocidad para incorporarse al tráfico
    D: Usted tiene el derecho de paso sobre todo el resto del tráfico
  answer: A
  explanation: Una señal de ceder el paso significa que debe reducir la velocidad
    y ceder el derecho de paso a cualquier vehículo o peatón que se encuentre en la
    intersección o que se aproxime tanto que constituya un peligro.
- id: 212
  category: signs_and_signals
  question: ¿Cuál de estas es la acción correcta al aproximarse a una glorieta (roundabout)
    en Nevada?
  choices:
    A: Detenerse siempre antes de entrar en la glorieta
    B: Ceder el paso al tráfico que ya está en la glorieta y a su izquierda
    C: Ceder el paso al tráfico que entra por su derecha
    D: Aumentar la velocidad para encontrar un espacio en el tráfico
  answer: B
  explanation: La ley de Nevada exige que los conductores que entran en una glorieta
    cedan el derecho de paso al tráfico que ya circula dentro de ella, el cual vendrá
    por la izquierda.
- id: 213
  category: signs_and_signals
  question: 'En Nevada, un bordillo (curb) pintado de azul indica:'
  choices:
    A: Zona de carga para vehículos comerciales
    B: Estacionamiento únicamente para personas con discapacidad que tengan un permiso
      válido
    C: Prohibido estacionar o detenerse en cualquier momento
    D: Solo para subir y bajar pasajeros
  answer: B
  explanation: Un bordillo azul designa espacios de estacionamiento para personas
    con discapacidades que tienen un cartel (placard) o placa de matrícula válida.
- id: 214
  category: signs_and_signals
  question: ¿Cuándo se puede girar legalmente a la izquierda con semáforo en rojo
    en Nevada?
  choices:
    A: Nunca
    B: Desde una calle de un solo sentido hacia otra calle de un solo sentido después
      de detenerse y ceder el paso
    C: Desde una calle de doble sentido hacia una calle de un solo sentido
    D: En cualquier intersección si no viene tráfico
  answer: B
  explanation: La ley NRS 484B.307 permite girar a la izquierda en rojo solo cuando
    se gira desde una calle de un solo sentido hacia otra calle de un solo sentido,
    después de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 215
  category: signs_and_signals
  question: En Nevada, ¿qué significan las líneas amarillas continuas dobles en el
    centro de la carretera?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por su lado
    C: Se prohíbe rebasar a los vehículos que circulan en cualquier dirección
    D: La carretera es una calle de un solo sentido
  answer: C
  explanation: Las líneas amarillas continuas dobles significan que no se permite
    rebasar a los vehículos que viajan en ninguna de las dos direcciones.
- id: 216
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal naranja en forma de diamante en una
    carretera de Nevada?
  choices:
    A: Señal reglamentaria (ej. límite de velocidad)
    B: Señal de servicio (ej. gasolina o alojamiento)
    C: Advertencia de construcción o mantenimiento
    D: Guía de área recreativa
  answer: C
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para advertir a los conductores sobre zonas de construcción y mantenimiento.
- id: 217
  category: signs_and_signals
  question: En Nevada, si conduce por una carretera con una señal de "HOV 2+", ¿qué
    indica esto?
  choices:
    A: El carril es para vehículos con 2 o más ocupantes durante horas específicas
    B: El límite de velocidad es 20 mph más alto en este carril
    C: Solo se permiten camiones de carga pesada con 2 ejes
    D: El carril es para vehículos de emergencia con 2 sirenas
  answer: A
  explanation: HOV significa Vehículo de Alta Ocupación (High Occupancy Vehicle).
    En Nevada (común en Las Vegas), los carriles HOV 2+ están reservados para vehículos
    con al menos dos personas durante las horas especificadas en las señales.
- id: 218
  category: signs_and_signals
  question: Cuando vea una flecha amarilla fija apuntando a la izquierda en una intersección
    de Nevada, ¿qué debe hacer?
  choices:
    A: El tiempo de giro "protegido" está terminando; prepárese para detenerse
    B: Usted tiene el derecho de paso para girar a la izquierda
    C: Deténgase inmediatamente, incluso si está en la intersección
    D: Gire a la izquierda rápidamente antes de que cambie la luz
  answer: A
  explanation: Una flecha amarilla fija significa que la señal está a punto de cambiar
    a rojo. Si ya se encuentra en la intersección, debe completar su giro de manera
    segura. Si no ha entrado, debe detenerse.
- id: 219
  category: signs_and_signals
  question: Si las luces direccionales de su vehículo fallan, ¿cuál es la señal manual
    correcta para un giro a la derecha en Nevada?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia afuera y doblado hacia arriba en el codo
    C: Brazo izquierdo extendido hacia afuera y doblado hacia abajo en el codo
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: Para un giro a la derecha, el conductor debe extender su brazo izquierdo
    por la ventana y doblarlo hacia arriba en el codo, formando una "L".
- id: 220
  category: signs_and_signals
  question: En las zonas escolares de Nevada, ¿cuándo están en vigor los límites de
    velocidad reducidos (generalmente 15 o 25 mph)?
  choices:
    A: Solo cuando hay niños presentes en la acera
    B: Solo durante el horario escolar
    C: En días escolares de 7:00 AM a 4:00 PM
    D: Cuando las señales están parpadeando o durante los horarios indicados en la
      señal
  answer: D
  explanation: La ley de Nevada establece que los límites de velocidad en zonas escolares
    están en vigor cuando las luces amarillas de las señales parpadean o durante los
    períodos de tiempo específicos publicados en las señales.
- id: 221
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente en una intersección de Nevada?
  choices:
    A: Reduzca la velocidad y continúe si el camino está despejado
    B: Deténgase y espere a que la luz cambie a verde
    C: Deténgase por completo y continúe solo cuando sea seguro
    D: La señal está averiada; ignórela y siga las reglas de derecho de paso
  answer: C
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de alto. Debe detenerse por completo, ceder el paso al tráfico transversal y a
    los peatones, y continuar cuando sea seguro.
- id: 222
  category: signs_and_signals
  question: 'En Nevada, las líneas amarillas dobles continuas en la carretera significan:'
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se prohíbe rebasar en ambas direcciones
    C: Puede rebasar si no viene tráfico en sentido contrario
    D: La carretera está en construcción
  answer: B
  explanation: Las líneas amarillas dobles continuas significan que se prohíbe rebasar
    a los vehículos que circulan en cualquier dirección. Solo puede cruzar estas líneas
    para girar a la izquierda hacia o desde una entrada privada o un callejón.
- id: 223
  category: signs_and_signals
  question: ¿Cuál es la forma y el color de una señal estándar de "Ceda el paso" (Yield)
    en Nevada?
  choices:
    A: Un octágono rojo con letras blancas
    B: Un diamante amarillo con letras negras
    C: Un triángulo que apunta hacia abajo de color rojo y blanco
    D: Un rectángulo blanco con letras negras
  answer: C
  explanation: Las señales de ceda el paso en Nevada y en todo EE. UU. son triángulos
    equiláteros que apuntan hacia abajo, con un borde rojo y un interior blanco.
- id: 224
  category: signs_and_signals
  question: 'Un símbolo en forma de diamante pintado en un carril de una carretera
    de Nevada indica:'
  choices:
    A: El carril es solo para vehículos de emergencia
    B: El carril está reservado para vehículos de alta ocupación (HOV)
    C: El carril terminará pronto
    D: Hay un cruce de ferrocarril más adelante
  answer: B
  explanation: El símbolo del diamante marca los carriles HOV, que están reservados
    para vehículos con un número específico de ocupantes, autobuses o motocicletas
    durante ciertas horas.
- id: 225
  category: signs_and_signals
  question: 'Cuando una señal para peatones muestra un mensaje intermitente de "No
    cruzar" (Don''t Walk) o una "Mano levantada" en Nevada, el peatón debe:'
  choices:
    A: Correr hacia el otro lado de la calle
    B: No comenzar a cruzar la calle
    C: Detenerse en medio de la calle y esperar a la siguiente señal
    D: Regresar a la acera que acaba de dejar
  answer: B
  explanation: Si la señal es intermitente, los peatones que ya han comenzado a cruzar
    deben continuar hasta el otro lado. Los peatones que aún no han entrado en la
    calle no deben comenzar a cruzar.
- id: 226
  category: signs_and_signals
  question: En Nevada, las señales reglamentarias que proporcionan información sobre
    leyes y reglamentos suelen tener ¿qué forma y color?
  choices:
    A: Forma de diamante y color amarillo
    B: Circulares y de color azul
    C: Rectangulares y blancas con letras negras o rojas
    D: Forma de pentágono y color verde fluorescente
  answer: C
  explanation: Las señales reglamentarias, como los límites de velocidad o las señales
    de "No dar vuelta en U", suelen ser rectángulos verticales con fondo blanco y
    marcas negras o rojas.
- id: 227
  category: signs_and_signals
  question: 'Una señal amarilla redonda con una "X" grande y las letras "RR" indica:'
  choices:
    A: Hay un área de descanso más adelante
    B: Comienza una carretera rural
    C: Hay un cruce de ferrocarril más adelante
    D: Una curva cerrada a la derecha
  answer: C
  explanation: La señal amarilla circular con una "X" negra y "RR" es la señal de
    advertencia anticipada para un cruce de ferrocarril.
- id: 228
  category: signs_and_signals
  question: ¿Cuál es la señal manual de Nevada para reducir la velocidad o detenerse?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia afuera y doblado hacia arriba
    C: Brazo izquierdo extendido hacia afuera y doblado hacia abajo
    D: Brazo derecho moviéndose de un lado a otro
  answer: C
  explanation: Para indicar que se va a reducir la velocidad o detenerse mediante
    señales manuales, el conductor debe extender el brazo izquierdo por la ventana
    y doblarlo hacia abajo a la altura del codo.
- id: 229
  category: signs_and_signals
  question: 'En Nevada, las señales de color naranja se utilizan para advertir a los
    conductores sobre:'
  choices:
    A: Parques cercanos o áreas recreativas
    B: Servicios para automovilistas como gasolina o alojamiento
    C: Zonas de construcción o mantenimiento de carreteras
    D: Zonas escolares
  answer: C
  explanation: El naranja es el color estándar para las señales de advertencia en
    zonas de trabajo de construcción y mantenimiento. Los conductores deben estar
    atentos a los trabajadores y al equipo.
- id: 230
  image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y continúe con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) octagonal roja significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 231
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico en sentido contrario.
  id: 232
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera segura.
  id: 233
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda únicamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de un solo sentido (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 234
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 235
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 236
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 237
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico en ambos sentidos más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 238
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha únicamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 239
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 240
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 241
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 242
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal pentagonal (de 5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 243
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 244
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 245
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Se requiere giro a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 246
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 247
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera curve
    primero en un sentido y luego en el otro.
  id: 248
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 249
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica que se prepare esta señal?
  choices:
    A: Un carril que termina
    B: Tráfico incorporándose desde otra carretera
    C: Inicio de una carretera dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación (merge) en forma de diamante advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 250
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Esté preparado para una reducción en el ancho de la vía y ajuste
    su posición en el carril.
  id: 251
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: El camino termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que el camino más adelante se convierte en una
    autopista dividida con un camellón o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 252
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por un camellón. Esté preparado para el tráfico
    de doble sentido.
  id: 253
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de rebase más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 254
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Camino sinuoso más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 255
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache o resalto en el camino
    B: Superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 256
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un retén policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo
    donde el semáforo puede no ser visible desde la distancia.
  id: 257
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
