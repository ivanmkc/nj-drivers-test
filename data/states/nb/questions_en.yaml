metadata:
  source: New Brunswick Driver Handbook
  total_questions: 217
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In New Brunswick, what is the minimum age to apply for a Class 7 Level
    1 learner's permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 17 years old
  answer: C
  explanation: In New Brunswick, an individual must be at least 16 years of age to
    apply for a Class 7 Level 1 learner's permit.
- id: 2
  category: license_system
  question: How long must a driver hold a Class 7 Level 1 permit before they can take
    the road test, if they have NOT graduated from a licensed driver training school?
  choices:
    A: 6 months
    B: 8 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: Drivers must hold a Level 1 permit for 12 months. This period is reduced
    to 8 months if the driver successfully completes an approved driver training course.
- id: 3
  category: license_system
  question: While driving with a Class 7 Level 1 permit in New Brunswick, what is
    the restricted driving time?
  choices:
    A: 10:00 PM to 6:00 AM
    B: Midnight to 5:00 AM
    C: 11:00 PM to 5:00 AM
    D: 9:00 PM to 7:00 AM
  answer: B
  explanation: Class 7 Level 1 drivers are prohibited from driving between the hours
    of midnight and 5:00 AM.
- id: 4
  category: license_system
  question: What is the maximum Blood Alcohol Concentration (BAC) allowed for a driver
    under the age of 21 in New Brunswick?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: New Brunswick has a zero-tolerance policy (0.00% BAC) for all drivers
    under the age of 21, as well as all drivers in the Graduated Driver's License
    (GDL) program.
- id: 5
  category: license_system
  question: Under the New Brunswick GDL program, who must accompany a Class 7 Level
    1 driver in the front seat?
  choices:
    A: Any person over the age of 21
    B: A licensed driver with at least 1 year of driving experience
    C: A licensed driver with at least 3 years of driving experience and a valid Class
      5 license or higher
    D: A parent or legal guardian only
  answer: C
  explanation: The accompanying driver must hold a valid Class 5 license or higher
    and have at least three years of driving experience.
- id: 6
  category: license_system
  question: If you move to a new residence within New Brunswick, how many days do
    you have to notify the Registrar of Motor Vehicles of your change of address?
  choices:
    A: 7 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: According to the New Brunswick Motor Vehicle Act, you must notify the
    Registrar of a change of address within 10 days.
- id: 7
  category: license_system
  question: In New Brunswick, at how many accumulated points will a driver's license
    be suspended?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: A driver's license in New Brunswick is suspended when they accumulate
    12 points.
- id: 8
  category: license_system
  question: A Class 7 Level 2 driver is restricted to how many passengers between
    the hours of midnight and 5:00 AM, unless accompanied by a qualified driver?
  choices:
    A: Zero passengers
    B: One passenger
    C: Two passengers
    D: Three passengers
  answer: B
  explanation: Between midnight and 5:00 AM, a Level 2 driver is restricted to one
    passenger who is not a member of their immediate family, unless accompanied by
    a qualified driver.
- id: 9
  category: license_system
  question: How many points are deducted from a New Brunswick driver's record upon
    successful completion of an approved Defensive Driving Course?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Drivers can have up to 3 points removed from their record once every
    two years by completing an approved defensive driving course.
- id: 10
  category: license_system
  question: What is the penalty for a first-time administrative license suspension
    for a BAC between 0.05% and 0.08% in New Brunswick?
  choices:
    A: 24-hour suspension
    B: 7-day suspension
    C: 30-day suspension
    D: 90-day suspension
  answer: B
  explanation: A first-time offense for having a BAC between 0.05% and 0.08% results
    in an immediate 7-day administrative license suspension.
- id: 11
  category: license_system
  question: In New Brunswick, how often must a standard Class 5 driver's license be
    renewed?
  choices:
    A: Every 2 years
    B: Every 3 years
    C: Every 4 years
    D: Every 5 years
  answer: C
  explanation: New Brunswick driver's licenses are typically valid for a period of
    4 years, expiring on the driver's birthday.
- id: 12
  category: license_system
  question: Which of the following is a requirement for a Class 7 Level 1 driver regarding
    passengers?
  choices:
    A: No passengers are allowed in the vehicle
    B: Only immediate family members are allowed
    C: Only the accompanying driver is allowed in the front seat
    D: Up to 3 passengers are allowed in the back seat
  answer: C
  explanation: For a Level 1 driver, the only person allowed in the front seat is
    the qualified accompanying driver. Other passengers are permitted in the rear
    seats, provided there are seat belts for each.
- id: 13
  category: license_system
  question: What is the minimum duration a driver must spend in the Class 7 Level
    2 phase before graduating to a full Class 5 license?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: Drivers must remain in the Level 2 phase for at least 12 months without
    suspension before they are eligible for a full Class 5 license.
- id: 14
  category: license_system
  question: If a GDL driver (Level 1 or 2) violates the 0.00% BAC requirement, what
    is the immediate suspension period for a first offense?
  choices:
    A: 7 days
    B: 30 days
    C: 90 days
    D: 1 year
  answer: D
  explanation: Under the New Brunswick GDL program, any breach of the 0.00% BAC limit
    results in an immediate 1-year suspension of driving privileges.
- id: 15
  category: license_system
  question: Which of the following documents must a driver carry at all times while
    operating a motor vehicle in New Brunswick?
  choices:
    A: A valid driver's license only
    B: A valid driver's license and vehicle registration only
    C: A valid driver's license, vehicle registration, and proof of valid insurance
    D: A valid driver's license and proof of insurance only
  answer: C
  explanation: Drivers in New Brunswick are legally required to carry their driver's
    license, the vehicle's registration certificate, and a valid motor vehicle liability
    insurance card.
- id: 16
  category: license_system
  question: In New Brunswick, what is the minimum age required to apply for a Class
    9 license, which permits the operation of a motor-driven cycle (moped)?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 12 years old
  answer: A
  explanation: According to the New Brunswick Driver's Handbook, a person must be
    at least 14 years of age to apply for a Class 9 license to operate a moped.
- id: 17
  category: license_system
  question: A person accompanying a Class 7 Level 1 driver in New Brunswick must have
    held a valid Class 5 license (or higher) for at least how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: The accompanying driver for a learner must be a 'qualified driver,'
    which is defined in New Brunswick as someone who has held a valid Class 5 license
    for at least 3 years.
- id: 18
  category: license_system
  question: How many demerit points are assigned to a New Brunswick driver's record
    for failing to stop for a school bus when its red lights are flashing?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: Failing to stop for a school bus is a serious offense in New Brunswick
    and results in 5 demerit points being added to the driver's record.
- id: 19
  category: license_system
  question: When a vehicle is sold in New Brunswick, within how many days must the
    new owner register the transfer of ownership with the Registrar of Motor Vehicles?
  choices:
    A: 24 hours
    B: 7 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: Under New Brunswick law, the new owner of a vehicle must register the
    transfer of ownership within 7 days of the purchase.
- id: 20
  category: license_system
  question: Which class of New Brunswick driver's license is required to operate a
    taxi, an ambulance, or a bus with a seating capacity of fewer than 25 passengers?
  choices:
    A: Class 3
    B: Class 4
    C: Class 5
    D: Class 2
  answer: B
  explanation: A Class 4 license in New Brunswick is specifically required for drivers
    of taxis, ambulances, and small buses (under 25 passengers).
- id: 21
  category: license_system
  question: To meet the vision standards for a Class 5 license in New Brunswick, an
    applicant's visual acuity must be at least what in their best eye (with or without
    corrective lenses)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: The minimum vision requirement for a standard Class 5 license in New
    Brunswick is 20/40 visual acuity in at least one eye.
- id: 22
  category: license_system
  question: In New Brunswick, how many demerit points are recorded against your license
    for speeding 25 km/h or more over the posted speed limit?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Speeding 25 km/h or more over the limit results in 3 demerit points,
    whereas speeding less than 25 km/h over results in 2 points.
- id: 23
  category: license_system
  question: 'If you change your name due to marriage or other legal reasons, you must
    notify the Registrar of Motor Vehicles and obtain a replacement license within:'
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: New Brunswick law requires drivers to notify the Registrar of a name
    change within 10 days.
- id: 24
  category: license_system
  question: A Class 8 license in New Brunswick is a specialty license that permits
    the operation of which type of vehicle?
  choices:
    A: Motorcycle
    B: Farm Tractor
    C: Tow Truck
    D: School Bus
  answer: B
  explanation: A Class 8 license is specifically for the operation of farm tractors.
- id: 25
  category: license_system
  question: In New Brunswick, what is the minimum amount of Third Party Liability
    insurance coverage required by law?
  choices:
    A: $50,000
    B: $100,000
    C: $200,000
    D: $500,000
  answer: C
  explanation: The New Brunswick Motor Vehicle Act requires all registered vehicles
    to carry a minimum of $200,000 in Third Party Liability insurance.
- id: 26
  category: license_system
  question: For a driver holding a Class 1, 2, 3, or 4 (commercial) license in New
    Brunswick, how often must they submit a medical report to the Registrar if they
    are under the age of 45?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Only when renewing the license
  answer: C
  explanation: Commercial drivers in New Brunswick must provide a medical report every
    5 years until age 45, every 3 years from 45 to 65, and annually after age 65.
- id: 27
  category: license_system
  question: How many demerit points are assigned for a 'Following too closely' (tailgating)
    conviction in New Brunswick?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Following too closely is a 2-point offense under the New Brunswick
    demerit point system.
- id: 28
  category: license_system
  question: Which of the following is a requirement for a Class 7 Level 2 driver regarding
    the total number of passengers allowed during daytime hours (5:00 AM to midnight)?
  choices:
    A: Only 1 passenger is allowed
    B: Only immediate family members are allowed
    C: The number of passengers cannot exceed the number of working seatbelts
    D: No passengers are allowed
  answer: C
  explanation: During daytime hours, a Class 7 Level 2 driver is limited only by the
    number of functional seatbelts in the vehicle. The 'one passenger' restriction
    only applies between midnight and 5:00 AM.
- id: 29
  category: license_system
  question: 'If a New Brunswick driver''s license is suspended, the driver must immediately
    surrender the license to:'
  choices:
    A: The local police station
    B: The Registrar of Motor Vehicles
    C: Their insurance company
    D: The nearest courthouse
  answer: B
  explanation: When a license is suspended, the physical card must be returned to
    the Registrar of Motor Vehicles.
- id: 30
  category: license_system
  question: How many demerit points are added to your record for a conviction of 'Failing
    to yield the right-of-way' in New Brunswick?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failing to yield the right-of-way to a vehicle or pedestrian results
    in 3 demerit points in New Brunswick.
- id: 31
  category: driver_testing
  question: What is the minimum visual acuity required in at least one eye to pass
    the vision test for a Class 5 license in New Brunswick?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to the New Brunswick Driver's Handbook, an applicant for
    a Class 5 license must have a visual acuity of at least 20/40 in at least one
    eye, with or without corrective lenses.
- id: 32
  category: driver_testing
  question: If you fail your first road test in New Brunswick, how many days must
    you wait before you are eligible to take a second test?
  choices:
    A: 24 hours
    B: 7 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: In New Brunswick, if you fail the road test, you must wait at least
    7 days before you can take it again. Subsequent failures may result in longer
    waiting periods (14 days after the second failure).
- id: 33
  category: driver_testing
  question: Unless otherwise posted, what is the maximum speed limit in an urban district
    in New Brunswick?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: Under the New Brunswick Motor Vehicle Act, the statutory speed limit
    in any urban district is 50 km/h unless signs indicate otherwise.
- id: 34
  category: driver_testing
  question: In New Brunswick, how many demerit points are assigned to a driver's record
    for a conviction of using a handheld electronic device while driving?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 9 points
  answer: B
  explanation: Using a handheld communication device (distracted driving) in New Brunswick
    results in 3 demerit points being added to the driver's record.
- id: 35
  category: driver_testing
  question: What is the minimum amount of third-party liability insurance required
    by law for a motor vehicle in New Brunswick?
  choices:
    A: $50,000
    B: $100,000
    C: $200,000
    D: $500,000
  answer: C
  explanation: New Brunswick law requires all motor vehicles to be covered by a minimum
    of $200,000 in third-party liability insurance.
- id: 36
  category: driver_testing
  question: A Class 7 Level 1 driver in New Brunswick is strictly prohibited from
    which of the following activities?
  choices:
    A: Driving on a 4-lane highway
    B: Towing another vehicle or a trailer
    C: Driving with the radio on
    D: Driving a vehicle with manual transmission
  answer: B
  explanation: Under the Graduated Driver's License (GDL) program in New Brunswick,
    Class 7 Level 1 drivers are not permitted to tow a trailer or another vehicle.
- id: 37
  category: driver_testing
  question: How often must a motor vehicle registered in New Brunswick undergo a mandatory
    safety inspection?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: In New Brunswick, motor vehicles are required to undergo a safety inspection
    every year (annually) to ensure they meet provincial safety standards.
- id: 38
  category: driver_testing
  question: In New Brunswick, you are not permitted to park a vehicle within how many
    meters of a fire hydrant?
  choices:
    A: 2 meters
    B: 3 meters
    C: 5 meters
    D: 10 meters
  answer: C
  explanation: The New Brunswick Motor Vehicle Act prohibits parking a vehicle within
    5 meters of a fire hydrant.
- id: 39
  category: driver_testing
  question: 'In New Brunswick, you must report a motor vehicle accident to the nearest
    law enforcement agency if the total property damage appears to exceed:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: B
  explanation: Drivers in New Brunswick are legally required to report any accident
    involving injury, death, or property damage that appears to exceed $1,000.
- id: 40
  category: driver_testing
  question: When following another vehicle at night in New Brunswick, you must dim
    your high-beam headlights when you are within how many meters of that vehicle?
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: B
  explanation: The New Brunswick Driver's Handbook states that you must switch to
    low beams when following another vehicle within 60 meters.
- id: 41
  category: driver_testing
  question: In New Brunswick, what is the speed limit in a school zone located in
    an urban area between 7:30 AM and 4:00 PM on school days?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: In New Brunswick, the speed limit in urban school zones is 30 km/h
    during school hours (7:30 AM to 4:00 PM) or when children are present.
- id: 42
  category: driver_testing
  question: In New Brunswick, a child must be secured in a booster seat until they
    meet which of the following criteria?
  choices:
    A: They are 7 years old
    B: They weigh 18 kg (40 lbs)
    C: They reach a height of 145 cm (4'9")
    D: They are at least 12 years old
  answer: C
  explanation: New Brunswick law requires children to use a booster seat until they
    reach 145 cm (4'9") in height, or 36 kg (80 lbs) in weight, or 9 years of age.
- id: 43
  category: driver_testing
  question: When an emergency vehicle with sirens and flashing lights is approaching
    from either direction on a two-lane road, what must a driver do?
  choices:
    A: Speed up to get out of the way
    B: Maintain speed and stay in the lane
    C: Pull as far to the right as possible and stop
    D: Stop exactly where they are in the lane
  answer: C
  explanation: In New Brunswick, drivers must pull to the right-hand curb or edge
    of the road and stop until the emergency vehicle has passed.
- id: 44
  category: driver_testing
  question: In New Brunswick, when is it permissible to pass another vehicle on the
    right?
  choices:
    A: When the vehicle ahead is making or signaling a left turn and there is a clear
      lane
    B: Whenever you are in a hurry and the left lane is blocked
    C: On a two-lane highway with a gravel shoulder
    D: It is never permissible to pass on the right
  answer: A
  explanation: Passing on the right is allowed in New Brunswick only when the vehicle
    being overtaken is making a left turn and there is a paved portion of the highway
    (not the shoulder) available for the maneuver.
- id: 45
  category: driver_testing
  question: During the New Brunswick road test, which of the following will result
    in an immediate failure?
  choices:
    A: Failing to use a turn signal once
    B: An action that requires the examiner to take control of the vehicle to avoid
      a collision
    C: Adjusting the mirrors before starting the engine
    D: Driving 2 km/h under the speed limit
  answer: B
  explanation: Any action that necessitates the examiner's intervention to prevent
    an accident or a dangerous situation results in an immediate failure of the road
    test.
- id: 46
  category: driver_testing
  question: In New Brunswick, between which dates are studded tires permitted on vehicles?
  choices:
    A: November 1 to April 1
    B: October 15 to May 1
    C: December 1 to March 31
    D: October 1 to April 30
  answer: B
  explanation: Studded tires are permitted in New Brunswick from October 15th to May
    1st of the following year.
- id: 47
  category: driver_testing
  question: How many demerit points are assigned for failing to stop at a stop sign
    or a red light in New Brunswick?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failing to stop for a stop sign or a red light results in 3 demerit
    points being added to a driver's record in New Brunswick.
- id: 48
  category: driver_testing
  question: 'When approaching a stopped emergency vehicle with its red or blue lights
    flashing on a multi-lane highway, New Brunswick''s ''Move Over'' law requires
    you to:'
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but honk your horn
    C: Slow down and move into a non-adjacent lane if it is safe to do so
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: New Brunswick law requires drivers to slow down and, if on a multi-lane
    highway, move to the left lane (if safe) when passing emergency vehicles with
    flashing lights.
- id: 49
  category: driver_testing
  question: In New Brunswick, who is legally responsible for ensuring that a passenger
    under the age of 16 is wearing a seatbelt or is in an appropriate child restraint?
  choices:
    A: The passenger
    B: The passenger's parents (even if not in the car)
    C: The driver of the vehicle
    D: The owner of the vehicle
  answer: C
  explanation: The driver is responsible for ensuring all passengers under the age
    of 16 are properly secured in the vehicle.
- id: 50
  category: driver_testing
  question: When stopping at a railway crossing in New Brunswick, what is the minimum
    distance you must stop from the nearest rail?
  choices:
    A: 2 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: When a stop is required at a railway crossing, you must stop no closer
    than 5 meters and no further than 15 meters from the nearest rail.
- id: 51
  category: driver_testing
  question: 'In New Brunswick, a police report must be filed if a collision results
    in injury, death, or total property damage exceeding:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: B
  explanation: Any collision involving injury, death, or property damage totaling
    $1,000 or more must be reported to the police immediately.
- id: 52
  category: driver_testing
  question: 'In New Brunswick, a U-turn is prohibited on a curve or hill where there
    is not a clear view of the road in both directions for at least:'
  choices:
    A: 100 meters
    B: 150 meters
    C: 200 meters
    D: 500 meters
  answer: B
  explanation: U-turns are illegal on curves or near the crest of a hill where the
    driver does not have at least 150 meters of clear visibility in both directions.
- id: 53
  category: driver_testing
  question: Under what circumstance is it legal to pass another vehicle on the right
    in New Brunswick?
  choices:
    A: When the vehicle ahead is making or signaling a left turn
    B: When you are in a hurry and the left lane is blocked
    C: When the vehicle ahead is driving below the speed limit
    D: It is never legal to pass on the right
  answer: A
  explanation: You may pass on the right if the vehicle being overtaken is making
    or signaling a left turn and there is a paved unobstructed portion of the roadway
    available for the pass.
- id: 54
  category: driver_responsibility
  question: In New Brunswick, an accident must be reported to the nearest police officer
    immediately if the total property damage appears to exceed what amount?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: According to the New Brunswick Motor Vehicle Act, any accident involving
    injury, death, or property damage apparently exceeding $1,000 must be reported
    to the police immediately.
- id: 55
  category: driver_responsibility
  question: For most private passenger vehicles in New Brunswick, how often must a
    valid safety inspection be performed?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Only when the vehicle is sold
  answer: B
  explanation: As of 2020, New Brunswick requires most personal vehicles to undergo
    a safety inspection every two years.
- id: 56
  category: driver_responsibility
  question: A person who becomes a resident of New Brunswick must register their out-of-province
    vehicle within how many months of taking up residence?
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 12 months
  answer: C
  explanation: New residents of New Brunswick are granted a grace period of six months
    to register their vehicles with the province.
- id: 57
  category: driver_responsibility
  question: When selling a vehicle privately in New Brunswick, what is the seller's
    responsibility regarding the Certificate of Registration?
  choices:
    A: The seller must keep it for their records.
    B: The seller must destroy it.
    C: The seller must sign the 'Transfer of Ownership' on the back and give it to
      the purchaser.
    D: The seller must mail it to the insurance company.
  answer: C
  explanation: To legally transfer a vehicle, the seller must sign the back of the
    Certificate of Registration (Transfer of Ownership section) and provide it to
    the buyer.
- id: 58
  category: driver_responsibility
  question: At what age must a driver holding a standard Class 5 license in New Brunswick
    begin submitting periodic medical reports to the Registrar of Motor Vehicles?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: C
  explanation: In New Brunswick, drivers are required to submit a medical report at
    age 75, age 80, and every two years thereafter.
- id: 59
  category: driver_responsibility
  question: In New Brunswick, what is the minimum fine for a first-time conviction
    of operating a motor vehicle without valid liability insurance?
  choices:
    A: $100
    B: $300
    C: $600
    D: $1,500
  answer: C
  explanation: The fine for driving without insurance in New Brunswick is significant,
    ranging from a minimum of $600 to a maximum of $3,000.
- id: 60
  category: driver_responsibility
  question: If a driver fails to satisfy a legal judgment against them for damages
    resulting from a motor vehicle accident, what action will the Registrar take?
  choices:
    A: Increase their registration fees
    B: Suspend the driver's license and vehicle registrations
    C: Issue a warning letter
    D: Require the driver to retake the road test
  answer: B
  explanation: Under the financial responsibility laws, if a judgment is not paid,
    the driver's license and vehicle registrations are suspended until the judgment
    is satisfied.
- id: 61
  category: driver_responsibility
  question: Which of the following vehicles can be operated with a New Brunswick Class
    3 driver's license?
  choices:
    A: A motorcycle only
    B: A bus with more than 24 passengers
    C: Any two-axle vehicle, or a truck with more than two axles
    D: A semi-trailer truck
  answer: C
  explanation: A Class 3 license allows the holder to drive any 2-axle vehicle, a
    3-axle vehicle (truck), and a tow truck, but not a semi-trailer (Class 1) or a
    large bus (Class 2).
- id: 62
  category: driver_responsibility
  question: How many demerit points are assigned to a driver who fails to yield the
    right-of-way to a pedestrian in New Brunswick?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failing to yield the right-of-way to a pedestrian is a serious offense
    in New Brunswick and carries a penalty of 3 demerit points.
- id: 63
  category: driver_responsibility
  question: Where is a driver required by law to keep the vehicle's Certificate of
    Registration?
  choices:
    A: At home in a safe place
    B: In the vehicle
    C: At the owner's place of business
    D: With the insurance agent
  answer: B
  explanation: The Certificate of Registration (or a photocopy) must be kept in the
    vehicle at all times so it can be produced upon the request of a peace officer.
- id: 64
  category: driver_responsibility
  question: Under the Criminal Code of Canada, what is the Blood Alcohol Concentration
    (BAC) limit at which a driver is considered to be committing a criminal offense?
  choices:
    A: 0.02% or higher
    B: 0.05% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: While New Brunswick has administrative penalties starting at 0.05%,
    the Criminal Code of Canada sets the legal limit for criminal prosecution at 0.08%
    (80 milligrams of alcohol in 100 milliliters of blood).
- id: 65
  category: driver_responsibility
  question: When selling a vehicle in New Brunswick, what should the seller do with
    the license plates?
  choices:
    A: Leave them on the vehicle for the new owner
    B: Return them to the police station
    C: Remove them and keep them for personal use or return them to SNB
    D: Destroy them immediately
  answer: C
  explanation: In New Brunswick, license plates follow the owner, not the vehicle.
    When you sell a car, you must remove your plates.
- id: 66
  category: driver_responsibility
  question: If you are involved in a collision, what information are you legally required
    to exchange with the other driver?
  choices:
    A: Name, address, and phone number only
    B: Name, address, vehicle registration number, and insurance information
    C: Driver's license number and home address only
    D: Insurance policy number and name of employer
  answer: B
  explanation: Drivers involved in an accident must provide their name, address, vehicle
    registration number, and insurance details to the other party or to the police.
- id: 67
  category: driver_responsibility
  question: 'In New Brunswick, a vehicle''s registration typically expires on:'
  choices:
    A: December 31st of every year
    B: The anniversary of the date the vehicle was purchased
    C: The last day of the owner's birth month
    D: March 31st, the end of the fiscal year
  answer: C
  explanation: For individuals, vehicle registration in New Brunswick expires on the
    last day of the owner's birth month.
- id: 68
  category: driver_responsibility
  question: When purchasing a used vehicle privately in New Brunswick, the buyer must
    ensure the vehicle has been inspected within the last ____ days to be valid for
    transfer.
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: For a registration transfer, the vehicle must have a valid inspection
    sticker issued within the previous 30 days, or it must be re-inspected by the
    new owner.
- id: 69
  category: driver_responsibility
  question: A visitor to New Brunswick may operate a motor vehicle for up to how many
    months using a valid out-of-province driver's license?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 12 months
  answer: C
  explanation: Visitors are permitted to drive in New Brunswick on a valid out-of-province
    license for a period of up to six months.
- id: 70
  category: driver_responsibility
  question: What color is the 'financial responsibility card' (proof of insurance)
    that must be kept in the vehicle at all times in New Brunswick?
  choices:
    A: Blue
    B: Yellow
    C: Pink
    D: White
  answer: C
  explanation: The proof of insurance card, commonly referred to as the 'pink card,'
    must be produced upon the request of a peace officer.
- id: 71
  category: driver_responsibility
  question: If you are involved in an accident where a person is injured, but the
    police are not yet on the scene, what is your primary responsibility?
  choices:
    A: Drive to the nearest hospital to report it
    B: Render all reasonable assistance and call for medical help
    C: Wait for 24 hours before reporting to insurance
    D: Move the injured person to the sidewalk immediately
  answer: B
  explanation: The law requires drivers at an accident scene to remain at the scene
    and render all reasonable assistance to any person injured.
- id: 72
  category: driver_responsibility
  question: Which of the following is true regarding the 'Unsatisfied Judgment Fund'
    (or similar provincial mechanisms) in New Brunswick?
  choices:
    A: It pays for the repairs of any driver who forgets to buy insurance
    B: It provides a source of recovery for victims of uninsured or hit-and-run drivers
    C: It is a fund used to pay for the premier's vehicle
    D: It covers mechanical breakdowns on the highway
  answer: B
  explanation: New Brunswick has mechanisms (like Section D of the standard policy
    and industry funds) to ensure victims of uninsured or unidentified (hit-and-run)
    drivers can still receive compensation.
- id: 73
  category: driver_responsibility
  question: 'In New Brunswick, if you are convicted of driving without insurance,
    your driver''s license will be suspended for a period of:'
  choices:
    A: 24 hours
    B: 7 days
    C: Until proof of insurance is provided and a reinstatement fee is paid
    D: Permanently
  answer: C
  explanation: Driving without insurance leads to a suspension that remains in effect
    until the driver provides proof of financial responsibility and pays the required
    fees.
- id: 74
  category: safe_driving_rules
  question: What is the unposted speed limit for rural highways in New Brunswick?
  choices:
    A: 70 km/h
    B: 90 km/h
    C: 80 km/h
    D: 100 km/h
  answer: C
  explanation: In New Brunswick, the speed limit on rural highways is 80 km/h unless
    signs are posted indicating a different limit.
- id: 75
  category: safe_driving_rules
  question: When parking your vehicle near a fire hydrant in New Brunswick, what is
    the minimum required distance you must maintain?
  choices:
    A: 2 meters
    B: 3 meters
    C: 5 meters
    D: 10 meters
  answer: C
  explanation: New Brunswick law prohibits parking a vehicle within 5 meters of a
    fire hydrant.
- id: 76
  category: safe_driving_rules
  question: How many meters must you park away from a stop sign or a traffic control
    signal located at the side of a roadway?
  choices:
    A: 5 meters
    B: 10 meters
    C: 15 meters
    D: 20 meters
  answer: B
  explanation: Drivers in New Brunswick must not park within 10 meters of a stop sign
    or traffic light located at the side of the road.
- id: 77
  category: safe_driving_rules
  question: 'In New Brunswick, you are prohibited from making a U-turn on a curve
    or a hill where you cannot be seen by other drivers approaching from either direction
    within a distance of:'
  choices:
    A: 100 meters
    B: 150 meters
    C: 200 meters
    D: 75 meters
  answer: B
  explanation: U-turns are illegal on curves or near the crest of a hill where the
    driver cannot see, or be seen by, other traffic within 150 meters.
- id: 78
  category: safe_driving_rules
  question: 'When driving at night, you must switch your headlights from high beam
    to low beam when an oncoming vehicle is within:'
  choices:
    A: 100 meters
    B: 150 meters
    C: 200 meters
    D: 300 meters
  answer: B
  explanation: The New Brunswick Driver's Handbook states that you must dim your high
    beams when an oncoming vehicle is within 150 meters.
- id: 79
  category: safe_driving_rules
  question: When following another vehicle at night, at what distance must you dim
    your high beam headlights?
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: B
  explanation: You must switch to low beams when following another vehicle within
    60 meters to avoid blinding the driver ahead through their mirrors.
- id: 80
  category: safe_driving_rules
  question: When a school bus is stopped with its red lights flashing and stop arm
    extended, drivers approaching from either direction must stop at least how many
    meters from the bus?
  choices:
    A: 3 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: In New Brunswick, drivers must stop at least 5 meters from the front
    or rear of a school bus when its red lights are flashing.
- id: 81
  category: safe_driving_rules
  question: Unless a sign prohibits it, are you allowed to turn right on a red light
    in New Brunswick?
  choices:
    A: No, it is never allowed
    B: Yes, but only after coming to a complete stop and yielding to traffic and pedestrians
    C: Yes, without stopping, as long as no traffic is coming
    D: Only during daylight hours
  answer: B
  explanation: Right turns on red are permitted in New Brunswick after a complete
    stop, unless a sign specifically prohibits the turn.
- id: 82
  category: safe_driving_rules
  question: When parking your vehicle facing downhill on a street with a curb, how
    should you turn your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: A
  explanation: When parking downhill, you should turn your wheels toward the curb
    so that if the vehicle rolls, it will roll into the curb and stop.
- id: 83
  category: safe_driving_rules
  question: 'A double solid yellow line in the center of the highway means:'
  choices:
    A: Passing is permitted if safe
    B: Passing is prohibited for traffic in both directions
    C: Passing is permitted for traffic on the right side only
    D: The road is one-way
  answer: B
  explanation: Double solid yellow lines mean that passing is prohibited for traffic
    moving in both directions.
- id: 84
  category: safe_driving_rules
  question: 'When following an emergency vehicle (fire truck, ambulance, or police
    car) that has its sirens or lights operating, you must maintain a minimum following
    distance of:'
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: In New Brunswick, it is illegal to follow an emergency vehicle closer
    than 150 meters when it is responding to an alarm.
- id: 85
  category: safe_driving_rules
  question: When two vehicles enter an uncontrolled intersection from different highways
    at approximately the same time, who has the right of way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a higher speed
    D: The larger vehicle
  answer: B
  explanation: At an uncontrolled intersection, the driver of the vehicle on the left
    must yield the right of way to the vehicle on the right.
- id: 86
  category: safe_driving_rules
  question: When driving in an urban school zone in New Brunswick during school hours,
    what is the maximum speed limit?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: In New Brunswick, the speed limit in school zones in urban areas is
    30 km/h between 7:30 am and 4:00 pm on school days, or as posted.
- id: 87
  category: safe_driving_rules
  question: When approaching a stop sign or traffic control signal, you must not park
    your vehicle within how many meters of it?
  choices:
    A: 5 meters
    B: 10 meters
    C: 15 meters
    D: 20 meters
  answer: B
  explanation: Under New Brunswick law, parking is prohibited within 10 meters of
    the approach to any flashing beacon, stop sign, or traffic control signal located
    at the side of a roadway.
- id: 88
  category: safe_driving_rules
  question: At what distance must you dim your high beam headlights when approaching
    an oncoming vehicle at night in New Brunswick?
  choices:
    A: 100 meters
    B: 150 meters
    C: 200 meters
    D: 300 meters
  answer: B
  explanation: New Brunswick law requires drivers to switch to low beams when an oncoming
    vehicle is within 150 meters.
- id: 89
  category: safe_driving_rules
  question: When following another vehicle from behind at night, at what distance
    should you switch your headlights to low beams?
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: B
  explanation: In New Brunswick, you must dim your headlights to low beams when you
    are following another vehicle within a distance of 60 meters.
- id: 90
  category: safe_driving_rules
  question: Under 'Ellen's Law' in New Brunswick, what is the minimum distance a motorist
    must maintain when passing a cyclist?
  choices:
    A: 0.5 meters
    B: 1 meter
    C: 1.5 meters
    D: 2 meters
  answer: B
  explanation: Ellen's Law (Regulation 84-145) requires drivers in New Brunswick to
    maintain a minimum distance of one meter between their vehicle and a bicycle when
    passing.
- id: 91
  category: safe_driving_rules
  question: In New Brunswick, you are prohibited from parking within how many meters
    of a crosswalk at an intersection?
  choices:
    A: 2 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: The New Brunswick Motor Vehicle Act prohibits parking within 5 meters
    of a crosswalk at an intersection.
- id: 92
  category: safe_driving_rules
  question: When intending to turn in a business or residential district, how far
    in advance must you signal your intention?
  choices:
    A: 10 meters
    B: 30 meters
    C: 50 meters
    D: 100 meters
  answer: B
  explanation: In New Brunswick, you must signal your intention to turn at least 30
    meters before the turn in urban areas (business or residential districts).
- id: 93
  category: safe_driving_rules
  question: What is the recommended following distance behind another vehicle under
    normal driving conditions in New Brunswick?
  choices:
    A: One car length
    B: Two seconds
    C: Five seconds
    D: 10 meters
  answer: B
  explanation: The New Brunswick Driver's Handbook recommends a minimum following
    distance of at least two seconds behind the vehicle in front of you under ideal
    conditions.
- id: 94
  category: safe_driving_rules
  question: What happens to the fine for speeding in a designated construction zone
    in New Brunswick when workers are present?
  choices:
    A: The fine is stayed
    B: The fine is doubled
    C: The fine is tripled
    D: There is no change to the fine
  answer: B
  explanation: In New Brunswick, fines for speeding in a construction zone are doubled
    when workers are present in the zone.
- id: 95
  category: safe_driving_rules
  question: In New Brunswick, when are you required to use your headlights?
  choices:
    A: Only between midnight and 5:00 AM
    B: From sunset to sunrise and whenever visibility is less than 150 meters
    C: Only when it is raining
    D: From one hour after sunset to one hour before sunrise
  answer: B
  explanation: According to the New Brunswick Motor Vehicle Act, headlights must be
    turned on from sunset to sunrise and at any other time when visibility is reduced
    to less than 150 meters.
- id: 96
  category: defensive_driving
  question: To maintain proper 'visual lead time' and avoid last-minute maneuvers,
    the New Brunswick Driver's Handbook suggests scanning the road how far ahead?
  choices:
    A: 3 to 5 seconds
    B: 5 to 8 seconds
    C: 12 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Drivers are encouraged to look 12 to 15 seconds ahead of their vehicle
    to identify potential hazards early.
- id: 97
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet New Brunswick highway, what
    is the correct defensive driving response?
  choices:
    A: Brake hard to regain traction
    B: Accelerate slightly to pull through the water
    C: Shift the vehicle into neutral
    D: Take your foot off the gas and steer straight until you regain control
  answer: D
  explanation: When hydroplaning, you should not brake or turn suddenly. Instead,
    ease off the accelerator and keep the steering wheel straight until the tires
    regain contact with the road.
- id: 98
  category: defensive_driving
  question: When driving in heavy fog in New Brunswick, which light setting should
    you use for the best visibility and safety?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: High beams reflect off the fog and cause glare. Low beams direct light
    downward toward the road, providing better visibility in foggy conditions.
- id: 99
  category: defensive_driving
  question: When driving on a multi-lane highway in New Brunswick and approaching
    a stopped emergency vehicle with its lights flashing, what does the law require
    you to do?
  choices:
    A: Maintain speed but move to the left lane
    B: Slow down and move to the left lane if it is safe to do so
    C: Stop immediately in your lane
    D: Speed up to pass the vehicle quickly
  answer: B
  explanation: New Brunswick's 'Move Over' law requires drivers to slow down and,
    if there are multiple lanes, move into the lane further away from the emergency
    vehicle (including tow trucks) if it can be done safely.
- id: 100
  category: defensive_driving
  question: What is the recommended following distance in New Brunswick when driving
    under adverse conditions like rain, snow, or ice?
  choices:
    A: The same two seconds used for dry roads
    B: At least four seconds or more
    C: Exactly one car length for every 10 km/h
    D: Ten seconds regardless of speed
  answer: B
  explanation: In poor weather or road conditions, the standard two-second following
    distance should be doubled to at least four seconds to allow for increased stopping
    distance.
- id: 101
  category: defensive_driving
  question: When entering a curve, when should you ideally reduce your speed to maintain
    maximum control?
  choices:
    A: While you are in the middle of the curve
    B: Before you enter the curve
    C: Only if you feel the tires sliding
    D: As you are exiting the curve
  answer: B
  explanation: Defensive driving practice in New Brunswick dictates that you should
    slow down to a safe speed before entering a curve to avoid braking while turning,
    which can cause a skid.
- id: 102
  category: defensive_driving
  question: If your gas pedal sticks while driving on a New Brunswick road, what is
    the first thing you should do?
  choices:
    A: Turn off the engine immediately
    B: Apply the emergency brake full force
    C: Shift to neutral and apply steady pressure to the brakes
    D: Open the door and jump out
  answer: C
  explanation: If the accelerator sticks, shifting to neutral cuts the power to the
    wheels. You can then use the brakes to slow down and pull over to a safe spot.
    Turning off the engine may lock the steering or disable power brakes.
- id: 103
  category: defensive_driving
  question: When driving a vehicle equipped with Anti-lock Brakes (ABS) in an emergency
    situation, how should you apply the brakes?
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, continuous pressure to the brake pedal
    C: Lightly tap the brakes to avoid locking
    D: Shift to a lower gear and do not use the brakes
  answer: B
  explanation: With ABS, the system pumps the brakes for you. You should maintain
    firm and steady pressure on the brake pedal until the vehicle stops.
- id: 104
  category: defensive_driving
  question: In New Brunswick, what is the 'blind spot' of a vehicle?
  choices:
    A: The area directly in front of the hood
    B: The area to the left and right rear of the vehicle that cannot be seen in mirrors
    C: The area covered by the rearview mirror
    D: The area visible through the side windows
  answer: B
  explanation: Blind spots are areas around the vehicle that a driver cannot see using
    the mirrors alone. Drivers must perform shoulder checks to see into these areas
    before changing lanes.
- id: 105
  category: defensive_driving
  question: When driving on New Brunswick highways, how often should you check your
    mirrors to maintain situational awareness?
  choices:
    A: Every 2 to 5 seconds
    B: Every 30 seconds
    C: Only when changing lanes
    D: Every 5 to 10 seconds
  answer: D
  explanation: The New Brunswick Driver's Handbook suggests checking your mirrors
    every 5 to 10 seconds to stay aware of the traffic environment around you.
- id: 106
  category: defensive_driving
  question: To maintain proper situational awareness in urban areas of New Brunswick,
    how far ahead should a driver scan the road?
  choices:
    A: 2 to 5 seconds
    B: 5 to 8 seconds
    C: 12 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Defensive driving guidelines in New Brunswick suggest scanning 12 to
    15 seconds ahead in the city to anticipate potential hazards and traffic changes.
- id: 107
  category: defensive_driving
  question: Outside of business or residential districts in New Brunswick, what is
    the minimum distance a commercial vehicle must maintain when following another
    commercial vehicle?
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: B
  explanation: According to the New Brunswick Motor Vehicle Act, drivers of commercial
    vehicles must maintain a following distance of at least 60 meters from other commercial
    vehicles on the highway.
- id: 108
  category: defensive_driving
  question: During New Brunswick winters, what is a driver's legal responsibility
    regarding snow and ice on their vehicle before driving?
  choices:
    A: Only the driver's side of the windshield must be clear
    B: Only the headlights and taillights must be clear
    C: The entire vehicle, including the roof and hood, must be cleared of snow and
      ice
    D: No specific law exists as long as you can see through the front window
  answer: C
  explanation: In New Brunswick, it is a safety violation to drive with snow or ice
    on your vehicle that could fly off and obstruct the view of other drivers or fall
    onto the road.
- id: 109
  category: defensive_driving
  question: How many demerit points are assigned to a New Brunswick driver's record
    for the offense of 'Following too closely'?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 0 points (fine only)
  answer: A
  explanation: Following too closely is a 2-point offense under the New Brunswick
    point system.
- id: 110
  category: defensive_driving
  question: 'When scanning the road, New Brunswick drivers are taught to check their
    rearview and side mirrors approximately every:'
  choices:
    A: 2 to 5 seconds
    B: 5 to 10 seconds
    C: 30 seconds
    D: Minute
  answer: B
  explanation: Frequent mirror checks (every 5 to 10 seconds) are a core component
    of defensive driving in New Brunswick to keep track of traffic movement behind
    and beside the vehicle.
- id: 111
  category: defensive_driving
  question: In New Brunswick, when are roads typically the most slippery during a
    rainstorm?
  choices:
    A: After it has been raining for several hours
    B: Just as the rain begins to fall
    C: Immediately after the rain stops
    D: Only when the temperature is below freezing
  answer: B
  explanation: Roads are most slippery just as rain starts because the water mixes
    with oil and dust on the pavement that hasn't been washed away yet.
- id: 112
  category: defensive_driving
  question: If you are blinded by the high beam headlights of an oncoming vehicle
    in New Brunswick, where should you look to maintain your lane?
  choices:
    A: Directly at the oncoming headlights
    B: At the center line of the road
    C: Toward the right edge of the road (the white line)
    D: Close your eyes briefly until the car passes
  answer: C
  explanation: To avoid being completely blinded, you should look toward the right
    edge of your lane or the white fog line until the vehicle has passed.
- id: 113
  category: defensive_driving
  question: When driving on a New Brunswick highway in heavy rain or snow, how should
    you adjust your following distance?
  choices:
    A: Keep it at two seconds
    B: Decrease it to one second to see the lead car's lights better
    C: Increase it to at least double the normal distance
    D: Following distance does not matter if you have winter tires
  answer: C
  explanation: Adverse weather significantly increases stopping distances; therefore,
    the New Brunswick handbook recommends doubling or tripling the two-second rule.
- id: 114
  category: alcohol_drugs_health
  question: In New Brunswick, an experienced driver (non-GDL) found to have a Blood
    Alcohol Concentration (BAC) between 0.05% and 0.08% will face an immediate roadside
    suspension of how many days for a first offense?
  choices:
    A: 24 hours
    B: 7 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: In New Brunswick, the 'warn' range is 0.05% to 0.08%. A first-time
    offense results in an immediate 7-day administrative license suspension.
- id: 115
  category: alcohol_drugs_health
  question: If a driver in New Brunswick is caught with a BAC of 0.08% or higher,
    what is the duration of the immediate administrative roadside license suspension?
  choices:
    A: 7 days
    B: 30 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Drivers with a BAC over 0.08% or those who refuse a breathalyzer test
    receive an immediate 90-day administrative license suspension.
- id: 116
  category: alcohol_drugs_health
  question: Under New Brunswick law, if a driver's vehicle is impounded due to a BAC
    over 0.08% or refusal to provide a sample, how long is the mandatory impoundment
    period?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: A vehicle is subject to a mandatory 30-day impoundment if the driver
    is suspended for a BAC over 0.08% or for refusing a breath/fluid demand.
- id: 117
  category: alcohol_drugs_health
  question: In New Brunswick, what is the BAC limit for drivers operating a commercial
    vehicle (Class 1, 2, 3, or 4)?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Commercial drivers in New Brunswick are required to maintain a 0.00%
    BAC while operating a commercial vehicle.
- id: 118
  category: alcohol_drugs_health
  question: What is the consequence for a driver in New Brunswick who refuses to provide
    a breath, blood, or oral fluid sample upon legal demand by a peace officer?
  choices:
    A: A 24-hour suspension only
    B: A 7-day suspension and a $100 fine
    C: The same penalties as having a BAC over 0.08%
    D: No penalty if it is a first-time request
  answer: C
  explanation: Refusing to provide a sample is a criminal offense and carries the
    same immediate administrative penalties as a BAC over 0.08%, including a 90-day
    suspension and 30-day vehicle impoundment.
- id: 119
  category: alcohol_drugs_health
  question: Following an alcohol-related license suspension in New Brunswick, what
    is the standard fee required to reinstate a driver's license?
  choices:
    A: $50
    B: $100
    C: $230
    D: $500
  answer: C
  explanation: As of current New Brunswick regulations, the reinstatement fee for
    a license suspended due to alcohol or drug-related offenses is $230.
- id: 120
  category: alcohol_drugs_health
  question: For drivers in the New Brunswick Graduated Driver's License (GDL) program,
    what is the legal limit for THC (cannabis) in their system?
  choices:
    A: 0 ng/ml
    B: 2 ng/ml
    C: 5 ng/ml
    D: 10 ng/ml
  answer: A
  explanation: New Brunswick has a zero-tolerance policy for drugs for all GDL drivers
    and drivers under the age of 21; they must have 0 ng/ml of THC in their system.
- id: 121
  category: alcohol_drugs_health
  question: In New Brunswick, who is legally required to report a patient to the Registrar
    of Motor Vehicles if they have a medical condition that may make it unsafe for
    them to drive?
  choices:
    A: Only the driver's employer
    B: Only the driver's immediate family
    C: Any legally qualified medical practitioner (physician)
    D: No one; it is strictly confidential
  answer: C
  explanation: Under the Motor Vehicle Act, physicians are legally mandated to report
    patients who have medical conditions that could impair their ability to safely
    operate a motor vehicle.
- id: 122
  category: alcohol_drugs_health
  question: If a New Brunswick driver is suspected of drug-impaired driving, a police
    officer may demand they perform a 'Standardized Field Sobriety Test' (SFST). What
    happens if the driver fails this test?
  choices:
    A: They are given a warning and sent home
    B: They face an immediate 24-hour roadside suspension
    C: They may be required to undergo a Drug Recognition Expert (DRE) evaluation
    D: Their license is permanently revoked on the spot
  answer: C
  explanation: Failing an SFST provides the officer with grounds to demand further
    testing, such as a Drug Recognition Expert (DRE) evaluation or a blood sample.
- id: 123
  category: alcohol_drugs_health
  question: An experienced New Brunswick driver receives a second suspension within
    a 5-year period for having a BAC in the 'warn' range (0.05% to 0.08%). How long
    is this second suspension?
  choices:
    A: 7 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: A second offense within the 'warn' range (0.05% to 0.08%) within a
    5-year period results in a 15-day administrative license suspension.
- id: 124
  category: alcohol_drugs_health
  question: Which program is mandatory for New Brunswick drivers convicted of a first-time
    Criminal Code impaired driving offense before they can regain full driving privileges?
  choices:
    A: The Defensive Driving Course
    B: The Alcohol Ignition Interlock Program (AIIP)
    C: The High-Speed Awareness Program
    D: The Basic Driver Training Course
  answer: B
  explanation: Drivers convicted of alcohol-impaired driving under the Criminal Code
    must participate in the Alcohol Ignition Interlock Program (AIIP) as part of their
    reinstatement process.
- id: 125
  category: alcohol_drugs_health
  question: What is the immediate roadside suspension period for a third or subsequent
    'warn' range (0.05% to 0.08%) BAC offense in New Brunswick?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: A third or subsequent 'warn' range offense within a 5-year period results
    in a 30-day administrative license suspension.
- id: 126
  category: alcohol_drugs_health
  question: How does consuming alcohol and drugs (including prescription medication)
    simultaneously affect a driver compared to consuming them separately?
  choices:
    A: The effects cancel each other out
    B: There is no difference in impairment
    C: The combined effect is significantly greater than the sum of the parts
    D: It makes the driver more alert
  answer: C
  explanation: Combining alcohol and drugs creates a synergistic effect, meaning the
    level of impairment is much higher than if either substance were used alone.
- id: 127
  category: alcohol_drugs_health
  question: In New Brunswick, if you are taking prescription medication, who is responsible
    for ensuring you are fit to drive?
  choices:
    A: The pharmacist only
    B: The doctor only
    C: The driver
    D: The police
  answer: C
  explanation: It is the driver's responsibility to know the effects of any medication
    they are taking. They should consult their doctor or pharmacist, but the legal
    responsibility for operating the vehicle safely lies with the driver.
- id: 128
  category: alcohol_drugs_health
  question: Which of the following is a symptom of fatigue that should signal a driver
    to stop and rest?
  choices:
    A: Missing an exit or traffic sign
    B: Difficulty keeping eyes open or head up
    C: Drifting from the lane
    D: All of the above
  answer: D
  explanation: Fatigue is a form of impairment. Missing signs, drifting, and physical
    difficulty staying awake are all critical warning signs that a driver must pull
    over safely and rest.
- id: 129
  category: alcohol_drugs_health
  question: In New Brunswick, experienced drivers (non-GDL) will face an immediate
    administrative roadside suspension if their Blood Alcohol Concentration (BAC)
    is at or above what level?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: In New Brunswick, while the Criminal Code limit is 0.08%, an administrative
    roadside suspension is triggered at 0.05% for experienced drivers.
- id: 130
  category: alcohol_drugs_health
  question: For a first-time Criminal Code conviction of driving with a BAC over 0.08%
    in New Brunswick, what is the minimum federal driving prohibition period?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: Under the Criminal Code of Canada, a first-offense conviction for driving
    over 0.08% carries a minimum 12-month (1 year) driving prohibition.
- id: 131
  category: alcohol_drugs_health
  question: Under New Brunswick law, what is the drug tolerance level for drivers
    in the Graduated Driver's License (GDL) program?
  choices:
    A: Zero tolerance for any presence of a prescribed drug
    B: Zero tolerance for any presence of a prohibited drug (e.g., THC)
    C: 2 nanograms of THC per milliliter of blood
    D: 5 nanograms of THC per milliliter of blood
  answer: B
  explanation: New Brunswick maintains a zero-tolerance policy for drugs (including
    THC) for all GDL drivers and drivers under the age of 21.
- id: 132
  category: alcohol_drugs_health
  question: If a driver in New Brunswick refuses to provide a breath or blood sample
    upon a lawful demand by a police officer, what are the consequences?
  choices:
    A: A small fine and 2 demerit points
    B: A 24-hour suspension only
    C: The same penalties as having a BAC over 0.08%
    D: A warning for the first refusal
  answer: C
  explanation: Refusing to provide a breath or blood sample is a criminal offense
    in Canada and carries the same penalties as driving with a BAC over the legal
    limit.
- id: 133
  category: alcohol_drugs_health
  question: In New Brunswick, if an experienced driver is issued a first-time administrative
    suspension for a BAC between 0.05% and 0.08%, for how long is their vehicle impounded?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: For a first-time administrative suspension (0.05% to 0.08%), the driver's
    license is suspended for 7 days and the vehicle is impounded for 3 days.
- id: 134
  category: alcohol_drugs_health
  question: What is the mandatory reinstatement fee for a driver's license in New
    Brunswick following an alcohol-related suspension?
  choices:
    A: $50
    B: $100
    C: $230
    D: $500
  answer: C
  explanation: New Brunswick requires a $230 reinstatement fee (subject to change
    by regulation) to restore a license after it has been suspended for alcohol-related
    reasons.
- id: 135
  category: alcohol_drugs_health
  question: What is the effect of consuming alcohol and drugs (even prescription medications)
    together before driving?
  choices:
    A: The effects of each are cancelled out
    B: The drug will always prevent the alcohol from being absorbed
    C: The combined effect is often greater than the sum of the two (synergistic effect)
    D: There is no combined effect on driving ability
  answer: C
  explanation: Combining alcohol and drugs can create a synergistic effect, significantly
    increasing impairment levels beyond what either substance would cause alone.
- id: 136
  category: alcohol_drugs_health
  question: 'In New Brunswick, a second administrative suspension for a BAC between
    0.05% and 0.08% within a five-year period results in a license suspension of:'
  choices:
    A: 7 days
    B: 15 days
    C: 30 days
    D: 90 days
  answer: B
  explanation: A second offense within the 0.05% to 0.08% BAC range in New Brunswick
    results in a 15-day license suspension.
- id: 137
  category: alcohol_drugs_health
  question: Which of the following is a requirement for a driver convicted of a Criminal
    Code alcohol offense before they can fully regain their driving privileges in
    New Brunswick?
  choices:
    A: They must wait 10 years
    B: They must complete a mandatory Alcohol and Drug Education Course
    C: They must purchase a new vehicle
    D: They must retake only the vision test
  answer: B
  explanation: Drivers convicted of alcohol-related offenses in New Brunswick must
    complete a mandatory Alcohol and Drug Education Course as part of the reinstatement
    process.
- id: 138
  category: alcohol_drugs_health
  question: If a driver is caught with a BAC of 0.08% or greater for the first time,
    how long will their vehicle be impounded under New Brunswick's administrative
    laws?
  choices:
    A: 3 days
    B: 7 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: For a BAC of 0.08% or higher (or refusal to provide a sample), the
    vehicle is subject to an immediate 30-day impoundment for a first offense.
- id: 139
  category: alcohol_drugs_health
  question: In New Brunswick, what happens to a driver's license immediately at the
    roadside if they are caught driving with a BAC over 0.08%?
  choices:
    A: It is suspended for 24 hours
    B: It is suspended for 7 days
    C: It is suspended for 90 days
    D: Nothing happens until the court date
  answer: C
  explanation: New Brunswick imposes an immediate 90-day Administrative Driver's License
    Suspension (ADLS) for any driver caught with a BAC over 0.08% or who refuses a
    breathalyzer.
- id: 140
  category: alcohol_drugs_health
  question: Which of the following factors does NOT affect a person's Blood Alcohol
    Concentration (BAC)?
  choices:
    A: Body weight
    B: The type of alcohol (e.g., beer vs. spirits) if the alcohol content is the
      same
    C: How quickly the alcohol was consumed
    D: The person's physical fitness or muscle mass
  answer: B
  explanation: BAC is determined by the amount of alcohol consumed, body weight, gender,
    and time. A standard drink of beer, wine, or spirits contains the same amount
    of alcohol and affects BAC equally.
- id: 141
  category: alcohol_drugs_health
  question: In New Brunswick, if you are a 'Qualified Driver' supervising a learner
    (Class 7 Level 1), what is your maximum allowable BAC?
  choices:
    A: 0.00%
    B: 0.05%
    C: 0.08%
    D: Less than 0.05%
  answer: D
  explanation: The person accompanying a learner driver in New Brunswick must not
    have a BAC of 0.05% or higher.
- id: 142
  category: penalties_and_points
  question: If a driver in New Brunswick is convicted of 'Careless Driving', how many
    points are added to their record?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: Careless driving is considered a serious offense in New Brunswick and
    carries a penalty of 5 demerit points.
- id: 143
  category: penalties_and_points
  question: What is the demerit point penalty for a driver who fails to wear a seatbelt
    in New Brunswick?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: In New Brunswick, a driver convicted of failing to wear a seatbelt
    (or failing to ensure a passenger under 16 is belted) receives 2 demerit points.
- id: 144
  category: penalties_and_points
  question: After a driver's license has been suspended due to the accumulation of
    points, it is reinstated with how many points remaining on the record?
  choices:
    A: 0 points
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: When a New Brunswick driver's license is reinstated following a point-based
    suspension, the record is set to 3 demerit points.
- id: 145
  category: penalties_and_points
  question: What is the immediate roadside penalty for 'stunting' (e.g., street racing
    or extreme speeding) in New Brunswick?
  choices:
    A: A verbal warning
    B: A 24-hour license suspension
    C: Immediate 7-day vehicle impoundment
    D: Mandatory 1-year jail sentence
  answer: C
  explanation: New Brunswick law allows for the immediate 7-day impoundment of a vehicle
    if the driver is caught stunting or street racing.
- id: 146
  category: penalties_and_points
  question: If you are involved in a collision in New Brunswick where property damage
    appears to exceed $1,000 and you fail to report it to the police, how many points
    are added to your record?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: Automatic revocation
  answer: C
  explanation: Failing to report an accident to the police when required (damage over
    $1,000 or injury/death) results in 5 demerit points.
- id: 147
  category: penalties_and_points
  question: How many demerit points are assigned for driving the wrong way on a one-way
    street in New Brunswick?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: Driving the wrong way on a one-way street is a 2-point violation in
    New Brunswick.
- id: 148
  category: penalties_and_points
  question: How many demerit points are assigned for passing another vehicle on a
    curve or a hill where the view is obstructed?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: B
  explanation: Improper passing, specifically where the view is obstructed by a curve
    or hill, results in 3 demerit points in New Brunswick.
- id: 149
  category: penalties_and_points
  question: How many demerit points will a driver receive for failing to wear a seatbelt
    in New Brunswick?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: In New Brunswick, a driver is assessed 2 demerit points for failing
    to wear a seatbelt or failing to ensure a passenger under 16 is properly restrained.
- id: 150
  category: penalties_and_points
  question: What is the demerit point penalty for using a handheld electronic communication
    device while driving in New Brunswick?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 0 points, only a fine
  answer: B
  explanation: Using a handheld device while driving (distracted driving) in New Brunswick
    carries a penalty of 3 demerit points.
- id: 151
  category: penalties_and_points
  question: When a New Brunswick driver's license is suspended for the first time
    due to the accumulation of points, how long is the suspension period?
  choices:
    A: 30 days
    B: 60 days
    C: 3 months
    D: 6 months
  answer: C
  explanation: In New Brunswick, the first time a license is suspended due to point
    accumulation, the suspension period is 3 months.
- id: 152
  category: penalties_and_points
  question: For a first-time Criminal Code conviction related to impaired driving,
    what is the mandatory provincial driver's license suspension period in New Brunswick?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: A first conviction under the Criminal Code for impaired driving results
    in a mandatory 12-month (1 year) provincial driver's license suspension.
- id: 153
  category: penalties_and_points
  question: In New Brunswick, the driver is legally responsible for ensuring all passengers
    under what age are properly restrained by a seatbelt or child safety seat?
  choices:
    A: Under 12 years of age
    B: Under 14 years of age
    C: Under 16 years of age
    D: Under 18 years of age
  answer: C
  explanation: The driver is responsible for the proper restraint of all passengers
    under the age of 16. Passengers 16 and older are responsible for themselves.
- id: 154
  category: penalties_and_points
  question: How many demerit points are assigned for the offense of 'driving a motor
    vehicle in a race or on a bet or wager' in New Brunswick?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 10 points
  answer: B
  explanation: Racing or wagering on a highway is a serious offense in New Brunswick
    and carries a penalty of 5 demerit points.
- id: 155
  category: penalties_and_points
  question: Between which dates is it legal to use studded tires on vehicles in New
    Brunswick?
  choices:
    A: November 1 to April 1
    B: October 15 to May 1
    C: October 1 to May 31
    D: December 1 to March 31
  answer: B
  explanation: In New Brunswick, studded tires are permitted for use on vehicles between
    October 15 and May 1.
- id: 156
  category: sharing_the_road
  question: 'In New Brunswick, if you are driving on a highway with a median strip
    and a school bus is stopped on the opposite side of the median with red lights
    flashing, you must:'
  choices:
    A: Stop and wait for the lights to stop flashing
    B: Slow down to 20 km/h
    C: Proceed with caution; you are not required to stop
    D: Stop only if there are children crossing the median
  answer: C
  explanation: On a highway divided by a median strip, drivers approaching from the
    opposite direction of a school bus are not required to stop, though they should
    still proceed with caution.
- id: 157
  category: sharing_the_road
  question: When following a motorcycle in New Brunswick, what is the recommended
    minimum following distance in ideal conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The New Brunswick Driver's Handbook recommends a minimum following
    distance of three (3) seconds behind motorcycles because they can stop much faster
    than larger vehicles.
- id: 158
  category: sharing_the_road
  question: What does a 'slow-moving vehicle' sign (an orange triangle with a red
    border) on the back of a vehicle indicate in New Brunswick?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is wider than 2.6 meters
    C: The vehicle travels at a speed of less than 40 km/h
    D: The vehicle is a pilot truck for an oversized load
  answer: C
  explanation: The slow-moving vehicle sign is required on vehicles that are designed
    to travel at speeds of less than 40 km/h, such as farm tractors or construction
    equipment.
- id: 159
  category: sharing_the_road
  question: 'When a pedestrian is carrying a white cane in New Brunswick, it indicates
    that they:'
  choices:
    A: Are an elderly citizen
    B: Have the right of way only at marked crosswalks
    C: Are blind or visually impaired
    D: Are a road surveyor
  answer: C
  explanation: A white cane is used by pedestrians who are blind or visually impaired.
    Drivers must exercise extreme caution and give them the right of way.
- id: 160
  category: sharing_the_road
  question: 'When an emergency vehicle (ambulance, fire truck, or police car) approaches
    you from the front or rear with its siren and lights on, you must:'
  choices:
    A: Speed up to stay ahead of it
    B: Pull to the right edge of the roadway and stop
    C: Stop exactly where you are in the lane
    D: Pull to the left edge of the roadway and stop
  answer: B
  explanation: Drivers must immediately pull to the right-hand curb or edge of the
    road, clear of any intersection, and stop until the emergency vehicle has passed.
- id: 161
  category: sharing_the_road
  question: 'Large commercial trucks have blind spots where the driver cannot see
    other vehicles. These areas are commonly known as:'
  choices:
    A: Safe Zones
    B: No-Zones
    C: Buffer Zones
    D: Clear Zones
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck (front,
    back, and sides) where cars disappear from the truck driver's view.
- id: 162
  category: sharing_the_road
  question: 'In New Brunswick, if you are following a large truck and cannot see the
    truck driver''s side mirrors, you are:'
  choices:
    A: In a good position to pass
    B: Following too closely (in the truck's blind spot)
    C: Safe from wind turbulence
    D: Required to turn on your high beams
  answer: B
  explanation: 'A general rule for sharing the road with trucks is: if you cannot
    see the truck driver''s mirrors, the truck driver cannot see you.'
- id: 163
  category: sharing_the_road
  question: 'When a bicycle is operated on a New Brunswick roadway at night, it is
    legally required to have:'
  choices:
    A: A white light on the front and a red light or reflector on the rear
    B: A yellow light on the front and a white light on the rear
    C: Reflective tape on the pedals only
    D: A flashing blue light on the handlebars
  answer: A
  explanation: For night riding, New Brunswick law requires bicycles to be equipped
    with a front lamp emitting a white light and a rear red reflector or lamp.
- id: 164
  category: sharing_the_road
  question: At an intersection where a pedestrian is crossing in an unmarked crosswalk,
    who has the right of way in New Brunswick?
  choices:
    A: The motorist, because the crosswalk is not marked
    B: The pedestrian
    C: Whomever arrived at the intersection first
    D: The motorist, but only if they honk first
  answer: B
  explanation: In New Brunswick, pedestrians have the right of way at all intersections,
    whether the crosswalk is marked or unmarked.
- id: 165
  category: sharing_the_road
  question: Why should you be extra cautious when turning left in front of an oncoming
    motorcycle?
  choices:
    A: Motorcycles are legally allowed to speed through intersections
    B: The motorcycle's smaller size makes it harder to judge its speed and distance
    C: Motorcycles always have the right of way over cars
    D: Motorcycles do not have brakes on the front wheel
  answer: B
  explanation: Because of their smaller profile, it is often difficult for drivers
    to accurately judge the speed and distance of an approaching motorcycle, leading
    to many left-turn collisions.
- id: 166
  category: sharing_the_road
  question: In New Brunswick, what does a vehicle with a 'D' sign or a 'Long Load'
    sign preceded by a pilot vehicle indicate?
  choices:
    A: A student driver is operating the vehicle
    B: The vehicle is carrying a dangerous chemical
    C: The vehicle is an oversized or over-dimensional load
    D: The vehicle is a government-owned maintenance truck
  answer: C
  explanation: A 'D' sign (Oversize Load) indicates the vehicle is wider, longer,
    or heavier than standard limits. These are often accompanied by pilot vehicles
    with flashing lights to warn other motorists.
- id: 167
  category: sharing_the_road
  question: When approaching a stopped school bus with its red lights flashing and
    stop arm extended on a road that is NOT divided by a median, who must stop?
  choices:
    A: Only drivers following the bus
    B: Only drivers approaching from the front
    C: Drivers from both directions
    D: No one, if there are more than two lanes
  answer: C
  explanation: In New Brunswick, on undivided highways, traffic in both directions
    must stop for a school bus with flashing red lights. You must remain stopped until
    the lights stop flashing.
- id: 168
  category: sharing_the_road
  question: According to the New Brunswick 'Move Over' law, what must you do when
    approaching a stopped emergency vehicle with its lights flashing on a multi-lane
    highway?
  choices:
    A: Maintain speed but honk your horn
    B: Stop immediately in your lane
    C: Slow down and move into the left lane if it is safe to do so
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: New Brunswick law requires drivers to slow down and, if there are two
    or more lanes moving in the same direction, move into another lane to leave a
    buffer for stopped emergency and service vehicles.
- id: 169
  category: sharing_the_road
  question: When a school bus is stopped with red lights flashing on a highway divided
    by a median, which drivers are required to stop?
  choices:
    A: Drivers in both directions
    B: Only drivers approaching from the front
    C: Only drivers following the bus
    D: No drivers are required to stop on divided highways
  answer: C
  explanation: In New Brunswick, if a highway is divided by a median, only the traffic
    following the bus is required to stop when the red lights are flashing.
- id: 170
  category: sharing_the_road
  question: In New Brunswick, how many demerit points are added to your license for
    failing to stop for a school bus with flashing red lights?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 9 points
  answer: C
  explanation: Failing to stop for a school bus is a serious offense in New Brunswick
    and results in 6 demerit points being added to the driver's record.
- id: 171
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' What are these?
  choices:
    A: Areas where trucks are not allowed to drive
    B: Blind spots where the truck driver cannot see you
    C: Special lanes for trucks only
    D: Speed-restricted zones for heavy vehicles
  answer: B
  explanation: No-Zones are large blind spots around a truck (front, back, and sides)
    where the driver's visibility is limited and accidents are more likely to occur.
- id: 172
  category: sharing_the_road
  question: When following a motorcycle, why should you maintain a greater following
    distance than when following a car?
  choices:
    A: Motorcycles stop faster than cars
    B: Motorcycles are lighter and can be blown by the wind
    C: Motorcyclists often downshift instead of braking, so you won't see brake lights
    D: All of the above
  answer: D
  explanation: Motorcycles can stop very quickly, are susceptible to wind and road
    conditions, and may decelerate without activating brake lights, requiring extra
    following distance for safety.
- id: 173
  category: sharing_the_road
  question: In New Brunswick, if you are turning right at an intersection and a cyclist
    is positioned to your right, what should you do?
  choices:
    A: Speed up to turn before the cyclist reaches the intersection
    B: Honk to warn the cyclist to stop
    C: Yield to the cyclist and let them clear the intersection before you turn
    D: Turn anyway, as cyclists must yield to cars turning right
  answer: C
  explanation: Drivers must yield to cyclists when turning. Cutting off a cyclist
    by turning right (the 'right hook') is a common cause of accidents.
- id: 174
  category: sharing_the_road
  question: What does a slow-moving vehicle sign (an orange triangle with a red border)
    indicate about a vehicle's speed?
  choices:
    A: It cannot travel faster than 60 km/h
    B: It cannot travel faster than 40 km/h
    C: It is a construction vehicle
    D: It is carrying hazardous materials
  answer: B
  explanation: The slow-moving vehicle sign is required on vehicles that are designed
    to travel at speeds of 40 km/h or less.
- id: 175
  category: sharing_the_road
  question: When a pedestrian is using a white cane or a guide dog at a crosswalk,
    what does this indicate to a driver?
  choices:
    A: The pedestrian is a senior citizen
    B: The pedestrian is visually impaired and has the right of way
    C: The pedestrian is training a dog
    D: The driver should honk to let them know a car is there
  answer: B
  explanation: A white cane or guide dog indicates the pedestrian is blind or visually
    impaired. Drivers must exercise extreme caution and yield the right of way.
- id: 176
  category: sharing_the_road
  question: Why do large trucks often swing wide to the left before making a right
    turn?
  choices:
    A: To check for traffic in the left lane
    B: Because their rear wheels follow a shorter path than the front wheels
    C: To signal other drivers to stay back
    D: To avoid hitting the overhead signs
  answer: B
  explanation: Large vehicles have a 'off-tracking' characteristic where the rear
    wheels follow a shorter path than the front wheels, requiring them to swing wide
    to clear the curb.
- id: 177
  category: sharing_the_road
  question: In New Brunswick, when are you allowed to pass a bicycle within the same
    lane?
  choices:
    A: Only if the lane is wide enough to provide 1 metre of clearance
    B: At any time, as long as you don't hit them
    C: Only if the cyclist signals you to pass
    D: Never; you must always change lanes to pass
  answer: A
  explanation: Under Ellen's Law, you must have 1 metre of clearance. If the lane
    is too narrow to provide this distance, you must move into the other lane to pass
    safely.
- id: 178
  category: sharing_the_road
  question: If you are driving and a person is leading a horse or riding a horse on
    the shoulder of the road, what should you do?
  choices:
    A: Honk your horn to let them know you are passing
    B: Speed up to pass them quickly
    C: Slow down and pass with caution, avoiding loud noises
    D: Stop and wait for the horse to leave the road
  answer: C
  explanation: Horses are unpredictable and can be easily spooked by loud noises or
    fast-moving vehicles. Drivers should slow down and give them plenty of room.
- id: 179
  category: sharing_the_road
  question: 'When sharing the road with a motorcycle, you should be aware that they
    are entitled to:'
  choices:
    A: The left half of the lane only
    B: The right half of the lane only
    C: The full width of the lane
    D: Only the shoulder of the road
  answer: C
  explanation: Motorcycles are entitled to use the full width of a lane. Drivers should
    never attempt to share a lane with a motorcycle.
- id: 180
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a passenger vehicle in
    New Brunswick?
  choices:
    A: 1.0 millimetre
    B: 1.6 millimetres
    C: 2.5 millimetres
    D: 3.2 millimetres
  answer: B
  explanation: In New Brunswick, tires are considered unsafe if the tread depth is
    less than 1.6 millimetres (2/32 of an inch).
- id: 181
  category: vehicle_information
  question: 'Every motor vehicle in New Brunswick must be equipped with a horn that
    can be heard from a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: The New Brunswick Motor Vehicle Act requires a horn to be audible under
    normal conditions from a distance of not less than 60 metres.
- id: 182
  category: vehicle_information
  question: Under New Brunswick law, what is the requirement for mirrors if your interior
    rearview mirror is obstructed by a trailer or load?
  choices:
    A: You must remove the obstruction immediately.
    B: You must have an outside mirror on the driver's side only.
    C: You must have both a left and a right-side exterior mirror.
    D: No additional mirrors are required if you use a spotter.
  answer: C
  explanation: If the view from the inside rearview mirror is obstructed, New Brunswick
    law requires the vehicle to be equipped with mirrors on both the left and right
    exterior sides.
- id: 183
  category: vehicle_information
  question: Which of the following is true regarding window tinting on a vehicle registered
    in New Brunswick?
  choices:
    A: Tinting is allowed on the windshield up to 50%.
    B: No aftermarket tinting is allowed on the windshield or the front side windows.
    C: Front side windows may be tinted as long as the driver is visible.
    D: Any window can be tinted as long as it is done by a professional.
  answer: B
  explanation: New Brunswick regulations prohibit the application of any solar-opaque
    or translucent material (aftermarket tint) to the windshield or the windows to
    the direct left and right of the driver.
- id: 184
  category: vehicle_information
  question: A vehicle's service brake must be capable of stopping the vehicle on a
    dry, smooth, level road within how many metres when travelling at 30 km/h?
  choices:
    A: 5 metres
    B: 10 metres
    C: 15 metres
    D: 20 metres
  answer: B
  explanation: The New Brunswick Motor Vehicle Act specifies that the service brake
    must be able to stop the vehicle within 10 metres at a speed of 30 km/h.
- id: 185
  category: vehicle_information
  question: 'In New Brunswick, your vehicle''s rear license plate must be illuminated
    by a white light so it is clearly legible from a distance of:'
  choices:
    A: 10 metres
    B: 15 metres
    C: 25 metres
    D: 50 metres
  answer: B
  explanation: The rear registration plate must be illuminated with a white light
    so that the characters are visible from a distance of 15 metres to the rear.
- id: 186
  category: vehicle_information
  question: If a load extends more than how many metres beyond the rear of the vehicle
    body in New Brunswick, a red flag or red light must be attached?
  choices:
    A: 0.5 metres
    B: 1.0 metre
    C: 1.2 metres
    D: 2.0 metres
  answer: C
  explanation: Whenever a load extends 1.2 metres (approximately 4 feet) or more beyond
    the rear of a vehicle, a red flag (day) or red light (night) must be displayed
    at the end of the load.
- id: 187
  category: vehicle_information
  question: What is the requirement for a vehicle's exhaust system in New Brunswick?
  choices:
    A: It must be loud enough to warn pedestrians.
    B: It must be equipped with a muffler in good working order to prevent excessive
      noise and smoke.
    C: Muffler cut-outs are permitted for highway driving.
    D: Exhaust gases may be vented directly under the passenger compartment.
  answer: B
  explanation: New Brunswick law requires every motor vehicle to have a muffler in
    good working order to prevent excessive or unusual noise and annoying smoke. Muffler
    cut-outs or bypasses are illegal.
- id: 188
  category: vehicle_information
  question: 'In New Brunswick, high beam headlights must reveal persons and vehicles
    at a distance of at least:'
  choices:
    A: 60 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: B
  explanation: The high beam (upper beam) of a motor vehicle's headlamps must be aimed
    and of such intensity as to reveal persons and vehicles at a distance of at least
    100 metres ahead.
- id: 189
  category: vehicle_information
  question: Which of the following is a requirement for windshield wipers in New Brunswick?
  choices:
    A: They are only required if the vehicle is used in winter.
    B: They must be hand-operated by the driver.
    C: They must be maintained in good working order and be capable of clearing rain,
      snow, or other moisture.
    D: They must be replaced every 6 months by law.
  answer: C
  explanation: The New Brunswick Motor Vehicle Act requires every windshield on a
    motor vehicle to be equipped with a device for cleaning rain, snow, or other moisture,
    which must be maintained in good working order.
- id: 190
  category: vehicle_information
  question: 'In New Brunswick, you must switch your headlights to low beams when following
    another vehicle within a distance of:'
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: B
  explanation: Drivers in New Brunswick must use low beams when following another
    vehicle within 60 meters to prevent glare in the lead driver's mirrors.
- id: 191
  category: vehicle_information
  question: According to the New Brunswick Driver's Handbook, when must a vehicle's
    headlights be turned on?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From one-half hour after sunset to one-half hour before sunrise
    D: Only when visibility is less than 200 meters
  answer: C
  explanation: New Brunswick law requires headlights to be on from one-half hour after
    sunset to one-half hour before sunrise, or any time visibility is reduced to 150
    meters or less.
- id: 192
  category: vehicle_information
  question: 'In New Brunswick, a ''Slow Moving Vehicle'' sign must be displayed on
    the rear of any vehicle that is designed to travel at a speed of less than:'
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: B
  explanation: Vehicles designed to travel at speeds of less than 40 km/h must display
    a slow-moving vehicle sign (an orange triangle with a red border) when operating
    on public highways.
- id: 193
  category: vehicle_information
  question: How many mirrors are required on a passenger vehicle in New Brunswick
    if the interior rearview mirror is obstructed?
  choices:
    A: One mirror on the driver's side only
    B: One mirror on the passenger's side only
    C: Two exterior mirrors (one on each side)
    D: No mirrors are required if the driver uses a spotter
  answer: C
  explanation: If the view from the internal rearview mirror is obstructed, New Brunswick
    law requires the vehicle to be equipped with both a left and right exterior side-view
    mirror.
- id: 194
  category: vehicle_information
  question: In New Brunswick, what is the requirement for the emergency/parking brake
    on a motor vehicle?
  choices:
    A: It only needs to work on flat ground
    B: It must be able to hold the vehicle on any grade it is operated on
    C: It is only required for manual transmission vehicles
    D: It must be able to stop the vehicle from 50 km/h
  answer: B
  explanation: The parking brake must be adequate to hold the vehicle on any grade
    on which it is operated, regardless of the load.
- id: 195
  category: vehicle_information
  question: What is the maximum height permitted for a vehicle, including its load,
    in New Brunswick without a special permit?
  choices:
    A: 3.5 meters
    B: 4.15 meters
    C: 4.5 meters
    D: 5.0 meters
  answer: B
  explanation: In New Brunswick, the maximum height for a vehicle and its load is
    4.15 meters. Anything exceeding this requires a special over-dimensional permit.
- id: 196
  category: vehicle_information
  question: Regarding vehicle exhaust systems in New Brunswick, which of the following
    is illegal?
  choices:
    A: Using a muffler that is quieter than the original
    B: Using a muffler 'cut-out' or bypass
    C: Replacing a rusted muffler with an OEM part
    D: Having an exhaust pipe that exits at the rear
  answer: B
  explanation: The New Brunswick Motor Vehicle Act prohibits the use of muffler cut-outs,
    bypasses, or similar devices that increase noise or allow smoke to escape without
    passing through a muffler.
- id: 197
  category: vehicle_information
  question: As of recent New Brunswick regulations, how often must a new passenger
    vehicle (less than 2 years old) undergo a motor vehicle inspection?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: C
  explanation: New Brunswick updated its regulations so that most private passenger
    vehicles require a motor vehicle inspection (MVI) every two years.
- id: 198
  category: signs_and_signals
  question: In New Brunswick, what is the correct hand signal to indicate a right-hand
    turn?
  choices:
    A: Left arm extended straight out the window
    B: Left arm out and downward
    C: Left arm out and upward
    D: Right arm extended straight out the window
  answer: C
  explanation: According to the New Brunswick Driver's Handbook, a right turn is signaled
    by extending the left arm out the window and upward.
- id: 199
  category: signs_and_signals
  question: When approaching an intersection with a flashing red traffic light in
    New Brunswick, what must you do?
  choices:
    A: Slow down and proceed with caution
    B: Stop completely and proceed only when it is safe to do so
    C: Stop only if there is cross traffic
    D: Yield to traffic on the right but do not stop
  answer: B
  explanation: A flashing red light in New Brunswick has the same meaning as a stop
    sign; you must come to a complete stop and yield the right-of-way to other vehicles
    and pedestrians.
- id: 200
  category: signs_and_signals
  question: What does a flashing green light indicate on a New Brunswick roadway?
  choices:
    A: The signal is pedestrian-actuated
    B: You have a protected left turn
    C: The intersection is under construction
    D: Emergency vehicles are approaching
  answer: A
  explanation: In New Brunswick, a flashing green light indicates that the traffic
    signal is pedestrian-actuated. Drivers should be prepared for the light to change
    if a pedestrian pushes the button.
- id: 201
  category: signs_and_signals
  question: On a New Brunswick highway, what do broken (dashed) yellow lines in the
    center of the road signify?
  choices:
    A: Passing is prohibited in both directions
    B: Passing is permitted in both directions if safe
    C: The road is one-way only
    D: You are approaching a construction zone
  answer: B
  explanation: Broken yellow lines indicate that traffic is moving in opposite directions
    and that passing is permitted when it is safe to do so.
- id: 202
  category: signs_and_signals
  question: What is the meaning of a steady yellow light at an intersection in New
    Brunswick?
  choices:
    A: Speed up to clear the intersection before the red light
    B: Stop before entering the intersection, unless you cannot stop safely
    C: The light is about to turn green
    D: Yield to all pedestrians but continue driving
  answer: B
  explanation: A steady yellow light means the signal is about to turn red. Drivers
    must stop before the crosswalk or intersection unless they are so close that a
    stop cannot be made safely.
- id: 203
  category: signs_and_signals
  question: Which shape is used specifically for 'School Zone' or 'School Crosswalk'
    warning signs in New Brunswick?
  choices:
    A: Diamond
    B: Octagon
    C: Pentagon (five-sided)
    D: Inverted Triangle
  answer: C
  explanation: In New Brunswick, school zone and school crosswalk signs are pentagon-shaped
    and usually fluorescent yellow-green in color.
- id: 204
  category: signs_and_signals
  question: In New Brunswick, what does a solid white line painted on the pavement
    between two lanes of traffic moving in the same direction indicate?
  choices:
    A: Lane changing is encouraged
    B: Lane changing is discouraged or prohibited
    C: The lane is for emergency vehicles only
    D: The road is about to end
  answer: B
  explanation: A solid white line between lanes moving in the same direction indicates
    that lane changes are discouraged and may be illegal in certain high-risk areas
    like tunnels or near intersections.
- id: 205
  category: signs_and_signals
  question: What does a flashing amber (yellow) light at an intersection mean in New
    Brunswick?
  choices:
    A: Stop and wait for the light to turn green
    B: The light is broken; treat it as a four-way stop
    C: Slow down and proceed with caution
    D: Speed up to avoid a collision
  answer: C
  explanation: A flashing amber light is a warning to slow down and be extra cautious
    as you enter the intersection.
- id: 206
  category: signs_and_signals
  question: What is the standard color for construction and maintenance warning signs
    in New Brunswick?
  choices:
    A: Red
    B: Yellow
    C: Orange
    D: Blue
  answer: C
  explanation: Construction and maintenance signs in New Brunswick are orange with
    black lettering or symbols to alert drivers to temporary road conditions.
- id: 207
  category: signs_and_signals
  question: 'A white diamond symbol painted on a lane in New Brunswick indicates:'
  choices:
    A: A high-speed passing lane
    B: A reserved lane for specific vehicles like buses or carpools
    C: A pedestrian crossing ahead
    D: A lane that ends in 500 meters
  answer: B
  explanation: The diamond symbol marks a reserved lane. Signs nearby will specify
    which vehicles (e.g., buses, taxis, or high-occupancy vehicles) are permitted
    to use it.
- id: 208
  category: signs_and_signals
  question: When a transit priority signal shows a steady vertical white bar above
    a normal traffic light, what does it mean?
  choices:
    A: All vehicles must stop
    B: Only transit buses may proceed
    C: Pedestrians have the right of way
    D: Emergency vehicles are passing
  answer: B
  explanation: A vertical white bar is a transit priority signal that allows transit
    buses to proceed through the intersection while other traffic faces a red light.
- id: 209
  category: signs_and_signals
  question: In New Brunswick, what hand signal should you use to indicate you are
    stopping or suddenly slowing down?
  choices:
    A: Left arm out and upward
    B: Left arm extended straight out
    C: Left arm out and downward
    D: Waving the left hand back and forth
  answer: C
  explanation: To signal a stop or decrease in speed, the driver should extend their
    left arm out the window and point it downward.
- id: 210
  category: signs_and_signals
  question: What does a 'Do Not Enter' sign look like in New Brunswick?
  choices:
    A: A white square with a red circle and a white horizontal bar in the center
    B: A red octagon with white lettering
    C: A yellow diamond with a black arrow
    D: A white rectangle with a red slash through a black arrow
  answer: A
  explanation: The 'Do Not Enter' sign is a regulatory sign consisting of a white
    square with a red circle and a horizontal white bar.
- id: 211
  category: signs_and_signals
  question: If you are at an intersection and the pedestrian signal shows a flashing
    'Don't Walk' (or an orange hand), what should you do as a driver?
  choices:
    A: Honk to warn pedestrians to clear the road
    B: Prepare for the traffic light to change to yellow shortly
    C: Immediately turn right before the light changes
    D: Stop and wait for the signal to turn green again
  answer: B
  explanation: A flashing 'Don't Walk' signal indicates that the pedestrian phase
    is ending, which usually means the traffic light for vehicles will soon turn yellow.
- id: 212
  category: signs_and_signals
  question: What is the meaning of a solid yellow line on your side of a broken yellow
    center line?
  choices:
    A: You may pass if it is safe to do so
    B: You are in a one-way zone
    C: Passing is prohibited from your lane
    D: You must turn left at the next intersection
  answer: C
  explanation: A solid yellow line on your side of the center line means that passing
    is prohibited for vehicles in your lane.
- id: 213
  category: signs_and_signals
  question: In New Brunswick, when a driver extends their left arm straight out the
    window, what does this hand signal indicate?
  choices:
    A: The driver is slowing down or stopping
    B: The driver is intending to turn right
    C: The driver is intending to turn left
    D: The driver is waving for you to pass
  answer: C
  explanation: According to the New Brunswick Driver's Handbook, a left arm extended
    straight out indicates a left turn.
- id: 214
  category: signs_and_signals
  question: In New Brunswick, what do broken white lines on a roadway indicate?
  choices:
    A: Traffic is moving in opposite directions
    B: Traffic is moving in the same direction and lane changing is permitted
    C: The edge of the road
    D: A pedestrian crossing zone
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction
    where lane changes are allowed.
- id: 215
  category: signs_and_signals
  question: What must you do when you see a 'Yield' sign in New Brunswick?
  choices:
    A: Always come to a complete stop
    B: Slow down and give the right-of-way to traffic in the intersection or on the
      connecting road
    C: Speed up to merge before other traffic arrives
    D: Ignore it if there are no other cars visible
  answer: B
  explanation: A yield sign means you must slow down and, if necessary, stop to yield
    the right-of-way to any vehicle or pedestrian in the intersection.
- id: 216
  category: signs_and_signals
  question: In New Brunswick, what is the default speed limit in a school zone where
    no speed limit is posted?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: According to the New Brunswick Motor Vehicle Act, the speed limit is
    50 km/h in any business or residential district and in public parks, including
    school zones, unless otherwise posted.
- id: 217
  category: signs_and_signals
  question: If you are at an intersection with a red light and a green arrow pointing
    right, what are you permitted to do?
  choices:
    A: Stop and wait for the main light to turn green
    B: Turn right without stopping
    C: Turn right only after coming to a complete stop and yielding to pedestrians
      and other traffic
    D: Proceed in any direction
  answer: C
  explanation: A green arrow shown with a red light means you may cautiously enter
    the intersection only to make the movement indicated by the arrow, after yielding
    to pedestrians and other traffic.
