    période de suspension ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 3 mois
    D: 6 mois
  answer: C
  explanation: Au Nouveau-Brunswick, la première fois qu'un permis est suspendu en
    raison de l'accumulation de points, la période de suspension est de 3 mois.
- id: 152
  category: penalties_and_points
  question: Pour une première condamnation en vertu du Code criminel liée à la conduite
