  choices:
    A: 0,00 %
    B: 0,05 %
    C: 0,08 %
    D: Moins de 0,05 %
  answer: D
  explanation: La personne accompagnant un apprenti conducteur au Nouveau-Brunswick
    ne doit pas avoir un taux d'alcoolémie (BAC) de 0,05 % ou plus.
- id: 142
  category: penalties_and_points
  question: Si un conducteur au Nouveau-Brunswick est reconnu coupable de « conduite
