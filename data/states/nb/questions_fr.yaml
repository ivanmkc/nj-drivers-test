questions:
- id: 1
  category: license_system
  question: Au Nouveau-Brunswick, quel est l'âge minimal pour demander un permis d'apprenti
    conducteur de classe 7, niveau 1 ?
  choices:
    A: 14 ans
    B: 15 ans
    C: 16 ans
    D: 17 ans
  answer: C
  explanation: Au Nouveau-Brunswick, une personne doit être âgée d'au moins 16 ans
    pour demander un permis d'apprenti conducteur de classe 7, niveau 1.
- id: 2
  category: license_system
  question: Pendant combien de temps un conducteur doit-il détenir un permis de classe
    7, niveau 1 avant de pouvoir passer l'examen de conduite, s'il n'a PAS obtenu
    de diplôme d'une école de conduite agréée ?
  choices:
    A: 6 mois
    B: 8 mois
    C: 12 mois
    D: 24 mois
  answer: C
  explanation: Les conducteurs doivent détenir un permis de niveau 1 pendant 12 mois.
    Cette période est réduite à 8 mois si le conducteur suit avec succès un cours
    de conduite agréé.
- id: 3
  category: license_system
  question: Lorsqu'on conduit avec un permis de classe 7, niveau 1 au Nouveau-Brunswick,
    quelle est la période d'interdiction de conduire ?
  choices:
    A: De 22 h 00 à 6 h 00
    B: De minuit à 5 h 00
    C: De 23 h 00 à 5 h 00
    D: De 21 h 00 à 7 h 00
  answer: B
  explanation: Il est interdit aux conducteurs de classe 7, niveau 1 de conduire entre
    minuit et 5 h 00 du matin.
- id: 4
  category: license_system
  question: Quel est le taux d'alcoolémie (BAC) maximal autorisé pour un conducteur
    de moins de 21 ans au Nouveau-Brunswick ?
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Le Nouveau-Brunswick applique une politique de tolérance zéro (taux
    d'alcoolémie de 0,00 %) pour tous les conducteurs de moins de 21 ans, ainsi que
    pour tous les conducteurs du programme de permis de conduire progressif (GDL).
- id: 5
  category: license_system
  question: Dans le cadre du programme de permis de conduire progressif (GDL) du Nouveau-Brunswick,
    qui doit accompagner un conducteur de classe 7, niveau 1 sur le siège avant ?
  choices:
    A: Toute personne de plus de 21 ans
    B: Un conducteur titulaire d'un permis ayant au moins 1 an d'expérience de conduite
    C: Un conducteur titulaire d'un permis ayant au moins 3 ans d'expérience et un
      permis de classe 5 valide ou supérieur
    D: Un parent ou un tuteur légal uniquement
  answer: C
  explanation: Le conducteur accompagnateur doit détenir un permis de classe 5 valide
    ou supérieur et posséder au moins trois ans d'expérience de conduite.
- id: 6
  category: license_system
  question: Si vous déménagez dans une nouvelle résidence au Nouveau-Brunswick, de
    combien de jours disposez-vous pour informer le registraire des véhicules à moteur
    de votre changement d'adresse ?
  choices:
    A: 7 jours
    B: 10 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: Selon la Loi sur les véhicules à moteur du Nouveau-Brunswick, vous
    devez informer le registraire d'un changement d'adresse dans les 10 jours.
- id: 7
  category: license_system
  question: Au Nouveau-Brunswick, à partir de combien de points accumulés un permis
    de conduire est-il suspendu ?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: Un permis de conduire au Nouveau-Brunswick est suspendu lorsqu'un conducteur
    accumule 12 points.
- id: 8
  category: license_system
  question: À combien de passagers un conducteur de classe 7, niveau 2 est-il limité
    entre minuit et 5 h 00 du matin, à moins d'être accompagné d'un conducteur qualifié
    ?
  choices:
    A: Zéro passager
    B: Un passager
    C: Deux passagers
    D: Trois passagers
  answer: B
  explanation: Entre minuit et 5 h 00 du matin, un conducteur de niveau 2 est limité
    à un seul passager qui n'est pas un membre de sa famille immédiate, à moins d'être
    accompagné d'un conducteur qualifié.
- id: 9
  category: license_system
  question: Combien de points sont déduits du dossier d'un conducteur du Nouveau-Brunswick
    après avoir réussi un cours de conduite préventive agréé ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Les conducteurs peuvent faire retirer jusqu'à 3 points de leur dossier
    une fois tous les deux ans en suivant un cours de conduite préventive agréé.
- id: 10
  category: license_system
  question: Quelle est la sanction pour une première suspension administrative de
    permis pour un taux d'alcoolémie (BAC) compris entre 0,05 % et 0,08 % au Nouveau-Brunswick
    ?
  choices:
    A: Suspension de 24 heures
    B: Suspension de 7 jours
    C: Suspension de 30 jours
    D: Suspension de 90 jours
  answer: B
  explanation: Une première infraction pour un taux d'alcoolémie compris entre 0,05
    % et 0,08 % entraîne une suspension administrative immédiate du permis de 7 jours.
- id: 11
  category: license_system
  question: Au Nouveau-Brunswick, à quelle fréquence un permis de conduire standard
    de classe 5 doit-il être renouvelé ?
  choices:
    A: Tous les 2 ans
    B: Tous les 3 ans
    C: Tous les 4 ans
    D: Tous les 5 ans
  answer: C
  explanation: Les permis de conduire du Nouveau-Brunswick sont généralement valides
    pour une période de 4 ans et expirent le jour de l'anniversaire du conducteur.
- id: 12
  category: license_system
  question: Laquelle des conditions suivantes s'applique à un conducteur de classe
    7 niveau 1 concernant les passagers ?
  choices:
    A: Aucun passager n'est autorisé dans le véhicule
    B: Seuls les membres de la famille immédiate sont autorisés
    C: Seul le conducteur accompagnateur est autorisé sur le siège avant
    D: Jusqu'à 3 passagers sont autorisés sur le siège arrière
  answer: C
  explanation: Pour un conducteur de niveau 1, la seule personne autorisée sur le
    siège avant est le conducteur accompagnateur qualifié. D'autres passagers sont
    autorisés sur les sièges arrière, à condition qu'il y ait une ceinture de sécurité
    pour chacun.
- id: 13
  category: license_system
  question: Quelle est la durée minimale qu'un conducteur doit passer dans la phase
    de classe 7 niveau 2 avant d'obtenir un permis complet de classe 5 ?
  choices:
    A: 6 mois
    B: 12 mois
    C: 18 mois
    D: 24 mois
  answer: B
  explanation: Les conducteurs doivent rester dans la phase de niveau 2 pendant au
    moins 12 mois sans suspension avant d'être admissibles à un permis complet de
    classe 5.
- id: 14
  category: license_system
  question: Si un conducteur du programme GDL (niveau 1 ou 2) enfreint l'exigence
    d'un taux d'alcoolémie (BAC) de 0,00 %, quelle est la période de suspension immédiate
    pour une première infraction ?
  choices:
    A: 7 jours
    B: 30 jours
    C: 90 jours
    D: 1 an
  answer: D
  explanation: Dans le cadre du programme GDL (système de délivrance graduelle des
    permis) du Nouveau-Brunswick, toute violation de la limite de 0,00 % de taux d'alcoolémie
    (BAC) entraîne une suspension immédiate d'un an des privilèges de conduite.
- id: 15
  category: license_system
  question: Parmi les documents suivants, lesquels un conducteur doit-il avoir sur
    lui en tout temps lorsqu'il conduit un véhicule à moteur au Nouveau-Brunswick
    ?
  choices:
    A: Un permis de conduire valide uniquement
    B: Un permis de conduire et l'immatriculation du véhicule uniquement
    C: Un permis de conduire valide, l'immatriculation du véhicule et une preuve d'assurance
      valide
    D: Un permis de conduire valide et une preuve d'assurance uniquement
  answer: C
  explanation: Au Nouveau-Brunswick, les conducteurs sont légalement tenus d'avoir
    sur eux leur permis de conduire, le certificat d'immatriculation du véhicule et
    une carte d'assurance responsabilité civile valide pour véhicule à moteur.
- id: 16
  category: license_system
  question: Au Nouveau-Brunswick, quel est l'âge minimum requis pour demander un permis
    de classe 9, qui permet de conduire un cyclomoteur ?
  choices:
    A: 14 ans
    B: 15 ans
    C: 16 ans
    D: 12 ans
  answer: A
  explanation: Selon le Guide du conducteur du Nouveau-Brunswick, une personne doit
    être âgée d'au moins 14 ans pour demander un permis de classe 9 afin de conduire
    un cyclomoteur.
- id: 17
  category: license_system
  question: Une personne accompagnant un conducteur de classe 7 niveau 1 au Nouveau-Brunswick
    doit détenir un permis de classe 5 valide (ou supérieur) depuis au moins combien
    d'années ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: C
  explanation: Le conducteur accompagnateur d'un apprenti doit être un « conducteur
    qualifié », ce qui est défini au Nouveau-Brunswick comme une personne qui détient
    un permis de classe 5 valide depuis au moins 3 ans.
- id: 18
  category: license_system
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    du Nouveau-Brunswick pour avoir omis de s'arrêter pour un autobus scolaire dont
    les feux rouges clignotent ?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: L'omission de s'arrêter pour un autobus scolaire est une infraction
    grave au Nouveau-Brunswick et entraîne l'ajout de 5 points d'inaptitude au dossier
    du conducteur.
- id: 19
  category: license_system
  question: Lorsqu'un véhicule est vendu au Nouveau-Brunswick, dans un délai de combien
    de jours le nouveau propriétaire doit-il enregistrer le transfert de propriété
    auprès du registraire des véhicules à moteur ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: Selon la loi du Nouveau-Brunswick, le nouveau propriétaire d'un véhicule
    doit enregistrer le transfert de propriété dans les 7 jours suivant l'achat.
- id: 20
  category: license_system
  question: Quelle classe de permis de conduire du Nouveau-Brunswick est requise pour
    conduire un taxi, une ambulance ou un autobus d'une capacité de moins de 25 passagers
    ?
  choices:
    A: Classe 3
    B: Classe 4
    C: Classe 5
    D: Classe 2
  answer: B
  explanation: Un permis de classe 4 au Nouveau-Brunswick est spécifiquement requis
    pour les conducteurs de taxis, d'ambulances et de petits autobus (moins de 25
    passagers).
- id: 21
  category: license_system
  question: Pour satisfaire aux normes de vision pour un permis de classe 5 au Nouveau-Brunswick,
    quelle doit être l'acuité visuelle minimale d'un candidat dans son meilleur œil
    (avec ou sans lentilles correctrices) ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: L'exigence minimale de vision pour un permis standard de classe 5 au
    Nouveau-Brunswick est une acuité visuelle de 20/40 dans au moins un œil.
- id: 22
  category: license_system
  question: Au Nouveau-Brunswick, combien de points d'inaptitude sont inscrits à votre
    dossier pour un excès de vitesse de 25 km/h ou plus au-dessus de la limite de
    vitesse affichée ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Un excès de vitesse de 25 km/h ou plus au-dessus de la limite entraîne
    3 points d'inaptitude, tandis qu'un excès de vitesse de moins de 25 km/h au-dessus
    de la limite entraîne 2 points.
- id: 23
  category: license_system
  question: 'Si vous changez de nom en raison d''un mariage ou pour d''autres raisons
    légales, vous devez en informer le registraire des véhicules à moteur et obtenir
    un permis de remplacement dans un délai de :'
  choices:
    A: 10 jours
    B: 15 jours
    C: 30 jours
    D: 60 jours
  answer: A
  explanation: La loi du Nouveau-Brunswick exige que les conducteurs informent le
    registraire d'un changement de nom dans les 10 jours.
- id: 24
  category: license_system
  question: Au Nouveau-Brunswick, le permis de classe 8 est un permis spécialisé qui
    permet de conduire quel type de véhicule ?
  choices:
    A: Motocyclette
    B: Tracteur agricole
    C: Dépanneuse
    D: Autobus scolaire
  answer: B
  explanation: Le permis de classe 8 est spécifiquement destiné à la conduite de tracteurs
    agricoles.
- id: 25
  category: license_system
  question: Au Nouveau-Brunswick, quel est le montant minimum de l'assurance responsabilité
    civile (tiers) exigé par la loi ?
  choices:
    A: 50 000 $
    B: 100 000 $
    C: 200 000 $
    D: 500 000 $
  answer: C
  explanation: La Loi sur les véhicules à moteur du Nouveau-Brunswick exige que tous
    les véhicules immatriculés détiennent une assurance responsabilité civile minimale
    de 200 000 $.
- id: 26
  category: license_system
  question: Pour un conducteur titulaire d'un permis de classe 1, 2, 3 ou 4 (commercial)
    au Nouveau-Brunswick, à quelle fréquence doit-il soumettre un rapport médical
    au registraire s'il a moins de 45 ans ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 5 ans
    D: Uniquement lors du renouvellement du permis
  answer: C
  explanation: Les conducteurs commerciaux au Nouveau-Brunswick doivent fournir un
    rapport médical tous les 5 ans jusqu'à l'âge de 45 ans, tous les 3 ans de 45 à
    65 ans, et chaque année après 65 ans.
- id: 27
  category: license_system
  question: Combien de points d'inaptitude sont attribués pour une condamnation pour
    avoir « suivi de trop près » au Nouveau-Brunswick ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Suivre de trop près est une infraction de 2 points selon le système
    de points d'inaptitude du Nouveau-Brunswick.
- id: 28
  category: license_system
  question: Laquelle des affirmations suivantes est une exigence pour un conducteur
    de classe 7, niveau 2, concernant le nombre total de passagers autorisés pendant
    la journée (de 5 h 00 à minuit) ?
  choices:
    A: Un seul passager est autorisé
    B: Seuls les membres de la famille immédiate sont autorisés
    C: Le nombre de passagers ne peut excéder le nombre de ceintures de sécurité fonctionnelles
    D: Aucun passager n'est autorisé
  answer: C
  explanation: Pendant la journée, un conducteur de classe 7, niveau 2, n'est limité
    que par le nombre de ceintures de sécurité fonctionnelles dans le véhicule. La
    restriction d'un seul passager ne s'applique qu'entre minuit et 5 h 00.
- id: 29
  category: license_system
  question: 'Si le permis de conduire d''un conducteur du Nouveau-Brunswick est suspendu,
    le conducteur doit immédiatement remettre son permis à :'
  choices:
    A: Au poste de police local
    B: Au registraire des véhicules à moteur
    C: À sa compagnie d'assurance
    D: Au palais de justice le plus proche
  answer: B
  explanation: Lorsqu'un permis est suspendu, la carte physique doit être retournée
    au registraire des véhicules à moteur.
- id: 30
  category: license_system
  question: Combien de points d'inaptitude sont ajoutés à votre dossier pour une condamnation
    pour « défaut de céder le passage » au Nouveau-Brunswick ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Le défaut de céder le passage à un véhicule ou à un piéton entraîne
    3 points d'inaptitude au Nouveau-Brunswick.
- id: 31
  category: driver_testing
  question: Quelle est l'acuité visuelle minimale requise dans au moins un œil pour
    réussir le test de vision pour un permis de classe 5 au Nouveau-Brunswick ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Selon le Guide du conducteur du Nouveau-Brunswick, un candidat au permis
    de classe 5 doit avoir une acuité visuelle d'au moins 20/40 dans au moins un œil,
    avec ou sans lentilles correctrices.
- id: 32
  category: driver_testing
  question: Si vous échouez à votre premier examen de conduite pratique au Nouveau-Brunswick,
    combien de jours devez-vous attendre avant de pouvoir passer un second examen
    ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: Au Nouveau-Brunswick, si vous échouez à l'examen de conduite, vous
    devez attendre au moins 7 jours avant de pouvoir le repasser. Les échecs subséquents
    peuvent entraîner des périodes d'attente plus longues (14 jours après le deuxième
    échec).
- id: 33
  category: driver_testing
  question: Sauf indication contraire, quelle est la limite de vitesse maximale dans
    une zone urbaine au Nouveau-Brunswick ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: En vertu de la Loi sur les véhicules à moteur du Nouveau-Brunswick,
    la limite de vitesse réglementaire dans toute zone urbaine est de 50 km/h, à moins
    que des panneaux n'indiquent le contraire.
- id: 34
  category: driver_testing
  question: Au Nouveau-Brunswick, combien de points d'inaptitude sont inscrits au
    dossier d'un conducteur pour une condamnation liée à l'utilisation d'un appareil
    électronique portatif au volant ?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 9 points
  answer: B
  explanation: L'utilisation d'un appareil de communication portatif (conduite distraite)
    au Nouveau-Brunswick entraîne l'ajout de 3 points d'inaptitude au dossier du conducteur.
- id: 35
  category: driver_testing
  question: Quel est le montant minimal d'assurance responsabilité civile envers les
    tiers exigé par la loi pour un véhicule à moteur au Nouveau-Brunswick ?
  choices:
    A: 50 000 $
    B: 100 000 $
    C: 200 000 $
    D: 500 000 $
  answer: C
  explanation: La loi du Nouveau-Brunswick exige que tous les véhicules à moteur soient
    couverts par une assurance responsabilité civile envers les tiers d'un montant
    minimal de 200 000 $.
- id: 36
  category: driver_testing
  question: Au Nouveau-Brunswick, quelle activité est strictement interdite à un conducteur
    titulaire d'un permis de classe 7, niveau 1 ?
  choices:
    A: Conduire sur une autoroute à 4 voies
    B: Remorquer un autre véhicule ou une remorque
    C: Conduire avec la radio allumée
    D: Conduire un véhicule à transmission manuelle
  answer: B
  explanation: Dans le cadre du programme de délivrance graduelle des permis de conduire
    (GDL), les conducteurs de classe 7, niveau 1 au Nouveau-Brunswick ne sont pas
    autorisés à remorquer une remorque ou un autre véhicule.
- id: 37
  category: driver_testing
  question: À quelle fréquence un véhicule à moteur immatriculé au Nouveau-Brunswick
    doit-il subir une inspection de sécurité obligatoire ?
  choices:
    A: Tous les 6 mois
    B: Chaque année
    C: Tous les 2 ans
    D: Uniquement lors de la vente du véhicule
  answer: B
  explanation: Au Nouveau-Brunswick, les véhicules à moteur doivent subir une inspection
    de sécurité chaque année (annuellement) pour s'assurer qu'ils respectent les normes
    de sécurité provinciales.
- id: 38
  category: driver_testing
  question: Au Nouveau-Brunswick, il est interdit de stationner un véhicule à moins
    de combien de mètres d'une borne fontaine ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: C
  explanation: La Loi sur les véhicules à moteur du Nouveau-Brunswick interdit de
    stationner un véhicule à moins de 5 mètres d'une borne fontaine.
- id: 39
  category: driver_testing
  question: 'Au Nouveau-Brunswick, vous devez signaler un accident de la route au
    service de police le plus proche si le total des dommages matériels semble dépasser
    :'
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: B
  explanation: Les conducteurs du Nouveau-Brunswick sont légalement tenus de signaler
    tout accident impliquant des blessures, un décès ou des dommages matériels qui
    semblent dépasser 1 000 $.
- id: 40
  category: driver_testing
  question: Lorsque vous suivez un autre véhicule la nuit au Nouveau-Brunswick, à
    quelle distance de ce véhicule devez-vous passer des phares de route aux phares
    de croisement ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Le Guide du conducteur du Nouveau-Brunswick stipule que vous devez
    passer aux phares de croisement (codes) lorsque vous suivez un autre véhicule
    à moins de 60 mètres.
- id: 41
  category: driver_testing
  question: Au Nouveau-Brunswick, quelle est la limite de vitesse dans une zone scolaire
    située en zone urbaine entre 7 h 30 et 16 h les jours de classe ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: Au Nouveau-Brunswick, la limite de vitesse dans les zones scolaires
    urbaines est de 30 km/h pendant les heures de classe (de 7 h 30 à 16 h) ou lorsque
    des enfants sont présents.
- id: 42
  category: driver_testing
  question: 'Au Nouveau-Brunswick, un enfant doit être attaché dans un siège d''appoint
    jusqu''à ce qu''il réponde à l''un des critères suivants :'
  choices:
    A: Il a 7 ans
    B: Il pèse 18 kg (40 lb)
    C: Il atteint une taille de 145 cm (4'9")
    D: Il a au moins 12 ans
  answer: C
  explanation: La loi du Nouveau-Brunswick exige que les enfants utilisent un siège
    d'appoint jusqu'à ce qu'ils atteignent une taille de 145 cm (4'9"), ou un poids
    de 36 kg (80 lb), ou l'âge de 9 ans.
- id: 43
  category: driver_testing
  question: Lorsqu'un véhicule d'urgence avec des sirènes et des feux clignotants
    approche de n'importe quelle direction sur une route à deux voies, que doit faire
    le conducteur ?
  choices:
    A: Accélérer pour libérer le passage
    B: Maintenir sa vitesse et rester dans sa voie
    C: Se ranger le plus possible vers la droite et s'arrêter
    D: S'arrêter exactement là où il se trouve dans la voie
  answer: C
  explanation: Au Nouveau-Brunswick, les conducteurs doivent se ranger vers la bordure
    droite ou le bord de la route et s'arrêter jusqu'à ce que le véhicule d'urgence
    soit passé.
- id: 44
  category: driver_testing
  question: Au Nouveau-Brunswick, quand est-il permis de dépasser un autre véhicule
    par la droite ?
  choices:
    A: Lorsque le véhicule devant effectue ou signale un virage à gauche et qu'une
      voie est libre
    B: Chaque fois que vous êtes pressé et que la voie de gauche est bloquée
    C: Sur une route à deux voies avec un accotement en gravier
    D: Il n'est jamais permis de dépasser par la droite
  answer: A
  explanation: Le dépassement par la droite est autorisé au Nouveau-Brunswick uniquement
    lorsque le véhicule dépassé effectue un virage à gauche et qu'une partie pavée
    de la chaussée (et non l'accotement) est disponible pour la manœuvre.
- id: 45
  category: driver_testing
  question: Lors de l'examen de conduite pratique au Nouveau-Brunswick, laquelle des
    situations suivantes entraînera un échec immédiat ?
  choices:
    A: Oublier d'utiliser un clignotant une seule fois
    B: Une action qui oblige l'examinateur à prendre les commandes du véhicule pour
      éviter une collision
    C: Régler les rétroviseurs avant de démarrer le moteur
    D: Conduire à 2 km/h sous la limite de vitesse
  answer: B
  explanation: Toute action nécessitant l'intervention de l'examinateur pour prévenir
    un accident ou une situation dangereuse entraîne un échec immédiat à l'examen
    de conduite.
- id: 46
  category: driver_testing
  question: Au Nouveau-Brunswick, entre quelles dates les pneus à clous (cramponnés)
    sont-ils autorisés sur les véhicules ?
  choices:
    A: Du 1er novembre au 1er avril
    B: Du 15 octobre au 1er mai
    C: Du 1er décembre au 31 mars
    D: Du 1er octobre au 30 avril
  answer: B
  explanation: Les pneus à clous sont autorisés au Nouveau-Brunswick du 15 octobre
    au 1er mai de l'année suivante.
- id: 47
  category: driver_testing
  question: Combien de points d'inaptitude sont attribués pour avoir omis de s'arrêter
    à un panneau d'arrêt ou à un feu rouge au Nouveau-Brunswick ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Le fait de ne pas s'arrêter à un panneau d'arrêt ou à un feu rouge
    entraîne l'ajout de 3 points d'inaptitude au dossier du conducteur au Nouveau-Brunswick.
- id: 48
  category: driver_testing
  question: 'En approchant d''un véhicule d''urgence arrêté avec ses feux rouges ou
    bleus clignotants sur une autoroute à plusieurs voies, la loi du Nouveau-Brunswick
    sur l''obligation de s''écarter vous oblige à :'
  choices:
    A: S'arrêter immédiatement dans votre voie
    B: Maintenir votre vitesse mais klaxonner
    C: Ralentir et changer pour une voie non adjacente si cela peut être fait en toute
      sécurité
    D: Accélérer pour dépasser le véhicule rapidement
  answer: C
  explanation: La loi du Nouveau-Brunswick exige que les conducteurs ralentissent
    et, s'ils se trouvent sur une route à plusieurs voies, qu'ils se déplacent vers
    la voie de gauche (si c'est sécuritaire) lorsqu'ils dépassent des véhicules d'urgence
    dont les feux clignotent.
- id: 49
  category: driver_testing
  question: Au Nouveau-Brunswick, qui est légalement responsable de s'assurer qu'un
    passager de moins de 16 ans porte sa ceinture de sécurité ou se trouve dans un
    dispositif de retenue pour enfant approprié ?
  choices:
    A: Le passager
    B: Les parents du passager (même s'ils ne sont pas dans la voiture)
    C: Le conducteur du véhicule
    D: Le propriétaire du véhicule
  answer: C
  explanation: Le conducteur est responsable de s'assurer que tous les passagers de
    moins de 16 ans sont correctement attachés dans le véhicule.
- id: 50
  category: driver_testing
  question: Lors d'un arrêt à un passage à niveau au Nouveau-Brunswick, quelle est
    la distance minimale à laquelle vous devez vous arrêter du rail le plus proche
    ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Lorsqu'un arrêt est requis à un passage à niveau, vous devez vous arrêter
    à au moins 5 mètres et à au plus 15 mètres du rail le plus proche.
- id: 51
  category: driver_testing
  question: 'Au Nouveau-Brunswick, un rapport de police doit être déposé si une collision
    entraîne des blessures, un décès ou des dommages matériels totaux dépassant :'
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: B
  explanation: Toute collision impliquant des blessures, un décès ou des dommages
    matériels d'un montant total de 1 000 $ ou plus doit être signalée immédiatement
    à la police.
- id: 52
  category: driver_testing
  question: 'Au Nouveau-Brunswick, un demi-tour est interdit dans une courbe ou sur
    une pente où la vue sur la route n''est pas dégagée dans les deux directions sur
    au moins :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 500 mètres
  answer: B
  explanation: Les demi-tours sont illégaux dans les courbes ou près du sommet d'une
    pente où le conducteur n'a pas une visibilité dégagée d'au moins 150 mètres dans
    les deux directions.
- id: 53
  category: driver_testing
  question: Dans quelle circonstance est-il légal de dépasser un autre véhicule par
    la droite au Nouveau-Brunswick ?
  choices:
    A: Lorsque le véhicule qui précède effectue ou signale un virage à gauche
    B: Lorsque vous êtes pressé et que la voie de gauche est bloquée
    C: Lorsque le véhicule qui précède roule en dessous de la limite de vitesse
    D: Il n'est jamais légal de dépasser par la droite
  answer: A
  explanation: Vous pouvez dépasser par la droite si le véhicule dépassé effectue
    ou signale un virage à gauche et qu'une partie pavée et non obstruée de la chaussée
    est disponible pour le dépassement.
- id: 54
  category: driver_responsibility
  question: Au Nouveau-Brunswick, un accident doit être signalé immédiatement à l'agent
    de police le plus proche si le total des dommages matériels semble dépasser quel
    montant ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 1 500 $
    D: 2 000 $
  answer: B
  explanation: Selon la Loi sur les véhicules à moteur du Nouveau-Brunswick, tout
    accident impliquant des blessures, un décès ou des dommages matériels dépassant
    apparemment 1 000 $ doit être signalé immédiatement à la police.
- id: 55
  category: driver_responsibility
  question: Pour la plupart des véhicules de tourisme privés au Nouveau-Brunswick,
    à quelle fréquence une inspection de sécurité valide doit-elle être effectuée
    ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 5 ans
    D: Uniquement lors de la vente du véhicule
  answer: B
  explanation: Depuis 2020, le Nouveau-Brunswick exige que la plupart des véhicules
    personnels subissent une inspection de sécurité tous les deux ans.
- id: 56
  category: driver_responsibility
  question: Une personne qui devient résidente du Nouveau-Brunswick doit immatriculer
    son véhicule provenant d'une autre province dans un délai de combien de mois après
    avoir établi sa résidence ?
  choices:
    A: 30 jours
    B: 3 mois
    C: 6 mois
    D: 12 mois
  answer: C
  explanation: Les nouveaux résidents du Nouveau-Brunswick bénéficient d'une période
    de grâce de six mois pour immatriculer leurs véhicules dans la province.
- id: 57
  category: driver_responsibility
  question: Lors de la vente d'un véhicule à titre privé au Nouveau-Brunswick, quelle
    est la responsabilité du vendeur concernant le certificat d'immatriculation ?
  choices:
    A: Le vendeur doit le conserver pour ses dossiers.
    B: Le vendeur doit le détruire.
    C: Le vendeur doit signer le « Transfert de propriété » au verso et le remettre
      à l'acheteur.
    D: Le vendeur doit l'envoyer par la poste à la compagnie d'assurance.
  answer: C
  explanation: Pour transférer légalement un véhicule, le vendeur doit signer le verso
    du certificat d'immatriculation (section Transfert de propriété) et le remettre
    à l'acheteur.
- id: 58
  category: driver_responsibility
  question: À quel âge un conducteur titulaire d'un permis de classe 5 standard au
    Nouveau-Brunswick doit-il commencer à soumettre des rapports médicaux périodiques
    au registraire des véhicules à moteur ?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: C
  explanation: Au Nouveau-Brunswick, les conducteurs sont tenus de soumettre un rapport
    médical à l'âge de 75 ans, à l'âge de 80 ans, puis tous les deux ans par la suite.
- id: 59
  category: driver_responsibility
  question: Au Nouveau-Brunswick, quelle est l'amende minimale pour une première condamnation
    pour conduite d'un véhicule à moteur sans assurance responsabilité civile valide
    ?
  choices:
    A: 100 $
    B: 300 $
    C: 600 $
    D: 1 500 $
  answer: C
  explanation: L'amende pour conduite sans assurance au Nouveau-Brunswick est importante,
    allant d'un minimum de 600 $ à un maximum de 3 000 $.
- id: 60
  category: driver_responsibility
  question: Si un conducteur ne satisfait pas à un jugement légal rendu contre lui
    pour des dommages résultant d'un accident de véhicule à moteur, quelle mesure
    le registraire prendra-t-il ?
  choices:
    A: Augmenter ses frais d'immatriculation
    B: Suspendre le permis de conduire et les immatriculations de véhicules
    C: Émettre une lettre d'avertissement
    D: Exiger que le conducteur repasse l'examen de conduite
  answer: B
  explanation: En vertu des lois sur la responsabilité financière, si un jugement
    n'est pas payé, le permis de conduire et les immatriculations de véhicules sont
    suspendus jusqu'à ce que le jugement soit satisfait.
- id: 61
  category: driver_responsibility
  question: Lequel des véhicules suivants peut être conduit avec un permis de conduire
    de classe 3 du Nouveau-Brunswick ?
  choices:
    A: Une motocyclette seulement
    B: Un autobus de plus de 24 passagers
    C: Tout véhicule à deux essieux, ou un camion à plus de deux essieux
    D: Un camion semi-remorque
  answer: C
  explanation: Un permis de classe 3 permet au titulaire de conduire tout véhicule
    à 2 essieux, un véhicule à 3 essieux (camion) et une dépanneuse, mais pas un semi-remorque
    (classe 1) ou un grand autobus (classe 2).
- id: 62
  category: driver_responsibility
  question: Combien de points d'inaptitude sont attribués à un conducteur qui ne cède
    pas le passage à un piéton au Nouveau-Brunswick ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Le fait de ne pas céder le passage à un piéton est une infraction grave
    au Nouveau-Brunswick et entraîne une pénalité de 3 points d'inaptitude.
- id: 63
  category: driver_responsibility
  question: Où la loi exige-t-elle qu'un conducteur conserve le certificat d'immatriculation
    du véhicule ?
  choices:
    A: À la maison dans un endroit sûr
    B: Dans le véhicule
    C: Au lieu d'affaires du propriétaire
    D: Chez l'agent d'assurance
  answer: B
  explanation: Le certificat d'immatriculation (ou une photocopie) doit être conservé
    dans le véhicule en tout temps afin de pouvoir être présenté à la demande d'un
    agent de la paix.
- id: 64
  category: driver_responsibility
  question: En vertu du Code criminel du Canada, quelle est la limite de concentration
    d'alcool dans le sang (BAC) à partir de laquelle un conducteur est considéré comme
    commettant une infraction criminelle ?
  choices:
    A: 0,02 % ou plus
    B: 0,05 % ou plus
    C: 0,08 % ou plus
    D: 0,10 % ou plus
  answer: C
  explanation: Bien que le Nouveau-Brunswick impose des sanctions administratives
    à partir de 0,05 %, le Code criminel du Canada fixe la limite légale pour les
    poursuites criminelles à 0,08 % (80 milligrammes d'alcool par 100 millilitres
    de sang).
- id: 65
  category: driver_responsibility
  question: Lors de la vente d'un véhicule au Nouveau-Brunswick, que doit faire le
    vendeur avec les plaques d'immatriculation ?
  choices:
    A: Les laisser sur le véhicule pour le nouveau propriétaire
    B: Les rapporter au poste de police
    C: Les retirer et les conserver pour un usage personnel ou les retourner à SNB
      (Services Nouveau-Brunswick)
    D: Les détruire immédiatement
  answer: C
  explanation: Au Nouveau-Brunswick, les plaques d'immatriculation suivent le propriétaire,
    pas le véhicule. Lorsque vous vendez une voiture, vous devez retirer vos plaques.
- id: 66
  category: driver_responsibility
  question: Si vous êtes impliqué dans une collision, quelles informations êtes-vous
    légalement tenu d'échanger avec l'autre conducteur ?
  choices:
    A: Nom, adresse et numéro de téléphone seulement
    B: Nom, adresse, numéro d'immatriculation du véhicule et informations d'assurance
    C: Numéro de permis de conduire et adresse personnelle seulement
    D: Numéro de police d'assurance et nom de l'employeur
  answer: B
  explanation: Les conducteurs impliqués dans un accident doivent fournir leur nom,
    leur adresse, le numéro d'immatriculation du véhicule et les détails de l'assurance
    à l'autre partie ou à la police.
- id: 67
  category: driver_responsibility
  question: 'Au Nouveau-Brunswick, l''immatriculation d''un véhicule expire généralement
    :'
  choices:
    A: Le 31 décembre de chaque année
    B: À l'anniversaire de la date d'achat du véhicule
    C: Le dernier jour du mois de naissance du propriétaire
    D: Le 31 mars, à la fin de l'exercice financier
  answer: C
  explanation: Pour les particuliers, l'immatriculation d'un véhicule au Nouveau-Brunswick
    expire le dernier jour du mois de naissance du propriétaire.
- id: 68
  category: driver_responsibility
  question: Lors de l'achat d'un véhicule d'occasion à un particulier au Nouveau-Brunswick,
    l'acheteur doit s'assurer que le véhicule a été inspecté au cours des ____ derniers
    jours pour que le transfert soit valide.
  choices:
    A: 15 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Pour un transfert d'immatriculation, le véhicule doit avoir une vignette
    d'inspection valide délivrée au cours des 30 jours précédents, ou il doit être
    inspecté de nouveau par le nouveau propriétaire.
- id: 69
  category: driver_responsibility
  question: Pendant combien de mois un visiteur au Nouveau-Brunswick peut-il conduire
    un véhicule à moteur avec un permis de conduire valide d'une autre province ?
  choices:
    A: 1 mois
    B: 3 mois
    C: 6 mois
    D: 12 mois
  answer: C
  explanation: Les visiteurs sont autorisés à conduire au Nouveau-Brunswick avec un
    permis valide d'une autre province pour une période allant jusqu'à six mois.
- id: 70
  category: driver_responsibility
  question: De quelle couleur est la « carte de responsabilité financière » (preuve
    d'assurance) qui doit être conservée dans le véhicule en tout temps au Nouveau-Brunswick
    ?
  choices:
    A: Bleue
    B: Jaune
    C: Rose
    D: Blanche
  answer: C
  explanation: La carte de preuve d'assurance, communément appelée « carte rose »,
    doit être présentée à la demande d'un agent de la paix.
- id: 71
  category: driver_responsibility
  question: Si vous êtes impliqué dans un accident où une personne est blessée, mais
    que la police n'est pas encore sur les lieux, quelle est votre responsabilité
    principale ?
  choices:
    A: Se rendre à l'hôpital le plus proche pour signaler l'accident
    B: Prêter toute l'assistance raisonnable et appeler les secours médicaux
    C: Attendre 24 heures avant de le signaler à l'assurance
    D: Déplacer immédiatement la personne blessée sur le trottoir
  answer: B
  explanation: La loi exige que les conducteurs impliqués dans un accident restent
    sur les lieux et prêtent toute l'assistance raisonnable à toute personne blessée.
- id: 72
  category: driver_responsibility
  question: Lequel des énoncés suivants est vrai concernant le « Fonds d'indemnisation
    des jugements impayés » (Unsatisfied Judgment Fund) ou des mécanismes provinciaux
    similaires au Nouveau-Brunswick ?
  choices:
    A: Il paie les réparations de tout conducteur qui oublie de souscrire une assurance
    B: Il constitue une source de recouvrement pour les victimes de conducteurs non
      assurés ou de délits de fuite
    C: C'est un fonds utilisé pour payer le véhicule du premier ministre
    D: Il couvre les pannes mécaniques sur l'autoroute
  answer: B
  explanation: Le Nouveau-Brunswick dispose de mécanismes (comme la section D de la
    police standard et des fonds de l'industrie) pour garantir que les victimes de
    conducteurs non assurés ou non identifiés (délit de fuite) puissent tout de même
    recevoir une indemnisation.
- id: 73
  category: driver_responsibility
  question: 'Au Nouveau-Brunswick, si vous êtes reconnu coupable de conduite sans
    assurance, votre permis de conduire sera suspendu pour une période de :'
  choices:
    A: 24 heures
    B: 7 jours
    C: Jusqu'à ce qu'une preuve d'assurance soit fournie et que les frais de rétablissement
      soient payés
    D: De façon permanente
  answer: C
  explanation: La conduite sans assurance entraîne une suspension qui reste en vigueur
    jusqu'à ce que le conducteur fournisse une preuve de responsabilité financière
    et paie les frais requis.
- id: 74
  category: safe_driving_rules
  question: Quelle est la limite de vitesse non affichée pour les routes rurales au
    Nouveau-Brunswick ?
  choices:
    A: 70 km/h
    B: 90 km/h
    C: 80 km/h
    D: 100 km/h
  answer: C
  explanation: Au Nouveau-Brunswick, la limite de vitesse sur les routes rurales est
    de 80 km/h, à moins que des panneaux n'indiquent une limite différente.
- id: 75
  category: safe_driving_rules
  question: Lorsque vous stationnez votre véhicule près d'une borne fontaine au Nouveau-Brunswick,
    quelle est la distance minimale requise que vous devez maintenir ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: C
  explanation: La loi du Nouveau-Brunswick interdit de stationner un véhicule à moins
    de 5 mètres d'une borne fontaine.
- id: 76
  category: safe_driving_rules
  question: À combien de mètres d'un panneau d'arrêt ou d'un feu de circulation situé
    sur le côté de la chaussée devez-vous vous stationner ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 20 mètres
  answer: B
  explanation: Au Nouveau-Brunswick, les conducteurs ne doivent pas se stationner
    à moins de 10 mètres d'un panneau d'arrêt ou d'un feu de circulation situé sur
    le côté de la route.
- id: 77
  category: safe_driving_rules
  question: 'Au Nouveau-Brunswick, il est interdit de faire un demi-tour dans une
    courbe ou sur une côte où vous ne pouvez pas être vu par les autres conducteurs
    arrivant de l''une ou l''autre direction à une distance de :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 75 mètres
  answer: B
  explanation: Les demi-tours sont illégaux dans les courbes ou près du sommet d'une
    côte où le conducteur ne peut pas voir, ou être vu par, les autres usagers de
    la route à moins de 150 mètres.
- id: 78
  category: safe_driving_rules
  question: 'Lorsque vous conduisez de nuit, vous devez passer de vos feux de route
    aux feux de croisement lorsqu''un véhicule venant en sens inverse se trouve à
    moins de :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: Le Guide du conducteur du Nouveau-Brunswick stipule que vous devez
    baisser vos feux de route lorsqu'un véhicule venant en sens inverse se trouve
    à moins de 150 mètres.
- id: 79
  category: safe_driving_rules
  question: Lorsque vous suivez un autre véhicule de nuit, à quelle distance devez-vous
    passer aux feux de croisement ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Vous devez passer aux feux de croisement lorsque vous suivez un autre
    véhicule à moins de 60 mètres pour éviter d'éblouir le conducteur devant vous
    via ses rétroviseurs.
- id: 80
  category: safe_driving_rules
  question: Lorsqu'un autobus scolaire est arrêté avec ses feux rouges clignotants
    et son bras d'arrêt déployé, les conducteurs arrivant de l'une ou l'autre direction
    doivent s'arrêter à au moins combien de mètres de l'autobus ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Au Nouveau-Brunswick, les conducteurs doivent s'arrêter à au moins
    5 mètres de l'avant ou de l'arrière d'un autobus scolaire lorsque ses feux rouges
    clignotent.
- id: 81
  category: safe_driving_rules
  question: À moins qu'une signalisation ne l'interdise, êtes-vous autorisé à tourner
    à droite au feu rouge au Nouveau-Brunswick ?
  choices:
    A: Non, ce n'est jamais autorisé
    B: Oui, mais seulement après avoir marqué un arrêt complet et cédé le passage
      à la circulation et aux piétons
    C: Oui, sans s'arrêter, tant qu'il n'y a pas de circulation
    D: Uniquement pendant les heures de clarté
  answer: B
  explanation: Les virages à droite au feu rouge sont autorisés au Nouveau-Brunswick
    après un arrêt complet, à moins qu'un panneau n'interdise spécifiquement le virage.
- id: 82
  category: safe_driving_rules
  question: Lorsque vous stationnez votre véhicule face à la pente (en descente) sur
    une rue avec une bordure de trottoir, comment devez-vous orienter vos roues avant
    ?
  choices:
    A: Vers la bordure
    B: À l'opposé de la bordure
    C: Parallèlement à la bordure
    D: Cela n'a pas d'importance
  answer: A
  explanation: Lors d'un stationnement en descente, vous devez tourner vos roues vers
    la bordure de sorte que si le véhicule se met à rouler, il butera contre la bordure
    et s'arrêtera.
- id: 83
  category: safe_driving_rules
  question: 'Une double ligne jaune continue au centre de la chaussée signifie :'
  choices:
    A: Le dépassement est autorisé si c'est sécuritaire
    B: Le dépassement est interdit pour la circulation dans les deux sens
    C: Le dépassement est autorisé pour la circulation du côté droit uniquement
    D: La route est à sens unique
  answer: B
  explanation: Les doubles lignes jaunes continues signifient que le dépassement est
    interdit pour les véhicules circulant dans les deux sens.
- id: 84
  category: safe_driving_rules
  question: 'Lorsque vous suivez un véhicule d''urgence (camion de pompiers, ambulance
    ou voiture de police) dont les sirènes ou les gyrophares sont en marche, vous
    devez maintenir une distance de suivi minimale de :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Au Nouveau-Brunswick, il est illégal de suivre un véhicule d'urgence
    à moins de 150 mètres lorsqu'il répond à un appel.
- id: 85
  category: safe_driving_rules
  question: Lorsque deux véhicules s'engagent dans une intersection non réglementée
    en provenance de routes différentes à peu près en même temps, qui a la priorité
    ?
  choices:
    A: Le véhicule à gauche
    B: Le véhicule à droite
    C: Le véhicule circulant à une vitesse plus élevée
    D: Le véhicule le plus gros
  answer: B
  explanation: À une intersection non réglementée, le conducteur du véhicule à gauche
    doit céder le passage au véhicule à droite.
- id: 86
  category: safe_driving_rules
  question: Lorsque vous conduisez dans une zone scolaire urbaine au Nouveau-Brunswick
    pendant les heures de classe, quelle est la limite de vitesse maximale ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: Au Nouveau-Brunswick, la limite de vitesse dans les zones scolaires
    des zones urbaines est de 30 km/h entre 7 h 30 et 16 h 00 les jours d'école, ou
    selon la signalisation.
- id: 87
  category: safe_driving_rules
  question: En approchant d'un panneau d'arrêt ou d'un signal de contrôle de la circulation,
    à quelle distance minimale ne devez-vous pas stationner votre véhicule ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 20 mètres
  answer: B
  explanation: Selon la loi du Nouveau-Brunswick, le stationnement est interdit à
    moins de 10 mètres de l'approche de tout feu clignotant, panneau d'arrêt ou signal
    de contrôle de la circulation situé sur le côté d'une chaussée.
- id: 88
  category: safe_driving_rules
  question: À quelle distance devez-vous passer des feux de route aux feux de croisement
    lorsque vous croisez un véhicule venant en sens inverse la nuit au Nouveau-Brunswick
    ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: La loi du Nouveau-Brunswick exige que les conducteurs passent aux feux
    de croisement lorsqu'un véhicule venant en sens inverse se trouve à moins de 150
    mètres.
- id: 89
  category: safe_driving_rules
  question: Lorsque vous suivez un autre véhicule par l'arrière la nuit, à quelle
    distance devez-vous passer vos phares en feux de croisement ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Au Nouveau-Brunswick, vous devez passer vos phares en feux de croisement
    lorsque vous suivez un autre véhicule à une distance de 60 mètres ou moins.
- id: 90
  category: safe_driving_rules
  question: En vertu de la « Loi d'Ellen » au Nouveau-Brunswick, quelle est la distance
    minimale qu'un automobiliste doit maintenir lorsqu'il dépasse un cycliste ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 1,5 mètre
    D: 2 mètres
  answer: B
  explanation: La Loi d'Ellen (Règlement 84-145) exige que les conducteurs au Nouveau-Brunswick
    maintiennent une distance minimale d'un mètre entre leur véhicule et une bicyclette
    lors d'un dépassement.
- id: 91
  category: safe_driving_rules
  question: Au Nouveau-Brunswick, il est interdit de se stationner à moins de combien
    de mètres d'un passage pour piétons à une intersection ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: La Loi sur les véhicules à moteur du Nouveau-Brunswick interdit de
    se stationner à moins de 5 mètres d'un passage pour piétons à une intersection.
- id: 92
  category: safe_driving_rules
  question: Lorsque vous avez l'intention de tourner dans un quartier commercial ou
    résidentiel, combien de temps à l'avance devez-vous signaler votre intention ?
  choices:
    A: 10 mètres
    B: 30 mètres
    C: 50 mètres
    D: 100 mètres
  answer: B
  explanation: Au Nouveau-Brunswick, vous devez signaler votre intention de tourner
    au moins 30 mètres avant le virage dans les zones urbaines (quartiers commerciaux
    ou résidentiels).
- id: 93
  category: safe_driving_rules
  question: Quelle est la distance de suivi recommandée derrière un autre véhicule
    dans des conditions de conduite normales au Nouveau-Brunswick ?
  choices:
    A: La longueur d'une voiture
    B: Deux secondes
    C: Cinq secondes
    D: 10 mètres
  answer: B
  explanation: Le Guide du conducteur du Nouveau-Brunswick recommande une distance
    de suivi minimale d'au moins deux secondes derrière le véhicule qui vous précède
    dans des conditions idéales.
- id: 94
  category: safe_driving_rules
  question: Qu'arrive-t-il à l'amende pour excès de vitesse dans une zone de construction
    désignée au Nouveau-Brunswick lorsque des travailleurs sont présents ?
  choices:
    A: L'amende est suspendue
    B: L'amende est doublée
    C: L'amende est triplée
    D: Il n'y a aucun changement à l'amende
  answer: B
  explanation: Au Nouveau-Brunswick, les amendes pour excès de vitesse dans une zone
    de construction sont doublées lorsque des travailleurs sont présents dans la zone.
- id: 95
  category: safe_driving_rules
  question: Au Nouveau-Brunswick, quand êtes-vous tenu d'utiliser vos phares ?
  choices:
    A: Uniquement entre minuit et 5 h 00
    B: Du coucher au lever du soleil et chaque fois que la visibilité est inférieure
      à 150 mètres
    C: Uniquement lorsqu'il pleut
    D: D'une heure après le coucher du soleil à une heure avant le lever du soleil
  answer: B
  explanation: Selon la Loi sur les véhicules à moteur du Nouveau-Brunswick, les phares
    doivent être allumés du coucher au lever du soleil et à tout autre moment où la
    visibilité est réduite à moins de 150 mètres.
- id: 96
  category: defensive_driving
  question: Pour maintenir un « temps d'avance visuel » adéquat et éviter les manœuvres
    de dernière minute, le Guide du conducteur du Nouveau-Brunswick suggère de balayer
    la route du regard jusqu'à quelle distance devant vous ?
  choices:
    A: 3 à 5 secondes
    B: 5 à 8 secondes
    C: 12 à 15 secondes
    D: 20 à 30 secondes
  answer: C
  explanation: Les conducteurs sont encouragés à regarder de 12 à 15 secondes devant
    leur véhicule pour identifier tôt les dangers potentiels.
- id: 97
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une route mouillée
    du Nouveau-Brunswick, quelle est la bonne réaction de conduite préventive ?
  choices:
    A: Freiner fort pour regagner de la traction
    B: Accélérer légèrement pour traverser l'eau
    C: Mettre le véhicule au point mort (neutre)
    D: Lever le pied de l'accélérateur et diriger tout droit jusqu'à ce que vous repreniez
      le contrôle
  answer: D
  explanation: En cas d'aquaplanage, vous ne devez pas freiner ni tourner brusquement.
    Au lieu de cela, relâchez l'accélérateur et gardez le volant droit jusqu'à ce
    que les pneus reprennent contact avec la route.
- id: 98
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais au Nouveau-Brunswick,
    quel réglage de feux devez-vous utiliser pour une visibilité et une sécurité optimales
    ?
  choices:
    A: Feux de route (pleins phares)
    B: Feux de croisement (codes)
    C: Feux de stationnement uniquement
    D: Feux de détresse
  answer: B
  explanation: Les feux de route se reflètent sur le brouillard et provoquent un éblouissement.
    Les feux de croisement dirigent la lumière vers le bas, vers la route, offrant
    une meilleure visibilité dans des conditions de brouillard.
- id: 99
  category: defensive_driving
  question: Lorsque vous conduisez sur une route à plusieurs voies au Nouveau-Brunswick
    et que vous approchez d'un véhicule d'urgence arrêté avec ses gyrophares allumés,
    que vous oblige la loi à faire ?
  choices:
    A: Maintenir sa vitesse mais se déplacer vers la voie de gauche
    B: Ralentir et se déplacer vers la voie de gauche si cela peut être fait en toute
      sécurité
    C: S'arrêter immédiatement dans sa voie
    D: Accélérer pour dépasser le véhicule rapidement
  answer: B
  explanation: La loi du Nouveau-Brunswick sur l'obligation de céder le passage (loi
    « Move Over ») exige que les conducteurs ralentissent et, s'il y a plusieurs voies,
    qu'ils se déplacent dans la voie la plus éloignée du véhicule d'urgence (y compris
    les dépanneuses) si cela peut être fait en toute sécurité.
- id: 100
  category: defensive_driving
  question: Quelle est la distance de suivi recommandée au Nouveau-Brunswick lorsque
    vous conduisez dans des conditions défavorables comme la pluie, la neige ou la
    glace ?
  choices:
    A: Les mêmes deux secondes utilisées pour les routes sèches
    B: Au moins quatre secondes ou plus
    C: Exactement la longueur d'une voiture pour chaque 10 km/h
    D: Dix secondes quelle que soit la vitesse
  answer: B
  explanation: Par mauvais temps ou dans de mauvaises conditions routières, la distance
    de suivi standard de deux secondes devrait être doublée pour atteindre au moins
    quatre secondes afin de permettre une distance d'arrêt accrue.
- id: 101
  category: defensive_driving
  question: Lorsque vous abordez un virage, à quel moment devriez-vous idéalement
    réduire votre vitesse pour maintenir un contrôle maximal ?
  choices:
    A: Pendant que vous êtes au milieu du virage
    B: Avant d'entrer dans le virage
    C: Seulement si vous sentez les pneus glisser
    D: Au moment où vous sortez du virage
  answer: B
  explanation: Les pratiques de conduite préventive au Nouveau-Brunswick stipulent
    que vous devez ralentir à une vitesse sécuritaire avant d'entrer dans un virage
    pour éviter de freiner pendant que vous tournez, ce qui peut provoquer un dérapage.
- id: 102
  category: defensive_driving
  question: Si votre pédale d'accélérateur reste coincée alors que vous conduisez
    sur une route du Nouveau-Brunswick, quelle est la première chose à faire ?
  choices:
    A: Couper le moteur immédiatement
    B: Appliquer le frein d'urgence à fond
    C: Passer au point mort (neutre) et appliquer une pression constante sur les freins
    D: Ouvrir la porte et sauter du véhicule
  answer: C
  explanation: Si l'accélérateur reste coincé, passer au point mort coupe la puissance
    transmise aux roues. Vous pouvez ensuite utiliser les freins pour ralentir et
    vous ranger en lieu sûr. Couper le moteur pourrait bloquer la direction ou désactiver
    l'assistance au freinage.
- id: 103
  category: defensive_driving
  question: Lorsque vous conduisez un véhicule équipé de freins antiblocage (ABS)
    dans une situation d'urgence, comment devez-vous appliquer les freins ?
  choices:
    A: Pomper les freins rapidement
    B: Appliquer une pression ferme et continue sur la pédale de frein
    C: Tapoter légèrement les freins pour éviter le blocage
    D: Rétrograder et ne pas utiliser les freins
  answer: B
  explanation: Avec l'ABS, le système pompe les freins pour vous. Vous devez maintenir
    une pression ferme et constante sur la pédale de frein jusqu'à ce que le véhicule
    s'arrête.
- id: 104
  category: defensive_driving
  question: Au Nouveau-Brunswick, qu'est-ce que l'« angle mort » d'un véhicule ?
  choices:
    A: La zone située directement devant le capot
    B: La zone à l'arrière gauche et droite du véhicule qui ne peut pas être vue dans
      les rétroviseurs
    C: La zone couverte par le rétroviseur intérieur
    D: La zone visible à travers les vitres latérales
  answer: B
  explanation: Les angles morts sont des zones autour du véhicule qu'un conducteur
    ne peut pas voir en utilisant uniquement les rétroviseurs. Les conducteurs doivent
    effectuer des vérifications par-dessus l'épaule pour voir dans ces zones avant
    de changer de voie.
- id: 105
  category: defensive_driving
  question: Lorsque vous conduisez sur les autoroutes du Nouveau-Brunswick, à quelle
    fréquence devriez-vous vérifier vos rétroviseurs pour maintenir une conscience
    de la situation ?
  choices:
    A: Toutes les 2 à 5 secondes
    B: Toutes les 30 secondes
    C: Uniquement lors d'un changement de voie
    D: Toutes les 5 à 10 secondes
  answer: D
  explanation: Le Guide du conducteur du Nouveau-Brunswick suggère de vérifier vos
    rétroviseurs toutes les 5 à 10 secondes pour rester conscient de l'environnement
    routier qui vous entoure.
- id: 106
  category: defensive_driving
  question: Pour maintenir une conscience adéquate de la situation dans les zones
    urbaines du Nouveau-Brunswick, à quelle distance vers l'avant un conducteur doit-il
    balayer la route du regard ?
  choices:
    A: 2 à 5 secondes
    B: 5 à 8 secondes
    C: 12 à 15 secondes
    D: 20 à 30 secondes
  answer: C
  explanation: Les directives de conduite préventive au Nouveau-Brunswick suggèrent
    de balayer du regard 12 à 15 secondes devant soi en ville pour anticiper les dangers
    potentiels et les changements de circulation.
- id: 107
  category: defensive_driving
  question: En dehors des zones commerciales ou résidentielles au Nouveau-Brunswick,
    quelle est la distance minimale qu'un véhicule commercial doit maintenir lorsqu'il
    suit un autre véhicule commercial ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Selon la Loi sur les véhicules à moteur du Nouveau-Brunswick, les conducteurs
    de véhicules commerciaux doivent maintenir une distance de suivi d'au moins 60
    mètres par rapport aux autres véhicules commerciaux sur l'autoroute.
- id: 108
  category: defensive_driving
  question: Pendant les hivers au Nouveau-Brunswick, quelle est la responsabilité
    légale d'un conducteur concernant la neige et la glace sur son véhicule avant
    de conduire ?
  choices:
    A: Seul le côté conducteur du pare-brise doit être dégagé
    B: Seuls les phares et les feux arrière doivent être dégagés
    C: L'ensemble du véhicule, y compris le toit et le capot, doit être débarrassé
      de la neige et de la glace
    D: Aucune loi spécifique n'existe tant que vous pouvez voir à travers la vitre
      avant
  answer: C
  explanation: Au Nouveau-Brunswick, c'est une infraction à la sécurité de conduire
    avec de la neige ou de la glace sur votre véhicule qui pourrait s'envoler et obstruer
    la vue d'autres conducteurs ou tomber sur la route.
- id: 109
  category: defensive_driving
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    du Nouveau-Brunswick pour l'infraction de « suivre de trop près » ?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 0 point (amende seulement)
  answer: A
  explanation: Suivre de trop près est une infraction entraînant 2 points selon le
    système de points du Nouveau-Brunswick.
- id: 110
  category: defensive_driving
  question: 'Lors du balayage de la route, on enseigne aux conducteurs du Nouveau-Brunswick
    de vérifier leurs rétroviseurs intérieur et extérieurs environ toutes les :'
  choices:
    A: 2 à 5 secondes
    B: 5 à 10 secondes
    C: 30 secondes
    D: Minute
  answer: B
  explanation: Des vérifications fréquentes des rétroviseurs (toutes les 5 à 10 secondes)
    sont un élément central de la conduite préventive au Nouveau-Brunswick pour suivre
    le mouvement de la circulation derrière et à côté du véhicule.
- id: 111
  category: defensive_driving
  question: Au Nouveau-Brunswick, quand les routes sont-elles généralement les plus
    glissantes pendant une tempête de pluie ?
  choices:
    A: Après plusieurs heures de pluie
    B: Juste au moment où la pluie commence à tomber
    C: Immédiatement après l'arrêt de la pluie
    D: Uniquement lorsque la température est inférieure au point de congélation
  answer: B
  explanation: Les routes sont les plus glissantes juste au début de la pluie, car
    l'eau se mélange à l'huile et à la poussière sur la chaussée qui n'ont pas encore
    été évacuées par le ruissellement.
- id: 112
  category: defensive_driving
  question: Si vous êtes ébloui par les feux de route d'un véhicule venant en sens
    inverse au Nouveau-Brunswick, où devez-vous regarder pour rester dans votre voie
    ?
  choices:
    A: Directement vers les phares qui arrivent
    B: Vers la ligne centrale de la route
    C: Vers le bord droit de la route (la ligne blanche)
    D: Fermer brièvement les yeux jusqu'à ce que la voiture passe
  answer: C
  explanation: Pour éviter d'être complètement ébloui, vous devez regarder vers le
    bord droit de votre voie ou vers la ligne de rive blanche jusqu'à ce que le véhicule
    soit passé.
- id: 113
  category: defensive_driving
  question: Lorsque vous conduisez sur une autoroute du Nouveau-Brunswick sous une
    pluie battante ou de la neige, comment devez-vous ajuster votre distance de sécurité
    ?
  choices:
    A: La maintenir à deux secondes
    B: La réduire à une seconde pour mieux voir les feux de la voiture de devant
    C: L'augmenter à au moins le double de la distance normale
    D: La distance de sécurité n'a pas d'importance si vous avez des pneus d'hiver
  answer: C
  explanation: Les conditions météorologiques défavorables augmentent considérablement
    les distances de freinage ; par conséquent, le manuel du Nouveau-Brunswick recommande
    de doubler ou de tripler la règle des deux secondes.
- id: 114
  category: alcohol_drugs_health
  question: Au Nouveau-Brunswick, un conducteur expérimenté (hors GDL) dont le taux
    d'alcoolémie (BAC) se situe entre 0,05 % et 0,08 % fera l'objet d'une suspension
    immédiate sur le bord de la route de combien de jours pour une première infraction
    ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 15 jours
    D: 30 jours
  answer: B
  explanation: Au Nouveau-Brunswick, la plage d'avertissement se situe entre 0,05
    % et 0,08 %. Une première infraction entraîne une suspension administrative immédiate
    du permis de conduire de 7 jours.
- id: 115
  category: alcohol_drugs_health
  question: Si un conducteur au Nouveau-Brunswick est pris avec un taux d'alcoolémie
    (BAC) de 0,08 % ou plus, quelle est la durée de la suspension administrative immédiate
    du permis de conduire sur le bord de la route ?
  choices:
    A: 7 jours
    B: 30 jours
    C: 90 jours
    D: 1 an
  answer: C
  explanation: Les conducteurs ayant un taux d'alcoolémie supérieur à 0,08 % ou ceux
    qui refusent un test d'alcoolémie reçoivent une suspension administrative immédiate
    de leur permis de 90 jours.
- id: 116
  category: alcohol_drugs_health
  question: Selon la loi du Nouveau-Brunswick, si le véhicule d'un conducteur est
    mis en fourrière en raison d'un taux d'alcoolémie (BAC) supérieur à 0,08 % ou
    d'un refus de fournir un échantillon, quelle est la durée de la période de mise
    en fourrière obligatoire ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: Un véhicule fait l'objet d'une mise en fourrière obligatoire de 30
    jours si le conducteur est suspendu pour un taux d'alcoolémie supérieur à 0,08
    % ou pour avoir refusé une demande d'échantillon d'haleine ou de fluide.
- id: 117
  category: alcohol_drugs_health
  question: Au Nouveau-Brunswick, quelle est la limite de taux d'alcoolémie (BAC)
    pour les conducteurs de véhicules commerciaux (classe 1, 2, 3 ou 4) ?
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Les conducteurs commerciaux au Nouveau-Brunswick sont tenus de maintenir
    un taux d'alcoolémie de 0,00 % lorsqu'ils conduisent un véhicule commercial.
- id: 118
  category: alcohol_drugs_health
  question: Quelle est la conséquence pour un conducteur au Nouveau-Brunswick qui
    refuse de fournir un échantillon d'haleine, de sang ou de fluide buccal sur demande
    légale d'un agent de la paix ?
  choices:
    A: Une suspension de 24 heures seulement
    B: Une suspension de 7 jours et une amende de 100 $
    C: Les mêmes sanctions que pour un taux d'alcoolémie supérieur à 0,08 %
    D: Aucune sanction s'il s'agit d'une première demande
  answer: C
  explanation: Le refus de fournir un échantillon est une infraction criminelle et
    entraîne les mêmes sanctions administratives immédiates qu'un taux d'alcoolémie
    supérieur à 0,08 %, y compris une suspension de 90 jours et une mise en fourrière
    du véhicule de 30 jours.
- id: 119
  category: alcohol_drugs_health
  question: À la suite d'une suspension de permis liée à l'alcool au Nouveau-Brunswick,
    quels sont les frais standard requis pour rétablir un permis de conduire ?
  choices:
    A: 50 $
    B: 100 $
    C: 230 $
    D: 500 $
  answer: C
  explanation: Selon les règlements actuels du Nouveau-Brunswick, les frais de rétablissement
    d'un permis suspendu pour des infractions liées à l'alcool ou aux drogues sont
    de 230 $.
- id: 120
  category: alcohol_drugs_health
  question: Pour les conducteurs du programme de permis de conduire progressif (GDL)
    du Nouveau-Brunswick, quelle est la limite légale de THC (cannabis) dans leur
    organisme ?
  choices:
    A: 0 ng/ml
    B: 2 ng/ml
    C: 5 ng/ml
    D: 10 ng/ml
  answer: A
  explanation: Le Nouveau-Brunswick a une politique de tolérance zéro pour les drogues
    pour tous les conducteurs du programme GDL et les conducteurs de moins de 21 ans
    ; ils doivent avoir 0 ng/ml de THC dans leur organisme.
- id: 121
  category: alcohol_drugs_health
  question: Au Nouveau-Brunswick, qui est légalement tenu de signaler un patient au
    Registraire des véhicules à moteur s'il présente un état de santé susceptible
    de rendre sa conduite dangereuse ?
  choices:
    A: Seulement l'employeur du conducteur
    B: Seulement la famille immédiate du conducteur
    C: Tout praticien de la santé légalement qualifié (médecin)
    D: Personne ; c'est strictement confidentiel
  answer: C
  explanation: En vertu de la Loi sur les véhicules à moteur, les médecins sont légalement
    tenus de signaler les patients dont l'état de santé pourrait nuire à leur capacité
    de conduire un véhicule à moteur en toute sécurité.
- id: 122
  category: alcohol_drugs_health
  question: Si un conducteur du Nouveau-Brunswick est soupçonné de conduite avec facultés
    affaiblies par la drogue, un agent de police peut exiger qu'il se soumette à un
    « test de sobriété normalisé sur le terrain » (SFST). Que se passe-t-il si le
    conducteur échoue à ce test ?
  choices:
    A: Il reçoit un avertissement et est renvoyé chez lui
    B: Il fait face à une suspension immédiate de 24 heures sur le bord de la route
    C: Il peut être tenu de subir une évaluation par un expert en reconnaissance de
      drogues (DRE)
    D: Son permis est révoqué de façon permanente sur-le-champ
  answer: C
  explanation: L'échec à un SFST donne à l'agent des motifs suffisants pour exiger
    des tests supplémentaires, comme une évaluation par un expert en reconnaissance
    de drogues (DRE) ou un échantillon de sang.
- id: 123
  category: alcohol_drugs_health
  question: Un conducteur expérimenté du Nouveau-Brunswick reçoit une deuxième suspension
    sur une période de 5 ans pour avoir eu un taux d'alcoolémie (BAC) dans la « zone
    d'avertissement » (0,05 % à 0,08 %). Quelle est la durée de cette deuxième suspension
    ?
  choices:
    A: 7 jours
    B: 15 jours
    C: 30 jours
    D: 45 jours
  answer: B
  explanation: Une deuxième infraction dans la « zone d'avertissement » (0,05 % à
    0,08 %) sur une période de 5 ans entraîne une suspension administrative du permis
    de 15 jours.
- id: 124
  category: alcohol_drugs_health
  question: Quel programme est obligatoire pour les conducteurs du Nouveau-Brunswick
    condamnés pour une première infraction de conduite avec facultés affaiblies en
    vertu du Code criminel avant de pouvoir récupérer tous leurs privilèges de conduite
    ?
  choices:
    A: Le cours de conduite préventive
    B: Le programme d'antidémarreur éthylique (AIIP)
    C: Le programme de sensibilisation à la vitesse élevée
    D: Le cours de formation de base des conducteurs
  answer: B
  explanation: Les conducteurs condamnés pour conduite avec facultés affaiblies par
    l'alcool en vertu du Code criminel doivent participer au programme d'antidémarreur
    éthylique (AIIP) dans le cadre de leur processus de rétablissement du permis.
- id: 125
  category: alcohol_drugs_health
  question: Quelle est la période de suspension immédiate sur le bord de la route
    pour une troisième infraction ou une infraction subséquente de taux d'alcoolémie
    (BAC) dans la « zone d'avertissement » (0,05 % à 0,08 %) au Nouveau-Brunswick
    ?
  choices:
    A: 15 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Une troisième infraction ou une infraction subséquente dans la « zone
    d'avertissement » sur une période de 5 ans entraîne une suspension administrative
    du permis de 30 jours.
- id: 126
  category: alcohol_drugs_health
  question: Comment la consommation simultanée d'alcool et de drogues (y compris les
    médicaments sur ordonnance) affecte-t-elle un conducteur par rapport à leur consommation
    séparée ?
  choices:
    A: Les effets s'annulent mutuellement
    B: Il n'y a aucune différence dans l'affaiblissement des facultés
    C: L'effet combiné est nettement supérieur à la somme des parties
    D: Cela rend le conducteur plus vigilant
  answer: C
  explanation: La combinaison d'alcool et de drogues crée un effet synergique, ce
    qui signifie que le niveau d'affaiblissement des facultés est beaucoup plus élevé
    que si l'une ou l'autre substance était utilisée seule.
- id: 127
  category: alcohol_drugs_health
  question: Au Nouveau-Brunswick, si vous prenez des médicaments sur ordonnance, qui
    est responsable de s'assurer que vous êtes apte à conduire ?
  choices:
    A: Le pharmacien seulement
    B: Le médecin seulement
    C: Le conducteur
    D: La police
  answer: C
  explanation: Il incombe au conducteur de connaître les effets de tout médicament
    qu'il prend. Il doit consulter son médecin ou son pharmacien, mais la responsabilité
    légale de conduire le véhicule en toute sécurité incombe au conducteur.
- id: 128
  category: alcohol_drugs_health
  question: Lequel des éléments suivants est un symptôme de fatigue qui devrait signaler
    à un conducteur de s'arrêter et de se reposer ?
  choices:
    A: Manquer une sortie ou un panneau de signalisation
    B: Difficulté à garder les yeux ouverts ou la tête haute
    C: Déviation de la voie
    D: Toutes les réponses ci-dessus
  answer: D
  explanation: La fatigue est une forme d'affaiblissement des facultés. Manquer des
    panneaux, dévier de sa trajectoire et avoir des difficultés physiques à rester
    éveillé sont tous des signes d'avertissement critiques indiquant qu'un conducteur
    doit se ranger en toute sécurité et se reposer.
- id: 129
  category: alcohol_drugs_health
  question: Au Nouveau-Brunswick, les conducteurs expérimentés (hors GDL) feront face
    à une suspension administrative immédiate sur le bord de la route si leur taux
    d'alcoolémie (BAC) est égal ou supérieur à quel niveau ?
  choices:
    A: 0,02 %
    B: 0,05 %
    C: 0,08 %
    D: 0,10 %
  answer: B
  explanation: Au Nouveau-Brunswick, bien que la limite du Code criminel soit de 0,08
    %, une suspension administrative sur le bord de la route est déclenchée à 0,05
    % pour les conducteurs expérimentés.
- id: 130
  category: alcohol_drugs_health
  question: Pour une première condamnation en vertu du Code criminel pour conduite
    avec un taux d'alcoolémie (BAC) supérieur à 0,08 % au Nouveau-Brunswick, quelle
    est la période minimale d'interdiction de conduire fédérale ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 12 mois
    D: 24 mois
  answer: C
  explanation: En vertu du Code criminel du Canada, une condamnation pour une première
    infraction de conduite avec un taux supérieur à 0,08 % entraîne une interdiction
    de conduire minimale de 12 mois (1 an).
- id: 131
  category: alcohol_drugs_health
  question: Selon la loi du Nouveau-Brunswick, quel est le niveau de tolérance aux
    drogues pour les conducteurs du programme de permis de conduire progressif (GDL)
    ?
  choices:
    A: Tolérance zéro pour toute présence d'un médicament prescrit
    B: 'Tolérance zéro pour toute présence d''une drogue interdite (ex. : THC)'
    C: 2 nanogrammes de THC par millilitre de sang
    D: 5 nanogrammes de THC par millilitre de sang
  answer: B
  explanation: Le Nouveau-Brunswick maintient une politique de tolérance zéro pour
    les drogues (y compris le THC) pour tous les conducteurs du programme GDL et les
    conducteurs de moins de 21 ans.
- id: 132
  category: alcohol_drugs_health
  question: Si un conducteur au Nouveau-Brunswick refuse de fournir un échantillon
    d'haleine ou de sang suite à une demande légale d'un agent de police, quelles
    en sont les conséquences ?
  choices:
    A: Une petite amende et 2 points d'inaptitude
    B: Une suspension de 24 heures seulement
    C: Les mêmes sanctions que pour un taux d'alcoolémie (BAC) supérieur à 0,08 %
    D: Un avertissement pour le premier refus
  answer: C
  explanation: Le refus de fournir un échantillon d'haleine ou de sang est une infraction
    criminelle au Canada et entraîne les mêmes sanctions que la conduite avec un taux
    d'alcoolémie supérieur à la limite légale.
- id: 133
  category: alcohol_drugs_health
  question: Au Nouveau-Brunswick, si un conducteur expérimenté reçoit une première
    suspension administrative pour un taux d'alcoolémie (BAC) compris entre 0,05 %
    et 0,08 %, pendant combien de temps son véhicule est-il mis en fourrière ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: Pour une première suspension administrative (0,05 % à 0,08 %), le permis
    de conduire est suspendu pendant 7 jours et le véhicule est mis en fourrière pendant
    3 jours.
- id: 134
  category: alcohol_drugs_health
  question: Quels sont les frais de rétablissement obligatoires pour un permis de
    conduire au Nouveau-Brunswick à la suite d'une suspension liée à l'alcool ?
  choices:
    A: 50 $
    B: 100 $
    C: 230 $
    D: 500 $
  answer: C
  explanation: Le Nouveau-Brunswick exige des frais de rétablissement de 230 $ (sous
    réserve de modification par règlement) pour rétablir un permis après une suspension
    pour des motifs liés à l'alcool.
- id: 135
  category: alcohol_drugs_health
  question: Quel est l'effet de la consommation simultanée d'alcool et de drogues
    (même des médicaments sur ordonnance) avant de conduire ?
  choices:
    A: Les effets de chacun s'annulent
    B: La drogue empêchera toujours l'alcool d'être absorbé
    C: L'effet combiné est souvent supérieur à la somme des deux (effet synergique)
    D: Il n'y a aucun effet combiné sur la capacité de conduite
  answer: C
  explanation: La combinaison d'alcool et de drogues peut créer un effet synergique,
    augmentant considérablement le niveau de facultés affaiblies au-delà de ce que
    l'une ou l'autre substance causerait seule.
- id: 136
  category: alcohol_drugs_health
  question: 'Au Nouveau-Brunswick, une deuxième suspension administrative pour un
    taux d''alcoolémie (BAC) compris entre 0,05 % et 0,08 % sur une période de cinq
    ans entraîne une suspension de permis de :'
  choices:
    A: 7 jours
    B: 15 jours
    C: 30 jours
    D: 90 jours
  answer: B
  explanation: Une deuxième infraction dans la fourchette de taux d'alcoolémie de
    0,05 % à 0,08 % au Nouveau-Brunswick entraîne une suspension de permis de 15 jours.
- id: 137
  category: alcohol_drugs_health
  question: Laquelle des conditions suivantes est requise pour qu'un conducteur reconnu
    coupable d'une infraction à l'alcool en vertu du Code criminel puisse récupérer
    pleinement ses privilèges de conduite au Nouveau-Brunswick ?
  choices:
    A: Il doit attendre 10 ans
    B: Il doit suivre un cours obligatoire d'éducation sur l'alcool et les drogues
    C: Il doit acheter un nouveau véhicule
    D: Il doit repasser uniquement l'examen de la vue
  answer: B
  explanation: Les conducteurs reconnus coupables d'infractions liées à l'alcool au
    Nouveau-Brunswick doivent suivre un cours obligatoire d'éducation sur l'alcool
    et les drogues dans le cadre du processus de rétablissement du permis.
- id: 138
  category: alcohol_drugs_health
  question: Si un conducteur est pris avec un taux d'alcoolémie (BAC) de 0,08 % ou
    plus pour la première fois, pendant combien de temps son véhicule sera-t-il mis
    en fourrière selon les lois administratives du Nouveau-Brunswick ?
  choices:
    A: 3 jours
    B: 7 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: Pour un taux d'alcoolémie de 0,08 % ou plus (ou un refus de fournir
    un échantillon), le véhicule fait l'objet d'une mise en fourrière immédiate de
    30 jours pour une première infraction.
- id: 139
  category: alcohol_drugs_health
  question: Au Nouveau-Brunswick, qu'arrive-t-il immédiatement au permis de conduire
    d'un conducteur s'il est pris à conduire avec un taux d'alcoolémie (BAC) supérieur
    à 0,08 % ?
  choices:
    A: Il est suspendu pendant 24 heures
    B: Il est suspendu pendant 7 jours
    C: Il est suspendu pendant 90 jours
    D: Rien ne se passe avant la date d'audience au tribunal
  answer: C
  explanation: Le Nouveau-Brunswick impose une suspension administrative immédiate
    du permis de conduire (ADLS) de 90 jours à tout conducteur pris avec un taux d'alcoolémie
    supérieur à 0,08 % ou qui refuse l'alcootest.
- id: 140
  category: alcohol_drugs_health
  question: Lequel des facteurs suivants n'affecte PAS le taux d'alcoolémie (BAC)
    d'une personne ?
  choices:
    A: Le poids corporel
    B: 'Le type d''alcool (ex. : bière vs spiritueux) si la teneur en alcool est la
      même'
    C: La rapidité avec laquelle l'alcool a été consommé
    D: La condition physique ou la masse musculaire de la personne
  answer: B
  explanation: Le taux d'alcoolémie est déterminé par la quantité d'alcool consommée,
    le poids corporel, le sexe et le temps. Une consommation standard de bière, de
    vin ou de spiritueux contient la même quantité d'alcool et affecte le taux d'alcoolémie
    de la même manière.
- id: 141
  category: alcohol_drugs_health
