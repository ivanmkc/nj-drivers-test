- id: 160
  category: sharing_the_road
  question: 'Lorsqu''un véhicule d''urgence (ambulance, camion de pompiers ou voiture
    de police) s''approche de vous par l''avant ou par l''arrière avec sa sirène et
    ses gyrophares allumés, vous devez :'
  choices:
    A: Accélérer pour rester devant lui
    B: Se ranger sur le bord droit de la chaussée et s'arrêter
    C: S'arrêter exactement là où vous êtes dans la voie
    D: Se ranger sur le bord gauche de la chaussée et s'arrêter
  answer: B
  explanation: Les conducteurs doivent immédiatement se ranger sur le bord droit ou
    la bordure de la route, à l'écart de toute intersection, et s'arrêter jusqu'à
    ce que le véhicule d'urgence soit passé.
- id: 161
  category: sharing_the_road
  question: 'Les gros camions commerciaux ont des angles morts où le conducteur ne
    peut pas voir les autres véhicules. Ces zones sont communément appelées :'
  choices:
    A: Zones de sécurité
    B: Zones de danger (No-Zones)
    C: Zones tampons
    D: Zones de dégagement
  answer: B
  explanation: La « Zone de danger » (No-Zone) désigne les angles morts importants
    autour d'un camion (avant, arrière et côtés) où les voitures disparaissent de
    la vue du conducteur du camion.
- id: 162
  category: sharing_the_road
  question: 'Au Nouveau-Brunswick, si vous suivez un gros camion et que vous ne pouvez
    pas voir les rétroviseurs latéraux du conducteur du camion, vous êtes :'
  choices:
    A: Dans une bonne position pour dépasser
    B: En train de suivre de trop près (dans l'angle mort du camion)
    C: À l'abri des turbulences du vent
    D: Tenu d'allumer vos feux de route
  answer: B
  explanation: 'Une règle générale pour le partage de la route avec les camions est
    la suivante : si vous ne voyez pas les rétroviseurs du conducteur du camion, celui-ci
    ne peut pas vous voir.'
- id: 163
  category: sharing_the_road
  question: 'Lorsqu''une bicyclette circule sur une chaussée du Nouveau-Brunswick
    la nuit, la loi exige qu''elle soit munie de :'
  choices:
    A: Un phare blanc à l'avant et un feu rouge ou un réflecteur à l'arrière
    B: Un phare jaune à l'avant et un feu blanc à l'arrière
    C: Ruban réfléchissant sur les pédales uniquement
    D: Un feu bleu clignotant sur le guidon
  answer: A
  explanation: Pour la conduite de nuit, la loi du Nouveau-Brunswick exige que les
    bicyclettes soient équipées d'un phare avant émettant une lumière blanche et d'un
    réflecteur ou d'un feu rouge à l'arrière.
- id: 164
  category: sharing_the_road
  question: À une intersection où un piéton traverse dans un passage pour piétons
    non marqué, qui a la priorité au Nouveau-Brunswick ?
  choices:
    A: L'automobiliste, parce que le passage n'est pas marqué
    B: Le piéton
    C: La personne qui est arrivée à l'intersection en premier
    D: L'automobiliste, mais seulement s'il klaxonne d'abord
  answer: B
  explanation: Au Nouveau-Brunswick, les piétons ont la priorité à toutes les intersections,
    que le passage pour piétons soit marqué ou non.
- id: 165
  category: sharing_the_road
  question: Pourquoi devriez-vous être particulièrement prudent lorsque vous tournez
    à gauche devant une motocyclette qui arrive en sens inverse ?
  choices:
    A: Les motocyclettes sont légalement autorisées à faire des excès de vitesse dans
      les intersections
    B: La taille réduite de la motocyclette rend plus difficile l'évaluation de sa
      vitesse et de sa distance
    C: Les motocyclettes ont toujours la priorité sur les voitures
    D: Les motocyclettes n'ont pas de freins sur la roue avant
  answer: B
  explanation: En raison de leur profil plus petit, il est souvent difficile pour
    les conducteurs d'évaluer avec précision la vitesse et la distance d'une motocyclette
    qui approche, ce qui entraîne de nombreuses collisions lors de virages à gauche.
- id: 166
  category: sharing_the_road
  question: Au Nouveau-Brunswick, qu'indique un véhicule muni d'un panneau « D » ou
    d'un panneau « Long Load » (chargement long) précédé d'un véhicule d'escorte ?
  choices:
    A: Un conducteur débutant conduit le véhicule
    B: Le véhicule transporte un produit chimique dangereux
    C: Le véhicule est un chargement surdimensionné ou hors normes
    D: Le véhicule est un camion d'entretien appartenant au gouvernement
  answer: C
  explanation: Un panneau « D » (chargement surdimensionné) indique que le véhicule
    est plus large, plus long ou plus lourd que les limites standard. Ces véhicules
    sont souvent accompagnés de véhicules d'escorte munis de feux clignotants pour
    avertir les autres automobilistes.
- id: 167
  category: sharing_the_road
  question: À l'approche d'un autobus scolaire arrêté avec ses feux rouges clignotants
    et son bras d'arrêt déployé sur une route qui n'est PAS divisée par un terre-plein
    central, qui doit s'arrêter ?
  choices:
    A: Uniquement les conducteurs qui suivent l'autobus
    B: Uniquement les conducteurs arrivant de l'avant
    C: Les conducteurs des deux directions
    D: Personne, s'il y a plus de deux voies
  answer: C
  explanation: Au Nouveau-Brunswick, sur les routes non divisées, la circulation dans
    les deux sens doit s'arrêter pour un autobus scolaire dont les feux rouges clignotent.
    Vous devez rester arrêté jusqu'à ce que les feux cessent de clignoter.
- id: 168
  category: sharing_the_road
  question: Selon la loi du Nouveau-Brunswick sur l'obligation de ralentir et de changer
    de voie (Move Over), que devez-vous faire à l'approche d'un véhicule d'urgence
    arrêté avec ses feux clignotants sur une route à plusieurs voies ?
  choices:
    A: Maintenir votre vitesse mais klaxonner
    B: S'arrêter immédiatement dans votre voie
    C: Ralentir et changer pour la voie de gauche si cela peut se faire en toute sécurité
    D: Accélérer pour dépasser le véhicule le plus rapidement possible
  answer: C
  explanation: La loi du Nouveau-Brunswick exige que les conducteurs ralentissent
    et, s'il y a deux voies ou plus circulant dans la même direction, qu'ils changent
    de voie pour laisser un espace tampon aux véhicules d'urgence et de service arrêtés.
- id: 169
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire est arrêté avec ses feux rouges clignotants
    sur une route divisée par un terre-plein central, quels conducteurs sont tenus
    de s'arrêter ?
  choices:
    A: Les conducteurs dans les deux sens
    B: Uniquement les conducteurs arrivant de l'avant
    C: Uniquement les conducteurs qui suivent l'autobus
    D: Aucun conducteur n'est tenu de s'arrêter sur les routes divisées
  answer: C
  explanation: Au Nouveau-Brunswick, si une route est divisée par un terre-plein central,
    seule la circulation suivant l'autobus est tenue de s'arrêter lorsque les feux
    rouges clignotent.
- id: 170
  category: sharing_the_road
  question: Au Nouveau-Brunswick, combien de points d'inaptitude sont ajoutés à votre
    permis pour avoir omis de s'arrêter pour un autobus scolaire dont les feux rouges
    clignotent ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 9 points
  answer: C
  explanation: L'omission de s'arrêter pour un autobus scolaire est une infraction
    grave au Nouveau-Brunswick et entraîne l'ajout de 6 points d'inaptitude au dossier
    du conducteur.
- id: 171
  category: sharing_the_road
  question: Les gros camions commerciaux ont des « zones de danger » (No-Zones). De
    quoi s'agit-il ?
  choices:
    A: Zones où les camions ne sont pas autorisés à circuler
    B: Angles morts où le conducteur du camion ne peut pas vous voir
    C: Voies réservées exclusivement aux camions
    D: Zones de vitesse limitée pour les véhicules lourds
  answer: B
  explanation: Les « zones de danger » sont de grands angles morts autour d'un camion
    (à l'avant, à l'arrière et sur les côtés) où la visibilité du conducteur est limitée
    et où les accidents sont plus susceptibles de se produire.
- id: 172
  category: sharing_the_road
  question: Lorsque vous suivez une motocyclette, pourquoi devriez-vous maintenir
    une distance de sécurité plus grande que lorsque vous suivez une voiture ?
  choices:
    A: Les motos s'arrêtent plus rapidement que les voitures
    B: Les motos sont plus légères et peuvent être déportées par le vent
    C: Les motocyclistes rétrogradent souvent au lieu de freiner, vous ne verrez donc
      pas de feux de freinage
    D: Toutes ces réponses
  answer: D
  explanation: Les motos peuvent s'arrêter très rapidement, sont sensibles au vent
    et aux conditions routières, et peuvent ralentir sans activer les feux de freinage,
    ce qui nécessite une distance de sécurité supplémentaire pour la sécurité.
- id: 173
  category: sharing_the_road
  question: Au Nouveau-Brunswick, si vous tournez à droite à une intersection et qu'un
    cycliste se trouve à votre droite, que devez-vous faire ?
  choices:
    A: Accélérer pour tourner avant que le cycliste n'atteigne l'intersection
    B: Klaxonner pour avertir le cycliste de s'arrêter
    C: Céder le passage au cycliste et le laisser dégager l'intersection avant de
      tourner
    D: Tourner quand même, car les cyclistes doivent céder le passage aux voitures
      tournant à droite
  answer: C
  explanation: Les conducteurs doivent céder le passage aux cyclistes lors d'un virage.
    Couper la route à un cycliste en tournant à droite (le « crochet à droite ») est
    une cause fréquente d'accidents.
- id: 174
  category: sharing_the_road
  question: Que signifie le panneau de véhicule lent (un triangle orange avec une
    bordure rouge) concernant la vitesse d'un véhicule ?
  choices:
    A: Il ne peut pas circuler à plus de 60 km/h
    B: Il ne peut pas circuler à plus de 40 km/h
    C: C'est un véhicule de construction
    D: Il transporte des matières dangereuses
  answer: B
  explanation: Le panneau de véhicule lent est obligatoire sur les véhicules conçus
    pour circuler à des vitesses de 40 km/h ou moins.
- id: 175
  category: sharing_the_road
  question: Lorsqu'un piéton utilise une canne blanche ou un chien-guide à un passage
    pour piétons, qu'est-ce que cela indique au conducteur ?
  choices:
    A: Le piéton est une personne âgée
    B: Le piéton est malvoyant et a la priorité
    C: Le piéton entraîne un chien
    D: Le conducteur doit klaxonner pour lui signaler la présence d'une voiture
  answer: B
  explanation: Une canne blanche ou un chien-guide indique que le piéton est aveugle
    ou malvoyant. Les conducteurs doivent faire preuve d'une prudence extrême et céder
    le passage.
- id: 176
  category: sharing_the_road
  question: Pourquoi les gros camions font-ils souvent un large écart vers la gauche
    avant de tourner à droite ?
  choices:
    A: Pour vérifier la circulation dans la voie de gauche
    B: Parce que leurs roues arrière suivent une trajectoire plus courte que les roues
      avant
    C: Pour signaler aux autres conducteurs de rester en arrière
    D: Pour éviter de heurter les panneaux de signalisation en hauteur
  answer: B
  explanation: Les gros véhicules présentent une caractéristique de « déport » où
    les roues arrière suivent une trajectoire plus courte que les roues avant, ce
    qui les oblige à s'écarter largement pour ne pas heurter le trottoir.
- id: 177
  category: sharing_the_road
  question: Au Nouveau-Brunswick, quand êtes-vous autorisé à dépasser un vélo dans
    la même voie ?
  choices:
    A: Seulement si la voie est assez large pour laisser un espace libre de 1 mètre
    B: En tout temps, tant que vous ne les heurtez pas
    C: Seulement si le cycliste vous fait signe de passer
    D: Jamais ; vous devez toujours changer de voie pour dépasser
  answer: A
  explanation: En vertu de la loi Ellen, vous devez laisser un espace libre de 1 mètre.
    Si la voie est trop étroite pour respecter cette distance, vous devez passer dans
    l'autre voie pour dépasser en toute sécurité.
- id: 178
  category: sharing_the_road
  question: Si vous conduisez et qu'une personne mène un cheval ou monte un cheval
    sur l'accotement de la route, que devez-vous faire ?
  choices:
    A: Klaxonner pour lui faire savoir que vous dépassez
    B: Accélérer pour les dépasser rapidement
    C: Ralentir et dépasser avec prudence, en évitant les bruits forts
    D: S'arrêter et attendre que le cheval quitte la route
  answer: C
  explanation: Les chevaux sont imprévisibles et peuvent être facilement effrayés
    par des bruits forts ou des véhicules circulant rapidement. Les conducteurs doivent
    ralentir et leur laisser beaucoup d'espace.
- id: 179
  category: sharing_the_road
  question: 'Lorsque vous partagez la route avec une motocyclette, vous devez savoir
    qu''elle a droit à :'
  choices:
    A: La moitié gauche de la voie seulement
    B: La moitié droite de la voie seulement
    C: Toute la largeur de la voie
    D: Seulement l'accotement de la route
  answer: C
  explanation: Les motocyclettes ont le droit d'utiliser toute la largeur d'une voie.
    Les conducteurs ne devraient jamais tenter de partager une voie avec une motocyclette.
- id: 180
  category: vehicle_information
  question: Quelle est la profondeur minimale légale de la bande de roulement des
    pneus pour un véhicule de tourisme au Nouveau-Brunswick ?
  choices:
    A: 1,0 millimètre
    B: 1,6 millimètre
    C: 2,5 millimètres
    D: 3,2 millimètres
  answer: B
  explanation: Au Nouveau-Brunswick, les pneus sont considérés comme dangereux si
    la profondeur de la bande de roulement est inférieure à 1,6 millimètre (2/32 de
    pouce).
- id: 181
  category: vehicle_information
  question: 'Tout véhicule à moteur au Nouveau-Brunswick doit être muni d''un klaxon
    pouvant être entendu à une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: La Loi sur les véhicules à moteur du Nouveau-Brunswick exige qu'un
    klaxon soit audible dans des conditions normales à une distance d'au moins 60
    mètres.
- id: 182
  category: vehicle_information
  question: Selon la loi du Nouveau-Brunswick, quelle est l'exigence concernant les
    rétroviseurs si votre rétroviseur intérieur est obstrué par une remorque ou un
    chargement ?
  choices:
    A: Vous devez retirer l'obstruction immédiatement.
    B: Vous devez avoir un rétroviseur extérieur du côté conducteur uniquement.
    C: Vous devez avoir un rétroviseur extérieur à gauche et à droite.
    D: Aucun rétroviseur supplémentaire n'est requis si vous utilisez un signaleur.
  answer: C
  explanation: Si la vue depuis le rétroviseur intérieur est obstruée, la loi du Nouveau-Brunswick
    exige que le véhicule soit équipé de rétroviseurs extérieurs sur les côtés gauche
    et droit.
- id: 183
  category: vehicle_information
  question: Laquelle des affirmations suivantes est vraie concernant le teintage des
    vitres d'un véhicule immatriculé au Nouveau-Brunswick ?
  choices:
    A: Le teintage est autorisé sur le pare-brise jusqu'à 50 %.
    B: Aucun teintage après-vente n'est autorisé sur le pare-brise ou les vitres latérales
      avant.
    C: Les vitres latérales avant peuvent être teintées tant que le conducteur est
      visible.
    D: N'importe quelle vitre peut être teintée à condition que cela soit fait par
      un professionnel.
  answer: B
  explanation: Les règlements du Nouveau-Brunswick interdisent l'application de tout
    matériau opaque au soleil ou translucide (teintage après-vente) sur le pare-brise
    ou sur les vitres situées directement à gauche et à droite du conducteur.
- id: 184
  category: vehicle_information
  question: Le frein de service d'un véhicule doit être capable d'arrêter le véhicule
    sur une route sèche, lisse et plane sur une distance de combien de mètres lorsqu'il
    roule à 30 km/h ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 20 mètres
  answer: B
  explanation: La Loi sur les véhicules à moteur du Nouveau-Brunswick précise que
    le frein de service doit pouvoir arrêter le véhicule sur une distance de 10 mètres
    à une vitesse de 30 km/h.
- id: 185
  category: vehicle_information
  question: 'Au Nouveau-Brunswick, la plaque d''immatriculation arrière de votre véhicule
    doit être éclairée par une lumière blanche afin d''être clairement lisible à une
    distance de :'
  choices:
    A: 10 mètres
    B: 15 mètres
    C: 25 mètres
    D: 50 mètres
  answer: B
  explanation: La plaque d'immatriculation arrière doit être éclairée par une lumière
    blanche de sorte que les caractères soient visibles à une distance de 15 mètres
    vers l'arrière.
- id: 186
  category: vehicle_information
  question: Au Nouveau-Brunswick, si un chargement dépasse de plus de combien de mètres
    l'arrière de la carrosserie du véhicule, un drapeau rouge ou un feu rouge doit
    y être fixé ?
  choices:
    A: 0,5 mètre
    B: 1,0 mètre
    C: 1,2 mètre
    D: 2,0 mètres
  answer: C
  explanation: Chaque fois qu'un chargement dépasse de 1,2 mètre (environ 4 pieds)
    ou plus l'arrière d'un véhicule, un drapeau rouge (le jour) ou un feu rouge (la
    nuit) doit être affiché à l'extrémité du chargement.
- id: 187
  category: vehicle_information
  question: Quelle est l'exigence concernant le système d'échappement d'un véhicule
    au Nouveau-Brunswick ?
  choices:
    A: Il doit être assez bruyant pour avertir les piétons.
    B: Il doit être muni d'un silencieux en bon état de fonctionnement pour éviter
      les bruits et la fumée excessifs.
    C: Les dispositifs de dérivation du silencieux (cut-outs) sont autorisés pour
      la conduite sur autoroute.
    D: Les gaz d'échappement peuvent être évacués directement sous l'habitacle.
  answer: B
  explanation: La loi du Nouveau-Brunswick exige que tout véhicule à moteur soit muni
    d'un silencieux en bon état de fonctionnement pour éviter les bruits excessifs
    ou inhabituels et la fumée gênante. Les dispositifs de dérivation du silencieux
    (cut-outs) sont illégaux.
- id: 188
  category: vehicle_information
  question: 'Au Nouveau-Brunswick, les feux de route (pleins phares) doivent permettre
    de voir les personnes et les véhicules à une distance d''au moins :'
  choices:
    A: 60 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: B
  explanation: Les feux de route (faisceau supérieur) des phares d'un véhicule à moteur
    doivent être orientés et d'une intensité telle qu'ils permettent de voir les personnes
    et les véhicules à une distance d'au moins 100 mètres devant.
- id: 189
  category: vehicle_information
  question: Laquelle des affirmations suivantes est une exigence pour les essuie-glaces
    au Nouveau-Brunswick ?
  choices:
    A: Ils ne sont requis que si le véhicule est utilisé en hiver.
    B: Ils doivent être actionnés manuellement par le conducteur.
    C: Ils doivent être maintenus en bon état de fonctionnement et être capables de
      dégager la pluie, la neige ou toute autre humidité.
    D: Ils doivent être remplacés tous les 6 mois selon la loi.
  answer: C
  explanation: La Loi sur les véhicules à moteur du Nouveau-Brunswick exige que tout
    pare-brise d'un véhicule à moteur soit équipé d'un dispositif pour nettoyer la
    pluie, la neige ou toute autre humidité, lequel doit être maintenu en bon état
    de fonctionnement.
- id: 190
  category: vehicle_information
  question: 'Au Nouveau-Brunswick, vous devez passer aux feux de croisement (codes)
    lorsque vous suivez un autre véhicule à une distance de moins de :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Les conducteurs au Nouveau-Brunswick doivent utiliser les feux de croisement
    lorsqu'ils suivent un autre véhicule à moins de 60 mètres pour éviter l'éblouissement
    dans les rétroviseurs du conducteur qui précède.
- id: 191
  category: vehicle_information
  question: Selon le Guide du conducteur du Nouveau-Brunswick, à quel moment les phares
    d'un véhicule doivent-ils être allumés ?
  choices:
    A: Du coucher au lever du soleil
    B: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    C: D'une demi-heure après le coucher du soleil à une demi-heure avant le lever
      du soleil
    D: Uniquement lorsque la visibilité est inférieure à 200 mètres
  answer: C
  explanation: La loi du Nouveau-Brunswick exige que les phares soient allumés d'une
    demi-heure après le coucher du soleil à une demi-heure avant le lever du soleil,
    ou chaque fois que la visibilité est réduite à 150 mètres ou moins.
- id: 192
  category: vehicle_information
  question: 'Au Nouveau-Brunswick, un panneau « Véhicule lent » doit être affiché
    à l''arrière de tout véhicule conçu pour circuler à une vitesse inférieure à :'
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: B
  explanation: Les véhicules conçus pour circuler à des vitesses inférieures à 40
    km/h doivent afficher un panneau de véhicule lent (un triangle orange avec une
    bordure rouge) lorsqu'ils circulent sur les voies publiques.
- id: 193
  category: vehicle_information
  question: Combien de rétroviseurs sont requis sur un véhicule de tourisme au Nouveau-Brunswick
    si le rétroviseur intérieur est obstrué ?
  choices:
    A: Un seul rétroviseur du côté conducteur
    B: Un seul rétroviseur du côté passager
    C: Deux rétroviseurs extérieurs (un de chaque côté)
    D: Aucun rétroviseur n'est requis si le conducteur utilise un signaleur
  answer: C
  explanation: Si la vue depuis le rétroviseur intérieur est obstruée, la loi du Nouveau-Brunswick
    exige que le véhicule soit équipé d'un rétroviseur extérieur gauche et d'un rétroviseur
    extérieur droit.
- id: 194
  category: vehicle_information
  question: Au Nouveau-Brunswick, quelle est l'exigence relative au frein d'urgence
    ou de stationnement d'un véhicule à moteur ?
  choices:
    A: Il doit seulement fonctionner sur un terrain plat
    B: Il doit être capable de maintenir le véhicule sur n'importe quelle pente où
      il circule
    C: Il n'est requis que pour les véhicules à transmission manuelle
    D: Il doit être capable d'arrêter le véhicule à partir de 50 km/h
  answer: B
  explanation: Le frein de stationnement doit être adéquat pour maintenir le véhicule
    sur n'importe quelle pente sur laquelle il est utilisé, quelle que soit la charge.
- id: 195
  category: vehicle_information
  question: Quelle est la hauteur maximale autorisée pour un véhicule, y compris son
    chargement, au Nouveau-Brunswick sans permis spécial ?
  choices:
    A: 3,5 mètres
    B: 4,15 mètres
    C: 4,5 mètres
    D: 5,0 mètres
  answer: B
  explanation: Au Nouveau-Brunswick, la hauteur maximale d'un véhicule et de son chargement
    est de 4,15 mètres. Tout ce qui dépasse cette limite nécessite un permis spécial
    pour dimensions excédentaires.
- id: 196
  category: vehicle_information
  question: Concernant les systèmes d'échappement des véhicules au Nouveau-Brunswick,
    laquelle des situations suivantes est illégale ?
  choices:
    A: Utiliser un silencieux plus silencieux que l'original
    B: Utiliser un dispositif de dérivation (cut-out) ou de contournement du silencieux
    C: Remplacer un silencieux rouillé par une pièce d'origine (OEM)
    D: Avoir un tuyau d'échappement qui sort à l'arrière
  answer: B
  explanation: La Loi sur les véhicules à moteur du Nouveau-Brunswick interdit l'utilisation
    de dispositifs de dérivation (cut-outs), de contournements ou de dispositifs similaires
    qui augmentent le bruit ou permettent à la fumée de s'échapper sans passer par
    un silencieux.
- id: 197
  category: vehicle_information
  question: Selon les règlements récents du Nouveau-Brunswick, à quelle fréquence
    un nouveau véhicule de tourisme (de moins de 2 ans) doit-il subir une inspection
    de véhicule à moteur ?
  choices:
    A: Tous les 6 mois
    B: Chaque année
    C: Tous les 2 ans
    D: Uniquement lors de la vente du véhicule
  answer: C
  explanation: Le Nouveau-Brunswick a mis à jour ses règlements de sorte que la plupart
    des véhicules de tourisme privés nécessitent une inspection de véhicule à moteur
    (MVI) tous les deux ans.
- id: 198
  category: signs_and_signals
  question: Au Nouveau-Brunswick, quel est le signal manuel correct pour indiquer
    un virage à droite ?
  choices:
    A: Le bras gauche tendu horizontalement par la fenêtre
    B: Le bras gauche sorti et dirigé vers le bas
    C: Le bras gauche sorti et dirigé vers le haut
    D: Le bras droit tendu horizontalement par la fenêtre
  answer: C
  explanation: Selon le Guide du conducteur du Nouveau-Brunswick, un virage à droite
    est signalé en sortant le bras gauche par la fenêtre et en le dirigeant vers le
    haut.
- id: 199
  category: signs_and_signals
  question: En approchant d'une intersection avec un feu rouge clignotant au Nouveau-Brunswick,
    que devez-vous faire ?
  choices:
    A: Ralentir et avancer avec prudence
    B: S'arrêter complètement et ne repartir que lorsqu'il est sécuritaire de le faire
    C: S'arrêter uniquement s'il y a de la circulation transversale
    D: Céder le passage à la circulation venant de la droite mais ne pas s'arrêter
  answer: B
  explanation: Un feu rouge clignotant au Nouveau-Brunswick a la même signification
    qu'un panneau d'arrêt ; vous devez marquer un arrêt complet et céder le passage
    aux autres véhicules et aux piétons.
- id: 200
  category: signs_and_signals
  question: Que signifie un feu vert clignotant sur une route du Nouveau-Brunswick
    ?
  choices:
    A: Le signal est actionné par les piétons
    B: Vous avez un virage à gauche protégé
    C: L'intersection est en travaux
    D: Des véhicules d'urgence approchent
  answer: A
  explanation: Au Nouveau-Brunswick, un feu vert clignotant indique que le signal
    de circulation est actionné par les piétons. Les conducteurs doivent être prêts
    à ce que le feu change si un piéton appuie sur le bouton.
- id: 201
  category: signs_and_signals
  question: Sur une route du Nouveau-Brunswick, que signifient les lignes jaunes discontinues
    (pointillées) au centre de la chaussée ?
  choices:
    A: Le dépassement est interdit dans les deux sens
    B: Le dépassement est autorisé dans les deux sens si les conditions sont sécuritaires
    C: La route est à sens unique seulement
    D: Vous approchez d'une zone de construction
  answer: B
  explanation: Les lignes jaunes discontinues indiquent que la circulation se fait
    dans des directions opposées et que le dépassement est autorisé lorsqu'il peut
    être effectué en toute sécurité.
- id: 202
  category: signs_and_signals
  question: Quelle est la signification d'un feu jaune fixe à une intersection au
    Nouveau-Brunswick ?
  choices:
    A: Accélérer pour dégager l'intersection avant le feu rouge
    B: S'arrêter avant d'entrer dans l'intersection, à moins de ne pas pouvoir le
      faire en toute sécurité
    C: Le feu est sur le point de passer au vert
    D: Céder le passage à tous les piétons mais continuer à conduire
  answer: B
  explanation: Un feu jaune fixe signifie que le signal est sur le point de passer
    au rouge. Les conducteurs doivent s'arrêter avant le passage pour piétons ou l'intersection,
    à moins d'être si près qu'un arrêt ne peut être effectué en toute sécurité.
- id: 203
  category: signs_and_signals
  question: Quelle forme est utilisée spécifiquement pour les panneaux d'avertissement
    de « zone scolaire » ou de « passage pour écoliers » au Nouveau-Brunswick ?
  choices:
    A: Losange
    B: Octogone
    C: Pentagone (cinq côtés)
    D: Triangle inversé
  answer: C
  explanation: Au Nouveau-Brunswick, les panneaux de zone scolaire et de passage pour
    écoliers sont en forme de pentagone et sont généralement de couleur jaune-vert
    fluorescent.
- id: 204
  category: signs_and_signals
  question: Au Nouveau-Brunswick, que signifie une ligne blanche continue peinte sur
    la chaussée entre deux voies de circulation circulant dans la même direction ?
  choices:
    A: Le changement de voie est encouragé
    B: Le changement de voie est déconseillé ou interdit
    C: La voie est réservée uniquement aux véhicules d'urgence
    D: La route est sur le point de se terminer
  answer: B
  explanation: Une ligne blanche continue entre des voies circulant dans la même direction
    indique que les changements de voie sont déconseillés et peuvent être illégaux
    dans certaines zones à haut risque comme les tunnels ou à l'approche des intersections.
- id: 205
  category: signs_and_signals
  question: Que signifie un feu jaune (ambre) clignotant à une intersection au Nouveau-Brunswick
    ?
  choices:
    A: S'arrêter et attendre que le feu passe au vert
    B: Le feu est en panne ; traitez-le comme un arrêt à quatre sens
    C: Ralentir et avancer avec prudence
    D: Accélérer pour éviter une collision
  answer: C
  explanation: Un feu jaune clignotant est un avertissement de ralentir et d'être
    très prudent en entrant dans l'intersection.
- id: 206
  category: signs_and_signals
  question: Quelle est la couleur standard des panneaux d'avertissement de construction
    et d'entretien au Nouveau-Brunswick ?
  choices:
    A: Rouge
    B: Jaune
    C: Orange
    D: Bleu
  answer: C
  explanation: Les panneaux de construction et d'entretien au Nouveau-Brunswick sont
    orange avec des lettres ou des symboles noirs pour alerter les conducteurs des
    conditions routières temporaires.
- id: 207
  category: signs_and_signals
  question: 'Un symbole de losange blanc peint sur une voie au Nouveau-Brunswick indique
    :'
  choices:
    A: Une voie de dépassement à grande vitesse
    B: Une voie réservée à certains véhicules comme les autobus ou le covoiturage
    C: Un passage pour piétons à venir
    D: Une voie qui se termine dans 500 mètres
  answer: B
  explanation: Le symbole du losange marque une voie réservée. Des panneaux à proximité
    préciseront quels véhicules (par exemple, autobus, taxis ou véhicules multioccupants)
    sont autorisés à l'utiliser.
- id: 208
  category: signs_and_signals
  question: Lorsqu'un signal de priorité au transport en commun affiche une barre
    blanche verticale fixe au-dessus d'un feu de circulation normal, qu'est-ce que
    cela signifie ?
  choices:
    A: Tous les véhicules doivent s'arrêter
    B: Seuls les autobus de transport en commun peuvent circuler
    C: Les piétons ont la priorité
    D: Des véhicules d'urgence passent
  answer: B
  explanation: Une barre blanche verticale est un signal de priorité au transport
    en commun qui permet aux autobus de transport en commun de traverser l'intersection
    alors que les autres véhicules font face à un feu rouge.
- id: 209
  category: signs_and_signals
  question: Au Nouveau-Brunswick, quel signal manuel devez-vous utiliser pour indiquer
    que vous vous arrêtez ou que vous ralentissez soudainement ?
  choices:
    A: Bras gauche sorti et vers le haut
    B: Bras gauche tendu horizontalement
    C: Bras gauche sorti et vers le bas
    D: Agiter la main gauche d'avant en arrière
  answer: C
  explanation: Pour signaler un arrêt ou une diminution de vitesse, le conducteur
    doit sortir son bras gauche par la fenêtre et le pointer vers le bas.
- id: 210
  category: signs_and_signals
  question: À quoi ressemble un panneau « Entrée interdite » au Nouveau-Brunswick
    ?
  choices:
    A: Un carré blanc avec un cercle rouge et une barre horizontale blanche au centre
    B: Un octogone rouge avec des lettres blanches
    C: Un losange jaune avec une flèche noire
    D: Un rectangle blanc avec une barre oblique rouge sur une flèche noire
  answer: A
  explanation: Le panneau « Entrée interdite » est un panneau de réglementation composé
    d'un carré blanc avec un cercle rouge et une barre blanche horizontale.
- id: 211
  category: signs_and_signals
  question: Si vous êtes à une intersection et que le signal pour piétons affiche
    un message « Ne pas marcher » clignotant (ou une main orange), que devez-vous
    faire en tant que conducteur ?
  choices:
    A: Klaxonner pour avertir les piétons de libérer la chaussée
    B: Vous préparer à ce que le feu de circulation passe bientôt au jaune
    C: Tourner immédiatement à droite avant que le feu ne change
    D: S'arrêter et attendre que le signal redevienne vert
  answer: B
  explanation: Un signal « Ne pas marcher » clignotant indique que la phase piétonne
    se termine, ce qui signifie généralement que le feu de circulation pour les véhicules
    passera bientôt au jaune.
- id: 212
  category: signs_and_signals
  question: Quelle est la signification d'une ligne jaune continue de votre côté d'une
    ligne centrale jaune discontinue ?
  choices:
    A: Vous pouvez dépasser s'il est sécuritaire de le faire
    B: Vous êtes dans une zone à sens unique
    C: Le dépassement est interdit à partir de votre voie
    D: Vous devez tourner à gauche à la prochaine intersection
  answer: C
  explanation: Une ligne jaune continue de votre côté de la ligne centrale signifie
    que le dépassement est interdit pour les véhicules circulant dans votre voie.
- id: 213
  category: signs_and_signals
  question: Au Nouveau-Brunswick, lorsqu'un conducteur tend le bras gauche horizontalement
    par la fenêtre, qu'indique ce signal manuel ?
  choices:
    A: Le conducteur ralentit ou s'arrête
    B: Le conducteur a l'intention de tourner à droite
    C: Le conducteur a l'intention de tourner à gauche
    D: Le conducteur vous fait signe de passer
  answer: C
  explanation: Selon le Guide du conducteur du Nouveau-Brunswick, un bras gauche tendu
    horizontalement indique un virage à gauche.
- id: 214
  category: signs_and_signals
  question: Au Nouveau-Brunswick, qu'indiquent les lignes blanches discontinues sur
    la chaussée ?
  choices:
    A: La circulation se fait dans des directions opposées
    B: La circulation se fait dans la même direction et le changement de voie est
      autorisé
    C: Le bord de la route
    D: Une zone de passage pour piétons
  answer: B
  explanation: Les lignes blanches discontinues séparent les voies de circulation
    se déplaçant dans la même direction où les changements de voie sont autorisés.
- id: 215
  category: signs_and_signals
  question: Que devez-vous faire lorsque vous voyez un panneau « Cédez le passage
    » au Nouveau-Brunswick ?
  choices:
    A: Toujours marquer un arrêt complet
    B: Ralentir et céder le passage à la circulation dans l'intersection ou sur la
      route de raccordement
    C: Accélérer pour s'insérer avant l'arrivée d'autres véhicules
    D: L'ignorer si aucune autre voiture n'est visible
  answer: B
  explanation: Un panneau de céder le passage signifie que vous devez ralentir et,
    si nécessaire, vous arrêter pour céder le passage à tout véhicule ou piéton se
    trouvant dans l'intersection.
- id: 216
  category: signs_and_signals
  question: Au Nouveau-Brunswick, quelle est la limite de vitesse par défaut dans
    une zone scolaire où aucune limite de vitesse n'est affichée ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: Selon la Loi sur les véhicules à moteur du Nouveau-Brunswick, la limite
    de vitesse est de 50 km/h dans tout quartier commercial ou résidentiel et dans
    les parcs publics, y compris les zones scolaires, à moins d'indication contraire.
- id: 217
  category: signs_and_signals
  question: Si vous êtes à une intersection avec un feu rouge et une flèche verte
    pointant vers la droite, qu'êtes-vous autorisé à faire ?
  choices:
    A: S'arrêter et attendre que le feu principal passe au vert
    B: Tourner à droite sans s'arrêter
    C: Tourner à droite seulement après avoir marqué un arrêt complet et cédé le passage
      aux piétons et aux autres véhicules
    D: Continuer dans n'importe quelle direction
  answer: C
  explanation: Une flèche verte affichée avec un feu rouge signifie que vous pouvez
    vous engager prudemment dans l'intersection uniquement pour effectuer le mouvement
    indiqué par la flèche, après avoir cédé le passage aux piétons et aux autres véhicules.
