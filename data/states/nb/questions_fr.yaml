  choices:
    A: 3 mois
    B: 6 mois
    C: 12 mois
    D: 24 mois
  answer: C
  explanation: Une première condamnation en vertu du Code criminel pour conduite avec
    facultés affaiblies entraîne une suspension obligatoire du permis de conduire
