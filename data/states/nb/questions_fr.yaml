  explanation: La loi du Nouveau-Brunswick permet la mise en fourrière immédiate d'un
    véhicule pendant 7 jours si le conducteur est pris en train de faire de la conduite
    extravagante ou une course de rue.
- id: 146
  category: penalties_and_points
