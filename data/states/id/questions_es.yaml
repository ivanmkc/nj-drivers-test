questions:
- id: 1
  category: license_system
  question: ¿En Idaho, cuál es la edad mínima en la que una persona puede solicitar
    un Permiso de Instrucción Supervisada (SIP)?
  choices:
    A: 14 años
    B: 14 años y 6 meses
    C: 15 años
    D: 15 años y 6 meses
  answer: B
  explanation: Según el Manual del Conductor de Idaho, una persona debe tener al menos
    14 años y 6 meses de edad para solicitar un Permiso de Instrucción Supervisada
    (SIP).
- id: 2
  category: license_system
  question: Bajo el programa de Licencia de Conducir Graduada (GDL) de Idaho, ¿cuántas
    horas de conducción supervisada debe completar el titular de un permiso antes
    de solicitar una licencia?
  choices:
    A: 30 horas, con 5 por la noche
    B: 40 horas, con 10 por la noche
    C: 50 horas, con 10 por la noche
    D: 60 horas, con 15 por la noche
  answer: C
  explanation: La ley de Idaho exige que los titulares de permisos menores de 17 años
    completen 50 horas de conducción supervisada, de las cuales 10 deben ser por la
    noche.
- id: 3
  category: license_system
  question: Durante los primeros seis meses después de recibir una licencia de conducir
    de Idaho, ¿a cuántos pasajeros menores de 17 años que no sean parientes por consanguinidad,
    matrimonio o adopción está restringido un conductor menor de 17 años?
  choices:
    A: Cero pasajeros
    B: Un pasajero
    C: Dos pasajeros
    D: Tres pasajeros
  answer: B
  explanation: Las leyes de GDL de Idaho establecen que durante los primeros seis
    meses de la licencia, los conductores menores de 17 años están limitados a un
    solo pasajero menor de 17 años que no sea un miembro de la familia.
- id: 4
  category: license_system
  question: ¿En Idaho, cuál es el toque de queda para un conductor menor de 17 años
    a menos que esté acompañado por un conductor con licencia que tenga al menos 21
    años?
  choices:
    A: 10:00 PM a 5:00 AM
    B: 11:00 PM a 6:00 AM
    C: 12:00 AM (medianoche) a 5:00 AM
    D: 1:00 AM a 6:00 AM
  answer: C
  explanation: Los conductores menores de 17 años tienen restringido conducir entre
    las 12:00 AM y las 5:00 AM, a menos que estén acompañados por un conductor con
    licencia de 21 años o más.
- id: 5
  category: license_system
  question: ¿Cuánto tiempo debe una persona menor de 17 años tener un Permiso de Instrucción
    Supervisada (SIP) de Idaho antes de ser elegible para realizar el examen de habilidades?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Idaho exige que los conductores menores de 17 años mantengan
    su permiso durante al menos seis meses antes de poder realizar el examen de habilidades
    de conducción.
- id: 6
  category: license_system
  question: Si se muda a Idaho, ¿cuántos días tiene para solicitar una licencia de
    conducir de Idaho después de convertirse en residente?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Los nuevos residentes de Idaho deben obtener una licencia de conducir
    de Idaho dentro de los 90 días posteriores a establecer su residencia.
- id: 7
  category: license_system
  question: En Idaho, ¿se suspende la licencia de conducir si se acumulan cuántos
    puntos en un período de 12 meses?
  choices:
    A: 8 a 11 puntos
    B: 12 a 17 puntos
    C: 18 a 23 puntos
    D: 24 o más puntos
  answer: B
  explanation: El Departamento de Transporte de Idaho suspenderá los privilegios de
    conducir por 30 días si un conductor acumula de 12 a 17 puntos en cualquier período
    de 12 meses.
- id: 8
  category: license_system
  question: ¿Cuál es el requisito mínimo de visión en al menos un ojo, con o sin lentes
    correctivos, para aprobar el examen de la vista de la licencia de conducir de
    Idaho?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Idaho requiere que los solicitantes tengan una visión de 20/40 o mejor
    en al menos un ojo, con o sin lentes correctivos.
- id: 9
  category: license_system
  question: Si cambia su dirección dentro de Idaho, ¿dentro de cuántos días debe notificar
    al Departamento de Transporte de Idaho (ITD)?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Idaho exige que notifique al ITD sobre un cambio de dirección
    dentro de los 30 días.
- id: 10
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una licencia de conducir Clase
    D de Idaho si ha completado todos los requisitos de GDL?
  choices:
    A: 15 años
    B: 16 años
    C: 17 años
    D: 18 años
  answer: A
  explanation: En Idaho, una persona puede obtener una licencia Clase D a partir de
    los 15 años si ha completado la educación vial y el período de conducción supervisada
    de 6 meses.
- id: 11
  category: license_system
  question: ¿Cuál de los siguientes NO es un requisito para obtener una 'Star Card'
    de Idaho (REAL ID)?
  choices:
    A: Prueba de identidad
    B: Prueba del número de Seguro Social
    C: Prueba de residencia en Idaho
    D: Prueba de un diploma de escuela secundaria
  answer: D
  explanation: Para obtener una Star Card, necesita prueba de identidad, número de
    Seguro Social y residencia. No se requiere un diploma de escuela secundaria para
    obtener una licencia de conducir.
- id: 12
  category: license_system
  question: En Idaho, si usted es menor de 21 años, ¿cuál es el límite de concentración
    de alcohol en sangre (BAC) que resultará en la suspensión de la licencia?
  choices:
    A: 0.01% o más
    B: 0.02% o más
    C: 0.05% o más
    D: 0.08% o más
  answer: B
  explanation: Idaho tiene una ley de 'tolerancia cero' para conductores menores de
    21 años, donde un BAC de 0.02% o más resulta en sanciones legales y la suspensión
    de la licencia.
- id: 13
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    para un vehículo de pasajeros privado en Idaho?
  choices:
    A: 15/30/5
    B: 25/50/15
    C: 50/100/25
    D: 100/300/50
  answer: B
  explanation: La ley de Idaho exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones/muerte de una persona, $50,000 por lesiones/muerte de
    dos o más personas, y $15,000 por daños a la propiedad (25/50/15).
- id: 14
  category: license_system
  question: 'Si es menor de 18 años y desea solicitar un permiso o licencia en Idaho,
    debe presentar una prueba de inscripción o graduación escolar. Esto se conoce
    a menudo como:'
  choices:
    A: El Certificado GDL
    B: El VOC (Verificación de Cumplimiento)
    C: El Formulario de Seguridad Escolar
    D: La Exención de Educación
  answer: B
  explanation: El formulario de Verificación de Cumplimiento (VOC) es obligatorio
    para los solicitantes menores de 18 años para demostrar que cumplen con los requisitos
    de asistencia escolar de Idaho.
- id: 15
  category: license_system
  question: ¿Por cuántos años es válida una licencia de conducir de Idaho si el conductor
    tiene entre 21 y 62 años de edad?
  choices:
    A: 2 o 4 años
    B: 4 u 8 años
    C: 5 o 10 años
    D: Exactamente 6 años
  answer: B
  explanation: Los conductores de entre 21 y 62 años en Idaho tienen la opción de
    renovar su licencia por 4 u 8 años.
- id: 16
  category: license_system
  question: En Idaho, ¿cuántos puntos se añaden a su historial de conducción por una
    condena de 'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Según el Manual del Conductor de Idaho, la Conducción Temeraria es
    una infracción grave que resulta en la adición de 4 puntos al historial del conductor.
- id: 17
  category: license_system
  question: En Idaho, ¿completar un curso aprobado de conducción defensiva puede reducir
    el total de puntos de su historial de conducción en cuántos puntos?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: La ley de Idaho permite a los conductores reducir su total de puntos
    en 3 puntos una vez cada tres años al completar un curso aprobado de conducción
    defensiva.
- id: 18
  category: license_system
  question: Si reprueba el examen de conocimientos para la licencia de conducir de
    Idaho, ¿cuánto tiempo debe esperar antes de ser elegible para volver a tomarlo?
  choices:
    A: 24 horas
    B: 3 días
    C: 7 días
    D: 14 días
  answer: B
  explanation: Si reprueba el examen de conocimientos, debe esperar al menos 3 días
    antes de poder pagar la tarifa y realizar el examen nuevamente.
- id: 19
  category: license_system
  question: Si cambia legalmente su nombre, ¿dentro de cuántos días debe solicitar
    un duplicado de la licencia de Idaho con su nuevo nombre?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Idaho exige que notifique al ITD y obtenga un duplicado de
    la licencia dentro de los 30 días posteriores a un cambio de nombre legal.
- id: 20
  category: license_system
  question: En Idaho, cualquier persona menor de ____ años debe completar con éxito
    un curso aprobado de seguridad en motocicleta para obtener un endoso de motocicleta.
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: Idaho requiere que todos los solicitantes de endoso de motocicleta
    menores de 21 años completen un programa aprobado de seguridad en motocicleta
    Idaho STAR.
- id: 21
  category: license_system
  question: 'Según la ley de "Consentimiento Implícito" de Idaho, si se niega a someterse
    a una prueba química de alcohol o drogas, se le confiscará su licencia de conducir
    y se le impondrá una multa civil de:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Negarse a realizar una prueba de BAC (concentración de alcohol en sangre)
    resulta en la confiscación inmediata de la licencia y una multa civil de $250,
    además de una posible suspensión de un año.
- id: 22
  category: license_system
  question: ¿Con cuántos meses de antelación a su vencimiento se puede renovar una
    licencia de conducir de Idaho?
  choices:
    A: 6 meses
    B: 12 meses
    C: 25 meses
    D: 36 meses
  answer: C
  explanation: Idaho permite a los conductores renovar sus licencias hasta 25 meses
    antes de la fecha de vencimiento.
- id: 23
  category: license_system
  question: 'Al realizar el examen de habilidades de Idaho, el solicitante debe proporcionar
    un vehículo que tenga:'
  choices:
    A: Frenos dobles para el examinador
    B: Una transmisión manual
    C: Comprobante válido de seguro y registro
    D: Un letrero de "Conductor Estudiante" en la parte trasera
  answer: C
  explanation: Los solicitantes deben proporcionar su propio vehículo para el examen
    de habilidades, y este debe estar debidamente asegurado, registrado y en condiciones
    seguras de funcionamiento.
- id: 24
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una Licencia de Conducir Comercial
    (CDL) de Idaho para operación intraestatal (solo dentro de Idaho)?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Si bien la ley federal exige que los conductores tengan 21 años para
    el comercio interestatal, Idaho permite que las personas de 18 años o más soliciten
    una CDL para la conducción intraestatal.
- id: 25
  category: license_system
  question: En Idaho, ¿dónde se indica la información sobre su condición de donante
    de órganos/tejidos?
  choices:
    A: En una tarjeta separada guardada en la billetera
    B: Solo en el reverso de la licencia
    C: En el frente de la licencia
    D: No está impreso en la licencia
  answer: C
  explanation: Si elige ser donante de órganos, se imprimirá la designación "Donor"
    (Donante) en el frente de su licencia de conducir de Idaho.
- id: 26
  category: license_system
  question: ¿Quién es legalmente responsable de cualquier daño causado por un conductor
    menor de 18 años en Idaho si firmó la solicitud para el permiso o licencia del
    menor?
  choices:
    A: Solo el menor
    B: El estado de Idaho
    C: La persona que firmó la solicitud
    D: El distrito escolar del menor
  answer: C
  explanation: La persona que firma la solicitud de un menor (generalmente un padre
    o tutor) asume la responsabilidad legal por la negligencia o mala conducta intencional
    del menor al conducir.
- id: 27
  category: license_system
  question: 'Al solicitar una licencia de conducir de Idaho, debe entregar:'
  choices:
    A: Su certificado de nacimiento
    B: Su tarjeta de Seguro Social
    C: Todas las demás licencias de conducir o tarjetas de identificación emitidas
      por cualquier otro estado
    D: Su diploma de escuela secundaria
  answer: C
  explanation: La ley de Idaho prohíbe tener más de una licencia de conducir o tarjeta
    de identificación válida a la vez; debe entregar las credenciales de otros estados
    al solicitar una licencia de Idaho.
- id: 28
  category: license_system
  question: Si tiene 17 años de edad o más y solicita un permiso de instrucción de
    Idaho, ¿por cuánto tiempo es válido ese permiso?
  choices:
    A: 90 días
    B: 180 días
    C: Un año
    D: Dos años
  answer: B
  explanation: Para los solicitantes de 17 años o más, el permiso de instrucción de
    Idaho es válido por 180 días.
- id: 29
  category: license_system
  question: 'Si su licencia de Idaho es suspendida, puede ser elegible para solicitar
    una licencia "restringida" para conducir hacia y desde lugares específicos como:'
  choices:
    A: Eventos sociales y fiestas
    B: Supermercados y centros comerciales
    C: Trabajo o citas médicas
    D: Destinos de vacaciones
  answer: C
  explanation: El tribunal o el ITD pueden otorgar una licencia restringida (por dificultades)
    para la conducción esencial, como empleo, necesidades médicas o servicios religiosos.
- id: 30
  category: driver_testing
  question: Para aprobar el examen de conocimientos de la licencia de conducir de
    Idaho, ¿cuál es el número mínimo de preguntas que debe responder correctamente
    de un total de 40?
  choices:
    A: '28'
    B: '30'
    C: '34'
    D: '36'
  answer: C
  explanation: El examen de conocimientos de Idaho consta de 40 preguntas. Debe responder
    correctamente al menos 34 (85%) para aprobar.
- id: 31
  category: driver_testing
  question: Al realizar el examen de habilidades (práctico) de Idaho, ¿cuál de los
    siguientes debe proporcionar para el vehículo que está utilizando?
  choices:
    A: Una carta notariada del propietario del vehículo
    B: Comprobante de seguro de responsabilidad civil válido y registro vigente
    C: Un registro de mantenimiento de los últimos 12 meses
    D: Un permiso de operación temporal
  answer: B
  explanation: Para el examen de habilidades, debe proporcionar un vehículo en condiciones
    seguras de funcionamiento con un comprobante válido de seguro de responsabilidad
    civil y una tarjeta de registro vigente.
- id: 32
  category: driver_testing
  question: Si reprueba el examen de habilidades (práctico) de Idaho, ¿cuál es el
    periodo de espera mínimo antes de poder realizarlo de nuevo?
  choices:
    A: 24 horas
    B: 3 días
    C: 7 días
    D: 14 días
  answer: B
  explanation: En Idaho, si reprueba el examen de conocimientos o el examen de habilidades,
    debe esperar al menos tres días (72 horas) antes de ser elegible para volver a
    realizarlo.
- id: 33
  category: driver_testing
  question: Bajo la ley de 'Consentimiento Implícito' (Implied Consent) de Idaho,
    ¿cuál es la sanción por negarse por primera vez a someterse a una prueba de evidencia
    de concentración de alcohol en sangre (BAC)?
  choices:
    A: Una multa de $50 y suspensión de 30 días
    B: Una multa de $100 y suspensión de 90 días
    C: Una multa civil de $250 y la incautación/suspensión de la licencia por un año
    D: Una multa de $500 y revocación permanente
  answer: C
  explanation: La ley de Consentimiento Implícito de Idaho significa que, al conducir
    en Idaho, usted ha aceptado someterse a las pruebas de BAC. La negativa resulta
    en una multa civil de $250 y la suspensión de los privilegios de conducir por
    un año.
- id: 34
  category: driver_testing
  question: En Idaho, ¿cuál es la multa por una primera condena por violar la ley
    de 'Manos Libres' (Hands-Free) (usar un dispositivo móvil mientras conduce)?
  choices:
    A: $25
    B: $75
    C: $150
    D: $300
  answer: B
  explanation: A partir del 1 de julio de 2020, la ley de Idaho exige el uso de dispositivos
    móviles en modo manos libres. Una primera infracción conlleva una multa de $75
    más los costos judiciales.
- id: 35
  category: driver_testing
  question: Para los residentes de Idaho de 63 años o más, ¿por cuántos años es válida
    una licencia de conducir estándar?
  choices:
    A: 1 año
    B: 4 años
    C: 8 años
    D: Indefinidamente
  answer: B
  explanation: Mientras que los conductores de 21 a 62 años pueden elegir entre una
    licencia de 4 u 8 años, aquellos de 63 años o más están limitados a un periodo
    de renovación de licencia de 4 años.
- id: 36
  category: driver_testing
  question: Según la ley de Idaho, ¿un conductor es considerado un 'Infractor Habitual'
    (Habitual Offender) si acumula cuántas condenas de tráfico graves en un periodo
    de tres años?
  choices:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
  answer: B
  explanation: El Código de Idaho 49-326 define a un infractor habitual como alguien
    que tiene tres o más condenas graves (como DUI o conducción temeraria) en un periodo
    de tres años, lo que resulta en una revocación de 3 años.
- id: 37
  category: driver_testing
  question: Durante el examen de habilidades de Idaho, ¿cuál de las siguientes acciones
    resultará en una reprobación automática?
  choices:
    A: No usar una señal de giro una vez
    B: Conducir a 2 mph por encima del límite de velocidad
    C: Realizar una acción peligrosa que obligue a otro conductor a tomar una acción
      evasiva
    D: Ajustar sus espejos mientras está detenido
  answer: C
  explanation: La reprobación automática en el examen de habilidades de Idaho ocurre
    por varias razones, incluyendo una colisión, una violación grave de las leyes
    de tránsito o cualquier acción peligrosa que requiera que el examinador u otro
    conductor intervengan.
- id: 38
  category: driver_testing
  question: ¿Por cuántos días es válido un Permiso de Instrucción de Idaho para un
    solicitante mayor de 17 años?
  choices:
    A: 90 días
    B: 180 días
    C: Un año
    D: Dos años
  answer: B
  explanation: Para personas de 17 años o más, un Permiso de Instrucción de Idaho
    es válido por 180 días.
- id: 39
  category: driver_testing
  question: Para obtener una 'Star Card' de Idaho (REAL ID), ¿cuántos documentos que
    acrediten la residencia en Idaho debe proporcionar?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, si tiene una factura de servicios públicos de Idaho
  answer: B
  explanation: Para cumplir con los requisitos de REAL ID para la Star Card de Idaho,
    los solicitantes deben proporcionar dos documentos separados que acrediten la
    residencia en Idaho (por ejemplo, facturas de servicios públicos, contratos de
    arrendamiento).
- id: 40
  category: driver_testing
  question: ¿Cuántos puntos se agregan a su historial de conducción de Idaho por exceder
    el límite de velocidad de 1 a 15 millas por hora?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: Exceder el límite de velocidad de 1 a 15 mph en Idaho resulta en 3
    puntos. Exceder el límite por 16 mph o más resulta en 4 puntos.
- id: 41
  category: driver_testing
  question: En Idaho, si usted está involucrado en un choque que resulte en lesiones,
    muerte o daños a la propiedad que excedan los ____, debe notificar a la policía
    de inmediato.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: La ley de Idaho exige que notifique a la policía de inmediato si se
    ve involucrado en un choque que resulte en lesiones o muerte, o daños a la propiedad
    de cualquier persona que superen los $1,500.
- id: 42
  category: driver_testing
  question: Para una primera condena por DUI de un conductor mayor de 21 años en Idaho,
    ¿por cuánto tiempo se suspende típicamente la licencia de conducir?
  choices:
    A: 30 a 60 días
    B: 90 a 180 días
    C: Un año
    D: Dos años
  answer: B
  explanation: Una primera infracción por DUI para un adulto en Idaho conlleva una
    suspensión obligatoria de la licencia de 90 a 180 días.
- id: 43
  category: driver_testing
  question: En Idaho, al conducir en un distrito comercial o residencial, ¿con cuántos
    pies de antelación debe señalizar su intención de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Idaho exige que los conductores señalicen al menos 100 pies
    antes de realizar un giro en zonas comerciales o residenciales.
- id: 44
  category: driver_testing
  question: En Idaho, ¿es ilegal estacionarse a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Idaho prohíbe estacionarse a menos de 15 pies de un hidrante
    de incendios.
- id: 45
  category: driver_testing
  question: Bajo la ley 'Idaho Stop', ¿qué deben hacer los ciclistas al acercarse
    a una señal de alto (pare)?
  choices:
    A: Detenerse por completo y esperar a que el tráfico se despeje
    B: Reducir la velocidad y ceder el paso, pero no están obligados a detenerse si
      es seguro continuar
    C: Ignorar la señal de alto por completo
    D: Detenerse solo si hay peatones presentes
  answer: B
  explanation: El Código de Idaho 49-720 permite a los ciclistas tratar las señales
    de alto como señales de ceder el paso, lo que significa que deben reducir la velocidad
    y ceder el paso, pero solo detenerse si es necesario por seguridad.
- id: 46
  category: driver_testing
  question: Bajo la ley 'Idaho Stop', ¿qué debe hacer un ciclista ante una luz roja
    fija?
  choices:
    A: Tratarla como una señal de ceder el paso y continuar sin detenerse
    B: Esperar a que la luz cambie a verde antes de continuar
    C: Detenerse antes de entrar en la intersección, ceder el paso a todo el tráfico
      y luego proceder con precaución
    D: Bajarse de la bicicleta y cruzar caminando por el paso de peatones
  answer: C
  explanation: La ley de Idaho permite a los ciclistas pasar un semáforo en rojo después
    de detenerse por completo y ceder el paso a todo el tráfico en la intersección.
- id: 47
  category: driver_testing
  question: 'En Idaho, se requiere el uso de los faros delanteros cuando la visibilidad
    se reduce a menos de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Idaho exige que los faros estén encendidos desde 30 minutos
    después de la puesta del sol hasta 30 minutos antes de la salida del sol, o siempre
    que la visibilidad sea inferior a 500 pies.
- id: 48
  category: driver_testing
  question: ¿Cuál es el límite de velocidad máximo permitido en las interestatales
    rurales de Idaho para vehículos de pasajeros, donde esté señalizado?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: Aunque muchas interestatales tienen un límite de 75 mph, la ley de
    Idaho permite velocidades de hasta 80 mph en interestatales rurales donde esté
    señalizado.
- id: 49
  category: driver_testing
  question: ¿En cuántos días deben registrar sus vehículos los nuevos residentes de
    Idaho después de establecer su residencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Según el Manual del Conductor de Idaho, los nuevos residentes tienen
    90 días para registrar sus vehículos en el estado.
- id: 50
  category: driver_testing
  question: 'En Idaho, usted NO está obligado a detenerse ante un autobús escolar
    con luces rojas intermitentes si viaja en la dirección opuesta en una carretera
    con:'
  choices:
    A: Dos o más carriles
    B: Tres o más carriles
    C: Cuatro o más carriles
    D: Solo un carril central de giro
  answer: C
  explanation: En una carretera con cuatro o más carriles (al menos dos en cada dirección),
    los conductores que viajan en la dirección opuesta a un autobús escolar no están
    obligados a detenerse.
- id: 51
  category: driver_testing
  question: El examen de conocimientos de Idaho consta de 40 preguntas. ¿Cuál es el
    número máximo de preguntas que puede fallar y aun así aprobar?
  choices:
    A: '4'
    B: '6'
    C: '8'
    D: '10'
  answer: B
  explanation: El examen de conocimientos de Idaho requiere una puntuación del 85%
    para aprobar, lo que significa que debe responder correctamente al menos 34 de
    las 40 preguntas (fallando no más de 6).
- id: 52
  category: driver_responsibility
  question: En Idaho, si usted se ve involucrado en un choque de vehículo motorizado
    que resulte en daños a la propiedad de cualquier persona por un monto superior
    a ______, debe notificar de inmediato a la policía local o al alguacil del condado.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Según el Manual del Conductor de Idaho, cualquier accidente que resulte
    en lesiones, muerte o daños a la propiedad que superen los $1,500 debe informarse
    de inmediato a las autoridades policiales.
- id: 53
  category: driver_responsibility
  question: ¿Cuál es la sanción por una primera condena por conducir sin el seguro
    de responsabilidad civil requerido en Idaho?
  choices:
    A: Una sentencia de cárcel obligatoria de 30 días
    B: Una multa de $75 más las costas procesales y el requisito de presentar una
      prueba de responsabilidad financiera durante un año
    C: Revocación permanente de la licencia de conducir
    D: Una multa de $500 y 5 puntos en el historial de conducción
  answer: B
  explanation: Una primera infracción por falta de seguro en Idaho resulta en una
    multa de $75 más las costas procesales, y el conductor debe presentar una prueba
    de responsabilidad financiera (SR-22) al ITD durante un año.
- id: 54
  category: driver_responsibility
  question: Después de convertirse en residente de Idaho, ¿cuántos días tiene para
    registrar su vehículo ante el Departamento de Transporte de Idaho (ITD)?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Los nuevos residentes de Idaho deben registrar sus vehículos dentro
    de los 90 días posteriores al establecimiento de la residencia.
- id: 55
  category: driver_responsibility
  question: Cuando compra un vehículo a un particular en Idaho, ¿dentro de cuántos
    días debe solicitar un certificado de título?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Idaho exige que el comprador solicite un título dentro de
    los 30 días posteriores a la compra de un vehículo a un particular para evitar
    un cargo por presentación tardía.
- id: 56
  category: driver_responsibility
  question: Si su licencia de conducir de Idaho es suspendida por una condena de "falta
    de seguro", ¿por cuánto tiempo se le requiere normalmente mantener un certificado
    de responsabilidad financiera SR-22?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los conductores condenados por conducir sin seguro generalmente deben
    mantener una presentación de SR-22 durante tres años después de la suspensión.
- id: 57
  category: driver_responsibility
  question: 'La ley de "Contenedor Abierto" (Open Container) de Idaho prohíbe la posesión
    de un recipiente abierto de alcohol en el compartimiento de pasajeros de un vehículo
    motorizado. Esta ley se aplica a:'
  choices:
    A: Solo al conductor
    B: Solo a los pasajeros menores de 21 años
    C: Tanto al conductor como a todos los pasajeros
    D: Solo a los pasajeros en el asiento delantero
  answer: C
  explanation: En Idaho, es ilegal que cualquier persona (conductor o pasajero) posea
    un recipiente abierto de una bebida alcohólica en el compartimiento de pasajeros
    de un vehículo motorizado en una carretera pública.
- id: 58
  category: driver_responsibility
  question: Para los conductores de vehículos motorizados comerciales (CMV) en Idaho,
    ¿cuál es el límite de concentración de alcohol en sangre (BAC) que constituye
    un DUI?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Mientras que el límite para los conductores estándar es de 0.08%, el
    límite de BAC para los operadores de vehículos comerciales en Idaho es de 0.04%.
- id: 59
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por una primera condena por arrojar basura desde
    un vehículo motorizado en las carreteras de Idaho?
  choices:
    A: Hasta $50
    B: Hasta $100
    C: Hasta $180
    D: Hasta $500
  answer: C
  explanation: Arrojar basura es una infracción en Idaho y conlleva una multa máxima
    de hasta $180.
- id: 60
  category: driver_responsibility
  question: 'Según la ley de "Ceder el Paso" (Move Over) de Idaho, al acercarse a
    un vehículo de emergencia estacionado con luces intermitentes en una carretera
    con dos o más carriles en la misma dirección, usted debe:'
  choices:
    A: Detenerse por completo hasta que se le indique que pase
    B: Cambiarse al carril más alejado del vehículo de emergencia si es seguro hacerlo
    C: Mantener la velocidad pero tocar la bocina
    D: Aumentar la velocidad para pasar el área rápidamente
  answer: B
  explanation: La ley de Idaho exige que los conductores se muevan al carril izquierdo
    (o al carril que no esté adyacente al vehículo de emergencia) si es seguro hacerlo,
    o que reduzcan la velocidad significativamente si no es posible cambiar de carril.
- id: 61
  category: driver_responsibility
  question: 'Si choca con un vehículo desatendido en Idaho y no puede localizar al
    propietario, está legalmente obligado a:'
  choices:
    A: Esperar 2 horas a que regrese el propietario
    B: Dejar una nota en un lugar visible con su nombre, dirección e información del
      vehículo
    C: Retirarse si no hay daños visibles
    D: Informar solo si el daño parece ser superior a $5,000
  answer: B
  explanation: La ley de Idaho exige que deje un aviso por escrito con su información
    de contacto y los detalles del vehículo en un lugar visible del vehículo que golpeó
    si no se puede encontrar al propietario.
- id: 62
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan en un historial de conducción de Idaho por
    una condena de 'Conducción Inatenta'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: La conducción inatenta es una infracción de 3 puntos en el estado de
    Idaho.
- id: 63
  category: driver_responsibility
  question: En Idaho, si un oficial de policía lo detiene y no puede presentar un
    comprobante de seguro, ¿cuántos días tiene para presentar el comprobante ante
    el tribunal o el ITD para evitar una condena?
  choices:
    A: 24 horas
    B: 7 días
    C: 10 días
    D: 30 días
  answer: D
  explanation: Aunque debe llevar un comprobante de seguro, si es citado, generalmente
    tiene 30 días para presentar pruebas de que el vehículo estaba asegurado en el
    momento de la detención para que se desestime la citación.
- id: 64
  category: driver_responsibility
  question: Si usted es residente de Idaho y su vehículo está registrado en el estado,
    ¿dónde debe guardarse el certificado de registro?
  choices:
    A: En su residencia principal
    B: En el vehículo o llevado por el conductor
    C: En una caja de seguridad
    D: Pegado a la placa de matrícula trasera
  answer: B
  explanation: La ley de Idaho exige que el certificado de registro (o una copia)
    se lleve en el vehículo o en la persona del conductor en todo momento mientras
    se opera el vehículo.
- id: 65
  category: driver_responsibility
  question: 'Si un conductor de Idaho es condenado por una segunda infracción de conducir
    sin seguro en un plazo de cinco años, la sanción puede incluir hasta seis meses
    de cárcel y una multa de hasta:'
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: Una segunda infracción en un plazo de cinco años es un delito menor,
    punible con una multa de hasta $1,000 y/o hasta seis meses de cárcel.
- id: 66
  category: driver_responsibility
  question: ¿A qué nivel de puntos enviará el Departamento de Transporte de Idaho
    una carta de advertencia a un conductor con respecto a sus puntos acumulados?
  choices:
    A: 4 a 7 puntos
    B: 8 a 11 puntos
    C: 12 a 15 puntos
    D: 18 puntos
  answer: B
  explanation: El Departamento de Transporte de Idaho envía una carta de advertencia
    a los conductores que han acumulado de 8 a 11 puntos en cualquier período de 12
    meses.
- id: 67
  category: driver_responsibility
  question: En Idaho, si acumula de 18 a 23 puntos en un período de 24 meses, ¿por
    cuánto tiempo se suspenderán sus privilegios de conducción?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: C
  explanation: Acumular de 18 a 23 puntos en un período de 24 meses resulta en una
    suspensión de la licencia de 90 días.
- id: 68
  category: driver_responsibility
  question: 'Bajo la ley de Consentimiento Implícito de Idaho, si se niega a someterse
    a una prueba de BAC (concentración de alcohol en sangre) cuando lo solicite un
    oficial, se le impondrá una sanción civil de:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Negarse a una prueba de BAC resulta en una sanción civil de $250 y
    la confiscación inmediata de su licencia de conducir, lo que conlleva una suspensión
    de un año por una primera negativa.
- id: 69
  category: driver_responsibility
  question: 'Tirar basura desde un vehículo es ilegal en Idaho. Una condena por tirar
    basura puede resultar en una multa de hasta:'
  choices:
    A: $50
    B: $100
    C: $180
    D: $500
  answer: C
  explanation: Tirar basura en cualquier propiedad pública o privada, incluidas las
    carreteras, es un delito menor en Idaho punible con una multa de hasta $180.
- id: 70
  category: driver_responsibility
  question: Si su licencia de Idaho es suspendida por una condena de 'falta de seguro',
    debe mantener un comprobante de responsabilidad financiera (SR-22) por ¿cuántos
    años a partir de la fecha de reinstalación?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los conductores condenados por conducir sin seguro deben presentar
    y mantener un certificado SR-22 durante tres años.
- id: 71
  category: driver_responsibility
  question: 'En Idaho, es ilegal que el conductor o cualquier pasajero posea un recipiente
    abierto de alcohol en el compartimiento de pasajeros de un vehículo motorizado
    en una vía pública. Esto se conoce como la:'
  choices:
    A: Ley de Tolerancia Cero
    B: Ley de Recipiente Abierto (Open Container Law)
    C: Ley de Prevención de DUI
    D: Estatuto de Seguridad Pública
  answer: B
  explanation: La Ley de Recipiente Abierto de Idaho prohíbe tanto a los conductores
    como a los pasajeros tener un recipiente abierto de alcohol en el área de pasajeros
    de un vehículo mientras se encuentran en una vía pública.
- id: 72
  category: driver_responsibility
  question: 'Si choca contra un vehículo desatendido y no puede encontrar al propietario,
    la ley de Idaho le exige:'
  choices:
    A: Esperar 30 minutos y luego irse
    B: Dejar una nota con su nombre, dirección y número de placa
    C: Informar solo a su compañía de seguros
    D: No hacer nada si el daño parece ser inferior a $500
  answer: B
  explanation: Si no puede localizar al propietario de un vehículo que ha golpeado,
    debe dejar una nota por escrito en un lugar visible del vehículo con su información
    de contacto y los detalles del vehículo.
- id: 73
  category: driver_responsibility
  question: Cuando lo solicite un oficial de la ley, ¿en qué formato debe proporcionar
    un conductor de Idaho el comprobante de seguro?
  choices:
    A: Solo en formato impreso
    B: Solo en formato electrónico
    C: Ya sea en formato impreso o electrónico
    D: Confirmación verbal del agente de seguros
  answer: C
  explanation: La ley de Idaho permite a los conductores proporcionar el comprobante
    de seguro ya sea en formato impreso (papel) o en formato electrónico (como en
    un teléfono inteligente).
- id: 74
  category: safe_driving_rules
  question: En Idaho, ¿cuál es el límite de velocidad máximo en distritos residenciales
    y comerciales a menos que se indique lo contrario?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 40 mph
  answer: C
  explanation: Según el Manual del Conductor de Idaho, el límite de velocidad es de
    35 mph en distritos residenciales, comerciales y urbanos, a menos que se indique
    una velocidad diferente.
- id: 75
  category: safe_driving_rules
  question: Al estacionar su vehículo en paralelo a una acera en Idaho, ¿a cuántas
    pulgadas de la acera debe estar?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: La ley de Idaho exige que cuando se estacione en una vía pública, debe
    estacionar en paralelo y a menos de 18 pulgadas de la acera o del borde de la
    calzada.
- id: 76
  category: safe_driving_rules
  question: En Idaho, ¿está prohibido estacionar a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: El Código de Idaho 49-660 establece que ninguna persona debe detener,
    parar o estacionar un vehículo a menos de 15 pies de un hidrante de incendios.
- id: 77
  category: safe_driving_rules
  question: Al acercarse a un autobús escolar con luces rojas intermitentes en una
    carretera de cuatro o más carriles y una mediana o barrera física, ¿qué conductores
    deben detenerse?
  choices:
    A: Todos los conductores en ambas direcciones
    B: Solo los conductores que siguen al autobús
    C: Solo los conductores en los carriles contrarios
    D: No se requiere que ningún conductor se detenga
  answer: B
  explanation: En Idaho, si un autobús escolar se detiene en una carretera de cuatro
    o más carriles y una barrera visual o mediana, solo el tráfico que sigue al autobús
    debe detenerse. El tráfico en los carriles contrarios no necesita detenerse.
- id: 78
  category: safe_driving_rules
  question: Al conducir en una autopista o carretera en Idaho, ¿durante cuántos segundos
    como mínimo debe hacer la señal antes de cambiar de carril?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 5 segundos
    D: 10 segundos
  answer: C
  explanation: Para el tráfico de alta velocidad en autopistas o carreteras, la ley
    de Idaho exige señalizar durante al menos cinco segundos antes de realizar un
    cambio de carril.
- id: 79
  category: safe_driving_rules
  question: En Idaho, ¿es ilegal adelantar a otro vehículo cuando se encuentra a menos
    de cuántos pies de una intersección o cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley de Idaho prohíbe adelantar cuando se encuentra a menos de 100
    pies de una intersección, un cruce de ferrocarril, un puente, un viaducto o un
    túnel.
- id: 80
  category: safe_driving_rules
  question: 'Según la ley de Idaho, NO puede dar una vuelta en U en una curva o cerca
    de la cima de una colina si su vehículo no puede ser visto por otros conductores
    que se acerquen desde cualquier dirección dentro de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Idaho prohíbe las vueltas en U en curvas o colinas donde
    su vehículo no pueda ser visto por el conductor de cualquier otro vehículo que
    se acerque desde cualquier dirección dentro de los 500 pies.
- id: 81
  category: safe_driving_rules
  question: Cuando dos vehículos llegan a una intersección no señalizada al mismo
    tiempo en Idaho, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda
    B: El vehículo de la derecha
    C: El vehículo que viaja a mayor velocidad
    D: El vehículo que circula por la carretera más grande
  answer: B
  explanation: En Idaho, cuando dos vehículos llegan aproximadamente al mismo tiempo
    a una intersección que no está controlada por señales o semáforos, el conductor
    del vehículo de la izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 82
  category: safe_driving_rules
  question: En Idaho, un 'vehículo de movimiento lento' se define como aquel que opera
    a una velocidad menor a ¿cuántas millas por hora?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: La ley de Idaho define un vehículo de movimiento lento como cualquier
    vehículo que normalmente no se opera a una velocidad superior a 25 mph. Estos
    vehículos deben exhibir un emblema de vehículo de movimiento lento.
- id: 83
  category: safe_driving_rules
  question: ¿Es legal girar a la izquierda con luz roja en Idaho?
  choices:
    A: No, nunca es legal
    B: Sí, pero solo desde una calle de sentido único hacia otra calle de sentido
      único
    C: Sí, desde cualquier calle hacia una calle de sentido único
    D: Sí, después de hacer una parada completa y ceder el paso a todo el tráfico
  answer: B
  explanation: La ley de Idaho permite girar a la izquierda con luz roja solo cuando
    se gira desde una calle de sentido único hacia otra calle de sentido único, después
    de hacer una parada completa y ceder el paso a los peatones y al resto del tráfico.
- id: 84
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada detrás de otro vehículo
    en Idaho bajo condiciones de conducción ideales?
  choices:
    A: 1 segundo
    '0': 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Idaho recomienda mantener una distancia
    de seguimiento de al menos tres segundos detrás del vehículo que tiene delante
    para permitir un frenado seguro.
- id: 85
  category: safe_driving_rules
  question: Al estacionar su vehículo cerca de un hidrante de incendios en Idaho,
    ¿cuál es la distancia mínima que debe mantener?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Idaho prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 86
  category: safe_driving_rules
  question: Según la ley de Idaho, ¿cuándo es legal girar a la izquierda con luz roja
    después de hacer una parada completa?
  choices:
    A: Nunca
    B: Desde una calle de sentido único hacia otra calle de sentido único
    C: Desde una calle de doble sentido hacia una calle de sentido único
    D: En cualquier intersección si no viene tráfico
  answer: B
  explanation: En Idaho, se permite girar a la izquierda en rojo solo cuando se gira
    de una calle de sentido único a otra calle de sentido único, siempre que se detenga
    primero y ceda el paso a los peatones y al resto del tráfico.
- id: 87
  category: safe_driving_rules
  question: En una carretera de dos carriles en Idaho, si usted conduce lentamente
    y se forma una fila de vehículos detrás de usted, debe orillarse y dejarlos pasar
    si hay al menos ¿cuántos vehículos en la fila?
  choices:
    A: 2 vehículos
    B: 3 vehículos
    C: 5 vehículos
    D: 10 vehículos
  answer: B
  explanation: El Código de Idaho exige que los vehículos de movimiento lento en una
    carretera de dos carriles se orillen en el apartadero seguro más cercano cuando
    haya 3 o más vehículos siguiéndolos en fila.
- id: 88
  category: safe_driving_rules
  question: En Idaho, ¿entre qué fechas es legal usar neumáticos para nieve con clavos
    en su vehículo?
  choices:
    A: Del 1 de noviembre al 31 de marzo
    B: Del 1 de octubre al 30 de abril
    C: Del 15 de octubre al 15 de abril
    D: Del 15 de noviembre al 1 de abril
  answer: B
  explanation: Los neumáticos para nieve con clavos están permitidos en las carreteras
    de Idaho solo desde el 1 de octubre hasta el 30 de abril.
- id: 89
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad estándar en una zona escolar de Idaho
    cuando las luces están parpadeando o hay señales publicadas?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El límite de velocidad en una zona escolar en Idaho es de 20 mph, a
    menos que se indique lo contrario.
- id: 90
  category: safe_driving_rules
  question: 'La ley de ''Moverse a un lado'' (Move Over) de Idaho requiere que los
    conductores que se aproximan a vehículos de emergencia detenidos con luces intermitentes
    deben:'
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Mantener la velocidad pero tocar la bocina para alertar al oficial
    C: Cambiarse al carril izquierdo si es seguro, o reducir la velocidad significativamente
      si no es posible cambiar de carril
    D: Acelerar para pasar la escena lo más rápido posible
  answer: C
  explanation: La ley de Idaho exige que los conductores se muevan al carril izquierdo
    en carreteras de carriles múltiples o que reduzcan la velocidad y procedan con
    precaución si un cambio de carril no es seguro al pasar vehículos de emergencia
    o de mantenimiento detenidos con luces intermitentes.
- id: 91
  category: safe_driving_rules
  question: ¿En Idaho, a cuántos pies de una curva o de la cima de una colina donde
    su vista esté obstruida no se permite rebasar a otro vehículo?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Está prohibido rebasar en Idaho al acercarse a una curva o colina donde
    la vista del conductor esté obstruida a menos de 500 pies.
- id: 92
  category: safe_driving_rules
  question: Al estacionar cerca de una intersección en Idaho, ¿a cuántos pies de distancia
    como mínimo debe estar de un paso de peatones?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: La ley de Idaho prohíbe estacionar a menos de 20 pies de un paso de
    peatones en una intersección.
- id: 93
  category: safe_driving_rules
  question: Según el Manual del Conductor de Idaho, ¿qué sucede con las multas por
    exceso de velocidad en una zona de obras designada cuando hay trabajadores presentes?
  choices:
    A: Se exoneran para quienes cometen la infracción por primera vez
    B: Se duplican
    C: Se incrementan con un cargo fijo de $500
    D: Siguen siendo las mismas que las multas estándar por exceso de velocidad
  answer: B
  explanation: En Idaho, las multas por exceso de velocidad en una zona de obras se
    duplican cuando hay trabajadores presentes.
- id: 94
  category: safe_driving_rules
  question: 'Para mantener una distancia de seguimiento segura detrás del vehículo
    que va delante de usted en Idaho, debe utilizar la:'
  choices:
    A: Regla de la longitud de un vehículo
    B: Regla de los dos segundos
    C: Regla de los tres segundos
    D: Regla de los cuatro segundos
  answer: C
  explanation: El Manual del Conductor de Idaho recomienda una distancia de seguimiento
    mínima de tres segundos en condiciones normales de conducción.
- id: 95
  category: safe_driving_rules
  question: 'Bajo la ley de Consentimiento Implícito de Idaho, si se sospecha que
    conduce bajo la influencia y se niega a someterse a una prueba de BAC (concentración
    de alcohol en sangre), su licencia de conducir será confiscada y suspendida por:'
  choices:
    A: 90 días
    B: 180 días
    C: Un año
    D: Dos años
  answer: C
  explanation: Si se niega a realizar una prueba de evidencia (prueba de BAC) en Idaho,
    el oficial confiscará su licencia y el tribunal la suspenderá por un año en caso
    de una primera negativa.
- id: 96
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar en el último momento en Idaho,
    ¿con cuánta anticipación visual debe mirar hacia adelante?
  choices:
    A: 5 segundos
    B: 10 segundos
    C: 15 segundos
    D: 30 segundos
  answer: C
  explanation: El Manual del Conductor de Idaho sugiere mirar al menos 15 segundos
    hacia adelante para identificar posibles peligros con anticipación.
- id: 97
  category: defensive_driving
  question: ¿En Idaho, cuándo debe bajar las luces altas (cambiar a luces bajas) al
    acercarse a un vehículo que viene en sentido contrario?
  choices:
    A: A menos de 200 pies
    B: A menos de 350 pies
    C: A menos de 500 pies
    D: A menos de 1,000 pies
  answer: C
  explanation: La ley de Idaho exige que los conductores bajen las luces altas cuando
    se encuentren a menos de 500 pies de un vehículo que se aproxima.
- id: 98
  category: defensive_driving
  question: Al seguir a otro vehículo por la noche en Idaho, ¿a qué distancia debe
    bajar las luces altas (cambiar a luces bajas)?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Idaho exige que baje las luces altas cuando se encuentre
    a menos de 200 pies del vehículo que está siguiendo.
- id: 99
  category: defensive_driving
  question: ¿En Idaho, entre qué fechas se permiten legalmente los neumáticos para
    nieve con clavos en las carreteras?
  choices:
    A: Del 1 de noviembre al 31 de marzo
    B: Del 1 de octubre al 30 de abril
    C: Del 1 de septiembre al 1 de mayo
    D: Del 15 de octubre al 15 de abril
  answer: B
  explanation: Los neumáticos para nieve con clavos están permitidos en Idaho solo
    del 1 de octubre al 30 de abril de cada año.
- id: 100
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hydroplaning) en carreteras
    mojadas de Idaho con neumáticos estándar?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El hidroplaneo (donde los neumáticos pierden contacto con la carretera
    y se deslizan sobre una capa de agua) puede comenzar a velocidades tan bajas como
    35 mph.
- id: 101
  category: defensive_driving
  question: Al rebasar a otro vehículo en una carretera de dos carriles en Idaho,
    ¿a cuántos pies de distancia de un vehículo que viene en sentido contrario debe
    regresar a su carril?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Idaho establece que debe completar el rebase y regresar a
    su carril antes de estar a menos de 200 pies de cualquier vehículo que se aproxime
    en dirección opuesta.
- id: 102
  category: defensive_driving
  question: Si está estacionando su vehículo en una pendiente cuesta abajo con acera
    en Idaho, ¿hacia qué lado debe girar las ruedas delanteras?
  choices:
    A: Hacia la acera
    B: Lejos de la acera
    C: Paralelas a la acera
    D: No importa
  answer: A
  explanation: Al estacionar cuesta abajo con acera, gire las ruedas hacia la acera
    para que el automóvil ruede contra ella si fallan los frenos.
- id: 103
  category: defensive_driving
  question: Al conducir con niebla densa en Idaho, ¿qué configuración de faros debe
    utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Sin luces
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en las gotas de agua, lo que provoca deslumbramiento y reduce aún más
    la visibilidad.
- id: 104
  category: defensive_driving
  question: Usted conduce por una carretera de tres o más carriles. Un autobús escolar
    está detenido en la dirección opuesta con sus luces rojas intermitentes y el brazo
    de parada extendido. Según la ley de Idaho, ¿es necesario que se detenga?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar
    B: No, no es necesario detenerse
    C: Sí, pero solo si no hay una mediana
    D: No, pero debe tocar la bocina
  answer: B
  explanation: En Idaho, en una carretera con tres o más carriles, el tráfico que
    viaja en la dirección opuesta a un autobús escolar detenido no está obligado a
    detenerse.
- id: 105
  category: defensive_driving
  question: Al entrar en una rotonda en Idaho, ¿a quién debe ceder el derecho de paso?
  choices:
    A: Al tráfico que entra por la derecha
    B: Al tráfico que ya está en la rotonda
    C: A nadie; usted tiene el derecho de paso
    D: Solo a los peatones, no a otros vehículos
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el paso al tráfico
    que ya está circulando dentro de la intersección.
- id: 106
  category: defensive_driving
  question: En una intersección en Idaho donde no hay señales de alto ni semáforos,
    dos vehículos llegan al mismo tiempo. ¿Quién tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda
    B: El vehículo de la derecha
    C: El vehículo que viaja más rápido
    D: El vehículo en la calle más transitada
  answer: B
  explanation: En las intersecciones no controladas, el conductor del vehículo de
    la izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 107
  category: defensive_driving
  question: En Idaho, si se niega a someterse a una prueba de concentración de alcohol
    en sangre (BAC) cuando lo solicita un oficial, ¿cuál es la sanción civil inmediata?
  choices:
    A: Una multa de $100
    B: Una multa de $250 e incautación de la licencia por 1 año
    C: Una multa de $500 e incautación de la licencia por 2 años
    D: No hay sanción civil, solo penal
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito de Idaho, negarse a una prueba
    de BAC resulta en una multa civil de $250 y la incautación inmediata de su licencia
    de conducir por un año.
- id: 108
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar en el último momento en Idaho,
    ¿cuántos segundos hacia adelante en la carretera debe mirar como mínimo?
  choices:
    A: 5 segundos
    B: 10 segundos
    C: 15 segundos
    D: 20 segundos
  answer: C
  explanation: Las pautas de conducción defensiva de Idaho sugieren observar la carretera
    al menos 15 segundos hacia adelante para anticipar peligros y cambios en el flujo
    del tráfico.
- id: 109
  category: defensive_driving
  question: Al conducir de noche en Idaho, ¿a cuántos pies de distancia debe bajar
    las luces altas cuando se aproxima un vehículo en sentido contrario?
  choices:
    A: 200 pies
    B: 350 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Idaho exige que los conductores bajen las luces altas cuando
    un vehículo que viene en sentido contrario esté a menos de 500 pies para evitar
    cegar al otro conductor.
- id: 110
  category: defensive_driving
  question: 'En Idaho, el hidroplaneo (donde los neumáticos pierden contacto con la
    carretera sobre una capa de agua) puede comenzar a velocidades tan bajas como:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El Manual del Conductor de Idaho establece que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph, y a 55 mph, los neumáticos pueden
    perder todo contacto con la carretera.
- id: 111
  category: defensive_driving
  question: ¿En qué dirección debe girar las ruedas delanteras si está estacionando
    cuesta arriba en una colina con bordillo en Idaho?
  choices:
    A: Hacia el bordillo
    B: Lejos del bordillo
    C: Paralelo al bordillo
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba con bordillo, gire las ruedas hacia afuera
    del bordillo para que el vehículo ruede hacia el bordillo si fallan los frenos.
- id: 112
  category: defensive_driving
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad legal
    en un distrito residencial, comercial o urbano en Idaho?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: D
  explanation: Según el Código de Idaho 49-654, el límite de velocidad legal en cualquier
    distrito residencial, comercial o urbano es de 35 mph, a menos que se indique
    un límite diferente.
- id: 113
  category: defensive_driving
  question: Al observar una intersección en busca de posibles peligros, ¿en qué orden
    debe mirar?
  choices:
    A: Derecha, izquierda, derecha
    B: Izquierda, derecha, izquierda
    C: Solo hacia adelante
    D: Primero detrás de usted
  answer: B
  explanation: Las pautas de conducción defensiva de Idaho recomiendan mirar a la
    izquierda, luego a la derecha y luego a la izquierda nuevamente antes de entrar
    en una intersección, ya que los vehículos que vienen por la izquierda están más
    cerca de usted.
- id: 114
  category: defensive_driving
  question: 'Si su vehículo está equipado con frenos antibloqueo (ABS) y necesita
    detenerse rápidamente en una emergencia, usted debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante y no soltar
    C: Cambiar a punto muerto (neutral) y usar el freno de emergencia
    D: Tocar ligeramente los frenos para evitar que se bloqueen
  answer: B
  explanation: Con ABS, debe aplicar una presión firme y constante. Bombear los frenos
    es para vehículos sin ABS; hacerlo con ABS desactivará la efectividad del sistema.
- id: 115
  category: defensive_driving
  question: 'Para revisar su "punto ciego" antes de cambiar de carril en Idaho, usted
    debe:'
  choices:
    A: Mirar por el espejo retrovisor
    B: Mirar por el espejo lateral
    C: Girar la cabeza y mirar por encima del hombro
    D: Confiar en su cámara de retroceso
  answer: C
  explanation: Los espejos no muestran todo lo que hay alrededor de su vehículo. Para
    revisar adecuadamente los puntos ciegos, debe girar la cabeza y mirar por encima
    del hombro en la dirección en la que planea moverse.
- id: 116
  category: alcohol_drugs_health
  question: En Idaho, ¿se considera que un conductor está cometiendo un "DUI excesivo"
    si su concentración de alcohol en sangre (BAC) es igual o superior a qué nivel?
  choices:
    A: 0.08%
    B: 0.15%
    C: 0.20%
    D: 0.25%
  answer: C
  explanation: La ley de Idaho define el "DUI excesivo" como tener un BAC de 0.20%
    o superior. Esto conlleva sanciones mucho más severas que un DUI estándar.
- id: 117
  category: alcohol_drugs_health
  question: Para una primera condena por DUI en Idaho (no excesivo), ¿cuál es la sentencia
    máxima de cárcel que un tribunal puede imponer?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Por una primera infracción de DUI en Idaho, el conductor puede enfrentar
    hasta seis meses de cárcel, una multa de hasta $1,000 y la suspensión de la licencia.
- id: 118
  category: alcohol_drugs_health
  question: La ley de Idaho exige que se instale un dispositivo de enclavamiento de
    encendido (IID) en los vehículos de ¿qué infractores de DUI?
  choices:
    A: Solo aquellos con un BAC superior al 0.20%
    B: Solo infractores reincidentes dentro de un período de 5 años
    C: Todas las personas condenadas por un DUI, incluidos los infractores por primera
      vez
    D: Solo conductores menores de 21 años
  answer: C
  explanation: A partir de 2018, la ley de Idaho exige que todas las personas condenadas
    por un DUI (incluidos los infractores por primera vez) instalen un dispositivo
    de enclavamiento de encendido en cualquier vehículo que conduzcan durante un período
    de tiempo después de su suspensión.
- id: 119
  category: alcohol_drugs_health
  question: En Idaho, ¿es ilegal poseer un contenedor abierto de una bebida alcohólica
    en qué parte del vehículo?
  choices:
    A: Solo en el maletero
    B: En el compartimento de pasajeros
    C: Solo en la guantera
    D: Detrás del último asiento vertical de un vehículo sin maletero
  answer: B
  explanation: El Código de Idaho 23-505 establece que es ilegal que cualquier persona
    beba o posea un contenedor abierto de una bebida alcohólica en el compartimento
    de pasajeros de un vehículo motorizado en una vía pública.
- id: 120
  category: alcohol_drugs_health
  question: 'Si un conductor menor de 21 años es condenado por un DUI por primera
    vez en Idaho, su licencia será suspendida por un período obligatorio de:'
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: Un año
  answer: D
  explanation: Para conductores menores de 21 años, una primera condena por DUI resulta
    en una suspensión obligatoria de la licencia por un año y una multa de hasta $1,000.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los medicamentos
    recetados y la conducción en Idaho?
  choices:
    A: No se le puede acusar de un DUI si el medicamento fue recetado legalmente por
      un médico
    B: Los medicamentos recetados solo son una preocupación si se mezclan con alcohol
    C: Se le puede acusar de un DUI si un medicamento recetado afecta su capacidad
      para conducir de manera segura
    D: Solo los narcóticos de la "Lista I" (Schedule I) pueden dar lugar a un cargo
      de DUI
  answer: C
  explanation: En Idaho, un cargo de DUI se aplica a cualquier sustancia que afecte
    su conducción, incluidos los medicamentos recetados y los medicamentos de venta
    libre. Es responsabilidad del conductor conocer los efectos de su medicación.
- id: 122
  category: alcohol_drugs_health
  question: ¿Cuál es la multa máxima por una primera condena de "DUI excesivo" (BAC
    de 0.20% o superior) en Idaho?
  choices:
    A: $1,000
    B: $2,000
    C: $5,000
    D: $10,000
  answer: B
  explanation: Una primera condena por DUI excesivo en Idaho conlleva una multa de
    hasta $2,000, tiempo de cárcel obligatorio de al menos 10 días y una suspensión
    de la licencia por un año.
- id: 123
  category: alcohol_drugs_health
  question: Si es condenado por un segundo DUI en Idaho dentro de un período de 10
    años, ¿cuál es la sentencia mínima obligatoria de cárcel?
  choices:
    A: 48 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Para una segunda condena por DUI dentro de los 10 años en Idaho, la
    ley exige un mínimo obligatorio de 10 días de cárcel, aunque la sentencia puede
    ser de hasta un año.
- id: 124
  category: alcohol_drugs_health
  question: 'El alcohol es una droga que se clasifica como:'
  choices:
    A: Estimulante
    B: Depresor
    C: Alucinógeno
    D: Narcótico
  answer: B
  explanation: El alcohol es un depresor. Ralentiza el sistema nervioso central, afectando
    el tiempo de reacción, la coordinación y el juicio.
- id: 125
  category: alcohol_drugs_health
  question: Cuando se consume alcohol, ¿cuál de los siguientes se ve afectado normalmente
    primero?
  choices:
    A: Coordinación muscular
    B: Visión
    C: Juicio
    D: Habla
  answer: C
  explanation: El juicio es la primera facultad afectada por el alcohol. Los conductores
    pueden tomar riesgos que de otro modo no tomarían antes de que aparezcan síntomas
    físicos como el habla arrastrada o la falta de coordinación.
- id: 126
  category: alcohol_drugs_health
  question: 'Si se ve involucrado en un choque en Idaho y un oficial de policía tiene
    "motivos razonables" para creer que conducía bajo la influencia, este puede:'
  choices:
    A: Evaluarlo solo si está visiblemente intoxicado
    B: Solicitar una prueba de evidencia de drogas o alcohol incluso si usted está
      inconsciente
    C: Evaluarlo solo si hay una víctima mortal
    D: No evaluarlo sin una orden judicial firmada por un juez
  answer: B
  explanation: Según la ley de Consentimiento Implícito de Idaho, si usted está inconsciente
    o es incapaz de negarse por cualquier otro motivo, se considera que no ha retirado
    su consentimiento para una prueba química.
- id: 127
  category: alcohol_drugs_health
  question: ¿Qué es el "efecto sinérgico" en relación con la conducción?
  choices:
    A: El efecto del alcohol desapareciendo con el tiempo
    B: El aumento del deterioro causado por la mezcla de alcohol y otra droga
    C: La capacidad del cuerpo para procesar una bebida por hora
    D: La sensación psicológica de estar sobrio cuando no lo está
  answer: B
  explanation: El efecto sinérgico ocurre cuando se combinan el alcohol y otra droga
    (incluso de venta libre), lo que resulta en un deterioro mucho mayor que el que
    causaría cualquiera de las sustancias por sí sola.
- id: 128
  category: alcohol_drugs_health
  question: 'En Idaho, si tiene una condición médica que causa pérdida del conocimiento
    (como la epilepsia), se le puede exigir:'
  choices:
    A: Conducir solo durante las horas del día
    B: Estar libre de tales episodios durante un período de 6 meses antes de obtener
      la licencia
    C: Tener a un conductor con licencia en el asiento del pasajero en todo momento
    D: Entregar su licencia de forma permanente
  answer: B
  explanation: Idaho generalmente requiere que las personas con condiciones que causan
    pérdida del conocimiento estén libres de episodios por un período de 6 meses y
    proporcionen una evaluación médica antes de que puedan ser autorizadas para conducir.
- id: 129
  category: alcohol_drugs_health
  question: En Idaho, ¿cuál es el límite legal de concentración de alcohol en sangre
    (BAC) para un conductor mayor de 21 años?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Para los conductores de 21 años o más en Idaho, es ilegal conducir
    con un BAC de 0.08% o superior.
- id: 130
  category: alcohol_drugs_health
  question: Según la ley de "Consentimiento Implícito" de Idaho, ¿cuál es la sanción
    por negarse a realizar una prueba de evidencia solicitada (como un alcoholímetro)
    por primera vez?
  choices:
    A: Una multa de $50 y una suspensión de 30 días
    B: Una sanción civil de $250 y una suspensión de la licencia por un año
    C: Una multa de $1,000 y 48 horas de cárcel
    D: No hay sanción si es su primera infracción
  answer: B
  explanation: Según la ley de Consentimiento Implícito de Idaho, al conducir por
    las carreteras de Idaho, usted ha dado su consentimiento para las pruebas. La
    negativa resulta en una sanción civil de $250 y una suspensión obligatoria de
    la licencia por un año.
- id: 131
  category: alcohol_drugs_health
  question: ¿En Idaho, cuál es la sentencia máxima de cárcel por una primera infracción
    de DUI (no excesiva)?
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Una condena por DUI por primera vez en Idaho es un delito menor y puede
    resultar en hasta seis meses en la cárcel del condado.
- id: 132
  category: alcohol_drugs_health
  question: ¿Qué nivel de concentración de alcohol en sangre (BAC) se considera "Concentración
    excesiva de alcohol" para un conductor adulto en Idaho, lo que conlleva sanciones
    mayores?
  choices:
    A: 0.10% o más
    B: 0.15% o más
    C: 0.20% o más
    D: 0.25% o más
  answer: C
  explanation: La ley de Idaho define la "Concentración excesiva de alcohol" como
    un BAC de 0.20% o más, lo que conlleva sanciones mucho más severas que un DUI
    estándar.
- id: 133
  category: alcohol_drugs_health
  question: De acuerdo con la ley de envases abiertos de Idaho, ¿dónde es legal llevar
    un envase de bebida alcohólica abierto o sin sellar en un vehículo?
  choices:
    A: En la guantera
    B: En la consola central
    C: En el maletero o detrás del último asiento vertical en un vehículo sin maletero
    D: Debajo del asiento del conductor
  answer: C
  explanation: Los envases abiertos de alcohol deben mantenerse en el maletero o,
    en vehículos sin maletero (como los SUV), en un área que no esté ocupada normalmente
    por el conductor o los pasajeros.
- id: 134
  category: alcohol_drugs_health
  question: ¿En Idaho, cómo trata la ley el conducir bajo la influencia de medicamentos
    recetados o de venta libre?
  choices:
    A: Es legal si el medicamento fue recetado por un médico
    B: Solo es ilegal si el medicamento es un narcótico
    C: Es ilegal conducir si el medicamento afecta su capacidad para conducir de manera
      segura
    D: Solo es ilegal si el medicamento se combina con alcohol
  answer: C
  explanation: Es ilegal conducir en Idaho bajo la influencia de cualquier sustancia,
    legal o ilegal, que afecte su capacidad para operar un vehículo motorizado de
    manera segura.
- id: 135
  category: alcohol_drugs_health
  question: Para una segunda condena por DUI dentro de un periodo de 10 años en Idaho,
    ¿cuál es la sentencia mínima obligatoria de cárcel?
  choices:
    A: 48 horas
    B: 10 días
    C: 30 días
    D: 90 días
  answer: B
  explanation: Una segunda condena por DUI dentro de un periodo de 10 años en Idaho
    conlleva una sentencia mínima obligatoria de cárcel de 10 días.
- id: 136
  category: alcohol_drugs_health
  question: A partir de 2018, la ley de Idaho exige que todos los conductores condenados
    por un DUI instalen ¿qué dispositivo en su vehículo?
  choices:
    A: Un rastreador GPS
    B: Un dispositivo de enclavamiento de encendido (IID)
    C: Una cámara de tablero
    D: Un regulador de velocidad automático
  answer: B
  explanation: La ley de Idaho exige que cualquier persona condenada por un DUI (incluidos
    los que delinquen por primera vez) instale un dispositivo de enclavamiento de
    encendido en cualquier vehículo que conduzca.
- id: 137
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de BAC para un conductor que opera un vehículo
    motorizado comercial (CMV) en Idaho?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Los conductores comerciales están sujetos a un estándar más estricto;
    un BAC de 0.04% o más mientras se opera un CMV se considera un DUI.
- id: 138
  category: alcohol_drugs_health
  question: 'Si usted se ve involucrado en un choque que resulta en lesiones o muerte
    y está bajo la influencia del alcohol, puede ser acusado de:'
  choices:
    A: DUI simple
    B: DUI agravado
    C: Conducción negligente
    D: Conducción desatenta
  answer: B
  explanation: En Idaho, si usted causa lesiones corporales graves a otra persona
    mientras conduce bajo la influencia, el cargo se eleva a DUI agravado, lo cual
    es un delito grave.
- id: 139
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única manera de recuperar la sobriedad y
    reducir su BAC antes de conducir?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Dar tiempo para que su cuerpo procese el alcohol
    D: Comer una comida pesada
  answer: C
  explanation: Solo el tiempo permite que el cuerpo metabolice el alcohol. El café,
    las duchas y la comida no reducen su concentración de alcohol en sangre.
- id: 140
  category: alcohol_drugs_health
  question: ¿Cuál es la razón principal por la que el alcohol aumenta el riesgo de
    un choque?
  choices:
    A: Hace que el conductor sea más agresivo
    B: Afecta el juicio y retrasa el tiempo de reacción
    C: Causa ceguera inmediata
    D: Hace que el vehículo sea más difícil de maniobrar
  answer: B
  explanation: El alcohol es un depresor que afecta el sistema nervioso central, perjudicando
    principalmente el juicio del conductor y retrasando sus tiempos de reacción física.
- id: 141
  category: alcohol_drugs_health
  question: 'En Idaho, una segunda negativa a realizarse una prueba de evidencia (Consentimiento
    Implícito) dentro de un periodo de 10 años resulta en una suspensión de la licencia
    de:'
  choices:
    A: 90 días
    B: 1 año
    C: 2 años
    D: Revocación permanente
  answer: C
  explanation: Una segunda negativa a una prueba de BAC (concentración de alcohol
    en sangre) dentro de un periodo de 10 años en Idaho resulta en una suspensión
    obligatoria de la licencia por dos años.
- id: 142
  category: penalties_and_points
  question: En Idaho, si se le condena por conducir sin el seguro de responsabilidad
    civil requerido por primera vez, ¿cuál es una de las sanciones?
  choices:
    A: Su licencia se suspende hasta que presente una prueba de seguro y pague una
      tarifa de restablecimiento
    B: Una sentencia obligatoria de 5 días de cárcel
    C: Revocación permanente del registro de su vehículo
    D: Una multa fija de $1,000 independientemente de las circunstancias
  answer: A
  explanation: Para una primera infracción por conducir sin seguro, la ley de Idaho
    exige la suspensión de los privilegios de conducción hasta que se presente una
    prueba de responsabilidad financiera (SR-22) y se pague una tarifa de restablecimiento.
- id: 143
  category: penalties_and_points
  question: 'Si acumula 24 puntos o más dentro de cualquier periodo de 36 meses en
    Idaho, su licencia será suspendida por:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: El sistema de puntos de Idaho exige una suspensión de 6 meses para
    los conductores que acumulen 24 puntos o más dentro de un periodo de 36 meses.
- id: 144
  category: penalties_and_points
  question: En Idaho, una condena por 'No ceder el paso' (Failure to Yield the Right-of-Way)
    resulta en ¿cuántos puntos en su historial de conducción?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: No ceder el paso es una infracción de 3 puntos en el estado de Idaho.
- id: 145
  category: penalties_and_points
  question: Bajo la ley de 'Manos Libres' (Hands-Free) de Idaho, ¿cuál es la sanción
    por una primera infracción por usar un dispositivo electrónico portátil mientras
    conduce?
  choices:
    A: Una multa de $75
    B: Una multa de $150 y 3 puntos
    C: Una multa de $250 y suspensión de 1 año
    D: Una multa de $500
  answer: A
  explanation: A partir del 1 de julio de 2020, la ley de Idaho prohíbe sostener un
    teléfono celular o dispositivo electrónico mientras se opera un vehículo. Una
    primera infracción conlleva una multa de $75 (más costos judiciales).
- id: 146
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden al historial de conducción de Idaho por 'Rebase
    ilegal' (Illegal Passing) de otro vehículo?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: El rebase ilegal se considera una infracción de tránsito más grave
    en Idaho y resulta en la adición de 4 puntos al historial del conductor.
- id: 147
  category: penalties_and_points
  question: En Idaho, ¿cuántos puntos se asignan por 'No detenerse ante un autobús
    escolar' (Failure to Stop for a School Bus)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Rebasar un autobús escolar mientras sus luces rojas parpadean y el
    brazo de parada está extendido es una infracción de 4 puntos en Idaho.
- id: 148
  category: penalties_and_points
  question: Si un conductor de Idaho es condenado por un DUI por primera vez (BAC
    de .08% o superior), ¿cuál es la sentencia máxima de cárcel posible?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Para una primera condena por DUI en Idaho, la sentencia máxima de cárcel
    es de hasta 6 meses.
- id: 149
  category: penalties_and_points
  question: ¿Con qué frecuencia puede un conductor de Idaho tomar un curso aprobado
    de conducción defensiva para eliminar 3 puntos de su historial de conducción?
  choices:
    A: Una vez al año
    B: Una vez cada 2 años
    C: Una vez cada 3 años
    D: Una vez cada 5 años
  answer: C
  explanation: Idaho permite a los conductores reducir su total de puntos en 3 puntos
    al completar un curso aprobado, pero este beneficio solo se puede utilizar una
    vez cada tres años.
- id: 150
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por una infracción de 'Exceso de velocidad'
    (Speeding) en Idaho si la velocidad es de 1 a 15 mph sobre el límite?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: En Idaho, el exceso de velocidad de 1 a 15 mph sobre el límite es una
    infracción de 3 puntos. El exceso de velocidad de 16 mph o más sobre el límite
    es una infracción de 4 puntos.
- id: 151
  category: penalties_and_points
  question: ¿En Idaho, cuántos puntos se asignan por 'Conducción Inatenta'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: La conducción inatenta es una infracción de 3 puntos en el programa
    de puntos de Idaho.
- id: 152
  category: penalties_and_points
  question: ¿En Idaho, cuál es el valor en puntos por una condena de 'No Ceder el
    Paso'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: No ceder el paso tiene asignados 3 puntos en el historial de conducción
    de Idaho.
- id: 153
  category: penalties_and_points
  question: Si usted está involucrado en un accidente de tráfico en Idaho que resulte
    en lesiones, muerte o daños a la propiedad que excedan los ______, debe presentar
    un informe por escrito al Departamento de Transporte de Idaho.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: La ley de Idaho exige un informe de accidente por escrito si los daños
    a la propiedad de cualquier persona son superiores a $1,500 o si hay alguna lesión
    o muerte.
- id: 154
  category: penalties_and_points
  question: ¿Cuál es la multa por una infracción del cinturón de seguridad para un
    conductor adulto en Idaho?
  choices:
    A: $10.00
    B: $25.00
    C: $50.00
    D: $100.00
  answer: A
  explanation: En Idaho, la multa por una infracción del cinturón de seguridad es
    de $10.00 (aunque se pueden añadir costos judiciales).
- id: 155
  category: penalties_and_points
  question: ¿En Idaho, cuántos puntos se asignan por una condena de 'Seguir Demasiado
    Cerca' (tailgating)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: Seguir demasiado cerca es una infracción de 3 puntos en Idaho.
- id: 156
  category: penalties_and_points
  question: ¿Cuál es el valor en puntos por una condena de 'Conducción Inatenta' en
    Idaho?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: A la conducción inatenta se le asignan 3 puntos en el sistema de puntos
    de Idaho.
- id: 157
  category: penalties_and_points
  question: 'En Idaho, una condena por primera ofensa por no proporcionar prueba de
    seguro resulta en una multa de $75 y:'
  choices:
    A: Una sentencia de 30 días de cárcel
    B: Una revocación de la licencia por 1 año
    C: Suspensión de la licencia hasta que se presente una prueba de responsabilidad
      financiera (SR-22)
    D: 6 puntos en el historial de conducción
  answer: C
  explanation: Para una primera ofensa por no proporcionar prueba de seguro, la licencia
    se suspende hasta que el conductor proporcione la prueba y presente un SR-22 por
    un año.
- id: 158
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por una infracción de 'Señal de Alto' o 'Semáforo'
    en Idaho?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: No obedecer una señal de alto o un semáforo es una infracción de 3
    puntos en Idaho.
- id: 159
  category: penalties_and_points
  question: 'En Idaho, si es menor de 21 años y es condenado por un segundo DUI dentro
    de cinco años, su licencia puede ser suspendida por hasta:'
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Revocación permanente
  answer: C
  explanation: Para conductores menores de 21 años, una segunda condena por DUI dentro
    de cinco años resulta en una suspensión de la licencia por hasta dos años.
- id: 160
  category: penalties_and_points
  question: En Idaho, las infracciones de 'Sujeción para Niños' resultan en una multa
    y ¿cuántos puntos en el historial de conducción?
  choices:
    A: 0 puntos
    B: 1 punto
    C: 2 puntos
    D: 3 puntos
  answer: A
  explanation: Aunque la ley de Idaho exige sistemas de sujeción para niños y conlleva
    una multa por incumplimiento, es una infracción que no es de movimiento y no resulta
    en puntos en el historial de conducción.
- id: 161
  category: sharing_the_road
  question: ¿En Idaho, cómo debe tratar un ciclista un semáforo en rojo constante?
  choices:
    A: Como una señal de ceder el paso, disminuyendo la velocidad pero sin detenerse
    B: Debe esperar a que la luz cambie a verde como cualquier otro vehículo
    C: Detenerse, ceder el paso a todo el resto del tráfico y luego avanzar a través
      de la luz roja con precaución
    D: A los ciclistas no se les permite avanzar a través de semáforos en rojo bajo
      ninguna circunstancia
  answer: C
  explanation: La ley de Idaho permite a los ciclistas tratar un semáforo en rojo
    como una señal de alto (stop sign). Deben detenerse por completo y ceder el paso
    a todo el resto del tráfico antes de proceder a través de la intersección.
- id: 162
  category: sharing_the_road
  question: Cuando una procesión funeraria es encabezada por un vehículo de escolta
    funeraria que usa luces intermitentes, ¿cuál es la regla del derecho de paso en
    las intersecciones en Idaho?
  choices:
    A: La procesión debe detenerse ante todas las luces rojas y señales de alto
    B: Solo el vehículo líder tiene el derecho de paso
    C: Toda la procesión tiene el derecho de paso independientemente de los dispositivos
      de control de tráfico, siempre que lleven sus faros delanteros encendidos
    D: Las procesiones funerarias no tienen privilegios especiales de derecho de paso
      en Idaho
  answer: C
  explanation: Según el Código de Idaho 49-2701, una vez que el vehículo líder en
    una procesión funeraria ha entrado legalmente en una intersección, los vehículos
    restantes en la procesión pueden continuar a través de la intersección independientemente
    de las señales de tráfico, siempre que tengan sus faros encendidos.
- id: 163
  category: sharing_the_road
  question: 'Un emblema de vehículo de movimiento lento (un triángulo naranja con
    un borde rojo) debe mostrarse en la parte trasera de cualquier vehículo diseñado
    para operar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: En Idaho, el emblema de vehículo de movimiento lento es obligatorio
    en todos los vehículos diseñados para viajar a velocidades de 25 mph o menos.
- id: 164
  category: sharing_the_road
  question: Al seguir a una motocicleta, ¿cuál es la distancia de seguimiento recomendada
    para garantizar la seguridad?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: Al menos 3 segundos
    D: Exactamente el largo de 1 automóvil
  answer: C
  explanation: El Manual del Conductor de Idaho recomienda una distancia de seguimiento
    de al menos tres segundos detrás de una motocicleta para permitir que el motociclista
    tenga suficiente espacio para maniobrar en caso de peligros en la carretera o
    paradas repentinas.
- id: 165
  category: sharing_the_road
  question: En Idaho, si usted está girando en una intersección y un peatón está cruzando
    en un cruce de peatones no marcado, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor, porque el cruce de peatones no está marcado
    B: El peatón
    C: Quien haya llegado primero a la intersección
    D: El conductor, pero solo si usa su bocina
  answer: B
  explanation: La ley de Idaho establece que los peatones tienen el derecho de paso
    en todas las intersecciones, ya sea que los cruces de peatones estén marcados
    o no.
- id: 166
  category: sharing_the_road
  question: Los camiones grandes tienen 'No-Zones' (zonas prohibidas) donde el conductor
    no puede ver su vehículo. ¿Dónde se encuentra la 'No-Zone' más grande?
  choices:
    A: Directamente frente al camión
    B: En el lado izquierdo del camión
    C: En el lado derecho del camión
    D: Directamente detrás del camión
  answer: C
  explanation: Aunque los camiones tienen puntos ciegos en todos los lados, el punto
    ciego del lado derecho es la 'No-Zone' más grande y peligrosa porque se extiende
    a través de varios carriles.
- id: 167
  category: sharing_the_road
  question: Al rebasar a un ciclista en Idaho, ¿cuánto espacio debe dejar entre su
    vehículo y la bicicleta?
  choices:
    A: Al menos 1 pie
    B: Al menos 3 pies
    C: Un mínimo de 6 pies
    D: No hay una distancia específica, solo no los golpee
  answer: B
  explanation: Aunque la ley de Idaho exige una 'distancia segura', el Manual del
    Conductor de Idaho y las pautas de seguridad especifican que debe dejar al menos
    3 pies de espacio al rebasar a un ciclista.
- id: 168
  category: sharing_the_road
  question: Usted está conduciendo en una carretera de dos carriles y un autobús escolar
    está detenido con sus luces rojas intermitentes y el brazo de parada extendido.
    ¿Qué vehículos deben detenerse?
  choices:
    A: Solo los vehículos que siguen al autobús
    B: Solo los vehículos que se aproximan por el frente
    C: Los vehículos en ambas direcciones deben detenerse
    D: Nadie está obligado a detenerse si el límite de velocidad es superior a 35
      mph
  answer: C
  explanation: En una carretera de dos carriles, el tráfico en ambas direcciones debe
    detenerse ante un autobús escolar que tenga sus luces rojas intermitentes encendidas
    y el brazo de parada extendido.
- id: 169
  category: sharing_the_road
  question: Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima por detrás, ¿qué debe hacer?
  choices:
    A: Detenerse inmediatamente en su carril actual
    B: Orillarse al borde más cercano de la carretera (generalmente a la derecha)
      y detenerse
    C: Acelerar para salir del camino
    D: Moverse al carril izquierdo y disminuir la velocidad
  answer: B
  explanation: La ley de Idaho exige que los conductores cedan el derecho de paso
    a los vehículos de emergencia orillándose al borde o acera derecha de la carretera,
    fuera de cualquier intersección, y permaneciendo detenidos hasta que el vehículo
    haya pasado.
- id: 170
  category: sharing_the_road
  question: ¿Es legal que dos motocicletas circulen una al lado de la otra en un solo
    carril en Idaho?
  choices:
    A: No, las motocicletas siempre deben circular en formación escalonada
    B: Sí, las motocicletas pueden circular no más de dos a la par en un solo carril
    C: Sí, pero solo en calles residenciales
    D: No, se considera división de carril (lane splitting) y es ilegal
  answer: B
  explanation: El Código de Idaho 49-662 permite que las motocicletas operen no más
    de dos a la par en un solo carril.
- id: 171
  category: sharing_the_road
  question: 'Si ve a un peatón que usa un bastón blanco o un perro guía, usted debe:'
  choices:
    A: Tocar la bocina para hacerle saber que usted está allí
    B: Detenerse y ceder el paso
    C: Rodearlo si hay suficiente espacio
    D: Esperar a que le haga una señal para pasar
  answer: B
  explanation: Los conductores deben ceder el paso a cualquier peatón ciego que lleve
    un bastón blanco o que vaya acompañado de un perro guía.
- id: 172
  category: sharing_the_road
  question: ¿Por qué debe tener precaución adicional cuando un camión grande gira
    a la derecha en una intersección?
  choices:
    A: Los camiones siempre tienen el derecho de paso sobre los automóviles
    B: Los camiones pueden necesitar abrirse hacia la izquierda para no chocar con
      el bordillo
    C: Se requiere que los camiones se detengan antes de cada giro a la derecha
    D: Los camiones aceleran más rápido que los automóviles durante los giros
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha sin golpear el bordillo u otros objetos. Los
    conductores nunca deben intentar meterse entre un camión que gira y el bordillo.
- id: 173
  category: sharing_the_road
  question: Bajo la ley "Idaho Stop", ¿cómo debe tratar un ciclista una señal de alto
    en una intersección?
  choices:
    A: Debe detenerse por completo y esperar a todo el resto del tráfico.
    B: Puede tratarla como una señal de ceder el paso, disminuyendo la velocidad y
      continuando sin detenerse si es seguro.
    C: Debe detenerse solo si hay vehículos motorizados a menos de 100 pies.
    D: Debe detenerse y esperar al menos tres segundos antes de continuar.
  answer: B
  explanation: La ley de Idaho (49-720) permite a los ciclistas tratar las señales
    de alto como señales de ceder el paso. Deben disminuir la velocidad y, si es necesario
    por seguridad, detenerse. Si la intersección está despejada, pueden continuar
    sin detenerse por completo.
- id: 174
  category: sharing_the_road
  question: En Idaho, cuando un autobús escolar se detiene en una carretera de cuatro
    o más carriles (al menos dos en cada dirección), ¿qué tráfico debe detenerse?
  choices:
    A: El tráfico en todos los carriles y en ambas direcciones debe detenerse.
    B: Solo el tráfico que sigue al autobús debe detenerse.
    C: Solo el tráfico en el carril inmediatamente al lado del autobús debe detenerse.
    D: El tráfico que sigue al autobús y el tráfico en los carriles contrarios deben
      detenerse.
  answer: B
  explanation: En una carretera de cuatro o más carriles, el tráfico que sigue al
    autobús debe detenerse cuando las luces rojas parpadean y el brazo de parada está
    extendido. El tráfico que viene en sentido contrario no está obligado a detenerse,
    pero debe permanecer alerta.
- id: 175
  category: sharing_the_road
  question: En Idaho, ¿cuál es la distancia mínima que un automovilista debe mantener
    al rebasar a una persona que monta en bicicleta?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La ley de Idaho exige que un vehículo motorizado que rebasa a una bicicleta
    lo haga a una distancia segura, que se define como no menos de 3 pies entre cualquier
    parte del vehículo y la bicicleta.
- id: 176
  category: sharing_the_road
  question: En Idaho, ¿quién está legalmente obligado a usar casco mientras conduce
    o viaja en una motocicleta?
  choices:
    A: Todos los pasajeros y conductores independientemente de su edad.
    B: Solo el conductor de la motocicleta.
    C: Cualquier persona menor de 18 años.
    D: Solo los conductores en carreteras con límites de velocidad superiores a 55
      mph.
  answer: C
  explanation: La ley de Idaho exige que los conductores y pasajeros de motocicletas
    menores de 18 años usen un casco que cumpla con los estándares del DOT.
- id: 177
  category: sharing_the_road
  question: Al seguir a un camión comercial grande, ¿por qué es importante mantenerse
    fuera de su "Zona Ciega" (No-Zone)?
  choices:
    A: Para evitar los gases de escape del camión.
    B: Porque el conductor del camión no puede verlo en estos puntos ciegos.
    C: Para evitar que el camión disminuya la velocidad.
    D: Porque es ilegal conducir en el carril derecho junto a un camión.
  answer: B
  explanation: La "Zona Ciega" (No-Zone) se refiere a los grandes puntos ciegos alrededor
    de un camión (delante, detrás y a los lados) donde el conductor no puede ver otros
    vehículos. Si usted no puede ver los espejos laterales del camión, el conductor
    no puede verlo a usted.
- id: 178
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima legal de seguimiento que debe mantener detrás
    de un camión de bomberos que responde a una alarma en Idaho?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Idaho prohíbe seguir a un camión de bomberos que viaja en
    respuesta a una alarma de incendio a una distancia menor de 500 pies.
- id: 179
  category: sharing_the_road
  question: 'Si usted está conduciendo y un peatón con un bastón blanco o un perro
    guía comienza a cruzar la calle, usted debe:'
  choices:
    A: Tocar la bocina para hacerle saber que usted está allí.
    B: Detenerse y cederle el paso, incluso si no está en un cruce de peatones marcado.
    C: Rodearlo si hay suficiente espacio.
    D: Esperar a que cruce solo si el semáforo está en verde para él.
  answer: B
  explanation: Los conductores deben ceder el paso a cualquier peatón ciego que lleve
    un bastón blanco o use un perro guía. Debe detenerse y permanecer detenido hasta
    que el peatón haya cruzado de manera segura.
- id: 180
  category: sharing_the_road
  question: En Idaho, ¿cuántas motocicletas están legalmente autorizadas a circular
    una al lado de la otra (en paralelo) en un solo carril?
  choices:
    A: Solo una; deben circular en fila india.
    B: Hasta dos.
    C: Hasta tres.
    D: Tantas como quepan de forma segura.
  answer: B
  explanation: La ley de Idaho permite que dos motocicletas circulen en paralelo en
    un solo carril, siempre que ambos conductores consientan el acuerdo.
- id: 181
  category: sharing_the_road
  question: 'Cuando un cortejo fúnebre es encabezado por un vehículo de escolta funeraria
    con luces intermitentes, los demás conductores deben:'
  choices:
    A: Ceder el paso a todos los vehículos del cortejo.
    B: Solo ceder el paso al vehículo principal.
    C: Rebasar el cortejo solo por el lado derecho.
    D: Unirse al cortejo para pasar los semáforos más rápido.
  answer: A
  explanation: En Idaho, los vehículos en un cortejo fúnebre tienen el derecho de
    paso en las intersecciones cuando siguen al vehículo principal, independientemente
    de los dispositivos de control de tráfico, siempre que tengan sus luces delanteras
    encendidas. Los demás conductores deben ceder el paso.
- id: 182
  category: vehicle_information
  question: 'Según el Manual del Conductor de Idaho, las luces delanteras de su vehículo
    deben estar encendidas desde el atardecer hasta el amanecer o cuando la visibilidad
    sea inferior a:'
  choices:
    A: 200 feet
    B: 350 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: La ley de Idaho exige que las luces delanteras estén encendidas desde
    el atardecer hasta el amanecer, y en cualquier otro momento en que la visibilidad
    se limite a menos de 500 pies.
- id: 183
  category: vehicle_information
  question: Según la ley de Idaho, el freno de pie de su vehículo debe ser capaz de
    detener el vehículo en cuántos pies cuando viaja a 25 mph?
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 50 feet
  answer: B
  explanation: Los estándares de equipo de Idaho exigen que el freno de servicio (de
    pie) sea capaz de detener el vehículo en un tramo de 25 pies desde una velocidad
    de 25 mph en un pavimento seco y nivelado.
- id: 184
  category: vehicle_information
  question: La ley de Idaho exige que todo vehículo motorizado esté equipado con un
    espejo que permita al conductor ver la carretera al menos a cuántos pies hacia
    atrás?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Todo vehículo motorizado debe tener un espejo ubicado de manera que
    refleje al conductor una vista de la carretera a una distancia de al menos 200
    pies hacia atrás.
- id: 185
  category: vehicle_information
  question: ¿Cuál es el oscurecimiento máximo permitido para el tinte de las ventanas
    laterales delanteras (conductor y pasajero delantero) en Idaho?
  choices:
    A: 20% de transmisión de luz
    B: 35% de transmisión de luz
    C: 50% de transmisión de luz
    D: 70% de transmisión de luz
  answer: B
  explanation: El Código de Idaho 49-944 especifica que las ventanas laterales delanteras
    deben tener una transmisión de luz no inferior al 35%.
- id: 186
  category: vehicle_information
  question: En Idaho, ¿cuál es la transmisión de luz mínima permitida para las ventanas
    laterales traseras y la ventana trasera de un vehículo motorizado?
  choices:
    A: 5%
    B: 20%
    C: 35%
    D: 50%
  answer: B
  explanation: Para las ventanas laterales traseras y la ventana trasera, la ley de
    Idaho permite un tinte más oscuro, pero debe permitir al menos un 20% de transmisión
    de luz.
- id: 187
  category: vehicle_information
  question: 'Todo vehículo motorizado en Idaho debe tener una bocina que se pueda
    escuchar desde una distancia de al menos:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: La ley de Idaho exige que los vehículos estén equipados con una bocina
    en buen estado de funcionamiento capaz de emitir un sonido audible en condiciones
    normales desde una distancia no inferior a 200 pies.
- id: 188
  category: vehicle_information
  question: Si una carga se extiende más de ____ pies más allá de la parte trasera
    de la carrocería de un vehículo en Idaho, se debe colocar una bandera roja (día)
    o una luz roja (noche) al final de la carga.
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Siempre que la carga de cualquier vehículo se extienda hacia atrás
    cuatro pies o más más allá de la plataforma o carrocería del vehículo, se debe
    mostrar una bandera roja o una luz roja en el extremo posterior de la carga.
- id: 189
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para vehículos de pasajeros en Idaho?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros en Idaho si están desgastados
    hasta el punto en que queda menos de 2/32 de pulgada de banda de rodadura.
- id: 190
  category: vehicle_information
  question: En Idaho, ¿cuál es la altura máxima permitida para cualquier vehículo,
    incluida su carga, sin un permiso especial?
  choices:
    A: 13 feet, 6 inches
    B: 14 feet, 0 inches
    C: 14 feet, 6 inches
    D: 15 feet, 0 inches
  answer: B
  explanation: En Idaho, la altura máxima para un vehículo y su carga es de 14 pies,
    a menos que se obtenga un permiso especial para exceso de dimensiones legales.
- id: 191
  category: vehicle_information
  question: ¿Según la ley de Idaho, en qué tipos de vehículos se requieren guardabarros
    o cubiertas (mudguards) para evitar las salpicaduras de lodo o agua?
  choices:
    A: Solo motocicletas
    B: Solo camiones semirremolques comerciales
    C: Todos los vehículos motorizados, camiones y remolques
    D: Solo vehículos con neumáticos de gran tamaño
  answer: C
  explanation: El Código de Idaho 49-949 exige que todos los vehículos motorizados,
    camiones y remolques estén equipados con guardabarros, cubiertas o dispositivos
    que incluyan faldones o protectores contra salpicaduras para minimizar eficazmente
    el rociado o la salpicadura de agua o lodo hacia la parte trasera.
- id: 192
  category: vehicle_information
  question: Al seguir a otro vehículo en Idaho, ¿a cuántos pies de distancia del vehículo
    de adelante debe bajar sus luces altas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Idaho exige que los conductores cambien a luces bajas cuando
    sigan a otro vehículo a una distancia de 200 pies o menos.
- id: 193
  category: vehicle_information
  question: En Idaho, ¿su espejo retrovisor debe proporcionar una vista de la carretera
    de al menos cuántos pies hacia la parte trasera del vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Idaho exige al menos un espejo que permita al conductor ver
    la carretera a una distancia de al menos 200 pies hacia atrás.
- id: 194
  category: vehicle_information
  question: ¿Cuál es el porcentaje mínimo de transmisión de luz requerido para el
    polarizado de las ventanas laterales delanteras de un vehículo en Idaho?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: El Código de Idaho 49-944 especifica que el polarizado de las ventanas
    laterales delanteras debe permitir el paso de al menos el 35% de la luz.
- id: 195
  category: vehicle_information
  question: 'En Idaho, los neumáticos se consideran inseguros y deben reemplazarse
    si la profundidad de la banda de rodadura es inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Idaho exige que los neumáticos tengan al menos 2/32 de pulgada
    de profundidad de banda de rodadura en las ranuras principales.
- id: 196
  category: vehicle_information
  question: Al conducir en una carretera con un límite de velocidad de 45 mph o más,
    la ley de Idaho exige que señale su intención de girar durante al menos ____ antes
    de girar.
  choices:
    A: 100 pies
    B: 200 pies
    C: 5 segundos
    D: 10 segundos
  answer: C
  explanation: Si bien la regla general es de 100 pies, la ley de Idaho exige específicamente
    una señal de al menos 5 segundos antes de realizar un giro o cambio de carril
    cuando se viaja por una carretera o autopista.
- id: 197
  category: vehicle_information
  question: 'En Idaho, la placa de matrícula trasera debe estar iluminada por una
    luz blanca para que sea claramente legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El Código de Idaho 49-905 exige una luz trasera o una lámpara separada
    para iluminar la placa de registro trasera con una luz blanca, haciéndola visible
    desde 50 pies hacia atrás.
- id: 198
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para los parabrisas según la ley
    de Idaho?
  choices:
    A: Deben estar hechos de vidrio de seguridad
    B: Deben estar libres de cualquier calcomanía, excepto las requeridas por la ley
    C: Deben estar equipados con limpiaparabrisas que funcionen
    D: Todas las anteriores
  answer: D
  explanation: La ley de Idaho exige que los parabrisas estén hechos de vidrio de
    seguridad, equipados con limpiaparabrisas que funcionen y se mantengan libres
    de obstrucciones o calcomanías no autorizadas.
- id: 199
  category: signs_and_signals
  question: Según la ley de 'Detenerse-Girar-Ceder el paso' de Idaho (Código de Idaho
    49-720), ¿qué debe hacer un ciclista al acercarse a una señal de alto?
  choices:
    A: Detenerse por completo durante al menos 3 segundos
    B: Reducir la velocidad y, si es necesario por seguridad, detenerse; de lo contrario,
      continuar a través de la intersección sin detenerse
    C: Bajarse y caminar con la bicicleta a través de la intersección
    D: Detenerse solo si hay un vehículo motorizado a menos de 100 pies
  answer: B
  explanation: Según el Código de Idaho 49-720, una persona que opera una bicicleta
    y se aproxima a una señal de alto debe reducir la velocidad y, si es necesario
    por seguridad, detenerse. Si no es necesario por seguridad, puede ceder el paso
    y continuar sin detenerse.
- id: 200
  category: signs_and_signals
  question: En Idaho, ¿qué debe hacer un ciclista al acercarse a un semáforo con luz
    roja fija?
  choices:
    A: Tratarla como una señal de ceder el paso y continuar sin detenerse
    B: Esperar a que la luz cambie a verde independientemente del tráfico
    C: Detenerse, ceder el paso a todo el resto del tráfico y continuar a través de
      la luz roja con precaución
    D: Realizar solo un giro a la derecha; seguir recto está prohibido
  answer: C
  explanation: La ley de Idaho permite a los ciclistas tratar una luz roja como una
    señal de alto. Deben detenerse y ceder el paso a todo el resto del tráfico en
    la intersección antes de continuar recto o girar a la izquierda.
- id: 201
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico con una flecha amarilla intermitente
    en Idaho?
  choices:
    A: Tiene el derecho de paso para girar
    B: Se permiten los giros, pero primero debe ceder el paso al tráfico en sentido
      contrario y a los peatones
    C: La señal está a punto de cambiar a rojo; debe detenerse inmediatamente
    D: El carril de giro está cerrado
  answer: B
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero debe ceder el paso al tráfico en sentido contrario y a los
    peatones. El tráfico en sentido contrario tiene luz verde.
- id: 202
  category: signs_and_signals
  question: En Idaho, ¿qué indica una línea amarilla continua en su lado de la línea
    central?
  choices:
    A: Puede rebasar si el camino por delante está despejado
    B: Está prohibido rebasar
    C: Se encuentra en un carril para vehículos de alta ocupación (HOV)
    D: Debe reducir la velocidad a 25 mph
  answer: B
  explanation: Una línea amarilla continua en su lado de la línea central significa
    que está prohibido rebasar para los vehículos que viajan en su dirección.
- id: 203
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de banderín (un triángulo
    isósceles que apunta a la derecha) que se encuentra en el lado izquierdo de la
    carretera?
  choices:
    A: Ceder el paso (Yield Right of Way)
    B: Zona escolar más adelante
    C: Zona de no rebasar (No Passing Zone)
    D: Cruce de ferrocarril
  answer: C
  explanation: Una señal en forma de banderín se coloca en el lado izquierdo de la
    carretera para marcar el comienzo de una 'Zona de no rebasar' (No Passing Zone).
- id: 204
  category: signs_and_signals
  question: Cuando ve un emblema de 'Vehículo de movimiento lento' (un triángulo naranja
    con un borde rojo reflectante) en un vehículo, ¿significa que el vehículo viaja
    a qué velocidad?
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: Exactamente 10 mph
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio en todos
    los vehículos diseñados para operar a velocidades de 25 mph o menos.
- id: 205
  category: signs_and_signals
  question: 'En Idaho, si está girando en una intersección donde el semáforo está
    apagado (no funciona), usted debe:'
  choices:
    A: Tratar la intersección como una parada de cuatro vías (four-way stop)
    B: Ceder el paso solo al tráfico a su derecha
    C: Mantener su velocidad y proceder con precaución
    D: Esperar a que un oficial de policía dirija el tráfico
  answer: A
  explanation: Si un semáforo no está funcionando, debe tratar la intersección como
    una parada de cuatro vías, cediendo el paso al conductor que llegó primero o al
    conductor de la derecha si llegan al mismo tiempo.
- id: 206
  category: signs_and_signals
  question: ¿Qué indican los 'Sharrows' (marcas en el pavimento que muestran una bicicleta
    con dos galones arriba) a los conductores de Idaho?
  choices:
    A: El carril está reservado exclusivamente para bicicletas
    B: Las bicicletas están prohibidas en este carril
    C: El carril es compartido; los automovilistas deben esperar ver y compartir el
      carril con los ciclistas
    D: Los ciclistas deben permanecer en el acotamiento (shoulder)
  answer: C
  explanation: Las marcas de carril compartido, o 'Sharrows', se utilizan para alertar
    a los automovilistas de que los ciclistas pueden ocupar el carril completo y para
    ayudar a los ciclistas a posicionarse de manera segura.
- id: 207
  category: signs_and_signals
  question: 'Para indicar un giro a la derecha usando señales manuales, un conductor
    de Idaho debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera de la ventana
    B: Extender el brazo izquierdo hacia afuera y apuntar hacia arriba
    C: Extender el brazo izquierdo hacia afuera y apuntar hacia abajo
    D: Extender el brazo derecho recto hacia afuera de la ventana
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido hacia afuera de la ventana y doblado hacia arriba en el codo.
- id: 208
  category: signs_and_signals
  question: ¿Qué indica una luz amarilla fija en un semáforo en Idaho?
  choices:
    A: La luz está a punto de cambiar a verde
    B: Debe acelerar para despejar la intersección
    C: La luz roja está a punto de aparecer; despeje la intersección o deténgase si
      puede hacerlo de manera segura
    D: Los peatones tienen el derecho de paso
  answer: C
  explanation: Una luz amarilla fija significa que la señal está cambiando a rojo.
    Debe detenerse si es seguro hacerlo; de lo contrario, debe despejar la intersección.
- id: 209
  category: signs_and_signals
  question: En Idaho, ¿de qué color son las señales que se utilizan para proporcionar
    información sobre servicios como gasolina, comida y alojamiento?
  choices:
    A: Verde
    B: Azul
    C: Marrón
    D: Amarillo
  answer: B
  explanation: Las señales azules se utilizan para servicios al automovilista, como
    combustible, comida, alojamiento y hospitales.
- id: 210
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla redonda con una 'X' negra y las letras
    'RR'?
  choices:
    A: Un giro brusco más adelante
    B: Un cruce de ferrocarril más adelante
    C: Una zona de construcción vial
    D: Una calzada restringida
  answer: B
  explanation: La señal amarilla redonda es una señal de advertencia que indica que
    se está acercando a un cruce de ferrocarril.
- id: 211
  category: signs_and_signals
  question: Cuando se coloca una señal de 'No Rebasar' (Do Not Pass), ¿dónde se ubica
    generalmente en relación con las marcas del pavimento?
  choices:
    A: Solo donde hay líneas blancas discontinuas
    B: Al comienzo de una zona donde está prohibido rebasar
    C: Solo en autopistas de carriles múltiples
    D: Cada 500 pies en una zona de construcción
  answer: B
  explanation: Una señal de 'No Rebasar' (Do Not Pass) es una señal reguladora que
    se coloca al inicio de una zona donde no es seguro o es ilegal rebasar a otros
    vehículos.
- id: 212
  category: signs_and_signals
  question: ¿Cuál es el propósito de una línea blanca continua pintada a través de
    un carril en una intersección?
  choices:
    A: Marca únicamente el cruce de peatones
    B: Indica dónde debe detenerse ante una señal de alto o una luz roja
    C: Indica un carril exclusivo para bicicletas
    D: Marca el borde de la carretera
  answer: B
  explanation: Una línea de parada blanca continua (o 'línea de límite') indica dónde
    debe detener su vehículo cuando así lo ordene una señal de alto o un semáforo.
- id: 213
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente en una intersección de
    Idaho?
  choices:
    A: Usted tiene el derecho de paso para girar a la izquierda
    B: Debe detenerse y esperar a una flecha verde
    C: Se permiten los giros, pero primero debe ceder el paso al tráfico en sentido
      contrario y a los peatones
    D: El semáforo está descompuesto y debe tratarse como una parada de cuatro vías
  answer: C
  explanation: En Idaho, una flecha amarilla intermitente significa que se permiten
    los giros a la izquierda, pero primero debe ceder el paso al tráfico en sentido
    contrario y a los peatones, y luego proceder con precaución.
- id: 214
  category: signs_and_signals
  question: Cuando ve una señal con forma de pentágono (cinco lados) mientras conduce
    en Idaho, ¿qué indica?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Un requisito de ceder el paso
  answer: C
  explanation: La forma de cinco lados (pentágono) se utiliza exclusivamente para
    zonas escolares y cruces escolares en Idaho.
- id: 215
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para un giro a la derecha en Idaho?
  choices:
    A: Brazo izquierdo extendido directamente hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba en un ángulo de 90 grados
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho extendido directamente hacia afuera de la ventana
  answer: B
  explanation: Para señalar un giro a la derecha mediante señales manuales, el conductor
    debe extender el brazo izquierdo por la ventana y doblarlo hacia arriba a la altura
    del codo.
- id: 216
  category: signs_and_signals
  question: En Idaho, ¿cómo es el emblema de 'Vehículo de Movimiento Lento' (Slow
    Moving Vehicle)?
  choices:
    A: Una señal naranja cuadrada
    B: Una señal amarilla circular con una 'X'
    C: Un triángulo naranja fluorescente con un borde rojo reflectante
    D: Una señal verde en forma de diamante
  answer: C
  explanation: El emblema de vehículo de movimiento lento es una señal triangular
    de color naranja fluorescente con un borde rojo reflectante, que se utiliza en
    vehículos que viajan a 25 mph o menos.
- id: 217
  category: signs_and_signals
  question: Cuando encuentra líneas blancas continuas dobles en una carretera de Idaho,
    ¿qué significan?
  choices:
    A: Puede cruzarlas para cambiar de carril si es seguro
    B: Separan el tráfico que se mueve en direcciones opuestas
    C: Está prohibido cruzar las líneas
    D: Indican únicamente un carril para bicicletas
  answer: C
  explanation: Las líneas blancas continuas dobles indican que los cambios de carril
    están prohibidos. Debe permanecer en su carril.
- id: 218
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para indicar que está disminuyendo la
    velocidad o deteniéndose en Idaho?
  choices:
    A: Brazo izquierdo extendido directamente hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Mover la mano izquierda en movimiento circular
  answer: C
  explanation: Para señalar que está disminuyendo la velocidad o deteniéndose, extienda
    el brazo izquierdo hacia abajo con la palma de la mano hacia atrás.
- id: 219
  category: signs_and_signals
  question: ¿Qué representa una señal naranja en forma de diamante en Idaho?
  choices:
    A: Información reguladora
    B: Zonas escolares
    C: Advertencias de construcción o mantenimiento
    D: Áreas recreativas
  answer: C
  explanation: El naranja es el color estándar para las señales de advertencia de
    construcción y mantenimiento en Idaho.
- id: 220
  category: signs_and_signals
  question: En Idaho, si está girando en una intersección y el semáforo es un círculo
    verde (no una flecha), pero hay tráfico en sentido contrario, ¿qué debe hacer?
  choices:
    A: Girar inmediatamente ya que usted tiene el derecho de paso
    B: Detenerse y esperar a que la luz cambie a rojo, luego girar
    C: Ceder el paso al tráfico en sentido contrario y proceder cuando haya un espacio
      seguro
    D: Tocar la bocina para advertir al tráfico en sentido contrario que se detenga
  answer: C
  explanation: Una luz circular verde significa que puede proceder, pero si está girando
    a la izquierda, debe ceder el derecho de paso a los vehículos que vienen en sentido
    contrario y a los peatones en el cruce peatonal.
- id: 221
  category: signs_and_signals
  question: ¿Qué significa una señal de 'Aspa' (Crossbuck) en un cruce de ferrocarril
    en Idaho?
  choices:
    A: Detenerse solo si un tren es visible
    B: Lo mismo que una señal de ceda el paso; debe ceder el paso a cualquier tren
      que se aproxime
    C: Acelerar para cruzar las vías rápidamente
    D: El cruce ya no está en uso
  answer: B
  explanation: La señal de aspa de ferrocarril es una señal reglamentaria que requiere
    que los conductores cedan el derecho de paso a los trenes. Si hay más de una vía,
    el número de vías se indicará debajo del aspa.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 222
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 223
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 224
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 225
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal en blanco y negro de UNA VÍA (ONE WAY) con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 226
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 227
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 228
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 229
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro con forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 230
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que deben hacer los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha únicamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 231
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 232
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 233
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 234
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 235
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 236
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de tren. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 237
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 238
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 239
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 240
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros adelante
    D: Una colina adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 241
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 242
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente adelante
    B: La carretera se estrecha adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la carretera y
    ajuste su posición en el carril.
  id: 243
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera adelante se convierte en una autopista
    dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase a
    la derecha.
  id: 244
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación adelante
    D: Construcción de carretera adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 245
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento adelante
    C: Tráfico en ambos sentidos adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 246
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 247
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente empinada adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente empinada adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 248
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de pare (STOP) adelante
    B: Un semáforo adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 249
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de pare (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de pare (STOP) adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    pare.
  id: 250
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 251
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 252
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un carril nuevo; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un carril nuevo se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 253
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 254
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para discapacitados válida pueden
    estacionarse en estos espacios. Las infracciones conllevan multas elevadas.
  id: 255
