metadata:
  source: Idaho Driver's Handbook (Jul 2025) (itd.idaho.gov)
  total_questions: 349
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: How many days do new residents have to apply for an Idaho driver's license
    after moving to the state?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to the manual, upon moving to Idaho, you will need to apply
    for an Idaho driver's license within 30 days of residing in Idaho.
- id: 2
  category: license_system
  question: What must a person under 17 years of age successfully complete before
    being licensed in Idaho?
  choices:
    A: Only a written knowledge test
    B: An approved driver's training program and the graduated driver's license program
    C: A defensive driving course and a vision test
    D: 100 hours of supervised driving with a parent
  answer: B
  explanation: The manual states that if you are under 17 years of age, you must first
    successfully complete an approved driver's training program and the graduated
    driver's license program.
- id: 3
  category: license_system
  question: Where can an Idaho driver obtain an international driving permit?
  choices:
    A: The Idaho Transportation Department (ITD)
    B: Any county DMV office
    C: The American Automobile Association (AAA)
    D: The Department of Homeland Security
  answer: C
  explanation: ITD does not issue international driving permits. Customers need to
    contact the American Automobile Association (AAA) to obtain these permits.
- id: 4
  category: license_system
  question: Are out-of-state college students attending school in Idaho required to
    obtain an Idaho driver's license?
  choices:
    A: Yes, within 30 days of starting classes.
    B: Yes, if they are employed part-time in Idaho.
    C: No, as long as they hold a valid license from another state and claim residency
      there.
    D: No, but they must register their vehicle in Idaho immediately.
  answer: C
  explanation: Students attending a college or university in Idaho who hold a valid
    driver's license from another state and who claim residency in that state are
    not required to obtain an Idaho driver's license.
- id: 5
  category: license_system
  question: Which of the following individuals is exempt from obtaining an Idaho driver's
    license?
  choices:
    A: A new resident who has lived in Idaho for 45 days.
    B: An active duty U.S. Military member claiming residency in another state with
      a valid out-of-state license.
    C: A 16-year-old who has not completed driver's training.
    D: A commercial driver who moved to Idaho 60 days ago.
  answer: B
  explanation: U.S. Military on active duty, their spouse, and dependents who hold
    a valid driver's license from another state and who claim residency in that state
    are not required to obtain an Idaho driver's license.
- id: 6
  category: driver_testing
  question: What is the fee for a driver's license Knowledge Test in Idaho?
  choices:
    A: $5.00
    B: $15.00
    C: $20.00
    D: $35.00
  answer: A
  explanation: The fee schedule in the manual lists the Knowledge Test fee as $5.00.
- id: 7
  category: license_system
  question: What discount is available for eligible customers who renew their driver's
    license online?
  choices:
    A: A $5.00 discount off driver's licenses and identification cards.
    B: A $10.00 discount off driver's licenses only.
    C: A $5.00 discount off driver's licenses only.
    D: A 50% discount off the total renewal fee.
  answer: C
  explanation: Eligible customers who renew online qualify for a $5.00 discount off
    their driver's license renewal. The manual notes that the discount only applies
    to driver's licenses and not identification cards.
- id: 8
  category: driver_testing
  question: If you fail a test and need to retake it, how much will the retest fee
    be?
  choices:
    A: Half the price of the original test.
    B: Retests are free of charge.
    C: The same as the original test fee.
    D: Double the original test fee.
  answer: C
  explanation: 'The manual explicitly states: ''Note: All Retest Fees are the Same
    as the Original Test Fees.'''
- id: 9
  category: driver_testing
  question: How much is the total fee for a Class D Skills Test, and how is it distributed?
  choices:
    A: $35.00 total; all paid to the county DMV.
    B: $35.00 total; $6.50 to the county DMV and up to $28.50 to the Skills Test Examiner.
    C: $20.00 total; $10 to the DMV and $10 to the Examiner.
    D: $200.00 total; $10 to the DMV and $190 to the Examiner.
  answer: B
  explanation: The fee for a Class D Skills Test is $35.00, with $6.50 paid to the
    county DMV and up to $28.50 paid to the Skills Test Examiner.
- id: 10
  category: license_system
  question: How long does a new resident with a Commercial Driver's License (CDL)
    have to get licensed in Idaho?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: 'The manual states: ''If you have a Commercial Driver''s License (CDL),
    you are required to be licensed in Idaho within 30 days of residing in Idaho.'''
- id: 11
  category: license_system
  question: What is the fee to obtain a duplicate Class D driver's license?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: D
  explanation: The fee schedule lists the cost of a duplicate Class D driver's license
    as $20.00.
- id: 12
  category: driver_testing
  question: How must skills test examiners handle applicants with disabilities?
  choices:
    A: They must provide an equal skills test to all applicants regardless of the
      existence of a disability.
    B: They issue a restricted license without requiring a skills test.
    C: They require applicants with disabilities to take only the knowledge test.
    D: They charge an additional fee for reasonable accommodations.
  answer: A
  explanation: The manual states that skills test examiners must provide an equal
    skills test to all applicants regardless of the existence of a disability.
- id: 13
  category: driver_testing
  question: What is the total fee for a Commercial Driver's License (CDL) Skills Test?
  choices:
    A: $35.00
    B: $60.00
    C: $100.00
    D: $200.00
  answer: D
  explanation: The fee for a CDL Skills Test is $200.00 ($10 paid to county DMV and
    up to $190 to the Skills Test Examiner).
- id: 14
  category: license_system
  question: What is the age requirement to be eligible for an 8-year Class D driver's
    license?
  choices:
    A: Age 18 to 21
    B: Age 21 to 62
    C: Age 65 and over
    D: Under age 18
  answer: B
  explanation: The fee schedule indicates that the 8-year Class D driver's license
    is available for individuals age 21 to 62.
- id: 15
  category: defensive_driving
  question: According to the Idaho Driver's Handbook, what is necessary to safely
    operate a motor vehicle smoothly and defensively?
  choices:
    A: Driving only during daylight hours.
    B: Knowing, understanding, and following Idaho's traffic laws.
    C: Upgrading to a Commercial Driver's License.
    D: Memorizing the exact language of Idaho statutes.
  answer: B
  explanation: 'The introduction states: ''By knowing, understanding, and following
    Idaho''s traffic laws, you will be able to safely operate a motor vehicle smoothly,
    defensively, with common sense and in a variety of traffic situations.'''
- id: 16
  category: license_system
  question: According to the manual, if an applicant is under 18 years old, what specific
    requirement must be met when applying for a credential?
  choices:
    A: Proof of Completion of Driver's Training
    B: A Liability Signer
    C: A STAR Card
    D: A Veteran's Designation
  answer: B
  explanation: The manual specifies that a Liability Signer is required if the applicant
    is under 18.
- id: 17
  category: license_system
  question: If an applicant is under 17 years old, what specific documentation is
    required?
  choices:
    A: Proof of Completion of Driver's Training
    B: Proof of Vehicle Ownership
    C: Proof of Selective Service Registration
    D: Proof of Medical Certification
  answer: A
  explanation: The manual states that Proof of Completion of Driver's Training is
    required if the applicant is under 17.
- id: 18
  category: license_system
  question: What does the acronym VOC stand for in the context of obtaining an Idaho
    license?
  choices:
    A: Vehicle Operating Certification
    B: Verification of School Compliance
    C: Visual/Medical Certification
    D: Veteran's Official Credential
  answer: B
  explanation: In the manual's licensing section, VOC stands for Verification of School
    Compliance.
- id: 19
  category: license_system
  question: In Idaho, what class of license is considered a standard "Non-Commercial"
    license?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class D
  answer: D
  explanation: The manual designates the Class D license as Non-Commercial for both
    Knowledge and Skills tests.
- id: 20
  category: driver_testing
  question: During the driving skills test, what does the acronym CDE stand for?
  choices:
    A: Critical Driving Errors
    B: Commercial Driver Evaluation
    C: Certified Driving Examiner
    D: Controlled Driving Environment
  answer: A
  explanation: The manual lists Critical Driving Errors (CDE) as a specific section
    under the driving skills test.
- id: 21
  category: license_system
  question: Which of the following is a designation that can be added to your Idaho
    credential?
  choices:
    A: Student Designation
    B: Permanent Disability Notation
    C: Safe Driver Notation
    D: Commuter Designation
  answer: B
  explanation: A Permanent Disability Notation is listed in the manual as one of the
    specific designations that can be added to credentials.
- id: 22
  category: safe_driving_rules
  question: What traveler services system is available to drivers in Idaho?
  choices:
    A: 311 Traveler Services
    B: 411 Traveler Services
    C: 511 Traveler Services
    D: 911 Traveler Services
  answer: C
  explanation: The manual specifically mentions Idaho's 511 Traveler Services as a
    resource for drivers.
- id: 23
  category: vehicle_information
  question: According to the Vehicle Equipment & Safety section, which of the following
    is explicitly stated as required?
  choices:
    A: Fog Lights
    B: Child Restraints
    C: Window Tinting
    D: Snow Tires
  answer: B
  explanation: The Vehicle Equipment & Safety section explicitly states that "Child
    Restraints are Required."
- id: 24
  category: defensive_driving
  question: Which of the following is a specific program or topic covered under "The
    Driving Task" section of the manual?
  choices:
    A: Alive at 25
    B: Drive at 55
    C: Safe at 16
    D: Survive at 65
  answer: A
  explanation: '"Alive at 25" is listed as a specific topic under The Driving Task
    section of the manual.'
- id: 25
  category: defensive_driving
  question: What dangerous phenomenon is specifically associated with fatigue while
    driving?
  choices:
    A: Hydroplaning
    B: Highway Hypnosis
    C: Flash Floods
    D: Open Range
  answer: B
  explanation: The manual pairs Fatigue with Highway Hypnosis as a specific driving
    hazard.
- id: 26
  category: defensive_driving
  question: What driving hazard is specifically associated with rain in the manual?
  choices:
    A: Skidding
    B: Hydroplaning
    C: Highway Hypnosis
    D: Dust
  answer: B
  explanation: The manual specifically associates rain with the hazard of hydroplaning
    in the section "Rain & Hydroplaning."
- id: 27
  category: vehicle_information
  question: What type of vehicles are grouped with "Antique Vehicles" in the equipment
    laws section?
  choices:
    A: Motorcycles
    B: Large Vehicles
    C: Street Rods
    D: Snow Removal Equipment
  answer: C
  explanation: The manual groups Antique Vehicles and Street Rods together under the
    vehicle equipment laws.
- id: 28
  category: driver_testing
  question: Which of the following is a required test for obtaining a Class D (Non-Commercial)
    license?
  choices:
    A: Medical/Visual Screening
    B: Knowledge Test
    C: Skills Test
    D: All of the above
  answer: D
  explanation: 'The Required Testing section lists Medical/Visual Screening, Knowledge
    Test: Class D, and Skills Test: Class D.'
- id: 29
  category: sharing_the_road
  question: Which of the following groups has a specific section dedicated to them
    under "Sharing the Road"?
  choices:
    A: Pets
    B: Horseback Riders
    C: Farm Tractors
    D: Birds
  answer: B
  explanation: Horseback Riders are specifically listed as a group you must share
    the road with in the manual.
- id: 30
  category: license_system
  question: When applying for an Idaho driver's license, what must you do with your
    driver's license or ID card from another state?
  choices:
    A: Keep it as a secondary form of identification
    B: Surrender it
    C: Destroy it yourself
    D: Mail it back to the issuing state
  answer: B
  explanation: When applying for an Idaho driver's license, you must surrender any
    driver's license or identification card (ID card) issued to you from another state,
    U.S. Territory, or the District of Columbia.
- id: 31
  category: driver_testing
  question: If you are transferring a license from another jurisdiction and it has
    been expired for 25 months or more, what tests are you required to pass?
  choices:
    A: Only a vision test
    B: Only a knowledge test
    C: Both a knowledge test and a skills test
    D: Only a skills test
  answer: C
  explanation: When transferring from another jurisdiction, you will be required to
    pass a Class D knowledge test, and a skills test if your license has been expired
    for 25 months or more.
- id: 32
  category: license_system
  question: If you are from a foreign country and are issued a Class D Idaho driver's
    license, are you allowed to use your foreign driver's license to operate a motor
    vehicle?
  choices:
    A: Yes, as long as it is not expired
    B: Yes, but only for the first 30 days
    C: No, doing so is a misdemeanor
    D: No, doing so is a felony
  answer: C
  explanation: You are not allowed to show or use your foreign driver's license for
    operating a motor vehicle. If you do, you could be cited and fined for a misdemeanor.
- id: 33
  category: license_system
  question: How much advance notice should you give the county DMV if you require
    reasonable accommodations for a disability?
  choices:
    A: 24 hours
    B: 48 hours
    C: One week
    D: Two weeks
  answer: D
  explanation: Please allow the county DMV two weeks to complete the arrangements
    for reasonable accommodations under the Americans with Disabilities Act (ADA).
- id: 34
  category: license_system
  question: Starting May 7, 2025, what will you need in order to fly commercially
    or enter a federal building if you do not have a valid passport?
  choices:
    A: A standard Class D license
    B: A Star Card (Idaho's Real ID)
    C: A certified birth certificate
    D: A Social Security card
  answer: B
  explanation: Starting May 7, 2025, you will not be able to fly commercially or enter
    a federal building, such as a military base or the Idaho National Laboratory,
    without a Star Card or a valid passport.
- id: 35
  category: penalties_and_points
  question: What is the penalty for the misuse or mutilation of your driver's license,
    instruction permit, or ID card?
  choices:
    A: A written warning
    B: A fine of $500
    C: A misdemeanor
    D: A felony
  answer: C
  explanation: Any misuse or mutilation of your driver's license, instruction permit,
    or ID card is a misdemeanor.
- id: 36
  category: penalties_and_points
  question: If you knowingly provide false information on a driver's license application,
    what are the consequences?
  choices:
    A: Prosecution for perjury and cancellation of your credential
    B: A mandatory 10-year prison sentence
    C: A permanent ban from driving in Idaho
    D: A warning and a requirement to reapply
  answer: A
  explanation: If you knowingly provide false information on a driver's license, ID
    card, or permit application, you are subject to prosecution for perjury and your
    credential will be canceled.
- id: 37
  category: license_system
  question: Where are Idaho driver's licenses, ID cards, and instruction permits issued?
  choices:
    A: The state capitol building
    B: County sheriff's driver's license offices
    C: Local post offices
    D: Idaho State Police headquarters
  answer: B
  explanation: Idaho driver's licenses, ID cards, and instruction permits are issued
    through the county sheriff's driver's license offices.
- id: 38
  category: license_system
  question: When taking your photograph for a new driver's license, which of the following
    are you generally required to remove?
  choices:
    A: Earrings
    B: Makeup
    C: Glasses
    D: Contact lenses
  answer: C
  explanation: Before your photo is taken at the county driver's license office, you
    will be asked to remove anything that covers your face or head (i.e. hat, mask,
    glasses).
- id: 39
  category: vehicle_information
  question: For driver's licensing purposes, a commercial vehicle is defined as a
    vehicle that has a manufactured gross vehicle weight rating of at least how many
    pounds?
  choices:
    A: 10,001 pounds
    B: 16,001 pounds
    C: 26,001 pounds
    D: 36,001 pounds
  answer: C
  explanation: A commercial vehicle, for driver's licensing purposes, is a vehicle
    that either has a manufactured gross vehicle weight rating of 26,001 pounds or
    more.
- id: 40
  category: vehicle_information
  question: A vehicle is considered a commercial vehicle if it is designed to transport
    how many passengers (including the driver)?
  choices:
    A: 8 or more
    B: 10 or more
    C: 12 or more
    D: 16 or more
  answer: D
  explanation: A commercial vehicle is one that is designed to transport 16 or more
    passengers (including the driver).
- id: 41
  category: driver_testing
  question: What tests must an applicant from a U.S. Territory pass when applying
    for an Idaho Class D driver's license?
  choices:
    A: Only the skills test
    B: Only the knowledge test
    C: Both the knowledge and skills tests
    D: Neither test is required
  answer: B
  explanation: Applicants from U.S. Territories surrender their DL from that territory
    and pass the knowledge test but they do not need to take the skills test.
- id: 42
  category: license_system
  question: At what age can someone obtain a Driver Training Permit (DT) to attend
    a public school or private driver training program?
  choices:
    A: 14 years of age
    B: 14 1/2 and under 17 years of age
    C: 15 years of age
    D: 16 years of age
  answer: B
  explanation: Driver Training Permits (DT) allow anyone 14 1/2 and under 17 years
    of age to attend any public school or private driver training program.
- id: 43
  category: license_system
  question: When does a Driver Training Permit (DT) expire for a person who obtained
    it between the ages of 14 1/2 and 17?
  choices:
    A: On their 16th birthday
    B: 6 months after issuance
    C: 5 days after the permit holder's 18th birthday
    D: On their 21st birthday
  answer: C
  explanation: The permit expires 5 days after the permit holder's 18th birthday.
- id: 44
  category: safe_driving_rules
  question: While enrolled in a driver training program, who must be in the vehicle
    for a Driver Training Permit (DT) to be valid for operation?
  choices:
    A: Any licensed driver over 21
    B: A parent or legal guardian
    C: A driver training instructor
    D: No one is required
  answer: C
  explanation: While you are enrolled in a driver training program, the DT permit
    is valid only to operate a vehicle with a driver training instructor.
- id: 45
  category: license_system
  question: How long is an instruction permit valid for individuals who are 17 1/2
    years of age and older?
  choices:
    A: 3 months (90 days)
    B: 6 months (180 days)
    C: 1 year (365 days)
    D: 2 years
  answer: B
  explanation: According to the manual, the permit expiration for people 17 1/2 years
    of age and older is 6 months (180 days).
- id: 46
  category: license_system
  question: At what age can an applicant apply for a Class D Instruction Permit without
    needing a liability signer?
  choices:
    A: 16 years of age
    B: 17 years of age
    C: 18 years of age
    D: 21 years of age
  answer: C
  explanation: The manual states that at 18 years of age, you may apply for a Class
    D Instruction Permit without a liability signer. All applicants under 18 must
    have a parent or guardian sign.
- id: 47
  category: safe_driving_rules
  question: For drivers under 16 years of age, daylight-only travel is allowed unless
    accompanied by a licensed driver who is at least 21. How does the manual define
    'daylight'?
  choices:
    A: 6:00 AM to 8:00 PM local time
    B: 5:00 AM to 10:00 PM local time
    C: Sunrise to sunset
    D: 7:00 AM to 9:00 PM local time
  answer: B
  explanation: The manual defines daylight as 5:00a to 10:00p local time for the restriction
    when under 16.
- id: 48
  category: safe_driving_rules
  question: During the first 6 months after a license is issued to a driver under
    17, what is the restriction on passengers under the age of 17?
  choices:
    A: No passengers under 17 are allowed under any circumstances.
    B: They are limited to not more than one passenger under 17, unless related by
      blood, adoption, or marriage.
    C: They may have up to three passengers under 17.
    D: They are limited to passengers under 17 only during daylight hours.
  answer: B
  explanation: During the first 6 months, the number of passengers under 17 is limited
    to not more than one, unless the passengers are related to the driver by blood,
    adoption, or marriage.
- id: 49
  category: license_system
  question: If you are 15 to 17 years of age, when will your driver's license or ID
    card expire?
  choices:
    A: On your 18th birthday
    B: Five days after your 18th birthday
    C: On your 21st birthday
    D: Five days after your 21st birthday
  answer: B
  explanation: For those 15 to 17 years of age, the driver's license or ID card will
    show 'Under 18 until month/day/year,' and will expire five days after their 18th
    birthday.
- id: 50
  category: driver_testing
  question: Which foreign drivers applying for an Idaho Class D driver's license do
    NOT have to surrender their license or take the skills test?
  choices:
    A: Drivers from Korea
    B: Drivers from Taiwan
    C: Drivers from Germany
    D: Drivers from Mexico
  answer: C
  explanation: The manual states that drivers from Germany do not have to surrender
    their license or take the skills test.
- id: 51
  category: driver_testing
  question: Which foreign drivers are exempt from taking the Idaho knowledge test
    when applying for a Class D driver's license?
  choices:
    A: Drivers from Canada
    B: Drivers from Germany
    C: Drivers from Korea and Taiwan
    D: No foreign drivers are exempt
  answer: D
  explanation: The manual explicitly states, 'No foreign drivers are exempt from the
    knowledge test.'
- id: 52
  category: driver_testing
  question: What additional requirement must a person under 21 years of age meet to
    obtain a Motorcycle Instruction Permit (MIP)?
  choices:
    A: Pass a vision screening test
    B: Successfully complete an approved Motorcycle Rider Training Course
    C: Hold a Class D Instruction Permit for 6 months
    D: Provide a driving record no older than 30 days
  answer: B
  explanation: Any person under 21 years of age will be required to take a knowledge
    test and successfully complete an approved Motorcycle Rider Training Course to
    get an MIP.
- id: 53
  category: license_system
  question: Under the Graduated Driver's License (GDL) program, how many hours of
    supervised driving time must be accumulated?
  choices:
    A: 30 hours, with 6 at night
    B: 40 hours, with 10 at night
    C: 50 hours, with 10 at night
    D: 60 hours, with 15 at night
  answer: C
  explanation: Under the GDL program, you must accumulate at least 50 hours of supervised
    driving time, ten hours of which must be at night.
- id: 54
  category: penalties_and_points
  question: What happens if you are convicted of violating a traffic law during the
    GDL supervised instruction period?
  choices:
    A: You must pay a $100 fine.
    B: Your permit will be canceled and your 6 months of supervised driving time starts
      over with a new permit.
    C: You will be restricted to daylight driving only for the remainder of the period.
    D: You must retake the driver training classroom instruction.
  answer: B
  explanation: If convicted of violating any traffic laws during the supervised instruction
    period, the permit will be canceled, you must reapply, and the minimum 6 months
    of supervised driving time starts over.
- id: 55
  category: license_system
  question: An approved Idaho Driver Training (DT) program consists of how many hours
    of classroom instruction?
  choices:
    A: 10 hours
    B: 20 hours
    C: 30 hours
    D: 40 hours
  answer: C
  explanation: An approved Idaho Driver Training (DT) program consists of a required
    30 hours of classroom instruction, 6 hours of in-car observation, and 6 hours
    of behind-the-wheel practice.
- id: 56
  category: vehicle_information
  question: According to the manual, which of the following is NOT classified as a
    motorcycle?
  choices:
    A: A motor vehicle with a saddle designed to travel with two wheels
    B: A motor vehicle with a seat designed to travel with three wheels
    C: A tractor or moped
    D: Any motor vehicle requiring an M endorsement
  answer: C
  explanation: The manual defines a motorcycle as having a seat/saddle and not more
    than three wheels, but explicitly states, 'Tractors and mopeds are not classified
    as motorcycles.'
- id: 57
  category: driver_testing
  question: What tests must you take if you are surrendering an out-of-state driver's
    license with a motorcycle (M) endorsement that has been expired for more than
    25 months?
  choices:
    A: Only a motorcycle knowledge test
    B: Only a motorcycle skills test
    C: Both a motorcycle knowledge and skills test
    D: No tests are required
  answer: C
  explanation: If the Idaho or out-of-state license with or without an M endorsement
    has been expired for more than 25 months, you must take a motorcycle knowledge
    and skills test.
- id: 58
  category: license_system
  question: Idaho considers an individual to be a 'new applicant' if their Idaho driver's
    license has been expired for at least how long?
  choices:
    A: 6 months
    B: 12 months
    C: 25 months
    D: 36 months
  answer: C
  explanation: Idaho considers new applicants to be individuals who have an Idaho
    driver's license that has been expired for 25 months or more.
- id: 59
  category: license_system
  question: When providing proof of age and identity for a driver's license, which
    of the following is true regarding the documents you submit?
  choices:
    A: Photocopies of a US birth certificate are acceptable.
    B: Faxes of your state-issued ID are acceptable.
    C: Photocopies or faxes of these documents will not be accepted.
    D: A US birth certificate is not required if you have a photocopy of your ID.
  answer: C
  explanation: 'The manual explicitly states regarding proof of age and identity:
    ''Photocopies or faxes of these documents will not be accepted.'''
- id: 60
  category: license_system
  question: Are photocopies or faxes of your US birth certificate accepted for proving
    age and identity when applying for an Idaho driver's license?
  choices:
    A: Yes, if they are notarized.
    B: Yes, if accompanied by a photo ID.
    C: No, photocopies or faxes are not accepted.
    D: No, unless approved by a county clerk.
  answer: C
  explanation: The manual explicitly states that photocopies or faxes of these documents
    will not be accepted to prove age and identity.
- id: 61
  category: license_system
  question: If your name has changed due to marriage, what must you provide to link
    your birth name to your current legal name?
  choices:
    A: A signed affidavit from your spouse
    B: A certified marriage certificate
    C: A utility bill with your new name
    D: A new Social Security card
  answer: B
  explanation: If your name has changed due to a legal name change or marriage, you
    will need to provide documentation linking your birth name to your current legal
    name, most commonly done with a certified marriage certificate or court ordered
    name change documents.
- id: 62
  category: license_system
  question: Do minor children under the age of 18 need to provide their own photo
    ID to get a driver's license?
  choices:
    A: Yes, a school ID is always mandatory.
    B: Yes, they must have a valid passport.
    C: No, if a parent or legal guardian provides their own photo ID along with the
      child's certified original birth certificate.
    D: No, minors are exempt from all identity verification requirements.
  answer: C
  explanation: Minor children (under the age of 18) do not need a photo ID. Parents
    or legal guardians can provide their own photo ID along with the child's certified
    original birth certificate.
- id: 63
  category: license_system
  question: Will your Social Security number be printed on your Idaho driver's license
    or ID card?
  choices:
    A: Yes, it is printed on the back of the card.
    B: Yes, it is used as your driver's license number.
    C: No, it is only printed on commercial driver's licenses.
    D: No, it will not be printed on your Idaho driver's license or ID card.
  answer: D
  explanation: Your social security number must be verified through the Social Security
    Administration's system, but it will not be printed on your Idaho driver's license
    or ID card.
- id: 64
  category: license_system
  question: When providing proof of Idaho residency, such as a utility bill or lease
    agreement, the documents must be dated within what time frame?
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: You will be required to show proof of physical address with documents
    such as lease or rental agreements, utility bills, etc. Documents must be dated
    within 1 year.
- id: 65
  category: license_system
  question: If you are not a citizen or permanent legal resident, what will be the
    expiration date on your driver's license?
  choices:
    A: Exactly 8 years from the date of issuance
    B: The same date as your end of lawful stay in the US, or four years, whichever
      is less
    C: The same date as your end of lawful stay in the US, or eight years, whichever
      is less
    D: One year from the date of issuance, regardless of your lawful stay documents
  answer: B
  explanation: If you are not a citizen or permanent legal resident, the expiration
    date on your driver's license will be the same date as your end of lawful stay
    in the United States... or four years, whichever is less.
- id: 66
  category: driver_responsibility
  question: What happens if the liability signer for a driver under 18 withdraws their
    consent?
  choices:
    A: The minor must pay a fine.
    B: The minor is restricted to driving only to and from school.
    C: The department will cancel the minor's driving credential.
    D: The minor must complete an additional driver's training course.
  answer: C
  explanation: While you are under 18 years of age, the liability signer may withdraw
    consent at any time, which will cause the department to cancel your driving credential.
- id: 67
  category: license_system
  question: If you are under 18 years of age and married, who may act as your liability
    signer?
  choices:
    A: Only your parents
    B: Your spouse, provided they are at least 18 years of age
    C: Any licensed driver over the age of 21
    D: You do not need a liability signer if you are married
  answer: B
  explanation: If you are married, your spouse, who must be at least 18 years of age,
    may sign for you.
- id: 68
  category: license_system
  question: What is required for an applicant under 18 years of age regarding school
    compliance?
  choices:
    A: Proof of a 3.0 GPA or higher
    B: A letter of recommendation from a teacher
    C: Acceptable proof of enrollment and attendance in, or graduation from, a recognized
      high school or equivalent program
    D: Proof of participation in extracurricular activities
  answer: C
  explanation: If you are under 18 years of age, you will need to provide acceptable
    proof of enrollment and attendance in, or graduation from, a recognized high school
    or equivalent program.
- id: 69
  category: license_system
  question: How many proofs of Idaho residency with a physical address are required
    to obtain a Star Card (Real ID)?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: To obtain a Star Card (Real ID), the required documentation includes
    two proofs of Idaho residency with physical address.
- id: 70
  category: license_system
  question: At what age may you request to have the "DONOR" designation appear on
    your driver's license or ID card?
  choices:
    A: 14 years of age or older
    B: 15 years of age or older
    C: 16 years of age or older
    D: 18 years of age or older
  answer: B
  explanation: If you are 15 years of age or older, you may request to have the "DONOR"
    designation appear on your driver's license or ID card.
- id: 71
  category: license_system
  question: What document must you provide to get a veteran's designation on your
    driver's license or ID card?
  choices:
    A: A valid military dependent's card
    B: A DD214 form indicating honorable discharge
    C: A letter from your commanding officer
    D: A current military deployment order
  answer: B
  explanation: If you would like a veteran's designation on your driver's license
    or ID card, you must provide a DD214 form indicating honorable discharge.
- id: 72
  category: license_system
  question: For "Foreign Nationals," what is the only acceptable document to provide
    proof of legal name and date of birth in lieu of a U.S. certified birth certificate?
  choices:
    A: A foreign driver's license
    B: A foreign passport
    C: An international driving permit
    D: A foreign birth certificate
  answer: B
  explanation: In compliance with the National Driver's License Agreement, the foreign
    passport is the only acceptable document to provide proof of legal name and date
    of birth for foreign nationals.
- id: 73
  category: license_system
  question: According to the manual, is an Idaho Concealed Weapons Permit an acceptable
    photo identity document?
  choices:
    A: Yes, as long as it is not expired for more than 1 year.
    B: Yes, as long as it is not expired for more than 5 years.
    C: No, weapons permits are never accepted for identity verification.
    D: No, unless it is accompanied by a military ID.
  answer: A
  explanation: Table 1 lists a 'Concealed Weapons Permit issued by the state of Idaho
    not expired for more than 1 year' as an acceptable photo identity document.
- id: 74
  category: license_system
  question: Can acceptable secondary identity documents (like a certified divorce
    document) be used alone to establish your identity?
  choices:
    A: Yes, if they are notarized.
    B: Yes, if they contain your full legal name and date of birth.
    C: No, secondary documents alone are not sufficient.
    D: No, unless they are accompanied by a utility bill.
  answer: C
  explanation: The manual states that 'Secondary documents alone are not sufficient.
    These documents must contain your name and enough information to establish proof
    of all or part of what is contained on the primary document.'
- id: 75
  category: driver_responsibility
  question: If you are under 18 years of age, what is required for you to become an
    organ donor?
  choices:
    A: A $2 contribution to the organ donation fund
    B: Consent from your parent or adult guardian
    C: A medical examination by a licensed physician
    D: A written letter submitted to the ITD
  answer: B
  explanation: According to the manual, if you're under 18 years of age you must have
    consent from your parent or adult guardian to be an organ donor.
- id: 76
  category: license_system
  question: Federal law requires which individuals to register with the Selective
    Service System?
  choices:
    A: All males and females 18 to 25 years of age
    B: All males 18 to 25 years of age
    C: All males 16 to 21 years of age
    D: Anyone applying for a commercial driver's license
  answer: B
  explanation: Federal law requires all males who are 18 to 25 years of age to register
    with the Selective Service System.
- id: 77
  category: license_system
  question: Before applying for a duplicate driver's license to change your name,
    what must you do first?
  choices:
    A: Update your name with the Social Security Administration
    B: Pass a new vision screening
    C: Surrender your old license to law enforcement
    D: Wait until your current license expires
  answer: A
  explanation: The manual notes that your name must be updated with the Social Security
    Administration prior to applying for a duplicate for a name change.
- id: 78
  category: license_system
  question: How many days do you have to notify the ITD when your address changes?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: You must notify ITD within 30 days when your address changes.
- id: 79
  category: driver_responsibility
  question: What can happen if you allow an unlicensed driver to drive your vehicle
    and they get into a crash?
  choices:
    A: Only the unlicensed driver is responsible for damages
    B: Your vehicle registration will be permanently revoked
    C: Both you and the driver are responsible for the damage, injury, or death
    D: You will be required to retake the skills test
  answer: C
  explanation: If you allow an unlicensed driver to drive your vehicle, in case of
    a crash, both the driver and the owner of the vehicle are responsible for the
    damage, injury, or death.
- id: 80
  category: license_system
  question: If you are between 21 and 62 years of age, you may choose to renew your
    Class D driver's license for up to how many years?
  choices:
    A: 4 years only
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: If you are between 21 and 62 years of age, you may choose the eight-year
    renewal for your Class D or commercial driver's license.
- id: 81
  category: driver_testing
  question: What is required if your Idaho Class D driver's license has been expired
    for 25 months or more?
  choices:
    A: You must pay a late fee but no tests are required
    B: You must take all applicable knowledge and skills tests
    C: You must take only the vision screening
    D: You are permanently barred from renewing your license
  answer: B
  explanation: If the Idaho (Class D or CDL) or out-of-state (Class D only) driver's
    license has been expired for 25 months or more, you will be required to take all
    applicable knowledge and skills test(s).
- id: 82
  category: license_system
  question: If you are temporarily out of state when your driver's license expires,
    you may apply for an extension of up to how many months?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: If you are temporarily out of state at that time, you may apply for
    an extension of up to 12 months for $10.00.
- id: 83
  category: driver_testing
  question: What is the minimum age required to take the knowledge and skills tests?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 18 years of age
  answer: B
  explanation: Applicants must be 15 years of age or older to take the knowledge and
    skills tests.
- id: 84
  category: driver_testing
  question: What is the minimum vision standard required to pass the visual screening
    for a driver's license?
  choices:
    A: 20/20 vision in both eyes
    B: 20/30 vision in at least one eye
    C: 20/40 vision in at least one eye
    D: 20/50 vision in both eyes
  answer: C
  explanation: Your vision will be tested and you must meet a minimum standard of
    20/40 vision in at least one eye, with or without corrective lenses.
- id: 85
  category: driver_testing
  question: The Class D knowledge test consists of 40 questions. What is the maximum
    number of questions you can miss before failing the test?
  choices:
    A: 4 questions
    B: 6 questions
    C: 8 questions
    D: 10 questions
  answer: B
  explanation: The knowledge test consists of 40 questions; you can miss up to six
    (6) questions before failing the test.
- id: 86
  category: driver_testing
  question: If you fail a knowledge test, how long must you wait before you can retest?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 14 days
  answer: B
  explanation: If you fail a knowledge test, you must wait three (3) days to retest.
- id: 87
  category: driver_testing
  question: When taking the Class D skills test, what is considered a passing score?
  choices:
    A: Zero errors
    B: 6 or fewer errors
    C: 12 or fewer errors
    D: 15 or fewer errors
  answer: C
  explanation: During the skills test, twelve or fewer errors is a passing score.
- id: 88
  category: driver_testing
  question: Under what conditions may a skills test be scheduled?
  choices:
    A: Only during daylight hours and acceptable weather conditions
    B: At any time of day or night
    C: Only on weekends and holidays
    D: Only during the morning hours before noon
  answer: A
  explanation: Skills tests may only be scheduled during daylight hours and during
    acceptable weather conditions.
- id: 89
  category: driver_testing
  question: Under what condition is a skills test required for an applicant with an
    expired driver's license?
  choices:
    A: If the license has been expired for 12 months or more.
    B: If the license has been expired for 25 months or more (excluding CDLs).
    C: If the license has been expired for 5 years or more.
    D: A skills test is required for any expired license regardless of time.
  answer: B
  explanation: A skills test is required for those who present an Idaho or out-of-state
    driver's license that has been expired 25 months or more, though this does not
    apply to Commercial Driver's Licenses (CDL).
- id: 90
  category: driver_testing
  question: What is the policy regarding the use of a rental car for a skills test?
  choices:
    A: Rental cars are never allowed for skills tests.
    B: Rental cars are allowed only if the applicant is under 25 years old.
    C: Rental cars are not allowed if the applicant is not a licensed driver or is
      under the age of 25.
    D: Rental cars are allowed for all applicants as long as they provide proof of
      insurance.
  answer: C
  explanation: The manual states that rental cars are not allowed to be used for taking
    a skills test if the applicant is not a licensed driver or is under the age of
    25.
- id: 91
  category: driver_testing
  question: During the applicant vehicle knowledge and inspection portion, how many
    items can you miss and still continue to the driving portion of the skills test?
  choices:
    A: '0'
    B: 3 or fewer
    C: 5 or fewer
    D: 12 or fewer
  answer: B
  explanation: You must be able to locate and/or demonstrate various vehicle functions.
    You can miss 3 or fewer to continue to the driving portion of the skills test.
- id: 92
  category: driver_testing
  question: What constitutes a passing score on the driving skills portion of the
    test?
  choices:
    A: 3 or fewer errors
    B: 5 or fewer errors
    C: 10 or fewer errors
    D: 12 or fewer errors
  answer: D
  explanation: You must be able to demonstrate essential driving skills to safely
    operate a motor vehicle. Twelve or fewer errors is a passing score.
- id: 93
  category: driver_testing
  question: Which of the following is considered a Critical Driving Error (CDE) that
    results in an automatic failure of the skills test?
  choices:
    A: Missing 3 items on the vehicle inspection.
    B: Missing 5 or more of the same scored skill (habitual violation).
    C: Parking 12 inches from the curb.
    D: Making 10 minor driving errors.
  answer: B
  explanation: A habitual violation, defined as missing 5 or more of the same scored
    skill, is a Critical Driving Error (CDE) and constitutes an automatic FAIL.
- id: 94
  category: driver_testing
  question: What must you do with the sealed envelope containing your passing skills
    test results?
  choices:
    A: Open it to verify your score before going to the DMV.
    B: Mail it directly to the ITD headquarters.
    C: Deliver it unopened to the county DMV.
    D: Give it to your vehicle insurance agent.
  answer: C
  explanation: If you pass, the examiner will provide your results in a sealed envelope
    to deliver to the county DMV. The envelope must not be opened or your results
    will be held pending verification.
- id: 95
  category: vehicle_information
  question: What is the minimum tire tread depth required to pass the skills test
    examiner vehicle inspection?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 3/32 of an inch
    D: 4/32 of an inch
  answer: B
  explanation: During the vehicle inspection, the examiner will verify that tires
    have at least 2/32 of an inch or more of tread.
- id: 96
  category: vehicle_information
  question: During which dates are studded tires NOT allowed on a vehicle used for
    a skills test?
  choices:
    A: October 1 to April 30
    B: May 1 to September 30
    C: June 1 to August 31
    D: November 1 to March 31
  answer: B
  explanation: The manual specifies that studded tires are not allowed from May 1
    to September 30 during the vehicle inspection.
- id: 97
  category: driver_testing
  question: If you do not own the vehicle being used for the skills test, how must
    permission from the owner be provided?
  choices:
    A: Verbally over the phone.
    B: Through a text message from the owner.
    C: Either in written format or verbally in person.
    D: By forwarding an email to the DMV.
  answer: C
  explanation: Permission to use the vehicle must be provided to the skills test examiner
    either in written format or in person verbally. Permission over the phone is not
    acceptable.
- id: 98
  category: driver_testing
  question: Who is allowed to accompany a minor (17 years of age or younger) as a
    passenger during a skills test?
  choices:
    A: Up to two parents or legal guardians.
    B: Only one parent or legal guardian.
    C: A certified driving instructor.
    D: Any licensed driver over the age of 21.
  answer: B
  explanation: 'Exceptions for passengers during a skills test include: Only one (1)
    parent or legal guardian may accompany a minor (17 years of age or younger).'
- id: 99
  category: vehicle_information
  question: What are the performance requirements for a vehicle's foot brakes in Idaho?
  choices:
    A: They must stop a vehicle traveling 20 mph on dry pavement within 25 feet.
    B: They must stop a vehicle traveling 30 mph on dry pavement within 50 feet.
    C: They must stop a vehicle traveling 20 mph on dry pavement within 55 feet.
    D: They must stop a vehicle traveling 15 mph on dry pavement within 20 feet.
  answer: A
  explanation: Foot brakes must stop a vehicle that is traveling 20 miles per hour
    on dry pavement within a distance of 25 feet.
- id: 100
  category: vehicle_information
  question: How far ahead must your vehicle's high beam headlights allow you to see
    people and vehicles?
  choices:
    A: At least 100 feet away
    B: At least 200 feet away
    C: At least 350 feet away
    D: At least 500 feet away
  answer: C
  explanation: High beams must allow the driver to see people and vehicles at least
    350 feet away.
- id: 101
  category: penalties_and_points
  question: What is the penalty for operating a vehicle without the owner's consent,
    with intent to temporarily deprive the owner of possession, but without intent
    to steal?
  choices:
    A: A simple infraction
    B: A misdemeanor
    C: A felony
    D: A written warning
  answer: B
  explanation: Any person who operates a vehicle not his own, without consent, and
    with intent to temporarily deprive the owner of possession (without intent to
    steal) will be guilty of a misdemeanor.
- id: 102
  category: vehicle_information
  question: Does Idaho require an annual safety inspection for motor vehicles?
  choices:
    A: Yes, every vehicle must be inspected annually.
    B: Yes, but only for vehicles older than 10 years.
    C: No, but a police officer may issue a citation if the vehicle is unsafe.
    D: No, and police officers cannot cite drivers for equipment failures.
  answer: C
  explanation: Idaho does not require an annual safety inspection, but if you are
    stopped by a police officer who finds your vehicle is unsafe or lacks proper equipment,
    the officer may issue you a citation.
- id: 103
  category: driver_testing
  question: Is an SR22 acceptable as valid proof of insurance for the skills test?
  choices:
    A: Yes, it is always acceptable.
    B: Yes, but only if it is a digital copy.
    C: No, an SR22 is not valid proof of insurance.
    D: No, unless accompanied by a letter from the DMV.
  answer: C
  explanation: The manual explicitly states under required documents for the skills
    test that 'An SR22 is not valid proof of insurance.'
- id: 104
  category: vehicle_information
  question: High beams must allow the driver to see people and vehicles at least how
    far away?
  choices:
    A: 100 feet
    B: 200 feet
    C: 350 feet
    D: 500 feet
  answer: C
  explanation: According to the manual, high beams must allow the driver to see people
    and vehicles at least 350 feet away.
- id: 105
  category: vehicle_information
  question: What is the minimum required tread depth for each tire on a vehicle?
  choices:
    A: 1/32 inch
    B: 2/32 inch
    C: 3/32 inch
    D: 4/32 inch
  answer: B
  explanation: The manual states that each tire should have at least 2/32” or more
    of tread.
- id: 106
  category: safe_driving_rules
  question: Idaho law requires children of what age to be properly protected in approved
    child car safety seats when riding in a non-commercial motor vehicle?
  choices:
    A: 4 years of age or younger
    B: 6 years of age or younger
    C: 8 years of age or younger
    D: 10 years of age or younger
  answer: B
  explanation: Idaho law requires anyone carrying children 6 years of age or younger
    in a non-commercial motor vehicle to properly protect children in approved child
    car safety seats.
- id: 107
  category: safe_driving_rules
  question: According to the National Highway Traffic Safety Administration, all children
    younger than what age should ride in the back seat?
  choices:
    A: 10 years
    B: 12 years
    C: 13 years
    D: 15 years
  answer: C
  explanation: The NHTSA recommends that all children younger than 13 years should
    ride in the back seat.
- id: 108
  category: vehicle_information
  question: During which months are studded snow tires generally permitted to be used
    in Idaho?
  choices:
    A: November 1 to March 31
    B: October 1 to April 30
    C: September 1 to May 31
    D: December 1 to February 28
  answer: B
  explanation: Studded snow tires may be used only from October 1 to April 30, though
    the Idaho Transportation Department may adjust the dates due to weather conditions.
- id: 109
  category: safe_driving_rules
  question: At what distance must you dim your headlamps before meeting an oncoming
    vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 350 feet
    D: 500 feet
  answer: D
  explanation: Headlamps must be dimmed 500 feet before meeting another vehicle.
- id: 110
  category: vehicle_information
  question: If a vehicle's load extends four feet or more beyond the rear of the vehicle
    during the day, what must be displayed at the end of the load?
  choices:
    A: A red light visible for 500 feet
    B: A red flag at least 18 inches square
    C: Two flashing amber lights
    D: A white flag at least 12 inches square
  answer: B
  explanation: When vehicle loads extend four feet or more beyond the rear of a vehicle,
    a red flag at least 18 inches square must be displayed at the end of the load.
- id: 111
  category: vehicle_information
  question: How far to the rear must your vehicle's rear view mirror provide a view
    of the highway?
  choices:
    A: 100 feet
    B: 200 feet
    C: 350 feet
    D: 500 feet
  answer: B
  explanation: All motor vehicles must have a rear view mirror that provides a view
    of the highway for at least 200 feet to the rear.
- id: 112
  category: driver_responsibility
  question: 'If you fail to give your full attention to the safe operation of your
    vehicle while driving, you may be cited for:'
  choices:
    A: Reckless driving
    B: Inattentive driving
    C: Aggressive driving
    D: Obstructing traffic
  answer: B
  explanation: While driving, you must give your full attention to the safe operation
    of your vehicle. Failure to do so may cause you to be cited for inattentive driving.
- id: 113
  category: signs_and_signals
  question: When approaching a stop sign where there is no stop line or crosswalk,
    where must you stop?
  choices:
    A: At the stop sign itself
    B: 10 feet before the intersection
    C: At the point nearest the intersecting highway where you have a view of approaching
      traffic
    D: You do not need to stop if the intersection is clear
  answer: C
  explanation: If there is no stop line or crosswalk, you must stop at the point nearest
    the intersecting highway where the driver has a view of approaching traffic on
    the intersecting highway before entering it.
- id: 114
  category: signs_and_signals
  question: What colors are warning signs in a work zone?
  choices:
    A: Red and white
    B: Black and white
    C: Yellow and black
    D: Orange and black
  answer: D
  explanation: Warning signs in a work zone are orange and black.
- id: 115
  category: vehicle_information
  question: Which of the following types of equipment is NOT allowed on a standard
    passenger vehicle?
  choices:
    A: A muffler that prevents loud noise
    B: Red or blue emergency lights
    C: Flashing electric turn signals
    D: Two fog lights in front
  answer: B
  explanation: Red or blue emergency lights are not allowed on standard vehicles;
    they are authorized for emergency vehicles only.
- id: 116
  category: vehicle_information
  question: A vehicle's load must not extend outside the fenders on the left side,
    and it must not extend more than how many inches outside the fenders on the right
    side?
  choices:
    A: 4 inches
    B: 6 inches
    C: 8 inches
    D: 12 inches
  answer: B
  explanation: The vehicle’s load must not extend outside the fenders on the left
    side or more than six inches outside the fenders on the right.
- id: 117
  category: safe_driving_rules
  question: 'According to NHTSA studies, wearing safety belts reduces your chances
    of serious injury in an auto crash by:'
  choices:
    A: 25%
    B: 40%
    C: 50%
    D: 75%
  answer: C
  explanation: Studies by the NHTSA show that when worn, safety belts reduce your
    chances of serious injury in an auto crash by 50%.
- id: 118
  category: signs_and_signals
  question: What does a "Road Closed To Thru Traffic" sign mean?
  choices:
    A: The road is completely closed to all vehicles and pedestrians.
    B: The work zone is open to local traffic, but must not be used as a travel route
      without a reason to stop.
    C: Only construction vehicles are allowed on the road.
    D: You can drive through the work zone if you maintain a speed of 15 mph.
  answer: B
  explanation: The manual states that "Road Closed To Thru Traffic" means the work
    zone is open to local residential or commercial traffic, but traffic must not
    use it as a travel route unless they have a reason to stop within the work zone.
- id: 119
  category: penalties_and_points
  question: What happens to speeding fines in work zones where signage indicates?
  choices:
    A: They are reduced by half.
    B: They remain the same as normal speeding fines.
    C: They are increased.
    D: They are waived for first-time offenders.
  answer: C
  explanation: The manual explicitly states to slow down because fines for speeding
    are increased in work zones where the signage indicates.
- id: 120
  category: sharing_the_road
  question: 'When encountering a school safety patrol official directing traffic,
    you must:'
  choices:
    A: Follow their directions only if they are a uniformed police officer.
    B: Follow any directions they issue while driving your motor vehicle.
    C: Yield only if children are actively crossing the street.
    D: Honk your horn to alert them of your presence before proceeding.
  answer: B
  explanation: You must follow any directions issued by a school safety patrol official
    while driving your motor vehicle. They are appointed by the school and will display
    proper directional signs.
- id: 121
  category: signs_and_signals
  question: What shape and color are most warning signs?
  choices:
    A: Round and red
    B: Pennant-shaped and white
    C: Diamond-shaped and black on yellow
    D: Rectangular and white on green
  answer: C
  explanation: Most warning signs are black on yellow and diamond-shaped. They warn
    you about an unexpected condition.
- id: 122
  category: sharing_the_road
  question: If you are traveling in an "Open Range" area, what does this mean?
  choices:
    A: You can drive at any speed you choose.
    B: Livestock have the right-of-way and are allowed to roam freely and unfenced.
    C: You are entering a multi-lane divided highway.
    D: Passing other vehicles is strictly prohibited.
  answer: B
  explanation: An Open Range sign indicates you are traveling in an area where livestock
    have the right-of-way and are allowed to roam freely and unfenced.
- id: 123
  category: signs_and_signals
  question: Where will you find a pennant-shaped "No Passing Zone" sign?
  choices:
    A: On the right-hand side of the road
    B: Suspended above the center of the intersection
    C: On the left-hand side of the road or highway
    D: Only on multi-lane divided highways
  answer: C
  explanation: The manual states that the pennant-shaped "No Passing Zone" sign will
    be on the left-hand side of the road or highway.
- id: 124
  category: safe_driving_rules
  question: When you see a warning sign for a steep hill ahead, what should you do?
  choices:
    A: Accelerate to maintain your speed.
    B: Shift your vehicle into neutral.
    C: Check your brakes before going down the hill.
    D: Turn on your hazard lights.
  answer: C
  explanation: The Hill warning sign indicates that the road goes down a steep hill,
    and you should check your brakes before going down the hill.
- id: 125
  category: signs_and_signals
  question: What information is displayed on an Emergency Notification System sign
    at a railroad crossing?
  choices:
    A: The speed limit for approaching trains.
    B: The distance to the next highway exit.
    C: The railroad's phone number and a location specific crossing number.
    D: The daily schedule of upcoming trains.
  answer: C
  explanation: The Emergency Notification System sign lists the railroad's phone number
    along with the location specific crossing number to notify them of an emergency
    or malfunction.
- id: 126
  category: signs_and_signals
  question: What do white on brown guide signs indicate?
  choices:
    A: Directional and distance information
    B: Motorist's services
    C: Cultural, historical, or scenic points of interest
    D: Temporary construction zones
  answer: C
  explanation: Guide signs are white on brown for cultural, historical, or scenic
    points of interest.
- id: 127
  category: signs_and_signals
  question: If you encounter a barricade with lines angling down to the left, what
    does it indicate?
  choices:
    A: The road is completely closed and you can proceed no further.
    B: Traffic must pass the barricade on the left side.
    C: Traffic must pass the barricade on the right side.
    D: You are approaching a pedestrian crosswalk.
  answer: B
  explanation: The lines on a barricade angling down to the left indicate that traffic
    must pass the barricade on the left side.
- id: 128
  category: signs_and_signals
  question: On a horizontal traffic light, where is the red light located?
  choices:
    A: On the far left
    B: In the middle
    C: On the far right
    D: It flashes on both sides
  answer: A
  explanation: Horizontal traffic lights have a red light on the far left, a yellow
    light in the middle, and a green light on the far right.
- id: 129
  category: safe_driving_rules
  question: What must you do when approaching a flashing red traffic light?
  choices:
    A: Slow down and proceed with caution without stopping.
    B: Come to a complete stop, yield to cross traffic or pedestrians, and proceed
      when clear.
    C: Stop and wait for the light to turn green.
    D: Treat it as a yield sign and only stop if other vehicles are present.
  answer: B
  explanation: A flashing red indication means stop. You must come to a complete stop,
    yield to cross traffic or pedestrians, and then proceed when clear.
- id: 130
  category: signs_and_signals
  question: What does a steady red arrow indication mean?
  choices:
    A: You may turn in the direction of the arrow after coming to a complete stop.
    B: No turn is permitted in the direction of the arrow until a green or yellow
      light allows movement.
    C: You must yield to oncoming traffic before turning.
    D: The signal is about to change to green.
  answer: B
  explanation: While the steady red arrow indication is displayed, no turn is permitted
    in the direction of the arrow until a green or yellow light indication allows
    movement.
- id: 131
  category: safe_driving_rules
  question: If you are approaching an intersection and the light turns yellow, what
    should you do if you have NOT yet entered the intersection?
  choices:
    A: Speed up to clear the intersection quickly.
    B: Stop immediately wherever you are.
    C: Come to a safe stop if you can do so.
    D: Honk your horn and proceed through the intersection.
  answer: C
  explanation: A yellow light means caution. If you have not entered the intersection
    and can come to a safe stop, you should do so.
- id: 132
  category: signs_and_signals
  question: What should you do if you approach an intersection where the traffic signal
    is not functioning?
  choices:
    A: Yield to the vehicle on your right and proceed
    B: Treat the intersection as a four-way stop
    C: Proceed through the intersection without stopping
    D: Wait for law enforcement to direct traffic
  answer: B
  explanation: According to the manual, whenever a traffic signal is not functioning,
    you must treat the intersection as a four-way stop.
- id: 133
  category: signs_and_signals
  question: What does a flashing yellow arrow indicate at an intersection?
  choices:
    A: The signal is about to turn red
    B: You have the right-of-way to turn left without yielding
    C: Turns are allowed after yielding to oncoming traffic and pedestrians
    D: You must stop and wait for a solid green arrow
  answer: C
  explanation: The flashing yellow arrow means turns are allowed after yielding to
    oncoming traffic and pedestrians in crosswalks.
- id: 134
  category: signs_and_signals
  question: In a Pedestrian Hybrid Beacon (HAWK) sequence, what must a driver do when
    the red lights flash alternately?
  choices:
    A: Stop, yield to pedestrians in the crosswalk, and proceed when clear
    B: Remain completely stopped until the lights turn green
    C: Speed up to clear the intersection quickly
    D: Honk to warn pedestrians before driving through
  answer: A
  explanation: When the red lights flash alternately on a Pedestrian Hybrid Beacon,
    the driver must stop, yield to pedestrians in the crosswalk, and proceed when
    the crosswalk is clear.
- id: 135
  category: safe_driving_rules
  question: When is a driver permitted to cross double solid yellow lines?
  choices:
    A: When passing a slow-moving vehicle on a straight road
    B: When turning left into or out of a driveway or business
    C: When the lane ahead is blocked by heavy traffic
    D: Never, under any circumstances
  answer: B
  explanation: Two solid yellow lines mean neither lane can cross unless turning.
    A driver can cross a double yellow line when turning left into or out of a driveway
    or entrance to a business.
- id: 136
  category: safe_driving_rules
  question: What is the proper use of shared center lanes?
  choices:
    A: Passing slow-moving vehicles
    B: Traveling during rush hour traffic
    C: Making left turns or permitted U-turns from either direction
    D: Parking temporarily for emergencies
  answer: C
  explanation: Center lanes are reserved for making left turns (or U-turns when they
    are permitted) from either direction of travel. You may not travel in the shared
    turn lanes.
- id: 137
  category: signs_and_signals
  question: What do double solid white lane lines indicate on a highway?
  choices:
    A: Lane changes are prohibited in this area
    B: You may change lanes only if it is safe to do so
    C: The lane is ending and you must merge left
    D: You are approaching a pedestrian crosswalk
  answer: A
  explanation: Double solid white lane lines mean that lane changes are prohibited
    in areas where this type of marking is present.
- id: 138
  category: safe_driving_rules
  question: When required to stop at a railroad crossing, what is the minimum distance
    you must stop from the nearest rail?
  choices:
    A: 10 feet
    B: 15 feet
    C: 25 feet
    D: 50 feet
  answer: B
  explanation: When required to stop at a railroad crossing, you should do so within
    50 feet but no less than 15 feet from the nearest rail of the crossing.
- id: 139
  category: defensive_driving
  question: What is the approximate stopping distance for a 150-car freight train
    traveling at 50 miles per hour?
  choices:
    A: 1,000 feet
    B: 3,500 feet
    C: 5,000 feet
    D: 7,000 feet
  answer: D
  explanation: The stopping distance for a 150-car freight train traveling 50 miles
    per hour is 7,000 feet or 1 and 1/3 miles.
- id: 140
  category: safe_driving_rules
  question: Why should you never shift gears while driving through a railroad crossing?
  choices:
    A: It damages the vehicle's transmission
    B: It may cause your vehicle to stall on the tracks
    C: It is illegal and carries a heavy fine
    D: It increases your speed too quickly
  answer: B
  explanation: The manual warns to never shift gears while driving through a crossing
    because this may cause your vehicle to stall on the tracks.
- id: 141
  category: safe_driving_rules
  question: In a roundabout intersection, which vehicles have the right-of-way?
  choices:
    A: Vehicles entering the roundabout
    B: Vehicles making a right turn
    C: Vehicles that are already in the circle
    D: Larger commercial vehicles
  answer: C
  explanation: In a roundabout intersection, all drivers must yield the right-of-way
    to vehicles that are already in the circle.
- id: 142
  category: safe_driving_rules
  question: What should you do as you approach your exit in a roundabout?
  choices:
    A: Turn your left turn signal on
    B: Turn your right turn signal on
    C: Flash your headlights to warn entering traffic
    D: Come to a complete stop before exiting
  answer: B
  explanation: When driving in a roundabout, as you approach your exit, you should
    turn your right turn signal on.
- id: 143
  category: safe_driving_rules
  question: How do you complete a left turn at a thru-turn intersection?
  choices:
    A: Make a direct left turn when the traffic light is green
    B: Turn right, then immediately make a U-turn
    C: Continue through the intersection, make a U-turn downstream, and then turn
      right
    D: Wait in the center shared lane until cross traffic clears
  answer: C
  explanation: To complete a left turn in a thru-turn intersection, continue through
    the intersection, perform a U-turn downstream at the next traffic signal, head
    back toward the intersection, and make a right turn.
- id: 144
  category: signs_and_signals
  question: What does a green circular light mean if you are in the left-turn lane?
  choices:
    A: You have the right-of-way over all other traffic
    B: You must yield to oncoming traffic and pedestrians in crosswalks before turning
    C: You must wait for a green arrow before making your turn
    D: You cannot turn left at this intersection
  answer: B
  explanation: A green circular indication means 'go.' However, if you are in the
    left-turn lane, you must yield to oncoming traffic and pedestrians in crosswalks
    before turning left.
- id: 145
  category: sharing_the_road
  question: What does green paint in a bicycle lane emphasize?
  choices:
    A: The area is a designated rest stop for bicyclists
    B: Bicycles must stop and yield to all motor vehicles
    C: It is an area where two movements cross over each other
    D: Vehicles are allowed to park in this lane temporarily
  answer: C
  explanation: Green paint emphasizes where two movements cross over each other. Drivers
    must be aware that bikes may be present and bicyclists must be aware that vehicles
    cross the bike lane in this area.
- id: 146
  category: signs_and_signals
  question: What is the state of the signal light on a Pedestrian Hybrid Beacon before
    a pedestrian pushes the crosswalk button?
  choices:
    A: Flashing yellow
    B: Solid red
    C: Flashing red
    D: Unlit
  answer: D
  explanation: The signal light the driver sees on a Pedestrian Hybrid Beacon is unlit
    until the pedestrian pushes the crosswalk button.
- id: 147
  category: safe_driving_rules
  question: What is a thru-turn intersection?
  choices:
    A: An intersection that prohibits direct left turns.
    B: An intersection where all traffic must turn right.
    C: An intersection controlled by a single point traffic signal.
    D: An intersection that channels traffic to the left side of the highway.
  answer: A
  explanation: According to the manual, a thru-turn is a method of managing intersection
    traffic by prohibiting direct left turns.
- id: 148
  category: safe_driving_rules
  question: If you exit the freeway by mistake at a Single Point Urban Interchange
    (SPUI), what must you do?
  choices:
    A: Travel straight across the highway and get on at the other side.
    B: Stop in the intersection and back up onto the freeway.
    C: Turn left or right onto the intersecting highway and find a safe place to turn
      around.
    D: Make a U-turn immediately in the middle of the interchange.
  answer: C
  explanation: The manual states that if you exit the freeway by mistake at a SPUI,
    you cannot travel straight across the highway. You need to turn left or right
    onto the intersecting highway and find a safe place to turn around.
- id: 149
  category: safe_driving_rules
  question: What is a defining feature of a Diverging Diamond Interchange (DDI)?
  choices:
    A: It requires all drivers to make a U-turn downstream.
    B: It temporarily channels traffic lanes to the left side of the highway.
    C: It prohibits pedestrians and bicyclists from crossing.
    D: It allows drivers to travel straight across the highway to re-enter the freeway.
  answer: B
  explanation: A Diverging Diamond Interchange (DDI) temporarily channels traffic
    lanes to the left side of the highway in order to create direct access with the
    interstate.
- id: 150
  category: safe_driving_rules
  question: What does Idaho's "basic rule" law require of drivers?
  choices:
    A: To always drive exactly at the posted speed limit.
    B: To drive at a speed that is reasonable and prudent at all times.
    C: To always drive at least 10 miles per hour below the speed limit.
    D: To yield the right-of-way to vehicles entering from the left.
  answer: B
  explanation: Idaho law has a basic rule requiring you to drive at a speed that is
    "reasonable and prudent" at all times, taking into account road surfaces, hazards,
    visibility, and traffic.
- id: 151
  category: safe_driving_rules
  question: What is the maximum speed limit in any residential, business, or urban
    district in Idaho unless otherwise posted?
  choices:
    A: 25 miles per hour
    B: 30 miles per hour
    C: 35 miles per hour
    D: 45 miles per hour
  answer: C
  explanation: The manual states that the maximum speed in any residential, business,
    or urban district is 35 miles per hour unless otherwise posted.
- id: 152
  category: vehicle_information
  question: On an urban interstate highway, what is the maximum speed limit for a
    vehicle with 5 or more axles weighing over 26,000 pounds?
  choices:
    A: 55 miles per hour
    B: 65 miles per hour
    C: 70 miles per hour
    D: 75 miles per hour
  answer: B
  explanation: Vehicles with 5 or more axles and over 26,000 pounds shall not exceed
    65 miles per hour on urban interstate highways.
- id: 153
  category: penalties_and_points
  question: What is a potential consequence of violating a speed limit in a designated
    work zone?
  choices:
    A: A mandatory license suspension for 30 days.
    B: An enhanced, fixed penalty.
    C: A requirement to retake the driving test.
    D: Immediate vehicle impoundment.
  answer: B
  explanation: The manual explicitly states that violating a work zone speed limit
    can result in an enhanced, fixed penalty.
- id: 154
  category: signs_and_signals
  question: How should you respond to a steady red arrow traffic indication?
  choices:
    A: Treat it as a yield sign and proceed if clear.
    B: Stop, then you may turn in the direction of the arrow after yielding.
    C: Stop and do not make a turn until a green or yellow light indication allows
      movement.
    D: Slow down and proceed with caution in the direction of the arrow.
  answer: C
  explanation: You must STOP for any steady red arrow indication; it is the same as
    a stop sign. You may not make a turn at the red arrow until a green or yellow
    light indication allows movement.
- id: 155
  category: sharing_the_road
  question: What must you do when an emergency vehicle sounding a siren or flashing
    red or blue lights approaches?
  choices:
    A: Stop immediately in your current lane.
    B: Pull over to the nearest edge or curb on the right side of the highway, clear
      of any intersection, and stop.
    C: Speed up to get out of the emergency vehicle's way.
    D: Pull over to the left side of the highway and slow down.
  answer: B
  explanation: You must pull over to the nearest edge or curb on the right side of
    the highway and clear of any intersection, and remain stopped until the emergency
    vehicle has passed.
- id: 156
  category: sharing_the_road
  question: Under what condition are you NOT required to stop for a school bus displaying
    flashing red lights?
  choices:
    A: When you are traveling in the same direction as the bus on a multi-lane highway.
    B: When you are traveling in the opposite direction on highways with four or more
      lanes if two lanes are going in each direction.
    C: When you are running late and there are no children visible on the road.
    D: When the bus is stopped in a designated school zone.
  answer: B
  explanation: You do not have to stop if you are traveling in the opposite direction
    on highways with four or more lanes if two lanes are going in each direction.
- id: 157
  category: defensive_driving
  question: When stopping behind another vehicle, what is a safe driving habit to
    determine if you have left enough distance?
  choices:
    A: You should be able to see the rear bumper of the vehicle in front of you.
    B: You should leave exactly one car length of space.
    C: You should be able to see the rear tires of the vehicle in front of you where
      they touch the ground.
    D: You should be close enough to read the vehicle's license plate clearly.
  answer: C
  explanation: When stopping behind another vehicle, a safe driving habit is to leave
    enough distance between the vehicles to see the rear tires (where they touch the
    ground) of the vehicle in front of you.
- id: 158
  category: safe_driving_rules
  question: How far in advance must you start your turn signal on a freeway or highway?
  choices:
    A: At least 50 feet before you turn or change lanes.
    B: At least 100 feet before you turn or change lanes.
    C: At least three seconds before you turn or change lanes.
    D: At least five seconds before you turn or change lanes.
  answer: D
  explanation: Signals must start at least 100 feet (in business or residential areas)
    or five seconds (on freeways or highways) before you turn or change lanes.
- id: 159
  category: signs_and_signals
  question: What is the correct hand and arm signal for slowing or stopping?
  choices:
    A: Arm and hand extended straight out the window.
    B: Arm and hand extended upward out the window.
    C: Arm and hand extended downward out the window.
    D: Arm and hand waved in a circular motion out the window.
  answer: C
  explanation: The correct arm signal for slow or stop is your arm and hand extended
    downward out the window.
- id: 160
  category: signs_and_signals
  question: When stopped at a steady red circular traffic indication, when are you
    permitted to make a left turn?
  choices:
    A: You may never make a left turn on a red light.
    B: You may turn left onto a one-way street after stopping and yielding to cross-traffic,
      unless prohibited.
    C: You may turn left onto any street as long as there is no oncoming traffic.
    D: You may turn left only if a green arrow is also illuminated.
  answer: B
  explanation: You may turn left onto a one-way street after stopping and yielding
    to cross-traffic unless left turns are not allowed.
- id: 161
  category: safe_driving_rules
  question: If you plan to turn just beyond an intersection, when should you signal?
  choices:
    A: Before you enter the intersection.
    B: While you are stopped at the intersection.
    C: Just after you pass through the intersection.
    D: Exactly 100 feet before the intersection.
  answer: C
  explanation: If you plan to turn just beyond an intersection, signal just after
    you pass through the intersection so you won’t confuse other drivers.
- id: 162
  category: safe_driving_rules
  question: Under what circumstances may you make a left turn at a steady red light?
  choices:
    A: When turning from a two-way street onto a one-way street
    B: When turning from a one-way street onto a one-way street, after stopping and
      yielding
    C: Whenever there is no oncoming traffic in the intersection
    D: Left turns on a steady red light are never permitted
  answer: B
  explanation: When turning left, from a one-way street, onto a one-way street, you
    may proceed from a steady red light after stopping and yielding for cross-traffic,
    unless otherwise posted.
- id: 163
  category: safe_driving_rules
  question: You may not make a U-turn near the crest of a hill if your vehicle cannot
    be seen by approaching vehicles within what distance?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: U-turns may not be made on the approach of or near the crest of a hill
    where the vehicle cannot be seen by approaching vehicles from either direction
    within 500 feet.
- id: 164
  category: signs_and_signals
  question: What do solid pavement markings in the center of the road indicate regarding
    U-turns?
  choices:
    A: U-turns are permitted if the way is clear
    B: U-turns are prohibited
    C: U-turns are only allowed for emergency vehicles
    D: U-turns must be made at a speed of 15 mph or less
  answer: B
  explanation: Solid pavement markings in the center of the road indicate that a U-turn
    is prohibited.
- id: 165
  category: safe_driving_rules
  question: In most cases, the law requires you to stay as far to the right side of
    the road as possible. Which of the following is an exception to this rule?
  choices:
    A: When driving on a two-lane road with no oncoming traffic
    B: When preparing to make a right turn
    C: When entering the left lane temporarily in order to avoid an obstruction
    D: When approaching a railroad crossing
  answer: C
  explanation: One of the exceptions to keeping to the right is when entering the
    left lane temporarily in order to avoid an obstruction, a pedestrian, or an animal.
- id: 166
  category: sharing_the_road
  question: When must a pedestrian yield the right-of-way to motor vehicles?
  choices:
    A: When crossing a street where there is no crosswalk or intersection
    B: When walking with a white cane or guide dog
    C: When the pedestrian is in an unmarked crosswalk at an intersection
    D: When a vehicle is entering a street from an alley
  answer: A
  explanation: Pedestrians must yield to motor vehicles when the pedestrian is crossing
    a street where there is no crosswalk or intersection.
- id: 167
  category: safe_driving_rules
  question: If two vehicles arrive at an uncontrolled intersection at the same time,
    who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a faster speed
    D: The vehicle turning left
  answer: B
  explanation: At an unmarked or uncontrolled intersection, if two vehicles arrive
    at the same time, the vehicle on the left must yield to the vehicle on the right.
- id: 168
  category: safe_driving_rules
  question: How should you proceed if you approach an intersection where the stop
    light is not functioning due to a power outage?
  choices:
    A: Proceed through without stopping if the road appears clear
    B: Yield to other drivers in the same manner as a four-way stop
    C: The vehicle on the major roadway automatically has the right-of-way
    D: Treat the intersection as a yield sign
  answer: B
  explanation: When a stop light is not functioning due to a power outage, yield to
    other drivers in the same manner as four-way stops.
- id: 169
  category: safe_driving_rules
  question: Passing another vehicle is prohibited when you are within how many feet
    of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Passing is prohibited when you are within 100 feet of an intersection
    or a railroad crossing, unless otherwise indicated by traffic-control devices.
- id: 170
  category: safe_driving_rules
  question: Under Idaho's passing speed limit exception, how much may you exceed the
    posted speed limit when passing another vehicle on a two-lane roadway?
  choices:
    A: Up to 5 miles per hour
    B: Up to 10 miles per hour
    C: Up to 15 miles per hour
    D: Up to 20 miles per hour
  answer: C
  explanation: If you are driving a passenger vehicle, motorcycle or pickup, not towing
    another vehicle, you may exceed the posted speed limit by up to 15 miles per hour
    while passing another vehicle.
- id: 171
  category: safe_driving_rules
  question: Which of the following is a requirement to legally exceed the speed limit
    while passing another vehicle on a two-lane roadway?
  choices:
    A: The posted speed limit must be 55 miles per hour or greater
    B: You must be towing a trailer
    C: You must be driving in a work zone
    D: The vehicle being passed must be traveling at the speed limit
  answer: A
  explanation: To use the passing speed limit exception, the posted speed limit must
    be 55 miles per hour or greater, and it does not apply in work zones or if you
    are towing another vehicle.
- id: 172
  category: safe_driving_rules
  question: When is it legal to pass a vehicle on the right?
  choices:
    A: When the vehicle you are overtaking on a two-lane, two-way road is signaling
      to turn left
    B: When you drive off the paved roadway to get around the vehicle
    C: When the vehicle ahead is traveling below the speed limit on a single-lane
      road
    D: When approaching a hill or curve
  answer: A
  explanation: Passing on the right is permitted when the vehicle you're overtaking
    on a two-lane, two-way road is signaling to turn left, provided you do not drive
    off the roadway.
- id: 173
  category: defensive_driving
  question: What should you do when another driver is passing your vehicle?
  choices:
    A: Speed up to prevent them from cutting you off
    B: Move to the left side of your lane
    C: Maintain a steady speed or slow down
    D: Turn on your hazard lights
  answer: C
  explanation: When being passed, you should move to the right side of your lane to
    give them more room, and maintain a steady speed or slow down. Don't speed up.
- id: 174
  category: sharing_the_road
  question: Which of the following is true regarding funeral processions?
  choices:
    A: You may drive between vehicles in the formation if you are in a hurry
    B: You may not enter an intersection when the procession is proceeding through,
      regardless of the traffic light color
    C: Only the first vehicle in the procession is required to have its headlights
      on
    D: You should pass the procession in the right lane on a multi-lane highway
  answer: B
  explanation: You may not enter an intersection when the procession is proceeding
    through (regardless of the color of the traffic light) unless you can do so without
    crossing the path of the procession.
- id: 175
  category: sharing_the_road
  question: What lighting requirement applies to all vehicles participating in a funeral
    procession?
  choices:
    A: Only the first and last vehicles need their headlights on.
    B: All vehicles must have their headlights and tail lights turned on.
    C: All vehicles must have their warning lights flashing.
    D: Only the lead vehicle must have its tail lights on.
  answer: B
  explanation: According to the manual, all vehicles in a funeral procession are required
    to have their headlights and tail lights turned on.
- id: 176
  category: sharing_the_road
  question: When must a slow-moving vehicle turn off the road to let other vehicles
    pass?
  choices:
    A: When it is delaying two or more vehicles on any road.
    B: When it is delaying three or more other vehicles in a rural area or on a two-lane
      highway.
    C: When it is traveling slower than 45 mph on an interstate.
    D: When it is traveling during nighttime hours.
  answer: B
  explanation: Any vehicle traveling slower than the normal speed of traffic delaying
    three or more other vehicles in a rural area or on a two-lane highway must turn
    off the road wherever safe to let the other vehicles pass.
- id: 177
  category: safe_driving_rules
  question: What is the minimum recommended following distance under ideal conditions?
  choices:
    A: One car length for every 10 mph
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: C
  explanation: The three-second following distance rule is the minimum recommended
    safest procedure to use.
- id: 178
  category: safe_driving_rules
  question: When parking parallel on a public road, how close must your vehicle be
    to the curb or edge of the roadway?
  choices:
    A: Within 12 inches
    B: Within 18 inches
    C: Within 24 inches
    D: Within 36 inches
  answer: B
  explanation: When parking on a public road, you must park parallel to and within
    18 inches of the curb or edge of the roadway.
- id: 179
  category: safe_driving_rules
  question: Which way should you turn your front wheels when parked facing uphill
    on a street with a curb?
  choices:
    A: Sharply toward and against the curb
    B: Straight ahead
    C: Sharply away and against the curb
    D: Sharply toward the edge of the road
  answer: C
  explanation: If you are facing uphill, turn your wheels sharply away and against
    the curb.
- id: 180
  category: safe_driving_rules
  question: Parking is prohibited within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: Parking is not allowed within 15 feet of a fire hydrant.
- id: 181
  category: safe_driving_rules
  question: Parking is not allowed within how many feet of a stop sign, yield sign,
    or traffic signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Parking is not allowed within 30 feet of a stop sign, yield sign, or
    traffic signal.
- id: 182
  category: safe_driving_rules
  question: What is the proper technique for looking behind you when backing up a
    vehicle?
  choices:
    A: Rely entirely on your rearview and side mirrors.
    B: Put your right arm on the back of the passenger seat and look over your shoulder
      directly through the rear window.
    C: Open the driver's side door and look backward.
    D: Look over your left shoulder while keeping both hands on the steering wheel.
  answer: B
  explanation: When backing, put your right arm on the back of the passenger seat
    and look over your shoulder directly through the rear window. Don't rely on your
    mirrors.
- id: 183
  category: safe_driving_rules
  question: Where is backing up a vehicle always prohibited?
  choices:
    A: In residential driveways
    B: On rural two-lane highways
    C: On freeways, expressways, and other controlled-access highways
    D: In parallel parking spaces
  answer: C
  explanation: Backing is always prohibited on freeways, expressways, and other controlled-access
    highways, including the shoulder.
- id: 184
  category: safe_driving_rules
  question: What is the maximum speed limit for passenger vehicles on rural interstates,
    where designated and weather permitting?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: Where designated and as weather conditions permit, vehicles may travel
    at speeds up to 80 miles per hour on rural interstates.
- id: 185
  category: defensive_driving
  question: What should you do if you enter the wrong freeway entrance ramp by mistake?
  choices:
    A: Carefully back up to the street you came from.
    B: Turn around through the median crossover.
    C: Continue onto the freeway and wait until the next exit to change directions.
    D: Stop on the acceleration lane and wait for traffic to clear before making a
      U-turn.
  answer: C
  explanation: If you enter the wrong entrance by mistake, never try to back up or
    turn around through the median. If you need to get off the freeway or change directions,
    wait until the next exit to do so.
- id: 186
  category: safe_driving_rules
  question: When merging onto a freeway from an acceleration lane, who has the right-of-way?
  choices:
    A: The vehicle entering the freeway
    B: The traffic already on the highway
    C: Whichever vehicle is traveling faster
    D: The vehicle in the rightmost lane must yield to entering traffic
  answer: B
  explanation: As the ramp straightens, accelerate to the speed of the freeway traffic
    so you can blend in smoothly. Remember, you must yield to the traffic already
    on the highway.
- id: 187
  category: safe_driving_rules
  question: How long should you signal before making a lane change or exiting a freeway?
  choices:
    A: At least two seconds
    B: At least three seconds
    C: At least five seconds
    D: At least ten seconds
  answer: C
  explanation: Always signal for at least five seconds before making a lane change
    or exiting a freeway.
- id: 188
  category: defensive_driving
  question: During rush hours on a freeway, why should you avoid driving in the far
    right lane?
  choices:
    A: Because it is reserved for high-occupancy vehicles.
    B: To allow room for drivers entering the freeway.
    C: Because it is designated for heavy trucks only.
    D: To avoid being stopped by emergency vehicles.
  answer: B
  explanation: During rush hours, you should avoid the right lane to allow room for
    drivers entering the freeway.
- id: 189
  category: vehicle_information
  question: During what hours are slow-moving vehicles designed to travel no faster
    than 25 mph generally allowed on public highways?
  choices:
    A: Only between 9:00 AM and 3:00 PM
    B: 24 hours a day, provided they have flashing lights
    C: Daylight hours only (30 minutes before sunrise to 30 minutes after sunset)
    D: Only during nighttime hours to avoid heavy traffic
  answer: C
  explanation: Slow-moving vehicles designed to travel no faster than 25 miles per
    hour may travel on public highways during daylight hours only (30 minutes before
    sunrise to 30 minutes after sunset), except for certain snow removal and farm
    equipment.
- id: 190
  category: safe_driving_rules
  question: Who is permitted to use the crossovers on interstate highways (freeways)?
  choices:
    A: Any vehicle making a U-turn
    B: Emergency vehicles only
    C: Maintenance vehicles and passenger cars
    D: Vehicles that missed their exit
  answer: B
  explanation: According to the manual, driving across a median strip crossover on
    an interstate highway is not allowed; crossovers are for emergency vehicles only.
- id: 191
  category: safe_driving_rules
  question: When preparing to exit a freeway, at what distance should you signal and
    move into the lane nearest the exit?
  choices:
    A: About a quarter mile before the exit
    B: About a half mile before the exit
    C: About one mile before the exit
    D: Just as you reach the exit ramp
  answer: B
  explanation: The manual advises that if you are not already in the correct lane,
    you should signal and move into the lane nearest the exit about a half mile before
    the exit.
- id: 192
  category: safe_driving_rules
  question: According to the manual, what percentage of highway crashes are caused
    by driver error?
  choices:
    A: About 50%
    B: Exactly 75%
    C: More than 90%
    D: Less than 30%
  answer: C
  explanation: The manual explicitly states that driver error causes more than 90%
    of highway crashes.
- id: 193
  category: safe_driving_rules
  question: 'When pulling into a parking space or changing lanes, you must signal
    for the required five seconds or:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: The five-step procedure requires you to signal for the required five
    seconds or 100 feet before moving your vehicle.
- id: 194
  category: safe_driving_rules
  question: What is the first thing you should do before getting into your vehicle
    to drive?
  choices:
    A: Adjust your mirrors
    B: Buckle your safety belt
    C: Look in front and back of the vehicle for children or obstacles
    D: Check the parking brake
  answer: C
  explanation: Before you get into your vehicle, the manual instructs you to always
    look in front and back of it to see if there is a child or obstacle you might
    run over.
- id: 195
  category: defensive_driving
  question: To be prepared to react promptly to emergencies, where should your hands
    be placed on the steering wheel?
  choices:
    A: Ten o'clock and two o'clock
    B: Nine o'clock and three o'clock
    C: Eight o'clock and four o'clock
    D: Twelve o'clock and six o'clock
  answer: B
  explanation: The manual recommends driving with both hands placed on opposite sides
    of the steering wheel at approximately the nine o'clock and three o'clock positions.
- id: 196
  category: defensive_driving
  question: How far ahead should a good driver look while driving in the city?
  choices:
    A: 3 to 5 seconds ahead
    B: 5 to 10 seconds ahead
    C: 10 to 15 seconds ahead (about a block)
    D: 20 to 30 seconds ahead (about three blocks)
  answer: C
  explanation: Good drivers keep an eye on what's happening about ten to 15 seconds
    ahead, which is about a block in city driving.
- id: 197
  category: defensive_driving
  question: Why should you check the traffic behind you several times a minute?
  choices:
    A: To see if you are driving too slowly
    B: To know if somebody is tailgating or coming up too fast
    C: To admire the scenery behind you
    D: To check if your taillights are working
  answer: B
  explanation: You should check the traffic behind you frequently so you'll know if
    somebody is tailgating, coming up too fast, or trying to pass, as most rear-end
    collisions are caused by following too closely.
- id: 198
  category: defensive_driving
  question: What is the proper way to check your blind spots before making a move
    to the side?
  choices:
    A: Rely entirely on your rearview mirror
    B: Check your side mirrors for at least five seconds
    C: Quickly turn your head to look into the blind spot
    D: Honk your horn to warn vehicles in your blind spot
  answer: C
  explanation: The manual states that you should never rely on your mirrors alone.
    Before you make any move to the side, quickly turn your head to see if your blind
    spot is clear.
- id: 199
  category: defensive_driving
  question: When you spot a potential hazard on the road, what is the safest way to
    predict what will happen?
  choices:
    A: Predict that other drivers will yield to you
    B: Predict the worst possible outcome
    C: Predict that the hazard will move out of your way
    D: Predict that your vehicle can stop instantly
  answer: B
  explanation: Under the 'Predict' step of the crash prevention formula, the manual
    advises that after spotting a potential hazard, it's safest to predict the worst.
- id: 200
  category: sharing_the_road
  question: What should you do if another driver attempts to pass you as you approach
    a curve or hill?
  choices:
    A: Speed up to prevent them from passing
    B: Maintain your speed and honk your horn
    C: Move into the oncoming lane to give them room
    D: Slow down and let them back into your lane quickly
  answer: D
  explanation: If a driver passes as you approach a curve, hill, or an oncoming car,
    you should slow down and let them back into your lane quickly to help them out.
- id: 201
  category: driver_responsibility
  question: According to the manual, what should you do if you are upset before getting
    behind the wheel?
  choices:
    A: Drive slower than the posted speed limit
    B: Let someone else drive
    C: Turn on the radio to calm down
    D: Roll down the windows for fresh air
  answer: B
  explanation: 'The manual states that if you are worried, distracted, or upset, you
    are far more likely to have a crash, and advises: ''If you''re upset, let someone
    else drive.'''
- id: 202
  category: safe_driving_rules
  question: Which of the following is considered a dangerous distraction while driving?
  choices:
    A: Keeping your eyes moving to scan the road
    B: Checking your mirrors several times a minute
    C: Reading or writing
    D: Keeping both hands on the steering wheel
  answer: C
  explanation: The manual lists 'Reading or writing' as one of the distractions that
    draws your attention away from the road and can cause crashes.
- id: 203
  category: safe_driving_rules
  question: What is the final step in the five-step procedure for starting from a
    curb, pulling into a parking space, or changing lanes?
  choices:
    A: Glance over your shoulder
    B: Cancel the turn signal
    C: Check your mirrors
    D: Make your move gradually
  answer: B
  explanation: The fifth and final step in the five-step procedure listed in the manual
    is to 'Cancel the turn signal.'
- id: 204
  category: defensive_driving
  question: How loud should you keep your stereo volume while driving?
  choices:
    A: Loud enough to block out wind noise
    B: Low enough so that you can still hear things outside your car
    C: Completely muted at all times
    D: Loud enough to keep you awake on long trips
  answer: B
  explanation: The manual states to keep the stereo volume low enough so that you
    can still hear things outside your car, such as emergency sirens and car horns,
    which can alert you to danger.
- id: 205
  category: penalties_and_points
  question: For a non-commercial driver in Idaho, what is the penalty for a conviction
    of texting while driving?
  choices:
    A: A fine and points on the driver's record
    B: A fine, but no points on the driver's record
    C: Immediate license suspension
    D: A warning for the first offense
  answer: B
  explanation: Texting while driving is an infraction that will result in a fine,
    but will not result in points on a driver's record unless the driver is operating
    a commercial motor vehicle.
- id: 206
  category: safe_driving_rules
  question: According to the driver's manual, how dangerous is texting while driving
    compared to driving impaired?
  choices:
    A: It is twice as dangerous.
    B: It is equally as dangerous.
    C: It is six times more dangerous.
    D: It is ten times more dangerous.
  answer: C
  explanation: The manual explicitly states that texting while driving is six times
    more dangerous than driving impaired.
- id: 207
  category: defensive_driving
  question: What is "highway hypnosis"?
  choices:
    A: A state of drowsiness brought on by monotony and the drone of wind and tires
    B: A visual illusion caused by heat reflecting off the pavement
    C: The tendency to speed up when passing large trucks
    D: A medical condition that prevents drivers from seeing clearly at night
  answer: A
  explanation: Freeway drivers often suffer highway hypnosis, which is drowsiness
    brought on by monotony and the drone of wind and tires.
- id: 208
  category: safe_driving_rules
  question: What will happen to a vehicle left unattended on the paved portion of
    a highway (off the traveled portion) if it is not removed prior to darkness?
  choices:
    A: It will be tagged with a warning sticker.
    B: It will be pushed off the paved portion by law enforcement.
    C: It will be subject to towing at the owner's expense.
    D: It will be impounded for 30 days.
  answer: C
  explanation: Vehicles left unattended on the paved portion of a highway create a
    potential danger during darkness and must be removed prior to darkness or be subject
    to towing at the owner's expense.
- id: 209
  category: driver_responsibility
  question: Who is the "Alive at 25" defensive driving course designed for?
  choices:
    A: Drivers who have accumulated 25 points on their record
    B: Drivers who are 15 through 24 years old
    C: Senior citizens over the age of 65
    D: Commercial drivers with 25 years of experience
  answer: B
  explanation: Alive at 25 is a defensive driving course offered for those who are
    15 through 24 years old to present traffic safety strategies for young drivers.
- id: 210
  category: sharing_the_road
  question: What must you do when approaching a stopped tow truck with flashing lights
    on a multi-lane road?
  choices:
    A: Maintain your speed but honk your horn
    B: Stop immediately in your lane
    C: Reduce your speed below the posted limit and change lanes away from the truck
      if safe to do so
    D: Accelerate to pass the incident as quickly as possible
  answer: C
  explanation: When approaching a stopped tow truck or incident response vehicle with
    flashing lights, you must immediately reduce your speed below the posted limit
    and, if on a multi-lane road, change lanes away from the vehicle if safe to do
    so.
- id: 211
  category: sharing_the_road
  question: In which of the following situations must a motor vehicle yield to a pedestrian?
  choices:
    A: When the pedestrian is crossing where there is no crosswalk or intersection
    B: When the motor vehicle is entering a street from an alley or driveway
    C: When the pedestrian is walking on a sidewalk parallel to the road
    D: When the pedestrian is waiting at a bus stop
  answer: B
  explanation: Motor vehicles must yield to pedestrians when the motor vehicle is
    entering a street from an alley or driveway.
- id: 212
  category: sharing_the_road
  question: You are in the left lane approaching an intersection, and a vehicle in
    the right lane has stopped for a pedestrian. What should you do?
  choices:
    A: Honk your horn to warn the pedestrian and proceed
    B: Pass the stopped vehicle carefully on the left
    C: Do not pass the other vehicle; wait for the pedestrian to cross
    D: Change to the right lane behind the stopped vehicle
  answer: C
  explanation: If a vehicle in another lane has stopped for a pedestrian to cross,
    you must NOT pass the other vehicle. You must wait for the pedestrian to cross
    and then be sure it is safe to proceed.
- id: 213
  category: defensive_driving
  question: What is a recommended practice before getting into your vehicle to prevent
    accidents involving children?
  choices:
    A: Honk your horn twice before starting the engine
    B: Walk around your vehicle to be sure no children are playing near it
    C: Check your rearview mirror for at least 10 seconds
    D: Roll down your windows to listen for children playing
  answer: B
  explanation: Before getting into your vehicle, you should walk around it to be sure
    no children are playing near it whom you may not be able to see from the driver’s
    seat.
- id: 214
  category: sharing_the_road
  question: What should you NEVER do when approaching someone riding a horse on a
    public road?
  choices:
    A: Slow down
    B: Allow plenty of room when passing
    C: Sound your horn
    D: Stop if the rider is having difficulty
  answer: C
  explanation: When approaching someone riding a horse, never sound your horn because
    you may frighten the horse and cause an accident.
- id: 215
  category: sharing_the_road
  question: What is the minimum safe margin of clearance required when passing a bicyclist?
  choices:
    A: One (1) foot
    B: Two (2) feet
    C: Three (3) feet
    D: Five (5) feet
  answer: C
  explanation: To increase the safety margin when passing a bicyclist, pass with as
    much clearance as possible. A safe margin is at least three (3) feet.
- id: 216
  category: sharing_the_road
  question: How are bicyclists required to travel in relation to traffic on Idaho
    roadways?
  choices:
    A: They must ride facing oncoming traffic.
    B: They must ride with the flow of traffic.
    C: They must ride on the sidewalk whenever possible.
    D: They may ride in whichever direction they choose.
  answer: B
  explanation: Bicyclists are legally allowed to ride on all Idaho roadways, have
    the same rights as drivers, and are required to ride with the flow of traffic.
- id: 217
  category: safe_driving_rules
  question: How must bicyclists treat stop signs in Idaho?
  choices:
    A: They must come to a complete stop at all times.
    B: They must dismount and walk their bicycle through the intersection.
    C: They do not need to come to a complete stop, but must yield to vehicles with
      the right-of-way.
    D: They have the right-of-way and do not need to yield or stop.
  answer: C
  explanation: In Idaho, bicyclists do not need to come to a complete stop at stop
    signs. However, they must yield the right-of-way to vehicles in, or already at,
    the intersection.
- id: 218
  category: safe_driving_rules
  question: 'When a bicyclist is turning right at a red traffic light, they:'
  choices:
    A: Must wait for the light to turn green.
    B: Must come to a complete stop before turning.
    C: Do not need to come to a complete stop, but must yield the right-of-way.
    D: Must signal for at least 100 feet before turning without stopping.
  answer: C
  explanation: Bicyclists do not need to come to a complete stop when turning right
    on a red light. However, they must yield the right-of-way to vehicles already
    in the intersection.
- id: 219
  category: defensive_driving
  question: How can a driver avoid a 'right hook' crash when preparing for a right
    turn with a bicyclist ahead?
  choices:
    A: Speed up to beat the bicyclist to the intersection.
    B: Honk to warn the bicyclist to move out of the way.
    C: Slow down and remain behind the bicyclist until they ride past the turn point.
    D: Move into the oncoming traffic lane to pass before turning.
  answer: C
  explanation: Drivers can avoid right-hook crashes by slowing and remaining behind
    the bicyclist until they ride past the point where the driver will turn.
- id: 220
  category: sharing_the_road
  question: What should a driver do when turning right at an intersection with a dashed
    bike lane line?
  choices:
    A: Stay completely out of the bike lane at all times.
    B: Occupy the bike lane in the dashed line area after checking for bicyclists.
    C: Stop and wait for a bicyclist to guide them through the turn.
    D: Honk to clear the bike lane before entering.
  answer: B
  explanation: When turning right at an intersection, you may occupy the bike lane
    in the dashed line area. This prevents bicyclists from approaching along your
    right side.
- id: 221
  category: defensive_driving
  question: Why should you never honk when close to a bicyclist?
  choices:
    A: It is illegal in all residential areas.
    B: It may startle the bicyclist and cause an unexpected reaction.
    C: Bicyclists cannot hear car horns due to wind noise.
    D: It signals to the bicyclist that they have the right-of-way.
  answer: B
  explanation: The manual states to never honk when close to a bicyclist; it may startle
    the bicyclist and cause an unexpected reaction.
- id: 222
  category: safe_driving_rules
  question: When exiting a parallel parked car, why should you reach for the door
    handle with your opposite hand?
  choices:
    A: It prevents the door from opening too quickly in high winds.
    B: It forces you to turn and look over your shoulder for approaching bicyclists.
    C: It allows you to keep your foot firmly on the brake pedal.
    D: It automatically engages the vehicle's child safety locks.
  answer: B
  explanation: Reaching across your body for the door handle with your opposite hand
    forces you to turn toward the side view mirror and look over your shoulder to
    be sure a bicyclist is not coming.
- id: 223
  category: signs_and_signals
  question: What is the purpose of a 'sharrow' or shared-lane marking on the street?
  choices:
    A: To indicate a lane where bicycles are strictly prohibited.
    B: To mark a designated parking area for bicycles.
    C: To assist bicyclists with lateral positioning and alert road users of their
      likely location.
    D: To warn drivers of an upcoming pedestrian crosswalk.
  answer: C
  explanation: A shared-lane marking is used to assist bicyclists with lateral positioning,
    alert road users of the lateral location bicyclists are likely to occupy, and
    encourage safe passing.
- id: 224
  category: sharing_the_road
  question: What is a common cause of serious crashes involving cars and oncoming
    motorcycles?
  choices:
    A: Cars turning left in front of an oncoming motorcycle.
    B: Motorcycles rear-ending cars at stop signs.
    C: Cars passing motorcycles on the right shoulder.
    D: Motorcycles failing to use their headlights at night.
  answer: A
  explanation: Cars turning left in front of an oncoming motorcycle cause serious
    motor vehicle crashes because drivers may fail to see the rider or misjudge their
    speed.
- id: 225
  category: defensive_driving
  question: If you see a motorcycle approaching with a flashing turn signal, what
    should you keep in mind before turning in front of it?
  choices:
    A: Motorcycles always have the right-of-way when their signals are on.
    B: Most motorcycle turn signals do not turn off automatically, so the rider may
      have forgotten to switch it off.
    C: The motorcycle is definitely preparing to turn into your lane.
    D: You should honk your horn to acknowledge their signal.
  answer: B
  explanation: Most motorcycles do not have turn signals that turn off automatically.
    Before making a turn in front of a motorcycle with a signal flashing, be sure
    the motorcycle is actually turning.
- id: 226
  category: sharing_the_road
  question: If a motorcycle is riding far to one side of a wide lane, what should
    you do?
  choices:
    A: Move into the same lane alongside the motorcycle to pass.
    B: Honk to let the motorcycle know you are sharing the lane.
    C: Never move into the same lane alongside the motorcycle.
    D: Flash your high beams to force the motorcycle to the center.
  answer: C
  explanation: Motorcycles are entitled to the same full-lane width as all other motor
    vehicles. You should never move into the same lane alongside a motorcycle, even
    if the lane is wide.
- id: 227
  category: defensive_driving
  question: When stopped and preparing to turn right, why must you look left, right,
    and to the rear, checking the right first?
  choices:
    A: To check for emergency vehicles approaching from the left.
    B: To ensure your turn signal is functioning properly.
    C: Because a bicyclist riding against traffic or on the sidewalk may be approaching
      on your right.
    D: Because pedestrians always cross from the right side first.
  answer: C
  explanation: When stopped, never look only to the left before turning right. A bicyclist
    riding against traffic or on the sidewalk may be approaching on your right.
- id: 228
  category: defensive_driving
  question: Why is it a good safety practice to scan the corners of an intersection
    more than once before proceeding?
  choices:
    A: Traffic lights often change unpredictably.
    B: An approaching bicyclist can easily travel 50 to 100 feet in a few seconds.
    C: It gives your vehicle's blind spot monitors time to activate.
    D: It is required by law to stop for at least five seconds.
  answer: B
  explanation: An approaching bicyclist can easily travel 50 to 100 feet in a few
    seconds, so what you saw on your first look may change. Looking one last time
    before proceeding is a good safety practice.
- id: 229
  category: sharing_the_road
  question: Why might a bicyclist occupy the center of a travel lane instead of riding
    to the right?
  choices:
    A: To intentionally slow down motor vehicle traffic.
    B: Because it is illegal for bicycles to ride on the right edge of the road.
    C: For safety on brief stretches of narrow roadway where it is unsafe for a driver
      to pass.
    D: To prepare for an immediate U-turn.
  answer: C
  explanation: The design of some streets and highways requires that, for safety,
    bicyclists must occupy the travel lane by riding in the center. These are usually
    brief stretches of narrow roadway where it is unsafe for a driver to pass.
- id: 230
  category: sharing_the_road
  question: Why do good motorcycle riders constantly change positions within their
    lane?
  choices:
    A: To warm up their tires for better traction.
    B: To see and be seen, and to avoid objects in the road.
    C: To prevent cars from passing them on multi-lane highways.
    D: To test their steering and balance.
  answer: B
  explanation: Good motorcycle riders are constantly changing positions within the
    lane so they can see and be seen, and to avoid objects in the road.
- id: 231
  category: sharing_the_road
  question: When sharing the road with a motorcycle, is it safe to move into the same
    lane alongside them?
  choices:
    A: Yes, if the lane is wide enough.
    B: Yes, if the motorcycle is riding far to one side.
    C: No, motorcycles are entitled to the same full-lane width as all other vehicles.
    D: No, unless you are preparing to make a turn.
  answer: C
  explanation: Motorcycles are entitled to the same full-lane width as all other motor
    vehicles. You should never move into the same lane alongside a motorcycle, even
    if the lane is wide.
- id: 232
  category: defensive_driving
  question: How much following distance should you allow between your vehicle and
    a motorcycle?
  choices:
    A: At least one second
    B: At least two seconds
    C: More than three seconds
    D: More than five seconds
  answer: C
  explanation: You should allow more than three (3) seconds following distance between
    your vehicle and the motorcycle to allow enough time to maneuver or stop in an
    emergency.
- id: 233
  category: sharing_the_road
  question: How can you tell if you are driving in a large vehicle's blind spot while
    following it?
  choices:
    A: If you cannot see the driver's mirrors, the driver cannot see you.
    B: If you are within 50 feet of the rear bumper.
    C: If you cannot see the vehicle's license plate.
    D: If the truck is traveling faster than 55 mph.
  answer: A
  explanation: If you are following a large vehicle and you are unable to see the
    driver's mirrors, then the driver cannot see you. There are blind spots behind
    and on each side of large vehicles.
- id: 234
  category: vehicle_information
  question: Approximately how long does it take a loaded truck with properly adjusted
    brakes to come to a complete stop when traveling 55 miles per hour on a dry road?
  choices:
    A: 150 feet
    B: 250 feet
    C: 350 feet
    D: 450 feet
  answer: D
  explanation: It takes a loaded truck with properly adjusted brakes 450 feet to come
    to a complete stop when traveling 55 miles per hour on a dry road.
- id: 235
  category: safe_driving_rules
  question: Why should you avoid squeezing by on the right side of a large vehicle
    that is making a right turn?
  choices:
    A: The vehicle will likely accelerate quickly.
    B: The driver may angle into the left lane to make the turn without hitting the
      curb.
    C: The vehicle's exhaust is expelled on the right side.
    D: The driver is required to stop before completing the turn.
  answer: B
  explanation: When turning right, drivers of large vehicles may angle into the left
    lane so they can make the right turn without running over the curb. Squeezing
    by on the right is a frequent cause of crashes.
- id: 236
  category: safe_driving_rules
  question: What must all vehicles carrying hazardous materials do at railroad crossings?
  choices:
    A: Slow down to 15 mph.
    B: Sound their horn twice.
    C: Stop at all railroad crossings.
    D: Turn on their hazard lights and proceed without stopping.
  answer: C
  explanation: All vehicles carrying hazardous materials must stop at all railroad
    crossings, so be prepared to stop if you are following one.
- id: 237
  category: safe_driving_rules
  question: What is the purpose of Idaho's 511 Traveler Services?
  choices:
    A: To report aggressive drivers.
    B: To request emergency medical services.
    C: To get up-to-date information on road conditions, closures, and traffic incidents.
    D: To renew your driver's license over the phone.
  answer: C
  explanation: Idaho's 511 system provides up-to-date information on emergency road
    closures, highway roadwork projects, tourism, traffic incidents, and weather-related
    road conditions.
- id: 238
  category: safe_driving_rules
  question: 'When driving down long hills in the mountains, you should:'
  choices:
    A: Coast downhill by shifting into neutral.
    B: Disengage the clutch to save fuel.
    C: Use a lower gear to control your speed.
    D: Ride your brakes continuously.
  answer: C
  explanation: When driving in the mountains, you should use a lower gear to control
    speeds while going down long hills and never coast downhill by shifting into neutral
    or disengaging the clutch.
- id: 239
  category: defensive_driving
  question: What is the recommended action if a small animal suddenly moves into the
    path of your vehicle and it is impossible to safely slow down?
  choices:
    A: Swerve sharply into the oncoming lane.
    B: Slam on your brakes and close your eyes.
    C: Consider running over it as the safest alternative to keep control of the vehicle.
    D: Sound your horn and accelerate.
  answer: C
  explanation: If an animal moves into your path so quickly that it's impossible to
    safely avoid, you must consider running over it as the safest alternative to maintain
    control of the vehicle.
- id: 240
  category: driver_responsibility
  question: If you strike and injure livestock on the 'open range' in Idaho, who is
    liable for the damages to your vehicle?
  choices:
    A: The owner of the animal is fully liable.
    B: The state of Idaho is liable.
    C: The owner of the animal is not liable for damages to you or your vehicle.
    D: Your insurance company will automatically waive your deductible.
  answer: C
  explanation: If you strike and injure or kill livestock on the open range, the owner
    of the animal is not liable for damages to you or your vehicle. You may even be
    liable for the animal if found negligent.
- id: 241
  category: safe_driving_rules
  question: When are you required to turn on your headlights in Idaho?
  choices:
    A: Only when driving on unlit rural roads.
    B: Between sunset and sunrise, or when visibility is reduced to below 500 feet.
    C: Between 8:00 PM and 6:00 AM.
    D: Whenever you are driving over 45 mph.
  answer: B
  explanation: You must turn on your headlights when driving between sunset and sunrise,
    or when visibility has been reduced to below 500 feet.
- id: 242
  category: defensive_driving
  question: To avoid being blinded by the headlights of oncoming vehicles at night,
    where should you look?
  choices:
    A: Directly at the oncoming vehicle's headlights.
    B: At the center line of the road.
    C: Up toward your rearview mirror.
    D: Down to the lower right side of your traffic lane.
  answer: D
  explanation: Avoid looking into the headlights of oncoming vehicles. Instead, shift
    your eyes down to the lower right side of your traffic lane to keep the light
    from hitting your eyes directly.
- id: 243
  category: vehicle_information
  question: At night, approximately how far ahead can you see when using the high
    beams of your headlights?
  choices:
    A: 100 feet
    B: 250 feet
    C: 350 feet
    D: 500 feet
  answer: C
  explanation: The distance you can see ahead is about 350 feet when using the high
    beams of your headlights and about 100 feet when using the low beams.
- id: 244
  category: sharing_the_road
  question: What should you do if you encounter an oncoming pilot vehicle with amber
    lights?
  choices:
    A: Speed up to pass the large load quickly.
    B: Reduce your speed and position your vehicle as far to the right as possible.
    C: Pull completely off the road and turn off your engine.
    D: Flash your high beams to acknowledge their presence.
  answer: B
  explanation: When you encounter an oncoming pilot vehicle, reduce your speed and
    position your vehicle as far to the right as possible.
- id: 245
  category: safe_driving_rules
  question: What should you do when approaching a curve on a narrow mountain road
    where your view is obstructed?
  choices:
    A: Sound your horn.
    B: Flash your high beams three times.
    C: Move into the center of the road.
    D: Stop completely before entering the curve.
  answer: A
  explanation: When driving in the mountains, you should sound the horn when approaching
    any curve on a narrow road where the view is obstructed.
- id: 246
  category: sharing_the_road
  question: What is the recommended following distance when driving behind a snowplow
    truck?
  choices:
    A: One car length for every 10 miles per hour you drive
    B: Two car lengths for every 10 miles per hour you drive
    C: Three car lengths for every 10 miles per hour you drive
    D: A minimum of 500 feet at all times
  answer: B
  explanation: The manual states to remain two car lengths behind snowplow trucks
    for every 10 miles per hour you drive, as sand being spread can damage your vehicle.
- id: 247
  category: vehicle_information
  question: At what speed can your tires lose all contact with the road and begin
    to hydroplane during wet conditions?
  choices:
    A: 35 miles per hour
    B: 45 miles per hour
    C: 55 miles per hour
    D: 65 miles per hour
  answer: C
  explanation: At speeds up to 35 mph, most tires grip the road. However, at 55 miles
    per hour, the tires may lose all contact with the road and start to hydroplane.
- id: 248
  category: safe_driving_rules
  question: How much fast-moving water does it take to wash away a vehicle and reach
    the bottom of most passenger cars?
  choices:
    A: Six inches
    B: Twelve inches
    C: Two feet
    D: Three feet
  answer: C
  explanation: Fast-moving water two feet deep can wash away a vehicle and reach the
    bottom of most passenger cars, causing loss of control or stalling.
- id: 249
  category: defensive_driving
  question: If you get stranded in your vehicle while heavy snow is falling, what
    is the safest course of action?
  choices:
    A: Leave your vehicle immediately to find help
    B: Stay with your vehicle
    C: Walk along the highway shoulder to stay visible
    D: Abandon your car in the middle of the road
  answer: B
  explanation: If you get stranded, stay with your vehicle if heavy snow is falling.
    Most deaths occur when people leave their car, get lost, and freeze.
- id: 250
  category: safe_driving_rules
  question: When are roads generally the most dangerous during a rainstorm?
  choices:
    A: At the start of a light rain
    B: After it has been raining heavily for an hour
    C: When the rain stops and the sun comes out
    D: During a torrential downpour
  answer: A
  explanation: Roads are more dangerous at the start of a light rain when road oil
    and water mix to form a greasy film on the road.
- id: 251
  category: defensive_driving
  question: What should you do if you think your car has started to hydroplane?
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel sharply to regain traction
    C: Accelerate to push through the water
    D: Maintain a steady speed and slowly take your foot off the gas pedal
  answer: D
  explanation: If you start to hydroplane, you should maintain a steady speed, keep
    moving in a straight line, and slowly take your foot off the gas pedal.
- id: 252
  category: safe_driving_rules
  question: Why should you be especially cautious on bridges and overpasses during
    winter?
  choices:
    A: They are usually plowed last
    B: Ice may form sooner or remain longer on them
    C: They are made of materials that repel snow
    D: They are typically narrower than the rest of the road
  answer: B
  explanation: Ice may form sooner or remain on bridges and overpasses longer, since
    they are exposed on their undersides and are deprived of ground warmth.
- id: 253
  category: safe_driving_rules
  question: Under which of the following conditions should you NOT use cruise control?
  choices:
    A: On a clear, dry interstate
    B: When the road is wet and/or icy
    C: During daytime hours
    D: When driving on a straight rural highway
  answer: B
  explanation: For safety reasons, you should not use cruise control if the road is
    wet and/or icy.
- id: 254
  category: defensive_driving
  question: If you are stranded in winter weather and run your car for heat, what
    must you ensure?
  choices:
    A: Your headlights are on high beam
    B: Your windows are completely rolled down
    C: Your exhaust pipe is clear of snow
    D: Your emergency flashers are blinking constantly
  answer: C
  explanation: If you run your car for heat, make sure your exhaust pipe is clear
    of snow to prevent dangerous gases from building up.
- id: 255
  category: defensive_driving
  question: What should you do if your vehicle stalls in a flooded area?
  choices:
    A: Stay inside the vehicle and wait for rescue
    B: Leave it immediately and seek higher ground
    C: Try to restart the engine repeatedly
    D: Climb onto the roof of the vehicle and wait
  answer: B
  explanation: If your vehicle stalls in a flooded area, leave it immediately and
    seek higher ground. Rapidly rising water may engulf the vehicle and sweep it away.
- id: 256
  category: safe_driving_rules
  question: When driving in winter conditions, how should you adjust your slowing
    and stopping distance?
  choices:
    A: Start slowing down at least three times sooner than you normally do
    B: Start slowing down twice as fast as normal
    C: Maintain normal stopping distances but brake harder
    D: Wait until the last moment to brake to keep the brakes warm
  answer: A
  explanation: When roads are slick with ice or snow, you should start slowing your
    car down at least three times sooner than you normally do when turning or stopping.
- id: 257
  category: defensive_driving
  question: Why should you avoid using your emergency flashers while moving in heavy
    fog or bad conditions?
  choices:
    A: It drains the vehicle's battery too quickly
    B: It is illegal in the state of Idaho
    C: Other drivers may think you have stopped
    D: It causes a glare that blinds oncoming traffic
  answer: C
  explanation: You should avoid using your emergency flashers while moving because
    other drivers may think you’ve stopped and could crash into you.
- id: 258
  category: safe_driving_rules
  question: If you must park on a highway shoulder at night, what should you do to
    ensure your vehicle is visible?
  choices:
    A: Leave your high beam headlights on
    B: Turn on your emergency flashers or parking lights
    C: Keep your interior dome light on
    D: Place a bright scarf on your antenna
  answer: B
  explanation: If you must park on a highway shoulder at night, turn on your emergency
    flashers or parking lights.
- id: 259
  category: vehicle_information
  question: If your vehicle is equipped with an anti-lock braking system (ABS), how
    should you brake during an emergency stop?
  choices:
    A: Pump the brake pedal hard and fast
    B: Apply continuous pressure on the brake pedal
    C: Lightly tap the brake pedal to avoid locking the wheels
    D: Press the brake pedal and immediately release it
  answer: B
  explanation: During an emergency stop that requires hard braking with ABS, apply
    continuous pressure on the brake pedal. Do Not Pump the Brake Pedal as this will
    defeat the system's design.
- id: 260
  category: safe_driving_rules
  question: If your car breaks down on the highway and you have emergency flares,
    where should you place them?
  choices:
    A: 50 to 100 feet behind your car
    B: 100 to 150 feet in front of your car
    C: 200 to 300 feet behind your car
    D: Directly next to the driver's side door
  answer: C
  explanation: If you have emergency flares, place them 200 to 300 feet behind your
    car to give others warning.
- id: 261
  category: defensive_driving
  question: In which situation might accelerating help you avoid or soften the impact
    of a crash?
  choices:
    A: When you are about to hit a vehicle stopped in front of you
    B: When another car is about to hit you from the side or rear
    C: When an oncoming vehicle crosses into your lane
    D: When you experience a sudden tire blowout
  answer: B
  explanation: When another car is about to hit you from the side or rear, accelerating
    may soften the impact or prevent the crash.
- id: 262
  category: defensive_driving
  question: If you are wearing a seat belt and are about to be hit from the front,
    how should you protect yourself?
  choices:
    A: Press the back of your head against the headrest
    B: Prepare to steer to recover from the impact
    C: Unbuckle your seat belt to escape quickly
    D: Use your arms and hands to protect your face
  answer: D
  explanation: If you're about to be hit from the front and you're wearing a seat
    belt, use your arms and hands to protect your face.
- id: 263
  category: driver_responsibility
  question: What must you do if you hit an unattended vehicle and cannot locate the
    owner?
  choices:
    A: Wait by the vehicle until the owner returns
    B: Leave a note telling about the crash with your name and phone number
    C: Drive away and report it to your insurance company later
    D: Honk your horn until someone comes out
  answer: B
  explanation: If the owner cannot be located, leave a note telling about the crash
    with your name and phone number.
- id: 264
  category: defensive_driving
  question: If an oncoming car crosses into your lane and threatens a head-on crash,
    what is the safest action to take?
  choices:
    A: Pull to the left to avoid them
    B: Pull to the right as far as possible
    C: Stop immediately in your lane
    D: Speed up to get past them quickly
  answer: B
  explanation: Pull to the right as far as possible. Don't go left. The other driver
    may recover and hit you broadside.
- id: 265
  category: safe_driving_rules
  question: What is the correct response if you experience a tire blowout while driving?
  choices:
    A: Stomp on the brakes immediately to stop the car
    B: Hold the steering wheel tightly, ease off the gas, and do not brake until you
      have control
    C: Turn the steering wheel sharply to the shoulder of the road
    D: Accelerate slightly to maintain momentum
  answer: B
  explanation: 'For a tire blowout: Hold the steering wheel tightly and keep the car
    headed straight down the road. Ease your foot off the gas pedal, but do not apply
    the brakes until you have complete control.'
- id: 266
  category: safe_driving_rules
  question: What should you do if your vehicle's wheels drop off the pavement onto
    the shoulder?
  choices:
    A: Jerk the steering wheel hard to get back on the pavement immediately
    B: Slam on the brakes to stop the vehicle quickly
    C: Grip the wheel tightly, take your foot off the accelerator, and apply the brakes
      gently
    D: Accelerate to get back onto the road smoothly
  answer: C
  explanation: 'If running off the road: Grip the wheel tightly and steer straight
    ahead. Take your foot off the accelerator and apply the brakes gently.'
- id: 267
  category: driver_responsibility
  question: Under Idaho's 'Quick Clearance' law, what must you do if you are involved
    in a crash on an interstate that does not cause death or injury?
  choices:
    A: Leave the vehicles exactly where they are until police arrive
    B: Safely move the vehicle to a shoulder, median, or emergency lane
    C: Wait for a tow truck before moving the vehicle
    D: Direct traffic around your vehicle while leaving it in the lane
  answer: B
  explanation: Idaho's 'Quick Clearance' law requires anyone involved in the crash
    (on an interstate or major divided highway), that does not cause a death or injury,
    to safely move the vehicle to a shoulder, median, or emergency lane.
- id: 268
  category: driver_responsibility
  question: How does Idaho's Good Samaritan Law protect you at the scene of a crash?
  choices:
    A: It prevents your insurance rates from increasing
    B: It protects you from civil liability if you act in good faith to help an injured
      person
    C: It waives any traffic citations you might have received
    D: It allows you to leave the scene without waiting for police
  answer: B
  explanation: Idaho's Good Samaritan Law protects you from civil liability if you
    act in good faith when giving help to someone injured.
- id: 269
  category: driver_responsibility
  question: You must report a motor vehicle crash to the police if someone is injured
    or if property damage exceeds what amount?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: C
  explanation: You must report to police any motor vehicle crash in which someone
    is injured or property damage is more than $1,500.
- id: 270
  category: license_system
  question: Under the Driver License Compact, what happens if you are a licensed Idaho
    driver and are convicted of a traffic offense in another state?
  choices:
    A: The offense is ignored as long as it did not occur in Idaho
    B: You must surrender your Idaho license and get a license in that state
    C: The information is sent to Idaho and placed on your driving record
    D: You will only have to pay a fine, but no points will be assessed
  answer: C
  explanation: If you are a licensed Idaho driver and are convicted of a traffic offense
    in another state, the information on that offense will be sent to Idaho and placed
    on your driving record.
- id: 271
  category: penalties_and_points
  question: If you are in a crash with an uninsured driver and are unsuccessful in
    collecting damages, what action can the department take after a court judgment?
  choices:
    A: Confiscate the uninsured driver's vehicle
    B: Suspend the uninsured driver's driving privileges until you are paid or for
      up to six years
    C: Force the uninsured driver's employer to garnish their wages
    D: Pay you directly from a state emergency fund
  answer: B
  explanation: After a court judgment has been entered, the department may suspend
    the driving privileges of the uninsured driver until you have been paid, or for
    up to six years.
- id: 272
  category: vehicle_information
  question: When making an emergency stop with an anti-lock braking system (ABS),
    what should you expect to feel or hear?
  choices:
    A: A loud grinding noise and a complete loss of steering control
    B: A noticeable pulse through the brake pedal and noise from the ABS pump motor
    C: The brake pedal dropping completely to the floor without resistance
    D: The engine stalling immediately
  answer: B
  explanation: During hard braking with ABS, the pumping action causes a noise from
    the ABS pump motor, and you may feel a noticeable pulse through the brake pedal.
- id: 273
  category: penalties_and_points
  question: What is the penalty for accumulating 12 to 17 points on your driving record
    within any 12-month period?
  choices:
    A: A warning letter
    B: A 30-day suspension
    C: A 90-day suspension
    D: A 6-month suspension
  answer: B
  explanation: According to the point system, accumulating 12 to 17 points in any
    12 months results in a 30-day suspension.
- id: 274
  category: penalties_and_points
  question: What is the maximum number of points that can be removed from your driving
    record upon completing an ITD-approved Defensive Driving Course (DDC)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: The manual states that a maximum of three (3) points may be removed
    from your driving record upon completion of an ITD-approved DDC.
- id: 275
  category: penalties_and_points
  question: For a driver under 17 years of age, what is the Graduated Drivers License
    (GDL) penalty for a second conviction for a moving traffic violation?
  choices:
    A: A warning letter
    B: A 30-day suspension of driving privileges
    C: A 60-day suspension of driving privileges
    D: A 90-day suspension of driving privileges
  answer: B
  explanation: Under GDL penalties, drivers under 17 receive a 30-day suspension of
    driving privileges for a second conviction for a moving traffic violation.
- id: 276
  category: penalties_and_points
  question: If you receive a Notice of Suspension for failing an evidentiary test
    (Administrative License Suspension), how many days do you have to request an administrative
    hearing?
  choices:
    A: 7 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: A
  explanation: You have the right to request an administrative hearing on the suspension
    within seven (7) days of the date on the notice of suspension.
- id: 277
  category: alcohol_drugs_health
  question: What is the suspension period for a first failure of an evidentiary test
    (Administrative License Suspension)?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: For a first failure of an evidentiary test, your driving privileges
    will be suspended for a period of ninety (90) days.
- id: 278
  category: alcohol_drugs_health
  question: Under Idaho's Implied Consent law, what is the civil penalty for refusing
    to take a BAC or drug test when requested by a law enforcement officer?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: If you refuse to take the test when requested by a law enforcement
    officer, you are subject to a driver's license suspension and a civil penalty
    of $250.00.
- id: 279
  category: penalties_and_points
  question: What is the driver's license suspension penalty for a first offense of
    refusing to take an evidentiary test?
  choices:
    A: 90 days with restricted privileges
    B: 180 days absolute suspension
    C: One year absolute suspension
    D: Two years absolute suspension
  answer: C
  explanation: If you refuse to take the test as requested and the court upholds the
    findings, your license will be suspended for one year with absolutely no driving
    privileges of any kind for a first offense.
- id: 280
  category: penalties_and_points
  question: After your suspension period ends for a first evidentiary test failure,
    how long are you required to have an ignition interlock device installed on any
    vehicle you drive?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: For a first failure, you will be required to have an ignition interlock
    device installed on any vehicle you drive for one (1) year after the end of your
    suspension period.
- id: 281
  category: license_system
  question: If your license was suspended for a serious offense like driving under
    the influence, how long must you provide proof of financial responsibility (an
    SR-22 certificate) to get your privileges back?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: If your license was suspended for certain serious offenses (reckless
    driving, driving under the influence, etc.) you must also provide proof of financial
    responsibility for three years.
- id: 282
  category: alcohol_drugs_health
  question: According to the manual, how much does the risk of causing a crash increase
    when your alcohol concentration reaches .10?
  choices:
    A: It doubles
    B: It is six times as great
    C: It is ten times as great
    D: It is 25 times as great
  answer: B
  explanation: At slightly above .05, the risk of causing a crash doubles. At .10,
    the risk is six times as great.
- id: 283
  category: penalties_and_points
  question: Which of the following is a reason the Idaho Transportation Department
    is authorized to suspend your driver's license?
  choices:
    A: Receiving a single parking ticket
    B: Failing to pay child support
    C: Driving 5 mph over the speed limit once
    D: Failing to renew your vehicle registration on time
  answer: B
  explanation: The manual lists 'Failure to pay child support, or comply with visitation
    rights' as one of the reasons for suspension.
- id: 284
  category: license_system
  question: If your license is suspended by the court and you need to drive to work,
    where must you apply for restricted driving privileges?
  choices:
    A: The Idaho Transportation Department in Boise
    B: Your local DMV office
    C: The court that convicted you
    D: Any law enforcement agency
  answer: C
  explanation: If you are suspended by the court, you must apply for restricted driving
    privileges from the court that convicted you.
- id: 285
  category: penalties_and_points
  question: What action will the department take if you accumulate 24 or more points
    on your driving record in any 36-month period?
  choices:
    A: A warning letter
    B: A 30-day suspension
    C: A 90-day suspension
    D: A 6-month suspension
  answer: D
  explanation: Under the point system, accumulating 24 or more points in any 36 months
    results in a 6-month suspension.
- id: 286
  category: penalties_and_points
  question: During a Graduated Drivers License (GDL) penalty suspension period for
    moving violations, what type of driving privileges are allowed?
  choices:
    A: Driving to and from school only
    B: Driving for work purposes only
    C: Driving with a licensed adult over 21
    D: Absolutely no driving privileges of any kind
  answer: D
  explanation: The GDL penalty suspension periods are absolute and do not allow driving
    privileges of any kind.
- id: 287
  category: alcohol_drugs_health
  question: At what blood alcohol concentration (BAC) does the risk of causing a crash
    double?
  choices:
    A: '.02'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: B
  explanation: According to the manual, at slightly above a .05 alcohol concentration,
    the risk of causing a crash doubles.
- id: 288
  category: alcohol_drugs_health
  question: Which of the following contains approximately the same amount of alcohol
    as a 12-ounce beer?
  choices:
    A: A 5-ounce glass of table wine
    B: A 12-ounce glass of wine
    C: A 3-ounce shot of hard liquor
    D: A 24-ounce beer
  answer: A
  explanation: A jigger (1.5 ounces) of 80-proof hard liquor, five ounces of table
    wine, or 12 ounces of beer all contain approximately the same amount of alcohol—about
    an ounce each.
- id: 289
  category: alcohol_drugs_health
  question: What is the only effective way to sober up after drinking alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Deep breathing and exercise
    D: Time
  answer: D
  explanation: Once alcohol is in your bloodstream, neither aspirin, black coffee,
    deep breathing, a slap in the face, exercise, nor eating will sober you up. Only
    time will return you to normal.
- id: 290
  category: defensive_driving
  question: Which of the following is a common sign that a driver may be under the
    influence of alcohol?
  choices:
    A: Driving slightly below the speed limit to be overly cautious
    B: Using turn signals too early
    C: Stopping smoothly at traffic lights
    D: Driving with the windows down in cold weather
  answer: A
  explanation: One of the signs of drunken driving is slow driving. Drinking drivers
    may be overly cautious and drive slower than normal traffic.
- id: 291
  category: safe_driving_rules
  question: Where must an unsealed alcoholic beverage container be kept if your vehicle
    does not have a trunk?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: Behind the last upright seat
    D: In the center console
  answer: C
  explanation: Idaho's open container law states that to transport any unsealed alcoholic
    beverages in a vehicle, the container must be in the trunk or behind the last
    upright seat if there is no trunk.
- id: 292
  category: alcohol_drugs_health
  question: How does marijuana affect your ability to drive?
  choices:
    A: It causes aggressive and reckless behaviors
    B: It slows reaction time and impairs judgment of time and distance
    C: It improves focus but decreases peripheral vision
    D: It causes sudden shifts in mood from elation to anger
  answer: B
  explanation: The manual states that marijuana slows reaction time and impairs judgment
    of time and distance.
- id: 293
  category: penalties_and_points
  question: 'Under Idaho law, you are considered to be driving under the influence
    if you are under 21 years of age and your blood-alcohol concentration (BAC) is
    at or above:'
  choices:
    A: '.02'
    B: '.04'
    C: '.05'
    D: '.08'
  answer: A
  explanation: Under Idaho law you are considered to be driving under the influence
    if your blood-alcohol concentration (BAC) is .02 or more if you are under 21 years
    of age.
- id: 294
  category: penalties_and_points
  question: What is the legal blood-alcohol concentration (BAC) limit for operating
    a commercial vehicle in Idaho?
  choices:
    A: '.02'
    B: '.04'
    C: '.06'
    D: '.08'
  answer: B
  explanation: You are considered to be driving under the influence if your BAC is
    .04 or more if you are operating a commercial vehicle.
- id: 295
  category: penalties_and_points
  question: What is the mandatory driver's license suspension period for a first DUI
    conviction if you are 21 or older?
  choices:
    A: At least 30 days and up to 90 days
    B: At least 90 days and up to 180 days
    C: Exactly one year
    D: One to five years
  answer: B
  explanation: For a first conviction, penalties include a mandatory driver’s license
    suspension of at least 90 days and up to 180 days (one year if you are under 21).
- id: 296
  category: penalties_and_points
  question: 'A third or subsequent DUI conviction within 10 years is classified as
    a:'
  choices:
    A: Misdemeanor
    B: Traffic infraction
    C: Felony
    D: Civil penalty
  answer: C
  explanation: 'For three or more convictions within 10 years, the manual explicitly
    states: "This conviction is a felony."'
- id: 297
  category: safe_driving_rules
  question: What should you do with your hands when stopped by law enforcement?
  choices:
    A: Keep them in your pockets
    B: Keep them on the steering wheel so they are easily observable
    C: Wave them out the window to signal the officer
    D: Reach for your glove compartment immediately
  answer: B
  explanation: When stopped by law enforcement, you should keep your hands on the
    steering wheel so they are easily observable.
- id: 298
  category: driver_responsibility
  question: 'If you have a weapon in the vehicle when stopped by law enforcement,
    you should:'
  choices:
    A: Hide it under the seat before the officer approaches
    B: Inform the officer upon first contact
    C: Wait until the officer asks to search the vehicle
    D: Hand it to the officer immediately
  answer: B
  explanation: 'The manual instructs: "If you have a weapon in the vehicle, inform
    the officer upon first contact."'
- id: 299
  category: driver_responsibility
  question: What does your signature on a traffic ticket indicate?
  choices:
    A: It is an admission of guilt
    B: It is a plea of no contest
    C: It is an agreement to pay the fine immediately
    D: It is not an admission of guilt, but refusal to sign may result in arrest
  answer: D
  explanation: Your acceptance and signature on a traffic ticket is not an admission
    of guilt; however, the refusal to sign a traffic ticket may result in your arrest.
- id: 300
  category: alcohol_drugs_health
  question: How many drinks does it typically take for alcohol to begin impairing
    your reaction time, coordination, and balance?
  choices:
    A: One drink
    B: Two to four drinks
    C: Five to six drinks
    D: Seven or more drinks
  answer: B
  explanation: According to the manual, after two to four drinks, alcohol begins to
    impair your reaction time, coordination, and balance.
- id: 301
  category: alcohol_drugs_health
  question: What effect do opioids have on a driver?
  choices:
    A: They cause dizziness and hallucinations
    B: They cause aggressive and reckless behaviors
    C: They cause drowsiness and impaired memory and thinking skills
    D: They increase alertness and reaction time
  answer: C
  explanation: The manual states that opioids cause drowsiness and impaired memory
    and thinking skills.
- id: 302
  category: signs_and_signals
  question: Is it legal to pass when the pavement is marked with solid double yellow
    lines?
  choices:
    A: 'Yes'
    B: 'No'
    C: Only if there is no oncoming traffic
    D: Only if the vehicle ahead of you is driving under the speed limit
  answer: B
  explanation: According to the manual's practice questions, it is not legal to pass
    when the pavement is marked with solid double yellow lines.
- id: 303
  category: sharing_the_road
  question: 'A person walking with a white/silver cane or guide dog is likely to be:'
  choices:
    A: A deaf person
    B: A person involved with a traffic study
    C: A blind person
    D: A pedestrian crossing guard
  answer: C
  explanation: The manual indicates that a person walking with a white or silver cane
    or a guide dog is likely to be a blind person.
- id: 304
  category: signs_and_signals
  question: What is the most common color for warning lights?
  choices:
    A: Red
    B: Green
    C: Blue
    D: Yellow
  answer: D
  explanation: The manual states that the most common color for warning lights is
    yellow.
- id: 305
  category: safe_driving_rules
  question: What is Idaho’s basic law for driving speed?
  choices:
    A: Always drive the posted speed
    B: Drive at a speed that is reasonable and prudent at all times
    C: Drive 5-10 mph below the speed limit just to be safe
    D: Drive at the same speed as those around you
  answer: B
  explanation: Idaho's basic law for driving speed requires you to drive at a speed
    that is reasonable and prudent at all times.
- id: 306
  category: signs_and_signals
  question: When can highways with dashed white lines be crossed over?
  choices:
    A: At any time
    B: Only during daylight hours
    C: When it is safe to do so
    D: Only when passing another vehicle
  answer: C
  explanation: The manual specifies that highways with dashed white lines can be crossed
    over when it is safe to do so.
- id: 307
  category: defensive_driving
  question: Why can highways be slick when it has just started to rain?
  choices:
    A: The rain washes away the traction material
    B: Oil and water create a greasy mix
    C: The temperature drops rapidly
    D: The water pools in deep puddles immediately
  answer: B
  explanation: Highways can be slick when it has just started to rain due to oil and
    water creating a greasy mix.
- id: 308
  category: defensive_driving
  question: Under which of the following conditions can highways be slick?
  choices:
    A: When it has just started to rain, due to oil and water creating a greasy mix
    B: When there is moisture on the road and the temperature is at freezing or below
    C: Both of the above
    D: None of the above
  answer: C
  explanation: The manual notes that highways can be slick both when it just starts
    to rain (creating a greasy mix) and when there is moisture on the road at freezing
    temperatures or below.
- id: 309
  category: safe_driving_rules
  question: 'Many rear-end collisions are caused by:'
  choices:
    A: Following the car ahead of you too closely
    B: Poor road surface
    C: Faulty steering control
    D: Persons under the age of 16
  answer: A
  explanation: According to the manual, many rear-end collisions are caused by following
    the car ahead of you too closely.
- id: 310
  category: safe_driving_rules
  question: As you prepare to merge with traffic on a freeway, you should do which
    of the following?
  choices:
    A: Stop to check traffic
    B: Expect others to yield the right-of-way to you
    C: Adjust your speed to merge smoothly
    D: Turn on your hazard lights
  answer: C
  explanation: When preparing to merge with traffic on a freeway, you should adjust
    your speed to merge smoothly.
- id: 311
  category: safe_driving_rules
  question: 'When required to stop, the driver of a vehicle approaching a railroad
    grade crossing must stop:'
  choices:
    A: Only if a train is in sight
    B: Only if they choose to
    C: Within 50 feet but no less than 15 feet from the nearest rail of the crossing
    D: Within 100 feet but no less than 25 feet from the nearest rail of the crossing
  answer: C
  explanation: The driver of a vehicle approaching a railroad grade crossing must
    stop within 50 feet but no less than 15 feet from the nearest rail of the crossing
    when required.
- id: 312
  category: safe_driving_rules
  question: 'Normally, you should pass vehicles on the:'
  choices:
    A: Left
    B: Right
    C: Shoulder
    D: Median
  answer: A
  explanation: The manual states that normally, you should pass vehicles on the left.
- id: 313
  category: vehicle_information
  question: What is the official website for the Idaho Division of Motor Vehicles?
  choices:
    A: dmv.idaho.gov
    B: idaho.gov/dmv
    C: transportation.idaho.gov
    D: dmv.id.us
  answer: A
  explanation: The Idaho Driver's Handbook directs users to visit them online at dmv.idaho.gov.
- id: 314
  category: vehicle_information
  question: Which division publishes the Idaho Driver's Handbook?
  choices:
    A: Division of Highway Safety
    B: Division of Motor Vehicles
    C: Department of Public Safety
    D: Idaho State Police
  answer: B
  explanation: The Idaho Driver's Handbook is published by the Idaho Transportation
    Department, Division of Motor Vehicles.
- id: 315
  category: defensive_driving
  question: What happens when there is moisture on the road and the temperature is
    at freezing or below?
  choices:
    A: The road surface becomes sticky
    B: Highways can become slick
    C: The road markings become invisible
    D: The speed limit is automatically reduced by 10 mph
  answer: B
  explanation: The manual warns that highways can be slick when there is moisture
    on the road and the temperature is at freezing or below.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 316
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 317
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 318
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 319
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 320
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 321
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 322
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 323
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 324
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 325
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 326
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 327
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 328
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 329
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 330
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 331
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 332
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 333
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 334
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 335
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 336
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 337
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 338
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 339
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 340
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 341
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 342
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
