metadata:
  source: 2025 Idaho Driver's Manual
  total_questions: 254
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Idaho, what is the minimum age an individual can apply for a Supervised
    Instruction Permit (SIP)?
  choices:
    A: 14 years old
    B: 14 years and 6 months old
    C: 15 years old
    D: 15 years and 6 months old
  answer: B
  explanation: According to the Idaho Driver's Manual, an individual must be at least
    14 years and 6 months old to apply for a Supervised Instruction Permit.
- id: 2
  category: license_system
  question: Under Idaho's Graduated Driver's License (GDL) program, how many hours
    of supervised driving must a permit holder complete before applying for a license?
  choices:
    A: 30 hours, with 5 at night
    B: 40 hours, with 10 at night
    C: 50 hours, with 10 at night
    D: 60 hours, with 15 at night
  answer: C
  explanation: Idaho law requires permit holders under age 17 to complete 50 hours
    of supervised driving, 10 of which must be at night.
- id: 3
  category: license_system
  question: For the first six months after receiving an Idaho driver's license, a
    driver under the age of 17 is restricted to how many passengers under the age
    of 17 who are not related by blood, marriage, or adoption?
  choices:
    A: Zero passengers
    B: One passenger
    C: Two passengers
    D: Three passengers
  answer: B
  explanation: Idaho GDL laws state that for the first six months of licensure, drivers
    under 17 are limited to only one passenger under the age of 17 who is not a family
    member.
- id: 4
  category: license_system
  question: In Idaho, what is the curfew for a driver under the age of 17 unless they
    are accompanied by a licensed driver who is at least 21 years old?
  choices:
    A: 10:00 PM to 5:00 AM
    B: 11:00 PM to 6:00 AM
    C: 12:00 AM (Midnight) to 5:00 AM
    D: 1:00 AM to 6:00 AM
  answer: C
  explanation: Drivers under 17 years of age are restricted from driving between the
    hours of 12:00 AM and 5:00 AM unless accompanied by a licensed driver 21 or older.
- id: 5
  category: license_system
  question: How long must a person under the age of 17 hold an Idaho Supervised Instruction
    Permit (SIP) before they are eligible to take the skills test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Idaho law requires drivers under 17 to hold their permit for at least
    six months before they can take the driving skills test.
- id: 6
  category: license_system
  question: If you move to Idaho, how many days do you have to apply for an Idaho
    driver's license after becoming a resident?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: New residents of Idaho must obtain an Idaho driver's license within
    90 days of establishing residency.
- id: 7
  category: license_system
  question: In Idaho, a driver's license is suspended if they accumulate how many
    points within a 12-month period?
  choices:
    A: 8 to 11 points
    B: 12 to 17 points
    C: 18 to 23 points
    D: 24 or more points
  answer: B
  explanation: The Idaho Transportation Department will suspend driving privileges
    for 30 days if a driver accumulates 12 to 17 points in any 12-month period.
- id: 8
  category: license_system
  question: What is the minimum vision requirement in at least one eye, with or without
    corrective lenses, to pass the Idaho driver's license vision screening?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Idaho requires applicants to have 20/40 vision or better in at least
    one eye, with or without corrective lenses.
- id: 9
  category: license_system
  question: If you change your address within Idaho, you must notify the Idaho Transportation
    Department (ITD) within how many days?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Idaho law requires you to notify the ITD of a change of address within
    30 days.
- id: 10
  category: license_system
  question: What is the minimum age to apply for a Class D Idaho driver's license
    if you have completed all GDL requirements?
  choices:
    A: 15 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: A
  explanation: In Idaho, an individual can obtain a Class D license as early as age
    15 if they have completed driver's education and the 6-month supervised driving
    period.
- id: 11
  category: license_system
  question: Which of the following is NOT a requirement to obtain an Idaho 'Star Card'
    (REAL ID)?
  choices:
    A: Proof of identity
    B: Proof of Social Security number
    C: Proof of Idaho residency
    D: Proof of a high school diploma
  answer: D
  explanation: To get a Star Card, you need proof of identity, Social Security number,
    and residency. A high school diploma is not required for a driver's license.
- id: 12
  category: license_system
  question: In Idaho, if you are under 21 years of age, what is the Blood Alcohol
    Concentration (BAC) limit that will result in a license suspension?
  choices:
    A: 0.01% or higher
    B: 0.02% or higher
    C: 0.05% or higher
    D: 0.08% or higher
  answer: B
  explanation: Idaho has a 'zero tolerance' law for drivers under 21, where a BAC
    of 0.02% or higher results in legal penalties and license suspension.
- id: 13
  category: license_system
  question: What are the minimum liability insurance requirements for a private passenger
    vehicle in Idaho?
  choices:
    A: 15/30/5
    B: 25/50/15
    C: 50/100/25
    D: 100/300/50
  answer: B
  explanation: Idaho law requires minimum liability coverage of $25,000 for injury/death
    of one person, $50,000 for injury/death of two or more people, and $15,000 for
    property damage (25/50/15).
- id: 14
  category: license_system
  question: 'If you are under 18 and want to apply for a permit or license in Idaho,
    you must provide proof of enrollment in or graduation from school. This is often
    referred to as:'
  choices:
    A: The GDL Certificate
    B: The VOC (Verification of Compliance)
    C: The School Safety Form
    D: The Education Waiver
  answer: B
  explanation: The Verification of Compliance (VOC) form is required for applicants
    under 18 to prove they are meeting Idaho's school attendance requirements.
- id: 15
  category: license_system
  question: How many years is an Idaho driver's license valid for if the driver is
    between the ages of 21 and 62?
  choices:
    A: 2 or 4 years
    B: 4 or 8 years
    C: 5 or 10 years
    D: Exactly 6 years
  answer: B
  explanation: Drivers between the ages of 21 and 62 in Idaho have the option to renew
    their license for either 4 years or 8 years.
- id: 16
  category: license_system
  question: In Idaho, how many points are added to your driving record for a conviction
    of 'Reckless Driving'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: According to the Idaho Driver's Manual, Reckless Driving is a serious
    violation that results in 4 points being added to the driver's record.
- id: 17
  category: license_system
  question: In Idaho, completing an approved defensive driving course can reduce your
    driving record point total by how many points?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Idaho law allows drivers to reduce their point total by 3 points once
    every three years by completing an approved defensive driving course.
- id: 18
  category: license_system
  question: If you fail the Idaho driver's license knowledge test, how long must you
    wait before you are eligible to retake it?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 14 days
  answer: B
  explanation: If you fail the knowledge test, you must wait at least 3 days before
    you can pay the fee and take the test again.
- id: 19
  category: license_system
  question: If you legally change your name, you must apply for a duplicate Idaho
    license with your new name within how many days?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Idaho law requires that you notify the ITD and obtain a duplicate license
    within 30 days of a legal name change.
- id: 20
  category: license_system
  question: In Idaho, any person under the age of ____ must successfully complete
    an approved motorcycle safety course to obtain a motorcycle endorsement.
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: Idaho requires all motorcycle endorsement applicants under the age
    of 21 to complete an approved Idaho STAR motorcycle safety program.
- id: 21
  category: license_system
  question: 'Under Idaho''s ''Implied Consent'' law, if you refuse to submit to a
    chemical test for alcohol or drugs, your driver''s license will be seized and
    you will be fined a civil penalty of:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Refusal to take a BAC test results in immediate license seizure and
    a $250 civil penalty, in addition to a potential one-year suspension.
- id: 22
  category: license_system
  question: An Idaho driver's license can be renewed up to how many months before
    it expires?
  choices:
    A: 6 months
    B: 12 months
    C: 25 months
    D: 36 months
  answer: C
  explanation: Idaho permits drivers to renew their licenses up to 25 months prior
    to the expiration date.
- id: 23
  category: license_system
  question: 'When taking the Idaho skills test, the applicant must provide a vehicle
    that has:'
  choices:
    A: Dual brakes for the examiner
    B: A manual transmission
    C: Valid proof of insurance and registration
    D: A 'Student Driver' sign on the rear
  answer: C
  explanation: Applicants must provide their own vehicle for the skills test, and
    it must be properly insured, registered, and in safe operating condition.
- id: 24
  category: license_system
  question: What is the minimum age to apply for an Idaho Commercial Driver's License
    (CDL) for intrastate (within Idaho only) operation?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: While federal law requires drivers to be 21 for interstate commerce,
    Idaho allows individuals 18 and older to apply for a CDL for intrastate driving.
- id: 25
  category: license_system
  question: In Idaho, where is the information regarding your status as an organ/tissue
    donor indicated?
  choices:
    A: On a separate card kept in the wallet
    B: On the back of the license only
    C: On the front of the license
    D: It is not printed on the license
  answer: C
  explanation: If you choose to be an organ donor, a 'Donor' designation will be printed
    on the front of your Idaho driver's license.
- id: 26
  category: license_system
  question: Who is legally responsible for any damage caused by a driver under 18
    in Idaho if they signed the application for the minor's permit or license?
  choices:
    A: The minor only
    B: The state of Idaho
    C: The person who signed the application
    D: The minor's school district
  answer: C
  explanation: The person who signs the application for a minor (usually a parent
    or guardian) assumes legal liability for the minor's negligence or willful misconduct
    while driving.
- id: 27
  category: license_system
  question: 'When applying for an Idaho driver''s license, you must surrender:'
  choices:
    A: Your birth certificate
    B: Your Social Security card
    C: All other driver's licenses or identification cards issued by any other state
    D: Your high school diploma
  answer: C
  explanation: Idaho law prohibits holding more than one valid driver's license or
    ID card at a time; you must surrender out-of-state credentials when applying for
    an Idaho license.
- id: 28
  category: license_system
  question: If you are 17 years of age or older and apply for an Idaho instruction
    permit, how long is that permit valid?
  choices:
    A: 90 days
    B: 180 days
    C: One year
    D: Two years
  answer: B
  explanation: For applicants 17 and older, the Idaho instruction permit is valid
    for 180 days.
- id: 29
  category: license_system
  question: 'If your Idaho license is suspended, you may be eligible to apply for
    a ''restricted'' license to drive to and from specific locations such as:'
  choices:
    A: Social events and parties
    B: Grocery stores and malls
    C: Work or medical appointments
    D: Vacation destinations
  answer: C
  explanation: A restricted (hardship) license may be granted by the court or ITD
    for essential driving, such as employment, medical needs, or religious services.
- id: 30
  category: driver_testing
  question: To pass the Idaho driver's license knowledge test, what is the minimum
    number of questions you must answer correctly out of 40?
  choices:
    A: '28'
    B: '30'
    C: '34'
    D: '36'
  answer: C
  explanation: The Idaho knowledge test consists of 40 questions. You must answer
    at least 34 correctly (85%) to pass.
- id: 31
  category: driver_testing
  question: When taking the Idaho skills (road) test, which of the following must
    you provide for the vehicle you are using?
  choices:
    A: A notarized letter from the vehicle owner
    B: Proof of valid liability insurance and current registration
    C: A maintenance log from the last 12 months
    D: A temporary operating permit
  answer: B
  explanation: For the skills test, you must provide a vehicle in safe operating condition
    with valid proof of liability insurance and a current registration card.
- id: 32
  category: driver_testing
  question: If you fail the Idaho skills (road) test, what is the minimum waiting
    period before you can take it again?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 14 days
  answer: B
  explanation: In Idaho, if you fail either the knowledge test or the skills test,
    you must wait at least three days (72 hours) before you are eligible to retake
    it.
- id: 33
  category: driver_testing
  question: Under Idaho's 'Implied Consent' law, what is the penalty for a first-time
    refusal to submit to an evidentiary test for blood alcohol concentration?
  choices:
    A: A $50 fine and 30-day suspension
    B: A $100 fine and 90-day suspension
    C: A $250 civil penalty and a one-year license seizure/suspension
    D: A $500 fine and permanent revocation
  answer: C
  explanation: Idaho's Implied Consent law means by driving in Idaho, you have consented
    to BAC testing. Refusal results in a $250 civil penalty and a one-year suspension
    of driving privileges.
- id: 34
  category: driver_testing
  question: In Idaho, what is the fine for a first-time conviction of violating the
    'Hands-Free' law (using a mobile device while driving)?
  choices:
    A: $25
    B: $75
    C: $150
    D: $300
  answer: B
  explanation: As of July 1, 2020, Idaho law requires hands-free use of mobile devices.
    A first offense carries a $75 fine plus court costs.
- id: 35
  category: driver_testing
  question: For Idaho residents aged 63 and older, for how many years is a standard
    driver's license valid?
  choices:
    A: 1 year
    B: 4 years
    C: 8 years
    D: Indefinitely
  answer: B
  explanation: While drivers aged 21-62 can choose between a 4-year or 8-year license,
    those aged 63 and older are restricted to a 4-year license renewal period.
- id: 36
  category: driver_testing
  question: Under Idaho law, a driver is considered a 'Habitual Offender' if they
    accumulate how many major traffic convictions within a three-year period?
  choices:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
  answer: B
  explanation: Idaho Code 49-326 defines a habitual violator as someone who has three
    or more major convictions (such as DUI or Reckless Driving) within a three-year
    period, resulting in a 3-year revocation.
- id: 37
  category: driver_testing
  question: During the Idaho skills test, which of the following actions will result
    in an automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: Driving 2 mph over the speed limit
    C: Performing a dangerous action that forces another driver to take evasive action
    D: Adjusting your mirrors while stopped
  answer: C
  explanation: Automatic failure on the Idaho skills test occurs for several reasons,
    including a collision, a serious violation of traffic laws, or any dangerous action
    that requires the examiner or another driver to intervene.
- id: 38
  category: driver_testing
  question: An Idaho Instruction Permit for an applicant over the age of 17 is valid
    for how many days?
  choices:
    A: 90 days
    B: 180 days
    C: One year
    D: Two years
  answer: B
  explanation: For individuals 17 and older, an Idaho Instruction Permit is valid
    for 180 days.
- id: 39
  category: driver_testing
  question: To obtain an Idaho 'Star Card' (REAL ID), how many documents proving Idaho
    residency must you provide?
  choices:
    A: One
    B: Two
    C: Three
    D: None, if you have an Idaho utility bill
  answer: B
  explanation: To meet REAL ID requirements for the Idaho Star Card, applicants must
    provide two separate documents that prove Idaho residency (e.g., utility bills,
    lease agreements).
- id: 40
  category: driver_testing
  question: How many points are added to your Idaho driving record for speeding 1
    to 15 miles per hour over the posted limit?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Speeding 1-15 mph over the limit in Idaho results in 3 points. Speeding
    16 mph or more over the limit results in 4 points.
- id: 41
  category: driver_testing
  question: In Idaho, if you are involved in a crash that results in injury, death,
    or property damage exceeding ____, you must notify the police immediately.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Idaho law requires you to notify the police immediately if you are
    involved in a crash resulting in injury or death, or damage to property of any
    one person in excess of $1,500.
- id: 42
  category: driver_testing
  question: For a first-time DUI conviction for a driver over the age of 21 in Idaho,
    for how long is the driver's license typically suspended?
  choices:
    A: 30 to 60 days
    B: 90 to 180 days
    C: One year
    D: Two years
  answer: B
  explanation: A first-offense DUI for an adult in Idaho carries a mandatory license
    suspension of 90 to 180 days.
- id: 43
  category: driver_testing
  question: In Idaho, when driving in a business or residential district, you must
    signal your intention to turn at least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Idaho law requires drivers to signal at least 100 feet before a turn
    in business or residential areas.
- id: 44
  category: driver_testing
  question: In Idaho, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Idaho law prohibits parking within 15 feet of a fire hydrant.
- id: 45
  category: driver_testing
  question: Under the 'Idaho Stop' law, what are bicyclists required to do when approaching
    a stop sign?
  choices:
    A: Come to a complete stop and wait for all traffic to clear
    B: Slow down and yield the right-of-way, but they are not required to stop if
      it is safe to proceed
    C: Ignore the stop sign completely
    D: Stop only if there are pedestrians present
  answer: B
  explanation: Idaho Code 49-720 allows bicyclists to treat stop signs as yield signs,
    meaning they must slow down and yield but only stop if required for safety.
- id: 46
  category: driver_testing
  question: Under the 'Idaho Stop' law, what must a bicyclist do at a steady red light?
  choices:
    A: Treat it as a yield sign and proceed without stopping
    B: Wait for the light to turn green before proceeding
    C: Stop before entering the intersection, yield to all other traffic, then proceed
      with caution
    D: Dismount and walk the bike across the crosswalk
  answer: C
  explanation: Idaho law allows bicyclists to proceed through a red light after coming
    to a complete stop and yielding to all other traffic in the intersection.
- id: 47
  category: driver_testing
  question: 'In Idaho, you are required to use your headlights when visibility is
    reduced to less than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Idaho law requires headlights to be on from 30 minutes after sunset
    to 30 minutes before sunrise, or whenever visibility is less than 500 feet.
- id: 48
  category: driver_testing
  question: What is the maximum speed limit allowed on rural interstates in Idaho
    for passenger vehicles, where posted?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: While many interstates are 75 mph, Idaho law allows for speeds up to
    80 mph on rural interstates where posted.
- id: 49
  category: driver_testing
  question: New residents to Idaho must register their vehicles within how many days
    of establishing residency?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: According to the Idaho Driver's Manual, new residents have 90 days
    to register their vehicles in the state.
- id: 50
  category: driver_testing
  question: 'In Idaho, you are NOT required to stop for a school bus with flashing
    red lights if you are traveling in the opposite direction on a highway with:'
  choices:
    A: Two or more lanes
    B: Three or more lanes
    C: Four or more lanes
    D: A center turn lane only
  answer: C
  explanation: On a highway with four or more lanes (at least two in each direction),
    drivers traveling in the opposite direction of a school bus are not required to
    stop.
- id: 51
  category: driver_testing
  question: The Idaho knowledge test consists of 40 questions. What is the maximum
    number of questions you can miss and still pass?
  choices:
    A: '4'
    B: '6'
    C: '8'
    D: '10'
  answer: B
  explanation: The Idaho knowledge test requires a score of 85% to pass, which means
    you must answer at least 34 out of 40 questions correctly (missing no more than
    6).
- id: 52
  category: driver_responsibility
  question: In Idaho, if you are involved in a motor vehicle crash that results in
    damage to the property of any one person in excess of ______, you must immediately
    notify the local police or county sheriff.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: According to the Idaho Driver's Manual, any accident resulting in injury,
    death, or property damage exceeding $1,500 must be reported immediately to law
    enforcement.
- id: 53
  category: driver_responsibility
  question: What is the penalty for a first-time conviction of driving without the
    required liability insurance in Idaho?
  choices:
    A: A mandatory 30-day jail sentence
    B: A $75 fine plus court costs and a requirement to provide proof of financial
      responsibility for one year
    C: Permanent revocation of the driver's license
    D: A $500 fine and 5 points on the driving record
  answer: B
  explanation: A first offense for no insurance in Idaho results in a $75 fine plus
    court costs, and the driver must provide proof of financial responsibility (SR-22)
    to the ITD for one year.
- id: 54
  category: driver_responsibility
  question: After becoming a resident of Idaho, how many days do you have to register
    your vehicle with the Idaho Transportation Department?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: New Idaho residents must register their vehicles within 90 days of
    establishing residency.
- id: 55
  category: driver_responsibility
  question: When you purchase a vehicle from a private party in Idaho, you must apply
    for a certificate of title within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Idaho law requires that a buyer apply for a title within 30 days of
    a private party vehicle purchase to avoid a late filing fee.
- id: 56
  category: driver_responsibility
  question: If your Idaho driver's license is suspended for a 'no insurance' conviction,
    how long are you typically required to maintain an SR-22 certificate of financial
    responsibility?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Drivers convicted of driving without insurance must generally maintain
    an SR-22 filing for three years following the suspension.
- id: 57
  category: driver_responsibility
  question: 'Idaho''s ''Open Container'' law prohibits the possession of an open container
    of alcohol in the passenger compartment of a motor vehicle. This law applies to:'
  choices:
    A: Only the driver
    B: Only passengers under 21
    C: Both the driver and all passengers
    D: Only passengers in the front seat
  answer: C
  explanation: In Idaho, it is illegal for any person (driver or passenger) to possess
    an open container of an alcoholic beverage in the passenger compartment of a motor
    vehicle on a public highway.
- id: 58
  category: driver_responsibility
  question: For drivers of commercial motor vehicles (CMV) in Idaho, what is the Blood
    Alcohol Concentration (BAC) limit that constitutes a DUI?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: While the limit for standard drivers is 0.08%, the BAC limit for commercial
    vehicle operators in Idaho is 0.04%.
- id: 59
  category: driver_responsibility
  question: What is the maximum fine for a first-time conviction of littering from
    a motor vehicle on Idaho highways?
  choices:
    A: Up to $50
    B: Up to $100
    C: Up to $180
    D: Up to $500
  answer: C
  explanation: Littering is an infraction in Idaho and carries a maximum fine of up
    to $180.
- id: 60
  category: driver_responsibility
  question: 'Under Idaho''s ''Move Over'' law, when approaching a stationary emergency
    vehicle with flashing lights on a highway with two or more lanes in the same direction,
    you must:'
  choices:
    A: Stop completely until signaled to pass
    B: Move to the lane farthest from the emergency vehicle if safe to do so
    C: Maintain speed but honk your horn
    D: Speed up to pass the area quickly
  answer: B
  explanation: Idaho law requires drivers to move to the left lane (or the lane not
    adjacent to the emergency vehicle) if it is safe to do so, or slow down significantly
    if a lane change is not possible.
- id: 61
  category: driver_responsibility
  question: 'If you collide with an unattended vehicle in Idaho and cannot locate
    the owner, you are legally required to:'
  choices:
    A: Wait for 2 hours for the owner to return
    B: Leave a note in a conspicuous place with your name, address, and vehicle information
    C: Drive away if there is no visible damage
    D: Only report it if the damage appears to be over $5,000
  answer: B
  explanation: Idaho law requires you to leave a written notice with your contact
    information and vehicle details in a conspicuous place on the vehicle you hit
    if the owner cannot be found.
- id: 62
  category: driver_responsibility
  question: How many points are assessed on an Idaho driving record for a conviction
    of 'Inattentive Driving'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Inattentive driving is a 3-point violation in the state of Idaho.
- id: 63
  category: driver_responsibility
  question: In Idaho, if you are stopped by a police officer and cannot provide proof
    of insurance, you have how many days to provide proof to the court or ITD to avoid
    a conviction?
  choices:
    A: 24 hours
    B: 7 days
    C: 10 days
    D: 30 days
  answer: D
  explanation: While you must carry proof of insurance, if you are cited, you generally
    have 30 days to provide proof that the vehicle was insured at the time of the
    stop to have the citation dismissed.
- id: 64
  category: driver_responsibility
  question: If you are an Idaho resident and your vehicle is registered in the state,
    where must the registration certificate be kept?
  choices:
    A: At your primary residence
    B: In the vehicle or carried by the driver
    C: In a safety deposit box
    D: Attached to the rear license plate
  answer: B
  explanation: Idaho law requires that the registration certificate (or a copy) be
    carried in the vehicle or upon the person of the driver at all times while the
    vehicle is being operated.
- id: 65
  category: driver_responsibility
  question: 'If an Idaho driver is convicted of a second offense of driving without
    insurance within five years, the penalty may include up to six months in jail
    and a fine of up to:'
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: A second offense within five years is a misdemeanor, punishable by
    a fine of up to $1,000 and/or up to six months in jail.
- id: 66
  category: driver_responsibility
  question: At what point level will the Idaho Transportation Department send a warning
    letter to a driver regarding their accumulated points?
  choices:
    A: 4 to 7 points
    B: 8 to 11 points
    C: 12 to 15 points
    D: 18 points
  answer: B
  explanation: The Idaho Transportation Department sends a warning letter to drivers
    who have accumulated 8 to 11 points in any 12-month period.
- id: 67
  category: driver_responsibility
  question: In Idaho, if you accumulate 18 to 23 points within a 24-month period,
    your driving privileges will be suspended for how long?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: Accumulating 18 to 23 points within a 24-month period results in a
    90-day license suspension.
- id: 68
  category: driver_responsibility
  question: 'Under Idaho''s Implied Consent law, if you refuse to submit to a BAC
    test when requested by an officer, you will be issued a civil penalty of:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Refusing a BAC test results in a $250 civil penalty and an immediate
    seizure of your driver's license, leading to a one-year suspension for a first
    refusal.
- id: 69
  category: driver_responsibility
  question: 'Littering from a vehicle is illegal in Idaho. A conviction for littering
    can result in a fine of up to:'
  choices:
    A: $50
    B: $100
    C: $180
    D: $500
  answer: C
  explanation: Littering on any public or private property, including highways, is
    a misdemeanor in Idaho punishable by a fine of up to $180.
- id: 70
  category: driver_responsibility
  question: If your Idaho license is suspended for a 'no insurance' conviction, you
    must maintain proof of financial responsibility (SR-22) for how many years from
    the date of reinstatement?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Drivers convicted of driving without insurance must file and maintain
    an SR-22 certificate for three years.
- id: 71
  category: driver_responsibility
  question: 'In Idaho, it is illegal for the driver or any passenger to possess an
    open container of alcohol in the passenger compartment of a motor vehicle on a
    public highway. This is known as the:'
  choices:
    A: Zero Tolerance Law
    B: Open Container Law
    C: DUI Prevention Act
    D: Public Safety Statute
  answer: B
  explanation: Idaho's Open Container Law prohibits both drivers and passengers from
    having an open container of alcohol in the passenger area of a vehicle while on
    a public highway.
- id: 72
  category: driver_responsibility
  question: 'If you hit an unattended vehicle and cannot find the owner, Idaho law
    requires you to:'
  choices:
    A: Wait for 30 minutes, then leave
    B: Leave a note with your name, address, and license plate number
    C: Report it to your insurance company only
    D: Do nothing if the damage appears to be under $500
  answer: B
  explanation: If you cannot locate the owner of a vehicle you have struck, you must
    leave a written note in a conspicuous place on the vehicle providing your contact
    information and vehicle details.
- id: 73
  category: driver_responsibility
  question: When requested by a law enforcement officer, an Idaho driver must provide
    proof of insurance in what format?
  choices:
    A: Paper format only
    B: Electronic format only
    C: Either paper or electronic format
    D: Verbal confirmation from the insurance agent
  answer: C
  explanation: Idaho law allows drivers to provide proof of insurance in either a
    printed (paper) format or an electronic format (such as on a smartphone).
- id: 74
  category: safe_driving_rules
  question: In Idaho, what is the maximum speed limit in residential and business
    districts unless otherwise posted?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 40 mph
  answer: C
  explanation: According to the Idaho Driver's Manual, the speed limit is 35 mph in
    residential, business, and urban districts unless a different speed is posted.
- id: 75
  category: safe_driving_rules
  question: When parking your vehicle parallel to a curb in Idaho, you must be within
    how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: Idaho law requires that when you park on a public road, you must park
    parallel to and within 18 inches of the curb or edge of the roadway.
- id: 76
  category: safe_driving_rules
  question: In Idaho, you are prohibited from parking within how many feet of a fire
    hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Idaho Code 49-660 states that no person shall stop, stand, or park
    a vehicle within 15 feet of a fire hydrant.
- id: 77
  category: safe_driving_rules
  question: When approaching a school bus with flashing red lights on a highway with
    four or more lanes and a median or physical barrier, which drivers must stop?
  choices:
    A: All drivers in both directions
    B: Only drivers following the bus
    C: Only drivers in the oncoming lanes
    D: No drivers are required to stop
  answer: B
  explanation: In Idaho, if a school bus is stopped on a highway with four or more
    lanes and a visual barrier or median, only traffic following the bus must stop.
    Traffic in the oncoming lanes does not need to stop.
- id: 78
  category: safe_driving_rules
  question: When driving on a freeway or highway in Idaho, you should signal for at
    least how many seconds before changing lanes?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 5 seconds
    D: 10 seconds
  answer: C
  explanation: For high-speed traffic on freeways or highways, Idaho law requires
    signaling for at least five seconds before making a lane change.
- id: 79
  category: safe_driving_rules
  question: In Idaho, it is illegal to pass another vehicle when you are within how
    many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Idaho law prohibits passing when you are within 100 feet of an intersection,
    a railroad crossing, a bridge, a viaduct, or a tunnel.
- id: 80
  category: safe_driving_rules
  question: 'Under Idaho law, you may NOT make a U-turn on a curve or near the crest
    of a hill if your vehicle cannot be seen by other drivers approaching from either
    direction within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Idaho law prohibits U-turns on curves or hills where your vehicle cannot
    be seen by the driver of any other vehicle approaching from either direction within
    500 feet.
- id: 81
  category: safe_driving_rules
  question: When two vehicles reach an unmarked intersection at the same time in Idaho,
    who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at the higher speed
    D: The vehicle on the larger road
  answer: B
  explanation: In Idaho, when two vehicles reach an intersection that is not controlled
    by signs or signals at approximately the same time, the driver of the vehicle
    on the left must yield the right-of-way to the vehicle on the right.
- id: 82
  category: safe_driving_rules
  question: In Idaho, a 'slow-moving vehicle' is defined as one that operates at a
    speed of less than how many miles per hour?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: A slow-moving vehicle is defined by Idaho law as any vehicle not normally
    operated at a speed higher than 25 mph. These vehicles must display a slow-moving
    vehicle emblem.
- id: 83
  category: safe_driving_rules
  question: In Idaho, is it legal to turn left on a red light?
  choices:
    A: No, it is never legal
    B: Yes, but only from a one-way street onto another one-way street
    C: Yes, from any street onto a one-way street
    D: Yes, after coming to a complete stop and yielding to all traffic
  answer: B
  explanation: Idaho law allows a left turn on a red light only when turning from
    a one-way street onto another one-way street, after coming to a complete stop
    and yielding to pedestrians and other traffic.
- id: 84
  category: safe_driving_rules
  question: When parking your vehicle near a fire hydrant in Idaho, what is the minimum
    distance you must maintain?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Idaho law prohibits parking within 15 feet of a fire hydrant.
- id: 85
  category: safe_driving_rules
  question: Under Idaho law, when is it legal to turn left on a red light after coming
    to a complete stop?
  choices:
    A: Never
    B: From a one-way street onto another one-way street
    C: From a two-way street onto a one-way street
    D: At any intersection if no traffic is coming
  answer: B
  explanation: In Idaho, a left turn on red is permitted only when turning from a
    one-way street into another one-way street, provided you stop first and yield
    to pedestrians and other traffic.
- id: 86
  category: safe_driving_rules
  question: On a two-lane highway in Idaho, if you are driving slowly and a line of
    vehicles forms behind you, you must pull over and let them pass if there are at
    least how many vehicles in the line?
  choices:
    A: 2 vehicles
    B: 3 vehicles
    C: 5 vehicles
    D: 10 vehicles
  answer: B
  explanation: Idaho Code requires slow-moving vehicles on a two-lane highway to pull
    over at the nearest safe turnout when there are 3 or more vehicles following in
    a line behind them.
- id: 87
  category: safe_driving_rules
  question: In Idaho, between which dates is it legal to use studded snow tires on
    your vehicle?
  choices:
    A: November 1 to March 31
    B: October 1 to April 30
    C: October 15 to April 15
    D: November 15 to April 1
  answer: B
  explanation: Studded snow tires are allowed on Idaho roadways only from October
    1 to April 30.
- id: 88
  category: safe_driving_rules
  question: What is the standard speed limit in an Idaho school zone when the lights
    are flashing or signs are posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The speed limit in a school zone in Idaho is 20 mph unless otherwise
    posted.
- id: 89
  category: safe_driving_rules
  question: 'Idaho''s ''Move Over'' law requires drivers approaching stationary emergency
    vehicles with flashing lights to:'
  choices:
    A: Stop immediately in the lane of travel
    B: Maintain speed but honk to alert the officer
    C: Move to the left lane if safe, or slow down significantly if a lane change
      is not possible
    D: Speed up to pass the scene as quickly as possible
  answer: C
  explanation: Idaho law requires drivers to move to the left lane on multi-lane highways
    or slow down and proceed with caution if a lane change is unsafe when passing
    stationary emergency or maintenance vehicles with flashing lights.
- id: 90
  category: safe_driving_rules
  question: In Idaho, you may not pass another vehicle when you are within how many
    feet of a curve or the crest of a hill where your view is obstructed?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Passing is prohibited in Idaho when approaching a curve or hill where
    the driver’s view is obstructed within 500 feet.
- id: 91
  category: safe_driving_rules
  question: When parking near an intersection in Idaho, you must be at least how many
    feet away from a crosswalk?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Idaho law prohibits parking within 20 feet of a crosswalk at an intersection.
- id: 92
  category: safe_driving_rules
  question: According to the Idaho Driver's Manual, what happens to the fines for
    speeding in a designated work zone when workers are present?
  choices:
    A: They are waived for first-time offenders
    B: They are doubled
    C: They are increased by a flat $500 fee
    D: They remain the same as standard speeding fines
  answer: B
  explanation: In Idaho, fines for speeding in a work zone are doubled when workers
    are present.
- id: 93
  category: safe_driving_rules
  question: 'To maintain a safe following distance behind the vehicle in front of
    you in Idaho, you should use the:'
  choices:
    A: One-car-length rule
    B: Two-second rule
    C: Three-second rule
    D: Four-second rule
  answer: C
  explanation: The Idaho Driver's Manual recommends a minimum following distance of
    three seconds under normal driving conditions.
- id: 94
  category: safe_driving_rules
  question: 'Under Idaho''s Implied Consent law, if you are suspected of driving under
    the influence and refuse to submit to a BAC test, your driver''s license will
    be seized and suspended for:'
  choices:
    A: 90 days
    B: 180 days
    C: One year
    D: Two years
  answer: C
  explanation: If you refuse to take a evidentiary test (BAC test) in Idaho, your
    license will be seized by the officer and suspended by the court for one year
    for a first refusal.
- id: 95
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in Idaho, how far
    ahead should you maintain a visual lead?
  choices:
    A: 5 seconds
    B: 10 seconds
    C: 15 seconds
    D: 30 seconds
  answer: C
  explanation: The Idaho Driver's Manual suggests looking at least 15 seconds ahead
    to identify potential hazards early.
- id: 96
  category: defensive_driving
  question: In Idaho, when must you dim your high-beam headlights when approaching
    an oncoming vehicle?
  choices:
    A: Within 200 feet
    B: Within 350 feet
    C: Within 500 feet
    D: Within 1,000 feet
  answer: C
  explanation: Idaho law requires drivers to dim their high beams within 500 feet
    of an oncoming vehicle.
- id: 97
  category: defensive_driving
  question: When following another vehicle at night in Idaho, at what distance must
    you dim your high-beam headlights?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Idaho law requires you to dim your high beams when you are within 200
    feet of the vehicle you are following.
- id: 98
  category: defensive_driving
  question: In Idaho, between which dates are studded snow tires legally allowed on
    the roads?
  choices:
    A: November 1 to March 31
    B: October 1 to April 30
    C: September 1 to May 1
    D: October 15 to April 15
  answer: B
  explanation: Studded snow tires are permitted in Idaho only from October 1 to April
    30 each year.
- id: 99
  category: defensive_driving
  question: At what speed can hydroplaning begin on wet Idaho roads with standard
    tires?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Hydroplaning (where tires lose contact with the road and ride on a
    film of water) can begin at speeds as low as 35 mph.
- id: 100
  category: defensive_driving
  question: When passing another vehicle on a two-lane road in Idaho, you must return
    to your lane before coming within how many feet of an oncoming vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Idaho law states you must complete a pass and return to your lane before
    coming within 200 feet of any vehicle approaching from the opposite direction.
- id: 101
  category: defensive_driving
  question: If you are parking your vehicle on a downhill slope with a curb in Idaho,
    which way should you turn your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: A
  explanation: When parking downhill with a curb, turn your wheels toward the curb
    so the car will roll into the curb if the brakes fail.
- id: 102
  category: defensive_driving
  question: When driving in heavy fog in Idaho, which headlight setting should you
    use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    water droplets, causing glare and reducing visibility further.
- id: 103
  category: defensive_driving
  question: You are driving on a highway with three or more lanes. A school bus is
    stopped in the opposite direction with its red lights flashing and stop arm extended.
    According to Idaho law, do you need to stop?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, you do not need to stop
    C: Yes, but only if there is no median
    D: No, but you must honk your horn
  answer: B
  explanation: In Idaho, on a highway with three or more lanes, traffic traveling
    in the opposite direction of a stopped school bus is not required to stop.
- id: 104
  category: defensive_driving
  question: When entering a roundabout in Idaho, to whom must you yield the right-of-way?
  choices:
    A: Traffic entering from the right
    B: Traffic already in the roundabout
    C: No one; you have the right of way
    D: Only pedestrians, not other vehicles
  answer: B
  explanation: Drivers entering a roundabout must yield to traffic already circulating
    within the intersection.
- id: 105
  category: defensive_driving
  question: At an intersection in Idaho where there are no stop signs or signals,
    two vehicles arrive at the same time. Who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling faster
    D: The vehicle on the busier street
  answer: B
  explanation: At uncontrolled intersections, the driver of the vehicle on the left
    must yield the right-of-way to the vehicle on the right.
- id: 106
  category: defensive_driving
  question: In Idaho, if you refuse to submit to a blood alcohol concentration (BAC)
    test when requested by an officer, what is the immediate civil penalty?
  choices:
    A: A $100 fine
    B: A $250 fine and 1-year license seizure
    C: A $500 fine and 2-year license seizure
    D: There is no civil penalty, only criminal
  answer: B
  explanation: Under Idaho's Implied Consent law, refusing a BAC test results in a
    $250 civil penalty and an immediate seizure of your driver's license for one year.
- id: 107
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in Idaho, you should
    look down the road at least how many seconds ahead of your vehicle?
  choices:
    A: 5 seconds
    B: 10 seconds
    C: 15 seconds
    D: 20 seconds
  answer: C
  explanation: Idaho defensive driving guidelines suggest scanning the road at least
    15 seconds ahead to anticipate hazards and traffic flow changes.
- id: 108
  category: defensive_driving
  question: When driving at night in Idaho, you must dim your high beams when an oncoming
    vehicle comes within how many feet?
  choices:
    A: 200 feet
    B: 350 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Idaho law requires drivers to dim their high beams when an oncoming
    vehicle is within 500 feet to prevent blinding the other driver.
- id: 109
  category: defensive_driving
  question: 'In Idaho, hydroplaning (where tires lose contact with the road on a film
    of water) can begin at speeds as low as:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The Idaho Driver's Manual states that hydroplaning can begin at speeds
    as low as 35 mph, and at 55 mph, tires may lose all contact with the road.
- id: 110
  category: defensive_driving
  question: When parking on a hill in Idaho with a curb, in which direction should
    you turn your front wheels if you are headed uphill?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    so the vehicle will roll into the curb if the brakes fail.
- id: 111
  category: defensive_driving
  question: Unless otherwise posted, what is the statutory speed limit in a residential,
    business, or urban district in Idaho?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: D
  explanation: According to Idaho Code 49-654, the statutory speed limit in any residential,
    business, or urban district is 35 mph unless a different limit is posted.
- id: 112
  category: defensive_driving
  question: When scanning an intersection for potential hazards, in which order should
    you look?
  choices:
    A: Right, left, right
    B: Left, right, left
    C: Straight ahead only
    D: Behind you first
  answer: B
  explanation: Idaho defensive driving guidelines recommend looking left, then right,
    then left again before entering an intersection, as vehicles from the left are
    closer to you.
- id: 113
  category: defensive_driving
  question: 'If your vehicle is equipped with Anti-lock Brakes (ABS) and you need
    to stop quickly in an emergency, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure and do not let up
    C: Shift to neutral and use the emergency brake
    D: Lightly tap the brakes to avoid locking
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. Pumping the brakes
    is for vehicles without ABS; doing so with ABS will deactivate the system's effectiveness.
- id: 114
  category: defensive_driving
  question: 'To check your ''blind spot'' before changing lanes in Idaho, you should:'
  choices:
    A: Look in your rearview mirror
    B: Look in your side mirror
    C: Turn your head and look over your shoulder
    D: Rely on your backup camera
  answer: C
  explanation: Mirrors do not show everything around your vehicle. To properly check
    blind spots, you must turn your head and look over your shoulder in the direction
    you plan to move.
- id: 115
  category: alcohol_drugs_health
  question: In Idaho, a driver is considered to be driving 'Excessive DUI' if their
    Blood Alcohol Concentration (BAC) is at or above what level?
  choices:
    A: 0.08%
    B: 0.15%
    C: 0.20%
    D: 0.25%
  answer: C
  explanation: Idaho law defines 'Excessive DUI' as having a BAC of 0.20% or higher.
    This carries much stiffer penalties than a standard DUI.
- id: 116
  category: alcohol_drugs_health
  question: For a first-time DUI conviction in Idaho (not excessive), what is the
    maximum jail sentence a court may impose?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: For a first DUI offense in Idaho, the driver may face up to six months
    in jail, a fine of up to $1,000, and a license suspension.
- id: 117
  category: alcohol_drugs_health
  question: Idaho law requires that an Ignition Interlock Device (IID) be installed
    on the vehicles of which DUI offenders?
  choices:
    A: Only those with a BAC over 0.20%
    B: Only repeat offenders within a 5-year period
    C: All individuals convicted of a DUI, including first-time offenders
    D: Only drivers under the age of 21
  answer: C
  explanation: As of 2018, Idaho law requires all persons convicted of a DUI (including
    first-time offenders) to install an ignition interlock device on any vehicle they
    drive for a period of time following their suspension.
- id: 118
  category: alcohol_drugs_health
  question: In Idaho, it is illegal to possess an open container of an alcoholic beverage
    in which part of the vehicle?
  choices:
    A: The trunk only
    B: The passenger compartment
    C: The glove box only
    D: Behind the last upright seat of a vehicle without a trunk
  answer: B
  explanation: Idaho Code 23-505 states it is illegal for any person to drink or possess
    an open container of an alcoholic beverage in the passenger compartment of a motor
    vehicle on a public highway.
- id: 119
  category: alcohol_drugs_health
  question: 'If a driver under 21 is convicted of a first-time DUI in Idaho, their
    license will be suspended for a mandatory period of:'
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: One year
  answer: D
  explanation: For drivers under 21, a first DUI conviction results in a mandatory
    one-year license suspension and a fine of up to $1,000.
- id: 120
  category: alcohol_drugs_health
  question: Which of the following is true regarding prescription drugs and driving
    in Idaho?
  choices:
    A: You cannot be charged with a DUI if the drug was legally prescribed by a doctor
    B: Prescription drugs are only a concern if mixed with alcohol
    C: You can be charged with a DUI if a prescription drug impairs your ability to
      drive safely
    D: Only 'Schedule I' narcotics can lead to a DUI charge
  answer: C
  explanation: In Idaho, a DUI charge applies to any substance that impairs your driving,
    including prescription medications and over-the-counter drugs. It is the driver's
    responsibility to know the effects of their medication.
- id: 121
  category: alcohol_drugs_health
  question: What is the maximum fine for a first-time 'Excessive DUI' (BAC 0.20% or
    higher) conviction in Idaho?
  choices:
    A: $1,000
    B: $2,000
    C: $5,000
    D: $10,000
  answer: B
  explanation: A first-time Excessive DUI conviction in Idaho carries a fine of up
    to $2,000, mandatory jail time of at least 10 days, and a one-year license suspension.
- id: 122
  category: alcohol_drugs_health
  question: If you are convicted of a second DUI in Idaho within a 10-year period,
    what is the mandatory minimum jail sentence?
  choices:
    A: 48 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: For a second DUI conviction within 10 years in Idaho, the law requires
    a mandatory minimum of 10 days in jail, though the sentence can go up to one year.
- id: 123
  category: alcohol_drugs_health
  question: 'Alcohol is a drug that is classified as a:'
  choices:
    A: Stimulant
    B: Depressant
    C: Hallucinogen
    D: Narcotic
  answer: B
  explanation: Alcohol is a depressant. It slows down the central nervous system,
    affecting reaction time, coordination, and judgment.
- id: 124
  category: alcohol_drugs_health
  question: When alcohol is consumed, which of the following is typically affected
    first?
  choices:
    A: Muscle coordination
    B: Vision
    C: Judgment
    D: Speech
  answer: C
  explanation: Judgment is the first faculty affected by alcohol. Drivers may take
    risks they otherwise wouldn't before physical symptoms like slurred speech or
    lack of coordination appear.
- id: 125
  category: alcohol_drugs_health
  question: 'If you are involved in a crash in Idaho and a police officer has ''reasonable
    grounds'' to believe you were driving under the influence, they can:'
  choices:
    A: Only test you if you are visibly intoxicated
    B: Request an evidentiary test for drugs or alcohol even if you are unconscious
    C: Only test you if there is a fatality
    D: Not test you without a warrant signed by a judge
  answer: B
  explanation: Under Idaho's Implied Consent law, if you are unconscious or otherwise
    incapable of refusal, you are deemed not to have withdrawn your consent for a
    chemical test.
- id: 126
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' in relation to driving?
  choices:
    A: The effect of alcohol wearing off over time
    B: The increased impairment caused by mixing alcohol and another drug
    C: The body's ability to process one drink per hour
    D: The psychological feeling of being sober when you are not
  answer: B
  explanation: The synergistic effect occurs when alcohol and another drug (even over-the-counter)
    are combined, resulting in much greater impairment than either substance would
    cause alone.
- id: 127
  category: alcohol_drugs_health
  question: 'In Idaho, if you have a medical condition that causes a loss of consciousness
    (such as epilepsy), you may be required to:'
  choices:
    A: Only drive during daylight hours
    B: Be period-free of such episodes for 6 months before being licensed
    C: Have a licensed driver in the passenger seat at all times
    D: Surrender your license permanently
  answer: B
  explanation: Idaho generally requires individuals with conditions causing loss of
    consciousness to be episode-free for a period of 6 months and provide a medical
    evaluation before they can be cleared to drive.
- id: 128
  category: alcohol_drugs_health
  question: In Idaho, what is the legal Blood Alcohol Concentration (BAC) limit for
    a driver over the age of 21?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: For drivers 21 years of age or older in Idaho, it is illegal to drive
    with a BAC of 0.08% or higher.
- id: 129
  category: alcohol_drugs_health
  question: Under Idaho's 'Implied Consent' law, what is the penalty for refusing
    to take a requested evidentiary test (such as a breathalyzer) for the first time?
  choices:
    A: A $50 fine and 30-day suspension
    B: A $250 civil penalty and a one-year license suspension
    C: A $1,000 fine and 48 hours in jail
    D: There is no penalty if it is your first offense
  answer: B
  explanation: Under Idaho's Implied Consent law, by driving on Idaho roads, you have
    given consent to testing. Refusal results in a $250 civil penalty and a mandatory
    one-year license suspension.
- id: 130
  category: alcohol_drugs_health
  question: In Idaho, what is the maximum jail sentence for a first-offense DUI (non-excessive)?
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: A first-offense DUI conviction in Idaho is a misdemeanor and can result
    in up to six months in the county jail.
- id: 131
  category: alcohol_drugs_health
  question: What Blood Alcohol Concentration (BAC) level is considered 'Excessive
    Alcohol Concentration' for an adult driver in Idaho, leading to enhanced penalties?
  choices:
    A: 0.10% or higher
    B: 0.15% or higher
    C: 0.20% or higher
    D: 0.25% or higher
  answer: C
  explanation: Idaho law defines 'Excessive Alcohol Concentration' as a BAC of 0.20%
    or higher, which carries much stiffer penalties than a standard DUI.
- id: 132
  category: alcohol_drugs_health
  question: According to Idaho's open container law, where is it legal to keep an
    unsealed or open container of alcoholic beverage in a vehicle?
  choices:
    A: In the glove compartment
    B: In the center console
    C: In the trunk or behind the last upright seat of a vehicle without a trunk
    D: Under the driver's seat
  answer: C
  explanation: Open containers of alcohol must be kept in the trunk or, in vehicles
    without a trunk (like SUVs), in an area not normally occupied by the driver or
    passengers.
- id: 133
  category: alcohol_drugs_health
  question: In Idaho, how does the law treat driving under the influence of prescription
    or over-the-counter drugs?
  choices:
    A: It is legal if the drug was prescribed by a doctor
    B: It is only illegal if the drug is a narcotic
    C: It is illegal to drive if the drug impairs your ability to drive safely
    D: It is only illegal if the drug is combined with alcohol
  answer: C
  explanation: It is illegal to drive in Idaho while under the influence of any substance—legal
    or illegal—that impairs your ability to operate a motor vehicle safely.
- id: 134
  category: alcohol_drugs_health
  question: For a second DUI conviction within 10 years in Idaho, what is the mandatory
    minimum jail sentence?
  choices:
    A: 48 hours
    B: 10 days
    C: 30 days
    D: 90 days
  answer: B
  explanation: A second DUI conviction within 10 years in Idaho carries a mandatory
    minimum jail sentence of 10 days.
- id: 135
  category: alcohol_drugs_health
  question: As of 2018, Idaho law requires all drivers convicted of a DUI to install
    what device in their vehicle?
  choices:
    A: A GPS tracker
    B: An Ignition Interlock Device (IID)
    C: A dash camera
    D: An automatic speed governor
  answer: B
  explanation: Idaho law requires any person convicted of a DUI (including first-time
    offenders) to install an ignition interlock device on any vehicle they drive.
- id: 136
  category: alcohol_drugs_health
  question: What is the legal BAC limit for a driver operating a Commercial Motor
    Vehicle (CMV) in Idaho?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Commercial drivers are held to a stricter standard; a BAC of 0.04%
    or higher while operating a CMV is considered a DUI.
- id: 137
  category: alcohol_drugs_health
  question: 'If you are involved in a crash that results in injury or death and you
    are under the influence of alcohol, you may be charged with:'
  choices:
    A: Simple DUI
    B: Aggravated DUI
    C: Negligent Driving
    D: Inattentive Driving
  answer: B
  explanation: In Idaho, if you cause serious bodily injury to another person while
    driving under the influence, the charge is upgraded to Aggravated DUI, which is
    a felony.
- id: 138
  category: alcohol_drugs_health
  question: Which of the following is the only way to 'sober up' and lower your BAC
    before driving?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Allowing time for your body to process the alcohol
    D: Eating a heavy meal
  answer: C
  explanation: Only time allows the body to metabolize alcohol. Coffee, showers, and
    food do not lower your Blood Alcohol Concentration.
- id: 139
  category: alcohol_drugs_health
  question: What is the primary reason alcohol increases the risk of a crash?
  choices:
    A: It makes the driver more aggressive
    B: It impairs judgment and slows reaction time
    C: It causes immediate blindness
    D: It makes the vehicle harder to steer
  answer: B
  explanation: Alcohol is a depressant that affects the central nervous system, primarily
    impairing a driver's judgment and slowing down their physical reaction times.
- id: 140
  category: alcohol_drugs_health
  question: 'In Idaho, a second refusal of an evidentiary test (Implied Consent) within
    10 years results in a license suspension of:'
  choices:
    A: 90 days
    B: 1 year
    C: 2 years
    D: Permanent revocation
  answer: C
  explanation: A second refusal of a BAC test within 10 years in Idaho results in
    a mandatory two-year license suspension.
- id: 141
  category: penalties_and_points
  question: In Idaho, if you are convicted of driving without the required liability
    insurance for the first time, what is one of the penalties?
  choices:
    A: Your license is suspended until you provide proof of insurance and pay a reinstatement
      fee
    B: A mandatory 5-day jail sentence
    C: Permanent revocation of your vehicle registration
    D: A flat $1,000 fine regardless of circumstances
  answer: A
  explanation: For a first offense of driving without insurance, Idaho law requires
    the suspension of driving privileges until proof of financial responsibility (SR-22)
    is filed and a reinstatement fee is paid.
- id: 142
  category: penalties_and_points
  question: 'If you accumulate 24 or more points within any 36-month period in Idaho,
    your license will be suspended for:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Idaho's point system mandates a 6-month suspension for drivers who
    accumulate 24 or more points within a 36-month window.
- id: 143
  category: penalties_and_points
  question: In Idaho, a conviction for 'Failure to Yield the Right-of-Way' results
    in how many points on your driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failure to yield the right-of-way is a 3-point violation in the state
    of Idaho.
- id: 144
  category: penalties_and_points
  question: Under Idaho's 'Hands-Free' law, what is the penalty for a first-time offense
    of using a handheld electronic device while driving?
  choices:
    A: A $75 fine
    B: A $150 fine and 3 points
    C: A $250 fine and 1-year suspension
    D: A $500 fine
  answer: A
  explanation: As of July 1, 2020, Idaho law prohibits holding a cell phone or electronic
    device while operating a vehicle. A first offense carries a $75 fine (plus court
    costs).
- id: 145
  category: penalties_and_points
  question: How many points are added to an Idaho driving record for 'Illegal Passing'
    of another vehicle?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Illegal passing is considered a more serious moving violation in Idaho
    and results in 4 points being added to the driver's record.
- id: 146
  category: penalties_and_points
  question: In Idaho, how many points are assessed for 'Failure to Stop for a School
    Bus'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Passing a school bus while its red lights are flashing and stop arm
    is extended is a 4-point violation in Idaho.
- id: 147
  category: penalties_and_points
  question: If an Idaho driver is convicted of a DUI for the first time (BAC .08%
    or higher), what is the maximum possible jail sentence?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: For a first DUI conviction in Idaho, the maximum jail sentence is up
    to 6 months.
- id: 148
  category: penalties_and_points
  question: How often can an Idaho driver take an approved defensive driving course
    to remove 3 points from their driving record?
  choices:
    A: Once every year
    B: Once every 2 years
    C: Once every 3 years
    D: Once every 5 years
  answer: C
  explanation: Idaho allows drivers to reduce their point total by 3 points by completing
    an approved course, but this benefit can only be used once every three years.
- id: 149
  category: penalties_and_points
  question: How many points are assessed for a 'Speeding' violation in Idaho if the
    speed is 1 to 15 mph over the limit?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: In Idaho, speeding 1-15 mph over the limit is a 3-point violation.
    Speeding 16 mph or more over the limit is a 4-point violation.
- id: 150
  category: penalties_and_points
  question: In Idaho, how many points are assessed for 'Inattentive Driving'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Inattentive driving is a 3-point violation on the Idaho point schedule.
- id: 151
  category: penalties_and_points
  question: In Idaho, what is the point value for a 'Failure to Yield Right-of-Way'
    conviction?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failure to yield the right-of-way is assigned 3 points on an Idaho
    driving record.
- id: 152
  category: penalties_and_points
  question: If you are involved in a traffic accident in Idaho resulting in injury,
    death, or property damage exceeding ______, you must submit a written report to
    the Idaho Transportation Department.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Idaho law requires a written accident report if the damage to any one
    person's property is greater than $1,500 or if there is any injury or death.
- id: 153
  category: penalties_and_points
  question: What is the fine for a seat belt violation for an adult driver in Idaho?
  choices:
    A: $10.00
    B: $25.00
    C: $50.00
    D: $100.00
  answer: A
  explanation: In Idaho, the fine for a seat belt violation is $10.00 (though court
    costs may be added).
- id: 154
  category: penalties_and_points
  question: In Idaho, how many points are assessed for a conviction of 'Following
    Too Closely' (tailgating)?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Following too closely is a 3-point violation in Idaho.
- id: 155
  category: penalties_and_points
  question: What is the point value for an 'Inattentive Driving' conviction in Idaho?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Inattentive driving is assigned 3 points on the Idaho point system.
- id: 156
  category: penalties_and_points
  question: 'In Idaho, a first-offense conviction for failure to provide proof of
    insurance results in a fine of $75 and:'
  choices:
    A: A 30-day jail sentence
    B: A 1-year license revocation
    C: License suspension until proof of financial responsibility (SR-22) is filed
    D: 6 points on the driving record
  answer: C
  explanation: For a first offense of failing to provide proof of insurance, the license
    is suspended until the driver provides proof and files an SR-22 for one year.
- id: 157
  category: penalties_and_points
  question: How many points are assessed for a 'Stop Sign' or 'Traffic Signal' violation
    in Idaho?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failure to obey a stop sign or traffic signal is a 3-point violation
    in Idaho.
- id: 158
  category: penalties_and_points
  question: 'In Idaho, if you are under 21 and convicted of a second DUI within five
    years, your license may be suspended for up to:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Permanent revocation
  answer: C
  explanation: For drivers under 21, a second DUI conviction within five years results
    in a license suspension for up to two years.
- id: 159
  category: penalties_and_points
  question: In Idaho, 'Child Restraint' violations result in a fine and how many points
    on the driving record?
  choices:
    A: 0 points
    B: 1 point
    C: 2 points
    D: 3 points
  answer: A
  explanation: While Idaho law requires child restraints and carries a fine for non-compliance,
    it is a non-moving violation and does not result in points on the driving record.
- id: 160
  category: sharing_the_road
  question: In Idaho, how should a bicyclist treat a steady red traffic light?
  choices:
    A: As a yield sign, slowing down but not stopping
    B: They must wait for the light to turn green like any other vehicle
    C: Stop, yield to all other traffic, and then proceed through the red light with
      caution
    D: Bicyclists are not permitted to proceed through red lights under any circumstances
  answer: C
  explanation: Idaho law allows bicyclists to treat a red light as a stop sign. They
    must come to a complete stop and yield to all other traffic before proceeding
    through the intersection.
- id: 161
  category: sharing_the_road
  question: When a funeral procession is being led by a funeral escort vehicle using
    flashing lights, what is the right-of-way rule at intersections in Idaho?
  choices:
    A: The procession must stop for all red lights and stop signs
    B: Only the lead vehicle has the right-of-way
    C: The entire procession has the right-of-way regardless of traffic control devices,
      provided their headlights are on
    D: Funeral processions have no special right-of-way privileges in Idaho
  answer: C
  explanation: According to Idaho Code 49-2701, once the lead vehicle in a funeral
    procession has lawfully entered an intersection, the remaining vehicles in the
    procession may continue through the intersection regardless of traffic signs or
    signals, provided they have their headlights on.
- id: 162
  category: sharing_the_road
  question: 'A slow-moving vehicle emblem (an orange triangle with a red border) must
    be displayed on the rear of any vehicle designed to operate at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: In Idaho, the slow-moving vehicle emblem is required on all vehicles
    designed to travel at speeds of 25 mph or less.
- id: 163
  category: sharing_the_road
  question: When following a motorcycle, what is the recommended following distance
    to ensure safety?
  choices:
    A: 1 second
    B: 2 seconds
    C: At least 3 seconds
    D: Exactly 1 car length
  answer: C
  explanation: The Idaho Driver's Manual recommends a following distance of at least
    three seconds behind a motorcycle to allow the motorcyclist enough room to maneuver
    in case of road hazards or sudden stops.
- id: 164
  category: sharing_the_road
  question: In Idaho, if you are turning at an intersection and a pedestrian is crossing
    in an unmarked crosswalk, who has the right-of-way?
  choices:
    A: The driver, because the crosswalk is not marked
    B: The pedestrian
    C: Whomever arrived at the intersection first
    D: The driver, but only if they use their horn
  answer: B
  explanation: Idaho law states that pedestrians have the right-of-way at all intersections,
    whether the crosswalks are marked or unmarked.
- id: 165
  category: sharing_the_road
  question: Large trucks have 'No-Zones' where the driver cannot see your vehicle.
    Where is the largest 'No-Zone' located?
  choices:
    A: Directly in front of the truck
    B: On the left side of the truck
    C: On the right side of the truck
    D: Directly behind the truck
  answer: C
  explanation: While trucks have blind spots on all sides, the right-side blind spot
    is the largest and most dangerous 'No-Zone' because it extends across multiple
    lanes.
- id: 166
  category: sharing_the_road
  question: When passing a bicyclist in Idaho, how much space should you leave between
    your vehicle and the bicycle?
  choices:
    A: At least 1 foot
    B: At least 3 feet
    C: A minimum of 6 feet
    D: There is no specific distance, just don't hit them
  answer: B
  explanation: While Idaho law requires a 'safe distance,' the Idaho Driver's Manual
    and safety guidelines specify that you should allow at least 3 feet of space when
    passing a bicyclist.
- id: 167
  category: sharing_the_road
  question: You are driving on a two-lane road and a school bus is stopped with its
    red lights flashing and stop arm extended. Which vehicles must stop?
  choices:
    A: Only vehicles following the bus
    B: Only vehicles approaching from the front
    C: Vehicles in both directions must stop
    D: No one is required to stop if the speed limit is over 35 mph
  answer: C
  explanation: On a two-lane road, traffic in both directions must stop for a school
    bus with its red lights flashing and stop arm extended.
- id: 168
  category: sharing_the_road
  question: When an emergency vehicle with sirens and flashing lights is approaching
    from behind, what should you do?
  choices:
    A: Stop immediately in your current lane
    B: Pull over to the nearest edge of the road (usually the right) and stop
    C: Speed up to get out of the way
    D: Move to the left lane and slow down
  answer: B
  explanation: Idaho law requires drivers to yield the right-of-way to emergency vehicles
    by pulling over to the right-hand edge or curb of the highway, clear of any intersection,
    and remaining stopped until the vehicle has passed.
- id: 169
  category: sharing_the_road
  question: Is it legal for two motorcycles to ride side-by-side in a single lane
    in Idaho?
  choices:
    A: No, motorcycles must always ride in a staggered formation
    B: Yes, motorcycles may be ridden no more than two abreast in a single lane
    C: Yes, but only on residential streets
    D: No, it is considered lane splitting and is illegal
  answer: B
  explanation: Idaho Code 49-662 allows motorcycles to be operated no more than two
    abreast in a single lane.
- id: 170
  category: sharing_the_road
  question: 'If you see a pedestrian using a white cane or a guide dog, you must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Stop and yield the right-of-way
    C: Drive around them if there is enough room
    D: Wait for them to signal you to pass
  answer: B
  explanation: Drivers must yield the right-of-way to any blind pedestrian carrying
    a white cane or accompanied by a guide dog.
- id: 171
  category: sharing_the_road
  question: Why should you be extra cautious when a large truck is turning right at
    an intersection?
  choices:
    A: Trucks always have the right-of-way over cars
    B: Trucks may need to swing wide to the left to clear the curb
    C: Trucks are required to stop before every right turn
    D: Trucks accelerate faster than cars during turns
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn
    without hitting the curb or other objects. Drivers should never try to squeeze
    between a turning truck and the curb.
- id: 172
  category: sharing_the_road
  question: Under the 'Idaho Stop' law, how must a bicyclist treat a stop sign at
    an intersection?
  choices:
    A: They must come to a complete stop and wait for all other traffic.
    B: They may treat it as a yield sign, slowing down and proceeding without stopping
      if it is safe.
    C: They must stop only if there are motor vehicles within 100 feet.
    D: They must stop and wait for at least three seconds before proceeding.
  answer: B
  explanation: Idaho law (49-720) allows bicyclists to treat stop signs as yield signs.
    They must slow down and, if required for safety, stop. If the intersection is
    clear, they may proceed without a complete stop.
- id: 173
  category: sharing_the_road
  question: In Idaho, when a school bus is stopped on a highway with four or more
    lanes (at least two in each direction), which traffic must stop?
  choices:
    A: Traffic in all lanes and both directions must stop.
    B: Only traffic following the bus must stop.
    C: Only traffic in the lane immediately next to the bus must stop.
    D: Traffic following the bus and traffic in the oncoming lanes must stop.
  answer: B
  explanation: On a highway with four or more lanes, traffic following the bus must
    stop when the red lights are flashing and the stop arm is extended. Oncoming traffic
    is not required to stop but should remain alert.
- id: 174
  category: sharing_the_road
  question: In Idaho, what is the minimum distance a motorist must maintain when passing
    a person riding a bicycle?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: Idaho law requires that a motor vehicle passing a bicycle must do so
    at a safe distance, which is defined as no less than 3 feet between any part of
    the vehicle and the bicycle.
- id: 175
  category: sharing_the_road
  question: In Idaho, who is legally required to wear a helmet while riding or operating
    a motorcycle?
  choices:
    A: All riders and operators regardless of age.
    B: Only the operator of the motorcycle.
    C: Any person under the age of 18.
    D: Only riders on highways with speed limits over 55 mph.
  answer: C
  explanation: Idaho law requires motorcycle operators and passengers under the age
    of 18 to wear a helmet that meets DOT standards.
- id: 176
  category: sharing_the_road
  question: When following a large commercial truck, why is it important to stay out
    of its 'No-Zone'?
  choices:
    A: To avoid the truck's exhaust fumes.
    B: Because the truck driver cannot see you in these blind spots.
    C: To prevent the truck from slowing down.
    D: Because it is illegal to drive in the right lane next to a truck.
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck (front,
    rear, and sides) where the driver cannot see other vehicles. If you cannot see
    the truck's side mirrors, the driver cannot see you.
- id: 177
  category: sharing_the_road
  question: What is the legal minimum following distance you must maintain behind
    a fire apparatus responding to an alarm in Idaho?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Idaho law prohibits following a fire apparatus traveling in response
    to a fire alarm closer than 500 feet.
- id: 178
  category: sharing_the_road
  question: 'If you are driving and a pedestrian with a white cane or a guide dog
    begins to cross the street, you must:'
  choices:
    A: Honk your horn to let them know you are there.
    B: Stop and give them the right-of-way, even if they are not in a marked crosswalk.
    C: Drive around them if there is enough room.
    D: Wait for them to cross only if the traffic light is green for them.
  answer: B
  explanation: Drivers must yield the right-of-way to any blind pedestrian carrying
    a white cane or using a guide dog. You should stop and remain stopped until the
    pedestrian has safely crossed.
- id: 179
  category: sharing_the_road
  question: In Idaho, how many motorcycles are legally allowed to ride side-by-side
    (abreast) in a single lane?
  choices:
    A: Only one; they must ride in single file.
    B: Up to two.
    C: Up to three.
    D: As many as can safely fit.
  answer: B
  explanation: Idaho law allows two motorcycles to operate abreast in a single lane,
    provided both riders consent to the arrangement.
- id: 180
  category: sharing_the_road
  question: 'When a funeral procession is being led by a funeral escort vehicle with
    flashing lights, other drivers must:'
  choices:
    A: Yield the right-of-way to all vehicles in the procession.
    B: Only yield to the lead vehicle.
    C: Pass the procession on the right side only.
    D: Join the procession to get through traffic lights faster.
  answer: A
  explanation: In Idaho, vehicles in a funeral procession have the right-of-way at
    intersections when following the lead vehicle, regardless of traffic control devices,
    provided they have their headlights on. Other drivers must yield.
- id: 181
  category: vehicle_information
  question: 'According to the Idaho Driver''s Manual, your vehicle''s headlights must
    be turned on from sunset to sunrise or when visibility is less than:'
  choices:
    A: 200 feet
    B: 350 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Idaho law requires headlights to be on from sunset to sunrise, and
    at any other time when visibility is limited to less than 500 feet.
- id: 182
  category: vehicle_information
  question: Under Idaho law, your vehicle's foot brake must be capable of stopping
    the vehicle within how many feet when traveling at 25 mph?
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 50 feet
  answer: B
  explanation: Idaho equipment standards require that the service (foot) brake be
    able to stop the vehicle within 25 feet from a speed of 25 mph on a dry, level
    pavement.
- id: 183
  category: vehicle_information
  question: Idaho law requires that every motor vehicle must be equipped with a mirror
    that allows the driver to see the highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Every motor vehicle must have a mirror so located as to reflect to
    the driver a view of the highway for a distance of at least 200 feet to the rear.
- id: 184
  category: vehicle_information
  question: What is the maximum allowable window tint darkness for the front side
    windows (driver and front passenger) in Idaho?
  choices:
    A: 20% light transmission
    B: 35% light transmission
    C: 50% light transmission
    D: 70% light transmission
  answer: B
  explanation: Idaho Code 49-944 specifies that the front side windows must have a
    light transmission of no less than 35%.
- id: 185
  category: vehicle_information
  question: In Idaho, what is the minimum light transmission allowed for the rear
    side windows and the back window of a motor vehicle?
  choices:
    A: 5%
    B: 20%
    C: 35%
    D: 50%
  answer: B
  explanation: For the rear side windows and the back window, Idaho law permits a
    darker tint, but it must allow at least 20% light transmission.
- id: 186
  category: vehicle_information
  question: 'Every motor vehicle in Idaho must have a horn that can be heard from
    a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Idaho law requires vehicles to be equipped with a horn in good working
    order capable of emitting sound audible under normal conditions from a distance
    of not less than 200 feet.
- id: 187
  category: vehicle_information
  question: If a load extends more than ____ feet past the rear of a vehicle's body
    in Idaho, a red flag (day) or red light (night) must be attached to the end of
    the load.
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Whenever the load upon any vehicle extends to the rear four feet or
    more beyond the bed or body of the vehicle, a red flag or red light must be displayed
    at the extreme rear end of the load.
- id: 188
  category: vehicle_information
  question: What is the minimum legal tire tread depth for passenger vehicles in Idaho?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe in Idaho if they are worn to the point
    where less than 2/32 of an inch of tread remains.
- id: 189
  category: vehicle_information
  question: In Idaho, what is the maximum height allowed for any vehicle, including
    its load, without a special permit?
  choices:
    A: 13 feet, 6 inches
    B: 14 feet, 0 inches
    C: 14 feet, 6 inches
    D: 15 feet, 0 inches
  answer: B
  explanation: In Idaho, the maximum height for a vehicle and its load is 14 feet
    unless a special over-legal permit is obtained.
- id: 190
  category: vehicle_information
  question: According to Idaho law, fenders or covers (mudguards) are required on
    which types of vehicles to prevent splashing of mud or water?
  choices:
    A: Only motorcycles
    B: Only commercial semi-trucks
    C: All motor vehicles, trucks, and trailers
    D: Only vehicles with oversized tires
  answer: C
  explanation: Idaho Code 49-949 requires that all motor vehicles, trucks, and trailers
    be equipped with fenders, covers, or devices including flaps or splash aprons
    to effectively minimize the spray or splash of water or mud to the rear.
- id: 191
  category: vehicle_information
  question: When following another vehicle in Idaho, you must dim your high-beam headlights
    when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Idaho law requires drivers to switch to low beams when following another
    vehicle within 200 feet.
- id: 192
  category: vehicle_information
  question: In Idaho, your rearview mirror must provide a view of the highway for
    at least how many feet to the rear of the vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Idaho law requires at least one mirror that allows the driver to see
    the highway for a distance of at least 200 feet to the rear.
- id: 193
  category: vehicle_information
  question: What is the minimum light transmission percentage required for window
    tinting on the front side windows of a vehicle in Idaho?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: Idaho Code 49-944 specifies that window tinting on the front side windows
    must allow at least 35% of light to pass through.
- id: 194
  category: vehicle_information
  question: 'In Idaho, tires are considered unsafe and must be replaced if the tread
    depth is less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Idaho law requires tires to have at least 2/32 of an inch of tread
    depth in the major grooves.
- id: 195
  category: vehicle_information
  question: When driving on a highway with a speed limit of 45 mph or more, Idaho
    law requires you to signal your intent to turn for at least ____ before turning.
  choices:
    A: 100 feet
    B: 200 feet
    C: 5 seconds
    D: 10 seconds
  answer: C
  explanation: While the general rule is 100 feet, Idaho law specifically requires
    a signal of at least 5 seconds before making a turn or lane change when traveling
    on a highway or freeway.
- id: 196
  category: vehicle_information
  question: 'In Idaho, the rear license plate must be illuminated by a white light
    so that it is clearly legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Idaho Code 49-905 requires a tail lamp or a separate lamp to illuminate
    the rear registration plate with a white light, making it visible from 50 feet
    to the rear.
- id: 197
  category: vehicle_information
  question: Which of the following is a requirement for windshields under Idaho law?
  choices:
    A: They must be made of safety glass
    B: They must be free of any stickers except those required by law
    C: They must be equipped with working wipers
    D: All of the above
  answer: D
  explanation: Idaho law requires windshields to be made of safety glass, equipped
    with working wipers, and kept clear of obstructions or unauthorized stickers.
- id: 198
  category: signs_and_signals
  question: Under Idaho's 'Stop-Turn-Yield' law (Idaho Code 49-720), what must a bicyclist
    do when approaching a stop sign?
  choices:
    A: Come to a complete stop for at least 3 seconds
    B: Slow down and, if required for safety, stop; otherwise, proceed through the
      intersection without stopping
    C: Dismount and walk the bicycle across the intersection
    D: Stop only if there is a motor vehicle within 100 feet
  answer: B
  explanation: According to Idaho Code 49-720, a person operating a bicycle approaching
    a stop sign shall slow down and, if required for safety, stop. If not required
    for safety, they may yield and proceed without stopping.
- id: 199
  category: signs_and_signals
  question: In Idaho, what is a bicyclist required to do when approaching a steady
    red traffic light?
  choices:
    A: Treat it as a yield sign and proceed without stopping
    B: Wait for the light to turn green regardless of traffic
    C: Stop, yield to all other traffic, and proceed through the red light with caution
    D: Make a right turn only; straight through is prohibited
  answer: C
  explanation: Idaho law allows bicyclists to treat a red light as a stop sign. They
    must stop and yield to all other traffic in the intersection before proceeding
    straight or turning left.
- id: 200
  category: signs_and_signals
  question: What does a flashing yellow arrow traffic signal mean in Idaho?
  choices:
    A: You have the right of way to turn
    B: Turns are permitted, but you must first yield to oncoming traffic and pedestrians
    C: The signal is about to turn red; you must stop immediately
    D: The turn lane is closed
  answer: B
  explanation: A flashing yellow arrow means left turns are allowed, but you must
    yield to oncoming traffic and pedestrians. Oncoming traffic has a green light.
- id: 201
  category: signs_and_signals
  question: In Idaho, what does a solid yellow line on your side of the center line
    indicate?
  choices:
    A: You may pass if the road ahead is clear
    B: Passing is prohibited
    C: You are in a high-occupancy vehicle (HOV) lane
    D: You must slow down to 25 mph
  answer: B
  explanation: A solid yellow line on your side of the center line means that passing
    is prohibited for vehicles traveling in your direction.
- id: 202
  category: signs_and_signals
  question: What is the meaning of a pennant-shaped sign (an isosceles triangle pointing
    right) found on the left side of the road?
  choices:
    A: Yield Right of Way
    B: School Zone Ahead
    C: No Passing Zone
    D: Railroad Crossing
  answer: C
  explanation: A pennant-shaped sign is placed on the left side of the road to mark
    the beginning of a 'No Passing Zone'.
- id: 203
  category: signs_and_signals
  question: When you see a 'Slow Moving Vehicle' emblem (an orange triangle with a
    red reflective border) on a vehicle, it means the vehicle is traveling at what
    speed?
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: Exactly 10 mph
  answer: B
  explanation: The slow-moving vehicle emblem is required on all vehicles designed
    to operate at speeds of 25 mph or less.
- id: 204
  category: signs_and_signals
  question: 'In Idaho, if you are turning at an intersection where the traffic signal
    is dark (not working), you should:'
  choices:
    A: Treat the intersection as a four-way stop
    B: Yield only to traffic on your right
    C: Maintain your speed and proceed with caution
    D: Wait for a police officer to direct traffic
  answer: A
  explanation: If a traffic signal is not operating, you must treat the intersection
    as a four-way stop, yielding to the driver who arrived first or the driver on
    the right if you arrive at the same time.
- id: 205
  category: signs_and_signals
  question: What do 'Sharrows' (pavement markings showing a bicycle with two chevrons
    above it) indicate to Idaho drivers?
  choices:
    A: The lane is reserved exclusively for bicycles
    B: Bicycles are prohibited in this lane
    C: The lane is shared; motorists should expect to see and share the lane with
      bicyclists
    D: Bicyclists must stay on the shoulder
  answer: C
  explanation: Shared Lane Markings, or 'Sharrows,' are used to alert motorists that
    bicyclists may occupy the full lane and to help bicyclists position themselves
    safely.
- id: 206
  category: signs_and_signals
  question: 'To signal a right turn using hand signals, an Idaho driver should:'
  choices:
    A: Extend the left arm straight out the window
    B: Extend the left arm out and point it upward
    C: Extend the left arm out and point it downward
    D: Extend the right arm straight out the window
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out the window and bent upward at the elbow.
- id: 207
  category: signs_and_signals
  question: What does a steady yellow traffic light indicate in Idaho?
  choices:
    A: The light is about to turn green
    B: You should speed up to clear the intersection
    C: The red light is about to appear; clear the intersection or stop if you can
      do so safely
    D: Pedestrians have the right of way
  answer: C
  explanation: A steady yellow light means the signal is changing to red. You should
    stop if it is safe to do so; otherwise, you should clear the intersection.
- id: 208
  category: signs_and_signals
  question: In Idaho, what color are signs used to provide information about services
    like gas, food, and lodging?
  choices:
    A: Green
    B: Blue
    C: Brown
    D: Yellow
  answer: B
  explanation: Blue signs are used for motorist services, such as fuel, food, lodging,
    and hospitals.
- id: 209
  category: signs_and_signals
  question: What does a round yellow sign with a black 'X' and the letters 'RR' indicate?
  choices:
    A: A sharp turn ahead
    B: A railroad crossing ahead
    C: A road construction zone
    D: A restricted roadway
  answer: B
  explanation: The round yellow sign is a warning sign indicating that you are approaching
    a railroad crossing.
- id: 210
  category: signs_and_signals
  question: When a 'Do Not Pass' sign is posted, where is it usually located relative
    to the pavement markings?
  choices:
    A: Only where there are broken white lines
    B: At the beginning of a zone where passing is prohibited
    C: Only on multi-lane highways
    D: Every 500 feet in a construction zone
  answer: B
  explanation: A 'Do Not Pass' sign is a regulatory sign placed at the start of a
    zone where it is unsafe or illegal to pass other vehicles.
- id: 211
  category: signs_and_signals
  question: What is the purpose of a solid white line painted across a lane at an
    intersection?
  choices:
    A: It marks the pedestrian crosswalk only
    B: It indicates where you must stop for a stop sign or red light
    C: It indicates a bicycle-only lane
    D: It marks the edge of the highway
  answer: B
  explanation: A solid white stop line (or 'limit line') shows where you must stop
    your vehicle when directed by a stop sign or traffic signal.
- id: 212
  category: signs_and_signals
  question: What does a flashing yellow arrow mean at an Idaho intersection?
  choices:
    A: You have the right-of-way to turn left
    B: You must stop and wait for a green arrow
    C: Turns are allowed, but you must first yield to oncoming traffic and pedestrians
    D: The light is broken and should be treated as a four-way stop
  answer: C
  explanation: In Idaho, a flashing yellow arrow means left turns are permitted, but
    you must first yield to oncoming traffic and pedestrians, then proceed with caution.
- id: 213
  category: signs_and_signals
  question: When you see a sign shaped like a pentagon (five-sided) while driving
    in Idaho, what does it indicate?
  choices:
    A: A railroad crossing ahead
    B: A construction zone
    C: A school zone or school crossing
    D: A yield requirement
  answer: C
  explanation: The five-sided (pentagon) shape is used exclusively for school zones
    and school crossings in Idaho.
- id: 214
  category: signs_and_signals
  question: What is the correct hand signal for a right turn in Idaho?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward at a 90-degree angle
    C: Left arm extended downward with palm to the rear
    D: Right arm extended straight out the window
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at the elbow.
- id: 215
  category: signs_and_signals
  question: In Idaho, what does a 'Slow Moving Vehicle' emblem look like?
  choices:
    A: A square orange sign
    B: A circular yellow sign with an 'X'
    C: A fluorescent orange triangle with a reflective red border
    D: A diamond-shaped green sign
  answer: C
  explanation: The slow-moving vehicle emblem is a triangular sign that is fluorescent
    orange with a reflective red border, used on vehicles traveling 25 mph or less.
- id: 216
  category: signs_and_signals
  question: When you encounter double solid white lines on an Idaho roadway, what
    do they signify?
  choices:
    A: You may cross them to change lanes if it is safe
    B: They separate traffic moving in opposite directions
    C: Crossing the lines is prohibited
    D: They indicate a bicycle lane only
  answer: C
  explanation: Double solid white lines indicate that lane changes are prohibited.
    You must stay in your lane.
- id: 217
  category: signs_and_signals
  question: What is the correct hand signal to indicate you are slowing or stopping
    in Idaho?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Waving the left hand in a circular motion
  answer: C
  explanation: To signal slowing or stopping, extend your left arm downward with the
    palm facing the rear.
- id: 218
  category: signs_and_signals
  question: What does an orange diamond-shaped sign represent in Idaho?
  choices:
    A: Regulatory information
    B: School zones
    C: Construction or maintenance warnings
    D: Recreational areas
  answer: C
  explanation: Orange is the standard color for construction and maintenance warning
    signs in Idaho.
- id: 219
  category: signs_and_signals
  question: In Idaho, if you are turning at an intersection and the traffic signal
    is a green circle (not an arrow), but there is oncoming traffic, what must you
    do?
  choices:
    A: Turn immediately as you have the right-of-way
    B: Stop and wait for the light to turn red, then turn
    C: Yield to oncoming traffic and proceed when there is a safe gap
    D: Honk to warn oncoming traffic to stop
  answer: C
  explanation: A green circular light means you may proceed, but if you are turning
    left, you must yield the right-of-way to oncoming vehicles and pedestrians in
    the crosswalk.
- id: 220
  category: signs_and_signals
  question: What does a 'Crossbuck' sign at a railroad crossing mean in Idaho?
  choices:
    A: Stop only if a train is visible
    B: The same as a yield sign; you must yield to any approaching trains
    C: Speed up to cross the tracks quickly
    D: The crossing is no longer in use
  answer: B
  explanation: The railroad crossbuck sign is a regulatory sign that requires drivers
    to yield the right-of-way to trains. If there is more than one track, the number
    of tracks will be indicated below the crossbuck.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 221
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 222
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 223
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 224
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 225
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 226
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 227
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 228
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 229
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 230
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 231
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 232
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 233
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 234
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
