questions:
- id: 1
  category: license_system
  question: En Saskatchewan, quel est l'âge minimal pour demander un permis de classe
    7 (apprenti conducteur) si vous êtes inscrit à un programme d'éducation routière
    au secondaire ?
  choices:
    A: 14 ans
    B: 15 ans
    C: 16 ans
    D: 15 ans et 6 mois
  answer: B
  explanation: En Saskatchewan, l'âge minimal pour obtenir un permis d'apprenti conducteur
    de classe 7 est de 15 ans si le demandeur est inscrit à un programme d'éducation
    routière au secondaire. Sinon, l'âge minimal est de 16 ans.
- id: 2
  category: license_system
  question: Un conducteur accompagnateur pour un apprenti de classe 7 doit répondre
    à laquelle des exigences suivantes ?
  choices:
    A: Doit être âgé d'au moins 18 ans et détenir un permis de classe 5 valide depuis
      au moins 365 jours.
    B: Doit être âgé d'au moins 21 ans et détenir un permis de classe 5 valide depuis
      2 ans.
    C: Doit être âgé d'au moins 19 ans et avoir un dossier de conduite vierge depuis
      3 ans.
    D: Doit être un membre de la famille âgé d'au moins 18 ans.
  answer: A
  explanation: Les règlements de la SGI stipulent qu'un conducteur accompagnateur
    pour un apprenti doit être âgé d'au moins 18 ans et détenir un permis de classe
    5 (ou supérieure) valide depuis au moins 365 jours.
- id: 3
  category: license_system
  question: Dans le cadre du programme de permis de conduire progressif (GDL - Graduated
    Driver Licensing) de la Saskatchewan, quelle est la limite de taux d'alcoolémie
    (BAC) pour les apprentis et les conducteurs débutants ?
  choices:
    A: 0,02 %
    B: 0,04 %
    C: 0,05 %
    D: Zéro (0,00 %)
  answer: D
  explanation: Tous les conducteurs du programme de permis de conduire progressif
    de la Saskatchewan (apprentis, débutants 1 et débutants 2) sont soumis à une politique
    de tolérance zéro pour l'alcool et les drogues.
- id: 4
  category: license_system
  question: Laquelle des options suivantes est une restriction concernant les passagers
    pour un conducteur de classe 5 débutant 1 (Novice 1) ?
  choices:
    A: Aucun passager n'est autorisé entre minuit et 5 h 00.
    B: Un seul passager qui n'est pas un membre de la famille immédiate est autorisé.
    C: Un maximum de trois passagers est autorisé, quel que soit le lien de parenté.
    D: Aucun passager de moins de 18 ans n'est autorisé.
  answer: B
  explanation: Les conducteurs de classe 5 débutant 1 (Novice 1) sont limités à un
    seul passager qui n'est pas un membre de la famille immédiate. Les autres passagers
    doivent être des membres de la famille immédiate.
- id: 5
  category: license_system
  question: Combien de temps un conducteur doit-il rester à l'étape d'apprenti (classe
    7) avant d'être admissible à l'examen de conduite pour son permis débutant 1 (Novice
    1) ?
  choices:
    A: 6 mois
    B: 9 mois
    C: 12 mois
    D: 18 mois
  answer: B
  explanation: En Saskatchewan, vous devez détenir un permis d'apprenti conducteur
    de classe 7 pendant au moins neuf mois et suivre la formation de conduite obligatoire
    avant de pouvoir passer l'examen de conduite de classe 5.
- id: 6
  category: license_system
  question: Quelles sont les restrictions concernant le téléphone cellulaire pour
    un conducteur à l'étape débutant 2 (Novice 2) du programme GDL ?
  choices:
    A: Ils peuvent utiliser un téléphone cellulaire uniquement avec un dispositif
      mains libres.
    B: Ils peuvent utiliser un téléphone cellulaire uniquement à des fins de GPS.
    C: Il leur est interdit d'utiliser tout type de téléphone cellulaire, y compris
      les dispositifs mains libres.
    D: Il n'y a aucune restriction tant qu'ils ont plus de 18 ans.
  answer: C
  explanation: Il est interdit aux conducteurs du programme GDL (apprentis, débutants
    1 et débutants 2) d'utiliser tout équipement de communication électronique en
    conduisant, y compris les téléphones cellulaires mains libres.
- id: 7
  category: license_system
  question: Quelle est la durée de l'étape débutant 2 (Novice 2) dans le programme
    GDL de la Saskatchewan si le conducteur n'a aucun incident ?
  choices:
    A: 6 mois
    B: 9 mois
    C: 12 mois
    D: 24 mois
  answer: C
  explanation: L'étape débutant 2 (Novice 2) dure 12 mois. Si le conducteur termine
    cette période sans condamnation pour infraction au code de la route, collision
    responsable ou suspension, il obtient un permis complet de classe 5.
- id: 8
  category: license_system
  question: Lors d'une demande de permis de conduire de la Saskatchewan, combien de
    documents devez-vous fournir pour prouver votre résidence en Saskatchewan ?
  choices:
    A: Un document
    B: Deux documents
    C: Trois documents
    D: Aucun, si vous avez un certificat de naissance valide
  answer: B
  explanation: 'La SGI exige deux documents originaux prouvant que vous résidez en
    Saskatchewan (ex. : facture de services publics, relevé bancaire, talon de paie)
    pour établir la résidence pour un permis.'
- id: 9
  category: license_system
  question: Dans le cadre du programme de reconnaissance des conducteurs prudents
    (SDR - Safe Driver Recognition), quel est le solde de points de départ pour un
    nouveau conducteur ?
  choices:
    A: -5 points
    B: 0 point
    C: +5 points
    D: +10 points
  answer: B
  explanation: Tous les nouveaux conducteurs commencent dans la « zone neutre » avec
    0 point sur l'échelle de reconnaissance des conducteurs prudents. Ils accumulent
    des points pour chaque année de conduite sans incident.
- id: 10
  category: license_system
  question: Si un conducteur du programme GDL est pris avec n'importe quelle quantité
    d'alcool ou de drogue dans son organisme, quelle est la sanction immédiate sur
    la route pour une première infraction ?
  choices:
    A: Un avertissement verbal
    B: Une suspension de permis de 24 heures
    C: Une suspension de permis de 60 jours et la mise en fourrière du véhicule
    D: Une suspension de permis de 3 jours et la mise en fourrière du véhicule
  answer: C
  explanation: En Saskatchewan, les conducteurs du programme GDL font face à une suspension
    de permis immédiate de 60 jours et à une mise en fourrière du véhicule de 3 jours
    pour une première infraction liée à la présence d'alcool ou de drogues dans leur
    organisme.
- id: 11
  category: license_system
  question: Lequel des éléments suivants est requis pour passer du niveau Novice 1
    au niveau Novice 2 ?
  choices:
    A: Réussir un deuxième examen de conduite
    B: Effectuer 6 mois de conduite sans incident
    C: Effectuer 12 mois de conduite sans incident
    D: Suivre un cours de conduite préventive
  answer: B
  explanation: Un conducteur passe automatiquement du niveau Novice 1 au niveau Novice
    2 après 6 mois de conduite sans incident.
- id: 12
  category: license_system
  question: Où le conducteur superviseur doit-il s'asseoir lorsqu'un apprenti conducteur
    de classe 7 conduit un véhicule ?
  choices:
    A: N'importe où dans le véhicule
    B: Sur le siège arrière, directement derrière le conducteur
    C: Sur le siège passager avant
    D: Sur le siège offrant la meilleure vue sur la route
  answer: C
  explanation: Le conducteur superviseur doit occuper le siège le plus proche du conducteur
    (le siège passager avant) et être conscient et capable de prendre le contrôle
    du véhicule si nécessaire.
- id: 13
  category: license_system
  question: Si vous déménagez en Saskatchewan en provenance d'une autre province,
    de combien de temps disposez-vous pour échanger votre permis hors province contre
    un permis de la Saskatchewan ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 120 jours
  answer: C
  explanation: Les nouveaux résidents titulaires d'un permis de conduire valide hors
    province disposent de 90 jours après leur installation en Saskatchewan pour l'échanger
    contre un permis de la Saskatchewan.
- id: 14
  category: license_system
  question: Quel est le nombre maximum de passagers autorisé pour un conducteur de
    classe 5 Novice 2 ?
  choices:
    A: Un seul passager
    B: Deux passagers seulement
    C: Autant de passagers qu'il y a de ceintures de sécurité
    D: Un passager qui n'est pas de la famille, plus les membres de la famille
  answer: C
  explanation: Contrairement au niveau Novice 1, l'étape Novice 2 n'a pas de restriction
    spécifique de passager « non-membre de la famille ». Cependant, le conducteur
    ne doit pas avoir plus de passagers qu'il n'y a de ceintures de sécurité fonctionnelles.
- id: 15
  category: license_system
  question: Dans quel délai devez-vous informer la SGI d'un changement de nom ou d'adresse
    ?
  choices:
    A: 7 jours
    B: 15 jours
    C: 30 jours
    D: 60 jours
  answer: B
  explanation: Selon la loi de la Saskatchewan, vous devez informer la SGI de tout
    changement de nom ou d'adresse dans les 15 jours.
- id: 16
  category: license_system
  question: Dans le cadre du programme de reconnaissance des bons conducteurs (SDR)
    de la Saskatchewan, quel est le montant de la pénalité financière pour chaque
    point si un conducteur se trouve dans la « zone de pénalité » (points négatifs)
    ?
  choices:
    A: 25 $ par point
    B: 50 $ par point
    C: 75 $ par point
    D: 100 $ par point
  answer: B
  explanation: En Saskatchewan, les conducteurs se trouvant dans la zone de pénalité
    du programme de reconnaissance des bons conducteurs (SDR) doivent payer une pénalité
    de 50 $ pour chaque point en dessous de zéro.
- id: 17
  category: license_system
  question: Combien de points sont déduits de la cote de reconnaissance des bons conducteurs
    (SDR) d'un conducteur pour une seule condamnation pour conduite distraite ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Une condamnation pour conduite distraite en Saskatchewan entraîne une
    déduction de 4 points de la cote SDR du conducteur.
- id: 18
  category: license_system
  question: Quelle est la remise maximale qu'un conducteur peut recevoir sur son assurance
    automobile grâce au programme de reconnaissance des bons conducteurs (SDR) ?
  choices:
    A: 15 %
    B: 20 %
    C: 25 %
    D: 30 %
  answer: C
  explanation: Les conducteurs ayant une cote de sécurité de +25 reçoivent la remise
    maximale sur la prime d'assurance de 25 %.
- id: 19
  category: license_system
  question: En Saskatchewan, quel est l'âge minimum requis pour demander un permis
    de conduire de classe 1 (commercial) ?
  choices:
    A: 16 ans
    B: 18 ans
    C: 19 ans
    D: 21 ans
  answer: B
  explanation: Pour demander un permis commercial de classe 1 en Saskatchewan, le
    demandeur doit être âgé d'au moins 18 ans et ne pas faire partie du programme
    de permis de conduire progressif (GDL).
- id: 20
  category: license_system
  question: Quelle classe de permis de conduire de la Saskatchewan est requise pour
    conduire un taxi ou une ambulance ?
  choices:
    A: Classe 5
    B: Classe 4
    C: Classe 3
    D: Classe 2
  answer: B
  explanation: Un permis de classe 4 est requis pour conduire des taxis, des ambulances
    et des autobus ayant une capacité allant jusqu'à 24 passagers.
- id: 21
  category: license_system
  question: Pour un conducteur inscrit au programme d'éducation routière au secondaire,
    combien d'heures de formation théorique en classe sont nécessaires avant de pouvoir
    recevoir son permis d'apprenti conducteur ?
  choices:
    A: 6 heures
    B: 15 heures
    C: 30 heures
    D: 40 heures
  answer: C
  explanation: Le programme d'éducation routière au secondaire de la Saskatchewan
    exige 30 heures de formation théorique en classe et 6 heures de formation pratique
    au volant.
- id: 22
  category: license_system
  question: Quelle est la conséquence d'une deuxième infraction pour conduite distraite
    au cours d'une période de 12 mois en Saskatchewan ?
  choices:
    A: Une amende de 280 $ et 2 points
    B: Une amende de 580 $ et une suspension de 24 heures
    C: Une amende de 1 400 $ et la saisie immédiate du véhicule pour 7 jours
    D: La révocation permanente du permis
  answer: C
  explanation: Une deuxième infraction pour conduite distraite en un an entraîne une
    amende de 1 400 $, 4 points de démérite et une saisie immédiate du véhicule pendant
    7 jours.
- id: 23
  category: license_system
  question: Combien de points un conducteur gagne-t-il sur sa cote de reconnaissance
    des bons conducteurs (SDR) pour chaque année de conduite sans incident (accidents
    ou condamnations) ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: A
  explanation: Les conducteurs gagnent un point sur l'échelle SDR pour chaque année
    de conduite sans incident, jusqu'à un maximum de +25.
- id: 24
  category: license_system
  question: En Saskatchewan, à quelle fréquence la plupart des conducteurs doivent-ils
    renouveler leur permis de conduire ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 5 ans
    D: Tous les 10 ans
  answer: C
  explanation: Les permis de conduire de la Saskatchewan sont généralement renouvelés
    tous les cinq ans, habituellement à la date d'anniversaire du conducteur.
- id: 25
  category: license_system
  question: Si un conducteur est à l'étape Novice 2 et qu'il est responsable d'une
    collision ou reçoit une condamnation pour infraction au code de la route, qu'arrive-t-il
    à son statut GDL (permis progressif) ?
  choices:
    A: Il est rétrogradé à l'étape d'apprenti conducteur
    B: Sa période Novice 2 est prolongée ou redémarrée
    C: Il doit repasser l'examen théorique écrit
    D: Rien ne se passe à moins qu'il ne perde tous ses points
  answer: B
  explanation: Dans le cadre du programme GDL, tout incident (condamnation ou collision
    responsable) pendant l'étape Novice 2 redémarrera la période de 12 mois sans incident
    requise pour obtenir un permis complet de classe 5.
- id: 26
  category: license_system
  question: Quel est l'âge minimum pour demander une mention d'apprenti motocycliste
    (6) en Saskatchewan ?
  choices:
    A: 15 ans
    B: 16 ans
    C: 17 ans
    D: 18 ans
  answer: B
  explanation: Pour entrer dans le programme de permis de conduire progressif pour
    motocyclettes (MGDL) et obtenir une mention d'apprenti, vous devez être âgé d'au
    moins 16 ans.
- id: 27
  category: license_system
  question: Pour les conducteurs expérimentés (non-GDL) de plus de 21 ans, à quel
    taux d'alcoolémie (BAC) commence une suspension administrative provinciale du
    permis ?
  choices:
    A: 0,02
    B: 0,04
    C: 0,05
    D: 0,08
  answer: B
  explanation: En Saskatchewan, les conducteurs expérimentés font face à une suspension
    de permis provinciale si leur taux d'alcoolémie (BAC) est de 0,04 ou plus.
- id: 28
  category: license_system
  question: Laquelle des conditions suivantes est nécessaire pour qu'un conducteur
    passe de la « zone de pénalité » à la « zone de sécurité » dans le programme SDR
    ?
  choices:
    A: Payer des frais fixes de 500 $
    B: Une année de conduite sans incident pour chaque point qu'il souhaite récupérer
    C: Repasser l'examen de conduite
    D: Participer à un atelier obligatoire de 2 jours
  answer: B
  explanation: Les conducteurs progressent sur l'échelle SDR en effectuant une année
    de conduite sans incident pour chaque point qu'ils doivent regagner.
- id: 29
  category: license_system
  question: Quelle est la cote la plus basse possible qu'un conducteur peut atteindre
    sur l'échelle de reconnaissance des bons conducteurs (SDR) ?
  choices:
    A: '-10'
    B: '-15'
    C: '-20'
    D: '-25'
  answer: C
  explanation: L'échelle SDR va d'un maximum de +25 (zone de sécurité) à un minimum
    de -20 (zone de pénalité).
- id: 30
  category: license_system
  question: Si vous résidez en Saskatchewan et que votre état de santé change d'une
    manière qui pourrait affecter votre conduite, que devez-vous faire légalement
    ?
  choices:
    A: Attendre le renouvellement de votre permis pour le signaler
    B: En informer immédiatement les Services d'examen médical de la SGI
    C: Arrêter de conduire seulement si votre médecin vous le conseille
    D: Rien, car les dossiers médicaux sont privés
  answer: B
  explanation: La loi de la Saskatchewan exige que les conducteurs signalent immédiatement
    à la SGI tout état de santé susceptible d'affecter leur capacité à conduire un
    véhicule à moteur en toute sécurité.
- id: 31
  category: driver_testing
  question: Pour réussir le test de vision pour un permis de classe 5 en Saskatchewan,
    quelle est l'acuité visuelle minimale requise avec les deux yeux ouverts et examinés
    ensemble ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Selon les normes de la SGI, un candidat à un permis de classe 5 doit
    avoir une acuité visuelle minimale de 20/40 avec les deux yeux ouverts et examinés
    ensemble, avec ou sans lentilles correctrices.
- id: 32
  category: driver_testing
  question: Laquelle des actions suivantes entraînera un échec automatique lors d'un
    examen de conduite en Saskatchewan ?
  choices:
    A: Oublier d'utiliser un clignotant une seule fois
    B: Conduire à 5 km/h sous la limite de vitesse
    C: L'intervention de l'examinateur pour prévenir une collision
    D: Ajuster les rétroviseurs à l'arrêt
  answer: C
  explanation: Toute action obligeant l'examinateur à prendre le contrôle du véhicule
    pour éviter une collision ou une situation dangereuse entraîne un échec immédiat
    et automatique de l'examen de conduite.
- id: 33
  category: driver_testing
  question: Lors d'un examen de conduite en Saskatchewan, le véhicule fourni par le
    candidat doit répondre à quelle exigence d'équipement ?
  choices:
    A: Il doit avoir moins de 5 ans
    B: Il doit avoir un indicateur de vitesse et des feux de freinage en état de marche
    C: Il doit être équipé de pneus d'hiver quelle que soit la saison
    D: Il doit être équipé d'une transmission manuelle
  answer: B
  explanation: Le véhicule utilisé pour un examen de conduite doit être mécaniquement
    sûr et équipé de feux de freinage, de clignotants, d'un indicateur de vitesse
    et d'un klaxon en état de marche. Si le véhicule est dangereux, l'examinateur
    refusera l'examen.
- id: 34
  category: driver_testing
  question: L'examen théorique écrit de la Saskatchewan pour un permis d'apprenti
    conducteur de classe 7 comprend combien de questions, et quel est le score de
    passage requis ?
  choices:
    A: 30 questions ; 24 bonnes réponses (80 %)
    B: 40 questions ; 32 bonnes réponses (80 %)
    C: 50 questions ; 40 bonnes réponses (80 %)
    D: 100 questions ; 80 bonnes réponses (80 %)
  answer: C
  explanation: L'examen de connaissances de la SGI se compose de 50 questions à choix
    multiples (divisées entre la signalisation routière et les règles de la route).
    Vous devez répondre correctement à au moins 40 questions (80 %) pour réussir.
- id: 35
  category: driver_testing
  question: En Saskatchewan, quelle est la vitesse maximale autorisée pour dépasser
    un véhicule d'urgence arrêté avec ses gyrophares allumés sur une autoroute ?
  choices:
    A: 40 km/h
    B: 60 km/h
    C: 80 km/h
    D: La limite de vitesse affichée
  answer: B
  explanation: La loi de la Saskatchewan exige que les conducteurs ralentissent à
    60 km/h lorsqu'ils dépassent des véhicules d'urgence (police, pompiers, ambulance)
    ou des dépanneuses arrêtés sur l'autoroute avec leurs gyrophares allumés.
- id: 36
  category: driver_testing
  question: Lorsque vous traversez une zone de travaux routiers désignée en Saskatchewan
    où des travailleurs sont présents, quelle est la limite de vitesse, sauf indication
    contraire ?
  choices:
    A: 30 km/h
    B: 50 km/h
    C: 60 km/h
    D: 80 km/h
  answer: C
  explanation: En Saskatchewan, la limite de vitesse dans les zones de travaux routiers
    est de 60 km/h lorsque des travailleurs sont présents, à moins qu'une vitesse
    différente ne soit affichée. Les amendes pour excès de vitesse dans ces zones
    sont triplées.
- id: 37
  category: driver_testing
  question: Dans les villes de Regina et de Saskatoon, quelle est la limite de vitesse
    standard dans les zones scolaires, et quand est-elle généralement en vigueur ?
  choices:
    A: 30 km/h ; de 7 h 00 à 19 h 00 tous les jours
    B: 40 km/h ; de 8 h 00 à 17 h 00 les jours d'école
    C: 30 km/h ; de 8 h 00 à 22 h 00 tous les jours
    D: 20 km/h ; 24 heures sur 24
  answer: C
  explanation: Selon les règlements récents de Regina et de Saskatoon, les zones scolaires
    et de jeux ont une limite de 30 km/h en vigueur de 8 h 00 à 22 h 00, 365 jours
    par an.
- id: 38
  category: driver_testing
  question: En Saskatchewan, qui est légalement responsable de s'assurer qu'un passager
    de moins de 16 ans porte sa ceinture de sécurité ou est correctement attaché dans
    un siège de sécurité pour enfant ?
  choices:
    A: Le passager
    B: Les parents du passager (même s'ils ne sont pas dans la voiture)
    C: Le conducteur du véhicule
    D: Personne ; c'est un choix personnel
  answer: C
  explanation: Le conducteur est responsable de s'assurer que tous les passagers de
    moins de 16 ans sont correctement attachés. S'ils ne le sont pas, le conducteur
    peut recevoir une contravention.
- id: 39
  category: driver_testing
  question: Selon le Guide de l'automobiliste de la Saskatchewan, où est-il illégal
    d'effectuer un demi-tour (U-turn) ?
  choices:
    A: À n'importe quelle intersection
    B: À une intersection contrôlée par des feux de circulation
    C: Sur une route de gravier
    D: Dans une entrée résidentielle
  answer: B
  explanation: En Saskatchewan, les demi-tours sont interdits aux intersections contrôlées
    par des feux de circulation, entre les intersections dans les quartiers d'affaires
    et là où des panneaux les interdisent.
- id: 40
  category: driver_testing
  question: Quel est le montant minimum de la couverture d'assurance responsabilité
    civile envers les tiers incluse dans l'immatriculation de base d'un véhicule en
    Saskatchewan ?
  choices:
    A: 50 000 $
    B: 100 000 $
    C: 200 000 $
    D: 500 000 $
  answer: C
  explanation: L'immatriculation de base d'un véhicule en Saskatchewan par l'intermédiaire
    de la SGI comprend une couverture de responsabilité civile de 200 000 $. De nombreux
    conducteurs choisissent de souscrire une assurance complémentaire pour des limites
    plus élevées.
- id: 41
  category: driver_testing
  question: Si vous avez un problème de santé qui pourrait affecter votre capacité
    à conduire en toute sécurité, quand devez-vous le signaler à la SGI ?
  choices:
    A: Seulement lors du renouvellement de votre permis tous les 5 ans
    B: Immédiatement
    C: Seulement si vous êtes impliqué dans une collision
    D: Dans les 30 jours suivant une visite chez le médecin
  answer: B
  explanation: La loi de la Saskatchewan exige que les conducteurs signalent immédiatement
    tout problème de santé, ou tout changement à une condition existante, qui pourrait
    affecter leur capacité à conduire un véhicule à moteur en toute sécurité.
- id: 42
  category: driver_testing
  question: Lors d'un examen de conduite, que devez-vous faire à l'approche d'un feu
    vert de longue durée (« stale green ») ?
  choices:
    A: Accélérer pour dégager l'intersection avant qu'il ne passe au jaune
    B: Maintenir votre vitesse en espérant qu'il reste au vert
    C: Vous préparer à arrêter et vérifier votre rétroviseur
    D: Arrêter immédiatement, même si vous êtes dans l'intersection
  answer: C
  explanation: Un feu vert de longue durée est un feu qui est vert depuis longtemps
    et qui risque de changer bientôt. Les conducteurs doivent couvrir le frein, vérifier
    les rétroviseurs et être prêts à s'arrêter si le feu change.
- id: 43
  category: driver_testing
  question: Dans le cadre du programme de reconnaissance des conducteurs prudents
    (SDR), si vous êtes dans la « zone de pénalité » (points négatifs), combien d'années
    de conduite sans incident sont nécessaires pour regagner un point ?
  choices:
    A: 6 mois
    B: 1 an
    C: 2 ans
    D: 3 ans
  answer: B
  explanation: Pour chaque année de conduite sans incident (aucun accident responsable
    ni condamnation pour infraction au code de la route), un conducteur remonte d'un
    point sur l'échelle du SDR vers la « zone de sécurité ».
- id: 44
  category: driver_testing
  question: Laquelle des conditions suivantes est requise pour le pare-brise du véhicule
    que vous utilisez lors d'un examen de conduite en Saskatchewan ?
  choices:
    A: Il doit être teinté à au moins 35 %
    B: Il ne doit présenter aucune fissure entravant la vue du conducteur
    C: Il doit comporter un autocollant « Élève conducteur »
    D: Il doit être fait de plexiglas renforcé
  answer: B
  explanation: Pour un examen de conduite, le pare-brise du véhicule doit être propre
    et exempt de fissures ou d'obstructions qui nuisent à la vue du conducteur ou
    à la sécurité du véhicule.
- id: 45
  category: driver_testing
  question: Un permis de conduire de classe 5 de la Saskatchewan vous permet de tracter
    une remorque, à condition que le poids brut de la remorque (ou des remorques)
    ne dépasse pas quelle limite ?
  choices:
    A: 2 500 kg
    B: 3 200 kg
    C: 4 600 kg
    D: 7 000 kg
  answer: C
  explanation: Un permis de classe 5 permet de conduire un véhicule à deux essieux
    tractant une ou plusieurs remorques dont le poids brut de l'unité ou des unités
    tractées ne dépasse pas 4 600 kg.
- id: 46
  category: driver_testing
  question: Pour réussir le test de vision pour un permis de conduire de classe 5
    en Saskatchewan, quelle est l'acuité visuelle minimale requise pour votre meilleur
    œil (avec ou sans lentilles correctrices) ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: La SGI exige une acuité visuelle minimale de 20/40 dans le meilleur
    œil pour être admissible à un permis de classe 5.
- id: 47
  category: driver_testing
  question: Si vous échouez à votre premier ou deuxième examen de conduite de classe
    5 en Saskatchewan, combien de temps devez-vous attendre avant de pouvoir repasser
    l'examen ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 21 jours
    D: 30 jours
  answer: B
  explanation: Selon les règlements de la SGI, si vous échouez à votre premier ou
    deuxième examen de conduite, il y a une période d'attente obligatoire de 14 jours
    avant de pouvoir passer un nouvel examen.
- id: 48
  category: driver_testing
  question: Dans le cadre du programme de reconnaissance des conducteurs prudents
    (SDR), combien de points gagnez-vous pour chaque année de conduite sans incident
    lorsque vous êtes dans la « zone de sécurité » ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: A
  explanation: Les conducteurs dans la zone de sécurité (points positifs) gagnent
    un point pour chaque année de conduite sans accident responsable ni condamnation
    pour infraction, jusqu'à un maximum de 25 points.
- id: 49
  category: driver_testing
  question: Quel est le nombre maximum de points qu'un conducteur peut accumuler dans
    la « zone de sécurité » du programme de reconnaissance des conducteurs prudents
    (SDR) de la Saskatchewan ?
  choices:
    A: 15 points
    B: 20 points
    C: 25 points
    D: 50 points
  answer: C
  explanation: La cote de sécurité maximale qu'un conducteur peut atteindre en Saskatchewan
    est de +25, ce qui donne droit à la réduction d'assurance maximale.
- id: 50
  category: driver_testing
  question: En Saskatchewan, combien de points SDR sont déduits de votre dossier pour
    une condamnation pour « omission de s'arrêter pour un autobus scolaire dont les
    feux rouges clignotent » ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Le fait de ne pas s'arrêter pour un autobus scolaire dont les feux
    rouges clignotent entraîne une déduction de 4 points dans le cadre du programme
    de reconnaissance des conducteurs prudents (SDR).
- id: 51
  category: driver_testing
  question: Les nouveaux résidents de la Saskatchewan doivent immatriculer leur véhicule
    et obtenir un permis de conduire de la Saskatchewan dans un délai de combien de
    jours après leur installation dans la province ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 120 jours
  answer: C
  explanation: La SGI exige que les nouveaux résidents échangent leur permis et immatriculent
    leurs véhicules dans les 90 jours suivant l'établissement de leur résidence.
- id: 52
  category: driver_testing
  question: Lors de l'épreuve de stationnement en parallèle de l'examen de conduite
    de classe 5 de la Saskatchewan, combien de tentatives sont autorisées pour réussir
    à garer le véhicule ?
  choices:
    A: 1 tentative
    B: 2 tentatives
    C: 3 tentatives
    D: Tentatives illimitées en 5 minutes
  answer: C
  explanation: Les normes de l'examen de conduite de la SGI autorisent le candidat
    à effectuer jusqu'à trois tentatives pour réussir son stationnement en parallèle
    entre les balises désignées.
- id: 53
  category: driver_testing
  question: Parmi les défectuosités suivantes du véhicule, laquelle entraînerait le
    refus ou l'annulation d'un examen de conduite en Saskatchewan avant même qu'il
    ne commence ?
  choices:
    A: Une fissure dans le pare-brise qui n'est pas dans le champ de vision direct
      du conducteur
    B: Un feu de freinage défectueux
    C: Une petite bosse sur le pare-chocs arrière
    D: Un réservoir de liquide lave-glace vide
  answer: B
  explanation: Le véhicule doit être en bon état de fonctionnement sécuritaire. Un
    feu de freinage défectueux constitue une infraction à la sécurité, et l'examinateur
    refusera de faire passer l'examen tant qu'il ne sera pas réparé.
- id: 54
  category: driver_testing
  question: Pour satisfaire aux normes de vision d'un permis de classe 5 en Saskatchewan,
    quel est le champ de vision horizontal minimal requis ?
  choices:
    A: 90 degrés
    B: 100 degrés
    C: 120 degrés
    D: 150 degrés
  answer: C
  explanation: La SGI exige un champ de vision horizontal continu d'au moins 120 degrés
    pour un permis de conduire de classe 5.
- id: 55
  category: driver_testing
  question: Si un conducteur se trouve dans la « zone de pénalité » du programme SDR
    (Safe Driver Recognition), combien d'années consécutives de conduite sans incident
    sont nécessaires pour revenir à une cote de zéro (neutre) ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: C
  explanation: Un conducteur se trouvant dans la zone de pénalité reviendra à une
    cote de zéro après trois années consécutives de conduite sans incident.
- id: 56
  category: driver_testing
  question: Pendant l'examen de conduite, si l'examinateur vous demande d'effectuer
    une manœuvre que vous jugez illégale, que devez-vous faire ?
  choices:
    A: Effectuer la manœuvre immédiatement car l'examinateur est une figure d'autorité
    B: Refuser de l'effectuer et expliquer qu'elle est illégale
    C: L'effectuer mais dire à l'examinateur après coup que vous savez que c'est mal
    D: Se ranger sur le côté et mettre fin à l'examen
  answer: B
  explanation: Les examinateurs peuvent parfois tester vos connaissances en suggérant
    une manœuvre ; vous ne devez effectuer aucune action illégale ou dangereuse. Vous
    devez informer l'examinateur de la raison pour laquelle vous ne pouvez pas le
    faire.
- id: 57
  category: driver_responsibility
  question: À quel moment une collision routière en Saskatchewan doit-elle être signalée
    à la police ?
  choices:
    A: Uniquement s'il y a plus de 1 000 $ de dommages au total.
    B: S'il y a des blessés, un décès, un délit de fuite, un conducteur non identifié
      ou si le véhicule doit être remorqué.
    C: Uniquement si l'un des conducteurs provient d'une autre province.
    D: Chaque fois qu'un contact a lieu entre deux véhicules.
  answer: B
  explanation: Selon la SGI, vous devez signaler un accident à la police s'il y a
    des blessés ou des décès, s'il s'agit d'un délit de fuite, si un conducteur a
    les facultés affaiblies, si un véhicule doit être remorqué ou si le conducteur
    n'est pas identifié.
- id: 58
  category: driver_responsibility
  question: Quelle est la franchise standard pour une réclamation au titre de la couverture
    collision obligatoire de base en Saskatchewan ?
  choices:
    A: 250 $
    B: 500 $
    C: 700 $
    D: 1 000 $
  answer: C
  explanation: La franchise standard pour la plupart des véhicules dans le cadre de
    l'assurance de base liée à la plaque d'immatriculation de la SGI est de 700 $.
- id: 59
  category: driver_responsibility
  question: Si vous êtes impliqué dans une collision avec un véhicule sans occupant
    et que vous ne trouvez pas le propriétaire, que devez-vous faire ?
  choices:
    A: Attendre 30 minutes, puis partir si personne ne se présente.
    B: Laisser une note avec votre nom, votre adresse et votre numéro de plaque d'immatriculation,
      et signaler l'accident à la SGI.
    C: Appeler une dépanneuse pour déplacer l'autre véhicule vers un endroit sûr.
    D: Rien, tant que les dommages semblent être inférieurs à 500 $.
  answer: B
  explanation: La loi de la Saskatchewan exige que vous preniez des mesures raisonnables
    pour localiser le propriétaire. S'il est introuvable, vous devez laisser un avis
    écrit contenant vos coordonnées et les informations sur votre véhicule, et signaler
    l'incident à la SGI.
- id: 60
  category: driver_responsibility
  question: Si vous êtes résident de la Saskatchewan et que vous achetez un véhicule
    dans une autre province, qu'est-ce qui est généralement requis avant qu'il puisse
    être immatriculé en Saskatchewan ?
  choices:
    A: Un acte de vente uniquement.
    B: Une inspection de sécurité mécanique dans une station certifiée de la Saskatchewan.
    C: Une lettre d'autorisation de l'ancien propriétaire.
    D: Rien, tant qu'il était immatriculé au Canada.
  answer: B
  explanation: La plupart des véhicules amenés en Saskatchewan depuis une autre province
    ou territoire doivent passer une inspection de sécurité mécanique avant de pouvoir
    être immatriculés.
- id: 61
  category: driver_responsibility
  question: Quel programme de la Saskatchewan offre des prestations pour les frais
    médicaux et la perte de revenus à toute personne blessée dans un accident de véhicule
    à moteur, peu importe qui est responsable ?
  choices:
    A: Le régime d'assurance-santé de la Saskatchewan
    B: Le Programme de protection contre les préjudices personnels (PIPP)
    C: Le programme de réadaptation des conducteurs
    D: L'option de responsabilité délictuelle (Tort Liability)
  answer: B
  explanation: Le PIPP est la couverture standard « sans égard à la responsabilité
    » en Saskatchewan qui offre des prestations de blessures à tous les résidents
    impliqués dans des accidents.
- id: 62
  category: driver_responsibility
  question: Si vous prêtez votre véhicule à un ami et qu'il est pris par une caméra
    de feu rouge, qui est responsable du paiement de l'amende ?
  choices:
    A: Le conducteur seulement.
    B: Le propriétaire du véhicule.
    C: Le conducteur et le propriétaire à parts égales.
    D: La compagnie d'assurance.
  answer: B
  explanation: En Saskatchewan, le propriétaire immatriculé d'un véhicule est responsable
    des contraventions émises par le biais de l'application automatisée (radar photo
    ou caméras de feu rouge), peu importe qui conduisait.
- id: 63
  category: driver_responsibility
  question: Pendant combien de temps un visiteur en Saskatchewan peut-il conduire
    en utilisant son permis de conduire et ses plaques d'immatriculation d'une autre
    province ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 6 mois
  answer: C
  explanation: Les visiteurs peuvent conduire en Saskatchewan pendant une période
    allant jusqu'à 90 jours avec un permis de conduire et une immatriculation valides
    d'une autre province.
- id: 64
  category: driver_responsibility
  question: Qu'arrive-t-il à l'immatriculation de votre véhicule si vous ne payez
    pas une amende pour une condamnation routière en Saskatchewan ?
  choices:
    A: Rien, les amendes sont distinctes de l'immatriculation.
    B: Vous ne pourrez pas renouveler votre permis de conduire ou l'immatriculation
      de votre véhicule tant que l'amende n'aura pas été payée.
    C: Votre véhicule sera immédiatement mis en fourrière.
    D: La franchise de votre assurance augmentera.
  answer: B
  explanation: SGI refusera de fournir des services de permis ou d'immatriculation
    (y compris les renouvellements) aux personnes ayant des amendes de circulation
    impayées.
- id: 65
  category: driver_responsibility
  question: Quand un conducteur doit-il avoir sur lui le certificat d'immatriculation
    du véhicule qu'il conduit ?
  choices:
    A: Uniquement lors de déplacements à l'extérieur de la Saskatchewan.
    B: Uniquement s'il s'agit d'un camion commercial.
    C: En tout temps lorsque le véhicule est utilisé.
    D: Uniquement lorsqu'un agent de police le demande par courrier.
  answer: C
  explanation: Le conducteur doit avoir sur lui le certificat d'immatriculation du
    véhicule (ou une photocopie claire) en tout temps lorsque le véhicule est utilisé.
- id: 66
  category: driver_responsibility
  question: Si vous êtes jugé responsable à 50 % ou plus d'une collision, combien
    de points seront déduits de votre cote de reconnaissance des bons conducteurs
    (SDR) ?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Un conducteur perd 6 points sur l'échelle SDR pour chaque accident
    responsable (où il est responsable à 50 % ou plus).
- id: 67
  category: driver_responsibility
  question: Quelle est la conséquence de la conduite d'un véhicule non immatriculé
    sur une voie publique en Saskatchewan ?
  choices:
    A: Un avertissement verbal pour la première infraction.
    B: Une amende et le véhicule peut être mis en fourrière.
    C: La perte automatique du permis de conduire pendant un an.
    D: Il n'y a pas de sanction si vous avez un permis de conduire valide.
  answer: B
  explanation: Conduire un véhicule non immatriculé est une infraction grave qui entraîne
    une amende importante et le remorquage ainsi que la mise en fourrière du véhicule.
- id: 68
  category: driver_responsibility
  question: 'En Saskatchewan, vous êtes légalement tenu de signaler une collision
    à la police si les dommages matériels totaux pour tous les véhicules et biens
    semblent être supérieurs à :'
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: Selon le guide de l'automobiliste de la Saskatchewan, les collisions
    doivent être signalées à la police s'il y a des blessés, un délit de fuite, si
    un conducteur a les facultés affaiblies, si un véhicule doit être remorqué ou
    si les dommages totaux dépassent 2 000 $.
- id: 69
  category: driver_responsibility
  question: Lorsque vous déménagez en Saskatchewan en provenance d'une autre province,
    de combien de jours disposez-vous pour immatriculer votre véhicule avec des plaques
    de la Saskatchewan ?
  choices:
    A: 14 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Bien que vous ayez 90 jours pour échanger votre permis de conduire,
    vous devez immatriculer votre véhicule et obtenir des plaques de la Saskatchewan
    dans les 30 jours suivant votre établissement comme résident.
- id: 70
  category: driver_responsibility
  question: Si vous êtes pris à conduire un véhicule qui n'est pas actuellement immatriculé
    ou assuré en Saskatchewan, quelle est la conséquence immédiate probable ?
  choices:
    A: Votre véhicule sera mis en fourrière
    B: Votre permis sera définitivement annulé
    C: Vous devrez repasser votre examen de conduite
    D: Vous serez banni du programme SDR pendant 5 ans
  answer: A
  explanation: Conduire un véhicule non immatriculé est une infraction grave en Saskatchewan
    et peut entraîner la saisie et la mise en fourrière du véhicule par la police.
- id: 71
  category: driver_responsibility
  question: Laquelle des situations suivantes n'est PAS une exigence légale pour un
    conducteur impliqué dans un accident en Saskatchewan ?
  choices:
    A: Arrêter le véhicule immédiatement
    B: Offrir toute l'assistance raisonnable à toute personne blessée
    C: Échanger son nom, son adresse et son numéro de plaque avec les autres parties
    D: Payer l'autre conducteur pour les dommages sur les lieux afin d'éviter une
      réclamation d'assurance
  answer: D
  explanation: Les conducteurs doivent s'arrêter, porter assistance et échanger des
    informations. Payer en espèces sur les lieux n'est pas une exigence légale et
    est généralement déconseillé car cela ne remplit pas les obligations de déclaration
    à l'assurance.
- id: 72
  category: driver_responsibility
  question: 'En Saskatchewan, la franchise standard pour la couverture collision et
    complète (accident sans collision) dans le cadre de l''assurance de base liée
    à la plaque est de :'
  choices:
    A: 200 $
    B: 500 $
    C: 700 $
    D: 1 000 $
  answer: C
  explanation: La franchise par défaut pour la plupart des véhicules dans le cadre
    de l'assurance de base de la SGI est de 700 $, bien que les conducteurs puissent
    choisir de souscrire une « police d'assurance complémentaire » (package policy)
    pour réduire ce montant.
- id: 73
  category: driver_responsibility
  question: 'Dans le cadre du programme de reconnaissance des bons conducteurs (Safe
    Driver Recognition - SDR), pour chaque année de conduite sans incident, votre
    cote s''améliore de :'
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: A
  explanation: Les conducteurs gagnent 1 point sur l'échelle SDR pour chaque année
    de conduite sans accident responsable, sans condamnation pour infraction au code
    de la route ou sans suspension de permis sur le bord de la route.
- id: 74
  category: driver_responsibility
  question: 'Si un conducteur est surpris à conduire un véhicule alors que son permis
    est suspendu ou qu''il fait l''objet d''une interdiction de conduire, le véhicule
    sera mis en fourrière pour un minimum de :'
  choices:
    A: 24 heures
    B: 7 jours
    C: 15 jours
    D: 30 jours
  answer: D
  explanation: La loi de la Saskatchewan impose une mise en fourrière du véhicule
    de 30 jours pour les conducteurs surpris à conduire pendant une suspension ou
    une interdiction.
- id: 75
  category: driver_responsibility
  question: Lors de la vente d'un véhicule de gré à gré en Saskatchewan, quelle est
    la responsabilité du vendeur concernant les plaques d'immatriculation ?
  choices:
    A: Les plaques doivent rester sur le véhicule pour le nouveau propriétaire
    B: Le vendeur doit retirer les plaques et peut les garder ou les retourner à la
      SGI
    C: Le vendeur doit transférer les plaques à l'acheteur par l'intermédiaire d'un
      courtier de la SGI
    D: Le vendeur doit peindre sur les plaques avant de remettre le véhicule
  answer: B
  explanation: En Saskatchewan, les plaques d'immatriculation appartiennent à l'individu
    et non au véhicule. Lorsqu'un véhicule est vendu, le vendeur doit retirer ses
    plaques.
- id: 76
  category: driver_responsibility
  question: Si un conducteur a actuellement une cote de reconnaissance des bons conducteurs
    (SDR) de -2 et qu'il est ensuite jugé responsable d'une collision, quelle sera
    sa nouvelle cote ?
  choices:
    A: '-4'
    B: '-6'
    C: '-8'
    D: '-12'
  answer: C
  explanation: Une collision responsable entraîne une déduction de 6 points. Si un
    conducteur est à -2, la soustraction de 6 points donne une nouvelle cote de -8.
- id: 77
  category: driver_responsibility
  question: Lequel des documents suivants un conducteur doit-il être en mesure de
    présenter à la demande d'un agent de la paix ?
  choices:
    A: Un permis de conduire valide
    B: Un certificat d'immatriculation de véhicule valide
    C: Une preuve de responsabilité financière (assurance)
    D: Tous les documents ci-dessus
  answer: D
  explanation: En Saskatchewan, la loi exige que les conducteurs transportent et présentent
    leur permis, leur immatriculation et leur preuve d'assurance à la demande de la
    police.
- id: 78
  category: driver_responsibility
  question: Si vous achetez un véhicule dans une autre province et que vous avez l'intention
    de le ramener en Saskatchewan par la route, que devez-vous obtenir pour être légalement
    couvert ?
  choices:
    A: Une note manuscrite du vendeur
    B: Un permis de transit (In-Transit permit) ou une immatriculation/assurance temporaire
    C: Rien, tant que vous avez l'acte de vente
    D: Un permis temporaire de la province d'achat
  answer: B
  explanation: Pour conduire légalement un véhicule nouvellement acheté d'une autre
    province vers la Saskatchewan, vous devez obtenir un permis de transit qui fournit
    une immatriculation et une assurance temporaires.
- id: 79
  category: driver_responsibility
  question: Quel est le but de la « suramende compensatoire pour les victimes » qui
    est ajoutée à toutes les amendes de la route en Saskatchewan ?
  choices:
    A: Payer pour l'administration de la SGI
    B: Financer l'entretien des routes provinciales
    C: Financer des programmes d'aide aux victimes d'actes criminels
    D: Payer pour le temps passé par l'agent de police au tribunal
  answer: C
  explanation: La suramende compensatoire pour les victimes est une taxe obligatoire
    ajoutée aux amendes provinciales pour alimenter le Fonds d'aide aux victimes,
    qui soutient les services aux victimes d'actes criminels en Saskatchewan.
- id: 80
  category: safe_driving_rules
  question: En Saskatchewan, quelle est la vitesse maximale autorisée lorsque vous
    dépassez un travailleur de la voirie, un signaleur ou de l'équipement occupé dans
    une zone de travaux ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: D
  explanation: En Saskatchewan, vous devez ralentir à 60 km/h lorsque vous dépassez
    des travailleurs, des signaleurs ou de l'équipement occupé dans une zone de travaux
    (la « zone orange »).
- id: 81
  category: safe_driving_rules
  question: Lorsque vous dépassez un véhicule d'urgence arrêté (police, pompiers ou
    ambulance) sur une route de la Saskatchewan avec ses sirènes ou ses gyrophares
    clignotants, quelle est la limite de vitesse maximale ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: C
  explanation: La loi de la Saskatchewan exige que les conducteurs ralentissent à
    60 km/h lorsqu'ils dépassent des véhicules d'urgence arrêtés avec leurs gyrophares
    clignotants sur les routes et autoroutes.
- id: 82
  category: safe_driving_rules
  question: Sauf indication contraire, quelle est la limite de vitesse par défaut
    sur les routes provinciales de la Saskatchewan en dehors des zones urbaines ?
  choices:
    A: 80 km/h
    B: 90 km/h
    C: 100 km/h
    D: 110 km/h
  answer: C
  explanation: La limite de vitesse par défaut pour les routes provinciales en Saskatchewan
    est de 100 km/h, à moins que des panneaux n'indiquent une limite différente.
- id: 83
  category: safe_driving_rules
  question: Quelle est la limite de vitesse par défaut sur les chemins de gravier
    ruraux en Saskatchewan, sauf indication contraire ?
  choices:
    A: 60 km/h
    B: 70 km/h
    C: 80 km/h
    D: 90 km/h
  answer: C
  explanation: En Saskatchewan, la limite de vitesse sur les chemins de gravier ruraux
    est de 80 km/h, sauf si des panneaux indiquent le contraire.
- id: 84
  category: safe_driving_rules
  question: Dans quelle condition spécifique un conducteur est-il autorisé à tourner
    à gauche au feu rouge en Saskatchewan ?
  choices:
    A: Jamais ; les virages à gauche au feu rouge sont toujours illégaux.
    B: Lorsqu'il passe d'une rue à sens unique à une autre rue à sens unique après
      un arrêt complet.
    C: Lorsqu'il n'y a pas de circulation en sens inverse.
    D: Uniquement entre 23 h 00 et 6 h 00.
  answer: B
  explanation: En Saskatchewan, vous pouvez tourner à gauche au feu rouge uniquement
    si vous passez d'une rue à sens unique à une autre rue à sens unique, à condition
    de marquer un arrêt complet et de céder le passage aux piétons et aux autres véhicules.
- id: 85
  category: safe_driving_rules
  question: En Saskatchewan, quelle est la distance minimale à laquelle vous devez
    vous stationner d'une borne d'incendie ?
  choices:
    A: 1 mètre
    B: 2 mètres
    C: 3 mètres
    D: 5 mètres
  answer: B
  explanation: Selon les règlements provinciaux de la Saskatchewan, il est interdit
    de se stationner à moins de 2 mètres d'une borne d'incendie.
- id: 86
  category: safe_driving_rules
  question: À quelle distance devez-vous vous stationner d'un panneau d'arrêt, d'un
    panneau de cédez-le-passage ou d'un feu de circulation en Saskatchewan ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Il est interdit de se stationner à moins de 5 mètres de tout panneau
    d'arrêt, panneau de cédez-le-passage ou signal de circulation.
- id: 87
  category: safe_driving_rules
  question: Lorsqu'un autobus scolaire est arrêté avec ses feux rouges clignotants
    et son bras d'arrêt déployé, à quelle distance devez-vous arrêter votre véhicule
    ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: En Saskatchewan, vous devez vous arrêter à au moins 5 mètres d'un autobus
    scolaire dont les feux rouges clignotent et dont le bras d'arrêt est déployé.
- id: 88
  category: safe_driving_rules
  question: Lorsque deux voies de circulation doivent fusionner en raison de la fermeture
    d'une voie, quelle est la procédure d'« insertion en fermeture éclair » (zipper
    merge) recommandée en Saskatchewan ?
  choices:
    A: S'insérer dans la voie ouverte le plus tôt possible.
    B: S'arrêter dans la voie qui ferme et attendre un espace.
    C: Les conducteurs dans la voie qui ferme doivent continuer jusqu'au bout de la
      voie, puis s'insérer à tour de rôle.
    D: Accélérer pour dépasser la circulation dans la voie ouverte.
  answer: C
  explanation: 'SGI recommande l''insertion en fermeture éclair : les conducteurs
    doivent utiliser pleinement les deux voies jusqu''au point de rétrécissement,
    puis s''insérer à tour de rôle dans la voie ouverte.'
- id: 89
  category: safe_driving_rules
  question: En Saskatchewan, les demi-tours sont généralement interdits à quels endroits
    parmi les suivants ?
  choices:
    A: Sur n'importe quel chemin de gravier.
    B: À une intersection contrôlée par un feu de circulation, sauf si un panneau
      l'autorise.
    C: Dans une rue à sens unique.
    D: Dans une entrée de cour résidentielle.
  answer: B
  explanation: En Saskatchewan, il est interdit de faire un demi-tour à une intersection
    contrôlée par des feux de circulation, à moins qu'un panneau ne l'autorise spécifiquement.
- id: 90
  category: safe_driving_rules
  question: Dans quelle circonstance est-il légal de dépasser un autre véhicule par
    la droite en Saskatchewan ?
  choices:
    A: Lorsque le véhicule qui précède tourne à gauche et qu'il y a un accotement
      revêtu ou une deuxième voie.
    B: Chaque fois que vous êtes pressé et que la voie de gauche est bloquée.
    C: Sur n'importe quelle route à deux voies si le fossé est plat.
    D: Il n'est jamais légal de dépasser par la droite.
  answer: A
  explanation: Vous ne pouvez dépasser par la droite que si le véhicule qui vous précède
    tourne à gauche et qu'il y a une voie libre ou une largeur de chaussée suffisante
    pour que votre véhicule puisse passer en toute sécurité.
- id: 91
  category: safe_driving_rules
  question: Quelle est la distance de suivi minimale recommandée derrière un autre
    véhicule dans des conditions de conduite idéales en Saskatchewan ?
  choices:
    A: La longueur d'une voiture
    B: Deux secondes
    C: Cinq secondes
    D: 50 mètres
  answer: B
  explanation: SGI recommande une distance de suivi minimale d'au moins deux secondes
    derrière le véhicule qui vous précède dans des conditions idéales.
- id: 92
  category: safe_driving_rules
  question: En Saskatchewan, que signifie généralement un feu vert clignotant à une
    intersection ?
  choices:
    A: Le feu est sur le point de passer au rouge.
    B: Il s'agit d'un signal actionné par les piétons ; il restera vert jusqu'à ce
      qu'un piéton appuie sur le bouton.
    C: Vous avez un virage à gauche protégé.
    D: L'intersection est en travaux.
  answer: B
  explanation: En Saskatchewan, un feu vert clignotant indique un signal actionné
    par les piétons. Il reste vert pour les conducteurs jusqu'à ce qu'un piéton appuie
    sur le bouton pour traverser.
- id: 93
  category: safe_driving_rules
  question: À une intersection en T non contrôlée en Saskatchewan, qui a la priorité
    de passage ?
  choices:
    A: Le conducteur à droite.
    B: Le conducteur sur la route qui se termine (la route qui finit).
    C: Le conducteur sur la route transversale (le haut du T).
    D: Le premier arrivé à l'intersection.
  answer: C
  explanation: À une intersection en T non contrôlée, le conducteur sur la route qui
    se termine doit céder le passage à la circulation sur la route transversale.
- id: 94
  category: safe_driving_rules
  question: En entrant dans un carrefour giratoire en Saskatchewan, laquelle des affirmations
    suivantes est vraie concernant la priorité de passage ?
  choices:
    A: La circulation entrant dans le carrefour giratoire a la priorité.
    B: Vous devez céder le passage à la circulation déjà engagée dans le carrefour
      giratoire.
    C: Vous devez vous arrêter avant d'entrer, même si aucun véhicule n'arrive.
    D: Le conducteur à gauche a toujours la priorité.
  answer: B
  explanation: En entrant dans un carrefour giratoire, vous devez céder le passage
    à la circulation qui y circule déjà et aux piétons se trouvant dans le passage
    pour piétons.
- id: 95
  category: safe_driving_rules
  question: Si vous conduisez sur une route à deux voies et que vous approchez d'un
    autobus scolaire arrêté avec ses feux rouges clignotants et son bras d'arrêt déployé,
    que devez-vous faire ?
  choices:
    A: Ralentir à 30 km/h et dépasser prudemment
    B: S'arrêter à au moins 5 mètres de l'autobus et attendre que les feux cessent
      de clignoter
    C: S'arrêter uniquement si vous êtes derrière l'autobus, pas si vous arrivez de
      l'avant
    D: Klaxonner et avancer lentement
  answer: B
  explanation: Lorsqu'un autobus scolaire a ses feux rouges clignotants et son bras
    d'arrêt déployé, les conducteurs dans les deux directions doivent s'arrêter à
    au moins 5 mètres de l'autobus et rester arrêtés jusqu'à ce que les feux soient
    éteints.
- id: 96
  category: safe_driving_rules
  question: Quelle est la limite de vitesse par défaut dans les zones urbaines de
    la Saskatchewan (cités, villes et villages), sauf indication contraire ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: La limite de vitesse standard dans les municipalités urbaines de la
    Saskatchewan est de 50 km/h, sauf indication contraire.
- id: 97
  category: safe_driving_rules
  question: 'Selon la loi actuelle de la Saskatchewan, quelle est l''amende pour une
    première condamnation pour conduite distraite (ex. : utiliser un téléphone cellulaire
    tenu à la main en conduisant) ?'
  choices:
    A: 280 $
    B: 380 $
    C: 580 $
    D: 1 000 $
  answer: C
  explanation: En Saskatchewan, une première infraction pour conduite distraite entraîne
    une amende de 580 $ plus une surtaxe d'aide aux victimes et 4 points d'inaptitude.
- id: 98
  category: safe_driving_rules
  question: Lors d'un virage à droite d'une rue à sens unique vers une autre rue à
    sens unique, de quelle voie devez-vous partir et dans laquelle devez-vous arriver
    ?
  choices:
    A: De la voie de gauche vers la voie de gauche
    B: De la voie de droite vers la voie de droite
    C: De la voie de droite vers n'importe quelle voie disponible
    D: De la voie centrale vers la voie de droite
  answer: B
  explanation: Lors d'un virage à droite, vous devez tourner de la voie de droite
    vers la voie de droite de la rue transversale.
- id: 99
  category: safe_driving_rules
  question: En Saskatchewan, s'il n'y a pas de passages pour piétons marqués ou de
    panneaux à une intersection, les piétons ont-ils la priorité ?
  choices:
    A: Non, les piétons n'ont la priorité qu'aux passages pour piétons marqués
    B: Oui, chaque intersection est considérée comme un « passage pour piétons non
      marqué » et les conducteurs doivent céder le passage
    C: Uniquement si le piéton porte des vêtements réfléchissants
    D: Uniquement si la limite de vitesse est inférieure à 50 km/h
  answer: B
  explanation: En Saskatchewan, chaque intersection est un passage pour piétons non
    marqué. Les conducteurs doivent céder la priorité de passage aux piétons qui traversent
    la rue à n'importe quelle intersection.
- id: 100
  category: safe_driving_rules
  question: Lorsque vous conduisez de nuit en Saskatchewan, à quelle distance devez-vous
    passer de vos feux de route aux feux de croisement lorsque vous suivez un autre
    véhicule ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 200 mètres
    D: 400 mètres
  answer: C
  explanation: Vous devez passer des feux de route aux feux de croisement lorsque
    vous vous trouvez à moins de 200 mètres du véhicule que vous suivez.
- id: 101
  category: defensive_driving
  question: Lorsque vous conduisez dans des conditions défavorables comme la pluie,
    la neige ou sur des routes de gravier en Saskatchewan, comment votre distance
    de sécurité doit-elle changer ?
  choices:
    A: Maintenir la règle des 3 secondes
    B: Augmenter à au moins 6 secondes
    C: Diminuer à 2 secondes pour rester proche des traces du véhicule
    D: Augmenter à 4 secondes
  answer: B
  explanation: En Saskatchewan, il est recommandé de doubler votre distance de sécurité
    à au moins six secondes lorsque les conditions ne sont pas idéales, comme sur
    des routes glissantes ou de gravier.
- id: 102
  category: defensive_driving
  question: Pour maintenir un bon « temps d'anticipation visuelle » tout en conduisant
    dans une ville ou une zone résidentielle, à quelle distance devant vous devriez-vous
    balayer du regard ?
  choices:
    A: 5 à 8 secondes
    B: 12 à 15 secondes
    C: 20 à 25 secondes
    D: 30 à 40 secondes
  answer: B
  explanation: Le manuel de la SGI stipule que dans les zones urbaines, vous devriez
    balayer du regard de 12 à 15 secondes devant vous (environ un pâté de maisons
    et demi) pour anticiper les dangers.
- id: 103
  category: defensive_driving
  question: Lorsque vous conduisez sur les autoroutes de la Saskatchewan, quel est
    le temps d'anticipation visuelle recommandé pour balayer la route devant vous
    ?
  choices:
    A: 10 à 12 secondes
    B: 12 à 15 secondes
    C: 20 à 25 secondes
    D: 45 secondes
  answer: C
  explanation: Sur les autoroutes, comme les vitesses sont plus élevées, vous devriez
    balayer du regard de 20 à 25 secondes devant vous pour identifier les dangers
    potentiels le plus tôt possible.
- id: 104
  category: defensive_driving
  question: Selon la loi de la Saskatchewan, à quelle distance d'un véhicule venant
    en sens inverse devez-vous baisser vos feux de route (passer aux feux de croisement)
    ?
  choices:
    A: 100 mètres
    B: 200 mètres
    C: 300 mètres
    D: 500 mètres
  answer: B
  explanation: Les règlements de la Saskatchewan exigent que les conducteurs passent
    aux feux de croisement lorsqu'un véhicule venant en sens inverse se trouve à moins
    de 200 mètres pour éviter d'éblouir l'autre conducteur.
- id: 105
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage (les pneus perdent
    le contact avec la route sur une couche d'eau), quelle est la bonne action de
    conduite préventive ?
  choices:
    A: Freiner brusquement pour regagner de l'adhérence
    B: Accélérer pour fendre l'eau
    C: Passer au point mort et braquer brusquement
    D: Lever le pied de l'accélérateur et maintenir les roues droites
  answer: D
  explanation: En cas d'aquaplanage, vous devez relâcher l'accélérateur et maintenir
    le volant droit. Ne freinez pas avant de sentir que les pneus ont repris contact
    avec la route.
- id: 106
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais en Saskatchewan, quel
    réglage de phares devriez-vous utiliser ?
  choices:
    A: Feux de route
    B: Feux de croisement
    C: Feux de stationnement uniquement
    D: Feux de détresse
  answer: B
  explanation: Les feux de croisement doivent être utilisés dans le brouillard. Les
    feux de route se reflètent sur les particules de brouillard, créant un effet de
    « mur blanc » qui réduit encore davantage la visibilité.
- id: 107
  category: defensive_driving
  question: Si un gros animal comme un cerf ou un orignal surgit soudainement devant
    votre véhicule sur une autoroute de la Saskatchewan, quelle est la réaction la
    plus sûre ?
  choices:
    A: Dévier brusquement vers le fossé
    B: Dévier brusquement vers la voie inverse
    C: Freiner fermement et rester dans votre voie
    D: Accélérer pour minimiser le temps d'impact
  answer: C
  explanation: La SGI conseille aux conducteurs de freiner fermement et de rester
    dans leur voie. Dévier brusquement peut entraîner un capotage plus grave ou une
    collision frontale avec un autre véhicule.
- id: 108
  category: defensive_driving
  question: Quel est le principal danger de la « glace noire » sur les routes de la
    Saskatchewan pendant l'hiver ?
  choices:
    A: Elle est épaisse et facile à voir
    B: Elle ne se forme que sur les routes de gravier
    C: C'est une couche de glace mince et presque invisible qui ressemble à de la
      chaussée mouillée
    D: Elle ne se produit que lorsque les températures sont au-dessus du point de
      congélation
  answer: C
  explanation: La glace noire est particulièrement dangereuse car elle est transparente
    et ressemble à une plaque mouillée inoffensive sur la route, offrant une adhérence
    quasi nulle.
- id: 109
  category: defensive_driving
  question: À quelle fréquence devriez-vous vérifier vos rétroviseurs dans le cadre
    d'un bon balayage visuel de conduite préventive ?
  choices:
    A: Toutes les 5 à 10 secondes
    B: Toutes les 30 secondes
    C: Uniquement lorsque vous êtes sur le point de tourner
    D: Une fois par minute
  answer: A
  explanation: Un bon conducteur préventif vérifie ses rétroviseurs toutes les 5 à
    10 secondes pour maintenir une conscience à 360 degrés de la circulation qui l'entoure.
- id: 110
  category: defensive_driving
  question: Lorsque vous abordez un virage, quel est le meilleur moment pour ajuster
    votre vitesse ?
  choices:
    A: Pendant que vous êtes au milieu du virage
    B: Avant d'entrer dans le virage
    C: Au moment où vous sortez du virage
    D: Uniquement si vous sentez les pneus glisser
  answer: B
  explanation: Pour maintenir la stabilité, vous devriez ralentir à une vitesse sûre
    avant d'entrer dans un virage, puis accélérer légèrement à la sortie.
- id: 111
  category: defensive_driving
  question: Lors de la conduite en hiver en Saskatchewan, pourquoi est-il important
    de garder votre réservoir de carburant au moins à moitié plein ?
  choices:
    A: Pour augmenter le poids du véhicule et obtenir une meilleure traction
    B: Pour empêcher la conduite de carburant de geler et pour fournir de la chaleur
      si vous vous retrouvez bloqué
    C: Pour améliorer l'aérodynamisme du véhicule dans la neige
    D: C'est une exigence de la loi de la Saskatchewan
  answer: B
  explanation: Garder un réservoir plus rempli réduit l'accumulation d'humidité dans
    le système de carburant (empêchant le gel) et garantit que vous avez assez de
    carburant pour faire tourner le moteur afin de vous chauffer si vous êtes coincé
    dans une tempête.
- id: 112
  category: defensive_driving
  question: Dans des conditions de conduite idéales, quelle est la distance de suivi
    minimale recommandée par le Guide de l'automobiliste de la Saskatchewan ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 3 secondes
    D: 5 secondes
  answer: C
  explanation: Le Guide de l'automobiliste de la Saskatchewan recommande une distance
    de suivi minimale de trois secondes dans des conditions idéales pour permettre
    d'avoir suffisamment de temps pour réagir à un arrêt soudain.
- id: 113
  category: defensive_driving
  question: Lorsque vous conduisez dans des zones urbaines (villes ou municipalités),
    à quelle distance devant vous devriez-vous scruter la route pour détecter les
    dangers potentiels ?
  choices:
    A: 5 secondes
    B: 12 secondes
    C: 20 secondes
    D: 30 secondes
  answer: B
  explanation: En ville, vous devriez scruter environ 12 secondes devant vous (soit
    environ un pâté de maisons) pour anticiper les changements de circulation et les
    dangers.
- id: 114
  category: defensive_driving
  question: Lorsque vous conduisez sur une autoroute, quelle est la distance de balayage
    visuel recommandée pour identifier tôt les dangers potentiels ?
  choices:
    A: 10 à 12 secondes
    B: 15 à 18 secondes
    C: 20 à 25 secondes
    D: 40 à 45 secondes
  answer: C
  explanation: Sur les autoroutes, les vitesses plus élevées nécessitent une distance
    de balayage plus longue, soit de 20 à 25 secondes devant vous, pour vous assurer
    d'avoir suffisamment de temps pour réagir aux obstacles.
- id: 115
  category: defensive_driving
  question: 'Lorsque vous suivez un autre véhicule la nuit, vous devez passer à vos
    feux de croisement (codes) lorsque vous êtes à moins de :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: Vous devez passer de vos feux de route aux feux de croisement lorsque
    vous suivez un autre véhicule à moins de 100 mètres pour éviter d'éblouir le conducteur
    dans son rétroviseur.
- id: 116
  category: defensive_driving
  question: Lorsque vous dépassez un véhicule d'urgence, une dépanneuse ou un véhicule
    de service arrêté sur l'autoroute avec ses gyrophares allumés, quelle est la vitesse
    maximale autorisée ?
  choices:
    A: 40 km/h
    B: 60 km/h
    C: 80 km/h
    D: La limite de vitesse affichée
  answer: B
  explanation: En Saskatchewan, les conducteurs doivent ralentir à 60 km/h lorsqu'ils
    dépassent des véhicules d'urgence, des dépanneuses ou des travailleurs de la voirie
    avec des feux clignotants sur les autoroutes où la limite de vitesse est supérieure
    à 60 km/h.
- id: 117
  category: defensive_driving
  question: Sauf indication contraire, quelle est la limite de vitesse maximale sur
    une route provinciale en gravier en Saskatchewan ?
  choices:
    A: 60 km/h
    B: 80 km/h
    C: 90 km/h
    D: 100 km/h
  answer: B
  explanation: La limite de vitesse par défaut pour les routes provinciales en gravier
    en Saskatchewan est de 80 km/h, à moins que des panneaux n'indiquent le contraire.
- id: 118
  category: defensive_driving
  question: Lorsque vous conduisez sur des routes de gravier, quel danger spécifique
    devez-vous anticiper en suivant ou en dépassant un autre véhicule ?
  choices:
    A: La glace noire
    B: Des nuages de poussière réduisant la visibilité
    C: L'aquaplanage
    D: Une adhérence accrue des pneus
  answer: B
  explanation: Les nuages de poussière sont un danger majeur sur les routes de gravier
    de la Saskatchewan ; ils peuvent masquer complètement votre vision et cacher la
    circulation venant en sens inverse ou d'autres dangers.
- id: 119
  category: defensive_driving
  question: Par temps de brouillard épais, quelle configuration d'éclairage est la
    plus efficace pour la sécurité ?
  choices:
    A: Les feux de route (pleins phares)
    B: Les feux de croisement (codes)
    C: Les feux de stationnement uniquement
    D: Les feux de détresse uniquement
  answer: B
  explanation: Les feux de croisement doivent être utilisés dans le brouillard. Les
    feux de route se reflètent sur les gouttelettes de brouillard, créant un effet
    de « mur blanc » qui réduit encore davantage la visibilité.
- id: 120
  category: defensive_driving
  question: Lorsque vous conduisez sur une autoroute avec une limite de vitesse de
    100 km/h ou plus, à quelle fréquence la SGI recommande-t-elle de faire une pause
    pour prévenir la fatigue ?
  choices:
    A: Toutes les heures
    B: Toutes les deux heures ou tous les 200 km
    C: Toutes les quatre heures
    D: Seulement quand vous vous sentez somnolent
  answer: B
  explanation: Pour prévenir la fatigue du conducteur et l'hypnose de la route, il
    est recommandé de s'arrêter pour une pause toutes les deux heures ou tous les
    200 kilomètres.
- id: 121
  category: defensive_driving
  question: À l'approche d'un virage, quand devez-vous ajuster votre vitesse ?
  choices:
    A: Avant d'entrer dans le virage
    B: Au milieu du virage
    C: Juste au moment de sortir du virage
    D: Seulement si vous sentez les pneus glisser
  answer: A
  explanation: Vous devriez ralentir à une vitesse sécuritaire avant d'entrer dans
    un virage. Freiner pendant le virage peut provoquer un dérapage du véhicule.
- id: 122
  category: defensive_driving
  question: Quelle est la meilleure façon de vérifier vos angles morts avant de changer
    de voie ?
  choices:
    A: Vérifier le rétroviseur intérieur
    B: Vérifier les rétroviseurs extérieurs
    C: Tourner la tête et regarder par-dessus votre épaule
    D: Se fier au système de surveillance des angles morts de votre véhicule
  answer: C
  explanation: Les rétroviseurs ne montrent pas tout. Une vérification par-dessus
    l'épaule (tourner la tête pour regarder par les vitres latérales) est le seul
    moyen de s'assurer que votre angle mort est libre avant de changer de voie.
- id: 123
  category: alcohol_drugs_health
  question: En Saskatchewan, à quel taux d'alcoolémie (BAC) un conducteur expérimenté
    (non-GDL) s'expose-t-il à une suspension immédiate de son permis sur le bord de
    la route pour une première infraction ?
  choices:
    A: 0,02
    B: 0,04
    C: 0,05
    D: 0,08
  answer: B
  explanation: En Saskatchewan, les conducteurs expérimentés font l'objet d'une suspension
    immédiate sur le bord de la route si leur taux d'alcoolémie (BAC) est de 0,04
    ou plus. Ce seuil est inférieur à la limite de 0,08 fixée par le Code criminel
    fédéral.
- id: 124
  category: alcohol_drugs_health
  question: Pour la première suspension sur le bord de la route d'un conducteur expérimenté
    (taux d'alcoolémie de 0,04 à 0,08), pendant combien de temps le véhicule est-il
    mis en fourrière ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: Une première suspension sur le bord de la route pour un conducteur
    expérimenté (taux d'alcoolémie de 0,04 à 0,08) entraîne une mise en fourrière
    immédiate du véhicule pour une durée de 3 jours.
- id: 125
  category: alcohol_drugs_health
  question: Quelle est la loi de la Saskatchewan concernant la présence de THC (cannabis)
    dans l'organisme d'un conducteur ?
  choices:
    A: Les conducteurs sont autorisés à avoir jusqu'à 2 nanogrammes de THC.
    B: Les conducteurs sont autorisés à avoir jusqu'à 5 nanogrammes de THC.
    C: La Saskatchewan a une politique de tolérance zéro pour le THC pour tous les
      conducteurs.
    D: Seuls les conducteurs du programme GDL sont soumis à une politique de tolérance
      zéro pour le THC.
  answer: C
  explanation: La Saskatchewan applique une politique de tolérance zéro pour les facultés
    affaiblies par la drogue, y compris le THC, pour tous les conducteurs. Toute quantité
    détectable d'une drogue interdite sur un appareil de dépistage salivaire entraîne
    des sanctions immédiates.
- id: 126
  category: alcohol_drugs_health
  question: Si un conducteur est reconnu coupable d'une infraction au Code criminel
    pour avoir un taux d'alcoolémie supérieur à 0,08, quelle est la période minimale
    obligatoire d'utilisation d'un antidémarreur avec éthylomètre pour une première
    infraction en Saskatchewan ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 1 an
    D: 2 ans
  answer: C
  explanation: Pour une première condamnation en vertu du Code criminel (taux d'alcoolémie
    supérieur à 0,08), la loi de la Saskatchewan exige une période obligatoire d'un
    an d'utilisation d'un antidémarreur avec éthylomètre après l'interdiction initiale
    ordonnée par le tribunal.
- id: 127
  category: alcohol_drugs_health
  question: Si un conducteur refuse de fournir un échantillon d'haleine à un agent
    de police, quelles sont les conséquences en Saskatchewan ?
  choices:
    A: Une suspension de 24 heures seulement.
    B: Une amende de 500 $ et aucune suspension de permis.
    C: Les mêmes sanctions que pour un taux d'alcoolémie supérieur à 0,08 ou pour
      conduite avec facultés affaiblies.
    D: Un avertissement pour le premier refus.
  answer: C
  explanation: Le refus de fournir un échantillon d'haleine ou de sang est une infraction
    au Code criminel et entraîne les mêmes sanctions que la conduite avec un taux
    d'alcoolémie supérieur à 0,08, y compris la suspension immédiate du permis et
    la mise en fourrière du véhicule.
- id: 128
  category: alcohol_drugs_health
  question: Selon la loi de la Saskatchewan, qui est responsable de signaler à la
    SGI un problème de santé susceptible d'affecter la capacité de conduire ?
  choices:
    A: Uniquement le médecin du conducteur.
    B: Uniquement l'optométriste du conducteur.
    C: Le conducteur lui-même.
    D: La police.
  answer: C
  explanation: Bien que les professionnels de la santé puissent signaler des problèmes
    de santé, le conducteur est légalement responsable d'informer la SGI de tout problème
    médical (comme l'épilepsie, le diabète ou des problèmes cardiaques) qui pourrait
    affecter sa capacité à conduire un véhicule en toute sécurité.
- id: 129
  category: alcohol_drugs_health
  question: Quel est le programme d'éducation obligatoire pour une première suspension
    d'alcool sur le bord de la route en Saskatchewan ?
  choices:
    A: Cours DWI (Conduite sans facultés affaiblies)
    B: Programme ADED (Éducation sur l'alcool et les drogues)
    C: Séminaire de sécurité de la SGI
    D: Cours de conduite préventive
  answer: A
  explanation: Les conducteurs qui reçoivent une suspension sur le bord de la route
    pour alcool doivent suivre le cours de conduite sans facultés affaiblies (DWI).
- id: 130
  category: alcohol_drugs_health
  question: En Saskatchewan, où est-il légal pour un passager de consommer de l'alcool
    à l'intérieur d'un véhicule à moteur ?
  choices:
    A: Sur le siège arrière uniquement.
    B: Dans une autocaravane lorsqu'elle est utilisée comme résidence et qu'elle est
      stationnée.
    C: Sur le siège avant si le conducteur ne boit pas.
    D: Il n'est jamais légal pour un passager de consommer de l'alcool dans un véhicule.
  answer: B
  explanation: Il est illégal de consommer de l'alcool dans un véhicule. La seule
    exception concerne une autocaravane utilisée comme résidence lorsqu'elle est légalement
    stationnée en dehors d'une voie publique.
- id: 131
  category: alcohol_drugs_health
  question: Si un conducteur expérimenté reçoit une deuxième suspension immédiate
    (taux d'alcoolémie [BAC] de 0,04 à 0,08) en l'espace de cinq ans, quelle est la
    durée de la suspension du permis ?
  choices:
    A: 3 jours
    B: 7 jours
    C: 21 jours
    D: 90 jours
  answer: C
  explanation: Une deuxième suspension immédiate pour un conducteur expérimenté sur
    une période de cinq ans entraîne une suspension de permis de 21 jours.
- id: 132
  category: alcohol_drugs_health
  question: À quel taux d'alcoolémie (BAC) un conducteur s'expose-t-il aux sanctions
    les plus sévères du Code criminel, y compris des amendes obligatoires plus élevées
    ?
  choices:
    A: 0,08
    B: 0,12
    C: 0,16
    D: 0,20
  answer: C
  explanation: Bien que 0,08 soit la limite légale, un taux d'alcoolémie de 0,16 ou
    plus est considéré comme une circonstance aggravante qui déclenche des amendes
    minimales obligatoires et des sanctions nettement plus élevées en vertu du Code
    criminel.
- id: 133
  category: alcohol_drugs_health
  question: 'Si vous prenez un médicament sur ordonnance et que vous n''êtes pas certain
    qu''il affectera votre conduite, vous devriez :'
  choices:
    A: Conduire uniquement pendant les heures de clarté.
    B: Conduire plus lentement que la limite de vitesse.
    C: Consulter votre médecin ou votre pharmacien avant de conduire.
    D: Attendre une heure après avoir pris le médicament avant de conduire.
  answer: C
  explanation: De nombreux médicaments sur ordonnance et en vente libre peuvent provoquer
    de la somnolence ou altérer le jugement. Vous devez consulter un professionnel
    de la santé pour vous assurer que vous pouvez conduire en toute sécurité.
- id: 134
  category: alcohol_drugs_health
  question: Lequel des éléments suivants est un facteur aggravant entraînant une mise
    en fourrière plus longue du véhicule lors d'une suspension immédiate en Saskatchewan
    ?
  choices:
    A: Conduire de nuit.
    B: Avoir un passager de moins de 16 ans dans le véhicule.
    C: Conduire un véhicule commercial.
    D: Conduire sur une route de gravier.
  answer: B
  explanation: Si un conducteur est intercepté avec un taux d'alcoolémie dans la zone
    de suspension (ou sous l'effet de drogues) et qu'il a un passager de moins de
    16 ans dans le véhicule, la période de mise en fourrière du véhicule est augmentée
    (par exemple, 7 jours pour une première infraction au lieu de 3).
- id: 135
  category: alcohol_drugs_health
  question: Quelle est la durée de la mise en fourrière immédiate du véhicule pour
    tout conducteur dont le test de dépistage de drogue est positif pour la première
    fois ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: Un premier échec au test de dépistage de drogue sur la route entraîne
    une mise en fourrière immédiate du véhicule de 3 jours, similaire à la sanction
    pour un taux d'alcoolémie de 0,04 pour les conducteurs expérimentés.
- id: 136
  category: alcohol_drugs_health
  question: Si un conducteur est tenu de participer au programme d'antidémarreur éthylométrique
    mais qu'il est surpris à conduire un véhicule non équipé de ce dispositif, quelle
    est la sanction ?
  choices:
    A: Un avertissement verbal.
    B: Une amende de 100 $.
    C: Le véhicule est mis en fourrière et le conducteur s'expose à une suspension
      supplémentaire et à des poursuites.
    D: Il doit recommencer le programme de permis de conduire progressif (GDL) depuis
      le début.
  answer: C
  explanation: Conduire un véhicule non équipé d'un antidémarreur éthylométrique alors
    que cela est requis est une infraction grave. Le véhicule sera mis en fourrière
    et le conducteur s'expose à des poursuites criminelles pour conduite pendant une
    interdiction ou une disqualification.
- id: 137
  category: alcohol_drugs_health
  question: Quelle est la limite légale de la Saskatchewan pour le THC (le principe
    actif du cannabis) dans l'organisme d'un conducteur ?
  choices:
    A: 2 nanogrammes par millilitre
    B: 5 nanogrammes par millilitre
    C: Tolérance zéro
    D: 10 nanogrammes par millilitre
  answer: C
  explanation: La Saskatchewan applique une politique de tolérance zéro pour les facultés
    affaiblies par la drogue. Aucun conducteur n'est autorisé à avoir une quantité
    décelable de certaines drogues, y compris le THC, dans son organisme lorsqu'il
    conduit un véhicule.
- id: 138
  category: alcohol_drugs_health
  question: Pour une première infraction d'un conducteur expérimenté ayant un taux
    d'alcoolémie (BAC) compris entre 0,04 et 0,08, pendant combien de temps le véhicule
    est-il mis en fourrière ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: Pour une première infraction où un conducteur expérimenté a un taux
    d'alcoolémie entre 0,04 et 0,08, le véhicule est mis en fourrière pendant 3 jours.
- id: 139
  category: alcohol_drugs_health
  question: Si un conducteur refuse de fournir un échantillon d'haleine ou de fluide
    oral à la demande légale d'un agent de la paix, quelles sont les conséquences
    ?
  choices:
    A: Une suspension de 24 heures seulement
    B: Une petite amende et 1 point sur l'échelle du SDR
    C: Les mêmes sanctions que pour un taux d'alcoolémie supérieur à 0,08 (infraction
      au Code criminel)
    D: Aucune sanction s'il s'agit de la première fois que le conducteur est arrêté
  answer: C
  explanation: Le refus de fournir un échantillon d'haleine, de sang ou de fluide
    oral est une infraction au Code criminel et entraîne les mêmes sanctions que la
    conduite avec un taux d'alcoolémie supérieur à 0,08.
- id: 140
  category: alcohol_drugs_health
  question: En Saskatchewan, quand le programme d'antidémarreur éthylométrique est-il
    obligatoire pour un conducteur ?
  choices:
    A: Seulement après la troisième condamnation pour conduite avec facultés affaiblies
    B: Pour tous les conducteurs condamnés pour une infraction de conduite avec facultés
      affaiblies en vertu du Code criminel
    C: Seulement si le taux d'alcoolémie du conducteur était supérieur à 0,15
    D: Seulement si le conducteur a moins de 21 ans
  answer: B
  explanation: Le programme d'antidémarreur éthylométrique est obligatoire pour tous
    les conducteurs condamnés pour une infraction de conduite avec facultés affaiblies
    en vertu du Code criminel en Saskatchewan.
- id: 141
  category: alcohol_drugs_health
  question: Si vous prenez des médicaments sur ordonnance qui provoquent de la somnolence,
    quelle est la mesure la plus sûre à prendre ?
  choices:
    A: Conduire uniquement sur des routes familières
    B: Boire du café pour rester vigilant avant de conduire
    C: Ne pas conduire de véhicule à moteur
    D: Conduire uniquement pendant la journée
  answer: C
  explanation: Si un médicament provoque des effets secondaires tels que la somnolence
    ou des étourdissements, vous ne devez pas conduire, car cela nuit à votre capacité
    à utiliser le véhicule en toute sécurité.
- id: 142
  category: alcohol_drugs_health
  question: Pour la deuxième infraction d'un conducteur expérimenté en cinq ans pour
    un taux d'alcoolémie (BAC) compris entre 0,04 et 0,08, quelle est la durée de
    la suspension immédiate du permis de conduire ?
  choices:
    A: 3 jours
    B: 7 jours
    C: 21 jours
    D: 90 jours
  answer: C
  explanation: Une deuxième infraction en cinq ans pour un conducteur expérimenté
    ayant un taux d'alcoolémie (BAC) compris entre 0,04 et 0,08 entraîne une suspension
    immédiate du permis de conduire de 21 jours.
- id: 143
  category: alcohol_drugs_health
  question: Quel programme d'éducation un conducteur expérimenté doit-il suivre après
    sa première suspension immédiate pour un taux d'alcoolémie (BAC) compris entre
    0,04 et 0,08 ?
  choices:
    A: Éducation routière au secondaire
    B: Cours de conduite sans facultés affaiblies (DWI)
    C: Cours d'éducation sur l'alcool et les drogues (ADE)
    D: Cours de conduite préventive
  answer: B
  explanation: Un conducteur expérimenté doit suivre le cours de conduite sans facultés
    affaiblies (DWI) après sa première suspension immédiate (taux d'alcoolémie de
    0,04 à 0,08).
- id: 144
  category: alcohol_drugs_health
  question: En Saskatchewan, tous les conducteurs de moins de quel âge sont soumis
    à une politique de tolérance zéro pour l'alcool et les drogues, quelle que soit
    la classe de leur permis ?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: La loi de la Saskatchewan impose une politique de tolérance zéro pour
    l'alcool et les drogues pour tous les conducteurs de moins de 21 ans.
- id: 145
  category: alcohol_drugs_health
  question: Quelle méthode la police de la Saskatchewan utilise-t-elle pour le dépistage
    de drogues sur la route ?
  choices:
    A: Test de dilatation des pupilles
    B: Test de fluide oral (salive)
    C: Prélèvement sanguin obligatoire
    D: Test de follicule pileux
  answer: B
  explanation: La police de la Saskatchewan utilise des appareils de dépistage de
    fluide oral (salive) approuvés par le gouvernement fédéral pour détecter la présence
    de drogues comme le THC et la cocaïne sur la route.
- id: 146
  category: alcohol_drugs_health
  question: Dans le cadre du programme de reconnaissance des bons conducteurs (SDR),
    quel est le montant de la pénalité financière pour une condamnation pour conduite
    avec facultés affaiblies en vertu du Code criminel ?
  choices:
    A: 500 $
    B: 1 250 $
    C: 2 250 $
    D: 5 000 $
  answer: B
  explanation: Une condamnation en vertu du Code criminel pour conduite avec facultés
    affaiblies entraîne une pénalité financière de 1 250 $ dans le cadre du programme
    de reconnaissance des bons conducteurs (SDR).
- id: 147
  category: alcohol_drugs_health
  question: Quelle est l'acuité visuelle minimale requise (avec ou sans lentilles
    correctrices) pour détenir un permis de classe 5 standard en Saskatchewan ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Pour être admissible à un permis de classe 5 en Saskatchewan, un conducteur
    doit avoir une acuité visuelle minimale de 20/40 pour les deux yeux combinés,
    avec ou sans lentilles correctrices.
- id: 148
  category: alcohol_drugs_health
  question: Si un conducteur est reconnu coupable de conduite avec facultés affaiblies
    par une combinaison d'alcool et de drogues, comment l'infraction est-elle traitée
    selon la loi de la Saskatchewan ?
  choices:
    A: Le conducteur n'est inculpé que pour la substance ayant la concentration la
      plus élevée
    B: Elle est traitée comme une infraction mineure sur la route
    C: Il s'agit d'une infraction au Code criminel assortie des mêmes sanctions sévères
      qu'un taux d'alcoolémie supérieur à 0,08
    D: Le conducteur reçoit un avertissement pour la première fois
  answer: C
  explanation: La conduite avec facultés affaiblies par une combinaison d'alcool et
    de drogues est une infraction au Code criminel et entraîne les mêmes sanctions
    sévères que les autres accusations de conduite avec facultés affaiblies.
- id: 149
  category: penalties_and_points
  question: Dans le cadre du programme de reconnaissance des bons conducteurs (SDR)
    de la Saskatchewan, combien de points sont déduits de votre dossier pour une condamnation
    pour excès de vitesse de 35 km/h au-dessus de la limite affichée ?
  choices:
    A: 1 point
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Selon le barème de points du SDR, un excès de vitesse compris entre
    31 km/h et 50 km/h au-dessus de la limite entraîne une déduction de 4 points.
- id: 150
  category: penalties_and_points
  question: Pour un conducteur expérimenté (21 ans ou plus), quelle est la durée de
    la suspension immédiate du permis de conduire pour une première infraction avec
    un taux d'alcoolémie (BAC) compris entre 0,04 et 0,08 ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: Les conducteurs expérimentés dont le taux d'alcoolémie (BAC) se situe
    entre 0,04 et 0,08 pour la première fois font l'objet d'une suspension immédiate
    de permis de 3 jours sur la route.
- id: 151
  category: penalties_and_points
  question: Si un conducteur est pris en train de faire des cascades ou des courses
    de rue en Saskatchewan, pendant combien de temps le véhicule sera-t-il immédiatement
    mis en fourrière ?
  choices:
    A: 3 jours
    B: 7 jours
    C: 15 jours
    D: 30 jours
  answer: D
  explanation: La loi de la Saskatchewan impose une mise en fourrière immédiate du
    véhicule de 30 jours pour les conducteurs pris en train de faire des cascades
    ou des courses de rue.
- id: 152
  category: penalties_and_points
  question: Combien de points sont déduits de la cote du programme de reconnaissance
    des bons conducteurs (SDR) d'un conducteur s'il ne s'arrête pas pour un autobus
    scolaire dont les feux clignotent et le bras d'arrêt est déployé ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Le fait de ne pas s'arrêter pour un autobus scolaire entraîne une déduction
    de 4 points dans le cadre du programme SDR.
- id: 153
  category: penalties_and_points
  question: Dans le cadre du Programme d'amélioration des conducteurs (DIP), à partir
    de quel seuil de points le permis d'un conducteur expérimenté sera-t-il suspendu
    ?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: Dans le cadre du Programme d'amélioration des conducteurs de la Saskatchewan,
    l'atteinte de 12 points d'inaptitude sur une période de 2 ans entraîne une suspension
    de permis.
- id: 154
  category: penalties_and_points
  question: Si vous êtes pris à conduire alors que votre permis est suspendu, le véhicule
    que vous conduisez sera mis en fourrière pendant combien de jours ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: Conduire pendant une suspension de permis entraîne une mise en fourrière
    automatique du véhicule de 30 jours en Saskatchewan.
- id: 155
  category: penalties_and_points
  question: En Saskatchewan, quelle est l'amende standard pour un conducteur qui est
    pris sans ceinture de sécurité ?
  choices:
    A: 100 $
    B: 150 $
    C: 175 $
    D: 280 $
  answer: C
  explanation: L'amende pour ne pas porter de ceinture de sécurité en Saskatchewan
    est de 175 $.
- id: 156
  category: penalties_and_points
  question: Quelle est la sanction immédiate sur la route pour une deuxième infraction
    de conduite distraite en un an, en plus de l'amende ?
  choices:
    A: Une suspension de 24 heures
    B: Une mise en fourrière du véhicule de 7 jours
    C: Une mise en fourrière du véhicule de 30 jours
    D: Une révocation permanente du permis
  answer: B
  explanation: Une deuxième contravention pour conduite distraite en l'espace d'un
    an entraîne une mise en fourrière du véhicule de 7 jours.
- id: 157
  category: penalties_and_points
  question: Quelle est l'amende de base pour excès de vitesse dans une zone de construction
    où des travailleurs sont présents en Saskatchewan ?
  choices:
    A: 100 $
    B: 170 $
    C: 210 $
    D: 300 $
  answer: C
  explanation: L'amende de base pour excès de vitesse dans une zone de travaux en
    présence de travailleurs est de 210 $, plus des frais supplémentaires par km/h
    au-dessus de la limite.
- id: 158
  category: penalties_and_points
  question: Si un conducteur se trouve dans la « zone de pénalité » du programme SDR
    (points négatifs), quel est le montant de la sanction financière pour chaque point
    en dessous de zéro ?
  choices:
    A: 25 $
    B: 50 $
    C: 75 $
    D: 100 $
  answer: B
  explanation: Les conducteurs se trouvant dans la zone de pénalité doivent payer
    50 $ pour chaque point qu'ils ont en dessous de zéro sur l'échelle du programme
    SDR.
- id: 159
  category: penalties_and_points
  question: Si un conducteur expérimenté est accusé d'avoir un taux d'alcoolémie (BAC)
    supérieur à 0,08, pendant combien de temps son permis est-il suspendu immédiatement
    sur la route ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 90 jours
    D: Indéfiniment jusqu'à ce que l'accusation soit résolue
  answer: D
  explanation: En Saskatchewan, un conducteur accusé d'un taux d'alcoolémie supérieur
    à 0,08 fait face à une suspension de permis indéfinie qui dure jusqu'à ce que
    l'accusation criminelle soit résolue devant le tribunal.
- id: 160
  category: penalties_and_points
  question: En Saskatchewan, quelle est l'amende totale pour une première condamnation
    pour conduite distraite ?
  choices:
    A: 280 $
    B: 380 $
    C: 580 $
    D: 1 000 $
  answer: C
  explanation: Selon la loi actuelle de la Saskatchewan, une première infraction pour
    conduite distraite entraîne une amende de 580 $ et quatre points d'inaptitude
    dans le cadre du programme de reconnaissance des bons conducteurs.
- id: 161
  category: penalties_and_points
  question: Dans le cadre du programme de reconnaissance des conducteurs prudents
    (Safe Driver Recognition - SDR), combien de points sont déduits pour une suspension
    immédiate de 24 heures liée à l'alcool ou aux drogues ?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Une suspension immédiate de 24 heures pour facultés affaiblies par
    l'alcool ou la drogue entraîne une déduction de 4 points de votre classement SDR.
- id: 162
  category: penalties_and_points
  question: Si un conducteur est pris pour une deuxième infraction de conduite distraite
    en un an en Saskatchewan, quelle est la peine de mise en fourrière du véhicule
    ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: C
  explanation: Une deuxième infraction de conduite distraite sur une période de 12
    mois entraîne une mise en fourrière immédiate du véhicule pendant sept jours,
    en plus d'une amende de 1 400 $.
- id: 163
  category: penalties_and_points
  question: En Saskatchewan, les excès de vitesse dans une zone scolaire signalée
    entraînent une amende plus élevée. Quelle est l'amende de base pour cette infraction
    ?
  choices:
    A: 100 $
    B: 170 $
    C: 190 $
    D: 240 $
  answer: C
  explanation: Les excès de vitesse dans une zone scolaire commencent par une amende
    de base de 190 $, plus 2 $ pour chaque km/h au-dessus de la limite, plus une surtaxe
    pour les victimes d'actes criminels.
- id: 164
  category: penalties_and_points
  question: Quelle est la période minimale de suspension du permis pour une première
    condamnation en vertu du Code criminel pour conduite avec facultés affaiblies
    en Saskatchewan ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 1 an
    D: 2 ans
  answer: C
  explanation: Une première condamnation en vertu du Code criminel pour conduite avec
    facultés affaiblies entraîne une suspension minimale du permis de conduire d'un
    an.
- id: 165
  category: penalties_and_points
  question: En Saskatchewan, quelle est la période de mise en fourrière immédiate
    du véhicule pour un conducteur accusé de « conduite acrobatique » (stunting) ?
  choices:
    A: 3 jours
    B: 7 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: Les conducteurs accusés de conduite acrobatique ou de courses de rue
    font face à une mise en fourrière immédiate du véhicule de 30 jours.
- id: 166
  category: penalties_and_points
  question: Quel cours un conducteur du programme de permis de conduire progressif
    (GDL) doit-il suivre s'il reçoit sa première suspension immédiate pour alcool
    ou drogue ?
  choices:
    A: Cours de conduite préventive
    B: Cours de conduite sans facultés affaiblies (DWI)
    C: Cours de conduite professionnelle de la SGI
    D: Cours de secourisme général
  answer: B
  explanation: Les conducteurs du GDL qui reçoivent une suspension immédiate pour
    alcool ou drogue doivent suivre le programme d'éducation « Conduite sans facultés
    affaiblies » (Driving Without Impairment - DWI).
- id: 167
  category: penalties_and_points
  question: Quelle est la déduction de points SDR pour une condamnation pour « conduite
    sans le soin et l'attention nécessaires » ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 10 points
  answer: C
  explanation: Une condamnation pour conduite sans le soin et l'attention nécessaires
    entraîne une déduction de 4 points du classement SDR du conducteur.
- id: 168
  category: sharing_the_road
  question: Lorsque vous dépassez un cycliste en Saskatchewan, quelle est la distance
    minimale recommandée que vous devez maintenir entre votre véhicule et le cycliste
    ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 2 mètres
    D: 3 mètres
  answer: B
  explanation: La SGI recommande de laisser au moins un mètre d'espace entre votre
    véhicule et le cycliste pour assurer la sécurité.
- id: 169
  category: sharing_the_road
  question: En Saskatchewan, la « règle des 60 km/h » pour le dépassement de véhicules
    arrêtés avec des feux clignotants s'applique aux véhicules d'urgence, aux dépanneuses
    et à lequel des éléments suivants ?
  choices:
    A: Camions de livraison de courrier
    B: Camions à ordures
    C: Chasse-neige
    D: Autobus scolaires prenant des élèves
  answer: C
  explanation: La limite de vitesse de 60 km/h s'applique lors du dépassement de véhicules
    d'urgence, de dépanneuses et d'équipement de voirie (comme les chasse-neige) arrêtés
    avec leurs avertisseurs lumineux clignotants.
- id: 170
  category: sharing_the_road
  question: Lorsqu'une motocyclette circule devant vous, quelle est la distance de
    suivi minimale que vous devez maintenir dans des conditions idéales ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 3 secondes
    D: 5 secondes
  answer: C
  explanation: La SGI recommande une distance de suivi minimale de trois secondes
    pour tous les véhicules, mais insiste sur ce point pour les motocyclettes car
    elles peuvent s'arrêter très rapidement.
- id: 171
  category: sharing_the_road
  question: Que signifie un symbole de « partage de la route » (un vélo surmonté de
    deux chevrons) peint sur une chaussée de la Saskatchewan ?
  choices:
    A: Une voie réservée exclusivement aux vélos.
    B: Une voie où les automobilistes doivent céder le passage aux piétons uniquement.
    C: Une voie partagée par les automobilistes et les cyclistes.
    D: Une voie cyclable à grande vitesse.
  answer: C
  explanation: Les pictogrammes de partage de la route (sharrows) indiquent que les
    automobilistes et les cyclistes doivent partager la voie. Les cyclistes peuvent
    occuper n'importe quelle partie d'une voie marquée de ces symboles.
- id: 172
  category: sharing_the_road
  question: 'Lorsqu''un gros camion tourne à droite à une intersection, il peut avoir
    besoin de s''élargir vers la gauche. Cela est dû à un phénomène appelé :'
  choices:
    A: Force centrifuge
    B: Déportation (Off-tracking)
    C: Contre-braquage
    D: Angle mort
  answer: B
  explanation: La déportation se produit parce que les roues arrière d'un véhicule
    long suivent une trajectoire plus courte que les roues avant, ce qui oblige le
    conducteur à s'élargir pour ne pas heurter le trottoir.
- id: 173
  category: sharing_the_road
  question: Vous approchez d'une intersection où un piéton utilise une canne blanche.
    Que devez-vous faire ?
  choices:
    A: Klaxonner pour lui signaler votre présence.
    B: Ralentir et le contourner avec prudence.
    C: S'arrêter et rester à l'arrêt jusqu'à ce que le piéton ait traversé toute la
      chaussée en toute sécurité.
    D: Céder le passage uniquement s'il se trouve dans un passage pour piétons marqué.
  answer: C
  explanation: Les conducteurs doivent céder le passage à une personne aveugle ou
    malvoyante qui porte une canne blanche ou qui utilise un chien-guide.
- id: 174
  category: sharing_the_road
  question: 'En Saskatchewan, si un véhicule d''urgence dont la sirène et les gyrophares
    sont activés s''approche de vous par l''arrière sur une rue à deux sens, vous
    devez :'
  choices:
    A: Accélérer pour libérer le passage.
    B: Se ranger sur le bord droit de la route et s'arrêter.
    C: Se ranger sur le bord gauche de la route et s'arrêter.
    D: S'arrêter exactement là où vous vous trouvez.
  answer: B
  explanation: Lorsqu'un véhicule d'urgence s'approche avec ses gyrophares et sa sirène,
    vous devez vous ranger vers la droite le plus loin possible et vous arrêter complètement.
- id: 175
  category: sharing_the_road
  question: Laquelle des affirmations suivantes est vraie concernant les « zones d'ombre
    » (No-Zones) autour des gros camions commerciaux ?
  choices:
    A: Elles se situent uniquement directement derrière le camion.
    B: Ce sont des zones où le conducteur du camion a une visibilité limitée ou nulle.
    C: Ce sont des voies réservées uniquement aux camions.
    D: Elles n'existent que lorsque le camion tourne.
  answer: B
  explanation: Les « No-Zones » sont de grands angles morts situés à l'avant, à l'arrière
    et sur les côtés d'un camion, où le conducteur ne peut pas voir les autres véhicules.
- id: 176
  category: sharing_the_road
  question: En Saskatchewan, à une intersection où il n'y a pas de passages pour piétons
    peints, les piétons sont-ils autorisés à traverser ?
  choices:
    A: Non, ils doivent trouver un passage pour piétons marqué.
    B: Oui, chaque intersection est considérée comme un passage pour piétons « non
      marqué », sauf indication contraire.
    C: Oui, mais seulement s'ils portent des vêtements réfléchissants.
    D: Non, traverser à des intersections non marquées est considéré comme une traversée
      illégale.
  answer: B
  explanation: Selon la loi de la Saskatchewan, chaque intersection est un passage
    pour piétons, qu'il soit marqué par de la peinture ou non, et les conducteurs
    doivent céder le passage aux piétons.
- id: 177
  category: sharing_the_road
  question: Lorsque vous suivez un véhicule d'escorte (véhicule pilote) pour un chargement
    hors normes, que devez-vous faire ?
  choices:
    A: Dépasser le véhicule d'escorte dès que possible.
    B: Suivre les instructions du conducteur du véhicule d'escorte ou les panneaux
      sur le véhicule.
    C: Allumer vos feux de route pour signaler le conducteur.
    D: Conduire le plus près possible pour voir le chargement hors normes.
  answer: B
  explanation: Les véhicules d'escorte sont utilisés pour avertir les automobilistes
    de la présence de chargements hors normes. Les conducteurs doivent être prêts
    à ralentir ou à se ranger selon les instructions du véhicule d'escorte.
- id: 178
  category: sharing_the_road
  question: 'Si vous conduisez une voiture et que vous voulez dépasser une motocyclette,
    vous devriez :'
  choices:
    A: Partager la voie avec la motocyclette pendant le dépassement.
    B: Dépasser de la même manière que vous dépasseriez n'importe quel autre véhicule,
      en utilisant une voie complète.
    C: Klaxonner pour dire au motocycliste de se ranger sur l'accotement.
    D: Dépasser par le côté droit de la motocyclette.
  answer: B
  explanation: Les motocyclettes ont droit à toute la largeur d'une voie. Vous ne
    devez jamais tenter de partager une voie avec une motocyclette lors d'un dépassement.
- id: 179
  category: sharing_the_road
  question: 'En Saskatchewan, un cycliste signalant un virage à droite peut le faire
    en tendant le bras gauche vers le haut à un angle de 90 degrés ou en :'
  choices:
    A: Tendant le bras droit horizontalement vers la droite.
    B: Pointant le sol avec la main gauche.
    C: Agitant les deux bras.
    D: Tendant le bras gauche horizontalement vers la gauche.
  answer: A
  explanation: Les cyclistes peuvent signaler un virage à droite soit en pliant le
    bras gauche vers le haut au niveau du coude, soit en tendant le bras droit horizontalement
    vers la droite.
- id: 180
  category: sharing_the_road
  question: En Saskatchewan, quelle est la distance minimale qu'un véhicule à moteur
    doit maintenir lorsqu'il dépasse un vélo dans une zone de vitesse de 60 km/h ou
    moins ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 1,5 mètre
    D: 2 mètres
  answer: B
  explanation: Les règlements de la Saskatchewan exigent que les conducteurs maintiennent
    une distance minimale de 1 mètre lorsqu'ils dépassent un cycliste dans les zones
    de vitesse de 60 km/h ou moins.
- id: 181
  category: sharing_the_road
  question: Lorsque vous conduisez derrière un gros camion commercial, si vous ne
    voyez pas les rétroviseurs extérieurs du conducteur, qu'est-ce que cela indique
    ?
  choices:
    A: Vous êtes à une distance de sécurité
    B: Le conducteur du camion est sur le point de tourner
    C: Vous êtes dans l'angle mort du camion (No-Zone)
    D: Le camion est trop long
  answer: C
  explanation: 'Une règle générale pour partager la route avec les gros camions est
    la suivante : si vous ne voyez pas les rétroviseurs du conducteur, celui-ci ne
    peut pas vous voir car vous vous trouvez dans son angle mort.'
- id: 182
  category: sharing_the_road
  question: Quelle est la distance de sécurité minimale recommandée lorsque vous suivez
    une motocyclette dans de bonnes conditions météorologiques ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 3 secondes
    D: 5 secondes
  answer: C
  explanation: SGI recommande une distance de sécurité minimale de 3 secondes pour
    les motocyclettes afin de tenir compte de leur capacité à s'arrêter rapidement
    et d'éviter d'être affecté par leur profil plus petit.
- id: 183
  category: sharing_the_road
  question: À une intersection où il n'y a ni passages pour piétons marqués ni lignes
    d'arrêt, quelles sont vos responsabilités envers les piétons ?
  choices:
    A: Les piétons doivent céder le passage aux véhicules
    B: Vous devez céder le passage aux piétons car chaque intersection est considérée
      comme un « passage pour piétons non marqué »
    C: Vous ne vous arrêtez que si un piéton utilise une canne blanche
    D: Vous avez la priorité à moins qu'il n'y ait un panneau « Passage pour piétons
      »
  answer: B
  explanation: En Saskatchewan, les piétons ont la priorité à toutes les intersections,
    que le passage pour piétons soit marqué ou non.
- id: 184
  category: sharing_the_road
  question: La règle « Ralentir à 60 » en Saskatchewan s'applique à quels véhicules
    parmi les suivants lorsqu'ils sont arrêtés sur le bord de la route avec leurs
    feux clignotants ?
  choices:
    A: Véhicules de police et de pompiers uniquement
    B: Ambulances et dépanneuses uniquement
    C: Véhicules de police, de pompiers, ambulances, dépanneuses et véhicules de service
      routier
    D: Tout véhicule dont les feux de détresse sont allumés
  answer: C
  explanation: La loi s'applique à tous les véhicules d'urgence, dépanneuses et véhicules
    de service routier (y compris les chasse-neige) lorsqu'ils sont arrêtés avec leurs
    avertisseurs lumineux activés.
- id: 185
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire fait fonctionner ses feux clignotants ambre
    (jaunes), que doit faire le conducteur ?
  choices:
    A: S'arrêter immédiatement
    B: Se préparer à s'arrêter, car l'autobus est sur le point d'activer ses feux
      clignotants rouges
    C: Accélérer pour dépasser l'autobus avant que les feux ne deviennent rouges
    D: Les ignorer car ils ne servent qu'à avertir les piétons
  answer: B
  explanation: Les feux clignotants ambre sur un autobus scolaire indiquent que l'autobus
    se prépare à s'arrêter pour faire monter ou descendre des passagers ; les conducteurs
    doivent être prêts à s'arrêter.
- id: 186
  category: sharing_the_road
  question: Si un cycliste tend le bras gauche horizontalement sur le côté, quelle
    manœuvre signale-t-il ?
  choices:
    A: Un virage à droite
    B: Un virage à gauche
    C: Un ralentissement ou un arrêt
    D: Céder le passage à la circulation
  answer: B
  explanation: Un cycliste qui tend le bras gauche horizontalement signale un virage
    à gauche, tout comme le signal manuel pour un véhicule à moteur.
- id: 187
  category: sharing_the_road
  question: Pourquoi devriez-vous éviter de vous « faufiler » entre un gros camion
    et le trottoir lorsque le camion s'approche d'une intersection ?
  choices:
    A: Le camion pourrait avoir une défaillance mécanique
    B: Les camions ont souvent besoin de dévier largement vers la gauche pour effectuer
      un virage à droite
    C: Les camions ont la priorité à toutes les intersections
    D: La turbulence de l'air attirera votre voiture vers le camion
  answer: B
  explanation: Les gros camions ont besoin d'un espace supplémentaire pour tourner
    et dévient souvent largement vers la gauche pour effectuer un virage à droite
    ; se faufiler sur la droite peut entraîner une collision.
- id: 188
  category: sharing_the_road
  question: Si vous voyez un piéton portant une canne blanche, qu'est-ce que cela
    signifie ?
  choices:
    A: Le piéton est une personne âgée
    B: Le piéton est malvoyant
    C: Le piéton a la priorité uniquement aux passages pour piétons marqués
    D: Le piéton est un travailleur de la construction routière
  answer: B
  explanation: Une canne blanche indique que le piéton est aveugle ou malvoyant. Les
    conducteurs doivent leur laisser plus d'espace et être prêts à s'arrêter.
- id: 189
  category: sharing_the_road
  question: En Saskatchewan, une motocyclette est-elle autorisée à partager une seule
    voie avec une voiture de tourisme ?
  choices:
    A: Oui, si le conducteur de la voiture en donne l'autorisation
    B: Oui, en cas de circulation dense
    C: Non, une motocyclette a droit à l'utilisation complète d'une voie
    D: Seulement si la motocyclette dépasse par la droite
  answer: C
  explanation: Les motocyclettes ont droit à toute la largeur d'une voie. Aucun autre
    véhicule ne doit être conduit de manière à priver une motocyclette de l'utilisation
    complète d'une voie.
- id: 190
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire est arrêté avec ses feux rouges clignotants
    sur une route divisée par un terre-plein central physique, quelle circulation
    doit s'arrêter ?
  choices:
    A: La circulation dans les deux sens
    B: Seulement la circulation qui suit l'autobus
    C: Seulement la circulation venant de l'avant
    D: Aucune circulation n'est tenue de s'arrêter sur une route divisée
  answer: B
  explanation: Sur une route divisée par un terre-plein central physique, seule la
    circulation circulant dans la même direction que l'autobus scolaire est tenue
    de s'arrêter pour ses feux rouges clignotants.
- id: 191
  category: sharing_the_road
  question: Lorsque vous approchez d'un chasse-neige sur une autoroute de la Saskatchewan
    dont les feux ambre et rouges clignotent, quelle est la vitesse maximale à laquelle
    vous pouvez le dépasser ?
  choices:
    A: 30 km/h
    B: 60 km/h
    C: 80 km/h
    D: La limite de vitesse affichée
  answer: B
  explanation: Les chasse-neige sont considérés comme des véhicules de service de
    voirie. Lorsque leurs feux clignotent, vous devez ralentir à 60 km/h pour les
    dépasser.
- id: 192
  category: vehicle_information
  question: En Saskatchewan, quelle est la profondeur de sculpture minimale légale
    pour les pneus d'un véhicule de tourisme ?
  choices:
    A: 1,0 mm (1/25 pouce)
    B: 1,6 mm (2/32 pouce)
    C: 2,5 mm (3/32 pouce)
    D: 3,2 mm (4/32 pouce)
  answer: B
  explanation: Selon les règlements sur l'équipement des véhicules de la Saskatchewan,
    les pneus doivent avoir une profondeur de sculpture d'au moins 1,6 mm. Les pneus
    usés en dessous de cette limite sont dangereux et illégaux.
- id: 193
  category: vehicle_information
  question: Selon la loi de la Saskatchewan, les phares de votre véhicule doivent
    être assez puissants pour révéler des objets à quelle distance minimale ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 250 mètres
  answer: B
  explanation: Les feux de route (pleins phares) doivent être capables de révéler
    une personne ou un véhicule à une distance d'au moins 150 mètres devant.
- id: 194
  category: vehicle_information
  question: Quelle est la réglementation de la Saskatchewan concernant la teinte des
    vitres latérales avant (conducteur et passager avant) ?
  choices:
    A: La teinte est autorisée jusqu'à 35 % de transmission lumineuse
    B: La teinte est autorisée jusqu'à 50 % de transmission lumineuse
    C: Aucun film teinté après-vente n'est autorisé sur ces vitres
    D: La teinte est autorisée uniquement si le conducteur possède une note médicale
  answer: C
  explanation: En Saskatchewan, il est illégal d'appliquer tout film teinté après-vente
    sur le pare-brise ou les vitres latérales avant.
- id: 195
  category: vehicle_information
  question: Lorsque vous conduisez de nuit en Saskatchewan, à quelle distance d'un
    véhicule venant en sens inverse devez-vous passer des feux de route aux feux de
    croisement ?
  choices:
    A: 100 mètres
    B: 200 mètres
    C: 300 mètres
    D: 500 mètres
  answer: C
  explanation: Le Guide du conducteur de la Saskatchewan stipule que vous devez passer
    en feux de croisement au moins 300 mètres avant de croiser un véhicule venant
    en sens inverse.
- id: 196
  category: vehicle_information
  question: Lorsque vous suivez un autre véhicule de nuit, à quelle distance devez-vous
    passer des feux de route aux feux de croisement ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 200 mètres
    D: 300 mètres
  answer: C
  explanation: Vous devez passer en feux de croisement lorsque vous suivez un autre
    véhicule à moins de 200 mètres pour éviter d'éblouir le conducteur devant vous
    via ses rétroviseurs.
- id: 197
  category: vehicle_information
  question: 'Tout véhicule à moteur en Saskatchewan doit être équipé d''un klaxon
    pouvant être entendu d''une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Les règlements de la Saskatchewan exigent un klaxon capable d'émettre
    un son audible dans des conditions normales à une distance d'au moins 60 mètres.
- id: 198
  category: vehicle_information
  question: En Saskatchewan, les feux de freinage doivent être visibles d'une distance
    d'au moins ____ en plein soleil.
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 120 mètres
  answer: B
  explanation: Les feux de freinage doivent être rouges et clairement visibles à une
    distance de 60 mètres en plein soleil.
- id: 199
  category: vehicle_information
  question: Si le rétroviseur intérieur de votre véhicule est obstrué par un chargement
    ou une remorque, quelle est l'exigence légale pour les rétroviseurs latéraux ?
  choices:
    A: Seul un rétroviseur côté conducteur est requis
    B: Seul un rétroviseur côté passager est requis
    C: Les rétroviseurs extérieurs gauche et droit sont tous deux requis
    D: Aucun rétroviseur n'est requis si vous utilisez un signaleur
  answer: C
  explanation: Si la vue vers l'arrière est obstruée, le véhicule doit être équipé
    de rétroviseurs sur les côtés gauche et droit pour offrir au conducteur une vue
    dégagée de la route vers l'arrière.
- id: 200
  category: vehicle_information
  question: De quelle couleur doit être le feu qui éclaire la plaque d'immatriculation
    arrière d'un véhicule en Saskatchewan ?
  choices:
    A: Rouge
    B: Bleu
    C: Blanc
    D: Ambre
  answer: C
  explanation: La plaque d'immatriculation arrière doit être éclairée par un feu blanc
    afin que la plaque soit clairement visible à une distance de 15 mètres vers l'arrière.
- id: 201
  category: vehicle_information
  question: Quand les garde-boue sont-ils obligatoires sur un véhicule en Saskatchewan
    ?
  choices:
    A: Uniquement sur les camions commerciaux de plus de 5 000 kg
    B: Uniquement pendant les mois d'hiver (d'octobre à avril)
    C: Lorsque la carrosserie du véhicule ne fournit pas une protection adéquate pour
      empêcher les roues arrière de projeter de la saleté ou de l'eau
    D: Ils ne sont jamais légalement requis pour les voitures de tourisme
  answer: C
  explanation: La loi de la Saskatchewan exige des garde-boue ou des ailes suffisamment
    larges pour couvrir toute la bande de roulement du pneu afin d'empêcher la projection
    de débris sur les autres véhicules.
- id: 202
  category: vehicle_information
  question: Lors du remorquage d'une remorque en Saskatchewan, de quelle manière les
    chaînes de sécurité doivent-elles être fixées ?
  choices:
    A: Enroulées étroitement autour du pare-chocs
    B: Connectées de manière « croisée » sous le timon
    C: Connectées uniquement au côté gauche de l'attelage
    D: Les chaînes ne sont nécessaires que si la remorque n'a pas de freins
  answer: B
  explanation: Les chaînes de sécurité doivent être croisées sous le timon de la remorque
    pour empêcher celui-ci de tomber au sol en cas de défaillance de l'attelage principal.
- id: 203
  category: vehicle_information
  question: Selon les normes fédérales canadiennes adoptées en Saskatchewan, tous
    les véhicules fabriqués après quelle année doivent-ils être équipés de feux de
    jour automatiques ?
  choices:
    A: '1980'
    B: '1985'
    C: '1989'
    D: '1995'
  answer: C
  explanation: La loi fédérale au Canada exige que tous les véhicules fabriqués ou
    importés après le 1er décembre 1989 soient équipés de feux de jour (DRL).
- id: 204
  category: vehicle_information
  question: 'En ce qui concerne l''état du pare-brise, un véhicule en Saskatchewan
    échouera à l''inspection s''il présente une fissure qui :'
  choices:
    A: Mesure plus de 5 cm n'importe où sur le verre
    B: Se trouve dans la zone balayée par les essuie-glaces et gêne la vue du conducteur
    C: Est située du côté passager uniquement
    D: A été réparée avec de la résine
  answer: B
  explanation: Un pare-brise doit être exempt de fissures ou d'éclats qui se trouvent
    dans le champ de vision du conducteur ou dans la zone balayée par les essuie-glaces
    s'ils compromettent la sécurité.
- id: 205
  category: vehicle_information
  question: 'En Saskatchewan, il est illégal de conduire un véhicule à moteur sur
    une route si le système d''échappement est équipé de :'
  choices:
    A: Un convertisseur catalytique
    B: Une dérivation de silencieux ou un dispositif de coupure (« cut-out »)
    C: Tuyaux d'échappement doubles
    D: Un embout chromé
  answer: B
  explanation: Les règlements sur l'équipement des véhicules interdisent l'utilisation
    de dispositifs de coupure de silencieux, de dérivations ou de dispositifs similaires
    qui augmentent le bruit ou permettent à l'échappement de contourner le silencieux.
- id: 206
  category: vehicle_information
  question: Selon la loi de la Saskatchewan, pour quelles vitres d'un véhicule n'est-il
    PAS permis d'appliquer une pellicule teintée après-vente ?
  choices:
    A: La lunette arrière uniquement
    B: Les vitres latérales arrière uniquement
    C: Le pare-brise et les vitres latérales avant
    D: Toutes les vitres peuvent être teintées
  answer: C
  explanation: Le règlement sur l'équipement des véhicules de la Saskatchewan interdit
    l'application de toute pellicule teintée après-vente sur le pare-brise ou sur
    les vitres situées immédiatement à gauche et à droite du conducteur.
- id: 207
  category: vehicle_information
  question: Pendant quelle période les pneus à clous sont-ils légalement autorisés
    sur les routes de la Saskatchewan ?
  choices:
    A: Du 1er novembre au 1er avril
    B: Du 1er octobre au 31 mai
    C: Du 1er septembre au 30 juin
    D: Toute l'année
  answer: B
  explanation: En Saskatchewan, les pneus à clous ne sont autorisés qu'entre le 1er
    octobre et le 31 mai afin d'éviter l'usure excessive de la chaussée pendant les
    mois d'été.
- id: 208
  category: vehicle_information
  question: En Saskatchewan, si le chargement d'un véhicule dépasse de plus de combien
    de mètres l'arrière du véhicule, doit-il être marqué par un drapeau rouge (le
    jour) ou un feu rouge (la nuit) ?
  choices:
    A: 0,5 mètre
    B: 1,0 mètre
    C: 1,5 mètre
    D: 2,0 mètres
  answer: C
  explanation: Si un chargement dépasse de plus de 1,5 mètre (5 pieds) l'arrière du
    véhicule, un drapeau rouge (d'au moins 30 cm carrés) doit être fixé pendant la
    journée, et un feu rouge la nuit.
- id: 209
  category: vehicle_information
  question: Quelle est l'exigence légale concernant le feu de plaque d'immatriculation
    d'un véhicule immatriculé en Saskatchewan ?
  choices:
    A: Il doit être bleu ou blanc
    B: Il doit être blanc et visible à 15 mètres vers l'arrière
    C: Il n'est requis que pour la conduite hors des limites de la ville
    D: Il doit être rouge pour s'harmoniser avec les feux arrière
  answer: B
  explanation: La loi de la Saskatchewan exige qu'un feu blanc éclaire la plaque d'immatriculation
    arrière afin qu'elle soit clairement lisible à une distance de 15 mètres.
- id: 210
  category: vehicle_information
  question: 'Selon les règlements de la Saskatchewan, un véhicule à moteur doit avoir
    un silencieux qui empêche :'
  choices:
    A: Toutes les émissions de pénétrer dans l'habitacle
    B: Un bruit excessif ou inhabituel et une fumée gênante
    C: Le moteur de surchauffer
    D: Tout échappement visible en tout temps
  answer: B
  explanation: Le règlement sur l'équipement des véhicules stipule que les silencieux
    doivent être en bon état de fonctionnement pour éviter les bruits excessifs et
    la fumée gênante ; les dispositifs de coupure ou les dérivations de silencieux
    sont interdits.
- id: 211
  category: vehicle_information
  question: En Saskatchewan, si votre véhicule est équipé d'une remorque, quelle est
    l'exigence concernant les chaînes de sécurité ?
  choices:
    A: Elles ne sont obligatoires que pour les remorques de plus de 2 000 kg
    B: Elles doivent être croisées sous l'attelage pour créer un berceau
    C: Elles sont facultatives si l'attelage possède une goupille de verrouillage
    D: Elles doivent être fixées au pare-chocs du véhicule tracteur
  answer: B
  explanation: Les normes de sécurité de la SGI exigent que les chaînes de sécurité
    soient connectées et croisées sous le timon de la remorque pour empêcher celui-ci
    de tomber au sol en cas de défaillance de l'attelage.
- id: 212
  category: vehicle_information
  question: Quand êtes-vous tenu d'utiliser vos phares en Saskatchewan ?
  choices:
    A: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    B: Uniquement lorsque la visibilité est inférieure à 500 mètres
    C: D'une demi-heure après le coucher du soleil à une demi-heure avant le lever
      du soleil, et chaque fois que la visibilité est mauvaise
    D: Uniquement entre 22h00 et 6h00
  answer: C
  explanation: La loi de la Saskatchewan exige que les phares soient allumés d'une
    demi-heure après le coucher du soleil à une demi-heure avant le lever du soleil,
    et à tout moment où les conditions atmosphériques (brouillard, neige, pluie) rendent
    la visibilité difficile.
- id: 213
  category: vehicle_information
  question: En Saskatchewan, quelle est la règle concernant le mélange de pneus radiaux
    et de pneus à carcasse diagonale sur un même véhicule ?
  choices:
    A: Ils peuvent être mélangés tant qu'ils sont de la même taille
    B: Ils ne doivent jamais être mélangés sur le même essieu
    C: Les pneus radiaux doivent toujours être à l'avant s'ils sont mélangés
    D: Le mélange n'est autorisé que sur les véhicules à quatre roues motrices (4WD)
  answer: B
  explanation: Pour des raisons de sécurité et de tenue de route, les règlements de
    la Saskatchewan et la SGI recommandent de ne pas mélanger différents types de
    construction de pneus (radiaux par rapport à carcasse diagonale) sur le même essieu.
- id: 214
  category: vehicle_information
  question: Les freins de service d'un véhicule doivent être capables d'arrêter le
    véhicule sur une surface pavée, plane et sèche sur quelle distance lorsqu'il roule
    à 30 km/h ?
  choices:
    A: 6 mètres
    B: 8 mètres
    C: 12 mètres
    D: 15 mètres
  answer: B
  explanation: Selon les normes de véhicules de la Saskatchewan, les freins de service
    doivent être capables d'arrêter le véhicule à moins de 8 mètres à partir d'une
    vitesse de 30 km/h.
- id: 215
  category: vehicle_information
  question: 'En Saskatchewan, un rétroviseur doit permettre au conducteur d''avoir
    une vue dégagée de la route à l''arrière sur une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 200 mètres
  answer: B
  explanation: La loi exige que les rétroviseurs permettent de voir la route derrière
    le véhicule sur une distance d'au moins 60 mètres.
- id: 216
  category: vehicle_information
  question: Si les clignotants de votre véhicule sont défectueux, quelle est l'obligation
    légale pour conduire en Saskatchewan ?
  choices:
    A: Vous ne pouvez conduire que pendant les heures de clarté
    B: Vous devez utiliser des signaux manuels (bras et main)
    C: Vous ne pouvez conduire le véhicule sous aucun prétexte
    D: Vous devez garder vos feux de détresse allumés en tout temps
  answer: B
  explanation: Si les clignotants mécaniques ne fonctionnent pas, le Guide du conducteur
    de la Saskatchewan stipule que vous devez utiliser les signaux manuels standard
    pour indiquer votre intention de tourner ou de vous arrêter.
- id: 217
  category: signs_and_signals
  question: Lorsque vous voyez un feu jaune fixe à une intersection en Saskatchewan,
    que devez-vous faire ?
  choices:
    A: Accélérer pour dégager l'intersection avant qu'il ne devienne rouge.
    B: S'arrêter immédiatement, même si vous êtes au milieu de l'intersection.
    C: S'arrêter avant d'entrer dans l'intersection, à moins de ne pas pouvoir le
      faire en toute sécurité.
    D: Continuer à travers l'intersection comme s'il était vert.
  answer: C
  explanation: Un feu jaune fixe signifie que le signal est sur le point de passer
    au rouge. Les conducteurs doivent s'arrêter avant d'entrer dans l'intersection,
    à moins d'être si proches qu'un arrêt ne peut être effectué en toute sécurité.
- id: 218
  category: signs_and_signals
  question: Quel est le signal manuel correct pour indiquer que vous ralentissez ou
    que vous vous arrêtez en Saskatchewan ?
  choices:
    A: Le bras gauche tendu horizontalement par la fenêtre.
    B: Le bras gauche sorti et plié vers le haut au niveau du coude.
    C: Le bras gauche sorti et plié vers le bas au niveau du coude, la paume vers
      l'arrière.
    D: Le bras droit agitant par la fenêtre.
  answer: C
  explanation: Pour signaler un arrêt ou une diminution de vitesse à l'aide de signaux
    manuels, le conducteur doit sortir son bras gauche par la fenêtre et le plier
    vers le bas au niveau du coude, la paume de la main tournée vers l'arrière.
- id: 219
  category: signs_and_signals
  question: En Saskatchewan, que signifie une ligne blanche continue peinte sur la
    chaussée entre deux voies de circulation ?
  choices:
    A: Le changement de voie est interdit.
    B: Le changement de voie est déconseillé.
    C: La circulation se fait dans des directions opposées.
    D: Vous approchez d'une zone scolaire.
  answer: B
  explanation: Une ligne blanche continue entre des voies de circulation circulant
    dans la même direction indique que le changement de voie est déconseillé. Bien
    que ce ne soit pas strictement illégal comme une double ligne continue, cela signifie
    qu'il est plus sûr de rester dans sa voie.
- id: 220
  category: signs_and_signals
  question: 'Un panneau en forme de triangle inversé avec une bordure rouge et un
    centre blanc est un :'
  choices:
    A: Panneau d'arrêt (Stop)
    B: Panneau de cédez le passage
    C: Panneau de zone scolaire
    D: Panneau de construction
  answer: B
  explanation: Le triangle équilatéral pointant vers le bas est la forme standard
    d'un panneau de cédez le passage en Saskatchewan et partout au Canada.
- id: 221
  category: signs_and_signals
  question: En Saskatchewan, qu'indique un panneau en forme de pentagone jaune-vert
    fluorescent ?
  choices:
    A: Un hôpital est à proximité.
    B: Un passage à niveau.
    C: Une zone scolaire ou un passage pour écoliers.
    D: Une impasse.
  answer: C
  explanation: Un panneau en forme de pentagone (cinq côtés) avec un fond jaune-vert
    fluorescent est utilisé pour avertir les conducteurs qu'ils approchent d'une zone
    scolaire ou d'un passage pour écoliers.
- id: 222
  category: signs_and_signals
  question: Que signifient deux lignes jaunes continues tracées au centre de la route
    ?
  choices:
    A: Le dépassement est permis si la voie est libre.
    B: Le dépassement est interdit pour la circulation dans les deux sens.
    C: Le dépassement est permis uniquement pour la circulation du côté droit.
    D: La route est à sens unique.
  answer: B
  explanation: Deux lignes jaunes continues signifient que le dépassement est interdit
    pour la circulation circulant dans les deux sens.
- id: 223
  category: signs_and_signals
  question: En Saskatchewan, qu'indique un marquage en « X » sur la chaussée ?
  choices:
    A: Une intersection est à venir.
    B: Un passage pour piétons.
    C: Un passage à niveau à venir.
    D: Stationnement interdit.
  answer: C
  explanation: Un grand « X » peint sur la chaussée, souvent accompagné des lettres
    « R R », indique que vous approchez d'un passage à niveau.
- id: 224
  category: signs_and_signals
  question: Lorsqu'un feu de circulation affiche un feu rouge fixe et une flèche verte,
    qu'êtes-vous autorisé à faire ?
  choices:
    A: Avancer dans n'importe quelle direction.
    B: S'arrêter, puis avancer dans la direction de la flèche.
    C: Avancer uniquement dans la direction de la flèche, en cédant le passage aux
      piétons.
    D: Attendre que le feu principal devienne vert avant de bouger.
  answer: C
  explanation: Une flèche verte affichée avec un feu rouge signifie que vous pouvez
    avancer dans la direction de la flèche, mais vous devez céder le passage aux piétons
    dans le passage pour piétons et aux autres véhicules se trouvant légalement dans
    l'intersection.
- id: 225
  category: signs_and_signals
  question: Quelle est la signification d'un panneau en forme de losange avec un fond
    orange en Saskatchewan ?
  choices:
    A: 'Panneau de signalisation réglementaire (ex. : limite de vitesse).'
    B: 'Panneau d''information (ex. : carburant ou nourriture).'
    C: Panneau d'avertissement pour des dangers permanents.
    D: Panneau d'avertissement pour des conditions temporaires ou des travaux de construction.
  answer: D
  explanation: Les panneaux orange en forme de losange sont utilisés pour avertir
    les conducteurs de conditions temporaires, telles que des zones de construction,
    l'entretien des routes ou des travaux de services publics.
- id: 226
  category: signs_and_signals
  question: En Saskatchewan, si vous approchez d'un passage à niveau muni d'un panneau
    d'arrêt, à quelle distance du rail le plus proche devez-vous immobiliser votre
    véhicule ?
  choices:
    A: Entre 1 et 5 mètres.
    B: Entre 5 et 15 mètres.
    C: Exactement 10 mètres.
    D: Au moins 20 mètres.
  answer: B
  explanation: Lorsqu'il est nécessaire de s'arrêter à un passage à niveau en Saskatchewan,
    vous devez immobiliser votre véhicule à une distance d'au moins 5 mètres et d'au
    plus 15 mètres du rail le plus proche.
- id: 227
  category: signs_and_signals
  question: Quel est le signal manuel correct pour un virage à droite en Saskatchewan
    ?
  choices:
    A: Bras gauche tendu horizontalement.
    B: Bras gauche sorti et plié vers le haut au niveau du coude.
    C: Bras gauche sorti et plié vers le bas au niveau du coude.
    D: Bras droit tendu horizontalement.
  answer: B
  explanation: Le signal manuel pour un virage à droite consiste à sortir le bras
    gauche par la fenêtre et à le plier vers le haut au niveau du coude.
- id: 228
  category: signs_and_signals
  question: En Saskatchewan, que signifie un panneau à fond blanc comportant un cercle
    noir avec une bordure verte autour d'un symbole ?
  choices:
    A: L'action illustrée dans le cercle est interdite.
    B: L'action illustrée dans le cercle est autorisée.
    C: Un avertissement de danger à venir.
    D: Une zone scolaire.
  answer: B
  explanation: Un cercle vert sur un panneau de prescription indique que l'action
    ou le mouvement illustré à l'intérieur du cercle est autorisé (par exemple, un
    cercle vert autour d'une flèche droite signifie que vous devez aller tout droit).
- id: 229
  category: signs_and_signals
  question: Que signifie un feu jaune (ambre) clignotant à une intersection ?
  choices:
    A: S'arrêter et attendre qu'il devienne vert.
    B: La même chose qu'un panneau d'arrêt.
    C: Ralentir et avancer avec prudence.
    D: Accélérer pour dégager la zone.
  answer: C
  explanation: Un feu jaune clignotant est un avertissement incitant à ralentir et
    à traverser l'intersection avec prudence, en cédant le passage aux piétons ou
    aux véhicules déjà engagés dans l'intersection.
- id: 230
  category: signs_and_signals
  question: Lorsque vous voyez un panneau en forme de triangle équilatéral dont la
    pointe est vers le bas, que devez-vous faire ?
  choices:
    A: S'arrêter et attendre le feu vert
    B: Céder le passage aux autres usagers
    C: Accélérer pour s'insérer dans la circulation
    D: Surveiller une zone scolaire
  answer: B
  explanation: Un triangle équilatéral pointant vers le bas est la forme universelle
    d'un panneau « Cédez le passage », exigeant que les conducteurs accordent la priorité
    à la circulation dans l'intersection ou sur la route transversale.
- id: 231
  category: signs_and_signals
  question: Quel est le signal manuel correct pour indiquer un virage à droite ?
  choices:
    A: Le bras gauche tendu horizontalement par la fenêtre
    B: Le bras gauche sorti et plié vers le haut au niveau du coude
    C: Le bras gauche sorti et plié vers le bas au niveau du coude
    D: Le bras droit tendu horizontalement par la fenêtre
  answer: B
  explanation: Pour signaler un virage à droite à l'aide de signaux manuels, le conducteur
    doit sortir son bras gauche par la fenêtre et le plier vers le haut à un angle
    de 90 degrés.
- id: 232
  category: signs_and_signals
  question: 'Un panneau à fond orange et de forme losange est utilisé pour indiquer
    :'
  choices:
    A: Des règles réglementaires
    B: Des zones scolaires
    C: Des avertissements de travaux de construction ou d'entretien
    D: Des informations directionnelles
  answer: C
  explanation: En Saskatchewan, les panneaux orange en forme de losange sont utilisés
    pour avertir les conducteurs de travaux de construction, d'entretien routier ou
    de travaux de services publics à venir.
- id: 233
  category: signs_and_signals
  question: Que signifie un symbole de losange blanc peint sur une voie spécifique
    de la route ?
  choices:
    A: La voie est réservée uniquement au trafic à grande vitesse
    B: La voie est réservée à des types spécifiques de véhicules
    C: La voie est un passage pour piétons
    D: La voie est fermée pour cause de travaux
  answer: B
  explanation: Un losange blanc sur la chaussée indique une voie réservée, qui peut
    être limitée aux autobus, aux vélos ou aux véhicules à forte occupation (VFO/HOV),
    comme l'indiquent les panneaux à proximité.
- id: 234
  category: signs_and_signals
  question: En Saskatchewan, quand êtes-vous autorisé à tourner à gauche à un feu
    rouge ?
  choices:
    A: Jamais
    B: D'une rue à double sens vers une rue à sens unique
    C: D'une rue à sens unique vers une autre rue à sens unique
    D: Chaque fois qu'il n'y a pas de trafic en sens inverse
  answer: C
  explanation: La loi de la Saskatchewan autorise un virage à gauche au feu rouge
    uniquement lors d'un passage d'une rue à sens unique vers une autre rue à sens
    unique, après avoir marqué un arrêt complet et cédé le passage aux piétons et
    aux autres véhicules.
- id: 235
  category: signs_and_signals
  question: Que signifie un panneau en forme de pentagone (cinq côtés) ?
  choices:
    A: Un passage à niveau
    B: Une zone hospitalière
    C: Une zone scolaire ou un passage pour écoliers
    D: Une impasse
  answer: C
  explanation: Un panneau à cinq côtés (pentagone) est utilisé exclusivement pour
    avertir les conducteurs qu'ils approchent d'une zone scolaire ou d'un passage
    pour écoliers.
- id: 236
  category: signs_and_signals
  question: 'Une ligne jaune continue à côté d''une ligne jaune discontinue sur la
    chaussée signifie :'
  choices:
    A: Le dépassement est interdit pour tous les véhicules
    B: Le dépassement est autorisé pour tous les véhicules
    C: Le dépassement est autorisé uniquement pour le côté ayant la ligne discontinue
    D: Le dépassement est autorisé uniquement pour le côté ayant la ligne continue
  answer: C
  explanation: Lorsqu'une ligne jaune continue et une ligne jaune discontinue sont
    présentes ensemble, les conducteurs du côté de la ligne discontinue peuvent dépasser
    si les conditions de sécurité le permettent, tandis que les conducteurs du côté
    de la ligne continue ont l'interdiction de dépasser.
- id: 237
  category: signs_and_signals
  question: Que signifie une flèche verte affichée avec un feu rouge ?
  choices:
    A: Vous devez vous arrêter et attendre le feu vert circulaire
    B: Vous pouvez avancer prudemment dans la direction de la flèche
    C: La flèche est un avertissement que le feu est en train de changer
    D: Seuls les véhicules d'urgence peuvent passer
  answer: B
  explanation: Une flèche verte avec un feu rouge signifie que vous avez un virage
    « protégé » dans la direction de la flèche, à condition de céder le passage aux
    piétons et à tout véhicule déjà engagé dans l'intersection.
- id: 238
  category: signs_and_signals
  question: Quel signal manuel est utilisé pour indiquer qu'un conducteur ralentit
    ou s'arrête ?
  choices:
    A: Le bras gauche tendu horizontalement
    B: Le bras gauche sorti et vers le haut
    C: Le bras gauche sorti et vers le bas
    D: Le bras droit sorti et vers le bas
  answer: C
  explanation: Le signal manuel pour ralentir ou s'arrêter consiste à tendre le bras
    gauche par la fenêtre et à le plier vers le bas au niveau du coude, la paume de
    la main tournée vers l'arrière.
- id: 239
  category: signs_and_signals
  question: Quelle est la signification d'un panneau en forme de 'X' sur une route
    ?
  choices:
    A: Entrée interdite
    B: Un passage à niveau
    C: Un arrêt obligatoire aux quatre sens
    D: Un passage pour piétons à venir
  answer: B
  explanation: Le panneau en 'X' (croix de Saint-André) est utilisé pour identifier
    un passage à niveau et a la même signification qu'un panneau de cédez le passage.
- id: 240
  category: signs_and_signals
  question: En Saskatchewan, que signifie un feu vert circulaire fixe ?
  choices:
    A: Allez-y, vous avez la priorité sur tout le monde
    B: Continuez tout droit ou tournez à gauche ou à droite, à moins qu'un panneau
      ne l'interdise
    C: Arrêtez-vous puis avancez
    D: Tournez uniquement à gauche
  answer: B
  explanation: Un feu vert signifie que vous pouvez continuer tout droit ou tourner
    (si ce n'est pas interdit), mais vous devez tout de même céder le passage aux
    piétons et aux véhicules déjà engagés dans l'intersection.
