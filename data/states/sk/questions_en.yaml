metadata:
  source: Saskatchewan Driver Handbook
  total_questions: 240
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Saskatchewan, what is the minimum age to apply for a Class 7 (Learner)
    license if you are enrolled in a high school driver education program?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 15 years and 6 months old
  answer: B
  explanation: In Saskatchewan, the minimum age to obtain a Class 7 learner's license
    is 15 if the applicant is enrolled in a high school driver education program.
    Otherwise, the minimum age is 16.
- id: 2
  category: license_system
  question: A supervising driver for a Class 7 learner must meet which of the following
    requirements?
  choices:
    A: Must be at least 18 years old and have held a valid Class 5 license for at
      least 365 days.
    B: Must be at least 21 years old and have held a valid Class 5 license for 2 years.
    C: Must be at least 19 years old and have a clean driving record for 3 years.
    D: Must be a family member who is at least 18 years old.
  answer: A
  explanation: SGI regulations state that a supervising driver for a learner must
    be at least 18 years of age and have held a valid Class 5 (or higher) license
    for at least 365 days.
- id: 3
  category: license_system
  question: Under Saskatchewan's Graduated Driver Licensing (GDL) program, what is
    the blood alcohol concentration (BAC) limit for Learner and Novice drivers?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: Zero (0.00%)
  answer: D
  explanation: All drivers in the Saskatchewan Graduated Driver Licensing program
    (Learner, Novice 1, and Novice 2) have a zero-tolerance policy for alcohol and
    drugs.
- id: 4
  category: license_system
  question: Which of the following is a restriction for a Class 5 Novice 1 driver
    regarding passengers?
  choices:
    A: No passengers are allowed between midnight and 5:00 AM.
    B: Only one passenger who is not an immediate family member is allowed.
    C: A maximum of three passengers is allowed regardless of relation.
    D: No passengers under the age of 18 are allowed.
  answer: B
  explanation: Class 5 Novice 1 drivers are restricted to only one passenger who is
    not an immediate family member. Other passengers must be immediate family members.
- id: 5
  category: license_system
  question: How long must a driver remain in the Learner (Class 7) stage before they
    are eligible to take a road test for their Novice 1 license?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months
    D: 18 months
  answer: B
  explanation: In Saskatchewan, you must hold a Class 7 learner's license for at least
    nine months and complete the required driver education before you can take the
    Class 5 road test.
- id: 6
  category: license_system
  question: What are the cell phone restrictions for a driver in the Novice 2 stage
    of the GDL program?
  choices:
    A: They may use a cell phone only with a hands-free device.
    B: They may use a cell phone for GPS purposes only.
    C: They are prohibited from using any type of cell phone, including hands-free.
    D: There are no restrictions as long as they are over 18.
  answer: C
  explanation: Drivers in the GDL program (Learner, Novice 1, and Novice 2) are prohibited
    from using any electronic communication equipment while driving, including hands-free
    cell phones.
- id: 7
  category: license_system
  question: How long is the Novice 2 stage in Saskatchewan's GDL program if the driver
    remains incident-free?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: The Novice 2 stage lasts for 12 months. If the driver completes this
    period without any traffic convictions, at-fault collisions, or suspensions, they
    graduate to a full Class 5 license.
- id: 8
  category: license_system
  question: When applying for a Saskatchewan driver's license, how many documents
    must you provide to prove your Saskatchewan residency?
  choices:
    A: One document
    B: Two documents
    C: Three documents
    D: None, if you have a valid birth certificate
  answer: B
  explanation: SGI requires two original documents that prove you reside in Saskatchewan
    (e.g., utility bill, bank statement, employment pay stub) to establish residency
    for a license.
- id: 9
  category: license_system
  question: Under the Safe Driver Recognition (SDR) program, what is the starting
    point balance for a new driver?
  choices:
    A: -5 points
    B: 0 points
    C: +5 points
    D: +10 points
  answer: B
  explanation: All new drivers start at the 'neutral zone' with 0 points on the Safe
    Driver Recognition scale. They earn points for each year of incident-free driving.
- id: 10
  category: license_system
  question: If a GDL driver is caught with any amount of alcohol or drugs in their
    system, what is the immediate roadside penalty for a first offense?
  choices:
    A: A verbal warning
    B: A 24-hour license suspension
    C: A 60-day license suspension and vehicle impoundment
    D: A 3-day license suspension and vehicle impoundment
  answer: C
  explanation: In Saskatchewan, GDL drivers face a 60-day roadside license suspension
    and a 3-day vehicle impoundment for a first offense of having any alcohol or drugs
    in their system.
- id: 11
  category: license_system
  question: Which of the following is required to move from Novice 1 to Novice 2?
  choices:
    A: Passing a second road test
    B: Completing 6 months of incident-free driving
    C: Completing 12 months of incident-free driving
    D: Attending a defensive driving course
  answer: B
  explanation: A driver moves from Novice 1 to Novice 2 automatically after 6 months
    of incident-free driving.
- id: 12
  category: license_system
  question: Where must the supervising driver sit when a Class 7 learner is operating
    a vehicle?
  choices:
    A: Anywhere in the vehicle
    B: In the back seat directly behind the driver
    C: In the front passenger seat
    D: In the seat with the best view of the road
  answer: C
  explanation: The supervising driver must occupy the seat nearest to the driver (the
    front passenger seat) and be conscious and capable of taking control of the vehicle
    if necessary.
- id: 13
  category: license_system
  question: If you move to Saskatchewan from another province, how long do you have
    to exchange your out-of-province license for a Saskatchewan license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: New residents who hold a valid out-of-province driver's license have
    90 days after moving to Saskatchewan to exchange it for a Saskatchewan license.
- id: 14
  category: license_system
  question: What is the maximum number of passengers allowed for a Class 5 Novice
    2 driver?
  choices:
    A: One passenger only
    B: Two passengers only
    C: As many passengers as there are seatbelts
    D: One passenger who is not family, plus family members
  answer: C
  explanation: Unlike Novice 1, the Novice 2 stage does not have a specific 'one non-family'
    passenger restriction. However, the driver must not have more passengers than
    there are functioning seatbelts.
- id: 15
  category: license_system
  question: Within how many days must you notify SGI of a change of name or address?
  choices:
    A: 7 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: According to Saskatchewan law, you must notify SGI of any change to
    your name or address within 15 days.
- id: 16
  category: license_system
  question: Under Saskatchewan's Safe Driver Recognition (SDR) program, how much is
    the financial penalty for each point if a driver falls into the 'penalty zone'
    (negative points)?
  choices:
    A: $25 per point
    B: $50 per point
    C: $75 per point
    D: $100 per point
  answer: B
  explanation: In Saskatchewan, drivers in the penalty zone of the Safe Driver Recognition
    program must pay a $50 penalty for each point below zero.
- id: 17
  category: license_system
  question: How many points are deducted from a driver's Safe Driver Recognition (SDR)
    rating for a single conviction of distracted driving?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: A conviction for distracted driving in Saskatchewan results in a 4-point
    deduction from the driver's SDR rating.
- id: 18
  category: license_system
  question: What is the maximum discount a driver can receive on their vehicle insurance
    through the Safe Driver Recognition program?
  choices:
    A: 15%
    B: 20%
    C: 25%
    D: 30%
  answer: C
  explanation: Drivers with a safety rating of +25 receive the maximum insurance premium
    discount of 25%.
- id: 19
  category: license_system
  question: In Saskatchewan, what is the minimum age requirement to apply for a Class
    1 (Commercial) driver's license?
  choices:
    A: 16 years old
    B: 18 years old
    C: 19 years old
    D: 21 years old
  answer: B
  explanation: To apply for a Class 1 commercial license in Saskatchewan, the applicant
    must be at least 18 years of age and not be in the GDL program.
- id: 20
  category: license_system
  question: Which class of Saskatchewan driver's license is required to operate a
    taxi or an ambulance?
  choices:
    A: Class 5
    B: Class 4
    '3': Class 3
    D: Class 2
  answer: B
  explanation: A Class 4 license is required to operate taxis, ambulances, and buses
    with a seating capacity of up to 24 passengers.
- id: 21
  category: license_system
  question: For a driver in the high school driver education program, how many hours
    of classroom instruction are required before they can receive their learner's
    license?
  choices:
    A: 6 hours
    B: 15 hours
    C: 30 hours
    D: 40 hours
  answer: C
  explanation: The Saskatchewan high school driver education program requires 30 hours
    of classroom instruction and 6 hours of in-car instruction.
- id: 22
  category: license_system
  question: What is the consequence for a second distracted driving offense within
    a 12-month period in Saskatchewan?
  choices:
    A: A $280 fine and 2 points
    B: A $580 fine and a 24-hour suspension
    C: A $1,400 fine and immediate 7-day vehicle seizure
    D: Permanent license revocation
  answer: C
  explanation: A second distracted driving offense within one year results in a $1,400
    fine, 4 points, and an immediate 7-day vehicle seizure.
- id: 23
  category: license_system
  question: How many points does a driver earn on their Safe Driver Recognition (SDR)
    rating for every year they drive without any incidents (accidents or convictions)?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: A
  explanation: Drivers earn one point on the SDR scale for every year they drive incident-free,
    up to a maximum of +25.
- id: 24
  category: license_system
  question: In Saskatchewan, how often must most drivers renew their driver's license?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Every 10 years
  answer: C
  explanation: Saskatchewan driver's licenses are typically renewed every five years,
    usually on the driver's birthday.
- id: 25
  category: license_system
  question: If a driver is in the Novice 2 stage and is responsible for a collision
    or receives a traffic conviction, what happens to their GDL status?
  choices:
    A: They are moved back to the Learner stage
    B: Their Novice 2 period is extended or restarted
    C: They must retake the written knowledge test
    D: Nothing happens unless they lose all their points
  answer: B
  explanation: Under the GDL program, any incident (conviction or at-fault collision)
    during the Novice 2 stage will restart the 12-month incident-free period required
    to graduate to a full Class 5 license.
- id: 26
  category: license_system
  question: What is the minimum age to apply for a motorcycle learner's endorsement
    (6) in Saskatchewan?
  choices:
    A: 15 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: To enter the Motorcycle Graduated Driver Licensing (MGDL) program and
    get a learner's endorsement, you must be at least 16 years of age.
- id: 27
  category: license_system
  question: For experienced drivers (non-GDL) over the age of 21, at what Blood Alcohol
    Concentration (BAC) level does a provincial administrative license suspension
    begin?
  choices:
    A: '0.02'
    B: '0.04'
    C: '0.05'
    D: '0.08'
  answer: B
  explanation: In Saskatchewan, experienced drivers face a provincial license suspension
    if their BAC is 0.04 or higher.
- id: 28
  category: license_system
  question: Which of the following is a requirement for a driver to move from the
    'Penalty Zone' back toward the 'Safety Zone' in the SDR program?
  choices:
    A: Paying a $500 flat fee
    B: One year of incident-free driving for each point they want to recover
    C: Retaking the road test
    D: Attending a mandatory 2-day workshop
  answer: B
  explanation: Drivers move up the SDR scale by completing one year of incident-free
    driving for each point they need to regain.
- id: 29
  category: license_system
  question: What is the lowest possible rating a driver can reach on the Safe Driver
    Recognition (SDR) scale?
  choices:
    A: '-10'
    B: '-15'
    C: '-20'
    D: '-25'
  answer: C
  explanation: The SDR scale ranges from a maximum of +25 (safety zone) to a minimum
    of -20 (penalty zone).
- id: 30
  category: license_system
  question: If you are a Saskatchewan resident and your medical condition changes
    in a way that could affect your driving, what are you legally required to do?
  choices:
    A: Wait until your license renewal to report it
    B: Notify SGI Medical Review Services immediately
    C: Stop driving only if your doctor tells you to
    D: Nothing, as medical records are private
  answer: B
  explanation: Saskatchewan law requires drivers to immediately report any medical
    condition that may affect their ability to safely operate a motor vehicle to SGI.
- id: 31
  category: driver_testing
  question: To pass the vision test for a Class 5 license in Saskatchewan, what is
    the minimum visual acuity required with both eyes open and examined together?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to SGI standards, an applicant for a Class 5 license must
    have a minimum visual acuity of 20/40 with both eyes open and examined together,
    with or without corrective lenses.
- id: 32
  category: driver_testing
  question: Which of the following actions will result in an automatic failure during
    a Saskatchewan road test?
  choices:
    A: Failing to use a turn signal once
    B: Driving 5 km/h under the speed limit
    C: The examiner having to intervene to prevent a collision
    D: Adjusting the mirrors while stopped
  answer: C
  explanation: Any action that requires the examiner to take control of the vehicle
    to avoid a collision or a dangerous situation results in an immediate and automatic
    failure of the road test.
- id: 33
  category: driver_testing
  question: When taking a road test in Saskatchewan, the vehicle provided by the applicant
    must meet which equipment requirement?
  choices:
    A: It must be less than 5 years old
    B: It must have a working speedometer and functioning brake lights
    C: It must be equipped with winter tires regardless of the season
    D: It must have a manual transmission
  answer: B
  explanation: The vehicle used for a road test must be mechanically safe and equipped
    with working brake lights, signal lights, a speedometer, and a horn. If the vehicle
    is unsafe, the examiner will refuse the test.
- id: 34
  category: driver_testing
  question: The Saskatchewan written knowledge test for a Class 7 learner's license
    consists of how many questions, and what is the required passing score?
  choices:
    A: 30 questions; 24 correct (80%)
    B: 40 questions; 32 correct (80%)
    C: 50 questions; 40 correct (80%)
    D: 100 questions; 80 correct (80%)
  answer: C
  explanation: The SGI knowledge test consists of 50 multiple-choice questions (divided
    into road signs and rules of the road). You must answer at least 40 correctly
    (80%) to pass.
- id: 35
  category: driver_testing
  question: In Saskatchewan, what is the maximum speed you are allowed to drive when
    passing a stopped emergency vehicle with its lights flashing on a highway?
  choices:
    A: 40 km/h
    B: 60 km/h
    C: 80 km/h
    D: The posted speed limit
  answer: B
  explanation: Saskatchewan law requires drivers to slow to 60 km/h when passing emergency
    vehicles (police, fire, ambulance) or tow trucks stopped on the highway with their
    lights flashing.
- id: 36
  category: driver_testing
  question: When driving through a designated highway construction zone in Saskatchewan
    where workers are present, what is the speed limit unless otherwise posted?
  choices:
    A: 30 km/h
    B: 50 km/h
    C: 60 km/h
    D: 80 km/h
  answer: C
  explanation: In Saskatchewan, the speed limit in highway work zones is 60 km/h when
    workers are present, unless a different speed is posted. Fines for speeding in
    these zones are tripled.
- id: 37
  category: driver_testing
  question: In the cities of Regina and Saskatoon, what is the standard speed limit
    in school zones, and when is it typically in effect?
  choices:
    A: 30 km/h; 7:00 a.m. to 7:00 p.m. daily
    B: 40 km/h; 8:00 a.m. to 5:00 p.m. school days
    C: 30 km/h; 8:00 a.m. to 10:00 p.m. daily
    D: 20 km/h; 24 hours a day
  answer: C
  explanation: As of recent bylaws in Regina and Saskatoon, school and playground
    zones have a 30 km/h limit effective from 8:00 a.m. to 10:00 p.m., 365 days a
    year.
- id: 38
  category: driver_testing
  question: In Saskatchewan, who is legally responsible for ensuring that a passenger
    under the age of 16 is wearing a seatbelt or is properly secured in a child safety
    seat?
  choices:
    A: The passenger
    B: The passenger's parents (even if not in the car)
    C: The driver of the vehicle
    D: No one; it is a personal choice
  answer: C
  explanation: The driver is responsible for ensuring all passengers under the age
    of 16 are properly restrained. If they are not, the driver may be issued a ticket.
- id: 39
  category: driver_testing
  question: According to the Saskatchewan Driver's Handbook, where is it illegal to
    perform a U-turn?
  choices:
    A: At any intersection
    B: At an intersection controlled by a traffic light
    C: On a gravel road
    D: In a residential driveway
  answer: B
  explanation: In Saskatchewan, U-turns are prohibited at intersections controlled
    by traffic lights, between intersections in business districts, and where signs
    prohibit them.
- id: 40
  category: driver_testing
  question: What is the minimum amount of third-party liability insurance coverage
    included with a basic Saskatchewan vehicle registration?
  choices:
    A: $50,000
    B: $100,000
    C: $200,000
    D: $500,000
  answer: C
  explanation: Basic vehicle registration in Saskatchewan through SGI includes $200,000
    in third-party liability coverage. Many drivers choose to purchase additional
    'extension' insurance for higher limits.
- id: 41
  category: driver_testing
  question: If you have a medical condition that may affect your ability to drive
    safely, when must you report this to SGI?
  choices:
    A: Only when you renew your license every 5 years
    B: Immediately
    C: Only if you are involved in a collision
    D: Within 30 days of a doctor's visit
  answer: B
  explanation: Saskatchewan law requires drivers to immediately report any medical
    condition, or changes to an existing condition, that may affect their ability
    to operate a motor vehicle safely.
- id: 42
  category: driver_testing
  question: During a road test, what must you do when approaching a 'Stale Green'
    light?
  choices:
    A: Speed up to clear the intersection before it turns yellow
    B: Maintain speed and hope it stays green
    C: Prepare to stop and check your rearview mirror
    D: Stop immediately, even if you are in the intersection
  answer: C
  explanation: A 'stale green' light is one that has been green for a long time and
    is likely to change. Drivers should cover the brake, check mirrors, and be prepared
    to stop if the light changes.
- id: 43
  category: driver_testing
  question: Under the Safe Driver Recognition (SDR) program, if you are in the 'Penalty
    Zone' (negative points), how many years of incident-free driving are required
    to earn back one point?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: For every year of incident-free driving (no at-fault accidents or traffic
    convictions), a driver moves one point up the SDR scale toward the 'Safety Zone'.
- id: 44
  category: driver_testing
  question: Which of the following is a requirement for the vehicle you bring to a
    Saskatchewan road test regarding the windshield?
  choices:
    A: It must be tinted to at least 35%
    B: It must not have any cracks that impair the driver's view
    C: It must have a 'Student Driver' sticker attached
    D: It must be made of reinforced plexiglass
  answer: B
  explanation: For a road test, the vehicle's windshield must be clear and free of
    cracks or obstructions that interfere with the driver's view or the safety of
    the vehicle.
- id: 45
  category: driver_testing
  question: A Class 5 Saskatchewan driver's license allows you to tow a trailer, provided
    the gross weight of the trailer (or trailers) does not exceed what limit?
  choices:
    A: 2,500 kg
    '0': 3,200 kg
    C: 4,600 kg
    D: 7,000 kg
  answer: C
  explanation: A Class 5 license allows the operation of a two-axle vehicle towing
    a trailer(s) where the gross weight of the towed unit(s) does not exceed 4,600
    kg.
- id: 46
  category: driver_testing
  question: To pass the vision test for a Class 5 Saskatchewan driver's license, what
    is the minimum visual acuity required in your best eye (with or without corrective
    lenses)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: SGI requires a minimum visual acuity of 20/40 in the better eye to
    qualify for a Class 5 license.
- id: 47
  category: driver_testing
  question: If you fail your first or second Class 5 road test in Saskatchewan, how
    long must you wait before you are eligible to take the test again?
  choices:
    A: 7 days
    B: 14 days
    C: 21 days
    D: 30 days
  answer: B
  explanation: According to SGI regulations, if you fail your first or second road
    test, there is a mandatory 14-day waiting period before you can re-test.
- id: 48
  category: driver_testing
  question: Under the Safe Driver Recognition (SDR) program, how many points do you
    earn for each year of incident-free driving while in the 'Safety Zone'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: A
  explanation: Drivers in the Safety Zone (positive points) earn one point for every
    year they drive without at-fault accidents or traffic convictions, up to a maximum
    of 25 points.
- id: 49
  category: driver_testing
  question: What is the maximum number of points a driver can accumulate in the 'Safety
    Zone' of the Saskatchewan Safe Driver Recognition (SDR) program?
  choices:
    A: 15 points
    B: 20 points
    C: 25 points
    D: 50 points
  answer: C
  explanation: The maximum safety rating a driver can achieve in Saskatchewan is +25,
    which provides the maximum insurance discount.
- id: 50
  category: driver_testing
  question: In Saskatchewan, how many SDR points are deducted from your rating for
    a conviction of 'Failing to stop for a school bus with flashing red lights'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failing to stop for a school bus with its red lights flashing results
    in a 4-point deduction under the Safe Driver Recognition program.
- id: 51
  category: driver_testing
  question: New residents to Saskatchewan must register their vehicle and obtain a
    Saskatchewan driver's license within how many days of moving to the province?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: SGI requires new residents to exchange their license and register their
    vehicles within 90 days of establishing residency.
- id: 52
  category: driver_testing
  question: During the parallel parking portion of the Saskatchewan Class 5 road test,
    how many attempts are you allowed to successfully park the vehicle?
  choices:
    A: 1 attempt
    B: 2 attempts
    C: 3 attempts
    D: Unlimited attempts within 5 minutes
  answer: C
  explanation: SGI road test standards allow the applicant up to three attempts to
    successfully parallel park the vehicle between the designated flags.
- id: 53
  category: driver_testing
  question: Which of the following vehicle defects would cause a Saskatchewan road
    test to be refused or cancelled before it begins?
  choices:
    A: A crack in the windshield that is not in the driver's direct line of vision
    B: A non-functioning brake light
    C: A small dent in the rear bumper
    D: An empty windshield washer fluid reservoir
  answer: B
  explanation: The vehicle must be in safe working order. A non-functioning brake
    light is a safety violation, and the examiner will refuse to conduct the test
    until it is fixed.
- id: 54
  category: driver_testing
  question: To meet the vision standards for a Class 5 license in Saskatchewan, what
    is the minimum horizontal field of vision required?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 150 degrees
  answer: C
  explanation: SGI requires a continuous horizontal field of vision of at least 120
    degrees for a Class 5 driver's license.
- id: 55
  category: driver_testing
  question: If a driver is in the 'Penalty Zone' of the SDR program, how many consecutive
    years of incident-free driving are required to return to a zero (neutral) rating?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: A driver in the penalty zone will return to a zero rating after three
    consecutive years of incident-free driving.
- id: 56
  category: driver_testing
  question: During the road test, if the examiner asks you to perform a maneuver that
    you believe is illegal, what should you do?
  choices:
    A: Perform the maneuver immediately because the examiner is an authority figure
    B: Refuse to perform it and explain that it is illegal
    C: Perform it but tell the examiner you know it's wrong afterward
    D: Pull over and end the test
  answer: B
  explanation: Examiners may occasionally test your knowledge by suggesting a maneuver;
    you must not perform any action that is illegal or unsafe. You should inform the
    examiner why you cannot do it.
- id: 57
  category: driver_responsibility
  question: At what point must a traffic collision in Saskatchewan be reported to
    the police?
  choices:
    A: Only if there is more than $1,000 in total damage.
    B: If there is injury, death, a hit-and-run, an unidentified driver, or the vehicle
      must be towed.
    C: Only if one of the drivers is from out of province.
    D: Every time any contact is made between two vehicles.
  answer: B
  explanation: According to SGI, you must report an accident to the police if there
    are injuries or death, if it's a hit-and-run, if a driver is impaired, if a vehicle
    must be towed, or if the driver is unidentified.
- id: 58
  category: driver_responsibility
  question: What is the standard deductible for a claim under the basic compulsory
    collision coverage in Saskatchewan?
  choices:
    A: $250
    B: $500
    C: $700
    D: $1,000
  answer: C
  explanation: The standard deductible for most vehicles under the basic SGI plate
    insurance is $700.
- id: 59
  category: driver_responsibility
  question: If you are involved in a collision with an unattended vehicle and cannot
    find the owner, what must you do?
  choices:
    A: Wait for 30 minutes, then leave if no one shows up.
    B: Leave a note with your name, address, and license plate number, and report
      the accident to SGI.
    C: Call a tow truck to move the other vehicle to a safe location.
    D: Nothing, as long as the damage appears to be less than $500.
  answer: B
  explanation: Saskatchewan law requires you to take reasonable steps to locate the
    owner. If they cannot be found, you must leave a written notice with your contact
    and vehicle information and report the incident to SGI.
- id: 60
  category: driver_responsibility
  question: If you are a Saskatchewan resident and purchase a vehicle from another
    province, what is generally required before it can be registered in Saskatchewan?
  choices:
    A: A bill of sale only.
    B: A mechanical safety inspection at a certified Saskatchewan station.
    C: A letter of permission from the previous owner.
    D: Nothing, as long as it was registered in Canada.
  answer: B
  explanation: Most vehicles brought into Saskatchewan from another jurisdiction must
    pass a mechanical safety inspection before they can be registered.
- id: 61
  category: driver_responsibility
  question: Which Saskatchewan program provides benefits for medical expenses and
    lost income to anyone injured in a motor vehicle accident, regardless of who was
    at fault?
  choices:
    A: The Saskatchewan Health Plan
    B: The Personal Injury Protection Plan (PIPP)
    C: The Driver Rehabilitation Program
    D: The Tort Liability Option
  answer: B
  explanation: PIPP is the standard 'no-fault' coverage in Saskatchewan that provides
    injury benefits to all residents involved in accidents.
- id: 62
  category: driver_responsibility
  question: If you lend your vehicle to a friend and they are caught by a red-light
    camera, who is responsible for paying the fine?
  choices:
    A: The driver only.
    B: The vehicle owner.
    C: Both the driver and the owner equally.
    D: The insurance company.
  answer: B
  explanation: In Saskatchewan, the registered owner of a vehicle is responsible for
    tickets issued via automated enforcement (photo radar or red-light cameras), regardless
    of who was driving.
- id: 63
  category: driver_responsibility
  question: How long can a visitor to Saskatchewan drive using their out-of-province
    driver's license and vehicle plates?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: Visitors may drive in Saskatchewan for up to 90 days with a valid out-of-province
    license and registration.
- id: 64
  category: driver_responsibility
  question: What happens to your vehicle registration if you fail to pay a fine for
    a traffic conviction in Saskatchewan?
  choices:
    A: Nothing, fines are separate from registration.
    B: You will be unable to renew your driver's license or vehicle registration until
      the fine is paid.
    C: Your vehicle will be immediately impounded.
    D: Your insurance deductible will increase.
  answer: B
  explanation: SGI will refuse to provide licensing or registration services (including
    renewals) to individuals who have outstanding traffic fines.
- id: 65
  category: driver_responsibility
  question: When must a driver carry their certificate of registration for the vehicle
    they are operating?
  choices:
    A: Only when traveling outside of Saskatchewan.
    B: Only if the vehicle is a commercial truck.
    C: At all times when the vehicle is being operated.
    D: Only when a police officer requests it via mail.
  answer: C
  explanation: The driver must carry the vehicle's certificate of registration (or
    a clear photocopy) at all times while the vehicle is in operation.
- id: 66
  category: driver_responsibility
  question: If you are found to be 50% or more at fault for a collision, how many
    points will be deducted from your Safe Driver Recognition (SDR) rating?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: A driver loses 6 points on the SDR scale for each at-fault accident
    (where they are 50% or more responsible).
- id: 67
  category: driver_responsibility
  question: What is the consequence of driving an unregistered vehicle on a public
    highway in Saskatchewan?
  choices:
    A: A verbal warning for the first offense.
    B: A fine and the vehicle may be impounded.
    C: Automatic loss of driver's license for one year.
    D: There is no penalty if you have a valid driver's license.
  answer: B
  explanation: Driving an unregistered vehicle is a serious offense that results in
    a significant fine and the vehicle being towed and impounded.
- id: 68
  category: driver_responsibility
  question: 'In Saskatchewan, you are legally required to report a collision to the
    police if the total property damage for all vehicles and property appears to be
    more than:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: According to the Saskatchewan Driver's Handbook, collisions must be
    reported to the police if there are injuries, a hit-and-run, a driver is impaired,
    a vehicle must be towed, or the total damage exceeds $2,000.
- id: 69
  category: driver_responsibility
  question: When moving to Saskatchewan from another province, how many days do you
    have to register your vehicle with Saskatchewan license plates?
  choices:
    A: 14 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: While you have 90 days to exchange your driver's license, you must
    register your vehicle and obtain Saskatchewan license plates within 30 days of
    becoming a resident.
- id: 70
  category: driver_responsibility
  question: If you are caught driving a vehicle that is not currently registered or
    insured in Saskatchewan, what is a likely immediate consequence?
  choices:
    A: Your vehicle will be impounded
    B: Your license will be permanently cancelled
    C: You will be required to retake your road test
    D: You will be banned from the SDR program for 5 years
  answer: A
  explanation: Driving an unregistered vehicle is a serious offense in Saskatchewan
    and can result in the vehicle being seized and impounded by police.
- id: 71
  category: driver_responsibility
  question: Which of the following is NOT a legal requirement for a driver involved
    in an accident in Saskatchewan?
  choices:
    A: Stop the vehicle immediately
    B: Offer all reasonable assistance to any injured persons
    C: Exchange name, address, and plate number with other parties
    D: Pay the other driver for damages at the scene to avoid an insurance claim
  answer: D
  explanation: Drivers must stop, assist, and exchange information. Paying cash at
    the scene is not a legal requirement and is generally discouraged as it does not
    fulfill insurance reporting obligations.
- id: 72
  category: driver_responsibility
  question: 'In Saskatchewan, the standard deductible for collision and comprehensive
    coverage under the basic plate insurance is:'
  choices:
    A: $200
    B: $500
    C: $700
    D: $1,000
  answer: C
  explanation: The default deductible for most vehicles under SGI's basic plate insurance
    is $700, though drivers can choose to purchase a 'package policy' to lower this
    amount.
- id: 73
  category: driver_responsibility
  question: 'Under the Safe Driver Recognition program, for every one year of incident-free
    driving, your rating improves by:'
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: A
  explanation: Drivers earn 1 point on the SDR scale for every year they drive without
    at-fault accidents, traffic convictions, or roadside suspensions.
- id: 74
  category: driver_responsibility
  question: 'If a driver is caught operating a vehicle while their license is suspended
    or disqualified, the vehicle will be impounded for a minimum of:'
  choices:
    A: 24 hours
    B: 7 days
    C: 15 days
    D: 30 days
  answer: D
  explanation: Saskatchewan law mandates a 30-day vehicle impoundment for drivers
    caught driving while suspended or disqualified.
- id: 75
  category: driver_responsibility
  question: When selling a vehicle privately in Saskatchewan, what is the seller's
    responsibility regarding the license plates?
  choices:
    A: The plates must stay with the vehicle for the new owner
    B: The seller must remove the plates and may keep them or return them to SGI
    C: The seller must transfer the plates to the buyer via an SGI broker
    D: The seller must paint over the plates before handing over the vehicle
  answer: B
  explanation: In Saskatchewan, license plates belong to the individual, not the vehicle.
    When a vehicle is sold, the seller must remove their plates.
- id: 76
  category: driver_responsibility
  question: If a driver currently has a Safe Driver Recognition (SDR) rating of -2
    and is then found at fault for a collision, what will their new rating be?
  choices:
    A: '-4'
    B: '-6'
    C: '-8'
    D: '-12'
  answer: C
  explanation: An at-fault collision results in a 6-point deduction. If a driver is
    at -2, subtracting 6 points results in a new rating of -8.
- id: 77
  category: driver_responsibility
  question: Which of the following documents must a driver be able to produce when
    requested by a peace officer?
  choices:
    A: A valid driver's license
    B: A valid vehicle registration certificate
    C: Proof of financial responsibility (insurance)
    D: All of the above
  answer: D
  explanation: Drivers in Saskatchewan are required by law to carry and produce their
    license, registration, and proof of insurance when requested by police.
- id: 78
  category: driver_responsibility
  question: If you purchase a vehicle in another province and intend to drive it back
    to Saskatchewan, what must you obtain to be legally covered?
  choices:
    A: A handwritten note from the seller
    B: An 'In-Transit' permit or temporary insurance/registration
    C: Nothing, as long as you have the bill of sale
    D: A temporary license from the province of purchase
  answer: B
  explanation: To legally drive a newly purchased vehicle from another province to
    Saskatchewan, you must obtain an In-Transit permit which provides temporary registration
    and insurance.
- id: 79
  category: driver_responsibility
  question: What is the purpose of the 'Victim's Surcharge' that is added to all traffic
    fines in Saskatchewan?
  choices:
    A: To pay for the administration of SGI
    B: To fund the maintenance of provincial highways
    C: To provide funding for programs that assist victims of crime
    D: To pay for the police officer's time in court
  answer: C
  explanation: The Victim's Surcharge is a mandatory fee added to provincial fines
    to fund the Victims' Fund, which supports services for victims of crime in Saskatchewan.
- id: 80
  category: safe_driving_rules
  question: In Saskatchewan, what is the maximum speed you are allowed to travel when
    passing a highway worker, flagperson, or occupied equipment in a work zone?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: D
  explanation: In Saskatchewan, you must slow to 60 km/h when passing workers, flagpersons,
    or occupied equipment in a work zone (the 'Orange Zone').
- id: 81
  category: safe_driving_rules
  question: When passing a stopped emergency vehicle (police, fire, or ambulance)
    on a Saskatchewan highway with its sirens or lights flashing, what is the maximum
    speed limit?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: C
  explanation: Saskatchewan law requires drivers to slow to 60 km/h when passing stopped
    emergency vehicles with their lights flashing on highways.
- id: 82
  category: safe_driving_rules
  question: Unless otherwise posted, what is the default speed limit on provincial
    highways in Saskatchewan outside of urban areas?
  choices:
    A: 80 km/h
    B: 90 km/h
    C: 100 km/h
    D: 110 km/h
  answer: C
  explanation: The default speed limit for provincial highways in Saskatchewan is
    100 km/h unless signs indicate a different limit.
- id: 83
  category: safe_driving_rules
  question: What is the default speed limit on rural gravel roads in Saskatchewan,
    unless otherwise posted?
  choices:
    A: 60 km/h
    B: 70 km/h
    C: 80 km/h
    D: 90 km/h
  answer: C
  explanation: In Saskatchewan, the speed limit on rural gravel roads is 80 km/h unless
    signs state otherwise.
- id: 84
  category: safe_driving_rules
  question: Under what specific condition is a driver allowed to turn left on a red
    light in Saskatchewan?
  choices:
    A: Never; left turns on red are always illegal.
    B: When turning from a one-way street onto another one-way street after a complete
      stop.
    C: When there is no oncoming traffic.
    D: Only between the hours of 11:00 PM and 6:00 AM.
  answer: B
  explanation: In Saskatchewan, you may turn left on a red light only if you are turning
    from a one-way street onto another one-way street, provided you come to a complete
    stop and yield to pedestrians and other traffic.
- id: 85
  category: safe_driving_rules
  question: In Saskatchewan, what is the minimum distance you must park away from
    a fire hydrant?
  choices:
    A: 1 metre
    B: 2 metres
    C: 3 metres
    D: 5 metres
  answer: B
  explanation: According to Saskatchewan provincial regulations, you must not park
    within 2 metres of a fire hydrant.
- id: 86
  category: safe_driving_rules
  question: How far must you park away from a stop sign, yield sign, or traffic light
    in Saskatchewan?
  choices:
    A: 2 metres
    B: 5 metres
    C: 10 metres
    D: 15 metres
  answer: B
  explanation: You are prohibited from parking within 5 metres of any stop sign, yield
    sign, or traffic signal.
- id: 87
  category: safe_driving_rules
  question: When a school bus is stopped with its red lights flashing and stop arm
    extended, how far back must you stop your vehicle?
  choices:
    A: 3 metres
    B: 5 metres
    C: 10 metres
    D: 15 metres
  answer: B
  explanation: In Saskatchewan, you must stop at least 5 metres away from a school
    bus that has its red lights flashing and stop arm extended.
- id: 88
  category: safe_driving_rules
  question: When two lanes of traffic are required to merge due to a lane closure,
    what is the recommended 'zipper merge' procedure in Saskatchewan?
  choices:
    A: Merge into the through lane as early as possible.
    B: Stop in the closing lane and wait for a gap.
    C: Drivers in the closing lane should continue until the end of the lane and then
      take turns merging.
    D: Speed up to get ahead of the traffic in the through lane.
  answer: C
  explanation: 'SGI recommends the zipper merge: drivers should use both lanes fully
    until the point of bottleneck and then take turns merging into the through lane.'
- id: 89
  category: safe_driving_rules
  question: In Saskatchewan, U-turns are generally prohibited at which of the following
    locations?
  choices:
    A: On any gravel road.
    B: At an intersection controlled by a traffic light, unless a sign permits it.
    C: On a one-way street.
    D: In a residential driveway.
  answer: B
  explanation: In Saskatchewan, you are not allowed to make a U-turn at an intersection
    controlled by traffic lights unless there is a sign specifically allowing it.
- id: 90
  category: safe_driving_rules
  question: Under what circumstance is it legal to pass another vehicle on the right
    in Saskatchewan?
  choices:
    A: When the vehicle ahead is making a left turn and there is a paved shoulder
      or second lane.
    B: Whenever you are in a hurry and the left lane is blocked.
    C: On any two-lane highway if the ditch is flat.
    D: It is never legal to pass on the right.
  answer: A
  explanation: You may pass on the right only if the vehicle ahead is turning left
    and there is an unobstructed lane or sufficient width of pavement for your vehicle
    to pass safely.
- id: 91
  category: safe_driving_rules
  question: What is the recommended minimum following distance behind another vehicle
    under ideal driving conditions in Saskatchewan?
  choices:
    A: One car length
    B: Two seconds
    C: Five seconds
    D: 50 metres
  answer: B
  explanation: SGI recommends a minimum following distance of at least two seconds
    behind the vehicle in front of you under ideal conditions.
- id: 92
  category: safe_driving_rules
  question: In Saskatchewan, what does a flashing green light at an intersection typically
    indicate?
  choices:
    A: The light is about to turn red.
    B: It is a pedestrian-activated signal; it will stay green until a pedestrian
      pushes the button.
    C: You have a protected left turn.
    D: The intersection is under construction.
  answer: B
  explanation: In Saskatchewan, a flashing green light indicates a pedestrian-actuated
    signal. It remains green for drivers until a pedestrian pushes the button to cross.
- id: 93
  category: safe_driving_rules
  question: At an uncontrolled T-intersection in Saskatchewan, who has the right of
    way?
  choices:
    A: The driver on the right.
    B: The driver on the 'terminating' road (the road that ends).
    C: The driver on the 'through' road (the top of the T).
    D: Whoever arrives at the intersection first.
  answer: C
  explanation: At an uncontrolled T-intersection, the driver on the road that is ending
    (the terminating road) must yield the right of way to traffic on the through road.
- id: 94
  category: safe_driving_rules
  question: When entering a roundabout in Saskatchewan, which of the following is
    true regarding the right of way?
  choices:
    A: Traffic entering the roundabout has the right of way.
    B: You must yield to traffic already in the roundabout.
    C: You must stop before entering, even if no traffic is coming.
    D: The driver on the left always has the right of way.
  answer: B
  explanation: When entering a roundabout, you must yield to traffic already circulating
    in the roundabout and to any pedestrians in the crosswalk.
- id: 95
  category: safe_driving_rules
  question: If you are driving on a two-lane highway and approach a school bus stopped
    with its red lights flashing and stop arm extended, what must you do?
  choices:
    A: Slow down to 30 km/h and pass carefully
    B: Stop at least 5 meters away from the bus and wait until the lights stop flashing
    C: Stop only if you are behind the bus, not if you are approaching from the front
    D: Honk your horn and proceed slowly
  answer: B
  explanation: When a school bus has red lights flashing and the stop arm out, drivers
    in both directions must stop at least 5 meters from the bus and remain stopped
    until the lights are turned off.
- id: 96
  category: safe_driving_rules
  question: What is the default speed limit in Saskatchewan's urban areas (cities,
    towns, and villages) unless otherwise posted?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: The standard speed limit within urban municipalities in Saskatchewan
    is 50 km/h unless posted otherwise.
- id: 97
  category: safe_driving_rules
  question: As of current Saskatchewan law, what is the fine for a first-time conviction
    of distracted driving (e.g., using a handheld cell phone while driving)?
  choices:
    A: $280
    B: $380
    C: $580
    D: $1,000
  answer: C
  explanation: In Saskatchewan, a first-time distracted driving offense carries a
    fine of $580 plus a victim surcharge and 4 demerit points.
- id: 98
  category: safe_driving_rules
  question: When making a right turn from a one-way street onto another one-way street,
    which lane should you turn from and into?
  choices:
    A: From the left lane into the left lane
    B: From the right lane into the right lane
    C: From the right lane into any available lane
    D: From the center lane into the right lane
  answer: B
  explanation: When turning right, you must turn from the right-hand lane into the
    right-hand lane of the intersecting street.
- id: 99
  category: safe_driving_rules
  question: In Saskatchewan, if there are no marked crosswalks or signs at an intersection,
    do pedestrians have the right of way?
  choices:
    A: No, pedestrians only have the right of way at marked crosswalks
    B: Yes, every intersection is considered an 'unmarked crosswalk' and drivers must
      yield
    C: Only if the pedestrian is wearing reflective clothing
    D: Only if the speed limit is below 50 km/h
  answer: B
  explanation: In Saskatchewan, every intersection is an unmarked crosswalk. Drivers
    must yield the right of way to pedestrians crossing the street at any intersection.
- id: 100
  category: safe_driving_rules
  question: When driving at night in Saskatchewan, within what distance must you dim
    your high-beam headlights when following another vehicle?
  choices:
    A: 50 meters
    B: 100 meters
    C: 200 meters
    D: 400 meters
  answer: C
  explanation: You must dim your high beams to low beams when you are within 200 meters
    of the vehicle you are following.
- id: 101
  category: defensive_driving
  question: When driving in adverse conditions such as rain, snow, or on gravel roads
    in Saskatchewan, how should your following distance change?
  choices:
    A: Maintain the 3-second rule
    B: Increase to at least 6 seconds
    C: Decrease to 2 seconds to stay close to the vehicle's tracks
    D: Increase to 4 seconds
  answer: B
  explanation: In Saskatchewan, it is recommended to double your following distance
    to at least six seconds when conditions are less than ideal, such as on slippery
    roads or gravel.
- id: 102
  category: defensive_driving
  question: To maintain good 'visual lead time' while driving in a city or residential
    area, how far ahead should you be scanning?
  choices:
    A: 5 to 8 seconds
    B: 12 to 15 seconds
    C: 20 to 25 seconds
    D: 30 to 40 seconds
  answer: B
  explanation: SGI manual states that in urban areas, you should scan 12 to 15 seconds
    ahead (about one and a half blocks) to anticipate hazards.
- id: 103
  category: defensive_driving
  question: When driving on Saskatchewan highways, what is the recommended visual
    lead time for scanning the road ahead?
  choices:
    A: 10 to 12 seconds
    B: 12 to 15 seconds
    C: 20 to 25 seconds
    D: 45 seconds
  answer: C
  explanation: On highways, because speeds are higher, you should scan 20 to 25 seconds
    ahead to identify potential hazards early.
- id: 104
  category: defensive_driving
  question: According to Saskatchewan law, you must dim your high beam headlights
    when you are within what distance of an oncoming vehicle?
  choices:
    A: 100 metres
    B: 200 metres
    C: 300 metres
    D: 500 metres
  answer: B
  explanation: Saskatchewan regulations require drivers to switch to low beams when
    an oncoming vehicle is within 200 metres to avoid blinding the other driver.
- id: 105
  category: defensive_driving
  question: If your vehicle begins to hydroplane (tires lose contact with the road
    on a layer of water), what is the correct defensive driving action?
  choices:
    A: Brake hard to regain traction
    B: Accelerate to cut through the water
    C: Shift to neutral and steer sharply
    D: Take your foot off the accelerator and steer straight
  answer: D
  explanation: If hydroplaning, you should ease off the accelerator and keep the steering
    wheel straight. Do not brake until you feel the tires have regained contact with
    the road.
- id: 106
  category: defensive_driving
  question: When driving in heavy fog in Saskatchewan, which light setting should
    you use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the fog particles,
    creating a 'white wall' effect that reduces visibility even further.
- id: 107
  category: defensive_driving
  question: If a large animal like a deer or moose suddenly jumps in front of your
    vehicle on a Saskatchewan highway, what is the safest reaction?
  choices:
    A: Swerve quickly into the ditch
    B: Swerve into the oncoming lane
    C: Brake firmly and stay in your lane
    D: Speed up to minimize the impact time
  answer: C
  explanation: SGI advises drivers to brake firmly and stay in their lane. Swerving
    can lead to a more serious rollover or a head-on collision with another vehicle.
- id: 108
  category: defensive_driving
  question: What is the primary danger of 'black ice' on Saskatchewan roads during
    winter?
  choices:
    A: It is thick and easy to see
    B: It only forms on gravel roads
    C: It is a thin, nearly invisible layer of ice that looks like wet pavement
    D: It only occurs when temperatures are above freezing
  answer: C
  explanation: Black ice is particularly dangerous because it is transparent and looks
    like a harmless wet patch on the road, providing almost zero traction.
- id: 109
  category: defensive_driving
  question: How often should you check your rearview mirrors as part of a good defensive
    driving scan?
  choices:
    A: Every 5 to 10 seconds
    B: Every 30 seconds
    C: Only when you are about to turn
    D: Once every minute
  answer: A
  explanation: A good defensive driver checks their mirrors every 5 to 10 seconds
    to maintain 360-degree awareness of the traffic around them.
- id: 110
  category: defensive_driving
  question: When entering a curve, when is the best time to adjust your speed?
  choices:
    A: While you are in the middle of the curve
    B: Before you enter the curve
    C: As you are exiting the curve
    D: Only if you feel the tires sliding
  answer: B
  explanation: To maintain stability, you should slow down to a safe speed before
    entering a curve, then accelerate slightly as you exit.
- id: 111
  category: defensive_driving
  question: When driving in winter, why is it important to keep your fuel tank at
    least half full in Saskatchewan?
  choices:
    A: To increase the weight of the vehicle for better traction
    B: To prevent the fuel line from freezing and provide heat if you become stranded
    C: To improve the vehicle's aerodynamics in snow
    D: It is required by Saskatchewan law
  answer: B
  explanation: Keeping a fuller tank reduces moisture buildup in the fuel system (preventing
    freezing) and ensures you have enough fuel to run the engine for heat if you are
    stuck in a storm.
- id: 112
  category: defensive_driving
  question: In ideal driving conditions, what is the minimum following distance recommended
    by the Saskatchewan Driver's Handbook?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Saskatchewan Driver's Handbook recommends a minimum following distance
    of three seconds under ideal conditions to allow enough time to react to sudden
    stops.
- id: 113
  category: defensive_driving
  question: When driving in urban areas (cities or towns), how far ahead should you
    be scanning the road for potential hazards?
  choices:
    A: 5 seconds
    B: 12 seconds
    C: 20 seconds
    D: 30 seconds
  answer: B
  explanation: In the city, you should scan about 12 seconds ahead (roughly one block)
    to anticipate traffic changes and hazards.
- id: 114
  category: defensive_driving
  question: When driving on a highway, what is the recommended scanning distance to
    identify potential hazards early?
  choices:
    A: 10 to 12 seconds
    B: 15 to 18 seconds
    C: 20 to 25 seconds
    D: 40 to 45 seconds
  answer: C
  explanation: On highways, higher speeds require a longer scanning distance of 20
    to 25 seconds ahead to ensure you have enough time to react to obstacles.
- id: 115
  category: defensive_driving
  question: 'When following another vehicle at night, you must switch your headlights
    to low-beams when you are within:'
  choices:
    A: 50 metres
    B: 100 metres
    C: 200 metres
    D: 300 metres
  answer: B
  explanation: You must dim your high beams to low beams when following another vehicle
    within 100 metres to prevent glare in their rearview mirror.
- id: 116
  category: defensive_driving
  question: When passing an emergency vehicle, tow truck, or service vehicle stopped
    on the highway with its lights flashing, what is the maximum speed you are permitted
    to travel?
  choices:
    A: 40 km/h
    B: 60 km/h
    C: 80 km/h
    D: The posted speed limit
  answer: B
  explanation: In Saskatchewan, drivers must slow to 60 km/h when passing emergency
    vehicles, tow trucks, or highway workers with flashing lights on highways where
    the speed limit is greater than 60 km/h.
- id: 117
  category: defensive_driving
  question: Unless otherwise posted, what is the maximum speed limit on a provincial
    gravel highway in Saskatchewan?
  choices:
    A: 60 km/h
    B: 80 km/h
    C: 90 km/h
    D: 100 km/h
  answer: B
  explanation: The default speed limit for provincial gravel highways in Saskatchewan
    is 80 km/h unless signs indicate otherwise.
- id: 118
  category: defensive_driving
  question: When driving on gravel roads, what is a specific hazard you should anticipate
    when following or passing another vehicle?
  choices:
    A: Black ice
    B: Dust clouds reducing visibility
    C: Hydroplaning
    D: Increased tire grip
  answer: B
  explanation: Dust clouds are a major hazard on Saskatchewan gravel roads; they can
    completely obscure your vision and hide oncoming traffic or hazards.
- id: 119
  category: defensive_driving
  question: In heavy fog, which lighting configuration is most effective for safety?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: Low-beam headlights should be used in fog. High beams reflect off the
    fog droplets, creating a 'white wall' effect that further reduces visibility.
- id: 120
  category: defensive_driving
  question: When driving on a highway with a speed limit of 100 km/h or higher, how
    often does SGI recommend taking a break to prevent fatigue?
  choices:
    A: Every hour
    B: Every two hours or 200 km
    C: Every four hours
    D: Only when you feel sleepy
  answer: B
  explanation: To prevent driver fatigue and highway hypnosis, it is recommended to
    stop for a break every two hours or every 200 kilometres.
- id: 121
  category: defensive_driving
  question: When approaching a curve in the road, when should you adjust your speed?
  choices:
    A: Before entering the curve
    B: While in the middle of the curve
    C: Just as you are exiting the curve
    D: Only if you feel the tires sliding
  answer: A
  explanation: You should slow down to a safe speed before entering a curve. Braking
    while in the curve can cause the vehicle to skid.
- id: 122
  category: defensive_driving
  question: What is the best way to check your blind spots before changing lanes?
  choices:
    A: Check the rearview mirror
    B: Check the side-view mirrors
    C: Turn your head and look over your shoulder
    D: Rely on your vehicle's blind-spot monitoring system
  answer: C
  explanation: Mirrors do not show everything. A shoulder check (turning your head
    to look out the side windows) is the only way to ensure your blind spot is clear
    before changing lanes.
- id: 123
  category: alcohol_drugs_health
  question: In Saskatchewan, at what Blood Alcohol Concentration (BAC) level does
    an experienced driver (non-GDL) face an immediate roadside license suspension
    for a first offense?
  choices:
    A: '0.02'
    B: '0.04'
    C: '0.05'
    D: '0.08'
  answer: B
  explanation: In Saskatchewan, experienced drivers face an immediate roadside suspension
    if their BAC is 0.04 or higher. This is lower than the federal Criminal Code limit
    of 0.08.
- id: 124
  category: alcohol_drugs_health
  question: For an experienced driver's first roadside suspension (BAC 0.04 to 0.08),
    how long is the vehicle impounded?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: A first-time roadside suspension for an experienced driver (0.04 to
    0.08 BAC) results in an immediate 3-day vehicle impoundment.
- id: 125
  category: alcohol_drugs_health
  question: What is Saskatchewan's law regarding the presence of THC (cannabis) in
    a driver's system?
  choices:
    A: Drivers are allowed up to 2 nanograms of THC.
    B: Drivers are allowed up to 5 nanograms of THC.
    C: Saskatchewan has a zero-tolerance policy for THC for all drivers.
    D: Only GDL drivers have a zero-tolerance policy for THC.
  answer: C
  explanation: Saskatchewan has a zero-tolerance policy for drug impairment, including
    THC, for all drivers. Any detectable amount of a prohibited drug on an oral fluid
    screening device results in immediate penalties.
- id: 126
  category: alcohol_drugs_health
  question: If a driver is convicted of a Criminal Code offense for having a BAC over
    0.08, what is the mandatory minimum ignition interlock period for a first offense
    in Saskatchewan?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: For a first Criminal Code conviction (BAC over 0.08), Saskatchewan
    law requires a mandatory 1-year period of ignition interlock use after the initial
    court-ordered prohibition.
- id: 127
  category: alcohol_drugs_health
  question: If a driver refuses to provide a breath sample to a police officer, what
    are the consequences in Saskatchewan?
  choices:
    A: A 24-hour suspension only.
    B: A $500 fine and no license suspension.
    C: The same penalties as having a BAC over 0.08 or being impaired.
    D: A warning for the first refusal.
  answer: C
  explanation: Refusing to provide a breath or blood sample is a Criminal Code offense
    and carries the same penalties as driving with a BAC over 0.08, including immediate
    license suspension and vehicle impoundment.
- id: 128
  category: alcohol_drugs_health
  question: Under Saskatchewan law, who is responsible for reporting a medical condition
    that may affect driving ability to SGI?
  choices:
    A: Only the driver's doctor.
    B: Only the driver's optometrist.
    C: The driver themselves.
    D: The police.
  answer: C
  explanation: While medical professionals may report conditions, the driver is legally
    responsible for notifying SGI of any medical condition (such as epilepsy, diabetes,
    or heart conditions) that could affect their ability to safely operate a vehicle.
- id: 129
  category: alcohol_drugs_health
  question: What is the mandatory education program for a first-time roadside alcohol
    suspension in Saskatchewan?
  choices:
    A: DWI (Driving Without Impairment) course
    B: ADED (Alcohol and Drug Education) program
    C: SGI Safety Seminar
    D: Defensive Driving Course
  answer: A
  explanation: Drivers who receive a roadside suspension for alcohol must complete
    the Driving Without Impairment (DWI) course.
- id: 130
  category: alcohol_drugs_health
  question: In Saskatchewan, where is it legal for a passenger to consume alcohol
    inside a motor vehicle?
  choices:
    A: In the back seat only.
    B: In a motorhome while it is being used as a residence and parked.
    C: In the front seat if the driver is not drinking.
    D: It is never legal for a passenger to consume alcohol in any vehicle.
  answer: B
  explanation: It is illegal to consume alcohol in a vehicle. The only exception is
    in a motorhome being used as a residence while it is legally parked off a public
    highway.
- id: 131
  category: alcohol_drugs_health
  question: If an experienced driver receives a second roadside suspension (0.04 to
    0.08 BAC) within five years, how long is the license suspension?
  choices:
    A: 3 days
    B: 7 days
    C: 21 days
    D: 90 days
  answer: C
  explanation: A second roadside suspension for an experienced driver within a five-year
    period results in a 21-day license suspension.
- id: 132
  category: alcohol_drugs_health
  question: At what BAC level does a driver face the most severe Criminal Code penalties,
    including higher mandatory fines?
  choices:
    A: '0.08'
    B: '0.12'
    C: '0.16'
    D: '0.20'
  answer: C
  explanation: While 0.08 is the legal limit, a BAC of 0.16 or higher is considered
    an aggravating factor that triggers significantly higher mandatory minimum fines
    and penalties under the Criminal Code.
- id: 133
  category: alcohol_drugs_health
  question: 'If you are taking a prescription drug and are unsure if it will affect
    your driving, you should:'
  choices:
    A: Drive only during daylight hours.
    B: Drive slower than the speed limit.
    C: Consult your doctor or pharmacist before driving.
    D: Wait one hour after taking the medication before driving.
  answer: C
  explanation: Many prescription and over-the-counter drugs can cause drowsiness or
    impair judgment. You must consult a medical professional to ensure it is safe
    to drive.
- id: 134
  category: alcohol_drugs_health
  question: Which of the following is an aggravating factor that leads to a longer
    vehicle impoundment for a roadside suspension in Saskatchewan?
  choices:
    A: Driving at night.
    B: Having a passenger under the age of 16 in the vehicle.
    C: Driving a commercial vehicle.
    D: Driving on a gravel road.
  answer: B
  explanation: If a driver is caught with a BAC in the suspension range (or drugs)
    and has a passenger under 16 in the vehicle, the vehicle impoundment period is
    increased (e.g., 7 days for a first offense instead of 3).
- id: 135
  category: alcohol_drugs_health
  question: What is the immediate roadside vehicle impoundment period for any driver
    who tests positive for drugs for the first time?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: A first-time roadside drug failure results in an immediate 3-day vehicle
    impoundment, similar to the 0.04 BAC penalty for experienced drivers.
- id: 136
  category: alcohol_drugs_health
  question: If a driver is required to participate in the Ignition Interlock Program
    but is caught driving a vehicle without an interlock device, what is the penalty?
  choices:
    A: A verbal warning.
    B: A $100 fine.
    C: The vehicle is impounded and the driver faces further suspension and charges.
    D: They must restart the GDL program from the beginning.
  answer: C
  explanation: Driving a vehicle not equipped with an ignition interlock device when
    required is a serious offense. The vehicle will be impounded, and the driver faces
    criminal charges for driving while prohibited/disqualified.
- id: 137
  category: alcohol_drugs_health
  question: What is Saskatchewan's legal limit for THC (the active ingredient in cannabis)
    in a driver's system?
  choices:
    A: 2 nanograms per milliliter
    B: 5 nanograms per milliliter
    C: Zero tolerance
    D: 10 nanograms per milliliter
  answer: C
  explanation: Saskatchewan has a zero-tolerance policy for drug impairment. No driver
    is allowed to have any detectable amount of certain drugs, including THC, in their
    system while operating a vehicle.
- id: 138
  category: alcohol_drugs_health
  question: For an experienced driver's first offense with a BAC between 0.04 and
    0.08, how long is the vehicle impounded?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: For a first offense where an experienced driver has a BAC between 0.04
    and 0.08, the vehicle is impounded for 3 days.
- id: 139
  category: alcohol_drugs_health
  question: If a driver refuses to provide a breath or oral fluid sample upon a legal
    demand by a peace officer, what are the consequences?
  choices:
    A: A 24-hour suspension only
    B: A small fine and 1 point on the SDR scale
    C: The same penalties as having a BAC over 0.08 (Criminal Code offense)
    D: No penalty if it is the driver's first time being stopped
  answer: C
  explanation: Refusing to provide a breath, blood, or oral fluid sample is a Criminal
    Code offense and carries the same penalties as driving with a BAC over 0.08.
- id: 140
  category: alcohol_drugs_health
  question: In Saskatchewan, when is the Ignition Interlock program mandatory for
    a driver?
  choices:
    A: Only after the third impaired driving conviction
    B: For all drivers convicted of a Criminal Code impaired driving offense
    C: Only if the driver's BAC was over 0.15
    D: Only if the driver is under the age of 21
  answer: B
  explanation: The Ignition Interlock program is mandatory for all drivers convicted
    of a Criminal Code impaired driving offense in Saskatchewan.
- id: 141
  category: alcohol_drugs_health
  question: If you are taking prescription medication that causes drowsiness, what
    is the safest course of action?
  choices:
    A: Drive only on familiar roads
    B: Drink coffee to stay alert before driving
    C: Do not operate a motor vehicle
    D: Drive only during daylight hours
  answer: C
  explanation: If medication causes side effects like drowsiness or dizziness, you
    must not drive, as it impairs your ability to operate the vehicle safely.
- id: 142
  category: alcohol_drugs_health
  question: For an experienced driver's second offense within five years for a BAC
    between 0.04 and 0.08, what is the roadside license suspension period?
  choices:
    A: 3 days
    B: 7 days
    C: 21 days
    D: 90 days
  answer: C
  explanation: A second offense within five years for an experienced driver with a
    BAC between 0.04 and 0.08 results in a 21-day roadside license suspension.
- id: 143
  category: alcohol_drugs_health
  question: Which education program must an experienced driver complete following
    their first roadside suspension for a BAC between 0.04 and 0.08?
  choices:
    A: High School Driver Education
    B: Driving Without Impairment (DWI) course
    C: Alcohol and Drug Education (ADE) course
    D: Defensive Driving Course
  answer: B
  explanation: An experienced driver must complete the Driving Without Impairment
    (DWI) course after their first roadside suspension (0.04 to 0.08 BAC).
- id: 144
  category: alcohol_drugs_health
  question: In Saskatchewan, all drivers under what age are subject to a zero-tolerance
    policy for alcohol and drugs, regardless of license class?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: Saskatchewan law enforces a zero-tolerance policy for alcohol and drugs
    for all drivers under the age of 21.
- id: 145
  category: alcohol_drugs_health
  question: What method do Saskatchewan police use for roadside drug screening?
  choices:
    A: Pupil dilation test
    B: Oral fluid (saliva) testing
    C: Mandatory blood draw
    D: Hair follicle testing
  answer: B
  explanation: Police in Saskatchewan use federally approved oral fluid (saliva) screening
    devices to detect the presence of drugs like THC and cocaine at the roadside.
- id: 146
  category: alcohol_drugs_health
  question: Under the Safe Driver Recognition program, what is the financial penalty
    surcharge for a Criminal Code impaired driving conviction?
  choices:
    A: $500
    B: $1,250
    C: $2,250
    D: $5,000
  answer: B
  explanation: A Criminal Code conviction for impaired driving results in a $1,250
    financial penalty under the Safe Driver Recognition (SDR) program.
- id: 147
  category: alcohol_drugs_health
  question: What is the minimum visual acuity required (with or without corrective
    lenses) to hold a standard Class 5 license in Saskatchewan?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: To qualify for a Class 5 license in Saskatchewan, a driver must have
    a minimum visual acuity of 20/40 in both eyes combined, with or without corrective
    lenses.
- id: 148
  category: alcohol_drugs_health
  question: If a driver is found to be impaired by a combination of alcohol and drugs,
    how is the offense treated under Saskatchewan law?
  choices:
    A: The driver is only charged for the substance with the higher concentration
    B: It is treated as a single minor roadside offense
    C: It is a Criminal Code offense with the same severe penalties as being over
      0.08 BAC
    D: The driver is given a warning for the first time
  answer: C
  explanation: Driving while impaired by a combination of alcohol and drugs is a Criminal
    Code offense and carries the same severe penalties as other impaired driving charges.
- id: 149
  category: penalties_and_points
  question: Under the Saskatchewan Safe Driver Recognition (SDR) program, how many
    points are deducted from your rating for a conviction of speeding 35 km/h over
    the posted limit?
  choices:
    A: 1 point
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: According to the SDR point schedule, speeding between 31 km/h and 50
    km/h over the limit results in a 4-point deduction.
- id: 150
  category: penalties_and_points
  question: For an experienced driver (21 years or older), what is the immediate roadside
    license suspension period for a first-time BAC between 0.04 and 0.08?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: Experienced drivers caught with a BAC between 0.04 and 0.08 for the
    first time face an immediate 3-day roadside license suspension.
- id: 151
  category: penalties_and_points
  question: If a driver is caught stunting or street racing in Saskatchewan, for how
    long will the vehicle be immediately impounded?
  choices:
    A: 3 days
    B: 7 days
    C: 15 days
    D: 30 days
  answer: D
  explanation: Saskatchewan law mandates a 30-day vehicle impoundment for drivers
    caught stunting or street racing.
- id: 152
  category: penalties_and_points
  question: How many points are deducted from a driver's Safe Driver Recognition (SDR)
    rating for failing to stop for a school bus with its lights flashing and stop
    arm extended?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failing to stop for a school bus results in a 4-point deduction under
    the SDR program.
- id: 153
  category: penalties_and_points
  question: Under the Driver Improvement Program (DIP), at what point threshold will
    an experienced driver's license be suspended?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: In Saskatchewan's Driver Improvement Program, reaching 12 demerit points
    within a 2-year period results in a license suspension.
- id: 154
  category: penalties_and_points
  question: If you are caught driving while your license is suspended, the vehicle
    you are driving will be impounded for how many days?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Driving while suspended results in an automatic 30-day vehicle impoundment
    in Saskatchewan.
- id: 155
  category: penalties_and_points
  question: In Saskatchewan, what is the standard fine for a driver who is caught
    not wearing a seatbelt?
  choices:
    A: $100
    B: $150
    C: $175
    D: $280
  answer: C
  explanation: The fine for failing to wear a seatbelt in Saskatchewan is $175.
- id: 156
  category: penalties_and_points
  question: What is the immediate roadside penalty for a second distracted driving
    offense within one year, in addition to the fine?
  choices:
    A: A 24-hour suspension
    B: A 7-day vehicle impoundment
    C: A 30-day vehicle impoundment
    D: Permanent license revocation
  answer: B
  explanation: A second distracted driving ticket within one year results in a 7-day
    vehicle impoundment.
- id: 157
  category: penalties_and_points
  question: What is the base fine for speeding in a construction zone where workers
    are present in Saskatchewan?
  choices:
    A: $100
    B: $170
    C: $210
    D: $300
  answer: C
  explanation: The base fine for speeding in a work zone with workers present is $210,
    plus additional costs per km/h over the limit.
- id: 158
  category: penalties_and_points
  question: If a driver is in the 'penalty zone' of the SDR program (negative points),
    how much is the financial penalty for each point below zero?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: B
  explanation: Drivers in the penalty zone must pay $50 for every point they are below
    zero on the SDR scale.
- id: 159
  category: penalties_and_points
  question: If an experienced driver is charged with a BAC over 0.08, how long is
    their license suspended immediately at the roadside?
  choices:
    A: 24 hours
    B: 7 days
    C: 90 days
    D: Indefinitely until the charge is resolved
  answer: D
  explanation: In Saskatchewan, a driver charged with a BAC over 0.08 faces an indefinite
    license suspension that lasts until the criminal charge is resolved in court.
- id: 160
  category: penalties_and_points
  question: In Saskatchewan, what is the total fine for a first-time conviction of
    distracted driving?
  choices:
    A: $280
    B: $380
    C: $580
    D: $1,000
  answer: C
  explanation: As of current Saskatchewan law, a first-time distracted driving offense
    carries a $580 fine and four demerit points under the Safe Driver Recognition
    program.
- id: 161
  category: penalties_and_points
  question: Under the Safe Driver Recognition (SDR) program, how many points are deducted
    for a 24-hour roadside suspension due to alcohol or drugs?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: A 24-hour roadside suspension for alcohol or drug impairment results
    in a 4-point deduction from your SDR rating.
- id: 162
  category: penalties_and_points
  question: If a driver is caught for a second distracted driving offense within one
    year in Saskatchewan, what is the vehicle impoundment penalty?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: C
  explanation: A second distracted driving offense within a 12-month period results
    in an immediate seven-day vehicle impoundment, in addition to a $1,400 fine.
- id: 163
  category: penalties_and_points
  question: In Saskatchewan, speeding in a marked school zone results in a higher
    fine. What is the base fine for this violation?
  choices:
    A: $100
    B: $170
    C: $190
    D: $240
  answer: C
  explanation: Speeding in a school zone starts with a base fine of $190, plus $2
    for every km/h over the limit, plus a victim surcharge.
- id: 164
  category: penalties_and_points
  question: What is the minimum license suspension period for a first Criminal Code
    conviction for impaired driving in Saskatchewan?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: A first-time Criminal Code conviction for impaired driving results
    in a minimum one-year driver's license suspension.
- id: 165
  category: penalties_and_points
  question: In Saskatchewan, what is the immediate vehicle impoundment period for
    a driver charged with 'stunting'?
  choices:
    A: 3 days
    B: 7 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Drivers charged with stunting or street racing face an immediate 30-day
    vehicle impoundment.
- id: 166
  category: penalties_and_points
  question: Which course must a GDL driver complete if they receive their first roadside
    alcohol or drug suspension?
  choices:
    A: Defensive Driving Course
    B: Driving Without Impairment (DWI) Course
    C: SGI Professional Driver Course
    D: Standard First Aid Course
  answer: B
  explanation: GDL drivers who receive a roadside suspension for alcohol or drugs
    must complete the 'Driving Without Impairment' (DWI) education program.
- id: 167
  category: penalties_and_points
  question: What is the SDR point deduction for a conviction of 'Driving without Due
    Care and Attention'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 10 points
  answer: C
  explanation: A conviction for driving without due care and attention results in
    a 4-point deduction from the driver's SDR rating.
- id: 168
  category: sharing_the_road
  question: When passing a cyclist in Saskatchewan, what is the recommended minimum
    distance you should maintain between your vehicle and the cyclist?
  choices:
    A: 0.5 meters
    B: 1 meter
    C: 2 meters
    D: 3 meters
  answer: B
  explanation: SGI recommends leaving at least one meter of space between your vehicle
    and the cyclist to ensure safety.
- id: 169
  category: sharing_the_road
  question: In Saskatchewan, the '60 km/h rule' for passing stopped vehicles with
    flashing lights applies to emergency vehicles, tow trucks, and which of the following?
  choices:
    A: Mail delivery trucks
    B: Garbage trucks
    C: Snowplows
    D: School buses picking up students
  answer: C
  explanation: The 60 km/h speed limit applies when passing stopped emergency vehicles,
    tow trucks, and highway equipment (like snowplows) with their warning lights flashing.
- id: 170
  category: sharing_the_road
  question: When a motorcycle is traveling in front of you, what is the minimum following
    distance you should maintain under ideal conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: SGI recommends a minimum following distance of three seconds for all
    vehicles, but emphasizes it for motorcycles because they can stop very quickly.
- id: 171
  category: sharing_the_road
  question: What does a 'sharrow' symbol (a bicycle with two chevrons above it) painted
    on a Saskatchewan roadway indicate?
  choices:
    A: A lane reserved exclusively for bicycles.
    B: A lane where motorists must yield to pedestrians only.
    C: A lane shared by both motorists and cyclists.
    D: A high-speed cycling lane.
  answer: C
  explanation: Sharrows indicate that motorists and cyclists must share the lane.
    Cyclists may occupy any part of a lane marked with sharrows.
- id: 172
  category: sharing_the_road
  question: 'When a large truck is turning right at an intersection, it may need to
    swing wide to the left. This is because of a phenomenon known as:'
  choices:
    A: Centrifugal force
    B: Off-tracking
    C: Counter-steering
    D: Blind-spotting
  answer: B
  explanation: Off-tracking occurs because the rear wheels of a long vehicle follow
    a shorter path than the front wheels, requiring the driver to swing wide to clear
    the curb.
- id: 173
  category: sharing_the_road
  question: You are approaching an intersection where a pedestrian is using a white
    cane. What must you do?
  choices:
    A: Honk to let them know you are there.
    B: Slow down and drive around them cautiously.
    C: Stop and remain stopped until the pedestrian has safely crossed the entire
      roadway.
    D: Yield only if they are in a marked crosswalk.
  answer: C
  explanation: Drivers must give the right of way to a person who is blind or visually
    impaired and carrying a white cane or using a guide dog.
- id: 174
  category: sharing_the_road
  question: 'In Saskatchewan, if an emergency vehicle with its siren and lights on
    is approaching you from behind on a two-way street, you should:'
  choices:
    A: Speed up to get out of the way.
    B: Pull to the right edge of the road and stop.
    C: Pull to the left edge of the road and stop.
    D: Stop exactly where you are.
  answer: B
  explanation: When an emergency vehicle is approaching with lights and siren, you
    must pull to the right as far as possible and come to a complete stop.
- id: 175
  category: sharing_the_road
  question: Which of the following is true regarding 'No-Zones' around large commercial
    trucks?
  choices:
    A: They are only located directly behind the truck.
    B: They are areas where the truck driver has limited or no visibility.
    C: They are lanes reserved for trucks only.
    D: They only exist when the truck is turning.
  answer: B
  explanation: No-Zones are large blind spots around the front, back, and sides of
    a truck where the driver cannot see other vehicles.
- id: 176
  category: sharing_the_road
  question: In Saskatchewan, at an intersection where there are no painted crosswalks,
    are pedestrians allowed to cross?
  choices:
    A: No, they must find a marked crosswalk.
    B: Yes, every intersection is considered an 'unmarked' crosswalk unless otherwise
      posted.
    C: Yes, but only if they are wearing reflective clothing.
    D: No, crossing at unmarked intersections is considered jaywalking.
  answer: B
  explanation: Under Saskatchewan law, every intersection is a crosswalk, whether
    it is marked with paint or not, and drivers must yield to pedestrians.
- id: 177
  category: sharing_the_road
  question: When following a pilot vehicle (escort vehicle) for an oversized load,
    what should you do?
  choices:
    A: Pass the pilot vehicle as soon as possible.
    B: Follow the instructions of the pilot vehicle driver or the signs on the vehicle.
    C: Turn on your high beams to signal the driver.
    D: Drive as close as possible to see the oversized load.
  answer: B
  explanation: Pilot vehicles are used to warn motorists of oversized loads. Drivers
    should be prepared to slow down or pull over as directed by the pilot vehicle.
- id: 178
  category: sharing_the_road
  question: 'If you are driving a car and want to pass a motorcycle, you should:'
  choices:
    A: Share the lane with the motorcycle while passing.
    B: Pass in the same way you would pass any other vehicle, using a full lane.
    C: Honk your horn to tell the motorcyclist to move to the shoulder.
    D: Pass on the right side of the motorcycle.
  answer: B
  explanation: Motorcycles are entitled to the full width of a lane. You must never
    attempt to share a lane with a motorcycle while passing.
- id: 179
  category: sharing_the_road
  question: 'A cyclist signaling a right turn in Saskatchewan may do so by extending
    their left arm upward at a 90-degree angle or by:'
  choices:
    A: Extending their right arm straight out to the right.
    B: Pointing to the ground with their left hand.
    C: Waving both arms.
    D: Extending their left arm straight out to the left.
  answer: A
  explanation: Cyclists can signal a right turn either by bending the left arm up
    at the elbow or by extending the right arm straight out to the right.
- id: 180
  category: sharing_the_road
  question: In Saskatchewan, what is the minimum distance a motor vehicle must maintain
    when passing a bicycle in a speed zone of 60 km/h or less?
  choices:
    A: 0.5 meters
    B: 1 meter
    C: 1.5 meters
    D: 2 meters
  answer: B
  explanation: Saskatchewan regulations require drivers to maintain a minimum distance
    of 1 meter when passing a cyclist in speed zones of 60 km/h or less.
- id: 181
  category: sharing_the_road
  question: When driving behind a large commercial truck, if you cannot see the truck
    driver's side-view mirrors, what does this indicate?
  choices:
    A: You are at a safe following distance
    B: The truck driver is about to turn
    C: You are in the truck's blind spot (No-Zone)
    D: The truck is over-length
  answer: C
  explanation: 'A general rule for sharing the road with large trucks is: if you can''t
    see the driver''s mirrors, the driver cannot see you because you are in their
    blind spot.'
- id: 182
  category: sharing_the_road
  question: What is the recommended minimum following distance when driving behind
    a motorcycle in good weather conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: SGI recommends a minimum following distance of 3 seconds for motorcycles
    to allow for their ability to stop quickly and to avoid being affected by their
    smaller profile.
- id: 183
  category: sharing_the_road
  question: At an intersection where there are no marked crosswalks or stop lines,
    what are your responsibilities regarding pedestrians?
  choices:
    A: Pedestrians must yield to vehicles
    B: You must yield to pedestrians as every intersection is considered an 'unmarked
      crosswalk'
    C: You only stop if a pedestrian is using a white cane
    D: You have the right of way unless there is a 'Pedestrian Crossing' sign
  answer: B
  explanation: In Saskatchewan, pedestrians have the right of way at all intersections,
    whether the crosswalk is marked or unmarked.
- id: 184
  category: sharing_the_road
  question: The 'Slow to 60' rule in Saskatchewan applies to which of the following
    vehicles when they are stopped on the side of the highway with lights flashing?
  choices:
    A: Police and Fire vehicles only
    B: Ambulances and Tow trucks only
    C: Police, Fire, Ambulances, Tow trucks, and Highway Service vehicles
    D: Any vehicle with hazard lights on
  answer: C
  explanation: The law applies to all emergency vehicles, tow trucks, and highway
    service vehicles (including snow plows) when they are stopped with their warning
    lights activated.
- id: 185
  category: sharing_the_road
  question: When a school bus is operating amber (yellow) flashing lights, what should
    a driver do?
  choices:
    A: Stop immediately
    B: Prepare to stop, as the bus is about to activate its red flashing lights
    C: Speed up to pass the bus before the lights turn red
    D: Ignore them as they are only for warning pedestrians
  answer: B
  explanation: Amber flashing lights on a school bus indicate that the bus is preparing
    to stop to load or unload passengers; drivers should be prepared to stop.
- id: 186
  category: sharing_the_road
  question: If a cyclist is extending their left arm straight out to the side, what
    maneuver are they signaling?
  choices:
    A: A right turn
    B: A left turn
    C: Slowing down or stopping
    D: Yielding to traffic
  answer: B
  explanation: A cyclist extending their left arm straight out is signaling a left
    turn, the same as a hand signal for a motor vehicle.
- id: 187
  category: sharing_the_road
  question: Why should you avoid 'squeezing' between a large truck and the curb when
    the truck is approaching an intersection?
  choices:
    A: The truck might have a mechanical failure
    B: Trucks often need to swing wide to the left to make a right turn
    C: Trucks have priority at all intersections
    D: The air turbulence will pull your car into the truck
  answer: B
  explanation: Large trucks require extra space for turns and often swing wide to
    the left to complete a right turn; 'squeezing' in on the right can lead to a collision.
- id: 188
  category: sharing_the_road
  question: If you see a pedestrian carrying a white cane, what does this signify?
  choices:
    A: The pedestrian is a senior citizen
    B: The pedestrian is visually impaired
    C: The pedestrian has the right of way only at marked crosswalks
    D: The pedestrian is a road construction worker
  answer: B
  explanation: A white cane indicates the pedestrian is blind or visually impaired.
    Drivers should give them extra space and be prepared to stop.
- id: 189
  category: sharing_the_road
  question: In Saskatchewan, is a motorcycle allowed to share a single lane with a
    passenger car?
  choices:
    A: Yes, if the car driver gives permission
    B: Yes, during heavy traffic
    C: No, a motorcycle is entitled to the full use of a lane
    D: Only if the motorcycle is passing on the right
  answer: C
  explanation: Motorcycles are entitled to the full width of a lane. No other vehicle
    shall be driven in a manner that deprives a motorcycle of the full use of a lane.
- id: 190
  category: sharing_the_road
  question: When a school bus is stopped with red lights flashing on a highway divided
    by a physical median, which traffic must stop?
  choices:
    A: Traffic in both directions
    B: Only traffic following the bus
    C: Only traffic approaching from the front
    D: No traffic is required to stop on a divided highway
  answer: B
  explanation: On a divided highway with a physical median, only traffic traveling
    in the same direction as the school bus is required to stop for its red flashing
    lights.
- id: 191
  category: sharing_the_road
  question: When approaching a snow plow on a Saskatchewan highway that has its amber
    and red lights flashing, what is the maximum speed you can pass it at?
  choices:
    A: 30 km/h
    B: 60 km/h
    C: 80 km/h
    D: The posted speed limit
  answer: B
  explanation: Snow plows are considered highway service vehicles. When their lights
    are flashing, you must slow to 60 km/h when passing them.
- id: 192
  category: vehicle_information
  question: In Saskatchewan, what is the minimum legal tread depth for tires on a
    passenger vehicle?
  choices:
    A: 1.0 mm (1/25 inch)
    B: 1.6 mm (2/32 inch)
    C: 2.5 mm (3/32 inch)
    D: 3.2 mm (4/32 inch)
  answer: B
  explanation: According to Saskatchewan vehicle equipment regulations, tires must
    have a tread depth of at least 1.6 mm. Tires worn below this limit are unsafe
    and illegal.
- id: 193
  category: vehicle_information
  question: Under Saskatchewan law, your vehicle's headlights must be strong enough
    to reveal objects at what minimum distance?
  choices:
    A: 100 metres
    B: 150 metres
    C: 200 metres
    D: 250 metres
  answer: B
  explanation: High beam headlights must be able to reveal a person or vehicle at
    a distance of at least 150 metres ahead.
- id: 194
  category: vehicle_information
  question: What is the Saskatchewan regulation regarding window tinting on the front
    side windows (driver and front passenger)?
  choices:
    A: Tinting is allowed up to 35% light transmittance
    B: Tinting is allowed up to 50% light transmittance
    C: No after-market tinting film is allowed on these windows
    D: Tinting is allowed only if the driver has a medical note
  answer: C
  explanation: In Saskatchewan, it is illegal to apply any after-market window tint
    film to the windshield or the front side windows.
- id: 195
  category: vehicle_information
  question: When driving at night in Saskatchewan, you must dim your high beams when
    an oncoming vehicle is within what distance?
  choices:
    A: 100 metres
    B: 200 metres
    C: 300 metres
    D: 500 metres
  answer: C
  explanation: The Saskatchewan Driver's Handbook states you must dim your headlights
    to low beam at least 300 metres before meeting an oncoming vehicle.
- id: 196
  category: vehicle_information
  question: When following another vehicle at night, at what distance must you dim
    your high beams to low beams?
  choices:
    A: 50 metres
    B: 100 metres
    C: 200 metres
    D: 300 metres
  answer: C
  explanation: You must switch to low beams when following within 200 metres of another
    vehicle to avoid blinding the driver ahead through their mirrors.
- id: 197
  category: vehicle_information
  question: 'Every motor vehicle in Saskatchewan must be equipped with a horn that
    can be heard from a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: Saskatchewan regulations require a horn capable of emitting sound audible
    under normal conditions from a distance of at least 60 metres.
- id: 198
  category: vehicle_information
  question: In Saskatchewan, brake lights must be visible from a distance of at least
    ____ in normal sunlight.
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 120 metres
  answer: B
  explanation: Brake lights must be red and clearly visible from a distance of 60
    metres in normal sunlight.
- id: 199
  category: vehicle_information
  question: If your vehicle's interior rear-view mirror is obstructed by a load or
    a trailer, what is the legal requirement for side mirrors?
  choices:
    A: Only a driver-side mirror is required
    B: Only a passenger-side mirror is required
    C: Both left and right outside mirrors are required
    D: No mirrors are required if you use a spotter
  answer: C
  explanation: If the view to the rear is obstructed, the vehicle must be equipped
    with mirrors on both the left and right sides to provide the driver with a clear
    view of the highway to the rear.
- id: 200
  category: vehicle_information
  question: What color must the light be that illuminates the rear license plate on
    a vehicle in Saskatchewan?
  choices:
    A: Red
    B: Blue
    C: White
    D: Amber
  answer: C
  explanation: The rear license plate must be illuminated by a white light so that
    the plate is clearly visible from a distance of 15 metres to the rear.
- id: 201
  category: vehicle_information
  question: When are mudguards (mud flaps) required on a vehicle in Saskatchewan?
  choices:
    A: Only on commercial trucks over 5,000 kg
    B: Only during the winter months (October to April)
    C: When the body of the vehicle does not provide adequate protection to prevent
      the rear wheels from throwing dirt/water
    D: They are never legally required for passenger cars
  answer: C
  explanation: Saskatchewan law requires mudguards or fenders that are wide enough
    to cover the full tread of the tire to prevent debris from being thrown at other
    vehicles.
- id: 202
  category: vehicle_information
  question: When towing a trailer in Saskatchewan, safety chains must be attached
    in which manner?
  choices:
    A: Wrapped tightly around the bumper
    B: Connected in a 'crossed' fashion under the tongue
    C: Connected only to the left side of the hitch
    D: Chains are only required if the trailer has no brakes
  answer: B
  explanation: Safety chains should be crossed under the trailer tongue to prevent
    the tongue from dropping to the ground if the primary hitch fails.
- id: 203
  category: vehicle_information
  question: According to Canadian federal standards adopted in Saskatchewan, all vehicles
    manufactured after what year must have automatic daytime running lights?
  choices:
    A: '1980'
    B: '1985'
    C: '1989'
    D: '1995'
  answer: C
  explanation: Federal law in Canada has required all vehicles made or imported after
    December 1, 1989, to be equipped with daytime running lights (DRLs).
- id: 204
  category: vehicle_information
  question: 'Regarding windshield condition, a vehicle in Saskatchewan will fail an
    inspection if there is a crack that:'
  choices:
    A: Is longer than 5 cm anywhere on the glass
    B: Is in the area swept by the windshield wipers and impairs the driver's view
    C: Is located on the passenger side only
    D: Has been repaired with resin
  answer: B
  explanation: A windshield must be free of cracks or chips that are in the driver's
    field of vision or within the area swept by the wipers if they interfere with
    safety.
- id: 205
  category: vehicle_information
  question: 'In Saskatchewan, it is illegal to operate a motor vehicle on a highway
    if the exhaust system is equipped with:'
  choices:
    A: A catalytic converter
    B: A muffler bypass or 'cut-out'
    C: Dual exhaust pipes
    D: A chrome tip
  answer: B
  explanation: Vehicle equipment regulations prohibit the use of muffler cut-outs,
    bypasses, or similar devices that increase noise or allow exhaust to bypass the
    muffler.
- id: 206
  category: vehicle_information
  question: According to Saskatchewan law, which windows on a vehicle are NOT permitted
    to have any after-market window tinting film applied?
  choices:
    A: The rear window only
    B: The rear side windows only
    C: The windshield and front side windows
    D: All windows are allowed to have tint
  answer: C
  explanation: Saskatchewan's Vehicle Equipment Regulations prohibit the application
    of any after-market tinting film to the windshield or the windows to the immediate
    left and right of the driver.
- id: 207
  category: vehicle_information
  question: During which time period are studded tires legally permitted for use on
    Saskatchewan roads?
  choices:
    A: November 1 to April 1
    B: October 1 to May 31
    C: September 1 to June 30
    D: Year-round
  answer: B
  explanation: In Saskatchewan, studded tires are permitted only between October 1
    and May 31 to prevent excessive road wear during the summer months.
- id: 208
  category: vehicle_information
  question: In Saskatchewan, if a vehicle's load extends more than how many metres
    past the rear of the vehicle, must it be marked with a red flag (day) or red light
    (night)?
  choices:
    A: 0.5 metres
    B: 1.0 metre
    C: 1.5 metres
    D: 2.0 metres
  answer: C
  explanation: If a load extends more than 1.5 metres (5 feet) beyond the rear of
    the vehicle, a red flag (at least 30cm square) must be attached during the day,
    and a red light at night.
- id: 209
  category: vehicle_information
  question: What is the legal requirement regarding the license plate light on a vehicle
    registered in Saskatchewan?
  choices:
    A: It must be blue or white
    B: It must be white and visible from 15 metres to the rear
    C: It is only required if driving outside city limits
    D: It must be red to match the taillights
  answer: B
  explanation: Saskatchewan law requires a white light to illuminate the rear license
    plate so that it is clearly legible from a distance of 15 metres.
- id: 210
  category: vehicle_information
  question: 'Under Saskatchewan regulations, a motor vehicle must have a muffler that
    prevents:'
  choices:
    A: All emissions from entering the cabin
    B: Excessive or unusual noise and annoying smoke
    C: The engine from overheating
    D: Any visible exhaust at all times
  answer: B
  explanation: The Vehicle Equipment Regulations state that mufflers must be in good
    working order to prevent excessive noise and annoying smoke; muffler cut-outs
    or bypasses are prohibited.
- id: 211
  category: vehicle_information
  question: In Saskatchewan, if your vehicle is equipped with a trailer, what is the
    requirement for safety chains?
  choices:
    A: They are only required for trailers over 2,000 kg
    B: They must be crossed under the hitch to create a cradle
    C: They are optional if the hitch has a locking pin
    D: They must be attached to the bumper of the towing vehicle
  answer: B
  explanation: SGI safety standards require safety chains to be connected and crossed
    under the tongue of the trailer to prevent the tongue from dropping to the ground
    if the hitch fails.
- id: 212
  category: vehicle_information
  question: When are you required to use your headlights in Saskatchewan?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: Only when visibility is less than 500 metres
    C: From one-half hour after sunset to one-half hour before sunrise, and whenever
      visibility is poor
    D: Only between 10:00 PM and 6:00 AM
  answer: C
  explanation: Saskatchewan law requires headlights to be on from a half-hour after
    sunset to a half-hour before sunrise, and at any time when atmospheric conditions
    (fog, snow, rain) make it difficult to see clearly.
- id: 213
  category: vehicle_information
  question: In Saskatchewan, what is the rule regarding mixing radial and bias-ply
    tires on the same vehicle?
  choices:
    A: They can be mixed as long as they are the same size
    B: They should never be mixed on the same axle
    C: Radial tires must always be on the front if mixed
    D: Mixing is only allowed on 4WD vehicles
  answer: B
  explanation: For safety and handling, Saskatchewan regulations and SGI recommend
    that you do not mix different types of tire construction (radial vs. bias-ply)
    on the same axle.
- id: 214
  category: vehicle_information
  question: A vehicle's service brakes must be able to stop the vehicle on a dry,
    level, paved surface within what distance when travelling at 30 km/h?
  choices:
    A: 6 metres
    B: 8 metres
    C: 12 metres
    D: 15 metres
  answer: B
  explanation: According to Saskatchewan vehicle standards, the service brakes must
    be capable of stopping the vehicle within 8 metres from a speed of 30 km/h.
- id: 215
  category: vehicle_information
  question: 'In Saskatchewan, a rearview mirror must provide the driver with a clear
    view of the highway to the rear for a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 200 metres
  answer: B
  explanation: The law requires mirrors to provide a view of the road behind the vehicle
    for at least 60 metres.
- id: 216
  category: vehicle_information
  question: If your vehicle's turn signal lights are broken, what is the legal requirement
    for driving in Saskatchewan?
  choices:
    A: You may drive only during daylight hours
    B: You must use hand and arm signals
    C: You cannot drive the vehicle under any circumstances
    D: You must keep your hazard lights on at all times
  answer: B
  explanation: If mechanical turn signals are not working, the Saskatchewan Driver's
    Handbook states you must use the standard hand and arm signals to indicate your
    intention to turn or stop.
- id: 217
  category: signs_and_signals
  question: When you see a steady yellow light at an intersection in Saskatchewan,
    what must you do?
  choices:
    A: Speed up to clear the intersection before it turns red.
    B: Stop immediately, even if you are in the middle of the intersection.
    C: Stop before entering the intersection unless you cannot stop safely.
    D: Continue through the intersection as if it were green.
  answer: C
  explanation: A steady yellow light means the signal is about to turn red. Drivers
    must stop before entering the intersection unless they are so close that a stop
    cannot be made safely.
- id: 218
  category: signs_and_signals
  question: What is the correct hand signal to indicate you are slowing down or stopping
    in Saskatchewan?
  choices:
    A: Left arm extended straight out the window.
    B: Left arm out and bent upward at the elbow.
    C: Left arm out and bent downward at the elbow, palm facing back.
    D: Right arm waving out the window.
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, the driver
    should extend their left arm out the window and bend it downward at the elbow
    with the palm facing backward.
- id: 219
  category: signs_and_signals
  question: In Saskatchewan, what does a solid white line painted on the pavement
    between two lanes of traffic mean?
  choices:
    A: Lane changing is prohibited.
    B: Lane changing is discouraged.
    C: Traffic is moving in opposite directions.
    D: You are approaching a school zone.
  answer: B
  explanation: A solid white line between lanes of traffic moving in the same direction
    indicates that lane changing is discouraged. While not strictly illegal like a
    double solid line, it signifies that it is safer to stay in your lane.
- id: 220
  category: signs_and_signals
  question: 'A sign shaped like an upside-down triangle with a red border and a white
    center is a:'
  choices:
    A: Stop sign
    B: Yield sign
    C: School zone sign
    D: Construction sign
  answer: B
  explanation: The equilateral triangle pointing downward is the standard shape for
    a yield sign in Saskatchewan and across Canada.
- id: 221
  category: signs_and_signals
  question: In Saskatchewan, what does a sign with a fluorescent yellow-green pentagon
    shape indicate?
  choices:
    A: A hospital is nearby.
    B: A railway crossing.
    C: A school zone or school crosswalk.
    D: A dead-end street.
  answer: C
  explanation: A pentagon-shaped sign (five sides) with a fluorescent yellow-green
    background is used to warn drivers they are approaching a school zone or a school
    crosswalk.
- id: 222
  category: signs_and_signals
  question: What do two solid yellow lines painted on the center of the road mean?
  choices:
    A: Passing is permitted if the road is clear.
    B: Passing is prohibited for traffic in both directions.
    C: Passing is permitted for traffic on the right side only.
    D: The road is a one-way street.
  answer: B
  explanation: Two solid yellow lines mean that passing is prohibited for traffic
    moving in both directions.
- id: 223
  category: signs_and_signals
  question: In Saskatchewan, what does a 'X' marking on the pavement indicate?
  choices:
    A: An intersection is ahead.
    B: A pedestrian crossing.
    C: A railway crossing ahead.
    D: No parking allowed.
  answer: C
  explanation: A large 'X' painted on the pavement, often accompanied by the letters
    'R R', indicates that you are approaching a railway crossing.
- id: 224
  category: signs_and_signals
  question: When a traffic light shows a steady red light and a green arrow, what
    are you permitted to do?
  choices:
    A: Proceed in any direction.
    B: Stop, then proceed in the direction of the arrow.
    C: Proceed only in the direction of the arrow, yielding to pedestrians.
    D: Wait for the main light to turn green before moving.
  answer: C
  explanation: A green arrow shown with a red light means you may proceed in the direction
    of the arrow, but you must yield the right of way to pedestrians in the crosswalk
    and other traffic lawfully in the intersection.
- id: 225
  category: signs_and_signals
  question: What is the meaning of a diamond-shaped sign with an orange background
    in Saskatchewan?
  choices:
    A: Regulatory sign (e.g., speed limit).
    B: Information sign (e.g., fuel or food).
    C: Warning sign for permanent hazards.
    D: Warning sign for temporary conditions or construction.
  answer: D
  explanation: Orange diamond-shaped signs are used to warn drivers of temporary conditions,
    such as construction zones, road maintenance, or utility work.
- id: 226
  category: signs_and_signals
  question: In Saskatchewan, if you are approaching a railway crossing with a stop
    sign, you must stop your vehicle within how many metres of the nearest rail?
  choices:
    A: Between 1 and 5 metres.
    B: Between 5 and 15 metres.
    C: Exactly 10 metres.
    D: At least 20 metres.
  answer: B
  explanation: When required to stop at a railway crossing in Saskatchewan, you must
    stop your vehicle no closer than 5 metres and no further than 15 metres from the
    nearest rail.
- id: 227
  category: signs_and_signals
  question: What is the correct hand signal for a right turn in Saskatchewan?
  choices:
    A: Left arm extended straight out.
    B: Left arm out and bent upward at the elbow.
    C: Left arm out and bent downward at the elbow.
    D: Right arm extended straight out.
  answer: B
  explanation: The hand signal for a right turn is the left arm extended out the window
    and bent upward at the elbow.
- id: 228
  category: signs_and_signals
  question: In Saskatchewan, what does a sign with a white background and a black
    circle containing a green border around a symbol mean?
  choices:
    A: The action shown in the circle is prohibited.
    B: The action shown in the circle is permitted.
    C: A warning of a hazard ahead.
    D: A school zone.
  answer: B
  explanation: A green circle on a regulatory sign indicates that the action or movement
    shown inside the circle is permitted (e.g., a green circle around a straight arrow
    means you must go straight).
- id: 229
  category: signs_and_signals
  question: What does a flashing amber (yellow) light at an intersection mean?
  choices:
    A: Stop and wait for it to turn green.
    B: The same as a stop sign.
    C: Slow down and proceed with caution.
    D: Speed up to clear the area.
  answer: C
  explanation: A flashing amber light is a warning to slow down and proceed through
    the intersection with caution, yielding to any pedestrians or traffic already
    in the intersection.
- id: 230
  category: signs_and_signals
  question: When you see a sign shaped like an equilateral triangle with the point
    at the bottom, what must you do?
  choices:
    A: Stop and wait for a green light
    B: Yield the right of way to other traffic
    C: Speed up to merge with traffic
    D: Watch for a school zone
  answer: B
  explanation: A downward-pointing equilateral triangle is the universal shape for
    a Yield sign, requiring drivers to give the right of way to traffic in the intersection
    or on the intersecting road.
- id: 231
  category: signs_and_signals
  question: What is the correct hand signal to indicate a right-hand turn?
  choices:
    A: Left arm extended straight out the window
    B: Left arm out and bent upward at the elbow
    C: Left arm out and bent downward at the elbow
    D: Right arm extended straight out the window
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at a 90-degree angle.
- id: 232
  category: signs_and_signals
  question: 'A sign with an orange background and a diamond shape is used to indicate:'
  choices:
    A: Regulatory rules
    B: School zones
    C: Construction or maintenance warnings
    D: Directional information
  answer: C
  explanation: Orange diamond-shaped signs are used in Saskatchewan to warn drivers
    of construction, road maintenance, or utility work ahead.
- id: 233
  category: signs_and_signals
  question: What does a white diamond symbol painted on a specific lane of the road
    mean?
  choices:
    A: The lane is for high-speed traffic only
    B: The lane is reserved for specific types of vehicles
    C: The lane is a pedestrian crosswalk
    D: The lane is closed for construction
  answer: B
  explanation: A white diamond on the pavement indicates a reserved lane, which may
    be restricted to buses, bicycles, or high-occupancy vehicles (HOV) as indicated
    by nearby signs.
- id: 234
  category: signs_and_signals
  question: In Saskatchewan, when are you permitted to turn left on a red traffic
    light?
  choices:
    A: Never
    B: From a two-way street onto a one-way street
    C: From a one-way street onto another one-way street
    D: Whenever there is no oncoming traffic
  answer: C
  explanation: Saskatchewan law allows a left turn on a red light only when turning
    from a one-way street onto another one-way street, after coming to a complete
    stop and yielding to pedestrians and other traffic.
- id: 235
  category: signs_and_signals
  question: What does a pentagon-shaped (five-sided) sign indicate?
  choices:
    A: A railway crossing
    B: A hospital zone
    C: A school zone or school crosswalk
    D: A dead end
  answer: C
  explanation: A five-sided sign (pentagon) is used exclusively to warn drivers that
    they are approaching a school zone or a school crosswalk.
- id: 236
  category: signs_and_signals
  question: 'A solid yellow line next to a broken yellow line on the pavement means:'
  choices:
    A: Passing is prohibited for all vehicles
    B: Passing is permitted for all vehicles
    C: Passing is permitted only for the side with the broken line
    D: Passing is permitted only for the side with the solid line
  answer: C
  explanation: When a solid and a broken yellow line are together, drivers on the
    side of the broken line may pass if it is safe, while drivers on the side of the
    solid line are prohibited from passing.
- id: 237
  category: signs_and_signals
  question: What does a green arrow shown with a red traffic light mean?
  choices:
    A: You must stop and wait for a green circle
    B: You may proceed cautiously in the direction of the arrow
    C: The arrow is a warning that the light is changing
    D: Only emergency vehicles may proceed
  answer: B
  explanation: A green arrow with a red light means you have a 'protected' turn in
    the direction of the arrow, provided you yield to pedestrians and any traffic
    already in the intersection.
- id: 238
  category: signs_and_signals
  question: Which hand signal is used to indicate that a driver is slowing down or
    stopping?
  choices:
    A: Left arm extended straight out
    B: Left arm out and upward
    C: Left arm out and downward
    D: Right arm out and downward
  answer: C
  explanation: The hand signal for slowing or stopping is the left arm extended out
    the window and bent downward at the elbow with the palm facing backward.
- id: 239
  category: signs_and_signals
  question: What is the meaning of a 'X' shaped sign at a roadway?
  choices:
    A: No entry allowed
    B: A railway crossing
    C: A four-way stop
    D: A cross-walk ahead
  answer: B
  explanation: The 'X' (crossbuck) sign is used to identify a railway crossing and
    carries the same meaning as a yield sign.
- id: 240
  category: signs_and_signals
  question: In Saskatchewan, what does a steady circular green light mean?
  choices:
    A: Go, you have the right of way over everyone
    B: Proceed straight through or turn left or right unless a sign prohibits it
    C: Stop and then proceed
    D: Only turn left
  answer: B
  explanation: A green light means you may proceed straight or turn (if not prohibited),
    but you must still yield to pedestrians and vehicles already in the intersection.
