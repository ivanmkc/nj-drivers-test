questions:
- id: 1
  category: driver_testing
  question: ¿Qué sucede si abandona el área del examen de conocimientos mientras su
    examen está en curso?
  choices:
    A: Su examen se pausará hasta que regrese.
    B: Recibirá una calificación reprobatoria en el examen.
    C: Se le cobrará una tarifa de examen adicional.
    D: Debe volver a realizar el examen al día siguiente.
  answer: B
  explanation: De acuerdo con el manual, recibirá una calificación reprobatoria si
    abandona el área de examen mientras su prueba está en curso.
- id: 2
  category: driver_testing
  question: ¿Cuál de las siguientes oficinas de licencias de conducir permanece abierta
    durante la hora de almuerzo de 12:00 a 1:00 p. m.?
  choices:
    A: Fargo
    B: Dickinson
    C: Williston
    D: Jamestown
  answer: A
  explanation: El manual establece que todos los centros cierran de 12:00 a 1:00 p.
    m., excepto Bismarck, Minot, Grand Forks y Fargo.
- id: 3
  category: driver_testing
  question: Si un día festivo reconocido cae en sábado, ¿cuándo cierra la oficina
    de licencias de conducir?
  choices:
    A: El lunes siguiente
    B: El jueves anterior
    C: El viernes anterior
    D: El martes siguiente
  answer: C
  explanation: El manual especifica que si los días festivos caen en sábado, el viernes
    anterior se considera el día festivo.
- id: 4
  category: license_system
  question: ¿Qué se requiere para todos los solicitantes menores de 18 años al solicitar
    un permiso o licencia?
  choices:
    A: Un diploma de escuela secundaria o equivalente.
    B: Una firma de aprobación y patrocinio de un padre, tutor legal o persona designada.
    C: Una carta de recomendación de un instructor de educación vial.
    D: Prueba de al menos 60 horas de conducción supervisada.
  answer: B
  explanation: Todos los solicitantes menores de 18 años deben tener a un padre, tutor
    legal o persona designada que firme la aprobación y el patrocinio en la solicitud.
- id: 5
  category: driver_testing
  question: ¿Con cuánta anticipación debe llegar para realizar un examen de conocimientos
    antes de que la oficina cierre para el almuerzo o por el día?
  choices:
    A: No más tarde de 15 minutos antes
    B: No más tarde de 30 minutos antes
    C: No más tarde de 45 minutos antes
    D: No más tarde de una hora antes
  answer: D
  explanation: Debe llegar a más tardar una hora antes del mediodía (si realiza el
    examen en una oficina que cierra para el almuerzo) y a más tardar una hora antes
    del cierre.
- id: 6
  category: driver_testing
  question: ¿Qué sucederá si lleva un teléfono celular o una mochila al área del examen
    de conocimientos?
  choices:
    A: Recibirá una calificación reprobatoria en el examen.
    B: Los artículos se guardarán en la recepción.
    C: Se le pedirá que apague el teléfono.
    D: Se le dará una advertencia.
  answer: A
  explanation: 'No se permiten teléfonos celulares, mochilas ni otros dispositivos
    electrónicos en el área de examen. El manual establece: ''IMPORTANTE: Recibirá
    una calificación reprobatoria si lleva cualquiera de estos artículos al área de
    examen''.'
- id: 7
  category: driver_testing
  question: ¿Qué documento específico se requiere para los solicitantes del examen
    de conducción que son menores de 16 años?
  choices:
    A: Un formulario de autorización médica
    B: Un Certificado de Capacitación de educación vial
    C: Un expediente académico de la escuela secundaria
    D: Un ensayo escrito sobre seguridad vial
  answer: B
  explanation: Los solicitantes menores de 16 años deben presentar un Certificado
    de Capacitación de educación vial.
- id: 8
  category: driver_testing
  question: ¿Quién debe acompañar a un solicitante menor de 16 años a su examen de
    conducción?
  choices:
    A: Un conductor con licencia mayor de 21 años
    B: Un instructor de educación vial
    C: Un padre o tutor legal
    D: Cualquier familiar mayor de 18 años
  answer: C
  explanation: El manual establece que los solicitantes menores de 16 años deben estar
    acompañados por un padre o tutor legal.
- id: 9
  category: driver_testing
  question: ¿Cuál es la política con respecto a los vehículos con sistema de estacionamiento
    automático durante el examen de conducción?
  choices:
    A: Se recomiendan para la parte de estacionamiento en paralelo.
    B: Se permiten solo si el examinador lo aprueba.
    C: No están permitidos a menos que la función de estacionamiento automático esté
      desactivada.
    D: Solo se permiten para solicitantes mayores de 18 años.
  answer: C
  explanation: No se permiten vehículos con sistema de estacionamiento automático.
    El solicitante debe realizar el examen en un vehículo diferente o desactivar la
    función de estacionamiento automático.
- id: 10
  category: vehicle_information
  question: Durante la inspección del vehículo para un examen de conducción, ¿a qué
    distancia debe ser claramente audible la bocina del vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Para aprobar la inspección, su vehículo debe tener una bocina claramente
    audible a una distancia de 200 pies.
- id: 11
  category: vehicle_information
  question: ¿De acuerdo con la lista de verificación de inspección del vehículo, su
    vehículo debe tener espejos que le permitan ver el camino a qué distancia detrás
    de usted?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El vehículo debe tener uno o más espejos para que usted pueda ver el
    camino 200 pies detrás de usted.
- id: 12
  category: license_system
  question: ¿Cuántos días consecutivos debe vivir una persona en Dakota del Norte
    para ser considerada residente a efectos de la licencia de conducir (excluyendo
    estudiantes no residentes, turistas o militares)?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Cualquier persona que no sea un estudiante no residente, un turista
    o un miembro no residente de las Fuerzas Armadas que haya vivido en este estado
    durante 90 días consecutivos, será considerada residente de Dakota del Norte a
    efectos de la licencia de conducir.
- id: 13
  category: license_system
  question: Después de convertirse en residente de Dakota del Norte, ¿durante cuánto
    tiempo puede operar un vehículo Clase D con una licencia de operador de otro estado?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Usted puede operar un vehículo Clase D o M con una licencia de operador
    de otro estado por un período de 60 días después de convertirse en residente.
- id: 14
  category: driver_testing
  question: ¿Cuál de los siguientes NO está permitido en el vehículo durante una prueba
    de manejo?
  choices:
    A: Comprobante de seguro
    B: Registro actual del vehículo
    C: Pasajeros
    D: Cinturones de seguridad
  answer: C
  explanation: No se permitirán mascotas (excepto animales de servicio o de alerta
    médica), pasajeros ni dispositivos electrónicos como teléfonos celulares en el
    vehículo durante la prueba de manejo.
- id: 15
  category: driver_testing
  question: ¿Cuál de los siguientes elementos debe proporcionar un solicitante para
    el vehículo utilizado durante la prueba de manejo?
  choices:
    A: Una factura de venta
    B: Comprobante de seguro vigente
    C: Un informe del historial del vehículo
    D: Un registro de mantenimiento
  answer: B
  explanation: El manual establece que el solicitante debe proporcionar un comprobante
    de seguro vigente para el vehículo utilizado durante la prueba de manejo.
- id: 16
  category: license_system
  question: ¿Cuántos días tienen los operadores de vehículos comerciales Clase A,
    B o C para adquirir una Licencia de Conducir Comercial (CDL) de Dakota del Norte
    después de convertirse en residentes?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los operadores de vehículos Clase A, B o C tienen 30 días para adquirir
    una Licencia de Conducir Comercial de Dakota del Norte después de convertirse
    en residentes.
- id: 17
  category: license_system
  question: ¿Cuál es la edad mínima para que un no residente conduzca legalmente en
    Dakota del Norte con una licencia válida de su estado o país de origen?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: C
  explanation: Un no residente debe tener al menos 16 años de edad para conducir en
    Dakota del Norte, siempre que tenga una licencia válida de su estado o país de
    origen.
- id: 18
  category: alcohol_drugs_health
  question: ¿Bajo qué condición puede una persona con antecedentes de convulsiones
    o desmayos obtener una licencia de conducir de Dakota del Norte?
  choices:
    A: Si no ha tenido convulsiones durante al menos tres meses consecutivos.
    B: Si no ha tenido convulsiones durante al menos seis meses consecutivos y se
      somete a un examen médico.
    C: Si no ha tenido convulsiones durante al menos un año y proporciona una nota
      del médico.
    D: Las personas con antecedentes de convulsiones nunca pueden obtener una licencia
      de conducir.
  answer: B
  explanation: Se hace una excepción si la persona en cuestión no ha tenido convulsiones
    durante al menos seis meses consecutivos y está dispuesta a someterse al examen
    médico requerido.
- id: 19
  category: license_system
  question: ¿Cuáles son los requisitos para el conductor supervisor cuando usted está
    practicando con un Permiso de Instrucción?
  choices:
    A: Al menos 16 años de edad con un año de experiencia de manejo.
    B: Al menos 18 años de edad con al menos tres años de experiencia de manejo.
    C: Al menos 21 años de edad con al menos un año de experiencia de manejo.
    D: Al menos 25 años de edad con al menos cinco años de experiencia de manejo.
  answer: B
  explanation: El conductor supervisor debe tener una licencia válida para la clase
    de vehículo que se conduce, tener al menos 18 años de edad y haber tenido al menos
    tres años de experiencia de manejo.
- id: 20
  category: safe_driving_rules
  question: Al conducir con un Permiso de Instrucción, ¿quién puede sentarse en el
    asiento delantero además del titular del permiso y el conductor supervisor?
  choices:
    A: Solo familiares inmediatos.
    B: Hasta dos pasajeros adicionales.
    C: Nadie más, a menos que el vehículo solo tenga un asiento delantero.
    D: Cualquier persona, siempre que lleve puesto el cinturón de seguridad.
  answer: C
  explanation: Ninguna persona que no sea el conductor supervisor y el titular del
    permiso puede estar en el asiento delantero, a menos que el vehículo solo tenga
    un asiento delantero.
- id: 21
  category: license_system
  question: ¿Cuánto tiempo debe un joven de 14 o 15 años tener un permiso de instrucción
    antes de completar el examen de conducir para una licencia de operador?
  choices:
    A: 6 meses o hasta los 16 años, lo que ocurra primero.
    B: 12 meses o hasta los 16 años, lo que ocurra primero, pero no menos de seis
      meses.
    C: 12 meses independientemente de su edad.
    D: 3 meses si han completado la educación vial.
  answer: B
  explanation: Las personas que tienen 14 o 15 años deben tener el permiso de instrucción
    durante 12 meses o hasta los 16 años, lo que ocurra primero, pero no menos de
    seis meses.
- id: 22
  category: driver_testing
  question: ¿Cuántas horas de práctica de conducción supervisada deben completar las
    personas menores de 16 años antes de realizar su examen de conducir?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Las personas menores de 16 años deben completar un mínimo de 50 horas
    de práctica de conducción supervisada en condiciones variables.
- id: 23
  category: driver_testing
  question: ¿Qué capacitación de conductor se requiere para eximir el examen de conducir
    de Clase D utilizando un Certificado de Finalización de Curso?
  choices:
    A: 10 horas de capacitación en el aula y 2 horas al volante.
    B: 20 horas de capacitación en el aula y 4 horas al volante.
    C: 30 horas de capacitación en el aula y 6 horas al volante.
    D: 50 horas de capacitación en el aula y 10 horas al volante.
  answer: C
  explanation: El examen de conducir puede eximirse presentando un certificado que
    acredite la finalización de un mínimo de 30 horas de capacitación de conductor
    en el aula y un mínimo de seis horas de capacitación real al volante.
- id: 24
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir infringiendo las condiciones de un permiso
    de instrucción?
  choices:
    A: Una sanción de 1 punto en su historial de conducción.
    B: Una sanción de 2 puntos en su historial de conducción.
    C: Una sanción de 4 puntos en su historial de conducción.
    D: Suspensión inmediata de la licencia por 30 días.
  answer: B
  explanation: Es una sanción de dos puntos en su historial de conducción por conducir
    infringiendo las condiciones de un permiso de instrucción.
- id: 25
  category: license_system
  question: ¿Qué debe hacer un joven de 14 o 15 años para recibir una licencia para
    operar una motocicleta?
  choices:
    A: Completar 50 horas de práctica supervisada en motocicleta.
    B: Tener una licencia de operador Clase D válida durante al menos 6 meses.
    C: Completar con éxito un curso de seguridad en motocicleta aprobado y aprobar
      el examen de conocimientos sobre motocicletas.
    D: Obtener una exención del examen de conducir de un programa de educación vial
      de la escuela secundaria.
  answer: C
  explanation: Si tiene 14 o 15 años, puede recibir una licencia para operar una motocicleta
    completando con éxito un curso de seguridad en motocicleta aprobado y aprobando
    el examen de conocimientos sobre motocicletas.
- id: 26
  category: license_system
  question: ¿Cuál es la edad mínima requerida para operar una bicicleta motorizada
    en Dakota del Norte?
  choices:
    A: 12 años de edad
    B: 14 años de edad
    C: 15 años de edad
    D: 16 años de edad
  answer: B
  explanation: Para operar una bicicleta motorizada, debe tener al menos 14 años de
    edad o más y tener en su posesión inmediata un permiso o licencia válida.
- id: 27
  category: license_system
  question: Si su nombre actual es diferente al nombre en su documento de identidad,
    ¿cuál de los siguientes es un documento aceptable para probar su cambio de nombre
    legal?
  choices:
    A: Un certificado de nacimiento del hospital
    B: Una carta notariada de un padre o tutor
    C: Un certificado de matrimonio certificado
    D: Una fotocopia de una orden judicial
  answer: C
  explanation: Los documentos aceptables para la prueba de cambio de nombre son un
    certificado de matrimonio certificado, un documento de adopción certificado o
    una orden judicial certificada (no se aceptan fotocopias).
- id: 28
  category: license_system
  question: ¿Cuántos documentos se requieren para proporcionar una prueba satisfactoria
    de la dirección de residencia en Dakota del Norte?
  choices:
    A: Un documento
    B: Dos documentos
    C: Tres documentos
    D: Cuatro documentos
  answer: B
  explanation: Se requiere prueba de la dirección de residencia en Dakota del Norte
    (lugar de domicilio) mediante la presentación de dos documentos de la lista aprobada.
- id: 29
  category: license_system
  question: Si un residente de Dakota del Norte tiene una licencia de operador válida
    cuando sale del estado para el servicio activo en las Fuerzas Armadas, ¿cuánto
    tiempo permanece válida la licencia?
  choices:
    A: Hasta 10 días después del licenciamiento o separación del servicio.
    B: Hasta 30 días después del licenciamiento o separación del servicio.
    C: Hasta 60 días después del licenciamiento o separación del servicio.
    D: Hasta 90 días después del licenciamiento o separación del servicio.
  answer: B
  explanation: Si estas personas tenían una licencia de operador válida cuando salieron
    del estado, esta seguirá siendo válida hasta 30 días después del licenciamiento
    o separación del servicio.
- id: 30
  category: license_system
  question: ¿Cuál de los siguientes NO es aceptable como prueba de una dirección de
    residencia física?
  choices:
    A: Una factura de servicios públicos actual
    B: Un apartado de correos (P.O. Box)
    C: Un talón de pago actual
    D: Una póliza de seguro de vehículo actual
  answer: B
  explanation: 'El manual establece explícitamente: "Los apartados de correos NO son
    aceptables para la dirección de residencia".'
- id: 31
  category: driver_testing
  question: ¿Quién es responsable de proporcionar el vehículo para un examen de conducción?
  choices:
    A: La oficina de Licencias de Conducir
    B: El solicitante de la licencia
    C: Una escuela de manejo comercial
    D: El Departamento de Transporte
  answer: B
  explanation: 'El manual establece: "Los solicitantes de licencias deben proporcionar
    su propio vehículo para el examen de conducción".'
- id: 32
  category: driver_testing
  question: Si reprueba cualquier parte del examen de conducir, ¿cuándo puede volver
    a tomarlo?
  choices:
    A: Inmediatamente
    B: El mismo día
    C: No se le permitirá volver a tomarlo el mismo día
    D: Después de esperar 30 días
  answer: C
  explanation: 'El manual establece: "Si reprueba cualquiera de los exámenes, no se
    le permitirá volver a tomar el examen el mismo día".'
- id: 33
  category: driver_responsibility
  question: ¿Cómo se asignan los órganos donados a los receptores?
  choices:
    A: Basado en la edad y las condiciones de salud del donante
    B: Basado en la urgencia médica, el tiempo de espera, la compatibilidad genética
      y la geografía
    C: Basado en la situación financiera del receptor
    D: Basado en un sistema de lotería aleatorio
  answer: B
  explanation: 'El manual establece: "Los órganos se asignan a los receptores en función
    de la urgencia médica, el tiempo de espera, la compatibilidad genética y la geografía".'
- id: 34
  category: license_system
  question: Cuando un joven de 15 años completa con éxito el examen de conducción,
    se le otorga una licencia Clase D restringida. ¿Los vehículos de quiénes están
    restringidos a operar?
  choices:
    A: Cualquier vehículo registrado en North Dakota
    B: Solo vehículos equipados con controles duales
    C: Los vehículos de sus padres, tutores, abuelos, hermanos, tíos o tías
    D: Solo vehículos propiedad de una escuela de manejo autorizada
  answer: C
  explanation: 'El manual establece: "Mientras posea una licencia de operador Clase
    D restringida, el conductor está limitado a operar los vehículos de sus padres,
    tutores, abuelos, hermanos, tíos o tías".'
- id: 35
  category: safe_driving_rules
  question: ¿Entre qué horas no puede conducir sin un adulto un joven de 15 años con
    una licencia Clase D restringida (a menos que se aplique una excepción)?
  choices:
    A: Entre la puesta del sol o las 9:00 p.m. (lo que ocurra más tarde) y las 5:00
      a.m.
    B: Entre las 10:00 p.m. y las 6:00 a.m.
    C: Entre la puesta del sol y el amanecer
    D: Entre las 8:00 p.m. y las 7:00 a.m.
  answer: A
  explanation: El manual establece que a los 15 años, la persona no tiene permitido
    operar un vehículo sin un padre, tutor legal o una persona de al menos 18 años
    de edad "entre lo que ocurra más tarde, la puesta del sol o las 9:00 p.m., y las
    5:00 a.m.".
- id: 36
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción válida para que un joven de 15
    años con una licencia Clase D restringida conduzca solo durante las horas nocturnas
    restringidas?
  choices:
    A: Conducir a la casa de un amigo
    B: Conducir directamente hacia o desde una actividad escolar oficial
    C: Conducir a una película nocturna
    D: Conducir al supermercado
  answer: B
  explanation: 'El manual establece: "La única excepción a esto es conducir directamente
    hacia o desde el trabajo, una actividad escolar oficial o una actividad religiosa".'
- id: 37
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias puede un conductor con licencia menor de 18 años
    usar un dispositivo de comunicación electrónica mientras conduce?
  choices:
    A: Para leer un mensaje de texto en un semáforo en rojo
    B: Para responder una llamada telefónica de un padre
    C: Para obtener asistencia de emergencia
    D: Para seleccionar música en una lista de reproducción
  answer: C
  explanation: 'El manual prohíbe el uso de dispositivos de comunicación electrónica
    para conductores menores de 18 años, pero señala: "La única excepción es para
    obtener asistencia de emergencia, para prevenir un delito que parece estar a punto
    de cometerse, o ante la creencia razonable de que la vida o la seguridad de una
    persona está en peligro".'
- id: 38
  category: penalties_and_points
  question: Si a un menor de 18 años se le cancela la licencia por una infracción
    relacionada con el alcohol o las drogas, ¿qué sucede con los puntos de su historial
    de conducción?
  choices:
    A: Los puntos vuelven automáticamente a cero.
    B: Los puntos se transfieren a la licencia de sus padres.
    C: El total de puntos no vuelve automáticamente a cero.
    D: Los puntos se reducen a la mitad.
  answer: C
  explanation: 'El manual establece: "El total de puntos no vuelve automáticamente
    a cero cuando se cumplen los requisitos de cancelación".'
- id: 39
  category: license_system
  question: ¿Qué indica la Restricción "1" en su permiso o licencia?
  choices:
    A: Espejos exteriores
    B: Transmisión automática
    C: Conducción solo durante el día
    D: Lentes correctivos
  answer: D
  explanation: Según la lista de Restricciones Estándar en el manual, la Restricción
    1 es para "Lentes correctivos".
- id: 40
  category: license_system
  question: ¿Con cuánta antelación puede renovar su licencia de conducir antes de
    su vencimiento sin perder el tiempo restante de la licencia anterior?
  choices:
    A: 3 meses
    B: 6 meses
    C: 10 meses
    D: 12 meses
  answer: C
  explanation: 'El manual establece: "Puede renovar su licencia 10 meses antes del
    vencimiento sin perder el tiempo restante de la licencia anterior".'
- id: 41
  category: license_system
  question: Al renovar su licencia, si presenta un certificado de visión obtenido
    de un médico u optometrista, ¿qué antigüedad máxima puede tener el certificado?
  choices:
    A: No más de 30 días
    B: No más de 6 meses
    C: No más de 1 año
    D: No más de 2 años
  answer: B
  explanation: 'El manual establece: "El certificado no debe tener más de seis meses
    de antigüedad".'
- id: 42
  category: license_system
  question: ¿A qué edad una licencia de operador Clase D restringida pasa a ser una
    licencia sin restricciones?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: A
  explanation: 'El manual establece: "A los 16 años, la licencia de operador Clase
    D restringida pasa a ser una licencia sin restricciones".'
- id: 43
  category: driver_responsibility
  question: Si pierde permanentemente el uso de una mano, brazo, pie, pierna u ojo,
    ¿qué debe hacer?
  choices:
    A: Entregar su licencia de conducir inmediatamente a las autoridades policiales.
    B: Informarlo a la División de Licencias de Conducir (Driver License Division).
    C: Dejar de conducir por al menos 6 meses.
    D: Volver a tomar el examen escrito de conocimientos.
  answer: B
  explanation: 'El manual establece: "Si pierde permanentemente el uso de una mano,
    brazo, pie, pierna u ojo, debe informarlo a: Driver License Division, North Dakota
    Department of Transportation..."'
- id: 44
  category: license_system
  question: Si cambia su nombre o dirección, ¿dentro de cuántos días debe notificar
    a la División de Licencias de Conducir (Driver License Division)?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Según el manual, si cambia su nombre o dirección, debe notificar a
    la División de Licencias de Conducir dentro de los 10 días y proporcionar evidencia
    documental.
- id: 45
  category: vehicle_information
  question: ¿Cuándo debe registrarse un vehículo motorizado en Dakota del Norte si
    el propietario se convierte en residente o tiene un empleo remunerado en el estado?
  choices:
    A: Dentro de 30 días
    B: Dentro de 60 días
    C: Inmediatamente
    D: Antes de que expire el registro de fuera del estado
  answer: C
  explanation: La ley de Dakota del Norte exige que un vehículo motorizado se registre
    inmediatamente cuando el propietario u operador se convierta en residente del
    estado o tenga un empleo remunerado en el estado.
- id: 46
  category: vehicle_information
  question: ¿Por cuánto tiempo están disponibles los permisos de registro temporal
    si planea estar en Dakota del Norte solo por un corto tiempo?
  choices:
    A: 30 o 60 días
    B: 3 meses o 6 meses
    C: 6 meses o 12 meses
    D: 12 meses o 24 meses
  answer: C
  explanation: Los permisos de registro temporal están disponibles por seis meses
    o 12 meses para aquellos cuya licencia de fuera del estado esté vigente y que
    planeen estar en Dakota del Norte solo por un corto tiempo.
- id: 47
  category: license_system
  question: Una licencia estándar Clase D le permite conducir un solo vehículo que
    pese menos de 26,001 libras de GVWR (Clasificación de Peso Bruto Vehicular) y
    remolcar un remolque que pese hasta ¿cuánto?
  choices:
    A: 5,000 libras de GVWR
    B: 10,000 libras de GVWR
    C: 15,000 libras de GVWR
    D: 26,000 libras de GVWR
  answer: B
  explanation: Una licencia Clase D permite la operación de cualquier vehículo individual
    de menos de 26,001 libras de GVWR y puede remolcar remolques que no superen las
    10,000 libras de GVWR.
- id: 48
  category: license_system
  question: ¿Qué clase de licencia se requiere para un solo vehículo diseñado para
    transportar a 16 o más pasajeros, incluido el conductor?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase M
  answer: C
  explanation: Una licencia Clase C es para cualquier vehículo individual con un GVWR
    de 26,000 libras o menos que esté diseñado para transportar 16 o más pasajeros
    o que transporte materiales peligrosos.
- id: 49
  category: license_system
  question: Bajo la exención agrícola, un joven de 15 años puede conducir un vehículo
    agrícola que transporte productos agrícolas a una distancia de ¿cuántas millas
    de la granja del conductor?
  choices:
    A: 50 millas
    B: 100 millas
    C: 150 millas
    D: 200 millas
  answer: C
  explanation: Bajo la exención agrícola, un joven de 15 años puede conducir un vehículo
    agrícola dentro de las 150 millas de la granja del conductor cuando transporte
    productos agrícolas o suministros agrícolas.
- id: 50
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de las señales reglamentarias en calles
    y carreteras?
  choices:
    A: Advertir a los conductores sobre condiciones potencialmente peligrosas más
      adelante
    B: Guiar a los conductores hacia destinos y servicios específicos
    C: Controlar y regular el tráfico mediante instrucciones obligatorias
    D: Indicar puntos de interés histórico o cultural
  answer: C
  explanation: Las señales reglamentarias controlan y regulan el tráfico. Dan instrucciones
    obligatorias al conductor.
- id: 51
  category: signs_and_signals
  question: Si se aproxima a una señal de Pare (Stop) en una intersección sin línea
    de parada ni cruce de peatones, ¿dónde debe detenerse?
  choices:
    A: Exactamente en la señal de Pare (Stop)
    B: Tan cerca como sea posible antes de la intersección donde pueda ver con seguridad
      el tráfico que se aproxima
    C: Diez pies antes de la intersección
    D: En medio de la intersección para verificar el tráfico
  answer: B
  explanation: Si no hay una línea de parada o un cruce de peatones, deténgase lo
    más cerca posible antes de la intersección donde pueda ver con seguridad el tráfico
    que se aproxima desde todas las direcciones.
- id: 52
  category: signs_and_signals
  question: Una señal de Límite de Velocidad (Speed Limit) muestra la velocidad máxima
    permitida bajo ¿qué condiciones?
  choices:
    A: Condiciones peligrosas
    B: Condiciones ideales
    C: Condiciones de tráfico pesado
    D: Solo condiciones nocturnas
  answer: B
  explanation: La señal de Límite de Velocidad es un ejemplo de una señal reglamentaria
    que muestra la velocidad máxima permitida bajo condiciones ideales.
- id: 53
  category: signs_and_signals
  question: En una señal reglamentaria, ¿qué indica un círculo rojo con una raya diagonal
    roja?
  choices:
    A: La acción mostrada está prohibida
    B: La acción mostrada es recomendada
    C: Debe ceder el paso a la acción mostrada
    D: Hay un peligro más adelante
  answer: A
  explanation: Algunas señales reglamentarias prohíben ciertas acciones. Un círculo
    rojo con una raya diagonal roja indica que la acción está prohibida.
- id: 54
  category: signs_and_signals
  question: ¿Cuál es el propósito de un carril exclusivo para girar a la izquierda
    en ambos sentidos (Two-way Left Turn Only) en el centro de la calzada?
  choices:
    A: Se utiliza para rebasar vehículos que circulan despacio
    B: Se utiliza únicamente por vehículos que giran a la izquierda en cualquiera
      de las dos direcciones
    C: Es un carril designado para vehículos de emergencia
    D: Se utiliza para vehículos que realizan giros a la derecha
  answer: B
  explanation: Las señales de carril exclusivo para girar a la izquierda en ambos
    sentidos se utilizan cuando un carril en el centro de la calzada debe ser usado
    únicamente por vehículos que giran a la izquierda en cualquier dirección. No está
    destinado para pasar o rebasar a otros vehículos.
- id: 55
  category: signs_and_signals
  question: ¿De qué color son la mayoría de las señales de advertencia utilizadas
    para avisarle de condiciones potencialmente peligrosas más adelante?
  choices:
    A: Rojas con letras blancas
    B: Blancas con letras negras
    C: Amarillas con leyenda negra
    D: Verdes con letras blancas
  answer: C
  explanation: Las señales de advertencia se utilizan para avisarle de condiciones
    potencialmente peligrosas más adelante y son amarillas con leyenda negra.
- id: 56
  category: signs_and_signals
  question: ¿Qué señal es redonda con letras negras sobre un fondo amarillo?
  choices:
    A: Señal de No Entrar (Do Not Enter)
    B: Señal de Ceda el Paso (Yield)
    C: Señal de Zona Escolar (School Zone)
    D: Señal de advertencia anticipada de cruce de ferrocarril (Railroad Advance Warning)
  answer: D
  explanation: La señal de advertencia anticipada de cruce de ferrocarril es redonda
    con letras negras sobre un fondo amarillo. Indica que se está acercando a un cruce
    de ferrocarril.
- id: 57
  category: signs_and_signals
  question: Una señal de vehículo de movimiento lento es un triángulo naranja con
    un borde reflectante rojo. Se monta en la parte trasera de los vehículos que viajan
    a ¿qué velocidad o menos?
  choices:
    A: 15 millas por hora
    B: 25 millas por hora
    C: 35 millas por hora
    D: 45 millas por hora
  answer: B
  explanation: La señal de vehículo de movimiento lento se monta en la parte trasera
    de los vehículos o equipos que son remolcados a una velocidad de 25 millas por
    hora o menos.
- id: 58
  category: signs_and_signals
  question: ¿Qué colores pueden utilizarse para las señales de peatones y escolares?
  choices:
    A: Verde-amarillo fluorescente o amarillo estándar
    B: Naranja o rojo
    C: Azul o verde
    D: Blanco o negro
  answer: A
  explanation: Según el manual, las señales de peatones y escolares pueden ser de
    color verde-amarillo fluorescente o amarillo estándar.
- id: 59
  category: signs_and_signals
  question: ¿Qué indican las franjas diagonales en una barricada o panel vertical
    que se inclinan hacia abajo a la derecha?
  choices:
    A: La carretera está cerrada más adelante.
    B: El conductor debe mantenerse a la derecha.
    C: El conductor debe mantenerse a la izquierda.
    D: Hay un cruce de peatones más adelante.
  answer: B
  explanation: Según el manual, las franjas que se inclinan hacia abajo a la derecha
    significan que el conductor debe mantenerse a la derecha.
- id: 60
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por no cumplir con los límites de velocidad en
    zonas de obras cuando el trabajo está en progreso y hay trabajadores presentes?
  choices:
    A: $50
    B: $80
    C: $100
    D: $150
  answer: B
  explanation: El incumplimiento de los límites de velocidad en zonas de obras conlleva
    una multa mínima de $80 cuando el trabajo está en progreso y hay trabajadores
    presentes.
- id: 61
  category: defensive_driving
  question: De acuerdo con los consejos de seguridad en zonas de obras, ¿quiénes sufren
    la mayoría de las víctimas de tráfico en estas zonas?
  choices:
    A: Trabajadores de construcción de carreteras
    B: Peatones y ciclistas
    C: Automovilistas y pasajeros
    D: Señaleros (banderilleros)
  answer: C
  explanation: El manual establece que el 98 por ciento de las muertes en zonas de
    obras son viajeros, y que los automovilistas y pasajeros sufren la mayoría de
    las víctimas de tráfico en las zonas de obras.
- id: 62
  category: signs_and_signals
  question: ¿De qué color son las señales de servicio, como las que indican hospitales
    o gasolineras?
  choices:
    A: Símbolos blancos sobre fondo azul
    B: Letras blancas sobre fondo verde
    C: Símbolos blancos sobre fondo marrón
    D: Letras negras sobre fondo naranja
  answer: A
  explanation: Las señales de servicio son rectangulares y los símbolos son blancos
    sobre un fondo azul.
- id: 63
  category: signs_and_signals
  question: ¿Qué indican los números en las señales de mojones (mileposts)?
  choices:
    A: La distancia a la siguiente ciudad principal
    B: El límite de velocidad para el próximo tramo de la carretera
    C: A cuántas millas se encuentra del límite norte o este del estado
    D: A cuántas millas se encuentra del límite sur o oeste del estado o del origen
      de la ruta
  answer: D
  explanation: Los números en las señales de mojones le indican a cuántas millas se
    encuentra del límite sur o oeste del estado o del origen de la ruta dentro del
    estado.
- id: 64
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a una intersección donde los semáforos
    están apagados debido a un corte de energía?
  choices:
    A: Cruzar la intersección sin detenerse si el camino está despejado.
    B: Detenerse y ceder el paso a cualquier vehículo que esté en la intersección.
    C: Tratar la intersección como una señal de ceda el paso.
    D: Esperar hasta que llegue un oficial de policía para dirigir el tráfico.
  answer: B
  explanation: Si los semáforos están apagados, por ejemplo, en caso de un corte de
    energía, el conductor de un vehículo debe detenerse y ceder el paso a cualquier
    vehículo que se encuentre en la intersección.
- id: 65
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite girar a la izquierda con luz roja?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de sentido único.
    B: Al girar desde una calle de sentido único hacia otra calle de sentido único,
      a menos que una señal lo prohíba.
    C: Nunca se permite girar a la izquierda con luz roja.
    D: Al girar desde una calle de sentido único hacia una calle de doble sentido
      cuando hay poco tráfico.
  answer: B
  explanation: Puede girar a la izquierda con luz roja desde una calle de sentido
    único hacia otra calle de sentido único, a menos que haya una señal que lo prohíba.
- id: 66
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico amarilla intermitente en una intersección?
  choices:
    A: Detenerse y esperar la luz verde.
    B: La luz está a punto de cambiar a rojo.
    C: Proceder con precaución.
    D: Ceder el paso a todo el tráfico a su derecha.
  answer: C
  explanation: La luz amarilla intermitente en una intersección significa proceder
    con PRECAUCIÓN.
- id: 67
  category: signs_and_signals
  question: ¿Qué indica una señal de giro a la izquierda amarilla intermitente?
  choices:
    A: Los conductores que giran a la izquierda tienen el derecho de paso.
    B: Puede girar a la izquierda con precaución después de ceder el paso al tráfico
      en sentido contrario y a los peatones.
    C: La señal de giro a la izquierda está cambiando a rojo.
    D: Los conductores que giran a la izquierda deben detenerse y esperar.
  answer: B
  explanation: Una indicación de giro amarilla intermitente significa PRECAUCIÓN.
    Puede girar a la izquierda con precaución después de ceder el paso al tráfico
    en sentido contrario y a los peatones.
- id: 68
  category: safe_driving_rules
  question: ¿Qué significa una marca en el pavimento con una línea amarilla continua
    y una línea amarilla discontinua?
  choices:
    A: Se permite rebasar en ambas direcciones.
    B: No se permite rebasar en ninguna dirección.
    C: No se permite rebasar cuando usted se encuentra en el carril con la línea continua.
    D: El carril central está reservado solo para giros a la izquierda.
  answer: C
  explanation: Una línea continua con una línea discontinua significa que no se puede
    rebasar cuando se está en el carril con la línea continua. La línea continua solo
    se puede cruzar para girar a la izquierda.
- id: 69
  category: safe_driving_rules
  question: ¿Cuál es la regla principal para usar un carril de giro a la izquierda
    de dos sentidos?
  choices:
    A: Está reservado únicamente para vehículos que giran a la izquierda en cualquier
      dirección, y no se permite rebasar.
    B: Puede usarse para rebasar vehículos que circulan despacio.
    C: Se usa para incorporarse al tráfico desde una calle lateral.
    D: Puede usarse como un carril de circulación normal durante las horas pico.
  answer: A
  explanation: El carril central está reservado únicamente para vehículos que giran
    a la izquierda en cualquier dirección. No se permite rebasar o adelantar en el
    carril central.
- id: 70
  category: safe_driving_rules
  question: ¿Dónde debe detener su vehículo en una intersección con un paso de peatones
    no marcado?
  choices:
    A: Justo después de la esquina para poder ver el tráfico transversal.
    B: Antes de entrar al paso de peatones (área de la acera) o a la intersección.
    C: En el centro exacto de la intersección.
    D: No es necesario detenerse si no hay líneas pintadas.
  answer: B
  explanation: Donde no hay líneas en una intersección, debe detener su vehículo antes
    de entrar al paso de peatones (área de la acera) o, si no hay paso de peatones,
    debe detenerse antes de que su vehículo entre en la intersección.
- id: 71
  category: safe_driving_rules
  question: ¿A qué distancia deben detenerse los autobuses escolares y los vehículos
    que transportan líquidos inflamables antes de un cruce de ferrocarril?
  choices:
    A: A menos de 100 pies y no menos de 50 pies de las vías.
    B: A menos de 50 pies y no menos de 15 pies de las vías.
    C: A menos de 30 pies y no menos de 10 pies de las vías.
    D: A menos de 25 pies y no menos de 5 pies de las vías.
  answer: B
  explanation: Los autobuses escolares, los vehículos que transportan explosivos o
    líquidos inflamables... deben detenerse a menos de 50 pies y no menos de 15 pies
    de las vías.
- id: 72
  category: signs_and_signals
  question: ¿Qué distingue a un cruce de ferrocarril pasivo de uno activo?
  choices:
    A: Los cruces pasivos tienen luces rojas intermitentes y campanas.
    B: Los cruces pasivos no tienen ningún tipo de dispositivo de control de tráfico
      que regule la circulación.
    C: Los cruces pasivos solo se encuentran en caminos de tierra.
    D: Los cruces pasivos siempre tienen barreras de cruce.
  answer: B
  explanation: Los cruces pasivos no tienen ningún tipo de dispositivo de control
    de tráfico. La decisión de detenerse o continuar recae enteramente en sus manos.
- id: 73
  category: driver_responsibility
  question: ¿Qué debe hacer si ve una obstrucción en las vías del tren o si las barreras
    del cruce no funcionan correctamente?
  choices:
    A: Llamar al número del Sistema de Notificación de Emergencias (ENS) publicado
      cerca de las vías.
    B: Intentar mover la obstrucción usted mismo.
    C: Conducir alrededor de las barreras con cuidado.
    D: Esperar en su vehículo sobre las vías hasta que llegue ayuda.
  answer: A
  explanation: La Administración Federal de Ferrocarriles publica números de teléfono
    de emergencia en los postes de los cruces de ferrocarril o en las cajas de control
    metálicas. Llame a este número si ve una obstrucción en las vías del tren o cualquier
    otro problema en un cruce de ferrocarril.
- id: 74
  category: defensive_driving
  question: Si su vehículo queda atrapado o atascado en las vías del tren y se aproxima
    un tren, ¿qué debe hacer después de evacuar su vehículo?
  choices:
    A: Caminar en la misma dirección en la que se mueve el tren.
    B: Caminar alejándose de las vías en un ángulo de 45 grados en dirección al tren
      que se aproxima.
    C: Pararse directamente al lado del vehículo y agitar los brazos para alertar
      al conductor.
    D: Correr perpendicularmente a las vías lo más rápido posible.
  answer: B
  explanation: Si su vehículo queda atrapado o atascado en las vías, evacúe el vehículo
    y camine en dirección al tren que se aproxima y alejándose de las vías en un ángulo
    de 45 grados. Esto asegura que los escombros de la colisión se dispersen lejos
    de usted.
- id: 75
  category: safe_driving_rules
  question: Cuando un tren está cruzando, ¿cuál es la distancia mínima a la que debe
    detenerse antes del cruce de ferrocarril?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: B
  explanation: Cuando un tren está cruzando, las marcas en el pavimento y las reglas
    requieren que se detenga al menos a 15 pies antes del cruce.
- id: 76
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe dar continuamente una señal de giro antes
    de realizar un giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Todas las señales de intención de giro deben darse continuamente durante
    los últimos 100 pies antes del giro.
- id: 77
  category: safe_driving_rules
  question: Cuando dos vehículos se aproximan a una intersección sin señalizar aproximadamente
    al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda
    B: El vehículo de la derecha
    C: El vehículo que viaja más rápido
    D: El vehículo que toca la bocina primero
  answer: B
  explanation: Cuando dos vehículos se aproximan a una intersección sin señalizar
    aproximadamente al mismo tiempo, el vehículo del lado izquierdo debe ceder el
    paso al vehículo de la derecha.
- id: 78
  category: safe_driving_rules
  question: En una intersección en T no controlada, ¿qué vehículo debe ceder el paso?
  choices:
    A: El vehículo en la calle que continúa
    B: El vehículo en la calle que termina
    C: El vehículo que gira a la derecha
    D: El vehículo que viaja más rápido
  answer: B
  explanation: En una intersección en T no controlada, el vehículo en la calle que
    termina debe ceder el paso a los vehículos en la calle que continúa.
- id: 79
  category: safe_driving_rules
  question: No puede realizar un giro en U cerca de la cima de una colina o en cualquier
    curva si no puede ver por al menos ¿qué distancia?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: No puede realizar un giro en U cerca de la cima de una colina o en
    cualquier curva donde el conductor no pueda ver a 500 pies o más.
- id: 80
  category: sharing_the_road
  question: ¿Qué debe hacer cuando se aproxima un vehículo de emergencia con sus luces
    rojas, blancas o azules intermitentes o usando su sirena?
  choices:
    A: Detenerse inmediatamente en medio de la intersección
    B: Reducir la velocidad a 15 mph y proceder con precaución
    C: Detenerse por completo junto al bordillo o borde derecho de la carretera
    D: Moverse al carril izquierdo y detenerse
  answer: C
  explanation: Cuando un vehículo de emergencia o de las fuerzas del orden tiene sus
    luces intermitentes o usa su sirena, usted debe detenerse inmediatamente junto
    al bordillo o borde derecho de la carretera y permanecer detenido hasta que pase.
- id: 81
  category: sharing_the_road
  question: ¿Qué acción debe tomar si un vehículo de las fuerzas del orden o de mantenimiento
    está estacionado en una carretera de varios carriles con sus luces de emergencia
    o de trabajo parpadeando?
  choices:
    A: Detenerse inmediatamente detrás del vehículo
    B: Cambiarse al carril opuesto y proceder con la debida precaución
    C: Mantener su velocidad y posición en el carril
    D: Tocar la bocina para alertar a los trabajadores
  answer: B
  explanation: Si un vehículo de emergencia, de las fuerzas del orden o de mantenimiento
    del DOT está estacionado en una carretera de varios carriles con luces parpadeantes,
    debe cambiarse al carril opuesto y proceder con la debida precaución.
- id: 82
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene y tiene sus luces rojas parpadeando,
    ¿qué vehículos deben detenerse?
  choices:
    A: Solo los vehículos que se aproximan por detrás
    B: Solo los vehículos que se aproximan por delante
    C: Los vehículos que se aproximan desde ambas direcciones
    D: Solo los vehículos comerciales
  answer: C
  explanation: Cuando un autobús escolar se detiene y tiene sus luces rojas parpadeando,
    los conductores que se aproximan desde ambas direcciones deben detenerse porque
    se están subiendo o bajando niños.
- id: 83
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en un distrito comercial o residencial en Dakota del Norte?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: El límite de velocidad máximo es de 25 millas por hora en un distrito
    comercial o residencial, a menos que se indique lo contrario.
- id: 84
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en carreteras de grava, tierra
    o superficie suelta, a menos que se indique lo contrario?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: El límite de velocidad máximo es de 55 millas por hora en carreteras
    de grava, tierra o superficie suelta, a menos que se indique lo contrario.
- id: 85
  category: safe_driving_rules
  question: Al rebasar a otro vehículo en una carretera de doble sentido, ¿a cuántos
    pies de distancia como mínimo debe regresar a su carril antes de encontrarse con
    un vehículo que se aproxima?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Debe darse tiempo suficiente para pasar completamente al vehículo que
    está rebasando y regresar a su carril correspondiente al menos 200 pies antes
    de encontrarse con un vehículo que se aproxima.
- id: 86
  category: defensive_driving
  question: Al rebasar a otro vehículo, ¿cómo sabe que es seguro regresar a su carril?
  choices:
    A: Cuando esté a una distancia de un automóvil por delante del vehículo rebasado
    B: Cuando el conductor del vehículo rebasado parpadee sus faros delanteros
    C: Cuando pueda ver la imagen de toda la parte delantera del vehículo rebasado
      en su espejo retrovisor interior
    D: Cuando haya acelerado 10 mph por encima del límite de velocidad
  answer: C
  explanation: No regrese a su carril hasta que pueda ver la imagen de toda la parte
    delantera del vehículo que rebasó en el espejo retrovisor interior.
- id: 87
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es ilegal rebasar a otro vehículo?
  choices:
    A: En una carretera rural pavimentada de 2 carriles
    B: A menos de 100 pies de una intersección, un cruce de ferrocarril o un túnel
    C: Cuando el vehículo de adelante viaja por debajo del límite de velocidad
    D: En una carretera dividida de varios carriles
  answer: B
  explanation: Nunca debe rebasar a menos de 100 pies de una intersección, un cruce
    de ferrocarril o un túnel.
- id: 88
  category: safe_driving_rules
  question: ¿Quién es responsable de garantizar que un cambio de carril se realice
    de forma segura?
  choices:
    A: El conductor del vehículo que realiza el cambio de carril
    B: El conductor en el carril al que se está ingresando
    C: Ambos conductores por igual
    D: El conductor que va detrás del vehículo que cambia de carril
  answer: A
  explanation: 'El manual establece: ''El conductor del vehículo que realiza el cambio
    de carril es responsable de cambiar de carril de manera segura''.'
- id: 89
  category: defensive_driving
  question: A 55 millas por hora en pavimento seco, ¿aproximadamente cuánta distancia
    se necesita para detenerse?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: C
  explanation: Según el manual, a 55 millas por hora, se necesitan aproximadamente
    300 pies o una cuadra de la ciudad en pavimento seco para detenerse.
- id: 90
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones debería aumentar su distancia
    de seguimiento a cuatro segundos o más?
  choices:
    A: Al conducir en una calle de un solo sentido
    B: Al seguir a una motocicleta
    C: Al conducir en un vecindario residencial
    D: Al acercarse a una rotonda
  answer: B
  explanation: El manual enumera varias situaciones en las que se necesita una distancia
    de seguimiento de cuatro segundos o más, incluyendo cuando se sigue a motocicletas,
    cuando las carreteras están resbaladizas o cuando se remolca un remolque.
- id: 91
  category: safe_driving_rules
  question: ¿Al girar a la izquierda desde una carretera de doble sentido hacia una
    autopista de cuatro carriles, en qué carril debe entrar inicialmente?
  choices:
    A: El carril del extremo derecho
    B: El carril de rebase (passing lane)
    C: El carril central de giro
    D: El acotamiento (shoulder)
  answer: B
  explanation: El manual establece que al girar a la izquierda desde una carretera
    de doble sentido hacia una autopista de cuatro carriles, debe realizar el giro
    de modo que entre en el carril de rebase (passing lane) de la autopista de cuatro
    carriles y luego desplazarse a la derecha cuando el tráfico lo permita.
- id: 92
  category: sharing_the_road
  question: ¿Qué debe hacer al conducir cerca de un camión grande en una glorieta
    (roundabout)?
  choices:
    A: Rebasar al camión por el lado derecho
    B: Rebasar al camión por el lado izquierdo
    C: Tocar la bocina para que sepan que usted está allí
    D: No los rebase, ya que necesitan todo el espacio disponible
  answer: D
  explanation: 'Al navegar por una glorieta, el manual establece explícitamente: "¡Asuma
    siempre que los camiones necesitan todo el espacio disponible; no los rebase!".'
- id: 93
  category: safe_driving_rules
  question: ¿A quién debe ceder el paso al entrar en una glorieta (roundabout)?
  choices:
    A: Solo a los vehículos que entran por su derecha
    B: Solo a los vehículos comerciales
    C: Al tráfico que circula por la glorieta
    D: A los vehículos que salen de la glorieta
  answer: C
  explanation: 'El manual instruye a los conductores: "Ceda el paso al tráfico que
    circula al entrar en la glorieta".'
- id: 94
  category: safe_driving_rules
  question: ¿Qué debe hacer si experimenta una emergencia en la Interestatal (Interstate)?
  choices:
    A: Detenerse en el carril derecho y encender las luces de emergencia
    B: Detenerse en el acotamiento (shoulder) y levantar el capó
    C: Usar un cruce de mediana para dar la vuelta
    D: Retroceder hasta la rampa de salida más cercana
  answer: B
  explanation: 'El manual establece: "Nunca se detenga en la parte transitada de la
    calzada. En caso de emergencia, deténgase en el acotamiento y levante el capó
    para mostrar que tiene dificultades".'
- id: 95
  category: safe_driving_rules
  question: ¿Cuándo debe usar sus faros delanteros debido a las inclemencias del tiempo?
  choices:
    A: Cuando la visibilidad sea inferior a 500 pies
    B: Cuando la visibilidad sea inferior a 1,000 pies
    C: Cuando la visibilidad sea inferior a 1,500 pies
    D: Solo cuando conduzca por la Interestatal
  answer: B
  explanation: Debe usar sus faros delanteros durante las inclemencias del tiempo
    cuando la visibilidad sea inferior a 1,000 pies debido a la lluvia, nieve, aguanieve,
    granizo, humo o niebla.
- id: 96
  category: defensive_driving
  question: Al conducir de noche, ¿a qué distancia debe atenuar sus faros delanteros
    antes de encontrarse con el tráfico que viene en sentido contrario?
  choices:
    A: Al menos 200 pies
    B: Al menos 300 pies
    C: Al menos 400 pies
    D: Al menos 500 pies
  answer: D
  explanation: El manual exige que los conductores atenúen sus faros delanteros al
    menos 500 pies antes de encontrarse con el tráfico.
- id: 97
  category: defensive_driving
  question: Si se encuentra con un vehículo por la noche que no atenúa sus luces,
    ¿hacia dónde debe mirar para evitar ser deslumbrado?
  choices:
    A: Directamente a los faros que vienen de frente
    B: A la línea central de la carretera
    C: Al borde derecho de la carretera
    D: A su espejo retrovisor
  answer: C
  explanation: Si se encuentra con un vehículo que no atenúa sus luces, el manual
    aconseja "mirar hacia el borde derecho de la carretera para evitar ser deslumbrado".
- id: 98
  category: safe_driving_rules
  question: Al estacionarse en paralelo, ¿a qué distancia deben estar las ruedas del
    bordillo (curb) de la derecha?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de un pie
    C: A menos de 18 pulgadas
    D: A menos de dos pies
  answer: B
  explanation: Al estacionar su vehículo en paralelo, sus ruedas deben estar paralelas
    al bordillo de la derecha y a menos de un pie del mismo.
- id: 99
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar las ruedas al estacionar cuesta arriba en una
    calle con bordillo (curb)?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: Hacia el acotamiento
  answer: B
  explanation: El diagrama y las reglas de estacionamiento establecen que al estacionar
    cuesta arriba con un bordillo, debe girar las ruedas en dirección contraria al
    bordillo.
- id: 100
  category: defensive_driving
  question: ¿Por qué debe evitar dar un volantazo para esquivar a un animal en la
    carretera?
  choices:
    A: Dar volantazos es ilegal en zonas rurales
    B: Es probable que el animal se quite del camino por sí solo
    C: Podría resultar en un choque más grave, como chocar contra un árbol o volcarse
    D: Su seguro no cubrirá los daños si da un volantazo
  answer: C
  explanation: 'El manual advierte: "No dé un volantazo para esquivar a un animal
    porque esto podría resultar en un choque más grave, como chocar contra un árbol
    u otro vehículo, o posiblemente volcarse".'
- id: 101
  category: safe_driving_rules
  question: ¿Qué debe hacer si un conductor que se aproxima no baja las luces delanteras
    por la noche?
  choices:
    A: Hacer destellos con las luces altas repetidamente hasta que bajen las suyas.
    B: Mirar hacia el borde derecho de la carretera para evitar ser deslumbrado.
    C: Mirar directamente a las luces delanteras para calcular la distancia del vehículo.
    D: Orillarse inmediatamente y detenerse en el acotamiento.
  answer: B
  explanation: Si un conductor que se aproxima no baja sus luces, mire hacia el borde
    derecho de la carretera para evitar ser deslumbrado.
- id: 102
  category: safe_driving_rules
  question: ¿A qué distancia mínima debe estacionarse de un hidrante de incendios?
  choices:
    A: Al menos 5 pies
    B: Al menos 10 pies
    C: Al menos 15 pies
    D: Al menos 20 pies
  answer: B
  explanation: No puede estacionarse a menos de 10 pies de un hidrante de incendios.
- id: 103
  category: vehicle_information
  question: Si debe realizar una parada de emergencia y estacionarse en una carretera
    pública por la noche, ¿su vehículo debe mostrar una luz roja en la parte trasera
    visible a qué distancia?
  choices:
    A: 200 pies
    B: 500 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Entre media hora después de la puesta del sol y media hora antes del
    amanecer, su vehículo debe mostrar una luz roja en la parte trasera visible a
    una distancia de 1,000 pies cuando esté estacionado en una carretera pública.
- id: 104
  category: safe_driving_rules
  question: Al remolcar un tráiler a más de 25 millas por hora, ¿qué equipo de seguridad
    se requiere?
  choices:
    A: Una licencia comercial de remolque especializada
    B: Cadenas de seguridad o frenos capaces de sujetar el tráiler si el acoplamiento
      se rompe
    C: Una baliza amarilla intermitente montada en la parte superior del tráiler
    D: Un mecanismo de dirección secundario
  answer: B
  explanation: Al viajar a más de 25 millas por hora, necesita cadenas de seguridad
    o frenos capaces de sujetar el tráiler si el acoplamiento se rompe.
- id: 105
  category: safe_driving_rules
  question: Al viajar en una pendiente descendente, ¿qué acción está prohibida para
    el conductor de cualquier vehículo motorizado?
  choices:
    A: Avanzar por inercia con las marchas o la transmisión en punto muerto (neutral)
    B: Usar los frenos del vehículo de forma intermitente
    C: Cambiar a una marcha más baja
    D: Conducir por debajo del límite de velocidad establecido
  answer: A
  explanation: El conductor de cualquier vehículo motorizado, al viajar en una pendiente
    descendente, no puede avanzar por inercia con las marchas o la transmisión de
    dicho vehículo en punto muerto (neutral).
- id: 106
  category: penalties_and_points
  question: ¿Cuál es la sanción por tirar o depositar basura en cualquier carretera
    pública?
  choices:
    A: Una multa de $100
    B: Una multa de $250
    C: Una multa de $500
    D: Una suspensión de la licencia por 30 días
  answer: C
  explanation: Si tira o deposita cualquier tipo de basura en una carretera pública,
    está sujeto a una multa de $500.
- id: 107
  category: driver_responsibility
  question: 'Debe informar inmediatamente un choque a las autoridades si este resulta
    en lesiones personales, muerte o daños a la propiedad combinados de al menos:'
  choices:
    A: $1,000
    B: $2,000
    C: $3,000
    D: $4,000
  answer: D
  explanation: Si se ve involucrado en un choque que resulte en daños combinados de
    $4,000 o más, o que resulte en lesiones personales o muerte, debe informarlo de
    inmediato.
- id: 108
  category: driver_responsibility
  question: Si choca contra un vehículo desatendido y no puede encontrar al propietario,
    ¿qué debe hacer?
  choices:
    A: Esperar junto al vehículo hasta que el propietario regrese.
    B: Dejar una nota en un lugar visible del vehículo con su nombre, dirección y
      compañía de seguros.
    C: Llamar a una grúa para mover el vehículo desatendido.
    D: Informar a la policía dentro de las 48 horas y abandonar la escena.
  answer: B
  explanation: Si no se puede encontrar al propietario, el conductor debe dejar una
    nota en un lugar visible del vehículo desatendido. La nota debe incluir el nombre
    del conductor, la dirección y la compañía de seguros del vehículo motorizado.
- id: 109
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción por operar un vehículo motorizado
    sin seguro en Dakota del Norte?
  choices:
    A: $50
    B: $100
    C: $150
    D: $300
  answer: C
  explanation: La multa por operar un vehículo motorizado sin seguro es de $150 por
    una primera infracción y de $300 por una segunda o subsiguiente infracción en
    tres años.
- id: 110
  category: penalties_and_points
  question: ¿Cuál es la sanción por ingresar a una carretera que está oficialmente
    cerrada debido a condiciones invernales peligrosas?
  choices:
    A: Una multa de $150
    B: Una multa de $250
    C: Una multa de $500
    D: Una advertencia por la primera infracción
  answer: B
  explanation: No es legal ingresar a una carretera que está oficialmente cerrada
    debido a condiciones peligrosas. La sanción por hacer esto es una multa de $250.
- id: 111
  category: vehicle_information
  question: ¿Durante qué fechas está legalmente permitido el uso de neumáticos para
    nieve con clavos?
  choices:
    A: Del 1 de septiembre al 1 de marzo
    B: Del 1 de octubre al 1 de abril
    C: Del 15 de octubre al 15 de abril
    D: Del 1 de noviembre al 1 de mayo
  answer: C
  explanation: Los neumáticos para nieve con clavos pueden utilizarse desde el 15
    de octubre hasta el 15 de abril.
- id: 112
  category: defensive_driving
  question: ¿Cómo debe aplicar los frenos para detenerse sobre hielo si su vehículo
    está equipado con frenos antibloqueo (ABS)?
  choices:
    A: Bombee los frenos rápidamente.
    B: Mantenga una presión firme y continua en los frenos.
    C: Aplique una acción de frenado lenta e intermitente.
    D: Pise los frenos a fondo e inmediatamente suéltelos.
  answer: B
  explanation: Mantenga una presión firme y continua en los frenos antibloqueo (ABS).
    Bombear manualmente los frenos antibloqueo, o soltarlos, disminuye su efectividad.
- id: 113
  category: safe_driving_rules
  question: Si su vehículo se queda atascado en una tormenta de nieve, ¿cuál es la
    acción más segura?
  choices:
    A: Deje su vehículo para buscar la casa o el negocio más cercano.
    B: Quédese con el vehículo y mantenga la calefacción encendida continuamente para
      mantenerse caliente.
    C: Quédese con el vehículo, abra las ventanas ligeramente y encienda el motor
      y la calefacción solo por períodos cortos.
    D: Camine por la carretera para hacerle señas a un quitanieves que pase.
  answer: C
  explanation: Si su vehículo se queda atascado en una tormenta de nieve, ¡quédese
    con el vehículo! Abra las ventanas ligeramente y encienda el vehículo y la calefacción
    solo por períodos cortos de tiempo para evitar la intoxicación por monóxido de
    carbono.
- id: 114
  category: sharing_the_road
  question: ¿Por qué debe tener extrema precaución al rebasar a un quitanieves?
  choices:
    A: No están obligados a seguir los límites de velocidad establecidos.
    B: Pueden ser desplazados lateralmente por montones de nieve y nieve compacta.
    C: Se detienen con frecuencia en medio de la carretera para verificar las condiciones
      climáticas.
    D: No están equipados con señales de giro estándar.
  answer: B
  explanation: Tenga extrema precaución al rebasar a un quitanieves. Pueden ser desplazados
    lateralmente por montones de nieve y nieve compacta.
- id: 115
  category: safe_driving_rules
  question: ¿Cuál es la causa más común de los choques en invierno?
  choices:
    A: Carreteras mal arenadas
    B: Conducir demasiado rápido para las condiciones existentes
    C: Seguir a los quitanieves demasiado de cerca
    D: Neumáticos de invierno defectuosos
  answer: B
  explanation: Según el manual, la mayoría de los choques en invierno son causados
    por conducir demasiado rápido para las condiciones existentes.
- id: 116
  category: defensive_driving
  question: Si la parte trasera de su vehículo de tracción trasera comienza a derrapar
    hacia la derecha, ¿qué debe hacer?
  choices:
    A: Gire el volante hacia la izquierda
    B: Frene fuerte y gire hacia la derecha
    C: Gire el volante hacia la derecha
    D: Acelere a fondo y mantenga el volante recto
  answer: C
  explanation: En los automóviles de tracción trasera, debe girar las ruedas en la
    dirección en la que la parte trasera de su vehículo está derrapando. Si la parte
    trasera del vehículo derrapa hacia la derecha, gire hacia la derecha.
- id: 117
  category: safe_driving_rules
  question: ¿Por qué una carretera de superficie dura es muy resbaladiza justo después
    de que empieza a llover?
  choices:
    A: La lluvia elimina el material de tracción.
    B: El agua se combina con la suciedad y el aceite de la carretera para formar
      una película resbaladiza.
    C: El cambio repentino de temperatura causa condensación.
    D: Los neumáticos pierden la profundidad de su dibujo cuando están mojados.
  answer: B
  explanation: Una carretera de superficie dura es muy resbaladiza justo después de
    que empieza a llover porque el agua se combina con la suciedad y el aceite de
    la carretera para formar una película resbaladiza entre sus neumáticos y la superficie
    de la calzada.
- id: 118
  category: safe_driving_rules
  question: ¿Cuánta agua en movimiento se necesita para arrastrar a la mayoría de
    los vehículos, incluidos los vehículos utilitarios deportivos (SUV) y las camionetas?
  choices:
    A: Seis pulgadas
    B: Un pie
    C: Dos pies
    D: Tres pies
  answer: C
  explanation: Dos pies de agua en movimiento pueden arrastrar a la mayoría de los
    vehículos, incluidos los vehículos utilitarios deportivos y las camionetas.
- id: 119
  category: defensive_driving
  question: ¿Cuál es la respuesta adecuada si experimenta el reventón de un neumático
    mientras conduce?
  choices:
    A: Pise los frenos a fondo y diríjase al arcén inmediatamente.
    B: Sujete el volante con firmeza, siga recto y no frene hasta que tenga el control
      total.
    C: Acelere para mantener el impulso y gire en la dirección opuesta al reventón.
    D: Bombee los frenos rápidamente mientras vira hacia la derecha.
  answer: B
  explanation: Para recuperar el control después de un reventón, sujete el volante
    con firmeza y siga recto. Deje de presionar el acelerador, pero no frene hasta
    que haya recuperado el control total.
- id: 120
  category: defensive_driving
  question: Si su neumático se sale del borde del pavimento hacia el arcén, ¿qué debe
    evitar hacer?
  choices:
    A: Dejar de presionar el acelerador
    B: Sujetar con firmeza el volante
    C: Intentar virar bruscamente de regreso al pavimento de inmediato
    D: Observar el tráfico detrás de usted
  answer: C
  explanation: Si su neumático se sale del borde del pavimento hacia el arcén, no
    intente virar bruscamente de regreso al pavimento de inmediato porque podría perder
    el control de su vehículo.
- id: 121
  category: vehicle_information
  question: ¿Por qué nunca debe girar el encendido de su vehículo a la posición de
    "bloqueo" (lock) mientras aún está en movimiento si el acelerador se queda pegado?
  choices:
    A: Causará que el motor se incendie.
    B: Causará que la dirección se bloquee si intenta girar el volante.
    C: Dañará permanentemente la transmisión.
    D: Causará que los frenos se bloqueen inmediatamente.
  answer: B
  explanation: Nunca gire el encendido de su vehículo a la posición de "bloqueo" (lock)
    mientras aún esté en movimiento. Esto causará que la dirección se bloquee si intenta
    girar el volante.
- id: 122
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo que viene en sentido contrario invade su
    carril?
  choices:
    A: Acelerar para pasarlo rápidamente.
    B: Maniobrar hacia el carril izquierdo para evitarlo.
    C: Reducir la velocidad, hacer señales con las luces delanteras y orillarse lo
      más posible a la derecha.
    D: Detenerse inmediatamente en su carril y tocar la bocina.
  answer: C
  explanation: Si un vehículo que viene en sentido contrario invade su carril, reduzca
    la velocidad e intente advertir al conductor haciendo señales con las luces delanteras.
    Si el vehículo continúa avanzando, oríllese lo más posible a la derecha.
- id: 123
  category: penalties_and_points
  question: ¿Cuál es la sanción por enviar mensajes de texto mientras conduce o por
    no mantener el control de un vehículo debido a una actividad innecesaria?
  choices:
    A: Una multa de $50
    B: Una multa de $100
    C: Una multa de $250
    D: Una multa de $500
  answer: B
  explanation: No es legal que nadie envíe mensajes de texto mientras conduce o que
    no mantenga el control de un vehículo motorizado debido a una actividad que no
    sea necesaria... La sanción es una multa de $100.
- id: 124
  category: safe_driving_rules
  question: ¿Cómo debe operar los pedales del acelerador y del freno para evitar "apoyarse"
    en los frenos (riding the brakes)?
  choices:
    A: Use el pie derecho para el acelerador y el pie izquierdo para el freno.
    B: Use un solo pie para operar tanto el pedal del acelerador como el pedal del
      freno.
    C: Mantenga ambos pies en el pedal del freno al reducir la velocidad.
    D: Alterne los pies dependiendo de la velocidad del vehículo.
  answer: B
  explanation: Use un solo pie para operar tanto el pedal del acelerador como el pedal
    del freno para evitar apoyarse en los frenos, lo cual puede causar que se sobrecalienten.
- id: 125
  category: driver_responsibility
  question: ¿Cuál de los siguientes es una señal de peligro de fatiga del conductor?
  choices:
    A: Revisar sus espejos con frecuencia
    B: Incapacidad para recordar las últimas millas recorridas
    C: Mantener una velocidad constante
    D: Sentarse derecho con ambas manos en el volante
  answer: B
  explanation: 'Las señales de peligro de fatiga son: dificultad para concentrarse
    o mantener los ojos abiertos, incapacidad para recordar las últimas millas recorridas,
    tener la sensación de estar desconectado, etc.'
- id: 126
  category: sharing_the_road
  question: ¿Aproximadamente cuánta distancia necesita un camión con remolque (tractor-trailer)
    totalmente cargado para detenerse por completo en pavimento seco?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: Más de 400 pies
  answer: D
  explanation: Un camión con remolque totalmente cargado puede tardar más de 400 pies
    en pavimento seco para detenerse por completo, o más de la longitud de un campo
    de fútbol americano.
- id: 127
  category: sharing_the_road
  question: ¿Por qué los conductores de camiones con remolque a menudo se abren hacia
    la izquierda antes de girar a la derecha?
  choices:
    A: Para tener una mejor vista del tráfico que viene en sentido contrario
    B: Porque las ruedas traseras siguen una trayectoria más corta que las ruedas
      delanteras
    C: Para bloquear el paso de otros vehículos
    D: Porque el mecanismo de dirección requiere un ángulo más amplio
  answer: B
  explanation: En cualquier vehículo que gira, las ruedas traseras siguen una trayectoria
    más corta que las ruedas delanteras. Cuanto más largo sea el vehículo, mayor será
    la diferencia. Es por eso que los conductores de camiones con remolque a menudo
    deben abrirse hacia la izquierda como primer paso para girar a la derecha.
- id: 128
  category: sharing_the_road
  question: ¿Hasta qué distancia se extiende el punto ciego trasero (zona prohibida
    o "no-zone") de un camión con remolque?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 150 pies
    D: Hasta 200 pies
  answer: D
  explanation: Aunque los camioneros disfrutan de una mejor vista hacia adelante y
    tienen espejos más grandes, todavía tienen puntos ciegos graves o "zonas prohibidas"
    en las que un automóvil puede desaparecer de la vista... y hasta 200 pies en la
    parte trasera.
- id: 129
  category: sharing_the_road
  question: ¿Hasta qué distancia puede extenderse el punto ciego trasero de un camión
    con remolque?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 150 pies
    D: Hasta 200 pies
  answer: D
  explanation: Los camiones tienen puntos ciegos graves o "zonas prohibidas" en las
    que un automóvil puede desaparecer de la vista, incluyendo hasta 200 pies en la
    parte trasera.
- id: 130
  category: sharing_the_road
  question: ¿Cuál es una excelente regla general al compartir la carretera con un
    camión con remolque?
  choices:
    A: Si no puede ver al conductor del camión en su espejo lateral, él o ella no
      puede verlo a usted.
    B: Siempre pase a un camión por el lado derecho para evitar el tráfico en sentido
      contrario.
    C: Siga de cerca al camión para reducir la resistencia al viento y ahorrar gasolina.
    D: Comparta el carril con el camión si el carril es lo suficientemente ancho.
  answer: A
  explanation: 'El manual establece que una excelente regla general es: "Si no puede
    ver al conductor del camión en su espejo lateral, él o ella no puede verlo a usted".'
- id: 131
  category: sharing_the_road
  question: ¿Al rebasar un camión con remolque (tractor-trailer), siempre debe rebasarlo
    por completo y por qué lado?
  choices:
    A: El lado derecho
    B: El lado izquierdo
    C: El lado que tenga menos tráfico
    D: El acotamiento
  answer: B
  explanation: El manual aconseja rebasar siempre un camión con remolque por completo
    y siempre por el lado izquierdo.
- id: 132
  category: defensive_driving
  question: ¿Por qué ocurre un número considerable de colisiones entre automóviles
    y camiones en las intersecciones?
  choices:
    A: Se requiere que los camiones cedan el paso en todas las intersecciones.
    B: Los automóviles frecuentemente intentan rebasar a los camiones por el lado
      derecho mientras giran.
    C: El conductor del automóvil subestima el tamaño y la velocidad del camión que
      se aproxima.
    D: Los conductores de camiones no pueden ver los semáforos con claridad desde
      su posición elevada.
  answer: C
  explanation: Debido a su gran tamaño, un camión con remolque a menudo parece viajar
    a una velocidad más lenta de la que realmente lleva, lo que hace que los conductores
    de automóviles subestimen qué tan cerca está el camión o qué tan rápido se aproxima
    en las intersecciones.
- id: 133
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a un vehículo motorizado varado con las
    luces de emergencia intermitentes en una carretera interestatal fuera de los límites
    de la ciudad?
  choices:
    A: Detenerse inmediatamente y ofrecer asistencia al conductor.
    B: Ceder el paso y moverse con seguridad al carril que no esté adyacente al vehículo
      varado.
    C: Tocar la bocina para advertir al conductor y mantener su velocidad actual.
    D: Acelerar para pasar el vehículo varado lo más rápido posible.
  answer: B
  explanation: Si un vehículo motorizado está varado a lo largo de la interestatal
    o de una carretera de varios carriles fuera de los límites de la ciudad con las
    luces de emergencia intermitentes, el conductor debe ceder el paso y moverse con
    seguridad al carril que no esté adyacente al vehículo varado.
- id: 134
  category: sharing_the_road
  question: 'Al compartir la carretera con una motocicleta, usted debe:'
  choices:
    A: Compartir el carril para ahorrar espacio en la calzada.
    B: Permitir al motociclista el ancho completo de un carril.
    C: Rebasarlos lo más cerca posible para minimizar el tiempo en el carril contrario.
    D: Conducir en su punto ciego para que puedan escuchar su motor.
  answer: B
  explanation: Debe permitir al motociclista el ancho completo de un carril. Aunque
    parezca que hay suficiente espacio, la motocicleta necesita el espacio para maniobrar
    con seguridad. No comparta el carril.
- id: 135
  category: defensive_driving
  question: 'Casi el 40 por ciento de los choques de motocicletas que involucran a
    otro vehículo motorizado fueron causados por:'
  choices:
    A: El otro vehículo girando a la izquierda frente al motociclista.
    B: La motocicleta siguiendo demasiado cerca al otro vehículo.
    C: El otro vehículo chocando por detrás a la motocicleta en una señal de alto.
    D: La motocicleta rebasando al otro vehículo por la derecha.
  answer: A
  explanation: Aproximadamente la mitad de todos los choques de motocicletas involucran
    a otro vehículo motorizado, y casi el 40 por ciento fueron causados por el otro
    vehículo girando a la izquierda frente al motociclista.
- id: 136
  category: sharing_the_road
  question: ¿Por qué debería esperar para estar seguro de que una motocicleta va a
    girar incluso si su luz direccional está parpadeando?
  choices:
    A: Las luces direccionales de las motocicletas suelen estar rotas y no son fiables.
    B: Las señales de las motocicletas generalmente no se cancelan automáticamente
      y los conductores a veces olvidan apagarlas.
    C: La ley exige que las motocicletas usen señales manuales en lugar de señales
      electrónicas.
    D: Es ilegal que las motocicletas giren en la mayoría de las intersecciones.
  answer: B
  explanation: No se deje engañar por una luz direccional intermitente en una motocicleta;
    las señales de las motocicletas generalmente no se cancelan automáticamente y
    los conductores a veces olvidan apagarlas.
- id: 137
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir detrás de
    una motocicleta?
  choices:
    A: Uno o dos segundos
    B: Dos o tres segundos
    C: Tres o cuatro segundos
    D: Cinco o seis segundos
  answer: C
  explanation: Debe permitir una mayor distancia de seguimiento, de tres o cuatro
    segundos, al seguir a una motocicleta para que el motociclista tenga suficiente
    tiempo para maniobrar o detenerse en una emergencia.
- id: 138
  category: sharing_the_road
  question: ¿Cuál es el espacio mínimo para rebasar requerido entre un vehículo motorizado
    y una bicicleta?
  choices:
    A: Un pie
    B: Dos pies
    C: Tres pies
    D: Cuatro pies
  answer: C
  explanation: La persona que opera el vehículo motorizado debe dejar un mínimo de
    tres pies de espacio para rebasar entre el vehículo y la bicicleta.
- id: 139
  category: sharing_the_road
  question: ¿Dónde ocurren la mayoría de los choques que involucran a un vehículo
    motorizado y un ciclista?
  choices:
    A: En carreteras rurales
    B: En intersecciones
    C: En entradas residenciales
    D: En ciclovías designadas
  answer: B
  explanation: Esté atento a los ciclistas en el tráfico, particularmente en las intersecciones.
    La mayoría de los choques que involucran a un vehículo motorizado y un ciclista
    ocurren en las intersecciones.
- id: 140
  category: safe_driving_rules
  question: ¿Cuándo es permisible conducir en un carril para bicicletas designado?
  choices:
    A: Al rebasar un vehículo que se mueve lentamente
    B: Al realizar un giro a la derecha
    C: Cuando el tráfico está muy congestionado
    D: Nunca es permisible
  answer: B
  explanation: Debe evitar conducir en los carriles para bicicletas designados, excepto
    para realizar un giro a la derecha.
- id: 141
  category: vehicle_information
  question: 'A 30 millas por hora, la fuerza de un choque es equivalente a golpear
    el suelo desde la parte superior de un:'
  choices:
    A: Edificio de un piso
    B: Edificio de dos pisos
    C: Edificio de tres pisos
    D: Edificio de cuatro pisos
  answer: C
  explanation: A 30 millas por hora, la fuerza es como golpear el suelo desde la parte
    superior de un edificio de tres pisos.
- id: 142
  category: safe_driving_rules
  question: ¿Cómo debe usarse correctamente el cinturón de regazo?
  choices:
    A: Ajustado y bajo a través de las caderas
    B: Flojo a través del abdomen
    C: Ajustado a través del pecho
    D: Alto en la cintura
  answer: A
  explanation: Los cinturones deben usarse correctamente. Los cinturones de regazo
    deben quedar ajustados y bajos a través de las caderas, no a través del abdomen.
- id: 143
  category: safe_driving_rules
  question: 'Según la ley de seguridad de niños pasajeros de Dakota del Norte, se
    puede sustituir un sistema de retención infantil por un cinturón de seguridad
    si un niño menor de ocho años mide al menos:'
  choices:
    A: 48 pulgadas de alto
    B: 50 pulgadas de alto
    C: 54 pulgadas de alto
    D: 57 pulgadas de alto
  answer: D
  explanation: Los niños menores de ocho años deben estar debidamente asegurados en
    un sistema de retención infantil. Se puede sustituir por un cinturón de seguridad
    para niños que midan al menos 57 pulgadas de alto.
- id: 144
  category: safe_driving_rules
  question: Según la ley de Dakota del Norte, ¿hasta qué edad debe un niño estar debidamente
    asegurado en un sistema de retención infantil (asiento de seguridad o asiento
    elevado [booster seat])?
  choices:
    A: 6 años
    B: 8 años
    C: 10 años
    D: 12 años
  answer: B
  explanation: La ley de seguridad de niños pasajeros de Dakota del Norte exige que
    los niños menores de ocho años estén debidamente asegurados en un sistema de retención
    infantil.
- id: 145
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar la ley de seguridad de niños pasajeros
    de Dakota del Norte?
  choices:
    A: Multa de $25 y un punto contra la licencia de conducir
    B: Multa de $50 y dos puntos contra la licencia de conducir
    C: Multa de $100 y sin puntos
    D: Multa de $250 y suspensión de la licencia
  answer: A
  explanation: La sanción por la infracción es de $25 y un punto contra la licencia
    del conductor.
- id: 146
  category: safe_driving_rules
  question: ¿A qué temperatura corporal central comienza a ocurrir un golpe de calor
    en un niño?
  choices:
    A: 99 grados
    B: 101 grados
    C: 104 grados
    D: 107 grados
  answer: C
  explanation: El golpe de calor comienza cuando la temperatura corporal central alcanza
    aproximadamente los 104 grados y el sistema termorregulador se ve abrumado.
- id: 147
  category: safe_driving_rules
  question: ¿Cuánto puede subir la temperatura interior de un vehículo en los primeros
    10 minutos?
  choices:
    A: Casi 5 grados Fahrenheit
    B: Casi 10 grados Fahrenheit
    C: Casi 20 grados Fahrenheit
    D: Casi 40 grados Fahrenheit
  answer: C
  explanation: La temperatura interior de un vehículo puede subir casi 20 grados Fahrenheit
    en los primeros 10 minutos.
- id: 148
  category: alcohol_drugs_health
  question: Si bebe aunque sea un poco de alcohol, ¿cuántas veces más son sus probabilidades
    de sufrir un choque que si estuviera completamente sobrio?
  choices:
    A: Dos veces más
    B: Tres veces más
    C: Cinco veces más
    D: Siete veces más
  answer: D
  explanation: Existe evidencia que demuestra que si bebe, aunque sea un poco, sus
    probabilidades de sufrir un choque son siete veces mayores que si estuviera completamente
    sobrio.
- id: 149
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma de eliminar el alcohol del torrente
    sanguíneo?
  choices:
    A: Beber café
    B: Tomar una ducha fría
    C: Ejercitarse
    D: Tiempo
  answer: D
  explanation: El tiempo es la única forma de eliminar el alcohol del torrente sanguíneo.
    Este proceso es relativamente lento y no se acelerará bebiendo café, tomando duchas
    frías o haciendo ejercicio.
- id: 150
  category: penalties_and_points
  question: ¿Qué sucede si se niega a realizarse una prueba química para determinar
    el nivel de alcohol o drogas en su cuerpo?
  choices:
    A: Su licencia será suspendida por 30 días
    B: Su licencia será revocada por un periodo de 180 días a tres años
    C: Se le multará con $50 pero conservará su licencia
    D: Recibirá tres puntos en su historial de manejo
  answer: B
  explanation: Si se niega a realizar la prueba, su licencia será revocada por un
    periodo de 180 días a tres años.
- id: 151
  category: alcohol_drugs_health
  question: 'Se considera legalmente bajo la influencia del alcohol si es menor de
    21 años y tiene una concentración de alcohol (AC) en la sangre de al menos:'
  choices:
    A: .00%
    B: .02%
    C: .04%
    D: .08%
  answer: B
  explanation: Si una prueba química revela que tiene ocho centésimas del uno por
    ciento (.08%) o más de alcohol en la sangre, o .02% si es menor de 21 años, se
    considera legalmente bajo la influencia del alcohol.
- id: 152
  category: penalties_and_points
  question: ¿Cuál es el periodo administrativo de suspensión de la licencia por una
    primera infracción de DUI dentro de un periodo de siete años con una concentración
    de alcohol (AC) del .08 por ciento?
  choices:
    A: 30 días
    B: 91 días
    C: 180 días
    D: 365 días
  answer: B
  explanation: 'Si tiene una concentración de alcohol (AC) del .08 por ciento o más...
    su licencia será suspendida por: 91 días, por la primera infracción en siete años.'
- id: 153
  category: penalties_and_points
  question: ¿Cuál es la sanción obligatoria por condena judicial para una primera
    condena por DUI con una concentración de alcohol (AC) inferior al .16%?
  choices:
    A: Multa de $250
    B: Multa de $500
    C: Multa de $750 y dos días de prisión
    D: Multa de $1,000 y 10 días de cárcel
  answer: B
  explanation: 'Si es condenado a través del proceso judicial... Primera condena:
    multa de $500.'
- id: 154
  category: penalties_and_points
  question: Si se ve involucrado en un choque mientras conduce bajo la influencia
    y causa una lesión grave a otra persona, ¿a qué sanción adicional se enfrentará?
  choices:
    A: 30 días adicionales de cárcel
    B: 90 días adicionales de cárcel
    C: 1 año adicional de cárcel
    D: Una multa adicional de $5,000
  answer: B
  explanation: Además de las sanciones mínimas por DUI, si se ve involucrado en un
    choque y causa una lesión grave a otra persona, pasará 90 días adicionales en
    la cárcel.
- id: 155
  category: driver_responsibility
  question: Si se niega a realizar una prueba de AC o es condenado por un DUI, la
    ley le exige mostrar una prueba de responsabilidad financiera. ¿Cómo se llama
    esta cobertura de seguro?
  choices:
    A: SR 22
    B: SR 50
    C: DUI 100
    D: AC 24/7
  answer: A
  explanation: Si se niega a realizar una prueba de AC, o si es condenado por un DUI,
    la ley le exige mostrar una prueba de responsabilidad financiera (cobertura de
    seguro SR 22).
- id: 156
  category: safe_driving_rules
  question: ¿Cuáles son los requisitos mínimos para que un niño pase de un asiento
    de seguridad para el automóvil a un asiento elevado (booster seat)?
  choices:
    A: Al menos 30 libras y 3 años de edad
    B: Al menos 40 libras y 4 años de edad
    C: Al menos 50 libras y 5 años de edad
    D: Al menos 60 libras y 6 años de edad
  answer: B
  explanation: Los niños deben tener al menos 40 libras y al menos 4 años de edad
    para pasar de un asiento de seguridad para el automóvil a un asiento elevado (booster
    seat).
- id: 157
  category: alcohol_drugs_health
  question: Bajo la Ley de Contenedor Abierto de Dakota del Norte, ¿a quién se le
    permite beber bebidas alcohólicas en un vehículo?
  choices:
    A: Solo al conductor
    B: Solo a los pasajeros
    C: Tanto al conductor como a los pasajeros
    D: Ni al conductor ni a los pasajeros
  answer: D
  explanation: Es ilegal que cualquier persona, ya sea conductor o pasajero, beba
    bebidas alcohólicas.
- id: 158
  category: alcohol_drugs_health
  question: De acuerdo con la ley de contenedor abierto, ¿dónde deben colocarse los
    contenedores abiertos de bebidas alcohólicas en un vehículo?
  choices:
    A: Debajo del asiento del conductor
    B: En la guantera
    C: En el maletero del vehículo
    D: En el piso del asiento trasero
  answer: C
  explanation: No puede tener legalmente un contenedor abierto en su vehículo. Cualquier
    contenedor abierto debe colocarse en el maletero del vehículo.
- id: 159
  category: alcohol_drugs_health
  question: ¿Cómo pueden ciertas pastillas y cápsulas para el resfriado afectar su
    capacidad de conducción?
  choices:
    A: Aumentan su tiempo de reacción
    B: Le provocan somnolencia al volante
    C: Mejoran su visión nocturna
    D: Hacen que conduzca de forma más agresiva
  answer: B
  explanation: Incluso ciertas pastillas y cápsulas para el resfriado pueden afectar
    su capacidad de conducción al provocarle somnolencia al volante.
- id: 160
  category: sharing_the_road
  question: Según las normas de tránsito de Dakota del Norte, ¿cómo se clasifican
    los corredores (joggers)?
  choices:
    A: Como vehículos recreativos
    B: Como peatones
    C: Como vehículos de movimiento lento
    D: Como ciclistas
  answer: B
  explanation: Los corredores (joggers) se consideran peatones y también deben obedecer
    las normas de tránsito para peatones.
- id: 161
  category: safe_driving_rules
  question: ¿Qué debe hacer al caminar por una carretera de noche para asegurarse
    de que los conductores puedan verlo?
  choices:
    A: Caminar con el tráfico y usar ropa oscura
    B: Caminar de frente al tráfico y usar ropa clara o blanca
    C: Caminar en el centro del carril y llevar una linterna
    D: Caminar en diagonal por las intersecciones
  answer: B
  explanation: Al caminar de noche, camine de frente al tráfico y use ropa clara o
    blanca para asegurarse de que los conductores puedan verlo.
- id: 162
  category: vehicle_information
  question: ¿Cuál es la velocidad máxima que se permite que alcance una bicicleta
    motorizada en una superficie nivelada?
  choices:
    A: 20 millas por hora
    B: 25 millas por hora
    C: 30 millas por hora
    D: 35 millas por hora
  answer: C
  explanation: Una bicicleta motorizada debe tener un desplazamiento máximo de pistón
    o rotor que permita una velocidad que no exceda las 30 millas por hora en una
    superficie nivelada.
- id: 163
  category: sharing_the_road
  question: 'Al andar en bicicleta de noche, su luz delantera debe ser visible desde
    una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: De noche, todas las bicicletas deben estar equipadas con una luz delantera
    visible desde una distancia de 500 pies.
- id: 164
  category: safe_driving_rules
  question: Al cruzar una calle o carretera en un vehículo todoterreno (off-highway
    vehicle), ¿en qué ángulo debe cruzar?
  choices:
    A: Aproximadamente 45 grados
    B: Aproximadamente 90 grados
    C: Aproximadamente 180 grados
    D: En diagonal por la intersección
  answer: B
  explanation: Debe cruzar las calles o carreteras en un ángulo de aproximadamente
    90 grados con respecto a la dirección de la carretera.
- id: 165
  category: safe_driving_rules
  question: 'Un conductor con licencia mayor de 16 años puede operar un vehículo todoterreno
    (off-highway vehicle) clase III registrado en una carretera pavimentada con una
    velocidad señalizada que no exceda:'
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 75 mph
  answer: C
  explanation: Un conductor con licencia mayor de 16 años puede operar un vehículo
    todoterreno clase III registrado en una carretera pavimentada designada y señalizada
    con una velocidad que no exceda las 65 mph.
- id: 166
  category: safe_driving_rules
  question: ¿Durante qué período de tiempo es ilegal operar una moto de nieve en cualquier
    derecho de paso de una carretera en Dakota del Norte?
  choices:
    A: Del 1 de marzo al 1 de octubre
    B: Del 1 de abril al 1 de noviembre
    C: Del 1 de mayo al 1 de diciembre
    D: Del 1 de junio al 1 de septiembre
  answer: B
  explanation: Las reglas para motos de nieve establecen que nunca debe operar en
    ningún derecho de paso desde el 1 de abril hasta el 1 de noviembre de cualquier
    año.
- id: 167
  category: safe_driving_rules
  question: 'Si está operando una moto de nieve en una zanja al costado de la calzada,
    debe:'
  choices:
    A: Moverse en la dirección opuesta al tráfico de la calzada
    B: Moverse en la misma dirección que el tráfico de la calzada
    C: Viajar a una velocidad no superior a 15 mph
    D: Mantener las luces delanteras apagadas durante las horas del día
  answer: B
  explanation: Si opera en cualquier zanja al costado de la calzada, debe moverse
    en la misma dirección que el tráfico de la calzada.
- id: 168
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la operación
    de una moto de nieve en el derecho de paso de una carretera interestatal?
  choices:
    A: Se permite solo en la zanja
    B: Se permite si está cruzando en un ángulo de 90 grados
    C: Nunca está permitido
    D: Se permite solo durante las horas del día
  answer: C
  explanation: Nunca debe operar una moto de nieve en el derecho de paso de ninguna
    carretera interestatal, lo que incluye la parte de conducción, la mediana, los
    arcenes y las zanjas.
- id: 169
  category: penalties_and_points
  question: 'Bajo el sistema de puntos de Dakota del Norte, se informará a un conductor
    de la intención de suspender su licencia cuando su registro revele un total de
    al menos:'
  choices:
    A: 6 puntos
    B: 9 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: Cuando el registro revela un total de 12 o más puntos, se informará
    al conductor que las autoridades tienen la intención de suspender su licencia.
- id: 170
  category: penalties_and_points
  question: ¿Cuántos puntos se pueden reducir del registro de un conductor por completar
    un curso aprobado de mejora para conductores?
  choices:
    A: Un punto
    B: Dos puntos
    C: Tres puntos
    D: Cuatro puntos
  answer: C
  explanation: El total de puntos se puede reducir en TRES PUNTOS si el conductor
    completa un curso aprobado de mejora para conductores, como un curso de conducción
    defensiva.
- id: 171
  category: penalties_and_points
  question: 'El total de puntos de un conductor se reduce en un punto por cada:'
  choices:
    A: Periodo de un mes sin puntos registrados
    B: Periodo de tres meses sin puntos registrados
    C: Periodo de seis meses sin puntos registrados
    D: Periodo de doce meses sin puntos registrados
  answer: B
  explanation: El total de puntos puede reducirse en UN PUNTO por cada periodo de
    tres meses durante el cual el conductor no haya tenido ningún punto registrado
    en su contra.
- id: 172
  category: penalties_and_points
  question: ¿Cuántos puntos se reducen de un historial de conducción por cada periodo
    de tres meses durante el cual el conductor no ha tenido ningún punto registrado?
  choices:
    A: Un punto
    B: Dos puntos
    C: Tres puntos
    D: Cinco puntos
  answer: A
  explanation: Según el manual, se reduce un punto por cada periodo de tres meses
    durante el cual el conductor no haya tenido ningún punto registrado en su historial.
- id: 173
  category: penalties_and_points
  question: Si un conductor completa un curso aprobado de mejora para conductores,
    como un curso de conducción defensiva, ¿cuántos puntos se pueden reducir de su
    historial?
  choices:
    A: Un punto
    B: Dos puntos
    C: Tres puntos
    D: Cinco puntos
  answer: C
  explanation: El manual establece que se pueden reducir tres puntos si el conductor
    completa un curso aprobado de mejora para conductores.
- id: 174
  category: penalties_and_points
  question: ¿Cuál es el periodo de suspensión por acumular exactamente 12 puntos en
    su historial de conducción?
  choices:
    A: 7 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: Un total acumulado de 12 puntos resulta en un periodo de suspensión
    de 7 días.
- id: 175
  category: license_system
  question: ¿Qué sucede si un padre o tutor legal retira su consentimiento para el
    permiso o licencia de un menor?
  choices:
    A: El menor queda restringido a conducir solo de día.
    B: El permiso o licencia será cancelado.
    C: El menor debe volver a tomar el examen de conducir.
    D: El menor debe pagar una tarifa de restablecimiento.
  answer: B
  explanation: La persona que dio el consentimiento puede retirarlo en cualquier momento,
    y el permiso o licencia será cancelado.
- id: 176
  category: driver_responsibility
  question: Según un estudio de los Institutos Nacionales de Salud (NIH) mencionado
    en el manual, ¿a qué edad se forma completamente la región del cerebro que inhibe
    el comportamiento de riesgo?
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '30'
  answer: C
  explanation: Un estudio de los Institutos Nacionales de Salud sugiere que la región
    del cerebro que inhibe el comportamiento de riesgo no se forma completamente hasta
    los 25 años.
- id: 177
  category: defensive_driving
  question: ¿Cuándo muestran los conductores adolescentes la mayor mejora en sus habilidades
    de conducción?
  choices:
    A: Después de completar un curso de educación vial.
    B: Dentro del primer año y las primeras 1,000 millas de conducción.
    C: Después de alcanzar la edad de 18 años.
    D: Dentro de las primeras 10,000 millas de conducción.
  answer: B
  explanation: Los adolescentes muestran la mayor mejora dentro del primer año y las
    primeras 1,000 millas de conducción, y continúan mejorando a lo largo de sus primeras
    5,000 millas.
- id: 178
  category: safe_driving_rules
  question: ¿Cómo afecta el duplicar la velocidad de su vehículo a su distancia de
    frenado?
  choices:
    A: Reduce a la mitad su distancia de frenado.
    B: Duplica su distancia de frenado.
    C: Triplica su distancia de frenado.
    D: Cuadruplica su distancia de frenado.
  answer: D
  explanation: La velocidad aumenta la distancia de frenado. Duplicar su velocidad
    cuadruplicará su distancia de frenado.
- id: 179
  category: sharing_the_road
  question: ¿Qué es la "Zona No" (No-Zone) alrededor de camiones o autobuses?
  choices:
    A: El área directamente frente al camión.
    B: Aproximadamente 15 pies a todos los lados del camión.
    C: El carril designado solo para vehículos comerciales.
    D: El punto ciego exclusivamente en el lado derecho del camión.
  answer: B
  explanation: Evite la "Zona No" (No-Zone) con camiones o autobuses. Esta es de aproximadamente
    15 pies a todos los lados del camión. Si no puede ver a los conductores de camiones
    en sus espejos, ellos tampoco pueden verlo a usted.
- id: 180
  category: defensive_driving
  question: ¿Con qué frecuencia debe usar sus espejos para revisar alrededor y detrás
    de su vehículo mientras conduce?
  choices:
    A: Cada 2-3 segundos
    B: Cada 6-8 segundos
    C: Cada 10-15 segundos
    D: Solo cuando se prepare para cambiar de carril
  answer: B
  explanation: Mantenga sus ojos en movimiento. Use sus espejos para revisar alrededor
    y detrás del vehículo cada 6-8 segundos.
- id: 181
  category: safe_driving_rules
  question: Al avanzar desde una parada, ¿en qué orden debe mirar antes de seguir
    adelante?
  choices:
    A: Derecha, luego izquierda, luego al frente
    B: Al frente, luego izquierda, luego derecha
    C: Izquierda, luego al frente, luego derecha
    D: Izquierda, luego derecha, luego izquierda
  answer: C
  explanation: Al avanzar desde una parada, mire a la izquierda, luego al frente (hacia
    adelante) y luego a la derecha antes de continuar.
- id: 182
  category: defensive_driving
  question: ¿Qué distancia de seguimiento debe mantener entre su vehículo y los demás
    en el flujo de tráfico?
  choices:
    A: Al menos un espacio de 1 a 2 segundos
    B: Al menos un espacio de 3 a 4 segundos
    C: Al menos un espacio de 5 a 6 segundos
    D: Al menos un espacio de 7 a 8 segundos
  answer: B
  explanation: Mantenga al menos un espacio de 3 a 4 segundos entre su vehículo y
    los demás en el flujo de tráfico.
- id: 183
  category: vehicle_information
  question: ¿Qué tipo de vehículo se considera el más seguro para los conductores
    adolescentes según el manual?
  choices:
    A: Camionetas pequeñas y SUVs
    B: Autos deportivos de alto rendimiento
    C: Sedanes de tamaño mediano a grande y camionetas familiares (station wagons)
      con motores más pequeños
    D: Autos compactos con motores grandes
  answer: C
  explanation: Los sedanes de tamaño mediano a grande y las camionetas familiares
    (station wagons) con motores más pequeños y bolsas de aire son los más seguros
    para los conductores adolescentes.
- id: 184
  category: driver_responsibility
  question: ¿Cuál es el enfoque recomendado para los padres al imponer consecuencias
    a un adolescente que infringe las reglas de conducción familiares?
  choices:
    A: Asignar tareas domésticas adicionales.
    B: Hacer que las consecuencias se relacionen con la pérdida de los privilegios
      de conducir.
    C: Confiscar su teléfono celular.
    D: Aumentar su hora de llegada (toque de queda).
  answer: B
  explanation: 'Haga que las consecuencias se relacionen con la pérdida de los privilegios
    de conducir: por un día, un fin de semana, una semana, un mes, etc., dependiendo
    de la infracción. Las consecuencias que no estén relacionadas con la pérdida de
    los privilegios de conducir no serán tan efectivas.'
- id: 185
  category: penalties_and_points
  question: Un conductor puede optar por asistir a un curso de mejoramiento para conductores
    en lugar de recibir puntos en su historial por infracciones a las que se les asignen
    ¿hasta cuántos puntos?
  choices:
    A: Tres puntos o menos
    B: Cinco puntos o menos
    C: Siete puntos o menos
    D: Diez puntos o menos
  answer: B
  explanation: Una persona puede optar por asistir a un curso de mejoramiento para
    conductores en lugar de recibir puntos en el historial de conducción por infracciones
    a las que se les asignen cinco puntos o menos.
- id: 186
  category: safe_driving_rules
  question: En Dakota del Norte, ¿qué porcentaje aproximado de los choques fatales
    representan los conductores adolescentes?
  choices:
    A: 10 por ciento
    B: 20 por ciento
    C: 30 por ciento
    D: 40 por ciento
  answer: B
  explanation: Según el manual, en Dakota del Norte, los conductores adolescentes
    representan aproximadamente el 20 por ciento de los choques fatales.
- id: 187
  category: defensive_driving
  question: ¿Cuál de los siguientes se enumera como uno de los 11 errores de conducción
    principales de los conductores adolescentes?
  choices:
    A: Conducir exactamente al límite de velocidad indicado
    B: Conducir cinco o más millas por hora demasiado rápido para las condiciones
    C: Revisar los espejos con demasiada frecuencia
    D: Usar la señal de giro demasiado pronto
  answer: B
  explanation: El manual enumera "Conducir cinco o más millas por hora demasiado rápido
    para las condiciones" como el segundo error de conducción más común entre los
    adolescentes.
- id: 188
  category: safe_driving_rules
  question: ¿Qué comportamiento indica que un problema de conducta al conducir está
    relacionado con la agresión en lugar de la inexperiencia?
  choices:
    A: Calar el motor en un semáforo
    B: Negar la entrada a su carril o impedir el rebase
    C: Olvidar encender los faros al anochecer
    D: Frenar demasiado fuerte en una señal de alto
  answer: B
  explanation: El manual establece que negar la entrada a su carril o impedir el rebase
    es una actitud y un comportamiento que indica agresión en lugar de inexperiencia.
- id: 189
  category: defensive_driving
  question: ¿Qué es lo primero y más importante que debe hacer cuando se enfrenta
    a un conductor agresivo?
  choices:
    A: Acelerar para alejarse de ellos
    B: Hacer contacto visual para demostrar que no está intimidado
    C: Hacer todo lo posible para quitarse de su camino
    D: Tocar la bocina para alertar a otros conductores
  answer: C
  explanation: Al enfrentarse a conductores agresivos, el manual aconseja que, ante
    todo, debe hacer todo lo posible para quitarse de su camino.
- id: 190
  category: defensive_driving
  question: ¿Por qué el manual recomienda específicamente usar el cinturón de seguridad
    cuando se enfrenta a un conductor agresivo?
  choices:
    A: Demuestra a las autoridades que usted estaba conduciendo de manera segura
    B: Lo mantiene en su asiento si necesita realizar una maniobra de conducción brusca
    C: Lo hace menos visible para el conductor agresivo
    D: Bloquea automáticamente las puertas del vehículo
  answer: B
  explanation: El manual establece que debe usar el cinturón de seguridad porque lo
    mantendrá en su asiento y detrás del volante en caso de que necesite realizar
    una maniobra de conducción brusca, y lo protegerá en un choque.
- id: 191
  category: safe_driving_rules
  question: ¿Si necesita reportar a un conductor agresivo a las autoridades, qué información
    debería intentar proporcionar?
  choices:
    A: La marca de sus neumáticos
    B: Descripción del vehículo, número de placa, ubicación y dirección de viaje
    C: La velocidad exacta a la que viajaba
    D: El número de pasajeros en su vehículo
  answer: B
  explanation: Debe reportar a los conductores agresivos a las autoridades correspondientes
    proporcionando una descripción del vehículo, el número de placa, la ubicación
    y, si es posible, la dirección de viaje.
- id: 192
  category: vehicle_information
  question: Al realizar el ejercicio para familiarizarse con los puntos ciegos frente
    al vehículo, ¿cuándo debe el conductor tocar la bocina?
  choices:
    A: Cuando la persona que camina hacia atrás está a 10 pies de distancia
    B: Cuando puede ver la cintura de la persona
    C: Cuando puede ver los pies de la persona
    D: Cuando la persona llega a la acera
  answer: C
  explanation: Durante el ejercicio de puntos ciegos, la persona fuera del automóvil
    comienza a dar pasos hacia atrás, y el conductor adolescente debe tocar la bocina
    cuando pueda ver los pies de la persona.
- id: 193
  category: license_system
  question: ¿Cuántas horas de experiencia de conducción supervisada al volante deben
    completar los titulares de un permiso de instrucción menores de 16 años?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Los titulares de un permiso de instrucción menores de 16 años deben
    completar un mínimo de 50 horas de experiencia de conducción supervisada al volante.
- id: 194
  category: license_system
  question: ¿Cuál de las siguientes es una condición de conducción requerida para
    el registro de conducción supervisada?
  choices:
    A: Conducir en caminos de grava, tierra o superficie de agregados
    B: Conducir un vehículo de transmisión manual
    C: Conducir mientras remolca un tráiler
    D: Conducir en otro estado
  answer: A
  explanation: El registro de conducción supervisada requiere experiencia en diversas
    condiciones, incluyendo la conducción en caminos de grava, tierra o superficie
    de agregados.
- id: 195
  category: license_system
  question: ¿Las 50 horas requeridas de conducción supervisada reemplazan los requisitos
    formales de educación vial?
  choices:
    A: Sí, si los padres firman una exención
    B: Sí, pero solo si se conducen 10 horas de noche
    C: No, es adicional a los requisitos formales de educación vial
    D: No, pero reduce el requisito de educación formal a la mitad
  answer: C
  explanation: El manual señala que las 50 horas de conducción supervisada son adicionales
    a los requisitos formales de educación vial.
- id: 196
  category: driver_responsibility
  question: ¿Qué es el programa 'Alive at 25'?
  choices:
    A: Un programa de 4.5 horas dirigido a conductores menores de 25 años para ayudarlos
      a asumir una mayor responsabilidad
    B: Una prueba obligatoria para todos los conductores que renuevan su licencia
      a los 25 años
    C: Un programa de descuentos para la compra de un vehículo nuevo
    D: Una prueba de aptitud física para conductores comerciales
  answer: A
  explanation: '''Alive at 25'' es un programa altamente interactivo de 4.5 horas
    dirigido a conductores menores de 25 años que ayuda a los conductores jóvenes
    a asumir una mayor responsabilidad en su conducción.'
- id: 197
  category: driver_responsibility
  question: Mientras que la educación vial estándar enseña la mecánica del manejo
    del automóvil, ¿en qué se enfoca el programa 'Alive at 25'?
  choices:
    A: Técnicas avanzadas de estacionamiento en paralelo
    B: Mantenimiento y reparación básica del vehículo
    C: Comportamiento, juicio, toma de decisiones y consecuencias
    D: Navegación en viajes por carretera a través del país
  answer: C
  explanation: Mientras que la educación vial enseña la mecánica del manejo del automóvil
    y de la carretera, así como las leyes estatales, 'Alive at 25' se enfoca en el
    comportamiento, el juicio, la toma de decisiones y las consecuencias.
- id: 198
  category: penalties_and_points
  question: En Dakota del Norte, los cursos aprobados como 'Alive at 25' y Conducción
    Defensiva pueden proporcionar ¿cuál de los siguientes beneficios?
  choices:
    A: Una renovación de licencia gratuita
    B: Un descuento en el seguro y reducción de puntos
    C: Exención del uso del cinturón de seguridad
    D: La capacidad de conducir sin un adulto con licencia
  answer: B
  explanation: El manual establece que estos cursos están aprobados en Dakota del
    Norte para obtener un descuento en el seguro y una reducción de puntos.
- id: 199
  category: safe_driving_rules
  question: De acuerdo con la lista de los 11 principales errores de conducción para
    adolescentes, ¿cuál de los siguientes es un error común relacionado con el derecho
    de paso?
  choices:
    A: Ceder el paso con demasiada frecuencia en las paradas de cuatro vías
    B: Tomar deliberadamente el derecho de paso
    C: Esperar demasiado para girar a la derecha en rojo
    D: Ceder siempre el derecho de paso a los peatones
  answer: B
  explanation: El error número 10 en la lista de los '11 principales errores de conducción'
    es 'Tomar deliberadamente el derecho de paso'.
- id: 200
  category: vehicle_information
  question: Si experimenta un neumático desinflado o un reventón, ¿en qué página del
    manual debe buscar orientación?
  choices:
    A: Página 21
    B: Página 29
    C: Página 30
    D: Página 40
  answer: C
  explanation: Según el índice proporcionado, la información sobre neumáticos desinflados
    o reventones se encuentra en la página 30.
- id: 201
  category: safe_driving_rules
  question: ¿Cuál de las siguientes maniobras y reglas de conducción se cubren en
    la página 21 del manual?
  choices:
    A: Distancias de seguimiento y frenado
    B: Cambios de carril
    C: Rebasar (Passing)
    D: Todas las anteriores
  answer: D
  explanation: El texto del manual enumera las distancias de seguimiento y frenado,
    los cambios de carril y el rebasar, todos en la página 21.
- id: 202
  category: alcohol_drugs_health
  question: ¿Dónde puede encontrar información sobre la ley de Consentimiento Implícito
    (Implied Consent)?
  choices:
    A: Página 36
    B: Página 37
    C: Página 40
    D: Página 42
  answer: A
  explanation: El texto del manual proporcionado indica que la ley de Consentimiento
    Implícito se cubre en la página 36.
- id: 203
  category: sharing_the_road
  question: Bajo la sección de 'Vehículos Recreativos', ¿cuál de los siguientes NO
    figura explícitamente como un subtema en el texto proporcionado?
  choices:
    A: Bicicletas y bicicletas motorizadas
    B: Vehículos todoterreno (Off-Highway Vehicles)
    C: Embarcaciones y botes
    D: Motonieves
  answer: C
  explanation: El manual enumera bicicletas y bicicletas motorizadas, vehículos todoterreno
    y motonieves bajo Vehículos Recreativos. Las embarcaciones y botes no figuran
    en esta sección.
- id: 204
  category: signs_and_signals
  question: ¿En qué página encontraría información sobre indicaciones intermitentes,
    indicaciones de giro a la izquierda y señales de tráfico?
  choices:
    A: Página 11
    B: Página 12
    C: Página 14
    D: Página 15
  answer: D
  explanation: El índice agrupa las indicaciones intermitentes, las indicaciones de
    giro a la izquierda y las señales de tráfico bajo la sección de 'Señales' en la
    página 15.
- id: 205
  category: safe_driving_rules
  question: El manual agrupa varios temas de estacionamiento. ¿Cuál de los siguientes
    temas de estacionamiento se encuentra en la página 25?
  choices:
    A: No estacionar
    B: Estacionamiento de emergencia
    C: Estacionamiento en paralelo
    D: Salir de un espacio de estacionamiento
  answer: C
  explanation: Según el índice, el estacionamiento en paralelo y el estacionamiento
    en una colina se encuentran en la página 25, mientras que los otros temas de estacionamiento
    (No estacionar, Estacionamiento de emergencia, Salir de un espacio de estacionamiento)
    están en la página 26.
- id: 206
  category: alcohol_drugs_health
  question: ¿Qué página cubre la Ley de Contenedor Abierto (Open Container Law), la
    Ley de Posesión/Consumo por Menores y el Reporte de Conducción Bajo los Efectos
    del Alcohol o Drogas?
  choices:
    A: Página 36
    B: Página 37
    C: Página 40
    D: Página 42
  answer: B
  explanation: El texto proporcionado enumera la Ley de Posesión/Consumo por Menores,
    la Ley de Contenedor Abierto y el Reporte de Conducción Bajo los Efectos del Alcohol
    o Drogas, todos en la página 37.
- id: 207
  category: driver_responsibility
  question: Si un padre desea leer sobre el 'Acuerdo de Conducción entre Padres y
    Adolescentes', ¿qué página debe consultar?
  choices:
    A: Página 6
    B: Página 41
    C: Página 42
    D: Página 43
  answer: C
  explanation: El 'Acuerdo de Conducción entre Padres y Adolescentes' (Parent-Teen
    Driving Agreement) se enumera en la página 42 del manual.
- id: 208
  category: signs_and_signals
  question: ¿Qué tipo de señal se cubre en la página 9 del manual?
  choices:
    A: Señales de guía
    B: Señales reglamentarias
    C: Señales de advertencia
    D: Señales escolares
  answer: B
  explanation: El índice indica que las señales reglamentarias se cubren en la página
    9.
- id: 209
  category: defensive_driving
  question: La información sobre 'Condiciones de Conducción de Alto Riesgo' se puede
    encontrar en la misma página que ¿qué otro tema?
  choices:
    A: Sistema de puntos
    B: Derrapes
    C: Inundaciones
    D: Conducción nocturna
  answer: A
  explanation: Tanto las 'Condiciones de Conducción de Alto Riesgo' como el 'Sistema
    de puntos' se enumeran en la página 40.
- id: 210
  category: license_system
  question: ¿En qué parte del manual puede encontrar información sobre 'Personas que
    no pueden obtener una licencia'?
  choices:
    A: Página 3
    B: Página 6
    C: Página 7
    D: Página 8
  answer: A
  explanation: El texto muestra que 'Personas que no pueden obtener una licencia'
    y 'Permisos' se encuentran ambos en la página 3.
- id: 211
  category: sharing_the_road
  question: ¿En qué página analiza el manual cómo compartir la carretera con motocicletas?
  choices:
    A: Página 30
    B: Página 32
    C: Página 37
    D: Página 38
  answer: B
  explanation: '''Motocicletas - Compartir la carretera'' aparece en la página 32
    del manual.'
- id: 212
  category: driver_testing
  question: Los "11 errores de conducción principales" se analizan en la sección para
    supervisar a conductores adolescentes. ¿En qué página se encuentra esto?
  choices:
    A: Página 40
    B: Página 41
    C: Página 42
    D: Página 43
  answer: D
  explanation: El índice enumera los '11 errores de conducción principales' en la
    página 43.
- id: 213
  category: license_system
  question: ¿Qué página contiene información sobre la donación de órganos, tejidos
    y ojos?
  choices:
    A: Página 3
    B: Página 6
    C: Página 7
    D: Página 8
  answer: B
  explanation: Según el texto proporcionado, la 'Donación de órganos, tejidos y ojos'
    se trata en la página 6, junto con la 'Licencia de conducir para menores'.
- id: 214
  category: defensive_driving
  question: Si busca información sobre cómo manejar los "derrapes", ¿a qué página
    debe dirigirse?
  choices:
    A: Página 21
    B: Página 24
    C: Página 29
    D: Página 30
  answer: C
  explanation: El manual enumera los 'derrapes', junto con 'inundaciones' y 'lluvia',
    en la página 29.
- id: 215
  category: driver_responsibility
  question: Según la política del NDDOT, ¿todos los empleados tienen derecho a trabajar
    en un entorno libre de qué?
  choices:
    A: Distracciones
    B: Acoso
    C: Ruido
    D: Quejas de los clientes
  answer: B
  explanation: 'El manual establece: ''Es política del NDDOT que todos los empleados
    tengan derecho a trabajar en un entorno libre de acoso''.'
- id: 216
  category: driver_responsibility
  question: ¿Cuándo puede un empleado del NDDOT interrumpir el servicio a un cliente?
  choices:
    A: Si el cliente hace demasiadas preguntas
    B: Si el cliente crea un entorno de trabajo hostil u ofensivo
    C: Si el cliente reprueba su examen escrito
    D: Si la transacción tarda más de 15 minutos
  answer: B
  explanation: Según el texto, un empleado puede interrumpir el servicio si un cliente
    crea un 'entorno de trabajo hostil, intimidante u ofensivo'.
- id: 217
  category: driver_responsibility
  question: Según el Título VI de la Ley de Derechos Civiles de 1964, el NDDOT prohíbe
    la discriminación basada en ¿cuál de los siguientes?
  choices:
    A: Experiencia de conducción
    B: Tipo de vehículo
    C: Nivel de ingresos
    D: Afiliación política
  answer: C
  explanation: La política del Título VI establece explícitamente que ninguna persona
    será discriminada por motivos de 'raza, color, origen nacional, sexo, edad, discapacidad
    o nivel de ingresos'.
- id: 218
  category: license_system
  question: ¿Cuál es el sitio web oficial del Departamento de Transporte de Dakota
    del Norte?
  choices:
    A: www.nd.gov/transport
    B: www.dot.nd.gov
    C: www.nddot.com
    D: www.drive.nd.gov
  answer: B
  explanation: El sitio web oficial proporcionado al final del texto es 'www.dot.nd.gov'.
- id: 219
  category: sharing_the_road
  question: Según el manual, ¿cuál es otro término utilizado para describir los puntos
    ciegos de un camión?
  choices:
    A: La "Zona de peligro"
    B: La "No-Zone" (Zona prohibida)
    C: El "Área ciega"
    D: La "Zona de visibilidad cero"
  answer: B
  explanation: 'El índice del manual enumera los ''Puntos ciegos'' junto con el término
    ''(la “No-Zone”)''. '
- id: 220
  category: defensive_driving
  question: El manual incluye una sección sobre "Encuentro con equipos de remoción
    de nieve" ¿bajo qué tema principal de conducción?
  choices:
    A: Conducción defensiva
    B: Conducción en invierno
    C: Compartir la carretera
    D: Vehículos de emergencia
  answer: B
  explanation: En el índice, 'Encuentro con equipos de remoción de nieve' aparece
    como un subtema bajo 'Conducción en invierno'.
- id: 221
  category: signs_and_signals
  question: ¿Cuál de los siguientes se menciona como un dispositivo utilizado en una
    "Zona de obras"?
  choices:
    A: Paneles de flechas parpadeantes
    B: Reductores de velocidad (Speed bumps)
    C: Cámaras de tráfico
    D: Estaciones de pesaje
  answer: A
  explanation: El índice incluye 'Paneles de flechas parpadeantes' bajo la categoría
    de 'Zona de obras'.
- id: 222
  category: driver_responsibility
  question: Según la política de acoso del NDDOT, ¿qué tipo de material exhibido por
    un cliente podría causar que un empleado interrumpa el servicio?
  choices:
    A: Folletos de campañas políticas
    B: Parafernalia sexualmente explícita
    C: Anuncios de la competencia
    D: Manuales de conducción no oficiales
  answer: B
  explanation: La política establece que un empleado puede interrumpir el servicio
    si se ve expuesto a 'parafernalia sexualmente explícita'.
- id: 223
  category: driver_responsibility
  question: 'Bajo el Título VI de la Ley de Derechos Civiles de 1964, a ninguna persona
    se le negarán los beneficios de los programas del NDDOT por motivos de:'
  choices:
    A: Edad
    B: Historial de conducción
    C: Estado del seguro
    D: Propiedad del vehículo
  answer: A
  explanation: Bajo el Título VI de la Ley de Derechos Civiles de 1964, la discriminación
    está prohibida por varios motivos, incluyendo la 'edad'.
- id: 224
  category: signs_and_signals
  question: ¿Cuál de los siguientes dispositivos está categorizado específicamente
    bajo "Zona de obras" en el manual?
  choices:
    A: Dispositivos de canalización
    B: Parquímetros
    C: Casetas de peaje
    D: Señales de cruce de peatones
  answer: A
  explanation: El índice enumera específicamente 'Dispositivos de canalización' bajo
    el encabezado de 'Zona de obras'.
- id: 225
  category: license_system
  question: ¿El manual proporciona consejos específicos para supervisar a qué grupo
    de conductores?
  choices:
    A: Conductores de edad avanzada
    B: Conductores comerciales
    C: Conductores adolescentes
    D: Motociclistas
  answer: C
  explanation: 'El índice incluye una sección titulada ''Conducción de adolescentes:
    consejos para la supervisión''.'
- id: 226
  category: driver_responsibility
  question: Según la política de acoso del NDDOT, ¿un empleado puede interrumpir el
    servicio si la conducta de un cliente interfiere con qué?
  choices:
    A: El flujo del tráfico
    B: El desempeño laboral del empleado
    C: El horario de funcionamiento de la instalación
    D: El equipo de examen
  answer: B
  explanation: El texto señala que el servicio puede interrumpirse si la conducta
    de un cliente 'puede interferir con el desempeño laboral del empleado'.
- id: 227
  category: sharing_the_road
  question: '¿Cuál de los siguientes se menciona como un subtema bajo "Camiones: compartir
    la carretera"?'
  choices:
    A: Carga de mercancías
    B: Maniobrabilidad
    C: Eficiencia de combustible
    D: Procedimientos de las estaciones de pesaje
  answer: B
  explanation: 'El índice incluye la ''Maniobrabilidad'' como un subtema bajo ''Camiones:
    compartir la carretera''.'
- id: 228
  category: signs_and_signals
  question: ¿Qué tipo de personal se menciona específicamente bajo la sección de "Zona
    de obras" del manual?
  choices:
    A: Guardias de cruce escolar
    B: Oficiales de policía
    C: Banderilleros (Flagpersons)
    D: Cobradores de peaje
  answer: C
  explanation: Bajo la sección de 'Zona de obras', el índice enumera específicamente
    a los 'Banderilleros'.
- id: 229
  category: license_system
  question: La política del NDDOT establece que ninguna persona será excluida de participar
    en los servicios administrados por ¿quién?
  choices:
    A: La Administración Federal de Carreteras
    B: El Departamento de Transporte de Dakota del Norte
    C: El Departamento de Vehículos Motorizados
    D: La Patrulla de Caminos del Estado
  answer: B
  explanation: La política del Título VI se aplica a todos los programas, servicios
    o actividades 'administrados por el Departamento de Transporte de Dakota del Norte'.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 230
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 231
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe ingresar a la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico en sentido contrario.
  id: 232
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Dar una vuelta en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una calle de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 233
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección hacia
    la que apunta la flecha.'
  id: 234
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Vueltas en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de vuelta en U tachada
    significa que las vueltas en U están prohibidas en este lugar.
  id: 235
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 236
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite la vuelta en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 237
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 238
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 239
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 240
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 241
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de un peatón
    advierte sobre un cruce de peatones más adelante. Esté preparado para detenerse
    ante los peatones que crucen la calle.
  id: 242
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal de forma pentagonal (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 243
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 244
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de vías férreas. Significa que debe ceder el paso a los trenes.
    Si se aproxima un tren, debe detenerse.
  id: 245
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Se requiere giro a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 246
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 247
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera curve
    primero hacia un lado y luego hacia el otro.
  id: 248
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 249
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico incorporándose desde otra carretera
    C: Inicio de una carretera dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 250
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera se vuelve más estrecha
    más adelante. Esté preparado para una reducción en el ancho de la vía y ajuste
    su posición en el carril.
  id: 251
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en direcciones
    opuestas. Manténgase a la derecha.
  id: 252
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Esté preparado para
    el tráfico de doble sentido.
  id: 253
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de rebase más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de un solo sentido o de una autopista dividida y
    se encuentre con vehículos que viajan en la dirección opuesta.
  id: 254
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 255
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 256
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 257
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 258
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las carreteras
    laterales.
  id: 259
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la carretera principal desde la vía lateral.
  id: 260
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse al tráfico existente. El tráfico que
    entra desde la rampa tiene su propio carril nuevo.
  id: 261
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 262
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 263
