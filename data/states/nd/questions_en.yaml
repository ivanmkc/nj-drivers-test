metadata:
  source: 2025-2027 Noncommercial Driver License Manual (dot.nd.gov)
  total_questions: 263
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_testing
  question: What happens if you leave the knowledge testing area while your test is
    in progress?
  choices:
    A: Your test will be paused until you return.
    B: You will receive a failed test score.
    C: You will be charged an additional testing fee.
    D: You must retake the test the following day.
  answer: B
  explanation: According to the manual, you will receive a failed test score if you
    leave the testing area while your test is in progress.
- id: 2
  category: driver_testing
  question: Which of the following driver license offices remains open during the
    12:00-1:00 p.m. lunch hour?
  choices:
    A: Fargo
    B: Dickinson
    C: Williston
    D: Jamestown
  answer: A
  explanation: The manual states that all sites are closed from 12:00-1:00 p.m. except
    Bismarck, Minot, Grand Forks, and Fargo.
- id: 3
  category: driver_testing
  question: If a recognized holiday falls on a Saturday, when is the driver license
    office closed?
  choices:
    A: The following Monday
    B: The preceding Thursday
    C: The preceding Friday
    D: The following Tuesday
  answer: C
  explanation: The manual specifies that if holidays fall on a Saturday, the preceding
    Friday is the holiday.
- id: 4
  category: license_system
  question: What is required for all applicants under the age of 18 when applying
    for a permit or license?
  choices:
    A: A high school diploma or equivalent.
    B: A signature of approval and sponsorship from a parent, legal guardian, or designated
      person.
    C: A letter of recommendation from a driver's education instructor.
    D: Proof of at least 60 hours of supervised driving.
  answer: B
  explanation: All applicants less than 18 years of age must have a parent, legal
    guardian, or designated person sign approval and sponsorship on the application.
- id: 5
  category: driver_testing
  question: How early must you arrive to take a knowledge test before the office closes
    for lunch or for the day?
  choices:
    A: No later than 15 minutes prior
    B: No later than 30 minutes prior
    C: No later than 45 minutes prior
    D: No later than one hour prior
  answer: D
  explanation: You must arrive no later than one hour prior to noon (if testing at
    an office that closes for lunch) and no later than one hour prior to closing.
- id: 6
  category: driver_testing
  question: What will happen if you bring a cell phone or backpack into the knowledge
    testing area?
  choices:
    A: You will receive a failed test score.
    B: The items will be held at the front desk.
    C: You will be asked to turn the phone off.
    D: You will be given a warning.
  answer: A
  explanation: 'Cell phones, backpacks, and other electronic devices are not allowed
    in the testing area. The manual states: ''IMPORTANT: You will receive a failed
    test score if you bring any of these items into the testing area.'''
- id: 7
  category: driver_testing
  question: What specific document is required for road test applicants who are under
    16 years of age?
  choices:
    A: A medical clearance form
    B: A driver's education Certificate of Training
    C: A high school transcript
    D: A written essay on road safety
  answer: B
  explanation: Applicants less than 16 years of age are required to present a driver's
    education Certificate of Training.
- id: 8
  category: driver_testing
  question: Who must accompany an applicant under 16 years of age to their road test?
  choices:
    A: A licensed driver over the age of 21
    B: A driver's education instructor
    C: A parent or legal guardian
    D: Any family member over the age of 18
  answer: C
  explanation: The manual states that applicants under 16 must be accompanied by a
    parent or legal guardian.
- id: 9
  category: driver_testing
  question: What is the policy regarding self-parking vehicles during the road test?
  choices:
    A: They are encouraged for the parallel parking portion.
    B: They are allowed only if the examiner approves.
    C: They are not allowed unless the self-parking feature is deactivated.
    D: They are only allowed for applicants over the age of 18.
  answer: C
  explanation: Self-parking vehicles are not allowed. The applicant must test in a
    different vehicle or deactivate the self-parking feature.
- id: 10
  category: vehicle_information
  question: During the vehicle inspection for a road test, how far must the vehicle's
    horn be clearly audible?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: In order to pass inspection, your vehicle must have a horn clearly
    audible for 200 feet.
- id: 11
  category: vehicle_information
  question: According to the vehicle inspection checklist, your vehicle must have
    mirrors that allow you to see the road how far behind you?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: The vehicle must have one or more mirrors so that you can see the road
    200 feet behind you.
- id: 12
  category: license_system
  question: How many consecutive days must a person live in North Dakota to be deemed
    a resident for driver licensing purposes (excluding nonresident students, tourists,
    or military)?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Any person other than a nonresident student, a tourist, or a nonresident
    member of the Armed Forces who has lived in this state for 90 consecutive days,
    shall be deemed a resident of North Dakota for the purpose of driver licensing.
- id: 13
  category: license_system
  question: After becoming a resident of North Dakota, how long may you operate a
    Class D vehicle with an operator's license from another state?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: You may operate a Class D or M vehicle with an operator's license from
    another state for a period of 60 days after you become a resident.
- id: 14
  category: driver_testing
  question: Which of the following is NOT allowed in the vehicle during a road test?
  choices:
    A: Proof of insurance
    B: Current vehicle registration
    C: Passengers
    D: Seat belts
  answer: C
  explanation: Pets (except medical alert/service animals), passengers, and electronic
    devices such as cell phones will not be allowed in the vehicle during the road
    test.
- id: 15
  category: driver_testing
  question: Which of the following items must an applicant provide for the vehicle
    used during the road test?
  choices:
    A: A bill of sale
    B: Current proof of insurance
    C: A vehicle history report
    D: A maintenance log
  answer: B
  explanation: The manual states that the applicant must provide current proof of
    insurance for the vehicle used during the road test.
- id: 16
  category: license_system
  question: How many days do Class A, B, or C commercial vehicle operators have to
    acquire a North Dakota Commercial Driver License after becoming a resident?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Class A, B, or C vehicle operators have 30 days in which to acquire
    a North Dakota Commercial Driver License after becoming a resident.
- id: 17
  category: license_system
  question: What is the minimum age for a non-resident to legally drive in North Dakota
    with a valid license from their home state or country?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 18 years of age
  answer: C
  explanation: A non-resident must be at least 16 years of age to drive in North Dakota,
    provided they have a valid license from their home state or country.
- id: 18
  category: alcohol_drugs_health
  question: Under what condition can a person with a history of seizures or blackouts
    obtain a North Dakota driver's license?
  choices:
    A: If they have had no seizures for at least three consecutive months.
    B: If they have had no seizures for at least six consecutive months and submit
      to a medical examination.
    C: If they have had no seizures for at least one year and provide a doctor's note.
    D: Persons with a history of seizures can never obtain a driver's license.
  answer: B
  explanation: An exception is made if the person in question has had no seizures
    for at least six consecutive months, and is willing to submit to the required
    medical examination.
- id: 19
  category: license_system
  question: What are the requirements for the supervising driver when you are practicing
    with an Instruction Permit?
  choices:
    A: At least 16 years old with one year of driving experience.
    B: At least 18 years old with at least three years of driving experience.
    C: At least 21 years old with at least one year of driving experience.
    D: At least 25 years old with at least five years of driving experience.
  answer: B
  explanation: The supervising driver must have a valid license for the class of vehicle
    being driven, be at least 18 years of age, and have had at least three years of
    driving experience.
- id: 20
  category: safe_driving_rules
  question: When driving with an Instruction Permit, who is allowed to sit in the
    front seat besides the permit holder and the supervising driver?
  choices:
    A: Immediate family members only.
    B: Up to two additional passengers.
    C: No one else, unless the vehicle only has a front seat.
    D: Anyone, as long as they are wearing a seatbelt.
  answer: C
  explanation: An individual other than the supervising driver and the permit holder
    may not be in the front seat unless the vehicle has only a front seat.
- id: 21
  category: license_system
  question: How long must a 14 or 15-year-old hold an instruction permit before completing
    the road test for an operator's license?
  choices:
    A: 6 months or to the age of 16, whichever comes first.
    B: 12 months or to the age of 16, whichever comes first, but no less than six
      months.
    C: 12 months regardless of their age.
    D: 3 months if they have completed driver's education.
  answer: B
  explanation: Individuals who are 14 or 15 years old must hold the instruction permit
    for 12 months or to the age of 16, whichever comes first, but no less than six
    months.
- id: 22
  category: driver_testing
  question: How many hours of supervised practice driving must individuals under 16
    complete before taking their road test?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: Individuals under 16 must complete a minimum of 50 hours of supervised
    practice driving in variable conditions.
- id: 23
  category: driver_testing
  question: What driver training is required to waive the Class D road test using
    a Certificate of Course Completion?
  choices:
    A: 10 hours of classroom training and 2 hours behind the wheel.
    B: 20 hours of classroom training and 4 hours behind the wheel.
    C: 30 hours of classroom training and 6 hours behind the wheel.
    D: 50 hours of classroom training and 10 hours behind the wheel.
  answer: C
  explanation: The road test may be waived by presenting a certificate certifying
    completion of a minimum of 30 hours of classroom driver training and a minimum
    of six hours of actual behind the wheel driver training.
- id: 24
  category: penalties_and_points
  question: What is the penalty for driving in violation of the conditions of an instruction
    permit?
  choices:
    A: A 1-point penalty on your driving record.
    B: A 2-point penalty on your driving record.
    C: A 4-point penalty on your driving record.
    D: Immediate license suspension for 30 days.
  answer: B
  explanation: It is a two-point penalty on your driving record for driving in violation
    of the conditions of an instruction permit.
- id: 25
  category: license_system
  question: What must a 14 or 15-year-old do to receive a license to operate a motorcycle?
  choices:
    A: Complete 50 hours of supervised motorcycle practice.
    B: Hold a valid Class D operator's license for at least 6 months.
    C: Successfully complete an approved motorcycle safety course and pass the motorcycle
      knowledge test.
    D: Obtain a road test waiver from a high school driver education program.
  answer: C
  explanation: If you are 14 or 15 years old, you may receive a license to operate
    a motorcycle by successfully completing an approved motorcycle safety course and
    passing the motorcycle knowledge test.
- id: 26
  category: license_system
  question: What is the minimum age required to operate a motorized bicycle in North
    Dakota?
  choices:
    A: 12 years of age
    B: 14 years of age
    C: 15 years of age
    D: 16 years of age
  answer: B
  explanation: To operate a motorized bicycle, you must be at least 14 years of age
    or older and have in your immediate possession a valid permit or license.
- id: 27
  category: license_system
  question: If your current name is different than the name on your identity document,
    which of the following is an acceptable document to prove your legal name change?
  choices:
    A: A hospital birth certificate
    B: A notarized letter from a parent or guardian
    C: A certified marriage certificate
    D: A photocopy of a court order
  answer: C
  explanation: Acceptable documents for proof of name change are a certified marriage
    certificate, a certified adoption document, or a certified court order (no photocopies).
- id: 28
  category: license_system
  question: How many documents are required to provide satisfactory proof of North
    Dakota residence address?
  choices:
    A: One document
    B: Two documents
    C: Three documents
    D: Four documents
  answer: B
  explanation: Proof of North Dakota residence address (place of domicile) is required
    by presenting two documents from the approved list.
- id: 29
  category: license_system
  question: If a North Dakota resident holds a valid operator's license when they
    leave the state for active duty in the Armed Forces, how long does the license
    remain valid?
  choices:
    A: Until 10 days after discharge or separation from the service.
    B: Until 30 days after discharge or separation from the service.
    C: Until 60 days after discharge or separation from the service.
    D: Until 90 days after discharge or separation from the service.
  answer: B
  explanation: If these people held a valid operator's license when they left the
    state, it will remain valid until 30 days after discharge or separation from the
    service.
- id: 30
  category: license_system
  question: Which of the following is NOT acceptable as proof of a physical residence
    address?
  choices:
    A: A current utility bill
    B: A Post Office box
    C: A current pay stub
    D: A current vehicle insurance policy
  answer: B
  explanation: The manual explicitly states, "Post Office boxes are NOT acceptable
    for residence address."
- id: 31
  category: driver_testing
  question: Who is responsible for providing the vehicle for a road test?
  choices:
    A: The Driver License office
    B: The license applicant
    C: A commercial driving school
    D: The Department of Transportation
  answer: B
  explanation: The manual states, "License applicants must furnish their own vehicle
    for the road test."
- id: 32
  category: driver_testing
  question: If you fail any part of the driving examination, when can you retake it?
  choices:
    A: Immediately
    B: The same day
    C: You will not be allowed to retake it the same day
    D: After waiting 30 days
  answer: C
  explanation: The manual states, "If you fail any of the tests, you will not be allowed
    to retake the examination the same day."
- id: 33
  category: driver_responsibility
  question: How are donated organs allocated to recipients?
  choices:
    A: Based on the donor's age and health conditions
    B: Based on medical urgency, length of time waiting, genetic matching, and geography
    C: Based on the financial status of the recipient
    D: Based on a random lottery system
  answer: B
  explanation: The manual states, "Organs are allocated to recipients based upon medical
    urgency, length of time waiting, genetic matching, and geography."
- id: 34
  category: license_system
  question: When a 15-year-old successfully completes the road test, they are issued
    a restricted Class D license. Whose vehicles are they restricted to operating?
  choices:
    A: Any vehicle registered in North Dakota
    B: Only vehicles equipped with dual controls
    C: Their parent's, guardian's, grandparent's, sibling's, aunt's or uncle's vehicles
    D: Only vehicles owned by a licensed driving school
  answer: C
  explanation: The manual states, "While in possession of a restricted Class D operator’s
    license, the driver is restricted to operating his or her parent’s, guardian’s,
    grandparent’s, sibling’s, aunt’s or uncle’s vehicles."
- id: 35
  category: safe_driving_rules
  question: A 15-year-old with a restricted Class D license cannot drive without an
    adult between what hours (unless an exception applies)?
  choices:
    A: Between sunset or 9:00 p.m. (whichever is later) and 5:00 a.m.
    B: Between 10:00 p.m. and 6:00 a.m.
    C: Between sunset and sunrise
    D: Between 8:00 p.m. and 7:00 a.m.
  answer: A
  explanation: The manual states that at age 15, the individual is not allowed to
    operate a vehicle without a parent, legal guardian, or an individual at least
    18 years of age "between the later of sunset or 9:00 p.m. and 5:00 a.m."
- id: 36
  category: safe_driving_rules
  question: Which of the following is a valid exception for a 15-year-old with a restricted
    Class D license to drive alone during restricted nighttime hours?
  choices:
    A: Driving to a friend's house
    B: Driving directly to or from an official school activity
    C: Driving to a late-night movie
    D: Driving to the grocery store
  answer: B
  explanation: The manual states, "The only exception to this is driving directly
    to or from work, an official school activity or a religious activity."
- id: 37
  category: safe_driving_rules
  question: Under what circumstances may a licensed driver under the age of 18 use
    an electronic communication device while driving?
  choices:
    A: To read a text message at a red light
    B: To answer a phone call from a parent
    C: To obtain emergency assistance
    D: To select music on a playlist
  answer: C
  explanation: 'The manual prohibits electronic communication device use for drivers
    under 18, but notes: "The only exception is to obtain emergency assistance, to
    prevent a crime that appears about to be committed, or in the reasonable belief
    that an individual’s life or safety is in danger."'
- id: 38
  category: penalties_and_points
  question: If a minor under 18 has their license cancelled for an alcohol or drug-related
    offense, what happens to their driving record points?
  choices:
    A: The points automatically go back to zero.
    B: The points are transferred to their parent's license.
    C: The points total does not automatically go back to zero.
    D: The points are reduced by half.
  answer: C
  explanation: The manual states, "The points total does not automatically go back
    to zero when the cancellation requirements are fulfilled."
- id: 39
  category: license_system
  question: What does a Restriction "1" on your permit or license indicate?
  choices:
    A: Outside Mirrors
    B: Automatic Transmission
    C: Daylight Driving Only
    D: Corrective Lenses
  answer: D
  explanation: According to the Standard Restrictions list in the manual, Restriction
    1 is for "Corrective Lenses".
- id: 40
  category: license_system
  question: How early can you renew your driver's license prior to its expiration
    without losing any time remaining on the old license?
  choices:
    A: 3 months
    B: 6 months
    C: 10 months
    D: 12 months
  answer: C
  explanation: The manual states, "You may renew your license 10 months prior to expiration
    without losing any time remaining on the old license."
- id: 41
  category: license_system
  question: When renewing your license, if you present a certificate of vision obtained
    from a physician or optometrist, how old can the certificate be?
  choices:
    A: Not more than 30 days old
    B: Not more than 6 months old
    C: Not more than 1 year old
    D: Not more than 2 years old
  answer: B
  explanation: The manual states, "The certificate must not be more than six months
    old."
- id: 42
  category: license_system
  question: At what age does a restricted Class D Operator’s License transition to
    an unrestricted license?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: A
  explanation: The manual states, "At age 16 the restricted Class D Operator’s License
    transitions to an unrestricted license."
- id: 43
  category: driver_responsibility
  question: If you permanently lose the use of a hand, arm, foot, leg, or eye, what
    must you do?
  choices:
    A: Surrender your driver's license immediately to law enforcement.
    B: Report it to the Driver License Division.
    C: Stop driving for at least 6 months.
    D: Retake the written knowledge test.
  answer: B
  explanation: 'The manual states, "If you permanently lose the use of a hand, arm,
    foot, leg, or eye, you must report it to: Driver License Division, North Dakota
    Department of Transportation..."'
- id: 44
  category: license_system
  question: If you change your name or address, within how many days must you notify
    the Driver License Division?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: According to the manual, if you change your name or address, you must
    notify the Driver License Division within 10 days and provide documentary evidence.
- id: 45
  category: vehicle_information
  question: When must a motor vehicle be registered in North Dakota if the owner becomes
    a resident or is gainfully employed in the state?
  choices:
    A: Within 30 days
    B: Within 60 days
    C: Immediately
    D: Before the out-of-state registration expires
  answer: C
  explanation: North Dakota law requires that a motor vehicle be registered immediately
    when the owner or operator becomes a resident of the state or becomes gainfully
    employed in the state.
- id: 46
  category: vehicle_information
  question: How long are temporary registration permits available for if you plan
    to be in North Dakota for only a short time?
  choices:
    A: 30 or 60 days
    B: 3 months or 6 months
    C: 6 months or 12 months
    D: 12 months or 24 months
  answer: C
  explanation: Temporary registration permits are available for six months or 12 months
    for those whose out-of-state license is current and who plan to be in North Dakota
    only a short time.
- id: 47
  category: license_system
  question: A standard Class D license allows you to drive a single vehicle weighing
    less than 26,001 pounds GVWR and tow a trailer weighing up to how much?
  choices:
    A: 5,000 pounds GVWR
    B: 10,000 pounds GVWR
    C: 15,000 pounds GVWR
    D: 26,000 pounds GVWR
  answer: B
  explanation: A Class D license allows the operation of any single vehicle less than
    26,001 pounds GVWR and may tow trailers not over 10,000 pounds GVWR.
- id: 48
  category: license_system
  question: Which class of license is required for a single vehicle designed to transport
    16 or more passengers, including the driver?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class M
  answer: C
  explanation: A Class C license is for any single vehicle with a GVWR of 26,000 pounds
    or less that is designed to transport 16 or more passengers or is transporting
    hazardous materials.
- id: 49
  category: license_system
  question: Under the farm exemption, a 15-year-old may drive a farm vehicle transporting
    agricultural products within how many miles of the driver's farm?
  choices:
    A: 50 miles
    B: 100 miles
    C: 150 miles
    D: 200 miles
  answer: C
  explanation: Under the farm exemption, a 15-year-old may drive a farm vehicle within
    150 miles of the driver's farm when transporting agricultural products or farm
    supplies.
- id: 50
  category: signs_and_signals
  question: What is the primary purpose of regulatory signs on streets and highways?
  choices:
    A: To warn drivers of potentially hazardous conditions ahead
    B: To guide drivers to specific destinations and services
    C: To control and regulate traffic by giving mandatory instructions
    D: To indicate points of historical or cultural interest
  answer: C
  explanation: Regulatory signs control and regulate traffic. They give mandatory
    instructions to the driver.
- id: 51
  category: signs_and_signals
  question: If you approach a Stop sign at an intersection with no stop line or crosswalk,
    where should you stop?
  choices:
    A: Exactly at the Stop sign
    B: As near as possible before the intersection where you can safely see approaching
      traffic
    C: Ten feet before the intersection
    D: In the middle of the intersection to check for traffic
  answer: B
  explanation: If there is no stop line or crosswalk, stop as near as possible before
    the intersection where you can safely see traffic approaching from all directions.
- id: 52
  category: signs_and_signals
  question: A Speed Limit sign shows the maximum speed permitted under what conditions?
  choices:
    A: Hazardous conditions
    B: Ideal conditions
    C: Heavy traffic conditions
    D: Nighttime conditions only
  answer: B
  explanation: The Speed Limit sign is an example of a regulatory sign showing the
    maximum speed permitted under ideal conditions.
- id: 53
  category: signs_and_signals
  question: On a regulatory sign, what does a red circle with a red slash indicate?
  choices:
    A: The action shown is forbidden
    B: The action shown is recommended
    C: You must yield to the action shown
    D: A hazard is present ahead
  answer: A
  explanation: Some regulatory signs prohibit certain actions. A red circle with a
    red slash indicates that the action is forbidden.
- id: 54
  category: signs_and_signals
  question: What is the purpose of a Two-way Left Turn Only lane in the center of
    the roadway?
  choices:
    A: It is used for passing slow-moving vehicles
    B: It is used only by left-turning vehicles in either direction
    C: It is a designated lane for emergency vehicles
    D: It is used for vehicles making right turns
  answer: B
  explanation: Two-way Left Turn Only signs are used when a lane in the center of
    the roadway is to be used only by left turning vehicles in either direction. It
    is not intended for passing or overtaking.
- id: 55
  category: signs_and_signals
  question: What color are most warning signs used to warn you of potentially hazardous
    conditions ahead?
  choices:
    A: Red with white letters
    B: White with black letters
    C: Yellow with a black legend
    D: Green with white letters
  answer: C
  explanation: Warning signs are used to warn you of potentially hazardous conditions
    ahead and are yellow with a black legend.
- id: 56
  category: signs_and_signals
  question: Which sign is round with black lettering on a yellow background?
  choices:
    A: Do Not Enter sign
    B: Yield sign
    C: School Zone sign
    D: Railroad Advance Warning sign
  answer: D
  explanation: The Railroad Advance Warning sign is round with black lettering on
    a yellow background. It indicates that you are nearing a railroad crossing.
- id: 57
  category: signs_and_signals
  question: A slow-moving vehicle sign is an orange triangle with a red reflective
    border. It is mounted on the rear of vehicles traveling at or below what speed?
  choices:
    A: 15 miles per hour
    B: 25 miles per hour
    C: 35 miles per hour
    D: 45 miles per hour
  answer: B
  explanation: The slow-moving vehicle sign is mounted on the rear of vehicles or
    equipment being towed at a speed of 25 miles per hour or less.
- id: 58
  category: signs_and_signals
  question: What colors may be used for pedestrian and school signs?
  choices:
    A: Fluorescent yellow-green or standard yellow
    B: Orange or red
    C: Blue or green
    D: White or black
  answer: A
  explanation: According to the manual, Pedestrian and School signs may be fluorescent
    yellow-green or standard yellow in color.
- id: 59
  category: signs_and_signals
  question: What do diagonal stripes on a barricade or vertical panel sloping downward
    to the right indicate?
  choices:
    A: The road is closed ahead.
    B: The driver should keep to the right.
    C: The driver should keep to the left.
    D: There is a pedestrian crosswalk ahead.
  answer: B
  explanation: According to the manual, stripes sloping downward to the right mean
    the driver should keep to the right.
- id: 60
  category: penalties_and_points
  question: What is the minimum fee for failing to comply with work zone speed limits
    when work is in progress and workers are present?
  choices:
    A: $50
    B: $80
    C: $100
    D: $150
  answer: B
  explanation: Failure to comply with work zone speed limits carries an $80 minimum
    fee when work is in progress and workers are present.
- id: 61
  category: defensive_driving
  question: According to work zone safety tips, who suffers the majority of traffic
    casualties in work zones?
  choices:
    A: Highway construction workers
    B: Pedestrians and bicyclists
    C: Motorists and passengers
    D: Flagpersons
  answer: C
  explanation: The manual states that 98 percent of Work Zone fatalities are travelers,
    and motorists and passengers suffer most of the traffic casualties in work zones.
- id: 62
  category: signs_and_signals
  question: What color are service signs, such as those indicating hospitals or gas
    stations?
  choices:
    A: White symbols on a blue background
    B: White letters on a green background
    C: White symbols on a brown background
    D: Black letters on an orange background
  answer: A
  explanation: Service signs are rectangular, and the symbols are white on a blue
    background.
- id: 63
  category: signs_and_signals
  question: What do the numbers on milepost signs tell you?
  choices:
    A: The distance to the next major city
    B: The speed limit for the upcoming highway section
    C: How many miles you are from the north or east border of the state
    D: How many miles you are from the south or west border of the state or origin
      of the route
  answer: D
  explanation: The numbers on milepost signs tell you how many miles you are from
    the south or west border of the state or origin of the route within the state.
- id: 64
  category: safe_driving_rules
  question: What must you do if you approach an intersection where the traffic signals
    are dark due to a power outage?
  choices:
    A: Proceed through the intersection without stopping if the way is clear.
    B: Stop and yield the right of way to any vehicle in the intersection.
    C: Treat the intersection as a yield sign.
    D: Wait until a police officer arrives to direct traffic.
  answer: B
  explanation: If the traffic signals are dark, for example in the event of a power
    outage, the driver of a vehicle shall stop and yield the right of way to any vehicle
    in the intersection.
- id: 65
  category: safe_driving_rules
  question: Under what condition are you permitted to make a left turn on a red light?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: When turning from a one-way street onto a one-way street, unless prohibited
      by a sign.
    C: Left turns on a red light are never permitted.
    D: When turning from a one-way street onto a two-way street during light traffic.
  answer: B
  explanation: You may turn left on a red light from a one-way street onto a one-way
    street, unless there is a sign prohibiting this.
- id: 66
  category: signs_and_signals
  question: What does a flashing yellow traffic signal at an intersection mean?
  choices:
    A: Stop and wait for a green light.
    B: The light is about to turn red.
    C: Proceed with caution.
    D: Yield to all traffic on your right.
  answer: C
  explanation: Flashing yellow at an intersection means proceed with CAUTION.
- id: 67
  category: signs_and_signals
  question: What does a flashing yellow left turn signal indicate?
  choices:
    A: Left-turning drivers have the right-of-way.
    B: You may cautiously turn left after yielding to oncoming traffic and pedestrians.
    C: The left turn signal is changing to red.
    D: Left-turning drivers must stop and wait.
  answer: B
  explanation: A flashing yellow turn indication means CAUTION. You may cautiously
    turn left after yielding to oncoming traffic and to pedestrians.
- id: 68
  category: safe_driving_rules
  question: What does a pavement marking with one solid yellow line and one broken
    yellow line mean?
  choices:
    A: Passing is permitted in both directions.
    B: No passing is allowed in either direction.
    C: No passing is allowed when you are in the lane with the solid line.
    D: The center lane is reserved for left turns only.
  answer: C
  explanation: One solid line with one broken line means no passing when you are in
    the lane with the solid line. The solid line may be crossed only to turn left.
- id: 69
  category: safe_driving_rules
  question: What is the primary rule for using a two-way left turn lane?
  choices:
    A: It is reserved only for left-turning vehicles in either direction, and passing
      is not permitted.
    B: It can be used for passing slow-moving vehicles.
    C: It is used to merge into traffic from a side street.
    D: It can be used as a regular travel lane during rush hour.
  answer: A
  explanation: The center lane is reserved only for left-turning vehicles in either
    direction. Passing or overtaking is not permitted in the center lane.
- id: 70
  category: safe_driving_rules
  question: Where must you stop your vehicle at an intersection with an unmarked crosswalk?
  choices:
    A: Just past the corner so you can see cross traffic.
    B: Before entering the crosswalk (sidewalk area) or intersection.
    C: At the exact center of the intersection.
    D: You do not need to stop if there are no painted lines.
  answer: B
  explanation: Where there are no lines at an intersection, you must stop your vehicle
    before entering the crosswalk (sidewalk area) or, if there is no crosswalk, you
    must stop before your vehicle enters the intersection.
- id: 71
  category: safe_driving_rules
  question: At what distance must school buses and vehicles carrying flammable liquids
    stop before a railroad crossing?
  choices:
    A: Within 100 feet and not less than 50 feet from the tracks.
    B: Within 50 feet and not less than 15 feet from the tracks.
    C: Within 30 feet and not less than 10 feet from the tracks.
    D: Within 25 feet and not less than 5 feet from the tracks.
  answer: B
  explanation: School buses, vehicles carrying explosives or flammable liquids...
    must stop within 50 feet and not less than 15 feet from the tracks.
- id: 72
  category: signs_and_signals
  question: What distinguishes a passive railroad crossing from an active one?
  choices:
    A: Passive crossings have flashing red lights and bells.
    B: Passive crossings do not have any type of traffic control device regulating
      traffic.
    C: Passive crossings are only found on dirt roads.
    D: Passive crossings always have crossing gates.
  answer: B
  explanation: Passive Crossings do not have any type of traffic control device. The
    decision to stop or proceed rests entirely in your hands.
- id: 73
  category: driver_responsibility
  question: What should you do if you see an obstruction on the railroad tracks or
    if the crossing gates are not working properly?
  choices:
    A: Call the Emergency Notification System (ENS) number posted near the tracks.
    B: Attempt to move the obstruction yourself.
    C: Drive around the gates carefully.
    D: Wait in your vehicle on the tracks until help arrives.
  answer: A
  explanation: The Federal Railroad Administration posts emergency phone numbers on
    railroad crossing posts or metal control boxes. Call this number if you see an
    obstruction on the railroad tracks or any other problems at a railroad crossing.
- id: 74
  category: defensive_driving
  question: If your vehicle becomes trapped or stuck on railroad tracks and a train
    is approaching, what should you do after evacuating your vehicle?
  choices:
    A: Walk in the same direction the train is moving.
    B: Walk away from the tracks at a 45-degree angle in the direction of the oncoming
      train.
    C: Stand directly next to the vehicle and wave your arms to alert the conductor.
    D: Run perpendicular to the tracks as fast as possible.
  answer: B
  explanation: If your vehicle is trapped or stuck on the tracks, evacuate your vehicle
    and walk in the direction of the oncoming train and away from the tracks at a
    45-degree angle. This ensures debris from the collision spreads away from you.
- id: 75
  category: safe_driving_rules
  question: When a train is crossing, what is the minimum distance you must stop before
    the railroad crossing?
  choices:
    A: 10 feet
    B: 15 feet
    C: 25 feet
    D: 50 feet
  answer: B
  explanation: When a train is crossing, pavement markings and rules require you to
    stop at least 15 feet before the crossing.
- id: 76
  category: safe_driving_rules
  question: How far in advance must you continuously give a turn signal before making
    a turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: All turn signals of intention to turn must be given continuously during
    the last 100 feet before the turn.
- id: 77
  category: safe_driving_rules
  question: When two vehicles approach an unsigned intersection at approximately the
    same time, who has the right of way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling faster
    D: The vehicle that honks first
  answer: B
  explanation: When two vehicles approach an unsigned intersection at approximately
    the same time, the vehicle on the left side must yield to the vehicle on the right.
- id: 78
  category: safe_driving_rules
  question: At an uncontrolled T-intersection, which vehicle must yield?
  choices:
    A: The vehicle on the continuing street
    B: The vehicle on the terminating street
    C: The vehicle turning right
    D: The vehicle traveling the fastest
  answer: B
  explanation: At an uncontrolled T-intersection, the vehicle on the terminating street
    must yield to vehicles on the continuing street.
- id: 79
  category: safe_driving_rules
  question: You may not make a U-turn near the crest of a hill or any curve if you
    cannot see for at least what distance?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: You may not make a U-turn near the crest of a hill or any curve where
    the driver cannot see 500 feet or more.
- id: 80
  category: sharing_the_road
  question: What must you do when an emergency vehicle is approaching with its red,
    white, or blue lights flashing or using its siren?
  choices:
    A: Stop immediately in the middle of the intersection
    B: Slow down to 15 mph and proceed with caution
    C: Come to a stop along the right-hand curb or edge of the road
    D: Move to the left lane and stop
  answer: C
  explanation: When an emergency or law enforcement vehicle is flashing its lights
    or using its siren, you must immediately come to a stop along the right-hand curb
    or edge of the road and remain stopped until it passes.
- id: 81
  category: sharing_the_road
  question: If a law enforcement or maintenance vehicle is parked on a multi-lane
    highway with its emergency or work lights flashing, what action should you take?
  choices:
    A: Stop immediately behind the vehicle
    B: Move over to the opposite lane and proceed with due caution
    C: Maintain your speed and lane position
    D: Honk your horn to alert the workers
  answer: B
  explanation: If an emergency, law enforcement, or DOT maintenance vehicle is parked
    on a multi-lane highway with flashing lights, you must move over to the opposite
    lane and proceed with due caution.
- id: 82
  category: sharing_the_road
  question: When a school bus is stopped and flashing its red lights, which vehicles
    must stop?
  choices:
    A: Only vehicles approaching from the rear
    B: Only vehicles approaching from the front
    C: Vehicles approaching from both directions
    D: Only commercial vehicles
  answer: C
  explanation: When a school bus is stopped and flashing its red lights, drivers approaching
    from both directions must stop because children are being loaded or unloaded.
- id: 83
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit in a business
    or residential district in North Dakota?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: The maximum speed limit is 25 miles per hour in a business or residential
    district, unless otherwise posted.
- id: 84
  category: safe_driving_rules
  question: What is the maximum speed limit on gravel, dirt, or loose surface roads
    unless otherwise posted?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: The maximum speed limit is 55 miles per hour on gravel, dirt, or loose
    surface roads unless otherwise posted.
- id: 85
  category: safe_driving_rules
  question: When passing another vehicle on a two-way road, you must return to your
    proper lane at least how many feet before meeting an approaching vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: You must give yourself enough time to get completely beyond the vehicle
    you are passing, and return to your proper lane at least 200 feet before meeting
    an approaching vehicle.
- id: 86
  category: defensive_driving
  question: When passing another vehicle, how do you know it is safe to return to
    your lane?
  choices:
    A: When you are one car length ahead of the passed vehicle
    B: When the driver of the passed vehicle flashes their headlights
    C: When you can see the image of the entire front of the passed vehicle in your
      inside rear-view mirror
    D: When you have accelerated 10 mph over the speed limit
  answer: C
  explanation: Do not return to your lane until you can see the image of the entire
    front of the vehicle you passed within the inside rear-view mirror.
- id: 87
  category: safe_driving_rules
  question: In which of the following situations is it illegal to pass another vehicle?
  choices:
    A: On a rural paved 2-lane highway
    B: Within 100 feet of an intersection, a railroad crossing, or a tunnel
    C: When the vehicle ahead is traveling below the speed limit
    D: On a divided multi-lane highway
  answer: B
  explanation: You must never pass within 100 feet of an intersection, a railroad
    crossing, or a tunnel.
- id: 88
  category: safe_driving_rules
  question: Who is responsible for ensuring a lane change is made safely?
  choices:
    A: The driver of the vehicle making the lane change
    B: The driver in the lane being entered
    C: Both drivers equally
    D: The driver behind the vehicle changing lanes
  answer: A
  explanation: 'The manual states: ''The driver of the vehicle making the lane change
    is responsible for safely changing lanes.'''
- id: 89
  category: defensive_driving
  question: At 55 miles per hour on dry pavement, approximately how much distance
    does it take to stop?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 400 feet
  answer: C
  explanation: According to the manual, at 55 miles per hour, it takes approximately
    300 feet or one city block on dry pavement to stop.
- id: 90
  category: safe_driving_rules
  question: Under which of the following conditions should you increase your following
    distance to four or more seconds?
  choices:
    A: When driving on a one-way street
    B: When following a motorcycle
    C: When driving in a residential neighborhood
    D: When approaching a roundabout
  answer: B
  explanation: The manual lists several situations where you need a following distance
    of four or more seconds, including when following motorcycles, when roads are
    slippery, or when pulling a trailer.
- id: 91
  category: safe_driving_rules
  question: When turning left from a two-way road onto a four-lane highway, which
    lane should you initially enter?
  choices:
    A: The far right lane
    B: The passing lane
    C: The center turn lane
    D: The shoulder
  answer: B
  explanation: The manual states that when turning left from a two-way road onto a
    four-lane highway, you should make the turn so that you enter the passing lane
    of the four-lane highway, and then move to the right when traffic permits.
- id: 92
  category: sharing_the_road
  question: What should you do when driving near a large truck in a roundabout?
  choices:
    A: Pass the truck on the right side
    B: Pass the truck on the left side
    C: Honk your horn to let them know you are there
    D: Do not pass them, as they need all available space
  answer: D
  explanation: When navigating a roundabout, the manual explicitly states to 'Always
    assume trucks need all available space—do not pass them!'
- id: 93
  category: safe_driving_rules
  question: Who must you yield to when entering a roundabout?
  choices:
    A: Only vehicles entering from your right
    B: Only commercial vehicles
    C: Circulating traffic
    D: Vehicles exiting the roundabout
  answer: C
  explanation: The manual instructs drivers to 'Yield to circulating traffic when
    entering the roundabout.'
- id: 94
  category: safe_driving_rules
  question: What should you do if you experience an emergency on the Interstate?
  choices:
    A: Stop in the right lane and turn on your hazard lights
    B: Stop on the shoulder and raise your hood
    C: Use a median crossover to turn around
    D: Back up to the nearest exit ramp
  answer: B
  explanation: 'The manual states: ''Never stop on the traveled part of the roadway.
    In an emergency, stop on the shoulder, and raise your hood to show difficulty.'''
- id: 95
  category: safe_driving_rules
  question: When must you use your headlights due to inclement weather?
  choices:
    A: When visibility is less than 500 feet
    B: When visibility is less than 1,000 feet
    C: When visibility is less than 1,500 feet
    D: Only when driving on the Interstate
  answer: B
  explanation: You should use your headlights during inclement weather when visibility
    is less than 1,000 feet due to rain, snow, sleet, hail, smoke, or fog.
- id: 96
  category: defensive_driving
  question: When driving at night, at what distance must you dim your headlights before
    meeting oncoming traffic?
  choices:
    A: At least 200 feet
    B: At least 300 feet
    C: At least 400 feet
    D: At least 500 feet
  answer: D
  explanation: The manual requires drivers to dim their headlights at least 500 feet
    before meeting traffic.
- id: 97
  category: defensive_driving
  question: If you meet a vehicle at night that does not dim its lights, where should
    you look to avoid being blinded?
  choices:
    A: Directly at the oncoming headlights
    B: At the centerline of the road
    C: To the right edge of the road
    D: At your rearview mirror
  answer: C
  explanation: If you meet a vehicle that does not dim its lights, the manual advises
    to 'look to the right edge of the road to avoid being blinded.'
- id: 98
  category: safe_driving_rules
  question: When parallel parking, how close must your wheels be to the right-hand
    curb?
  choices:
    A: Within 6 inches
    B: Within one foot
    C: Within 18 inches
    D: Within two feet
  answer: B
  explanation: When parallel parking your vehicle, your wheels should be parallel
    to the right-hand curb and within one foot of the right-hand curb.
- id: 99
  category: safe_driving_rules
  question: Which way should you turn your wheels when parking uphill on a street
    with a curb?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: Toward the shoulder
  answer: B
  explanation: The parking diagram and rules state that when parking uphill with a
    curb, you must turn your wheels away from the curb.
- id: 100
  category: defensive_driving
  question: Why should you avoid swerving to avoid an animal on the road?
  choices:
    A: Swerving is illegal in rural areas
    B: The animal will likely move out of the way on its own
    C: It could result in a more serious crash like hitting a tree or rolling over
    D: Your insurance will not cover damages if you swerve
  answer: C
  explanation: 'The manual warns: ''Do not swerve to avoid an animal because this
    could result in a more serious crash like hitting a tree or another vehicle, or
    possibly rolling over.'''
- id: 101
  category: safe_driving_rules
  question: What should you do if an approaching driver does not dim their headlights
    at night?
  choices:
    A: Flash your high beams repeatedly until they dim theirs.
    B: Look to the right edge of the road to avoid being blinded.
    C: Look directly at the headlights to gauge the vehicle's distance.
    D: Pull over immediately and stop on the shoulder.
  answer: B
  explanation: If an approaching driver does not dim its lights, look to the right
    edge of the road to avoid being blinded.
- id: 102
  category: safe_driving_rules
  question: How far away must you park from a fire hydrant?
  choices:
    A: At least 5 feet
    B: At least 10 feet
    C: At least 15 feet
    D: At least 20 feet
  answer: B
  explanation: You may not park within 10 feet of a fire hydrant.
- id: 103
  category: vehicle_information
  question: If you must make an emergency stop and park on a public highway at night,
    your vehicle must display a red light on the rear visible for what distance?
  choices:
    A: 200 feet
    B: 500 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Between one-half hour after sunset and one-half hour before sunrise,
    your vehicle must display a red light on the rear visible for a distance of 1,000
    feet when parked on a public highway.
- id: 104
  category: safe_driving_rules
  question: When towing a trailer faster than 25 miles per hour, what safety equipment
    is required?
  choices:
    A: A specialized commercial towing license
    B: Safety chains or brakes capable of holding the trailer if the coupling breaks
    C: A flashing yellow beacon mounted on the top of the trailer
    D: A secondary steering mechanism
  answer: B
  explanation: When traveling faster than 25 miles per hour, you need safety chains
    or brakes capable of holding the trailer if the coupling breaks.
- id: 105
  category: safe_driving_rules
  question: When traveling upon a downgrade, what action is prohibited for the driver
    of any motor vehicle?
  choices:
    A: Coasting with the gears or transmission in neutral
    B: Using the vehicle's brakes intermittently
    C: Shifting into a lower gear
    D: Driving below the posted speed limit
  answer: A
  explanation: The driver of any motor vehicle, when traveling upon a downgrade, may
    not coast with the gears or transmission of such vehicle in neutral.
- id: 106
  category: penalties_and_points
  question: What is the penalty for throwing or depositing litter on any public highway?
  choices:
    A: A $100 fine
    B: A $250 fine
    C: A $500 fine
    D: A 30-day license suspension
  answer: C
  explanation: If you throw or deposit any litter on any public highway, you are subject
    to a $500 fine.
- id: 107
  category: driver_responsibility
  question: 'You must immediately report a crash to law enforcement if it results
    in personal injury, death, or combined property damage of at least:'
  choices:
    A: $1,000
    B: $2,000
    C: $3,000
    D: $4,000
  answer: D
  explanation: If you are involved in a crash that results in the combined damage
    of $4,000 or more, or results in personal injury or death, you must immediately
    report it.
- id: 108
  category: driver_responsibility
  question: If you hit an unattended vehicle and cannot find the owner, what must
    you do?
  choices:
    A: Wait by the vehicle until the owner returns.
    B: Leave a note at a conspicuous place on the vehicle with your name, address,
      and insurance company.
    C: Call a tow truck to move the unattended vehicle.
    D: Report it to the police within 48 hours and leave the scene.
  answer: B
  explanation: If the owner cannot be found, the driver must leave a note at a conspicuous
    place on the unattended vehicle. The note must list the driver's name, address,
    and motor vehicle insurance company.
- id: 109
  category: penalties_and_points
  question: What is the fine for a first violation of operating an uninsured motor
    vehicle in North Dakota?
  choices:
    A: $50
    B: $100
    C: $150
    D: $300
  answer: C
  explanation: The fine for operating an uninsured motor vehicle is $150 for a first
    violation and $300 for a second or subsequent violation in three years.
- id: 110
  category: penalties_and_points
  question: What is the penalty for entering a road that is officially closed due
    to hazardous winter conditions?
  choices:
    A: A $150 fine
    B: A $250 fine
    C: A $500 fine
    D: A warning for the first offense
  answer: B
  explanation: It is not legal to enter a road that is officially closed due to hazardous
    conditions. The penalty for doing this is a $250 fine.
- id: 111
  category: vehicle_information
  question: During which dates are studded snow tires legally permitted to be used?
  choices:
    A: September 1 to March 1
    B: October 1 to April 1
    C: October 15 to April 15
    D: November 1 to May 1
  answer: C
  explanation: Studded snow tires may be used from October 15 to April 15.
- id: 112
  category: defensive_driving
  question: How should you apply the brakes to stop on ice if your vehicle is equipped
    with anti-lock brakes (ABS)?
  choices:
    A: Pump the brakes rapidly.
    B: Keep firm and continuous pressure on the brakes.
    C: Apply a slow, intermittent braking action.
    D: Slam on the brakes and immediately release them.
  answer: B
  explanation: Keep firm and continuous pressure on anti-lock brakes (ABS). Manually
    pumping anti-lock brakes, or letting up on them, decreases their effectiveness.
- id: 113
  category: safe_driving_rules
  question: If your vehicle becomes stuck in a snowstorm, what is the safest course
    of action?
  choices:
    A: Leave your vehicle to find the nearest house or business.
    B: Stay with the vehicle and run the heater continuously to stay warm.
    C: Stay with the vehicle, open windows slightly, and run the engine and heater
      for only short periods.
    D: Walk along the highway to flag down a passing snowplow.
  answer: C
  explanation: If your vehicle becomes stuck in a snowstorm, stay with the vehicle!
    Open your windows slightly and run the vehicle and heater for only short periods
    of time to avoid carbon monoxide poisoning.
- id: 114
  category: sharing_the_road
  question: Why should you be extremely cautious when passing a snowplow?
  choices:
    A: They are not required to follow posted speed limits.
    B: They can be moved sideways by drifts and hard snow-pack.
    C: They frequently stop in the middle of the road to check weather conditions.
    D: They are not equipped with standard turn signals.
  answer: B
  explanation: Be extremely cautious when passing a snowplow. They can be moved sideways
    by drifts and hard snow-pack.
- id: 115
  category: safe_driving_rules
  question: What is the most common cause of winter crashes?
  choices:
    A: Poorly sanded roads
    B: Driving too fast for conditions
    C: Following snowplows too closely
    D: Defective winter tires
  answer: B
  explanation: According to the manual, most winter crashes are caused by driving
    too fast for conditions.
- id: 116
  category: defensive_driving
  question: If the rear end of your rear-wheel drive vehicle starts to skid to the
    right, what should you do?
  choices:
    A: Steer to the left
    B: Brake hard and steer right
    C: Steer to the right
    D: Accelerate heavily and steer straight
  answer: C
  explanation: In rear-wheel drive automobiles, you should turn your wheels in the
    direction the rear end of your vehicle is skidding. If the rear end of the vehicle
    skids right, steer right.
- id: 117
  category: safe_driving_rules
  question: Why is a hard surface roadway very slippery just after it starts raining?
  choices:
    A: The rain washes away the traction material.
    B: Water combines with road dirt and oil to form a slick film.
    C: The sudden temperature change causes condensation.
    D: Tires lose their tread depth when wet.
  answer: B
  explanation: A hard surface roadway is very slippery just after it starts raining
    because water combines with the road dirt and oil to form a slick film between
    your tires and the roadway surface.
- id: 118
  category: safe_driving_rules
  question: How much moving water does it take to carry away most vehicles, including
    sport utility vehicles and pick-up trucks?
  choices:
    A: Six inches
    B: One foot
    C: Two feet
    D: Three feet
  answer: C
  explanation: Two feet of moving water can carry away most vehicles including sport
    utility vehicles and pick-up trucks.
- id: 119
  category: defensive_driving
  question: What is the proper response if you experience a tire blowout while driving?
  choices:
    A: Slam on the brakes and steer to the shoulder immediately.
    B: Grasp the steering wheel tightly, steer straight ahead, and do not brake until
      you have full control.
    C: Accelerate to maintain momentum and steer in the opposite direction of the
      blowout.
    D: Pump the brakes rapidly while swerving to the right.
  answer: B
  explanation: To regain control after a blowout, grasp the steering wheel tightly
    and steer straight ahead. Ease up on the accelerator, but do not brake until you
    have regained full control.
- id: 120
  category: defensive_driving
  question: If your tire drops off the edge of the pavement onto the shoulder, what
    should you avoid doing?
  choices:
    A: Easing up on the accelerator
    B: Gripping the steering wheel
    C: Trying to swerve back onto the pavement immediately
    D: Looking for traffic behind you
  answer: C
  explanation: If your tire drops off the edge of the pavement onto the shoulder,
    do not try to swerve back onto the pavement because you may lose control of your
    vehicle.
- id: 121
  category: vehicle_information
  question: Why should you never turn your vehicle's ignition to the "lock" position
    while it is still in motion if the accelerator sticks?
  choices:
    A: It will cause the engine to catch fire.
    B: It will cause the steering to lock if you try to turn the steering wheel.
    C: It will permanently damage the transmission.
    D: It will cause the brakes to lock up immediately.
  answer: B
  explanation: Never turn your vehicle's ignition to the "lock" position while it
    is still in motion. This will cause the steering to lock if you try to turn the
    steering wheel.
- id: 122
  category: defensive_driving
  question: What should you do if an oncoming vehicle crosses into your lane?
  choices:
    A: Speed up to get past them quickly.
    B: Steer into the left lane to avoid them.
    C: Slow down, flash your headlights, and pull as far to the right as possible.
    D: Stop immediately in your lane and honk your horn.
  answer: C
  explanation: Should an oncoming vehicle cross into your lane, slow down and try
    to warn the oncoming driver by flashing your headlights. If the vehicle keeps
    coming, pull as far to the right as possible.
- id: 123
  category: penalties_and_points
  question: What is the penalty for texting while driving or failing to maintain control
    of a vehicle due to an unnecessary activity?
  choices:
    A: A $50 fine
    B: A $100 fine
    C: A $250 fine
    D: A $500 fine
  answer: B
  explanation: It is not legal for anyone to text while driving or fail to maintain
    control of a motor vehicle due to activity that is not necessary... The penalty
    is a $100 fine.
- id: 124
  category: safe_driving_rules
  question: How should you operate the gas and brake pedals to avoid riding the brakes?
  choices:
    A: Use your right foot for the gas and left foot for the brake.
    B: Use one foot to operate both the gas pedal and brake pedal.
    C: Keep both feet on the brake pedal when slowing down.
    D: Alternate feet depending on the speed of the vehicle.
  answer: B
  explanation: Use one foot to operate both the gas pedal and brake pedal to avoid
    riding the brakes which can cause them to overheat.
- id: 125
  category: driver_responsibility
  question: Which of the following is a danger sign of driver fatigue?
  choices:
    A: Checking your mirrors frequently
    B: Inability to recall the last few miles driven
    C: Maintaining a consistent speed
    D: Sitting up straight with both hands on the wheel
  answer: B
  explanation: 'Danger signs of fatigue are: difficulty in focusing or keeping eyes
    open, inability to recall the last few miles driven, having the sense of being
    detached, etc.'
- id: 126
  category: sharing_the_road
  question: Approximately how much distance does a fully-loaded tractor-trailer need
    to come to a complete stop on dry pavement?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: More than 400 feet
  answer: D
  explanation: A fully-loaded tractor-trailer may take more than 400 feet on dry pavement
    to come to a complete stop, or more than the length of a football field.
- id: 127
  category: sharing_the_road
  question: Why do drivers of tractor-trailers often swing out to the left before
    making a right turn?
  choices:
    A: To get a better view of oncoming traffic
    B: Because the rear wheels follow a shorter path than the front wheels
    C: To block other vehicles from passing them
    D: Because the steering mechanism requires a wider angle
  answer: B
  explanation: With any turning vehicle, the rear wheels follow a shorter path than
    the front wheels. The longer the vehicle, the greater the difference. That's why
    the drivers of tractor-trailers must often swing out to the left as the first
    step in making a right turn.
- id: 128
  category: sharing_the_road
  question: How far behind a tractor-trailer does its rear blind spot (no-zone) extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 150 feet
    D: Up to 200 feet
  answer: D
  explanation: While truckers do enjoy a better forward view and have bigger mirrors,
    they still have serious blind spots or no-zones into which a car can disappear
    from view... and up to 200 feet in the rear.
- id: 129
  category: sharing_the_road
  question: How far can a tractor-trailer's rear blind spot extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 150 feet
    D: Up to 200 feet
  answer: D
  explanation: Trucks have serious blind spots or no-zones into which a car can disappear
    from view, including up to 200 feet in the rear.
- id: 130
  category: sharing_the_road
  question: What is an excellent rule of thumb when sharing the road with a tractor-trailer?
  choices:
    A: If you can't see the truck driver in his or her side mirror, he or she can't
      see you.
    B: Always pass a truck on the right side to avoid oncoming traffic.
    C: Tailgate the truck to reduce wind resistance and save gas.
    D: Share the lane with the truck if the lane is wide enough.
  answer: A
  explanation: The manual states an excellent rule of thumb is, "If you can't see
    the truck driver in his or her side mirror, he or she can't see you."
- id: 131
  category: sharing_the_road
  question: When passing a tractor-trailer, you should always pass completely and
    on which side?
  choices:
    A: The right side
    B: The left side
    C: Whichever side has less traffic
    D: The shoulder
  answer: B
  explanation: The manual advises to always pass a tractor-trailer completely and
    always on the left side.
- id: 132
  category: defensive_driving
  question: Why do a substantial number of car-truck collisions take place at intersections?
  choices:
    A: Trucks are required to yield the right-of-way at all intersections.
    B: Cars frequently attempt to pass trucks on the right side while turning.
    C: The driver of the car underestimates the size and speed of the approaching
      truck.
    D: Truck drivers cannot see traffic lights clearly from their high seating position.
  answer: C
  explanation: Because of its large size, a tractor-trailer often appears to be traveling
    at a slower speed than it is, causing car drivers to underestimate how close the
    truck is or how quickly it is approaching at intersections.
- id: 133
  category: safe_driving_rules
  question: What must you do if you approach a stranded motor vehicle with flashing
    hazard lights on an interstate outside city limits?
  choices:
    A: Stop immediately and offer assistance to the driver.
    B: Yield the right of way and move safely to the lane not adjacent to the stranded
      vehicle.
    C: Honk your horn to warn the driver and maintain your current speed.
    D: Accelerate to pass the stranded vehicle as quickly as possible.
  answer: B
  explanation: If a motor vehicle is stranded along the interstate or multilane highway
    outside city limits with flashing hazard lights, a driver should yield the right
    of way and move safely to the lane not adjacent to the stranded vehicle.
- id: 134
  category: sharing_the_road
  question: 'When sharing the road with a motorcycle, you should:'
  choices:
    A: Share the lane to save space on the roadway.
    B: Allow the motorcyclist a full lane width.
    C: Pass them as closely as possible to minimize time in the opposing lane.
    D: Drive in their blind spot so they can hear your engine.
  answer: B
  explanation: You must allow the motorcyclist a full lane width. Although it may
    seem as though there is enough room, the motorcycle needs the room to maneuver
    safely. Do not share the lane.
- id: 135
  category: defensive_driving
  question: 'Nearly 40 percent of motorcycle crashes involving another motor vehicle
    were caused by:'
  choices:
    A: The other vehicle turning left in front of the motorcyclist.
    B: The motorcycle tailgating the other vehicle.
    C: The other vehicle rear-ending the motorcycle at a stop sign.
    D: The motorcycle passing the other vehicle on the right.
  answer: A
  explanation: Approximately one-half of all motorcycle crashes involve another motor
    vehicle, and nearly 40 percent were caused by the other vehicle turning left in
    front of the motorcyclist.
- id: 136
  category: sharing_the_road
  question: Why should you wait to be sure a motorcycle is going to turn even if its
    turn signal is flashing?
  choices:
    A: Motorcycle turn signals are often broken and unreliable.
    B: Motorcycle signals usually are not self-canceling and riders sometimes forget
      to turn them off.
    C: Motorcycles are required by law to use hand signals instead of electronic signals.
    D: It is illegal for motorcycles to turn at most intersections.
  answer: B
  explanation: Don't be fooled by a flashing turn signal on a motorcycle—motorcycle
    signals usually are not self-canceling and riders sometimes forget to turn them
    off.
- id: 137
  category: safe_driving_rules
  question: What is the recommended following distance when driving behind a motorcycle?
  choices:
    A: One or two seconds
    B: Two or three seconds
    C: Three or four seconds
    D: Five or six seconds
  answer: C
  explanation: You should allow more following distance, three or four seconds, following
    a motorcycle so the motorcyclist has enough time to maneuver or stop in an emergency.
- id: 138
  category: sharing_the_road
  question: What is the minimum passing space required between a motor vehicle and
    a bicycle?
  choices:
    A: One foot
    B: Two feet
    C: Three feet
    D: Four feet
  answer: C
  explanation: The individual operating the motor vehicle is required to leave a minimum
    of three feet of passing space between the vehicle and bicycle.
- id: 139
  category: sharing_the_road
  question: Where do most crashes involving a motor vehicle and a bicyclist occur?
  choices:
    A: On rural highways
    B: At intersections
    C: In residential driveways
    D: On designated bicycle paths
  answer: B
  explanation: Scan for bicyclists in traffic, particularly at intersections. Most
    crashes involving a motor vehicle and a bicyclist occur at intersections.
- id: 140
  category: safe_driving_rules
  question: When is it permissible to drive in a designated bicycle lane?
  choices:
    A: When passing a slow-moving vehicle
    B: When making a right turn
    C: When traffic is heavily congested
    D: It is never permissible
  answer: B
  explanation: You should avoid driving in designated bicycle lanes other than to
    make a right turn.
- id: 141
  category: vehicle_information
  question: 'At 30 miles per hour, the force of a crash is equivalent to hitting the
    ground from the top of a:'
  choices:
    A: One-story building
    B: Two-story building
    C: Three-story building
    D: Four-story building
  answer: C
  explanation: At 30 miles per hour, the force is like hitting the ground from the
    top of a three-story building.
- id: 142
  category: safe_driving_rules
  question: How should a lap belt be worn correctly?
  choices:
    A: Snug and low across the hips
    B: Loosely across the abdomen
    C: Snug across the chest
    D: High on the waist
  answer: A
  explanation: Belts must be worn correctly. Lap belts should lie snug and low across
    the hips, not across the abdomen.
- id: 143
  category: safe_driving_rules
  question: 'Under North Dakota''s child passenger safety law, a seat belt may be
    substituted for a child restraint if a child under eight years of age is at least:'
  choices:
    A: 48 inches tall
    B: 50 inches tall
    C: 54 inches tall
    D: 57 inches tall
  answer: D
  explanation: Children under eight years of age must be properly secured in a child
    restraint. A seat belt may be substituted for children who are at least 57 inches
    tall.
- id: 144
  category: safe_driving_rules
  question: Under North Dakota law, a child must be properly secured in a child restraint
    (car seat or booster seat) until they reach what age?
  choices:
    A: 6 years
    B: 8 years
    C: 10 years
    D: 12 years
  answer: B
  explanation: North Dakota's child passenger safety law requires that children under
    eight years of age must be properly secured in a child restraint.
- id: 145
  category: penalties_and_points
  question: What is the penalty for violating North Dakota's child passenger safety
    law?
  choices:
    A: $25 fine and one point against the driver's license
    B: $50 fine and two points against the driver's license
    C: $100 fine and no points
    D: $250 fine and license suspension
  answer: A
  explanation: The penalty for violation is $25 and one point against the license
    of the driver.
- id: 146
  category: safe_driving_rules
  question: At what core body temperature does heatstroke begin to occur in a child?
  choices:
    A: 99 degrees
    B: 101 degrees
    C: 104 degrees
    D: 107 degrees
  answer: C
  explanation: Heatstroke begins when the core body temperature reaches about 104
    degrees and the thermoregulatory system is overwhelmed.
- id: 147
  category: safe_driving_rules
  question: How much can the inside temperature of a vehicle rise within the first
    10 minutes?
  choices:
    A: Almost 5 degrees Fahrenheit
    B: Almost 10 degrees Fahrenheit
    C: Almost 20 degrees Fahrenheit
    D: Almost 40 degrees Fahrenheit
  answer: C
  explanation: The inside temperature of a vehicle can rise almost 20 degrees Fahrenheit
    within the first 10 minutes.
- id: 148
  category: alcohol_drugs_health
  question: If you drink even just a little alcohol, your chances of being in a crash
    are how much greater than if you were completely sober?
  choices:
    A: Two times greater
    B: Three times greater
    C: Five times greater
    D: Seven times greater
  answer: D
  explanation: There is evidence proving that if you drink—even just a little—your
    chances of a crash are seven times greater than if you were completely sober.
- id: 149
  category: alcohol_drugs_health
  question: Which of the following is the only way to eliminate alcohol from the blood
    stream?
  choices:
    A: Drinking coffee
    B: Taking a cold shower
    C: Exercising
    D: Time
  answer: D
  explanation: Time is the only way to eliminate alcohol from the blood stream. This
    process is relatively slow and will not be quickened by drinking coffee, taking
    cold showers, or exercising.
- id: 150
  category: penalties_and_points
  question: What happens if you refuse to take a chemical test to determine the level
    of alcohol or drugs in your body?
  choices:
    A: Your license will be suspended for 30 days
    B: Your license will be revoked for 180 days to three years
    C: You will be fined $50 but keep your license
    D: You will receive three points on your driving record
  answer: B
  explanation: If you refuse to take the test, your license will be revoked for 180
    days to three years.
- id: 151
  category: alcohol_drugs_health
  question: 'You are considered legally under the influence of alcohol if you are
    under the age of 21 and have a blood alcohol concentration (AC) of at least:'
  choices:
    A: .00%
    B: .02%
    C: .04%
    D: .08%
  answer: B
  explanation: If a chemical test reveals that you have eight one-hundredths of one
    percent (.08%) or greater of alcohol in your blood, or .02% if under the age of
    21, you are considered legally to be under the influence of alcohol.
- id: 152
  category: penalties_and_points
  question: What is the administrative license suspension period for a first DUI offense
    within seven years with an alcohol concentration (AC) of .08 percent?
  choices:
    A: 30 days
    B: 91 days
    C: 180 days
    D: 365 days
  answer: B
  explanation: 'If you have an alcohol concentration (AC) of .08 percent or more...
    your license will be suspended for: 91 days, first offense in seven years.'
- id: 153
  category: penalties_and_points
  question: What is the mandatory court conviction penalty for a first DUI conviction
    with an alcohol concentration (AC) below .16%?
  choices:
    A: $250 fine
    B: $500 fine
    C: $750 fine and two days imprisonment
    D: $1,000 fine and 10 days in jail
  answer: B
  explanation: If convicted through the court process... First conviction—$500 fine.
- id: 154
  category: penalties_and_points
  question: If you are involved in a crash while driving under the influence and cause
    a serious injury to another person, what additional penalty will you face?
  choices:
    A: An additional 30 days in jail
    B: An additional 90 days in jail
    C: An additional 1 year in jail
    D: An additional $5,000 fine
  answer: B
  explanation: In addition to the minimum penalties for DUI, if you are involved in
    a crash and cause a serious injury to another, you will spend an additional 90
    days in jail.
- id: 155
  category: driver_responsibility
  question: If you refuse to take an AC test or are convicted of a DUI, the law requires
    you to show proof of financial responsibility. What is this insurance coverage
    called?
  choices:
    A: SR 22
    B: SR 50
    C: DUI 100
    D: AC 24/7
  answer: A
  explanation: If you refuse to take an AC test, or if convicted of a DUI, the law
    requires you to show proof of financial responsibility (SR 22 insurance coverage).
- id: 156
  category: safe_driving_rules
  question: What are the minimum requirements for a child to move from a car seat
    to a booster seat?
  choices:
    A: At least 30 pounds and 3 years of age
    B: At least 40 pounds and 4 years of age
    C: At least 50 pounds and 5 years of age
    D: At least 60 pounds and 6 years of age
  answer: B
  explanation: Children should be at least 40 pounds and at least 4 years of age to
    move from a car seat to a booster seat.
- id: 157
  category: alcohol_drugs_health
  question: Under North Dakota's Open Container Law, who is permitted to drink alcoholic
    beverages in a vehicle?
  choices:
    A: Only the driver
    B: Only the passengers
    C: Both the driver and passengers
    D: Neither the driver nor the passengers
  answer: D
  explanation: It is illegal for anyone, driver or passenger, to drink alcoholic beverages.
- id: 158
  category: alcohol_drugs_health
  question: According to the open container law, where must any open containers of
    alcoholic beverages be placed in a vehicle?
  choices:
    A: Under the driver's seat
    B: In the glove compartment
    C: In the trunk of the vehicle
    D: In the back seat floorboard
  answer: C
  explanation: You cannot legally have an open container in your vehicle. Any open
    containers must be placed in the trunk of the vehicle.
- id: 159
  category: alcohol_drugs_health
  question: How can certain cold tablets and capsules affect your driving ability?
  choices:
    A: They increase your reaction time
    B: They make you drowsy at the wheel
    C: They improve your night vision
    D: They cause you to drive more aggressively
  answer: B
  explanation: Even certain cold tablets and capsules can affect your driving ability
    by making you drowsy at the wheel.
- id: 160
  category: sharing_the_road
  question: Under North Dakota traffic rules, how are joggers classified?
  choices:
    A: As recreational vehicles
    B: As pedestrians
    C: As slow-moving vehicles
    D: As bicyclists
  answer: B
  explanation: Joggers are considered pedestrians and must also obey pedestrian traffic
    rules.
- id: 161
  category: safe_driving_rules
  question: When walking on a road at night, what should you do to ensure drivers
    can see you?
  choices:
    A: Walk with traffic and wear dark clothing
    B: Walk facing traffic and wear light or white clothing
    C: Walk in the center of the lane and carry a flashlight
    D: Walk diagonally across intersections
  answer: B
  explanation: When you walk at night, walk facing traffic and wear light or white
    clothing to make sure drivers can see you.
- id: 162
  category: vehicle_information
  question: What is the maximum speed a motorized bicycle is allowed to be capable
    of reaching on a level surface?
  choices:
    A: 20 miles per hour
    B: 25 miles per hour
    C: 30 miles per hour
    D: 35 miles per hour
  answer: C
  explanation: A motorized bicycle must have a maximum piston or rotor displacement
    enabling a speed not to exceed 30 miles per hour on a level surface.
- id: 163
  category: sharing_the_road
  question: 'When riding a bicycle at night, your headlight must be visible from a
    distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: At night, all bicycles must be equipped with a headlight visible from
    a distance of 500 feet.
- id: 164
  category: safe_driving_rules
  question: When crossing a street or highway on an off-highway vehicle, at what angle
    should you cross?
  choices:
    A: Approximately 45 degrees
    B: Approximately 90 degrees
    C: Approximately 180 degrees
    D: Diagonally across the intersection
  answer: B
  explanation: You must cross streets or highways at an angle of approximately 90
    degrees to the direction of the highway.
- id: 165
  category: safe_driving_rules
  question: 'A licensed driver over 16 years of age may operate a registered class
    III off-highway vehicle on a paved highway posted at a speed not exceeding:'
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 75 mph
  answer: C
  explanation: A licensed driver over 16 years of age may operate a registered class
    III off-highway vehicle on a paved highway designated and posted at a speed not
    exceeding 65 mph.
- id: 166
  category: safe_driving_rules
  question: During which time period is it illegal to operate a snowmobile on any
    highway right of way in North Dakota?
  choices:
    A: From March 1 to October 1
    B: From April 1 to November 1
    C: From May 1 to December 1
    D: From June 1 to September 1
  answer: B
  explanation: Snowmobile rules state that you must never operate on any right of
    way from April 1 to November 1 of any year.
- id: 167
  category: safe_driving_rules
  question: 'If you are operating a snowmobile in a ditch alongside the roadway, you
    must:'
  choices:
    A: Move in the opposite direction of roadway traffic
    B: Move in the same direction as roadway traffic
    C: Travel at a speed no greater than 15 mph
    D: Keep your headlights off during daylight hours
  answer: B
  explanation: If you operate in any ditch alongside the roadway, you must move in
    the same direction as roadway traffic.
- id: 168
  category: safe_driving_rules
  question: Which of the following is true regarding operating a snowmobile on an
    Interstate highway right of way?
  choices:
    A: It is permitted only in the ditch
    B: It is permitted if you are crossing at a 90-degree angle
    C: It is never permitted
    D: It is permitted only during daylight hours
  answer: C
  explanation: You must never operate a snowmobile on the right of way of any Interstate
    highway, which includes the driving portion, median, shoulders, and ditches.
- id: 169
  category: penalties_and_points
  question: 'Under the North Dakota point system, a driver will be informed of an
    intent to suspend their license when their record reveals a total of at least:'
  choices:
    A: 6 points
    B: 9 points
    C: 10 points
    D: 12 points
  answer: D
  explanation: When the record reveals a total of 12 or more points, the driver will
    be informed that the authorities intend to suspend his or her license.
- id: 170
  category: penalties_and_points
  question: How many points can be reduced from a driver's record for completing an
    approved driver improvement course?
  choices:
    A: One point
    B: Two points
    C: Three points
    D: Four points
  answer: C
  explanation: The point total can be reduced by THREE POINTS if the driver completes
    an approved driver improvement course such as a defensive driving course.
- id: 171
  category: penalties_and_points
  question: 'A driver''s point total is reduced by one point for every:'
  choices:
    A: One-month period with no points recorded
    B: Three-month period with no points recorded
    C: Six-month period with no points recorded
    D: Twelve-month period with no points recorded
  answer: B
  explanation: The point total can be reduced by ONE POINT for every three-month period
    during which the driver has not had any points recorded against his/her record.
- id: 172
  category: penalties_and_points
  question: How many points are reduced from a driving record for every three-month
    period during which the driver has not had any points recorded?
  choices:
    A: One point
    B: Two points
    C: Three points
    D: Five points
  answer: A
  explanation: According to the manual, one point is reduced for every three-month
    period during which the driver has not had any points recorded against their record.
- id: 173
  category: penalties_and_points
  question: If a driver completes an approved driver improvement course, such as a
    defensive driving course, how many points can be reduced from their record?
  choices:
    A: One point
    B: Two points
    C: Three points
    D: Five points
  answer: C
  explanation: The manual states that three points can be reduced if the driver completes
    an approved driver improvement course.
- id: 174
  category: penalties_and_points
  question: What is the period of suspension for accumulating exactly 12 points on
    your driving record?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: An accumulated point total of 12 results in a suspension period of
    7 days.
- id: 175
  category: license_system
  question: What happens if a parent or legal guardian withdraws their consent for
    a minor's permit or license?
  choices:
    A: The minor is restricted to daylight driving only.
    B: The permit or license will be cancelled.
    C: The minor must retake the driving test.
    D: The minor must pay a reinstatement fee.
  answer: B
  explanation: The person who consented can withdraw the consent at any time, and
    the permit or license will be cancelled.
- id: 176
