metadata:
  source: 2025 Kansas Driver's Manual
  total_questions: 255
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Kansas, what is the minimum age at which an individual can apply for
    an Instruction Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: A
  explanation: According to the Kansas Driving Handbook, an individual may apply for
    an Instruction Permit as early as age 14, provided they have parental consent.
- id: 2
  category: license_system
  question: How long must a Kansas teen hold an Instruction Permit before they are
    eligible to apply for a Restricted License?
  choices:
    A: 6 months
    B: 9 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Kansas law requires that a permit holder must hold the Instruction
    Permit for at least one year before moving to the next stage of the Graduated
    Driver's License (GDL) process.
- id: 3
  category: license_system
  question: To obtain a Restricted License in Kansas, a teen must document a minimum
    of how many hours of supervised driving practice?
  choices:
    A: 25 hours (5 at night)
    B: 40 hours (10 at night)
    C: 50 hours (10 at night)
    D: 60 hours (20 at night)
  answer: C
  explanation: Kansas GDL requirements state that a driver must complete 50 hours
    of supervised driving, with at least 10 of those hours being at night, before
    moving to a restricted or full license.
- id: 4
  category: license_system
  question: Under a 15-year-old Restricted License in Kansas, where is the driver
    permitted to drive unsupervised?
  choices:
    A: Anywhere within city limits
    B: Only to and from school or work
    C: To any social event before 9 PM
    D: Only when a licensed adult is in the front seat
  answer: B
  explanation: A 15-year-old with a Restricted License may drive unsupervised only
    to or from school (over the most direct route for the purpose of attendance) or
    to and from work.
- id: 5
  category: license_system
  question: For the first six months of holding a 16-year-old Restricted License in
    Kansas, how many non-immediate family passengers under the age of 18 are allowed
    in the vehicle?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: B
  explanation: During the first six months of a 16-year-old's Restricted License,
    the driver is limited to no more than one passenger under 18 who is not a member
    of their immediate family.
- id: 6
  category: license_system
  question: What is the nighttime driving restriction (curfew) for a 16-year-old holding
    a Restricted License in Kansas?
  choices:
    A: 10 PM to 6 AM
    B: 11 PM to 5 AM
    C: 9 PM to 5 AM
    D: Midnight to 5 AM
  answer: C
  explanation: Kansas restricted license holders aged 16 are generally prohibited
    from driving between the hours of 9 PM and 5 AM, with exceptions for work, school
    activities, or emergencies.
- id: 7
  category: license_system
  question: 'If you move to a new residence within Kansas, you must notify the Division
    of Vehicles of your change of address within:'
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: Kansas law requires all drivers to notify the DMV of an address or
    name change within 10 days.
- id: 8
  category: license_system
  question: What is the minimum visual acuity required in at least one eye to obtain
    a Kansas driver's license without restrictions?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/60
  answer: C
  explanation: To qualify for a Kansas driver's license, you must have at least 20/40
    vision in at least one eye, with or without corrective lenses.
- id: 9
  category: license_system
  question: 'In Kansas, a driver under the age of 21 is considered to be driving under
    the influence if their Blood Alcohol Content (BAC) is at or above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Kansas has a 'Zero Tolerance' policy for minors; a BAC of 0.02% or
    higher for anyone under 21 results in an automatic suspension.
- id: 10
  category: license_system
  question: How many moving violation convictions within a 12-month period will result
    in the suspension of a Kansas driver's license?
  choices:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
  answer: B
  explanation: Under Kansas law, the Division of Vehicles is authorized to suspend
    the license of any driver who is convicted of three or more moving violations
    within a 12-month period.
- id: 11
  category: license_system
  question: At what age is a Kansas driver eligible for a full, non-restricted Class
    C driver's license, provided they have met all GDL requirements?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: In Kansas, the full, non-restricted Class C license is available at
    age 17, provided the driver has held a restricted license for at least six months
    and completed all required driving hours.
- id: 12
  category: license_system
  question: Which of the following is a requirement for a 14-year-old to obtain a
    Farm Permit in Kansas?
  choices:
    A: They must live or work on a farm of at least 20 acres.
    B: They must only drive to and from a farm-related job.
    C: They must have completed a tractor safety course.
    D: They must have held an instruction permit for 2 years.
  answer: A
  explanation: To be eligible for a Farm Permit at age 14, the applicant must reside
    on a farm parcel of 20 acres or more, or be employed for compensation on such
    a farm.
- id: 13
  category: license_system
  question: When renewing a Kansas driver's license, which test is mandatory for all
    drivers?
  choices:
    A: Road skills test
    B: Written knowledge test
    C: Vision test
    D: Hearing test
  answer: C
  explanation: A vision screening is required every time a Kansas driver's license
    is renewed to ensure the driver still meets the minimum 20/40 requirement.
- id: 14
  category: license_system
  question: 'Under the Kansas ''Implied Consent'' law, if you refuse to submit to
    a chemical test for alcohol or drugs, your driving privileges will be automatically
    suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: By driving on Kansas roads, you give 'implied consent' to testing.
    Refusal to take a breath, blood, or urine test results in a 1-year license suspension
    for a first offense.
- id: 15
  category: license_system
  question: What are the minimum liability insurance requirements for a motor vehicle
    registered in Kansas?
  choices:
    A: 10/20/10
    B: 25/50/25
    C: 50/100/50
    D: 100/300/100
  answer: B
  explanation: Kansas law requires minimum liability coverage of $25,000 for bodily
    injury of one person, $50,000 for bodily injury of two or more people, and $25,000
    for property damage (25/50/25).
- id: 16
  category: license_system
  question: In Kansas, what is the minimum age to apply for a Commercial Driver's
    License (CDL) to operate a commercial vehicle in interstate commerce (across state
    lines)?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: While Kansas allows drivers aged 18 to 20 to operate commercial vehicles
    within state lines (intrastate), federal law and Kansas regulations require a
    driver to be at least 21 years old for interstate commerce.
- id: 17
  category: license_system
  question: To operate a motorized bicycle (moped) on Kansas roadways, a person must
    possess at least what type of license?
  choices:
    A: No license is required for mopeds
    B: A valid Class C, M, or a Motorized Bicycle license
    C: Only a Class M license
    D: A special permit from the local police department
  answer: B
  explanation: Kansas law requires moped operators to have a valid driver's license,
    which can be a standard Class C, a motorcycle Class M, or a specific Motorized
    Bicycle license.
- id: 18
  category: license_system
  question: For a Kansas resident between the ages of 21 and 64, a standard driver's
    license is typically valid for how many years?
  choices:
    A: 4 years
    B: 5 years
    C: 6 years
    D: 8 years
  answer: C
  explanation: In Kansas, driver's licenses issued to persons between the ages of
    21 and 64 are valid for a period of 6 years.
- id: 19
  category: license_system
  question: 'When a person with a Kansas Instruction Permit is driving, the supervising
    driver in the front seat must be at least 21 years old and have:'
  choices:
    A: A valid license for at least one year
    B: A valid license for at least five years
    C: No points on their driving record
    D: A Commercial Driver's License
  answer: A
  explanation: Kansas GDL laws require the supervising driver for an Instruction Permit
    holder to be at least 21 years old and have held a valid driver's license for
    at least one year.
- id: 20
  category: license_system
  question: Under Kansas law, a 'Habitual Violator' is someone who has been convicted
    of how many major driving offenses within a three-year period?
  choices:
    A: '2'
    B: '3'
    C: '5'
    D: '10'
  answer: B
  explanation: A Habitual Violator is defined in Kansas as a person who has been convicted
    of three or more specific major offenses (like DUI or driving while suspended)
    within a three-year period.
- id: 21
  category: license_system
  question: A Kansas Farm Permit holder may drive to or from any farm-related work,
    but for non-farm work, they are restricted to a radius of how many miles from
    the farm?
  choices:
    A: 10 miles
    B: 15 miles
    C: 20 miles
    D: 50 miles
  answer: C
  explanation: Kansas law allows Farm Permit holders to drive to and from any farm-related
    work, but they are restricted to a 20-mile radius from the farm for other purposes.
- id: 22
  category: license_system
  question: To obtain a Kansas REAL ID-compliant license, which of the following is
    required as proof of Social Security?
  choices:
    A: A verbal statement of the number
    B: An original Social Security card or a W-2/1099 form showing the full number
    C: A photocopy of a Social Security card
    D: A credit card statement
  answer: B
  explanation: Kansas REAL ID requirements mandate an original document such as a
    Social Security card, a W-2, or a 1099 form that displays the full Social Security
    number.
- id: 23
  category: license_system
  question: Which Kansas driver's license classification is specifically required
    to operate a motorcycle?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class M
  answer: D
  explanation: In Kansas, a Class M license or endorsement is required to legally
    operate a motorcycle on public roads.
- id: 24
  category: license_system
  question: If a Kansas driver's license is suspended for a non-alcohol-related moving
    violation, what is the standard reinstatement fee?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: The standard reinstatement fee for a Kansas driver's license suspended
    for non-alcohol-related reasons is $100.
- id: 25
  category: license_system
  question: If you move to Kansas from another state, you must apply for a Kansas
    driver's license within how many days of establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: D
  explanation: New Kansas residents have 90 days to obtain a Kansas driver's license
    after establishing residency in the state.
- id: 26
  category: license_system
  question: If a Kansas driver fails the vision screening at the DMV, what is the
    next step required by the Division of Vehicles?
  choices:
    A: They are permanently banned from driving
    B: They must wait 24 hours and try again
    C: They must have a vision specialist complete a Form DL-V and return it to the
      DMV
    D: They must take a road test immediately
  answer: C
  explanation: If the vision screening is failed, the applicant must take a Vision
    Report (Form DL-V) to an ophthalmologist or optometrist for a professional evaluation.
- id: 27
  category: license_system
  question: What is the minimum age to apply for a motorcycle instruction permit in
    Kansas?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '17'
  answer: A
  explanation: In Kansas, an individual can apply for a motorcycle instruction permit
    as early as age 14, provided they have parental consent.
- id: 28
  category: license_system
  question: 'In Kansas, a first-time conviction for driving while your license is
    suspended or revoked is classified as a:'
  choices:
    A: Traffic infraction
    B: Class B nonperson misdemeanor
    C: Class A felony
    D: Civil penalty only
  answer: B
  explanation: Driving while suspended (DWS) is a serious offense in Kansas and is
    classified as a Class B nonperson misdemeanor for the first conviction.
- id: 29
  category: license_system
  question: Under the 'Motor Voter' law in Kansas, when can an applicant register
    to vote?
  choices:
    A: Only during a general election
    B: At the time of applying for or renewing a driver's license
    C: Only at the County Clerk's office
    D: After holding a license for at least one year
  answer: B
  explanation: The National Voter Registration Act (Motor Voter) allows Kansas residents
    to register to vote or update their registration during the driver's license application
    or renewal process.
- id: 30
  category: license_system
  question: 'When you are issued a Kansas driver''s license, you must:'
  choices:
    A: Keep your old license as a backup
    B: Surrender all other driver's licenses in your possession
    C: Pay a $500 security deposit
    D: Register your vehicle within 24 hours
  answer: B
  explanation: Kansas law requires that you surrender all valid driver's licenses
    from other states or jurisdictions when you are issued a Kansas license.
- id: 31
  category: driver_testing
  question: In Kansas, what is the default speed limit on unpaved or gravel roads
    unless otherwise posted?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: According to the Kansas Driver's Manual, the speed limit on unpaved
    or gravel roads is 55 mph unless a different limit is posted.
- id: 32
  category: driver_testing
  question: When preparing to turn, Kansas law requires you to signal continuously
    for at least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Kansas law (K.S.A. 8-1548) requires drivers to signal their intention
    to turn at least 100 feet before the turn is made.
- id: 33
  category: driver_testing
  question: Under Kansas law, when are you required to use your headlights in relation
    to windshield wipers?
  choices:
    A: Only during heavy thunderstorms
    B: Only when wipers are on the 'high' setting
    C: Whenever windshield wipers are in continuous use due to rain, snow, or sleet
    D: Headlights are not required to be linked to wiper use
  answer: C
  explanation: Kansas law requires that headlights be turned on whenever windshield
    wipers are in continuous use because of rain, snow, sleet, or other precipitation.
- id: 34
  category: driver_testing
  question: In Kansas, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Kansas law prohibits parking a vehicle within 15 feet of a fire hydrant.
- id: 35
  category: driver_testing
  question: If you are driving on a Kansas highway with at least two lanes traveling
    in the same direction and you approach a stationary emergency vehicle with flashing
    lights, what must you do?
  choices:
    A: Maintain speed but move to the left lane
    B: Stop immediately in your lane
    C: Move to the lane furthest from the emergency vehicle if safe to do so, or slow
      down
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: The Kansas 'Move Over' law requires drivers to move to a lane that
    is not adjacent to the stationary emergency vehicle if possible; if not safe,
    the driver must slow down and proceed with caution.
- id: 36
  category: driver_testing
  question: For a first-time DUI conviction in Kansas, what is the minimum fine (excluding
    court costs)?
  choices:
    A: '250'
    B: '500'
    C: '750'
    D: '1500'
  answer: C
  explanation: For a first DUI conviction in Kansas, the fine ranges from a minimum
    of $750 to a maximum of $1,000, plus court costs and other fees.
- id: 37
  category: driver_testing
  question: According to the Kansas Driver's Manual, what is the recommended following
    distance behind the vehicle in front of you under ideal conditions?
  choices:
    A: One car length
    B: Two seconds
    C: Four seconds
    D: 50 feet
  answer: B
  explanation: The Kansas Driver's Manual recommends using the 'two-second rule' to
    maintain a safe following distance under normal driving conditions.
- id: 38
  category: driver_testing
  question: In Kansas, a child must be secured in an appropriate booster seat until
    they reach what age or size?
  choices:
    A: Age 6 or 60 pounds
    B: Age 8, or 80 pounds, or 4'9" tall
    C: Age 10 or 100 pounds
    D: Age 12 or 5 feet tall
  answer: B
  explanation: Kansas law requires children ages 4 through 7 to be in a booster seat
    unless the child weighs more than 80 pounds or is taller than 4'9".
- id: 39
  category: driver_testing
  question: When passing a bicycle in Kansas, what is the minimum distance a motorist
    must maintain between their vehicle and the bicycle?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: Kansas law (K.S.A. 8-1516) requires motorists to pass a bicycle with
    a distance of not less than three feet.
- id: 40
  category: driver_testing
  question: If you fail the Kansas driving (road) test, how long must you wait before
    you are eligible to retake it?
  choices:
    A: 24 hours
    B: Until the next business day
    C: One week
    D: 30 days
  answer: B
  explanation: If an applicant fails the driving skills test, they must wait until
    at least the next business day to retake the exam.
- id: 41
  category: driver_testing
  question: When parking a vehicle headed uphill on a two-way street with a curb,
    how should the front wheels be turned?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the right
  answer: B
  explanation: When parking uphill against a curb, turn the wheels away from the curb
    so that if the vehicle rolls, the back of the front tire will hit the curb and
    stop the car.
- id: 42
  category: driver_testing
  question: In Kansas, you must dim your high beam headlights when you are within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Kansas law requires drivers to use low beams when approaching an oncoming
    vehicle within 500 feet.
- id: 43
  category: driver_testing
  question: New Kansas residents must register their vehicles within how many days
    of establishing residency?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: New residents of Kansas are required to register their vehicles within
    90 days of establishing residency in the state.
- id: 44
  category: driver_testing
  question: When approaching a school bus that is stopped with its red lights flashing
    and stop arm extended on a road that is NOT a divided highway, who must stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching from the front
    C: Traffic from both directions
    D: No one, if there are at least three lanes
  answer: C
  explanation: On any road that is not a divided highway, traffic from both directions
    must stop for a school bus with flashing red lights and an extended stop arm.
- id: 45
  category: driver_testing
  question: 'According to the Kansas Driver''s Manual, hydroplaning (where tires lose
    contact with the road on wet surfaces) can begin at speeds as low as:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The Kansas Driver's Manual states that hydroplaning can begin at speeds
    as low as 35 mph in heavy rain.
- id: 46
  category: driver_testing
  question: In Kansas, what is the maximum speed limit in a residential district unless
    otherwise posted?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: According to Kansas Statute 8-1558, the speed limit in any residential
    district is 30 miles per hour unless otherwise posted. Business districts are
    typically 20 miles per hour.
- id: 47
  category: driver_testing
  question: When intending to turn or change lanes in Kansas, you must activate your
    turn signal at least how many feet before the maneuver?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Kansas law requires drivers to signal their intention to turn or change
    lanes continuously for at least 100 feet before the turn or move.
- id: 48
  category: driver_testing
  question: In Kansas, when are you required to have your headlights turned on in
    relation to weather conditions?
  choices:
    A: Only when visibility is less than 200 feet
    B: Only between sunset and sunrise
    C: Whenever windshield wipers are in continuous use
    D: Only during heavy fog or snow
  answer: C
  explanation: Kansas law requires the use of headlights when windshield wipers are
    in continuous use due to rain, snow, or sleet, or when visibility is less than
    1,000 feet.
- id: 49
  category: driver_testing
  question: 'Kansas ''Move Over'' law requires drivers approaching a stationary emergency
    vehicle with flashing lights to:'
  choices:
    A: Stop completely until signaled to pass
    B: Maintain speed but honk to alert the emergency workers
    C: Move into a lane not adjacent to the vehicle, if safe to do so
    D: Speed up to clear the area quickly
  answer: C
  explanation: The Kansas Move Over law (Statute 8-1530) requires drivers on multi-lane
    highways to vacate the lane closest to stationary emergency vehicles or maintenance
    vehicles, or slow down significantly if a lane change is unsafe.
- id: 50
  category: driver_testing
  question: According to the Kansas Child Passenger Safety Act, children in which
    age range must be protected by a booster seat unless they are 4'9" tall or weigh
    80 pounds?
  choices:
    A: Ages 2 through 5
    B: Ages 4 through 7
    C: Ages 6 through 10
    D: Ages 5 through 12
  answer: B
  explanation: Kansas law requires children ages 4 through 7 to be in a booster seat
    unless they weigh more than 80 pounds or are taller than 4 feet 9 inches.
- id: 51
  category: driver_testing
  question: The Kansas Driving Handbook recommends using which rule to maintain a
    safe following distance behind the vehicle in front of you?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The four-second rule
    D: The ten-foot rule
  answer: B
  explanation: The Kansas Driving Handbook recommends the 'two-second rule' for standard
    following distances under ideal driving conditions.
- id: 52
  category: driver_testing
  question: 'For drivers age 21 and older in Kansas, it is illegal to operate a motor
    vehicle with a Blood Alcohol Content (BAC) of:'
  choices:
    A: 0.02% or higher
    B: 0.05% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: In Kansas, the legal limit for Blood Alcohol Content (BAC) for drivers
    21 years of age or older is 0.08%.
- id: 53
  category: driver_testing
  question: In Kansas, you may not park your vehicle within how many feet of a stop
    sign, flashing beacon, or yield sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Kansas Statute 8-1571 states that you cannot park within 30 feet of
    any flashing signal, stop sign, yield sign, or traffic-control signal located
    at the side of a roadway.
- id: 54
  category: driver_testing
  question: When parking near an intersection in Kansas, what is the minimum distance
    you must maintain from a crosswalk?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Kansas law prohibits parking a vehicle within 20 feet of a crosswalk
    at an intersection.
- id: 55
  category: driver_testing
  question: What is the range of the fine for a first-offense DUI conviction in the
    state of Kansas?
  choices:
    A: $250 to $500
    B: $500 to $750
    C: $750 to $1,000
    D: $1,000 to $2,500
  answer: C
  explanation: For a first DUI conviction in Kansas, the court imposes a fine ranging
    from $750 to $1,000, in addition to other penalties like jail time or community
    service.
- id: 56
  category: driver_testing
  question: 'When following another vehicle from behind at night in Kansas, you must
    dim your high beams when you are within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Kansas law requires drivers to dim their high beams when approaching
    another vehicle from the rear within 300 feet.
- id: 57
  category: driver_testing
  question: To pass the Kansas written knowledge exam, an applicant must correctly
    answer at least what percentage of the questions?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: The Kansas written test consists of 25 questions, and applicants must
    achieve a score of at least 80% (20 correct answers) to pass.
- id: 58
  category: driver_testing
  question: When appearing for the Kansas driving skills (road) test, which of the
    following must you provide for the test vehicle?
  choices:
    A: Proof of a recent oil change
    B: A notarized letter from the vehicle owner
    C: Valid proof of registration and current insurance
    D: The vehicle's original title
  answer: C
  explanation: To take the Kansas road test, the applicant must provide a vehicle
    that is in safe operating condition and present valid proof of registration and
    current liability insurance for that vehicle.
- id: 59
  category: driver_responsibility
  question: 'In Kansas, if you are involved in a motor vehicle accident that results
    in property damage, you must report it to the police immediately if the damage
    appears to be at least:'
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,500
  answer: C
  explanation: According to the Kansas Driving Handbook, any accident resulting in
    death, personal injury, or total property damage of $1,000 or more must be reported
    to the nearest law enforcement agency.
- id: 60
  category: driver_responsibility
  question: Kansas is a 'No-Fault' insurance state. This means every motor vehicle
    liability policy must include which of the following coverages to pay for your
    own medical expenses?
  choices:
    A: Comprehensive Coverage
    B: Personal Injury Protection (PIP)
    C: Collision Coverage
    D: Gap Insurance
  answer: B
  explanation: Kansas law requires Personal Injury Protection (PIP) coverage, which
    pays for medical expenses, lost wages, and other costs for the insured person
    regardless of who was at fault in the accident.
- id: 61
  category: driver_responsibility
  question: When you sell a vehicle in Kansas, what must you do with the license plate?
  choices:
    A: Leave it on the vehicle for the new owner.
    B: Remove it and keep it for your next vehicle or turn it in.
    C: Destroy it immediately.
    D: Give it to the local police department.
  answer: B
  explanation: In Kansas, license plates follow the owner, not the vehicle. When a
    vehicle is sold, the seller must remove the plate and may transfer it to another
    vehicle or return it to the county treasurer.
- id: 62
  category: driver_responsibility
  question: A new resident to Kansas has how many days to register their vehicle and
    obtain Kansas license plates?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Under Kansas law, a person is considered a resident for vehicle registration
    purposes if they live in the state for 90 days or more.
- id: 63
  category: driver_responsibility
  question: For a first-time DUI conviction in Kansas (BAC .08 or higher), what is
    the mandatory minimum period of license suspension before ignition interlock restrictions
    begin?
  choices:
    A: 10 days
    B: 30 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: For a first DUI occurrence, Kansas law mandates a 30-day suspension
    of driving privileges, followed by a period of driving only with an ignition interlock
    device (usually 180 days or 1 year depending on the BAC level).
- id: 64
  category: driver_responsibility
  question: If you are caught driving without the required motor vehicle liability
    insurance in Kansas, what is the maximum fine for a first offense?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Driving without insurance in Kansas is a Class B misdemeanor. For a
    first offense, the fine ranges from $300 to $1,000, and the driver could face
    up to six months in jail.
- id: 65
  category: driver_responsibility
  question: 'In Kansas, vehicle registration renewal months are determined by:'
  choices:
    A: The owner's birth month.
    B: The month the vehicle was purchased.
    C: The first letter of the owner's last name.
    D: The vehicle's model year.
  answer: C
  explanation: Kansas uses a staggered registration system where the renewal month
    is determined by the first letter of the owner's last name (e.g., 'A' is February,
    'B' is March, etc.).
- id: 66
  category: driver_responsibility
  question: 'Under the Kansas Child Passenger Safety Act, children must be secured
    in a federally approved child safety seat or booster seat until they are:'
  choices:
    A: 6 years old or 60 pounds.
    B: 8 years old or 80 pounds or 4'9" tall.
    C: 10 years old.
    D: 12 years old.
  answer: B
  explanation: Kansas law requires children under age 4 to be in a child safety seat,
    and children ages 4 through 7 must be in a booster seat unless they weigh more
    than 80 pounds or are taller than 4'9".
- id: 67
  category: driver_responsibility
  question: What is the maximum fine for a first-time conviction of littering from
    a motor vehicle on Kansas highways?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $5,000
  answer: C
  explanation: Littering is illegal in Kansas. A first conviction can result in a
    fine of up to $1,000 and the possibility of being required to pick up litter.
- id: 68
  category: driver_responsibility
  question: 'In Kansas, if you are convicted of speeding in a road construction or
    maintenance zone where workers are present, the fine is:'
  choices:
    A: Increased by $50.
    B: Doubled.
    C: Tripled.
    D: Unchanged, but points are doubled.
  answer: B
  explanation: Kansas law (K.S.A. 8-1560d) stipulates that fines for speeding violations
    are doubled if the violation occurs within a highway construction or maintenance
    zone when workers are present.
- id: 69
  category: driver_responsibility
  question: If your Kansas driver's license is suspended for a non-alcohol related
    reason, what is the standard reinstatement fee you must pay to get it back?
  choices:
    A: $25
    B: $50
    C: $100
    D: $400
  answer: C
  explanation: For most non-alcohol related suspensions, Kansas requires a $100 reinstatement
    fee. Alcohol-related suspensions carry a significantly higher fee (up to $1,000).
- id: 70
  category: driver_responsibility
  question: 'Under Kansas law, it is illegal to transport an open container of an
    alcoholic beverage in the passenger area of a vehicle. This law applies to:'
  choices:
    A: Only the driver.
    B: Only the passengers.
    C: Both the driver and the passengers.
    D: Only drivers under the age of 21.
  answer: C
  explanation: Kansas law prohibits both drivers and passengers from possessing an
    open container of alcohol in the passenger compartment of a vehicle on a public
    highway or street.
- id: 71
  category: driver_responsibility
  question: 'If you are involved in an accident with a parked vehicle and the owner
    cannot be found, Kansas law requires you to:'
  choices:
    A: Wait for at least two hours for the owner to return.
    B: Leave a note with your name, address, and registration number, and notify law
      enforcement.
    C: Drive away if the damage is less than $500.
    D: Only report it if the other vehicle is a luxury car.
  answer: B
  explanation: If you hit an unattended vehicle, you must stop and either find the
    owner or leave a written notice in a conspicuous place on the vehicle, then report
    the accident to the police.
- id: 72
  category: driver_responsibility
  question: In Kansas, what is the minimum Blood Alcohol Content (BAC) level for a
    driver of a commercial motor vehicle to be considered 'under the influence'?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: While the legal limit for standard drivers in Kansas is 0.08%, the
    limit for commercial drivers (CDL holders) operating a commercial vehicle is 0.04%.
- id: 73
  category: driver_responsibility
  question: 'If a Kansas driver is convicted of failing to yield to an emergency vehicle
    (Move Over Law), the base fine is approximately:'
  choices:
    A: $50
    B: $100
    C: $195
    D: $500
  answer: C
  explanation: Kansas law requires drivers to move over or slow down for emergency
    vehicles. The statutory fine for failing to yield to an emergency vehicle is $195
    plus court costs.
- id: 74
  category: driver_responsibility
  question: 'Kansas is a ''no-fault'' insurance state. This means that every liability
    policy must include Personal Injury Protection (PIP) to cover:'
  choices:
    A: Damage to the other driver's vehicle only
    B: Theft of the vehicle
    C: Medical expenses for you and your passengers regardless of who caused the accident
    D: Damage caused by natural disasters
  answer: C
  explanation: Kansas law requires Personal Injury Protection (PIP) as part of the
    no-fault system, which pays for medical expenses, rehabilitation, and lost wages
    for the insured person and their passengers regardless of fault.
- id: 75
  category: driver_responsibility
  question: After purchasing a vehicle from an individual (private sale) in Kansas,
    how many days do you have to title and register the vehicle?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: D
  explanation: In Kansas, you have 60 days from the date of purchase to title and
    register a vehicle. During this time, you must carry the signed-over title or
    a bill of sale in the vehicle.
- id: 76
  category: driver_responsibility
  question: Under the Kansas Safety Belt Use Act, what is the fine for an adult (18
    or older) front-seat passenger found not wearing a seat belt?
  choices:
    A: $10
    B: $30
    C: $60
    D: $100
  answer: B
  explanation: The fine for a seat belt violation for an adult (18+) in Kansas is
    $30. This is a standard enforcement law.
- id: 77
  category: driver_responsibility
  question: 'In Kansas, littering from a motor vehicle is a crime. A person convicted
    of littering may be fined up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Littering is a Class C misdemeanor in Kansas, and a conviction can
    result in a fine of up to $1,000 and/or a jail term.
- id: 78
  category: driver_responsibility
  question: If your Kansas driving privileges are suspended for a first-time failure
    to maintain insurance, what is the reinstatement fee?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: To reinstate a license suspended for no insurance in Kansas, the driver
    must pay a $100 reinstatement fee and file proof of financial responsibility (SR-22).
- id: 79
  category: driver_responsibility
  question: 'If you change your name (e.g., due to marriage or court order), you must
    notify the Kansas Division of Vehicles within:'
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: Kansas law requires drivers to notify the Division of Vehicles within
    10 days of a name change and obtain a corrected license.
- id: 80
  category: driver_responsibility
  question: What is the fine for a first-time conviction of violating the Kansas law
    against 'texting while driving'?
  choices:
    A: $30
    B: $60
    C: $150
    D: $250
  answer: B
  explanation: The fine for a texting while driving violation in Kansas is $60, plus
    applicable court costs.
- id: 81
  category: driver_responsibility
  question: 'When approaching a stationary emergency vehicle or maintenance vehicle
    with flashing lights on a Kansas highway with at least two lanes in the same direction,
    you must:'
  choices:
    A: Maintain speed but move to the left lane
    B: Stop completely until the vehicle moves
    C: Move to the lane furthest from the vehicle or slow down if a lane change is
      unsafe
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: The Kansas 'Move Over' law requires drivers to move to a lane not adjacent
    to the stationary emergency/maintenance vehicle or to slow down significantly
    if a lane change is not possible.
- id: 82
  category: driver_responsibility
  question: 'If you are involved in an accident in Kansas, you are legally required
    to provide your name, address, and vehicle registration number to:'
  choices:
    A: Only the police officer on the scene
    B: Any person injured or the owner of any property damaged in the accident
    C: Your insurance agent only
    D: No one until you speak to an attorney
  answer: B
  explanation: Kansas law requires drivers involved in an accident to provide their
    information to any person injured and to the owner of any property or vehicle
    damaged.
- id: 83
  category: driver_responsibility
  question: If your license is suspended for a first-time insurance violation, for
    how long must you maintain an SR-22 (financial responsibility) filing with the
    state of Kansas?
  choices:
    A: 6 months
    B: 12 months
    C: 24 months
    D: 36 months
  answer: B
  explanation: In Kansas, for a first-time insurance suspension, the driver is typically
    required to maintain an SR-22 filing for 12 continuous months.
- id: 84
  category: safe_driving_rules
  question: Under Kansas law, you must signal your intention to turn at least how
    many feet before the actual turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Kansas law requires drivers to use a turn signal continuously for at
    least 100 feet before making a turn or changing lanes.
- id: 85
  category: safe_driving_rules
  question: When parking near an intersection, you must be at least how many feet
    away from a stop sign, flashing beacon, or traffic control signal?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Kansas law prohibits parking within 30 feet of any flashing beacon,
    stop sign, or traffic control signal located at the side of a roadway.
- id: 86
  category: safe_driving_rules
  question: In Kansas, you may not pass another vehicle when you are within how many
    feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Passing is prohibited in Kansas when approaching within 100 feet of
    or traversing any intersection or railroad grade crossing.
- id: 87
  category: safe_driving_rules
  question: 'Kansas law requires headlights to be on when visibility is reduced to
    less than:'
  choices:
    A: 500 feet
    B: 800 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Headlights must be used in Kansas whenever you cannot see other vehicles
    or objects clearly at a distance of 1,000 feet.
- id: 88
  category: safe_driving_rules
  question: On a Kansas highway divided by a median or physical barrier, do you have
    to stop for a school bus with flashing red lights approaching from the opposite
    direction?
  choices:
    A: Yes, you must always stop for a school bus.
    B: No, you do not need to stop if you are traveling in the opposite direction
      on a divided highway.
    C: Yes, but only if the bus driver signals you to stop.
    D: No, but you must slow down to 15 mph.
  answer: B
  explanation: In Kansas, drivers on a highway with separate roadways (divided by
    a median or barrier) do not need to stop for a school bus traveling in the opposite
    direction.
- id: 89
  category: safe_driving_rules
  question: What happens to traffic fines in Kansas when a violation occurs in a construction
    or maintenance zone where workers are present?
  choices:
    A: The fine is increased by $50.
    B: The fine is doubled.
    C: The fine is tripled.
    D: The driver's license is automatically suspended.
  answer: B
  explanation: Kansas law mandates that fines for traffic violations are doubled in
    construction or maintenance zones when workers are present.
- id: 90
  category: safe_driving_rules
  question: Unless otherwise posted, what is the default speed limit in any 'urban
    district' in Kansas?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Per K.S.A. 8-1558, the speed limit in any urban district is 30 mph
    unless otherwise posted.
- id: 91
  category: safe_driving_rules
  question: According to the Kansas 'Move Over' law, what must you do when approaching
    a stationary emergency vehicle with its lights flashing?
  choices:
    A: Stop immediately in the roadway.
    B: Maintain speed but honk your horn.
    C: Move to a lane not adjacent to the vehicle, or slow down if changing lanes
      is unsafe.
    D: Speed up to pass the vehicle as quickly as possible.
  answer: C
  explanation: Kansas law requires drivers to move to a lane not adjacent to a stationary
    emergency vehicle or slow down and proceed with caution if a lane change is not
    possible.
- id: 92
  category: safe_driving_rules
  question: 'In Kansas, you are required to turn on your headlights whenever you are
    using your windshield wipers continuously due to:'
  choices:
    A: Rain, snow, or sleet
    B: Cleaning the windshield
    C: Dust storms only
    D: Fog only
  answer: A
  explanation: Kansas law requires the use of headlights when windshield wipers are
    in continuous use due to rain, snow, sleet, or other precipitation.
- id: 93
  category: safe_driving_rules
  question: 'In Kansas, you do NOT have to stop for a school bus with flashing red
    lights if:'
  choices:
    A: The bus is on the opposite side of a divided highway separated by a median
      or barrier.
    B: The bus is stopped in a school zone.
    C: You are traveling in the same direction on a four-lane road.
    D: The bus driver signals you to pass.
  answer: A
  explanation: Drivers are not required to stop for a school bus if they are traveling
    in the opposite direction on a divided highway with a median or physical barrier.
- id: 94
  category: safe_driving_rules
  question: 'To maintain a safe following distance under normal driving conditions
    in Kansas, you should use the:'
  choices:
    A: One-second rule
    B: Two-second rule
    C: Five-second rule
    D: Ten-second rule
  answer: B
  explanation: The Kansas Driving Handbook recommends a minimum following distance
    of at least two seconds behind the vehicle in front of you.
- id: 95
  category: safe_driving_rules
  question: 'When entering a roundabout in Kansas, you must yield the right-of-way
    to:'
  choices:
    A: Traffic entering from the right.
    B: Traffic already in the circle.
    C: No one; you have the right of way when entering.
    D: Only emergency vehicles.
  answer: B
  explanation: In Kansas roundabouts, entering traffic must yield the right-of-way
    to vehicles already circulating within the roundabout.
- id: 96
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in Kansas traffic,
    how far ahead should you scan the road?
  choices:
    A: 5 seconds
    B: 12 seconds
    C: 20 seconds
    D: 30 seconds
  answer: B
  explanation: Kansas defensive driving guidelines suggest scanning the road at least
    12 seconds ahead to identify potential hazards early and allow time for safe reactions.
- id: 97
  category: defensive_driving
  question: 'In Kansas, you are required by law to use your headlights whenever you
    are using your:'
  choices:
    A: Turn signals
    B: Hazard lights
    C: Windshield wipers
    D: Cruise control
  answer: C
  explanation: Kansas law requires drivers to activate their headlights whenever windshield
    wipers are in continuous use due to rain, snow, or sleet.
- id: 98
  category: defensive_driving
  question: 'In Kansas, headlights must be turned on from sunset to sunrise and whenever
    visibility is less than:'
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: B
  explanation: Kansas law stipulates that headlights must be used from sunset to sunrise
    and at any other time when visibility is reduced to 1,000 feet or less.
- id: 99
  category: defensive_driving
  question: At what speed can hydroplaning (where tires lose contact with the road
    and ride on a layer of water) begin to occur on wet Kansas roads?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    your tires can lose all contact with the road at 55 mph.
- id: 100
  category: defensive_driving
  question: When driving in heavy fog in Kansas, which lights should you use to ensure
    the best visibility?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard flashers only
  answer: B
  explanation: Low beam headlights should be used in fog. High beams reflect off the
    fog particles and create a glare that makes it harder to see.
- id: 101
  category: defensive_driving
  question: 'If your vehicle starts to skid on an icy Kansas road, the correct defensive
    driving response is to:'
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Turn the steering wheel in the direction the rear of the vehicle is skidding
    D: Shift the car into neutral and turn off the engine
  answer: C
  explanation: To recover from a skid, you should take your foot off the gas and turn
    the steering wheel in the direction the rear of the vehicle is skidding.
- id: 102
  category: defensive_driving
  question: When approaching a railroad crossing in Kansas with a stop sign or electric
    signal, you must stop your vehicle within how many feet of the nearest rail?
  choices:
    A: 5 to 10 feet
    B: 10 to 25 feet
    C: 15 to 50 feet
    D: 50 to 100 feet
  answer: C
  explanation: Kansas law requires drivers to stop between 15 and 50 feet from the
    nearest rail at a railroad crossing when signals are flashing or a stop sign is
    present.
- id: 103
  category: defensive_driving
  question: 'To properly check your ''blind spot'' before changing lanes on a Kansas
    highway, you should:'
  choices:
    A: Check your rearview mirror
    B: Check your side-view mirror
    C: Turn your head and look over your shoulder in the direction of the move
    D: Honk your horn to see if anyone reacts
  answer: C
  explanation: Mirrors do not show everything. You must turn your head and look over
    your shoulder to check the areas (blind spots) that mirrors cannot see before
    changing lanes.
- id: 104
  category: defensive_driving
  question: When parking a vehicle uphill on a two-way street with a curb in Kansas,
    how should you position your front wheels?
  choices:
    A: Turned toward the curb
    B: Turned away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill against a curb, turn your wheels away from the
    curb (to the left) so that if the vehicle rolls, the back of the front tire will
    hit the curb and stop the car.
- id: 105
  category: defensive_driving
  question: In Kansas, at what speed can hydroplaning begin to occur, causing tires
    to lose contact with the road surface during heavy rain?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: In Kansas, hydroplaning can start at speeds as low as 35 mph. At 50
    mph, tires may lose all contact with the road if the water is deep enough.
- id: 106
  category: defensive_driving
  question: Under Kansas law, who is required to wear a seat belt in a passenger vehicle
    where the driver is 18 years of age or older?
  choices:
    A: Only the driver
    B: Only the driver and front-seat passenger
    C: Only passengers under the age of 14
    D: The driver and all passengers
  answer: D
  explanation: Kansas law requires the driver and all occupants of a passenger vehicle
    to be properly restrained by a seat belt or child safety seat.
- id: 107
  category: defensive_driving
  question: When sharing the road with large trucks in Kansas, what is the 'No-Zone'?
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the front, back, and sides of the truck
    C: The fast lane on the interstate
    D: The area directly in front of a weigh station
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck where
    the truck driver cannot see your vehicle. If you cannot see the truck driver's
    mirrors, they cannot see you.
- id: 108
  category: defensive_driving
  question: 'In Kansas, it is illegal to follow a fire apparatus (fire truck) responding
    to an alarm closer than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Kansas law prohibits following any fire apparatus traveling in response
    to a fire alarm closer than 500 feet.
- id: 109
  category: alcohol_drugs_health
  question: In Kansas, what is the maximum legal Blood Alcohol Content (BAC) limit
    for a driver operating a commercial motor vehicle?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.04%
    D: 0.02%
  answer: C
  explanation: Under Kansas law and federal regulations, the BAC limit for commercial
    drivers is 0.04%. Any level at or above this will result in a disqualification
    of commercial driving privileges.
- id: 110
  category: alcohol_drugs_health
  question: A first-time DUI conviction in Kansas requires a mandatory minimum jail
    sentence of how many hours?
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: C
  explanation: Kansas law requires a mandatory minimum of 48 hours of imprisonment
    or 100 hours of public service for a first DUI conviction.
- id: 111
  category: alcohol_drugs_health
  question: After the initial suspension period for a first DUI conviction with a
    BAC of .08 to .14, how long must a Kansas driver use an Ignition Interlock Device
    (IID)?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: For a first DUI with a BAC between .08 and .14, the driver faces a
    30-day suspension followed by 180 days (6 months) of restricted driving with an
    ignition interlock device.
- id: 112
  category: alcohol_drugs_health
  question: According to the Kansas Open Container Law, where is it legal to transport
    an unsealed or open container of alcohol?
  choices:
    A: In the glove compartment
    B: In the trunk of the vehicle
    C: In the back seat, if the driver cannot reach it
    D: In a center console
  answer: B
  explanation: Kansas law prohibits open containers in the passenger area. They must
    be in the trunk or, if the vehicle has no trunk, in an area not normally occupied
    by the driver or passengers (behind the last upright seat).
- id: 113
  category: alcohol_drugs_health
  question: If a Kansas driver is convicted of a second DUI offense, what is the mandatory
    driver's license suspension period?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Permanently revoked
  answer: B
  explanation: A second DUI conviction in Kansas results in a mandatory one-year suspension
    of driving privileges, followed by a period of ignition interlock restriction.
- id: 114
  category: alcohol_drugs_health
  question: In Kansas, what is the 'synergistic effect' in relation to driving?
  choices:
    A: The recovery time after a crash
    B: The combined effect of alcohol and drugs which is greater than the sum of their
      parts
    C: The legal process of reinstating a license
    D: The reaction time of an elderly driver
  answer: B
  explanation: The synergistic effect occurs when alcohol and drugs (even prescription
    or over-the-counter) are taken together, multiplying the impairment levels significantly.
- id: 115
  category: alcohol_drugs_health
  question: To maintain a Kansas driver's license, a person with a history of seizures
    must generally be seizure-free for how long before driving?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Kansas medical standards generally require a person with a seizure
    disorder to be seizure-free for at least six months before they can legally operate
    a motor vehicle.
- id: 116
  category: alcohol_drugs_health
  question: If you are taking prescription medication, who is legally responsible
    for ensuring you are fit to drive in Kansas?
  choices:
    A: The doctor who prescribed the medicine
    B: The pharmacist who filled the prescription
    C: The driver of the vehicle
    D: The Kansas Department of Transportation
  answer: C
  explanation: It is the driver's responsibility to know the effects of any medication
    they are taking. Driving while impaired by prescription drugs is treated the same
    as driving under the influence of alcohol.
- id: 117
  category: alcohol_drugs_health
  question: 'In Kansas, a driver is considered ''Per Se'' intoxicated if their BAC
    is:'
  choices:
    A: 0.05% or higher
    B: 0.07% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: '''Per Se'' means that the BAC level itself (0.08% for adults) is sufficient
    evidence of intoxication, regardless of how well the person appears to be driving.'
- id: 118
  category: alcohol_drugs_health
  question: 'Under Kansas law, if you are involved in a crash that results in personal
    injury or death, you are required to:'
  choices:
    A: Submit to a drug and alcohol test if requested by an officer
    B: Only submit to a test if you were at fault
    C: Only submit to a test if you have a previous DUI
    D: Refuse all tests until an attorney is present
  answer: A
  explanation: Under Kansas implied consent laws, if you are involved in a serious
    injury or fatal accident, law enforcement has the authority to request chemical
    testing for alcohol or drugs.
- id: 119
  category: alcohol_drugs_health
  question: What is the only effective way to reduce the Blood Alcohol Content (BAC)
    in your body?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Giving your body time to process the alcohol
  answer: D
  explanation: Only time can reduce BAC. The body processes alcohol at a steady rate
    (roughly one drink per hour), and stimulants like coffee do not speed up this
    process.
- id: 120
  category: alcohol_drugs_health
  question: 'In Kansas, if a driver''s BAC is .15 or higher on a first offense, the
    ignition interlock requirement is increased to:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: For a first DUI offense in Kansas with a BAC of .15 or higher, the
    driver must maintain an ignition interlock device for one year following the suspension
    period.
- id: 121
  category: alcohol_drugs_health
  question: Which of the following is a common sign of a driver under the influence
    of alcohol or drugs?
  choices:
    A: Weaving between lanes
    B: Driving significantly slower than the speed limit
    C: Quick, jerky starts and stops
    D: All of the above
  answer: D
  explanation: Impaired drivers often exhibit erratic behavior including weaving,
    inappropriate speeds, and poor vehicle control.
- id: 122
  category: alcohol_drugs_health
  question: 'In Kansas, when calculating the number of prior DUI offenses for sentencing,
    the ''look-back'' period is:'
  choices:
    A: 5 years
    B: 10 years
    C: The driver's entire lifetime
    D: Only since the driver turned 21
  answer: C
  explanation: Kansas law uses a lifetime 'look-back' period, meaning any DUI conviction
    occurring on or after July 1, 2001, counts as a prior offense for sentencing purposes.
- id: 123
  category: alcohol_drugs_health
  question: In Kansas, if you are convicted of a DUI with a Blood Alcohol Concentration
    (BAC) of .15 or higher, how long must you use an Ignition Interlock Device (IID)
    for a first offense?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: For a first DUI offense in Kansas with a BAC of .15 or higher, the
    driver must maintain an ignition interlock device for 1 year following the suspension
    period.
- id: 124
  category: alcohol_drugs_health
  question: 'To regain driving privileges in Kansas after a medical event involving
    a loss of consciousness (such as a seizure), a driver must typically be seizure-free
    for at least:'
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: The Kansas Medical Advisory Board generally requires a person to be
    seizure-free for 6 months before they can be cleared to drive, though individual
    cases may vary based on medical review.
- id: 125
  category: alcohol_drugs_health
  question: In Kansas, if a person is convicted of a DUI while a child under the age
    of ____ was in the vehicle, the punishment is enhanced by an additional 1 month
    of imprisonment.
  choices:
    A: '12'
    B: '14'
    C: '16'
    D: '18'
  answer: B
  explanation: Per K.S.A. 8-1567, if a person is convicted of DUI while a child under
    the age of 14 was a passenger, the minimum and maximum imprisonment terms are
    increased by 1 month.
- id: 126
  category: alcohol_drugs_health
  question: What is the mandatory minimum jail time for a second DUI conviction in
    Kansas?
  choices:
    A: 48 hours
    B: 5 days
    C: 30 days
    D: 90 days
  answer: D
  explanation: A second DUI conviction in Kansas is a Class A nonperson misdemeanor
    and carries a mandatory minimum of 90 days to 1 year of imprisonment.
- id: 127
  category: alcohol_drugs_health
  question: If you receive a DC-27 (driver's license seizure form) for failing or
    refusing a breath test in Kansas, how many days do you have to request an administrative
    hearing to contest the suspension?
  choices:
    A: 7 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: C
  explanation: Kansas law provides 14 calendar days from the date the notice was served
    to request an administrative hearing to challenge the suspension of driving privileges.
- id: 128
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' in the context of driving safety?
  choices:
    A: The body's ability to process alcohol faster with food
    B: The increased effect caused by combining alcohol and drugs together
    C: The recovery time needed after a long drive
    D: The effect of high-altitude driving on blood oxygen levels
  answer: B
  explanation: The synergistic effect occurs when alcohol and drugs are taken together,
    resulting in an effect much greater than the sum of the two parts, severely impairing
    driving ability.
- id: 129
  category: alcohol_drugs_health
  question: 'When applying for or renewing a Kansas license, you must legally report
    any physical or mental condition that may prevent you from:'
  choices:
    A: Driving long distances
    B: Exercising ordinary and reasonable control over a motor vehicle
    C: Driving at night
    D: Operating a manual transmission
  answer: B
  explanation: Kansas law requires applicants to disclose any condition that could
    interfere with their ability to exercise ordinary and reasonable control over
    a motor vehicle safely.
- id: 130
  category: alcohol_drugs_health
  question: 'For the purpose of determining if a DUI is a first, second, or subsequent
    offense, Kansas law uses a ''look-back'' period of:'
  choices:
    A: 5 years
    B: 10 years
    C: 20 years
    D: A lifetime
  answer: D
  explanation: Kansas currently uses a lifetime look-back period, meaning any prior
    DUI conviction or diversion occurring during the person's lifetime counts toward
    the total number of offenses.
- id: 131
  category: alcohol_drugs_health
  question: 'In Kansas, it is illegal for a person to transport an alcoholic beverage
    in a vehicle unless it is in the original, unopened package or container, EXCEPT
    for:'
  choices:
    A: Wine that has been professionally recorked by a restaurant
    B: Beer in a plastic cup with a lid
    C: Mixed drinks in a thermos
    D: Spirits in a flask
  answer: A
  explanation: Kansas law allows for the transportation of a partially consumed bottle
    of wine if it was purchased at a restaurant and recorked, and is kept in a location
    not accessible to the driver.
- id: 132
  category: alcohol_drugs_health
  question: Which of the following is true regarding prescription drugs and driving
    in Kansas?
  choices:
    A: You cannot be charged with a DUI if the drug was legally prescribed
    B: Prescription drugs only affect driving if taken with alcohol
    C: You can be convicted of DUI if a prescription drug impairs your ability to
      drive safely
    D: Only 'Schedule I' drugs can result in a DUI charge
  answer: C
  explanation: In Kansas, a DUI charge can be based on impairment by any drug, including
    legal prescription or over-the-counter medications, if they render the driver
    incapable of safely operating a vehicle.
- id: 133
  category: alcohol_drugs_health
  question: What is the penalty for a first conviction of driving while your license
    is suspended (DWLS) for a DUI in Kansas?
  choices:
    A: A fine of $100 and no jail time
    B: Mandatory minimum of 90 days in jail and a fine of at least $1,500
    C: A warning and a 30-day extension of the suspension
    D: Mandatory minimum of 5 days in jail and a fine of at least $100
  answer: D
  explanation: Driving with a suspended license for a DUI conviction is a serious
    offense in Kansas, carrying a mandatory minimum of 5 days in jail and a fine of
    at least $100 for the first conviction.
- id: 134
  category: alcohol_drugs_health
  question: Which of the following factors is the ONLY way to lower your Blood Alcohol
    Concentration (BAC)?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Time
    D: Eating a heavy meal
  answer: C
  explanation: Only time allows the body to metabolize alcohol and lower the BAC.
    Coffee, showers, and food do not speed up the elimination of alcohol from the
    bloodstream.
- id: 135
  category: penalties_and_points
  question: In Kansas, a first-time DUI conviction can result in a minimum of how
    many hours of mandatory imprisonment or public service?
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: C
  explanation: Under Kansas law, a first DUI conviction carries a mandatory minimum
    of 48 hours of imprisonment or 100 hours of public service.
- id: 136
  category: penalties_and_points
  question: 'In Kansas, traffic fines are doubled when a violation occurs in a construction
    zone, provided that:'
  choices:
    A: The sun is down
    B: The zone is longer than one mile
    C: Workers are present and signs are posted
    D: It is a weekend
  answer: C
  explanation: Kansas law dictates that traffic fines double in maintenance or construction
    zones when workers are present and appropriate signs are posted.
- id: 137
  category: penalties_and_points
  question: In Kansas, what is the fine for a violation of the Child Passenger Safety
    Act (failing to properly secure a child in a car seat or booster)?
  choices:
    A: $30
    B: $45
    C: $60
    D: $150
  answer: C
  explanation: A violation of the Kansas Child Passenger Safety Act results in a $60
    fine plus court costs.
- id: 138
  category: penalties_and_points
  question: 'A person under 21 years of age convicted of a first-offense ''Minor in
    Possession'' (MIP) of alcohol in Kansas will face a mandatory driver''s license
    suspension of:'
  choices:
    A: 10 days
    B: 30 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: In Kansas, a first MIP conviction for a minor results in a 30-day driver's
    license suspension.
- id: 139
  category: penalties_and_points
  question: 'To reinstate a Kansas driver''s license after a suspension for a first-time
    alcohol-related occurrence (failing a breath test), the driver must pay a fee
    of:'
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: Kansas requires a $100 reinstatement fee for the first alcohol-related
    suspension occurrence.
- id: 140
  category: penalties_and_points
  question: What is the fine for violating the Kansas 'Move Over' law (failing to
    yield to a stationary emergency vehicle with flashing lights)?
  choices:
    A: $45
    B: $75
    C: $150
    D: $500
  answer: B
  explanation: The fine for failing to yield to an emergency vehicle or 'Move Over'
    violation in Kansas is $75 plus court costs.
- id: 141
  category: penalties_and_points
  question: 'Under Kansas law, transporting an open container of low-alcohol beverage
    or liquor in the passenger area of a vehicle is a violation that can result in:'
  choices:
    A: A fine of up to $200 and/or 6 months in jail
    B: An automatic 1-year license revocation
    C: A mandatory 48 hours of community service
    D: A $500 flat fine only
  answer: A
  explanation: Kansas Open Container laws (K.S.A. 8-1599) allow for a fine up to $200
    and/or a jail term of up to six months.
- id: 142
  category: penalties_and_points
  question: In Kansas, what is the specific fine for failing to stop for a school
    bus that has its stop arm extended and red lights flashing?
  choices:
    A: $100
    B: $250
    C: $315
    D: $500
  answer: C
  explanation: Kansas law sets a specific fine of $315 for passing a school bus that
    is stopped to load or unload children.
- id: 143
  category: penalties_and_points
  question: 'In Kansas, a person operating a commercial motor vehicle is considered
    to be under the influence if their BAC is at or above:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: For commercial drivers in Kansas, the legal BAC limit is 0.04%, which
    is stricter than the 0.08% limit for non-commercial drivers.
- id: 144
  category: penalties_and_points
  question: 'If your Kansas license is suspended due to a lack of motor vehicle liability
    insurance, you will generally be required to file an SR-22 form for:'
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Kansas typically requires drivers to maintain an SR-22 (proof of financial
    responsibility) for 3 years following a suspension for no insurance.
- id: 145
  category: penalties_and_points
  question: 'A first-time conviction for operating a motor vehicle in Kansas without
    the required liability insurance can result in a fine between:'
  choices:
    A: $100 and $250
    B: $300 and $1,000
    C: $500 and $1,500
    D: $1,000 and $2,500
  answer: B
  explanation: A first-time 'No Insurance' conviction in Kansas carries a fine ranging
    from $300 to $1,000 and the possibility of up to 6 months in jail.
- id: 146
  category: penalties_and_points
  question: In Kansas, what is the minimum fine for a first-offense conviction of
    Driving Under the Influence (DUI) for an adult?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: According to Kansas law (K.S.A. 8-1567), a first-offense DUI conviction
    carries a fine ranging from $750 to $1,000, plus court costs and other fees.
- id: 147
  category: penalties_and_points
  question: What is the standard fine for a violation of the Kansas law prohibiting
    texting while driving?
  choices:
    A: $25
    B: $60
    C: $150
    D: $250
  answer: B
  explanation: Under K.S.A. 8-15,111, the fine for using a wireless communication
    device to write, send, or read a written communication while operating a motor
    vehicle is $60 plus court costs.
- id: 148
  category: penalties_and_points
  question: 'For a first offense of driving without motor vehicle liability insurance
    in Kansas, the fine ranges from:'
  choices:
    A: $100 to $300
    B: $300 to $1,000
    C: $500 to $1,500
    D: $1,000 to $2,500
  answer: B
  explanation: K.S.A. 40-3104 states that a first conviction for driving without insurance
    results in a fine of not less than $300 nor more than $1,000 and/or confinement
    in the county jail.
- id: 149
  category: penalties_and_points
  question: In Kansas, what happens to the fine for a speeding violation occurring
    in a highway construction zone when workers are present?
  choices:
    A: The fine is waived for first-time offenders
    B: The fine is increased by $50
    C: The fine is doubled
    D: The fine is tripled
  answer: C
  explanation: K.S.A. 8-1560d mandates that fines for speeding violations are doubled
    when the violation occurs within a highway construction zone where workers are
    present.
- id: 150
  category: penalties_and_points
  question: 'Under Kansas law, you must immediately report any traffic accident to
    the nearest law enforcement agency if it results in property damage to an apparent
    extent of:'
  choices:
    A: $500 or more
    B: $1,000 or more
    C: $2,500 or more
    D: Any amount
  answer: B
  explanation: K.S.A. 8-1606 requires the driver of a vehicle involved in an accident
    resulting in injury, death, or total property damage of $1,000 or more to give
    notice to the nearest law enforcement agency.
- id: 151
  category: penalties_and_points
  question: 'In Kansas, transporting an open container of alcohol in the passenger
    area of a vehicle is a misdemeanor that can result in a fine of up to:'
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: Under K.S.A. 8-1599, transporting an open container is a misdemeanor
    punishable by a fine of up to $200 and/or up to six months in jail.
- id: 152
  category: penalties_and_points
  question: What is the standard fine in Kansas for failing to yield to an emergency
    vehicle (Move Over Law)?
  choices:
    A: $75
    B: $150
    C: $195
    D: $500
  answer: C
  explanation: According to the Kansas Uniform Fine Schedule for traffic infractions,
    the fine for failing to yield to an emergency vehicle (K.S.A. 8-1530) is $195.
- id: 153
  category: penalties_and_points
  question: 'If a driver is convicted of a second DUI in Kansas, their driving privileges
    will be suspended for a period of:'
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: D
  explanation: For a second DUI conviction in Kansas, the driver's license is suspended
    for one year, followed by a period of ignition interlock restriction.
- id: 154
  category: penalties_and_points
  question: What is the reinstatement fee for a Kansas driver's license suspended
    due to a first-time alcohol-related occurrence?
  choices:
    A: $25
    B: $100
    C: $400
    D: $1,000
  answer: B
  explanation: K.S.A. 8-2,142 specifies that the reinstatement fee for a first alcohol-related
    suspension is $100. This fee increases for subsequent occurrences.
- id: 155
  category: penalties_and_points
  question: 'Conviction of littering from a motor vehicle in Kansas can result in
    a maximum fine of:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Under Kansas law (K.S.A. 21-5813), littering is a misdemeanor and can
    carry a fine of up to $1,000 in addition to community service.
- id: 156
  category: penalties_and_points
  question: What is the maximum fine for the unlawful use of a handicapped parking
    placard or license plate in Kansas?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: K.S.A. 8-1,129 states that the unlawful use of a disabled parking identification
    device is a misdemeanor punishable by a fine of not more than $100.
- id: 157
  category: sharing_the_road
  question: In Kansas, when a school bus is stopped on a roadway with its red lights
    flashing and stop arm extended, which of the following is true?
  choices:
    A: Only traffic following the bus must stop.
    B: Traffic in both directions must stop on all types of roads.
    C: Traffic in both directions must stop unless the roadway is separated by a median
      or physical barrier.
    D: You only need to stop if there are children present on the shoulder.
  answer: C
  explanation: According to Kansas law (K.S.A. 8-1556), drivers must stop for a school
    bus with flashing red lights and an extended stop arm from either direction, unless
    the bus is on a different roadway of a divided highway separated by a median or
    terrain.
- id: 158
  category: sharing_the_road
  question: When following a large truck or bus, why should you increase your following
    distance?
  choices:
    A: To allow the truck driver to see you in their side mirrors.
    B: Because trucks have a shorter stopping distance than cars.
    C: To prevent the truck from rolling backward into you.
    D: To avoid the truck's 'No-Zone' in the rear.
  answer: A
  explanation: Large trucks have significant blind spots (No-Zones). If you cannot
    see the truck driver's face in their side-view mirrors, the truck driver cannot
    see you. Increasing following distance ensures visibility.
- id: 159
  category: sharing_the_road
  question: In Kansas, what must a driver do when a pedestrian is crossing the street
    guided by a service animal or carrying a white cane (with or without a red tip)?
  choices:
    A: Honk to let them know you are there.
    B: Yield the right-of-way and take precautions to avoid injury.
    C: Drive around them if there is enough space.
    D: Wait for them to wave you through.
  answer: B
  explanation: K.S.A. 8-1542 states that drivers must yield the right-of-way to any
    totally or partially blind pedestrian carrying a visible white cane or accompanied
    by a guide dog.
- id: 160
  category: sharing_the_road
  question: Which of the following is true regarding 'lane splitting' (operating between
    rows of stopped or moving vehicles) for motorcycles in Kansas?
  choices:
    A: It is legal at speeds under 15 mph.
    B: It is legal only on multi-lane highways.
    C: It is illegal in the state of Kansas.
    D: It is legal if the motorcyclist is wearing a helmet.
  answer: C
  explanation: In Kansas, motorcycles are entitled to the full use of a lane, and
    no motor vehicle shall be driven in such a manner as to deprive any motorcycle
    of the full use of a lane. Lane splitting is not permitted.
- id: 161
  category: sharing_the_road
  question: 'When a funeral procession is led by a vehicle with flashing amber or
    purple lights, Kansas law requires other drivers to:'
  choices:
    A: Yield the right-of-way to the entire procession.
    B: Only yield to the lead vehicle.
    C: Pass the procession on the right.
    D: Join the procession to get through traffic faster.
  answer: A
  explanation: Under K.S.A. 8-15,107, drivers must yield the right-of-way to any vehicle
    that is part of a funeral procession. Once the lead vehicle has entered an intersection,
    the remaining vehicles in the procession may continue through regardless of traffic
    control devices.
- id: 162
  category: sharing_the_road
  question: What is the minimum following distance you should maintain behind a fire
    apparatus (fire truck) responding to an alarm in Kansas?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: K.S.A. 8-1574 prohibits drivers from following any fire apparatus traveling
    in response to a fire alarm closer than 500 feet.
- id: 163
  category: sharing_the_road
  question: In Kansas, who is required by law to wear a helmet while operating or
    riding a motorcycle?
  choices:
    A: All riders regardless of age.
    B: Only the operator, not the passenger.
    C: Any person under the age of 18.
    D: No one is required to wear a helmet in Kansas.
  answer: C
  explanation: K.S.A. 8-1598 requires that any person under the age of 18 years must
    wear a helmet while operating or riding a motorcycle or motorized bicycle.
- id: 164
  category: sharing_the_road
  question: 'When a large truck is turning right onto a narrow street, it may need
    to:'
  choices:
    A: Stay close to the right curb.
    B: Swing wide to the left before turning right.
    C: Speed up to clear the intersection.
    D: Turn from the left-most lane.
  answer: B
  explanation: Large trucks have a wide turning radius. To clear the curb, they often
    need to swing wide to the left to complete a right turn. Drivers should never
    try to squeeze between a turning truck and the curb.
- id: 165
  category: sharing_the_road
  question: 'According to the Kansas Driving Handbook, if you are following a motorcycle,
    you should:'
  choices:
    A: Follow closer than you would a car to keep them in sight.
    B: Use a 4-second following distance to allow for the motorcycle's ability to
      stop quickly.
    C: Share the lane with the motorcycle if there is room.
    D: Always use your high beams so the rider can see you.
  answer: B
  explanation: Motorcycles can stop much faster than cars. Kansas guidelines suggest
    increasing following distance (at least 3-4 seconds) when behind a motorcycle
    to avoid a rear-end collision if the rider brakes suddenly.
- id: 166
  category: sharing_the_road
  question: 'If you are driving and an emergency vehicle with a siren and flashing
    lights approaches from behind, you must:'
  choices:
    A: Stop exactly where you are.
    B: Speed up to stay ahead of it.
    C: Pull over to the right edge of the road and stop.
    D: Pull over to the left edge of the road and stop.
  answer: C
  explanation: K.S.A. 8-1530 requires drivers to yield to an authorized emergency
    vehicle by pulling as close as possible to the right-hand edge or curb of the
    roadway and stopping until the vehicle has passed.
- id: 167
  category: sharing_the_road
  question: 'In Kansas, bicyclists riding on a roadway at night must be equipped with
    a lamp on the front that emits a white light visible from a distance of at least:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: K.S.A. 8-1592 requires bicycles used at night to have a front lamp
    visible from 500 feet and a red rear reflector visible from 100 to 600 feet.
- id: 168
  category: sharing_the_road
  question: 'When a pedestrian is in an unmarked crosswalk at an intersection in Kansas,
    the driver must:'
  choices:
    A: Yield the right-of-way to the pedestrian.
    B: Honk to warn the pedestrian to stay back.
    C: Only yield if the crosswalk is painted.
    D: Maintain speed as pedestrians must yield to cars between intersections.
  answer: A
  explanation: Under K.S.A. 8-1533, drivers must yield the right-of-way to a pedestrian
    crossing the roadway within any marked or unmarked crosswalk at an intersection.
- id: 169
  category: sharing_the_road
  question: 'Under Kansas law, a ''slow-moving vehicle'' emblem (an orange triangle
    with a red border) must be displayed on the rear of any vehicle designed to operate
    at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: K.S.A. 8-1717 requires the slow-moving vehicle emblem on vehicles designed
    for use at speeds of 25 miles per hour or less, such as farm tractors or horse-drawn
    carriages.
- id: 170
  category: sharing_the_road
  question: In Kansas, when meeting a school bus stopped on a roadway with a median
    or physical barrier, which vehicles are required to stop for the bus's flashing
    red lights?
  choices:
    A: All vehicles traveling in both directions
    B: Only vehicles traveling in the same direction as the bus
    C: Only vehicles traveling in the opposite direction of the bus
    D: No vehicles are required to stop on divided highways
  answer: B
  explanation: According to Kansas Statute 8-1556, if a highway is divided by a median
    or physical barrier, only traffic following the bus must stop. Traffic approaching
    from the opposite direction does not need to stop.
- id: 171
  category: sharing_the_road
  question: Under Kansas law, what is the minimum distance a motorist must maintain
    when overtaking or passing a bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Kansas Statute 8-1516 requires that a driver of a vehicle overtaking
    a bicycle shall pass to the left at a distance of not less than three feet.
- id: 172
  category: sharing_the_road
  question: In Kansas, how much of a lane width is a motorcycle entitled to occupy?
  choices:
    A: The left half of the lane
    B: The right half of the lane
    C: The full width of the lane
    D: One-third of the lane
  answer: C
  explanation: Kansas law treats motorcycles as full-sized vehicles, and they are
    entitled to the full width of the lane. Motorists should never attempt to share
    a lane with a motorcycle.
- id: 173
  category: sharing_the_road
  question: 'When following a large truck, if you cannot see the truck driver''s face
    in their side-view mirrors, you are:'
  choices:
    A: In the driver's blind spot (No-Zone)
    B: At a safe following distance
    C: In the best position to pass
    D: Visible to the truck driver via the rearview mirror
  answer: A
  explanation: The Kansas Driving Handbook states that if you cannot see the driver's
    face in their side-view mirror, the driver cannot see you. You are in one of the
    truck's 'No-Zones' or blind spots.
- id: 174
  category: sharing_the_road
  question: In Kansas, what must a driver do when a pedestrian carrying a white cane
    or using a guide dog is crossing or attempting to cross a street?
  choices:
    A: Honk to let them know you are there
    B: Slow down and proceed with caution
    C: Come to a complete stop and yield the right-of-way
    D: Drive around them if there is enough room
  answer: C
  explanation: Kansas law requires drivers to come to a complete stop and yield the
    right-of-way to any blind pedestrian carrying a white cane or using a guide dog.
- id: 175
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may:'
  choices:
    A: Stay entirely in the right lane
    B: Swing wide to the left to complete the turn
    C: Turn from the left lane only
    D: Stop and wait for all traffic to clear both streets
  answer: B
  explanation: Large trucks often need to swing wide to the left to clear the curb
    when making a right turn. Drivers should avoid 'squeezing' between the truck and
    the curb.
- id: 176
  category: sharing_the_road
  question: When a motorcycle is crossing railroad tracks at an angle, what should
    a following driver expect?
  choices:
    A: The motorcycle to speed up
    B: The motorcycle to maintain a straight line
    C: The motorcycle to swerve to cross the tracks at a right angle
    D: The motorcycle to tip over
  answer: C
  explanation: Motorcyclists may swerve to cross railroad tracks or obstacles at a
    90-degree angle to avoid losing balance. Following drivers should be prepared
    for this maneuver.
- id: 177
  category: sharing_the_road
  question: 'A ''Slow Moving Vehicle'' emblem (an orange triangle with a red border)
    is required on Kansas farm machinery and other vehicles designed to operate at
    speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The slow-moving vehicle emblem is required for all vehicles designed
    to travel at speeds of 25 mph or less on public highways.
- id: 178
  category: sharing_the_road
  question: 'In Kansas, if there are no traffic signals or marked crosswalks at an
    intersection, a driver must:'
  choices:
    A: Yield to pedestrians only if they are in the middle of the road
    B: Yield to pedestrians as there is an 'unmarked' crosswalk at every intersection
    C: Expect pedestrians to yield to vehicles
    D: Only yield to pedestrians during daylight hours
  answer: B
  explanation: Under Kansas law, crosswalks exist at all intersections where sidewalks
    would normally lead across the street, whether they are marked with paint or not.
    Drivers must yield to pedestrians in these unmarked crosswalks.
- id: 179
  category: vehicle_information
  question: According to the Kansas Driving Handbook, when must you use your headlights?
  choices:
    A: Only between the hours of 10:00 PM and 6:00 AM
    B: From sunset to sunrise and whenever visibility is less than 1,000 feet
    C: Only when it is raining or snowing
    D: From one hour after sunset to one hour before sunrise
  answer: B
  explanation: Kansas law requires headlights to be on from sunset to sunrise, and
    at any other time when you cannot see clearly for at least 1,000 feet due to insufficient
    light or unfavorable atmospheric conditions.
- id: 180
  category: vehicle_information
  question: Under Kansas law, what is the minimum percentage of light transmission
    required for window tint on the front side windows?
  choices:
    A: 20%
    B: 25%
    C: 35%
    D: 50%
  answer: C
  explanation: Kansas Statute 8-1749a states that window tinting must allow a total
    light transmission of at least 35% on all windows, including the front side windows.
- id: 181
  category: vehicle_information
  question: 'In Kansas, a vehicle''s horn must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Kansas equipment regulations require every motor vehicle to be equipped
    with a horn capable of emitting sound audible under normal conditions from a distance
    of not less than 200 feet.
- id: 182
  category: vehicle_information
  question: 'According to Kansas safety standards, tires are considered unsafe if
    the tread depth is less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: In Kansas, tires are legally considered unsafe and must be replaced
    if they have less than 2/32 of an inch of tread depth.
- id: 183
  category: vehicle_information
  question: 'Kansas law requires that your vehicle''s rearview mirror must allow you
    to see the highway for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: Kansas equipment laws require a mirror so located as to reflect to
    the driver a view of the highway for a distance of at least 200 feet to the rear
    of the vehicle.
- id: 184
  category: vehicle_information
  question: In Kansas, every motor vehicle must be equipped with how many separate
    braking systems?
  choices:
    A: One system (service brakes only)
    B: Two separate systems (service brakes and a parking brake)
    C: Three systems (service, parking, and emergency air)
    D: No specific number is required as long as the vehicle stops
  answer: B
  explanation: Kansas law requires motor vehicles to have two separate means of applying
    brakes, each of which shall be effective to apply the brakes to at least two wheels
    (typically the service brake and the parking/emergency brake).
- id: 185
  category: vehicle_information
  question: 'Kansas law requires that the rear registration (license) plate must be
    illuminated so that it is legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Kansas regulations specify that either a tail lamp or a separate lamp
    shall be so constructed and placed as to illuminate the rear registration plate
    and render it clearly legible from a distance of 50 feet to the rear.
- id: 186
  category: vehicle_information
  question: If a load extends more than how many feet beyond the rear of the bed or
    body of a vehicle in Kansas, a red flag or light must be displayed?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: According to Kansas law, whenever a load extends 4 feet or more beyond
    the rear of the vehicle, a red flag (day) or red light (night) must be attached
    to the extreme rear of the load.
- id: 187
  category: vehicle_information
  question: Which of the following is TRUE regarding Kansas muffler laws?
  choices:
    A: Muffler cutouts or bypasses are permitted on highways
    B: Vehicles are not required to have mufflers if they are older than 1980
    C: Every vehicle must have a muffler in good working order to prevent excessive
      noise
    D: Loud exhaust systems are legal if the vehicle is used for farming
  answer: C
  explanation: Kansas law requires every vehicle to be equipped with a muffler in
    good working order and in constant operation to prevent excessive or unusual noise.
    Muffler cutouts or similar devices are prohibited.
- id: 188
  category: vehicle_information
  question: 'Under Kansas law, headlights must be used when visibility is less than:'
  choices:
    A: 500 feet
    B: 800 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Kansas law (K.S.A. 8-1703) requires headlights to be on from sunset
    to sunrise and at any time when visibility is less than 1,000 feet due to insufficient
    light or atmospheric conditions.
- id: 189
  category: vehicle_information
  question: 'When approaching an oncoming vehicle in Kansas, you must dim your high
    beam headlights when the vehicle is within:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Kansas law requires drivers to dim their high beams to low beams when
    an oncoming vehicle is within 500 feet.
- id: 190
  category: vehicle_information
  question: What is the minimum legal tire tread depth for passenger vehicles in Kansas?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Kansas Statute 8-1742 states that tires are considered unsafe if the
    tread depth is less than 2/32 of an inch when measured in any two adjacent major
    grooves.
- id: 191
  category: vehicle_information
  question: In Kansas, window tinting on the side and rear windows must allow at least
    what percentage of light transmission?
  choices:
    A: 20%
    B: 25%
    C: 35%
    D: 50%
  answer: C
  explanation: Kansas law (K.S.A. 8-1749a) prohibits the operation of a vehicle with
    window tinting that has a total light transmission of less than 35%.
- id: 192
  category: vehicle_information
  question: 'Kansas law requires vehicles to have at least one mirror so located as
    to reflect to the driver a view of the highway for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: K.S.A. 8-1740 requires that every motor vehicle be equipped with a
    mirror providing a view of the highway for at least 200 feet to the rear.
- id: 193
  category: vehicle_information
  question: Between which dates are studded snow tires permitted for use on Kansas
    roadways?
  choices:
    A: October 1 to March 1
    B: November 1 to April 1
    C: November 15 to March 15
    D: December 1 to March 31
  answer: B
  explanation: Kansas Statute 8-1742 allows the use of studded tires only from November
    1 to April 1.
- id: 194
  category: vehicle_information
  question: Under Kansas law, the service brakes on a passenger vehicle must be capable
    of stopping the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 45 feet
  answer: B
  explanation: K.S.A. 8-1734 requires that the service brakes on a passenger vehicle
    be able to stop the vehicle within 25 feet from a speed of 20 mph on a dry, smooth,
    level road.
- id: 195
  category: vehicle_information
  question: In Kansas, turn signal lamps must be visible from a distance of not less
    than ____ in normal sunlight.
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Kansas law (K.S.A. 8-1721) states that turn signal lamps must be visible
    from a distance of not less than 100 feet both to the front and the rear.
- id: 196
  category: vehicle_information
  question: 'Kansas law requires every motor vehicle to be equipped with a muffler
    in good working order to prevent:'
  choices:
    A: Excessive or unusual noise
    B: Excessive smoke
    C: Both A and B
    D: Neither A nor B
  answer: C
  explanation: K.S.A. 8-1739 requires mufflers to be in constant operation to prevent
    both excessive or unusual noise and annoying smoke.
- id: 197
  category: vehicle_information
  question: 'In Kansas, every motor vehicle must be equipped with at least two tail
    lamps on the rear which emit a red light plainly visible from a distance of:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 800 feet
    D: 1,000 feet
  answer: D
  explanation: According to K.S.A. 8-1706, tail lamps on vehicles manufactured after
    1959 must be visible from a distance of 1,000 feet to the rear.
- id: 198
  category: signs_and_signals
  question: According to the Kansas Driver's Manual, if your vehicle's turn signals
    fail, what is the correct hand signal to indicate a left turn?
  choices:
    A: Extend left arm straight out the window
    B: Extend left arm upward
    C: Extend left arm downward
    D: Wave left arm in a circular motion
  answer: A
  explanation: In Kansas, the hand signal for a left turn is to extend the left arm
    horizontally out of the window.
- id: 199
  category: signs_and_signals
  question: In Kansas, what does a flashing yellow light at an intersection indicate?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: Yield to all traffic, even if you have the right-of-way
  answer: C
  explanation: A flashing yellow light means you should slow down and proceed through
    the intersection with caution, as per the Kansas Driver's Manual.
- id: 200
  category: signs_and_signals
  question: Under Kansas law, how many feet before turning must you activate your
    turn signal in a business or residential district?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: K.S.A. 8-1548 requires a signal of intention to turn to be given continuously
    during not less than the last 100 feet traveled before turning.
- id: 201
  category: signs_and_signals
  question: What does a steady yellow X posted over a lane on a Kansas highway indicate?
  choices:
    A: The lane is for HOV vehicles only
    B: You should prepare to vacate the lane because the signal is about to change
      to a red X
    C: The lane is open for all traffic
    D: The lane is reserved for emergency vehicles
  answer: B
  explanation: A steady yellow X indicates that the driver should prepare to leave
    the lane safely because the signal is about to change to a red X, which means
    the lane is closed.
- id: 202
  category: signs_and_signals
  question: 'In Kansas, a flashing red light at an intersection is treated the same
    as a:'
  choices:
    A: Yield sign
    B: Warning sign
    C: Stop sign
    D: Speed limit sign
  answer: C
  explanation: A flashing red light means you must come to a complete stop and proceed
    only when it is safe to do so, similar to a stop sign.
- id: 203
  category: signs_and_signals
  question: What is the meaning of a fluorescent orange sign in a Kansas roadway?
  choices:
    A: School zone ahead
    B: Public recreation area
    C: Work zone or construction area
    D: Incident management or emergency
  answer: C
  explanation: Orange is the standard color for work zone signs in Kansas, indicating
    construction or maintenance activities.
- id: 204
  category: signs_and_signals
  question: 'When you see a ''Slow Moving Vehicle'' emblem (an orange triangle with
    a red border) on the rear of a vehicle in Kansas, it identifies a vehicle that
    travels at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The slow-moving vehicle emblem is required on vehicles designed to
    travel at speeds of 25 mph or less.
- id: 205
  category: signs_and_signals
  question: 'A solid white line painted across the road at an intersection in Kansas
    is known as a:'
  choices:
    A: Crosswalk line
    B: Stop line
    C: Yield line
    D: Lane divider
  answer: B
  explanation: A solid white line across a lane at an intersection is a stop line,
    indicating where you must stop your vehicle for a stop sign or red light.
- id: 206
  category: signs_and_signals
  question: In Kansas, what do double solid yellow lines in the center of the road
    mean?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: Passing is prohibited in both directions
    D: One-way traffic only
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    traffic moving in either direction.
- id: 207
  category: signs_and_signals
  question: What does a circular yellow sign with a black 'X' and the letters 'RR'
    indicate in Kansas?
  choices:
    A: Road Rage zone
    B: Restricted Roadway
    C: Railroad crossing ahead
    D: Rough Road
  answer: C
  explanation: The circular yellow sign with a black X and RR is a railroad advance
    warning sign.
- id: 208
  category: signs_and_signals
  question: When approaching a roundabout in Kansas, what does a dashed white line
    across the entry lane mean?
  choices:
    A: You have the right-of-way
    B: You must stop before entering
    C: You must yield to traffic already in the roundabout
    D: The lane is closed
  answer: C
  explanation: Dashed white lines at the entrance of a roundabout indicate that you
    must yield to traffic already circulating within the roundabout.
- id: 209
  category: signs_and_signals
  question: What is the correct hand signal to indicate you are stopping or slowing
    down in Kansas?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward with palm facing the rear
    D: Right arm extended straight out
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, extend your
    left arm downward with the palm of your hand facing the rear.
- id: 210
  category: signs_and_signals
  question: In Kansas, what color are 'Service Signs' that provide information about
    gas, food, and lodging?
  choices:
    A: Green
    B: Blue
    C: Brown
    D: Yellow
  answer: B
  explanation: Blue signs are used to provide information about traveler services
    such as fuel, food, lodging, and medical facilities.
- id: 211
  category: signs_and_signals
  question: 'A pennant-shaped sign (isosceles triangle pointing right) found on the
    left side of a Kansas highway indicates:'
  choices:
    A: A school zone
    B: A no-passing zone
    C: A yield requirement
    D: A dead end
  answer: B
  explanation: A pennant-shaped sign is placed on the left side of the road to mark
    the beginning of a no-passing zone.
- id: 212
  category: signs_and_signals
  question: What does a steady green arrow pointing to the left mean at a Kansas intersection?
  choices:
    A: You may turn left after yielding to oncoming traffic
    B: You have a protected turn; oncoming traffic is stopped by a red light
    C: You must stop and wait for a solid green light
    D: The turn is only for emergency vehicles
  answer: B
  explanation: A green arrow means you have a 'protected' turn, meaning oncoming traffic
    is stopped and you may proceed in the direction of the arrow.
- id: 213
  category: signs_and_signals
  question: In Kansas, when using hand signals to indicate a turn, which position
    represents a left turn?
  choices:
    A: Arm extended upward
    B: Arm extended downward
    C: Arm extended horizontally out the window
    D: Arm waved in a circular motion
  answer: C
  explanation: According to the Kansas Driving Handbook, a left turn is signaled by
    extending the left arm and hand horizontally out the window.
- id: 214
  category: signs_and_signals
  question: What does a flashing yellow traffic light mean at a Kansas intersection?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection
    C: Proceed with caution
    D: Yield to all traffic, then turn left
  answer: C
  explanation: A flashing yellow light in Kansas indicates that you should slow down
    and proceed with caution through the intersection.
- id: 215
  category: signs_and_signals
  question: A 'No Passing Zone' sign in Kansas is uniquely shaped and placed. What
    is its shape and location?
  choices:
    A: Diamond shape, placed on the right side of the road
    B: Pennant shape, placed on the left side of the road
    C: Rectangular shape, placed on the right side of the road
    D: Circular shape, placed on the left side of the road
  answer: B
  explanation: In Kansas, the 'No Passing Zone' sign is a pennant-shaped yellow sign
    placed on the left side of the highway to mark the beginning of a zone where passing
    is prohibited.
- id: 216
  category: signs_and_signals
  question: What is the meaning of a pentagon-shaped (five-sided) traffic sign in
    Kansas?
  choices:
    A: Yield right-of-way
    B: Railroad crossing ahead
    C: School zone or school crossing
    D: No passing zone
  answer: C
  explanation: A five-sided (pentagon) sign indicates a school zone or a school crossing.
- id: 217
  category: signs_and_signals
  question: 'A reflective orange triangle with a red border on the rear of a vehicle
    in Kansas indicates:'
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is a slow-moving vehicle (25 mph or less)
    C: The vehicle is an oversized load
    D: The vehicle is a student driver
  answer: B
  explanation: The slow-moving vehicle emblem is a reflective orange triangle used
    on vehicles designed to travel at speeds of 25 mph or less, such as farm machinery.
- id: 218
  category: signs_and_signals
  question: 'When you see a ''Crossbuck'' sign at a railroad crossing in Kansas, you
    should:'
  choices:
    A: Always stop, even if no train is coming
    B: Treat it as a yield sign and be prepared to stop for a train
    C: Speed up to cross the tracks quickly
    D: Ignore it if there are no flashing lights
  answer: B
  explanation: A railroad crossbuck sign is a regulatory sign that should be treated
    as a yield sign; drivers must yield to any approaching trains.
- id: 219
  category: signs_and_signals
  question: What do broken white lines on a Kansas multi-lane highway signify?
  choices:
    A: Traffic is moving in opposite directions
    B: Traffic is moving in the same direction
    C: The edge of the roadway
    D: A pedestrian crosswalk
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction
    where lane changing is permitted.
- id: 220
  category: signs_and_signals
  question: What is the primary purpose of a solid white line painted on the right
    edge of a Kansas highway?
  choices:
    A: To indicate where passing is allowed
    B: To mark the edge of the travel lane (fog line)
    C: To separate traffic moving in opposite directions
    D: To indicate a bicycle lane only
  answer: B
  explanation: Solid white lines along the right side of the road are called edge
    lines or 'fog lines' and help drivers see where the edge of the road is located
    at night or in bad weather.
- id: 221
  category: signs_and_signals
  question: 'A Kansas traffic sign that is diamond-shaped and orange in color is used
    for:'
  choices:
    A: Regulatory information
    B: General warning of hazards
    C: Construction and maintenance work zones
    D: Guide information for travelers
  answer: C
  explanation: Orange diamond-shaped signs are specifically used to warn drivers of
    conditions in construction or maintenance work zones.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 222
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 223
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 224
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 225
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 226
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 227
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
