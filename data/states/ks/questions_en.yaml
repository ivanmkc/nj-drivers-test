metadata:
  source: 2025 Kansas Driving Handbook (ksrevenue.gov)
  total_questions: 484
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
  - vehicle_operation
questions:
- id: 1
  category: safe_driving_rules
  question: According to the Kansas Driving Handbook, what action has the Kansas Legislature
    taken regarding texting while driving?
  choices:
    A: It is allowed only for experienced drivers.
    B: It is prohibited because it dangerously distracts drivers.
    C: It is allowed if using a hands-free device.
    D: It is only prohibited in school zones.
  answer: B
  explanation: The Governor's letter notes that the Kansas Legislature updated driving
    laws to prohibit texting while driving because it can dangerously distract drivers
    from the road.
- id: 2
  category: vehicle_information
  question: Approximately how many miles of roads are there in Kansas, according to
    the handbook's introduction?
  choices:
    A: 50,000 miles
    B: 100,000 miles
    C: 141,000 miles
    D: 200,000 miles
  answer: C
  explanation: The introduction states that Kansas has approximately 141,000 miles
    of roads that keep the state's economy moving.
- id: 3
  category: license_system
  question: What is the official website provided in the handbook for the Kansas Department
    of Revenue to answer questions and access services?
  choices:
    A: ksvehicles.com
    B: kansas.gov/dmv
    C: ksrevenue.gov
    D: ksdriving.org
  answer: C
  explanation: The Governor's letter invites drivers to visit ksrevenue.gov for answers
    to questions and to access Division of Vehicles services.
- id: 4
  category: license_system
  question: Which division within the Kansas Department of Revenue strives to make
    your experience quicker and more convenient?
  choices:
    A: Division of Vehicles
    B: Division of Transportation
    C: Division of Highway Safety
    D: Division of Motorists
  answer: A
  explanation: The letter mentions that the Kansas Department of Revenue strives to
    make your experience with the Division of Vehicles quicker, more user-friendly,
    and convenient.
- id: 5
  category: license_system
  question: What type of driver's manual is this specific handbook?
  choices:
    A: Commercial Driver's Manual
    B: Motorcycle Operator's Manual
    C: Non-Commercial Driver's Manual
    D: Chauffeur's Manual
  answer: C
  explanation: The title page identifies the document specifically as the "Non-Commercial
    Driver's Manual".
- id: 6
  category: alcohol_drugs_health
  question: 'According to the Table of Contents, which of the following topics is
    covered under Section 3: "Be in Shape to Drive"?'
  choices:
    A: Traffic Signals
    B: Fatigue
    C: Child Passenger Safety Laws
    D: Backing
  answer: B
  explanation: The Table of Contents lists "Fatigue" under SECTION 3- Be in Shape
    to Drive.
- id: 7
  category: safe_driving_rules
  question: Based on the Table of Contents, where would you find information on "Child
    Passenger Safety Laws"?
  choices:
    A: Section 1- The Driver's License
    B: Section 3- Be in Shape to Drive
    C: Section 4- Before You Drive
    D: Section 6- Rules of the Road
  answer: C
  explanation: The Table of Contents lists "Child Passenger Safety Laws" under SECTION
    4- Before You Drive.
- id: 8
  category: vehicle_information
  question: 'Which of the following is listed as a topic under Section 5: "Basic Driving"
    in the Table of Contents?'
  choices:
    A: Steering
    B: Air Bags
    C: Aggressive Driving
    D: Right-Of-Way
  answer: A
  explanation: The Table of Contents lists "Steering" as a topic under SECTION 5-
    Basic Driving.
- id: 9
  category: signs_and_signals
  question: According to the Table of Contents, which section covers "Traffic Control
    Devices" and "Pavement Markings"?
  choices:
    A: Section 2
    B: Section 4
    C: Section 5
    D: Section 6
  answer: D
  explanation: '"Traffic Control Devices" and "Pavement Markings" are listed under
    SECTION 6- Rules of the Road.'
- id: 10
  category: penalties_and_points
  question: In which section of the manual can a driver find information regarding
    the "Loss of Driving Privileges"?
  choices:
    A: Section 1- The Driver's License
    B: Section 3- Be in Shape to Drive
    C: Section 5- Basic Driving
    D: Section 6- Rules of the Road
  answer: A
  explanation: The Table of Contents lists "Loss of Driving Privileges" under SECTION
    1- The Driver's License.
- id: 11
  category: alcohol_drugs_health
  question: According to the Table of Contents, the topic "Alcohol, Other Drugs and
    Driving" is grouped with which other topics in Section 3?
  choices:
    A: Starting and Stopping
    B: Vision and Hearing
    C: Traffic Signs and Signals
    D: Air Bags and Safety Belts
  answer: B
  explanation: '"Alcohol, Other Drugs and Driving" is in Section 3, which also includes
    health-related topics like "Vision" and "Hearing".'
- id: 12
  category: sharing_the_road
  question: Based on the Table of Contents, the "Rules for School Buses" are included
    in which section?
  choices:
    A: Section 2- State/Provincial/Territory Laws
    B: Section 4- Before You Drive
    C: Section 5- Basic Driving
    D: Section 6- Rules of the Road
  answer: D
  explanation: The Table of Contents places "Rules for School Buses" under SECTION
    6- Rules of the Road.
- id: 13
  category: driver_responsibility
  question: Why did the Kansas Legislature update driving laws to prohibit texting
    while driving?
  choices:
    A: To increase revenue from traffic tickets
    B: Because a growing number of traffic accidents and deaths have been caused by
      it
    C: To encourage the use of public transportation
    D: Because cell phone networks were becoming overloaded
  answer: B
  explanation: The Governor's letter states that the laws were updated "Because a
    growing number of traffic accidents and deaths have been caused by people sending
    text messages while driving".
- id: 14
  category: driver_testing
  question: According to the introduction, what does the driving test focus on to
    help us all drive safely?
  choices:
    A: Advanced mechanical repair skills
    B: Shared "rules of the road"
    C: Memorization of the state highway map
    D: High-speed evasive maneuvers
  answer: B
  explanation: The introduction states that the driving test "focuses on shared 'rules
    of the road' that help us all drive safely."
- id: 15
  category: license_system
  question: According to the Table of Contents, information about "Real ID" can be
    found immediately following which topic?
  choices:
    A: Age Requirements
    B: Required Documents List
    C: Driver's Education
    D: Appointment Scheduling
  answer: B
  explanation: In the Table of Contents, "Real ID" is listed immediately after the
    "Required Documents List".
- id: 16
  category: license_system
  question: Which of the following documents can be used to add a 'VETERAN' indicator
    to your ID?
  choices:
    A: A valid passport
    B: A DD-214 form
    C: A birth certificate
    D: A social security card
  answer: B
  explanation: According to the manual, if you want a 'VETERAN' indicator, you must
    bring your DD-214, NGB-22, Veterans Affairs ID, or a retired military ID.
- id: 17
  category: license_system
  question: What specific status must be stated on a DD-214 or NGB-22 to qualify for
    a 'VETERAN' indicator?
  choices:
    A: General Discharge
    B: Medical Discharge
    C: Honorable Discharge
    D: Administrative Discharge
  answer: C
  explanation: The manual states that the DD-214 or NGB-22 must state 'Honorable Discharge'
    to qualify for the veteran indicator.
- id: 18
  category: license_system
  question: What is the minimum age requirement to obtain a Commercial Class A, B,
    or C (Interstate) license?
  choices:
    A: 18 years of age
    B: 19 years of age
    C: 20 years of age
    D: 21 years of age
  answer: D
  explanation: The age requirement for a Commercial Class A, B or C (Interstate) license
    is 21 years of age or older.
- id: 19
  category: license_system
  question: How old must you be to obtain a Commercial Class A, B, or C (Intrastate)
    license?
  choices:
    A: 16 years of age
    B: 17 years of age
    C: 18 years of age
    D: 21 years of age
  answer: C
  explanation: The minimum age requirement for a Commercial Class A, B or C (Intrastate)
    license is 18 years of age or older.
- id: 20
  category: license_system
  question: What is the minimum age required to get a Non-Commercial Class A or B
    driver's license?
  choices:
    A: 16 years of age
    B: 17 years of age
    C: 18 years of age
    D: 21 years of age
  answer: C
  explanation: A Non-Commercial Class A or B license requires the applicant to be
    18 years of age or older.
- id: 21
  category: license_system
  question: At what age can a driver obtain a standard Non-Commercial Class C license?
  choices:
    A: 15 years of age
    B: 16 years of age
    C: 17 years of age
    D: 18 years of age
  answer: C
  explanation: The manual states that the age requirement for a Non-Commercial Class
    C license is 17 years of age or older.
- id: 22
  category: license_system
  question: What is the minimum age to be eligible for a Non-Commercial Class C (Restricted)
    license?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 17 years of age
  answer: B
  explanation: A Non-Commercial Class C (Restricted) license requires the applicant
    to be at least 15 years of age.
- id: 23
  category: license_system
  question: How many practice driving hours must be completed to obtain a Non-Commercial
    Class C (Restricted) license at age 15?
  choices:
    A: 10 of the 50 hours
    B: 25 of the 50 hours
    C: 40 of the 50 hours
    D: All 50 hours
  answer: B
  explanation: To get a Non-Commercial Class C (Restricted) license at 15, you must
    have completed 25 of the 50 hours of practice driving.
- id: 24
  category: license_system
  question: When completing required practice driving hours, the accompanying adult
    must be at least what age?
  choices:
    A: 18 years of age
    B: 19 years of age
    C: 21 years of age
    D: 25 years of age
  answer: C
  explanation: The manual specifies that practice driving must be done while accompanied
    by an adult who is 21 years of age or older.
- id: 25
  category: license_system
  question: How many of the 50 required practice driving hours must be completed at
    night for a Non-Commercial Class C or M (Less Restricted Privileges) license?
  choices:
    A: 5 hours
    B: 10 hours
    C: 15 hours
    D: 20 hours
  answer: B
  explanation: For a Less Restricted Privileges license, 10 of the 50 hours of practice
    driving must be completed at night.
- id: 26
  category: license_system
  question: What is the age requirement to obtain a Non-Commercial Class C (Farm Permit)?
  choices:
    A: 13 or 14 years of age
    B: 14 or 15 years of age
    C: 15 or 16 years of age
    D: 16 or 17 years of age
  answer: B
  explanation: The manual states that a Non-Commercial Class C (Farm Permit) is available
    to individuals who are 14 or 15 years of age.
- id: 27
  category: license_system
  question: How old must a person be to obtain a Commercial Instruction Permit (any
    class)?
  choices:
    A: 16 years of age
    B: 17 years of age
    C: 18 years of age
    D: 21 years of age
  answer: C
  explanation: A Commercial Instruction Permit (any class) requires the applicant
    to be 18 years of age or older.
- id: 28
  category: driver_testing
  question: According to the manual, do online or internet Driver's Education courses
    meet the state requirements?
  choices:
    A: Yes, if they are taken by an adult
    B: Yes, if they include a driving simulator
    C: No, internet courses do not meet requirements
    D: Yes, all online courses are approved
  answer: C
  explanation: The manual explicitly states that internet courses do not meet requirements
    for a Driver's Education.
- id: 29
  category: license_system
  question: What is the minimum age required to obtain a Class C or M Instruction
    Permit in Kansas?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 18 years of age
  answer: A
  explanation: According to the manual, the minimum age for a Class C or M Instruction
    Permit is 14 years of age or older.
- id: 30
  category: driver_testing
  question: Will a certificate of completion from an internet-based Driver's Education
    course be accepted for licensure in Kansas?
  choices:
    A: Yes, if it is a state-approved website.
    B: Yes, but only for applicants over 18.
    C: No, internet courses do not meet requirements for a Driver's License in Kansas.
    D: No, unless accompanied by a parent's affidavit.
  answer: C
  explanation: The manual states that internet courses do not meet requirements for
    a Driver's License in Kansas, and a certificate of completion from an Internet
    Driver Education course will not be accepted.
- id: 31
  category: driver_testing
  question: Approved private driver's education schools must offer how many hours
    of instruction?
  choices:
    A: 10 hours of classroom and 4 hours behind-the-wheel
    B: 8 hours of classroom and 6 hours behind-the-wheel
    C: 6 hours of classroom and 8 hours behind-the-wheel
    D: 12 hours of classroom and 6 hours behind-the-wheel
  answer: B
  explanation: Approved private driver's education schools must offer 8 hours of classroom
    instruction and 6 hours of behind-the-wheel instruction.
- id: 32
  category: license_system
  question: How many days do you have to obtain a Kansas Driver's License after moving
    to the state?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: You are required to have a Kansas Driver's License within 90 days of
    moving to Kansas.
- id: 33
  category: license_system
  question: To qualify for a Farm Permit, the applicant must reside or be employed
    on a farm. What is the minimum size requirement for the farm?
  choices:
    A: 10 acres
    B: 20 acres
    C: 40 acres
    D: 50 acres
  answer: B
  explanation: The manual defines a farm for the purpose of a Farm Permit as being
    at least 20 acres used in agricultural operations.
- id: 34
  category: safe_driving_rules
  question: Which of the following is a driving restriction for a 14- or 15-year-old
    with a Farm Permit?
  choices:
    A: They may drive to and from school activities.
    B: They may have up to two non-sibling minor passengers.
    C: They may drive directly to and from home and school for attendance only.
    D: They may use a wireless device for navigation purposes.
  answer: C
  explanation: A 14-15 year old with a Farm Permit may drive directly to and from
    home and school over the most direct route for the purpose of attendance, but
    not for school activities.
- id: 35
  category: driver_testing
  question: Before a 16- or 17-year-old can drive under the lesser restrictions of
    a Farm Permit, a parent or guardian must sign an affidavit attesting to at least
    50 hours of driving time. How many of those hours must be at night?
  choices:
    A: 5 hours
    B: 10 hours
    C: 15 hours
    D: 20 hours
  answer: B
  explanation: The parent/guardian must sign an affidavit attesting to at least 50
    hours of driving time with at least 10 at night before the applicant can drive
    under the lesser restrictions.
- id: 36
  category: license_system
  question: When driving with an Instructional Permit (Class C or M), what are the
    requirements for the supervising adult in the front seat?
  choices:
    A: Must be at least 18 years old with a valid license.
    B: Must be at least 21 years old and have at least one year of driving experience.
    C: Must be a parent or legal guardian.
    D: Must be at least 25 years old.
  answer: B
  explanation: The licensed adult supervising an Instructional Permit holder must
    be at least 21 years old and have at least one-year driving experience.
- id: 37
  category: license_system
  question: How long is a Class C or M Instructional Permit valid before it expires?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 4 years
  answer: B
  explanation: An Instructional Permit (Class C or M) expires in 1 year and may be
    renewed with testing.
- id: 38
  category: driver_testing
  question: How many hours of supervised driving must a 15-year-old applicant complete
    to obtain a Restricted License?
  choices:
    A: 10 hours
    B: 25 hours
    C: 40 hours
    D: 50 hours
  answer: B
  explanation: According to the manual, 15-year-old applicants for a Restricted License
    must have completed 25 hours of supervised driving.
- id: 39
  category: safe_driving_rules
  question: How many non-sibling, minor passengers is a 16-year-old with a Restricted
    License allowed to have in the vehicle?
  choices:
    A: None
    B: Only one
    C: Up to two
    D: As many as there are seatbelts
  answer: B
  explanation: A 16-year-old with a Restricted License is allowed only one, non-sibling,
    minor passenger in the vehicle.
- id: 40
  category: safe_driving_rules
  question: Under what circumstances may a 15-year-old with a Restricted License use
    a wireless communication device while driving?
  choices:
    A: When using a hands-free accessory.
    B: When stopped at a red light.
    C: Only to report illegal activity or summon emergency help.
    D: Never, under any circumstances.
  answer: C
  explanation: Driving restrictions state there are NO wireless communication devices
    allowed while driving except to report illegal activity or summon emergency help.
- id: 41
  category: license_system
  question: Which of the following conditions will disqualify you from obtaining a
    Kansas Driver's License?
  choices:
    A: Having unpaid fines for moving traffic violations.
    B: Being 16 years of age.
    C: Having completed an approved driver education course.
    D: Turning in an identification card previously held.
  answer: A
  explanation: You may obtain a Driver's License if you have no unpaid fines for moving
    traffic violations. Having unpaid fines disqualifies you.
- id: 42
  category: safe_driving_rules
  question: During what hours is a 16-year-old with a Restricted License permitted
    to drive without being accompanied by a licensed adult, for reasons other than
    school, work, or religious activities?
  choices:
    A: From 6 a.m. to 8 p.m.
    B: From 5 a.m. to 9 p.m.
    C: From 7 a.m. to 10 p.m.
    D: From 5 a.m. to 11 p.m.
  answer: B
  explanation: A 16-year-old with a Restricted License may drive at any time from
    5 a.m. to 9 p.m.
- id: 43
  category: alcohol_drugs_health
  question: Which state department coordinates administrative hearings on chemical
    test failures and test refusals?
  choices:
    A: Department of Transportation
    B: Driver Services
    C: Department of Education
    D: Highway Patrol
  answer: B
  explanation: Driver Services coordinates administrative hearings on chemical test
    failures and test refusals and manages proof of insurance requirements.
- id: 44
  category: license_system
  question: What is the minimum age to obtain an Unrestricted Driver's License in
    Kansas?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: B
  explanation: The minimum age to obtain an Unrestricted Driver's License in Kansas
    is 17.
- id: 45
  category: license_system
  question: For applicants under 18 seeking an unrestricted license, how many hours
    of night driving must a parent or guardian attest to?
  choices:
    A: 5 hours
    B: 10 hours
    C: 15 hours
    D: 50 hours
  answer: B
  explanation: A parent or guardian must sign an affidavit attesting to at least 50
    hours of driving time with at least 10 hours at night for applicants who are less
    than 18 years old.
- id: 46
  category: driver_testing
  question: What is the minimum vision requirement to pass the driver's license vision
    screening?
  choices:
    A: 20/20 in both eyes
    B: 20/30 in both eyes
    C: 20/40 in one eye
    D: 20/50 in one eye
  answer: C
  explanation: Vision must be at least 20/40 in one eye when screened at the Driver
    License Station, with or without correction.
- id: 47
  category: driver_testing
  question: How many questions are on the Kansas driver's knowledge test?
  choices:
    A: '20'
    B: '25'
    C: '30'
    D: '50'
  answer: B
  explanation: The knowledge test requires you to answer 25 questions about traffic
    laws and identify certain signs.
- id: 48
  category: driver_testing
  question: If you fail the written or driving test four times, how long must you
    wait before retesting?
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: C
  explanation: After the fourth failure of either test, you must wait a minimum of
    six (6) months from the most recent failed exam before retesting.
- id: 49
  category: driver_testing
  question: What is required if your driver's license has been expired for more than
    one year?
  choices:
    A: You must pay a $50 penalty fee
    B: You must complete a defensive driving course
    C: You must undergo full testing including vision, written, and driving exams
    D: You must wait 6 months before applying for a new license
  answer: C
  explanation: If the driver license has been expired for more than 1-year full testing
    will be required, which includes the vision, written, and driving examinations.
- id: 50
  category: penalties_and_points
  question: Your driving privileges may be suspended if you are convicted of how many
    moving violations within a twelve-month period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: Your driving privileges may be suspended for conviction of three (3)
    moving violations within a twelve-month period.
- id: 51
  category: penalties_and_points
  question: What is the penalty for a first refusal to submit to a chemical test to
    determine alcohol or drug content?
  choices:
    A: A 6-month suspension
    B: A 1-year mandatory suspension
    C: A 2-year mandatory suspension
    D: Permanent revocation
  answer: B
  explanation: Refusing to submit to a chemical test is a mandatory 1-year suspension
    for the 1st refusal.
- id: 52
  category: penalties_and_points
  question: 'Failing to maintain continuous liability insurance on your vehicle will
    result in:'
  choices:
    A: A warning letter
    B: A 30-day suspension
    C: A mandatory indefinite suspension
    D: A permanent revocation
  answer: C
  explanation: Failing to maintain continuous liability insurance on your vehicle
    is a mandatory indefinite suspension.
- id: 53
  category: penalties_and_points
  question: Which of the following convictions will result in the revocation of your
    driving privileges?
  choices:
    A: Transporting an open container of liquor
    B: Failing to report a traffic accident
    C: Failing to appear for a court date
    D: Attempting to elude a police officer
  answer: D
  explanation: Attempting to elude a police officer is listed as an offense that may
    result in your driving privileges being revoked. The other options result in suspension.
- id: 54
  category: penalties_and_points
  question: What will result in a permanent license revocation in Kansas?
  choices:
    A: A third moving violation in 12 months
    B: A fifth test result of .08 or greater or refusal to submit to chemical testing
    C: Failing to maintain liability insurance twice
    D: Transporting an open container of liquor
  answer: B
  explanation: A fifth test result of .08 or greater or refusal to submit to chemical
    testing to determine the alcohol/drug content of blood will result in a permanent
    license revocation.
- id: 55
  category: license_system
  question: 'Foreign tourists, teachers, or businesspeople with valid Immigration
    Documents can drive in Kansas on an existing valid out-of-state or foreign license
    for up to:'
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Aliens (foreign tourists, teachers or businesspeople) who are here
    for up to one year and hold valid Immigration Documents can drive on a valid license
    if they are at least 16.
- id: 56
  category: license_system
  question: What is the maximum gross vehicle weight rating you can operate with a
    Class C Driver's License?
  choices:
    A: Less than 10,000 pounds
    B: Less than 26,001 pounds
    C: More than 26,001 pounds
    D: Any weight regardless of size
  answer: B
  explanation: According to the manual, a Class C Driver's License allows you to operate
    vehicles with a gross vehicle weight rating of less than 26,001 pounds.
- id: 57
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit in any urban
    district in Kansas?
  choices:
    A: 20 miles per hour
    B: 25 miles per hour
    C: 30 miles per hour
    D: 35 miles per hour
  answer: C
  explanation: The manual states that unless otherwise posted, the maximum speed limit
    in towns or cities is thirty (30) miles per hour in any urban district.
- id: 58
  category: safe_driving_rules
  question: What is the maximum speed limit on any County or Township road unless
    otherwise posted?
  choices:
    A: 45 miles per hour
    B: 55 miles per hour
    C: 65 miles per hour
    D: 75 miles per hour
  answer: B
  explanation: The manual sets the maximum speed limit at fifty-five (55) miles per
    hour on any County or Township road, unless otherwise posted.
- id: 59
  category: penalties_and_points
  question: Under Kansas law, seatbelt use is a 'Primary Violation'. What does this
    mean?
  choices:
    A: A vehicle can be stopped solely if an officer sees an unrestrained adult in
      the front seat or an unrestrained child.
    B: You can only be ticketed for a seatbelt violation if you are pulled over for
      speeding first.
    C: Only the driver is required to wear a seatbelt.
    D: Seatbelt violations result in an immediate license suspension.
  answer: A
  explanation: Seatbelt use is a 'Primary Violation' in Kansas, meaning if a law enforcement
    officer sees an unrestrained adult in a front seat or an unrestrained child anywhere
    in the vehicle, the vehicle can be stopped solely for that violation.
- id: 60
  category: safe_driving_rules
  question: At what age must a child be restrained in a federally approved child safety
    seat or booster seat, unless they are taller than 4'9" or weigh more than 80 pounds?
  choices:
    A: Under 4 years of age
    B: 4 to 8 years of age
    C: 8 to 12 years of age
    D: 12 to 16 years of age
  answer: B
  explanation: The manual states that all children 4 to 8 years of age must be restrained
    in a federally approved child safety seat or booster seat unless the child is
    taller than 4'9" OR weighs more than 80 pounds.
- id: 61
  category: safe_driving_rules
  question: How far in advance must you signal your intention to turn or change lanes?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: All signals must be given at least 100 feet before making the actual
    move or turn.
- id: 62
  category: safe_driving_rules
  question: 'You should not make a ''U'' turn anywhere you cannot be seen by other
    drivers for at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: 'The manual states: ''Do not make a U turn on a curve, near the top
    of a hill or anywhere you cannot be seen by other drivers for at least 500 feet.'''
- id: 63
  category: safe_driving_rules
  question: When passing another vehicle on a two-lane road, when is it safe to return
    to the right lane?
  choices:
    A: As soon as you clear the rear bumper of the passed vehicle
    B: When you can see the entire front of the vehicle you have just passed in your
      rearview mirror
    C: After you have traveled 100 feet past the vehicle
    D: When the passed vehicle flashes its headlights
  answer: B
  explanation: The manual instructs drivers not to return to the right lane too soon;
    wait until you can see the entire front of the vehicle you have just passed in
    your rearview mirror.
- id: 64
  category: safe_driving_rules
  question: Which of the following is a situation where you are NOT allowed to pass
    another vehicle?
  choices:
    A: On a one-way street
    B: Within 100 feet of crossing any intersection or railroad grade crossing
    C: When the vehicle ahead is traveling below the speed limit
    D: On a multi-lane highway moving in the same direction
  answer: B
  explanation: You may not pass within 100 feet of crossing any intersection or railroad
    grade crossing.
- id: 65
  category: signs_and_signals
  question: What shape is the 'No Passing Zone' warning sign?
  choices:
    A: Diamond
    B: Octagon
    C: Pennant
    D: Rectangle
  answer: C
  explanation: The manual states that the 'No Passing Zone' is the only pennant-shaped
    warning sign.
- id: 66
  category: defensive_driving
  question: What following distance rule should you use under adverse weather conditions?
  choices:
    A: The two-second rule
    B: The three-second rule
    C: The four-second rule
    D: The six-second rule
  answer: C
  explanation: While the two-second rule is for prime conditions, the manual states
    to use a four-second following rule under adverse conditions.
- id: 67
  category: sharing_the_road
  question: What must you do when an emergency vehicle approaches from behind displaying
    flashing red lights and/or sounding a siren?
  choices:
    A: Speed up to stay ahead of the vehicle
    B: Stop immediately in your current lane
    C: Immediately drive to the right and stop without blocking any intersection
    D: Move to the left lane and slow down
  answer: C
  explanation: When an emergency vehicle is coming toward you or approaches from behind
    displaying flashing red lights and/or sounding a siren, you must immediately drive
    to the right and stop without blocking any intersection.
- id: 68
  category: sharing_the_road
  question: When are you NOT required to stop for a school bus that is stopped to
    pick up or let off children?
  choices:
    A: When you are traveling in the same direction as the bus
    B: When you are approaching the bus in the opposing roadway of a divided highway
    C: When you are on a two-lane road
    D: When the bus is stopped in a residential district
  answer: B
  explanation: Traffic approaching a school bus in the opposing roadway of a divided
    highway is not required to stop.
- id: 69
  category: safe_driving_rules
  question: When two vehicles enter an intersection from different roadways at approximately
    the same time with no traffic controls, who has the right-of-way?
  choices:
    A: The driver on the right shall yield to the vehicle on the left
    B: The driver on the left shall yield to the vehicle on the right
    C: The vehicle traveling faster has the right-of-way
    D: The larger vehicle has the right-of-way
  answer: B
  explanation: When two vehicles enter an intersection from different roadways at
    approximately the same time, the driver on the left shall yield the right-of-way
    to the vehicle on the right.
- id: 70
  category: safe_driving_rules
  question: 'Kansas'' basic speed law requires that you:'
  choices:
    A: Always drive at the posted speed limit regardless of weather
    B: Never drive at a speed greater than is reasonable and prudent under the conditions
      then existing
    C: Drive 5 mph below the speed limit at night
    D: Match the speed of the vehicles around you
  answer: B
  explanation: Kansas' basic speed law requires that you never drive a vehicle at
    a speed greater than is reasonable and prudent under the conditions then existing.
- id: 71
  category: safe_driving_rules
  question: If you approach a stationary emergency vehicle with flashing lights on
    a multi-lane highway, what is the preferred action?
  choices:
    A: Honk your horn to alert the emergency workers
    B: Stop immediately in your current lane
    C: Move to a lane that is not next to the stopped emergency vehicle
    D: Maintain your speed and stay in the lane next to the vehicle
  answer: C
  explanation: When approaching a stationary emergency vehicle from the rear on a
    street or highway with two or more lanes in each direction, you must proceed with
    due caution and move to a lane that is not next to the stopped emergency vehicle.
- id: 72
  category: safe_driving_rules
  question: If a vehicle turning left and a vehicle going straight enter an intersection
    from opposite directions at the same time, who must yield?
  choices:
    A: The vehicle going straight
    B: The vehicle turning left
    C: The vehicle on the right
    D: Neither vehicle
  answer: B
  explanation: The driver of a vehicle turning left must yield the right-of-way to
    vehicles approaching from the opposite direction. If both cars enter at the same
    time, the car going straight through has the right-of-way.
- id: 73
  category: safe_driving_rules
  question: You are facing a green light at an intersection, but traffic is backed
    up and there is not enough room for your vehicle on the other side. What should
    you do?
  choices:
    A: Enter the intersection and wait for traffic to clear
    B: Honk your horn until the traffic moves forward
    C: Do not enter the intersection until there is sufficient space on the other
      side
    D: Proceed into the crosswalk and wait
  answer: C
  explanation: 'The manual explicitly states: "Do not enter an intersection, crosswalk,
    or RR crossing unless there is sufficient space on the other side for your vehicle.
    Even though you may have a green light, you may not enter an intersection if there
    isn’t room to get all the way across."'
- id: 74
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when parking near a fire
    hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: Parking is NOT allowed within 15 feet of a fire hydrant.
- id: 75
  category: safe_driving_rules
  question: It is illegal to park within how many feet of the nearest rail at a railroad
    crossing?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: D
  explanation: Parking is NOT allowed within 50 feet of the nearest rail at railroad
    crossings.
- id: 76
  category: safe_driving_rules
  question: 'When parking parallel to a curb, your vehicle cannot be parked more than:'
  choices:
    A: 6 inches from the curb
    B: 12 inches from the curb
    C: 18 inches from the curb
    D: 24 inches from the curb
  answer: B
  explanation: Parking is NOT allowed more than 12” (12 inches) from a curb.
- id: 77
  category: driver_responsibility
  question: Under Kansas law, which of the following actions is legally permitted
    while driving?
  choices:
    A: Sending a text message
    B: Reading an email
    C: Writing a text message
    D: Using a GPS device
  answer: D
  explanation: Kansas law prohibits the use of any electronic device to "write, send,
    or read" a written communication while driving, but it explicitly does not include
    GPS devices or weather reports.
- id: 78
  category: defensive_driving
  question: When confronted by an aggressive driver, why should you avoid making eye
    contact?
  choices:
    A: It can sometimes anger an aggressive driver
    B: It is illegal in Kansas
    C: It will distract you from looking at your speedometer
    D: It encourages them to pass you on the right
  answer: A
  explanation: The manual advises to avoid eye contact because "Eye contact can sometimes
    anger an aggressive driver."
- id: 79
  category: driver_testing
  question: To pass the Kansas vision test for a driver's license, you must have at
    least what visual acuity in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: The vision test measures that you have at least 20/40 vision in at
    least one eye, with or without corrective lenses.
- id: 80
  category: safe_driving_rules
  question: Why should you avoid using dark or tinted corrective lenses when driving
    at night?
  choices:
    A: They are illegal to wear at any time
    B: They cut down the light that you need to see clearly
    C: They magnify the glare from oncoming headlights
    D: They cause eye fatigue faster than clear lenses
  answer: B
  explanation: You should avoid using dark or tinted corrective lenses at night because
    they "cut down the light that you need to see clearly under night driving conditions."
- id: 81
  category: defensive_driving
  question: How can your sense of hearing help you while driving?
  choices:
    A: It helps you determine the exact speed of oncoming vehicles
    B: A sudden change in the hum of tires can indicate a change in the road surface
    C: It allows you to hear weather reports without a radio
    D: It prevents you from experiencing driver fatigue
  answer: B
  explanation: The manual notes that a "sudden change in the hum of tires on pavement
    can tell you the road surface or the tires have changed."
- id: 82
  category: driver_responsibility
  question: To prevent fatigue during long trips, how often should you schedule proper
    breaks?
  choices:
    A: Every 50 miles or 1 hour
    B: Every 100 miles or 2 hours
    C: Every 200 miles or 4 hours
    D: Only when you start to drift from your lane
  answer: B
  explanation: Before a trip, you should schedule proper breaks—about every 100 miles
    or 2 hours during long trips.
- id: 83
  category: driver_responsibility
  question: If you need to take a nap to combat driving fatigue, what is the recommended
    duration?
  choices:
    A: 5 to 10 minutes
    B: 15 to 20 minutes
    C: 45 to 60 minutes
    D: At least 2 hours
  answer: B
  explanation: The manual recommends finding a safe parking area to take a 15 to 20-minute
    nap to prevent a fatigue-related crash.
- id: 84
  category: safe_driving_rules
  question: What is the best way to prevent fatigue while driving?
  choices:
    A: Drinking two cups of coffee
    B: Getting adequate sleep
    C: Taking a cold shower
    D: Driving between midnight and 6 a.m.
  answer: B
  explanation: According to the manual, the best way to prevent fatigue is sleep.
- id: 85
  category: defensive_driving
  question: Which of the following is considered a possible distraction occurring
    outside a moving vehicle?
  choices:
    A: Adjusting the climate controls
    B: Attending to children or pets
    C: Reading billboards or other road advertisements
    D: Using a global positioning system (GPS)
  answer: C
  explanation: The manual lists reading billboards or other road advertisements as
    a possible distraction that could occur outside a moving vehicle.
- id: 86
  category: driver_responsibility
  question: If you need to look at a map while driving, what should you do?
  choices:
    A: Ask a passenger in another vehicle for directions
    B: Stop in a safe parking area
    C: Hold the map up to the steering wheel
    D: Glance at it quickly while maintaining your speed
  answer: B
  explanation: 'The manual states: ''If you need to look at a map while driving, stop
    in a safe parking area.'''
- id: 87
  category: defensive_driving
  question: How can you prevent yourself from becoming an aggressive driver?
  choices:
    A: Drive slightly above the speed limit to reduce travel time
    B: Relax, concentrate on driving, and be realistic about your travel time
    C: Follow other vehicles closely to encourage them to speed up
    D: Use rude gestures to communicate with frustrating drivers
  answer: B
  explanation: To prevent becoming an aggressive driver, the manual advises to relax,
    concentrate on driving, drive the posted speed limit, be realistic about travel
    time, and be courteous.
- id: 88
  category: alcohol_drugs_health
  question: Alcohol and other impairing drugs are involved in approximately what percentage
    of all fatal crashes?
  choices:
    A: 10%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: The manual states that alcohol and other impairing drugs are involved
    in approximately 40% of all fatal crashes.
- id: 89
  category: alcohol_drugs_health
  question: At what Blood Alcohol Concentration (BAC) is vision impacted for all drivers?
  choices:
    A: '.02'
    B: '.04'
    C: '.06'
    D: '.08'
  answer: A
  explanation: According to the manual, vision is impacted at .02 BAC for all drivers.
- id: 90
  category: alcohol_drugs_health
  question: What is the only medically proven method to remove alcohol or other drug
    combinations from the circulatory system?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Breathing fresh air
    D: Time
  answer: D
  explanation: Time is the only medically proven method to remove alcohol or other
    drug combinations from the circulatory system. Coffee, fresh air, and cold showers
    will not help.
- id: 91
  category: alcohol_drugs_health
  question: How long does it take for the body to get rid of one normal drink from
    the circulatory system?
  choices:
    A: About 30 minutes
    B: About one hour
    C: About two hours
    D: About four hours
  answer: B
  explanation: It takes about an hour for the body to get rid of one normal drink
    from the circulatory system.
- id: 92
  category: penalties_and_points
  question: 'In Kansas, if you are under 21, you can be arrested for alcohol impairment
    at a BAC of:'
  choices:
    A: .00%
    B: .02%
    C: .05%
    D: .08%
  answer: B
  explanation: In Kansas, if you are under 21, you can be arrested for alcohol impairment
    at .02%.
- id: 93
  category: penalties_and_points
  question: What is the penalty for refusing to take a BAC test under the Kansas implied
    consent law?
  choices:
    A: A $500 fine
    B: 100 hours of community service
    C: Loss of your Driver's License for one year
    D: 48 hours in jail
  answer: C
  explanation: Under the Kansas implied consent law, you can lose your Driver's License
    for one year if you refuse to take a BAC test.
- id: 94
  category: penalties_and_points
  question: Which of the following is a potential penalty for a first conviction of
    an alcohol violation?
  choices:
    A: A fine of $200 to $400
    B: A minimum of 48 hours in jail or 100 hours of community service
    C: Permanent revocation of your driver's license
    D: Confiscation of your vehicle
  answer: B
  explanation: For a first conviction of an alcohol violation, you could be sentenced
    to a minimum of 48 hours in jail or 100 hours of community service, along with
    fines and license suspension.
- id: 95
  category: driver_responsibility
  question: Who is completely and solely responsible for operating a vehicle in a
    safe manner and controlling everything that occurs within it?
  choices:
    A: The passengers
    B: The driver
    C: The vehicle manufacturer
    D: Law enforcement
  answer: B
  explanation: 'The manual states: ''You are completely and solely responsible for
    operating your vehicle in a safe manner. This includes the responsibility for
    controlling everything that occurs within the vehicle as well.'''
- id: 96
  category: safe_driving_rules
  question: 'To help prevent fatigue when driving at night, you should try to avoid
    driving between the hours of:'
  choices:
    A: 8 p.m. and midnight
    B: Midnight and 6 a.m.
    C: 6 a.m. and 10 a.m.
    D: 4 p.m. and 8 p.m.
  answer: B
  explanation: The manual recommends trying not to drive late at night between the
    hours of midnight and 6 a.m. to prevent fatigue.
- id: 97
  category: alcohol_drugs_health
  question: How does alcohol affect your ability to distinguish colors while driving?
  choices:
    A: It enhances your ability to see bright colors like red and yellow
    B: It has no effect on color distinction
    C: It reduces your ability to distinguish colors, making it harder to read traffic
      signs
    D: It causes temporary color blindness to the color green
  answer: C
  explanation: Alcohol and other impairing drugs reduce your ability to distinguish
    colors, which can be very dangerous when trying to read traffic signs, signals,
    and roadway markings.
- id: 98
  category: penalties_and_points
  question: 'If you are found to have a BAC of .08 or higher, your driver''s license
    and driving privileges may be suspended for:'
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: If you have a BAC of .08 or more, your driver's license and driving
    privileges may be suspended for 30 days.
- id: 99
  category: alcohol_drugs_health
  question: What is a potential effect of taking over-the-counter diet pills or 'uppers'
    before driving?
  choices:
    A: They improve your concentration and reflexes.
    B: They can make you feel nervous, dizzy, and unable to concentrate.
    C: They safely decrease your reaction time.
    D: They have no effect on your driving ability.
  answer: B
  explanation: The manual states that pep pills, 'uppers' and diet pills can make
    you feel nervous, dizzy, unable to concentrate, and they can affect your vision.
- id: 100
  category: penalties_and_points
  question: What is a possible penalty for a first conviction of driving under the
    influence of illegal drugs in Kansas?
  choices:
    A: A fine of $500 and a written warning.
    B: A fine of $750 - $1000, a minimum of 48 hours in jail or 100 hours of community
      service, and license suspension.
    C: A mandatory 30-day jail sentence and a $2000 fine.
    D: Permanent revocation of your driver's license.
  answer: B
  explanation: For a first conviction of a drug-related charge of driving under the
    influence, you may be fined $750 - $1000 plus court costs, sentenced to a minimum
    of 48 hours in jail or 100 hours of community service, and your license will be
    suspended.
- id: 101
  category: alcohol_drugs_health
  question: Why should you never drink alcohol while taking other drugs?
  choices:
    A: It will cancel out the effects of the medication.
    B: The drugs could multiply the effects of alcohol or have additional effects
      of their own.
    C: It will only affect your driving if you take prescription drugs, not over-the-counter
      drugs.
    D: It artificially lowers your blood alcohol concentration (BAC).
  answer: B
  explanation: The manual warns to never drink alcohol while taking other drugs because
    these drugs could multiply the effects of alcohol or have additional effects of
    their own, reducing your ability to be a safe driver.
- id: 102
  category: driver_responsibility
  question: According to the manual, how should you handle driving if you are angry
    or excited?
  choices:
    A: Drive slightly faster to reach your destination and relax.
    B: Listen to loud music to drown out your thoughts.
    C: Give yourself time to cool off, taking a short walk or nap if necessary, and
      stay off the road until calm.
    D: Roll down the windows to get fresh air while driving.
  answer: C
  explanation: If you are angry or excited, the manual advises giving yourself time
    to cool off. If necessary, take a short walk or nap, but stay off the road until
    you have calmed down.
- id: 103
  category: safe_driving_rules
  question: What is the recommended distance between your body and the bottom of the
    steering wheel?
  choices:
    A: 5 inches
    B: 10 inches
    C: 12 inches
    D: 15 inches
  answer: B
  explanation: When adjusting your seat, there should be 10 inches between your body
    and the bottom of the steering wheel.
- id: 104
  category: vehicle_information
  question: How should your head restraints be adjusted to help prevent whiplash?
  choices:
    A: So the restraint contacts the back of your neck, below the ears.
    B: So the restraint contacts the back of your head and not below the level of
      your ears.
    C: So there is at least a 3-inch gap between your head and the restraint.
    D: So the top of the restraint is level with the top of your shoulders.
  answer: B
  explanation: To help prevent whiplash, head restraints should be adjusted so they
    contact the back of your head and not below the level of your ears.
- id: 105
  category: vehicle_information
  question: When using the enhanced mirror settings, how much additional viewing area
    is added to each side of the vehicle?
  choices:
    A: 5 to 10 degrees
    B: 12 to 16 degrees
    C: 20 to 25 degrees
    D: 30 to 45 degrees
  answer: B
  explanation: The enhanced mirror adjustment adds 12 to 16 degrees of additional
    viewing area to each side of the vehicle.
- id: 106
  category: safe_driving_rules
  question: In Kansas, who is legally required to wear a safety belt in the front
    seat of a vehicle?
  choices:
    A: Only the driver
    B: Only passengers under the age of 18
    C: The driver and all front-seat passengers
    D: Only the driver, if traveling over 40 mph
  answer: C
  explanation: In Kansas, it is illegal to drive or to be a front-seat passenger without
    wearing safety belts (K.S.A. 8-2503).
- id: 107
  category: safe_driving_rules
  question: According to the manual, where do more than half of the crashes that cause
    injury or death occur?
  choices:
    A: On interstate highways at speeds over 65 mph
    B: At speeds less than 40 mph and within 25 miles from home
    C: During long road trips outside of the driver's home state
    D: In rural areas at night
  answer: B
  explanation: More than half of the crashes that cause injury or death happen at
    speeds less than 40 mph and within 25 miles from home.
- id: 108
  category: vehicle_information
  question: How should a shoulder harness safety belt be worn?
  choices:
    A: Tucked under the arm for comfort
    B: Behind the back if it rubs against the neck
    C: Across the shoulder and chest with minimal if any slack
    D: Loosely across the chest to allow for movement
  answer: C
  explanation: A shoulder harness is worn across the shoulder and chest with minimal
    if any slack. It should not be worn under the arm or behind the back.
- id: 109
  category: alcohol_drugs_health
  question: 'Studies have shown that people who use marijuana before driving:'
  choices:
    A: Have faster reaction times but poorer judgment.
    B: Make more mistakes and have more trouble adjusting to glare.
    C: Are less likely to be arrested for traffic violations.
    D: Drive more cautiously and safely.
  answer: B
  explanation: Studies have shown that people who use marijuana make more mistakes,
    have more trouble adjusting to glare, and get arrested for traffic violations
    more than other drivers.
- id: 110
  category: defensive_driving
  question: If you are driving and need to use your cell phone, what is the best course
    of action?
  choices:
    A: Stop in a safe parking area and then make the call.
    B: Carefully use your cell phone, but do not talk for a long time.
    C: Hold the phone between your shoulder and ear to keep hands on the wheel.
    D: Slow down to 15 mph while making the call.
  answer: A
  explanation: The 'Test Your Knowledge' section indicates that if you need to use
    your cell phone, it is best to stop in a safe parking area and then make the call.
- id: 111
  category: vehicle_information
  question: When adjusting your steering wheel, what is the proper height?
  choices:
    A: The top of the wheel should be level with your eyes.
    B: The top of the wheel should be no higher than the top of your shoulders and
      below the chin level.
    C: The bottom of the wheel should rest lightly on your lap.
    D: The wheel should be positioned as high as possible to allow leg room.
  answer: B
  explanation: The manual states that the top of the steering wheel should be no higher
    than the top of your shoulders and below the chin level.
- id: 112
  category: vehicle_information
  question: What is the primary purpose of adjusting your rearview mirror?
  choices:
    A: To see the left and right blind spots.
    B: To monitor passengers in the back seat.
    C: To frame the rear window so you can see traffic flow to the rear.
    D: To view the rear fender of the vehicle.
  answer: C
  explanation: You should adjust your rearview mirror so that it frames the rear window,
    allowing you to see traffic flow to the rear of the vehicle.
- id: 113
  category: vehicle_information
  question: How should a shoulder harness be worn to prevent serious internal injuries
    in a crash?
  choices:
    A: Tucked under the arm for comfort.
    B: Behind the back if it rubs against the neck.
    C: Across the shoulder and chest with minimal if any slack.
    D: Loosely across the chest to allow free movement.
  answer: C
  explanation: A shoulder harness is worn across the shoulder and chest with minimal
    if any slack. It should not be worn under the arm or behind the back, as this
    could cause serious internal injuries in a crash.
- id: 114
  category: vehicle_information
  question: If your vehicle has an automatic shoulder belt, what else must you do
    to be properly restrained?
  choices:
    A: Disconnect it if you are driving at low speeds.
    B: Be sure to buckle your lap belt as well.
    C: Adjust it so it lies high across your stomach.
    D: Avoid using it if the vehicle has airbags.
  answer: B
  explanation: If you have an automatic shoulder belt, be sure to buckle your lap
    belt as well. Otherwise, in a collision you could slide out of the belt and be
    hurt or killed.
- id: 115
  category: safe_driving_rules
  question: Why must you wear a safety belt even if your vehicle is equipped with
    air bags?
  choices:
    A: Air bags do not protect you if you are hit from the side or rear, or if the
      vehicle rolls over.
    B: Air bags are only effective at speeds above 50 mph.
    C: Air bags will not deploy unless the safety belt is buckled.
    D: Air bags increase the risk of being thrown from the vehicle.
  answer: A
  explanation: Safety belts should be worn even if the vehicle is equipped with air
    bags because air bags do not protect you if you are hit from the side or rear
    or if the vehicle rolls over, nor will they keep you behind the wheel.
- id: 116
  category: driver_responsibility
  question: According to the law, children under what age must be secured in the rear
    seat and wear appropriate safety restraints?
  choices:
    A: Under the age of 8
    B: Under the age of 10
    C: Under the age of 12
    D: Under the age of 14
  answer: D
  explanation: The law requires that all children under the age of 14 must be secured
    in the rear seat and wear appropriate safety restraints while the vehicle is in
    motion.
- id: 117
  category: safe_driving_rules
  question: To help prevent injury from an air bag deployment, how much distance should
    be between the center of your chest and the center of the steering wheel?
  choices:
    A: At least 5 inches
    B: At least 10 inches
    C: At least 15 inches
    D: At least 20 inches
  answer: B
  explanation: In most vehicles, you should adjust your seat so at least 10 inches
    is between the center of your chest and the center of the steering wheel.
- id: 118
  category: driver_responsibility
  question: What is the proper child passenger safety requirement for an infant from
    birth to at least age one, and until they are at least 20 pounds?
  choices:
    A: A forward-facing child safety seat in the front seat.
    B: A forward-facing child safety seat in the back seat.
    C: A rear-facing infant seat in the back seat.
    D: A booster seat in the back seat.
  answer: C
  explanation: Infants from birth to at least age one, and until they are at least
    20 pounds should ride in the back seat in a properly installed, rear-facing infant
    seat.
- id: 119
  category: driver_responsibility
  question: 'A child between the ages of 4 and 8, who is no more than 4 feet 9 inches
    tall, should ride in:'
  choices:
    A: A rear-facing infant seat.
    B: A forward-facing child safety seat.
    C: A properly installed booster seat in the back seat.
    D: An adult safety belt in the front seat.
  answer: C
  explanation: Children between the ages of 4 and 8, who are no more than 4 feet 9
    inches tall, should ride in the back seat in a properly installed booster seat.
- id: 120
  category: safe_driving_rules
  question: Where should children age 12 and under sit in a vehicle to avoid injury
    from an air bag in the event of a crash?
  choices:
    A: In the front passenger seat with the seat pushed all the way back.
    B: In the rear seat of the vehicle.
    C: In the front seat, provided they are wearing a seatbelt.
    D: In the driver's lap.
  answer: B
  explanation: Children age 12 and under should sit in the rear seat of the vehicle
    to avoid injury from an air bag in the event of a crash.
- id: 121
  category: vehicle_information
  question: When accelerating a vehicle with a manual transmission, what will happen
    if you release the clutch suddenly?
  choices:
    A: The vehicle will smoothly increase in speed.
    B: The vehicle will jerk forward, and the engine may stall.
    C: The drive wheels will lock up and skid.
    D: The parking brake will automatically engage.
  answer: B
  explanation: If you release the clutch suddenly, the vehicle will jerk forward,
    and the engine may stall.
- id: 122
  category: defensive_driving
  question: What should you do if your drive wheels begin to spin when accelerating
    on a slippery surface?
  choices:
    A: Press harder on the accelerator to gain traction.
    B: Shift into a higher gear immediately.
    C: Take your foot off the accelerator.
    D: Pump the brakes rapidly.
  answer: C
  explanation: If you use too much power, the drive wheels may spin, and you could
    lose control. If the drive wheels begin to spin, take your foot off the accelerator.
- id: 123
  category: vehicle_information
  question: When backing up your vehicle, which direction should you turn the steering
    wheel?
  choices:
    A: In the opposite direction you want the vehicle to move.
    B: In the direction you want the vehicle to move.
    C: Keep the wheel straight and use the mirrors to guide you.
    D: Turn the wheel left to go right, and right to go left.
  answer: B
  explanation: The steering wheel is always turned in the direction you want the vehicle
    to move, whether moving forward or in reverse.
- id: 124
  category: safe_driving_rules
  question: What is the correct hand position on the steering wheel?
  choices:
    A: Both hands on the inside of the steering wheel rim.
    B: One hand at the top of the wheel and one at the bottom.
    C: Both hands on the outside of the steering wheel on opposite sides.
    D: Palms gripping the wheel tightly with thumbs tucked under the rim.
  answer: C
  explanation: Both hands should be placed on the outside of the steering wheel on
    opposite sides. Your grip should be firm but gentle, using your fingers instead
    of your palms, and you should never turn the wheel while gripping it from the
    inside of the rim.
- id: 125
  category: vehicle_information
  question: Why are air bags not helpful during a secondary collision?
  choices:
    A: They are designed to remain inflated for several minutes.
    B: They deploy only once and deflate quickly after impact.
    C: They only deploy when the vehicle is hit from the rear.
    D: They automatically disable the vehicle's seatbelts.
  answer: B
  explanation: Since air bags deploy only once and deflate quickly after impact, they
    will not be helpful during a secondary collision.
- id: 126
  category: safe_driving_rules
  question: How can you direct the air bag at your chest instead of your face?
  choices:
    A: Lean forward as close to the steering wheel as possible.
    B: Raise your seat or use a cushion and/or adjust the steering wheel downward.
    C: Adjust the steering wheel upward toward your head.
    D: Recline your seat all the way back.
  answer: B
  explanation: To direct the air bag at your chest instead of your face, raise your
    seat or use a cushion and/or adjust the steering wheel downward.
- id: 127
  category: vehicle_information
  question: How should you properly grip the steering wheel while driving?
  choices:
    A: With your palms and thumbs wrapped around the inside of the rim
    B: Using your fingers with your thumbs up along the face of the steering wheel
    C: With your hands placed firmly at the 12 o'clock position
    D: Gripping tightly from the inside of the steering wheel rim
  answer: B
  explanation: The manual states to use your fingers instead of the palms of your
    hands and keep your thumbs up along the face of the steering wheel. You should
    never turn the wheel while gripping it from the inside of the rim.
- id: 128
  category: safe_driving_rules
  question: Where should your hands be placed on the steering wheel when using hand-to-hand
    (push/pull) steering?
  choices:
    A: Left hand between 10 and 11 o'clock, right hand between 1 and 2 o'clock
    B: Left hand between 9 and 10 o'clock, right hand between 2 and 3 o'clock
    C: Left hand between 7 and 8 o'clock, right hand between 4 and 5 o'clock
    D: Left hand between 8 and 9 o'clock, right hand between 3 and 4 o'clock
  answer: C
  explanation: When using hand-to-hand steering, your left hand grasps the wheel between
    7 and 8 o'clock and your right hand grasps the wheel between 4 and 5 o'clock.
- id: 129
  category: vehicle_information
  question: Why is the 2 and 10 o'clock hand position no longer recommended for steering?
  choices:
    A: It causes the driver to fatigue more quickly
    B: It makes it difficult to reach the turn signals
    C: It can be dangerous in vehicles equipped with driver side air bags
    D: It reduces the turning radius of modern vehicles
  answer: C
  explanation: The manual notes that the 2 and 10 o'clock position is not recommended
    because it can be dangerous in vehicles equipped with air bags.
- id: 130
  category: vehicle_information
  question: In which of the following situations should you use hand-over-hand steering?
  choices:
    A: When driving forward at highway speeds above 55 mph
    B: When turning the wheel at low speeds, such as when parking
    C: When making evasive maneuvers to avoid a hazard
    D: When backing up in a straight line
  answer: B
  explanation: You should use hand-over-hand steering when turning the wheel at low
    speeds, such as at an intersection or when parking the vehicle.
- id: 131
  category: defensive_driving
  question: When taking evasive action to avoid a hazard, why is it critical to limit
    steering input to no more than 180 degrees?
  choices:
    A: To prevent the engine from stalling
    B: To avoid locking the anti-lock brakes
    C: To prevent the steering wheel from locking in place
    D: To prevent traction loss and crossing into oncoming traffic
  answer: D
  explanation: It is critical to limit steering to not more than 180 degrees because
    using more input causes traction loss, and often the vehicle moves across the
    roadway into the path of oncoming vehicles.
- id: 132
  category: safe_driving_rules
  question: When is the only time it is recommended to use one-hand steering with
    your hand at the 12 o'clock position?
  choices:
    A: When driving on a straight, empty highway
    B: When backing a vehicle to the left or right while turning in the seat to see
    C: When operating the windshield wipers or headlights
    D: When making a sharp U-turn at an intersection
  answer: B
  explanation: The only time that 12 o'clock is recommended is when backing a vehicle
    to the left or right and the driver must turn in the seat in order to see the
    path of travel to the rear.
- id: 133
  category: safe_driving_rules
  question: What is the first thing you should do before backing up your vehicle?
  choices:
    A: Shift into reverse and accelerate quickly
    B: Honk your horn to warn pedestrians
    C: Check behind your vehicle before you get in
    D: Adjust your rearview mirror to see the ground directly behind your bumper
  answer: C
  explanation: Before backing your vehicle, you must check behind your vehicle before
    you get in, because children or small objects cannot be seen from the driver's
    seat.
- id: 134
  category: safe_driving_rules
  question: Which of the following statements about right-of-way laws is true?
  choices:
    A: The law gives the right-of-way to the largest vehicle at an intersection
    B: The law states who must yield the right-of-way, but does not give anyone the
      right-of-way
    C: The law gives pedestrians the right-of-way only when they are in a marked crosswalk
    D: The law automatically gives the right-of-way to vehicles turning left
  answer: B
  explanation: 'The manual states: "The law says who must yield the right-of-way to
    another roadway user; it does not give anyone the right-of-way."'
- id: 135
  category: sharing_the_road
  question: When crossing a sidewalk to enter or exit a driveway or alley, what must
    you do?
  choices:
    A: Honk your horn to warn pedestrians to clear the sidewalk
    B: Yield to pedestrians
    C: Proceed quickly to avoid blocking the sidewalk
    D: Stop only if there is a stop sign present
  answer: B
  explanation: When crossing a sidewalk to enter or exit a driveway, alley, or parking
    lot you must yield to pedestrians.
- id: 136
  category: sharing_the_road
  question: Why should you avoid using your horn when yielding to a pedestrian using
    a guide dog or carrying a white cane?
  choices:
    A: It is illegal to use a horn in residential areas
    B: It could confuse or frighten the visually impaired pedestrian or guide dog
    C: It signals other drivers to pass you
    D: It will cause the traffic light to change
  answer: B
  explanation: Pedestrians using a guide dog or carrying a white cane must be given
    the right-of-way always. Do not use your horn as it could confuse or frighten
    the visually impaired pedestrian or guide dog.
- id: 137
  category: safe_driving_rules
  question: What is the right-of-way rule at an uncontrolled intersection with no
    stop signs or traffic signals?
  choices:
    A: Yield to vehicles coming from the left
    B: The vehicle traveling the fastest has the right-of-way
    C: Yield to vehicles already in the intersection and those coming from the right
    D: Stop and wait for another driver to wave you through
  answer: C
  explanation: At an uncontrolled intersection where there is no stop sign, yield
    sign or traffic signal, you must yield to vehicles in the intersection and those
    coming from the right.
- id: 138
  category: safe_driving_rules
  question: If two vehicles arrive at a 4-way stop at the exact same time, who has
    the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling straight
    D: The vehicle making a right turn
  answer: B
  explanation: At a 4-way stop, if more than one vehicle arrives at the same time,
    the vehicle on the right goes first.
- id: 139
  category: safe_driving_rules
  question: When are you permitted to enter an intersection?
  choices:
    A: As soon as the traffic light turns green, regardless of traffic ahead
    B: Only when you can get completely through it without blocking traffic flow
    C: Whenever you are turning right on red
    D: When the vehicle behind you honks its horn
  answer: B
  explanation: You may not enter an intersection unless you can get through it without
    blocking traffic flow. You should wait until traffic ahead clears so that you
    are not blocking the intersection.
- id: 140
  category: signs_and_signals
  question: On a horizontally mounted traffic light, where is the red light located?
  choices:
    A: On the far right
    B: In the middle
    C: On the far left
    D: It alternates depending on the intersection
  answer: C
  explanation: In some metropolitan areas, traffic lights are horizontal, instead
    of vertical, where the red light is on the left, the yellow light is in the middle
    and the green light is on the right.
- id: 141
  category: signs_and_signals
  question: What must you do when turning left at a steady green traffic light?
  choices:
    A: Turn immediately, as you have the absolute right-of-way
    B: Yield to oncoming traffic flow and pedestrians before turning
    C: Wait for a green arrow before making the turn
    D: Stop completely and wait for the light to turn yellow
  answer: B
  explanation: Turning left at a steady green traffic light means you may turn but
    only when the intersection is clear to do so. You should always yield to the oncoming
    traffic flow and pedestrians.
- id: 142
  category: signs_and_signals
  question: What should you do if you are approaching an intersection and the traffic
    light turns to a steady yellow?
  choices:
    A: Speed up to clear the intersection before the light turns red.
    B: Stop immediately wherever you are on the road.
    C: Slow down and come to a complete stop if traffic flow to the rear allows.
    D: Proceed through the intersection without reducing your speed.
  answer: C
  explanation: A steady yellow traffic light means the light is about to change to
    red. You should slow down and come to a complete stop if traffic flow to the rear
    allows.
- id: 143
  category: signs_and_signals
  question: What does a flashing yellow traffic light indicate?
  choices:
    A: Stop and wait for a green light.
    B: Slow down and proceed with caution.
    C: The traffic light is broken and should be treated as a four-way stop.
    D: Yield to traffic on the right only.
  answer: B
  explanation: A flashing yellow traffic light means slow down and proceed with caution.
    You should be prepared to stop for any traffic flow that may be entering the intersection.
- id: 144
  category: safe_driving_rules
  question: Under what circumstances is a left turn permitted on a steady red traffic
    light?
  choices:
    A: When turning from a two-way street onto another two-way street.
    B: Left turns on red are never permitted under any circumstances.
    C: When moving from a one-way street onto another one-way street, or from a two-way
      street onto a one-way street.
    D: Only between the hours of midnight and 6:00 AM.
  answer: C
  explanation: Some left turns may be permitted on red when moving from a one-way
    street onto another one-way street or from a two-way street onto a one-way street,
    after checking for traffic and pedestrians.
- id: 145
  category: signs_and_signals
  question: How should you treat a flashing red traffic light?
  choices:
    A: The same as a yield sign.
    B: The same as a stop sign.
    C: The same as a steady yellow light.
    D: Proceed without stopping if the intersection is clear.
  answer: B
  explanation: A flashing red traffic light means you must stop behind a stop line,
    crosswalk, or intersection before entering and use the same procedure as you would
    at a stop sign.
- id: 146
  category: signs_and_signals
  question: What shape and color are most warning signs?
  choices:
    A: Rectangular and white with black lettering.
    B: Circular and yellow with black lettering.
    C: Diamond shaped and yellow with black lettering or symbols.
    D: Octagonal and red with white lettering.
  answer: C
  explanation: Warning signs are usually yellow with black lettering or symbols and
    are diamond shaped.
- id: 147
  category: signs_and_signals
  question: What does a round yellow warning sign with an 'X' symbol and black 'RR'
    letters indicate?
  choices:
    A: You are currently crossing railroad tracks.
    B: A highway-railroad grade crossing is ahead.
    C: The railroad crossing is closed for repairs.
    D: Trains are not currently operating on the tracks ahead.
  answer: B
  explanation: A round yellow warning sign with an 'X' symbol and black 'RR' letters
    is placed along the road prior to a highway-railroad grade crossing to caution
    you to slow down and be prepared to stop.
- id: 148
  category: defensive_driving
  question: Approximately how much distance does a 100-car freight train traveling
    at 55 mph need to stop?
  choices:
    A: 500 feet.
    B: Half a mile.
    C: More than a mile.
    D: Two miles.
  answer: C
  explanation: A 100-car freight train traveling at 55 mph will need more than a mile
    to stop, which is about 18 football fields, once the train is set into emergency
    braking.
- id: 149
  category: safe_driving_rules
  question: If your vehicle stalls on railroad tracks and a train is approaching,
    what is the safest immediate action?
  choices:
    A: Stay in the vehicle and call 911.
    B: Get everyone out and run in the direction from which the train is approaching.
    C: Get everyone out and run in the same direction the train is traveling.
    D: Try to push the vehicle off the tracks.
  answer: B
  explanation: If you stall your vehicle when crossing railroad tracks, get everyone
    out of the vehicle and far away from the tracks, run in the direction from which
    the train is approaching to avoid being injured by flying debris.
- id: 150
  category: vehicle_information
  question: Why is it wise not to shift gears when crossing railroad tracks?
  choices:
    A: It damages the vehicle's transmission.
    B: It causes the tires to lose traction on the metal rails.
    C: You might stall your vehicle on the tracks.
    D: It is illegal to shift gears in an intersection.
  answer: C
  explanation: The manual states it is wise not to shift gears when crossing railroad
    tracks just in case you might stall.
- id: 151
  category: signs_and_signals
  question: What information is provided on the blue Emergency Notification System
    (ENS) sign at a highway-rail grade crossing?
  choices:
    A: The train schedule for that specific crossing.
    B: A toll-free dispatch number and a DOT number identifying the crossing's exact
      location.
    C: The speed limit for trains passing through the crossing.
    D: The distance to the nearest hospital.
  answer: B
  explanation: The ENS sign provides a toll-free dispatch number for each railroad,
    and directly below the dispatch number is a Department of Transportation number
    that identifies the exact location of the crossing.
- id: 152
  category: signs_and_signals
  question: What colors are typically used for construction, maintenance, or emergency
    operation work zone signs?
  choices:
    A: Yellow with black letters.
    B: Red with white letters.
    C: Orange with black letters or symbols.
    D: Green with white letters.
  answer: C
  explanation: Work zone signs are generally diamond or rectangular shaped and orange
    with black letters or symbols.
- id: 153
  category: signs_and_signals
  question: What must you do when facing a red arrow traffic light?
  choices:
    A: Yield to oncoming traffic and then proceed in the direction of the arrow.
    B: Stop, and do not go in the direction of the arrow until the green arrow or
      light returns.
    C: Treat it as a four-way stop.
    D: Turn in the direction of the arrow only if there are no pedestrians.
  answer: B
  explanation: A RED Arrow means you must stop, and you may not go in the direction
    of the arrow until the green arrow or light returns on the signal.
- id: 154
  category: safe_driving_rules
  question: What should you be aware of at a highway-railroad grade crossing with
    more than one train track?
  choices:
    A: You are not required to stop if the first track is clear.
    B: There may be more than one train crossing, and the number of tracks will usually
      be posted.
    C: Trains will always travel in the same direction on all tracks.
    D: The speed limit is automatically reduced to 10 mph.
  answer: B
  explanation: At crossings with more than one track, signs warn you that there is
    more than one track and there may be more than one train crossing. It is important
    to check for more than one track, train, or railroad vehicle.
- id: 155
  category: signs_and_signals
  question: Which of the following warning signs may be fluorescent yellow?
  choices:
    A: Stop signs and Yield signs.
    B: Highway-railroad grade crossing signs.
    C: School zones, school crossing, and pedestrian crossing signs.
    D: Construction and maintenance detour signs.
  answer: C
  explanation: Some warning signs may be fluorescent yellow, such as school zones,
    school crossing and pedestrian crossing.
- id: 156
  category: safe_driving_rules
  question: If you are stopped at an intersection and the light turns green, what
    must you do before proceeding?
  choices:
    A: Honk your horn to alert other drivers.
    B: Allow crossing traffic to clear the intersection before you go ahead.
    C: Accelerate quickly to establish the right-of-way.
    D: Turn right immediately, regardless of other traffic.
  answer: B
  explanation: If you are stopped at the intersection and the light turns green, you
    must allow crossing traffic to clear the intersection before you go ahead.
- id: 157
  category: penalties_and_points
  question: What is the penalty for speeding in a work zone?
  choices:
    A: Fines are tripled
    B: Fines are doubled
    C: Your license is automatically suspended
    D: You must attend traffic school
  answer: B
  explanation: According to the manual, fines for speeding in a work zone are doubled.
- id: 158
  category: signs_and_signals
  question: What does a regulatory sign with a red circle and a red slash over a symbol
    indicate?
  choices:
    A: The action shown is prohibited
    B: You must yield to the action shown
    C: The action shown is recommended
    D: A hazard is ahead
  answer: A
  explanation: The manual states that some regulatory signs have a red circle with
    a red slash over a symbol, and these signs prohibit certain actions.
- id: 159
  category: safe_driving_rules
  question: When should you drive the maximum legal speed limit posted on a sign?
  choices:
    A: At all times to prevent traffic backups
    B: Only during daylight hours
    C: Only in ideal driving conditions
    D: Whenever you are in the left lane
  answer: C
  explanation: The maximum limit should be driven only in ideal driving conditions,
    and you must reduce your speed when weather or traffic conditions require it.
- id: 160
  category: signs_and_signals
  question: When are you required to obey a 'School Speed Limit When Flashing' sign?
  choices:
    A: Between 8 AM and 5 PM on weekdays
    B: Only when the lights on the sign are flashing
    C: Whenever children are visible on the sidewalk
    D: At all times during the school year
  answer: B
  explanation: The manual states that the reduced speed limit in a school zone is
    required only when flashing; otherwise, you should obey the roadway's standard
    speed limit.
- id: 161
  category: signs_and_signals
  question: What is the shape and color of a Yield sign?
  choices:
    A: A red octagon with white letters
    B: A yellow diamond with black letters
    C: A red and white downward pointing triangle
    D: A white rectangle with black letters
  answer: C
  explanation: A yield sign is a red and white downward pointing triangle with red
    letters.
- id: 162
  category: safe_driving_rules
  question: What is the proper use of a shared center lane?
  choices:
    A: Passing slower vehicles
    B: Through traffic during rush hour
    C: Left turning vehicles from either direction
    D: Emergency parking only
  answer: C
  explanation: A shared center lane is reserved for the use of left turning vehicles
    from either direction and is not to be used for through traffic or passing other
    vehicles.
- id: 163
  category: safe_driving_rules
  question: Under what condition must you NOT enter an intersection?
  choices:
    A: If the traffic light has just turned green
    B: If traffic conditions do not permit you to clear the intersection completely
    C: If there are pedestrians waiting on the corner
    D: If you are turning right on a red light
  answer: B
  explanation: You must not enter an intersection if traffic conditions do not permit
    you to clear the intersection completely, as this would block traffic.
- id: 164
  category: signs_and_signals
  question: Which sign is a square with a white horizontal line inside a red circle?
  choices:
    A: Stop
    B: Yield
    C: Wrong Way
    D: Do Not Enter
  answer: D
  explanation: A square sign with a white horizontal line inside a red circle means
    you cannot enter (Do Not Enter).
- id: 165
  category: signs_and_signals
  question: On a green destination sign, what does it mean if the word 'Exit' is written
    on the left side of the sign?
  choices:
    A: The exit is closed
    B: The exit lane or ramp is to the left
    C: The exit is for carpools only
    D: The exit lane or ramp is to the right
  answer: B
  explanation: If the word 'Exit' is written on the left side of an exit sign, the
    exit lane or ramp is to the left.
- id: 166
  category: signs_and_signals
  question: What color are service signs that show the location of rest areas, gas
    stations, hotels, or hospitals?
  choices:
    A: Green
    B: Brown
    C: Blue
    D: Fluorescent pink
  answer: C
  explanation: Service signs are blue signs that are square or rectangular shaped
    with white lettering or symbols. They show the location of services like rest
    areas, gas stations, hotels, or hospitals.
- id: 167
  category: signs_and_signals
  question: What color are temporary incident signs used for natural disasters or
    hazardous material spills?
  choices:
    A: Orange with black lettering
    B: Fluorescent pink with black lettering
    C: Yellow with black lettering
    D: Red with white lettering
  answer: B
  explanation: Incident signs are temporary and let you know about road user incidents,
    natural disasters, or spills. These signs are fluorescent pink with black lettering.
- id: 168
  category: safe_driving_rules
  question: When driving on a road with both a solid and a dashed yellow line between
    opposing lanes, when are you permitted to pass?
  choices:
    A: Only if the solid yellow line is on your side
    B: Only if the dashed yellow line is on your side and a safe gap is available
    C: At any time if you sound your horn
    D: Passing is never permitted on roads with yellow lines
  answer: B
  explanation: Where there is both a solid and a dashed yellow line between opposing
    lanes of traffic, you should not pass if the solid yellow line is on your side.
    If the dashed line is on your side, you may pass if a safe gap in traffic is available.
- id: 169
  category: safe_driving_rules
  question: What do two solid yellow lines between lanes of traffic indicate?
  choices:
    A: Neither side may pass, but you may cross to turn when gaps exist
    B: Both sides may pass if a safe gap is available
    C: The lane is a shared center turn lane
    D: You are approaching a one-way street
  answer: A
  explanation: Two solid yellow lines between lanes of traffic means neither side
    may pass. However, you may cross a solid yellow line to turn when gaps in traffic
    flow exist.
- id: 170
  category: safe_driving_rules
  question: What does a solid white line between lanes of traffic traveling in the
    same direction mean?
  choices:
    A: You may freely change lanes
    B: You must stay within the lane unless a special situation requires a lane change
    C: The lane is ending and you must merge left
    D: You are entering a school zone
  answer: B
  explanation: A solid white line between lanes of traffic means that you must stay
    within the lane unless a special situation requires a lane change.
- id: 171
  category: safe_driving_rules
  question: If there is no 'NO TURN ON RED' sign at a traffic light, what must you
    do before turning right on red?
  choices:
    A: Slow down to 5 mph and proceed without stopping
    B: Stop at the stop line and check for traffic and pedestrians
    C: Honk your horn to warn crossing traffic
    D: Wait for the light to turn yellow before turning
  answer: B
  explanation: If there is not a NO TURN ON RED sign at the traffic light, after stopping
    at the stop line and checking for traffic and pedestrians, you may turn right
    on red.
- id: 172
  category: safe_driving_rules
  question: When leaving a driveway, alley, or building area such as a gas station,
    where must you stop?
  choices:
    A: Just past the sidewalk so you can see traffic.
    B: You do not need to stop unless pedestrians are present.
    C: Behind the sidewalk.
    D: In the nearest travel lane.
  answer: C
  explanation: If you are leaving a driveway, alley or building area, it is required
    that you stop just as you would if there was a stop sign. You should stop behind
    the sidewalk, and you must yield the right-of-way to all pedestrians and traffic.
- id: 173
  category: signs_and_signals
  question: In a reversible lane, what does a flashing yellow 'X' signal mean?
  choices:
    A: The lane is not available.
    B: You can use the lane beneath it for general travel.
    C: The use of the lane is changing and you should move out.
    D: The lane is for turning only.
  answer: D
  explanation: Signals above the lanes designate traffic flow in reversible lanes.
    A flashing yellow 'X' means the lane is for turning only.
- id: 174
  category: signs_and_signals
  question: What does a steady yellow 'X' signal above a reversible lane indicate?
  choices:
    A: The lane is for turning only.
    B: The use of the lane is changing, and you should move out of it as soon as it
      is safe.
    C: You may use the lane for passing.
    D: The lane is reserved for buses.
  answer: B
  explanation: A steady yellow 'X' means that the use of the lane is changing, and
    you should move out of it as soon as it is safe to do so.
- id: 175
  category: signs_and_signals
  question: What symbol is often posted at the side of the road or painted on the
    road surface to mark a reserved lane?
  choices:
    A: A white diamond
    B: A yellow circle
    C: A red octagon
    D: A green square
  answer: A
  explanation: Reserved lanes are marked by special lane marking signs stating that
    the lane is reserved for special use and often have a white diamond posted at
    the side of the road or painted on the road surface.
- id: 176
  category: sharing_the_road
  question: What does an 'HOV 3' sign indicate about a reserved lane?
  choices:
    A: Vehicles must travel at least 3 mph over the speed limit.
    B: The lane is reserved for vehicles with at least three people in them.
    C: The lane is reserved for heavy commercial vehicles with 3 axles.
    D: Only hybrid or electric vehicles may use the lane.
  answer: B
  explanation: HOV signs or markings mean 'High Occupancy Vehicles' and indicate lanes
    reserved for vehicles with two or more people in them. 'HOV 3' means there must
    be at least three people in the vehicle to use that lane.
- id: 177
  category: safe_driving_rules
  question: If you miss a turn or exit while driving, what should you do?
  choices:
    A: Stop and carefully back up in the travel lane.
    B: Pull onto the shoulder and back up to the exit.
    C: Go on to where it is safe to turn around.
    D: Make a U-turn across the median.
  answer: C
  explanation: If you miss a turn or exit, do not back up. A driver should go on to
    where it is safe to turn around.
- id: 178
  category: safe_driving_rules
  question: When driving on a road with three or more lanes traveling in the same
    direction, which lane should you generally use?
  choices:
    A: The left-most lane
    B: The right-most lane
    C: The center travel lane
    D: The shoulder
  answer: C
  explanation: On a road with three or more lanes traveling in the same direction,
    use the center travel lane, especially when there is a lot of traffic entering
    or exiting the traffic flow.
- id: 179
  category: safe_driving_rules
  question: Which of the following is a rule regarding passing on multi-lane roads?
  choices:
    A: The right-most lane is intended for passing slower vehicles.
    B: You may pass on the paved shoulder if the vehicle ahead is turning left.
    C: The left-most lane is intended to be used for passing slower vehicles.
    D: Passing on the right is always the safest option.
  answer: C
  explanation: On multi-lane roads, the left-most lane is intended to be used for
    passing slower vehicles.
- id: 180
  category: safe_driving_rules
  question: 'When making a turn at an intersection where there are no signs or lane
    markings to control turning, you should:'
  choices:
    A: Turn into the farthest lane to allow room for other vehicles.
    B: Turn into the closest lane to you that is going in the direction you want to
      go.
    C: Always turn into the center lane.
    D: Swing wide to the opposite side before turning.
  answer: B
  explanation: As a safety precaution, turn into the closest lane to you that is going
    in the direction you want to go. This way, you will cross the fewest lanes of
    traffic.
- id: 181
  category: safe_driving_rules
  question: What is a common danger of swinging wide to the left before making a right
    turn?
  choices:
    A: You might hit a pedestrian in the crosswalk.
    B: The driver behind you may think you are changing lanes and try to pass you
      on the right.
    C: Your vehicle will lose traction and skid.
    D: You will be forced to enter a reversible lane.
  answer: B
  explanation: On right turns, avoid swinging wide to the left before making the turn.
    When moving into the other lane, the driver behind you may think you are changing
    lanes or going to turn left and may try to pass you on the right.
- id: 182
  category: safe_driving_rules
  question: What is the safest way to change direction if you find yourself headed
    in the incorrect direction on a city street?
  choices:
    A: Make a U-turn in the middle of the street.
    B: Perform a forward two-point turnabout in a busy intersection.
    C: Turn right and go around the block.
    D: Cross the median strip.
  answer: C
  explanation: The safest way to change direction is to turn right and go around the
    block. This avoids most left turns across traffic.
- id: 183
  category: safe_driving_rules
  question: 'If you need to turn around while driving on the interstate system, you
    must:'
  choices:
    A: Use the crossover areas reserved for emergency vehicles.
    B: Cross the median strip carefully.
    C: Go to the next exit and turn around.
    D: Pull onto the shoulder and wait for a gap in traffic to turn.
  answer: C
  explanation: If you are on the interstate system, go to the next exit and turn around.
    It is illegal to cross the median strip or to use the crossover areas reserved
    for emergency vehicles.
- id: 184
  category: safe_driving_rules
  question: When performing a two-point turnabout using a driveway, what is considered
    the safest method?
  choices:
    A: Driving forward into the driveway and backing out into the street.
    B: Backing the vehicle into the driveway so you can see traffic better when leaving.
    C: Making a U-turn without entering the driveway.
    D: Driving onto the sidewalk to turn around.
  answer: B
  explanation: The safest way to perform a two-point turnabout is to back the vehicle
    into the driveway. This allows you to see traffic better when leaving the driveway.
- id: 185
  category: defensive_driving
  question: According to the manual, what is the most difficult and dangerous way
    to perform a turnabout?
  choices:
    A: A U-turn
    B: A forward two-point turnabout
    C: A three-point turnabout
    D: Navigating a roundabout
  answer: C
  explanation: 'The manual states: ''Three-Point Turnabout – This is the most difficult
    and dangerous way to perform a turnabout. Use it only when the road or street
    is too narrow to make a U-turn and you cannot go around the block.'''
- id: 186
  category: safe_driving_rules
  question: If you must make a U-turn, how should you position your vehicle before
    beginning the turn?
  choices:
    A: Move as far to the left as you can
    B: Move as far to the right as you can
    C: Straddle the center line
    D: Stop in the middle of the intersection
  answer: B
  explanation: 'The manual instructs: ''If you must make a U-turn, move as far to
    the right as you can. Wait for a large gap in the traffic in both directions then
    turn the wheel left sharply...'''
- id: 187
  category: safe_driving_rules
  question: What speed should you slow down to when entering a roundabout or traffic
    circle?
  choices:
    A: 5 to 10 mph
    B: 15 to 20 mph
    C: 25 to 30 mph
    D: 35 to 40 mph
  answer: B
  explanation: 'When entering a roundabout or traffic circle, you must negotiate a
    sharp curve. The manual states: ''Slow your speed to about 15 to 20 mph.'''
- id: 188
  category: sharing_the_road
  question: Who has the right-of-way when you are entering a roundabout?
  choices:
    A: Entering traffic
    B: Circulating traffic
    C: Vehicles on the right
    D: Large trucks only
  answer: B
  explanation: In a roundabout, vehicles travel counterclockwise around a raised center
    island, 'with entering traffic yielding the right-of-way to circulating traffic.'
- id: 189
  category: signs_and_signals
  question: How should you use your turn signals if you are going straight through
    a traffic circle or roundabout?
  choices:
    A: Signal 'left' while approaching the roundabout
    B: Signal 'right' while approaching the roundabout
    C: No signal is needed while approaching, but signal 'right' before the exit you
      want to take
    D: No turn signals are required at any point
  answer: C
  explanation: 'The manual states: ''If you are going straight through, no signal
    is needed while approaching. However, signal "right" before the exit you want
    to take.'''
- id: 190
  category: sharing_the_road
  question: What specific hazard should you avoid driving alongside in a traffic circle
    or roundabout?
  choices:
    A: Motorcycles
    B: Bicycles
    C: Pedestrians
    D: Large vehicles, such as trucks and buses
  answer: D
  explanation: 'The manual explicitly warns: ''Do not drive alongside large vehicles,
    such as trucks and buses in a traffic circle or roundabout.'''
- id: 191
  category: sharing_the_road
  question: When are you required to stop for a school bus?
  choices:
    A: Only when the bus is on your side of the road
    B: When it is stopped with its red lights flashing and/or stop arm extended
    C: Only when you see children actively crossing the street
    D: When the bus is stopped at a railroad crossing
  answer: B
  explanation: According to the rules for school buses, 'You must stop for a school
    bus that is stopped with its red lights flashing and/or stop arm extended.'
- id: 192
  category: defensive_driving
  question: When entering your parked vehicle on the street, how should you approach
    the driver's door?
  choices:
    A: From the rear of the vehicle
    B: From the front of the vehicle
    C: Directly from the sidewalk
    D: It does not matter how you approach
  answer: B
  explanation: 'To increase safety, the manual advises: ''When entering your vehicle
    on the street, approach the driver’s door with your key in hand from the front
    of the vehicle to increase awareness of oncoming traffic.'''
- id: 193
  category: safe_driving_rules
  question: Which way should you turn your steering wheel when parking downhill, whether
    with or without a curb?
  choices:
    A: Sharply away from the edge or curb side
    B: Sharply toward the edge or curb side of the roadway
    C: Keep the wheels perfectly straight
    D: Turn the wheels slightly to the left
  answer: B
  explanation: When parking downhill with or without a curb, you should 'Turn the
    steering wheel sharply toward the edge or curb side of the roadway while moving
    slowly forward.' This ensures the vehicle rolls away from traffic if it moves.
- id: 194
  category: safe_driving_rules
  question: How should you turn your steering wheel when parking your vehicle uphill
    and there is NO curb?
  choices:
    A: Sharply toward the edge of the road
    B: Sharply away from the edge of the road
    C: Keep the wheels straight
    D: Turn the wheels to the left
  answer: A
  explanation: When parking uphill without a curb, you should 'Move slowly forward
    turning the steering wheel sharply toward the edge of the road.' This way, if
    the vehicle moves, it rolls away from traffic.
- id: 195
  category: safe_driving_rules
  question: When exiting a perpendicular or angle parking space, how far should you
    move straight back before turning the steering wheel?
  choices:
    A: Until your rear bumper clears the space
    B: Until your front bumper clears the vehicle parked beside you, opposite of the
      way you are turning
    C: Until you are completely in the center of the travel lane
    D: You should turn the steering wheel immediately as you start reversing
  answer: B
  explanation: When exiting these parking spaces, you must 'Continue to check traffic
    and move straight back until your front bumper clears the vehicle parked beside
    you, opposite of the way you are turning. Then turn the steering wheel sharply...'
- id: 196
  category: safe_driving_rules
  question: In which direction do vehicles travel around the raised center island
    of a roundabout?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a figure-eight pattern
    D: Whichever direction is shortest to the exit
  answer: B
  explanation: 'The manual states: ''Vehicles travel counterclockwise around a raised
    center island, with entering traffic yielding the right-of-way to circulating
    traffic.'''
- id: 197
  category: sharing_the_road
  question: If there is a center turning lane between the roadways, are you required
    to stop for a school bus with flashing red lights on the opposite side of the
    road?
  choices:
    A: Yes, you must stop whether the bus is on your side or the opposite side.
    B: No, the center turning lane acts as a physical barrier.
    C: Only if you are currently driving in the center turning lane.
    D: No, you only stop if the bus is on your side of the road.
  answer: A
  explanation: 'The manual clearly states: ''You must stop for a school bus when there
    is a center turning lane between the roadways, whether the school bus is on your
    side of the road or on the opposite side of the road.'''
- id: 198
  category: safe_driving_rules
  question: According to the manual, you are prohibited from parking within how many
    feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: The manual states under No-Parking Zones that you must not park within
    15 ft. of a fire hydrant.
- id: 199
  category: safe_driving_rules
  question: You may not park your vehicle within how many feet of a traffic signal,
    stop sign, or yield sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: The manual prohibits parking within 30 ft. of a traffic signal, stop
    sign or yield sign.
- id: 200
  category: signs_and_signals
  question: What does a red painted curb indicate?
  choices:
    A: Only short stops are permitted
    B: A loading zone
    C: A handicap restriction
    D: Fire zone restrictions
  answer: D
  explanation: Painted curbs indicate parking restrictions, and a red curb indicates
    fire zone restrictions.
- id: 201
  category: signs_and_signals
  question: 'A white painted curb means:'
  choices:
    A: Only short stops are permitted
    B: It is a loading zone
    C: Parking is prohibited at all times
    D: It is a handicap restriction
  answer: A
  explanation: According to the manual, a white painted curb indicates that only short
    stops are permitted.
- id: 202
  category: safe_driving_rules
  question: 'When parking your vehicle parallel to the curb, you must not park more
    than:'
  choices:
    A: 6 inches from the curb
    B: 1 foot from the curb
    C: 18 inches from the curb
    D: 2 feet from the curb
  answer: B
  explanation: The manual states in the No-Parking Zones section that you must not
    park more than 1 ft. from the curb.
- id: 203
  category: defensive_driving
  question: How far ahead should you look when driving in the city?
  choices:
    A: At least one block or one traffic signal ahead
    B: At least two blocks or two traffic signals ahead
    C: At least three blocks or three traffic signals ahead
    D: At least a quarter of a mile ahead
  answer: B
  explanation: In the city, you should look at least two blocks or two traffic signals
    ahead to see problems early and avoid emergency braking.
- id: 204
  category: defensive_driving
  question: 'To identify potential problems in your travel path, you should maintain
    a visual lead of:'
  choices:
    A: 5 to 10 seconds ahead
    B: 10 to 15 seconds ahead
    C: 20 to 30 seconds ahead
    D: 30 to 40 seconds ahead
  answer: C
  explanation: A visual lead is an area 20 to 30 seconds ahead from the front of the
    vehicle. Having a good visual lead helps you see changes in your travel path.
- id: 205
  category: safe_driving_rules
  question: At 60 mph, approximately how long and how far does it take to react to
    a problem and bring the vehicle to a stop on dry pavement?
  choices:
    A: 2 to 3 seconds or 123 feet
    B: 3 to 4 seconds or 250 feet
    C: 4 to 5 seconds or 359 feet
    D: 5 to 6 seconds or 450 feet
  answer: C
  explanation: Even with good tires and dry pavement, at 60 mph it can take about
    4 to 5 seconds or 359 feet to react to a problem and bring the vehicle to a stop.
- id: 206
  category: defensive_driving
  question: If you are stopped at an intersection, where should you look before entering?
  choices:
    A: Left, right, and left again
    B: Right, left, and right again
    C: Straight ahead only
    D: Left and straight ahead only
  answer: A
  explanation: The manual advises that if stopped at an intersection, you should look
    left, right and left again before entering the intersection.
- id: 207
  category: safe_driving_rules
  question: When exiting a parallel parking space, when should you straighten your
    wheels and move forward into the appropriate lane of traffic?
  choices:
    A: As soon as you shift into drive
    B: When your front bumper clears the rear bumper of the vehicle ahead
    C: When the door post of your vehicle clears the rear bumper of the vehicle parked
      ahead of you
    D: After you have backed up as much as possible
  answer: C
  explanation: You should straighten wheels and move forward into the appropriate
    lane of traffic when the door post of the vehicle clears the rear bumper of the
    vehicle parked ahead of you.
- id: 208
  category: signs_and_signals
  question: According to the manual's knowledge test, what color are regulatory signs?
  choices:
    A: Green
    B: Yellow
    C: White
    D: Orange
  answer: C
  explanation: The 'Test Your Knowledge' section indicates that regulatory signs are
    white.
- id: 209
  category: safe_driving_rules
  question: When parking your vehicle facing uphill with a curb, how should your wheels
    be positioned?
  choices:
    A: Turned toward the curb
    B: Turned away from the curb
    C: Facing straight ahead
    D: Turned to the right
  answer: B
  explanation: The 'Test Your Knowledge' section confirms that when parking your vehicle
    facing uphill with a curb, your wheels should be turned away from the curb.
- id: 210
  category: safe_driving_rules
  question: What should you do when preparing to turn left at an intersection?
  choices:
    A: Wait behind the crosswalk until the light turns red.
    B: Pull into the intersection to be ready to turn left.
    C: Turn your wheels to the left while waiting for a gap.
    D: Speed up to beat oncoming traffic.
  answer: B
  explanation: According to the manual, when turning left at an intersection, you
    should pull into the intersection to be ready to turn left.
- id: 211
  category: safe_driving_rules
  question: How should you approach a highway-railroad grade crossing?
  choices:
    A: Maintain your speed until you see the tracks.
    B: Stop immediately at the round warning sign.
    C: Slow down at the round warning sign and look in each direction.
    D: Accelerate to cross the tracks as quickly as possible.
  answer: C
  explanation: The manual states to approach any highway-railroad grade crossing by
    slowing down at the round warning sign and looking each direction prior to the
    tracks.
- id: 212
  category: defensive_driving
  question: When changing lanes, what size gap in traffic should you identify before
    moving?
  choices:
    A: 2 to 3 seconds
    B: 4 to 5 seconds
    C: 6 to 8 seconds
    D: 10 to 12 seconds
  answer: B
  explanation: When changing lanes, you should identify a 4 to 5 second gap in traffic,
    signal, and look again in the direction of the lane change.
- id: 213
  category: defensive_driving
  question: How should you check your vehicle's blind spots before changing lanes?
  choices:
    A: By looking strictly at your rearview mirror.
    B: By checking your side mirrors twice.
    C: By turning your head and looking over your shoulder.
    D: By honking your horn to warn other drivers.
  answer: C
  explanation: You must check your blind spots by turning your head and looking over
    your shoulder in the direction you plan to move, as these are areas you cannot
    see with your mirrors.
- id: 214
  category: defensive_driving
  question: When is it especially important to use your mirrors to check behind your
    vehicle?
  choices:
    A: When accelerating on a highway on-ramp.
    B: When slowing down quickly or at unexpected places like private driveways.
    C: When driving through a green light.
    D: When parked in a designated parking space.
  answer: B
  explanation: It is very important to check behind your vehicle when you slow down
    quickly or at points where a following driver would not expect you to slow down,
    such as private driveways or parking spaces.
- id: 215
  category: defensive_driving
  question: What is the average perception time for an alert driver to recognize a
    hazard?
  choices:
    A: 1/4 to 1/2 second
    B: 3/4 to 1 second
    C: 1.5 to 2 seconds
    D: 3 to 4 seconds
  answer: B
  explanation: The manual states that the average perception time for an alert driver
    is ¾ second to 1 second.
- id: 216
  category: safe_driving_rules
  question: Under ideal conditions, what is the minimum total stopping distance for
    a vehicle traveling at 50 mph?
  choices:
    A: 55 feet
    B: 158 feet
    C: 268 feet
    D: 350 feet
  answer: C
  explanation: Total stopping distance includes perception, reaction, and braking
    distance. At 50 mph, your vehicle will travel a minimum of 268 feet to come to
    a complete stop.
- id: 217
  category: safe_driving_rules
  question: What happens to the impact and braking distance when you double your speed
    from 20 mph to 40 mph?
  choices:
    A: They double.
    B: They triple.
    C: They become 4 times greater.
    D: They become 9 times greater.
  answer: C
  explanation: When you double your speed from 20 to 40 mph, the impact is 4 times
    greater, and the braking distance is also 4 times longer.
- id: 218
  category: defensive_driving
  question: How far ahead of your vehicle should you look to avoid panic stops?
  choices:
    A: At least 3 seconds
    B: At least 5 seconds
    C: At least 10 seconds
    D: At least 15 seconds
  answer: C
  explanation: You should look at least ten seconds ahead of your vehicle to avoid
    panic stops by seeing events and problems well ahead of time.
- id: 219
  category: safe_driving_rules
  question: What is the safest way to navigate a curve in the road?
  choices:
    A: Accelerate heavily before entering the curve.
    B: Brake hard after entering the curve.
    C: Reduce speed prior to entering the curve.
    D: Coast through the curve in neutral.
  answer: C
  explanation: Always reduce speed prior to entering the curve to a safe speed. Hard
    braking after the entry to a curve could cause the vehicle tires to lose traction.
- id: 220
  category: defensive_driving
  question: Why are roadways often more slippery when it first starts to rain?
  choices:
    A: The rain washes away the traction-enhancing chemicals on the road.
    B: The water mixes with dirt, oil, and other substances on the roadway.
    C: The sudden drop in temperature freezes the rain instantly.
    D: The tires become too cold to grip the pavement.
  answer: B
  explanation: Roadways are more slippery when it first starts to rain, snow or sleet
    as the water will mix with dirt, oil and other substances on the roadway.
- id: 221
  category: safe_driving_rules
  question: How much should you reduce your speed on wet roadways?
  choices:
    A: About 5 mph below recommended speeds.
    B: About 10 mph below recommended speeds.
    C: By half of the recommended speed.
    D: You do not need to reduce your speed.
  answer: B
  explanation: On wet roadways you should reduce speed about 10 mph below recommended
    speeds to allow for additional stopping distance and potential traction loss.
- id: 222
  category: safe_driving_rules
  question: How should you adjust your speed if there is packed snow on the road?
  choices:
    A: Reduce your speed by 5 mph.
    B: Reduce your speed by 10 mph.
    C: Reduce your speed by half or more.
    D: Maintain the posted speed limit.
  answer: C
  explanation: 'The manual states: "If there is packed snow on the road, reduce your
    speed by half or more."'
- id: 223
  category: vehicle_information
  question: In Kansas, during which period are vehicles permitted to be equipped with
    studded snow tires?
  choices:
    A: October 1st to March 1st
    B: November 1st to April 1st
    C: December 1st to February 28th
    D: Year-round
  answer: B
  explanation: Vehicles in Kansas may be equipped with studded snow tires from November
    1st to April 1st each year.
- id: 224
  category: defensive_driving
  question: Why does the normal design of roadway drainage make ice-covered roadways
    especially dangerous?
  choices:
    A: The drainage grates freeze and create large bumps.
    B: Roadways are sloped to the center, causing vehicles to collide.
    C: Roadways are higher in the center and sloped to the side, causing skidding
      vehicles to slide off the road.
    D: The drainage ditches overflow and flood the roadway with ice.
  answer: C
  explanation: Ice-covered roadways are especially dangerous due to the normal design
    for roadway drainage, where roadways are higher in the center and sloped to the
    side, causing a skidding vehicle to slide off the roadway.
- id: 225
  category: safe_driving_rules
  question: Why can the roadway pavement on bridges and overpasses be ice-covered
    even when other pavement is clear?
  choices:
    A: They are constructed with smoother concrete.
    B: They receive less direct sunlight than normal roads.
    C: They do not have earth underneath them to help insulate them against the cold.
    D: They are designed to hold water for longer periods.
  answer: C
  explanation: The manual states that bridges do not have earth underneath them to
    help insulate them against the cold and can be colder and more ice-covered than
    other roadways.
- id: 226
  category: defensive_driving
  question: At what speed can your tires lose all traction with the road during heavy
    rain?
  choices:
    A: 25-30 mph
    B: 30-35 mph
    C: 35-40 mph
    D: 45-50 mph
  answer: D
  explanation: In a heavy rain, your tires can lose all traction with the road at
    45-50 mph due to the water pushing against the tires as the vehicle is moving
    forward.
- id: 227
  category: vehicle_information
  question: At what speed will badly worn tires begin to lose traction on wet roadways?
  choices:
    A: 15-20 mph
    B: 25-30 mph
    C: 35-40 mph
    D: 45-50 mph
  answer: B
  explanation: The manual notes that badly worn tires will lose traction at much lower
    speeds, specifically 25-30 mph.
- id: 228
  category: safe_driving_rules
  question: Driving more than ___ slower than the traffic flow pattern can be just
    as dangerous as excessive speed.
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: C
  explanation: Driving more than 15 mph slower than the traffic flow pattern can be
    just as dangerous as excessive speed because it makes vehicles bunch up and causes
    others to take greater risks to pass.
- id: 229
  category: safe_driving_rules
  question: What is the proper way to use an acceleration lane when entering traffic
    flow?
  choices:
    A: Drive to the end of the acceleration lane and stop to wait for a gap.
    B: Cross the solid white line immediately to merge as quickly as possible.
    C: Use the lane to reach the speed of other vehicles before pulling onto the roadway.
    D: Maintain a speed 15 mph slower than the traffic flow until you have fully merged.
  answer: C
  explanation: The manual instructs drivers to use the acceleration lane to reach
    the speed of other vehicles before pulling onto the roadway, and explicitly warns
    not to drive to the end of the lane and stop.
- id: 230
  category: safe_driving_rules
  question: When using a deceleration lane to exit a highway, when should you begin
    to slow down?
  choices:
    A: About one-half mile before the exit ramp.
    B: While you are still in the main roadway traffic flow.
    C: Only after the vehicle has moved onto the deceleration lane.
    D: Immediately after passing the exit sign.
  answer: C
  explanation: When using a deceleration lane (exit ramp), do not slow down until
    the vehicle has moved onto the deceleration lane.
- id: 231
  category: penalties_and_points
  question: Can you be cited for a traffic violation if you are driving 55 mph in
    a 55 mph zone during a snowstorm?
  choices:
    A: No, because you are not exceeding the posted speed limit.
    B: Yes, you may be cited for traveling too fast for conditions.
    C: No, unless you cause a collision.
    D: Yes, but only if you are driving a commercial vehicle.
  answer: B
  explanation: You may be cited for traveling too fast for conditions. Driving 55
    mph in a snowstorm is not recognized as an acceptable speed for a snowy roadway,
    even if the posted speed limit allows for 55 mph.
- id: 232
  category: defensive_driving
  question: What is the best way to avoid speeding?
  choices:
    A: Keep pace with the fastest vehicle on the road.
    B: Check your speedometer frequently.
    C: Listen to the sound of your engine.
    D: Stay in the right-hand lane at all times.
  answer: B
  explanation: The manual states that the best way to avoid speeding is to check your
    speedometer frequently, as it is easy to travel faster than perceived.
- id: 233
  category: vehicle_information
  question: Why do larger vehicles like SUVs, vans, and pickup trucks have special
    handling characteristics?
  choices:
    A: They have a higher center of gravity and are more prone to rollovers.
    B: They are equipped with smaller tires than passenger cars.
    C: They lack Anti-Lock Braking Systems (ABS).
    D: They are not designed to drive at highway speeds.
  answer: A
  explanation: Larger vehicles with a higher center of gravity have special handling
    characteristics and are more prone to rollovers.
- id: 234
  category: vehicle_information
  question: What is the primary function of an Anti-Lock Braking System (ABS)?
  choices:
    A: It automatically applies the brakes when a collision is imminent.
    B: It shortens stopping distances on dry pavement.
    C: It allows steering and braking at the same time without losing vehicle balance.
    D: It prevents the vehicle from hydroplaning at speeds over 35 mph.
  answer: C
  explanation: ABS is designed to allow steering and braking at the same time without
    losing vehicle balance.
- id: 235
  category: defensive_driving
  question: What are the three basics for ABS usage?
  choices:
    A: Pump, Steer, Stop
    B: Search, Stomp, Steer
    C: Scan, Slide, Steer
    D: Signal, Slow, Stop
  answer: B
  explanation: The basics for ABS usage are Search (for open space), Stomp (on the
    brake pedal firmly), Steer (to the open space).
- id: 236
  category: vehicle_information
  question: What are the basic steps for using an Anti-lock Braking System (ABS) during
    an emergency?
  choices:
    A: Search, Stomp, Steer
    B: Scan, Squeeze, Steer
    C: Search, Slide, Steer
    D: Stop, Steer, Speed
  answer: A
  explanation: According to the manual, the basics for ABS usage are Search (for open
    space), Stomp (on the brake pedal firmly), and Steer (to the open space).
- id: 237
  category: vehicle_information
  question: How can you tell if your vehicle's Anti-lock Braking System (ABS) is NOT
    working correctly?
  choices:
    A: The ABS light never illuminates when starting the car.
    B: The ABS light illuminates and then dims.
    C: The ABS indicator light stays lit after starting the vehicle.
    D: The brake pedal feels unusually firm.
  answer: C
  explanation: The manual states that when you start your vehicle, the ABS light will
    illuminate and then dim. If the light stays lit, the ABS is not working correctly.
- id: 238
  category: defensive_driving
  question: What should you do if you experience traction loss in a vehicle equipped
    with an Electronic Stability Program (ESP)?
  choices:
    A: Steer abruptly in the opposite direction of the skid.
    B: Steer the vehicle toward the direction you are looking and avoid abrupt steering.
    C: Pump the brakes rapidly to regain traction.
    D: Accelerate heavily to push through the traction loss.
  answer: B
  explanation: In traction loss with ESP, you should steer the vehicle toward the
    direction you are looking and avoid abrupt steering, allowing the ESP to electronically
    adjust the vehicle.
- id: 239
  category: safe_driving_rules
  question: Under normal driving conditions, what is the minimum recommended following
    distance?
  choices:
    A: One second
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: B
  explanation: The manual advises drivers to keep a minimum following distance of
    two seconds under normal conditions.
- id: 240
  category: safe_driving_rules
  question: How much additional following distance should you add for unusual weather
    or traffic conditions?
  choices:
    A: One additional second
    B: Two additional seconds
    C: Three additional seconds
    D: Four additional seconds
  answer: A
  explanation: You should keep a minimum following distance of two seconds with an
    additional second for any unusual weather or traffic conditions.
- id: 241
  category: sharing_the_road
  question: Why is it important to keep more space in front of your vehicle when following
    a motorcycle?
  choices:
    A: Motorcycles accelerate much slower than cars.
    B: Motorcycles are required to drive in the center of the lane.
    C: Motorcycles have different sizes and braking capabilities than other motor
      vehicles.
    D: Motorcycles always travel at lower speeds than other traffic.
  answer: C
  explanation: The manual states to keep more space when following motorcycles because
    they are different sizes and have different braking capabilities. If the motorcycle
    falls, you need extra distance to avoid the rider.
- id: 242
  category: vehicle_information
  question: How does carrying a heavy load or pulling a trailer affect your vehicle's
    handling?
  choices:
    A: It decreases your stopping time and increases steering ability.
    B: It increases your stopping time and decreases steering ability.
    C: It has no effect on stopping time but improves steering.
    D: It improves your vehicle's traction in wet weather.
  answer: B
  explanation: Adding more space in front of your vehicle is necessary when carrying
    a heavy load or pulling a trailer because the extra weight increases your vehicle's
    stopping time and decreases steering ability.
- id: 243
  category: sharing_the_road
  question: Many states require other vehicles to stay at least how many feet to the
    rear of emergency equipment?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Many states require other vehicles to stay at least 500 feet to the
    rear of emergency equipment, which is a minimum of 12 seconds at 30 mph.
- id: 244
  category: defensive_driving
  question: What should you do if you are being followed too closely (tailgated) and
    there is no empty lane to move into?
  choices:
    A: Tap your brakes quickly to warn the driver behind you.
    B: Speed up significantly to increase the distance.
    C: Wait until the roadway ahead is clear, then reduce speed slowly to encourage
      the tailgater to pass.
    D: Slow down quickly to discourage the tailgater.
  answer: C
  explanation: If there is no empty lane, wait until the roadway ahead is clear, then
    reduce speed slowly to encourage the tailgater to drive around your vehicle. Never
    slow down quickly.
- id: 245
  category: defensive_driving
  question: If your vehicle is being followed too closely, how should you adjust your
    following distance to the vehicle ahead of you?
  choices:
    A: Decrease it by 1 second.
    B: Keep it exactly at 2 seconds.
    C: Increase it by 2 to 3 seconds.
    D: Increase it by 5 to 6 seconds.
  answer: C
  explanation: If your vehicle is being followed too closely, increase your following
    distance by 2 to 3 seconds to allow for more time and space to stop, lessening
    the risk of being rear-ended.
- id: 246
  category: safe_driving_rules
  question: When driving on a two-way, single lane roadway, where is it generally
    safest to position your vehicle?
  choices:
    A: Crowding the center line marking.
    B: In the center of your lane.
    C: As close to the right edge of the road as possible.
    D: Alternating between the left and right sides of the lane.
  answer: B
  explanation: On a two-way, single lane roadway, do not crowd the center line marking.
    In general, it is safest to drive in the center of your lane so your vehicle can
    move left or right to avoid a potential problem.
- id: 247
  category: safe_driving_rules
  question: When merging with other traffic flow, what size gap in traffic should
    you select?
  choices:
    A: 1 to 2 seconds
    B: 2 to 3 seconds
    C: 4 to 6 seconds
    D: 8 to 10 seconds
  answer: C
  explanation: When merging with other traffic flow, select a gap in the traffic flow
    of 4 to 6 seconds.
- id: 248
  category: safe_driving_rules
  question: Under normal circumstances, approximately how long does it take a vehicle
    to get through an intersection when going straight after stopping?
  choices:
    A: 1 to 2 seconds
    B: 3 to 5 seconds
    C: 6 to 8 seconds
    D: 10 to 12 seconds
  answer: B
  explanation: When going straight after stopping at an intersection, under normal
    circumstances, a vehicle can get through an intersection within 3 to 5 seconds.
- id: 249
  category: safe_driving_rules
  question: Under normal circumstances, how long may it take to complete a left turn
    and get up to speed?
  choices:
    A: 3 to 5 seconds
    B: 8 to 10 seconds
    C: 12 to 15 seconds
    D: 15 to 18 seconds
  answer: D
  explanation: The manual states that it may take 15 to 18 seconds to complete a left
    turn and get up to speed.
- id: 250
  category: signs_and_signals
  question: What should you do if you have a green traffic signal light, but vehicles
    are currently blocking the intersection?
  choices:
    A: Enter the intersection and wait for the vehicles to move.
    B: Honk your horn until the path is clear.
    C: Do not start across the intersection until the path is clear.
    D: Edge forward slowly to force the vehicles to move.
  answer: C
  explanation: Even if you have the green traffic signal light, do not start across
    the intersection when vehicles are blocking the way. If caught in the intersection
    when the light changes to red, your vehicle will be illegally blocking traffic
    flow.
- id: 251
  category: safe_driving_rules
  question: Why should you wait until an approaching vehicle actually starts to turn
    before turning into a lane, even if their turn signal is active?
  choices:
    A: The turn signal might be broken.
    B: The driver may plan to turn after passing you or forgot to turn it off.
    C: It is illegal to turn while another vehicle's signal is on.
    D: You must always yield to vehicles with active turn signals.
  answer: B
  explanation: The manual states that a driver with an active turn signal may plan
    to turn after they go past your vehicle or may have forgotten to turn the signal
    off from a prior turn.
- id: 252
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to return to your driving
    lane?
  choices:
    A: When you are one car length ahead of the passed vehicle.
    B: When you can see the complete front of the passed vehicle in your rearview
      mirror.
    C: As soon as you are parallel with the passed vehicle's front bumper.
    D: When the passed vehicle flashes its headlights.
  answer: B
  explanation: You should continue to pass until the complete front of the passed
    vehicle is visible in your rearview mirror before signaling and returning to the
    lane.
- id: 253
  category: sharing_the_road
  question: What should you do when you become aware that another vehicle wants to
    pass you?
  choices:
    A: Speed up to prevent them from passing.
    B: Move to the left side of the lane and slow down.
    C: Move to the right side of the lane and maintain a constant speed.
    D: Flash your headlights and tap your brakes.
  answer: C
  explanation: When being passed, you should keep right, move to the right side of
    the lane, and maintain a constant speed to allow the driver to pass you.
- id: 254
  category: safe_driving_rules
  question: As a general rule, why should you only pass one vehicle at a time?
  choices:
    A: It is illegal to pass more than one vehicle at a time.
    B: Passing multiple vehicles requires too much fuel.
    C: It is difficult to determine the amount of time needed, which may be 20 to
      30 seconds.
    D: Your vehicle's engine may overheat.
  answer: C
  explanation: The manual advises to only pass one vehicle at a time since it is difficult
    to determine the amount of time needed to pass, which may be as many as 20 to
    30 seconds.
- id: 255
  category: defensive_driving
  question: How does an oncoming vehicle that is more than 25 seconds away generally
    appear to a driver?
  choices:
    A: It appears to be moving extremely fast.
    B: It appears to be standing still.
    C: It appears to be swerving.
    D: It appears larger than it actually is.
  answer: B
  explanation: According to the manual, an oncoming vehicle that is more than 25 seconds
    from your vehicle generally appears to be standing still.
- id: 256
  category: safe_driving_rules
  question: When driving at 55 to 60 mph, how far ahead must you be able to see to
    safely pass on a hill or curve?
  choices:
    A: At least 1/4 of a mile.
    B: At least 1/3 of a mile.
    C: At least 1/2 of a mile.
    D: At least 1 mile.
  answer: B
  explanation: You must be able to see at least 1/3 of a mile or about 20 to 25 seconds
    ahead when driving at 55 to 60 mph to safely pass near hills and curves.
- id: 257
  category: defensive_driving
  question: What is the best way to handle overtaking a pedestrian while an oncoming
    vehicle is approaching?
  choices:
    A: Speed up to pass the pedestrian before the vehicle arrives.
    B: Honk your horn to warn both the pedestrian and the vehicle.
    C: Move into the oncoming lane and force the other vehicle to slow down.
    D: Slow down and let the oncoming vehicle pass first so you take hazards one at
      a time.
  answer: D
  explanation: To minimize hazards, take them one at a time. Slow down and let the
    oncoming vehicle pass first so that your vehicle can pass only one roadway user
    at a time.
- id: 258
  category: safe_driving_rules
  question: In Kansas, when are you required by law to turn on your headlights during
    inclement weather?
  choices:
    A: Whenever you drive over 60 mph.
    B: Whenever the windshield wipers are used.
    C: Only when driving on interstate highways.
    D: Only between sunset and sunrise.
  answer: B
  explanation: Many states including Kansas require you to turn on your headlights
    whenever the wipers are used on the vehicle.
- id: 259
  category: defensive_driving
  question: Why should you turn on your headlights when driving away from a rising
    or setting sun?
  choices:
    A: To help drivers coming towards you see your vehicle.
    B: To reduce the glare on your own windshield.
    C: To conserve your vehicle's battery power.
    D: Because the sun's rays can damage your headlights.
  answer: A
  explanation: When driving away from a rising or setting sun, drivers coming towards
    you may have trouble seeing your vehicle. Your headlights will help them see your
    vehicle.
- id: 260
  category: safe_driving_rules
  question: In which of the following situations should you give your horn a light
    tap?
  choices:
    A: When greeting a friend on the sidewalk.
    B: When encouraging a slow driver to speed up.
    C: When visibility ahead is limited, such as exiting a narrow alley.
    D: When driving near a blind pedestrian.
  answer: C
  explanation: A light tap on the horn is appropriate when visibility ahead is limited,
    such as a steep hill, a sharp curve, or exiting a narrow alley.
- id: 261
  category: defensive_driving
  question: When is it appropriate to use a SHARP BLAST of your vehicle's horn?
  choices:
    A: When telling another driver they made an error.
    B: When a pedestrian is about to run into the street.
    C: When you are stuck in heavy traffic.
    D: When you want a vehicle to move out of your way.
  answer: B
  explanation: If there is danger, you should use a sharp blast of the horn, such
    as when a pedestrian or bicyclist is about to walk, run, or ride into the street.
- id: 262
  category: sharing_the_road
  question: When should you absolutely NOT use your horn?
  choices:
    A: When a bicyclist appears to be moving into your lane.
    B: When passing a driver who starts to turn into your lane.
    C: When near blind pedestrians.
    D: When another vehicle is in danger of hitting you.
  answer: C
  explanation: The manual lists several occasions when you should not use your horn,
    including when near blind pedestrians.
- id: 263
  category: safe_driving_rules
  question: If your vehicle breaks down and you must stop, where should you try to
    stop your vehicle?
  choices:
    A: Just over a hill to protect it from the wind.
    B: Just around a curve so it is out of the main traffic flow.
    C: In the center lane with your emergency flashers on.
    D: Off the road and where other roadway users have a clear view of it.
  answer: D
  explanation: If you must stop, get your vehicle off the road and stop where other
    roadway users have a clear view of your vehicle. Do not stop just over a hill
    or around a curve.
- id: 264
  category: safe_driving_rules
  question: You should not pass another vehicle if there is a highway-railroad grade
    crossing ahead within what time frame?
  choices:
    A: 5 to 10 seconds.
    B: 10 to 15 seconds.
    C: 20 to 25 seconds.
    D: 30 to 40 seconds.
  answer: C
  explanation: The manual states you should not pass if there is a railroad grade
    crossing within the 20 to 25 second area ahead.
- id: 265
  category: safe_driving_rules
  question: What is an appropriate way to signal an emergency if your vehicle breaks
    down?
  choices:
    A: Tie a red cloth to the steering wheel.
    B: Tie a white cloth to the antenna, side mirror, or door handle.
    C: Stand in the middle of the roadway and wave your arms.
    D: Sound your horn continuously until help arrives.
  answer: B
  explanation: According to the manual, a white cloth attached to a vehicle indicates
    a disabled vehicle. You should tie a white cloth to the antenna, side mirror,
    or door handle, or lift the hood to signal an emergency.
- id: 266
  category: safe_driving_rules
  question: Where should you place emergency flares to warn other drivers that your
    vehicle is disabled?
  choices:
    A: 50 to 100 feet behind the vehicle
    B: 100 to 150 feet behind the vehicle
    C: 200 to 300 feet behind the vehicle
    D: 300 to 500 feet in front of the vehicle
  answer: C
  explanation: The manual states to place emergency flares about 200 to 300 feet behind
    the vehicle, giving other drivers some time to change lanes if necessary.
- id: 267
  category: safe_driving_rules
  question: In urban areas, when should you signal before making a turn or a lane
    change?
  choices:
    A: 50 feet or 1 to 2 seconds before
    B: 100 feet or 3 to 5 seconds before
    C: 200 feet or 3 to 5 seconds before
    D: 500 feet or 5 to 7 seconds before
  answer: B
  explanation: In urban areas, you must signal 100 feet or 3 to 5 seconds before making
    a turn or a lane change.
- id: 268
  category: safe_driving_rules
  question: At speeds above 40 mph, what is the proper distance to signal before making
    a turn or a lane change?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: D
  explanation: At speeds above 40 mph, you should signal 200 feet or 3 to 5 seconds
    before making a turn or a lane change.
- id: 269
  category: defensive_driving
  question: If you plan to turn at an intersection but there is a side street just
    before it, when should you signal?
  choices:
    A: As soon as you see the intersection.
    B: Before you reach the side street.
    C: Wait until you have passed the side street before signaling.
    D: You do not need to signal if there is a side street.
  answer: C
  explanation: If turning at an intersection, you should wait until you have passed
    the side street before signaling your intentions, so other drivers do not pull
    into your travel path assuming you are turning into the side street.
- id: 270
  category: safe_driving_rules
  question: How can you warn other roadway users that you are stopping or reducing
    speed at a place where they may not expect it?
  choices:
    A: Turn on your high beam headlights.
    B: Tap the brake pedal three or four times lightly.
    C: Sound your horn for three seconds.
    D: Use hand signals out the window.
  answer: B
  explanation: When stopping or reducing speed at a place where another driver may
    not expect it, tap the brake pedal three or four times lightly to warn other roadway
    users.
- id: 271
  category: license_system
  question: 'According to the manual, having a Driver''s License is considered a:'
  choices:
    A: Constitutional right
    B: Privilege, not a right
    C: Requirement for all citizens
    D: Federal right
  answer: B
  explanation: The manual explicitly states that having a Driver's License is a privilege,
    not a right.
- id: 272
  category: driver_responsibility
  question: If you are a minor with a Driver's License, who is responsible for the
    financial consequences of your driving?
  choices:
    A: Only the minor driver
    B: The state government
    C: The insurance company exclusively
    D: You and your parent(s) or guardian(s)
  answer: D
  explanation: If you are a minor, you and your parent(s) or guardian(s) will be responsible
    for the financial consequences of your driving.
- id: 273
  category: vehicle_information
  question: What is a limitation associated with driving a larger vehicle?
  choices:
    A: They are harder for other drivers to see.
    B: They can be less stable and have reduced visibility around the vehicle.
    C: They accelerate much faster than smaller vehicles.
    D: They have a tighter turning radius.
  answer: B
  explanation: The manual notes that larger vehicles can be less stable and have reduced
    visibility around the vehicle.
- id: 274
  category: defensive_driving
  question: 'Good decision making while driving starts with:'
  choices:
    A: A fast reaction time
    B: Good visual search
    C: Knowing the speed limit
    D: Having a newer vehicle
  answer: B
  explanation: To prepare for the decision-making process, it is very important to
    search actively in the area around your vehicle. Good decision making starts with
    good visual search.
- id: 275
  category: defensive_driving
  question: 'When deciding a course of action to lessen a driving risk, your actions
    are generally limited to changing direction, communicating, or:'
  choices:
    A: Changing your speed
    B: Changing your destination
    C: Exiting the vehicle
    D: Turning off your headlights
  answer: A
  explanation: Generally, you are limited to changing your direction (moving left
    or right), changing your speed (slowing, stopping, or speeding up), or communicating
    (signaling or sounding your horn).
- id: 276
  category: sharing_the_road
  question: 'When overtaking a pedestrian who is walking along the roadway and an
    oncoming vehicle is approaching, you should:'
  choices:
    A: Honk your horn so the pedestrian moves over.
    B: Speed up to pass the pedestrian quickly.
    C: Slow down and let the oncoming vehicle pass first.
    D: Keep driving, as the oncoming vehicle must stop for you.
  answer: C
  explanation: The 'Test Your Knowledge' section states that when overtaking a pedestrian
    with an oncoming vehicle approaching, you should slow down and let the vehicle
    pass first.
- id: 277
  category: safe_driving_rules
  question: What should you do if your turn signal does not cancel properly after
    making a turn or lane change?
  choices:
    A: Leave it on until the next turn.
    B: Tap the brakes three times to reset it.
    C: Cancel the signal manually so other roadway users do not become confused.
    D: Turn on your hazard lights.
  answer: C
  explanation: Drivers must cancel the signal if it has not cancelled by itself, so
    other roadway users do not become confused by an incorrect signal.
- id: 278
  category: safe_driving_rules
  question: When trying to avoid a collision, what are your three main options?
  choices:
    A: Brake, steer, or accelerate
    B: Honk, brake, or swerve
    C: Accelerate, honk, or steer
    D: Brake, brace for impact, or close your eyes
  answer: A
  explanation: 'In avoiding a collision, you have three options: brake, steer or accelerate.'
- id: 279
  category: vehicle_information
  question: 'If your vehicle has an Anti-lock Braking System (ABS) and you need to
    stop quickly, you should:'
  choices:
    A: Pump the brakes rapidly to avoid skidding
    B: Press on the brake pedal as hard as you can and keep pressing on it
    C: Apply the brakes gently and steer away from the hazard
    D: Press the brake pedal until it locks, then release it
  answer: B
  explanation: With ABS, if you need to stop quickly, press on the brake pedal as
    hard as you can and keep pressing on it. Do not let up on the brake pedal.
- id: 280
  category: safe_driving_rules
  question: If you must stop quickly and your vehicle does NOT have an Anti-lock Braking
    System (ABS), what should you do if the brakes lock-up and the vehicle starts
    to skid?
  choices:
    A: Keep pressing the brake pedal as hard as possible
    B: Shift the vehicle into neutral and pull the parking brake
    C: Ease up on the brake pedal and then reapply with control
    D: Turn the steering wheel sharply in the opposite direction of the skid
  answer: C
  explanation: Without ABS, if the brakes lock-up, you will feel the vehicle start
    to skid. Ease up on the brake pedal and then reapply with control.
- id: 281
  category: defensive_driving
  question: Which of the following is true about steering quickly to avoid a collision?
  choices:
    A: You can usually stop the vehicle quicker than you can steer it
    B: You should steer in the opposite direction you want the vehicle to go
    C: In most cases, you can steer the vehicle quicker than you can stop it
    D: You should take one hand off the wheel to brace yourself
  answer: C
  explanation: In most cases, you can steer the vehicle quicker than you can stop
    it. You should consider steering in order to avoid a collision.
- id: 282
  category: defensive_driving
  question: In which situation might it be best to accelerate to avoid a collision?
  choices:
    A: When you are approaching a sharp curve too quickly
    B: When another vehicle is about to hit you from the side or behind and there
      is room in front of you
    C: When a pedestrian suddenly steps into the crosswalk ahead of you
    D: When you experience a front tire blowout
  answer: B
  explanation: Sometimes it is best or necessary to accelerate to avoid a collision.
    This may happen when another vehicle is about to hit you from the side or from
    behind and there is room to the front of your vehicle to get out of danger.
- id: 283
  category: safe_driving_rules
  question: If your vehicle begins to lose traction and go into a skid, where should
    you look?
  choices:
    A: Fixate directly on the hazard you are trying to avoid
    B: Look into the on-coming lane
    C: Look at your pedals to ensure your feet are positioned correctly
    D: Visually look for open space in the direction you want to go
  answer: D
  explanation: If your vehicle begins to lose traction, visually look for open space.
    You must pay attention to where your vehicle can go on the roadway and do not
    fixate on the hazard you are trying to avoid.
- id: 284
  category: vehicle_information
  question: How can you tell if traction is lost to the front tires during a skid?
  choices:
    A: The vehicle moves sideways without any additional steering input
    B: The vehicle continues straight while you are steering
    C: The steering wheel begins to shake violently
    D: The rear of the vehicle fishtails
  answer: B
  explanation: 'To recognize traction loss: If the vehicle continues straight while
    steering, traction is lost to the front tires.'
- id: 285
  category: defensive_driving
  question: If your vehicle's rear tires lose traction, how should you steer?
  choices:
    A: Turn the steering wheel in the opposite direction of your intended path
    B: Hold the steering wheel perfectly straight and apply the brakes hard
    C: Turn the steering wheel in the direction of the intended path of travel
    D: Steer toward the on-coming lane to regain balance
  answer: C
  explanation: If rear traction is lost, turn the steering wheel in the direction
    of the intended path of travel (the direction you want to go) and continue to
    steer and counter-steer until the vehicle is traveling straight.
- id: 286
  category: defensive_driving
  question: What should you do to protect yourself if your vehicle is about to be
    hit from the rear?
  choices:
    A: Lean forward over the steering wheel
    B: Press yourself against the back of your seat and put your head against the
      head restraint
    C: Take your foot off the brake pedal so your vehicle can roll forward
    D: Unbuckle your seatbelt so you can exit the vehicle quickly
  answer: B
  explanation: If your vehicle is hit from the rear, your head and body will be thrown
    backwards. Press yourself against the back of your seat and put your head against
    the head restraint, and be ready to apply your brakes.
- id: 287
  category: defensive_driving
  question: If your vehicle is about to be hit from the front, what is a recommended
    action to lessen the impact?
  choices:
    A: Try to turn the vehicle to have a glancing blow rather than being struck head
      on
    B: Accelerate to push through the impact
    C: Turn off the engine before the collision occurs
    D: Throw your arms in front of your face and let go of the steering wheel
  answer: A
  explanation: If your vehicle is about to be hit from the front it is important to
    try to have a glancing blow rather than being struck head on. This means that
    if a collision is going to happen, you should try to turn the vehicle.
- id: 288
  category: vehicle_information
  question: What is the first thing you should try if your brakes stop working while
    driving?
  choices:
    A: Shift into reverse
    B: Pull the parking brake as hard and fast as you can
    C: Rapidly pump the brake pedal several times
    D: Turn off the ignition immediately
  answer: C
  explanation: If your brakes stop working, rapidly pump the brake pedal several times.
    This will often build up enough brake pressure to allow you to stop.
- id: 289
  category: safe_driving_rules
  question: Which of the following is the correct response to a tire blowout?
  choices:
    A: Slam on the brakes immediately to stop the vehicle
    B: Grip the steering wheel firmly, keep the vehicle going straight, and slow down
      gradually
    C: Accelerate slightly to maintain control of the vehicle's momentum
    D: Turn the steering wheel sharply in the direction of the blowout
  answer: B
  explanation: If a tire blows out, grip the steering wheel firmly and keep the vehicle
    going straight. Slow down gradually by taking your foot off the accelerator pedal,
    and do not brake.
- id: 290
  category: vehicle_information
  question: If the engine shuts off while you are driving, what should you do?
  choices:
    A: Shift to neutral, brake with steady pressure, and pull off the roadway
    B: Shift to park immediately to stop the vehicle
    C: Let go of the steering wheel as it will be locked and impossible to turn
    D: Pump the brakes rapidly and honk your horn
  answer: A
  explanation: If the engine shuts off while you are driving, keep a strong grip on
    the steering wheel, shift to neutral and look for an escape path, brake with steady
    pressure, slow down then pull off the roadway.
- id: 291
  category: vehicle_information
  question: What should you do if your accelerator pedal gets stuck in the down position?
  choices:
    A: Reach down and try to pull the pedal up with your hands while driving
    B: Shift to neutral, steer smoothly, brake gently, and pull off the roadway
    C: Turn off the ignition immediately while still in the lane of traffic
    D: Shift into a lower gear and apply the parking brake forcefully
  answer: B
  explanation: In the case of accelerator failure, shift to neutral and search for
    an escape path, steer smoothly, brake gently and pull off the roadway.
- id: 292
  category: defensive_driving
  question: If your wheels leave the pavement and drop off onto an uneven surface,
    why should you avoid braking hard?
  choices:
    A: It will damage your brake pads
    B: It can put your vehicle into a skid and make it difficult to steer
    C: It will cause your tires to blow out
    D: It will stall the engine
  answer: B
  explanation: When your wheels leave the pavement, do not brake hard, as this can
    put your vehicle into a skid and make it difficult to steer. Instead, gently apply
    the brakes.
- id: 293
  category: safe_driving_rules
  question: What is the recommended speed you should slow down to before attempting
    to return to the pavement after a drop-off?
  choices:
    A: 10 mph or less
    B: 15 mph or less
    C: 25 mph or less
    D: 35 mph or less
  answer: C
  explanation: If your wheels leave the pavement, you should steer straight ahead
    and slow to 25 mph or less before attempting to return to the roadway.
- id: 294
  category: vehicle_information
  question: How much should you turn the steering wheel to return to the pavement
    after an uneven surface drop-off?
  choices:
    A: About one quarter-turn
    B: About one half-turn
    C: A full 360-degree turn
    D: As sharply as possible
  answer: A
  explanation: When there is a gap in traffic from all directions, turn the steering
    wheel about one quarter-turn to return to the pavement. DO NOT OVERSTEER.
- id: 295
  category: defensive_driving
  question: Which type of crash is much more likely to result in serious injury or
    death compared to other types of crashes?
  choices:
    A: Rear-end collisions
    B: Sideswipes
    C: Rollovers
    D: Low-speed fender benders
  answer: C
  explanation: Rollovers are much more likely than most other types of crashes to
    result in serious injury or death, accounting for one of every three passenger
    vehicle occupant deaths.
- id: 296
  category: safe_driving_rules
  question: What percentage of all rollover crashes involve no other vehicle besides
    the one that rolls over?
  choices:
    A: Less than 20%
    B: About 40%
    C: Exactly 50%
    D: More than 80%
  answer: D
  explanation: Single vehicle crashes are more common for rollovers. More than 80%
    of all rollovers involve no other vehicle besides the one that rolls over.
- id: 297
  category: vehicle_information
  question: Why are sport utility vehicles (SUVs), vans, and pickups more likely to
    experience a rollover crash than passenger cars?
  choices:
    A: They have smaller tires
    B: They have higher centers of gravity
    C: They are driven at higher speeds
    D: They lack anti-lock braking systems
  answer: B
  explanation: Rollover crashes are more common for SUVs, vans, pickups, and small
    trucks due to their higher centers of gravity, which makes them top heavy and
    more likely to tip over.
- id: 298
  category: driver_responsibility
  question: What is the most effective way to reduce the risk of injury or death in
    a rollover crash?
  choices:
    A: Gripping the steering wheel tightly
    B: Using your safety belt
    C: Ducking below the dashboard
    D: Unlocking the doors
  answer: B
  explanation: The most effective way to reduce the risk of injury or death in a rollover
    is to use your safety belt. Without safety belts occupants can be thrown from
    the vehicle.
- id: 299
  category: vehicle_information
  question: When driving at night, your lower beam headlights will let you see clearly
    about how far ahead?
  choices:
    A: 50 to 100 feet
    B: 150 to 200 feet
    C: 250 to 300 feet
    D: 350 to 400 feet
  answer: B
  explanation: Your lower beam headlights will let you see clearly about 150 to 200
    feet ahead.
- id: 300
  category: safe_driving_rules
  question: What is the maximum safe driving speed when using your high beam headlights
    at night, which allow you to see 350 to 400 feet ahead?
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 75 mph
  answer: C
  explanation: Your high beam headlights will let you see clearly about 350 to 400
    feet ahead. Driving at a speed that allows you to stop within this distance is
    about 65 mph.
- id: 301
  category: defensive_driving
  question: How much should you increase your following distance when driving on unfamiliar
    roadways at night?
  choices:
    A: By at least one additional second
    B: By at least two additional seconds
    C: By at least three additional seconds
    D: By at least four additional seconds
  answer: B
  explanation: You need to increase your following distance by adding at least one
    additional second for night driving conditions and at least two additional seconds
    for driving on unfamiliar roadways at night.
- id: 302
  category: safe_driving_rules
  question: 'If you cannot see any farther than 100 feet ahead due to thick fog or
    heavy rain, you cannot safely drive faster than:'
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: When you cannot see any farther than 100 feet ahead due to rain, snow,
    blowing dust, smoke, or thick fog, you cannot safely drive faster than 30 mph.
- id: 303
  category: vehicle_information
  question: Which lights should you use for the best visibility when driving in fog,
    snow, or heavy rain during the day?
  choices:
    A: High beams
    B: Parking lights only
    C: Low beams and fog lights
    D: Emergency flashers
  answer: C
  explanation: When driving in fog, snow or heavy rain use your low beams and fog
    lights for best visibility, even during the day.
- id: 304
  category: sharing_the_road
  question: If the sun is directly behind you while driving, what hazard should you
    be aware of?
  choices:
    A: Your engine may overheat
    B: Oncoming drivers may not be able to see your turn signals or vehicle due to
      glare
    C: Your headlights will automatically turn off
    D: Your vehicle's stopping distance will increase
  answer: B
  explanation: If the sun is behind you, be aware that oncoming drivers may not be
    able to see your turn signals or your vehicle because of glare.
- id: 305
  category: safe_driving_rules
  question: What is the minimum following interval you should use under normal driving
    conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: B
  explanation: Use the minimum 3 second following interval, increasing the following
    interval by an additional second for any unusual weather or traffic conditions.
- id: 306
  category: safe_driving_rules
  question: If you are driving and a tire suddenly goes flat, what should you do?
  choices:
    A: Rapidly pump the brake pedal several times.
    B: Slow down gradually and do not brake.
    C: Press on the brake pedal as hard as you can.
    D: Steer sharply to the right side of the road.
  answer: B
  explanation: If a tire suddenly goes flat, you should slow down gradually and do
    not brake.
- id: 307
  category: sharing_the_road
  question: As a pedestrian, if there is no sidewalk available, where should you walk?
  choices:
    A: On the right side of the street with the flow of traffic.
    B: In the center of the road.
    C: On the left side of the street facing oncoming traffic.
    D: On the shoulder of the road in either direction.
  answer: C
  explanation: If there is no sidewalk, you should walk on the left side of the street
    facing the oncoming traffic.
- id: 308
  category: signs_and_signals
  question: What should a pedestrian do if the flashing "DON'T WALK" signal appears
    while they are already crossing the street?
  choices:
    A: Stop in the middle of the crosswalk and wait for the next signal.
    B: Turn around and go back to the starting curb.
    C: Run as fast as possible to the other side.
    D: Finish crossing the street.
  answer: D
  explanation: If the flashing "DON'T WALK" signal appears when you are crossing the
    street, you may finish crossing the street.
- id: 309
  category: sharing_the_road
  question: What is a driver's responsibility when a pedestrian is crossing the street
    outside of a crosswalk (jaywalking)?
  choices:
    A: Sound the horn and proceed without stopping.
    B: Yield and stop for the pedestrian.
    C: Swerve around the pedestrian.
    D: Maintain speed as the pedestrian does not have the right-of-way.
  answer: B
  explanation: You must yield to pedestrians always. Even if they are not in a crosswalk
    and crossing the street where they should not be (jaywalking), you must stop for
    them.
- id: 310
  category: sharing_the_road
  question: When a pedestrian is crossing a street guided by a dog or carrying a white
    cane, what must a driver do?
  choices:
    A: Slow down and proceed with caution.
    B: Honk to let the pedestrian know a vehicle is approaching.
    C: Come to a complete stop.
    D: Yield only if the pedestrian is in a marked crosswalk.
  answer: C
  explanation: You must always yield the right-of-way to persons who are visually
    impaired. When a pedestrian is crossing a street guided by a dog or carrying a
    white cane, you must come to a complete stop.
- id: 311
  category: sharing_the_road
  question: When approaching a stopped vehicle from behind on a multi-lane road, what
    should you do?
  choices:
    A: Pass the vehicle quickly on the left.
    B: Pass the vehicle quickly on the right.
    C: Sound your horn and pass the vehicle.
    D: Slow down and do not pass until you are sure there are no pedestrians crossing
      in front of it.
  answer: D
  explanation: When approaching a stopped vehicle from behind, slow down and do not
    pass until you are sure that there are no pedestrians crossing in front of it.
    This is true even on multi-lane roads.
- id: 312
  category: sharing_the_road
  question: How are bicyclists classified when used on roadways?
  choices:
    A: As pedestrians.
    B: As vehicles that must follow the same rules of the road as motorized vehicles.
    C: As recreational equipment with no specific road rules.
    D: As slow-moving hazards that must yield to all cars.
  answer: B
  explanation: Bicyclists are considered vehicles when used on roadways. They are
    expected to follow the same rules of the road as motorized vehicles.
- id: 313
  category: sharing_the_road
  question: On which side of the roadway are bicyclists generally required to ride?
  choices:
    A: The left side.
    B: The right side.
    C: The center lane.
    D: Any side they prefer.
  answer: B
  explanation: As a bicyclist, you are required to ride on the right side of the roadway.
- id: 314
  category: sharing_the_road
  question: Are bicyclists allowed to ride side-by-side in a single lane?
  choices:
    A: No, they must always ride single file.
    B: Yes, they are allowed to ride two abreast or two wide in a lane.
    C: Yes, but only on weekends.
    D: No, unless they are in a designated bike lane.
  answer: B
  explanation: Bicyclists are allowed to ride two abreast or two wide in a lane. Doing
    this creates a tight vehicular density so that cars may pass more efficiently.
- id: 315
  category: sharing_the_road
  question: Under the Dead Red Law, what may a bicyclist do if a traffic signal does
    not respond to their bicycle?
  choices:
    A: Ride onto the sidewalk and cross at the pedestrian crosswalk.
    B: Wait until a car arrives to trigger the signal.
    C: Cross the intersection after waiting a reasonable amount of time, without impeding
      cross-traffic.
    D: Turn right and make a U-turn to avoid the light.
  answer: C
  explanation: Under the Dead Red Law, if you reach an intersection and the traffic
    signal will not respond to your bicycle, after waiting what you determine is a
    reasonable amount of time, you may cross the intersection.
- id: 316
  category: sharing_the_road
  question: What lighting equipment is required for a bicyclist riding at dusk?
  choices:
    A: A taillight only.
    B: A headlight is required, and a taillight is highly recommended.
    C: Both a headlight and a flashing taillight are required.
    D: No lighting is required if wearing reflective clothing.
  answer: B
  explanation: Use of a headlight at dusk is required, but a taillight is highly recommended
    to give you further visibility.
- id: 317
  category: sharing_the_road
  question: If you are driving and about to make a right turn, and there is a bicyclist
    ahead of you, what should you do?
  choices:
    A: Speed up and pass the bicyclist immediately before the turn.
    B: Honk your horn to make the bicyclist yield.
    C: Slow down and let the cyclist clear the intersection before making your turn.
    D: Squeeze past the bicyclist in the same lane while turning.
  answer: C
  explanation: If you are about to make a right turn, you must not pass a bicyclist
    immediately before the turn. To avoid a collision, you should slow down and let
    the cyclist clear the intersection before making your turn.
- id: 318
  category: sharing_the_road
  question: Why should you avoid sounding your horn close to bicyclists unless there
    is a chance of a collision?
  choices:
    A: It is illegal to honk at bicyclists.
    B: It may startle them and cause them to steer into your path and crash.
    C: Bicyclists cannot hear horns over the wind.
    D: It will cause the bicyclist to stop suddenly.
  answer: B
  explanation: Do not sound your horn close to bicyclists unless there is a chance
    of a collision. Sounding your horn to alert your presence may startle them and
    cause them to steer into your path and crash.
- id: 319
  category: sharing_the_road
  question: How do wet, sandy, or gravel-covered roadways affect bicyclists compared
    to motor vehicles?
  choices:
    A: These conditions affect bicycles much more than vehicles, reducing their ability
      to brake or turn sharply.
    B: Bicycles handle these conditions better than motor vehicles.
    C: These conditions affect bicycles and motor vehicles equally.
    D: Bicycles are unaffected by sand or gravel.
  answer: A
  explanation: Like motor vehicles, bicycles cannot brake as quickly or turn as sharply
    under these conditions. These conditions affect bicycles much more than vehicles.
- id: 320
  category: sharing_the_road
  question: What is the 'Dutch Reach' method used for?
  choices:
    A: Signaling a left turn on a bicycle
    B: Safely exiting a vehicle by using your right hand to open the door
    C: Passing a bicyclist safely on a narrow road
    D: Checking blind spots while backing up
  answer: B
  explanation: The 'Dutch Reach' method entails using your right hand to pull the
    handle to open the door, which inherently turns your body to provide better visibility
    of traffic approaching from the rear, helping avoid collisions with bicyclists.
- id: 321
  category: signs_and_signals
  question: What do 'sharrows' on the pavement indicate?
  choices:
    A: A designated lane exclusively for bicycles
    B: A route with lower traffic volumes recommended for bicycles
    C: A recommendation of where in a lane a bicyclist should ride to flow easiest
      with traffic
    D: A pedestrian-only crossing zone
  answer: C
  explanation: Sharrows are road markers on the pavement that provide a recommendation
    of where in a lane a bicyclist should ride to flow easiest with other traffic.
- id: 322
  category: sharing_the_road
  question: Why might a bicyclist be unable to use hand signals when turning or stopping?
  choices:
    A: Hand signals are not legally required for bicyclists
    B: Road or traffic conditions may require them to keep both hands on the handlebars
    C: Bicycles are equipped with automatic turn signals
    D: Bicyclists only need to signal when riding in a designated bike lane
  answer: B
  explanation: Keep in mind that a bicyclist may be unable to signal if road or traffic
    conditions require them to keep both hands on the handlebars.
- id: 323
  category: sharing_the_road
  question: Which of the following is true regarding motorcycles and traffic lanes?
  choices:
    A: A motorcycle is only entitled to half of a traffic lane
    B: You may pass a motorcycle in the same lane if there is enough room
    C: Two motorcycles may share a single traffic lane
    D: Motorcycles must ride on the shoulder of the road
  answer: C
  explanation: Motorcycle/scooter/moped operators have the right to use a complete
    traffic lane, and two motorcycles/scooters/mopeds may share a lane. You should
    not pass them in the same lane.
- id: 324
  category: vehicle_information
  question: 'According to the manual, a motorized bicycle or moped has a maximum design
    speed of no more than:'
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: A motorized bicycle or moped has the capability of a maximum design
    speed of no more than 30 mph.
- id: 325
  category: defensive_driving
  question: 'Nearly 40 percent of crashes involving a motorcycle, scooter, or moped
    and another motor vehicle are caused by:'
  choices:
    A: The motorcycle tailgating the other vehicle
    B: The other vehicle turning left in front of the motorcycle
    C: The motorcycle passing on the right
    D: The other vehicle stopping suddenly
  answer: B
  explanation: Nearly 40 percent of crashes involving motorcycles/scooters/mopeds
    and another motor vehicle were caused by the other vehicle turning left in front
    of the motorcyclist/scooter/moped.
- id: 326
  category: safe_driving_rules
  question: If you see a motorcycle approaching with its turn signal flashing, what
    should you do?
  choices:
    A: Assume it is turning and proceed into its path
    B: Honk your horn to let the rider know you see them
    C: Do not pull out in front of it until you see that it is beginning to turn
    D: Speed up to cross the intersection before the motorcycle arrives
  answer: C
  explanation: Do not assume a motorcycle/scooter/moped is turning when you see its
    turn signal flashing, as they may not self-cancel. Do not pull out in front of
    them until you see that they are beginning to turn.
- id: 327
  category: safe_driving_rules
  question: What is the recommended following distance when driving behind a motorcycle,
    scooter, or moped in normal conditions?
  choices:
    A: 1 to 2 seconds
    B: 3 to 4 seconds
    C: 5 to 6 seconds
    D: 7 to 8 seconds
  answer: B
  explanation: When following a motorcyclist/scooter/moped, allow for a 3 to 4 second
    following distance or more in wet conditions.
- id: 328
  category: sharing_the_road
  question: Why must you always dim your headlights when approaching a motorcycle,
    scooter, or moped?
  choices:
    A: High beams will drain the motorcycle's battery
    B: The blinding effect of high beams can be far more dangerous to them due to
      their vulnerability
    C: It is a signal that you are about to pass them
    D: High beams will cause the motorcycle's engine to stall
  answer: B
  explanation: Always dim your headlights when approaching a motorcycle/scooter/moped.
    Because of their vulnerability, the blinding effect of your high beams can be
    far more dangerous to them than to drivers of motor vehicles.
- id: 329
  category: safe_driving_rules
  question: What must you do when you hear a siren or see an emergency vehicle approaching
    with flashing lights?
  choices:
    A: Speed up and clear the intersection quickly
    B: Stop immediately in your current lane
    C: Move to the right, pull over to the curb or edge of the road, and stop
    D: Move to the left lane and slow down
  answer: C
  explanation: When you hear a siren, or see a vehicle approaching with flashing lights,
    move to the right and pull over to the curb or edge of the road and stop.
- id: 330
  category: safe_driving_rules
  question: After an emergency vehicle with flashing lights passes you, how far away
    must you stay from it?
  choices:
    A: At least 100 feet
    B: At least 200 feet
    C: At least 300 feet
    D: At least 500 feet
  answer: D
  explanation: After the emergency vehicle passes, carefully look behind you for other
    vehicles, and when it is safe to do so return to the roadway. You must stay at
    least 500 feet away from the emergency vehicle.
- id: 331
  category: driver_responsibility
  question: If you are pulled over by law enforcement at night, what should you do
    to help the officer see inside your vehicle?
  choices:
    A: Turn on your high beam headlights
    B: Turn on your interior lights
    C: Shine a flashlight out the window
    D: Step out of the vehicle immediately
  answer: B
  explanation: Turn on your hazard flashers and if at night your interior lights to
    help the officer see that everything is in order inside the vehicle.
- id: 332
  category: driver_responsibility
  question: When pulled over by law enforcement, how should you handle providing your
    documents?
  choices:
    A: Have them in your hand before the officer approaches the window
    B: Reach for them quickly to save the officer's time
    C: Tell the officer where they are located and reach for them slowly with one
      hand on the wheel
    D: Toss them onto the passenger seat for the officer to inspect
  answer: C
  explanation: If the officer asks you for these documents, tell the officer where
    they are located and reach for them slowly with one hand on the wheel.
- id: 333
  category: safe_driving_rules
  question: Under the Move-Over Law, what must you do when approaching a stationary
    emergency vehicle displaying flashing lights?
  choices:
    A: Stop your vehicle and wait for instructions
    B: Honk your horn to alert the emergency workers
    C: Vacate the closest lane if safe, or slow to a safe speed for the conditions
    D: Maintain your speed but turn on your hazard lights
  answer: C
  explanation: State law requires drivers approaching a stationary emergency vehicle
    displaying flashing lights... to vacate the lane closest if safe and possible
    to do so, or slow to a speed safe for road, weather, and traffic conditions.
- id: 334
  category: sharing_the_road
  question: What should you do when a motorcycle, scooter, or moped is passing your
    vehicle?
  choices:
    A: Speed up to prevent them from cutting you off
    B: Maintain your lane position and speed
    C: Move onto the shoulder of the road
    D: Brake sharply to let them pass faster
  answer: B
  explanation: When a motorcycle/scooter/moped is passing your vehicle, you should
    maintain your lane position and speed. Allow them to complete the maneuver.
- id: 335
  category: safe_driving_rules
  question: What must a driver do when approaching a stationary emergency vehicle
    displaying flashing lights while traveling in the same direction?
  choices:
    A: Stop immediately and wait for instructions.
    B: Vacate the lane closest if safe, or slow to a safe speed.
    C: Honk to alert the emergency workers and maintain speed.
    D: Accelerate to pass the emergency vehicle quickly.
  answer: B
  explanation: State law requires drivers approaching a stationary emergency vehicle
    displaying flashing lights to vacate the lane closest if safe and possible to
    do so, or slow to a speed safe for road, weather, and traffic conditions.
- id: 336
  category: sharing_the_road
  question: In fatal crashes involving cars and commercial vehicles, police report
    that the car driver contributes to the cause of the crash what percentage of the
    time?
  choices:
    A: Less than 30%
    B: Exactly 50%
    C: More than 70%
    D: 100%
  answer: C
  explanation: According to the manual, in more than 70% of all fatal crashes involving
    cars and commercial vehicles, police report that the car driver contributed to
    the cause of the crash.
- id: 337
  category: sharing_the_road
  question: How can you tell if you are driving in a large truck's side blind spot?
  choices:
    A: You cannot see the truck's headlights in your rearview mirror.
    B: You cannot see the driver's face in the truck's side view mirror.
    C: The truck's turn signal is flashing.
    D: You are within 50 feet of the truck's rear bumper.
  answer: B
  explanation: 'The manual states regarding Side No-Zones: "If you cannot see the
    driver’s face in the side view mirror, they cannot see you."'
- id: 338
  category: safe_driving_rules
  question: When passing a large vehicle, when is it safe to pull back in front of
    it?
  choices:
    A: As soon as your rear bumper clears the truck's front bumper.
    B: When you can see the whole front of the vehicle in your rear-view mirror.
    C: When the truck driver flashes their headlights.
    D: After you have maintained your speed for 5 seconds.
  answer: B
  explanation: When passing a large vehicle, you should look for the whole front of
    the vehicle in your rear-view mirror before pulling in front and maintaining speed.
- id: 339
  category: sharing_the_road
  question: How far can the huge blind spot directly behind a large vehicle extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 150 feet
    D: Up to 200 feet
  answer: D
  explanation: Unlike cars, large vehicles have huge blind spots directly behind them
    that extend up to 200 feet.
- id: 340
  category: sharing_the_road
  question: Why might a large truck or bus swing wide to the left before making a
    right turn?
  choices:
    A: To safely clear the corner of a curb or other obstruction.
    B: To allow cars to pass them on the right.
    C: To build up enough speed to complete the turn.
    D: To check their right-side blind spot.
  answer: A
  explanation: When a truck or bus needs to make a right turn, they will sometimes
    swing wide to the left in order to safely turn right and clear the corner of a
    curb or other obstruction.
- id: 341
  category: defensive_driving
  question: When meeting a truck coming from the opposite direction, why should you
    keep as far as possible to the right side of the roadway?
  choices:
    A: To give the truck room to make a U-turn.
    B: To avoid wind turbulence that pushes the vehicles apart.
    C: To allow the truck driver to see your license plate.
    D: To prepare to pull over and stop.
  answer: B
  explanation: You should keep as far as possible to the right side of the roadway
    to avoid a side swept crash and to reduce the wind turbulence between the two
    vehicles, which pushes the vehicles apart.
- id: 342
  category: signs_and_signals
  question: What is the purpose of stop lines at many intersections?
  choices:
    A: To indicate where pedestrians are allowed to cross.
    B: To set vehicles farther back to give larger vehicles more turning space.
    C: To mark the beginning of a school zone.
    D: To show where the speed limit changes.
  answer: B
  explanation: Stop lines help to set you farther back at an intersection to give
    larger vehicles more turning space. Always stop behind stop lines.
- id: 343
  category: safe_driving_rules
  question: What is the purpose of runaway ramps on long downgrades?
  choices:
    A: For slow-moving vehicles to pull over and let others pass.
    B: For large vehicles that are out of control or cannot stop due to brake failure.
    C: For emergency vehicles to park and monitor traffic.
    D: For drivers to safely check their cargo and tires.
  answer: B
  explanation: These ramps are to be used only by large vehicles that are out of control
    or cannot stop because of brake failure. Never stop or park in the area of these
    ramps.
- id: 344
  category: safe_driving_rules
  question: At what maximum speed may you pass a safety zone set aside for pedestrians
    boarding trolleys and light rail vehicles, once it is safe to do so?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: You may pass the safety zone as soon as it is safe to do so and at
    no faster than 10 mph.
- id: 345
  category: safe_driving_rules
  question: When are you permitted to overtake and pass on the left of a trolley or
    light rail vehicle?
  choices:
    A: Whenever the trolley is moving slower than the speed limit.
    B: Only when you are on a one-way street or directed by a traffic officer.
    C: Whenever the trolley is stopped to pick up passengers.
    D: You are never allowed to pass a trolley on the left.
  answer: B
  explanation: Do not overtake and pass on the left of a trolley or light rail vehicle...
    except when you are on a one-way street. When the tracks are so close to the right
    side of the road that you cannot pass on the right, or when a traffic officer
    directs you, pass on the left.
- id: 346
  category: signs_and_signals
  question: What does a fluorescent or reflective orange and red triangle displayed
    on the rear of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle is traveling less than 25 mph.
    C: The vehicle is an emergency responder.
    D: The vehicle is making wide right turns.
  answer: B
  explanation: A fluorescent or reflective orange and red triangle displayed on the
    rear of vehicles drawn by animals, farm equipment or construction equipment means
    the vehicle is traveling less than 25 mph.
- id: 347
  category: sharing_the_road
  question: What is the normal speed range for animal-drawn vehicles?
  choices:
    A: 5 to 8 miles per hour
    B: 10 to 15 miles per hour
    C: 15 to 20 miles per hour
    D: 20 to 25 miles per hour
  answer: A
  explanation: Normal speeds for animal drawn vehicles range between 5 and 8 miles
    per hour.
- id: 348
  category: sharing_the_road
  question: Why should you avoid using your horn or "revving" your engine when passing
    an animal-drawn vehicle or horseback rider?
  choices:
    A: It is illegal to use a horn in rural areas.
    B: It may scare the animal and cause a crash.
    C: It will cause the animal to stop moving completely.
    D: It violates noise ordinance laws.
  answer: B
  explanation: Pass with caution and do not use your horn or "rev" the engine because
    this may scare the horse and cause a crash.
- id: 349
  category: sharing_the_road
  question: What should you do if you are driving a slow-moving vehicle on a two-way,
    single-lane roadway and causing vehicles behind you to slow down significantly?
  choices:
    A: Speed up to match the flow of traffic.
    B: Pull to the side of the roadway when safe to let other vehicles pass.
    C: Turn on your hazard lights and remain in the center of the lane.
    D: Wave the vehicles behind you to pass on the shoulder.
  answer: B
  explanation: If you are driving a slow-moving vehicle and must drive so slowly that
    other vehicles have to reduce speed to the rear, pull to the side of the roadway
    when safe to do so and let the other vehicles pass.
- id: 350
  category: sharing_the_road
  question: 'If a truck or bus needs to make a right turn and you are also turning
    right, you should:'
  choices:
    A: Quickly turn right before the truck or bus does.
    B: Squeeze between the truck or bus and the curb.
    C: Wait until the truck or bus turns before turning right.
    D: Honk your horn to let the driver know you are there.
  answer: C
  explanation: If a truck or bus needs to make a right turn and you are also turning
    right, you must wait until the truck or bus turns before turning right.
- id: 351
  category: sharing_the_road
  question: If a pedestrian is crossing in the middle of the street, not at a crosswalk
    (jaywalking), what must you do?
  choices:
    A: You must stop for them.
    B: You do not have to stop for them.
    C: You should honk your horn and maintain your speed.
    D: Swerve into the oncoming lane to avoid them.
  answer: A
  explanation: Even if a pedestrian is crossing in the middle of the street (jaywalking)
    and it is illegal, you must stop for them.
- id: 352
  category: sharing_the_road
  question: 'Motorcycle operators have the right to:'
  choices:
    A: Share a traffic lane with another vehicle.
    B: Use the shoulder of a roadway to pass.
    C: Use a complete traffic lane.
    D: Drive between lanes of stopped traffic.
  answer: C
  explanation: Motorcycle operators have the right to use a complete traffic lane.
- id: 353
  category: safe_driving_rules
  question: How should you adjust your driving when traveling on gravel or dirt roads
    compared to paved roads?
  choices:
    A: Increase your speed to maintain traction.
    B: Reduce your speed and increase your following distance.
    C: Decrease your following distance to see the road better.
    D: Pump your brakes continuously to prevent skidding.
  answer: B
  explanation: When driving on gravel or dirt, you must reduce your speed and increase
    your following distance, since it will take much longer to stop due to loss of
    traction.
- id: 354
  category: safe_driving_rules
  question: During dry periods, gravel roads can become extremely dusty, reducing
    vision. What headlights should you use in this situation?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Fog lights only
  answer: B
  explanation: During dusty conditions on gravel roads, it is recommended that you
    use low beam headlights to make your vehicle more visible to others, slow down
    and increase your following distance.
- id: 355
  category: defensive_driving
  question: 'When driving over open bridge gratings or steel bridges, you should:'
  choices:
    A: Accelerate quickly to cross the bridge faster.
    B: Loosen your grip on the steering wheel.
    C: Keep a firm grip on the steering wheel and increase your following distance.
    D: Change lanes frequently to find the best traction.
  answer: C
  explanation: Due to reduced traction on open bridge gratings or steel bridges, you
    should keep a firm grip on the steering wheel and increase your following distance.
- id: 356
  category: safe_driving_rules
  question: Many highway-railroad grade crossings on rural roads are marked only with
    a warning sign and a white X-shaped sign. What should you do when approaching
    one?
  choices:
    A: Maintain your speed unless you see a train.
    B: Slow down, look both ways, and be prepared to stop.
    C: Honk your horn before crossing the tracks.
    D: Speed up to clear the tracks quickly.
  answer: B
  explanation: Many highway-railroad grade crossings on rural roads typically do not
    have lights or crossing gates; therefore, you should always slow down, look both
    ways and be prepared to stop for a train before crossing.
- id: 357
  category: safe_driving_rules
  question: At what distance should you dim your high beam headlights when an oncoming
    vehicle is approaching?
  choices:
    A: Within about a one-block distance.
    B: Within 100 feet.
    C: Within 500 feet.
    D: Only when the other driver flashes their lights.
  answer: A
  explanation: You should dim your high beams whenever you come within about a one-block
    distance of an oncoming vehicle.
- id: 358
  category: defensive_driving
  question: If an oncoming vehicle fails to dim their high beam headlights, where
    should you look to keep from being blinded?
  choices:
    A: Directly at the oncoming headlights.
    B: Toward the left side of the road.
    C: Toward the right side of the road.
    D: At your rearview mirror.
  answer: C
  explanation: If a driver fails to dim their lights, look toward the right side of
    the road to keep from being blinded by their headlights.
- id: 359
  category: safe_driving_rules
  question: In which of the following situations should you use your low beam headlights
    instead of high beams?
  choices:
    A: When driving on an empty rural highway.
    B: When following another vehicle or in heavy traffic.
    C: When there are no oncoming vehicles.
    D: When you want to see twice as far down the road.
  answer: B
  explanation: Use your low beams when following another vehicle, in heavy traffic,
    in fog, or when it is snowing or raining hard. Light from high beams will reflect,
    causing glare.
- id: 360
  category: defensive_driving
  question: How much water does it take to reach the bottom of most passenger cars,
    potentially causing loss of control or stalling?
  choices:
    A: 2 inches
    B: 6 inches
    C: 12 inches
    D: 2 feet
  answer: B
  explanation: Remember, 6 inches of water will reach the bottom of most passenger
    cars, causing loss of control or possible stalling.
- id: 361
  category: defensive_driving
  question: How much rushing water can carry away most vehicles?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 2 feet
  answer: D
  explanation: 2 feet of rushing water can carry away most vehicles.
- id: 362
  category: signs_and_signals
  question: What color are all temporary signs in highway work zones?
  choices:
    A: Yellow background with black letters
    B: Orange background with black letters or symbols
    C: White background with red letters
    D: Green background with white letters
  answer: B
  explanation: All temporary signs in work zones have an orange background and black
    letters or symbols and tell you what to do.
- id: 363
  category: safe_driving_rules
  question: When approaching a work zone that requires a lane change, when should
    you merge into the appropriate lane?
  choices:
    A: As soon as possible at the first notice of the approaching work zone.
    B: Right before the lane closure begins.
    C: After passing the first orange warning sign.
    D: Whenever the vehicle ahead of you merges.
  answer: A
  explanation: Merge as soon as possible. Motorists can help maintain traffic flow
    and posted speeds by moving to the appropriate lane at first notice of an approaching
    work zone.
- id: 364
  category: safe_driving_rules
  question: What should you do when you first notice an approaching work zone?
  choices:
    A: Speed up to get through the area quickly
    B: Move to the appropriate lane to maintain traffic flow
    C: Stop and wait for a pilot car to guide you
    D: Turn on your high beam headlights
  answer: B
  explanation: The manual states to maintain traffic flow and posted speeds by moving
    to the appropriate lane at first notice of an approaching work zone.
- id: 365
  category: safe_driving_rules
  question: How should you adjust your driving when passing through a mobile work
    zone?
  choices:
    A: Resume normal speed as soon as you pass the workers
    B: Honk your horn to warn workers of your presence
    C: Observe the posted signs until you see the one that says 'End Road Work'
    D: Pull over to the shoulder until the mobile work zone has moved on
  answer: C
  explanation: The manual states that for mobile work zones, you should observe the
    posted signs until you see the one that says, 'End Road Work,' because workers
    may still be present even if you don't see them immediately.
- id: 366
  category: defensive_driving
  question: If an animal suddenly runs in front of your vehicle and a collision is
    inevitable, what is the safest alternative?
  choices:
    A: Swerve into oncoming traffic
    B: Swerve off the roadway
    C: Hit the animal while retaining control of the vehicle
    D: Lock your brakes to stop immediately
  answer: C
  explanation: The manual states that if a collision is inevitable, do not swerve
    to avoid the animal. The safest alternative may be hitting the animal while concentrating
    on keeping your vehicle under control and on the roadway.
- id: 367
  category: defensive_driving
  question: During which months are animals most active, requiring extra caution from
    drivers?
  choices:
    A: January through March
    B: April through June
    C: July through September
    D: October through December
  answer: D
  explanation: The manual advises using caution when driving at dawn and dusk and
    between the months of October through December, when animals are most active.
- id: 368
  category: defensive_driving
  question: What should you do if a dog runs out onto the roadway and begins chasing
    your vehicle?
  choices:
    A: Stop your vehicle completely
    B: Swerve sharply to scare the dog away
    C: Slow down until the dog is near, then accelerate away
    D: Honk your horn continuously
  answer: C
  explanation: The manual states that dogs chasing vehicles tend to approach in a
    straight line. You should slow down until the dog is near your vehicle, then accelerate
    away from the dog as it approaches.
- id: 369
  category: defensive_driving
  question: If you think you have time to avoid hitting a deer in the road, why might
    you flash your headlights?
  choices:
    A: To signal the deer to move out of the way
    B: Because deer tend to fixate on headlights and flashing them may cause the animal
      to freeze
    C: To blind the deer so it cannot run toward you
    D: To alert oncoming traffic to stop
  answer: B
  explanation: The manual notes that deer tend to fixate on headlights, so flashing
    them may cause the animal to freeze in the road, potentially helping you avoid
    a collision.
- id: 370
  category: driver_testing
  question: What is the minimum passing score for the driver's knowledge test?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: According to the manual, you must score an 80% to pass the knowledge
    test.
- id: 371
  category: driver_testing
  question: If you fail the knowledge test for the 4th time, how long must you wait
    before starting the process again?
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: C
  explanation: The manual states that if you fail to pass the 4th time, you will be
    required to wait 6 months from the most recent failed exam before starting the
    process again.
- id: 372
  category: license_system
  question: If you are under 17 years old, how long must you hold your Instruction
    Permit before you are eligible to take the Driver's License Test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: One full year or until reaching age 17
  answer: D
  explanation: If you are under 17 years old, you must hold your Instruction Permit
    for one full year or until reaching age 17 whichever comes first, before you are
    eligible to take the Driver's License Test.
- id: 373
  category: safe_driving_rules
  question: Which way should your wheels face when parking uphill with a curb?
  choices:
    A: Towards the curb
    B: Straight forward
    C: Away from the curb
    D: Parallel to the curb
  answer: C
  explanation: According to the sample questions in the manual, when parking uphill
    with a curb, your wheels should face away from the curb.
- id: 374
  category: safe_driving_rules
  question: 'When passing another vehicle, you should continue to pass until:'
  choices:
    A: You look in your side mirror and see the vehicle is behind you
    B: The complete front of the passed vehicle is visible in your rearview mirror
    C: The driver you just passed signals you to move over
    D: You are one car length ahead of the passed vehicle
  answer: B
  explanation: The manual's sample questions indicate you should continue to pass
    another vehicle until the complete front of the passed vehicle is visible in your
    rearview mirror.
- id: 375
  category: safe_driving_rules
  question: Why is it important to stop at stop lines at an intersection?
  choices:
    A: To give larger vehicles more turning space
    B: So the traffic light changes faster
    C: To give pedestrians more room to walk
    D: To avoid triggering red light cameras
  answer: A
  explanation: According to the manual's sample questions, it is important to stop
    at stop lines to give larger vehicles more turning space.
- id: 376
  category: safe_driving_rules
  question: When are roadways generally more slippery?
  choices:
    A: When it first starts to rain, snow or sleet
    B: When it has been raining, snowing, or sleeting for a while
    C: When it has just stopped raining, snowing, or sleeting
    D: When the sun comes out after a rainstorm
  answer: A
  explanation: The manual states that roadways are more slippery when it first starts
    to rain, snow or sleet.
- id: 377
  category: safe_driving_rules
  question: What should you do if your vehicle stalls when crossing railroad tracks
    and a train is approaching?
  choices:
    A: Run across the tracks as far away as possible
    B: Run in the direction from which the train is approaching
    C: Run in the opposite direction from which the train is approaching
    D: Stay in the vehicle and call 911
  answer: B
  explanation: The manual's sample questions advise that if your vehicle stalls on
    railroad tracks, you should run in the direction from which the train is approaching
    to avoid being struck by debris from the collision.
- id: 378
  category: driver_testing
  question: During the pre-trip inspection for the driving test, what will you NOT
    be required to do?
  choices:
    A: Walk around the vehicle
    B: Point to or touch each item being inspected
    C: Open the hood or crawl under the vehicle
    D: Explain to the examiner what you are checking
  answer: C
  explanation: The manual states that during the pre-trip inspection, you may have
    to walk around the vehicle, point to or touch items, and explain what you are
    checking, but you will NOT have to open the hood or crawl under the vehicle.
- id: 379
  category: vehicle_information
  question: Where can you find the recommended tire pressure (psi) for your vehicle?
  choices:
    A: On the sidewall of the tire
    B: In the vehicle owner's manual or the driver's side door jamb
    C: On the dashboard indicator lights
    D: On the inside of the glove compartment door
  answer: B
  explanation: To check tire pressure, the manual advises using the recommended psi
    located in the vehicle owner's manual or the driver's side door jamb of the vehicle.
- id: 380
  category: vehicle_information
  question: How do you perform the 'penny test' to check your tire's tread depth?
  choices:
    A: Place the penny flat against the tire sidewall
    B: Place Lincoln's head into one of the lowest grooves of the tread
    C: Place the Lincoln Memorial side facing up in the tread
    D: Drop the penny from the top of the tire and see if it bounces
  answer: B
  explanation: The 'penny test' is performed by holding Abraham Lincoln's body between
    your thumb and forefinger and placing Lincoln's head into one of the lowest grooves
    of the tire tread.
- id: 381
  category: vehicle_information
  question: What is a potential consequence of driving with over-inflated tires?
  choices:
    A: Increased effect of hydroplaning
    B: Reduced cornering ability
    C: Increased chance of tread separation and tire failure
    D: Excessive heat buildup due to increased flexing
  answer: C
  explanation: According to the manual, over inflation increases the chance of tread
    separation and tire failure.
- id: 382
  category: vehicle_information
  question: Why is it important to check under the vehicle for puddles or dripping
    fluids before driving?
  choices:
    A: To ensure the air conditioning condensation is draining properly
    B: Fluid loss could indicate component failure in the transmission or fuel systems
    C: To check if the windshield washer fluid is full
    D: To verify that the tire pressure is correct
  answer: B
  explanation: It is important to look for leaks because fluid loss could indicate
    component failure in areas where levels might not be readily checked, such as
    the transmission or fuel systems.
- id: 383
  category: safe_driving_rules
  question: What must you NEVER do when checking your vehicle's coolant?
  choices:
    A: Check the coolant level next to the radiator
    B: Fill it with a coolant/water solution
    C: Open the radiator cap on a hot car
    D: Check the driver's manual for the proper coolant ratio
  answer: C
  explanation: 'The manual explicitly warns: ''Never open the radiator cap on a hot
    car! Wait until the car has cooled down first.'''
- id: 384
  category: driver_testing
  question: If the outside temperature is over 85°F during your driving exam, what
    is required of your vehicle?
  choices:
    A: The passenger window must roll down
    B: The air conditioner must work properly
    C: The heater must be disabled
    D: The windshield wipers must be turned on
  answer: B
  explanation: For a vehicle used for the driving exam, if the outside temperature
    is over 85°F, the air conditioner must work properly.
- id: 385
  category: safe_driving_rules
  question: How should a safety belt be properly placed on your body?
  choices:
    A: Across your stomach and neck
    B: Across your hips and shoulder
    C: Loosely over your lap and behind your back
    D: Tightly across your thighs and under your arm
  answer: B
  explanation: When checking your safety belt, you must make sure it is not ripped
    or frayed and properly place the safety belt across your hips and shoulder.
- id: 386
  category: vehicle_information
  question: Why is it important to check that your vehicle's defroster is working
    properly?
  choices:
    A: It cools the engine during hot weather
    B: It improves visibility, especially during cold weather
    C: It prevents the engine from freezing
    D: It clears dirt and debris from the outside of the windshield
  answer: B
  explanation: It is important to make sure your defroster is working properly because
    it improves visibility, especially during cold weather.
- id: 387
  category: vehicle_information
  question: How can you test if your vehicle's defroster is working during an inspection?
  choices:
    A: Activate the fan and place your hand over the dashboard's vent
    B: Turn on the windshield wipers and spray washer fluid
    C: Open all windows and check for airflow
    D: Check the coolant level in the radiator
  answer: A
  explanation: You can test the defroster by activating the fan and placing your hand
    over the dashboard's vent to ensure it is working properly.
- id: 388
  category: vehicle_information
  question: What is the primary purpose of checking your dashboard indicator lights?
  choices:
    A: To ensure the radio is receiving power
    B: To warn you if external lights like turn signals and high beams are active
      when not appropriate
    C: To measure the exact amount of fuel left in the tank
    D: To check the tire pressure from inside the car
  answer: B
  explanation: It is important to make sure your indicator lights work because they
    help to warn you if external lights, such as turn signals and high beams, are
    still active when not appropriate.
- id: 389
  category: safe_driving_rules
  question: What happens if your tire tread gets below the safe amount indicated by
    the 'penny test'?
  choices:
    A: Your car's ability to grip the road in adverse conditions is greatly reduced
    B: Your vehicle will automatically fail the emissions test
    C: The tires will become over-inflated
    D: Your fuel efficiency will increase significantly
  answer: A
  explanation: The manual states that if your tread gets below the safe amount (where
    Lincoln's head is covered), your car's ability to grip the road in adverse conditions
    is greatly reduced.
- id: 390
  category: driver_testing
  question: When practicing the pre-trip inspection with a parent, guardian, or friend,
    what are the requirements for that person?
  choices:
    A: They must be a certified driving instructor
    B: They must be properly licensed and over the age of 21
    C: They must own the vehicle being inspected
    D: They must have a commercial driver's license (CDL)
  answer: B
  explanation: The manual advises practicing the inspection with a parent/guardian
    or friend who is properly licensed and over the age of 21.
- id: 391
  category: vehicle_information
  question: What is a consequence of low tire inflation or lack of tread?
  choices:
    A: Decreased stopping distance
    B: Increased cornering ability
    C: Increased effect of hydroplaning
    D: Decreased chance of blowout
  answer: C
  explanation: Low inflation or lack of tread increases the effect of hydroplaning,
    reduces cornering ability, and increases the chance of blowout from excessive
    heat buildup.
- id: 392
  category: vehicle_information
  question: What should you do if only one of your brake lights is working when you
    test them?
  choices:
    A: Continue driving as long as one light works.
    B: Replace the bulb or fuse, or get a professional to do it.
    C: Press the brake pedal harder to activate the second light.
    D: Use your turn signals to indicate you are stopping.
  answer: B
  explanation: The manual states that if a friend does not see both brake lights when
    you step on the pedal, you should replace the bulb or fuse, or get a professional
    to do it.
- id: 393
  category: driver_testing
  question: When practicing for the basic vehicle control skills test, the licensed
    parent, guardian, or friend accompanying you must be over what age?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: The manual instructs drivers to practice these exercises with a parent/guardian
    or friend who is properly licensed and over the age of 21.
- id: 394
  category: driver_testing
  question: During the basic control skills test, what constitutes a 'reversal' error?
  choices:
    A: Stopping without changing direction.
    B: Looking over your shoulder while backing up.
    C: Failing to use a turn signal while backing.
    D: Stopping and reversing direction to get a better position.
  answer: D
  explanation: A reversal is defined as when you stop and reverse direction to get
    a better position. Stopping without changing direction does not count as a reversal.
- id: 395
  category: driver_testing
  question: Which part of your vehicle is allowed to touch or cross over an exercise
    boundary line or cone without being counted as an encroachment?
  choices:
    A: The tires
    B: The bumpers
    C: The vehicle's mirrors
    D: The exhaust pipe
  answer: C
  explanation: Touching or crossing over an exercise boundary line or cone with any
    part of your vehicle, other than the vehicle's mirrors, is considered an encroachment.
- id: 396
  category: driver_testing
  question: If your turn signal cancels automatically while performing a basic control
    skills exercise, what must you do?
  choices:
    A: Leave it off since the examiner already saw it.
    B: Reactivate it when necessary.
    C: Use hand signals instead.
    D: Stop the vehicle and restart the exercise.
  answer: B
  explanation: The manual states that if your turn signal cancels automatically during
    an exercise, you must make sure to reactivate it when necessary.
- id: 397
  category: driver_testing
  question: When performing a parallel parking exercise, how close must you bring
    the vehicle to the curb side of the space?
  choices:
    A: Within 6 inches
    B: Within 12 inches
    C: Within 18 inches
    D: Within 24 inches
  answer: B
  explanation: For both right-side and left-side parallel parking, you must bring
    the vehicle within 12 inches of the curb side of the space without crossing boundaries.
- id: 398
  category: safe_driving_rules
  question: When stopping behind another vehicle at an intersection or before a turn,
    what is considered a safe gap?
  choices:
    A: One car length
    B: Two car lengths
    C: Stopping where you can see the rear tires of the vehicle ahead of you
    D: Stopping where you can see the driver's face in their rearview mirror
  answer: C
  explanation: A safe gap when stopping behind another vehicle is to stop where you
    can see the rear tires of the vehicle ahead of you.
- id: 399
  category: safe_driving_rules
  question: If you must stop before making a turn, how should you position your front
    wheels while waiting?
  choices:
    A: Turned slightly to the right
    B: Turned slightly to the left
    C: Aimed straight ahead
    D: Turned in the direction of your intended turn
  answer: C
  explanation: The manual states that if you must stop before making a turn, you should
    keep the front wheels aimed straight ahead.
- id: 400
  category: safe_driving_rules
  question: What rule applies to changing lanes while driving through an intersection?
  choices:
    A: You may change lanes if you use a turn signal.
    B: You may change lanes if the intersection is clear.
    C: Do not change lanes while proceeding through the intersection.
    D: You must change lanes to the right-most lane while in the intersection.
  answer: C
  explanation: 'When driving through an intersection, the manual explicitly states:
    ''Do not change lanes while proceeding through the intersection.'''
- id: 401
  category: safe_driving_rules
  question: After completing a turn or passing through an intersection with multiple
    lanes, which lane should you move into when it is safe to do so?
  choices:
    A: The left-most lane
    B: The center lane
    C: The right-most lane
    D: The lane with the fastest traffic
  answer: C
  explanation: After a turn or intersection, you should check your blind spots and
    mirrors, and move into the right-most lane when it is safe to do so (if not already
    there).
- id: 402
  category: driver_testing
  question: In a Forward Two-point Turnabout exercise, after pulling forward into
    a driveway or alley, what is your next step?
  choices:
    A: Back the vehicle to the left into the street.
    B: Back the vehicle to the right into the street.
    C: Execute a U-turn within the alley.
    D: Drive forward through the alley to the next street.
  answer: B
  explanation: In the Forward Two-point Turnabout, you pull forward into a driveway
    or alley, and then you will back the vehicle to the right into the street.
- id: 403
  category: driver_testing
  question: What is the first step in performing a Reverse Two-point Turnabout?
  choices:
    A: Drive forward into the driveway or alley.
    B: Drive past the entrance to a driveway or alley.
    C: Back directly into the nearest intersection.
    D: Execute a three-point turn in the middle of the road.
  answer: B
  explanation: For a Reverse Two-point Turnabout, you are asked to drive past the
    entrance to a driveway or alley and then back to the right into the street or
    alley.
- id: 404
  category: driver_testing
  question: During the on-road driving test, which of the following is true regarding
    the examiner's instructions?
  choices:
    A: The examiner will try to trick you into making an illegal maneuver.
    B: You will be asked to drive in an unsafe manner to test your reflexes.
    C: Directions will be given with plenty of time to do what the examiner has asked.
    D: The examiner will not give you any directions until the last second.
  answer: C
  explanation: 'The manual states: ''Directions will be given to you so you will have
    plenty of time to do what the examiner has asked. You will not be asked to drive
    in an unsafe manner.'''
- id: 405
  category: driver_testing
  question: During the basic control skills test, when must you perform head and traffic
    checks?
  choices:
    A: Only when the examiner explicitly reminds you.
    B: Prior to entering or exiting a roadway or exercise area.
    C: Only when backing up.
    D: Only when parallel parking.
  answer: B
  explanation: When performing an exercise, it is important to check traffic prior
    to entering or exiting a roadway. You must make sure the roadway is clear before
    entering back into traffic or leaving the exercise area.
- id: 406
  category: driver_testing
  question: What happens if you do not maneuver the vehicle into its exact final position
    as instructed by the examiner during a skills exercise?
  choices:
    A: You will automatically fail the entire test.
    B: Points will be added to your score.
    C: You will be asked to repeat the exercise until you get it right.
    D: The examiner will take control of the steering wheel.
  answer: B
  explanation: 'Under the ''Final Position'' scoring section, it states: ''If you
    do not maneuver the vehicle into its final position as described by the examiner,
    points will be added to your score.'''
- id: 407
  category: safe_driving_rules
  question: Are you allowed to change lanes while proceeding through an intersection?
  choices:
    A: Yes, if you use a turn signal.
    B: Yes, if the lane is clear of traffic.
    C: No, you should not attempt lane changes at intersections.
    D: Only when you are preparing to make a right turn.
  answer: C
  explanation: 'The manual states: ''Do not change lanes while proceeding through
    the intersection'' and ''Do not attempt lane changes at intersections.'''
- id: 408
  category: safe_driving_rules
  question: When entering an expressway, which of the following actions should you
    avoid?
  choices:
    A: Using your turn signal.
    B: Checking your blind spots by looking over your shoulder.
    C: Stopping or crossing over any solid painted lines.
    D: Increasing your speed to merge smoothly.
  answer: C
  explanation: When entering an expressway, you should smoothly merge into the proper
    lane of traffic without stopping or crossing over any solid painted lines.
- id: 409
  category: vehicle_information
  question: When approaching a curve, when is the best time to reduce your speed?
  choices:
    A: While in the middle of the curve.
    B: Before entering the curve.
    C: After you have exited the curve.
    D: You should accelerate through the curve instead of braking.
  answer: B
  explanation: Before entering the curve, you should reduce your speed so further
    braking is not required while in the curve.
- id: 410
  category: driver_testing
  question: What is the proper hand position on the steering wheel during the road
    test?
  choices:
    A: One hand on the wheel and one on the gear shift.
    B: Both hands on the inside spokes of the wheel.
    C: Both hands on the outside of the steering wheel at all times.
    D: One hand at the 12 o'clock position.
  answer: C
  explanation: You must keep both hands on the outside of the steering wheel at all
    times unless using other controls. Both hand-over-hand and hand-to-hand methods
    are acceptable.
- id: 411
  category: safe_driving_rules
  question: When completing a right turn on a multiple lane road, which lane should
    you finish the turn in?
  choices:
    A: The left-most lane.
    B: The center lane.
    C: Any lane that is open.
    D: The right-most (curb) lane.
  answer: D
  explanation: According to proper lane usage rules, you should finish a right turn
    in the right-most (curb) lane.
- id: 412
  category: defensive_driving
  question: When stopping behind another vehicle at an intersection, how much space
    should you leave?
  choices:
    A: Exactly one car length.
    B: Enough space to see the rear wheels of the vehicle in front of you.
    C: Three to four feet of space.
    D: Enough space to see the driver's head in their rearview mirror.
  answer: B
  explanation: When stopping behind another vehicle, make sure you can see the rear
    wheels of the vehicle in front of you to maintain a safe distance.
- id: 413
  category: driver_testing
  question: Which of the following actions will result in an automatic failure on
    your road exam?
  choices:
    A: Asking the examiner to repeat an instruction.
    B: Using the hand-over-hand steering method.
    C: Failing to check your blind spots.
    D: Braking smoothly at a stop sign.
  answer: C
  explanation: Not checking your blind spots during the road exam is listed as an
    automatic failure.
- id: 414
  category: driver_testing
  question: 'During the road exam, putting your vehicle over sidewalks or curbs unnecessarily
    will result in:'
  choices:
    A: A warning from the examiner.
    B: A two-point deduction.
    C: An automatic failure.
    D: A requirement to repeat the maneuver.
  answer: C
  explanation: Putting the vehicle over sidewalks or curbs unnecessarily is an automatic
    failure on the road exam.
- id: 415
  category: defensive_driving
  question: If one person will be doing all the driving on a trip, what is the recommended
    daily driving limit?
  choices:
    A: 4 to 5 hours.
    B: 6 to 8 hours.
    C: 10 to 11 hours.
    D: 12 to 14 hours.
  answer: B
  explanation: If one person will be doing all the driving, 6 to 8 hours of driving
    in any one day should be considered the limit.
- id: 416
  category: defensive_driving
  question: 'When two or more persons can share the driving on a trip, total driving
    time in one day should not exceed:'
  choices:
    A: 8 to 9 hours.
    B: 10 to 11 hours.
    C: 14 to 15 hours.
    D: 16 to 18 hours.
  answer: B
  explanation: When two or more persons can share the driving, total driving time
    should not exceed 10 to 11 hours.
- id: 417
  category: defensive_driving
  question: When driving on major highways, how often should you take a 10 to 15-minute
    break?
  choices:
    A: Every hour.
    B: Every 2 to 3 hours.
    C: Every 4 to 5 hours.
    D: Only when you need to refuel.
  answer: B
  explanation: The manual recommends taking 10 to 15-minute breaks every 2 to 3 hours
    when driving on major highways.
- id: 418
  category: safe_driving_rules
  question: When stopping at a stop sign or traffic signal, where should you stop
    your vehicle?
  choices:
    A: Over the marked stop line so you can see cross traffic.
    B: Inside the pedestrian crosswalk.
    C: Before the marked stop line, crosswalk, or sidewalk.
    D: Slightly into the intersection.
  answer: C
  explanation: When stopping at a stop sign or traffic signal, do not stop over a
    marked stop line, pedestrian crosswalk, sidewalk, or other marker, and do not
    stop in the intersection.
- id: 419
  category: defensive_driving
  question: According to the manual, after what time are you more apt to fall asleep
    while driving?
  choices:
    A: 8 p.m.
    B: 9 p.m.
    C: 10 p.m.
    D: 11 p.m.
  answer: D
  explanation: You should avoid driving after dark when visibility is limited and
    particularly after 11 p.m. when you are more apt to fall asleep while driving.
- id: 420
  category: vehicle_information
  question: What is a 'head check' when preparing to change lanes?
  choices:
    A: Looking in your rearview mirror.
    B: Looking over your shoulder to check your blind spots.
    C: Nodding to the examiner before turning.
    D: Checking the dashboard gauges.
  answer: B
  explanation: A head check involves checking your blind spots by looking over your
    shoulder before changing lanes or merging.
- id: 421
  category: safe_driving_rules
  question: When are studded snow tires legal to use in Kansas?
  choices:
    A: October 1 through March 1
    B: November 1 through April 1
    C: December 1 through March 31
    D: They are legal year-round
  answer: B
  explanation: According to the manual, studded snow tires are only legal from November
    1 through April 1.
- id: 422
  category: vehicle_information
  question: On front-wheel drive vehicles, where is it best to install snow tires
    or 'all-season' tires?
  choices:
    A: Only on the front wheels
    B: Only on the rear wheels
    C: On all four wheels
    D: On the right-side wheels only
  answer: C
  explanation: The manual states that on front-wheel drive vehicles, it is best to
    put snow tires or 'all-season' tires on all four wheels, not just the front.
- id: 423
  category: defensive_driving
  question: When sleet, freezing rain, or snow starts to fall, which areas of the
    road are likely to freeze first?
  choices:
    A: Intersections and crosswalks
    B: Bridges, ramps, and overpasses
    C: Tunnels and underpasses
    D: Dirt and gravel roads
  answer: B
  explanation: When sleet, freezing rain or snow starts to fall, remember that bridges,
    ramps, and overpasses are likely to freeze first.
- id: 424
  category: safe_driving_rules
  question: If you become stranded in cold weather, how should you operate your vehicle's
    engine and heater to stay warm?
  choices:
    A: Run the engine continuously until help arrives
    B: Run the engine for approximately 10 minutes each hour
    C: Run the engine for 30 minutes every two hours
    D: Do not run the engine at all to save fuel
  answer: B
  explanation: The manual recommends running the engine for approximately 10 minutes
    each hour in order to charge the battery and warm the interior.
- id: 425
  category: safe_driving_rules
  question: Why is it critical to keep the exhaust pipe clear of snow and debris if
    you are stranded in a vehicle?
  choices:
    A: To prevent the engine from overheating
    B: To keep the battery from draining
    C: To prevent exhaust fumes from leaking into the vehicle and causing carbon monoxide
      poisoning
    D: To ensure the heater blows warm air instead of cold air
  answer: C
  explanation: Keep the exhaust pipe clear of snow and debris because fumes from the
    exhaust can leak into the vehicle and can cause you to black out or even cause
    death.
- id: 426
  category: vehicle_information
  question: How often should you inspect your tires when driving in very hot weather?
  choices:
    A: Every hour or 50 miles
    B: Every two hours or every 100 miles
    C: Every four hours or 200 miles
    D: Only when you stop for fuel
  answer: B
  explanation: When driving in hot weather, you should inspect the tires every two
    hours or every 100 miles.
- id: 427
  category: vehicle_information
  question: What should you do if your tire pressure increases while driving in hot
    weather?
  choices:
    A: Let some air out to prevent a blowout
    B: Do not let air out, or the pressure will be too low when the tires cool off
    C: Pour cold water on the tires to reduce the pressure
    D: Drive faster to cool the tires with wind resistance
  answer: B
  explanation: Air pressure increases with temperature. Do not let air out or the
    pressure will be too low when the tires cool off.
- id: 428
  category: defensive_driving
  question: What specific road hazard should you watch out for on the pavement during
    very hot weather?
  choices:
    A: Bleeding tar that can be very slippery
    B: Expanding concrete that causes large bumps
    C: Melting painted lines that obscure lanes
    D: Increased glare from dry asphalt
  answer: A
  explanation: Tar in the road pavement frequently rises to the surface in very hot
    weather. Spots where tar 'bleeds' to the surface can be very slippery.
- id: 429
  category: defensive_driving
  question: What should you do if you spot a tornado while driving?
  choices:
    A: Seek shelter under the nearest bridge or overpass
    B: Stay in your vehicle and park on the shoulder
    C: Leave the vehicle for sturdy shelter or drive out of the tornado's path
    D: Drive into the center of the tornado to pass through it quickly
  answer: C
  explanation: If you spot a tornado, either leave the vehicle for sturdy shelter
    or drive out of the tornado's path. Vehicles are easily tossed and destroyed.
- id: 430
  category: defensive_driving
  question: Why should you avoid seeking shelter under bridges or overpasses during
    a tornado?
  choices:
    A: They attract lightning strikes
    B: Winds will be stronger beneath the overpass due to a 'wind tunnel effect'
    C: They are likely to collapse from the rain
    D: They block the view of approaching emergency vehicles
  answer: B
  explanation: Avoid seeking shelter under bridges or overpasses because winds will
    be stronger beneath the overpass due to a 'wind tunnel effect' and they provide
    little protection from flying objects.
- id: 431
  category: safe_driving_rules
  question: What is the safest way to protect yourself in a vehicle during a lightning
    storm?
  choices:
    A: Drive a convertible with the top down
    B: Park under a tall tree
    C: Stay in a hard-topped vehicle with all doors closed and windows up
    D: Use a radio connected to an external antenna to monitor the weather
  answer: C
  explanation: Only a hard-topped vehicle will protect you in a lightning storm. Make
    sure all doors are closed and windows are up, and do not touch any metal surfaces.
- id: 432
  category: defensive_driving
  question: If your vehicle is caught in a flood and you cannot open the door or side
    window, what is the recommended escape method?
  choices:
    A: Wait for the water to recede completely
    B: Take a breath, kick the window out, go to the air pocket for one more breath,
      and escape
    C: Turn on the heater to evaporate the water
    D: Honk the horn continuously until someone opens the door from the outside
  answer: B
  explanation: If you can’t get a side window open, take a breath and kick the window
    out. Go to the air pocket for one more breath and then escape.
- id: 433
  category: license_system
  question: If you are a commercial license holder and need to update your address,
    what must you do?
  choices:
    A: Visit any local post office
    B: Contact the local County Treasurer only
    C: Visit any full-service Kansas Driver licensing office
    D: Update your address online using ikan.ks.gov
  answer: C
  explanation: 'The manual states: ''If you are a commercial license holder, you will
    need to visit any full-service Kansas Driver licensing office.'''
- id: 434
  category: driver_responsibility
  question: Under Kansas' First-Person Consent law, who can reverse an individual's
    decision to be an organ donor if the individual is at least 18 years old?
  choices:
    A: Their spouse
    B: Their parents
    C: Their doctor
    D: No one else may reverse that decision
  answer: D
  explanation: The change to first-person consent means that an individual’s decision
    to donate is legally binding, and no one else may reverse that decision if the
    individual is at least 18 years old.
- id: 435
  category: driver_responsibility
  question: Which of the following is true regarding organ and tissue donation in
    Kansas?
  choices:
    A: An open casket funeral is not possible for donors
    B: The donor's family must pay a fee for the donation process
    C: People of all ages and medical histories are considered for potential donation
    D: Major religions generally oppose organ donation
  answer: C
  explanation: The manual states that people of all ages and medical histories are
    considered for potential donation. It also notes that open casket funerals are
    possible, there is no cost to the family for donation, and all major religions
    approve of it.
- id: 436
  category: driver_responsibility
  question: How much does it cost the donor's family or estate for organ and tissue
    donation?
  choices:
    A: A flat fee of $500
    B: It depends on the organs donated
    C: There is no cost
    D: The estate pays a percentage of the medical bills
  answer: C
  explanation: The manual states, "There is no cost to the donor’s family or estate
    for organ and tissue donation."
- id: 437
  category: driver_responsibility
  question: Who is responsible for paying the funeral costs of an organ and tissue
    donor?
  choices:
    A: The state registry
    B: The hospital
    C: The donor's family
    D: The organ recipient
  answer: C
  explanation: According to the manual, "Funeral costs remain the responsibility of
    the family."
- id: 438
  category: driver_responsibility
  question: Is it possible to be an organ and tissue donor while still alive?
  choices:
    A: No, donation is only possible after death
    B: Yes, living donation is possible
    C: Only for tissue donation
    D: Only for family members
  answer: B
  explanation: The manual explicitly states, "Living donation is possible."
- id: 439
  category: driver_responsibility
  question: Which website should you visit to sign up directly in the Kansas state
    organ donor registry?
  choices:
    A: https://www.mwtn.org/
    B: https://www.donatelifekansas.com/
    C: https://www.kansas.gov/donor
    D: https://www.ksrevenue.org/
  answer: B
  explanation: The manual instructs, "To sign up in the state registry directly please
    visit https://www.donatelifekansas.com/"
- id: 440
  category: driver_responsibility
  question: Which of the following statements is true regarding the financial aspects
    of organ donation?
  choices:
    A: The family must pay for the donation procedure.
    B: Funeral costs are waived for organ donors.
    C: There is no cost to the donor's estate for the donation.
    D: The state covers all funeral expenses.
  answer: C
  explanation: The manual states that "There is no cost to the donor’s family or estate
    for organ and tissue donation."
- id: 441
  category: driver_responsibility
  question: What website is provided in the manual for more general information about
    organ and tissue donation?
  choices:
    A: https://www.mwtn.org/
    B: https://www.donatelifekansas.com/
    C: https://www.organdonor.gov/
    D: https://www.ksdot.org/
  answer: A
  explanation: The manual states, "For more information, please visit our website
    at https://www.mwtn.org/"
- id: 442
  category: driver_responsibility
  question: 'Complete the organ donation slogan found in the manual: "SHARE YOUR LIFE.
    SHARE YOUR..."'
  choices:
    A: ORGANS.
    B: DECISION.
    C: FUTURE.
    D: LOVE.
  answer: B
  explanation: 'The manual includes the promotional text: "SHARE YOUR LIFE. SHARE
    YOUR DECISION."'
- id: 443
  category: driver_responsibility
  question: Which of the following is a false statement about organ and tissue donation
    according to the manual?
  choices:
    A: Living donation is possible.
    B: Funeral costs remain the responsibility of the family.
    C: The donor's estate must pay a fee for tissue donation.
    D: You can sign up in the state registry online.
  answer: C
  explanation: The statement that the estate must pay a fee is false. The manual states,
    "There is no cost to the donor’s family or estate for organ and tissue donation."
- id: 444
  category: driver_responsibility
  question: 'Complete the following phrase from the organ donation section: "LIVE
    IT. GIVE IT. ..."'
  choices:
    A: TODAY.
    B: FREELY.
    C: LIFE.
    D: HOPE.
  answer: C
  explanation: 'The manual includes the slogan: "LIVE IT. GIVE IT. LIFE."'
- id: 445
  category: driver_responsibility
  question: If a person decides to become an organ donor, what happens to their funeral
    expenses?
  choices:
    A: They are paid by the organ procurement organization.
    B: They remain the responsibility of the family.
    C: They are covered by the state of Kansas.
    D: They are split between the family and the hospital.
  answer: B
  explanation: The manual clearly states, "Funeral costs remain the responsibility
    of the family."
- id: 446
  category: driver_responsibility
  question: A family is worried that agreeing to organ donation will deplete the deceased's
    estate. What does the manual state?
  choices:
    A: The estate will be charged a standard medical fee.
    B: The estate is only charged if multiple organs are donated.
    C: There is no cost to the donor's estate for organ and tissue donation.
    D: The estate must cover the surgical costs.
  answer: C
  explanation: The manual assures that "There is no cost to the donor’s family or
    estate for organ and tissue donation."
- id: 447
  category: driver_responsibility
  question: What type of donation does the manual explicitly state is possible besides
    deceased donation?
  choices:
    A: Living donation
    B: Financial donation
    C: Anonymous donation only
    D: Out-of-state donation only
  answer: A
  explanation: The text explicitly notes, "Living donation is possible."
- id: 448
  category: driver_responsibility
  question: According to the manual, what two things are you encouraged to "SHARE"
    regarding organ donation?
  choices:
    A: Your wealth and your time
    B: Your life and your decision
    C: Your health and your organs
    D: Your choice and your family
  answer: B
  explanation: 'The manual concludes with the lines: "SHARE YOUR LIFE. SHARE YOUR
    DECISION."'
- id: 449
  category: driver_responsibility
  question: Which of the following costs is NOT covered by the organ and tissue donation
    process?
  choices:
    A: The cost of organ recovery
