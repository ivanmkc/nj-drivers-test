    D: 運転免許の永久取り消し。
  answer: B
  explanation: 薬物に関連した影響下での運転による初回有罪判決の場合、750ドル〜1000ドルの罰金と裁判費用が科され、最低48時間の拘留または100時間の社会奉仕活動が命じられ、免許が停止されます。
- id: 101
  category: alcohol_drugs_health
  question: 他の薬を服用しているときに、同時にお酒を飲んではいけないのはなぜですか？
  choices:
    A: 薬の効果を打ち消してしまうため。
    B: 薬がアルコールの影響を増幅させたり、薬自体の副作用が出たりする可能性があるため。
    C: 処方薬を服用している場合にのみ運転に影響し、市販薬では影響しないため。
    D: 血中アルコール濃度（BAC）を不自然に低下させるため。
  answer: B
  explanation: マニュアルでは、他の薬を服用している間は決してお酒を飲まないよう警告しています。これらの薬がアルコールの影響を増幅させたり、薬独自の副作用を引き起こしたりして、安全な運転能力を低下させる可能性があるためです。
- id: 102
  category: driver_responsibility
  question: マニュアルによると、怒っていたり興奮していたりする場合、運転をどのように対処すべきですか？
  choices:
    A: 目的地に早く着いてリラックスするために、少し速めに運転する。
    B: 考えをかき消すために、大音量で音楽を聴く。
    C: 落ち着くための時間を作り、必要であれば短い散歩や昼寝をして、冷静になるまで運転を控える。
    D: 運転中に新鮮な空気を取り入れるために、窓を全開にする。
  answer: C
  explanation: 怒っていたり興奮していたりする場合、マニュアルは落ち着くための時間を作ることを推奨しています。必要であれば短い散歩や昼寝をし、冷静になるまで道路に出ないようにしてください。
- id: 103
  category: safe_driving_rules
  question: 体とステアリングホイール（ハンドル）の下部との間に推奨される距離はどれくらいですか？
