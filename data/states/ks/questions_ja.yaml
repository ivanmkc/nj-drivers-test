    B: 30日間
    C: 60日間
    D: 90日間
  answer: B
  explanation: BACが.08%以上の場合、運転免許および運転資格が30日間停止される可能性があります。
- id: 99
  category: alcohol_drugs_health
  question: 運転前に市販のダイエット薬や「アッパー（興奮剤）」を服用した場合、どのような影響が出る可能性がありますか？
  choices:
    A: 集中力と反射神経が向上する。
    B: 神経質になったり、めまいがしたり、集中できなくなったりすることがある。
    C: 反応時間を安全に短縮させる。
    D: 運転能力には影響を与えない。
  answer: B
  explanation: マニュアルには、元気が出る薬（pep pills）、「アッパー」、ダイエット薬は、神経質になったり、めまいがしたり、集中できなくなったりする可能性があり、視力にも影響を与える可能性があると記載されています。
- id: 100
  category: penalties_and_points
  question: カンザス州において、違法薬物の影響下での運転（DUI）による初回有罪判決の罰則として考えられるものはどれですか？
  choices:
    A: 500ドルの罰金と書面による警告。
    B: 750ドル〜1000ドルの罰金、最低48時間の拘留または100時間の社会奉仕活動、および免許停止。
