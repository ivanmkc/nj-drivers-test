  explanation: カンザス州では、21歳未満の場合、BACが.02%でアルコールによる機能障害として逮捕される可能性があります。
- id: 93
  category: penalties_and_points
  question: カンザス州の黙示的同意法（implied consent law）に基づき、血中アルコール濃度（BAC）テストを拒否した場合の罰則は何ですか？
  choices:
