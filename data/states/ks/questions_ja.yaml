- id: 92
  category: penalties_and_points
  question: カンザス州では、21歳未満の場合、血中アルコール濃度（BAC）がいくらであればアルコールによる機能障害で逮捕される可能性がありますか？
  choices:
    A: .00%
    B: .02%
    C: .05%
    D: .08%
