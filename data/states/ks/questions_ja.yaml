- id: 78
  category: defensive_driving
  question: 攻撃的な運転者に遭遇した際、目を合わせるのを避けるべきなのはなぜですか？
  choices:
    A: 目を合わせることで、攻撃的な運転者をさらに怒らせることがあるため
    B: カンザス州では目を合わせることが違法であるため
    C: スピードメーターを見る妨げになるため
    D: 右側から追い越すよう促してしまうため
  answer: A
  explanation: マニュアルでは、「目を合わせることは、時に攻撃的な運転者を怒らせることがある」ため、アイコンタクトを避けるよう助言しています。
- id: 79
  category: driver_testing
  question: カンザス州の運転免許証の視力検査に合格するには、少なくとも片方の目でどの程度の視力が必要ですか？
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: 視力検査では、矯正レンズの使用の有無にかかわらず、少なくとも片方の目で20/40以上の視力があることが求められます。
- id: 80
  category: safe_driving_rules
  question: 夜間の運転時に、暗い色や着色された矯正レンズの使用を避けるべきなのはなぜですか？
  choices:
    A: いかなる時も着用が禁止されているため
    B: はっきりと見るために必要な光を遮ってしまうため
    C: 対向車のヘッドライトの眩しさを増幅させるため
    D: 透明なレンズよりも早く目の疲れを引き起こすため
  answer: B
  explanation: 夜間の運転条件下では、暗い色や着色された矯正レンズは「はっきりと見るために必要な光を遮ってしまう」ため、使用を避けるべきです。
- id: 81
  category: defensive_driving
  question: 運転中、聴覚はどのように役立ちますか？
  choices:
    A: 対向車の正確な速度を判断するのに役立つ
    B: タイヤの走行音の急激な変化は、路面の変化を示している可能性がある
    C: ラジオなしで気象情報が聞こえるようになる
    D: 運転疲労を感じるのを防ぐ
  answer: B
  explanation: マニュアルには、「舗装路でのタイヤの走行音の急激な変化は、路面やタイヤの状態が変わったことを示している可能性がある」と記載されています。
- id: 82
  category: driver_responsibility
  question: 長距離ドライブ中の疲労を防ぐために、どのくらいの頻度で適切な休憩を計画すべきですか？
  choices:
    A: 50マイル（約80km）または1時間ごと
    B: 100マイル（約160km）または2時間ごと
    C: 200マイル（約320km）または4時間ごと
    D: 車線からはみ出し始めた時のみ
  answer: B
  explanation: 旅行の前に、長距離ドライブ中は約100マイル（約160km）または2時間ごとに適切な休憩を計画する必要があります。
- id: 83
  category: driver_responsibility
  question: 運転疲労に対処するために仮眠をとる場合、推奨される時間はどれくらいですか？
