- id: 77
  category: driver_responsibility
  question: カンザス州の法律の下で、運転中に法的に許可されている行為は次のうちどれですか？
  choices:
    A: テキストメッセージの送信
    B: メールの閲覧
    C: テキストメッセージの作成
    D: GPSデバイスの使用
  answer: D
