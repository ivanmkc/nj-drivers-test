    C: 午前6時から午前10時
    D: 午後4時から午後8時
  answer: B
  explanation: マニュアルでは、疲労を防ぐために、深夜の午前0時から午前6時の間は運転しないようにすることを推奨しています。
- id: 97
  category: alcohol_drugs_health
  question: アルコールは、運転中の色の識別能力にどのような影響を与えますか？
  choices:
    A: 赤や黄色などの明るい色を見る能力を高める
    B: 色の識別には影響を与えない
    C: 色の識別能力を低下させ、交通標識を読み取るのを困難にする
    D: 緑色に対して一時的な色盲を引き起こす
  answer: C
  explanation: アルコールやその他の機能障害を引き起こす薬物は、色の識別能力を低下させます。これは、交通標識、信号、路面標示を読み取ろうとする際に非常に危険です。
- id: 98
  category: penalties_and_points
  question: 血中アルコール濃度（BAC）が.08%以上であることが判明した場合、運転免許および運転資格はどのくらいの期間停止される可能性がありますか？
  choices:
