  answer: B
  explanation: アルコール違反の初回有罪判決では、罰金や免許停止に加え、最低48時間の拘留または100時間の社会奉仕活動が科される可能性があります。
- id: 95
  category: driver_responsibility
  question: 車両を安全に運転し、車内で起こるすべてのことを管理する全責任を単独で負うのは誰ですか？
  choices:
    A: 同乗者
    B: 運転者
    C: 自動車メーカー
    D: 警察当局
  answer: B
  explanation: マニュアルには次のように記載されています。「あなたは、車両を安全に運転することに対して完全かつ単独で責任を負います。これには、車内で起こるすべてのことを管理する責任も含まれます。」
- id: 96
  category: safe_driving_rules
