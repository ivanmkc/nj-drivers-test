questions:
- id: 1
  category: safe_driving_rules
  question: カンザス州の運転ハンドブックによると、カンザス州議会は運転中のテキストメッセージ送信に関してどのような措置を講じましたか？
  choices:
    A: 経験豊富なドライバーにのみ許可されている。
    B: ドライバーの注意を危険なほどそらすため、禁止されている。
    C: ハンズフリー機器を使用する場合は許可されている。
    D: スクールゾーンでのみ禁止されている。
  answer: B
  explanation: 知事の書簡には、カンザス州議会が運転中のテキストメッセージ送信を禁止するために交通法を更新したことが記されています。これは、道路からドライバーの注意を危険なほどそらす可能性があるためです。
- id: 2
  category: vehicle_information
  question: ハンドブックの序文によると、カンザス州には約何マイルの道路がありますか？
  choices:
    A: 50,000マイル
    B: 100,000マイル
    C: 141,000マイル
    D: 200,000マイル
  answer: C
  explanation: 序文には、カンザス州には州の経済を支える約141,000マイルの道路があると記載されています。
- id: 3
  category: license_system
  question: 質問への回答やサービスを利用するためにハンドブックに記載されている、カンザス州財務局の公式サイトはどれですか？
  choices:
    A: ksvehicles.com
    B: kansas.gov/dmv
    C: ksrevenue.gov
    D: ksdriving.org
  answer: C
  explanation: 知事の書簡では、質問への回答や車両局（Division of Vehicles）のサービスを利用するために、ksrevenue.gov
    を訪問することを勧めています。
- id: 4
  category: license_system
  question: カンザス州財務局内のどの部門が、より迅速で便利なサービスの提供に努めていますか？
  choices:
    A: 車両局 (Division of Vehicles)
    B: 運輸局 (Division of Transportation)
    C: 高速道路安全局 (Division of Highway Safety)
    D: ドライバー局 (Division of Motorists)
  answer: A
  explanation: 書簡には、カンザス州財務局が車両局（Division of Vehicles）における体験をより迅速、ユーザーフレンドリー、かつ便利なものにするよう努めていると言及されています。
- id: 5
  category: license_system
  question: この特定のハンドブックは、どのような種類の運転マニュアルですか？
  choices:
    A: 商用運転免許マニュアル
    B: 二輪車運転マニュアル
    C: 非商用運転免許マニュアル
    D: お抱え運転手（シャウフェル）マニュアル
  answer: C
  explanation: 表紙には、この文書が「非商用運転免許マニュアル（Non-Commercial Driver's Manual）」であることが明記されています。
- id: 6
  category: alcohol_drugs_health
  question: 目次によると、セクション3「運転に適した状態（Be in Shape to Drive）」で扱われているトピックは次のうちどれですか？
  choices:
    A: 交通信号
    B: 疲労 (Fatigue)
    C: 子供の乗車安全法
    D: 後退（バック）
  answer: B
  explanation: 目次では、セクション3「運転に適した状態（Be in Shape to Drive）」の下に「疲労（Fatigue）」が記載されています。
- id: 7
  category: safe_driving_rules
  question: 目次に基づくと、「子供の乗車安全法（Child Passenger Safety Laws）」に関する情報はどこにありますか？
  choices:
    A: セクション1：運転免許証
    B: セクション3：運転に適した状態
    C: セクション4：運転する前に
    D: セクション6：道路のルール
  answer: C
  explanation: 目次では、セクション4「運転する前に（Before You Drive）」の下に「子供の乗車安全法（Child Passenger Safety
    Laws）」が記載されています。
- id: 8
  category: vehicle_information
  question: 目次のセクション5「基本運転（Basic Driving）」の下にあるトピックとして記載されているのはどれですか？
  choices:
    A: ステアリング（ハンドル操作）
    B: エアバッグ
    C: 攻撃的な運転
    D: 通行優先権（Right-Of-Way）
  answer: A
  explanation: 目次では、セクション5「基本運転（Basic Driving）」の下のトピックとして「ステアリング（Steering）」が記載されています。
- id: 9
  category: signs_and_signals
  question: 目次によると、「交通規制装置（Traffic Control Devices）」と「路面標示（Pavement Markings）」を扱っているのはどのセクションですか？
  choices:
    A: セクション2
    B: セクション4
    C: セクション5
    D: セクション6
  answer: D
  explanation: 「交通規制装置（Traffic Control Devices）」と「路面標示（Pavement Markings）」は、セクション6「道路のルール（Rules
    of the Road）」の下に記載されています。
- id: 10
  category: penalties_and_points
  question: ドライバーはマニュアルのどのセクションで「運転資格の喪失（Loss of Driving Privileges）」に関する情報を見つけることができますか？
  choices:
    A: セクション1：運転免許証
    B: セクション3：運転に適した状態
    C: セクション5：基本運転
    D: セクション6：道路のルール
  answer: A
  explanation: 目次では、セクション1「運転免許証（The Driver's License）」の下に「運転資格の喪失（Loss of Driving
    Privileges）」が記載されています。
- id: 11
  category: alcohol_drugs_health
  question: 目次によると、「アルコール、その他の薬物と運転」というトピックは、セクション3のどのトピックと同じグループに分類されていますか？
  choices:
    A: 発進と停止
    B: 視力と聴力
    C: 交通標識と信号
    D: エアバッグとシートベルト
  answer: B
  explanation: 「アルコール、その他の薬物と運転」はセクション3に含まれており、そこには「視力」や「聴力」といった健康関連のトピックも含まれています。
- id: 12
  category: sharing_the_road
  question: 目次に基づくと、「スクールバスに関する規則」はどのセクションに含まれていますか？
  choices:
    A: セクション2 - 州/準州/地域の法律
    B: セクション4 - 運転の前に
    C: セクション5 - 基本的な運転
    D: セクション6 - 道路交通法（Rules of the Road）
  answer: D
  explanation: 目次では、「スクールバスに関する規則」は「セクション6 - 道路交通法（Rules of the Road）」の下に記載されています。
- id: 13
  category: driver_responsibility
  question: カンザス州議会が、運転中のテキストメッセージ送信を禁止するために運転免許法を更新したのはなぜですか？
  choices:
    A: 交通違反切符による収入を増やすため
    B: それが原因で発生する交通事故や死亡者数が増加しているため
    C: 公共交通機関の利用を促進するため
    D: 携帯電話のネットワークが過負荷になっていたため
  answer: B
  explanation: 知事の書簡には、法律が更新された理由は「運転中にテキストメッセージを送信することによって引き起こされる交通事故や死亡者数が増加しているため」であると記されています。
- id: 14
  category: driver_testing
  question: はじめに（Introduction）によると、私たち全員が安全に運転できるように、運転免許試験は何に焦点を当てていますか？
  choices:
    A: 高度な機械修理技術
    B: 共有される「道路交通法（rules of the road）」
    C: 州のハイウェイマップの暗記
    D: 高速での回避操作
  answer: B
  explanation: はじめに（Introduction）では、運転免許試験は「私たち全員が安全に運転するのに役立つ、共有される『道路交通法（rules of
    the road）』に焦点を当てている」と述べられています。
- id: 15
  category: license_system
  question: 目次によると、「Real ID」に関する情報は、どのトピックの直後に記載されていますか？
  choices:
    A: 年齢要件
    B: 必要書類リスト
    C: 運転者教育
    D: 予約のスケジューリング
  answer: B
  explanation: 目次では、「Real ID」は「必要書類リスト」の直後に記載されています。
- id: 16
  category: license_system
  question: 身分証明書に「VETERAN（退役軍人）」の表示を追加するために使用できる書類はどれですか？
  choices:
    A: 有効なパスポート
    B: DD-214フォーム
    C: 出生証明書
    D: ソーシャルセキュリティカード（社会保障カード）
  answer: B
  explanation: マニュアルによると、「VETERAN」の表示を希望する場合は、DD-214、NGB-22、退役軍人省（VA）のID、または退役軍人IDを持参する必要があります。
- id: 17
  category: license_system
  question: 「VETERAN」の表示を受ける資格を得るには、DD-214またはNGB-22にどのようなステータスが記載されている必要がありますか？
  choices:
    A: 一般除隊（General Discharge）
    B: 傷病除隊（Medical Discharge）
    C: 名誉除隊（Honorable Discharge）
    D: 行政除隊（Administrative Discharge）
  answer: C
  explanation: マニュアルには、退役軍人表示の資格を得るには、DD-214またはNGB-22に「名誉除隊（Honorable Discharge）」と記載されていなければならないと記されています。
- id: 18
  category: license_system
  question: 商用クラスA、B、またはC（州間：Interstate）の免許を取得するための最低年齢要件は何歳ですか？
  choices:
    A: 18歳
    B: 19歳
    C: 20歳
    D: 21歳
  answer: D
  explanation: 商用クラスA、B、またはC（州間：Interstate）免許の年齢要件は21歳以上です。
- id: 19
  category: license_system
  question: 商用クラスA、B、またはC（州内：Intrastate）の免許を取得するには何歳である必要がありますか？
  choices:
    A: 16歳
    B: 17歳
    C: 18歳
    D: 21歳
  answer: C
  explanation: 商用クラスA、B、またはC（州内：Intrastate）免許の最低年齢要件は18歳以上です。
- id: 20
  category: license_system
  question: 非商用クラスAまたはBの運転免許を取得するために必要な最低年齢は何歳ですか？
  choices:
    A: 16歳
    B: 17歳
    C: 18歳
    D: 21歳
  answer: C
  explanation: 非商用クラスAまたはBの免許には、申請者が18歳以上であることが求められます。
- id: 21
  category: license_system
  question: 標準的な非商用クラスC免許（Non-Commercial Class C license）を取得できるのは何歳からですか？
  choices:
    A: 15歳
    B: 16歳
    C: 17歳
    D: 18歳
  answer: C
  explanation: マニュアルによると、非商用クラスC免許の年齢要件は17歳以上です。
- id: 22
  category: license_system
  question: 非商用クラスC（制限付き）免許（Non-Commercial Class C (Restricted) license）の資格を得るための最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 17歳
  answer: B
  explanation: 非商用クラスC（制限付き）免許を取得するには、申請者が少なくとも15歳である必要があります。
- id: 23
  category: license_system
  question: 15歳で非商用クラスC（制限付き）免許を取得するには、何時間の運転練習を完了させる必要がありますか？
  choices:
    A: 50時間のうち10時間
    B: 50時間のうち25時間
    C: 50時間のうち40時間
    D: 50時間すべて
  answer: B
  explanation: 15歳で非商用クラスC（制限付き）免許を取得するには、50時間の運転練習のうち25時間を完了している必要があります。
- id: 24
  category: license_system
  question: 規定の運転練習時間を完了する際、同乗する成人は少なくとも何歳以上である必要がありますか？
  choices:
    A: 18歳
    B: 19歳
    C: 21歳
    D: 25歳
  answer: C
  explanation: マニュアルには、運転練習は21歳以上の成人が同乗して行わなければならないと規定されています。
- id: 25
  category: license_system
  question: 非商用クラスCまたはM（制限緩和）免許（Less Restricted Privileges license）の場合、規定の50時間の運転練習のうち、何時間を夜間に完了させる必要がありますか？
  choices:
    A: 5時間
    B: 10時間
    C: 15時間
    D: 20時間
  answer: B
  explanation: 制限緩和免許の場合、50時間の運転練習のうち10時間を夜間に完了させる必要があります。
- id: 26
  category: license_system
  question: 非商用クラスC（農耕用許可証／Farm Permit）を取得するための年齢要件は何歳ですか？
  choices:
    A: 13歳または14歳
    B: 14歳または15歳
    C: 15歳または16歳
    D: 16歳または17歳
  answer: B
  explanation: マニュアルによると、非商用クラスC（農耕用許可証）は14歳または15歳の方が取得可能です。
- id: 27
  category: license_system
  question: 商用仮免許（Commercial Instruction Permit、全クラス共通）を取得するには何歳である必要がありますか？
  choices:
    A: 16歳
    B: 17歳
    C: 18歳
    D: 21歳
  answer: C
  explanation: 商用仮免許（全クラス共通）を取得するには、申請者が18歳以上である必要があります。
- id: 28
  category: driver_testing
  question: マニュアルによると、オンラインまたはインターネットによる運転者教育（Driver's Education）コースは州の要件を満たしていますか？
  choices:
    A: はい、成人が受講する場合のみ
    B: はい、ドライビングシミュレーターが含まれる場合のみ
    C: いいえ、インターネットコースは要件を満たしません
    D: はい、すべてのオンラインコースが承認されています
  answer: C
  explanation: マニュアルには、インターネットコースは運転者教育の要件を満たさないと明記されています。
- id: 29
  category: license_system
  question: カンザス州でクラスCまたはMの仮免許（Instruction Permit）を取得するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: A
  explanation: マニュアルによると、クラスCまたはMの仮免許の最低年齢は14歳以上です。
- id: 30
  category: driver_testing
  question: カンザス州での免許取得において、インターネットベースの運転者教育コースの修了証は受け付けられますか？
  choices:
    A: はい、州が承認したウェブサイトであれば受け付けられます。
    B: はい、ただし18歳以上の申請者に限ります。
    C: いいえ、インターネットコースはカンザス州の運転免許取得要件を満たしません。
    D: いいえ、親の宣誓供述書が添えられていない限り受け付けられません。
  answer: C
  explanation: マニュアルには、インターネットコースはカンザス州の運転免許取得要件を満たしておらず、インターネット運転者教育コースの修了証は受け付けられないと記載されています。
- id: 31
  category: driver_testing
  question: 認可された民間の運転教育学校は、何時間の講習を提供しなければなりませんか？
  choices:
    A: 学科10時間、技能（実技）4時間
    B: 学科8時間、技能（実技）6時間
    C: 学科6時間、技能（実技）8時間
    D: 学科12時間、技能（実技）6時間
  answer: B
  explanation: 認可された民間の運転教育学校は、8時間の学科講習と6時間の技能（実技）講習を提供しなければなりません。
- id: 32
  category: license_system
  question: カンザス州に転入後、カンザス州の運転免許証を取得するまでに何日間の猶予がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 120日
  answer: C
  explanation: カンザス州に転入してから90日以内に、カンザス州の運転免許証を取得することが義務付けられています。
- id: 33
  category: license_system
  question: ファームパーミット（農場許可証）の資格を得るには、申請者が農場に居住しているか、農場で雇用されている必要があります。その農場の最小面積要件は何ですか？
  choices:
    A: 10エーカー
    B: 20エーカー
    C: 40エーカー
    D: 50エーカー
  answer: B
  explanation: マニュアルでは、ファームパーミットの対象となる農場を、農業経営に使用されている少なくとも20エーカー以上の土地と定義しています。
- id: 34
  category: safe_driving_rules
  question: ファームパーミット（農場許可証）を保持する14歳または15歳の運転制限事項として、正しいものはどれですか？
  choices:
    A: 学校行事への行き来のために運転できる。
    B: 兄弟以外の未成年の同乗者を2人まで乗せることができる。
    C: 通学の目的のみで、自宅と学校の間を最短ルートで直行する場合に運転できる。
    D: ナビゲーション目的で無線機器を使用できる。
  answer: C
  explanation: ファームパーミットを保持する14〜15歳は、通学を目的として自宅と学校の間を最短ルートで直行する場合にのみ運転できますが、学校行事（アクティビティ）のための運転は認められていません。
- id: 35
  category: driver_testing
  question: 16歳または17歳の者がファームパーミット（農場許可証）の緩和された制限下で運転できるようになる前に、親または保護者は少なくとも50時間の運転時間を証明する宣誓供述書に署名しなければなりません。そのうち、夜間の運転は何時間必要ですか？
  choices:
    A: 5時間
    B: 10時間
    C: 15時間
    D: 20時間
  answer: B
  explanation: 申請者が緩和された制限下で運転できるようになる前に、親または保護者は、少なくとも50時間の運転時間（そのうち少なくとも10時間は夜間）を完了したことを証明する宣誓供述書に署名する必要があります。
- id: 36
  category: license_system
  question: 学習許可証（Instructional Permit、クラスCまたはM）で運転する場合、助手席に同乗する監督者の要件は何ですか？
  choices:
    A: 有効な免許を持つ18歳以上であること。
    B: 21歳以上であり、少なくとも1年の運転経験があること。
    C: 親または法的保護者であること。
    D: 25歳以上であること。
  answer: B
  explanation: 学習許可証の保持者を監督する免許保持者は、21歳以上であり、少なくとも1年の運転経験が必要です。
- id: 37
  category: license_system
  question: クラスCまたはMの学習許可証（Instructional Permit）は、失効するまでどのくらいの期間有効ですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 4年
  answer: B
  explanation: 学習許可証（クラスCまたはM）の有効期間は1年で、試験を受けることで更新が可能です。
- id: 38
  category: driver_testing
  question: 15歳の申請者が制限付き免許（Restricted License）を取得するために、何時間の監督下での運転を完了させる必要がありますか？
  choices:
    A: 10時間
    B: 25時間
    C: 40時間
    D: 50時間
  answer: B
  explanation: マニュアルによると、制限付き免許を申請する15歳の申請者は、25時間の監督下での運転を完了している必要があります。
- id: 39
  category: safe_driving_rules
  question: 制限付き免許（Restricted License）を保持する16歳は、兄弟以外の未成年の同乗者を何人まで車に乗せることができますか？
  choices:
    A: なし
    B: 1人のみ
    C: 2人まで
    D: シートベルトがある人数分
  answer: B
  explanation: 制限付き免許を保持する16歳は、兄弟以外の未成年の同乗者を1人のみ車に乗せることが許可されています。
- id: 40
  category: safe_driving_rules
  question: 制限付き免許（Restricted License）を保持する15歳が、運転中に無線通信機器（スマートフォン等）を使用できるのはどのような状況ですか？
  choices:
    A: ハンズフリーアクセサリを使用しているとき。
    B: 赤信号で停止しているとき。
    C: 違法行為の通報や緊急援助を求める場合のみ。
    D: いかなる状況でも不可。
  answer: C
  explanation: 運転制限事項により、違法行為の通報や緊急援助を求める場合を除き、運転中の無線通信機器の使用は一切禁止されています。
- id: 41
  category: license_system
  question: カンザス州の運転免許証の取得が認められない条件は次のうちどれですか？
  choices:
    A: 交通違反の罰金が未払いである。
    B: 16歳である。
    C: 認定された運転教育コースを修了している。
    D: 以前保持していた身分証明書を返却する。
  answer: A
  explanation: 交通違反の未払いの罰金がない場合に運転免許証を取得できます。未払いの罰金がある場合は、取得資格を失います。
- id: 42
  category: safe_driving_rules
  question: 制限付き免許（Restricted License）を持つ16歳が、学校、仕事、宗教活動以外の理由で、免許を持つ成人の同伴なしに運転が許可される時間帯はいつですか？
  choices:
    A: 午前6時から午後8時まで。
    B: 午前5時から午後9時まで。
    C: 午前7時から午後10時まで。
    D: 午前5時から午後11時まで。
  answer: B
  explanation: 制限付き免許を持つ16歳は、午前5時から午後9時までの間であれば、付添人なしで運転することができます。
- id: 43
  category: alcohol_drugs_health
  question: 薬物・アルコール検査（chemical test）の不合格および検査拒否に関する行政聴聞会を調整する州の部門はどこですか？
  choices:
    A: 運輸局（Department of Transportation）
    B: ドライバー・サービス部門（Driver Services）
    C: 教育局（Department of Education）
    D: ハイウェイ・パトロール（Highway Patrol）
  answer: B
  explanation: ドライバー・サービス部門（Driver Services）は、薬物・アルコール検査の不合格や検査拒否に関する行政聴聞会の調整、および保険加入要件の証明の管理を行っています。
- id: 44
  category: license_system
  question: カンザス州で無制限運転免許証（Unrestricted Driver's License）を取得できる最低年齢は何歳ですか？
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: B
  explanation: カンザス州で無制限運転免許証を取得できる最低年齢は17歳です。
- id: 45
  category: license_system
  question: 無制限免許を申請する18歳未満の申請者に対し、親または保護者は何時間の夜間走行を証明する必要がありますか？
  choices:
    A: 5時間
    B: 10時間
    C: 15時間
    D: 50時間
  answer: B
  explanation: 18歳未満の申請者の場合、親または保護者は、少なくとも50時間の走行時間（うち少なくとも10時間の夜間走行を含む）を完了したことを証明する宣誓供述書に署名する必要があります。
- id: 46
  category: driver_testing
  question: 運転免許の視力検査に合格するための最低限の視力要件は何ですか？
  choices:
    A: 両眼とも20/20
    B: 両眼とも20/30
    C: 片眼で20/40
    D: 片眼で20/50
  answer: C
  explanation: 運転免許試験場で検査を受ける際、矯正の有無にかかわらず、片眼で少なくとも20/40の視力が必要です。
- id: 47
  category: driver_testing
  question: カンザス州の運転学科試験は何問ありますか？
  choices:
    A: '20'
    B: '25'
    C: '30'
    D: '50'
  answer: B
  explanation: 学科試験では、交通法規に関する25の質問に答え、特定の標識を識別する必要があります。
- id: 48
  category: driver_testing
  question: 筆記試験または実技試験に4回不合格となった場合、再試験を受けるまでどのくらいの期間待つ必要がありますか？
  choices:
    A: 30日間
    B: 3ヶ月
    C: 6ヶ月
    D: 1年
  answer: C
  explanation: いずれかの試験に4回不合格になった後は、直近の不合格となった試験から最低6ヶ月間待ってから再試験を受ける必要があります。
- id: 49
  category: driver_testing
  question: 運転免許証の有効期限が1年以上切れている場合、何が必要ですか？
  choices:
    A: 50ドルの罰金を支払う必要がある
    B: 安全運転講習を修了する必要がある
    C: 視力、筆記、実技を含むすべての試験を受ける必要がある
    D: 新しい免許を申請するまで6ヶ月待つ必要がある
  answer: C
  explanation: 運転免許証の有効期限が1年以上切れている場合は、視力、筆記、実技試験を含むすべての試験を再度受ける必要があります。
- id: 50
  category: penalties_and_points
  question: 12ヶ月の期間内に何回の交通違反で有罪判決を受けると、運転免許が停止される可能性がありますか？
  choices:
    A: 2回
    B: 3回
    C: 4回
    D: 5回
  answer: B
  explanation: 12ヶ月の期間内に3回の交通違反（moving violations）で有罪判決を受けた場合、運転免許が停止される可能性があります。
- id: 51
  category: penalties_and_points
  question: アルコールや薬物の含有量を測定するための化学検査（chemical test）を初めて拒否した場合の罰則は何ですか？
  choices:
    A: 6ヶ月の免許停止
    B: 1年間の義務的な免許停止
    C: 2年間の義務的な免許停止
    D: 永久的な免許取消
  answer: B
  explanation: 化学検査の受検拒否は、初回の場合、1年間の義務的な免許停止となります。
- id: 52
  category: penalties_and_points
  question: 車両の継続的な賠償責任保険（liability insurance）を維持しなかった場合、どのような結果になりますか？
  choices:
    A: 警告書の送付
    B: 30日間の免許停止
    C: 義務的な無期限の免許停止
    D: 永久的な免許取消
  answer: C
  explanation: 車両の継続的な賠償責任保険を維持しなかった場合は、義務的な無期限の免許停止となります。
- id: 53
  category: penalties_and_points
  question: 次の有罪判決のうち、運転免許の取消（revocation）につながるものはどれですか？
  choices:
    A: 蓋の開いた酒類の容器を運搬した
    B: 交通事故の報告を怠った
    C: 出廷日に出廷しなかった
    D: 警察官からの逃走を試みた
  answer: D
  explanation: 警察官からの逃走を試みることは、運転免許が取り消される可能性のある違反として挙げられています。他の選択肢は免許停止（suspension）の対象となります。
- id: 54
  category: penalties_and_points
  question: カンザス州で免許の永久取消（permanent revocation）となるのはどのような場合ですか？
  choices:
    A: 12ヶ月以内に3回の移動違反（moving violation）を犯した
    B: 0.08以上の検査結果または化学検査の拒否が5回目となった
    C: 賠償責任保険の維持を2回怠った
    D: 蓋の開いた酒類の容器を運搬した
  answer: B
  explanation: 血液中のアルコール・薬物含有量を測定するための化学検査において、0.08以上の結果が出た場合、または検査を拒否した場合が5回目になると、免許は永久に取り消されます。
- id: 55
  category: license_system
  question: 有効な入国審査書類（Immigration Documents）を持つ外国人観光客、教師、またはビジネス関係者は、有効な州外または外国の免許証で、カンザス州において最長でどのくらいの期間運転できますか？
  choices:
    A: 30日間
    B: 6ヶ月間
    C: 1年間
    D: 2年間
  answer: C
  explanation: 最長1年間滞在し、有効な入国審査書類を保持している外国人（外国人観光客、教師、またはビジネス関係者）は、16歳以上であれば有効な免許証で運転することができます。
- id: 56
  category: license_system
  question: クラスC運転免許（Class C Driver's License）で運転できる車両の最大車両総重量定格（GVWR）はいくらですか？
  choices:
    A: 10,000ポンド未満
    B: 26,001ポンド未満
    C: 26,001ポンド以上
    D: サイズに関わらずあらゆる重量
  answer: B
  explanation: マニュアルによると、クラスC運転免許では、車両総重量定格が26,001ポンド未満の車両を運転することができます。
- id: 57
  category: safe_driving_rules
  question: 特別の標識がない限り、カンザス州の市街地（urban district）における最高速度制限は何マイルですか？
  choices:
    A: 時速20マイル
    B: 時速25マイル
    C: 時速30マイル
    D: 時速35マイル
  answer: C
  explanation: マニュアルには、特別の標識がない限り、町や都市の市街地における最高速度制限は時速30マイルであると記載されています。
- id: 58
  category: safe_driving_rules
  question: 特別の標識がない限り、郡道または町道（County or Township road）における最高速度制限は何マイルですか？
  choices:
    A: 時速45マイル
    B: 時速55マイル
    C: 時速65マイル
    D: 時速75マイル
  answer: B
  explanation: マニュアルでは、特別の標識がない限り、郡道または町道における最高速度制限を時速55マイルと定めています。
- id: 59
  category: penalties_and_points
  question: カンザス州の法律では、シートベルトの着用は「一次違反（Primary Violation）」とされています。これはどういう意味ですか？
  choices:
    A: 警察官がフロントシートでシートベルトを着用していない大人、またはシートベルトを着用していない子供を見かけた場合、その違反のみを理由に車両を停止させることができる。
    B: スピード違反などで先に引き止められた場合にのみ、シートベルト違反の切符を切られる。
    C: 運転者のみがシートベルトの着用を義務付けられている。
    D: シートベルト違反は即時の免許停止につながる。
  answer: A
  explanation: カンザス州ではシートベルトの着用は「一次違反（Primary Violation）」です。つまり、法執行官がフロントシートでシートベルトを着用していない大人、または車内のどこかでシートベルトを着用していない子供を見かけた場合、その違反のみを理由に車両を停止させることができます。
- id: 60
  category: safe_driving_rules
  question: 身長が4フィート9インチ（約145cm）を超えるか、体重が80ポンド（約36kg）を超える場合を除き、子供は何歳まで連邦政府承認のチャイルドシートまたはブースターシート（booster
    seat）で拘束される必要がありますか？
  choices:
    A: 4歳未満
    B: 4歳から8歳まで
    C: 8歳から12歳まで
    D: 12歳から16歳まで
  answer: B
  explanation: マニュアルには、4歳から8歳までのすべての子供は、身長が4フィート9インチを超えるか、または体重が80ポンドを超える場合を除き、連邦政府承認のチャイルドシートまたはブースターシートで拘束されなければならないと記載されています。
- id: 61
  category: safe_driving_rules
  question: 右左折や車線変更をする際、どのくらい手前から合図を出す必要がありますか？
  choices:
    A: 少なくとも50フィート手前
    B: 少なくとも100フィート手前
    C: 少なくとも200フィート手前
    D: 少なくとも500フィート手前
  answer: B
  explanation: すべての合図は、実際に移動や回転を行う少なくとも100フィート手前から出さなければなりません。
- id: 62
  category: safe_driving_rules
  question: 他のドライバーから少なくとも何フィート先まで視認できない場所では、Uターン（転回）をしてはいけませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: マニュアルには、「カーブ、丘の頂上付近、または他のドライバーから少なくとも500フィート先まで視認できない場所では、Uターンをしてはならない」と記載されています。
- id: 63
  category: safe_driving_rules
  question: 2車線の道路で他の車両を追い越す際、右側の車線に戻っても安全なのはいつですか？
  choices:
    A: 追い越した車両のリアバンパーを通り過ぎたらすぐに
    B: 追い越したばかりの車両のフロント部分全体がバックミラーで見えるようになったとき
    C: その車両を通り過ぎてから100フィート走行した後
    D: 追い越された車両がヘッドライトを点滅させたとき
  answer: B
  explanation: マニュアルでは、右側の車線に早く戻りすぎないよう指示しています。追い越したばかりの車両のフロント部分全体がバックミラーで見えるようになるまで待ってください。
- id: 64
  category: safe_driving_rules
  question: 次の中で、他の車両を追い越すことが禁止されている状況はどれですか？
  choices:
    A: 一方通行の道路
    B: 交差点や鉄道の踏切を通過する手前100フィート以内
    C: 前方の車両が制限速度以下で走行しているとき
    D: 同じ方向に進む複数車線のハイウェイ
  answer: B
  explanation: 交差点や鉄道の踏切を通過する手前100フィート以内では、追い越しをしてはいけません。
- id: 65
  category: signs_and_signals
  question: 「追い越し禁止区域（No Passing Zone）」の警戒標識はどのような形をしていますか？
  choices:
    A: ひし形
    B: 八角形
    C: ペナント型（三角旗型）
    D: 長方形
  answer: C
  explanation: マニュアルによると、「追い越し禁止区域」の標識は、唯一のペナント型の警戒標識です。
- id: 66
  category: defensive_driving
  question: 悪天候下では、どのような車間距離のルールを適用すべきですか？
  choices:
    A: 2秒ルール
    B: 3秒ルール
    C: 4秒ルール
    D: 6秒ルール
  answer: C
  explanation: 良好な条件下では2秒ルールが適用されますが、マニュアルでは悪天候下では4秒の車間距離ルールを使用するように定めています。
- id: 67
  category: sharing_the_road
  question: 赤色の回転灯を点灯させ、またはサイレンを鳴らした緊急車両が後方から接近してきた場合、どうしなければなりませんか？
  choices:
    A: その車両の前を走り続けるために加速する
    B: 現在の車線ですぐに停止する
    C: 直ちに右側に寄せて、交差点を塞がないように停止する
    D: 左側の車線に移動して減速する
  answer: C
  explanation: 緊急車両が向かってくる場合、または赤色の回転灯を点灯させたりサイレンを鳴らしたりして後方から接近してくる場合は、直ちに右側に寄せて、交差点を塞がないように停止しなければなりません。
- id: 68
  category: sharing_the_road
  question: 子供の乗り降りのために停車しているスクールバスに対して、停止する必要がないのはどのような場合ですか？
  choices:
    A: バスと同じ方向に走行している場合
    B: 中央分離帯のある道路で、バスの対向車線を走行している場合
    C: 2車線の道路を走行している場合
    D: バスが住宅街で停車している場合
  answer: B
  explanation: 中央分離帯のある道路において、スクールバスの対向車線を走行している車両は、停止する必要はありません。
- id: 69
  category: safe_driving_rules
  question: 交通規制のない交差点に、異なる道路から2台の車両がほぼ同時に入った場合、どちらに優先権（Right-of-way）がありますか？
  choices:
    A: 右側のドライバーが左側の車両に譲らなければならない
    B: 左側のドライバーが右側の車両に譲らなければならない
    C: より速く走行している車両に優先権がある
    D: より大きな車両に優先権がある
  answer: B
  explanation: 異なる道路から2台の車両がほぼ同時に交差点に入った場合、左側のドライバーは右側の車両に優先権を譲らなければなりません。
- id: 70
  category: safe_driving_rules
  question: カンザス州の基本速度法（Basic Speed Law）では、何が求められていますか？
  choices:
    A: 天候に関わらず、常に掲示された制限速度で運転すること
    B: その時の状況下で合理的かつ慎重であると言える速度を超えて運転しないこと
    C: 夜間は制限速度より5マイル減速して運転すること
    D: 周囲の車両の速度に合わせること
  answer: B
  explanation: カンザス州の基本速度法は、その時の状況下で合理的かつ慎重であると言える速度を超えて車両を運転してはならないと定めています。
- id: 71
  category: safe_driving_rules
  question: 多車線道路で、点滅灯をつけた停車中の緊急車両に近づいた場合、どのような行動が推奨されますか？
  choices:
    A: クラクションを鳴らして緊急作業員に知らせる
    B: 現在の車線ですぐに停車する
    C: 停車中の緊急車両の隣ではない車線に移動する
    D: 速度を維持し、緊急車両の隣の車線にとどまる
  answer: C
  explanation: 各方向に2車線以上ある通りや高速道路で、停車中の緊急車両に後方から接近する場合、十分な注意を払い、停車中の緊急車両の隣ではない車線に移動しなければなりません。
- id: 72
  category: safe_driving_rules
  question: 左折する車両と直進する車両が、反対方向から同時に交差点に入った場合、どちらが優先権を譲らなければなりませんか？
  choices:
    A: 直進する車両
    B: 左折する車両
    C: 右側の車両
    D: どちらの車両も譲る必要はない
  answer: B
  explanation: 左折する車両の運転者は、反対方向から接近する車両に優先権を譲らなければなりません。両方の車が同時に入った場合、直進する車に優先権があります。
- id: 73
  category: safe_driving_rules
  question: 交差点で青信号ですが、前方が渋滞しており、交差点を渡りきった先に自車のスペースが十分にありません。どうすべきですか？
  choices:
    A: 交差点に入り、渋滞が解消されるのを待つ
    B: 渋滞が動き出すまでクラクションを鳴らし続ける
    C: 反対側に十分なスペースができるまで交差点に入らない
    D: 横断歩道まで進んで待機する
  answer: C
  explanation: マニュアルには次のように明記されています。「交差点の先に自車が入る十分なスペースがない限り、交差点、横断歩道、または鉄道踏切に入ってはならない。たとえ青信号であっても、完全に通り抜けるスペースがない場合は交差点に入ってはならない。」
- id: 74
  category: safe_driving_rules
  question: 消火栓の近くに駐車する場合、維持しなければならない最小距離は何フィートですか？
