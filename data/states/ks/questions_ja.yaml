  question: マニュアルによると、負傷や死亡を引き起こす衝突事故の半分以上はどこで発生していますか？
  choices:
    A: 時速65マイル以上の州間高速道路上
    B: 時速40マイル未満の速度で、かつ自宅から25マイル以内の場所
    C: 運転者の居住州以外への長距離ドライブ中
    D: 夜間の田舎道
  answer: B
  explanation: 負傷や死亡を引き起こす衝突事故の半分以上は、時速40マイル（40 mph）未満の速度で、かつ自宅から25マイル（25 miles）以内の場所で発生しています。
- id: 108
  category: vehicle_information
  question: ショルダーハーネス（肩掛け式）のシートベルトはどのように着用すべきですか？
  choices:
    A: 快適さを優先して、脇の下に通す。
    B: 首に擦れる場合は、背中の後ろに通す。
    C: 肩と胸を横切るようにし、緩みがほとんどない状態で着用する。
    D: 動きやすいように、胸の前で緩めに着用する。
  answer: C
  explanation: ショルダーハーネスは、肩と胸を横切るように、緩みがほとんどない状態で着用します。脇の下や背中の後ろに通して着用してはいけません。
- id: 109
  category: alcohol_drugs_health
  question: 運転前にマリファナを使用した人に関する調査結果として、正しいものはどれですか？
  choices:
    A: 反応速度は速くなるが、判断力が低下する。
    B: ミスが増え、眩しさへの対応がより困難になる。
    C: 交通違反で逮捕される可能性が低くなる。
    D: より慎重かつ安全に運転するようになる。
  answer: B
  explanation: 調査によると、マリファナを使用した人は、他の運転者よりもミスが多く、眩しさへの対応に苦労し、交通違反で逮捕されることが多いことが示されています。
- id: 110
  category: defensive_driving
  question: 運転中に携帯電話を使用する必要がある場合、最善の行動は何ですか？
  choices:
    A: 安全な駐車場所に停車してから電話をかける。
    B: 注意深く携帯電話を使用するが、長電話は避ける。
    C: 両手をハンドルに置いたままにするため、肩と耳の間に電話を挟んで話す。
    D: 電話をかけている間は、時速15マイルまで減速する。
  answer: A
  explanation: 「知識テスト（Test Your Knowledge）」セクションでは、携帯電話を使用する必要がある場合は、安全な駐車場所に停車してから電話をかけるのが最善であると示されています。
- id: 111
  category: vehicle_information
  question: ステアリングホイール（ハンドル）を調整する際、適切な高さはどれですか？
  choices:
    A: ハンドルの上部が目の高さと同じであること。
    B: ハンドルの上部が肩の高さより高くなく、あごのラインより下であること。
    C: ハンドルの下部が膝の上に軽く触れること。
    D: 足元のスペースを確保するため、できるだけ高い位置にすること。
  answer: B
  explanation: マニュアルによると、ステアリングホイールの上部は肩の高さより高くなく、あごのラインより下にある必要があります。
- id: 112
  category: vehicle_information
  question: ルームミラーを調整する主な目的は何ですか？
  choices:
    A: 左右の死角を確認するため。
    B: 後部座席の同乗者を監視するため。
    C: 後方の交通の流れが見えるように、リアウィンドウを枠内に収めるため。
    D: 車両の後部フェンダーを確認するため。
  answer: C
  explanation: 後方の交通の流れを確認できるように、リアウィンドウが枠内に収まるようにルームミラーを調整する必要があります。
- id: 113
  category: vehicle_information
  question: 衝突時の深刻な内臓損傷を防ぐために、ショルダーハーネス（肩ベルト）はどのように着用すべきですか？
  choices:
    A: 快適さを優先し、脇の下に通す。
    B: 首に擦れる場合は、背中の後ろに通す。
    C: 肩と胸を横切るようにし、緩みがほとんどない状態で着用する。
    D: 自由に動けるよう、胸の前で緩めに着用する。
  answer: C
  explanation: ショルダーハーネスは、肩と胸を横切るようにし、緩みがほとんどない状態で着用します。脇の下や背中の後ろに通すと、衝突時に深刻な内臓損傷を引き起こす可能性があるため、避けてください。
- id: 114
  category: vehicle_information
  question: 車両に自動ショルダーベルトが装備されている場合、適切に拘束されるために他に何をしなければなりませんか？
  choices:
    A: 低速で運転する場合は、接続を外す。
    B: 腰ベルト（ラップベルト）も必ず締める。
    C: 腹部の高い位置にくるように調整する。
    D: エアバッグが装備されている場合は、使用を避ける。
  answer: B
  explanation: 自動ショルダーベルトがある場合でも、必ず腰ベルトも締めてください。そうしないと、衝突時にベルトから滑り落ちて負傷したり、死亡したりする恐れがあります。
- id: 115
  category: safe_driving_rules
  question: エアバッグが装備されている車両でも、なぜシートベルトを着用しなければならないのですか？
  choices:
    A: エアバッグは、側面衝突、後部衝突、または車両の横転時には保護してくれないため。
    B: エアバッグは時速50マイル以上でしか効果がないため。
    C: シートベルトを締めていないと、エアバッグが作動しないため。
    D: エアバッグは車外に放り出されるリスクを高めるため。
  answer: A
  explanation: エアバッグは側面衝突、後部衝突、横転時には保護してくれず、また運転者を運転席に留めておく効果もないため、エアバッグ装備車であってもシートベルトを着用する必要があります。
- id: 116
  category: driver_responsibility
  question: 法律によると、何歳未満の子供は後部座席に固定され、適切な安全拘束装置を着用しなければなりませんか？
  choices:
    A: 8歳未満
    B: 10歳未満
    C: 12歳未満
    D: 14歳未満
  answer: D
  explanation: 法律では、車両の走行中、14歳未満のすべての子供は後部座席に固定され、適切な安全拘束装置を着用することが義務付けられています。
- id: 117
  category: safe_driving_rules
  question: エアバッグの作動による負傷を防ぐために、胸の中心とステアリングホイールの中心の間にはどのくらいの距離が必要ですか？
  choices:
    A: 少なくとも5インチ
    B: 少なくとも10インチ
    C: 少なくとも15インチ
    D: 少なくとも20インチ
  answer: B
  explanation: ほとんどの車両では、胸の中心とステアリングホイールの中心の間に少なくとも10インチの距離が保たれるように座席を調整する必要があります。
- id: 118
  category: driver_responsibility
  question: 出生から少なくとも1歳まで、かつ体重が少なくとも20ポンドになるまでの乳児に対する適切なチャイルドシートの要件は何ですか？
  choices:
    A: 助手席に前向きのチャイルドシートを設置する。
    B: 後部座席に前向きのチャイルドシートを設置する。
    C: 後部座席に後ろ向きの乳児用シートを設置する。
    D: 後部座席にブースターシートを設置する。
  answer: C
  explanation: 出生から少なくとも1歳まで、かつ体重が少なくとも20ポンドになるまでの乳児は、後部座席に適切に設置された後ろ向きの乳児用シートに乗せる必要があります。
- id: 119
  category: driver_responsibility
  question: 4歳から8歳の間で、身長が4フィート9インチ以下の子供は、何に乗るべきですか？
  choices:
    A: 後ろ向きの乳児用シート。
    B: 前向きのチャイルドシート。
    C: 後部座席に適切に設置されたブースターシート。
    D: 助手席の大人用シートベルト。
  answer: C
  explanation: 4歳から8歳の間で、身長が4フィート9インチ以下の子供は、後部座席に適切に設置されたブースターシートに乗せる必要があります。
- id: 120
  category: safe_driving_rules
  question: 衝突時にエアバッグによる負傷を避けるため、12歳以下の子供は車内のどこに座るべきですか？
  choices:
    A: 助手席のシートを一番後ろまで下げた状態。
    B: 車両の後部座席。
    C: シートベルトを着用していれば助手席。
    D: 運転者の膝の上。
  answer: B
  explanation: 衝突時にエアバッグによる負傷を避けるため、12歳以下の子供は車両の後部座席に座る必要があります。
- id: 121
  category: vehicle_information
  question: マニュアル車（MT車）で加速する際、クラッチを急に離すとどうなりますか？
  choices:
    A: 車両はスムーズに速度を上げます。
    B: 車体がガクンと前に揺れ、エンジンが停止（エンスト）する可能性があります。
    C: 駆動輪がロックして横滑りします。
    D: パーキングブレーキが自動的にかかります。
  answer: B
  explanation: クラッチを急に離すと、車体がガクンと前に揺れ、エンジンが停止（エンスト）する可能性があります。
- id: 122
  category: defensive_driving
  question: 滑りやすい路面で加速中に駆動輪が空転し始めた場合、どうすべきですか？
  choices:
    A: トラクションを得るためにアクセルをさらに強く踏む。
    B: すぐに高いギアにシフトアップする。
    C: アクセルから足を離す。
    D: ブレーキを素早くポンピングする。
  answer: C
  explanation: パワーをかけすぎると駆動輪が空転し、コントロールを失う恐れがあります。駆動輪が空転し始めたら、アクセルから足を離してください。
- id: 123
  category: vehicle_information
  question: 車を後退（バック）させるとき、ハンドルはどちらの方向に回すべきですか？
  choices:
    A: 車を動かしたい方向とは逆の方向。
    B: 車を動かしたい方向。
    C: ハンドルを真っ直ぐに保ち、ミラーを使って誘導する。
    D: 右に行くには左に、左に行くには右に回す。
  answer: B
  explanation: 前進でも後退でも、ハンドルは常に車を動かしたい方向に回します。
- id: 124
  category: safe_driving_rules
  question: ハンドルの正しい手の位置はどれですか？
  choices:
    A: 両手をハンドルリムの内側に置く。
    B: 片手をハンドルの上部に、もう片方を下部に置く。
    C: 両手をハンドルの外側の反対側に置く。
    D: 手のひらでハンドルを強く握り、親指をリムの下に入れ込む。
  answer: C
  explanation: 両手はハンドルの外側の反対側に置く必要があります。手のひらではなく指を使い、しっかりと、かつ優しく握ります。また、リムの内側を握った状態でハンドルを回してはいけません。
- id: 125
  category: vehicle_information
  question: 二次衝突の際、なぜエアバッグは役に立たないのですか？
  choices:
    A: 数分間膨らんだままになるように設計されているため。
    B: 一度だけ作動し、衝撃の直後に素早くしぼむため。
    C: 車両が後方から衝突されたときにのみ作動するため。
    D: 車両のシートベルトを自動的に無効化するため。
  answer: B
  explanation: エアバッグは一度だけ作動し、衝撃の直後に素早くしぼむため、二次衝突の際には役に立ちません。
- id: 126
  category: safe_driving_rules
  question: エアバッグが顔ではなく胸の方に向くようにするには、どうすればよいですか？
  choices:
    A: できるだけハンドルに近づくように前かがみになる。
    B: 座席を高くするかクッションを使用し、ハンドルを下向きに調整する。
    C: ハンドルを頭の方に向けて上向きに調整する。
    D: 座席を一番後ろまでリクライニングさせる。
  answer: B
  explanation: エアバッグが顔ではなく胸の方に向くようにするには、座席を高くするかクッションを使用し、ハンドルを下向きに調整してください。
- id: 127
  category: vehicle_information
  question: 運転中、ハンドルをどのように正しく握るべきですか？
  choices:
    A: 手のひらと親指をリムの内側に巻き付けて握る
    B: 手のひらではなく指を使い、親指をハンドルの面に沿って上に向ける
    C: 両手を12時の位置にしっかりと置く
    D: ハンドルリムの内側から強く握る
  answer: B
  explanation: マニュアル（教本）では、手のひらではなく指を使い、親指をハンドルの面に沿って上に向けるよう指示されています。リムの内側を握った状態でハンドルを回してはいけません。
- id: 128
  category: safe_driving_rules
  question: 送りハンドル（プッシュプル法）を使用する場合、ハンドルのどこに手を置くべきですか？
  choices:
    A: 左手は10時から11時の間、右手は1時から2時の間
    B: 左手は9時から10時の間、右手は2時から3時の間
    C: 左手は7時から8時の間、右手は4時から5時の間
    D: 左手は8時から9時の間、右手は3時から4時の間
  answer: C
  explanation: 送りハンドルを使用する場合、左手は7時から8時の間、右手は4時から5時の間でハンドルを握ります。
- id: 129
  category: vehicle_information
  question: なぜ「2時と10時」の手の位置は、現在推奨されていないのですか？
  choices:
    A: 運転者がより早く疲労するため
    B: 方向指示器（ウィンカー）に手が届きにくくなるため
    C: 運転席エアバッグを装備した車両では危険な場合があるため
    D: 現代の車両の最小回転半径を減少させるため
  answer: C
  explanation: マニュアル（教本）では、エアバッグを装備した車両において危険な場合があるため、2時と10時の位置は推奨されないと記されています。
- id: 130
  category: vehicle_information
  question: 次のうち、クロスハンドルを使用すべき状況はどれですか？
  choices:
    A: 時速55マイル（約88km/h）以上の高速道路を走行しているとき
    B: 駐車時など、低速でハンドルを回すとき
    C: 危険を回避するために緊急回避操作を行うとき
    D: 直線的に後退（バック）するとき
  answer: B
  explanation: 交差点や駐車時など、低速でハンドルを回すときにはクロスハンドルを使用してください。
- id: 131
  category: defensive_driving
  question: 危険を回避するために回避行動をとる際、ステアリング操作（ハンドル操作）を180度以内に制限することが重要なのはなぜですか？
  choices:
    A: エンジンの停止（エンスト）を防ぐため
    B: アンチロック・ブレーキ（ABS）のロックを避けるため
    C: ハンドルがその位置でロックされるのを防ぐため
    D: トラクション（タイヤのグリップ力）の喪失と、対向車線へのはみ出しを防ぐため
  answer: D
  explanation: ステアリング操作を180度以内に制限することは非常に重要です。それ以上の操作を行うとトラクションが失われ、車両が道路を横切って対向車の進路に入り込んでしまうことが多いためです。
- id: 132
  category: safe_driving_rules
  question: ハンドルの12時の位置を片手で持つステアリング操作が推奨される唯一の状況はいつですか？
  choices:
    A: 直線で空いている高速道路を走行しているとき
    B: 後方を確認するために座席で体をひねりながら、車両を左右どちらかに後退（バック）させるとき
    C: ワイパーやヘッドライトを操作しているとき
    D: 交差点で急なUターンをするとき
  answer: B
  explanation: 12時の位置が推奨される唯一の状況は、車両を左右どちらかに後退させ、運転者が後方の進路を確認するために座席で体をひねる必要があるときです。
- id: 133
  category: safe_driving_rules
  question: 車両を後退（バック）させる前に、まず最初に行うべきことは何ですか？
  choices:
    A: リバースギアに入れ、素早く加速する
    B: 歩行者に警告するためにクラクションを鳴らす
    C: 車に乗り込む前に、車両の後方を確認する
    D: バンパーの直後の地面が見えるようにバックミラーを調整する
  answer: C
  explanation: 車両を後退させる前に、車に乗り込む前に車両の後方を確認しなければなりません。子供や小さな物体は運転席からは見えないことがあるからです。
- id: 134
  category: safe_driving_rules
  question: 優先権（Right-of-way）の法律に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 法律は、交差点において最も大きな車両に優先権を与えている
    B: 法律は、誰が優先権を譲らなければならないかを定めているが、誰にも優先権を与えてはいない
    C: 法律は、歩行者が標識のある横断歩道にいる場合にのみ優先権を与えている
    D: 法律は、左折する車両に自動的に優先権を与えている
  answer: B
  explanation: マニュアルには次のように記載されています。「法律は、道路を利用する他の者に対して誰が優先権を譲らなければならないかを定めているものであり、誰かに優先権を与えるものではない。」
- id: 135
  category: sharing_the_road
  question: 私道や路地に出入りするために歩道を横切る際、何をしなければなりませんか？
  choices:
    A: 歩行者に歩道を開けるよう警告するためにクラクションを鳴らす
    B: 歩行者に道を譲る
    C: 歩道を塞がないように素早く進む
    D: 一時停止標識がある場合にのみ停止する
  answer: B
  explanation: 私道、路地、または駐車場に出入りするために歩道を横切る際は、歩行者に道を譲らなければなりません。
- id: 136
  category: sharing_the_road
  question: 盲導犬を連れている、または白杖（白い杖）を持っている歩行者に道を譲る際、クラクションの使用を避けるべきなのはなぜですか？
  choices:
    A: 住宅街でクラクションを使用することは違法だから
    B: 視覚障害のある歩行者や盲導犬を混乱させたり、驚かせたりする可能性があるから
    C: 他のドライバーに追い越しを促す合図になるから
    D: 信号機が変わる原因になるから
  answer: B
  explanation: 盲導犬を連れている、または白杖を持っている歩行者には、常に優先権を与えなければなりません。視覚障害のある歩行者や盲導犬を混乱させたり驚かせたりする可能性があるため、クラクションは使用しないでください。
- id: 137
  category: safe_driving_rules
  question: 一時停止標識や信号機のない、交通整理の行われていない交差点での優先権のルールは何ですか？
  choices:
    A: 左側から来る車両に道を譲る
    B: 最も速く走行している車両に優先権がある
    C: すでに交差点内にいる車両と、右側から来る車両に道を譲る
    D: 停止して、他のドライバーが手招きして通してくれるのを待つ
  answer: C
  explanation: 一時停止標識、譲れ（Yield）の標識、または信号機がない交差点では、交差点内にいる車両および右側から来る車両に道を譲らなければなりません。
- id: 138
  category: safe_driving_rules
  question: 4方向一時停止（4-way stop）の交差点に2台の車両が全く同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の車両
    B: 右側の車両
    C: 直進する車両
    D: 右折する車両
  answer: B
  explanation: 4方向一時停止の交差点で、複数の車両が同時に到着した場合は、右側の車両が先に進みます。
- id: 139
  category: safe_driving_rules
  question: 交差点への進入が許可されるのはどのようなときですか？
  choices:
    A: 前方の交通状況に関わらず、信号が青になったらすぐに
    B: 交通の流れを妨げることなく、完全に通り抜けられるときのみ
    C: 赤信号で右折するときはいつでも
    D: 後続車がクラクションを鳴らしたとき
  answer: B
  explanation: 交通の流れを妨げることなく通り抜けられない限り、交差点に進入してはいけません。交差点を塞がないよう、前方の交通がクリアになるまで待つ必要があります。
- id: 140
  category: signs_and_signals
  question: 横型の信号機において、赤信号はどこに配置されていますか？
  choices:
    A: 一番右側
    B: 真ん中
    C: 一番左側
    D: 交差点によって入れ替わる
  answer: C
  explanation: 一部の都市部では、信号機が垂直ではなく水平（横型）に設置されている場合があります。その場合、赤信号は左側、黄信号は真ん中、青信号は右側に配置されます。
- id: 141
  category: signs_and_signals
  question: 青信号（点灯）で左折する場合、どうしなければなりませんか？
  choices:
    A: 絶対的な優先権があるため、すぐに曲がる
    B: 曲がる前に、対向車や歩行者に道を譲る
    C: 左折する前に、青の矢印信号を待つ
    D: 完全に停止し、信号が黄色に変わるのを待つ
  answer: B
  explanation: 青信号で左折する場合、交差点の安全が確認された場合にのみ曲がることができます。常に対向車や歩行者に道を譲らなければなりません。
- id: 142
  category: signs_and_signals
  question: 交差点に近づいた際、信号が黄色（点灯）に変わった場合はどうすべきですか？
  choices:
    A: 赤信号になる前に交差点を通過できるよう加速する
    B: 道路上のどこにいても、すぐに停止する
    C: 減速し、後方の交通状況が許せば完全に停止する
    D: 速度を落とさずに交差点を通過する
  answer: C
  explanation: 黄色の点灯信号は、まもなく赤信号に変わることを意味します。減速し、後方の交通状況が許せば完全に停止してください。
- id: 143
  category: signs_and_signals
  question: 黄色の点滅信号は何を示していますか？
  choices:
    A: 停止し、青信号を待つ
    B: 徐行し、注意して進む
    C: 信号機が故障しているため、4方向一時停止（four-way stop）として扱う
    D: 右側の車両にのみ道を譲る
  answer: B
  explanation: 黄色の点滅信号は、徐行して注意深く進むことを意味します。交差点に進入してくる可能性のある車両に対して、停止できる準備をしておく必要があります。
- id: 144
  category: safe_driving_rules
  question: 赤信号（点灯）で左折が許可されるのは、どのような状況ですか？
  choices:
    A: 対面通行の道路から別の対面通行の道路へ曲がる場合
    B: いかなる状況においても、赤信号での左折は許可されない
    C: 一方通行の道路から別の一方通行の道路へ、または対面通行の道路から一方通行の道路へ曲がる場合
    D: 午前0時から午前6時の間のみ
  answer: C
  explanation: 車両や歩行者を確認した後、一方通行から別の一方通行へ、または対面通行から一方通行へ曲がる場合に限り、赤信号での左折が許可されることがあります。
- id: 145
  category: signs_and_signals
  question: 赤色の点滅信号はどのように扱うべきですか？
  choices:
    A: 「譲れ（Yield）」の標識と同じ
    B: 「止まれ（Stop）」の標識と同じ
    C: 黄色の点灯信号と同じ
    D: 交差点に車両がいなければ、停止せずに進む
  answer: B
  explanation: 赤色の点滅信号は、停止線、横断歩道、または交差点の手前で停止しなければならないことを意味し、一時停止標識と同じ手順に従います。
- id: 146
  category: signs_and_signals
  question: ほとんどの警戒標識はどのような形と色をしていますか？
  choices:
    A: 長方形で、白地に黒の文字
    B: 円形で、黄地に黒の文字
    C: 菱形で、黄地に黒の文字または記号
    D: 八角形で、赤地に白の文字
  answer: C
  explanation: 警戒標識は通常、黄色に黒の文字または記号が描かれた菱形をしています。
- id: 147
  category: signs_and_signals
  question: 「X」の記号と黒い「RR」の文字が描かれた円形の黄色い警戒標識は何を示していますか？
  choices:
    A: 現在、踏切を通過している
    B: この先に踏切（highway-railroad grade crossing）がある
    C: 踏切が修理のため閉鎖されている
    D: 現在、前方の線路で列車は運行されていない
  answer: B
  explanation: 「X」の記号と黒い「RR」の文字が描かれた円形の黄色い警戒標識は、踏切の手前の道路沿いに設置されており、減速して停止の準備をするよう警告するものです。
- id: 148
  category: defensive_driving
  question: 時速 55 マイル（55 mph）で走行している 100 両編成の貨物列車が停止するには、およそどのくらいの距離が必要ですか？
  choices:
    A: 500 フィート
    B: 0.5 マイル
    C: 1 マイル以上
    D: 2 マイル
  answer: C
  explanation: 時速 55 マイルで走行している 100 両編成の貨物列車が非常ブレーキをかけた場合、停止するまでに 1 マイル以上の距離（アメフトのフィールド約
    18 面分）が必要になります。
- id: 149
  category: safe_driving_rules
  question: 踏切内で車が立ち往生し、列車が近づいてきた場合、直ちに行うべき最も安全な行動は何ですか？
  choices:
    A: 車内にとどまり、911 に通報する
    B: 全員を車から降ろし、列車が近づいてくる方向に向かって走る
    C: 全員を車から降ろし、列車が進んでいる方向と同じ方向に走る
    D: 車を線路の外へ押し出そうとする
  answer: B
  explanation: 踏切を横断中に車が立ち往生した場合は、全員を車から降ろして線路から遠ざけ、飛散物による負傷を避けるために列車が近づいてくる方向に向かって走ってください。
- id: 150
  category: vehicle_information
  question: 踏切を横断中にギアチェンジをしないのが賢明なのはなぜですか？
  choices:
    A: 車のトランスミッションを損傷するため
    B: 金属製のレールの上でタイヤのトラクションが失われるため
    C: 線路の上で車がエンスト（立ち往生）する可能性があるため
    D: 交差点内でギアチェンジをすることは違法であるため
  answer: C
  explanation: マニュアルには、万が一のエンストを防ぐために、踏切を横断中はギアチェンジをしないのが賢明であると記載されています。
- id: 151
  category: signs_and_signals
  question: 踏切にある青色の緊急通知システム（ENS）の標識には、どのような情報が記載されていますか？
  choices:
    A: その踏切の列車の時刻表。
    B: フリーダイヤルの指令センター番号と、踏切の正確な場所を特定する運輸省（DOT）番号。
    C: 踏切を通過する列車の制限速度。
    D: 最寄りの病院までの距離。
  answer: B
  explanation: ENS標識には、各鉄道会社のフリーダイヤルの指令センター番号が記載されており、そのすぐ下には踏切の正確な場所を特定する運輸省（DOT）番号が記載されています。
- id: 152
  category: signs_and_signals
  question: 建設、保守、または緊急作業の作業区域（ワークゾーン）の標識には、通常どのような色が使用されますか？
  choices:
    A: 黄色地に黒の文字。
    B: 赤地に白の文字。
    C: オレンジ地に黒の文字または記号。
    D: 緑地に白の文字。
  answer: C
  explanation: 作業区域（ワークゾーン）の標識は、一般的にひし形または長方形で、オレンジ地に黒の文字または記号が使われています。
- id: 153
  category: signs_and_signals
  question: 赤色の矢印信号に直面したとき、どうしなければなりませんか？
  choices:
    A: 対向車に道を譲り、その後矢印の方向に進む。
    B: 停止し、緑色の矢印または信号が点灯するまで、矢印の方向に進んではならない。
    C: 4方向一時停止（4-way stop）として扱う。
    D: 歩行者がいない場合に限り、矢印の方向に曲がる。
  answer: B
  explanation: 赤色の矢印は停止を意味し、信号が緑色の矢印または青信号に変わるまで、その矢印の方向に進むことはできません。
- id: 154
  category: safe_driving_rules
  question: 複数の線路がある踏切では、どのようなことに注意すべきですか？
  choices:
    A: 最初の線路に列車がいなければ、停止する必要はない。
    B: 複数の列車が通過する可能性があり、通常は線路の数が掲示されている。
    C: 列車はすべての線路で常に同じ方向に走行する。
    D: 制限速度は自動的に時速10マイルに引き下げられる。
  answer: B
  explanation: 複数の線路がある踏切では、線路が複数あること、および複数の列車が通過する可能性があることを警告する標識があります。複数の線路、列車、または鉄道車両がないか確認することが重要です。
- id: 155
  category: signs_and_signals
  question: 次の警告標識のうち、蛍光黄色が使用される可能性があるものはどれですか？
  choices:
    A: 一時停止（Stop）標識と譲れ（Yield）標識。
    B: 踏切の標識。
    C: スクールゾーン、学校の横断歩道、および歩行者横断の標識。
    D: 建設および保守の迂回路標識。
  answer: C
  explanation: スクールゾーン、学校の横断歩道、歩行者横断などの一部の警告標識には、蛍光黄色が使用されることがあります。
- id: 156
  category: safe_driving_rules
  question: 交差点で停止中に信号が青になった場合、進む前に何をしなければなりませんか？
  choices:
    A: 他のドライバーに知らせるためにクラクションを鳴らす。
    B: 交差する交通が交差点を通過し終えるのを待ってから進む。
    C: 優先権を確立するために素早く加速する。
    D: 他の交通に関係なく、すぐに右折する。
  answer: B
  explanation: 交差点で停止していて信号が青になった場合は、進む前に交差する交通が交差点を完全に出るまで待たなければなりません。
- id: 157
  category: penalties_and_points
  question: 作業区域（ワークゾーン）での速度超過に対する罰則は何ですか？
  choices:
    A: 罰金が3倍になる。
    B: 罰金が2倍になる。
    C: 免許が自動的に停止される。
    D: 交通安全学校への出席が義務付けられる。
  answer: B
  explanation: マニュアルによると、作業区域（ワークゾーン）での速度超過に対する罰金は2倍になります。
- id: 158
  category: signs_and_signals
  question: 赤い円に赤い斜線が引かれた規制標識は何を示していますか？
  choices:
    A: 示されている行為が禁止されていること。
    B: 示されている行為に対して譲らなければならないこと。
    C: 示されている行為が推奨されていること。
    D: 先に危険があること。
  answer: A
  explanation: マニュアルには、一部の規制標識には赤い円に赤い斜線が引かれたシンボルがあり、これらの標識は特定の行為を禁止していると記載されています。
- id: 159
  category: safe_driving_rules
  question: 標識に掲示されている法定最高速度で走行すべきなのはいつですか？
  choices:
    A: 渋滞を防ぐために常にその速度で走行すべきである。
    B: 日中の時間帯のみ。
    C: 理想的な運転条件（天候や交通状況が良い時）のみ。
    D: 左車線を走行している時はいつでも。
  answer: C
  explanation: 最高速度制限は理想的な運転条件においてのみ適用されるものであり、天候や交通状況に応じて速度を落とさなければなりません。
- id: 160
  category: signs_and_signals
  question: 「点滅時、学校周辺制限速度（School Speed Limit When Flashing）」の標識に従う必要があるのはいつですか？
  choices:
    A: 平日の午前8時から午後5時の間。
    B: 標識のライトが点滅している時のみ。
    C: 歩道に子供が見える時はいつでも。
    D: 学期中のすべての時間。
  answer: B
  explanation: マニュアルによると、スクールゾーンでの減速された制限速度は、ライトが点滅している時のみ義務付けられます。それ以外の時は、その道路の通常の制限速度に従ってください。
- id: 161
  category: signs_and_signals
  question: 「譲れ（Yield）」の標識の形と色は何ですか？
  choices:
    A: 白地に赤い文字の赤い八角形
    B: 黄色の地に黒い文字のひし形
    C: 赤と白の逆三角形
    D: 白い長方形に黒い文字
  answer: C
  explanation: 「譲れ（Yield）」の標識は、赤と白の逆三角形で、赤い文字が書かれています。
- id: 162
  category: safe_driving_rules
  question: 共有センターレーン（shared center lane）の適切な使い方は何ですか？
  choices:
    A: 遅い車両を追い越すため
    B: ラッシュアワー時の直進通行のため
    C: いずれの方向からも左折する車両のため
    D: 緊急停車のみ
  answer: C
  explanation: 共有センターレーンは、いずれの方向からも左折する車両のために予約されており、直進通行や他車の追い越しに使用してはいけません。
- id: 163
  category: safe_driving_rules
  question: どのような状況で交差点に進入してはいけませんか？
  choices:
    A: 信号が青に変わったばかりのとき
    B: 交通状況により、交差点を完全に通り抜けることができないとき
    C: 角で歩行者が待っているとき
    D: 赤信号で右折するとき
  answer: B
  explanation: 交通状況により交差点を完全に通り抜けることができない場合は、交通を遮断することになるため、交差点に進入してはいけません。
- id: 164
  category: signs_and_signals
  question: 赤い円の中に白い水平線が描かれた正方形の標識は何ですか？
  choices:
    A: 一時停止（Stop）
    B: 譲れ（Yield）
    C: 逆走（Wrong Way）
    D: 進入禁止（Do Not Enter）
  answer: D
  explanation: 赤い円の中に白い水平線が描かれた正方形の標識は、進入禁止（Do Not Enter）を意味します。
- id: 165
  category: signs_and_signals
  question: 緑色の目的地標識で、標識の左側に「Exit（出口）」という文字が書かれている場合、それは何を意味しますか？
  choices:
    A: 出口が閉鎖されている
    B: 出口車線またはランプが左側にある
    C: カープール（相乗り）専用の出口である
    D: 出口車線またはランプが右側にある
  answer: B
  explanation: 出口標識の左側に「Exit」という文字が書かれている場合、出口車線またはランプは左側にあります。
- id: 166
  category: signs_and_signals
  question: 休憩所、ガソリンスタンド、ホテル、病院などの場所を示す案内標識（サービスサイン）は何色ですか？
  choices:
    A: 緑
    B: 茶色
    C: 青
    D: 蛍光ピンク
  answer: C
  explanation: 案内標識（サービスサイン）は、青色の正方形または長方形で、白い文字や記号が使われています。これらは休憩所、ガソリンスタンド、ホテル、病院などのサービスの場所を示します。
- id: 167
  category: signs_and_signals
  question: 自然災害や有害物質の流出などに使用される一時的なインシデント標識は何色ですか？
  choices:
    A: オレンジ地に黒い文字
    B: 蛍光ピンク地に黒い文字
    C: 黄色地に黒い文字
    D: 赤地に白い文字
  answer: B
  explanation: インシデント標識は一時的なもので、道路利用者の事故、自然災害、または流出事故を知らせるものです。これらの標識は蛍光ピンク地に黒い文字で構成されています。
- id: 168
  category: safe_driving_rules
  question: 対向車線の間に実線と破線の両方の黄色い線がある道路を走行中、どのような時に追い越しが許可されますか？
  choices:
    A: 黄色の実線が自分の側にある場合のみ
    B: 黄色の破線が自分の側にあり、安全な車間距離がある場合のみ
    C: クラクションを鳴らせばいつでも
    D: 黄色い線がある道路では追い越しは一切許可されない
  answer: B
  explanation: 対向車線の間に実線と破線の両方の黄色い線がある場合、実線が自分の側にあるときは追い越してはいけません。破線が自分の側にある場合は、交通の流れに安全な隙間があれば追い越すことができます。
- id: 169
  category: safe_driving_rules
  question: 車線の間にある2本の黄色い実線は何を示していますか？
  choices:
    A: どちら側からも追い越し禁止だが、隙間がある時に曲がるために横切ることはできる
    B: 安全な隙間があれば、どちら側からも追い越しができる
    C: その車線は共有センターターンレーンである
    D: 一方通行の道路に近づいている
  answer: A
  explanation: 車線の間にある2本の黄色い実線は、どちら側からも追い越しができないことを意味します。ただし、交通の流れに隙間がある場合に、曲がるために黄色い実線を横切ることは許可されています。
- id: 170
  category: safe_driving_rules
  question: 同じ方向に進む車線の間にある白い実線は何を意味しますか？
  choices:
    A: 自由に進路変更ができる
    B: 特別な状況で進路変更が必要な場合を除き、車線内に留まらなければならない
    C: 車線が終了するため、左に合流しなければならない
    D: スクールゾーンに進入している
  answer: B
  explanation: 車線の間にある白い実線は、特別な状況で進路変更が必要な場合を除き、その車線内に留まらなければならないことを意味します。
- id: 171
  category: safe_driving_rules
  question: 信号機に「赤信号での右折禁止（NO TURN ON RED）」の標識がない場合、赤信号で右折する前に何をしなければなりませんか？
  choices:
    A: 時速5マイルまで減速し、停止せずに進む
    B: 停止線で停止し、交通状況と歩行者を確認する
    C: 交差する車両に警告するためにクラクションを鳴らす
    D: 信号が黄色に変わるのを待ってから曲がる
  answer: B
  explanation: 信号機に「赤信号での右折禁止」の標識がない場合、停止線で停止し、交通状況と歩行者を確認した後に、赤信号で右折することができます。
- id: 172
  category: safe_driving_rules
  question: ドライブウェイ（私道）、路地、またはガソリンスタンドなどの建物敷地内から出る際、どこで停止しなければなりませんか？
  choices:
    A: 交通状況が見えるように、歩道を越えた直後
    B: 歩行者がいない限り停止する必要はない
    C: 歩道の手前
    D: 最も近い走行車線内
  answer: C
  explanation: ドライブウェイ、路地、または建物敷地内から出る場合は、一時停止標識がある場合と同様に停止することが義務付けられています。歩道の手前で停止し、すべての歩行者および車両に優先権を譲らなければなりません。
- id: 173
  category: signs_and_signals
  question: リバーシブルレーン（時間帯により通行方向が変わる車線）において、黄色の「X」の点滅信号は何を意味しますか？
  choices:
    A: その車線は利用できない
    B: その下の車線を一般走行に使用できる
    C: 車線の運用が変更されるため、車線から出なければならない
    D: その車線は右左折専用である
  answer: D
  explanation: 車線上の信号は、リバーシブルレーンの交通の流れを指定します。黄色の「X」の点滅は、その車線が右左折専用であることを意味します。
- id: 174
  category: signs_and_signals
  question: リバーシブルレーンの上にある黄色の「X」の点灯信号は何を示していますか？
  choices:
    A: その車線は右左折専用である
    B: 車線の運用が変更されるため、安全が確認でき次第速やかにその車線から出なければならない
    C: 追い越しのためにその車線を使用できる
    D: その車線はバス専用である
  answer: B
  explanation: 黄色の「X」の点灯は、車線の運用が変更されることを意味しており、安全が確認でき次第速やかにその車線から出なければなりません。
- id: 175
  category: signs_and_signals
  question: 専用車線をマークするために、道路脇に掲示されたり路面に描かれたりすることが多い記号は何ですか？
  choices:
    A: 白いひし形（ダイヤモンド型）
    B: 黄色の円
    C: 赤い八角形
    D: 緑の正方形
  answer: A
  explanation: 専用車線は、その車線が特定の用途のために予約されていることを示す特別な車線標示によってマークされており、多くの場合、道路脇に掲示されるか路面に描かれた白いひし形（ダイヤモンド型）のマークがあります。
- id: 176
  category: sharing_the_road
  question: 専用車線にある「HOV 3」の標識は何を示していますか？
  choices:
    A: 車両は制限速度より少なくとも時速3マイル以上で走行しなければならない
    B: その車線は3人以上が乗車している車両専用である
    C: その車線は3軸の大型商用車専用である
    D: ハイブリッド車または電気自動車のみがその車線を使用できる
  answer: B
  explanation: HOV標識または標示は「High Occupancy Vehicles（高乗車人数車両）」を意味し、2人以上が乗車している車両専用の車線を示します。「HOV
    3」は、その車線を使用するために車両に少なくとも3人が乗車していなければならないことを意味します。
- id: 177
  category: safe_driving_rules
  question: 運転中に曲がり角や出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 停止して、走行車線を慎重にバックする
    B: 路肩に寄せて、出口までバックする
    C: 安全に転回（Uターン）できる場所まで進む
    D: 中央分離帯を越えてUターンする
  answer: C
  explanation: 曲がり角や出口を通り過ぎてしまった場合、バックしてはいけません。運転者は安全に転回できる場所まで進むべきです。
- id: 178
  category: safe_driving_rules
  question: 同じ方向に3車線以上ある道路を走行する場合、通常どの車線を使用すべきですか？
  choices:
    A: 最も左側の車線
    B: 最も右側の車線
    C: 中央の走行車線
    D: 路肩
  answer: C
  explanation: 同じ方向に3車線以上ある道路では、特に交通の流れに合流または離脱する車両が多い場合、中央の走行車線を使用してください。
- id: 179
  category: safe_driving_rules
  question: 多車線道路での追い越しに関するルールのうち、正しいものはどれですか？
  choices:
    A: 最も右側の車線は、遅い車両を追い越すためのものである
    B: 前方の車両が左折しようとしている場合、舗装された路肩を通って追い越してもよい
    C: 最も左側の車線は、遅い車両を追い越すために使用されるものである
    D: 右側からの追い越しが常に最も安全な選択肢である
  answer: C
  explanation: 多車線道路では、最も左側の車線は遅い車両を追い越すために使用されることを意図しています。
- id: 180
  category: safe_driving_rules
  question: 右左折を制御する標識や車線標示がない交差点で曲がる際、どのようにすべきですか？
  choices:
    A: 他の車両のためにスペースを空けるよう、最も遠い車線に入る
    B: 進みたい方向に向かっている、自分に最も近い車線に入る
    C: 常に中央の車線に入る
    D: 曲がる前に反対側に大きく膨らんで曲がる
  answer: B
  explanation: 安全上の予防措置として、進みたい方向に向かっている、自分に最も近い車線に入ってください。そうすることで、横切る車線の数を最小限に抑えることができます。
- id: 181
  category: safe_driving_rules
  question: 右折する前に左側に大きく膨らむことの一般的な危険性は何ですか？
  choices:
    A: 横断歩道の歩行者にぶつかる可能性がある。
    B: 後続車のドライバーが、あなたが車線変更をしようとしていると思い、右側から追い越そうとする可能性がある。
    C: 車両のトラクションが失われ、スリップする。
    D: リバーシブルレーンへの進入を余儀なくされる。
  answer: B
  explanation: 右折時には、曲がる前に左側に大きく膨らまないようにしてください。別の車線に移動すると、後続車のドライバーはあなたが車線変更をするか左折しようとしていると思い、右側から追い越そうとする可能性があります。
- id: 182
  category: safe_driving_rules
  question: 市街地の道路で誤った方向に向かっていることに気づいた場合、方向転換をする最も安全な方法は何ですか？
  choices:
    A: 道路の真ん中でUターンをする。
    B: 交通量の多い交差点で前進による2ポイント・ターンアバウトを行う。
    C: 右折してブロックを一周する。
    D: 中央分離帯を横切る。
  answer: C
  explanation: 方向転換をする最も安全な方法は、右折してブロックを一周することです。これにより、対向車線を横切る左折の多くを避けることができます。
- id: 183
  category: safe_driving_rules
  question: 州間高速道路（インターステート）を走行中に引き返す必要がある場合、どうしなければなりませんか？
  choices:
    A: 緊急車両専用の連絡路（クロスオーバー・エリア）を使用する。
    B: 注意深く中央分離帯を横切る。
    C: 次の出口まで行き、そこで引き返す。
    D: 路肩に停車し、交通が途切れるのを待ってから転回する。
  answer: C
  explanation: 州間高速道路にいる場合は、次の出口まで行って引き返してください。中央分離帯を横切ったり、緊急車両専用の連絡路を使用したりすることは違法です。
- id: 184
  category: safe_driving_rules
  question: 私道を利用して2ポイント・ターンアバウト（方向転換）を行う際、最も安全とされる方法は何ですか？
  choices:
    A: 私道に前進で入り、道路へバックで出る。
    B: 出る時に交通状況がよく見えるよう、私道にバックで入る。
    C: 私道に入らずにUターンをする。
    D: 歩道に乗り上げて方向転換する。
  answer: B
  explanation: 2ポイント・ターンアバウトを行う最も安全な方法は、車両をバックで私道に入れることです。これにより、私道を出る際に交通状況をよりよく確認することができます。
- id: 185
  category: defensive_driving
  question: マニュアルによると、最も難しく危険な方向転換の方法は何ですか？
  choices:
    A: Uターン
    B: 前進による2ポイント・ターンアバウト
    C: 3ポイント・ターンアバウト
    D: ラウンドアバウトの走行
  answer: C
  explanation: マニュアルには次のように記載されています。「3ポイント・ターンアバウト — これは最も難しく危険な方向転換の方法です。道路が狭すぎてUターンができず、ブロックを一周することもできない場合にのみ使用してください。」
- id: 186
  category: safe_driving_rules
  question: Uターンをしなければならない場合、回転を始める前に車両をどのように配置すべきですか？
  choices:
    A: できるだけ左側に寄せる
    B: できるだけ右側に寄せる
    C: 中央線をまたぐ
    D: 交差点の真ん中で停止する
  answer: B
  explanation: マニュアルには次のように指示されています。「Uターンをしなければならない場合は、できるだけ右側に寄せてください。両方向の交通が大きく途切れるのを待ってから、ハンドルを左に一杯に切ります...」
- id: 187
  category: safe_driving_rules
  question: ラウンドアバウトやトラフィックサークル（環状交差点）に入る際、どのくらいの速度まで減速すべきですか？
  choices:
    A: 時速5〜10マイル (5-10 mph)
    B: 時速15〜20マイル (15-20 mph)
    C: 時速25〜30マイル (25-30 mph)
    D: 時速35〜40マイル (35-40 mph)
  answer: B
  explanation: ラウンドアバウトやトラフィックサークルに入る際は、急なカーブを曲がる必要があります。マニュアルには「時速約15〜20マイル (15-20
    mph) まで速度を落としてください」と記載されています。
- id: 188
  category: sharing_the_road
  question: ラウンドアバウトに入る際、誰に優先権がありますか？
  choices:
    A: 進入してくる車両
    B: 環状内を走行中の車両
    C: 右側の車両
    D: 大型トラックのみ
  answer: B
  explanation: ラウンドアバウトでは、車両は中央の島を囲んで反時計回りに走行し、「進入する車両は、環状内を走行中の車両に優先権を譲らなければなりません」。
- id: 189
  category: signs_and_signals
  question: トラフィックサークルやラウンドアバウトを直進する場合、方向指示器（ウィンカー）をどのように使用すべきですか？
  choices:
    A: ラウンドアバウトに近づく際に「左」の合図を出す
    B: ラウンドアバウトに近づく際に「右」の合図を出す
    C: 近づく際は合図不要だが、出たい出口の手前で「右」の合図を出す
    D: いかなる時点でも方向指示器は必要ない
  answer: C
  explanation: マニュアルには次のように記載されています。「直進する場合は、接近中の合図は不要です。ただし、出たい出口の手前で『右』の合図を出してください。」
- id: 190
  category: sharing_the_road
  question: トラフィックサークルやラウンドアバウト内で、特にどのようなものの横を走行することを避けるべきですか？
  choices:
    A: オートバイ
    B: 自転車
    C: 歩行者
    D: トラックやバスなどの大型車両
  answer: D
  explanation: マニュアルでは明確に次のように警告しています。「トラフィックサークルやラウンドアバウト内では、トラックやバスなどの大型車両と並走しないでください。」
- id: 191
  category: sharing_the_road
  question: スクールバスに対して停止しなければならないのはいつですか？
  choices:
    A: バスが自車線側にいるときのみ
    B: 赤いライトが点滅している、および/またはストップアーム（停止表示板）が出ている状態で停車しているとき
    C: 子供たちが実際に通りを渡っているのが見えたときのみ
    D: バスが踏切で停車しているとき
  answer: B
  explanation: スクールバスに関する規則によると、「赤いライトが点滅している、および/またはストップアームが出ている状態で停車しているスクールバスに対しては、停止しなければならない」とされています。
- id: 192
  category: defensive_driving
  question: 路上に駐車した車両に乗り込む際、運転席のドアにはどのように近づくべきですか？
  choices:
    A: 車両の後方から
    B: 車両の前方から
    C: 歩道から直接
    D: どのように近づいても関係ない
  answer: B
  explanation: 安全性を高めるため、マニュアルでは次のようにアドバイスしています。「路上で車両に乗り込む際は、対向車への意識を高めるため、鍵を手に持ち、車両の前方から運転席のドアに近づいてください。」
- id: 193
  category: safe_driving_rules
  question: 縁石の有無にかかわらず、下り坂で駐車する場合、ハンドルはどちらの方向に切るべきですか？
  choices:
    A: 道路の端または縁石側とは反対方向に大きく切る
    B: 道路の端または縁石側に向かって大きく切る
    C: 車輪を完全に真っ直ぐにしておく
    D: 車輪を少し左に切る
  answer: B
  explanation: 縁石の有無にかかわらず下り坂で駐車する場合は、「ゆっくりと前進しながら、ハンドルを道路の端または縁石側に向かって大きく切る」必要があります。これにより、万が一車両が動き出したとしても、交通の流れから離れる方向に転がります。
- id: 194
  category: safe_driving_rules
  question: 縁石がない上り坂で車両を駐車する場合、ハンドルはどのように切るべきですか？
  choices:
    A: 道路の端に向かって大きく切る
    B: 道路の端から離れる方向に大きく切る
    C: 車輪を真っ直ぐにしておく
    D: 車輪を左に切る
  answer: A
  explanation: 縁石のない上り坂で駐車する場合は、「ゆっくりと前進しながら、ハンドルを道路の端に向かって大きく切る」必要があります。こうすることで、車両が動き出した場合に交通の流れから離れる方向に転がります。
- id: 195
  category: safe_driving_rules
  question: 直角駐車または斜め駐車のスペースから出る際、ハンドルを切る前にどの程度直進して後退すべきですか？
  choices:
    A: リアバンパーが駐車スペースから出るまで
    B: フロントバンパーが、曲がる方向とは反対側に駐車している車両を通り過ぎるまで
    C: 完全に走行車線の中央に来るまで
    D: 後退を開始したらすぐにハンドルを切るべきである
  answer: B
  explanation: これらの駐車スペースから出る際は、「交通状況を確認し続け、フロントバンパーが曲がる方向とは反対側に駐車している車両を通り過ぎるまで直進して後退します。その後、ハンドルを大きく切ります。」
- id: 196
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）の中央島（センターアイランド）の周りを、車両はどの方向に進みますか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 8の字パターン
    D: 出口までの最短距離の方向
  answer: B
  explanation: マニュアルには次のように記載されています。「車両は中央島の周りを反時計回りに走行し、進入する車両は循環している車両に優先権を譲ります。」
- id: 197
  category: sharing_the_road
  question: 車道の間に中央右左折車線（センターターニングレーン）がある場合、反対車線で赤いライトを点滅させているスクールバスに対して停止する必要がありますか？
  choices:
    A: はい。バスが自車線側か反対車線側かにかかわらず、停止しなければなりません。
    B: いいえ。中央右左折車線が物理的な障壁として機能します。
    C: 現在、中央右左折車線を走行している場合のみ停止する。
    D: いいえ。バスが自車線側にいる場合のみ停止する。
  answer: A
  explanation: マニュアルには明確に次のように記載されています。「車道の間に中央右左折車線がある場合、スクールバスが自車線側であっても反対車線側であっても、停止しなければなりません。」
- id: 198
  category: safe_driving_rules
  question: マニュアルによると、消火栓から何フィート以内の駐車が禁止されていますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 30フィート
  answer: B
  explanation: マニュアルの「駐車禁止区域」の項目には、消火栓から15フィート以内に駐車してはならないと記載されています。
- id: 199
  category: safe_driving_rules
  question: 交通信号機、一時停止標識、または譲れ（前方優先）標識から何フィート以内に車両を駐車してはいけませんか？
  choices:
    A: 15フィート
    B: 20フィート
    C: 30フィート
    D: 50フィート
  answer: C
  explanation: マニュアルでは、交通信号機、一時停止標識、または譲れ標識から30フィート以内の駐車を禁止しています。
- id: 200
  category: signs_and_signals
  question: 赤く塗られた縁石は何を示していますか？
  choices:
    A: 短時間の停車のみ許可されている
    B: 荷物積み下ろし区域（ローディングゾーン）
    C: ハンディキャップ制限
    D: 消防用区域（ファイヤーゾーン）の制限
  answer: D
  explanation: 縁石の塗装は駐車制限を示しており、赤い縁石は消防用区域の制限を示しています。
- id: 201
  category: signs_and_signals
  question: 白く塗られた縁石（えんせき）の意味は：
  choices:
    A: 短時間の停車のみ許可されている
    B: 積み下ろし区域である
    C: 常に駐車禁止である
    D: 障害者専用の制限がある
  answer: A
  explanation: マニュアルによると、白く塗られた縁石は短時間の停車のみが許可されていることを示しています。
- id: 202
  category: safe_driving_rules
  question: 車両を縁石と平行に駐車する場合、縁石から最大でどのくらいまで離して駐車できますか？
  choices:
    A: 縁石から6インチまで
    B: 縁石から1フィートまで
    C: 縁石から18インチまで
    D: 縁石から2フィートまで
  answer: B
  explanation: マニュアルの「駐車禁止区域」のセクションには、縁石から1フィート（1 foot）以上離して駐車してはならないと記載されています。
- id: 203
  category: defensive_driving
  question: 市街地を走行中、どのくらい先まで視線を向けるべきですか？
  choices:
    A: 少なくとも1ブロック先、または信号機1つ分先
    B: 少なくとも2ブロック先、または信号機2つ分先
    C: 少なくとも3ブロック先、または信号機3つ分先
    D: 少なくとも4分の1マイル先
  answer: B
  explanation: 市街地では、問題を早期に発見し急ブレーキを避けるために、少なくとも2ブロック先、または信号機2つ分先を見る必要があります。
- id: 204
  category: defensive_driving
  question: 進行方向の潜在的な問題を特定するために、どのくらいの視覚的リード（visual lead）を維持すべきですか？
  choices:
    A: 5〜10秒先
    B: 10〜15秒先
    C: 20〜30秒先
    D: 30〜40秒先
  answer: C
  explanation: 視覚的リードとは、車両の前方20〜30秒先のエリアのことです。適切な視覚的リードを保つことで、進行路の変化を察知しやすくなります。
- id: 205
  category: safe_driving_rules
  question: 時速60マイル（60 mph）で走行中、乾燥した路面で問題に反応し、車両を停止させるまでにおよそどのくらいの時間と距離が必要ですか？
  choices:
    A: 2〜3秒、または123フィート
    B: 3〜4秒、または250フィート
    C: 4〜5秒、または359フィート
    D: 5〜6秒、または450フィート
  answer: C
  explanation: 良好なタイヤと乾燥した路面であっても、時速60マイルでは、問題に反応して車両を停止させるまでに約4〜5秒、または359フィートかかることがあります。
- id: 206
  category: defensive_driving
  question: 交差点で停止している場合、進入する前にどこを確認すべきですか？
  choices:
    A: 左、右、そしてもう一度左
    B: 右、左、そしてもう一度右
    C: 直進方向のみ
    D: 左と直進方向のみ
  answer: A
  explanation: マニュアルでは、交差点で停止している場合、進入する前に左、右、そしてもう一度左を確認することを推奨しています。
- id: 207
  category: safe_driving_rules
  question: 縦列駐車のスペースから出る際、いつハンドルをまっすぐに戻し、適切な車線へと前進すべきですか？
  choices:
    A: ドライブ（D）にシフトした直後
    B: 自車のフロントバンパーが前方の車両のリアバンパーを通過したとき
    C: 自車のドアポスト（柱）が前方に駐車している車両のリアバンパーを通過したとき
    D: 可能な限り後退した後
  answer: C
  explanation: 自車のドアポストが前方に駐車している車両のリアバンパーを通過したときに、ハンドルをまっすぐに戻して適切な車線へと前進する必要があります。
- id: 208
  category: signs_and_signals
  question: マニュアルの知識テストによると、規制標識（regulatory signs）は何色ですか？
  choices:
    A: 緑
    B: 黄
    C: 白
    D: オレンジ
  answer: C
  explanation: 「知識テスト」のセクションでは、規制標識は白であると示されています。
- id: 209
  category: safe_driving_rules
  question: 縁石のある上り坂で車両を駐車する場合、車輪はどのように向けるべきですか？
  choices:
    A: 縁石の方に向ける
    B: 縁石とは反対の方に向ける
    C: まっすぐ向ける
    D: 右に向ける
  answer: B
  explanation: 「知識テスト」のセクションでは、縁石のある上り坂で車両を駐車する場合、車輪は縁石とは反対の方に向けるべきであると確認されています。
- id: 210
  category: safe_driving_rules
  question: 交差点で左折の準備をする際、どうすべきですか？
  choices:
    A: 信号が赤になるまで横断歩道の手前で待機する。
    B: 左折の準備ができるよう、交差点内に進入する。
    C: 対向車の切れ間を待つ間、車輪を左に向けておく。
    D: 対向車より先に曲がれるよう加速する。
  answer: B
  explanation: マニュアルによると、交差点で左折する際は、左折の準備ができるよう交差点内に進入しておく必要があります。
- id: 211
  category: safe_driving_rules
  question: 踏切（highway-railroad grade crossing）にはどのように接近すべきですか？
  choices:
    A: 線路が見えるまで速度を維持する。
    B: 円形の警告標識のところで直ちに停止する。
    C: 円形の警告標識のところで減速し、各方向を確認する。
    D: できるだけ早く線路を渡りきるために加速する。
  answer: C
  explanation: マニュアルでは、踏切に接近する際は、円形の警告標識のところで減速し、線路の手前で各方向を確認するように定めています。
- id: 212
  category: defensive_driving
  question: 車線変更をする際、移動を開始する前に交通の流れの中にどの程度の大きさの隙間（ギャップ）を確認すべきですか？
  choices:
    A: 2〜3秒分
    B: 4〜5秒分
    C: 6〜8秒分
    D: 10〜12秒分
  answer: B
  explanation: 車線変更をする際は、交通の流れの中に4〜5秒分の隙間を確認し、合図を出し、車線変更をする方向を再度目視する必要があります。
- id: 213
  category: defensive_driving
  question: 車線変更の前に、車両の死角（blind spots）をどのように確認すべきですか？
  choices:
    A: バックミラーだけを厳密に見て確認する。
    B: サイドミラーを2回チェックして確認する。
    C: 首を振り、肩越しに目視して確認する。
    D: 他のドライバーに警告するためにクラクションを鳴らす。
  answer: C
  explanation: ミラーでは確認できない範囲があるため、移動しようとする方向に首を振り、肩越しに目視して死角を確認しなければなりません。
- id: 214
  category: defensive_driving
  question: 車両の後方を確認するためにミラーを使用することが特に重要なのはどのような時ですか？
  choices:
    A: 高速道路の進入路で加速している時。
    B: 急減速する時や、私道（ドライブウェイ）のような予期せぬ場所で減速する時。
    C: 青信号を通過している時。
    D: 指定された駐車スペースに停車している時。
  answer: B
  explanation: 急減速する場合や、私道や駐車スペースなど、後続のドライバーが減速を予期しない場所では、車両の後方を確認することが非常に重要です。
- id: 215
  category: defensive_driving
  question: 注意深いドライバーが危険を認識するまでの平均的な認知時間（perception time）はどのくらいですか？
  choices:
    A: 1/4〜1/2秒
    B: 3/4〜1秒
    C: 1.5〜2秒
    D: 3〜4秒
  answer: B
  explanation: マニュアルによると、注意深いドライバーの平均的な認知時間は3/4秒から1秒です。
- id: 216
  category: safe_driving_rules
  question: 理想的な条件下で、時速50マイル（50 mph）で走行している車両の最小総停止距離はどのくらいですか？
  choices:
    A: 55フィート
    B: 158フィート
    C: 268フィート
    D: 350フィート
  answer: C
  explanation: 総停止距離には、認知距離、反応距離、および制動距離が含まれます。時速50マイルでは、完全に停止するまでに車両は最低268フィート進みます。
- id: 217
  category: safe_driving_rules
  question: 速度を時速20マイルから40マイルへと2倍にした場合、衝撃の強さと制動距離はどうなりますか？
  choices:
    A: 2倍になる。
    B: 3倍になる。
    C: 4倍になる。
    D: 9倍になる。
  answer: C
  explanation: 速度を20マイルから40マイルに倍増させると、衝撃は4倍になり、制動距離も4倍長くなります。
- id: 218
  category: defensive_driving
  question: パニックブレーキ（急停止）を避けるために、車両のどのくらい先を見るべきですか？
  choices:
    A: 少なくとも3秒先
    B: 少なくとも5秒先
    C: 少なくとも10秒先
    D: 少なくとも15秒先
  answer: C
  explanation: 前方の出来事や問題を十分に余裕を持って把握し、パニックブレーキを避けるために、少なくとも10秒先を見るようにしてください。
- id: 219
  category: safe_driving_rules
  question: 道路のカーブを走行する最も安全な方法は何ですか？
  choices:
    A: カーブに入る前に大きく加速する。
    B: カーブに入った後に急ブレーキをかける。
    C: カーブに入る前に速度を落とす。
    D: ニュートラルに入れて惰性でカーブを通過する。
  answer: C
  explanation: カーブに入る前に、必ず安全な速度まで減速してください。カーブに進入した後に急ブレーキをかけると、タイヤのトラクション（摩擦力）が失われる原因となります。
- id: 220
  category: defensive_driving
  question: 雨が降り始めた直後の路面が特に滑りやすいのはなぜですか？
  choices:
    A: 雨が路面上のトラクション向上剤を洗い流してしまうため。
    B: 水が路面上の泥やオイル、その他の物質と混ざり合うため。
    C: 急激な温度低下により、雨が瞬時に凍結するため。
    D: タイヤが冷えすぎて路面をグリップできなくなるため。
  answer: B
  explanation: 雨、雪、みぞれが降り始めた直後は、水が路面上の泥やオイル、その他の物質と混ざり合うため、路面がより滑りやすくなります。
- id: 221
  category: safe_driving_rules
  question: 濡れた路面では、速度をどの程度落とすべきですか？
  choices:
    A: 推奨速度より約5 mph落とす。
    B: 推奨速度より約10 mph落とす。
    C: 推奨速度の半分まで落とす。
    D: 速度を落とす必要はない。
  answer: B
  explanation: 濡れた路面では、停止距離を十分に確保し、トラクション（摩擦力）の喪失に備えるため、推奨速度より約10 mph速度を落とすべきです。
- id: 222
  category: safe_driving_rules
  question: 路面に圧雪がある場合、どのように速度を調整すべきですか？
  choices:
    A: 速度を5 mph落とす。
    B: 速度を10 mph落とす。
    C: 速度を半分かそれ以下に落とす。
    D: 掲示されている制限速度を維持する。
  answer: C
  explanation: マニュアルには、「路面に圧雪がある場合は、速度を半分かそれ以下に落としなさい」と記載されています。
- id: 223
  category: vehicle_information
  question: カンザス州において、車両にスタッド付きスノータイヤ（スパイクタイヤ）を装着することが許可されている期間はいつですか？
  choices:
    A: 10月1日から3月1日まで
    B: 11月1日から4月1日まで
    C: 12月1日から2月28日まで
    D: 通年
  answer: B
  explanation: カンザス州では、毎年11月1日から4月1日までの間、車両にスタッド付きスノータイヤを装着することが認められています。
- id: 224
  category: defensive_driving
  question: 道路排水の標準的な設計により、凍結した路面が特に危険になるのはなぜですか？
  choices:
    A: 排水溝の格子が凍結し、大きな段差が生じるため。
    B: 道路が中央に向かって傾斜しており、車両同士が衝突しやすくなるため。
    C: 道路は中央が高く、両端に向かって傾斜しているため、スリップした車両が路外に滑り落ちやすくなるため。
    D: 排水溝が溢れ、路面が氷で覆われるため。
  answer: C
  explanation: 凍結した路面が特に危険なのは、道路排水のための標準的な設計（中央が高く、両端に向かって傾斜している設計）により、スリップした車両が路外へ滑り落ちてしまうためです。
- id: 225
  category: safe_driving_rules
  question: 他の路面が乾いていても、橋や高架橋の路面が凍結していることがあるのはなぜですか？
  choices:
    A: より滑らかなコンクリートで建設されているため。
    B: 通常の道路よりも直射日光が当たる時間が短いため。
    C: 下に地面（土）がないため、寒さから絶縁（保温）されないため。
    D: より長い時間、水を保持するように設計されているため。
  answer: C
  explanation: マニュアルによると、橋は下に地面がないため寒さから絶縁されず、他の道路よりも温度が低くなりやすく、凍結しやすいとされています。
- id: 226
  category: defensive_driving
  question: 大雨の際、タイヤが路面とのトラクション（摩擦力）を完全に失う可能性があるのは、時速何マイルからですか？
  choices:
    A: 25-30 mph
    B: 30-35 mph
    C: 35-40 mph
    D: 45-50 mph
  answer: D
  explanation: 大雨の中では、車両が前進する際に水がタイヤを押し上げるため、45-50 mphでタイヤが路面とのトラクションを完全に失う（ハイドロプレーニング現象）可能性があります。
- id: 227
  category: vehicle_information
  question: ひどく摩耗したタイヤが濡れた路面でトラクションを失い始めるのは、時速何マイルからですか？
  choices:
    A: 15-20 mph
    B: 25-30 mph
    C: 35-40 mph
    D: 45-50 mph
  answer: B
  explanation: マニュアルには、ひどく摩耗したタイヤはより低い速度、具体的には25-30 mphでトラクションを失うと記されています。
- id: 228
  category: safe_driving_rules
  question: 交通の流れよりも時速___以上遅く走ることは、速度超過と同じくらい危険な場合があります。
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: C
  explanation: 交通の流れより15 mph以上遅く走ることは、車両を密集させ、他のドライバーが無謀な追い越しを試みる原因となるため、速度超過と同様に危険です。
- id: 229
  category: safe_driving_rules
  question: 交通の流れに合流する際、加速車線の正しい使い方はどれですか？
  choices:
    A: 加速車線の最後まで走り、停止して隙間ができるのを待つ。
    B: すぐに実線の白線を越えて、できるだけ早く合流する。
    C: 車線を利用して他の車両と同じ速度まで加速してから、本線に入る。
    D: 完全に合流するまで、交通の流れより15 mph遅い速度を維持する。
  answer: C
  explanation: マニュアルでは、本線に入る前に加速車線を使って他の車両と同じ速度まで加速するよう指示しており、車線の端まで行って停止することは避けるよう明示的に警告しています。
- id: 230
  category: safe_driving_rules
  question: 減速車線を使ってハイウェイを出る際、いつ減速し始めるべきですか？
  choices:
    A: 出口ランプの約0.5マイル手前。
    B: まだ本線の交通の流れの中にいる間。
    C: 車両が減速車線に入った後。
    D: 出口の標識を通過した直後。
  answer: C
  explanation: 減速車線（出口ランプ）を使用する際は、車両が減速車線に完全に移動するまで減速してはいけません。
- id: 231
  category: penalties_and_points
  question: 吹雪の中、時速55マイル制限の区間を時速55マイルで走行している場合、交通違反で摘発される可能性がありますか？
  choices:
    A: いいえ、掲示されている制限速度を超えていないためです。
    B: はい、状況に対して速度が速すぎる（too fast for conditions）として摘発される可能性があります。
    C: いいえ、衝突事故を起こさない限り摘発されません。
    D: はい、ただし商用車を運転している場合に限ります。
  answer: B
  explanation: 道路状況に対して速度が速すぎるとして摘発される可能性があります。たとえ掲示された制限速度が時速55マイルであっても、吹雪の中での時速55マイル走行は、雪の積もった道路において適切な速度とは認められません。
- id: 232
  category: defensive_driving
  question: スピードの出し過ぎを防ぐための最善の方法は何ですか？
  choices:
    A: 道路上で最も速い車と同じペースを保つ。
    B: 頻繁にスピードメーターを確認する。
    C: エンジンの音に耳を澄ませる。
    D: 常に一番右側の車線を走行する。
  answer: B
  explanation: マニュアルによると、スピードの出し過ぎを防ぐ最善の方法は、頻繁にスピードメーターを確認することです。体感速度よりも実際には速く走っていることが多いためです。
- id: 233
  category: vehicle_information
  question: SUV、バン、ピックアップトラックなどの大型車両に特別な操縦特性があるのはなぜですか？
  choices:
    A: 重心が高く、横転（ロールオーバー）しやすいため。
    B: 乗用車よりも小さなタイヤを装備しているため。
    C: アンチロック・ブレーキ・システム (ABS) が装備されていないため。
    D: 高速道路の速度で走行するように設計されていないため。
  answer: A
  explanation: 重心が高い大型車両は、特有の操縦特性を持っており、横転（ロールオーバー）する可能性が高くなります。
- id: 234
  category: vehicle_information
  question: アンチロック・ブレーキ・システム (ABS) の主な機能は何ですか？
  choices:
    A: 衝突が差し迫ったときに自動的にブレーキをかける。
    B: 乾燥した路面での制動距離を短縮する。
    C: 車両のバランスを崩すことなく、ステアリング操作とブレーキ操作を同時に行えるようにする。
    D: 時速35マイル以上でのハイドロプレーニング現象を防ぐ。
  answer: C
  explanation: ABSは、車両のバランスを失うことなく、ステアリング操作（ハンドル操作）とブレーキ操作を同時に行えるように設計されています。
- id: 235
  category: defensive_driving
  question: ABSを使用する際の3つの基本ステップは何ですか？
  choices:
    A: ポンピング、ステアリング、停止 (Pump, Steer, Stop)
    B: 探す、強く踏む、操舵する (Search, Stomp, Steer)
    C: スキャン、スライド、ステアリング (Scan, Slide, Steer)
    D: 合図、減速、停止 (Signal, Slow, Stop)
  answer: B
  explanation: ABS使用の基本は、Search（回避できる空間を探す）、Stomp（ブレーキペダルを強く踏み込む）、Steer（回避できる空間へハンドルを切る）の3つです。
- id: 236
  category: vehicle_information
  question: 緊急時にアンチロック・ブレーキ・システム (ABS) を使用するための基本ステップは何ですか？
  choices:
    A: 探す、強く踏む、操舵する (Search, Stomp, Steer)
    B: スキャン、絞り込む、ステアリング (Scan, Squeeze, Steer)
    C: 探す、スライド、ステアリング (Search, Slide, Steer)
    D: 停止、ステアリング、加速 (Stop, Steer, Speed)
  answer: A
  explanation: マニュアルによると、ABS使用の基本は、Search（回避できる空間を探す）、Stomp（ブレーキペダルを強く踏み込む）、Steer（回避できる空間へハンドルを切る）です。
- id: 237
  category: vehicle_information
  question: 車両のアンチロック・ブレーキ・システム (ABS) が正しく動作していないことをどのように判断できますか？
  choices:
    A: エンジン始動時にABS警告灯が一度も点灯しない。
    B: ABS警告灯が点灯した後、消灯する。
    C: エンジン始動後もABS警告灯が点灯したままになる。
    D: ブレーキペダルが異常に硬く感じる。
  answer: C
  explanation: マニュアルには、車両を始動するとABS警告灯が点灯し、その後に消灯すると記載されています。もし警告灯が点灯したままの場合、ABSは正しく動作していません。
- id: 238
  category: defensive_driving
  question: 横滑り防止装置 (ESP) を装備した車両でトラクションを失った（横滑りした）場合、どうすべきですか？
  choices:
    A: 滑っている方向とは逆の方向に急ハンドルを切る。
    B: 見ている方向（行きたい方向）にハンドルを切り、急な操作を避ける。
    C: トラクションを回復させるためにブレーキを素早くポンピングする。
    D: 横滑りを突き抜けるために強く加速する。
  answer: B
  explanation: ESP装備車でトラクションを失った場合は、行きたい方向を見つめ、その方向にハンドルを操作します。急ハンドルを避け、ESPが電子的に車両を調整できるようにします。
- id: 239
  category: safe_driving_rules
  question: 通常の運転条件下で、推奨される最小の車間距離はどれくらいですか？
  choices:
    A: 1秒
    B: 2秒
    C: 3秒
    D: 4秒
  answer: B
  explanation: マニュアルでは、通常の条件下では最低2秒の車間距離を保つようアドバイスしています。
- id: 240
  category: safe_driving_rules
  question: 悪天候や交通状況が悪い場合、車間距離をどれくらい追加すべきですか？
  choices:
    A: さらに1秒追加する
    B: さらに2秒追加する
    C: さらに3秒追加する
    D: さらに4秒追加する
  answer: A
  explanation: 通常の車間距離2秒に加えて、悪天候や特殊な交通状況の場合はさらに1秒以上の距離を保つ必要があります。
- id: 241
  category: sharing_the_road
  question: なぜオートバイの後ろを走行する際、前方に十分な車間距離を空けることが重要なのですか？
  choices:
    A: オートバイは乗用車よりも加速が大幅に遅いため。
    B: オートバイは車線の中央を走行することが義務付けられているため。
    C: オートバイは他の自動車とはサイズや制動能力が異なるため。
    D: オートバイは常に他の交通の流れよりも低速で走行するため。
  answer: C
  explanation: マニュアルでは、オートバイはサイズが異なり、制動能力も異なるため、後ろを走る際は車間距離を多めに取るよう定めています。万が一オートバイが転倒した場合、ライダーを避けるために余分な距離が必要になります。
- id: 242
  category: vehicle_information
  question: 重い荷物を積んだりトレーラーを牽引したりすることは、車両のハンドリングにどのような影響を与えますか？
  choices:
    A: 停止時間が短縮され、ステアリング操作能力が向上する。
    B: 停止時間が増加し、ステアリング操作能力が低下する。
    C: 停止時間には影響しないが、ステアリング操作は向上する。
    D: 雨天時の車両のトラクション（駆動力）が向上する。
  answer: B
  explanation: 重い荷物を積んだりトレーラーを牽引したりする場合、重量の増加によって車両の停止時間が長くなり、ステアリング操作が難しくなるため、前方の車間距離をより長く取る必要があります。
- id: 243
  category: sharing_the_road
  question: 多くの州では、他の車両は緊急用装備（緊急車両）の後方から少なくとも何フィート離れて走行することを義務付けていますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: 多くの州では、他の車両は緊急用装備の後方から少なくとも500フィート離れて走行することを義務付けています。これは時速30マイルで走行している場合、最低12秒間の距離に相当します。
- id: 244
  category: defensive_driving
  question: 後続車に車間距離を極端に詰められ（テールゲーティング）、移動できる空き車線がない場合はどうすべきですか？
  choices:
    A: ブレーキを素早く軽く踏み（タップし）、後続車のドライバーに警告する。
    B: 距離を広げるために大幅に加速する。
    C: 前方の道路がクリアになるまで待ち、その後ゆっくりと速度を落として後続車に追い越しを促す。
    D: 後続車を思いとどまらせるために、素早く減速する。
  answer: C
  explanation: 空き車線がない場合は、前方の道路が安全になるまで待ち、その後ゆっくりと速度を落として後続車に自車を追い越して行くよう促します。急に減速してはいけません。
- id: 245
  category: defensive_driving
  question: 自車の後ろを極端に詰められている場合、前方車両との車間距離をどのように調整すべきですか？
  choices:
    A: 車間距離を1秒分減らす。
    B: 正確に2秒間の距離を保つ。
    C: 車間距離を2〜3秒分増やす。
    D: 車間距離を5〜6秒分増やす。
  answer: C
  explanation: 後ろを極端に詰められている場合は、前方との車間距離を2〜3秒分増やすことで、停止が必要になった際の時間と空間を確保し、追突されるリスクを軽減します。
- id: 246
  category: safe_driving_rules
  question: 対面通行の1車線道路を走行する際、通常、車両をどの位置に配置するのが最も安全ですか？
  choices:
    A: 中央線に寄り気味に走る。
    B: 車線の中央を走る。
    C: できるだけ道路の右端に寄せて走る。
    D: 車線内の左右を交互に移動しながら走る。
  answer: B
  explanation: 対面通行の1車線道路では、中央線に寄りすぎてはいけません。一般的に、潜在的な問題を避けるために左右どちらにも動けるよう、車線の中央を走行するのが最も安全です。
- id: 247
  category: safe_driving_rules
  question: 他の交通流に合流する際、どの程度の車間の隙間（ギャップ）を選択すべきですか？
  choices:
    A: 1〜2秒
    B: 2〜3秒
    C: 4〜6秒
    D: 8〜10秒
  answer: C
  explanation: 他の交通流に合流する際は、4〜6秒程度の車間の隙間を選択してください。
- id: 248
  category: safe_driving_rules
  question: 通常の状況下で、一時停止した後に交差点を直進して通過するのに、およそどのくらいの時間がかかりますか？
  choices:
    A: 1〜2秒
    B: 3〜5秒
    C: 6〜8秒
    D: 10〜12秒
  answer: B
  explanation: 通常の状況下で、交差点で停止した後に直進して通過する場合、車両は約3〜5秒で交差点を通り抜けることができます。
- id: 249
  category: safe_driving_rules
  question: 通常の状況下で、左折を完了して通常の走行速度に乗るまでに、どのくらいの時間がかかる可能性がありますか？
  choices:
    A: 3〜5秒
    B: 8〜10秒
    C: 12〜15秒
    D: 15〜18秒
  answer: D
  explanation: マニュアルによると、左折を完了して加速し、通常の速度に乗るまでには15〜18秒かかる場合があります。
- id: 250
  category: signs_and_signals
  question: 信号は青ですが、他の車両が交差点内で立ち往生して道を塞いでいる場合、どうすべきですか？
  choices:
    A: 交差点に進入し、前の車両が動くのを待つ。
    B: 道がクリアになるまでクラクションを鳴らし続ける。
    C: 道がクリアになるまで交差点を渡り始めてはいけない。
    D: ゆっくりと前進し、前の車両を無理やり動かそうとする。
  answer: C
  explanation: たとえ信号が青であっても、車両が道を塞いでいる場合は交差点を渡り始めてはいけません。もし交差点内で立ち往生している間に信号が赤に変わると、あなたの車両が交通の流れを不法に妨害することになります。
- id: 251
  category: safe_driving_rules
  question: 接近してくる車両が方向指示器（ウィンカー）を出していても、実際に曲がり始めるまで車線への進入を待つべきなのはなぜですか？
  choices:
    A: 方向指示器が故障している可能性があるため。
    B: ドライバーがあなたの後ろで曲がる予定であるか、消し忘れている可能性があるため。
    C: 他の車両の方向指示器が出ている間に曲がるのは違法であるため。
    D: 方向指示器を出している車両には常に譲らなければならないため。
  answer: B
  explanation: マニュアルによると、方向指示器を出しているドライバーは、あなたの車両を通り過ぎた後に曲がる予定であるか、以前の右左折時に消し忘れた可能性があるとされています。
- id: 252
  category: safe_driving_rules
  question: 他の車両を追い越す際、走行車線に戻っても安全なのはいつですか？
  choices:
    A: 追い越した車両の1台分前方に達したとき。
    B: ルームミラーで追い越した車両の前面全体が見えるようになったとき。
    C: 追い越した車両のフロントバンパーと並んだとき。
    D: 追い越した車両がヘッドライトを点滅させたとき。
  answer: B
  explanation: 合図を出して車線に戻る前に、追い越した車両の前面全体がルームミラーに見えるまで追い越しを続ける必要があります。
- id: 253
  category: sharing_the_road
  question: 他の車両があなたを追い越そうとしていることに気づいたとき、どうすべきですか？
  choices:
    A: 追い越しを阻止するために加速する。
    B: 車線の左側に寄り、減速する。
    C: 車線の右側に寄り、一定の速度を維持する。
    D: ヘッドライトを点滅させ、ブレーキを軽く踏む。
  answer: C
  explanation: 追い越されるときは、右側に寄り、車線の右側に移動して、相手が追い越せるように一定の速度を維持する必要があります。
- id: 254
  category: safe_driving_rules
  question: 原則として、一度に1台の車両しか追い越すべきではないのはなぜですか？
  choices:
    A: 一度に複数の車両を追い越すのは違法であるため。
    B: 複数の車両を追い越すと燃料を大量に消費するため。
    C: 追い越しに必要な時間を判断するのが難しく、20秒から30秒かかる場合があるため。
    D: 車両のエンジンがオーバーヒートする可能性があるため。
  answer: C
  explanation: マニュアルでは、追い越しに必要な時間を判断するのが難しく、20秒から30秒もかかる場合があるため、一度に1台の車両のみを追い越すようアドバイスしています。
- id: 255
  category: defensive_driving
  question: 25秒以上離れた場所にいる対向車は、一般的にドライバーにどのように見えますか？
  choices:
    A: 非常に速く動いているように見える。
    B: 止まっているように見える。
    C: 蛇行しているように見える。
    D: 実際よりも大きく見える。
  answer: B
  explanation: マニュアルによると、自車から25秒以上離れた対向車は、一般的に止まっているように見えます。
- id: 256
  category: safe_driving_rules
  question: 時速55〜60マイル（mph）で走行中、坂道やカーブで安全に追い越しを行うには、前方どのくらいの距離が見えている必要がありますか？
  choices:
    A: 少なくとも1/4マイル。
    B: 少なくとも1/3マイル。
    C: 少なくとも1/2マイル。
    D: 少なくとも1マイル。
  answer: B
  explanation: 時速55〜60マイルで走行中に坂道やカーブの近くで安全に追い越すには、少なくとも1/3マイル、または約20〜25秒先が見えている必要があります。
- id: 257
  category: defensive_driving
  question: 対向車が接近しているときに歩行者を追い越す場合、最適な対処法は何ですか？
  choices:
    A: 対向車が来る前に歩行者を追い越せるよう加速する。
    B: 歩行者と対向車の両方に警告するためにクラクションを鳴らす。
    C: 対向車線に入り、対向車を減速させる。
    D: 減速して対向車を先に通過させ、危険を一つずつ処理する。
  answer: D
  explanation: 危険を最小限に抑えるには、一つずつ対処してください。減速して対向車を先に通過させることで、自車が一度に一人の道路利用者のみを追い越すようにします。
- id: 258
  category: safe_driving_rules
  question: カンザス州では、悪天候時に法律でヘッドライトの点灯が義務付けられているのはいつですか？
  choices:
    A: 時速60マイル以上で走行するときはいつでも。
    B: ワイパーを使用するときはいつでも。
    C: 州間高速道路を走行するときのみ。
    D: 日没から日の出までの間のみ。
  answer: B
  explanation: カンザス州を含む多くの州では、車両のワイパーを使用するときは常にヘッドライトを点灯することが義務付けられています。
- id: 259
  category: defensive_driving
  question: 朝日や夕日に背を向けて運転するとき、なぜヘッドライトを点灯すべきなのですか？
  choices:
    A: 向かってくるドライバーがあなたの車を見つけやすくするため。
    B: 自分のフロントガラスのまぶしさを軽減するため。
    C: 車のバッテリー消費を抑えるため。
    D: 太陽光線がヘッドライトを損傷する可能性があるため。
  answer: A
  explanation: 朝日や夕日に向かって走ってくるドライバーは、あなたの車が見えにくい場合があります。ヘッドライトを点灯することで、相手があなたの車を認識しやすくなります。
- id: 260
  category: safe_driving_rules
  question: 次の状況のうち、クラクションを軽く鳴らすべきなのはどれですか？
  choices:
    A: 歩道の友人に挨拶するとき。
    B: 遅い車にスピードを上げるよう促すとき。
    C: 狭い路地から出るときなど、前方の視界が限られているとき。
    D: 視覚障害のある歩行者の近くを運転するとき。
  answer: C
  explanation: 急な坂道、急カーブ、狭い路地からの出口など、前方の視界が限られている場合は、クラクションを軽く鳴らすのが適切です。
- id: 261
  category: defensive_driving
  question: 車のクラクションを「鋭く鳴らす」のが適切なのはどのような時ですか？
  choices:
    A: 他のドライバーのミスを指摘する時。
    B: 歩行者が道路に飛び出しそうな時。
    C: 激しい渋滞に巻き込まれた時。
    D: 前の車に道を譲ってほしい時。
  answer: B
  explanation: 危険がある場合は、歩行者や自転車が道路に歩き出したり、飛び出したり、走行してきたりしそうな時など、クラクションを鋭く鳴らすべきです。
- id: 262
  category: sharing_the_road
  question: クラクションを「絶対に」使用してはいけないのはどのような時ですか？
  choices:
    A: 自転車が自分の車線に入ってきそうな時。
    B: 自分の車線に割り込もうとしている車を追い越す時。
    C: 視覚障害のある歩行者の近くにいる時。
    D: 他の車両が自車に衝突する危険がある時。
  answer: C
  explanation: マニュアルには、視覚障害のある歩行者の近くにいる時など、クラクションを使用してはいけない場面がいくつか記載されています。
- id: 263
  category: safe_driving_rules
  question: 車両が故障し、停止しなければならない場合、どこに停車させるべきですか？
  choices:
    A: 風から守るため、丘を越えたすぐの場所。
    B: 主要な交通流から外れるよう、カーブを曲がったすぐの場所。
    C: 非常点滅表示灯（ハザードランプ）を点けて中央車線に。
    D: 道路外で、他の道路利用者がはっきりと確認できる場所。
  answer: D
  explanation: 停車しなければならない場合は、車両を道路外に出し、他の道路利用者が自車をはっきりと確認できる場所に停車してください。丘を越えたすぐの場所やカーブの途中には停車しないでください。
- id: 264
  category: safe_driving_rules
  question: 前方に踏切がある場合、何秒以内に到達する距離であれば、他の車両を追い越してはいけませんか？
  choices:
    A: 5〜10秒。
    B: 10〜15秒。
    C: 20〜25秒。
    D: 30〜40秒。
  answer: C
  explanation: マニュアルによれば、前方20〜25秒以内の範囲に踏切がある場合は、追い越しをしてはいけません。
- id: 265
  category: safe_driving_rules
  question: 車両が故障した際、緊急事態を知らせる適切な方法は何ですか？
  choices:
    A: ハンドルに赤い布を縛り付ける。
    B: アンテナ、サイドミラー、またはドアハンドルに白い布を縛り付ける。
    C: 道路の真ん中に立ち、腕を振る。
    D: 助けが来るまでクラクションを鳴らし続ける。
  answer: B
  explanation: マニュアルによると、車両に取り付けられた白い布は故障車であることを示します。アンテナ、サイドミラー、またはドアハンドルに白い布を縛り付けるか、ボンネットを上げて緊急事態を知らせてください。
- id: 266
  category: safe_driving_rules
  question: 車両が故障していることを他のドライバーに知らせるために、緊急用フレア（発炎筒）はどこに置くべきですか？
  choices:
    A: 車両の後方50〜100フィート。
    B: 車両の後方100〜150フィート。
    C: 車両の後方200〜300フィート。
    D: 車両の前方300〜500フィート。
  answer: C
  explanation: マニュアルでは、他のドライバーが車線を変更する時間を確保できるよう、車両の後方約200〜300フィートの場所に緊急用フレアを置くよう定めています。
- id: 267
  category: safe_driving_rules
  question: 市街地において、右左折や車線変更を行う際、いつ合図を出すべきですか？
  choices:
    A: 50フィート手前、または1〜2秒前。
    B: 100フィート手前、または3〜5秒前。
    C: 200フィート手前、または3〜5秒前。
    D: 500フィート手前、または5〜7秒前。
  answer: B
  explanation: 市街地では、右左折や車線変更を行う100フィート手前、または3〜5秒前に合図を出さなければなりません。
- id: 268
  category: safe_driving_rules
  question: 時速40マイルを超える速度で走行中、右左折や車線変更を行う前の適切な合図の距離はどれくらいですか？
  choices:
    A: 50フィート。
    B: 100フィート。
    C: 150フィート。
    D: 200フィート。
  answer: D
  explanation: 時速40マイルを超える速度では、右左折や車線変更を行う200フィート手前、または3〜5秒前に合図を出すべきです。
- id: 269
  category: defensive_driving
  question: 交差点で曲がる予定があるものの、その直前に脇道がある場合、いつ合図を出すべきですか？
  choices:
    A: 交差点が見えたらすぐに。
    B: 脇道に到達する前に。
    C: 脇道を通り過ぎてから合図を出す。
    D: 脇道がある場合は合図を出す必要はない。
  answer: C
  explanation: 交差点で曲がる場合は、他のドライバーがあなたが脇道で曲がると勘違いして進路に割り込んでこないよう、脇道を通り過ぎてから合図を出すべきです。
- id: 270
  category: safe_driving_rules
  question: 他のドライバーが予想していない場所で停車または減速する場合、どのようにして他の道路利用者に警告できますか？
  choices:
    A: ハイビームを点灯させる。
    B: ブレーキペダルを3、4回軽く踏む。
    C: クラクションを3秒間鳴らす。
    D: 窓から手信号を出す。
  answer: B
  explanation: 他のドライバーが予想していない場所で停車または減速する場合は、ブレーキペダルを3、4回軽く踏んで、他の道路利用者に警告してください。
- id: 271
  category: license_system
  question: マニュアルによると、運転免許証を持つことは何とみなされますか？
  choices:
    A: 憲法上の権利
    B: 権利ではなく特権
    C: 全市民の義務
    D: 連邦政府の権利
  answer: B
  explanation: マニュアルには、運転免許証を持つことは権利ではなく特権であると明記されています。
- id: 272
  category: driver_responsibility
  question: あなたが運転免許証を持つ未成年者である場合、運転に伴う金銭的責任は誰が負いますか？
  choices:
    A: 未成年ドライバー本人のみ
    B: 州政府
    C: 保険会社のみ
    D: あなたとあなたの親または保護者
  answer: D
  explanation: 未成年者の場合、運転に伴う金銭的責任は、本人とその親または保護者が負うことになります。
- id: 273
  category: vehicle_information
  question: 大型車両を運転する際の制限（デメリット）は何ですか？
  choices:
    A: 他のドライバーから見えにくい。
    B: 安定性が低くなる可能性があり、車両周辺の視認性が低下する。
    C: 小型車両よりも加速がはるかに速い。
    D: 最小回転半径が小さい（小回りが利く）。
  answer: B
  explanation: マニュアルには、大型車両は安定性が低くなる可能性があり、車両周辺の視認性が低下すると記されています。
- id: 274
  category: defensive_driving
  question: 運転中の適切な意思決定は、何から始まりますか？
  choices:
    A: 素早い反応時間
    B: 適切な視覚的探索
    C: 制限速度を知っていること
    D: 新しい車両に乗っていること
  answer: B
  explanation: 意思決定のプロセスに備えるためには、車両の周囲を積極的に探索することが非常に重要です。適切な意思決定は、適切な視覚的探索から始まります。
- id: 275
  category: defensive_driving
  question: 運転のリスクを軽減するための行動を決定する際、その行動は一般的に、進路変更、意思伝達、または以下のどれに限定されますか？
  choices:
    A: 速度の変更
    B: 目的地の変更
    C: 車両から降りる
    D: ヘッドライトを消す
  answer: A
  explanation: 一般的に、行動は進路変更（左右への移動）、速度の変更（減速、停止、加速）、または意思伝達（合図や警音器の使用）に限定されます。
- id: 276
  category: sharing_the_road
  question: 道路沿いを歩いている歩行者を追い越そうとしている時に、対向車が近づいてきた場合、どうすべきですか？
  choices:
    A: 歩行者が脇に寄るようにクラクションを鳴らす。
    B: 素早く歩行者を追い越すために加速する。
    C: 減速し、対向車を先に通過させる。
    D: 対向車が停止しなければならないので、そのまま運転を続ける。
  answer: C
  explanation: 「知識テスト」のセクションでは、対向車が接近している状況で歩行者を追い越す場合は、減速して対向車を先に通過させるべきであると述べられています。
- id: 277
  category: safe_driving_rules
  question: 右左折や車線変更をした後、方向指示器（ウィンカー）が自動で消えない場合はどうすべきですか？
  choices:
    A: 次の右左折までつけたままにする。
    B: ブレーキを3回軽く踏んでリセットする。
    C: 他の道路利用者が混乱しないよう、手動で消す。
    D: ハザードランプを点灯させる。
  answer: C
  explanation: 誤った合図によって他の道路利用者が混乱しないよう、方向指示器が自動で消えない場合は、ドライバーが手動で消さなければなりません。
- id: 278
  category: safe_driving_rules
  question: 衝突を避けようとする際、主に3つの選択肢があります。それは何ですか？
  choices:
    A: ブレーキをかける、ハンドル操作をする、または加速する
    B: クラクションを鳴らす、ブレーキをかける、または急ハンドルを切る
    C: 加速する、クラクションを鳴らす、またはハンドル操作をする
    D: ブレーキをかける、衝撃に備えて身構える、または目を閉じる
  answer: A
  explanation: 衝突を避けるための選択肢には、ブレーキをかける、ハンドル操作をする、加速する、の3つがあります。
- id: 279
  category: vehicle_information
  question: 車両にアンチロック・ブレーキ・システム（ABS）が装備されており、急停止する必要がある場合はどうすべきですか？
  choices:
    A: 横滑りを避けるために、ブレーキを素早くポンピング（断続的に踏む）する。
    B: ブレーキペダルをできるだけ強く踏み込み、そのまま踏み続ける。
    C: ブレーキを軽くかけ、危険を避けるようにハンドルを切る。
    D: ブレーキがロックするまで踏み込み、その後離す。
  answer: B
  explanation: ABSを装備している場合、急停止が必要な時はブレーキペダルをできるだけ強く踏み込み、そのまま踏み続けてください。ブレーキペダルを緩めてはいけません。
- id: 280
  category: safe_driving_rules
  question: 急停止しなければならず、車両にアンチロック・ブレーキ・システム（ABS）が装備されていない場合、ブレーキがロックして車両が横滑りし始めたらどうすべきですか？
  choices:
    A: ブレーキペダルをできるだけ強く踏み続ける。
    B: ギアをニュートラルに入れ、パーキングブレーキを引く。
    C: ブレーキペダルを緩め、その後コントロールしながら踏み直す。
    D: 横滑りしている方向とは逆の方向にハンドルを急に切る。
  answer: C
  explanation: ABSがない場合、ブレーキがロックすると車両が横滑りし始めるのを感じます。その場合はブレーキペダルを緩め、その後コントロールしながら踏み直してください。
- id: 281
  category: defensive_driving
  question: 衝突を避けるために急ハンドルを切ることについて、正しいものはどれですか？
  choices:
    A: 通常、ハンドル操作よりも早く車両を停止させることができる
    B: 車両を進めたい方向とは逆の方向にハンドルを切るべきである
    C: ほとんどの場合、車両を停止させるよりも早くハンドル操作で回避することができる
    D: 体を支えるために、ハンドルから片手を離すべきである
  answer: C
  explanation: ほとんどの場合、車両を停止させるよりも早くハンドル操作で回避することが可能です。衝突を避けるための手段として、ハンドル操作を検討する必要があります。
- id: 282
  category: defensive_driving
  question: 衝突を避けるために加速することが最善となるのは、どのような状況ですか？
  choices:
    A: 急なカーブに速すぎるスピードで進入しているとき
    B: 他の車両が側面または後方から衝突しそうで、前方に十分なスペースがあるとき
    C: 歩行者が前方の横断歩道に突然飛び出してきたとき
    D: 前輪がバースト（破裂）したとき
  answer: B
  explanation: 衝突を避けるために加速することが最善、あるいは必要となる場合があります。これは、他の車両が側面や後方から衝突しそうな状況で、前方に危険を回避するためのスペースがある場合に起こり得ます。
- id: 283
  category: safe_driving_rules
  question: 車両がトラクション（駆動力）を失いスリップし始めたとき、どこを見るべきですか？
  choices:
    A: 避けようとしている障害物を直視する
    B: 対向車線を見る
    C: 足が正しい位置にあるか確認するためにペダルを見る
    D: 進みたい方向にある開けたスペースを視覚的に探す
  answer: D
  explanation: 車両がトラクションを失い始めたら、視覚的に開けたスペースを探してください。道路上で車両が進むことができる場所に注意を払い、避けようとしている障害物を注視（凝視）しないようにしなければなりません。
- id: 284
  category: vehicle_information
  question: スリップ中に前輪のトラクションが失われたことは、どうすれば分かりますか？
  choices:
    A: ハンドル操作をしていないのに車両が横に動く
    B: ハンドルを切っているのに車両が直進し続ける
    C: ハンドルが激しく震え始める
    D: 車両の後部が左右に振れる（フィッシュテール現象）
  answer: B
  explanation: トラクションの喪失を認識する方法：ハンドルを切っているにもかかわらず車両が直進し続ける場合、前輪のトラクションが失われています。
- id: 285
  category: defensive_driving
  question: 車両の後輪がトラクションを失った場合、どのようにハンドルを操作すべきですか？
  choices:
    A: ハンドルを進みたい方向とは逆の方向に回す
    B: ハンドルを完全に真っ直ぐに保ち、ブレーキを強く踏む
    C: ハンドルを進もうとする方向（進みたい方向）に回す
    D: バランスを取り戻すために対向車線の方へハンドルを切る
  answer: C
  explanation: 後輪のトラクションが失われた場合は、ハンドルを進もうとする方向（進みたい方向）に回し、車両が直進するまでハンドル操作とカウンターステアを続けてください。
- id: 286
  category: defensive_driving
  question: 車両が後方から追突されそうなとき、身を守るために何をすべきですか？
  choices:
    A: ハンドルの上に身を乗り出す
    B: 座席の背もたれに体を押しつけ、頭をヘッドレストにつける
    C: 車両が前方に転がるように、ブレーキペダルから足を離す
    D: すぐに車外に出られるよう、シートベルトを外す
  answer: B
  explanation: 車両が後方から追突されると、頭と体は後ろに放り出されます。座席の背もたれに体を押しつけ、頭をヘッドレストにつけ、ブレーキを踏む準備をしてください。
- id: 287
  category: defensive_driving
  question: 車両が前方から衝突されそうなとき、衝撃を和らげるために推奨される行動は何ですか？
  choices:
    A: 正面衝突を避けるため、かすめるような衝突になるよう車両の向きを変える
    B: 衝撃を突き抜けるために加速する
    C: 衝突が起こる前にエンジンを切る
    D: 顔の前に腕を出し、ハンドルから手を離す
  answer: A
  explanation: 車両が前方から衝突されそうなときは、正面衝突を避けて、かすめるような（斜めに当たるような）衝突にすることが重要です。つまり、衝突が避けられない場合は、ハンドルを切って角度を変えるように努めるべきです。
- id: 288
  category: vehicle_information
  question: 運転中にブレーキが効かなくなった場合、まず最初に試すべきことは何ですか？
  choices:
    A: ギアをリバース（後退）に入れる
    B: パーキングブレーキをできるだけ強く、素早く引く
    C: ブレーキペダルを数回素早く踏み込む（ポンピング）
    D: すぐにイグニッション（エンジン）を切る
  answer: C
  explanation: ブレーキが効かなくなった場合は、ブレーキペダルを数回素早く踏み込んでください。これにより、停止するのに十分なブレーキ圧が回復することがよくあります。
- id: 289
  category: safe_driving_rules
  question: タイヤがバースト（破裂）した際の正しい対応はどれですか？
  choices:
    A: 車両を止めるために、すぐにブレーキを強く踏む
    B: ハンドルをしっかりと握り、車両を直進させ、徐々に減速する
    C: 車両の勢いを制御するために、わずかに加速する
    D: バーストしたタイヤの方向にハンドルを急に切る
  answer: B
  explanation: タイヤがバーストしたときは、ハンドルをしっかりと握り、車両を直進させてください。アクセルペダルから足を離して徐々に速度を落とし、ブレーキは踏まないようにします。
- id: 290
  category: vehicle_information
  question: 走行中にエンジンが停止してしまった場合、どうすべきですか？
  choices:
    A: ニュートラルに入れ、一定の圧力でブレーキをかけ、路肩に寄せる
    B: 車両を止めるために、すぐにギアをパーク（P）に入れる
    C: ハンドルがロックされて回せなくなるので、ハンドルから手を離す
    D: ブレーキを素早く踏み込み、クラクションを鳴らす
  answer: A
  explanation: 走行中にエンジンが停止した場合は、ハンドルをしっかり握り、ギアをニュートラルに入れて回避路を探し、一定の圧力でブレーキをかけて減速してから、路肩に寄せて停車してください。
- id: 291
  category: vehicle_information
  question: アクセルペダルが踏み込まれた状態で戻らなくなった場合、どうすべきですか？
  choices:
    A: 運転中に手を伸ばして、手でペダルを引き上げようとする
    B: ギアをニュートラルに入れ、スムーズにハンドルを操作し、穏やかにブレーキをかけて道路外に停車する
    C: 走行車線にいる間に、すぐにイグニッションを切る
    D: 低速ギアに入れ、パーキングブレーキを強くかける
  answer: B
  explanation: アクセルが故障した場合は、ギアをニュートラルに入れ、回避経路を探し、スムーズにハンドルを操作し、穏やかにブレーキをかけて道路外に停車してください。
- id: 292
  category: defensive_driving
  question: 車輪が舗装路から外れて段差のある路面に落ちた場合、なぜ急ブレーキを避けるべきなのですか？
  choices:
    A: ブレーキパッドを損傷するため
    B: 車両がスリップし、ハンドル操作が困難になる可能性があるため
    C: タイヤがパンク（バースト）するため
    D: エンジンが停止（エンスト）するため
  answer: B
  explanation: 車輪が舗装路から外れたときは、急ブレーキをかけないでください。車両がスリップし、ハンドル操作が困難になる可能性があるからです。代わりに、穏やかにブレーキをかけてください。
- id: 293
  category: safe_driving_rules
  question: 段差から舗装路に戻ろうとする前に、減速すべき推奨速度はどれくらいですか？
  choices:
    A: 10 mph以下
    B: 15 mph以下
    C: 25 mph以下
    D: 35 mph以下
  answer: C
  explanation: 車輪が舗装路から外れた場合は、直進を維持し、25 mph以下まで減速してから道路に戻るようにしてください。
- id: 294
  category: vehicle_operation
  question: 段差から舗装路に戻る際、ハンドルをどれくらい回すべきですか？
  choices:
    A: 約4分の1回転
    B: 約2分の1回転
    C: 360度の全回転
    D: できるだけ急に
  answer: A
  explanation: 全方向の交通が途切れたら、ハンドルを約4分の1回転させて舗装路に戻ります。過度なハンドル操作（オーバーステア）はしないでください。
- id: 295
  category: defensive_driving
  question: 他の種類の事故と比較して、重大な負傷や死亡に至る可能性がはるかに高い事故はどれですか？
  choices:
    A: 追突事故
    B: 側面接触事故
    C: 横転事故
    D: 低速での軽い接触事故
  answer: C
  explanation: 横転事故は、他のほとんどの種類の事故よりも重大な負傷や死亡に至る可能性がはるかに高く、乗用車の乗員死亡事故の3件に1件を占めています。
- id: 296
  category: safe_driving_rules
  question: すべての横転事故のうち、横転した車両以外の車両が関与していない事故は何パーセントですか？
  choices:
    A: 20%未満
    B: 約40%
    C: ちょうど50%
    D: 80%以上
  answer: D
  explanation: 横転事故は単独事故であることが一般的です。すべての横転事故の80%以上は、横転した車両以外の車両が関与していません。
- id: 297
  category: vehicle_information
  question: SUV、バン、ピックアップトラックが乗用車よりも横転事故を起こしやすいのはなぜですか？
  choices:
    A: タイヤが小さいため
    B: 重心が高いため
    C: より高速で運転されるため
    D: アンチロック・ブレーキ・システム（ABS）が装備されていないため
  answer: B
  explanation: SUV、バン、ピックアップトラック、小型トラックは重心が高く、重心が上部に偏っているため、横転事故が起こりやすく、転倒する可能性が高くなります。
- id: 298
  category: driver_responsibility
  question: 横転事故における負傷や死亡のリスクを減らす最も効果的な方法は何ですか？
  choices:
    A: ハンドルをしっかりと握る
    B: シートベルトを着用する
    C: ダッシュボードの下に身を隠す
    D: ドアのロックを解除する
  answer: B
  explanation: 横転時の負傷や死亡のリスクを減らす最も効果的な方法は、シートベルトを着用することです。シートベルトを着用していないと、乗員が車外に放り出される可能性があります。
- id: 299
  category: vehicle_information
  question: 夜間の運転中、ロービーム（すれ違い用前照灯）では前方約何フィートまでをはっきりと見ることができますか？
  choices:
    A: 50〜100フィート
    B: 150〜200フィート
    C: 250〜300フィート
    D: 350〜400フィート
  answer: B
  explanation: ロービーム（すれ違い用前照灯）では、前方約150〜200フィートをはっきりと見ることができます。
- id: 300
  category: safe_driving_rules
  question: 前方350〜400フィートを見ることができるハイビーム（走行用前照灯）を使用している場合、夜間の安全な走行速度の上限はどれくらいですか？
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 75 mph
  answer: C
  explanation: ハイビーム（走行用前照灯）では、前方約350〜400フィートをはっきりと見ることができます。この距離内で停止できる速度は、約65 mphです。
- id: 301
  category: defensive_driving
  question: 夜間に不慣れな道路を走行する場合、車間距離をどのくらい長くすべきですか？
  choices:
    A: 少なくとも1秒以上追加する
    B: 少なくとも2秒以上追加する
    C: 少なくとも3秒以上追加する
    D: 少なくとも4秒以上追加する
  answer: B
  explanation: 夜間の運転条件では車間距離を少なくとも1秒以上、さらに夜間に不慣れな道路を走行する場合は少なくとも2秒以上追加する必要があります。
- id: 302
  category: safe_driving_rules
  question: 濃霧や大雨のために前方100フィート（約30メートル）先までしか見えない場合、安全に走行できる最高速度はどれくらいですか？
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: 雨、雪、砂塵、煙、または濃霧のために前方100フィート先までしか見えない場合、30 mphを超えて安全に運転することはできません。
- id: 303
  category: vehicle_operation
  question: 日中に霧、雪、または大雨の中を走行する際、視界を最も良くするためにどのライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: パーキングライトのみ
    C: ロービームとフォグランプ
    D: 非常点滅表示灯（ハザードランプ）
  answer: C
  explanation: 霧、雪、または大雨の中を走行する際は、日中であっても視界を確保するためにロービームとフォグランプを使用してください。
- id: 304
  category: sharing_the_road
  question: 運転中に太陽が真後ろにある場合、どのような危険に注意すべきですか？
  choices:
    A: エンジンがオーバーヒートする可能性がある
    B: 対向車のドライバーが、眩しさのためにこちらの方向指示器や車両を確認できない可能性がある
    C: ヘッドライトが自動的に消灯する
    D: 車両の制動距離が長くなる
  answer: B
  explanation: 太陽が後ろにある場合、対向車のドライバーが眩しさのために、あなたの車の方向指示器や車両自体を見ることができない可能性があることに注意してください。
- id: 305
  category: safe_driving_rules
  question: 通常の運転条件下で維持すべき最小の車間時間はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: B
  explanation: 最小3秒の車間時間を維持し、悪天候や交通状況に応じてさらに1秒以上追加してください。
- id: 306
  category: safe_driving_rules
  question: 走行中にタイヤが突然パンクした場合、どうすべきですか？
  choices:
    A: ブレーキペダルを数回素早く踏む（ポンピングブレーキ）
    B: 徐々に減速し、ブレーキは踏まない
    C: ブレーキペダルを力いっぱい踏む
    D: 道路の右側に急ハンドルを切る
  answer: B
  explanation: タイヤが突然パンクした場合は、徐々に速度を落とし、ブレーキは踏まないようにしてください。
- id: 307
  category: sharing_the_road
  question: 歩行者として、歩道がない場所ではどこを歩くべきですか？
  choices:
    A: 車の流れと同じ方向の、道路の右側
    B: 道路の中央
    C: 対向車と向き合う形の、道路の左側
    D: どちらの方向でも道路の路肩
  answer: C
  explanation: 歩道がない場合は、対向車と向き合うように道路の左側を歩く必要があります。
- id: 308
  category: signs_and_signals
  question: 道路を横断中に「歩行禁止（DON'T WALK）」の合図が点滅し始めた場合、歩行者はどうすべきですか？
  choices:
    A: 横断歩道の真ん中で止まり、次の信号を待つ
    B: 引き返して元の歩道に戻る
    C: できるだけ速く走って反対側へ渡る
    D: そのまま横断を完了する
  answer: D
  explanation: 横断中に「歩行禁止（DON'T WALK）」の合図が点滅し始めた場合は、そのまま横断を完了させることができます。
- id: 309
  category: sharing_the_road
  question: 歩行者が横断歩道以外の場所を横断している（不法横断/ジェイウォーク）場合、ドライバーの責任は何ですか？
  choices:
    A: クラクションを鳴らし、止まらずに進む
    B: 歩行者に道を譲り、停止する
    C: 歩行者を避けるように急ハンドルを切る
    D: 歩行者に優先権はないため、速度を維持する
  answer: B
  explanation: 常に歩行者に道を譲らなければなりません。たとえ歩行者が横断歩道にいない場合や、横断すべきでない場所を渡っている（不法横断）場合でも、停止して道を譲る必要があります。
- id: 310
  category: sharing_the_road
  question: 盲導犬を連れている、または白杖（白い杖）を持っている歩行者が道路を横断しているとき、ドライバーはどうしなければなりませんか？
  choices:
    A: 減速し、注意して進む
    B: 車両が近づいていることを知らせるためにクラクションを鳴らす
    C: 完全停止する
    D: 歩行者が標識のある横断歩道にいる場合のみ道を譲る
  answer: C
  explanation: 視覚障害のある方には常に道を譲らなければなりません。盲導犬を連れている、または白杖を持っている歩行者が道路を横断しているときは、必ず完全停止してください。
- id: 311
  category: sharing_the_road
  question: 多車線道路で、前方に停車している車両に後ろから近づく際、どうすべきですか？
  choices:
    A: 左側から素早く追い越す。
    B: 右側から素早く追い越す。
    C: クラクションを鳴らして追い越す。
    D: 速度を落とし、車両の前を横断している歩行者がいないことを確認するまで追い越さない。
  answer: D
  explanation: 停車中の車両に後ろから近づく際は、速度を落とし、その車両の前を横断している歩行者がいないことを確認するまで追い越してはいけません。これは多車線道路であっても同様です。
- id: 312
  category: sharing_the_road
  question: 道路を走行する際、自転車利用者はどのように分類されますか？
  choices:
    A: 歩行者として。
    B: 自動車と同じ交通規則に従わなければならない車両として。
    C: 特定の交通規則がないレクリエーション用具として。
    D: すべての車に道を譲らなければならない低速の障害物として。
  answer: B
  explanation: 道路を走行する際、自転車は車両とみなされます。自転車利用者は、自動車と同じ交通規則に従うことが求められます。
- id: 313
  category: sharing_the_road
  question: 自転車利用者は通常、車道のどちら側を走行することが義務付けられていますか？
  choices:
    A: 左側。
    B: 右側。
    C: 中央車線。
    D: 好きな側。
  answer: B
  explanation: 自転車利用者として、車道の右側を走行することが義務付けられています。
- id: 314
  category: sharing_the_road
  question: 自転車は1つの車線内で並走（2台横に並んで走行）することが許可されていますか？
  choices:
    A: いいえ、常に一列で走行しなければなりません。
    B: はい、1つの車線内で2台並んで走行することが許可されています。
    C: はい、ただし週末に限ります。
    D: いいえ、指定された自転車専用レーンにいる場合を除きます。
  answer: B
  explanation: 自転車は1つの車線内で2台並んで走行することが許可されています。これにより車両密度が高まり、自動車がより効率的に追い越せるようになります。
- id: 315
  category: sharing_the_road
  question: 「デッド・レッド法（Dead Red Law）」に基づき、信号機が自転車に反応しない場合、自転車利用者はどうすることができますか？
  choices:
    A: 歩道に乗り上げ、歩行者用横断歩道を渡る。
    B: 信号を反応させるために車が来るまで待つ。
    C: 合理的な時間待機した後、交差する交通を妨げないことを確認して交差点を渡る。
    D: 右折してUターンし、信号を避ける。
  answer: C
  explanation: デッド・レッド法に基づき、交差点に到着しても信号機が自転車に反応しない場合、自身で合理的と判断する時間待機した後であれば、交差点を渡ることができます。
- id: 316
  category: sharing_the_road
  question: 夕暮れ時に走行する自転車利用者には、どのような灯火装置が必要ですか？
  choices:
    A: 尾灯（テールライト）のみ。
    B: 前照灯（ヘッドライト）が必要であり、尾灯の使用が強く推奨される。
    C: 前照灯と点滅式の尾灯の両方が必要。
    D: 反射材付きの衣服を着用していれば、灯火装置は不要。
  answer: B
  explanation: 夕暮れ時の前照灯（ヘッドライト）の使用は義務付けられていますが、視認性をさらに高めるために尾灯（テールライト）の使用も強く推奨されます。
- id: 317
  category: sharing_the_road
  question: 運転中に右折しようとしている際、前方に自転車がいる場合、どうすべきですか？
  choices:
    A: 速度を上げ、曲がる直前に自転車を追い越す。
    B: クラクションを鳴らして、自転車に道を譲らせる。
    C: 速度を落とし、自転車が交差点を通過してから右折する。
    D: 右折しながら、同じ車線内で自転車の横を無理に通り抜ける。
  answer: C
  explanation: 右折しようとする際、曲がる直前に自転車を追い越してはいけません。衝突を避けるため、速度を落とし、自転車が交差点を通過してから右折するようにしてください。
- id: 318
  category: sharing_the_road
  question: 衝突の危険がある場合を除き、自転車利用者の近くでクラクションを鳴らすのを避けるべきなのはなぜですか？
  choices:
    A: 自転車利用者にクラクションを鳴らすのは違法だから。
    B: 自転車利用者を驚かせ、自車の進路にハンドルを切らせて事故を引き起こす可能性があるから。
    C: 自転車利用者は風の音でクラクションが聞こえないから。
    D: 自転車利用者が急停車する原因になるから。
  answer: B
  explanation: 衝突の危険がある場合を除き、自転車利用者の近くでクラクションを鳴らさないでください。自分の存在を知らせるためにクラクションを鳴らすと、相手を驚かせ、自車の進路にハンドルを切らせて事故を引き起こす可能性があります。
- id: 319
  category: sharing_the_road
  question: 濡れた路面、砂、または砂利で覆われた道路は、自動車と比較して自転車にどのような影響を与えますか？
  choices:
    A: これらの状況は自動車よりも自転車に大きな影響を与え、ブレーキをかけたり急旋回したりする能力を低下させる。
    B: 自転車は自動車よりもこれらの状況にうまく対応できる。
    C: これらの状況は自転車と自動車に等しく影響を与える。
    D: 自転車は砂や砂利の影響を受けない。
  answer: A
  explanation: 自動車と同様に、自転車もこのような状況下では素早くブレーキをかけたり、急旋回したりすることができません。これらの状況は、自動車よりも自転車にずっと大きな影響を与えます。
- id: 320
  category: sharing_the_road
  question: 「ダッチ・リーチ（Dutch Reach）」法は何のために行われますか？
  choices:
    A: 自転車で左折の合図を出すため。
    B: 右手を使ってドアを開けることで、安全に車から降りるため。
    C: 狭い道路で自転車を安全に追い越すため。
    D: バックする際に死角を確認するため。
  answer: B
  explanation: 「ダッチ・リーチ」法とは、右手でドアのハンドルを引いて開ける方法です。これにより自然と体が回転し、後方から近づいてくる交通状況が確認しやすくなるため、自転車利用者との衝突を避けるのに役立ちます。
- id: 321
  category: signs_and_signals
  question: 路面の「シャロウ（sharrows）」は何を示していますか？
  choices:
    A: 自転車専用に指定された車線
    B: 自転車に推奨される交通量の少ないルート
    C: 自転車が他の交通の流れに最もスムーズに乗るために、車線内のどこを走るべきかの推奨位置
    D: 歩行者専用の横断ゾーン
  answer: C
  explanation: シャロウ（Sharrows）は、自転車が他の交通の流れに最もスムーズに乗るために、車線内のどの位置を走行すべきかを推奨する路面標示です。
- id: 322
  category: sharing_the_road
  question: 自転車の運転者が、右左折や停止の際に手信号を出せないことがあるのはなぜですか？
  choices:
    A: 自転車には手信号が法的に義務付けられていないため
    B: 道路状況や交通状況により、両手でハンドルを握り続ける必要がある場合があるため
    C: 自転車には自動方向指示器が装備されているため
    D: 自転車は指定された自転車レーンを走行している時だけ合図すればよいため
  answer: B
  explanation: 道路状況や交通状況によっては、自転車の運転者が両手でハンドルを保持する必要があり、手信号を出せない場合があることを念頭に置いておいてください。
- id: 323
  category: sharing_the_road
  question: オートバイと車線に関して、次のうち正しいものはどれですか？
  choices:
    A: オートバイには車線の半分を使用する権利しかない
    B: 十分なスペースがあれば、同じ車線内でオートバイを追い越してもよい
    C: 2台のオートバイが1つの車線を共有して走行してもよい
    D: オートバイは路肩を走行しなければならない
  answer: C
  explanation: オートバイ、スクーター、モペッドの運転者は車線全体を使用する権利があり、2台のオートバイ、スクーター、モペッドが1つの車線を共有して走行することも認められています。同じ車線内でこれらを追い越してはいけません。
- id: 324
  category: vehicle_information
  question: マニュアルによると、原動機付自転車（モペッド）の最高設計速度は時速何マイル以下とされていますか？
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: 原動機付自転車（モペッド）は、最高設計速度が時速30マイル（30 mph）を超えない能力を持つものとされています。
- id: 325
  category: defensive_driving
  question: オートバイ、スクーター、またはモペッドと他の自動車が関与する衝突事故の約40％は、何によって引き起こされますか？
  choices:
    A: オートバイが他の車両に車間距離を詰めすぎて走行すること
    B: 他の車両がオートバイの直前で左折すること
    C: オートバイが右側から追い越しをすること
    D: 他の車両が急停車すること
  answer: B
  explanation: オートバイ、スクーター、モペッドと他の自動車が関与する衝突事故の約40％は、他の車両がオートバイ、スクーター、モペッドの直前で左折することによって引き起こされています。
- id: 326
  category: safe_driving_rules
  question: 方向指示器（ウィンカー）を点滅させて近づいてくるオートバイを見かけた場合、どうすべきですか？
  choices:
    A: 曲がるものと判断して、その進路に進入する
    B: クラクションを鳴らして、こちらが気づいていることを運転者に知らせる
    C: 実際に曲がり始めるのを確認するまで、その前方に飛び出さない
    D: オートバイが到着する前に交差点を通過できるよう加速する
  answer: C
  explanation: オートバイ、スクーター、モペッドの方向指示器は自動的に消えない場合があるため、点滅しているからといってすぐに曲がると決めつけないでください。実際に曲がり始めるのを確認するまでは、その前方に進み出てはいけません。
- id: 327
  category: safe_driving_rules
  question: 通常の条件下でオートバイ、スクーター、またはモペッドの後方を走行する場合、推奨される車間距離はどれくらいですか？
  choices:
    A: 1〜2秒
    B: 3〜4秒
    C: 5〜6秒
    D: 7〜8秒
  answer: B
  explanation: オートバイ、スクーター、モペッドの後方を走行する際は、3〜4秒の車間距離を保ってください。路面が濡れている場合はさらに距離を空けてください。
- id: 328
  category: sharing_the_road
  question: オートバイ、スクーター、またはモペッドに接近する際、常にヘッドライトをロービームにしなければならないのはなぜですか？
  choices:
    A: ハイビームはオートバイのバッテリーを消耗させるため
    B: 二輪車は脆弱であるため、ハイビームによる眩惑が四輪車の運転者よりもはるかに危険になり得るため
    C: 追い越そうとしていることを知らせる合図になるため
    D: ハイビームがオートバイのエンジンを停止させる原因になるため
  answer: B
  explanation: オートバイ、スクーター、モペッドに接近する際は、常にヘッドライトを減光（ロービームに）してください。二輪車は体が露出しており脆弱であるため、ハイビームによる眩惑は、四輪車の運転者に対するよりもはるかに危険な状況を招く可能性があります。
- id: 329
  category: safe_driving_rules
  question: サイレンが聞こえたり、赤色灯を点滅させた緊急車両が近づいてきたりした場合は、どうしなければなりませんか？
  choices:
    A: 加速して速やかに交差点を通過する
    B: 現在の車線ですぐに停止する
    C: 右側に寄り、縁石や路肩に車を止めて停車する
    D: 左車線に移動して減速する
  answer: C
  explanation: サイレンが聞こえたり、点滅灯をつけた車両が接近してきたりした場合は、右側に寄せて縁石や路肩に停車してください。
- id: 330
  category: safe_driving_rules
  question: 赤色灯を点滅させた緊急車両が通り過ぎた後、その車両からどの程度距離を保たなければなりませんか？
  choices:
    A: 少なくとも100フィート
    B: 少なくとも200フィート
    C: 少なくとも300フィート
    D: 少なくとも500フィート
  answer: D
  explanation: 緊急車両が通過した後、後方に他の車両がいないか注意深く確認し、安全であれば道路に戻ります。その際、緊急車両からは少なくとも500フィートの距離を保たなければなりません。
- id: 331
  category: driver_responsibility
  question: 夜間に警察官に車を止められた際、車内を警察官に見えやすくするために何をすべきですか？
  choices:
    A: ハイビームを点灯させる
    B: 車内灯（ルームランプ）を点灯させる
    C: 窓から懐中電灯を外に向ける
    D: 直ちに車から降りる
  answer: B
  explanation: ハザードランプを点灯させ、夜間の場合は車内灯を点灯させることで、車内の状況に問題がないことを警察官が確認しやすくなります。
- id: 332
  category: driver_responsibility
  question: 警察官に車を止められた際、書類の提示はどのように行うべきですか？
  choices:
    A: 警察官が窓に来る前に手に持っておく
    B: 警察官の時間を節約するために素早く取り出す
    C: 書類がどこにあるかを警察官に伝え、片手をハンドルに置いたままゆっくりと取り出す
    D: 警察官が確認できるように助手席に放り投げる
  answer: C
  explanation: 警察官から書類の提示を求められた場合は、書類の場所を伝え、片手をハンドルに置いたまま、ゆっくりと手を伸ばして取り出してください。
- id: 333
  category: safe_driving_rules
  question: ムーブ・オーバー法（Move-Over Law）に基づき、点滅灯をつけた停車中の緊急車両に近づく際、何をしなければなりませんか？
  choices:
    A: 車を停止させ、指示を待つ
    B: クラクションを鳴らして緊急作業員に知らせる
    C: 安全であれば隣接する車線を空けるか、状況に応じた安全な速度まで減速する
    D: 速度を維持したままハザードランプを点灯させる
  answer: C
  explanation: 州法では、点滅灯をつけた停車中の緊急車両に近づく運転者は、安全かつ可能な場合は隣接する車線を空けるか、道路、天候、交通状況に応じた安全な速度まで減速することが義務付けられています。
- id: 334
  category: sharing_the_road
  question: オートバイ、スクーター、またはモペッドが自車を追い越す際、どうすべきですか？
  choices:
    A: 割り込まれないように加速する
    B: 車線内の位置と速度を維持する
    C: 路肩に移動する
    D: 早く追い越させるために急ブレーキをかける
  answer: B
  explanation: オートバイ、スクーター、またはモペッドが自車を追い越す際は、車線内の位置と速度を維持してください。相手が追い越しを完了できるようにします。
- id: 335
  category: safe_driving_rules
  question: 同じ方向に走行中、点滅灯をつけた停車中の緊急車両に近づく際、運転者は何をしなければなりませんか？
  choices:
    A: 直ちに停止し、指示を待つ
    B: 安全であれば隣接する車線を空けるか、安全な速度まで減速する
    C: クラクションを鳴らして緊急作業員に知らせ、速度を維持する
    D: 緊急車両を素早く追い越すために加速する
  answer: B
  explanation: 州法では、点滅灯をつけた停車中の緊急車両に近づく運転者は、安全かつ可能な場合は隣接する車線を空けるか、道路、天候、交通状況に応じた安全な速度まで減速することが義務付けられています。
- id: 336
  category: sharing_the_road
  question: 乗用車と商用車が関与する死亡事故において、警察の報告によると、乗用車の運転者が事故の原因に関与している割合は何パーセントですか？
  choices:
    A: 30%未満
    B: ちょうど50%
    C: 70%超
    D: 100%
  answer: C
  explanation: マニュアルによると、乗用車と商用車が関与するすべての死亡事故の70%以上において、警察は乗用車の運転者が事故の原因に関与していたと報告しています。
- id: 337
  category: sharing_the_road
  question: 大型トラックの側面の死角を走行しているかどうかは、どうすれば分かりますか？
  choices:
    A: バックミラーにトラックのヘッドライトが見えない
    B: トラックのサイドミラーにトラックの運転手の顔が見えない
    C: トラックの方向指示器が点滅している
    D: トラックの後部バンパーから50フィート（約15メートル）以内にいる
  answer: B
  explanation: マニュアルの「サイド・ノーゾーン（Side No-Zones）」に関する項目には、「サイドミラーに運転手の顔が見えない場合、相手からもあなたが見えていない」と記されています。
- id: 338
  category: safe_driving_rules
  question: 大型車両を追い越した後、その車両の前方に安全に戻れるのはいつですか？
  choices:
    A: 自車の後部バンパーがトラックの前部バンパーを通過してすぐ
    B: バックミラーにその車両の前面全体が見えるようになったとき
    C: トラックの運転手がヘッドライトを点滅させたとき
    D: 5秒間速度を維持した後
  answer: B
  explanation: 大型車両を追い越す際は、バックミラーでその車両の前面全体を確認してから、前方に割り込み、速度を維持するようにしてください。
- id: 339
  category: sharing_the_road
  question: 大型車両の直後にある巨大な死角は、最大でどのくらいの距離まで及びますか？
  choices:
    A: 最大50フィート（約15メートル）
    B: 最大100フィート（約30メートル）
    C: 最大150フィート（約45メートル）
    D: 最大200フィート（約60メートル）
  answer: D
  explanation: 乗用車とは異なり、大型車両には直後に最大200フィート（約60メートル）まで広がる巨大な死角があります。
- id: 340
  category: sharing_the_road
  question: 大型トラックやバスが右折する前に、なぜ左側に大きく膨らむことがあるのですか？
  choices:
    A: 縁石の角やその他の障害物を安全に避けるため
    B: 乗用車が右側から追い越せるようにするため
    C: 右折を完了するのに十分な速度を出すため
    D: 右側の死角を確認するため
  answer: A
  explanation: トラックやバスが右折する必要があるとき、縁石の角やその他の障害物を安全に避けて右折するために、左側に大きく膨らんでから曲がることがあります。
- id: 341
  category: defensive_driving
  question: 対向車線から来るトラックとすれ違う際、なぜできるだけ道路の右端に寄って走行すべきなのですか？
  choices:
    A: トラックがUターンするためのスペースを作るため。
    B: 車両同士を遠ざけようとする風圧（乱気流）の影響を避けるため。
    C: トラックの運転手があなたのナンバープレートを確認できるようにするため。
    D: 路肩に寄せて停車する準備をするため。
  answer: B
  explanation: 側面衝突を避け、2台の車両の間で発生し車両を押し離そうとする風圧（乱気流）を軽減するために、できるだけ道路の右端に寄って走行する必要があります。
- id: 342
  category: signs_and_signals
  question: 多くの交差点にある停止線の目的は何ですか？
  choices:
    A: 歩行者が横断を許可されている場所を示すため。
    B: 大型車両が右左折するためのスペースを確保するために、車両の停止位置を後方に下げるため。
    C: スクールゾーンの始まりを示すため。
    D: 制限速度が変化する場所を示すため。
  answer: B
  explanation: 停止線は、交差点で車両を後方に停止させることで、大型車両が曲がるための十分なスペースを確保する役割があります。常に停止線の手前で停止してください。
- id: 343
  category: safe_driving_rules
  question: 長い下り坂にある緊急避難所（ランナウェイ・ランプ）の目的は何ですか？
  choices:
    A: 低速車両が路肩に寄せて、後続車を先に通過させるため。
    B: 制御不能になった車両や、ブレーキの故障で停止できなくなった大型車両のため。
    C: 緊急車両が駐車して交通監視を行うため。
    D: 運転手が積荷やタイヤを安全に点検するため。
  answer: B
  explanation: これらの避難用スロープは、制御不能になった車両やブレーキ故障で停止できなくなった大型車両のみが使用するためのものです。これらのエリアに停車したり駐車したりしてはいけません。
- id: 344
  category: safe_driving_rules
  question: 路面電車やライトレールに乗車する歩行者のために設けられた安全地帯を通過する際、安全が確認できた場合の最高速度は何マイルですか？
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: 安全が確認され次第、時速10マイル（10 mph）以下の速度で安全地帯を通過することができます。
- id: 345
  category: safe_driving_rules
  question: 路面電車やライトレールの左側を追い越すことが許可されるのはどのような時ですか？
  choices:
    A: 路面電車が制限速度よりも遅く走行している時はいつでも。
    B: 一方通行の道路にいる場合、または交通整理員に指示された場合のみ。
    C: 路面電車が乗客を乗せるために停車している時はいつでも。
    D: 路面電車の左側を追い越すことは決して許されない。
  answer: B
  explanation: 一方通行の道路である場合を除き、路面電車やライトレールの左側を追い越してはいけません。線路が道路の右側に寄りすぎていて右側から追い越せない場合や、交通整理員に指示された場合は、左側から通過してください。
- id: 346
  category: signs_and_signals
  question: 車両の後部に表示されている、蛍光または反射材のオレンジ色と赤色の三角形は何を示していますか？
  choices:
    A: その車両が危険物を運搬していること。
    B: その車両が時速25マイル（25 mph）未満で走行していること。
    C: その車両が緊急車両であること。
    D: その車両が大きく右折しようとしていること。
  answer: B
  explanation: 動物が引く車両（馬車など）、農機具、または建設機械の後部に表示される蛍光または反射材のオレンジ色と赤色の三角形は、その車両が時速25マイル（25
    mph）未満で走行していることを意味します。
- id: 347
  category: sharing_the_road
  question: 軽車両（馬車など）の通常の速度範囲はどれくらいですか？
  choices:
    A: 時速5〜8マイル（5 to 8 mph）
    B: 時速10〜15マイル（10 to 15 mph）
    C: 時速15〜20マイル（15 to 20 mph）
    D: 時速20〜25マイル（20 to 25 mph）
  answer: A
  explanation: 軽車両（馬車など）の通常速度は、時速5マイルから8マイルの間です。
- id: 348
  category: sharing_the_road
  question: 軽車両（馬車など）や乗馬中の人の横を通過する際、クラクションを鳴らしたりエンジンを空吹かししたりするのを避けるべきなのはなぜですか？
  choices:
    A: 田舎の地域でクラクションを使用することは違法であるため。
    B: 動物を驚かせ、事故を引き起こす可能性があるため。
    C: 動物が完全に動きを止めてしまうため。
    D: 騒音規制法に抵触するため。
  answer: B
  explanation: 注意して通過し、クラクションを鳴らしたりエンジンを空吹かししたりしないでください。馬が驚いて事故につながる恐れがあります。
- id: 349
  category: sharing_the_road
  question: 片側一車線の対面通行の道路で低速車両を運転しており、後続車を著しく減速させている場合、どうすべきですか？
  choices:
    A: 交通の流れに合わせるために加速する。
    B: 安全な時に道路の脇に寄り、後続車を先に通過させる。
    C: ハザードランプを点灯させ、車線の中央にとどまる。
    D: 後続車に路肩から追い越すよう手で合図する。
  answer: B
  explanation: 低速車両を運転しており、後続の車両が減速を強いられるほどゆっくり走らなければならない場合は、安全な時に道路の脇に寄り、後続車を先に通過させてください。
- id: 350
  category: sharing_the_road
  question: トラックやバスが右折しようとしており、あなたも右折しようとしている場合、どうすべきですか？
  choices:
    A: トラックやバスが曲がる前に、素早く右折する。
    B: トラックやバスと縁石の間に割り込む。
    C: トラックやバスが曲がり終えるまで待ってから右折する。
    D: クラクションを鳴らして、自分の存在を運転手に知らせる。
  answer: C
  explanation: トラックやバスが右折しようとしており、あなたも右折しようとしている場合は、そのトラックやバスが曲がり終えるまで待ってから右折しなければなりません。
- id: 351
  category: sharing_the_road
  question: 歩行者が横断歩道のない場所を横断している（乱横断/jaywalking）場合、どうすべきですか？
  choices:
    A: 歩行者のために停止しなければなりません。
    B: 停止する必要はありません。
    C: クラクションを鳴らし、速度を維持すべきです。
    D: 歩行者を避けるために対向車線にはみ出します。
  answer: A
  explanation: 歩行者が横断歩道のない場所を横断しており（乱横断）、それが違法であったとしても、運転者は歩行者のために停止しなければなりません。
- id: 352
  category: sharing_the_road
  question: 二輪車（モーターサイクル）の運転者には、どのような権利がありますか？
  choices:
    A: 他の車両と同一の車線を共有する権利。
    B: 追い越しの際に路肩を使用する権利。
    C: 車線全体を使用する権利。
    D: 停車中の車両の車線間を走行する権利。
  answer: C
  explanation: 二輪車の運転者は、車線全体を使用する権利を持っています。
- id: 353
  category: safe_driving_rules
  question: 砂利道や土の道を走行する場合、舗装路と比較してどのように運転を調整すべきですか？
  choices:
    A: トラクションを維持するために速度を上げます。
    B: 速度を落とし、車間距離を長くします。
    C: 道路をよく見るために車間距離を短くします。
    D: スリップを防ぐためにブレーキを連続的に踏みます（ポンピングブレーキ）。
  answer: B
  explanation: 砂利道や土の道を走行する際は、トラクション（摩擦力）が低下し、停止するまでに非常に長い距離が必要になるため、速度を落とし、車間距離を長くしなければなりません。
- id: 354
  category: safe_driving_rules
  question: 乾燥期、砂利道は非常に埃っぽくなり、視界が悪くなることがあります。このような状況ではどのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: 駐停車灯のみ
    D: フォグランプのみ
  answer: B
  explanation: 砂利道で埃が舞っている状況では、自車を他者から見えやすくするためにロービームを使用し、速度を落として車間距離を長くすることが推奨されます。
- id: 355
  category: defensive_driving
  question: 格子状の床版（グレーチング）を持つ橋や鋼橋を走行する際は、どうすべきですか？
  choices:
    A: 橋を早く渡りきるために素早く加速します。
    B: ハンドルを握る力を緩めます。
    C: ハンドルをしっかりと握り、車間距離を長くします。
    D: 最適なトラクションを得るために頻繁に車線変更を行います。
  answer: C
  explanation: 格子状の床版や鋼橋ではトラクションが低下するため、ハンドルをしっかりと握り、車間距離を長くする必要があります。
- id: 356
  category: safe_driving_rules
  question: 地方の道路にある多くの鉄道踏切は、警告標識と白いX字型の標識（クロッシング標識）のみで示されています。これらに近づく際はどうすべきですか？
  choices:
    A: 列車が見えない限り速度を維持します。
    B: 減速し、左右を確認し、停止できる準備をします。
    C: 線路を渡る前にクラクションを鳴らします。
    D: 素早く線路を通過するために加速します。
  answer: B
  explanation: 地方の道路にある多くの鉄道踏切には、通常、信号機や遮断機がありません。そのため、常に減速し、左右を確認し、列車が来た場合に備えて停止できる準備をしてから渡る必要があります。
- id: 357
  category: safe_driving_rules
  question: 対向車が近づいてきたとき、どのくらいの距離でハイビームをロービームに切り替える（減光する）べきですか？
  choices:
    A: 約1ブロック以内の距離。
    B: 100フィート以内。
    C: 500フィート以内。
    D: 相手のドライバーがライトを点滅させたときのみ。
  answer: A
  explanation: 対向車と約1ブロック以内の距離になったら、ハイビームをロービームに切り替える必要があります。
- id: 358
  category: defensive_driving
  question: 対向車がハイビームをロービームに切り替えない場合、眩惑されないようにどこを見るべきですか？
  choices:
    A: 対向車のヘッドライトを直接見ます。
    B: 道路の左側を見ます。
    C: 道路の右側を見ます。
    D: バックミラーを見ます。
  answer: C
  explanation: 相手のドライバーがライトを減光しない場合は、ヘッドライトで目がくらまないように、道路の右側を見るようにしてください。
- id: 359
  category: safe_driving_rules
  question: 次の状況のうち、ハイビームではなくロービームを使用すべきなのはどれですか？
  choices:
    A: 車のいない地方の幹線道路を走行しているとき。
    B: 他の車両の後方を走行しているとき、または交通量が多いとき。
    C: 対向車がいないとき。
    D: 道路の先を2倍遠くまで見たいとき。
  answer: B
  explanation: 他の車両の後方を走行しているとき、交通量が多いとき、霧の中、または激しい雪や雨のときはロービームを使用してください。ハイビームの光は反射して眩しさを引き起こします。
- id: 360
  category: defensive_driving
  question: ほとんどの乗用車の底部に達し、制御不能やエンストを引き起こす可能性のある水の深さはどれくらいですか？
  choices:
    A: 2インチ
    B: 6インチ
    C: 12インチ
    D: 2フィート
  answer: B
  explanation: 6インチ（約15センチ）の深さの水で、ほとんどの乗用車の底部に達し、制御不能やエンストを引き起こす可能性があることを覚えておいてください。
- id: 361
  category: defensive_driving
  question: ほとんどの車両を押し流してしまう可能性のある激流の深さはどれくらいですか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 2フィート
  answer: D
  explanation: 2フィート（約60センチ）の激流は、ほとんどの車両を押し流す可能性があります。
- id: 362
  category: signs_and_signals
  question: 高速道路の工事区域にあるすべての仮設標識は何色ですか？
  choices:
    A: 黄色地に黒の文字
    B: オレンジ色の背景に黒の文字または記号
    C: 白地に赤の文字
    D: 緑地に白の文字
  answer: B
  explanation: 工事区域内のすべての仮設標識は、オレンジ色の背景に黒の文字または記号で構成されており、運転者に指示を与えます。
- id: 363
  category: safe_driving_rules
  question: 車線変更が必要な工事区域に近づく際、いつ適切な車線に合流すべきですか？
  choices:
    A: 工事区域が近づいているという最初の通知があったら、できるだけ早く合流する。
    B: 車線が閉鎖される直前に合流する。
    C: 最初のオレンジ色の警告標識を通過した後に合流する。
    D: 前方の車両が合流したときはいつでも合流する。
  answer: A
  explanation: できるだけ早く合流してください。工事区域が近づいているという最初の通知があった時点で適切な車線に移動することで、交通の流れと規定速度を維持する助けになります。
- id: 364
  category: safe_driving_rules
  question: 工事区域が近づいていることに最初に気づいたとき、何をすべきですか？
  choices:
    A: その区域を素早く通過するために加速する
    B: 交通の流れを維持するために適切な車線に移動する
    C: 停止して、先導車（パイロットカー）が案内してくれるのを待つ
    D: ヘッドライトをハイビームにする
  answer: B
  explanation: マニュアルには、工事区域が近づいていることに最初に気づいた時点で適切な車線に移動し、交通の流れと規定速度を維持するように記載されています。
- id: 365
  category: safe_driving_rules
  question: 移動式の工事区域を通過する際、運転をどのように調整すべきですか？
  choices:
    A: 作業員を追い越したらすぐに通常の速度に戻る
    B: 作業員に自分の存在を知らせるためにクラクションを鳴らす
    C: 「End Road Work（道路工事終了）」という標識を見るまで、掲示されている標識に従う
    D: 移動式工事区域が通り過ぎるまで路肩に停車する
  answer: C
  explanation: マニュアルによると、移動式の工事区域では、作業員がすぐに見えなくても現場にいる可能性があるため、「End Road Work（道路工事終了）」という標識を見るまで、掲示されている標識に従う必要があります。
- id: 366
  category: defensive_driving
  question: 動物が突然車両の前に飛び出し、衝突が避けられない場合、最も安全な選択肢は何ですか？
  choices:
    A: 対向車線にハンドルを切る
    B: 道路外にハンドルを切る
    C: 車両の制御を維持しながら動物に衝突する
    D: ブレーキをロックさせて即座に停止する
  answer: C
  explanation: マニュアルには、衝突が避けられない場合は動物を避けるために急ハンドルを切らないようにと記載されています。車両を制御し、道路上にとどまることに集中しながら動物に衝突することが、最も安全な選択肢となる場合があります。
- id: 367
  category: defensive_driving
  question: 動物が最も活発になり、ドライバーが特に注意を払う必要があるのは何月ですか？
  choices:
    A: 1月から3月
    B: 4月から6月
    C: 7月から9月
    D: 10月から12月
  answer: D
  explanation: マニュアルでは、夜明けや夕暮れ時、および動物が最も活発になる10月から12月の間に運転する際は注意するようアドバイスしています。
- id: 368
  category: defensive_driving
  question: 犬が道路に飛び出してきて、あなたの車を追いかけ始めたらどうすべきですか？
  choices:
    A: 車両を完全に停止させる
    B: 犬を怖がらせるために急ハンドルを切る
    C: 犬が近づくまで速度を落とし、その後加速して引き離す
    D: クラクションを鳴らし続ける
  answer: C
  explanation: マニュアルによると、車両を追いかける犬は直線的に近づく傾向があります。犬が車両に近づくまで速度を落とし、犬が近づいてきたら加速して引き離すようにしてください。
- id: 369
  category: defensive_driving
  question: 道路上のシカとの衝突を避ける時間があると思われる場合、なぜヘッドライトを点滅させることがあるのですか？
  choices:
    A: シカに道をどくよう合図するため
    B: シカはヘッドライトを凝視する傾向があり、点滅させることで動物がその場に立ちすくむ可能性があるため
    C: シカの目をくらませて、こちらに向かって走ってこれないようにするため
    D: 対向車に停止するよう警告するため
  answer: B
  explanation: マニュアルには、シカはヘッドライトを凝視する傾向があるため、ライトを点滅させることで動物が道路上で立ちすくみ、衝突を回避できる可能性があると記されています。
- id: 370
  category: driver_testing
  question: 運転免許の知識試験（学科試験）の最低合格点は何点ですか？
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: マニュアルによると、知識試験に合格するには80%以上のスコアを獲得する必要があります。
- id: 371
  category: driver_testing
  question: 知識試験に4回不合格となった場合、再度手続きを開始するまでどのくらいの期間待機しなければなりませんか？
  choices:
    A: 30日
    B: 3ヶ月
    C: 6ヶ月
    D: 1年
  answer: C
  explanation: マニュアルによると、4回目の試験に合格できなかった場合、直近の不合格となった試験から6ヶ月間待機してから再度手続きを開始する必要があります。
- id: 372
  category: license_system
  question: 17歳未満の場合、運転免許試験を受ける資格を得るまでに、学習許可証（Instruction Permit）をどのくらいの期間保持する必要がありますか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 9ヶ月
    D: 丸1年間、または17歳になるまで
  answer: D
  explanation: 17歳未満の場合、運転免許試験を受ける資格を得るには、丸1年間、または17歳になるまでのいずれか早い方まで学習許可証を保持する必要があります。
- id: 373
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、車輪はどちらの方向に向けるべきですか？
  choices:
    A: 縁石の方に向ける
    B: 直進方向に向ける
    C: 縁石とは反対方向に向ける
    D: 縁石と平行にする
  answer: C
  explanation: マニュアルの例題によると、縁石のある上り坂で駐車する場合、車輪は縁石とは反対方向（道路の中央側）に向ける必要があります。
- id: 374
  category: safe_driving_rules
  question: 他の車両を追い越す際、どの時点まで追い越しを続けるべきですか？
  choices:
    A: サイドミラーを見て、その車両が後ろにいるのが確認できるまで
    B: 追い越した車両の前面全体がバックミラーに見えるようになるまで
    C: 追い越した相手のドライバーが、車線変更してもよいと合図を送ってくるまで
    D: 追い越した車両の1台分前方に到達するまで
  answer: B
  explanation: マニュアルの例題では、追い越した車両の前面全体がバックミラーに見えるようになるまで追い越しを続け、それから元の車線に戻るべきであると示されています。
- id: 375
  category: safe_driving_rules
  question: 交差点の停止線で停止することが重要なのはなぜですか？
  choices:
    A: 大型車両が回転するためのスペースを十分に確保するため
    B: 信号がより早く変わるようにするため
    C: 歩行者が歩くスペースをより広く確保するため
    D: 信号無視取締カメラの作動を避けるため
  answer: A
  explanation: マニュアルの例題によると、大型車両が交差点を曲がる際に必要な回転スペースを確保するために、停止線で停止することが重要です。
- id: 376
  category: safe_driving_rules
  question: 路面が一般的に最も滑りやすくなるのはいつですか？
  choices:
    A: 雨、雪、またはみぞれが降り始めたとき
    B: 雨、雪、またはみぞれがしばらく降り続いているとき
    C: 雨、雪、またはみぞれが止んだ直後
    D: 嵐の後に太陽が出てきたとき
  answer: A
  explanation: マニュアルには、雨、雪、またはみぞれが降り始めたときが、路面上の油分と水分が混ざり合うため、最も滑りやすくなると記載されています。
- id: 377
  category: safe_driving_rules
  question: 踏切を横断中に車両が故障（エンスト）し、列車が近づいてきた場合、どうすべきですか？
  choices:
    A: 線路を横切って、できるだけ遠くまで走る
    B: 列車が近づいてくる方向に向かって走る
    C: 列車の進行方向（列車から遠ざかる方向）へ走る
    D: 車内にとどまり、911に通報する
  answer: B
  explanation: マニュアルの例題では、踏切内で車両が動かなくなった場合、衝突によって飛散する破片に当たらないよう、列車が近づいてくる方向に向かって斜めに走るようアドバイスしています。
- id: 378
  category: driver_testing
  question: 運転試験の乗車前点検において、必要とされないことはどれですか？
  choices:
    A: 車両の周りを歩くこと
    B: 点検する各項目を指差す、または触れること
    C: ボンネットを開ける、または車両の下に潜り込むこと
    D: 何を点検しているのかを試験官に説明すること
  answer: C
  explanation: マニュアルによると、乗車前点検では車両の周りを歩いたり、項目を指差したり触れたり、点検内容を説明したりする必要がありますが、ボンネットを開けたり車両の下に潜り込んだりする必要はありません。
- id: 379
  category: vehicle_information
  question: 車両の推奨タイヤ空気圧（psi）はどこで確認できますか？
  choices:
    A: タイヤの側面（サイドウォール）
    B: 車両の取扱説明書、または運転席側のドアジャム（ドアの縁）
    C: ダッシュボードのインジケーターランプ
    D: グローブボックスのドアの内側
  answer: B
  explanation: タイヤの空気圧を確認する際は、タイヤの側面に記載されている最大値ではなく、車両の取扱説明書または運転席側のドアジャムに記載されている推奨psiを確認するようマニュアルで推奨されています。
- id: 380
  category: vehicle_information
  question: タイヤの溝の深さを確認するための「ペニーテスト」はどのように行いますか？
  choices:
    A: ペニー硬貨をタイヤの側面に平らに当てる
    B: リンカーンの頭をタイヤの溝の最も低い部分に差し込む
    C: リンカーン記念館が描かれた面を上にして溝に置く
    D: タイヤの上からペニー硬貨を落として、跳ね返るか確認する
  answer: B
  explanation: 「ペニーテスト」は、エイブラハム・リンカーンの肖像が描かれた1セント硬貨を使い、リンカーンの頭を逆さまにしてタイヤの溝に差し込みます。頭の一部が隠れれば十分な溝がありますが、頭が完全に見える場合はタイヤの交換時期です。
- id: 381
  category: vehicle_information
  question: タイヤの空気圧が高すぎる（空気圧過多）状態で走行した場合、どのような影響が出る可能性がありますか？
  choices:
    A: ハイドロプレーニング現象の影響が増大する
    B: コーナリング性能が低下する
    C: トレッド剥離やタイヤ故障の可能性が高まる
    D: 屈曲の増加による過度の熱の蓄積
  answer: C
  explanation: マニュアルによると、空気圧過多はトレッド剥離やタイヤ故障の可能性を高めます。
- id: 382
  category: vehicle_information
  question: 運転前に車両の下に水たまりや液体の漏れがないか確認することが重要なのはなぜですか？
  choices:
    A: エアコンの結露が適切に排出されているか確認するため
    B: 液体の減少は、トランスミッションや燃料系統の部品故障を示している可能性があるため
    C: フロントガラスの洗浄液が満タンか確認するため
    D: タイヤの空気圧が正しいか確認するため
  answer: B
  explanation: 液体の減少は、トランスミッションや燃料系統など、液量をすぐに確認できない箇所の部品故障を示している可能性があるため、漏れを確認することが重要です。
- id: 383
  category: safe_driving_rules
  question: 車両の冷却水を確認する際、絶対にやってはいけないことは何ですか？
  choices:
    A: ラジエーターの横で冷却水の量を確認する
    B: 冷却水と水の混合液を補充する
    C: エンジンが熱い状態でラジエーターキャップを開ける
    D: 適切な冷却水の混合比をドライバーズマニュアルで確認する
  answer: C
  explanation: マニュアルには「エンジンが熱い状態でラジエーターキャップを絶対に開けないでください！まず車が冷めるまで待ってください」と明記されています。
- id: 384
  category: driver_testing
  question: 運転免許試験中に外気温が85°F（約29.4°C）を超えている場合、車両には何が求められますか？
  choices:
    A: 助手席の窓が開閉できなければならない
    B: エアコンが正常に作動しなければならない
    C: ヒーターを無効にしなければならない
    D: ワイパーを作動させなければならない
  answer: B
  explanation: 運転免許試験に使用する車両は、外気温が85°Fを超える場合、エアコンが正常に作動する必要があります。
- id: 385
  category: safe_driving_rules
  question: シートベルトは体にどのように正しく装着すべきですか？
  choices:
    A: 腹部と首にかける
    B: 腰と肩にかける
    C: 膝の上に緩めにかけ、背中の後ろに通す
    D: 太ももの上にきつく締め、腕の下に通す
  answer: B
  explanation: シートベルトを確認する際は、破れやほつれがないことを確認し、腰と肩を横切るように正しく装着する必要があります。
- id: 386
  category: vehicle_information
  question: 車両のデフロスターが正常に作動しているか確認することが重要なのはなぜですか？
  choices:
    A: 暑い時期にエンジンを冷却するため
    B: 特に寒い時期の視界を改善するため
    C: エンジンの凍結を防ぐため
    D: フロントガラスの外側の汚れやゴミを取り除くため
  answer: B
  explanation: デフロスターは、特に寒い時期の視界を改善するため、正常に作動していることを確認することが重要です。
- id: 387
  category: vehicle_information
  question: 点検中に車両のデフロスターが作動しているかどうかをどのようにテストできますか？
  choices:
    A: ファンを作動させ、ダッシュボードの吹き出し口に手をかざす
    B: ワイパーを入れ、洗浄液を噴射する
    C: すべての窓を開けて空気の流れを確認する
    D: ラジエーターの冷却水レベルを確認する
  answer: A
  explanation: ファンを作動させ、ダッシュボードの吹き出し口に手をかざして、正常に作動していることを確認することで、デフロスターをテストできます。
- id: 388
  category: vehicle_information
  question: ダッシュボードの表示灯を確認する主な目的は何ですか？
  choices:
    A: ラジオに電源が入っているか確認するため
    B: 方向指示器やハイビームなどの外部ライトが、不適切な場面で点灯したままになっていないか警告するため
    C: タンクに残っている正確な燃料量を測定するため
    D: 車内からタイヤの空気圧を確認するため
  answer: B
  explanation: 表示灯は、方向指示器やハイビームなどの外部ライトが不適切な場面で点灯したままになっている場合に警告してくれるため、正常に作動することを確認することが重要です。
- id: 389
  category: safe_driving_rules
  question: 「ペニーテスト」で示される安全な基準よりもタイヤの溝が浅くなった場合、どうなりますか？
  choices:
    A: 悪条件下での路面をグリップする能力が大幅に低下する
    B: 車両が自動的に排ガス検査に不合格になる
    C: タイヤが空気圧過多になる
    D: 燃費が大幅に向上する
  answer: A
  explanation: マニュアルには、溝が安全な量（リンカーンの頭が隠れる程度）を下回ると、悪条件下で路面をグリップする能力が大幅に低下すると記載されています。
- id: 390
  category: driver_testing
  question: 親、保護者、または友人と乗車前点検を練習する場合、その同行者にはどのような要件がありますか？
  choices:
    A: 認定されたドライビングインストラクターである必要がある
    B: 適切な免許を所持しており、21歳以上である必要がある
    C: 点検対象の車両を所有している必要がある
    D: 商用運転免許（CDL）を所持している必要がある
  answer: B
  explanation: マニュアルでは、適切な免許を所持し、21歳以上の親、保護者、または友人と点検を練習することを推奨しています。
- id: 391
  category: vehicle_information
  question: タイヤの空気圧不足や溝の不足によって起こる結果は何ですか？
  choices:
    A: 制動距離の短縮
    B: コーナリング性能の向上
    C: ハイドロプレーニング現象の影響の増大
    D: バースト（破裂）の可能性の減少
  answer: C
  explanation: タイヤの空気圧不足や溝の不足は、ハイドロプレーニング現象の影響を増大させ、コーナリング性能を低下させ、過度な熱の蓄積によるバーストの可能性を高めます。
- id: 392
  category: vehicle_information
  question: ブレーキランプの点検をした際、片方しか点灯していない場合はどうすべきですか？
  choices:
    A: 片方が点灯している限り、運転を続ける。
    B: 電球やヒューズを交換するか、専門業者に依頼する。
    C: ブレーキペダルをより強く踏んで、もう一方のライトを点灯させる。
    D: 方向指示器を使って、停車することを周囲に示す。
  answer: B
  explanation: マニュアルには、ペダルを踏んだときに両方のブレーキランプが点灯していることを確認し、点灯しない場合は電球やヒューズを交換するか、専門業者に依頼すべきであると記載されています。
- id: 393
  category: driver_testing
  question: 基本的な車両操作技能試験の練習をする際、同伴する免許を所持した親、保護者、または友人は何歳以上である必要がありますか？
  choices:
    A: 18歳
    B: 19歳
    C: 21歳
    D: 25歳
  answer: C
  explanation: マニュアルでは、適切な免許を所持し、21歳以上である親、保護者、または友人と一緒にこれらの練習を行うよう指示されています。
- id: 394
  category: driver_testing
  question: 基本操作技能試験において、「リバーサル（切り返し）」エラーに該当するのはどれですか？
  choices:
    A: 進行方向を変えずに停車すること。
    B: 後退中に肩越しに後ろを確認すること。
    C: 後退中に方向指示器を使用しないこと。
    D: より良い位置に移動するために、停車して進行方向を逆にすること。
  answer: D
  explanation: リバーサル（切り返し）とは、より良い位置に移動するために停車して進行方向を逆にすることと定義されています。進行方向を変えずに停車することはリバーサルには含まれません。
- id: 395
  category: driver_testing
  question: 試験の境界線やコーンに接触または越えても、「エンクローチメント（はみ出し）」としてカウントされない車両の部位はどれですか？
  choices:
    A: タイヤ
    B: バンパー
    C: 車両のミラー
    D: 排気管
  answer: C
  explanation: 車両のミラー以外の部分で、試験の境界線やコーンに接触したり越えたりすることは、エンクローチメント（はみ出し・接触）とみなされます。
- id: 396
  category: driver_testing
  question: 基本操作技能試験の実施中に方向指示器が自動的に消えてしまった場合、どうしなければなりませんか？
  choices:
    A: 試験官はすでに確認しているので、消したままにする。
    B: 必要に応じて再度出す。
    C: 代わりに手信号を使用する。
    D: 車両を停止させ、試験を最初からやり直す。
  answer: B
  explanation: マニュアルには、試験中に方向指示器が自動的に消えた場合は、必要に応じて確実に再度出さなければならないと記載されています。
- id: 397
  category: driver_testing
  question: 縦列駐車の試験を行う際、車両をスペースの縁石側にどのくらい近づける必要がありますか？
  choices:
    A: 6インチ（約15cm）以内
    B: 12インチ（約30cm）以内
    C: 18インチ（約45cm）以内
    D: 24インチ（約60cm）以内
  answer: B
  explanation: 右側および左側の両方の縦列駐車において、境界線を越えることなく、車両をスペースの縁石側から12インチ以内に収める必要があります。
- id: 398
  category: safe_driving_rules
  question: 交差点や右左折の手前で他車の後ろに停車する際、安全な車間距離とされるのはどれですか？
  choices:
    A: 車1台分
    B: 車2台分
    C: 前車の後輪が見える位置での停車
    D: 前車のルームミラーに運転者の顔が見える位置での停車
  answer: C
  explanation: 他車の後ろに停車する際の安全な車間距離は、前車の後輪が見える位置で停車することです。
- id: 399
  category: safe_driving_rules
  question: 右左折の前に停車しなければならない場合、待機中の前輪はどのように位置させるべきですか？
  choices:
    A: わずかに右に向けておく
    B: わずかに左に向けておく
    C: まっすぐ前を向けておく
    D: 曲がろうとする方向に向けておく
  answer: C
  explanation: マニュアルには、右左折の前に停車しなければならない場合、前輪はまっすぐ前を向けたままにしておくべきであると記載されています。
- id: 400
  category: safe_driving_rules
  question: 交差点を通過中の車線変更について、どのようなルールが適用されますか？
  choices:
    A: 方向指示器を使用すれば車線変更できる。
    B: 交差点内に車両がいなければ車線変更できる。
    C: 交差点を通過している間は車線変更をしてはならない。
    D: 交差点内では最も右側の車線に車線変更しなければならない。
  answer: C
  explanation: 交差点を通過する際について、マニュアルには「交差点を通過している間は車線変更をしてはならない」と明記されています。
- id: 401
  category: safe_driving_rules
  question: 複数車線のある交差点を通過したり、右左折を終えたりした後、安全が確認できたらどの車線に移動すべきですか？
  choices:
    A: 一番左側の車線
    B: 中央の車線
    C: 一番右側の車線
    D: 最も流れの速い車線
  answer: C
  explanation: 右左折や交差点通過後は、死角とミラーを確認し、安全であれば（まだその車線にいない場合は）一番右側の車線に移動する必要があります。
- id: 402
  category: driver_testing
  question: 前進2点転回（Forward Two-point Turnabout）の練習において、私道や路地に前進して入った後の次のステップは何ですか？
  choices:
    A: 車両を左に後退させて通りに出る。
    B: 車両を右に後退させて通りに出る。
    C: 路地の中でUターンを行う。
    D: 路地をそのまま前進して次の通りまで進む。
  answer: B
  explanation: 前進2点転回では、私道や路地に前進して入り、その後、車両を右に後退させて通りに出ます。
- id: 403
  category: driver_testing
  question: 後退2点転回（Reverse Two-point Turnabout）を行う際の最初のステップは何ですか？
  choices:
    A: 私道や路地に前進して入る。
    B: 私道や路地の入り口を通り過ぎる。
    C: 最寄りの交差点まで直接後退する。
    D: 道路の真ん中で3点転回（スイッチバック）を行う。
  answer: B
  explanation: 後退2点転回では、まず私道や路地の入り口を通り過ぎ、その後、右側に後退して通りや路地に入ることが求められます。
- id: 404
  category: driver_testing
  question: 路上運転試験中、試験官の指示に関して正しいものはどれですか？
  choices:
    A: 試験官は、受験者に違反行為をさせるよう仕向けることがある。
    B: 反射神経をテストするため、危険な運転をするよう指示されることがある。
    C: 指示は、試験官が求めた動作を行うための十分な余裕を持って与えられる。
    D: 試験官は、直前になるまで指示を出さない。
  answer: C
  explanation: マニュアルには次のように記載されています。「指示は、試験官が求めた動作を行うための十分な余裕を持って与えられます。危険な運転をするよう求められることはありません。」
- id: 405
  category: driver_testing
  question: 基本操作スキル試験（basic control skills test）において、目視による確認（head checks）と交通状況の確認はいつ行う必要がありますか？
  choices:
    A: 試験官から明示的に促された時のみ。
    B: 車道や練習エリアに出入りする前。
    C: 後退する時のみ。
    D: 縦列駐車をする時のみ。
  answer: B
  explanation: 練習課題を行う際は、車道に出入りする前に交通状況を確認することが重要です。交通の流れに戻る前や練習エリアを離れる前に、車道に車両がいないことを確認しなければなりません。
- id: 406
  category: driver_testing
  question: スキル試験の課題中に、試験官の指示通りに車両を正確な最終位置に移動させられなかった場合、どうなりますか？
  choices:
    A: 自動的に不合格となる。
    B: スコアに減点が加算される。
    C: 正しくできるまで課題を繰り返すよう求められる。
    D: 試験官がハンドルを操作する。
  answer: B
  explanation: 「最終位置（Final Position）」の採点項目には、「試験官の指示通りに車両を最終位置に移動させなかった場合、スコアに減点が加算される」と記載されています。
- id: 407
  category: safe_driving_rules
  question: 交差点を通過中に車線変更をすることは許可されていますか？
  choices:
    A: 方向指示器（ウィンカー）を使用すれば許可される。
    B: 他の車両がいなければ許可される。
    C: いいえ、交差点内での車線変更はすべきではありません。
    D: 右折の準備をしている時のみ許可される。
  answer: C
  explanation: マニュアルには、「交差点を通過中に車線変更をしてはならない」および「交差点で車線変更を試みてはならない」と記載されています。
- id: 408
  category: safe_driving_rules
  question: 高速道路（expressway）に入る際、避けるべき行動はどれですか？
  choices:
    A: 方向指示器（ウィンカー）を使用すること。
    B: 肩越しに目視して死角を確認すること。
    C: 停止したり、実線の区画線を越えたりすること。
    D: スムーズに合流するために速度を上げること。
  answer: C
  explanation: 高速道路に入る際は、停止したり実線の区画線を越えたりすることなく、交通の流れに合わせて適切な車線へスムーズに合流する必要があります。
- id: 409
  category: vehicle_operation
  question: カーブに近づく際、速度を落とすのに最適なタイミングはいつですか？
  choices:
    A: カーブの途中にいる時。
    B: カーブに入る前。
    C: カーブを抜けた後。
    D: ブレーキをかけるのではなく、カーブを加速して通過すべきである。
  answer: B
  explanation: カーブに入る前に速度を落としておくことで、カーブ内でそれ以上のブレーキ操作を必要としないようにする必要があります。
- id: 410
  category: driver_testing
  question: 路上試験中のハンドル（ステアリングホイール）の正しい持ち方はどれですか？
  choices:
    A: 片手をハンドルに、もう片方の手をシフトレバーに置く。
    B: 両手をハンドルの内側のスポーク部分に置く。
    C: 常に両手をハンドルの外側に置く。
    D: 片手を12時の位置に置く。
  answer: C
  explanation: 他の操作機器を使用している場合を除き、常に両手をハンドルの外側に置いておく必要があります。送りハンドル（hand-to-hand）と交差ハンドル（hand-over-hand）のどちらの方法も認められています。
- id: 411
  category: safe_driving_rules
  question: 多車線道路で右折を完了する際、どの車線で終了すべきですか？
  choices:
    A: 最も左の車線。
    B: 中央車線。
    C: 空いている任意の車線。
    D: 最も右（縁石側）の車線。
  answer: D
  explanation: 適切な車線使用規則に従い、右折は最も右（縁石側）の車線で完了させる必要があります。
- id: 412
  category: defensive_driving
  question: 交差点で他車の後ろに停車する際、どの程度の車間距離を空けるべきですか？
  choices:
    A: 正確に車1台分。
    B: 前方の車両の後輪が見える程度の距離。
    C: 3〜4フィート（約0.9〜1.2メートル）の距離。
    D: バックミラー越しに相手の運転手の頭が見える程度の距離。
  answer: B
  explanation: 他車の後ろに停車する際は、安全な距離を保つために前方の車両の後輪が見えることを確認してください。
- id: 413
  category: driver_testing
  question: 路上試験において、不合格（即時失格）となる行為は次のうちどれですか？
  choices:
    A: 試験官に指示の復唱を求めること。
    B: ハンドルを回す際に送りハンドル（hand-over-hand）を用いること。
    C: 死角の確認を怠ること。
    D: 一時停止標識でスムーズにブレーキをかけること。
  answer: C
  explanation: 路上試験中に死角の確認を行わないことは、即時失格の対象として記載されています。
- id: 414
  category: driver_testing
  question: 路上試験中に、不必要に車両を歩道や縁石に乗り上げた場合、どうなりますか？
  choices:
    A: 試験官から警告を受ける。
    B: 2点の減点。
    C: 即時失格。
    D: その操作のやり直しを求められる。
  answer: C
  explanation: 不必要に車両を歩道や縁石に乗り上げる行為は、路上試験における即時失格の対象です。
- id: 415
  category: defensive_driving
  question: 旅行中に1人ですべての運転を行う場合、推奨される1日の運転制限時間はどれくらいですか？
  choices:
    A: 4〜5時間。
    B: 6〜8時間。
    C: 10〜11時間。
    D: 12〜14時間。
  answer: B
  explanation: 1人ですべての運転を行う場合、1日の運転時間は6〜8時間を限度とすべきです。
- id: 416
  category: defensive_driving
  question: 旅行中に2人以上で運転を交代できる場合、1日の合計運転時間は何時間を超えるべきではありませんか？
  choices:
    A: 8〜9時間。
    B: 10〜11時間。
    C: 14〜15時間。
    D: 16〜18時間。
  answer: B
  explanation: 2人以上で運転を交代できる場合、合計運転時間は10〜11時間を超えるべきではありません。
- id: 417
  category: defensive_driving
  question: 主要な高速道路を走行中、どのくらいの頻度で10〜15分間の休憩を取るべきですか？
  choices:
    A: 1時間ごと。
    B: 2〜3時間ごと。
    C: 4〜5時間ごと。
    D: 給油が必要な時のみ。
  answer: B
  explanation: マニュアルでは、主要な高速道路を走行する際、2〜3時間ごとに10〜15分間の休憩を取ることを推奨しています。
- id: 418
  category: safe_driving_rules
  question: 一時停止標識や交通信号で停車する際、車両のどこで停車すべきですか？
  choices:
    A: 交差する交通が見えるよう、停止線を越えた位置。
    B: 歩行者用横断歩道の中。
    C: 停止線、横断歩道、または歩道の手前。
    D: 交差点内に少し入った位置。
  answer: C
  explanation: 一時停止標識や交通信号で停車する際は、停止線、横断歩道、歩道、またはその他の標示を越えて停車してはならず、また交差点内で停車してもいけません。
- id: 419
  category: defensive_driving
  question: マニュアルによると、何時を過ぎると運転中に居眠りをする可能性が高くなりますか？
  choices:
    A: 午後8時。
    B: 午後9時。
    C: 午後10時。
    D: 午後11時。
  answer: D
  explanation: 視界が制限される暗くなってからの運転は避けるべきであり、特に午後11時以降は運転中に居眠りをする可能性が高くなります。
- id: 420
  category: vehicle_operation
  question: 車線変更の準備をする際に行う「ヘッドチェック（目視確認）」とは何ですか？
  choices:
    A: バックミラーを見ること。
    B: 肩越しに振り向いて死角を確認すること。
    C: 曲がる前に試験官に対してうなずくこと。
    D: ダッシュボードの計器類を確認すること。
  answer: B
  explanation: ヘッドチェック（目視確認）とは、車線変更や合流の前に、肩越しに振り向いて死角を確認することを指します。
- id: 421
  category: safe_driving_rules
  question: カンザス州でスパイクタイヤの使用が認められている期間はいつですか？
  choices:
    A: 10月1日から3月1日まで
    B: 11月1日から4月1日まで
    C: 12月1日から3月31日まで
    D: 一年中認められている
  answer: B
  explanation: マニュアルによると、スパイクタイヤの使用が認められているのは11月1日から4月1日までです。
- id: 422
  category: vehicle_information
  question: 前輪駆動車において、スノータイヤまたは「オールシーズン」タイヤを装着するのに最適な場所はどこですか？
  choices:
    A: 前輪のみ
    B: 後輪のみ
    C: 4輪すべて
    D: 右側の車輪のみ
  answer: C
  explanation: マニュアルには、前輪駆動車であっても、スノータイヤやオールシーズンタイヤは前輪だけでなく4輪すべてに装着するのが最善であると記載されています。
- id: 423
  category: defensive_driving
  question: みぞれ、着氷性の雨、または雪が降り始めたとき、道路のどの部分が最初に凍結しやすいですか？
  choices:
    A: 交差点と横断歩道
    B: 橋、ランプ（接続道路）、高架橋
    C: トンネルとアンダーパス（地下道）
    D: 未舗装路や砂利道
  answer: B
  explanation: みぞれ、着氷性の雨、または雪が降り始めたときは、橋、ランプ、高架橋が最初に凍結しやすいことを覚えておいてください。
- id: 424
  category: safe_driving_rules
  question: 寒冷な天候の中で立ち往生した場合、暖かさを保つために車のエンジンとヒーターをどのように操作すべきですか？
  choices:
    A: 助けが来るまでエンジンをかけ続ける
    B: 1時間ごとに約10分間エンジンをかける
    C: 2時間ごとに30分間エンジンをかける
    D: 燃料を節約するためにエンジンは一切かけない
  answer: B
  explanation: マニュアルでは、バッテリーの充電と車内を温めるために、1時間ごとに約10分間エンジンをかけることを推奨しています。
- id: 425
  category: safe_driving_rules
  question: 車内で立ち往生した場合、排気管から雪や破片を取り除いておくことが非常に重要なのはなぜですか？
  choices:
    A: エンジンのオーバーヒートを防ぐため
    B: バッテリーの消耗を防ぐため
    C: 排気ガスが車内に漏れ出し、一酸化炭素中毒を引き起こすのを防ぐため
    D: ヒーターから冷気ではなく暖気が出るようにするため
  answer: C
  explanation: 排気ガスが車内に漏れ出し、意識を失ったり、死に至ったりする可能性があるため、排気管には雪や破片が詰まらないようにしてください。
- id: 426
  category: vehicle_information
  question: 酷暑の中で運転する場合、どのくらいの頻度でタイヤを点検すべきですか？
  choices:
    A: 1時間ごと、または50マイル走行ごと
    B: 2時間ごと、または100マイル走行ごと
    C: 4時間ごと、または200マイル走行ごと
    D: 燃料補給で停車したときのみ
  answer: B
  explanation: 暑い中を運転するときは、2時間ごと、または100マイル（約160km）ごとにタイヤを点検する必要があります。
- id: 427
  category: vehicle_information
  question: 暑い中を運転中にタイヤの空気圧が上昇した場合、どうすべきですか？
  choices:
    A: 破裂（バースト）を防ぐために少し空気を抜く
    B: 空気を抜いてはいけない。タイヤが冷えたときに空気圧が低くなりすぎてしまうため
    C: タイヤに冷水をかけて空気圧を下げる
    D: 走行風でタイヤを冷やすために速度を上げる
  answer: B
  explanation: 空気圧は温度とともに上昇します。空気を抜いてしまうと、タイヤが冷えたときに空気圧が不足することになるため、抜いてはいけません。
- id: 428
  category: defensive_driving
  question: 酷暑の際、路面で注意すべき特定の危険は何ですか？
  choices:
    A: 非常に滑りやすくなるタールの滲み出し（ブリージング）
    B: 大きな段差の原因となるコンクリートの膨張
    C: 車線を不明瞭にする塗装ラインの融解
    D: 乾燥したアスファルトからの照り返しの増加
  answer: A
  explanation: 酷暑の際、道路舗装のタールが表面に浮き上がってくることがよくあります。タールが「滲み出している」箇所は非常に滑りやすくなることがあります。
- id: 429
  category: defensive_driving
  question: 運転中に竜巻を発見した場合、どうすべきですか？
  choices:
    A: 最寄りの橋や高架橋の下に避難する
    B: 車内に留まり、路肩に停車する
    C: 車を離れて頑丈な避難所へ行くか、竜巻の進路から外れるように運転する
    D: 素早く通り抜けるために竜巻の中心に向かって運転する
  answer: C
  explanation: 竜巻を発見した場合は、車を離れて頑丈な避難所に逃げるか、竜巻の進路から外れるように運転してください。車両は簡単に飛ばされ、破壊されてしまいます。
- id: 430
  category: defensive_driving
  question: 竜巻の際、橋や高架橋の下に避難するのを避けるべきなのはなぜですか？
  choices:
    A: 落雷を引き寄せやすいため
    B: 「ウィンドトンネル現象（風洞効果）」により、高架下では風がより強くなるため
    C: 雨によって崩落する可能性が高いため
    D: 接近する緊急車両の視界を遮るため
  answer: B
  explanation: 橋や高架橋の下は「ウィンドトンネル現象」によって風が強まり、また飛来物からの保護もほとんど期待できないため、避難場所にするのは避けてください。
- id: 431
  category: safe_driving_rules
  question: 雷雨の際、車内で身を守る最も安全な方法は何ですか？
  choices:
    A: オープンカーの屋根を開けて運転する
    B: 高い木の下に駐車する
    C: ハードトップ車（屋根が固定された車）の中に留まり、すべてのドアを閉め、窓を閉める
    D: 外部アンテナに接続されたラジオを使用して天候を監視する
  answer: C
  explanation: 雷雨の際、身を守ることができるのはハードトップ車のみです。すべてのドアを閉め、窓を上げ、金属部分には触れないようにしてください。
- id: 432
  category: defensive_driving
  question: 車両が洪水に巻き込まれ、ドアやサイドウィンドウを開けることができない場合、推奨される脱出方法は何ですか？
  choices:
    A: 水が完全に引くのを待つ
    B: 息を吸い込み、窓を蹴り破り、エアポケットで最後の一呼吸をしてから脱出する
    C: ヒーターをつけて水を蒸発させる
    D: 誰かが外からドアを開けてくれるまでクラクションを鳴らし続ける
  answer: B
  explanation: サイドウィンドウを開けることができない場合は、息を吸い込んでから窓を蹴り破ってください。エアポケットで最後の一呼吸をしてから脱出します。
- id: 433
  category: license_system
  question: 商用免許（CDL）保持者が住所を更新する必要がある場合、どうすればよいですか？
  choices:
    A: 地元の郵便局を訪問する
    B: 地元の郡財務官（County Treasurer）にのみ連絡する
    C: カンザス州のフルサービス運転免許事務所を訪問する
    D: ikan.ks.gov を使用してオンラインで住所を更新する
  answer: C
  explanation: マニュアルには「商用免許保持者の場合は、カンザス州のフルサービス運転免許事務所を訪問する必要があります」と記載されています。
- id: 434
  category: driver_responsibility
  question: カンザス州の本人同意法（First-Person Consent law）に基づき、本人が18歳以上である場合、その人の臓器提供の意思決定を覆すことができるのは誰ですか？
  choices:
    A: その人の配偶者
    B: その人の両親
    C: その人の医師
    D: 他の誰もその決定を覆すことはできない
  answer: D
  explanation: 本人同意への変更は、個人の提供の意思決定が法的拘束力を持ち、本人が18歳以上であれば、他の誰もその決定を覆すことはできないことを意味します。
- id: 435
  category: driver_responsibility
  question: カンザス州における臓器および組織提供に関して、正しい記述はどれですか？
  choices:
    A: ドナーは公開安置（オープンカセット）での葬儀を行うことができない
    B: ドナーの家族は提供手続きの費用を支払わなければならない
    C: あらゆる年齢や病歴の人が提供候補として考慮される
    D: 主要な宗教は一般的に臓器提供に反対している
  answer: C
  explanation: マニュアルには、あらゆる年齢や病歴の人が提供候補として考慮されると記載されています。また、公開安置での葬儀は可能であり、家族に提供に関する費用はかからず、すべての主要な宗教がこれを承認していることも記されています。
- id: 436
  category: driver_responsibility
  question: 臓器および組織提供において、ドナーの家族や遺産相続人にいくら費用がかかりますか？
  choices:
    A: 一律500ドルの手数料
    B: 提供される臓器の種類による
    C: 費用はかからない
    D: 遺産から医療費の一定割合を支払う
  answer: C
  explanation: マニュアルには「臓器および組織提供に関して、ドナーの家族や遺産相続人に費用はかかりません」と記載されています。
- id: 437
  category: driver_responsibility
  question: 臓器および組織提供者の葬儀費用を支払う責任は誰にありますか？
  choices:
    A: 州の登録機関
    B: 病院
    C: ドナーの家族
    D: 臓器受取人
  answer: C
  explanation: マニュアルによると、「葬儀費用は引き続き家族の負担となります」とされています。
- id: 438
  category: driver_responsibility
  question: 生存中に臓器や組織のドナーになることは可能ですか？
  choices:
    A: いいえ、提供は死後のみ可能です
    B: はい、生体ドナー（生存中の提供）は可能です
    C: 組織提供のみ可能です
    D: 家族に対してのみ可能です
  answer: B
  explanation: マニュアルには明示的に「生体ドナー（生存中の提供）は可能です」と記載されています。
- id: 439
  category: driver_responsibility
  question: カンザス州の臓器提供者登録簿に直接登録するために訪問すべきウェブサイトはどれですか？
  choices:
    A: https://www.mwtn.org/
    B: https://www.donatelifekansas.com/
    C: https://www.kansas.gov/donor
    D: https://www.ksrevenue.org/
  answer: B
  explanation: マニュアルには「州の登録簿に直接登録するには、https://www.donatelifekansas.com/ を訪問してください」と指示されています。
- id: 440
  category: driver_responsibility
  question: 臓器提供の金銭的側面に関して、正しい記述はどれですか？
  choices:
    A: 家族が提供手続きの費用を支払わなければならない
    B: 臓器ドナーの葬儀費用は免除される
    C: ドナーの遺産から提供に関する費用が支払われることはない
    D: 州がすべての葬儀費用を負担する
  answer: C
  explanation: マニュアルには「臓器および組織提供に関して、ドナーの家族や遺産相続人に費用はかかりません」と記載されています。
- id: 441
  category: driver_responsibility
  question: 臓器および組織提供に関するより一般的な情報について、マニュアルに記載されているウェブサイトはどれですか？
  choices:
    A: https://www.mwtn.org/
    B: https://www.donatelifekansas.com/
    C: https://www.organdonor.gov/
    D: https://www.ksdot.org/
  answer: A
  explanation: マニュアルには、「詳細については、当社のウェブサイト https://www.mwtn.org/ をご覧ください」と記載されています。
- id: 442
  category: driver_responsibility
  question: マニュアルにある臓器提供のスローガンを完成させてください。「SHARE YOUR LIFE. SHARE YOUR...（あなたの人生を分かち合おう。あなたの...を分かち合おう。）」
  choices:
    A: ORGANS.（臓器）
    B: DECISION.（決断）
    C: FUTURE.（未来）
    D: LOVE.（愛）
  answer: B
  explanation: マニュアルには、「SHARE YOUR LIFE. SHARE YOUR DECISION.（あなたの人生を分かち合おう。あなたの決断を分かち合おう。）」というプロモーションテキストが含まれています。
- id: 443
  category: driver_responsibility
  question: マニュアルによると、臓器および組織提供に関する次の記述のうち、誤っているものはどれですか？
  choices:
    A: 生体ドナーによる提供が可能である。
    B: 葬儀費用は引き続き家族の負担となる。
    C: ドナーの遺産から組織提供のための手数料を支払わなければならない。
    D: オンラインで州の登録簿に登録できる。
  answer: C
  explanation: 遺産から手数料を支払わなければならないという記述は誤りです。マニュアルには、「臓器および組織提供に関して、ドナーの家族や遺産に費用がかかることはありません」と記載されています。
- id: 444
  category: driver_responsibility
  question: 臓器提供のセクションにある次のフレーズを完成させてください。「LIVE IT. GIVE IT. ...」
  choices:
    A: TODAY.（今日）
    B: FREELY.（自由に）
    C: LIFE.（命）
    D: HOPE.（希望）
  answer: C
  explanation: マニュアルには、「LIVE IT. GIVE IT. LIFE.（生きて、つなごう、命を。）」というスローガンが含まれています。
- id: 445
  category: driver_responsibility
  question: 臓器提供者（ドナー）になることを決めた場合、その人の葬儀費用はどうなりますか？
  choices:
    A: 臓器調達機関によって支払われる。
    B: 引き続き家族の負担となる。
    C: カンザス州によって賄われる。
    D: 家族と病院で分割される。
  answer: B
  explanation: マニュアルには、「葬儀費用は引き続き家族の負担となります」とはっきりと記載されています。
- id: 446
  category: driver_responsibility
  question: ある家族が、臓器提供に同意することで故人の遺産が使い果たされるのではないかと心配しています。マニュアルには何と記載されていますか？
  choices:
    A: 遺産には標準的な医療費が請求される。
    B: 複数の臓器が提供された場合にのみ、遺産に請求される。
    C: 臓器および組織提供に関して、ドナーの遺産に費用がかかることはない。
    D: 遺産は手術費用を負担しなければならない。
  answer: C
  explanation: マニュアルでは、「臓器および組織提供に関して、ドナーの家族や遺産に費用がかかることはありません」と保証しています。
- id: 447
  category: driver_responsibility
  question: マニュアルには、死後の提供以外にどのような種類の提供が可能であると明記されていますか？
  choices:
    A: 生体ドナーによる提供 (Living donation)
    B: 金銭的な寄付
    C: 匿名での提供のみ
    D: 州外での提供のみ
  answer: A
  explanation: 本文には、「生体ドナーによる提供（Living donation）が可能です」と明記されています。
- id: 448
  category: driver_responsibility
  question: マニュアルによると、臓器提供に関して「SHARE（分かち合う）」ことが推奨されている2つのことは何ですか？
  choices:
    A: 富と時間
    B: 人生と決断
    C: 健康と臓器
    D: 選択と家族
  answer: B
  explanation: マニュアルは、「SHARE YOUR LIFE. SHARE YOUR DECISION.（あなたの人生を分かち合おう。あなたの決断を分かち合おう。）」という言葉で締めくくられています。
- id: 449
  category: driver_responsibility
  question: 臓器および組織提供のプロセスにおいて、カバーされない（自己負担となる）費用は次のうちどれですか？
  choices:
    A: 臓器回収の費用
    B: 組織回収の費用
    C: 葬儀費用
    D: ドナーの遺産にかかる費用
  answer: C
  explanation: 提供自体については家族や遺産に費用はかかりませんが、マニュアルには「葬儀費用は引き続き家族の負担となります」と明記されています。
- id: 450
  category: driver_responsibility
  question: カンザス州の居住者が州の臓器提供者登録簿に直接登録するにはどうすればよいですか？
  choices:
    A: https://www.donatelifekansas.com/ にアクセスする
    B: 地元の警察署に電話する
    C: https://www.mwtn.org/ にアクセスする
    D: 知事に手紙を書く
  answer: A
  explanation: マニュアルには、「州の登録簿に直接登録するには、https://www.donatelifekansas.com/ をご覧ください」と記載されています。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 徐行し、注意して進む
    B: 一時停止（完全停止）する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「一時停止（STOP）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に、交通状況と歩行者を確認してください。
  id: 451
- image: yield.png
  category: signs_and_signals
  question: この標識はどのような行動を求めていますか？
  choices:
    A: 一時停止（完全停止）する
    B: 加速して交通流に合流する
    C: 減速し、車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「譲れ（YIELD）」標識は、減速して車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 452
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路に進入してはならない
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「進入禁止（DO NOT ENTER）」標識は、この標識が設置されている道路やランプ（接続路）に進入してはならないことを意味します。通常、高速道路の出口ランプや、進入すると対向車の進路に入ってしまう一方通行の道路で見られます。
  id: 453
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: 転回（Uターン）する
    B: 注意深く運転を続ける
    C: 停止して後退するか向きを変える。あなたは逆走しています。
    D: 素早くそのエリアを離れるために加速する
  answer: C
  explanation: 赤と白の「逆走（WRONG WAY）」標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に向きを変えるか後退してください。
  id: 454
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方通行（左方向）である
    C: 中央分離帯の左側を走行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「一方通行（ONE WAY）」標識は、その通りの交通が矢印の指す一方向にのみ進むことを示しています。
  id: 455
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 他の車両の追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所での転回（Uターン）が禁止されていることを意味します。
  id: 456
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  id: 457
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、その場所での右折が禁止されていることを意味します。
  id: 458
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道幅が狭くなる
    B: この区間では他の車両を追い越してはならない
    C: この先、対面通行
    D: 右側通行
  answer: B
  explanation: 白黒の「追い越し禁止区間（NO PASSING ZONE）」というペナント型（三角形）の標識は、そのエリアで他の車両を追い越すことが許可されていないことを意味します。これは追い越し禁止区間の始まりを示します。
  id: 459
- image: keep_right.png
  category: signs_and_signals
  question: この標識はドライバーに何を指示していますか？
  choices:
    A: 右側に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線終了
  answer: C
  explanation: 矢印が描かれた白い規制標識「右側通行（KEEP RIGHT）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 460
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒の文字が書かれた白い長方形の標識は規制標識です。最高速度の標識は、理想的な条件下でその区域において法的に許容される最高速度を示しています。
  id: 461
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園またはサファリパークがある
    B: この区域ではシカが頻繁に道路を横断する
    C: この先に狩猟区域がある
    D: 近くに野生動物保護区がある
  answer: B
  explanation: シカのシルエットが描かれた黄色のひし形の標識は、この区域でシカが頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 462
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先にスクールゾーンがある
    B: この先に歩行者横断路がある
    C: 近くにハイキングコースがある
    D: この先にバス停がある
  answer: B
  explanation: 歩行者の姿が描かれた黄色のひし形の標識は、この先に歩行者横断路があることを警告しています。道路を横断する歩行者のために停止できるよう準備してください。
  id: 463
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区域
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 464
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色の円形の標識は何を警告していますか？
  choices:
    A: この先にラウンドアバウト（環状交差点）がある
    B: 病院区域
    C: この先に踏切がある
    D: 追い越し禁止区域
  answer: C
  explanation: 黒いXと2つのRが描かれた黄色の円形の標識は、この先に踏切があることを知らせる事前警告標識です。速度を落とし、列車の音や姿を確認してください。
  id: 465
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: 通常、この標識はどこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型の鉄道十字標識（クロスバック）は、踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 466
- image: curve_right.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を示していますか？
  choices:
    A: この先で行き止まり
    B: 右折が必要
    C: この先に右カーブがある
    D: この先に回り道（デツアー）がある
  answer: C
  explanation: 曲がった矢印が描かれた黄色のひし形の標識は、この先にカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 467
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角であることを示す
    B: より大幅な減速が必要な急カーブを警告している
    C: 右折専用であることを意味する
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 468
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: つづら折りの道路（ワインディングロード）
    B: この先に1つのカーブがある
    C: 反対方向への2つの連続したカーブがある
    D: この先にラウンドアバウトがある
  answer: C
  explanation: 反対方向への連続カーブ（リバースカーブ）の標識は、この先に反対方向へ曲がる2つのカーブがあることを警告しています。速度を落とし、道路が最初に一方へ、次に反対側へ曲がることに備えてください。
  id: 469
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 1つの急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブや曲がり角がある
    D: この先に坂道がある
  answer: C
  explanation: つづら折り（ワインディングロード）の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、変化する道路状況に注意してください。
  id: 470
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 他の道路からの交通の合流
    C: 分離高速道路の開始
    D: 道路が1車線に狭まること
  answer: B
  explanation: 黄色のひし形の合流標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
  id: 471
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に橋がある
    B: この先で道幅が狭くなる
    C: 車線の終了
    D: 分離高速道路の終了
  answer: B
  explanation: この警戒標識は、この先の道幅が狭くなることを示しています。道幅の減少に備え、車線内の位置を調整してください。
  id: 472
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 分離高速道路の開始
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって反対方向の交通と分離された「分離高速道路」になることを警告しています。右側を通行してください。
  id: 473
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 分離高速道路の開始
    B: 分離高速道路が終了し、対面通行が再開する
    C: この先に合流地点がある
    D: この先で道路工事中
  answer: B
  explanation: この標識は、分離高速道路が終了することを警告しています。反対方向の交通が中央分離帯で区切られなくなります。対面通行に備えてください。
  id: 474
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 分離高速道路の開始
    B: この先に追い越し区間がある
    C: この先対面通行 — 交通が両方向に流れる
    D: この先で車線がシフトする
  answer: C
  explanation: この標識はこの先が対面通行であることを警告しています。一方通行の道路や分離高速道路から出て、反対方向に進む車両と遭遇する可能性があります。
  id: 475
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような路面状態を警告していますか？
  choices:
    A: 路面の凍結
    B: 濡れると滑りやすくなる
    C: この先、曲がりくねった道
    D: 路面の凹凸
  answer: B
  explanation: 「スリップ注意（濡れている時）」の標識は、雨などで路面が濡れている時に非常に滑りやすくなることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 476
- image: hill.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 路面の隆起
    B: 路面の凹凸
    C: この先に急な坂道や勾配がある
    D: 道路工事
  answer: C
  explanation: この標識はこの先に急な坂道や勾配があることを警告しています。特にトラックや牽引車の場合は、速度を調整し、低いギアにシフトする必要があるかもしれません。
  id: 477
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: この先に一時停止標識がある
    B: この先に信号機がある
    C: 通学路の横断歩道
    D: 検問所
  answer: B
  explanation: この標識はこの先に信号機があることを警告しています。赤信号や黄信号の場合に停止できるよう準備してください。この標識は、遠くから信号機が見えにくい場所に設置されることが多いです。
  id: 478
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識はこの先に何があることを伝えていますか？
  choices:
    A: 譲れ（前方優先）の標識
    B: 信号機
    C: 必ず停止しなければならない一時停止標識
    D: スピードバンプ（段差）
  answer: C
  explanation: この標識はこの先に一時停止標識があることを警告しています。減速を開始し、一時停止標識の場所で完全に停止できるよう準備してください。
  id: 479
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に踏切がある
    B: この先に十字路または交差点がある
    C: この先に病院がある
    D: 歩行者横断歩道
  answer: B
  explanation: この標識はこの先に十字路または4差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 480
- image: side_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先にT字路がある
    B: 右側から側道が合流している
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は、右側から側道が合流していることを警告しています。側道から幹線道路に進入してくる車両に注意してください。
  id: 481
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線が合流している
    B: 車線が減少している
    C: 新しい車線が追加される（合流の必要はない）
    D: 右折必須
  answer: C
  explanation: 「付加車線」の標識は、合流を必要とせずに新しい車線が幹線道路に加わることを意味します。ランプ（接続道路）から進入する車両には、専用の新しい車線が用意されています。
  id: 482
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: いかなる時の停車
    B: この区域での駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「駐車禁止（NO PARKING）」標識は、この区域に車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは許可される場合があります。
  id: 483
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転者
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者のために予約された駐車スペースを示しています。有効な障害者用駐車許可証（プラカード）またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 484
