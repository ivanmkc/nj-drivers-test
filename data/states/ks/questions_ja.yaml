  choices:
    A: ヘッドレストが耳より下の首の後ろに当たるように調整する。
    B: ヘッドレストが後頭部に当たり、耳の高さより低くならないように調整する。
    C: 頭とヘッドレストの間に少なくとも3インチの隙間ができるように調整する。
