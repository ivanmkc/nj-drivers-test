  explanation: マニュアルによると、すべてのドライバーにおいて、血中アルコール濃度（BAC）が.02で視力に影響が出ます。
- id: 90
  category: alcohol_drugs_health
  question: 循環器系からアルコールやその他の薬物の組み合わせを取り除くための、医学的に証明された唯一の方法は何ですか？
  choices:
    A: ブラックコーヒーを飲む
