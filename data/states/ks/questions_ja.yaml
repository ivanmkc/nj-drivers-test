- id: 94
  category: penalties_and_points
  question: アルコール違反の初回有罪判決に対する罰則として、考えられるものは次のうちどれですか？
  choices:
    A: 200ドルから400ドルの罰金
    B: 最低48時間の拘留または100時間の社会奉仕活動
    C: 運転免許の永久取り消し
