    C: 45〜60分
    D: 少なくとも2時間
  answer: B
  explanation: マニュアルでは、疲労による事故を防ぐために、安全な駐車場所を見つけて15〜20分間の仮眠をとることを推奨しています。
- id: 84
  category: safe_driving_rules
  question: 運転中の疲労を防ぐための最善の方法は何ですか？
  choices:
    A: コーヒーを2杯飲む
    B: 十分な睡眠をとる
    C: 冷たいシャワーを浴びる
    D: 深夜0時から午前6時の間に運転する
  answer: B
  explanation: マニュアルによると、疲労を防ぐ最善の方法は睡眠です。
- id: 85
  category: defensive_driving
  question: 走行中の車外で起こる可能性のある注意散漫の原因として、適切なものはどれですか？
  choices:
    A: 空調（エアコン）の調整
    B: 子供やペットの世話
    C: 看板やその他の道路広告を読むこと
    D: 全地球測位システム（GPS）の使用
  answer: C
  explanation: マニュアルでは、走行中の車外で起こりうる注意散漫の原因として、看板やその他の道路広告を読むことを挙げています。
- id: 86
  category: driver_responsibility
  question: 運転中に地図を見る必要がある場合、どうすべきですか？
  choices:
    A: 他の車の乗客に道を尋ねる
    B: 安全な駐車場所に停車する
    C: ハンドルの位置まで地図を持ち上げる
    D: 速度を維持しながら素早く目を向ける
  answer: B
  explanation: マニュアルには、「運転中に地図を見る必要がある場合は、安全な駐車場所に停車してください」と記載されています。
- id: 87
  category: defensive_driving
  question: 自分が攻撃的なドライバー（あおり運転など）にならないようにするには、どうすればよいですか？
  choices:
    A: 移動時間を短縮するために、制限速度をわずかに超えて運転する
    B: リラックスし、運転に集中し、移動時間について現実的に考える
    C: 他の車を煽ってスピードを上げさせるために、車間距離を詰めて走行する
    D: イライラさせるドライバーに対して、失礼なジェスチャーで意思表示をする
  answer: B
  explanation: 攻撃的なドライバーにならないために、マニュアルでは、リラックスすること、運転に集中すること、掲示された制限速度を守ること、移動時間について現実的に考えること、そして礼儀正しくすることをアドバイスしています。
- id: 88
  category: alcohol_drugs_health
