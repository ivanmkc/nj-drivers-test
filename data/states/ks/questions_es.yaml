questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima en la que una persona puede solicitar un Permiso
    de Instrucción en Kansas?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: A
  explanation: De acuerdo con el Manual de Conducción de Kansas, una persona puede
    solicitar un Permiso de Instrucción a partir de los 14 años, siempre que cuente
    con el consentimiento de sus padres.
- id: 2
  category: license_system
  question: ¿Cuánto tiempo debe tener un adolescente de Kansas un Permiso de Instrucción
    antes de ser elegible para solicitar una Licencia Restringida?
  choices:
    A: 6 meses
    B: 9 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: La ley de Kansas exige que el titular de un permiso debe mantener el
    Permiso de Instrucción durante al menos un año antes de pasar a la siguiente etapa
    del proceso de Licencia de Conducir Graduada (GDL).
- id: 3
  category: license_system
  question: Para obtener una Licencia Restringida en Kansas, ¿cuántas horas mínimas
    de práctica de conducción supervisada debe documentar un adolescente?
  choices:
    A: 25 horas (5 por la noche)
    B: 40 horas (10 por la noche)
    C: 50 horas (10 por la noche)
    D: 60 horas (20 por la noche)
  answer: C
  explanation: Los requisitos de la GDL de Kansas establecen que un conductor debe
    completar 50 horas de conducción supervisada, de las cuales al menos 10 horas
    deben ser nocturnas, antes de pasar a una licencia restringida o completa.
- id: 4
  category: license_system
  question: Bajo una Licencia Restringida para jóvenes de 15 años en Kansas, ¿dónde
    se le permite al conductor conducir sin supervisión?
  choices:
    A: En cualquier lugar dentro de los límites de la ciudad
    B: Solo hacia y desde la escuela o el trabajo
    C: A cualquier evento social antes de las 9 PM
    D: Solo cuando un adulto con licencia esté en el asiento delantero
  answer: B
  explanation: Un joven de 15 años con una Licencia Restringida puede conducir sin
    supervisión únicamente hacia o desde la escuela (por la ruta más directa con el
    fin de asistir a clases) o hacia y desde el trabajo.
- id: 5
  category: license_system
  question: Durante los primeros seis meses de tener una Licencia Restringida para
    jóvenes de 16 años en Kansas, ¿cuántos pasajeros que no sean familiares inmediatos
    y menores de 18 años se permiten en el vehículo?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante los primeros seis meses de la Licencia Restringida de un joven
    de 16 años, el conductor está limitado a no más de un pasajero menor de 18 años
    que no sea miembro de su familia inmediata.
- id: 6
  category: license_system
  question: ¿Cuál es la restricción de conducción nocturna (toque de queda) para un
    joven de 16 años que tiene una Licencia Restringida en Kansas?
  choices:
    A: 10 PM a 6 AM
    B: 11 PM a 5 AM
    C: 9 PM a 5 AM
    D: Medianoche a 5 AM
  answer: C
  explanation: A los titulares de licencias restringidas de Kansas de 16 años se les
    prohíbe generalmente conducir entre las 9 PM y las 5 AM, con excepciones para
    el trabajo, actividades escolares o emergencias.
- id: 7
  category: license_system
  question: 'Si se muda a una nueva residencia dentro de Kansas, debe notificar a
    la División de Vehículos sobre su cambio de dirección en un plazo de:'
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Kansas exige que todos los conductores notifiquen al DMV
    sobre un cambio de dirección o de nombre en un plazo de 10 días.
- id: 8
  category: license_system
  question: ¿Cuál es la agudeza visual mínima requerida en al menos un ojo para obtener
    una licencia de conducir de Kansas sin restricciones?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/60
  answer: C
  explanation: Para calificar para una licencia de conducir de Kansas, debe tener
    una visión de al menos 20/40 en al menos un ojo, con o sin lentes correctivos.
- id: 9
  category: license_system
  question: 'En Kansas, se considera que un conductor menor de 21 años conduce bajo
    la influencia si su contenido de alcohol en sangre (BAC) es igual o superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Kansas tiene una política de 'Tolerancia Cero' para menores; un BAC
    de 0.02% o superior para cualquier persona menor de 21 años resulta en una suspensión
    automática.
- id: 10
  category: license_system
  question: ¿Cuántas condenas por infracciones de tránsito en movimiento dentro de
    un período de 12 meses resultarán en la suspensión de una licencia de conducir
    de Kansas?
  choices:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
  answer: B
  explanation: Bajo la ley de Kansas, la División de Vehículos está autorizada a suspender
    la licencia de cualquier conductor que sea condenado por tres o más infracciones
    de tránsito en movimiento dentro de un período de 12 meses.
- id: 11
  category: license_system
  question: ¿A qué edad es elegible un conductor de Kansas para una licencia de conducir
    Clase C completa y sin restricciones, siempre que haya cumplido con todos los
    requisitos del sistema de Licencia de Conducir Graduada (GDL)?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: B
  explanation: En Kansas, la licencia Clase C completa y sin restricciones está disponible
    a los 17 años, siempre que el conductor haya tenido una licencia restringida durante
    al menos seis meses y haya completado todas las horas de conducción requeridas.
- id: 12
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que un joven de 14 años obtenga
    un Permiso Agrícola (Farm Permit) en Kansas?
  choices:
    A: Debe vivir o trabajar en una granja de al menos 20 acres.
    B: Solo debe conducir hacia y desde un trabajo relacionado con la granja.
    C: Debe haber completado un curso de seguridad en tractores.
    D: Debe haber tenido un permiso de instrucción durante 2 años.
  answer: A
  explanation: Para ser elegible para un Permiso Agrícola a los 14 años, el solicitante
    debe residir en una parcela agrícola de 20 acres o más, o estar empleado por compensación
    en dicha granja.
- id: 13
  category: license_system
  question: Al renovar una licencia de conducir de Kansas, ¿qué examen es obligatorio
    para todos los conductores?
  choices:
    A: Examen de habilidades en carretera
    B: Examen de conocimientos por escrito
    C: Examen de la vista
    D: Examen de audición
  answer: C
  explanation: Se requiere un examen de la vista cada vez que se renueva una licencia
    de conducir de Kansas para asegurar que el conductor aún cumpla con el requisito
    mínimo de 20/40.
- id: 14
  category: license_system
  question: 'Bajo la ley de ''Consentimiento Implícito'' (Implied Consent) de Kansas,
    si usted se niega a someterse a una prueba química de alcohol o drogas, sus privilegios
    de conducir serán suspendidos automáticamente por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Al conducir en las carreteras de Kansas, usted otorga su 'consentimiento
    implícito' para realizarse pruebas. La negativa a realizarse una prueba de aliento,
    sangre u orina resulta en una suspensión de la licencia por 1 año por la primera
    infracción.
- id: 15
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    para un vehículo motorizado registrado en Kansas?
  choices:
    A: 10/20/10
    B: 25/50/25
    C: 50/100/50
    D: 100/300/100
  answer: B
  explanation: La ley de Kansas exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones corporales de una persona, $50,000 por lesiones corporales
    de dos o más personas y $25,000 por daños a la propiedad (25/50/25).
- id: 16
  category: license_system
  question: En Kansas, ¿cuál es la edad mínima para solicitar una Licencia de Conducir
    Comercial (CDL) para operar un vehículo comercial en el comercio interestatal
    (a través de las fronteras estatales)?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: Aunque Kansas permite que los conductores de 18 a 20 años operen vehículos
    comerciales dentro de los límites del estado (intraestatal), las leyes federales
    y las regulaciones de Kansas requieren que un conductor tenga al menos 21 años
    para el comercio interestatal.
- id: 17
  category: license_system
  question: Para operar una bicicleta motorizada (ciclomotor o moped) en las carreteras
    de Kansas, ¿qué tipo de licencia debe poseer una persona como mínimo?
  choices:
    A: No se requiere licencia para ciclomotores
    B: Una licencia válida Clase C, M o una licencia de Bicicleta Motorizada
    C: Solo una licencia Clase M
    D: Un permiso especial del departamento de policía local
  answer: B
  explanation: La ley de Kansas exige que los operadores de ciclomotores tengan una
    licencia de conducir válida, que puede ser una Clase C estándar, una Clase M de
    motocicleta o una licencia específica para Bicicletas Motorizadas.
- id: 18
  category: license_system
  question: Para un residente de Kansas entre las edades de 21 y 64 años, ¿por cuántos
    años es válida normalmente una licencia de conducir estándar?
  choices:
    A: 4 años
    B: 5 años
    C: 6 años
    D: 8 años
  answer: C
  explanation: En Kansas, las licencias de conducir emitidas a personas entre las
    edades de 21 y 64 años son válidas por un período de 6 años.
- id: 19
  category: license_system
  question: 'Cuando una persona con un Permiso de Instrucción de Kansas está conduciendo,
    el conductor supervisor en el asiento delantero debe tener al menos 21 años y
    tener:'
  choices:
    A: Una licencia válida por al menos un año
    B: Una licencia válida por al menos cinco años
    C: Ningún punto en su historial de conducción
    D: Una Licencia de Conducir Comercial (CDL)
  answer: A
  explanation: Las leyes de GDL de Kansas requieren que el conductor supervisor de
    un titular de un Permiso de Instrucción tenga al menos 21 años y haya tenido una
    licencia de conducir válida durante al menos un año.
- id: 20
  category: license_system
  question: Según la ley de Kansas, un 'Infractor Habitual' (Habitual Violator) es
    alguien que ha sido condenado por ¿cuántas infracciones de conducción graves en
    un período de tres años?
  choices:
    A: '2'
    B: '3'
    C: '5'
    D: '10'
  answer: B
  explanation: Un Infractor Habitual se define en Kansas como una persona que ha sido
    condenada por tres o más infracciones graves específicas (como DUI o conducir
    con la licencia suspendida) en un período de tres años.
- id: 21
  category: license_system
  question: ¿Un titular de un Permiso de Granja (Farm Permit) de Kansas puede conducir
    hacia o desde cualquier trabajo relacionado con la granja, pero para trabajos
    no relacionados con la granja, está restringido a un radio de cuántas millas de
    la granja?
  choices:
    A: 10 millas
    B: 15 millas
    C: 20 millas
    D: 50 millas
  answer: C
  explanation: La ley de Kansas permite a los titulares de un Permiso de Granja conducir
    hacia y desde cualquier trabajo relacionado con la granja, pero están restringidos
    a un radio de 20 millas de la granja para otros fines.
- id: 22
  category: license_system
  question: Para obtener una licencia de Kansas que cumpla con REAL ID, ¿cuál de los
    siguientes se requiere como prueba del Seguro Social?
  choices:
    A: Una declaración verbal del número
    B: Una tarjeta de Seguro Social original o un formulario W-2/1099 que muestre
      el número completo
    C: Una fotocopia de la tarjeta de Seguro Social
    D: Un estado de cuenta de una tarjeta de crédito
  answer: B
  explanation: Los requisitos de REAL ID de Kansas exigen un documento original, como
    una tarjeta de Seguro Social, un formulario W-2 o un formulario 1099 que muestre
    el número completo de Seguro Social.
- id: 23
  category: license_system
  question: ¿Qué clasificación de licencia de conducir de Kansas se requiere específicamente
    para operar una motocicleta?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase M
  answer: D
  explanation: En Kansas, se requiere una licencia o endoso de Clase M para operar
    legalmente una motocicleta en las vías públicas.
- id: 24
  category: license_system
  question: Si una licencia de conducir de Kansas es suspendida por una infracción
    de tránsito no relacionada con el alcohol, ¿cuál es la tarifa estándar de restablecimiento?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: La tarifa estándar de restablecimiento para una licencia de conducir
    de Kansas suspendida por motivos no relacionados con el alcohol es de $100.
- id: 25
  category: license_system
  question: Si se muda a Kansas desde otro estado, ¿dentro de cuántos días después
    de establecer su residencia debe solicitar una licencia de conducir de Kansas?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: D
  explanation: Los nuevos residentes de Kansas tienen 90 días para obtener una licencia
    de conducir de Kansas después de establecer su residencia en el estado.
- id: 26
  category: license_system
  question: Si un conductor de Kansas no pasa el examen de la vista en el DMV, ¿cuál
    es el siguiente paso requerido por la División de Vehículos?
  choices:
    A: Se le prohíbe conducir permanentemente
    B: Debe esperar 24 horas e intentarlo de nuevo
    C: Debe hacer que un especialista de la vista complete un Formulario DL-V y devolverlo
      al DMV
    D: Debe realizar un examen de manejo de inmediato
  answer: C
  explanation: Si no se aprueba el examen de la vista, el solicitante debe llevar
    un Informe de Visión (Formulario DL-V) a un oftalmólogo u optometrista para una
    evaluación profesional.
- id: 27
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un permiso de instrucción para
    motocicletas en Kansas?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '17'
  answer: A
  explanation: En Kansas, una persona puede solicitar un permiso de instrucción para
    motocicletas a partir de los 14 años, siempre que cuente con el consentimiento
    de sus padres.
- id: 28
  category: license_system
  question: 'En Kansas, una primera condena por conducir mientras su licencia está
    suspendida o revocada se clasifica como:'
  choices:
    A: Infracción de tránsito
    B: Delito menor de Clase B contra no personas
    C: Delito grave de Clase A
    D: Solo sanción civil
  answer: B
  explanation: Conducir con la licencia suspendida (DWS) es una ofensa grave en Kansas
    y se clasifica como un delito menor de Clase B contra no personas para la primera
    condena.
- id: 29
  category: license_system
  question: Según la ley del 'Votante Motorizado' (Motor Voter) en Kansas, ¿cuándo
    puede un solicitante registrarse para votar?
  choices:
    A: Solo durante una elección general
    B: Al momento de solicitar o renovar una licencia de conducir
    C: Solo en la oficina del Secretario del Condado
    D: Después de tener una licencia por al menos un año
  answer: B
  explanation: La Ley Nacional de Registro de Votantes (Motor Voter) permite a los
    residentes de Kansas registrarse para votar o actualizar su registro durante el
    proceso de solicitud o renovación de la licencia de conducir.
- id: 30
  category: license_system
  question: 'Cuando se le emite una licencia de conducir de Kansas, usted debe:'
  choices:
    A: Conservar su licencia anterior como respaldo
    B: Entregar todas las demás licencias de conducir que tenga en su poder
    C: Pagar un depósito de seguridad de $500
    D: Registrar su vehículo dentro de las 24 horas
  answer: B
  explanation: La ley de Kansas exige que entregue todas las licencias de conducir
    válidas de otros estados o jurisdicciones cuando se le emite una licencia de Kansas.
- id: 31
  category: driver_testing
  question: ¿En Kansas, cuál es el límite de velocidad predeterminado en caminos sin
    pavimentar o de grava a menos que se indique lo contrario?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: Según el Manual del Conductor de Kansas, el límite de velocidad en
    caminos sin pavimentar o de grava es de 55 mph, a menos que se indique un límite
    diferente.
- id: 32
  category: driver_testing
  question: Al prepararse para girar, ¿la ley de Kansas exige que señalice continuamente
    durante al menos cuántos pies antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: La ley de Kansas (K.S.A. 8-1548) exige que los conductores señalicen
    su intención de girar al menos 100 pies antes de realizar el giro.
- id: 33
  category: driver_testing
  question: Según la ley de Kansas, ¿cuándo es obligatorio el uso de los faros delanteros
    en relación con los limpiaparabrisas?
  choices:
    A: Solo durante tormentas eléctricas intensas
    B: Solo cuando los limpiaparabrisas están en la configuración 'alta'
    C: Siempre que los limpiaparabrisas estén en uso continuo debido a la lluvia,
      nieve o aguanieve
    D: No es obligatorio que los faros delanteros estén vinculados al uso de los limpiaparabrisas
  answer: C
  explanation: La ley de Kansas exige que los faros delanteros se enciendan siempre
    que los limpiaparabrisas estén en uso continuo debido a la lluvia, nieve, aguanieve
    u otras precipitaciones.
- id: 34
  category: driver_testing
  question: En Kansas, ¿es ilegal estacionarse a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Kansas prohíbe estacionar un vehículo a menos de 15 pies
    de un hidrante de incendios.
- id: 35
  category: driver_testing
  question: Si conduce en una carretera de Kansas con al menos dos carriles que viajan
    en la misma dirección y se aproxima a un vehículo de emergencia estacionario con
    luces intermitentes, ¿qué debe hacer?
  choices:
    A: Mantener la velocidad pero cambiarse al carril izquierdo
    B: Detenerse inmediatamente en su carril
    C: Cambiarse al carril más alejado del vehículo de emergencia si es seguro hacerlo,
      o reducir la velocidad
    D: Aumentar la velocidad para pasar el vehículo rápidamente
  answer: C
  explanation: La ley de 'Hacerse a un lado' (Move Over) de Kansas exige que los conductores
    se muevan a un carril que no sea adyacente al vehículo de emergencia estacionario
    si es posible; si no es seguro, el conductor debe reducir la velocidad y proceder
    con precaución.
- id: 36
  category: driver_testing
  question: Para una primera condena por DUI (conducir bajo la influencia) en Kansas,
    ¿cuál es la multa mínima (excluyendo los costos judiciales)?
  choices:
    A: '250'
    B: '500'
    C: '750'
    D: '1500'
  answer: C
  explanation: Para una primera condena por DUI en Kansas, la multa oscila entre un
    mínimo de $750 y un máximo de $1,000, además de los costos judiciales y otros
    cargos.
- id: 37
  category: driver_testing
  question: Según el Manual del Conductor de Kansas, ¿cuál es la distancia de seguimiento
    recomendada detrás del vehículo que está frente a usted bajo condiciones ideales?
  choices:
    A: La longitud de un automóvil
    B: Dos segundos
    C: Cuatro segundos
    D: 50 pies
  answer: B
  explanation: El Manual del Conductor de Kansas recomienda utilizar la 'regla de
    los dos segundos' para mantener una distancia de seguimiento segura en condiciones
    normales de conducción.
- id: 38
  category: driver_testing
  question: En Kansas, ¿un niño debe estar asegurado en un asiento elevador (booster
    seat) apropiado hasta que alcance qué edad o tamaño?
  choices:
    A: 6 años de edad o 60 libras
    B: 8 años de edad, u 80 libras, o 4'9" de estatura
    C: 10 años de edad o 100 libras
    D: 12 años de edad o 5 pies de estatura
  answer: B
  explanation: La ley de Kansas exige que los niños de 4 a 7 años de edad utilicen
    un asiento elevador (booster seat) a menos que el niño pese más de 80 libras o
    mida más de 4'9".
- id: 39
  category: driver_testing
  question: Al rebasar una bicicleta en Kansas, ¿cuál es la distancia mínima que un
    automovilista debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La ley de Kansas (K.S.A. 8-1516) exige que los automovilistas rebasen
    una bicicleta con una distancia no menor a tres pies.
- id: 40
  category: driver_testing
  question: Si reprueba el examen de conducción (prueba de manejo) de Kansas, ¿cuánto
    tiempo debe esperar antes de ser elegible para volver a tomarlo?
  choices:
    A: 24 horas
    B: Hasta el siguiente día hábil
    C: Una semana
    D: 30 días
  answer: B
  explanation: Si un solicitante reprueba el examen de habilidades de conducción,
    debe esperar al menos hasta el siguiente día hábil para volver a realizar el examen.
- id: 41
  category: driver_testing
  question: ¿Al estacionar un vehículo cuesta arriba en una calle de doble sentido
    con bordillo (curb), hacia dónde deben girarse las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: A la derecha
  answer: B
  explanation: Al estacionar cuesta arriba contra un bordillo, gire las ruedas en
    dirección contraria al bordillo para que, si el vehículo rueda, la parte trasera
    de la llanta delantera golpee el bordillo y detenga el auto.
- id: 42
  category: driver_testing
  question: En Kansas, ¿a cuántos pies de un vehículo que viene en sentido contrario
    debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Kansas exige que los conductores usen las luces bajas al
    acercarse a un vehículo en sentido contrario a una distancia de 500 pies.
- id: 43
  category: driver_testing
  question: ¿Dentro de cuántos días deben registrar sus vehículos los nuevos residentes
    de Kansas después de establecer su residencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Los nuevos residentes de Kansas deben registrar sus vehículos dentro
    de los 90 días posteriores al establecimiento de su residencia en el estado.
- id: 44
  category: driver_testing
  question: Al acercarse a un autobús escolar que está detenido con sus luces rojas
    intermitentes y el brazo de parada extendido en una carretera que NO es una autopista
    dividida, ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se aproxima por delante
    C: El tráfico de ambas direcciones
    D: Nadie, si hay al menos tres carriles
  answer: C
  explanation: En cualquier carretera que no sea una autopista dividida, el tráfico
    de ambas direcciones debe detenerse ante un autobús escolar con luces rojas intermitentes
    y un brazo de parada extendido.
- id: 45
  category: driver_testing
  question: 'Según el Manual del Conductor de Kansas, el hidroplaneo (hydroplaning,
    donde las llantas pierden contacto con la carretera en superficies mojadas) puede
    comenzar a velocidades tan bajas como:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El Manual del Conductor de Kansas establece que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph en condiciones de lluvia intensa.
- id: 46
  category: driver_testing
  question: En Kansas, ¿cuál es el límite de velocidad máximo en un distrito residencial
    a menos que se indique lo contrario?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Según el Estatuto de Kansas 8-1558, el límite de velocidad en cualquier
    distrito residencial es de 30 millas por hora a menos que se indique lo contrario.
    Los distritos comerciales suelen ser de 20 millas por hora.
- id: 47
  category: driver_testing
  question: Cuando pretenda girar o cambiar de carril en Kansas, ¿con cuántos pies
    de antelación, como mínimo, debe activar su señal de giro antes de la maniobra?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Kansas exige que los conductores indiquen su intención de
    girar o cambiar de carril de forma continua durante al menos 100 pies antes del
    giro o movimiento.
- id: 48
  category: driver_testing
  question: En Kansas, ¿cuándo es obligatorio tener los faros encendidos en relación
    con las condiciones climáticas?
  choices:
    A: Solo cuando la visibilidad es inferior a 200 pies
    B: Solo entre la puesta del sol y el amanecer
    C: Siempre que los limpiaparabrisas estén en uso continuo
    D: Solo durante niebla intensa o nieve
  answer: C
  explanation: La ley de Kansas exige el uso de faros cuando los limpiaparabrisas
    están en uso continuo debido a la lluvia, la nieve o el aguanieve, o cuando la
    visibilidad es inferior a 1,000 pies.
- id: 49
  category: driver_testing
  question: 'La ley ''Move Over'' (Moverse de carril) de Kansas exige que los conductores
    que se acerquen a un vehículo de emergencia estacionado con luces intermitentes
    deben:'
  choices:
    A: Detenerse por completo hasta que se les indique pasar
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Moverse a un carril que no sea adyacente al vehículo, si es seguro hacerlo
    D: Acelerar para despejar el área rápidamente
  answer: C
  explanation: La ley Move Over de Kansas (Estatuto 8-1530) exige que los conductores
    en autopistas de varios carriles dejen libre el carril más cercano a los vehículos
    de emergencia o de mantenimiento estacionados, o que reduzcan la velocidad significativamente
    si un cambio de carril no es seguro.
- id: 50
  category: driver_testing
  question: Según la Ley de Seguridad de Niños Pasajeros de Kansas, ¿los niños de
    qué rango de edad deben estar protegidos por un asiento elevado (booster seat)
    a menos que midan 4'9" de altura o pesen 80 libras?
  choices:
    A: De 2 a 5 años
    B: De 4 a 7 años
    C: De 6 a 10 años
    D: De 5 a 12 años
  answer: B
  explanation: La ley de Kansas exige que los niños de 4 a 7 años utilicen un asiento
    elevado (booster seat) a menos que pesen más de 80 libras o midan más de 4 pies
    y 9 pulgadas.
- id: 51
  category: driver_testing
  question: ¿Qué regla recomienda el Manual de Conducción de Kansas para mantener
    una distancia de seguimiento segura detrás del vehículo que va delante de usted?
  choices:
    A: La regla de la longitud de un vehículo
    B: La regla de los dos segundos
    C: La regla de los cuatro segundos
    D: La regla de los diez pies
  answer: B
  explanation: El Manual de Conducción de Kansas recomienda la 'regla de los dos segundos'
    para las distancias de seguimiento estándar bajo condiciones de conducción ideales.
- id: 52
  category: driver_testing
  question: 'Para los conductores de 21 años o más en Kansas, es ilegal operar un
    vehículo motorizado con un Contenido de Alcohol en la Sangre (BAC) de:'
  choices:
    A: 0.02% o superior
    B: 0.05% o superior
    C: 0.08% o superior
    D: 0.10% o superior
  answer: C
  explanation: En Kansas, el límite legal de Contenido de Alcohol en la Sangre (BAC)
    para conductores de 21 años de edad o más es de 0.08%.
- id: 53
  category: driver_testing
  question: En Kansas, ¿a cuántos pies de una señal de alto, una baliza intermitente
    o una señal de ceda el paso no se permite estacionar su vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El Estatuto de Kansas 8-1571 establece que no se puede estacionar a
    menos de 30 pies de cualquier señal intermitente, señal de alto, señal de ceda
    el paso o señal de control de tráfico ubicada al costado de la calzada.
- id: 54
  category: driver_testing
  question: Al estacionar cerca de una intersección en Kansas, ¿cuál es la distancia
    mínima que debe mantener con respecto a un cruce peatonal?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: La ley de Kansas prohíbe estacionar un vehículo a menos de 20 pies
    de un cruce peatonal en una intersección.
- id: 55
  category: driver_testing
  question: ¿Cuál es el rango de la multa por una condena de DUI (conducir bajo la
    influencia) por primera vez en el estado de Kansas?
  choices:
    A: $250 a $500
    B: $500 a $750
    C: $750 a $1,000
    D: $1,000 a $2,500
  answer: C
  explanation: Para una primera condena por DUI en Kansas, el tribunal impone una
    multa que oscila entre $750 y $1,000, además de otras sanciones como tiempo en
    la cárcel o servicio comunitario.
- id: 56
  category: driver_testing
  question: 'Cuando sigue a otro vehículo por detrás por la noche en Kansas, debe
    atenuar sus luces altas cuando se encuentre a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Kansas exige que los conductores atenúen sus luces altas
    al acercarse a otro vehículo por la parte trasera a menos de 300 pies.
- id: 57
  category: driver_testing
  question: Para aprobar el examen escrito de conocimientos de Kansas, ¿qué porcentaje
    de las preguntas debe responder correctamente el solicitante como mínimo?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: El examen escrito de Kansas consta de 25 preguntas, y los solicitantes
    deben lograr una puntuación de al menos el 80% (20 respuestas correctas) para
    aprobar.
- id: 58
  category: driver_testing
  question: Al presentarse para la prueba de habilidades de conducción (examen práctico)
    de Kansas, ¿cuál de los siguientes requisitos debe proporcionar para el vehículo
    de la prueba?
  choices:
    A: Comprobante de un cambio de aceite reciente
    B: Una carta notariada del propietario del vehículo
    C: Comprobante de registro válido y seguro vigente
    D: El título original del vehículo
  answer: C
  explanation: Para realizar el examen práctico de Kansas, el solicitante debe proporcionar
    un vehículo que esté en condiciones seguras de funcionamiento y presentar un comprobante
    de registro válido y un seguro de responsabilidad civil vigente para dicho vehículo.
- id: 59
  category: driver_responsibility
  question: 'En Kansas, si se ve involucrado en un accidente de vehículo motorizado
    que resulte en daños a la propiedad, debe informarlo a la policía de inmediato
    si el daño parece ser de al menos:'
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,500
  answer: C
  explanation: Según el Manual de Conducción de Kansas, cualquier accidente que resulte
    en muerte, lesiones personales o daños totales a la propiedad de $1,000 o más
    debe informarse a la agencia de aplicación de la ley más cercana.
- id: 60
  category: driver_responsibility
  question: Kansas es un estado de seguro 'sin culpa' (No-Fault). Esto significa que
    cada póliza de responsabilidad civil de vehículos motorizados debe incluir ¿cuál
    de las siguientes coberturas para pagar sus propios gastos médicos?
  choices:
    A: Cobertura Integral (Comprehensive)
    B: Protección contra Lesiones Personales (PIP)
    C: Cobertura de Colisión
    D: Seguro Gap
  answer: B
  explanation: La ley de Kansas exige la cobertura de Protección contra Lesiones Personales
    (PIP), que paga los gastos médicos, la pérdida de salarios y otros costos de la
    persona asegurada, independientemente de quién haya tenido la culpa en el accidente.
- id: 61
  category: driver_responsibility
  question: Cuando vende un vehículo en Kansas, ¿qué debe hacer con la placa (matrícula)?
  choices:
    A: Dejarla en el vehículo para el nuevo propietario.
    B: Quitarla y conservarla para su próximo vehículo o entregarla.
    C: Destruirla inmediatamente.
    D: Entregarla al departamento de policía local.
  answer: B
  explanation: En Kansas, las placas pertenecen al propietario, no al vehículo. Cuando
    se vende un vehículo, el vendedor debe quitar la placa y puede transferirla a
    otro vehículo o devolverla al tesorero del condado.
- id: 62
  category: driver_responsibility
  question: ¿Cuántos días tiene un nuevo residente de Kansas para registrar su vehículo
    y obtener las placas de Kansas?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Según la ley de Kansas, una persona se considera residente a efectos
    del registro de vehículos si vive en el estado durante 90 días o más.
- id: 63
  category: driver_responsibility
  question: Para una primera condena por DUI en Kansas (BAC de .08 o superior), ¿cuál
    es el período mínimo obligatorio de suspensión de la licencia antes de que comiencen
    las restricciones del dispositivo de interbloqueo de encendido (ignition interlock)?
  choices:
    A: 10 días
    B: 30 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: Para una primera incidencia de DUI, la ley de Kansas exige una suspensión
    de 30 días de los privilegios de conducir, seguida de un período de conducción
    únicamente con un dispositivo de interbloqueo de encendido (generalmente 180 días
    o 1 año, dependiendo del nivel de BAC).
- id: 64
  category: driver_responsibility
  question: Si lo sorprenden conduciendo sin el seguro de responsabilidad civil obligatorio
    para vehículos motorizados en Kansas, ¿cuál es la multa máxima por una primera
    infracción?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Conducir sin seguro en Kansas es un delito menor de Clase B. Para una
    primera infracción, la multa oscila entre $300 y $1,000, y el conductor podría
    enfrentar hasta seis meses de cárcel.
- id: 65
  category: driver_responsibility
  question: 'En Kansas, los meses de renovación del registro del vehículo se determinan
    por:'
  choices:
    A: El mes de nacimiento del propietario.
    B: El mes en que se compró el vehículo.
    C: La primera letra del apellido del propietario.
    D: El año del modelo del vehículo.
  answer: C
  explanation: Kansas utiliza un sistema de registro escalonado donde el mes de renovación
    se determina por la primera letra del apellido del propietario (por ejemplo, la
    'A' es febrero, la 'B' es marzo, etc.).
- id: 66
  category: driver_responsibility
  question: 'Según la Ley de Seguridad de Pasajeros Niños de Kansas, los niños deben
    estar asegurados en un asiento de seguridad para niños o un asiento elevado (booster)
    aprobado por el gobierno federal hasta que tengan:'
  choices:
    A: 6 años de edad o 60 libras.
    B: 8 años de edad u 80 libras o 4'9" de estatura.
    C: 10 años de edad.
    D: 12 años de edad.
  answer: B
  explanation: La ley de Kansas exige que los niños menores de 4 años viajen en un
    asiento de seguridad para niños, y los niños de 4 a 7 años deben viajar en un
    asiento elevado (booster) a menos que pesen más de 80 libras o midan más de 4'9".
- id: 67
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por una primera condena por arrojar basura desde
    un vehículo motorizado en las autopistas de Kansas?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $5,000
  answer: C
  explanation: Arrojar basura es ilegal en Kansas. Una primera condena puede resultar
    en una multa de hasta $1,000 y la posibilidad de ser obligado a recoger basura.
- id: 68
  category: driver_responsibility
  question: 'En Kansas, si es condenado por exceso de velocidad en una zona de construcción
    o mantenimiento de carreteras donde hay trabajadores presentes, la multa se:'
  choices:
    A: Incrementa en $50.
    B: Duplica.
    C: Triplica.
    D: Mantiene igual, pero los puntos se duplican.
  answer: B
  explanation: La ley de Kansas (K.S.A. 8-1560d) estipula que las multas por infracciones
    de exceso de velocidad se duplican si la infracción ocurre dentro de una zona
    de construcción o mantenimiento de carreteras cuando hay trabajadores presentes.
- id: 69
  category: driver_responsibility
  question: Si su licencia de conducir de Kansas es suspendida por un motivo no relacionado
    con el alcohol, ¿cuál es la tarifa estándar de restitución que debe pagar para
    recuperarla?
  choices:
    A: $25
    B: $50
    C: $100
    D: $400
  answer: C
  explanation: Para la mayoría de las suspensiones no relacionadas con el alcohol,
    Kansas requiere una tarifa de restitución de $100. Las suspensiones relacionadas
    con el alcohol conllevan una tarifa significativamente más alta (hasta $1,000).
- id: 70
  category: driver_responsibility
  question: 'Según la ley de Kansas, es ilegal transportar un contenedor abierto de
    una bebida alcohólica en el área de pasajeros de un vehículo. Esta ley se aplica
    a:'
  choices:
    A: Solo el conductor.
    B: Solo los pasajeros.
    C: Tanto el conductor como los pasajeros.
    D: Solo conductores menores de 21 años.
  answer: C
  explanation: La ley de Kansas prohíbe tanto a los conductores como a los pasajeros
    poseer un contenedor abierto de alcohol en el compartimiento de pasajeros de un
    vehículo en una autopista o calle pública.
- id: 71
  category: driver_responsibility
  question: 'Si usted se ve involucrado en un accidente con un vehículo estacionado
    y no puede encontrar al propietario, la ley de Kansas le exige:'
  choices:
    A: Esperar al menos dos horas a que regrese el propietario.
    B: Dejar una nota con su nombre, dirección y número de registro, y notificar a
      las autoridades.
    C: Retirarse si el daño es inferior a $500.
    D: Informarlo solo si el otro vehículo es un auto de lujo.
  answer: B
  explanation: Si choca contra un vehículo desatendido, debe detenerse y encontrar
    al propietario o dejar un aviso por escrito en un lugar visible del vehículo,
    y luego reportar el accidente a la policía.
- id: 72
  category: driver_responsibility
  question: En Kansas, ¿cuál es el nivel mínimo de contenido de alcohol en sangre
    (BAC) para que un conductor de un vehículo motorizado comercial sea considerado
    'bajo la influencia'?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Si bien el límite legal para los conductores estándar en Kansas es
    del 0.08%, el límite para los conductores comerciales (titulares de CDL) que operan
    un vehículo comercial es del 0.04%.
- id: 73
  category: driver_responsibility
  question: 'Si un conductor de Kansas es condenado por no ceder el paso a un vehículo
    de emergencia (Ley Move Over), la multa base es aproximadamente de:'
  choices:
    A: $50
    B: $100
    C: $195
    D: $500
  answer: C
  explanation: La ley de Kansas exige que los conductores se muevan de carril o reduzcan
    la velocidad ante los vehículos de emergencia. La multa legal por no ceder el
    paso a un vehículo de emergencia es de $195 más las costas judiciales.
- id: 74
  category: driver_responsibility
  question: 'Kansas es un estado de seguro ''sin culpa'' (no-fault). Esto significa
    que cada póliza de responsabilidad civil debe incluir Protección contra Lesiones
    Personales (PIP) para cubrir:'
  choices:
    A: Daños únicamente al vehículo del otro conductor
    B: Robo del vehículo
    C: Gastos médicos para usted y sus pasajeros, independientemente de quién haya
      causado el accidente
    D: Daños causados por desastres naturales
  answer: C
  explanation: La ley de Kansas exige la Protección contra Lesiones Personales (PIP)
    como parte del sistema sin culpa, la cual paga los gastos médicos, la rehabilitación
    y la pérdida de salarios de la persona asegurada y sus pasajeros, independientemente
    de la culpa.
- id: 75
  category: driver_responsibility
  question: Después de comprar un vehículo a un particular (venta privada) en Kansas,
    ¿cuántos días tiene para titular y registrar el vehículo?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: D
  explanation: En Kansas, tiene 60 días a partir de la fecha de compra para titular
    y registrar un vehículo. Durante este tiempo, debe llevar el título firmado o
    una factura de venta en el vehículo.
- id: 76
  category: driver_responsibility
  question: Según la Ley de Uso del Cinturón de Seguridad de Kansas, ¿cuál es la multa
    para un pasajero adulto (de 18 años o más) en el asiento delantero que no lleve
    puesto el cinturón de seguridad?
  choices:
    A: $10
    B: $30
    C: $60
    D: $100
  answer: B
  explanation: La multa por una infracción del cinturón de seguridad para un adulto
    (18+) en Kansas es de $30. Esta es una ley de cumplimiento estándar.
- id: 77
  category: driver_responsibility
  question: 'En Kansas, arrojar basura desde un vehículo motorizado es un delito.
    Una persona condenada por arrojar basura puede ser multada con hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Arrojar basura es un delito menor de Clase C en Kansas, y una condena
    puede resultar en una multa de hasta $1,000 y/o una pena de cárcel.
- id: 78
  category: driver_responsibility
  question: Si se le suspenden sus privilegios de conducir en Kansas por no mantener
    el seguro por primera vez, ¿cuál es la tarifa de restablecimiento?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: Para restablecer una licencia suspendida por falta de seguro en Kansas,
    el conductor debe pagar una tarifa de restablecimiento de $100 y presentar una
    prueba de responsabilidad financiera (SR-22).
- id: 79
  category: driver_responsibility
  question: 'Si cambia su nombre (por ejemplo, debido a matrimonio o una orden judicial),
    debe notificar a la División de Vehículos de Kansas dentro de:'
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Kansas exige que los conductores notifiquen a la División
    de Vehículos dentro de los 10 días posteriores a un cambio de nombre y obtengan
    una licencia corregida.
- id: 80
  category: driver_responsibility
  question: ¿Cuál es la multa por una primera condena por violar la ley de Kansas
    contra 'enviar mensajes de texto mientras se conduce'?
  choices:
    A: $30
    B: $60
    C: $150
    D: $250
  answer: B
  explanation: La multa por una infracción de enviar mensajes de texto mientras se
    conduce en Kansas es de $60, más las costas judiciales correspondientes.
- id: 81
  category: driver_responsibility
  question: 'Al acercarse a un vehículo de emergencia o de mantenimiento estacionado
    con luces intermitentes en una autopista de Kansas con al menos dos carriles en
    la misma dirección, usted debe:'
  choices:
    A: Mantener la velocidad pero moverse al carril izquierdo
    B: Detenerse por completo hasta que el vehículo se mueva
    C: Moverse al carril más alejado del vehículo o reducir la velocidad si cambiar
      de carril no es seguro
    D: Acelerar para rebasar el vehículo rápidamente
  answer: C
  explanation: La ley "Move Over" de Kansas exige que los conductores se muevan a
    un carril que no esté adyacente al vehículo de emergencia o mantenimiento estacionado,
    o que reduzcan la velocidad significativamente si no es posible cambiar de carril.
- id: 82
  category: driver_responsibility
  question: 'Si usted está involucrado en un accidente en Kansas, está legalmente
    obligado a proporcionar su nombre, dirección y número de registro del vehículo
    a:'
  choices:
    A: Solo al oficial de policía en la escena
    B: Cualquier persona herida o al propietario de cualquier propiedad dañada en
      el accidente
    C: Solo a su agente de seguros
    D: A nadie hasta que hable con un abogado
  answer: B
  explanation: La ley de Kansas exige que los conductores involucrados en un accidente
    proporcionen su información a cualquier persona herida y al propietario de cualquier
    propiedad o vehículo dañado.
- id: 83
  category: driver_responsibility
  question: Si su licencia es suspendida por una primera infracción de seguro, ¿por
    cuánto tiempo debe mantener una presentación de SR-22 (responsabilidad financiera)
    ante el estado de Kansas?
  choices:
    A: 6 meses
    B: 12 meses
    C: 24 meses
    D: 36 meses
  answer: B
  explanation: En Kansas, para una primera suspensión por falta de seguro, generalmente
    se requiere que el conductor mantenga una presentación de SR-22 durante 12 meses
    continuos.
- id: 84
  category: safe_driving_rules
  question: Según la ley de Kansas, ¿con cuántos pies de antelación debe señalizar
    su intención de girar antes del giro real?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Kansas exige que los conductores usen una señal de giro continuamente
    durante al menos 100 pies antes de realizar un giro o cambiar de carril.
- id: 85
  category: safe_driving_rules
  question: Al estacionar cerca de una intersección, ¿a cuántos pies de distancia
    debe estar como mínimo de una señal de alto, una baliza intermitente o una señal
    de control de tráfico?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Kansas prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico ubicada al costado
    de una calzada.
- id: 86
  category: safe_driving_rules
  question: En Kansas, ¿no puede rebasar a otro vehículo cuando se encuentre a cuántos
    pies de una intersección o un cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: En Kansas, está prohibido rebasar al acercarse a menos de 100 pies
    de, o al atravesar, cualquier intersección o cruce de ferrocarril.
- id: 87
  category: safe_driving_rules
  question: 'La ley de Kansas exige que los faros delanteros estén encendidos cuando
    la visibilidad se reduce a menos de:'
  choices:
    A: 500 pies
    B: 800 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Los faros delanteros deben usarse en Kansas siempre que no pueda ver
    claramente otros vehículos u objetos a una distancia de 1,000 pies.
- id: 88
  category: safe_driving_rules
  question: En una autopista de Kansas dividida por una mediana o barrera física,
    ¿debe detenerse ante un autobús escolar con luces rojas intermitentes que se aproxima
    en la dirección opuesta?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar.
    B: No, no es necesario detenerse si viaja en la dirección opuesta en una autopista
      dividida.
    C: Sí, pero solo si el conductor del autobús le indica que se detenga.
    D: No, pero debe reducir la velocidad a 15 mph.
  answer: B
  explanation: En Kansas, los conductores en una autopista con calzadas separadas
    (divididas por una mediana o barrera) no necesitan detenerse ante un autobús escolar
    que viaja en la dirección opuesta.
- id: 89
  category: safe_driving_rules
  question: ¿Qué sucede con las multas de tráfico en Kansas cuando ocurre una infracción
    en una zona de construcción o mantenimiento donde hay trabajadores presentes?
  choices:
    A: La multa aumenta en $50.
    B: La multa se duplica.
    C: La multa se triplica.
    D: La licencia del conductor se suspende automáticamente.
  answer: B
  explanation: La ley de Kansas ordena que las multas por infracciones de tráfico
    se dupliquen en las zonas de construcción o mantenimiento cuando hay trabajadores
    presentes.
- id: 90
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad predeterminado
    en cualquier "distrito urbano" en Kansas?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Según K.S.A. 8-1558, el límite de velocidad en cualquier distrito urbano
    es de 30 mph, a menos que se indique lo contrario.
- id: 91
  category: safe_driving_rules
  question: De acuerdo con la ley de 'Hacerse a un lado' (Move Over) de Kansas, ¿qué
    debe hacer al acercarse a un vehículo de emergencia estacionado con sus luces
    intermitentes encendidas?
  choices:
    A: Detenerse inmediatamente en la calzada.
    B: Mantener la velocidad pero tocar la bocina.
    C: Cambiarse a un carril que no sea adyacente al vehículo, o reducir la velocidad
      si cambiar de carril no es seguro.
    D: Aumentar la velocidad para pasar el vehículo lo más rápido posible.
  answer: C
  explanation: La ley de Kansas exige que los conductores se muevan a un carril que
    no sea adyacente a un vehículo de emergencia estacionado o que reduzcan la velocidad
    y procedan con precaución si no es posible cambiar de carril.
- id: 92
  category: safe_driving_rules
  question: 'En Kansas, se requiere que encienda sus faros delanteros siempre que
    use sus limpiaparabrisas de forma continua debido a:'
  choices:
    A: Lluvia, nieve o aguanieve
    B: Limpiar el parabrisas
    C: Solo tormentas de polvo
    D: Solo niebla
  answer: A
  explanation: La ley de Kansas exige el uso de faros delanteros cuando los limpiaparabrisas
    están en uso continuo debido a la lluvia, nieve, aguanieve u otras precipitaciones.
- id: 93
  category: safe_driving_rules
  question: 'En Kansas, usted NO tiene que detenerse ante un autobús escolar con luces
    rojas intermitentes si:'
  choices:
    A: El autobús está en el lado opuesto de una carretera dividida por una mediana
      o barrera.
    B: El autobús está detenido en una zona escolar.
    C: Usted viaja en la misma dirección en una carretera de cuatro carriles.
    D: El conductor del autobús le hace señas para que pase.
  answer: A
  explanation: Los conductores no están obligados a detenerse ante un autobús escolar
    si viajan en la dirección opuesta en una carretera dividida con una mediana o
    barrera física.
- id: 94
  category: safe_driving_rules
  question: 'Para mantener una distancia de seguimiento segura bajo condiciones normales
    de conducción en Kansas, debe usar la:'
  choices:
    A: Regla de un segundo
    B: Regla de dos segundos
    C: Regla de cinco segundos
    D: Regla de diez segundos
  answer: B
  explanation: El Manual de Conducción de Kansas recomienda una distancia de seguimiento
    mínima de al menos dos segundos detrás del vehículo que va delante de usted.
- id: 95
  category: safe_driving_rules
  question: 'Al entrar en una rotonda en Kansas, debe ceder el derecho de paso a:'
  choices:
    A: El tráfico que entra por la derecha.
    B: El tráfico que ya está en el círculo.
    C: A nadie; usted tiene el derecho de paso al entrar.
    D: Solo a los vehículos de emergencia.
  answer: B
  explanation: En las rotondas de Kansas, el tráfico que entra debe ceder el derecho
    de paso a los vehículos que ya están circulando dentro de la rotonda.
- id: 96
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar en el último minuto en el tráfico
    de Kansas, ¿con cuánta anticipación debe observar el camino?
  choices:
    A: 5 segundos
    B: 12 segundos
    C: 20 segundos
    D: 30 segundos
  answer: B
  explanation: Las pautas de conducción defensiva de Kansas sugieren observar el camino
    con al menos 12 segundos de anticipación para identificar posibles peligros temprano
    y permitir tiempo para reacciones seguras.
- id: 97
  category: defensive_driving
  question: 'En Kansas, la ley le exige usar sus faros delanteros siempre que esté
    usando sus:'
  choices:
    A: Señales de giro
    B: Luces de emergencia (hazard lights)
    C: Limpiaparabrisas
    D: Control de crucero (cruise control)
  answer: C
  explanation: La ley de Kansas exige que los conductores activen sus faros delanteros
    siempre que los limpiaparabrisas estén en uso continuo debido a la lluvia, nieve
    o aguanieve.
- id: 98
  category: defensive_driving
  question: 'En Kansas, los faros delanteros deben encenderse desde el atardecer hasta
    el amanecer y siempre que la visibilidad sea inferior a:'
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: B
  explanation: La ley de Kansas estipula que los faros delanteros deben usarse desde
    el atardecer hasta el amanecer y en cualquier otro momento en que la visibilidad
    se reduzca a 1,000 pies o menos.
- id: 99
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a ocurrir el hidroplaneo (donde los neumáticos
    pierden contacto con la carretera y se deslizan sobre una capa de agua) en las
    carreteras mojadas de Kansas?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una lluvia intensa, sus neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 100
  category: defensive_driving
  question: Al conducir con niebla densa en Kansas, ¿qué luces debe usar para garantizar
    la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces intermitentes de emergencia
  answer: B
  explanation: Se deben usar las luces bajas en la niebla. Las luces altas se reflejan
    en las partículas de niebla y crean un resplandor que dificulta la visión.
- id: 101
  category: defensive_driving
  question: 'Si su vehículo comienza a derrapar en una carretera helada de Kansas,
    la respuesta correcta de conducción defensiva es:'
  choices:
    A: Pisar los frenos a fondo inmediatamente
    B: Girar el volante en la dirección opuesta al derrape
    C: Girar el volante en la dirección en la que la parte trasera del vehículo está
      derrapando
    D: Poner el auto en punto muerto (neutral) y apagar el motor
  answer: C
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que la parte trasera del vehículo está
    derrapando.
- id: 102
  category: defensive_driving
  question: Al acercarse a un cruce de ferrocarril en Kansas con una señal de alto
    o una señal eléctrica, ¿a cuántos pies del riel más cercano debe detener su vehículo?
  choices:
    A: 5 a 10 pies
    B: 10 a 25 pies
    C: 15 a 50 pies
    D: 50 a 100 pies
  answer: C
  explanation: La ley de Kansas exige que los conductores se detengan entre 15 y 50
    pies del riel más cercano en un cruce de ferrocarril cuando las señales están
    parpadeando o hay una señal de alto presente.
- id: 103
  category: defensive_driving
  question: 'Para revisar correctamente su ''punto ciego'' antes de cambiar de carril
    en una autopista de Kansas, usted debe:'
  choices:
    A: Revisar su espejo retrovisor
    B: Revisar su espejo lateral
    C: Girar la cabeza y mirar por encima del hombro en la dirección del movimiento
    D: Tocar la bocina para ver si alguien reacciona
  answer: C
  explanation: Los espejos no lo muestran todo. Debe girar la cabeza y mirar por encima
    del hombro para revisar las áreas (puntos ciegos) que los espejos no pueden ver
    antes de cambiar de carril.
- id: 104
  category: defensive_driving
  question: Al estacionar un vehículo cuesta arriba en una calle de doble sentido
    con acera (bordillo) en Kansas, ¿cómo debe posicionar las ruedas delanteras?
  choices:
    A: Giradas hacia la acera
    B: Giradas en dirección contraria a la acera
    C: Paralelas a la acera
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba contra una acera, gire las ruedas en dirección
    contraria a la acera (hacia la izquierda) para que, si el vehículo rueda, la parte
    trasera de la llanta delantera golpee la acera y detenga el auto.
- id: 105
  category: defensive_driving
  question: En Kansas, ¿a qué velocidad puede comenzar a ocurrir el hidroplaneo (hydroplaning),
    haciendo que los neumáticos pierdan contacto con la superficie de la carretera
    durante una lluvia intensa?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: En Kansas, el hidroplaneo puede comenzar a velocidades tan bajas como
    35 mph. Al alcanzar las 50 mph, los neumáticos pueden perder todo contacto con
    la carretera si el agua es lo suficientemente profunda.
- id: 106
  category: defensive_driving
  question: Según la ley de Kansas, ¿quién está obligado a usar el cinturón de seguridad
    en un vehículo de pasajeros donde el conductor tiene 18 años de edad o más?
  choices:
    A: Solo el conductor
    B: Solo el conductor y el pasajero del asiento delantero
    C: Solo los pasajeros menores de 14 años
    D: El conductor y todos los pasajeros
  answer: D
  explanation: La ley de Kansas exige que el conductor y todos los ocupantes de un
    vehículo de pasajeros estén debidamente sujetos por un cinturón de seguridad o
    un asiento de seguridad para niños.
- id: 107
  category: defensive_driving
  question: Al compartir la carretera con camiones grandes en Kansas, ¿qué es la 'Zona
    No' (No-Zone)?
  choices:
    A: El área donde no se permite conducir a los camiones
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: El carril rápido en la interestatal
    D: El área directamente frente a una estación de pesaje
  answer: B
  explanation: La 'Zona No' (No-Zone) se refiere a los grandes puntos ciegos alrededor
    de un camión donde el conductor del camión no puede ver su vehículo. Si no puede
    ver los espejos del conductor del camión, él no puede verlo a usted.
- id: 108
  category: defensive_driving
  question: 'En Kansas, es ilegal seguir a un aparato de bomberos (camión de bomberos)
    que responde a una alarma a una distancia menor de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Kansas prohíbe seguir a cualquier aparato de bomberos que
    viaje en respuesta a una alarma de incendio a una distancia menor de 500 pies.
- id: 109
  category: alcohol_drugs_health
  question: En Kansas, ¿cuál es el límite legal máximo de contenido de alcohol en
    sangre (BAC) para un conductor que opera un vehículo motorizado comercial?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.04%
    D: 0.02%
  answer: C
  explanation: Según la ley de Kansas y las regulaciones federales, el límite de BAC
    para los conductores comerciales es del 0.04%. Cualquier nivel igual o superior
    a este resultará en la descalificación de los privilegios de conducción comercial.
- id: 110
  category: alcohol_drugs_health
  question: Una primera condena por DUI en Kansas requiere una sentencia mínima obligatoria
    de cárcel de ¿cuántas horas?
  choices:
    A: 12 horas
    B: 24 horas
    C: 48 horas
    D: 72 horas
  answer: C
  explanation: La ley de Kansas exige un mínimo obligatorio de 48 horas de prisión
    o 100 horas de servicio público por una primera condena por DUI.
- id: 111
  category: alcohol_drugs_health
  question: ¿Después del período de suspensión inicial por una primera condena por
    DUI con un BAC de .08 a .14, cuánto tiempo debe un conductor de Kansas usar un
    dispositivo de interbloqueo de encendido (IID)?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Para un primer DUI con un BAC entre .08 y .14, el conductor enfrenta
    una suspensión de 30 días seguida de 180 días (6 meses) de conducción restringida
    con un dispositivo de interbloqueo de encendido.
- id: 112
  category: alcohol_drugs_health
  question: De acuerdo con la Ley de Contenedores Abiertos de Kansas, ¿dónde es legal
    transportar un contenedor de alcohol abierto o sin sellar?
  choices:
    A: En la guantera
    B: En el maletero del vehículo
    C: En el asiento trasero, si el conductor no puede alcanzarlo
    D: En una consola central
  answer: B
  explanation: La ley de Kansas prohíbe los contenedores abiertos en el área de pasajeros.
    Deben estar en el maletero o, si el vehículo no tiene maletero, en un área que
    no sea ocupada normalmente por el conductor o los pasajeros (detrás del último
    asiento vertical).
- id: 113
  category: alcohol_drugs_health
  question: Si un conductor de Kansas es condenado por una segunda ofensa de DUI,
    ¿cuál es el período de suspensión obligatoria de la licencia de conducir?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Revocada permanentemente
  answer: B
  explanation: Una segunda condena por DUI en Kansas resulta en una suspensión obligatoria
    de un año de los privilegios de conducir, seguida de un período de restricción
    con interbloqueo de encendido.
- id: 114
  category: alcohol_drugs_health
  question: En Kansas, ¿qué es el 'efecto sinérgico' en relación con la conducción?
  choices:
    A: El tiempo de recuperación después de un choque
    B: El efecto combinado del alcohol y las drogas que es mayor que la suma de sus
      partes
    C: El proceso legal para restablecer una licencia
    D: El tiempo de reacción de un conductor de edad avanzada
  answer: B
  explanation: El efecto sinérgico ocurre cuando el alcohol y las drogas (incluso
    las recetadas o de venta libre) se toman juntos, multiplicando significativamente
    los niveles de deterioro.
- id: 115
  category: alcohol_drugs_health
  question: Para mantener una licencia de conducir de Kansas, ¿cuánto tiempo debe
    una persona con antecedentes de convulsiones estar generalmente libre de convulsiones
    antes de conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Los estándares médicos de Kansas generalmente requieren que una persona
    con un trastorno de convulsiones esté libre de ellas durante al menos seis meses
    antes de que pueda operar legalmente un vehículo motorizado.
- id: 116
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados, ¿quién es legalmente responsable
    de asegurar que usted esté en condiciones de conducir en Kansas?
  choices:
    A: El médico que recetó el medicamento
    B: El farmacéutico que surtió la receta
    C: El conductor del vehículo
    D: El Departamento de Transporte de Kansas
  answer: C
  explanation: Es responsabilidad del conductor conocer los efectos de cualquier medicamento
    que esté tomando. Conducir bajo los efectos de medicamentos recetados se trata
    igual que conducir bajo la influencia del alcohol.
- id: 117
  category: alcohol_drugs_health
  question: 'En Kansas, se considera que un conductor está intoxicado ''Per Se'' si
    su BAC es de:'
  choices:
    A: 0.05% o más
    B: 0.07% o más
    C: 0.08% o más
    D: 0.10% o más
  answer: C
  explanation: '''Per Se'' significa que el nivel de BAC en sí mismo (0.08% para adultos)
    es evidencia suficiente de intoxicación, independientemente de qué tan bien parezca
    estar conduciendo la persona.'
- id: 118
  category: alcohol_drugs_health
  question: 'Bajo la ley de Kansas, si usted está involucrado en un choque que resulta
    en lesiones personales o muerte, se le requiere:'
  choices:
    A: Someterse a una prueba de drogas y alcohol si lo solicita un oficial
    B: Solo someterse a una prueba si usted tuvo la culpa
    C: Solo someterse a una prueba si tiene un DUI previo
    D: Rechazar todas las pruebas hasta que un abogado esté presente
  answer: A
  explanation: Bajo las leyes de consentimiento implícito de Kansas, si usted está
    involucrado en un accidente con lesiones graves o fatal, las autoridades tienen
    la facultad de solicitar pruebas químicas de alcohol o drogas.
- id: 119
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir el contenido de alcohol en
    sangre (BAC) en su cuerpo?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Darle tiempo a su cuerpo para procesar el alcohol
  answer: D
  explanation: Solo el tiempo puede reducir el BAC. El cuerpo procesa el alcohol a
    un ritmo constante (aproximadamente una bebida por hora), y los estimulantes como
    el café no aceleran este proceso.
- id: 120
  category: alcohol_drugs_health
  question: 'En Kansas, si el BAC de un conductor es de .15 o más en una primera ofensa,
    el requisito del interbloqueo de encendido se aumenta a:'
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Para una primera ofensa de DUI en Kansas con un BAC de .15 o más, el
    conductor debe mantener un dispositivo de interbloqueo de encendido durante un
    año después del período de suspensión.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un signo común de un conductor bajo la influencia
    del alcohol o las drogas?
  choices:
    A: Zigzaguear entre carriles
    B: Conducir significativamente más lento que el límite de velocidad
    C: Arranques y paradas rápidos y bruscos
    D: Todas las anteriores
  answer: D
  explanation: Los conductores con facultades disminuidas suelen mostrar un comportamiento
    errático, que incluye zigzagueo, velocidades inadecuadas y un control deficiente
    del vehículo.
- id: 122
  category: alcohol_drugs_health
  question: 'En Kansas, al calcular el número de delitos previos por DUI para la sentencia,
    el periodo de "revisión retrospectiva" (look-back) es:'
  choices:
    A: 5 años
    B: 10 años
    C: Toda la vida del conductor
    D: Solo desde que el conductor cumplió 21 años
  answer: C
  explanation: La ley de Kansas utiliza un periodo de revisión de por vida, lo que
    significa que cualquier condena por DUI que ocurra a partir del 1 de julio de
    2001 cuenta como un delito previo para fines de sentencia.
- id: 123
  category: alcohol_drugs_health
  question: En Kansas, si se le condena por un DUI con una concentración de alcohol
    en sangre (BAC) de .15 o superior, ¿cuánto tiempo debe usar un dispositivo de
    interbloqueo de encendido (IID) por una primera infracción?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Para una primera infracción de DUI en Kansas con un BAC de .15 o superior,
    el conductor debe mantener un dispositivo de interbloqueo de encendido durante
    1 año después del periodo de suspensión.
- id: 124
  category: alcohol_drugs_health
  question: 'Para recuperar los privilegios de conducir en Kansas después de un evento
    médico que involucre la pérdida del conocimiento (como una convulsión), un conductor
    generalmente debe estar libre de convulsiones durante al menos:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: La Junta Médica Asesora de Kansas generalmente requiere que una persona
    esté libre de convulsiones durante 6 meses antes de que pueda ser autorizada para
    conducir, aunque los casos individuales pueden variar según la revisión médica.
- id: 125
  category: alcohol_drugs_health
  question: En Kansas, si una persona es condenada por un DUI mientras un niño menor
    de ____ años estaba en el vehículo, el castigo se incrementa con 1 mes adicional
    de prisión.
  choices:
    A: '12'
    B: '14'
    C: '16'
    D: '18'
  answer: B
  explanation: Según K.S.A. 8-1567, si una persona es condenada por DUI mientras un
    niño menor de 14 años era pasajero, los términos mínimos y máximos de prisión
    se incrementan en 1 mes.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cuál es el tiempo mínimo obligatorio de cárcel por una segunda condena
    por DUI en Kansas?
  choices:
    A: 48 horas
    B: 5 días
    C: 30 días
    D: 90 días
  answer: D
  explanation: Una segunda condena por DUI en Kansas es un delito menor de Clase A
    que no es contra las personas y conlleva un mínimo obligatorio de 90 días a 1
    año de prisión.
- id: 127
  category: alcohol_drugs_health
  question: Si recibe un formulario DC-27 (formulario de incautación de la licencia
    de conducir) por fallar o rechazar una prueba de aliento en Kansas, ¿cuántos días
    tiene para solicitar una audiencia administrativa para impugnar la suspensión?
  choices:
    A: 7 días
    B: 10 días
    C: 14 días
    D: 30 días
  answer: C
  explanation: La ley de Kansas otorga 14 días naturales a partir de la fecha en que
    se entregó la notificación para solicitar una audiencia administrativa para impugnar
    la suspensión de los privilegios de conducir.
- id: 128
  category: alcohol_drugs_health
  question: ¿Qué es el "efecto sinérgico" en el contexto de la seguridad al conducir?
  choices:
    A: La capacidad del cuerpo para procesar el alcohol más rápido con la comida
    B: El aumento del efecto causado por la combinación de alcohol y drogas
    C: El tiempo de recuperación necesario después de un viaje largo
    D: El efecto de conducir a gran altitud sobre los niveles de oxígeno en la sangre
  answer: B
  explanation: El efecto sinérgico ocurre cuando se consumen alcohol y drogas juntos,
    lo que resulta en un efecto mucho mayor que la suma de las dos partes, afectando
    gravemente la capacidad de conducir.
- id: 129
  category: alcohol_drugs_health
  question: 'Al solicitar o renovar una licencia de Kansas, debe informar legalmente
    cualquier condición física o mental que pueda impedirle:'
  choices:
    A: Conducir largas distancias
    B: Ejercer un control ordinario y razonable sobre un vehículo motorizado
    C: Conducir de noche
    D: Operar una transmisión manual
  answer: B
  explanation: La ley de Kansas exige que los solicitantes revelen cualquier condición
    que pueda interferir con su capacidad para ejercer un control ordinario y razonable
    sobre un vehículo motorizado de manera segura.
- id: 130
  category: alcohol_drugs_health
  question: 'Con el fin de determinar si un DUI es una primera, segunda o subsiguiente
    infracción, la ley de Kansas utiliza un periodo de "revisión retrospectiva" (look-back)
    de:'
  choices:
    A: 5 años
    B: 10 años
    C: 20 años
    D: Toda la vida
  answer: D
  explanation: Kansas utiliza actualmente un periodo de revisión de por vida, lo que
    significa que cualquier condena previa por DUI o programa de desvío (diversion)
    que ocurra durante la vida de la persona cuenta para el número total de infracciones.
- id: 131
  category: alcohol_drugs_health
  question: 'En Kansas, es ilegal que una persona transporte una bebida alcohólica
    en un vehículo a menos que esté en el envase o contenedor original sin abrir,
    EXCEPTO por:'
  choices:
    A: Vino que ha sido retapado profesionalmente por un restaurante
    B: Cerveza en un vaso de plástico con tapa
    C: Bebidas mezcladas en un termo
    D: Licores en una licorera de bolsillo (flask)
  answer: A
  explanation: La ley de Kansas permite el transporte de una botella de vino parcialmente
    consumida si fue comprada en un restaurante y se volvió a tapar, y se mantiene
    en un lugar no accesible para el conductor.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los medicamentos
    recetados y la conducción en Kansas?
  choices:
    A: No se le puede acusar de DUI si el medicamento fue recetado legalmente
    B: Los medicamentos recetados solo afectan la conducción si se toman con alcohol
    C: Puede ser condenado por DUI si un medicamento recetado afecta su capacidad
      para conducir de manera segura
    D: Solo las drogas de 'Lista I' (Schedule I) pueden dar lugar a un cargo de DUI
  answer: C
  explanation: En Kansas, un cargo de DUI puede basarse en el deterioro causado por
    cualquier droga, incluidos los medicamentos legales recetados o de venta libre,
    si estos hacen que el conductor sea incapaz de operar un vehículo de manera segura.
- id: 133
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por una primera condena por conducir mientras su licencia
    está suspendida (DWLS) por un DUI en Kansas?
  choices:
    A: Una multa de $100 y sin tiempo en la cárcel
    B: Mínimo obligatorio de 90 días en la cárcel y una multa de al menos $1,500
    C: Una advertencia y una extensión de 30 días de la suspensión
    D: Mínimo obligatorio de 5 días en la cárcel y una multa de al menos $100
  answer: D
  explanation: Conducir con una licencia suspendida por una condena de DUI es una
    ofensa grave en Kansas, que conlleva un mínimo obligatorio de 5 días en la cárcel
    y una multa de al menos $100 por la primera condena.
- id: 134
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes factores es la ÚNICA forma de reducir su concentración
    de alcohol en sangre (BAC)?
  choices:
    A: Beber café negro
    B: Tomar una ducha fría
    C: El tiempo
    D: Comer una comida pesada
  answer: C
  explanation: Solo el tiempo permite que el cuerpo metabolice el alcohol y reduzca
    el BAC. El café, las duchas y la comida no aceleran la eliminación del alcohol
    del torrente sanguíneo.
- id: 135
  category: penalties_and_points
  question: En Kansas, ¿una primera condena por DUI puede resultar en un mínimo de
    cuántas horas de prisión obligatoria o servicio público?
  choices:
    A: 12 horas
    B: 24 horas
    C: 48 horas
    D: 72 horas
  answer: C
  explanation: Según la ley de Kansas, una primera condena por DUI conlleva un mínimo
    obligatorio de 48 horas de prisión o 100 horas de servicio público.
- id: 136
  category: penalties_and_points
  question: 'En Kansas, las multas de tráfico se duplican cuando ocurre una infracción
    en una zona de construcción, siempre que:'
  choices:
    A: El sol se haya puesto
    B: La zona tenga más de una milla de largo
    C: Haya trabajadores presentes y señales publicadas
    D: Sea un fin de semana
  answer: C
  explanation: La ley de Kansas dicta que las multas de tráfico se duplican en las
    zonas de mantenimiento o construcción cuando hay trabajadores presentes y se han
    colocado las señales apropiadas.
- id: 137
  category: penalties_and_points
  question: En Kansas, ¿cuál es la multa por una infracción de la Ley de Seguridad
    de Pasajeros Infantiles (no asegurar adecuadamente a un niño en un asiento de
    seguridad o elevador/booster)?
  choices:
    A: $30
    B: $45
    C: $60
    D: $150
  answer: C
  explanation: Una infracción de la Ley de Seguridad de Pasajeros Infantiles de Kansas
    resulta en una multa de $60 más las costas judiciales.
- id: 138
  category: penalties_and_points
  question: 'Una persona menor de 21 años condenada por una primera ofensa de ''Menor
    en Posesión'' (MIP) de alcohol en Kansas enfrentará una suspensión obligatoria
    de la licencia de conducir de:'
  choices:
    A: 10 días
    B: 30 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: En Kansas, una primera condena por MIP para un menor resulta en una
    suspensión de la licencia de conducir de 30 días.
- id: 139
  category: penalties_and_points
  question: 'Para restablecer una licencia de conducir de Kansas después de una suspensión
    por un primer incidente relacionado con el alcohol (reprobar una prueba de aliento),
    el conductor debe pagar una tarifa de:'
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: Kansas requiere una tarifa de restablecimiento de $100 por el primer
    incidente de suspensión relacionado con el alcohol.
- id: 140
  category: penalties_and_points
  question: ¿Cuál es la multa por violar la ley 'Move Over' (hacerse a un lado) de
    Kansas (no ceder el paso a un vehículo de emergencia estacionado con luces intermitentes)?
  choices:
    A: $45
    B: $75
    C: $150
    D: $500
  answer: B
  explanation: La multa por no ceder el paso a un vehículo de emergencia o por la
    infracción de la ley 'Move Over' en Kansas es de $75 más las costas judiciales.
- id: 141
  category: penalties_and_points
  question: 'Según la ley de Kansas, transportar un recipiente abierto de una bebida
    con bajo contenido de alcohol o licor en el área de pasajeros de un vehículo es
    una infracción que puede resultar en:'
  choices:
    A: Una multa de hasta $200 y/o 6 meses de cárcel
    B: Una revocación automática de la licencia por 1 año
    C: 48 horas obligatorias de servicio comunitario
    D: Solo una multa fija de $500
  answer: A
  explanation: Las leyes de Recipiente Abierto de Kansas (K.S.A. 8-1599) permiten
    una multa de hasta $200 y/o una pena de cárcel de hasta seis meses.
- id: 142
  category: penalties_and_points
  question: En Kansas, ¿cuál es la multa específica por no detenerse ante un autobús
    escolar que tiene su brazo de parada extendido y las luces rojas parpadeando?
  choices:
    A: $100
    B: $250
    C: $315
    D: $500
  answer: C
  explanation: La ley de Kansas establece una multa específica de $315 por rebasar
    un autobús escolar que se ha detenido para subir o bajar niños.
- id: 143
  category: penalties_and_points
  question: 'En Kansas, se considera que una persona que opera un vehículo motorizado
    comercial está bajo la influencia si su concentración de alcohol en sangre (BAC)
    es igual o superior a:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Para los conductores comerciales en Kansas, el límite legal de BAC
    es del 0.04%, el cual es más estricto que el límite del 0.08% para conductores
    no comerciales.
- id: 144
  category: penalties_and_points
  question: 'Si su licencia de Kansas es suspendida debido a la falta de seguro de
    responsabilidad civil para vehículos motorizados, generalmente se le requerirá
    presentar un formulario SR-22 durante:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Kansas generalmente requiere que los conductores mantengan un SR-22
    (prueba de responsabilidad financiera) durante 3 años después de una suspensión
    por falta de seguro.
- id: 145
  category: penalties_and_points
  question: 'Una primera condena por operar un vehículo motorizado en Kansas sin el
    seguro de responsabilidad civil requerido puede resultar en una multa de entre:'
  choices:
    A: $100 y $250
    B: $300 y $1,000
    C: $500 y $1,500
    D: $1,000 y $2,500
  answer: B
  explanation: Una primera condena por 'Falta de Seguro' en Kansas conlleva una multa
    que oscila entre $300 y $1,000 y la posibilidad de hasta 6 meses de cárcel.
- id: 146
  category: penalties_and_points
  question: En Kansas, ¿cuál es la multa mínima por una condena de primera ofensa
    por Conducir Bajo la Influencia (DUI) para un adulto?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: C
  explanation: De acuerdo con la ley de Kansas (K.S.A. 8-1567), una condena por DUI
    de primera ofensa conlleva una multa que oscila entre $750 y $1,000, más las costas
    judiciales y otros cargos.
- id: 147
  category: penalties_and_points
  question: ¿Cuál es la multa estándar por una violación de la ley de Kansas que prohíbe
    enviar mensajes de texto mientras se conduce?
  choices:
    A: $25
    B: $60
    C: $150
    D: $250
  answer: B
  explanation: Bajo la norma K.S.A. 8-15,111, la multa por usar un dispositivo de
    comunicación inalámbrica para escribir, enviar o leer una comunicación escrita
    mientras se opera un vehículo motorizado es de $60 más las costas judiciales.
- id: 148
  category: penalties_and_points
  question: 'Para una primera ofensa por conducir sin seguro de responsabilidad civil
    para vehículos motorizados en Kansas, la multa oscila entre:'
  choices:
    A: $100 a $300
    B: $300 a $1,000
    C: $500 a $1,500
    D: $1,000 a $2,500
  answer: B
  explanation: La norma K.S.A. 40-3104 establece que una primera condena por conducir
    sin seguro resulta en una multa no menor de $300 ni mayor de $1,000 y/o reclusión
    en la cárcel del condado.
- id: 149
  category: penalties_and_points
  question: En Kansas, ¿qué sucede con la multa por una infracción de exceso de velocidad
    que ocurre en una zona de construcción de carreteras cuando hay trabajadores presentes?
  choices:
    A: La multa se exonera para los infractores por primera vez
    B: La multa aumenta en $50
    C: La multa se duplica
    D: La multa se triplica
  answer: C
  explanation: La norma K.S.A. 8-1560d ordena que las multas por infracciones de exceso
    de velocidad se dupliquen cuando la infracción ocurre dentro de una zona de construcción
    de carreteras donde hay trabajadores presentes.
- id: 150
  category: penalties_and_points
  question: 'Según la ley de Kansas, debe informar de inmediato cualquier accidente
    de tráfico a la agencia de aplicación de la ley más cercana si este resulta en
    daños a la propiedad por un valor aparente de:'
  choices:
    A: $500 o más
    B: $1,000 o más
    C: $2,500 o más
    D: Cualquier cantidad
  answer: B
  explanation: La norma K.S.A. 8-1606 requiere que el conductor de un vehículo involucrado
    en un accidente que resulte en lesiones, muerte o daños totales a la propiedad
    de $1,000 o más, dé aviso a la agencia de aplicación de la ley más cercana.
- id: 151
  category: penalties_and_points
  question: 'En Kansas, transportar un recipiente abierto de alcohol en el área de
    pasajeros de un vehículo es un delito menor que puede resultar en una multa de
    hasta:'
  choices:
    A: $100
    B: $200
    C: $500
    D: $1,000
  answer: B
  explanation: Según K.S.A. 8-1599, transportar un recipiente abierto es un delito
    menor sancionable con una multa de hasta $200 y/o hasta seis meses de cárcel.
- id: 152
  category: penalties_and_points
  question: ¿Cuál es la multa estándar en Kansas por no ceder el paso a un vehículo
    de emergencia (Ley de Moverse a un Lado o 'Move Over Law')?
  choices:
    A: $75
    B: $150
    C: $195
    D: $500
  answer: C
  explanation: De acuerdo con el Programa Uniforme de Multas de Kansas para infracciones
    de tráfico, la multa por no ceder el paso a un vehículo de emergencia (K.S.A.
    8-1530) es de $195.
- id: 153
  category: penalties_and_points
  question: 'Si un conductor es condenado por un segundo DUI (conducir bajo la influencia)
    en Kansas, sus privilegios de conducir serán suspendidos por un período de:'
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: D
  explanation: Para una segunda condena por DUI en Kansas, la licencia de conducir
    se suspende por un año, seguido de un período de restricción con un dispositivo
    de interbloqueo de encendido.
- id: 154
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento de una licencia de conducir de
    Kansas suspendida debido a un primer incidente relacionado con el alcohol?
  choices:
    A: $25
    B: $100
    C: $400
    D: $1,000
  answer: B
  explanation: K.S.A. 8-2,142 especifica que la tarifa de restablecimiento para una
    primera suspensión relacionada con el alcohol es de $100. Esta tarifa aumenta
    para incidentes posteriores.
- id: 155
  category: penalties_and_points
  question: 'La condena por arrojar basura desde un vehículo motorizado en Kansas
    puede resultar en una multa máxima de:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Según la ley de Kansas (K.S.A. 21-5813), arrojar basura es un delito
    menor y puede conllevar una multa de hasta $1,000 además de servicio comunitario.
- id: 156
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por el uso ilegal de un cartel o placa de estacionamiento
    para personas con discapacidad en Kansas?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: K.S.A. 8-1,129 establece que el uso ilegal de un dispositivo de identificación
    de estacionamiento para personas con discapacidad es un delito menor sancionable
    con una multa de no más de $100.
- id: 157
  category: sharing_the_road
  question: En Kansas, cuando un autobús escolar se detiene en una calzada con sus
    luces rojas parpadeando y el brazo de parada extendido, ¿cuál de las siguientes
    afirmaciones es verdadera?
  choices:
    A: Solo el tráfico que sigue al autobús debe detenerse.
    B: El tráfico en ambas direcciones debe detenerse en todo tipo de carreteras.
    C: El tráfico en ambas direcciones debe detenerse a menos que la calzada esté
      separada por una mediana o barrera física.
    D: Solo necesita detenerse si hay niños presentes en el arcén.
  answer: C
  explanation: De acuerdo con la ley de Kansas (K.S.A. 8-1556), los conductores deben
    detenerse ante un autobús escolar con luces rojas parpadeantes y un brazo de parada
    extendido desde cualquier dirección, a menos que el autobús se encuentre en una
    calzada diferente de una carretera dividida separada por una mediana o terreno.
- id: 158
  category: sharing_the_road
  question: Al seguir a un camión o autobús grande, ¿por qué debería aumentar su distancia
    de seguimiento?
  choices:
    A: Para permitir que el conductor del camión lo vea en sus espejos laterales.
    B: Porque los camiones tienen una distancia de frenado más corta que los automóviles.
    C: Para evitar que el camión ruede hacia atrás contra usted.
    D: Para evitar la 'Zona No' (No-Zone) trasera del camión.
  answer: A
  explanation: Los camiones grandes tienen puntos ciegos significativos (Zonas No).
    Si no puede ver la cara del conductor del camión en sus espejos laterales, el
    conductor del camión no puede verlo a usted. Aumentar la distancia de seguimiento
    garantiza la visibilidad.
- id: 159
  category: sharing_the_road
  question: En Kansas, ¿qué debe hacer un conductor cuando un peatón cruza la calle
    guiado por un animal de servicio o portando un bastón blanco (con o sin punta
    roja)?
  choices:
    A: Tocar la bocina para hacerles saber que usted está allí.
    B: Ceder el derecho de paso y tomar precauciones para evitar lesiones.
    C: Rodearlos si hay suficiente espacio.
    D: Esperar a que le indiquen que pase.
  answer: B
  explanation: K.S.A. 8-1542 establece que los conductores deben ceder el derecho
    de paso a cualquier peatón total o parcialmente ciego que lleve un bastón blanco
    visible o esté acompañado por un perro guía.
- id: 160
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la 'división
    de carril' (circular entre filas de vehículos detenidos o en movimiento) para
    motocicletas en Kansas?
  choices:
    A: Es legal a velocidades inferiores a 15 mph.
    B: Es legal solo en carreteras de carriles múltiples.
    C: Es ilegal en el estado de Kansas.
    D: Es legal si el motociclista lleva casco.
  answer: C
  explanation: En Kansas, las motocicletas tienen derecho al uso completo de un carril,
    y ningún vehículo motorizado debe conducirse de manera que prive a ninguna motocicleta
    del uso completo de un carril. No se permite la división de carril.
- id: 161
  category: sharing_the_road
  question: 'Cuando un cortejo fúnebre es encabezado por un vehículo con luces intermitentes
    ámbar o púrpuras, la ley de Kansas exige que los demás conductores:'
  choices:
    A: Cedan el paso a todo el cortejo.
    B: Solo cedan el paso al vehículo guía.
    C: Rebasen al cortejo por la derecha.
    D: Se unan al cortejo para avanzar más rápido entre el tráfico.
  answer: A
  explanation: Según K.S.A. 8-15,107, los conductores deben ceder el paso a cualquier
    vehículo que forme parte de un cortejo fúnebre. Una vez que el vehículo guía ha
    entrado en una intersección, los vehículos restantes del cortejo pueden continuar
    a través de ella, independientemente de los dispositivos de control de tráfico.
- id: 162
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima de seguimiento que debe mantener detrás de
    un aparato de bomberos (camión de bomberos) que responde a una alarma en Kansas?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley K.S.A. 8-1574 prohíbe a los conductores seguir a cualquier aparato
    de bomberos que viaje en respuesta a una alarma de incendio a una distancia menor
    de 500 pies.
- id: 163
  category: sharing_the_road
  question: En Kansas, ¿quién está obligado por ley a usar casco mientras opera o
    viaja en una motocicleta?
  choices:
    A: Todos los motociclistas, independientemente de su edad.
    B: Solo el conductor, no el pasajero.
    C: Cualquier persona menor de 18 años.
    D: Nadie está obligado a usar casco en Kansas.
  answer: C
  explanation: La ley K.S.A. 8-1598 exige que cualquier persona menor de 18 años de
    edad use un casco mientras opera o viaja en una motocicleta o bicicleta motorizada.
- id: 164
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle estrecha, es posible
    que necesite:'
  choices:
    A: Mantenerse cerca del bordillo derecho.
    B: Abrirse hacia la izquierda antes de girar a la derecha.
    C: Aumentar la velocidad para despejar la intersección.
    D: Girar desde el carril situado más a la izquierda.
  answer: B
  explanation: Los camiones grandes tienen un radio de giro amplio. Para no chocar
    con el bordillo, a menudo necesitan abrirse hacia la izquierda para completar
    un giro a la derecha. Los conductores nunca deben intentar meterse entre un camión
    que gira y el bordillo.
- id: 165
  category: sharing_the_road
  question: 'Según el Manual de Conducción de Kansas, si usted sigue a una motocicleta,
    debe:'
  choices:
    A: Seguirla más de cerca que a un automóvil para no perderla de vista.
    B: Usar una distancia de seguimiento de 4 segundos para considerar la capacidad
      de la motocicleta de detenerse rápidamente.
    C: Compartir el carril con la motocicleta si hay espacio.
    D: Usar siempre las luces altas para que el motociclista pueda verlo.
  answer: B
  explanation: Las motocicletas pueden detenerse mucho más rápido que los automóviles.
    Las pautas de Kansas sugieren aumentar la distancia de seguimiento (al menos 3
    a 4 segundos) cuando se circula detrás de una motocicleta para evitar una colisión
    por alcance si el conductor frena repentinamente.
- id: 166
  category: sharing_the_road
  question: 'Si usted está conduciendo y un vehículo de emergencia con sirena y luces
    intermitentes se aproxima por detrás, usted debe:'
  choices:
    A: Detenerse exactamente donde está.
    B: Aumentar la velocidad para mantenerse por delante de él.
    C: Hacerse a un lado hacia el borde derecho de la carretera y detenerse.
    D: Hacerse a un lado hacia el borde izquierdo de la carretera y detenerse.
  answer: C
  explanation: La ley K.S.A. 8-1530 exige que los conductores cedan el paso a un vehículo
    de emergencia autorizado moviéndose lo más cerca posible del borde derecho o bordillo
    de la calzada y deteniéndose hasta que el vehículo haya pasado.
- id: 167
  category: sharing_the_road
  question: 'En Kansas, los ciclistas que circulan por una calzada de noche deben
    estar equipados con una lámpara en la parte delantera que emita una luz blanca
    visible desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley K.S.A. 8-1592 exige que las bicicletas utilizadas de noche tengan
    una lámpara delantera visible desde 500 pies y un reflector trasero rojo visible
    desde 100 a 600 pies.
- id: 168
  category: sharing_the_road
  question: 'Cuando un peatón se encuentra en un paso de peatones no marcado en una
    intersección en Kansas, el conductor debe:'
  choices:
    A: Ceder el derecho de paso al peatón.
    B: Tocar la bocina para advertir al peatón que se mantenga atrás.
    C: Solo ceder el paso si el cruce peatonal está pintado.
    D: Mantener la velocidad, ya que los peatones deben ceder el paso a los autos
      entre intersecciones.
  answer: A
  explanation: Bajo la ley K.S.A. 8-1533, los conductores deben ceder el derecho de
    paso a un peatón que cruza la calzada dentro de cualquier paso de peatones marcado
    o no marcado en una intersección.
- id: 169
  category: sharing_the_road
  question: 'Según la ley de Kansas, un emblema de ''vehículo de movimiento lento''
    (un triángulo naranja con un borde rojo) debe exhibirse en la parte trasera de
    cualquier vehículo diseñado para operar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: La ley K.S.A. 8-1717 exige el emblema de vehículo de movimiento lento
    en los vehículos diseñados para su uso a velocidades de 25 millas por hora o menos,
    como tractores agrícolas o carruajes tirados por caballos.
- id: 170
  category: sharing_the_road
  question: En Kansas, al encontrarse con un autobús escolar detenido en una calzada
    con una mediana o barrera física, ¿qué vehículos están obligados a detenerse ante
    las luces rojas intermitentes del autobús?
  choices:
    A: Todos los vehículos que viajan en ambas direcciones
    B: Solo los vehículos que viajan en la misma dirección que el autobús
    C: Solo los vehículos que viajan en la dirección opuesta al autobús
    D: Ningún vehículo está obligado a detenerse en carreteras divididas
  answer: B
  explanation: De acuerdo con el Estatuto de Kansas 8-1556, si una carretera está
    dividida por una mediana o barrera física, solo el tráfico que sigue al autobús
    debe detenerse. El tráfico que se aproxima desde la dirección opuesta no necesita
    detenerse.
- id: 171
  category: sharing_the_road
  question: ¿Según la ley de Kansas, cuál es la distancia mínima que un automovilista
    debe mantener al adelantar o rebasar una bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: El Estatuto de Kansas 8-1516 exige que el conductor de un vehículo
    que adelante a una bicicleta pase por la izquierda a una distancia no menor de
    tres pies.
- id: 172
  category: sharing_the_road
  question: En Kansas, ¿qué parte del ancho de un carril tiene derecho a ocupar una
    motocicleta?
  choices:
    A: La mitad izquierda del carril
    B: La mitad derecha del carril
    C: El ancho total del carril
    D: Un tercio del carril
  answer: C
  explanation: La ley de Kansas trata a las motocicletas como vehículos de tamaño
    completo, y tienen derecho al ancho total del carril. Los automovilistas nunca
    deben intentar compartir un carril con una motocicleta.
- id: 173
  category: sharing_the_road
  question: 'Al seguir a un camión grande, si no puede ver la cara del conductor del
    camión en sus espejos laterales, usted se encuentra:'
  choices:
    A: En el punto ciego del conductor (No-Zone)
    B: A una distancia de seguimiento segura
    C: En la mejor posición para adelantar
    D: Visible para el conductor del camión a través del espejo retrovisor
  answer: A
  explanation: El Manual de Conducción de Kansas establece que si no puede ver la
    cara del conductor en su espejo lateral, el conductor no puede verlo a usted.
    Usted se encuentra en una de las 'No-Zones' o puntos ciegos del camión.
- id: 174
  category: sharing_the_road
  question: En Kansas, ¿qué debe hacer un conductor cuando un peatón que lleva un
    bastón blanco o utiliza un perro guía está cruzando o intentando cruzar una calle?
  choices:
    A: Tocar la bocina para avisar que está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse por completo y ceder el paso
    D: Rodearlos si hay suficiente espacio
  answer: C
  explanation: La ley de Kansas exige que los conductores se detengan por completo
    y cedan el paso a cualquier peatón ciego que lleve un bastón blanco o utilice
    un perro guía.
- id: 175
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión puede:'
  choices:
    A: Permanecer totalmente en el carril derecho
    B: Abrirse hacia la izquierda para completar el giro
    C: Girar únicamente desde el carril izquierdo
    D: Detenerse y esperar a que el tráfico se despeje en ambas calles
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para no chocar con el bordillo al realizar un giro a la derecha. Los conductores
    deben evitar 'apretarse' entre el camión y el bordillo.
- id: 176
  category: sharing_the_road
  question: Cuando una motocicleta cruza las vías del tren en ángulo, ¿qué debe esperar
    el conductor que viene detrás?
  choices:
    A: Que la motocicleta acelere
    B: Que la motocicleta mantenga una línea recta
    C: Que la motocicleta vire bruscamente para cruzar las vías en ángulo recto
    D: Que la motocicleta se vuelque
  answer: C
  explanation: Los motociclistas pueden virar bruscamente para cruzar las vías del
    tren u obstáculos en un ángulo de 90 grados para evitar perder el equilibrio.
    Los conductores que los siguen deben estar preparados para esta maniobra.
- id: 177
  category: sharing_the_road
  question: 'Se requiere un emblema de ''Vehículo de movimiento lento'' (un triángulo
    naranja con borde rojo) en la maquinaria agrícola de Kansas y otros vehículos
    diseñados para operar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio para todos
    los vehículos diseñados para viajar a velocidades de 25 mph o menos en las carreteras
    públicas.
- id: 178
  category: sharing_the_road
  question: 'En Kansas, si no hay señales de tráfico ni pasos de peatones marcados
    en una intersección, el conductor debe:'
  choices:
    A: Ceder el paso a los peatones solo si están en medio de la carretera
    B: Ceder el paso a los peatones ya que existe un paso de peatones 'no marcado'
      en cada intersección
    C: Esperar que los peatones cedan el paso a los vehículos
    D: Solo ceder el paso a los peatones durante las horas del día
  answer: B
  explanation: Según la ley de Kansas, existen pasos de peatones en todas las intersecciones
    donde las aceras normalmente cruzarían la calle, estén marcados con pintura o
    no. Los conductores deben ceder el paso a los peatones en estos pasos de peatones
    no marcados.
- id: 179
  category: vehicle_information
  question: Según el Manual de Conducción de Kansas, ¿cuándo debe usar sus faros delanteros?
  choices:
    A: Solo entre las 10:00 PM y las 6:00 AM
    B: Desde el atardecer hasta el amanecer y siempre que la visibilidad sea inferior
      a 1,000 pies
    C: Solo cuando esté lloviendo o nevando
    D: Desde una hora después del atardecer hasta una hora antes del amanecer
  answer: B
  explanation: La ley de Kansas exige que los faros estén encendidos desde el atardecer
    hasta el amanecer, y en cualquier otro momento en que no se pueda ver con claridad
    a una distancia de al menos 1,000 pies debido a la falta de luz o a condiciones
    atmosféricas desfavorables.
- id: 180
  category: vehicle_information
  question: Según la ley de Kansas, ¿cuál es el porcentaje mínimo de transmisión de
    luz requerido para el polarizado de las ventanas laterales delanteras?
  choices:
    A: 20%
    B: 25%
    C: 35%
    D: 50%
  answer: C
  explanation: El Estatuto de Kansas 8-1749a establece que el polarizado de las ventanas
    debe permitir una transmisión de luz total de al menos el 35% en todas las ventanas,
    incluidas las ventanas laterales delanteras.
- id: 181
  category: vehicle_information
  question: 'En Kansas, la bocina de un vehículo debe ser audible en condiciones normales
    desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Las regulaciones de equipo de Kansas requieren que cada vehículo motorizado
    esté equipado con una bocina capaz de emitir un sonido audible en condiciones
    normales desde una distancia no menor a 200 pies.
- id: 182
  category: vehicle_information
  question: 'De acuerdo con los estándares de seguridad de Kansas, los neumáticos
    se consideran inseguros si la profundidad de la banda de rodadura es menor a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: En Kansas, los neumáticos se consideran legalmente inseguros y deben
    reemplazarse si tienen menos de 2/32 de pulgada de profundidad en la banda de
    rodadura.
- id: 183
  category: vehicle_information
  question: 'La ley de Kansas exige que el espejo retrovisor de su vehículo le permita
    ver la carretera por una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: Las leyes de equipo de Kansas requieren un espejo ubicado de tal manera
    que refleje al conductor una vista de la carretera por una distancia de al menos
    200 pies hacia la parte trasera del vehículo.
- id: 184
  category: vehicle_information
  question: ¿En Kansas, cada vehículo motorizado debe estar equipado con cuántos sistemas
    de frenado independientes?
  choices:
    A: Un sistema (solo frenos de servicio)
    B: Dos sistemas independientes (frenos de servicio y un freno de estacionamiento)
    C: Tres sistemas (servicio, estacionamiento y aire de emergencia)
    D: No se requiere un número específico siempre que el vehículo se detenga
  answer: B
  explanation: La ley de Kansas exige que los vehículos motorizados tengan dos medios
    independientes para aplicar los frenos, cada uno de los cuales debe ser eficaz
    para aplicar los frenos a al menos dos ruedas (normalmente el freno de servicio
    y el freno de estacionamiento/emergencia).
- id: 185
  category: vehicle_information
  question: 'La ley de Kansas exige que la placa de matrícula trasera esté iluminada
    de modo que sea legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: Las regulaciones de Kansas especifican que ya sea una luz trasera o
    una lámpara independiente debe estar construida y colocada de manera que ilumine
    la placa de matrícula trasera y la haga claramente legible desde una distancia
    de 50 pies hacia atrás.
- id: 186
  category: vehicle_information
  question: ¿Si una carga se extiende más de cuántos pies más allá de la parte trasera
    de la plataforma o carrocería de un vehículo en Kansas, se debe mostrar una bandera
    o luz roja?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: De acuerdo con la ley de Kansas, siempre que una carga se extienda
    4 pies o más más allá de la parte trasera del vehículo, se debe colocar una bandera
    roja (de día) o una luz roja (de noche) en el extremo posterior de la carga.
- id: 187
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es VERDADERA con respecto a las leyes
    de silenciadores (mufflers) de Kansas?
  choices:
    A: Se permiten recortes o derivaciones del silenciador en las carreteras
    B: No se requiere que los vehículos tengan silenciadores si son anteriores a 1980
    C: Cada vehículo debe tener un silenciador en buen estado de funcionamiento para
      evitar el ruido excesivo
    D: Los sistemas de escape ruidosos son legales si el vehículo se utiliza para
      la agricultura
  answer: C
  explanation: La ley de Kansas exige que cada vehículo esté equipado con un silenciador
    en buen estado de funcionamiento y en operación constante para evitar ruidos excesivos
    o inusuales. Se prohíben los recortes de silenciador o dispositivos similares.
- id: 188
  category: vehicle_information
  question: 'Según la ley de Kansas, los faros delanteros deben usarse cuando la visibilidad
    es inferior a:'
  choices:
    A: 500 pies
    B: 800 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: La ley de Kansas (K.S.A. 8-1703) exige que los faros delanteros estén
    encendidos desde el atardecer hasta el amanecer y en cualquier momento en que
    la visibilidad sea inferior a 1,000 pies debido a luz insuficiente o condiciones
    atmosféricas.
- id: 189
  category: vehicle_information
  question: 'Al acercarse a un vehículo que viene en sentido contrario en Kansas,
    debe atenuar sus luces altas cuando el vehículo esté a menos de:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Kansas exige que los conductores cambien de luces altas a
    luces bajas cuando un vehículo que viene en sentido contrario esté a menos de
    500 pies.
- id: 190
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para vehículos de pasajeros en Kansas?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: El Estatuto de Kansas 8-1742 establece que los neumáticos se consideran
    inseguros si la profundidad de la banda de rodadura es inferior a 2/32 de pulgada
    cuando se mide en cualquiera de las dos ranuras principales adyacentes.
- id: 191
  category: vehicle_information
  question: En Kansas, el polarizado de las ventanas laterales y traseras debe permitir
    al menos ¿qué porcentaje de transmisión de luz?
  choices:
    A: 20%
    B: 25%
    C: 35%
    D: 50%
  answer: C
  explanation: La ley de Kansas (K.S.A. 8-1749a) prohíbe la operación de un vehículo
    con un polarizado de ventanas que tenga una transmisión de luz total inferior
    al 35%.
- id: 192
  category: vehicle_information
  question: 'La ley de Kansas exige que los vehículos tengan al menos un espejo ubicado
    de tal manera que refleje al conductor una vista de la carretera por una distancia
    de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: K.S.A. 8-1740 exige que todo vehículo motorizado esté equipado con
    un espejo que proporcione una vista de la carretera de al menos 200 pies hacia
    atrás.
- id: 193
  category: vehicle_information
  question: ¿Entre qué fechas se permite el uso de neumáticos para nieve con clavos
    en las carreteras de Kansas?
  choices:
    A: 1 de octubre al 1 de marzo
    B: 1 de noviembre al 1 de abril
    C: 15 de noviembre al 15 de marzo
    D: 1 de diciembre al 31 de marzo
  answer: B
  explanation: El Estatuto de Kansas 8-1742 permite el uso de neumáticos con clavos
    únicamente del 1 de noviembre al 1 de abril.
- id: 194
  category: vehicle_information
  question: Según la ley de Kansas, los frenos de servicio de un vehículo de pasajeros
    deben ser capaces de detener el vehículo en cuántos pies cuando viaja a 20 mph?
  choices:
    A: 15 pies
    B: 25 pies
    C: 35 pies
    D: 45 pies
  answer: B
  explanation: K.S.A. 8-1734 exige que los frenos de servicio de un vehículo de pasajeros
    puedan detener el vehículo en un tramo de 25 pies a una velocidad de 20 mph en
    una carretera seca, lisa y nivelada.
- id: 195
  category: vehicle_information
  question: En Kansas, las luces de las señales de giro deben ser visibles desde una
    distancia no menor a ____ bajo la luz solar normal.
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: La ley de Kansas (K.S.A. 8-1721) establece que las luces de las señales
    de giro deben ser visibles desde una distancia no menor a 100 pies tanto hacia
    adelante como hacia atrás.
- id: 196
  category: vehicle_information
  question: 'La ley de Kansas exige que todo vehículo motorizado esté equipado con
    un silenciador (muffler) en buen estado de funcionamiento para evitar:'
  choices:
    A: Ruido excesivo o inusual
    B: Humo excesivo
    C: Tanto A como B
    D: Ni A ni B
  answer: C
  explanation: K.S.A. 8-1739 exige que los silenciadores estén en funcionamiento constante
    para evitar tanto el ruido excesivo o inusual como el humo molesto.
- id: 197
  category: vehicle_information
  question: 'En Kansas, todo vehículo motorizado debe estar equipado con al menos
    dos luces traseras en la parte posterior que emitan una luz roja claramente visible
    desde una distancia de:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 800 pies
    D: 1,000 pies
  answer: D
  explanation: Según K.S.A. 8-1706, las luces traseras de los vehículos fabricados
    después de 1959 deben ser visibles desde una distancia de 1,000 pies hacia atrás.
- id: 198
  category: signs_and_signals
  question: Según el Manual del Conductor de Kansas, si las señales de giro de su
    vehículo fallan, ¿cuál es la señal manual correcta para indicar un giro a la izquierda?
  choices:
    A: Extender el brazo izquierdo recto hacia afuera de la ventana
    B: Extender el brazo izquierdo hacia arriba
    C: Extender el brazo izquierdo hacia abajo
    D: Mover el brazo izquierdo en un movimiento circular
  answer: A
  explanation: En Kansas, la señal manual para un giro a la izquierda es extender
    el brazo izquierdo horizontalmente hacia afuera de la ventana.
- id: 199
  category: signs_and_signals
  question: En Kansas, ¿qué indica una luz amarilla intermitente en una intersección?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Acelerar para despejar la intersección rápidamente
    C: Reducir la velocidad y proceder con precaución
    D: Ceder el paso a todo el tráfico, incluso si usted tiene el derecho de paso
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y pasar por la intersección con precaución, según el Manual del Conductor de Kansas.
- id: 200
  category: signs_and_signals
  question: Según la ley de Kansas, ¿cuántos pies antes de girar debe activar su señal
    de giro en un distrito comercial o residencial?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: K.S.A. 8-1548 exige que se dé una señal de intención de girar de forma
    continua durante no menos de los últimos 100 pies recorridos antes de girar.
- id: 201
  category: signs_and_signals
  question: ¿Qué indica una X amarilla fija colocada sobre un carril en una carretera
    de Kansas?
  choices:
    A: El carril es solo para vehículos HOV (vehículos con alta ocupación)
    B: Debe prepararse para desocupar el carril porque la señal está a punto de cambiar
      a una X roja
    C: El carril está abierto para todo el tráfico
    D: El carril está reservado para vehículos de emergencia
  answer: B
  explanation: Una X amarilla fija indica que el conductor debe prepararse para salir
    del carril de manera segura porque la señal está a punto de cambiar a una X roja,
    lo que significa que el carril está cerrado.
- id: 202
  category: signs_and_signals
  question: 'En Kansas, una luz roja intermitente en una intersección se trata igual
    que una:'
  choices:
    A: Señal de ceder el paso (Yield)
    B: Señal de advertencia
    C: Señal de alto (Stop)
    D: Señal de límite de velocidad
  answer: C
  explanation: Una luz roja intermitente significa que debe detenerse por completo
    y avanzar solo cuando sea seguro hacerlo, de manera similar a una señal de alto.
- id: 203
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal naranja fluorescente en una carretera
    de Kansas?
  choices:
    A: Zona escolar más adelante
    B: Área de recreación pública
    C: Zona de obras o área de construcción
    D: Gestión de incidentes o emergencia
  answer: C
  explanation: El naranja es el color estándar para las señales de zonas de obras
    en Kansas, lo que indica actividades de construcción o mantenimiento.
- id: 204
  category: signs_and_signals
  question: 'Cuando ve un emblema de "Vehículo de movimiento lento" (un triángulo
    naranja con borde rojo) en la parte trasera de un vehículo en Kansas, este identifica
    a un vehículo que viaja a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio en los vehículos
    diseñados para viajar a velocidades de 25 mph o menos.
- id: 205
  category: signs_and_signals
  question: 'Una línea blanca continua pintada a través de la carretera en una intersección
    en Kansas se conoce como:'
  choices:
    A: Línea de cruce peatonal
    B: Línea de alto (Stop line)
    C: Línea de ceder el paso
    D: Divisor de carril
  answer: B
  explanation: Una línea blanca continua a través de un carril en una intersección
    es una línea de alto, que indica dónde debe detener su vehículo ante una señal
    de alto o una luz roja.
- id: 206
  category: signs_and_signals
  question: En Kansas, ¿qué significan las líneas amarillas dobles continuas en el
    centro de la carretera?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Está prohibido rebasar en ambas direcciones
    D: Tráfico en un solo sentido
  answer: C
  explanation: Las líneas amarillas dobles continuas indican que no se permite rebasar
    al tráfico que circula en ninguna de las dos direcciones.
- id: 207
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla circular con una "X" negra y las letras
    "RR" en Kansas?
  choices:
    A: Zona de furia al volante (Road Rage)
    B: Carretera restringida
    C: Cruce de ferrocarril más adelante
    D: Carretera en mal estado
  answer: C
  explanation: La señal amarilla circular con una X negra y RR es una señal de advertencia
    anticipada de cruce de ferrocarril.
- id: 208
  category: signs_and_signals
  question: Al acercarse a una rotonda en Kansas, ¿qué significa una línea blanca
    discontinua a través del carril de entrada?
  choices:
    A: Usted tiene el derecho de paso
    B: Debe detenerse antes de entrar
    C: Debe ceder el paso al tráfico que ya está en la rotonda
    D: El carril está cerrado
  answer: C
  explanation: Las líneas blancas discontinuas en la entrada de una rotonda indican
    que debe ceder el paso al tráfico que ya está circulando dentro de la rotonda.
- id: 209
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para indicar que se va a detener o a
    disminuir la velocidad en Kansas?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho extendido recto hacia afuera
  answer: C
  explanation: Para señalar una parada o una disminución de velocidad mediante señales
    manuales, extienda el brazo izquierdo hacia abajo con la palma de la mano hacia
    atrás.
- id: 210
  category: signs_and_signals
  question: En Kansas, ¿de qué color son las "Señales de servicio" que proporcionan
    información sobre gasolina, comida y alojamiento?
  choices:
    A: Verde
    B: Azul
    C: Marrón
    D: Amarillo
  answer: B
  explanation: Las señales azules se utilizan para proporcionar información sobre
    servicios para el viajero, como combustible, comida, alojamiento e instalaciones
    médicas.
- id: 211
  category: signs_and_signals
  question: 'Una señal en forma de banderín (triángulo isósceles que apunta a la derecha)
    situada en el lado izquierdo de una carretera de Kansas indica:'
  choices:
    A: Una zona escolar
    B: Una zona de no rebasar
    C: Un requisito de ceder el paso
    D: Un callejón sin salida
  answer: B
  explanation: Una señal en forma de banderín se coloca en el lado izquierdo de la
    carretera para marcar el comienzo de una zona de no rebasar (no adelantar).
- id: 212
  category: signs_and_signals
  question: ¿Qué significa una flecha verde fija que apunta a la izquierda en una
    intersección de Kansas?
  choices:
    A: Puede girar a la izquierda después de ceder el paso al tráfico en sentido contrario
    B: Usted tiene un giro protegido; el tráfico en sentido contrario está detenido
      por una luz roja
    C: Debe detenerse y esperar a una luz verde sólida
    D: El giro es solo para vehículos de emergencia
  answer: B
  explanation: Una flecha verde significa que tiene un giro 'protegido', lo que significa
    que el tráfico en sentido contrario está detenido y usted puede avanzar en la
    dirección de la flecha.
- id: 213
  category: signs_and_signals
  question: En Kansas, al usar señales manuales para indicar un giro, ¿qué posición
    representa un giro a la izquierda?
  choices:
    A: Brazo extendido hacia arriba
    B: Brazo extendido hacia abajo
    C: Brazo extendido horizontalmente fuera de la ventana
    D: Brazo movido en movimiento circular
  answer: C
  explanation: Según el Manual de Conducción de Kansas, un giro a la izquierda se
    indica extendiendo el brazo izquierdo y la mano horizontalmente fuera de la ventana.
- id: 214
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico amarilla intermitente en una intersección
    de Kansas?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Acelerar para despejar la intersección
    C: Proceder con precaución
    D: Ceder el paso a todo el tráfico, luego girar a la izquierda
  answer: C
  explanation: Una luz amarilla intermitente en Kansas indica que debe reducir la
    velocidad y proceder con precaución a través de la intersección.
- id: 215
  category: signs_and_signals
  question: Una señal de 'Zona de no rebasar' en Kansas tiene una forma y ubicación
    únicas. ¿Cuál es su forma y ubicación?
  choices:
    A: Forma de diamante, colocada en el lado derecho de la carretera
    B: Forma de banderín, colocada en el lado izquierdo de la carretera
    C: Forma rectangular, colocada en el lado derecho de la carretera
    D: Forma circular, colocada en el lado izquierdo de la carretera
  answer: B
  explanation: En Kansas, la señal de 'Zona de no rebasar' es una señal amarilla en
    forma de banderín colocada en el lado izquierdo de la carretera para marcar el
    inicio de una zona donde está prohibido adelantar.
- id: 216
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de tráfico en forma de pentágono
    (cinco lados) en Kansas?
  choices:
    A: Ceder el paso
    B: Cruce de ferrocarril más adelante
    C: Zona escolar o cruce escolar
    D: Zona de no rebasar
  answer: C
  explanation: Una señal de cinco lados (pentágono) indica una zona escolar o un cruce
    escolar.
- id: 217
  category: signs_and_signals
  question: 'Un triángulo naranja reflectante con un borde rojo en la parte trasera
    de un vehículo en Kansas indica:'
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo es un vehículo de movimiento lento (25 mph o menos)
    C: El vehículo es una carga de gran tamaño
    D: El vehículo es un conductor estudiante
  answer: B
  explanation: El emblema de vehículo de movimiento lento es un triángulo naranja
    reflectante que se utiliza en vehículos diseñados para viajar a velocidades de
    25 mph o menos, como la maquinaria agrícola.
- id: 218
  category: signs_and_signals
  question: 'Cuando vea una señal de ''aspa'' (Crossbuck) en un cruce de ferrocarril
    en Kansas, usted debe:'
  choices:
    A: Detenerse siempre, incluso si no viene ningún tren
    B: Tratarla como una señal de ceder el paso y estar preparado para detenerse ante
      un tren
    C: Acelerar para cruzar las vías rápidamente
    D: Ignorarla si no hay luces intermitentes
  answer: B
  explanation: Una señal de aspa de ferrocarril es una señal reguladora que debe tratarse
    como una señal de ceder el paso; los conductores deben ceder el paso a cualquier
    tren que se aproxime.
- id: 219
  category: signs_and_signals
  question: ¿Qué significan las líneas blancas discontinuas en una carretera de carriles
    múltiples en Kansas?
  choices:
    A: El tráfico se mueve en direcciones opuestas
    B: El tráfico se mueve en la misma dirección
    C: El borde de la calzada
    D: Un cruce peatonal
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección donde se permite el cambio de carril.
- id: 220
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de una línea blanca continua pintada en
    el borde derecho de una carretera de Kansas?
  choices:
    A: Indicar dónde se permite rebasar
    B: Marcar el borde del carril de circulación (línea de niebla o 'fog line')
    C: Separar el tráfico que se mueve en direcciones opuestas
    D: Indicar un carril exclusivo para bicicletas
  answer: B
  explanation: Las líneas blancas continuas a lo largo del lado derecho de la carretera
    se denominan líneas de borde o 'líneas de niebla' (fog lines) y ayudan a los conductores
    a ver dónde se encuentra el borde de la carretera por la noche o con mal tiempo.
- id: 221
  category: signs_and_signals
  question: 'Una señal de tráfico de Kansas que tiene forma de diamante y es de color
    naranja se utiliza para:'
  choices:
    A: Información reglamentaria
    B: Advertencia general de peligros
    C: Zonas de trabajo de construcción y mantenimiento
    D: Información de guía para viajeros
  answer: C
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para advertir a los conductores sobre condiciones en zonas de trabajo de construcción
    o mantenimiento.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 222
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 223
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 224
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 225
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda únicamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 226
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 227
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 228
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 229
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro con forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 230
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que deben hacer los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "MANTÉNGASE A LA DERECHA" (KEEP RIGHT)
    con una flecha significa que debe mantenerse al lado derecho de una isla de tráfico,
    mediana u obstrucción.
  id: 231
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 232
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 233
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 234
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 235
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras "R" es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 236
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca un tren,
    debe detenerse.
  id: 237
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 238
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 239
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera curve
    primero en un sentido y luego en el otro.
  id: 240
- image: winding_road.png
  category: signs_and_signals
  id: 241
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
- image: merge.png
  category: signs_and_signals
  id: 242
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
- image: road_narrows.png
  category: signs_and_signals
  id: 243
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la carretera y
    ajuste su posición en el carril.
- image: divided_highway.png
  category: signs_and_signals
  id: 244
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
- image: divided_highway_ends.png
  category: signs_and_signals
  id: 245
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
- image: two_way_traffic.png
  category: signs_and_signals
  id: 246
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
- image: slippery_when_wet.png
  category: signs_and_signals
  id: 247
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
- image: hill.png
  category: signs_and_signals
  id: 248
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
- image: signal_ahead.png
  category: signs_and_signals
  id: 249
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un puesto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca
    donde el semáforo puede no ser visible desde la distancia.
- image: stop_ahead.png
  category: signs_and_signals
  id: 250
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (bache)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 251
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 252
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 253
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 254
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 255
