metadata:
  source: 2025 Kansas Driving Handbook (ksrevenue.gov)
  source_original: 2025 Kansas Driving Handbook (ksrevenue.gov)
  total_questions: 484
  language: es
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
  - vehicle_operation
questions:
- id: 1
  category: safe_driving_rules
  question: ¿Según el Manual de Conducción de Kansas, qué medida ha tomado la Legislatura
    de Kansas con respecto a enviar mensajes de texto mientras se conduce?
  choices:
    A: Solo se permite a conductores experimentados.
    B: Está prohibido porque distrae peligrosamente a los conductores.
    C: Se permite si se utiliza un dispositivo de manos libres.
    D: Solo está prohibido en zonas escolares.
  answer: B
  explanation: La carta del Gobernador señala que la Legislatura de Kansas actualizó
    las leyes de tránsito para prohibir el envío de mensajes de texto al conducir,
    ya que puede distraer peligrosamente a los conductores de la carretera.
- id: 2
  category: vehicle_information
  question: ¿Aproximadamente cuántas millas de carreteras hay en Kansas, según la
    introducción del manual?
  choices:
    A: 50,000 millas
    B: 100,000 millas
    C: 141,000 millas
    D: 200,000 millas
  answer: C
  explanation: La introducción establece que Kansas tiene aproximadamente 141,000
    millas de carreteras que mantienen en movimiento la economía del estado.
- id: 3
  category: license_system
  question: ¿Cuál es el sitio web oficial proporcionado en el manual para que el Departamento
    de Ingresos de Kansas responda preguntas y brinde acceso a servicios?
  choices:
    A: ksvehicles.com
    B: kansas.gov/dmv
    C: ksrevenue.gov
    D: ksdriving.org
  answer: C
  explanation: La carta del Gobernador invita a los conductores a visitar ksrevenue.gov
    para obtener respuestas a sus preguntas y acceder a los servicios de la División
    de Vehículos.
- id: 4
  category: license_system
  question: ¿Qué división dentro del Departamento de Ingresos de Kansas se esfuerza
    por hacer que su experiencia sea más rápida y conveniente?
  choices:
    A: División de Vehículos
    B: División de Transporte
    C: División de Seguridad Vial
    D: División de Automovilistas
  answer: A
  explanation: La carta menciona que el Departamento de Ingresos de Kansas se esfuerza
    por hacer que su experiencia con la División de Vehículos sea más rápida, fácil
    de usar y conveniente.
- id: 5
  category: license_system
  question: ¿Qué tipo de manual del conductor es este manual específico?
  choices:
    A: Manual del Conductor Comercial
    B: Manual del Operador de Motocicletas
    C: Manual del Conductor No Comercial
    D: Manual de Chófer
  answer: C
  explanation: La página del título identifica el documento específicamente como el
    "Manual del Conductor No Comercial".
- id: 6
  category: alcohol_drugs_health
  question: '¿Según el Índice, cuál de los siguientes temas se trata en la Sección
    3: "Estar en condiciones para conducir"?'
  choices:
    A: Señales de tráfico
    B: Fatiga
    C: Leyes de seguridad para niños pasajeros
    D: Retroceder
  answer: B
  explanation: El Índice enumera la "Fatiga" bajo la SECCIÓN 3- Estar en condiciones
    para conducir.
- id: 7
  category: safe_driving_rules
  question: Según el Índice, ¿dónde encontraría información sobre las "Leyes de seguridad
    para niños pasajeros"?
  choices:
    A: Sección 1- La licencia de conducir
    B: Sección 3- Estar en condiciones para conducir
    C: Sección 4- Antes de conducir
    D: Sección 6- Reglas de la carretera
  answer: C
  explanation: El Índice enumera las "Leyes de seguridad para niños pasajeros" bajo
    la SECCIÓN 4- Antes de conducir.
- id: 8
  category: vehicle_information
  question: '¿Cuál de los siguientes se enumera como un tema bajo la Sección 5: "Conducción
    básica" en el Índice?'
  choices:
    A: Dirección (Steering)
    B: Bolsas de aire
    C: Conducción agresiva
    D: Derecho de paso
  answer: A
  explanation: El Índice enumera "Dirección" (Steering) como un tema bajo la SECCIÓN
    5- Conducción básica.
- id: 9
  category: signs_and_signals
  question: ¿Según el Índice, qué sección cubre los "Dispositivos de control de tráfico"
    y las "Marcas en el pavimento"?
  choices:
    A: Sección 2
    B: Sección 4
    C: Sección 5
    D: Sección 6
  answer: D
  explanation: Los "Dispositivos de control de tráfico" y las "Marcas en el pavimento"
    se enumeran en la SECCIÓN 6- Reglas de la carretera.
- id: 10
  category: penalties_and_points
  question: ¿En qué sección del manual puede un conductor encontrar información sobre
    la "Pérdida de privilegios de conducción"?
  choices:
    A: Sección 1- La licencia de conducir
    B: Sección 3- Estar en condiciones para conducir
    C: Sección 5- Conducción básica
    D: Sección 6- Reglas de la carretera
  answer: A
  explanation: El Índice enumera la "Pérdida de privilegios de conducción" bajo la
    SECCIÓN 1- La licencia de conducir.
- id: 11
  category: alcohol_drugs_health
  question: Según el índice, ¿el tema "Alcohol, otras drogas y la conducción" está
    agrupado con qué otros temas en la Sección 3?
  choices:
    A: Arranque y parada
    B: Visión y audición
    C: Señales y semáforos de tráfico
    D: Bolsas de aire y cinturones de seguridad
  answer: B
  explanation: '"Alcohol, otras drogas y la conducción" se encuentra en la Sección
    3, que también incluye temas relacionados con la salud como "Visión" y "Audición".'
- id: 12
  category: sharing_the_road
  question: Según el índice, ¿en qué sección se incluyen las "Reglas para autobuses
    escolares"?
  choices:
    A: Sección 2- Leyes estatales/provinciales/del territorio
    B: Sección 4- Antes de conducir
    C: Sección 5- Conducción básica
    D: Sección 6- Reglas de la carretera
  answer: D
  explanation: El índice ubica las "Reglas para autobuses escolares" bajo la SECCIÓN
    6- Reglas de la carretera.
- id: 13
  category: driver_responsibility
  question: ¿Por qué la Legislatura de Kansas actualizó las leyes de conducción para
    prohibir el envío de mensajes de texto mientras se conduce?
  choices:
    A: Para aumentar los ingresos por multas de tráfico
    B: Porque un número creciente de accidentes de tráfico y muertes han sido causados
      por ello
    C: Para fomentar el uso del transporte público
    D: Porque las redes de telefonía celular se estaban sobrecargando
  answer: B
  explanation: La carta del Gobernador establece que las leyes se actualizaron "porque
    un número creciente de accidentes de tráfico y muertes han sido causados por personas
    que envían mensajes de texto mientras conducen".
- id: 14
  category: driver_testing
  question: Según la introducción, ¿en qué se enfoca el examen de conducir para ayudarnos
    a todos a conducir de manera segura?
  choices:
    A: Habilidades avanzadas de reparación mecánica
    B: '"Reglas de la carretera" compartidas'
    C: Memorización del mapa de carreteras del estado
    D: Maniobras evasivas a alta velocidad
  answer: B
  explanation: La introducción establece que el examen de conducir "se enfoca en las
    'reglas de la carretera' compartidas que nos ayudan a todos a conducir de manera
    segura".
- id: 15
  category: license_system
  question: Según el índice, ¿la información sobre "Real ID" se puede encontrar inmediatamente
    después de qué tema?
  choices:
    A: Requisitos de edad
    B: Lista de documentos requeridos
    C: Educación vial
    D: Programación de citas
  answer: B
  explanation: En el índice, la información sobre "Real ID" aparece inmediatamente
    después de la "Lista de documentos requeridos".
- id: 16
  category: license_system
  question: ¿Cuál de los siguientes documentos se puede utilizar para añadir un indicador
    de "VETERANO" (VETERAN) a su identificación?
  choices:
    A: Un pasaporte válido
    B: Un formulario DD-214
    C: Un certificado de nacimiento
    D: Una tarjeta de seguro social
  answer: B
  explanation: Según el manual, si desea un indicador de "VETERANO", debe traer su
    DD-214, NGB-22, identificación de Asuntos de Veteranos o una identificación militar
    de jubilado.
- id: 17
  category: license_system
  question: ¿Qué estado específico debe figurar en un DD-214 o NGB-22 para calificar
    para un indicador de "VETERANO"?
  choices:
    A: Baja general (General Discharge)
    B: Baja médica (Medical Discharge)
    C: Baja honorable (Honorable Discharge)
    D: Baja administrativa (Administrative Discharge)
  answer: C
  explanation: El manual establece que el DD-214 o NGB-22 debe indicar "Baja honorable"
    (Honorable Discharge) para calificar para el indicador de veterano.
- id: 18
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para obtener una licencia comercial
    Clase A, B o C (Interestatal)?
  choices:
    A: 18 años de edad
    B: 19 años de edad
    C: 20 años de edad
    D: 21 años de edad
  answer: D
  explanation: El requisito de edad para una licencia comercial Clase A, B o C (Interestatal)
    es de 21 años de edad o más.
- id: 19
  category: license_system
  question: ¿Qué edad debe tener para obtener una licencia comercial Clase A, B o
    C (Intraestatal)?
  choices:
    A: 16 años de edad
    B: 17 años de edad
    C: 18 años de edad
    D: 21 años de edad
  answer: C
  explanation: El requisito de edad mínima para una licencia comercial Clase A, B
    o C (Intraestatal) es de 18 años de edad o más.
- id: 20
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener una licencia de conducir
    no comercial Clase A o B?
  choices:
    A: 16 años de edad
    B: 17 años de edad
    C: 18 años de edad
    D: 21 años de edad
  answer: C
  explanation: Una licencia no comercial Clase A o B requiere que el solicitante tenga
    18 años de edad o más.
- id: 21
  category: license_system
  question: ¿A qué edad puede un conductor obtener una licencia estándar No Comercial
    Clase C?
  choices:
    A: 15 años de edad
    B: 16 años de edad
    C: 17 años de edad
    D: 18 años de edad
  answer: C
  explanation: El manual establece que el requisito de edad para una licencia No Comercial
    Clase C es de 17 años de edad o más.
- id: 22
  category: license_system
  question: ¿Cuál es la edad mínima para ser elegible para una licencia No Comercial
    Clase C (Restringida)?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 17 años de edad
  answer: B
  explanation: Una licencia No Comercial Clase C (Restringida) requiere que el solicitante
    tenga al menos 15 años de edad.
- id: 23
  category: license_system
  question: ¿Cuántas horas de práctica de manejo deben completarse para obtener una
    licencia No Comercial Clase C (Restringida) a los 15 años?
  choices:
    A: 10 de las 50 horas
    B: 25 de las 50 horas
    C: 40 de las 50 horas
    D: Las 50 horas completas
  answer: B
  explanation: Para obtener una licencia No Comercial Clase C (Restringida) a los
    15 años, debe haber completado 25 de las 50 horas de práctica de manejo.
- id: 24
  category: license_system
  question: Al completar las horas de práctica de manejo requeridas, ¿qué edad mínima
    debe tener el adulto acompañante?
  choices:
    A: 18 años de edad
    B: 19 años de edad
    C: 21 años de edad
    D: 25 años de edad
  answer: C
  explanation: El manual especifica que la práctica de manejo debe realizarse acompañado
    por un adulto que tenga 21 años de edad o más.
- id: 25
  category: license_system
  question: ¿Cuántas de las 50 horas de práctica de manejo requeridas deben completarse
    por la noche para una licencia No Comercial Clase C o M (Privilegios Menos Restringidos)?
  choices:
    A: 5 horas
    B: 10 horas
    C: 15 horas
    D: 20 horas
  answer: B
  explanation: Para una licencia de Privilegios Menos Restringidos, 10 de las 50 horas
    de práctica de manejo deben completarse por la noche.
- id: 26
  category: license_system
  question: ¿Cuál es el requisito de edad para obtener una licencia No Comercial Clase
    C (Permiso Agrícola)?
  choices:
    A: 13 o 14 años de edad
    B: 14 o 15 años de edad
    C: 15 o 16 años de edad
    D: 16 o 17 años de edad
  answer: B
  explanation: El manual establece que el permiso No Comercial Clase C (Permiso Agrícola)
    está disponible para personas que tengan 14 o 15 años de edad.
- id: 27
  category: license_system
  question: ¿Qué edad debe tener una persona para obtener un Permiso de Instrucción
    Comercial (de cualquier clase)?
  choices:
    A: 16 años de edad
    B: 17 años de edad
    C: 18 años de edad
    D: 21 años de edad
  answer: C
  explanation: Un Permiso de Instrucción Comercial (de cualquier clase) requiere que
    el solicitante tenga 18 años de edad o más.
- id: 28
  category: driver_testing
  question: Según el manual, ¿los cursos de educación vial (Driver's Education) en
    línea o por internet cumplen con los requisitos estatales?
  choices:
    A: Sí, si los toma un adulto
    B: Sí, si incluyen un simulador de manejo
    C: No, los cursos por internet no cumplen con los requisitos
    D: Sí, todos los cursos en línea están aprobados
  answer: C
  explanation: El manual establece explícitamente que los cursos por internet no cumplen
    con los requisitos para la educación vial.
- id: 29
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener un Permiso de Instrucción
    Clase C o M en Kansas?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: A
  explanation: Según el manual, la edad mínima para un Permiso de Instrucción Clase
    C o M es de 14 años de edad o más.
- id: 30
  category: driver_testing
  question: ¿Se aceptará un certificado de finalización de un curso de educación vial
    por internet para obtener la licencia en Kansas?
  choices:
    A: Sí, si es un sitio web aprobado por el estado.
    B: Sí, pero solo para solicitantes mayores de 18 años.
    C: No, los cursos por internet no cumplen con los requisitos para una licencia
      de conducir en Kansas.
    D: No, a menos que vaya acompañado de una declaración jurada de los padres.
  answer: C
  explanation: El manual establece que los cursos por internet no cumplen con los
    requisitos para una licencia de conducir en Kansas, y no se aceptará un certificado
    de finalización de un curso de educación vial por internet.
- id: 31
  category: driver_testing
  question: ¿Cuántas horas de instrucción deben ofrecer las escuelas privadas de educación
    vial aprobadas?
  choices:
    A: 10 horas de clase y 4 horas al volante
    B: 8 horas de clase y 6 horas al volante
    C: 6 horas de clase y 8 horas al volante
    D: 12 horas de clase y 6 horas al volante
  answer: B
  explanation: Las escuelas privadas de educación vial aprobadas deben ofrecer 8 horas
    de instrucción en el aula y 6 horas de instrucción al volante.
- id: 32
  category: license_system
  question: ¿De cuántos días dispone para obtener una licencia de conducir de Kansas
    después de mudarse al estado?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Se requiere que obtenga una licencia de conducir de Kansas dentro de
    los 90 días posteriores a su mudanza al estado.
- id: 33
  category: license_system
  question: Para calificar para un Permiso Agrícola (Farm Permit), el solicitante
    debe residir o estar empleado en una granja. ¿Cuál es el requisito de tamaño mínimo
    para la granja?
  choices:
    A: 10 acres
    B: 20 acres
    C: 40 acres
    D: 50 acres
  answer: B
  explanation: El manual define una granja, para los fines de un Permiso Agrícola
    (Farm Permit), como un terreno de al menos 20 acres utilizado en operaciones agrícolas.
- id: 34
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una restricción de conducción para un joven
    de 14 o 15 años con un Permiso Agrícola (Farm Permit)?
  choices:
    A: Pueden conducir hacia y desde actividades escolares.
    B: Pueden llevar hasta dos pasajeros menores que no sean hermanos.
    C: Pueden conducir directamente hacia y desde el hogar y la escuela únicamente
      para asistir a clases.
    D: Pueden usar un dispositivo inalámbrico para fines de navegación.
  answer: C
  explanation: Un joven de 14 o 15 años con un Permiso Agrícola (Farm Permit) puede
    conducir directamente hacia y desde el hogar y la escuela por la ruta más directa
    con el propósito de asistir a clases, pero no para actividades escolares.
- id: 35
  category: driver_testing
  question: Antes de que un joven de 16 o 17 años pueda conducir bajo las restricciones
    menores de un Permiso Agrícola (Farm Permit), un padre o tutor debe firmar una
    declaración jurada que certifique al menos 50 horas de tiempo de conducción. ¿Cuántas
    de esas horas deben ser nocturnas?
  choices:
    A: 5 horas
    B: 10 horas
    C: 15 horas
    D: 20 horas
  answer: B
  explanation: El padre o tutor debe firmar una declaración jurada que certifique
    al menos 50 horas de tiempo de conducción, con al menos 10 horas nocturnas, antes
    de que el solicitante pueda conducir bajo las restricciones menores.
- id: 36
  category: license_system
  question: Al conducir con un Permiso de Instrucción (Clase C o M), ¿cuáles son los
    requisitos para el adulto supervisor en el asiento delantero?
  choices:
    A: Debe tener al menos 18 años y una licencia válida.
    B: Debe tener al menos 21 años y contar con al menos un año de experiencia de
      conducción.
    C: Debe ser un padre o tutor legal.
    D: Debe tener al menos 25 años.
  answer: B
  explanation: El adulto con licencia que supervisa al titular de un Permiso de Instrucción
    debe tener al menos 21 años y contar con al menos un año de experiencia de conducción.
- id: 37
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Instrucción Clase C o M antes
    de que expire?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 4 años
  answer: B
  explanation: Un Permiso de Instrucción (Clase C o M) vence en 1 año y puede renovarse
    mediante exámenes.
- id: 38
  category: driver_testing
  question: ¿Cuántas horas de conducción supervisada debe completar un solicitante
    de 15 años para obtener una Licencia Restringida?
  choices:
    A: 10 horas
    B: 25 horas
    C: 40 horas
    D: 50 horas
  answer: B
  explanation: Según el manual, los solicitantes de 15 años para una Licencia Restringida
    deben haber completado 25 horas de conducción supervisada.
- id: 39
  category: safe_driving_rules
  question: ¿Cuántos pasajeros menores que no sean hermanos se le permite tener en
    el vehículo a un joven de 16 años con una Licencia Restringida?
  choices:
    A: Ninguno
    B: Solo uno
    C: Hasta dos
    D: Tantos como cinturones de seguridad haya
  answer: B
  explanation: A un joven de 16 años con una Licencia Restringida se le permite solo
    un pasajero menor que no sea su hermano en el vehículo.
- id: 40
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias puede un joven de 15 años con una Licencia Restringida
    usar un dispositivo de comunicación inalámbrica mientras conduce?
  choices:
    A: Cuando usa un accesorio de manos libres.
    B: Cuando está detenido en un semáforo en rojo.
    C: Solo para denunciar una actividad ilegal o solicitar ayuda de emergencia.
    D: Nunca, bajo ninguna circunstancia.
  answer: C
  explanation: Las restricciones de conducción establecen que NO se permiten dispositivos
    de comunicación inalámbrica mientras se conduce, excepto para denunciar una actividad
    ilegal o solicitar ayuda de emergencia.
- id: 41
  category: license_system
  question: ¿Cuál de las siguientes condiciones le impedirá obtener una licencia de
    conducir de Kansas?
  choices:
    A: Tener multas impagas por infracciones de tránsito en movimiento.
    B: Tener 16 años de edad.
    C: Haber completado un curso de educación vial aprobado.
    D: Entregar una tarjeta de identificación que poseía anteriormente.
  answer: A
  explanation: Puede obtener una licencia de conducir si no tiene multas impagas por
    infracciones de tránsito en movimiento. Tener multas impagas lo descalifica.
- id: 42
  category: safe_driving_rules
  question: ¿En qué horario se le permite conducir a un joven de 16 años con una licencia
    restringida (Restricted License) sin estar acompañado por un adulto con licencia,
    por motivos que no sean escolares, laborales o actividades religiosas?
  choices:
    A: De 6 a.m. a 8 p.m.
    B: De 5 a.m. a 9 p.m.
    C: De 7 a.m. a 10 p.m.
    D: De 5 a.m. a 11 p.m.
  answer: B
  explanation: Un joven de 16 años con una licencia restringida puede conducir en
    cualquier momento desde las 5 a.m. hasta las 9 p.m.
- id: 43
  category: alcohol_drugs_health
  question: ¿Qué departamento estatal coordina las audiencias administrativas sobre
    fallos en pruebas químicas y rechazos de pruebas?
  choices:
    A: Departamento de Transporte
    B: Servicios al Conductor (Driver Services)
    C: Departamento de Educación
    D: Patrulla de Caminos (Highway Patrol)
  answer: B
  explanation: Servicios al Conductor (Driver Services) coordina las audiencias administrativas
    sobre fallos en pruebas químicas y rechazos de pruebas, y gestiona los requisitos
    de comprobante de seguro.
- id: 44
  category: license_system
  question: ¿Cuál de las siguientes es la edad mínima para obtener una licencia de
    conducir sin restricciones (Unrestricted Driver's License) en Kansas?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: B
  explanation: La edad mínima para obtener una licencia de conducir sin restricciones
    en Kansas es de 17 años.
- id: 45
  category: license_system
  question: Para los solicitantes menores de 18 años que buscan una licencia sin restricciones,
    ¿cuántas horas de conducción nocturna debe certificar un padre o tutor?
  choices:
    A: 5 horas
    B: 10 horas
    C: 15 horas
    D: 50 horas
  answer: B
  explanation: Un padre o tutor debe firmar una declaración jurada que certifique
    al menos 50 horas de tiempo de conducción, con al menos 10 horas de noche, para
    los solicitantes menores de 18 años.
- id: 46
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para aprobar el examen de la vista
    de la licencia de conducir?
  choices:
    A: 20/20 en ambos ojos
    B: 20/30 en ambos ojos
    C: 20/40 en un ojo
    D: 20/50 en un ojo
  answer: C
  explanation: La visión debe ser de al menos 20/40 en un ojo al realizar el examen
    en la estación de licencias de conducir, con o sin corrección.
- id: 47
  category: driver_testing
  question: ¿Cuántas preguntas tiene el examen de conocimientos para conductores de
    Kansas?
  choices:
    A: '20'
    B: '25'
    C: '30'
    D: '50'
  answer: B
  explanation: El examen de conocimientos requiere que responda 25 preguntas sobre
    las leyes de tránsito e identifique ciertas señales.
- id: 48
  category: driver_testing
  question: Si reprueba el examen escrito o el de conducción cuatro veces, ¿cuánto
    tiempo debe esperar antes de volver a realizarlo?
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Después de la cuarta vez que repruebe cualquiera de los exámenes, debe
    esperar un mínimo de seis (6) meses desde el examen fallido más reciente antes
    de volver a intentarlo.
- id: 49
  category: driver_testing
  question: ¿Qué se requiere si su licencia de conducir ha estado vencida por más
    de un año?
  choices:
    A: Debe pagar una multa de $50
    B: Debe completar un curso de conducción defensiva
    C: Debe someterse a todas las pruebas, incluidos los exámenes de la vista, escrito
      y de conducción
    D: Debe esperar 6 meses antes de solicitar una nueva licencia
  answer: C
  explanation: Si la licencia de conducir ha estado vencida por más de 1 año, se requerirá
    realizar todas las pruebas, lo que incluye los exámenes de la vista, escrito y
    de conducción.
- id: 50
  category: penalties_and_points
  question: ¿Sus privilegios de conducir pueden ser suspendidos si es condenado por
    cuántas infracciones de tránsito en movimiento dentro de un período de doce meses?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Sus privilegios de conducir pueden ser suspendidos por la condena de
    tres (3) infracciones de tránsito en movimiento dentro de un período de doce meses.
- id: 51
  category: penalties_and_points
  question: ¿Cuál es la sanción por la primera negativa a someterse a una prueba química
    para determinar el contenido de alcohol o drogas?
  choices:
    A: Una suspensión de 6 meses
    B: Una suspensión obligatoria de 1 año
    C: Una suspensión obligatoria de 2 años
    D: Revocación permanente
  answer: B
  explanation: Negarse a someterse a una prueba química conlleva una suspensión obligatoria
    de 1 año por la primera negativa.
- id: 52
  category: penalties_and_points
  question: 'No mantener un seguro de responsabilidad civil continuo en su vehículo
    resultará en:'
  choices:
    A: Una carta de advertencia
    B: Una suspensión de 30 días
    C: Una suspensión obligatoria indefinida
    D: Una revocación permanente
  answer: C
  explanation: No mantener un seguro de responsabilidad civil continuo en su vehículo
    conlleva una suspensión obligatoria indefinida.
- id: 53
  category: penalties_and_points
  question: ¿Cuál de las siguientes condenas resultará en la revocación de sus privilegios
    de conducción?
  choices:
    A: Transportar un recipiente abierto de licor
    B: No informar de un accidente de tráfico
    C: No comparecer a una cita judicial
    D: Intentar eludir a un oficial de policía
  answer: D
  explanation: Intentar eludir a un oficial de policía figura como una infracción
    que puede dar lugar a la revocación de sus privilegios de conducción. Las otras
    opciones resultan en suspensión.
- id: 54
  category: penalties_and_points
  question: ¿Qué resultará en una revocación permanente de la licencia en Kansas?
  choices:
    A: Una tercera infracción de tránsito en 12 meses
    B: Un quinto resultado de prueba de .08 o superior o la negativa a someterse a
      pruebas químicas
    C: No mantener el seguro de responsabilidad civil dos veces
    D: Transportar un recipiente abierto de licor
  answer: B
  explanation: Un quinto resultado de prueba de .08 o superior o la negativa a someterse
    a pruebas químicas para determinar el contenido de alcohol/drogas en la sangre
    resultará en una revocación permanente de la licencia.
- id: 55
  category: license_system
  question: 'Los turistas extranjeros, profesores o empresarios con documentos de
    inmigración válidos pueden conducir en Kansas con una licencia extranjera o de
    otro estado válida existente por hasta:'
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Los extranjeros (turistas, profesores o empresarios extranjeros) que
    estén aquí por hasta un año y posean documentos de inmigración válidos pueden
    conducir con una licencia válida si tienen al menos 16 años.
- id: 56
  category: license_system
  question: ¿Cuál es la clasificación de peso bruto vehicular máximo que puede operar
    con una licencia de conducir Clase C?
  choices:
    A: Menos de 10,000 libras
    B: Menos de 26,001 libras
    C: Más de 26,001 libras
    D: Cualquier peso independientemente del tamaño
  answer: B
  explanation: Según el manual, una licencia de conducir Clase C le permite operar
    vehículos con una clasificación de peso bruto vehicular de menos de 26,001 libras.
- id: 57
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en cualquier distrito urbano en Kansas?
  choices:
    A: 20 millas por hora
    B: 25 millas por hora
    C: 30 millas por hora
    D: 35 millas por hora
  answer: C
  explanation: El manual establece que, a menos que se indique lo contrario, el límite
    de velocidad máximo en pueblos o ciudades es de treinta (30) millas por hora en
    cualquier distrito urbano.
- id: 58
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en cualquier carretera de condado
    o municipio (Township) a menos que se indique lo contrario?
  choices:
    A: 45 millas por hora
    B: 55 millas por hora
    C: 65 millas por hora
    D: 75 millas por hora
  answer: B
  explanation: El manual establece el límite de velocidad máximo en cincuenta y cinco
    (55) millas por hora en cualquier carretera de condado o municipio, a menos que
    se indique lo contrario.
- id: 59
  category: penalties_and_points
  question: Según la ley de Kansas, el uso del cinturón de seguridad es una 'Infracción
    Primaria' (Primary Violation). ¿Qué significa esto?
  choices:
    A: Un vehículo puede ser detenido únicamente si un oficial ve a un adulto sin
      cinturón en el asiento delantero o a un niño sin protección.
    B: Solo se le puede multar por una infracción del cinturón de seguridad si primero
      lo detienen por exceso de velocidad.
    C: Solo el conductor está obligado a usar el cinturón de seguridad.
    D: Las infracciones del cinturón de seguridad resultan en una suspensión inmediata
      de la licencia.
  answer: A
  explanation: El uso del cinturón de seguridad es una 'Infracción Primaria' en Kansas,
    lo que significa que si un oficial de la ley ve a un adulto sin protección en
    un asiento delantero o a un niño sin protección en cualquier lugar del vehículo,
    el vehículo puede ser detenido únicamente por esa infracción.
- id: 60
  category: safe_driving_rules
  question: ¿A qué edad debe un niño estar sujeto en un asiento de seguridad para
    niños o asiento elevado (booster seat) aprobado por el gobierno federal, a menos
    que mida más de 4'9" o pese más de 80 libras?
  choices:
    A: Menores de 4 años de edad
    B: De 4 a 8 años de edad
    C: De 8 a 12 años de edad
    D: De 12 a 16 años de edad
  answer: B
  explanation: El manual establece que todos los niños de 4 a 8 años de edad deben
    estar sujetos en un asiento de seguridad para niños o asiento elevado aprobado
    por el gobierno federal, a menos que el niño mida más de 4'9" O pese más de 80
    libras.
- id: 61
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalizar su intención de girar o cambiar
    de carril?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: Todas las señales deben hacerse al menos 100 pies antes de realizar
    el movimiento o giro real.
- id: 62
  category: safe_driving_rules
  question: 'No debe realizar un giro en "U" en ningún lugar donde no pueda ser visto
    por otros conductores durante al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: 'El manual establece: "No realice un giro en U en una curva, cerca
    de la cima de una colina o en cualquier lugar donde no pueda ser visto por otros
    conductores durante al menos 500 pies".'
- id: 63
  category: safe_driving_rules
  question: Al rebasar a otro vehículo en una carretera de dos carriles, ¿cuándo es
    seguro regresar al carril derecho?
  choices:
    A: Tan pronto como pase el parachoques trasero del vehículo rebasado
    B: Cuando pueda ver toda la parte delantera del vehículo que acaba de rebasar
      en su espejo retrovisor
    C: Después de haber recorrido 100 pies más allá del vehículo
    D: Cuando el vehículo rebasado parpadee sus luces delanteras
  answer: B
  explanation: El manual instruye a los conductores a no regresar al carril derecho
    demasiado pronto; espere hasta que pueda ver toda la parte delantera del vehículo
    que acaba de rebasar en su espejo retrovisor.
- id: 64
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones NO se le permite rebasar a otro
    vehículo?
  choices:
    A: En una calle de sentido único
    B: A menos de 100 pies de cruzar cualquier intersección o cruce de ferrocarril
      a nivel
    C: Cuando el vehículo de adelante circula por debajo del límite de velocidad
    D: En una carretera de varios carriles que se mueven en la misma dirección
  answer: B
  explanation: No puede rebasar a menos de 100 pies de cruzar cualquier intersección
    o cruce de ferrocarril a nivel.
- id: 65
  category: signs_and_signals
  question: ¿Qué forma tiene la señal de advertencia de "Zona de no rebasar" (No Passing
    Zone)?
  choices:
    A: Diamante
    B: Octágono
    C: Banderín
    D: Rectángulo
  answer: C
  explanation: El manual establece que la de "Zona de no rebasar" es la única señal
    de advertencia con forma de banderín.
- id: 66
  category: defensive_driving
  question: ¿Qué regla de distancia de seguimiento debe utilizar en condiciones climáticas
    adversas?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de los cuatro segundos
    D: La regla de los seis segundos
  answer: C
  explanation: Si bien la regla de los dos segundos es para condiciones óptimas, el
    manual establece el uso de una regla de seguimiento de cuatro segundos en condiciones
    adversas.
- id: 67
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un vehículo de emergencia se acerca por detrás
    mostrando luces rojas intermitentes y/o haciendo sonar una sirena?
  choices:
    A: Aumentar la velocidad para mantenerse por delante del vehículo
    B: Detenerse inmediatamente en su carril actual
    C: Conducir inmediatamente hacia la derecha y detenerse sin bloquear ninguna intersección
    D: Moverse al carril izquierdo y reducir la velocidad
  answer: C
  explanation: Cuando un vehículo de emergencia viene hacia usted o se acerca por
    detrás mostrando luces rojas intermitentes y/o haciendo sonar una sirena, debe
    conducir inmediatamente hacia la derecha y detenerse sin bloquear ninguna intersección.
- id: 68
  category: sharing_the_road
  question: ¿Cuándo NO se requiere que se detenga ante un autobús escolar que está
    detenido para recoger o dejar niños?
  choices:
    A: Cuando viaja en la misma dirección que el autobús
    B: Cuando se aproxima al autobús en la calzada opuesta de una carretera dividida
    C: Cuando se encuentra en una carretera de dos carriles
    D: Cuando el autobús está detenido en un distrito residencial
  answer: B
  explanation: El tráfico que se aproxima a un autobús escolar en la calzada opuesta
    de una carretera dividida no está obligado a detenerse.
- id: 69
  category: safe_driving_rules
  question: Cuando dos vehículos entran en una intersección desde diferentes calzadas
    aproximadamente al mismo tiempo sin controles de tráfico, ¿quién tiene el derecho
    de paso?
  choices:
    A: El conductor de la derecha deberá ceder el paso al vehículo de la izquierda
    B: El conductor de la izquierda deberá ceder el paso al vehículo de la derecha
    C: El vehículo que viaja más rápido tiene el derecho de paso
    D: El vehículo más grande tiene el derecho de paso
  answer: B
  explanation: Cuando dos vehículos entran en una intersección desde diferentes calzadas
    aproximadamente al mismo tiempo, el conductor de la izquierda deberá ceder el
    derecho de paso al vehículo de la derecha.
- id: 70
  category: safe_driving_rules
  question: 'La ley de velocidad básica de Kansas exige que usted:'
  choices:
    A: Conduzca siempre al límite de velocidad indicado, independientemente del clima
    B: Nunca conduzca a una velocidad mayor de lo que sea razonable y prudente bajo
      las condiciones existentes en ese momento
    C: Conduzca 5 mph por debajo del límite de velocidad por la noche
    D: Iguale la velocidad de los vehículos a su alrededor
  answer: B
  explanation: La ley de velocidad básica de Kansas exige que nunca conduzca un vehículo
    a una velocidad mayor de lo que sea razonable y prudente bajo las condiciones
    existentes en ese momento.
- id: 71
  category: safe_driving_rules
  question: ¿Si se aproxima a un vehículo de emergencia estacionado con luces intermitentes
    en una autopista de varios carriles, cuál es la acción preferida?
  choices:
    A: Tocar la bocina para alertar a los trabajadores de emergencia
    B: Detenerse inmediatamente en su carril actual
    C: Cambiarse a un carril que no esté junto al vehículo de emergencia detenido
    D: Mantener su velocidad y permanecer en el carril junto al vehículo
  answer: C
  explanation: Al aproximarse por detrás a un vehículo de emergencia estacionado en
    una calle o autopista con dos o más carriles en cada dirección, debe proceder
    con la debida precaución y cambiarse a un carril que no esté junto al vehículo
    de emergencia detenido.
- id: 72
  category: safe_driving_rules
  question: Si un vehículo que gira a la izquierda y un vehículo que sigue recto entran
    en una intersección desde direcciones opuestas al mismo tiempo, ¿quién debe ceder
    el paso?
  choices:
    A: El vehículo que sigue recto
    B: El vehículo que gira a la izquierda
    C: El vehículo a la derecha
    D: Ninguno de los vehículos
  answer: B
  explanation: El conductor de un vehículo que gira a la izquierda debe ceder el derecho
    de paso a los vehículos que se aproximan desde la dirección opuesta. Si ambos
    autos entran al mismo tiempo, el auto que sigue recto tiene el derecho de paso.
- id: 73
  category: safe_driving_rules
  question: Usted tiene luz verde en una intersección, pero el tráfico está congestionado
    y no hay suficiente espacio para su vehículo al otro lado. ¿Qué debe hacer?
  choices:
    A: Entrar en la intersección y esperar a que el tráfico se despeje
    B: Tocar la bocina hasta que el tráfico avance
    C: No entrar en la intersección hasta que haya suficiente espacio al otro lado
    D: Avanzar hacia el paso de peatones y esperar
  answer: C
  explanation: 'El manual establece explícitamente: "No entre en una intersección,
    paso de peatones o cruce de ferrocarril (RR) a menos que haya suficiente espacio
    al otro lado para su vehículo. Aunque tenga luz verde, no puede entrar en una
    intersección si no hay espacio para cruzar por completo".'
- id: 74
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener al estacionar cerca de
    un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: NO se permite estacionar a menos de 15 pies de un hidrante de incendios.
- id: 75
  category: safe_driving_rules
  question: ¿A cuántos pies del riel más cercano en un cruce de ferrocarril es ilegal
    estacionar?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: D
  explanation: NO se permite estacionar a menos de 50 pies del riel más cercano en
    los cruces de ferrocarril.
- id: 76
  category: safe_driving_rules
  question: 'Al estacionar en paralelo a un bordillo, su vehículo no puede estar estacionado
    a más de:'
  choices:
    A: 6 pulgadas del bordillo
    B: 12 pulgadas del bordillo
    C: 18 pulgadas del bordillo
    D: 24 pulgadas del bordillo
  answer: B
  explanation: NO se permite estacionar a más de 12” (12 pulgadas) de un bordillo.
- id: 77
  category: driver_responsibility
  question: Según la ley de Kansas, ¿cuál de las siguientes acciones está legalmente
    permitida mientras se conduce?
  choices:
    A: Enviar un mensaje de texto
    B: Leer un correo electrónico
    C: Escribir un mensaje de texto
    D: Usar un dispositivo GPS
  answer: D
  explanation: La ley de Kansas prohíbe el uso de cualquier dispositivo electrónico
    para "escribir, enviar o leer" una comunicación escrita mientras se conduce, pero
    explícitamente no incluye dispositivos GPS o informes meteorológicos.
- id: 78
  category: defensive_driving
  question: Cuando se enfrente a un conductor agresivo, ¿por qué debe evitar hacer
    contacto visual?
  choices:
    A: A veces puede enfurecer a un conductor agresivo
    B: Es ilegal en Kansas
    C: Le distraerá de mirar su velocímetro
    D: Les anima a rebasarle por la derecha
  answer: A
  explanation: El manual aconseja evitar el contacto visual porque "el contacto visual
    a veces puede enfurecer a un conductor agresivo".
- id: 79
  category: driver_testing
  question: Para aprobar el examen de la vista de Kansas para una licencia de conducir,
    ¿qué agudeza visual debe tener como mínimo en al menos un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: El examen de la vista mide que usted tenga al menos una visión de 20/40
    en al menos un ojo, con o sin lentes correctivos.
- id: 80
  category: safe_driving_rules
  question: ¿Por qué debe evitar el uso de lentes correctivos oscuros o teñidos al
    conducir de noche?
  choices:
    A: Es ilegal usarlos en cualquier momento
    B: Reducen la luz que necesita para ver con claridad
    C: Magnifican el resplandor de los faros que vienen en sentido contrario
    D: Causan fatiga ocular más rápido que los lentes transparentes
  answer: B
  explanation: Debe evitar el uso de lentes correctivos oscuros o teñidos por la noche
    porque "reducen la luz que necesita para ver con claridad en condiciones de conducción
    nocturna".
- id: 81
  category: defensive_driving
  question: ¿Cómo puede ayudarle el sentido del oído mientras conduce?
  choices:
    A: Le ayuda a determinar la velocidad exacta de los vehículos que vienen en sentido
      contrario
    B: Un cambio repentino en el zumbido de los neumáticos puede indicar un cambio
      en la superficie de la carretera
    C: Le permite escuchar informes meteorológicos sin radio
    D: Evita que experimente fatiga al conducir
  answer: B
  explanation: El manual señala que un "cambio repentino en el zumbido de los neumáticos
    sobre el pavimento puede indicarle que la superficie de la carretera o los neumáticos
    han cambiado".
- id: 82
  category: driver_responsibility
  question: Para prevenir la fatiga durante viajes largos, ¿con qué frecuencia debe
    programar descansos adecuados?
  choices:
    A: Cada 50 millas o 1 hora
    B: Cada 100 millas o 2 horas
    C: Cada 200 millas o 4 horas
    D: Solo cuando empiece a salirse de su carril
  answer: B
  explanation: Antes de un viaje, debe programar descansos adecuados, aproximadamente
    cada 100 millas o 2 horas durante viajes largos.
- id: 83
  category: driver_responsibility
  question: Si necesita tomar una siesta para combatir la fatiga al conducir, ¿cuál
    es la duración recomendada?
  choices:
    A: De 5 a 10 minutos
    B: De 15 a 20 minutos
    C: De 45 a 60 minutos
    D: Al menos 2 horas
  answer: B
  explanation: El manual recomienda buscar un área de estacionamiento segura para
    tomar una siesta de 15 a 20 minutos para evitar un choque relacionado con la fatiga.
- id: 84
  category: safe_driving_rules
  question: ¿Cuál es la mejor manera de prevenir la fatiga al conducir?
  choices:
    A: Beber dos tazas de café
    B: Dormir lo suficiente
    C: Tomar una ducha fría
    D: Conducir entre la medianoche y las 6 a.m.
  answer: B
  explanation: Según el manual, la mejor manera de prevenir la fatiga es dormir.
- id: 85
  category: defensive_driving
  question: ¿Cuál de las siguientes se considera una posible distracción que ocurre
    fuera de un vehículo en movimiento?
  choices:
    A: Ajustar los controles de climatización
    B: Atender a niños o mascotas
    C: Leer vallas publicitarias u otros anuncios en la carretera
    D: Usar un sistema de posicionamiento global (GPS)
  answer: C
  explanation: El manual enumera la lectura de vallas publicitarias u otros anuncios
    en la carretera como una posible distracción que podría ocurrir fuera de un vehículo
    en movimiento.
- id: 86
  category: driver_responsibility
  question: Si necesita mirar un mapa mientras conduce, ¿qué debe hacer?
  choices:
    A: Pedir direcciones a un pasajero en otro vehículo
    B: Detenerse en un área de estacionamiento segura
    C: Sostener el mapa frente al volante
    D: Mirarlo rápidamente mientras mantiene su velocidad
  answer: B
  explanation: 'El manual establece: ''Si necesita mirar un mapa mientras conduce,
    deténgase en un área de estacionamiento segura''.'
- id: 87
  category: defensive_driving
  question: ¿Cómo puede evitar convertirse en un conductor agresivo?
  choices:
    A: Conducir ligeramente por encima del límite de velocidad para reducir el tiempo
      de viaje
    B: Relajarse, concentrarse en la conducción y ser realista sobre su tiempo de
      viaje
    C: Seguir de cerca a otros vehículos para animarlos a acelerar
    D: Usar gestos groseros para comunicarse con conductores frustrantes
  answer: B
  explanation: Para evitar convertirse en un conductor agresivo, el manual aconseja
    relajarse, concentrarse en la conducción, conducir al límite de velocidad indicado,
    ser realista sobre el tiempo de viaje y ser cortés.
- id: 88
  category: alcohol_drugs_health
  question: ¿En qué porcentaje aproximado de todos los choques fatales están involucrados
    el alcohol y otras drogas que afectan la capacidad de conducción?
  choices:
    A: 10%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: El manual establece que el alcohol y otras drogas que afectan la capacidad
    de conducción están involucrados en aproximadamente el 40% de todos los choques
    fatales.
- id: 89
  category: alcohol_drugs_health
  question: ¿A qué concentración de alcohol en sangre (BAC) se ve afectada la visión
    de todos los conductores?
  choices:
    A: '.02'
    B: '.04'
    C: '.06'
    D: '.08'
  answer: A
  explanation: Según el manual, la visión se ve afectada con un .02 de BAC para todos
    los conductores.
- id: 90
  category: alcohol_drugs_health
  question: ¿Cuál es el único método médicamente comprobado para eliminar el alcohol
    u otras combinaciones de drogas del sistema circulatorio?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Respirar aire fresco
    D: El tiempo
  answer: D
  explanation: El tiempo es el único método médicamente comprobado para eliminar el
    alcohol u otras combinaciones de drogas del sistema circulatorio. El café, el
    aire fresco y las duchas frías no ayudarán.
- id: 91
  category: alcohol_drugs_health
  question: ¿Cuánto tiempo le toma al cuerpo eliminar una bebida normal del sistema
    circulatorio?
  choices:
    A: Unos 30 minutos
    B: Aproximadamente una hora
    C: Aproximadamente dos horas
    D: Aproximadamente cuatro horas
  answer: B
  explanation: Al cuerpo le toma aproximadamente una hora eliminar una bebida normal
    del sistema circulatorio.
- id: 92
  category: penalties_and_points
  question: 'En Kansas, si es menor de 21 años, puede ser arrestado por deterioro
    por alcohol con un nivel de alcohol en sangre (BAC) de:'
  choices:
    A: .00%
    B: .02%
    C: .05%
    D: .08%
  answer: B
  explanation: En Kansas, si es menor de 21 años, puede ser arrestado por deterioro
    por alcohol con un .02%.
- id: 93
  category: penalties_and_points
  question: ¿Cuál es la sanción por negarse a realizar una prueba de BAC bajo la ley
    de consentimiento implícito de Kansas?
  choices:
    A: Una multa de $500
    B: 100 horas de servicio comunitario
    C: Pérdida de su licencia de conducir por un año
    D: 48 horas de cárcel
  answer: C
  explanation: Bajo la ley de consentimiento implícito de Kansas, puede perder su
    licencia de conducir por un año si se niega a realizar una prueba de BAC.
- id: 94
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una posible sanción por una primera condena
    por una infracción relacionada con el alcohol?
  choices:
    A: Una multa de $200 a $400
    B: Un mínimo de 48 horas de cárcel o 100 horas de servicio comunitario
    C: Revocación permanente de su licencia de conducir
    D: Confiscación de su vehículo
  answer: B
  explanation: Por una primera condena por una infracción relacionada con el alcohol,
    podría ser sentenciado a un mínimo de 48 horas de cárcel o 100 horas de servicio
    comunitario, junto con multas y la suspensión de la licencia.
- id: 95
  category: driver_responsibility
  question: ¿Quién es completa y únicamente responsable de operar un vehículo de manera
    segura y de controlar todo lo que ocurre dentro de él?
  choices:
    A: Los pasajeros
    B: El conductor
    C: El fabricante del vehículo
    D: Las autoridades policiales
  answer: B
  explanation: 'El manual establece: ''Usted es completa y únicamente responsable
    de operar su vehículo de manera segura. Esto incluye también la responsabilidad
    de controlar todo lo que ocurra dentro del vehículo''.'
- id: 96
  category: safe_driving_rules
  question: 'Para ayudar prevenir la fatiga al conducir de noche, debe intentar evitar
    conducir entre las horas de:'
  choices:
    A: 8 p.m. y medianoche
    B: Medianoche y 6 a.m.
    C: 6 a.m. y 10 a.m.
    D: 4 p.m. y 8 p.m.
  answer: B
  explanation: El manual recomienda intentar no conducir tarde en la noche entre las
    horas de la medianoche y las 6 a.m. para prevenir la fatiga.
- id: 97
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol su capacidad para distinguir los colores al conducir?
  choices:
    A: Mejora su capacidad para ver colores brillantes como el rojo y el amarillo
    B: No tiene ningún efecto en la distinción de colores
    C: Reduce su capacidad para distinguir los colores, lo que dificulta la lectura
      de las señales de tráfico
    D: Causa ceguera temporal al color verde
  answer: C
  explanation: El alcohol y otras drogas que causan deterioro reducen su capacidad
    para distinguir los colores, lo que puede ser muy peligroso al intentar leer señales
    de tráfico, semáforos y marcas viales.
- id: 98
  category: penalties_and_points
  question: 'Si se determina que tiene un BAC de .08 o superior, su licencia de conducir
    y sus privilegios de conducción pueden ser suspendidos por:'
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Si tiene un BAC de .08 o más, su licencia de conducir y sus privilegios
    de conducción pueden ser suspendidos por 30 días.
- id: 99
  category: alcohol_drugs_health
  question: ¿Cuál es un efecto potencial de tomar pastillas para adelgazar de venta
    libre o estimulantes ('uppers') antes de conducir?
  choices:
    A: Mejoran su concentración y reflejos.
    B: Pueden hacer que se sienta nervioso, mareado e incapaz de concentrarse.
    C: Disminuyen de forma segura su tiempo de reacción.
    D: No tienen ningún efecto en su capacidad de conducción.
  answer: B
  explanation: El manual establece que las pastillas de energía, los estimulantes
    ('uppers') y las pastillas para adelgazar pueden hacer que se sienta nervioso,
    mareado, incapaz de concentrarse y pueden afectar su visión.
- id: 100
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por una primera condena por conducir bajo
    la influencia de drogas ilegales en Kansas?
  choices:
    A: Una multa de $500 y una advertencia por escrito.
    B: Una multa de $750 - $1000, un mínimo de 48 horas de cárcel o 100 horas de servicio
      comunitario, y la suspensión de la licencia.
    C: Una sentencia obligatoria de 30 días de cárcel y una multa de $2000.
    D: Revocación permanente de su licencia de conducir.
  answer: B
  explanation: Para una primera condena por un cargo relacionado con drogas por conducir
    bajo la influencia, se le puede imponer una multa de $750 - $1000 más las costas
    judiciales, ser sentenciado a un mínimo de 48 horas de cárcel o 100 horas de servicio
    comunitario, y su licencia será suspendida.
- id: 101
  category: alcohol_drugs_health
  question: ¿Por qué nunca debe beber alcohol mientras toma otras drogas?
  choices:
    A: Anulará los efectos del medicamento.
    B: Las drogas podrían multiplicar los efectos del alcohol o tener efectos adicionales
      propios.
    C: Solo afectará su conducción si toma medicamentos recetados, no medicamentos
      de venta libre.
    D: Reduce artificialmente su concentración de alcohol en sangre (BAC).
  answer: B
  explanation: El manual advierte que nunca se debe beber alcohol mientras se toman
    otras drogas porque estas podrían multiplicar los efectos del alcohol o tener
    efectos adicionales propios, reduciendo su capacidad para ser un conductor seguro.
- id: 102
  category: driver_responsibility
  question: Según el manual, ¿cómo debe manejar la conducción si está enojado o emocionado?
  choices:
    A: Conducir un poco más rápido para llegar a su destino y relajarse.
    B: Escuchar música a todo volumen para ahogar sus pensamientos.
    C: Darse tiempo para calmarse, dando un breve paseo o una siesta si es necesario,
      y mantenerse fuera de la carretera hasta estar tranquilo.
    D: Bajar las ventanillas para que entre aire fresco mientras conduce.
  answer: C
  explanation: Si está enojado o emocionado, el manual aconseja darse tiempo para
    calmarse. Si es necesario, tome un breve paseo o una siesta, pero manténgase fuera
    de la carretera hasta que se haya tranquilizado.
- id: 103
  category: safe_driving_rules
  question: ¿Cuál es la distancia recomendada entre su cuerpo y la parte inferior
    del volante?
  choices:
    A: 5 pulgadas
    B: 10 pulgadas
    C: 12 pulgadas
    D: 15 pulgadas
  answer: B
  explanation: Al ajustar su asiento, debe haber 10 pulgadas entre su cuerpo y la
    parte inferior del volante.
- id: 104
  category: vehicle_information
  question: ¿Cómo deben ajustarse los reposacabezas para ayudar a prevenir el latigazo
    cervical?
  choices:
    A: De modo que el reposacabezas esté en contacto con la parte posterior del cuello,
      por debajo de las orejas.
    B: De modo que el reposacabezas esté en contacto con la parte posterior de la
      cabeza y no por debajo del nivel de las orejas.
    C: De modo que haya un espacio de al menos 3 pulgadas entre la cabeza y el reposacabezas.
    D: De modo que la parte superior del reposacabezas esté al nivel de la parte superior
      de los hombros.
  answer: B
  explanation: Para ayudar a prevenir el latigazo cervical, los reposacabezas deben
    ajustarse de modo que estén en contacto con la parte posterior de la cabeza y
    no por debajo del nivel de las orejas.
- id: 105
  category: vehicle_information
  question: Al utilizar los ajustes de espejos mejorados, ¿cuánta área de visión adicional
    se añade a cada lado del vehículo?
  choices:
    A: De 5 a 10 grados
    B: De 12 a 16 grados
    C: De 20 a 25 grados
    D: De 30 a 45 grados
  answer: B
  explanation: El ajuste de espejos mejorado añade de 12 a 16 grados de área de visión
    adicional a cada lado del vehículo.
- id: 106
  category: safe_driving_rules
  question: En Kansas, ¿quién está legalmente obligado a usar el cinturón de seguridad
    en el asiento delantero de un vehículo?
  choices:
    A: Solo el conductor
    B: Solo los pasajeros menores de 18 años
    C: El conductor y todos los pasajeros del asiento delantero
    D: Solo el conductor, si viaja a más de 40 mph
  answer: C
  explanation: En Kansas, es ilegal conducir o ser pasajero en el asiento delantero
    sin usar el cinturón de seguridad (K.S.A. 8-2503).
- id: 107
  category: safe_driving_rules
  question: Según el manual, ¿dónde ocurren más de la mitad de los choques que causan
    lesiones o la muerte?
  choices:
    A: En autopistas interestatales a velocidades superiores a 65 mph
    B: A velocidades inferiores a 40 mph y a menos de 25 millas de casa
    C: Durante viajes largos por carretera fuera del estado de residencia del conductor
    D: En zonas rurales por la noche
  answer: B
  explanation: Más de la mitad de los choques que causan lesiones o la muerte ocurren
    a velocidades inferiores a 40 mph y a menos de 25 millas de casa.
- id: 108
  category: vehicle_information
  question: ¿Cómo debe usarse el cinturón de seguridad de hombro?
  choices:
    A: Metido debajo del brazo para mayor comodidad
    B: Detrás de la espalda si roza el cuello
    C: Cruzado sobre el hombro y el pecho con un mínimo de holgura, si la hay
    D: Holgado sobre el pecho para permitir el movimiento
  answer: C
  explanation: El cinturón de hombro se usa cruzado sobre el hombro y el pecho con
    un mínimo de holgura, si la hay. No debe usarse debajo del brazo ni detrás de
    la espalda.
- id: 109
  category: alcohol_drugs_health
  question: 'Los estudios han demostrado que las personas que consumen marihuana antes
    de conducir:'
  choices:
    A: Tienen tiempos de reacción más rápidos pero un juicio más pobre.
    B: Cometen más errores y tienen más problemas para adaptarse al deslumbramiento.
    C: Tienen menos probabilidades de ser arrestadas por infracciones de tráfico.
    D: Conducen con más precaución y seguridad.
  answer: B
  explanation: Los estudios han demostrado que las personas que consumen marihuana
    cometen más errores, tienen más problemas para adaptarse al deslumbramiento y
    son arrestadas por infracciones de tráfico más que otros conductores.
- id: 110
  category: defensive_driving
  question: Si está conduciendo y necesita usar su teléfono celular, ¿cuál es la mejor
    forma de actuar?
  choices:
    A: Detenerse en un área de estacionamiento segura y luego hacer la llamada.
    B: Usar su teléfono celular con cuidado, pero no hablar durante mucho tiempo.
    C: Sostener el teléfono entre el hombro y la oreja para mantener las manos en
      el volante.
    D: Reducir la velocidad a 15 mph mientras realiza la llamada.
  answer: A
  explanation: La sección 'Pruebe sus conocimientos' indica que si necesita usar su
    teléfono celular, lo mejor es detenerse en un área de estacionamiento segura y
    luego hacer la llamada.
- id: 111
  category: vehicle_information
  question: ¿Al ajustar el volante, cuál es la altura adecuada?
  choices:
    A: La parte superior del volante debe estar al nivel de sus ojos.
    B: La parte superior del volante no debe estar más alta que la parte superior
      de sus hombros y debe quedar por debajo del nivel de la barbilla.
    C: La parte inferior del volante debe descansar ligeramente sobre su regazo.
    D: El volante debe colocarse lo más alto posible para permitir espacio para las
      piernas.
  answer: B
  explanation: El manual establece que la parte superior del volante no debe estar
    más alta que la parte superior de sus hombros y debe quedar por debajo del nivel
    de la barbilla.
- id: 112
  category: vehicle_information
  question: ¿Cuál es el propósito principal de ajustar el espejo retrovisor?
  choices:
    A: Ver los puntos ciegos izquierdo y derecho.
    B: Vigilar a los pasajeros en el asiento trasero.
    C: Enmarcar la ventana trasera para poder ver el flujo de tráfico hacia atrás.
    D: Ver el guardabarros trasero del vehículo.
  answer: C
  explanation: Debe ajustar el espejo retrovisor de modo que enmarque la ventana trasera,
    permitiéndole ver el flujo de tráfico detrás del vehículo.
- id: 113
  category: vehicle_information
  question: ¿Cómo se debe usar el arnés de hombro para prevenir lesiones internas
    graves en un choque?
  choices:
    A: Debajo del brazo para mayor comodidad.
    B: Detrás de la espalda si roza contra el cuello.
    C: Cruzado sobre el hombro y el pecho con la mínima holgura posible.
    D: Holgado sobre el pecho para permitir el libre movimiento.
  answer: C
  explanation: El arnés de hombro se usa cruzado sobre el hombro y el pecho con la
    mínima holgura posible. No debe usarse debajo del brazo ni detrás de la espalda,
    ya que esto podría causar lesiones internas graves en un choque.
- id: 114
  category: vehicle_information
  question: Si su vehículo tiene un cinturón de hombro automático, ¿qué más debe hacer
    para estar debidamente sujeto?
  choices:
    A: Desconectarlo si conduce a bajas velocidades.
    B: Asegurarse de abrochar también el cinturón de regazo.
    C: Ajustarlo para que quede alto sobre su estómago.
    D: Evitar usarlo si el vehículo tiene bolsas de aire (airbags).
  answer: B
  explanation: Si tiene un cinturón de hombro automático, asegúrese de abrochar también
    el cinturón de regazo. De lo contrario, en una colisión podría deslizarse fuera
    del cinturón y resultar herido o muerto.
- id: 115
  category: safe_driving_rules
  question: ¿Por qué debe usar el cinturón de seguridad incluso si su vehículo está
    equipado con bolsas de aire (airbags)?
  choices:
    A: Las bolsas de aire no lo protegen si lo golpean por el costado o por detrás,
      o si el vehículo vuelca.
    B: Las bolsas de aire solo son efectivas a velocidades superiores a 50 mph.
    C: Las bolsas de aire no se desplegarán a menos que el cinturón de seguridad esté
      abrochado.
    D: Las bolsas de aire aumentan el riesgo de ser expulsado del vehículo.
  answer: A
  explanation: Los cinturones de seguridad deben usarse incluso si el vehículo está
    equipado con bolsas de aire porque estas no lo protegen si lo golpean por el costado
    o por detrás, o si el vehículo vuelca, ni lo mantendrán detrás del volante.
- id: 116
  category: driver_responsibility
  question: Según la ley, ¿los niños menores de qué edad deben estar sujetos en el
    asiento trasero y usar los sistemas de seguridad adecuados?
  choices:
    A: Menores de 8 años
    B: Menores de 10 años
    C: Menores de 12 años
    D: Menores de 14 años
  answer: D
  explanation: La ley exige que todos los niños menores de 14 años deben estar sujetos
    en el asiento trasero y usar los sistemas de seguridad adecuados mientras el vehículo
    esté en movimiento.
- id: 117
  category: safe_driving_rules
  question: Para ayudar a prevenir lesiones por el despliegue de una bolsa de aire,
    ¿cuánta distancia debe haber entre el centro de su pecho y el centro del volante?
  choices:
    A: Al menos 5 pulgadas
    B: Al menos 10 pulgadas
    C: Al menos 15 pulgadas
    D: Al menos 20 pulgadas
  answer: B
  explanation: En la mayoría de los vehículos, debe ajustar su asiento de modo que
    haya al menos 10 pulgadas entre el centro de su pecho y el centro del volante.
- id: 118
  category: driver_responsibility
  question: ¿Cuál es el requisito de seguridad adecuado para un pasajero infantil
    desde el nacimiento hasta al menos el primer año de edad, y hasta que pese al
    menos 20 libras?
  choices:
    A: Un asiento de seguridad para niños orientado hacia adelante en el asiento delantero.
    B: Un asiento de seguridad para niños orientado hacia adelante en el asiento trasero.
    C: Un asiento para bebés orientado hacia atrás en el asiento trasero.
    D: Un asiento elevado (booster seat) en el asiento trasero.
  answer: C
  explanation: Los bebés desde el nacimiento hasta al menos el primer año de edad,
    y hasta que pesen al menos 20 libras, deben viajar en el asiento trasero en un
    asiento para bebés orientado hacia atrás e instalado correctamente.
- id: 119
  category: driver_responsibility
  question: 'Un niño de entre 4 y 8 años, que no mida más de 4 pies y 9 pulgadas de
    altura, debe viajar en:'
  choices:
    A: Un asiento para bebés orientado hacia atrás.
    B: Un asiento de seguridad para niños orientado hacia adelante.
    C: Un asiento elevado (booster seat) correctamente instalado en el asiento trasero.
    D: Un cinturón de seguridad para adultos en el asiento delantero.
  answer: C
  explanation: Los niños de entre 4 y 8 años, que no midan más de 4 pies y 9 pulgadas
    de altura, deben viajar en el asiento trasero en un asiento elevado (booster seat)
    correctamente instalado.
- id: 120
  category: safe_driving_rules
  question: ¿Dónde deben sentarse los niños de 12 años o menos en un vehículo para
    evitar lesiones por una bolsa de aire en caso de un choque?
  choices:
    A: En el asiento del pasajero delantero con el asiento echado totalmente hacia
      atrás.
    B: En el asiento trasero del vehículo.
    C: En el asiento delantero, siempre que lleven puesto el cinturón de seguridad.
    D: En el regazo del conductor.
  answer: B
  explanation: Los niños de 12 años o menos deben sentarse en el asiento trasero del
    vehículo para evitar lesiones por una bolsa de aire en caso de un choque.
- id: 121
  category: vehicle_information
  question: ¿Qué sucederá si suelta el embrague (clutch) repentinamente al acelerar
    un vehículo con transmisión manual?
  choices:
    A: El vehículo aumentará la velocidad suavemente.
    B: El vehículo dará un tirón hacia adelante y el motor podría apagarse.
    C: Las ruedas motrices se bloquearán y patinarán.
    D: El freno de estacionamiento se activará automáticamente.
  answer: B
  explanation: Si suelta el embrague repentinamente, el vehículo dará un tirón hacia
    adelante y el motor podría apagarse.
- id: 122
  category: defensive_driving
  question: ¿Qué debe hacer si las ruedas motrices comienzan a patinar al acelerar
    sobre una superficie resbaladiza?
  choices:
    A: Presionar más fuerte el acelerador para ganar tracción.
    B: Cambiar a una marcha más alta inmediatamente.
    C: Quitar el pie del acelerador.
    D: Bombear los frenos rápidamente.
  answer: C
  explanation: Si utiliza demasiada potencia, las ruedas motrices pueden patinar y
    podría perder el control. Si las ruedas motrices comienzan a patinar, quite el
    pie del acelerador.
- id: 123
  category: vehicle_information
  question: Al retroceder su vehículo, ¿hacia qué dirección debe girar el volante?
  choices:
    A: En la dirección opuesta a la que desea que se mueva el vehículo.
    B: En la dirección a la que desea que se mueva el vehículo.
    C: Mantener el volante recto y usar los espejos para guiarse.
    D: Girar el volante a la izquierda para ir a la derecha, y a la derecha para ir
      a la izquierda.
  answer: B
  explanation: El volante siempre se gira en la dirección en la que desea que se mueva
    el vehículo, ya sea avanzando o retrocediendo.
- id: 124
  category: safe_driving_rules
  question: ¿Cuál es la posición correcta de las manos en el volante?
  choices:
    A: Ambas manos en la parte interior del aro del volante.
    B: Una mano en la parte superior del volante y otra en la parte inferior.
    C: Ambas manos en la parte exterior del volante en lados opuestos.
    D: Las palmas sujetando el volante con fuerza con los pulgares debajo del aro.
  answer: C
  explanation: Ambas manos deben colocarse en la parte exterior del volante en lados
    opuestos. Su agarre debe ser firme pero suave, usando los dedos en lugar de las
    palmas, y nunca debe girar el volante mientras lo sujeta desde la parte interior
    del aro.
- id: 125
  category: vehicle_information
  question: ¿Por qué las bolsas de aire (air bags) no son útiles durante una colisión
    secundaria?
  choices:
    A: Están diseñadas para permanecer infladas durante varios minutos.
    B: Se despliegan solo una vez y se desinflan rápidamente después del impacto.
    C: Solo se despliegan cuando el vehículo es golpeado por la parte trasera.
    D: Desactivan automáticamente los cinturones de seguridad del vehículo.
  answer: B
  explanation: Dado que las bolsas de aire se despliegan solo una vez y se desinflan
    rápidamente después del impacto, no serán útiles durante una colisión secundaria.
- id: 126
  category: safe_driving_rules
  question: ¿Cómo puede dirigir la bolsa de aire hacia su pecho en lugar de hacia
    su cara?
  choices:
    A: Inclinarse hacia adelante lo más cerca posible del volante.
    B: Elevar su asiento o usar un cojín y/o ajustar el volante hacia abajo.
    C: Ajustar el volante hacia arriba, hacia su cabeza.
    D: Reclinar su asiento completamente hacia atrás.
  answer: B
  explanation: Para dirigir la bolsa de aire hacia su pecho en lugar de hacia su cara,
    eleve su asiento o use un cojín y/o ajuste el volante hacia abajo.
- id: 127
  category: vehicle_information
  question: ¿Cómo debe sujetar correctamente el volante mientras conduce?
  choices:
    A: Con las palmas y los pulgares envueltos alrededor de la parte interior del
      aro.
    B: Usando los dedos con los pulgares hacia arriba a lo largo de la cara del volante.
    C: Con las manos colocadas firmemente en la posición de las 12 en punto.
    D: Sujetando con fuerza desde la parte interior del aro del volante.
  answer: B
  explanation: El manual indica que debe usar los dedos en lugar de las palmas de
    las manos y mantener los pulgares hacia arriba a lo largo de la cara del volante.
    Nunca debe girar el volante mientras lo sujeta desde la parte interior del aro.
- id: 128
  category: safe_driving_rules
  question: ¿Dónde deben colocarse las manos en el volante al usar la técnica de dirección
    de mano a mano (empujar/tirar)?
  choices:
    A: Mano izquierda entre las 10 y las 11, mano derecha entre la 1 y las 2.
    B: Mano izquierda entre las 9 y las 10, mano derecha entre las 2 y las 3.
    C: Mano izquierda entre las 7 y las 8, mano derecha entre las 4 y las 5.
    D: Mano izquierda entre las 8 y las 9, mano derecha entre las 3 y las 4.
  answer: C
  explanation: Al usar la dirección de mano a mano, la mano izquierda sujeta el volante
    entre las 7 y las 8, y la mano derecha sujeta el volante entre las 4 y las 5.
- id: 129
  category: vehicle_information
  question: ¿Por qué ya no se recomienda la posición de las manos de las 2 y las 10
    para conducir?
  choices:
    A: Hace que el conductor se fatigue más rápidamente.
    B: Dificulta alcanzar las señales de giro.
    C: Puede ser peligroso en vehículos equipados con bolsas de aire en el lado del
      conductor.
    D: Reduce el radio de giro de los vehículos modernos.
  answer: C
  explanation: El manual señala que la posición de las 2 y las 10 no se recomienda
    porque puede ser peligrosa en vehículos equipados con bolsas de aire.
- id: 130
  category: vehicle_information
  question: ¿En cuál de las siguientes situaciones debe utilizar la dirección de manos
    sobre manos (hand-over-hand)?
  choices:
    A: Al conducir hacia adelante a velocidades de autopista superiores a 55 mph.
    B: Al girar el volante a bajas velocidades, como al estacionar.
    C: Al realizar maniobras evasivas para evitar un peligro.
    D: Al retroceder en línea recta.
  answer: B
  explanation: Debe utilizar la dirección de manos sobre manos al girar el volante
    a bajas velocidades, como en una intersección o al estacionar el vehículo.
- id: 131
  category: defensive_driving
  question: ¿Al realizar una maniobra evasiva para evitar un peligro, por qué es fundamental
    limitar el giro del volante a no más de 180 grados?
  choices:
    A: Para evitar que el motor se apague
    B: Para evitar que se bloqueen los frenos antibloqueo (ABS)
    C: Para evitar que el volante se bloquee en su lugar
    D: Para evitar la pérdida de tracción y cruzar hacia el tráfico en sentido contrario
  answer: D
  explanation: Es fundamental limitar el giro a no más de 180 grados porque usar más
    provoca la pérdida de tracción y, a menudo, el vehículo se desplaza por la calzada
    hacia la trayectoria de los vehículos que vienen en sentido contrario.
- id: 132
  category: safe_driving_rules
  question: ¿Cuál es el único momento en que se recomienda conducir con una sola mano
    en la posición de las 12 en punto?
  choices:
    A: Al conducir en una autopista recta y vacía
    B: Al dar marcha atrás hacia la izquierda o derecha mientras se gira en el asiento
      para ver
    C: Al operar los limpiaparabrisas o los faros
    D: Al realizar un giro en U cerrado en una intersección
  answer: B
  explanation: El único momento en que se recomienda la posición de las 12 en punto
    es al dar marcha atrás hacia la izquierda o derecha y el conductor debe girar
    en el asiento para ver la trayectoria de desplazamiento hacia atrás.
- id: 133
  category: safe_driving_rules
  question: ¿Qué es lo primero que debe hacer antes de dar marcha atrás con su vehículo?
  choices:
    A: Poner la marcha atrás y acelerar rápidamente
    B: Tocar la bocina para advertir a los peatones
    C: Revisar detrás de su vehículo antes de subir a él
    D: Ajustar el espejo retrovisor para ver el suelo directamente detrás de su parachoques
  answer: C
  explanation: Antes de dar marcha atrás con su vehículo, debe revisar detrás de este
    antes de subir, ya que los niños u objetos pequeños no pueden verse desde el asiento
    del conductor.
- id: 134
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones sobre las leyes de derecho de paso
    es verdadera?
  choices:
    A: La ley otorga el derecho de paso al vehículo más grande en una intersección
    B: La ley establece quién debe ceder el derecho de paso, pero no otorga el derecho
      de paso a nadie
    C: La ley otorga el derecho de paso a los peatones solo cuando están en un cruce
      peatonal marcado
    D: La ley otorga automáticamente el derecho de paso a los vehículos que giran
      a la izquierda
  answer: B
  explanation: 'El manual establece: "La ley dice quién debe ceder el derecho de paso
    a otro usuario de la vía; no otorga el derecho de paso a nadie".'
- id: 135
  category: sharing_the_road
  question: Al cruzar una acera para entrar o salir de una entrada para autos o un
    callejón, ¿qué debe hacer?
  choices:
    A: Tocar la bocina para advertir a los peatones que despejen la acera
    B: Ceder el paso a los peatones
    C: Avanzar rápidamente para evitar bloquear la acera
    D: Detenerse solo si hay una señal de alto presente
  answer: B
  explanation: Al cruzar una acera para entrar o salir de una entrada para autos,
    callejón o estacionamiento, debe ceder el paso a los peatones.
- id: 136
  category: sharing_the_road
  question: ¿Por qué debe evitar usar la bocina al ceder el paso a un peatón que utiliza
    un perro guía o lleva un bastón blanco?
  choices:
    A: Es ilegal usar la bocina en zonas residenciales
    B: Podría confundir o asustar al peatón con discapacidad visual o al perro guía
    C: Indica a otros conductores que lo rebasen
    D: Hará que el semáforo cambie
  answer: B
  explanation: Siempre se debe dar el derecho de paso a los peatones que utilizan
    un perro guía o llevan un bastón blanco. No use la bocina, ya que podría confundir
    o asustar al peatón con discapacidad visual o al perro guía.
- id: 137
  category: safe_driving_rules
  question: ¿Cuál es la regla de derecho de paso en una intersección no controlada
    sin señales de alto ni semáforos?
  choices:
    A: Ceder el paso a los vehículos que vienen por la izquierda
    B: El vehículo que viaja más rápido tiene el derecho de paso
    C: Ceder el paso a los vehículos que ya están en la intersección y a los que vienen
      por la derecha
    D: Detenerse y esperar a que otro conductor le indique que pase
  answer: C
  explanation: En una intersección no controlada donde no hay señal de alto, señal
    de ceda el paso o semáforo, debe ceder el paso a los vehículos en la intersección
    y a los que vienen por la derecha.
- id: 138
  category: safe_driving_rules
  question: Si dos vehículos llegan a una parada de 4 vías exactamente al mismo tiempo,
    ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda
    B: El vehículo de la derecha
    C: El vehículo que viaja recto
    D: El vehículo que realiza un giro a la derecha
  answer: B
  explanation: En una parada de 4 vías, si más de un vehículo llega al mismo tiempo,
    el vehículo de la derecha pasa primero.
- id: 139
  category: safe_driving_rules
  question: ¿Cuándo se le permite entrar en una intersección?
  choices:
    A: Tan pronto como el semáforo cambie a verde, independientemente del tráfico
      que haya adelante
    B: Solo cuando pueda atravesarla por completo sin bloquear el flujo del tráfico
    C: Siempre que esté girando a la derecha en rojo
    D: Cuando el vehículo de atrás toque la bocina
  answer: B
  explanation: No puede entrar en una intersección a menos que pueda atravesarla sin
    bloquear el flujo del tráfico. Debe esperar hasta que el tráfico de adelante se
    despeje para no bloquear la intersección.
- id: 140
  category: signs_and_signals
  question: En un semáforo montado horizontalmente, ¿dónde se encuentra la luz roja?
  choices:
    A: En el extremo derecho
    B: En el medio
    C: En el extremo izquierdo
    D: Alterna dependiendo de la intersección
  answer: C
  explanation: En algunas áreas metropolitanas, los semáforos son horizontales en
    lugar de verticales, donde la luz roja está a la izquierda, la luz amarilla está
    en el medio y la luz verde está a la derecha.
- id: 141
  category: signs_and_signals
  question: ¿Qué debe hacer al girar a la izquierda con una luz verde fija?
  choices:
    A: Girar inmediatamente, ya que tiene el derecho de paso absoluto
    B: Ceder el paso al tráfico que viene en sentido contrario y a los peatones antes
      de girar
    C: Esperar a una flecha verde antes de realizar el giro
    D: Detenerse por completo y esperar a que la luz cambie a amarillo
  answer: B
  explanation: Girar a la izquierda con una luz verde fija significa que puede girar,
    pero solo cuando la intersección esté despejada para hacerlo. Siempre debe ceder
    el paso al flujo de tráfico que viene en sentido contrario y a los peatones.
- id: 142
  category: signs_and_signals
  question: ¿Qué debe hacer si se aproxima a una intersección y el semáforo cambia
    a amarillo fijo?
  choices:
    A: Acelerar para despejar la intersección antes de que la luz cambie a rojo.
    B: Detenerse inmediatamente dondequiera que esté en la carretera.
    C: Reducir la velocidad y detenerse por completo si el flujo de tráfico detrás
      de usted lo permite.
    D: Continuar a través de la intersección sin reducir su velocidad.
  answer: C
  explanation: Una luz amarilla fija significa que el semáforo está a punto de cambiar
    a rojo. Debe reducir la velocidad y detenerse por completo si el flujo de tráfico
    detrás de usted lo permite.
- id: 143
  category: signs_and_signals
  question: ¿Qué indica una luz amarilla intermitente?
  choices:
    A: Detenerse y esperar a una luz verde.
    B: Reducir la velocidad y proceder con precaución.
    C: El semáforo está averiado y debe tratarse como una parada de cuatro vías.
    D: Ceder el paso únicamente al tráfico de la derecha.
  answer: B
  explanation: Una luz amarilla intermitente significa reducir la velocidad y proceder
    con precaución. Debe estar preparado para detenerse ante cualquier flujo de tráfico
    que pueda estar entrando en la intersección.
- id: 144
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias se permite un giro a la izquierda con luz roja
    fija?
  choices:
    A: Al girar desde una calle de doble sentido hacia otra calle de doble sentido.
    B: Los giros a la izquierda en rojo nunca están permitidos bajo ninguna circunstancia.
    C: Al pasar de una calle de sentido único a otra calle de sentido único, o de
      una calle de doble sentido a una de sentido único.
    D: Solo entre las doce de la noche y las 6:00 AM.
  answer: C
  explanation: Se pueden permitir algunos giros a la izquierda en rojo al pasar de
    una calle de sentido único a otra de sentido único o de una calle de doble sentido
    a una de sentido único, después de verificar el tráfico y los peatones.
- id: 145
  category: signs_and_signals
  question: ¿Cómo debe tratar una luz roja intermitente?
  choices:
    A: Igual que una señal de ceda el paso.
    B: Igual que una señal de alto (stop).
    C: Igual que una luz amarilla fija.
    D: Proceder sin detenerse si la intersección está despejada.
  answer: B
  explanation: Una luz roja intermitente significa que debe detenerse detrás de una
    línea de parada, paso de peatones o intersección antes de entrar y seguir el mismo
    procedimiento que en una señal de alto.
- id: 146
  category: signs_and_signals
  question: ¿Qué forma y color tienen la mayoría de las señales de advertencia?
  choices:
    A: Rectangulares y blancas con letras negras.
    B: Circulares y amarillas con letras negras.
    C: En forma de diamante y amarillas con letras o símbolos negros.
    D: Octogonales y rojas con letras blancas.
  answer: C
  explanation: Las señales de advertencia suelen ser amarillas con letras o símbolos
    negros y tienen forma de diamante.
- id: 147
  category: signs_and_signals
  question: ¿Qué indica una señal de advertencia amarilla redonda con un símbolo 'X'
    y las letras 'RR' en negro?
  choices:
    A: Actualmente está cruzando vías de ferrocarril.
    B: Se aproxima un cruce a nivel de carretera y ferrocarril.
    C: El cruce de ferrocarril está cerrado por reparaciones.
    D: Los trenes no están operando actualmente en las vías más adelante.
  answer: B
  explanation: Una señal de advertencia amarilla redonda con un símbolo 'X' y letras
    'RR' negras se coloca a lo largo de la carretera antes de un cruce a nivel de
    carretera y ferrocarril para advertirle que reduzca la velocidad y esté preparado
    para detenerse.
- id: 148
  category: defensive_driving
  question: ¿Aproximadamente cuánta distancia necesita para detenerse un tren de carga
    de 100 vagones que viaja a 55 mph?
  choices:
    A: 500 pies.
    B: Media milla.
    C: Más de una milla.
    D: Dos millas.
  answer: C
  explanation: Un tren de carga de 100 vagones que viaja a 55 mph necesitará más de
    una milla para detenerse, lo que equivale a unos 18 campos de fútbol, una vez
    que el tren activa el frenado de emergencia.
- id: 149
  category: safe_driving_rules
  question: Si su vehículo se apaga en las vías del tren y se aproxima un tren, ¿cuál
    es la acción inmediata más segura?
  choices:
    A: Permanecer en el vehículo y llamar al 911.
    B: Hacer que todos salgan y corran en la dirección de donde viene el tren.
    C: Hacer que todos salgan y corran en la misma dirección en la que viaja el tren.
    D: Intentar empujar el vehículo fuera de las vías.
  answer: B
  explanation: Si su vehículo se apaga al cruzar las vías del tren, haga que todos
    salgan del vehículo y se alejen de las vías; corra en la dirección de donde viene
    el tren para evitar ser herido por los escombros que salgan volando.
- id: 150
  category: vehicle_information
  question: ¿Por qué es prudente no cambiar de marcha al cruzar las vías del tren?
  choices:
    A: Daña la transmisión del vehículo.
    B: Hace que los neumáticos pierdan tracción en los rieles metálicos.
    C: Podría apagar su vehículo en las vías.
    D: Es ilegal cambiar de marcha en una intersección.
  answer: C
  explanation: El manual establece que es prudente no cambiar de marcha al cruzar
    las vías del tren en caso de que el vehículo se apague.
- id: 151
  category: signs_and_signals
  question: ¿Qué información se proporciona en la señal azul del Sistema de Notificación
    de Emergencia (ENS) en un cruce ferroviario a nivel?
  choices:
    A: El horario de trenes para ese cruce específico.
    B: Un número de despacho gratuito y un número del DOT que identifica la ubicación
      exacta del cruce.
    C: El límite de velocidad para los trenes que pasan por el cruce.
    D: La distancia al hospital más cercano.
  answer: B
  explanation: La señal ENS proporciona un número de despacho gratuito para cada ferrocarril,
    y directamente debajo del número de despacho hay un número del Departamento de
    Transporte (DOT) que identifica la ubicación exacta del cruce.
- id: 152
  category: signs_and_signals
  question: ¿Qué colores se utilizan normalmente para las señales de zonas de trabajo
    de construcción, mantenimiento u operaciones de emergencia?
  choices:
    A: Amarillo con letras negras.
    B: Rojo con letras blancas.
    C: Naranja con letras o símbolos negros.
    D: Verde con letras blancas.
  answer: C
  explanation: Las señales de zona de trabajo suelen tener forma de diamante o rectangular
    y son de color naranja con letras o símbolos negros.
- id: 153
  category: signs_and_signals
  question: ¿Qué debe hacer cuando se enfrenta a un semáforo con una flecha roja?
  choices:
    A: Ceder el paso al tráfico que viene en sentido contrario y luego avanzar en
      la dirección de la flecha.
    B: Detenerse y no avanzar en la dirección de la flecha hasta que vuelva a aparecer
      la flecha o luz verde.
    C: Tratarlo como una parada de cuatro vías (four-way stop).
    D: Girar en la dirección de la flecha solo si no hay peatones.
  answer: B
  explanation: Una flecha ROJA significa que debe detenerse y no puede avanzar en
    la dirección de la flecha hasta que la flecha o luz verde vuelva a aparecer en
    el semáforo.
- id: 154
  category: safe_driving_rules
  question: ¿De qué debe estar atento en un cruce ferroviario a nivel con más de una
    vía de tren?
  choices:
    A: No es necesario detenerse si la primera vía está despejada.
    B: Puede haber más de un tren cruzando, y el número de vías generalmente estará
      señalizado.
    C: Los trenes siempre viajarán en la misma dirección en todas las vías.
    D: El límite de velocidad se reduce automáticamente a 10 mph.
  answer: B
  explanation: En los cruces con más de una vía, las señales advierten que hay más
    de una vía y que puede haber más de un tren cruzando. Es importante verificar
    si hay más de una vía, tren o vehículo ferroviario.
- id: 155
  category: signs_and_signals
  question: ¿Cuál de las siguientes señales de advertencia puede ser de color amarillo
    fluorescente?
  choices:
    A: Señales de Pare (Stop) y señales de Ceda el paso (Yield).
    B: Señales de cruce ferroviario a nivel.
    C: Señales de zonas escolares, cruce escolar y cruce de peatones.
    D: Señales de desvío por construcción y mantenimiento.
  answer: C
  explanation: Algunas señales de advertencia pueden ser de color amarillo fluorescente,
    como las de zonas escolares, cruce escolar y cruce de peatones.
- id: 156
  category: safe_driving_rules
  question: Si está detenido en una intersección y la luz cambia a verde, ¿qué debe
    hacer antes de avanzar?
  choices:
    A: Tocar la bocina para alertar a otros conductores.
    B: Permitir que el tráfico que cruza despeje la intersección antes de avanzar.
    C: Acelerar rápidamente para establecer el derecho de paso.
    D: Girar a la derecha inmediatamente, independientemente del resto del tráfico.
  answer: B
  explanation: Si está detenido en la intersección y la luz cambia a verde, debe permitir
    que el tráfico que cruza despeje la intersección antes de avanzar.
- id: 157
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de trabajo?
  choices:
    A: Las multas se triplican
    B: Las multas se duplican
    C: Su licencia se suspende automáticamente
    D: Debe asistir a una escuela de tráfico
  answer: B
  explanation: Según el manual, las multas por exceso de velocidad en una zona de
    trabajo se duplican.
- id: 158
  category: signs_and_signals
  question: ¿Qué indica una señal reglamentaria con un círculo rojo y una barra diagonal
    roja sobre un símbolo?
  choices:
    A: La acción mostrada está prohibida
    B: Debe ceder el paso a la acción mostrada
    C: La acción mostrada es recomendada
    D: Hay un peligro más adelante
  answer: A
  explanation: El manual establece que algunas señales reglamentarias tienen un círculo
    rojo con una barra diagonal roja sobre un símbolo, y estas señales prohíben ciertas
    acciones.
- id: 159
  category: safe_driving_rules
  question: ¿Cuándo debe conducir al límite de velocidad legal máximo indicado en
    una señal?
  choices:
    A: En todo momento para evitar congestiones de tráfico
    B: Solo durante las horas del día
    C: Solo en condiciones de conducción ideales
    D: Siempre que esté en el carril izquierdo
  answer: C
  explanation: El límite máximo debe conducirse solo en condiciones de conducción
    ideales, y debe reducir su velocidad cuando las condiciones del clima o del tráfico
    lo requieran.
- id: 160
  category: signs_and_signals
  question: ¿Cuándo está obligado a obedecer una señal de 'Límite de velocidad escolar
    cuando esté parpadeando'?
  choices:
    A: Entre las 8 AM y las 5 PM los días de semana
    B: Solo cuando las luces de la señal estén parpadeando
    C: Siempre que haya niños visibles en la acera
    D: En todo momento durante el año escolar
  answer: B
  explanation: El manual establece que el límite de velocidad reducido en una zona
    escolar es obligatorio solo cuando las luces parpadean; de lo contrario, debe
    obedecer el límite de velocidad estándar de la vía.
- id: 161
  category: signs_and_signals
  question: ¿Cuál es la forma y el color de una señal de Ceda el paso (Yield)?
  choices:
    A: Un octágono rojo con letras blancas
    B: Un diamante amarillo con letras negras
    C: Un triángulo rojo y blanco que apunta hacia abajo
    D: Un rectángulo blanco con letras negras
  answer: C
  explanation: Una señal de ceda el paso es un triángulo rojo y blanco que apunta
    hacia abajo con letras rojas.
- id: 162
  category: safe_driving_rules
  question: ¿Cuál es el uso adecuado de un carril central compartido?
  choices:
    A: Rebasar vehículos más lentos
    B: Tráfico directo durante la hora pico
    C: Vehículos que giran a la izquierda desde cualquier dirección
    D: Solo para estacionamiento de emergencia
  answer: C
  explanation: Un carril central compartido está reservado para el uso de vehículos
    que giran a la izquierda desde cualquier dirección y no debe usarse para el tráfico
    directo ni para rebasar a otros vehículos.
- id: 163
  category: safe_driving_rules
  question: ¿Bajo qué condición NO debe entrar en una intersección?
  choices:
    A: Si el semáforo acaba de ponerse en verde
    B: Si las condiciones del tráfico no le permiten despejar la intersección por
      completo
    C: Si hay peatones esperando en la esquina
    D: Si está girando a la derecha con luz roja
  answer: B
  explanation: No debe entrar en una intersección si las condiciones del tráfico no
    le permiten despejar la intersección por completo, ya que esto bloquearía el tráfico.
- id: 164
  category: signs_and_signals
  question: ¿Qué señal es un cuadrado con una línea horizontal blanca dentro de un
    círculo rojo?
  choices:
    A: Pare (Stop)
    B: Ceda el paso (Yield)
    C: Dirección contraria (Wrong Way)
    D: No entre (Do Not Enter)
  answer: D
  explanation: Una señal cuadrada con una línea horizontal blanca dentro de un círculo
    rojo significa que no puede entrar (Do Not Enter).
- id: 165
  category: signs_and_signals
  question: En una señal de destino verde, ¿qué significa si la palabra 'Exit' (Salida)
    está escrita en el lado izquierdo de la señal?
  choices:
    A: La salida está cerrada
    B: El carril de salida o la rampa está a la izquierda
    C: La salida es solo para vehículos compartidos (carpools)
    D: El carril de salida o la rampa está a la derecha
  answer: B
  explanation: Si la palabra 'Exit' está escrita en el lado izquierdo de una señal
    de salida, el carril de salida o la rampa se encuentra a la izquierda.
- id: 166
  category: signs_and_signals
  question: ¿De qué color son las señales de servicio que muestran la ubicación de
    áreas de descanso, gasolineras, hoteles u hospitales?
  choices:
    A: Verde
    B: Marrón
    C: Azul
    D: Rosa fluorescente
  answer: C
  explanation: Las señales de servicio son señales azules de forma cuadrada o rectangular
    con letras o símbolos blancos. Muestran la ubicación de servicios como áreas de
    descanso, gasolineras, hoteles u hospitales.
- id: 167
  category: signs_and_signals
  question: ¿De qué color son las señales de incidentes temporales utilizadas para
    desastres naturales o derrames de materiales peligrosos?
  choices:
    A: Naranja con letras negras
    B: Rosa fluorescente con letras negras
    C: Amarillo con letras negras
    D: Rojo con letras blancas
  answer: B
  explanation: Las señales de incidentes son temporales y le informan sobre incidentes
    de los usuarios de la vía, desastres naturales o derrames. Estas señales son de
    color rosa fluorescente con letras negras.
- id: 168
  category: safe_driving_rules
  question: Al conducir en una carretera con una línea amarilla continua y otra discontinua
    entre carriles opuestos, ¿cuándo se le permite rebasar?
  choices:
    A: Solo si la línea amarilla continua está de su lado
    B: Solo si la línea amarilla discontinua está de su lado y hay un espacio seguro
      disponible
    C: En cualquier momento si toca la bocina
    D: Nunca se permite rebasar en carreteras con líneas amarillas
  answer: B
  explanation: Donde hay una línea amarilla continua y una discontinua entre carriles
    de tráfico opuestos, no debe rebasar si la línea amarilla continua está de su
    lado. Si la línea discontinua está de su lado, puede rebasar si hay un espacio
    seguro disponible en el tráfico.
- id: 169
  category: safe_driving_rules
  question: ¿Qué indican dos líneas amarillas continuas entre los carriles de tráfico?
  choices:
    A: Ninguno de los lados puede rebasar, pero se puede cruzar para girar cuando
      haya espacios
    B: Ambos lados pueden rebasar si hay un espacio seguro disponible
    C: El carril es un carril central compartido para girar
    D: Se está aproximando a una calle de un solo sentido
  answer: A
  explanation: Dos líneas amarillas continuas entre los carriles de tráfico significan
    que ninguno de los lados puede rebasar. Sin embargo, puede cruzar una línea amarilla
    continua para girar cuando existan espacios en el flujo del tráfico.
- id: 170
  category: safe_driving_rules
  question: ¿Qué significa una línea blanca continua entre carriles de tráfico que
    viajan en la misma dirección?
  choices:
    A: Puede cambiar de carril libremente
    B: Debe permanecer dentro del carril a menos que una situación especial requiera
      un cambio de carril
    C: El carril está terminando y debe incorporarse a la izquierda
    D: Está entrando en una zona escolar
  answer: B
  explanation: Una línea blanca continua entre carriles de tráfico significa que debe
    permanecer dentro del carril a menos que una situación especial requiera un cambio
    de carril.
- id: 171
  category: safe_driving_rules
  question: Si no hay una señal de "NO TURN ON RED" (No girar en rojo) en un semáforo,
    ¿qué debe hacer antes de girar a la derecha en rojo?
  choices:
    A: Reducir la velocidad a 5 mph y continuar sin detenerse
    B: Detenerse en la línea de parada y verificar el tráfico y los peatones
    C: Tocar la bocina para advertir al tráfico que cruza
    D: Esperar a que la luz cambie a amarillo antes de girar
  answer: B
  explanation: Si no hay una señal de NO TURN ON RED en el semáforo, después de detenerse
    en la línea de parada y verificar el tráfico y los peatones, puede girar a la
    derecha en rojo.
- id: 172
  category: safe_driving_rules
  question: Al salir de una entrada privada (driveway), callejón o área de un edificio
    como una gasolinera, ¿dónde debe detenerse?
  choices:
    A: Justo después de la acera para poder ver el tráfico.
    B: No es necesario detenerse a menos que haya peatones presentes.
    C: Detrás de la acera.
    D: En el carril de circulación más cercano.
  answer: C
  explanation: Si está saliendo de una entrada privada, callejón o área de un edificio,
    es obligatorio detenerse tal como lo haría si hubiera una señal de alto. Debe
    detenerse detrás de la acera y debe ceder el derecho de paso a todos los peatones
    y al tráfico.
- id: 173
  category: signs_and_signals
  question: En un carril reversible, ¿qué significa una señal de "X" amarilla intermitente?
  choices:
    A: El carril no está disponible.
    B: Puede usar el carril debajo de ella para circulación general.
    C: El uso del carril está cambiando y debe salirse de él.
    D: El carril es solo para girar.
  answer: D
  explanation: Las señales sobre los carriles designan el flujo de tráfico en los
    carriles reversibles. Una "X" amarilla intermitente significa que el carril es
    solo para girar.
- id: 174
  category: signs_and_signals
  question: ¿Qué indica una señal de "X" amarilla fija sobre un carril reversible?
  choices:
    A: El carril es solo para girar.
    B: El uso del carril está cambiando y debe salirse de él tan pronto como sea seguro.
    C: Puede usar el carril para rebasar.
    D: El carril está reservado para autobuses.
  answer: B
  explanation: Una "X" amarilla fija significa que el uso del carril está cambiando
    y debe salirse de él tan pronto como sea seguro hacerlo.
- id: 175
  category: signs_and_signals
  question: ¿Qué símbolo se coloca a menudo al lado de la carretera o se pinta en
    la superficie de la vía para marcar un carril reservado?
  choices:
    A: Un diamante blanco
    B: Un círculo amarillo
    C: Un octágono rojo
    D: Un cuadrado verde
  answer: A
  explanation: Los carriles reservados están marcados por señales especiales que indican
    que el carril está reservado para un uso especial y, a menudo, tienen un diamante
    blanco colocado al lado de la carretera o pintado en la superficie de la vía.
- id: 176
  category: sharing_the_road
  question: ¿Qué indica una señal de "HOV 3" sobre un carril reservado?
  choices:
    A: Los vehículos deben circular al menos 3 mph por encima del límite de velocidad.
    B: El carril está reservado para vehículos con al menos tres personas en ellos.
    C: El carril está reservado para vehículos comerciales pesados de 3 ejes.
    D: Solo los vehículos híbridos o eléctricos pueden usar el carril.
  answer: B
  explanation: Las señales o marcas HOV significan "Vehículos de Alta Ocupación" (High
    Occupancy Vehicles) e indican carriles reservados para vehículos con dos o más
    personas en ellos. "HOV 3" significa que debe haber al menos tres personas en
    el vehículo para usar ese carril.
- id: 177
  category: safe_driving_rules
  question: Si se pasa de una vuelta o salida mientras conduce, ¿qué debe hacer?
  choices:
    A: Detenerse y retroceder con cuidado en el carril de circulación.
    B: Detenerse en el acotamiento y retroceder hasta la salida.
    C: Continuar hasta donde sea seguro dar la vuelta.
    D: Hacer un giro en U a través de la mediana.
  answer: C
  explanation: Si se pasa de una vuelta o salida, no retroceda. El conductor debe
    continuar hasta donde sea seguro dar la vuelta.
- id: 178
  category: safe_driving_rules
  question: Al conducir en una carretera con tres o más carriles que circulan en la
    misma dirección, ¿qué carril debería usar generalmente?
  choices:
    A: El carril del extremo izquierdo
    B: El carril del extremo derecho
    C: El carril central de circulación
    D: El acotamiento
  answer: C
  explanation: En una carretera con tres o más carriles que circulan en la misma dirección,
    use el carril central de circulación, especialmente cuando hay mucho tráfico entrando
    o saliendo del flujo vehicular.
- id: 179
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla con respecto a rebasar en carreteras
    de carriles múltiples?
  choices:
    A: El carril del extremo derecho está destinado a rebasar vehículos más lentos.
    B: Puede rebasar por el acotamiento pavimentado si el vehículo de adelante está
      girando a la izquierda.
    C: El carril del extremo izquierdo está destinado a ser utilizado para rebasar
      vehículos más lentos.
    D: Rebasar por la derecha es siempre la opción más segura.
  answer: C
  explanation: En carreteras de carriles múltiples, el carril del extremo izquierdo
    está destinado a ser utilizado para rebasar vehículos más lentos.
- id: 180
  category: safe_driving_rules
  question: 'Al dar una vuelta en una intersección donde no hay señales ni marcas
    de carril para controlar el giro, usted debe:'
  choices:
    A: Girar hacia el carril más alejado para dejar espacio a otros vehículos.
    B: Girar hacia el carril más cercano a usted que vaya en la dirección a la que
      desea ir.
    C: Girar siempre hacia el carril central.
    D: Abrirse demasiado hacia el lado opuesto antes de girar.
  answer: B
  explanation: Como medida de seguridad, gire hacia el carril más cercano a usted
    que vaya en la dirección a la que desea ir. De esta manera, cruzará la menor cantidad
    de carriles de tráfico.
- id: 181
  category: safe_driving_rules
  question: ¿Cuál es un peligro común de abrirse demasiado hacia la izquierda antes
    de dar una vuelta a la derecha?
  choices:
    A: Podría golpear a un peatón en el paso de cebra.
    B: El conductor detrás de usted puede pensar que está cambiando de carril e intentar
      rebasarlo por la derecha.
    C: Su vehículo perderá tracción y patinará.
    D: Se verá obligado a entrar en un carril reversible.
  answer: B
  explanation: En las vueltas a la derecha, evite abrirse demasiado hacia la izquierda
    antes de realizar el giro. Al moverse hacia el otro carril, el conductor detrás
    de usted puede pensar que está cambiando de carril o que va a girar a la izquierda
    y puede intentar rebasarlo por la derecha.
- id: 182
  category: safe_driving_rules
  question: ¿Cuál es la forma más segura de cambiar de dirección si se encuentra circulando
    en el sentido incorrecto en una calle de la ciudad?
  choices:
    A: Hacer un giro en U en medio de la calle.
    B: Realizar un giro de dos puntos hacia adelante en una intersección con mucho
      tráfico.
    C: Dar vuelta a la derecha y dar la vuelta a la manzana.
    D: Cruzar la franja divisoria central (mediana).
  answer: C
  explanation: La forma más segura de cambiar de dirección es dar vuelta a la derecha
    y dar la vuelta a la manzana. Esto evita la mayoría de los giros a la izquierda
    a través del tráfico.
- id: 183
  category: safe_driving_rules
  question: 'Si necesita dar la vuelta mientras conduce en el sistema de autopistas
    interestatales, debe:'
  choices:
    A: Usar las áreas de cruce reservadas para vehículos de emergencia.
    B: Cruzar la franja divisoria central con cuidado.
    C: Ir a la siguiente salida y dar la vuelta.
    D: Detenerse en el acotamiento y esperar un espacio en el tráfico para dar la
      vuelta.
  answer: C
  explanation: Si se encuentra en el sistema interestatal, vaya a la siguiente salida
    y dé la vuelta. Es ilegal cruzar la franja divisoria central o utilizar las áreas
    de cruce reservadas para vehículos de emergencia.
- id: 184
  category: safe_driving_rules
  question: Al realizar un giro de dos puntos (two-point turnabout) usando una entrada
    para autos, ¿cuál se considera el método más seguro?
  choices:
    A: Entrar de frente a la entrada para autos y salir de reversa hacia la calle.
    B: Retroceder el vehículo hacia la entrada para autos para poder ver mejor el
      tráfico al salir.
    C: Hacer un giro en U sin entrar en la entrada para autos.
    D: Conducir sobre la acera para dar la vuelta.
  answer: B
  explanation: La forma más segura de realizar un giro de dos puntos es retroceder
    el vehículo hacia la entrada para autos. Esto le permite ver mejor el tráfico
    al salir de la misma.
- id: 185
  category: defensive_driving
  question: Según el manual, ¿cuál es la forma más difícil y peligrosa de realizar
    un giro de retorno (turnabout)?
  choices:
    A: Un giro en U
    B: Un giro de dos puntos hacia adelante
    C: Un giro de tres puntos (three-point turnabout)
    D: Navegar por una glorieta
  answer: C
  explanation: 'El manual establece: ''Giro de tres puntos: esta es la forma más difícil
    y peligrosa de realizar un giro de retorno. Úselo solo cuando la carretera o calle
    sea demasiado estrecha para dar un giro en U y no pueda dar la vuelta a la manzana''.'
- id: 186
  category: safe_driving_rules
  question: Si debe realizar un giro en U, ¿cómo debe posicionar su vehículo antes
    de comenzar el giro?
  choices:
    A: Muévase lo más a la izquierda que pueda
    B: Muévase lo más a la derecha que pueda
    C: Colóquese sobre la línea central
    D: Deténgase en medio de la intersección
  answer: B
  explanation: 'El manual instruye: ''Si debe realizar un giro en U, muévase lo más
    a la derecha que pueda. Espere a que haya un espacio grande en el tráfico en ambas
    direcciones y luego gire el volante bruscamente a la izquierda...'''
- id: 187
  category: safe_driving_rules
  question: ¿A qué velocidad debe reducir al entrar en una glorieta o círculo de tráfico?
  choices:
    A: 5 a 10 mph
    B: 15 a 20 mph
    C: 25 a 30 mph
    D: 35 a 40 mph
  answer: B
  explanation: 'Al entrar en una glorieta o círculo de tráfico, debe negociar una
    curva cerrada. El manual indica: ''Reduzca su velocidad a unas 15 a 20 mph''.'
- id: 188
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso cuando usted está entrando en una glorieta?
  choices:
    A: El tráfico que entra
    B: El tráfico que ya está circulando
    C: Los vehículos a la derecha
    D: Solo los camiones grandes
  answer: B
  explanation: En una glorieta, los vehículos viajan en sentido contrario a las agujas
    del reloj alrededor de una isla central elevada, 'y el tráfico que entra debe
    ceder el derecho de paso al tráfico que ya está circulando'.
- id: 189
  category: signs_and_signals
  question: ¿Cómo debe usar sus señales de giro si va a seguir recto a través de un
    círculo de tráfico o glorieta?
  choices:
    A: Señalar a la 'izquierda' al aproximarse a la glorieta
    B: Señalar a la 'derecha' al aproximarse a la glorieta
    C: No se necesita señal al aproximarse, pero señale a la 'derecha' antes de la
      salida que desea tomar
    D: No se requieren señales de giro en ningún momento
  answer: C
  explanation: 'El manual establece: ''Si va a seguir recto, no se necesita ninguna
    señal al aproximarse. Sin embargo, señale a la "derecha" antes de la salida que
    desea tomar''.'
- id: 190
  category: sharing_the_road
  question: ¿Qué peligro específico debe evitar al conducir en un círculo de tráfico
    o glorieta?
  choices:
    A: Motocicletas
    B: Bicicletas
    C: Peatones
    D: Vehículos grandes, como camiones y autobuses
  answer: D
  explanation: 'El manual advierte explícitamente: ''No conduzca junto a vehículos
    grandes, como camiones y autobuses, en un círculo de tráfico o glorieta''.'
- id: 191
  category: sharing_the_road
  question: ¿Cuándo se requiere que usted se detenga ante un autobús escolar?
  choices:
    A: Solo cuando el autobús está en su lado de la carretera
    B: Cuando está detenido con sus luces rojas parpadeando y/o el brazo de parada
      extendido
    C: Solo cuando ve niños cruzando activamente la calle
    D: Cuando el autobús está detenido en un cruce de ferrocarril
  answer: B
  explanation: Según las reglas para autobuses escolares, 'Debe detenerse ante un
    autobús escolar que esté detenido con sus luces rojas parpadeando y/o el brazo
    de parada extendido'.
- id: 192
  category: defensive_driving
  question: Al entrar en su vehículo estacionado en la calle, ¿cómo debe acercarse
    a la puerta del conductor?
  choices:
    A: Desde la parte trasera del vehículo
    B: Desde la parte delantera del vehículo
    C: Directamente desde la acera
    D: No importa cómo se acerque
  answer: B
  explanation: 'Para aumentar la seguridad, el manual aconseja: ''Al entrar en su
    vehículo en la calle, acérquese a la puerta del conductor con la llave en la mano
    desde la parte delantera del vehículo para aumentar la conciencia del tráfico
    que se aproxima''.'
- id: 193
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante cuando se estaciona cuesta abajo,
    ya sea con o sin bordillo (acera)?
  choices:
    A: Bruscamente lejos del borde o del lado del bordillo
    B: Bruscamente hacia el borde o el lado del bordillo de la calzada
    C: Mantener las ruedas perfectamente rectas
    D: Girar las ruedas ligeramente hacia la izquierda
  answer: B
  explanation: Al estacionar cuesta abajo con o sin bordillo, debe 'Girar el volante
    bruscamente hacia el borde o el lado del bordillo de la calzada mientras se mueve
    lentamente hacia adelante'. Esto asegura que el vehículo ruede lejos del tráfico
    si se mueve.
- id: 194
  category: safe_driving_rules
  question: ¿Cómo debe girar el volante al estacionar su vehículo cuesta arriba y
    NO hay bordillo (acera)?
  choices:
    A: Bruscamente hacia el borde de la carretera
    B: Bruscamente lejos del borde de la carretera
    C: Mantener las ruedas rectas
    D: Girar las ruedas hacia la izquierda
  answer: A
  explanation: Al estacionar cuesta arriba sin bordillo, debe 'Avanzar lentamente
    girando el volante bruscamente hacia el borde de la carretera'. De esta manera,
    si el vehículo se mueve, rodará lejos del tráfico.
- id: 195
  category: safe_driving_rules
  question: Al salir de un espacio de estacionamiento perpendicular o en ángulo, ¿qué
    distancia debe retroceder en línea recta antes de girar el volante?
  choices:
    A: Hasta que su parachoques trasero salga del espacio
    B: Hasta que su parachoques delantero pase el vehículo estacionado a su lado,
      en dirección opuesta a la que está girando
    C: Hasta que esté completamente en el centro del carril de circulación
    D: Debe girar el volante inmediatamente al comenzar a retroceder
  answer: B
  explanation: Al salir de estos espacios de estacionamiento, debe 'Continuar verificando
    el tráfico y retroceder en línea recta hasta que su parachoques delantero pase
    el vehículo estacionado a su lado, en dirección opuesta a la que está girando.
    Luego gire el volante bruscamente...'
- id: 196
  category: safe_driving_rules
  question: ¿En qué dirección circulan los vehículos alrededor de la isla central
    elevada de una rotonda?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En un patrón de figura en ocho
    D: En cualquier dirección que sea más corta hacia la salida
  answer: B
  explanation: 'El manual establece: ''Los vehículos circulan en sentido contrario
    a las agujas del reloj alrededor de una isla central elevada, y el tráfico que
    entra debe ceder el paso al tráfico que circula''.'
- id: 197
  category: sharing_the_road
  question: Si hay un carril central de giro entre las calzadas, ¿está obligado a
    detenerse ante un autobús escolar con luces rojas parpadeantes en el lado opuesto
    de la carretera?
  choices:
    A: Sí, debe detenerse ya sea que el autobús esté en su lado o en el lado opuesto.
    B: No, el carril central de giro actúa como una barrera física.
    C: Solo si está conduciendo actualmente en el carril central de giro.
    D: No, solo se detiene si el autobús está en su lado de la carretera.
  answer: A
  explanation: 'El manual establece claramente: ''Debe detenerse ante un autobús escolar
    cuando hay un carril central de giro entre las calzadas, ya sea que el autobús
    escolar esté en su lado de la carretera o en el lado opuesto de la carretera''.'
- id: 198
  category: safe_driving_rules
  question: Según el manual, ¿a cuántos pies de un hidrante de incendios está prohibido
    estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: El manual establece bajo Zonas de No Estacionar que no debe estacionarse
    a menos de 15 pies de un hidrante de incendios.
- id: 199
  category: safe_driving_rules
  question: ¿A cuántos pies de una señal de tráfico, señal de pare (stop) o señal
    de ceda el paso (yield) no puede estacionar su vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El manual prohíbe estacionar a menos de 30 pies de una señal de tráfico,
    señal de pare o señal de ceda el paso.
- id: 200
  category: signs_and_signals
  question: ¿Qué indica un bordillo (acera) pintado de rojo?
  choices:
    A: Solo se permiten paradas cortas
    B: Una zona de carga
    C: Una restricción para personas con discapacidad
    D: Restricciones de zona de incendios
  answer: D
  explanation: Los bordillos pintados indican restricciones de estacionamiento, y
    un bordillo rojo indica restricciones de zona de incendios.
- id: 201
  category: signs_and_signals
  question: 'Un bordillo (acera) pintado de blanco significa:'
  choices:
    A: Solo se permiten paradas cortas
    B: Es una zona de carga
    C: El estacionamiento está prohibido en todo momento
    D: Es una restricción para personas con discapacidad
  answer: A
  explanation: Según el manual, un bordillo pintado de blanco indica que solo se permiten
    paradas cortas.
- id: 202
  category: safe_driving_rules
  question: 'Al estacionar su vehículo en paralelo al bordillo, no debe estacionar
    a más de:'
  choices:
    A: 6 pulgadas del bordillo
    B: 1 pie del bordillo
    C: 18 pulgadas del bordillo
    D: 2 pies del bordillo
  answer: B
  explanation: El manual establece en la sección de Zonas de No Estacionar que no
    debe estacionar a más de 1 pie del bordillo.
- id: 203
  category: defensive_driving
  question: ¿Qué tan lejos debe mirar hacia adelante cuando conduce en la ciudad?
  choices:
    A: Al menos una cuadra o una señal de tráfico adelante
    B: Al menos dos cuadras o dos señales de tráfico adelante
    C: Al menos tres cuadras o tres señales de tráfico adelante
    D: Al menos un cuarto de milla adelante
  answer: B
  explanation: En la ciudad, debe mirar al menos dos cuadras o dos señales de tráfico
    adelante para ver los problemas a tiempo y evitar el frenado de emergencia.
- id: 204
  category: defensive_driving
  question: 'Para identificar problemas potenciales en su trayectoria, debe mantener
    una ventaja visual de:'
  choices:
    A: 5 a 10 segundos adelante
    B: 10 a 15 segundos adelante
    C: 20 a 30 segundos adelante
    D: 30 a 40 segundos adelante
  answer: C
  explanation: Una ventaja visual es un área de 20 a 30 segundos por delante de la
    parte frontal del vehículo. Tener una buena ventaja visual le ayuda a ver cambios
    en su trayectoria.
- id: 205
  category: safe_driving_rules
  question: A 60 mph, ¿aproximadamente cuánto tiempo y qué distancia se necesita para
    reaccionar ante un problema y detener el vehículo en pavimento seco?
  choices:
    A: 2 a 3 segundos o 123 pies
    B: 3 a 4 segundos o 250 pies
    C: 4 a 5 segundos o 359 pies
    D: 5 a 6 segundos o 450 pies
  answer: C
  explanation: Incluso con buenos neumáticos y pavimento seco, a 60 mph puede tomar
    entre 4 y 5 segundos o 359 pies reaccionar ante un problema y detener el vehículo.
- id: 206
  category: defensive_driving
  question: Si está detenido en una intersección, ¿hacia dónde debe mirar antes de
    entrar?
  choices:
    A: Izquierda, derecha y otra vez a la izquierda
    B: Derecha, izquierda y otra vez a la derecha
    C: Solo hacia adelante
    D: Solo a la izquierda y hacia adelante
  answer: A
  explanation: El manual aconseja que, si está detenido en una intersección, debe
    mirar a la izquierda, a la derecha y otra vez a la izquierda antes de entrar en
    la intersección.
- id: 207
  category: safe_driving_rules
  question: Al salir de un espacio de estacionamiento en paralelo, ¿cuándo debe enderezar
    las ruedas e incorporarse al carril de tráfico correspondiente?
  choices:
    A: Tan pronto como ponga la marcha hacia adelante (drive)
    B: Cuando su parachoques delantero pase el parachoques trasero del vehículo de
      adelante
    C: Cuando el poste de la puerta de su vehículo pase el parachoques trasero del
      vehículo estacionado delante de usted
    D: Después de haber retrocedido lo más posible
  answer: C
  explanation: Debe enderezar las ruedas e incorporarse al carril de tráfico correspondiente
    cuando el poste de la puerta del vehículo pase el parachoques trasero del vehículo
    estacionado delante de usted.
- id: 208
  category: signs_and_signals
  question: Según el examen de conocimientos del manual, ¿de qué color son las señales
    reglamentarias?
  choices:
    A: Verde
    B: Amarillo
    C: Blanco
    D: Naranja
  answer: C
  explanation: La sección 'Ponga a prueba sus conocimientos' indica que las señales
    reglamentarias son blancas.
- id: 209
  category: safe_driving_rules
  question: Al estacionar su vehículo cuesta arriba con bordillo, ¿cómo deben estar
    posicionadas las ruedas?
  choices:
    A: Giradas hacia el bordillo
    B: Giradas en dirección contraria al bordillo
    C: Orientadas hacia adelante
    D: Giradas hacia la derecha
  answer: B
  explanation: La sección 'Ponga a prueba sus conocimientos' confirma que al estacionar
    su vehículo cuesta arriba con bordillo, las ruedas deben estar giradas en dirección
    contraria al bordillo.
- id: 210
  category: safe_driving_rules
  question: ¿Qué debe hacer al prepararse para girar a la izquierda en una intersección?
  choices:
    A: Esperar detrás del paso de peatones hasta que la luz se ponga roja.
    B: Avanzar hacia la intersección para estar listo para girar a la izquierda.
    C: Girar las ruedas hacia la izquierda mientras espera un espacio.
    D: Acelerar para ganarle al tráfico que viene en sentido contrario.
  answer: B
  explanation: Según el manual, al girar a la izquierda en una intersección, debe
    avanzar hacia la intersección para estar listo para girar a la izquierda.
- id: 211
  category: safe_driving_rules
  question: ¿Cómo debe aproximarse a un cruce de ferrocarril a nivel en una carretera?
  choices:
    A: Mantener su velocidad hasta que vea las vías.
    B: Detenerse inmediatamente ante la señal de advertencia redonda.
    C: Reducir la velocidad ante la señal de advertencia redonda y mirar en cada dirección.
    D: Acelerar para cruzar las vías lo más rápido posible.
  answer: C
  explanation: El manual establece que debe aproximarse a cualquier cruce de ferrocarril
    a nivel reduciendo la velocidad ante la señal de advertencia redonda y mirando
    en cada dirección antes de llegar a las vías.
- id: 212
  category: defensive_driving
  question: Al cambiar de carril, ¿qué tamaño de espacio en el tráfico debe identificar
    antes de moverse?
  choices:
    A: 2 a 3 segundos
    B: 4 a 5 segundos
    C: 6 a 8 segundos
    D: 10 a 12 segundos
  answer: B
  explanation: Al cambiar de carril, debe identificar un espacio de 4 a 5 segundos
    en el tráfico, señalizar y mirar de nuevo en la dirección del cambio de carril.
- id: 213
  category: defensive_driving
  question: ¿Cómo debe revisar los puntos ciegos de su vehículo antes de cambiar de
    carril?
  choices:
    A: Mirando estrictamente por su espejo retrovisor.
    B: Revisando sus espejos laterales dos veces.
    C: Girando la cabeza y mirando por encima del hombro.
    D: Tocando la bocina para advertir a otros conductores.
  answer: C
  explanation: Debe revisar sus puntos ciegos girando la cabeza y mirando por encima
    del hombro en la dirección en la que planea moverse, ya que estas son áreas que
    no puede ver con sus espejos.
- id: 214
  category: defensive_driving
  question: ¿Cuándo es especialmente importante usar sus espejos para revisar detrás
    de su vehículo?
  choices:
    A: Al acelerar en una rampa de entrada a la autopista.
    B: Al reducir la velocidad rápidamente o en lugares inesperados como entradas
      privadas.
    C: Al conducir a través de una luz verde.
    D: Al estar estacionado en un espacio de estacionamiento designado.
  answer: B
  explanation: Es muy importante revisar detrás de su vehículo cuando reduce la velocidad
    rápidamente o en puntos donde un conductor que le sigue no esperaría que usted
    redujera la velocidad, como entradas privadas o espacios de estacionamiento.
- id: 215
  category: defensive_driving
  question: ¿Cuál es el tiempo de percepción promedio para que un conductor alerta
    reconozca un peligro?
  choices:
    A: 1/4 a 1/2 segundo
    B: 3/4 a 1 segundo
    C: 1.5 a 2 segundos
    D: 3 a 4 segundos
  answer: B
  explanation: El manual establece que el tiempo de percepción promedio para un conductor
    alerta es de ¾ de segundo a 1 segundo.
- id: 216
  category: safe_driving_rules
  question: Bajo condiciones ideales, ¿cuál es la distancia total mínima de parada
    para un vehículo que viaja a 50 mph?
  choices:
    A: 55 pies
    B: 158 pies
    C: 268 pies
    D: 350 pies
  answer: C
  explanation: La distancia total de parada incluye la percepción, la reacción y la
    distancia de frenado. A 50 mph, su vehículo recorrerá un mínimo de 268 pies para
    detenerse por completo.
- id: 217
  category: safe_driving_rules
  question: ¿Qué sucede con el impacto y la distancia de frenado cuando duplica su
    velocidad de 20 mph a 40 mph?
  choices:
    A: Se duplican.
    B: Se triplican.
    C: Se vuelven 4 veces mayores.
    D: Se vuelven 9 veces mayores.
  answer: C
  explanation: Cuando duplica su velocidad de 20 a 40 mph, el impacto es 4 veces mayor
    y la distancia de frenado también es 4 veces más larga.
- id: 218
  category: defensive_driving
  question: ¿Qué tan adelante de su vehículo debe mirar para evitar paradas de pánico?
  choices:
    A: Al menos 3 segundos
    B: Al menos 5 segundos
    C: Al menos 10 segundos
    D: Al menos 15 segundos
  answer: C
  explanation: Debe mirar al menos diez segundos por delante de su vehículo para evitar
    paradas de pánico al ver eventos y problemas con suficiente antelación.
- id: 219
  category: safe_driving_rules
  question: ¿Cuál es la forma más segura de navegar una curva en la carretera?
  choices:
    A: Acelerar fuertemente antes de entrar en la curva.
    B: Frenar bruscamente después de entrar en la curva.
    C: Reducir la velocidad antes de entrar en la curva.
    D: Avanzar por inercia a través de la curva en punto muerto (neutral).
  answer: C
  explanation: Siempre reduzca la velocidad antes de entrar en la curva a una velocidad
    segura. Frenar bruscamente después de entrar en una curva podría hacer que los
    neumáticos del vehículo pierdan tracción.
- id: 220
  category: defensive_driving
  question: ¿Por qué las carreteras suelen estar más resbaladizas cuando empieza a
    llover?
  choices:
    A: La lluvia elimina los productos químicos que mejoran la tracción en la carretera.
    B: El agua se mezcla con la suciedad, el aceite y otras sustancias en la calzada.
    C: La caída repentina de la temperatura congela la lluvia instantáneamente.
    D: Los neumáticos se enfrían demasiado para agarrarse al pavimento.
  answer: B
  explanation: Las carreteras están más resbaladizas cuando empieza a llover, nevar
    o caer aguanieve, ya que el agua se mezclará con la suciedad, el aceite y otras
    sustancias en la calzada.
- id: 221
  category: safe_driving_rules
  question: ¿Cuánto debe reducir su velocidad en calzadas mojadas?
  choices:
    A: Unas 5 mph por debajo de las velocidades recomendadas.
    B: Unas 10 mph por debajo de las velocidades recomendadas.
    C: A la mitad de la velocidad recomendada.
    D: No es necesario reducir la velocidad.
  answer: B
  explanation: En calzadas mojadas, debe reducir la velocidad unas 10 mph por debajo
    de las velocidades recomendadas para permitir una distancia de frenado adicional
    y una posible pérdida de tracción.
- id: 222
  category: safe_driving_rules
  question: ¿Cómo debe ajustar su velocidad si hay nieve compacta en la carretera?
  choices:
    A: Reduzca su velocidad en 5 mph.
    B: Reduzca su velocidad en 10 mph.
    C: Reduzca su velocidad a la mitad o más.
    D: Mantenga el límite de velocidad indicado.
  answer: C
  explanation: 'El manual establece: "Si hay nieve compacta en la carretera, reduzca
    su velocidad a la mitad o más".'
- id: 223
  category: vehicle_information
  question: En Kansas, ¿durante qué período se permite que los vehículos estén equipados
    con neumáticos para nieve con clavos?
  choices:
    A: Del 1 de octubre al 1 de marzo
    B: Del 1 de noviembre al 1 de abril
    C: Del 1 de diciembre al 28 de febrero
    D: Todo el año
  answer: B
  explanation: Los vehículos en Kansas pueden estar equipados con neumáticos para
    nieve con clavos desde el 1 de noviembre hasta el 1 de abril de cada año.
- id: 224
  category: defensive_driving
  question: ¿Por qué el diseño normal del drenaje de las calzadas hace que las carreteras
    cubiertas de hielo sean especialmente peligrosas?
  choices:
    A: Las rejillas de drenaje se congelan y crean grandes bultos.
    B: Las calzadas están inclinadas hacia el centro, lo que provoca que los vehículos
      choquen.
    C: Las calzadas son más altas en el centro e inclinadas hacia los lados, lo que
      hace que los vehículos que derrapan se salgan de la carretera.
    D: Las zanjas de drenaje se desbordan e inundan la calzada con hielo.
  answer: C
  explanation: Las calzadas cubiertas de hielo son especialmente peligrosas debido
    al diseño normal del drenaje de las calzadas, donde estas son más altas en el
    centro e inclinadas hacia los lados, lo que provoca que un vehículo que derrapa
    se deslice fuera de la calzada.
- id: 225
  category: safe_driving_rules
  question: ¿Por qué el pavimento de la calzada en puentes y pasos elevados puede
    estar cubierto de hielo incluso cuando el resto del pavimento está despejado?
  choices:
    A: Están construidos con hormigón más liso.
    B: Reciben menos luz solar directa que las carreteras normales.
    C: No tienen tierra debajo para ayudar a aislarlos contra el frío.
    D: Están diseñados para retener el agua durante períodos más largos.
  answer: C
  explanation: El manual establece que los puentes no tienen tierra debajo para ayudar
    a aislarlos contra el frío y pueden estar más fríos y más cubiertos de hielo que
    otras calzadas.
- id: 226
  category: defensive_driving
  question: ¿A qué velocidad pueden sus neumáticos perder toda la tracción con la
    carretera durante una lluvia intensa?
  choices:
    A: 25-30 mph
    B: 30-35 mph
    C: 35-40 mph
    D: 45-50 mph
  answer: D
  explanation: En una lluvia intensa, sus neumáticos pueden perder toda la tracción
    con la carretera a 45-50 mph debido a que el agua empuja contra los neumáticos
    mientras el vehículo avanza.
- id: 227
  category: vehicle_information
  question: ¿A qué velocidad comenzarán a perder tracción en calzadas mojadas los
    neumáticos muy desgastados?
  choices:
    A: 15-20 mph
    B: 25-30 mph
    C: 35-40 mph
    D: 45-50 mph
  answer: B
  explanation: El manual señala que los neumáticos muy desgastados perderán tracción
    a velocidades mucho más bajas, específicamente entre 25 y 30 mph.
- id: 228
  category: safe_driving_rules
  question: Conducir a más de ___ por debajo del patrón de flujo de tráfico puede
    ser tan peligroso como el exceso de velocidad.
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: C
  explanation: Conducir a más de 15 mph por debajo del patrón de flujo de tráfico
    puede ser tan peligroso como el exceso de velocidad porque hace que los vehículos
    se amontonen y provoca que otros asuman mayores riesgos para rebasar.
- id: 229
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de utilizar un carril de aceleración al incorporarse
    al flujo de tráfico?
  choices:
    A: Conducir hasta el final del carril de aceleración y detenerse para esperar
      un hueco.
    B: Cruzar la línea blanca continua inmediatamente para incorporarse lo más rápido
      posible.
    C: Usar el carril para alcanzar la velocidad de los otros vehículos antes de incorporarse
      a la calzada.
    D: Mantener una velocidad 15 mph inferior a la del flujo de tráfico hasta haberse
      incorporado por completo.
  answer: C
  explanation: El manual instruye a los conductores a usar el carril de aceleración
    para alcanzar la velocidad de los otros vehículos antes de incorporarse a la calzada,
    y advierte explícitamente que no se debe conducir hasta el final del carril y
    detenerse.
- id: 230
  category: safe_driving_rules
  question: Al usar un carril de desaceleración para salir de una autopista, ¿cuándo
    debe comenzar a reducir la velocidad?
  choices:
    A: Aproximadamente media milla antes de la rampa de salida.
    B: Mientras todavía se encuentra en el flujo de tráfico principal de la calzada.
    C: Solo después de que el vehículo se haya movido al carril de desaceleración.
    D: Inmediatamente después de pasar la señal de salida.
  answer: C
  explanation: Al usar un carril de desaceleración (rampa de salida), no reduzca la
    velocidad hasta que el vehículo se haya movido al carril de desaceleración.
- id: 231
  category: penalties_and_points
  question: ¿Puede ser multado por una infracción de tráfico si conduce a 55 mph en
    una zona de 55 mph durante una tormenta de nieve?
  choices:
    A: No, porque no está excediendo el límite de velocidad indicado.
    B: Sí, puede ser multado por viajar demasiado rápido para las condiciones.
    C: No, a menos que cause una colisión.
    D: Sí, pero solo si conduce un vehículo comercial.
  answer: B
  explanation: Puede ser multado por viajar demasiado rápido para las condiciones.
    Conducir a 55 mph en una tormenta de nieve no se reconoce como una velocidad aceptable
    para una carretera nevada, incluso si el límite de velocidad indicado permite
    55 mph.
- id: 232
  category: defensive_driving
  question: ¿Cuál es la mejor manera de evitar el exceso de velocidad?
  choices:
    A: Mantener el ritmo del vehículo más rápido en la carretera.
    B: Revisar su velocímetro con frecuencia.
    C: Escuchar el sonido de su motor.
    D: Permanecer en el carril derecho en todo momento.
  answer: B
  explanation: El manual establece que la mejor manera de evitar el exceso de velocidad
    es revisar su velocímetro con frecuencia, ya que es fácil viajar más rápido de
    lo que se percibe.
- id: 233
  category: vehicle_information
  question: ¿Por qué los vehículos más grandes como los SUV, las furgonetas y las
    camionetas tienen características de manejo especiales?
  choices:
    A: Tienen un centro de gravedad más alto y son más propensos a volcaduras.
    B: Están equipados con neumáticos más pequeños que los turismos.
    C: Carecen de sistemas de frenos antibloqueo (ABS).
    D: No están diseñados para conducir a velocidades de autopista.
  answer: A
  explanation: Los vehículos más grandes con un centro de gravedad más alto tienen
    características de manejo especiales y son más propensos a volcaduras.
- id: 234
  category: vehicle_information
  question: ¿Cuál es la función principal de un sistema de frenos antibloqueo (ABS)?
  choices:
    A: Aplica automáticamente los frenos cuando una colisión es inminente.
    B: Acorta las distancias de frenado en pavimento seco.
    C: Permite maniobrar y frenar al mismo tiempo sin perder el equilibrio del vehículo.
    D: Evita que el vehículo experimente hidroplaneo a velocidades superiores a 35
      mph.
  answer: C
  explanation: El ABS está diseñado para permitir maniobrar y frenar al mismo tiempo
    sin perder el equilibrio del vehículo.
- id: 235
  category: defensive_driving
  question: ¿Cuáles son los tres principios básicos para el uso del ABS?
  choices:
    A: Bombear, Maniobrar, Detenerse
    B: Buscar, Pisar a fondo, Maniobrar
    C: Escanear, Deslizar, Maniobrar
    D: Señalizar, Reducir, Detenerse
  answer: B
  explanation: Los principios básicos para el uso del ABS son Buscar (un espacio abierto),
    Pisar a fondo (el pedal del freno con firmeza) y Maniobrar (hacia el espacio abierto).
- id: 236
  category: vehicle_information
  question: ¿Cuáles son los pasos básicos para usar un sistema de frenos antibloqueo
    (ABS) durante una emergencia?
  choices:
    A: Buscar, Pisar a fondo, Maniobrar
    B: Escanear, Presionar, Maniobrar
    C: Buscar, Deslizar, Maniobrar
    D: Detenerse, Maniobrar, Acelerar
  answer: A
  explanation: Según el manual, los principios básicos para el uso del ABS son Buscar
    (un espacio abierto), Pisar a fondo (el pedal del freno con firmeza) y Maniobrar
    (hacia el espacio abierto).
- id: 237
  category: vehicle_information
  question: ¿Cómo puede saber si el sistema de frenos antibloqueo (ABS) de su vehículo
    NO funciona correctamente?
  choices:
    A: La luz del ABS nunca se ilumina al arrancar el coche.
    B: La luz del ABS se ilumina y luego se atenúa.
    C: La luz indicadora del ABS permanece encendida después de arrancar el vehículo.
    D: El pedal del freno se siente inusualmente firme.
  answer: C
  explanation: El manual establece que al arrancar el vehículo, la luz del ABS se
    iluminará y luego se atenuará. Si la luz permanece encendida, el ABS no está funcionando
    correctamente.
- id: 238
  category: defensive_driving
  question: ¿Qué debe hacer si experimenta una pérdida de tracción en un vehículo
    equipado con un Programa Electrónico de Estabilidad (ESP)?
  choices:
    A: Maniobrar bruscamente en la dirección opuesta al derrape.
    B: Dirigir el vehículo hacia la dirección a la que está mirando y evitar maniobras
      bruscas.
    C: Bombear los frenos rápidamente para recuperar la tracción.
    D: Acelerar fuertemente para superar la pérdida de tracción.
  answer: B
  explanation: En caso de pérdida de tracción con ESP, debe dirigir el vehículo hacia
    la dirección a la que está mirando y evitar maniobras bruscas, permitiendo que
    el ESP ajuste electrónicamente el vehículo.
- id: 239
  category: safe_driving_rules
  question: En condiciones normales de conducción, ¿cuál es la distancia de seguimiento
    mínima recomendada?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: B
  explanation: El manual aconseja a los conductores mantener una distancia de seguimiento
    mínima de dos segundos en condiciones normales.
- id: 240
  category: safe_driving_rules
  question: ¿Cuánta distancia de seguimiento adicional debe añadir en caso de condiciones
    meteorológicas o de tráfico inusuales?
  choices:
    A: Un segundo adicional
    B: Dos segundos adicionales
    C: Tres segundos adicionales
    D: Cuatro segundos adicionales
  answer: A
  explanation: Debe mantener una distancia de seguimiento mínima de dos segundos,
    con un segundo adicional por cualquier condición meteorológica o de tráfico inusual.
- id: 241
  category: sharing_the_road
  question: ¿Por qué es importante mantener más espacio delante de su vehículo cuando
    sigue a una motocicleta?
  choices:
    A: Las motocicletas aceleran mucho más lento que los automóviles.
    B: Se requiere que las motocicletas circulen por el centro del carril.
    C: Las motocicletas tienen tamaños y capacidades de frenado diferentes a los de
      otros vehículos motorizados.
    D: Las motocicletas siempre viajan a velocidades más bajas que el resto del tráfico.
  answer: C
  explanation: El manual establece que se debe mantener más espacio al seguir motocicletas
    porque tienen diferentes tamaños y capacidades de frenado. Si el motociclista
    se cae, usted necesita una distancia adicional para evitar al conductor.
- id: 242
  category: vehicle_information
  question: ¿Cómo afecta el transporte de una carga pesada o el remolque de un tráiler
    al manejo de su vehículo?
  choices:
    A: Disminuye el tiempo de parada y aumenta la capacidad de dirección.
    B: Aumenta el tiempo de parada y disminuye la capacidad de dirección.
    C: No tiene efecto en el tiempo de parada pero mejora la dirección.
    D: Mejora la tracción de su vehículo en climas húmedos.
  answer: B
  explanation: Es necesario dejar más espacio delante de su vehículo cuando transporte
    una carga pesada o remolque un tráiler, ya que el peso adicional aumenta el tiempo
    de parada de su vehículo y disminuye la capacidad de dirección.
- id: 243
  category: sharing_the_road
  question: ¿Muchos estados requieren que otros vehículos se mantengan al menos a
    cuántos pies de la parte trasera de los equipos de emergencia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Muchos estados requieren que otros vehículos se mantengan al menos
    a 500 pies de la parte trasera de los equipos de emergencia, lo cual es un mínimo
    de 12 segundos a 30 mph.
- id: 244
  category: defensive_driving
  question: ¿Qué debe hacer si lo siguen demasiado de cerca (tailgated) y no hay un
    carril vacío al cual cambiarse?
  choices:
    A: Toque sus frenos rápidamente para advertir al conductor que está detrás de
      usted.
    B: Aumente la velocidad significativamente para incrementar la distancia.
    C: Espere hasta que el camino de adelante esté despejado, luego reduzca la velocidad
      lentamente para animar al conductor de atrás a rebasarlo.
    D: Reduzca la velocidad rápidamente para desanimar al conductor de atrás.
  answer: C
  explanation: Si no hay un carril vacío, espere hasta que el camino de adelante esté
    despejado, luego reduzca la velocidad lentamente para animar al conductor que
    lo sigue de cerca a rodear su vehículo. Nunca reduzca la velocidad rápidamente.
- id: 245
  category: defensive_driving
  question: Si su vehículo está siendo seguido demasiado de cerca, ¿cómo debe ajustar
    su distancia de seguimiento con respecto al vehículo que tiene delante?
  choices:
    A: Disminuirla en 1 segundo.
    B: Mantenerla exactamente en 2 segundos.
    C: Aumentarla de 2 a 3 segundos.
    D: Aumentarla de 5 a 6 segundos.
  answer: C
  explanation: Si su vehículo está siendo seguido demasiado de cerca, aumente su distancia
    de seguimiento de 2 a 3 segundos para permitir más tiempo y espacio para detenerse,
    disminuyendo el riesgo de ser chocado por detrás.
- id: 246
  category: safe_driving_rules
  question: Al conducir en una carretera de doble sentido y un solo carril, ¿dónde
    es generalmente más seguro posicionar su vehículo?
  choices:
    A: Pegado a la marca de la línea central.
    B: En el centro de su carril.
    C: Lo más cerca posible del borde derecho de la carretera.
    D: Alternando entre los lados izquierdo y derecho del carril.
  answer: B
  explanation: En una carretera de doble sentido y un solo carril, no se pegue a la
    marca de la línea central. En general, lo más seguro es conducir en el centro
    de su carril para que su vehículo pueda moverse a la izquierda o a la derecha
    para evitar un problema potencial.
- id: 247
  category: safe_driving_rules
  question: Al incorporarse al flujo de otro tráfico, ¿qué tamaño de espacio en el
    tráfico debe seleccionar?
  choices:
    A: 1 a 2 segundos
    B: 2 a 3 segundos
    C: 4 a 6 segundos
    D: 8 a 10 segundos
  answer: C
  explanation: Al incorporarse al flujo de otro tráfico, seleccione un espacio en
    el flujo de tráfico de 4 a 6 segundos.
- id: 248
  category: safe_driving_rules
  question: Bajo circunstancias normales, ¿aproximadamente cuánto tiempo le toma a
    un vehículo cruzar una intersección cuando sigue recto después de detenerse?
  choices:
    A: 1 a 2 segundos
    B: 3 a 5 segundos
    C: 6 a 8 segundos
    D: 10 a 12 segundos
  answer: B
  explanation: Al seguir recto después de detenerse en una intersección, bajo circunstancias
    normales, un vehículo puede cruzar una intersección en un tiempo de 3 a 5 segundos.
- id: 249
  category: safe_driving_rules
  question: Bajo circunstancias normales, ¿cuánto tiempo puede tomar completar un
    giro a la izquierda y alcanzar la velocidad adecuada?
  choices:
    A: 3 a 5 segundos
    B: 8 a 10 segundos
    C: 12 a 15 segundos
    D: 15 a 18 segundos
  answer: D
  explanation: El manual establece que puede tomar de 15 a 18 segundos completar un
    giro a la izquierda y alcanzar la velocidad adecuada.
- id: 250
  category: signs_and_signals
  question: ¿Qué debe hacer si tiene la luz verde del semáforo, pero hay vehículos
    bloqueando la intersección en ese momento?
  choices:
    A: Entrar en la intersección y esperar a que los vehículos se muevan.
    B: Tocar la bocina hasta que el camino esté despejado.
    C: No comenzar a cruzar la intersección hasta que el camino esté despejado.
    D: Avanzar lentamente para obligar a los vehículos a moverse.
  answer: C
  explanation: Incluso si tiene la luz verde del semáforo, no comience a cruzar la
    intersección cuando haya vehículos bloqueando el paso. Si queda atrapado en la
    intersección cuando la luz cambia a rojo, su vehículo estará bloqueando ilegalmente
    el flujo del tráfico.
- id: 251
  category: safe_driving_rules
  question: ¿Por qué debe esperar hasta que un vehículo que se aproxima realmente
    comience a girar antes de incorporarse a un carril, incluso si su luz direccional
    está activada?
  choices:
    A: La luz direccional podría estar rota.
    B: El conductor puede planear girar después de pasarle a usted o puede haber olvidado
      apagarla.
    C: Es ilegal girar mientras la señal de otro vehículo está encendida.
    D: Siempre debe ceder el paso a los vehículos con luces direccionales activas.
  answer: B
  explanation: El manual establece que un conductor con una luz direccional activada
    puede planear girar después de pasar su vehículo o puede haber olvidado apagar
    la señal de un giro anterior.
- id: 252
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cuándo es seguro regresar a su carril de
    circulación?
  choices:
    A: Cuando esté a una distancia de un automóvil por delante del vehículo rebasado.
    B: Cuando pueda ver la parte delantera completa del vehículo rebasado en su espejo
      retrovisor.
    C: Tan pronto como esté paralelo al parachoques delantero del vehículo rebasado.
    D: Cuando el vehículo rebasado parpadee sus luces delanteras.
  answer: B
  explanation: Debe continuar rebasando hasta que la parte delantera completa del
    vehículo rebasado sea visible en su espejo retrovisor antes de señalar y regresar
    al carril.
- id: 253
  category: sharing_the_road
  question: ¿Qué debe hacer cuando se dé cuenta de que otro vehículo quiere rebasarlo?
  choices:
    A: Aumentar la velocidad para evitar que lo rebasen.
    B: Moverse al lado izquierdo del carril y reducir la velocidad.
    C: Moverse al lado derecho del carril y mantener una velocidad constante.
    D: Parpadear sus luces delanteras y tocar sus frenos.
  answer: C
  explanation: Cuando lo estén rebasando, debe mantenerse a la derecha, moverse al
    lado derecho del carril y mantener una velocidad constante para permitir que el
    conductor lo rebase.
- id: 254
  category: safe_driving_rules
  question: Como regla general, ¿por qué solo debe rebasar un vehículo a la vez?
  choices:
    A: Es ilegal rebasar más de un vehículo a la vez.
    B: Rebasar varios vehículos requiere demasiado combustible.
    C: Es difícil determinar la cantidad de tiempo necesario, que puede ser de 20
      a 30 segundos.
    D: El motor de su vehículo puede sobrecalentarse.
  answer: C
  explanation: El manual aconseja rebasar solo un vehículo a la vez, ya que es difícil
    determinar la cantidad de tiempo necesario para rebasar, que puede ser de hasta
    20 a 30 segundos.
- id: 255
  category: defensive_driving
  question: ¿Cómo le parece generalmente a un conductor un vehículo que viene en sentido
    contrario y que está a más de 25 segundos de distancia?
  choices:
    A: Parece moverse extremadamente rápido.
    B: Parece estar detenido.
    C: Parece estar zigzagueando.
    D: Parece más grande de lo que realmente es.
  answer: B
  explanation: Según el manual, un vehículo que viene en sentido contrario y que está
    a más de 25 segundos de su vehículo generalmente parece estar detenido.
- id: 256
  category: safe_driving_rules
  question: Al conducir a 55 o 60 mph, ¿qué tan lejos debe poder ver hacia adelante
    para rebasar de manera segura en una colina o curva?
  choices:
    A: Al menos 1/4 de milla.
    B: Al menos 1/3 de milla.
    C: Al menos 1/2 milla.
    D: Al menos 1 milla.
  answer: B
  explanation: Debe poder ver al menos 1/3 de milla o unos 20 a 25 segundos hacia
    adelante cuando conduzca a 55 o 60 mph para rebasar de manera segura cerca de
    colinas y curvas.
- id: 257
  category: defensive_driving
  question: ¿Cuál es la mejor manera de manejar el rebasar a un peatón mientras se
    aproxima un vehículo en sentido contrario?
  choices:
    A: Aumentar la velocidad para pasar al peatón antes de que llegue el vehículo.
    B: Tocar la bocina para advertir tanto al peatón como al vehículo.
    C: Moverse al carril contrario y obligar al otro vehículo a reducir la velocidad.
    D: Reducir la velocidad y dejar que el vehículo que viene en sentido contrario
      pase primero para enfrentar los peligros uno a la vez.
  answer: D
  explanation: Para minimizar los peligros, tómelos uno a la vez. Reduzca la velocidad
    y deje que el vehículo que viene en sentido contrario pase primero para que su
    vehículo pueda rebasar solo a un usuario de la vía a la vez.
- id: 258
  category: safe_driving_rules
  question: En Kansas, ¿cuándo le exige la ley encender sus luces delanteras durante
    el mal tiempo?
  choices:
    A: Siempre que conduzca a más de 60 mph.
    B: Siempre que se utilicen los limpiaparabrisas.
    C: Solo cuando conduzca en autopistas interestatales.
    D: Solo entre la puesta del sol y la salida del sol.
  answer: B
  explanation: Muchos estados, incluido Kansas, requieren que encienda las luces delanteras
    siempre que se utilicen los limpiaparabrisas en el vehículo.
- id: 259
  category: defensive_driving
  question: ¿Por qué debe encender las luces delanteras cuando se aleja de un sol
    naciente o poniente?
  choices:
    A: Para ayudar a los conductores que vienen hacia usted a ver su vehículo.
    B: Para reducir el resplandor en su propio parabrisas.
    C: Para conservar la energía de la batería de su vehículo.
    D: Porque los rayos del sol pueden dañar sus luces delanteras.
  answer: A
  explanation: Al alejarse de un sol naciente o poniente, los conductores que vienen
    hacia usted pueden tener dificultades para ver su vehículo. Sus luces delanteras
    les ayudarán a ver su vehículo.
- id: 260
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones debería dar un ligero toque a su
    bocina?
  choices:
    A: Al saludar a un amigo en la acera.
    B: Al animar a un conductor lento a acelerar.
    C: Cuando la visibilidad hacia adelante es limitada, como al salir de un callejón
      estrecho.
    D: Al conducir cerca de un peatón ciego.
  answer: C
  explanation: Un ligero toque a la bocina es apropiado cuando la visibilidad hacia
    adelante es limitada, como en una colina empinada, una curva cerrada o al salir
    de un callejón estrecho.
- id: 261
  category: defensive_driving
  question: ¿Cuándo es apropiado usar un TOQUE FUERTE de la bocina de su vehículo?
  choices:
    A: Al decirle a otro conductor que cometió un error.
    B: Cuando un peatón está a punto de correr hacia la calle.
    C: Cuando está atrapado en tráfico pesado.
    D: Cuando quiere que un vehículo se quite de su camino.
  answer: B
  explanation: Si hay peligro, debe usar un toque fuerte de la bocina, como cuando
    un peatón o ciclista está a punto de caminar, correr o circular hacia la calle.
- id: 262
  category: sharing_the_road
  question: ¿Cuándo NO debe usar la bocina bajo ninguna circunstancia?
  choices:
    A: Cuando un ciclista parece estar moviéndose hacia su carril.
    B: Al rebasar a un conductor que comienza a girar hacia su carril.
    C: Cuando esté cerca de peatones ciegos.
    D: Cuando otro vehículo está en peligro de chocar con usted.
  answer: C
  explanation: El manual enumera varias ocasiones en las que no debe usar la bocina,
    incluyendo cuando esté cerca de peatones ciegos.
- id: 263
  category: safe_driving_rules
  question: Si su vehículo se avería y debe detenerse, ¿dónde debería intentar detener
    su vehículo?
  choices:
    A: Justo después de una colina para protegerlo del viento.
    B: Justo en una curva para que esté fuera del flujo principal de tráfico.
    C: En el carril central con las luces de emergencia encendidas.
    D: Fuera de la carretera y donde otros usuarios de la vía tengan una vista clara
      del mismo.
  answer: D
  explanation: Si debe detenerse, saque su vehículo de la carretera y deténgase donde
    otros usuarios de la vía tengan una vista clara de su vehículo. No se detenga
    justo después de una colina o en una curva.
- id: 264
  category: safe_driving_rules
  question: No debe rebasar a otro vehículo si hay un cruce ferroviario a nivel más
    adelante dentro de ¿qué intervalo de tiempo?
  choices:
    A: 5 a 10 segundos.
    B: 10 a 15 segundos.
    C: 20 a 25 segundos.
    D: 30 a 40 segundos.
  answer: C
  explanation: El manual establece que no debe rebasar si hay un cruce ferroviario
    a nivel dentro del área de 20 a 25 segundos por delante.
- id: 265
  category: safe_driving_rules
  question: ¿Cuál es una forma apropiada de señalar una emergencia si su vehículo
    se avería?
  choices:
    A: Atar un paño rojo al volante.
    B: Atar un paño blanco a la antena, al espejo lateral o a la manija de la puerta.
    C: Pararse en medio de la carretera y agitar los brazos.
    D: Tocar la bocina continuamente hasta que llegue ayuda.
  answer: B
  explanation: Según el manual, un paño blanco sujeto a un vehículo indica un vehículo
    averiado. Debe atar un paño blanco a la antena, al espejo lateral o a la manija
    de la puerta, o levantar el capó para señalar una emergencia.
- id: 266
  category: safe_driving_rules
  question: ¿Dónde debe colocar las bengalas de emergencia para advertir a otros conductores
    que su vehículo está averiado?
  choices:
    A: De 50 a 100 pies detrás del vehículo.
    B: De 100 a 150 pies detrás del vehículo.
    C: De 200 a 300 pies detrás del vehículo.
    D: De 300 a 500 pies delante del vehículo.
  answer: C
  explanation: El manual indica colocar bengalas de emergencia a unos 200 a 300 pies
    detrás del vehículo, dando a otros conductores tiempo para cambiar de carril si
    es necesario.
- id: 267
  category: safe_driving_rules
  question: En áreas urbanas, ¿cuándo debe hacer la señal antes de realizar un giro
    o un cambio de carril?
  choices:
    A: 50 pies o 1 a 2 segundos antes.
    B: 100 pies o 3 a 5 segundos antes.
    C: 200 pies o 3 a 5 segundos antes.
    D: 500 pies o 5 a 7 segundos antes.
  answer: B
  explanation: En áreas urbanas, debe hacer la señal 100 pies o de 3 a 5 segundos
    antes de realizar un giro o un cambio de carril.
- id: 268
  category: safe_driving_rules
  question: A velocidades superiores a 40 mph, ¿cuál es la distancia adecuada para
    hacer la señal antes de realizar un giro o un cambio de carril?
  choices:
    A: 50 pies.
    B: 100 pies.
    C: 150 pies.
    D: 200 pies.
  answer: D
  explanation: A velocidades superiores a 40 mph, debe hacer la señal 200 pies o de
    3 a 5 segundos antes de realizar un giro o un cambio de carril.
- id: 269
  category: defensive_driving
  question: Si planea girar en una intersección pero hay una calle lateral justo antes
    de ella, ¿cuándo debe hacer la señal?
  choices:
    A: Tan pronto como vea la intersección.
    B: Antes de llegar a la calle lateral.
    C: Espere hasta haber pasado la calle lateral antes de hacer la señal.
    D: No necesita hacer la señal si hay una calle lateral.
  answer: C
  explanation: Si va a girar en una intersección, debe esperar hasta haber pasado
    la calle lateral antes de señalar sus intenciones, para que otros conductores
    no se incorporen a su trayectoria asumiendo que va a girar en la calle lateral.
- id: 270
  category: safe_driving_rules
  question: ¿Cómo puede advertir a otros usuarios de la vía que se está deteniendo
    o reduciendo la velocidad en un lugar donde no lo esperan?
  choices:
    A: Encender las luces altas.
    B: Tocar el pedal del freno tres o cuatro veces ligeramente.
    C: Tocar la bocina durante tres segundos.
    D: Usar señales manuales por la ventana.
  answer: B
  explanation: Al detenerse o reducir la velocidad en un lugar donde otro conductor
    no lo espera, toque el pedal del freno tres o cuatro veces ligeramente para advertir
    a otros usuarios de la vía.
- id: 271
  category: license_system
  question: 'Según el manual, tener una licencia de conducir se considera un:'
  choices:
    A: Derecho constitucional
    B: Privilegio, no un derecho
    C: Requisito para todos los ciudadanos
    D: Derecho federal
  answer: B
  explanation: El manual establece explícitamente que tener una licencia de conducir
    es un privilegio, no un derecho.
- id: 272
  category: driver_responsibility
  question: Si usted es menor de edad y tiene una licencia de conducir, ¿quién es
    responsable de las consecuencias financieras de su conducción?
  choices:
    A: Solo el conductor menor de edad
    B: El gobierno estatal
    C: Exclusivamente la compañía de seguros
    D: Usted y su(s) padre(s) o tutor(es) legal(es)
  answer: D
  explanation: Si usted es menor de edad, usted y su(s) padre(s) o tutor(es) legal(es)
    serán responsables de las consecuencias financieras de su conducción.
- id: 273
  category: vehicle_information
  question: ¿Cuál es una limitación asociada con la conducción de un vehículo de gran
    tamaño?
  choices:
    A: Son más difíciles de ver para otros conductores.
    B: Pueden ser menos estables y tener una visibilidad reducida alrededor del vehículo.
    C: Aceleran mucho más rápido que los vehículos más pequeños.
    D: Tienen un radio de giro más cerrado.
  answer: B
  explanation: El manual señala que los vehículos más grandes pueden ser menos estables
    y tener una visibilidad reducida alrededor del vehículo.
- id: 274
  category: defensive_driving
  question: 'La buena toma de decisiones al conducir comienza con:'
  choices:
    A: Un tiempo de reacción rápido
    B: Una buena búsqueda visual
    C: Conocer el límite de velocidad
    D: Tener un vehículo más nuevo
  answer: B
  explanation: Para prepararse para el proceso de toma de decisiones, es muy importante
    realizar una búsqueda activa en el área alrededor de su vehículo. La buena toma
    de decisiones comienza con una buena búsqueda visual.
- id: 275
  category: defensive_driving
  question: 'Al decidir un curso de acción para disminuir un riesgo al conducir, sus
    acciones generalmente se limitan a cambiar de dirección, comunicarse o:'
  choices:
    A: Cambiar su velocidad
    B: Cambiar su destino
    C: Salir del vehículo
    D: Apagar sus faros delanteros
  answer: A
  explanation: Generalmente, usted se limita a cambiar su dirección (moverse a la
    izquierda o a la derecha), cambiar su velocidad (reducir la velocidad, detenerse
    o acelerar) o comunicarse (señalizar o tocar la bocina).
- id: 276
  category: sharing_the_road
  question: 'Al rebasar a un peatón que camina por la calzada y se aproxima un vehículo
    en sentido contrario, usted debe:'
  choices:
    A: Tocar la bocina para que el peatón se mueva.
    B: Acelerar para rebasar al peatón rápidamente.
    C: Reducir la velocidad y dejar que el vehículo que viene en sentido contrario
      pase primero.
    D: Seguir conduciendo, ya que el vehículo que viene en sentido contrario debe
      detenerse por usted.
  answer: C
  explanation: La sección 'Ponga a prueba sus conocimientos' establece que al rebasar
    a un peatón con un vehículo que se aproxima en sentido contrario, debe reducir
    la velocidad y dejar que el vehículo pase primero.
- id: 277
  category: safe_driving_rules
  question: ¿Qué debe hacer si su luz direccional no se cancela correctamente después
    de realizar un giro o un cambio de carril?
  choices:
    A: Dejarla encendida hasta el próximo giro.
    B: Presionar los frenos tres veces para restablecerla.
    C: Cancelar la señal manualmente para que otros usuarios de la vía no se confundan.
    D: Encender las luces de emergencia.
  answer: C
  explanation: Los conductores deben cancelar la señal si no se ha cancelado por sí
    sola, para que otros usuarios de la vía no se confundan con una señal incorrecta.
- id: 278
  category: safe_driving_rules
  question: Al intentar evitar una colisión, ¿cuáles son sus tres opciones principales?
  choices:
    A: Frenar, maniobrar o acelerar
    B: Tocar la bocina, frenar o dar un volantazo
    C: Acelerar, tocar la bocina o maniobrar
    D: Frenar, prepararse para el impacto o cerrar los ojos
  answer: A
  explanation: 'En el intento de evitar una colisión, tiene tres opciones: frenar,
    maniobrar (girar el volante) o acelerar.'
- id: 279
  category: vehicle_information
  question: 'Si su vehículo tiene un sistema de frenos antibloqueo (ABS) y necesita
    detenerse rápidamente, usted debe:'
  choices:
    A: Bombear los frenos rápidamente para evitar derrapar
    B: Presionar el pedal del freno con toda su fuerza y mantenerlo presionado
    C: Aplicar los frenos suavemente y alejarse del peligro
    D: Presionar el pedal del freno hasta que se bloquee y luego soltarlo
  answer: B
  explanation: Con el ABS, si necesita detenerse rápidamente, presione el pedal del
    freno con toda su fuerza y manténgalo presionado. No suelte el pedal del freno.
- id: 280
  category: safe_driving_rules
  question: Si debe detenerse rápidamente y su vehículo NO tiene un sistema de frenos
    antibloqueo (ABS), ¿qué debe hacer si los frenos se bloquean y el vehículo comienza
    a derrapar?
  choices:
    A: Seguir presionando el pedal del freno con la mayor fuerza posible
    B: Poner el vehículo en punto muerto (neutral) y tirar del freno de mano
    C: Dejar de presionar un poco el pedal del freno y luego volver a aplicarlo con
      control
    D: Girar el volante bruscamente en la dirección opuesta al derrape
  answer: C
  explanation: Sin ABS, si los frenos se bloquean, sentirá que el vehículo comienza
    a derrapar. Deje de presionar un poco el pedal del freno y luego vuelva a aplicarlo
    con control.
- id: 281
  category: defensive_driving
  question: ¿Cuál de las siguientes afirmaciones es verdadera sobre girar rápidamente
    para evitar una colisión?
  choices:
    A: Generalmente puede detener el vehículo más rápido de lo que puede girarlo
    B: Debe girar en la dirección opuesta a la que desea que vaya el vehículo
    C: En la mayoría de los casos, puede girar el vehículo más rápido de lo que puede
      detenerlo
    D: Debe quitar una mano del volante para sostenerse
  answer: C
  explanation: En la mayoría de los casos, puede girar el vehículo más rápido de lo
    que puede detenerlo. Debe considerar girar para evitar una colisión.
- id: 282
  category: defensive_driving
  question: ¿En qué situación podría ser mejor acelerar para evitar una colisión?
  choices:
    A: Cuando se aproxima a una curva cerrada demasiado rápido
    B: Cuando otro vehículo está a punto de golpearlo por el costado o por detrás
      y hay espacio frente a usted
    C: Cuando un peatón entra repentinamente en el cruce de peatones delante de usted
    D: Cuando experimenta el reventón de un neumático delantero
  answer: B
  explanation: A veces es mejor o necesario acelerar para evitar una colisión. Esto
    puede suceder cuando otro vehículo está a punto de golpearlo por el costado o
    por detrás y hay espacio al frente de su vehículo para salir del peligro.
- id: 283
  category: safe_driving_rules
  question: Si su vehículo comienza a perder tracción y entra en un derrape, ¿hacia
    dónde debe mirar?
  choices:
    A: Fijar la vista directamente en el peligro que intenta evitar
    B: Mirar hacia el carril contrario
    C: Mirar sus pedales para asegurarse de que sus pies estén colocados correctamente
    D: Buscar visualmente un espacio abierto en la dirección a la que desea ir
  answer: D
  explanation: Si su vehículo comienza a perder tracción, busque visualmente un espacio
    abierto. Debe prestar atención a dónde puede ir su vehículo en la calzada y no
    fijarse en el peligro que intenta evitar.
- id: 284
  category: vehicle_information
  question: ¿Cómo puede saber si se pierde la tracción en los neumáticos delanteros
    durante un derrape?
  choices:
    A: El vehículo se mueve lateralmente sin ninguna acción adicional de giro
    B: El vehículo continúa recto mientras usted está girando el volante
    C: El volante comienza a vibrar violentamente
    D: La parte trasera del vehículo colea (fishtails)
  answer: B
  explanation: 'Para reconocer la pérdida de tracción: si el vehículo continúa recto
    mientras gira el volante, se ha perdido la tracción en los neumáticos delanteros.'
- id: 285
  category: defensive_driving
  question: Si los neumáticos traseros de su vehículo pierden tracción, ¿cómo debe
    girar el volante?
  choices:
    A: Gire el volante en la dirección opuesta a su trayectoria prevista
    B: Mantenga el volante perfectamente recto y aplique los frenos con fuerza
    C: Gire el volante en la dirección de la trayectoria prevista
    D: Gire hacia el carril contrario para recuperar el equilibrio
  answer: C
  explanation: Si se pierde la tracción trasera, gire el volante en la dirección de
    la trayectoria prevista (la dirección a la que desea ir) y continúe girando y
    contragirando hasta que el vehículo avance recto.
- id: 286
  category: defensive_driving
  question: ¿Qué debe hacer para protegerse si su vehículo está a punto de ser golpeado
    por detrás?
  choices:
    A: Inclinarse hacia adelante sobre el volante
    B: Presionarse contra el respaldo de su asiento y apoyar la cabeza contra el reposacabezas
    C: Quitar el pie del pedal del freno para que su vehículo pueda rodar hacia adelante
    D: Desabrocharse el cinturón de seguridad para poder salir del vehículo rápidamente
  answer: B
  explanation: Si su vehículo es golpeado por detrás, su cabeza y cuerpo serán lanzados
    hacia atrás. Presiónese contra el respaldo de su asiento y apoye la cabeza contra
    el reposacabezas, y prepárese para aplicar los frenos.
- id: 287
  category: defensive_driving
  question: Si su vehículo está a punto de ser golpeado por delante, ¿cuál es una
    acción recomendada para disminuir el impacto?
  choices:
    A: Intentar girar el vehículo para recibir un golpe de refilón en lugar de ser
      golpeado de frente
    B: Acelerar para atravesar el impacto
    C: Apagar el motor antes de que ocurra la colisión
    D: Lanzar sus brazos frente a su cara y soltar el volante
  answer: A
  explanation: Si su vehículo está a punto de ser golpeado por delante, es importante
    intentar recibir un golpe de refilón en lugar de ser golpeado de frente. Esto
    significa que si va a ocurrir una colisión, debe intentar girar el vehículo.
- id: 288
  category: vehicle_information
  question: ¿Qué es lo primero que debe intentar si sus frenos dejan de funcionar
    mientras conduce?
  choices:
    A: Cambiar a reversa
    B: Tirar del freno de mano tan fuerte y rápido como pueda
    C: Bombear rápidamente el pedal del freno varias veces
    D: Apagar el encendido inmediatamente
  answer: C
  explanation: Si sus frenos dejan de funcionar, bombee rápidamente el pedal del freno
    varias veces. Esto a menudo generará suficiente presión de frenado para permitirle
    detenerse.
- id: 289
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es la respuesta correcta ante el reventón de un
    neumático?
  choices:
    A: Pisar los frenos a fondo inmediatamente para detener el vehículo
    B: Sujetar el volante con firmeza, mantener el vehículo recto y reducir la velocidad
      gradualmente
    C: Acelerar ligeramente para mantener el control del impulso del vehículo
    D: Girar el volante bruscamente en la dirección del reventón
  answer: B
  explanation: Si un neumático se revienta, sujete el volante con firmeza y mantenga
    el vehículo recto. Reduzca la velocidad gradualmente quitando el pie del pedal
    del acelerador y no frene.
- id: 290
  category: vehicle_information
  question: Si el motor se apaga mientras conduce, ¿qué debe hacer?
  choices:
    A: Cambiar a neutral, frenar con presión constante y salir de la calzada
    B: Cambiar a estacionamiento (Park) inmediatamente para detener el vehículo
    C: Soltar el volante, ya que estará bloqueado y será imposible de girar
    D: Bombear los frenos rápidamente y tocar la bocina
  answer: A
  explanation: Si el motor se apaga mientras conduce, mantenga el volante con firmeza,
    cambie a neutral y busque una vía de escape, frene con presión constante, reduzca
    la velocidad y luego salga de la calzada.
- id: 291
  category: vehicle_information
  question: ¿Qué debe hacer si el pedal del acelerador se queda atascado en la posición
    presionada?
  choices:
    A: Agacharse e intentar tirar del pedal hacia arriba con las manos mientras conduce
    B: Cambiar a neutral (punto muerto), maniobrar suavemente, frenar con cuidado
      y salir de la calzada
    C: Apagar el motor inmediatamente mientras aún se encuentra en el carril de tráfico
    D: Cambiar a una marcha más baja y aplicar el freno de mano con fuerza
  answer: B
  explanation: En caso de falla del acelerador, cambie a neutral y busque una vía
    de escape, maniobre suavemente, frene con cuidado y salga de la calzada.
- id: 292
  category: defensive_driving
  question: Si sus ruedas se salen del pavimento y caen en una superficie irregular,
    ¿por qué debe evitar frenar bruscamente?
  choices:
    A: Dañará las pastillas de freno
    B: Puede provocar que su vehículo derrape y dificultar las maniobras
    C: Hará que sus neumáticos estallen
    D: Detendrá el motor
  answer: B
  explanation: Cuando sus ruedas se salgan del pavimento, no frene bruscamente, ya
    que esto puede provocar que su vehículo derrape y dificultar las maniobras. En
    su lugar, aplique los frenos suavemente.
- id: 293
  category: safe_driving_rules
  question: ¿A qué velocidad recomendada debe reducir antes de intentar regresar al
    pavimento después de una caída fuera de la vía?
  choices:
    A: 10 mph o menos
    B: 15 mph o menos
    C: 25 mph o menos
    D: 35 mph o menos
  answer: C
  explanation: Si sus ruedas se salen del pavimento, debe conducir recto hacia adelante
    y reducir la velocidad a 25 mph o menos antes de intentar regresar a la calzada.
- id: 294
  category: vehicle_operation
  question: ¿Cuánto debe girar el volante para regresar al pavimento después de una
    caída en una superficie irregular?
  choices:
    A: Aproximadamente un cuarto de vuelta
    B: Aproximadamente media vuelta
    C: Una vuelta completa de 360 grados
    D: Tan bruscamente como sea posible
  answer: A
  explanation: Cuando haya un espacio en el tráfico desde todas las direcciones, gire
    el volante aproximadamente un cuarto de vuelta para regresar al pavimento. NO
    GIRE EN EXCESO.
- id: 295
  category: defensive_driving
  question: ¿Qué tipo de choque tiene muchas más probabilidades de resultar en lesiones
    graves o la muerte en comparación con otros tipos de choques?
  choices:
    A: Colisiones traseras
    B: Raspones laterales
    C: Vuelcos
    D: Choques leves a baja velocidad
  answer: C
  explanation: Los vuelcos tienen muchas más probabilidades que la mayoría de los
    otros tipos de choques de resultar en lesiones graves o la muerte, representando
    una de cada tres muertes de ocupantes de vehículos de pasajeros.
- id: 296
  category: safe_driving_rules
  question: ¿Qué porcentaje de todos los choques por vuelco no involucran a ningún
    otro vehículo además del que se vuelca?
  choices:
    A: Menos del 20%
    B: Aproximadamente el 40%
    C: Exactamente el 50%
    D: Más del 80%
  answer: D
  explanation: Los choques de un solo vehículo son más comunes en los vuelcos. Más
    del 80% de todos los vuelcos no involucran a ningún otro vehículo además del que
    se vuelca.
- id: 297
  category: vehicle_information
  question: ¿Por qué los vehículos utilitarios deportivos (SUV), las furgonetas y
    las camionetas tienen más probabilidades de sufrir un choque por vuelco que los
    automóviles de pasajeros?
  choices:
    A: Tienen neumáticos más pequeños
    B: Tienen centros de gravedad más altos
    C: Se conducen a velocidades más altas
    D: Carecen de sistemas de frenos antibloqueo
  answer: B
  explanation: Los choques por vuelco son más comunes en los SUV, furgonetas, camionetas
    y camiones pequeños debido a sus centros de gravedad más altos, lo que los hace
    pesados en la parte superior y más propensos a volcarse.
- id: 298
  category: driver_responsibility
  question: ¿Cuál es la forma más eficaz de reducir el riesgo de lesiones o muerte
    en un choque por vuelco?
  choices:
    A: Sujetar el volante con fuerza
    B: Usar su cinturón de seguridad
    C: Agacharse debajo del tablero
    D: Desbloquear las puertas
  answer: B
  explanation: La forma más eficaz de reducir el riesgo de lesiones o muerte en un
    vuelco es usar el cinturón de seguridad. Sin cinturones de seguridad, los ocupantes
    pueden salir despedidos del vehículo.
- id: 299
  category: vehicle_information
  question: Al conducir de noche, ¿a qué distancia aproximada le permitirán ver con
    claridad sus luces bajas?
  choices:
    A: De 50 a 100 pies
    B: De 150 a 200 pies
    C: De 250 a 300 pies
    D: De 350 a 400 pies
  answer: B
  explanation: Sus luces bajas le permitirán ver con claridad a una distancia de 150
    a 200 pies aproximadamente.
- id: 300
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima de conducción segura al usar las luces altas
    por la noche, las cuales le permiten ver de 350 a 400 pies adelante?
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 75 mph
  answer: C
  explanation: Sus luces altas le permitirán ver con claridad a una distancia de 350
    a 400 pies aproximadamente. Conducir a una velocidad que le permita detenerse
    dentro de esta distancia es de aproximadamente 65 mph.
- id: 301
  category: defensive_driving
  question: ¿Cuánto debe aumentar su distancia de seguimiento al conducir por carreteras
    desconocidas por la noche?
  choices:
    A: Al menos un segundo adicional
    B: Al menos dos segundos adicionales
    C: Al menos tres segundos adicionales
    D: Al menos cuatro segundos adicionales
  answer: B
  explanation: Debe aumentar su distancia de seguimiento añadiendo al menos un segundo
    adicional por las condiciones de conducción nocturna y al menos dos segundos adicionales
    por conducir en carreteras desconocidas por la noche.
- id: 302
  category: safe_driving_rules
  question: 'Si no puede ver a más de 100 pies de distancia debido a la niebla espesa
    o lluvia intensa, no puede conducir de manera segura a más de:'
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: Cuando no pueda ver a más de 100 pies de distancia debido a la lluvia,
    nieve, polvo en suspensión, humo o niebla espesa, no puede conducir de manera
    segura a más de 30 mph.
- id: 303
  category: vehicle_operation
  question: ¿Qué luces debe utilizar para obtener la mejor visibilidad al conducir
    con niebla, nieve o lluvia intensa durante el día?
  choices:
    A: Luces altas (high beams)
    B: Solo las luces de estacionamiento
    C: Luces de cruce (low beams) y luces antiniebla
    D: Luces de emergencia intermitentes
  answer: C
  explanation: Al conducir con niebla, nieve o lluvia intensa, use las luces de cruce
    (low beams) y las luces antiniebla para obtener la mejor visibilidad, incluso
    durante el día.
- id: 304
  category: sharing_the_road
  question: Si el sol está directamente detrás de usted mientras conduce, ¿de qué
    peligro debe estar consciente?
  choices:
    A: Su motor podría sobrecalentarse
    B: Los conductores que vienen en sentido contrario podrían no ver sus señales
      de giro o su vehículo debido al resplandor
    C: Sus faros se apagarán automáticamente
    D: La distancia de frenado de su vehículo aumentará
  answer: B
  explanation: Si el sol está detrás de usted, tenga en cuenta que los conductores
    que vienen en sentido contrario podrían no ver sus señales de giro o su vehículo
    debido al resplandor del sol.
- id: 305
  category: safe_driving_rules
  question: ¿Cuál es el intervalo mínimo de seguimiento que debe utilizar en condiciones
    normales de conducción?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: B
  explanation: Utilice el intervalo mínimo de seguimiento de 3 segundos, aumentando
    dicho intervalo en un segundo adicional por cualquier condición inusual del clima
    o del tráfico.
- id: 306
  category: safe_driving_rules
  question: Si está conduciendo y un neumático se desinfla repentinamente, ¿qué debe
    hacer?
  choices:
    A: Bombear rápidamente el pedal del freno varias veces.
    B: Reducir la velocidad gradualmente y no frenar.
    C: Presionar el pedal del freno con tanta fuerza como pueda.
    D: Girar bruscamente hacia el lado derecho de la carretera.
  answer: B
  explanation: Si un neumático se desinfla repentinamente, debe reducir la velocidad
    gradualmente y no aplicar los frenos.
- id: 307
  category: sharing_the_road
  question: Como peatón, si no hay una acera disponible, ¿por dónde debe caminar?
  choices:
    A: En el lado derecho de la calle con el flujo del tráfico.
    B: En el centro de la carretera.
    C: En el lado izquierdo de la calle, de frente al tráfico que viene en sentido
      contrario.
    D: En el arcén (hombro) de la carretera en cualquier dirección.
  answer: C
  explanation: Si no hay acera, debe caminar por el lado izquierdo de la calle, de
    frente al tráfico que viene en sentido contrario.
- id: 308
  category: signs_and_signals
  question: ¿Qué debe hacer un peatón si aparece la señal intermitente de "DON'T WALK"
    (NO CRUCE) mientras ya está cruzando la calle?
  choices:
    A: Detenerse en medio del paso de peatones y esperar a la siguiente señal.
    B: Dar la vuelta y regresar a la acera de inicio.
    C: Correr lo más rápido posible hacia el otro lado.
    D: Terminar de cruzar la calle.
  answer: D
  explanation: Si la señal intermitente de "DON'T WALK" aparece cuando usted está
    cruzando la calle, puede terminar de cruzarla.
- id: 309
  category: sharing_the_road
  question: ¿Cuál es la responsabilidad de un conductor cuando un peatón cruza la
    calle fuera de un paso de peatones (cruce imprudente o jaywalking)?
  choices:
    A: Tocar la bocina y continuar sin detenerse.
    B: Ceder el paso y detenerse ante el peatón.
    C: Virar bruscamente para esquivar al peatón.
    D: Mantener la velocidad, ya que el peatón no tiene el derecho de paso.
  answer: B
  explanation: Siempre debe ceder el paso a los peatones. Incluso si no están en un
    paso de peatones y están cruzando la calle por donde no deben (jaywalking), usted
    debe detenerse por ellos.
- id: 310
  category: sharing_the_road
  question: Cuando un peatón cruza una calle guiado por un perro o con un bastón blanco,
    ¿qué debe hacer el conductor?
  choices:
    A: Reducir la velocidad y proceder con precaución.
    B: Tocar la bocina para que el peatón sepa que se acerca un vehículo.
    C: Detenerse por completo.
    D: Ceder el paso solo si el peatón está en un paso de peatones marcado.
  answer: C
  explanation: Siempre debe ceder el derecho de paso a las personas con discapacidad
    visual. Cuando un peatón cruza una calle guiado por un perro o con un bastón blanco,
    usted debe detenerse por completo.
- id: 311
  category: sharing_the_road
  question: ¿Al acercarse a un vehículo detenido por detrás en una carretera de varios
    carriles, qué debe hacer?
  choices:
    A: Rebasar el vehículo rápidamente por la izquierda.
    B: Rebasar el vehículo rápidamente por la derecha.
    C: Tocar la bocina y rebasar el vehículo.
    D: Reducir la velocidad y no rebasar hasta estar seguro de que no hay peatones
      cruzando delante de él.
  answer: D
  explanation: Al acercarse a un vehículo detenido por detrás, reduzca la velocidad
    y no lo rebase hasta estar seguro de que no hay peatones cruzando delante de él.
    Esto es válido incluso en carreteras de varios carriles.
- id: 312
  category: sharing_the_road
  question: ¿Cómo se clasifican los ciclistas cuando circulan por las vías públicas?
  choices:
    A: Como peatones.
    B: Como vehículos que deben seguir las mismas reglas de tránsito que los vehículos
      motorizados.
    C: Como equipo recreativo sin reglas de tránsito específicas.
    D: Como peligros de movimiento lento que deben ceder el paso a todos los autos.
  answer: B
  explanation: Los ciclistas se consideran vehículos cuando circulan por las vías
    públicas. Se espera que sigan las mismas reglas de tránsito que los vehículos
    motorizados.
- id: 313
  category: sharing_the_road
  question: ¿En qué lado de la calzada se requiere generalmente que circulen los ciclistas?
  choices:
    A: El lado izquierdo.
    B: El lado derecho.
    C: El carril central.
    D: Cualquier lado que prefieran.
  answer: B
  explanation: Como ciclista, se requiere que circule por el lado derecho de la calzada.
- id: 314
  category: sharing_the_road
  question: ¿Se permite a los ciclistas circular uno al lado del otro en un solo carril?
  choices:
    A: No, siempre deben circular en fila india.
    B: Sí, se les permite circular de a dos o en paralelo en un carril.
    C: Sí, pero solo los fines de semana.
    D: No, a menos que estén en un carril para bicicletas designado.
  answer: B
  explanation: A los ciclistas se les permite circular de a dos o en paralelo en un
    carril. Hacer esto crea una densidad vehicular compacta para que los autos puedan
    rebasar de manera más eficiente.
- id: 315
  category: sharing_the_road
  question: Según la Ley del Semáforo en Rojo (Dead Red Law), ¿qué puede hacer un
    ciclista si una señal de tráfico no responde a su bicicleta?
  choices:
    A: Subir a la acera y cruzar por el paso de peatones.
    B: Esperar hasta que llegue un auto para activar la señal.
    C: Cruzar la intersección después de esperar un tiempo razonable, sin impedir
      el tráfico transversal.
    D: Girar a la derecha y hacer un giro en U para evitar el semáforo.
  answer: C
  explanation: Según la Ley del Semáforo en Rojo (Dead Red Law), si llega a una intersección
    y la señal de tráfico no responde a su bicicleta, después de esperar lo que determine
    como un tiempo razonable, puede cruzar la intersección.
- id: 316
  category: sharing_the_road
  question: ¿Qué equipo de iluminación se requiere para un ciclista que circula al
    anochecer?
  choices:
    A: Solo una luz trasera.
    B: Se requiere un faro delantero, y se recomienda encarecidamente una luz trasera.
    C: Se requieren tanto un faro delantero como una luz trasera intermitente.
    D: No se requiere iluminación si se usa ropa reflectante.
  answer: B
  explanation: El uso de un faro delantero al anochecer es obligatorio, pero se recomienda
    encarecidamente una luz trasera para brindarle mayor visibilidad.
- id: 317
  category: sharing_the_road
  question: Si está conduciendo y está a punto de girar a la derecha, y hay un ciclista
    delante de usted, ¿qué debe hacer?
  choices:
    A: Acelerar y rebasar al ciclista inmediatamente antes del giro.
    B: Tocar la bocina para que el ciclista le ceda el paso.
    C: Reducir la velocidad y dejar que el ciclista despeje la intersección antes
      de realizar el giro.
    D: Pasar rozando al ciclista en el mismo carril mientras gira.
  answer: C
  explanation: Si está a punto de girar a la derecha, no debe rebasar a un ciclista
    inmediatamente antes del giro. Para evitar una colisión, debe reducir la velocidad
    y dejar que el ciclista despeje la intersección antes de realizar su giro.
- id: 318
  category: sharing_the_road
  question: ¿Por qué debe evitar tocar la bocina cerca de los ciclistas a menos que
    haya posibilidad de una colisión?
  choices:
    A: Es ilegal tocar la bocina a los ciclistas.
    B: Puede asustarlos y hacer que se desvíen hacia su camino y choquen.
    C: Los ciclistas no pueden oír las bocinas debido al viento.
    D: Hará que el ciclista se detenga repentinamente.
  answer: B
  explanation: No toque la bocina cerca de los ciclistas a menos que haya posibilidad
    de una colisión. Tocar la bocina para alertar de su presencia puede asustarlos
    y hacer que se desvíen hacia su camino y choquen.
- id: 319
  category: sharing_the_road
  question: ¿Cómo afectan las calzadas mojadas, arenosas o cubiertas de grava a los
    ciclistas en comparación con los vehículos motorizados?
  choices:
    A: Estas condiciones afectan a las bicicletas mucho más que a los vehículos, reduciendo
      su capacidad para frenar o girar bruscamente.
    B: Las bicicletas manejan estas condiciones mejor que los vehículos motorizados.
    C: Estas condiciones afectan a las bicicletas y a los vehículos motorizados por
      igual.
    D: Las bicicletas no se ven afectadas por la arena o la grava.
  answer: A
  explanation: Al igual que los vehículos motorizados, las bicicletas no pueden frenar
    tan rápido ni girar tan bruscamente en estas condiciones. Estas condiciones afectan
    a las bicicletas mucho más que a los vehículos.
- id: 320
  category: sharing_the_road
  question: ¿Para qué se utiliza el método 'Dutch Reach' (alcance holandés)?
  choices:
    A: Señalizar un giro a la izquierda en una bicicleta
    B: Salir de un vehículo de forma segura utilizando la mano derecha para abrir
      la puerta
    C: Rebasar a un ciclista de forma segura en una carretera estrecha
    D: Revisar los puntos ciegos al dar marcha atrás
  answer: B
  explanation: El método 'Dutch Reach' consiste en utilizar la mano derecha para tirar
    de la manija y abrir la puerta, lo que inherentemente hace girar el cuerpo para
    proporcionar una mejor visibilidad del tráfico que se aproxima por detrás, ayudando
    a evitar colisiones con ciclistas.
- id: 321
  category: signs_and_signals
  question: ¿Qué indican las marcas 'sharrows' en el pavimento?
  choices:
    A: Un carril designado exclusivamente para bicicletas
    B: Una ruta con menor volumen de tráfico recomendada para bicicletas
    C: Una recomendación de en qué parte de un carril debe circular un ciclista para
      fluir más fácilmente con el tráfico
    D: Una zona de cruce exclusivo para peatones
  answer: C
  explanation: Las 'sharrows' son marcas viales en el pavimento que proporcionan una
    recomendación de en qué parte de un carril debe circular un ciclista para fluir
    más fácilmente con el resto del tráfico.
- id: 322
  category: sharing_the_road
  question: ¿Por qué podría un ciclista no poder usar señales manuales al girar o
    detenerse?
  choices:
    A: Las señales manuales no son obligatorias por ley para los ciclistas
    B: Las condiciones de la carretera o del tráfico pueden requerir que mantengan
      ambas manos en el manubrio
    C: Las bicicletas están equipadas con luces de giro automáticas
    D: Los ciclistas solo necesitan hacer señales cuando circulan en un carril para
      bicicletas designado
  answer: B
  explanation: Tenga en cuenta que un ciclista puede no poder hacer señales si las
    condiciones de la carretera o del tráfico requieren que mantenga ambas manos en
    el manubrio.
- id: 323
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las motocicletas
    y los carriles de tráfico?
  choices:
    A: Una motocicleta solo tiene derecho a la mitad de un carril de tráfico
    B: Usted puede rebasar a una motocicleta en el mismo carril si hay suficiente
      espacio
    C: Dos motocicletas pueden compartir un solo carril de tráfico
    D: Las motocicletas deben circular por el acotamiento de la carretera
  answer: C
  explanation: Los operadores de motocicletas/scooters/ciclomotores (mopeds) tienen
    derecho a usar un carril de tráfico completo, y dos motocicletas/scooters/ciclomotores
    pueden compartir un carril. No debe rebasarlos en el mismo carril.
- id: 324
  category: vehicle_information
  question: 'Según el manual, una bicicleta motorizada o ciclomotor (moped) tiene
    una velocidad máxima de diseño de no más de:'
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Una bicicleta motorizada o ciclomotor (moped) tiene la capacidad de
    una velocidad máxima de diseño de no más de 30 mph.
- id: 325
  category: defensive_driving
  question: 'Casi el 40 por ciento de los choques que involucran a una motocicleta,
    scooter o ciclomotor y otro vehículo motorizado son causados por:'
  choices:
    A: La motocicleta sigue demasiado de cerca al otro vehículo
    B: El otro vehículo gira a la izquierda frente a la motocicleta
    C: La motocicleta rebasa por la derecha
    D: El otro vehículo se detiene repentinamente
  answer: B
  explanation: Casi el 40 por ciento de los choques que involucran motocicletas/scooters/ciclomotores
    y otro vehículo motorizado fueron causados por el otro vehículo que giró a la
    izquierda frente al motociclista/scooter/ciclomotor.
- id: 326
  category: safe_driving_rules
  question: Si ve una motocicleta acercándose con su luz de giro parpadeando, ¿qué
    debe hacer?
  choices:
    A: Asumir que está girando y avanzar en su trayectoria
    B: Tocar la bocina para que el conductor sepa que lo ve
    C: No salir frente a ella hasta que vea que está comenzando a girar
    D: Acelerar para cruzar la intersección antes de que llegue la motocicleta
  answer: C
  explanation: No asuma que una motocicleta/scooter/ciclomotor está girando cuando
    vea su luz de giro parpadeando, ya que es posible que no se cancelen automáticamente.
    No salga frente a ellos hasta que vea que están comenzando a girar.
- id: 327
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir detrás de
    una motocicleta, scooter o ciclomotor en condiciones normales?
  choices:
    A: 1 a 2 segundos
    B: 3 a 4 segundos
    C: 5 a 6 segundos
    D: 7 a 8 segundos
  answer: B
  explanation: Al seguir a un motociclista/scooter/ciclomotor, permita una distancia
    de seguimiento de 3 a 4 segundos o más en condiciones húmedas.
- id: 328
  category: sharing_the_road
  question: ¿Por qué debe siempre bajar las luces delanteras al acercarse a una motocicleta,
    scooter o ciclomotor?
  choices:
    A: Las luces altas agotarán la batería de la motocicleta
    B: El efecto cegador de las luces altas puede ser mucho más peligroso para ellos
      debido a su vulnerabilidad
    C: Es una señal de que está a punto de rebasarlos
    D: Las luces altas harán que el motor de la motocicleta se apague
  answer: B
  explanation: Siempre baje sus luces delanteras (cambie a luces bajas) al acercarse
    a una motocicleta/scooter/ciclomotor. Debido a su vulnerabilidad, el efecto cegador
    de sus luces altas puede ser mucho más peligroso para ellos que para los conductores
    de vehículos motorizados.
- id: 329
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando escuche una sirena o vea un vehículo de emergencia
    acercándose con luces intermitentes?
  choices:
    A: Acelerar y despejar la intersección rápidamente
    B: Detenerse inmediatamente en su carril actual
    C: Moverse a la derecha, detenerse junto al bordillo o borde de la carretera y
      parar
    D: Moverse al carril izquierdo y reducir la velocidad
  answer: C
  explanation: Cuando escuche una sirena o vea un vehículo acercándose con luces intermitentes,
    muévase a la derecha, deténgase junto al bordillo o borde de la carretera y pare.
- id: 330
  category: safe_driving_rules
  question: Después de que un vehículo de emergencia con luces intermitentes lo pase,
    ¿a qué distancia debe mantenerse de él?
  choices:
    A: Al menos 100 pies
    B: Al menos 200 pies
    C: Al menos 300 pies
    D: Al menos 500 pies
  answer: D
  explanation: Después de que pase el vehículo de emergencia, mire cuidadosamente
    detrás de usted para ver si hay otros vehículos y, cuando sea seguro hacerlo,
    regrese a la calzada. Debe mantenerse al menos a 500 pies de distancia del vehículo
    de emergencia.
- id: 331
  category: driver_responsibility
  question: Si la policía lo detiene por la noche, ¿qué debe hacer para ayudar al
    oficial a ver el interior de su vehículo?
  choices:
    A: Encender las luces altas
    B: Encender las luces interiores
    C: Apuntar con una linterna por la ventana
    D: Salir del vehículo inmediatamente
  answer: B
  explanation: Encienda las luces de emergencia y, si es de noche, las luces interiores
    para ayudar al oficial a ver que todo está en orden dentro del vehículo.
- id: 332
  category: driver_responsibility
  question: Cuando sea detenido por la policía, ¿cómo debe manejar la entrega de sus
    documentos?
  choices:
    A: Tenerlos en la mano antes de que el oficial se acerque a la ventana
    B: Buscarlos rápidamente para ahorrarle tiempo al oficial
    C: Decirle al oficial dónde se encuentran y buscarlos lentamente con una mano
      en el volante
    D: Lanzarlos al asiento del pasajero para que el oficial los inspeccione
  answer: C
  explanation: Si el oficial le pide estos documentos, dígale dónde se encuentran
    y búsquelos lentamente con una mano en el volante.
- id: 333
  category: safe_driving_rules
  question: Bajo la Ley de Ceder el Paso (Move-Over Law), ¿qué debe hacer al acercarse
    a un vehículo de emergencia estacionado que tiene luces intermitentes encendidas?
  choices:
    A: Detener su vehículo y esperar instrucciones
    B: Tocar la bocina para alertar a los trabajadores de emergencia
    C: Desocupar el carril más cercano si es seguro, o reducir la velocidad a una
      velocidad segura para las condiciones
    D: Mantener su velocidad pero encender las luces de emergencia
  answer: C
  explanation: La ley estatal exige que los conductores que se aproximen a un vehículo
    de emergencia estacionado con luces intermitentes desocupen el carril más cercano
    si es seguro y posible hacerlo, o reduzcan la velocidad a una velocidad segura
    para las condiciones de la carretera, el clima y el tráfico.
- id: 334
  category: sharing_the_road
  question: ¿Qué debe hacer cuando una motocicleta, motoneta (scooter) o ciclomotor
    (moped) está rebasando su vehículo?
  choices:
    A: Aumentar la velocidad para evitar que se le crucen
    B: Mantener su posición en el carril y su velocidad
    C: Moverse hacia el acotamiento de la carretera
    D: Frenar bruscamente para dejar que pasen más rápido
  answer: B
  explanation: Cuando una motocicleta/motoneta/ciclomotor esté rebasando su vehículo,
    debe mantener su posición en el carril y su velocidad. Permítales completar la
    maniobra.
- id: 335
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor al acercarse a un vehículo de emergencia
    estacionado que muestra luces intermitentes mientras viaja en la misma dirección?
  choices:
    A: Detenerse inmediatamente y esperar instrucciones.
    B: Desocupar el carril más cercano si es seguro, o reducir la velocidad a una
      velocidad segura.
    C: Tocar la bocina para alertar a los trabajadores de emergencia y mantener la
      velocidad.
    D: Acelerar para pasar el vehículo de emergencia rápidamente.
  answer: B
  explanation: La ley estatal exige que los conductores que se aproximen a un vehículo
    de emergencia estacionado con luces intermitentes desocupen el carril más cercano
    si es seguro y posible hacerlo, o reduzcan la velocidad a una velocidad segura
    para las condiciones de la carretera, el clima y el tráfico.
- id: 336
  category: sharing_the_road
  question: En choques fatales que involucran automóviles y vehículos comerciales,
    ¿en qué porcentaje de las veces informa la policía que el conductor del automóvil
    contribuyó a la causa del choque?
  choices:
    A: Menos del 30%
    B: Exactamente el 50%
    C: Más del 70%
    D: 100%
  answer: C
  explanation: Según el manual, en más del 70% de todos los choques fatales que involucran
    automóviles y vehículos comerciales, la policía informa que el conductor del automóvil
    contribuyó a la causa del choque.
- id: 337
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego lateral de un
    camión grande?
  choices:
    A: No puede ver los faros del camión en su espejo retrovisor.
    B: No puede ver la cara del conductor en el espejo lateral del camión.
    C: La luz de giro del camión está parpadeando.
    D: Está a menos de 50 pies del parachoques trasero del camión.
  answer: B
  explanation: 'El manual establece con respecto a las Zonas Prohibidas (Side No-Zones)
    laterales: "Si no puede ver la cara del conductor en el espejo lateral, él no
    puede verlo a usted".'
- id: 338
  category: safe_driving_rules
  question: Al rebasar un vehículo grande, ¿cuándo es seguro volver a colocarse delante
    de él?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del camión.
    B: Cuando pueda ver toda la parte delantera del vehículo en su espejo retrovisor.
    C: Cuando el conductor del camión parpadee sus faros.
    D: Después de haber mantenido su velocidad durante 5 segundos.
  answer: B
  explanation: Al rebasar un vehículo grande, debe ver toda la parte delantera del
    vehículo en su espejo retrovisor antes de colocarse delante y mantener la velocidad.
- id: 339
  category: sharing_the_road
  question: ¿Hasta qué distancia puede extenderse el enorme punto ciego directamente
    detrás de un vehículo grande?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 150 pies
    D: Hasta 200 pies
  answer: D
  explanation: A diferencia de los automóviles, los vehículos grandes tienen puntos
    ciegos enormes directamente detrás de ellos que se extienden hasta 200 pies.
- id: 340
  category: sharing_the_road
  question: ¿Por qué un camión grande o un autobús podría abrirse hacia la izquierda
    antes de girar a la derecha?
  choices:
    A: Para librar con seguridad la esquina de una acera u otra obstrucción.
    B: Para permitir que los autos los pasen por la derecha.
    C: Para ganar suficiente velocidad para completar el giro.
    D: Para revisar su punto ciego del lado derecho.
  answer: A
  explanation: Cuando un camión o autobús necesita girar a la derecha, a veces se
    abrirá hacia la izquierda para poder girar a la derecha de manera segura y librar
    la esquina de una acera u otra obstrucción.
- id: 341
  category: defensive_driving
  question: ¿Al encontrarse con un camión que viene en dirección opuesta, por qué
    debe mantenerse lo más a la derecha posible de la calzada?
  choices:
    A: Para darle espacio al camión para hacer un giro en U.
    B: Para evitar la turbulencia del viento que empuja los vehículos hacia afuera.
    C: Para permitir que el conductor del camión vea su placa de matrícula.
    D: Para prepararse para orillarse y detenerse.
  answer: B
  explanation: Debe mantenerse lo más a la derecha posible de la calzada para evitar
    un choque por raspado lateral y para reducir la turbulencia del viento entre los
    dos vehículos, la cual empuja los vehículos hacia afuera.
- id: 342
  category: signs_and_signals
  question: ¿Cuál es el propósito de las líneas de parada en muchas intersecciones?
  choices:
    A: Indicar dónde se permite el cruce de peatones.
    B: Ubicar los vehículos más atrás para dar a los vehículos más grandes más espacio
      para girar.
    C: Marcar el comienzo de una zona escolar.
    D: Mostrar dónde cambia el límite de velocidad.
  answer: B
  explanation: Las líneas de parada ayudan a ubicarlo más atrás en una intersección
    para dar a los vehículos más grandes más espacio para girar. Deténgase siempre
    detrás de las líneas de parada.
- id: 343
  category: safe_driving_rules
  question: ¿Cuál es el propósito de las rampas de escape (runaway ramps) en pendientes
    largas de bajada?
  choices:
    A: Para que los vehículos lentos se orillen y dejen pasar a otros.
    B: Para vehículos grandes que están fuera de control o no pueden detenerse debido
      a una falla en los frenos.
    C: Para que los vehículos de emergencia se estacionen y monitoreen el tráfico.
    D: Para que los conductores revisen de forma segura su carga y neumáticos.
  answer: B
  explanation: Estas rampas deben ser utilizadas únicamente por vehículos grandes
    que estén fuera de control o que no puedan detenerse debido a una falla en los
    frenos. Nunca se detenga ni se estacione en el área de estas rampas.
- id: 344
  category: safe_driving_rules
  question: ¿A qué velocidad máxima puede pasar por una zona de seguridad reservada
    para peatones que suben a tranvías y vehículos de tren ligero, una vez que sea
    seguro hacerlo?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: Puede pasar por la zona de seguridad tan pronto como sea seguro hacerlo
    y a no más de 10 mph.
- id: 345
  category: safe_driving_rules
  question: ¿Cuándo se le permite adelantar y pasar por la izquierda de un tranvía
    o vehículo de tren ligero?
  choices:
    A: Siempre que el tranvía se mueva más lento que el límite de velocidad.
    B: Solo cuando se encuentre en una calle de un solo sentido o sea dirigido por
      un oficial de tránsito.
    C: Siempre que el tranvía esté detenido para recoger pasajeros.
    D: Nunca se le permite pasar un tranvía por la izquierda.
  answer: B
  explanation: No adelante ni pase por la izquierda de un tranvía o vehículo de tren
    ligero... excepto cuando se encuentre en una calle de un solo sentido. Cuando
    las vías estén tan cerca del lado derecho de la carretera que no pueda pasar por
    la derecha, o cuando un oficial de tránsito se lo indique, pase por la izquierda.
- id: 346
  category: signs_and_signals
  question: ¿Qué indica un triángulo naranja y rojo fluorescente o reflectante que
    se muestra en la parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo viaja a menos de 25 mph.
    C: El vehículo es de respuesta a emergencias.
    D: El vehículo está realizando giros amplios a la derecha.
  answer: B
  explanation: Un triángulo naranja y rojo fluorescente o reflectante que se muestra
    en la parte trasera de vehículos tirados por animales, equipos agrícolas o equipos
    de construcción significa que el vehículo viaja a menos de 25 mph.
- id: 347
  category: sharing_the_road
  question: ¿Cuál es el rango de velocidad normal para los vehículos tirados por animales?
  choices:
    A: De 5 a 8 millas por hora
    B: De 10 a 15 millas por hora
    C: De 15 a 20 millas por hora
    D: De 20 a 25 millas por hora
  answer: A
  explanation: Las velocidades normales para los vehículos tirados por animales oscilan
    entre 5 y 8 millas por hora.
- id: 348
  category: sharing_the_road
  question: ¿Por qué debe evitar usar la bocina o "acelerar" el motor al pasar a un
    vehículo tirado por animales o a un jinete a caballo?
  choices:
    A: Es ilegal usar la bocina en áreas rurales.
    B: Puede asustar al animal y causar un choque.
    C: Hará que el animal deje de moverse por completo.
    D: Viola las leyes de ordenanza sobre ruidos.
  answer: B
  explanation: Pase con precaución y no use la bocina ni "aceleere" el motor porque
    esto puede asustar al caballo y causar un choque.
- id: 349
  category: sharing_the_road
  question: ¿Qué debe hacer si conduce un vehículo de movimiento lento en una carretera
    de un solo carril y doble sentido y hace que los vehículos detrás de usted disminuyan
    la velocidad significativamente?
  choices:
    A: Acelerar para igualar el flujo del tráfico.
    B: Orillarse al lado de la calzada cuando sea seguro para dejar pasar a otros
      vehículos.
    C: Encender las luces de emergencia y permanecer en el centro del carril.
    D: Hacer señas a los vehículos detrás de usted para que pasen por el arcén.
  answer: B
  explanation: Si conduce un vehículo de movimiento lento y debe conducir tan despacio
    que otros vehículos tengan que reducir la velocidad por detrás, oríllese al lado
    de la calzada cuando sea seguro hacerlo y deje pasar a los otros vehículos.
- id: 350
  category: sharing_the_road
  question: 'Si un camión o autobús necesita girar a la derecha y usted también va
    a girar a la derecha, usted debe:'
  choices:
    A: Girar rápidamente a la derecha antes de que lo haga el camión o autobús.
    B: Meterse entre el camión o autobús y el bordillo.
    C: Esperar hasta que el camión o autobús gire antes de girar a la derecha.
    D: Tocar la bocina para que el conductor sepa que usted está allí.
  answer: C
  explanation: Si un camión o autobús necesita girar a la derecha y usted también
    va a girar a la derecha, debe esperar hasta que el camión o autobús gire antes
    de girar a la derecha.
- id: 351
  category: sharing_the_road
  question: ¿Qué debe hacer si un peatón está cruzando en medio de la calle, fuera
    de un paso de peatones (cruce imprudente o 'jaywalking')?
  choices:
    A: Debe detenerse por ellos.
    B: No tiene que detenerse por ellos.
    C: Debe tocar la bocina y mantener su velocidad.
    D: Virar hacia el carril contrario para evitarlos.
  answer: A
  explanation: Incluso si un peatón está cruzando en medio de la calle (cruce imprudente)
    y es ilegal, usted debe detenerse por ellos.
- id: 352
  category: sharing_the_road
  question: 'Los operadores de motocicletas tienen derecho a:'
  choices:
    A: Compartir un carril de tráfico con otro vehículo.
    B: Usar el arcén (hombro) de una carretera para rebasar.
    C: Usar un carril de tráfico completo.
    D: Conducir entre carriles de tráfico detenido.
  answer: C
  explanation: Los operadores de motocicletas tienen derecho a usar un carril de tráfico
    completo.
- id: 353
  category: safe_driving_rules
  question: ¿Cómo debe ajustar su conducción al viajar por caminos de grava o tierra
    en comparación con las carreteras pavimentadas?
  choices:
    A: Aumentar su velocidad para mantener la tracción.
    B: Reducir su velocidad y aumentar su distancia de seguimiento.
    C: Disminuir su distancia de seguimiento para ver mejor el camino.
    D: Bombear sus frenos continuamente para evitar derrapes.
  answer: B
  explanation: Al conducir sobre grava o tierra, debe reducir su velocidad y aumentar
    su distancia de seguimiento, ya que tomará mucho más tiempo detenerse debido a
    la pérdida de tracción.
- id: 354
  category: safe_driving_rules
  question: Durante los períodos secos, los caminos de grava pueden volverse extremadamente
    polvorientos, reduciendo la visión. ¿Qué luces delanteras debe usar en esta situación?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces antiniebla
  answer: B
  explanation: Durante condiciones de mucho polvo en caminos de grava, se recomienda
    utilizar las luces bajas para que su vehículo sea más visible para los demás,
    reducir la velocidad y aumentar la distancia de seguimiento.
- id: 355
  category: defensive_driving
  question: 'Al conducir sobre rejillas abiertas de puentes o puentes de acero, usted
    debe:'
  choices:
    A: Acelerar rápidamente para cruzar el puente más rápido.
    B: Aflojar el agarre del volante.
    C: Mantener un agarre firme en el volante y aumentar su distancia de seguimiento.
    D: Cambiar de carril con frecuencia para encontrar la mejor tracción.
  answer: C
  explanation: Debido a la reducción de la tracción en las rejillas abiertas de los
    puentes o puentes de acero, debe mantener un agarre firme en el volante y aumentar
    su distancia de seguimiento.
- id: 356
  category: safe_driving_rules
  question: Muchos cruces a nivel de carretera y ferrocarril en caminos rurales están
    marcados solo con una señal de advertencia y una señal blanca en forma de X. ¿Qué
    debe hacer al acercarse a uno?
  choices:
    A: Mantener su velocidad a menos que vea un tren.
    B: Reducir la velocidad, mirar a ambos lados y estar preparado para detenerse.
    C: Tocar la bocina antes de cruzar las vías.
    D: Acelerar para despejar las vías rápidamente.
  answer: B
  explanation: Muchos cruces a nivel de carretera y ferrocarril en caminos rurales
    normalmente no tienen luces ni barreras; por lo tanto, siempre debe reducir la
    velocidad, mirar a ambos lados y estar preparado para detenerse ante un tren antes
    de cruzar.
- id: 357
  category: safe_driving_rules
  question: ¿A qué distancia debe atenuar sus luces altas cuando se aproxima un vehículo
    en sentido contrario?
  choices:
    A: A una distancia aproximada de una cuadra.
    B: A menos de 100 pies.
    C: A menos de 500 pies.
    D: Solo cuando el otro conductor haga destellos con sus luces.
  answer: A
  explanation: Debe atenuar sus luces altas siempre que se encuentre a una distancia
    aproximada de una cuadra de un vehículo que viene en sentido contrario.
- id: 358
  category: defensive_driving
  question: Si un vehículo que viene en sentido contrario no atenúa sus luces altas,
    ¿hacia dónde debe mirar para evitar ser deslumbrado?
  choices:
    A: Directamente a las luces delanteras que se aproximan.
    B: Hacia el lado izquierdo de la carretera.
    C: Hacia el lado derecho de la carretera.
    D: A su espejo retrovisor.
  answer: C
  explanation: Si un conductor no atenúa sus luces, mire hacia el lado derecho de
    la carretera para evitar ser deslumbrado por sus luces delanteras.
- id: 359
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones debe usar las luces bajas en lugar
    de las luces altas?
  choices:
    A: Al conducir en una carretera rural vacía.
    B: Al seguir a otro vehículo o en tráfico pesado.
    C: Cuando no hay vehículos en sentido contrario.
    D: Cuando quiera ver el doble de lejos en la carretera.
  answer: B
  explanation: Use las luces bajas cuando siga a otro vehículo, en tráfico pesado,
    con niebla, o cuando esté nevando o lloviendo fuerte. La luz de las luces altas
    se reflejará, causando deslumbramiento.
- id: 360
  category: defensive_driving
  question: ¿Cuánta agua se necesita para llegar a la parte inferior de la mayoría
    de los automóviles de pasajeros, lo que podría causar la pérdida de control o
    que el motor se apague?
  choices:
    A: 2 pulgadas
    B: 6 pulgadas
    C: 12 pulgadas
    D: 2 pies
  answer: B
  explanation: Recuerde, 6 pulgadas de agua llegarán a la parte inferior de la mayoría
    de los automóviles de pasajeros, causando la pérdida de control o un posible apagado
    del motor.
- id: 361
  category: defensive_driving
  question: ¿Cuánta agua torrencial puede arrastrar a la mayoría de los vehículos?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 2 pies
  answer: D
  explanation: 2 pies de agua torrencial pueden arrastrar a la mayoría de los vehículos.
- id: 362
  category: signs_and_signals
  question: ¿De qué color son todas las señales temporales en las zonas de obras viales?
  choices:
    A: Fondo amarillo con letras negras
    B: Fondo naranja con letras o símbolos negros
    C: Fondo blanco con letras rojas
    D: Fondo verde con letras blancas
  answer: B
  explanation: Todas las señales temporales en las zonas de obras tienen un fondo
    naranja y letras o símbolos negros, y le indican qué hacer.
- id: 363
  category: safe_driving_rules
  question: Al acercarse a una zona de obras que requiere un cambio de carril, ¿cuándo
    debe incorporarse al carril correspondiente?
  choices:
    A: Tan pronto como sea posible al primer aviso de la zona de obras próxima.
    B: Justo antes de que comience el cierre del carril.
    C: Después de pasar la primera señal de advertencia naranja.
    D: Siempre que el vehículo de adelante se incorpore.
  answer: A
  explanation: Incorpórese tan pronto como sea posible. Los automovilistas pueden
    ayudar a mantener el flujo de tráfico y las velocidades indicadas al moverse al
    carril correspondiente al primer aviso de una zona de obras próxima.
- id: 364
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando nota por primera vez que se acerca a una zona de
    obras?
  choices:
    A: Acelerar para atravesar el área rápidamente
    B: Moverse al carril correspondiente para mantener el flujo de tráfico
    C: Detenerse y esperar a que un vehículo guía lo dirija
    D: Encender las luces altas
  answer: B
  explanation: El manual establece que se debe mantener el flujo de tráfico y las
    velocidades indicadas moviéndose al carril correspondiente al primer aviso de
    una zona de obras próxima.
- id: 365
  category: safe_driving_rules
  question: ¿Cómo debe ajustar su conducción al pasar por una zona de obras móvil?
  choices:
    A: Reanudar la velocidad normal tan pronto como pase a los trabajadores
    B: Tocar la bocina para advertir a los trabajadores de su presencia
    C: Observar las señales publicadas hasta que vea la que dice 'End Road Work' (Fin
      de las obras viales)
    D: Detenerse en el arcén hasta que la zona de obras móvil se haya desplazado
  answer: C
  explanation: El manual establece que para las zonas de obras móviles, debe observar
    las señales publicadas hasta que vea la que dice 'End Road Work' (Fin de las obras
    viales), porque los trabajadores aún pueden estar presentes incluso si no los
    ve de inmediato.
- id: 366
  category: defensive_driving
  question: Si un animal corre repentinamente frente a su vehículo y una colisión
    es inevitable, ¿cuál es la alternativa más segura?
  choices:
    A: Virar bruscamente hacia el tráfico en sentido contrario
    B: Virar bruscamente fuera de la carretera
    C: Atropellar al animal mientras mantiene el control del vehículo
    D: Bloquear los frenos para detenerse de inmediato
  answer: C
  explanation: El manual establece que si una colisión es inevitable, no vire bruscamente
    para evitar al animal. La alternativa más segura puede ser atropellar al animal
    mientras se concentra en mantener su vehículo bajo control y en la carretera.
- id: 367
  category: defensive_driving
  question: ¿Durante qué meses están más activos los animales, lo que requiere precaución
    adicional por parte de los conductores?
  choices:
    A: De enero a marzo
    B: De abril a junio
    C: De julio a septiembre
    D: De octubre a diciembre
  answer: D
  explanation: El manual aconseja tener precaución al conducir al amanecer y al anochecer
    y entre los meses de octubre a diciembre, cuando los animales están más activos.
- id: 368
  category: defensive_driving
  question: ¿Qué debe hacer si un perro sale a la carretera y comienza a perseguir
    su vehículo?
  choices:
    A: Detener su vehículo por completo
    B: Virar bruscamente para asustar al perro
    C: Reducir la velocidad hasta que el perro esté cerca y luego acelerar para alejarse
    D: Tocar la bocina continuamente
  answer: C
  explanation: El manual establece que los perros que persiguen vehículos tienden
    a acercarse en línea recta. Debe reducir la velocidad hasta que el perro esté
    cerca de su vehículo y luego acelerar para alejarse del perro a medida que se
    acerca.
- id: 369
  category: defensive_driving
  question: Si cree que tiene tiempo para evitar atropellar a un ciervo en la carretera,
    ¿por qué podría parpadear sus faros?
  choices:
    A: Para indicarle al ciervo que se quite del camino
    B: Porque los ciervos tienden a fijarse en los faros y parpadearlos puede hacer
      que el animal se congele
    C: Para cegar al ciervo para que no pueda correr hacia usted
    D: Para alertar al tráfico en sentido contrario para que se detenga
  answer: B
  explanation: El manual señala que los ciervos tienden a fijarse en los faros, por
    lo que parpadearlos puede hacer que el animal se congele en la carretera, lo que
    potencialmente le ayudará a evitar una colisión.
- id: 370
  category: driver_testing
  question: ¿Cuál es la puntuación mínima para aprobar el examen de conocimientos
    del conductor?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: Según el manual, debe obtener un 80% para aprobar el examen de conocimientos.
- id: 371
  category: driver_testing
  question: ¿Si reprueba el examen de conocimientos por cuarta vez, cuánto tiempo
    debe esperar antes de comenzar el proceso de nuevo?
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: C
  explanation: El manual establece que si no aprueba por cuarta vez, se le requerirá
    esperar 6 meses a partir del examen reprobado más reciente antes de comenzar el
    proceso de nuevo.
- id: 372
  category: license_system
  question: Si es menor de 17 años, ¿cuánto tiempo debe tener su Permiso de Instrucción
    antes de ser elegible para realizar el examen de la licencia de conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: Un año completo o hasta cumplir los 17 años
  answer: D
  explanation: Si es menor de 17 años, debe tener su Permiso de Instrucción durante
    un año completo o hasta cumplir los 17 años, lo que ocurra primero, antes de ser
    elegible para realizar el examen de la licencia de conducir.
- id: 373
  category: safe_driving_rules
  question: ¿Hacia qué lado deben apuntar las ruedas al estacionar cuesta arriba con
    un bordillo (curb)?
  choices:
    A: Hacia el bordillo
    B: Recto hacia adelante
    C: Hacia afuera del bordillo
    D: Paralelo al bordillo
  answer: C
  explanation: De acuerdo con las preguntas de muestra del manual, al estacionar cuesta
    arriba con un bordillo, las ruedas deben apuntar hacia afuera del bordillo.
- id: 374
  category: safe_driving_rules
  question: 'Al adelantar a otro vehículo, debe continuar adelantando hasta que:'
  choices:
    A: Mire por su espejo lateral y vea que el vehículo está detrás de usted
    B: La parte delantera completa del vehículo rebasado sea visible en su espejo
      retrovisor
    C: El conductor al que acaba de pasar le haga una señal para que se mueva
    D: Esté a una distancia de un vehículo por delante del vehículo rebasado
  answer: B
  explanation: Las preguntas de muestra del manual indican que debe continuar adelantando
    a otro vehículo hasta que la parte delantera completa del vehículo rebasado sea
    visible en su espejo retrovisor.
- id: 375
  category: safe_driving_rules
  question: ¿Por qué es importante detenerse en las líneas de parada en una intersección?
  choices:
    A: Para dar a los vehículos más grandes más espacio para girar
    B: Para que el semáforo cambie más rápido
    C: Para dar a los peatones más espacio para caminar
    D: Para evitar activar las cámaras de semáforo en rojo
  answer: A
  explanation: Según las preguntas de muestra del manual, es importante detenerse
    en las líneas de parada para dar a los vehículos más grandes más espacio para
    girar.
- id: 376
  category: safe_driving_rules
  question: ¿Cuándo suelen estar más resbaladizas las carreteras?
  choices:
    A: Cuando empieza a llover, nevar o caer aguanieve por primera vez
    B: Cuando ha estado lloviendo, nevando o cayendo aguanieve durante un tiempo
    C: Cuando acaba de dejar de llover, nevar o caer aguanieve
    D: Cuando sale el sol después de una tormenta de lluvia
  answer: A
  explanation: El manual establece que las carreteras están más resbaladizas cuando
    empieza a llover, nevar o caer aguanieve por primera vez.
- id: 377
  category: safe_driving_rules
  question: ¿Qué debe hacer si su vehículo se apaga al cruzar las vías del tren y
    se acerca un tren?
  choices:
    A: Correr a través de las vías lo más lejos posible
    B: Correr en la dirección de donde se aproxima el tren
    C: Correr en la dirección opuesta a la que se aproxima el tren
    D: Permanecer en el vehículo y llamar al 911
  answer: B
  explanation: Las preguntas de muestra del manual aconsejan que si su vehículo se
    apaga en las vías del tren, debe correr en la dirección de donde se aproxima el
    tren para evitar ser golpeado por los escombros de la colisión.
- id: 378
  category: driver_testing
  question: Durante la inspección previa al viaje para el examen de conducir, ¿qué
    NO se le pedirá que haga?
  choices:
    A: Caminar alrededor del vehículo
    B: Señalar o tocar cada elemento que se está inspeccionando
    C: Abrir el capó o gatear debajo del vehículo
    D: Explicar al examinador lo que está revisando
  answer: C
  explanation: El manual establece que durante la inspección previa al viaje, es posible
    que tenga que caminar alrededor del vehículo, señalar o tocar elementos y explicar
    lo que está revisando, pero NO tendrá que abrir el capó ni gatear debajo del vehículo.
- id: 379
  category: vehicle_information
  question: ¿Dónde puede encontrar la presión recomendada de los neumáticos (psi)
    para su vehículo?
  choices:
    A: En el flanco (pared lateral) del neumático
    B: En el manual del propietario del vehículo o en el marco de la puerta del lado
      del conductor
    C: En las luces indicadoras del tablero
    D: En el interior de la puerta de la guantera
  answer: B
  explanation: Para comprobar la presión de los neumáticos, el manual aconseja utilizar
    los psi recomendados que se encuentran en el manual del propietario del vehículo
    o en el marco de la puerta del lado del conductor del vehículo.
- id: 380
  category: vehicle_information
  question: ¿Cómo se realiza la "prueba de la moneda" (penny test) para comprobar
    la profundidad de la banda de rodadura de sus neumáticos?
  choices:
    A: Colocando la moneda plana contra el flanco del neumático
    B: Colocando la cabeza de Lincoln en una de las ranuras más bajas de la banda
      de rodadura
    C: Colocando el lado del Monumento a Lincoln hacia arriba en la banda de rodadura
    D: Dejando caer la moneda desde la parte superior del neumático para ver si rebota
  answer: B
  explanation: La "prueba de la moneda" se realiza sosteniendo el cuerpo de Abraham
    Lincoln entre el pulgar y el índice y colocando la cabeza de Lincoln en una de
    las ranuras más bajas de la banda de rodadura del neumático.
- id: 381
  category: vehicle_information
  question: ¿Cuál es una consecuencia potencial de conducir con neumáticos excesivamente
    inflados?
  choices:
    A: Mayor efecto de hidroplaneo (hydroplaning)
    B: Reducción de la capacidad de giro
    C: Mayor probabilidad de separación de la banda de rodadura y falla del neumático
    D: Acumulación excesiva de calor debido al aumento de la flexión
  answer: C
  explanation: Según el manual, el inflado excesivo aumenta la probabilidad de separación
    de la banda de rodadura y falla del neumático.
- id: 382
  category: vehicle_information
  question: ¿Por qué es importante revisar debajo del vehículo en busca de charcos
    o goteo de fluidos antes de conducir?
  choices:
    A: Para asegurar que la condensación del aire acondicionado esté drenando correctamente
    B: La pérdida de fluido podría indicar una falla de componentes en la transmisión
      o en los sistemas de combustible
    C: Para verificar si el líquido limpiaparabrisas está lleno
    D: Para verificar que la presión de los neumáticos sea correcta
  answer: B
  explanation: Es importante buscar fugas porque la pérdida de fluido podría indicar
    una falla de componentes en áreas donde los niveles podrían no revisarse fácilmente,
    como la transmisión o los sistemas de combustible.
- id: 383
  category: safe_driving_rules
  question: ¿Qué es lo que NUNCA debe hacer al revisar el refrigerante de su vehículo?
  choices:
    A: Revisar el nivel de refrigerante junto al radiador
    B: Llenarlo con una solución de refrigerante y agua
    C: Abrir la tapa del radiador en un automóvil caliente
    D: Consultar el manual del conductor para conocer la proporción adecuada de refrigerante
  answer: C
  explanation: 'El manual advierte explícitamente: "¡Nunca abra la tapa del radiador
    en un automóvil caliente! Espere hasta que el automóvil se haya enfriado primero".'
- id: 384
  category: driver_testing
  question: Si la temperatura exterior es superior a 85 °F durante su examen de conducir,
    ¿qué se requiere de su vehículo?
  choices:
    A: La ventana del pasajero debe poder bajarse
    B: El aire acondicionado debe funcionar correctamente
    C: El calefactor debe estar desactivado
    D: Los limpiaparabrisas deben estar encendidos
  answer: B
  explanation: Para un vehículo utilizado en el examen de conducir, si la temperatura
    exterior es superior a 85 °F, el aire acondicionado debe funcionar correctamente.
- id: 385
  category: safe_driving_rules
  question: ¿Cómo debe colocarse correctamente el cinturón de seguridad en su cuerpo?
  choices:
    A: A través del estómago y el cuello
    B: A través de las caderas y el hombro
    C: Holgado sobre el regazo y detrás de la espalda
    D: Ajustado a través de los muslos y debajo del brazo
  answer: B
  explanation: Al revisar su cinturón de seguridad, debe asegurarse de que no esté
    rasgado ni deshilachado y colocar correctamente el cinturón de seguridad a través
    de las caderas y el hombro.
- id: 386
  category: vehicle_information
  question: ¿Por qué es importante verificar que el desempañador (defroster) de su
    vehículo funcione correctamente?
  choices:
    A: Enfría el motor durante el clima caluroso
    B: Mejora la visibilidad, especialmente durante el clima frío
    C: Evita que el motor se congele
    D: Limpia la suciedad y los escombros del exterior del parabrisas
  answer: B
  explanation: Es importante asegurarse de que el desempañador funcione correctamente
    porque mejora la visibilidad, especialmente durante el clima frío.
- id: 387
  category: vehicle_information
  question: ¿Cómo puede probar si el desempañador de su vehículo funciona durante
    una inspección?
  choices:
    A: Active el ventilador y coloque su mano sobre la rejilla de ventilación del
      tablero
    B: Encienda los limpiaparabrisas y rocíe líquido lavaparabrisas
    C: Abra todas las ventanas y verifique el flujo de aire
    D: Revise el nivel de refrigerante en el radiador
  answer: A
  explanation: Puede probar el desempañador activando el ventilador y colocando su
    mano sobre la rejilla de ventilación del tablero para asegurarse de que funcione
    correctamente.
- id: 388
  category: vehicle_information
  question: ¿Cuál es el propósito principal de revisar las luces indicadoras del tablero?
  choices:
    A: Asegurarse de que el radio esté recibiendo energía
    B: Advertirle si las luces externas, como las direccionales y las luces altas,
      están activas cuando no es apropiado
    C: Medir la cantidad exacta de combustible que queda en el tanque
    D: Revisar la presión de los neumáticos desde el interior del automóvil
  answer: B
  explanation: Es importante asegurarse de que las luces indicadoras funcionen porque
    ayudan a advertirle si las luces externas, como las direccionales y las luces
    altas, todavía están activas cuando no es apropiado.
- id: 389
  category: safe_driving_rules
  question: ¿Qué sucede si la banda de rodadura de su neumático queda por debajo de
    la cantidad segura indicada por la "prueba del centavo" (penny test)?
  choices:
    A: La capacidad de su automóvil para agarrarse a la carretera en condiciones adversas
      se reduce considerablemente
    B: Su vehículo reprobará automáticamente la prueba de emisiones
    C: Los neumáticos se inflarán excesivamente
    D: Su eficiencia de combustible aumentará significativamente
  answer: A
  explanation: El manual establece que si la banda de rodadura queda por debajo de
    la cantidad segura (donde la cabeza de Lincoln queda cubierta), la capacidad de
    su automóvil para agarrarse a la carretera en condiciones adversas se reduce considerablemente.
- id: 390
  category: driver_testing
  question: Al practicar la inspección previa al viaje con un padre, tutor o amigo,
    ¿cuáles son los requisitos para esa persona?
  choices:
    A: Debe ser un instructor de manejo certificado
    B: Debe tener una licencia válida y ser mayor de 21 años
    C: Debe ser el propietario del vehículo que se está inspeccionando
    D: Debe tener una licencia de conducir comercial (CDL)
  answer: B
  explanation: El manual aconseja practicar la inspección con un padre/tutor o amigo
    que tenga una licencia válida y sea mayor de 21 años.
- id: 391
  category: vehicle_information
  question: ¿Cuál es una consecuencia de la baja presión de los neumáticos o la falta
    de dibujo (banda de rodadura)?
  choices:
    A: Disminución de la distancia de frenado
    B: Aumento de la capacidad de giro
    C: Aumento del efecto de hidroplaneo (hydroplaning)
    D: Disminución de la probabilidad de un reventón
  answer: C
  explanation: La baja presión o la falta de dibujo aumentan el efecto de hidroplaneo,
    reducen la capacidad de giro y aumentan la probabilidad de un reventón debido
    a la acumulación excesiva de calor.
- id: 392
  category: vehicle_information
  question: ¿Qué debe hacer si solo una de sus luces de freno funciona cuando las
    prueba?
  choices:
    A: Continuar conduciendo siempre que una luz funcione.
    B: Reemplazar la bombilla o el fusible, o pedirle a un profesional que lo haga.
    C: Presionar el pedal del freno con más fuerza para activar la segunda luz.
    D: Usar las señales de giro para indicar que se está deteniendo.
  answer: B
  explanation: El manual establece que si un amigo no ve ambas luces de freno cuando
    usted pisa el pedal, debe reemplazar la bombilla o el fusible, o pedirle a un
    profesional que lo haga.
- id: 393
  category: driver_testing
  question: Al practicar para la prueba de habilidades básicas de control del vehículo,
    ¿qué edad debe tener el padre, tutor o amigo con licencia que lo acompaña?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: El manual instruye a los conductores a practicar estos ejercicios con
    un padre/tutor o amigo que tenga la licencia adecuada y sea mayor de 21 años.
- id: 394
  category: driver_testing
  question: Durante la prueba de habilidades básicas de control, ¿qué constituye un
    error de "retroceso" (reversal)?
  choices:
    A: Detenerse sin cambiar de dirección.
    B: Mirar por encima del hombro mientras retrocede.
    C: No usar la señal de giro al retroceder.
    D: Detenerse y cambiar de dirección para obtener una mejor posición.
  answer: D
  explanation: Un retroceso se define como cuando usted se detiene y cambia de dirección
    para obtener una mejor posición. Detenerse sin cambiar de dirección no cuenta
    como un retroceso.
- id: 395
  category: driver_testing
  question: ¿Qué parte de su vehículo puede tocar o cruzar una línea de límite de
    ejercicio o un cono sin que se considere una infracción de límite (encroachment)?
  choices:
    A: Los neumáticos
    B: Los parachoques
    C: Los espejos del vehículo
    D: El tubo de escape
  answer: C
  explanation: Tocar o cruzar una línea de límite de ejercicio o un cono con cualquier
    parte de su vehículo, que no sean los espejos del vehículo, se considera una infracción
    de límite.
- id: 396
  category: driver_testing
  question: Si su señal de giro se cancela automáticamente mientras realiza un ejercicio
    de habilidades básicas de control, ¿qué debe hacer?
  choices:
    A: Dejarla apagada ya que el examinador ya la vio.
    B: Reactivarla cuando sea necesario.
    C: Usar señales manuales en su lugar.
    D: Detener el vehículo y reiniciar el ejercicio.
  answer: B
  explanation: El manual establece que si su señal de giro se cancela automáticamente
    durante un ejercicio, debe asegurarse de reactivarla cuando sea necesario.
- id: 397
  category: driver_testing
  question: Al realizar un ejercicio de estacionamiento en paralelo, ¿qué tan cerca
    debe colocar el vehículo del lado de la acera del espacio?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 12 pulgadas
    C: A menos de 18 pulgadas
    D: A menos de 24 pulgadas
  answer: B
  explanation: Tanto para el estacionamiento en paralelo del lado derecho como del
    izquierdo, debe colocar el vehículo a menos de 12 pulgadas del lado de la acera
    del espacio sin cruzar los límites.
- id: 398
  category: safe_driving_rules
  question: Al detenerse detrás de otro vehículo en una intersección o antes de un
    giro, ¿qué se considera un espacio seguro?
  choices:
    A: El largo de un automóvil
    B: El largo de dos automóviles
    C: Detenerse donde pueda ver los neumáticos traseros del vehículo que está delante
      de usted
    D: Detenerse donde pueda ver la cara del conductor en su espejo retrovisor
  answer: C
  explanation: Un espacio seguro al detenerse detrás de otro vehículo es detenerse
    donde pueda ver los neumáticos traseros del vehículo que está delante de usted.
- id: 399
  category: safe_driving_rules
  question: Si debe detenerse antes de realizar un giro, ¿cómo debe posicionar sus
    ruedas delanteras mientras espera?
  choices:
    A: Giradas ligeramente hacia la derecha
    B: Giradas ligeramente hacia la izquierda
    C: Apuntando recto hacia adelante
    D: Giradas en la dirección del giro previsto
  answer: C
  explanation: El manual establece que si debe detenerse antes de realizar un giro,
    debe mantener las ruedas delanteras apuntando recto hacia adelante.
- id: 400
  category: safe_driving_rules
  question: ¿Qué regla se aplica al cambiar de carril mientras se conduce a través
    de una intersección?
  choices:
    A: Puede cambiar de carril si usa una señal de giro.
    B: Puede cambiar de carril si la intersección está despejada.
    C: No cambie de carril mientras avanza por la intersección.
    D: Debe cambiar al carril del extremo derecho mientras está en la intersección.
  answer: C
  explanation: 'Al conducir a través de una intersección, el manual establece explícitamente:
    "No cambie de carril mientras avanza por la intersección".'
- id: 401
  category: safe_driving_rules
  question: Después de completar un giro o pasar por una intersección con múltiples
    carriles, ¿a qué carril debe cambiarse cuando sea seguro hacerlo?
  choices:
    A: El carril más a la izquierda
    B: El carril central
    C: El carril más a la derecha
    D: El carril con el tráfico más rápido
  answer: C
  explanation: Después de un giro o intersección, debe revisar sus puntos ciegos y
    espejos, y cambiarse al carril más a la derecha cuando sea seguro hacerlo (si
    aún no está allí).
- id: 402
  category: driver_testing
  question: En un ejercicio de giro de dos puntos hacia adelante (Forward Two-point
    Turnabout), después de avanzar hacia una entrada o callejón, ¿cuál es el siguiente
    paso?
  choices:
    A: Retroceder el vehículo hacia la izquierda hacia la calle.
    B: Retroceder el vehículo hacia la derecha hacia la calle.
    C: Realizar un giro en U dentro del callejón.
    D: Conducir hacia adelante a través del callejón hasta la siguiente calle.
  answer: B
  explanation: En el giro de dos puntos hacia adelante, usted avanza hacia una entrada
    o callejón y luego retrocederá el vehículo hacia la derecha hacia la calle.
- id: 403
  category: driver_testing
  question: ¿Cuál es el primer paso para realizar un giro de dos puntos en reversa
    (Reverse Two-point Turnabout)?
  choices:
    A: Conducir hacia adelante en la entrada o callejón.
    B: Conducir más allá de la entrada de una entrada o callejón.
    C: Retroceder directamente hacia la intersección más cercana.
    D: Realizar un giro de tres puntos en medio de la carretera.
  answer: B
  explanation: Para un giro de dos puntos en reversa, se le pide que conduzca más
    allá de la entrada de una entrada o callejón y luego retroceda hacia la derecha
    hacia la calle o el callejón.
- id: 404
  category: driver_testing
  question: Durante el examen de conducción en carretera, ¿cuál de las siguientes
    afirmaciones es verdadera con respecto a las instrucciones del examinador?
  choices:
    A: El examinador intentará engañarlo para que realice una maniobra ilegal.
    B: Se le pedirá que conduzca de manera insegura para probar sus reflejos.
    C: Las instrucciones se darán con tiempo suficiente para hacer lo que el examinador
      ha pedido.
    D: El examinador no le dará ninguna instrucción hasta el último segundo.
  answer: C
  explanation: 'El manual establece: ''Se le darán instrucciones para que tenga tiempo
    suficiente para hacer lo que el examinador le ha pedido. No se le pedirá que conduzca
    de manera insegura''.'
- id: 405
  category: driver_testing
  question: Durante la prueba de habilidades de control básico, ¿cuándo debe realizar
    las revisiones de cabeza y de tráfico?
  choices:
    A: Solo cuando el examinador se lo recuerde explícitamente.
    B: Antes de entrar o salir de una calzada o área de ejercicio.
    C: Solo al retroceder.
    D: Solo al estacionar en paralelo.
  answer: B
  explanation: Al realizar un ejercicio, es importante revisar el tráfico antes de
    entrar o salir de una calzada. Debe asegurarse de que la calzada esté despejada
    antes de volver a entrar al tráfico o salir del área de ejercicio.
- id: 406
  category: driver_testing
  question: ¿Qué sucede si no maniobra el vehículo hasta su posición final exacta
    según las instrucciones del examinador durante un ejercicio de habilidades?
  choices:
    A: Reprobará automáticamente todo el examen.
    B: Se añadirán puntos a su puntuación.
    C: Se le pedirá que repita el ejercicio hasta que lo haga correctamente.
    D: El examinador tomará el control del volante.
  answer: B
  explanation: 'Bajo la sección de calificación de ''Posición Final'', se establece:
    ''Si no maniobra el vehículo hasta su posición final como lo describió el examinador,
    se añadirán puntos a su puntuación''.'
- id: 407
  category: safe_driving_rules
  question: ¿Se le permite cambiar de carril mientras atraviesa una intersección?
  choices:
    A: Sí, si utiliza una señal de giro.
    B: Sí, si el carril está libre de tráfico.
    C: No, no debe intentar cambios de carril en las intersecciones.
    D: Solo cuando se esté preparando para realizar un giro a la derecha.
  answer: C
  explanation: 'El manual establece: ''No cambie de carril mientras atraviesa la intersección''
    y ''No intente cambios de carril en las intersecciones''.'
- id: 408
  category: safe_driving_rules
  question: Al entrar en una autopista, ¿cuál de las siguientes acciones debe evitar?
  choices:
    A: Usar su señal de giro.
    B: Revisar sus puntos ciegos mirando por encima del hombro.
    C: Detenerse o cruzar cualquier línea sólida pintada.
    D: Aumentar su velocidad para incorporarse suavemente.
  answer: C
  explanation: Al entrar en una autopista, debe incorporarse suavemente al carril
    de tráfico adecuado sin detenerse ni cruzar ninguna línea sólida pintada.
- id: 409
  category: vehicle_operation
  question: Al acercarse a una curva, ¿cuándo es el mejor momento para reducir la
    velocidad?
  choices:
    A: Mientras está en medio de la curva.
    B: Antes de entrar en la curva.
    C: Después de haber salido de la curva.
    D: Debe acelerar a través de la curva en lugar de frenar.
  answer: B
  explanation: Antes de entrar en la curva, debe reducir su velocidad para que no
    sea necesario frenar más mientras esté en la curva.
- id: 410
  category: driver_testing
  question: ¿Cuál es la posición adecuada de las manos en el volante durante el examen
    de carretera?
  choices:
    A: Una mano en el volante y otra en la palanca de cambios.
    B: Ambas manos en los radios interiores del volante.
    C: Ambas manos en la parte exterior del volante en todo momento.
    D: Una mano en la posición de las 12 en punto.
  answer: C
  explanation: Debe mantener ambas manos en la parte exterior del volante en todo
    momento, a menos que esté utilizando otros controles. Tanto el método de mano
    sobre mano como el de mano a mano son aceptables.
- id: 411
  category: safe_driving_rules
  question: ¿En qué carril debe terminar el giro al completar una vuelta a la derecha
    en una carretera de varios carriles?
  choices:
    A: El carril más a la izquierda.
    B: El carril central.
    C: Cualquier carril que esté libre.
    D: El carril más a la derecha (junto a la acera).
  answer: D
  explanation: De acuerdo con las reglas de uso adecuado de los carriles, debe terminar
    un giro a la derecha en el carril más a la derecha (junto a la acera).
- id: 412
  category: defensive_driving
  question: Al detenerse detrás de otro vehículo en una intersección, ¿cuánto espacio
    debe dejar?
  choices:
    A: Exactamente la longitud de un automóvil.
    B: Espacio suficiente para ver las ruedas traseras del vehículo que está delante
      de usted.
    C: De tres a cuatro pies de espacio.
    D: Espacio suficiente para ver la cabeza del conductor en su espejo retrovisor.
  answer: B
  explanation: Al detenerse detrás de otro vehículo, asegúrese de poder ver las ruedas
    traseras del vehículo que tiene delante para mantener una distancia segura.
- id: 413
  category: driver_testing
  question: ¿Cuál de las siguientes acciones resultará en una reprobación automática
    en su examen de manejo?
  choices:
    A: Pedirle al examinador que repita una instrucción.
    B: Usar el método de dirección de manos cruzadas.
    C: No revisar sus puntos ciegos.
    D: Frenar suavemente en una señal de alto.
  answer: C
  explanation: No revisar sus puntos ciegos durante el examen de manejo se considera
    una causa de reprobación automática.
- id: 414
  category: driver_testing
  question: 'Durante el examen de manejo, subir su vehículo a las aceras o bordillos
    innecesariamente resultará en:'
  choices:
    A: Una advertencia del examinador.
    B: Una deducción de dos puntos.
    C: Una reprobación automática.
    D: El requisito de repetir la maniobra.
  answer: C
  explanation: Subir el vehículo a las aceras o bordillos innecesariamente es una
    causa de reprobación automática en el examen de manejo.
- id: 415
  category: defensive_driving
  question: Si una sola persona realizará toda la conducción en un viaje, ¿cuál es
    el límite diario de conducción recomendado?
  choices:
    A: De 4 a 5 horas.
    B: De 6 a 8 horas.
    C: De 10 a 11 horas.
    D: De 12 a 14 horas.
  answer: B
  explanation: Si una sola persona va a realizar toda la conducción, se debe considerar
    como límite de 6 a 8 horas de manejo en un solo día.
- id: 416
  category: defensive_driving
  question: 'Cuando dos o más personas pueden compartir la conducción en un viaje,
    el tiempo total de conducción en un día no debe exceder:'
  choices:
    A: De 8 a 9 horas.
    B: De 10 a 11 horas.
    C: De 14 a 15 horas.
    D: De 16 a 18 horas.
  answer: B
  explanation: Cuando dos o más personas pueden compartir la conducción, el tiempo
    total de manejo no debe exceder las 10 a 11 horas.
- id: 417
  category: defensive_driving
  question: Al conducir por autopistas principales, ¿con qué frecuencia debe tomar
    un descanso de 10 a 15 minutos?
  choices:
    A: Cada hora.
    B: Cada 2 a 3 horas.
    C: Cada 4 a 5 horas.
    D: Solo cuando necesite cargar combustible.
  answer: B
  explanation: El manual recomienda tomar descansos de 10 a 15 minutos cada 2 a 3
    horas cuando se conduce por autopistas principales.
- id: 418
  category: safe_driving_rules
  question: Al detenerse en una señal de alto o semáforo, ¿dónde debe detener su vehículo?
  choices:
    A: Sobre la línea de parada marcada para poder ver el tráfico transversal.
    B: Dentro del paso de peatones.
    C: Antes de la línea de parada marcada, el paso de peatones o la acera.
    D: Ligeramente dentro de la intersección.
  answer: C
  explanation: Al detenerse en una señal de alto o semáforo, no se detenga sobre una
    línea de parada marcada, paso de peatones, acera u otra marca, y no se detenga
    dentro de la intersección.
- id: 419
  category: defensive_driving
  question: Según el manual, ¿después de qué hora es más propenso a quedarse dormido
    mientras conduce?
  choices:
    A: 8 p.m.
    B: 9 p.m.
    C: 10 p.m.
    D: 11 p.m.
  answer: D
  explanation: Debe evitar conducir después del anochecer cuando la visibilidad es
    limitada y, particularmente, después de las 11 p.m., cuando es más propenso a
    quedarse dormido al volante.
- id: 420
  category: vehicle_operation
  question: ¿Qué es un 'head check' (revisión con la cabeza) al prepararse para cambiar
    de carril?
  choices:
    A: Mirar por el espejo retrovisor.
    B: Mirar por encima del hombro para revisar sus puntos ciegos.
    C: Asentir con la cabeza al examinador antes de girar.
    D: Revisar los indicadores del tablero.
  answer: B
  explanation: Un 'head check' consiste en revisar sus puntos ciegos mirando por encima
    del hombro antes de cambiar de carril o incorporarse al tráfico.
- id: 421
  category: safe_driving_rules
  question: ¿Cuándo es legal usar neumáticos para nieve con clavos en Kansas?
  choices:
    A: Del 1 de octubre al 1 de marzo
    B: Del 1 de noviembre al 1 de abril
    C: Del 1 de diciembre al 31 de marzo
    D: Son legales durante todo el año
  answer: B
  explanation: Según el manual, los neumáticos para nieve con clavos solo son legales
    desde el 1 de noviembre hasta el 1 de abril.
- id: 422
  category: vehicle_information
  question: En vehículos con tracción delantera, ¿dónde es mejor instalar neumáticos
    para nieve o neumáticos "para todas las estaciones"?
  choices:
    A: Solo en las ruedas delanteras
    B: Solo en las ruedas traseras
    C: En las cuatro ruedas
    D: Solo en las ruedas del lado derecho
  answer: C
  explanation: El manual establece que en los vehículos con tracción delantera, lo
    mejor es colocar neumáticos para nieve o neumáticos "para todas las estaciones"
    en las cuatro ruedas, no solo en las delanteras.
- id: 423
  category: defensive_driving
  question: Cuando comienza a caer aguanieve, lluvia helada o nieve, ¿qué áreas de
    la carretera es probable que se congelen primero?
  choices:
    A: Intersecciones y pasos de peatones
    B: Puentes, rampas y pasos elevados
    C: Túneles y pasos subterráneos
    D: Caminos de tierra y grava
  answer: B
  explanation: Cuando comienza a caer aguanieve, lluvia helada o nieve, recuerde que
    es probable que los puentes, las rampas y los pasos elevados se congelen primero.
- id: 424
  category: safe_driving_rules
  question: Si se queda varado en clima frío, ¿cómo debe operar el motor y la calefacción
    de su vehículo para mantenerse caliente?
  choices:
    A: Mantener el motor encendido continuamente hasta que llegue ayuda
    B: Encender el motor durante aproximadamente 10 minutos cada hora
    C: Encender el motor durante 30 minutos cada dos horas
    D: No encender el motor en absoluto para ahorrar combustible
  answer: B
  explanation: El manual recomienda encender el motor durante aproximadamente 10 minutos
    cada hora para cargar la batería y calentar el interior.
- id: 425
  category: safe_driving_rules
  question: ¿Por qué es fundamental mantener el tubo de escape libre de nieve y escombros
    si se queda varado en un vehículo?
  choices:
    A: Para evitar que el motor se sobrecaliente
    B: Para evitar que la batería se agote
    C: Para evitar que los gases de escape se filtren en el vehículo y causen envenenamiento
      por monóxido de carbono
    D: Para asegurar que la calefacción sople aire caliente en lugar de aire frío
  answer: C
  explanation: Mantenga el tubo de escape libre de nieve y escombros porque los gases
    del escape pueden filtrarse en el vehículo y pueden causar que pierda el conocimiento
    o incluso provocar la muerte.
- id: 426
  category: vehicle_information
  question: ¿Con qué frecuencia debe inspeccionar sus neumáticos cuando conduce en
    clima muy caluroso?
  choices:
    A: Cada hora o cada 50 millas
    B: Cada dos horas o cada 100 millas
    C: Cada cuatro horas o cada 200 millas
    D: Solo cuando se detenga a cargar combustible
  answer: B
  explanation: Al conducir en clima caluroso, debe inspeccionar los neumáticos cada
    dos horas o cada 100 millas.
- id: 427
  category: vehicle_information
  question: ¿Qué debe hacer si la presión de sus neumáticos aumenta mientras conduce
    en clima caluroso?
  choices:
    A: Dejar salir un poco de aire para evitar un reventón
    B: No deje salir aire, o la presión será demasiado baja cuando los neumáticos
      se enfríen
    C: Verter agua fría sobre los neumáticos para reducir la presión
    D: Conducir más rápido para enfriar los neumáticos con la resistencia del viento
  answer: B
  explanation: La presión del aire aumenta con la temperatura. No deje salir aire
    o la presión será demasiado baja cuando los neumáticos se enfríen.
- id: 428
  category: defensive_driving
  question: ¿Qué peligro específico en la carretera debe vigilar en el pavimento durante
    el clima muy caluroso?
  choices:
    A: Alquitrán exudado que puede ser muy resbaladizo
    B: Hormigón en expansión que causa grandes bultos
    C: Líneas pintadas que se derriten y oscurecen los carriles
    D: Aumento del resplandor del asfalto seco
  answer: A
  explanation: El alquitrán en el pavimento de la carretera frecuentemente sube a
    la superficie en climas muy calurosos. Los puntos donde el alquitrán "exuda" hacia
    la superficie pueden ser muy resbaladizos.
- id: 429
  category: defensive_driving
  question: ¿Qué debe hacer si ve un tornado mientras conduce?
  choices:
    A: Buscar refugio bajo el puente o paso elevado más cercano
    B: Permanecer en su vehículo y estacionarse en el arcén
    C: Salir del vehículo para buscar un refugio resistente o conducir fuera de la
      trayectoria del tornado
    D: Conducir hacia el centro del tornado para atravesarlo rápidamente
  answer: C
  explanation: Si ve un tornado, salga del vehículo para buscar un refugio resistente
    o conduzca fuera de la trayectoria del tornado. Los vehículos son fácilmente lanzados
    y destruidos.
- id: 430
  category: defensive_driving
  question: ¿Por qué debe evitar buscar refugio debajo de puentes o pasos elevados
    durante un tornado?
  choices:
    A: Atraen la caída de rayos
    B: Los vientos serán más fuertes debajo del paso elevado debido a un "efecto de
      túnel de viento"
    C: Es probable que colapsen debido a la lluvia
    D: Bloquean la vista de los vehículos de emergencia que se aproximan
  answer: B
  explanation: Evite buscar refugio debajo de puentes o pasos elevados porque los
    vientos serán más fuertes debajo del paso elevado debido a un "efecto de túnel
    de viento" y brindan poca protección contra objetos voladores.
- id: 431
  category: safe_driving_rules
  question: ¿Cuál es la forma más segura de protegerse en un vehículo durante una
    tormenta eléctrica?
  choices:
    A: Conducir un convertible con la capota bajada
    B: Estacionarse debajo de un árbol alto
    C: Permanecer en un vehículo de techo rígido con todas las puertas cerradas y
      las ventanas subidas
    D: Usar una radio conectada a una antena externa para monitorear el clima
  answer: C
  explanation: Solo un vehículo de techo rígido le protegerá en una tormenta eléctrica.
    Asegúrese de que todas las puertas estén cerradas y las ventanas subidas, y no
    toque ninguna superficie metálica.
- id: 432
  category: defensive_driving
  question: Si su vehículo queda atrapado en una inundación y no puede abrir la puerta
    ni la ventana lateral, ¿cuál es el método de escape recomendado?
  choices:
    A: Esperar a que el agua retroceda por completo
    B: Tomar aire, romper la ventana de una patada, ir a la bolsa de aire para tomar
      un último respiro y escapar
    C: Encender la calefacción para evaporar el agua
    D: Tocar la bocina continuamente hasta que alguien abra la puerta desde el exterior
  answer: B
  explanation: Si no puede abrir una ventana lateral, tome aire y rompa la ventana
    de una patada. Diríjase a la bolsa de aire para tomar un último respiro y luego
    escape.
- id: 433
  category: license_system
  question: Si usted es titular de una licencia comercial y necesita actualizar su
    dirección, ¿qué debe hacer?
  choices:
    A: Visitar cualquier oficina de correos local
    B: Contactar únicamente al Tesorero del Condado local
    C: Visitar cualquier oficina de licencias de conducir de Kansas de servicio completo
    D: Actualizar su dirección en línea usando ikan.ks.gov
  answer: C
  explanation: 'El manual establece: ''Si usted es titular de una licencia comercial,
    deberá visitar cualquier oficina de licencias de conducir de Kansas de servicio
    completo''.'
- id: 434
  category: driver_responsibility
  question: Bajo la ley de Consentimiento de Primera Persona de Kansas, ¿quién puede
    revocar la decisión de un individuo de ser donante de órganos si el individuo
    tiene al menos 18 años?
  choices:
    A: Su cónyuge
    B: Sus padres
    C: Su médico
    D: Nadie más puede revocar esa decisión
  answer: D
  explanation: El cambio al consentimiento de primera persona significa que la decisión
    de un individuo de donar es legalmente vinculante, y nadie más puede revocar esa
    decisión si el individuo tiene al menos 18 años.
- id: 435
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la donación
    de órganos y tejidos en Kansas?
  choices:
    A: Un funeral con ataúd abierto no es posible para los donantes
    B: La familia del donante debe pagar una tarifa por el proceso de donación
    C: Se considera a personas de todas las edades e historias clínicas para una posible
      donación
    D: Las principales religiones generalmente se oponen a la donación de órganos
  answer: C
  explanation: El manual establece que se considera a personas de todas las edades
    e historias clínicas para una posible donación. También señala que los funerales
    con ataúd abierto son posibles, no hay costo para la familia por la donación y
    todas las religiones principales la aprueban.
- id: 436
  category: driver_responsibility
  question: ¿Cuánto le cuesta a la familia o al patrimonio del donante la donación
    de órganos y tejidos?
  choices:
    A: Una tarifa fija de $500
    B: Depende de los órganos donados
    C: No tiene costo
    D: El patrimonio paga un porcentaje de las facturas médicas
  answer: C
  explanation: 'El manual establece: "No hay costo para la familia o el patrimonio
    del donante por la donación de órganos y tejidos".'
- id: 437
  category: driver_responsibility
  question: ¿Quién es responsable de pagar los gastos funerarios de un donante de
    órganos y tejidos?
  choices:
    A: El registro estatal
    B: El hospital
    C: La familia del donante
    D: El receptor del órgano
  answer: C
  explanation: Según el manual, "Los gastos funerarios siguen siendo responsabilidad
    de la familia".
- id: 438
  category: driver_responsibility
  question: ¿Es posible ser donante de órganos y tejidos estando aún con vida?
  choices:
    A: No, la donación solo es posible después de la muerte
    B: Sí, la donación en vida es posible
    C: Solo para la donación de tejidos
    D: Solo para miembros de la familia
  answer: B
  explanation: 'El manual establece explícitamente: "La donación en vida es posible".'
- id: 439
  category: driver_responsibility
  question: ¿Qué sitio web debe visitar para inscribirse directamente en el registro
    estatal de donantes de órganos de Kansas?
  choices:
    A: https://www.mwtn.org/
    B: https://www.donatelifekansas.com/
    C: https://www.kansas.gov/donor
    D: https://www.ksrevenue.org/
  answer: B
  explanation: 'El manual indica: "Para inscribirse directamente en el registro estatal,
    visite https://www.donatelifekansas.com/"'
- id: 440
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los aspectos
    financieros de la donación de órganos?
  choices:
    A: La familia debe pagar por el procedimiento de donación.
    B: Se exoneran los gastos funerarios para los donantes de órganos.
    C: No hay costo para el patrimonio del donante por la donación.
    D: El estado cubre todos los gastos funerarios.
  answer: C
  explanation: El manual establece que "No hay costo para la familia o el patrimonio
    del donante por la donación de órganos y tejidos".
- id: 441
  category: driver_responsibility
  question: ¿Qué sitio web se proporciona en el manual para obtener información más
    general sobre la donación de órganos y tejidos?
  choices:
    A: https://www.mwtn.org/
    B: https://www.donatelifekansas.com/
    C: https://www.organdonor.gov/
    D: https://www.ksdot.org/
  answer: A
  explanation: 'El manual establece: "Para obtener más información, visite nuestro
    sitio web en https://www.mwtn.org/".'
- id: 442
  category: driver_responsibility
  question: 'Complete el eslogan de donación de órganos que se encuentra en el manual:
    "COMPARTE TU VIDA. COMPARTE TU..."'
  choices:
    A: ÓRGANOS.
    B: DECISIÓN.
    C: FUTURO.
    D: AMOR.
  answer: B
  explanation: 'El manual incluye el texto promocional: "COMPARTE TU VIDA. COMPARTE
    TU DECISIÓN".'
- id: 443
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una afirmación falsa sobre la donación de órganos
    y tejidos según el manual?
  choices:
    A: La donación en vida es posible.
    B: Los gastos funerarios siguen siendo responsabilidad de la familia.
    C: El patrimonio del donante debe pagar una tarifa por la donación de tejidos.
    D: Puede inscribirse en el registro estatal en línea.
  answer: C
  explanation: 'La afirmación de que el patrimonio debe pagar una tarifa es falsa.
    El manual establece: "No hay costo para la familia o el patrimonio del donante
    por la donación de órganos y tejidos".'
- id: 444
  category: driver_responsibility
  question: 'Complete la siguiente frase de la sección de donación de órganos: "VÍVELO.
    DANLO. ..."'
  choices:
    A: HOY.
    B: LIBREMENTE.
    C: VIDA.
    D: ESPERANZA.
  answer: C
  explanation: 'El manual incluye el eslogan: "VÍVELO. DANLO. VIDA".'
- id: 445
  category: driver_responsibility
  question: Si una persona decide convertirse en donante de órganos, ¿qué sucede con
    sus gastos funerarios?
  choices:
    A: Son pagados por la organización de obtención de órganos.
    B: Siguen siendo responsabilidad de la familia.
    C: Son cubiertos por el estado de Kansas.
    D: Se dividen entre la familia y el hospital.
  answer: B
  explanation: 'El manual establece claramente: "Los gastos funerarios siguen siendo
    responsabilidad de la familia".'
- id: 446
  category: driver_responsibility
  question: Una familia está preocupada de que aceptar la donación de órganos agote
    el patrimonio del difunto. ¿Qué establece el manual?
  choices:
    A: Al patrimonio se le cobrará una tarifa médica estándar.
    B: Al patrimonio solo se le cobra si se donan varios órganos.
    C: No hay costo para el patrimonio del donante por la donación de órganos y tejidos.
    D: El patrimonio debe cubrir los costos quirúrgicos.
  answer: C
  explanation: El manual asegura que "No hay costo para la familia o el patrimonio
    del donante por la donación de órganos y tejidos".
- id: 447
  category: driver_responsibility
  question: ¿Qué tipo de donación establece explícitamente el manual que es posible
    además de la donación tras el fallecimiento?
  choices:
    A: Donación en vida
    B: Donación financiera
    C: Solo donación anónima
    D: Solo donación fuera del estado
  answer: A
  explanation: 'El texto señala explícitamente: "La donación en vida es posible".'
- id: 448
  category: driver_responsibility
  question: Según el manual, ¿qué dos cosas se le anima a "COMPARTIR" con respecto
    a la donación de órganos?
  choices:
    A: Su riqueza y su tiempo
    B: Su vida y su decisión
    C: Su salud y sus órganos
    D: Su elección y su familia
  answer: B
  explanation: 'El manual concluye con las líneas: "COMPARTE TU VIDA. COMPARTE TU
    DECISIÓN".'
- id: 449
  category: driver_responsibility
  question: ¿Cuál de los siguientes costos NO está cubierto por el proceso de donación
    de órganos y tejidos?
  choices:
    A: El costo de la recuperación de órganos
    B: El costo de la recuperación de tejidos
    C: Gastos funerarios
    D: El costo para el patrimonio del donante
  answer: C
  explanation: Si bien no hay costo para la familia o el patrimonio por la donación
    en sí, el manual especifica que "Los gastos funerarios siguen siendo responsabilidad
    de la familia".
- id: 450
  category: driver_responsibility
  question: ¿Cómo puede un residente de Kansas inscribirse directamente en el registro
    estatal de donantes de órganos?
  choices:
    A: Visitando https://www.donatelifekansas.com/
    B: Llamando al departamento de policía local
    C: Visitando https://www.mwtn.org/
    D: Escribiendo una carta al gobernador
  answer: A
  explanation: 'El manual establece: "Para inscribirse directamente en el registro
    estatal, visite https://www.donatelifekansas.com/".'
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que se aproxima
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 451
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 452
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 453
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una calle de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 454
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 455
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 456
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 457
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 458
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro con forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 459
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Giro a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 460
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 461
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 462
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 463
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 464
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 465
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los pasos a nivel. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 466
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 467
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 468
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 469
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 470
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica este letrero que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 471
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la vía y ajuste
    su posición en el carril.
  id: 472
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 473
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 474
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 475
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 476
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente empinada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente empinada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 477
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 478
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 479
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las carreteras
    laterales.
  id: 480
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 481
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está agregando un carril nuevo; no es necesario incorporarse
    D: Se requiere girar a la derecha
  answer: C
  explanation: Una señal de carril adicional significa que un nuevo carril se une
    a la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 482
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse o permanecer con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 483
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
