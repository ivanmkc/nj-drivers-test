- id: 111
  category: driver_responsibility
  question: 郵送で車両登録更新の通知（リマインダー）を受け取らない可能性がある理由は、次のうちどれですか？
  choices:
    A: 3回以上の駐車違反切符に対応していない。
    B: 車両のモデル年式が10年以上前である。
