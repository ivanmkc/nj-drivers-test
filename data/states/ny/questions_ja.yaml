  question: ニューヨーク市における赤信号での右左折のルールは何ですか？
  choices:
    A: 完全に停止した後であれば、赤信号で右折できる
    B: 午後10時から午前6時の間に限り、赤信号で右左折できる
    C: 許可する標識が掲示されていない限り、赤信号での右左折は禁止されている
    D: 一方通行の道路から別の一方通行の道路へであれば、赤信号で左折できる
  answer: C
  explanation: マニュアルには明確に次のように記載されています。「許可する標識が掲示されていない限り、ニューヨーク市では赤信号での右左折は禁止されています。」
- id: 131
  category: vehicle_information
  question: ニューヨーク州に引っ越してきた場合、以前の州外の車両検査証明書（車検）はどのくらいの期間有効ですか？
  choices:
    A: ニューヨークで車両を登録してから30日間
    B: 有効期限が切れるか、発行日から1年が経過するかの、どちらか早い方まで
    C: 無効であるため、直ちに車両検査を受けなければならない
    D: 居住権を確立した日から6ヶ月間
  answer: B
  explanation: ニューヨーク州（NYS）に引っ越してきた場合、以前に発行された検査証明書は、有効期限が切れるか、発行日から1年が経過するかの、どちらか早い方まで有効です。
- id: 132
  category: vehicle_information
  question: オートバイの保険が解約されたり有効期限が切れたりした場合、ナンバープレートはどうしなければなりませんか？
  choices:
    A: 直ちにDMV（車両管理局）に返納する
    B: 保険会社に郵送する
    C: ナンバープレートを返納する必要はない
    D: プレートを破棄し、再保険加入時に新しいものを申請する
  answer: C
  explanation: マニュアルには次のように記載されています。「オートバイは保険に加入していなければなりませんが、オートバイの保険が解約されたり有効期限が切れたりしても、ナンバープレートを返納する必要はありません。」
- id: 133
  category: signs_and_signals
  question: 赤の点滅信号は何を意味しますか？
  choices:
    A: 信号機が故障しているため、注意して進む。
    B: 停止し、通行権を譲り、安全が確認できたら進む。
    C: 減速し、停止する準備をする。
    D: 右側のすべての交通に道を譲る。
  answer: B
  explanation: 赤の点滅信号は「止まれ（STOP）」の標識と同じ意味です。停止し、通行権を譲り、安全が確認できたら進んでください。
- id: 134
  category: signs_and_signals
  question: 高速道路の車線の上にある黄色の「X」の点滅信号は何を示していますか？
  choices:
    A: この車線を走行してはならない。
    B: 直ちにこの車線から移動する。
    C: この車線は左折にのみ使用できる。
    D: この車線は多人数乗車車両（HOV）専用である。
  answer: C
  explanation: 道路の上にある黄色の「X」の点滅は、その車線が左折にのみ使用できることを示しています。
- id: 135
  category: signs_and_signals
  question: 実線の路側帯の線（エッジライン）が道路の中央に向かって斜めになっている場合、何を示していますか？
  choices:
    A: この先、道路が狭くなっている。
    B: 料金所に近づいている。
    C: 制限速度が下がっている。
    D: 左車線に合流しなければならない。
  answer: A
  explanation: 道路の中央に向かって斜めになっている路側帯の線は、この先で道路が狭くなっていることを示しています。
- id: 136
  category: signs_and_signals
  question: 白色の車線と黄色の車線の違いは何ですか？
  choices:
    A: 白線は対向車線を区切り、黄線は同じ方向に進む車線を区切る。
    B: 白線は同じ方向に進む車線を区切り、黄線は対向車線を区切る。
    C: 白線は駐車区域を示し、黄線は駐車禁止区域を示す。
    D: 白線は高速道路で使用され、黄線は市街地の道路で使用される。
  answer: B
  explanation: 同じ方向に進む車線を区切る線は白色です。対向車線を区切る線は黄色です。
- id: 137
  category: safe_driving_rules
  question: 黄色の実線と黄色の破線が並んでいる道路を走行しており、自分が実線側にいる場合、何が許可されていますか？
  choices:
    A: 前方の道路がクリアであれば、他の車両を追い越すことができる。
    B: 私道へ左折して入る場合を除き、他の車両を追い越したり、線を越えたりすることはできない。
    C: 低速の農業用車両を追い越す場合にのみ、線を越えることができる。
    D: いかなる理由があっても、実線を越えることは絶対に許されない。
  answer: B
  explanation: 実線と破線の組み合わせ：自分が実線側にいる場合、私道へ左折して入る場合を除き、他の車両を追い越したり、線を越えたりすることはできません。
- id: 138
  category: safe_driving_rules
  question: 道路上の二重の実線を越えることが許可されるのはどのような場合ですか？
  choices:
    A: 制限速度以下で走行している車両を追い越す場合。
    B: 私道など、道路に出入りするために左折する必要がある場合。
    C: 前方の車両が歩行者のために停止している場合。
    D: いかなる状況でも、二重の実線を越えることは絶対に許されない。
  answer: B
  explanation: 二重の実線：追い越しや車線変更はできません。道路に出入りするための左折（例：私道への出入りやUターンなど）を除き、線を越えることはできません。
- id: 139
  category: signs_and_signals
  question: 道路上に描かれたひし形（ダイヤモンド）のマークは何を示していますか？
  choices:
    A: この先に横断歩道がある。
    B: その車線がバス、多人数乗車車両（HOV）、自転車、またはその他の特別車両専用である。
    C: この先で車線が終わり、合流しなければならない。
    D: 踏切に近づいている。
  answer: B
  explanation: ひし形のマークは、その車線がバス、相乗り（カープール）やバンプールなどの多人数乗車車両（HOV）、自転車、またはその他の特別車両専用であることを示しています。
- id: 140
  category: safe_driving_rules
  question: 交通警察官が赤信号を通過するように合図した場合、どうしなければなりませんか？
  choices:
    A: 停止し、信号が青になるのを待つ。
    B: 警察官の指示に従い、赤信号を通過する。
    C: 進む前にクラクションを鳴らして他の運転手に警告する。
    D: 信号が変わるまで道路の端に車を寄せる。
  answer: B
  explanation: 交通警察官による指示は、標識、信号、または路面標示よりも優先されます。警察官が赤信号や一時停止標識を通過するように合図した場合は、それに従わなければなりません。
- id: 141
  category: safe_driving_rules
  question: あなたと対向車線から接近してくる運転手が同時に交差点に到達し、あなたが左折、相手が直進しようとしている場合、どちらに優先権がありますか？
  choices:
    A: あなたが曲がるため、あなたに優先権がある。
    B: 直進する運転手に優先権がある。
    C: 先に交差点に入った方に優先権がある。
    D: 右側にいる運転手に優先権がある。
  answer: B
  explanation: 対向する方向から接近する運転手がほぼ同時に交差点に到達した場合、左折する運転手は直進または右折する車両に道を譲らなければなりません。
- id: 142
  category: defensive_driving
  question: 交差点内で左折を待っている間、車のタイヤ（前輪）はどの方向に向けておくべきですか？
  choices:
    A: 左折に備えてタイヤを左に向けておく。
    B: 交通の妨げにならないよう、タイヤを右に向けておく。
    C: 後方から追突された際に対向車線に押し出されるのを防ぐため、タイヤはまっすぐにしておく。
    D: タイヤの向きは関係ない。
  answer: C
  explanation: 交差点に進入する際は、センターラインの右側を維持します。後方から追突された際に対向車線に押し出されるのを防ぐため、タイヤはまっすぐにしておいてください。
- id: 143
  category: safe_driving_rules
  question: 標識や信号機のない交差点で、2人の運転手が直角に交わる道路から同時に到達した場合、どちらが道を譲らなければなりませんか？
  choices:
    A: 右側の運転手が左側の運転手に道を譲らなければならない。
    B: 左側の運転手が右側の運転手に道を譲らなければならない。
    C: 速度が速い運転手に優先権がある。
    D: 広い道路にいる運転手に優先権がある。
  answer: B
  explanation: 標識や信号機のない交差点、または2人以上の運転手が「止まれ（STOP）」の標識で同時に停止し、それらが直角に交わっている場合、左側の運転手は右側の運転手に優先権を譲らなければなりません。
- id: 144
  category: signs_and_signals
  question: 車線を区切る1本の実線は何を意味していますか？
  choices:
    A: いかなる状況でも追い越しや車線変更をしてはならない。
    B: ウインカーを出せば、自由に追い越しや車線変更ができる。
    C: 追い越しや車線変更は可能だが、道路上の障害物や交通状況により必要な場合のみに限られる。
    D: その車線は緊急車両専用である。
  answer: C
  explanation: 1本の実線：他の車両を追い越したり車線変更したりすることはできますが、道路上の障害物や交通状況により必要な場合のみ行うことができます。
- id: 145
  category: safe_driving_rules
  question: 標識や信号機のない交差点で、2人の運転手が直角に交わる道路から同時に到達した場合、どちらが優先権を譲らなければなりませんか？
  choices:
    A: 右側の運転手が左側の運転手に道を譲らなければならない。
    B: 左側の運転手が右側の運転手に道を譲らなければならない。
    C: 速度が速い運転手に優先権がある。
    D: 左折する運転手に優先権がある。
  answer: B
  explanation: 標識や信号機のない交差点、または2人以上の運転手が「止まれ（STOP）」の標識で同時に停止し、それらが直角に交わっている場合、左側の運転手は右側の運転手に優先権を譲らなければなりません。
- id: 146
  category: safe_driving_rules
  question: 私有地の車道や駐車場から公道に出る際、何をしなければなりませんか？
  choices:
    A: クラクションを鳴らして車道に進入する。
    B: 左から接近してくる車両にのみ道を譲る。
    C: 一時停止し、車道上の車両や歩行者に優先権を譲る。
    D: 右折する場合は、停止せずに車道に合流する。
  answer: C
  explanation: 私有地の車道、私道、または公道以外の場所から公道に進入する車両は、一時停止し、車道上の車両や歩行者に優先権を譲らなければなりません。
- id: 147
  category: defensive_driving
  question: 交差点を通過したいが、反対側の交通が渋滞している場合、どうすべきですか？
  choices:
    A: 交差点に進入し、交通が流れるのを待つ。
    B: 交差点を塞がないよう、前方の交通が流れるまで待つ。
    C: ゆっくりと進み、無理やり車列に割り込む。
    D: 直進せずに右折する。
  answer: B
  explanation: 反対側の交通が渋滞しており、交差点を完全に通り抜けられない場合は、交差点に進入してはいけません。交差点を塞がないよう、前方の交通が流れるまで待ってください。
- id: 148
  category: safe_driving_rules
  question: 対面通行の道路で、対向車線を接近してくる緊急車両に対して車を寄せて停止する義務はありますか？
  choices:
    A: はい、車を寄せて停止しなければならない。
    B: いいえ、自分の車線を走行している場合のみである。
    C: いいえ、ただし減速しなければならない。
    D: はい、ただし物理的な中央分離帯がない場合のみである。
  answer: A
  explanation: 対面通行の道路で、緊急車両が対向車線をこちらに向かってきている場合でも、車を寄せて停止しなければなりません。
- id: 149
  category: defensive_driving
  question: 近くで緊急車両のサイレンが聞こえるが、その車両が正確にどこにいるかわからない場合、何をしなければなりませんか？
  choices:
    A: 現在の車線で直ちに停止する。
    B: 車両が見えるまで加速する。
    C: 安全に道路の右端に車を寄せて停止し、自分の方に向かってきていないことが確認できるまで待つ。
    D: ミラーを確認しながら制限速度で運転を続ける。
  answer: C
  explanation: 近くでサイレンやエアホーンが聞こえるが、緊急車両が正確にどこにいるかわからない場合は、安全に道路の右端に車を寄せて停止し、自分の方に向かってきていないことが確認できるまで待たなければなりません。
- id: 150
  category: safe_driving_rules
  question: 「ムーブ・オーバー法（Move Over Law）」に基づき、複数車線の高速道路で点滅するライトをつけて停止している緊急車両に接近する際、運転手は何をしなければなりませんか？
  choices:
    A: 緊急車両のすぐ横で直ちに停止する。
    B: 速度を維持したまま右側の路肩に移動する。
    C: 減速し、安全であれば緊急車両に隣接する車線から移動する。
    D: クラクションを鳴らして緊急作業員に警告する。
  answer: C
  explanation: 運転手はすべての道路において、そのような車両に遭遇した場合は減速しなければなりません。さらに、パークウェイ、州間高速道路、その他の複数車線があるアクセス制限道路では、交通状況やその他の危険により安全に行えない場合を除き、緊急車両やハザード車両（作業車両など）に隣接する車線から移動することが義務付けられています。
- id: 151
  category: signs_and_signals
  question: 自家用車で点滅する緑色のライトは何を示していますか？
  choices:
    A: 出動中のボランティア消防団員。
    B: ボランティアの救急隊員または救助隊員。
    C: 除雪車またはレッカー車。
    D: 地方の郵便配達車両。
  answer: B
  explanation: 出動中のボランティア消防団員が運転する自家用車には青色のライトの表示が許可されており、ボランティアの救急隊員または救助隊員が運転する自家用車には緑色のライトの表示が許可されています。
- id: 152
  category: sharing_the_road
  question: 点滅する青色のライトを表示している自家用車に対して、法的に道を譲る（優先権を譲る）義務はありますか？
  choices:
    A: はい、それらは認可された緊急車両とみなされるためです。
    B: はい、ただしサイレンも鳴らしている場合のみです。
    C: いいえ、しかし安全にできる場合は礼儀として道を譲るべきです。
    D: いいえ、常に速度と優先権を維持するべきです。
  answer: C
  explanation: 青色、緑色、または黄色のライトを表示している車両は、認可された緊急車両ではありません。その運転手はすべての交通法規に従わなければなりません。優先権を譲る義務はありませんが、安全にできる場合は礼儀として道を譲るべきです。
- id: 153
  category: safe_driving_rules
  question: 法律では、右左折または車線変更のどれくらい手前で合図を出すことが義務付けられていますか？
  choices:
    A: 少なくとも50フィート（15m）手前
    B: 少なくとも100フィート（30m）手前
    C: 少なくとも200フィート（60m）手前
    D: 少なくとも300フィート（90m）手前
  answer: B
  explanation: 法律により、右左折または車線変更を行う際は、少なくとも100フィート（30m）手前で方向指示器または手信号による合図を出すことが義務付けられています。
- id: 154
  category: defensive_driving
  question: 交差点で右左折の順番を待っている間、車輪をまっすぐにしておくべきなのはなぜですか？
  choices:
    A: パワーステアリングフルードの過熱を防ぐため。
    B: 信号が青になったときに、より速く加速できるため。
    C: 後ろから追突された場合、対向車線に押し出される可能性があるため。
    D: 歩行者があなたの車を見つけやすくなるため。
  answer: C
  explanation: 実際に右左折を始めるまでは、車輪をまっすぐにしておいてください。車輪を曲げた状態で後ろから追突されると、車が対向車線に押し出される危険があります。
- id: 155
  category: vehicle_information
  question: 右左折する際、後輪の軌道について何を覚えておくべきですか？
  choices:
    A: 前輪の軌道の外側を通る。
    B: 前輪の軌道の内側を通る。
    C: 前輪と全く同じ軌道を通る。
    D: 右左折中にブレーキをかけないとスリップする。
  answer: B
  explanation: 後輪は前輪の軌道の内側を通り、縁石（右折の場合）または対向車（左折の場合）に近づくことを覚えておいてください。
- id: 156
  category: sharing_the_road
  question: オートバイと他の車両が絡む事故の一般的な原因は何ですか？
  choices:
    A: オートバイの走行速度が遅すぎる。
    B: 他の車両の運転手がオートバイを見落とす。
    C: オートバイのヘッドライトが明るすぎる。
    D: オートバイが曲がる前に合図を出さない。
  answer: B
  explanation: オートバイと他の車両が絡む事故のほとんどは、他の車両の運転手がオートバイを見落としたことによって引き起こされます。
- id: 157
  category: safe_driving_rules
  question: 対面通行の道路から別の対面通行の道路へ左折する場合、どのように曲がり角に接近するべきですか？
  choices:
    A: 道路の一番右側の車線から。
    B: 道路の左半分から。
    C: 道路の右半分の中央線に最も近い位置から。
    D: 左折する前に右に大きく膨らんでから。
  answer: C
  explanation: 対面通行の道路から対面通行の道路へ左折する場合は、道路の右半分の中央線に最も近い位置から曲がり角に接近してください。
- id: 158
  category: safe_driving_rules
  question: どの車線からUターンすることが許可されていますか？
  choices:
    A: 右側の路肩。
    B: 一番右側の車線。
    C: 中央線に最も近い車線の左側部分。
    D: 対向車がいない限り、どの車線からでも。
  answer: C
  explanation: Uターンは、道路の中央線に最も近い車線の左側部分からのみ行うことができ、右側の車線から行うことは絶対にできません。
- id: 159
  category: penalties_and_points
  question: ムーブ・オーバー法（車線変更義務法）に違反した場合の罰則は何ですか？
  choices:
    A: 走行中の交通違反（ムービング・バイオレーション）として罰せられる。
    B: 自動的に免許停止となる。
    C: 重罪とみなされる。
    D: 罰則はなく、書面による警告のみである。
  answer: A
  explanation: この法律（ムーブ・オーバー法）の違反は、走行中の交通違反（ムービング・バイオレーション）として罰せられます。
- id: 160
  category: safe_driving_rules
  question: ニューヨーク州法によると、次のどの場所でUターンすることが厳しく禁止されていますか？
  choices:
    A: 狭い対面通行の道路
    B: スクールゾーン（学校周辺の区域）
    C: 左向きの緑色矢印信号がある交差点
    D: 住宅の私道
  answer: B
  explanation: マニュアルには、スクールゾーン、アクセス制限のある高速道路、およびニューヨーク市のビジネス街での車両のUターンは禁止されていると記載されています。
- id: 161
  category: safe_driving_rules
  question: 丘やカーブの近くで合法的にUターンをするためには、他のドライバーからあなたの車がどれくらい離れた距離から見える必要がありますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: 丘の頂上付近、カーブ、または他のドライバーがどちらの方向からも500フィート（150 m）離れた場所からあなたの車を見ることができない場所では、Uターンをすることはできません。
- id: 162
  category: safe_driving_rules
  question: スリーポイントターン（方向転換）を行う際、最初に取らなければならないステップは何ですか？
  choices:
    A: 左に合図を出し、道路を横切るようにハンドルを切る
    B: ハンドルを右いっぱいに切る
    C: 右折の合図を出し、右側に寄せて停止する
    D: 車内のルームミラーを確認して後退する
  answer: C
  explanation: スリーポイントターンを行うための最初のステップは、右折の合図を出し、右側に寄せて停止することです。
- id: 163
  category: sharing_the_road
  question: オートバイを追い越す際、安全を確保するために何をしなければなりませんか？
  choices:
    A: 車線が十分に広い場合は車線を共有する
    B: 他の車両と同じように、オートバイにも車線幅全体を割り当てる
    C: 右側からのみ追い越す
    D: 相手の車線スペースに入る前にクラクションを鳴らす
  answer: B
  explanation: オートバイを追い越す際は、他の車両に許可されているのと同じように、オートバイにも車線幅全体を割り当てることを忘れないでください。オートバイと同じ車線スペースには絶対に入らないでください。
- id: 164
  category: safe_driving_rules
  question: 車線変更の意思を示すために、どれくらい前から方向指示器または手信号を使用しなければなりませんか？
  choices:
    A: 少なくとも50フィート前
    B: 少なくとも100フィート前
    C: 少なくとも200フィート前
    D: 少なくとも500フィート前
  answer: B
  explanation: 法律により、車線変更を行う少なくとも100フィート（30 m）前には、方向指示器または手と腕による合図を使用して車線変更の意思を示すことが義務付けられています。
- id: 165
  category: safe_driving_rules
  question: 対面通行の道路で踏切から何フィート以内にいる場合、左側から車両を追い越すことが禁止されていますか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: 対面通行の道路で踏切から100フィート（30 m）以内にいる場合、左側から車両を追い越すことはできません。
- id: 166
  category: safe_driving_rules
  question: 左側から車両を追い越す際、対向車がどれくらいの距離に近づく前に、安全に右側の車線に戻ることができなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 対向車が200フィート（60 m）以内に近づく前に安全に右側の車線に戻ることができない場合、左側から車両を追い越すことはできません。
- id: 167
  category: defensive_driving
  question: 追い越しのために車線変更をする前に、なぜ素早く肩越しに後方を確認する必要があるのですか？
  choices:
    A: 遠くに緊急車両がいないか確認するため
    B: 追い越し中にミラーを使用することは違法であるため
    C: 制限速度を超えないようにするため
    D: 正しく調整されたミラーでも死角が残るため
  answer: D
  explanation: 車線変更の準備をする際、ミラーだけに頼ってはいけません。正しく調整されたミラーであっても、車両の両側後方に「死角」が残ります。
- id: 168
  category: safe_driving_rules
  question: 左側から車両を追い越した後、右側の車線に戻るのが安全であるとどのように判断しますか？
  choices:
    A: 自分の車のリアバンパーが相手の車のフロントバンパーを通り過ぎたらすぐ
    B: 車内のルームミラーに追い越した車両のフロントバンパーが見えたとき
    C: 右折の合図を出した直後
    D: 追い越した車両の100フィート前方に到達したとき
  answer: B
  explanation: 右側の車線に戻る前に、合図を出し、車内のルームミラーを見て、追い越した車両のフロントバンパーが見えることを確認してください。
- id: 169
  category: safe_driving_rules
  question: 次のどの条件において、右側から他の車両を追い越すことが許可されていますか？
  choices:
    A: 前方の車両が制限速度を下回って走行しているとき
    B: 狭い1車線の未舗装道路にいるとき
    C: 前方の車両が左折するとき
    D: 道路の未舗装の路肩に乗り入れて走行することによって
  answer: C
  explanation: 前方の車両が左折する場合など、特定の条件下でのみ右側から車両を追い越すことができます。ただし、路肩に乗り入れたり横切ったりせずに安全に追い越せる場合に限ります。
- id: 170
  category: defensive_driving
  question: 他の車両が左側からあなたを追い越す場合、どうするべきですか？
  choices:
    A: 追い越しを防ぐために速度を上げる
    B: 道路の右側の路肩に移動する
    C: 少し速度を落とし、車線の中央を維持する
    D: 対向車に警告するためにヘッドライトを点滅させる
  answer: C
  explanation: 他の車両が左側からあなたを追い越す場合は、少し速度を落とし、車線の中央を維持してください。
- id: 171
  category: sharing_the_road
  question: 赤いライトを点滅させているスクールバスからは、どのくらい離れて停止しなければなりませんか？
  choices:
    A: 少なくとも10フィート
    B: 少なくとも15フィート
    C: 少なくとも20フィート
    D: 少なくとも50フィート
  answer: C
  explanation: 停車中のスクールバスが赤いライトを点滅させている場合、どちらの方向から接近する車両もバスに到達する前に停止しなければなりません。バスから少なくとも20フィート（6メートル）離れて停止する必要があります。
- id: 172
  category: safe_driving_rules
  question: 中央分離帯のある幹線道路（ディバイデッド・ハイウェイ）を運転中に、反対車線のスクールバスが赤いライトを点滅させて停車した場合、どうしなければなりませんか？
  choices:
    A: 中央分離帯があるため、注意して進む
    B: ニューヨーク州のすべての道路で法律が適用されるため、停止する
    C: 時速15マイルに減速し、注意して追い越す
    D: 子供たちが自分の側の車線を実際に横断している場合のみ停止する
  answer: B
  explanation: この法律はニューヨーク州のすべての道路に適用されます。中央分離帯のある幹線道路の反対車線にいる場合でも、スクールバスのために停止しなければなりません。
- id: 173
  category: penalties_and_points
  question: 3年以内に停車中のスクールバスを追い越したとして3回有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 最高250ドルの罰金
    B: ディフェンシブ・ドライビング・コースの受講義務
    C: 運転免許証が最低6ヶ月間取り消される
    D: 車両が30日間押収される
  answer: C
  explanation: 3年以内にこれらの違反で3回有罪判決を受けた場合、運転免許証は最低6ヶ月間取り消されます。
- id: 174
  category: sharing_the_road
  question: スクールバスの黄色い警告灯の点滅は何を示していますか？
  choices:
    A: バスが故障しており、助けを求めている
    B: バスが乗客の乗降のために停車する準備をしている
    C: 直ちに停止することが求められている
    D: バスが交通に合流するために加速している
  answer: B
  explanation: スクールバスが乗客の乗降のために停車する前、通常運転手は黄色い警告灯を点滅させます。これを見たら、減速して停止する準備をしてください。
- id: 175
  category: penalties_and_points
  question: 停車中のスクールバスを追い越した際の、初回違反の最低罰金額はいくらですか？
  choices:
    A: 100ドル
    B: 150ドル
    C: 250ドル
    D: 500ドル
  answer: C
  explanation: マニュアルによると、停車中のスクールバスを追い越した場合の罰金は、初回違反の最低250ドルから、3年以内に3回違反した場合の最高1,000ドルまでの範囲となります。
- id: 176
  category: penalties_and_points
  question: ストップアーム・カメラ法に基づき、18ヶ月以内に停車中のスクールバスを追い越した3回目の違反に対する罰則はいくらですか？
  choices:
    A: 250ドル
    B: 275ドル
    C: 300ドル
    D: 500ドル
  answer: C
  explanation: マニュアルには、ストップアーム・カメラによって捉えられた18ヶ月以内の3回目（またはそれ以上）の違反には300ドルの罰則が科されると明記されています。
- id: 177
  category: safe_driving_rules
  question: 縦列駐車を終えたとき、車輪は縁石からどのくらい近くになければなりませんか？
  choices:
    A: 1フィート（30cm）以内
    B: 18インチ以内
    C: 2フィート以内
    D: 6インチ以内
  answer: A
  explanation: マニュアルには、「最終的な駐車位置において、車輪は縁石から1フィート（30cm）以内でなければならない」と記載されています。
- id: 178
  category: safe_driving_rules
  question: 縦列駐車で車を後退させるとき、どこを見なければなりませんか？
  choices:
    A: サイドミラーのみ
    B: リアウィンドウ（後部窓）越し
    C: 車内のルームミラーのみ
    D: バックカメラの画面のみ
  answer: B
  explanation: マニュアルでは、縦列駐車の際「後退するときはミラーではなく、リアウィンドウ（後部窓）越しに見る」よう運転手に指示しています。
- id: 179
  category: safe_driving_rules
  question: 坂道に駐車する場合、ハンドルをどちらの方向に切るべきですか？
  choices:
    A: 縁石から遠ざかる方向
    B: 縁石または道路の端に向かう方向
    C: まっすぐ前
    D: センターラインと平行
  answer: B
  explanation: 坂道に駐車する場合、マニュアルには「車が車道に飛び出すのを防ぐため、車輪を縁石または道路の端の方向に向ける」と記載されています。
- id: 180
  category: signs_and_signals
  question: 「NO PARKING（駐車禁止）」の標識は何を示していますか？
  choices:
    A: いかなる理由でも停止することはできない。
    B: 交通信号に従うためのみ停止できる。
    C: 荷物の積み下ろしや乗客の乗降のために一時的に停止することができる。
    D: 運転席に留まる場合は駐車できる。
  answer: C
  explanation: マニュアルによると、「『NO PARKING（駐車禁止）』の標識は、荷物の積み下ろしや乗客の乗降のために一時的に停止できることを意味する」とされています。
- id: 181
  category: signs_and_signals
  question: 「NO STANDING（駐車および荷待ち停車禁止）」の標識がある場所で許可されていることは何ですか？
  choices:
    A: 車から降りずに、乗客の乗降のために一時的に停車すること。
    B: 商品の積み下ろしのための停車。
    C: 5分未満の駐車。
    D: 用事を済ませる間、エンジンをかけたまま車を離れること。
  answer: A
  explanation: マニュアルには次のように記載されています。「『NO STANDING』の標識は、乗客の乗降のための一次的な停車のみが許可されていることを意味します。運転手は車から降りることはできません。」
- id: 182
  category: safe_driving_rules
  question: 緊急時に車を移動させるために免許を持った運転手が車内に残っている場合を除き、駐車、停車、または一時停止する際に、消火栓からどのくらい離れなければなりませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 30フィート
  answer: B
  explanation: 緊急時に車を移動させるために免許を持った運転手が車内に残っている場合を除き、消火栓から15フィート（5メートル）以内で駐車、停車、または一時停止することはできません。
- id: 183
  category: safe_driving_rules
  question: 交差点の横断歩道付近で駐車または停車する場合、最低限保たなければならない距離はどれくらいですか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 30フィート
  answer: C
  explanation: 交差点の横断歩道から20フィート（6メートル）以内での駐車または停車は禁止されています。
- id: 184
  category: safe_driving_rules
  question: 「STOP（止まれ）」の標識、「YIELD（ゆずれ）」の標識、または信号機からどの範囲内での駐車や停車が禁止されていますか？
  choices:
    A: 15フィート
    B: 20フィート
    C: 30フィート
    D: 50フィート
  answer: C
  explanation: マニュアルには、信号機、「STOP」の標識、または「YIELD」の標識から30フィート（10メートル）以内での駐車または停車は禁止されていると記載されています。
- id: 185
  category: safe_driving_rules
  question: 踏切から駐車する際に最低限離れなければならない距離はどれくらいですか？
  choices:
    A: 15フィート
    B: 20フィート
    C: 30フィート
    D: 50フィート
  answer: D
  explanation: マニュアルによると、「踏切から50フィート（15メートル）以内に車を駐車することはできません。」
- id: 186
  category: driver_responsibility
  question: 障害者専用の駐車スペースに合法的に駐車できるのはどのような場合ですか？
  choices:
    A: 車内に障害者用駐車許可証がある限り、いつでも。
    B: 許可証または専用ナンバープレートがあり、かつ、それらの交付を受けた本人が車に乗っている場合のみ。
    C: 障害のある家族のためにちょっとした用事を済ませる場合。
    D: 他の通常の駐車スペースがすべて埋まっている場合。
  answer: B
  explanation: 障害者用の許可証または専用ナンバープレートを持っており、かつ、その許可証またはナンバープレートの交付を受けた本人が車に乗っている場合にのみ、専用スペースに駐車することができます。
- id: 187
  category: safe_driving_rules
  question: 障害者専用駐車スペースの隣にある、斜めの縞模様（ゼブラゾーン）が引かれたスペースに駐車してはならないのはなぜですか？
  choices:
    A: 緊急車両専用に指定されているため。
    B: 配達トラックの荷積みゾーンであるため。
    C: 車椅子や特殊装備を備えた車両に必要なアクセスを提供するため。
    D: ショッピングカートの保管場所として指定されているため。
  answer: C
  explanation: マニュアルでは次のように警告しています。「専用駐車スペースの隣にある斜めの縞模様のスペースには駐車しないでください。これらのスペースは、車椅子や特殊装備を備えた車両を利用する人々のアクセスのために必要です。」
- id: 188
  category: penalties_and_points
  question: 障害者用ナンバープレートの申請で虚偽の申告をした場合の罰則の1つは何ですか？
  choices:
    A: 義務的な運転免許の取り消し
    B: DMV（車両管理局）からの警告状
    C: 義務的なディフェンシブ・ドライビング（安全運転）講習の受講
    D: 30日間の車両押収
  answer: A
  explanation: ナンバープレートの申請で虚偽の申告をすることは軽犯罪（misdemeanor）であり、義務的な運転免許の取り消しの対象となるほか、罰金、禁錮、またはその両方が科される可能性があります。
- id: 189
  category: penalties_and_points
  question: ショッピングセンターでの駐車違反の罰金に加算される義務的な追加徴収金（サーチャージ）はいくらですか？
  choices:
    A: $15
    B: $20
    C: $30
    D: $50
  answer: C
  explanation: マニュアルによると、ショッピングセンターでの駐車違反の各罰金には、30ドルの義務的な追加徴収金（サーチャージ）が加算されます。
- id: 190
  category: defensive_driving
  question: 運転中の推奨される座り方と手の位置はどのようなものですか？
  choices:
    A: 背中を丸めて座り、片手をハンドルの下部に置く。
    B: 快適かつ垂直な姿勢で座り、両手をハンドルに置く。
    C: 背もたれに寄りかかり、片手をハンドルに、もう片手を窓に置く。
    D: できるだけハンドルに近づいて座り、両手をハンドルの上部に置く。
  answer: B
  explanation: 快適かつ垂直な姿勢で座り、両手をハンドルに置いておく必要があります。背中を丸めたり片手だけで運転したりすると、車のコントロールが危険になります。
- id: 191
  category: defensive_driving
  question: 他の運転手が「止まれ（STOP）」または「譲れ（YIELD）」の標識がある交差点に近づくとき、あなたは何を想定するべきですか？
  choices:
    A: 他の運転手は必ず停止するか、道を譲る。
    B: 他の運転手が手を振って交差点を通過させてくれる。
    C: 他の運転手は止まらないと想定した方がよい。
    D: 他の運転手に優先権（right-of-way）がある。
  answer: C
  explanation: マニュアルでは、他の運転手のミスを予測するようアドバイスしており、「止まれ」や「譲れ」の標識に近づいている場合でも、「他の運転手は止まらないと想定した方がよい」と記載されています。
- id: 192
  category: driver_responsibility
  question: マニュアルによると、次のうち運転中の危険な「注意力散漫（distraction）」の原因と見なされるものはどれですか？
  choices:
    A: 数秒ごとにミラーを確認する。
    B: 前方の道路をスキャン（確認）する。
    C: 同乗者とストレスのたまる、または感情的な会話をする。
    D: 両手をハンドルに置いたままにする。
  answer: C
  explanation: マニュアルでは、注意散漫な運転（distracted driving）を防ぐために必要なステップとして、同乗者との口論やストレスのたまる、または感情的な会話を避けることを挙げています。
- id: 193
  category: safe_driving_rules
  question: 攻撃的な運転（aggressive driving）とロードレイジ（road rage：あおり運転や路上での暴力行為）の主な違いは何ですか？
  choices:
    A: 攻撃的な運転は刑法違反を伴うが、ロードレイジは交通安全法違反を伴う。
    B: 攻撃的な運転は一般的に交通安全法違反を伴うが、ロードレイジは刑法違反を伴う。
    C: 攻撃的な運転は高速道路でのみ発生するが、ロードレイジは市街地の道路で発生する。
    D: 違いはない。これらの用語は全く同じことを意味する。
  answer: B
  explanation: マニュアルによると、攻撃的な運転（aggressive driving）は一般的に交通安全法違反を伴いますが、ロードレイジ（road
    rage）は刑法違反を伴います。
- id: 194
  category: defensive_driving
  question: 道路上で攻撃的な運転手（aggressive driver）に遭遇した場合、最善の行動は何ですか？
  choices:
    A: 怯えていないことを示すために目を合わせる。
    B: 速度を上げて相手に挑む。
    C: 目を合わせず、安全に離れるようにする。
    D: 自分を守るために、相手のジェスチャーや怒鳴り声にやり返す。
  answer: C
  explanation: 攻撃的な運転手に遭遇した場合は、目を合わせず、冷静さを保ち、安全に離れるように努めるべきです。
- id: 195
  category: defensive_driving
  question: 攻撃的な運転手に尾行されている場合、どうするべきですか？
  choices:
    A: 車を止めて外に出、相手に立ち向かう。
    B: 最寄りの警察署に向かって運転する。
    C: 路肩に車を寄せて、相手が通り過ぎるのを待つ。
    D: 自宅に向かって運転し、ドアをロックする。
  answer: B
  explanation: 攻撃的な運転手に尾行されている場合、マニュアルには「車を止めたり、車から降りたりしないでください。最寄りの警察署に向かって運転してください」と明記されています。
- id: 196
  category: defensive_driving
  question: 防衛運転（defensive driving）をする運転手は、優先権（right-of-way）をどのように捉えるべきですか？
  choices:
    A: 決して譲るべきではない完全な権利として。
    B: 歩行者にのみ適用されるルールとして。
    C: 衝突を避けるために、他の道路利用者に譲る準備をしておくべきものとして。
    D: 他の運転手が自分のために止まってくれるという保証として。
  answer: C
  explanation: 自分に優先権（right-of-way）がある場合でも、それを完全な権利だと考えてはいけません。衝突を避けるために、他の道路利用者に優先権を譲る準備をしておいてください。
- id: 197
  category: safe_driving_rules
  question: ニューヨーク州の幹線道路（highway）に制限速度が掲示されていない場合、法的に運転できる最高速度はどれくらいですか？
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: 制限速度は必ず守らなければなりません。制限速度が掲示されていない場合は、55 mph（88 km/h）を超えて運転しないでください。
- id: 198
  category: safe_driving_rules
  question: 別の制限速度が掲示されていない限り、ニューヨーク市のデフォルトの制限速度はどれくらいですか？
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: マニュアルには、一部の都市では掲示されていない制限速度が55 mph未満であると記されており、特にニューヨーク市では別の制限速度が掲示されていない限り、制限速度は25
    mphであると明記されています。
- id: 199
  category: penalties_and_points
  question: 掲示されている制限速度を下回って運転している場合でも、スピード違反の切符（ticket）を切られることはありますか？
  choices:
    A: いいえ、掲示されている制限速度を下回っている限り、切符を切られることはありません。
    B: はい、危険な天候や道路状況に対して速度が「妥当ではない（not reasonable）」場合です。
    C: はい、ただしスクールゾーンを運転している場合のみです。
    D: いいえ、警察は掲示されている制限速度を超過した場合にのみ切符を発行します。
  answer: B
  explanation: 危険な道路で制限速度を下回って運転していたとしても、警察官はその状況に対して「妥当ではない」速度であるとして、違反切符を切る可能性があります。
- id: 200
  category: safe_driving_rules
  question: 一部の幹線道路（highway）に最低制限速度が設けられているのはなぜですか？
  choices:
    A: 徴収される通行料の収入を増やすため。
    B: スムーズな交通の流れを維持し、遅い運転手によって引き起こされる危険な状況を防ぐため。
    C: 代わりに一般道を使用するよう運転手に促すため。
    D: 運転手が目的地に早く到着できるようにするため。
  answer: B
  explanation: スムーズな交通の流れを維持するために、一部の幹線道路には最低制限速度が設けられています。最低速度より遅く運転すると、交通の流れを妨げ、危険な状況を引き起こす可能性があります。
- id: 201
  category: defensive_driving
  question: マニュアルによると、通常、車間距離の詰めすぎが原因で発生する追突事故は、全事故のどのくらいの割合を占めていますか？
  choices:
    A: 10件中1件
    B: 10件中2件
    C: 10件中4件
    D: 10件中6件
  answer: C
  explanation: 全事故の10件中4件は、通常、車間距離の詰めすぎ（テールゲーティング）が原因で発生する追突事故です。
- id: 202
  category: penalties_and_points
  question: ロードレイジ（あおり運転や路上での暴力行為）に関連する行動に対する罰則として、当てはまるものは次のうちどれですか？
  choices:
    A: 罰金、禁錮、および裁判所が命じる保護観察。
    B: 商用運転免許（CDL）への強制的なアップグレード。
    C: 仮免許の筆記試験の再受験のみの義務付け。
    D: 法的措置を伴わない警告状。
  answer: A
  explanation: 他人を危険にさらしたり、脅迫したり、暴行を加えたりすることは違法です。これらの行動は、罰金、禁錮、裁判所が命じる保護観察、および免許の取り消しや停止を含む厳しい罰則につながる可能性があります。
- id: 203
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）内での車両の最高制限速度はどれくらいですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 30 mph
    D: 45 mph
  answer: C
  explanation: ラウンドアバウトは、交差点内のすべての車両の速度が30 mph（50 km/h）以下に制限されるように設計されています。
- id: 204
  category: sharing_the_road
  question: ラウンドアバウトを走行している自転車に対して、運転手はどのように対応すべきですか？
  choices:
    A: クラクションを鳴らして道を譲るよう警告する
    B: 左側から素早く追い越す
    C: ラウンドアバウト内では自転車を追い越さない
    D: 横断歩道を使用するように強制する
  answer: C
  explanation: 自転車は、他の車両と同じようにラウンドアバウト内の車線を走行することが許可されています。マニュアルには「ラウンドアバウト内では自転車を追い越さないでください」と記載されています。
- id: 205
  category: safe_driving_rules
  question: ラウンドアバウトで出口に近づいたとき、どの合図を使用すべきですか？
  choices:
    A: 左折の合図（ウィンカー）
    B: 右折の合図（ウィンカー）
    C: ハザードランプ
    D: 合図は必要ない
  answer: B
  explanation: ラウンドアバウトで出口に近づく際は、右折の合図（ウィンカー）を出さなければなりません。
- id: 206
  category: sharing_the_road
  question: ラウンドアバウトを通行する歩行者のルールとして、次のうち正しいものはどれですか？
  choices:
    A: 中央島へ直接横断する
    B: 環状の車道を歩く
    C: 指定された横断歩道のみを横断する
    D: 車両に通行権を譲る
  answer: C
  explanation: 歩行者は指定された横断歩道のみを横断し、決して中央島へ横断してはいけません。また、歩行者は車両よりも優先される通行権を持っています。
- id: 207
  category: alcohol_drugs_health
  question: 居眠り運転（眠気を催した状態での運転）の兆候は次のうちどれですか？
  choices:
    A: 前方の道路に過度に集中する
    B: 過去数マイルの道のりを鮮明に覚えている
    C: 車線をはみ出したり、ランブルストリップス（警告音発生舗装）に乗り上げたりする
    D: 通常よりも早く危険に反応する
  answer: C
  explanation: 疲労の兆候には、車線をはみ出す、車間距離を詰めすぎる、交通標識を見落とす、または道路から外れてランブルストリップス（警告音発生舗装）に乗り上げるなどがあります。
- id: 208
  category: alcohol_drugs_health
  question: 長距離ドライブでの居眠り運転を防ぐため、どのくらいの頻度で定期的な休憩を予定すべきですか？
  choices:
    A: 50マイルまたは1時間ごと
    B: 100マイルまたは2時間ごと
    C: 200マイルまたは4時間ごと
    D: 給油が必要なときのみ
  answer: B
  explanation: 出発する前に、疲労を防ぐために100マイルまたは2時間ごとに定期的な休憩を予定しておくべきです。
- id: 209
  category: alcohol_drugs_health
  question: 運転中に眠気を感じた場合、安全な場所に車を停めた後、どのくらい仮眠をとるべきですか？
  choices:
    A: 5～10分
    B: 15～45分
    C: 1～2時間
    D: 最低4時間
  answer: B
  explanation: 眠気を感じた場合は、交通から離れた安全な場所に車を停め、15～45分間の短い仮眠をとるべきです。
- id: 210
  category: alcohol_drugs_health
  question: カフェインが血流に入り、短期的な覚醒を促すまでに、およそどのくらいの時間がかかりますか？
  choices:
    A: 5分
    B: 15分
    C: 30分
    D: 60分
  answer: C
  explanation: カフェインが血流に入り、短期的な覚醒を促すまでには約30分かかります。
- id: 211
  category: penalties_and_points
  question: ニューヨーク州で運転中に手持ちの携帯電話で通話したことによる初回違反の罰則は何ですか？
  choices:
    A: 最高100ドルの罰金および免許の違反点数2点
    B: 最高200ドルの罰金および免許の違反点数5点
    C: 最高250ドルの罰金および免許の違反点数3点
    D: 最高450ドルの罰金および免許停止
  answer: B
  explanation: 運転中の手持ち携帯電話の使用による初回違反の場合、最高200ドルの罰金の支払いと免許の違反点数5点が科される可能性があります。
- id: 212
  category: penalties_and_points
  question: 18ヶ月以内に運転中のテキストメッセージ送信で3回目以降の違反をした場合の最高罰金額はいくらですか？
  choices:
    A: 200ドル
    B: 250ドル
    C: 450ドル
    D: 500ドル
  answer: C
  explanation: 運転中のテキストメッセージ送信による3回目以降の違反（すべて18ヶ月以内に犯した場合）には、最高450ドルの罰金が科されます。
- id: 213
  category: penalties_and_points
  question: 見習い免許（probationary license）またはジュニア免許（junior license）を持つ運転者が、運転中のテキストメッセージ送信で初めて有罪判決を受けた場合、どうなりますか？
  choices:
    A: 警告状を受け取る
    B: 60日間の免許停止処分を受ける
    C: 120日間の免許停止処分を受ける
    D: 1年間免許が取り消される
  answer: C
  explanation: 見習い免許およびジュニア免許を持つ運転者が運転中に手持ちの電話を使用したりテキストメッセージを送信したりした場合、初回の有罪判決で120日間の免許停止処分を受けます。
- id: 214
  category: vehicle_information
  question: ニューヨーク州の公道で車両を合法的に運転または駐車するためには、どのくらいの頻度で車両検査（車検）を受ける必要がありますか？
  choices:
    A: 少なくとも6ヶ月に1回
    B: 少なくとも1年に1回
    C: 少なくとも2年に1回
    D: 車両を売却する時のみ
  answer: B
  explanation: 少なくとも1年に1回の検査を受けていない限り、何人も公道で車両を運転または駐車してはなりません。
- id: 215
  category: vehicle_information
  question: ブレーキが濡れているために片側に寄ってしまう場合、どうすればよいですか？
  choices:
    A: 1分間ブレーキを素早くポンピングする
    B: ペダルを軽く踏み続けて乾燥させる
    C: 低いギアにシフトダウンし、ブレーキを避ける
    D: 車を停めて自然乾燥するのを待つ
  answer: B
  explanation: ブレーキが片側に寄る場合、濡れている可能性があります。濡れている場合は、ペダルを軽く踏み続けることで乾燥させることができます。
- id: 216
  category: vehicle_information
  question: 法律で義務付けられているタイヤの溝の深さの最低基準はどれくらいですか？
  choices:
    A: 1/32インチ
    B: 2/32インチ
    C: 3/32インチ
    D: 4/32インチ
  answer: B
  explanation: 法律により、タイヤには少なくとも2/32インチ（0.16 cm）の溝があることが義務付けられています。
- id: 217
  category: vehicle_information
  question: 1セント硬貨（ペニー）を使ってタイヤの溝の深さを確認する際、タイヤが摩耗しすぎて交換が必要であることを示すのはどれですか？
  choices:
    A: エイブラハム・リンカーンの頭全体が見える
    B: リンカーンの頭が完全に隠れている
    C: リンカーンの髪の毛だけが見える
    D: 硬貨が溝から落ちる
  answer: A
  explanation: 最も深く見える溝にリンカーンの頭を先にして硬貨を差し込みます。頭全体が見える場合、タイヤは摩耗しすぎているため、そのタイヤで運転するべきではありません。
- id: 218
  category: vehicle_information
  question: 1セント硬貨（ペニー）を使って、タイヤの溝が摩耗しすぎているかどうかをどのように確認できますか？
  choices:
    A: 最も深い溝に頭を先にして差し込んだとき、エイブラハム・リンカーンの頭全体が見える場合
    B: リンカーンの頭がタイヤの溝で完全に覆われている場合
    C: 溝に置いたときに硬貨が倒れる場合
    D: 硬貨がタイヤの外壁と平らになる場合
  answer: A
  explanation: マニュアルによると、最も深く見える溝にリンカーンの頭を先にして差し込み、頭全体が見える場合、タイヤは摩耗しすぎているため、そのタイヤで運転するべきではありません。
- id: 219
  category: safe_driving_rules
  question: 車のクラクションを使用するのが適切なのはいつですか？
  choices:
    A: 他の運転者や歩行者に対する怒りを表現するため
    B: 起こりうる問題について他の運転者や歩行者に警告するため
    C: 歩道を歩いている友人に挨拶するため
    D: 前の運転者にもっと速く走るよう促すため
  answer: B
  explanation: マニュアルには、クラクションは起こりうる問題について他の運転者や歩行者に警告する唯一の手段となり得る重要な安全装置であり、怒りを表現するために使用するべきではないと記載されています。
- id: 220
  category: alcohol_drugs_health
  question: ニューヨーク州において、自動車による死亡事故全体の約何パーセントが飲酒・薬物影響下での運転（impaired driving）に関与していますか？
  choices:
    A: 10パーセント
    B: 25パーセント
    C: 40パーセント以上
    D: 60パーセント
  answer: C
  explanation: マニュアルには、ニューヨーク州における自動車による死亡事故全体の40パーセント以上が、飲酒・薬物影響下での運転（impaired driving）に関与していると記載されています。
- id: 221
  category: alcohol_drugs_health
  question: 飲酒・薬物影響下で運転する若いドライバーに対する運転免許取消しの罰則がより厳しいのはなぜですか？
  choices:
    A: 一般的に年配のドライバーよりもスピードを出すため
    B: 運転人口のわずか4％であるにもかかわらず、死亡事故に関与した飲酒・薬物影響下のドライバーの7％を占めているため
    C: 無保険で運転する可能性が高いため
    D: 平均して年配のドライバーよりも多くのアルコールを消費するため
  answer: B
  explanation: 21歳未満のドライバーは運転人口の約4％ですが、死亡事故に関与した飲酒・薬物影響下のドライバーの7％を占めています。これが、若いドライバーに対する取消しの罰則がより厳しい理由の一つです。
- id: 222
  category: alcohol_drugs_health
  question: アルコールは夜間の視力にどのような影響を与えますか？
  choices:
    A: 暗闇での視力が向上する
    B: ヘッドライトのまぶしさから回復する能力が低下する
    C: ヘッドライトが暗く見えるようになる
    D: 周辺視野が広がる
  answer: B
  explanation: マニュアルには、アルコールはヘッドライトのまぶしさから回復する能力を低下させるため、日没後の飲酒運転は特に危険であると記されています。
- id: 223
  category: alcohol_drugs_health
  question: アルコール摂取が運転能力に与える影響はいつ始まりますか？
  choices:
    A: 血中アルコール濃度(BAC)が0.08％に達した後のみ
    B: 酔いを感じ始めたとき
    C: 最初の1杯を飲んだとき
    D: 1時間に3杯飲んだ後
  answer: C
  explanation: マニュアルには、アルコール摂取の影響は、酔いを感じたり法的な能力低下状態になるずっと前から現れる可能性があり、最初の1杯から始まると記載されています。
- id: 224
  category: alcohol_drugs_health
  question: ニューヨーク州において、法的に酩酊状態（Intoxication）の証拠とみなされる血中アルコール濃度（BAC）はどれくらいですか？
  choices:
    A: 0.02％以上
    B: 0.05％以上
    C: 0.08％以上
    D: 0.18％以上
  answer: C
  explanation: 0.08％以上のBACは酩酊状態（Intoxication）の証拠となります。0.05％を超えるBACは能力低下（Impairment）の証拠となり、0.18％以上は加重飲酒運転（Aggravated
    DWI）となります。
- id: 225
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）が0.05％を超える場合、法的にどの違反の証拠となりますか？
  choices:
    A: 加重飲酒運転 (Aggravated DWI)
    B: 能力低下状態での運転 (DWAI)
    C: 酩酊状態での運転 (DWI)
    D: 化学検査の拒否
  answer: B
  explanation: マニュアルによると、0.05％を超えるBACは、運転能力が低下している（Impaired）ことの法的な証拠となります。
- id: 226
  category: penalties_and_points
  question: 化学検査なしで、アルコールまたは薬物に関連する運転違反で有罪判決を受けることはありますか？
  choices:
    A: いいえ、能力低下を証明するために法律で常に化学検査が義務付けられています
    B: はい、ただし書面で違反を自白した場合に限ります
    C: はい、あなたの運転や行動に関する警察官の証言が十分な証拠となる場合があります
    D: いいえ、アルコールを摂取しているビデオ証拠がない限り有罪にはなりません
  answer: C
  explanation: マニュアルには、あなたの運転方法、外見、行動に関する警察官の証言は、化学検査がなくても有罪とするのに十分な証拠を提供できると記載されています。
- id: 227
  category: alcohol_drugs_health
  question: 次のうち、血中アルコール濃度（BAC）を決定する要因ではないものはどれですか？
  choices:
    A: 飲んだアルコールの量
    B: 体重
    C: 飲む間隔（経過時間）
    D: 飲んだアルコール飲料の種類
  answer: D
  explanation: BACは、飲酒量、飲む間隔、および体重によって決まります。飲んだ飲料の種類、健康状態、または「お酒への強さ」には依存しません。
- id: 228
  category: alcohol_drugs_health
  question: 次の飲み物のうち、最も多くのアルコールを含んでいるのはどれですか？
  choices:
    A: 80プルーフの蒸留酒 1.5オンス
    B: ワイン（アルコール度数12%） 5オンス
    C: ビール（アルコール度数5%） 12オンス
    D: すべてほぼ同じ量のアルコールを含んでいる
  answer: D
  explanation: マニュアルには、1.5オンスの蒸留酒、5オンスのワイン、12オンスのビール、および12オンスのワインクーラーは、ほぼ同じ量のアルコールを含んでいると記載されています。どれか一つが他のものより「安全に飲める」ということはありません。
- id: 229
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）を下げる唯一の効果的な方法は何ですか？
  choices:
    A: ブラックコーヒーを飲む
    B: 冷たいシャワーを浴びる
    C: 一定時間、お酒を飲まない
    D: 激しい運動をする
  answer: C
  explanation: マニュアルには、BACを効果的に下げる唯一の方法は、一定時間お酒を飲まないことであると明記されています。コーヒー、運動、冷たいシャワーではBACを下げることはできません。
- id: 230
  category: license_system
  question: ニューヨーク州の「黙示の同意（Implied Consent）」法とは何を意味しますか？
  choices:
    A: 警察に車を止められた場合、車両の捜索に同意する
    B: 州内で運転する場合、BACを測定する化学検査を受けることに同意する
    C: 違反切符を受け取った際、直ちにすべての交通反則金を支払うことに同意する
    D: スピード違反の切符を切られた場合、免許が停止されることに同意する
  answer: B
  explanation: ニューヨーク州の「黙示の同意」法の下では、州内で車を運転する場合、BACを測定するための化学検査を受けることに同意したものとみなされます。
- id: 231
  category: penalties_and_points
  question: アルコールまたは薬物に関連する違反で有罪判決を受けた場合、運転免許証はどうなりますか？
  choices:
    A: 初回違反の場合は警告を受けます
    B: 30日以内に運転免許試験を再受験しなければなりません
    C: 判決が下される際、裁判所はあなたの免許を取り消すか停止しなければなりません
    D: 免許は日中の運転のみに制限されます
  answer: C
  explanation: アルコールまたは薬物に関連する違反で有罪判決を受けた場合、判決が下される際に裁判所は運転免許証を取り消すか停止しなければなりません。
- id: 232
  category: alcohol_drugs_health
  question: 体重150ポンドの男性の体が、標準的なアルコール飲料1杯分のアルコールを分解するのに、平均してどのくらいかかりますか？
  choices:
    A: 30分
    B: 約1時間
    C: 2時間
    D: 4時間
  answer: B
  explanation: 体重150ポンドの男性の場合、標準的なアルコール飲料を1杯飲むごとに血中アルコール濃度（BAC）が約0.02パーセント上昇します。平均して、体がその量のアルコールを分解するのには約1時間かかります。
- id: 233
  category: alcohol_drugs_health
  question: ニューヨーク州の「黙示の同意（Implied Consent）」法に基づき、同州内で車を運転することによって何に同意したとみなされますか？
  choices:
    A: 警察が令状なしで車両を捜索することを許可する
    B: 血中アルコール濃度（BAC）を測定するための化学検査を受ける
    C: 30日以内にすべての交通違反の罰金を支払う
    D: 逮捕された場合に車両が押収される
  answer: B
  explanation: ニューヨーク州の「黙示の同意」法に基づき、同州内で車を運転する場合、血中アルコール濃度（BAC）を測定するための化学検査を受けることに同意したものとみなされます。
- id: 234
  category: penalties_and_points
  question: アルコールまたは薬物に関連する違反で逮捕された後、化学検査を受けることを拒否した場合、運転免許証はどうなりますか？
  choices:
    A: 裁判所で罪状認否を受ける際に免許が停止されます。
    B: 即座に永久に取り消されます。
    C: 警告を受けますが、裁判までは免許を保持できます。
    D: 職場への往復の運転のみに制限されます。
  answer: A
  explanation: 逮捕後に検査を拒否した場合、アルコールまたはその他の薬物関連の容疑で裁判所で罪状認否を受ける際に、運転免許証が停止されます。
- id: 235
  category: penalties_and_points
  question: 生涯でアルコールまたは薬物に関連する運転の有罪判決を何回受けると、車両管理局（DMV）は免許再交付の申請を永久に拒否しますか？
  choices:
    A: 2回
    B: 3回
    C: 4回
    D: 5回
  answer: C
  explanation: 申請者が生涯で4回のアルコールまたは薬物に関連する運転の有罪判決または事件を起こしている場合、DMVは免許の再交付を永久に拒否します。
- id: 236
  category: penalties_and_points
  question: ニューヨーク州の常習違反者規制において、「重大な運転違反（serious driving offense）」とみなされるのは次のうちどれですか？
  choices:
    A: 10年間に運転違反で10ポイントを累積する
    B: 死亡事故
    C: スクールゾーンでの駐車違反切符
    D: 一時停止標識で通行権を譲らない
  answer: B
  explanation: 重大な運転違反には、死亡事故、運転に関連する刑法上の有罪判決、25年間で20ポイント以上の累積、または25年間で5ポイント以上の有罪判決を2回受けることが含まれます。
- id: 237
  category: alcohol_drugs_health
  question: ニューヨーク州の「ゼロ・トレランス（Zero Tolerance）」法に基づき、21歳未満の人がどの範囲の測定可能な血中アルコール濃度（BAC）で運転すると違反になりますか？
  choices:
    A: 0.01〜0.05
    B: 0.02〜0.07
    C: 0.05〜0.08
    D: 0.08以上
  answer: B
  explanation: 州の「ゼロ・トレランス」法に基づき、21歳未満の人が測定可能な血中アルコール濃度（BAC）（0.02〜0.07）で運転することは違反となります。
- id: 238
  category: penalties_and_points
  question: 21歳未満の運転者が初めてゼロ・トレランス違反をした場合の罰則は何ですか？
  choices:
    A: 30日間の免許停止と50ドルの罰金
    B: 6ヶ月間の免許停止、100ドルの停止解除手数料、および125ドルの民事罰金
    C: 1年間の免許取り消しと500ドルの罰金
    D: 5日間の義務的拘禁
  answer: B
  explanation: 初回のゼロ・トレランス違反が認定された後、運転免許証は6ヶ月間停止され、運転者は100ドルの停止解除手数料と125ドルの民事罰金を支払わなければなりません。
- id: 239
  category: penalties_and_points
  question: 公道上の自動車内で開封済みのアルコール飲料の容器を所持していたことによる初回の有罪判決に対する最大罰金はいくらですか？
  choices:
    A: 50ドル
    B: 100ドル
    C: 150ドル
    D: 250ドル
  answer: C
  explanation: 開封済み容器に関する法律（Open Container Law）の初回の有罪判決に対する罰則は、最大150ドルの罰金、義務的な追加徴収金、犯罪被害者支援手数料、および最長15日間の拘禁の可能性があります。
- id: 240
  category: safe_driving_rules
  question: アルコール飲料に関する開封済み容器に関する法律（Open Container Law）の適用を免除されるのは誰ですか？
  choices:
    A: 商用トラックの運転手
    B: 有効な商業証明書を掲示しているストレッチリムジンなどの車両の乗客
    C: 一般的な乗用車の後部座席の乗客
    D: 25歳以上の運転手
  answer: B
  explanation: 開封済み容器に関する法律は、米国またはニューヨーク州運輸省が発行した商業証明書または許可証を掲示しているストレッチリムジンやその他の車両の乗客には適用されません。
- id: 241
  category: penalties_and_points
  question: アルコールを含む飲料を違法に購入するために運転免許証を使用した場合、どのような結果になりますか？
  choices:
    A: 500ドルの罰金
    B: 運転免許証の停止、または免許申請の権利の停止
    C: 義務的な社会奉仕活動
    D: 運転免許証の永久取消し
  answer: B
  explanation: 州法により、アルコールを含む飲料を違法に購入するための年齢証明として運転免許証を使用した場合、運転免許証または免許申請の権利を停止することが義務付けられています。
- id: 242
  category: alcohol_drugs_health
  question: 加重飲酒運転（AGG-DWI）は、血中アルコール濃度（BAC）が少なくとも以下の数値の運転手に適用されます：
  choices:
    A: '0.05'
    B: '0.08'
    C: '0.15'
    D: '0.18'
  answer: D
  explanation: 加重飲酒運転（AGG-DWI）は、血中アルコール濃度（BAC）が0.18以上の場合に適用されます。
- id: 243
  category: penalties_and_points
  question: 初回の飲酒運転（DWI）の最大禁錮刑はどれくらいですか？
  choices:
    A: 30日
    B: 90日
    C: 6ヶ月
    D: 1年
  answer: D
  explanation: 初回の飲酒運転（DWI）の場合、最大禁錮刑は最長1年です。
- id: 244
  category: penalties_and_points
  question: アルコール関連の有罪判決の繰り返しによる5年間の拒否期間を経て、運転手が免許の再交付を承認された場合、インターロック装置をどのくらいの期間使用しなければなりませんか？
  choices:
    A: 1年
    B: 2年
    C: 3年
    D: 5年
  answer: D
  explanation: 規則により、免許証の発行日から5年間、申請者が運転する車両にインターロック装置を設置することが義務付けられています。
- id: 245
  category: alcohol_drugs_health
  question: 開封済み容器に関する法律（Open Container Law）の下では、公道上の自動車内の運転手または同乗者が以下の行為を行うと交通違反になります：
  choices:
    A: 未開封のマリファナ/大麻をトランクで運ぶ
    B: マリファナ/大麻を使用する
    C: 処方薬を元のボトルのまま所持する
    D: ノンアルコール飲料を飲む
  answer: B
  explanation: 公道、通り、または道路上の自動車内で、運転手または同乗者がマリファナ/大麻を使用することは交通違反です。
- id: 246
  category: penalties_and_points
  question: 初回の能力低下状態での運転（DWAI）に対する免許の処分として義務付けられているものは何ですか？
  choices:
    A: 30日間の停止
    B: 90日間の停止
    C: 6ヶ月間の取消し
    D: 1年間の取消し
  answer: B
  explanation: マニュアルによると、初回のDWAI（交通違反）には90日間の免許停止が義務付けられています。
- id: 247
  category: penalties_and_points
  question: 5年以内の2回目のDWAI違反に対する最大禁錮刑はどれくらいですか？
  choices:
    A: 最長15日
    B: 最長30日
    C: 最長90日
    D: 最長180日
  answer: B
  explanation: マニュアルには、5年以内の2回目のDWAI違反には最長30日の禁錮刑が科されると記載されています。
- id: 248
  category: alcohol_drugs_health
  question: レアンドラ法（Leandra's Law）の下では、子供を車に乗せてアルコール関連の違反を犯した場合、その子供が何歳未満であればE級重罪（class
    E felony）になりますか？
  choices:
    A: 12歳
    B: 14歳
    C: 16歳
    D: 18歳
  answer: C
  explanation: レアンドラ法では、16歳未満の子供を車に乗せてアルコール関連の違反を犯した運転手は、E級重罪に問われる可能性があると定められています。
- id: 249
  category: penalties_and_points
  question: DWIの有罪判決後、運転手は通常どのくらいの期間、車両にイグニッション・インターロック装置を維持しなければなりませんか？
  choices:
    A: 少なくとも3ヶ月
    B: 少なくとも6ヶ月
    C: 少なくとも12ヶ月
    D: 少なくとも24ヶ月
  answer: C
  explanation: 裁判所は、DWIまたは加重DWIの有罪判決を受けた者に対し、所有または運転するすべての車両に少なくとも12ヶ月間イグニッション・インターロック装置を設置し維持することを命じなければなりません。
- id: 250
  category: license_system
  question: 条件付き運転免許証（conditional driver license）は、運転手が以下の例外を除く交通違反で有罪判決を受けた場合に取消されます：
  choices:
    A: スピード違反
    B: 譲り合い義務違反
    C: 駐車、停車、または駐停車
    D: 赤信号無視
  answer: C
  explanation: マニュアルには、運転手が裁判所の条件に従わない場合、または駐車、停車、駐停車を除く交通違反で有罪判決を受けた場合、条件付き運転免許証は取消されると記載されています。
- id: 251
  category: penalties_and_points
  question: 運転能力低下または酒酔い運転で逮捕された際、すでに運転免許が停止または取り消されている場合、科せられる義務的な罰金の最高額はいくらですか？
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: C
  explanation: 免許停止または取り消し中に運転し、運転能力低下または酒酔い状態で逮捕された場合、義務的な罰金の最高額は$5,000であり、車両が押収される可能性があります。
- id: 252
  category: penalties_and_points
  question: アルコールまたは薬物関連の違反により他人に死傷を負わせた場合、直面する可能性のある最長刑期はどれくらいですか？
  choices:
    A: 10年
    B: 15年
    C: 20年
    D: 25年
  answer: D
  explanation: アルコールまたはその他の薬物関連の違反により死傷を負わせた場合、最長25年の懲役刑を伴う有罪判決を受ける可能性があります。
- id: 253
  category: safe_driving_rules
  question: 踏切を通過する際、常にすべきことは次のうちどれですか？
  choices:
    A: 線路を通過中にギアを変える
    B: 車線を維持し、同じギアのままにする
    C: できるだけ早く通過するために加速する
    D: 電車が来ないか確認するために線路上で停止する
  answer: B
  explanation: マニュアルには「線路を通過する際は、常に車線を維持し、同じギアのままにしてください」と明記されています。
- id: 254
  category: signs_and_signals
  question: 赤い点滅信号と遮断機が下りている作動中の踏切に近づいた場合、合法的に進むことができるのはいつですか？
  choices:
    A: 遮断機が下りていても、電車が通過したらすぐ
    B: 遮断機が完全に上がり、信号が消えたとき
    C: 遮断機が上がり始め、視界がはっきりしたとき
    D: 遮断機の下を通れる小型車を運転している場合
  answer: B
  explanation: 標識のある、または作動中の踏切に近づく際は、遮断機が完全に上がり、信号が消えるまで進んではいけません。
- id: 255
  category: safe_driving_rules
  question: 赤い点滅信号、下りた遮断機、または警報音が電車の接近を示している場合、線路から少なくともどのくらい離れて停止しなければなりませんか？
  choices:
    A: 5フィート
    B: 10フィート
    C: 15フィート
    D: 25フィート
  answer: C
  explanation: 踏切での赤い点滅信号、下りた遮断機、および/または警報音は、線路から少なくとも15フィート（5m）手前で停止しなければならないことを示しています。
- id: 256
  category: signs_and_signals
  question: 黒字で「RR」と書かれ、「X」の記号が描かれた黄色の標識は何を意味しますか？
  choices:
    A: すぐに完全に停止しなければならない
    B: 前方に踏切がある
    C: 踏切は閉鎖されている
    D: クロスバック標識に近づいている
  answer: B
  explanation: 黒字で「RR」と書かれ、「X」の記号が描かれた黄色の標識は踏切警告標識であり、前方に踏切があるため注意し、停止する準備をすべきであることを意味します。
- id: 257
  category: signs_and_signals
  question: 踏切にあるクロスバック標識はどのような形をしていますか？
  choices:
    A: 円形
    B: ひし形
    C: 「X」型
    D: 八角形
  answer: C
  explanation: クロスバック標識は、マニュアルにおいて「RAILROAD CROSSING（踏切）」と印字された「X」型の標識として説明されています。
- id: 258
  category: defensive_driving
  question: 接近する電車の距離と速度を判断する際、覚えておくべきことは次のうちどれですか？
  choices:
    A: 電車は通常、見かけよりも遅く動いている
    B: 電車はあなたが思っているよりも近く、速く動いている
    C: 電車は線路上に車両を見つければすぐに停止できる
    D: 電車は姿が見える前に必ず警笛を鳴らす
  answer: B
  explanation: マニュアルでは運転手に対し、「見えている電車はあなたが思っているよりも近く、速く動いていることを覚えておき、電車は急には止まれないことを認識してください」と助言しています。
- id: 259
  category: alcohol_drugs_health
  question: 運転能力が低下した状態での運転を避けるための推奨される対策は、次のうちどれですか？
  choices:
    A: 運転する前にコーヒーをたくさん飲む
    B: アルコール飲料とノンアルコール飲料を交互に飲む
    C: 高速道路ではなく一般道のみを運転する
    D: 眠気を防ぐために窓を開けておく
  answer: B
  explanation: トラブルを避けるため、マニュアルでは「ゆっくり飲むこと。アルコール飲料とノンアルコール飲料を交互に飲むこと」を推奨しています。
- id: 260
  category: safe_driving_rules
  question: どのような状況下で踏切を通過しようとするべきですか？
  choices:
    A: 車両全体がすべての線路を完全に通過できると確信できる場合のみ
    B: 前の車が通過し始めたときはいつでも
    C: 電車が100フィート以上離れている場合
    D: 踏切に点滅信号がない場合
  answer: A
  explanation: マニュアルでは次のように警告しています。「いかなる状況においても、車両全体がすべての線路を完全に通過できると確信できない限り、踏切を通過しようとしないでください。」
- id: 261
  category: defensive_driving
  question: 車両が踏切内でエンストした場合、最初にすべきことは何ですか？
  choices:
    A: すぐにエンジンを再始動しようとする
    B: 全員を車から降ろし、線路から離れる
    C: 車内にとどまり、911に電話する
    D: 車を押して線路から出す
  answer: B
  explanation: 理由の如何を問わず踏切内でエンストした場合、たとえ列車が見えなくても、車内の全員を含めて「外に出る」こと、そして線路から離れることがマニュアルで義務付けられています。
- id: 262
  category: defensive_driving
  question: 車両が踏切内でエンストし、列車が接近している場合、どの方向に逃げるべきですか？
  choices:
    A: 列車が進行しているのと同じ方向に線路沿いを走る
    B: 線路から90度の角度で真っ直ぐ離れる
    C: 列車に向かって、線路から45度の角度で離れる
    D: 列車の進行方向とは逆の方向に線路と平行に走る
  answer: C
  explanation: 列車が接近している場合は、列車に向かって、線路から45度の角度で離れるように走ります。列車と同じ方向に走ると、列車が車両に衝突した際に飛散物に当たる危険があります。
- id: 263
  category: sharing_the_road
  question: 次のうち、すべての踏切で一時停止が義務付けられている車両はどれですか？
  choices:
    A: 子供を乗せた乗用車
    B: オートバイ
    C: 乗客の有無にかかわらずスクールバス
    D: 配達用トラック
  answer: C
  explanation: 乗客の有無にかかわらないスクールバス、乗客を乗せたその他のバス、および爆発物や引火性の貨物を積んだ車両は、すべての踏切で一時停止しなければなりません。
- id: 264
  category: safe_driving_rules
  question: 意図した方向とは違う方向の高速道路（エクスプレスウェイ）に入ってしまった場合、どうすべきですか？
  choices:
    A: 入口のランプ（合流車線）を慎重にバックする
    B: 交通の切れ目があるときに中央分離帯を横切る
    C: 路肩に寄せてUターンする
    D: 次の出口まで高速道路を走り続ける
  answer: D
  explanation: 意図した方向とは違う方向の高速道路に入ってしまった場合や、間違った出口に入ってしまった場合は、次の出口まで高速道路を走り続けてください。入口のランプをバックしたり、中央分離帯を横切ったりするのは危険です。
- id: 265
  category: safe_driving_rules
  question: 高速道路の入口車線が短すぎて高速道路の速度まで加速できない場合、最も安全な進入方法は何ですか？
  choices:
    A: 無理やり右車線に割り込む
    B: 停止して交通の大きな切れ目を待ち、その後急加速する
    C: 高速道路の速度に達するまで路肩を走行する
    D: 他の運転手が道を譲るようにクラクションを鳴らす
  answer: B
  explanation: 入口車線が短すぎて高速道路の速度まで加速できない場合、最も安全な進入方法は、停止して交通の大きな切れ目を待ち、その後高速道路に進入して急加速することです。
- id: 266
  category: safe_driving_rules
  question: 高速道路の出口ランプに到達する前に、どれくらい手前で出口の合図（ウィンカー）を出さなければなりませんか？
  choices:
    A: 少なくとも50フィート
    B: 少なくとも100フィート
    C: 少なくとも200フィート
    D: 少なくとも500フィート
  answer: B
  explanation: 出口ランプに到達する少なくとも100フィート（30m）手前で、必ず出口の合図を出してください。
- id: 267
  category: defensive_driving
  question: ヘッドライトの「照射範囲内で運転する」とはどういう意味ですか？
  choices:
    A: ヘッドライトが照らす距離の範囲内で安全に停止できる速度で運転すること
    B: ヘッドライトを路面に向けたままにすること
    C: 時速40マイル以上で走行する際は常にハイビームを使用すること
    D: 前方の車両から350フィート以内の距離を保つこと
  answer: A
  explanation: ヘッドライトは前方約350フィートを照らします。その距離の範囲内で安全に停止できる速度で運転することが重要です。これをヘッドライトの「照射範囲内で運転する」と呼びます。
- id: 268
  category: safe_driving_rules
  question: 法律により、どの時間帯にヘッドライトを使用しなければなりませんか？
  choices:
    A: 日没から日の出まで
    B: 日没の30分後から日の出の30分前まで
    C: 街灯がない場合のみ
    D: 日没の1時間後から日の出の1時間前まで
  answer: B
  explanation: 法律では、日没の30分後から日の出の30分前まで、視界が1,000フィート未満の場合、およびワイパーを使用する場合には、ヘッドライトの使用が義務付けられています。
- id: 269
  category: safe_driving_rules
  question: 対向車からどれくらいの距離以内に近づいた場合、ヘッドライトをロービームに下げなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: D
  explanation: 対向車から500フィート（150m）以内に近づいた場合は、ヘッドライトをロービームにしなければなりません。
- id: 270
  category: defensive_driving
  question: 接近してくる車両のハイビームの眩しさを避けるために、どうすべきですか？
  choices:
    A: 連続してハイビームを点滅させる（パッシングする）
    B: 車両が通り過ぎるまで片目を閉じる
    C: 視線を右に移し、道路の端をガイドとして使用する
    D: 車内のルームランプを点灯させる
  answer: C
  explanation: 接近してくるハイビームの眩しさを避けるには、視線を右に移します。接近してくる車両が通り過ぎるまで、道路の端をガイドとして使用してください。
- id: 271
  category: vehicle_information
  question: 「ハイドロプレーニング現象」とは何ですか？
  choices:
    A: 雨天時に車のブレーキが凍結すること
    B: タイヤが路面の上の水膜に乗って滑り出すこと
    C: 霧と雨が混ざり合って視界がゼロになること
    D: ワイパーが激しい雨に追いつかなくなること
  answer: B
  explanation: 激しい雨の中では、タイヤが路面の上の水膜に乗って滑り出すことがあります。これを「ハイドロプレーニング現象」と呼び、タイヤの摩擦力とハンドルのコントロールを完全に失う原因となります。
- id: 272
  category: safe_driving_rules
  question: 雨、霧、または雪の際に視界を良くするためには、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: デイタイムランニングライト（昼間点灯灯）
    D: パーキングライト（車幅灯）
  answer: B
  explanation: ハイビームのヘッドライトは、降っている雨、霧、雪に反射して視界を悪くします。これらの気象条件で視界を良くするためには、ヘッドライトをロービームにしておきます。
- id: 273
  category: safe_driving_rules
  question: ニューヨーク州法では、気象条件により何を使用する必要がある場合にヘッドライトを点灯することが義務付けられていますか？
  choices:
    A: ワイパー
    B: デフロスター
    C: フォグランプ
    D: ハザードランプ
  answer: A
  explanation: ニューヨーク州法では、雨、雪、みぞれ、または霧を取り除くためにワイパーを使用する必要がある気象条件の場合、ヘッドライトを点灯することが義務付けられています。
- id: 274
  category: vehicle_information
  question: 冬の運転に向けて車を準備する際、絶対に使用してはいけないタイヤの組み合わせはどれですか？
  choices:
    A: スノータイヤとオールシーズンタイヤ
    B: ラジアルタイヤとバイアスタイヤ（非ラジアルタイヤ）
    C: スパイクタイヤとスタッドレスタイヤ（非スパイクタイヤ）
    D: 幅の広いタイヤと狭いタイヤ
  answer: B
  explanation: 冬の天候が到来する前に、車が良好な状態であることを確認してください。同じ車にラジアルタイヤとバイアスタイヤ（非ラジアルタイヤ）を絶対に組み合わせて使用しないでください。
- id: 275
  category: vehicle_information
  question: ニューヨーク州で金属製スタッド付きタイヤ（スパイクタイヤ）の合法的な使用が許可されている期間はいつですか？
  choices:
    A: 11月1日から4月1日まで
    B: 10月16日から4月30日まで
    C: 9月1日から5月31日まで
    D: 一年中違法である
  answer: B
  explanation: マニュアルによると、ニューヨーク州では金属製スタッド付きタイヤ（スパイクタイヤ）は10月16日から4月30日までの期間のみ使用できます。
- id: 276
  category: vehicle_information
  question: 車のタイヤの使用に関する規則は、次のうちどれですか？
  choices:
    A: 冬のトラクションを向上させるために、ラジアルタイヤとバイアスタイヤ（非ラジアルタイヤ）を組み合わせるべきである。
    B: 同じ車にラジアルタイヤとバイアスタイヤ（非ラジアルタイヤ）を絶対に組み合わせてはならない。
    C: スノータイヤは前輪にのみ装着すべきである。
    D: 冬季はすべてのタイヤに金属製スタッドを使用しなければならない。
  answer: B
  explanation: マニュアルには「同じ車にラジアルタイヤとバイアスタイヤ（非ラジアルタイヤ）を絶対に組み合わせてはならない」と明記されています。
- id: 277
  category: defensive_driving
  question: 車の後輪が左に横滑り（スキッド）し始めた場合、どうすべきですか？
  choices:
    A: 右にハンドルを切る。
    B: 左にハンドルを切る。
    C: ハンドルを完全にまっすぐに保つ。
    D: すぐに急ブレーキをかける。
  answer: B
  explanation: 後輪の横滑りから回復するには、車が向かおうとしている方向にハンドルを切る必要があります。後輪が左に滑った場合は、左にハンドルを切ります。
- id: 278
  category: defensive_driving
  question: 前輪が横滑り（スキッド）し始めた場合、最初に取るべき行動は何ですか？
  choices:
    A: 横滑りしている方向にハンドルを急に切る。
    B: ブレーキを素早くポンピングする。
    C: アクセルから足を離し、ギアをニュートラルに入れる。
    D: トラクションを取り戻すために加速する。
  answer: C
  explanation: 前輪が横滑りした場合、マニュアルではアクセルから足を離し、ギアをニュートラルに入れるかクラッチを踏み込むよう推奨していますが、すぐにハンドルを切ろうとしてはいけません。
- id: 279
  category: safe_driving_rules
  question: みぞれや着氷性の雨が降り始めたとき、道路のどの部分が最初に凍結しやすいですか？
  choices:
    A: 交差点と横断歩道
    B: トンネルと地下道
    C: 橋、ランプ（出入口）、高架橋
    D: 交通量の多い多車線高速道路
  answer: C
  explanation: みぞれ、着氷性の雨、または雪が降り始めたときは、橋、ランプ（出入口）、高架橋が最初に凍結することを覚えておいてください。
- id: 280
  category: defensive_driving
  question: 鹿の活動が最も活発になり、衝突のリスクが高まるのは1日のうちどの時間帯ですか？
  choices:
    A: 正午と午後早い時間
    B: 深夜
    C: 夜明けと夕暮れ
    D: 朝のラッシュアワーのみ
  answer: C
  explanation: 1日のうち鹿の活動が最も活発になるのは夜明けと夕暮れ時であり、これは自動車通勤者の移動が最も多い時間帯と重なることがよくあります。
- id: 281
  category: defensive_driving
  question: 運転中にタイヤがパンク（バースト）した場合はどうすればよいですか？
  choices:
    A: 急ブレーキをかけ、急ハンドルを切って道路から外れる。
    B: ハンドルをしっかりと握り、ゆっくりとアクセルペダルから足を離す。
    C: 車のコントロールを保つために少し加速する。
    D: 車が止まるまでブレーキを素早くポンピングする（踏み込む）。
  answer: B
  explanation: タイヤがパンク（バースト）した場合は、ハンドルをしっかりと握り、ゆっくりとアクセルペダルから足を離します。車のコントロールができるようになるまでブレーキをかけてはいけません。
- id: 282
  category: defensive_driving
  question: 車のハンドルが突然効かなくなった場合、最初にブレーキペダルから足を離したままにすべきなのはなぜですか？
  choices:
    A: ブレーキをかけるとエンジンがエンストするから。
    B: 急激な速度変化により、車がコントロールを失う可能性があるから。
    C: ブレーキがステアリングコラムに接続されているから。
    D: パワーステアリングフルードの圧力を回復させるために加速する必要があるから。
  answer: B
  explanation: ハンドルの故障時、車のバランスによりそのまま直進し続けることができますが、ブレーキなどの急激な速度変化は車をコントロール不能にする可能性があります。
- id: 283
  category: defensive_driving
  question: アクセルペダルが戻らなくなった（引っかかった）場合、イグニッション（エンジン）を切ってはいけないのはなぜですか？
  choices:
    A: エンジンから出火する原因になるから。
    B: ハンドルのコントロールを失うか、ハンドルがロックされる可能性があるから。
    C: ブレーキがすぐにロックされるから。
    D: 車がさらに加速するから。
  answer: B
  explanation: アクセルペダルが戻らなくなった場合、ハンドルのコントロールを失ったり、ハンドルがロックされたりする可能性があるため、イグニッションを切ってはいけません。
- id: 284
  category: defensive_driving
  question: 誤って車輪が舗装路から外れてしまった場合、取るべき正しい行動は何ですか？
  choices:
    A: すぐに急ハンドルを切って舗装路に戻る。
    B: 加速して車輪を道路に戻す。
    C: アクセルペダルからゆっくりと足を離し、優しくブレーキをかける。
    D: 急ブレーキをかけ、路肩で完全に停止する。
  answer: C
  explanation: 車輪が舗装路から外れた場合は、急にハンドルを切ったり、急に進路を変えて舗装路に戻ろうとしたりしないでください。アクセルペダルからゆっくりと足を離し、優しくブレーキをかけます。
- id: 285
  category: defensive_driving
  question: 対向車が自分の車線に進入して正面から向かってくる場合、どうすればよいですか？
  choices:
    A: 左車線に急ハンドルを切って避ける。
    B: 減速し、右側に寄せてクラクションを鳴らす。
    C: 自分の車線ですぐに停止し、ヘッドライトを点滅させる。
    D: 加速して左にハンドルを切る。
  answer: B
  explanation: 対向車が自分の車線に進入して正面から向かってくる場合は、減速し、右側に寄せてクラクションを鳴らし、相手の運転手に警告します。左車線に進路を変えてはいけません。
- id: 286
  category: defensive_driving
  question: 車が水没した場合、ドアを開けるのではなく窓から脱出すべきなのはなぜですか？
  choices:
    A: 水圧でドアハンドルがロックされるから。
    B: ドアを開けると水が流れ込み、車が転覆する可能性があるから。
    C: 窓の方が大きな脱出経路になるから。
    D: ドアを開けるとエアバッグが作動するから。
  answer: B
  explanation: 水没した車から脱出する際は、シートベルトを外し、窓から脱出してください。ドアを開けると水が流れ込み、車が転覆して下敷きになる可能性があります。
- id: 287
  category: defensive_driving
  question: 車のボンネットの下から煙が出ているのを見た場合、どうすればよいですか？
  choices:
    A: すぐにボンネットを開けて火元を特定する。
    B: 最寄りの消防署まで急いで運転する。
    C: 道路脇に車を停め、イグニッションを切り、車から離れて消防署に連絡する。
    D: ウィンドウォッシャー液を使って火を消す。
  answer: C
  explanation: ボンネットの下から煙が出ているのを見た場合は、道路脇に車を寄せて駐車します。イグニッションを切ります。車から離れ、消防署に連絡してください。自分で消火しようとするのは危険です。
- id: 288
  category: vehicle_information
  question: アンチロック・ブレーキ・システム（ABS）を装備した車で、後輪のスリップ（スキッド）から回復するにはどのようにブレーキをかけるべきですか？
  choices:
    A: ブレーキペダルを素早くポンピングする（踏み込む）。
    B: ブレーキペダルに一定の圧力をかけたまま足を踏み続ける。
    C: 急ブレーキと解除を繰り返す。
    D: ブレーキペダルには一切触れない。
  answer: B
  explanation: アンチロック・ブレーキ・システム（ABS）を装備した車の場合、スリップ（スキッド）中はブレーキペダルに一定の圧力をかけたまま足を踏み続けてください。ペダルのポンピングはABS非搭載車のみに行う操作です。
- id: 289
  category: safe_driving_rules
  question: 近くに子供がいる場合、私道（ドライブウェイ）にバックで入る、またはバックで出る前にどうすればよいですか？
  choices:
    A: バックミラーのみを頼りにする。
    B: 動く前にクラクションを3回鳴らす。
    C: 車から降りて車の後ろを確認する。
    D: 私道にいる時間を最小限にするために素早く加速する。
  answer: C
  explanation: マニュアルには、近くに子供がいる場合、私道にバックで入る、またはバックで出る前に、車から降りて車の後ろを確認するべきであり、ミラーだけに頼ってはいけないと記載されています。
- id: 290
  category: sharing_the_road
  question: 歩道がない場合、歩行者は道路をどのように歩くべきですか？
  choices:
    A: 交通の進行方向と対面する側の道路端を歩く。
    B: 交通の進行方向と同じ方向の道路端を歩く。
    C: 車線の中央を歩く。
    D: 交通の方向に関係なく、右側の路肩を歩く。
  answer: A
  explanation: マニュアルによると、歩行者は道路の端を歩き、最も近い車線の交通と対面するように歩くことになっています。
- id: 291
  category: sharing_the_road
  question: 盲導犬を連れている、または白杖をついて横断している視覚障害のある歩行者には、いつ優先権を譲らなければなりませんか？
  choices:
    A: 標示のある横断歩道にいる場合のみ。
    B: 交通信号が歩行者側で青の場合のみ。
    C: 交通信号が歩行者側で青でなくても、常に。
    D: 日中のみ。
  answer: C
  explanation: 特別な優先権の法律により、盲導犬を連れている、または白（または金属製）の杖をついて横断している視覚障害のある歩行者に対しては、たとえ交通信号が歩行者側で青でなくても、運転者は常に優先権を譲ることが義務付けられています。
- id: 292
  category: sharing_the_road
  question: 法律によると、歩行者がヒッチハイクをするために立ってもよい場所はどこですか？
  choices:
    A: 高速道路の路肩。
    B: 中央分離帯のある幹線道路の中央分離帯。
    C: 反射材のついた衣服を着用している限り、道路上。
    D: 歩行者がヒッチハイクのために道路上に立つことは決して許可されていない。
  answer: D
  explanation: 法律により、歩行者がヒッチハイクや運転手との商取引のために道路上に立つことは固く禁じられています。
- id: 293
  category: defensive_driving
  question: ニューヨーク市において、歩行者が負傷する事故の35%以上は、運転手のどのような操作中に発生していますか？
  choices:
    A: 縦列駐車。
    B: 左折。
    C: 右折。
    D: 私道からのバックでの退出。
  answer: B
  explanation: マニュアルでは、左折は非常に危険な操作になり得ると指摘しており、ニューヨーク市における歩行者負傷事故の35%以上が、運転手が左折しようとしている時に発生していると記されています。
- id: 294
  category: safe_driving_rules
  question: 横断歩道で停止している車両に近づいた場合、どうするべきですか？
  choices:
    A: その車両の左側をゆっくりと追い越す。
    B: クラクションを鳴らして運転手に動くよう警告する。
    C: 歩行者が横断している可能性があるため、絶対にその車両を追い越さない。
    D: 十分なスペースがあれば、その車両の右側を追い越す。
  answer: C
  explanation: マニュアルには次のように明記されています。「横断歩道で停止している車両を絶対に追い越してはいけません。死角で人が横断している可能性があります。」
- id: 295
  category: vehicle_information
  question: 車両のAピラー（フロントガラス両脇の支柱）は、運転にどのような影響を与える可能性がありますか？
  choices:
    A: 周辺視野を向上させる。
    B: 明確な視界を妨げる死角を作り出す可能性がある。
    C: 対向車のヘッドライトの眩しさを軽減するのに役立つ。
    D: 視認性を高めるためにミラーを自動的に調整する。
  answer: B
  explanation: 運転者は、車両のAピラー（ガラスの周囲にある垂直の支柱）が明確な視界を妨げ、死角を作り出す可能性があるため、注意を払う必要があります。
- id: 296
  category: sharing_the_road
  question: 自転車は道路上をどの方向に走行することが義務付けられていますか？
  choices:
    A: 対向車に向かって走行する。
    B: 自動車と同じ方向に走行する。
    C: 交通量が最も少ない方向に走行する。
    D: 常に道路の左側を走行する。
  answer: B
  explanation: マニュアルには、自転車には道路を共有する権利があり、自動車と同じ方向に走行しなければならないと記載されています。
- id: 297
  category: sharing_the_road
  question: 自転車を追い越す際に速度を落とすべきなのはなぜですか？
  choices:
    A: 水しぶきをかけないようにするため。
    B: 自転車は追い越される際に停止することが義務付けられているため。
    C: 車両が高速で通過する際の風圧で、自転車のバランスを崩す可能性があるため。
    D: 自転車が牽引のためにあなたの車両に掴まれるようにするため。
  answer: C
  explanation: 車両が高速で通過する際の風圧で自転車のバランスを崩す可能性があるため、運転者は自転車を追い越す際に十分なスペースを空け、速度を落とす必要があります。
- id: 298
  category: sharing_the_road
  question: 単一の車線内で並走できる自転車の最大人数は何人ですか？
  choices:
    A: 1人。
    B: 2人。
    C: 3人。
    D: 4人。
  answer: B
  explanation: 自転車は、単一の車線内で3人以上並んで走行してはなりません（最大2人まで）。
- id: 299
  category: safe_driving_rules
  question: ニューヨーク州法によると、承認されたヘルメットの着用が義務付けられている自転車の運転者および同乗者の年齢層はどれですか？
  choices:
    A: 1歳から13歳。
    B: 5歳から16歳。
    C: 10歳から18歳。
    D: 州法により全年齢に義務付けられている。
  answer: A
  explanation: マニュアルには、1歳から13歳の自転車の運転者および同乗者は、承認されたヘルメットを着用しなければならないと記載されています。
- id: 300
  category: safe_driving_rules
  question: 自転車の運転者が1歳未満の乳児を同乗させることができるのは、どのような条件の下ですか？
  choices:
    A: 乳児が取り付けられた自転車用安全シートに乗っている場合。
    B: 乳児が承認されたヘルメットを着用している場合。
    C: 自転車の運転者が指定された自転車専用レーンを走行している場合。
    D: いかなる条件でも不可。法律違反である。
  answer: D
  explanation: マニュアルには、1歳未満の乳児を同乗させることは法律違反であり、自転車の運転者は決して行ってはならないと明記されています。
- id: 301
  category: driver_responsibility
  question: 自転車の事故で死亡または重傷を負った場合、何日以内にDMV（車両管理局）に報告しなければなりませんか？
  choices:
    A: 3日。
    B: 5日。
    C: 10日。
    D: 30日。
  answer: C
  explanation: 死亡または重傷を伴う自転車事故はすべて、事故発生から10日以内にDMVに報告しなければなりません。
- id: 302
  category: vehicle_information
  question: 公道で自転車を運転する場合、少なくともどのくらい離れた場所から聞こえる警音器（ホーンまたはベル）を装備しなければなりませんか？
  choices:
    A: 50フィート。
    B: 100フィート。
    C: 200フィート。
    D: 500フィート。
  answer: B
  explanation: 公道で自転車を運転する場合は、適切なブレーキと、少なくとも100フィート（30メートル）離れた場所から聞こえる警音器（ホーンまたはベル）を装備しなければなりません。
- id: 303
  category: vehicle_information
  question: 夜間に自転車を使用する場合、どのような照明設備が必要ですか？
  choices:
    A: 前方100フィートから見えるヘッドライトと、後方100フィートから見える赤色のテールライト。
    B: 前方300フィートから見えるヘッドライトと、後方500フィートから見える赤色のテールライト。
    C: 前方500フィートから見えるヘッドライトと、後方300フィートから見える赤色のテールライト。
    D: 夜間はスポークに取り付けられた反射板のみが必要です。
  answer: C
  explanation: 夜間に自転車を使用する場合は、少なくとも前方500フィートから見えるヘッドライトと、少なくとも後方300フィートから見える赤色のテールライトを装備しなければなりません。
- id: 304
  category: sharing_the_road
  question: 赤信号で右折する際、自転車との衝突を避けるために運転者は何をすべきですか？
  choices:
    A: 右折する前にクラクションを鳴らして自転車に警告する。
    B: 完全に停止し、左・右・左、そして後方を確認する。
    C: 右を見ながらゆっくりと交差点を通過する。
    D: 横断歩道上の歩行者にのみ道を譲る。
  answer: B
  explanation: マニュアルには、右後方から接近する自転車との衝突を避けるため、「赤信号で右折する前に完全に停止し、左・右・左、そして後方を確認する」と記載されています。
- id: 305
  category: signs_and_signals
  question: 道路上の「バイクボックス（Bike Box）」の目的は何ですか？
  choices:
    A: 自転車専用の駐輪場である。
    B: 交差点において、車両の停止線より前方に設けられた、自転車に余分なスペースを提供するための標示エリアである。
    C: シェアシティサイクルの保管コンテナである。
    D: 原動機付キックボード専用の車線である。
  answer: B
  explanation: マニュアルでは、バイクボックスを「交差点において、車両が停止すべき位置より前方に設けられた標示エリア。このエリアは自転車に余分なスペースを提供する」と定義しています。
- id: 306
  category: signs_and_signals
  question: 緑色に塗装された自転車レーンの目的は何ですか？
  choices:
    A: 自転車が進入禁止のエリアを示すため。
    B: 交通量の多い一部のエリアで、自転車の視認性を高めるため。
    C: 歩行者が自転車よりも優先権を持つ場所を示すため。
    D: 自転車用の一時的な迂回ルートを示すため。
  answer: B
  explanation: マニュアルには、「緑色に塗装された自転車レーンは、交通量の多い一部のエリアで自転車の視認性を高めるために使用される」と記載されています。
- id: 307
  category: sharing_the_road
  question: オートバイの車線共有（レーンシェアリング）に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: オートバイは乗用車と車線を共有できる。
    B: 2台のオートバイが同じ車線内で並走することが許可されている。
    C: オートバイは常に1列で走行しなければならない。
    D: オートバイは車線の全幅を使用することが許可されていない。
  answer: B
  explanation: マニュアルには、「オートバイは車線全体を使用することに加え、2台のオートバイが同じ車線内で並走することが許可されている。ただし、オートバイ以外の他の自動車を追い越したり、車線を共有したりすることはできない」と記載されています。
- id: 308
  category: defensive_driving
  question: オートバイのサイズが小さいことは、運転者の認識にどのような影響を与えますか？
  choices:
    A: オートバイが実際よりも遅く動いているように見えさせる。
    B: オートバイがどれくらい離れているか、またはどれくらいの速度で走っているかを判断するのを難しくする。
    C: オートバイのヘッドライトをより明るく見えさせる。
    D: オートバイの正確な車線位置を判断しやすくする。
  answer: B
  explanation: マニュアルによると、「オートバイはサイズが小さいため、実際よりもずっと遠くにいるように見え、どれくらい離れているか、またはどれくらいの速度で走っているかを判断するのが難しくなる」とされています。
- id: 309
  category: vehicle_information
  question: 運転手に曲がる意図がないにもかかわらず、オートバイの方向指示器（ウィンカー）が点滅していることがあるのはなぜですか？
  choices:
    A: オートバイの方向指示器は、安全のために継続的に点滅するように設計されているから。
    B: ほとんどのオートバイの方向指示器は、曲がった後に自動でオフにならないから。
    C: 運転手が減速していることを示しているから。
    D: オートバイに電気的な不具合が発生しているから。
  answer: B
  explanation: マニュアルでは、「ほとんどのオートバイでは、曲がった後に方向指示器が自動でオフにならないため、運転手に曲がる意図がなくても、うっかり方向指示器がついたままになっていることがある」と説明されています。
- id: 310
  category: sharing_the_road
  question: 米国国家道路交通安全局（NHTSA）によると、オートバイの死亡事故のかなりの割合を占めているのは次のうちどれですか？
  choices:
    A: オートバイが停止しているトラックに追突する事故。
    B: オートバイが直進または追い越しをしている際に、他の車両が左折する事故。
    C: オートバイが浮き砂利でコントロールを失う事故。
    D: 他の車両が赤信号で一時停止せずに右折する事故。
  answer: B
  explanation: マニュアルには、2015年に米国で発生したオートバイの死亡事故の41%が、「オートバイが直進、通過、または他の車両を追い越している際に、他の車両が左折した」ことによって発生したと記されています。
- id: 311
  category: vehicle_information
  question: オートバイのブレーキランプが、車のブレーキランプに比べて他の運転手から見えにくいことが多いのはなぜですか？
  choices:
    A: 点灯し続けるのではなく、高速で点滅するから。
    B: 目の高さより低い位置に取り付けられており、ハイマウントストップランプ（中央高位置のブレーキランプ）がないから。
    C: 通常、オートバイの色に合わせて上塗りされているから。
    D: フロントブレーキをかけたときにしか点灯しないから。
  answer: B
  explanation: マニュアルには、ほとんどの車には目の高さに「ハイマウントストップランプ」があるのに対し、「ほとんどのオートバイのブレーキランプは目の高さより低い位置に取り付けられているため、多くの運転手にとって見えにくくなっている」と記載されています。
- id: 312
  category: defensive_driving
  question: オートバイの運転手が急に速度や車線内の位置を変えることがあるのはなぜですか？
  choices:
    A: 浮き砂利、落下物、または舗装の継ぎ目を避けるため。
    B: 他のオートバイの運転手とコミュニケーションをとるため。
    C: タイヤを温めるため。
    D: 後続の速い車を意図的に妨害するため。
  answer: A
  explanation: マニュアルでは、オートバイの運転手は「浮き砂利、落下物、舗装の継ぎ目や溝、下水道やマンホールの蓋、または小動物を避けるために、急に速度や車線内の位置を変えることがある」と警告しています。
- id: 313
  category: sharing_the_road
  question: 道路上において、自転車に乗る人にはどのような権利と責任がありますか？
  choices:
    A: 交通信号に関係なく、常に優先権がある。
    B: 自動車を運転する人と同じ権利と責任がある。
    C: 常に自動車に道を譲らなければならない。
    D: 歩道および指定された専用道でのみ走行が許可されている。
  answer: B
  explanation: マニュアルには、「自転車に乗る人は、自動車を運転する人と同じ権利と責任を持つ」と明記されています。
- id: 314
  category: signs_and_signals
  question: 双方向サイクルトラック（2-way cycle track）とは何ですか？
  choices:
    A: オフロード自転車専用の未舗装の道。
    B: 自転車と車が反対方向に走行する共有車線。
    C: 双方向の通行が許可されている、標示のある自転車専用通行帯。
    D: オートバイと自転車専用に指定された幹線道路の車線。
  answer: C
  explanation: マニュアルでは、双方向サイクルトラックを「歩行者用の歩道と同様に、双方向の通行が許可されている、標示のある自転車専用通行帯」と定義しています。
- id: 315
  category: driver_responsibility
  question: インラインスケーター、スケートボーダー、および非電動キックボードと道路を共有する場合、自動車の運転手はどのように対応すべきですか？
  choices:
    A: 彼らが道路から退避するまでクラクションを鳴らし続ける。
    B: 常に意識し、警戒し、防衛運転を行うことで、十分な注意を払う。
    C: 歩道の利用を促すため、できるだけ彼らの近くを通り過ぎる。
    D: 彼らが常に自動車に優先権を譲ると想定する。
  answer: B
  explanation: マニュアルには、運転手としての責任は、インラインスケーター、スケートボーダー、非電動キックボードの周囲で「常に意識し、警戒し、防衛運転を行うことで、十分な注意を払う」ことであると記載されています。
- id: 316
  category: safe_driving_rules
  question: 道路脇に駐車した車から降りる前に、どのような予防措置をとるべきですか？
  choices:
    A: ハザードランプを少なくとも1分間点灯させる。
    B: 接近する車に警告するためにクラクションを鳴らす。
    C: 自転車の進路にドアを開けてしまわないよう、接近してくる自転車がいないか確認する。
    D: 車道にドアが出ている時間を最小限にするため、素早くドアを開ける。
  answer: C
  explanation: マニュアルでは、運転手に対し「駐車した車から降りる前に確認し、接近してくる自転車の進路にドアを開けないようにする」ようアドバイスしています。
- id: 317
  category: vehicle_information
  question: 日中のオートバイのヘッドライトに関する記述として、正しいものはどれですか？
  choices:
    A: 走行中は点灯させなければならないが、他の車のデイタイムランニングランプ（昼間点灯灯）に紛れて目立たないことがある。
    B: バッテリーを節約するため、日中は消灯することが法律で義務付けられている。
    C: 車と区別するために、特殊な点滅電球が装備されている。
    D: 悪天候時にのみ使用が義務付けられている。
  answer: A
  explanation: マニュアルには、「オートバイのヘッドライトとテールランプは走行中に点灯させなければならない。しかし、デイタイムランニングランプを装備した車が非常に多いため…オートバイのヘッドライトは目立たない」と記載されています。
- id: 318
  category: sharing_the_road
  question: 踏切に近づく際、オートバイの運転手はどのような行動をとることがありますか？
  choices:
    A: 線路を素早く渡るために加速する
    B: 減速し、シートから腰を浮かせる
    C: 対向車線に急ハンドルを切る
    D: 完全に停止し、オートバイを押して渡る
  answer: B
  explanation: マニュアルによると、踏切に近づく際、オートバイの運転手は、でこぼこした踏切の衝撃を和らげるために減速してシートから腰を浮かせたり、線路を直角に横切るために方向を変えたりすることがあります。
- id: 319
  category: sharing_the_road
  question: 鋼床版（スチールデッキ）の橋で、オートバイの運転手が車線の中央に移動することがあるのはなぜですか？
  choices:
    A: 後続の速い車を妨害するため
    B: 不均一な路面に対応するため
    C: Uターンの準備をするため
    D: 対向車のヘッドライトの眩しさを避けるため
  answer: B
  explanation: マニュアルには、鋼床版の橋では、オートバイの運転手は不均一な路面に対応するために車線の中央に移動することがあると記載されています。
- id: 320
  category: sharing_the_road
  question: クラスBおよびクラスCのモペッド（原動機付自転車）は、道路のどこを走行することが許可されていますか？
  choices:
    A: 任意の車線
    B: 高速道路の路肩のみ
    C: 右側車線のみで、できるだけ右端に寄って走行する
    D: 時速20マイル以上で走行する場合は左側車線
  answer: C
  explanation: クラスBおよびクラスCのモペッドは、右側車線のできるだけ右端、または路肩でのみ走行することができます。
- id: 321
  category: safe_driving_rules
  question: モペッド（原動機付自転車）は高速道路を走行できますか？
  choices:
    A: はい、ただし右車線のみです
    B: はい、クラスAのモペッドであれば可能です
    C: いいえ、標識で許可されていない限り走行できません
    D: いいえ、いかなる状況でも走行できません
  answer: C
  explanation: モペッドは、標識で許可されていない限り、高速道路やその他のアクセス制限のある幹線道路を走行することは許可されていません。
- id: 322
  category: sharing_the_road
  question: 乗用車と大型トラックが絡む死亡事故において、通常、事故の原因を作っているのは誰ですか？
  choices:
    A: トラックの運転手
    B: 乗用車の運転手
    C: 歩行者
    D: 道路維持作業員
  answer: B
  explanation: 乗用車と大型トラックが絡むすべての死亡事故の60%以上において、トラックの運転手ではなく乗用車の運転手が交通事故の原因を作っています。
- id: 323
  category: vehicle_information
  question: ボンネットが長いトラクター（牽引車）の前方にある死角は、最大でどのくらいの広さになりますか？
  choices:
    A: 5フィート
    B: 10フィート
    C: 20フィート
    D: 50フィート
  answer: C
  explanation: ボンネットが長いトラクターは、車両の前方に20フィートの死角ができることがあり、運転者はその範囲に入るのを避けるべきです。
- id: 324
  category: vehicle_information
  question: トラクター・トレーラー（牽引自動車）が小型車両よりも停止するのにはるかに長い時間がかかるのはなぜですか？
  choices:
    A: ブレーキパッドが小さいため
    B: エアブレーキによるブレーキの遅れのため
    C: タイヤのトラクション（牽引力）が低いため
    D: 運転手の反応時間が遅いため
  answer: B
  explanation: トラクター・トレーラーの場合、停止距離の違いはブレーキの遅れから生じます。エアブレーキはトラクターからトレーラーへ制動力を伝達しますが、これにより停止するまでに必要な距離が何フィートも長くなることがあります。
- id: 325
  category: sharing_the_road
  question: 大型トラックが大きく右折する前に、よく行う操作は何ですか？
  choices:
    A: 左に寄る
    B: 大幅に加速する
    C: 右側の路肩に乗り上げる
    D: ハザードランプを点灯させる
  answer: A
  explanation: トラックは大きく右折するため、右折する前に左に寄ります。運転者はトラックの方向指示器（ウィンカー）に十分注意を払う必要があります。
- id: 326
  category: defensive_driving
  question: 接近してくるトラクター・トレーラーの速度を過小評価してはいけないのはなぜですか？
  choices:
    A: 制限速度を超えることが法的に許可されているため
    B: 車体が大きいため、実際よりも遅く動いているように見えるため
    C: 乗用車に接近する際は常に加速するため
    D: ヘッドライトが奥行き感を歪めるため
  answer: B
  explanation: 接近してくるトラクター・トレーラーの大きさと速度を過小評価しないでください。車体が大きいため、実際の速度よりも遅く動いているように見えることがよくあります。
- id: 327
  category: defensive_driving
  question: 坂道でトラックやバスの後ろに停止する際、余分に車間距離を空けるべきなのはなぜですか？
  choices:
    A: 近距離では排気ガスが有毒であるため
    B: 発進時に車両がわずかに後退する可能性があるため
    C: 運転手が後部ドアを開けるためのスペースが必要なため
    D: 歩行者が車両の間を横断できるようにするため
  answer: B
  explanation: 信号機や一時停止標識でトラックやバスの後ろに停止する際、特に上り坂の場合は常に車間距離を空けてください。トラックやバスは発進時にわずかに後退する可能性があります。
- id: 328
  category: signs_and_signals
  question: 「低速走行車両（slow-moving vehicle）」のシンボルはどのような見た目ですか？
  choices:
    A: 黄色のひし形
    B: 反射材のついたオレンジ色の三角形
    C: 赤色の八角形
    D: 白地の長方形に黒い文字
  answer: B
  explanation: 「低速走行車両」のシンボルは反射材のついたオレンジ色の三角形で、動物に引かれる車両、ほとんどの農業用車両、および建設機械の後部に表示することが義務付けられています。
- id: 329
  category: safe_driving_rules
  question: 全地形対応車（ATV）やスノーモービルは、州道をどのように横断しなければなりませんか？
  choices:
    A: 制限速度が45 mph未満の場合は停止せずに横断する
    B: 道路上にいる時間を最小限にするため、45度の角度で横断する
    C: 一時停止して道を譲り、90度の角度で横断する
    D: 指定された信号機のある場所でのみ横断する
  answer: C
  explanation: ATVやスノーモービルは、幹線道路を横断する前に一時停止し、他の交通に道を譲らなければなりません。また、路面に対して90度の角度で横断する必要があります。
- id: 330
  category: sharing_the_road
  question: 乗馬者は道路のどこを走行することが義務付けられていますか？
  choices:
    A: 車線の中央
    B: 右側の縁石または道路の端の近くを一列で走行する
    C: 左側の路肩を2頭並んで走行する
    D: 歩道のみ
  answer: B
  explanation: 乗馬者は交通規則に従う必要があり、右側の縁石や道路の端の近く、または利用可能な右側の路肩、車線、小道を一列で走行しなければなりません。
- id: 331
  category: vehicle_information
  question: クラスAの原動機付自転車（モペッド）の最高速度の範囲はどれくらいですか？
  choices:
    A: 20 mph以下
    B: 21〜30 mph
    C: 31〜40 mph
    D: 41〜50 mph
  answer: C
  explanation: 「原動機付自転車（モペッド）の運転ガイド」の表によると、クラスAのモペッドの最高速度の範囲は31〜40 mphです。
- id: 332
  category: defensive_driving
  question: 大型トラックが荷積みエリアにバックで入るために道路を塞いでいる場合、どうすべきですか？
  choices:
    A: クラクションを鳴らして運転手に知らせる
    B: トラックの後ろを素早く通り抜ける
    C: バックの操作が完了するまで辛抱強く待つ
    D: 歩道を走ってトラックを迂回する
  answer: C
  explanation: バックしている大型車両のすぐ後ろを通り抜けてはいけません。通り抜けようとして死角に入る危険を冒すよりも、大型車両がバックの操作を完了するまで辛抱強く待つ方がはるかに安全です。
- id: 333
  category: sharing_the_road
  question: 道路沿いで乗馬されている、または引かれている馬に近づいたり追い越したりする際、違法となる行為は何ですか？
  choices:
    A: 低速で馬を追い越す
    B: クラクションを鳴らす
    C: 車両と馬の間に十分な距離を空ける
    D: 優先権を譲る
  answer: B
  explanation: マニュアルには、馬に近づいたり追い越したりする際にクラクションを鳴らすことは違法であると記載されています。
- id: 334
  category: driver_responsibility
  question: 死亡または人身傷害を伴う交通事故の現場から立ち去ることは、どのような種類の違反になりますか？
  choices:
    A: 軽微な交通違反
    B: 民事制裁
    C: 走行中の交通違反
    D: 刑事違反
  answer: D
  explanation: 死亡または人身傷害を伴う事故の現場から立ち去ることは刑事違反です。
- id: 335
  category: driver_responsibility
  question: 事故で駐車中の車両を破損させたり、家畜やペットを負傷させたりした場合、何をしなければなりませんか？
  choices:
    A: フロントガラスにメモを残して走り去る
    B: 所有者を見つけるか、警察に通報する
    C: 15分待ち、誰も来なければ立ち去る
    D: 30日以内にDMVに報告する
  answer: B
  explanation: 駐車中の車両や車両以外の財産を破損させた場合、または家畜やペットを負傷させた場合は、所有者を見つけるか、警察に通報しなければなりません。
- id: 336
  category: safe_driving_rules
  question: 事故現場で負傷者を動かしてもよいのはどのような状況ですか？
  choices:
    A: 立ち上がるのを手伝ってほしいと頼まれた場合のみ
    B: 火災やその他の生命を脅かす危険があるため必要になった場合のみ
    C: 交通の妨げになっている場合はいつでも
    D: 現場に到着後すぐに、楽な姿勢にさせるため
  answer: B
  explanation: 火災やその他の生命を脅かす危険があるため必要にならない限り、負傷者を動かしてはいけません。
- id: 337
  category: safe_driving_rules
  question: 生命を脅かす危険から負傷者を遠ざけるために動かさなければならない場合、どのように引っ張るべきですか？
  choices:
    A: 腕を引っ張る
    B: 足を引っ張る
    C: 頭から先に引っ張る
    D: 横向きに引っ張る
  answer: C
  explanation: 手で衣服を掴み、背中と首をできるだけまっすぐに保ちながら、頭から先に危険から遠ざけるように引っ張ります。
- id: 338
  category: safe_driving_rules
  question: 事故現場で電線が車両に接触している場合、どうすべきですか？
  choices:
    A: 木の棒を使って電線を車両からどかす
    B: ドアを開けて乗員が素早く逃げられるように助ける
    C: 助けが来るまで車内に留まるよう乗員に警告する
    D: 丈夫な手袋をして電線を引っ張って遠ざける
  answer: C
  explanation: 電線が落ちている場合は、近づいてはいけません。電線が車両に接触しているか、近くに落ちている場合は、助けが来るまで車内に留まるよう乗員に警告してください。
- id: 339
  category: driver_responsibility
  question: 死亡、人身傷害、または1人につき少なくともいくら以上の財産的損害を伴う交通事故の場合、DMVに報告しなければなりませんか？
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: また、1人につき$1,000以上の財産的損害を伴う交通事故や衝突事故も報告しなければなりません。
- id: 340
  category: driver_responsibility
  question: 報告義務のある事故が発生した後、何日以内に事故報告書（MV-104）をDMVに提出しなければなりませんか？
  choices:
    A: 5日
    B: 10日
    C: 15日
    D: 30日
  answer: B
  explanation: 事故発生から10日以内にDMVに報告書を提出しなければなりません。
- id: 341
  category: penalties_and_points
  question: DMV（車両管理局）への事故報告を怠った場合、どのような罰則が科される可能性がありますか？
  choices:
    A: 警告状
    B: 義務的な運転者再教育
    C: 運転免許証および/または車両登録の停止または取消し
    D: 信用情報への永久的な記録
  answer: C
  explanation: 事故報告を怠ることは刑事犯罪（軽犯罪）であり、運転免許証および/または車両登録、ならびに車両所有者の登録が停止または取消される可能性があります。
- id: 342
  category: driver_responsibility
  question: 運転者が負傷し、必要なDMV事故報告書を作成できない場合、誰が代わりに行うことができますか？
  choices:
    A: 警察官のみ
    B: 運転者の保険代理店のみ
    C: 同乗者または車両所有者
    D: 運転者の担当医師
  answer: C
  explanation: 運転者が負傷して報告書を作成できない場合は、同乗者または車両所有者が代わりに行うことができます。
- id: 343
  category: driver_testing
  question: 運転免許試験中に使用が許可されていない先進運転支援システム（ADAS）の機能は、次のうちどれですか？
  choices:
    A: バックアップ警告（後退時警告）
    B: ブラインドスポットモニター（死角監視）
    C: 自動縦列駐車
    D: 前方衝突警告
  answer: C
  explanation: 運転免許試験を受ける際、パーキングアシスト（自動縦列駐車）やクルーズコントロールなどの特定の安全機能を使用することは許可されていません。
- id: 344
  category: vehicle_information
  question: 車両の安全機能（ADAS）が正常に機能しない可能性があるのは、次のうちどの条件ですか？
  choices:
    A: 直線で平坦な道路
    B: 晴天時
    C: 雨、雪、氷、または霧の中
    D: 制限速度以下で走行している時
  answer: C
  explanation: 雨、雪、氷、霧、坂道、カーブなどの特定の条件下では、安全機能が正常に機能しない場合があることに注意してください。
- id: 345
  category: driver_testing
  question: マニュアルによると、運転免許試験中に作動させることが許可されている車両技術は、次のうちどれですか？
  choices:
    A: アダプティブ・クルーズ・コントロール
    B: 自動縦列駐車
    C: リア・クロス・トラフィック・アラート（後退時車両検知警報）
    D: 自動運転オートパイロット
  answer: C
  explanation: リア・クロス・トラフィック・アラートは、試験で許可されている警告システムにリストされています。アダプティブ・クルーズ・コントロールと自動縦列駐車は許可されていません。
- id: 346
  category: safe_driving_rules
  question: 先進運転支援システム（ADAS）を搭載した車両を運転する際、運転者の責任は何ですか？
  choices:
    A: 衝突を避けるために安全機能に完全に依存すること
    B: 常に運転操作に関与し、集中し続けること
    C: 運転前にすべての安全機能を無効にすること
    D: 高速道路では車両に自動でハンドル操作をさせること
  answer: B
  explanation: 安全機能は運転操作を支援するためのものであり、車両を自動で運転するためのものではありません。運転者は常に運転操作に関与し、集中し続けなければなりません。
- id: 347
  category: driver_testing
  question: 仮免許試験（permit testing）を提供していないと明記しているマンハッタンのDMVオフィスはどれですか？
  choices:
    A: ハーレム (Harlem)
    B: ミッドタウン・マンハッタン (Midtown Manhattan)
    C: ライセンス・エクスプレス (License Express)
    D: ロウアー・マンハッタン – グリニッジ・ストリート (Lower Manhattan – Greenwich St.)
  answer: C
  explanation: DMVのディレクトリによると、ニューヨークの西30丁目145番地にあるライセンス・エクスプレス（License Express）オフィスは、「仮免許試験なし（No
    permit testing）」と明記しています。
- id: 348
  category: driver_testing
  question: DMVのディレクトリによると、路上試験（ロードテスト）の予約をするために電話できる番号は何番ですか？
  choices:
    A: 1-(518)-402-2100
    B: 1-(518)-486-9786
    C: 1-(718)-477-4820
    D: 1-(518) 474-0774
  answer: A
  explanation: マニュアルには、路上試験の予約をするには、dmv.ny.govにアクセスするか、1-(518)-402-2100に電話することができると記載されています。
- id: 349
  category: vehicle_information
  question: 修理工場、ディーラー、または車検場に関する苦情がある場合、どの局に連絡すべきですか？
  choices:
    A: 運転者改善局 (Driver Improvement Bureau)
    B: 消費者・施設サービス局 (Bureau of Consumer & Facility Services)
    C: 金融セキュリティ局 (Financial Security Bureau)
    D: 権原サービス局 (Title Services Bureau)
  answer: B
  explanation: 修理工場、ディーラー、または車検場に関する苦情は、消費者・施設サービス局（Bureau of Consumer & Facility
    Services、電話：1-(518) 474-8943）に申し出てください。
- id: 350
  category: vehicle_information
  question: 排出ガス検査（Emissions Inspections）に関する具体的な質問がある場合、どの電話番号にかけるべきですか？
  choices:
    A: 1-(518)-473-0597
    B: 1-(518)-402-4838
    C: 1-(518) 474-0700
    D: 1-(518) 474-0774
  answer: A
