  explanation: マニュアルには次のように記載されています。「法律により、ナンバープレートまたは登録ステッカーを車両に1日でも使用した場合、登録料の払い戻しはできません。」
- id: 110
  category: driver_responsibility
  question: 自分のものではない駐車違反切符の請求を防ぐために、古い車両を下取りに出したり売却したりする前に何をすべきですか？
