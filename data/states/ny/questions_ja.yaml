    B: 厳格な排ガス検査を実施する。
    C: 車両の公正市場価格を確認する。
    D: 新しい車両識別番号（VIN）を発行する。
  answer: A
  explanation: マニュアルには明確に次のように記載されています。「DMVは、『再構築サルベージ（Rebuilt Salvage）』または類似の言葉で記載されたすべての車両について、登録または権利証を発行する前に、盗難部品が使われていないか検査しなければならない。」
- id: 106
  category: vehicle_information
  question: 個人売買で車両を購入する際、公正市場価格を下回る価格で販売された車両について、販売者が取引明細書（Statement of Transaction）の販売者側記入欄に記入しなかった場合、どうなりますか？
  choices:
