questions:
- id: 1
  category: driver_responsibility
  question: ニューヨーク州の臓器提供登録（Donate Life Registry）によると、1人の臓器提供者が救うことができる命は最大何人ですか？
  choices:
    A: 最大4人
    B: 最大6人
    C: 最大8人
    D: 最大10人
  answer: C
  explanation: マニュアルには、1人の臓器提供者が最大8人の命を救うことができると記載されています。
- id: 2
  category: license_system
  question: 他州の有効な運転免許証を所持している場合、ニューヨーク州で合法的に運転するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 17歳
  answer: C
  explanation: マニュアルによると、他州で免許を取得していても、16歳未満の人はニューヨーク州で運転することはできません。
- id: 3
  category: license_system
  question: ニューヨーク州の永住者（居住者）になってから、何日以内にニューヨーク州の運転免許証を取得する必要がありますか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: B
  explanation: ニューヨーク州に転入した運転者は、永住者（居住者）になってから30日以内に他州の運転免許証を返納し、ニューヨーク州の免許証を取得しなければなりません。
- id: 4
  category: penalties_and_points
  question: 運転免許証を改ざんまたは偽造した場合、どのような結果を招く可能性がありますか？
  choices:
    A: 車両局（DMV）からの警告状
    B: 義務的な社会奉仕活動
    C: 免許の停止または取消し、および刑事訴追
    D: ディフェンシブ・ドライビング・コース（安全運転講習）の受講義務
  answer: C
  explanation: 自動車関連の書類を改ざんまたは偽造することは犯罪であり、運転免許証の停止または取消し、および罰金や禁錮刑を伴う刑事訴追の原因となる可能性があります。
- id: 5
  category: license_system
  question: 運転手を除き、何人以上の乗客を乗せるために製造または使用される車両を運転する場合、商用運転免許証（CDL）が必要ですか？
  choices:
    A: 8人以上
    B: 10人以上
    C: 12人以上
    D: 15人以上
  answer: D
  explanation: 運転手を除き、15人以上の乗客を乗せるために製造または使用される車両を運転する場合は、商用運転免許証（CDL）が必要です。
- id: 6
  category: license_system
  question: 運転教育修了証明書（Certificate of Completion）なしでクラスD運転免許証（Operator license）を取得するための最低年齢は何歳ですか？
  choices:
    A: 16歳
    B: 17歳
    C: 18歳
    D: 21歳
  answer: C
  explanation: クラスD運転免許証の最低取得年齢は18歳ですが、運転教育修了証明書がある場合は17歳です。
- id: 7
  category: license_system
  question: 標準のクラスD運転免許証で運転できるモペッド（原動機付自転車）のクラスはどれですか？
  choices:
    A: クラスAのみ
    B: クラスBおよびCのモペッド
    C: クラスAおよびBのモペッド
    D: 二輪車免許がないとモペッドは運転できない
  answer: B
  explanation: マニュアルには、クラスDの運転免許証でクラスBおよびCのモペッドを運転できると記載されています。
- id: 8
  category: license_system
  question: クラスDJ（ジュニア・オペレーター）免許証を取得するための最低年齢は何歳ですか？
  choices:
    A: 15歳
    B: 16歳
    C: 17歳
    D: 18歳
  answer: B
  explanation: クラスDJ（ジュニア・オペレーター）免許証を取得するための最低年齢は16歳です。
- id: 9
  category: license_system
  question: タクシーやハイヤーなど、14人以下の乗客を乗せるように設計された車両で、有償で乗客を輸送するために必要な免許証のクラスはどれですか？
  choices:
    A: クラスC
    B: クラスD
    C: クラスE
    D: クラスM
  answer: C
  explanation: タクシー/ハイヤー用のクラスE免許証を取得すると、14人以下の乗客を乗せるように設計または使用される車両で、有償で乗客を輸送することができます。
- id: 10
  category: license_system
  question: 拡張運転免許証（Enhanced Driver License）は、どのような旅行においてパスポートの代わりに使用できますか？
  choices:
    A: ヨーロッパへの国際航空旅行
    B: カナダ、メキシコ、バミューダ、カリブ海諸国との陸路および海路での国境通過
    C: 世界中のあらゆる海外旅行
    D: クルーズ船による南米への旅行
  answer: B
  explanation: 拡張運転免許証（Enhanced Driver License）は、米国、カナダ、メキシコ、バミューダ、カリブ海諸国との陸路および海路での国境通過において、パスポートの代わりに使用することができます。
- id: 11
  category: license_system
  question: 製造業者が定める車両総重量定格（GVWR）が次の値を超える単一車両を運転するには、商用運転免許（CDL）が必要です：
  choices:
    A: 10,000ポンド
    B: 15,000ポンド
    C: 20,000ポンド
    D: 26,000ポンド
  answer: D
  explanation: 製造業者が定める車両総重量定格（GVWR）が26,000ポンドを超える車両を運転する場合は、商用運転免許（CDL）を取得する必要があります。
- id: 12
  category: license_system
  question: 複数の運転免許証の所持に関して、次のうち正しい記述はどれですか？
  choices:
    A: ニューヨーク州の免許証と他州の免許証を同時に所持することができる。
    B: ニューヨーク州の運転免許証と他州の運転免許証を同時に所持することは、ほとんどの場合違法である。
    C: 頻繁に運転するすべての州の免許証を所持することが義務付けられている。
    D: 合法的に最大2つの商用運転免許（CDL）を所持することができる。
  answer: B
  explanation: ほとんどの場合、ニューヨーク州の運転免許証と他州の運転免許証を同時に所持することは違法です。また、複数の商用運転免許（CDL）を所持することは連邦法および州法違反となります。
- id: 13
  category: license_system
  question: クラスDJ（ジュニアオペレーター）免許で運転できるのは、車両総重量定格（GVWR）が次の値以下の車両です：
  choices:
    A: 5,000ポンド
    B: 10,000ポンド
    C: 15,000ポンド
    D: 26,000ポンド
  answer: B
  explanation: ジュニアオペレーターのクラスDJ免許では、車両総重量定格（GVWR）が10,000ポンド以下の車両を運転することができます。
- id: 14
  category: license_system
  question: 次の車両を運転する場合、商用運転免許（CDL）を取得する必要があります：
  choices:
    A: いかなる量であっても商業用貨物を積載している
    B: 農業目的のみに使用される
    C: 連邦法によりプラカード（標識）の掲示が義務付けられている危険物を積載している
    D: 重量2,000ポンドのトレーラーを牽引している
  answer: C
  explanation: マニュアルには、連邦法によりプラカード（標識）の掲示が義務付けられている危険物を積載する車両を運転する場合、商用運転免許（CDL）を取得しなければならないと明記されています。
- id: 15
  category: license_system
  question: オートバイの免許と他の種類の運転免許を持っている場合、それらはどのように表示されますか？
  choices:
    A: 2つの別々の書類に表示される
    B: 両方のクラスが1つの書類に記載される
    C: どちらか1つだけを有効にするよう選択しなければならない
    D: オートバイの免許が他の免許に代わる
  answer: B
  explanation: マニュアルによると、オートバイの免許と他の種類の運転免許を持っている場合、両方のクラスが1つの書類に記載されます（例：「クラスDM」）。
- id: 16
  category: license_system
  question: REAL ID法によると、米国内を飛行するすべての航空旅客は、米国の空港の保安検査を通過するために何を提示しなければなりませんか？
  choices:
    A: 有効な米国パスポートのみ
    B: REAL ID、拡張運転免許証（Enhanced Driver License）、または連邦政府が認めるその他の身分証明書
    C: 標準的な州発行の運転免許証と出生証明書
    D: ソーシャルセキュリティーカードと公共料金の請求書
  answer: B
  explanation: 米国内を飛行するすべての航空旅客は、REAL ID、拡張運転免許証（Enhanced Driver License）、または連邦政府が定めたその他の認められる身分証明書を提示する必要があります。
- id: 17
  category: license_system
  question: 個人の家財を運ぶために使用されるRV車（キャンピングカー等）やレンタカーを運転する際、車両がどのような仕様を超える場合に自家用車「R」エンドースメント（条件追加）が必要になりますか？
  choices:
    A: GVWRが10,000ポンド、および/または長さが20フィート
    B: GVWRが18,000ポンド、および/または長さが30フィート
    C: GVWRが26,000ポンド、および/または長さが40フィート
    D: GVWRが32,000ポンド、および/または長さが50フィート
  answer: C
  explanation: 「R」エンドースメントは、個人の家財を運ぶために使用されるRV車および/またはレンタカーで、車両のGVWRが26,000ポンドを超える、および/または長さが40フィートを超える場合に必要となります。
- id: 18
  category: driver_testing
  question: 「R」エンドースメントを取得するための試験要件について、次のうち正しいものはどれですか？
  choices:
    A: 筆記試験と路上試験の両方に合格しなければならない。
    B: 筆記試験に合格しなければならないが、路上試験は不要である。
    C: 筆記試験は不要だが、路上試験に合格しなければならない。
    D: 筆記試験も路上試験も不要である。
  answer: C
  explanation: 「R」エンドースメントを取得するには、運転する車両と同じサイズおよび種類の車両で路上試験に合格する必要があります。マニュアルには「筆記試験は不要」と明記されています。
- id: 19
  category: driver_testing
  question: 「R」エンドースメントの路上試験には、誰が同乗しなければなりませんか？
  choices:
    A: 免許を持った自動車教習所の指導員。
    B: 18歳以上の免許を持った運転手。
    C: 21歳以上で、試験中に運転する車両に有効な免許を持っている運転手。
    D: 商用運転免許（CDL）を所持するDMVの職員。
  answer: C
  explanation: 路上試験には、21歳以上で、試験中に運転する車両に有効な免許を持っている運転手が同乗しなければなりません。
- id: 20
  category: license_system
  question: 最初のニューヨーク州運転免許証の有効期間はどのくらいですか？
  choices:
    A: ちょうど10年間
    B: 5年を超えない期間で、あなたの誕生日まで
    C: 8年を超えない期間で、あなたの誕生日まで
    D: 21歳になるまで
  answer: B
  explanation: 最初のニューヨーク州運転免許証は、5年を超えない期間で、あなたの誕生日を期限として発行されます。
- id: 21
  category: license_system
  question: 初めて運転免許証を申請する際、氏名を証明する書類を提示する必要があります。これらの証明書類の合計は何ポイント以上でなければなりませんか？
  choices:
    A: 4ポイント以上
    B: 6ポイント以上
    C: 8ポイント以上
    D: 10ポイント以上
  answer: B
  explanation: 氏名を証明する書類にはポイントが割り当てられています。合計6ポイント以上になるように証明書類を提示する必要があります。
- id: 22
  category: license_system
  question: 運転免許証の申請のために氏名を証明する書類を提出する際、少なくとも1つの証明書類に求められる特定の要件は何ですか？
  choices:
    A: 写真が含まれていること。
    B: 連邦政府によって発行されたものであること。
    C: 署名が含まれていること。
    D: 現在の居住地住所が記載されていること。
  answer: C
  explanation: マニュアルには、合計6ポイント以上となる氏名の証明書類を提示する際、「少なくとも1つの証明書類には署名が含まれていなければならない」と記載されています。
- id: 23
  category: license_system
  question: ニューヨーク州の運転免許証の氏名証明において、6ポイントの価値がある書類は次のうちどれですか？
  choices:
    A: 有効な米国パスポート
    B: 米国ソーシャルセキュリティカード（社会保障カード）
    C: ニューヨーク州の写真付き運転免許証または非運転者用身分証明書（Non-Driver ID Card）
    D: 米国軍の写真付き身分証明書
  answer: C
  explanation: ニューヨーク州の写真付き運転免許証／仮免許証／非運転者用身分証明書（有効期限内、または期限切れから2年以内のもの）は6ポイントの価値があります。
- id: 24
  category: license_system
  question: ニューヨーク州の運転免許証の身元証明において、有効な米国パスポートは何ポイントの価値がありますか？
  choices:
    A: 2ポイント
    B: 3ポイント
    C: 4ポイント
    D: 6ポイント
  answer: C
  explanation: 認められる書類のリストによると、有効な米国パスポートまたはパスポートカードは4ポイントの価値があります。
- id: 25
  category: license_system
  question: 身元証明書類が英語でない場合、何を提出する必要がありますか？
  choices:
    A: 認定された英語の翻訳証明
    B: 米国市民からの公証された手紙
    C: 国際運転免許証
    D: DMV（車両管理局）オフィスでの口頭翻訳
  answer: A
  explanation: マニュアルには、すべての証明書類は英語であるか、認定された英語の翻訳証明が添付されていなければならないと記載されています。
- id: 26
  category: license_system
  question: 生年月日を証明するために認められる書類は、次のうちどれですか？
  choices:
    A: 米国の高校の写真付き身分証明書と成績表
    B: 米国の公共料金の請求書
    C: 米国軍の写真付き身分証明書
    D: 米国の主要なクレジットカード
  answer: C
  explanation: 「年齢の証明」のセクションにおいて、米国軍の写真付き身分証明書は生年月日を証明する有効な書類として記載されています。
- id: 27
  category: driver_testing
  question: ニューヨーク州の運転免許証の視力検査に合格するには、少なくとも片方の目でどの程度の視力が必要ですか？
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: 視力検査に合格するには、矯正レンズの有無にかかわらず、少なくとも片方の目で20/40の視力が必要です。
- id: 28
  category: driver_testing
  question: 視力検査と学科試験に合格することに加えて、初めての免許証の路上試験を受ける前に、ほとんどの運転者が修了しなければならないものは何ですか？
  choices:
    A: 10時間のディフェンシブ・ドライビング・コース（安全運転講習）
    B: 認定された5時間のライセンス取得前講習（Pre-Licensing Course）
    C: 15時間の実技トレーニングプログラム
    D: 認定された応急処置およびCPR（心肺蘇生法）のクラス
  answer: B
  explanation: マニュアルには、初めて免許証を申請する際、ほとんどの運転者は認定された5時間のライセンス取得前講習（Pre-Licensing Course）を修了し、路上試験に合格しなければならないと記載されています。
- id: 29
  category: driver_testing
  question: ニューヨーク州の運転免許証の視力検査に合格するための最低視力要件は何ですか？
  choices:
    A: 両目で20/20の視力
    B: 少なくとも片方の目で20/30の視力
    C: 少なくとも片方の目で20/40の視力
    D: 両目で20/50の視力
  answer: C
  explanation: マニュアルによると、視力検査に合格するには、矯正レンズの有無にかかわらず、少なくとも片方の目で20/40の視力が必要です。
- id: 30
  category: driver_testing
  question: クラスD免許の学科試験に合格するには、全体で何問正解する必要がありますか？
  choices:
    A: 20問中10問以上
    B: 20問中14問以上
    C: 20問中16問以上
    D: 20問全問
  answer: B
  explanation: マニュアルには、学科試験に合格するには、出題される20問中14問以上正解しなければならないと記載されています。
- id: 31
  category: driver_testing
  question: 筆記試験に合格するには、道路標識に関する問題に何問正解する必要がありますか？
  choices:
    A: 4問中1問
    B: 4問中2問
    C: 4問中3問
    D: 4問中4問
  answer: B
  explanation: マニュアルには、筆記試験に合格するためには道路標識に関する4つの問題のうち2つに正解しなければならないと規定されています。
- id: 32
  category: driver_testing
  question: 参加している高校でDMVオンライン学科試験アプリケーション（OKTA）プログラムを通じて筆記試験を受けるために必要な学生の最低年齢は何歳ですか？
  choices:
    A: 15歳
    B: 15歳6ヶ月
    C: 15歳11ヶ月
    D: 16歳
  answer: C
  explanation: 仮免許（learner permit）を申請する前に、15歳11ヶ月以上の学生はOKTAプログラムを通じて筆記試験を受けることができます。
- id: 33
  category: license_system
  question: 仮免許（learner permit）で運転の練習をする際、同乗する監督運転者の要件は何ですか？
  choices:
    A: 18歳以上で、有効な運転免許証を所持していること
    B: 21歳以上で、その車両タイプに有効な運転免許証を所持し、助手席に座ること
    C: 資格を持った運転指導員であること
    D: 25歳以上で、後部座席に座ること
  answer: B
  explanation: 運転の練習をする際は、21歳以上で、運転する車両タイプに有効な免許証を持ち、助手席に同乗する免許所持者の監督を受けなければなりません。
- id: 34
  category: license_system
  question: ジュニアパーミット（Junior Permit）を所持し、ニューヨーク市内（5区）を午前5時から午後9時の間に運転する場合、車両にはどのような特別装備が必要ですか？
  choices:
    A: バックカメラ
    B: 練習中（student driver）の標識
    C: デュアルコントロール（補助ブレーキ）
    D: 追加のサイドミラー
  answer: C
  explanation: ニューヨーク市内で午前5時から午後9時までの間にジュニアパーミットで運転する場合の地域制限により、車両にはデュアルコントロール（補助ブレーキ）が装備されていなければなりません。
- id: 35
  category: license_system
  question: ニューヨーク州北部（その他のすべての郡）でジュニアパーミットを使用して午後9時から午前5時の間に運転する場合、誰が監督しなければなりませんか？
  choices:
    A: 18歳以上の免許所持者
    B: 21歳以上の免許所持者
    C: この時間帯は運転してはならない
    D: 親、保護者、「親代わり」の人物、運転教育の教師、または自動車学校の指導員
  answer: D
  explanation: 州北部の郡で午後9時から午前5時の間、ジュニアパーミット所持者は、親、保護者、「親代わり（in loco parentis）」の人物、運転教育の教師、または自動車学校の指導員の直接の監督下でのみ運転しなければなりません。
- id: 36
  category: safe_driving_rules
  question: 仮免許を所持するすべての運転者に対する一般的な規則によると、運転が厳しく禁止されているのはどこですか？
  choices:
    A: ニューヨーク市内の公園内にあるすべての道路
    B: すべての州間高速道路
    C: 学校の授業時間中のスクールゾーン
    D: 制限速度が40mphを超える道路
  answer: A
  explanation: 仮免許を所持している場合、ニューヨーク市内の公園内の道路、またはトライボロー橋梁トンネル公社（Triborough Bridge and
    Tunnel Authority）の管轄下にある橋やトンネルを運転することはできません。
- id: 37
  category: safe_driving_rules
  question: ウェストチェスター郡にある次のパークウェイのうち、仮免許での運転が許可されていないのはどれですか？
  choices:
    A: ノーザン・ステート・パークウェイ
    B: タコニック・ステート・パークウェイ
    C: ガーデン・ステート・パークウェイ
    D: パリセーズ・インターステート・パークウェイ
  answer: B
  explanation: 仮免許所持者は、ウェストチェスター郡のクロス・カウンティ、ハッチンソン・リバー、ソー・ミル・リバー、またはタコニック・ステート・パークウェイを運転することはできません。
- id: 38
  category: license_system
  question: ジュニア仮免許（Junior Learner Permit）を所持している場合、21歳未満の同乗者に関する規則は何ですか？
  choices:
    A: 21歳未満の同乗者を乗せることはできない
    B: 21歳未満の同乗者を最大3人まで乗せることができる
    C: 直系の家族であるか、監督者が親/保護者/指導員でない限り、21歳未満の同乗者を2人以上乗せて運転することはできない
    D: シートベルトの数だけ21歳未満の同乗者を乗せることができる
  answer: C
  explanation: 同乗者が直系の家族である場合、または監督する運転者が親、保護者、「親代わり（in loco parentis）」の人物、運転教育の教師、自動車学校の指導員である場合を除き、21歳未満の同乗者を2人以上乗せて運転することはできません。
- id: 39
  category: license_system
  question: ジュニアパーミットを所持している場合、助手席に座ることが許可されている唯一の同乗者は誰ですか？
  choices:
    A: 監督する運転者
    B: 18歳未満の兄弟姉妹
    C: 21歳以上の同乗者
    D: 助手席には誰も座ることはできない
  answer: A
  explanation: マニュアルには明確に次のように記載されています。「ジュニアパーミットを所持している場合、助手席に座ることが許可されている同乗者は監督する運転者のみです。」
- id: 40
  category: driver_testing
  question: 路上試験（road test）を受ける前に、監督下での運転練習を合計何時間完了しておくことが重要ですか？
  choices:
    A: 最低20時間
    B: 最低30時間
    C: 最低40時間
    D: 最低50時間
  answer: D
  explanation: 試験を受ける前に、最低50時間の練習を行っておくことが重要です。
- id: 41
  category: driver_testing
  question: 路上試験（技能試験）前の監督付き運転練習の推奨合計時間のうち、日没後に完了しなければならないのは何時間ですか？
  choices:
    A: 最低5時間
    B: 最低10時間
    C: 最低15時間
    D: 最低20時間
  answer: C
  explanation: マニュアルには、最低50時間の練習を行うことが重要であり、そのうち少なくとも15時間は日没後に行う必要があると記載されています。
- id: 42
  category: driver_testing
  question: 路上試験の予約を取る前に、何を修了しなければなりませんか？
  choices:
    A: 上級防衛運転コース
    B: 認定された安全運転コース（免許取得前コースまたは運転教育）
    C: 高速道路運転認定
    D: 視力再検査
  answer: B
  explanation: 路上試験の予約を取る前に、まず認定された安全運転コースを修了する必要があります。これは、高校や大学の運転教育コース、または免許取得前コース（Pre-Licensing
    course）を受講することで満たされます。
- id: 43
  category: license_system
  question: ジュニア許可証（Junior Permit）を所持しており、午後9時から午前5時までの間にロングアイランド（ナッソー郡およびサフォーク郡）を運転する場合、どのような制限がありますか？
  choices:
    A: 親または保護者の監督を受けなければならない
    B: 運転してはならない
    C: 21歳以上の免許を持つ運転者の監督を受けなければならない
    D: 仕事に行く場合は単独で運転できる
  answer: B
  explanation: ジュニア許可証の地域別制限表によると、午後9時から午前5時までの間のロングアイランド（ナッソー郡およびサフォーク郡）では、「運転してはならない」とされています。
- id: 44
  category: license_system
  question: 免許取得前コース（Pre-Licensing Course）の修了証明書の有効期間はどのくらいですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: B
  explanation: マニュアルによると、安全運転コースを修了すると、1年間有効な証明書を受け取ります。
- id: 45
  category: driver_testing
  question: DMV認定の違反点数・保険料減額プログラム（防衛運転コース）は、路上試験を予約するための安全運転コースの要件を満たしていますか？
  choices:
    A: はい、オンラインで修了した場合は満たします。
    B: はい、18歳以上の運転者の場合は満たします。
    C: いいえ、要件を満たしていません。
    D: はい、過去6ヶ月以内に修了した場合は満たします。
  answer: C
  explanation: マニュアルには、「DMV認定の違反点数・保険料減額プログラム（別名：事故防止コースまたは防衛運転コース）は、安全運転コースの要件を満たさない」と明記されています。
- id: 46
  category: license_system
  question: 州認定の運転教育コースを修了している場合、ジュニア運転免許証からシニア運転免許証に変更できるのは何歳ですか？
  choices:
    A: 16歳
    B: 17歳
    C: 18歳
    D: 21歳
  answer: B
  explanation: 17歳でジュニア運転免許証を所持しており、州認定の高校または大学の運転教育コースを修了している場合、シニア運転免許証（クラスDまたはM）を取得する資格があります。
- id: 47
  category: driver_testing
  question: ジュニア運転者が路上試験を受けるには、許可証（Permit）を有効な状態でどのくらいの期間保持しなければなりませんか？
  choices:
    A: 最低3ヶ月
    B: 最低6ヶ月
    C: 最低9ヶ月
    D: 最低12ヶ月
  answer: B
  explanation: 許可証を持つジュニア運転者について、マニュアルには「路上試験を受けるには、許可証を有効な状態で最低6ヶ月間保持しなければならない」と記載されています。
- id: 48
  category: driver_testing
  question: 路上試験の前に、親または保護者はジュニア運転者が何時間の監督付き運転練習を完了したことを証明しなければなりませんか？
  choices:
    A: 30時間（うち日没後10時間を含む）
    B: 40時間（うち日没後10時間を含む）
    C: 50時間（うち日没後15時間を含む）
    D: 60時間（うち日没後15時間を含む）
  answer: C
  explanation: 監督付き運転の証明書（MV-262）では、親または保護者が、運転者が少なくとも50時間の運転練習（うち日没後少なくとも15時間を含む）を完了したことを証明する必要があります。
- id: 49
  category: driver_testing
  question: 路上試験の会場に同行する監督運転者の要件は何ですか？
  choices:
    A: 18歳以上でなければならない。
    B: 21歳以上であり、その車両に有効な免許を所持していなければならない。
    C: 認定された運転指導員でなければならない。
    D: 親または法定後見人でなければならない。
  answer: B
  explanation: 路上試験の会場まで運転していく場合、21歳以上であり、路上試験で運転する車両に有効な免許を所持している監督運転者を同伴しなければなりません。
- id: 50
  category: driver_testing
  question: オートバイの試験受験者は、免許試験官を乗せるために路上試験に何を持参しなければなりませんか？
  choices:
    A: サイドカー付きのオートバイ
    B: 試験官用の2台目のオートバイ
    C: 車またはトラックと、免許を持った運転者
    D: 認定されたオートバイ指導員
  answer: C
  explanation: オートバイの試験受験者は、試験中に免許試験官を乗せるために、車またはトラックと、免許を持った運転者を同伴しなければなりません。
- id: 51
  category: penalties_and_points
  question: ポイントおよび保険料減額プログラム（PIRP）を修了した場合、運転記録から最大何ポイント削減されますか？
  choices:
    A: 最大2ポイント
    B: 最大3ポイント
    C: 最大4ポイント
    D: 最大5ポイント
  answer: C
  explanation: ポイント削減の資格がある場合、PIRPコースを修了することで、運転記録から最大4ポイントが削減されます。
- id: 52
  category: penalties_and_points
  question: ポイント削減を目的として、ポイントおよび保険料減額プログラム（PIRP）を修了できる頻度はどれくらいですか？
  choices:
    A: 12ヶ月ごと
    B: 18ヶ月ごと
    C: 2年ごと
    D: 3年ごと
  answer: B
  explanation: ポイント削減を目的とする場合、ポイントおよび保険料減額プログラムのコースは18ヶ月ごとに受講・修了することができます。
- id: 53
  category: license_system
  question: ジュニア免許（Junior License）で運転する場合、近親者（immediate family）ではない21歳未満の同乗者は何人まで許可されますか？
  choices:
    A: 0人（許可されない）
    B: 1人まで
    C: 2人まで
    D: 3人まで
  answer: B
  explanation: ジュニア運転者の制限事項により、近親者でない限り、21歳未満の同乗者を2人以上乗せて運転することはできません（1人まで許可されます）。
- id: 54
  category: license_system
  question: ジュニア免許の地域別制限事項によると、ニューヨーク市（5つの行政区）内で運転が許可されるのはいつですか？
  choices:
    A: 午前5時から午後9時の間のみ
    B: 親または保護者が同乗している場合のみ
    C: 通学のために運転する場合のみ
    D: いかなる時間帯も運転してはならない
  answer: D
  explanation: ジュニア免許の地域別制限事項の表には、ニューヨーク市（5つの行政区）内では、午前5時～午後9時の間は「運転してはならない」、午後9時～午前5時の間も「運転してはならない」と明確に記載されています。
- id: 55
  category: license_system
  question: ジュニア免許を所持し、午前5時から午後9時の間にアップステート（ニューヨーク州北部）の郡で運転する場合、単独運転に関する制限事項は何ですか？
  choices:
    A: 同乗者なしで運転できる。
    B: 免許を持った親または保護者の同乗が必要である。
    C: 職場または学校へ向かう場合のみ単独で運転できる。
    D: 運転してはならない。
  answer: A
  explanation: 地域別制限事項の表によると、午前5時から午後9時の間のアップステート（その他のすべての郡）では、「同乗者なしで運転できる」とされています。
- id: 56
  category: license_system
  question: ジュニア免許の所持者がナッソー郡またはサフォーク郡で通勤のために運転する場合、どのような就労証明書を携帯しなければなりませんか？
  choices:
    A: 直近の給与明細
    B: 就労証明書（MV-58A）
    C: 雇用主からの手紙
    D: シフト表（勤務スケジュール）のコピー
  answer: B
  explanation: ジュニア免許を所持し、ナッソー郡またはサフォーク郡で運転する場合、雇用主が記入した就労証明書（MV-58A）が正式な就労の証明として認められます。
- id: 57
  category: vehicle_information
  question: 路上試験（Road test）で使用する車両の助手席のシートベルトに関する具体的な要件は何ですか？
  choices:
    A: 5点式ハーネスでなければならない。
    B: 試験官が使用できるように準備されており、清潔でなければならない。
    C: 試験の前に整備士による点検を受けなければならない。
    D: 試験官が希望する場合は無効化できなければならない。
  answer: B
  explanation: マニュアルには、車両が良好な作動状態にある必要があると記載されており、特に「助手席のシートベルトは、試験官が使用できるように準備されており、清潔でなければならない」と明記されています。
- id: 58
  category: license_system
  question: オートバイまたはモペッド（クラスMまたはMJ）の仮免許（Learner permit）またはジュニア免許には、どのような同乗者の制限が適用されますか？
  choices:
    A: ヘルメットを着用していれば、同乗者を1人乗せることができる。
    B: 近親者のみ同乗させることができる。
    C: 監督する運転者（Supervising driver）以外の同乗者を乗せることはできない。
    D: 21歳以上の同乗者であれば誰でも乗せることができる。
  answer: C
  explanation: マニュアルには、「仮免許またはジュニア免許（クラスMまたはMJ）では、監督する運転者以外の同乗者を乗せることは許可されていない」と記載されています。
- id: 59
  category: license_system
  question: クラスMまたはMJの仮免許でオートバイまたはモペッドを運転する場合、同乗者として乗ることが許可されているのは誰ですか？
  choices:
    A: 家族であれば誰でも
    B: 監督する運転者のみ
    C: 18歳以上であれば誰でも
    D: いかなる状況でも同乗者は許可されない
  answer: B
  explanation: マニュアルによると、仮免許またはジュニア免許（クラスMまたはMJ）では、監督する運転者以外の同乗者を乗せることは許可されていません。
- id: 60
  category: license_system
  question: 仮免許でオートバイまたはモペッドを運転する場合、監督する運転者はどのくらいの距離にとどまらなければなりませんか？
  choices:
    A: 100フィート以内
    B: 1/4マイル以内
    C: 1/2マイル以内
    D: 1マイル以内
  answer: B
  explanation: マニュアルには、監督する運転者は1/4マイル以内にとどまり、全体的な監督と管理を行わなければならないと記載されています。
- id: 61
  category: driver_responsibility
  question: 居住地の住所を変更した場合、何日以内にDMV（車両管理局）に通知する必要がありますか？
  choices:
    A: 5日
    B: 10日
    C: 30日
    D: 60日
  answer: B
  explanation: 住所を変更した場合、10日以内に郵送、住所変更フォーム、またはオンラインでDMVに通知しなければなりません。
- id: 62
  category: license_system
  question: 運転免許証は、記載されている有効期限のどれくらい前から更新できますか？
  choices:
    A: 最大30日前
    B: 最大45日前
    C: 最大6ヶ月前
    D: 最大1年前
  answer: D
  explanation: マニュアルには、運転免許証に記載されている有効期限の最大1年前から更新できると記載されています。
- id: 63
  category: license_system
  question: DMVでREAL ID（リアルID）を申請する際、ニューヨーク州の居住証明書をいくつ提出する必要がありますか？
  choices:
    A: 1つ
    B: 2つ
    C: 3つ
    D: 4つ
  answer: B
  explanation: REAL IDを取得するには、公共料金の請求書や住宅ローンの明細書など、ニューヨーク州の居住証明書を2つ窓口に持参「しなければなりません」。
- id: 64
  category: driver_responsibility
  question: 郵送またはオンラインで運転免許証を更新する場合、どの期間内に視力検査に合格したことを証明する必要がありますか？
  choices:
    A: 過去30日以内
    B: 過去60日以内
    C: 過去6ヶ月以内
    D: 過去2年以内
  answer: C
  explanation: 郵送またはDMVのウェブサイトを通じて更新する場合、過去6ヶ月以内（または認定医療専門家が判断した場合は1年以内）に視力検査に合格したことを証明しなければなりません。
- id: 65
  category: license_system
  question: 現役の軍隊勤務から除隊した後、運転免許証は自動的にどのくらいの期間延長されますか？
  choices:
    A: 30日間
    B: 60日間
    C: 6ヶ月間
    D: 1年間
  answer: C
  explanation: 軍隊に入隊した場合、運転免許証は現役勤務中および除隊後6ヶ月間、自動的に延長されます。
- id: 66
  category: license_system
  question: ニューヨーク州の居住者となってから、何日以内にニューヨーク州の運転免許証を申請する必要がありますか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: B
  explanation: 合法的に免許を保持し続けるには、ニューヨーク州の居住者であることを確立してから30日以内にニューヨーク州の運転免許証を申請しなければなりません。
- id: 67
  category: license_system
  question: 15歳で他州の有効な運転免許証を持っている場合、ニューヨーク州での運転に関する規則はどうなっていますか？
  choices:
    A: 親が同乗している場合のみ運転できる。
    B: 日中のみ運転できる。
    C: いかなる状況でもニューヨーク州では運転できない。
    D: ニューヨーク州のジュニア許可証（junior permit）を取得すれば運転できる。
  answer: C
  explanation: マニュアルには、「16歳未満の場合、他州の免許証を持っていてもニューヨーク州では運転できない」と明記されています。
- id: 68
  category: penalties_and_points
  question: 運転免許証が「取り消し（revoked）」になるとはどういう意味ですか？
  choices:
    A: 一時的に没収され、自動的に返還される。
    B: 無効となり、期間終了後にDMVに再申請しなければならない。
    C: 罰金を支払わなければならないが、運転は続けられる。
    D: 職場への往復のみ運転が制限される。
  answer: B
  explanation: 「取り消し（Revocation）」とは、免許証（または運転する特権）が無効になることを意味します。新しい免許証を取得するには、取り消し期間が終了した後に車両管理局（DMV）に再申請しなければなりません。
- id: 69
  category: penalties_and_points
  question: 3ポイント以上の重大な交通違反で有罪となった場合、ジュニア許可証（junior permit）またはジュニア免許証（junior license）はどのくらいの期間停止されますか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 120日間
  answer: B
  explanation: 重大な交通違反（3ポイント以上）またはその他の違反で2回有罪となった場合、許可証、免許証、または運転の特権は60日間停止されます。
- id: 70
  category: penalties_and_points
  question: ジュニア許可証（junior permit）を持つ運転者が、テキストメッセージまたは携帯電話の違反で有罪となった場合の罰則は何ですか？
  choices:
    A: 30日間の免許停止
    B: 60日間の免許停止
    C: 120日間の免許停止
    D: 永久的な免許取り消し
  answer: C
  explanation: テキストメッセージまたは携帯電話の違反で有罪となった場合、ジュニア許可証、免許証、または運転の特権は120日間停止されます。
- id: 71
  category: driver_testing
  question: 路上試験（ロードテスト）を予約する前に、ジュニアパーミット（未成年者用仮免許）を保持していなければならない最短期間はどれくらいですか？
  choices:
    A: 30日間
    B: 3ヶ月
    C: 6ヶ月
    D: 1年
  answer: C
  explanation: 路上試験を予約する前に、ジュニアパーミットは最低6ヶ月間保持しなければなりません。ただし、パーミットが免許停止または取消しになっていた期間は除外されます。
- id: 72
  category: penalties_and_points
  question: 路上試験に合格した時点で18歳以上の新規免許取得者のプロベーション（見習い）期間はどれくらいですか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 9ヶ月
    D: 12ヶ月
  answer: B
  explanation: 運転免許の路上試験に合格した時点、または取消し後に免許を再取得した時点で18歳以上の場合、6ヶ月間のプロベーション（見習い）期間が設けられます。
- id: 73
  category: penalties_and_points
  question: 6ヶ月のプロベーション（見習い）期間中の新規免許取得者が、60日間の免許停止処分を受ける有罪判決は次のうちどれですか？
  choices:
    A: 1回の駐車違反切符
    B: スピード違反
    C: DMVへの住所変更通知の怠り
    D: 期限切れの車検ステッカーでの運転
  answer: B
  explanation: プロベーション期間中に、DWAI（アルコールによる運転能力低下）、スピード違反、無謀運転、車間距離不保持、速度競争への参加、または任意の2つの交通違反で有罪判決を受けた場合、免許は60日間停止されます。
- id: 74
  category: penalties_and_points
  question: プロベーション（見習い）免許期間中に、テキストメッセージ送信または携帯電話の違反で有罪判決を受けた場合、免許はどのくらいの期間停止されますか？
  choices:
    A: 60日間
    B: 90日間
    C: 120日間
    D: 6ヶ月
  answer: C
  explanation: マニュアルによると、テキストメッセージ送信または携帯電話の違反で有罪判決を受けた場合、プロベーション免許は120日間停止されます。
- id: 75
  category: penalties_and_points
  question: 交通違反切符を受け取ったにもかかわらず、それに対応しなかった場合に起こり得る結果は何ですか？
  choices:
    A: 車両が直ちに押収される。
    B: 欠席裁判により有罪となり、免許が無期限で停止される可能性がある。
    C: 運転記録に自動的に3ポイントが加算される。
    D: 義務的なディフェンシブ・ドライビング・コースの受講が求められる。
  answer: B
  explanation: マニュアルには、違反切符を受け取ったことに対応しない場合、欠席裁判により有罪となり、運転免許が無期限で停止される可能性があると記載されています。
- id: 76
  category: penalties_and_points
  question: ニューヨーク州外の次のどの地域での走行中の交通違反による有罪判決が、ニューヨーク州の運転記録の「違反ポイント」に加算されますか？
  choices:
    A: ニュージャージー州とペンシルベニア州
    B: オンタリオ州とケベック州
    C: カリフォルニア州とフロリダ州
    D: カナダのすべての州
  answer: B
  explanation: ニューヨーク州DMVは、カナダのオンタリオ州およびケベック州で犯した交通違反を除き、他の管轄区域での走行中の交通違反による有罪判決を記録しません。
- id: 77
  category: alcohol_drugs_health
  question: 21歳以上で、他州においてアルコールまたは薬物に関連する運転違反で有罪判決を受けた場合、ニューヨーク州の運転免許は少なくともどのくらいの期間取り消されますか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 1年
  answer: C
  explanation: 21歳以上で、他州においてアルコールまたは薬物に関連する運転違反（例：DUI）で有罪判決を受けた場合、ニューヨーク州の運転免許は少なくとも90日間取り消されます。
- id: 78
  category: alcohol_drugs_health
  question: 21歳未満の運転者が、州外で発生したアルコールまたは薬物に関連する違反で有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 90日間の免許停止
    B: 6ヶ月の免許取消し
    C: 少なくとも1年間の免許取消し
    D: 警告および500ドルの罰金
  answer: C
  explanation: 21歳未満で、州外で発生したアルコールまたは薬物に関連する違反で有罪判決を受けた場合、ニューヨーク州の運転免許は少なくとも1年間取り消されます。
- id: 79
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）.18の加重飲酒運転（Agg-DWI）に対する最短の免許取消し期間はどれくらいですか？
  choices:
    A: 90日間
    B: 6ヶ月
    C: 1年
    D: 18ヶ月
  answer: C
  explanation: 血中アルコール濃度が0.18%（.18 BAC）の加重飲酒運転（Agg-DWI）には、最低1年間の免許取消しが科せられます。
- id: 80
  category: alcohol_drugs_health
  question: アルコールによる運転能力低下（DWAI）で有罪判決を受けた場合、どうなりますか？
  choices:
    A: 90日間の免許停止
    B: 6ヶ月の免許取消し
    C: 1年間の免許取消し
    D: 120日間の免許停止
  answer: A
  explanation: マニュアルには、アルコールによる運転能力低下（DWAI）の罰則として90日間の免許停止が記載されています。
- id: 81
  category: alcohol_drugs_health
  question: 21歳以上の運転者が初めて化学テストを拒否した場合、運転免許証は最低どのくらいの期間取り消されますか？
  choices:
    A: 90日間
    B: 6ヶ月間
    C: 1年間
    D: 18ヶ月間
  answer: C
  explanation: 21歳以上の運転者が化学テストを拒否した場合、最低1年間の免許取り消しとなります。
- id: 82
  category: alcohol_drugs_health
  question: 州の「ゼロ・トレランス法」に基づき、21歳未満の運転者の血中アルコール濃度（BAC）が0.02%から0.07%であることが判明した場合、どうなりますか？
  choices:
    A: 免許が90日間停止される。
    B: 免許が6ヶ月間停止される。
    C: 免許が1年間取り消される。
    D: 免許に3点が加算される。
  answer: B
  explanation: 州の「ゼロ・トレランス法」に基づき、21歳未満の運転者の血中アルコール濃度（BAC）が0.02%から0.07%であることが判明した場合、免許が6ヶ月間停止されます。
- id: 83
  category: penalties_and_points
  question: 18ヶ月以内に何回のスピード違反および/または軽犯罪の交通違反で有罪となった場合、運転免許証が最低6ヶ月間取り消されますか？
  choices:
    A: 2回
    B: 3回
    C: 4回
    D: 5回
  answer: B
  explanation: 18ヶ月以内に3回のスピード違反および/または軽犯罪の交通違反で有罪となった場合、運転免許証は最低6ヶ月間取り消されます。
- id: 84
  category: penalties_and_points
  question: 無保険の車両を運転する、または他人に自分の無保険車両を運転させた場合の罰則は何ですか？
  choices:
    A: 90日間の免許停止
    B: 6ヶ月間の免許停止
    C: 最低1年間の免許取り消し
    D: 保険に加入するまでの無期限の免許停止
  answer: C
  explanation: 無保険の車両を運転する、または他人に自分の無保険車両を運転させた場合、運転免許証は最低1年間取り消されます。
- id: 85
  category: penalties_and_points
  question: 次のうち、運転免許証が無期限停止となるのはどれですか？
  choices:
    A: 養育費の支払いを怠った場合
    B: 1年間に2回のスピード違反切符を切られた場合
    C: 化学テストを拒否した場合
    D: 停車中のスクールバスを1回追い越した場合
  answer: A
  explanation: 事故報告書の提出を怠った場合、養育費の支払いを怠った場合、税金の支払いを怠った場合、または裁判所の判決に従わなかった場合、運転免許証は無期限に停止されます。
- id: 86
  category: penalties_and_points
  question: DMVのポイント制度によると、制限速度を21〜30マイル（MPH）超過するスピード違反をした場合、何点が加算されますか？
  choices:
    A: 3点
    B: 4点
    C: 6点
    D: 8点
  answer: C
  explanation: ポイント制度の表によると、制限速度を21〜30マイル（MPH）超過するスピード違反は6点となります。
- id: 87
  category: penalties_and_points
  question: 自動車の運転中に携帯電話や携帯電子機器を使用した場合、運転記録に何点が加算されますか？
  choices:
    A: 2点
    B: 3点
    C: 4点
    D: 5点
  answer: D
  explanation: ポイント制度の表によると、自動車の運転中に携帯電話や携帯電子機器を使用すると5点が加算されます。
- id: 88
  category: penalties_and_points
  question: 運転記録にポイントが加算されるのはいつですか？
  choices:
    A: 有罪判決を受けた日
    B: 違反を犯した日
    C: 反則金を支払った日
    D: DMVが違反切符を処理した日
  answer: B
  explanation: マニュアルによると、記録に加算されるポイントは、有罪判決を受けた日ではなく、違反を犯した日から計算されます。
- id: 89
  category: penalties_and_points
  question: 18ヶ月以内に何点累積すると、運転免許証が停止されるという通知を受け取ることになりますか？
  choices:
    A: 6点以上
    B: 8点以上
    C: 11点以上
    D: 15点以上
  answer: C
  explanation: マニュアルには、18ヶ月以内に11点以上を取得した場合、運転免許証が停止される旨が郵送で通知されると記載されています。
- id: 90
  category: defensive_driving
  question: DMVが承認した「自動車事故防止講習（Motor Vehicle Accident Prevention Course）」を受講する利点は何ですか？
  choices:
    A: 義務的な免許停止を防ぐことができる。
    B: 将来のポイントに対するクレジットとして機能する。
    C: 運転者責任評価（Driver Responsibility Assessment）の費用が減額される。
    D: 累積ポイントを最大4点減らすことができる。
  answer: D
  explanation: DMV承認の講習を受講することで、累積ポイントを最大4点減らし、自動車の賠償責任保険および車両保険の保険料を最大10%節約することができます。
- id: 91
  category: driver_responsibility
  question: 他人が死亡する交通事故に関与した場合、違反で告発されていなくても、DMV（車両管理局）はどのような措置を取ることができますか？
  choices:
    A: DMVの聴聞会の後、免許が一時停止または取り消される可能性がある。
    B: 自動的に危険運転致死罪で告発される。
    C: 750ドルの民事罰金の支払いが義務付けられる。
    D: 車両が直ちに押収され、没収される。
  answer: A
  explanation: 他人が死亡する交通事故に関与した場合、違反で告発されていなくても、DMVの聴聞会の後に免許が一時停止または取り消される可能性があります。
- id: 92
  category: penalties_and_points
  question: 運転免許証が30日や90日など特定の期間一時停止された場合、ほとんどのケースで返金不可の停止解除手数料はいくらですか？
  choices:
    A: 25ドル
    B: 50ドル
    C: 100ドル
    D: 125ドル
  answer: B
  explanation: ほとんどの場合、運転免許証が特定の期間一時停止された場合、返金不可の50ドルの停止解除手数料を支払うまで免許証は返還されません。
- id: 93
  category: sharing_the_road
  question: スクールバスのストップアームカメラに関する2019年の法律に基づき、赤いライトを点滅させて停車しているスクールバスを追い越す初回違反の罰金はいくらですか？
  choices:
    A: 100ドル
    B: 150ドル
    C: 250ドル
    D: 300ドル
  answer: C
  explanation: マニュアルには、ストップアームカメラで捉えられたスクールバス追い越しの初回違反には250ドルの罰金が科せられると記載されています。
- id: 94
  category: alcohol_drugs_health
  question: 標準的な（非商用の）自動車を運転中に化学テスト（呼気・血液検査など）を拒否した場合の民事罰金はいくらですか？
  choices:
    A: 250ドル
    B: 500ドル
    C: 550ドル
    D: 750ドル
  answer: B
  explanation: 化学テスト拒否に対する民事罰金は500ドルです（商用自動車を運転中の場合は550ドル）。
- id: 95
  category: alcohol_drugs_health
  question: 飲酒運転（DWI）で有罪判決を受けた場合、3年間にわたり毎年支払わなければならない運転者責任評価額（Driver Responsibility
    Assessment）はいくらですか？
  choices:
    A: 100ドル
    B: 150ドル
    C: 250ドル
    D: 500ドル
  answer: C
  explanation: DWIで有罪判決を受けた場合、その後3年間にわたり毎年250ドルの運転者責任評価額を支払うことが義務付けられます。
- id: 96
  category: penalties_and_points
  question: 18ヶ月間に運転記録に6ポイントが加算された場合、3年間にわたり毎年100ドルの運転者責任評価額（Driver Responsibility
    Assessment）を支払う必要があります。その期間中に追加でポイントを受けた場合、1ポイントにつきいくら支払わなければなりませんか？
  choices:
    A: 3年間にわたり毎年1ポイントにつき10ドル
    B: 3年間にわたり毎年1ポイントにつき25ドル
    C: 3年間にわたり毎年1ポイントにつき50ドル
    D: 3年間にわたり毎年1ポイントにつき100ドル
  answer: B
  explanation: その期間中に追加でポイントを受けた場合、3年間にわたり毎年1ポイントにつきさらに25ドルを支払うことが義務付けられます。
- id: 97
  category: penalties_and_points
  question: 免許が一時停止または取り消されている間に運転した場合、起こり得る結果は次のうちどれですか？
  choices:
    A: 50ドルから100ドルの義務的な罰金
    B: 100時間の義務的な社会奉仕活動
    C: 200ドルから5,000ドルの義務的な罰金、および車両押収の可能性
    D: すべての州での運転免許取得の永久禁止
  answer: C
  explanation: 免許が一時停止または取り消されている間に運転することは犯罪行為であり、200ドルから5,000ドルの義務的な罰金が科せられます。また、運転していた車両が押収され、没収される可能性もあります。
- id: 98
  category: vehicle_information
  question: 権利証（タイトル証明書）の主な目的は何ですか？
  choices:
    A: 車両を公道で運転できるようにする。
    B: 誰が車両を所有しているかを証明する。
    C: 車両が安全検査に合格したことを証明する。
    D: 自動車損害賠償責任保険の証明として機能する。
  answer: B
  explanation: 登録証（レジストレーション）は車両を公道や高速道路で運転できるようにするものです。権利証（タイトル証明書）は誰が車両を所有しているかを証明するものです。
- id: 99
  category: vehicle_information
  question: ニューヨーク州で車両を登録するために必要な最低年齢は何歳ですか？
  choices:
    A: 15歳
    B: 16歳
    C: 18歳
    D: 車両の登録に年齢要件はない。
  answer: B
  explanation: マニュアルには次のように記載されています。「車両を登録するには16歳以上である必要があります。車両の権利証（タイトル）は年齢に関係なく取得できます。」
- id: 100
  category: vehicle_information
  question: ニューヨーク州の新しい居住者は、居住を確立してから何日以内にニューヨーク州の車両登録を取得する必要がありますか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: B
  explanation: 州の新しい居住者は、居住を確立してから30日以内にニューヨーク州の登録を取得しなければなりません。
- id: 101
  category: vehicle_information
  question: ニューヨーク州の登録ディーラー以外から車両を購入した場合、車両登録後何日以内に車検（インスペクション）を受ける必要がありますか？
  choices:
    A: 5日
    B: 10日
    C: 15日
    D: 30日
  answer: B
  explanation: ニューヨーク州の登録ディーラー以外から車両を購入した場合、10日間の車検延長ステッカーを受け取ります。その後、登録日から10日以内に車検を受けなければなりません。
- id: 102
  category: vehicle_information
  question: 車両管理局（DMV）のオフィスが権利証（タイトル証明書）の受理を拒否するのはどのような場合ですか？
  choices:
    A: 車両が10年以上前のものである場合
    B: 権利証が折れ曲がったり、しわがある場合
    C: 権利証の情報が修正、消去、または取り消されている場合
    D: 車両が以前に他の州で登録されていた場合
  answer: C
  explanation: 正確な走行距離計（オドメーター）または損傷開示申告書が記入されていない場合、あるいは権利証の情報が修正、消去、または取り消されている場合、車両管理局のオフィスは権利証を受理しません。
- id: 103
  category: vehicle_information
  question: 権利証（タイトル証明書）上の名前や署名などの情報が修正、消去、または取り消された場合、どうなりますか？
  choices:
    A: DMVは追加の処理手数料を請求する。
    B: DMVはその権利証を受理しない。
    C: 購入者は公正市場価格に基づき売上税を支払わなければならない。
    D: 権利証には自動的に「再構築サルベージ（Rebuilt Salvage）」と記載される。
  answer: B
  explanation: マニュアルによると、権利証上の情報（名前や署名を含む）が修正、消去、または取り消されている場合、車両管理局のオフィスはその権利証を受理しません。
- id: 104
  category: vehicle_information
  question: 製造年から8年以内の車両を購入する場合、権利証（Certificate of Title）のどの申告書に記入する必要がありますか？
  choices:
    A: 走行距離計（オドメーター）の申告書のみ。
    B: 損傷開示申告書のみ。
    C: 走行距離計と損傷開示申告書の両方。
    D: 10年未満の車両にはどちらの申告書も必要ない。
  answer: C
