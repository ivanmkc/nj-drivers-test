    B: 右側の車両に道を譲り、注意して進む
    C: 一時停止標識がある場合と同様に停止する
    D: 警察官が到着するのを待ってから進む
  answer: C
  explanation: 州法により、交差点に近づいた際に信号機や交通管制装置が機能していない、または正しく作動していない場合は、一時停止標識がある場合と同様に停止することが義務付けられています。
- id: 129
