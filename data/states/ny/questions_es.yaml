questions:
- id: 1
  category: driver_responsibility
  question: ¿Según el Registro Donate Life del Estado de Nueva York, cuántas vidas
    puede salvar una sola persona que dona sus órganos?
  choices:
    A: Hasta 4 vidas
    B: Hasta 6 vidas
    C: Hasta 8 vidas
    D: Hasta 10 vidas
  answer: C
  explanation: El manual establece que una sola persona que dona sus órganos puede
    salvar hasta ocho vidas.
- id: 2
  category: license_system
  question: Si posee una licencia de conducir válida de otro estado, ¿cuál es la edad
    mínima requerida para conducir legalmente en el estado de Nueva York?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '17'
  answer: C
  explanation: Según el manual, incluso si tiene licencia de otro lugar, las personas
    menores de 16 años no pueden conducir en el estado de Nueva York.
- id: 3
  category: license_system
  question: ¿De cuántos días dispone para obtener una licencia de conducir de Nueva
    York después de convertirse en residente permanente?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los conductores que se han mudado a Nueva York deben entregar su licencia
    de conducir de otro estado y obtener una licencia de Nueva York dentro de los
    30 días posteriores a convertirse en residentes permanentes.
- id: 4
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de alterar o falsificar una licencia
    de conducir?
  choices:
    A: Una carta de advertencia del DMV
    B: Servicio comunitario obligatorio
    C: Suspensión o revocación de la licencia y procesamiento penal
    D: Un curso obligatorio de conducción defensiva
  answer: C
  explanation: Es un delito alterar o falsificar cualquier documento de vehículo motorizado,
    lo que puede causar la suspensión o revocación de la licencia de conducir y un
    procesamiento penal que resulte en una multa o encarcelamiento.
- id: 5
  category: license_system
  question: ¿Debe tener una Licencia de Conducir Comercial (CDL) si conduce un vehículo
    fabricado o utilizado para transportar a cuántas personas además del conductor?
  choices:
    A: 8 o más
    B: 10 o más
    C: 12 o más
    D: 15 o más
  answer: D
  explanation: Se requiere una CDL si conduce cualquier vehículo fabricado o utilizado
    para transportar a 15 o más personas, además del conductor.
- id: 6
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia de Operador Clase D
    sin un Certificado de Finalización de educación vial?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: La edad mínima para una licencia de Operador Clase D es 18 años, o
    17 años con un Certificado de Finalización de educación vial.
- id: 7
  category: license_system
  question: ¿Qué clases de ciclomotores (mopeds) se le permite operar con una licencia
    de Operador Clase D estándar?
  choices:
    A: Solo Clase A
    B: Ciclomotores Clase B y C
    C: Ciclomotores Clase A y B
    D: No se permiten ciclomotores sin una licencia de motocicleta
  answer: B
  explanation: El manual establece que puede operar ciclomotores Clase B y C con una
    licencia de conducir Clase D.
- id: 8
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia Clase DJ (Operador Junior)?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: La edad mínima para obtener una licencia de Operador Junior, Clase
    DJ, es 16 años.
- id: 9
  category: license_system
  question: ¿Qué clase de licencia se requiere para transportar pasajeros a cambio
    de una remuneración en un vehículo diseñado para transportar 14 pasajeros o menos,
    como un taxi o vehículo de alquiler (livery)?
  choices:
    A: Clase C
    B: Clase D
    C: Clase E
    D: Clase M
  answer: C
  explanation: Una licencia de Taxi/Alquiler (Livery), Clase E, le permite transportar
    pasajeros a cambio de una remuneración en un vehículo diseñado o utilizado para
    transportar 14 pasajeros o menos.
- id: 10
  category: license_system
  question: ¿Para qué tipo de viaje se puede utilizar una Licencia de Conducir Mejorada
    (EDL) en lugar de un pasaporte?
  choices:
    A: Viajes aéreos internacionales a Europa
    B: Cruces fronterizos terrestres y marítimos hacia y desde Canadá, México, Bermudas
      y el Caribe
    C: Cualquier viaje internacional a nivel mundial
    D: Viajes a América del Sur en crucero
  answer: B
  explanation: Una Licencia de Conducir Mejorada (EDL) se puede utilizar para cruces
    fronterizos terrestres y marítimos hacia y desde los EE. UU., Canadá, México,
    Bermudas y el Caribe en lugar de un pasaporte.
- id: 11
  category: license_system
  question: 'Se requiere una Licencia de Conducir Comercial (CDL) para conducir un
    solo vehículo con una clasificación de peso bruto vehicular (GVWR) del fabricante
    de más de:'
  choices:
    A: 10,000 libras
    B: 15,000 libras
    C: 20,000 libras
    D: 26,000 libras
  answer: D
  explanation: Debe tener una CDL si conduce cualquier vehículo que tenga una clasificación
    de peso bruto vehicular (GVWR) del fabricante de más de 26,000 libras.
- id: 12
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a poseer
    múltiples licencias de conducir?
  choices:
    A: Puede poseer una licencia de Nueva York y una licencia de otro estado simultáneamente.
    B: En la mayoría de los casos, es ilegal poseer una licencia de conducir de Nueva
      York y una licencia de conducir de otro estado al mismo tiempo.
    C: Se requiere que posea una licencia para cada estado en el que conduzca con
      frecuencia.
    D: Puede poseer legalmente hasta dos licencias de conducir comerciales (CDL).
  answer: B
  explanation: En la mayoría de los casos, es ilegal poseer una licencia de conducir
    de Nueva York y una licencia de conducir de otro estado al mismo tiempo. También
    es una violación de las leyes federales y estatales poseer más de una CDL.
- id: 13
  category: license_system
  question: 'Una licencia Clase DJ (Operador Junior) le permite conducir un vehículo
    con una clasificación de peso bruto vehicular (GVWR) de no más de:'
  choices:
    A: 5,000 libras
    B: 10,000 libras
    C: 15,000 libras
    D: 26,000 libras
  answer: B
  explanation: Una licencia de Operador Junior, Clase DJ, le permite conducir un vehículo
    con un GVWR de 10,000 libras o menos.
- id: 14
  category: license_system
  question: 'Debe tener una Licencia de Conducir Comercial (CDL) si conduce un vehículo
    que:'
  choices:
    A: Transporta cualquier cantidad de mercancías comerciales
    B: Se utiliza únicamente para fines agrícolas
    C: Transporta materiales peligrosos que, según la ley federal, requieren un cartel
      (placard)
    D: Remolca un remolque que pesa 2,000 libras
  answer: C
  explanation: El manual especifica que debe tener una CDL si conduce cualquier vehículo
    que transporte materiales peligrosos que, según la ley federal, requieren un cartel
    (placard).
- id: 15
  category: license_system
  question: Si tiene una licencia de motocicleta y otro tipo de licencia de conducir,
    ¿cómo se mostrarán?
  choices:
    A: En dos documentos separados
    B: Ambas clases aparecerán en un solo documento
    C: Debe elegir solo una para que esté activa
    D: La licencia de motocicleta reemplaza a la otra licencia
  answer: B
  explanation: Según el manual, si tiene una licencia de motocicleta y otro tipo de
    licencia de conducir, ambas clases aparecerán en un solo documento (por ejemplo,
    'Clase DM').
- id: 16
  category: license_system
  question: Según la Ley REAL ID, ¿qué debe presentar todo viajero aéreo que vuele
    dentro de los Estados Unidos para pasar por la seguridad en los aeropuertos de
    EE. UU.?
  choices:
    A: Solo un pasaporte válido de los EE. UU.
    B: Una REAL ID, una Licencia de Conducir Mejorada (EDL) u otra forma aceptable
      de identificación federal
    C: Una licencia de conducir estándar emitida por el estado y un certificado de
      nacimiento
    D: Una tarjeta de Seguro Social y una factura de servicios públicos
  answer: B
  explanation: Todo viajero aéreo que vuele dentro de los Estados Unidos debe presentar
    una REAL ID, una Licencia de Conducir Mejorada o traer otra forma aceptable de
    identificación determinada por el gobierno federal.
- id: 17
  category: license_system
  question: El endoso 'R' para Vehículos de Uso Personal es necesario para operar
    vehículos recreativos o de alquiler utilizados para transportar bienes domésticos
    personales si el vehículo excede ¿qué especificaciones?
  choices:
    A: 10,000 libras de GVWR y/o 20 pies de largo
    B: 18,000 libras de GVWR y/o 30 pies de largo
    C: 26,000 libras de GVWR y/o 40 pies de largo
    D: 32,000 libras de GVWR y/o 50 pies de largo
  answer: C
  explanation: El endoso 'R' es necesario para la operación de vehículos recreativos
    y/o de alquiler utilizados para transportar bienes domésticos personales cuando
    el vehículo supera las 26,000 libras de GVWR y/o los cuarenta (40) pies de largo.
- id: 18
  category: driver_testing
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los requisitos
    de examen para obtener un endoso 'R'?
  choices:
    A: Debe aprobar tanto un examen escrito como un examen práctico de manejo.
    B: Debe aprobar un examen escrito, pero no se requiere un examen práctico.
    C: No se requiere un examen escrito, pero debe aprobar un examen práctico de manejo.
    D: No se requiere ni un examen escrito ni un examen práctico.
  answer: C
  explanation: 'Para obtener un endoso ''R'', debe aprobar un examen práctico de manejo
    en el tamaño y tipo de vehículo que conducirá. El manual establece explícitamente:
    ''No se requiere examen escrito''.'
- id: 19
  category: driver_testing
  question: ¿Quién debe acompañarlo para su examen práctico de manejo del endoso 'R'?
  choices:
    A: Un instructor de manejo con licencia.
    B: Cualquier conductor con licencia mayor de 18 años.
    C: Un conductor que tenga al menos 21 años de edad con una licencia válida para
      el vehículo que usted conducirá durante el examen.
    D: Un funcionario del DMV que posea una Licencia de Conducir Comercial.
  answer: C
  explanation: Para el examen práctico, debe acompañarlo un conductor que tenga al
    menos 21 años de edad, con una licencia válida para el vehículo que usted conducirá
    durante el examen.
- id: 20
  category: license_system
  question: ¿Por cuánto tiempo se emitirá su primera licencia de conducir de Nueva
    York?
  choices:
    A: Exactamente 10 años
    B: Un período que no exceda los 5 años, en su mes y día de nacimiento
    C: Un período que no exceda los 8 años, en su mes y día de nacimiento
    D: Hasta que cumpla 21 años
  answer: B
  explanation: Su primera licencia de conducir de Nueva York se emitirá por un período
    que no excederá los 5 años, en su mes y día de nacimiento.
- id: 21
  category: license_system
  question: Al solicitar su primera licencia, debe presentar documentos que prueben
    su nombre. ¿Cuántos puntos deben sumar estas pruebas en total?
  choices:
    A: Cuatro puntos o más
    B: Seis puntos o más
    C: Ocho puntos o más
    D: Diez puntos o más
  answer: B
  explanation: Los documentos que prueban su nombre tienen asignado un valor en puntos.
    Debe presentar pruebas que sumen seis puntos o más.
- id: 22
  category: license_system
  question: Al presentar documentos para probar su nombre en una solicitud de licencia
    de conducir, ¿cuál es un requisito específico para al menos una de las pruebas?
  choices:
    A: Debe contener su fotografía.
    B: Debe ser emitida por el gobierno federal.
    C: Debe tener su firma.
    D: Debe mostrar su dirección residencial actual.
  answer: C
  explanation: El manual establece que al presentar pruebas de su nombre que sumen
    seis puntos o más, 'Al menos una de las pruebas debe tener su firma'.
- id: 23
  category: license_system
  question: ¿Cuál de los siguientes documentos tiene un valor de 6 puntos al probar
    su nombre para una licencia de conducir de Nueva York?
  choices:
    A: Un pasaporte estadounidense válido
    B: Una tarjeta de Seguro Social de EE. UU.
    C: Una licencia de conducir con foto o tarjeta de identificación de no conductor
      de Nueva York
    D: Una tarjeta de identificación militar con foto de EE. UU.
  answer: C
  explanation: Una licencia de conducir con foto/permiso/tarjeta de identificación
    de no conductor de Nueva York (vigente o vencida hace no más de 2 años) tiene
    un valor de 6 puntos.
- id: 24
  category: license_system
  question: ¿Cuántos puntos vale un pasaporte estadounidense válido al probar su identidad
    para una licencia de conducir de Nueva York?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: De acuerdo con la lista de documentos aceptables, un pasaporte estadounidense
    o tarjeta de pasaporte válido tiene un valor de 4 puntos.
- id: 25
  category: license_system
  question: Si sus documentos de prueba de identidad no están en inglés, ¿qué debe
    proporcionar?
  choices:
    A: Una traducción certificada al inglés
    B: Una carta notariada de un ciudadano estadounidense
    C: Un permiso de conducir internacional
    D: Una traducción verbal en la oficina del DMV
  answer: A
  explanation: El manual establece que todas las pruebas deben estar en inglés o ir
    acompañadas de una traducción certificada al inglés.
- id: 26
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para probar su fecha
    de nacimiento?
  choices:
    A: Una identificación con foto de una escuela secundaria de EE. UU. con boleta
      de calificaciones
    B: Una factura de servicios públicos de EE. UU.
    C: Una tarjeta de identificación militar con foto de EE. UU.
    D: Una tarjeta de crédito principal de EE. UU.
  answer: C
  explanation: En la sección 'Prueba de edad', una tarjeta de identificación militar
    con foto de EE. UU. figura como un documento aceptable para probar su fecha de
    nacimiento.
- id: 27
  category: driver_testing
  question: Para aprobar el examen de la vista para una licencia de conducir de Nueva
    York, ¿qué agudeza visual debe tener en al menos un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Para aprobar el examen de la vista, debe tener una visión de 20/40
    en al menos un ojo, con o sin lentes correctivos.
- id: 28
  category: driver_testing
  question: Además de aprobar un examen de la vista y de conocimientos, ¿qué deben
    completar la mayoría de los conductores antes de realizar un examen práctico para
    su primera licencia?
  choices:
    A: Un curso de conducción defensiva de 10 horas
    B: Un curso previo a la obtención de la licencia de 5 horas aprobado
    C: Un programa de entrenamiento al volante de 15 horas
    D: Una clase certificada de primeros auxilios y RCP
  answer: B
  explanation: El manual establece que la mayoría de los conductores también deben
    completar un curso previo a la obtención de la licencia de 5 horas aprobado y
    aprobar un examen práctico al solicitar su primera licencia.
- id: 29
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para aprobar el examen de la vista
    para una licencia de conducir de Nueva York?
  choices:
    A: Visión 20/20 en ambos ojos
    B: Visión 20/30 en al menos un ojo
    C: Visión 20/40 en al menos un ojo
    D: Visión 20/50 en ambos ojos
  answer: C
  explanation: Según el manual, para aprobar el examen de la vista, debe tener una
    visión de 20/40 en al menos un ojo, con o sin lentes correctivos.
- id: 30
  category: driver_testing
  question: Para aprobar el examen escrito para una licencia Clase D, ¿cuántas preguntas
    debe responder correctamente en total?
  choices:
    A: Al menos 10 de 20
    B: Al menos 14 de 20
    C: Al menos 16 de 20
    D: Las 20 preguntas
  answer: B
  explanation: El manual establece que para aprobar el examen escrito, debe responder
    correctamente al menos 14 de las 20 preguntas formuladas.
- id: 31
  category: driver_testing
  question: ¿Cuántas preguntas sobre señales de tránsito debe responder correctamente
    para aprobar el examen de conocimientos escrito?
  choices:
    A: Una de cuatro
    B: Dos de cuatro
    C: Tres de cuatro
    D: Cuatro de cuatro
  answer: B
  explanation: El manual especifica que debe responder correctamente dos de las cuatro
    preguntas sobre señales de tránsito para aprobar el examen escrito.
- id: 32
  category: driver_testing
  question: ¿Cuál es la edad mínima requerida para que un estudiante realice el examen
    escrito a través del programa de Aplicación de Examen de Conocimientos en Línea
    (OKTA) del DMV en una escuela secundaria participante?
  choices:
    A: 15 años
    B: 15 años y 6 meses
    C: 15 años y 11 meses
    D: 16 años
  answer: C
  explanation: Antes de solicitar un permiso de aprendizaje, los estudiantes que tengan
    al menos 15 años y 11 meses pueden realizar el examen escrito a través del programa
    OKTA.
- id: 33
  category: license_system
  question: Al practicar la conducción con un permiso de aprendizaje, ¿cuáles son
    los requisitos para su conductor supervisor?
  choices:
    A: Debe tener al menos 18 años y poseer cualquier licencia válida
    B: Debe tener al menos 21 años, poseer una licencia válida para el tipo de vehículo
      y sentarse en el asiento delantero
    C: Debe ser un instructor de manejo con licencia
    D: Debe tener al menos 25 años y sentarse en el asiento trasero
  answer: B
  explanation: Cuando practique, debe estar supervisado por un conductor con licencia
    que tenga al menos 21 años, posea una licencia válida para el tipo de vehículo
    que está conduciendo y esté sentado en el asiento delantero con usted.
- id: 34
  category: license_system
  question: Si tiene un Permiso Junior y conduce en la ciudad de Nueva York (los 5
    distritos) entre las 5 AM y las 9 PM, ¿qué equipo especial debe tener el vehículo?
  choices:
    A: Una cámara de reversa
    B: Un letrero de conductor estudiante
    C: Controles dobles (frenos dobles)
    D: Espejos laterales adicionales
  answer: C
  explanation: Bajo las restricciones regionales para un Permiso Junior en la ciudad
    de Nueva York entre las 5 AM y las 9 PM, el vehículo debe tener controles dobles
    (frenos dobles).
- id: 35
  category: license_system
  question: Bajo un Permiso Junior en el norte del estado de Nueva York (todos los
    demás condados), ¿quién debe supervisarlo si conduce entre las 9 PM y las 5 AM?
  choices:
    A: Cualquier conductor con licencia mayor de 18 años
    B: Cualquier conductor con licencia mayor de 21 años
    C: Usted NO debe conducir durante estas horas
    D: Su padre, tutor, persona 'in loco parentis', profesor de educación vial o instructor
      de una escuela de manejo
  answer: D
  explanation: En los condados del norte del estado entre las 9 PM y las 5 AM, el
    titular de un Permiso Junior debe conducir únicamente bajo la supervisión inmediata
    de un padre, tutor, persona 'in loco parentis', profesor de educación vial o instructor
    de una escuela de manejo.
- id: 36
  category: safe_driving_rules
  question: De acuerdo con las reglas generales para todos los conductores con permisos
    de aprendizaje, ¿dónde tiene estrictamente prohibido conducir?
  choices:
    A: En cualquier calle dentro de un parque en la ciudad de Nueva York
    B: En cualquier autopista interestatal
    C: En zonas escolares durante el horario escolar
    D: En carreteras con un límite de velocidad superior a 40 mph
  answer: A
  explanation: Si tiene un permiso de aprendizaje, no puede conducir en ninguna calle
    dentro de un parque en la ciudad de Nueva York ni en ningún puente o túnel bajo
    la jurisdicción de la Autoridad de Puentes y Túneles de Triborough.
- id: 37
  category: safe_driving_rules
  question: ¿En cuál de las siguientes autopistas (parkways) del condado de Westchester
    NO se le permite conducir con un permiso de aprendizaje?
  choices:
    A: Northern State Parkway
    B: Taconic State Parkway
    C: Garden State Parkway
    D: Palisades Interstate Parkway
  answer: B
  explanation: Los titulares de permisos de aprendizaje no pueden conducir en las
    autopistas Cross County, Hutchinson River, Saw Mill River o Taconic State en el
    condado de Westchester.
- id: 38
  category: license_system
  question: Si tiene un Permiso de Aprendizaje Junior, ¿cuál es la regla con respecto
    a los pasajeros menores de 21 años?
  choices:
    A: No puede llevar ningún pasajero menor de 21 años
    B: Puede llevar hasta tres pasajeros menores de 21 años
    C: No puede conducir con más de un pasajero menor de 21 años a menos que sean
      familiares inmediatos o que su supervisor sea un padre/tutor/instructor
    D: Puede llevar tantos pasajeros menores de 21 años como cinturones de seguridad
      haya
  answer: C
  explanation: No puede conducir con más de un pasajero menor de 21 años a menos que
    sean miembros de su familia inmediata o si su conductor supervisor es su padre,
    tutor, persona 'in loco parentis', profesor de educación vial o instructor de
    una escuela de manejo.
- id: 39
  category: license_system
  question: Si tiene un permiso junior, ¿quién es el único pasajero que puede sentarse
    en el asiento delantero con usted?
  choices:
    A: Su conductor supervisor
    B: Un hermano menor de 18 años
    C: Cualquier pasajero mayor de 21 años
    D: Nadie tiene permitido sentarse en el asiento delantero
  answer: A
  explanation: 'El manual establece explícitamente: ''Si tiene un permiso junior,
    el único pasajero permitido en el asiento delantero es su conductor supervisor''.'
- id: 40
  category: driver_testing
  question: Antes de realizar su examen práctico de manejo, ¿cuántas horas totales
    de práctica de conducción supervisada es importante que haya completado?
  choices:
    A: Al menos 20 horas
    B: Al menos 30 horas
    C: Al menos 40 horas
    D: Al menos 50 horas
  answer: D
  explanation: Antes de realizar el examen, es importante que haya tenido al menos
    50 horas de práctica.
- id: 41
  category: driver_testing
  question: ¿De las horas totales recomendadas de práctica de conducción supervisada
    antes de un examen de conducir, cuántas horas deben completarse después de la
    puesta del sol?
  choices:
    A: Al menos 5 horas
    B: Al menos 10 horas
    C: Al menos 15 horas
    D: Al menos 20 horas
  answer: C
  explanation: El manual establece que es importante tener al menos 50 horas de práctica,
    con al menos 15 horas después de la puesta del sol.
- id: 42
  category: driver_testing
  question: ¿Qué debe completar antes de poder programar una cita para el examen de
    conducir?
  choices:
    A: Un curso avanzado de conducción defensiva
    B: Un curso aprobado de conductor seguro (curso previo a la obtención de la licencia
      o educación vial)
    C: Una certificación de conducción en autopista
    D: Un reexamen de la vista
  answer: B
  explanation: Antes de poder programar una cita para el examen de conducir, primero
    debe completar un curso aprobado de conductor seguro, el cual se cumple mediante
    un curso de educación vial de la escuela secundaria/universidad o un curso previo
    a la obtención de la licencia (Pre-Licensing course).
- id: 43
  category: license_system
  question: Si tiene un Permiso Juvenil (Junior Permit) y conduce en Long Island (Nassau
    y Suffolk) entre las 9 PM y las 5 AM, ¿cuáles son las restricciones?
  choices:
    A: Debe estar supervisado por un padre o tutor
    B: Usted NO debe conducir
    C: Debe estar supervisado por cualquier conductor con licencia mayor de 21 años
    D: Puede conducir solo si se dirige al trabajo
  answer: B
  explanation: De acuerdo con la tabla de Restricciones Regionales para un Permiso
    Juvenil, en Long Island (Nassau y Suffolk) entre las 9 PM y las 5 AM, 'Usted NO
    debe conducir'.
- id: 44
  category: license_system
  question: ¿Por cuánto tiempo es válido el certificado de finalización del Curso
    Previo a la Obtención de la Licencia (Pre-Licensing Course)?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Según el manual, cuando complete el curso de conducción segura, recibirá
    un certificado que es válido por un año.
- id: 45
  category: driver_testing
  question: ¿Cumple el Programa de Reducción de Puntos y Seguros certificado por el
    DMV (Curso de Conducción Defensiva) con el requisito del curso de Conducción Segura
    para programar un examen de conducir?
  choices:
    A: Sí, si se completa en línea.
    B: Sí, para conductores mayores de 18 años.
    C: No, no cumple con el requisito.
    D: Sí, si se completó en los últimos 6 meses.
  answer: C
  explanation: 'El manual establece explícitamente: ''El Programa de Reducción de
    Puntos y Seguros certificado por el DMV (también conocido como Curso de Prevención
    de Accidentes o Curso de Conducción Defensiva) NO cumple con el requisito del
    curso de Conducción Segura''.'
- id: 46
  category: license_system
  question: ¿A qué edad es elegible para cambiar una licencia de conducir juvenil
    a una licencia de conducir para adultos (senior) si ha completado un curso de
    educación vial aprobado por el estado?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: B
  explanation: Si tiene 17 años, es elegible para una licencia de conducir para adultos
    (Clase D o M) si tiene una licencia de conducir juvenil y ha completado un curso
    de educación vial de escuela secundaria o universidad aprobado por el estado.
- id: 47
  category: driver_testing
  question: ¿Cuánto tiempo debe un conductor juvenil mantener su permiso en estado
    válido antes de que se le permita realizar el examen de conducir?
  choices:
    A: Un mínimo de 3 meses
    B: Un mínimo de 6 meses
    C: Un mínimo de 9 meses
    D: Un mínimo de 12 meses
  answer: B
  explanation: 'Para los conductores juveniles con permisos, el manual establece:
    ''Su permiso debe mantenerse en estado válido durante un mínimo de seis meses
    para poder realizar el examen de conducir''.'
- id: 48
  category: driver_testing
  question: ¿Cuántas horas de práctica de conducción supervisada debe certificar un
    padre o tutor que un conductor juvenil ha completado antes del examen de conducir?
  choices:
    A: 30 horas, incluyendo 10 horas después de la puesta del sol
    B: 40 horas, incluyendo 10 horas después de la puesta del sol
    C: 50 horas, incluyendo 15 horas después de la puesta del sol
    D: 60 horas, incluyendo 15 horas después de la puesta del sol
  answer: C
  explanation: La Certificación de Conducción Supervisada (MV-262) requiere que un
    padre o tutor certifique que el conductor completó al menos 50 horas de práctica
    de conducción, incluyendo al menos 15 horas después de la puesta del sol.
- id: 49
  category: driver_testing
  question: ¿Cuál es un requisito para el conductor supervisor que lo acompaña al
    sitio del examen de conducir?
  choices:
    A: Debe tener al menos 18 años.
    B: Debe tener al menos 21 años y poseer una licencia válida para el vehículo.
    C: Debe ser un instructor de conducción certificado.
    D: Debe ser un padre o tutor legal.
  answer: B
  explanation: Si conduce al sitio del examen de conducir, debe traer a un conductor
    supervisor que tenga al menos 21 años y posea una licencia válida para el vehículo
    que conducirá durante el examen.
- id: 50
  category: driver_testing
  question: ¿Qué deben traer los solicitantes de licencia de motocicleta a su examen
    de conducir para transportar al examinador de licencias?
  choices:
    A: Una motocicleta con sidecar
    B: Una segunda motocicleta para el examinador
    C: Un automóvil o camión y un conductor con licencia
    D: Un instructor de motocicleta certificado
  answer: C
  explanation: Los solicitantes de motocicleta deben traer un automóvil o camión y
    un conductor con licencia para transportar al examinador de licencias durante
    el examen.
- id: 51
  category: penalties_and_points
  question: ¿Cuántos puntos se pueden reducir de su historial de manejo si completa
    el Programa de Reducción de Puntos y Seguro (PIRP)?
  choices:
    A: Hasta 2 puntos
    B: Hasta 3 puntos
    C: Hasta 4 puntos
    D: Hasta 5 puntos
  answer: C
  explanation: Si es elegible para la reducción de puntos, se pueden reducir hasta
    cuatro (4) puntos de su historial de manejo al completar el curso PIRP.
- id: 52
  category: penalties_and_points
  question: ¿Con qué frecuencia puede completar el Programa de Reducción de Puntos
    y Seguro (PIRP) con el propósito de reducir puntos?
  choices:
    A: Cada 12 meses
    B: Cada 18 meses
    C: Cada 2 años
    D: Cada 3 años
  answer: B
  explanation: Puede completar el curso del Programa de Reducción de Puntos y Seguro
    cada 18 meses con el propósito de reducir puntos.
- id: 53
  category: license_system
  question: Al conducir con una Licencia Junior, ¿cuántos pasajeros menores de 21
    años se permiten en el vehículo si NO son miembros de su familia inmediata?
  choices:
    A: Ninguno
    B: No más de uno
    C: No más de dos
    D: No más de tres
  answer: B
  explanation: Bajo las Restricciones para Operadores Junior, no puede conducir con
    más de un pasajero menor de 21 años a menos que sean miembros de su familia inmediata.
- id: 54
  category: license_system
  question: De acuerdo con las restricciones regionales para una Licencia Junior,
    ¿cuándo se le permite conducir en la ciudad de Nueva York (los 5 distritos/Boroughs)?
  choices:
    A: Solo entre las 5 AM y las 9 PM
    B: Solo cuando esté acompañado por un padre o tutor
    C: Solo cuando conduzca hacia o desde la escuela
    D: NO debe conducir en ningún momento
  answer: D
  explanation: La tabla de restricciones regionales para una Licencia Junior establece
    claramente que en la ciudad de Nueva York (5 distritos), 'NO debe conducir' entre
    las 5 AM y las 9 PM y 'NO debe conducir' entre las 9 PM y las 5 AM.
- id: 55
  category: license_system
  question: Si tiene una Licencia Junior y conduce en los condados del norte del estado
    (Upstate) entre las 5 AM y las 9 PM, ¿cuáles son las restricciones para conducir
    solo?
  choices:
    A: Puede conducir sin estar acompañado.
    B: Debe estar acompañado por un padre o tutor con licencia.
    C: Solo puede conducir solo hacia el trabajo o la escuela.
    D: No debe conducir.
  answer: A
  explanation: Según la tabla de restricciones regionales, en el norte del estado
    (todos los demás condados) entre las 5 AM y las 9 PM, 'puede conducir sin estar
    acompañado'.
- id: 56
  category: license_system
  question: ¿Qué comprobante de empleo específico debe portar el titular de una Licencia
    Junior para conducir al trabajo en los condados de Nassau o Suffolk?
  choices:
    A: Un talón de pago reciente
    B: Un Certificado de Empleo (MV-58A)
    C: Una carta de su empleador
    D: Una copia de su horario de trabajo
  answer: B
  explanation: Si tiene una Licencia Junior y conduce en los condados de Nassau o
    Suffolk, su empleador puede completar un Certificado de Empleo (MV-58A) para que
    sirva como comprobante de empleo correcto.
- id: 57
  category: vehicle_information
  question: ¿Cuál es un requisito específico para el cinturón de seguridad del lado
    del pasajero en el vehículo utilizado para un examen práctico de manejo?
  choices:
    A: Debe ser un arnés de cinco puntos.
    B: Debe estar disponible y limpio para el uso del examinador.
    C: Debe ser inspeccionado por un mecánico antes del examen.
    D: Debe desactivarse si el examinador lo prefiere.
  answer: B
  explanation: 'El manual establece que el vehículo debe estar en buenas condiciones
    de funcionamiento, y señala específicamente: ''El cinturón de seguridad del lado
    del pasajero debe estar disponible y limpio para el uso del examinador''.'
- id: 58
  category: license_system
  question: ¿Qué restricción de pasajeros se aplica a un permiso de aprendizaje o
    licencia junior para una motocicleta o ciclomotor (Clase M o MJ)?
  choices:
    A: Puede llevar a un pasajero si lleva casco.
    B: Puede llevar a miembros de la familia inmediata solamente.
    C: No puede llevar a ningún pasajero excepto a su conductor supervisor.
    D: Puede llevar a cualquier pasajero mayor de 21 años.
  answer: C
  explanation: 'El manual establece: ''Su permiso de aprendizaje o licencia junior
    (Clase M o MJ) no le permite llevar a ningún pasajero excepto a su conductor supervisor''.'
- id: 59
  category: license_system
  question: ¿Quién tiene permitido viajar como pasajero cuando usted opera una motocicleta
    o ciclomotor con un permiso de aprendizaje Clase M o MJ?
  choices:
    A: Cualquier miembro de la familia
    B: Solo su conductor supervisor
    C: Cualquier persona mayor de 18 años
    D: No se permiten pasajeros bajo ninguna circunstancia
  answer: B
  explanation: Según el manual, un permiso de aprendizaje o licencia junior (Clase
    M o MJ) no le permite llevar a ningún pasajero excepto a su conductor supervisor.
- id: 60
  category: license_system
  question: ¿A qué distancia debe permanecer un conductor supervisor cuando usted
    opera una motocicleta o ciclomotor con un permiso de aprendizaje?
  choices:
    A: A menos de 100 pies
    B: A menos de un cuarto de milla
    C: A menos de media milla
    D: A menos de una milla
  answer: B
  explanation: El manual establece que su conductor supervisor debe ejercer la supervisión
    y el control general permaneciendo a menos de un cuarto de milla.
- id: 61
  category: driver_responsibility
  question: ¿Cuántos días tiene para notificar al DMV si cambia su dirección residencial?
  choices:
    A: 5 días
    B: 10 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Si cambia su dirección, debe notificar al DMV en un plazo de 10 días
    por correo, mediante un Formulario de Cambio de Dirección o en línea.
- id: 62
  category: license_system
  question: ¿Con cuánta antelación puede renovar su licencia de conducir antes de
    su fecha de vencimiento impresa?
  choices:
    A: Hasta 30 días
    B: Hasta 45 días
    C: Hasta 6 meses
    D: Hasta un año
  answer: D
  explanation: El manual establece que puede renovar su licencia hasta un año antes
    de su fecha de vencimiento impresa.
- id: 63
  category: license_system
  question: Al solicitar una REAL ID en el DMV, ¿cuántos comprobantes de residencia
    del estado de Nueva York debe proporcionar?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para obtener una REAL ID, DEBE llevar a la oficina dos comprobantes
    de residencia del estado de Nueva York, como una factura de servicios públicos
    o un estado de cuenta hipotecario.
- id: 64
  category: driver_responsibility
  question: Si renueva su licencia de conducir por correo o en línea, ¿dentro de qué
    plazo debe demostrar que ha aprobado un examen de la vista?
  choices:
    A: Los últimos 30 días
    B: Los últimos 60 días
    C: Los últimos seis meses
    D: Los últimos dos años
  answer: C
  explanation: Si renueva por correo o a través del sitio web del DMV, debe demostrar
    que ha aprobado un examen de la vista en los últimos seis meses (o en el plazo
    de un año según lo determine un profesional de la salud con licencia).
- id: 65
  category: license_system
  question: ¿Por cuánto tiempo se extiende automáticamente su licencia de conducir
    después de ser dado de baja del servicio militar activo?
  choices:
    A: 30 días
    B: 60 días
    C: Seis meses
    D: Un año
  answer: C
  explanation: Si ingresa al servicio militar, su licencia puede extenderse automáticamente
    durante todo su servicio activo y por seis meses después de la baja.
- id: 66
  category: license_system
  question: Después de establecer su residencia en el estado de Nueva York, ¿cuánto
    tiempo tiene para solicitar una licencia de conducir de Nueva York?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Para mantener su licencia legalmente, debe solicitar una licencia de
    conducir de Nueva York dentro de los 30 días posteriores a establecer que es residente
    del estado de Nueva York.
- id: 67
  category: license_system
  question: Si tiene 15 años y posee una licencia de conducir válida de otro estado,
    ¿cuáles son las reglas para conducir en el estado de Nueva York?
  choices:
    A: Puede conducir solo si está acompañado por un padre.
    B: Puede conducir solo durante las horas del día.
    C: No puede conducir en el estado de Nueva York bajo ninguna circunstancia.
    D: Puede conducir si obtiene un permiso juvenil de Nueva York.
  answer: C
  explanation: 'El manual establece explícitamente: "Si es menor de 16 años, no puede
    conducir en el estado de Nueva York, incluso si tiene una licencia de otro estado".'
- id: 68
  category: penalties_and_points
  question: ¿Qué significa que su licencia de conducir sea "revocada"?
  choices:
    A: Se retira por un período temporal y se devuelve automáticamente.
    B: Se cancela y debe volver a solicitarla al DMV una vez que termine el período.
    C: Debe pagar una multa pero puede seguir conduciendo.
    D: Se le restringe a conducir solo hacia y desde el trabajo.
  answer: B
  explanation: '"Revocación" significa que su licencia (o privilegio de conducir)
    es cancelada. Para obtener una nueva licencia, debe volver a solicitarla al Departamento
    de Vehículos Motorizados (DMV) una vez que haya terminado el período de revocación.'
- id: 69
  category: penalties_and_points
  question: ¿Por cuánto tiempo se suspenderá un permiso o licencia juvenil si el conductor
    es condenado por una infracción de tránsito grave que valga tres o más puntos?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Su permiso, licencia o privilegios se suspenderán por 60 días si es
    condenado por una infracción de tránsito grave (tres puntos o más) o por otras
    dos infracciones.
- id: 70
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor con un permiso juvenil que es condenado
    por una infracción de mensajes de texto o uso de teléfono celular?
  choices:
    A: Una suspensión de 30 días
    B: Una suspensión de 60 días
    C: Una suspensión de 120 días
    D: Una revocación permanente
  answer: C
  explanation: Su permiso juvenil, licencia o privilegios se suspenderán por 120 días
    cuando sea condenado por una infracción de mensajes de texto o uso de teléfono
    celular.
- id: 71
  category: driver_testing
  question: ¿Cuál es el tiempo mínimo que debe tener un permiso de principiante (junior
    permit) antes de poder programar un examen práctico de manejo?
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Se debe tener un permiso de principiante por un mínimo de seis meses,
    excluyendo cualquier tiempo en que el permiso esté suspendido o revocado, antes
    de poder programar un examen práctico.
- id: 72
  category: penalties_and_points
  question: ¿Cuánto dura el período de prueba para un conductor recién licenciado
    que tiene 18 años o más al aprobar su examen práctico?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Si tiene 18 años o más cuando aprueba su examen práctico para una licencia
    de conducir, o si obtiene una licencia después de una revocación, estará en período
    de prueba durante seis meses.
- id: 73
  category: penalties_and_points
  question: ¿Cuál de las siguientes condenas resultará en una suspensión de 60 días
    para un conductor recién licenciado durante su período de prueba de seis meses?
  choices:
    A: Una sola multa de estacionamiento
    B: Exceso de velocidad
    C: No notificar al DMV un cambio de dirección
    D: Conducir con una calcomanía de inspección vencida
  answer: B
  explanation: Si es condenado por DWAI (alcohol), exceso de velocidad, conducción
    temeraria, seguir a otro vehículo demasiado cerca, participar en una carrera de
    velocidad o cualquier combinación de dos infracciones de tráfico mientras está
    en período de prueba, su licencia será suspendida por 60 días.
- id: 74
  category: penalties_and_points
  question: Si es condenado por una infracción de mensajes de texto o uso de teléfono
    celular mientras tiene una licencia de prueba, ¿por cuánto tiempo se suspenderá
    su licencia?
  choices:
    A: 60 días
    B: 90 días
    C: 120 días
    D: 6 meses
  answer: C
  explanation: Según el manual, si es condenado por una infracción de mensajes de
    texto o uso de teléfono celular, su licencia de prueba será suspendida por 120
    días.
- id: 75
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia si recibe una multa de tráfico y no
    responde a ella?
  choices:
    A: Su vehículo será confiscado de inmediato.
    B: Podría ser declarado culpable por condena en rebeldía (default conviction)
      y su licencia será suspendida indefinidamente.
    C: Recibirá automáticamente 3 puntos en su registro de conducir.
    D: Se le requerirá tomar un curso obligatorio de conducción defensiva.
  answer: B
  explanation: El manual establece que si no responde al haber recibido la multa,
    podría ser declarado culpable por condena en rebeldía y su licencia de conducir
    será suspendida indefinidamente.
- id: 76
  category: penalties_and_points
  question: ¿De cuál de las siguientes áreas fuera del estado de Nueva York se agregarán
    las condenas por infracciones de tráfico en movimiento a su registro de conducir
    de 'puntos por infracción' del estado de Nueva York?
  choices:
    A: Nueva Jersey y Pensilvania
    B: Ontario y Quebec
    C: California y Florida
    D: Todas las provincias canadienses
  answer: B
  explanation: El DMV del estado de Nueva York no registra condenas por infracciones
    de tráfico en movimiento en otras jurisdicciones, excepto las infracciones de
    tráfico cometidas en las provincias de Ontario y Quebec en Canadá.
- id: 77
  category: alcohol_drugs_health
  question: 'Si es mayor de 21 años y es condenado por una infracción de conducción
    relacionada con el alcohol o las drogas en otro estado, su licencia de conducir
    de Nueva York será revocada por al menos:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Si es mayor de 21 años y es condenado por una infracción de conducción
    relacionada con el alcohol o las drogas (por ejemplo, DUI) en otro estado, su
    licencia de conducir de Nueva York será revocada por al menos 90 días.
- id: 78
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción si un conductor menor de 21 años es condenado por
    una infracción relacionada con el alcohol o las drogas que ocurrió fuera del estado?
  choices:
    A: Una suspensión de 90 días
    B: Una revocación de 6 meses
    C: Revocación por al menos un año
    D: Una advertencia y una multa de $500
  answer: C
  explanation: Si es menor de 21 años y es condenado por cualquier infracción relacionada
    con el alcohol o las drogas que haya ocurrido fuera del estado, su licencia de
    conducir de Nueva York será revocada por al menos un año.
- id: 79
  category: alcohol_drugs_health
  question: ¿Cuál es el período mínimo de revocación por Conducir en estado de ebriedad
    agravado (Agg-DWI) con un contenido de alcohol en sangre de .18?
  choices:
    A: 90 días
    B: Seis meses
    C: Un año
    D: 18 meses
  answer: C
  explanation: Conducir en estado de ebriedad agravado (Agg-DWI), con un contenido
    de alcohol en sangre de .18 por ciento (.18 BAC), conlleva una revocación mínima
    de un año.
- id: 80
  category: alcohol_drugs_health
  question: 'Una condena por Conducir con la capacidad disminuida por el alcohol (DWAI)
    resultará en una:'
  choices:
    A: Suspensión de 90 días
    B: Revocación de seis meses
    C: Revocación de un año
    D: Suspensión de 120 días
  answer: A
  explanation: El manual indica que la sanción por Conducir con la capacidad disminuida
    por el alcohol (DWAI) es una suspensión de 90 días.
- id: 81
  category: alcohol_drugs_health
  question: 'Si un conductor mayor de 21 años se niega a realizarse una prueba química
    por primera vez, su licencia será revocada por un mínimo de:'
  choices:
    A: 90 días
    B: Seis meses
    C: Un año
    D: 18 meses
  answer: C
  explanation: La negativa a realizarse una prueba química para conductores mayores
    de 21 años resulta en una revocación mínima de un año.
- id: 82
  category: alcohol_drugs_health
  question: Bajo la "Ley de Tolerancia Cero" del estado, ¿qué sucede si se descubre
    que un conductor menor de 21 años tiene un contenido de alcohol en la sangre (BAC)
    de .02 a .07?
  choices:
    A: Su licencia es suspendida por 90 días.
    B: Su licencia es suspendida por seis meses.
    C: Su licencia es revocada por un año.
    D: Recibe 3 puntos en su licencia.
  answer: B
  explanation: Bajo la "Ley de Tolerancia Cero" del estado, a un conductor menor de
    21 años se le suspenderá la licencia por seis meses si se descubre que tiene un
    BAC de .02 a .07.
- id: 83
  category: penalties_and_points
  question: ¿Por cuántas infracciones de exceso de velocidad y/o delitos menores de
    tránsito cometidos en un plazo de 18 meses se le revocará la licencia de conducir
    por al menos seis meses si es declarado culpable?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Su licencia de conducir será revocada por al menos seis meses si es
    declarado culpable de tres infracciones por exceso de velocidad y/o delitos menores
    de tránsito en un plazo de 18 meses.
- id: 84
  category: penalties_and_points
  question: ¿Cuál es la sanción por operar un vehículo sin seguro o permitir que otra
    persona opere su vehículo sin seguro?
  choices:
    A: Una suspensión de 90 días
    B: Una suspensión de seis meses
    C: Revocación por al menos un año
    D: Una suspensión indefinida hasta que se compre un seguro
  answer: C
  explanation: Su licencia de conducir será revocada por al menos un año si opera
    o permite que otra persona opere su vehículo sin seguro.
- id: 85
  category: penalties_and_points
  question: ¿Cuál de las siguientes situaciones resultará en una suspensión indefinida
    de su licencia de conducir?
  choices:
    A: No pagar la manutención infantil
    B: Recibir dos multas por exceso de velocidad en un año
    C: Negarse a una prueba química
    D: Rebasar un autobús escolar detenido una vez
  answer: A
  explanation: Su licencia de conducir será suspendida indefinidamente si no presenta
    un informe de accidente, no paga la manutención infantil, no paga impuestos o
    no cumple con una sentencia judicial.
- id: 86
  category: penalties_and_points
  question: Según el sistema de puntos del DMV, ¿cuántos puntos recibirá por exceder
    el límite de velocidad establecido entre 21 y 30 MPH?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La tabla del sistema de puntos indica que exceder el límite de velocidad
    establecido entre 21 y 30 MPH resulta en 6 puntos.
- id: 87
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su historial de conducción por el uso de un
    teléfono móvil o dispositivo electrónico portátil mientras opera un vehículo motorizado?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: Según la tabla del sistema de puntos, el uso de un teléfono móvil o
    dispositivo electrónico portátil mientras se opera un vehículo motorizado resulta
    en 5 puntos.
- id: 88
  category: penalties_and_points
  question: ¿Cuándo se cargan los valores de los puntos en su historial de conducción?
  choices:
    A: En la fecha en que es condenado
    B: En la fecha en que comete la infracción
    C: En la fecha en que paga la multa
    D: En la fecha en que el DMV procesa la citación
  answer: B
  explanation: Según el manual, los valores de los puntos cargados en su historial
    corresponden a la fecha en que comete la infracción, no a la fecha en que es condenado.
- id: 89
  category: penalties_and_points
  question: ¿Cuántos puntos acumulados en un período de 18 meses resultarán en una
    notificación de que su licencia de conducir será suspendida?
  choices:
    A: 6 o más puntos
    B: 8 o más puntos
    C: 11 o más puntos
    D: 15 o más puntos
  answer: C
  explanation: El manual establece que si obtiene 11 puntos o más en un plazo de 18
    meses, se le notificará por correo que su licencia de conducir será suspendida.
- id: 90
  category: defensive_driving
  question: ¿Cuál es un beneficio de tomar un "Curso de Prevención de Accidentes de
    Vehículos Motorizados" aprobado por el DMV?
  choices:
    A: Evita una suspensión obligatoria de la licencia.
    B: Actúa como crédito contra puntos futuros.
    C: Reduce su cargo de Evaluación de Responsabilidad del Conductor.
    D: Puede reducir su total de puntos hasta en cuatro puntos.
  answer: D
  explanation: Puede reducir su total de puntos hasta en cuatro puntos y ahorrar hasta
    un 10 por ciento en sus primas de seguro de colisión y responsabilidad civil automotriz
    al tomar un curso aprobado por el DMV.
- id: 91
  category: driver_responsibility
  question: ¿Si usted está involucrado en un accidente de tráfico en el que muere
    otra persona, qué medida puede tomar el DMV incluso si no fue acusado de una infracción?
  choices:
    A: Su licencia puede ser suspendida o revocada después de una audiencia del DMV.
    B: Se le acusará automáticamente de homicidio vehicular.
    C: Se le exigirá pagar una multa civil de $750.
    D: Su vehículo será confiscado y decomisado de inmediato.
  answer: A
  explanation: Si usted está involucrado en un accidente de tráfico en el que muere
    otra persona, su licencia puede ser suspendida o revocada después de una audiencia
    del DMV, incluso si no fue acusado de una infracción.
- id: 92
  category: penalties_and_points
  question: ¿Cuál es la tarifa no reembolsable por terminación de suspensión en la
    mayoría de los casos si su licencia de conducir ha sido suspendida por un período
    exacto, como 30 o 90 días?
  choices:
    A: 25 dólares
    B: 50 dólares
    C: 100 dólares
    D: 125 dólares
  answer: B
  explanation: En la mayoría de los casos, si su licencia de conducir ha sido suspendida
    por un período exacto, su licencia no le será devuelta hasta que pague una tarifa
    no reembolsable de $50 por terminación de suspensión.
- id: 93
  category: sharing_the_road
  question: Según la ley de 2019 relativa a las cámaras en el brazo de parada de los
    autobuses escolares, ¿cuál es la multa por una primera infracción al rebasar un
    autobús escolar detenido con luces rojas intermitentes?
  choices:
    A: 100 dólares
    B: 150 dólares
    C: 250 dólares
    D: 300 dólares
  answer: C
  explanation: El manual establece que una primera infracción por rebasar un autobús
    escolar captada por una cámara en el brazo de parada resulta en una multa de $250.
- id: 94
  category: alcohol_drugs_health
  question: ¿Cuál es la multa civil por negarse a una prueba química mientras conduce
    un vehículo motorizado estándar (no comercial)?
  choices:
    A: 250 dólares
    B: 500 dólares
    C: 550 dólares
    D: 750 dólares
  answer: B
  explanation: La multa civil por negarse a una prueba química es de $500 ($550 si
    es mientras conduce un vehículo motorizado comercial).
- id: 95
  category: alcohol_drugs_health
  question: Si es condenado por conducir en estado de ebriedad (DWI), ¿cuánto es la
    Evaluación de Responsabilidad del Conductor que debe pagar cada año durante tres
    años?
  choices:
    A: 100 dólares
    B: 150 dólares
    C: 250 dólares
    D: 500 dólares
  answer: C
  explanation: Si es condenado por DWI, se le exigirá pagar una evaluación de responsabilidad
    del conductor de $250 cada año durante los próximos tres años.
- id: 96
  category: penalties_and_points
  question: Si recibe seis puntos en su historial de conducción en un período de 18
    meses, debe pagar una Evaluación de Responsabilidad del Conductor de $100 cada
    año durante tres años. ¿Cuánto debe pagar por cada punto adicional recibido durante
    ese período?
  choices:
    A: 10 dólares por punto cada año durante tres años
    B: 25 dólares por punto cada año durante tres años
    C: 50 dólares por punto cada año durante tres años
    D: 100 dólares por punto cada año durante tres años
  answer: B
  explanation: Por cada punto adicional que reciba durante ese período, se le exigirá
    pagar otros $25 por punto cada año durante tres años.
- id: 97
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una consecuencia potencial de conducir mientras
    su licencia está suspendida o revocada?
  choices:
    A: Una multa obligatoria de $50 a $100
    B: Servicio comunitario obligatorio durante 100 horas
    C: Multas obligatorias de $200 a $5,000 y posible confiscación del vehículo
    D: Una prohibición permanente para obtener una licencia de conducir en cualquier
      estado
  answer: C
  explanation: Es un delito penal conducir mientras su licencia está suspendida o
    revocada, y existen multas obligatorias de $200 a $5,000. El vehículo que se conduce
    también podría ser confiscado y decomisado.
- id: 98
  category: vehicle_information
  question: ¿Cuál es el propósito principal de un certificado de título?
  choices:
    A: Permite que un vehículo sea conducido en vías públicas.
    B: Prueba quién es el propietario del vehículo.
    C: Prueba que el vehículo ha pasado la inspección de seguridad.
    D: Sirve como prueba de seguro de responsabilidad civil automotriz.
  answer: B
  explanation: Un registro permite que un vehículo sea conducido en calles y carreteras
    públicas. Un certificado de título prueba quién es el propietario del vehículo.
- id: 99
  category: vehicle_information
  question: ¿Cuál es la edad mínima requerida para registrar un vehículo en el estado
    de Nueva York?
  choices:
    A: '15'
    B: '16'
    C: '18'
    D: No hay un requisito de edad para registrar un vehículo.
  answer: B
  explanation: 'El manual establece: ''Debe tener al menos 16 años para registrar
    un vehículo. Puede titular un vehículo a cualquier edad''.'
- id: 100
  category: vehicle_information
  question: ¿Cuántos días tiene un nuevo residente del estado de Nueva York para obtener
    un registro de vehículo de Nueva York después de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Un nuevo residente del estado debe obtener un registro de Nueva York
    dentro de los 30 días posteriores al establecimiento de su residencia.
- id: 101
  category: vehicle_information
  question: Si compra un vehículo a alguien que no sea un concesionario registrado
    en el estado de Nueva York, ¿cuántos días tiene para que el vehículo sea inspeccionado
    después de registrarlo?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Si compró el vehículo a alguien que no sea un concesionario registrado
    en el estado de Nueva York, recibirá una calcomanía de extensión de inspección
    de 10 días... Luego debe hacer inspeccionar el vehículo dentro de los 10 días
    a partir de la fecha de registro.
- id: 102
  category: vehicle_information
  question: ¿Bajo qué condición se negará una oficina de vehículos motorizados a aceptar
    un certificado de título?
  choices:
    A: Si el vehículo tiene más de 10 años
    B: Si el certificado de título está doblado o arrugado
    C: Si la información en el título está ajustada, borrada o cancelada
    D: Si el vehículo fue registrado previamente en otro estado
  answer: C
  explanation: Una oficina de vehículos motorizados no aceptará un certificado de
    título si no se completa la declaración correcta del odómetro o de divulgación
    de daños, o si la información en el título está ajustada, borrada o cancelada.
- id: 103
  category: vehicle_information
  question: ¿Qué sucederá si la información en un certificado de título, como un nombre
    o firma, se ajusta, borra o cancela?
  choices:
    A: El DMV cobrará una tarifa de procesamiento adicional.
    B: El DMV no aceptará el certificado de título.
    C: El comprador debe pagar el impuesto sobre las ventas basado en el valor justo
      de mercado.
    D: El título se marcará automáticamente como 'Salvamento Reconstruido' (Rebuilt
      Salvage).
  answer: B
  explanation: Según el manual, una oficina de vehículos motorizados no aceptará un
    certificado de título si la información en el título está ajustada, borrada o
    cancelada, lo que incluye cualquier nombre o firma.
- id: 104
  category: vehicle_information
  question: Si compra un vehículo que tiene ocho años de modelo o menos, ¿qué declaraciones
    deben completarse en el Certificado de Título?
  choices:
    A: Solo la declaración del odómetro.
    B: Solo la declaración de divulgación de daños.
    C: Tanto la declaración del odómetro como la de divulgación de daños.
    D: Ninguna de las declaraciones es obligatoria para vehículos de menos de diez
      años.
  answer: C
  explanation: El manual establece que para un vehículo de ocho años de modelo o menos,
    el DMV no lo registrará ni le otorgará el título a menos que el vendedor haya
    completado, y el comprador haya firmado, tanto la declaración del odómetro como
    la de divulgación de daños.
- id: 105
  category: vehicle_information
  question: ¿Qué debe hacer el DMV antes de que un vehículo descrito como 'Salvamento
    Reconstruido' (Rebuilt Salvage) pueda ser registrado o titulado?
  choices:
    A: Examinar el vehículo en busca de piezas robadas.
    B: Realizar una prueba estricta de emisiones.
    C: Verificar el valor justo de mercado del vehículo.
    D: Emitir un nuevo número de identificación del vehículo (VIN).
  answer: A
  explanation: 'El manual establece explícitamente: ''El DMV debe examinar cada vehículo
    descrito como "Salvamento Reconstruido" (Rebuilt Salvage), O PALABRAS SIMILARES,
    en busca de piezas robadas antes de que el vehículo pueda ser registrado o titulado''.'
- id: 106
  category: vehicle_information
  question: Al comprar un vehículo a un vendedor privado, ¿qué sucede si el vendedor
    no completa su parte del formulario de Declaración de Transacción para un vehículo
    vendido por debajo del valor justo de mercado?
  choices:
    A: La solicitud de registro será denegada permanentemente.
    B: Se le cobrará el impuesto sobre las ventas basado en el valor justo de mercado
      actual del vehículo.
    C: Estará exento de pagar el impuesto sobre las ventas.
    D: El vendedor será multado por el DMV.
  answer: B
  explanation: Si el vendedor no completa el formulario para un vehículo vendido por
    debajo del valor justo de mercado, el manual señala que se le cobrará el impuesto
    sobre las ventas basado en el valor justo de mercado actual del vehículo.
- id: 107
  category: vehicle_information
  question: 'Al presentar una tarjeta de identificación de seguro para registrar su
    vehículo, la información en la tarjeta debe coincidir exactamente con:'
  choices:
    A: El nombre y el Número de Identificación del Vehículo (VIN) en la solicitud
      de registro.
    B: El nombre y la dirección en su licencia de conducir.
    C: La lectura del odómetro en el Certificado de Título.
    D: El precio de compra en la Declaración de Transacción.
  answer: A
  explanation: El manual especifica que el nombre o nombres y el número de identificación
    del vehículo (VIN) en las tarjetas de identificación del seguro deben coincidir
    exactamente con la información en la solicitud de registro.
- id: 108
  category: vehicle_information
  question: 'Para la mayoría de los vehículos con un peso bruto máximo de no más de
    18,000 libras, las tarifas de registro se basan en el/la del vehículo:'
  choices:
    A: Edad.
    B: Precio de compra.
    C: Peso.
    D: Caballos de fuerza.
  answer: C
  explanation: Los registros para la mayoría de los vehículos con un peso bruto máximo
    de no más de 18,000 libras son válidos por dos años, y las tarifas se basan en
    el peso del vehículo.
- id: 109
  category: vehicle_information
  question: ¿Bajo qué condición puede recibir un reembolso de sus tarifas de registro
    si ya ha usado las placas del vehículo o la calcomanía de registro por un día?
  choices:
    A: Si las devuelve dentro de los 30 días.
    B: Si vende el vehículo a un familiar.
    C: Si transfiere el registro a una motocicleta.
    D: Por ley, las tarifas de registro no se pueden reembolsar si se usan las placas
      o la calcomanía incluso por un día.
  answer: D
  explanation: 'El manual establece: ''Por ley, las tarifas de registro no se pueden
    reembolsar si usa las placas del vehículo o la calcomanía de registro en su vehículo,
    incluso por un solo día''.'
- id: 110
  category: driver_responsibility
  question: ¿Qué debe hacer antes de entregar o vender su vehículo viejo para evitar
    que se le cobren multas de estacionamiento que no son suyas?
  choices:
    A: Rayar el VIN en el tablero.
    B: Quitar las placas del vehículo y la calcomanía de registro del parabrisas.
    C: Dejar las placas puestas pero quitar la calcomanía de registro.
    D: Reportar el vehículo como robado al DMV.
  answer: B
  explanation: Antes de entregar o vender su vehículo viejo, debe asegurarse de quitar
    las placas del vehículo y la calcomanía de registro del parabrisas para evitar
    que se le cobren multas de estacionamiento que no son suyas.
- id: 111
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una razón por la cual podría NO recibir un
    recordatorio de renovación del registro por correo?
  choices:
    A: No ha respondido a tres o más multas de estacionamiento.
    B: Su vehículo tiene más de diez años de antigüedad.
    C: Renovó recientemente su licencia de conducir.
    D: Compró su vehículo a un vendedor particular en lugar de a un concesionario.
  answer: A
  explanation: El manual enumera varias razones por las que no recibirá un recordatorio
    de renovación, incluyendo si cambió su dirección sin notificar al DMV, si su registro
    está suspendido o revocado, o si no respondió a tres o más multas de estacionamiento.
- id: 112
  category: vehicle_information
  question: ¿Qué sucede si la fecha de vencimiento del registro de su vehículo cae
    en un fin de semana o en un feriado legal estatal?
  choices:
    A: Se le otorga un período de gracia de 30 días para renovar.
    B: El registro vence inmediatamente el viernes anterior.
    C: El registro se extiende automáticamente hasta la medianoche del siguiente día
      hábil.
    D: Debe pagar un cargo por pago atrasado al renovar el siguiente día hábil.
  answer: C
  explanation: Si la fecha de vencimiento cae en un fin de semana o en un feriado
    legal estatal, su registro se extiende automáticamente hasta la medianoche del
    siguiente día hábil.
- id: 113
  category: vehicle_information
  question: Si un tercero (alguien que no es el registrante) lleva una solicitud de
    registro a una oficina del DMV, ¿qué identificación debe proporcionar?
  choices:
    A: Solo la identificación original del registrante.
    B: Solo su propia identificación original.
    C: Su propia identificación original y el original o una fotocopia de la identificación
      del registrante.
    D: Una carta notariada del registrante y el título del vehículo.
  answer: C
  explanation: Una solicitud presentada por un tercero debe ir acompañada de la licencia/permiso/identificación
    de no conductor original de Nueva York del tercero y el original o una fotocopia
    de la identificación del registrante.
- id: 114
  category: driver_responsibility
  question: ¿Cuándo es obligatorio que su vehículo esté cubierto por un seguro de
    responsabilidad civil?
  choices:
    A: Solo cuando se conduce en vías públicas.
    B: Solo durante el primer año de registro.
    C: Mientras esté registrado, incluso si no lo conduce.
    D: Solo si el vehículo tiene menos de diez años de antigüedad.
  answer: C
  explanation: 'El manual establece: ''Su vehículo debe estar cubierto por un seguro
    de responsabilidad civil mientras esté registrado, incluso si no lo conduce''.'
- id: 115
  category: vehicle_information
  question: ¿Cuál es la cobertura mínima requerida de seguro de responsabilidad civil
    contra daños a la propiedad por un solo incidente en el estado de Nueva York?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: La cobertura mínima de responsabilidad civil requerida incluye $10,000
    contra daños a la propiedad.
- id: 116
  category: penalties_and_points
  question: ¿Cuál es la sanción si su vehículo no está asegurado durante 90 días y
    usted no ha entregado las placas del vehículo?
  choices:
    A: Su vehículo será reposeído por el DMV.
    B: Su licencia de conducir será suspendida.
    C: Se le requerirá tomar un curso de conducción defensiva.
    D: Su vehículo será marcado permanentemente como 'Salvamento Reconstruido'.
  answer: B
  explanation: Según el manual, si su vehículo no está asegurado durante 90 días,
    a menos que haya entregado las placas del vehículo, su licencia de conducir también
    será suspendida.
- id: 117
  category: vehicle_information
  question: ¿En qué se diferencian las reglas para entregar las placas del vehículo
    en el caso de las motocicletas cuando el seguro se interrumpe o vence?
  choices:
    A: Las placas de motocicleta deben entregarse dentro de las 24 horas posteriores
      al vencimiento del seguro.
    B: No es necesario entregar la placa del vehículo cuando el seguro de la motocicleta
      se interrumpe o vence.
    C: Las placas de motocicleta deben enviarse por correo directamente al Centro
      de Llamadas del DMV.
    D: Debe entregar la placa solo si la motocicleta se vende a un particular.
  answer: B
  explanation: El manual especifica que, aunque las motocicletas deben estar aseguradas,
    no es necesario entregar la placa del vehículo cuando el seguro de su motocicleta
    se interrumpe o vence.
- id: 118
  category: penalties_and_points
  question: ¿Cuál es la sanción si se le condena por conducir un vehículo sin seguro
    en el estado de Nueva York?
  choices:
    A: Una multa de hasta $1,000
    B: Su licencia o privilegio para conducir será revocado por al menos un año
    C: Su vehículo será incautado por 30 días
    D: Su licencia será suspendida por 90 días
  answer: B
  explanation: Según el manual, si es condenado por conducir un vehículo sin seguro,
    su licencia o privilegio para conducir en el estado de Nueva York será revocado
    por al menos un año.
- id: 119
  category: vehicle_information
  question: Si compra un vehículo a alguien que no es un concesionario del estado
    de Nueva York, ¿cuánto tiempo tiene para realizar la inspección del vehículo?
  choices:
    A: Dentro de los 5 días posteriores a su registro
    B: Dentro de los 10 días posteriores a su registro
    C: Dentro de los 20 días posteriores a su registro
    D: Dentro de los 30 días posteriores a su registro
  answer: B
  explanation: El manual establece que si compra un vehículo a alguien que no es un
    concesionario de NYS, debe hacer que el vehículo sea inspeccionado dentro de los
    10 días posteriores a su registro.
- id: 120
  category: vehicle_information
  question: Para calificar para una exención si su vehículo no pasa una primera inspección
    de emisiones de alto nivel o OBD II, ¿cuánto deben costar las reparaciones intentadas?
  choices:
    A: Al menos $250
    B: Al menos $300
    C: Al menos $450
    D: Al menos $500
  answer: C
  explanation: El manual especifica que para calificar para una exención, se debe
    intentar reparar la falla y el costo de las reparaciones debe ser de al menos
    $450.
- id: 121
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos a gasolina está exento de la inspección
    de emisiones de escape y solo está sujeto a una inspección de seguridad?
  choices:
    A: Un vehículo con 10 años de antigüedad de modelo
    B: Un vehículo con 26 o más años de antigüedad de modelo
    C: Un vehículo con un peso bruto superior a 8,500 libras
    D: Un vehículo comprado a un concesionario fuera del estado
  answer: B
  explanation: Las excepciones a la inspección de emisiones de escape incluyen vehículos
    a gasolina que tienen 26 o más años de antigüedad de modelo, menos de dos años
    de antigüedad de modelo o que están registrados como históricos.
- id: 122
  category: driver_responsibility
  question: ¿Cuál es el límite de tiempo y millaje para que el DMV reciba una queja
    contra un taller de reparación de automóviles?
  choices:
    A: Dentro de los 30 días o 1,000 millas de las reparaciones del vehículo
    B: Dentro de los 60 días o 2,000 millas de las reparaciones del vehículo
    C: Dentro de los 90 días o 3,000 millas de las reparaciones del vehículo
    D: Dentro de los 120 días o 4,000 millas de las reparaciones del vehículo
  answer: C
  explanation: Por reglamento, el DMV puede recibir una queja sobre un taller de reparación
    solo dentro de los 90 días o 3,000 millas (4,828 km) de las reparaciones del vehículo,
    lo que ocurra primero.
- id: 123
  category: signs_and_signals
  question: ¿Cómo son normalmente las señales de reglamentación?
  choices:
    A: Amarillas y en forma de diamante con letras negras
    B: Verdes con letras y símbolos blancos
    C: Rectángulos blancos con letras o símbolos negros
    D: Azules con letras o símbolos blancos
  answer: C
  explanation: El manual establece que las señales de reglamentación normalmente son
    rectángulos blancos con letras o símbolos negros, aunque algunas tienen formas
    diferentes o usan letras rojas.
- id: 124
  category: signs_and_signals
  question: ¿Cuál es la forma y el color normal de una señal de advertencia?
  choices:
    A: Blanca y rectangular
    B: Amarilla y en forma de diamante
    C: Naranja y circular
    D: Roja y octagonal
  answer: B
  explanation: Las señales de advertencia normalmente son amarillas y en forma de
    diamante, con letras o símbolos negros.
- id: 125
  category: signs_and_signals
  question: ¿Qué tipo de señal muestra la ubicación de servicios como áreas de descanso,
    gasolineras o instalaciones médicas?
  choices:
    A: Señales de destino
    B: Señales de advertencia
    C: Señales de ruta
    D: Señales de servicio
  answer: D
  explanation: Las señales de servicio son azules con letras o símbolos blancos y
    muestran la ubicación de servicios como áreas de descanso, gasolineras, campamentos
    o instalaciones médicas.
- id: 126
  category: signs_and_signals
  question: Al acercarse a una señal de alto (stop) donde no hay línea de parada ni
    cruce de peatones, ¿dónde debe detenerse por completo?
  choices:
    A: Al menos 10 pies antes de la intersección
    B: Antes de entrar en la intersección, en el punto más cercano a la intersección
      que le permita ver el tráfico
    C: Directamente al lado de la señal de alto
    D: Después de avanzar lentamente hacia la intersección para verificar el tráfico
  answer: B
  explanation: Si no hay una línea de parada o un cruce de peatones, debe detenerse
    antes de entrar en la intersección, en el punto más cercano a la intersección
    que le permita ver el tráfico en la vía transversal.
- id: 127
  category: signs_and_signals
  question: ¿De qué color son las señales de zona de trabajo?
  choices:
    A: Naranja con letras o símbolos negros
    B: Amarillo con letras o símbolos negros
    C: Rojo con letras o símbolos blancos
    D: Verde con letras o símbolos blancos
  answer: A
  explanation: Las señales de zona de trabajo son naranjas, con letras o símbolos
    negros, e indican que hay personas trabajando en la calzada o cerca de ella.
- id: 128
  category: safe_driving_rules
  question: ¿Qué debe hacer si se acerca a una intersección donde los semáforos están
    fuera de servicio?
  choices:
    A: Continuar a través de la intersección sin detenerse si el camino está despejado
    B: Ceder el paso a los vehículos a su derecha y proceder con precaución
    C: Detenerse como lo haría ante una señal de alto
    D: Esperar a que llegue un oficial de policía antes de continuar
  answer: C
  explanation: La ley estatal exige que si los semáforos o controles de tráfico están
    fuera de servicio o no funcionan correctamente al acercarse a una intersección,
    debe detenerse como lo haría ante una señal de alto.
- id: 129
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite realizar un giro a la izquierda con
    una luz roja fija?
  choices:
    A: Al girar desde una carretera de doble sentido hacia una de un solo sentido
    B: Al girar desde una carretera de un solo sentido hacia otra carretera de un
      solo sentido después de detenerse por completo y ceder el paso
    C: Al girar hacia una autopista de varios carriles con una mediana
    D: Nunca se permite girar a la izquierda con luz roja en el estado de Nueva York
  answer: B
  explanation: Puede realizar un giro a la izquierda con una luz roja fija cuando
    gira desde una carretera de un solo sentido hacia otra carretera de un solo sentido
    después de detenerse por completo y ceder el derecho de paso.
- id: 130
  category: safe_driving_rules
  question: ¿Cuál es la regla para girar con luz roja en la ciudad de Nueva York?
  choices:
    A: Puede girar a la derecha en rojo después de detenerse por completo
    B: Puede girar en rojo solo entre las 10 PM y las 6 AM
    C: No se permite girar con luz roja a menos que haya una señal que lo permita
    D: Puede girar a la izquierda en rojo desde una calle de un solo sentido hacia
      otra calle de un solo sentido
  answer: C
  explanation: 'El manual establece explícitamente: ''No se permite girar con luz
    roja en la ciudad de Nueva York a menos que haya una señal que lo permita''.'
- id: 131
  category: vehicle_information
  question: Si una persona se muda al estado de Nueva York, ¿por cuánto tiempo es
    válido su certificado de inspección vehicular anterior de otro estado?
  choices:
    A: Por 30 días después de registrar el vehículo en Nueva York
    B: Hasta que expire o un año a partir de la fecha en que fue emitido, lo que ocurra
      primero
    C: No es válido; el vehículo debe ser inspeccionado inmediatamente
    D: Por 6 meses a partir de la fecha en que establezca su residencia
  answer: B
  explanation: Si una persona se muda al estado de Nueva York (NYS), un certificado
    de inspección que fue emitido anteriormente es válido hasta que expire o un año
    a partir de la fecha en que fue emitido, lo que ocurra primero.
- id: 132
  category: vehicle_information
  question: ¿Qué debe hacer con la placa de su vehículo si el seguro de su motocicleta
    se cancela o vence?
  choices:
    A: Entregarla al DMV inmediatamente
    B: Enviarla por correo a su compañía de seguros
    C: No es necesario entregar la placa del vehículo
    D: Destruir la placa y solicitar una nueva cuando vuelva a estar asegurado
  answer: C
  explanation: 'El manual establece: ''Las motocicletas deben estar aseguradas, pero
    no es necesario entregar la placa del vehículo cuando el seguro de su motocicleta
    se cancela o vence''.'
- id: 133
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente en un semáforo?
  choices:
    A: El semáforo está averiado; proceda con precaución.
    B: Deténgase, ceda el paso y avance cuando sea seguro.
    C: Reduzca la velocidad y prepárese para detenerse.
    D: Ceda el paso a todo el tráfico a su derecha.
  answer: B
  explanation: 'Una luz roja intermitente significa lo mismo que una señal de PARE
    (STOP): Deténgase, ceda el paso y avance cuando sea seguro.'
- id: 134
  category: signs_and_signals
  question: ¿Qué indica una luz 'X' amarilla intermitente sobre un carril de la autopista?
  choices:
    A: No conduzca por este carril.
    B: Salga de este carril inmediatamente.
    C: Este carril solo puede utilizarse para girar a la izquierda.
    D: El carril está reservado para vehículos de alta ocupación.
  answer: C
  explanation: Una 'X' amarilla intermitente sobre el pavimento indica que este carril
    solo puede utilizarse para girar a la izquierda.
- id: 135
  category: signs_and_signals
  question: ¿Qué indica si una línea de borde sólida se inclina hacia el centro de
    la carretera?
  choices:
    A: La carretera es más estrecha más adelante.
    B: Se está acercando a una cabina de peaje.
    C: El límite de velocidad está disminuyendo.
    D: Debe incorporarse al carril izquierdo.
  answer: A
  explanation: Una línea de borde que se inclina hacia el centro de la carretera muestra
    que la carretera es más estrecha más adelante.
- id: 136
  category: signs_and_signals
  question: ¿Cuál es la diferencia entre las líneas blancas y amarillas de los carriles?
  choices:
    A: Las líneas blancas separan el tráfico que se mueve en direcciones opuestas;
      las líneas amarillas separan los carriles que se mueven en la misma dirección.
    B: Las líneas blancas separan los carriles de tráfico que se mueven en la misma
      dirección; las líneas amarillas separan el tráfico que se mueve en direcciones
      opuestas.
    C: Las líneas blancas indican zonas de estacionamiento; las líneas amarillas indican
      zonas donde no se permite estacionar.
    D: Las líneas blancas se usan en autopistas; las líneas amarillas se usan en calles
      de la ciudad.
  answer: B
  explanation: Las líneas que separan los carriles de tráfico que se mueven en la
    misma dirección son blancas. Las líneas que separan el tráfico que se mueve en
    direcciones opuestas son amarillas.
- id: 137
  category: safe_driving_rules
  question: Si conduce por una carretera con una línea amarilla sólida junto a una
    línea amarilla discontinua, y usted está en el lado de la línea sólida, ¿qué se
    le permite hacer?
  choices:
    A: Puede adelantar a otros vehículos si el camino por delante está despejado.
    B: No puede adelantar a otros vehículos ni cruzar la línea, excepto para girar
      a la izquierda hacia una entrada privada.
    C: Solo puede cruzar la línea para adelantar a equipos agrícolas de movimiento
      lento.
    D: Nunca se le permite cruzar la línea sólida por ningún motivo.
  answer: B
  explanation: 'Línea sólida con línea discontinua: Si usted está en el lado de la
    línea sólida, no puede adelantar a otros vehículos ni cruzar la línea, excepto
    para girar a la izquierda hacia una entrada privada.'
- id: 138
  category: safe_driving_rules
  question: ¿Cuándo se le permite cruzar líneas sólidas dobles en la calzada?
  choices:
    A: Al adelantar a un vehículo que viaja por debajo del límite de velocidad.
    B: Cuando necesite girar a la izquierda para entrar o salir de la autopista, como
      hacia una entrada privada.
    C: Cuando el vehículo delante de usted se detiene para un peatón.
    D: Nunca puede cruzar líneas sólidas dobles bajo ninguna circunstancia.
  answer: B
  explanation: 'Líneas sólidas dobles: No puede adelantar ni cambiar de carril. No
    puede cruzar las líneas excepto para girar a la izquierda para entrar o salir
    de la autopista (por ejemplo, hacia o desde una entrada privada o para hacer un
    giro en U).'
- id: 139
  category: signs_and_signals
  question: ¿Qué indica un símbolo de diamante pintado en la calzada?
  choices:
    A: Hay un cruce de peatones más adelante.
    B: El carril está reservado para autobuses, vehículos de alta ocupación (HOV),
      bicicletas u otros vehículos especiales.
    C: El carril termina más adelante y debe incorporarse.
    D: Se está acercando a un cruce de ferrocarril.
  answer: B
  explanation: El símbolo de diamante indica que el carril está reservado para autobuses,
    HOV (High-Occupancy Vehicles) como autos compartidos y camionetas compartidas,
    bicicletas u otros vehículos especiales.
- id: 140
  category: safe_driving_rules
  question: Si un oficial de tránsito le indica que pase por una luz roja, ¿qué debe
    hacer?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Obedecer al oficial y pasar por la luz roja.
    C: Tocar la bocina para advertir a otros conductores antes de proceder.
    D: Orillarse a un lado de la carretera hasta que la luz cambie.
  answer: B
  explanation: Las instrucciones dadas por los oficiales de tránsito tienen prioridad
    sobre las señales, semáforos o marcas en el pavimento. Si un oficial le indica
    que pase por una luz roja o una señal de pare, debe hacerlo.
- id: 141
  category: safe_driving_rules
  question: Si usted y un conductor que se aproxima desde la dirección opuesta llegan
    a una intersección al mismo tiempo, y usted desea girar a la izquierda mientras
    el otro conductor sigue recto, ¿quién tiene el derecho de paso?
  choices:
    A: Usted tiene el derecho de paso porque está girando.
    B: El conductor que sigue recto tiene el derecho de paso.
    C: Quien entre primero en la intersección tiene el derecho de paso.
    D: El conductor a la derecha tiene el derecho de paso.
  answer: B
  explanation: Si los conductores que se aproximan desde direcciones opuestas llegan
    a una intersección aproximadamente al mismo tiempo, el conductor que gira a la
    izquierda debe ceder el paso al tráfico que sigue recto o gira a la derecha.
- id: 142
  category: defensive_driving
  question: Mientras espera en una intersección para realizar un giro a la izquierda,
    ¿cómo debe posicionar las ruedas de su vehículo?
  choices:
    A: Mantenga las ruedas giradas hacia la izquierda para prepararse para el giro.
    B: Mantenga las ruedas giradas hacia la derecha para evitar bloquear el tráfico.
    C: Mantenga las ruedas rectas para evitar ser empujado hacia el tráfico en sentido
      contrario si lo golpean por detrás.
    D: No importa cómo estén posicionadas las ruedas.
  answer: C
  explanation: Cuando entre en la intersección, manténgase a la derecha de la línea
    central. Mantenga las ruedas rectas para evitar ser empujado hacia el tráfico
    en sentido contrario si su vehículo es golpeado por detrás.
- id: 143
  category: safe_driving_rules
  question: En una intersección no controlada por señales o semáforos, si dos conductores
    llegan en ángulos rectos al mismo tiempo, ¿quién debe ceder el paso?
  choices:
    A: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
    B: El conductor de la izquierda debe ceder el paso al conductor de la derecha.
    C: El conductor que va más rápido tiene el derecho de paso.
    D: El conductor en la carretera más ancha tiene el derecho de paso.
  answer: B
  explanation: En las intersecciones no controladas por señales o semáforos, o donde
    dos o más conductores se detienen ante señales de PARE (STOP) al mismo tiempo
    y están en ángulos rectos, el conductor de la izquierda debe ceder el derecho
    de paso al conductor de la derecha.
- id: 144
  category: signs_and_signals
  question: ¿Qué indica una sola línea continua que separa los carriles de tráfico?
  choices:
    A: No se puede rebasar ni cambiar de carril bajo ninguna circunstancia.
    B: Puede rebasar o cambiar de carril libremente siempre que ponga la señal.
    C: Puede rebasar o cambiar de carril, pero solo cuando las obstrucciones o las
      condiciones del tráfico lo hagan necesario.
    D: El carril está reservado únicamente para vehículos de emergencia.
  answer: C
  explanation: 'Una línea continua: Puede rebasar a otros vehículos o cambiar de carril,
    pero solo puede hacerlo cuando las obstrucciones en la carretera o las condiciones
    del tráfico lo hagan necesario.'
- id: 145
  category: safe_driving_rules
  question: Si dos conductores llegan a una intersección sin señales ni semáforos
    al mismo tiempo en ángulos rectos, ¿quién debe ceder el derecho de paso?
  choices:
    A: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
    B: El conductor de la izquierda debe ceder el paso al conductor de la derecha.
    C: El conductor que va más rápido tiene el derecho de paso.
    D: El conductor que gira a la izquierda tiene el derecho de paso.
  answer: B
  explanation: En las intersecciones no controladas por señales o semáforos, o donde
    dos o más conductores se detienen ante señales de PARE (STOP) al mismo tiempo
    y están en ángulos rectos, el conductor de la izquierda debe ceder el derecho
    de paso al conductor de la derecha.
- id: 146
  category: safe_driving_rules
  question: ¿Qué debe hacer al entrar a una calle desde una entrada privada o un estacionamiento?
  choices:
    A: Tocar la bocina y avanzar hacia el tráfico.
    B: Ceder el paso solo a los vehículos que se aproximan por su izquierda.
    C: Detenerse y ceder el derecho de paso al tráfico en la calzada y a los peatones.
    D: Incorporarse al tráfico sin detenerse si está girando a la derecha.
  answer: C
  explanation: Un vehículo que entra en una calzada desde una entrada, camino privado
    u otro lugar que no sea una calzada, debe detenerse y ceder el derecho de paso
    al tráfico en la calzada y a los peatones.
- id: 147
  category: defensive_driving
  question: ¿Qué debe hacer si desea cruzar una intersección pero el tráfico está
    congestionado al otro lado?
  choices:
    A: Entrar en la intersección y esperar a que el tráfico se despeje.
    B: Esperar hasta que el tráfico de adelante se despeje para no bloquear la intersección.
    C: Avanzar lentamente y forzar su entrada en la línea de tráfico.
    D: Girar a la derecha en lugar de seguir recto.
  answer: B
  explanation: No puede entrar en una intersección si el tráfico está congestionado
    al otro lado y no puede atravesar completamente la intersección. Espere hasta
    que el tráfico de adelante se despeje, para no bloquear la intersección.
- id: 148
  category: safe_driving_rules
  question: ¿Está obligado a orillarse ante un vehículo de emergencia que se aproxima
    en el carril opuesto de una vía de doble sentido?
  choices:
    A: Sí, debe orillarse y detenerse.
    B: No, solo si viaja en su carril.
    C: No, pero debe reducir la velocidad.
    D: Sí, pero solo si no hay un divisor físico.
  answer: A
  explanation: Debe orillarse y detenerse ante un vehículo de emergencia, incluso
    si se dirige hacia usted en el carril opuesto de una vía de doble sentido.
- id: 149
  category: defensive_driving
  question: ¿Qué debe hacer si escucha una sirena de emergencia cerca pero no sabe
    exactamente dónde está el vehículo de emergencia?
  choices:
    A: Detenerse inmediatamente en su carril actual.
    B: Aumentar la velocidad hasta que vea el vehículo.
    C: Orillarse con seguridad hacia el borde derecho de la carretera y detenerse
      hasta estar seguro de que no se dirige hacia usted.
    D: Continuar conduciendo al límite de velocidad mientras revisa sus espejos.
  answer: C
  explanation: Si escucha una sirena o bocina de aire cerca pero no sabe exactamente
    dónde está el vehículo de emergencia, debe orillarse con seguridad hacia el borde
    derecho de la carretera y detenerse hasta estar seguro de que no se dirige hacia
    usted.
- id: 150
  category: safe_driving_rules
  question: Bajo la Ley de Moverse a un Lado (Move Over Law), ¿qué debe hacer un conductor
    al acercarse a un vehículo de emergencia detenido con luces intermitentes en una
    autopista de varios carriles?
  choices:
    A: Detenerse inmediatamente al lado del vehículo de emergencia.
    B: Mantener la velocidad pero moverse al arcén derecho.
    C: Reducir la velocidad y cambiarse del carril adyacente al vehículo de emergencia,
      si es seguro hacerlo.
    D: Tocar la bocina para advertir a los trabajadores de emergencia.
  answer: C
  explanation: Los conductores deben reducir la velocidad en todas las carreteras
    al encontrarse con tales vehículos, pero en autopistas, carreteras interestatales
    y otras vías de acceso controlado con múltiples carriles, se requiere además que
    los conductores se cambien del carril adyacente al vehículo de emergencia o de
    peligro, a menos que el tráfico u otros peligros impidan hacerlo de manera segura.
- id: 151
  category: signs_and_signals
  question: ¿Qué indica una luz verde intermitente en un vehículo personal?
  choices:
    A: Un bombero voluntario que responde a una alarma.
    B: Un miembro voluntario de una ambulancia o de un equipo de rescate.
    C: Un quitanieves o una grúa.
    D: Un vehículo de entrega de correo rural.
  answer: B
  explanation: Los vehículos personales conducidos por bomberos voluntarios que responden
    a alarmas pueden mostrar luces azules, y los conducidos por miembros voluntarios
    de ambulancias o equipos de rescate pueden mostrar luces verdes.
- id: 152
  category: sharing_the_road
  question: ¿Está legalmente obligado a ceder el derecho de paso a un vehículo personal
    que muestra una luz azul intermitente?
  choices:
    A: Sí, se consideran vehículos de emergencia autorizados.
    B: Sí, pero solo si también hacen sonar una sirena.
    C: No, pero debe ceder el paso por cortesía si puede hacerlo de manera segura.
    D: No, debe mantener su velocidad y el derecho de paso en todo momento.
  answer: C
  explanation: Los vehículos que muestran luces azules, verdes o ámbar no son vehículos
    de emergencia autorizados. Sus conductores deben obedecer todas las leyes de tránsito.
    Aunque no está obligado a ceder el derecho de paso, debe hacerlo por cortesía
    si puede hacerlo de manera segura.
- id: 153
  category: safe_driving_rules
  question: ¿Con cuánta anticipación a un giro o cambio de carril exige la ley que
    se haga la señal?
  choices:
    A: Al menos 50 pies (15 m)
    B: Al menos 100 pies (30 m)
    C: Al menos 200 pies (60 m)
    D: Al menos 300 pies (90 m)
  answer: B
  explanation: La ley exige que señale un giro o cambio de carril con sus luces direccionales
    o señales manuales al menos 100 pies (30 m) antes.
- id: 154
  category: defensive_driving
  question: ¿Por qué debe mantener las ruedas rectas mientras espera en una intersección
    para realizar un giro?
  choices:
    A: Evita que el líquido de la dirección asistida se sobrecaliente.
    B: Le ayuda a acelerar más rápido cuando la luz cambia a verde.
    C: Si lo golpean por detrás, su vehículo podría ser empujado hacia el carril de
      tráfico en sentido contrario.
    D: Facilita que los peatones vean su vehículo.
  answer: C
  explanation: Mantenga las ruedas rectas hasta que realmente comience a realizar
    el giro. Si las ruedas están giradas y lo golpean por detrás, su vehículo podría
    ser empujado hacia el carril de tráfico en sentido contrario.
- id: 155
  category: vehicle_information
  question: Al realizar un giro, ¿qué debe recordar sobre la trayectoria de sus ruedas
    traseras?
  choices:
    A: Viajarán por fuera de la trayectoria de las ruedas delanteras.
    B: Viajarán por dentro de la trayectoria de las ruedas delanteras.
    C: Seguirán exactamente la misma trayectoria que las ruedas delanteras.
    D: Patinarán si no frena durante el giro.
  answer: B
  explanation: Recuerde que sus ruedas traseras viajarán por dentro de la trayectoria
    de las ruedas delanteras, más cerca de la acera (giro a la derecha) o del tráfico
    que viene hacia usted (giro a la izquierda).
- id: 156
  category: sharing_the_road
  question: ¿Cuál es una causa común de choques que involucran motocicletas y otros
    vehículos?
  choices:
    A: La motocicleta circula demasiado despacio.
    B: El conductor del otro vehículo no ve la motocicleta.
    C: Los faros de la motocicleta son demasiado brillantes.
    D: La motocicleta no señala antes de girar.
  answer: B
  explanation: La mayoría de los choques que involucran motocicletas y otros vehículos
    se producen porque el conductor del otro vehículo no ha visto la motocicleta.
- id: 157
  category: safe_driving_rules
  question: Al realizar un giro a la izquierda desde una carretera de doble sentido
    hacia otra carretera de doble sentido, ¿cómo debe aproximarse al giro?
  choices:
    A: Desde el carril del extremo derecho de la calzada.
    B: Desde la mitad izquierda de la calzada.
    C: Desde la mitad derecha de la calzada más cercana al centro.
    D: Abriéndose hacia la derecha antes de girar a la izquierda.
  answer: C
  explanation: Al realizar un giro a la izquierda desde una carretera de doble sentido
    hacia una carretera de doble sentido, aproxímese al giro desde la mitad derecha
    de la calzada más cercana al centro.
- id: 158
  category: safe_driving_rules
  question: ¿Desde qué carril se le permite realizar un giro en U?
  choices:
    A: El arcén derecho.
    B: El carril del extremo derecho.
    C: La parte izquierda del carril más cercano a la línea central.
    D: Cualquier carril, siempre que no haya tráfico en sentido contrario.
  answer: C
  explanation: Puede realizar un giro en U solo desde la parte izquierda del carril
    más cercano a la línea central de la calzada, nunca desde el carril derecho.
- id: 159
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar la Ley de Moverse a un Lado (Move Over
    Law)?
  choices:
    A: Se sanciona como una infracción de tránsito en movimiento.
    B: Resulta en una suspensión automática de la licencia.
    C: Se considera un delito grave (felony).
    D: No conlleva sanción, sino una advertencia por escrito.
  answer: A
  explanation: Las violaciones de esta ley [la Ley de Moverse a un Lado] se sancionan
    como una infracción de tránsito en movimiento.
- id: 160
  category: safe_driving_rules
  question: Según la ley del estado de Nueva York, ¿en cuál de los siguientes lugares
    está estrictamente prohibido realizar un giro en U?
  choices:
    A: En una calle estrecha de doble sentido
    B: En una zona escolar
    C: En una intersección con una señal de flecha verde a la izquierda
    D: En una entrada para vehículos residencial
  answer: B
  explanation: El manual establece que está prohibido que un vehículo realice un giro
    en U en una zona escolar, así como en autopistas de acceso limitado y en distritos
    comerciales de la ciudad de Nueva York.
- id: 161
  category: safe_driving_rules
  question: ¿A qué distancia deben poder ver su vehículo otros conductores para que
    usted pueda realizar legalmente un giro en U cerca de una colina o curva?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: No puede realizar un giro en U cerca de la cima de una colina, una
    curva o cualquier otro lugar donde otros conductores no puedan ver su vehículo
    desde 500 pies (150 m) de distancia en cualquier dirección.
- id: 162
  category: safe_driving_rules
  question: ¿Cuál es el primer paso que debe dar al realizar un giro de tres puntos?
  choices:
    A: Señalizar a la izquierda y conducir a través de la carretera
    B: Girar el volante lo más posible hacia la derecha
    C: Señalizar con la luz de giro a la derecha, luego orillarse a la derecha y detenerse
    D: Revisar el espejo retrovisor interior y retroceder
  answer: C
  explanation: Para realizar un giro de tres puntos, el paso 1 es señalizar con la
    luz de giro a la derecha, luego orillarse a la derecha y detenerse.
- id: 163
  category: sharing_the_road
  question: Al rebasar una motocicleta, ¿qué debe hacer para garantizar la seguridad?
  choices:
    A: Compartir el carril si el carril es lo suficientemente ancho
    B: Darle a la motocicleta el mismo ancho de carril completo que a otros vehículos
    C: Rebasar únicamente por el lado derecho
    D: Tocar la bocina antes de entrar en su espacio de carril
  answer: B
  explanation: Cuando rebase una motocicleta, recuerde darle a la motocicleta el mismo
    ancho de carril completo que se permite a otros vehículos. Nunca se mueva al mismo
    espacio de carril que una motocicleta.
- id: 164
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe usar su luz de giro o señal manual para indicar
    su intención de cambiar de carril?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: La ley exige que use las luces de giro o las señales con la mano y
    el brazo para indicar su intención de cambiar de carril al menos 100 pies (30
    m) antes de realizar el cambio de carril.
- id: 165
  category: safe_driving_rules
  question: ¿Se le prohíbe rebasar a un vehículo por la izquierda si se encuentra
    a menos de cuántos pies de un cruce de ferrocarril en una carretera de doble sentido?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: No puede rebasar a un vehículo por la izquierda si se encuentra a menos
    de 100 pies (30 m) de un cruce de ferrocarril en una carretera de doble sentido.
- id: 166
  category: safe_driving_rules
  question: Al rebasar un vehículo por la izquierda, ¿debe poder regresar de manera
    segura al carril derecho antes de que cualquier vehículo que venga en sentido
    contrario se acerque a qué distancia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: No puede rebasar a un vehículo por la izquierda si no puede regresar
    de manera segura al carril derecho antes de que cualquier vehículo que venga en
    sentido contrario se acerque a menos de 200 pies (60 m) de usted.
- id: 167
  category: defensive_driving
  question: ¿Por qué debería mirar rápidamente por encima del hombro antes de cambiar
    de carril para rebasar?
  choices:
    A: Para buscar vehículos de emergencia a lo lejos
    B: Porque es ilegal usar los espejos al rebasar
    C: Para asegurarse de no exceder el límite de velocidad
    D: Porque los espejos correctamente ajustados aún dejan puntos ciegos
  answer: D
  explanation: Nunca dependa de sus espejos cuando se prepare para cambiar de carril.
    Incluso los espejos correctamente ajustados dejarán 'puntos ciegos' detrás de
    ambos lados de su vehículo.
- id: 168
  category: safe_driving_rules
  question: Después de rebasar un vehículo por la izquierda, ¿cómo sabe que es seguro
    regresar al carril derecho?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del otro
      vehículo
    B: Cuando pueda ver el parachoques delantero del vehículo rebasado en su espejo
      retrovisor interior
    C: Inmediatamente después de activar su luz de giro a la derecha
    D: Cuando esté a 100 pies por delante del vehículo rebasado
  answer: B
  explanation: Antes de regresar al carril derecho, señalice y mire su espejo retrovisor
    interior y asegúrese de que puede ver el parachoques delantero del vehículo que
    rebasó.
- id: 169
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones se le permite rebasar a otro
    vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante circula por debajo del límite de velocidad
    B: Cuando se encuentra en un camino de tierra estrecho de un solo carril
    C: Cuando un vehículo que va delante realiza un giro a la izquierda
    D: Conduciendo por el arcén no pavimentado de la carretera
  answer: C
  explanation: Puede rebasar a un vehículo por la derecha solo en condiciones específicas,
    como cuando un vehículo que va delante realiza un giro a la izquierda, siempre
    que pueda rebasar de forma segura sin conducir sobre o a través del arcén.
- id: 170
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo le rebasa por la izquierda?
  choices:
    A: Aumentar su velocidad para evitar que le rebasen
    B: Moverse hacia el arcén derecho de la carretera
    C: Disminuir ligeramente su velocidad y mantenerse centrado en su carril
    D: Encender y apagar sus faros para advertir al tráfico que viene en sentido contrario
  answer: C
  explanation: Si otro vehículo le rebasa por la izquierda, disminuya ligeramente
    su velocidad y manténgase centrado en su carril.
- id: 171
  category: sharing_the_road
  question: ¿A qué distancia debe detenerse de un autobús escolar que tiene sus luces
    rojas intermitentes encendidas?
  choices:
    A: Al menos 10 pies
    B: Al menos 15 pies
    C: Al menos 20 pies
    D: Al menos 50 pies
  answer: C
  explanation: Cuando un autobús escolar detenido activa sus luces rojas intermitentes,
    el tráfico que se aproxima desde cualquier dirección debe detenerse antes de llegar
    al autobús. Debe detenerse al menos a 20 pies (6 m) de distancia del autobús.
- id: 172
  category: safe_driving_rules
  question: Si conduce por una carretera dividida y un autobús escolar en el lado
    opuesto de la carretera se detiene con sus luces rojas intermitentes encendidas,
    ¿qué debe hacer?
  choices:
    A: Continuar con precaución ya que la carretera está dividida
    B: Detenerse, ya que la ley se aplica en todas las vías del estado de Nueva York
    C: Reducir la velocidad a 15 mph y pasar con cuidado
    D: Detenerse solo si hay niños cruzando activamente su lado de la carretera
  answer: B
  explanation: Esta ley se aplica en todas las vías del estado de Nueva York. Debe
    detenerse ante un autobús escolar incluso si se encuentra en el lado opuesto de
    una carretera dividida.
- id: 173
  category: penalties_and_points
  question: ¿Cuál es la sanción por ser condenado por rebasar un autobús escolar detenido
    tres veces en un periodo de tres años?
  choices:
    A: Una multa máxima de $250
    B: Un curso obligatorio de conducción defensiva
    C: Su licencia de conducir será revocada por un mínimo de seis meses
    D: Su vehículo será confiscado por 30 días
  answer: C
  explanation: Si es condenado por tres de estas infracciones en tres años, su licencia
    de conducir será revocada por un mínimo de seis meses.
- id: 174
  category: sharing_the_road
  question: ¿Qué indican las luces amarillas de advertencia intermitentes en un autobús
    escolar?
  choices:
    A: El autobús está averiado y necesita asistencia
    B: El autobús se está preparando para detenerse para recoger o dejar pasajeros
    C: Se le requiere detenerse inmediatamente
    D: El autobús está acelerando para incorporarse al tráfico
  answer: B
  explanation: Antes de que un autobús escolar se detenga para recoger o dejar pasajeros,
    el conductor generalmente activará las luces amarillas de advertencia intermitentes.
    Cuando las vea, reduzca la velocidad y prepárese para detenerse.
- id: 175
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por una primera infracción al rebasar un autobús
    escolar detenido?
  choices:
    A: $100
    B: $150
    C: $250
    D: $500
  answer: C
  explanation: Según el manual, la multa por rebasar un autobús escolar detenido oscila
    entre un mínimo de $250 por una primera infracción y un máximo de $1,000 por tres
    infracciones en tres años.
- id: 176
  category: penalties_and_points
  question: Según la ley de cámaras en el brazo de parada, ¿cuál es la sanción por
    una tercera infracción al rebasar un autobús escolar detenido en un periodo de
    18 meses?
  choices:
    A: $250
    B: $275
    C: $300
    D: $500
  answer: C
  explanation: El manual especifica que una tercera infracción (o más) en un periodo
    de 18 meses captada por una cámara en el brazo de parada conlleva una sanción
    de $300.
- id: 177
  category: safe_driving_rules
  question: Cuando haya terminado de estacionar en paralelo, ¿a qué distancia deben
    estar las ruedas del bordillo?
  choices:
    A: A no más de un pie (30 cm)
    B: A no más de dieciocho pulgadas
    C: A no más de dos pies
    D: A no más de seis pulgadas
  answer: A
  explanation: 'El manual establece: "En su posición final de estacionamiento, sus
    ruedas no deben estar a más de un pie (30 cm) del bordillo".'
- id: 178
  category: safe_driving_rules
  question: ¿Hacia dónde debe mirar al retroceder su vehículo durante una maniobra
    de estacionamiento en paralelo?
  choices:
    A: Solo por los espejos laterales
    B: A través de la ventana trasera
    C: Solo por el espejo retrovisor interior
    D: Exclusivamente a la pantalla de su cámara de reversa
  answer: B
  explanation: El manual instruye a los conductores a "Mirar a través de la ventana
    trasera, no por los espejos, cuando retroceda" durante el estacionamiento en paralelo.
- id: 179
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante al estacionar en una colina?
  choices:
    A: Lejos del bordillo
    B: Hacia el bordillo o el lado de la carretera
    C: Hacia adelante en línea recta
    D: Paralelo a la línea central
  answer: B
  explanation: Al estacionar en una colina, el manual indica "Gire las ruedas hacia
    el bordillo o el lado de la carretera, para que eviten que su vehículo se dirija
    hacia el tráfico".
- id: 180
  category: signs_and_signals
  question: ¿Qué indica una señal de NO ESTACIONAR (NO PARKING)?
  choices:
    A: No puede detenerse por ningún motivo.
    B: Solo puede detenerse para obedecer una señal de tráfico.
    C: Puede realizar una parada temporal para cargar o descargar mercancía o pasajeros.
    D: Puede estacionar si permanece en el asiento del conductor.
  answer: C
  explanation: Según el manual, "Una señal de NO ESTACIONAR significa que puede realizar
    una parada temporal para cargar o descargar mercancía o pasajeros".
- id: 181
  category: signs_and_signals
  question: ¿Qué se le permite hacer ante una señal de PROHIBIDO ESTACIONAR (NO STANDING)?
  choices:
    A: Detenerse temporalmente para cargar o descargar pasajeros sin salir del vehículo.
    B: Detenerse para cargar o descargar mercancía.
    C: Estacionar por menos de 5 minutos.
    D: Dejar el vehículo encendido mientras hace un recado.
  answer: A
  explanation: 'El manual establece: "Una señal de PROHIBIDO ESTACIONAR (NO STANDING)
    significa que solo puede realizar una parada temporal para cargar o descargar
    pasajeros. El conductor no puede salir del vehículo".'
- id: 182
  category: safe_driving_rules
  question: ¿A qué distancia debe mantenerse de un hidrante de incendios al estacionar,
    detenerse o pararse, a menos que un conductor con licencia permanezca en el vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: No puede estacionar, detenerse ni pararse a menos de 15 pies (5 m)
    de un hidrante de incendios, a menos que un conductor con licencia permanezca
    en el vehículo para moverlo en caso de emergencia.
- id: 183
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener al estacionar o pararse
    cerca de un paso de peatones en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: No se permite estacionar ni pararse a menos de 20 pies (6 m) de un
    paso de peatones en una intersección.
- id: 184
  category: safe_driving_rules
  question: ¿A qué distancia de una señal de PARE (STOP), CEDA EL PASO (YIELD) o semáforo
    no se le permite estacionar ni pararse?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El manual establece que no se permite estacionar ni pararse a menos
    de 30 pies (10 m) de un semáforo, una señal de PARE (STOP) o una señal de CEDA
    EL PASO (YIELD).
- id: 185
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima a la que debe estacionar de un cruce de ferrocarril?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: D
  explanation: Según el manual, "No puede estacionar su vehículo a menos de 50 pies
    (15 m) de un cruce de ferrocarril".
- id: 186
  category: driver_responsibility
  question: ¿Cuándo se le permite legalmente estacionar en un espacio reservado para
    personas con discapacidades?
  choices:
    A: En cualquier momento, siempre que tenga un permiso de estacionamiento para
      discapacitados en el vehículo.
    B: Solo si tiene un permiso o placas Y la persona que los recibió está en el vehículo.
    C: Si está haciendo un recado rápido para un familiar con discapacidad.
    D: Si todos los demás espacios de estacionamiento regulares están ocupados actualmente.
  answer: B
  explanation: Puede estacionar en espacios reservados solo si tiene un permiso o
    placas de vehículo para personas con discapacidades y solo cuando la persona que
    recibió el permiso o las placas de vehículo esté en el vehículo.
- id: 187
  category: safe_driving_rules
  question: ¿Por qué debe evitar estacionar en los espacios con franjas diagonales
    junto a las áreas de estacionamiento reservadas para discapacitados?
  choices:
    A: Están reservados exclusivamente para vehículos de emergencia.
    B: Son zonas de carga para camiones de reparto.
    C: Proporcionan el acceso necesario para sillas de ruedas y vehículos con equipo
      especial.
    D: Están designados para el almacenamiento de carritos de compra.
  answer: C
  explanation: 'El manual advierte: "No estacione en los espacios con franjas diagonales
    junto a las áreas de estacionamiento reservadas. Estos espacios son necesarios
    para dar acceso a personas con sillas de ruedas y vehículos con equipo especial".'
- id: 188
  category: penalties_and_points
  question: ¿Cuál es una de las sanciones por hacer una declaración falsa en una solicitud
    de placas de vehículo para personas con discapacidad?
  choices:
    A: Una revocación obligatoria de la licencia
    B: Una carta de advertencia del DMV
    C: Un curso obligatorio de conducción defensiva
    D: Un embargo del vehículo por 30 días
  answer: A
  explanation: Es un delito menor hacer una declaración falsa en una solicitud de
    placas de vehículo, y estaría sujeto a una revocación obligatoria de la licencia
    y podría enfrentar una multa, encarcelamiento o ambos.
- id: 189
  category: penalties_and_points
  question: ¿Cuál es el recargo obligatorio que se añade a las multas por infracciones
    de estacionamiento en centros comerciales?
  choices:
    A: $15
    B: $20
    C: $30
    D: $50
  answer: C
  explanation: Según el manual, se añadirá un recargo obligatorio de $30 a cada multa
    por una infracción de estacionamiento en un centro comercial.
- id: 190
  category: defensive_driving
  question: ¿Cuál es la posición del asiento y la colocación de las manos recomendadas
    al conducir?
  choices:
    A: Encorvado con una mano en la parte inferior del volante.
    B: Sentado en una posición cómoda pero vertical con ambas manos en el volante.
    C: Inclinado hacia atrás con una mano en el volante y otra en la ventana.
    D: Sentado lo más cerca posible del volante con las manos en la parte superior.
  answer: B
  explanation: Debe sentarse en una posición cómoda pero vertical y mantener ambas
    manos en el volante. Encorvarse o usar solo una mano hace que sea peligroso controlar
    su vehículo.
- id: 191
  category: defensive_driving
  question: Al acercarse a una intersección donde otro conductor tiene una señal de
    PARE (STOP) o CEDA EL PASO (YIELD), ¿qué debe suponer?
  choices:
    A: El otro conductor siempre se detendrá o cederá el paso.
    B: El otro conductor le hará señas para que pase por la intersección.
    C: Es mejor suponer que el otro conductor no se detendrá.
    D: El otro conductor tiene el derecho de paso.
  answer: C
  explanation: 'El manual aconseja anticipar los errores de otros conductores y establece:
    ''Es mejor suponer que el otro conductor no se detendrá'', incluso si se acercan
    a una señal de PARE (STOP) o CEDA EL PASO (YIELD).'
- id: 192
  category: driver_responsibility
  question: ¿Cuál de las siguientes se considera una distracción peligrosa al conducir
    según el manual?
  choices:
    A: Revisar sus espejos cada pocos segundos.
    B: Escanear el camino por delante.
    C: Entablar conversaciones estresantes o emocionales con los pasajeros.
    D: Mantener ambas manos en el volante.
  answer: C
  explanation: El manual enumera evitar discusiones y conversaciones estresantes o
    emocionales con los pasajeros como un paso necesario para prevenir la conducción
    distraída.
- id: 193
  category: safe_driving_rules
  question: ¿Cuál es la diferencia principal entre la conducción agresiva y la furia
    al volante (road rage)?
  choices:
    A: La conducción agresiva implica violar una ley penal, mientras que la furia
      al volante implica violar una ley de seguridad vial.
    B: La conducción agresiva generalmente implica la violación de una ley de seguridad
      vial, mientras que la furia al volante implica la violación de una ley penal.
    C: La conducción agresiva solo ocurre en autopistas, mientras que la furia al
      volante ocurre en las calles de la ciudad.
    D: No hay diferencia; los términos significan exactamente lo mismo.
  answer: B
  explanation: Según el manual, la conducción agresiva generalmente implica la violación
    de una ley de seguridad vial, mientras que la furia al volante (road rage) implica
    la violación de una ley penal.
- id: 194
  category: defensive_driving
  question: Si un conductor agresivo lo confronta en la carretera, ¿cuál es la mejor
    forma de actuar?
  choices:
    A: Hacer contacto visual para demostrar que no está intimidado.
    B: Desafiarlo aumentando su velocidad.
    C: No hacer contacto visual e intentar alejarse de manera segura.
    D: Devolver sus gestos y gritos para defenderse.
  answer: C
  explanation: Cuando un conductor agresivo lo confronte, no debe hacer contacto visual,
    debe mantener la calma e intentar alejarse de manera segura.
- id: 195
  category: defensive_driving
  question: ¿Qué debe hacer si un conductor agresivo lo está siguiendo?
  choices:
    A: Detener su vehículo y bajarse para confrontarlo.
    B: Conducir hasta la estación de policía más cercana.
    C: Detenerse en el arcén y esperar a que pase.
    D: Conducir a su casa y cerrar las puertas con llave.
  answer: B
  explanation: 'Si un conductor agresivo lo está siguiendo, el manual establece explícitamente:
    ''no se detenga ni se baje de su vehículo. Conduzca hasta la estación de policía
    más cercana''.'
- id: 196
  category: defensive_driving
  question: ¿Cómo debe ver el derecho de paso un conductor defensivo?
  choices:
    A: Como un derecho absoluto que nunca debe cederse.
    B: Como una regla que solo se aplica a los peatones.
    C: Como algo que se debe estar preparado para ceder a otros usuarios de la vía
      para evitar un choque.
    D: Como una garantía de que otros conductores se detendrán por usted.
  answer: C
  explanation: Si usted tiene el derecho de paso, no lo considere como un derecho
    absoluto. Esté preparado para ceder el derecho de paso a otros usuarios de la
    vía para evitar un choque.
- id: 197
  category: safe_driving_rules
  question: Si no hay un límite de velocidad publicado en una autopista en Nueva York,
    ¿cuál es la velocidad máxima a la que puede conducir legalmente?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: Debe obedecer el límite de velocidad. Si no hay un límite publicado,
    no conduzca a más de 55 mph (88 km/h).
- id: 198
  category: safe_driving_rules
  question: A menos que se publique otro límite, ¿cuál es el límite de velocidad predeterminado
    en la ciudad de Nueva York?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: El manual señala que algunas ciudades tienen límites de velocidad no
    publicados inferiores a 55 mph, indicando específicamente que el límite de velocidad
    es de 25 mph en la ciudad de Nueva York, a menos que se publique otro límite.
- id: 199
  category: penalties_and_points
  question: ¿Puede recibir una multa por exceso de velocidad si conduce por debajo
    del límite de velocidad publicado?
  choices:
    A: No, mientras esté por debajo del límite publicado, no puede ser multado.
    B: Sí, si su velocidad 'no es razonable' para condiciones climáticas o de la carretera
      peligrosas.
    C: Sí, pero solo si conduce en una zona escolar.
    D: No, la policía solo emite multas por exceder el límite publicado.
  answer: B
  explanation: Incluso si conduce por debajo del límite en una carretera peligrosa,
    un oficial de policía podría multarlo por una velocidad 'no razonable' para las
    condiciones.
- id: 200
  category: safe_driving_rules
  question: ¿Por qué algunas autopistas tienen límites de velocidad mínimos?
  choices:
    A: Para aumentar la cantidad de ingresos recaudados por peajes.
    B: Para mantener un flujo de tráfico fluido y prevenir condiciones peligrosas
      causadas por conductores lentos.
    C: Para alentar a los conductores a usar caminos locales en su lugar.
    D: Para asegurar que los conductores lleguen más rápido a sus destinos.
  answer: B
  explanation: Para mantener un flujo de tráfico fluido, algunas autopistas tienen
    límites de velocidad mínimos. Conducir más lento que el mínimo puede interferir
    con el flujo del tráfico y crear una condición peligrosa.
- id: 201
  category: defensive_driving
  question: ¿Según el manual, qué proporción de choques involucran colisiones por
    alcance (traseras), normalmente porque una persona sigue a otro vehículo demasiado
    de cerca?
  choices:
    A: 1 de cada 10 choques
    B: 2 de cada 10 choques
    C: 4 de cada 10 choques
    D: 6 de cada 10 choques
  answer: C
  explanation: Cuatro de cada 10 choques involucran colisiones por alcance, normalmente
    porque una persona sigue a otro vehículo demasiado de cerca (tailgating).
- id: 202
  category: penalties_and_points
  question: ¿Cuál de las siguientes puede ser una sanción por comportamientos asociados
    con la furia al volante (road rage)?
  choices:
    A: Multas, encarcelamiento y libertad condicional ordenada por el tribunal.
    B: Una actualización obligatoria a una licencia de conducir comercial.
    C: Un requisito de volver a tomar solo el examen escrito del permiso.
    D: Una carta de advertencia sin más acciones legales.
  answer: A
  explanation: Poner en peligro, amenazar o agredir a otra persona es ilegal. Estos
    comportamientos pueden resultar en sanciones severas que incluyen multas, encarcelamiento,
    libertad condicional ordenada por el tribunal y la revocación o suspensión de
    la licencia.
- id: 203
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima restringida para los vehículos dentro de
    una glorieta (roundabout)?
  choices:
    A: 15 mph
    B: 20 mph
    C: 30 mph
    D: 45 mph
  answer: C
  explanation: Las glorietas están diseñadas para que la velocidad de todos los vehículos
    se restrinja a 30 mph (50 km/h) o menos dentro de la glorieta.
- id: 204
  category: sharing_the_road
  question: ¿Cómo debe interactuar un conductor con un ciclista que circula en una
    glorieta?
  choices:
    A: Tocar la bocina para advertirles que se aparten
    B: Rebasarlos rápidamente por la izquierda
    C: No rebasar a la bicicleta en la glorieta
    D: Obligarlos a usar el cruce peatonal
  answer: C
  explanation: 'A los ciclistas se les permite circular dentro de la glorieta en el
    carril al igual que a otros vehículos. El manual establece: ''Por favor, no rebase
    a una bicicleta en la glorieta''.'
- id: 205
  category: safe_driving_rules
  question: ¿Qué señal debe usar al acercarse a su salida en una glorieta?
  choices:
    A: Señal de giro a la izquierda
    B: Señal de giro a la derecha
    C: Luces de emergencia
    D: No se requiere ninguna señal
  answer: B
  explanation: Al acercarse a su salida en una glorieta, debe encender su señal de
    giro a la derecha.
- id: 206
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una regla para los peatones que transitan por
    una glorieta?
  choices:
    A: Cruzar directamente hacia la isla central
    B: Caminar por la calzada circular
    C: Cruzar solo por los pasos de peatones designados
    D: Ceder el paso a los vehículos
  answer: C
  explanation: Los peatones deben cruzar solo por los pasos de peatones designados
    y nunca cruzar hacia la isla central. También tienen el derecho de paso sobre
    los vehículos.
- id: 207
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de conducir con somnolencia?
  choices:
    A: Hiperconcentración en la carretera
    B: Recordar las últimas millas con gran detalle
    C: Desviarse entre carriles o pisar las bandas sonoras (rumble strips)
    D: Reaccionar a los peligros más rápido de lo habitual
  answer: C
  explanation: Los síntomas de fatiga incluyen desviarse entre carriles, seguir muy
    de cerca al vehículo de adelante (tailgating), no ver las señales de tráfico o
    salirse de la carretera y pisar las bandas sonoras (rumble strips).
- id: 208
  category: alcohol_drugs_health
  question: Para prevenir la conducción con somnolencia en viajes largos, ¿con qué
    frecuencia debe programar paradas regulares?
  choices:
    A: Cada 50 millas o una hora
    B: Cada 100 millas o dos horas
    C: Cada 200 millas o cuatro horas
    D: Solo cuando necesite cargar combustible
  answer: B
  explanation: Antes de emprender un viaje, debe programar paradas regulares cada
    100 millas o dos horas para prevenir la fatiga.
- id: 209
  category: alcohol_drugs_health
  question: Si sospecha que tiene sueño mientras conduce, ¿cuánto tiempo debe dormir
    una siesta después de detenerse en un área segura?
  choices:
    A: De 5 a 10 minutos
    B: De 15 a 45 minutos
    C: De 1 a 2 horas
    D: Al menos 4 horas
  answer: B
  explanation: Si tiene sueño, debe detenerse en un área segura lejos del tráfico
    y tomar una breve siesta de 15 a 45 minutos.
- id: 210
  category: alcohol_drugs_health
  question: ¿Aproximadamente cuánto tiempo tarda la cafeína en entrar al torrente
    sanguíneo y promover el estado de alerta a corto plazo?
  choices:
    A: 5 minutos
    B: 15 minutos
    C: 30 minutos
    D: 60 minutos
  answer: C
  explanation: La cafeína tarda unos 30 minutos en entrar al torrente sanguíneo para
    promover el estado de alerta a corto plazo.
- id: 211
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción por hablar por un teléfono
    móvil de mano mientras se conduce en el estado de Nueva York?
  choices:
    A: Una multa de hasta $100 y 2 puntos en la licencia
    B: Una multa de hasta $200 y 5 puntos en la licencia
    C: Una multa de hasta $250 y 3 puntos en la licencia
    D: Una multa de hasta $450 y suspensión de la licencia
  answer: B
  explanation: Por una primera infracción por el uso de un teléfono móvil de mano
    mientras conduce, se le podría exigir el pago de una multa de hasta $200 y recibir
    cinco puntos en la licencia.
- id: 212
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una tercera infracción o subsiguiente por
    enviar mensajes de texto mientras se conduce cometida dentro de un periodo de
    18 meses?
  choices:
    A: $200
    B: $250
    C: $450
    D: $500
  answer: C
  explanation: Una tercera infracción o subsiguiente por enviar mensajes de texto
    mientras se conduce (todas cometidas dentro de un periodo de 18 meses) conlleva
    una multa de hasta $450.
- id: 213
  category: penalties_and_points
  question: ¿Qué le sucede a un conductor con una licencia de prueba (probationary)
    o de menor de edad (junior) que es condenado por enviar mensajes de texto mientras
    conduce por primera vez?
  choices:
    A: Recibe una carta de advertencia
    B: Recibe una suspensión de 60 días
    C: Recibe una suspensión de 120 días
    D: Su licencia es revocada por un año
  answer: C
  explanation: Los conductores con licencias de prueba y licencias junior que utilicen
    un teléfono de mano o envíen mensajes de texto mientras conducen recibirán una
    suspensión de 120 días por una primera condena.
- id: 214
  category: vehicle_information
  question: ¿Con qué frecuencia debe inspeccionarse un vehículo para ser operado o
    estacionado legalmente en las vías públicas de Nueva York?
  choices:
    A: Al menos una vez cada 6 meses
    B: Al menos una vez al año
    C: Al menos una vez cada dos años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Ninguna persona podrá operar o estacionar un vehículo en las vías públicas
    a menos que haya sido inspeccionado al menos una vez al año.
- id: 215
  category: vehicle_information
  question: ¿Qué debe hacer si sus frenos tiran hacia un lado porque están mojados?
  choices:
    A: Bombear los frenos rápidamente durante un minuto
    B: Secarlos presionando el pedal ligeramente
    C: Cambiar a una marcha más baja y evitar frenar
    D: Detenerse a un lado y esperar a que se sequen al aire
  answer: B
  explanation: Los frenos que tiran hacia un lado pueden estar mojados. Si están mojados,
    puede secarlos presionando el pedal ligeramente.
- id: 216
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    requerida por la ley?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: La ley exige que sus neumáticos tengan al menos 2/32 de pulgada (.16
    cm) de banda de rodadura.
- id: 217
  category: vehicle_information
  question: Al verificar la profundidad de la banda de rodadura de sus neumáticos
    con una moneda de un centavo, ¿qué indica que sus neumáticos están demasiado desgastados
    y necesitan ser reemplazados?
  choices:
    A: Puede ver toda la cabeza de Abraham Lincoln
    B: La cabeza de Lincoln está completamente oculta
    C: Solo puede ver el cabello de Lincoln
    D: La moneda se cae de la ranura
  answer: A
  explanation: Coloque la cabeza de Lincoln primero en la ranura que parezca más profunda.
    Si puede ver toda su cabeza, sus neumáticos están demasiado desgastados y no debe
    conducir con ellos.
- id: 218
  category: vehicle_information
  question: ¿Cómo puede verificar si la profundidad de la banda de rodadura de su
    neumático está demasiado desgastada usando una moneda de un centavo?
  choices:
    A: Si puede ver toda la cabeza de Abraham Lincoln cuando se coloca con la cabeza
      primero en la ranura más profunda
    B: Si la cabeza de Lincoln está completamente cubierta por la banda de rodadura
      del neumático
    C: Si la moneda se cae al colocarla en la ranura
    D: Si la moneda queda al ras con la pared exterior del neumático
  answer: A
  explanation: Según el manual, si coloca la cabeza de Lincoln primero en la ranura
    que parezca más profunda y puede ver toda su cabeza, sus neumáticos están demasiado
    desgastados y no se debe conducir con ellos.
- id: 219
  category: safe_driving_rules
  question: ¿Cuándo es apropiado usar la bocina de su vehículo?
  choices:
    A: Para expresar enojo hacia otros conductores o peatones
    B: Para advertir a otros conductores o peatones sobre posibles problemas
    C: Para saludar a amigos que caminan por la acera
    D: Para animar al conductor que está delante de usted a conducir más rápido
  answer: B
  explanation: El manual establece que la bocina es un equipo de seguridad importante
    que podría convertirse en su único medio para advertir a otros conductores o peatones
    sobre posibles problemas, y no debe usarse para expresar enojo.
- id: 220
  category: alcohol_drugs_health
  question: En el estado de Nueva York, ¿aproximadamente qué porcentaje de todas las
    muertes por vehículos motorizados involucran la conducción bajo los efectos del
    alcohol o drogas (impaired driving)?
  choices:
    A: 10 por ciento
    B: 25 por ciento
    C: Más del 40 por ciento
    D: 60 por ciento
  answer: C
  explanation: El manual establece que en el estado de Nueva York, más del 40 por
    ciento de todas las muertes por vehículos motorizados involucran la conducción
    bajo los efectos del alcohol o drogas.
- id: 221
  category: alcohol_drugs_health
  question: ¿Por qué las sanciones de revocación de la licencia de conducir son más
    severas para los conductores jóvenes que conducen bajo la influencia?
  choices:
    A: Generalmente conducen más rápido que los conductores mayores
    B: Representan el 7 por ciento de los conductores con facultades alteradas en
      choques fatales, a pesar de ser solo el 4 por ciento de la población de conductores
    C: Tienen más probabilidades de conducir sin seguro
    D: Consumen más alcohol en promedio que los conductores mayores
  answer: B
  explanation: Los conductores menores de 21 años representan aproximadamente el 4
    por ciento de la población de conductores, pero el 7 por ciento de los conductores
    con facultades alteradas involucrados en choques fatales. Esta es una de las razones
    por las que las sanciones de revocación son más severas para los conductores jóvenes.
- id: 222
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol su visión por la noche?
  choices:
    A: Mejora su capacidad para ver en la oscuridad
    B: Reduce su capacidad para recuperarse del resplandor de los faros delanteros
    C: Hace que los faros delanteros parezcan más tenues
    D: Aumenta su visión periférica
  answer: B
  explanation: El manual señala que el alcohol reduce su capacidad para recuperarse
    del resplandor de los faros delanteros, lo que hace que sea especialmente peligroso
    beber y conducir después del anochecer.
- id: 223
  category: alcohol_drugs_health
  question: ¿Cuándo comienzan los efectos del consumo de alcohol en sus habilidades
    de conducción?
  choices:
    A: Solo después de que su BAC alcance el .08 por ciento
    B: Cuando comienza a sentirse intoxicado
    C: Con la primera bebida
    D: Después de haber consumido tres bebidas en una hora
  answer: C
  explanation: El manual establece que los efectos del consumo de alcohol pueden comenzar
    mucho antes de que usted se intoxique o incluso antes de que sus facultades se
    vean legalmente alteradas, y comienzan con la primera bebida.
- id: 224
  category: alcohol_drugs_health
  question: ¿Qué nivel de contenido de alcohol en sangre (BAC) se considera evidencia
    legal de intoxicación en el estado de Nueva York?
  choices:
    A: .02 por ciento o más
    B: .05 por ciento o más
    C: .08 por ciento o más
    D: .18 por ciento o más
  answer: C
  explanation: Un BAC de .08 por ciento o más es evidencia de intoxicación. Un BAC
    de más de .05 por ciento es evidencia de facultades alteradas, y .18 por ciento
    o más es un DWI agravado.
- id: 225
  category: alcohol_drugs_health
  question: ¿Un contenido de alcohol en sangre (BAC) de más del .05 por ciento es
    evidencia legal de qué infracción?
  choices:
    A: Conducir en estado de ebriedad agravado (DWI agravado)
    B: Conducir con facultades alteradas (DWAI)
    C: Conducir en estado de ebriedad (DWI)
    D: Negativa a la prueba química
  answer: B
  explanation: Según el manual, un BAC de más del .05 por ciento es evidencia legal
    de que sus facultades están alteradas.
- id: 226
  category: penalties_and_points
  question: ¿Puede ser condenado por una infracción de conducción relacionada con
    el alcohol o las drogas sin una prueba química?
  choices:
    A: No, la ley siempre exige una prueba química para demostrar la alteración de
      las facultades
    B: Sí, pero solo si confiesa la infracción por escrito
    C: Sí, el testimonio de un oficial de policía sobre su conducción y comportamiento
      puede proporcionar suficiente evidencia
    D: No, a menos que haya evidencia en video de usted consumiendo alcohol
  answer: C
  explanation: El manual establece que el testimonio de un oficial de policía sobre
    la forma en que conduce, su apariencia y comportamiento puede proporcionar suficiente
    evidencia para condenarlo, incluso sin una prueba química.
- id: 227
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes factores NO determina su contenido de alcohol
    en sangre (BAC)?
  choices:
    A: Cuánto alcohol bebe
    B: Su peso corporal
    C: Cuánto tiempo pasa entre bebidas
    D: El tipo de bebida alcohólica que consume
  answer: D
  explanation: Su BAC depende de cuánto beba, el tiempo entre bebidas y su peso. No
    depende del tipo de bebida que consuma, de su estado físico o de qué tan bien
    pueda "aguantar el licor".
- id: 228
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes bebidas contiene la mayor cantidad de alcohol?
  choices:
    A: 1 1/2 onzas de licor de 80 grados (80-proof)
    B: 5 onzas de vino (12% de alcohol)
    C: 12 onzas de cerveza (5% de alcohol)
    D: Todas contienen aproximadamente la misma cantidad de alcohol
  answer: D
  explanation: El manual establece que 1-1/2 onzas de licor, 5 onzas de vino, 12 onzas
    de cerveza y 12 onzas de refresco de vino (wine cooler) contienen aproximadamente
    la misma cantidad de alcohol. Ninguna es "más segura de beber" que las otras.
- id: 229
  category: alcohol_drugs_health
  question: ¿Cuál es el único método eficaz para reducir su contenido de alcohol en
    sangre (BAC)?
  choices:
    A: Beber café solo (negro)
    B: Tomar una ducha fría
    C: No beber durante un período de tiempo
    D: Ejercicio vigoroso
  answer: C
  explanation: El manual establece explícitamente que el único método para reducir
    eficazmente su BAC es no beber durante un período de tiempo. El café, el ejercicio
    y las duchas frías no pueden reducir su BAC.
- id: 230
  category: license_system
  question: ¿Qué significa la ley de "Consentimiento Implícito" de Nueva York?
  choices:
    A: Usted consiente el registro del vehículo si es detenido por las autoridades
    B: Usted consiente en someterse a una prueba química de BAC cuando conduce en
      el estado
    C: Usted consiente en pagar todas las multas de tráfico inmediatamente al recibir
      una infracción
    D: Usted consiente en que se le suspenda la licencia si recibe una multa por exceso
      de velocidad
  answer: B
  explanation: Según la ley de "Consentimiento Implícito" de Nueva York, cuando conduce
    un automóvil en el estado se considera que ha dado su consentimiento para someterse
    a una prueba química para medir su BAC.
- id: 231
  category: penalties_and_points
  question: ¿Qué sucede con su licencia de conducir si se le declara culpable de una
    infracción relacionada con el alcohol o las drogas?
  choices:
    A: Recibe una advertencia por la primera infracción
    B: Debe volver a tomar el examen de conducir en un plazo de 30 días
    C: El tribunal debe revocar o suspender su licencia al momento de dictar la sentencia
    D: Su licencia se restringe únicamente a la conducción diurna
  answer: C
  explanation: Si se le declara culpable de cualquier infracción relacionada con el
    alcohol o las drogas, el tribunal debe revocar o suspender su licencia de conducir
    al momento de dictar la sentencia.
- id: 232
  category: alcohol_drugs_health
  question: En promedio, ¿cuánto tiempo le toma al cuerpo de un hombre de 150 libras
    eliminar el alcohol de una bebida estándar?
  choices:
    A: 30 minutos
    B: Aproximadamente una hora
    C: Two horas
    D: Cuatro horas
  answer: B
  explanation: Para un hombre de 150 libras, cada bebida estándar aumenta su BAC (contenido
    de alcohol en sangre) en aproximadamente un .02 por ciento. En promedio, el cuerpo
    tarda aproximadamente una hora en eliminar esa cantidad de alcohol.
- id: 233
  category: alcohol_drugs_health
  question: Según la ley de "Consentimiento Implícito" de Nueva York, ¿a qué da su
    consentimiento al conducir un automóvil en el estado?
  choices:
    A: Permitir que la policía registre su vehículo sin una orden judicial
    B: Someterse a una prueba química para medir su contenido de alcohol en sangre
      (BAC)
    C: Pagar todas las multas de tráfico en un plazo de 30 días
    D: Que su vehículo sea confiscado si es arrestado
  answer: B
  explanation: Según la ley de "Consentimiento Implícito" de Nueva York, cuando usted
    conduce un automóvil en el estado, se considera que ha dado su consentimiento
    para someterse a una prueba química para medir su BAC.
- id: 234
  category: penalties_and_points
  question: ¿Qué sucede con su licencia de conducir si se niega a someterse a una
    prueba química después de ser arrestado por una infracción relacionada con el
    alcohol o las drogas?
  choices:
    A: Se suspende cuando es comparecido ante el tribunal.
    B: Se revoca permanentemente de inmediato.
    C: Recibe una advertencia pero conserva su licencia hasta el juicio.
    D: Se restringe únicamente a conducir hacia y desde el trabajo.
  answer: A
  explanation: Si se niega a realizar la prueba después de ser arrestado, su licencia
    de conducir será suspendida cuando sea comparecido ante el tribunal por el cargo
    relacionado con el alcohol u otras drogas.
- id: 235
  category: penalties_and_points
  question: ¿Cuántas condenas por conducir bajo los efectos del alcohol o las drogas
    a lo largo de su vida debe tener un conductor para que el DMV deniegue permanentemente
    cualquier solicitud de restitución de la licencia?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: C
  explanation: El DMV denegará permanentemente la restitución si el solicitante tiene
    cuatro condenas o incidentes por conducir bajo los efectos del alcohol o las drogas
    a lo largo de su vida.
- id: 236
  category: penalties_and_points
  question: ¿Cuál de los siguientes se considera una "infracción de conducción grave"
    según las regulaciones para infractores reincidentes de Nueva York?
  choices:
    A: Acumular 10 puntos por infracciones de conducción en un período de 10 años
    B: Un accidente fatal
    C: Una multa de estacionamiento en una zona escolar
    D: No ceder el paso en una señal de alto
  answer: B
  explanation: Una infracción de conducción grave incluye un accidente fatal, una
    condena por ley penal relacionada con la conducción, una acumulación de 20 o más
    puntos en 25 años, o dos condenas de 5 o más puntos en 25 años.
- id: 237
  category: alcohol_drugs_health
  question: Según la ley de "tolerancia cero" de Nueva York, ¿en qué rango de BAC
    medible es una infracción que una persona menor de 21 años conduzca?
  choices:
    A: .01 a .05
    B: .02 a .07
    C: .05 a .08
    D: .08 y superior
  answer: B
  explanation: Según la ley de "tolerancia cero" del estado, es una infracción que
    una persona menor de 21 años conduzca con cualquier BAC que pueda medirse (.02
    a .07).
- id: 238
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de Tolerancia Cero para
    un conductor menor de 21 años?
  choices:
    A: Una suspensión de la licencia por 30 días y una multa de $50
    B: Una suspensión de la licencia por 6 meses, una tarifa de terminación de $100
      y una multa civil de $125
    C: Una revocación de la licencia por 1 año y una multa de $500
    D: Encarcelamiento obligatorio por 5 días
  answer: B
  explanation: Tras la determinación de una primera infracción de Tolerancia Cero,
    la licencia de conducir se suspenderá por seis meses y el conductor deberá pagar
    una tarifa de terminación de la suspensión de $100 y una multa civil de $125.
- id: 239
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera condena por poseer un recipiente
    abierto de una bebida alcohólica en un vehículo motorizado en una vía pública?
  choices:
    A: $50
    B: $100
    C: $150
    D: $250
  answer: C
  explanation: La sanción por una primera condena de la Ley de Recipiente Abierto
    es una multa de hasta $150, un recargo obligatorio, una tarifa de asistencia a
    las víctimas de delitos y un posible encarcelamiento de 15 días.
- id: 240
  category: safe_driving_rules
  question: ¿Quién está exento de la Ley de Recipiente Abierto con respecto a las
    bebidas alcohólicas?
  choices:
    A: Conductores de camiones comerciales
    B: Pasajeros en vehículos como limusinas que exhiban un certificado de comercio
      válido
    C: Pasajeros en el asiento trasero de cualquier vehículo de pasajeros estándar
    D: Conductores que tengan más de 25 años
  answer: B
  explanation: La ley de Recipiente Abierto exime a los pasajeros en vehículos como
    limusinas y otros vehículos que exhiban un certificado o permiso de comercio emitido
    por el Departamento de Transporte de los EE. UU. o del Estado de Nueva York (NYS).
- id: 241
  category: penalties_and_points
  question: ¿Cuál es la consecuencia de usar una licencia de conducir para comprar
    ilegalmente bebidas que contienen alcohol?
  choices:
    A: Una multa de $500
    B: Suspensión de su licencia de conducir o del privilegio de solicitar una licencia
    C: Servicio comunitario obligatorio
    D: Revocación permanente de su licencia de conducir
  answer: B
  explanation: La ley estatal exige la suspensión de su licencia de conducir o del
    privilegio de solicitar una licencia si la utiliza como prueba de edad para comprar
    ilegalmente bebidas que contienen alcohol.
- id: 242
  category: alcohol_drugs_health
  question: 'Conducir en Estado de Ebriedad Agravado (AGG-DWI) se aplica a conductores
    con un Contenido de Alcohol en Sangre (BAC) de al menos:'
  choices:
    A: '0.05'
    B: '0.08'
    C: '0.15'
    D: '0.18'
  answer: D
  explanation: Conducir en Estado de Ebriedad Agravado (AGG-DWI) se aplica a un Contenido
    de Alcohol en Sangre (BAC) de 0.18 o superior.
- id: 243
  category: penalties_and_points
  question: ¿Cuál es la pena máxima de cárcel por una primera infracción de Conducir
    en Estado de Ebriedad (DWI)?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Para una primera infracción de Conducir en Estado de Ebriedad (DWI),
    la pena máxima de cárcel es de hasta 1 año.
- id: 244
  category: penalties_and_points
  question: Si a un conductor se le aprueba el restablecimiento de la licencia después
    de un período de denegación de 5 años debido a condenas repetidas relacionadas
    con el alcohol, ¿durante cuánto tiempo debe usar un dispositivo de interbloqueo?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: D
  explanation: Las regulaciones exigen un dispositivo de interbloqueo en el vehículo
    conducido por el solicitante durante cinco años a partir de la fecha de emisión
    del documento de la licencia.
- id: 245
  category: alcohol_drugs_health
  question: 'Según la Ley de Contenedores Abiertos, es una infracción de tránsito
    que un conductor o pasajero en un vehículo motorizado en una vía pública:'
  choices:
    A: Transporte marihuana/cannabis sin abrir en el maletero
    B: Consuma marihuana/cannabis
    C: Posea medicamentos recetados en su frasco original
    D: Beba una bebida no alcohólica
  answer: B
  explanation: Es una infracción de tránsito que un conductor o pasajero en un vehículo
    motorizado en una carretera, calle o camino público consuma marihuana/cannabis.
- id: 246
  category: penalties_and_points
  question: ¿Cuál es la acción requerida sobre la licencia por una primera infracción
    de Conducir con la Capacidad Disminuida (DWAI)?
  choices:
    A: Suspensión de 30 días
    B: Suspensión de 90 días
    C: Revocación de 6 meses
    D: Revocación de 1 año
  answer: B
  explanation: Según el manual, una primera infracción por DWAI (infracción de tránsito)
    requiere una suspensión de 90 días.
- id: 247
  category: penalties_and_points
  question: ¿Cuál es la pena máxima de cárcel por una segunda infracción de DWAI dentro
    de un período de 5 años?
  choices:
    A: Hasta 15 días
    B: Hasta 30 días
    C: Hasta 90 días
    D: Hasta 180 días
  answer: B
  explanation: El manual establece que una segunda infracción de DWAI dentro de 5
    años conlleva una pena de cárcel de hasta 30 días.
- id: 248
  category: alcohol_drugs_health
  question: Según la Ley de Leandra, cometer una infracción relacionada con el alcohol
    con un niño en el vehículo es un delito grave de clase E si el niño es menor de
    ¿qué edad?
  choices:
    A: 12 años
    B: 14 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: La Ley de Leandra establece que los conductores que cometen infracciones
    relacionadas con el alcohol con un niño menor de 16 años en el vehículo pueden
    ser acusados de un delito grave de clase E.
- id: 249
  category: alcohol_drugs_health
  question: ¿Cuánto tiempo debe un conductor mantener típicamente un dispositivo de
    interbloqueo de encendido en su vehículo después de una condena por DWI?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 12 meses
    D: Al menos 24 meses
  answer: C
  explanation: Los tribunales deben ordenar a las personas condenadas por DWI o DWI
    agravado que instalen y mantengan un interbloqueo de encendido en cualquier vehículo
    que posean u operen durante al menos 12 meses.
- id: 250
  category: license_system
  question: 'Una licencia de conducir condicional será revocada si el automovilista
    es condenado por cualquier infracción de tránsito EXCEPTO:'
  choices:
    A: Exceso de velocidad
    B: No ceder el paso
    C: Estacionamiento, detención o permanencia (parking, stopping, or standing)
    D: Pasarse un semáforo en rojo
  answer: C
  explanation: El manual señala que una licencia de conducir condicional será revocada
    si el automovilista no cumple con los términos del tribunal o por una condena
    por cualquier infracción de tránsito, excepto estacionamiento, detención o permanencia.
- id: 251
  category: penalties_and_points
  question: ¿Si es arrestado por conducir bajo los efectos del alcohol o estupefacientes
    (impaired) o en estado de ebriedad (intoxicated) y su licencia ya está suspendida
    o revocada, cuál es la multa obligatoria máxima que enfrenta?
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: C
  explanation: Si se encuentra bajo los efectos del alcohol o estupefacientes o en
    estado de ebriedad al ser arrestado mientras conduce con una licencia suspendida
    o revocada, la multa obligatoria máxima es de $5,000 y el vehículo puede ser confiscado.
- id: 252
  category: penalties_and_points
  question: ¿Cuál es la pena máxima de cárcel que puede enfrentar si mata o causa
    lesiones a otra persona debido a una infracción relacionada con el alcohol o las
    drogas?
  choices:
    A: 10 años
    B: 15 años
    C: 20 años
    D: 25 años
  answer: D
  explanation: Matar o causar lesiones debido a una infracción relacionada con el
    alcohol u otras drogas puede resultar en condenas que conllevan una pena máxima
    de cárcel de 25 años.
- id: 253
  category: safe_driving_rules
  question: 'Al cruzar vías de ferrocarril, siempre debe:'
  choices:
    A: Cambiar de marcha mientras cruza las vías
    B: Mantenerse en su carril y en la misma marcha
    C: Acelerar para cruzar lo más rápido posible
    D: Detenerse en las vías para ver si viene el tren
  answer: B
  explanation: 'El manual establece explícitamente: "Al cruzar las vías, manténgase
    siempre en su carril y en la misma marcha".'
- id: 254
  category: signs_and_signals
  question: Al acercarse a un cruce a nivel activo con luces rojas intermitentes y
    barreras bajadas, ¿cuándo es legal avanzar?
  choices:
    A: Tan pronto como el tren haya pasado, incluso si las barreras están bajadas
    B: Cuando las barreras estén completamente levantadas y las luces estén apagadas
    C: Cuando las barreras comiencen a levantarse y pueda ver con claridad
    D: Si conduce un vehículo pequeño que quepa debajo de la barrera
  answer: B
  explanation: Al acercarse a cruces a nivel señalizados o activos, no avance hasta
    que las barreras estén completamente levantadas y las luces estén apagadas.
- id: 255
  category: safe_driving_rules
  question: Si las luces rojas intermitentes, las barreras de cruce bajadas o una
    campana indican que se acerca un tren, ¿a qué distancia mínima de las vías debe
    detenerse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 25 pies
  answer: C
  explanation: Las luces rojas intermitentes, las barreras de cruce bajadas y/o una
    campana en un cruce de ferrocarril indican que debe detenerse al menos a 15 pies
    (5 m) de las vías.
- id: 256
  category: signs_and_signals
  question: ¿Qué significa una señal amarilla con letras negras "RR" y un símbolo
    "X"?
  choices:
    A: Debe detenerse por completo de inmediato
    B: Hay un cruce de ferrocarril más adelante
    C: El cruce de ferrocarril está cerrado
    D: Se está acercando a una señal de aspa (crossbuck)
  answer: B
  explanation: Una señal amarilla con letras negras "RR" y un símbolo "X" es una señal
    de advertencia de cruce de ferrocarril, lo que significa que hay un cruce de ferrocarril
    más adelante y debe tener precaución y estar preparado para detenerse.
- id: 257
  category: signs_and_signals
  question: ¿Qué forma tiene una señal de aspa (crossbuck) en un cruce de ferrocarril?
  choices:
    A: Un círculo
    B: Un rombo
    C: Una "X"
    D: Un octágono
  answer: C
  explanation: Una señal de aspa (crossbuck) se describe en el manual como una señal
    con forma de "X" con las palabras "RAILROAD CROSSING" impresas en ella.
- id: 258
  category: defensive_driving
  question: 'Al juzgar la distancia y la velocidad de un tren que se acerca, debe
    recordar que:'
  choices:
    A: Los trenes suelen moverse más lento de lo que parece
    B: Los trenes están más cerca y se mueven más rápido de lo que piensa
    C: Los trenes pueden detenerse rápidamente si ven un vehículo en las vías
    D: Los trenes siempre tocarán la bocina antes de que pueda verlos
  answer: B
  explanation: 'El manual aconseja a los conductores: "Recuerde que el tren que ve
    está más cerca y se mueve más rápido de lo que piensa, y tenga en cuenta que los
    trenes no pueden detenerse rápidamente".'
- id: 259
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es una estrategia recomendada para evitar conducir
    bajo los efectos del alcohol o las drogas (impaired)?
  choices:
    A: Beber mucho café antes de conducir
    B: Alternar entre bebidas con alcohol y bebidas sin alcohol
    C: Conducir solo por carreteras locales en lugar de autopistas
    D: Mantener las ventanillas bajadas para mantenerse alerta
  answer: B
  explanation: 'Para evitar problemas, el manual recomienda: "Beba despacio. Alterne
    entre bebidas con alcohol y bebidas sin nada de alcohol".'
- id: 260
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias debe intentar cruzar las vías del ferrocarril?
  choices:
    A: Solo cuando esté seguro de que todo su vehículo pasará todas las vías
    B: Siempre que el vehículo que va delante de usted comience a cruzar
    C: Si el tren está a más de 100 pies de distancia
    D: Si el cruce no tiene luces intermitentes
  answer: A
  explanation: 'El manual advierte: "Bajo ninguna circunstancia intente cruzar ninguna
    vía de ferrocarril a menos que esté seguro de que todo su vehículo pasará todas
    las vías".'
- id: 261
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si su vehículo se apaga en las vías
    del tren?
  choices:
    A: Intentar arrancar el motor inmediatamente
    B: Hacer que todos salgan del auto y alejarse de las vías
    C: Permanecer en el vehículo y llamar al 911
    D: Empujar el vehículo fuera de las vías
  answer: B
  explanation: Si se queda detenido en las vías por cualquier motivo, el manual establece
    que debe SALIR (incluyendo a todos los ocupantes del auto) y alejarse de las vías,
    incluso si no ve un tren.
- id: 262
  category: defensive_driving
  question: Si su vehículo se apaga en las vías del tren y se aproxima un tren, ¿en
    qué dirección debe correr?
  choices:
    A: Por la vía en la misma dirección en la que se mueve el tren
    B: Directamente lejos de las vías en un ángulo de 90 grados
    C: Hacia el tren pero alejándose de las vías en un ángulo de 45 grados
    D: Paralelo a las vías en la dirección opuesta al tren
  answer: C
  explanation: Si se aproxima un tren, corra hacia el tren pero alejándose de las
    vías en un ángulo de 45 grados. Correr en la misma dirección que el tren puede
    hacer que le golpeen los escombros cuando el tren choque con su vehículo.
- id: 263
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está obligado a detenerse en todos los
    cruces de ferrocarril?
  choices:
    A: Automóviles de pasajeros con niños
    B: Motocicletas
    C: Autobuses escolares con o sin pasajeros
    D: Camiones de entrega
  answer: C
  explanation: Los autobuses escolares con o sin pasajeros, otros autobuses con pasajeros
    a bordo y los vehículos con explosivos o carga inflamable deben detenerse en todos
    los cruces de ferrocarril.
- id: 264
  category: safe_driving_rules
  question: ¿Qué debe hacer si entra en una autopista en una dirección diferente a
    la que pretendía?
  choices:
    A: Retroceder con cuidado en la rampa de entrada
    B: Cruzar la mediana cuando haya un espacio en el tráfico
    C: Detenerse en el arcén y hacer un giro en U
    D: Permanecer en la autopista hasta la siguiente salida
  answer: D
  explanation: Si entra en una autopista en una dirección diferente a la que pretendía,
    o por la salida equivocada, permanezca en la autopista hasta la siguiente salida.
    Es peligroso retroceder en una rampa de entrada o cruzar una mediana.
- id: 265
  category: safe_driving_rules
  question: Si un carril de entrada a la autopista es demasiado corto para permitir
    la aceleración a la velocidad de la autopista, ¿cuál es el método más seguro para
    entrar?
  choices:
    A: Forzar su entrada en el carril derecho
    B: Detenerse y esperar un espacio grande en el tráfico, luego acelerar rápidamente
    C: Conducir por el arcén hasta alcanzar la velocidad de la autopista
    D: Tocar la bocina para que otros conductores le cedan el paso
  answer: B
  explanation: Si el carril de entrada es demasiado corto para permitir la aceleración
    a la velocidad de la autopista, el método más seguro para entrar es detenerse
    y esperar un espacio grande en el tráfico, luego entrar en la autopista y acelerar
    rápidamente.
- id: 266
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe señalizar su salida antes de llegar a la rampa
    de salida de la autopista?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: Asegúrese de señalizar su salida al menos 100 pies (30 m) antes de
    llegar a la rampa de salida.
- id: 267
  category: defensive_driving
  question: ¿Qué significa "conducir dentro del alcance" de sus faros delanteros?
  choices:
    A: Conducir a una velocidad que le permita detenerse de manera segura dentro de
      la distancia que cubren sus faros
    B: Mantener sus faros apuntando a la superficie de la carretera
    C: Usar las luces altas siempre que conduzca a más de 40 mph
    D: Mantenerse a menos de 350 pies del vehículo que tiene delante
  answer: A
  explanation: Sus faros delanteros cubren unos 350 pies por delante. Es importante
    que conduzca a una velocidad que le permita detenerse de manera segura dentro
    de esa distancia. Esto se llama "conducir dentro del alcance" de sus faros.
- id: 268
  category: safe_driving_rules
  question: Por ley, ¿en qué horarios debe usar sus faros delanteros?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde media hora después de la puesta del sol hasta media hora antes de la
      salida del sol
    C: Solo cuando no haya alumbrado público
    D: Desde una hora después del atardecer hasta una hora antes del amanecer
  answer: B
  explanation: La ley exige que use los faros delanteros desde media hora después
    de que se pone el sol hasta media hora antes de que salga el sol, cuando la visibilidad
    es inferior a 1,000 pies y cuando usa los limpiaparabrisas.
- id: 269
  category: safe_driving_rules
  question: ¿A qué distancia de un vehículo que viene en sentido contrario debe cambiar
    sus faros a luz de cruce (baja)?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Sus faros deben estar en luz de cruce (baja) cuando se encuentre a
    menos de 500 pies (150 m) de un vehículo que se aproxima.
- id: 270
  category: defensive_driving
  question: ¿Qué debe hacer para ayudar a evitar el deslumbramiento de las luces altas
    de un vehículo que se aproxima?
  choices:
    A: Parpadear sus luces altas continuamente
    B: Cerrar un ojo hasta que el vehículo pase
    C: Mover los ojos hacia la derecha y usar el borde de la carretera como guía
    D: Encender la luz interior del techo
  answer: C
  explanation: Para ayudar a evitar el deslumbramiento de las luces altas que se aproximan,
    mueva los ojos hacia la derecha. Use el borde de la carretera como guía hasta
    que el vehículo que se aproxima pase.
- id: 271
  category: vehicle_information
  question: ¿Qué es el 'hidroplaneo' (hydroplaning)?
  choices:
    A: Cuando los frenos de su vehículo se congelan en clima húmedo
    B: Cuando sus neumáticos comienzan a deslizarse sobre el agua que está encima
      del pavimento de la carretera
    C: Cuando la niebla se mezcla con la lluvia para crear visibilidad nula
    D: Cuando sus limpiaparabrisas no pueden seguir el ritmo de la lluvia intensa
  answer: B
  explanation: En condiciones de lluvia intensa, sus neumáticos pueden comenzar a
    deslizarse sobre el agua que está encima del pavimento de la carretera. Esto se
    llama 'hidroplaneo' (hydroplaning) y puede causar la pérdida total de tracción
    y del control de la dirección.
- id: 272
  category: safe_driving_rules
  question: ¿Qué luces delanteras debe usar para tener una mejor visibilidad durante
    la lluvia, la niebla o la nieve?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Luces de circulación diurna
    D: Luces de estacionamiento
  answer: B
  explanation: Las luces delanteras en posición de luces altas reflejan la lluvia,
    la niebla y la nieve al caer, lo que dificulta la visión. Para una mejor visibilidad
    durante estas condiciones climáticas, mantenga sus luces delanteras en posición
    de luces bajas.
- id: 273
  category: safe_driving_rules
  question: 'La ley del estado de Nueva York exige que encienda las luces delanteras
    cuando las condiciones climáticas requieran el uso de:'
  choices:
    A: Limpiaparabrisas
    B: El desempañador
    C: Luces antiniebla
    D: Luces de emergencia
  answer: A
  explanation: La ley del estado de Nueva York exige que encienda las luces delanteras
    cuando las condiciones climáticas requieran el uso de limpiaparabrisas para limpiar
    la lluvia, la nieve, el aguanieve o la niebla.
- id: 274
  category: vehicle_information
  question: Al preparar su vehículo para la conducción en invierno, ¿qué combinación
    de neumáticos nunca debe usar?
  choices:
    A: Neumáticos para nieve y neumáticos para todas las estaciones
    B: Neumáticos radiales y no radiales
    C: Neumáticos con clavos y sin clavos
    D: Neumáticos anchos y estrechos
  answer: B
  explanation: Antes de que llegue el clima invernal, asegúrese de que su vehículo
    esté en buenas condiciones. Nunca combine neumáticos radiales y no radiales en
    el vehículo.
- id: 275
  category: vehicle_information
  question: ¿Cuándo se permite legalmente el uso de neumáticos con clavos metálicos
    en el estado de Nueva York?
  choices:
    A: Del 1 de noviembre al 1 de abril
    B: Del 16 de octubre al 30 de abril
    C: Del 1 de septiembre al 31 de mayo
    D: Son ilegales durante todo el año
  answer: B
  explanation: Según el manual, los neumáticos con clavos metálicos pueden usarse
    en el estado de Nueva York únicamente desde el 16 de octubre hasta el 30 de abril.
- id: 276
  category: vehicle_information
  question: ¿Cuál de las siguientes es una regla con respecto al uso de neumáticos
    en su vehículo?
  choices:
    A: Debe combinar neumáticos radiales y no radiales para una mejor tracción en
      invierno.
    B: Nunca combine neumáticos radiales y no radiales en el mismo vehículo.
    C: Los neumáticos para nieve solo deben colocarse en las ruedas delanteras.
    D: Se deben usar clavos metálicos en todos los neumáticos durante el invierno.
  answer: B
  explanation: 'El manual establece explícitamente: "Nunca combine neumáticos radiales
    y no radiales en el mismo vehículo".'
- id: 277
  category: defensive_driving
  question: ¿Qué debe hacer si las ruedas traseras de su vehículo comienzan a derrapar
    hacia la izquierda?
  choices:
    A: Gire el volante hacia la derecha.
    B: Gire el volante hacia la izquierda.
    C: Mantenga el volante perfectamente recto.
    D: Frene fuerte inmediatamente.
  answer: B
  explanation: Para recuperarse de un derrape de las ruedas traseras, debe girar el
    volante en la dirección en la que el vehículo intenta ir. Si sus ruedas traseras
    se deslizan hacia la izquierda, gire hacia la izquierda.
- id: 278
  category: defensive_driving
  question: ¿Cuál es el primer paso que debe dar si sus ruedas delanteras comienzan
    a derrapar?
  choices:
    A: Gire el volante bruscamente en la dirección del derrape.
    B: Bombee los frenos rápidamente.
    C: Quite el pie del acelerador y ponga el vehículo en punto muerto (neutral).
    D: Acelere para recuperar la tracción.
  answer: C
  explanation: Si sus ruedas delanteras derrapan, el manual aconseja quitar el pie
    del acelerador y poner el vehículo en punto muerto (neutral) o presionar el embrague,
    pero no intente girar el volante de inmediato.
- id: 279
  category: safe_driving_rules
  question: ¿Qué áreas de la carretera es probable que se congelen primero cuando
    comienza a caer aguanieve o lluvia helada?
  choices:
    A: Intersecciones y cruces peatonales
    B: Túneles y pasos inferiores
    C: Puentes, rampas y pasos elevados
    D: Autopistas de varios carriles con mucho tráfico
  answer: C
  explanation: Cuando comienza a caer aguanieve, lluvia helada o nieve, recuerde que
    los puentes, las rampas y los pasos elevados se congelarán primero.
- id: 280
  category: defensive_driving
  question: ¿En qué momento del día es mayor la actividad de los ciervos, lo que aumenta
    el riesgo de colisiones?
  choices:
    A: Al mediodía y a primera hora de la tarde
    B: Tarde en la noche
    C: Al amanecer y al anochecer
    D: Solo durante el tráfico de la hora pico de la mañana
  answer: C
  explanation: La actividad diaria de los ciervos es mayor al amanecer y al anochecer,
    que a menudo es el momento de mayor viaje para quienes se desplazan en vehículos
    motorizados.
- id: 281
  category: defensive_driving
  question: ¿Qué debe hacer si se le revienta un neumático mientras conduce?
  choices:
    A: Frenar bruscamente y girar con fuerza fuera de la carretera.
    B: Sujetar el volante con firmeza y retirar lentamente el pie del acelerador.
    C: Acelerar ligeramente para mantener el control del vehículo.
    D: Bombear los frenos rápidamente hasta que el vehículo se detenga.
  answer: B
  explanation: Si se revienta un neumático, sujete el volante con firmeza y retire
    lentamente el pie del acelerador. No frene hasta que su vehículo esté controlado.
- id: 282
  category: defensive_driving
  question: Si su vehículo deja de responder repentinamente al girar el volante, ¿por
    qué debería inicialmente mantener el pie fuera del pedal del freno?
  choices:
    A: Porque frenar hará que el motor se apague.
    B: Porque un cambio repentino de velocidad podría hacer que el vehículo pierda
      el control.
    C: Porque los frenos están conectados a la columna de dirección.
    D: Porque necesita acelerar para recuperar la presión del líquido de dirección.
  answer: B
  explanation: Durante una falla en la dirección, el equilibrio del vehículo permitirá
    que continúe en línea recta, pero un cambio repentino de velocidad (como frenar)
    podría hacer que pierda el control.
- id: 283
  category: defensive_driving
  question: ¿Por qué NO debe apagar el motor (ignición) si el pedal del acelerador
    se queda atascado?
  choices:
    A: Hará que el motor se incendie.
    B: Podría perder el control de la dirección o bloquear el volante.
    C: Los frenos se bloquearán inmediatamente.
    D: El vehículo acelerará más rápido.
  answer: B
  explanation: Si el pedal del acelerador está atascado, no apague el motor, ya que
    podría perder el control de la dirección o bloquear el volante.
- id: 284
  category: defensive_driving
  question: ¿Cuál es la acción correcta a seguir si sus ruedas se salen accidentalmente
    del pavimento?
  choices:
    A: Girar bruscamente de vuelta al pavimento de inmediato.
    B: Acelerar para que las ruedas vuelvan a la carretera.
    C: Retirar suavemente el pie del acelerador y frenar con cuidado.
    D: Frenar bruscamente y detenerse por completo en el arcén.
  answer: C
  explanation: Si sus ruedas se salen del pavimento, no gire ni vire bruscamente de
    vuelta al pavimento. Retire suavemente el pie del acelerador y frene con cuidado.
- id: 285
  category: defensive_driving
  question: Si un vehículo se le aproxima de frente en su carril, ¿qué debe hacer?
  choices:
    A: Virar hacia el carril izquierdo para evitarlo.
    B: Disminuir la velocidad, hacerse a la derecha y tocar la bocina.
    C: Detenerse inmediatamente en su carril y encender las luces altas intermitentes.
    D: Acelerar y girar hacia la izquierda.
  answer: B
  explanation: Ante un vehículo que se aproxima de frente en su carril, disminuya
    la velocidad, hágase a la derecha y toque la bocina para advertir al otro conductor.
    No gire hacia el carril izquierdo.
- id: 286
  category: defensive_driving
  question: Si su vehículo cae al agua, ¿por qué debería escapar por una ventana en
    lugar de abrir una puerta?
  choices:
    A: La manija de la puerta estará bloqueada por la presión del agua.
    B: Abrir una puerta haría que el agua entrara de golpe y el auto podría volcarse.
    C: La ventana ofrece una ruta de escape más amplia.
    D: Abrir la puerta hará que se desplieguen las bolsas de aire (airbags).
  answer: B
  explanation: Al escapar de un vehículo en el agua, suelte su cinturón de seguridad
    y escape por una ventana. Una puerta abierta haría que el agua entrara de golpe
    y el auto podría volcarse sobre usted.
- id: 287
  category: defensive_driving
  question: ¿Qué debe hacer si ve que sale humo de debajo del capó de su vehículo?
  choices:
    A: Abrir el capó inmediatamente para localizar el origen del fuego.
    B: Conducir rápidamente a la estación de bomberos más cercana.
    C: Salir de la carretera, apagar el motor, alejarse del auto y llamar a los bomberos.
    D: Usar agua del depósito del limpiaparabrisas para extinguir las llamas.
  answer: C
  explanation: Si ve humo saliendo de debajo del capó, salga de la carretera y estacione
    su vehículo. Apague el motor. Aléjese del auto y llame al departamento de bomberos.
    Es peligroso intentar combatir el fuego usted mismo.
- id: 288
  category: vehicle_information
  question: ¿Cómo debe frenar para recuperarse de un derrape de las ruedas traseras
    si su vehículo está equipado con frenos antibloqueo (ABS)?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Mantener el pie con una presión constante en el pedal del freno.
    C: Frenar con fuerza y soltar repetidamente.
    D: No tocar el pedal del freno en absoluto.
  answer: B
  explanation: Si su vehículo tiene frenos antibloqueo (ABS), mantenga el pie con
    una presión constante en el pedal del freno durante un derrape. Bombear el pedal
    es solo para vehículos sin ABS.
- id: 289
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de retroceder para entrar o salir de una entrada
    para autos cuando hay niños cerca?
  choices:
    A: Confiar únicamente en sus espejos retrovisores.
    B: Tocar la bocina tres veces antes de moverse.
    C: Salir del vehículo y revisar detrás de este.
    D: Acelerar rápidamente para minimizar el tiempo en la entrada.
  answer: C
  explanation: El manual establece que antes de retroceder en una entrada para autos,
    o salir de ella, debe salir del vehículo y revisar detrás de su vehículo, y no
    confiar solo en los espejos cuando hay niños cerca.
- id: 290
  category: sharing_the_road
  question: Si no hay una acera disponible, ¿cómo deben caminar los peatones a lo
    largo de la carretera?
  choices:
    A: En el lado de la carretera de cara al tráfico.
    B: En el lado de la carretera moviéndose en la misma dirección que el tráfico.
    C: En el centro del carril.
    D: En el arcén derecho, independientemente de la dirección del tráfico.
  answer: A
  explanation: Según el manual, los peatones deben caminar por el lado de la carretera
    y de cara al tráfico en el carril más cercano a ellos.
- id: 291
  category: sharing_the_road
  question: ¿Cuándo debe ceder el paso a un peatón ciego que cruza con un perro guía
    o un bastón blanco?
  choices:
    A: Solo cuando están en un cruce de peatones marcado.
    B: Solo cuando la señal de tráfico está a su favor.
    C: Siempre, incluso si las señales de tráfico no están a su favor.
    D: Solo durante las horas del día.
  answer: C
  explanation: Una ley especial de derecho de paso exige que los conductores siempre
    cedan el paso a los peatones ciegos cuando cruzan con un perro guía o un bastón
    blanco o metálico, incluso si las señales de tráfico no están a su favor.
- id: 292
  category: sharing_the_road
  question: Según la ley, ¿dónde se permite que los peatones se detengan para pedir
    transporte (hitchhike)?
  choices:
    A: En el arcén de una autopista.
    B: En la mediana central de una carretera dividida.
    C: En la carretera, siempre que lleven ropa reflectante.
    D: Nunca se permite que los peatones se detengan en la carretera para pedir transporte.
  answer: D
  explanation: La ley exige que los peatones nunca se detengan en la carretera para
    pedir transporte o realizar negocios con los automovilistas.
- id: 293
  category: defensive_driving
  question: En la ciudad de Nueva York, ¿durante qué maniobra del conductor ocurren
    más del 35% de los choques con lesiones a peatones?
  choices:
    A: Estacionamiento en paralelo.
    B: Al girar a la izquierda.
    C: Al girar a la derecha.
    D: Al salir de una entrada para autos en reversa.
  answer: B
  explanation: El manual señala que los giros a la izquierda pueden ser una maniobra
    muy peligrosa, indicando que más del 35% de los choques con lesiones a peatones
    en NYC ocurren cuando un conductor intenta realizar un giro a la izquierda.
- id: 294
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a un vehículo que está detenido en un cruce
    de peatones?
  choices:
    A: Rebasar el vehículo lentamente por la izquierda.
    B: Tocar la bocina para alertar al conductor de que se mueva.
    C: Nunca rebasar al vehículo, ya que puede haber peatones cruzando.
    D: Rebasar el vehículo por la derecha si hay suficiente espacio.
  answer: C
  explanation: 'El manual establece explícitamente: ''Nunca rebase a los vehículos
    detenidos en un cruce de peatones. Puede haber personas cruzando por donde usted
    no puede ver''.'
- id: 295
  category: vehicle_information
  question: ¿Cómo pueden afectar su conducción los pilares A (A-pillars) de un vehículo?
  choices:
    A: Mejoran su visión periférica.
    B: Pueden crear puntos ciegos que interfieren con la visibilidad clara.
    C: Ayudan a reducir el resplandor de los faros que vienen en sentido contrario.
    D: Ajustan automáticamente sus espejos para una mejor visibilidad.
  answer: B
  explanation: Los conductores deben estar conscientes de los pilares A de su vehículo
    (soportes verticales alrededor del vidrio) porque pueden interferir con la visibilidad
    clara y pueden crear puntos ciegos.
- id: 296
  category: sharing_the_road
  question: ¿En qué dirección deben circular los ciclistas por la carretera?
  choices:
    A: De frente al tráfico que viene en sentido contrario.
    B: En la misma dirección que los vehículos motorizados.
    C: En la dirección que tenga menos tráfico.
    D: En el lado izquierdo de la carretera en todo momento.
  answer: B
  explanation: El manual establece que los ciclistas tienen el derecho de compartir
    la carretera y circular en la misma dirección que los vehículos motorizados.
- id: 297
  category: sharing_the_road
  question: ¿Por qué debe reducir su velocidad al rebasar a un ciclista?
  choices:
    A: Para evitar salpicarles agua.
    B: Porque los ciclistas deben detenerse cuando son rebasados.
    C: La presión del aire de un vehículo que pasa rápidamente puede hacer que el
      ciclista pierda el equilibrio.
    D: Para permitir que el ciclista se agarre a su vehículo para ser remolcado.
  answer: C
  explanation: Los conductores deben dar espacio a los ciclistas y reducir la velocidad
    al rebasarlos porque la presión del aire de un vehículo que pasa rápidamente puede
    hacer que pierdan el equilibrio.
- id: 298
  category: sharing_the_road
  question: ¿Cuál es el número máximo de ciclistas que pueden circular uno al lado
    del otro en un solo carril?
  choices:
    A: Uno.
    B: Dos.
    C: Tres.
    D: Cuatro.
  answer: B
  explanation: Los ciclistas nunca deben circular con más de dos personas una al lado
    de la otra en un solo carril.
- id: 299
  category: safe_driving_rules
  question: Según la ley de Nueva York, ¿qué grupo de edad de ciclistas y sus pasajeros
    deben usar un casco aprobado?
  choices:
    A: De 1 a 13 años.
    B: De 5 a 16 años.
    C: De 10 a 18 años.
    D: La ley estatal lo exige para todas las edades.
  answer: A
  explanation: El manual establece que los ciclistas y sus pasajeros de 1 a 13 años
    deben usar un casco aprobado.
- id: 300
  category: safe_driving_rules
  question: ¿Bajo qué condición puede un ciclista llevar a un bebé menor de un año
    como pasajero?
  choices:
    A: Si el bebé está en un asiento de seguridad para bicicletas acoplado.
    B: Si el bebé lleva un casco aprobado.
    C: Si el ciclista circula por un carril para bicicletas designado.
    D: Bajo ninguna condición; es contra la ley.
  answer: D
  explanation: El manual establece explícitamente que un ciclista nunca debe llevar
    a un bebé menor de un año como pasajero, ya que es contra la ley.
- id: 301
  category: driver_responsibility
  question: Si un accidente de bicicleta causa la muerte o lesiones graves, ¿dentro
    de cuántos días debe reportarse al DMV?
  choices:
    A: 3 días.
    B: 5 días.
    C: 10 días.
    D: 30 días.
  answer: C
  explanation: Cualquier accidente de bicicleta que cause la muerte o lesiones graves
    debe reportarse al DMV dentro de los 10 días posteriores al incidente.
- id: 302
  category: vehicle_information
  question: ¿Una bicicleta conducida en vías públicas debe estar equipada con una
    bocina o campana que se pueda escuchar desde al menos qué distancia?
  choices:
    A: 50 pies.
    B: 100 pies.
    C: 200 pies.
    D: 500 pies.
  answer: B
  explanation: Una bicicleta conducida en vías públicas debe tener frenos adecuados
    y una bocina o campana que se pueda escuchar al menos a 100 pies (30 m) de distancia.
- id: 303
  category: vehicle_information
  question: ¿Qué equipo de iluminación se requiere para una bicicleta utilizada por
    la noche?
  choices:
    A: Una luz delantera visible desde 100 pies de frente y una luz trasera roja visible
      desde 100 pies por detrás.
    B: Una luz delantera visible desde 300 pies de frente y una luz trasera roja visible
      desde 500 pies por detrás.
    C: Una luz delantera visible desde 500 pies de frente y una luz trasera roja visible
      desde 300 pies por detrás.
    D: Solo se requieren reflectores montados en los radios por la noche.
  answer: C
  explanation: Una bicicleta utilizada por la noche debe tener una luz delantera visible
    desde al menos 500 pies de frente y una luz trasera roja visible desde al menos
    300 pies por detrás.
- id: 304
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor antes de girar a la derecha en rojo para
    evitar golpear a un ciclista?
  choices:
    A: Tocar la bocina para advertir a los ciclistas antes de girar.
    B: Detenerse por completo y mirar a la izquierda, a la derecha, a la izquierda
      y hacia atrás.
    C: Avanzar lentamente por la intersección mientras mira hacia la derecha.
    D: Ceder el paso únicamente a los peatones en el cruce peatonal.
  answer: B
  explanation: 'El manual establece: ''Deténgase por completo y mire a la izquierda,
    a la derecha, a la izquierda y hacia atrás antes de girar a la derecha en rojo''
    para evitar golpear a un ciclista que se aproxima por la parte trasera derecha.'
- id: 305
  category: signs_and_signals
  question: ¿Cuál es el propósito de una 'Caja para Bicicletas' (Bike Box) en la calzada?
  choices:
    A: Es un área de estacionamiento designada para bicicletas.
    B: Es un área marcada en una intersección, delante de donde se detiene el tráfico,
      para proporcionar espacio adicional a los ciclistas.
    C: Es un contenedor de almacenamiento para bicicletas urbanas compartidas.
    D: Es un carril exclusivo para scooters motorizados.
  answer: B
  explanation: El manual define una Caja para Bicicletas (Bike Box) como 'un área
    marcada en una intersección, delante de donde el tráfico debe detenerse. Esta
    área proporciona espacio adicional para los ciclistas'.
- id: 306
  category: signs_and_signals
  question: ¿Cuál es el propósito de los carriles para bicicletas pintados de verde?
  choices:
    A: Indicar áreas donde las bicicletas están prohibidas.
    B: Aumentar la visibilidad de los ciclistas en algunas áreas de mucho tráfico.
    C: Mostrar dónde los peatones tienen el derecho de paso sobre las bicicletas.
    D: Marcar rutas de desvío temporales para ciclistas.
  answer: B
  explanation: El manual establece que 'los carriles para bicicletas pintados de verde
    se utilizan para aumentar la visibilidad de los ciclistas en algunas áreas de
    mucho tráfico'.
- id: 307
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones sobre motocicletas que comparten
    un carril es verdadera?
  choices:
    A: Una motocicleta puede compartir un carril con un automóvil de pasajeros.
    B: Se permite que dos motociclistas circulen uno al lado del otro en un solo carril.
    C: Los motociclistas deben circular en fila india en todo momento.
    D: A una motocicleta no se le permite usar el ancho completo de un carril de tráfico.
  answer: B
  explanation: 'El manual establece: ''Además de usar el carril completo, se permite
    que dos motociclistas circulen uno al lado del otro en un solo carril, pero un
    motociclista no puede rebasar ni compartir un carril con otro vehículo motorizado
    que no sea una motocicleta''.'
- id: 308
  category: defensive_driving
  question: ¿Cómo afecta el tamaño más pequeño de una motocicleta a la percepción
    que tiene un conductor de ella?
  choices:
    A: Hace que la motocicleta parezca moverse más lento de lo que realmente va.
    B: Hace que sea difícil juzgar a qué distancia se encuentran o a qué velocidad
      van.
    C: Hace que los faros de la motocicleta parezcan más brillantes.
    D: Hace que sea más fácil determinar la posición exacta de la motocicleta en el
      carril.
  answer: B
  explanation: Según el manual, 'el tamaño más pequeño de una motocicleta hace que
    parezca mucho más lejana y dificulta juzgar a qué distancia se encuentra o a qué
    velocidad va'.
- id: 309
  category: vehicle_information
  question: ¿Por qué podría estar parpadeando la luz de giro de una motocicleta incluso
    si el conductor no tiene intención de girar?
  choices:
    A: Las luces de giro de las motocicletas están diseñadas para parpadear continuamente
      por seguridad.
    B: La señal direccional en la mayoría de las motocicletas no se apaga automáticamente
      después de un giro.
    C: El conductor está indicando que está reduciendo la velocidad.
    D: La motocicleta está experimentando una falla eléctrica.
  answer: B
  explanation: El manual explica que 'en la mayoría de las motocicletas, la señal
    direccional no se apaga automáticamente después de un giro, por lo que su luz
    de giro puede estar encendida inadvertidamente cuando el motociclista no tiene
    intención de girar'.
- id: 310
  category: sharing_the_road
  question: 'Según la Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA), un porcentaje significativo de los accidentes fatales de motocicletas
    involucra:'
  choices:
    A: Una motocicleta chocando por detrás a un camión detenido.
    B: Otro vehículo girando a la izquierda mientras la motocicleta va recto o está
      rebasando.
    C: Una motocicleta perdiendo el control sobre grava suelta.
    D: Otro vehículo girando a la derecha en rojo sin detenerse.
  answer: B
  explanation: El manual señala que en 2015, el 41 por ciento de los accidentes fatales
    de motocicletas en los EE. UU. ocurrieron cuando 'el otro vehículo giraba a la
    izquierda mientras las motocicletas iban recto, rebasaban o adelantaban a otros
    vehículos'.
- id: 311
  category: vehicle_information
  question: ¿Por qué las luces de freno de las motocicletas suelen ser menos evidentes
    para otros automovilistas en comparación con las luces de freno de los automóviles?
  choices:
    A: Parpadean rápidamente en lugar de permanecer fijas.
    B: Están montadas más abajo del nivel de los ojos y carecen de una luz de freno
      central superior (Center High Mount Stop Light).
    C: Suelen estar pintadas para que coincidan con el color de la motocicleta.
    D: Solo se iluminan cuando se aplica el freno delantero.
  answer: B
  explanation: El manual establece que la mayoría de los automóviles tienen una 'luz
    de freno central superior' al nivel de los ojos, mientras que 'la mayoría de las
    luces de freno de las motocicletas están montadas más abajo del nivel de los ojos,
    lo que las hace menos evidentes para muchos automovilistas'.
- id: 312
  category: defensive_driving
  question: ¿Por qué podría un motociclista cambiar rápidamente de velocidad o de
    posición en el carril?
  choices:
    A: Para evitar grava suelta, escombros o grietas en el pavimento.
    B: Para comunicarse con otros motociclistas.
    C: Para calentar sus neumáticos.
    D: Para bloquear intencionalmente el tráfico que se mueve más rápido.
  answer: A
  explanation: El manual advierte que un motociclista 'puede cambiar rápidamente de
    velocidad o de posición en el carril para evitar grava suelta, escombros, grietas
    o surcos en el pavimento, tapas de alcantarillado o de acceso, o animales pequeños'.
- id: 313
  category: sharing_the_road
  question: ¿Qué derechos y responsabilidades tienen las personas en bicicleta en
    la carretera?
  choices:
    A: Tienen el derecho de paso en todo momento, independientemente de las señales
      de tráfico.
    B: Tienen los mismos derechos y responsabilidades que las personas que conducen
      vehículos motorizados.
    C: Siempre deben ceder el paso a los vehículos motorizados.
    D: Solo se les permite circular por aceras y senderos designados.
  answer: B
  explanation: 'El manual establece explícitamente: ''Las personas en bicicleta tienen
    los mismos derechos y responsabilidades que las personas al volante de un vehículo
    motorizado''.'
- id: 314
  category: signs_and_signals
  question: ¿Qué es una ciclovía de doble sentido (2-way cycle track)?
  choices:
    A: Un camino de tierra exclusivamente para bicicletas de montaña.
    B: Un carril compartido donde las bicicletas y los automóviles viajan en direcciones
      opuestas.
    C: Un carril para bicicletas señalizado que permite el tránsito en ambas direcciones.
    D: Un carril de autopista designado solo para motocicletas y bicicletas.
  answer: C
  explanation: El manual define una ciclovía de doble sentido como 'un carril para
    bicicletas señalizado que permite el tránsito en ambas direcciones, similar a
    una acera para peatones'.
- id: 315
  category: driver_responsibility
  question: ¿Cómo debe reaccionar el conductor de un vehículo motorizado al compartir
    la carretera con patinadores en línea, patinadores de patineta y monopatines no
    motorizados?
  choices:
    A: Tocar la bocina continuamente hasta que se aparten de la carretera.
    B: Ejercer el cuidado debido estando atento, alerta y conduciendo a la defensiva.
    C: Pasar lo más cerca posible de ellos para animarlos a usar la acera.
    D: Asumir que siempre cederán el derecho de paso a los vehículos motorizados.
  answer: B
  explanation: El manual establece que, como conductor, usted es responsable de 'ejercer
    el cuidado debido estando atento, alerta y conduciendo a la defensiva' cerca de
    patinadores en línea, patinadores de patineta y monopatines no motorizados.
- id: 316
  category: safe_driving_rules
  question: ¿Qué precaución debe tomar antes de bajarse de un vehículo estacionado
    a un lado de la carretera?
  choices:
    A: Encender las luces de emergencia durante al menos un minuto.
    B: Tocar la bocina para alertar al tráfico que se aproxima.
    C: Buscar ciclistas que se aproximen para evitar abrir la puerta en su trayectoria.
    D: Abrir la puerta rápidamente para minimizar el tiempo que permanece en la calzada.
  answer: C
  explanation: 'El manual aconseja a los conductores: ''Mire antes de salir de su
    vehículo estacionado; evite abrir su puerta en la trayectoria de un ciclista que
    se aproxima''.'
- id: 317
  category: vehicle_information
  question: ¿Cuál es una afirmación verdadera con respecto a los faros delanteros
    de las motocicletas durante el día?
  choices:
    A: Deben estar encendidos al conducir, pero es posible que no resalten debido
      a las luces de circulación diurna de otros vehículos.
    B: Por ley deben estar apagados durante las horas del día para ahorrar batería.
    C: Están equipados con bombillas intermitentes especiales para distinguirlos de
      los automóviles.
    D: Solo se requiere su uso durante condiciones climáticas adversas.
  answer: A
  explanation: 'El manual establece: ''Los faros delanteros y las luces traseras de
    las motocicletas deben estar encendidos al conducir. Pero, con tantos vehículos
    equipados con luces de circulación diurna... los faros de las motocicletas no
    resaltan''.'
- id: 318
  category: sharing_the_road
  question: ¿Qué podría hacer un motociclista al acercarse a un cruce de ferrocarril?
  choices:
    A: Acelerar para cruzar las vías rápidamente.
    B: Disminuir la velocidad y levantarse del asiento.
    C: Virar bruscamente hacia el carril contrario.
    D: Detenerse por completo y cruzar la motocicleta caminando.
  answer: B
  explanation: Según el manual, al acercarse a un cruce de ferrocarril, un motociclista
    puede disminuir la velocidad y levantarse del asiento para amortiguar el cruce
    irregular y cambiar de dirección para cruzar las vías en ángulo recto.
- id: 319
  category: sharing_the_road
  question: ¿Por qué podría un motociclista moverse al centro del carril en un puente
    de plataforma de acero?
  choices:
    A: Para bloquear el tráfico que se mueve más rápido.
    B: Para ajustarse a una superficie irregular.
    C: Para prepararse para un giro en U.
    D: Para evitar el resplandor de los faros que vienen en sentido contrario.
  answer: B
  explanation: El manual establece que en los puentes de plataforma de acero, un motociclista
    puede moverse al centro del carril para ajustarse a la superficie que no es uniforme.
- id: 320
  category: sharing_the_road
  question: ¿Por dónde se permite conducir ciclomotores (mopeds) de Clase B y C en
    la carretera?
  choices:
    A: En cualquier carril de tráfico.
    B: Solo en el arcén (shoulder) de las autopistas.
    C: Solo en el carril derecho de tráfico, lo más a la derecha posible.
    D: En el carril izquierdo cuando viajan a más de 20 mph.
  answer: C
  explanation: Los ciclomotores de Clase B y C pueden conducirse únicamente en el
    carril derecho de tráfico, lo más a la derecha posible, o en el arcén.
- id: 321
  category: safe_driving_rules
  question: ¿Se permite conducir ciclomotores (mopeds) en autopistas?
  choices:
    A: Sí, pero solo en el carril derecho
    B: Sí, si son ciclomotores de Clase A
    C: No, a menos que las señales publicadas lo permitan
    D: No, bajo ninguna circunstancia
  answer: C
  explanation: No se permiten ciclomotores en autopistas u otras carreteras de acceso
    controlado a menos que las señales publicadas lo permitan.
- id: 322
  category: sharing_the_road
  question: En los choques fatales que involucran automóviles y camiones grandes,
    ¿quién suele contribuir a la causa del choque?
  choices:
    A: El conductor del camión
    B: El conductor del automóvil
    C: Los peatones
    D: Los trabajadores de mantenimiento de carreteras
  answer: B
  explanation: En más del 60 por ciento de todos los choques fatales que involucran
    automóviles y camiones grandes, el conductor del automóvil, no el del camión,
    contribuye a la causa del accidente de tráfico.
- id: 323
  category: vehicle_information
  question: ¿Qué tan grande puede ser el punto ciego frente a un tractor con capó
    largo?
  choices:
    A: 5 pies
    B: 10 pies
    C: 20 pies
    D: 50 pies
  answer: C
  explanation: Los tractores con capós largos pueden tener un punto ciego de 20 pies
    frente al vehículo, el cual los conductores deben evitar.
- id: 324
  category: vehicle_information
  question: ¿Por qué los tractocamiones (tractor-trailers) tardan mucho más en detenerse
    que los vehículos más pequeños?
  choices:
    A: Tienen pastillas de freno más pequeñas
    B: El retraso de frenado causado por los frenos de aire
    C: Sus neumáticos tienen menos tracción
    D: Los conductores tienen tiempos de reacción más lentos
  answer: B
  explanation: Para los tractocamiones, la diferencia en la distancia de frenado proviene
    del retraso de los frenos. Los frenos de aire transmiten la potencia de frenado
    desde el tractor al remolque y esto puede añadir muchos pies a la distancia necesaria
    para detenerse.
- id: 325
  category: sharing_the_road
  question: ¿Qué maniobra suelen realizar los camiones grandes antes de ejecutar un
    giro amplio a la derecha?
  choices:
    A: Se mueven hacia la izquierda
    B: Aumentan la velocidad significativamente
    C: Conducen por el arcén (hombro) derecho
    D: Encienden sus luces de emergencia
  answer: A
  explanation: Debido a que los camiones realizan giros amplios a la derecha, se mueven
    hacia la izquierda antes de girar a la derecha. Los conductores deben prestar
    mucha atención a sus señales de giro.
- id: 326
  category: defensive_driving
  question: ¿Por qué no debe subestimar la velocidad de un tractocamión que se aproxima?
  choices:
    A: Tienen permitido legalmente exceder el límite de velocidad
    B: Su mayor tamaño hace que parezca que se mueven más lento de lo que realmente
      van
    C: Siempre aceleran al acercarse a los automóviles
    D: Sus faros delanteros distorsionan su percepción de la profundidad
  answer: B
  explanation: No subestime el tamaño y la velocidad de un tractocamión que se aproxima.
    Su mayor tamaño a menudo hará que parezca que se mueve a una velocidad menor de
    la que realmente lleva.
- id: 327
  category: defensive_driving
  question: ¿Por qué debe dejar espacio adicional cuando se detiene detrás de un camión
    o autobús en una colina?
  choices:
    A: Los gases de escape son tóxicos a corta distancia
    B: El vehículo podría retroceder ligeramente al arrancar
    C: El conductor necesita espacio para abrir las puertas traseras
    D: Para permitir que los peatones crucen entre los vehículos
  answer: B
  explanation: Deje siempre espacio cuando se detenga detrás de un camión o autobús
    en un semáforo o señal de alto, especialmente cuando esté cuesta arriba. El camión
    o autobús podría retroceder ligeramente al arrancar.
- id: 328
  category: signs_and_signals
  question: ¿Cómo es el símbolo de "vehículo de movimiento lento"?
  choices:
    A: Un diamante amarillo
    B: Un triángulo naranja reflectante
    C: Un octágono rojo
    D: Un rectángulo blanco con letras negras
  answer: B
  explanation: El símbolo de "vehículo de movimiento lento" es un triángulo naranja
    reflectante que debe exhibirse en la parte trasera de los vehículos tirados por
    animales, la mayoría de los vehículos agrícolas y el equipo de construcción.
- id: 329
  category: safe_driving_rules
  question: ¿Cómo deben cruzar las carreteras estatales los vehículos todo terreno
    (ATV) y las motos de nieve?
  choices:
    A: Sin detenerse si el límite de velocidad es inferior a 45 mph
    B: En un ángulo de 45 grados para minimizar el tiempo en la carretera
    C: Deteniéndose por completo, cediendo el paso y cruzando en un ángulo de 90 grados
    D: Solo en los semáforos designados
  answer: C
  explanation: Antes de que los ATV y las motos de nieve crucen las carreteras, deben
    detenerse por completo y ceder el paso al tráfico. Deben cruzar en un ángulo de
    90 grados con respecto a la superficie de la carretera.
- id: 330
  category: sharing_the_road
  question: ¿Por dónde deben circular los jinetes en la carretera?
  choices:
    A: En el centro del carril
    B: En fila india cerca del bordillo derecho o del borde de la carretera
    C: De dos en fondo en el arcén izquierdo
    D: Solo por la acera
  answer: B
  explanation: Los jinetes están sujetos a las reglas de la carretera y deben circular
    en fila india cerca del bordillo derecho o del borde de la carretera, o en un
    arcén derecho, carril o sendero que pueda ser utilizado.
- id: 331
  category: vehicle_information
  question: ¿Cuál es el rango de velocidad máxima para una motocicleta de uso limitado
    (ciclomotor) Clase A?
  choices:
    A: 20 mph o menos
    B: 21 a 30 mph
    C: 31 a 40 mph
    D: 41 a 50 mph
  answer: C
  explanation: Según la tabla de la Guía para la Operación de Motocicletas de Uso
    Limitado (Ciclomotores), el rango de velocidad máxima para un ciclomotor Clase
    A es de 31 a 40 mph.
- id: 332
  category: defensive_driving
  question: ¿Qué debe hacer si un camión grande está bloqueando la carretera para
    retroceder hacia un área de carga?
  choices:
    A: Tocar la bocina para alertar al conductor
    B: Pasar rápidamente cerca por detrás del camión
    C: Esperar pacientemente hasta que se complete la maniobra de retroceso
    D: Conducir por la acera para esquivar el camión
  answer: C
  explanation: Nunca pase cerca por detrás de un vehículo grande que esté retrocediendo.
    Es mucho mejor esperar pacientemente hasta que el vehículo grande haya completado
    su maniobra de retroceso que intentar pasar y arriesgarse a entrar en un punto
    ciego.
- id: 333
  category: sharing_the_road
  question: ¿Qué es ilegal hacer cuando se aproxima o rebasa a un caballo que está
    siendo montado o llevado a pie por una carretera?
  choices:
    A: Rebasar al caballo a baja velocidad
    B: Tocar la bocina
    C: Dejar una distancia amplia entre su vehículo y el caballo
    D: Ceder el paso
  answer: B
  explanation: El manual establece que es ilegal tocar la bocina cuando se aproxima
    o rebasa a un caballo.
- id: 334
  category: driver_responsibility
  question: ¿Qué tipo de infracción es abandonar la escena de un accidente de tráfico
    que involucra una fatalidad o lesiones personales?
  choices:
    A: Una infracción de tráfico menor
    B: Una sanción civil
    C: Una infracción de movimiento
    D: Una violación penal (delito)
  answer: D
  explanation: Es una violación penal abandonar la escena de un incidente que involucra
    una fatalidad o lesiones personales.
- id: 335
  category: driver_responsibility
  question: Si daña un vehículo estacionado o lesiona a un animal doméstico en un
    accidente, ¿qué debe hacer?
  choices:
    A: Dejar una nota en el parabrisas y marcharse
    B: Intentar encontrar al dueño o notificar a la policía
    C: Esperar 15 minutos y marcharse si no aparece nadie
    D: Informarlo al DMV en un plazo de 30 días
  answer: B
  explanation: Si se daña un vehículo estacionado o una propiedad distinta a un vehículo,
    o si un animal doméstico resulta herido, debe intentar encontrar al dueño o notificar
    a la policía.
- id: 336
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias debe mover a una persona lesionada en la escena
    de un accidente?
  choices:
    A: Solo si le piden que les ayude a ponerse de pie
    B: Solo si se vuelve necesario debido a un incendio u otro peligro mortal
    C: Siempre que estén bloqueando el flujo del tráfico
    D: Inmediatamente al llegar a la escena para que estén cómodos
  answer: B
  explanation: No mueva a una persona lesionada a menos que sea necesario debido a
    un incendio u otro peligro mortal.
- id: 337
  category: safe_driving_rules
  question: Si debe mover a una persona lesionada lejos de un peligro mortal, ¿cómo
    debe arrastrarla?
  choices:
    A: Por los brazos
    B: Por las piernas
    C: Por la cabeza primero
    D: De lado
  answer: C
  explanation: Sujete la ropa con las manos y arrastre a la víctima por la cabeza
    primero, alejándola del peligro, mientras mantiene la espalda y el cuello lo más
    rectos posible.
- id: 338
  category: safe_driving_rules
  question: ¿Qué debe hacer si hay cables tocando un vehículo en la escena de un accidente?
  choices:
    A: Usar un palo de madera para quitar los cables del vehículo
    B: Abrir las puertas para ayudar a los ocupantes a escapar rápidamente
    C: Advertir a los ocupantes que permanezcan dentro hasta que llegue ayuda
    D: Retirar los cables con guantes resistentes
  answer: C
  explanation: Si hay cables caídos, no se acerque a ellos. Si los cables tocan el
    vehículo o están cerca de él, advierta a los ocupantes que permanezcan dentro
    hasta que llegue ayuda.
- id: 339
  category: driver_responsibility
  question: Debe informar un accidente de tráfico al DMV si involucra una fatalidad,
    lesiones personales o daños a la propiedad de cualquier persona por al menos ¿qué
    cantidad?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: También debe informar cualquier incidente o accidente de tráfico que
    involucre $1,000 o más en daños a la propiedad de cualquier persona.
- id: 340
  category: driver_responsibility
  question: ¿Cuántos días tiene para presentar un informe de accidente (MV-104) ante
    el DMV después de un accidente notificable?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Debe presentar un informe ante el DMV dentro de los 10 días posteriores
    al evento.
- id: 341
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por no informar un accidente al DMV?
  choices:
    A: Una carta de advertencia
    B: Reentrenamiento obligatorio para conductores
    C: Suspensión o revocación de su licencia de conducir y/o registros
    D: Una marca permanente en su informe de crédito
  answer: C
  explanation: No informar un accidente es un delito penal (delito menor) y puede
    significar la suspensión o revocación de su licencia de conducir y/o registros,
    así como los del propietario del vehículo.
- id: 342
  category: driver_responsibility
  question: Si el conductor está lesionado y no puede completar el informe de accidente
    requerido por el DMV, ¿quién puede hacerlo?
  choices:
    A: Solo un oficial de policía
    B: Solo el agente de seguros del conductor
    C: Un pasajero o el propietario del vehículo
    D: El médico del conductor
  answer: C
  explanation: Si el conductor está lesionado y no puede completar el informe, un
    pasajero o el propietario del vehículo puede hacerlo.
- id: 343
  category: driver_testing
  question: ¿Cuál de las siguientes funciones de los Sistemas Avanzados de Asistencia
    al Conductor (ADAS) NO se le permite usar durante su examen de conducir?
  choices:
    A: Alerta de marcha atrás
    B: Monitor de punto ciego
    C: Estacionamiento en paralelo automático
    D: Alerta de colisión frontal
  answer: C
  explanation: Al realizar su examen de conducir, no se le permitirá utilizar ciertas
    funciones de seguridad, como el asistente de estacionamiento (estacionamiento
    en paralelo automático) y el control de crucero.
- id: 344
  category: vehicle_information
  question: ¿En cuál de las siguientes condiciones podrían las funciones de seguridad
    de su vehículo (ADAS) no funcionar correctamente?
  choices:
    A: En carreteras rectas y planas
    B: Durante clima despejado y soleado
    C: Con lluvia, nieve, hielo o niebla
    D: Al conducir por debajo del límite de velocidad
  answer: C
  explanation: Tenga en cuenta que las funciones de seguridad pueden no funcionar
    correctamente en ciertas condiciones, como lluvia, nieve, hielo, niebla, colinas
    y curvas.
- id: 345
  category: driver_testing
  question: Según el manual, ¿cuál de las siguientes tecnologías del vehículo está
    permitido que esté activa durante un examen de conducir?
  choices:
    A: Control de crucero adaptativo
    B: Estacionamiento en paralelo automático
    C: Alerta de tráfico cruzado trasero
    D: Piloto automático de conducción autónoma
  answer: C
  explanation: La alerta de tráfico cruzado trasero figura entre los sistemas de advertencia
    permitidos para el examen. El control de crucero adaptativo y el estacionamiento
    en paralelo automático no están permitidos.
- id: 346
  category: safe_driving_rules
  question: ¿Cuál es la responsabilidad del conductor al operar un vehículo equipado
    con Sistemas Avanzados de Asistencia al Conductor (ADAS)?
  choices:
    A: Confiar totalmente en las funciones de seguridad para evitar choques
    B: Mantenerse involucrado y siempre concentrado en la tarea de conducir
    C: Desactivar todas las funciones de seguridad antes de conducir
    D: Dejar que el vehículo se dirija solo en las autopistas
  answer: B
  explanation: Las funciones de seguridad están destinadas a asistirle en la tarea
    de conducir, no están ahí para conducir el vehículo. Usted debe mantenerse involucrado
    y siempre concentrado en la tarea de conducir.
- id: 347
  category: driver_testing
  question: ¿Qué oficina del DMV de Manhattan establece explícitamente que no ofrece
    exámenes para el permiso?
  choices:
    A: Harlem
    B: Midtown Manhattan
    C: License Express
    D: Lower Manhattan – Greenwich St.
  answer: C
  explanation: Según el directorio del DMV, la oficina de License Express ubicada
    en 145 West 30th Street en Nueva York establece explícitamente "No permit testing"
    (Sin exámenes para el permiso).
- id: 348
  category: driver_testing
  question: Según el directorio del DMV, ¿a qué número de teléfono puede llamar para
    programar un examen práctico?
  choices:
    A: 1-(518)-402-2100
    B: 1-(518)-486-9786
    C: 1-(718)-477-4820
    D: 1-(518) 474-0774
  answer: A
  explanation: El manual establece que para programar un examen práctico, puede visitar
    dmv.ny.gov o llamar al 1-(518)-402-2100.
- id: 349
  category: vehicle_information
  question: Si tiene una queja sobre un taller de reparación, concesionario o estación
    de inspección, ¿con qué oficina debe comunicarse?
  choices:
    A: Driver Improvement Bureau (Oficina de Mejora del Conductor)
    B: Bureau of Consumer & Facility Services (Oficina de Servicios al Consumidor
      e Instalaciones)
    C: Financial Security Bureau (Oficina de Seguridad Financiera)
    D: Title Services Bureau (Oficina de Servicios de Títulos)
  answer: B
  explanation: Las quejas sobre un taller de reparación, concesionario o estación
    de inspección deben dirigirse a la Bureau of Consumer & Facility Services al 1-(518)
    474-8943.
- id: 350
  category: vehicle_information
  question: ¿A qué número de teléfono debe llamar si tiene preguntas específicamente
    sobre las Inspecciones de Emisiones?
  choices:
    A: 1-(518)-473-0597
    B: 1-(518)-402-4838
    C: 1-(518) 474-0700
    D: 1-(518) 474-0774
  answer: A
  explanation: El directorio indica el 1-(518)-473-0597 como el número al que llamar
    para preguntas sobre Inspecciones de Emisiones bajo la Bureau of Consumer & Facility
    Services.
- id: 351
  category: penalties_and_points
  question: ¿Cuál es el número de teléfono correcto para comunicarse con la Oficina
    de Infracciones de Tránsito (TVB) de la ciudad de Nueva York sobre una audiencia
    programada?
  choices:
    A: 1-(718) 488-5710
    B: 1-(212)-645-5550
    C: 1-(718)-966-6155
    D: 1-(518) 474-0774
  answer: A
  explanation: Para comunicarse con una Oficina de Infracciones de Tránsito sobre
    una audiencia programada en la ciudad de Nueva York, el manual proporciona el
    número 1-(718) 488-5710.
- id: 352
  category: license_system
  question: ¿Cuál de los siguientes es el número de teléfono correcto para la Línea
    de Ayuda de la Licencia de Conducir Mejorada (EDL)?
  choices:
    A: 1-(518) 474-9981
    B: 1-(800) 368-1186
    C: 1-(518) 473-9002
    D: 1-(518)-486-9786
  answer: A
  explanation: El directorio de los Centros de Llamadas del DMV indica que el número
    de la Línea de Ayuda de la EDL es 1-(518) 474-9981.
- id: 353
  category: vehicle_information
  question: ¿Con qué nombre se conocía anteriormente a la Oficina de Seguridad Financiera
    (Financial Security Bureau)?
  choices:
    A: Oficina de Servicios de Títulos
    B: Oficina de Servicios de Seguros
    C: Oficina de Mejora del Conductor
    D: Unidad de Matrículas Personalizadas
  answer: B
  explanation: El directorio enumera la 'Oficina de Seguridad Financiera (anteriormente
    Oficina de Servicios de Seguros)'.
- id: 354
  category: license_system
  question: ¿Cuál es el número de teléfono TTY/TDD (Dispositivo de Telecomunicaciones
    para Sordos) para uso dentro del estado de Nueva York?
  choices:
    A: 1-(518) 473-9002
    B: 1-(800) 368-1186
    C: 1-(518)-486-9786
