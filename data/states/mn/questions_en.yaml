metadata:
  source: Minnesota Driver's Manual (May 2025) (assets.dps.mn.gov)
  total_questions: 383
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: sharing_the_road
  question: What is the minimum age requirement to ride an electric-assist bicycle in Minnesota?
  choices:
    A: 12 years old
    B: 14 years old
    C: 15 years old
    D: 16 years old
  answer: C
  explanation: According to the manual, electric-assist bicycles are not mopeds and can be ridden on most bike trails, but you need to be at least 15 years old to ride one.
- id: 2
  category: safe_driving_rules
  question: According to Minnesota's child passive restraint rules, children under what age must ride in the back seat if it is available?
  choices:
    A: 8 years old
    B: 10 years old
    C: 12 years old
    D: 13 years old
  answer: D
  explanation: The manual states that children under 13 years old must now ride in the back seat if it is available.
- id: 3
  category: sharing_the_road
  question: Why must drivers stay especially alert and careful when sharing the road with vulnerable road users like bicyclists, pedestrians, and people in wheelchairs?
  choices:
    A: They always have the right-of-way at all intersections.
    B: They do not have seat belts or airbags for protection.
    C: They are not required to follow any traffic laws.
    D: They travel at faster speeds than motor vehicles.
  answer: B
  explanation: The manual explains that vulnerable road users don't have seat belts or airbags, so drivers need to stay alert and be careful when sharing the road with them.
- id: 4
  category: license_system
  question: What does the 'Driver's License for All' law change regarding applying for a standard driver's license or state ID?
  choices:
    A: It removes the requirement to pass a road test.
    B: It removes the need to show proof of legal presence in the U.S.
    C: It makes all driver's licenses free of charge.
    D: It allows individuals under 15 to get a standard license.
  answer: B
  explanation: The Driver's License for All law removes the need to show proof of legal presence in the U.S., allowing individuals to get a card regardless of immigration status.
- id: 5
  category: license_system
  question: Which of the following can now be used as a utility bill to prove residence for a REAL ID-compliant card?
  choices:
    A: A handwritten note from a landlord
    B: A magazine subscription label
    C: Internet and cable bills
    D: A library card
  answer: C
  explanation: As of August 1, 2023, applicants can now use internet and cable bills as utility bills to prove residence for a REAL ID-compliant card.
- id: 6
  category: driver_responsibility
  question: Why might a driver choose to include caretaker information on their driver's license or identification card record?
  choices:
    A: To receive a discount on vehicle registration fees.
    B: To allow law enforcement to know someone at home depends on them if they are in a crash.
    C: To legally park in designated handicap parking spaces.
    D: To be exempt from taking the written driving test.
  answer: B
  explanation: Adding caretaker information to DVS records lets law enforcement officers know if you are involved in a crash that there is someone at home who depends on you, ensuring they are not left alone.
- id: 7
  category: license_system
  question: Veterans with a 100 percent total service-connected disability are exempt from sales, registration, and wheelage taxes for up to how many vehicles?
  choices:
    A: One vehicle
    B: Two vehicles
    C: Three vehicles
    D: Unlimited vehicles
  answer: B
  explanation: Veterans with a 100 percent total-service connected disability are exempt from sales, registration and wheelage taxes for up to two vehicles.
- id: 8
  category: driver_testing
  question: Under what condition is a new Minnesota resident exempt from taking the written test when applying for a Minnesota driver's license?
  choices:
    A: If they are 18 and older with a valid out-of-state learner's permit.
    B: If they are 21 and older and have a valid, unexpired license from another U.S. state.
    C: If they have lived in Minnesota for more than 6 months.
    D: If they have a clean driving record for the past 5 years.
  answer: B
  explanation: If you are 21 and older and have a valid, unexpired license from another U.S. state, you will no longer need to take the written test when applying for a Minnesota driver's license.
- id: 9
  category: license_system
  question: When providing race and ethnicity data on a driver's license application, which of the following is true?
  choices:
    A: It is a mandatory requirement for all new applicants.
    B: The data is published in public records.
    C: Providing this data is voluntary and classified as private.
    D: It is used to determine the cost of your filing fee.
  answer: C
  explanation: Providing race and ethnicity data is voluntary (you are not required to share information) and the data is classified as private.
- id: 10
  category: license_system
  question: At what age may an individual be eligible to get a driver's license specifically for their own medical needs or the medical needs of a relative?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: The manual states that if you are 15 years old, you may be able to get a driver's license for your own medical needs or the medical needs of your relatives.
- id: 11
  category: license_system
  question: What is a new eligibility rule for individuals under age 16 applying for a restricted license for farm work?
  choices:
    A: They can drive any commercial vehicle on the farm.
    B: They are eligible even if their parent or guardian does not own the farm.
    C: They no longer need to pass a road test.
    D: They can use the license for non-farm related work.
  answer: B
  explanation: If you are under age 16 and work on a farm, you may be eligible for the restricted farm license, even if your parent or guardian does not own the farm.
- id: 12
  category: license_system
  question: How long is a Reintegration license valid after it is issued to an eligible individual released from prison in Minnesota?
  choices:
    A: 6 months
    B: 12 months
    C: 15 months
    D: 24 months
  answer: C
  explanation: The Reintegration license expires 15 months after it is issued and is canceled if you break traffic laws and lose driving privileges.
- id: 13
  category: license_system
  question: What happens if you provide proof of U.S. citizenship when applying for or renewing a Minnesota driver's license?
  choices:
    A: You will be automatically registered to vote unless you opt out.
    B: You will receive a permanent driver's license that never expires.
    C: Your filing fee will be waived.
    D: You are required to take a civics exam.
  answer: A
  explanation: Under a new law, if you provide proof that you are a U.S. citizen when applying for or renewing a driver's license, you will be automatically registered to vote. If you do not wish to be registered, you must opt out.
- id: 14
  category: license_system
  question: 'Incarcerated individuals may be able to renew their driver''s licenses and identification cards remotely if they are serving a sentence longer than:'
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: C
  explanation: If you are serving a sentence longer than six months in a jail or correctional facility without an existing agreement with DVS, you can now renew your driver's licenses and identification cards remotely.
- id: 15
  category: license_system
  question: To qualify for a veteran indicator on a driver's license using a DD-214 form, the form must show honorable service for at least how many consecutive days?
  choices:
    A: 90 days
    B: 120 days
    C: 181 days
    D: 365 days
  answer: C
  explanation: You can prove that you are qualified using a DD-214 form that shows honorable or honorable conditions with 181 days of consecutive service.
- id: 16
  category: driver_responsibility
  question: According to Minnesota law, what is the consequence of interfering with the work of a Driver and Vehicle Services (DVS) employee?
  choices:
    A: A warning will be issued
    B: It is considered a crime
    C: A fine of $500 will be assessed
    D: Your driver's license will be suspended
  answer: B
  explanation: The manual states, 'It is a crime to interfere with the work of a DVS employee. Minnesota Statute 609.50, Subdivision 5.'
- id: 17
  category: license_system
  question: How far in advance should you start your online pre-application before visiting a driver's license office?
  choices:
    A: No more than 14 days
    B: No more than 30 days
    C: No more than 60 days
    D: No more than 90 days
  answer: B
  explanation: The manual advises to 'Start your application online using the pre-application feature no more than 30 days before visiting a driver's license office to avoid completing a paper application.'
- id: 18
  category: driver_testing
  question: If you are under 18 years of age, what does a 'Blue Card' certify when you apply to take your written test?
  choices:
    A: You have completed driver education and passed the road test
    B: You have completed 15 hours of behind-the-wheel instruction
    C: You have completed classroom instruction and are signed up for behind-the-wheel instruction
    D: You have held your instruction permit for at least six months
  answer: C
  explanation: The written test checklist for those under 18 requires a 'certificate of enrollment (Blue Card) proving that I completed classroom instruction and am signed up for behind-the-wheel instruction.'
- id: 19
  category: driver_testing
  question: What is the minimum age required to take the written driver's test in Minnesota?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: The written test checklist for applicants under 18 states, 'I am at least 15 years old.'
- id: 20
  category: driver_testing
  question: Which of the following is a requirement for the vehicle you provide for your road test?
  choices:
    A: It must have a backup camera
    B: The doors must open from the inside and outside
    C: It must be less than 10 years old
    D: It must have dual controls for the examiner
  answer: B
  explanation: The road test checklist requires providing a vehicle in safe working condition where 'Doors must open from the inside and outside.'
- id: 21
  category: license_system
  question: If you are under 18 years of age, how long must you hold an instruction permit before taking the road test?
  choices:
    A: At least three months
    B: At least six months
    C: At least nine months
    D: At least one year
  answer: B
  explanation: The road test checklist for those under 18 requires that you 'have held an instruction permit for the last six months without a conviction for a moving violation or an alcohol or controlled substance violation.'
- id: 22
  category: license_system
  question: If you are 19 years of age or older, what is the minimum amount of time you must hold an instruction permit before taking a road test?
  choices:
    A: At least one month
    B: At least three months
    C: At least six months
    D: At least one year
  answer: B
  explanation: The road test checklist for applicants 19 years of age or older states, 'I have had my instruction permit for at least three months.'
- id: 23
  category: driver_testing
  question: What tests must you pass if your Minnesota driver's license has been expired for more than one year but less than five years?
  choices:
    A: A vision test only
    B: A written test and a vision test
    C: A road test and a vision test
    D: A written test, a vision test, and a road test
  answer: B
  explanation: The manual states, 'If your Minnesota driver's license has been expired for more than one year but less than five years, you must pass a written test and a vision test before applying for a new license.'
- id: 24
  category: license_system
  question: If you are 21 years of age or older and moving to Minnesota from another state with a valid, unexpired driver's license, what test(s) must you pass to get a Minnesota license?
  choices:
    A: A vision test only
    B: A written test only
    C: A written test and a vision test
    D: A written test, a vision test, and a road test
  answer: A
  explanation: The manual states that if you are 21 or older moving from another state with a valid, unexpired license, 'you can get a license by passing a vision test and completing an application. You are not required to take a written test or road test...'
- id: 25
  category: license_system
  question: Once you become a Minnesota resident, how many days do you have to obtain your regular Minnesota driver's license?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: The manual states, 'You have 60 days (30 days for commercial drivers) once you become a Minnesota resident to get your Minnesota license or permit.'
- id: 26
  category: license_system
  question: What is required if you are moving to Minnesota from a country other than the U.S. or Canada and have a valid license from your former country?
  choices:
    A: You only need to pass a vision test
    B: You must pass a written test and a vision test
    C: You must pass a written test, a vision test, and a road test
    D: You can simply exchange your foreign license for a Minnesota license
  answer: C
  explanation: The manual states, 'If you are moving to Minnesota from a country other than the U.S. or Canada, you must pass a written test, a vision test and a road test even if you have a valid license from your former country.'
- id: 27
  category: license_system
  question: Under which of the following circumstances can you drive on public roads in Minnesota without a valid Minnesota driver's license or permit?
  choices:
    A: When driving a commercial vehicle for a private company
    B: When temporarily driving a farm tractor or other farm implement on a public road
    C: When driving a motorcycle during daylight hours
    D: When driving a vehicle registered in another state for up to 6 months
  answer: B
  explanation: One of the exceptions listed for who does not need a Minnesota license is if 'You temporarily drive a farm tractor or other farm implement on a public road.'
- id: 28
  category: driver_testing
  question: What document proves that an applicant under 18 years of age has completed driver education when applying for a road test?
  choices:
    A: A Blue Card
    B: A Pink Card
    C: A White Card
    D: A Green Card
  answer: C
  explanation: The road test checklist for applicants under 18 requires a 'certificate of course completion (White Card) proving that I completed driver education.'
- id: 29
  category: driver_testing
  question: If you move to Minnesota from another state and your former state license has been expired for less than one year, what test must you pass in addition to the vision test?
  choices:
    A: The road test only
    B: The written test only
    C: Both the written and road tests
    D: No additional tests are required
  answer: B
  explanation: The manual states, 'If your former state license is expired less than one year, you are required to pass the written test.'
- id: 30
  category: driver_testing
  question: What will happen if you arrive for your road test without a licensed driver accompanying you?
  choices:
    A: You will be charged an additional fee
    B: The examiner will drive the vehicle to the testing area
    C: Your road test may be cancelled
    D: You will be required to take the written test again
  answer: C
  explanation: The road test checklist states, 'I have a licensed driver who will accompany me to my road test. I understand that if I do not have a licensed driver with me, my road test may be cancelled.'
- id: 31
  category: license_system
  question: How long can a non-resident, who is at least 18 years old and from a country that does not require drivers to be licensed, drive in Minnesota without a valid license or permit?
  choices:
    A: Up to 30 days in any calendar year
    B: Up to 60 days in any calendar year
    C: Up to 90 days in any calendar year
    D: Up to 120 days in any calendar year
  answer: C
  explanation: According to the manual, if you are a non-resident, at least 18, and your home country does not require licenses, you can drive a vehicle registered in your home country in Minnesota for up to 90 days in any calendar year.
- id: 32
  category: license_system
  question: Which of the following individuals will NOT be issued a Minnesota driver's license?
  choices:
    A: A 19-year-old who has had an instruction permit for 4 months
    B: An 18-year-old who has had an instruction permit for 5 months
    C: A 16-year-old who completed driver's education and has a valid out-of-state license
    D: A 21-year-old who has passed all required tests
  answer: B
  explanation: The manual states you will not be issued a license if you are 18 years old or younger and have had an instruction permit for less than six months.
- id: 33
  category: license_system
  question: If you do not have a current or recently expired Minnesota driver's license or ID, what must you present to apply for a standard driver's license?
  choices:
    A: One primary document containing your full name
    B: Two documents (primary and secondary) containing your full name and date of birth
    C: Three documents proving your current residency
    D: A utility bill and a tax return
  answer: B
  explanation: If you do not have a qualifying previous license or ID, you must present two documents (primary and secondary) that contain your full name and your date of birth, such as a birth certificate, passport, or Social Security card.
- id: 34
  category: license_system
  question: What is an additional requirement for obtaining an Enhanced Driver's License or ID compared to a standard license?
  choices:
    A: Proof of U.S. citizenship
    B: A certified translation of your birth certificate
    C: Passing an advanced road test
    D: A $50 additional fee
  answer: A
  explanation: Only applicants who can provide proof of identity, full legal name, Social Security number, photographic identity, Minnesota residency, and U.S. citizenship are eligible for a Minnesota enhanced driver's license or ID.
- id: 35
  category: license_system
  question: How much is the additional fee required when applying for an enhanced driver's license or ID card?
  choices:
    A: $5
    B: $10
    C: $15
    D: $20
  answer: C
  explanation: A $15 fee is required in addition to the fee for a driver's license or ID card when applying for an enhanced driver's license or ID.
- id: 36
  category: license_system
  question: Which of the following is a requirement for a qualified English translation of an identification document?
  choices:
    A: The translator must be a blood relative of the applicant
    B: The translator must be a notary public
    C: The translator must not be related by blood or marriage to the subject of the document
    D: The translation must be laminated before submission
  answer: C
  explanation: The Certificate of Translation requires the translator to certify that they are not related by blood or marriage to the subject of the document.
- id: 37
  category: license_system
  question: Are Social Security numbers printed on Minnesota driver's licenses or identification cards?
  choices:
    A: Yes, they are printed on the front of the card
    B: Yes, they are embedded in the card's barcode
    C: No, they are not printed on or embedded in the cards
    D: Yes, but only on REAL ID compliant cards
  answer: C
  explanation: 'The manual explicitly states: "Social Security numbers are not printed on or embedded in driver''s licenses or identification cards."'
- id: 38
  category: driver_testing
  question: What happens if you fail two consecutive written tests?
  choices:
    A: You must wait 30 days before retaking the test
    B: You are charged a $10 fee for the third and any subsequent tests
    C: You must retake the classroom portion of driver's education
    D: You are required to complete an interview questionnaire
  answer: B
  explanation: If you fail two consecutive written tests, a $10 fee is charged for the third and any subsequent tests.
- id: 39
  category: driver_testing
  question: What are the minimum vision standards required to pass the vision screening for a driver's license?
  choices:
    A: At least 20/20 vision and 90 degrees peripheral vision
    B: At least 20/40 vision and 105 degrees peripheral vision
    C: At least 20/50 vision and 100 degrees peripheral vision
    D: At least 20/30 vision and 120 degrees peripheral vision
  answer: B
  explanation: Your normal or corrected vision must be at least 20/40, and your peripheral vision must be at least 105 degrees to pass the vision screening.
- id: 40
  category: driver_testing
  question: If you are under 18 years old, what must you present before taking the written test?
  choices:
    A: A high school diploma or equivalent
    B: A certificate of enrollment ('Blue Card' or 'Pink Card') from an approved driver education course
    C: A letter of recommendation from a licensed driving instructor
    D: Proof of vehicle insurance
  answer: B
  explanation: If you are under 18, you must present a certificate of enrollment ('Blue Card' or 'Pink Card') from an approved driver education course showing you completed classroom instruction and enrolled in behind-the-wheel training.
- id: 41
  category: license_system
  question: Which of the following types of identification documents will DVS NOT accept?
  choices:
    A: Certified marriage certificates
    B: Certified divorce decrees
    C: Photocopies or laminated documents
    D: Valid passports
  answer: C
  explanation: DVS will verify your documents and may not accept them if they are laminated or altered. They cannot accept photocopies of identification documents.
- id: 42
  category: driver_testing
  question: How many written tests are you allowed to take per day?
  choices:
    A: One
    B: Two
    C: Three
    D: Unlimited
  answer: A
  explanation: 'The manual states: "You may take only one written test per day and must score 80 percent to pass."'
- id: 43
  category: license_system
  question: How many documents proving current Minnesota residency are required when applying for a REAL ID?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Applying for a REAL ID requires you to provide two documents proving your current residency in Minnesota.
- id: 44
  category: driver_testing
  question: Which of the following is NOT one of the three parts of the road test?
  choices:
    A: Demonstrating your vehicle's safety equipment
    B: Showing your vehicle control skills
    C: Performing a driving test
    D: Completing a written traffic law exam
  answer: D
  explanation: 'The road test includes three parts: demonstrating your vehicle''s safety equipment, showing your vehicle control skills, and performing a driving test. The written exam is a separate requirement.'
- id: 45
  category: vehicle_information
  question: Which of the following types of vehicles is NOT allowed to be used for your road test?
  choices:
    A: A rental vehicle where you are listed as a driver
    B: A vehicle with a backup camera
    C: A Neighborhood Electric Vehicle (NEV)
    D: A vehicle with fully automatic headlights
  answer: C
  explanation: According to the manual, you must provide your own vehicle for the test, and Neighborhood electric vehicles (NEVs) are not allowed.
- id: 46
  category: driver_testing
  question: What is the rule regarding the use of a backup camera during the road test?
  choices:
    A: It must be completely disabled or covered by the examiner.
    B: It may be used, but cannot be the only method of observation when backing up.
    C: It can be used as the primary and sole method of observation.
    D: It is only allowed during the parallel parking maneuver.
  answer: B
  explanation: You may use a vehicle with a backup camera, but the camera should not be the only method of observation when backing up.
- id: 47
  category: driver_testing
  question: Which of the following actions will cause you to immediately fail the road test?
  choices:
    A: Asking the examiner to repeat an instruction.
    B: Involving your vehicle in a crash that you could have avoided, even if you are not legally at fault.
    C: Using your mirrors to check for traffic before changing lanes.
    D: Manually activating your high and low beam headlights during the safety check.
  answer: B
  explanation: Involving your vehicle in a crash that you could have avoided, even if you are not legally at fault, is an action that will cause you to fail the road test immediately.
- id: 48
  category: alcohol_drugs_health
  question: If you already have a permit or license and are diagnosed with epilepsy, how long do you have to submit a physician's statement to the Driver Evaluation Unit?
  choices:
    A: Within 10 days of the diagnosis
    B: Within 30 days of the diagnosis
    C: Within 60 days of the diagnosis
    D: Before your next license renewal
  answer: B
  explanation: If you are diagnosed with epilepsy or a condition that could cause loss of consciousness, you must submit a physician’s statement within 30 days of the diagnosis.
- id: 49
  category: license_system
  question: If you are under 18 and driving with an instruction permit, who must supervise your driving?
  choices:
    A: Any licensed driver aged 18 or older
    B: A licensed driver aged 21 or older
    C: A parent or legal guardian only
    D: A certified driving instructor only
  answer: B
  explanation: If you are under 18 with an instruction permit, you must be supervised by a driver aged 21 or older sitting in the front passenger seat.
- id: 50
  category: license_system
  question: Under the Graduated Driver’s Licensing (GDL) system, how long must a driver who is 18 years old or younger hold an instruction permit before taking the road test?
  choices:
    A: At least 3 months
    B: At least 6 months
    C: At least 9 months
    D: At least 12 months
  answer: B
  explanation: Under the GDL system, if you are 18 years old or younger, you must hold an instruction permit for at least six months before taking the road test.
- id: 51
  category: license_system
  question: Which of the following is a restriction that applies to a provisional license?
  choices:
    A: You may not use or talk on a cell phone while driving, including with a hands-free device.
    B: You must always have a supervising driver in the front passenger seat.
    C: You are only allowed to drive during daylight hours.
    D: You cannot carry any passengers under the age of 21.
  answer: A
  explanation: On a provisional license, you may not use or talk on a cell phone while driving, including with a hands-free device.
- id: 52
  category: driver_testing
  question: What happens if you are unable to pass the safety equipment demonstration at the beginning of the road test?
  choices:
    A: You will lose 10 points on your driving score.
    B: You will be allowed to finish the test but must fix the equipment later.
    C: You will not be allowed to finish the road test that day.
    D: You must pay a $20 fee immediately to continue.
  answer: C
  explanation: If you are unable to pass the safety equipment demonstration, you will not be allowed to finish the road test that day.
- id: 53
  category: license_system
  question: How long is a Minnesota instruction permit valid for?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 4 years
  answer: C
  explanation: Your instruction permit is valid for two years of practice driving with a licensed supervising driver.
- id: 54
  category: driver_testing
  question: During the road test, the 90-degree backing skill maneuver simulates backing into a driveway or parking space that is how wide?
  choices:
    A: 8 feet wide
    B: 10 feet wide
    C: 12 feet wide
    D: 15 feet wide
  answer: B
  explanation: You will be evaluated on your ability to perform the 90-degree backing skill maneuver, which simulates backing into a 10-foot-wide driveway or parking space.
- id: 55
  category: driver_testing
  question: What is required if you fail the road test four times?
  choices:
    A: You must wait one full year before testing again.
    B: You must complete at least six hours of behind-the-wheel instruction with a licensed instructor.
    C: You must retake the written knowledge test.
    D: You must complete another 30 hours of classroom instruction.
  answer: B
  explanation: If you fail the road test four times, you must complete at least six hours of behind-the-wheel instruction with a licensed instructor before taking the test again.
- id: 56
  category: license_system
  question: If you are a foreign exchange student under 18, who is authorized to sign your application for an instruction permit?
  choices:
    A: Your host sponsors, regardless of legal guardianship.
    B: Your high school principal.
    C: Your parents, using notarized signatures on the application forms.
    D: The director of a transitional living program.
  answer: C
  explanation: If you are a foreign exchange student, your host sponsors cannot sign your application unless they have legal guardianship. You will need application forms with notarized signatures from your parents.
- id: 57
  category: driver_testing
  question: Who is allowed to ride in the vehicle with you as a passenger during your road test?
  choices:
    A: A licensed driving instructor
    B: A parent or legal guardian
    C: A language interpreter
    D: No passengers are allowed
  answer: D
  explanation: During the test, no passengers, including pets, children or interpreters, are allowed.
- id: 58
  category: license_system
  question: To qualify for an instruction permit at age 15, what driver education requirements must you meet?
  choices:
    A: You do not need any formal education if you pass the written test.
    B: Complete 30 hours of classroom instruction and be enrolled in behind-the-wheel instruction.
    C: Complete 50 hours of supervised driving with a parent.
    D: Complete 10 hours of behind-the-wheel instruction only.
  answer: B
  explanation: To qualify for an instruction permit at 15, you must complete 30 hours of classroom instruction and be enrolled in behind-the-wheel instruction (or be enrolled in a concurrent course and have completed the first 15 classroom hours).
- id: 59
  category: safe_driving_rules
  question: What is the restriction regarding cell phone use for a driver with a provisional license?
  choices:
    A: Allowed only with a hands-free device
    B: Allowed only for GPS navigation
    C: Not allowed at all, including with a hands-free device
    D: Allowed during daylight hours only
  answer: C
  explanation: The manual states that with a provisional license, you may not use or talk on a cell phone while driving, including with a hands-free device.
- id: 60
  category: license_system
  question: How many hours of supervised driving must a teen log to qualify for a provisional license if their parent or guardian does NOT complete a parent class?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: If not taking the parent class, the teen must submit a log showing at least 50 hours of supervised driving, including 15 nighttime hours.
- id: 61
  category: license_system
  question: 'During the first six months of holding a provisional license, driving is prohibited between midnight and 5 a.m. UNLESS the driver is:'
  choices:
    A: Accompanied by a licensed driver who is at least 21 years old
    B: Driving between home and work
    C: Driving with immediate family members under 20
    D: Driving a vehicle with a gross weight under 10,000 pounds
  answer: B
  explanation: Exceptions to the midnight to 5 a.m. restriction include driving between home and work, driving for employment, driving to a school event without provided transportation, or being accompanied by a licensed driver who is at least 25 years old.
- id: 62
  category: license_system
  question: What is the passenger limitation during the second six months of holding a provisional license?
  choices:
    A: Only one passenger under 20 is allowed
    B: No more than three passengers under 20 are allowed
    C: No passengers under 20 are allowed
    D: Only immediate family members are allowed
  answer: B
  explanation: During the second six months of a provisional license, you may have no more than three passengers under 20 unless accompanied by a parent or guardian.
- id: 63
  category: penalties_and_points
  question: Under Vanessa's Law, what happens if an unlicensed teenager is convicted of a crash-related moving violation?
  choices:
    A: They cannot get a license or permit until they are 18.
    B: They must pay a $1,000 fine and serve 30 days in jail.
    C: Their parents' driving privileges are suspended for six months.
    D: They must wait until age 21 to apply for a provisional license.
  answer: A
  explanation: Under Vanessa's Law, if you are convicted of a crash-related moving violation while driving without a license as a teenager, you cannot get a license, instruction permit or provisional license until you are 18.
- id: 64
  category: penalties_and_points
  question: If a provisional license holder loses driving privileges due to an alcohol-related violation, how long must they hold an instruction permit after turning 18 before applying for a new license?
  choices:
    A: One month
    B: Three months
    C: Six months
    D: Twelve months
  answer: B
  explanation: At age 18, a provisional license holder who lost privileges under Vanessa's Law must obtain an instruction permit and hold it for three months before applying for a new license.
- id: 65
  category: license_system
  question: What benefit do you receive when upgrading from a provisional license to an under 21 Class D license if you have no violations on your record?
  choices:
    A: A waiver for the road test
    B: A $3.50 credit toward the fee
    C: A free license upgrade
    D: An exemption from the written test
  answer: B
  explanation: If you upgrade from a provisional license with no violations on your record, you will receive a $3.50 credit toward the fee.
- id: 66
  category: license_system
  question: How far from the farmhouse may a 15-year-old drive alone with a restricted farm work driver's license?
  choices:
    A: Within 10 miles
    B: Within 20 miles
    C: Within 40 miles
    D: Within 150 miles
  answer: C
  explanation: With a restricted farm work driver's license, you may drive alone to perform farm work during daylight hours within 40 miles of the farmhouse.
- id: 67
  category: license_system
  question: Which of the following is a requirement to be issued a special medical driver's license at age 15?
  choices:
    A: You must have a parent who is a licensed medical professional.
    B: There must be no licensed drivers in the household.
    C: You must have held an instruction permit for at least one year.
    D: You must only drive within 40 miles of your home.
  answer: B
  explanation: You may be issued a special medical driver's license at age 15 when there are no licensed drivers in the household, to drive for personal or a relative's medical needs.
- id: 68
  category: vehicle_information
  question: Which of the following statements is true regarding electric-assist bicycles?
  choices:
    A: They require a motorized bicycle permit to operate.
    B: They are considered mopeds under Minnesota law.
    C: You must pass a road test to ride one.
    D: You do not need a test or a license to ride one, but must be at least 15 years old.
  answer: D
  explanation: An electric-assist bicycle is not considered a moped, and you do not need a test or a license to ride one. However, you must be at least 15 years old.
- id: 69
  category: license_system
  question: 'A standard Class D driver''s license allows you to drive single-unit vehicles with a gross vehicle weight up to:'
  choices:
    A: 10,000 pounds
    B: 15,000 pounds
    C: 26,000 pounds
    D: 30,000 pounds
  answer: C
  explanation: A Class D license allows you to drive single-unit vehicles with the exception of those with a gross vehicle weight of 26,001 pounds or more.
- id: 70
  category: license_system
  question: What is the maximum number of passengers (including the driver) a vehicle can be designed to carry for it to be operated with a standard Class D license?
  choices:
    A: 8 passengers
    B: 10 passengers
    C: 15 passengers
    D: 20 passengers
  answer: C
  explanation: A Class D license allows driving single-unit vehicles except those designed to carry more than 15 passengers (including the driver).
- id: 71
  category: license_system
  question: Under a Class D license, how far from the farm can a farmer drive a farm truck transporting agricultural products?
  choices:
    A: Within 40 miles
    B: Within 50 miles
    C: Within 100 miles
    D: Within 150 miles
  answer: D
  explanation: With a Class D license, you may drive any farm truck transporting agricultural products, farm machinery or farm supplies within 150 miles of the farm.
- id: 72
  category: license_system
  question: During the first six months of holding a provisional license, which passengers under age 20 are exempt from the one-passenger limit?
  choices:
    A: Classmates traveling to a school event
    B: Immediate family members
    C: Co-workers traveling to employment
    D: Any passenger with a valid driver's license
  answer: B
  explanation: 'The manual notes: ''You may have immediate family members under age 20 as passengers during both time periods'', exempting them from the strict passenger limitations.'
- id: 73
  category: license_system
  question: 'To get an under 21 Class D driver''s license if you are under 18, you must certify that you have driven for at least 10 hours under the supervision of a licensed driver who is at least:'
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: B
  explanation: If you are under 18, you must certify that you have driven for at least 10 hours under the supervision of a licensed driver who is at least 21 years old to get your under 21 Class D license.
- id: 74
  category: license_system
  question: 'You may tow a trailer with a gross vehicle weight of more than 10,000 pounds if the combined gross vehicle weight of your vehicle and the trailer is:'
  choices:
    A: 15,000 pounds or less.
    B: 20,000 pounds or less.
    C: 26,000 pounds or less.
    D: 30,000 pounds or less.
  answer: C
  explanation: According to the manual, you may tow a trailer with a gross vehicle weight of more than 10,000 pounds if the combined gross vehicle weight of the vehicle and trailer is 26,000 pounds or less.
- id: 75
  category: driver_testing
  question: Which of the following license endorsements requires you to pass a specialized road test?
  choices:
    A: Tank vehicles
    B: Hazardous materials
    C: Double and triple trailers
    D: School buses
  answer: D
  explanation: The manual states that you must pass specialized road tests to receive the bus, school bus, and motorcycle endorsements.
- id: 76
  category: license_system
  question: When operating a Class B power unit, what is the maximum gross vehicle weight of a vehicle you can tow?
  choices:
    A: 5,000 pounds
    B: 10,000 pounds
    C: 15,000 pounds
    D: 26,000 pounds
  answer: B
  explanation: A Class B license allows you to tow vehicles with a gross vehicle weight of 10,000 pounds or less when operating a Class B power unit.
- id: 77
  category: license_system
  question: Can a person under 21 years old obtain a Commercial Driver's License (CDL) in Minnesota?
  choices:
    A: No, you must be at least 21 to obtain any CDL.
    B: Yes, but the license will carry specific restrictions.
    C: Yes, and it carries the exact same privileges as an adult CDL.
    D: Yes, but only for driving school buses.
  answer: B
  explanation: You may obtain a CDL before you turn 21; however, the manual specifies that the license will carry specific restrictions.
- id: 78
  category: license_system
  question: How often must a Minnesota driver's license typically be renewed after you reach 21 years of age?
  choices:
    A: Every two years
    B: Every four years
    C: Every five years
    D: Every eight years
  answer: B
  explanation: A driver's license issued by the state of Minnesota typically expires on your birthday and must be renewed every four years after you reach 21 years old.
- id: 79
  category: driver_testing
  question: What type of test must you pass in order to renew your Minnesota driver's license?
  choices:
    A: A written knowledge test
    B: A specialized road test
    C: A vision test
    D: A hearing test
  answer: C
  explanation: The manual states that to renew your license, you must pass a vision test.
- id: 80
  category: license_system
  question: If you change your name or address before your license expires, within how many days must you apply for a duplicate license?
  choices:
    A: 10 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: If you change your name or address before your license expires, you must apply for a duplicate license within 30 days.
- id: 81
  category: license_system
  question: If you are in active military service, how long do you have to renew your Minnesota driver's license after you are separated or discharged?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: You must renew your license within one year of your separation or discharge from active military service by presenting your Minnesota driver's license and your DD-214 military discharge papers.
- id: 82
  category: license_system
  question: When applying for a Minnesota license or ID card, who is automatically registered with the U.S. Selective Service?
  choices:
    A: All U.S. citizens regardless of age
    B: U.S. citizens or residents between the ages of 18 and 26
    C: Only individuals applying for a Commercial Driver's License
    D: Anyone applying for an Enhanced ID card
  answer: B
  explanation: If you are a U.S. citizen or resident between the ages of 18 and 26, you will be registered with the U.S. Selective Service when you apply for any Minnesota license or ID card.
- id: 83
  category: license_system
  question: Can you hold both a valid Minnesota driver's license and a Minnesota state identification card at the same time?
  choices:
    A: Yes, as long as they are both REAL IDs.
    B: Yes, but only if you pay an additional fee.
    C: No, you must give up your driving privileges to be issued the identification card.
    D: No, unless you are an active military member.
  answer: C
  explanation: DVS will not issue an identification card to someone who already has a valid driver's license or instruction permit without a downgrade statement stating the person is giving up their driving privileges.
- id: 84
  category: license_system
  question: What is the additional fee to use the expedited (fast track) service for your driver's license or state ID card?
  choices:
    A: $10
    B: $15
    C: $20
    D: $30
  answer: C
  explanation: You can fast track your driver's license or state ID card for an additional fee of $20.
- id: 85
  category: license_system
  question: In which of the following situations are you NOT allowed to use the expedited (fast track) service for a driver's license?
  choices:
    A: When renewing a standard driver's license
    B: When applying for a duplicate license after an address change
    C: When applying for an enhanced driver's license
    D: When replacing a lost standard ID card
  answer: C
  explanation: You may not fast track your services when applying for the first time, for enhanced driver's licenses and ID cards, or when upgrading a license.
- id: 86
  category: vehicle_information
  question: How many separate brake systems must all cars and trucks have?
  choices:
    A: At least one
    B: At least two
    C: At least three
    D: At least four
  answer: B
  explanation: All cars and trucks must have at least two separate brake systems, like the foot brake and the parking/emergency brake.
- id: 87
  category: vehicle_information
  question: What are the bumper requirements for pickup trucks and vans in Minnesota?
  choices:
    A: They must have both front and rear bumpers.
    B: They must have front bumpers and either rear bumpers or reflectors.
    C: They only need a rear bumper.
    D: They are exempt from bumper requirements.
  answer: B
  explanation: Pickup trucks and vans must have front bumpers and either rear bumpers or reflectors.
- id: 88
  category: safe_driving_rules
  question: According to the Minnesota Driver's Manual, when is the appropriate time to use your vehicle's horn?
  choices:
    A: To announce your arrival at a destination
    B: To alert other drivers that a traffic light has turned green
    C: To avoid a crash
    D: To greet pedestrians or other drivers
  answer: C
  explanation: 'The manual states: "Use your horn to avoid a crash. Do not honk unnecessarily or to announce your arrival."'
- id: 89
  category: vehicle_information
  question: High beam headlights must make objects visible on the road at least how far ahead?
  choices:
    A: 200 feet
    B: 350 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: According to the manual, high beam headlights must make objects visible on the road at least 350 feet ahead.
- id: 90
  category: safe_driving_rules
  question: When are you required to turn on your headlights?
  choices:
    A: From sunset until sunrise
    B: Only when it is raining or snowing
    C: From 30 minutes after sunset until 30 minutes before sunrise
    D: Only when driving on unlit rural roads
  answer: A
  explanation: The manual states to turn on your headlights at sunset and keep them on until sunrise, as well as during adverse weather or anytime you cannot see 500 feet ahead.
- id: 91
  category: vehicle_information
  question: Dirty headlights can reduce light output by up to what percentage?
  choices:
    A: 25 percent
    B: 50 percent
    C: 75 percent
    D: 90 percent
  answer: C
  explanation: You should clean your headlights as often as you clean your windshield; dirty headlights can reduce light output by up to 75 percent.
- id: 92
  category: vehicle_information
  question: Which of the following vehicles are permitted to use blue lights?
  choices:
    A: Tow trucks and service vehicles
    B: School buses and rural mail carriers
    C: Snowplows, road maintenance equipment, and authorized emergency vehicles
    D: Farm equipment and moving trucks
  answer: C
  explanation: 'Only certain vehicles can use blue lights: snowplows, road maintenance equipment, and authorized emergency vehicles.'
- id: 93
  category: vehicle_information
  question: Where should you look to find your vehicle's recommended tire pressure?
  choices:
    A: On the tire's sidewall
    B: On a sticker inside the driver's door or in the owner's manual
    C: On the vehicle's dashboard display
    D: On the fuel door
  answer: B
  explanation: You should find your vehicle's recommended tire pressure on a sticker inside the driver's door or in the owner's manual, not the PSI on the tire's sidewall.
- id: 94
  category: vehicle_information
  question: 'A tire is considered illegal if the tread is less than:'
  choices:
    A: One-eighth inch deep
    B: One-sixteenth inch deep
    C: One-quarter inch deep
    D: One-half inch deep
  answer: B
  explanation: Check your tires often for wear and damage. A tire is illegal if the tread is less than one-sixteenth inch deep.
- id: 95
  category: vehicle_information
  question: For most passenger vehicles, applied window tint must transmit at least what percentage of available light?
  choices:
    A: 20 percent
    B: 35 percent
    C: 50 percent
    D: 75 percent
  answer: C
  explanation: If window tint transmits less than 50 percent of available light, it can only be used on specific windows of certain vehicles like pickup trucks, vans, or limousines.
- id: 96
  category: safe_driving_rules
  question: 'You must drive on the right side of the road EXCEPT when:'
  choices:
    A: Approaching a railroad crossing
    B: The road has three marked lanes
    C: Driving on a two-lane highway
    D: Approaching a hilltop or curve
  answer: B
  explanation: On all wide roads, you must drive on the right side except in certain situations, such as when passing, when the road is closed, when the road is one-way, or when the road has three marked lanes.
- id: 97
  category: safe_driving_rules
  question: On two-lane highways with a speed limit of 55 mph or higher, you may increase your speed by how much when lawfully passing another vehicle?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: You may not increase your speed
  answer: B
  explanation: On two-lane highways with a speed limit of 55 mph or higher, you can increase your speed by 10 mph when lawfully passing another vehicle.
- id: 98
  category: safe_driving_rules
  question: What happens if you approach an intersection at an unlawful speed?
  choices:
    A: You must yield to all vehicles on your left
    B: You lose the right-of-way privilege associated with driving at a lawful speed
    C: You must come to a complete stop before proceeding
    D: You are automatically at fault if a crash occurs
  answer: B
  explanation: If you approach an intersection at an unlawful speed, you lose the right-of-way privilege associated with driving at a lawful speed.
- id: 99
  category: safe_driving_rules
  question: Unless otherwise indicated by signs, what is the speed limit in alleys under ideal conditions?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 30 mph
  answer: A
  explanation: Under ideal conditions, the speed limit is 10 mph in alleys unless otherwise indicated by signs.
- id: 100
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit on urban or town roads?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: Under ideal conditions, the speed limit is 30 mph on urban or town roads unless otherwise indicated by signs.
- id: 101
  category: penalties_and_points
  question: 'If you are caught driving over 100 mph, your driving privileges will be revoked for at least:'
  choices:
    A: 30 days
    B: 90 days
    C: Six months
    D: One year
  answer: C
  explanation: If you drive over 100 mph, your driving privileges will be revoked for at least six months.
- id: 102
  category: penalties_and_points
  question: What is the penalty for speeding when passing a stopped emergency vehicle with flashing lights?
  choices:
    A: A warning for the first offense
    B: A surcharge of at least $25 added to the speeding fine
    C: Immediate license suspension
    D: A mandatory court appearance
  answer: B
  explanation: You must slow down when you approach or pass a stopped emergency vehicle with flashing emergency lights. A surcharge of at least $25 is added to the speeding fine if you break this law.
- id: 103
  category: penalties_and_points
  question: What is the minimum surcharge added to a speeding fine if you speed past a stopped emergency vehicle with flashing emergency lights?
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: A surcharge of at least $25 is added to the speeding fine if you break this law by speeding past a stopped emergency vehicle with flashing emergency lights.
- id: 104
  category: safe_driving_rules
  question: How far in advance must you activate your turn signal before making a turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 150 feet
    D: At least 200 feet
  answer: B
  explanation: Activate your signal at least 100 feet before turning. Keep signaling until you have completed the turn or lane change.
- id: 105
  category: vehicle_information
  question: When is it illegal to use hand and arm signals instead of your vehicle's turn signals?
  choices:
    A: During daylight hours
    B: When driving a commercial vehicle
    C: At night
    D: When changing lanes on a freeway
  answer: C
  explanation: Do not use hand signals at night or when driving a vehicle that blocks other drivers from seeing your hand signals.
- id: 106
  category: defensive_driving
  question: While waiting to make a turn, why should you keep your wheels straight and your foot on the brake?
  choices:
    A: It prevents your tires from wearing out unevenly.
    B: It activates your anti-lock braking system.
    C: It allows you to accelerate faster when the light turns green.
    D: You are less likely to be pushed into oncoming traffic if struck from behind.
  answer: D
  explanation: While waiting to turn, keep your wheels straight and your foot on the brake. If your vehicle is struck from behind, you are less likely to be pushed into oncoming traffic.
- id: 107
  category: safe_driving_rules
  question: Under what condition are you permitted to make a left turn while the traffic light is red?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: When turning from a one-way street onto another one-way street.
    C: When turning from a one-way street onto a two-way street.
    D: Left turns on a red light are never permitted.
  answer: B
  explanation: You can make a left turn from a one-way street onto another one-way street while the traffic light is red in certain situations, after coming to a complete stop and ensuring the intersection is clear.
- id: 108
  category: sharing_the_road
  question: What should you do if an emergency vehicle approaches while you are driving inside a roundabout?
  choices:
    A: Stop immediately inside the roundabout and wait for it to pass.
    B: Pull over to the inside island of the roundabout.
    C: Exit the roundabout immediately and then pull over.
    D: Speed up to exit the roundabout before the emergency vehicle enters.
  answer: C
  explanation: If an emergency vehicle approaches, exit the roundabout immediately and then pull over. Do not stop within the roundabout.
- id: 109
  category: safe_driving_rules
  question: U-turns are illegal near the tops of hills and on curves where other drivers cannot see you from what distance?
  choices:
    A: 500 feet
    B: 750 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: They are also illegal near the tops of hills and on curves where other drivers cannot see you from 1,000 feet away.
- id: 110
  category: safe_driving_rules
  question: What is the first maneuver a driver on a side street must make when crossing a divided highway at a J-turn?
  choices:
    A: A left turn into the median
    B: A U-turn in the through lane
    C: A right turn onto the highway
    D: Proceeding straight across all lanes
  answer: C
  explanation: At a J-turn, drivers on the side street approaching the divided highway always make a right turn. To cross the highway or make a left turn, they must first turn right onto the highway, then enter the left-turn lane to complete a U-turn.
- id: 111
  category: safe_driving_rules
  question: On a highway with more than one lane in the same direction, when are you allowed to drive in the left-most lane?
  choices:
    A: When you are driving the exact speed limit.
    B: When overtaking and passing another vehicle in the same direction.
    C: When you are driving a commercial vehicle.
    D: When you want to avoid merging traffic from on-ramps.
  answer: B
  explanation: On highways with more than one lane in the same direction, drive in the right-hand lane when available. Exceptions to this rule include when overtaking and passing another vehicle in the same direction.
- id: 112
  category: defensive_driving
  question: Which of the following can create temporary blind spots while driving?
  choices:
    A: The position of your roof pillars
    B: Dirty windshields and glaring lights
    C: Properly adjusted side mirrors
    D: Driving a vehicle longer than 40 feet
  answer: B
  explanation: The design of your vehicle and the position of the roof pillars determine the location of your blind spots. Dirty windshields and glaring lights can also create temporary blind spots.
- id: 113
  category: sharing_the_road
  question: In a multi-lane roundabout, if two large vehicles approach and drive through at the same time, who must yield?
  choices:
    A: The vehicle on the right must yield to the vehicle on the left.
    B: The vehicle on the left must yield to the vehicle on the right.
    C: The vehicle traveling faster must yield.
    D: The vehicle that entered the roundabout first must yield.
  answer: A
  explanation: In multi-lane roundabouts, if two large vehicles approach and drive through at the same time, the driver on the right must yield to the vehicle on the left, reducing speed or stopping if necessary.
- id: 114
  category: defensive_driving
  question: Why do you need to slow down when driving on gravel or dirt roads?
  choices:
    A: Because it takes longer to stop and is easier to skid when turning.
    B: Because your tires will lose air pressure more quickly.
    C: Because it is illegal to drive over 30 mph on unpaved roads.
    D: Because your vehicle's blind spots become larger.
  answer: A
  explanation: On gravel or dirt roads, you need to slow down because it takes longer to stop and is easier to skid when turning.
- id: 115
  category: safe_driving_rules
  question: Where is it always illegal to make a U-turn?
  choices:
    A: On a roadway with two or more lanes in the same direction
    B: On interstate freeways
    C: At any intersection with a traffic light
    D: On a divided highway with a median opening
  answer: B
  explanation: You must not make U-turns on interstate freeways.
- id: 116
  category: safe_driving_rules
  question: In what direction must you drive when entering a roundabout?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: Straight through the center island
    D: In the direction of the innermost lane
  answer: B
  explanation: 'When entering a roundabout: Drive counterclockwise until you reach your exit.'
- id: 117
  category: defensive_driving
  question: Why should you turn your head to check the lane you are moving into rather than relying solely on your mirrors?
  choices:
    A: Mirrors distort the speed of approaching vehicles.
    B: You may miss vehicles in your blind spots.
    C: Mirrors are only required for backing up.
    D: Turning your head activates the vehicle's blind spot monitoring system.
  answer: B
  explanation: Turn your head to check the lane you are moving into for vehicles. Don’t rely solely on mirrors; you may miss vehicles in your blind spots.
- id: 118
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to return to the right lane?
  choices:
    A: When you are 50 feet ahead of the passed vehicle
    B: When you can see the entire vehicle you just passed in your rearview mirror
    C: As soon as your rear bumper clears the front of the passed vehicle
    D: When the driver you passed flashes their headlights
  answer: B
  explanation: The manual states that you should return to the right lane when you can see the entire vehicle you have just passed in your rearview mirror.
- id: 119
  category: safe_driving_rules
  question: When passing on a two-lane road, you must return to the right side of the road before coming within what distance of an oncoming vehicle?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: You must return to the right side of the road before coming within 100 feet of an oncoming vehicle.
- id: 120
  category: safe_driving_rules
  question: 'You should not pass another vehicle on a curve or hill where you cannot clearly see the road ahead for at least:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 700 feet
    D: 1000 feet
  answer: C
  explanation: Do not pass on a curve or hill where you cannot clearly see the road ahead for at least 700 feet.
- id: 121
  category: safe_driving_rules
  question: Under which of the following conditions is it legal to pass another vehicle on the right?
  choices:
    A: When the vehicle ahead is making a left turn and there is a paved shoulder
    B: By driving in a bicycle lane if it is clear of cyclists
    C: When the vehicle you are overtaking is making or about to make a left turn
    D: By driving off the pavement or main part of the road
  answer: C
  explanation: A driver may pass on the right when the vehicle being overtaken is making or about to make a left turn. You must not pass by driving in a bicycle lane, on the shoulder, or off the pavement.
- id: 122
  category: vehicle_information
  question: What is the proper procedure for looking behind you while backing up your vehicle?
  choices:
    A: Rely solely on your back-up camera
    B: Rely solely on your rearview and side mirrors
    C: Continue looking out the rear window while backing up
    D: Open the driver's side door to look behind you
  answer: C
  explanation: Before and during backing up, you should continue looking out the rear window. The manual explicitly states not to rely solely on your mirrors or back-up camera.
- id: 123
  category: safe_driving_rules
  question: When parallel parking, your vehicle's wheels closest to the side of the road should be no more than how far from the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: When you parallel park, your vehicle’s wheels closest to the side of the road should be no more than 12 inches from the curb.
- id: 124
  category: safe_driving_rules
  question: Parking is not allowed within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: A
  explanation: Parking is not allowed within 10 feet of a fire hydrant.
- id: 125
  category: safe_driving_rules
  question: You are not allowed to park within how many feet of the nearest rail of a railroad crossing?
  choices:
    A: 20 feet
    B: 30 feet
    C: 50 feet
    D: 100 feet
  answer: C
  explanation: Parking is not allowed within 50 feet of the nearest rail of a railroad crossing.
- id: 126
  category: safe_driving_rules
  question: How should you turn your steering wheel when parking uphill on a road with a curb?
  choices:
    A: Turn the wheels toward the curb
    B: Turn the wheels away from the curb
    C: Keep the wheels straight
    D: Turn the wheels toward the shoulder of the road
  answer: B
  explanation: When the front of a parked vehicle points uphill, and there is a curb, wheels should be turned away from the curb.
- id: 127
  category: safe_driving_rules
  question: 'If you park on a highway at night, your vehicle must have at least one white or amber front light and one red taillight illuminated. These lights must be visible from at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: If you park on the highway at night, both the front white/amber light and the red taillight must be visible from at least 500 feet.
- id: 128
  category: penalties_and_points
  question: Which of the following is true regarding seat belt laws in Minnesota?
  choices:
    A: Law enforcement can stop motorists solely for seat belt violations.
    B: Passengers in the back seat are not required to wear seat belts.
    C: Seat belts are optional if the vehicle is traveling under 25 mph.
    D: Only the driver is required to wear a seat belt.
  answer: A
  explanation: In Minnesota, all vehicles must have seat belts, everyone must use them (including back seat passengers), and law enforcement can stop motorists solely for seat belt violations.
- id: 129
  category: safe_driving_rules
  question: 'You are legally exempt from wearing a seat belt if you are:'
  choices:
    A: Driving a passenger vehicle in reverse.
    B: Driving a vehicle made after January 1, 1965.
    C: Driving a pickup truck on a state highway.
    D: A passenger in the back seat of a vehicle.
  answer: A
  explanation: You are not legally required to wear a seat belt if you are driving a passenger vehicle in reverse.
- id: 130
  category: driver_responsibility
  question: How should a lap belt be properly adjusted on your body?
  choices:
    A: Loosely across the soft part of your stomach
    B: Snugly across your abdomen
    C: Snugly across your hipbones or upper thighs
    D: High across your ribcage
  answer: C
  explanation: Adjust the lap belt to fit snugly across your hipbones or upper thighs. It should never be positioned across your abdomen or the soft part of your stomach.
- id: 131
  category: driver_responsibility
  question: According to Minnesota law, children under what age must ride in a rear-facing car seat until they reach the weight or height limit of the seat?
  choices:
    A: 1 year of age
    B: 2 years of age
    C: 4 years of age
    D: 8 years of age
  answer: B
  explanation: Children under 2 years of age must ride in a rear-facing car seat until they reach the weight or height limit of the car seat.
- id: 132
  category: safe_driving_rules
  question: When is a child required to use a booster seat secured with a safety belt?
  choices:
    A: From birth to 2 years old
    B: From 2 to 4 years old
    C: From 4 to 9 years old
    D: From 9 to 12 years old
  answer: C
  explanation: According to the manual, a child from 4 to 9 years old must use a booster seat and be secured with a safety belt if they are too tall or too heavy for the car seat.
- id: 133
  category: vehicle_information
  question: If a child restraint system does not have a specific expiration date stamped on it, when does it expire?
  choices:
    A: Four years from the date of purchase
    B: Six years from the date of manufacture
    C: Eight years from the date of manufacture
    D: Ten years from the date of purchase
  answer: B
  explanation: The manual states that child restraint systems expire six years from the date of manufacture. If no date is listed, you should follow the six-year recommendation.
- id: 134
  category: safe_driving_rules
  question: To ensure safety when driving a vehicle equipped with airbags, which steering wheel hand position should you avoid?
  choices:
    A: 8 and 4 o'clock
    B: 9 and 3 o'clock
    C: 10 and 2 o'clock
    D: 7 and 5 o'clock
  answer: C
  explanation: The manual suggests keeping your hands at the 8 and 4 o'clock or 9 and 3 o'clock positions and avoiding the 10 and 2 o'clock position.
- id: 135
  category: driver_responsibility
  question: If you are involved in a traffic crash and do not have your insurance information with you, how long do you have to provide it to law enforcement?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 7 days
  answer: C
  explanation: If asked for insurance information by the investigating officer and you do not have it with you, you must provide it within 72 hours.
- id: 136
  category: penalties_and_points
  question: What is the maximum fine you may face if convicted of operating an uninsured vehicle?
  choices:
    A: $275
    B: $500
    C: $1,000
    D: $2,000
  answer: C
  explanation: If convicted of operating an uninsured vehicle, you may be fined up to $1,000 and sentenced to up to 90 days in jail.
- id: 137
  category: vehicle_information
  question: Which type of insurance coverage is optional for motorcycle drivers in Minnesota?
  choices:
    A: Liability insurance for property damage
    B: Liability insurance for injuries to other people
    C: No-fault and uninsured driver insurance
    D: None of the above
  answer: C
  explanation: Motorcycle drivers must have liability insurance, but no-fault and uninsured driver insurance coverage is optional.
- id: 138
  category: license_system
  question: How many days do you have to register your vehicle in Minnesota after becoming a resident?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: You have up to 60 days after becoming a resident to register your vehicle in Minnesota with DVS.
- id: 139
  category: safe_driving_rules
  question: Under what circumstance is it legal to use a cell phone to read or send an electronic message while driving?
  choices:
    A: When stopped at a red traffic light
    B: When using the device in voice-activated or hands-free mode
    C: When driving on a rural highway with no traffic
    D: When reading a message from a family member
  answer: B
  explanation: Exceptions to the ban on composing, reading, or sending electronic messages while driving include using the device in voice-activated or hands-free mode, getting emergency assistance, or reporting a crash or crime.
- id: 140
  category: penalties_and_points
  question: What is the penalty for a second or subsequent conviction of using a wireless communication device to compose, read, or send messages while driving?
  choices:
    A: A $275 fine in addition to the court-specified fine
    B: A $500 fine and loss of driving privileges
    C: A $1,000 fine and up to 90 days in jail
    D: A $30 reinstatement fee
  answer: A
  explanation: If convicted of two or more violations of using a wireless communication device to compose, read or send messages while driving, you will be required to pay a $275 fine in addition to the court-specified fine.
- id: 141
  category: sharing_the_road
  question: What must you do before entering a road from an alley, private driveway, or parking lot?
  choices:
    A: Yield only if other vehicles are approaching
    B: Come to a complete stop before crossing a sidewalk or crosswalk
    C: Slow down to 10 mph and proceed with caution
    D: Sound your horn to warn pedestrians
  answer: B
  explanation: You must come to a complete stop before entering a road from an alley, private driveway, parking lot or parking ramp, and always stop before crossing a sidewalk or crosswalk.
- id: 142
  category: signs_and_signals
  question: How far in advance will a school bus driver activate flashing yellow lights in a speed zone of more than 35 mph?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: D
  explanation: Bus drivers will activate flashing yellow lights at least 300 feet before stopping in a speed zone of more than 35 mph.
- id: 143
  category: sharing_the_road
  question: When a school bus is stopped with its red lights flashing and stop arm extended, how far away must you stop your vehicle?
  choices:
    A: At least 10 feet
    B: At least 20 feet
    C: At least 30 feet
    D: At least 50 feet
  answer: B
  explanation: When you see a school bus that is stopped with its red lights flashing and its stop arm extended, you must stop your vehicle at least 20 feet from the bus.
- id: 144
  category: sharing_the_road
  question: When are you NOT required to stop for a school bus with its red lights flashing?
  choices:
    A: When you are driving on a divided roadway and the bus is on the opposite side of the divider
    B: When you are running late for an emergency
    C: When the bus is stopped at a railroad crossing
    D: When you are approaching the bus from the front on a two-lane road
  answer: A
  explanation: If you are driving on a divided roadway, you do not need to stop for a school bus with red lights flashing if it is on the opposite side of the divider.
- id: 145
  category: driver_responsibility
  question: What should you do if you are involved in a crash that only results in property damage?
  choices:
    A: You must call 911 immediately.
    B: You must notify law enforcement within 72 hours.
    C: You do not need to notify law enforcement, but you must inform the property owner if you damage property other than a vehicle.
    D: You must leave a note on the damaged vehicle and drive away.
  answer: C
  explanation: If the crash only results in property damage, you do not need to notify law enforcement. If you damage property other than a vehicle, inform the property owner.
- id: 146
  category: sharing_the_road
  question: When driving on a divided roadway, are you required to stop for a school bus with its red lights flashing if it is on the opposite side of the divider?
  choices:
    A: Yes, you must always stop for a school bus.
    B: No, you do not need to stop if it is on the opposite side of the divider.
    C: Yes, unless you are driving in the rightmost lane.
    D: No, but you must slow down to 10 mph.
  answer: B
  explanation: According to the manual, if you are driving on a divided roadway, you do not need to stop for a school bus with red lights flashing if it is on the opposite side of the divider.
- id: 147
  category: penalties_and_points
  question: If your vehicle is used to violate the school bus stop arm law and you are the owner, what penalty may you face if you cannot prove someone else was driving?
  choices:
    A: A felony
    B: A gross misdemeanor
    C: A petty misdemeanor
    D: A warning
  answer: C
  explanation: The manual states that when your vehicle is used to violate the school bus stop arm law, you are guilty of a petty misdemeanor if you own or lease the vehicle.
- id: 148
  category: penalties_and_points
  question: What is the penalty for a second violation within a year of driving through a line of children crossing the road?
  choices:
    A: A petty misdemeanor
    B: A misdemeanor
    C: A gross misdemeanor
    D: A felony
  answer: C
  explanation: Violating the law by driving through a line of children crossing the road is a misdemeanor, and a second violation within a year is a gross misdemeanor.
- id: 149
  category: safe_driving_rules
  question: When you reach an intersection without traffic lights or signals at the same time as another driver, who has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver going the fastest
    D: The driver turning left
  answer: B
  explanation: At intersections without traffic lights or signals, when you reach the intersection at the same time as another driver, the driver on the left must yield to the one on the right.
- id: 150
  category: safe_driving_rules
  question: When approaching an uncontrolled "T" intersection, who must yield the right-of-way?
  choices:
    A: The driver traveling on the through road
    B: The driver who is turning
    C: The driver on the right
    D: The driver on the left
  answer: B
  explanation: When you approach an uncontrolled "T" intersection, you must yield to all cross traffic if you are the one turning.
- id: 151
  category: sharing_the_road
  question: When driving in the right lane, what must you do when a transit or metro mobility bus is trying to merge from a bus stop or shoulder?
  choices:
    A: Honk your horn and maintain your speed
    B: Move to the left lane immediately
    C: Yield to the merging bus
    D: Speed up to pass the bus before it merges
  answer: C
  explanation: When driving in the right lane, you must yield to transit and metro mobility buses merging from a bus stop or shoulder.
- id: 152
  category: safe_driving_rules
  question: How should you react when an emergency vehicle with flashing red lights and a siren approaches you on a one-way road?
  choices:
    A: Pull to the right and stop
    B: Pull to the nearest side and stop
    C: Stop immediately in your current lane
    D: Speed up to get out of the way
  answer: B
  explanation: On a one-way road, when an emergency vehicle approaches with flashing red lights and sounding a siren, you must pull to the nearest side and stop.
- id: 153
  category: safe_driving_rules
  question: If you are in an intersection when an emergency vehicle approaches with its lights and siren on, what should you do?
  choices:
    A: Stop immediately in the middle of the intersection
    B: Reverse out of the intersection
    C: Proceed through the intersection before stopping
    D: Turn left immediately
  answer: C
  explanation: If you are in an intersection when an emergency vehicle approaches, you must proceed through it before stopping.
- id: 154
  category: sharing_the_road
  question: Under the "Move Over Law," what must you do when approaching a parked emergency vehicle with flashing lights on a road with two lanes in the same direction?
  choices:
    A: Move to the lane farthest away from the vehicle if it is safe to do so
    B: Stop next to the vehicle to ask if they need help
    C: Maintain your lane and speed
    D: Honk your horn to alert the emergency workers
  answer: A
  explanation: The "Move Over Law" requires you to move to the lane farthest away from the vehicle if it is safe to do so when an emergency vehicle with flashing lights is stopped on or next to a road with two lanes in the same direction.
- id: 155
  category: safe_driving_rules
  question: Unless you are on official emergency business, what is the minimum distance you are allowed to follow a firefighting vehicle on an emergency run?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Only vehicles on official emergency business are allowed to follow within 500 feet of a firefighting vehicle on an emergency run.
- id: 156
  category: driver_responsibility
  question: Which of the following best describes "reckless driving" according to the Minnesota driver's manual?
  choices:
    A: Driving a vehicle while knowingly disregarding a substantial and unjustifiable risk that may harm others
    B: Stopping a vehicle in a way that endangers property
    C: Driving 5 mph over the posted speed limit
    D: Failing to use a turn signal when changing lanes
  answer: A
  explanation: Reckless driving means driving a vehicle while knowingly disregarding a substantial and unjustifiable risk that may harm others or their property, including racing.
- id: 157
  category: safe_driving_rules
  question: If you are stopped by a law enforcement officer after dark, what action should you take inside your vehicle?
  choices:
    A: Turn off your headlights
    B: Turn on your vehicle's interior light
    C: Turn on your hazard lights
    D: Roll down all the windows
  answer: B
  explanation: When stopped by law enforcement after dark, you should turn on your vehicle's interior light.
- id: 158
  category: safe_driving_rules
  question: When a law enforcement officer asks to see your identification and proof of insurance, what should you do if the documents are out of reach?
  choices:
    A: Quickly reach for them before the officer approaches
    B: Tell the officer where they are located before reaching for them
    C: Step out of the vehicle to retrieve them from the trunk
    D: Refuse to provide them until a supervisor arrives
  answer: B
  explanation: If the documents are out of reach, tell the officer where they are located before reaching for them.
- id: 159
  category: driver_responsibility
  question: If you have a firearm in the vehicle and are stopped by law enforcement, what is the correct procedure when the officer first approaches?
  choices:
    A: Hand the firearm to the officer immediately
    B: Hide the firearm under the seat
    C: Inform the officer that you have a firearm and where it is located
    D: Step out of the vehicle and declare you are armed
  answer: C
  explanation: When the officer first approaches, inform them that you have a firearm and where it is located, while keeping your hands on the steering wheel.
- id: 160
  category: sharing_the_road
  question: How should you react when you encounter a funeral procession that identifies itself with headlights or hazard warning lights?
  choices:
    A: Yield to the lead vehicle only
    B: Pass the procession on the right
    C: Yield to the entire procession
    D: Merge into the procession to keep traffic moving
  answer: C
  explanation: When a funeral procession identifies itself with headlights or hazard warning lights, you must yield to the entire procession.
- id: 161
  category: safe_driving_rules
  question: What should you do if you need to reach for an item inside your vehicle during a traffic stop?
  choices:
    A: Reach for it quickly so the officer doesn't have to wait.
    B: Tell the officer what you need to locate and wait for verbal permission.
    C: Step out of the vehicle to retrieve the item.
    D: Hand the officer your registration before reaching for anything else.
  answer: B
  explanation: The manual states that if you need to reach for an item, you should tell the officer what you need to locate and wait for verbal permission before doing so.
- id: 162
  category: driver_responsibility
  question: 'When you accept a citation during a traffic stop, you are:'
  choices:
    A: Admitting guilt to the violation.
    B: Pleading no contest to the charges.
    C: Acknowledging receipt of the citation and promising to appear in court if required.
    D: Waiving your right to a hearing.
  answer: C
  explanation: According to the manual, you are not admitting guilt or responsibility by accepting a citation; you are acknowledging receipt of the citation and promising to appear in court if required.
- id: 163
  category: penalties_and_points
  question: 'Fleeing a police officer in a motor vehicle is classified as a:'
  choices:
    A: Petty misdemeanor
    B: Misdemeanor
    C: Gross misdemeanor
    D: Felony
  answer: D
  explanation: The manual explicitly states that fleeing a police officer in a motor vehicle is illegal and dangerous, and violating this law is a felony.
- id: 164
  category: penalties_and_points
  question: 'If someone is killed while a driver is fleeing a police officer, the driver may be sentenced to up to:'
  choices:
    A: 3 years in prison and a $5,000 fine.
    B: 5 years in prison and a $10,000 fine.
    C: 7 years in prison and a $14,000 fine.
    D: 10 years in prison and a $20,000 fine.
  answer: D
  explanation: If a death occurs while fleeing a police officer, you may be sentenced to up to 10 years in prison, fined up to $20,000, or both.
- id: 165
  category: sharing_the_road
  question: What should you NOT do when encountering a blind pedestrian with a white cane or guide dog?
  choices:
    A: Stop and wait for them to pass your lane.
    B: Yield the right-of-way.
    C: Use your horn or rev your engine.
    D: Stay alert and cautious.
  answer: C
  explanation: 'The manual advises to watch for blind pedestrians and states: "Do not use your horn or rev your engine as it may distract them."'
- id: 166
  category: safe_driving_rules
  question: 'If another vehicle has stopped for a pedestrian in a crosswalk, you must:'
  choices:
    A: Pass them on the right side.
    B: Honk to warn the pedestrian.
    C: Not pass the stopped vehicle.
    D: Pass them slowly on the left side.
  answer: C
  explanation: It is illegal to pass a vehicle that has stopped for a pedestrian. You must look for pedestrians in the crosswalk and be prepared to stop.
- id: 167
  category: safe_driving_rules
  question: 'If walking on a road without sidewalks is necessary, pedestrians should:'
  choices:
    A: Walk on the right side with traffic.
    B: Walk on the left side or face oncoming traffic.
    C: Walk in the center of the lane.
    D: Walk in a zigzag pattern to remain visible.
  answer: B
  explanation: The manual states that if walking on the road is necessary, pedestrians should stay on the left side or face oncoming traffic.
- id: 168
  category: sharing_the_road
  question: 'When passing a bicyclist, you must keep a minimum distance of:'
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: Use caution when passing a bicyclist. You must keep at least 3 feet between the side of your car and the bicyclist.
- id: 169
  category: safe_driving_rules
  question: When is it legal to cross the center of the roadway in a no passing zone to pass a bicyclist?
  choices:
    A: Never.
    B: Only during daylight hours.
    C: When it is safe to do so.
    D: Only if the bicyclist signals you to pass.
  answer: C
  explanation: You are allowed to cross the center of the roadway to pass a bicyclist, even in a no passing zone, when it is safe to do so.
- id: 170
  category: sharing_the_road
  question: Under Minnesota law, how may a bicyclist treat a stop sign if no vehicle is nearby?
  choices:
    A: They must come to a complete stop for 3 seconds.
    B: They must dismount and walk the bike through the intersection.
    C: They may slow to a speed that allows stopping, and turn or proceed without stopping.
    D: They must wait for a green light.
  answer: C
  explanation: At stop signs, bicyclists must slow to a speed that allows stopping before entering the intersection or crosswalk. If no vehicle is nearby, they may turn or proceed without stopping.
- id: 171
  category: signs_and_signals
  question: How can a bicyclist signal a right turn using hand signals?
  choices:
    A: Holding the left arm straight out.
    B: Holding the left arm out and bending it toward the ground.
    C: Holding the left arm out and bending it upward.
    D: Pointing straight ahead with the right arm.
  answer: C
  explanation: A bicyclist can signal a right turn by holding their left arm out and bending it upward, or by holding their right arm straight out.
- id: 172
  category: sharing_the_road
  question: 'When riding a bicycle on a sidewalk or crosswalk, the bicyclist must:'
  choices:
    A: Yield the right of way to pedestrians and give an audible signal before passing.
    B: Ride as fast as possible to clear the area quickly.
    C: Force pedestrians to step off the sidewalk.
    D: Only ride in the opposite direction of traffic.
  answer: A
  explanation: When riding on sidewalks and crosswalks, bicyclists must yield the right of way to pedestrians and give an audible signal before passing them.
- id: 173
  category: sharing_the_road
  question: 'A bicyclist may proceed through an intersection with a red light if the signal fails to detect them, there is no immediate hazard, and:'
  choices:
    A: They have waited at least 10 seconds.
    B: The bicycle has come to a complete stop and waited an unreasonable amount of time.
    C: They honk their horn first.
    D: They are riding in a group of three or more.
  answer: B
  explanation: A bicyclist can proceed through a red light if the bicycle has come to a complete stop, the signal shows red for an unreasonable time or fails to detect the bicycle, and no approaching vehicles pose an immediate hazard.
- id: 174
  category: vehicle_information
  question: 'A motorized bicycle (moped) is defined by a speed capacity of:'
  choices:
    A: 20 mph or less
    B: 30 mph or less
    C: 40 mph or less
    D: 50 mph or less
  answer: B
  explanation: A "motorized bicycle" is a moped and is defined by its speed capacity, which is 30 mph or less.
- id: 175
  category: safe_driving_rules
  question: Where are motorized bicycles (mopeds) NOT allowed to operate?
  choices:
    A: On city streets
    B: On rural roads
    C: On sidewalks, freeways, or pedestrian/bicycle trails
    D: In designated motorcycle parking areas
  answer: C
  explanation: Motorized bicycles are not allowed on sidewalks, freeways, or lanes and trails designated for pedestrians and bicycles.
- id: 176
  category: sharing_the_road
  question: What should your following distance be when driving behind a motorcycle compared to another vehicle?
  choices:
    A: Less than your following distance from other vehicles.
    B: The same as, or greater than, your following distance from other vehicles.
    C: Exactly twice the distance you would leave for a commercial vehicle.
    D: At least 100 feet at all times.
  answer: B
  explanation: The manual states that your following distance from a motorcycle should be the same as, or greater than, your following distance from other vehicles to allow maneuvering room if the rider experiences difficulty.
- id: 177
  category: sharing_the_road
  question: Where do the most common motorcycle-car collisions occur?
  choices:
    A: On rural highways.
    B: At urban intersections.
    C: In high-occupancy vehicle lanes.
    D: On freeway on-ramps.
  answer: B
  explanation: According to the manual, crashes at urban intersections are the most common motorcycle-car collisions, often occurring when drivers fail to yield right of way and make a left turn in front of an oncoming motorcycle.
- id: 178
  category: safe_driving_rules
  question: On what types of streets are Neighborhood Electric Vehicles (NEVs) allowed to be driven?
  choices:
    A: Only on streets with speed limits of 25 mph or less.
    B: Only on streets with speed limits of 35 mph or less.
    C: Any street except freeways.
    D: Only on designated bicycle lanes and trails.
  answer: B
  explanation: The manual states that anyone with a Class D driver's license may drive an NEV, but only on streets with speed limits of 35 mph or less.
- id: 179
  category: sharing_the_road
  question: How much longer does it typically take to pass a commercial vehicle than a car on a level highway?
  choices:
    A: One to two seconds longer.
    B: Three to five seconds longer.
    C: Five to seven seconds longer.
    D: Ten seconds longer.
  answer: B
  explanation: The manual specifies that it takes three to five seconds longer to pass a commercial vehicle than a car on a level highway.
- id: 180
  category: defensive_driving
  question: When meeting a commercial vehicle coming from the opposite direction, how does wind turbulence affect the vehicles?
  choices:
    A: It will push the vehicles toward each other.
    B: It will push the vehicles away from each other.
    C: It will pull the smaller vehicle under the commercial vehicle.
    D: It will cause the commercial vehicle to lose speed.
  answer: B
  explanation: The manual notes that when meeting a commercial vehicle from the opposite direction, turbulence will push the vehicles away from each other, not toward each other.
- id: 181
  category: sharing_the_road
  question: Approximately how much distance may a fully loaded tractor-trailer need to come to a complete stop when traveling at 55 mph?
  choices:
    A: 130 to 140 feet.
    B: 200 feet.
    C: 300 feet.
    D: More than 400 feet.
  answer: D
  explanation: While an average passenger car traveling at 55 mph can stop within 130 to 140 feet, a fully loaded tractor-trailer may need more than 400 feet to stop completely.
- id: 182
  category: defensive_driving
  question: Where should you position your vehicle if you stop behind a commercial vehicle on an upgrade?
  choices:
    A: On the right side of your lane so the driver can see you in the rearview mirror.
    B: On the left side of your lane so the driver can see you in the side mirror.
    C: Directly in the center of the lane, less than 10 feet behind the truck.
    D: In the right shoulder to avoid rolling backward.
  answer: B
  explanation: If you stop behind a commercial vehicle on an upgrade, you should position your vehicle on the left side of your lane so the driver can see you in the side mirror, and allow space for the truck to roll back slightly.
- id: 183
  category: sharing_the_road
  question: Why should you avoid passing a commercial vehicle on the right side if there is a possibility it might make a right turn?
  choices:
    A: The commercial vehicle will speed up during the turn.
    B: The front wheels follow a shorter path than the rear wheels.
    C: The rear wheels of a turning vehicle follow a shorter path than the front wheels.
    D: Commercial vehicles are not legally allowed to make right turns.
  answer: C
  explanation: The rear wheels of a turning vehicle follow a shorter path than the front wheels. Many commercial vehicles make wide right turns and must sometimes leave an open space to the right just before turning.
- id: 184
  category: sharing_the_road
  question: How far to the rear of a commercial vehicle can its blind spot (or 'no zone') extend?
  choices:
    A: Up to 20 feet.
    B: Up to 50 feet.
    C: Up to 100 feet.
    D: Up to 200 feet.
  answer: D
  explanation: Some truck drivers may not be able to see up to 20 feet in front of the cab, on either side of the trailer, and up to 200 feet to the rear.
- id: 185
  category: safe_driving_rules
  question: When flashing lights or gates are activated at a railroad crossing, how far from the nearest rail or gate must you stop your vehicle?
  choices:
    A: At least 5 feet.
    B: At least 10 feet.
    C: At least 20 feet.
    D: At least 50 feet.
  answer: B
  explanation: When you see flashing lights or gates activated at a railroad crossing, you must stop your vehicle at least 10 feet from the nearest rail or gate.
- id: 186
  category: safe_driving_rules
  question: It is illegal to pass any vehicle within what distance of a railroad crossing?
  choices:
    A: 50 feet.
    B: 100 feet.
    C: 200 feet.
    D: 500 feet.
  answer: B
  explanation: The manual states that it is illegal to pass any vehicle within 100 feet of a railroad crossing.
- id: 187
  category: sharing_the_road
  question: When passing a commercial vehicle, when is it safe to move back into your lane?
  choices:
    A: As soon as your rear bumper clears the front bumper of the truck.
    B: When you can see the front of the commercial vehicle in your rearview mirror.
    C: When you are 50 feet ahead of the commercial vehicle.
    D: Immediately after you honk your horn to signal your return.
  answer: B
  explanation: You should complete your pass quickly and move back into your lane only when you can see the front of the commercial vehicle in your rearview mirror.
- id: 188
  category: sharing_the_road
  question: What should you do if a motorcyclist attempts to pass your vehicle?
  choices:
    A: Speed up to prevent them from passing.
    B: Move onto the shoulder to give them more room.
    C: Maintain your lane position and speed, and allow the rider to complete the pass.
    D: Honk your horn to warn them of oncoming traffic.
  answer: C
  explanation: If a motorcyclist attempts to pass you, maintain your lane position and speed, and allow the rider to complete the pass.
- id: 189
  category: safe_driving_rules
  question: After stopping for a train at a railroad crossing, when is it safe to proceed across the tracks?
  choices:
    A: Immediately after the last car of the train passes.
    B: When traffic ahead has moved and you can proceed without stopping within 10 feet past the rails.
    C: As soon as the gates begin to rise.
    D: When the train is at least 100 feet away.
  answer: B
  explanation: It is safe to cross when traffic ahead has moved and you can proceed without stopping within 10 feet past the rails, ensuring no second train is approaching.
- id: 190
  category: sharing_the_road
  question: Why do many car-commercial vehicle collisions occur at intersections?
  choices:
    A: Commercial vehicles are not required to stop at red lights.
    B: The driver of the car misjudges the speed and distance of the commercial vehicle due to its large size.
    C: Commercial vehicles accelerate much faster than cars.
    D: Commercial vehicles cannot use turn signals.
  answer: B
  explanation: Because of their large size, commercial vehicles often appear to be traveling slower than they actually are, causing drivers to misjudge their speed and distance at intersections.
- id: 191
  category: sharing_the_road
  question: What should you do if your vehicle has a manual transmission and you are preparing to cross railroad tracks?
  choices:
    A: Shift gears while your vehicle is within the crossing.
    B: Shift down before entering the crossing.
    C: Shift into neutral and coast across the tracks.
    D: Accelerate and shift up before entering the crossing.
  answer: B
  explanation: 'The manual states: ''Do not shift gears while your vehicle is within a crossing. If your vehicle has a manual transmission, shift down before entering the crossing.'''
- id: 192
  category: sharing_the_road
  question: What is the purpose of the blue Emergency Notification System (ENS) sign at a highway-rail grade crossing?
  choices:
    A: To provide a 24/7 telephone number to report problems or emergencies at the railroad location.
    B: To indicate the radio frequency for upcoming train schedules.
    C: To warn drivers of an upcoming highway construction zone.
    D: To show the distance to the nearest hospital or emergency room.
  answer: A
  explanation: According to the manual, every highway-rail crossing has an ENS sign that provides a 24/7 telephone number to call to report problems or emergencies at the railroad location.
- id: 193
  category: penalties_and_points
  question: What is the penalty for disobeying a speed limit or failing to obey a flag person in a highway work zone?
  choices:
    A: A written warning for the first offense.
    B: A mandatory license suspension of 30 days.
    C: A violation and a financial penalty.
    D: Community service and mandatory traffic school.
  answer: C
  explanation: The manual explicitly states that failure to obey a flag person or disobeying the speed limit in a work zone will result in a violation and financial penalty.
- id: 194
  category: safe_driving_rules
  question: When traffic is heavy and backing up due to a 'lane closed ahead' sign, what is the proper zipper merge procedure?
  choices:
    A: Merge into the open lane as early as possible to avoid cutting in line.
    B: Stay in your current lane until the point of merge, then take turns merging.
    C: Drive on the shoulder to bypass the traffic backup and merge at the end.
    D: Straddle both lanes to prevent other drivers from passing you.
  answer: B
  explanation: The zipper merge procedure requires drivers to stay in their current lane until the point of merge when traffic is backing up, and then take turns with other drivers to safely merge.
- id: 195
  category: defensive_driving
  question: Which of the following is a stated benefit of using the zipper merge?
  choices:
    A: It reduces the overall length of traffic backups by up to 40 percent.
    B: It allows faster vehicles to bypass slower traffic safely.
    C: It increases the speed difference between the two lanes.
    D: It encourages drivers to merge as early as possible.
  answer: A
  explanation: The manual lists several benefits of the zipper merge, including that it 'reduces the overall length of traffic backups by up to 40 percent.'
- id: 196
  category: signs_and_signals
  question: What does a brown traffic sign indicate?
  choices:
    A: Services for motorists.
    B: Historic, cultural or recreational sites.
    C: Pedestrian and bicycle crossings.
    D: Construction or maintenance zones.
  answer: B
  explanation: Under the sign color meanings section, brown indicates historic, cultural or recreational sites.
- id: 197
  category: signs_and_signals
  question: Which sign color is used to warn and control traffic in construction zones?
  choices:
    A: Yellow
    B: Red
    C: Orange
    D: Yellow-green
  answer: C
  explanation: The manual states that orange signs warn and control in construction zones.
- id: 198
  category: signs_and_signals
  question: What does a red circle with a red slash mark across a symbol mean?
  choices:
    A: You must take the action shown by the symbol.
    B: You should not take a certain course of action.
    C: The action is recommended but not legally required.
    D: A specific hazard is present ahead.
  answer: B
  explanation: According to the regulatory signs section, a red circle with a red slash mark across a symbol indicates that you should not take a certain course of action.
- id: 199
  category: safe_driving_rules
  question: When are you allowed to drive slower than the minimum posted speed limit on an interstate freeway?
  choices:
    A: When you are driving in the far right lane.
    B: When bad weather or poor road conditions make it necessary.
    C: When you are driving a commercial vehicle or towing a trailer.
    D: You are never allowed to drive slower than the minimum posted speed limit.
  answer: B
  explanation: 'The manual states: ''Do not drive slower than the minimum posted limit unless bad weather or poor road conditions make it necessary.'''
- id: 200
  category: signs_and_signals
  question: How must the center lane be used if it is marked as 'Center Lane Left-turn Only'?
  choices:
    A: It is reserved for passing slower vehicles.
    B: It must be shared and used only for making left turns by traffic traveling in either direction.
    C: It is reserved for emergency vehicles and buses only.
    D: It can be used for making both left and right turns.
  answer: B
  explanation: The manual explains that for a Center Lane Left-turn Only, 'You must share the center lane and use it only for making left turns when traveling in either direction.'
- id: 201
  category: signs_and_signals
  question: What does a diamond symbol painted on a traffic lane indicate?
  choices:
    A: The lane is ending ahead and you must merge.
    B: The lane is reserved for specific use or certain types of vehicles.
    C: The lane is a designated passing lane.
    D: The lane is temporarily closed for construction.
  answer: B
  explanation: A diamond symbol indicates a 'Lane for Limited Uses', meaning the traffic lane is reserved for specific use or certain types of vehicles, such as buses, bicycles, or cars with multiple passengers.
- id: 202
  category: signs_and_signals
  question: What does an 'exempt' sign below a railroad crossing sign mean?
  choices:
    A: The crossing is abandoned and no longer in use by trains.
    B: Passenger vehicles do not need to look for trains at this crossing.
    C: Bus and truck drivers may proceed without stopping, but must still look for trains.
    D: All vehicles must come to a complete stop before crossing.
  answer: C
  explanation: An 'exempt' sign means that bus and truck drivers, who are usually required to stop at railroad crossings, may proceed without stopping. However, drivers still need to look in both directions for trains.
- id: 203
  category: safe_driving_rules
  question: What may you do if you have a valid disability parking permit but all designated disability parking spaces are occupied?
  choices:
    A: Park in a designated fire lane with your hazard lights flashing.
    B: Park at an angle and occupy two standard parking spaces.
    C: Park on the sidewalk nearest to the building entrance.
    D: Park in a commercial loading zone for up to 30 minutes.
  answer: B
  explanation: 'The manual states: ''If designated disability parking spaces are occupied or unavailable, you may park at an angle and occupy two standard parking spaces if you have a valid disability parking permit or license plates.'''
- id: 204
  category: signs_and_signals
  question: What shape is a school zone warning sign?
  choices:
    A: Octagon
    B: Triangle
    C: Pentagon
    D: Diamond
  answer: C
  explanation: The manual describes school zone signs as 'yellow or fluorescent yellow-green, pentagon-shaped warning signs'.
- id: 205
  category: signs_and_signals
  question: Where is a 'No Passing Zone' warning sign typically located?
  choices:
    A: On the right side of a multi-lane highway.
    B: On the left side of a two-way highway.
    C: Suspended above the center of an intersection.
    D: On the right side of a one-way street.
  answer: B
  explanation: According to the manual, the No Passing Zone sign 'is on the left side of a two-way highway. It warns of the beginning of a no passing zone.'
- id: 206
  category: signs_and_signals
  question: 'A slow-moving vehicle emblem must be displayed on all vehicles that travel at speeds of:'
  choices:
    A: 25 mph or less
    B: 30 mph or less
    C: 35 mph or less
    D: 40 mph or less
  answer: B
  explanation: The manual states that the slow-moving vehicle emblem must be displayed on all vehicles that travel at speeds of 30 mph or less, such as farm implements or animal-drawn vehicles.
- id: 207
  category: vehicle_information
  question: During periods of reduced visibility or from sunset to sunrise, animal-drawn vehicles are required to have a light or lamp visible from what distance?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: The manual states that animal-drawn vehicles are required to have a light or lamp visible within 500 feet from sunset to sunrise, or during periods of reduced visibility.
- id: 208
  category: signs_and_signals
  question: When approaching a "Lane Ends" sign where the right lane must merge into left-lane traffic, who must yield?
  choices:
    A: Vehicles in the left lane
    B: Vehicles in the right lane
    C: Whichever vehicle is traveling faster
    D: Neither, both must stop
  answer: B
  explanation: The manual specifies for a Lane Ends sign that when two lanes become one, "Right-lane vehicles must yield" when merging into left-lane traffic.
- id: 209
  category: signs_and_signals
  question: What does an "Added Lane" sign indicate?
  choices:
    A: Two lanes will become one and you must merge.
    B: The roadway will gain an additional lane of traffic and new traffic will not have to merge.
    C: You must exit the highway immediately.
    D: A construction zone has temporarily added a lane.
  answer: B
  explanation: The manual states that an Added Lane sign means "The roadway will gain an additional lane of traffic. New traffic will not have to merge."
- id: 210
  category: penalties_and_points
  question: What is the fine for a motorist who violates the posted speed limit in a work zone when workers are present?
  choices:
    A: $100
    B: $150
    C: $200
    D: $300
  answer: D
  explanation: The manual states, "Motorists who violate the posted speed limit in work zones when workers are present will be assessed a $300 fine."
- id: 211
  category: signs_and_signals
  question: What type of information do brown traffic signs provide?
  choices:
    A: Motorist services such as gas and hospitals
    B: Guidance such as exits and street names
    C: Historic sites, parks, and other points of interest
    D: Construction and work zone hazards
  answer: C
  explanation: According to the manual, "Brown signs point out historic sites, parks and other points of interest."
- id: 212
  category: signs_and_signals
  question: Which color sign directs you to motorist services such as telephones, gas, food, and hospitals?
  choices:
    A: Green
    B: Blue
    C: Brown
    D: Orange
  answer: B
  explanation: The manual states, "Blue signs direct you to services such as telephones, gas, food, motels, hospitals and rest areas."
- id: 213
  category: safe_driving_rules
  question: How should you treat an intersection if the traffic-control signal is not functioning?
  choices:
    A: Treat it as a four-way stop.
    B: Treat it like an uncontrolled intersection.
    C: Yield only to traffic on your right.
    D: Proceed without stopping if you are on the larger road.
  answer: B
  explanation: The manual instructs, "If a traffic signal is not functioning, treat the intersection like an uncontrolled intersection."
- id: 214
  category: safe_driving_rules
  question: Under what condition are you permitted to enter an intersection controlled by a traffic signal if you cannot move completely through it without blocking cross traffic?
  choices:
    A: If the light is green.
    B: If you are in a hurry.
    C: If you are directed by a traffic-control agent or peace officer.
    D: If there are no vehicles currently waiting on the cross street.
  answer: C
  explanation: You should not enter an intersection unless you can move completely through without blocking cross traffic. An exception is if you are "Directed by a traffic-control agent or a peace officer."
- id: 215
  category: safe_driving_rules
  question: When is it legal to make a left turn on a solid red light?
  choices:
    A: When turning from a two-way road onto a one-way road.
    B: When turning from a one-way road onto a one-way cross street, after meeting certain conditions.
    C: When turning from a two-way road onto a two-way road if no traffic is coming.
    D: It is never legal to make a left turn on a red light.
  answer: B
  explanation: The manual states, "If certain conditions are met, you may make a left turn from a one-way road onto a one way cross street while the traffic light is red."
- id: 216
  category: signs_and_signals
  question: How must you respond to a flashing red traffic light?
  choices:
    A: Slow down and proceed with caution.
    B: Stop only if pedestrians are present.
    C: Treat it as a yield sign.
    D: Treat it as a stop sign.
  answer: D
  explanation: The manual states, "Treat a flashing red light as a stop sign. Come to a complete stop, yield to vehicles and pedestrians who reach the intersection before you, and proceed when the intersection is clear."
- id: 217
  category: safe_driving_rules
  question: If you are waiting in the intersection to make a turn and the traffic signal turns from yellow to red, what should you do?
  choices:
    A: Back up immediately.
    B: Stay in the intersection until the light turns green again.
    C: Complete the turn as soon as it is safe.
    D: Abandon the turn and drive straight ahead.
  answer: C
  explanation: The manual advises, "If you are waiting in the intersection to make a turn and the signal turns from yellow to red, complete the turn as soon as it is safe. Do not back up."
- id: 218
  category: signs_and_signals
  question: What does a flashing yellow traffic light or arrow mean?
  choices:
    A: Stop and wait for a green light.
    B: The signal is about to turn red.
    C: Proceed through the intersection with caution.
    D: You have the right-of-way over all other traffic.
  answer: C
  explanation: According to the manual, "A flashing yellow light or arrow means 'caution.' Proceed through the intersection with caution."
- id: 219
  category: signs_and_signals
  question: What should a pedestrian do if they are already in the intersection and the "Don't Walk" signal begins to flash?
  choices:
    A: Stop and wait in the middle of the intersection.
    B: Turn around and return to the starting curb.
    C: Run as fast as possible to the other side.
    D: Continue walking to the other side at a normal pace.
  answer: D
  explanation: 'The manual states: "When the raised hand or ''Don''t Walk'' signal is flashing... Pedestrians already in the intersection may continue walking to the other side at a normal pace."'
- id: 220
  category: signs_and_signals
  question: What does a steady yellow X lane use control signal indicate?
  choices:
    A: You can use the lane below to make a left turn.
    B: You should prepare to move safely into another lane.
    C: You are allowed to drive in the lane below.
    D: You must stop immediately in your current lane.
  answer: B
  explanation: A steady yellow X means you should prepare to move safely into another lane because a lane-control change is being made in the lane below.
- id: 221
  category: signs_and_signals
  question: If you see a flashing yellow X over your lane, what does it mean?
  choices:
    A: The lane is closed to all traffic.
    B: You can use the lane to make a left turn, but must use caution.
    C: You must merge right immediately.
    D: The lane is reserved for carpools only.
  answer: B
  explanation: A flashing yellow X means you can use the lane below it to make a left turn. You must use caution because left-turning vehicles from the other direction may be using the same lane.
- id: 222
  category: safe_driving_rules
  question: How many cars may proceed each time the light turns green at a freeway ramp meter?
  choices:
    A: One car
    B: Two cars
    C: Three cars
    D: As many cars as possible before it turns red
  answer: A
  explanation: When ramps are metered, you must take turns entering the highway, and only one car may proceed each time the light is green.
- id: 223
  category: signs_and_signals
  question: What do shorter and thicker white dashes on the pavement indicate?
  choices:
    A: A pedestrian crosswalk is ahead.
    B: You may pass other vehicles.
    C: The lane is ending.
    D: You are entering a school zone.
  answer: C
  explanation: Shorter and thicker white dashes indicate that the lane is ending.
- id: 224
  category: signs_and_signals
  question: Which pavement marking indicates that you must NOT change lanes?
  choices:
    A: White dashes
    B: Yellow dashes
    C: Solid white line
    D: Double solid white lines
  answer: D
  explanation: Double solid white lines mean you must not change lanes. A single solid white line means you 'should not' change lanes.
- id: 225
  category: signs_and_signals
  question: What is the primary purpose of yellow lines on a roadway?
  choices:
    A: To separate lanes of traffic traveling in the same direction.
    B: To separate traffic moving in opposite directions.
    C: To mark crosswalks and parking stalls.
    D: To indicate a lane reserved for bicycles.
  answer: B
  explanation: Yellow lines separate traffic moving in opposite directions.
- id: 226
  category: signs_and_signals
  question: 'A center lane marked by parallel solid and dashed yellow lines is designated for:'
  choices:
    A: Passing slow-moving vehicles.
    B: Emergency vehicles only.
    C: Left turns only.
    D: Right turns only.
  answer: C
  explanation: A center lane between lanes of traffic traveling in opposite directions marked by parallel solid and dashed yellow lines may be designated for left turns only.
- id: 227
  category: sharing_the_road
  question: How are carpool lanes typically marked on a freeway?
  choices:
    A: With a diamond symbol or 'Carpool Only' signs.
    B: With a solid white line and a bicycle insignia.
    C: With shorter and thicker white dashes.
    D: With a steady red X overhead.
  answer: A
  explanation: Carpool lanes are marked by a diamond symbol or with 'Carpool Only' signs, and are restricted to vehicles with two or more occupants.
- id: 228
  category: safe_driving_rules
  question: What should you do if a traffic officer gives you a hand signal that contradicts a traffic light?
  choices:
    A: Obey the traffic light.
    B: Obey the officer's hand signal.
    C: Pull over and wait for the light to change.
    D: Honk your horn to alert the officer of the light.
  answer: B
  explanation: When an officer is present, you must obey any hand signals you are given rather than traffic signals, signs or pavement markings.
- id: 229
  category: signs_and_signals
  question: How does a traffic officer typically signal a driver to stop?
  choices:
    A: By motioning with the hand and giving short whistle blasts.
    B: By pointing a flashlight directly at the driver's eyes.
    C: By holding up one hand with the palm facing the vehicle and giving a long blast on the whistle.
    D: By waving both arms overhead in a crossing motion.
  answer: C
  explanation: Most traffic officers signal drivers to stop by holding up one hand with the palm facing the vehicle and giving a long blast on the whistle.
- id: 230
  category: defensive_driving
  question: What does the acronym SIPDE stand for in driving strategy?
  choices:
    A: Stop, Investigate, Proceed, Drive, Evaluate
    B: Scan, Identify, Predict, Decide, Execute
    C: Search, Inspect, Plan, Drive, Escape
    D: Signal, Identify, Pass, Defend, Execute
  answer: B
  explanation: 'SIPDE is a five-step process used to make appropriate judgments: Scan, Identify, Predict, Decide, and Execute.'
- id: 231
  category: defensive_driving
  question: In the SIPDE system, what does the 'Predict' step involve?
  choices:
    A: Searching aggressively ahead, to the sides, and behind.
    B: Carrying out your decision to minimize harm.
    C: Considering the speed, distance, and direction of hazards to anticipate how they may affect you.
    D: Locating stationary objects like potholes and guard rails.
  answer: C
  explanation: The Predict step involves considering the speed, distance and direction of hazards to anticipate how they may affect you.
- id: 232
  category: safe_driving_rules
  question: Under ideal conditions, what rule should you use to maintain a safe following distance?
  choices:
    A: The One-Second Rule
    B: The Two-Second Rule
    C: The Three-Second Rule
    D: The Four-Second Rule
  answer: C
  explanation: Applying the 'Three-Second Rule' helps you keep a safe distance between your car and the vehicle ahead of you in ideal conditions.
- id: 233
  category: defensive_driving
  question: What should you do if the vehicle behind you is following too closely?
  choices:
    A: Speed up to increase the distance between you.
    B: Brake sharply to warn the driver.
    C: Slow down slightly and allow the vehicle to pass.
    D: Turn on your hazard lights and stop in your lane.
  answer: C
  explanation: If the vehicle behind you is following too closely, the manual advises to slow down slightly and allow it to pass.
- id: 234
  category: safe_driving_rules
  question: What should you do to your following distance when driving a vehicle longer than the standard length or when road conditions are poor?
  choices:
    A: Keep it at a two-second count
    B: Increase it to a four- or five-second count
    C: Decrease it to a one-second count
    D: Maintain a three-second count
  answer: B
  explanation: The manual states that when road conditions are poor, or if you are driving a vehicle longer than the standard length, you should increase your following distance to a four- or five-second count.
- id: 235
  category: defensive_driving
  question: Approximately how long does it take for a driver to use the brakes after perceiving a danger ahead?
  choices:
    A: 1/4 of a second
    B: 1/2 of a second
    C: 3/4 of a second
    D: 1 full second
  answer: C
  explanation: According to the manual, the length of time from perceiving the danger to using the brakes is about 3/4 of a second.
