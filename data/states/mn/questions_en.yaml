  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles entering the highway from the side road.
  id: 378
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without requiring merging. Traffic entering from the ramp has its own new lane.
  id: 379
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle in this area. You may briefly stop to load or unload passengers.
  id: 380
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons with disabilities. Only vehicles displaying a valid disability parking placard or license plate may park in these spaces. Violations carry heavy fines.
  id: 381
- id: 382
  category: sharing_the_road
  question: How should you behave when sharing the road with a snowplow on a snow-covered Minnesota road?
  choices:
    A: Drive close behind it so the cleared path stays open
    B: Pass it as quickly as possible on either side
    C: Never crowd it, stay well behind, and pass only when you can see the entire vehicle
    D: Sound your horn continuously until the operator pulls over
  answer: C
  explanation: When roads are covered with snow or ice, never crowd a snowplow. Stay well behind and pass snowplows only when you can see the entire vehicle, since they create snow clouds and "whiteout" conditions that can conceal what is in front of them.
- id: 383
  category: safe_driving_rules
  question: When a Minnesota city declares a snow emergency after a significant snowfall, what must drivers do?
  choices:
    A: Park only on the side of the street facing traffic
    B: Obey the snow emergency parking rules to avoid towing and fines
    C: Continue parking wherever they normally do
    D: Move all vehicles into private garages within one hour
  answer: B
  explanation: When a significant amount of snow accumulates, city officials may declare a snow emergency. Certain streets must be cleared of parked vehicles so plows can do their work. Obey snow emergency parking rules to avoid towing and fines.
