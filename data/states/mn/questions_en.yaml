  category: alcohol_drugs_health
  question: How does alcohol consumption affect a driver's vision?
  choices:
    A: It increases the range of eye movement
    B: It enhances peripheral vision
    C: It reduces the range of eye movement and decreases peripheral vision
    D: It improves night vision but blurs daytime vision
  answer: C
  explanation: Alcohol reduces the range of eye movement, decreasing peripheral vision, and can cause blurred vision at high concentration levels.
- id: 296
  category: alcohol_drugs_health
  question: Which of the following groups of drinks generally contain about the same amount of alcohol?
  choices:
    A: A 12-ounce beer, a 5-ounce glass of wine, and a 9-ounce wine cooler
    B: A 16-ounce beer, an 8-ounce glass of wine, and a typical mixed drink
    C: A 12-ounce beer, a 12-ounce glass of wine, and a 12-ounce wine cooler
    D: A 20-ounce beer, a 5-ounce glass of wine, and a 5-ounce wine cooler
  answer: A
  explanation: A 12-ounce beer, a 5-ounce glass of wine, a typical mixed drink, and a 9-ounce wine cooler usually contain about the same amount of alcohol.
- id: 297
  category: alcohol_drugs_health
  question: If a bottle of liquor is labeled as '80-proof,' what is its alcohol percentage?
  choices:
    A: 20 percent
    B: 40 percent
    C: 60 percent
    D: 80 percent
  answer: B
  explanation: The term 'proof' is equal to twice the percentage of alcohol it contains. Therefore, an 80-proof beverage contains 40 percent alcohol.
- id: 298
  category: alcohol_drugs_health
  question: How does the human body primarily eliminate alcohol?
  choices:
    A: Through breathing and sweating
    B: Through urination
    C: Through oxidation by the liver
    D: Through digestion in the stomach
  answer: C
  explanation: The body eliminates 95 percent of alcohol through oxidation by the liver. The remaining 5 percent is eliminated through breathing, sweating, and urination.
- id: 299
  category: alcohol_drugs_health
  question: Which of the following methods will increase the rate at which your body oxidizes alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Only waiting will reduce your alcohol concentration
  answer: D
  explanation: The only way to reduce your alcohol concentration is to wait. Drinking coffee, exercising, and taking cold showers do not increase the rate of oxidation.
- id: 300
  category: penalties_and_points
  question: What is the legal alcohol concentration limit for a person driving a standard passenger vehicle in Minnesota to be arrested for Driving While Impaired (DWI)?
  choices:
    A: 0.02 percent or higher
    B: 0.04 percent or higher
    C: 0.08 percent or higher
    D: 0.10 percent or higher
  answer: C
  explanation: A person with an alcohol concentration of 0.08 percent or higher who is in control of a moving or parked vehicle can be arrested for driving while impaired (DWI).
- id: 301
  category: penalties_and_points
  question: Under what circumstance can a driver be arrested for DWI with an alcohol concentration as low as 0.04 percent?
  choices:
    A: If they are driving a commercial vehicle or if an officer can prove alcohol caused driving errors
    B: If they are under the age of 21
    C: If they are driving during nighttime hours
    D: If they have passengers under the age of 16 in the vehicle
  answer: A
  explanation: A person can be arrested for DWI at 0.04 percent if driving a commercial vehicle, or if a law enforcement officer can prove that alcohol caused the driver to commit driving errors.
- id: 302
  category: alcohol_drugs_health
  question: When is it permissible to drive while taking a drug prescribed by a doctor?
  choices:
    A: Only during daylight hours
    B: If the doctor informs the driver that it will not affect their ability to drive safely
    C: Whenever the prescription is legally in your name
    D: If you combine it with a small amount of caffeine
  answer: B
  explanation: Possession and use of a drug prescribed by a doctor is permitted if the doctor informs the driver that it will not affect their ability to drive safely.
- id: 303
  category: penalties_and_points
  question: Your driving privileges will be revoked if you are convicted of a gross misdemeanor for which of the following actions involving a school bus?
  choices:
    A: Passing a school bus that is traveling under the speed limit
    B: Failing to stop for a school bus with its stop arm extended and red lights flashing
    C: Following a school bus closer than 100 feet
    D: Honking at a school bus while it is picking up children
  answer: B
  explanation: Your license will be revoked if you are convicted of a gross misdemeanor for failing to stop for a school bus with its stop arm extended and its red lights flashing.
- id: 304
  category: alcohol_drugs_health
  question: How does alcohol impairment typically affect a driver's steering ability?
  choices:
    A: It causes drivers to under-steer and turn too slowly
    B: It causes drivers to grip the steering wheel too tightly
    C: It tends to make drivers over-steer, resulting in weaving and running off the road
    D: It improves steering accuracy but slows reaction time
  answer: C
  explanation: Impaired drivers tend to over-steer, which can result in weaving and running off the road.
- id: 305
  category: alcohol_drugs_health
  question: For a driver operating a commercial vehicle, what alcohol concentration level will result in a DWI arrest?
  choices:
    A: 0.02 percent
    B: 0.04 percent
    C: 0.06 percent
    D: 0.08 percent
