questions:
- id: 1
  category: license_system
  question: ¿En Minnesota, cuál es la edad mínima para solicitar un permiso de instrucción?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: B
  explanation: Según el Manual del Conductor de Minnesota, el solicitante debe tener
    al menos 15 años de edad para calificar para un permiso de instrucción.
- id: 2
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción de Minnesota?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 4 años
  answer: C
  explanation: Un permiso de instrucción de Minnesota es válido por dos años a partir
    de la fecha de solicitud.
- id: 3
  category: license_system
  question: Bajo el sistema de Licencia de Conducir Graduada (GDL) de Minnesota, ¿cuánto
    tiempo debe una persona menor de 18 años tener un permiso de instrucción antes
    de ser elegible para realizar el examen de conducción?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Minnesota exige que los titulares de permisos menores de
    18 años mantengan su permiso durante al menos seis meses de conducción conforme
    a las normas antes de realizar el examen de conducción.
- id: 4
  category: license_system
  question: Durante los primeros seis meses de tener una licencia provisional, ¿cuáles
    son las restricciones de conducción nocturna para un conductor de Minnesota menor
    de 18 años?
  choices:
    A: No conducir entre las 9:00 p.m. y las 4:00 a.m.
    B: No conducir entre las 10:00 p.m. y las 5:00 a.m.
    C: No conducir entre las 11:00 p.m. y las 5:00 a.m.
    D: No conducir entre la medianoche y las 5:00 a.m.
  answer: D
  explanation: Durante los primeros seis meses de la licencia, los conductores provisionales
    tienen prohibido conducir entre la medianoche y las 5:00 a.m., a menos que estén
    acompañados por un conductor con licencia de 25 años o más, o por motivos específicos
    de trabajo, escuela o emergencia.
- id: 5
  category: license_system
  question: Si un conductor de Minnesota cambia su nombre o dirección, ¿dentro de
    cuántos días debe solicitar una licencia de reemplazo?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Minnesota exige que solicite un duplicado o una licencia
    de reemplazo dentro de los 30 días posteriores al cambio de su nombre o dirección.
- id: 6
  category: license_system
  question: Bajo la 'Ley de Vanessa' (Vanessa's Law), un conductor adolescente sin
    licencia que recibe una infracción de tránsito relacionada con un choque o una
    infracción por alcohol/sustancias controladas no puede recibir una licencia hasta
    ¿qué edad?
  choices:
    A: 17 años
    B: 18 años
    C: 19 años
    D: 21 años
  answer: B
  explanation: La Ley de Vanessa establece que un conductor adolescente sin licencia
    con tales infracciones no puede recibir una licencia hasta que cumpla 18 años
    y cumpla con varios otros requisitos, incluyendo volver a tomar la educación vial.
- id: 7
  category: license_system
  question: ¿Cuál es el requisito mínimo de visión para aprobar el examen de la vista
    para una licencia de conducir estándar Clase D en Minnesota?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Para aprobar el examen de la vista de Minnesota, su visión periférica
    debe ser de al menos 105 grados y su agudeza visual debe ser de al menos 20/40.
- id: 8
  category: license_system
  question: Para un solicitante de licencia provisional cuyos padres completaron una
    clase complementaria para padres, ¿cuántas horas de conducción supervisada deben
    registrarse?
  choices:
    A: 30 horas (10 de noche)
    B: 40 horas (15 de noche)
    C: 50 horas (15 de noche)
    D: 60 horas (20 de noche)
  answer: B
  explanation: En Minnesota, si un padre o tutor completa la clase complementaria
    para padres, las horas requeridas de conducción supervisada se reducen de 50 a
    40 horas (15 de las cuales deben ser de noche).
- id: 9
  category: license_system
  question: ¿Cuál es la tarifa estándar para la restitución de una licencia de conducir
    no relacionada con el alcohol en Minnesota?
  choices:
    A: $20
    B: $30
    C: $50
    D: $100
  answer: B
  explanation: La tarifa de restitución para una licencia que fue suspendida o revocada
    por razones ajenas al alcohol o las drogas es de $30.
- id: 10
  category: license_system
  question: Durante los primeros seis meses de tener una licencia provisional, ¿cuántos
    pasajeros menores de 20 años están permitidos (excluyendo a la familia inmediata)?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante los primeros seis meses de tener una licencia provisional,
    solo se permite un pasajero menor de 20 años, a menos que esté acompañado por
    un padre o tutor.
- id: 11
  category: license_system
  question: ¿Cuál de los siguientes se considera un 'Documento Secundario' para una
    solicitud de licencia de Minnesota?
  choices:
    A: Un certificado de nacimiento certificado
    B: Un pasaporte de los EE. UU. válido y no vencido
    C: Una tarjeta de Seguro Social
    D: Un Certificado de Ciudadanía
  answer: C
  explanation: Mientras que los pasaportes y los certificados de nacimiento son documentos
    primarios, la tarjeta de Seguro Social figura como un documento secundario en
    el Manual del Conductor de Minnesota.
- id: 12
  category: license_system
  question: Una persona con un permiso de instrucción de Minnesota debe ser supervisada
    por un conductor con licencia que tenga al menos ¿cuántos años de edad?
  choices:
    A: 18 años
    B: 19 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: El conductor supervisor de un titular de permiso debe tener 21 años
    de edad o más y poseer una licencia válida para el tipo de vehículo que se conduce.
- id: 13
  category: license_system
  question: Para calificar para una licencia de conducir Clase D (licencia completa)
    en Minnesota, una persona debe tener al menos 18 años de edad o haber tenido una
    licencia provisional durante al menos ¿cuántos meses consecutivos?
  choices:
    A: 6 meses
    B: 10 meses
    C: 12 meses
    D: 18 meses
  answer: C
  explanation: Para pasar de una licencia provisional a una licencia Clase D, debe
    tener 18 años o haber tenido una licencia provisional durante 12 meses consecutivos
    sin condenas por infracciones relacionadas con el alcohol o sustancias controladas.
- id: 14
  category: license_system
  question: En Minnesota, si es menor de 18 años, ¿quién debe firmar su solicitud
    de permiso de instrucción o licencia de conducir?
  choices:
    A: Un maestro
    B: Un oficial de policía
    C: Un padre o tutor legal
    D: No se requiere firma si tiene un certificado de nacimiento
  answer: C
  explanation: Si es menor de 18 años, su solicitud debe ser aprobada por un padre
    o tutor legal. Si no tiene padre ni tutor, un pariente cercano o empleador puede
    firmar.
- id: 15
  category: license_system
  question: Después de mudarse a Minnesota desde otro estado, ¿cuántos días tiene
    para obtener una licencia de conducir de Minnesota si tiene una licencia válida
    de su estado anterior?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Según el Manual del Conductor de Minnesota, los nuevos residentes tienen
    60 días después de convertirse en residentes del estado para obtener una licencia
    de conducir de Minnesota (30 días para licencias comerciales).
- id: 16
  category: license_system
  question: Una licencia de conducir Clase D de Minnesota le permite operar un vehículo
    de una sola unidad (automóvil, camioneta o camión) con una Clasificación de Peso
    Bruto Vehicular (GVWR) de hasta ¿cuántas libras?
  choices:
    A: 10,000 lbs
    B: 15,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: Una licencia Clase D es la más común y permite la operación de todos
    los vehículos de una sola unidad (automóviles, camionetas y camiones pequeños),
    excepto aquellos con un GVWR de más de 26,000 libras.
- id: 17
  category: license_system
  question: En Minnesota, si reprueba el examen de conocimientos para su permiso,
    ¿cuántas veces puede tomarlo gratis antes de que se le cobre una tarifa por los
    intentos posteriores?
  choices:
    A: Una vez
    B: Dos veces
    C: Tres veces
    D: Cuatro veces
  answer: B
  explanation: La ley de Minnesota dicta que puede tomar dos exámenes de conocimientos
    sin costo. Se cobra una tarifa de $10 por el tercer examen de conocimientos y
    por cualquier intento posterior.
- id: 18
  category: license_system
  question: ¿A qué edad mínima puede un residente de Minnesota solicitar una licencia
    de conducir restringida para trabajos agrícolas?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 17 años
  answer: B
  explanation: Se puede emitir una licencia de conducir restringida para trabajos
    agrícolas a un joven de 15 años cuya ayuda sea necesaria para las labores del
    campo, siempre que cumpla con criterios específicos y apruebe los exámenes requeridos.
- id: 19
  category: license_system
  question: Una vez que haya cumplido 21 años, ¿cada cuánto tiempo vence una licencia
    de conducir Clase D estándar de Minnesota?
  choices:
    A: Cada 2 años
    B: Cada 4 años
    C: Cada 5 años
    D: Cada 8 años
  answer: B
  explanation: Las licencias de conducir estándar de Minnesota para personas de 21
    años o más vencen cada cuatro años en el cumpleaños de la persona.
- id: 20
  category: license_system
  question: Para operar una bicicleta motorizada (motoneta/moped) en las vías públicas
    de Minnesota, una persona debe tener al menos ¿cuál de los siguientes?
  choices:
    A: Una licencia especializada solo para motonetas
    B: Un permiso de operador de bicicleta motorizada
    C: Una licencia comercial Clase A
    D: No se requiere licencia para motonetas de menos de 50cc
  answer: B
  explanation: Para operar una motoneta (moped), debe tener una licencia de conducir
    válida o un permiso de operador de bicicleta motorizada (disponible a partir de
    los 15 años).
- id: 21
  category: license_system
  question: Según la ley de Minnesota, ¿qué les sucede a los solicitantes varones
    de entre 18 y 26 años cuando solicitan una licencia de conducir o una identificación
    estatal?
  choices:
    A: Se registran automáticamente para el servicio militar obligatorio (Servicio
      Selectivo)
    B: Se les exige pagar un recargo por "conductor joven"
    C: Deben presentar un comprobante de graduación de la escuela secundaria
    D: Se les emite una licencia provisional independientemente de su edad
  answer: A
  explanation: La ley de Minnesota exige que el Departamento de Seguridad Pública
    proporcione información de las solicitudes de licencia al Sistema de Servicio
    Selectivo para varones de 18 a 26 años.
- id: 22
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una Licencia de Conducir Comercial
    (CDL) en Minnesota para el comercio intraestatal (solo dentro de MN)?
  choices:
    A: 16 años
    B: 18 años
    C: 21 años
    D: 25 años
  answer: B
  explanation: En Minnesota, debe tener al menos 18 años para obtener una CDL para
    el comercio intraestatal. Debe tener 21 años para conducir un vehículo comercial
    a través de las fronteras estatales (interestatal).
- id: 23
  category: license_system
  question: ¿Cuál es la tarifa de restablecimiento de una licencia de conducir de
    Minnesota que fue revocada debido a una infracción relacionada con el alcohol
    (DWI)?
  choices:
    A: $30
    B: $250
    C: $680
    D: $1,000
  answer: C
  explanation: La tarifa de restablecimiento de una licencia de conducir revocada
    por infracciones relacionadas con el alcohol o sustancias controladas es de $680,
    lo cual es significativamente más alto que las tarifas por motivos no relacionados
    con el alcohol.
- id: 24
  category: license_system
  question: ¿Qué endoso de licencia se requiere en Minnesota para operar un vehículo
    diseñado para transportar a más de 15 pasajeros (incluido el conductor)?
  choices:
    A: Endoso de Motocicleta (M)
    B: Endoso de Materiales Peligrosos (H)
    C: Endoso de Pasajeros (P)
    D: Endoso de Camión Cisterna (T)
  answer: C
  explanation: Se requiere un endoso de Pasajeros (P) para operar cualquier vehículo
    diseñado para transportar 16 o más personas, incluido el conductor.
- id: 25
  category: license_system
  question: Al solicitar una licencia de conducir, permiso o tarjeta de identificación
    de Minnesota, ¿cuál de los siguientes números debe proporcionar en la solicitud?
  choices:
    A: Su número de Seguro Social
    B: Su número de póliza de seguro de salud
    C: Su número de identificación de estudiante de secundaria
    D: El número de identificación del vehículo (VIN) de su automóvil
  answer: A
  explanation: Los solicitantes de licencias de conducir o tarjetas de identificación
    de Minnesota deben proporcionar su número de Seguro Social en el formulario de
    solicitud, según lo exigen las leyes estatales y federales.
- id: 26
  category: license_system
  question: En Minnesota, ¿cuál de los siguientes endosos de licencia requiere una
    verificación de antecedentes penales?
  choices:
    A: Motocicleta (M)
    B: Autobús Escolar (S)
    C: Camión Cisterna (T)
    D: Remolques Dobles/Triples (D)
  answer: B
  explanation: Los solicitantes de un endoso de Autobús Escolar (S) deben someterse
    a una verificación de antecedentes penales y a una revisión de sus registros de
    conducción antes de que se emita el endoso.
- id: 27
  category: driver_testing
  question: Al realizar el examen práctico de manejo en Minnesota, ¿qué debe presentar
    como prueba de la seguridad y legalidad del vehículo?
  choices:
    A: Una carta notariada de un mecánico
    B: Una tarjeta de identificación o póliza de seguro válida
    C: La calcomanía original de la ventana del vehículo
    D: Un recibo de un cambio de aceite reciente
  answer: B
  explanation: Para realizar el examen práctico en Minnesota, debe presentar un comprobante
    de seguro válido para el vehículo utilizado durante la prueba.
- id: 28
  category: driver_testing
  question: ¿Cuál es la edad mínima para solicitar un permiso de operador de bicicleta
    motorizada (ciclomotor) en Minnesota?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: B
  explanation: En Minnesota, debe tener al menos 15 años para solicitar un permiso
    de bicicleta motorizada (ciclomotor).
- id: 29
  category: driver_testing
  question: Minnesota es un estado de seguro "sin culpa" (No-Fault). ¿Qué significa
    esto específicamente para los conductores involucrados en un accidente?
  choices:
    A: Nadie recibe nunca una multa por un choque
    B: El estado paga todas las reparaciones del vehículo
    C: Su compañía de seguros paga sus gastos médicos independientemente de quién
      haya causado el choque
    D: Los conductores no necesitan intercambiar información de seguro
  answer: C
  explanation: La Ley Sin Culpa (No-Fault Act) de Minnesota exige que los titulares
    de pólizas tengan Protección contra Lesiones Personales, que paga sus propios
    gastos médicos y otras pérdidas económicas independientemente de la culpa.
- id: 30
  category: driver_testing
  question: 'En Minnesota, se debe presentar un informe de accidente ante los Servicios
    para Conductores y Vehículos si el accidente resulta en lesiones, muerte o daños
    totales a la propiedad de al menos:'
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,500
  answer: C
  explanation: Los conductores involucrados en un accidente que resulte en lesiones,
    muerte o daños a la propiedad de $1,000 o más deben presentar un informe de accidente
    dentro de los 10 días.
- id: 31
  category: driver_testing
  question: ¿Si un conductor de Minnesota tiene solo un ojo funcional, cuál es el
    campo de visión mínimo requerido para aprobar el examen de la vista?
  choices:
    A: 75 grados
    B: 90 grados
    C: 105 grados
    D: 120 grados
  answer: C
  explanation: Si tiene solo un ojo funcional, debe tener un campo de visión de al
    menos 105 grados para aprobar el examen de la vista de Minnesota.
- id: 32
  category: driver_testing
  question: Si reprueba el examen de conducir de Minnesota cuatro veces, ¿cuántas
    horas de instrucción práctica al volante debe completar antes de que se le permita
    tomar el examen nuevamente?
  choices:
    A: 2 horas
    B: 4 horas
    C: 6 horas
    D: 10 horas
  answer: C
  explanation: Después de cuatro exámenes de conducir reprobados, la ley de Minnesota
    exige que el solicitante complete 6 horas de instrucción práctica al volante en
    una escuela de manejo autorizada.
- id: 33
  category: driver_testing
  question: Si se muda a Minnesota desde un país que no sea Estados Unidos, Canadá
    o territorios de los EE. UU., ¿cuál es el requisito de evaluación para obtener
    una licencia?
  choices:
    A: Solo necesita aprobar el examen de la vista
    B: Solo necesita aprobar el examen de conocimientos
    C: Debe aprobar el examen de conocimientos y el examen de conducir
    D: Su licencia extranjera se convierte automáticamente sin necesidad de exámenes
  answer: C
  explanation: Los conductores que se mudan a Minnesota desde países que no sean los
    EE. UU., Canadá o territorios de los EE. UU. deben aprobar tanto el examen de
    conocimientos (escrito) como el examen de conducir (habilidades).
- id: 34
  category: driver_testing
  question: Según la ley de Minnesota, ¿cuándo deben mostrarse las calcomanías de
    registro del vehículo en su placa de circulación?
  choices:
    A: A más tardar el primer día del mes siguiente al mes de vencimiento
    B: A más tardar el día 15 del mes de vencimiento
    C: Exactamente 30 días después de la fecha de vencimiento
    D: Solo si conduce fuera del estado
  answer: A
  explanation: Las calcomanías de registro deben mostrarse en su placa de circulación
    a más tardar el primer día del mes siguiente al mes de registro/vencimiento.
- id: 35
  category: driver_testing
  question: ¿Qué código de letra se utiliza en una licencia de conducir de Minnesota
    para indicar un endoso de motocicleta?
  choices:
    A: C
    B: M
    C: S
    D: X
  answer: B
  explanation: La letra 'M' en una licencia de conducir de Minnesota indica que el
    conductor tiene el endoso para operar una motocicleta.
- id: 36
  category: driver_testing
  question: ¿Quién está autorizado para certificar una discapacidad permanente o temporal
    para un certificado de estacionamiento para personas con discapacidad en Minnesota?
  choices:
    A: Cualquier conductor con licencia mayor de 21 años
    B: Un oficial de policía
    C: Un médico, asistente médico, enfermero practicante de práctica avanzada o quiropráctico
    D: Solo el Comisionado de Seguridad Pública
  answer: C
  explanation: Un profesional médico, como un médico, asistente médico (PA), enfermero
    practicante de práctica avanzada (APRN) o quiropráctico, debe certificar la discapacidad
    en el formulario de solicitud.
- id: 37
  category: driver_testing
  question: En Minnesota, si tiene al menos 18 años, ¿puede registrarse para votar
    cuando solicita una licencia de conducir?
  choices:
    A: No, debe ir a una oficina electoral separada
    B: Sí, la solicitud de licencia de conducir incluye una sección de registro de
      votantes
    C: Solo si solicita una Licencia de Conducir Comercial (CDL)
    D: Solo durante los años de elecciones presidenciales
  answer: B
  explanation: La ley de Minnesota permite que los ciudadanos elegibles se registren
    para votar al mismo tiempo que solicitan o renuevan una licencia de conducir o
    una tarjeta de identificación.
- id: 38
  category: driver_testing
  question: ¿Cuál es el requisito de edad mínima para solicitar una tarjeta de identificación
    de Minnesota?
  choices:
    A: 12 años
    B: 15 años
    C: 16 años
    D: No hay una edad mínima
  answer: D
  explanation: En Minnesota, no existe un requisito de edad mínima para solicitar
    una tarjeta de identificación estatal, aunque los solicitantes menores de 18 años
    necesitan el consentimiento de los padres.
- id: 39
  category: driver_testing
  question: Para aprobar el examen de conocimientos de Minnesota, ¿qué porcentaje
    mínimo debe obtener?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: El examen de conocimientos de Minnesota consta de 40 preguntas y debe
    responder correctamente al menos el 80% (32 preguntas) para aprobar.
- id: 40
  category: driver_testing
  question: Al realizar el examen de conducir de Minnesota, ¿cuál de los siguientes
    debe proporcionar para el vehículo que está utilizando?
  choices:
    A: Un registro de vehículo válido y comprobante de seguro
    B: Una carta notariada del propietario del vehículo
    C: El título original del vehículo
    D: Un registro de mantenimiento de los últimos 12 meses
  answer: A
  explanation: Los solicitantes deben proporcionar un comprobante de seguro válido
    y el registro vigente del vehículo utilizado durante el examen de conducir.
- id: 41
  category: driver_testing
  question: Si tiene una condición médica que pueda afectar su capacidad para conducir
    de manera segura, ¿dentro de cuántos días después del diagnóstico debe notificar
    a los Servicios de Vehículos y Conductores (DVS)?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La ley de Minnesota exige que los conductores informen cualquier condición
    médica que pueda afectar la conducción segura dentro de los 30 días posteriores
    al diagnóstico o al cambio en la condición.
- id: 42
  category: driver_testing
  question: ¿Cuál de los siguientes es un ejemplo de un 'Documento Principal' requerido
    al solicitar una licencia de conducir de Minnesota?
  choices:
    A: Un acta de nacimiento certificada de los EE. UU.
    B: Una tarjeta de Seguro Social
    C: Un expediente académico de la escuela secundaria (high school)
    D: Una factura de servicios públicos
  answer: A
  explanation: Un acta de nacimiento certificada de los EE. UU. se considera un documento
    principal. Elementos como las tarjetas de Seguro Social son documentos secundarios,
    y las facturas de servicios públicos son comprobantes de residencia.
- id: 43
  category: driver_testing
  question: Durante el examen de conducción de Minnesota, ¿cuál de las siguientes
    acciones resultará en una reprobación inmediata?
  choices:
    A: No usar una luz direccional una vez
    B: Desobedecer una ley de tránsito
    C: Tocar el bordillo mientras se estaciona en paralelo
    D: Conducir a 2 mph por debajo del límite de velocidad
  answer: B
  explanation: Desobedecer una ley de tránsito, conducir de manera peligrosa o causar
    un accidente son motivos de reprobación inmediata en el examen de conducción de
    Minnesota.
- id: 44
  category: driver_testing
  question: Para solicitar un permiso de operador de bicicleta motorizada (motoneta/moped)
    en Minnesota, ¿qué edad mínima debe tener el solicitante?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: B
  explanation: En Minnesota, debe tener al menos 15 años para solicitar un permiso
    de operador de bicicleta motorizada (motoneta/moped).
- id: 45
  category: driver_testing
  question: Si es menor de 18 años y tiene una licencia provisional, ¿cuántos meses
    consecutivos debe permanecer sin condenas para ser elegible para una licencia
    Clase D?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Los titulares de licencias provisionales no deben tener condenas por
    infracciones de tránsito en movimiento ni por infracciones relacionadas con el
    alcohol o sustancias controladas durante 12 meses consecutivos para ascender a
    una licencia Clase D.
- id: 46
  category: driver_testing
  question: ¿Cuál de estos es un requisito para el vehículo utilizado durante el examen
    de conducción de Minnesota?
  choices:
    A: Debe ser un sedán de tamaño mediano
    B: La puerta del pasajero debe abrirse tanto desde el interior como desde el exterior
    C: Debe tener transmisión manual
    D: Debe tener menos de 10 años de antigüedad
  answer: B
  explanation: Por seguridad y para el acceso del examinador, el vehículo utilizado
    para el examen de conducción debe tener puertas que se abran tanto desde el interior
    como desde el exterior.
- id: 47
  category: driver_testing
  question: Si no aprueba el examen de la vista de Minnesota, ¿cuál es el siguiente
    paso requerido por el DVS?
  choices:
    A: Se le prohíbe conducir permanentemente
    B: Debe esperar 6 meses para volver a realizar la prueba
    C: Debe ver a un oculista y pedirle que complete un Informe de Visión
    D: Debe tomar el examen de conocimientos nuevamente
  answer: C
  explanation: Si no aprueba el examen de la vista, se le pedirá que vea a un oculista
    y regrese con un Informe de Visión completado para determinar si puede conducir
    con restricciones.
- id: 48
  category: driver_testing
  question: Durante la parte de inspección previa al viaje del examen de conducción
    de Minnesota, ¿sobre qué equipo del vehículo debe demostrar conocimiento?
  choices:
    A: Cómo revisar el nivel de aceite
    B: Cómo cambiar una llanta pinchada
    C: Cómo operar el desempañador y el ventilador
    D: Cómo arrancar una batería con cables (jump-start)
  answer: C
  explanation: El examen de conducción incluye una verificación del equipo de seguridad
    del vehículo donde debe demostrar que sabe operar las luces, los limpiaparabrisas,
    el desempañador y otros controles esenciales.
- id: 49
  category: driver_responsibility
  question: Después de mudarse a Minnesota y convertirse en residente, ¿cuántos días
    tiene para registrar su vehículo de pasajeros?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Los nuevos residentes de Minnesota tienen 60 días para registrar su
    vehículo de pasajeros o vehículo de segunda etapa después de establecer su residencia.
- id: 50
  category: driver_responsibility
  question: 'Si un conductor de Minnesota es condenado por operar un vehículo motorizado
    sin seguro sin culpa (no-fault insurance), su licencia puede ser revocada por
    hasta:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Conducir sin seguro en Minnesota es un delito menor y puede llevar
    a la revocación de la licencia por hasta un año y multas.
- id: 51
  category: driver_responsibility
  question: 'Bajo la Ley de Consentimiento Implícito (Implied Consent Law) de Minnesota,
    al operar un vehículo motorizado, usted acepta automáticamente:'
  choices:
    A: Un registro del maletero de su vehículo en cualquier momento.
    B: Una prueba de sangre, aliento u orina para determinar la concentración de alcohol
      o drogas.
    C: Una prohibición obligatoria de conducir por 10 años si se ve involucrado en
      cualquier choque.
    D: Permitir que la policía rastree su vehículo a través de GPS.
  answer: B
  explanation: La Ley de Consentimiento Implícito significa que si conduce en Minnesota,
    usted acepta someterse a una prueba química de sangre, aliento u orina si un oficial
    tiene causa probable para creer que está conduciendo bajo la influencia.
- id: 52
  category: driver_responsibility
  question: 'En Minnesota, se considera que una persona con una licencia estándar
    Clase D está legalmente intoxicada (DWI) si su concentración de alcohol en sangre
    (BAC) alcanza el:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Para conductores de 21 años o más, el umbral legal para un DWI en Minnesota
    es una concentración de alcohol en sangre (BAC) de 0.08% o superior.
- id: 53
  category: driver_responsibility
  question: 'La ley de Minnesota ''Ni una gota'' (Not a Drop) establece que si un
    conductor menor de 21 años es sorprendido conduciendo con cualquier cantidad detectable
    de alcohol, su licencia será suspendida por al menos:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: A
  explanation: Bajo la ley 'Ni una gota', un conductor menor de 21 años condenado
    por beber cualquier cantidad de alcohol mientras conduce tendrá sus privilegios
    de conducción suspendidos por 30 días en la primera infracción.
- id: 54
  category: driver_responsibility
  question: 'En Minnesota, huir de un oficial de policía en un vehículo motorizado
    es un delito grave clasificado como:'
  choices:
    A: Falta leve (Petty misdemeanor)
    B: Delito menor (Misdemeanor)
    C: Delito menor grave (Gross misdemeanor)
    D: Delito grave (Felony)
  answer: D
  explanation: Huir de un oficial de policía en un vehículo motorizado es un delito
    grave (felony) en Minnesota, lo que puede resultar en encarcelamiento y multas
    elevadas.
- id: 55
  category: driver_responsibility
  question: 'De acuerdo con la ''Ley de Botella Abierta'' (Open Bottle Law) de Minnesota,
    es ilegal:'
  choices:
    A: Tener un recipiente de alcohol abierto en la guantera.
    B: Tener un recipiente de alcohol abierto en el maletero.
    C: Beber alcohol en el área de pasajeros de un vehículo, pero solo si el motor
      está encendido.
    D: Poseer un recipiente de alcohol abierto en el área de pasajeros de un vehículo
      motorizado en una vía pública.
  answer: D
  explanation: La ley de Minnesota prohíbe tener un recipiente de alcohol abierto
    en el área de pasajeros de un vehículo motorizado, independientemente de si el
    vehículo está en movimiento o estacionado en una vía pública.
- id: 56
  category: driver_responsibility
  question: ¿Cuál es la multa mínima por exceso de velocidad en una zona de obras
    en Minnesota cuando hay trabajadores presentes?
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: C
  explanation: La ley de Minnesota exige una multa mínima de $300 por exceso de velocidad
    en una zona de obras cuando hay trabajadores presentes.
- id: 57
  category: driver_responsibility
  question: ¿Cuál es la multa mínima por no detenerse ante un autobús escolar que
    tiene sus luces rojas intermitentes y el brazo de parada extendido en Minnesota?
  choices:
    A: $250
    B: $300
    C: $500
    D: $1,000
  answer: C
  explanation: La multa mínima por violar la ley del brazo de parada del autobús escolar
    en Minnesota es de $500.
- id: 58
  category: driver_responsibility
  question: 'La ''Ley de Hacerse a un Lado'' (Move Over Law) de Minnesota requiere
    que los conductores se muevan al carril más alejado de un vehículo de emergencia
    detenido con luces intermitentes. Si no puede cambiarse de carril de manera segura,
    usted debe:'
  choices:
    A: Detenerse en su carril actual.
    B: Mantener su velocidad actual y tocar la bocina.
    C: Reducir su velocidad y pasar con precaución.
    D: Encender sus luces de emergencia y acelerar para pasar rápidamente.
  answer: C
  explanation: Si no puede cambiarse de manera segura al carril más alejado del vehículo
    de emergencia, la ley le exige reducir su velocidad y pasar con precaución.
- id: 59
  category: driver_responsibility
  question: 'En Minnesota, la tarifa de reinstalación de una licencia de conducir
    revocada debido a una infracción relacionada con el alcohol (DWI) es de:'
  choices:
    A: $30
    B: $100
    C: $250
    D: $680
  answer: D
  explanation: Los conductores cuyas licencias son revocadas por delitos relacionados
    con el alcohol deben pagar una tarifa de reinstalación de $680, además de cumplir
    con otros requisitos como aprobar un examen de conocimientos sobre DWI.
- id: 60
  category: driver_responsibility
  question: Si usted se ve involucrado en un choque en Minnesota, ¿qué información
    está legalmente obligado a proporcionar a los otros conductores involucrados?
  choices:
    A: El título del vehículo y el historial de registro.
    B: Su nombre, dirección, fecha de nacimiento e información del seguro.
    C: Su número de seguro social.
    D: Una copia de su historial de conducción.
  answer: B
  explanation: Los conductores involucrados en un choque deben proporcionar su nombre,
    dirección, fecha de nacimiento, número de licencia de conducir, registro del vehículo
    e información del seguro a los otros conductores involucrados.
- id: 61
  category: driver_responsibility
  question: 'Un conductor de Minnesota condenado por primera vez por conducir bajo
    los efectos del alcohol (DWI) con un nivel de alcohol en sangre (BAC) de 0.16
    o superior está sujeto a sanciones más severas, que pueden incluir:'
  choices:
    A: Una simple advertencia verbal.
    B: Instalación obligatoria de un dispositivo de bloqueo de encendido (ignition
      interlock).
    C: Una multa máxima de solo $50.
    D: Ninguna revocación de la licencia.
  answer: B
  explanation: Para infracciones con un nivel de alcohol en sangre (BAC) alto (0.16
    o superior), la ley de Minnesota exige sanciones más estrictas, incluido el uso
    obligatorio de un dispositivo de bloqueo de encendido o un período más largo de
    revocación de la licencia.
- id: 62
  category: driver_responsibility
  question: En Minnesota, ¿todo accidente de tráfico que resulte en lesiones, muerte
    o daños materiales totales de al menos cuánto debe informarse al Comisionado de
    Seguridad Pública?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $1,500
  answer: C
  explanation: Según el Manual del Conductor de Minnesota, se debe informar cualquier
    accidente que involucre lesiones, muerte o daños materiales totales de $1,000
    o más.
- id: 63
  category: driver_responsibility
  question: Después de un accidente que requiera un informe al Comisionado de Seguridad
    Pública, ¿dentro de cuántos días se debe presentar el informe?
  choices:
    A: 24 horas
    B: 72 horas
    C: 10 días
    D: 30 días
  answer: C
  explanation: La ley de Minnesota exige que los conductores presenten un informe
    de accidente dentro de los 10 días posteriores al incidente si cumple con los
    criterios de notificación (lesiones, muerte o daños de $1,000 o más).
- id: 64
  category: driver_responsibility
  question: ¿Cuál es el monto mínimo de cobertura de seguro de responsabilidad civil
    requerido en Minnesota por daños a la propiedad en un solo accidente?
  choices:
    A: $5,000
    B: $10,000
    C: $25,000
    D: $30,000
  answer: B
  explanation: La ley de seguros 'sin culpa' (No-Fault) de Minnesota exige un mínimo
    de $10,000 por la destrucción de la propiedad de terceros.
- id: 65
  category: driver_responsibility
  question: Bajo la ley de seguros sin culpa (No-Fault) de Minnesota, ¿cuál es la
    cobertura mínima de responsabilidad civil requerida por lesiones o muerte de una
    persona?
  choices:
    A: $15,000
    B: $20,000
    C: $30,000
    D: $60,000
  answer: C
  explanation: La ley de Minnesota exige un mínimo de $30,000 por lesiones o muerte
    de una persona en cualquier accidente.
- id: 66
  category: driver_responsibility
  question: Si usted es un nuevo residente de Minnesota, ¿cuántos días tiene para
    registrar su vehículo en el estado?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Los nuevos residentes tienen hasta 60 días después de convertirse en
    residentes para registrar su vehículo de pasajeros o camión, siempre que el vehículo
    tenga un registro vigente en otro estado.
- id: 67
  category: driver_responsibility
  question: En Minnesota, ¿qué significa la ley de 'Consentimiento Implícito' (Implied
    Consent)?
  choices:
    A: Usted acepta seguir todos los límites de velocidad.
    B: Usted acepta someterse a una prueba química de alcohol o sustancias controladas
      si lo solicita un oficial.
    C: Usted acepta portar seguro en todo momento.
    D: Usted acepta detenerse ante todos los autobuses escolares.
  answer: B
  explanation: La Ley de Consentimiento Implícito significa que si usted conduce un
    vehículo motorizado en Minnesota, acepta automáticamente someterse a una prueba
    de sangre, aliento u orina para determinar la concentración de alcohol o drogas.
- id: 68
  category: driver_responsibility
  question: ¿Cuál es la sanción para un conductor que se niega a realizar una prueba
    de aliento bajo la Ley de Consentimiento Implícito de Minnesota?
  choices:
    A: Una multa de $50.
    B: Una suspensión de la licencia por 30 días.
    C: Revocación de los privilegios de conducir por al menos un año.
    D: No hay sanción si es la primera infracción.
  answer: C
  explanation: Negarse a realizar la prueba resultará en la revocación de los privilegios
    de conducir por un año y es un delito en Minnesota.
- id: 69
  category: driver_responsibility
  question: ¿Cuál es el límite máximo de alcohol en sangre (BAC) para una persona
    que opera un vehículo motorizado comercial en Minnesota?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: El límite legal de BAC para conductores de vehículos comerciales en
    Minnesota es de 0.04%.
- id: 70
  category: driver_responsibility
  question: Bajo la ley 'Ni una gota' (Not a Drop) de Minnesota, ¿qué le sucede a
    un conductor menor de 21 años que es sorprendido operando un vehículo con cualquier
    cantidad detectable de alcohol?
  choices:
    A: Recibe una advertencia.
    B: Sus privilegios de conducir serán suspendidos de 30 a 180 días.
    C: Debe pagar una multa de $1,000 pero conserva su licencia.
    D: Solo se le sanciona si su BAC es superior al 0.08%.
  answer: B
  explanation: La ley 'Ni una gota' establece que cualquier conductor menor de 21
    años condenado por conducir con cualquier cantidad de alcohol verá sus privilegios
    de conducir suspendidos por 30 días por una primera infracción y 180 días por
    una segunda infracción.
- id: 71
  category: driver_responsibility
  question: ¿Qué prohíbe la ley de 'Envase Abierto' (Open Bottle) de Minnesota?
  choices:
    A: Beber alcohol en una residencia privada.
    B: Poseer un envase de alcohol abierto en el área de pasajeros de un vehículo
      motorizado en una vía pública.
    C: Vender alcohol después de las 10:00 PM.
    D: Transportar alcohol sin abrir en el maletero.
  answer: B
  explanation: La ley de Envase Abierto establece que es ilegal beber o poseer un
    envase abierto de alcohol dentro del área de pasajeros de cualquier vehículo motorizado
    en una vía pública, ya sea que el vehículo esté en movimiento o estacionado.
- id: 72
  category: driver_responsibility
  question: 'En Minnesota, no presentar el comprobante de seguro a petición de un
    oficial de la ley puede resultar en:'
  choices:
    A: Solo una advertencia verbal.
    B: La revocación de su licencia de conducir y del registro del vehículo.
    C: Una sentencia de prisión obligatoria de 5 años.
    D: Nada, si puede demostrar que lo tiene en un plazo de 60 días.
  answer: B
  explanation: Operar un vehículo sin seguro es un delito menor y puede dar lugar
    a la revocación de su licencia de conducir y del registro de su vehículo.
- id: 73
  category: driver_responsibility
  question: ¿Qué ley de Minnesota exige a los conductores reducir la velocidad y moverse
    al carril más alejado de los vehículos de emergencia detenidos con luces intermitentes?
  choices:
    A: La Ley Vanessa (Vanessa Law)
    B: La Ley 'Move Over' de Ted Foss (Ted Foss Move Over Law)
    C: La Ley de Consentimiento Implícito (Implied Consent Law)
    D: La Ley de No Culpabilidad (No-Fault Law)
  answer: B
  explanation: La Ley 'Move Over' de Ted Foss exige que los conductores se muevan
    al carril más alejado de los vehículos de emergencia, grúas o vehículos de mantenimiento
    que estén detenidos y tengan las luces intermitentes encendidas.
- id: 74
  category: safe_driving_rules
  question: En Minnesota, ¿cuál es el límite de velocidad estatutario en un callejón
    a menos que se indique lo contrario?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: Según el Manual del Conductor de Minnesota, el límite de velocidad
    estatutario para los callejones es de 10 mph, a menos que haya una señal que indique
    lo contrario.
- id: 75
  category: safe_driving_rules
  question: Al estacionar su vehículo cerca de un hidrante de incendios en Minnesota,
    ¿cuál es la distancia mínima requerida que debe mantener?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley de Minnesota prohíbe estacionar un vehículo a menos de 10 pies
    de un hidrante de incendios.
- id: 76
  category: safe_driving_rules
  question: En Minnesota, ¿a cuántos pies de un paso de peatones en una intersección
    está prohibido estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: Los conductores en Minnesota no pueden estacionar un vehículo a menos
    de 20 pies de un paso de peatones en una intersección.
- id: 77
  category: safe_driving_rules
  question: ¿A qué distancia debe estacionarse de una baliza intermitente, señal de
    pare (stop) o semáforo ubicado al costado de la carretera?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: La ley de Minnesota exige que no se estacione a menos de 30 pies de
    cualquier baliza intermitente, señal de pare o semáforo.
- id: 78
  category: safe_driving_rules
  question: 'En Minnesota, debe usar sus faros delanteros cuando no pueda ver claramente
    el camino por delante a una distancia de al menos:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: Los faros delanteros deben usarse en Minnesota cuando la visibilidad
    se reduce a 500 pies o menos debido al clima o a la oscuridad.
- id: 79
  category: safe_driving_rules
  question: 'Los giros en U son ilegales en Minnesota si se realizan donde los conductores
    de otros vehículos no pueden verlo desde una distancia de:'
  choices:
    A: 500 pies
    B: 700 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: La ley de Minnesota prohíbe los giros en U en cualquier curva o cerca
    de la cima de una colina donde el vehículo no pueda ser visto por otros conductores
    a una distancia de 1,000 pies.
- id: 80
  category: safe_driving_rules
  question: Al señalizar un giro o un cambio de carril en Minnesota, ¿con cuántos
    pies de antelación debe activar su señal antes de realizar el movimiento?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Minnesota exige que los conductores señalen su intención
    de girar o cambiar de carril al menos 100 pies antes de realizar la maniobra.
- id: 81
  category: safe_driving_rules
  question: 'En Minnesota, si conduce por una carretera de dos carriles con un límite
    de velocidad de 55 mph o superior, puede exceder el límite por 10 mph únicamente
    cuando:'
  choices:
    A: Es después de la medianoche y el tráfico es ligero
    B: Está rebasando a otro vehículo que viaja en la misma dirección
    C: Conduce un vehículo de emergencia sin sirenas
    D: Se encuentra en una zona de construcción
  answer: B
  explanation: La ley de Minnesota permite a un conductor aumentar su velocidad en
    10 mph sobre el límite establecido para rebasar a otro vehículo que se mueve en
    la misma dirección en carreteras de dos carriles con un límite de velocidad de
    55 mph o superior.
- id: 82
  category: safe_driving_rules
  question: Al estacionar cuesta arriba en una carretera con bordillo (acera), ¿en
    qué dirección debe girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: Lejos del bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba con bordillo, gire las ruedas hacia afuera
    del bordillo para que, si el vehículo rueda, la parte trasera de la llanta delantera
    golpee el bordillo y detenga el automóvil.
- id: 83
  category: safe_driving_rules
  question: Bajo la ley 'Not a Drop' (Ni una gota) de Minnesota, ¿cuál es el límite
    legal de alcohol para un conductor menor de 21 años?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: A
  explanation: La ley 'Not a Drop' de Minnesota establece que es ilegal que cualquier
    persona menor de 21 años opere un vehículo motorizado con cualquier cantidad detectable
    de alcohol en su sistema.
- id: 84
  category: safe_driving_rules
  question: En Minnesota, ¿a cuántos pies de distancia de un vehículo que viene en
    sentido contrario debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: D
  explanation: Debe bajar las luces altas cuando se encuentre a menos de 1,000 pies
    de un vehículo que viene en sentido contrario o a menos de 200 pies de un vehículo
    al que está siguiendo.
- id: 85
  category: safe_driving_rules
  question: ¿Cuándo dos vehículos llegan a una intersección al mismo tiempo y no hay
    semáforo ni señal, qué conductor tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja a una velocidad mayor
    D: El conductor que toque la bocina primero
  answer: B
  explanation: En Minnesota, en una intersección no controlada, el conductor de la
    izquierda debe ceder el paso al conductor de la derecha.
- id: 86
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe activar su señal de giro antes de realizar
    un giro en Minnesota?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: La ley de Minnesota exige que los conductores señalen su intención
    de girar al menos 100 pies antes del giro real.
- id: 87
  category: safe_driving_rules
  question: Al estacionar un vehículo en una vía pública en Minnesota, ¿a qué distancia
    deben estar las ruedas del bordillo?
  choices:
    A: No más de 6 pulgadas
    B: No más de 12 pulgadas
    C: No más de 18 pulgadas
    D: No más de 24 pulgadas
  answer: B
  explanation: Al estacionar en paralelo en una vía pública, las ruedas de su vehículo
    deben estar a menos de 12 pulgadas del bordillo.
- id: 88
  category: safe_driving_rules
  question: En Minnesota, ¿es ilegal estacionar a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley de Minnesota prohíbe estacionar un vehículo a menos de 10 pies
    de un hidrante de incendios.
- id: 89
  category: safe_driving_rules
  question: ¿A menos de cuántos pies de un paso de peatones en una intersección no
    puede estacionar su vehículo en Minnesota?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: En Minnesota, está prohibido estacionar a menos de 20 pies de un paso
    de peatones en una intersección.
- id: 90
  category: safe_driving_rules
  question: En Minnesota, ¿no debe estacionar a menos de cuántos pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: Se prohíbe a los conductores estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico ubicada al costado
    de una calzada.
- id: 91
  category: safe_driving_rules
  question: ¿A qué distancia debe detener su vehículo en Minnesota cuando un autobús
    escolar se detiene con las luces rojas intermitentes y el brazo de parada extendido?
  choices:
    A: Al menos 10 pies
    B: Al menos 20 pies
    C: Al menos 25 pies
    D: Al menos 50 pies
  answer: B
  explanation: La ley de Minnesota exige que los conductores se detengan a una distancia
    mínima de 20 pies de un autobús escolar que muestre luces rojas intermitentes
    y un brazo de parada extendido.
- id: 92
  category: safe_driving_rules
  question: Al rebasar a otro vehículo en una carretera de dos carriles en Minnesota,
    ¿antes de cuántos pies de distancia de un vehículo que viene en sentido contrario
    debe regresar al lado derecho de la carretera?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: A
  explanation: La ley de Minnesota establece que debe regresar al carril derecho antes
    de estar a menos de 100 pies de un vehículo que viene en sentido contrario al
    rebasar.
- id: 93
  category: safe_driving_rules
  question: En Minnesota, ¿está prohibido rebasar en una colina o curva donde no se
    puede ver claramente por al menos cuántos pies?
  choices:
    A: 500 pies
    B: 700 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: B
  explanation: No puede rebasar en una colina o curva donde no pueda ver claramente
    por al menos 700 pies.
- id: 94
  category: safe_driving_rules
  question: En Minnesota, los giros en U son ilegales a menos que pueda ver claramente
    en ambas direcciones por al menos cuántos pies?
  choices:
    A: 500 pies
    B: 700 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Los giros en U están prohibidos a menos que puedan realizarse de manera
    segura y sin interferir con el resto del tráfico, y solo donde el conductor tenga
    al menos 1,000 pies de visibilidad clara en ambas direcciones.
- id: 95
  category: safe_driving_rules
  question: Bajo la 'Ley de Hacerse a un Lado' (Ley Ted Foss) en Minnesota, ¿qué debe
    hacer al acercarse a un vehículo de emergencia detenido con sus luces intermitentes
    en una carretera de varios carriles?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener la velocidad pero tocar la bocina
    C: Cambiarse al carril más alejado del vehículo si es seguro hacerlo
    D: Acelerar para pasar el vehículo rápidamente
  answer: C
  explanation: La Ley Ted Foss exige que los conductores se muevan al carril más alejado
    de un vehículo de emergencia detenido con luces intermitentes si hay un carril
    disponible; si no, el conductor debe reducir la velocidad.
- id: 96
  category: defensive_driving
  question: Según el Manual del Conductor de Minnesota, ¿cuál es la distancia de seguimiento
    recomendada bajo condiciones de conducción ideales?
  choices:
    A: El largo de un vehículo por cada 10 mph
    B: La regla de los dos segundos
    C: La regla de los tres segundos
    D: La regla de los cinco segundos
  answer: C
  explanation: El manual de Minnesota recomienda la 'regla de los tres segundos' como
    distancia de seguimiento estándar en condiciones ideales para permitir suficiente
    tiempo para reaccionar ante peligros.
- id: 97
  category: defensive_driving
  question: Según la ley de Minnesota, ¿debe tener sus faros delanteros encendidos
    durante cuál de las siguientes condiciones?
  choices:
    A: Solo entre la puesta del sol y el amanecer
    B: Siempre que esté lloviendo, nevando, cayendo aguanieve o granizando
    C: Solo cuando la visibilidad sea inferior a 200 pies
    D: Solo cuando conduzca en autopistas
  answer: B
  explanation: La ley de Minnesota exige que los faros delanteros estén encendidos
    cuando llueve, nieva, cae aguanieve o graniza, y en cualquier momento en que no
    pueda ver claramente la carretera por delante a una distancia de al menos 500
    pies.
- id: 98
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a ocurrir el hidroplaneo (hydroplaning)
    en las carreteras mojadas de Minnesota?
  choices:
    A: A velocidades tan bajas como 35 mph
    B: Solo a velocidades superiores a 55 mph
    C: Solo durante aguaceros intensos a 65 mph
    D: A velocidades tan bajas como 20 mph
  answer: A
  explanation: Según el Manual del Conductor de Minnesota, el hidroplaneo (donde los
    neumáticos pierden contacto con la carretera y flotan sobre el agua) puede comenzar
    a velocidades tan bajas como 35 mph.
- id: 99
  category: defensive_driving
  question: Para mantener un 'escaneo' y una conciencia adecuados, ¿qué tan adelante
    en la carretera sugiere mirar el Manual del Conductor de Minnesota?
  choices:
    A: De 5 a 8 segundos adelante
    B: De 10 a 15 segundos adelante
    C: De 20 a 30 segundos adelante
    D: Exactamente una milla adelante
  answer: B
  explanation: Se recomienda a los conductores mirar de 10 a 15 segundos hacia adelante
    para anticipar el flujo del tráfico y los posibles peligros.
- id: 100
  category: defensive_driving
  question: Si su vehículo queda varado en una tormenta invernal severa en Minnesota,
    ¿cuál es el curso de acción más seguro?
  choices:
    A: Caminar hasta la casa más cercana para pedir ayuda sin importar la distancia
    B: Permanecer en el vehículo y mantener el tubo de escape libre de nieve
    C: Dejar el motor encendido continuamente para mantenerse caliente
    D: Mantener todas las ventanas bien cerradas para atrapar el calor
  answer: B
  explanation: En una situación de supervivencia invernal, debe permanecer con su
    vehículo. Es fundamental mantener el tubo de escape libre de nieve para evitar
    el envenenamiento por monóxido de carbono y abrir ligeramente una ventana para
    que entre aire fresco.
- id: 101
  category: defensive_driving
  question: ¿Qué ajuste de luces debe utilizar al conducir con niebla densa en Minnesota?
  choices:
    A: Luces altas para atravesar la niebla
    B: Solo luces de estacionamiento
    C: Luces bajas
    D: Solo luces de emergencia
  answer: C
  explanation: Se deben usar las luces bajas en la niebla. Las luces altas se reflejan
    en las partículas de niebla, creando un efecto de 'pared blanca' que reduce aún
    más la visibilidad.
- id: 102
  category: defensive_driving
  question: Al rebasar a un ciclista en Minnesota, ¿cuál es la distancia mínima legal
    que debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Minnesota exige un mínimo de 3 pies de espacio libre entre
    su vehículo y una bicicleta al rebasar.
- id: 103
  category: defensive_driving
  question: Si se ve involucrado en un derrape en una carretera helada de Minnesota,
    ¿hacia dónde debe girar el volante?
  choices:
    A: En la dirección opuesta al derrape
    B: En la dirección en la que desea que vaya la parte delantera del vehículo
    C: Mantener el volante perfectamente recto
    D: Girar el volante bruscamente hacia la izquierda
  answer: B
  explanation: Si comienza a derrapar, retire el pie del acelerador y gire el volante
    en la dirección en la que desea que vaya la parte delantera del vehículo.
- id: 104
  category: defensive_driving
  question: ¿Qué es la 'incorporación en cremallera' (zipper merge) recomendada por
    el MnDOT cuando un carril está cerrado debido a una construcción?
  choices:
    A: Incorporarse lo antes posible al carril abierto
    B: Detenerse en el carril cerrado y esperar a que alguien le deje pasar
    C: Permanecer en su carril hasta el punto de incorporación y luego turnarse con
      los demás conductores
    D: Acelerar para adelantarse a la fila antes de que termine el carril
  answer: C
  explanation: La incorporación en cremallera (zipper merge) anima a los conductores
    a utilizar ambos carriles hasta el punto de unión y luego turnarse, lo que reduce
    la congestión del tráfico y mejora la seguridad.
- id: 105
  category: defensive_driving
  question: Al conducir por carreteras de Minnesota donde hay presencia de ciervos,
    ¿cuál es la mejor práctica de conducción defensiva?
  choices:
    A: Maniobrar bruscamente siempre para evitar golpear a un ciervo
    B: Tocar la bocina continuamente mientras conduce por zonas boscosas
    C: Observar los lados de la carretera y estar preparado para frenar, pero no maniobrar
      bruscamente hacia el tráfico en sentido contrario
    D: Conducir con las luces de emergencia encendidas en todo momento
  answer: C
  explanation: El manual de Minnesota aconseja a los conductores evitar maniobras
    bruscas (dar un volantazo) si se encuentran con un ciervo, ya que esto puede provocar
    colisiones frontales o vuelcos más graves. Frenar con firmeza es la opción más
    segura.
- id: 106
  category: defensive_driving
  question: Al entrar en una rotonda en Minnesota, ¿a quién debe ceder el paso?
  choices:
    A: Al tráfico que entra por la derecha
    B: A los vehículos que ya están en la rotonda
    C: Solo a los vehículos de emergencia
    D: A nadie; usted tiene la prioridad al entrar
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el paso a los
    vehículos que ya están circulando dentro de la intersección.
- id: 107
  category: defensive_driving
  question: En condiciones normales, ¿qué distancia de seguimiento recomienda el Manual
    del Conductor de Minnesota para garantizar un espacio seguro entre usted y el
    vehículo de adelante?
  choices:
    A: La regla de un segundo
    B: La regla de dos segundos
    C: La regla de tres segundos
    D: La regla de cinco segundos
  answer: C
  explanation: El Manual del Conductor de Minnesota recomienda la 'regla de los tres
    segundos' en condiciones normales de conducción para mantener una distancia de
    seguimiento segura.
- id: 108
  category: defensive_driving
  question: Según el Manual del Conductor de Minnesota, ¿a qué velocidad puede comenzar
    el hidroplaneo (hydroplaning), donde los neumáticos pierden contacto con la superficie
    de la carretera en pavimento mojado?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    A velocidades de 55 mph o superiores, los neumáticos pueden perder todo contacto
    con la carretera.
- id: 109
  category: defensive_driving
  question: 'En Minnesota, las luces delanteras deben encenderse durante cualquier
    condición climática (lluvia, nieve, aguanieve, granizo o niebla) y en cualquier
    momento en que no pueda ver claramente la carretera por delante a una distancia
    de al menos:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Minnesota exige que las luces delanteras estén encendidas
    cuando la visibilidad se reduce a 500 pies o menos, y durante las precipitaciones.
- id: 110
  category: defensive_driving
  question: Para observar la carretera correctamente y evitar maniobras de último
    momento, ¿cuántos segundos de antelación sugiere mirar hacia adelante el Manual
    del Conductor de Minnesota?
  choices:
    A: De 3 a 5 segundos
    B: De 5 a 8 segundos
    C: De 10 a 15 segundos
    D: De 20 a 30 segundos
  answer: C
  explanation: Observar la carretera con 10 a 15 segundos de antelación le permite
    anticipar peligros y ajustar su conducción en consecuencia.
- id: 111
  category: defensive_driving
  question: 'La ley de Minnesota permite a un conductor aumentar su velocidad en 10
    mph por encima del límite indicado solo cuando:'
  choices:
    A: Conduce en una autopista de varios carriles
    B: Rebasa a otro vehículo en una carretera de dos carriles con un límite indicado
      de 55 mph o superior
    C: Conduce en una zona residencial rural
    D: El conductor llega tarde a una emergencia
  answer: B
  explanation: El límite de velocidad se aumenta en 10 mph cuando el conductor rebasa
    legalmente a otro vehículo en la misma dirección en una carretera de dos carriles
    con un límite de velocidad indicado de 55 mph o superior.
- id: 112
  category: defensive_driving
  question: En Minnesota, ¿se prohíbe seguir a menos de cuántos pies de un camión
    de bomberos u otro equipo de bomberos que se desplaza en respuesta a una alarma?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Minnesota establece que no debe seguir a menos de 500 pies
    a cualquier equipo de bomberos que se desplace en respuesta a una alarma de incendio.
- id: 113
  category: defensive_driving
  question: 'Para mantener una tracción segura y evitar el hidroplaneo (hydroplaning),
    la ley de Minnesota exige que los neumáticos tengan una profundidad mínima de
    la banda de rodadura de:'
  choices:
    A: 1/32 de pulgada
    B: 1/16 de pulgada
    C: 1/8 de pulgada
    D: 1/4 de pulgada
  answer: B
  explanation: En Minnesota, es ilegal conducir un vehículo con neumáticos que tengan
    menos de 1/16 de pulgada de profundidad en la banda de rodadura.
- id: 114
  category: defensive_driving
  question: 'En Minnesota, no puede dar una vuelta en U a menos que pueda ser visto
    por los conductores que se aproximan desde cualquier dirección durante al menos:'
  choices:
    A: 500 pies
    B: 700 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Las vueltas en U están prohibidas a menos que puedan realizarse de
    manera segura y sin interferir con el resto del tráfico, y solo donde usted sea
    visible a 1,000 pies en ambas direcciones.
- id: 115
  category: alcohol_drugs_health
  question: 'Según la Ley de Consentimiento Implícito (Implied Consent Law) de Minnesota,
    si se niega a someterse a una prueba química de intoxicación, sus privilegios
    de conducción serán revocados por al menos:'
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: Un año
  answer: D
  explanation: Bajo la Ley de Consentimiento Implícito, la negativa a realizarse una
    prueba de aliento, sangre u orina resulta en la revocación de los privilegios
    de conducción por un mínimo de un año.
- id: 116
  category: alcohol_drugs_health
  question: Según la Ley de Vanessa (Vanessa's Law), un conductor adolescente sin
    licencia que recibe una infracción relacionada con el alcohol no puede obtener
    la licencia hasta los 18 años. A los 18 años, ¿cuál de estos es un requisito que
    debe cumplir?
  choices:
    A: Pagar una tarifa de reinstalación de hasta $680
    B: Aprobar el examen de conocimientos
    C: Mantener un permiso de instrucción durante seis meses
    D: Todas las anteriores
  answer: D
  explanation: Bajo la Ley de Vanessa, un infractor por alcohol debe esperar hasta
    los 18 años, pagar la tarifa de reinstalación de $680, aprobar el examen de conocimientos,
    mantener un permiso durante 6 meses y luego aprobar el examen práctico de manejo.
- id: 117
  category: alcohol_drugs_health
  question: 'Para una primera infracción de DWI en Minnesota con un BAC inferior a
    0.16, el período mínimo de revocación de la licencia de conducir suele ser de:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Una primera infracción de DWI con un BAC inferior a 0.16 generalmente
    conlleva un período de revocación de 90 días (que a veces puede reducirse con
    una declaración de culpabilidad).
- id: 118
  category: alcohol_drugs_health
  question: 'En Minnesota, es ilegal poseer un recipiente abierto de una bebida alcohólica
    en un vehículo motorizado a menos que el recipiente esté:'
  choices:
    A: En la guantera
    B: En el maletero (o en un área que normalmente no esté ocupada por pasajeros)
    C: En el suelo del asiento trasero
    D: Sujetado por un pasajero mayor de 21 años
  answer: B
  explanation: La Ley de Recipiente Abierto (Open Container Law) prohíbe botellas
    o latas de alcohol abiertas en el área de pasajeros; deben mantenerse en el maletero
    u otra área no ocupada por pasajeros.
- id: 119
  category: alcohol_drugs_health
  question: En Minnesota, si un conductor es arrestado por primera vez por DWI y su
    BAC es de ______ o superior, enfrenta sanciones 'agravantes' mucho más severas.
  choices:
    A: '0.10'
    B: '0.12'
    C: '0.16'
    D: '0.20'
  answer: C
  explanation: Un BAC de 0.16 o superior se considera un factor agravante en Minnesota,
    lo que conlleva multas duplicadas, períodos de revocación más largos y el uso
    obligatorio del interbloqueo de encendido (ignition interlock) o la confiscación
    del vehículo.
- id: 120
  category: alcohol_drugs_health
  question: 'Para los conductores de vehículos motorizados comerciales (CMV) en Minnesota,
    el límite legal de BAC es:'
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Las leyes federales y del estado de Minnesota establecen un límite
    de BAC más estricto de 0.04% para los conductores que operan vehículos motorizados
    comerciales.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los medicamentos
    recetados y la conducción en Minnesota?
  choices:
    A: No puede ser acusado de un DWI si el medicamento fue recetado por un médico
    B: Puede ser acusado de un DWI si el medicamento afecta su capacidad para conducir
      de manera segura
    C: Los medicamentos recetados solo afectan la conducción si se mezclan con alcohol
    D: Solo las drogas ilegales 'callejeras' resultan en un cargo de DWI
  answer: B
  explanation: Las leyes de DWI de Minnesota se aplican al alcohol, sustancias controladas
    y sustancias peligrosas. Si un medicamento recetado afecta su conducción, puede
    ser arrestado por DWI.
- id: 122
  category: alcohol_drugs_health
  question: 'En Minnesota, una infracción por DWI se considera un delito grave (felony)
    si es la del conductor:'
  choices:
    A: Segunda infracción en un plazo de 5 años
    B: Tercera infracción en un plazo de 10 años
    C: Cuarta infracción en un plazo de 10 años
    D: Cualquier infracción que involucre un choque
  answer: C
  explanation: Una cuarta condena por DWI dentro de un período de 10 años es un delito
    grave en Minnesota, lo que puede resultar en hasta siete años de prisión.
- id: 123
  category: alcohol_drugs_health
  question: Si se le revoca la licencia por un DWI, es posible que deba participar
    en el Programa de Dispositivo de Bloqueo de Encendido (Ignition Interlock Device).
    ¿Cuál es la función principal de este dispositivo?
  choices:
    A: Rastrea la ubicación del vehículo a través de GPS
    B: Limita la velocidad del vehículo a 55 mph
    C: Evita que el vehículo arranque si detecta alcohol en el aliento del conductor
    D: Graba video del conductor mientras el automóvil está en movimiento
  answer: C
  explanation: Un Dispositivo de Bloqueo de Encendido (IID) es un alcoholímetro instalado
    en un vehículo que evita que el motor arranque si el BAC del conductor excede
    un límite bajo preestablecido.
- id: 124
  category: alcohol_drugs_health
  question: El alcohol es un depresor. ¿Cuál de las siguientes es típicamente la primera
    capacidad afectada por el consumo de alcohol?
  choices:
    A: La visión
    B: El juicio
    C: La coordinación muscular
    D: El tiempo de reacción
  answer: B
  explanation: El juicio es la primera capacidad que se ve afectada por el alcohol.
    Los conductores pueden correr riesgos que de otro modo no correrían y no reconocer
    que su capacidad está disminuyendo.
- id: 125
  category: alcohol_drugs_health
  question: 'Según la ley de Minnesota, negarse a someterse a una prueba química (aliento,
    sangre u orina) por intoxicación es:'
  choices:
    A: Solo una infracción civil
    B: Un delito
    C: Legal si no ha estado en un choque
    D: Sancionable únicamente con una multa de $50
  answer: B
  explanation: En Minnesota, negarse a realizar una prueba química ordenada por el
    tribunal es un delito y conlleva sanciones penales además de la revocación administrativa
    de la licencia.
- id: 126
  category: alcohol_drugs_health
  question: 'Si usted es un conductor de Minnesota con una condición médica como diabetes
    tratada con insulina o epilepsia, debe:'
  choices:
    A: Nunca conducir de noche
    B: Solo conducir con un pasajero
    C: Informar la condición y proporcionar una declaración del médico a los Servicios
      de Vehículos y Conductores (DVS)
    D: Esperar hasta tener 21 años para obtener una licencia
  answer: C
  explanation: Los conductores con ciertas condiciones médicas deben presentar una
    declaración médica de un médico al DVS para garantizar que la condición esté controlada
    y que puedan conducir de manera segura.
- id: 127
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de 'Consentimiento Implícito' (Implied Consent)
    de Minnesota para los conductores?
  choices:
    A: Usted acepta obedecer todos los límites de velocidad
    B: Usted acepta someterse a una prueba de aliento, sangre u orina si un oficial
      tiene una causa probable para creer que está bajo los efectos del alcohol o
      drogas
    C: Usted acepta portar un seguro en todo momento
    D: Usted acepta permitir que los pasajeros beban alcohol siempre que usted permanezca
      sobrio
  answer: B
  explanation: La ley de Consentimiento Implícito significa que si conduce un vehículo
    motorizado en Minnesota, usted consiente en someterse a una prueba química de
    sangre, aliento u orina para determinar la presencia de alcohol o sustancias controladas.
- id: 128
  category: alcohol_drugs_health
  question: En Minnesota, ¿cuál es la multa máxima por una primera infracción de DWI
    (delito menor)?
  choices:
    A: $500
    B: $1,000
    C: $3,000
    D: $5,000
  answer: B
  explanation: Una primera infracción de DWI en Minnesota es un delito menor sancionable
    con hasta 90 días de cárcel y/o una multa de $1,000.
- id: 129
  category: alcohol_drugs_health
  question: Según la ley de Minnesota, ¿dónde es legal mantener un recipiente abierto
    de alcohol en un vehículo motorizado?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: En el maletero o en un área que normalmente no ocupan los pasajeros
    D: En la consola central
  answer: C
  explanation: La ley de Recipiente Abierto de Minnesota prohíbe tener botellas o
    recipientes abiertos de alcohol en el área de pasajeros. Deben mantenerse en el
    maletero u otra área no ocupada por pasajeros.
- id: 130
  category: alcohol_drugs_health
  question: En Minnesota, un conductor puede ser acusado de un DWI por delito grave
    (felony) si comete una cuarta infracción de DWI en un plazo de ¿cuántos años?
  choices:
    A: 5 años
    B: 10 años
    C: 15 años
    D: 20 años
  answer: B
  explanation: Una cuarta infracción de DWI dentro de un período de diez años puede
    resultar en un cargo de DWI por delito grave en Minnesota.
- id: 131
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes se considera un 'factor agravante' que puede dar
    lugar a sanciones por DWI más severas en Minnesota?
  choices:
    A: Conducir con un BAC de 0.16 o superior
    B: Tener a un niño menor de 16 años en el vehículo
    C: Tener una condena previa por DWI en los últimos 10 años
    D: Todas las anteriores
  answer: D
  explanation: Los factores agravantes en Minnesota incluyen un BAC de 0.16 o superior,
    condenas previas por DWI en un plazo de 10 años y tener a un niño menor de 16
    años en el vehículo en el momento de la infracción.
- id: 132
  category: alcohol_drugs_health
  question: Si un oficial de la ley de Minnesota le pide que se someta a una prueba
    de aliento 'previa al arresto' (PBT) y usted se niega, ¿qué sucede?
  choices:
    A: Su licencia se revoca automáticamente por 1 año
    B: El oficial aún puede arrestarlo basándose en otras pruebas y luego exigir una
      prueba formal
    C: Se le multará con $500 en el acto
    D: Nada, la PBT es completamente voluntaria y no tiene consecuencias
  answer: B
  explanation: Si bien la negativa a realizar la prueba de evidencia formal (después
    del arresto) conlleva la revocación, la negativa a la prueba de aliento previa
    al arresto en la carretera aún puede dar lugar a un arresto basado en otras observaciones,
    lo que luego activa los requisitos de la Ley de Consentimiento Implícito.
- id: 133
  category: alcohol_drugs_health
  question: Para un conductor de vehículo motorizado comercial en Minnesota, ¿cuál
    es el límite de BAC con el que se le puede acusar de un DWI?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: Los conductores de vehículos motorizados comerciales están sujetos
    a un límite de BAC más estricto de 0.04% en Minnesota.
- id: 134
  category: alcohol_drugs_health
  question: Cuando se consume alcohol, ¿cuál de las siguientes funciones suele ser
    la primera en verse afectada?
  choices:
    A: La visión
    B: La coordinación muscular
    C: El juicio
    D: La audición
  answer: C
  explanation: El alcohol afecta el sistema nervioso central. El juicio suele ser
    la primera función que se deteriora, incluso antes que la coordinación física
    o la visión.
- id: 135
  category: alcohol_drugs_health
  question: ¿Es legal conducir en Minnesota si está usando un medicamento recetado
    que le causa somnolencia?
  choices:
    A: Sí, siempre que el medicamento haya sido recetado legalmente por un médico
    B: Sí, si solo conduce durante las horas del día
    C: No, es ilegal conducir bajo la influencia de cualquier sustancia que afecte
      su capacidad para conducir de manera segura
    D: No, a menos que tenga una nota por escrito de su farmacéutico
  answer: C
  explanation: La ley de Minnesota prohíbe conducir bajo la influencia de cualquier
    sustancia controlada o droga, incluidos los medicamentos recetados legales, si
    estos afectan su capacidad para operar un vehículo de manera segura.
- id: 136
  category: alcohol_drugs_health
  question: ¿Qué es el 'efecto sinérgico' en el contexto de la seguridad al conducir?
  choices:
    A: El efecto de mezclar diferentes tipos de alcohol
    B: El efecto combinado del alcohol y otra droga, que es mayor que la suma de cada
      uno por separado
    C: La velocidad a la que el hígado procesa el alcohol
    D: El tiempo de recuperación después de una condena por DWI
  answer: B
  explanation: El efecto sinérgico ocurre cuando el alcohol se combina con otras drogas
    (incluso las de venta libre), lo que resulta en niveles de deterioro mucho más
    altos de lo que causaría cualquiera de las sustancias por sí sola.
- id: 137
  category: alcohol_drugs_health
  question: 'En Minnesota, a un conductor menor de 21 años que sea condenado por una
    segunda infracción de la ley ''Ni una gota'' (Not a Drop), se le suspenderá la
    licencia por:'
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: Un año
  answer: C
  explanation: Una segunda infracción de la ley 'Ni una gota' para un conductor menor
    de 21 años resulta en una suspensión de 180 días de los privilegios de conducir.
- id: 138
  category: penalties_and_points
  question: En Minnesota, si lo sorprenden conduciendo a más de 100 mph, se le revocarán
    sus privilegios de conducir por al menos ¿cuánto tiempo?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Según el Manual del Conductor de Minnesota, si lo sorprenden conduciendo
    a más de 100 mph, sus privilegios de conducir serán revocados por un mínimo de
    seis meses.
- id: 139
  category: penalties_and_points
  question: Bajo la Ley de Consentimiento Implícito de Minnesota, ¿qué sucede si se
    niega a someterse a una prueba química de sangre, aliento u orina?
  choices:
    A: Su licencia será suspendida por 30 días.
    B: Sus privilegios de conducir serán revocados por al menos un año.
    C: Se le pedirá que pague una multa de $100 solamente.
    D: Nada, siempre que sea su primera infracción.
  answer: B
  explanation: La Ley de Consentimiento Implícito de Minnesota establece que si usted
    se niega a realizarse una prueba química para determinar la concentración de alcohol,
    sus privilegios de conducir serán revocados por un período de uno a seis años.
- id: 140
  category: penalties_and_points
  question: 'Para una segunda o subsiguiente infracción de la ley de ''Manos Libres''
    de Minnesota (enviar mensajes de texto o usar un dispositivo inalámbrico), la
    multa es de:'
  choices:
    A: ' $50 más honorarios judiciales'
    B: ' $150 más honorarios judiciales'
    C: ' $275 más honorarios judiciales'
    D: ' $500 más honorarios judiciales'
  answer: C
  explanation: Si bien la primera infracción por violar la ley de manos libres es
    una multa de $50, la segunda y las siguientes infracciones conllevan una multa
    de $275 más los costos judiciales.
- id: 141
  category: penalties_and_points
  question: ¿Se puede suspender una licencia de conducir de Minnesota si el conductor
    es condenado por cuántas infracciones de tránsito en un período de 12 meses?
  choices:
    A: 2 infracciones
    B: 3 infracciones
    C: 4 infracciones
    D: 5 infracciones
  answer: C
  explanation: Minnesota no utiliza un sistema de puntos, pero el DVS puede suspender
    la licencia de un conductor que sea condenado por cuatro infracciones de tránsito
    en un plazo de 12 meses, o cinco en un plazo de 24 meses.
- id: 142
  category: penalties_and_points
  question: 'Si se le revoca la licencia por un DWI (conducir bajo los efectos del
    alcohol o drogas), puede ser elegible para recuperar los privilegios de conducir
    inscribiéndose en el:'
  choices:
    A: Programa de Conductor Seguro (Safe Driver Program)
    B: Programa del Dispositivo de Bloqueo de Encendido (Ignition Interlock Device
      Program)
    C: Curso de Concientización sobre la Velocidad de Minnesota
    D: Programa de Infractores Habituales
  answer: B
  explanation: El Programa del Dispositivo de Bloqueo de Encendido permite que los
    conductores con licencias revocadas debido a infracciones por alcohol recuperen
    su estatus legal para conducir mediante la instalación de un dispositivo de prueba
    de aliento en su vehículo.
- id: 143
  category: penalties_and_points
  question: Bajo la ley de 'Manos Libres' (Hands-Free) de Minnesota, ¿cuál es la multa
    por una segunda o subsiguiente infracción por usar un dispositivo de comunicación
    inalámbrica mientras se conduce?
  choices:
    A: $50 más cargos judiciales
    B: $125 más cargos judiciales
    C: $225 más cargos judiciales
    D: $275 más cargos judiciales
  answer: D
  explanation: Mientras que la primera infracción por violar la ley de manos libres
    es de $50 más cargos judiciales, la segunda y las siguientes infracciones conllevan
    una multa de $275 más cargos judiciales.
- id: 144
  category: penalties_and_points
  question: En Minnesota, una persona con una concentración de alcohol en sangre (BAC)
    de ____ o superior que tenga el control de un vehículo en movimiento o estacionado
    puede ser arrestada por DWI.
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: D
  explanation: En Minnesota, el límite legal de BAC mientras se opera o se tiene el
    control físico de un vehículo motorizado es de 0.08% para conductores de 21 años
    o más.
- id: 145
  category: penalties_and_points
  question: ¿Cuál es la multa por una infracción de la 'Ley de Hacerse a un Lado'
    (Move Over Law) en Minnesota, que exige que los conductores se muevan al carril
    más alejado de los vehículos de emergencia detenidos?
  choices:
    A: $50
    B: Más de $100
    C: $500
    D: $1,000
  answer: B
  explanation: Violar la 'Ley de Hacerse a un Lado' (Ley Ted Foss) en Minnesota es
    un delito menor leve (petty misdemeanor), y la multa suele ser superior a $100.
- id: 146
  category: penalties_and_points
  question: 'En Minnesota, si se le condena por exceso de velocidad en una zona de
    construcción señalizada, la multa se:'
  choices:
    A: Exime para los infractores por primera vez
    B: Mantiene igual que una multa normal por exceso de velocidad
    C: Duplica
    D: Establece en un monto fijo de $300 independientemente de la velocidad
  answer: C
  explanation: La ley de Minnesota dicta que las multas por exceso de velocidad en
    una zona de obras se duplican cuando hay trabajadores presentes o cuando se coloca
    una señalización específica.
- id: 147
  category: penalties_and_points
  question: 'En Minnesota, es ilegal poseer un recipiente abierto de alcohol o consumir
    alcohol dentro de un vehículo motorizado cuando se encuentra en una vía pública.
    Esto se conoce como la:'
  choices:
    A: Ley de Tolerancia Cero
    B: Ley de Recipiente Abierto (Open Container Law)
    C: Ley de Responsabilidad de Establecimientos (Dram Shop Act)
    D: Ley de Consentimiento Implícito (Implied Consent Law)
  answer: B
  explanation: La Ley de Recipiente Abierto establece que es un delito tener un recipiente
    abierto de una bebida alcohólica en el área de pasajeros de un vehículo motorizado
    en una vía pública, independientemente de si el vehículo está en movimiento o
    estacionado.
- id: 148
  category: penalties_and_points
  question: 'Un DWI por primera vez en Minnesota se clasifica normalmente como un:'
  choices:
    A: Delito menor leve (Petty Misdemeanor)
    B: Delito menor (Misdemeanor)
    C: Delito menor grave (Gross Misdemeanor)
    D: Delito grave (Felony)
  answer: B
  explanation: Un DWI por primera vez con un BAC inferior a 0.16 suele ser un delito
    menor en Minnesota, punible con hasta 90 días de cárcel y/o una multa de $1,000.
- id: 149
  category: penalties_and_points
  question: Para los conductores de vehículos motorizados comerciales en Minnesota,
    ¿cuál es la concentración máxima de alcohol en sangre (BAC) permitida antes de
    que se considere que conducen bajo la influencia?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: El límite legal de BAC para los conductores de vehículos motorizados
    comerciales en Minnesota es de 0.04%, que es más estricto que el límite de 0.08%
    para los conductores estándar de Clase D.
- id: 150
  category: penalties_and_points
  question: ¿Qué es la ley 'Ni una gota' (Not-a-Drop) en Minnesota?
  choices:
    A: Una ley que prohíbe los recipientes abiertos en el maletero
    B: Una ley que exige el consumo cero de alcohol para conductores menores de 21
      años
    C: Una ley que prohíbe cualquier tipo de alcohol en vehículos comerciales
    D: Una ley que exige la revocación inmediata de la licencia por cualquier BAC
      superior al 0.08%
  answer: B
  explanation: La ley 'Ni una gota' de Minnesota establece que es ilegal que una persona
    menor de 21 años opere un vehículo motorizado con cualquier cantidad detectable
    de alcohol en su sistema.
- id: 151
  category: sharing_the_road
  question: ¿En Minnesota, a cuántos pies de distancia es ilegal seguir a un camión
    de bomberos u otro vehículo de emergencia que responda a una alarma?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Minnesota prohíbe seguir a un aparato de bomberos (camión
    de bomberos) que se desplaza en una salida de emergencia a una distancia menor
    de 500 pies.
- id: 152
  category: sharing_the_road
  question: Si usted está conduciendo y un peatón está cruzando la carretera en una
    intersección sin un paso de peatones marcado, ¿cuál es la regla en Minnesota?
  choices:
    A: El peatón debe ceder el paso a todos los vehículos motorizados
    B: Usted debe ceder el derecho de paso al peatón
    C: Usted solo cede el paso si el peatón está en un paso de peatones marcado
    D: Debe tocar la bocina para advertir al peatón que se quite del camino
  answer: B
  explanation: En Minnesota, cada esquina se considera un paso de peatones, ya sea
    que esté marcado o no. Los conductores deben ceder el derecho de paso a los peatones
    que cruzan en las intersecciones.
- id: 153
  category: sharing_the_road
  question: Según la ley de Minnesota, ¿cuál de los siguientes motociclistas está
    obligado a usar casco?
  choices:
    A: Solo el pasajero, independientemente de su edad
    B: Solo el operador, independientemente de su edad
    C: Todos los conductores menores de 18 años y aquellos con un permiso de aprendizaje
    D: El uso del casco es opcional para todos los conductores mayores de 16 años
  answer: C
  explanation: En Minnesota, se requiere el uso de casco de motocicleta para todos
    los operadores y pasajeros menores de 18 años, y para todos los operadores que
    conducen con un permiso de instrucción de motocicleta.
- id: 154
  category: sharing_the_road
  question: Al conducir cerca de camiones comerciales grandes, ¿qué son las 'No-Zones'?
  choices:
    A: Áreas donde no se permite la circulación de camiones
    B: Puntos ciegos donde el conductor del camión no puede ver su vehículo
    C: Carriles especiales reservados para vehículos de alta ocupación
    D: Áreas de estacionamiento específicas para camiones de carga
  answer: B
  explanation: Las 'No-Zones' son los grandes puntos ciegos alrededor de un camión
    comercial (adelante, atrás y a los lados) donde el conductor tiene visibilidad
    limitada o nula de otros vehículos.
- id: 155
  category: sharing_the_road
  question: ¿En qué situación NO se le exige detenerse ante un autobús escolar con
    sus luces rojas intermitentes en Minnesota?
  choices:
    A: Cuando se encuentra en el lado opuesto de una carretera dividida separada por
      una barrera física
    B: Cuando está detrás del autobús en una carretera de cuatro carriles
    C: Cuando el autobús está detenido en una zona residencial
    D: Cuando viaja en la dirección opuesta en una carretera de dos carriles no dividida
  answer: A
  explanation: Los conductores que viajan en la dirección opuesta a un autobús escolar
    en una carretera dividida (separada por una barrera física como una mediana) no
    están obligados a detenerse.
- id: 156
  category: sharing_the_road
  question: ¿Es legal en Minnesota el 'lane splitting' (conducir una motocicleta entre
    filas de vehículos detenidos o en movimiento)?
  choices:
    A: Sí, pero solo si el tráfico se mueve a menos de 15 mph
    B: Sí, es legal para todas las motocicletas
    C: No, es ilegal en Minnesota
    D: Sí, pero solo en autopistas con 3 o más carriles
  answer: C
  explanation: El 'lane splitting' es ilegal en Minnesota. Sin embargo, se permite
    que dos motocicletas circulen una al lado de la otra en un solo carril.
- id: 157
  category: sharing_the_road
  question: Si un vehículo de emergencia con sirenas y luces se le acerca mientras
    usted está en medio de una intersección, ¿qué debe hacer?
  choices:
    A: Detenerse inmediatamente en la intersección
    B: Girar a la izquierda para despejar el camino
    C: Cruzar la intersección y luego hacerse a un lado a la derecha
    D: Retroceder para salir de la intersección
  answer: C
  explanation: Si se encuentra en una intersección cuando se acerca un vehículo de
    emergencia, no se detenga. Cruce la intersección antes de hacerse a un lado a
    la derecha de la carretera.
- id: 158
  category: sharing_the_road
  question: Cuando se está preparando para girar a la derecha y un ciclista está en
    el carril de bicicletas a su derecha, ¿qué debe hacer?
  choices:
    A: Acelerar para pasar al ciclista antes de girar
    B: Ceder el paso al ciclista y esperar a que pase antes de girar
    C: Tocar la bocina para indicar al ciclista que se detenga
    D: Girar inmediatamente; el ciclista debe ceder el paso a los vehículos que giran
  answer: B
  explanation: Los conductores deben ceder el paso a los ciclistas al girar. No debe
    'cortar' la trayectoria de un ciclista girando frente a él; espere a que despejen
    la intersección.
- id: 159
  category: sharing_the_road
  question: En Minnesota, ¿qué debe hacer cuando ve a un peatón con un bastón blanco
    o un perro guía?
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Darles el derecho de paso y detenerse al menos a 10 pies de distancia
    D: Ceder el derecho de paso y tener extrema precaución para garantizar su seguridad
  answer: D
  explanation: La ley de Minnesota exige que los conductores cedan el derecho de paso
    a los peatones ciegos que llevan un bastón blanco o utilizan un perro guía. Debe
    tener extrema precaución.
- id: 160
  category: sharing_the_road
  question: ¿Por qué los camiones grandes a menudo se abren hacia la izquierda antes
    de girar a la derecha?
  choices:
    A: Para verificar el tráfico en el carril izquierdo
    B: Porque la ley se los exige
    C: Para evitar que sus ruedas traseras suban al bordillo
    D: Para indicar a otros conductores que se mantengan atrás
  answer: C
  explanation: Debido a su longitud, los camiones grandes deben abrirse hacia la izquierda
    para evitar pasar por encima del bordillo o golpear objetos en la acera con sus
    ruedas traseras durante un giro a la derecha.
- id: 161
  category: sharing_the_road
  question: La "Ley de Moverse a un Lado" (Move Over Law) de Minnesota se aplica a
    ¿cuál de los siguientes vehículos estacionarios con luces intermitentes?
  choices:
    A: Solo ambulancias y camiones de bomberos
    B: Solo patrullas de policía
    C: Grúas, vehículos de servicio y vehículos de mantenimiento de carreteras
    D: Todas las anteriores
  answer: D
  explanation: La Ley de Moverse a un Lado se aplica a todos los vehículos de emergencia,
    así como a grúas, vehículos de servicio y vehículos de mantenimiento de carreteras
    que estén detenidos a un lado de la carretera con luces intermitentes.
- id: 162
  category: sharing_the_road
  question: 'En Minnesota, si usted está conduciendo y se encuentra con un peatón
    con un bastón blanco o un perro guía, debe:'
  choices:
    A: Tocar la bocina para hacerles saber que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse por completo y ceder el paso
    D: Rodearlos si hay suficiente espacio
  answer: C
  explanation: La ley de Minnesota establece que los conductores deben detenerse por
    completo y ceder el paso a cualquier peatón que lleve un bastón blanco o utilice
    un perro guía.
- id: 163
  category: sharing_the_road
  question: Al seguir a un camión de bomberos (fire apparatus) que responde a una
    emergencia en Minnesota, ¿cuál es la distancia mínima que debe mantener?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Minnesota prohíbe seguir a un camión de bomberos que responde
    a una alarma a una distancia menor de 500 pies.
- id: 164
  category: sharing_the_road
  question: 'En Minnesota, las "Zonas Prohibidas" (No-Zones) de un camión comercial
    se refieren a:'
  choices:
    A: Áreas donde no se permite circular a los camiones
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: Zonas de carga para vehículos comerciales
    D: Puentes con restricción de peso
  answer: B
  explanation: La "Zona Prohibida" (No-Zone) se refiere a los grandes puntos ciegos
    alrededor de un camión comercial donde el conductor no puede ver a otros vehículos.
- id: 165
  category: sharing_the_road
  question: 'Cuando una bicicleta circula por una carretera de Minnesota, generalmente
    tiene:'
  choices:
    A: Ningún derecho legal a estar en la carretera
    B: Los mismos derechos y deberes que el conductor de un vehículo motorizado
    C: El derecho a ignorar las señales de tráfico
    D: El requisito de circular siempre por la acera
  answer: B
  explanation: Según la ley de Minnesota, los ciclistas generalmente tienen los mismos
    derechos y responsabilidades que los conductores de vehículos motorizados.
- id: 166
  category: sharing_the_road
  question: 'En Minnesota, si un vehículo de emergencia con sirenas y luces intermitentes
    se aproxima por detrás en una calle de doble sentido, usted debe:'
  choices:
    A: Detenerse exactamente donde está
    B: Orillarse a la derecha y detenerse
    C: Aumentar la velocidad para quitarse del camino
    D: Orillarse a la izquierda y detenerse
  answer: B
  explanation: Cuando un vehículo de emergencia con sirenas o luces activas se aproxima,
    usted debe orillarse a la derecha y detenerse hasta que el vehículo haya pasado.
- id: 167
  category: sharing_the_road
  question: Según la ley de Minnesota, ¿quién tiene el derecho de paso en una intersección
    sin cruces peatonales marcados?
  choices:
    A: El automovilista, porque no hay un cruce peatonal marcado
    B: El peatón, porque cada intersección se considera un cruce peatonal
    C: Quien llegue primero a la intersección
    D: El automovilista, pero solo si toca la bocina primero
  answer: B
  explanation: En Minnesota, cada intersección se considera un cruce peatonal, ya
    sea que esté marcado o no, y los automovilistas deben ceder el paso a los peatones.
- id: 168
  category: sharing_the_road
  question: 'Al girar a la derecha cruzando un carril para bicicletas en Minnesota,
    usted debe:'
  choices:
    A: Girar rápidamente desde su carril actual sin mirar
    B: Señalizar, verificar si hay ciclistas y entrar en el carril de bicicletas antes
      de girar
    C: Detenerse en medio de la carretera y esperar a que pasen todas las bicicletas
    D: Ceder siempre el paso a las bicicletas, pero nunca entrar en el carril de bicicletas
  answer: B
  explanation: El Manual del Conductor de Minnesota instruye a los conductores a señalizar,
    verificar si hay ciclistas y entrar en el carril de bicicletas (si está despejado)
    antes de realizar un giro a la derecha.
- id: 169
  category: sharing_the_road
  question: 'En Minnesota, es ilegal rebasar a un autobús escolar por la derecha cuando
    el autobús muestra:'
  choices:
    A: Solo luces de advertencia de peligro (hazard lights)
    B: Luces intermitentes ámbar (amarillas) de pre-advertencia
    C: Una luz direccional
    D: Cualquier tipo de luces
  answer: B
  explanation: En Minnesota, es ilegal rebasar a un autobús escolar por la derecha
    cuando este muestra luces intermitentes ámbar (amarillas).
- id: 170
  category: sharing_the_road
  question: 'Cuando un camión comercial está realizando un giro a la derecha en una
    intersección, usted debe tener en cuenta que:'
  choices:
    A: Siempre permanecerá en el carril del extremo derecho
    B: Es posible que necesite abrirse ampliamente hacia la izquierda para completar
      el giro
    C: Puede detenerse más rápido que un automóvil de pasajeros
    D: Tiene un punto ciego más pequeño en el lado derecho
  answer: B
  explanation: Debido a su longitud, los camiones grandes a menudo necesitan abrirse
    ampliamente hacia la izquierda para librar el bordillo al realizar un giro a la
    derecha.
- id: 171
  category: vehicle_information
  question: 'En Minnesota, debe bajar las luces altas cuando sigue a otro vehículo
    a una distancia de:'
  choices:
    A: 200 pies o menos
    B: 300 pies o menos
    C: 500 pies o menos
    D: 1,000 pies o menos
  answer: A
  explanation: Al seguir a otro vehículo desde atrás, debe usar las luces bajas si
    se encuentra a una distancia de 200 pies o menos de ese vehículo.
- id: 172
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodamiento para los
    neumáticos de un vehículo de pasajeros en Minnesota?
  choices:
    A: 1/32 de pulgada
    B: 1/16 de pulgada
    C: 1/8 de pulgada
    D: 1/4 de pulgada
  answer: B
  explanation: La ley de Minnesota establece que los neumáticos se consideran inseguros
    si tienen una profundidad de banda de rodamiento inferior a 1/16 de pulgada.
- id: 173
  category: vehicle_information
  question: En Minnesota, para la mayoría de los automóviles de pasajeros, ¿cuál es
    el nivel máximo de polarizado permitido en las ventanas laterales y traseras?
  choices:
    A: No más del 20% de transmisión de luz
    B: No más del 35% de transmisión de luz
    C: No menos del 50% de transmisión de luz
    D: No menos del 70% de transmisión de luz
  answer: C
  explanation: La ley de Minnesota generalmente prohíbe el polarizado de ventanas
    en automóviles de pasajeros que permita menos del 50% de transmisión de luz o
    que tenga una reflectancia luminosa de más del 20%.
- id: 174
  category: vehicle_information
  question: 'Todo vehículo motorizado en Minnesota debe estar equipado con un silenciador
    que evite:'
  choices:
    A: Cualquier escape visible
    B: Emisiones de dióxido de carbono
    C: Solo explosiones repentinas del escape
    D: Ruidos fuertes o explosivos y humo excesivo
  answer: D
  explanation: La ley de Minnesota exige que todos los vehículos motorizados tengan
    un silenciador en buen estado de funcionamiento para evitar ruidos fuertes o explosivos
    y humo anormal o excesivo.
- id: 175
  category: vehicle_information
  question: 'En Minnesota, la luz blanca que ilumina la placa trasera debe hacer que
    la placa sea visible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 200 pies
  answer: B
  explanation: La placa trasera debe estar iluminada por una luz blanca para que sea
    claramente legible desde una distancia de 50 pies hacia atrás.
- id: 176
  category: vehicle_information
  question: 'La ley de Minnesota exige que todo vehículo motorizado esté equipado
    con una bocina que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La bocina de un vehículo debe ser audible en condiciones normales desde
    una distancia de al menos 200 pies.
- id: 177
  category: vehicle_information
  question: Según la ley de Minnesota, ¿cuál de las siguientes afirmaciones es verdadera
    con respecto a los parabrisas?
  choices:
    A: Se permiten carteles o calcomanías en cualquier parte del parabrisas
    B: Se prohíben las grietas que obstruyan la visión del conductor
    C: Los limpiaparabrisas son opcionales si se usa un aerosol repelente de lluvia
    D: El parabrisas puede estar completamente polarizado para bloquear los rayos
      UV
  answer: B
  explanation: La ley de Minnesota prohíbe conducir un vehículo con un parabrisas
    que esté agrietado o descolorido de una manera que obstruya la visión clara del
    conductor.
- id: 178
  category: vehicle_information
  question: ¿Con qué dos tipos de sistemas de frenos funcionales deben estar equipados
    todos los vehículos de pasajeros en Minnesota?
  choices:
    A: Frenos delanteros y frenos traseros
    B: Freno de pie y freno de estacionamiento/emergencia
    C: Freno manual y freno automático
    D: Freno hidráulico y freno de aire
  answer: B
  explanation: 'La ley de Minnesota exige que todos los vehículos motorizados estén
    equipados con dos sistemas de frenos separados: un freno de pie y un freno de
    estacionamiento/emergencia.'
- id: 179
  category: vehicle_information
  question: En Minnesota, ¿de qué color deben ser las luces requeridas en la parte
    delantera de un vehículo para indicar las señales de giro?
  choices:
    A: Blanco o ámbar
    B: Rojo o ámbar
    C: Azul o blanco
    D: Verde o ámbar
  answer: A
  explanation: Las señales de giro delanteras en Minnesota deben ser blancas o ámbar,
    mientras que las señales de giro traseras deben ser rojas o ámbar.
- id: 180
  category: vehicle_information
  question: 'Según la ley de Minnesota, si un vehículo está equipado con bolsas de
    aire (airbags), es ilegal:'
  choices:
    A: Conducir sin un pasajero en el asiento delantero
    B: Instalar una funda para el volante
    C: Quitar o desactivar el sistema de bolsas de aire
    D: Conducir con la luz de la bolsa de aire encendida
  answer: C
  explanation: Es ilegal en Minnesota desactivar o quitar intencionalmente una bolsa
    de aire que fue instalada como equipo original en un vehículo.
- id: 181
  category: vehicle_information
  question: ¿En Minnesota, qué vehículos deben estar equipados con guardabarros u
    otros protectores de ruedas (mud flaps) para evitar salpicaduras hacia atrás?
  choices:
    A: Solo motocicletas
    B: Solo autos de pasajeros
    C: Camiones, tractores y remolques
    D: Todos los vehículos, incluyendo bicicletas
  answer: C
  explanation: La ley de Minnesota exige que los camiones, tractores de camión y remolques
    tengan guardabarros u otros dispositivos (mud flaps) para evitar que las ruedas
    lancen agua, suciedad u otros materiales a los parabrisas de los vehículos que
    los siguen.
- id: 182
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos está prohibido para su uso en un vehículo
    de pasajeros privado en Minnesota?
  choices:
    A: Luces antiniebla
    B: Luces rojas visibles desde el frente
    C: Control electrónico de estabilidad
    D: Espejos laterales ajustables
  answer: B
  explanation: A excepción de los vehículos de emergencia autorizados, ningún vehículo
    en Minnesota puede estar equipado con una lámpara que muestre una luz roja hacia
    el frente.
- id: 183
  category: vehicle_information
  question: ¿En Minnesota, cuál es el requisito para la visibilidad de las placas
    de matrícula de su vehículo?
  choices:
    A: Solo la placa trasera debe ser visible
    B: Las placas deben mantenerse limpias y libres de grasa, polvo u otro material
      que las empañe
    C: Las placas pueden cubrirse con una cubierta de plástico tintado siempre que
      sean legibles
    D: Las placas solo necesitan ser visibles durante las horas del día
  answer: B
  explanation: La ley de Minnesota exige que las placas de matrícula se mantengan
    limpias y legibles en todo momento. Es ilegal cubrirlas con cualquier material,
    incluyendo cubiertas de plástico transparentes o tintadas, que obstruya su visibilidad.
- id: 184
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los requisitos
    de las placas de matrícula para los vehículos de pasajeros registrados en Minnesota?
  choices:
    A: Solo se requiere una placa trasera
    B: Solo se requiere una placa delantera
    C: Se deben mostrar tanto la placa delantera como la trasera
    D: Las placas solo se requieren en la parte trasera si el vehículo tiene más de
      10 años
  answer: C
  explanation: 'La ley de Minnesota exige que la mayoría de los vehículos, incluidos
    los autos de pasajeros estándar, muestren dos placas de matrícula: una en la parte
    delantera y otra en la trasera.'
- id: 185
  category: vehicle_information
  question: Según la ley de Minnesota, ¿dónde se le permite colocar calcomanías en
    su parabrisas?
  choices:
    A: En cualquier lugar, siempre que sean más pequeñas de 3 pulgadas
    B: Solo en las esquinas inferiores del parabrisas
    C: Solo detrás del espejo retrovisor
    D: Nunca se permiten calcomanías en el parabrisas
  answer: B
  explanation: La ley de Minnesota prohíbe objetos o calcomanías en el parabrisas
    que obstruyan la vista del conductor, excepto las etiquetas o calcomanías requeridas
    por el estado colocadas en las esquinas inferiores.
- id: 186
  category: vehicle_information
  question: ¿En Minnesota, el freno de pie de un vehículo debe ser capaz de detener
    el auto en pavimento seco en cuántos pies cuando viaja a 20 mph?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: C
  explanation: El Manual del Conductor de Minnesota establece que el freno de pie
    debe ser capaz de detener un vehículo que viaja a 20 mph en un tramo de 40 pies.
- id: 187
  category: vehicle_information
  question: 'La ley de Minnesota exige que todos los vehículos motorizados estén equipados
    con silenciadores para evitar:'
  choices:
    A: El sobrecalentamiento del motor
    B: Emisiones excesivas de dióxido de carbono
    C: Ruido fuerte o explosivo y humo excesivo
    D: Evaporación de combustible
  answer: C
  explanation: Se requieren silenciadores en todos los vehículos motorizados en Minnesota
    para evitar ruidos fuertes o explosivos y para evitar que el humo excesivo o el
    monóxido de carbono entren al vehículo.
- id: 188
  category: vehicle_information
  question: En Minnesota, si las luces direccionales de su vehículo no funcionan,
    debe usar señales manuales. ¿Qué señal manual indica un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido recto hacia afuera
  answer: B
  explanation: Para señalar un giro a la derecha usando señales manuales en Minnesota,
    el conductor extiende el brazo izquierdo por la ventana y lo apunta hacia arriba.
- id: 189
  category: vehicle_information
  question: 'La ley de Minnesota exige que su vehículo esté equipado con un desempañador
    para mantener el parabrisas libre de:'
  choices:
    A: Lluvia y aguanieve
    B: Suciedad y escombros
    C: Vapor, escarcha y hielo
    D: Bichos e insectos
  answer: C
  explanation: Todos los vehículos motorizados en Minnesota deben estar equipados
    con un desempañador en buen estado de funcionamiento para mantener el parabrisas
    libre de vapor, escarcha e hielo.
- id: 190
  category: vehicle_information
  question: 'Según el Manual del Conductor de Minnesota, los faros sucios pueden reducir
    la salida de luz hasta en un:'
  choices:
    A: 25%
    B: 50%
    C: 75%
    D: 90%
  answer: C
  explanation: El manual señala que los faros sucios pueden reducir la salida de luz
    hasta en un 75%, disminuyendo significativamente la visibilidad durante la conducción
    nocturna.
- id: 191
  category: vehicle_information
  question: 'En Minnesota, los vehículos de pasajeros deben estar equipados con guardabarros
    u otros dispositivos para evitar:'
  choices:
    A: La resistencia aerodinámica
    B: Que el agua, la suciedad u otro material sean lanzados al aire
    C: Colisiones de impacto lateral
    D: El remolque no autorizado
  answer: B
  explanation: La ley de Minnesota exige que los vehículos tengan guardabarros o dispositivos
    similares (como faldones para lodo) para evitar que las ruedas lancen agua, suciedad
    u otros materiales a otros vehículos o peatones.
- id: 192
  category: signs_and_signals
  question: En Minnesota, se debe exhibir un emblema de "Vehículo de movimiento lento"
    en todos los vehículos que viajen a velocidades de ____ o menos.
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: D
  explanation: Según el Manual del Conductor de Minnesota, el emblema de vehículo
    de movimiento lento (un triángulo naranja rojizo) debe exhibirse en todos los
    vehículos que viajen a velocidades de 30 mph o menos, como implementos agrícolas
    o vehículos tirados por caballos.
- id: 193
  category: signs_and_signals
  question: La señal de "Zona de no rebasar" (No Passing Zone) en Minnesota es única
    por su forma y ubicación. ¿Cuál es su descripción?
  choices:
    A: Una señal rectangular en el lado derecho de la carretera
    B: Una señal en forma de banderín (pennant) en el lado izquierdo de la carretera
    C: Una señal en forma de diamante en el lado derecho de la carretera
    D: Una señal circular en el lado izquierdo de la carretera
  answer: B
  explanation: En Minnesota, la señal de "Zona de no rebasar" tiene forma de banderín
    y se coloca en el lado izquierdo de la carretera de frente al conductor, marcando
    el inicio de una zona donde está prohibido adelantar.
- id: 194
  category: signs_and_signals
  question: Cuando se encuentra con una flecha amarilla intermitente en una intersección
    de Minnesota, ¿qué indica?
  choices:
    A: Usted tiene el derecho de paso para girar a la izquierda
    B: Debe detenerse y esperar a una flecha verde
    C: Puede girar a la izquierda después de ceder el paso al tráfico en sentido contrario
      y a los peatones
    D: La intersección no funciona correctamente; trátela como una parada de cuatro
      vías
  answer: C
  explanation: Una flecha amarilla intermitente significa que puede girar en la dirección
    de la flecha después de ceder el paso al tráfico en sentido contrario y a los
    peatones. El tráfico que viene de frente tiene luz verde.
- id: 195
  category: signs_and_signals
  question: En Minnesota, cuando un autobús escolar se prepara para detenerse para
    subir o bajar niños, activará sus luces amarillas intermitentes. ¿Qué debe hacer
    usted?
  choices:
    A: Acelerar para pasar el autobús antes de que se enciendan las luces rojas
    B: Detenerse inmediatamente, incluso si las luces son solo amarillas
    C: Prepararse para detenerse y reducir su velocidad
    D: Tocar la bocina para advertir al conductor del autobús que está pasando
  answer: C
  explanation: Las luces amarillas intermitentes en un autobús escolar indican que
    el autobús se está preparando para detenerse. Los conductores deben reducir la
    velocidad y prepararse para detenerse cuando las luces cambien a rojo y se extienda
    el brazo de parada.
- id: 196
  category: signs_and_signals
  question: ¿Qué indica una línea blanca continua entre carriles de tráfico que se
    mueven en la misma dirección en Minnesota?
  choices:
    A: Los cambios de carril están prohibidos
    B: Se desaconsejan los cambios de carril
    C: Usted está en una calle de un solo sentido
    D: El carril es solo para vehículos de emergencia
  answer: B
  explanation: En Minnesota, una línea blanca continua indica que se desaconsejan
    los cambios de carril en las áreas donde este tipo de señalización está presente,
    aunque no es estrictamente ilegal a menos que otras señales lo prohíban.
- id: 197
  category: signs_and_signals
  question: Si las luces direccionales de su vehículo no funcionan, ¿cuál es la señal
    manual correcta para un giro a la derecha en Minnesota?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: Para señalar un giro a la derecha usando señales manuales, el conductor
    debe extender el brazo izquierdo por la ventana y doblarlo hacia arriba a la altura
    del codo.
- id: 198
  category: signs_and_signals
  question: ¿Qué significa una señal de "Cruz de San Andrés" (Crossbuck) en un cruce
    de ferrocarril en Minnesota?
  choices:
    A: Es una señal de pare; siempre debe detenerse
    B: Es lo mismo que una señal de ceda el paso; debe ceder el paso a cualquier tren
      que se aproxime
    C: Indica el número de vías en el cruce
    D: Significa que el cruce ya no está en uso
  answer: B
  explanation: Una señal de cruz de San Andrés se trata como una señal de ceda el
    paso. Los conductores deben ceder el paso a cualquier tren que se aproxime y no
    están obligados a detenerse a menos que haya un tren presente u otras señales
    indiquen una parada.
- id: 199
  category: signs_and_signals
  question: En Minnesota, ¿qué indica un símbolo de diamante blanco pintado en el
    pavimento?
  choices:
    A: Un cruce de peatones más adelante
    B: Un cruce de ferrocarril más adelante
    C: El carril está reservado para vehículos específicos (HOV, autobús o bicicleta)
    D: Un área de alta accidentalidad
  answer: C
  explanation: El símbolo del diamante indica un carril restringido, como los carriles
    para vehículos de alta ocupación (HOV), carriles para autobuses o carriles para
    bicicletas.
- id: 200
  category: signs_and_signals
  question: Al entrar en una rotonda de varios carriles en Minnesota, ¿cuál de las
    siguientes es una regla correcta con respecto a las señales y el ceder el paso?
  choices:
    A: Ceda el paso al tráfico que ya está en la rotonda y señale su intención de
      salir
    B: El tráfico en la rotonda debe ceder el paso a quienes entran
    C: No es necesario señalar al salir de una rotonda
    D: Entre siempre a la rotonda por el carril izquierdo independientemente de su
      salida
  answer: A
  explanation: Los conductores que entran en una rotonda deben ceder el paso al tráfico
    que ya está dentro. La ley de Minnesota también exige que los conductores usen
    su señal de giro a la derecha al salir de una rotonda para informar a otros conductores
    de su intención.
- id: 201
  category: signs_and_signals
  question: ¿En Minnesota, cuándo se le permite girar a la derecha con luz roja?
  choices:
    A: Nunca, debe esperar a la luz verde
    B: Solo si hay una señal que lo permita específicamente
    C: Después de detenerse por completo y ceder el paso al tráfico y a los peatones,
      a menos que haya una señal de 'No girar en rojo' (No Turn on Red) publicada
    D: Solo entre las 9:00 PM y las 6:00 AM
  answer: C
  explanation: La ley de Minnesota permite a los conductores girar a la derecha con
    luz roja después de detenerse por completo y ceder el paso a todo el tráfico y
    a los peatones, siempre que ninguna señal prohíba el giro.
- id: 202
  category: signs_and_signals
  question: 'Una luz amarilla fija en una intersección en Minnesota significa:'
  choices:
    A: Acelerar para despejar la intersección antes de que cambie a rojo
    B: La señal está a punto de cambiar a rojo; debe detenerse si es seguro hacerlo
    C: Usted tiene el derecho de paso para completar su giro
    D: Detenerse inmediatamente, incluso si se encuentra en medio de la intersección
  answer: B
  explanation: Una luz amarilla fija significa que la señal está cambiando de verde
    a rojo. Debe detenerse si puede hacerlo de manera segura. Si ya se encuentra en
    la intersección, debe continuar a través de ella.
- id: 203
  category: signs_and_signals
  question: ¿Qué forma de señal se utiliza exclusivamente para las señales de 'Ceda
    el paso' (Yield) en Minnesota?
  choices:
    A: Diamante
    B: Octágono
    C: Triángulo equilátero con la punta hacia abajo
    D: Pentágono
  answer: C
  explanation: La señal de ceda el paso es un triángulo equilátero que apunta hacia
    abajo, generalmente de color rojo y blanco.
- id: 204
  category: signs_and_signals
  question: ¿En Minnesota, de qué color son las señales utilizadas para proporcionar
    información sobre zonas de construcción y mantenimiento?
  choices:
    A: Amarillo
    B: Naranja
    C: Verde
    D: Azul
  answer: B
  explanation: El naranja es el color estándar para las señales de construcción y
    mantenimiento en Minnesota para alertar a los conductores sobre trabajadores y
    equipos más adelante.
- id: 205
  category: signs_and_signals
  question: ¿Qué indican las líneas amarillas sólidas dobles en el centro de una calzada
    en Minnesota?
  choices:
    A: Se permite rebasar desde cualquier dirección
    B: Se permite rebasar solo en la dirección de viaje
    C: Se prohíbe rebasar en ambas direcciones
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas sólidas dobles significan que está prohibido rebasar
    para los vehículos que viajan en cualquier dirección.
- id: 206
  category: signs_and_signals
  question: ¿Qué significa una luz amarilla intermitente en una intersección en Minnesota?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Lo mismo que una señal de alto (pare).
    C: Proceder con precaución, cediendo el paso a los peatones y vehículos que ya
      están en la intersección.
    D: Acelerar para despejar la intersección antes de que cambie a rojo.
  answer: C
  explanation: Una luz amarilla intermitente advierte a los conductores que procedan
    con precaución. No es necesario detenerse, pero debe ceder el paso a los vehículos
    y peatones que ya se encuentren en la intersección.
- id: 207
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de flecha amarilla intermitente en
    Minnesota?
  choices:
    A: Usted tiene el derecho de paso para girar.
    B: Debe detenerse y esperar a una flecha verde.
    C: Se permiten los giros, pero primero debe ceder el paso al tráfico que viene
      en sentido contrario y a los peatones.
    D: La señal está a punto de cambiar a rojo.
  answer: C
  explanation: Una flecha amarilla intermitente significa que puede girar en la dirección
    de la flecha después de ceder el paso al tráfico que viene en sentido contrario
    y a los peatones.
- id: 208
  category: signs_and_signals
  question: Cuando vea una señal de 'Incorporación en cremallera' (Zipper Merge) en
    Minnesota, ¿cómo debe comportarse al acercarse al cierre de un carril?
  choices:
    A: Incorpórese al carril continuo lo antes posible.
    B: Permanezca en su carril actual hasta el punto de incorporación, luego túrnese
      con los otros conductores.
    C: Deténgase y espere a que alguien le haga una señal para entrar.
    D: Acelere para adelantarse en la fila antes de que termine el carril.
  answer: B
  explanation: El MnDOT fomenta la 'incorporación en cremallera' (Zipper Merge) durante
    la congestión, donde los conductores usan ambos carriles hasta el punto de incorporación
    y luego se turnan, lo que reduce los embotellamientos.
- id: 209
  category: signs_and_signals
  question: ¿En Minnesota, qué significa una señal de flecha roja fija?
  choices:
    A: Puede girar después de detenerse por completo.
    B: Debe detenerse y permanecer detenido hasta que la señal cambie a una flecha
      verde o luz verde.
    C: Puede girar si no viene tráfico desde la dirección opuesta.
    D: La flecha es solo una advertencia para los peatones.
  answer: B
  explanation: Una flecha roja fija significa que debe detenerse y no puede realizar
    el giro hasta que la señal cambie a verde.
- id: 210
  category: signs_and_signals
  question: ¿De qué color son las señales de Minnesota que proporcionan información
    sobre sitios de recreación pública e interés cultural?
  choices:
    A: Azul
    B: Verde
    C: Marrón
    D: Amarillo
  answer: C
  explanation: Las señales marrones se utilizan para señalar sitios históricos, parques
    y otros puntos de interés cultural o recreativo.
- id: 211
  category: signs_and_signals
  question: 'Un carril central entre carriles de tráfico que se mueven en direcciones
    opuestas, marcado por líneas amarillas continuas y discontinuas, está reservado
    para:'
  choices:
    A: Rebasar vehículos más lentos.
    B: Solo vehículos de emergencia.
    C: Solo giros a la izquierda.
    D: Solo giros en U.
  answer: C
  explanation: Este es un carril central de giro, utilizado exclusivamente por vehículos
    que realizan giros a la izquierda desde cualquier dirección.
- id: 212
  category: signs_and_signals
  question: ¿Cuál es la forma de una señal estándar de 'Ceda el paso' (Yield) en Minnesota?
  choices:
    A: Diamante
    B: Pentágono
    C: Triángulo con la punta hacia abajo
    D: Círculo
  answer: C
  explanation: Una señal de ceda el paso es un triángulo equilátero con la punta hacia
    abajo.
- id: 213
  category: signs_and_signals
  question: Al acercarse a un autobús escolar con sus luces rojas intermitentes y
    el brazo de parada extendido, la ley de Minnesota exige que se detenga al menos
    a ____ pies del autobús.
  choices:
    A: 10 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: B
  explanation: La ley de Minnesota exige que los conductores se detengan al menos
    a 20 pies de distancia de un autobús escolar cuando este muestra luces rojas intermitentes
    y un brazo de parada extendido.
- id: 214
  category: signs_and_signals
  question: ¿De qué color son las 'Señales de Servicio' en Minnesota que lo dirigen
    a gasolina, comida y alojamiento?
  choices:
    A: Verde
    B: Azul
    C: Marrón
    D: Blanco
  answer: B
  explanation: Las señales azules se utilizan para proporcionar información sobre
    servicios para automovilistas, como gasolina, comida, alojamiento y hospitales.
- id: 215
  category: signs_and_signals
  question: 'Un ''Carril de Desvío'' (Bypass Lane) en una carretera de Minnesota le
    permite:'
  choices:
    A: Rebasar a un vehículo por la izquierda a altas velocidades.
    B: Rodear a un vehículo que está esperando para girar a la izquierda.
    C: Salir de la carretera sin reducir la velocidad.
    D: Conducir por el arcén (shoulder) durante las horas pico.
  answer: B
  explanation: En Minnesota, algunas carreteras de dos carriles tienen carriles de
    desvío a la derecha para permitir que el tráfico directo rodee a los vehículos
    que esperan para girar a la izquierda.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que se aproxima
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 216
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen con seguridad.
  id: 217
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en rampas de salida de autopistas o calles de un solo sentido donde entrar
    lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 218
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 219
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 220
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Vueltas en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de vuelta en U tachada
    significa que las vueltas en U están prohibidas en este lugar.
  id: 221
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 222
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permiten vueltas en U
    B: No se permiten giros a la izquierda
    C: No se permiten giros a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 223
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 224
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Gire a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 225
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 226
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cerca
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 227
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de caminata cerca
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 228
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 229
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 230
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de tren. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 231
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 232
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 233
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino curve primero
    hacia un lado y luego hacia el otro.
  id: 234
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 235
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una carretera dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 236
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Fin de la carretera dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 237
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una carretera dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    carretera dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 238
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: La carretera dividida termina y se reanuda el tráfico de doble sentido
    C: Una zona de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la carretera dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 239
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de sentido único o de una carretera dividida y se
    encuentre con vehículos que viajan en la dirección opuesta.
  id: 240
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 241
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 242
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo
    donde el semáforo puede no ser visible desde la distancia.
  id: 243
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 244
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las carreteras
    laterales.
  id: 245
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la autopista desde la carretera lateral.
  id: 246
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir la incorporación de vehículos. El tráfico que entra
    desde la rampa tiene su propio carril nuevo.
  id: 247
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 248
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para discapacitados válida pueden
    estacionar en estos espacios. Las infracciones conllevan multas elevadas.
  id: 249
