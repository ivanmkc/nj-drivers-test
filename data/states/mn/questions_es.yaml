questions:
- id: 1
  category: sharing_the_road
  question: ¿Cuál es el requisito de edad mínima para conducir una bicicleta con asistencia
    eléctrica en Minnesota?
  choices:
    A: 12 años
    B: 14 años
    C: 15 años
    D: 16 años
  answer: C
  explanation: Según el manual, las bicicletas con asistencia eléctrica no son ciclomotores
    y pueden conducirse en la mayoría de los senderos para bicicletas, pero es necesario
    tener al menos 15 años para operar una.
- id: 2
  category: safe_driving_rules
  question: Según las reglas de sistemas de sujeción pasiva para niños de Minnesota,
    ¿los niños menores de qué edad deben viajar en el asiento trasero si este se encuentra
    disponible?
  choices:
    A: 8 años
    B: 10 años
    C: 12 años
    D: 13 años
  answer: D
  explanation: El manual establece que los niños menores de 13 años ahora deben viajar
    en el asiento trasero si hay uno disponible.
- id: 3
  category: sharing_the_road
  question: ¿Por qué los conductores deben mantenerse especialmente alerta y ser cuidadosos
    al compartir la carretera con usuarios vulnerables de la vía, como ciclistas,
    peatones y personas en sillas de ruedas?
  choices:
    A: Ellos siempre tienen el derecho de paso en todas las intersecciones.
    B: No cuentan con cinturones de seguridad ni bolsas de aire para su protección.
    C: No están obligados a seguir ninguna ley de tránsito.
    D: Viajan a velocidades más rápidas que los vehículos motorizados.
  answer: B
  explanation: El manual explica que los usuarios vulnerables de la vía no tienen
    cinturones de seguridad ni bolsas de aire, por lo que los conductores deben estar
    alerta y tener cuidado al compartir la carretera con ellos.
- id: 4
  category: license_system
  question: ¿Qué cambia la ley de "Licencia de Conducir para Todos" (Driver's License
    for All) con respecto a la solicitud de una licencia de conducir estándar o una
    identificación estatal?
  choices:
    A: Elimina el requisito de aprobar un examen práctico de manejo.
    B: Elimina la necesidad de presentar pruebas de presencia legal en los EE. UU.
    C: Hace que todas las licencias de conducir sean gratuitas.
    D: Permite que las personas menores de 15 años obtengan una licencia estándar.
  answer: B
  explanation: La ley de Licencia de Conducir para Todos elimina la necesidad de mostrar
    pruebas de presencia legal en los EE. UU., lo que permite a las personas obtener
    una tarjeta independientemente de su estatus migratorio.
- id: 5
  category: license_system
  question: ¿Cuál de los siguientes documentos puede utilizarse ahora como factura
    de servicios públicos para demostrar la residencia para una tarjeta que cumple
    con REAL ID?
  choices:
    A: Una nota escrita a mano de un arrendador
    B: Una etiqueta de suscripción a una revista
    C: Facturas de internet y televisión por cable
    D: Un carné de biblioteca
  answer: C
  explanation: A partir del 1 de agosto de 2023, los solicitantes pueden utilizar
    las facturas de internet y televisión por cable como facturas de servicios públicos
    para demostrar su residencia para una tarjeta que cumple con REAL ID.
- id: 6
  category: driver_responsibility
  question: ¿Por qué un conductor podría optar por incluir información del cuidador
    en el registro de su licencia de conducir o tarjeta de identificación?
  choices:
    A: Para recibir un descuento en las tarifas de registro del vehículo.
    B: Para permitir que las autoridades sepan que alguien en casa depende de ellos
      en caso de sufrir un accidente.
    C: Para estacionar legalmente en espacios designados para personas con discapacidad.
    D: Para estar exento de realizar el examen de conducir escrito.
  answer: B
  explanation: Agregar información del cuidador a los registros del DVS permite que
    los oficiales de policía sepan, si usted se ve involucrado en un accidente, que
    hay alguien en casa que depende de usted, asegurando que no se queden solos.
- id: 7
  category: license_system
  question: Los veteranos con una discapacidad total del 100 por ciento relacionada
    con el servicio están exentos de los impuestos sobre ventas, registro y rodaje
    (wheelage) para ¿hasta cuántos vehículos?
  choices:
    A: Un vehículo
    B: Dos vehículos
    C: Tres vehículos
    D: Vehículos ilimitados
  answer: B
  explanation: Los veteranos con una discapacidad total relacionada con el servicio
    están exentos de los impuestos sobre ventas, registro y rodaje (wheelage) para
    hasta dos vehículos.
- id: 8
  category: driver_testing
  question: ¿Bajo qué condición está exento un nuevo residente de Minnesota de realizar
    el examen escrito al solicitar una licencia de conducir de Minnesota?
  choices:
    A: Si tiene 18 años o más y posee un permiso de aprendizaje válido de otro estado.
    B: Si tiene 21 años o más y posee una licencia válida y no vencida de otro estado
      de los EE. UU.
    C: Si ha vivido en Minnesota durante más de 6 meses.
    D: Si tiene un historial de manejo limpio durante los últimos 5 años.
  answer: B
  explanation: Si usted tiene 21 años o más y posee una licencia válida y no vencida
    de otro estado de los EE. UU., ya no necesitará realizar el examen escrito al
    solicitar una licencia de conducir de Minnesota.
- id: 9
  category: license_system
  question: Al proporcionar datos de raza y etnia en una solicitud de licencia de
    conducir, ¿cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Es un requisito obligatorio para todos los nuevos solicitantes.
    B: Los datos se publican en registros públicos.
    C: Proporcionar estos datos es voluntario y se clasifican como privados.
    D: Se utilizan para determinar el costo de su tarifa de solicitud.
  answer: C
  explanation: Proporcionar datos de raza y etnia es voluntario (no está obligado
    a compartir la información) y los datos se clasifican como privados.
- id: 10
  category: license_system
  question: ¿A qué edad puede una persona ser elegible para obtener una licencia de
    conducir específicamente para sus propias necesidades médicas o las necesidades
    médicas de un familiar?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: B
  explanation: El manual establece que si usted tiene 15 años, es posible que pueda
    obtener una licencia de conducir para sus propias necesidades médicas o las necesidades
    médicas de sus familiares.
- id: 11
  category: license_system
  question: ¿Cuál es una nueva regla de elegibilidad para personas menores de 16 años
    que solicitan una licencia restringida para trabajo agrícola?
  choices:
    A: Pueden conducir cualquier vehículo comercial en la granja.
    B: Son elegibles incluso si su padre o tutor no es el dueño de la granja.
    C: Ya no necesitan aprobar un examen práctico de manejo.
    D: Pueden usar la licencia para trabajos no relacionados con la granja.
  answer: B
  explanation: Si es menor de 16 años y trabaja en una granja, puede ser elegible
    para la licencia agrícola restringida, incluso si su padre o tutor no es el dueño
    de la granja.
- id: 12
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de reintegración después de
    ser emitida a una persona elegible liberada de prisión en Minnesota?
  choices:
    A: 6 meses
    B: 12 meses
    C: 15 meses
    D: 24 meses
  answer: C
  explanation: La licencia de reintegración vence 15 meses después de su emisión y
    se cancela si usted infringe las leyes de tránsito y pierde sus privilegios de
    conducir.
- id: 13
  category: license_system
  question: ¿Qué sucede si proporciona una prueba de ciudadanía estadounidense al
    solicitar o renovar una licencia de conducir de Minnesota?
  choices:
    A: Se le registrará automáticamente para votar, a menos que decida no participar.
    B: Recibirá una licencia de conducir permanente que nunca vence.
    C: Se le exonerará del pago de la tarifa de presentación.
    D: Se le requerirá tomar un examen de educación cívica.
  answer: A
  explanation: Bajo una nueva ley, si proporciona prueba de que es ciudadano estadounidense
    al solicitar o renovar una licencia de conducir, se le registrará automáticamente
    para votar. Si no desea ser registrado, debe optar por no participar.
- id: 14
  category: license_system
  question: 'Las personas encarceladas pueden renovar sus licencias de conducir y
    tarjetas de identificación de forma remota si están cumpliendo una condena superior
    a:'
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Si está cumpliendo una condena de más de seis meses en una cárcel o
    centro correccional sin un acuerdo existente con el DVS, ahora puede renovar sus
    licencias de conducir y tarjetas de identificación de forma remota.
- id: 15
  category: license_system
  question: Para calificar para un indicador de veterano en una licencia de conducir
    utilizando un formulario DD-214, ¿el formulario debe mostrar servicio honorable
    durante al menos cuántos días consecutivos?
  choices:
    A: 90 días
    B: 120 días
    C: 181 días
    D: 365 días
  answer: C
  explanation: Puede demostrar que califica utilizando un formulario DD-214 que muestre
    condiciones honorables o de honor con 181 días de servicio consecutivo.
- id: 16
  category: driver_responsibility
  question: De acuerdo con la ley de Minnesota, ¿cuál es la consecuencia de interferir
    con el trabajo de un empleado de Servicios para Conductores y Vehículos (DVS)?
  choices:
    A: Se emitirá una advertencia
    B: Se considera un delito
    C: Se impondrá una multa de $500
    D: Se suspenderá su licencia de conducir
  answer: B
  explanation: 'El manual establece: ''Es un delito interferir con el trabajo de un
    empleado del DVS. Estatuto de Minnesota 609.50, Subdivisión 5''.'
- id: 17
  category: license_system
  question: ¿Con cuánta anticipación debe comenzar su pre-solicitud en línea antes
    de visitar una oficina de licencias de conducir?
  choices:
    A: No más de 14 días
    B: No más de 30 días
    C: No más de 60 días
    D: No más de 90 días
  answer: B
  explanation: 'El manual aconseja: ''Comience su solicitud en línea utilizando la
    función de pre-solicitud no más de 30 días antes de visitar una oficina de licencias
    de conducir para evitar completar una solicitud en papel''.'
- id: 18
  category: driver_testing
  question: Si es menor de 18 años, ¿qué certifica una 'Tarjeta Azul' (Blue Card)
    cuando solicita tomar su examen escrito?
  choices:
    A: Que ha completado la educación vial y aprobado el examen práctico
    B: Que ha completado 15 horas de instrucción al volante
    C: Que ha completado la instrucción teórica en el aula y está inscrito para la
      instrucción al volante
    D: Que ha tenido su permiso de instrucción durante al menos seis meses
  answer: C
  explanation: La lista de verificación del examen escrito para menores de 18 años
    requiere un 'certificado de inscripción (Tarjeta Azul) que demuestre que completé
    la instrucción en el aula y estoy inscrito para la instrucción al volante'.
- id: 19
  category: driver_testing
  question: ¿Cuál es la edad mínima requerida para tomar el examen de conducir escrito
    en Minnesota?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: B
  explanation: 'La lista de verificación del examen escrito para solicitantes menores
    de 18 años establece: ''Tengo al menos 15 años de edad''.'
- id: 20
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito para el vehículo que proporcione
    para su examen práctico?
  choices:
    A: Debe tener una cámara de retroceso
    B: Las puertas deben abrirse desde el interior y el exterior
    C: Debe tener menos de 10 años de antigüedad
    D: Debe tener controles dobles para el examinador
  answer: B
  explanation: La lista de verificación del examen práctico requiere proporcionar
    un vehículo en condiciones de funcionamiento seguras donde 'las puertas deben
    abrirse desde el interior y el exterior'.
- id: 21
  category: license_system
  question: ¿Si es menor de 18 años, cuánto tiempo debe tener un permiso de instrucción
    antes de realizar el examen de conducir?
  choices:
    A: Al menos tres meses
    B: Al menos seis meses
    C: Al menos nueve meses
    D: Al menos un año
  answer: B
  explanation: La lista de verificación del examen de conducir para menores de 18
    años requiere que usted 'haya tenido un permiso de instrucción durante los últimos
    seis meses sin una condena por una infracción de tránsito o una infracción por
    alcohol o sustancias controladas'.
- id: 22
  category: license_system
  question: ¿Si tiene 19 años o más, cuál es el tiempo mínimo que debe tener un permiso
    de instrucción antes de realizar un examen de conducir?
  choices:
    A: Al menos un mes
    B: Al menos tres meses
    C: Al menos seis meses
    D: Al menos un año
  answer: B
  explanation: 'La lista de verificación del examen de conducir para solicitantes
    de 19 años o más establece: ''He tenido mi permiso de instrucción durante al menos
    tres meses''.'
- id: 23
  category: driver_testing
  question: ¿Qué exámenes debe aprobar si su licencia de conducir de Minnesota ha
    estado vencida por más de un año pero menos de cinco años?
  choices:
    A: Solo un examen de la vista
    B: Un examen escrito y un examen de la vista
    C: Un examen de conducir y un examen de la vista
    D: Un examen escrito, un examen de la vista y un examen de conducir
  answer: B
  explanation: 'El manual establece: ''Si su licencia de conducir de Minnesota ha
    estado vencida por más de un año pero menos de cinco años, debe aprobar un examen
    escrito y un examen de la vista antes de solicitar una nueva licencia''.'
- id: 24
  category: license_system
  question: ¿Si tiene 21 años o más y se muda a Minnesota desde otro estado con una
    licencia de conducir válida y vigente, qué examen(es) debe aprobar para obtener
    una licencia de Minnesota?
  choices:
    A: Solo un examen de la vista
    B: Solo un examen escrito
    C: Un examen escrito y un examen de la vista
    D: Un examen escrito, un examen de la vista y un examen de conducir
  answer: A
  explanation: El manual establece que si tiene 21 años o más y se muda de otro estado
    con una licencia válida y vigente, 'puede obtener una licencia aprobando un examen
    de la vista y completando una solicitud. No se requiere que realice un examen
    escrito ni un examen de conducir...'
- id: 25
  category: license_system
  question: Una vez que se convierta en residente de Minnesota, ¿cuántos días tiene
    para obtener su licencia de conducir regular de Minnesota?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: 'El manual establece: ''Tiene 60 días (30 días para conductores comerciales)
    una vez que se convierta en residente de Minnesota para obtener su licencia o
    permiso de Minnesota''.'
- id: 26
  category: license_system
  question: ¿Qué se requiere si se muda a Minnesota desde un país que no sea EE. UU.
    o Canadá y tiene una licencia válida de su país anterior?
  choices:
    A: Solo necesita aprobar un examen de la vista
    B: Debe aprobar un examen escrito y un examen de la vista
    C: Debe aprobar un examen escrito, un examen de la vista y un examen de conducir
    D: Simplemente puede canjear su licencia extranjera por una licencia de Minnesota
  answer: C
  explanation: 'El manual establece: ''Si se muda a Minnesota desde un país que no
    sea EE. UU. o Canadá, debe aprobar un examen escrito, un examen de la vista y
    un examen de conducir, incluso si tiene una licencia válida de su país anterior''.'
- id: 27
  category: license_system
  question: ¿Bajo cuál de las siguientes circunstancias puede conducir en vías públicas
    en Minnesota sin una licencia o permiso de conducir de Minnesota válido?
  choices:
    A: Al conducir un vehículo comercial para una empresa privada
    B: Al conducir temporalmente un tractor agrícola u otro implemento agrícola en
      una vía pública
    C: Al conducir una motocicleta durante las horas del día
    D: Al conducir un vehículo registrado en otro estado por hasta 6 meses
  answer: B
  explanation: Una de las excepciones enumeradas para quienes no necesitan una licencia
    de Minnesota es si 'conduce temporalmente un tractor agrícola u otro implemento
    agrícola en una vía pública'.
- id: 28
  category: driver_testing
  question: ¿Qué documento acredita que un solicitante menor de 18 años ha completado
    la educación vial al solicitar un examen de conducir?
  choices:
    A: Una Tarjeta Azul (Blue Card)
    B: Una Tarjeta Rosa (Pink Card)
    C: Una Tarjeta Blanca (White Card)
    D: Una Tarjeta Verde (Green Card)
  answer: C
  explanation: La lista de verificación del examen de conducir para solicitantes menores
    de 18 años requiere un 'certificado de finalización del curso (Tarjeta Blanca)
    que demuestre que completé la educación vial'.
- id: 29
  category: driver_testing
  question: Si se muda a Minnesota desde otro estado y su licencia del estado anterior
    ha estado vencida por menos de un año, ¿qué examen debe aprobar además del examen
    de la vista?
  choices:
    A: Solo el examen de conducir
    B: Solo el examen escrito
    C: Tanto el examen escrito como el de conducir
    D: No se requieren exámenes adicionales
  answer: B
  explanation: 'El manual establece: ''Si la licencia de su estado anterior venció
    hace menos de un año, se requiere que apruebe el examen escrito''.'
- id: 30
  category: driver_testing
  question: ¿Qué sucederá si llega a su examen de conducir sin un conductor con licencia
    que lo acompañe?
  choices:
    A: Se le cobrará un cargo adicional
    B: El examinador conducirá el vehículo hasta el área de pruebas
    C: Su examen de conducir puede ser cancelado
    D: Se le requerirá realizar el examen escrito nuevamente
  answer: C
  explanation: 'La lista de verificación del examen de conducir establece: ''Tengo
    un conductor con licencia que me acompañará a mi examen de conducir. Entiendo
    que si no tengo un conductor con licencia conmigo, mi examen de conducir puede
    ser cancelado''.'
- id: 31
  category: license_system
  question: ¿Cuánto tiempo puede un no residente, que tenga al menos 18 años y provenga
    de un país que no requiere que los conductores tengan licencia, conducir en Minnesota
    sin una licencia o permiso válido?
  choices:
    A: Hasta 30 días en cualquier año calendario
    B: Hasta 60 días en cualquier año calendario
    C: Hasta 90 días en cualquier año calendario
    D: Hasta 120 días en cualquier año calendario
  answer: C
  explanation: Según el manual, si usted es un no residente, tiene al menos 18 años
    y su país de origen no requiere licencias, puede conducir un vehículo registrado
    en su país de origen en Minnesota por hasta 90 días en cualquier año calendario.
- id: 32
  category: license_system
  question: ¿A cuál de las siguientes personas NO se le otorgará una licencia de conducir
    de Minnesota?
  choices:
    A: Un joven de 19 años que ha tenido un permiso de instrucción durante 4 meses
    B: Un joven de 18 años que ha tenido un permiso de instrucción durante 5 meses
    C: Un joven de 16 años que completó la educación vial y tiene una licencia válida
      de otro estado
    D: Una persona de 21 años que ha aprobado todos los exámenes requeridos
  answer: B
  explanation: El manual establece que no se le otorgará una licencia si tiene 18
    años o menos y ha tenido un permiso de instrucción por menos de seis meses.
- id: 33
  category: license_system
  question: Si no tiene una licencia de conducir o identificación de Minnesota vigente
    o recientemente vencida, ¿qué debe presentar para solicitar una licencia de conducir
    estándar?
  choices:
    A: Un documento primario que contenga su nombre completo
    B: Dos documentos (primario y secundario) que contengan su nombre completo y fecha
      de nacimiento
    C: Tres documentos que acrediten su residencia actual
    D: Una factura de servicios públicos y una declaración de impuestos
  answer: B
  explanation: Si no tiene una licencia o identificación previa que califique, debe
    presentar dos documentos (primario y secundario) que contengan su nombre completo
    y su fecha de nacimiento, como un certificado de nacimiento, pasaporte o tarjeta
    de Seguro Social.
- id: 34
  category: license_system
  question: ¿Cuál es un requisito adicional para obtener una Licencia de Conducir
    Mejorada (EDL) o identificación en comparación con una licencia estándar?
  choices:
    A: Prueba de ciudadanía estadounidense
    B: Una traducción certificada de su certificado de nacimiento
    C: Aprobar un examen de conducir avanzado
    D: Una tarifa adicional de $50
  answer: A
  explanation: Solo los solicitantes que puedan proporcionar prueba de identidad,
    nombre legal completo, número de Seguro Social, identidad con fotografía, residencia
    en Minnesota y ciudadanía estadounidense son elegibles para una licencia de conducir
    mejorada (EDL) o identificación de Minnesota.
- id: 35
  category: license_system
  question: ¿De cuánto es la tarifa adicional requerida al solicitar una licencia
    de conducir mejorada o una tarjeta de identificación?
  choices:
    A: $5
    B: $10
    C: $15
    D: $20
  answer: C
  explanation: Se requiere una tarifa de $15 además de la tarifa de la licencia de
    conducir o tarjeta de identificación al solicitar una licencia de conducir mejorada
    o identificación.
- id: 36
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para una traducción al inglés
    calificada de un documento de identificación?
  choices:
    A: El traductor debe ser un pariente consanguíneo del solicitante
    B: El traductor debe ser un notario público
    C: El traductor no debe estar emparentado por sangre o matrimonio con el sujeto
      del documento
    D: La traducción debe estar laminada antes de su presentación
  answer: C
  explanation: El Certificado de Traducción requiere que el traductor certifique que
    no está emparentado por sangre o matrimonio con el sujeto del documento.
- id: 37
  category: license_system
  question: ¿Se imprimen los números de Seguro Social en las licencias de conducir
    o tarjetas de identificación de Minnesota?
  choices:
    A: Sí, se imprimen en el frente de la tarjeta
    B: Sí, están incrustados en el código de barras de la tarjeta
    C: No, no se imprimen ni se incrustan en las tarjetas
    D: Sí, pero solo en las tarjetas compatibles con REAL ID
  answer: C
  explanation: 'El manual establece explícitamente: "Los números de Seguro Social
    no se imprimen ni se incrustan en las licencias de conducir ni en las tarjetas
    de identificación".'
- id: 38
  category: driver_testing
  question: ¿Qué sucede si reprueba dos exámenes escritos consecutivos?
  choices:
    A: Debe esperar 30 días antes de volver a tomar el examen
    B: Se le cobra una tarifa de $10 por el tercer examen y los siguientes
    C: Debe volver a tomar la parte teórica de la educación vial
    D: Se le requiere completar un cuestionario de entrevista
  answer: B
  explanation: Si reprueba dos exámenes escritos consecutivos, se cobra una tarifa
    de $10 por el tercer examen y por cualquier examen posterior.
- id: 39
  category: driver_testing
  question: ¿Cuáles son los estándares mínimos de visión requeridos para aprobar el
    examen de la vista para una licencia de conducir?
  choices:
    A: Al menos 20/20 de visión y 90 grados de visión periférica
    B: Al menos 20/40 de visión y 105 grados de visión periférica
    C: Al menos 20/50 de visión y 100 grados de visión periférica
    D: Al menos 20/30 de visión y 120 grados de visión periférica
  answer: B
  explanation: Su visión normal o corregida debe ser de al menos 20/40, y su visión
    periférica debe ser de al menos 105 grados para aprobar el examen de la vista.
- id: 40
  category: driver_testing
  question: Si es menor de 18 años, ¿qué debe presentar antes de tomar el examen escrito?
  choices:
    A: Un diploma de escuela secundaria o equivalente
    B: Un certificado de inscripción ('Tarjeta Azul' o 'Tarjeta Rosa') de un curso
      de educación vial aprobado
    C: Una carta de recomendación de un instructor de manejo con licencia
    D: Prueba de seguro del vehículo
  answer: B
  explanation: Si es menor de 18 años, debe presentar un certificado de inscripción
    ('Tarjeta Azul' o 'Tarjeta Rosa') de un curso de educación vial aprobado que demuestre
    que completó la instrucción teórica y que está inscrito en la capacitación práctica
    al volante.
- id: 41
  category: license_system
  question: ¿Cuál de los siguientes tipos de documentos de identificación NO aceptará
    el DVS?
  choices:
    A: Certificados de matrimonio certificados
    B: Sentencias de divorcio certificadas
    C: Fotocopias o documentos laminados
    D: Pasaportes válidos
  answer: C
  explanation: El DVS verificará sus documentos y es posible que no los acepte si
    están laminados o alterados. No pueden aceptar fotocopias de documentos de identificación.
- id: 42
  category: driver_testing
  question: ¿Cuántos exámenes escritos se le permite realizar por día?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ilimitados
  answer: A
  explanation: 'El manual establece: "Solo puede realizar un examen escrito por día
    y debe obtener un puntaje del 80 por ciento para aprobar".'
- id: 43
  category: license_system
  question: ¿Cuántos documentos que demuestren la residencia actual en Minnesota se
    requieren al solicitar una REAL ID?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Solicitar una REAL ID requiere que proporcione dos documentos que demuestren
    su residencia actual en Minnesota.
- id: 44
  category: driver_testing
  question: ¿Cuál de las siguientes NO es una de las tres partes del examen de conducir
    (road test)?
  choices:
    A: Demostrar el equipo de seguridad de su vehículo
    B: Mostrar sus habilidades de control del vehículo
    C: Realizar una prueba de conducción
    D: Completar un examen escrito sobre leyes de tránsito
  answer: D
  explanation: 'El examen de conducir incluye tres partes: demostrar el equipo de
    seguridad de su vehículo, mostrar sus habilidades de control del vehículo y realizar
    una prueba de conducción. El examen escrito es un requisito aparte.'
- id: 45
  category: vehicle_information
  question: ¿Cuál de los siguientes tipos de vehículos NO está permitido utilizar
    para su examen de conducir?
  choices:
    A: Un vehículo de alquiler donde usted figure como conductor
    B: Un vehículo con cámara de retroceso
    C: Un Vehículo Eléctrico de Vecindario (NEV)
    D: Un vehículo con faros totalmente automáticos
  answer: C
  explanation: Según el manual, debe proporcionar su propio vehículo para el examen,
    y no se permiten Vehículos Eléctricos de Vecindario (NEV).
- id: 46
  category: driver_testing
  question: ¿Cuál es la regla con respecto al uso de una cámara de retroceso durante
    el examen de conducir?
  choices:
    A: Debe estar completamente desactivada o cubierta por el examinador.
    B: Puede utilizarse, pero no puede ser el único método de observación al retroceder.
    C: Puede utilizarse como el método principal y único de observación.
    D: Solo se permite durante la maniobra de estacionamiento en paralelo.
  answer: B
  explanation: Puede utilizar un vehículo con cámara de retroceso, pero la cámara
    no debe ser el único método de observación al retroceder.
- id: 47
  category: driver_testing
  question: ¿Cuál de las siguientes acciones hará que repruebe inmediatamente el examen
    de conducir?
  choices:
    A: Pedirle al examinador que repita una instrucción.
    B: Involucrar a su vehículo en un choque que podría haber evitado, incluso si
      usted no tiene la culpa legalmente.
    C: Usar sus espejos para verificar el tráfico antes de cambiar de carril.
    D: Activar manualmente las luces altas y bajas durante la verificación de seguridad.
  answer: B
  explanation: Involucrar a su vehículo en un choque que podría haber evitado, incluso
    si no tiene la culpa legalmente, es una acción que hará que repruebe el examen
    de conducir de inmediato.
- id: 48
  category: alcohol_drugs_health
  question: Si ya tiene un permiso o licencia y se le diagnostica epilepsia, ¿cuánto
    tiempo tiene para presentar una declaración del médico a la Unidad de Evaluación
    de Conductores?
  choices:
    A: Dentro de los 10 días posteriores al diagnóstico
    B: Dentro de los 30 días posteriores al diagnóstico
    C: Dentro de los 60 días posteriores al diagnóstico
    D: Antes de su próxima renovación de licencia
  answer: B
  explanation: Si se le diagnostica epilepsia o una afección que podría causar la
    pérdida del conocimiento, debe presentar una declaración del médico dentro de
    los 30 días posteriores al diagnóstico.
- id: 49
  category: license_system
  question: Si es menor de 18 años y conduce con un permiso de instrucción, ¿quién
    debe supervisar su conducción?
  choices:
    A: Cualquier conductor con licencia de 18 años o más
    B: Un conductor con licencia de 21 años o más
    C: Solo un padre o tutor legal
    D: Solo un instructor de manejo certificado
  answer: B
  explanation: Si es menor de 18 años y tiene un permiso de instrucción, debe ser
    supervisado por un conductor de 21 años o más sentado en el asiento del pasajero
    delantero.
- id: 50
  category: license_system
  question: Bajo el sistema de Licencia de Conducir Graduada (GDL), ¿cuánto tiempo
    debe un conductor de 18 años o menos tener un permiso de instrucción antes de
    realizar el examen de conducir?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 9 meses
    D: Al menos 12 meses
  answer: B
  explanation: Bajo el sistema GDL, si tiene 18 años o menos, debe tener un permiso
    de instrucción durante al menos seis meses antes de realizar el examen de conducir.
- id: 51
  category: license_system
  question: ¿Cuál de las siguientes es una restricción que se aplica a una licencia
    provisional?
  choices:
    A: No puede usar ni hablar por teléfono celular mientras conduce, incluso con
      un dispositivo de manos libres.
    B: Siempre debe tener un conductor supervisor en el asiento del pasajero delantero.
    C: Solo se le permite conducir durante las horas del día.
    D: No puede llevar a ningún pasajero menor de 21 años.
  answer: A
  explanation: Con una licencia provisional, no puede usar ni hablar por teléfono
    celular mientras conduce, incluso con un dispositivo de manos libres.
- id: 52
  category: driver_testing
  question: ¿Qué sucede si no logra pasar la demostración del equipo de seguridad
    al comienzo del examen de conducir?
  choices:
    A: Perderá 10 puntos en su puntaje de conducción.
    B: Se le permitirá terminar el examen, pero deberá reparar el equipo más tarde.
    C: No se le permitirá terminar el examen de conducir ese día.
    D: Debe pagar una tarifa de $20 de inmediato para continuar.
  answer: C
  explanation: Si no logra pasar la demostración del equipo de seguridad, no se le
    permitirá terminar el examen de conducir ese día.
- id: 53
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción de Minnesota?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 4 años
  answer: C
  explanation: Su permiso de instrucción es válido por dos años de práctica de conducción
    con un conductor supervisor con licencia.
- id: 54
  category: driver_testing
  question: Durante el examen de conducir, ¿qué ancho simula la maniobra de retroceso
    de 90 grados para entrar en una entrada para autos o espacio de estacionamiento?
  choices:
    A: 8 pies de ancho
    B: 10 pies de ancho
    C: 12 pies de ancho
    D: 15 pies de ancho
  answer: B
  explanation: Se evaluará su capacidad para realizar la maniobra de retroceso de
    90 grados, que simula retroceder en una entrada para autos o espacio de estacionamiento
    de 10 pies (10 feet) de ancho.
- id: 55
  category: driver_testing
  question: ¿Qué se requiere si reprueba el examen de conducir cuatro veces?
  choices:
    A: Debe esperar un año completo antes de volver a realizar el examen.
    B: Debe completar al menos seis horas de instrucción práctica (behind-the-wheel)
      con un instructor con licencia.
    C: Debe volver a tomar el examen escrito de conocimientos.
    D: Debe completar otras 30 horas de instrucción en el aula.
  answer: B
  explanation: Si reprueba el examen de conducir cuatro veces, debe completar al menos
    seis horas de instrucción práctica (behind-the-wheel) con un instructor con licencia
    antes de volver a realizar el examen.
- id: 56
  category: license_system
  question: Si es un estudiante de intercambio extranjero menor de 18 años, ¿quién
    está autorizado para firmar su solicitud de permiso de instrucción?
  choices:
    A: Sus patrocinadores anfitriones, independientemente de la tutela legal.
    B: El director de su escuela secundaria.
    C: Sus padres, utilizando firmas ante notario en los formularios de solicitud.
    D: El director de un programa de vivienda de transición.
  answer: C
  explanation: Si es un estudiante de intercambio extranjero, sus patrocinadores anfitriones
    no pueden firmar su solicitud a menos que tengan la tutela legal. Necesitará formularios
    de solicitud con firmas ante notario de sus padres.
- id: 57
  category: driver_testing
  question: ¿A quién se le permite viajar en el vehículo con usted como pasajero durante
    su examen de conducir?
  choices:
    A: Un instructor de conducción con licencia
    B: Un padre o tutor legal
    C: Un intérprete de idiomas
    D: No se permiten pasajeros
  answer: D
  explanation: Durante el examen, no se permiten pasajeros, incluyendo mascotas, niños
    o intérpretes.
- id: 58
  category: license_system
  question: Para calificar para un permiso de instrucción a los 15 años, ¿qué requisitos
    de educación vial debe cumplir?
  choices:
    A: No necesita ninguna educación formal si aprueba el examen escrito.
    B: Completar 30 horas de instrucción en el aula y estar inscrito en instrucción
      práctica (behind-the-wheel).
    C: Completar 50 horas de conducción supervisada con un padre.
    D: Completar 10 horas de instrucción práctica (behind-the-wheel) solamente.
  answer: B
  explanation: Para calificar para un permiso de instrucción a los 15 años, debe completar
    30 horas de instrucción en el aula y estar inscrito en instrucción práctica (behind-the-wheel)
    (o estar inscrito en un curso concurrente y haber completado las primeras 15 horas
    de clase).
- id: 59
  category: safe_driving_rules
  question: ¿Cuál es la restricción con respecto al uso del teléfono celular para
    un conductor con una licencia provisional?
  choices:
    A: Permitido solo con un dispositivo de manos libres
    B: Permitido solo para navegación GPS
    C: No se permite en absoluto, incluso con un dispositivo de manos libres
    D: Permitido solo durante las horas del día
  answer: C
  explanation: El manual establece que con una licencia provisional, no puede usar
    ni hablar por teléfono celular mientras conduce, incluso con un dispositivo de
    manos libres.
- id: 60
  category: license_system
  question: ¿Cuántas horas de conducción supervisada debe registrar un adolescente
    para calificar para una licencia provisional si su padre o tutor NO completa una
    clase para padres?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Si no se toma la clase para padres, el adolescente debe presentar un
    registro que muestre al menos 50 horas de conducción supervisada, incluyendo 15
    horas nocturnas.
- id: 61
  category: license_system
  question: 'Durante los primeros seis meses de tener una licencia provisional, se
    prohíbe conducir entre la medianoche y las 5 a.m. A MENOS QUE el conductor esté:'
  choices:
    A: Acompañado por un conductor con licencia que tenga al menos 21 años
    B: Conduciendo entre el hogar y el trabajo
    C: Conduciendo con familiares directos menores de 20 años
    D: Conduciendo un vehículo con un peso bruto inferior a 10,000 libras
  answer: B
  explanation: Las excepciones a la restricción de medianoche a 5 a.m. incluyen conducir
    entre el hogar y el trabajo, conducir por motivos de empleo, conducir a un evento
    escolar para el cual no se proporcionó transporte, o estar acompañado por un conductor
    con licencia que tenga al menos 25 años.
- id: 62
  category: license_system
  question: ¿Cuál es la limitación de pasajeros durante los segundos seis meses de
    tener una licencia provisional?
  choices:
    A: Solo se permite un pasajero menor de 20 años
    B: No se permiten más de tres pasajeros menores de 20 años
    C: No se permiten pasajeros menores de 20 años
    D: Solo se permiten familiares directos
  answer: B
  explanation: Durante los segundos seis meses de una licencia provisional, no puede
    llevar a más de tres pasajeros menores de 20 años, a menos que esté acompañado
    por un padre o tutor.
- id: 63
  category: penalties_and_points
  question: Bajo la Ley de Vanessa (Vanessa's Law), ¿qué sucede si un adolescente
    sin licencia es condenado por una infracción de tránsito relacionada con un choque?
  choices:
    A: No puede obtener una licencia o permiso hasta que cumpla 18 años.
    B: Debe pagar una multa de $1,000 y cumplir 30 días de cárcel.
    C: Los privilegios de conducir de sus padres se suspenden por seis meses.
    D: Debe esperar hasta los 21 años para solicitar una licencia provisional.
  answer: A
  explanation: Bajo la Ley de Vanessa (Vanessa's Law), si se le condena por una infracción
    de tránsito relacionada con un choque mientras conduce sin licencia siendo adolescente,
    no podrá obtener una licencia, permiso de instrucción o licencia provisional hasta
    que cumpla 18 años.
- id: 64
  category: penalties_and_points
  question: Si el titular de una licencia provisional pierde los privilegios de conducir
    debido a una infracción relacionada con el alcohol, ¿cuánto tiempo debe mantener
    un permiso de instrucción después de cumplir 18 años antes de solicitar una nueva
    licencia?
  choices:
    A: Un mes
    B: Tres meses
    C: Six meses
    D: Doce meses
  answer: B
  explanation: Al cumplir 18 años, el titular de una licencia provisional que perdió
    sus privilegios bajo la Ley de Vanessa (Vanessa's Law) debe obtener un permiso
    de instrucción y mantenerlo durante tres meses antes de solicitar una nueva licencia.
- id: 65
  category: license_system
  question: ¿Qué beneficio recibe al actualizar de una licencia provisional a una
    licencia Clase D para menores de 21 años si no tiene infracciones en su registro?
  choices:
    A: Una exención del examen de conducir
    B: Un crédito de $3.50 para la tarifa
    C: Una actualización de licencia gratuita
    D: Una exención del examen escrito
  answer: B
  explanation: Si actualiza desde una licencia provisional sin tener infracciones
    en su registro, recibirá un crédito de $3.50 para el pago de la tarifa.
- id: 66
  category: license_system
  question: ¿A qué distancia de la granja puede conducir solo un joven de 15 años
    con una licencia de conducir restringida para trabajo agrícola?
  choices:
    A: Dentro de 10 millas
    B: Dentro de 20 millas
    C: Dentro de 40 millas
    D: Dentro de 150 millas
  answer: C
  explanation: Con una licencia de conducir restringida para trabajo agrícola, puede
    conducir solo para realizar tareas agrícolas durante las horas del día dentro
    de un radio de 40 millas de la granja.
- id: 67
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que se le otorgue una licencia
    de conducir médica especial a los 15 años?
  choices:
    A: Debe tener un padre que sea un profesional médico con licencia.
    B: No debe haber conductores con licencia en el hogar.
    C: Debe haber tenido un permiso de instrucción durante al menos un año.
    D: Solo debe conducir dentro de las 40 millas de su hogar.
  answer: B
  explanation: Se le puede otorgar una licencia de conducir médica especial a los
    15 años cuando no hay conductores con licencia en el hogar, con el fin de conducir
    para necesidades médicas personales o de un familiar.
- id: 68
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las bicicletas
    con asistencia eléctrica?
  choices:
    A: Requieren un permiso de bicicleta motorizada para operar.
    B: Se consideran ciclomotores (mopeds) bajo la ley de Minnesota.
    C: Debe aprobar un examen de conducir para usar una.
    D: No necesita un examen ni una licencia para usar una, pero debe tener al menos
      15 años.
  answer: D
  explanation: Una bicicleta con asistencia eléctrica no se considera un ciclomotor
    (moped), y no se requiere un examen ni una licencia para usarla. Sin embargo,
    el conductor debe tener al menos 15 años de edad.
- id: 69
  category: license_system
  question: 'Una licencia de conducir Clase D estándar le permite conducir vehículos
    de una sola unidad con un peso bruto vehicular de hasta:'
  choices:
    A: 10,000 libras
    B: 15,000 libras
    C: 26,000 libras
    D: 30,000 libras
  answer: C
  explanation: Una licencia Clase D le permite conducir vehículos de una sola unidad,
    con excepción de aquellos que tengan un peso bruto vehicular de 26,001 libras
    o más.
- id: 70
  category: license_system
  question: ¿Cuál es el número máximo de pasajeros (incluido el conductor) para el
    que puede estar diseñado un vehículo para ser operado con una licencia Clase D
    estándar?
  choices:
    A: 8 pasajeros
    B: 10 pasajeros
    C: 15 pasajeros
    D: 20 pasajeros
  answer: C
  explanation: Una licencia Clase D permite conducir vehículos de una sola unidad,
    excepto aquellos diseñados para transportar a más de 15 pasajeros (incluido el
    conductor).
- id: 71
  category: license_system
  question: ¿Bajo una licencia Clase D, a qué distancia de la granja puede un agricultor
    conducir un camión agrícola que transporta productos agrícolas?
  choices:
    A: Dentro de 40 millas
    B: Dentro de 50 millas
    C: Dentro de 100 millas
    D: Dentro de 150 millas
  answer: D
  explanation: Con una licencia Clase D, puede conducir cualquier camión agrícola
    que transporte productos agrícolas, maquinaria agrícola o suministros agrícolas
    dentro de un radio de 150 millas de la granja.
- id: 72
  category: license_system
  question: Durante los primeros seis meses de tener una licencia provisional, ¿qué
    pasajeros menores de 20 años están exentos del límite de un solo pasajero?
  choices:
    A: Compañeros de clase que viajan a un evento escolar
    B: Miembros de la familia inmediata
    C: Compañeros de trabajo que viajan al empleo
    D: Cualquier pasajero con una licencia de conducir válida
  answer: B
  explanation: 'El manual señala: ''Puede tener a miembros de la familia inmediata
    menores de 20 años como pasajeros durante ambos períodos de tiempo'', eximiéndolos
    de las estrictas limitaciones de pasajeros.'
- id: 73
  category: license_system
  question: 'Para obtener una licencia de conducir Clase D para menores de 21 años
    si usted es menor de 18, debe certificar que ha conducido durante al menos 10
    horas bajo la supervisión de un conductor con licencia que tenga al menos:'
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: B
  explanation: Si es menor de 18 años, debe certificar que ha conducido durante al
    menos 10 horas bajo la supervisión de un conductor con licencia que tenga al menos
    21 años para obtener su licencia Clase D para menores de 21 años.
- id: 74
  category: license_system
  question: 'Puede remolcar un remolque con un peso bruto vehicular de más de 10,000
    libras si el peso bruto vehicular combinado de su vehículo y el remolque es:'
  choices:
    A: 15,000 libras o menos.
    B: 20,000 libras o menos.
    C: 26,000 libras o menos.
    D: 30,000 libras o menos.
  answer: C
  explanation: Según el manual, puede remolcar un remolque con un peso bruto vehicular
    de más de 10,000 libras si el peso bruto vehicular combinado del vehículo y el
    remolque es de 26,000 libras o menos.
- id: 75
  category: driver_testing
  question: ¿Cuál de los siguientes endosos de licencia requiere que apruebe un examen
    de conducir especializado?
  choices:
    A: Vehículos cisterna
    B: Materiales peligrosos
    C: Remolques dobles y triples
    D: Autobuses escolares
  answer: D
  explanation: El manual establece que debe aprobar exámenes de conducir especializados
    para recibir los endosos de autobús, autobús escolar y motocicleta.
- id: 76
  category: license_system
  question: Al operar una unidad de potencia Clase B, ¿cuál es el peso bruto vehicular
    máximo de un vehículo que puede remolcar?
  choices:
    A: 5,000 libras
    B: 10,000 libras
    C: 15,000 libras
    D: 26,000 libras
  answer: B
  explanation: Una licencia Clase B le permite remolcar vehículos con un peso bruto
    vehicular de 10,000 libras o menos cuando opera una unidad de potencia Clase B.
- id: 77
  category: license_system
  question: ¿Puede una persona menor de 21 años obtener una Licencia de Conducir Comercial
    (CDL) en Minnesota?
  choices:
    A: No, debe tener al menos 21 años para obtener cualquier CDL.
    B: Sí, pero la licencia tendrá restricciones específicas.
    C: Sí, y conlleva exactamente los mismos privilegios que una CDL para adultos.
    D: Sí, pero solo para conducir autobuses escolares.
  answer: B
  explanation: Puede obtener una CDL antes de cumplir 21 años; sin embargo, el manual
    especifica que la licencia tendrá restricciones específicas.
- id: 78
  category: license_system
  question: ¿Con qué frecuencia debe renovarse típicamente una licencia de conducir
    de Minnesota después de cumplir los 21 años?
  choices:
    A: Cada dos años
    B: Cada cuatro años
    C: Cada cinco años
    D: Cada ocho años
  answer: B
  explanation: Una licencia de conducir emitida por el estado de Minnesota generalmente
    vence en su cumpleaños y debe renovarse cada cuatro años después de cumplir los
    21 años.
- id: 79
  category: driver_testing
  question: ¿Qué tipo de examen debe aprobar para renovar su licencia de conducir
    de Minnesota?
  choices:
    A: Un examen de conocimientos escrito
    B: Un examen de conducir especializado
    C: Un examen de la vista
    D: Un examen de audición
  answer: C
  explanation: El manual establece que para renovar su licencia, debe aprobar un examen
    de la vista.
- id: 80
  category: license_system
  question: Si cambia su nombre o dirección antes de que expire su licencia, ¿dentro
    de cuántos días debe solicitar un duplicado de la licencia?
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Si cambia su nombre o dirección antes de que expire su licencia, debe
    solicitar un duplicado de la licencia dentro de los 30 días.
- id: 81
  category: license_system
  question: ¿Si usted está en servicio militar activo, cuánto tiempo tiene para renovar
    su licencia de conducir de Minnesota después de ser separado o dado de baja?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Debe renovar su licencia dentro de un año después de su separación
    o baja del servicio militar activo, presentando su licencia de conducir de Minnesota
    y sus documentos de baja militar DD-214.
- id: 82
  category: license_system
  question: Al solicitar una licencia o tarjeta de identificación de Minnesota, ¿quién
    queda registrado automáticamente en el Servicio Selectivo de los EE. UU.?
  choices:
    A: Todos los ciudadanos de los EE. UU. independientemente de su edad
    B: Ciudadanos o residentes de los EE. UU. entre las edades de 18 y 26 años
    C: Solo las personas que solicitan una Licencia de Conducir Comercial (CDL)
    D: Cualquier persona que solicite una tarjeta de identificación mejorada
  answer: B
  explanation: Si usted es ciudadano o residente de los EE. UU. entre las edades de
    18 y 26 años, será registrado en el Servicio Selectivo de los EE. UU. cuando solicite
    cualquier licencia o tarjeta de identificación de Minnesota.
- id: 83
  category: license_system
  question: ¿Puede tener una licencia de conducir de Minnesota válida y una tarjeta
    de identificación estatal de Minnesota al mismo tiempo?
  choices:
    A: Sí, siempre que ambas sean REAL ID.
    B: Sí, pero solo si paga una tarifa adicional.
    C: No, debe renunciar a sus privilegios de conducción para que se le emita la
      tarjeta de identificación.
    D: No, a menos que sea un miembro militar activo.
  answer: C
  explanation: El DVS no emitirá una tarjeta de identificación a alguien que ya tenga
    una licencia de conducir o permiso de instrucción válido sin una declaración de
    renuncia que indique que la persona está renunciando a sus privilegios de conducción.
- id: 84
  category: license_system
  question: ¿Cuál es el cargo adicional por utilizar el servicio expedito (vía rápida)
    para su licencia de conducir o tarjeta de identificación estatal?
  choices:
    A: $10
    B: $15
    C: $20
    D: $30
  answer: C
  explanation: Puede tramitar por vía rápida su licencia de conducir o tarjeta de
    identificación estatal por un cargo adicional de $20.
- id: 85
  category: license_system
  question: ¿En cuál de las siguientes situaciones NO se le permite utilizar el servicio
    expedito (vía rápida) para una licencia de conducir?
  choices:
    A: Al renovar una licencia de conducir estándar
    B: Al solicitar una licencia duplicada después de un cambio de dirección
    C: Al solicitar una licencia de conducir mejorada
    D: Al reemplazar una tarjeta de identificación estándar extraviada
  answer: C
  explanation: No puede utilizar el servicio de vía rápida cuando solicita por primera
    vez, para licencias de conducir e identificaciones mejoradas, o cuando actualiza
    una categoría de licencia.
- id: 86
  category: vehicle_information
  question: ¿Cuántos sistemas de frenos independientes deben tener todos los automóviles
    y camiones?
  choices:
    A: Al menos uno
    B: Al menos dos
    C: Al menos tres
    D: Al menos cuatro
  answer: B
  explanation: Todos los automóviles y camiones deben tener al menos dos sistemas
    de frenos independientes, como el freno de pedal y el freno de estacionamiento
    o emergencia.
- id: 87
  category: vehicle_information
  question: ¿Cuáles son los requisitos de parachoques para camionetas (pickups) y
    furgonetas en Minnesota?
  choices:
    A: Deben tener parachoques tanto delanteros como traseros.
    B: Deben tener parachoques delanteros y ya sea parachoques traseros o reflectores.
    C: Solo necesitan un parachoques trasero.
    D: Están exentos de los requisitos de parachoques.
  answer: B
  explanation: Las camionetas y furgonetas deben tener parachoques delanteros y ya
    sea parachoques traseros o reflectores.
- id: 88
  category: safe_driving_rules
  question: Según el Manual del Conductor de Minnesota, ¿cuándo es el momento adecuado
    para usar la bocina de su vehículo?
  choices:
    A: Para anunciar su llegada a un destino
    B: Para alertar a otros conductores que el semáforo se ha puesto en verde
    C: Para evitar un choque
    D: Para saludar a peatones u otros conductores
  answer: C
  explanation: 'El manual establece: "Use la bocina para evitar un choque. No toque
    la bocina innecesariamente o para anunciar su llegada".'
- id: 89
  category: vehicle_information
  question: ¿A qué distancia mínima deben las luces altas (luces de carretera) hacer
    visibles los objetos en la carretera?
  choices:
    A: 200 pies
    B: 350 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Según el manual, las luces altas deben hacer que los objetos en la
    carretera sean visibles al menos a 350 pies de distancia.
- id: 90
  category: safe_driving_rules
  question: ¿Cuándo se requiere que encienda sus faros delanteros?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Solo cuando está lloviendo o nevando
    C: Desde 30 minutos después del atardecer hasta 30 minutos antes del amanecer
    D: Solo cuando conduce por carreteras rurales sin iluminación
  answer: A
  explanation: El manual indica encender los faros al atardecer y mantenerlos encendidos
    hasta el amanecer, así como durante condiciones climáticas adversas o en cualquier
    momento en que no pueda ver a 500 pies de distancia.
- id: 91
  category: vehicle_information
  question: ¿En qué porcentaje pueden reducir la salida de luz los faros sucios?
  choices:
    A: 25 por ciento
    B: 50 por ciento
    C: 75 por ciento
    D: 90 por ciento
  answer: C
  explanation: Debe limpiar sus faros con la misma frecuencia con la que limpia su
    parabrisas; los faros sucios pueden reducir la salida de luz hasta en un 75 por
    ciento.
- id: 92
  category: vehicle_information
  question: ¿A cuáles de los siguientes vehículos se les permite usar luces azules?
  choices:
    A: Camiones de remolque y vehículos de servicio
    B: Autobuses escolares y transportistas de correo rural
    C: Quitanieves, equipos de mantenimiento vial y vehículos de emergencia autorizados
    D: Maquinaria agrícola y camiones de mudanza
  answer: C
  explanation: 'Solo ciertos vehículos pueden usar luces azules: quitanieves, equipos
    de mantenimiento vial y vehículos de emergencia autorizados.'
- id: 93
  category: vehicle_information
  question: ¿Dónde debe buscar para encontrar la presión de neumáticos recomendada
    para su vehículo?
  choices:
    A: En el flanco (pared lateral) del neumático
    B: En una calcomanía dentro de la puerta del conductor o en el manual del propietario
    C: En la pantalla del tablero del vehículo
    D: En la tapa del combustible
  answer: B
  explanation: Debe encontrar la presión de neumáticos recomendada para su vehículo
    en una calcomanía dentro de la puerta del conductor o en el manual del propietario,
    no el PSI que figura en el flanco del neumático.
- id: 94
  category: vehicle_information
  question: 'Un neumático se considera ilegal si la banda de rodadura tiene menos
    de:'
  choices:
    A: Un octavo de pulgada de profundidad
    B: Un dieciseisavo de pulgada de profundidad
    C: Un cuarto de pulgada de profundidad
    D: Media pulgada de profundidad
  answer: B
  explanation: Revise sus neumáticos con frecuencia para detectar desgaste y daños.
    Un neumático es ilegal si la banda de rodadura tiene menos de un dieciseisavo
    (1/16) de pulgada de profundidad.
- id: 95
  category: vehicle_information
  question: Para la mayoría de los vehículos de pasajeros, el polarizado aplicado
    a las ventanas debe transmitir al menos ¿qué porcentaje de la luz disponible?
  choices:
    A: 20 por ciento
    B: 35 por ciento
    C: 50 por ciento
    D: 75 por ciento
  answer: C
  explanation: Si el polarizado de la ventana transmite menos del 50 por ciento de
    la luz disponible, solo puede usarse en ventanas específicas de ciertos vehículos
    como camionetas pickup, furgonetas o limusinas.
- id: 96
  category: safe_driving_rules
  question: 'Debe conducir por el lado derecho de la carretera EXCEPTO cuando:'
  choices:
    A: Se aproxima a un cruce de ferrocarril
    B: La carretera tiene tres carriles marcados
    C: Conduce en una carretera de dos carriles
    D: Se aproxima a la cima de una colina o una curva
  answer: B
  explanation: En todas las carreteras anchas, debe conducir por el lado derecho excepto
    en ciertas situaciones, como al adelantar, cuando la carretera está cerrada, cuando
    la carretera es de un solo sentido o cuando la carretera tiene tres carriles marcados.
- id: 97
  category: safe_driving_rules
  question: En carreteras de dos carriles con un límite de velocidad de 55 mph o superior,
    ¿cuánto puede aumentar su velocidad al adelantar legalmente a otro vehículo?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: No puede aumentar su velocidad
  answer: B
  explanation: En carreteras de dos carriles con un límite de velocidad de 55 mph
    o superior, puede aumentar su velocidad en 10 mph al adelantar legalmente a otro
    vehículo.
- id: 98
  category: safe_driving_rules
  question: ¿Qué sucede si se aproxima a una intersección a una velocidad ilegal?
  choices:
    A: Debe ceder el paso a todos los vehículos a su izquierda
    B: Pierde el privilegio del derecho de paso asociado con conducir a una velocidad
      legal
    C: Debe detenerse por completo antes de continuar
    D: Usted es automáticamente culpable si ocurre un choque
  answer: B
  explanation: Si se aproxima a una intersección a una velocidad ilegal, pierde el
    privilegio del derecho de paso asociado con conducir a una velocidad legal.
- id: 99
  category: safe_driving_rules
  question: A menos que las señales indiquen lo contrario, ¿cuál es el límite de velocidad
    en los callejones bajo condiciones ideales?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 30 mph
  answer: A
  explanation: Bajo condiciones ideales, el límite de velocidad es de 10 mph en los
    callejones, a menos que las señales indiquen lo contrario.
- id: 100
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    carreteras urbanas o de la ciudad?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: Bajo condiciones ideales, el límite de velocidad es de 30 mph en carreteras
    urbanas o de la ciudad, a menos que las señales indiquen lo contrario.
- id: 101
  category: penalties_and_points
  question: 'Si lo sorprenden conduciendo a más de 100 mph, sus privilegios de conducción
    serán revocados por al menos:'
  choices:
    A: 30 días
    B: 90 días
    C: Seis meses
    D: Un año
  answer: C
  explanation: Si conduce a más de 100 mph, sus privilegios de conducción serán revocados
    por al menos seis meses.
- id: 102
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceso de velocidad al pasar junto a un vehículo
    de emergencia detenido con luces intermitentes?
  choices:
    A: Una advertencia por la primera infracción
    B: Un recargo de al menos $25 añadido a la multa por exceso de velocidad
    C: Suspensión inmediata de la licencia
    D: Una comparecencia obligatoria ante el tribunal
  answer: B
  explanation: Debe reducir la velocidad cuando se acerque o pase junto a un vehículo
    de emergencia detenido con luces de emergencia intermitentes. Se añade un recargo
    de al menos $25 a la multa por exceso de velocidad si infringe esta ley.
- id: 103
  category: penalties_and_points
  question: ¿Cuál es el recargo mínimo que se añade a una multa por exceso de velocidad
    si sobrepasa el límite de velocidad al pasar junto a un vehículo de emergencia
    detenido con luces de emergencia intermitentes?
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: Se añade un recargo de al menos $25 a la multa por exceso de velocidad
    si infringe esta ley al sobrepasar el límite de velocidad al pasar junto a un
    vehículo de emergencia detenido con luces de emergencia intermitentes.
- id: 104
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe activar la señal de giro antes de realizar
    un giro?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 150 pies
    D: Al menos 200 pies
  answer: B
  explanation: Active su señal al menos 100 pies antes de girar. Continúe señalizando
    hasta que haya completado el giro o el cambio de carril.
- id: 105
  category: vehicle_information
  question: ¿Cuándo es ilegal utilizar señales manuales y con el brazo en lugar de
    las señales de giro de su vehículo?
  choices:
    A: Durante las horas del día
    B: Al conducir un vehículo comercial
    C: Por la noche
    D: Al cambiar de carril en una autopista
  answer: C
  explanation: No utilice señales manuales por la noche o cuando conduzca un vehículo
    que impida que otros conductores vean sus señales manuales.
- id: 106
  category: defensive_driving
  question: Mientras espera para realizar un giro, ¿por qué debe mantener las ruedas
    rectas y el pie en el freno?
  choices:
    A: Evita que los neumáticos se desgasten de forma desigual.
    B: Activa su sistema de frenos antibloqueo (ABS).
    C: Le permite acelerar más rápido cuando la luz cambia a verde.
    D: Es menos probable que sea empujado hacia el tráfico en sentido contrario si
      lo golpean por detrás.
  answer: D
  explanation: Mientras espera para girar, mantenga las ruedas rectas y el pie en
    el freno. Si su vehículo es golpeado por detrás, es menos probable que sea empujado
    hacia el tráfico en sentido contrario.
- id: 107
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite realizar un giro a la izquierda mientras
    el semáforo está en rojo?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de sentido único.
    B: Al girar desde una calle de sentido único hacia otra calle de sentido único.
    C: Al girar desde una calle de sentido único hacia una calle de doble sentido.
    D: Los giros a la izquierda con luz roja nunca están permitidos.
  answer: B
  explanation: Puede realizar un giro a la izquierda desde una calle de sentido único
    hacia otra calle de sentido único mientras el semáforo está en rojo en ciertas
    situaciones, después de detenerse por completo y asegurarse de que la intersección
    esté despejada.
- id: 108
  category: sharing_the_road
  question: ¿Qué debe hacer si se acerca un vehículo de emergencia mientras conduce
    dentro de una rotonda?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda y esperar a que pase.
    B: Orillarse hacia la isla interior de la rotonda.
    C: Salir de la rotonda inmediatamente y luego orillarse.
    D: Acelerar para salir de la rotonda antes de que entre el vehículo de emergencia.
  answer: C
  explanation: Si se acerca un vehículo de emergencia, salga de la rotonda inmediatamente
    y luego oríllese. No se detenga dentro de la rotonda.
- id: 109
  category: safe_driving_rules
  question: Los giros en U son ilegales cerca de las cimas de las colinas y en curvas
    donde otros conductores no pueden verlo desde qué distancia?
  choices:
    A: 500 pies
    B: 750 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: También son ilegales cerca de las cimas de las colinas y en curvas
    donde otros conductores no pueden verlo desde una distancia de 1,000 pies.
- id: 110
  category: safe_driving_rules
  question: ¿Cuál es la primera maniobra que debe realizar un conductor en una calle
    lateral al cruzar una carretera dividida en un giro en J (J-turn)?
  choices:
    A: Un giro a la izquierda hacia la mediana
    B: Un giro en U en el carril de paso
    C: Un giro a la derecha hacia la carretera
    D: Seguir recto a través de todos los carriles
  answer: C
  explanation: En un giro en J (J-turn), los conductores en la calle lateral que se
    acercan a la carretera dividida siempre realizan un giro a la derecha. Para cruzar
    la carretera o realizar un giro a la izquierda, primero deben girar a la derecha
    hacia la carretera y luego entrar en el carril de giro a la izquierda para completar
    un giro en U.
- id: 111
  category: safe_driving_rules
  question: ¿En una carretera con más de un carril en la misma dirección, cuándo se
    le permite conducir en el carril del extremo izquierdo?
  choices:
    A: Cuando conduce exactamente al límite de velocidad.
    B: Al adelantar y rebasar a otro vehículo en la misma dirección.
    C: Cuando conduce un vehículo comercial.
    D: Cuando desea evitar el tráfico que se incorpora desde las rampas de entrada.
  answer: B
  explanation: En carreteras con más de un carril en la misma dirección, conduzca
    en el carril derecho cuando esté disponible. Las excepciones a esta regla incluyen
    cuando se adelanta y rebasa a otro vehículo en la misma dirección.
- id: 112
  category: defensive_driving
  question: ¿Cuál de los siguientes puede crear puntos ciegos temporales al conducir?
  choices:
    A: La posición de los pilares del techo.
    B: Parabrisas sucios y luces deslumbrantes.
    C: Espejos laterales ajustados correctamente.
    D: Conducir un vehículo de más de 40 pies de largo.
  answer: B
  explanation: El diseño de su vehículo y la posición de los pilares del techo determinan
    la ubicación de sus puntos ciegos. Los parabrisas sucios y las luces deslumbrantes
    también pueden crear puntos ciegos temporales.
- id: 113
  category: sharing_the_road
  question: En una rotonda de varios carriles, si dos vehículos grandes se aproximan
    y pasan al mismo tiempo, ¿quién debe ceder el paso?
  choices:
    A: El vehículo de la derecha debe ceder el paso al vehículo de la izquierda.
    B: El vehículo de la izquierda debe ceder el paso al vehículo de la derecha.
    C: El vehículo que viaja más rápido debe ceder el paso.
    D: El vehículo que entró primero en la rotonda debe ceder el paso.
  answer: A
  explanation: En las rotondas de varios carriles, si dos vehículos grandes se aproximan
    y pasan al mismo tiempo, el conductor de la derecha debe ceder el paso al vehículo
    de la izquierda, reduciendo la velocidad o deteniéndose si es necesario.
- id: 114
  category: defensive_driving
  question: ¿Por qué es necesario reducir la velocidad al conducir por caminos de
    grava o tierra?
  choices:
    A: Porque se tarda más en detenerse y es más fácil derrapar al girar.
    B: Porque sus neumáticos perderán presión de aire más rápidamente.
    C: Porque es ilegal conducir a más de 30 mph en caminos no pavimentados.
    D: Porque los puntos ciegos de su vehículo se vuelven más grandes.
  answer: A
  explanation: En caminos de grava o tierra, debe reducir la velocidad porque se tarda
    más en detenerse y es más fácil derrapar al girar.
- id: 115
  category: safe_driving_rules
  question: ¿En qué lugar siempre es ilegal dar una vuelta en U?
  choices:
    A: En una calzada con dos o más carriles en la misma dirección.
    B: En autopistas interestatales.
    C: En cualquier intersección con semáforo.
    D: En una carretera dividida con una apertura en la mediana.
  answer: B
  explanation: No debe dar vueltas en U en las autopistas interestatales.
- id: 116
  category: safe_driving_rules
  question: ¿En qué dirección debe conducir al entrar en una rotonda?
  choices:
    A: En el sentido de las agujas del reloj.
    B: En sentido contrario a las agujas del reloj.
    C: Directamente a través de la isla central.
    D: En la dirección del carril más interno.
  answer: B
  explanation: 'Al entrar en una rotonda: Conduzca en sentido contrario a las agujas
    del reloj hasta llegar a su salida.'
- id: 117
  category: defensive_driving
  question: ¿Por qué debería girar la cabeza para revisar el carril al que se está
    moviendo en lugar de confiar únicamente en sus espejos?
  choices:
    A: Los espejos distorsionan la velocidad de los vehículos que se aproximan.
    B: Podría no ver vehículos que se encuentran en sus puntos ciegos.
    C: Los espejos solo son obligatorios para dar marcha atrás.
    D: Girar la cabeza activa el sistema de monitoreo de puntos ciegos del vehículo.
  answer: B
  explanation: Gire la cabeza para revisar si hay vehículos en el carril al que se
    está moviendo. No confíe únicamente en los espejos; podría no ver vehículos que
    se encuentran en sus puntos ciegos.
- id: 118
  category: safe_driving_rules
  question: Al adelantar a otro vehículo, ¿cuándo es seguro regresar al carril derecho?
  choices:
    A: Cuando esté a 50 pies por delante del vehículo rebasado.
    B: Cuando pueda ver todo el vehículo que acaba de rebasar en su espejo retrovisor.
    C: Tan pronto como su parachoques trasero pase la parte delantera del vehículo
      rebasado.
    D: Cuando el conductor al que rebasó parpadee sus luces delanteras.
  answer: B
  explanation: El manual establece que debe regresar al carril derecho cuando pueda
    ver todo el vehículo que acaba de rebasar en su espejo retrovisor.
- id: 119
  category: safe_driving_rules
  question: Al adelantar en una carretera de dos carriles, ¿debe regresar al lado
    derecho de la carretera antes de llegar a qué distancia de un vehículo que viene
    en sentido contrario?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Debe regresar al lado derecho de la carretera antes de estar a menos
    de 100 pies de un vehículo que viene en sentido contrario.
- id: 120
  category: safe_driving_rules
  question: 'No debe adelantar a otro vehículo en una curva o colina donde no pueda
    ver claramente el camino por delante durante al menos:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 700 pies
    D: 1000 pies
  answer: C
  explanation: No adelante en una curva o colina donde no pueda ver claramente el
    camino por delante durante al menos 700 pies.
- id: 121
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones es legal rebasar a otro vehículo
    por la derecha?
  choices:
    A: Cuando el vehículo de adelante está girando a la izquierda y hay un arcén (hombro)
      pavimentado
    B: Conduciendo por un carril para bicicletas si está libre de ciclistas
    C: Cuando el vehículo al que está adelantando está girando o a punto de girar
      a la izquierda
    D: Conduciendo fuera del pavimento o de la parte principal de la carretera
  answer: C
  explanation: Un conductor puede rebasar por la derecha cuando el vehículo que está
    siendo adelantado está girando o a punto de girar a la izquierda. No debe rebasar
    conduciendo por un carril para bicicletas, por el arcén o fuera del pavimento.
- id: 122
  category: vehicle_information
  question: ¿Cuál es el procedimiento adecuado para mirar hacia atrás mientras retrocede
    su vehículo?
  choices:
    A: Confiar únicamente en su cámara de retroceso
    B: Confiar únicamente en sus espejos retrovisores y laterales
    C: Continuar mirando por la ventana trasera mientras retrocede
    D: Abrir la puerta del lado del conductor para mirar hacia atrás
  answer: C
  explanation: Antes y durante la maniobra de retroceso, debe continuar mirando por
    la ventana trasera. El manual establece explícitamente que no se debe confiar
    únicamente en los espejos o en la cámara de retroceso.
- id: 123
  category: safe_driving_rules
  question: Al estacionar en paralelo, ¿a qué distancia máxima del bordillo (curb)
    deben estar las ruedas de su vehículo más cercanas al lado de la carretera?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Cuando se estaciona en paralelo, las ruedas de su vehículo más cercanas
    al lado de la carretera no deben estar a más de 12 pulgadas del bordillo.
- id: 124
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios está prohibido estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: A
  explanation: No se permite estacionar a menos de 10 pies de un hidrante de incendios.
- id: 125
  category: safe_driving_rules
  question: ¿A cuántos pies del riel más cercano de un cruce ferroviario está prohibido
    estacionar?
  choices:
    A: 20 pies
    B: 30 pies
    C: 50 pies
    D: 100 pies
  answer: C
  explanation: No se permite estacionar a menos de 50 pies del riel más cercano de
    un cruce ferroviario.
- id: 126
  category: safe_driving_rules
  question: ¿Hacia dónde debe girar el volante al estacionar cuesta arriba en una
    carretera con bordillo?
  choices:
    A: Girar las ruedas hacia el bordillo
    B: Girar las ruedas en dirección contraria al bordillo
    C: Mantener las ruedas rectas
    D: Girar las ruedas hacia el arcén de la carretera
  answer: B
  explanation: Cuando la parte delantera de un vehículo estacionado apunta cuesta
    arriba y hay un bordillo, las ruedas deben girarse en dirección contraria al bordillo.
- id: 127
  category: safe_driving_rules
  question: 'Si se estaciona en una carretera por la noche, su vehículo debe tener
    al menos una luz delantera blanca o ámbar y una luz trasera roja encendidas. Estas
    luces deben ser visibles desde al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: Si se estaciona en la carretera por la noche, tanto la luz delantera
    blanca/ámbar como la luz trasera roja deben ser visibles desde al menos 500 pies.
- id: 128
  category: penalties_and_points
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las leyes
    de cinturón de seguridad en Minnesota?
  choices:
    A: Las autoridades pueden detener a los automovilistas únicamente por infracciones
      del cinturón de seguridad.
    B: Los pasajeros en el asiento trasero no están obligados a usar cinturones de
      seguridad.
    C: Los cinturones de seguridad son opcionales si el vehículo viaja a menos de
      25 mph.
    D: Solo el conductor está obligado a usar el cinturón de seguridad.
  answer: A
  explanation: En Minnesota, todos los vehículos deben tener cinturones de seguridad,
    todos deben usarlos (incluidos los pasajeros del asiento trasero) y las autoridades
    pueden detener a los automovilistas únicamente por infracciones del cinturón de
    seguridad.
- id: 129
  category: safe_driving_rules
  question: 'Usted está legalmente exento de usar el cinturón de seguridad si está:'
  choices:
    A: Conduciendo un vehículo de pasajeros en reversa.
    B: Conduciendo un vehículo fabricado después del 1 de enero de 1965.
    C: Conduciendo una camioneta (pickup) en una carretera estatal.
    D: Siendo un pasajero en el asiento trasero de un vehículo.
  answer: A
  explanation: No está legalmente obligado a usar el cinturón de seguridad si está
    conduciendo un vehículo de pasajeros en reversa.
- id: 130
  category: driver_responsibility
  question: ¿Cómo debe ajustarse correctamente el cinturón de regazo en su cuerpo?
  choices:
    A: Holgado a través de la parte blanda de su estómago
    B: Ajustado a través de su abdomen
    C: Ajustado a través de los huesos de la cadera o la parte superior de los muslos
    D: Alto a través de su caja torácica
  answer: C
  explanation: Ajuste el cinturón de regazo para que quede ceñido a través de los
    huesos de la cadera o la parte superior de los muslos. Nunca debe colocarse sobre
    el abdomen o la parte blanda del estómago.
- id: 131
  category: driver_responsibility
  question: ¿Según la ley de Minnesota, los niños menores de qué edad deben viajar
    en un asiento de seguridad orientado hacia atrás hasta que alcancen el límite
    de peso o altura del asiento?
  choices:
    A: 1 año de edad
    B: 2 años de edad
    C: 4 años de edad
    D: 8 años de edad
  answer: B
  explanation: Los niños menores de 2 años deben viajar en un asiento de seguridad
    orientado hacia atrás hasta que alcancen el límite de peso o altura del asiento
    de seguridad.
- id: 132
  category: safe_driving_rules
  question: ¿Cuándo se requiere que un niño use un asiento elevado (booster seat)
    asegurado con un cinturón de seguridad?
  choices:
    A: Desde el nacimiento hasta los 2 años
    B: De 2 a 4 años
    C: De 4 a 9 años
    D: De 9 a 12 años
  answer: C
  explanation: Según el manual, un niño de 4 a 9 años debe usar un asiento elevado
    (booster seat) y estar asegurado con un cinturón de seguridad si es demasiado
    alto o pesado para el asiento de seguridad infantil.
- id: 133
  category: vehicle_information
  question: Si un sistema de retención infantil no tiene una fecha de vencimiento
    específica estampada, ¿cuándo vence?
  choices:
    A: Cuatro años a partir de la fecha de compra
    B: Seis años a partir de la fecha de fabricación
    C: Ocho años a partir de la fecha de fabricación
    D: Diez años a partir de la fecha de compra
  answer: B
  explanation: El manual establece que los sistemas de retención infantil vencen seis
    años después de la fecha de fabricación. Si no figura ninguna fecha, debe seguir
    la recomendación de seis años.
- id: 134
  category: safe_driving_rules
  question: Para garantizar la seguridad al conducir un vehículo equipado con bolsas
    de aire (airbags), ¿qué posición de las manos en el volante debe evitar?
  choices:
    A: Las 8 y las 4
    B: Las 9 y las 3
    C: Las 10 y las 2
    D: Las 7 y las 5
  answer: C
  explanation: El manual sugiere mantener las manos en las posiciones de las 8 y las
    4 o de las 9 y las 3, y evitar la posición de las 10 y las 2.
- id: 135
  category: driver_responsibility
  question: Si se ve involucrado en un accidente de tráfico y no tiene la información
    de su seguro con usted, ¿cuánto tiempo tiene para proporcionarla a las autoridades?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 7 días
  answer: C
  explanation: Si el oficial que investiga le solicita la información del seguro y
    no la tiene con usted, debe proporcionarla en un plazo de 72 horas.
- id: 136
  category: penalties_and_points
  question: ¿Cuál es la multa máxima que podría enfrentar si es declarado culpable
    de operar un vehículo sin seguro?
  choices:
    A: $275
    B: $500
    C: $1,000
    D: $2,000
  answer: C
  explanation: Si es declarado culpable de operar un vehículo sin seguro, puede ser
    multado con hasta $1,000 y sentenciado a hasta 90 días de cárcel.
- id: 137
  category: vehicle_information
  question: ¿Qué tipo de cobertura de seguro es opcional para los conductores de motocicletas
    en Minnesota?
  choices:
    A: Seguro de responsabilidad civil por daños a la propiedad
    B: Seguro de responsabilidad civil por lesiones a otras personas
    C: Seguro sin culpa (no-fault) y de conductor sin seguro
    D: Ninguna de las anteriores
  answer: C
  explanation: Los conductores de motocicletas deben tener seguro de responsabilidad
    civil, pero la cobertura de seguro sin culpa (no-fault) y de conductor sin seguro
    es opcional.
- id: 138
  category: license_system
  question: ¿Cuántos días tiene para registrar su vehículo en Minnesota después de
    convertirse en residente?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Tiene hasta 60 días después de convertirse en residente para registrar
    su vehículo en Minnesota ante el DVS.
- id: 139
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia es legal usar un teléfono celular para leer o
    enviar un mensaje electrónico mientras conduce?
  choices:
    A: Cuando está detenido en un semáforo en rojo
    B: Cuando usa el dispositivo en modo activado por voz o manos libres
    C: Cuando conduce por una carretera rural sin tráfico
    D: Cuando lee un mensaje de un familiar
  answer: B
  explanation: Las excepciones a la prohibición de redactar, leer o enviar mensajes
    electrónicos mientras se conduce incluyen el uso del dispositivo en modo activado
    por voz o manos libres, obtener asistencia de emergencia o informar sobre un accidente
    o delito.
- id: 140
  category: penalties_and_points
  question: ¿Cuál es la sanción por una segunda o subsiguiente condena por usar un
    dispositivo de comunicación inalámbrica para redactar, leer o enviar mensajes
    mientras conduce?
  choices:
    A: Una multa de $275 además de la multa especificada por el tribunal
    B: Una multa de $500 y pérdida de los privilegios de conducir
    C: Una multa de $1,000 y hasta 90 días de cárcel
    D: Una tarifa de reinstalación de $30
  answer: A
  explanation: Si es declarado culpable de dos o más infracciones por usar un dispositivo
    de comunicación inalámbrica para redactar, leer o enviar mensajes mientras conduce,
    se le exigirá que pague una multa de $275 además de la multa especificada por
    el tribunal.
- id: 141
  category: sharing_the_road
  question: ¿Qué debe hacer antes de incorporarse a una carretera desde un callejón,
    una entrada privada o un estacionamiento?
  choices:
    A: Ceder el paso solo si se aproximan otros vehículos
    B: Detenerse por completo antes de cruzar una acera o un paso de peatones
    C: Reducir la velocidad a 10 mph y proceder con precaución
    D: Tocar la bocina para advertir a los peatones
  answer: B
  explanation: Debe detenerse por completo antes de incorporarse a una carretera desde
    un callejón, una entrada privada, un estacionamiento o una rampa de estacionamiento,
    y siempre detenerse antes de cruzar una acera o un paso de peatones.
- id: 142
  category: signs_and_signals
  question: ¿Con cuánta antelación activará el conductor de un autobús escolar las
    luces amarillas intermitentes en una zona de velocidad de más de 35 mph?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: D
  explanation: Los conductores de autobuses activarán las luces amarillas intermitentes
    al menos 300 pies antes de detenerse en una zona de velocidad de más de 35 mph.
- id: 143
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene con sus luces rojas intermitentes
    y el brazo de parada extendido, ¿a qué distancia debe detener su vehículo?
  choices:
    A: Al menos 10 pies
    B: Al menos 20 pies
    C: Al menos 30 pies
    D: Al menos 50 pies
  answer: B
  explanation: Cuando vea un autobús escolar detenido con sus luces rojas intermitentes
    y su brazo de parada extendido, debe detener su vehículo a una distancia mínima
    de 20 pies del autobús.
- id: 144
  category: sharing_the_road
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar con las luces
    rojas intermitentes?
  choices:
    A: Cuando conduce por una carretera dividida y el autobús está en el lado opuesto
      del divisor
    B: Cuando llega tarde a una emergencia
    C: Cuando el autobús está detenido en un cruce de ferrocarril
    D: Cuando se aproxima al autobús por delante en una carretera de dos carriles
  answer: A
  explanation: Si conduce por una carretera dividida, no es necesario detenerse ante
    un autobús escolar con luces rojas intermitentes si este se encuentra en el lado
    opuesto del divisor.
- id: 145
  category: driver_responsibility
  question: ¿Qué debe hacer si se ve involucrado en un choque que solo resulta en
    daños a la propiedad?
  choices:
    A: Debe llamar al 911 de inmediato.
    B: Debe notificar a las autoridades policiales en un plazo de 72 horas.
    C: No es necesario notificar a las autoridades policiales, pero debe informar
      al propietario si daña una propiedad que no sea un vehículo.
    D: Debe dejar una nota en el vehículo dañado y marcharse.
  answer: C
  explanation: Si el choque solo resulta en daños a la propiedad, no es necesario
    notificar a las autoridades policiales. Si daña una propiedad que no sea un vehículo,
    informe al propietario de la misma.
- id: 146
  category: sharing_the_road
  question: Al conducir por una carretera dividida, ¿está obligado a detenerse ante
    un autobús escolar con las luces rojas intermitentes si este se encuentra en el
    lado opuesto del divisor?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar.
    B: No, no es necesario detenerse si está en el lado opuesto del divisor.
    C: Sí, a menos que esté conduciendo por el carril de la extrema derecha.
    D: No, pero debe reducir la velocidad a 10 mph.
  answer: B
  explanation: Según el manual, si conduce por una carretera dividida, no es necesario
    detenerse ante un autobús escolar con luces rojas intermitentes si este se encuentra
    en el lado opuesto del divisor.
- id: 147
  category: penalties_and_points
  question: Si su vehículo se utiliza para violar la ley del brazo de parada del autobús
    escolar y usted es el propietario, ¿qué sanción podría enfrentar si no puede demostrar
    que otra persona estaba conduciendo?
  choices:
    A: Un delito grave (felony)
    B: Un delito menor grave (gross misdemeanor)
    C: Un delito menor leve (petty misdemeanor)
    D: Una advertencia
  answer: C
  explanation: El manual establece que cuando su vehículo se utiliza para violar la
    ley del brazo de parada del autobús escolar, usted es culpable de un delito menor
    leve (petty misdemeanor) si es el propietario o arrendatario del vehículo.
- id: 148
  category: penalties_and_points
  question: ¿Cuál es la sanción por una segunda infracción en el plazo de un año por
    conducir a través de una fila de niños que cruzan la calle?
  choices:
    A: Un delito menor leve (petty misdemeanor)
    B: Un delito menor (misdemeanor)
    C: Un delito menor grave (gross misdemeanor)
    D: Un delito grave (felony)
  answer: C
  explanation: Violar la ley al conducir a través de una fila de niños que cruzan
    la calle es un delito menor (misdemeanor), y una segunda infracción en el plazo
    de un año es un delito menor grave (gross misdemeanor).
- id: 149
  category: safe_driving_rules
  question: Cuando llega a una intersección sin semáforos ni señales al mismo tiempo
    que otro conductor, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que va más rápido
    D: El conductor que gira a la izquierda
  answer: B
  explanation: En las intersecciones sin semáforos ni señales, cuando se llega a la
    intersección al mismo tiempo que otro conductor, el conductor de la izquierda
    debe ceder el paso al de la derecha.
- id: 150
  category: safe_driving_rules
  question: Al acercarse a una intersección en "T" no controlada, ¿quién debe ceder
    el derecho de paso?
  choices:
    A: El conductor que circula por la carretera principal
    B: El conductor que está girando
    C: El conductor de la derecha
    D: El conductor de la izquierda
  answer: B
  explanation: Cuando se aproxima a una intersección en "T" no controlada, debe ceder
    el paso a todo el tráfico transversal si usted es quien está girando.
- id: 151
  category: sharing_the_road
  question: ¿Qué debe hacer cuando conduce por el carril derecho y un autobús de tránsito
    o de transporte para personas con discapacidad (metro mobility) intenta incorporarse
    desde una parada de autobús o el acotamiento?
  choices:
    A: Tocar la bocina y mantener su velocidad
    B: Cambiarse al carril izquierdo inmediatamente
    C: Ceder el paso al autobús que se incorpora
    D: Acelerar para pasar al autobús antes de que se incorpore
  answer: C
  explanation: Cuando conduce por el carril derecho, debe ceder el paso a los autobuses
    de tránsito y de transporte para personas con discapacidad que se incorporan desde
    una parada de autobús o el acotamiento.
- id: 152
  category: safe_driving_rules
  question: ¿Cómo debe reaccionar cuando un vehículo de emergencia con luces rojas
    intermitentes y sirena se le acerca en una calle de sentido único?
  choices:
    A: Detenerse a la derecha
    B: Detenerse en el lado más cercano
    C: Detenerse inmediatamente en su carril actual
    D: Acelerar para quitarse del camino
  answer: B
  explanation: En una calle de sentido único, cuando se acerca un vehículo de emergencia
    con luces rojas intermitentes y sirena, debe detenerse en el lado más cercano.
- id: 153
  category: safe_driving_rules
  question: Si se encuentra en una intersección cuando se acerca un vehículo de emergencia
    con las luces y la sirena encendidas, ¿qué debe hacer?
  choices:
    A: Detenerse inmediatamente en medio de la intersección
    B: Retroceder para salir de la intersección
    C: Cruzar la intersección antes de detenerse
    D: Girar a la izquierda inmediatamente
  answer: C
  explanation: Si se encuentra en una intersección cuando se acerca un vehículo de
    emergencia, debe cruzarla antes de detenerse.
- id: 154
  category: sharing_the_road
  question: Según la "Ley de Hacerse a un Lado" (Move Over Law), ¿qué debe hacer al
    acercarse a un vehículo de emergencia estacionado con luces intermitentes en una
    carretera con dos carriles en la misma dirección?
  choices:
    A: Cambiarse al carril más alejado del vehículo si es seguro hacerlo
    B: Detenerse junto al vehículo para preguntar si necesitan ayuda
    C: Mantener su carril y velocidad
    D: Tocar la bocina para alertar a los trabajadores de emergencia
  answer: A
  explanation: La "Ley de Hacerse a un Lado" (Move Over Law) exige que se cambie al
    carril más alejado del vehículo si es seguro hacerlo cuando un vehículo de emergencia
    con luces intermitentes está detenido en o junto a una carretera con dos carriles
    en la misma dirección.
- id: 155
  category: safe_driving_rules
  question: A menos que esté en una misión oficial de emergencia, ¿cuál es la distancia
    mínima a la que se le permite seguir a un vehículo de bomberos en una salida de
    emergencia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Solo los vehículos en misiones oficiales de emergencia tienen permitido
    seguir a menos de 500 pies de un vehículo de bomberos en una salida de emergencia.
- id: 156
  category: driver_responsibility
  question: ¿Cuál de las siguientes opciones describe mejor la "conducción temeraria"
    según el manual del conductor de Minnesota?
  choices:
    A: Conducir un vehículo ignorando a sabiendas un riesgo sustancial e injustificable
      que puede dañar a otros
    B: Detener un vehículo de manera que ponga en peligro la propiedad
    C: Conducir a 5 mph por encima del límite de velocidad indicado
    D: No usar la luz de giro al cambiar de carril
  answer: A
  explanation: La conducción temeraria significa conducir un vehículo ignorando a
    sabiendas un riesgo sustancial e injustificable que puede dañar a otras personas
    o su propiedad, incluyendo las carreras de autos.
- id: 157
  category: safe_driving_rules
  question: Si un oficial de la ley lo detiene después de que oscurezca, ¿qué acción
    debe tomar dentro de su vehículo?
  choices:
    A: Apagar los faros delanteros
    B: Encender la luz interior del vehículo
    C: Encender las luces de emergencia (hazard lights)
    D: Bajar todas las ventanillas
  answer: B
  explanation: Cuando lo detenga la policía después de que oscurezca, debe encender
    la luz interior de su vehículo.
- id: 158
  category: safe_driving_rules
  question: Cuando un oficial de la ley le pida ver su identificación y comprobante
    de seguro, ¿qué debe hacer si los documentos están fuera de su alcance?
  choices:
    A: Alcanzarlos rápidamente antes de que el oficial se acerque
    B: Decirle al oficial dónde se encuentran antes de intentar alcanzarlos
    C: Salir del vehículo para sacarlos del maletero
    D: Negarse a proporcionarlos hasta que llegue un supervisor
  answer: B
  explanation: Si los documentos están fuera de su alcance, dígale al oficial dónde
    se encuentran antes de intentar alcanzarlos.
- id: 159
  category: driver_responsibility
  question: Si tiene un arma de fuego en el vehículo y la policía lo detiene, ¿cuál
    es el procedimiento correcto cuando el oficial se acerca por primera vez?
  choices:
    A: Entregar el arma de fuego al oficial inmediatamente
    B: Esconder el arma de fuego debajo del asiento
    C: Informar al oficial que tiene un arma de fuego y dónde se encuentra
    D: Salir del vehículo y declarar que está armado
  answer: C
  explanation: Cuando el oficial se acerque por primera vez, infórmele que tiene un
    arma de fuego y dónde se encuentra, mientras mantiene las manos en el volante.
- id: 160
  category: sharing_the_road
  question: ¿Cómo debe reaccionar cuando se encuentra con un cortejo fúnebre que se
    identifica con los faros delanteros o las luces de emergencia?
  choices:
    A: Ceder el paso solo al vehículo guía
    B: Rebasar el cortejo por la derecha
    C: Ceder el paso a todo el cortejo
    D: Incorporarse al cortejo para mantener el flujo del tráfico
  answer: C
  explanation: Cuando un cortejo fúnebre se identifica con los faros delanteros o
    las luces de emergencia, debe ceder el paso a todo el cortejo.
- id: 161
  category: safe_driving_rules
  question: ¿Qué debe hacer si necesita alcanzar un objeto dentro de su vehículo durante
    una parada de tráfico?
  choices:
    A: Alcáncelo rápidamente para que el oficial no tenga que esperar.
    B: Dígale al oficial lo que necesita localizar y espere el permiso verbal.
    C: Salga del vehículo para recuperar el objeto.
    D: Entregue al oficial su registro antes de intentar alcanzar cualquier otra cosa.
  answer: B
  explanation: El manual establece que si necesita alcanzar un objeto, debe decirle
    al oficial lo que necesita localizar y esperar el permiso verbal antes de hacerlo.
- id: 162
  category: driver_responsibility
  question: 'Cuando acepta una citación durante una parada de tráfico, usted está:'
  choices:
    A: Admitiendo su culpabilidad por la infracción.
    B: Declarándose nolo contendere (sin disputa) a los cargos.
    C: Confirmando la recepción de la citación y prometiendo comparecer ante el tribunal
      si es necesario.
    D: Renunciando a su derecho a una audiencia.
  answer: C
  explanation: Según el manual, usted no está admitiendo culpabilidad ni responsabilidad
    al aceptar una citación; está confirmando la recepción de la citación y prometiendo
    comparecer ante el tribunal si es necesario.
- id: 163
  category: penalties_and_points
  question: 'Huir de un oficial de policía en un vehículo motorizado se clasifica
    como un:'
  choices:
    A: Falta leve (Petty misdemeanor)
    B: Delito menor (Misdemeanor)
    C: Delito menor grave (Gross misdemeanor)
    D: Delito grave (Felony)
  answer: D
  explanation: El manual establece explícitamente que huir de un oficial de policía
    en un vehículo motorizado es ilegal y peligroso, y violar esta ley es un delito
    grave (felony).
- id: 164
  category: penalties_and_points
  question: 'Si alguien muere mientras un conductor huye de un oficial de policía,
    el conductor puede ser sentenciado a hasta:'
  choices:
    A: 3 años de prisión y una multa de $5,000.
    B: 5 años de prisión y una multa de $10,000.
    C: 7 años de prisión y una multa de $14,000.
    D: 10 años de prisión y una multa de $20,000.
  answer: D
  explanation: Si ocurre una muerte mientras huye de un oficial de policía, puede
    ser sentenciado a hasta 10 años de prisión, una multa de hasta $20,000, o ambos.
- id: 165
  category: sharing_the_road
  question: ¿Qué NO debe hacer al encontrarse con un peatón ciego con un bastón blanco
    o un perro guía?
  choices:
    A: Detenerse y esperar a que pasen por su carril.
    B: Ceder el derecho de paso.
    C: Usar la bocina o acelerar el motor.
    D: Mantenerse alerta y cauteloso.
  answer: C
  explanation: 'El manual aconseja vigilar a los peatones ciegos y establece: "No
    use la bocina ni acelere el motor, ya que esto puede distraerlos".'
- id: 166
  category: safe_driving_rules
  question: 'Si otro vehículo se ha detenido para un peatón en un cruce peatonal,
    usted debe:'
  choices:
    A: Rebasarlo por el lado derecho.
    B: Tocar la bocina para advertir al peatón.
    C: No rebasar al vehículo detenido.
    D: Rebasarlo lentamente por el lado izquierdo.
  answer: C
  explanation: Es ilegal rebasar a un vehículo que se ha detenido para un peatón.
    Debe buscar peatones en el cruce y estar preparado para detenerse.
- id: 167
  category: safe_driving_rules
  question: 'Si es necesario caminar por una carretera sin aceras, los peatones deben:'
  choices:
    A: Caminar por el lado derecho con el tráfico.
    B: Caminar por el lado izquierdo o de frente al tráfico que viene en sentido contrario.
    C: Caminar en el centro del carril.
    D: Caminar en zigzag para mantenerse visible.
  answer: B
  explanation: El manual establece que si es necesario caminar por la carretera, los
    peatones deben permanecer en el lado izquierdo o de frente al tráfico que viene
    en sentido contrario.
- id: 168
  category: sharing_the_road
  question: 'Al rebasar a un ciclista, debe mantener una distancia mínima de:'
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: Tenga precaución al rebasar a un ciclista. Debe mantener al menos 3
    pies entre el costado de su automóvil y el ciclista.
- id: 169
  category: safe_driving_rules
  question: ¿Cuándo es legal cruzar el centro de la calzada en una zona de no rebasar
    para pasar a un ciclista?
  choices:
    A: Nunca.
    B: Solo durante las horas del día.
    C: Cuando sea seguro hacerlo.
    D: Solo si el ciclista le indica que pase.
  answer: C
  explanation: Se le permite cruzar el centro de la calzada para rebasar a un ciclista,
    incluso en una zona de no rebasar, cuando sea seguro hacerlo.
- id: 170
  category: sharing_the_road
  question: Según la ley de Minnesota, ¿cómo puede un ciclista tratar una señal de
    pare (stop) si no hay ningún vehículo cerca?
  choices:
    A: Deben detenerse por completo durante 3 segundos.
    B: Deben bajarse de la bicicleta y caminar con ella a través de la intersección.
    C: Pueden reducir la velocidad hasta una que permita detenerse, y girar o continuar
      sin detenerse.
    D: Deben esperar a que la luz esté en verde.
  answer: C
  explanation: En las señales de pare, los ciclistas deben reducir la velocidad hasta
    una que permita detenerse antes de entrar en la intersección o el cruce peatonal.
    Si no hay ningún vehículo cerca, pueden girar o continuar sin detenerse.
- id: 171
  category: signs_and_signals
  question: ¿Cómo puede un ciclista indicar un giro a la derecha usando señales manuales?
  choices:
    A: Extendiendo el brazo izquierdo hacia afuera.
    B: Extendiendo el brazo izquierdo y doblándolo hacia el suelo.
    C: Extendiendo el brazo izquierdo y doblándolo hacia arriba.
    D: Apuntando hacia adelante con el brazo derecho.
  answer: C
  explanation: Un ciclista puede indicar un giro a la derecha extendiendo su brazo
    izquierdo y doblándolo hacia arriba, o extendiendo su brazo derecho hacia afuera.
- id: 172
  category: sharing_the_road
  question: 'Al circular en bicicleta por una acera o un cruce peatonal, el ciclista
    debe:'
  choices:
    A: Ceder el paso a los peatones y dar una señal audible antes de rebasarlos.
    B: Circular lo más rápido posible para despejar el área rápidamente.
    C: Obligar a los peatones a bajarse de la acera.
    D: Circular únicamente en sentido contrario al tráfico.
  answer: A
  explanation: Al circular por aceras y cruces peatonales, los ciclistas deben ceder
    el paso a los peatones y dar una señal audible antes de rebasarlos.
- id: 173
  category: sharing_the_road
  question: 'Un ciclista puede cruzar una intersección con semáforo en rojo si la
    señal no logra detectarlo, no hay un peligro inmediato y:'
  choices:
    A: Ha esperado al menos 10 segundos.
    B: La bicicleta se ha detenido por completo y ha esperado una cantidad de tiempo
      irrazonable.
    C: Toca la bocina primero.
    D: Circula en un grupo de tres o más personas.
  answer: B
  explanation: Un ciclista puede cruzar un semáforo en rojo si la bicicleta se ha
    detenido por completo, la señal permanece en rojo por un tiempo irrazonable o
    no detecta la bicicleta, y ningún vehículo que se aproxime represente un peligro
    inmediato.
- id: 174
  category: vehicle_information
  question: 'Una bicicleta motorizada (ciclomotor o moped) se define por una capacidad
    de velocidad de:'
  choices:
    A: 20 mph o menos
    B: 30 mph o menos
    C: 40 mph o menos
    D: 50 mph o menos
  answer: B
  explanation: Una "bicicleta motorizada" es un ciclomotor y se define por su capacidad
    de velocidad, que es de 30 mph o menos.
- id: 175
  category: safe_driving_rules
  question: ¿Dónde NO se permite operar bicicletas motorizadas (ciclomotores)?
  choices:
    A: En calles de la ciudad
    B: En caminos rurales
    C: En aceras, autopistas o senderos para peatones/bicicletas
    D: En áreas de estacionamiento designadas para motocicletas
  answer: C
  explanation: No se permiten bicicletas motorizadas en aceras, autopistas ni en carriles
    o senderos designados para peatones y bicicletas.
- id: 176
  category: sharing_the_road
  question: ¿Cuál debe ser su distancia de seguimiento al conducir detrás de una motocicleta
    en comparación con otro vehículo?
  choices:
    A: Menor que su distancia de seguimiento con otros vehículos.
    B: Igual o mayor que su distancia de seguimiento con otros vehículos.
    C: Exactamente el doble de la distancia que dejaría para un vehículo comercial.
    D: Al menos 100 pies en todo momento.
  answer: B
  explanation: El manual establece que su distancia de seguimiento con una motocicleta
    debe ser igual o mayor que su distancia de seguimiento con otros vehículos para
    permitir espacio de maniobra si el conductor experimenta dificultades.
- id: 177
  category: sharing_the_road
  question: ¿Dónde ocurren las colisiones más comunes entre motocicletas y automóviles?
  choices:
    A: En carreteras rurales.
    B: En intersecciones urbanas.
    C: En carriles para vehículos de alta ocupación.
    D: En las rampas de entrada a la autopista.
  answer: B
  explanation: Según el manual, los choques en intersecciones urbanas son las colisiones
    más comunes entre motocicletas y automóviles, y a menudo ocurren cuando los conductores
    no ceden el paso y giran a la izquierda frente a una motocicleta que se aproxima.
- id: 178
  category: safe_driving_rules
  question: ¿En qué tipos de calles se permite conducir Vehículos Eléctricos de Vecindario
    (NEV)?
  choices:
    A: Solo en calles con límites de velocidad de 25 mph o menos.
    B: Solo en calles con límites de velocidad de 35 mph o menos.
    C: Cualquier calle excepto autopistas.
    D: Solo en carriles y senderos designados para bicicletas.
  answer: B
  explanation: El manual establece que cualquier persona con una licencia de conducir
    Clase D puede conducir un NEV, pero solo en calles con límites de velocidad de
    35 mph o menos.
- id: 179
  category: sharing_the_road
  question: ¿Cuánto tiempo más suele tardar en rebasar a un vehículo comercial que
    a un automóvil en una carretera nivelada?
  choices:
    A: De uno a dos segundos más.
    B: De tres a cinco segundos más.
    C: De cinco a siete segundos más.
    D: Diez segundos más.
  answer: B
  explanation: El manual especifica que se tarda de tres a cinco segundos más en rebasar
    a un vehículo comercial que a un automóvil en una carretera nivelada.
- id: 180
  category: defensive_driving
  question: Al encontrarse con un vehículo comercial que viene en dirección opuesta,
    ¿cómo afecta la turbulencia del viento a los vehículos?
  choices:
    A: Empujará a los vehículos uno hacia el otro.
    B: Empujará a los vehículos alejándolos uno del otro.
    C: Succionará al vehículo más pequeño debajo del vehículo comercial.
    D: Hará que el vehículo comercial pierda velocidad.
  answer: B
  explanation: El manual señala que al encontrarse con un vehículo comercial en dirección
    opuesta, la turbulencia empujará a los vehículos alejándolos uno del otro, no
    uno hacia el otro.
- id: 181
  category: sharing_the_road
  question: ¿Aproximadamente cuánta distancia puede necesitar un camión articulado
    (tractor-trailer) con carga completa para detenerse por completo cuando viaja
    a 55 mph?
  choices:
    A: De 130 a 140 pies.
    B: 200 pies.
    C: 300 pies.
    D: Más de 400 pies.
  answer: D
  explanation: Mientras que un automóvil de pasajeros promedio que viaja a 55 mph
    puede detenerse en una distancia de 130 a 140 pies, un camión articulado con carga
    completa puede necesitar más de 400 pies para detenerse por completo.
- id: 182
  category: defensive_driving
  question: ¿Dónde debe posicionar su vehículo si se detiene detrás de un vehículo
    comercial en una pendiente ascendente?
  choices:
    A: En el lado derecho de su carril para que el conductor pueda verlo en el espejo
      retrovisor.
    B: En el lado izquierdo de su carril para que el conductor pueda verlo en el espejo
      lateral.
    C: Directamente en el centro del carril, a menos de 10 pies detrás del camión.
    D: En el arcén derecho para evitar rodar hacia atrás.
  answer: B
  explanation: Si se detiene detrás de un vehículo comercial en una pendiente ascendente,
    debe posicionar su vehículo en el lado izquierdo de su carril para que el conductor
    pueda verlo en el espejo lateral, y dejar espacio para que el camión ruede ligeramente
    hacia atrás.
- id: 183
  category: sharing_the_road
  question: ¿Por qué debe evitar rebasar a un vehículo comercial por el lado derecho
    si existe la posibilidad de que este realice un giro a la derecha?
  choices:
    A: El vehículo comercial acelerará durante el giro.
    B: Las ruedas delanteras siguen una trayectoria más corta que las ruedas traseras.
    C: Las ruedas traseras de un vehículo que gira siguen una trayectoria más corta
      que las ruedas delanteras.
    D: Los vehículos comerciales no tienen permitido legalmente realizar giros a la
      derecha.
  answer: C
  explanation: Las ruedas traseras de un vehículo que gira siguen una trayectoria
    más corta que las ruedas delanteras. Muchos vehículos comerciales realizan giros
    amplios a la derecha y, a veces, deben dejar un espacio abierto a la derecha justo
    antes de girar.
- id: 184
  category: sharing_the_road
  question: ¿Hasta qué distancia hacia atrás de un vehículo comercial puede extenderse
    su punto ciego (o 'no zone')?
  choices:
    A: Hasta 20 pies.
    B: Hasta 50 pies.
    C: Hasta 100 pies.
    D: Hasta 200 pies.
  answer: D
  explanation: Es posible que algunos conductores de camiones no puedan ver hasta
    20 pies por delante de la cabina, a ambos lados del remolque y hasta 200 pies
    por detrás.
- id: 185
  category: safe_driving_rules
  question: Cuando se activan las luces intermitentes o las barreras en un cruce de
    ferrocarril, ¿a qué distancia del riel o barrera más cercana debe detener su vehículo?
  choices:
    A: Al menos 5 pies.
    B: Al menos 10 pies.
    C: Al menos 20 pies.
    D: Al menos 50 pies.
  answer: B
  explanation: Cuando vea luces intermitentes o barreras activadas en un cruce de
    ferrocarril, debe detener su vehículo al menos a 10 pies del riel o barrera más
    cercana.
- id: 186
  category: safe_driving_rules
  question: ¿A qué distancia de un cruce de ferrocarril es ilegal rebasar a cualquier
    vehículo?
  choices:
    A: 50 pies.
    B: 100 pies.
    C: 200 pies.
    D: 500 pies.
  answer: B
  explanation: El manual establece que es ilegal rebasar a cualquier vehículo dentro
    de los 100 pies de un cruce de ferrocarril.
- id: 187
  category: sharing_the_road
  question: Al rebasar a un vehículo comercial, ¿cuándo es seguro volver a su carril?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del camión.
    B: Cuando pueda ver la parte delantera del vehículo comercial en su espejo retrovisor.
    C: Cuando esté 50 pies por delante del vehículo comercial.
    D: Inmediatamente después de tocar la bocina para señalar su regreso.
  answer: B
  explanation: Debe completar su maniobra de rebase rápidamente y volver a su carril
    solo cuando pueda ver la parte delantera del vehículo comercial en su espejo retrovisor.
- id: 188
  category: sharing_the_road
  question: ¿Qué debe hacer si un motociclista intenta rebasar su vehículo?
  choices:
    A: Acelerar para evitar que lo rebase.
    B: Moverse hacia el arcén para darle más espacio.
    C: Mantener su posición en el carril y su velocidad, y permitir que el motociclista
      complete el rebase.
    D: Tocar la bocina para advertirle del tráfico en sentido contrario.
  answer: C
  explanation: Si un motociclista intenta rebasarlo, mantenga su posición en el carril
    y su velocidad, y permita que el conductor complete el rebase.
- id: 189
  category: safe_driving_rules
  question: Después de detenerse por un tren en un cruce de ferrocarril, ¿cuándo es
    seguro avanzar a través de las vías?
  choices:
    A: Inmediatamente después de que pase el último vagón del tren.
    B: Cuando el tráfico de adelante haya avanzado y usted pueda proceder sin detenerse
      dentro de los 10 pies después de los rieles.
    C: Tan pronto como las barreras comiencen a levantarse.
    D: Cuando el tren esté al menos a 100 pies de distancia.
  answer: B
  explanation: Es seguro cruzar cuando el tráfico de adelante haya avanzado y usted
    pueda proceder sin detenerse dentro de los 10 pies después de los rieles, asegurándose
    de que no se aproxime un segundo tren.
- id: 190
  category: sharing_the_road
  question: ¿Por qué ocurren muchas colisiones entre automóviles y vehículos comerciales
    en las intersecciones?
  choices:
    A: Los vehículos comerciales no están obligados a detenerse en los semáforos en
      rojo.
    B: El conductor del automóvil juzga mal la velocidad y la distancia del vehículo
      comercial debido a su gran tamaño.
    C: Los vehículos comerciales aceleran mucho más rápido que los automóviles.
    D: Los vehículos comerciales no pueden usar señales de giro.
  answer: B
  explanation: Debido a su gran tamaño, los vehículos comerciales a menudo parecen
    viajar más lento de lo que realmente lo hacen, lo que provoca que los conductores
    juzguen mal su velocidad y distancia en las intersecciones.
- id: 191
  category: sharing_the_road
  question: ¿Qué debe hacer si su vehículo tiene una transmisión manual y se está
    preparando para cruzar las vías del tren?
  choices:
    A: Cambiar de marcha mientras su vehículo está dentro del cruce.
    B: Reducir la marcha antes de entrar al cruce.
    C: Poner punto muerto y cruzar las vías por inercia.
    D: Acelerar y subir de marcha antes de entrar al cruce.
  answer: B
  explanation: 'El manual establece: ''No cambie de marcha mientras su vehículo esté
    dentro de un cruce. Si su vehículo tiene una transmisión manual, reduzca la marcha
    antes de entrar al cruce''.'
- id: 192
  category: sharing_the_road
  question: ¿Cuál es el propósito de la señal azul del Sistema de Notificación de
    Emergencias (ENS) en un cruce a nivel de carretera y ferrocarril?
  choices:
    A: Proporcionar un número de teléfono disponible las 24 horas, los 7 días de la
      semana, para informar problemas o emergencias en la ubicación del ferrocarril.
    B: Indicar la frecuencia de radio para los próximos horarios de trenes.
    C: Advertir a los conductores sobre una próxima zona de construcción en la carretera.
    D: Mostrar la distancia al hospital o sala de emergencias más cercana.
  answer: A
  explanation: Según el manual, cada cruce de carretera y ferrocarril tiene una señal
    ENS que proporciona un número de teléfono disponible las 24 horas, los 7 días
    de la semana, para llamar e informar problemas o emergencias en la ubicación del
    ferrocarril.
- id: 193
  category: penalties_and_points
  question: ¿Cuál es la sanción por desobedecer un límite de velocidad o no obedecer
    a un banderillero en una zona de obras viales?
  choices:
    A: Una advertencia por escrito por la primera infracción.
    B: Una suspensión obligatoria de la licencia por 30 días.
    C: Una infracción y una multa económica.
    D: Servicio comunitario y escuela de tráfico obligatoria.
  answer: C
  explanation: El manual establece explícitamente que no obedecer a un banderillero
    o desobedecer el límite de velocidad en una zona de obras resultará en una infracción
    y una multa económica.
- id: 194
  category: safe_driving_rules
  question: Cuando el tráfico es denso y se acumula debido a una señal de 'carril
    cerrado más adelante', ¿cuál es el procedimiento adecuado de incorporación en
    cremallera (zipper merge)?
  choices:
    A: Incorporarse al carril abierto lo antes posible para evitar colarse en la fila.
    B: Permanecer en su carril actual hasta el punto de incorporación y luego turnarse
      para incorporarse.
    C: Conducir por el arcén para evitar la acumulación de tráfico e incorporarse
      al final.
    D: Ocupar ambos carriles para evitar que otros conductores lo adelanten.
  answer: B
  explanation: El procedimiento de incorporación en cremallera (zipper merge) requiere
    que los conductores permanezcan en su carril actual hasta el punto de incorporación
    cuando el tráfico se está acumulando, y luego se turnen con otros conductores
    para incorporarse de manera segura.
- id: 195
  category: defensive_driving
  question: ¿Cuál de los siguientes es un beneficio declarado de utilizar la incorporación
    en cremallera (zipper merge)?
  choices:
    A: Reduce la longitud total de los embotellamientos hasta en un 40 por ciento.
    B: Permite que los vehículos más rápidos rebasen el tráfico lento de manera segura.
    C: Aumenta la diferencia de velocidad entre los dos carriles.
    D: Alienta a los conductores a incorporarse lo antes posible.
  answer: A
  explanation: El manual enumera varios beneficios de la incorporación en cremallera
    (zipper merge), incluido que 'reduce la longitud total de los embotellamientos
    hasta en un 40 por ciento'.
- id: 196
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico de color marrón?
  choices:
    A: Servicios para automovilistas.
    B: Sitios históricos, culturales o recreativos.
    C: Cruces de peatones y bicicletas.
    D: Zonas de construcción o mantenimiento.
  answer: B
  explanation: En la sección de significados de los colores de las señales, el marrón
    indica sitios históricos, culturales o recreativos.
- id: 197
  category: signs_and_signals
  question: ¿Qué color de señal se utiliza para advertir y controlar el tráfico en
    las zonas de construcción?
  choices:
    A: Amarillo
    B: Rojo
    C: Naranja
    D: Amarillo verdoso
  answer: C
  explanation: El manual establece que las señales naranjas advierten y controlan
    en las zonas de construcción.
- id: 198
  category: signs_and_signals
  question: ¿Qué significa un círculo rojo con una franja roja diagonal sobre un símbolo?
  choices:
    A: Debe realizar la acción que se muestra en el símbolo.
    B: No debe realizar una determinada acción.
    C: La acción es recomendada pero no obligatoria por ley.
    D: Hay un peligro específico más adelante.
  answer: B
  explanation: Según la sección de señales reglamentarias, un círculo rojo con una
    franja roja diagonal sobre un símbolo indica que no debe realizar una determinada
    acción.
- id: 199
  category: safe_driving_rules
  question: ¿Cuándo se le permite conducir más lento que el límite de velocidad mínimo
    señalizado en una autopista interestatal?
  choices:
    A: Cuando conduce por el carril del extremo derecho.
    B: Cuando el mal tiempo o las malas condiciones de la carretera lo hagan necesario.
    C: Cuando conduce un vehículo comercial o remolca un tráiler.
    D: Nunca se le permite conducir más lento que el límite de velocidad mínimo señalizado.
  answer: B
  explanation: 'El manual establece: ''No conduzca más lento que el límite mínimo
    señalizado a menos que el mal tiempo o las malas condiciones de la carretera lo
    hagan necesario''.'
- id: 200
  category: signs_and_signals
  question: ¿Cómo debe utilizarse el carril central si está marcado como 'Carril central
    solo para girar a la izquierda'?
  choices:
    A: Está reservado para adelantar a vehículos más lentos.
    B: Debe compartirse y utilizarse únicamente para realizar giros a la izquierda
      por el tráfico que circula en cualquier dirección.
    C: Está reservado únicamente para vehículos de emergencia y autobuses.
    D: Puede utilizarse para realizar giros tanto a la izquierda como a la derecha.
  answer: B
  explanation: El manual explica que para un carril central solo para girar a la izquierda,
    'Debe compartir el carril central y utilizarlo únicamente para realizar giros
    a la izquierda cuando circule en cualquier dirección'.
- id: 201
  category: signs_and_signals
  question: ¿Qué indica un símbolo de diamante pintado en un carril de tráfico?
  choices:
    A: El carril termina más adelante y usted debe incorporarse.
    B: El carril está reservado para un uso específico o para ciertos tipos de vehículos.
    C: El carril es un carril designado para rebasar.
    D: El carril está cerrado temporalmente por construcción.
  answer: B
  explanation: Un símbolo de diamante indica un 'Carril para usos limitados', lo que
    significa que el carril de tráfico está reservado para un uso específico o para
    ciertos tipos de vehículos, como autobuses, bicicletas o automóviles con varios
    pasajeros.
- id: 202
  category: signs_and_signals
  question: ¿Qué significa una señal de 'exempt' (exento) debajo de una señal de cruce
    de ferrocarril?
  choices:
    A: El cruce está abandonado y ya no es utilizado por trenes.
    B: Los vehículos de pasajeros no necesitan buscar trenes en este cruce.
    C: Los conductores de autobuses y camiones pueden continuar sin detenerse, pero
      aún deben buscar trenes.
    D: Todos los vehículos deben detenerse por completo antes de cruzar.
  answer: C
  explanation: Una señal de 'exempt' (exento) significa que los conductores de autobuses
    y camiones, a quienes normalmente se les exige detenerse en los cruces de ferrocarril,
    pueden continuar sin detenerse. Sin embargo, los conductores aún deben mirar en
    ambas direcciones para ver si vienen trenes.
- id: 203
  category: safe_driving_rules
  question: ¿Qué puede hacer si tiene un permiso de estacionamiento para personas
    con discapacidad válido pero todos los espacios designados están ocupados?
  choices:
    A: Estacionar en un carril de bomberos designado con las luces de emergencia encendidas.
    B: Estacionar en ángulo y ocupar dos espacios de estacionamiento estándar.
    C: Estacionar en la acera más cercana a la entrada del edificio.
    D: Estacionar en una zona de carga comercial por hasta 30 minutos.
  answer: B
  explanation: 'El manual establece: ''Si los espacios de estacionamiento designados
    para personas con discapacidad están ocupados o no están disponibles, usted puede
    estacionar en ángulo y ocupar dos espacios de estacionamiento estándar si tiene
    un permiso o placas de circulación para personas con discapacidad válidos''.'
- id: 204
  category: signs_and_signals
  question: ¿Qué forma tiene una señal de advertencia de zona escolar?
  choices:
    A: Octágono
    B: Triángulo
    C: Pentágono
    D: Diamante
  answer: C
  explanation: El manual describe las señales de zona escolar como 'señales de advertencia
    en forma de pentágono, de color amarillo o amarillo-verde fluorescente'.
- id: 205
  category: signs_and_signals
  question: ¿Dónde se encuentra típicamente una señal de advertencia de 'No Passing
    Zone' (Zona de no rebasar)?
  choices:
    A: En el lado derecho de una carretera de varios carriles.
    B: En el lado izquierdo de una carretera de doble sentido.
    C: Suspendida sobre el centro de una intersección.
    D: En el lado derecho de una calle de un solo sentido.
  answer: B
  explanation: Según el manual, la señal de No Passing Zone 'se encuentra en el lado
    izquierdo de una carretera de doble sentido. Advierte del inicio de una zona donde
    está prohibido rebasar'.
- id: 206
  category: signs_and_signals
  question: 'Se debe mostrar un emblema de vehículo de movimiento lento en todos los
    vehículos que viajan a velocidades de:'
  choices:
    A: 25 mph o menos
    B: 30 mph o menos
    C: 35 mph o menos
    D: 40 mph o menos
  answer: B
  explanation: El manual establece que el emblema de vehículo de movimiento lento
    debe mostrarse en todos los vehículos que viajan a velocidades de 30 mph o menos,
    como implementos agrícolas o vehículos de tracción animal.
- id: 207
  category: vehicle_information
  question: Durante períodos de visibilidad reducida o desde el atardecer hasta el
    amanecer, ¿a qué distancia debe ser visible la luz o lámpara de los vehículos
    de tracción animal?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El manual establece que los vehículos de tracción animal deben tener
    una luz o lámpara visible a una distancia de 500 pies desde el atardecer hasta
    el amanecer, o durante períodos de visibilidad reducida.
- id: 208
  category: signs_and_signals
  question: Al acercarse a una señal de "Lane Ends" (Fin del carril) donde el carril
    derecho debe incorporarse al tráfico del carril izquierdo, ¿quién debe ceder el
    paso?
  choices:
    A: Los vehículos en el carril izquierdo
    B: Los vehículos en el carril derecho
    C: Cualquier vehículo que viaje más rápido
    D: Ninguno, ambos deben detenerse
  answer: B
  explanation: El manual especifica para una señal de Lane Ends que cuando dos carriles
    se convierten en uno, "Los vehículos del carril derecho deben ceder el paso" al
    incorporarse al tráfico del carril izquierdo.
- id: 209
  category: signs_and_signals
  question: ¿Qué indica una señal de "Added Lane" (Carril adicional)?
  choices:
    A: Dos carriles se convertirán en uno y usted debe incorporarse.
    B: La calzada ganará un carril adicional de tráfico y el nuevo tráfico no tendrá
      que incorporarse.
    C: Debe salir de la autopista inmediatamente.
    D: Una zona de construcción ha añadido un carril temporalmente.
  answer: B
  explanation: El manual establece que una señal de Added Lane significa que "La calzada
    ganará un carril adicional de tráfico. El nuevo tráfico no tendrá que incorporarse".
- id: 210
  category: penalties_and_points
  question: ¿Cuál es la multa para un automovilista que viola el límite de velocidad
    establecido en una zona de obras cuando hay trabajadores presentes?
  choices:
    A: $100
    B: $150
    C: $200
    D: $300
  answer: D
  explanation: 'El manual establece: "A los automovilistas que violen el límite de
    velocidad establecido en zonas de obras cuando haya trabajadores presentes se
    les impondrá una multa de $300".'
- id: 211
  category: signs_and_signals
  question: ¿Qué tipo de información proporcionan las señales de tráfico de color
    marrón?
  choices:
    A: Servicios para conductores, como gasolineras y hospitales
    B: Guía, como salidas y nombres de calles
    C: Sitios históricos, parques y otros puntos de interés
    D: Peligros en zonas de construcción y obras
  answer: C
  explanation: Según el manual, "Las señales marrones indican sitios históricos, parques
    y otros puntos de interés".
- id: 212
  category: signs_and_signals
  question: ¿Qué color de señal le dirige a servicios para conductores como teléfonos,
    gasolina, comida y hospitales?
  choices:
    A: Verde
    B: Azul
    C: Marrón
    D: Naranja
  answer: B
  explanation: 'El manual establece: "Las señales azules le dirigen a servicios como
    teléfonos, gasolina, comida, moteles, hospitales y áreas de descanso".'
- id: 213
  category: safe_driving_rules
  question: ¿Cómo debe tratar una intersección si la señal de control de tráfico no
    funciona?
  choices:
    A: Trátela como una parada de cuatro vías (four-way stop).
    B: Trátela como una intersección no controlada.
    C: Ceda el paso solo al tráfico a su derecha.
    D: Continúe sin detenerse si se encuentra en la carretera más grande.
  answer: B
  explanation: 'El manual indica: "Si un semáforo no funciona, trate la intersección
    como una intersección no controlada".'
- id: 214
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite entrar en una intersección controlada
    por un semáforo si no puede atravesarla por completo sin bloquear el tráfico transversal?
  choices:
    A: Si la luz está en verde.
    B: Si tiene prisa.
    C: Si se lo indica un agente de control de tráfico o un oficial de paz.
    D: Si no hay vehículos esperando actualmente en la calle transversal.
  answer: C
  explanation: No debe entrar en una intersección a menos que pueda atravesarla por
    completo sin bloquear el tráfico transversal. Una excepción es si es "dirigido
    por un agente de control de tráfico o un oficial de paz".
- id: 215
  category: safe_driving_rules
  question: ¿Cuándo es legal girar a la izquierda con una luz roja continua?
  choices:
    A: Al girar desde una carretera de doble sentido hacia una de un solo sentido.
    B: Al girar desde una calle de un solo sentido hacia otra calle transversal de
      un solo sentido, tras cumplir ciertas condiciones.
    C: Al girar desde una carretera de doble sentido hacia otra de doble sentido si
      no viene tráfico.
    D: Nunca es legal girar a la izquierda con luz roja.
  answer: B
  explanation: 'El manual establece: "Si se cumplen ciertas condiciones, puede realizar
    un giro a la izquierda desde una calle de un solo sentido hacia otra calle transversal
    de un solo sentido mientras el semáforo está en rojo".'
- id: 216
  category: signs_and_signals
  question: ¿Cómo debe responder ante una luz roja intermitente?
  choices:
    A: Reduzca la velocidad y continúe con precaución.
    B: Deténgase solo si hay peatones presentes.
    C: Trátela como una señal de ceder el paso.
    D: Trátela como una señal de alto (stop).
  answer: D
  explanation: 'El manual establece: "Trate una luz roja intermitente como una señal
    de alto. Deténgase por completo, ceda el paso a los vehículos y peatones que lleguen
    a la intersección antes que usted, y continúe cuando la intersección esté despejada".'
- id: 217
  category: safe_driving_rules
  question: Si está esperando en la intersección para realizar un giro y el semáforo
    cambia de amarillo a rojo, ¿qué debe hacer?
  choices:
    A: Retroceda inmediatamente.
    B: Quédese en la intersección hasta que la luz vuelva a estar en verde.
    C: Complete el giro tan pronto como sea seguro.
    D: Abandone el giro y siga recto.
  answer: C
  explanation: 'El manual aconseja: "Si está esperando en la intersección para realizar
    un giro y la señal cambia de amarillo a rojo, complete el giro tan pronto como
    sea seguro. No retroceda".'
- id: 218
  category: signs_and_signals
  question: ¿Qué significa una luz o flecha amarilla intermitente?
  choices:
    A: Deténgase y espere a la luz verde.
    B: La señal está a punto de cambiar a rojo.
    C: Atraviese la intersección con precaución.
    D: Usted tiene el derecho de paso sobre todo el resto del tráfico.
  answer: C
  explanation: Según el manual, "Una luz o flecha amarilla intermitente significa
    'precaución'. Atraviese la intersección con precaución".
- id: 219
  category: signs_and_signals
  question: ¿Qué debe hacer un peatón si ya está en la intersección y la señal de
    "No cruzar" (Don't Walk) comienza a parpadear?
  choices:
    A: Detenerse y esperar en medio de la intersección.
    B: Dar la vuelta y regresar a la acera de inicio.
    C: Correr lo más rápido posible hacia el otro lado.
    D: Continuar caminando hacia el otro lado a un ritmo normal.
  answer: D
  explanation: 'El manual establece: "Cuando la mano levantada o la señal de ''No
    cruzar'' está parpadeando... los peatones que ya están en la intersección pueden
    continuar caminando hacia el otro lado a un ritmo normal".'
- id: 220
  category: signs_and_signals
  question: ¿Qué indica una señal de control de uso de carril con una X amarilla fija?
  choices:
    A: Puede usar el carril de abajo para realizar un giro a la izquierda.
    B: Debe prepararse para cambiarse de carril de manera segura.
    C: Se le permite conducir en el carril de abajo.
    D: Debe detenerse inmediatamente en su carril actual.
  answer: B
  explanation: Una X amarilla fija significa que debe prepararse para cambiarse de
    carril de manera segura porque se está realizando un cambio en el control del
    carril de abajo.
- id: 221
  category: signs_and_signals
  question: ¿Qué significa si ve una X amarilla intermitente sobre su carril?
  choices:
    A: El carril está cerrado para todo el tráfico.
    B: Puede usar el carril para girar a la izquierda, pero debe tener precaución.
    C: Debe incorporarse a la derecha de inmediato.
    D: El carril está reservado solo para vehículos compartidos (carpools).
  answer: B
  explanation: Una X amarilla intermitente significa que puede usar el carril debajo
    de ella para girar a la izquierda. Debe tener precaución porque los vehículos
    que giran a la izquierda desde la otra dirección pueden estar usando el mismo
    carril.
- id: 222
  category: safe_driving_rules
  question: ¿Cuántos autos pueden avanzar cada vez que la luz se pone verde en un
    semáforo de rampa de autopista?
  choices:
    A: Un auto
    B: Dos autos
    C: Tres autos
    D: Tantos autos como sea posible antes de que se ponga roja
  answer: A
  explanation: Cuando las rampas tienen semáforos reguladores (ramp meters), los conductores
    deben turnarse para entrar a la autopista, y solo un auto puede avanzar cada vez
    que la luz está en verde.
- id: 223
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas más cortas y gruesas en el
    pavimento?
  choices:
    A: Hay un cruce de peatones más adelante.
    B: Puede rebasar a otros vehículos.
    C: El carril está terminando.
    D: Está entrando en una zona escolar.
  answer: C
  explanation: Las líneas blancas discontinuas más cortas y gruesas indican que el
    carril está terminando.
- id: 224
  category: signs_and_signals
  question: ¿Qué marca en el pavimento indica que NO debe cambiar de carril?
  choices:
    A: Líneas blancas discontinuas
    B: Líneas amarillas discontinuas
    C: Línea blanca continua
    D: Líneas blancas continuas dobles
  answer: D
  explanation: Las líneas blancas continuas dobles significan que no debe cambiar
    de carril. Una sola línea blanca continua significa que 'no debería' cambiar de
    carril.
- id: 225
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de las líneas amarillas en una calzada?
  choices:
    A: Separar los carriles de tráfico que viajan en la misma dirección.
    B: Separar el tráfico que se mueve en direcciones opuestas.
    C: Marcar cruces de peatones y espacios de estacionamiento.
    D: Indicar un carril reservado para bicicletas.
  answer: B
  explanation: Las líneas amarillas separan el tráfico que se mueve en direcciones
    opuestas.
- id: 226
  category: signs_and_signals
  question: 'Un carril central marcado por líneas amarillas paralelas continuas y
    discontinuas está designado para:'
  choices:
    A: Rebasar vehículos que se mueven lentamente.
    B: Solo vehículos de emergencia.
    C: Solo giros a la izquierda.
    D: Solo giros a la derecha.
  answer: C
  explanation: Un carril central entre carriles de tráfico que viajan en direcciones
    opuestas, marcado por líneas amarillas paralelas continuas y discontinuas, puede
    estar designado solo para giros a la izquierda.
- id: 227
  category: sharing_the_road
  question: ¿Cómo se marcan típicamente los carriles para vehículos compartidos (carpool)
    en una autopista?
  choices:
    A: Con un símbolo de diamante o señales de 'Carpool Only'.
    B: Con una línea blanca continua y una insignia de bicicleta.
    C: Con líneas blancas discontinuas más cortas y gruesas.
    D: Con una X roja fija en la parte superior.
  answer: A
  explanation: Los carriles para vehículos compartidos (carpool) se marcan con un
    símbolo de diamante o con señales de 'Carpool Only' (Solo vehículos compartidos),
    y están restringidos a vehículos con dos o más ocupantes.
- id: 228
  category: safe_driving_rules
  question: ¿Qué debe hacer si un oficial de tránsito le da una señal manual que contradice
    un semáforo?
  choices:
    A: Obedecer el semáforo.
    B: Obedecer la señal manual del oficial.
    C: Detenerse a un lado y esperar a que cambie la luz.
    D: Tocar la bocina para alertar al oficial sobre la luz.
  answer: B
  explanation: Cuando un oficial está presente, debe obedecer cualquier señal manual
    que se le dé en lugar de las señales de tráfico, letreros o marcas en el pavimento.
- id: 229
  category: signs_and_signals
  question: ¿Cómo suele indicar un oficial de tránsito a un conductor que se detenga?
  choices:
    A: Haciendo señas con la mano y dando pitidos cortos con el silbato.
    B: Apuntando una linterna directamente a los ojos del conductor.
    C: Levantando una mano con la palma hacia el vehículo y dando un pitido largo
      con el silbato.
    D: Agitando ambos brazos por encima de la cabeza en un movimiento de cruce.
  answer: C
  explanation: La mayoría de los oficiales de tránsito indican a los conductores que
    se detengan levantando una mano con la palma hacia el vehículo y dando un pitido
    largo con el silbato.
- id: 230
  category: defensive_driving
  question: ¿Qué significan las siglas SIPDE en la estrategia de conducción?
  choices:
    A: Stop, Investigate, Proceed, Drive, Evaluate (Detenerse, Investigar, Proceder,
      Conducir, Evaluar)
    B: Scan, Identify, Predict, Decide, Execute (Explorar, Identificar, Predecir,
      Decidir, Ejecutar)
    C: Search, Inspect, Plan, Drive, Escape (Buscar, Inspeccionar, Planificar, Conducir,
      Escapar)
    D: Signal, Identify, Pass, Defend, Execute (Señalizar, Identificar, Rebasar, Defender,
      Ejecutar)
  answer: B
  explanation: 'SIPDE es un proceso de cinco pasos utilizado para emitir juicios apropiados:
    Explorar (Scan), Identificar (Identify), Predecir (Predict), Decidir (Decide)
    y Ejecutar (Execute).'
- id: 231
  category: defensive_driving
  question: En el sistema SIPDE, ¿qué implica el paso de 'Predecir' (Predict)?
  choices:
    A: Buscar agresivamente hacia adelante, a los lados y hacia atrás.
    B: Llevar a cabo su decisión para minimizar el daño.
    C: Considerar la velocidad, distancia y dirección de los peligros para anticipar
      cómo pueden afectarle.
    D: Localizar objetos fijos como baches y barandillas.
  answer: C
  explanation: El paso de Predecir implica considerar la velocidad, la distancia y
    la dirección de los peligros para anticipar cómo pueden afectarle.
- id: 232
  category: safe_driving_rules
  question: Bajo condiciones ideales, ¿qué regla debe utilizar para mantener una distancia
    de seguimiento segura?
  choices:
    A: La regla de un segundo
    B: La regla de dos segundos
    C: La regla de tres segundos
    D: La regla de cuatro segundos
  answer: C
  explanation: Aplicar la 'Regla de los tres segundos' le ayuda a mantener una distancia
    segura entre su vehículo y el vehículo que tiene delante en condiciones ideales.
- id: 233
  category: defensive_driving
  question: ¿Qué debe hacer si el vehículo que viene detrás le sigue demasiado de
    cerca?
  choices:
    A: Aumentar la velocidad para incrementar la distancia entre ustedes.
    B: Frenar bruscamente para advertir al conductor.
    C: Reducir la velocidad ligeramente y permitir que el vehículo le pase.
    D: Encender las luces de emergencia y detenerse en su carril.
  answer: C
  explanation: Si el vehículo de atrás le sigue demasiado de cerca, el manual aconseja
    reducir la velocidad ligeramente y permitir que pase.
- id: 234
  category: safe_driving_rules
  question: ¿Qué debe hacer con su distancia de seguimiento cuando conduce un vehículo
    más largo que la longitud estándar o cuando las condiciones de la carretera son
    deficientes?
  choices:
    A: Mantenerla en una cuenta de dos segundos
    B: Aumentarla a una cuenta de cuatro o cinco segundos
    C: Disminuirla a una cuenta de un segundo
    D: Mantener una cuenta de tres segundos
  answer: B
  explanation: El manual establece que cuando las condiciones de la carretera son
    deficientes, o si conduce un vehículo más largo que la longitud estándar, debe
    aumentar su distancia de seguimiento a una cuenta de cuatro o cinco segundos.
- id: 235
  category: defensive_driving
  question: ¿Aproximadamente cuánto tiempo le toma a un conductor usar los frenos
    después de percibir un peligro adelante?
  choices:
    A: 1/4 de segundo
    B: 1/2 segundo
    C: 3/4 de segundo
    D: 1 segundo completo
  answer: C
  explanation: Según el manual, el tiempo que transcurre desde que se percibe el peligro
    hasta que se usan los frenos es de aproximadamente 3/4 de segundo.
- id: 236
  category: safe_driving_rules
  question: ¿At qué distancia debe cambiar sus luces delanteras a luz de cruce (bajas)
    al acercarse a un vehículo en sentido contrario?
  choices:
    A: A menos de 200 pies
    B: A menos de 350 pies
    C: A menos de 500 pies
    D: A menos de 1,000 pies
  answer: D
  explanation: El manual exige que cuando se encuentre a menos de 1,000 pies de un
    vehículo que viene en sentido contrario, sus luces delanteras deben permanecer
    en luz de cruce (bajas).
- id: 237
  category: safe_driving_rules
  question: Además de las condiciones climáticas específicas y entre la puesta del
    sol y el amanecer, ¿en qué otro momento debe encender sus luces delanteras?
  choices:
    A: En cualquier momento en que no pueda ver claramente la carretera adelante por
      al menos 500 pies
    B: Siempre que esté conduciendo en una autopista
    C: En cualquier momento en que no pueda ver claramente la carretera adelante por
      al menos 1,000 pies
    D: Solo cuando conduzca en áreas rurales sin alumbrado público
  answer: A
  explanation: El manual indica usar las luces delanteras durante ciertas condiciones
    climáticas y en cualquier momento en que no pueda ver claramente la carretera
    adelante por al menos 500 pies.
- id: 238
  category: defensive_driving
  question: ¿Qué debe hacer si queda deslumbrado por el resplandor de las luces delanteras
    de un vehículo que viene en sentido contrario por la noche?
  choices:
    A: Mirar directamente a las luces delanteras que se aproximan
    B: Encender sus luces altas para ver mejor
    C: Usar la línea blanca a lo largo del borde de la carretera como referencia
    D: Cerrar los ojos brevemente hasta que el vehículo pase
  answer: C
  explanation: Si queda deslumbrado por el resplandor de las luces delanteras que
    vienen en sentido contrario, el manual aconseja usar la línea blanca a lo largo
    del borde de la carretera como referencia.
- id: 239
  category: sharing_the_road
  question: ¿Bajo qué condición se permite que los autobuses de tránsito utilicen
    el arcén de una autopista o vía rápida?
  choices:
    A: Solo durante una emergencia de tráfico declarada
    B: Cuando las velocidades del tráfico en los carriles principales son inferiores
      a 35 millas por hora
    C: Siempre que el autobús lleve retraso en su horario
    D: Cuando las velocidades del tráfico en los carriles principales superan las
      50 millas por hora
  answer: B
  explanation: Los autobuses de tránsito y los autobuses de movilidad metropolitana
    pueden usar el arcén solo cuando las velocidades del tráfico en los carriles principales
    son inferiores a 35 millas por hora.
- id: 240
  category: safe_driving_rules
  question: ¿Cuál es el principal beneficio de seguridad de un intercambio de diamante
    divergente?
  choices:
    A: Permite a los conductores realizar giros en U de forma segura
    B: Elimina los giros a la izquierda a través del tráfico en sentido contrario
    C: Aumenta el límite de velocidad en el puente
    D: Elimina la necesidad de cruces peatonales
  answer: B
  explanation: Un intercambio de diamante divergente está diseñado para que los carriles
    de tráfico se crucen en cada extremo del puente, eliminando los giros a la izquierda
    a través del tráfico en sentido contrario.
- id: 241
  category: penalties_and_points
  question: ¿Se considera que quedarse sin combustible es una emergencia válida para
    detenerse en una autopista interestatal?
  choices:
    A: Sí, pero solo si se encuentra en el carril derecho
    B: Sí, se considera una falla mecánica
    C: No, no se considera una emergencia y podría recibir una citación
    D: No, a menos que tenga las luces de emergencia activadas
  answer: C
  explanation: Es ilegal detenerse o estacionarse en una autopista interestatal, excepto
    en caso de emergencia. Quedarse sin combustible no se considera una emergencia
    y usted podría recibir una citación.
- id: 242
  category: defensive_driving
  question: Si debe detenerse en la autopista debido a una emergencia y tiene bengalas
    o reflectores, ¿dónde debe colocarlos?
  choices:
    A: De 10 a 50 pies detrás de su vehículo
    B: De 50 a 100 pies delante de su vehículo
    C: De 100 a 500 pies detrás de su vehículo en el borde derecho de la carretera
      principal
    D: Directamente al lado de la puerta del lado del conductor
  answer: C
  explanation: Si tiene bengalas o reflectores, colóquelos de 100 a 500 pies detrás
    de su vehículo en el borde derecho de la carretera principal.
- id: 243
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima de seguimiento que debe mantener detrás de
    cualquier vehículo de bomberos?
  choices:
    A: 100 pies
    B: 200 pies
    C: 350 pies
    D: 500 pies
  answer: D
  explanation: El manual establece que debe mantenerse al menos a 500 pies de distancia
    de cualquier vehículo de bomberos.
- id: 244
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa la salida deseada en la autopista?
  choices:
    A: Detenerse y retroceder con cuidado por el arcén
    B: Hacer un giro en U en el cruce de la mediana más cercano
    C: Continuar hasta la siguiente salida
    D: Detenerse a un lado y esperar a que el tráfico se despeje antes de retroceder
  answer: C
  explanation: Si se pasa su salida, continúe hasta la siguiente. No retroceda ni
    haga un giro en U para regresar a la salida deseada.
- id: 245
  category: safe_driving_rules
  question: Según el manual del conductor de Minnesota, ¿la distracción o falta de
    atención del conductor representa al menos qué porcentaje de todos los choques
    anuales?
  choices:
    A: 10 por ciento
    B: 15 por ciento
    C: 25 por ciento
    D: 40 por ciento
  answer: C
  explanation: El manual establece que la distracción o falta de atención del conductor
    es un factor principal en los choques en Minnesota, representando al menos el
    25 por ciento de todos los choques anuales.
- id: 246
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias puede un conductor menor de 18 años con una licencia
    provisional usar un teléfono celular mientras conduce?
  choices:
    A: Cuando usa un dispositivo de manos libres
    B: Solo para llamar al 911 en una emergencia
    C: Cuando está detenido en el tráfico
    D: Cuando llama a un padre o tutor
  answer: B
  explanation: Los conductores menores de 18 años con un permiso de instrucción o
    licencia provisional tienen prohibido usar un teléfono celular, ya sea portátil
    o de manos libres, excepto para llamar al 911 en una emergencia.
- id: 247
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un comportamiento ilegal del conductor en Minnesota
    con respecto a los dispositivos de audio?
  choices:
    A: Escuchar la radio a un volumen alto
    B: Usar audífonos o auriculares en ambos oídos simultáneamente
    C: Usar un solo auricular para una llamada telefónica de manos libres
    D: Ajustar la radio mientras conduce
  answer: B
  explanation: Es ilegal usar audífonos o auriculares en ambos oídos simultáneamente
    para escuchar una radio u otro dispositivo que produzca sonido mientras se conduce.
- id: 248
  category: safe_driving_rules
  question: ¿Es ilegal conducir un vehículo ocupado por más de cuántas personas en
    el asiento delantero si esto obstruye su vista o interfiere con el control del
    vehículo?
  choices:
    A: Dos personas
    B: Tres personas
    C: Cuatro personas
    D: Cinco personas
  answer: B
  explanation: Es ilegal conducir un vehículo cargado con bultos u ocupado por más
    de tres personas en el asiento delantero si los objetos o las personas obstruyen
    su vista o interfieren con su capacidad para controlar el vehículo.
- id: 249
  category: vehicle_information
  question: Si una carga se extiende cuatro pies o más desde la parte trasera de un
    vehículo durante el día, ¿qué se debe colocar al final de la carga?
  choices:
    A: Una bandera roja, amarilla o naranja de al menos 16 pulgadas cuadradas
    B: Una bandera blanca de al menos 12 pulgadas cuadradas
    C: Una linterna roja visible desde 500 pies
    D: Dos reflectores rojos
  answer: A
  explanation: Si una carga se extiende cuatro pies o más desde la parte trasera de
    cualquier vehículo, se debe colocar una bandera roja, amarilla o naranja de al
    menos 16 pulgadas cuadradas al final de la carga.
- id: 250
  category: vehicle_information
  question: ¿Hasta qué distancia puede extenderse una carga más allá de la línea de
    los guardabarros en el lado izquierdo de un vehículo de pasajeros?
  choices:
    A: Hasta 3 pulgadas
    B: Hasta 6 pulgadas
    C: Hasta 12 pulgadas
    D: No puede extenderse más allá de la línea del guardabarros izquierdo en absoluto
  answer: D
  explanation: Los vehículos de pasajeros no pueden transportar cargas que se extiendan
    más allá de la línea de los guardabarros en el lado izquierdo y más de seis pulgadas
    más allá de la línea del guardabarros en el lado derecho.
- id: 251
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima de seguimiento que debe mantener con otros
    vehículos cuando remolca una casa rodante (camper) o un remolque?
  choices:
    A: 100 pies
    B: 200 pies
    C: 350 pies
    D: 500 pies
  answer: D
  explanation: Si remolca una casa rodante o un remolque con su vehículo, debe mantener
    al menos 500 pies de distancia de seguimiento con respecto a otros vehículos.
- id: 252
  category: vehicle_information
  question: ¿A partir de qué peso bruto vehicular se requiere que los remolques estén
    equipados con sus propios frenos?
  choices:
    A: 1,500 libras o más
    B: 2,000 libras o más
    C: 3,000 libras o más
    D: 4,500 libras o más
  answer: C
  explanation: Todos los remolques con un peso bruto vehicular de 3,000 libras o más
    deben estar equipados con frenos.
- id: 253
  category: safe_driving_rules
  question: ¿Cuál es la edad mínima requerida para conducir una combinación de vehículos
    recreativos en Minnesota?
  choices:
    A: 16 años
    B: 18 años
    C: 21 años
    D: 25 años
  answer: B
  explanation: Debe tener al menos 18 años de edad para conducir una combinación de
    vehículos recreativos.
- id: 254
  category: vehicle_information
  question: ¿Cuál es la longitud máxima permitida para una combinación de vehículos
    recreativos?
  choices:
    A: 45 pies
    B: 55 pies
    C: 65 pies
    D: 70 pies
  answer: D
  explanation: Una combinación de vehículos recreativos no puede tener más de 70 pies
    de longitud.
- id: 255
  category: defensive_driving
  question: ¿Cuál de las siguientes acciones debe evitar al conducir en carreteras
    invernales resbaladizas?
  choices:
    A: Probar sus frenos mientras conduce lentamente
    B: Usar el control de crucero (cruise control)
    C: Asegurarse de que el líquido del limpiaparabrisas contenga anticongelante
    D: Ajustar su velocidad a las condiciones de la carretera
  answer: B
  explanation: 'Para la seguridad del vehículo al conducir en invierno, el manual
    establece explícitamente: "Evite usar el control de crucero (cruise control) en
    carreteras resbaladizas".'
- id: 256
  category: sharing_the_road
  question: ¿De qué color son las luces intermitentes que utilizan las máquinas quitanieves
    en Minnesota?
  choices:
    A: Rojas y azules
    B: Blancas, amarillas y azules
    C: Verdes y amarillas
    D: Rojas y blancas
  answer: B
  explanation: Cuando las carreteras están cubiertas de nieve o hielo, esté atento
    a las luces intermitentes blancas, amarillas y azules de las máquinas quitanieves.
- id: 257
  category: defensive_driving
  question: ¿Qué es lo más importante que debe hacer si se queda varado mientras viaja
    en clima frío?
  choices:
    A: Salir de su vehículo inmediatamente para buscar ayuda
    B: Permanecer con su vehículo
    C: Apagar las luces de advertencia de peligro para ahorrar batería
    D: Caminar hasta la salida de la autopista más cercana
  answer: B
  explanation: Si se queda varado mientras viaja en clima frío, permanezca con su
    vehículo. La mayoría de las muertes en estas situaciones ocurren cuando las personas
    abandonan sus vehículos, se pierden y sufren una exposición prolongada al frío.
- id: 258
  category: defensive_driving
  question: ¿Cómo debe reaccionar si se enfrenta a un conductor agresivo?
  choices:
    A: Hacer contacto visual para demostrar que no se siente intimidado
    B: Desafiarlo igualando su velocidad
    C: Mantenerse fuera de su camino y evitar el contacto visual
    D: Tocar la bocina para alertar a otros conductores
  answer: C
  explanation: Si se enfrenta a un conductor agresivo, no lo desafíe. Manténgase fuera
    de su camino, evite el contacto visual y no permita que la situación escale.
- id: 259
  category: vehicle_information
  question: Al cargar correctamente un remolque, ¿qué porcentaje del peso del remolque
    debe estar equilibrado sobre el enganche?
  choices:
    A: Del 5 al 10 por ciento
    B: Del 10 al 15 por ciento
    C: Del 20 al 25 por ciento
    D: Del 30 al 40 por ciento
  answer: B
  explanation: Cuando está cargado, entre el 10 y el 15 por ciento del peso del remolque
    debe estar equilibrado en el enganche entre el remolque y el vehículo.
- id: 260
  category: safe_driving_rules
  question: ¿Cuál es la medida más segura si se queda varado en su vehículo durante
    un clima extremadamente frío?
  choices:
    A: Salir de su vehículo para buscar ayuda inmediatamente.
    B: Mantener el motor encendido continuamente para mantener el interior caliente.
    C: Permanecer con su vehículo y colocar una bandera roja en la antena del radio
      o en la manija de la puerta.
    D: Mantener todas las ventanas bien cerradas para atrapar la mayor cantidad de
      calor posible.
  answer: C
  explanation: El manual establece que si se queda varado en clima frío, debe permanecer
    con su vehículo y colocar una bandera roja en la antena del radio o en la manija
    de la puerta. La mayoría de las muertes ocurren cuando las personas abandonan
    sus vehículos y sufren una exposición prolongada.
- id: 261
  category: safe_driving_rules
  question: ¿Con qué frecuencia sugiere el manual que se detenga a descansar para
    mantenerse alerta y evitar el cansancio en un viaje largo?
  choices:
    A: Al menos una vez cada 50 millas o cada hora.
    B: Al menos una vez cada 100 millas o cada dos horas.
    C: Al menos una vez cada 200 millas o cada cuatro horas.
    D: Solo cuando empiece a sentir que se le cierran los ojos.
  answer: B
  explanation: Para mantenerse alerta, el manual sugiere detenerse con la frecuencia
    necesaria, al menos una vez cada 100 millas o cada dos horas para caminar, estirarse
    y relajarse.
- id: 262
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a derrapar en una carretera resbaladiza?
  choices:
    A: Pisar el freno a fondo inmediatamente para detener el vehículo.
    B: Acelerar rápidamente para recuperar la tracción sobre la superficie de la carretera.
    C: Quitar el pie del acelerador y del freno hasta que pueda girar en la dirección
      deseada.
    D: Activar el control de crucero para mantener una velocidad constante.
  answer: C
  explanation: Si su vehículo derrapa, el manual le aconseja mantener la calma, no
    reaccionar de forma exagerada ni frenar bruscamente y, en su lugar, quitar el
    pie del acelerador y del freno hasta que pueda girar en la dirección deseada.
- id: 263
  category: vehicle_information
  question: Si su vehículo está equipado con un sistema de frenos antibloqueo (ABS),
    ¿cómo debe frenar en una emergencia?
  choices:
    A: Bombear los frenos rápidamente para evitar que se bloqueen.
    B: Presionar el pedal del freno y continuar dirigiendo el vehículo.
    C: Tocar ligeramente el pedal del freno mientras cambia a una marcha más baja.
    D: Aplicar el freno de estacionamiento de emergencia inmediatamente.
  answer: B
  explanation: Si tiene frenos antibloqueo (ABS), no los bombee. En su lugar, presione
    el pedal del freno y continúe dirigiendo el vehículo hasta que recupere el control.
- id: 264
  category: safe_driving_rules
  question: 'Cuando conduce bajo la lluvia, nieve, aguanieve o granizo, o cuando no
    puede ver a más de 500 pies de distancia, usted debe:'
  choices:
    A: Encender las luces delanteras de carretera (altas).
    B: Encender las luces de advertencia de peligro (intermitentes).
    C: Mantener las luces delanteras en la posición de luz de cruce (bajas) para reducir
      el deslumbramiento.
    D: Usar solo las luces de estacionamiento.
  answer: C
  explanation: Las luces delanteras deben usarse cuando no se puede ver a más de 500
    pies de distancia y cuando está lloviendo, nevando, cayendo aguanieve o granizando.
    Manténgalas en luz de cruce (bajas) para reducir el deslumbramiento.
- id: 265
  category: safe_driving_rules
  question: ¿A qué velocidad pueden los automóviles estándar comenzar a experimentar
    hidroplaneo (hydroplane) bajo una lluvia intensa?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El manual establece que, bajo lluvia intensa, los automóviles estándar
    pueden comenzar a experimentar hidroplaneo a 35 mph.
- id: 266
  category: safe_driving_rules
  question: 'Al bajar una colina empinada, NUNCA debe:'
  choices:
    A: Revisar su velocímetro con frecuencia.
    B: Bajar la colina por inercia con la transmisión en punto muerto (neutral).
    C: Mantener el pie fuera del acelerador.
    D: Usar la bocina para advertir a otros conductores en curvas cerradas sin visibilidad.
  answer: B
  explanation: 'El manual establece explícitamente: ''No baje colinas empinadas por
    inercia con la transmisión en punto muerto (neutral)''.'
- id: 267
  category: defensive_driving
  question: ¿Cuál de las siguientes es la acción correcta a tomar si experimenta un
    reventón de neumático mientras conduce?
  choices:
    A: Frenar fuerte inmediatamente para detener el vehículo.
    B: Sujetar el volante con firmeza, seguir recto y retirar lentamente el pie del
      acelerador.
    C: Virar hacia el arcén lo más rápido posible.
    D: Cambiar a punto muerto (neutral) y bombear los frenos.
  answer: B
  explanation: Si experimenta un reventón, sujete el volante con firmeza, siga recto
    y retire lentamente el pie del acelerador. No frene hasta que el vehículo esté
    nuevamente bajo su control.
- id: 268
  category: defensive_driving
  question: Si el pedal del freno se hunde repentinamente hasta el fondo, ¿qué es
    lo primero que debe intentar?
  choices:
    A: Cambiar a marcha atrás (reversa).
    B: Aplicar el freno de emergencia/estacionamiento de forma brusca.
    C: Bombear el pedal para generar presión.
    D: Apagar el motor.
  answer: C
  explanation: Si el pedal del freno se hunde repentinamente hasta el fondo, intente
    bombear el pedal para generar presión. Si esto no funciona, aplique lentamente
    el freno de emergencia o de estacionamiento.
- id: 269
  category: defensive_driving
  question: Si sus ruedas se desvían hacia el arcén (shoulder) de la carretera, ¿cómo
    debe regresar al pavimento de forma segura?
  choices:
    A: Virar bruscamente de regreso al pavimento antes de perder velocidad.
    B: Frenar fuerte y detenerse por completo en el arcén.
    C: Permanecer en el arcén, soltar lentamente el pedal del acelerador para reducir
      la velocidad y luego regresar al pavimento.
    D: Acelerar para igualar la velocidad de la autopista mientras conduce por el
      arcén.
  answer: C
  explanation: Si sus ruedas se desvían hacia el arcén, no intente virar bruscamente
    de regreso al pavimento. Permanezca en el arcén y suelte lentamente el pedal del
    acelerador. Después de haber reducido la velocidad, regrese al pavimento.
- id: 270
  category: sharing_the_road
  question: ¿En qué momento del día están más activos los ciervos, lo que requiere
    que usted esté especialmente alerta?
  choices:
    A: Desde media mañana hasta el mediodía.
    B: Desde el mediodía hasta media tarde.
    C: Desde el anochecer hasta el amanecer.
    D: Solo durante las horas del día.
  answer: C
  explanation: Los ciervos son más activos desde el anochecer hasta el amanecer, por
    lo que debe estar especialmente alerta durante esos periodos.
- id: 271
  category: defensive_driving
  question: Si un vehículo viaja hacia usted en su carril, ¿cuál es la acción más
    segura a tomar?
  choices:
    A: Moverse al carril izquierdo para evitar el vehículo.
    B: Moverse a la derecha, saliéndose de la carretera hacia la derecha si es necesario.
    C: Detenerse en su carril y prepararse para el impacto.
    D: Acelerar y desviarse hacia el carril de sentido contrario.
  answer: B
  explanation: Si un vehículo viaja hacia usted en su carril, muévase a la derecha.
    No use el carril izquierdo para evitar el vehículo. Si el vehículo continúa hacia
    usted, diríjase fuera de la carretera hacia la derecha si es necesario.
- id: 272
  category: defensive_driving
  question: Si su vehículo se apaga en las vías del tren y se aproxima un tren, ¿qué
    debe hacer después de salir del vehículo?
  choices:
    A: Caminar rápidamente a lo largo de las vías en la misma dirección en la que
      viaja el tren.
    B: Correr directamente lejos de las vías en un ángulo de 90 grados.
    C: Caminar rápidamente en un ángulo de 45 grados lejos de las vías en la dirección
      de donde se aproxima el tren.
    D: Pararse cerca del vehículo y agitar los brazos para alertar al maquinista del
      tren.
  answer: C
  explanation: Para evitar ser golpeado por los escombros de la colisión, mantenga
    una distancia segura de las vías. Camine rápidamente en un ángulo de 45 grados
    lejos de las vías en la dirección de donde se aproxima el tren.
- id: 273
  category: safe_driving_rules
  question: Cuando se quede varado en un vehículo en un clima extremadamente frío,
    ¿por qué debería dejar al menos una ventana parcialmente abierta?
  choices:
    A: Para pedir ayuda a los automovilistas que pasan.
    B: Para evitar que las ventanas se empañen.
    C: Para prevenir el envenenamiento por monóxido de carbono debido a una ventilación
      inadecuada.
    D: Para mantener regulada la temperatura interior.
  answer: C
  explanation: Incluso en climas extremadamente fríos, deje al menos una ventana parcialmente
    abierta para dejar entrar aire fresco. Los ocupantes de un vehículo en ralentí
    pueden sufrir envenenamiento por monóxido de carbono si la ventilación no es adecuada.
- id: 274
  category: sharing_the_road
  question: Si otro conductor intenta rebasarlo en una carretera de dos carriles pero
    calcula mal la velocidad del tráfico que viene en sentido contrario y debe retroceder,
    ¿qué debe hacer?
  choices:
    A: Acelerar para asegurarse de que haya espacio suficiente para que el vehículo
      se mueva al carril detrás de usted.
    B: Reducir la velocidad para obligar al vehículo a rebasarlo.
    C: Moverse al carril izquierdo para bloquear al vehículo que intenta rebasar.
    D: Frenar repentinamente para dejar que el vehículo se incorpore delante de usted.
  answer: A
  explanation: Si el vehículo que intenta rebasar debe retroceder, acelere para asegurarse
    de que haya espacio suficiente para que el vehículo se mueva al carril detrás
    de usted.
- id: 275
  category: safe_driving_rules
  question: ¿Cuánta agua en una carretera inundada se necesita para llegar a la parte
    inferior de la mayoría de los automóviles de pasajeros, lo que podría causar la
    pérdida de control o el apagado del motor?
  choices:
    A: 2 pulgadas
    B: 6 pulgadas
    C: 12 pulgadas
    D: 2 pies
  answer: B
  explanation: Según el manual, 6 pulgadas de agua llegarán a la parte inferior de
    la mayoría de los automóviles de pasajeros, causando la pérdida de control o un
    posible apagado del motor.
- id: 276
  category: safe_driving_rules
  question: Según el manual, ¿cuánta agua en movimiento puede arrastrar a la mayoría
    de los vehículos, incluidos los SUV y las camionetas pickup?
  choices:
    A: 6 pulgadas
    B: 1 pie
    C: 2 pies
    D: 3 pies
  answer: C
  explanation: El manual establece que 2 pies de agua en movimiento pueden arrastrar
    a la mayoría de los vehículos, incluidos los SUV y las camionetas pickup.
- id: 277
  category: defensive_driving
  question: Si su vehículo cae en aguas profundas, ¿aproximadamente cuánto tiempo
    flotará normalmente en la superficie?
  choices:
    A: De 10 a 20 segundos
    B: De 30 a 60 segundos
    C: De 2 a 3 minutos
    D: De 5 a 10 minutos
  answer: B
  explanation: La mayoría de los vehículos flotarán en la superficie del agua durante
    30 a 60 segundos. Debe salir del vehículo inmediatamente durante este tiempo.
- id: 278
  category: vehicle_information
  question: ¿Por qué podría no ser capaz de abrir las puertas de su vehículo inmediatamente
    si este queda completamente sumergido en el agua?
  choices:
    A: El sistema eléctrico bloqueará automáticamente las puertas.
    B: La presión del agua dentro del automóvil debe igualar la presión exterior.
    C: El daño estructural siempre atascará los marcos de las puertas.
    D: El peso del motor evita que las puertas se desenganchen.
  answer: B
  explanation: Si su vehículo queda sumergido, las puertas del vehículo no se pueden
    abrir hasta que la presión del agua dentro del automóvil sea igual a la del exterior.
- id: 279
  category: defensive_driving
  question: ¿Qué NO debe hacer si nota que sale humo de debajo del capó de su vehículo?
  choices:
    A: Salirse de la carretera inmediatamente.
    B: Apagar el motor.
    C: Salir del vehículo inmediatamente.
    D: Usar agua para apagar el fuego.
  answer: D
  explanation: 'El manual advierte explícitamente: ''No use agua para apagar el fuego;
    esto en realidad propagará las llamas''.'
- id: 280
  category: vehicle_information
  question: Si el motor de su vehículo se calienta y apagar el aire acondicionado
    no baja la temperatura, ¿qué debe hacer a continuación mientras conduce?
  choices:
    A: Encender la calefacción para alejar el aire caliente del motor.
    B: Poner el vehículo en punto muerto (neutral) y acelerar el motor.
    C: Verter agua fría sobre el radiador.
    D: Conducir más rápido para aumentar el flujo de aire a través de la rejilla.
  answer: A
  explanation: Cuando su motor se caliente, apague el equipo innecesario como el aire
    acondicionado (AC). Si la temperatura sigue siendo demasiado alta, encender la
    calefacción ayudará a alejar el aire caliente del motor.
- id: 281
  category: defensive_driving
  question: ¿Qué es lo primero que debe intentar si sus faros delanteros se apagan
    repentinamente mientras conduce?
  choices:
    A: Pisar los frenos a fondo y detenerse en su carril.
    B: Intentar usar las luces de estacionamiento, las luces de advertencia de peligro
      (luces de emergencia) o las señales de giro.
    C: Apagar el motor y dejarse llevar por la inercia hasta detenerse.
    D: Hacer parpadear las luces altas repetidamente hasta que vuelvan a encenderse.
  answer: B
  explanation: Si sus faros delanteros se apagan repentinamente, intente usar las
    luces de estacionamiento, las luces de advertencia de peligro o las señales de
    giro; una de ellas podría funcionar y darle suficiente luz para guiarlo fuera
    de la carretera.
- id: 282
  category: defensive_driving
  question: Si el pedal del acelerador se queda trabado y no puede liberarlo enganchando
    la punta del pie debajo del pedal, ¿qué debe hacer a continuación?
  choices:
    A: Apagar el motor inmediatamente y retirar la llave.
    B: Aplicar el freno de estacionamiento y cambiar a reversa.
    C: Aplicar los frenos y cambiar a neutral para desconectar el motor.
    D: Bombear el pedal del acelerador rápidamente hasta que se destrabe.
  answer: C
  explanation: Si enganchar la punta del pie debajo del pedal no funciona, aplique
    los frenos y cambie a neutral para desconectar el motor, luego diríjase al acotamiento.
- id: 283
  category: defensive_driving
  question: Si su vehículo choca contra un poste de servicios públicos y se incendia,
    obligándolo a salir, ¿cómo debe abandonar el vehículo?
  choices:
    A: Salir con cuidado con un pie primero para probar el suelo.
    B: Saltar del vehículo con ambos pies juntos y arrastrar los pies para alejarse.
    C: Correr lo más rápido posible lejos del vehículo.
    D: Alejarse gateando sobre sus manos y rodillas.
  answer: B
  explanation: Si debe salir de un vehículo que está en contacto con un poste de servicios
    públicos (por ejemplo, si se está incendiando), salte del vehículo con ambos pies
    juntos y arrastre los pies por el suelo mientras se aleja.
- id: 284
  category: alcohol_drugs_health
  question: ¿Cuáles de los siguientes son síntomas tempranos de intoxicación por monóxido
    de carbono?
  choices:
    A: Ojos llorosos y tos persistente
    B: Fatiga repentina, dolor de cabeza, mareos y náuseas
    C: Visión borrosa y zumbido en los oídos
    D: Latidos cardíacos rápidos y dificultad para respirar
  answer: B
  explanation: Los síntomas tempranos de la intoxicación por monóxido de carbono incluyen
    fatiga repentina, dolor de cabeza, mareos y náuseas.
- id: 285
  category: vehicle_information
  question: ¿Qué afirmación sobre el monóxido de carbono es verdadera según el manual?
  choices:
    A: Es un gas con un olor fuerte y reconocible.
    B: No puede quedar atrapado en un garaje si la puerta del garaje está completamente
      abierta.
    C: Puede quedar atrapado dentro de un garaje incluso cuando la puerta del garaje
      está completamente abierta.
    D: Solo es producido por los vehículos durante los meses de verano.
  answer: C
  explanation: Cuando las temperaturas son frías, el monóxido de carbono puede quedar
    atrapado dentro del garaje incluso cuando la puerta del garaje está completamente
    abierta. También es mortal, inodoro e incoloro.
- id: 286
  category: penalties_and_points
  question: ¿Su licencia de conducir puede ser suspendida si no se detiene ante un
    autobús escolar con el brazo de parada extendido y las luces rojas parpadeando,
    dentro de cuántos años de una condena por la misma infracción?
  choices:
    A: Dos años
    B: Tres años
    C: Cinco años
    D: Ten años
  answer: C
  explanation: Su licencia de conducir puede ser suspendida si no se detiene ante
    un autobús escolar con el brazo de parada extendido y sus luces rojas parpadeando,
    dentro de los cinco años posteriores a una condena por la misma infracción.
- id: 287
  category: penalties_and_points
  question: ¿Cuál de las siguientes acciones puede resultar en la suspensión de su
    licencia de conducir?
  choices:
    A: Identificarse falsamente ante un oficial de policía.
    B: Conducir a 10 mph por encima del límite de velocidad en una autopista.
    C: Estacionarse a menos de 20 pies de un cruce peatonal.
    D: No lavar las placas de matrícula de su vehículo.
  answer: A
  explanation: Según el manual, su licencia de conducir puede ser suspendida si se
    identifica falsamente ante un oficial de policía.
- id: 288
  category: penalties_and_points
  question: ¿Su licencia de conducir puede ser revocada si es condenado por conducir
    a una velocidad superior a qué límite?
  choices:
    A: 80 mph
    B: 85 mph
    C: 90 mph
    D: 100 mph
  answer: D
  explanation: Su licencia de conducir puede ser revocada si es condenado por conducir
    a más de 100 mph.
- id: 289
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones puede dar lugar a la revocación de
    su licencia de conducir en lugar de solo una suspensión?
  choices:
    A: No pagar la manutención de los hijos ordenada por el tribunal.
    B: Pagar una tarifa al estado con un cheque sin fondos.
    C: No detenerse, identificarse y prestar ayuda cuando se ve involucrado en un
      accidente de vehículo motorizado.
    D: Tomar el examen de la licencia de conducir por otra persona.
  answer: C
  explanation: No detenerse, identificarse y prestar ayuda cuando se ve involucrado
    en un accidente de vehículo motorizado figura entre las condiciones para la revocación
    de la licencia. Las otras opciones figuran como condiciones para la suspensión
    de la licencia.
- id: 290
  category: penalties_and_points
  question: ¿Conducir a una velocidad superior a qué límite resultará en la revocación
    de sus privilegios de conducir en Minnesota?
  choices:
    A: 80 mph
    B: 90 mph
    C: 100 mph
    D: 110 mph
  answer: C
  explanation: Según el manual, sus privilegios de conducir serán revocados si es
    condenado por conducir a más de 100 mph.
- id: 291
  category: penalties_and_points
  question: ¿Si se le otorga una licencia limitada después de una revocación o suspensión,
    cuál de los siguientes es un uso permitido?
  choices:
    A: Viajar hacia y desde actividades recreativas
    B: Viajar hacia y desde su lugar de empleo
    C: Conducir para visitar a amigos o familiares
    D: Realizar mandados generales del hogar
  answer: B
  explanation: Una licencia limitada le restringe a viajes específicos, como viajar
    hacia y desde su lugar de empleo, tratamiento de dependencia química o una institución
    de educación postsecundaria.
- id: 292
  category: license_system
  question: Si proporciona información falsa o engañosa en su solicitud de licencia
    de conducir, ¿por cuánto tiempo mínimo se cancelará su licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: Su licencia será cancelada por 60 días o hasta que se proporcione la
    información correcta, lo que sea más largo, si proporciona información falsa o
    engañosa en su solicitud.
- id: 293
  category: alcohol_drugs_health
  question: ¿En qué proporción de las muertes por accidentes de tránsito en las carreteras
    de Minnesota cada año está involucrado el alcohol?
  choices:
    A: Un cuarto
    B: Un tercio
    C: La mitad
    D: Dos tercios
  answer: B
  explanation: El manual establece que el alcohol está involucrado en más de un tercio
    de las muertes en las carreteras de Minnesota cada año.
- id: 294
  category: alcohol_drugs_health
  question: ¿Cuál es la única cura segura y eficaz para la fatiga al conducir?
  choices:
    A: Beber café o bebidas energéticas
    B: Tomar estimulantes de venta libre
    C: El descanso
    D: Abrir las ventanas y subir el volumen de la radio
  answer: C
  explanation: El manual aconseja mantenerse alejado de las drogas ilegales y no usar
    ninguna droga para ocultar la fatiga, afirmando que la única cura para la fatiga
    es el descanso.
- id: 295
  category: alcohol_drugs_health
  question: ¿Cómo afecta el consumo de alcohol la visión de un conductor?
  choices:
    A: Aumenta el rango de movimiento ocular
    B: Mejora la visión periférica
    C: Reduce el rango de movimiento ocular y disminuye la visión periférica
    D: Mejora la visión nocturna pero nubla la visión diurna
  answer: C
  explanation: El alcohol reduce el rango de movimiento ocular, disminuyendo la visión
    periférica, y puede causar visión borrosa en niveles de concentración altos.
- id: 296
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes grupos de bebidas contiene generalmente la misma
    cantidad de alcohol?
  choices:
    A: Una cerveza de 12 onzas, una copa de vino de 5 onzas y un refresco de vino
      (wine cooler) de 9 onzas
    B: Una cerveza de 16 onzas, una copa de vino de 8 onzas y una bebida mixta típica
    C: Una cerveza de 12 onzas, una copa de vino de 12 onzas y un refresco de vino
      de 12 onzas
    D: Una cerveza de 20 onzas, una copa de vino de 5 onzas y un refresco de vino
      de 5 onzas
  answer: A
  explanation: Una cerveza de 12 onzas, una copa de vino de 5 onzas, una bebida mixta
    típica y un refresco de vino (wine cooler) de 9 onzas suelen contener aproximadamente
    la misma cantidad de alcohol.
- id: 297
  category: alcohol_drugs_health
  question: Si una botella de licor está etiquetada como '80-proof' (grado de alcohol),
    ¿cuál es su porcentaje de alcohol?
  choices:
    A: 20 por ciento
    B: 40 por ciento
    C: 60 por ciento
    D: 80 por ciento
  answer: B
  explanation: El término 'proof' es igual al doble del porcentaje de alcohol que
    contiene. Por lo tanto, una bebida de 80-proof contiene un 40 por ciento de alcohol.
- id: 298
  category: alcohol_drugs_health
  question: ¿Cómo elimina principalmente el cuerpo humano el alcohol?
  choices:
    A: A través de la respiración y el sudor
    B: A través de la micción
    C: A través de la oxidación por el hígado
    D: A través de la digestión en el estómago
  answer: C
  explanation: El cuerpo elimina el 95 por ciento del alcohol a través de la oxidación
    por el hígado. El 5 por ciento restante se elimina a través de la respiración,
    el sudor y la micción.
- id: 299
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes métodos aumentará la velocidad a la que su cuerpo
    oxida el alcohol?
  choices:
    A: Beber café solo (negro)
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Solo esperar reducirá su concentración de alcohol
  answer: D
  explanation: La única forma de reducir su concentración de alcohol es esperar. Beber
    café, hacer ejercicio y tomar duchas frías no aumentan la tasa de oxidación.
- id: 300
  category: penalties_and_points
  question: ¿Cuál es el límite legal de concentración de alcohol para que una persona
    que conduce un vehículo de pasajeros estándar en Minnesota sea arrestada por conducir
    bajo los efectos del alcohol (DWI)?
  choices:
    A: 0.02 por ciento o más
    B: 0.04 por ciento o más
    C: 0.08 por ciento o más
    D: 0.10 por ciento o más
  answer: C
  explanation: Una persona con una concentración de alcohol de 0.08 por ciento o más
    que tenga el control de un vehículo en movimiento o estacionado puede ser arrestada
    por conducir bajo los efectos del alcohol (DWI).
- id: 301
  category: penalties_and_points
  question: ¿Bajo qué circunstancia puede un conductor ser arrestado por conducir
    bajo los efectos del alcohol (DWI) con una concentración de alcohol de tan solo
    0.04 por ciento?
  choices:
    A: Si conducen un vehículo comercial o si un oficial puede probar que el alcohol
      causó errores al conducir
    B: Si son menores de 21 años
    C: Si conducen durante las horas nocturnas
    D: Si tienen pasajeros menores de 16 años en el vehículo
  answer: A
  explanation: Una persona puede ser arrestada por DWI con un 0.04 por ciento si conduce
    un vehículo comercial, o si un oficial de la ley puede probar que el alcohol causó
    que el conductor cometiera errores al conducir.
- id: 302
  category: alcohol_drugs_health
  question: ¿Cuándo es permisible conducir mientras se toma un medicamento recetado
    por un médico?
  choices:
    A: Solo durante las horas del día
    B: Si el médico informa al conductor que no afectará su capacidad para conducir
      de manera segura
    C: Siempre que la receta esté legalmente a su nombre
    D: Si se combina con una pequeña cantidad de cafeína
  answer: B
  explanation: La posesión y el uso de un medicamento recetado por un médico están
    permitidos si el médico informa al conductor que no afectará su capacidad para
    conducir de manera segura.
- id: 303
  category: penalties_and_points
  question: Sus privilegios de conducir serán revocados si es condenado por un delito
    menor grave (gross misdemeanor) por ¿cuál de las siguientes acciones relacionadas
    con un autobús escolar?
  choices:
    A: Rebasar a un autobús escolar que viaja por debajo del límite de velocidad
    B: No detenerse ante un autobús escolar con su brazo de parada extendido y las
      luces rojas parpadeando
    C: Seguir a un autobús escolar a menos de 100 pies de distancia
    D: Tocar la bocina a un autobús escolar mientras recoge a niños
  answer: B
  explanation: Su licencia será revocada si es condenado por un delito menor grave
    por no detenerse ante un autobús escolar con su brazo de parada extendido y sus
    luces rojas parpadeando.
- id: 304
  category: alcohol_drugs_health
  question: ¿Cómo afecta típicamente el deterioro por alcohol la capacidad de dirección
    de un conductor?
  choices:
    A: Hace que los conductores giren el volante de menos y giren demasiado lento
    B: Hace que los conductores sujeten el volante con demasiada fuerza
    C: Tiende a hacer que los conductores giren el volante en exceso, lo que resulta
      en zigzagueos y salirse de la carretera
    D: Mejora la precisión de la dirección pero ralentiza el tiempo de reacción
  answer: C
  explanation: Los conductores bajo los efectos del alcohol tienden a girar el volante
    en exceso, lo que puede resultar en zigzagueos y salirse de la carretera.
- id: 305
  category: alcohol_drugs_health
  question: Para un conductor que opera un vehículo comercial, ¿qué nivel de concentración
    de alcohol resultará en un arresto por DWI?
  choices:
    A: 0.02 por ciento
    B: 0.04 por ciento
    C: 0.06 por ciento
    D: 0.08 por ciento
  answer: B
  explanation: El manual establece que una persona puede ser arrestada por DWI con
    una concentración de alcohol de 0.04 por ciento si conduce un vehículo comercial.
- id: 306
  category: penalties_and_points
  question: Bajo la ley de consentimiento implícito, ¿cuál es la sanción por negarse
    a realizar una prueba de sangre, aliento u orina?
  choices:
    A: Una multa de $500 y una advertencia
    B: Revocación de los privilegios de conducir de uno a seis años
    C: Una sentencia de cárcel obligatoria de 30 días
    D: Incautación inmediata del vehículo
  answer: B
  explanation: Negarse a realizar esta prueba es un delito y resultará en la revocación
    de los privilegios de conducir de uno a seis años, dependiendo del número de infracciones
    registradas.
- id: 307
  category: alcohol_drugs_health
  question: ¿Cuándo podría un oficial de la ley pedirle que se someta a una prueba
    de sangre, aliento u orina?
  choices:
    A: Solo cuando conduce un vehículo comercial
    B: Cuando está involucrado en un choque relacionado con el alcohol que causa daños
      a la propiedad
    C: Durante cualquier parada de tráfico de rutina
    D: Solo si tiene una condena previa por DWI
  answer: B
  explanation: Un oficial de la ley puede pedirle que se someta a una prueba cuando
    esté involucrado en un choque relacionado con el alcohol que haya causado lesiones
    personales, daños a la propiedad o la muerte.
- id: 308
  category: penalties_and_points
  question: ¿Cuál de las siguientes circunstancias resultará en sanciones más severas
    por un DWI?
  choices:
    A: Tener una concentración de alcohol de 0.10 por ciento
    B: Tener a un niño menor de 16 años en el vehículo
    C: Conducir un vehículo con placas de otro estado
    D: Declararse culpable del cargo de DWI
  answer: B
  explanation: Las sanciones serán más severas si tiene a un niño menor de 16 años
    en el vehículo en el momento de la parada.
- id: 309
  category: penalties_and_points
  question: ¿Cuál es el período mínimo de revocación por una primera infracción de
    DWI si el conductor NO se declara culpable?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Para una primera infracción, hay una revocación mínima de 90 días (que
    se reduce a 30 días si se declara culpable de DWI).
- id: 310
  category: alcohol_drugs_health
  question: El dispositivo de bloqueo de encendido (Ignition Interlock Device) evita
    que un vehículo arranque si detecta una concentración de alcohol igual o superior
    a ¿qué nivel?
  choices:
    A: 0.02 por ciento
    B: 0.04 por ciento
    C: 0.08 por ciento
    D: 0.16 por ciento
  answer: A
  explanation: Si el dispositivo de bloqueo de encendido detecta una concentración
    de alcohol de 0.02 por ciento o superior, impide que el vehículo arranque.
- id: 311
  category: penalties_and_points
  question: ¿Se le puede acusar de un delito grave de DWI si es arrestado por un cuarto
    DWI en un periodo de cuántos años?
  choices:
    A: 5 años
    B: 7 años
    C: 10 años
    D: 15 años
  answer: C
  explanation: Se le puede acusar de un delito grave de DWI si es arrestado por un
    cuarto DWI en un periodo de 10 años.
- id: 312
  category: penalties_and_points
  question: Bajo la regla de "tolerancia cero", ¿cuál es la sanción para una persona
    menor de 21 años condenada por operar un vehículo motorizado con cualquier cantidad
    detectable de alcohol por primera vez?
  choices:
    A: Suspensión de los privilegios de conducir por 30 días
    B: Revocación de los privilegios de conducir por 90 días
    C: Suspensión de los privilegios de conducir por 180 días
    D: Cancelación de la licencia de conducir por un año
  answer: A
  explanation: Es ilegal que una persona menor de 21 años opere un vehículo motorizado
    con cualquier cantidad detectable de alcohol. Si es condenada por esta infracción,
    se le suspenderán los privilegios de conducir por 30 días.
- id: 313
  category: penalties_and_points
  question: Si conduce un vehículo comercial y tiene una concentración de alcohol
    que es detectable pero inferior al 0.04 por ciento, ¿cuál es la consecuencia inmediata?
  choices:
    A: Perderá su licencia de conducir comercial (CDL) por un año
    B: Se le pondrá fuera de servicio por 24 horas
    C: Se le requerirá inscribirse en el Programa de Dispositivo de Bloqueo de Encendido
      (Ignition Interlock)
    D: Enfrentará una revocación mínima de 90 días
  answer: B
  explanation: Si su concentración de alcohol es inferior al 0.04 pero detectable
    mientras conduce un vehículo comercial, se le pondrá fuera de servicio por 24
    horas.
- id: 314
  category: safe_driving_rules
  question: ¿Dónde es legal guardar un paquete abierto de un producto de consumo derivado
    del cáñamo en un vehículo motorizado privado en una carretera?
  choices:
    A: En la guantera
    B: En el compartimento de utilidades
    C: En el maletero del vehículo
    D: Debajo del asiento del conductor
  answer: C
  explanation: Puede guardar estos productos en el maletero de un vehículo o en otra
    área que no esté ocupada normalmente por el conductor y los pasajeros. No debe
    guardarlos en el compartimento de utilidades ni en la guantera.
- id: 315
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una sanción por una tercera infracción de DWI
    que ocurra dentro de los 10 años posteriores a las dos primeras infracciones?
  choices:
    A: Revocación de la licencia por un mínimo de 90 días
    B: Pérdida de la licencia por un mínimo de tres años
    C: Una multa de $1,000
    D: Inscripción opcional en el programa de Dispositivo de Bloqueo de Encendido
      (Ignition Interlock)
  answer: B
  explanation: Una tercera infracción dentro de los 10 años posteriores a las dos
    primeras infracciones resulta en la pérdida de la licencia por un mínimo de tres
    años, entre otras sanciones.
- id: 316
  category: penalties_and_points
  question: 'Para una primera infracción de DWI, un permiso de trabajo NO es una opción
    si el conductor tenía una concentración de alcohol de:'
  choices:
    A: 0.08 por ciento o más
    B: 0.10 por ciento o más
    C: 0.16 por ciento o más
    D: 0.20 por ciento o más
  answer: C
  explanation: Para una primera infracción, un permiso de trabajo no es una opción
    si tenía una concentración de alcohol del 0.16 por ciento o más.
- id: 317
  category: penalties_and_points
  question: 'Si un conductor comercial comete una infracción por alcohol por primera
    vez mientras opera un vehículo motorizado comercial con carteles de materiales
    peligrosos, perderá su licencia de conducir comercial por al menos:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Si la infracción ocurre mientras opera un vehículo motorizado comercial
    con carteles de materiales peligrosos, perderá su licencia de conducir comercial
    por al menos tres años.
- id: 318
  category: safe_driving_rules
  question: Según la ley de envases abiertos, ¿a quién se le permite beber una bebida
    alcohólica dentro de un vehículo motorizado en una calle o carretera pública?
  choices:
    A: Solo los pasajeros en el asiento trasero
    B: Cualquier persona excepto el conductor
    C: Los pasajeros, siempre que la concentración de alcohol del conductor sea de
      0.00
    D: A nadie se le permite beber una bebida alcohólica dentro del vehículo
  answer: D
  explanation: No debe beber ni tener un envase abierto dentro de un vehículo motorizado
    en una calle o carretera pública, y también es ilegal permitir que un pasajero
    beba o tenga un envase abierto.
- id: 319
  category: alcohol_drugs_health
  question: ¿Cuál es la ley con respecto a los envases abiertos de alcohol en un vehículo
    motorizado en una calle o carretera pública?
  choices:
    A: Solo se permite beber a los pasajeros.
    B: No debe beber ni tener un envase abierto de alcohol dentro del vehículo.
    C: Se permiten envases abiertos si se guardan en la guantera.
    D: Puede tener un envase abierto si está menos de la mitad de su capacidad.
  answer: B
  explanation: No debe beber ni tener un envase abierto de ninguna bebida alcohólica
    dentro de un vehículo motorizado cuando se encuentre en una calle o carretera
    pública.
- id: 320
  category: alcohol_drugs_health
  question: ¿Es legal permitir que un pasajero beba una bebida alcohólica dentro de
    un vehículo motorizado en una carretera pública?
  choices:
    A: Sí, siempre que el conductor no esté bebiendo.
    B: Sí, si el pasajero está en el asiento trasero.
    C: No, es ilegal permitir que un pasajero beba alcohol dentro de un vehículo motorizado.
    D: Sí, si el pasajero es mayor de 21 años.
  answer: C
  explanation: Es ilegal permitir que un pasajero beba, o tenga un envase abierto
    de, cualquier bebida alcohólica dentro de un vehículo motorizado.
- id: 321
  category: alcohol_drugs_health
  question: ¿Cuál es la regla con respecto a las sustancias controladas en un vehículo
    motorizado?
  choices:
    A: Puede poseerlas si están en un contenedor cerrado con llave.
    B: No debe usar, poseer ni vender sustancias controladas en un vehículo motorizado.
    C: Puede usarlas si está estacionado en una propiedad privada.
    D: Los pasajeros pueden poseerlas, pero el conductor no.
  answer: B
  explanation: No debe usar, poseer ni vender sustancias controladas en un vehículo
    motorizado.
- id: 322
  category: license_system
  question: ¿Cuál de los siguientes servicios está disponible en línea en drive.mn.gov?
  choices:
    A: Realizar el examen práctico de conducción
    B: Renovar el registro de su vehículo
    C: Comprar matrículas (placas) de especialidad
    D: Pagar una multa de tráfico
  answer: B
  explanation: Los servicios e información en línea disponibles en drive.mn.gov incluyen
    la renovación del registro de su vehículo, la programación de exámenes y el reporte
    de la venta de un vehículo.
- id: 323
  category: license_system
  question: Si necesita encontrar una escuela de educación vial o una clínica de mejoramiento
    aprobada, ¿cómo puede hacerlo en línea?
  choices:
    A: Visitando el sitio web del Fiscal General
    B: Consultando el sitio web de condiciones de las carreteras del MnDOT
    C: Visitando drive.mn.gov
    D: Enviando un correo electrónico a la Patrulla Estatal
  answer: C
  explanation: Puede encontrar escuelas de educación vial y clínicas de mejoramiento
    aprobadas utilizando los servicios en línea disponibles en drive.mn.gov.
- id: 324
  category: safe_driving_rules
  question: ¿A qué número puede llamar para obtener las condiciones de las carreteras
    del MnDOT?
  choices:
    A: '911'
    B: '511'
    C: '411'
    D: '311'
  answer: B
  explanation: Puede obtener las condiciones de las carreteras del MnDOT llamando
    al 511 o visitando 511mn.org.
- id: 325
  category: license_system
  question: ¿Qué sucede cuando solicita una licencia de conducir y proporciona documentación
    de ciudadanía estadounidense?
  choices:
    A: Se le inscribe automáticamente para el servicio militar obligatorio.
    B: Sus datos se envían automáticamente a la Oficina del Secretario de Estado para
      registrarlo para votar.
    C: Debe pagar una tarifa adicional por el registro de votantes.
    D: Recibirá una tarjeta de identificación de votante por separado por correo.
  answer: B
  explanation: Cuando solicita o renueva una licencia de conducir o tarjeta de identificación
    y proporciona documentación de ciudadanía, sus datos se enviarán automáticamente
    a la Oficina del Secretario de Estado para registrarlo para votar.
- id: 326
  category: license_system
  question: Si proporciona documentos de ciudadanía al DVS pero no desea ser registrado
    para votar, ¿qué debe hacer?
  choices:
    A: Optar por no participar ante la Oficina del Secretario de Estado.
    B: Decírselo al empleado del DVS durante su cita.
    C: Marcar la casilla de exclusión en su solicitud de licencia de conducir.
    D: Llamar a la oficina del Fiscal General.
  answer: A
  explanation: Si no desea ser registrado para votar después de proporcionar documentos
    de ciudadanía al DVS, debe optar por no participar ante la Oficina del Secretario
    de Estado.
- id: 327
  category: driver_responsibility
  question: Según el manual, ¿la donación de órganos puede salvar y sanar hasta cuántas
    vidas?
  choices:
    A: '10'
    B: '25'
    C: '50'
    D: '75'
  answer: D
  explanation: Donar órganos es un acto hermoso y desinteresado que puede salvar y
    sanar hasta 75 vidas.
- id: 328
  category: driver_responsibility
  question: ¿Cómo puede indicar su consentimiento para convertirse en donante de órganos
    en Minnesota?
  choices:
    A: Llevando una tarjeta de donante firmada en su billetera.
    B: Indicando su deseo cuando solicite una licencia o tarjeta de identificación
      de Minnesota.
    C: Registrándose directamente en un hospital local.
    D: Diciéndoselo verbalmente a un oficial de policía durante una parada de tráfico.
  answer: B
  explanation: Cuando solicita una licencia o tarjeta de identificación de Minnesota,
    puede indicar su deseo de convertirse en donante después de la muerte. Esta indicación
    sirve como su consentimiento.
- id: 329
  category: driver_responsibility
  question: ¿Pueden los conductores menores de 18 años designarse a sí mismos como
    donantes de órganos?
  choices:
    A: No, debe tener 18 años o más para ser donante de órganos.
    B: Sí, pero solo para donación de ojos y tejidos.
    C: Sí, con el consentimiento de sus padres.
    D: Sí, pero deben esperar hasta renovar su licencia a los 21 años.
  answer: C
  explanation: Los conductores menores de 18 años también pueden designarse como donantes
    con el consentimiento de sus padres.
- id: 330
  category: driver_responsibility
  question: ¿Cuál de los siguientes es un factor utilizado para asignar órganos a
    los receptores?
  choices:
    A: El estado financiero del receptor
    B: La edad del receptor
    C: Urgencia médica
    D: La ocupación del receptor
  answer: C
  explanation: Los órganos se asignan a los receptores según la urgencia médica, el
    tiempo de espera, la compatibilidad genética y la geografía.
- id: 331
  category: driver_responsibility
  question: ¿Cuánto le cuesta al donante o a su familia donar órganos?
  choices:
    A: Una tarifa fija de $500
    B: El costo del procedimiento quirúrgico
    C: No hay ningún cargo por la donación para el donante ni para su familia.
    D: La familia debe pagar por el transporte de los órganos.
  answer: C
  explanation: No hay ningún cargo por la donación para el donante ni para su familia.
- id: 332
  category: driver_responsibility
  question: ¿El proceso de donación de órganos impide un funeral con ataúd abierto?
  choices:
    A: Sí, en todos los casos.
    B: Sí, si se donan tejidos.
    C: No, el proceso de donación no impide un funeral con ataúd abierto.
    D: Depende de la política del hospital.
  answer: C
  explanation: El proceso de donación no impide un funeral con ataúd abierto.
- id: 333
  category: license_system
  question: ¿DVS NO enviará automáticamente sus datos al Secretario de Estado para
    el registro de votantes si usted proporcionó sus documentos de ciudadanía antes
    de qué fecha?
  choices:
    A: 1 de enero de 2020
    B: 1 de octubre de 2023
    C: 31 de diciembre de 2022
    D: 1 de julio de 2024
  answer: B
  explanation: DVS no enviará sus datos a la Oficina del Secretario de Estado si proporcionó
    estos documentos antes del 1 de octubre de 2023.
- id: 334
  category: driver_testing
  question: Según el texto proporcionado, ¿qué tipo de evaluación médica se requiere
    explícitamente o se cubre en el manual para conductores?
  choices:
    A: Examen de audición
    B: Examen de la vista
    C: Examen de reflejos
    D: Evaluación psicológica
  answer: B
  explanation: El índice del manual enumera explícitamente el "Examen de la vista"
    como un tema cubierto para los conductores.
- id: 335
  category: safe_driving_rules
  question: ¿Qué tipo específico de maniobra de vehículo se enumera en el índice del
    manual?
  choices:
    A: Giros en K
    B: Giros en J
    C: Giros en Z
    D: Giros en X
  answer: B
  explanation: Los "giros en J" se enumeran explícitamente en el índice del manual
    como una maniobra de conducción cubierta.
- id: 336
  category: alcohol_drugs_health
  question: ¿Qué dispositivo está específicamente indexado en el manual en relación
    con los conductores bajo los efectos del alcohol o drogas?
  choices:
    A: Bloqueo de encendido (Ignition Interlock)
    B: Limitador de velocidad
    C: Rastreador GPS
    D: Bloqueo por alcoholímetro
  answer: A
  explanation: El manual incluye una sección sobre el programa de "Bloqueo de encendido"
    (Ignition Interlock) para conductores bajo los efectos del alcohol o drogas.
- id: 337
  category: license_system
  question: ¿Qué grupo específico de empleados tiene una sección dedicada a las licencias
    en el Manual del Conductor de Minnesota?
  choices:
    A: Personal militar en servicio activo
    B: Empleados del Cuerpo de Paz y del servicio exterior federal
    C: Estudiantes universitarios de fuera del estado
    D: Trabajadores agrícolas y de granjas
  answer: B
  explanation: El índice enumera específicamente una sección para "Empleados del Cuerpo
    de Paz y del servicio exterior federal".
- id: 338
  category: safe_driving_rules
  question: 'El manual contiene una sección específica que detalla qué hacer y qué
    esperar cuando:'
  choices:
    A: Compra un vehículo nuevo
    B: Es detenido por las fuerzas del orden
    C: Renueva el seguro del automóvil
    D: Conduce en otro país
  answer: B
  explanation: El índice enumera una sección titulada "Qué hacer y qué esperar cuando
    es detenido por las fuerzas del orden".
- id: 339
  category: license_system
  question: ¿Cuál de los siguientes es un tipo de licencia mencionado en el índice
    del manual?
  choices:
    A: Licencia provisional
    B: Permiso temporal
    C: Licencia por dificultades económicas
    D: Licencia condicional
  answer: A
  explanation: La "Licencia provisional" es una clasificación de licencia específica
    que figura en el índice del manual.
- id: 340
  category: sharing_the_road
  question: Además de las motocicletas, ¿qué otro tipo específico de vehículo de dos
    ruedas está explícitamente indexado en el manual?
  choices:
    A: Bicicletas de montaña
    B: Bicicletas motorizadas
    C: Bicicletas de carreras
    D: Bicicletas tándem
  answer: B
  explanation: Las "bicicletas motorizadas" se enumeran explícitamente junto con las
    motocicletas en el índice del manual.
- id: 341
  category: safe_driving_rules
  question: ¿Según el índice, cuál de los siguientes es un tema cubierto sobre la
    seguridad de los pasajeros?
  choices:
    A: Almohadillas elevadoras
    B: Asiento de seguridad
    C: Monitores orientados hacia atrás
    D: Seguros para niños
  answer: B
  explanation: El manual incluye una sección específica sobre el uso de un "Asiento
    de seguridad".
- id: 342
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es un tipo específico de intersección o característica
    vial mencionada en el manual?
  choices:
    A: Círculos de tráfico
    B: Rotondas (Roundabouts)
    C: Cruces de caja
    D: Intercambios de diamante
  answer: B
  explanation: Las "Rotondas" (Roundabouts) aparecen explícitamente en el índice del
    manual como un tema cubierto.
- id: 343
  category: penalties_and_points
  question: El manual incluye una sección específica sobre las sanciones o reglas
    con respecto a huir de ¿quién?
  choices:
    A: Un oficial de policía
    B: La escena de un accidente
    C: Un animal salvaje
    D: Una cabina de peaje
  answer: A
  explanation: El índice enumera explícitamente una sección sobre "Huir de un oficial
    de policía".
- id: 344
  category: sharing_the_road
  question: ¿Qué tipo específico de zona se menciona en el índice con respecto a las
    autopistas?
  choices:
    A: Zonas de descanso en la autopista
    B: Zonas de obras en la autopista
    C: Zonas de velocidad en la autopista
    D: Zonas de rebase en la autopista
  answer: B
  explanation: Las "Zonas de obras en la autopista" están enumeradas específicamente
    en el índice del manual.
- id: 345
  category: penalties_and_points
  question: ¿Cuál de los siguientes términos se utiliza en el manual para describir
    la pérdida de los privilegios de conducir?
  choices:
    A: Invalidación
    B: Cancelación
    C: Revocación
    D: Descalificación
  answer: C
  explanation: La "Revocación" (junto con la Suspensión) aparece explícitamente en
    el índice con respecto a la pérdida de la licencia.
- id: 346
  category: driver_testing
  question: ¿Qué tipo de examen es requerido y aparece explícitamente en el índice
    junto con el examen escrito?
  choices:
    A: Examen de manejo (Road test)
    B: Examen de reflejos
    C: Examen de audición
    D: Examen de drogas
  answer: A
  explanation: El "Examen de manejo" (Road test) y el "Examen escrito" aparecen explícitamente
    en el índice del manual.
- id: 347
  category: license_system
  question: El manual cubre un sistema de licencias para nuevos conductores conocido
    como GDL. Según el texto, ¿qué significan estas siglas?
  choices:
    A: Licencia de Conducir General
    B: Sistema de Licencias Graduadas de Conducir (Graduated Driver's Licensing)
    C: Límites de Conducción Garantizados
    D: Aprendizaje de Conducción Guiado
  answer: B
  explanation: El índice enumera explícitamente el "Sistema de Licencias Graduadas
    de Conducir" (Graduated Driver's Licensing).
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 348
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 349
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entrar en esta vía
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 350
- image: wrong_way.png
  category: signs_and_signals
  question: ¿Qué debe hacer si ve esta señal?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 351
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 352
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 353
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 354
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 355
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona donde está prohibido adelantar.
  id: 356
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse al lado derecho de una isla de tráfico,
    mediana u obstrucción.
  id: 357
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 358
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 359
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que cruzan la calle.
  id: 360
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal fluorescente de color amarillo verdoso en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 361
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 362
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) se coloca en los cruces de ferrocarril.
    Significa que debe ceder el paso a los trenes. Si se aproxima un tren, debe detenerse.
  id: 363
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 364
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más brusco que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 365
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 366
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 367
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 368
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 369
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en direcciones
    opuestas. Manténgase a la derecha.
  id: 370
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción vial más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Esté preparado para
    el tráfico en ambos sentidos.
  id: 371
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una vía de un solo sentido o de una autopista dividida y
    se encuentre con vehículos que viajan en la dirección opuesta.
  id: 372
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 373
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción vial
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 374
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  id: 375
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 376
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las carreteras
    laterales.
  id: 377
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la autopista desde la carretera lateral.
  id: 378
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir una incorporación. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 379
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 380
- image: handicap_parking.png
  category: signs_and_signals
  id: 381
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
- id: 382
  category: sharing_the_road
  question: ¿Cómo debe comportarse al compartir la carretera con un quitanieves en
    una carretera de Minnesota cubierta de nieve?
  choices:
    A: Conducir cerca detrás de él para que el camino despejado permanezca abierto
    B: Rebasarlo lo más rápido posible por cualquier lado
    C: Nunca lo presione, manténgase a una distancia prudente y rebáselo solo cuando
      pueda ver el vehículo completo
    D: Tocar la bocina continuamente hasta que el operador se detenga a un lado
  answer: C
  explanation: Cuando las carreteras están cubiertas de nieve o hielo, nunca presione
    a un quitanieves. Manténgase a una distancia prudente y rebáselos solo cuando
    pueda ver el vehículo completo, ya que crean nubes de nieve y condiciones de "visibilidad
    nula" (whiteout) que pueden ocultar lo que hay delante de ellos.
- id: 383
  category: safe_driving_rules
  question: Cuando una ciudad de Minnesota declara una emergencia por nieve después
    de una nevada significativa, ¿qué deben hacer los conductores?
  choices:
    A: Estacionarse solo en el lado de la calle que da al tráfico
    B: Obedecer las reglas de estacionamiento de emergencia por nieve para evitar
      el remolque y multas
    C: Continuar estacionándose donde lo hacen normalmente
    D: Mover todos los vehículos a garajes privados en menos de una hora
  answer: B
  explanation: Cuando se acumula una cantidad significativa de nieve, los funcionarios
    de la ciudad pueden declarar una emergencia por nieve. Ciertas calles deben despejarse
    de vehículos estacionados para que los quitanieves puedan realizar su trabajo.
    Obedezca las reglas de estacionamiento de emergencia por nieve para evitar el
    remolque y multas.
