metadata:
  source: Utah Driver Handbook (REV 3.2026) (dld.utah.gov)
  total_questions: 427
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: sharing_the_road
  question: According to the Utah Driver Handbook, what rules must a bicycle operator
    follow?
  choices:
    A: Only pedestrian rules and sidewalk right-of-way laws
    B: The rules of the road with the same rights and duties as a motor vehicle operator
    C: Special bicycle-only rules that supersede standard motor vehicle laws
    D: Bicycles are considered recreational equipment and are not required to follow
      traffic rules
  answer: B
  explanation: The manual states that a bicycle operator must obey the rules of the
    road and have the same rights and duties as the operator of a motor vehicle or
    other vehicle.
- id: 2
  category: license_system
  question: Which of the following services is handled by the Department of Motor
    Vehicles (DMV) rather than the Driver License Division (DLD)?
  choices:
    A: Voter Registration
    B: Reinstatement Fees
    C: Vehicle plates and titles
    D: Commercial Driver Licenses (CDL)
  answer: C
  explanation: The manual clarifies that the Driver License Division is not part of
    the DMV, and that the DMV handles all of your vehicle needs, such as plates and
    titles.
- id: 3
  category: penalties_and_points
  question: Under the new HB 234 Motorcycle Safety Amendments, what happens if a person
    is fined for operating a motorcycle without an endorsement?
  choices:
    A: The motorcycle is permanently impounded by the state.
    B: The court will waive the fine if the person obtains a motorcycle endorsement
      within 30 days.
    C: The person's driver license is automatically suspended for one year.
    D: The fine is doubled if it is a first-time offense.
  answer: B
  explanation: HB 234 increases the fine for operating a motorcycle without an endorsement,
    but notes that the court will waive the fine if the person obtains a motorcycle
    endorsement within 30 days.
- id: 4
  category: license_system
  question: According to HB 308, under what condition can an individual with a learner
    permit younger than 18 drive with an adult other than a parent?
  choices:
    A: If the parent or legal guardian is not a licensed driver, provided the adult
      has evidence of authorization.
    B: If the adult is at least 18 years old and holds a valid learner permit.
    C: If the minor has completed at least 10 hours of professional driver education.
    D: Minors under 18 are never allowed to drive with anyone other than a parent
      or legal guardian.
  answer: A
  explanation: HB 308 allows an individual with a learner permit younger than 18 years
    old to drive with an adult other than a parent if the parent or legal guardian
    is not a licensed driver, and the adult has evidence of authorization from the
    parent or guardian.
- id: 5
  category: alcohol_drugs_health
  question: Effective January 1, 2026, what does an 'interdicted person' designation
    mean for a driver convicted of an extreme DUI?
  choices:
    A: They are required to retake the driving skills test annually.
    B: They are prohibited from purchasing alcohol for a certain time period.
    C: They must install an ignition interlock device on all vehicles they own.
    D: They are permanently banned from operating any motor vehicle.
  answer: B
  explanation: Under HB 437, a person designated as an interdicted person will be
    prohibited from purchasing alcohol for a certain time period.
- id: 6
  category: license_system
  question: How will an interdicted driver license or identification card be visually
    distinct?
  choices:
    A: It will be printed vertically instead of horizontally.
    B: It will have a solid yellow background.
    C: It will have a red banner at the top stating 'NO ALCOHOL SALE.'
    D: It will have a hole punched through the expiration date.
  answer: C
  explanation: According to HB 437, an interdicted DL/IDC will have a red banner at
    the top of the card stating 'NO ALCOHOL SALE.'
- id: 7
  category: penalties_and_points
  question: Effective January 1, 2026, which of the following violations will require
    the DLD to suspend an individual's motorcycle endorsement or driver license?
  choices:
    A: Parking in a commercial loading zone
    B: Performing a wheelie or lane splitting
    C: Driving 5 mph over the posted speed limit
    D: Failing to wear a reflective vest at night
  answer: B
  explanation: HB 190 requires the DLD to suspend an individual's motorcycle endorsement
    or driver license based on convictions for failure to properly display a license
    plate, performing a wheelie, or lane splitting.
- id: 8
  category: alcohol_drugs_health
  question: In December 2018, Utah became the first state in the country to establish
    what blood alcohol concentration (BAC) limit?
  choices:
    A: '.08'
    B: '.05'
    C: '.04'
    D: '.02'
  answer: B
  explanation: The Driver License History section notes that in December 2018, Utah
    became the first state in the country to have a blood alcohol concentrate of .05.
- id: 9
  category: license_system
  question: In January 2020, how long was the standard Utah driver license renewal
    period extended to?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: In January 2020, driver license renewals extended from a 5-year renewal
    to an 8-year renewal.
- id: 10
  category: driver_testing
  question: Since 2016, where are all driving skills tests conducted in Utah?
  choices:
    A: On an enclosed range
    B: On public roads
    C: Using a virtual reality simulator
    D: In empty parking lots only
  answer: B
  explanation: In 2016, the Driver License Division stopped conducting driving skills
    tests on an enclosed range. All driving skills tests are performed on public roads.
- id: 11
  category: safe_driving_rules
  question: According to 2024 statistics, what is the number one leading cause of
    all crashes on Utah highways?
  choices:
    A: Failed to Yield Right-of-Way
    B: Too Fast for Conditions
    C: Failed to Keep in Proper Lane
    D: Over-Correcting/Over-Steering
  answer: C
  explanation: The statistics show that 'Failed to Keep in Proper Lane' is the leading
    cause of all crashes on Utah highways, accounting for 28%.
- id: 12
  category: safe_driving_rules
  question: Which of the following is the second leading cause of crashes on Utah
    highways for teenagers (ages 15-19)?
  choices:
    A: Disregard Traffic Signal
    B: Following Too Closely
    C: Wrong Side/Wrong Way
    D: Driving Under the Influence
  answer: A
  explanation: For teenagers 15-19, the second leading cause of crashes is 'Disregard
    Traffic Signal' at 14%.
- id: 13
  category: safe_driving_rules
  question: What is the leading cause of crashes on Utah highways for drivers aged
    65 and older?
  choices:
    A: Ran Off The Road
    B: Failed to Yield Right-of-Way
    C: Reckless/Aggressive Driving
    D: Too Fast for Conditions
  answer: B
  explanation: For drivers aged 65+, the leading cause of crashes is 'Failed to Yield
    Right-of-Way' at 21%.
- id: 14
  category: license_system
  question: When the first driver license was issued in Utah in 1933, how long was
    it valid for?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Good until revoked
  answer: D
  explanation: The first license in Utah was issued on December 5, 1933, and was 'good
    until revoked.'
- id: 15
  category: license_system
  question: To reduce wait times for services such as Driver Review Exams and Reinstatement
    Fees, what does the Driver License Division (DLD) highly recommend?
  choices:
    A: Mailing in all documents
    B: Scheduling an appointment online
    C: Visiting the DMV instead
    D: Arriving exactly at opening time for walk-in service
  answer: B
  explanation: The manual states that appointments should be scheduled for all services
    to reduce wait time, as walk-in service may experience much longer wait times
    due to appointments taking priority.
- id: 16
  category: vehicle_information
  question: According to the manual, which of the following is part of preparing your
    vehicle before driving?
  choices:
    A: Adjusting your seat and mirrors
    B: Checking pavement markings
    C: Passing other vehicles
    D: Yielding right-of-way
  answer: A
  explanation: Section 7, 'Preparing Your Vehicle,' specifically includes adjusting
    your seat and adjusting your mirrors before driving.
- id: 17
  category: safe_driving_rules
  question: Which of the following maneuvers is categorized under 'Basic Driving'
    in the Utah driver's manual?
  choices:
    A: Navigating highway work zones
    B: Backing (Reverse)
    C: Avoiding collisions with animals
    D: Boating while under the influence
  answer: B
  explanation: Section 8, 'Basic Driving,' includes Backing (Reverse) as a fundamental
    driving skill alongside steering, stopping, and turning.
- id: 18
  category: signs_and_signals
  question: Where are 'Traffic Signals' and 'Traffic Signs' categorized in the driver's
    manual?
  choices:
    A: Basic Driving
    B: Rules of the Road
    C: Sharing the Road
    D: Distractions and Driving Challenges
  answer: B
  explanation: Traffic Signals and Traffic Signs are covered under Section 9, 'Rules
    of the Road.'
- id: 19
  category: alcohol_drugs_health
  question: According to the manual, the rules regarding 'Boating While Under the
    Influence' are grouped with which major topic?
  choices:
    A: Rules of the Road
    B: Crashes and Insurance
    C: Alcohol/Drugs and Driving
    D: Suspensions and Your Record
  answer: C
  explanation: '''Boating While Under the Influence'' is listed under Section 10,
    ''Alcohol/Drugs and Driving.'''
- id: 20
  category: defensive_driving
  question: Which of the following is identified as a 'Distraction and Driving Challenge'
    in the manual?
  choices:
    A: Handheld Wireless Communication
    B: Adjusting your mirrors
    C: Starting the engine
    D: Yielding right-of-way
  answer: A
  explanation: Section 11, 'Distractions and Driving Challenges,' specifically lists
    Handheld Wireless Communication as a challenge.
- id: 21
  category: defensive_driving
  question: According to the manual, dealing with a 'Vehicle Submerged Underwater'
    is classified as what type of issue?
  choices:
    A: Basic Driving
    B: Distractions and Driving Challenges
    C: Rules of the Road
    D: Sharing the Road
  answer: B
  explanation: Information on how to handle a 'Vehicle Submerged Underwater' is covered
    in Section 11, 'Distractions and Driving Challenges.'
- id: 22
  category: driver_responsibility
  question: The 'Financial Responsibility Act' is discussed in the same section as
    which of the following topics?
  choices:
    A: Insurance Coverage
    B: Point System
    C: Vision and Health
    D: Basic Driving
  answer: A
  explanation: Both the Financial Responsibility Act and Insurance Coverage are covered
    in Section 12, 'Crashes and Insurance.'
- id: 23
  category: penalties_and_points
  question: If you need information about the 'Point System' for traffic violations,
    which section of the manual should you consult?
  choices:
    A: Section 6
    B: Section 9
    C: Section 11
    D: Section 13
  answer: D
  explanation: The Point System is detailed in Section 13, 'Suspensions and Your Record.'
- id: 24
  category: sharing_the_road
  question: According to Section 14, 'Sharing the Road,' drivers must know how to
    safely share the road with which of the following?
  choices:
    A: Flex lanes
    B: Roundabouts
    C: Large Trucks
    D: Highway work zones
  answer: C
  explanation: Section 14, 'Sharing the Road,' includes specific guidelines for sharing
    the road safely with Large Trucks.
- id: 25
  category: driver_testing
  question: Which of the following is listed as an examination required in Section
    6?
  choices:
    A: Eye (Vision) Test
    B: Traffic Safety and Trends Exam
    C: Financial Responsibility Exam
    D: Ignition Interlock Test
  answer: B
  explanation: Section 6, 'Examinations,' includes the Traffic Safety and Trends Exam.
    (The Eye Test is located in Section 5).
- id: 26
  category: license_system
  question: Where would you find the requirements for an 'Out-of-State Driver License'?
  choices:
    A: Section 4
    B: Section 5
    C: Section 6
    D: Section 13
  answer: A
  explanation: '''Out-of-State Driver License'' is listed under Section 4, which covers
    Driver License and Identification requirements.'
- id: 27
  category: safe_driving_rules
  question: 'According to the manual, ''Freeway Driving'' and ''Roundabouts'' are
    both considered part of:'
  choices:
    A: Basic Driving
    B: Rules of the Road
    C: Distractions and Driving Challenges
    D: Sharing the Road
  answer: B
  explanation: Freeway Driving and Roundabouts are both topics covered under Section
    9, 'Rules of the Road.'
- id: 28
  category: penalties_and_points
  question: Which section of the manual explains the consequences of an 'Altered or
    Fictitious License'?
  choices:
    A: Section 4
    B: Section 6
    C: Section 10
    D: Section 13
  answer: D
  explanation: The topic 'Altered or Fictitious License' is covered in Section 13,
    'Suspensions and Your Record.'
- id: 29
  category: sharing_the_road
  question: Which of the following is NOT listed as a topic under Section 14, 'Sharing
    the Road'?
  choices:
    A: Bicycles
    B: Pedestrians
    C: Motorcycles
    D: Aggressive Driving
  answer: D
  explanation: Aggressive Driving is listed under Section 11 (Distractions and Driving
    Challenges), while Bicycles, Pedestrians, and Motorcycles are in Section 14 (Sharing
    the Road).
- id: 30
  category: alcohol_drugs_health
  question: According to the manual, information regarding the 'Ignition Interlock
    Restricted Driver' is found under which topic?
  choices:
    A: Crashes and Insurance
    B: Alcohol/Drugs and Driving
    C: Suspensions and Your Record
    D: Preparing Your Vehicle
  answer: B
  explanation: The 'Ignition Interlock Restricted Driver' topic is covered in Section
    10, 'Alcohol/Drugs and Driving.'
- id: 31
  category: defensive_driving
  question: According to the Utah driver handbook, which of the following actions
    constitutes "Careless Driving"?
  choices:
    A: Driving 10 mph over the posted speed limit
    B: Committing a moving traffic violation while distracted by searching for an
      item in the vehicle
    C: Parking in a designated handicap spot without a placard
    D: Failing to renew your vehicle registration on time
  answer: B
  explanation: A person is guilty of careless driving if they commit a moving traffic
    violation while distracted by activities like searching for an item, personal
    hygiene, or grooming.
- id: 32
  category: vehicle_information
  question: By definition, a bicycle must have wheels that are at least what size
    in diameter?
  choices:
    A: 10 inches
    B: 12 inches
    C: 14 inches
    D: 16 inches
  answer: C
  explanation: A bicycle is defined as having wheels that are not less than 14 inches
    in diameter.
- id: 33
  category: license_system
  question: A Commercial Driver License (CDL) is required to drive a vehicle with
    a Gross Vehicle Weight Rating (GVWR) of at least how many pounds?
  choices:
    A: 10,001 lbs
    B: 16,001 lbs
    C: 26,001 lbs
    D: 32,001 lbs
  answer: C
  explanation: A CDL allows the holder to drive a vehicle with a GVWR of 26,001 lbs.
    or more.
- id: 34
  category: license_system
  question: What is a Driving Privilege Card?
  choices:
    A: A permit for individuals with physical disabilities to drive mobility vehicles
    B: Evidence of the privilege to drive obtained without providing proof of lawful
      presence in the U.S.
    C: A temporary license allowing driving privileges for up to six months
    D: A license issued to any person under 21 years of age
  answer: B
  explanation: A Driving Privilege Card is evidence of the privilege to drive a motor
    vehicle in Utah obtained without providing proof of lawful presence in the United
    States.
- id: 35
  category: vehicle_information
  question: 'A "Low-Speed Vehicle" is a four-wheeled electric motor vehicle designed
    to be operated at speeds of no more than:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: A Low-Speed Vehicle is designed to be operated at speeds of not more
    than 25 miles per hour and has a capacity of not more than four passengers.
- id: 36
  category: license_system
  question: 'In Utah, a Provisional License is issued to any person who is:'
  choices:
    A: Under 18 years of age
    B: Under 21 years of age
    C: Obtaining their first driver's license
    D: Driving with a learner's permit
  answer: B
  explanation: A Provisional License is defined as a Utah license issued to any person
    under 21 years of age.
- id: 37
  category: safe_driving_rules
  question: In which direction does traffic flow in a roundabout?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a figure-eight pattern
    D: Whichever direction is indicated by the yield sign
  answer: B
  explanation: A traffic roundabout is defined as a circular intersection that flows
    counterclockwise.
- id: 38
  category: penalties_and_points
  question: What is the definition of a license "Suspension"?
  choices:
    A: The permanent termination of the privilege to drive
    B: The temporary withdrawal of the privilege to drive
    C: The withdrawal of driving privileges due to fraud
    D: The termination of a commercial driver license
  answer: B
  explanation: Suspension is defined as the temporary withdrawal of the privilege
    to drive, whereas revocation is the termination of the privilege.
- id: 39
  category: license_system
  question: According to the Utah driver handbook, a "Dependent" includes a spouse
    and any unmarried children under what age?
  choices:
    A: '18'
    B: '21'
    C: '24'
    D: '26'
  answer: B
  explanation: A dependent is defined as a spouse and any unmarried children under
    the age of 21.
- id: 40
  category: vehicle_information
  question: A Pedestrian Vehicle, intended for persons with a physical disability,
    must not exceed what maximum speed capability?
  choices:
    A: 15 m.p.h.
    B: 20 m.p.h.
    C: 25 m.p.h.
    D: 30 m.p.h.
  answer: D
  explanation: A pedestrian vehicle must not exceed 48 inches in width, have an engine
    over 300 cubic centimeters, or be capable of exceeding 30 m.p.h.
- id: 41
  category: defensive_driving
  question: What is the proper way to perform a "Head Check" before moving your vehicle?
  choices:
    A: Looking at your rearview mirror and side mirrors
    B: Turning your head and looking over your shoulder in the direction you plan
      on moving
    C: Scanning the road ahead for pedestrians and obstacles
    D: Checking the dashboard for warning lights
  answer: B
  explanation: Head Checks involve checking your blind spot by turning your head and
    looking over your shoulder in the direction you plan on moving.
- id: 42
  category: license_system
  question: Who is issued a Limited-Term Driver License?
  choices:
    A: A person who has committed multiple traffic violations
    B: An individual who provided proof of lawful presence but is not a U.S. Citizen,
      U.S. National, or Legal Permanent Resident Alien
    C: A driver under the age of 21
    D: A person driving a commercial vehicle for seasonal agricultural work
  answer: B
  explanation: A Limited-Term Driver License is issued to an individual who provided
    proof of lawful presence in the United States but is not a U.S. Citizen, a U.S.
    National, or a Legal Permanent Resident Alien.
- id: 43
  category: vehicle_information
  question: Which of the following is NOT considered a "Motor Vehicle" under Utah
    definitions?
  choices:
    A: A farm tractor
    B: A motorcycle
    C: A motorized wheelchair
    D: A taxicab
  answer: C
  explanation: The definition of a Motor Vehicle explicitly excludes motorized wheelchairs,
    electric personal assistive mobility devices, and vehicles moved solely by human
    power.
- id: 44
  category: vehicle_information
  question: A Private Passenger Carrier is a motor vehicle for hire designed to transport
    a maximum of how many passengers, including the driver?
  choices:
    A: 10 or fewer
    B: 12 or fewer
    C: 15 or fewer
    D: 16 or fewer
  answer: C
  explanation: A Private Passenger Carrier is designed to transport 15 or fewer passengers,
    including the driver, and operated to transport an employee of the person that
    hires the motor vehicle.
- id: 45
  category: license_system
  question: A Temporary Driver License allows driving privileges for up to how long?
  choices:
    A: 30 days
    B: 90 days
    C: Six months
    D: One year
  answer: C
  explanation: A Temporary Driver License is a temporary license allowing driving
    privileges up to six months, and is not available for driving privilege card (DPC)
    holders.
- id: 46
  category: defensive_driving
  question: What is the definition of a 'Traffic Check' according to the Utah driver's
    manual?
  choices:
    A: A police roadblock to check for valid licenses and registration.
    B: A defensive driving scan for other traffic, pedestrians, or any other obstacles
      you may encounter.
    C: A mandatory vehicle inspection performed every year.
    D: A test of the vehicle's braking system before driving.
  answer: B
  explanation: The manual defines a Traffic Check as a defensive driving scan for
    other traffic, pedestrians, or any other obstacles you may encounter while driving.
- id: 47
  category: license_system
  question: How long can a visitor with a valid out-of-state or out-of-country driver
    license drive in Utah?
  choices:
    A: Up to 30 days
    B: Up to 90 days
    C: Up to 6 months
    D: Up to 1 year
  answer: C
  explanation: Visitors with a valid out-of-state or out-of-country driver license
    may drive in Utah for up to six months.
- id: 48
  category: license_system
  question: Which of the following actions makes a person a resident of Utah for driver
    licensing purposes?
  choices:
    A: Remaining in the state for three months during a calendar year.
    B: Being on a temporary work assignment in the state.
    C: Obtaining privileges not extended to non-residents, including school tuition.
    D: Visiting family in Utah for the summer.
  answer: C
  explanation: Persons become residents if they obtain privileges not extended to
    non-residents, including school tuition. Temporary work assignments do not make
    you a resident, and you must remain in the state for six months or more to be
    considered a resident by time alone.
- id: 49
  category: driver_testing
  question: How many hours of behind-the-wheel instruction are required for an approved
    Utah driver education course?
  choices:
    A: 6 hours
    B: 10 hours
    C: 18 hours
    D: 27 hours
  answer: A
  explanation: Required driver education hours include 6 hours of behind-the-wheel
    instruction.
- id: 50
  category: driver_testing
  question: If you are 19 years of age or older and have never been licensed, how
    can you waive the 90-day learner permit holding requirement?
  choices:
    A: By completing 40 hours of driving with a parent.
    B: By passing the written knowledge test twice.
    C: By completing an approved driver education course.
    D: By paying an additional fee at the Driver License Division.
  answer: C
  explanation: Applicants 19 years of age or older may complete an approved driver
    education course and waive the 90-day learner permit requirement.
- id: 51
  category: license_system
  question: For an entry-level learner permit, how long are the written knowledge
    test scores valid?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: C
  explanation: The written knowledge test scores for an entry-level learner permit
    are valid for 18 months.
- id: 52
  category: safe_driving_rules
  question: If you are a 16-year-old licensed driver, what are your nighttime driving
    restrictions?
  choices:
    A: You may not drive between 10 pm and 5 am.
    B: You may not drive between 12 am and 5 am.
    C: You may not drive between sunset and sunrise.
    D: You have no nighttime driving restrictions.
  answer: B
  explanation: For a 16-year-old with a driver license (not permit), nighttime driving
    restrictions apply from 12 am to 5 am, unless an exception is met.
- id: 53
  category: safe_driving_rules
  question: A 16-year-old driver with a driver license is restricted to having only
    immediate family members in the vehicle for how long after the issue date?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A 16-year-old with a driver license is restricted to having immediate
    family members only in the vehicle until six months from the issue date.
- id: 54
  category: license_system
  question: Which of the following individuals is NOT required to obtain a Utah driver
    license to drive on Utah highways?
  choices:
    A: A person driving a farm tractor in conjunction with an agricultural activity.
    B: A person who has been gainfully employed in Utah for a permanent job.
    C: A person who has remained in Utah for eight months during the calendar year.
    D: A 15-year-old driving to school.
  answer: A
  explanation: Persons are not required to obtain a driver license to drive road rollers,
    road machinery, or farm tractors on Utah highways if driving the vehicle in conjunction
    with a construction or agricultural activity.
- id: 55
  category: penalties_and_points
  question: What is the administrative fee for an alcohol/drug reinstatement in Utah?
  choices:
    A: $40.00
    B: $85.00
    C: $255.00
    D: $340.00
  answer: C
  explanation: According to the Driver License Fees chart, the administrative fee
    for alcohol/drug reinstatement is $255.00.
- id: 56
  category: license_system
  question: Under the Driver License Compact (DLC), what happens when a driver receives
    a traffic conviction in another member state?
  choices:
    A: The conviction is ignored by the home state.
    B: The driver must surrender their license to the state where the offense occurred.
    C: The member jurisdiction forwards the conviction for the traffic offense to
      the driver's home state.
    D: The driver is required to retake the written knowledge test in their home state.
  answer: C
  explanation: The DLC provides guidelines for greater cooperation among members,
    where member jurisdictions exchange driver records and forward convictions for
    traffic offenses to the driver's home state.
- id: 57
  category: driver_testing
  question: Will the Utah Driver License Division accept an out-of-state online or
    home study driver education course certificate?
  choices:
    A: Yes, if it meets Utah's required hours.
    B: Yes, but only for applicants over 18.
    C: No, out-of-state online or home study course certificates will not be accepted.
    D: No, unless the applicant pays an out-of-state transfer fee.
  answer: C
  explanation: 'The manual explicitly states: ''Out-of-state online or home study
    course certificates will not be accepted.'''
- id: 58
  category: driver_responsibility
  question: How many hours of driving must an applicant between ages 15-18 complete
    with a parent or legal guardian before being licensed?
  choices:
    A: 27 hours (5 hours after sunset)
    B: 30 hours (10 hours after sunset)
    C: 40 hours (10 hours after sunset)
    D: 50 hours (15 hours after sunset)
  answer: C
  explanation: A student must complete 40 hours of driving (10 hours after sunset)
    with a parent or legal guardian.
- id: 59
  category: license_system
  question: What is the minimum age required to obtain an entry-level learner permit
    in Utah?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: B
  explanation: The entry-level learner permit entitles you to drive a regular motor
    vehicle if you have reached a minimum age of 15.
- id: 60
  category: license_system
  question: 'According to Utah law regarding REAL ID-compliant certificates, you may:'
  choices:
    A: Possess a Utah driver license and a Colorado ID at the same time.
    B: Not possess more than one REAL ID-compliant certificate at a time.
    C: Possess up to three REAL ID-compliant certificates from different states.
    D: Keep your out-of-state REAL ID indefinitely after becoming a Utah resident.
  answer: B
  explanation: By law, you may not possess more than one REAL ID-compliant certificate
    at a time (e.g., a Utah driver license and a Colorado ID).
- id: 61
  category: license_system
  question: What is the fee for a regular Class D driver license renewal for an applicant
    under the age of 65?
  choices:
    A: $23.00
    B: $27.00
    C: $40.00
    D: $52.00
  answer: D
  explanation: According to the fee chart in the manual, the fee for a standard Renewal
    is $52.00, while a Renewal (65+) is $27.00.
- id: 62
  category: license_system
  question: What is the maximum vehicle weight a person with a regular Class D driver
    license is allowed to drive?
  choices:
    A: 10,001 pounds
    B: 16,000 pounds
    C: 26,000 pounds
    D: 32,000 pounds
  answer: C
  explanation: A regular Class D driver license allows you to drive all personal vehicles
    up to 26,000 pounds.
- id: 63
  category: license_system
  question: Why are applicants younger than 21 issued a provisional Class D regular
    driver license?
  choices:
    A: To restrict them from driving at night
    B: For the purpose of using a separate point system
    C: Because they are not allowed to drive passengers
    D: To require them to drive with a licensed adult
  answer: B
  explanation: The manual states that applicants younger than the age of 21 are issued
    a provisional Class D regular driver license for the purpose of using a separate
    point system.
- id: 64
  category: license_system
  question: When does a Driving Privilege Card (DPC) expire?
  choices:
    A: Every 5 years on the applicant's birthday
    B: Each year on the applicant's birthday
    C: Six months from the date of issuance
    D: On the expiration date of the applicant's visa
  answer: B
  explanation: The manual specifies that the Driving Privilege Card (DPC) expires
    each year on the applicant's birthday.
- id: 65
  category: license_system
  question: What is the minimum age requirement to obtain a Class C license to transport
    hazardous materials?
  choices:
    A: 16 years of age
    B: 18 years of age
    C: 19 years of age
    D: 21 years of age
  answer: D
  explanation: The classified license system chart indicates that the minimum age
    requirement for a Class C license (which includes transporting placarded amounts
    of hazardous materials) is 21 years of age.
- id: 66
  category: license_system
  question: Which endorsement code is required on a license to operate a taxicab?
  choices:
    A: T
    B: P
    C: Z
    D: X
  answer: C
  explanation: Under the Endorsement Codes section, 'Z' is listed as the endorsement
    for a Taxicab.
- id: 67
  category: license_system
  question: If a driver has a 'B' restriction on their license, what does this mean?
  choices:
    A: They must wear corrective lenses while driving
    B: They are restricted to driving during daylight hours only
    C: They must drive a vehicle with an automatic transmission
    D: They are restricted to operating a motor vehicle on roads with a posted speed
      of 40 mph or less
  answer: A
  explanation: 'The manual lists restriction ''B'' as: ''Driver must wear corrective
    lenses''.'
- id: 68
  category: license_system
  question: What does a 'G' restriction indicate on a driver's license?
  choices:
    A: Restricted to driving a vehicle with outside rearview mirrors
    B: Restricted to driving during daylight hours only
    C: Restricted to operating a street legal ATV
    D: Mechanical aid or compensatory device required while driving
  answer: B
  explanation: According to the restrictions list, 'G' means the driver is restricted
    to driving during daylight hours only.
- id: 69
  category: license_system
  question: Which of the following documents is NOT acceptable when providing a birth
    certificate for identification?
  choices:
    A: A state-certified birth certificate
    B: A hospital-issued birth certificate
    C: An original birth certificate issued by the state
    D: A certified copy of a birth certificate by the issuing agency
  answer: B
  explanation: The manual explicitly states that the division requests a state-certified
    birth certificate and that 'hospital-issued, miniature, laminated, or photocopied
    certificates are not acceptable.'
- id: 70
  category: penalties_and_points
  question: What happens if a check used to pay for driver license services is returned
    by the bank?
  choices:
    A: The applicant's license is permanently revoked
    B: The applicant must pay a $20 service charge to keep their driving privilege
    C: The applicant must retake the written knowledge test
    D: The applicant will be charged a $50 administrative fee
  answer: B
  explanation: 'The manual states: ''If the bank returns your check, you must pay
    a $20 service charge to keep your driving privilege.'''
- id: 71
  category: driver_testing
  question: Under what conditions will a driving skills test NOT be provided?
  choices:
    A: If the applicant is over 65 years old
    B: If the vehicle has an automatic transmission
    C: If the vehicle has a broken windshield or no safety belts
    D: If the applicant is applying for a provisional license
  answer: C
  explanation: Driving skills tests will not be provided when conditions exist that
    could create unsafe driving, which includes vehicles that are not registered or
    are unsafe, such as having a broken windshield or no safety belts.
- id: 72
  category: license_system
  question: How many acceptable documents must an applicant provide as evidence of
    their Utah residence address to obtain a driver license certificate?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Obtaining a driver license certificate requires 'Two acceptable documents
    as evidence of your Utah residence address.'
- id: 73
  category: license_system
  question: What must accompany any name variation from your identity document when
    applying for a license?
  choices:
    A: A notarized letter from a family member
    B: A hospital-issued birth certificate
    C: Legal authorizing documentation such as a marriage certificate or divorce decree
    D: A utility bill showing the new name
  answer: C
  explanation: Any name variation from your identity document must be accompanied
    by legal authorizing documentation, which includes a state-certified marriage
    certificate, divorce decree, updated passport, etc.
- id: 74
  category: license_system
  question: Can a Driving Privilege Card (DPC) be used as valid identification or
    age verification?
  choices:
    A: Yes, it is equivalent to a regular Class D license for all purposes
    B: Yes, but only for age verification, not identification
    C: No, it may be used for driving purposes only
    D: No, unless accompanied by a temporary driver license
  answer: C
  explanation: 'The manual states regarding the DPC: ''The DPC may be used for driving
    purposes only; it is not valid identification or age verification.'''
- id: 75
  category: license_system
  question: If you have a change of address, you are required by law to notify the
    Driver License Division within how many days of moving?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: According to the manual, if you have a change of address, you are required
    by law to notify the division of the new address within 10 DAYS of moving.
- id: 76
  category: license_system
  question: Are drivers with an out-of-state learner permit allowed to drive in Utah?
  choices:
    A: Yes, if accompanied by a licensed driver over 21
    B: Yes, for up to 30 days
    C: No, they may NOT drive in Utah
    D: Yes, but only during daylight hours
  answer: C
  explanation: 'The manual explicitly states: "Drivers with an out-of-state learner
    permit may NOT drive in Utah."'
- id: 77
  category: license_system
  question: For an applicant over 21 years of age, an original Utah driver license
    will expire on their birthday how many years after issue?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: The driver license will expire on the applicant's birthday eight years
    after issue when over 21.
- id: 78
  category: license_system
  question: How long is a provisional license valid for an applicant under 21 years
    of age?
  choices:
    A: 3 years
    B: 4 years
    C: 5 years
    D: 8 years
  answer: C
  explanation: Provisional licenses (licenses issued to an applicant under 21 years
    of age) will expire on the applicant's birthday five years after issue.
- id: 79
  category: license_system
  question: When applying for a Utah driver license, how many documents must you provide
    to verify your Utah residency and mailing address?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: The manual states for Utah residency and mailing address verification,
    you "must provide two" documents.
- id: 80
  category: license_system
  question: Documents used to verify Utah residency and mailing address must be dated
    within how many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Utah residency and mailing address verification documents must display
    your name, address, and be dated within 90 days.
- id: 81
  category: license_system
  question: What additional requirement is necessary for an original Driving Privilege
    Card (DPC) application?
  choices:
    A: A letter of recommendation from an employer
    B: A fingerprint card and photo in a sealed envelope
    C: Proof of vehicle ownership
    D: A valid U.S. passport
  answer: B
  explanation: For an original Driving Privilege Card (DPC) application, a fingerprint
    card and photo placed in a sealed envelope at an approved agency is required.
- id: 82
  category: safe_driving_rules
  question: To be eligible for Utah's good driver program (online renewal), you must
    NOT have received more than how many reportable violations in the past eight years?
  choices:
    A: Two
    B: Four
    C: Six
    D: Eight
  answer: C
  explanation: If you have NOT received more than six reportable violations in the
    past eight years, and your driver license status is currently valid, you are eligible
    for Utah's good driver program.
- id: 83
  category: license_system
  question: Under Utah law, can an individual hold both a driver license certificate
    and an identification card at the same time?
  choices:
    A: Yes, if they pay an additional fee
    B: Yes, but only if one is a limited-term license
    C: No, Utah law does not allow it
    D: Yes, if they are over 21 years old
  answer: C
  explanation: Utah law does NOT allow an individual to have a driver license certificate
    and an identification card at the same time.
- id: 84
  category: driver_testing
  question: If you are under the age of 19 and applying for your first Utah driver
    license, what must you provide as proof of driving experience?
  choices:
    A: Evidence of completion of a driver education course
    B: A log of 50 hours of driving with a parent
    C: A letter from a high school principal
    D: Proof of vehicle insurance
  answer: A
  explanation: Proof of driving experience required for a first Utah driver license
    includes evidence of completion of a course in driver education if under the age
    of 19.
- id: 85
  category: license_system
  question: Military personnel stationed outside of Utah may continue to use their
    valid Utah driver license up to how many days after discharge?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Military personnel and dependents stationed outside of Utah may continue
    to use their driver license up to 90 days after discharge or termination of orders.
- id: 86
  category: license_system
  question: If you lose your Utah driver license and get a replacement, what will
    the expiration date of the replacement license be?
  choices:
    A: 8 years from the date of replacement
    B: 5 years from the date of replacement
    C: The same date as the license it replaces
    D: One year from the date of replacement
  answer: C
  explanation: The expiration date of a replacement driver license will be the same
    date as the license it replaces.
- id: 87
  category: license_system
  question: Which of the following is NOT an acceptable document for identity and
    lawful status verification when applying for a regular Class D driver license?
  choices:
    A: A valid, unexpired U.S. passport
    B: A small laminated hospital birth certificate
    C: A Certificate of Naturalization
    D: A valid Permanent Resident Card
  answer: B
  explanation: The manual specifies that small laminated birth certificates or hospital
    certificates are not accepted for identity and lawful status verification.
- id: 88
  category: license_system
  question: How early can you renew your regular Utah driver license before its expiration
    date?
  choices:
    A: Up to 30 days before expiration
    B: Up to 90 days before expiration
    C: Up to six months before expiration
    D: Up to one year before expiration
  answer: C
  explanation: You may renew your driver license up to six months before the expiration
    of the license.
- id: 89
  category: driver_testing
  question: What is the minimum vision requirement to pass the Utah driver's vision
    test?
  choices:
    A: 20/20 vision and peripheral fields of 120° in both eyes.
    B: 20/40 vision and peripheral fields of 90° in at least one eye.
    C: 20/30 vision and peripheral fields of 70° in at least one eye.
    D: 20/50 vision and peripheral fields of 100° in both eyes.
  answer: B
  explanation: The division requires 20/40 vision and peripheral fields (side vision)
    of 90° in at least one eye to pass the vision test.
- id: 90
  category: driver_testing
  question: At what age is a driver required to pass a vision test with every license
    application?
  choices:
    A: 55 and older
    B: 60 and older
    C: 65 and older
    D: 70 and older
  answer: C
  explanation: Everyone age 65 and older is required to pass a vision test with every
    license application.
- id: 91
  category: alcohol_drugs_health
  question: If a person has a health condition that may affect their ability to drive
    safely, who is responsible for reporting it to the Driver License Division?
  choices:
    A: The individual driver
    B: The individual's physician
    C: The individual's insurance company
    D: The Driver License Medical Advisory Board
  answer: A
  explanation: If a person has a health condition that may affect their ability to
    drive a vehicle safely, they are responsible for reporting it to the Driver License
    Division.
- id: 92
  category: alcohol_drugs_health
  question: What authority does a physician have regarding a patient's driving privileges
    in Utah?
  choices:
    A: A physician can suspend a driver's license immediately.
    B: A physician can restrict a patient's driving to daylight hours only.
    C: A physician does not have the authority to restrict anyone's driving but must
      report accurately on their health status.
    D: A physician can confiscate a patient's driver license if they deem them unsafe.
  answer: C
  explanation: A physician does not have the authority to restrict anyone’s driving
    but is responsible for reporting accurately about a patient’s health status.
- id: 93
  category: defensive_driving
  question: Which of the following is listed as a behavior that often provides a hint
    about a driver's mental health being a concern for safe driving?
  choices:
    A: Listening to the radio while driving.
    B: Leaving a few minutes early for a destination.
    C: Tending to be excessively confused or frustrated when traffic becomes heavy.
    D: Taking a walk before driving.
  answer: C
  explanation: Tending to be excessively confused or frustrated when traffic becomes
    heavy is a form of behavior that often provides hints about our mental health
    and driving safety.
- id: 94
  category: license_system
  question: Under what condition is a driver's license withdrawn after a review examination?
  choices:
    A: If the driver needs to wear glasses while driving.
    B: Only when the division determines the driver cannot operate a vehicle safely
      under any conditions.
    C: If the driver is over the age of 65.
    D: Whenever a medical professional requests the review.
  answer: B
  explanation: Only when the division determines that a driver cannot operate a vehicle
    safely under any conditions is the driver license withdrawn.
- id: 95
  category: driver_testing
  question: What is the minimum passing score for the written knowledge test in Utah?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 100%
  answer: C
  explanation: The written knowledge test is not timed, but it generally takes 30
    to 45 minutes to finish, and you must pass with a score of 80% or better.
- id: 96
  category: driver_testing
  question: How many attempts to pass the written knowledge test does one fee cover
    within a 12-month period?
  choices:
    A: One
    B: Two
    C: Three
    D: Unlimited
  answer: C
  explanation: The fee allows for not more than three attempts to pass the written
    knowledge test within 12 months.
- id: 97
  category: driver_testing
  question: What score must a first-time driver license applicant achieve on the Traffic
    Safety and Trends Exam?
  choices:
    A: 80%
    B: 85%
    C: 90%
    D: 100%
  answer: D
  explanation: All first-time driver license applicants will be required to pass an
    additional test and receive 100% to obtain their first-time regular Class D driver
    license.
- id: 98
  category: safe_driving_rules
  question: What topic makes up 50% of the questions on the Traffic Safety and Trends
    Exam?
  choices:
    A: Parallel parking techniques
    B: Significant causes of traffic-related deaths
    C: The effects of aging on peripheral vision
    D: Proper vehicle maintenance and registration
  answer: B
  explanation: 50% of the questions will relate to significant causes of traffic-related
    deaths as identified in statistics published by the Utah Highway Safety Office.
- id: 99
  category: driver_testing
  question: What is the minimum age required to take a driving skills test directly
    at the Driver License Division (DLD)?
  choices:
    A: 15 years of age
    B: 15 and a half years of age
    C: 16 years of age
    D: 18 years of age
  answer: C
  explanation: You must be at least 16 years of age to take a driving skills test
    at the DLD.
- id: 100
  category: driver_testing
  question: How old must you be to take a driving skills test with a Third-Party Tester
    or high school?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 17 years of age
  answer: B
  explanation: You must be at least 15 years of age to take a driving skills test
    with a Third-Party Tester or high school.
- id: 101
  category: driver_testing
  question: Who is allowed in the vehicle during the driving skills test?
  choices:
    A: The applicant, the examiner, and one parent or guardian.
    B: The applicant, the examiner, and a state-certified driving instructor.
    C: Only the applicant and the examiner.
    D: The applicant and up to two passengers.
  answer: C
  explanation: The applicant and the examiner are the only occupants allowed in the
    vehicle during the driving skills test.
- id: 102
  category: vehicle_information
  question: Why might a vehicle be rejected for the driving skills test?
  choices:
    A: If it is not a dual-control vehicle.
    B: If its condition could cause harm to the examiner's person or clothes.
    C: If it is more than 10 years old.
    D: If it does not have a backup camera.
  answer: B
  explanation: The vehicle may be rejected if its condition could cause harm to the
    examiner’s person or clothes.
- id: 103
  category: driver_testing
  question: What happens if you fail the driving skills test three times?
  choices:
    A: You must wait six months before trying again.
    B: You will be required to pay another fee.
    C: You must retake the written knowledge test.
    D: You are permanently disqualified from getting a license.
  answer: B
  explanation: The failure to pass the driving skills test in three attempts will
    result in paying another fee.
- id: 104
  category: driver_testing
  question: How long do you have to complete all tests from the day you pay your fee?
  choices:
    A: 30 days
    B: 90 days
    C: Six months
    D: One year
  answer: C
  explanation: All tests must be completed within six months from the day you pay
    your fee.
- id: 105
  category: driver_testing
  question: When arriving for your driving skills test, the accompanying person must
    be a properly licensed driver who is at least what age (if they are not your parent,
    guardian, or spouse)?
  choices:
    A: 18 years of age
    B: 21 years of age
    C: 25 years of age
    D: 30 years of age
  answer: B
  explanation: You must present the valid driver license of the person who is at least
    21 years of age (or a parent, guardian, or spouse who is at least 18) accompanying
    you to the Driver License Office.
- id: 106
  category: vehicle_information
  question: Which of the following is a requirement for the vehicle you provide for
    the driving skills test?
  choices:
    A: It must have a backup camera.
    B: It must have two outside mirrors on both the left and right sides.
    C: It must have a driver's side window that rolls down.
    D: It must be less than 10 years old.
  answer: C
  explanation: To avoid having to reschedule your driving skills test, please ensure
    that your vehicle has a driver's side window that rolls down.
- id: 107
  category: driver_testing
  question: Which action will result in an automatic failure on your driving skills
    test?
  choices:
    A: Asking the examiner a question before the test begins.
    B: Using the push-and-pull method for steering.
    C: Putting the vehicle over sidewalks or curbs unnecessarily.
    D: Checking your mirrors frequently.
  answer: C
  explanation: Putting the vehicle over sidewalks or curbs unnecessarily is listed
    under Dangerous Actions/Automatic Failures.
- id: 108
  category: safe_driving_rules
  question: What following distance rule does the manual recommend for safe driving
    in normal conditions?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The three-second rule
    D: The four-second rule
  answer: B
  explanation: The manual advises to follow at a safe distance and to use the two-second
    rule.
- id: 109
  category: vehicle_information
  question: How much space should you leave between your chest and the steering wheel
    when adjusting your seat?
  choices:
    A: 5 inches
    B: 10 inches
    C: 12 inches
    D: 15 inches
  answer: B
  explanation: You should leave 10 inches between your chest and the steering wheel.
- id: 110
  category: vehicle_information
  question: Where should the top of the steering wheel be positioned when you adjust
    your seat?
  choices:
    A: Above your chin level
    B: No higher than your shoulders
    C: Level with your eyes
    D: Resting on your lap
  answer: B
  explanation: The top of the steering wheel should be no higher than your shoulders.
    It should be below chin level.
- id: 111
  category: vehicle_information
  question: How should you position your head to properly adjust the left side mirror?
  choices:
    A: Lean to the right so your head is below the rearview mirror.
    B: Rest your head against the closed left window.
    C: Sit up perfectly straight and look forward.
    D: Turn your head to look over your right shoulder.
  answer: B
  explanation: To set the left side mirror, rest your head against the closed left
    window. Set the mirror so you can barely see the rear left edge of your vehicle.
- id: 112
  category: safe_driving_rules
  question: Where should the lap belt fit when wearing a safety belt correctly?
  choices:
    A: Across your stomach
    B: Across your hips
    C: Under your arm
    D: Across your thighs
  answer: B
  explanation: The lap belt should fit across the hips, not your stomach.
- id: 113
  category: safe_driving_rules
  question: 'According to the manual, children must be properly restrained in a car
    or booster seat if they are:'
  choices:
    A: Five years of age and younger
    B: Six years of age and younger
    C: Eight years of age and younger
    D: Ten years of age and younger
  answer: C
  explanation: Children ages eight and younger must be properly restrained in a car
    or booster seat.
- id: 114
  category: safe_driving_rules
  question: How much greater are your chances of being killed in a crash if you are
    thrown from a car?
  choices:
    A: 5 times greater
    B: 10 times greater
    C: 15 times greater
    D: 23 times greater
  answer: D
  explanation: Your chances of being killed are 23 times greater if you are thrown
    from a car.
- id: 115
  category: safe_driving_rules
  question: What should you do if your view is blocked at a crosswalk when stopping?
  choices:
    A: Honk your horn and proceed quickly.
    B: Move forward carefully and look both ways before entering the intersection.
    C: Back up until you have a clear view.
    D: Wait for another vehicle to enter the intersection first.
  answer: B
  explanation: If your view is blocked at a crosswalk, move forward carefully and
    look both ways before entering the intersection.
- id: 116
  category: driver_testing
  question: Which of the following is true regarding third-party testers?
  choices:
    A: They administer the written knowledge test only.
    B: Their testing fees are included in the licensing fees collected by the division.
    C: They are certified and licensed as commercial driver education instructors.
    D: They are not allowed to administer driving skills tests.
  answer: C
  explanation: Third-party testers are certified and licensed as commercial driver
    education instructors by the division and can administer the driving skills test.
- id: 117
  category: safe_driving_rules
  question: If you weigh 150 pounds and crash while traveling 30 mph, how much force
    is exerted on your body?
  choices:
    A: 1,500 pounds
    B: 3,000 pounds
    C: 4,500 pounds
    D: 6,000 pounds
  answer: C
  explanation: In a crash, the forces exerted on your body equal your weight multiplied
    by the car's speed. For example, if you weigh 150 pounds and crash while traveling
    30 mph, there would be 4,500 pounds of force on your body.
- id: 118
  category: penalties_and_points
  question: How can a driver have a safety belt citation fine waived in Utah?
  choices:
    A: By paying a reduced fee at the courthouse
    B: By completing an online, 30-minute safety belt safety course
    C: By purchasing a new child safety seat
    D: By performing 10 hours of community service
  answer: B
  explanation: If you or anyone in your vehicle isn't properly restrained, you can
    be issued a citation. The fine may be waived upon completing an online, 30-minute
    safety belt safety course.
- id: 119
  category: safe_driving_rules
  question: Until what age and weight must children be kept in a rear-facing car seat
    in the back seat, if the car seat allows?
  choices:
    A: At least one year of age and 20 pounds
    B: At least two years of age and 30 pounds
    C: At least three years of age and 35 pounds
    D: At least four years of age and 40 pounds
  answer: B
  explanation: Children must be rear-facing in the back seat until at least two years
    of age and 30 pounds or longer if the car seat allows.
- id: 120
  category: safe_driving_rules
  question: At what height is a child aged eight and under exempt from needing an
    approved child safety seat?
  choices:
    A: 48 inches tall
    B: 50 inches tall
    C: 54 inches tall
    D: 57 inches tall
  answer: D
  explanation: All children aged eight and under must be properly secured in an approved
    child safety seat unless they are 57 inches tall.
- id: 121
  category: driver_responsibility
  question: It is an infraction to be stopped for smoking in a vehicle while transporting
    children of what age?
  choices:
    A: 12 years of age or younger
    B: 15 years of age or younger
    C: 16 years of age or younger
    D: 18 years of age or younger
  answer: B
  explanation: It is an infraction to be stopped for smoking in a vehicle while transporting
    children 15 years of age or younger.
- id: 122
  category: vehicle_information
  question: At what speed can an air bag come out of the dashboard during a deployment?
  choices:
    A: Up to 100 mph
    B: Up to 150 mph
    C: Up to 200 mph
    D: Up to 250 mph
  answer: C
  explanation: To do its important job, an air bag comes out of the dashboard at up
    to 200 mph—faster than the blink of an eye.
- id: 123
  category: penalties_and_points
  question: What is the penalty for removing or modifying your vehicle's air bag passive
    restraint system to render it inoperable?
  choices:
    A: An infraction
    B: A Class C misdemeanor
    C: A Class B misdemeanor
    D: A Class A misdemeanor
  answer: C
  explanation: It is a Class B misdemeanor if you remove, fail to have repaired, or
    modify your vehicle's air bag passive restraint system to render the air bag inoperable.
- id: 124
  category: safe_driving_rules
  question: When backing up your motor vehicle, where should you place your right
    arm?
  choices:
    A: On the steering wheel next to your left hand
    B: On the center console
    C: Out the passenger window
    D: On the back of the seat
  answer: D
  explanation: When backing, you should grasp the steering wheel with your left hand,
    put your right arm on the back of the seat, and look through the rear window.
- id: 125
  category: safe_driving_rules
  question: How long must you use your turn signal before making a lane change?
  choices:
    A: For at least two seconds
    B: For at least three seconds
    C: For at least four seconds
    D: For at least five seconds
  answer: A
  explanation: When making a lane change, you must signal for at least two seconds
    in the direction you intend to move.
- id: 126
  category: safe_driving_rules
  question: When completing a left turn on a multiple-lane road, which lane should
    your vehicle finish the turn in?
  choices:
    A: The right-most lane
    B: The center lane
    C: The left-most lane directly to the right of the centerline
    D: Any available lane
  answer: C
  explanation: Complete a turn in the proper lane on a multiple-lane road (vehicle
    should finish a left turn in the left-most lane, the one directly to the right
    of the centerline).
- id: 127
  category: sharing_the_road
  question: What is the 'gore area' on a highway?
  choices:
    A: The shoulder area used for emergency parking
    B: The area between the solid white lines of a traffic lane and an entering/exiting
      lane
    C: The designated lane for high-occupancy vehicles
    D: The construction zone where the speed limit is reduced
  answer: B
  explanation: The gore area is between the solid white lines of a lane of traffic
    and a lane used to either enter or exit from that traffic lane. It is against
    the law to cross over or drive in it.
- id: 128
  category: defensive_driving
  question: What is the recommended 'Zipper Method' when merging at a congested point,
    such as a construction zone?
  choices:
    A: Merge as early as possible into the continuing lane
    B: Stop in your lane until a gap opens up
    C: Use both lanes until the merge point, then alternate yielding right-of-way
    D: Speed up to pass the congestion on the shoulder
  answer: C
  explanation: The ZIPPER METHOD is the idea of alternating when merging at a congested
    merge point. Use both lanes of traffic until the vehicles reach the merge point,
    and once the vehicles reach the merge point, alternate.
- id: 129
  category: safe_driving_rules
  question: When stopping your vehicle behind another vehicle at an intersection,
    how much space should you leave?
  choices:
    A: Enough space to see the rear wheels of the vehicle in front of you
    B: Exactly one car length
    C: At least 10 feet of space
    D: Enough space to see the driver's head in their rearview mirror
  answer: A
  explanation: When stopping behind another vehicle, ensure you can see the rear wheels
    of the vehicle in front of you.
- id: 130
  category: safe_driving_rules
  question: Where should infants ride if a vehicle has a passenger-side air bag?
  choices:
    A: In the front seat facing forward
    B: In the front seat facing backward
    C: In the rear seat
    D: In the front seat with the seat pushed all the way back
  answer: C
  explanation: Infants should never ride in the front seat of a vehicle with a passenger-side
    air bag. They must ride buckled up in a rear seat.
- id: 131
  category: safe_driving_rules
  question: How close must the back wheel of your car be to the curb when parked?
  choices:
    A: No further than 6 inches away
    B: No further than 12 inches away
    C: No further than 18 inches away
    D: No further than 24 inches away
  answer: B
  explanation: The manual states, 'If parking next to a curb, the back wheel of your
    car must be no further than 12 inches away from the curb.'
- id: 132
  category: safe_driving_rules
  question: In the interest of public safety, you are not allowed to park within how
    many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: According to the manual, you are not allowed to park 'Within 15 feet
    of a fire hydrant.'
- id: 133
  category: safe_driving_rules
  question: When parking uphill next to a curb, which direction should you turn your
    steering wheel?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Straight ahead
    D: To the right
  answer: B
  explanation: To uphill park, the manual instructs to 'Turn your wheel away from
    the curb while ensuring vehicle’s front tire touches the curb to secure the vehicle’s
    position.'
- id: 134
  category: safe_driving_rules
  question: When parking uphill on a road without a curb, how should you turn your
    wheels?
  choices:
    A: To the right
    B: To the left
    C: Straight ahead
    D: Away from the edge of the road
  answer: A
  explanation: The manual specifies that when uphill parking, 'without a curb turn
    the wheel to the right.'
- id: 135
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to return to your original
    lane?
  choices:
    A: As soon as your rear bumper clears the other vehicle's front bumper
    B: When you can see the passed vehicle in your rearview mirror
    C: When you are 50 feet ahead of the passed vehicle
    D: Immediately after checking your blind spot
  answer: B
  explanation: When passing, you must 'Wait until you can see the passed vehicles
    in your rearview mirror' before signaling and returning to the lane.
- id: 136
  category: safe_driving_rules
  question: When passing on a multi-lane road, you must return to the right-hand lane
    no less than how many feet from oncoming vehicles?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: The manual states you must 'Return to the right-hand lane no less than
    200 feet from oncoming vehicles.'
- id: 137
  category: sharing_the_road
  question: What is the rule regarding passing three or more snowplows operating in
    echelon formation?
  choices:
    A: You may pass them on the left side only.
    B: You may pass them on the right side only.
    C: You may not pass or overtake them on either side.
    D: You may pass them if you honk your horn first.
  answer: C
  explanation: The manual states, 'If three or more snowplows operate in echelon formation,
    an individual operating a vehicle may not pass or overtake the snowplows on either
    side.'
- id: 138
  category: safe_driving_rules
  question: How long must you signal before beginning any lane change or turn?
  choices:
    A: For one second
    B: For two seconds
    C: For three seconds
    D: For five seconds
  answer: B
  explanation: Signals are required 'For two seconds before turning' and 'For two
    seconds before beginning any lane change.'
- id: 139
  category: vehicle_information
  question: Which steering method is recommended when steering is critical, such as
    when parking, performing sharp right turns, or correcting a skid?
  choices:
    A: Pull-push steering
    B: One-handed steering
    C: Hand-over-hand steering
    D: Palm steering
  answer: C
  explanation: The manual advises to 'Use hand-over-hand steering when steering is
    critical, such as when parking, performing sharp right turns, or correcting a
    skid.'
- id: 140
  category: safe_driving_rules
  question: Where should your thumbs be placed while gripping the steering wheel?
  choices:
    A: Tucked inside the wheel
    B: Up along the face of the steering wheel
    C: Wrapped tightly around the back of the wheel
    D: Resting on the horn pad
  answer: B
  explanation: The manual instructs drivers to 'Keep your thumbs up along the face
    of the steering wheel. Never hold the inside of the wheel.'
- id: 141
  category: signs_and_signals
  question: When stopping at a railroad crossing controlled by flashing signals or
    gates, how far away from the nearest rail must you stop?
  choices:
    A: Between 5 and 10 feet
    B: Between 10 and 20 feet
    C: Between 15 and 50 feet
    D: Between 50 and 100 feet
  answer: C
  explanation: At railroad crossings, you must 'Stop more than 15 feet (but not more
    than 50 feet) away from the nearest rail until it is safe to continue.'
- id: 142
  category: signs_and_signals
  question: You are not allowed to park within how many feet of any flashing beacon,
    stop sign, yield sign, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: The manual lists places where you are not allowed to park, including
    'Within 30 feet of any flashing beacon, stop sign, yield sign, or traffic control
    signal.'
- id: 143
  category: defensive_driving
  question: What should you do if you are being passed by another vehicle?
  choices:
    A: Speed up to prevent them from passing.
    B: Move onto the shoulder to give them more room.
    C: Stay in your lane and keep your speed steady.
    D: Brake sharply to let them pass quickly.
  answer: C
  explanation: The manual states, 'If you are being passed, stay in your lane and
    keep your speed steady to allow the driver to pass.'
- id: 144
  category: safe_driving_rules
  question: When is it permissible to park on the shoulder of an interstate highway?
  choices:
    A: When you need to take a nap.
    B: When you want to check your phone.
    C: Only if your vehicle breaks down or you are in physical distress.
    D: Whenever there are no 'No Parking' signs posted.
  answer: C
  explanation: You may not park 'On the shoulder of any interstate highway—these areas
    may be used only if your vehicle breaks down or you are in physical distress.'
- id: 145
  category: signs_and_signals
  question: Which of the following is true regarding stopping at a stop sign?
  choices:
    A: A rolling stop is adequate if no other cars are present.
    B: You must come to a complete stop.
    C: You only need to slow down to 5 mph.
    D: You must stop only if pedestrians are waiting to cross.
  answer: B
  explanation: 'The manual states, ''Come to a complete stop at traffic signs and
    signals. Many people seem to feel that a rolling stop is adequate when required
    to stop. The following situations are times when you must make a complete stop:
    ... All stop signs.'''
- id: 146
  category: safe_driving_rules
  question: When stopping at a railroad crossing, what is the required distance you
    must stop away from the nearest rail?
  choices:
    A: More than 10 feet but not more than 40 feet
    B: More than 15 feet but not more than 50 feet
    C: Exactly 15 feet
    D: At least 50 feet
  answer: B
  explanation: The manual states you must stop more than 15 feet (but not more than
    50 feet) away from the nearest rail until it is safe to continue.
- id: 147
  category: sharing_the_road
  question: If you are traveling on a two-lane roadway and a school bus displays alternating
    flashing red lights, who is required to stop?
  choices:
    A: Only traffic behind the bus
    B: Only traffic in the opposite direction
    C: Traffic in both directions
    D: No one is required to stop if they slow down to 15 mph
  answer: C
  explanation: According to the manual, when traveling on a two-lane roadway, traffic
    in both directions must stop for a school bus displaying alternating flashing
    red lights.
- id: 148
  category: sharing_the_road
  question: When a school bus is stopped with flashing red lights on a highway with
    five or more lanes and a shared center turn lane, which vehicles must stop?
  choices:
    A: Traffic in both directions
    B: Only vehicles in both lanes behind the school bus
    C: Only vehicles traveling in the opposite direction
    D: Vehicles in the shared center turn lane only
  answer: B
  explanation: On a highway with five or more lanes and a shared center turn lane,
    it is only required for the vehicles in both lanes behind the school bus to come
    to a complete stop.
- id: 149
  category: penalties_and_points
  question: What is the maximum fine for a conviction of illegally passing a school
    bus?
  choices:
    A: $500
    B: $1000
    C: $2000
    D: $3000
  answer: D
  explanation: The manual states that fines for improperly passing a school bus can
    run up to $3000, and a conviction usually means an increase in insurance rates.
- id: 150
  category: defensive_driving
  question: When stopping behind another vehicle at an intersection, what is considered
    a safe gap?
  choices:
    A: Stopping where you can see the vehicle's rear tires ahead of you
    B: Stopping at least one car length behind the vehicle
    C: Stopping where you can see the vehicle's rear bumper
    D: Stopping three feet behind the vehicle
  answer: A
  explanation: A safe gap when stopping behind another vehicle is to stop where you
    can see the vehicle's rear tires ahead of you.
- id: 151
  category: safe_driving_rules
  question: How long should you signal before making a right or left turn?
  choices:
    A: For three seconds
    B: For two seconds
    C: For at least 100 feet
    D: For five seconds
  answer: B
  explanation: The manual instructs drivers to signal right or left for two seconds
    before making a turn.
- id: 152
  category: safe_driving_rules
  question: You must never make a U-turn on any curve near the top of a hill where
    you cannot see or be seen from both directions for what distance?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: Never make a U-turn on any curve near the top of a hill where you cannot
    see or be seen from both directions for 500 feet.
- id: 153
  category: signs_and_signals
  question: What does a red X signal above a flex lane indicate?
  choices:
    A: You can use the lane
    B: You cannot use the lane
    C: The lane is ending in 500 feet
    D: The lane is for high-occupancy vehicles only
  answer: B
  explanation: In a flex lane, a green arrow means you can use the lane, and a red
    X means you cannot use the lane.
- id: 154
  category: safe_driving_rules
  question: Which of the following is true regarding the emergency lane on a freeway?
  choices:
    A: You may use it to pass slow-moving traffic
    B: You may use it to stop and pick up passengers
    C: It is located on the inside of the dashed white line
    D: It is illegal to pass another vehicle or pick up passengers in this lane
  answer: D
  explanation: The area of the freeway on the outside of the solid white line is for
    emergency use only. Passing another vehicle or stopping to pick up passengers
    in this lane is illegal.
- id: 155
  category: sharing_the_road
  question: On a multi-lane highway, what must a vehicle traveling in the left lane
    do when approached from behind by another vehicle?
  choices:
    A: Maintain speed and stay in the lane
    B: Move safely to the right to prevent impeding traffic
    C: Speed up to match the vehicle behind
    D: Turn on hazard lights
  answer: B
  explanation: A vehicle traveling in the left lane must move safely to the right
    when approached from behind to prevent impeding traffic.
- id: 156
  category: safe_driving_rules
  question: When is it legal to move in and out of the carpool (express) lane on I-15?
  choices:
    A: Anytime there is a safe gap in traffic
    B: Only across the double white line
    C: Only at specific access points with white dotted striping
    D: Only when your vehicle has a C decal
  answer: C
  explanation: Moving in and out of the carpool lane is not allowed except in specific
    locations (called access points) with white dotted striping rather than solid
    lines.
- id: 157
  category: sharing_the_road
  question: What should you do if you are in the express lane and are being followed
    by an emergency vehicle with flashing lights?
  choices:
    A: Stop immediately in the express lane
    B: Accelerate to get out of the emergency vehicle's way
    C: Make a right-hand lane change out of the express lane when safe to do so
    D: Move to the left shoulder
  answer: C
  explanation: When being followed by an emergency or police vehicle with flashing
    lights, it is permissible, when safe to do so, to make a right-hand lane change
    out of the express lane.
- id: 158
  category: safe_driving_rules
  question: When is it appropriate to use a three-point turn?
  choices:
    A: On a freeway when you miss your exit
    B: Only if the road is too narrow for a U-turn on a two-lane road
    C: At any intersection with a stop sign
    D: On a divided highway with four or more lanes
  answer: B
  explanation: A three-point turn should be used only if the road is too narrow for
    a U-turn, and it should only be used on a two-lane road.
- id: 159
  category: safe_driving_rules
  question: When performing a reverse two-point turn, how far past the driveway or
    alley should you drive before backing in?
  choices:
    A: One car length
    B: Two car lengths
    C: 10 feet
    D: 50 feet
  answer: A
  explanation: The manual states that for a reverse two-point turn, you should drive
    one car length past the driveway or alley before backing into it.
- id: 160
  category: vehicle_information
  question: What is the purpose of a C decal on a vehicle?
  choices:
    A: It allows commercial vehicles to use the express lane
    B: It allows single-occupant clean fuel vehicles to use the express lanes without
      paying a toll
    C: It indicates the vehicle is a carpool vehicle with two or more passengers
    D: It permits the vehicle to park in handicapped spaces
  answer: B
  explanation: C decals allow limited single-occupant clean fuel vehicles to use the
    express lanes without paying a toll after a one-time $10 registration fee.
- id: 161
  category: vehicle_information
  question: Where must a C decal be placed on a qualifying clean fuel vehicle?
  choices:
    A: On the rear license plate
    B: Inside the windshield to the left of the steering wheel
    C: Inside the windshield to the right of the rearview mirror
    D: On the driver's side window
  answer: C
  explanation: According to the manual, C decals are small stickers placed inside
    the windshield to the right of the rearview mirror.
- id: 162
  category: safe_driving_rules
  question: What is the proper way to use an acceleration lane when entering a multi-lane
    highway?
  choices:
    A: To come to a complete stop and wait for a gap in traffic
    B: To match your speed with other vehicles before pulling onto the roadway
    C: To pass slower vehicles that are already on the highway
    D: To bypass ramp meters during heavy traffic
  answer: B
  explanation: When on a multi-lane highway, you should use the acceleration lane
    to match your speed with other vehicles before pulling onto the roadway.
- id: 163
  category: signs_and_signals
  question: How many vehicles are typically allowed to pass each time a ramp meter
    light turns green?
  choices:
    A: One vehicle
    B: Two vehicles
    C: Three vehicles
    D: As many as can pass before the light turns red
  answer: A
  explanation: Ramp meters are placed on freeway on-ramps and allow only one (unless
    posted differently) vehicle to pass each time the green light comes on.
- id: 164
  category: safe_driving_rules
  question: When are you permitted to stop or park on a runaway vehicle ramp?
  choices:
    A: When you need to check your GPS or map
    B: When your vehicle is overheating and needs to cool down
    C: Only during daylight hours when visibility is clear
    D: Under no circumstances, unless you are in an emergency requiring its use to
      stop
  answer: D
  explanation: You may NOT use a runaway vehicle ramp unless you are in an emergency
    requiring the use of the ramp to stop your vehicle. You are prohibited from stopping,
    standing, or parking on or in the pathway of a runaway vehicle ramp.
- id: 165
  category: safe_driving_rules
  question: Is it legal to make a U-turn from the off-ramp at a single-point urban
    interchange to re-enter the freeway?
  choices:
    A: No, U-turns are strictly prohibited at all single-point urban interchanges
    B: Yes, as long as you face a green arrow when you begin the maneuver
    C: Yes, but only if the traffic light is flashing red
    D: No, unless directed to do so by a police officer
  answer: B
  explanation: It is legal to make a U-turn from the off-ramp at a single-point urban
    interchange and re-enter the freeway as long as you face a green arrow when you
    begin the maneuver.
- id: 166
  category: safe_driving_rules
  question: How should drivers handle a single-point urban interchange if a power
    outage occurs and there is no battery backup?
  choices:
    A: Treat the intersection as a standard four-way stop
    B: Freeway traffic must yield to all exiting vehicles
    C: Proceed with extreme caution; it is not handled like a four-way stop
    D: Only make right turns until power is restored
  answer: C
  explanation: If a power outage occurs, the single-point urban interchange is not
    handled like a four-way stop. It is important to proceed with extreme caution
    and courtesy until an officer is dispatched.
- id: 167
  category: defensive_driving
  question: Before moving after a stop at an intersection, in which order should you
    check for traffic and bicyclists?
  choices:
    A: Right, left, and then right again
    B: Left, right, and then left again
    C: Straight ahead, then in your rearview mirror
    D: Left, straight ahead, and then right
  answer: B
  explanation: Before moving after a stop, check for traffic and bicyclists. Look
    left, right, and then left again before entering the intersection.
- id: 168
  category: safe_driving_rules
  question: What is the rule regarding lane changes while driving through an intersection?
  choices:
    A: You may change lanes if you use your turn signal
    B: You should change lanes to avoid slow-moving vehicles
    C: You may change lanes only if there are no pedestrians present
    D: Do not change lanes while proceeding through the intersection
  answer: D
  explanation: When driving through an intersection, keep both hands on the wheel,
    slow down, and yield to any pedestrians or traffic. Do not change lanes while
    proceeding through the intersection.
- id: 169
  category: signs_and_signals
  question: How are right turns on a red light handled in a continuous flow intersection?
  choices:
    A: They are treated exactly like traditional right-on-red turns
    B: Free-right turns during a red light are restricted
    C: They are always permitted without stopping
    D: You must wait for a flashing yellow arrow to turn right
  answer: B
  explanation: Free-right turns during a red light are restricted in this continuous
    flow intersection, along with a traditional right-on-red. Motorists should watch
    for traffic control signs.
- id: 170
  category: safe_driving_rules
  question: What is a unique characteristic of a diverging diamond intersection?
  choices:
    A: It requires traffic to briefly drive on the opposite side of the road
    B: It uses a large roundabout instead of traffic lights
    C: It eliminates all right-turn conflicts
    D: It requires all vehicles to make a U-turn to enter the freeway
  answer: A
  explanation: A diverging diamond intersection requires traffic on the freeway overpass
    (or underpass) to briefly drive on the opposite side of the road from what they
    are accustomed to.
- id: 171
  category: safe_driving_rules
  question: How does a motorist complete a left turn maneuver at a Thru-Uturn intersection?
  choices:
    A: By turning left directly from the center lane
    B: By using a designated left-turn overpass bridge
    C: By traveling through the intersection, making a signalized U-turn, and returning
      to make a right turn
    D: By waiting for a flashing yellow arrow at the main intersection
  answer: C
  explanation: At a Thru-Uturn intersection, motorists travel through the intersection,
    make a signalized U-turn at a location removed from the intersection, and return
    to the intersection, where they will make a right turn.
- id: 172
  category: signs_and_signals
  question: What does a dashed yellow line on your side of the roadway indicate?
  choices:
    A: Passing is prohibited in both directions
    B: You are traveling on a one-direction roadway
    C: Passing is permitted
    D: You must merge into the right lane
  answer: C
  explanation: A dashed yellow line on your side of a two-direction roadway indicates
    that passing is permitted.
- id: 173
  category: signs_and_signals
  question: What does a solid white lane marking separating an express lane from general
    lanes indicate?
  choices:
    A: Passing is permitted
    B: Crossing is prohibited
    C: Two-way traffic is ahead
    D: The express lane is ending
  answer: B
  explanation: White lane markings separating an express lane or carpool lane from
    general lanes indicate a one direction roadway where crossing is prohibited.
- id: 174
  category: defensive_driving
  question: Why should you avoid turning into a lane just because an oncoming vehicle
    has its turn signal on?
  choices:
    A: Turn signals are often invisible in bright sunlight
    B: The driver may plan to turn after they pass you, or they may have forgotten
      to turn it off
    C: The oncoming vehicle always has the right-of-way to change their mind
    D: You must wait for a green arrow to make any turn
  answer: B
  explanation: Do not turn into a lane just because an oncoming vehicle has a turn
    signal on. The driver may plan to turn after they pass you, or they may have forgotten
    to turn their signal off.
- id: 175
  category: safe_driving_rules
  question: What does the basic speed law in Utah state?
  choices:
    A: You must always drive at the posted speed limit.
    B: You may never drive faster than is reasonably safe.
    C: You can drive up to 5 mph over the speed limit to keep up with traffic.
    D: You must drive at least 45 mph on all highways.
  answer: B
  explanation: In Utah, the basic speed law states that you may never drive faster
    than is reasonably safe.
- id: 176
  category: safe_driving_rules
  question: What is the permitted speed limit when passing a school building during
    school recess?
  choices:
    A: 15 miles per hour
    B: 20 miles per hour
    C: 25 miles per hour
    D: 35 miles per hour
  answer: B
  explanation: The permitted speed is 20 miles per hour when passing a school building
    or grounds during school recess.
- id: 177
  category: safe_driving_rules
  question: Unless posted otherwise, what is the speed limit in any business or residential
    area in Utah?
  choices:
    A: 20 miles per hour
    B: 25 miles per hour
    C: 30 miles per hour
    D: 35 miles per hour
  answer: B
  explanation: The permitted speed is 25 miles per hour in any business or residential
    area.
- id: 178
  category: safe_driving_rules
  question: What is the maximum distance you may travel in a shared center left turn
    lane before making your turn, assuming there are no other cars ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: When making a left turn from a shared turn lane, you may not enter
    the lane more than 500 feet before making the turn unless the last car is more
    than 500 feet from the intersection.
- id: 179
  category: signs_and_signals
  question: What does a flashing yellow arrow traffic light indicate?
  choices:
    A: Turns are permitted, but you must first yield to oncoming traffic and pedestrians.
    B: You have the right-of-way to turn and oncoming traffic has a red light.
    C: The traffic light is broken and you must treat it as a four-way stop.
    D: Turns are prohibited until the light turns green.
  answer: A
  explanation: A flashing yellow arrow light means turns are permitted, but first
    you must yield to oncoming traffic and pedestrians. Oncoming traffic has a green
    light.
- id: 180
  category: signs_and_signals
  question: What must you do if you approach an intersection where the traffic lights
    are not working?
  choices:
    A: Proceed through the intersection without stopping if the way is clear.
    B: Slow down to 15 mph and yield to the left.
    C: Come to a complete stop and yield the right-of-way to any vehicle on the right.
    D: Wait for a police officer to arrive before entering the intersection.
  answer: C
  explanation: If you approach an intersection where the traffic lights are not working,
    you must first come to a complete stop before entering the intersection and yield
    the right-of-way to any vehicle on the right unless otherwise directed by a peace
    officer.
- id: 181
  category: signs_and_signals
  question: If a traffic light is green but a police officer tells you to stop, what
    should you do?
  choices:
    A: Proceed cautiously because the green light gives you the right-of-way.
    B: Stop, because you must always obey the instructions of a police officer at
      an intersection.
    C: Honk your horn to alert the officer that you have a green light.
    D: Pull over to the side of the road and wait for the light to turn red.
  answer: B
  explanation: Regardless of what the traffic lights may indicate, always obey the
    instructions of a police officer at an intersection. If the light is green and
    an officer tells you to stop, YOU MUST STOP.
- id: 182
  category: signs_and_signals
  question: What is the purpose of green, brown, or blue square or rectangular signs?
  choices:
    A: They warn of possible danger ahead.
    B: They tell you about traffic directions, lane use, and speed limits.
    C: They advise you about intersecting roads, direct you to cities, and mark points
      of interest.
    D: They caution you to slow down for a railroad crossing.
  answer: C
  explanation: Guide signs are square or rectangular and are green, brown, or blue.
    They advise you about intersecting roads and direct you to cities and towns. They
    mark points of interest and help you find hospitals, service stations, restaurants,
    and hotels.
- id: 183
  category: signs_and_signals
  question: What shape and color are most warning signs that alert you to possible
    danger ahead?
  choices:
    A: Round and yellow with black lettering
    B: Diamond shaped and yellow with black lettering
    C: Square and white with red lettering
    D: Rectangular and green with white lettering
  answer: B
  explanation: Warning signs warn of possible danger ahead. They are usually diamond
    shaped and yellow with black lettering or symbols.
- id: 184
  category: safe_driving_rules
  question: Which of the following is a correct procedure when navigating a roundabout?
  choices:
    A: Speed up as you approach the roundabout to merge smoothly.
    B: Yield to oncoming traffic and pedestrians, entering when it is clear.
    C: Stop inside the roundabout to let other vehicles enter.
    D: Do not use your turn signal when exiting the roundabout.
  answer: B
  explanation: When navigating a roundabout, you must slow down as you approach, yield
    to oncoming traffic and pedestrians, enter when it is clear, and signal your intention
    to exit.
- id: 185
  category: signs_and_signals
  question: Under what condition may you make a left turn on a red arrow light?
  choices:
    A: You may never turn left on a red arrow light under any circumstances.
    B: If you have been stranded by the light, it is safe, and you are turning from
      a one-way street onto a one-way street.
    C: If there is no oncoming traffic and you are turning onto a two-way street.
    D: If you are in a shared center left turn lane.
  answer: B
  explanation: If, for some reason, the light does not change and you have been stranded
    by the red arrow light (left turn), and it is safe to do so, you may make a left
    turn from a one-way street onto a one-way street.
- id: 186
  category: safe_driving_rules
  question: What must you do if a pedestrian is entering an unmarked crosswalk at
    an intersection?
  choices:
    A: Proceed without stopping since the crosswalk is not marked.
    B: Honk to warn the pedestrian to wait for you to pass.
    C: Yield to the pedestrian, even if the crosswalk is not marked.
    D: Speed up to clear the intersection before the pedestrian crosses.
  answer: C
  explanation: You must yield to pedestrians entering or in a crosswalk, even if it
    is not marked.
- id: 187
  category: signs_and_signals
  question: If a traffic light is arranged horizontally, where is the red light located?
  choices:
    A: On the left
    B: In the middle
    C: On the right
    D: On the top
  answer: A
  explanation: If traffic lights are horizontal, the red light is on the left, the
    yellow light is in the middle, and the green light is on the right.
- id: 188
  category: safe_driving_rules
  question: What should you do if you must stop for traffic or a signal while approaching
    railroad tracks?
  choices:
    A: Stop directly on the tracks and wait for traffic to move.
    B: Wait at the stop line before the tracks until there is room to cross completely.
    C: Pull onto the tracks and reverse if a train approaches.
    D: Drive around the crossing gates to avoid the traffic jam.
  answer: B
  explanation: Do not stop on the railroad tracks. If you must stop for traffic or
    a signal, wait at the stop line before the tracks.
- id: 189
  category: penalties_and_points
  question: Can you receive a citation for driving too slowly in Utah?
  choices:
    A: No, driving slowly is always considered safe driving.
    B: No, citations are only issued for exceeding the speed limit.
    C: Yes, peace officers can issue a citation if you are impeding the normal flow
      of traffic.
    D: Yes, but only if you are driving under 10 miles per hour on an interstate.
  answer: C
  explanation: Do not drive so slowly that you become a source of danger on the road.
    Peace officers are allowed to issue you a citation if you are impeding the normal
    flow of traffic.
- id: 190
  category: signs_and_signals
  question: What color and shape are work zone warning signs?
  choices:
    A: Red and octagonal
    B: Orange and diamond or rectangular
    C: Yellow and circular
    D: White and rectangular
  answer: B
  explanation: Work zone signs are diamond or rectangular and orange with black letters
    or symbols. These signs warn you of work zones and people working on or near the
    road.
- id: 191
  category: penalties_and_points
  question: What happens to speeding fines when you are driving in a work zone?
  choices:
    A: They are waived if no workers are present.
    B: They are reduced by half.
    C: They remain the same as normal speeding fines.
    D: They are doubled.
  answer: D
  explanation: Slow down in work zones and be ready to stop quickly. Do not tailgate.
    Fines for speeding in a work zone are doubled.
- id: 192
  category: safe_driving_rules
  question: If you and another driver arrive at a four-way stop at the same time,
    who must you yield the right-of-way to?
  choices:
    A: The driver on your left
    B: The driver on your right
    C: The driver going the fastest
    D: The driver turning left
  answer: B
  explanation: You must yield the right-of-way to the driver on your right at a four-way
    stop if both of you arrive at the same time.
- id: 193
  category: safe_driving_rules
  question: When entering a public road from a private road or driveway, what must
    you do?
  choices:
    A: Yield the right-of-way to drivers already on the public road.
    B: Sound your horn and proceed into traffic.
    C: Accelerate quickly to merge without stopping.
    D: Expect other drivers to yield to you.
  answer: A
  explanation: You must yield the right-of-way to drivers on a public road if you
    are coming from a driveway or a private road.
- id: 194
  category: alcohol_drugs_health
  question: At what Blood Alcohol Content (BAC) is vision impacted for all drivers?
  choices:
    A: '0.02'
    B: '0.04'
    C: '0.05'
    D: '0.08'
  answer: A
  explanation: Vision is impacted at 0.02 blood alcohol content (BAC) for all drivers.
    The most important sense you use in driving is vision.
- id: 195
  category: alcohol_drugs_health
  question: Which types of drugs can impact your driving by affecting your reflexes,
    judgment, vision, and alertness?
  choices:
    A: Only illegal drugs
    B: Only prescribed drugs
    C: Illegal, over-the-counter, and prescribed drugs
    D: Only illegal and prescribed drugs
  answer: C
  explanation: Drugs can impact your driving and affect your reflexes, judgment, vision,
    and alertness, like alcohol. These can include illegal, over the counter, and
    prescribed drugs.
- id: 196
  category: penalties_and_points
  question: Under the Not-a-Drop Act, what is the penalty for a first offense if a
    driver under 21 has any measurable amount of alcohol in their body?
  choices:
    A: Driving privileges denied for 30 days
    B: Driving privileges denied for six months
    C: Driving privileges denied for one year
    D: A warning and a mandatory class
  answer: B
  explanation: The Not-a-Drop Act provides that a person under 21 years of age driving
    with any measurable amount of alcohol in their body will have all driving privileges
    denied for six months for a first offense.
- id: 197
  category: penalties_and_points
  question: If a 15-year-old is convicted in court for possession of alcohol, when
    will their driver license suspension begin and end?
  choices:
    A: It begins immediately and lasts for 6 months.
    B: It begins on the date of conviction and extends for one to two years from their
      16th birthday.
    C: It begins on their 18th birthday and lasts for one year.
    D: It begins on their 21st birthday.
  answer: B
  explanation: If the court orders suspension for a driver under the age of 16, the
    suspension time will begin on the date of conviction and extend for one to two
    years from the 16th birthday.
- id: 198
  category: alcohol_drugs_health
  question: What is the legal Blood Alcohol Content (BAC) limit for a regular driver
    over 21 in Utah before they are in violation of the law?
  choices:
    A: '0.02'
    B: '0.04'
    C: '0.05'
    D: '0.08'
  answer: C
  explanation: If you are over 0.05 BAC (0.04 for CDL), you violate the law.
- id: 199
  category: penalties_and_points
  question: For a driver 21 and older, how long will their driver license be suspended
    for a first DUI conviction?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: D
  explanation: On the first conviction of a DUI for a driver 21 and older, the driver
    license will be suspended for 120 days.
- id: 200
  category: penalties_and_points
  question: If a peace officer confiscates your Utah driver license upon a DUI arrest,
    when does the division suspend the license?
  choices:
    A: Immediately upon arrest
    B: Beginning on the 10th day after the arrest
    C: Beginning on the 30th day after the arrest
    D: Beginning on the 45th day after the date of arrest
  answer: D
  explanation: Utah law allows a peace officer to confiscate your Utah driver license
    upon arrest, and the division will suspend the license beginning on the 45th day
    after the date of arrest.
- id: 201
  category: alcohol_drugs_health
  question: What does Utah's implied consent law mean?
  choices:
    A: You consent to a vehicle search if stopped for speeding.
    B: You consent to submit to a chemical test of your breath, blood, urine, or oral
      fluids if asked by a peace officer.
    C: You consent to pay all traffic fines within 30 days.
    D: You consent to have your vehicle impounded if parked illegally.
  answer: B
  explanation: When you drive a vehicle or a motorboat in Utah, it is implied that
    you will submit to a chemical test of your breath, blood, urine, or oral fluids
    to determine the alcohol or drug content if asked to do so by a peace officer.
    This is called the implied consent law.
- id: 202
  category: penalties_and_points
  question: What is the penalty for a first offense if a driver over 21 refuses to
    submit to a chemical test under the implied consent law?
  choices:
    A: License revoked for 6 months
    B: License revoked for 12 months
    C: License revoked for 18 months
    D: License revoked for 36 months
  answer: C
  explanation: If you refuse to do so [submit to a chemical test], your driver license
    would be revoked for 18 months for the first offense.
- id: 203
  category: penalties_and_points
  question: Which of the following convictions will result in a lifetime alcohol-restricted
    status?
  choices:
    A: A first offense DUI
    B: Automobile homicide or a felony DUI
    C: Reckless driving
    D: Possession of alcohol by a minor
  answer: B
  explanation: A lifetime alcohol-restricted status will result when a driver is convicted
    of automobile homicide or a felony DUI.
- id: 204
  category: driver_responsibility
  question: According to the manual, what is a recommended way to deal with your emotions
    if you are angry or worried before driving?
  choices:
    A: Drive faster to reach your destination sooner.
    B: Listen to loud music to distract yourself.
    C: Give yourself time to cool off by taking a short walk or nap.
    D: Drink a small amount of alcohol to calm your nerves.
  answer: C
  explanation: 'There are ways of dealing with your emotions: If you are angry or
    worried, give yourself time to cool off. Take a short walk or nap, but stay off
    the road until the symptoms have passed.'
- id: 205
  category: penalties_and_points
  question: What happens if a driver is convicted of driving with any measurable amount
    of alcohol during an alcohol-restricted period?
  choices:
    A: The driver's license will be suspended for 6 months.
    B: The driver's license will be revoked for one year.
    C: The driver will be required to take a defensive driving course.
    D: The driver will receive a lifetime alcohol-restricted status.
  answer: B
  explanation: According to the manual, if convicted of driving with any measurable
    amount of alcohol during the alcohol-restricted period, the driver license will
    be revoked for one year.
- id: 206
  category: alcohol_drugs_health
  question: What laws apply if you operate a motorboat while under the influence of
    alcohol or drugs?
  choices:
    A: You will only face maritime fines and penalties.
    B: The same laws apply as if you were operating a motor vehicle.
    C: Your boating license is suspended, but your driver license is unaffected.
    D: You will receive a warning for the first offense.
  answer: B
  explanation: If you operate a motorboat while under the influence of alcohol/drugs,
    the same laws apply as if you were operating a motor vehicle while under the influence.
- id: 207
  category: penalties_and_points
  question: How long is the ignition interlock device (IID) restriction for a driver
    convicted of a first DUI who was over the age of 21 at the time of arrest?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 3 years
  answer: C
  explanation: When an individual has been convicted of a first DUI, they are restricted
    to an IID for 18 months, or three years if they are under the age of 21 when arrested.
- id: 208
  category: penalties_and_points
  question: If an ignition interlock-restricted driver attempts to start the vehicle
    with a measurable amount of alcohol, what is the penalty?
  choices:
    A: The vehicle is immediately impounded and sold.
    B: The driver's license is permanently revoked.
    C: The ignition interlock requirement is extended by 60 days for each occurrence.
    D: The driver must pay a $500 fine.
  answer: C
  explanation: If a driver fails to have the device monitored or attempts to start
    the vehicle with a measurable amount of alcohol, the ignition interlock requirement
    will be extended by 60 days for each occurrence.
- id: 209
  category: penalties_and_points
  question: How often are ignition interlock-restricted drivers required to have the
    device monitored?
  choices:
    A: At least every 30 days
    B: At least every 60 days
    C: At least every 90 days
    D: At least every 6 months
  answer: B
  explanation: Ignition interlock-restricted drivers are required to have the device
    monitored at least every 60 days.
- id: 210
  category: penalties_and_points
  question: If your vehicle is impounded after a DUI arrest, what must happen before
    it is released to you?
  choices:
    A: You must wait 30 days for an automatic release.
    B: You must meet all requirements and pay all fees, including towing and storage.
    C: You must pay a flat $100 administrative fee to the arresting officer.
    D: You must prove in court that you were not under the influence.
  answer: B
  explanation: The impounded vehicle will be released to the owner once all requirements
    have been met and all fees paid, which include towing, storage charges, and administrative
    costs.
- id: 211
  category: defensive_driving
  question: If you drop something or are stung by a bee while driving, what is the
    safest course of action?
  choices:
    A: Brake hard and stop in your lane.
    B: Keep driving and ignore the problem until you reach your destination.
    C: Immediately pull over to the side of the roadway and take care of the problem.
    D: Ask a passenger to take the steering wheel while you handle it.
  answer: C
  explanation: If you have a problem or there is a distraction like dropping something
    or a bee sting, immediately pull over to the side of the roadway and take care
    of the problem.
- id: 212
  category: penalties_and_points
  question: Under Utah law, what is a potential penalty for a first conviction of
    road rage?
  choices:
    A: A mandatory 30-day jail sentence
    B: A fine of up to $5,000
    C: License suspension for one year
    D: Permanent revocation of driving privileges
  answer: C
  explanation: For road rage, the manual states that the court may order that your
    license be suspended for one year on the first conviction.
- id: 213
  category: defensive_driving
  question: What is the recommended action if an animal suddenly appears in your path
    on the roadway?
  choices:
    A: Swerve quickly into the oncoming lane to avoid hitting it.
    B: Honk your horn continuously and speed up.
    C: Do not swerve; keep your vehicle under control and in the travel lane.
    D: Flash your high beams to scare it away.
  answer: C
  explanation: To reduce chances of colliding with an animal, do not swerve to avoid
    the animal (your risk of personal injury may be greater) and keep your vehicle
    under control and in the travel lane.
- id: 214
  category: safe_driving_rules
  question: If you need help on the side of the road, what is one way to signal for
    assistance?
  choices:
    A: Stand in the travel lane and wave your arms.
    B: Tie something white or orange on the antenna or left door handle.
    C: Leave your vehicle and walk along the highway.
    D: Turn off all your lights so your battery doesn't die.
  answer: B
  explanation: If you need help, pull to the side of the road, turn on your emergency
    flashers, raise your hood, and tie something white or orange on the antenna or
    left door handle.
- id: 215
  category: defensive_driving
  question: If your vehicle breaks down while driving in the desert, what should you
    generally do?
  choices:
    A: Stay with your vehicle unless help is visible within a few minutes' walk.
    B: Start walking along the road to find the nearest town.
    C: Leave the hood closed to prevent sand from getting in the engine.
    D: Drink all your water immediately to stay hydrated.
  answer: A
  explanation: If your vehicle breaks down in the desert, stay with it. Do not wander
    away unless it is to get help from a visible call box or an inhabited building
    within a few minutes' walk.
- id: 216
  category: safe_driving_rules
  question: When taking a long road trip, how often should you plan to stop and take
    a break from driving?
  choices:
    A: Every hour
    B: Every two hours
    C: Every four hours
    D: Only when you need to refuel
  answer: B
  explanation: Before you take a trip, plan to stop every two hours during long trips
    to take a break from driving to avoid fatigue.
- id: 217
  category: driver_responsibility
  question: Which of the following is a recommended practice to avoid distractions
    before driving?
  choices:
    A: Setting your navigation system while pulling out of the driveway
    B: Keeping pets loose in the vehicle so they are comfortable
    C: Eating and grooming before you leave
    D: Texting your destination to friends while at a red light
  answer: C
  explanation: The manual advises avoiding distractions before driving by turning
    off mobile devices, setting navigation systems, eating and grooming before you
    leave, and securing all loose items.
- id: 218
  category: penalties_and_points
  question: What is the penalty for driving a vehicle without an Ignition Interlock
    Device (IID) installed when you are restricted to doing so?
  choices:
    A: A warning and a $50 fine
    B: Vehicle impoundment, a 1-year license revocation, and an additional 2-year
      IID restriction
    C: A 6-month license suspension and mandatory traffic school
    D: Immediate lifetime revocation of driving privileges
  answer: B
  explanation: If an individual drives without an IID when restricted, the vehicle
    may be impounded. A conviction for violating the IRD law will result in a 1-year
    license revocation and an additional 2-year IID restriction.
- id: 219
  category: safe_driving_rules
  question: How much moving water does it take to carry away most vehicles, including
    sport utility vehicles and pick-up trucks?
  choices:
    A: Six inches
    B: One foot
    C: Two feet
    D: Three feet
  answer: C
  explanation: According to the manual, two feet of moving water can carry away most
    vehicles, including sport utility vehicles and pick-up trucks.
- id: 220
  category: safe_driving_rules
  question: Under Utah law, when is a driver under the age of 18 permitted to use
    a handheld wireless communication device while driving?
  choices:
    A: When using voice commands to connect to a call
    B: When communicating with a parent or legal guardian
    C: When stopped at a red light
    D: When using the device's GPS functions
  answer: B
  explanation: Drivers under the age of 18 may only use an HWC device while operating
    a motor vehicle during a medical emergency, reporting a safety hazard, reporting
    criminal activity, or communicating with a parent or legal guardian.
- id: 221
  category: penalties_and_points
  question: What is the penalty for a texting violation while driving if the driver
    inflicts bodily injury or has a previous violation for this offense?
  choices:
    A: A Class C misdemeanor
    B: A Class B misdemeanor
    C: A Class A misdemeanor
    D: A third-degree felony
  answer: B
  explanation: A person convicted of a texting violation is guilty of a Class C misdemeanor,
    but it becomes a Class B misdemeanor if they inflict bodily injury or have a previous
    violation for this offense.
- id: 222
  category: penalties_and_points
  question: What is the penalty for speeding in a highway construction zone?
  choices:
    A: A mandatory license suspension
    B: A fine of at least twice the amount of the regular fine for speeding
    C: A mandatory court appearance and traffic school
    D: A fine of $500 and community service
  answer: B
  explanation: The courts are required to fine a driver who speeds in a highway construction
    zone at least twice the amount of the regular fine for speeding.
- id: 223
  category: defensive_driving
  question: What is the safest action to take if you are caught in a lightning storm
    while driving?
  choices:
    A: Roll down the windows to equalize pressure
    B: Park under a large tree
    C: Ensure all doors are closed and windows are up in a hard-topped vehicle
    D: Exit the vehicle and lie flat in a ditch
  answer: C
  explanation: Only a hard-topped vehicle will protect you in a lightning storm. Make
    sure all doors are closed and windows are up, and do not touch any metal surfaces.
- id: 224
  category: sharing_the_road
  question: When traveling downhill on a narrow mountain road, what must you do if
    you encounter a vehicle going uphill?
  choices:
    A: Honk your horn and proceed
    B: Yield to the vehicle going uphill
    C: The vehicle going uphill must yield to you
    D: Both vehicles must stop and wait for a flagger
  answer: B
  explanation: You must yield to vehicles going uphill if traveling downhill on a
    narrow road.
- id: 225
  category: safe_driving_rules
  question: Which of the following is a prohibited practice when driving downhill
    in the mountains?
  choices:
    A: Using a lower gear
    B: Coasting downhill by shifting into neutral or disengaging the clutch
    C: Staying close to the right edge of the road
    D: Sounding the horn when approaching a sharp curve
  answer: B
  explanation: When driving in the mountains, you must not coast downhill by shifting
    into neutral or disengaging the clutch.
- id: 226
  category: safe_driving_rules
  question: When must you ensure your vehicle's headlights and taillights are illuminated?
  choices:
    A: From sunset to sunrise, or when you cannot clearly see 1,000 feet ahead
    B: From 8:00 PM to 6:00 AM
    C: Only when driving on unlit rural roads
    D: From one hour after sunset to one hour before sunrise
  answer: A
  explanation: Headlights and taillights must be illuminated from sunset to sunrise,
    or when persons and vehicles are not clearly discernible at a distance of 1,000
    feet ahead due to insufficient light or unfavorable atmospheric conditions.
- id: 227
  category: safe_driving_rules
  question: At what distance must you dim your high beam lights when an oncoming car
    is approaching?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: If your vehicle's high beam lights are on and a car is coming toward
    you, dim your lights before you get within 500 feet of the oncoming car.
- id: 228
  category: safe_driving_rules
  question: At what distance must you dim your lights when you are following another
    vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: If you are following a car, dim your lights when you are within 300
    feet of the vehicle ahead of you.
- id: 229
  category: defensive_driving
  question: What should you do if an oncoming vehicle does not dim their high beams
    at night?
  choices:
    A: Flash your high beams repeatedly
    B: Look at the right side of the road
    C: Look directly into their headlights to gauge their distance
    D: Pull over to the shoulder and stop
  answer: B
  explanation: If an oncoming vehicle does not dim, look at the right side of the
    road. This helps avoid being blinded by the headlights.
- id: 230
  category: safe_driving_rules
  question: Who has the right-of-way when approaching a narrow or single-lane bridge
    on a rural road?
  choices:
    A: The larger vehicle
    B: The vehicle traveling uphill
    C: The first driver to the bridge
    D: The vehicle traveling at a faster speed
  answer: C
  explanation: On narrow bridges and single-lane bridges, the first driver to the
    bridge has the right-of-way. Drivers should take turns crossing the bridge.
- id: 231
  category: driver_responsibility
  question: Which of the following is a warning sign of driver drowsiness?
  choices:
    A: Checking your mirrors frequently
    B: Keeping the vehicle perfectly centered in the lane
    C: Remembering the last few miles driven clearly
    D: Hitting a rumble strip or drifting from your lane
  answer: D
  explanation: Warning signs of drowsiness include hitting a rumble strip or drifting
    from your lane, yawning repeatedly, and not being able to remember the last few
    miles driven.
- id: 232
  category: safe_driving_rules
  question: At what speed can your car start to hydroplane on wet roads?
  choices:
    A: Over 25 mph
    B: Over 35 mph
    C: Over 45 mph
    D: Over 55 mph
  answer: B
  explanation: The manual states that your car may start to hydroplane at speeds over
    35 mph when your front tires ride on water instead of the road.
- id: 233
  category: defensive_driving
  question: What should you do if your vehicle's rear wheels start to skid to the
    right?
  choices:
    A: Slam on your brakes immediately
    B: Turn your front wheels to the left
    C: Turn your front wheels to the right
    D: Accelerate to regain traction
  answer: C
  explanation: If your rear wheels skid to the right, you should turn your front wheels
    to the right to help regain control.
- id: 234
  category: defensive_driving
  question: If your vehicle enters a body of water, approximately how long will it
    float on the surface?
  choices:
    A: 10 to 20 seconds
    B: 30 to 60 seconds
    C: 2 to 3 minutes
    D: 5 to 10 minutes
  answer: B
  explanation: If your vehicle enters water, it will only float on the surface for
    30 to 60 seconds, so you must immediately attempt to get out.
- id: 235
  category: defensive_driving
  question: What should you do with your clothing if your vehicle is sinking quickly
    in water and you cannot open the door or window?
  choices:
    A: Keep all clothing on to prevent hypothermia
    B: Take off heavy clothing but keep your shoes on
    C: Remove all clothing including shoes
    D: Only remove your shoes
  answer: B
  explanation: You should take off heavy clothing that will cause you to sink, but
    keep your shoes on in case you have to kick the window to escape.
- id: 236
  category: vehicle_information
  question: When driving in very hot weather, why should you NOT let air out of your
    tires when the pressure increases?
  choices:
    A: It will cause the tire to melt
    B: The pressure will be too low when the tires cool off
    C: It increases the risk of hydroplaning
    D: It will cause the engine to overheat
  answer: B
  explanation: Air pressure increases with temperature, but you should not let the
    air out because the pressure will be too low when the tires cool off.
- id: 237
  category: safe_driving_rules
  question: What hazard should you watch out for on road pavement during hot weather?
  choices:
    A: Bleeding tar that can be slippery
    B: Expanding concrete that causes potholes
    C: Melting painted lines
    D: Increased glare from black ice
  answer: A
  explanation: Tar in the road pavement frequently rises to the surface in hot weather,
    and these spots of bleeding tar can be slippery.
- id: 238
  category: vehicle_information
  question: In Utah, during what dates are snow tires with metal studs permitted?
  choices:
    A: November 1 through February 28
    B: October 15 through March 31
    C: September 1 through April 30
    D: December 1 through March 1
  answer: B
  explanation: Snow tires with metal studs may be used from October 15 through March
    31 of each year.
- id: 239
  category: safe_driving_rules
  question: When freezing rain or snow starts to fall, which areas of the road are
    likely to freeze first?
  choices:
    A: Intersections and crosswalks
    B: Rural roads with ditches
    C: Bridges, ramps, and overpasses
    D: Roads with bleeding tar
  answer: C
  explanation: When sleet, freezing rain, or snow starts to fall, remember that bridges,
    ramps, and overpasses are likely to freeze first.
- id: 240
  category: defensive_driving
  question: If you become stranded in cold weather, how often should you run the engine
    and heater?
  choices:
    A: Continuously until help arrives
    B: Approximately 10 minutes each hour
    C: 30 minutes every two hours
    D: Only when the temperature drops below zero
  answer: B
  explanation: It is recommended to run the engine for approximately 10 minutes each
    hour to charge the battery and warm the interior.
- id: 241
  category: defensive_driving
  question: Why is it important to keep the exhaust pipe clear of snow and debris
    if you are stranded in your vehicle?
  choices:
    A: To prevent the engine from overheating
    B: To keep the battery from draining
    C: To prevent carbon monoxide fumes from leaking into the vehicle
    D: To ensure the heater blows warm air
  answer: C
  explanation: Keep the exhaust pipe clear of snow and debris because fumes from the
    exhaust can leak into the vehicle and cause you to black out or die.
- id: 242
  category: vehicle_information
  question: What is a recommended way to help prevent brake problems from occurring
    in freezing weather?
  choices:
    A: Slam on the brakes every few miles
    B: Lightly touch your brakes occasionally
    C: Apply the parking brake while driving
    D: Avoid using the brakes entirely
  answer: B
  explanation: In freezing weather, brakes can freeze solid or become ineffective.
    To help prevent problems, lightly touch your brakes occasionally.
- id: 243
  category: penalties_and_points
  question: What is the maximum fine you may receive for not remaining at the scene
    of a crash in which you are involved?
  choices:
    A: $500
    B: $1000
    C: $2500
    D: $5000
  answer: C
  explanation: You may receive a jail sentence of up to one year, a fine of up to
    $2500, or both for not remaining at the scene of a crash.
- id: 244
  category: penalties_and_points
  question: Failing to stop at the scene of an injury crash is classified as what
    type of crime?
  choices:
    A: A class B misdemeanor
    B: A class A misdemeanor
    C: A third-degree felony
    D: A first-degree felony
  answer: C
  explanation: It is a third-degree felony for a person to fail to stop at the scene
    of an injury crash.
- id: 245
  category: driver_responsibility
  question: What does the law allow you to do if you are involved in a crash that
    results ONLY in property damage with no injuries?
  choices:
    A: Leave the scene immediately without exchanging information
    B: Move the vehicle out of the travel lanes to a safe location
    C: Leave the vehicles exactly where they are until police arrive
    D: Wait for a tow truck before moving the vehicle from the travel lane
  answer: B
  explanation: If the crash results in property damage only and there are no injuries,
    the law allows the operator to move the vehicle as soon as possible out of the
    travel lanes to an adjacent shoulder or safe location.
- id: 246
  category: safe_driving_rules
  question: Under what circumstances must you immediately notify law enforcement (911)
    after a crash?
  choices:
    A: Only if another driver was involved and fled the scene.
    B: If the crash results in injuries, death, or at least $2500 in total property
      damage.
    C: If the crash results in at least $1000 in property damage.
    D: Only if one of the vehicles needs to be towed from the roadway.
  answer: B
  explanation: If the crash results in injuries, death, or at least $2500 in total
    property damage, you must notify law enforcement (911) immediately.
- id: 247
  category: driver_responsibility
  question: If you crash into an unattended vehicle and the owner cannot be found,
    what information must you leave in a note?
  choices:
    A: Your driver license number and insurance policy number.
    B: Your phone number and insurance agent's name.
    C: Name and address of the driver of your vehicle, and the vehicle plate number
      of the vehicle that caused the crash.
    D: Only your vehicle's registration number and your phone number.
  answer: C
  explanation: If the owner of an unattended vehicle is not available, you must leave
    a note providing the name and address of the driver of your vehicle, and the vehicle
    plate number of the vehicle that caused the crash.
- id: 248
  category: defensive_driving
  question: According to a national study, what percentage of all car crashes involve
    driver error as a factor?
  choices:
    A: 25%
    B: 50%
    C: 75%
    D: 90%
  answer: C
  explanation: A national study revealed that driver error is a factor in 75% of all
    car crashes.
- id: 249
  category: defensive_driving
  question: During what time of day do most crashes happen?
  choices:
    A: Between 6 am and 9 am
    B: Between 10 pm and 2 am
    C: Between 12 pm and 2 pm
    D: Between 2 pm and 6 pm
  answer: D
  explanation: The time of day when most crashes happen is between 2 pm and 6 pm.
- id: 250
  category: safe_driving_rules
  question: What should you do to signal for assistance if your vehicle malfunctions
    and you do not have access to a mobile device?
  choices:
    A: Stand in the middle of the road and wave your arms.
    B: Leave the hood of your car up and your hazard lights on.
    C: Walk to the nearest exit ramp or cross street to find a phone.
    D: Sound your horn continuously until help arrives.
  answer: B
  explanation: If you do not have access to a mobile device, leave the hood of your
    car up and your hazard lights on. This will advise the traveling public that you
    need assistance.
- id: 251
  category: vehicle_information
  question: If your brakes stop working while driving, what is the first step you
    should take?
  choices:
    A: Shift into neutral and turn off the engine immediately.
    B: Pump the gas pedal to build pressure.
    C: Apply the parking brake slowly to avoid locking the rear wheels.
    D: Slam on the parking brake as hard as possible.
  answer: C
  explanation: If your brakes stop working while driving, use the parking brake. Apply
    the parking brake slowly to avoid locking the rear wheels.
- id: 252
  category: vehicle_information
  question: How should you use Anti-lock Braking Systems (ABS) during an emergency
    stop?
  choices:
    A: Pump the brake pedal rapidly.
    B: Press the brake pedal lightly to avoid skidding.
    C: Press the brake pedal as hard as possible and apply pressure.
    D: Use the parking brake at the same time as the foot brake.
  answer: C
  explanation: To use ABS, press the brake pedal as hard as possible and apply pressure.
    ABS only works if you stay on the brake pedal.
- id: 253
  category: safe_driving_rules
  question: Where should you place emergency flares or triangles if your vehicle breaks
    down?
  choices:
    A: 50 to 100 feet behind your vehicle
    B: 100 to 150 feet behind your vehicle
    C: 200 to 300 feet behind your vehicle
    D: 500 feet behind your vehicle
  answer: C
  explanation: Put emergency flares or triangles 200 to 300 feet behind your vehicle,
    giving other drivers time to change lanes or slow down.
- id: 254
  category: vehicle_information
  question: What happens to the steering wheel if the engine shuts off while you are
    driving?
  choices:
    A: It will lock completely and cannot be turned.
    B: It will become very loose and sensitive.
    C: It will automatically steer the vehicle to the right.
    D: It may be hard to turn, but you can turn it.
  answer: D
  explanation: Keep a firm grip on the steering wheel if the engine shuts off while
    driving. The steering wheel may be hard to turn, but you can turn it.
- id: 255
  category: safe_driving_rules
  question: What should you do if your vehicle is speeding out of control due to a
    stuck gas pedal?
  choices:
    A: Shift to neutral, steer smoothly, brake gently, and pull off the road.
    B: Turn off the ignition immediately and apply the parking brake.
    C: Shift into reverse to slow the vehicle down.
    D: Pump the brake pedal rapidly while holding the steering wheel loosely.
  answer: A
  explanation: If your vehicle is speeding out of control, shift to neutral and look
    for a safe place to pull off, steer smoothly, brake gently, and pull off the road.
- id: 256
  category: vehicle_information
  question: How will your vehicle react if a rear tire blows out?
  choices:
    A: The vehicle will pull hard away from the blown tire.
    B: The vehicle will wobble, shake, and pull toward the blown tire.
    C: The steering wheel will lock up completely.
    D: The vehicle will immediately spin out of control.
  answer: B
  explanation: If a rear tire blows out, the vehicle will wobble, shake, and pull
    toward the blown tire.
- id: 257
  category: safe_driving_rules
  question: What is the correct action to take if a tire goes flat while driving?
  choices:
    A: Slam on the brakes immediately to stop the vehicle.
    B: Turn the steering wheel sharply in the opposite direction of the flat tire.
    C: Grip the steering wheel firmly, steer straight, slow gradually, and take your
      foot off the gas pedal.
    D: Accelerate slightly to maintain control of the vehicle.
  answer: C
  explanation: If a tire goes flat, grip the steering wheel firmly, steer straight,
    slow gradually, and take your foot off the gas pedal; do not brake.
- id: 258
  category: penalties_and_points
  question: What is the penalty for knowingly operating a motor vehicle without owner's
    security (insurance)?
  choices:
    A: A class C misdemeanor
    B: A class B misdemeanor
    C: A class A misdemeanor
    D: A third-degree felony
  answer: B
  explanation: Anyone who knowingly operates a motor vehicle or permits one to be
    operated without owner's security is guilty of a class B misdemeanor.
- id: 259
  category: penalties_and_points
  question: If a court renders a judgment against you for damages and it is not satisfied,
    how long do you have before your driving privilege is suspended?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: If this judgment is not satisfied within 60 days after the court decision,
    your driving privilege will be suspended.
- id: 260
  category: defensive_driving
  question: What should you do if your wheels drop off the paved road surface onto
    an uneven surface?
  choices:
    A: Panic and brake hard immediately.
    B: Jerk the steering wheel sharply to get back on the road.
    C: Accelerate to regain traction.
    D: Slow down gradually and then turn back onto the roadway.
  answer: D
  explanation: Don't panic if your wheels drop off the paved road surface. Slow down
    gradually and then turn back onto the roadway.
- id: 261
  category: driver_responsibility
  question: How long must 'future proof' of financial responsibility (SR22 insurance)
    be maintained following the date of a suspension or revocation?
  choices:
    A: One year
    B: Two years
    C: Three years
    D: Five years
  answer: C
  explanation: The manual states that proof of financial responsibility (SR22) must
    be maintained for three years following the date of the suspension or revocation.
- id: 262
  category: driver_responsibility
  question: Which of the following is an acceptable way to provide proof of insurance
    to a peace officer?
  choices:
    A: Only by presenting a physical paper insurance card
    B: By providing a verbal confirmation of your policy number
    C: Electronically using a mobile electronic device
    D: By showing a notarized letter from your insurance agent
  answer: C
  explanation: The law states that you can provide proof of insurance to a peace officer
    electronically using a mobile electronic device.
- id: 263
  category: vehicle_information
  question: What does Personal Injury Protection (PIP) insurance cover?
  choices:
    A: Repairs to your vehicle after a collision
    B: Basic benefits for bodily injury to you and others without having to determine
      fault
    C: Damage to your vehicle caused by fire, theft, or vandalism
    D: Property damage caused by an uninsured driver
  answer: B
  explanation: Personal Injury Protection (also known as 'No-Fault' or 'PIP') is mandatory
    and provides some basic benefits and coverage for bodily injury to you and others
    without having to determine 'fault' in a crash.
- id: 264
  category: vehicle_information
  question: Which type of insurance coverage pays for repairs to your vehicle for
    damage caused by reasons other than collisions, such as fire, theft, or vandalism?
  choices:
    A: Collision
    B: Bodily Injury Liability
    C: Uninsured Motorist
    D: Comprehensive
  answer: D
  explanation: Comprehensive insurance covers repairs to your vehicle for damage caused
    by reasons other than collisions, such as fire, theft, vandalism, or glass breakage.
- id: 265
  category: penalties_and_points
  question: What is the penalty if you are convicted in a court of law for driving
    without insurance?
  choices:
    A: A $100 fine and 30 days in jail
    B: A requirement to carry an SR22 for three years and pay a $40 reinstatement
      fee
    C: Permanent revocation of your driving privileges
    D: Mandatory community service and a $500 fine
  answer: B
  explanation: If you are convicted of driving without insurance or without proof
    of insurance, you will be required to carry an SR22 for three years and pay a
    $40 reinstatement fee.
- id: 266
  category: driver_responsibility
  question: Crash reports are protected and may be released to certain individuals.
    Who is explicitly excluded from receiving a crash report?
  choices:
    A: Parents or legal guardians of those involved
    B: Licensed private investigators
    C: Witnesses to the crash
    D: The news media
  answer: C
  explanation: A crash report may be released to persons involved in the crash, excluding
    witnesses.
- id: 267
  category: penalties_and_points
  question: How long do alcohol or drug-related violations, suspensions, and revocations
    remain on your driving record?
  choices:
    A: 3 years
    B: 5 years
    C: 7 years
    D: 10 years
  answer: D
  explanation: The Driver License Division maintains a computerized driving record,
    and all alcohol/drug-related violations, suspensions, and revocations remain on
    the record for 10 years.
- id: 268
  category: penalties_and_points
  question: If you are caught driving while your driver license is suspended, what
    will happen to your original suspension period?
  choices:
    A: It will be increased by the amount of the original time period
    B: It will be permanently revoked
    C: It will be extended by exactly one year
    D: It will be converted to a lifetime suspension
  answer: A
  explanation: If you drive while your license is denied, suspended, or revoked, the
    length of time your driver license was originally denied, suspended, or revoked
    will be increased by the amount of the original time period.
- id: 269
  category: alcohol_drugs_health
  question: What is a potential penalty for driving while your license is suspended
    if the original suspension was based on an alcohol-related offense?
  choices:
    A: A fine of up to $500 and 30 days in jail
    B: A fine of up to $1000 and imprisonment for up to six months
    C: Mandatory installation of an ignition interlock device for life
    D: A warning and an additional 3-month suspension
  answer: B
  explanation: If your original suspension or revocation is based upon an alcohol-related
    offense and you drive, the fine may be up to $1000, and you may be imprisoned
    for up to six months.
- id: 270
  category: penalties_and_points
  question: How long may a court order your license to be suspended on the first conviction
    for a citation with a road rage enhancement?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: The court may order that your license be suspended for one year on
    the first conviction for a citation with a road rage enhancement.
- id: 271
  category: penalties_and_points
  question: Which of the following offenses will result in a mandatory revocation
    of your driving privilege?
  choices:
    A: Failure to pay child support
    B: Failure to stop and give aid if involved in a crash resulting in death or personal
      injury
    C: Failing to appear in court for a traffic violation
    D: A first conviction for a texting violation
  answer: B
  explanation: Your driving privilege will result in a mandatory revocation if a court
    finds you guilty of failure to stop and give aid if you are involved in a motor
    vehicle crash resulting in the death of or personal injury to another.
- id: 272
  category: penalties_and_points
  question: 'Attempting to flee or refusing to stop after receiving a visual or audible
    signal from a police officer will result in:'
  choices:
    A: A mandatory license revocation
    B: A warning on your driving record
    C: A mandatory 30-day suspension
    D: A requirement to retake the written driving test
  answer: A
  explanation: Attempting to flee or refusing to stop after receiving a visual or
    audible signal from a police officer is listed under the offenses that result
    in a mandatory license revocation.
- id: 273
  category: vehicle_information
  question: Under Uninsured Motorist coverage, which of the following is generally
    NOT paid for?
  choices:
    A: Injuries to the driver
    B: Injuries to passengers
    C: Property damage losses
    D: Medical bills resulting from a hit-and-run
  answer: C
  explanation: Uninsured Motorist coverage covers injuries to you and your passengers.
    The manual notes that 'Property damage losses are generally not paid under this
    coverage.'
- id: 274
  category: penalties_and_points
  question: 'You may face a license suspension for a violation related to approaching
    an emergency vehicle if you fail to complete:'
  choices:
    A: A 10-hour community service program
    B: A four-hour live classroom course on driving safety
    C: A defensive driving road test
    D: A $500 restitution payment to the emergency department
  answer: B
  explanation: Your license may be suspended if you have been convicted for a violation
    related to approaching an emergency vehicle and have failed to complete a four-hour
    live classroom course on driving safety offered by an approved entity.
- id: 275
  category: penalties_and_points
  question: How many points are added to your driving record for a texting while driving
    violation?
  choices:
    A: 40 points
    B: 50 points
    C: 60 points
    D: 80 points
  answer: B
  explanation: According to the Utah point system, texting while driving results in
    50 points being added to your driving record.
- id: 276
  category: penalties_and_points
  question: If you are over 21 years of age, how many points acquired within a three-year
    period will require you to appear for a hearing?
  choices:
    A: 70 or more points
    B: 100 or more points
    C: 150 or more points
    D: 200 or more points
  answer: D
  explanation: If you are over 21 years of age and acquire 200 or more points within
    a three-year period, you will be asked to appear for a hearing.
- id: 277
  category: penalties_and_points
  question: How long does it take for points from individual convictions to be automatically
    removed from your driving record?
  choices:
    A: One year after the violation date
    B: Two years after the violation date
    C: Three years after the violation date
    D: Five years after the violation date
  answer: C
  explanation: Points for individual convictions are automatically removed from your
    record three years after the date of the violation.
- id: 278
  category: penalties_and_points
  question: What happens to the points on your record if you drive one full year without
    being convicted of a moving traffic violation?
  choices:
    A: All points are removed
    B: Half of the total points are removed
    C: 50 points are removed
    D: 25 points are removed
  answer: B
  explanation: The point system provides that half of the total points on your record
    will be removed when you drive one full year without being convicted of a moving
    traffic violation.
- id: 279
  category: penalties_and_points
  question: How many points can be removed from your record upon completing a defensive
    driving course recommended by the division?
  choices:
    A: 25 points
    B: 40 points
    C: 50 points
    D: 75 points
  answer: C
  explanation: As an incentive, 50 points may be removed from your record upon completing
    a defensive driving course recommended by the division. This is permitted once
    during any three-year period.
- id: 280
  category: sharing_the_road
  question: What is the minimum distance required by Utah law when passing a bicyclist
    or vulnerable user of the highway?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: Utah law requires a minimum of three feet of distance from any bicyclist
    or vulnerable user of the highway you are passing.
- id: 281
  category: sharing_the_road
  question: When are you permitted to drive, stop, or park in a designated bicycle
    lane?
  choices:
    A: When traffic is heavy and you need to pass a turning vehicle
    B: When you are entering or leaving an alley or driveway
    C: When you are dropping off a passenger quickly
    D: When there are no bicyclists currently using the lane
  answer: B
  explanation: You may not stop, park, or drive on a designated bicycle path or lane
    unless you are entering or leaving an alley or driveway, performing official duties
    directed by a police officer, or an emergency exists.
- id: 282
  category: sharing_the_road
  question: Why should you avoid sounding your horn close to a bicyclist unless there
    is a chance of a crash?
  choices:
    A: It is illegal to use your horn in residential areas
    B: It may startle the bicyclist and cause them to steer into your path
    C: It will cause the bicyclist to stop immediately in the roadway
    D: It damages the bicyclist's hearing
  answer: B
  explanation: Sounding your horn to alert your presence may startle bicyclists and
    cause them to steer into your path and crash.
- id: 283
  category: sharing_the_road
  question: At what distance must you dim your headlights when approaching or overtaking
    a bicyclist at night?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: You must dim your headlights within 500 feet when approaching or overtaking
    bicyclists at night.
- id: 284
  category: sharing_the_road
  question: Under what condition is it illegal to pass a bicycle proceeding in the
    same direction?
  choices:
    A: When the bicyclist is traveling at less than a reasonable speed
    B: When you are within 100 feet of an intersection or railroad grade crossing
    C: When there is a center two-way left turn lane available
    D: When the bicyclist is not using hand signals
  answer: B
  explanation: A person operating a vehicle may not pass a bicycle safely when approaching
    within 100 feet of, or traversing, any intersection or railroad grade crossing
    unless otherwise indicated.
- id: 285
  category: penalties_and_points
  question: Which of the following moving violations carries the highest number of
    points on your driving record?
  choices:
    A: Reckless driving
    B: Failure to yield right-of-way
    C: Running a red light
    D: Texting while driving
  answer: A
  explanation: According to the point system, reckless driving carries 80 points,
    which is higher than failure to yield (60), running a red light (50), and texting
    while driving (50).
- id: 286
  category: penalties_and_points
  question: Your driver license may be revoked or suspended if you receive two citations
    in one year that have been enhanced as what type of violation?
  choices:
    A: Parking violations
    B: Noise ordinance violations
    C: Road rage violations
    D: HOV lane violations
  answer: C
  explanation: Your license may be suspended or revoked if you have two citations
    that have been enhanced as a road rage violation in one year.
- id: 287
  category: sharing_the_road
  question: What is a requirement for bicyclists when riding on the roadway?
  choices:
    A: They must ride facing oncoming traffic
    B: They must keep at least one hand on the handlebars at all times
    C: They must always ride on the sidewalk when one is available
    D: They must yield the right-of-way to all motor vehicles at all times
  answer: B
  explanation: As a bicyclist, you must keep at least one hand on the handlebars at
    all times.
- id: 288
  category: vehicle_information
  question: What is the minimum braking requirement for a bicycle operated on the
    road?
  choices:
    A: It must be able to stop within 15 feet from a speed of 15 mph.
    B: It must be able to stop within 25 feet from a speed of 10 mph.
    C: It must be able to stop within 50 feet from a speed of 20 mph.
    D: It must be able to stop within 10 feet from a speed of 10 mph.
  answer: B
  explanation: According to the manual, every bicycle must have a brake or brake system
    that enables the rider to stop the bicycle within 25 feet from a speed of 10 mph.
- id: 289
  category: safe_driving_rules
  question: When riding a bicycle in low light conditions, how far away must your
    white headlight and red taillight or reflector be visible?
  choices:
    A: At least 200 feet
    B: At least 300 feet
    C: At least 500 feet
    D: At least 1000 feet
  answer: C
  explanation: You are required to have a white headlight, red taillight or reflector,
    and side reflectors, all visible for at least 500 feet any time you ride earlier
    than a half-hour before sunrise, later than a half-hour after sunset, or when
    visibility is poor.
- id: 290
  category: sharing_the_road
  question: How may a bicyclist legally navigate a stop sign?
  choices:
    A: They must come to a complete stop and wait for all other traffic to clear.
    B: They may proceed through the intersection without stopping if they slow to
      a reasonable speed and yield to pedestrians.
    C: They must dismount and walk the bicycle through the intersection.
    D: They may maintain their speed if there are no vehicles approaching from the
      right.
  answer: B
  explanation: Bicyclists approaching a stop sign may proceed through the intersection
    without stopping at the stop sign if the bicyclist slows to a reasonable speed
    and yields the right-of-way to any pedestrian within the intersection or an adjacent
    crosswalk.
- id: 291
  category: sharing_the_road
  question: What must a bicyclist do before overtaking and passing a pedestrian on
    a sidewalk or crosswalk?
  choices:
    A: Give an audible signal
    B: Flash their headlight
    C: Dismount the bicycle
    D: Pass on the left side only
  answer: A
  explanation: When riding a bicycle on a sidewalk or crosswalk, bicyclists must ride
    slowly, yield the right-of-way to any pedestrian, and give an audible signal before
    overtaking and passing any pedestrian.
- id: 292
  category: vehicle_information
  question: Which class of electric assisted bicycle is equipped with a speedometer
    and provides assistance only when pedaling up to 28 miles per hour?
  choices:
    A: CLASS 1
    B: CLASS 2
    C: CLASS 3
    D: CLASS 4
  answer: C
  explanation: A CLASS 3 electric assisted bicycle provides assistance only when the
    rider is pedaling, ceases to assist at 28 miles per hour, and is equipped with
    a speedometer.
- id: 293
  category: safe_driving_rules
  question: Unless on official business, what is the minimum distance you must maintain
    when following a fire vehicle responding to an alarm?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Unless you are on official business, do not follow within 500 feet
    of any fire vehicle responding to an alarm.
- id: 294
  category: penalties_and_points
  question: What is the penalty if you are convicted of failing to follow the move
    over law?
  choices:
    A: A mandatory $500 fine and 3 points on your license
    B: Immediate suspension of your driver's license for 30 days
    C: You must attend a four-hour live classroom defensive driving course within
      90 days
    D: You must retake the written and practical driving tests
  answer: C
  explanation: If you are convicted for NOT following the move over law, you must
    attend a four hour live classroom defensive driving course within 90 days of conviction.
- id: 295
  category: safe_driving_rules
  question: What must a driver traveling in the HOV lane do when approaching a stationary
    vehicle displaying amber lights?
  choices:
    A: Stop immediately in the HOV lane until the vehicle moves
    B: Make a lane change out of the HOV lane into a non-adjacent lane, if practical
      and safe
    C: Accelerate to pass the stationary vehicle as quickly as possible
    D: Turn on their own hazard lights and maintain their current speed
  answer: B
  explanation: Upon approaching a stationary vehicle displaying amber lights, the
    driver of a vehicle traveling in the HOV lane shall, if practical, with due regard
    to safety and traffic conditions, make a lane change out of the HOV lane into
    a lane not adjacent to the stationary vehicle.
- id: 296
  category: vehicle_information
  question: Except for farm tractors, what is the maximum legal outside width for
    a vehicle, including its load?
  choices:
    A: 8 feet
    B: 8 1/2 feet
    C: 9 feet
    D: 10 feet
  answer: B
  explanation: No vehicle shall have a total outside width, including load, of more
    than 8 1/2 feet. One exception to this rule is farm tractors, which may not exceed
    9 feet.
- id: 297
  category: vehicle_information
  question: What is the maximum legal height for any vehicle, including any load that
    may be carried?
  choices:
    A: 12 feet
    B: 13 1/2 feet
    C: 14 feet
    D: 15 feet
  answer: C
  explanation: No vehicle shall exceed a height of 14 feet, including any load that
    may be carried.
- id: 298
  category: vehicle_information
  question: Excluding fire-fighting equipment, what is the maximum overall length
    allowed for a single vehicle?
  choices:
    A: 35 feet
    B: 40 feet
    C: 45 feet
    D: 65 feet
  answer: C
  explanation: No single vehicle, except for fire-fighting equipment, shall exceed
    an overall length of 45 feet, including the front and rear bumpers.
- id: 299
  category: safe_driving_rules
  question: How far is a load legally permitted to extend to the front and rear of
    a vehicle's body?
  choices:
    A: No more than two feet to the front and four feet to the rear
    B: No more than three feet to the front and six feet to the rear
    C: No more than four feet to the front and eight feet to the rear
    D: No more than five feet to the front and ten feet to the rear
  answer: B
  explanation: No train of vehicles or single vehicle shall carry a load extending
    more than three feet to the front nor more than six feet to the rear of the vehicle’s
    body.
- id: 300
  category: safe_driving_rules
  question: What is the rule regarding loads projecting to the sides of a passenger
    vehicle?
  choices:
    A: The load may not extend beyond the left fenders, and no more than six inches
      beyond the right fenders.
    B: The load may extend up to six inches beyond the left fenders, but not beyond
      the right fenders.
    C: The load may extend up to one foot beyond the fenders on either side.
    D: The load may not extend beyond the line of the fenders on either side under
      any circumstances.
  answer: A
  explanation: No vehicle, including a passenger vehicle, may carry any load extending
    beyond the line of the fenders on the left side of the vehicle nor extending more
    than six inches beyond the line of the fenders on the right side.
- id: 301
  category: vehicle_information
  question: Vehicles registered for what gross laden weight must display the registered
    weight on both sides of the vehicle?
  choices:
    A: 10,001 pounds or more
    B: 16,001 pounds or more
    C: 20,001 pounds or more
    D: 26,001 pounds or more
  answer: B
  explanation: The Utah State Tax Commission requires that every vehicle registered
    for 16,001 pounds or more have the weight for which it is registered displayed
    on both the left and right sides of the vehicle.
- id: 302
  category: sharing_the_road
  question: Why do tractor-trailers typically stay in the center lane on multi-lane
    highways?
  choices:
    A: Because the right lane is legally reserved for passenger cars only.
    B: To help with local traffic flow on and off the highway and increase options
      to avoid dangerous situations.
    C: Because trucks are prohibited from using the left and right lanes by state
      law.
    D: To prevent passenger vehicles from passing them on the left.
  answer: B
  explanation: On multi-lane highways, tractor-trailers stay in the center lane to
    help with local traffic flow on and off the highway. Staying in the middle lane
    also increases a truck driver’s options if they switch lanes to avoid a dangerous
    situation or a crash.
- id: 303
  category: sharing_the_road
  question: When passing a tractor-trailer, you should always pass completely and
    on which side?
  choices:
    A: On the right side
    B: On the left side
    C: On whichever side has a wider shoulder
    D: On the side with the smallest blind spot
  answer: B
  explanation: The manual states to always pass a tractor-trailer completely and always
    on the left side.
- id: 304
  category: sharing_the_road
  question: What is a good rule of thumb to know if you are following a large truck
    too closely?
  choices:
    A: If you cannot see the truck's exhaust pipe, they cannot see you.
    B: If you cannot see the truck driver's rear view mirrors, they cannot see you.
    C: If you are within 50 feet of the truck's rear bumper, they cannot see you.
    D: If you can read the license plate of the truck, they cannot see you.
  answer: B
  explanation: When following behind a truck, if you can't see the truck driver's
    rear view mirrors, there is no way the truck driver can see you.
- id: 305
  category: sharing_the_road
  question: Why do drivers of tractor-trailers often swing out to the left before
    making a right turn?
  choices:
    A: To get a better view of oncoming traffic
    B: Because the rear wheels follow a shorter path than the front wheels
    C: To allow cars to pass them on the right
    D: To increase their speed before entering the turn
  answer: B
  explanation: With any turning vehicle, the rear wheels follow a shorter path than
    the front wheels. The longer the vehicle, the greater the difference, which is
    why tractor-trailers must often swing out to the left to make a right turn.
- id: 306
  category: sharing_the_road
  question: How far behind a large vehicle does its rear blind spot (or "no-zone")
    extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 200 feet
    D: Up to 300 feet
  answer: C
  explanation: Large vehicles have huge blind spots up to 200 feet behind them. If
    you are too close, the driver cannot see your vehicle.
- id: 307
  category: sharing_the_road
  question: Where is a large truck's largest blind spot located?
  choices:
    A: Directly in front of the cab
    B: On the left side
    C: On the right side
    D: Directly behind the trailer
  answer: C
  explanation: Large trucks and buses have big no-zones on both sides, but a truck's
    largest blind spot is on the right side.
- id: 308
  category: vehicle_information
  question: Which of the following is true regarding mobility vehicles used by persons
    with physical disabilities?
  choices:
    A: They must pass a standard vehicle emissions inspection.
    B: They are exempt from registration and usual operator license requirements.
    C: They are only allowed on sidewalks and never on public roadways.
    D: They require a standard Class D driver license to operate.
  answer: B
  explanation: Pedestrian and mobility vehicles may be used on the highways and are
    exempt from registration, inspection, and the usual operator license requirements.
- id: 309
  category: safe_driving_rules
  question: 'It is illegal to operate a motor-assisted scooter on a highway with a
    posted speed limit greater than:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: A person may not operate a motor-assisted scooter on a highway with
    a posted speed limit greater than 25 mph.
- id: 310
  category: safe_driving_rules
  question: Under what condition may a person under the age of 15 operate a motor-assisted
    scooter?
  choices:
    A: Only if they have a learner permit
    B: Only if they are riding in a designated bike lane
    C: Only under the direct supervision of a parent or guardian
    D: They are never allowed to operate a motor-assisted scooter
  answer: C
  explanation: A person under the age of 15 may not operate a motor-assisted scooter
    unless the person is under the direct supervision of the person's parent or guardian.
- id: 311
  category: safe_driving_rules
  question: In Utah, which motorcycle operators and passengers are required by law
    to wear an approved DOT helmet?
  choices:
    A: Only those operating on interstate highways
    B: Anyone under 18 years of age
    C: Anyone under 21 years of age
    D: All motorcycle operators and passengers regardless of age
  answer: C
  explanation: Any motorcycle operator or passenger who is under 21 years of age must
    wear an approved DOT helmet.
- id: 312
  category: sharing_the_road
  question: 'When driving alongside a motorcycle in the same lane, you should:'
  choices:
    A: Share the lane to allow more vehicles to pass
    B: Give the motorcycle the entire lane and never share the lane
    C: Honk your horn to let the motorcyclist know you are there
    D: Drive closely to the motorcycle to block wind gusts
  answer: B
  explanation: Give motorcycles an entire lane. Do not share the lane. Motorcycles
    need space to react to other traffic.
- id: 313
  category: sharing_the_road
  question: Why should you be cautious if you see a motorcycle approaching with its
    turn signal flashing?
  choices:
    A: Motorcycles are not legally required to use turn signals
    B: Many motorcycle turn signals do not self-cancel and the rider may have forgotten
      to turn it off
    C: The flashing signal indicates the motorcycle is experiencing mechanical failure
    D: Motorcycle signals flash faster than car signals, making them confusing
  answer: B
  explanation: Do not believe a motorcycle is turning when it has a turn signal flashing.
    Many motorcycle turn signals do not self-cancel. The rider may have forgotten
    to cancel the signal.
- id: 314
  category: safe_driving_rules
  question: Under normal driving conditions, what is the minimum recommended following
    distance when driving behind a motorcycle?
  choices:
    A: One second
    B: Two seconds
    C: Four seconds
    D: Six seconds
  answer: B
  explanation: When following a motorcycle, stay at least two seconds back. When it
    is wet on the roadway increase this distance.
- id: 315
  category: sharing_the_road
  question: Under Utah's lane filtering law, what is the maximum posted speed limit
    of the roadway where a motorcyclist is allowed to filter between stopped vehicles?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: Lane filtering is permitted when the individual is on a roadway with
    a speed limit of 45 miles per hour or less.
- id: 316
  category: sharing_the_road
  question: When legally lane filtering, a motorcycle must not exceed what speed?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: One of the conditions for lane filtering is that the motorcycle is
    traveling at a speed of 15 miles per hour or less.
- id: 317
  category: signs_and_signals
  question: 'If a traffic-control signal fails to detect a motorcycle or bicycle,
    the operator may proceed across the roadway if it is safe and they have waited
    at the intersection for at least:'
  choices:
    A: 30 seconds
    B: 60 seconds
    C: 90 seconds
    D: 120 seconds
  answer: C
  explanation: An operator 16 years or older may proceed across the roadway if they
    determine the traffic-control signal has not detected them after waiting a reasonable
    period of time, not less than 90 seconds.
- id: 318
  category: sharing_the_road
  question: What must you do when a pedestrian is crossing a street with a guide dog
    or carrying a white cane?
  choices:
    A: Honk your horn lightly to alert them of your presence
    B: Yield only if they are in a marked crosswalk
    C: Come to a complete stop
    D: Slow down and proceed with caution around them
  answer: C
  explanation: According to the manual, when a pedestrian is crossing a street with
    a guide dog or carrying a white cane, you must come to a complete stop.
- id: 319
  category: safe_driving_rules
  question: If there are no sidewalks available, where should pedestrians walk or
    jog?
  choices:
    A: On the right shoulder moving with the flow of traffic
    B: On the left shoulder facing traffic as far away as possible from the edge
    C: In the center of the lane facing traffic
    D: On either side of the road as long as they wear reflective clothing
  answer: B
  explanation: The manual states that if there are no sidewalks, pedestrians should
    walk or jog on the left shoulder as far away as possible from the edge of the
    roadway, facing traffic.
- id: 320
  category: defensive_driving
  question: Why should you never pass a vehicle stopped at a crosswalk?
  choices:
    A: The stopped vehicle might suddenly back up
    B: It is illegal to change lanes near any intersection
    C: There may be people crossing that you cannot see
    D: The stopped vehicle is likely waiting for a traffic light
  answer: C
  explanation: You should never pass vehicles stopped at a crosswalk because there
    may be people crossing that you can't see.
- id: 321
  category: driver_responsibility
  question: According to the 2024 Highway Safety Office report, what were the leading
    driver contributing factors in pedestrian deaths?
  choices:
    A: Speeding and distracted driving
    B: Failing to yield right-of-way and improper turning
    C: Driving under the influence and running red lights
    D: Drowsy driving and improper lane changes
  answer: B
  explanation: The leading driver contributing factors in pedestrian deaths in 2024
    were failing to yield right-of-way and improper turning.
- id: 322
  category: vehicle_information
  question: A pedestrian-vehicle designed for the use of the disabled must not be
    capable of exceeding what speed?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: D
  explanation: A pedestrian-vehicle must be less than 48 inches wide, have an engine
    displacement of less than 300 cc and less than 12 brake horsepower, and not be
    capable of exceeding 30 mph.
- id: 323
  category: safe_driving_rules
  question: If pulled over by the police while traveling in the High Occupancy Vehicle
    (HOV) lane, what should you do?
  choices:
    A: Stop immediately in the HOV lane
    B: Move to the right side of the road and find a safe spot to stop
    C: Wait until the next exit to pull over
    D: Pull over to the left shoulder
  answer: B
  explanation: If the police pull you over, you must move to the right side of the
    road (even when traveling in the HOV lane) and make sure you are in a safe spot
    to stop.
- id: 324
  category: driver_responsibility
  question: During a traffic stop, what should you do with your hands?
  choices:
    A: Keep them in your lap
    B: Keep them on the steering wheel
    C: Place them out the window
    D: Reach for your documents immediately before the officer approaches
  answer: B
  explanation: During a police stop, you should remain calm, keep your safety belt
    fastened, and keep your hands on the steering wheel.
- id: 325
  category: signs_and_signals
  question: What does a fluorescent or reflective orange and red triangle displayed
    on the rear of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is moving less than 25 mph
    C: The vehicle is making wide right turns
    D: The vehicle is an emergency responder
  answer: B
  explanation: A fluorescent or reflective orange and red triangle displayed on the
    rear means the vehicle is moving less than 25 mph.
- id: 326
  category: sharing_the_road
  question: 'When operating a golf cart on designated public roads, operators must
    comply with the same rules as:'
  choices:
    A: A motorcycle
    B: A pedestrian
    C: A bicycle
    D: A commercial vehicle
  answer: C
  explanation: Golf cart operators are responsible for safely operating a golf cart
    and shall comply with the same rules as a bicycle.
- id: 327
  category: sharing_the_road
  question: When sharing the road with horse-drawn vehicles or horseback riders, why
    should you avoid using your horn or 'revving' the engine?
  choices:
    A: It is illegal in rural areas
    B: It may scare the horse and cause a crash
    C: It violates noise ordinance laws
    D: It will cause the rider to yield the right-of-way
  answer: B
  explanation: You should not use your horn or 'rev' the engine around horse-drawn
    vehicles or horseback riders because this may scare the horse and cause a crash.
- id: 328
  category: vehicle_information
  question: Which of the following describes a Type 1 all-terrain vehicle (ATV)?
  choices:
    A: Has a steering wheel and non-straddle seating
    B: Is 80 inches or less in width
    C: Has a seat designed to be straddled by the operator
    D: Has an unladen dry weight of 3,500 pounds
  answer: C
  explanation: An ATV Type 1 is defined as having a seat designed to be straddled
    by the operator, traveling on three or more low-pressure tires, and being 52 inches
    or less in width.
- id: 329
  category: license_system
  question: What type of driver license is required to drive a street-legal ATV, UTV,
    or FSV?
  choices:
    A: A Class M (Motorcycle) license only
    B: A special off-road vehicle permit
    C: A Class D or CDL license
    D: No license is required for street-legal ATVs
  answer: C
  explanation: 'The manual notes: ''If you have a Class D or CDL, you are licensed
    to drive a street-legal ATV/UTV or FSV.'''
- id: 330
  category: safe_driving_rules
  question: What is the maximum speed a street-legal ATV/UTV or FSV may operate at
    on a highway?
  choices:
    A: 45 miles per hour
    B: The lesser of the posted speed limit or 50 miles per hour
    C: 55 miles per hour
    D: The posted speed limit, regardless of how high it is
  answer: B
  explanation: The street-legal ATV/UTV or FSV operating on a highway may not exceed
    the lesser of the posted speed limit or 50 miles per hour.
- id: 331
  category: safe_driving_rules
  question: If operating a street-legal ATV/UTV on a highway with a posted speed limit
    higher than 50 mph, where must the operator drive?
  choices:
    A: In the center lane
    B: On the extreme left-hand side of the roadway
    C: On the extreme right-hand side of the roadway
    D: On the unpaved shoulder only
  answer: C
  explanation: If operating on a highway with a posted speed higher than 50 miles
    per hour, the operator shall operate the street-legal ATV/UTV or an FSV on the
    extreme right-hand side of the roadway.
- id: 332
  category: driver_responsibility
  question: Over the 10-year period from 2014 to 2024, at what hour did the most pedestrian
    deaths occur?
  choices:
    A: 6 p.m.
    B: 7 p.m.
    C: 9 p.m.
    D: 10 p.m.
  answer: C
  explanation: According to the pedestrian stats over 10 years (2014-2024), the hour
    with the most pedestrian deaths was 9 p.m. with 52 fatalities.
- id: 333
  category: vehicle_information
  question: What is the minimum tire tread depth required for a street-legal ATV or
    UTV?
  choices:
    A: 1/32 inches
    B: 2/32 inches
    C: 3/32 inches
    D: 4/32 inches
  answer: B
  explanation: According to the manual, street-legal ATVs must have tires with at
    least 2/32 inches or greater tire tread.
- id: 334
  category: safe_driving_rules
  question: At what age are you no longer legally required to wear a DOT-approved
    helmet while operating a street-legal ATV or UTV?
  choices:
    A: 18 years of age
    B: 19 years of age
    C: 21 years of age
    D: 25 years of age
  answer: C
  explanation: The manual states that anyone younger than 21 years of age is required
    to wear a DOT-approved helmet.
- id: 335
  category: safe_driving_rules
  question: Unless signs indicate otherwise or it is allowed by local law, you may
    not park your vehicle closer than how many feet from a railroad crossing?
  choices:
    A: 15 feet
    B: 25 feet
    C: 50 feet
    D: 100 feet
  answer: C
  explanation: You must not park closer than 50 feet from a railroad crossing unless
    signs indicate that you may or it is allowed by local law.
- id: 336
  category: defensive_driving
  question: If you stop at a railroad crossing and suspect the flashing lights are
    not working properly, under what condition may you proceed?
  choices:
    A: Immediately, as long as you honk your horn
    B: Only if you have a clear line of sight of at least one mile down the tracks
      in both directions
    C: After waiting exactly two minutes
    D: You must wait for law enforcement to arrive
  answer: B
  explanation: If you suspect the flashing lights are not working properly, you may
    drive through only if you have a clear line of sight of at least one mile down
    the tracks in both directions, there is no evidence of an approaching train, and
    you can cross safely.
- id: 337
  category: signs_and_signals
  question: What does a sign posted below a railroad crossbuck indicate?
  choices:
    A: The speed limit of the train
    B: The distance to the next crossing
    C: The number of tracks at the crossing
    D: The clearance height of the crossing
  answer: C
  explanation: If there is more than one set of tracks, a sign below the crossbuck
    indicates the number of tracks.
- id: 338
  category: sharing_the_road
  question: What must the driver of a school bus never do while crossing railroad
    tracks?
  choices:
    A: Stop before the tracks
    B: Listen for approaching trains
    C: Shift gears on the crossing
    D: Check both directions
  answer: C
  explanation: The driver of a school bus must check both directions and listen to
    approaching trains, proceed only when safe, and never shift gears on the crossing.
- id: 339
  category: sharing_the_road
  question: Who has the right-of-way at a railroad crossing?
  choices:
    A: Emergency vehicles such as ambulances and fire engines
    B: Pedestrians
    C: The train, 100% of the time
    D: Whoever arrives at the crossing first
  answer: C
  explanation: Trains have the right-of-way 100% of the time—over ambulances, fire
    engines, cars, the police, and pedestrians.
- id: 340
  category: defensive_driving
  question: Under ideal conditions, approximately how much distance does a 100-car
    freight train traveling at 55 mph need to stop once emergency braking is applied?
  choices:
    A: 500 feet
    B: Half a mile
    C: More than a mile
    D: Two miles
  answer: C
  explanation: Once the train is set into emergency braking, a 100-car freight train
    traveling at 55 mph will need more than a mile to stop—that’s approximately 18
    football fields.
- id: 341
  category: defensive_driving
  question: If your vehicle stalls on a railroad crossing and a train is approaching,
    what is the safest course of action?
  choices:
    A: Stay in the vehicle and call 911
    B: Get out and run down the tracks in the same direction the train is traveling
    C: Get out and run toward the approaching train at an angle away from the tracks
    D: Try to push the vehicle off the tracks before the train arrives
  answer: C
  explanation: If a train is coming, stay clear of the tracks and run toward the approaching
    train at an angle away from the train. Moving toward the approaching train will
    make you less likely to be hit by flying debris.
- id: 342
  category: sharing_the_road
  question: Why is it dangerous to try and beat a TRAX light rail train through a
    crossing?
  choices:
    A: They are completely silent
    B: They can accelerate to 65 mph within 21 seconds
    C: They do not have brakes
    D: They are not required to use warning lights
  answer: B
  explanation: Light rail vehicles accelerate quickly and reach speeds up to 65 mph
    within 21 seconds. Never try to beat a light rail train through a railroad crossing.
- id: 343
  category: signs_and_signals
  question: What does an overhead sign flashing the logo of a train indicate at a
    light rail intersection?
  choices:
    A: You must come to a complete stop immediately
    B: The tracks are currently out of service
    C: A train is approaching and you should pay extra attention to traffic signals
    D: You have the right-of-way over the train
  answer: C
  explanation: The flashing train logo means a train is approaching the area; you
    should pay extra attention to obey traffic signals at these intersections. It
    is merely an additional warning device, not an indication to stop.
- id: 344
  category: driver_testing
  question: Which of the following Advanced Driver Assistance Systems (ADAS) features
    are you NOT allowed to use during your driving skills test?
  choices:
    A: Blind spot warning
    B: Backup camera
    C: Forward collision warning
    D: Parking assist
  answer: D
  explanation: When taking your driving skills test, you cannot use certain safety
    features, such as parking assist and cruise control.
- id: 345
  category: safe_driving_rules
  question: Which of the following actions is prohibited when approaching a railroad
    crossing?
  choices:
    A: Turning down your car radio
    B: Passing a car that is going your direction
    C: Slowing down before the tracks
    D: Stopping 20 feet from the nearest rail
  answer: B
  explanation: The manual explicitly states to "Never pass a car that is going your
    direction at a railroad crossing."
- id: 346
  category: sharing_the_road
  question: How far can a train extend outside the steel rail, making the safety zone
    for pedestrians wider than the tracks?
  choices:
    A: One foot
    B: Two feet
    C: Three feet or more
    D: Five feet or more
  answer: C
  explanation: A train may extend three feet or more outside the steel rail, making
    the safety zone for pedestrians well beyond the rails.
- id: 347
  category: driver_testing
  question: Which of the following safety features are you prohibited from using during
    your driving skills test?
  choices:
    A: Anti-lock braking systems (ABS)
    B: Parking assist and cruise control
    C: Windshield wipers and defrosters
    D: Turn signals and headlights
  answer: B
  explanation: When taking your driving skills test, you cannot use certain safety
    features, such as parking assist and cruise control.
- id: 348
  category: vehicle_information
  question: How should you apply the brakes in a slippery situation if your vehicle
    is equipped with ABS (Anti-lock Braking System)?
  choices:
    A: Pump the brakes rapidly
    B: Apply constant and firm pressure
    C: Lightly tap the brakes
    D: Apply the parking brake instead
  answer: B
  explanation: If your vehicle is equipped with ABS brakes, it is unnecessary to pump
    them when braking in a slippery situation; apply constant and firm pressure, and
    your vehicle will make a smooth, safe stop.
- id: 349
  category: vehicle_information
  question: If a load extends four feet or more beyond the bed or body of a vehicle,
    what must be displayed on the rear of the load during the daytime?
  choices:
    A: Two red reflectors
    B: One amber flashing light
    C: Two flags that are at least 12 inches square
    D: A sign stating 'Oversized Load'
  answer: C
  explanation: Each vehicle that carries a load extending four feet or more beyond
    the bed or body of the vehicle must display two flags or lights located on the
    rear of the load. The flags may be used only during the daytime and must be at
    least 12 inches square.
- id: 350
  category: vehicle_information
  question: What is the minimum distance that high-beam headlights must be able to
    shine?
  choices:
    A: 100 feet
    B: 200 feet
    C: 350 feet
    D: 500 feet
  answer: C
  explanation: All vehicles, except motorcycles, must have at least two operational
    headlights (one on each side), that are white in color and can shine 350 feet
    on high and 100 feet on low beams.
- id: 351
  category: vehicle_information
  question: Under normal conditions, from what minimum distance must a motor vehicle's
    horn be heard?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: All motor vehicles must have one functioning horn which must be heard
    under normal conditions from a distance of no less than 200 feet.
- id: 352
  category: vehicle_information
  question: 'A vehicle''s license plate light must make the license number readable
    from a distance of at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 350 feet
  answer: A
  explanation: All vehicles will have one white light mounted on the rear of the vehicle
    so that the license number may be read at a distance of at least 50 feet.
- id: 353
  category: safe_driving_rules
  question: Which vehicles are permitted to use red or blue lights visible from the
    front of the vehicle?
  choices:
    A: Any vehicle manufactured after 2010
    B: Vehicles transporting hazardous materials
    C: Emergency, school, snow removal, or other authorized vehicles
    D: Commercial trucks over 10,500 pounds
  answer: C
  explanation: Red or blue lights visible from the front of a vehicle may not be used
    except by emergency, school, snow removal, or other authorized vehicles.
- id: 354
  category: safe_driving_rules
  question: When towing another vehicle, what is the maximum allowed length for the
    drawbar or connection between the vehicles?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: The drawbar or other connections between any tow vehicles may not exceed
    15 feet in length from one vehicle to the other.
- id: 355
  category: safe_driving_rules
  question: When towing a vehicle using a chain, rope, or cable, what must be attached
    to the connecting device?
  choices:
    A: A white light visible from 500 feet
    B: A red flag no smaller than 12 inches square
    C: Two amber reflectors
    D: A flashing yellow beacon
  answer: B
  explanation: When a connection consists of a chain, rope, or cable, a red flag or
    other signal shall be attached to the connecting device. The flag shall be no
    smaller than 12 inches square (one-foot square).
- id: 356
  category: vehicle_information
  question: Vehicles transporting explosive or flammable materials are prohibited
    from using which of the following warning devices?
  choices:
    A: Red electric lights
    B: Portable red emergency reflectors
    C: Flares or fuses
    D: Red flags with standards
  answer: C
  explanation: Vehicles transporting explosive or flammable materials may not use
    flares or fuses. Flares and fuses may not be carried in vehicles transporting
    explosives, flammable liquids or compressed gas.
- id: 357
  category: safe_driving_rules
  question: According to the manual, which of the following is explicitly mentioned
    as something that could illegally obstruct your vision if placed on or near the
    windshield?
  choices:
    A: A toll pass sticker
    B: Something hanging from the rearview mirror
    C: A dashboard camera
    D: A steering wheel cover
  answer: B
  explanation: Your windshield must be clean of dirt, frost, or anything else that
    might obstruct your vision while driving (such as something hanging from the rearview
    mirror).
- id: 358
  category: safe_driving_rules
  question: If your vehicle is 80 inches wide or 30 feet long and breaks down on a
    one-way street, where should the rear flag be placed?
  choices:
    A: 10 feet to the rear
    B: 50 feet to the rear
    C: 100 feet to the rear
    D: 200 feet to the rear
  answer: D
  explanation: On a one-way street, the rear flag should be placed 200 feet to the
    rear.
- id: 359
  category: vehicle_information
  question: 'Turn signals must be visible in normal sunlight from a distance of at
    least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Turn signals must be mounted on the rear and front of each vehicle.
    These lights must be visible from 100 feet in normal sunlight.
- id: 360
  category: vehicle_information
  question: At what height must reflectors be mounted on a vehicle?
  choices:
    A: Not less than 10 inches or more than 40 inches above the ground
    B: Not less than 15 inches or more than 60 inches above the ground
    C: Exactly 24 inches above the ground
    D: As high as the roofline of the vehicle
  answer: B
  explanation: The reflectors must be visible from 500 feet at night and placed not
    less than 15 inches or more than 60 inches above the ground.
- id: 361
  category: defensive_driving
  question: Which of the following is a known limitation of Advanced Driver Assistance
    Systems (ADAS) safety features?
  choices:
    A: They only work when the vehicle is traveling above 50 mph
    B: They may not work correctly in rain, snow, ice, fog, hills, and curves
    C: They completely replace the need for the driver to perform head checks
    D: They drain the vehicle's battery within 10 minutes of use
  answer: B
  explanation: Safety features may not work correctly in rain, snow, ice, fog, hills,
    and curves. Drivers must remain engaged and not rely on safety features alone.
- id: 362
  category: safe_driving_rules
  question: How far from the rear of your vehicle should you place a warning device
    on the traffic side?
  choices:
    A: At least 10 feet
    B: Exactly 50 feet
    C: No more than 5 feet
    D: At least 100 feet
  answer: A
  explanation: The manual states to place a warning device on the traffic side of,
    and not less than 10 feet from, the rear of your vehicle.
- id: 363
  category: vehicle_information
  question: Which of the following vehicles are prohibited from carrying flares and
    fuses?
  choices:
    A: Vehicles transporting passengers for hire
    B: Vehicles transporting explosives, flammable liquids, or compressed gas
    C: Commercial vehicles weighing over 26,000 pounds
    D: Vehicles towing a recreational trailer
  answer: B
  explanation: According to the manual, flares and fuses may not be carried in vehicles
    transporting explosives, flammable liquids, or compressed gas.
- id: 364
  category: safe_driving_rules
  question: 'Warning devices do not need to be displayed if there is sufficient light
    to reveal persons or vehicles from a distance of:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Warning devices need not be displayed if sufficient light reveals persons
    or vehicles from 1,000 feet.
- id: 365
  category: safe_driving_rules
  question: If your vehicle breaks down within 500 feet of a curve or hilltop, what
    is the maximum distance away from the vehicle you may place a warning device?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: If your vehicle breaks down near an obstruction like a curve or hilltop,
    the warning device may not be placed more than 500 feet away from the vehicle.
- id: 366
  category: safe_driving_rules
  question: Why is it illegal to attach a flare or fuse to your vehicle?
  choices:
    A: It can blind approaching drivers
    B: It is a hazardous action
    C: It damages the vehicle's paint
    D: It prevents the flare from burning completely
  answer: B
  explanation: 'The manual states: ''Do not attach any flare or fuse to your vehicle.
    Not only is this a hazardous action, but it is also illegal.'''
- id: 367
  category: vehicle_information
  question: What is a common cause of heat buildup that can result in a tire fire?
  choices:
    A: Driving on a freshly paved road
    B: Driving for an extended period on a soft or flat tire
    C: Using the air conditioning on steep hills
    D: Over-inflating the tires before a long trip
  answer: B
  explanation: Never drive for an extended period of time on a soft or flat tire or
    with a brake that is dragging, as these situations can result in heat buildup
    and cause a tire fire.
- id: 368
  category: defensive_driving
  question: If a tire fire occurs and you cannot get the tire off, what is recommended
    as a better alternative to just waiting?
  choices:
    A: Spraying the tire with a small fire extinguisher
    B: Pouring gasoline on the tire to burn it out faster
    C: Driving until the tire burns off the rim or you reach a water source
    D: Abandoning the vehicle immediately and walking away
  answer: C
  explanation: If you cannot get the tire off, try driving until the tire burns off
    the rim or until you reach a good water source. This alternative is certainly
    better than just waiting and letting the vehicle burn up.
- id: 369
  category: defensive_driving
  question: When fighting a vehicle fire with an extinguisher, how should you position
    yourself in relation to the wind?
  choices:
    A: Fight the fire facing into the wind
    B: Fight the fire with the wind at your back
    C: Fight the fire perpendicular to the wind direction
    D: Wind direction does not matter when using an extinguisher
  answer: B
  explanation: Fight fires with the wind at your back. Your efforts will be more effective
    and you will avoid having poisonous or caustic gases blown into your face.
- id: 370
  category: defensive_driving
  question: Why should you avoid using water to fight a gasoline or oil fire?
  choices:
    A: Water will evaporate too quickly to be effective
    B: Water will only spread the fire
    C: Water creates toxic smoke when mixed with oil
    D: Water will ruin the vehicle's engine components
  answer: B
  explanation: The manual warns to be familiar with different types of fires, noting
    that fighting a gasoline or oil fire with water will only spread the fire.
- id: 371
  category: driver_responsibility
  question: According to the manual, one organ donor can potentially save the lives
    of how many people?
  choices:
    A: Two
    B: Four
    C: Eight
    D: Twelve
  answer: C
  explanation: One organ donor can potentially save the lives of eight people.
- id: 372
  category: license_system
  question: 'When applying for a driver license, a $1.00 voluntary contribution to
    the ''Out and About'' Homebound Transportation Assistance Fund is used for:'
  choices:
    A: Vision screening for children
    B: Statewide organ donation registries
    C: Public transportation assistance for seniors or people with disabilities
    D: Highway cleanup and maintenance
  answer: C
  explanation: The Mobility Assistance funds will be used for public transportation
    assistance for seniors or people with disabilities.
- id: 373
  category: license_system
  question: How many individuals can a Utah license holder provide to the Emergency
    Contact Database to be contacted by law enforcement in an emergency?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: A Utah license certificate holder or identification card holder may
    provide the division with information for two individuals who may be contacted
    by law enforcement in the event of a motor vehicle crash or other emergency.
- id: 374
  category: penalties_and_points
  question: Under Utah law, what is the legal classification for the crime of identity
    fraud?
  choices:
    A: A class B misdemeanor
    B: A class A misdemeanor
    C: An infraction
    D: A felony
  answer: D
  explanation: The manual explicitly states that 'Identity fraud is a felony.'
- id: 375
  category: safe_driving_rules
  question: If your vehicle is stopped entirely off the road, where should you place
    your warning devices?
  choices:
    A: In the center of the nearest traffic lane
    B: On the shoulder of the road as close as possible to the road surface
    C: At least 10 feet off the shoulder into the grass or dirt
    D: Directly on top of the vehicle's roof
  answer: B
  explanation: If your vehicle is entirely off the road, place the devices on the
    shoulder of the road as close as possible to the road surface.
- id: 376
  category: license_system
  question: In Utah, which agency is responsible for handling driver licenses and
    identification cards?
  choices:
    A: Division of Motor Vehicles (DMV)
    B: Driver License Division (DLD)
    C: Department of Transportation (DOT)
    D: Division of Parks and Recreation
  answer: B
  explanation: According to the manual, vehicle registration is handled by the DMV,
    while driver license and identification cards are handled through the Driver License
    Division (DLD).
- id: 377
  category: vehicle_information
  question: Under what conditions is a trailer exempt from being required to be registered
    in Utah?
  choices:
    A: If it weighs less than 1,000 pounds when empty
    B: If it weighs less than 750 pounds when empty and is not used for commercial
      purposes
    C: If it is only used for agricultural purposes
    D: If it weighs less than 500 pounds and is used for commercial purposes
  answer: B
  explanation: The manual states that trailers weighing less than 750 pounds when
    empty and not used for commercial purposes are not required to be registered,
    though they may be registered for convenience.
- id: 378
  category: vehicle_information
  question: How many days per year can a non-resident use their watercraft in Utah
    before they are required to register it in the state?
  choices:
    A: More than 30 days
    B: More than 45 days
    C: More than 60 days
    D: More than 90 days
  answer: C
  explanation: Non-residents using their watercraft in Utah for more than 60 days
    per year must register in Utah.
- id: 379
  category: safe_driving_rules
  question: 'To save gas and prevent pollution, you should turn off your engine and
    restart it if you expect to idle for more than:'
  choices:
    A: 10 seconds
    B: 30 seconds
    C: 60 seconds
    D: 2 minutes
  answer: B
  explanation: The manual advises that you will save gas by turning the engine off
    and restarting it again if you expect to idle for more than 30 seconds.
- id: 380
  category: vehicle_information
  question: What is the recommended way to warm up a modern vehicle in cold temperatures?
  choices:
    A: Idle the engine for at least 10 minutes before driving
    B: Rev the engine repeatedly while in park
    C: Drive the vehicle, as modern vehicles need little warm-up and are most efficient
      when driven
    D: Turn on the heater and let the car idle until the interior is warm
  answer: C
  explanation: Modern vehicles need little warm-up; they are most efficient when being
    driven. Idling for long periods in cold weather can actually cause excessive engine
    wear.
- id: 381
  category: vehicle_information
  question: When refueling your vehicle, why is it recommended to avoid 'topping off'
    the gas tank, especially in hot weather?
  choices:
    A: It can cause the fuel pump to break
    B: It increases the octane level of the fuel
    C: Spilled gasoline evaporates and pollutes the air
    D: It causes the engine to run too rich
  answer: C
  explanation: The manual states that spilled gasoline pollutes the air when it evaporates,
    so it's best to avoid 'topping off' to prevent spills and overfills.
- id: 382
  category: vehicle_information
  question: What does the octane rating of gasoline actually measure?
  choices:
    A: The power output of the fuel
    B: The overall quality and purity of the fuel
    C: How much the fuel can be compressed before it spontaneously combusts
    D: The amount of lead additives in the fuel
  answer: C
  explanation: Octane is a measure of how much a fuel can be compressed in an engine
    before it spontaneously combusts. It is not a measure of fuel power or quality.
- id: 383
  category: alcohol_drugs_health
  question: 'If you are under 21 years of age and drive with any measurable amount
    of alcohol in your body, your driving privileges will be denied for:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: According to the sample test questions in Section 10, if you are under
    21 and driving with any measurable amount of alcohol in your body, your driving
    privileges will be denied for 6 months.
- id: 384
  category: penalties_and_points
  question: If you are under 21 and convicted of your first DUI, how long are you
    automatically restricted to driving a vehicle with an ignition interlock device?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: D
  explanation: The manual's sample test section states that an under-21 driver convicted
    of a first DUI is automatically restricted to driving a vehicle with an ignition
    interlock device for 3 years.
- id: 385
  category: license_system
  question: Which class of driver license must you apply for if you want to drive
    a 'regular' passenger car in Utah?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class D
  answer: D
  explanation: According to Section 4 of the sample test questions, applying for a
    regular driver license to drive a 'regular' car requires a Class D license.
- id: 386
  category: safe_driving_rules
  question: In a construction zone where two lanes merge into one, drivers should
    use both lanes of traffic until the merge point. What is this method called?
  choices:
    A: The Banana method
    B: The Zipper method
    C: The Exchange method
    D: The Alternating method
  answer: B
  explanation: The manual identifies the practice of using both lanes of traffic until
    the merge point in a construction zone as the 'Zipper method'.
- id: 387
  category: signs_and_signals
  question: What color line markings on the roadway indicate that vehicles are traveling
    in the same direction?
  choices:
    A: White
    B: Yellow
    C: Black
    D: Red
  answer: A
  explanation: White line markings on the roadway indicate that vehicles are traveling
    in one direction.
- id: 388
  category: driver_testing
  question: In Utah, what type of test are third-party testers authorized to administer?
  choices:
    A: Written knowledge tests only
    B: Driving skills tests only
    C: Both written knowledge and driving skills tests
    D: Vision tests only
  answer: B
  explanation: According to the Section 6 sample test questions, third-party testers
    are available to administer driving skills tests.
- id: 389
  category: license_system
  question: If you are 17 years of age or younger, how long must you hold a learner
    permit before you can get your driver license?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: The Section 3 sample test questions confirm that if you are 17 years
    of age or younger, you need to hold a learner permit for 6 months.
- id: 390
  category: license_system
  question: How can you find the office hours for a Driver License Field Office and
    schedule an appointment?
  choices:
    A: By calling the local police department
    B: By visiting the Driver License website
    C: By mailing a request form
    D: By visiting the office in person only
  answer: B
  explanation: The manual instructs drivers to visit their website for office hours
    and to schedule an appointment.
- id: 391
  category: license_system
  question: In which city is the Fairpark Driver License Field Office located?
  choices:
    A: Draper
    B: South Ogden
    C: Salt Lake
    D: Taylorsville
  answer: C
  explanation: The Fairpark full-time office is located at 1095 Motor Ave. in Salt
    Lake.
- id: 392
  category: license_system
  question: Which of the following Driver License Field Offices operates as a part-time
    office?
  choices:
    A: Beaver
    B: Farmington
    C: Orem
    D: Heber
  answer: A
  explanation: According to the field office directory, the Beaver office is a part-time
    office, while Farmington, Orem, and Heber are full-time.
- id: 393
  category: license_system
  question: Where is the South Valley full-time Driver License Field Office located?
  choices:
    A: Hurricane
    B: Draper
    C: South Ogden
    D: Taylorsville
  answer: B
  explanation: The South Valley full-time office is located at 14555 S Minuteman Dr.
    in Draper.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 394
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 395
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 396
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 397
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 398
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 399
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 400
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 401
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
