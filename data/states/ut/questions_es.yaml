questions:
- id: 1
  category: sharing_the_road
  question: Según el Manual del Conductor de Utah, ¿qué reglas debe seguir un ciclista?
  choices:
    A: Solo las reglas para peatones y las leyes de derecho de paso en las aceras
    B: Las reglas de tránsito con los mismos derechos y deberes que el conductor de
      un vehículo motorizado
    C: Reglas especiales exclusivas para bicicletas que reemplazan las leyes estándar
      de vehículos motorizados
    D: Las bicicletas se consideran equipo recreativo y no están obligadas a seguir
      las reglas de tránsito
  answer: B
  explanation: El manual establece que un ciclista debe obedecer las reglas de tránsito
    y tiene los mismos derechos y deberes que el conductor de un vehículo motorizado
    u otro vehículo.
- id: 2
  category: license_system
  question: ¿Cuál de los siguientes servicios es gestionado por el Departamento de
    Vehículos Motorizados (DMV) en lugar de la División de Licencias de Conducir (DLD)?
  choices:
    A: Registro de votantes
    B: Tarifas de restablecimiento
    C: Placas y títulos de vehículos
    D: Licencias de Conducir Comerciales (CDL)
  answer: C
  explanation: El manual aclara que la División de Licencias de Conducir no forma
    parte del DMV, y que el DMV se encarga de todas las necesidades de su vehículo,
    como placas y títulos.
- id: 3
  category: penalties_and_points
  question: Bajo las nuevas Enmiendas de Seguridad para Motocicletas HB 234, ¿qué
    sucede si una persona es multada por conducir una motocicleta sin un endoso?
  choices:
    A: La motocicleta es confiscada permanentemente por el estado.
    B: El tribunal anulará la multa si la persona obtiene un endoso de motocicleta
      dentro de los 30 días.
    C: La licencia de conducir de la persona se suspende automáticamente por un año.
    D: La multa se duplica si es la primera infracción.
  answer: B
  explanation: La ley HB 234 aumenta la multa por conducir una motocicleta sin un
    endoso, pero señala que el tribunal anulará la multa si la persona obtiene un
    endoso de motocicleta dentro de los 30 días.
- id: 4
  category: license_system
  question: Según la ley HB 308, ¿bajo qué condición puede una persona con un permiso
    de aprendizaje menor de 18 años conducir con un adulto que no sea su padre o madre?
  choices:
    A: Si el padre, madre o tutor legal no es un conductor con licencia, siempre que
      el adulto tenga evidencia de autorización.
    B: Si el adulto tiene al menos 18 años y posee un permiso de aprendizaje válido.
    C: Si el menor ha completado al menos 10 horas de educación vial profesional.
    D: A los menores de 18 años nunca se les permite conducir con nadie que no sea
      su padre, madre o tutor legal.
  answer: A
  explanation: La ley HB 308 permite que una persona con un permiso de aprendizaje
    menor de 18 años conduzca con un adulto que no sea su padre o madre si el padre,
    madre o tutor legal no es un conductor con licencia, y el adulto tiene evidencia
    de autorización del padre, madre o tutor.
- id: 5
  category: alcohol_drugs_health
  question: A partir del 1 de enero de 2026, ¿qué significa la designación de 'persona
    interdicta' para un conductor condenado por un DUI extremo?
  choices:
    A: Se les requiere volver a tomar el examen de habilidades de conducción anualmente.
    B: Se les prohíbe comprar alcohol durante un período de tiempo determinado.
    C: Deben instalar un dispositivo de interbloqueo de encendido en todos los vehículos
      de su propiedad.
    D: Se les prohíbe permanentemente operar cualquier vehículo motorizado.
  answer: B
  explanation: Bajo la ley HB 437, una persona designada como persona interdicta tendrá
    prohibido comprar alcohol durante un período de tiempo determinado.
- id: 6
  category: license_system
  question: ¿Cómo se distinguirá visualmente una licencia de conducir o tarjeta de
    identificación de una persona interdicta?
  choices:
    A: Estará impresa verticalmente en lugar de horizontalmente.
    B: Tendrá un fondo amarillo sólido.
    C: Tendrá una franja roja en la parte superior que dirá 'NO ALCOHOL SALE'.
    D: Tendrá una perforación sobre la fecha de vencimiento.
  answer: C
  explanation: Según la ley HB 437, una licencia de conducir o tarjeta de identificación
    (DL/IDC) de una persona interdicta tendrá una franja roja en la parte superior
    de la tarjeta que dirá 'NO ALCOHOL SALE'.
- id: 7
  category: penalties_and_points
  question: A partir del 1 de enero de 2026, ¿cuál de las siguientes infracciones
    requerirá que la DLD suspenda el endoso de motocicleta o la licencia de conducir
    de una persona?
  choices:
    A: Estacionarse en una zona de carga comercial
    B: Hacer un caballito (wheelie) o realizar división de carril (lane splitting)
    C: Conducir a 5 mph sobre el límite de velocidad establecido
    D: No usar un chaleco reflectante por la noche
  answer: B
  explanation: La ley HB 190 requiere que la DLD suspenda el endoso de motocicleta
    o la licencia de conducir de una persona basándose en condenas por no mostrar
    correctamente una placa de matrícula, hacer un caballito (wheelie) o realizar
    división de carril (lane splitting).
- id: 8
  category: alcohol_drugs_health
  question: En diciembre de 2018, ¿Utah se convirtió en el primer estado del país
    en establecer qué límite de concentración de alcohol en sangre (BAC)?
  choices:
    A: '.08'
    B: '.05'
    C: '.04'
    D: '.02'
  answer: B
  explanation: La sección de Historia de la Licencia de Conducir señala que en diciembre
    de 2018, Utah se convirtió en el primer estado del país en tener un límite de
    concentración de alcohol en sangre de .05.
- id: 9
  category: license_system
  question: En enero de 2020, ¿a cuánto tiempo se extendió el período estándar de
    renovación de la licencia de conducir de Utah?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: En enero de 2020, las renovaciones de licencias de conducir se extendieron
    de una renovación cada 5 años a una renovación cada 8 años.
- id: 10
  category: driver_testing
  question: Desde 2016, ¿dónde se realizan todas las pruebas de habilidades de conducción
    en Utah?
  choices:
    A: En una pista cerrada
    B: En vías públicas
    C: Usando un simulador de realidad virtual
    D: Solo en estacionamientos vacíos
  answer: B
  explanation: En 2016, la División de Licencias de Conducir dejó de realizar pruebas
    de habilidades de conducción en pistas cerradas. Todas las pruebas de habilidades
    de conducción se realizan en vías públicas.
- id: 11
  category: safe_driving_rules
  question: ¿Según las estadísticas de 2024, cuál es la causa principal número uno
    de todos los choques en las autopistas de Utah?
  choices:
    A: No ceder el paso
    B: Demasiado rápido para las condiciones
    C: No mantenerse en el carril adecuado
    D: Sobrecorregir/Girar el volante en exceso
  answer: C
  explanation: Las estadísticas muestran que 'No mantenerse en el carril adecuado'
    es la causa principal de todos los choques en las autopistas de Utah, representando
    el 28%.
- id: 12
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es la segunda causa principal de choques en las
    autopistas de Utah para adolescentes (de 15 a 19 años)?
  choices:
    A: Ignorar la señal de tráfico
    B: Seguir demasiado de cerca
    C: Lado equivocado/Sentido contrario
    D: Conducir bajo la influencia (DUI)
  answer: A
  explanation: Para los adolescentes de 15 a 19 años, la segunda causa principal de
    choques es 'Ignorar la señal de tráfico' con un 14%.
- id: 13
  category: safe_driving_rules
  question: ¿Cuál es la causa principal de choques en las autopistas de Utah para
    conductores de 65 años o más?
  choices:
    A: Salirse de la carretera
    B: No ceder el paso
    C: Conducción temeraria/agresiva
    D: Demasiado rápido para las condiciones
  answer: B
  explanation: Para los conductores de 65 años o más, la causa principal de choques
    es 'No ceder el paso' con un 21%.
- id: 14
  category: license_system
  question: Cuando se emitió la primera licencia de conducir en Utah en 1933, ¿por
    cuánto tiempo fue válida?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Válida hasta ser revocada
  answer: D
  explanation: La primera licencia en Utah se emitió el 5 de diciembre de 1933 y era
    'válida hasta ser revocada'.
- id: 15
  category: license_system
  question: Para reducir los tiempos de espera en servicios como los Exámenes de Revisión
    del Conductor y las Tarifas de Restablecimiento, ¿qué recomienda encarecidamente
    la División de Licencias de Conducir (DLD)?
  choices:
    A: Enviar todos los documentos por correo
    B: Programar una cita en línea
    C: Visitar el DMV en su lugar
    D: Llegar exactamente a la hora de apertura para el servicio sin cita previa
  answer: B
  explanation: El manual establece que se deben programar citas para todos los servicios
    para reducir el tiempo de espera, ya que el servicio sin cita previa puede experimentar
    tiempos de espera mucho más largos debido a que las citas tienen prioridad.
- id: 16
  category: vehicle_information
  question: Según el manual, ¿cuál de las siguientes opciones es parte de la preparación
    de su vehículo antes de conducir?
  choices:
    A: Ajustar su asiento y espejos
    B: Revisar las marcas en el pavimento
    C: Rebasar a otros vehículos
    D: Ceder el paso
  answer: A
  explanation: La Sección 7, 'Preparación de su vehículo', incluye específicamente
    ajustar su asiento y ajustar sus espejos antes de conducir.
- id: 17
  category: safe_driving_rules
  question: ¿Cuál de las siguientes maniobras está categorizada bajo 'Conducción Básica'
    en el manual del conductor de Utah?
  choices:
    A: Navegar por zonas de obras viales
    B: Retroceder (Reversa)
    C: Evitar colisiones con animales
    D: Navegar bajo la influencia
  answer: B
  explanation: La Sección 8, 'Conducción Básica', incluye Retroceder (Reversa) como
    una habilidad de conducción fundamental junto con la dirección, el frenado y el
    giro.
- id: 18
  category: signs_and_signals
  question: ¿Dónde se categorizan los 'Semáforos' y las 'Señales de Tráfico' en el
    manual del conductor?
  choices:
    A: Conducción Básica
    B: Reglas de la Carretera
    C: Compartir la Carretera
    D: Distracciones y Desafíos de la Conducción
  answer: B
  explanation: Los semáforos y las señales de tráfico se tratan en la Sección 9, 'Reglas
    de la Carretera'.
- id: 19
  category: alcohol_drugs_health
  question: Según el manual, ¿con qué tema principal se agrupan las reglas relativas
    a 'Navegar bajo la influencia'?
  choices:
    A: Reglas de la Carretera
    B: Choques y Seguros
    C: Alcohol/Drogas y la Conducción
    D: Suspensiones y su Registro
  answer: C
  explanation: '''Navegar bajo la influencia'' se enumera en la Sección 10, ''Alcohol/Drogas
    y la Conducción''.'
- id: 20
  category: defensive_driving
  question: ¿Cuál de los siguientes se identifica como una 'Distracción y Desafío
    de la Conducción' en el manual?
  choices:
    A: Comunicación inalámbrica manual
    B: Ajustar sus espejos
    C: Arrancar el motor
    D: Ceder el paso
  answer: A
  explanation: La Sección 11, 'Distracciones y Desafíos de la Conducción', enumera
    específicamente la comunicación inalámbrica manual como un desafío.
- id: 21
  category: defensive_driving
  question: Según el manual, el manejo de un 'Vehículo sumergido bajo el agua' se
    clasifica como ¿qué tipo de problema?
  choices:
    A: Conducción básica
    B: Distracciones y desafíos al conducir
    C: Reglas de la carretera
    D: Compartir la carretera
  answer: B
  explanation: La información sobre cómo manejar un 'Vehículo sumergido bajo el agua'
    se encuentra en la Sección 11, 'Distracciones y desafíos al conducir'.
- id: 22
  category: driver_responsibility
  question: La 'Ley de Responsabilidad Financiera' (Financial Responsibility Act)
    se analiza en la misma sección que ¿cuál de los siguientes temas?
  choices:
    A: Cobertura de seguro
    B: Sistema de puntos
    C: Visión y salud
    D: Conducción básica
  answer: A
  explanation: Tanto la Ley de Responsabilidad Financiera como la Cobertura de Seguro
    se tratan en la Sección 12, 'Choques y seguros'.
- id: 23
  category: penalties_and_points
  question: Si necesita información sobre el 'Sistema de puntos' por infracciones
    de tránsito, ¿qué sección del manual debe consultar?
  choices:
    A: Sección 6
    B: Sección 9
    C: Sección 11
    D: Sección 13
  answer: D
  explanation: El Sistema de Puntos se detalla en la Sección 13, 'Suspensiones y su
    historial'.
- id: 24
  category: sharing_the_road
  question: De acuerdo con la Sección 14, 'Compartir la carretera', los conductores
    deben saber cómo compartir la vía de manera segura con ¿cuál de los siguientes?
  choices:
    A: Carriles flexibles
    B: Glorietas (rotondas)
    C: Camiones grandes
    D: Zonas de obras en la autopista
  answer: C
  explanation: La Sección 14, 'Compartir la carretera', incluye pautas específicas
    para compartir la vía de manera segura con camiones grandes.
- id: 25
  category: driver_testing
  question: ¿Cuál de los siguientes se enumera como un examen requerido en la Sección
    6?
  choices:
    A: Prueba de la vista (visión)
    B: Examen de seguridad vial y tendencias
    C: Examen de responsabilidad financiera
    D: Prueba del dispositivo de bloqueo de encendido (Ignition Interlock)
  answer: B
  explanation: La Sección 6, 'Exámenes', incluye el Examen de Seguridad Vial y Tendencias.
    (La prueba de la vista se encuentra en la Sección 5).
- id: 26
  category: license_system
  question: ¿Dónde encontraría los requisitos para una 'Licencia de conducir de otro
    estado'?
  choices:
    A: Sección 4
    B: Sección 5
    C: Sección 6
    D: Sección 13
  answer: A
  explanation: La 'Licencia de conducir de otro estado' se enumera en la Sección 4,
    que cubre los requisitos de Licencia de Conducir e Identificación.
- id: 27
  category: safe_driving_rules
  question: 'Según el manual, la ''Conducción en autopistas'' y las ''Glorietas (rotondas)''
    se consideran parte de:'
  choices:
    A: Conducción básica
    B: Reglas de la carretera
    C: Distracciones y desafíos al conducir
    D: Compartir la carretera
  answer: B
  explanation: La conducción en autopistas y las glorietas son temas cubiertos en
    la Sección 9, 'Reglas de la carretera'.
- id: 28
  category: penalties_and_points
  question: ¿Qué sección del manual explica las consecuencias de una 'Licencia alterada
    o ficticia'?
  choices:
    A: Sección 4
    B: Sección 6
    C: Sección 10
    D: Sección 13
  answer: D
  explanation: El tema 'Licencia alterada o ficticia' se trata en la Sección 13, 'Suspensiones
    y su historial'.
- id: 29
  category: sharing_the_road
  question: ¿Cuál de los siguientes NO figura como un tema en la Sección 14, 'Compartir
    la carretera'?
  choices:
    A: Bicicletas
    B: Peatones
    C: Motocicletas
    D: Conducción agresiva
  answer: D
  explanation: La conducción agresiva se enumera en la Sección 11 (Distracciones y
    desafíos al conducir), mientras que las bicicletas, los peatones y las motocicletas
    están en la Sección 14 (Compartir la carretera).
- id: 30
  category: alcohol_drugs_health
  question: Según el manual, la información sobre el 'Conductor con restricción de
    dispositivo de bloqueo de encendido' (Ignition Interlock) se encuentra bajo ¿qué
    tema?
  choices:
    A: Choques y seguros
    B: Alcohol/Drogas y la conducción
    C: Suspensiones y su historial
    D: Preparación de su vehículo
  answer: B
  explanation: El tema 'Conductor con restricción de dispositivo de bloqueo de encendido'
    se trata en la Sección 10, 'Alcohol/Drogas y la conducción'.
- id: 31
  category: defensive_driving
  question: Según el manual del conductor de Utah, ¿cuál de las siguientes acciones
    constituye "Conducción descuidada" (Careless Driving)?
  choices:
    A: Conducir a 10 mph por encima del límite de velocidad indicado
    B: Cometer una infracción de tráfico en movimiento mientras se está distraído
      buscando un objeto en el vehículo
    C: Estacionarse en un lugar designado para personas con discapacidad sin un distintivo
    D: No renovar el registro del vehículo a tiempo
  answer: B
  explanation: Una persona es culpable de conducción descuidada si comete una infracción
    de tráfico en movimiento mientras está distraída por actividades como buscar un
    objeto, higiene personal o aseo.
- id: 32
  category: vehicle_information
  question: Por definición, ¿una bicicleta debe tener ruedas de al menos qué tamaño
    de diámetro?
  choices:
    A: 10 pulgadas
    B: 12 pulgadas
    C: 14 pulgadas
    D: 16 pulgadas
  answer: C
  explanation: Una bicicleta se define como aquella que tiene ruedas de no menos de
    14 pulgadas de diámetro.
- id: 33
  category: license_system
  question: Se requiere una Licencia de Conducir Comercial (CDL) para conducir un
    vehículo con una Clasificación de Peso Bruto del Vehículo (GVWR) de al menos ¿cuántas
    libras?
  choices:
    A: 10,001 lbs
    B: 16,001 lbs
    C: 26,001 lbs
    D: 32,001 lbs
  answer: C
  explanation: Una CDL permite al titular conducir un vehículo con un GVWR de 26,001
    lbs. o más.
- id: 34
  category: license_system
  question: ¿Qué es una Tarjeta de Privilegio de Conducir (Driving Privilege Card)?
  choices:
    A: Un permiso para que personas con discapacidades físicas conduzcan vehículos
      de movilidad
    B: Evidencia del privilegio de conducir obtenida sin proporcionar prueba de presencia
      legal en los EE. UU.
    C: Una licencia temporal que permite privilegios de conducción por hasta seis
      meses
    D: Una licencia emitida a cualquier persona menor de 21 años
  answer: B
  explanation: Una Tarjeta de Privilegio de Conducir es evidencia del privilegio de
    conducir un vehículo motorizado en Utah obtenida sin proporcionar prueba de presencia
    legal en los Estados Unidos.
- id: 35
  category: vehicle_information
  question: 'Un "Vehículo de baja velocidad" (Low-Speed Vehicle) es un vehículo de
    motor eléctrico de cuatro ruedas diseñado para ser operado a velocidades de no
    más de:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: Un vehículo de baja velocidad está diseñado para ser operado a velocidades
    de no más de 25 millas por hora y tiene una capacidad de no más de cuatro pasajeros.
- id: 36
  category: license_system
  question: 'En Utah, se emite una Licencia Provisional a cualquier persona que sea:'
  choices:
    A: Menor de 18 años de edad
    B: Menor de 21 años de edad
    C: Que esté obteniendo su primera licencia de conducir
    D: Que esté conduciendo con un permiso de aprendizaje
  answer: B
  explanation: Una Licencia Provisional se define como una licencia de Utah emitida
    a cualquier persona menor de 21 años de edad.
- id: 37
  category: safe_driving_rules
  question: ¿En qué dirección fluye el tráfico en una rotonda?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En un patrón de figura en ocho
    D: En cualquier dirección que indique la señal de ceda el paso
  answer: B
  explanation: Una rotonda de tráfico se define como una intersección circular donde
    el tráfico fluye en sentido contrario a las agujas del reloj.
- id: 38
  category: penalties_and_points
  question: ¿Cuál es la definición de una "Suspensión" de la licencia?
  choices:
    A: La terminación permanente del privilegio de conducir
    B: El retiro temporal del privilegio de conducir
    C: El retiro de los privilegios de conducir debido a fraude
    D: La terminación de una licencia de conducir comercial
  answer: B
  explanation: La suspensión se define como el retiro temporal del privilegio de conducir,
    mientras que la revocación es la terminación del privilegio.
- id: 39
  category: license_system
  question: Según el manual del conductor de Utah, un "Dependiente" incluye a un cónyuge
    y a cualquier hijo soltero menor de ¿qué edad?
  choices:
    A: '18'
    B: '21'
    C: '24'
    D: '26'
  answer: B
  explanation: Un dependiente se define como un cónyuge y cualquier hijo soltero menor
    de 21 años.
- id: 40
  category: vehicle_information
  question: Un Vehículo para Peatones, destinado a personas con una discapacidad física,
    ¿no debe exceder qué capacidad de velocidad máxima?
  choices:
    A: 15 m.p.h.
    B: 20 m.p.h.
    C: 25 m.p.h.
    D: 30 m.p.h.
  answer: D
  explanation: Un vehículo para peatones no debe exceder las 48 pulgadas de ancho,
    tener un motor de más de 300 centímetros cúbicos o ser capaz de exceder las 30
    m.p.h.
- id: 41
  category: defensive_driving
  question: ¿Cuál es la forma adecuada de realizar una "Revisión de punto ciego" (Head
    Check) antes de mover su vehículo?
  choices:
    A: Mirar por el espejo retrovisor y los espejos laterales
    B: Girar la cabeza y mirar por encima del hombro en la dirección en la que planea
      moverse
    C: Escanear el camino adelante en busca de peatones y obstáculos
    D: Revisar el tablero en busca de luces de advertencia
  answer: B
  explanation: Las revisiones de punto ciego (Head Checks) implican verificar su punto
    ciego girando la cabeza y mirando por encima del hombro en la dirección en la
    que planea moverse.
- id: 42
  category: license_system
  question: ¿A quién se le expide una Licencia de conducir de término limitado (Limited-Term
    Driver License)?
  choices:
    A: A una persona que ha cometido múltiples infracciones de tráfico
    B: A una persona que proporcionó prueba de presencia legal pero no es ciudadano
      estadounidense, nacional estadounidense o residente permanente legal
    C: A un conductor menor de 21 años
    D: A una persona que conduce un vehículo comercial para trabajos agrícolas de
      temporada
  answer: B
  explanation: Una Licencia de conducir de término limitado se expide a una persona
    que proporcionó prueba de presencia legal en los Estados Unidos pero no es ciudadano
    estadounidense, nacional estadounidense o residente permanente legal.
- id: 43
  category: vehicle_information
  question: ¿Cuál de los siguientes NO se considera un "Vehículo motorizado" según
    las definiciones de Utah?
  choices:
    A: Un tractor agrícola
    B: Una motocicleta
    C: Una silla de ruedas motorizada
    D: Un taxi
  answer: C
  explanation: La definición de Vehículo motorizado excluye explícitamente las sillas
    de ruedas motorizadas, los dispositivos eléctricos personales de asistencia a
    la movilidad y los vehículos movidos únicamente por fuerza humana.
- id: 44
  category: vehicle_information
  question: Un Transportista privado de pasajeros es un vehículo motorizado de alquiler
    diseñado para transportar un máximo de ¿cuántos pasajeros, incluyendo al conductor?
  choices:
    A: 10 o menos
    B: 12 o menos
    C: 15 o menos
    D: 16 o menos
  answer: C
  explanation: Un Transportista privado de pasajeros está diseñado para transportar
    15 pasajeros o menos, incluyendo al conductor, y se opera para transportar a un
    empleado de la persona que alquila el vehículo motorizado.
- id: 45
  category: license_system
  question: ¿Por cuánto tiempo permite privilegios de conducción una Licencia de conducir
    temporal?
  choices:
    A: 30 días
    B: 90 días
    C: Seis meses
    D: Un año
  answer: C
  explanation: Una Licencia de conducir temporal es una licencia provisional que permite
    privilegios de conducción por hasta seis meses, y no está disponible para los
    titulares de una tarjeta de privilegio de conducción (DPC).
- id: 46
  category: defensive_driving
  question: ¿Cuál es la definición de una "Revisión de tráfico" (Traffic Check) según
    el manual del conductor de Utah?
  choices:
    A: Un control policial para verificar licencias y registros válidos.
    B: Un escaneo de conducción defensiva en busca de otro tráfico, peatones o cualquier
      otro obstáculo que pueda encontrar.
    C: Una inspección vehicular obligatoria que se realiza cada año.
    D: Una prueba del sistema de frenado del vehículo antes de conducir.
  answer: B
  explanation: El manual define una Revisión de tráfico (Traffic Check) como un escaneo
    de conducción defensiva en busca de otro tráfico, peatones o cualquier otro obstáculo
    que pueda encontrar mientras conduce.
- id: 47
  category: license_system
  question: ¿Cuánto tiempo puede conducir en Utah un visitante con una licencia de
    conducir válida de otro estado o de otro país?
  choices:
    A: Hasta 30 días
    B: Hasta 90 días
    C: Hasta 6 meses
    D: Hasta 1 año
  answer: C
  explanation: Los visitantes con una licencia de conducir válida de otro estado o
    de otro país pueden conducir en Utah por hasta seis meses.
- id: 48
  category: license_system
  question: ¿Cuál de las siguientes acciones convierte a una persona en residente
    de Utah para fines de la licencia de conducir?
  choices:
    A: Permanecer en el estado durante tres meses durante un año calendario.
    B: Estar en una asignación de trabajo temporal en el estado.
    C: Obtener privilegios que no se extienden a los no residentes, incluyendo la
      matrícula escolar.
    D: Visitar a la familia en Utah durante el verano.
  answer: C
  explanation: Las personas se convierten en residentes si obtienen privilegios que
    no se extienden a los no residentes, incluyendo la matrícula escolar. Las asignaciones
    de trabajo temporales no lo convierten en residente, y debe permanecer en el estado
    durante seis meses o más para ser considerado residente solo por el tiempo transcurrido.
- id: 49
  category: driver_testing
  question: ¿Cuántas horas de instrucción al volante se requieren para un curso de
    educación vial aprobado en Utah?
  choices:
    A: 6 horas
    B: 10 horas
    C: 18 horas
    D: 27 horas
  answer: A
  explanation: Las horas requeridas de educación vial incluyen 6 horas de instrucción
    al volante.
- id: 50
  category: driver_testing
  question: Si tiene 19 años de edad o más y nunca ha tenido una licencia, ¿cómo puede
    eximirse del requisito de tener el permiso de aprendizaje por 90 días?
  choices:
    A: Completando 40 horas de conducción con un padre.
    B: Aprobando el examen escrito de conocimientos dos veces.
    C: Completando un curso de educación vial aprobado.
    D: Pagando una tarifa adicional en la División de Licencias de Conducir.
  answer: C
  explanation: Los solicitantes de 19 años de edad o más pueden completar un curso
    de educación vial aprobado y eximirse del requisito de tener el permiso de aprendizaje
    por 90 días.
- id: 51
  category: license_system
  question: ¿Por cuánto tiempo son válidos los resultados del examen de conocimientos
    escrito para un permiso de aprendizaje de nivel inicial?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: C
  explanation: Los resultados del examen de conocimientos escrito para un permiso
    de aprendizaje de nivel inicial son válidos por 18 meses.
- id: 52
  category: safe_driving_rules
  question: Si usted es un conductor de 16 años con licencia, ¿cuáles son sus restricciones
    de conducción nocturna?
  choices:
    A: No puede conducir entre las 10 pm y las 5 am.
    B: No puede conducir entre las 12 am y las 5 am.
    C: No puede conducir entre el atardecer y el amanecer.
    D: No tiene restricciones de conducción nocturna.
  answer: B
  explanation: Para un joven de 16 años con licencia de conducir (no permiso), las
    restricciones de conducción nocturna se aplican de las 12 am a las 5 am, a menos
    que se cumpla una excepción.
- id: 53
  category: safe_driving_rules
  question: ¿Durante cuánto tiempo después de la fecha de emisión tiene restringido
    un conductor de 16 años con licencia llevar únicamente a miembros de su familia
    inmediata en el vehículo?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Un joven de 16 años con licencia de conducir tiene restringido llevar
    únicamente a miembros de su familia inmediata en el vehículo hasta seis meses
    después de la fecha de emisión.
- id: 54
  category: license_system
  question: ¿Cuál de las siguientes personas NO está obligada a obtener una licencia
    de conducir de Utah para conducir en las carreteras de Utah?
  choices:
    A: Una persona que conduce un tractor agrícola en relación con una actividad agrícola.
    B: Una persona que ha sido empleada de manera remunerada en Utah para un trabajo
      permanente.
    C: Una persona que ha permanecido en Utah durante ocho meses durante el año calendario.
    D: Un joven de 15 años que conduce a la escuela.
  answer: A
  explanation: No se requiere que las personas obtengan una licencia de conducir para
    operar aplanadoras, maquinaria vial o tractores agrícolas en las carreteras de
    Utah si conducen el vehículo en relación con una actividad de construcción o agrícola.
- id: 55
  category: penalties_and_points
  question: ¿Cuál es la tarifa administrativa para la reincorporación de la licencia
    por alcohol/drogas en Utah?
  choices:
    A: $40.00
    B: $85.00
    C: $255.00
    D: $340.00
  answer: C
  explanation: De acuerdo con la tabla de Tarifas de Licencia de Conducir, la tarifa
    administrativa para la reincorporación por alcohol/drogas es de $255.00.
- id: 56
  category: license_system
  question: Bajo el Convenio de Licencias de Conducir (DLC), ¿qué sucede cuando un
    conductor recibe una condena de tráfico en otro estado miembro?
  choices:
    A: La condena es ignorada por el estado de origen.
    B: El conductor debe entregar su licencia al estado donde ocurrió la infracción.
    C: La jurisdicción miembro envía la condena por la infracción de tráfico al estado
      de origen del conductor.
    D: El conductor debe volver a tomar el examen de conocimientos escrito en su estado
      de origen.
  answer: C
  explanation: El DLC proporciona pautas para una mayor cooperación entre los miembros,
    donde las jurisdicciones miembros intercambian registros de conductores y envían
    las condenas por infracciones de tráfico al estado de origen del conductor.
- id: 57
  category: driver_testing
  question: ¿Aceptará la División de Licencias de Conducir de Utah un certificado
    de un curso de educación vial en línea o de estudio en casa realizado fuera del
    estado?
  choices:
    A: Sí, si cumple con las horas requeridas por Utah.
    B: Sí, pero solo para solicitantes mayores de 18 años.
    C: No, no se aceptarán certificados de cursos en línea o de estudio en casa realizados
      fuera del estado.
    D: No, a menos que el solicitante pague una tarifa de transferencia de fuera del
      estado.
  answer: C
  explanation: 'El manual establece explícitamente: ''No se aceptarán certificados
    de cursos en línea o de estudio en casa realizados fuera del estado''.'
- id: 58
  category: driver_responsibility
  question: ¿Cuántas horas de conducción debe completar un solicitante de entre 15
    y 18 años con un padre o tutor legal antes de obtener la licencia?
  choices:
    A: 27 horas (5 horas después del atardecer)
    B: 30 horas (10 horas después del atardecer)
    C: 40 horas (10 horas después del atardecer)
    D: 50 horas (15 horas después del atardecer)
  answer: C
  explanation: Un estudiante debe completar 40 horas de conducción (10 horas después
    del atardecer) con un padre o tutor legal.
- id: 59
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener un permiso de aprendizaje
    de nivel inicial en Utah?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: B
  explanation: El permiso de aprendizaje de nivel inicial le autoriza a conducir un
    vehículo motorizado regular si ha alcanzado la edad mínima de 15 años.
- id: 60
  category: license_system
  question: 'De acuerdo con la ley de Utah con respecto a los certificados que cumplen
    con la ley REAL ID, usted puede:'
  choices:
    A: Poseer una licencia de conducir de Utah y una identificación de Colorado al
      mismo tiempo.
    B: No poseer más de un certificado que cumpla con la ley REAL ID a la vez.
    C: Poseer hasta tres certificados que cumplan con la ley REAL ID de diferentes
      estados.
    D: Conservar su REAL ID de fuera del estado indefinidamente después de convertirse
      en residente de Utah.
  answer: B
  explanation: Por ley, no puede poseer más de un certificado que cumpla con la ley
    REAL ID a la vez (por ejemplo, una licencia de conducir de Utah y una identificación
    de Colorado).
- id: 61
  category: license_system
  question: ¿Cuál es el cargo por la renovación de una licencia de conducir regular
    Clase D para un solicitante menor de 65 años?
  choices:
    A: $23.00
    B: $27.00
    C: $40.00
    D: $52.00
  answer: D
  explanation: De acuerdo con la tabla de cargos del manual, el costo de una renovación
    estándar es de $52.00, mientras que una renovación para mayores de 65 años es
    de $27.00.
- id: 62
  category: license_system
  question: ¿Cuál es el peso máximo del vehículo que se le permite conducir a una
    persona con una licencia de conducir regular Clase D?
  choices:
    A: 10,001 libras
    B: 16,000 libras
    C: 26,000 libras
    D: 32,000 libras
  answer: C
  explanation: Una licencia de conducir regular Clase D le permite conducir todos
    los vehículos personales de hasta 26,000 libras.
- id: 63
  category: license_system
  question: ¿Por qué se les emite una licencia de conducir regular Clase D provisional
    a los solicitantes menores de 21 años?
  choices:
    A: Para restringirles la conducción nocturna
    B: Con el propósito de utilizar un sistema de puntos separado
    C: Porque no se les permite llevar pasajeros
    D: Para exigirles que conduzcan con un adulto con licencia
  answer: B
  explanation: El manual establece que a los solicitantes menores de 21 años se les
    emite una licencia de conducir regular Clase D provisional con el fin de utilizar
    un sistema de puntos por separado.
- id: 64
  category: license_system
  question: ¿Cuándo vence una Tarjeta de Privilegio de Conducir (DPC)?
  choices:
    A: Cada 5 años en el cumpleaños del solicitante
    B: Cada año en el cumpleaños del solicitante
    C: Seis meses después de la fecha de emisión
    D: En la fecha de vencimiento de la visa del solicitante
  answer: B
  explanation: El manual especifica que la Tarjeta de Privilegio de Conducir (DPC)
    vence cada año en el cumpleaños del solicitante.
- id: 65
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para obtener una licencia Clase C
    para transportar materiales peligrosos?
  choices:
    A: 16 años de edad
    B: 18 años de edad
    C: 19 años de edad
    D: 21 años de edad
  answer: D
  explanation: La tabla del sistema de licencias clasificadas indica que el requisito
    de edad mínima para una licencia Clase C (que incluye el transporte de cantidades
    de materiales peligrosos que requieren carteles de advertencia) es de 21 años.
- id: 66
  category: license_system
  question: ¿Qué código de endoso se requiere en una licencia para operar un taxi?
  choices:
    A: T
    B: P
    C: Z
    D: X
  answer: C
  explanation: Bajo la sección de Códigos de Endoso, la 'Z' figura como el endoso
    para un taxi (Taxicab).
- id: 67
  category: license_system
  question: Si un conductor tiene una restricción 'B' en su licencia, ¿qué significa
    esto?
  choices:
    A: Debe usar lentes correctivos al conducir
    B: Está restringido a conducir únicamente durante las horas del día
    C: Debe conducir un vehículo con transmisión automática
    D: Está restringido a operar un vehículo motorizado en carreteras con una velocidad
      máxima de 40 mph o menos
  answer: A
  explanation: 'El manual enumera la restricción ''B'' como: ''El conductor debe usar
    lentes correctivos''.'
- id: 68
  category: license_system
  question: ¿Qué indica una restricción 'G' en una licencia de conducir?
  choices:
    A: Restringido a conducir un vehículo con espejos retrovisores exteriores
    B: Restringido a conducir únicamente durante las horas del día
    C: Restringido a operar un ATV legal para la calle
    D: Se requiere ayuda mecánica o un dispositivo compensatorio al conducir
  answer: B
  explanation: De acuerdo con la lista de restricciones, la 'G' significa que el conductor
    está restringido a conducir únicamente durante las horas del día.
- id: 69
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es aceptable al presentar un certificado
    de nacimiento para identificación?
  choices:
    A: Un certificado de nacimiento certificado por el estado
    B: Un certificado de nacimiento emitido por un hospital
    C: Un certificado de nacimiento original emitido por el estado
    D: Una copia certificada de un certificado de nacimiento por la agencia emisora
  answer: B
  explanation: El manual establece explícitamente que la división solicita un certificado
    de nacimiento certificado por el estado y que 'los certificados emitidos por hospitales,
    en miniatura, laminados o fotocopiados no son aceptables'.
- id: 70
  category: penalties_and_points
  question: ¿Qué sucede si el banco devuelve un cheque utilizado para pagar los servicios
    de la licencia de conducir?
  choices:
    A: La licencia del solicitante se revoca permanentemente
    B: El solicitante debe pagar un cargo por servicio de $20 para mantener su privilegio
      de conducir
    C: El solicitante debe volver a tomar el examen escrito de conocimientos
    D: Al solicitante se le cobrará una tarifa administrativa de $50
  answer: B
  explanation: 'El manual establece: ''Si el banco devuelve su cheque, debe pagar
    un cargo por servicio de $20 para mantener su privilegio de conducir''.'
- id: 71
  category: driver_testing
  question: ¿Bajo qué condiciones NO se realizará una prueba de habilidades de conducción?
  choices:
    A: Si el solicitante tiene más de 65 años
    B: Si el vehículo tiene transmisión automática
    C: Si el vehículo tiene el parabrisas roto o no tiene cinturones de seguridad
    D: Si el solicitante está solicitando una licencia provisional
  answer: C
  explanation: Las pruebas de habilidades de conducción no se realizarán cuando existan
    condiciones que puedan crear una conducción insegura, lo que incluye vehículos
    que no estén registrados o que sean inseguros, como tener el parabrisas roto o
    no tener cinturones de seguridad.
- id: 72
  category: license_system
  question: ¿Cuántos documentos aceptables debe proporcionar un solicitante como prueba
    de su dirección de residencia en Utah para obtener un certificado de licencia
    de conducir?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Obtener un certificado de licencia de conducir requiere "Dos documentos
    aceptables como prueba de su dirección de residencia en Utah".
- id: 73
  category: license_system
  question: ¿Qué debe acompañar a cualquier variación de nombre con respecto a su
    documento de identidad al solicitar una licencia?
  choices:
    A: Una carta ante notario de un familiar
    B: Un certificado de nacimiento emitido por un hospital
    C: Documentación legal de autorización, como un certificado de matrimonio o una
      sentencia de divorcio
    D: Una factura de servicios públicos que muestre el nuevo nombre
  answer: C
  explanation: Cualquier variación de nombre con respecto a su documento de identidad
    debe ir acompañada de documentación legal de autorización, que incluye un certificado
    de matrimonio certificado por el estado, una sentencia de divorcio, un pasaporte
    actualizado, etc.
- id: 74
  category: license_system
  question: ¿Se puede utilizar una Tarjeta de Privilegio de Conducción (DPC) como
    identificación válida o verificación de edad?
  choices:
    A: Sí, es equivalente a una licencia regular Clase D para todos los propósitos
    B: Sí, pero solo para verificación de edad, no para identificación
    C: No, solo puede utilizarse para fines de conducción
    D: No, a menos que vaya acompañada de una licencia de conducir temporal
  answer: C
  explanation: 'El manual establece con respecto a la DPC: "La DPC solo puede utilizarse
    para fines de conducción; no es una identificación válida ni una verificación
    de edad".'
- id: 75
  category: license_system
  question: Si tiene un cambio de dirección, ¿dentro de cuántos días después de mudarse
    está obligado por ley a notificar a la División de Licencias de Conducir?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Según el manual, si tiene un cambio de dirección, la ley le exige que
    notifique a la división la nueva dirección dentro de los 10 DÍAS posteriores a
    la mudanza.
- id: 76
  category: license_system
  question: ¿Se permite conducir en Utah a los conductores que tienen un permiso de
    aprendizaje de otro estado?
  choices:
    A: Sí, si van acompañados por un conductor con licencia mayor de 21 años
    B: Sí, por hasta 30 días
    C: No, NO pueden conducir en Utah
    D: Sí, pero solo durante las horas del día
  answer: C
  explanation: 'El manual establece explícitamente: "Los conductores con un permiso
    de aprendizaje de otro estado NO pueden conducir en Utah".'
- id: 77
  category: license_system
  question: Para un solicitante mayor de 21 años, ¿cuántos años después de su emisión
    vencerá una licencia de conducir original de Utah en su cumpleaños?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: La licencia de conducir vencerá en el cumpleaños del solicitante ocho
    años después de su emisión cuando sea mayor de 21 años.
- id: 78
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia provisional para un solicitante
    menor de 21 años?
  choices:
    A: 3 años
    B: 4 años
    C: 5 años
    D: 8 años
  answer: C
  explanation: Las licencias provisionales (licencias emitidas a un solicitante menor
    de 21 años) vencerán en el cumpleaños del solicitante cinco años después de su
    emisión.
- id: 79
  category: license_system
  question: Al solicitar una licencia de conducir de Utah, ¿cuántos documentos debe
    proporcionar para verificar su residencia en Utah y su dirección postal?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: El manual establece que para la verificación de la residencia en Utah
    y la dirección postal, usted "debe proporcionar dos" documentos.
- id: 80
  category: license_system
  question: ¿Dentro de cuántos días deben estar fechados los documentos utilizados
    para verificar la residencia en Utah y la dirección postal?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Los documentos de verificación de residencia y dirección postal de
    Utah deben mostrar su nombre, dirección y estar fechados dentro de los últimos
    90 días.
- id: 81
  category: license_system
  question: ¿Qué requisito adicional es necesario para una solicitud original de Tarjeta
    de Privilegio de Conducir (DPC)?
  choices:
    A: Una carta de recomendación de un empleador
    B: Una tarjeta de huellas dactilares y una foto en un sobre sellado
    C: Comprobante de propiedad del vehículo
    D: Un pasaporte estadounidense válido
  answer: B
  explanation: Para una solicitud original de Tarjeta de Privilegio de Conducir (DPC),
    se requiere una tarjeta de huellas dactilares y una foto colocadas en un sobre
    sellado en una agencia aprobada.
- id: 82
  category: safe_driving_rules
  question: Para ser elegible para el programa de buen conductor de Utah (renovación
    en línea), ¿no debe haber recibido más de cuántas infracciones notificables en
    los últimos ocho años?
  choices:
    A: Dos
    B: Cuatro
    C: Seis
    D: Ocho
  answer: C
  explanation: Si NO ha recibido más de seis infracciones notificables en los últimos
    ocho años, y el estado de su licencia de conducir es actualmente válido, usted
    es elegible para el programa de buen conductor de Utah.
- id: 83
  category: license_system
  question: Según la ley de Utah, ¿puede una persona tener un certificado de licencia
    de conducir y una tarjeta de identificación al mismo tiempo?
  choices:
    A: Sí, si pagan una tarifa adicional
    B: Sí, pero solo si una es una licencia de término limitado
    C: No, la ley de Utah no lo permite
    D: Sí, si son mayores de 21 años
  answer: C
  explanation: La ley de Utah NO permite que una persona tenga un certificado de licencia
    de conducir y una tarjeta de identificación al mismo tiempo.
- id: 84
  category: driver_testing
  question: Si es menor de 19 años y solicita su primera licencia de conducir de Utah,
    ¿qué debe proporcionar como prueba de experiencia de manejo?
  choices:
    A: Evidencia de haber completado un curso de educación vial
    B: Un registro de 50 horas de conducción con un padre
    C: Una carta del director de una escuela secundaria
    D: Comprobante de seguro del vehículo
  answer: A
  explanation: La prueba de experiencia de manejo requerida para una primera licencia
    de conducir de Utah incluye evidencia de haber completado un curso de educación
    vial si es menor de 19 años.
- id: 85
  category: license_system
  question: El personal militar estacionado fuera de Utah puede continuar usando su
    licencia de conducir de Utah válida hasta ¿cuántos días después de su baja?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: El personal militar y sus dependientes estacionados fuera de Utah pueden
    continuar usando su licencia de conducir hasta 90 días después de la baja o la
    terminación de las órdenes.
- id: 86
  category: license_system
  question: Si pierde su licencia de conducir de Utah y obtiene un reemplazo, ¿cuál
    será la fecha de vencimiento de la licencia de reemplazo?
  choices:
    A: 8 años a partir de la fecha de reemplazo
    B: 5 años a partir de la fecha de reemplazo
    C: La misma fecha que la licencia que reemplaza
    D: Un año a partir de la fecha de reemplazo
  answer: C
  explanation: La fecha de vencimiento de una licencia de conducir de reemplazo será
    la misma fecha que la de la licencia que reemplaza.
- id: 87
  category: license_system
  question: ¿Cuál de los siguientes NO es un documento aceptable para la verificación
    de identidad y estatus legal al solicitar una licencia de conducir regular Clase
    D?
  choices:
    A: Un pasaporte estadounidense válido y vigente
    B: Un certificado de nacimiento de hospital pequeño y laminado
    C: Un Certificado de Naturalización
    D: Una Tarjeta de Residente Permanente válida
  answer: B
  explanation: El manual especifica que no se aceptan certificados de nacimiento pequeños
    laminados o certificados de hospital para la verificación de identidad y estatus
    legal.
- id: 88
  category: license_system
  question: ¿Con cuánta anticipación puede renovar su licencia de conducir regular
    de Utah antes de su fecha de vencimiento?
  choices:
    A: Hasta 30 días antes del vencimiento
    B: Hasta 90 días antes del vencimiento
    C: Hasta seis meses antes del vencimiento
    D: Hasta un año antes del vencimiento
  answer: C
  explanation: Puede renovar su licencia de conducir hasta seis meses antes del vencimiento
    de la licencia.
- id: 89
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para aprobar el examen de la vista
    para conductores de Utah?
  choices:
    A: Visión de 20/20 y campos periféricos de 120° en ambos ojos.
    B: Visión de 20/40 y campos periféricos de 90° en al menos un ojo.
    C: Visión de 20/30 y campos periféricos de 70° en al menos un ojo.
    D: Visión de 20/50 y campos periféricos de 100° en ambos ojos.
  answer: B
  explanation: La división requiere una visión de 20/40 y campos periféricos (visión
    lateral) de 90° en al menos un ojo para aprobar el examen de la vista.
- id: 90
  category: driver_testing
  question: ¿A qué edad se requiere que un conductor apruebe un examen de la vista
    con cada solicitud de licencia?
  choices:
    A: 55 años o más
    B: 60 años o más
    C: 65 años o más
    D: 70 años o más
  answer: C
  explanation: Todas las personas de 65 años o más deben aprobar un examen de la vista
    con cada solicitud de licencia.
- id: 91
  category: alcohol_drugs_health
  question: Si una persona tiene una condición de salud que puede afectar su capacidad
    para conducir de manera segura, ¿quién es responsable de informarlo a la División
    de Licencias de Conducir?
  choices:
    A: El conductor individual
    B: El médico de la persona
    C: La compañía de seguros de la persona
    D: La Junta Asesora Médica de Licencias de Conducir
  answer: A
  explanation: Si una persona tiene una condición de salud que puede afectar su capacidad
    para conducir un vehículo de manera segura, es responsable de informarlo a la
    División de Licencias de Conducir.
- id: 92
  category: alcohol_drugs_health
  question: ¿Qué autoridad tiene un médico con respecto a los privilegios de conducir
    de un paciente en Utah?
  choices:
    A: Un médico puede suspender la licencia de conducir de inmediato.
    B: Un médico puede restringir la conducción de un paciente solo a las horas del
      día.
    C: Un médico no tiene la autoridad para restringir la conducción de nadie, pero
      debe informar con precisión sobre su estado de salud.
    D: Un médico puede confiscar la licencia de conducir de un paciente si lo considera
      inseguro.
  answer: C
  explanation: Un médico no tiene la autoridad para restringir la conducción de nadie,
    pero es responsable de informar con precisión sobre el estado de salud de un paciente.
- id: 93
  category: defensive_driving
  question: ¿Cuál de los siguientes se menciona como un comportamiento que a menudo
    da una pista de que la salud mental de un conductor es una preocupación para la
    conducción segura?
  choices:
    A: Escuchar la radio mientras conduce.
    B: Salir unos minutos antes hacia un destino.
    C: Tender a confundirse o frustrarse excesivamente cuando el tráfico se vuelve
      pesado.
    D: Dar un paseo antes de conducir.
  answer: C
  explanation: Tender a confundirse o frustrarse excesivamente cuando el tráfico se
    vuelve pesado es una forma de comportamiento que a menudo proporciona pistas sobre
    nuestra salud mental y la seguridad al conducir.
- id: 94
  category: license_system
  question: ¿Bajo qué condición se retira una licencia de conducir después de un examen
    de revisión?
  choices:
    A: Si el conductor necesita usar anteojos mientras conduce.
    B: Solo cuando la división determina que el conductor no puede operar un vehículo
      de manera segura bajo ninguna condición.
    C: Si el conductor es mayor de 65 años.
    D: Siempre que un profesional médico solicite la revisión.
  answer: B
  explanation: La licencia de conducir se retira solo cuando la división determina
    que un conductor no puede operar un vehículo de manera segura bajo ninguna condición.
- id: 95
  category: driver_testing
  question: ¿Cuál es la puntuación mínima para aprobar el examen escrito de conocimientos
    en Utah?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 100%
  answer: C
  explanation: El examen escrito de conocimientos no tiene límite de tiempo, pero
    generalmente toma de 30 a 45 minutos terminarlo, y debe aprobarse con una puntuación
    del 80% o superior.
- id: 96
  category: driver_testing
  question: ¿Cuántos intentos para aprobar el examen escrito de conocimientos cubre
    una sola tarifa dentro de un período de 12 meses?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ilimitados
  answer: C
  explanation: La tarifa permite no más de tres intentos para aprobar el examen escrito
    de conocimientos dentro de un plazo de 12 meses.
- id: 97
  category: driver_testing
  question: ¿Qué puntuación debe lograr un solicitante de licencia de conducir por
    primera vez en el Examen de Tendencias y Seguridad Vial?
  choices:
    A: 80%
    B: 85%
    C: 90%
    D: 100%
  answer: D
  explanation: Todos los solicitantes de licencia de conducir por primera vez deberán
    aprobar un examen adicional y recibir el 100% para obtener su primera licencia
    de conducir regular Clase D.
- id: 98
  category: safe_driving_rules
  question: ¿Qué tema constituye el 50% de las preguntas del Examen de Tendencias
    y Seguridad Vial?
  choices:
    A: Técnicas de estacionamiento en paralelo
    B: Causas significativas de muertes relacionadas con el tráfico
    C: Los efectos del envejecimiento en la visión periférica
    D: Mantenimiento y registro adecuados del vehículo
  answer: B
  explanation: El 50% de las preguntas se relacionarán con las causas significativas
    de muertes relacionadas con el tráfico, según lo identificado en las estadísticas
    publicadas por la Oficina de Seguridad Vial de Utah.
- id: 99
  category: driver_testing
  question: ¿Cuál es la edad mínima requerida para realizar un examen de habilidades
    de conducción directamente en la División de Licencias de Conducir (DLD)?
  choices:
    A: 15 años de edad
    B: 15 años y medio de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: C
  explanation: Debe tener al menos 16 años de edad para realizar un examen de habilidades
    de conducción en la DLD.
- id: 100
  category: driver_testing
  question: ¿Qué edad debe tener para realizar un examen de habilidades de conducción
    con un evaluador externo (Third-Party Tester) o en una escuela secundaria?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 17 años de edad
  answer: B
  explanation: Debe tener al menos 15 años de edad para realizar un examen de habilidades
    de conducción con un evaluador externo o en una escuela secundaria.
- id: 101
  category: driver_testing
  question: ¿Quién tiene permitido estar en el vehículo durante el examen de habilidades
    de conducción?
  choices:
    A: El solicitante, el examinador y uno de los padres o un tutor.
    B: El solicitante, el examinador y un instructor de manejo certificado por el
      estado.
    C: Únicamente el solicitante y el examinador.
    D: El solicitante y hasta dos pasajeros.
  answer: C
  explanation: El solicitante y el examinador son los únicos ocupantes permitidos
    en el vehículo durante el examen de habilidades de conducción.
- id: 102
  category: vehicle_information
  question: ¿Por qué podría ser rechazado un vehículo para el examen de habilidades
    de conducción?
  choices:
    A: Si no es un vehículo de doble control.
    B: Si su estado pudiera causar daño a la persona o a la ropa del examinador.
    C: Si tiene más de 10 años de antigüedad.
    D: Si no tiene una cámara de reversa.
  answer: B
  explanation: El vehículo puede ser rechazado si su estado pudiera causar daño a
    la persona o a la ropa del examinador.
- id: 103
  category: driver_testing
  question: ¿Qué sucede si reprueba el examen de habilidades de conducción tres veces?
  choices:
    A: Debe esperar seis meses antes de intentarlo de nuevo.
    B: Se le requerirá pagar otra tarifa.
    C: Debe volver a tomar el examen escrito de conocimientos.
    D: Queda descalificado permanentemente para obtener una licencia.
  answer: B
  explanation: No aprobar el examen de habilidades de conducción en tres intentos
    resultará en el pago de otra tarifa.
- id: 104
  category: driver_testing
  question: ¿De cuánto tiempo dispone para completar todos los exámenes desde el día
    en que paga su tarifa?
  choices:
    A: 30 días
    B: 90 días
    C: Seis meses
    D: Un año
  answer: C
  explanation: Todos los exámenes deben completarse dentro de los seis meses posteriores
    al día en que pague su tarifa.
- id: 105
  category: driver_testing
  question: Al llegar para su examen de habilidades de conducción, la persona que
    lo acompaña debe ser un conductor con la licencia adecuada que tenga al menos
    ¿qué edad? (si no es su padre, tutor o cónyuge).
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: 30 años de edad
  answer: B
  explanation: Debe presentar la licencia de conducir válida de la persona que tenga
    al menos 21 años de edad (o un padre, tutor o cónyuge que tenga al menos 18 años)
    que lo acompañe a la Oficina de Licencias de Conducir.
- id: 106
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para el vehículo que usted proporcione
    para el examen de habilidades de conducción?
  choices:
    A: Debe tener una cámara de reversa.
    B: Debe tener dos espejos exteriores tanto en el lado izquierdo como en el derecho.
    C: Debe tener una ventana del lado del conductor que se pueda bajar.
    D: Debe tener menos de 10 años de antigüedad.
  answer: C
  explanation: Para evitar tener que reprogramar su examen de habilidades de conducción,
    asegúrese de que su vehículo tenga una ventana del lado del conductor que se pueda
    bajar.
- id: 107
  category: driver_testing
  question: ¿Qué acción resultará en una reprobación automática en su examen de habilidades
    de conducción?
  choices:
    A: Hacerle una pregunta al examinador antes de que comience el examen.
    B: Usar el método de empujar y jalar (push-and-pull) para maniobrar el volante.
    C: Subir el vehículo a las aceras o bordillos innecesariamente.
    D: Revisar sus espejos con frecuencia.
  answer: C
  explanation: Subir el vehículo a las aceras o bordillos innecesariamente figura
    en la lista de Acciones Peligrosas/Reprobaciones Automáticas.
- id: 108
  category: safe_driving_rules
  question: ¿Qué regla de distancia de seguimiento recomienda el manual para una conducción
    segura en condiciones normales?
  choices:
    A: La regla de la longitud de un vehículo
    B: La regla de los dos segundos
    C: La regla de los tres segundos
    D: La regla de los cuatro segundos
  answer: B
  explanation: El manual aconseja seguir a una distancia segura y utilizar la regla
    de los dos segundos.
- id: 109
  category: vehicle_information
  question: ¿Cuánto espacio debe dejar entre su pecho y el volante al ajustar su asiento?
  choices:
    A: 5 pulgadas
    B: 10 pulgadas
    C: 12 pulgadas
    D: 15 pulgadas
  answer: B
  explanation: Debe dejar 10 pulgadas entre su pecho y el volante.
- id: 110
  category: vehicle_information
  question: ¿Dónde debe colocarse la parte superior del volante cuando ajuste su asiento?
  choices:
    A: Por encima del nivel de su barbilla
    B: No más alto que sus hombros
    C: Al nivel de sus ojos
    D: Apoyado en su regazo
  answer: B
  explanation: La parte superior del volante no debe estar más alta que sus hombros.
    Debe estar por debajo del nivel de la barbilla.
- id: 111
  category: vehicle_information
  question: ¿Cómo debe posicionar su cabeza para ajustar correctamente el espejo lateral
    izquierdo?
  choices:
    A: Inclínese hacia la derecha para que su cabeza quede debajo del espejo retrovisor.
    B: Apoye la cabeza contra la ventana izquierda cerrada.
    C: Siéntese perfectamente derecho y mire hacia adelante.
    D: Gire la cabeza para mirar por encima de su hombro derecho.
  answer: B
  explanation: Para ajustar el espejo lateral izquierdo, apoye la cabeza contra la
    ventana izquierda cerrada. Ajuste el espejo de modo que apenas pueda ver el borde
    trasero izquierdo de su vehículo.
- id: 112
  category: safe_driving_rules
  question: ¿Dónde debe ajustarse el cinturón de regazo cuando se usa correctamente
    el cinturón de seguridad?
  choices:
    A: A través de su estómago
    B: A través de sus caderas
    C: Debajo de su brazo
    D: A través de sus muslos
  answer: B
  explanation: El cinturón de regazo debe ajustarse a través de las caderas, no del
    estómago.
- id: 113
  category: safe_driving_rules
  question: 'Según el manual, los niños deben estar debidamente sujetos en un asiento
    de seguridad para el automóvil o en un asiento elevado (booster seat) si tienen:'
  choices:
    A: Cinco años de edad o menos
    B: Seis años de edad o menos
    C: Ocho años de edad o menos
    D: Diez años de edad o menos
  answer: C
  explanation: Los niños de ocho años o menos deben estar debidamente sujetos en un
    asiento de seguridad para el automóvil o en un asiento elevado (booster seat).
- id: 114
  category: safe_driving_rules
  question: ¿Qué tanto aumentan sus probabilidades de morir en un choque si sale despedido
    de un automóvil?
  choices:
    A: 5 veces más
    B: 10 veces más
    C: 15 veces más
    D: 23 veces más
  answer: D
  explanation: Sus probabilidades de morir son 23 veces mayores si sale despedido
    de un automóvil.
- id: 115
  category: safe_driving_rules
  question: ¿Qué debe hacer si su vista está bloqueada en un paso de peatones al detenerse?
  choices:
    A: Toque la bocina y avance rápidamente.
    B: Avance con cuidado y mire a ambos lados antes de entrar en la intersección.
    C: Retroceda hasta que tenga una vista despejada.
    D: Espere a que otro vehículo entre primero en la intersección.
  answer: B
  explanation: Si su vista está bloqueada en un paso de peatones, avance con cuidado
    y mire a ambos lados antes de entrar en la intersección.
- id: 116
  category: driver_testing
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los examinadores
    externos (third-party testers)?
  choices:
    A: Administran únicamente el examen de conocimientos por escrito.
    B: Sus tarifas de examen están incluidas en las tarifas de licencia recaudadas
      por la división.
    C: Están certificados y autorizados como instructores comerciales de educación
      vial.
    D: No se les permite administrar exámenes de habilidades de conducción.
  answer: C
  explanation: Los examinadores externos (third-party testers) están certificados
    y autorizados por la división como instructores comerciales de educación vial
    y pueden administrar el examen de habilidades de conducción.
- id: 117
  category: safe_driving_rules
  question: Si pesa 150 libras y choca mientras viaja a 30 mph, ¿cuánta fuerza se
    ejerce sobre su cuerpo?
  choices:
    A: 1,500 libras
    B: 3,000 libras
    C: 4,500 libras
    D: 6,000 libras
  answer: C
  explanation: En un choque, las fuerzas ejercidas sobre su cuerpo equivalen a su
    peso multiplicado por la velocidad del automóvil. Por ejemplo, si pesa 150 libras
    y choca mientras viaja a 30 mph, se ejercerían 4,500 libras de fuerza sobre su
    cuerpo.
- id: 118
  category: penalties_and_points
  question: ¿Cómo puede un conductor lograr que se le exonere la multa por una citación
    de cinturón de seguridad en Utah?
  choices:
    A: Pagando una tarifa reducida en el tribunal
    B: Completando un curso de seguridad sobre el cinturón de seguridad de 30 minutos
      en línea
    C: Comprando un nuevo asiento de seguridad para niños
    D: Realizando 10 horas de servicio comunitario
  answer: B
  explanation: Si usted o cualquier persona en su vehículo no está debidamente sujeta,
    se le puede emitir una citación. La multa puede ser exonerada al completar un
    curso de seguridad sobre el cinturón de seguridad de 30 minutos en línea.
- id: 119
  category: safe_driving_rules
  question: ¿Hasta qué edad y peso deben mantenerse los niños en un asiento de seguridad
    orientado hacia atrás en el asiento trasero, si el asiento lo permite?
  choices:
    A: Al menos un año de edad y 20 libras
    B: Al menos dos años de edad y 30 libras
    C: Al menos tres años de edad y 35 libras
    D: Al menos cuatro años de edad y 40 libras
  answer: B
  explanation: Los niños deben estar orientados hacia atrás en el asiento trasero
    hasta que tengan al menos dos años de edad y pesen 30 libras, o más tiempo si
    el asiento de seguridad lo permite.
- id: 120
  category: safe_driving_rules
  question: ¿A qué altura un niño de ocho años o menos está exento de necesitar un
    asiento de seguridad para niños aprobado?
  choices:
    A: 48 pulgadas de alto
    B: 50 pulgadas de alto
    C: 54 pulgadas de alto
    D: 57 pulgadas de alto
  answer: D
  explanation: Todos los niños de ocho años o menos deben estar debidamente asegurados
    en un asiento de seguridad para niños aprobado, a menos que midan 57 pulgadas
    de alto.
- id: 121
  category: driver_responsibility
  question: ¿Es una infracción ser detenido por fumar en un vehículo mientras se transporta
    a niños de qué edad?
  choices:
    A: 12 años de edad o menores
    B: 15 años de edad o menores
    C: 16 años de edad o menores
    D: 18 años de edad o menores
  answer: B
  explanation: Es una infracción ser detenido por fumar en un vehículo mientras se
    transporta a niños de 15 años de edad o menores.
- id: 122
  category: vehicle_information
  question: ¿A qué velocidad puede salir una bolsa de aire (air bag) del tablero durante
    un despliegue?
  choices:
    A: Hasta 100 mph
    B: Hasta 150 mph
    C: Hasta 200 mph
    D: Hasta 250 mph
  answer: C
  explanation: Para cumplir con su importante función, una bolsa de aire sale del
    tablero a una velocidad de hasta 200 mph, más rápido que un abrir y cerrar de
    ojos.
- id: 123
  category: penalties_and_points
  question: ¿Cuál es la sanción por retirar o modificar el sistema de restricción
    pasiva de bolsas de aire de su vehículo para dejarlo inoperable?
  choices:
    A: Una infracción
    B: Un delito menor de Clase C (Class C misdemeanor)
    C: Un delito menor de Clase B (Class B misdemeanor)
    D: Un delito menor de Clase A (Class A misdemeanor)
  answer: C
  explanation: Es un delito menor de Clase B (Class B misdemeanor) si retira, no repara
    o modifica el sistema de restricción pasiva de bolsas de aire de su vehículo para
    dejar la bolsa de aire inoperable.
- id: 124
  category: safe_driving_rules
  question: Al retroceder su vehículo motorizado, ¿dónde debe colocar su brazo derecho?
  choices:
    A: En el volante junto a su mano izquierda
    B: En la consola central
    C: Fuera de la ventana del pasajero
    D: En el respaldo del asiento
  answer: D
  explanation: Al retroceder, debe sujetar el volante con la mano izquierda, colocar
    el brazo derecho en el respaldo del asiento y mirar a través de la ventana trasera.
- id: 125
  category: safe_driving_rules
  question: ¿Durante cuánto tiempo debe usar la luz direccional antes de realizar
    un cambio de carril?
  choices:
    A: Durante al menos dos segundos
    B: Durante al menos tres segundos
    C: Durante al menos cuatro segundos
    D: Durante al menos cinco segundos
  answer: A
  explanation: Al realizar un cambio de carril, debe señalizar durante al menos dos
    segundos en la dirección en la que pretende moverse.
- id: 126
  category: safe_driving_rules
  question: Al completar un giro a la izquierda en una carretera de varios carriles,
    ¿en qué carril debe terminar el giro su vehículo?
  choices:
    A: En el carril situado más a la derecha
    B: En el carril central
    C: En el carril situado más a la izquierda, directamente a la derecha de la línea
      central
    D: En cualquier carril disponible
  answer: C
  explanation: Complete el giro en el carril adecuado en una carretera de varios carriles
    (el vehículo debe terminar un giro a la izquierda en el carril situado más a la
    izquierda, el que está directamente a la derecha de la línea central).
- id: 127
  category: sharing_the_road
  question: ¿Qué es el 'área de bifurcación' (gore area) en una autopista?
  choices:
    A: El área del acotamiento utilizada para estacionamiento de emergencia
    B: El área entre las líneas blancas continuas de un carril de tráfico y un carril
      de entrada o salida
    C: El carril designado para vehículos de alta ocupación (HOV)
    D: La zona de construcción donde se reduce el límite de velocidad
  answer: B
  explanation: El área de bifurcación (gore area) es el espacio entre las líneas blancas
    continuas de un carril de tráfico y un carril utilizado para entrar o salir de
    ese carril de tráfico. Es ilegal cruzar o conducir sobre ella.
- id: 128
  category: defensive_driving
  question: ¿Cuál es el 'Método de Cremallera' (Zipper Method) recomendado al incorporarse
    en un punto congestionado, como una zona de construcción?
  choices:
    A: Incorporarse lo antes posible al carril que continúa
    B: Detenerse en su carril hasta que se abra un espacio
    C: Usar ambos carriles hasta el punto de unión y luego alternar el paso
    D: Acelerar para rebasar la congestión por el acotamiento
  answer: C
  explanation: El MÉTODO DE CREMALLERA (ZIPPER METHOD) es la idea de alternar al incorporarse
    en un punto de unión congestionado. Se utilizan ambos carriles de tráfico hasta
    que los vehículos llegan al punto de unión y, una vez allí, se alternan.
- id: 129
  category: safe_driving_rules
  question: Al detener su vehículo detrás de otro en una intersección, ¿cuánto espacio
    debe dejar?
  choices:
    A: Suficiente espacio para ver las ruedas traseras del vehículo que tiene delante
    B: Exactamente la longitud de un automóvil
    C: Al menos 10 pies de espacio
    D: Suficiente espacio para ver la cabeza del conductor en su espejo retrovisor
  answer: A
  explanation: Al detenerse detrás de otro vehículo, asegúrese de poder ver las ruedas
    traseras del vehículo que tiene delante.
- id: 130
  category: safe_driving_rules
  question: ¿Dónde deben viajar los bebés si un vehículo tiene una bolsa de aire en
    el lado del pasajero?
  choices:
    A: En el asiento delantero mirando hacia adelante
    B: En el asiento delantero mirando hacia atrás
    C: En el asiento trasero
    D: En el asiento delantero con el asiento echado totalmente hacia atrás
  answer: C
  explanation: Los bebés nunca deben viajar en el asiento delantero de un vehículo
    que tenga bolsa de aire en el lado del pasajero. Deben viajar con el cinturón
    abrochado en un asiento trasero.
- id: 131
  category: safe_driving_rules
  question: ¿A qué distancia debe estar la rueda trasera de su vehículo del bordillo
    (curb) al estacionar?
  choices:
    A: A no más de 6 pulgadas de distancia
    B: A no más de 12 pulgadas de distancia
    C: A no más de 18 pulgadas de distancia
    D: A no más de 24 pulgadas de distancia
  answer: B
  explanation: 'El manual establece: ''Si se estaciona junto a un bordillo, la rueda
    trasera de su vehículo no debe estar a más de 12 pulgadas de distancia del bordillo''.'
- id: 132
  category: safe_driving_rules
  question: Por motivos de seguridad pública, ¿a cuántos pies de un hidrante de incendios
    está prohibido estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: Según el manual, no se permite estacionar 'a menos de 15 pies de un
    hidrante de incendios'.
- id: 133
  category: safe_driving_rules
  question: Al estacionar cuesta arriba junto a un bordillo, ¿hacia qué dirección
    debe girar el volante?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Recto hacia adelante
    D: Hacia la derecha
  answer: B
  explanation: 'Para estacionar cuesta arriba, el manual indica: ''Gire el volante
    en dirección contraria al bordillo, asegurándose de que el neumático delantero
    del vehículo toque el bordillo para asegurar la posición del vehículo''.'
- id: 134
  category: safe_driving_rules
  question: Al estacionar cuesta arriba en una carretera sin bordillo, ¿hacia dónde
    debe girar las ruedas?
  choices:
    A: Hacia la derecha
    B: Hacia la izquierda
    C: Recto hacia adelante
    D: En dirección contraria al borde de la carretera
  answer: A
  explanation: El manual especifica que al estacionar cuesta arriba, 'si no hay bordillo,
    gire el volante hacia la derecha'.
- id: 135
  category: safe_driving_rules
  question: Al adelantar a otro vehículo, ¿cuándo es seguro regresar a su carril original?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del otro
      vehículo
    B: Cuando pueda ver el vehículo adelantado en su espejo retrovisor
    C: Cuando esté 50 pies por delante del vehículo adelantado
    D: Inmediatamente después de revisar su punto ciego
  answer: B
  explanation: Al adelantar, debe 'esperar hasta que pueda ver los vehículos adelantados
    en su espejo retrovisor' antes de señalizar y regresar al carril.
- id: 136
  category: safe_driving_rules
  question: Al adelantar en una carretera de varios carriles, ¿a no menos de cuántos
    pies de los vehículos que vienen en sentido contrario debe regresar al carril
    derecho?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El manual establece que debe 'regresar al carril de la derecha a no
    menos de 200 pies de los vehículos que vienen en sentido contrario'.
- id: 137
  category: sharing_the_road
  question: ¿Cuál es la regla con respecto a adelantar a tres o más quitanieves que
    operan en formación escalonada?
  choices:
    A: Puede adelantarlos solo por el lado izquierdo.
    B: Puede adelantarlos solo por el lado derecho.
    C: No puede adelantarlos ni rebasarlos por ningún lado.
    D: Puede adelantarlos si toca la bocina primero.
  answer: C
  explanation: 'El manual establece: ''Si tres o más quitanieves operan en formación
    escalonada, una persona que opere un vehículo no puede adelantar ni rebasar a
    los quitanieves por ningún lado''.'
- id: 138
  category: safe_driving_rules
  question: ¿Durante cuánto tiempo debe señalizar antes de comenzar cualquier cambio
    de carril o giro?
  choices:
    A: Durante un segundo
    B: Durante dos segundos
    C: Durante tres segundos
    D: Durante cinco segundos
  answer: B
  explanation: Se requieren señales 'durante dos segundos antes de girar' y 'durante
    dos segundos antes de comenzar cualquier cambio de carril'.
- id: 139
  category: vehicle_information
  question: ¿Qué método de dirección se recomienda cuando el control del volante es
    crítico, como al estacionar, realizar giros cerrados a la derecha o corregir un
    derrape?
  choices:
    A: Dirección de empuje y tracción (pull-push)
    B: Dirección con una sola mano
    C: Dirección de manos sobre manos (hand-over-hand)
    D: Dirección con la palma de la mano
  answer: C
  explanation: 'El manual aconseja: ''Use la dirección de manos sobre manos cuando
    el control del volante sea crítico, como al estacionar, realizar giros cerrados
    a la derecha o corregir un derrape''.'
- id: 140
  category: safe_driving_rules
  question: ¿Dónde deben colocarse los pulgares al sujetar el volante?
  choices:
    A: Metidos dentro del volante
    B: Hacia arriba a lo largo de la cara del volante
    C: Envueltos firmemente alrededor de la parte trasera del volante
    D: Apoyados en la almohadilla de la bocina
  answer: B
  explanation: 'El manual instruye a los conductores: ''Mantenga los pulgares hacia
    arriba a lo largo de la cara del volante. Nunca sujete el interior del volante''.'
- id: 141
  category: signs_and_signals
  question: Al detenerse en un cruce de ferrocarril controlado por señales intermitentes
    o barreras, ¿a qué distancia del riel más cercano debe detenerse?
  choices:
    A: Entre 5 y 10 pies
    B: Entre 10 y 20 pies
    C: Entre 15 y 50 pies
    D: Entre 50 y 100 pies
  answer: C
  explanation: En los cruces de ferrocarril, debe "detenerse a más de 15 pies (pero
    no más de 50 pies) del riel más cercano hasta que sea seguro continuar".
- id: 142
  category: signs_and_signals
  question: ¿A menos de cuántos pies de cualquier baliza intermitente, señal de alto
    (stop), señal de ceda el paso (yield) o señal de control de tráfico no se le permite
    estacionar?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El manual enumera los lugares donde no se permite estacionar, incluyendo
    "a menos de 30 pies de cualquier baliza intermitente, señal de alto, señal de
    ceda el paso o señal de control de tráfico".
- id: 143
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo lo está rebasando?
  choices:
    A: Acelerar para evitar que lo rebasen.
    B: Moverse al arcén (shoulder) para darles más espacio.
    C: Permanecer en su carril y mantener su velocidad constante.
    D: Frenar bruscamente para dejar que pasen rápido.
  answer: C
  explanation: 'El manual establece: "Si lo están rebasando, permanezca en su carril
    y mantenga su velocidad constante para permitir que el conductor pase".'
- id: 144
  category: safe_driving_rules
  question: ¿Cuándo es permisible estacionar en el arcén (shoulder) de una autopista
    interestatal?
  choices:
    A: Cuando necesite tomar una siesta.
    B: Cuando quiera revisar su teléfono.
    C: Solo si su vehículo se avería o si usted se encuentra en una situación de emergencia
      médica.
    D: Siempre que no haya señales de "No estacionar" publicadas.
  answer: C
  explanation: No puede estacionar "en el arcén de ninguna autopista interestatal;
    estas áreas pueden usarse solo si su vehículo se avería o si usted se encuentra
    en una situación de emergencia médica".
- id: 145
  category: signs_and_signals
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a detenerse
    en una señal de alto (stop)?
  choices:
    A: Una parada incompleta (rolling stop) es adecuada si no hay otros autos presentes.
    B: Debe detenerse por completo.
    C: Solo necesita reducir la velocidad a 5 mph.
    D: Debe detenerse solo si hay peatones esperando para cruzar.
  answer: B
  explanation: 'El manual establece: "Deténgase por completo ante las señales y semáforos.
    Muchas personas parecen sentir que una parada incompleta es adecuada cuando se
    requiere detenerse. Las siguientes situaciones son momentos en los que debe realizar
    una parada completa: ... Todas las señales de alto".'
- id: 146
  category: safe_driving_rules
  question: Al detenerse en un cruce de ferrocarril, ¿cuál es la distancia requerida
    a la que debe detenerse del riel más cercano?
  choices:
    A: Más de 10 pies pero no más de 40 pies
    B: Más de 15 pies pero no más de 50 pies
    C: Exactamente 15 pies
    D: Al menos 50 pies
  answer: B
  explanation: El manual establece que debe detenerse a más de 15 pies (pero no más
    de 50 pies) del riel más cercano hasta que sea seguro continuar.
- id: 147
  category: sharing_the_road
  question: Si viaja por una carretera de dos carriles y un autobús escolar muestra
    luces rojas intermitentes alternas, ¿quién está obligado a detenerse?
  choices:
    A: Solo el tráfico detrás del autobús
    B: Solo el tráfico en la dirección opuesta
    C: El tráfico en ambas direcciones
    D: Nadie está obligado a detenerse si reducen la velocidad a 15 mph
  answer: C
  explanation: Según el manual, cuando se viaja por una carretera de dos carriles,
    el tráfico en ambas direcciones debe detenerse ante un autobús escolar que muestre
    luces rojas intermitentes alternas.
- id: 148
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene con luces rojas intermitentes en
    una carretera de cinco o más carriles y un carril central compartido para girar,
    ¿qué vehículos deben detenerse?
  choices:
    A: El tráfico en ambas direcciones
    B: Solo los vehículos en ambos carriles detrás del autobús escolar
    C: Solo los vehículos que viajan en la dirección opuesta
    D: Solo los vehículos en el carril central compartido para girar
  answer: B
  explanation: En una carretera con cinco o más carriles y un carril central compartido
    para girar, solo se requiere que los vehículos en ambos carriles detrás del autobús
    escolar se detengan por completo.
- id: 149
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una condena por rebasar ilegalmente a un
    autobús escolar?
  choices:
    A: $500
    B: $1000
    C: $2000
    D: $3000
  answer: D
  explanation: El manual establece que las multas por rebasar incorrectamente a un
    autobús escolar pueden llegar hasta los $3000, y una condena generalmente significa
    un aumento en las tarifas del seguro.
- id: 150
  category: defensive_driving
  question: Al detenerse detrás de otro vehículo en una intersección, ¿qué se considera
    un espacio seguro?
  choices:
    A: Detenerse donde pueda ver las llantas traseras del vehículo que está delante
      de usted
    B: Detenerse al menos a la distancia de un automóvil detrás del vehículo
    C: Detenerse donde pueda ver el parachoques trasero del vehículo
    D: Detenerse a tres pies detrás del vehículo
  answer: A
  explanation: Un espacio seguro al detenerse detrás de otro vehículo es detenerse
    donde pueda ver las llantas traseras del vehículo que está delante de usted.
- id: 151
  category: safe_driving_rules
  question: ¿Durante cuánto tiempo debe señalizar antes de realizar un giro a la derecha
    o a la izquierda?
  choices:
    A: Durante tres segundos
    B: Durante dos segundos
    C: Durante al menos 100 pies
    D: Durante cinco segundos
  answer: B
  explanation: El manual indica a los conductores que deben señalizar a la derecha
    o a la izquierda durante dos segundos antes de realizar un giro.
- id: 152
  category: safe_driving_rules
  question: ¿Nunca debe realizar un giro en U en ninguna curva o cerca de la cima
    de una colina donde no pueda ver o ser visto desde ambas direcciones a qué distancia?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: Nunca realice un giro en U en ninguna curva o cerca de la cima de una
    colina donde no pueda ver o ser visto desde ambas direcciones por una distancia
    de 500 pies.
- id: 153
  category: signs_and_signals
  question: ¿Qué indica una señal de X roja sobre un carril reversible (flex lane)?
  choices:
    A: Puede usar el carril
    B: No puede usar el carril
    C: El carril termina en 500 pies
    D: El carril es solo para vehículos de alta ocupación
  answer: B
  explanation: En un carril reversible, una flecha verde significa que puede usar
    el carril, y una X roja significa que no puede usar el carril.
- id: 154
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al carril
    de emergencia en una autopista?
  choices:
    A: Puede usarlo para rebasar el tráfico lento
    B: Puede usarlo para detenerse y recoger pasajeros
    C: Se encuentra en el interior de la línea blanca discontinua
    D: Es ilegal rebasar a otro vehículo o recoger pasajeros en este carril
  answer: D
  explanation: El área de la autopista en el exterior de la línea blanca sólida es
    solo para uso de emergencia. Rebasar a otro vehículo o detenerse para recoger
    pasajeros en este carril es ilegal.
- id: 155
  category: sharing_the_road
  question: En una carretera de varios carriles, ¿qué debe hacer un vehículo que circula
    por el carril izquierdo cuando otro vehículo se le acerca por detrás?
  choices:
    A: Mantener la velocidad y permanecer en el carril
    B: Moverse de forma segura a la derecha para evitar obstaculizar el tráfico
    C: Aumentar la velocidad para igualar al vehículo de atrás
    D: Encender las luces de emergencia
  answer: B
  explanation: Un vehículo que circula por el carril izquierdo debe moverse de forma
    segura hacia la derecha cuando se le acerque otro por detrás para evitar obstaculizar
    el tráfico.
- id: 156
  category: safe_driving_rules
  question: ¿Cuándo es legal entrar y salir del carril para vehículos compartidos
    (carril exprés) en la I-15?
  choices:
    A: En cualquier momento que haya un espacio seguro en el tráfico
    B: Solo a través de la línea blanca doble
    C: Solo en puntos de acceso específicos con franjas blancas punteadas
    D: Solo cuando su vehículo tenga una calcomanía C
  answer: C
  explanation: No se permite entrar ni salir del carril para vehículos compartidos
    excepto en lugares específicos (llamados puntos de acceso) con franjas blancas
    punteadas en lugar de líneas sólidas.
- id: 157
  category: sharing_the_road
  question: ¿Qué debe hacer si se encuentra en el carril exprés y le sigue un vehículo
    de emergencia con luces intermitentes?
  choices:
    A: Detenerse inmediatamente en el carril exprés
    B: Acelerar para apartarse del camino del vehículo de emergencia
    C: Realizar un cambio de carril hacia la derecha para salir del carril exprés
      cuando sea seguro hacerlo
    D: Moverse al arcén izquierdo
  answer: C
  explanation: Cuando le siga un vehículo de emergencia o de policía con luces intermitentes,
    se permite, cuando sea seguro hacerlo, realizar un cambio de carril hacia la derecha
    para salir del carril exprés.
- id: 158
  category: safe_driving_rules
  question: ¿Cuándo es apropiado realizar un giro de tres puntos?
  choices:
    A: En una autopista cuando se pasa su salida
    B: Solo si la carretera es demasiado estrecha para un giro en U en una carretera
      de dos carriles
    C: En cualquier intersección con una señal de alto
    D: En una carretera dividida con cuatro o más carriles
  answer: B
  explanation: Un giro de tres puntos debe usarse solo si la carretera es demasiado
    estrecha para un giro en U, y solo debe usarse en una carretera de dos carriles.
- id: 159
  category: safe_driving_rules
  question: Al realizar un giro de dos puntos en reversa, ¿qué distancia debe avanzar
    después de la entrada o callejón antes de retroceder?
  choices:
    A: El largo de un vehículo
    B: El largo de dos vehículos
    C: 10 pies
    D: 50 pies
  answer: A
  explanation: El manual establece que para un giro de dos puntos en reversa, debe
    conducir el largo de un vehículo después de la entrada o callejón antes de retroceder
    en él.
- id: 160
  category: vehicle_information
  question: ¿Cuál es el propósito de una calcomanía C en un vehículo?
  choices:
    A: Permite que los vehículos comerciales usen el carril exprés
    B: Permite que los vehículos de combustible limpio con un solo ocupante usen los
      carriles exprés sin pagar peaje
    C: Indica que el vehículo es un vehículo compartido con dos o más pasajeros
    D: Permite que el vehículo se estacione en espacios para personas con discapacidad
  answer: B
  explanation: Las calcomanías C permiten que un número limitado de vehículos de combustible
    limpio con un solo ocupante utilicen los carriles exprés sin pagar peaje después
    de una tarifa de registro única de $10.
- id: 161
  category: vehicle_information
  question: ¿Dónde debe colocarse una calcomanía C en un vehículo de combustible limpio
    que califique?
  choices:
    A: En la placa de matrícula trasera
    B: Dentro del parabrisas a la izquierda del volante
    C: Dentro del parabrisas a la derecha del espejo retrovisor
    D: En la ventana del lado del conductor
  answer: C
  explanation: Según el manual, las calcomanías C son pequeñas etiquetas adhesivas
    que se colocan dentro del parabrisas a la derecha del espejo retrovisor.
- id: 162
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de usar un carril de aceleración al entrar
    en una autopista de varios carriles?
  choices:
    A: Detenerse por completo y esperar un espacio en el tráfico
    B: Igualar su velocidad con la de los otros vehículos antes de incorporarse a
      la calzada
    C: Rebasar a los vehículos más lentos que ya están en la autopista
    D: Evitar los semáforos de rampa (ramp meters) durante el tráfico pesado
  answer: B
  explanation: Cuando esté en una autopista de varios carriles, debe usar el carril
    de aceleración para igualar su velocidad con la de los otros vehículos antes de
    incorporarse a la calzada.
- id: 163
  category: signs_and_signals
  question: ¿Cuántos vehículos se permite pasar típicamente cada vez que la luz de
    un semáforo de rampa (ramp meter) se pone en verde?
  choices:
    A: Un vehículo
    B: Dos vehículos
    C: Tres vehículos
    D: Tantos como puedan pasar antes de que la luz se ponga en rojo
  answer: A
  explanation: Los semáforos de rampa se colocan en las rampas de entrada a la autopista
    y permiten que solo pase un vehículo (a menos que se indique lo contrario) cada
    vez que se enciende la luz verde.
- id: 164
  category: safe_driving_rules
  question: ¿Cuándo se le permite detenerse o estacionarse en una rampa de frenado
    para vehículos sin frenos (runaway vehicle ramp)?
  choices:
    A: Cuando necesite consultar su GPS o mapa
    B: Cuando su vehículo se esté sobrecalentando y necesite enfriarse
    C: Solo durante las horas del día cuando la visibilidad es clara
    D: Bajo ninguna circunstancia, a menos que se encuentre en una emergencia que
      requiera su uso para detenerse
  answer: D
  explanation: Usted NO puede usar una rampa de frenado para vehículos sin frenos
    a menos que se encuentre en una emergencia que requiera el uso de la rampa para
    detener su vehículo. Está prohibido detenerse, pararse o estacionarse en o en
    el trayecto de una rampa de frenado.
- id: 165
  category: safe_driving_rules
  question: ¿Es legal hacer un giro en U desde la rampa de salida en un intercambio
    urbano de punto único (SPUI) para volver a entrar en la autopista?
  choices:
    A: No, los giros en U están estrictamente prohibidos en todos los intercambios
      urbanos de punto único
    B: Sí, siempre que vea una flecha verde cuando comience la maniobra
    C: Sí, pero solo si el semáforo está parpadeando en rojo
    D: No, a menos que lo indique un oficial de policía
  answer: B
  explanation: Es legal hacer un giro en U desde la rampa de salida en un intercambio
    urbano de punto único y volver a entrar en la autopista siempre que vea una flecha
    verde al comenzar la maniobra.
- id: 166
  category: safe_driving_rules
  question: ¿Cómo deben actuar los conductores en un intercambio urbano de punto único
    si ocurre un corte de energía y no hay respaldo de batería?
  choices:
    A: Tratar la intersección como una parada de cuatro vías estándar
    B: El tráfico de la autopista debe ceder el paso a todos los vehículos que salen
    C: Proceder con extrema precaución; no se maneja como una parada de cuatro vías
    D: Solo realizar giros a la derecha hasta que se restablezca la energía
  answer: C
  explanation: Si ocurre un corte de energía, el intercambio urbano de punto único
    no se maneja como una parada de cuatro vías. Es importante proceder con extrema
    precaución y cortesía hasta que se envíe a un oficial.
- id: 167
  category: defensive_driving
  question: Antes de avanzar después de una parada en una intersección, ¿en qué orden
    debe verificar el tráfico y a los ciclistas?
  choices:
    A: Derecha, izquierda y luego derecha otra vez
    B: Izquierda, derecha y luego izquierda otra vez
    C: Hacia adelante, luego en su espejo retrovisor
    D: Izquierda, hacia adelante y luego a la derecha
  answer: B
  explanation: Antes de avanzar después de una parada, verifique el tráfico y a los
    ciclistas. Mire a la izquierda, a la derecha y luego a la izquierda otra vez antes
    de entrar en la intersección.
- id: 168
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a los cambios de carril mientras se conduce
    a través de una intersección?
  choices:
    A: Puede cambiar de carril si usa su señal de giro
    B: Debe cambiar de carril para evitar vehículos que se mueven lentamente
    C: Puede cambiar de carril solo si no hay peatones presentes
    D: No cambie de carril mientras avanza a través de la intersección
  answer: D
  explanation: Al conducir a través de una intersección, mantenga ambas manos en el
    volante, reduzca la velocidad y ceda el paso a cualquier peatón o tráfico. No
    cambie de carril mientras avanza a través de la intersección.
- id: 169
  category: signs_and_signals
  question: ¿Cómo se manejan los giros a la derecha con luz roja en una intersección
    de flujo continuo?
  choices:
    A: Se tratan exactamente como los giros a la derecha con luz roja tradicionales
    B: Los giros a la derecha libres durante una luz roja están restringidos
    C: Siempre están permitidos sin detenerse
    D: Debe esperar a una flecha amarilla parpadeante para girar a la derecha
  answer: B
  explanation: Los giros a la derecha libres durante una luz roja están restringidos
    en esta intersección de flujo continuo, junto con el giro a la derecha tradicional
    con luz roja. Los automovilistas deben estar atentos a las señales de control
    de tráfico.
- id: 170
  category: safe_driving_rules
  question: ¿Cuál es una característica única de una intersección de diamante divergente?
  choices:
    A: Requiere que el tráfico conduzca brevemente por el lado opuesto de la carretera
    B: Utiliza una rotonda grande en lugar de semáforos
    C: Elimina todos los conflictos de giro a la derecha
    D: Requiere que todos los vehículos hagan un giro en U para entrar en la autopista
  answer: A
  explanation: Una intersección de diamante divergente requiere que el tráfico en
    el paso elevado (o paso inferior) de la autopista conduzca brevemente por el lado
    opuesto de la carretera de lo que están acostumbrados.
- id: 171
  category: safe_driving_rules
  question: ¿Cómo completa un automovilista una maniobra de giro a la izquierda en
    una intersección de giro en U continuo (Thru-Uturn)?
  choices:
    A: Girando a la izquierda directamente desde el carril central
    B: Usando un puente elevado designado para giros a la izquierda
    C: Atravesando la intersección, realizando un giro en U señalizado y regresando
      para hacer un giro a la derecha
    D: Esperando una flecha amarilla intermitente en la intersección principal
  answer: C
  explanation: En una intersección de giro en U continuo (Thru-Uturn), los automovilistas
    atraviesan la intersección, realizan un giro en U señalizado en un lugar alejado
    de la intersección y regresan a la misma, donde realizarán un giro a la derecha.
- id: 172
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla discontinua en su lado de la calzada?
  choices:
    A: Está prohibido rebasar en ambas direcciones
    B: Está viajando por una calzada de un solo sentido
    C: Se permite rebasar
    D: Debe incorporarse al carril derecho
  answer: C
  explanation: Una línea amarilla discontinua en su lado de una calzada de doble sentido
    indica que se permite rebasar.
- id: 173
  category: signs_and_signals
  question: ¿Qué indica una marca de carril blanca continua que separa un carril exprés
    de los carriles generales?
  choices:
    A: Se permite rebasar
    B: Está prohibido cruzar
    C: Hay tráfico en ambos sentidos más adelante
    D: El carril exprés está terminando
  answer: B
  explanation: Las marcas de carril blancas que separan un carril exprés o un carril
    para vehículos de alta ocupación (carpool) de los carriles generales indican una
    calzada de un solo sentido donde está prohibido cruzar.
- id: 174
  category: defensive_driving
  question: ¿Por qué debe evitar girar hacia un carril solo porque un vehículo que
    viene en sentido contrario tiene encendida su luz direccional?
  choices:
    A: Las luces direccionales suelen ser invisibles bajo la luz solar intensa
    B: El conductor puede planear girar después de pasarle, o puede haber olvidado
      apagarla
    C: El vehículo que viene en sentido contrario siempre tiene el derecho de paso
      para cambiar de opinión
    D: Debe esperar a una flecha verde para realizar cualquier giro
  answer: B
  explanation: No gire hacia un carril solo porque un vehículo que viene en sentido
    contrario tenga encendida una luz direccional. El conductor puede planear girar
    después de pasarle, o puede haber olvidado apagar su señal.
- id: 175
  category: safe_driving_rules
  question: ¿Qué establece la ley de velocidad básica en Utah?
  choices:
    A: Siempre debe conducir al límite de velocidad indicado.
    B: Nunca debe conducir más rápido de lo que sea razonablemente seguro.
    C: Puede conducir hasta 5 mph por encima del límite de velocidad para seguir el
      ritmo del tráfico.
    D: Debe conducir al menos a 45 mph en todas las autopistas.
  answer: B
  explanation: En Utah, la ley de velocidad básica establece que nunca debe conducir
    más rápido de lo que sea razonablemente seguro.
- id: 176
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad permitido al pasar por un edificio escolar
    durante el recreo escolar?
  choices:
    A: 15 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 35 millas por hora
  answer: B
  explanation: La velocidad permitida es de 20 millas por hora al pasar por un edificio
    o terrenos escolares durante el recreo escolar.
- id: 177
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    cualquier zona comercial o residencial en Utah?
  choices:
    A: 20 millas por hora
    B: 25 millas por hora
    C: 30 millas por hora
    D: 35 millas por hora
  answer: B
  explanation: La velocidad permitida es de 25 millas por hora en cualquier zona comercial
    o residencial.
- id: 178
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima que puede recorrer en un carril central compartido
    para girar a la izquierda antes de realizar su giro, asumiendo que no hay otros
    autos adelante?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Al realizar un giro a la izquierda desde un carril de giro compartido,
    no puede entrar en el carril más de 500 pies antes de realizar el giro, a menos
    que el último auto esté a más de 500 pies de la intersección.
- id: 179
  category: signs_and_signals
  question: ¿Qué indica un semáforo con una flecha amarilla intermitente?
  choices:
    A: Se permiten los giros, pero primero debe ceder el paso al tráfico que viene
      en sentido contrario y a los peatones.
    B: Usted tiene el derecho de paso para girar y el tráfico que viene en sentido
      contrario tiene luz roja.
    C: El semáforo está averiado y debe tratarlo como una parada de cuatro vías.
    D: Los giros están prohibidos hasta que la luz cambie a verde.
  answer: A
  explanation: Una luz de flecha amarilla intermitente significa que se permiten los
    giros, pero primero debe ceder el paso al tráfico que viene en sentido contrario
    y a los peatones. El tráfico que viene en sentido contrario tiene luz verde.
- id: 180
  category: signs_and_signals
  question: ¿Qué debe hacer si se aproxima a una intersección donde los semáforos
    no funcionan?
  choices:
    A: Continuar a través de la intersección sin detenerse si el camino está despejado.
    B: Reducir la velocidad a 15 mph y ceder el paso a la izquierda.
    C: Detenerse por completo y ceder el derecho de paso a cualquier vehículo a la
      derecha.
    D: Esperar a que llegue un oficial de policía antes de entrar en la intersección.
  answer: C
  explanation: Si se aproxima a una intersección donde los semáforos no funcionan,
    primero debe detenerse por completo antes de entrar en la intersección y ceder
    el derecho de paso a cualquier vehículo a la derecha, a menos que un oficial de
    paz indique lo contrario.
- id: 181
  category: signs_and_signals
  question: Si un semáforo está en verde pero un oficial de policía le indica que
    se detenga, ¿qué debe hacer?
  choices:
    A: Proceder con precaución porque la luz verde le da el derecho de paso.
    B: Detenerse, porque siempre debe obedecer las instrucciones de un oficial de
      policía en una intersección.
    C: Tocar la bocina para alertar al oficial que tiene la luz verde.
    D: Orillarse a un lado de la carretera y esperar a que la luz cambie a rojo.
  answer: B
  explanation: Independientemente de lo que indiquen los semáforos, obedezca siempre
    las instrucciones de un oficial de policía en una intersección. Si la luz está
    en verde y un oficial le indica que se detenga, USTED DEBE DETENERSE.
- id: 182
  category: signs_and_signals
  question: ¿Cuál es el propósito de las señales cuadradas o rectangulares de color
    verde, marrón o azul?
  choices:
    A: Advierten de un posible peligro más adelante.
    B: Le informan sobre las direcciones del tráfico, el uso de carriles y los límites
      de velocidad.
    C: Le informan sobre carreteras que se cruzan, lo guían hacia ciudades y marcan
      puntos de interés.
    D: Le advierten que reduzca la velocidad por un cruce de ferrocarril.
  answer: C
  explanation: Las señales de guía son cuadradas o rectangulares y son de color verde,
    marrón o azul. Le informan sobre carreteras que se cruzan y lo guían hacia ciudades
    y pueblos. Marcan puntos de interés y le ayudan a encontrar hospitales, estaciones
    de servicio, restaurantes y hoteles.
- id: 183
  category: signs_and_signals
  question: ¿Qué forma y color tienen la mayoría de las señales de advertencia que
    le alertan de un posible peligro más adelante?
  choices:
    A: Redondas y amarillas con letras negras
    B: En forma de diamante y amarillas con letras negras
    C: Cuadradas y blancas con letras rojas
    D: Rectangulares y verdes con letras blancas
  answer: B
  explanation: Las señales de advertencia avisan de un posible peligro más adelante.
    Por lo general, tienen forma de diamante y son amarillas con letras o símbolos
    negros.
- id: 184
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un procedimiento correcto al navegar por una
    rotonda?
  choices:
    A: Aumentar la velocidad al acercarse a la rotonda para incorporarse sin problemas.
    B: Ceder el paso al tráfico que se aproxima y a los peatones, entrando cuando
      esté despejado.
    C: Detenerse dentro de la rotonda para permitir que otros vehículos entren.
    D: No usar la señal de giro al salir de la rotonda.
  answer: B
  explanation: Al navegar por una rotonda, debe reducir la velocidad al acercarse,
    ceder el paso al tráfico que se aproxima y a los peatones, entrar cuando esté
    despejado y señalar su intención de salir.
- id: 185
  category: signs_and_signals
  question: ¿Bajo qué condición puede realizar un giro a la izquierda con una luz
    de flecha roja?
  choices:
    A: Nunca puede girar a la izquierda con una luz de flecha roja bajo ninguna circunstancia.
    B: Si se ha quedado bloqueado por la luz, es seguro y está girando de una calle
      de un solo sentido a otra calle de un solo sentido.
    C: Si no hay tráfico en sentido contrario y está girando hacia una calle de doble
      sentido.
    D: Si se encuentra en un carril compartido central para girar a la izquierda.
  answer: B
  explanation: Si, por alguna razón, la luz no cambia y usted se ha quedado bloqueado
    por la luz de flecha roja (giro a la izquierda), y es seguro hacerlo, puede realizar
    un giro a la izquierda desde una calle de un solo sentido hacia otra calle de
    un solo sentido.
- id: 186
  category: safe_driving_rules
  question: ¿Qué debe hacer si un peatón está entrando en un cruce de peatones no
    marcado en una intersección?
  choices:
    A: Continuar sin detenerse ya que el cruce de peatones no está marcado.
    B: Tocar la bocina para advertir al peatón que espere a que usted pase.
    C: Ceder el paso al peatón, incluso si el cruce de peatones no está marcado.
    D: Aumentar la velocidad para despejar la intersección antes de que el peatón
      cruce.
  answer: C
  explanation: Debe ceder el paso a los peatones que entren o estén en un cruce de
    peatones, incluso si no está marcado.
- id: 187
  category: signs_and_signals
  question: Si un semáforo está dispuesto horizontalmente, ¿dónde se ubica la luz
    roja?
  choices:
    A: A la izquierda
    B: En el medio
    C: A la derecha
    D: En la parte superior
  answer: A
  explanation: Si los semáforos son horizontales, la luz roja está a la izquierda,
    la luz amarilla está en el medio y la luz verde está a la derecha.
- id: 188
  category: safe_driving_rules
  question: ¿Qué debe hacer si debe detenerse por el tráfico o una señal mientras
    se aproxima a las vías del ferrocarril?
  choices:
    A: Detenerse directamente sobre las vías y esperar a que el tráfico avance.
    B: Esperar en la línea de parada antes de las vías hasta que haya espacio para
      cruzar completamente.
    C: Entrar en las vías y retroceder si se acerca un tren.
    D: Conducir alrededor de las barreras del cruce para evitar el embotellamiento.
  answer: B
  explanation: No se detenga sobre las vías del ferrocarril. Si debe detenerse por
    el tráfico o una señal, espere en la línea de parada antes de las vías.
- id: 189
  category: penalties_and_points
  question: ¿Puede recibir una citación por conducir demasiado lento en Utah?
  choices:
    A: No, conducir despacio siempre se considera una conducción segura.
    B: No, las citaciones solo se emiten por exceder el límite de velocidad.
    C: Sí, los oficiales de paz pueden emitir una citación si usted está impidiendo
      el flujo normal del tráfico.
    D: Sí, pero solo si conduce a menos de 10 millas por hora en una carretera interestatal.
  answer: C
  explanation: No conduzca tan despacio que se convierta en una fuente de peligro
    en la carretera. Los oficiales de paz están autorizados a emitirle una citación
    si está impidiendo el flujo normal del tráfico.
- id: 190
  category: signs_and_signals
  question: ¿De qué color y forma son las señales de advertencia de zona de obras?
  choices:
    A: Rojas y octogonales
    B: Naranjas y en forma de diamante o rectangulares
    C: Amarillas y circulares
    D: Blancas y rectangulares
  answer: B
  explanation: Las señales de zona de obras son de forma de diamante o rectangulares
    y de color naranja con letras o símbolos negros. Estas señales le advierten sobre
    zonas de obras y personas trabajando en la carretera o cerca de ella.
- id: 191
  category: penalties_and_points
  question: ¿Qué sucede con las multas por exceso de velocidad cuando conduce en una
    zona de obras?
  choices:
    A: Se exoneran si no hay trabajadores presentes.
    B: Se reducen a la mitad.
    C: Siguen siendo las mismas que las multas normales por exceso de velocidad.
    D: Se duplican.
  answer: D
  explanation: Reduzca la velocidad en las zonas de obras y esté preparado para detenerse
    rápidamente. No siga de cerca al vehículo de adelante. Las multas por exceso de
    velocidad en una zona de obras se duplican.
- id: 192
  category: safe_driving_rules
  question: Si usted y otro conductor llegan a una parada de cuatro vías al mismo
    tiempo, ¿a quién debe cederle el paso?
  choices:
    A: Al conductor a su izquierda
    B: Al conductor a su derecha
    C: Al conductor que va más rápido
    D: Al conductor que gira a la izquierda
  answer: B
  explanation: Debe ceder el paso al conductor a su derecha en una parada de cuatro
    vías si ambos llegan al mismo tiempo.
- id: 193
  category: safe_driving_rules
  question: Al entrar en una vía pública desde un camino privado o una entrada para
    vehículos (driveway), ¿qué debe hacer?
  choices:
    A: Ceder el paso a los conductores que ya se encuentran en la vía pública.
    B: Tocar la bocina y avanzar hacia el tráfico.
    C: Acelerar rápidamente para incorporarse sin detenerse.
    D: Esperar que los demás conductores le cedan el paso.
  answer: A
  explanation: Debe ceder el paso a los conductores en una vía pública si viene de
    una entrada para vehículos o de un camino privado.
- id: 194
  category: alcohol_drugs_health
  question: ¿A qué nivel de contenido de alcohol en sangre (BAC) se ve afectada la
    visión de todos los conductores?
  choices:
    A: '0.02'
    B: '0.04'
    C: '0.05'
    D: '0.08'
  answer: A
  explanation: La visión se ve afectada con un contenido de alcohol en sangre (BAC)
    de 0.02 para todos los conductores. El sentido más importante que utiliza al conducir
    es la visión.
- id: 195
  category: alcohol_drugs_health
  question: ¿Qué tipos de drogas pueden afectar su conducción al influir en sus reflejos,
    juicio, visión y estado de alerta?
  choices:
    A: Solo drogas ilegales
    B: Solo medicamentos recetados
    C: Drogas ilegales, medicamentos de venta libre y medicamentos recetados
    D: Solo drogas ilegales y medicamentos recetados
  answer: C
  explanation: Las drogas pueden afectar su conducción e influir en sus reflejos,
    juicio, visión y estado de alerta, al igual que el alcohol. Estas pueden incluir
    drogas ilegales, medicamentos de venta libre y medicamentos recetados.
- id: 196
  category: penalties_and_points
  question: Según la Ley "Ni una gota" (Not-a-Drop Act), ¿cuál es la sanción por una
    primera infracción si un conductor menor de 21 años tiene cualquier cantidad medible
    de alcohol en su cuerpo?
  choices:
    A: Privilegios de conducir denegados por 30 días
    B: Privilegios de conducir denegados por seis meses
    C: Privilegios de conducir denegados por un año
    D: Una advertencia y una clase obligatoria
  answer: B
  explanation: La Ley "Ni una gota" establece que a una persona menor de 21 años que
    conduzca con cualquier cantidad medible de alcohol en su cuerpo se le denegarán
    todos los privilegios de conducir durante seis meses por una primera infracción.
- id: 197
  category: penalties_and_points
  question: Si un joven de 15 años es condenado en un tribunal por posesión de alcohol,
    ¿cuándo comenzará y terminará la suspensión de su licencia de conducir?
  choices:
    A: Comienza de inmediato y dura 6 meses.
    B: Comienza en la fecha de la condena y se extiende de uno a dos años a partir
      de su cumpleaños número 16.
    C: Comienza en su cumpleaños número 18 y dura un año.
    D: Comienza en su cumpleaños número 21.
  answer: B
  explanation: Si el tribunal ordena la suspensión para un conductor menor de 16 años,
    el tiempo de suspensión comenzará en la fecha de la condena y se extenderá de
    uno a dos años a partir del cumpleaños número 16.
- id: 198
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de contenido de alcohol en sangre (BAC) para
    un conductor regular mayor de 21 años en Utah antes de estar en infracción de
    la ley?
  choices:
    A: '0.02'
    B: '0.04'
    C: '0.05'
    D: '0.08'
  answer: C
  explanation: Si tiene más de 0.05 de BAC (0.04 para licencias comerciales o CDL),
    usted infringe la ley.
- id: 199
  category: penalties_and_points
  question: Para un conductor de 21 años o más, ¿por cuánto tiempo se suspenderá su
    licencia de conducir por una primera condena por DUI?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: D
  explanation: En la primera condena por DUI para un conductor de 21 años o más, la
    licencia de conducir se suspenderá por 120 días.
- id: 200
  category: penalties_and_points
  question: Si un oficial de la paz confisca su licencia de conducir de Utah tras
    un arresto por DUI, ¿cuándo suspende la división la licencia?
  choices:
    A: Inmediatamente después del arresto
    B: A partir del décimo día después del arresto
    C: A partir del trigésimo día después del arresto
    D: A partir del cuadragésimo quinto día después de la fecha del arresto
  answer: D
  explanation: La ley de Utah permite que un oficial de la paz confisque su licencia
    de conducir de Utah al momento del arresto, y la división suspenderá la licencia
    a partir del cuadragésimo quinto día después de la fecha del arresto.
- id: 201
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de consentimiento implícito de Utah?
  choices:
    A: Usted acepta el registro de su vehículo si lo detienen por exceso de velocidad.
    B: Usted acepta someterse a una prueba química de su aliento, sangre, orina o
      fluidos orales si se lo solicita un oficial de la paz.
    C: Usted acepta pagar todas las multas de tráfico en un plazo de 30 días.
    D: Usted acepta que su vehículo sea confiscado si se estaciona ilegalmente.
  answer: B
  explanation: Cuando usted conduce un vehículo o una lancha a motor en Utah, se da
    por sentado que se someterá a una prueba química de su aliento, sangre, orina
    o fluidos orales para determinar el contenido de alcohol o drogas si se lo solicita
    un oficial de la paz. Esto se llama la ley de consentimiento implícito.
- id: 202
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción si un conductor mayor de
    21 años se niega a someterse a una prueba química bajo la ley de consentimiento
    implícito?
  choices:
    A: Licencia revocada por 6 meses
    B: Licencia revocada por 12 meses
    C: Licencia revocada por 18 meses
    D: Licencia revocada por 36 meses
  answer: C
  explanation: Si se niega a hacerlo [someterse a una prueba química], su licencia
    de conducir será revocada por 18 meses por la primera infracción.
- id: 203
  category: penalties_and_points
  question: ¿Cuál de las siguientes condenas resultará en un estatus de restricción
    de alcohol de por vida?
  choices:
    A: Un primer DUI (conducir bajo la influencia)
    B: Homicidio por automóvil o un DUI por delito grave
    C: Conducción temeraria
    D: Posesión de alcohol por un menor
  answer: B
  explanation: Se otorgará un estatus de restricción de alcohol de por vida cuando
    un conductor sea condenado por homicidio por automóvil o un DUI por delito grave.
- id: 204
  category: driver_responsibility
  question: Según el manual, ¿cuál es una forma recomendada de lidiar con sus emociones
    si está enojado o preocupado antes de conducir?
  choices:
    A: Conducir más rápido para llegar antes a su destino.
    B: Escuchar música a alto volumen para distraerse.
    C: Darse tiempo para calmarse dando un breve paseo o una siesta.
    D: Beber una pequeña cantidad de alcohol para calmar los nervios.
  answer: C
  explanation: 'Existen formas de lidiar con sus emociones: si está enojado o preocupado,
    dese tiempo para calmarse. Dé un breve paseo o tome una siesta, pero manténgase
    fuera de la carretera hasta que los síntomas hayan pasado.'
- id: 205
  category: penalties_and_points
  question: ¿Qué sucede si un conductor es condenado por conducir con cualquier cantidad
    medible de alcohol durante un período de restricción de alcohol?
  choices:
    A: La licencia del conductor será suspendida por 6 meses.
    B: La licencia del conductor será revocada por un año.
    C: El conductor deberá tomar un curso de conducción defensiva.
    D: El conductor recibirá un estatus de restricción de alcohol de por vida.
  answer: B
  explanation: Según el manual, si es condenado por conducir con cualquier cantidad
    medible de alcohol durante el período de restricción de alcohol, la licencia de
    conducir será revocada por un año.
- id: 206
  category: alcohol_drugs_health
  question: ¿Qué leyes se aplican si opera una lancha a motor bajo la influencia del
    alcohol o las drogas?
  choices:
    A: Solo enfrentará multas y sanciones marítimas.
    B: Se aplican las mismas leyes que si estuviera operando un vehículo motorizado.
    C: Su licencia de navegación es suspendida, pero su licencia de conducir no se
      ve afectada.
    D: Recibirá una advertencia por la primera infracción.
  answer: B
  explanation: Si opera una lancha a motor bajo la influencia del alcohol o las drogas,
    se aplican las mismas leyes que si estuviera operando un vehículo motorizado bajo
    la influencia.
- id: 207
  category: penalties_and_points
  question: ¿Cuánto tiempo dura la restricción del dispositivo de bloqueo de encendido
    (IID) para un conductor condenado por un primer DUI que era mayor de 21 años al
    momento del arresto?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 3 años
  answer: C
  explanation: Cuando una persona ha sido condenada por un primer DUI, se le restringe
    al uso de un dispositivo de bloqueo de encendido (IID) por 18 meses, o tres años
    si es menor de 21 años al momento del arresto.
- id: 208
  category: penalties_and_points
  question: Si un conductor con restricción de bloqueo de encendido intenta arrancar
    el vehículo con una cantidad medible de alcohol, ¿cuál es la sanción?
  choices:
    A: El vehículo es confiscado y vendido inmediatamente.
    B: La licencia de conducir es revocada permanentemente.
    C: El requisito del bloqueo de encendido se extiende por 60 días por cada ocurrencia.
    D: El conductor debe pagar una multa de $500.
  answer: C
  explanation: Si un conductor no hace que se monitoree el dispositivo o intenta arrancar
    el vehículo con una cantidad medible de alcohol, el requisito del bloqueo de encendido
    se extenderá por 60 días por cada ocurrencia.
- id: 209
  category: penalties_and_points
  question: ¿Con qué frecuencia deben los conductores con restricción de bloqueo de
    encendido hacer que se monitoree el dispositivo?
  choices:
    A: Al menos cada 30 días
    B: Al menos cada 60 días
    C: Al menos cada 90 días
    D: Al menos cada 6 meses
  answer: B
  explanation: Los conductores con restricción de bloqueo de encendido deben hacer
    que se monitoree el dispositivo al menos cada 60 días.
- id: 210
  category: penalties_and_points
  question: Si su vehículo es confiscado después de un arresto por DUI, ¿qué debe
    suceder antes de que se le devuelva?
  choices:
    A: Debe esperar 30 días para una liberación automática.
    B: Debe cumplir con todos los requisitos y pagar todas las tarifas, incluyendo
      el remolque y el almacenamiento.
    C: Debe pagar una tarifa administrativa fija de $100 al oficial que realizó el
      arresto.
    D: Debe demostrar en el tribunal que no estaba bajo la influencia.
  answer: B
  explanation: El vehículo confiscado será devuelto al propietario una vez que se
    hayan cumplido todos los requisitos y se hayan pagado todas las tarifas, que incluyen
    el remolque, los cargos de almacenamiento y los costos administrativos.
- id: 211
  category: defensive_driving
  question: ¿Si se le cae algo o le pica una abeja mientras conduce, cuál es la acción
    más segura?
  choices:
    A: Frenar bruscamente y detenerse en su carril.
    B: Seguir conduciendo e ignorar el problema hasta llegar a su destino.
    C: Orillarse inmediatamente a un lado de la carretera y encargarse del problema.
    D: Pedirle a un pasajero que tome el volante mientras usted se encarga de ello.
  answer: C
  explanation: Si tiene un problema o hay una distracción, como que se le caiga algo
    o le pique una abeja, oríllese inmediatamente a un lado de la carretera y encárguese
    del problema.
- id: 212
  category: penalties_and_points
  question: Según la ley de Utah, ¿cuál es una posible sanción por una primera condena
    por furia al volante (road rage)?
  choices:
    A: Una sentencia de cárcel obligatoria de 30 días
    B: Una multa de hasta $5,000
    C: Suspensión de la licencia por un año
    D: Revocación permanente de los privilegios de conducir
  answer: C
  explanation: Para la furia al volante, el manual establece que el tribunal puede
    ordenar que su licencia sea suspendida por un año en la primera condena.
- id: 213
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si un animal aparece repentinamente en
    su camino en la carretera?
  choices:
    A: Virar rápidamente hacia el carril contrario para evitar golpearlo.
    B: Tocar la bocina continuamente y acelerar.
    C: No virar bruscamente; mantenga su vehículo bajo control y en el carril de circulación.
    D: Usar las luces altas intermitentes para ahuyentarlo.
  answer: C
  explanation: Para reducir las posibilidades de chocar con un animal, no vire bruscamente
    para evitar al animal (su riesgo de lesiones personales puede ser mayor) y mantenga
    su vehículo bajo control y en el carril de circulación.
- id: 214
  category: safe_driving_rules
  question: Si necesita ayuda a un lado de la carretera, ¿cuál es una forma de pedir
    asistencia?
  choices:
    A: Pararse en el carril de circulación y agitar los brazos.
    B: Atar algo blanco o naranja en la antena o en la manija de la puerta izquierda.
    C: Salir de su vehículo y caminar por la autopista.
    D: Apagar todas las luces para que no se agote la batería.
  answer: B
  explanation: Si necesita ayuda, oríllese a un lado de la carretera, encienda las
    luces de emergencia, levante el capó y ate algo blanco o naranja en la antena
    o en la manija de la puerta izquierda.
- id: 215
  category: defensive_driving
  question: Si su vehículo se avería mientras conduce en el desierto, ¿qué debería
    hacer generalmente?
  choices:
    A: Quedarse con su vehículo a menos que la ayuda sea visible a pocos minutos a
      pie.
    B: Empezar a caminar por la carretera para encontrar el pueblo más cercano.
    C: Dejar el capó cerrado para evitar que entre arena en el motor.
    D: Beber toda su agua inmediatamente para mantenerse hidratado.
  answer: A
  explanation: Si su vehículo se avería en el desierto, quédese con él. No se aleje
    a menos que sea para obtener ayuda de un teléfono de emergencia visible o de un
    edificio habitado a pocos minutos a pie.
- id: 216
  category: safe_driving_rules
  question: Al realizar un viaje largo por carretera, ¿con qué frecuencia debería
    planear detenerse y tomar un descanso de la conducción?
  choices:
    A: Cada hora
    B: Cada dos horas
    C: Cada cuatro horas
    D: Solo cuando necesite cargar combustible
  answer: B
  explanation: Antes de realizar un viaje, planee detenerse cada dos horas durante
    los viajes largos para tomar un descanso de la conducción y evitar la fatiga.
- id: 217
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una práctica recomendada para evitar distracciones
    antes de conducir?
  choices:
    A: Configurar su sistema de navegación mientras sale de la entrada de su casa
    B: Mantener a las mascotas sueltas en el vehículo para que estén cómodas
    C: Comer y arreglarse antes de salir
    D: Enviar mensajes de texto con su destino a sus amigos mientras está en un semáforo
      en rojo
  answer: C
  explanation: El manual aconseja evitar distracciones antes de conducir apagando
    los dispositivos móviles, configurando los sistemas de navegación, comiendo y
    arreglándose antes de salir, y asegurando todos los objetos sueltos.
- id: 218
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir un vehículo sin un Dispositivo de Bloqueo
    de Encendido (IID) instalado cuando tiene restringido hacerlo?
  choices:
    A: Una advertencia y una multa de $50
    B: Incautación del vehículo, revocación de la licencia por 1 año y una restricción
      adicional de IID por 2 años
    C: Una suspensión de la licencia por 6 meses y escuela de tráfico obligatoria
    D: Revocación inmediata de por vida de los privilegios de conducir
  answer: B
  explanation: Si una persona conduce sin un IID cuando tiene la restricción, el vehículo
    puede ser incautado. Una condena por violar la ley de IRD resultará en una revocación
    de la licencia por 1 año y una restricción adicional de IID por 2 años.
- id: 219
  category: safe_driving_rules
  question: ¿Cuánta agua en movimiento se necesita para arrastrar a la mayoría de
    los vehículos, incluidos los vehículos utilitarios deportivos (SUV) y las camionetas
    pick-up?
  choices:
    A: Seis pulgadas
    B: Un pie
    C: Dos pies
    D: Tres pies
  answer: C
  explanation: Según el manual, dos pies de agua en movimiento pueden arrastrar a
    la mayoría de los vehículos, incluidos los vehículos utilitarios deportivos y
    las camionetas pick-up.
- id: 220
  category: safe_driving_rules
  question: Según la ley de Utah, ¿cuándo se le permite a un conductor menor de 18
    años usar un dispositivo de comunicación inalámbrica portátil (HWC) mientras conduce?
  choices:
    A: Al usar comandos de voz para conectarse a una llamada
    B: Al comunicarse con un padre o tutor legal
    C: Cuando está detenido en un semáforo en rojo
    D: Al usar las funciones de GPS del dispositivo
  answer: B
  explanation: Los conductores menores de 18 años solo pueden usar un dispositivo
    HWC mientras operan un vehículo motorizado durante una emergencia médica, para
    informar un peligro de seguridad, informar una actividad criminal o comunicarse
    con un padre o tutor legal.
- id: 221
  category: penalties_and_points
  question: ¿Cuál es la sanción por una infracción por enviar mensajes de texto al
    conducir si el conductor causa lesiones corporales o tiene una infracción previa
    por este delito?
  choices:
    A: Un delito menor de Clase C
    B: Un delito menor de Clase B
    C: Un delito menor de Clase A
    D: Una felonía de tercer grado
  answer: B
  explanation: Una persona condenada por una infracción de envío de mensajes de texto
    es culpable de un delito menor de Clase C, pero se convierte en un delito menor
    de Clase B si causa lesiones corporales o tiene una infracción previa por este
    delito.
- id: 222
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de construcción
    de carreteras?
  choices:
    A: Una suspensión obligatoria de la licencia
    B: Una multa de al menos el doble del monto de la multa regular por exceso de
      velocidad
    C: Una comparecencia obligatoria ante el tribunal y escuela de tránsito
    D: Una multa de $500 y servicio comunitario
  answer: B
  explanation: Los tribunales están obligados a multar a un conductor que exceda la
    velocidad en una zona de construcción de carreteras con al menos el doble del
    monto de la multa regular por exceso de velocidad.
- id: 223
  category: defensive_driving
  question: ¿Cuál es la acción más segura a tomar si se encuentra en medio de una
    tormenta eléctrica mientras conduce?
  choices:
    A: Bajar las ventanas para igualar la presión
    B: Estacionarse debajo de un árbol grande
    C: Asegurarse de que todas las puertas estén cerradas y las ventanas subidas en
      un vehículo de techo rígido
    D: Salir del vehículo y acostarse boca abajo en una zanja
  answer: C
  explanation: Solo un vehículo de techo rígido le protegerá en una tormenta eléctrica.
    Asegúrese de que todas las puertas estén cerradas y las ventanas subidas, y no
    toque ninguna superficie metálica.
- id: 224
  category: sharing_the_road
  question: Al viajar cuesta abajo en una carretera de montaña estrecha, ¿qué debe
    hacer si se encuentra con un vehículo que va cuesta arriba?
  choices:
    A: Tocar la bocina y continuar
    B: Ceder el paso al vehículo que va cuesta arriba
    C: El vehículo que va cuesta arriba debe cederle el paso a usted
    D: Ambos vehículos deben detenerse y esperar a un banderillero
  answer: B
  explanation: Debe ceder el paso a los vehículos que van cuesta arriba si usted viaja
    cuesta abajo en una carretera estrecha.
- id: 225
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una práctica prohibida al conducir cuesta abajo
    en las montañas?
  choices:
    A: Usar una marcha más baja
    B: Bajar por inercia (coasting) poniendo el vehículo en punto muerto o desembragando
      el embrague
    C: Mantenerse cerca del borde derecho de la carretera
    D: Tocar la bocina al acercarse a una curva cerrada
  answer: B
  explanation: Al conducir en las montañas, no debe bajar por inercia poniendo el
    vehículo en punto muerto o desembragando el embrague.
- id: 226
  category: safe_driving_rules
  question: ¿Cuándo debe asegurarse de que los faros delanteros y las luces traseras
    de su vehículo estén encendidos?
  choices:
    A: Desde el atardecer hasta el amanecer, o cuando no pueda ver claramente a 1,000
      pies de distancia
    B: De 8:00 PM a 6:00 AM
    C: Solo cuando conduzca por carreteras rurales sin iluminación
    D: Desde una hora después del atardecer hasta una hora antes del amanecer
  answer: A
  explanation: Los faros delanteros y las luces traseras deben estar encendidos desde
    el atardecer hasta el amanecer, o cuando las personas y los vehículos no sean
    claramente visibles a una distancia de 1,000 pies debido a la falta de luz o condiciones
    atmosféricas desfavorables.
- id: 227
  category: safe_driving_rules
  question: ¿A qué distancia debe atenuar las luces altas cuando se aproxima un automóvil
    en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Si las luces altas de su vehículo están encendidas y un automóvil viene
    hacia usted, atenúe sus luces antes de estar a menos de 500 pies del automóvil
    que se aproxima.
- id: 228
  category: safe_driving_rules
  question: ¿A qué distancia debe atenuar sus luces cuando sigue a otro vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Si sigue a un automóvil, atenúe sus luces cuando esté a menos de 300
    pies del vehículo que va delante de usted.
- id: 229
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo que viene en sentido contrario no atenúa
    sus luces altas por la noche?
  choices:
    A: Destellar sus luces altas repetidamente
    B: Mirar hacia el lado derecho de la carretera
    C: Mirar directamente a sus faros para calcular su distancia
    D: Detenerse en el acotamiento y parar
  answer: B
  explanation: Si un vehículo que viene en sentido contrario no atenúa las luces,
    mire hacia el lado derecho de la carretera. Esto ayuda a evitar ser deslumbrado
    por los faros.
- id: 230
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso al acercarse a un puente estrecho o de
    un solo carril en una carretera rural?
  choices:
    A: El vehículo más grande
    B: El vehículo que viaja cuesta arriba
    C: El primer conductor en llegar al puente
    D: El vehículo que viaja a una velocidad más rápida
  answer: C
  explanation: En puentes estrechos y puentes de un solo carril, el primer conductor
    en llegar al puente tiene el derecho de paso. Los conductores deben turnarse para
    cruzar el puente.
- id: 231
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una señal de advertencia de somnolencia al
    conducir?
  choices:
    A: Revisar los espejos con frecuencia
    B: Mantener el vehículo perfectamente centrado en el carril
    C: Recordar claramente las últimas millas recorridas
    D: Pisar una banda sonora (rumble strip) o desviarse de su carril
  answer: D
  explanation: Las señales de advertencia de somnolencia incluyen pisar una banda
    sonora o desviarse de su carril, bostezar repetidamente y no poder recordar las
    últimas millas recorridas.
- id: 232
  category: safe_driving_rules
  question: ¿A qué velocidad puede su automóvil comenzar a experimentar hidroplaneo
    (hydroplane) en carreteras mojadas?
  choices:
    A: A más de 25 mph
    B: A más de 35 mph
    C: A más de 45 mph
    D: A más de 55 mph
  answer: B
  explanation: El manual establece que su automóvil puede comenzar a experimentar
    hidroplaneo a velocidades superiores a 35 mph cuando los neumáticos delanteros
    se deslizan sobre el agua en lugar de la carretera.
- id: 233
  category: defensive_driving
  question: ¿Qué debe hacer si las ruedas traseras de su vehículo comienzan a derrapar
    hacia la derecha?
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar las ruedas delanteras hacia la izquierda
    C: Girar las ruedas delanteras hacia la derecha
    D: Acelerar para recuperar la tracción
  answer: C
  explanation: Si sus ruedas traseras derrapan hacia la derecha, debe girar las ruedas
    delanteras hacia la derecha para ayudar a recuperar el control.
- id: 234
  category: defensive_driving
  question: Si su vehículo cae en un cuerpo de agua, ¿aproximadamente cuánto tiempo
    flotará en la superficie?
  choices:
    A: De 10 a 20 segundos
    B: De 30 a 60 segundos
    C: De 2 a 3 minutos
    D: De 5 a 10 minutos
  answer: B
  explanation: Si su vehículo cae al agua, solo flotará en la superficie de 30 a 60
    segundos, por lo que debe intentar salir de inmediato.
- id: 235
  category: defensive_driving
  question: ¿Qué debe hacer con su ropa si su vehículo se está hundiendo rápidamente
    en el agua y no puede abrir la puerta o la ventana?
  choices:
    A: Dejarse toda la ropa puesta para prevenir la hipotermia
    B: Quitarse la ropa pesada pero dejarse los zapatos puestos
    C: Quitarse toda la ropa, incluidos los zapatos
    D: Quitarse solo los zapatos
  answer: B
  explanation: Debe quitarse la ropa pesada que pueda hacer que se hunda, pero debe
    dejarse los zapatos puestos en caso de que tenga que patear la ventana para escapar.
- id: 236
  category: vehicle_information
  question: Al conducir en climas muy calurosos, ¿por qué NO debe dejar salir el aire
    de sus neumáticos cuando la presión aumenta?
  choices:
    A: Hará que el neumático se derrita
    B: La presión será demasiado baja cuando los neumáticos se enfríen
    C: Aumenta el riesgo de hidroplaneo
    D: Hará que el motor se sobrecaliente
  answer: B
  explanation: La presión del aire aumenta con la temperatura, pero no debe dejar
    salir el aire porque la presión será demasiado baja cuando los neumáticos se enfríen.
- id: 237
  category: safe_driving_rules
  question: ¿De qué peligro debe estar atento en el pavimento de la carretera durante
    el clima caluroso?
  choices:
    A: El asfalto derretido (bleeding tar) que puede ser resbaladizo
    B: El concreto que se expande y causa baches
    C: Las líneas pintadas que se derriten
    D: El aumento del resplandor del hielo negro (black ice)
  answer: A
  explanation: El alquitrán en el pavimento de la carretera frecuentemente sube a
    la superficie en climas calurosos, y estas manchas de asfalto derretido pueden
    ser resbaladizas.
- id: 238
  category: vehicle_information
  question: En Utah, ¿en qué fechas se permiten los neumáticos para nieve con clavos
    metálicos?
  choices:
    A: Del 1 de noviembre al 28 de febrero
    B: Del 15 de octubre al 31 de marzo
    C: Del 1 de septiembre al 30 de abril
    D: Del 1 de diciembre al 1 de marzo
  answer: B
  explanation: Los neumáticos para nieve con clavos metálicos pueden usarse desde
    el 15 de octubre hasta el 31 de marzo de cada año.
- id: 239
  category: safe_driving_rules
  question: Cuando comienza a caer lluvia helada o nieve, ¿qué áreas de la carretera
    es probable que se congelen primero?
  choices:
    A: Intersecciones y pasos de peatones
    B: Caminos rurales con zanjas
    C: Puentes, rampas y pasos elevados
    D: Carreteras con asfalto derretido
  answer: C
  explanation: Cuando comienza a caer aguanieve, lluvia helada o nieve, recuerde que
    es probable que los puentes, las rampas y los pasos elevados se congelen primero.
- id: 240
  category: defensive_driving
  question: Si se queda varado en un clima frío, ¿con qué frecuencia debe encender
    el motor y la calefacción?
  choices:
    A: Continuamente hasta que llegue ayuda
    B: Aproximadamente 10 minutos cada hora
    C: 30 minutos cada dos horas
    D: Solo cuando la temperatura baje de cero
  answer: B
  explanation: Se recomienda encender el motor durante aproximadamente 10 minutos
    cada hora para cargar la batería y calentar el interior.
- id: 241
  category: defensive_driving
  question: ¿Por qué es importante mantener el tubo de escape libre de nieve y escombros
    si se queda varado en su vehículo?
  choices:
    A: Para evitar que el motor se sobrecaliente
    B: Para evitar que la batería se agote
    C: Para evitar que los vapores de monóxido de carbono se filtren en el vehículo
    D: Para asegurar que la calefacción sople aire caliente
  answer: C
  explanation: Mantenga el tubo de escape libre de nieve y escombros porque los gases
    del escape pueden filtrarse en el vehículo y hacer que pierda el conocimiento
    o muera.
- id: 242
  category: vehicle_information
  question: ¿Cuál es una forma recomendada de ayudar a prevenir problemas con los
    frenos en climas gélidos?
  choices:
    A: Frenar bruscamente cada pocos kilómetros
    B: Tocar ligeramente los frenos ocasionalmente
    C: Aplicar el freno de mano mientras conduce
    D: Evitar el uso de los frenos por completo
  answer: B
  explanation: En climas gélidos, los frenos pueden congelarse por completo o volverse
    ineficaces. Para ayudar a prevenir problemas, toque ligeramente los frenos ocasionalmente.
- id: 243
  category: penalties_and_points
  question: ¿Cuál es la multa máxima que puede recibir por no permanecer en la escena
    de un choque en el que esté involucrado?
  choices:
    A: $500
    B: $1000
    C: $2500
    D: $5000
  answer: C
  explanation: Puede recibir una sentencia de cárcel de hasta un año, una multa de
    hasta $2500, o ambas, por no permanecer en la escena de un choque.
- id: 244
  category: penalties_and_points
  question: ¿No detenerse en la escena de un choque con heridos se clasifica como
    qué tipo de delito?
  choices:
    A: Un delito menor de clase B
    B: Un delito menor de clase A
    C: Un delito grave de tercer grado
    D: Un delito grave de primer grado
  answer: C
  explanation: Es un delito grave de tercer grado que una persona no se detenga en
    la escena de un choque con heridos.
- id: 245
  category: driver_responsibility
  question: ¿Qué le permite hacer la ley si está involucrado en un choque que resulta
    ÚNICAMENTE en daños a la propiedad sin heridos?
  choices:
    A: Abandonar la escena inmediatamente sin intercambiar información
    B: Mover el vehículo fuera de los carriles de circulación a un lugar seguro
    C: Dejar los vehículos exactamente donde están hasta que llegue la policía
    D: Esperar a una grúa antes de mover el vehículo del carril de circulación
  answer: B
  explanation: Si el choque resulta solo en daños a la propiedad y no hay heridos,
    la ley permite al conductor mover el vehículo lo antes posible fuera de los carriles
    de circulación a un acotamiento adyacente o lugar seguro.
- id: 246
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias debe notificar inmediatamente a las autoridades
    (911) después de un choque?
  choices:
    A: Solo si otro conductor estuvo involucrado y huyó de la escena.
    B: Si el choque resulta en lesiones, muerte o al menos $2500 en daños totales
      a la propiedad.
    C: Si el choque resulta en al menos $1000 en daños a la propiedad.
    D: Solo si uno de los vehículos necesita ser remolcado de la calzada.
  answer: B
  explanation: Si el choque resulta en lesiones, muerte o al menos $2500 en daños
    totales a la propiedad, debe notificar a las autoridades (911) de inmediato.
- id: 247
  category: driver_responsibility
  question: Si choca contra un vehículo desatendido y no se puede encontrar al propietario,
    ¿qué información debe dejar en una nota?
  choices:
    A: Su número de licencia de conducir y el número de póliza de seguro.
    B: Su número de teléfono y el nombre de su agente de seguros.
    C: Nombre y dirección del conductor de su vehículo, y el número de placa del vehículo
      que causó el choque.
    D: Solo el número de registro de su vehículo y su número de teléfono.
  answer: C
  explanation: Si el propietario de un vehículo desatendido no está disponible, debe
    dejar una nota que proporcione el nombre y la dirección del conductor de su vehículo,
    y el número de placa del vehículo que causó el choque.
- id: 248
  category: defensive_driving
  question: Según un estudio nacional, ¿qué porcentaje de todos los choques automovilísticos
    involucran el error del conductor como factor?
  choices:
    A: 25%
    B: 50%
    C: 75%
    D: 90%
  answer: C
  explanation: Un estudio nacional reveló que el error del conductor es un factor
    en el 75% de todos los choques automovilísticos.
- id: 249
  category: defensive_driving
  question: ¿En qué momento del día ocurren la mayoría de los choques?
  choices:
    A: Entre las 6 am y las 9 am
    B: Entre las 10 pm y las 2 am
    C: Entre las 12 pm y las 2 pm
    D: Entre las 2 pm y las 6 pm
  answer: D
  explanation: El momento del día en que ocurren la mayoría de los choques es entre
    las 2 pm y las 6 pm.
- id: 250
  category: safe_driving_rules
  question: ¿Qué debe hacer para pedir ayuda si su vehículo falla y no tiene acceso
    a un dispositivo móvil?
  choices:
    A: Pararse en medio de la carretera y agitar los brazos.
    B: Dejar el capó de su auto levantado y las luces de emergencia encendidas.
    C: Caminar hasta la rampa de salida o calle transversal más cercana para buscar
      un teléfono.
    D: Tocar la bocina continuamente hasta que llegue ayuda.
  answer: B
  explanation: Si no tiene acceso a un dispositivo móvil, deje el capó de su auto
    levantado y las luces de emergencia encendidas. Esto avisará al público que circula
    que necesita asistencia.
- id: 251
  category: vehicle_information
  question: Si sus frenos dejan de funcionar mientras conduce, ¿cuál es el primer
    paso que debe tomar?
  choices:
    A: Cambie a punto muerto (neutral) y apague el motor inmediatamente.
    B: Bombee el pedal del acelerador para generar presión.
    C: Aplique el freno de estacionamiento lentamente para evitar bloquear las ruedas
      traseras.
    D: Accione el freno de estacionamiento con la mayor fuerza posible.
  answer: C
  explanation: Si sus frenos dejan de funcionar mientras conduce, use el freno de
    estacionamiento. Aplique el freno de estacionamiento lentamente para evitar bloquear
    las ruedas traseras.
- id: 252
  category: vehicle_information
  question: ¿Cómo debe utilizar los sistemas de frenos antibloqueo (ABS) durante una
    parada de emergencia?
  choices:
    A: Bombee el pedal del freno rápidamente.
    B: Presione el pedal del freno ligeramente para evitar derrapar.
    C: Presione el pedal del freno con la mayor fuerza posible y mantenga la presión.
    D: Use el freno de estacionamiento al mismo tiempo que el freno de pie.
  answer: C
  explanation: Para usar el ABS, presione el pedal del freno con la mayor fuerza posible
    y mantenga la presión. El ABS solo funciona si se mantiene el pie en el pedal
    del freno.
- id: 253
  category: safe_driving_rules
  question: ¿Dónde debe colocar las bengalas o triángulos de emergencia si su vehículo
    se avería?
  choices:
    A: De 50 a 100 pies detrás de su vehículo
    B: De 100 a 150 pies detrás de su vehículo
    C: De 200 a 300 pies detrás de su vehículo
    D: A 500 pies detrás de su vehículo
  answer: C
  explanation: Coloque bengalas o triángulos de emergencia de 200 a 300 pies detrás
    de su vehículo, dando a otros conductores tiempo para cambiar de carril o reducir
    la velocidad.
- id: 254
  category: vehicle_information
  question: ¿Qué sucede con el volante si el motor se apaga mientras conduce?
  choices:
    A: Se bloqueará por completo y no se podrá girar.
    B: Se volverá muy flojo y sensible.
    C: Girará automáticamente el vehículo hacia la derecha.
    D: Puede ser difícil de girar, pero usted podrá girarlo.
  answer: D
  explanation: Mantenga el volante con firmeza si el motor se apaga mientras conduce.
    El volante puede ser difícil de girar, pero usted podrá girarlo.
- id: 255
  category: safe_driving_rules
  question: ¿Qué debe hacer si su vehículo acelera fuera de control debido a un pedal
    del acelerador atascado?
  choices:
    A: Cambie a punto muerto (neutral), maniobre con suavidad, frene suavemente y
      salga de la carretera.
    B: Apague el encendido inmediatamente y aplique el freno de estacionamiento.
    C: Cambie a reversa para reducir la velocidad del vehículo.
    D: Bombee el pedal del freno rápidamente mientras sujeta el volante con poca firmeza.
  answer: A
  explanation: Si su vehículo acelera fuera de control, cambie a punto muerto (neutral)
    y busque un lugar seguro para detenerse, maniobre con suavidad, frene suavemente
    y salga de la carretera.
- id: 256
  category: vehicle_information
  question: ¿Cómo reaccionará su vehículo si se revienta una llanta trasera?
  choices:
    A: El vehículo tirará con fuerza en dirección opuesta a la llanta reventada.
    B: El vehículo se tambaleará, vibrará y tirará hacia la llanta reventada.
    C: El volante se bloqueará por completo.
    D: El vehículo trompeará inmediatamente.
  answer: B
  explanation: Si se revienta una llanta trasera, el vehículo se tambaleará, vibrará
    y tirará hacia la llanta reventada.
- id: 257
  category: safe_driving_rules
  question: ¿Cuál es la acción correcta a tomar si se pincha una llanta mientras conduce?
  choices:
    A: Frene bruscamente de inmediato para detener el vehículo.
    B: Gire el volante bruscamente en la dirección opuesta a la llanta pinchada.
    C: Sujete el volante con firmeza, mantenga la dirección recta, reduzca la velocidad
      gradualmente y retire el pie del acelerador.
    D: Acelere ligeramente para mantener el control del vehículo.
  answer: C
  explanation: Si se pincha una llanta, sujete el volante con firmeza, mantenga la
    dirección recta, reduzca la velocidad gradualmente y retire el pie del acelerador;
    no frene.
- id: 258
  category: penalties_and_points
  question: ¿Cuál es la sanción por operar a sabiendas un vehículo motorizado sin
    la garantía del propietario (seguro)?
  choices:
    A: Un delito menor de clase C
    B: Un delito menor de clase B
    C: Un delito menor de clase A
    D: Un delito grave de tercer grado
  answer: B
  explanation: Cualquier persona que opere a sabiendas un vehículo motorizado o permita
    que se opere sin la garantía del propietario es culpable de un delito menor de
    clase B.
- id: 259
  category: penalties_and_points
  question: Si un tribunal dicta una sentencia en su contra por daños y perjuicios
    y esta no se cumple, ¿cuánto tiempo tiene antes de que se le suspenda el privilegio
    de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Si esta sentencia no se cumple dentro de los 60 días posteriores a
    la decisión del tribunal, se le suspenderá el privilegio de conducir.
- id: 260
  category: defensive_driving
  question: ¿Qué debe hacer si sus ruedas se salen de la superficie pavimentada de
    la carretera hacia una superficie irregular?
  choices:
    A: Entrar en pánico y frenar bruscamente de inmediato.
    B: Dar un volantazo brusco para volver a la carretera.
    C: Acelerar para recuperar la tracción.
    D: Reducir la velocidad gradualmente y luego volver a entrar en la calzada.
  answer: D
  explanation: No entre en pánico si sus ruedas se salen de la superficie pavimentada
    de la carretera. Reduzca la velocidad gradualmente y luego vuelva a entrar en
    la calzada.
- id: 261
  category: driver_responsibility
  question: ¿Por cuánto tiempo se debe mantener la "prueba futura" de responsabilidad
    financiera (seguro SR22) después de la fecha de una suspensión o revocación?
  choices:
    A: Un año
    B: Dos años
    C: Tres años
    D: Cinco años
  answer: C
  explanation: El manual establece que la prueba de responsabilidad financiera (SR22)
    debe mantenerse durante tres años después de la fecha de la suspensión o revocación.
- id: 262
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma aceptable de presentar una prueba
    de seguro a un oficial de la paz?
  choices:
    A: Solo presentando una tarjeta de seguro física en papel
    B: Proporcionando una confirmación verbal de su número de póliza
    C: Electrónicamente mediante un dispositivo electrónico móvil
    D: Mostrando una carta notariada de su agente de seguros
  answer: C
  explanation: La ley establece que usted puede proporcionar una prueba de seguro
    a un oficial de la paz de forma electrónica utilizando un dispositivo electrónico
    móvil.
- id: 263
  category: vehicle_information
  question: ¿Qué cubre el seguro de Protección contra Daños Personales (PIP)?
  choices:
    A: Reparaciones a su vehículo después de una colisión
    B: Beneficios básicos por lesiones corporales para usted y otros sin tener que
      determinar la culpabilidad
    C: Daños a su vehículo causados por incendio, robo o vandalismo
    D: Daños a la propiedad causados por un conductor sin seguro
  answer: B
  explanation: La Protección contra Daños Personales (también conocida como "Sin Culpa"
    o "PIP") es obligatoria y proporciona algunos beneficios básicos y cobertura por
    lesiones corporales para usted y otros sin tener que determinar la "culpabilidad"
    en un choque.
- id: 264
  category: vehicle_information
  question: ¿Qué tipo de cobertura de seguro paga las reparaciones de su vehículo
    por daños causados por motivos distintos a las colisiones, como incendio, robo
    o vandalismo?
  choices:
    A: Colisión
    B: Responsabilidad por lesiones corporales
    C: Conductor sin seguro
    D: Integral (Comprehensive)
  answer: D
  explanation: El seguro integral (Comprehensive) cubre las reparaciones de su vehículo
    por daños causados por motivos distintos a las colisiones, como incendio, robo,
    vandalismo o rotura de cristales.
- id: 265
  category: penalties_and_points
  question: ¿Cuál es la sanción si se le condena en un tribunal por conducir sin seguro?
  choices:
    A: Una multa de $100 y 30 días de cárcel
    B: El requisito de portar un SR22 durante tres años y pagar una tarifa de reinstalación
      de $40
    C: Revocación permanente de sus privilegios de conducir
    D: Servicio comunitario obligatorio y una multa de $500
  answer: B
  explanation: Si se le condena por conducir sin seguro o sin prueba de seguro, se
    le exigirá que porte un SR22 durante tres años y que pague una tarifa de reinstalación
    de $40.
- id: 266
  category: driver_responsibility
  question: Los informes de choques están protegidos y pueden entregarse a ciertas
    personas. ¿Quién está explícitamente excluido de recibir un informe de choque?
  choices:
    A: Padres o tutores legales de los involucrados
    B: Investigadores privados con licencia
    C: Testigos del choque
    D: Los medios de comunicación
  answer: C
  explanation: Un informe de choque puede entregarse a las personas involucradas en
    el choque, excluyendo a los testigos.
- id: 267
  category: penalties_and_points
  question: ¿Cuánto tiempo permanecen en su historial de conducción las infracciones,
    suspensiones y revocaciones relacionadas con el alcohol o las drogas?
  choices:
    A: 3 años
    B: 5 años
    C: 7 años
    D: 10 años
  answer: D
  explanation: La División de Licencias de Conducir mantiene un registro de conducción
    computarizado, y todas las infracciones, suspensiones y revocaciones relacionadas
    con el alcohol/drogas permanecen en el registro durante 10 años.
- id: 268
  category: penalties_and_points
  question: Si lo sorprenden conduciendo mientras su licencia de conducir está suspendida,
    ¿qué pasará con su periodo de suspensión original?
  choices:
    A: Se incrementará por la misma cantidad de tiempo del periodo original
    B: Será revocada permanentemente
    C: Se extenderá exactamente por un año
    D: Se convertirá en una suspensión de por vida
  answer: A
  explanation: Si conduce mientras su licencia está denegada, suspendida o revocada,
    la duración del tiempo por el cual su licencia fue originalmente denegada, suspendida
    o revocada se incrementará por la misma cantidad de tiempo del periodo original.
- id: 269
  category: alcohol_drugs_health
  question: ¿Cuál es una posible sanción por conducir mientras su licencia está suspendida
    si la suspensión original se basó en una infracción relacionada con el alcohol?
  choices:
    A: Una multa de hasta $500 y 30 días de cárcel
    B: Una multa de hasta $1000 y encarcelamiento por hasta seis meses
    C: Instalación obligatoria de un dispositivo de bloqueo de encendido de por vida
    D: Una advertencia y una suspensión adicional de 3 meses
  answer: B
  explanation: Si su suspensión o revocación original se basa en una infracción relacionada
    con el alcohol y usted conduce, la multa puede ser de hasta $1000 y puede ser
    encarcelado por hasta seis meses.
- id: 270
  category: penalties_and_points
  question: ¿Por cuánto tiempo puede un tribunal ordenar la suspensión de su licencia
    tras la primera condena por una citación con un agravante de furia al volante
    (road rage)?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: El tribunal puede ordenar que su licencia sea suspendida por un año
    tras la primera condena por una citación con un agravante de furia al volante
    (road rage).
- id: 271
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en la revocación obligatoria
    de su privilegio de conducir?
  choices:
    A: Incumplimiento del pago de la manutención infantil
    B: No detenerse y prestar ayuda si se ve involucrado en un choque que resulte
      en muerte o lesiones personales
    C: No comparecer ante el tribunal por una infracción de tránsito
    D: Una primera condena por una infracción de envío de mensajes de texto
  answer: B
  explanation: Su privilegio de conducir resultará en una revocación obligatoria si
    un tribunal lo declara culpable de no detenerse y prestar ayuda si se ve involucrado
    en un choque de vehículo motorizado que resulte en la muerte o lesiones personales
    de otra persona.
- id: 272
  category: penalties_and_points
  question: 'Intentar huir o negarse a detenerse después de recibir una señal visual
    o auditiva de un oficial de policía resultará en:'
  choices:
    A: Una revocación obligatoria de la licencia
    B: Una advertencia en su historial de conducción
    C: Una suspensión obligatoria de 30 días
    D: El requisito de volver a tomar el examen de conducir escrito
  answer: A
  explanation: Intentar huir o negarse a detenerse después de recibir una señal visual
    o auditiva de un oficial de policía figura entre las infracciones que resultan
    en la revocación obligatoria de la licencia.
- id: 273
  category: vehicle_information
  question: Bajo la cobertura de Conductor No Asegurado (Uninsured Motorist), ¿cuál
    de los siguientes generalmente NO se paga?
  choices:
    A: Lesiones al conductor
    B: Lesiones a los pasajeros
    C: Pérdidas por daños a la propiedad
    D: Facturas médicas resultantes de un choque con fuga
  answer: C
  explanation: La cobertura de Conductor No Asegurado cubre lesiones para usted y
    sus pasajeros. El manual señala que 'las pérdidas por daños a la propiedad generalmente
    no se pagan bajo esta cobertura'.
- id: 274
  category: penalties_and_points
  question: 'Usted puede enfrentar una suspensión de la licencia por una infracción
    relacionada con acercarse a un vehículo de emergencia si no completa:'
  choices:
    A: Un programa de servicio comunitario de 10 horas
    B: Un curso presencial de cuatro horas sobre seguridad vial
    C: Un examen de manejo de conducción defensiva
    D: Un pago de restitución de $500 al departamento de emergencias
  answer: B
  explanation: Su licencia puede ser suspendida si ha sido condenado por una infracción
    relacionada con acercarse a un vehículo de emergencia y no ha completado un curso
    presencial de cuatro horas sobre seguridad vial ofrecido por una entidad aprobada.
- id: 275
  category: penalties_and_points
  question: ¿Cuántos puntos se agregan a su historial de conducción por una infracción
    de enviar mensajes de texto mientras conduce?
  choices:
    A: 40 puntos
    B: 50 puntos
    C: 60 puntos
    D: 80 puntos
  answer: B
  explanation: De acuerdo con el sistema de puntos de Utah, enviar mensajes de texto
    mientras se conduce resulta en la adición de 50 puntos a su historial de conducción.
- id: 276
  category: penalties_and_points
  question: Si es mayor de 21 años, ¿cuántos puntos adquiridos en un período de tres
    años requerirán que comparezca a una audiencia?
  choices:
    A: 70 puntos o más
    B: 100 puntos o más
    C: 150 puntos o más
    D: 200 puntos o más
  answer: D
  explanation: Si es mayor de 21 años y adquiere 200 puntos o más en un período de
    tres años, se le pedirá que comparezca a una audiencia.
- id: 277
  category: penalties_and_points
  question: ¿Cuánto tiempo tardan los puntos de condenas individuales en eliminarse
    automáticamente de su historial de conducción?
  choices:
    A: Un año después de la fecha de la infracción
    B: Dos años después de la fecha de la infracción
    C: Tres años después de la fecha de la infracción
    D: Cinco años después de la fecha de la infracción
  answer: C
  explanation: Los puntos por condenas individuales se eliminan automáticamente de
    su historial tres años después de la fecha de la infracción.
- id: 278
  category: penalties_and_points
  question: ¿Qué sucede con los puntos en su historial si conduce un año completo
    sin ser condenado por una infracción de tránsito en movimiento?
  choices:
    A: Se eliminan todos los puntos
    B: Se elimina la mitad del total de los puntos
    C: Se eliminan 50 puntos
    D: Se eliminan 25 puntos
  answer: B
  explanation: El sistema de puntos establece que la mitad del total de los puntos
    en su historial se eliminará cuando conduzca un año completo sin ser condenado
    por una infracción de tránsito en movimiento.
- id: 279
  category: penalties_and_points
  question: ¿Cuántos puntos se pueden eliminar de su historial al completar un curso
    de conducción defensiva recomendado por la división?
  choices:
    A: 25 puntos
    B: 40 puntos
    C: 50 puntos
    D: 75 puntos
  answer: C
  explanation: Como incentivo, se pueden eliminar 50 puntos de su historial al completar
    un curso de conducción defensiva recomendado por la división. Esto se permite
    una vez durante cualquier período de tres años.
- id: 280
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima requerida por la ley de Utah al rebasar a
    un ciclista o usuario vulnerable de la carretera?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: La ley de Utah requiere una distancia mínima de tres pies de cualquier
    ciclista o usuario vulnerable de la carretera al que esté rebasando.
- id: 281
  category: sharing_the_road
  question: ¿Cuándo se le permite conducir, detenerse o estacionarse en un carril
    para bicicletas designado?
  choices:
    A: Cuando el tráfico es denso y necesita rebasar a un vehículo que está girando
    B: Cuando está entrando o saliendo de un callejón o entrada privada
    C: Cuando está dejando a un pasajero rápidamente
    D: Cuando no hay ciclistas usando el carril en ese momento
  answer: B
  explanation: No puede detenerse, estacionarse ni conducir en un sendero o carril
    para bicicletas designado a menos que esté entrando o saliendo de un callejón
    o entrada privada, realizando tareas oficiales dirigidas por un oficial de policía,
    o si existe una emergencia.
- id: 282
  category: sharing_the_road
  question: ¿Por qué debe evitar tocar la bocina cerca de un ciclista a menos que
    haya posibilidad de un choque?
  choices:
    A: Es ilegal usar la bocina en zonas residenciales
    B: Puede asustar al ciclista y hacer que se desvíe hacia su trayectoria
    C: Hará que el ciclista se detenga inmediatamente en la calzada
    D: Daña la audición del ciclista
  answer: B
  explanation: Tocar la bocina para alertar de su presencia puede asustar a los ciclistas
    y hacer que se desvíen hacia su trayectoria y choquen.
- id: 283
  category: sharing_the_road
  question: ¿A qué distancia debe atenuar sus luces delanteras al acercarse o rebasar
    a un ciclista por la noche?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Debe atenuar sus luces delanteras a menos de 500 pies al acercarse
    o rebasar a ciclistas por la noche.
- id: 284
  category: sharing_the_road
  question: ¿Bajo qué condición es ilegal rebasar a una bicicleta que avanza en la
    misma dirección?
  choices:
    A: Cuando el ciclista viaja a una velocidad inferior a la razonable
    B: Cuando se encuentra a menos de 100 pies de una intersección o un cruce de ferrocarril
      a nivel
    C: Cuando hay un carril central de giro a la izquierda de dos sentidos disponible
    D: Cuando el ciclista no está usando señales manuales
  answer: B
  explanation: Una persona que opera un vehículo no puede rebasar una bicicleta de
    manera segura al acercarse a menos de 100 pies de, o al atravesar, cualquier intersección
    o cruce de ferrocarril a nivel, a menos que se indique lo contrario.
- id: 285
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones de tránsito conlleva el mayor número
    de puntos en su historial de conducción?
  choices:
    A: Conducción temeraria
    B: No ceder el paso
    C: Pasarse un semáforo en rojo
    D: Enviar mensajes de texto mientras conduce
  answer: A
  explanation: Según el sistema de puntos, la conducción temeraria conlleva 80 puntos,
    que es superior a no ceder el paso (60), pasarse un semáforo en rojo (50) y enviar
    mensajes de texto mientras conduce (50).
- id: 286
  category: penalties_and_points
  question: ¿Su licencia de conducir puede ser revocada o suspendida si recibe dos
    citaciones en un año que han sido agravadas como qué tipo de infracción?
  choices:
    A: Infracciones de estacionamiento
    B: Infracciones de la ordenanza de ruidos
    C: Infracciones por furia al volante (road rage)
    D: Infracciones de carril HOV
  answer: C
  explanation: Su licencia puede ser suspendida o revocada si tiene dos citaciones
    que han sido agravadas como una infracción por furia al volante (road rage) en
    un año.
- id: 287
  category: sharing_the_road
  question: ¿Cuál es un requisito para los ciclistas cuando circulan por la calzada?
  choices:
    A: Deben circular de frente al tráfico que viene en sentido contrario
    B: Deben mantener al menos una mano en el manubrio en todo momento
    C: Siempre deben circular por la acera cuando haya una disponible
    D: Deben ceder el paso a todos los vehículos motorizados en todo momento
  answer: B
  explanation: Como ciclista, debe mantener al menos una mano en el manubrio en todo
    momento.
- id: 288
  category: vehicle_information
  question: ¿Cuál es el requisito mínimo de frenado para una bicicleta operada en
    la carretera?
  choices:
    A: Debe ser capaz de detenerse en un tramo de 15 pies a una velocidad de 15 mph.
    B: Debe ser capaz de detenerse en un tramo de 25 pies a una velocidad de 10 mph.
    C: Debe ser capaz de detenerse en un tramo de 50 pies a una velocidad de 20 mph.
    D: Debe ser capaz de detenerse en un tramo de 10 pies a una velocidad de 10 mph.
  answer: B
  explanation: Según el manual, cada bicicleta debe tener un freno o sistema de frenos
    que permita al ciclista detener la bicicleta en un tramo de 25 pies a una velocidad
    de 10 mph.
- id: 289
  category: safe_driving_rules
  question: Al andar en bicicleta en condiciones de poca luz, ¿a qué distancia deben
    ser visibles su luz delantera blanca y su luz trasera roja o reflector?
  choices:
    A: Al menos 200 pies
    B: Al menos 300 pies
    C: Al menos 500 pies
    D: Al menos 1000 pies
  answer: C
  explanation: Se requiere que tenga una luz delantera blanca, una luz trasera roja
    o reflector, y reflectores laterales, todos visibles desde al menos 500 pies en
    cualquier momento que circule antes de media hora antes del amanecer, después
    de media hora después del atardecer, o cuando la visibilidad sea escasa.
- id: 290
  category: sharing_the_road
  question: ¿Cómo puede un ciclista navegar legalmente una señal de alto (stop)?
  choices:
    A: Deben detenerse por completo y esperar a que pase todo el tráfico.
    B: Pueden continuar a través de la intersección sin detenerse si reducen la velocidad
      a un ritmo razonable y ceden el paso a los peatones.
    C: Deben bajarse de la bicicleta y caminar con ella a través de la intersección.
    D: Pueden mantener su velocidad si no se acercan vehículos por la derecha.
  answer: B
  explanation: Los ciclistas que se acercan a una señal de alto pueden continuar a
    través de la intersección sin detenerse en la señal si el ciclista reduce la velocidad
    a un ritmo razonable y cede el paso a cualquier peatón dentro de la intersección
    o en un cruce de peatones adyacente.
- id: 291
  category: sharing_the_road
  question: ¿Qué debe hacer un ciclista antes de alcanzar y rebasar a un peatón en
    una acera o paso de peatones?
  choices:
    A: Dar una señal acústica
    B: Parpadear su faro
    C: Bajarse de la bicicleta
    D: Rebasar solo por el lado izquierdo
  answer: A
  explanation: Al circular en bicicleta por una acera o paso de peatones, los ciclistas
    deben circular despacio, ceder el paso a cualquier peatón y dar una señal acústica
    antes de alcanzar y rebasar a cualquier peatón.
- id: 292
  category: vehicle_information
  question: ¿Qué clase de bicicleta de asistencia eléctrica está equipada con un velocímetro
    y proporciona asistencia solo cuando se pedalea hasta 28 millas por hora?
  choices:
    A: CLASE 1
    B: CLASE 2
    C: CLASE 3
    D: CLASE 4
  answer: C
  explanation: Una bicicleta de asistencia eléctrica CLASE 3 (CLASS 3) proporciona
    asistencia solo cuando el ciclista está pedaleando, deja de asistir a las 28 millas
    por hora y está equipada con un velocímetro.
- id: 293
  category: safe_driving_rules
  question: A menos que se encuentre en asuntos oficiales, ¿cuál es la distancia mínima
    que debe mantener al seguir a un vehículo de bomberos que responde a una alarma?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: A menos que se encuentre en asuntos oficiales, no siga a menos de 500
    pies a ningún vehículo de bomberos que responda a una alarma.
- id: 294
  category: penalties_and_points
  question: ¿Cuál es la sanción si se le condena por no cumplir con la ley de "hacerse
    a un lado" (move over law)?
  choices:
    A: Una multa obligatoria de $500 y 3 puntos en su licencia
    B: Suspensión inmediata de su licencia de conducir por 30 días
    C: Debe asistir a un curso de conducción defensiva presencial de cuatro horas
      dentro de los 90 días
    D: Debe volver a tomar los exámenes de conducir escrito y práctico
  answer: C
  explanation: Si se le condena por NO cumplir con la ley de "hacerse a un lado" (move
    over law), debe asistir a un curso de conducción defensiva presencial de cuatro
    horas dentro de los 90 días posteriores a la condena.
- id: 295
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor que circula por el carril HOV al acercarse
    a un vehículo detenido que muestra luces ámbar?
  choices:
    A: Detenerse inmediatamente en el carril HOV hasta que el vehículo se mueva
    B: Realizar un cambio de carril fuera del carril HOV hacia un carril no adyacente,
      si es práctico y seguro
    C: Acelerar para rebasar al vehículo detenido lo más rápido posible
    D: Encender sus propias luces de emergencia y mantener su velocidad actual
  answer: B
  explanation: Al acercarse a un vehículo detenido que muestra luces ámbar, el conductor
    de un vehículo que circula por el carril HOV deberá, si es práctico y con la debida
    consideración a la seguridad y las condiciones del tráfico, realizar un cambio
    de carril fuera del carril HOV hacia un carril que no sea adyacente al vehículo
    detenido.
- id: 296
  category: vehicle_information
  question: Excepto por los tractores agrícolas, ¿cuál es el ancho exterior legal
    máximo para un vehículo, incluida su carga?
  choices:
    A: 8 pies
    B: 8 1/2 pies
    C: 9 pies
    D: 10 pies
  answer: B
  explanation: Ningún vehículo tendrá un ancho exterior total, incluida la carga,
    de más de 8 1/2 pies. Una excepción a esta regla son los tractores agrícolas,
    que no pueden exceder los 9 pies.
- id: 297
  category: vehicle_information
  question: ¿Cuál es la altura legal máxima para cualquier vehículo, incluida cualquier
    carga que pueda transportar?
  choices:
    A: 12 pies
    B: 13 1/2 pies
    C: 14 pies
    D: 15 pies
  answer: C
  explanation: Ningún vehículo debe exceder una altura de 14 pies, incluida cualquier
    carga que pueda transportar.
- id: 298
  category: vehicle_information
  question: Excluyendo el equipo de extinción de incendios, ¿cuál es la longitud total
    máxima permitida para un solo vehículo?
  choices:
    A: 35 pies
    B: 40 pies
    C: 45 pies
    D: 65 pies
  answer: C
  explanation: Ningún vehículo individual, a excepción del equipo de extinción de
    incendios, debe exceder una longitud total de 45 pies, incluidos los parachoques
    delantero y trasero.
- id: 299
  category: safe_driving_rules
  question: ¿Qué distancia se permite legalmente que una carga se extienda hacia la
    parte delantera y trasera de la carrocería de un vehículo?
  choices:
    A: No más de dos pies hacia adelante y cuatro pies hacia atrás
    B: No más de tres pies hacia adelante y seis pies hacia atrás
    C: No más de cuatro pies hacia adelante y ocho pies hacia atrás
    D: No más de cinco pies hacia adelante y diez pies hacia atrás
  answer: B
  explanation: Ningún tren de vehículos o vehículo individual podrá transportar una
    carga que se extienda más de tres pies hacia la parte delantera ni más de seis
    pies hacia la parte trasera de la carrocería del vehículo.
- id: 300
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a las cargas que sobresalen hacia los lados
    de un vehículo de pasajeros?
  choices:
    A: La carga no puede extenderse más allá de los guardabarros izquierdos, y no
      más de seis pulgadas más allá de los guardabarros derechos.
    B: La carga puede extenderse hasta seis pulgadas más allá de los guardabarros
      izquierdos, pero no más allá de los guardabarros derechos.
    C: La carga puede extenderse hasta un pie más allá de los guardabarros de cualquier
      lado.
    D: La carga no puede extenderse más allá de la línea de los guardabarros de ningún
      lado bajo ninguna circunstancia.
  answer: A
  explanation: Ningún vehículo, incluido un vehículo de pasajeros, puede transportar
    ninguna carga que se extienda más allá de la línea de los guardabarros en el lado
    izquierdo del vehículo, ni que se extienda más de seis pulgadas más allá de la
    línea de los guardabarros en el lado derecho.
- id: 301
  category: vehicle_information
  question: ¿Los vehículos registrados con qué peso bruto de carga deben mostrar el
    peso registrado en ambos lados del vehículo?
  choices:
    A: 10,001 libras o más
    B: 16,001 libras o más
    C: 20,001 libras o más
    D: 26,001 libras o más
  answer: B
  explanation: La Comisión de Impuestos del Estado de Utah requiere que cada vehículo
    registrado con 16,001 libras o más tenga el peso para el cual está registrado
    exhibido tanto en el lado izquierdo como en el derecho del vehículo.
- id: 302
  category: sharing_the_road
  question: ¿Por qué los camiones con remolque (tractor-trailers) suelen permanecer
    en el carril central en las autopistas de varios carriles?
  choices:
    A: Porque el carril derecho está legalmente reservado solo para automóviles de
      pasajeros.
    B: Para ayudar con el flujo de tráfico local que entra y sale de la autopista
      y aumentar las opciones para evitar situaciones peligrosas.
    C: Porque la ley estatal prohíbe que los camiones utilicen los carriles izquierdo
      y derecho.
    D: Para evitar que los vehículos de pasajeros los rebasen por la izquierda.
  answer: B
  explanation: En las autopistas de varios carriles, los camiones con remolque permanecen
    en el carril central para ayudar con el flujo de tráfico local que entra y sale
    de la autopista. Permanecer en el carril central también aumenta las opciones
    del conductor del camión si necesita cambiar de carril para evitar una situación
    peligrosa o un choque.
- id: 303
  category: sharing_the_road
  question: Al rebasar a un camión con remolque, ¿siempre debe rebasarlo por completo
    y por qué lado?
  choices:
    A: Por el lado derecho
    B: Por el lado izquierdo
    C: Por el lado que tenga el acotamiento más ancho
    D: Por el lado con el punto ciego más pequeño
  answer: B
  explanation: El manual establece que siempre se debe rebasar a un camión con remolque
    por completo y siempre por el lado izquierdo.
- id: 304
  category: sharing_the_road
  question: ¿Cuál es una buena regla general para saber si está siguiendo a un camión
    grande demasiado de cerca?
  choices:
    A: Si no puede ver el tubo de escape del camión, ellos no pueden verlo a usted.
    B: Si no puede ver los espejos retrovisores del conductor del camión, ellos no
      pueden verlo a usted.
    C: Si se encuentra a menos de 50 pies de la defensa trasera del camión, ellos
      no pueden verlo a usted.
    D: Si puede leer la placa del camión, ellos no pueden verlo a usted.
  answer: B
  explanation: Al seguir a un camión, si no puede ver los espejos retrovisores del
    conductor del camión, no hay forma de que el conductor del camión pueda verlo
    a usted.
- id: 305
  category: sharing_the_road
  question: ¿Por qué los conductores de camiones con remolque a menudo se abren hacia
    la izquierda antes de girar a la derecha?
  choices:
    A: Para tener una mejor vista del tráfico que viene en sentido contrario
    B: Porque las ruedas traseras siguen una trayectoria más corta que las delanteras
    C: Para permitir que los autos los rebasen por la derecha
    D: Para aumentar su velocidad antes de entrar en el giro
  answer: B
  explanation: En cualquier vehículo que gira, las ruedas traseras siguen una trayectoria
    más corta que las delanteras. Cuanto más largo sea el vehículo, mayor será la
    diferencia, por lo que los camiones con remolque a menudo deben abrirse hacia
    la izquierda para realizar un giro a la derecha.
- id: 306
  category: sharing_the_road
  question: ¿Hasta qué distancia detrás de un vehículo grande se extiende su punto
    ciego trasero (o "zona prohibida")?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 200 pies
    D: Hasta 300 pies
  answer: C
  explanation: Los vehículos grandes tienen puntos ciegos enormes de hasta 200 pies
    detrás de ellos. Si está demasiado cerca, el conductor no puede ver su vehículo.
- id: 307
  category: sharing_the_road
  question: ¿Dónde se encuentra el punto ciego más grande de un camión grande?
  choices:
    A: Directamente frente a la cabina
    B: En el lado izquierdo
    C: En el lado derecho
    D: Directamente detrás del remolque
  answer: C
  explanation: Los camiones grandes y los autobuses tienen grandes zonas prohibidas
    en ambos lados, pero el punto ciego más grande de un camión está en el lado derecho.
- id: 308
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los vehículos
    de movilidad utilizados por personas con discapacidades físicas?
  choices:
    A: Deben pasar una inspección estándar de emisiones de vehículos.
    B: Están exentos del registro y de los requisitos habituales de licencia de operador.
    C: Solo se permiten en las aceras y nunca en las vías públicas.
    D: Requieren una licencia de conducir estándar Clase D para operar.
  answer: B
  explanation: Los vehículos para peatones y de movilidad pueden usarse en las carreteras
    y están exentos de registro, inspección y de los requisitos habituales de licencia
    de operador.
- id: 309
  category: safe_driving_rules
  question: 'Es ilegal operar un scooter motorizado en una carretera con un límite
    de velocidad señalizado superior a:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: Una persona no puede operar un scooter motorizado en una carretera
    con un límite de velocidad señalizado superior a 25 mph.
- id: 310
  category: safe_driving_rules
  question: ¿Bajo qué condición puede una persona menor de 15 años operar un scooter
    motorizado?
  choices:
    A: Solo si tiene un permiso de aprendizaje
    B: Solo si circula por un carril para bicicletas designado
    C: Solo bajo la supervisión directa de un padre, madre o tutor
    D: Nunca se les permite operar un scooter motorizado
  answer: C
  explanation: Una persona menor de 15 años no puede operar un scooter motorizado
    a menos que esté bajo la supervisión directa del padre, madre o tutor de la persona.
- id: 311
  category: safe_driving_rules
  question: En Utah, ¿qué conductores y pasajeros de motocicletas están obligados
    por ley a usar un casco aprobado por el DOT (Departamento de Transporte)?
  choices:
    A: Solo aquellos que operan en autopistas interestatales
    B: Cualquier persona menor de 18 años
    C: Cualquier persona menor de 21 años
    D: Todos los conductores y pasajeros de motocicletas, independientemente de su
      edad
  answer: C
  explanation: Cualquier conductor o pasajero de motocicleta que sea menor de 21 años
    debe usar un casco aprobado por el DOT.
- id: 312
  category: sharing_the_road
  question: 'Al conducir junto a una motocicleta en el mismo carril, usted debe:'
  choices:
    A: Compartir el carril para permitir que pasen más vehículos
    B: Darle a la motocicleta el carril completo y nunca compartir el carril
    C: Tocar la bocina para que el motociclista sepa que usted está allí
    D: Conducir cerca de la motocicleta para bloquear las ráfagas de viento
  answer: B
  explanation: Dé a las motocicletas un carril completo. No comparta el carril. Las
    motocicletas necesitan espacio para reaccionar ante el resto del tráfico.
- id: 313
  category: sharing_the_road
  question: ¿Por qué debe tener precaución si ve una motocicleta acercándose con su
    luz direccional parpadeando?
  choices:
    A: Las motocicletas no están obligadas legalmente a usar luces direccionales
    B: Muchas luces direccionales de motocicletas no se cancelan automáticamente y
      el conductor puede haber olvidado apagarla
    C: La señal intermitente indica que la motocicleta está experimentando una falla
      mecánica
    D: Las señales de las motocicletas parpadean más rápido que las de los autos,
      lo que las hace confusas
  answer: B
  explanation: No crea que una motocicleta va a girar solo porque tiene una luz direccional
    parpadeando. Muchas luces direccionales de motocicletas no se cancelan automáticamente.
    El conductor puede haber olvidado cancelar la señal.
- id: 314
  category: safe_driving_rules
  question: Bajo condiciones normales de conducción, ¿cuál es la distancia de seguimiento
    mínima recomendada al conducir detrás de una motocicleta?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: B
  explanation: Al seguir a una motocicleta, manténgase al menos a dos segundos de
    distancia. Cuando la calzada esté mojada, aumente esta distancia.
- id: 315
  category: sharing_the_road
  question: Según la ley de filtración de carriles (lane filtering) de Utah, ¿cuál
    es el límite de velocidad máximo señalizado de la carretera donde se le permite
    a un motociclista filtrarse entre vehículos detenidos?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: La filtración de carriles está permitida cuando la persona se encuentra
    en una carretera con un límite de velocidad de 45 millas por hora o menos.
- id: 316
  category: sharing_the_road
  question: Al realizar la filtración de carriles (lane filtering) legalmente, ¿qué
    velocidad no debe exceder una motocicleta?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Una de las condiciones para la filtración de carriles es que la motocicleta
    viaje a una velocidad de 15 millas por hora o menos.
- id: 317
  category: signs_and_signals
  question: 'Si una señal de control de tráfico no detecta una motocicleta o bicicleta,
    el conductor puede cruzar la calzada si es seguro y ha esperado en la intersección
    al menos:'
  choices:
    A: 30 segundos
    B: 60 segundos
    C: 90 segundos
    D: 120 segundos
  answer: C
  explanation: Un conductor de 16 años o más puede cruzar la calzada si determina
    que la señal de control de tráfico no lo ha detectado después de esperar un período
    de tiempo razonable, no menor a 90 segundos.
- id: 318
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un peatón cruza una calle con un perro guía o lleva
    un bastón blanco?
  choices:
    A: Toque la bocina ligeramente para alertarlos de su presencia
    B: Ceda el paso solo si están en un paso de peatones marcado
    C: Haga un alto total
    D: Reduzca la velocidad y proceda con precaución a su alrededor
  answer: C
  explanation: De acuerdo con el manual, cuando un peatón cruza una calle con un perro
    guía o lleva un bastón blanco, usted debe hacer un alto total.
- id: 319
  category: safe_driving_rules
  question: Si no hay aceras disponibles, ¿por dónde deben caminar o correr los peatones?
  choices:
    A: En el acotamiento derecho moviéndose con el flujo del tráfico
    B: En el acotamiento izquierdo de frente al tráfico, lo más lejos posible del
      borde
    C: En el centro del carril de frente al tráfico
    D: En cualquier lado de la carretera siempre que usen ropa reflectante
  answer: B
  explanation: El manual establece que si no hay aceras, los peatones deben caminar
    o correr en el acotamiento izquierdo lo más lejos posible del borde de la calzada,
    de frente al tráfico.
- id: 320
  category: defensive_driving
  question: ¿Por qué nunca debe rebasar a un vehículo detenido en un paso de peatones?
  choices:
    A: El vehículo detenido podría retroceder repentinamente
    B: Es ilegal cambiar de carril cerca de cualquier intersección
    C: Puede haber personas cruzando que usted no puede ver
    D: Es probable que el vehículo detenido esté esperando un semáforo
  answer: C
  explanation: Nunca debe rebasar vehículos detenidos en un paso de peatones porque
    puede haber personas cruzando que usted no puede ver.
- id: 321
  category: driver_responsibility
  question: Según el informe de la Oficina de Seguridad Vial de 2024, ¿cuáles fueron
    los principales factores de los conductores que contribuyeron a las muertes de
    peatones?
  choices:
    A: Exceso de velocidad y conducción distraída
    B: No ceder el paso y giros inadecuados
    C: Conducir bajo los efectos del alcohol o drogas (DUI) y pasarse semáforos en
      rojo
    D: Conducir con sueño y cambios de carril inadecuados
  answer: B
  explanation: Los principales factores de los conductores que contribuyeron a las
    muertes de peatones en 2024 fueron no ceder el paso y realizar giros inadecuados.
- id: 322
  category: vehicle_information
  question: Un vehículo para peatones diseñado para el uso de personas con discapacidad
    no debe ser capaz de superar ¿qué velocidad?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: D
  explanation: Un vehículo para peatones debe tener menos de 48 pulgadas de ancho,
    un desplazamiento del motor de menos de 300 cc y menos de 12 caballos de fuerza
    de frenado, y no debe ser capaz de superar las 30 mph.
- id: 323
  category: safe_driving_rules
  question: Si la policía le ordena detenerse mientras circula por el carril para
    vehículos de alta ocupación (HOV), ¿qué debe hacer?
  choices:
    A: Detenerse inmediatamente en el carril HOV
    B: Moverse al lado derecho de la carretera y buscar un lugar seguro para detenerse
    C: Esperar hasta la próxima salida para detenerse
    D: Detenerse en el acotamiento izquierdo
  answer: B
  explanation: Si la policía le ordena detenerse, debe moverse al lado derecho de
    la carretera (incluso cuando circule por el carril HOV) y asegurarse de estar
    en un lugar seguro para detenerse.
- id: 324
  category: driver_responsibility
  question: Durante una parada de tráfico, ¿qué debe hacer con sus manos?
  choices:
    A: Mantenerlas en su regazo
    B: Mantenerlas en el volante
    C: Sacarlas por la ventana
    D: Buscar sus documentos inmediatamente antes de que el oficial se acerque
  answer: B
  explanation: Durante una parada policial, debe mantener la calma, mantener el cinturón
    de seguridad abrochado y mantener las manos en el volante.
- id: 325
  category: signs_and_signals
  question: ¿Qué indica un triángulo naranja y rojo fluorescente o reflectante que
    se muestra en la parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo se desplaza a menos de 25 mph
    C: El vehículo realiza giros amplios a la derecha
    D: El vehículo es de respuesta a emergencias
  answer: B
  explanation: Un triángulo naranja y rojo fluorescente o reflectante que se muestra
    en la parte trasera significa que el vehículo se desplaza a menos de 25 mph.
- id: 326
  category: sharing_the_road
  question: 'Al operar un carrito de golf en vías públicas designadas, los operadores
    deben cumplir con las mismas reglas que:'
  choices:
    A: Una motocicleta
    B: Un peatón
    C: Una bicicleta
    D: Un vehículo comercial
  answer: C
  explanation: Los operadores de carritos de golf son responsables de operar el carrito
    de manera segura y deben cumplir con las mismas reglas que una bicicleta.
- id: 327
  category: sharing_the_road
  question: Al compartir la carretera con vehículos tirados por caballos o jinetes,
    ¿por qué debe evitar usar la bocina o 'acelerar' el motor?
  choices:
    A: Es ilegal en zonas rurales
    B: Puede asustar al caballo y provocar un choque
    C: Viola las leyes de ordenanza sobre ruidos
    D: Hará que el jinete ceda el paso
  answer: B
  explanation: No debe usar la bocina ni 'acelerar' el motor cerca de vehículos tirados
    por caballos o jinetes porque esto puede asustar al caballo y provocar un choque.
- id: 328
  category: vehicle_information
  question: ¿Cuál de las siguientes opciones describe un vehículo todo terreno (ATV)
    Tipo 1?
  choices:
    A: Tiene volante y asientos que no son de tipo montura
    B: Tiene 80 pulgadas o menos de ancho
    C: Tiene un asiento diseñado para ser montado a horcajadas por el operador
    D: Tiene un peso seco sin carga de 3,500 libras
  answer: C
  explanation: Un ATV Tipo 1 se define como aquel que tiene un asiento diseñado para
    ser montado a horcajadas por el operador, circula sobre tres o más neumáticos
    de baja presión y tiene 52 pulgadas o menos de ancho.
- id: 329
  category: license_system
  question: ¿Qué tipo de licencia de conducir se requiere para conducir un ATV, UTV
    o FSV legal para circular por la calle?
  choices:
    A: Solo una licencia Clase M (Motocicleta)
    B: Un permiso especial para vehículos todoterreno
    C: Una licencia Clase D o CDL
    D: No se requiere licencia para los ATV legales para la calle
  answer: C
  explanation: 'El manual indica: ''Si tiene una Clase D o CDL, está autorizado para
    conducir un ATV/UTV o FSV legal para la calle''.'
- id: 330
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima a la que puede operar un ATV/UTV o FSV legal
    para la calle en una carretera?
  choices:
    A: 45 millas por hora
    B: La menor entre el límite de velocidad indicado o 50 millas por hora
    C: 55 millas por hora
    D: El límite de velocidad indicado, sin importar qué tan alto sea
  answer: B
  explanation: El ATV/UTV o FSV legal para la calle que opera en una carretera no
    puede exceder la menor entre el límite de velocidad indicado o las 50 millas por
    hora.
- id: 331
  category: safe_driving_rules
  question: ¿Si opera un ATV/UTV legal para circular en la calle en una carretera
    con un límite de velocidad señalizado superior a 50 mph, por dónde debe conducir
    el operador?
  choices:
    A: En el carril central
    B: En el extremo izquierdo de la calzada
    C: En el extremo derecho de la calzada
    D: Solo en el arcén sin pavimentar
  answer: C
  explanation: Si opera en una carretera con una velocidad señalizada superior a 50
    millas por hora, el operador deberá conducir el ATV/UTV legal para la calle o
    un FSV en el extremo derecho de la calzada.
- id: 332
  category: driver_responsibility
  question: Durante el período de 10 años de 2014 a 2024, ¿a qué hora se produjo la
    mayor cantidad de muertes de peatones?
  choices:
    A: 6 p.m.
    B: 7 p.m.
    C: 9 p.m.
    D: 10 p.m.
  answer: C
  explanation: Según las estadísticas de peatones durante 10 años (2014-2024), la
    hora con más muertes de peatones fue las 9 p.m. con 52 fatalidades.
- id: 333
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima requerida de la banda de rodadura de los
    neumáticos para un ATV o UTV legal para la calle?
  choices:
    A: 1/32 pulgadas
    B: 2/32 pulgadas
    C: 3/32 pulgadas
    D: 4/32 pulgadas
  answer: B
  explanation: Según el manual, los ATV legales para la calle deben tener neumáticos
    con al menos 2/32 de pulgada o más de banda de rodadura.
- id: 334
  category: safe_driving_rules
  question: ¿A qué edad ya no es legalmente obligatorio usar un casco aprobado por
    el DOT mientras se opera un ATV o UTV legal para la calle?
  choices:
    A: 18 años de edad
    B: 19 años de edad
    C: 21 años de edad
    D: 25 años de edad
  answer: C
  explanation: El manual establece que cualquier persona menor de 21 años de edad
    debe usar un casco aprobado por el DOT.
- id: 335
  category: safe_driving_rules
  question: A menos que las señales indiquen lo contrario o lo permita la ley local,
    ¿a qué distancia mínima en pies debe estacionar su vehículo de un cruce de ferrocarril?
  choices:
    A: 15 pies
    B: 25 pies
    C: 50 pies
    D: 100 pies
  answer: C
  explanation: No debe estacionar a menos de 50 pies de un cruce de ferrocarril, a
    menos que las señales indiquen que puede hacerlo o que la ley local lo permita.
- id: 336
  category: defensive_driving
  question: Si se detiene en un cruce de ferrocarril y sospecha que las luces intermitentes
    no funcionan correctamente, ¿bajo qué condición puede continuar?
  choices:
    A: Inmediatamente, siempre que toque la bocina
    B: Solo si tiene una línea de visión despejada de al menos una milla por las vías
      en ambas direcciones
    C: Después de esperar exactamente dos minutos
    D: Debe esperar a que llegue la policía
  answer: B
  explanation: Si sospecha que las luces intermitentes no funcionan correctamente,
    puede cruzar solo si tiene una línea de visión despejada de al menos una milla
    por las vías en ambas direcciones, no hay evidencia de un tren que se aproxime
    y puede cruzar de manera segura.
- id: 337
  category: signs_and_signals
  question: ¿Qué indica una señal colocada debajo de una cruz de San Andrés (crossbuck)
    de ferrocarril?
  choices:
    A: El límite de velocidad del tren
    B: La distancia al siguiente cruce
    C: El número de vías en el cruce
    D: La altura de paso del cruce
  answer: C
  explanation: Si hay más de un juego de vías, una señal debajo de la cruz de San
    Andrés indica el número de vías.
- id: 338
  category: sharing_the_road
  question: ¿Qué es lo que el conductor de un autobús escolar nunca debe hacer al
    cruzar las vías del ferrocarril?
  choices:
    A: Detenerse antes de las vías
    B: Escuchar si se acercan trenes
    C: Cambiar de marcha en el cruce
    D: Revisar ambas direcciones
  answer: C
  explanation: El conductor de un autobús escolar debe revisar ambas direcciones y
    escuchar si se acercan trenes, avanzar solo cuando sea seguro y nunca cambiar
    de marcha en el cruce.
- id: 339
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en un cruce de ferrocarril?
  choices:
    A: Vehículos de emergencia como ambulancias y camiones de bomberos
    B: Peatones
    C: El tren, el 100% de las veces
    D: Quien llegue primero al cruce
  answer: C
  explanation: Los trenes tienen el derecho de paso el 100% de las veces, por encima
    de ambulancias, camiones de bomberos, automóviles, la policía y los peatones.
- id: 340
  category: defensive_driving
  question: Bajo condiciones ideales, ¿aproximadamente cuánta distancia necesita un
    tren de carga de 100 vagones que viaja a 55 mph para detenerse una vez que se
    aplica el frenado de emergencia?
  choices:
    A: 500 pies
    B: Media milla
    C: Más de una milla
    D: Dos millas
  answer: C
  explanation: Una vez que el tren inicia el frenado de emergencia, un tren de carga
    de 100 vagones que viaja a 55 mph necesitará más de una milla para detenerse;
    eso es aproximadamente 18 campos de fútbol.
- id: 341
  category: defensive_driving
  question: Si su vehículo se apaga en un cruce de ferrocarril y se aproxima un tren,
    ¿cuál es la acción más segura?
  choices:
    A: Permanecer en el vehículo y llamar al 911
    B: Salir y correr por las vías en la misma dirección en la que viaja el tren
    C: Salir y correr hacia el tren que se aproxima en un ángulo alejado de las vías
    D: Intentar empujar el vehículo fuera de las vías antes de que llegue el tren
  answer: C
  explanation: Si viene un tren, manténgase alejado de las vías y corra hacia el tren
    que se aproxima en un ángulo alejado de las vías. Moverse hacia el tren que se
    aproxima hará que sea menos probable que lo golpeen los escombros que salgan volando.
- id: 342
  category: sharing_the_road
  question: ¿Por qué es peligroso intentar ganarle el paso a un tren ligero TRAX en
    un cruce?
  choices:
    A: Son completamente silenciosos
    B: Pueden acelerar a 65 mph en 21 segundos
    C: No tienen frenos
    D: No están obligados a usar luces de advertencia
  answer: B
  explanation: Los vehículos de tren ligero aceleran rápidamente y alcanzan velocidades
    de hasta 65 mph en 21 segundos. Nunca intente ganarle el paso a un tren ligero
    en un cruce de ferrocarril.
- id: 343
  category: signs_and_signals
  question: ¿Qué indica una señal elevada con el logotipo de un tren parpadeando en
    una intersección de tren ligero?
  choices:
    A: Debe detenerse por completo de inmediato
    B: Las vías están actualmente fuera de servicio
    C: Se aproxima un tren y debe prestar atención adicional a las señales de tráfico
    D: Usted tiene el derecho de paso sobre el tren
  answer: C
  explanation: El logotipo del tren parpadeante significa que un tren se aproxima
    al área; debe prestar atención adicional para obedecer las señales de tráfico
    en estas intersecciones. Es simplemente un dispositivo de advertencia adicional,
    no una indicación de detenerse.
- id: 344
  category: driver_testing
  question: ¿Cuál de las siguientes funciones de los Sistemas Avanzados de Asistencia
    al Conductor (ADAS) NO se le permite usar durante su examen de habilidades de
    conducción?
  choices:
    A: Advertencia de punto ciego
    B: Cámara de visión trasera
    C: Advertencia de colisión frontal
    D: Asistente de estacionamiento
  answer: D
  explanation: Al realizar su examen de habilidades de conducción, no puede utilizar
    ciertas funciones de seguridad, como el asistente de estacionamiento y el control
    de crucero.
- id: 345
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones está prohibida al acercarse a un cruce
    de ferrocarril?
  choices:
    A: Bajar el volumen de la radio de su auto
    B: Rebasar a un auto que va en su misma dirección
    C: Reducir la velocidad antes de las vías
    D: Detenerse a 20 pies del riel más cercano
  answer: B
  explanation: 'El manual establece explícitamente: "Nunca rebase a un auto que vaya
    en su misma dirección en un cruce de ferrocarril".'
- id: 346
  category: sharing_the_road
  question: ¿Qué distancia puede extenderse un tren fuera del riel de acero, haciendo
    que la zona de seguridad para peatones sea más ancha que las vías?
  choices:
    A: Un pie
    B: Dos pies
    C: Tres pies o más
    D: Cinco pies o más
  answer: C
  explanation: Un tren puede extenderse tres pies o más fuera del riel de acero, lo
    que hace que la zona de seguridad para peatones esté mucho más allá de los rieles.
- id: 347
  category: driver_testing
  question: ¿Cuál de las siguientes funciones de seguridad tiene prohibido usar durante
    su examen de habilidades de conducción?
  choices:
    A: Sistemas de frenos antibloqueo (ABS)
    B: Asistente de estacionamiento y control de crucero
    C: Limpiaparabrisas y desempañadores
    D: Luces direccionales y faros delanteros
  answer: B
  explanation: Al realizar su examen de habilidades de conducción, no puede utilizar
    ciertas funciones de seguridad, como el asistente de estacionamiento y el control
    de crucero.
- id: 348
  category: vehicle_information
  question: ¿Cómo debe aplicar los frenos en una situación resbaladiza si su vehículo
    está equipado con ABS (Sistema de Frenos Antibloqueo)?
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión constante y firme
    C: Tocar ligeramente los frenos
    D: Aplicar el freno de mano en su lugar
  answer: B
  explanation: Si su vehículo está equipado con frenos ABS, no es necesario bombearlos
    al frenar en una situación resbaladiza; aplique una presión constante y firme,
    y su vehículo se detendrá de manera suave y segura.
- id: 349
  category: vehicle_information
  question: Si una carga se extiende cuatro pies o más allá de la plataforma o carrocería
    de un vehículo, ¿qué debe mostrarse en la parte trasera de la carga durante el
    día?
  choices:
    A: Dos reflectores rojos
    B: Una luz ámbar parpadeante
    C: Dos banderas que tengan al menos 12 pulgadas cuadradas
    D: Un letrero que diga 'Carga de gran tamaño' (Oversized Load)
  answer: C
  explanation: Cada vehículo que transporte una carga que se extienda cuatro pies
    o más allá de la plataforma o carrocería del vehículo debe mostrar dos banderas
    o luces ubicadas en la parte trasera de la carga. Las banderas pueden usarse solo
    durante el día y deben tener al menos 12 pulgadas cuadradas.
- id: 350
  category: vehicle_information
  question: ¿Cuál es la distancia mínima que deben poder iluminar los faros de luz
    alta?
  choices:
    A: 100 pies
    B: 200 pies
    C: 350 pies
    D: 500 pies
  answer: C
  explanation: Todos los vehículos, excepto las motocicletas, deben tener al menos
    dos faros delanteros operativos (uno a cada lado), que sean de color blanco y
    puedan iluminar 350 pies con luces altas y 100 pies con luces bajas.
- id: 351
  category: vehicle_information
  question: ¿Bajo condiciones normales, desde qué distancia mínima debe escucharse
    la bocina (claxon) de un vehículo motorizado?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Todos los vehículos motorizados deben tener una bocina que funcione
    y que deba escucharse en condiciones normales desde una distancia no menor a 200
    pies.
- id: 352
  category: vehicle_information
  question: 'La luz de la placa de matrícula de un vehículo debe permitir que el número
    de la placa sea legible desde una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 350 pies
  answer: A
  explanation: Todos los vehículos tendrán una luz blanca montada en la parte trasera
    del vehículo para que el número de la placa pueda leerse a una distancia de al
    menos 50 pies.
- id: 353
  category: safe_driving_rules
  question: ¿Qué vehículos tienen permitido usar luces rojas o azules visibles desde
    la parte delantera del vehículo?
  choices:
    A: Cualquier vehículo fabricado después de 2010
    B: Vehículos que transportan materiales peligrosos
    C: Vehículos de emergencia, escolares, de remoción de nieve u otros vehículos
      autorizados
    D: Camiones comerciales de más de 10,500 libras
  answer: C
  explanation: No se pueden usar luces rojas o azules visibles desde la parte delantera
    de un vehículo, excepto en vehículos de emergencia, escolares, de remoción de
    nieve u otros vehículos autorizados.
- id: 354
  category: safe_driving_rules
  question: Al remolcar otro vehículo, ¿cuál es la longitud máxima permitida para
    la barra de tiro o la conexión entre los vehículos?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: La barra de tiro u otras conexiones entre cualquier vehículo de remolque
    no pueden exceder los 15 pies de longitud de un vehículo al otro.
- id: 355
  category: safe_driving_rules
  question: Al remolcar un vehículo usando una cadena, cuerda o cable, ¿qué debe estar
    sujeto al dispositivo de conexión?
  choices:
    A: Una luz blanca visible desde 500 pies
    B: Una bandera roja de no menos de 12 pulgadas cuadradas
    C: Dos reflectores ámbar
    D: Una baliza amarilla intermitente
  answer: B
  explanation: Cuando una conexión consiste en una cadena, cuerda o cable, se debe
    sujetar una bandera roja u otra señal al dispositivo de conexión. La bandera no
    debe ser menor de 12 pulgadas cuadradas (un pie cuadrado).
- id: 356
  category: vehicle_information
  question: ¿A los vehículos que transportan materiales explosivos o inflamables se
    les prohíbe usar cuál de los siguientes dispositivos de advertencia?
  choices:
    A: Luces eléctricas rojas
    B: Reflectores de emergencia rojos portátiles
    C: Bengalas o fusibles (mechas)
    D: Banderas rojas con soportes
  answer: C
  explanation: Los vehículos que transportan materiales explosivos o inflamables no
    pueden usar bengalas ni fusibles. No se pueden llevar bengalas ni fusibles en
    vehículos que transporten explosivos, líquidos inflamables o gas comprimido.
- id: 357
  category: safe_driving_rules
  question: Según el manual, ¿cuál de los siguientes se menciona explícitamente como
    algo que podría obstruir ilegalmente su visión si se coloca sobre o cerca del
    parabrisas?
  choices:
    A: Una calcomanía de pase de peaje
    B: Algo colgando del espejo retrovisor
    C: Una cámara de tablero
    D: Una funda para el volante
  answer: B
  explanation: Su parabrisas debe estar limpio de suciedad, escarcha o cualquier otra
    cosa que pueda obstruir su visión mientras conduce (como algo colgando del espejo
    retrovisor).
- id: 358
  category: safe_driving_rules
  question: Si su vehículo tiene 80 pulgadas de ancho o 30 pies de largo y se avería
    en una calle de un solo sentido, ¿dónde debe colocarse la bandera trasera?
  choices:
    A: 10 pies hacia atrás
    B: 50 pies hacia atrás
    C: 100 pies hacia atrás
    D: 200 pies hacia atrás
  answer: D
  explanation: En una calle de un solo sentido, la bandera trasera debe colocarse
    a 200 pies hacia atrás.
- id: 359
  category: vehicle_information
  question: 'Las señales de giro deben ser visibles bajo la luz solar normal desde
    una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Las señales de giro deben estar montadas en la parte trasera y delantera
    de cada vehículo. Estas luces deben ser visibles desde 100 pies bajo la luz solar
    normal.
- id: 360
  category: vehicle_information
  question: ¿A qué altura deben montarse los reflectores en un vehículo?
  choices:
    A: No menos de 10 pulgadas ni más de 40 pulgadas sobre el suelo
    B: No menos de 15 pulgadas ni más de 60 pulgadas sobre el suelo
    C: Exactamente 24 pulgadas sobre el suelo
    D: Tan alto como la línea del techo del vehículo
  answer: B
  explanation: Los reflectores deben ser visibles desde 500 pies por la noche y colocarse
    a no menos de 15 pulgadas ni más de 60 pulgadas sobre el suelo.
- id: 361
  category: defensive_driving
  question: ¿Cuál de las siguientes es una limitación conocida de las funciones de
    seguridad de los Sistemas Avanzados de Asistencia al Conductor (ADAS)?
  choices:
    A: Solo funcionan cuando el vehículo viaja a más de 50 mph
    B: Es posible que no funcionen correctamente con lluvia, nieve, hielo, niebla,
      colinas y curvas
    C: Reemplazan por completo la necesidad de que el conductor realice comprobaciones
      visuales girando la cabeza
    D: Agotan la batería del vehículo a los 10 minutos de uso
  answer: B
  explanation: Las funciones de seguridad pueden no funcionar correctamente en condiciones
    de lluvia, nieve, hielo, niebla, colinas y curvas. Los conductores deben permanecer
    atentos y no confiar únicamente en las funciones de seguridad.
- id: 362
  category: safe_driving_rules
  question: ¿A qué distancia de la parte trasera de su vehículo debe colocar un dispositivo
    de advertencia en el lado del tráfico?
  choices:
    A: Al menos 10 pies
    B: Exactamente 50 pies
    C: No más de 5 pies
    D: Al menos 100 pies
  answer: A
  explanation: El manual establece que se debe colocar un dispositivo de advertencia
    en el lado del tráfico a una distancia no menor de 10 pies de la parte trasera
    de su vehículo.
- id: 363
  category: vehicle_information
  question: ¿A cuáles de los siguientes vehículos se les prohíbe transportar bengalas
    y fusibles?
  choices:
    A: Vehículos que transportan pasajeros a cambio de una tarifa
    B: Vehículos que transportan explosivos, líquidos inflamables o gas comprimido
    C: Vehículos comerciales que pesan más de 26,000 libras
    D: Vehículos que remolcan un remolque recreativo
  answer: B
  explanation: Según el manual, no se pueden transportar bengalas ni fusibles en vehículos
    que transporten explosivos, líquidos inflamables o gas comprimido.
- id: 364
  category: safe_driving_rules
  question: 'No es necesario mostrar dispositivos de advertencia si hay suficiente
    luz para distinguir personas o vehículos desde una distancia de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: No es necesario mostrar dispositivos de advertencia si la luz es suficiente
    para distinguir personas o vehículos a 1,000 pies de distancia.
- id: 365
  category: safe_driving_rules
  question: Si su vehículo se avería a menos de 500 pies de una curva o la cima de
    una colina, ¿cuál es la distancia máxima desde el vehículo a la que puede colocar
    un dispositivo de advertencia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Si su vehículo se avería cerca de una obstrucción como una curva o
    la cima de una colina, el dispositivo de advertencia no puede colocarse a más
    de 500 pies de distancia del vehículo.
- id: 366
  category: safe_driving_rules
  question: ¿Por qué es ilegal colocar una bengala o un fusible en su vehículo?
  choices:
    A: Puede cegar a los conductores que se aproximan
    B: Es una acción peligrosa
    C: Daña la pintura del vehículo
    D: Evita que la bengala se queme por completo
  answer: B
  explanation: 'El manual establece: ''No coloque ninguna bengala o fusible en su
    vehículo. No solo es una acción peligrosa, sino que también es ilegal''.'
- id: 367
  category: vehicle_information
  question: ¿Cuál es una causa común de acumulación de calor que puede provocar el
    incendio de un neumático?
  choices:
    A: Conducir sobre una carretera recién pavimentada
    B: Conducir durante un período prolongado con un neumático desinflado o con poca
      presión
    C: Usar el aire acondicionado en colinas empinadas
    D: Inflar demasiado los neumáticos antes de un viaje largo
  answer: B
  explanation: Nunca conduzca durante un período prolongado con un neumático desinflado
    o con poca presión, ni con un freno que esté rozando, ya que estas situaciones
    pueden provocar acumulación de calor e incendiar el neumático.
- id: 368
  category: defensive_driving
  question: Si ocurre un incendio en un neumático y no puede quitarlo, ¿qué se recomienda
    como una mejor alternativa que simplemente esperar?
  choices:
    A: Rociar el neumático con un extintor de incendios pequeño
    B: Verter gasolina sobre el neumático para que se consuma más rápido
    C: Conducir hasta que el neumático se desprenda de la llanta o hasta llegar a
      una fuente de agua
    D: Abandonar el vehículo inmediatamente y alejarse a pie
  answer: C
  explanation: Si no puede quitar el neumático, intente conducir hasta que el neumático
    se desprenda de la llanta o hasta que llegue a una buena fuente de agua. Esta
    alternativa es ciertamente mejor que simplemente esperar y dejar que el vehículo
    se incendie por completo.
- id: 369
  category: defensive_driving
  question: Al combatir el incendio de un vehículo con un extintor, ¿cómo debe posicionarse
    en relación con el viento?
  choices:
    A: Combata el fuego de cara al viento
    B: Combata el fuego con el viento a su espalda
    C: Combata el fuego de forma perpendicular a la dirección del viento
    D: La dirección del viento no importa al usar un extintor
  answer: B
  explanation: Combata los incendios con el viento a su espalda. Sus esfuerzos serán
    más efectivos y evitará que le lleguen gases venenosos o cáusticos a la cara.
- id: 370
  category: defensive_driving
  question: ¿Por qué debe evitar el uso de agua para combatir un incendio de gasolina
    o aceite?
  choices:
    A: El agua se evaporará demasiado rápido para ser efectiva
    B: El agua solo propagará el fuego
    C: El agua crea humo tóxico al mezclarse con el aceite
    D: El agua arruinará los componentes del motor del vehículo
  answer: B
  explanation: El manual advierte que debe estar familiarizado con los diferentes
    tipos de incendios, señalando que combatir un incendio de gasolina o aceite con
    agua solo propagará el fuego.
- id: 371
  category: driver_responsibility
  question: ¿Según el manual, un donante de órganos puede salvar potencialmente la
    vida de cuántas personas?
  choices:
    A: Dos
    B: Cuatro
    C: Ocho
    D: Doce
  answer: C
  explanation: Un donante de órganos puede salvar potencialmente la vida de ocho personas.
- id: 372
  category: license_system
  question: 'Al solicitar una licencia de conducir, una contribución voluntaria de
    $1.00 al Fondo de Asistencia de Transporte para Personas Confinadas en el Hogar
    "Out and About" se utiliza para:'
  choices:
    A: Exámenes de la vista para niños
    B: Registros estatales de donación de órganos
    C: Asistencia de transporte público para personas mayores o personas con discapacidades
    D: Limpieza y mantenimiento de carreteras
  answer: C
  explanation: Los fondos de Asistencia de Movilidad se utilizarán para brindar asistencia
    de transporte público a personas mayores o personas con discapacidades.
- id: 373
  category: license_system
  question: ¿A cuántas personas puede registrar el titular de una licencia de Utah
    en la Base de Datos de Contactos de Emergencia para que las autoridades las contacten
    en caso de una emergencia?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: El titular de un certificado de licencia o tarjeta de identificación
    de Utah puede proporcionar a la división información de dos personas que pueden
    ser contactadas por las autoridades en caso de un accidente de vehículo motorizado
    u otra emergencia.
- id: 374
  category: penalties_and_points
  question: Según la ley de Utah, ¿cuál es la clasificación legal para el delito de
    fraude de identidad?
  choices:
    A: Un delito menor de clase B
    B: Un delito menor de clase A
    C: Una infracción
    D: Un delito grave (felony)
  answer: D
  explanation: El manual establece explícitamente que "el fraude de identidad es un
    delito grave (felony)".
- id: 375
  category: safe_driving_rules
  question: Si su vehículo está detenido completamente fuera de la carretera, ¿dónde
    debe colocar sus dispositivos de advertencia?
  choices:
    A: En el centro del carril de tráfico más cercano
    B: En el acotamiento de la carretera lo más cerca posible de la superficie de
      la carretera
    C: Al menos a 10 pies del acotamiento en el césped o tierra
    D: Directamente sobre el techo del vehículo
  answer: B
  explanation: Si su vehículo está completamente fuera de la carretera, coloque los
    dispositivos en el acotamiento de la carretera lo más cerca posible de la superficie
    de la carretera.
- id: 376
  category: license_system
  question: En Utah, ¿qué agencia es responsable de gestionar las licencias de conducir
    y las tarjetas de identificación?
  choices:
    A: División de Vehículos Motorizados (DMV)
    B: División de Licencias de Conducir (DLD)
    C: Departamento de Transporte (DOT)
    D: División de Parques y Recreación
  answer: B
  explanation: Según el manual, el registro de vehículos es gestionado por la DMV,
    mientras que las licencias de conducir y las tarjetas de identificación se gestionan
    a través de la División de Licencias de Conducir (DLD).
- id: 377
  category: vehicle_information
  question: ¿Bajo qué condiciones un remolque está exento de la obligación de estar
    registrado en Utah?
  choices:
    A: Si pesa menos de 1,000 libras cuando está vacío
    B: Si pesa menos de 750 libras cuando está vacío y no se utiliza para fines comerciales
    C: Si solo se utiliza para fines agrícolas
    D: Si pesa menos de 500 libras y se utiliza para fines comerciales
  answer: B
  explanation: El manual establece que los remolques que pesan menos de 750 libras
    cuando están vacíos y no se utilizan para fines comerciales no están obligados
    a registrarse, aunque pueden registrarse por conveniencia.
- id: 378
  category: vehicle_information
  question: ¿Cuántos días al año puede un no residente utilizar su embarcación en
    Utah antes de que se le exija registrarla en el estado?
  choices:
    A: Más de 30 días
    B: Más de 45 días
    C: Más de 60 días
    D: Más de 90 días
  answer: C
  explanation: Los no residentes que utilicen su embarcación en Utah durante más de
    60 días al año deben registrarla en Utah.
- id: 379
  category: safe_driving_rules
  question: 'Para ahorrar gasolina y prevenir la contaminación, debe apagar el motor
    y volver a encenderlo si espera estar en ralentí (marcha mínima) por más de:'
  choices:
    A: 10 segundos
    B: 30 segundos
    C: 60 segundos
    D: 2 minutos
  answer: B
  explanation: El manual aconseja que ahorrará gasolina apagando el motor y volviéndolo
    a encender si espera estar en ralentí por más de 30 segundos.
- id: 380
  category: vehicle_information
  question: ¿Cuál es la forma recomendada de calentar un vehículo moderno en temperaturas
    frías?
  choices:
    A: Dejar el motor en ralentí durante al menos 10 minutos antes de conducir
    B: Acelerar el motor repetidamente mientras está en posición de estacionamiento
      (P)
    C: Conducir el vehículo, ya que los vehículos modernos necesitan poco calentamiento
      y son más eficientes cuando se conducen
    D: Encender la calefacción y dejar el coche en ralentí hasta que el interior esté
      caliente
  answer: C
  explanation: Los vehículos modernos necesitan poco calentamiento; son más eficientes
    cuando se conducen. Dejar el motor en ralentí por períodos prolongados en climas
    fríos puede causar un desgaste excesivo del motor.
- id: 381
  category: vehicle_information
  question: Al reabastecer combustible en su vehículo, ¿por qué se recomienda evitar
    "llenar al tope" (topping off) el tanque de gasolina, especialmente en climas
    calurosos?
  choices:
    A: Puede causar que la bomba de combustible se rompa
    B: Aumenta el nivel de octanaje del combustible
    C: La gasolina derramada se evapora y contamina el aire
    D: Hace que el motor funcione con una mezcla demasiado rica
  answer: C
  explanation: El manual establece que la gasolina derramada contamina el aire cuando
    se evapora, por lo que es mejor evitar "llenar al tope" para prevenir derrames
    y sobrellenados.
- id: 382
  category: vehicle_information
  question: ¿Qué mide realmente el índice de octanaje de la gasolina?
  choices:
    A: La potencia de salida del combustible
    B: La calidad y pureza general del combustible
    C: Cuánto se puede comprimir el combustible antes de que se produzca una combustión
      espontánea
    D: La cantidad de aditivos de plomo en el combustible
  answer: C
  explanation: El octanaje es una medida de cuánto se puede comprimir un combustible
    en un motor antes de que se produzca una combustión espontánea. No es una medida
    de la potencia o calidad del combustible.
- id: 383
  category: alcohol_drugs_health
  question: 'Si usted es menor de 21 años y conduce con cualquier cantidad medible
    de alcohol en su cuerpo, se le denegarán sus privilegios de conducción por:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: De acuerdo con las preguntas de muestra del examen en la Sección 10,
    si usted es menor de 21 años y conduce con cualquier cantidad medible de alcohol
    en su cuerpo, se le denegarán sus privilegios de conducción por 6 meses.
- id: 384
  category: penalties_and_points
  question: Si usted es menor de 21 años y es condenado por su primer DUI (conducir
    bajo la influencia), ¿por cuánto tiempo se le restringe automáticamente a conducir
    un vehículo con un dispositivo de bloqueo de encendido (ignition interlock device)?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: D
  explanation: La sección de preguntas de muestra del manual establece que un conductor
    menor de 21 años condenado por un primer DUI es restringido automáticamente a
    conducir un vehículo con un dispositivo de bloqueo de encendido por 3 años.
- id: 385
  category: license_system
  question: ¿Qué clase de licencia de conducir debe solicitar si desea conducir un
    automóvil de pasajeros "regular" en Utah?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: D
  explanation: Según la Sección 4 de las preguntas de muestra del examen, solicitar
    una licencia de conducir regular para conducir un automóvil "regular" requiere
    una licencia Clase D.
- id: 386
  category: safe_driving_rules
  question: En una zona de construcción donde dos carriles se fusionan en uno, los
    conductores deben usar ambos carriles de tráfico hasta el punto de fusión. ¿Cómo
    se llama este método?
  choices:
    A: El método Banana
    B: El método Zipper (cremallera)
    C: El método de Intercambio
    D: El método Alterno
  answer: B
  explanation: El manual identifica la práctica de usar ambos carriles de tráfico
    hasta el punto de fusión en una zona de construcción como el "método Zipper" (método
    de cremallera).
- id: 387
  category: signs_and_signals
  question: ¿De qué color son las marcas de las líneas en la calzada que indican que
    los vehículos viajan en la misma dirección?
  choices:
    A: Blanco
    B: Amarillo
    C: Negro
    D: Rojo
  answer: A
  explanation: Las marcas de líneas blancas en la calzada indican que los vehículos
    viajan en una sola dirección.
- id: 388
  category: driver_testing
  question: En Utah, ¿qué tipo de examen están autorizados a administrar los examinadores
    externos (third-party testers)?
  choices:
    A: Solo exámenes de conocimientos escritos
    B: Solo exámenes de habilidades de conducción
    C: Tanto exámenes de conocimientos escritos como de habilidades de conducción
    D: Solo exámenes de la vista
  answer: B
  explanation: Según las preguntas de muestra del examen de la Sección 6, los examinadores
    externos están disponibles para administrar exámenes de habilidades de conducción.
- id: 389
  category: license_system
  question: Si tiene 17 años o menos, ¿cuánto tiempo debe tener un permiso de aprendizaje
    (learner permit) antes de poder obtener su licencia de conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Las preguntas de muestra del examen de la Sección 3 confirman que si
    tiene 17 años o menos, debe tener un permiso de aprendizaje durante 6 meses.
- id: 390
  category: license_system
  question: ¿Cómo puede encontrar el horario de atención de una oficina local de licencias
    de conducir (Driver License Field Office) y programar una cita?
  choices:
    A: Llamando al departamento de policía local
    B: Visitando el sitio web de Licencias de Conducir
    C: Enviando por correo un formulario de solicitud
    D: Visitando la oficina en persona únicamente
  answer: B
  explanation: El manual indica a los conductores que visiten su sitio web para consultar
    los horarios de oficina y programar una cita.
- id: 391
  category: license_system
  question: ¿En qué ciudad se encuentra la oficina de licencias de conducir de Fairpark?
  choices:
    A: Draper
    B: South Ogden
    C: Salt Lake
    D: Taylorsville
  answer: C
  explanation: La oficina de tiempo completo de Fairpark se encuentra en 1095 Motor
    Ave. en Salt Lake.
- id: 392
  category: license_system
  question: ¿Cuál de las siguientes oficinas de licencias de conducir funciona como
    una oficina de tiempo parcial?
  choices:
    A: Beaver
    B: Farmington
    C: Orem
    D: Heber
  answer: A
  explanation: Según el directorio de oficinas, la oficina de Beaver es una oficina
    de tiempo parcial, mientras que Farmington, Orem y Heber son de tiempo completo.
- id: 393
  category: license_system
  question: ¿Dónde se encuentra la oficina de licencias de conducir de tiempo completo
    de South Valley?
  choices:
    A: Hurricane
    B: Draper
    C: South Ogden
    D: Taylorsville
  answer: B
  explanation: La oficina de tiempo completo de South Valley se encuentra en 14555
    S Minuteman Dr. en Draper.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y continúe con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) octagonal roja significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 394
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 395
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 396
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda
    de manera segura.
  id: 397
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 398
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 399
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 400
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 401
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal blanca y negra en forma de banderín de "ZONA DE NO REBASAR"
    (NO PASSING ZONE) significa que no se le permite adelantar a otros vehículos en
    esta área. Marca el inicio de una zona donde está prohibido rebasar.
  id: 402
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Gire a la derecha únicamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "MANTÉNGASE A LA DERECHA" (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 403
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 404
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 405
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 406
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal de forma pentagonal (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 407
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 408
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces de vías férreas. Significa que debe ceder el paso a los trenes.
    Si se aproxima un tren, debe detenerse.
  id: 409
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Se requiere giro a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 410
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 411
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 412
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 413
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 414
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Fin de la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 415
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 416
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico en ambos
    sentidos.
  id: 417
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 418
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 419
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 420
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  id: 421
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (yield)
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 422
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 423
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 424
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere girar a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 425
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) en rojo y blanco significa
    que no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 426
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 427
