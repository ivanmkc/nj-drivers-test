questions:
- id: 1
  category: license_system
  question: ¿En Utah, cuál es la edad mínima que una persona debe cumplir para ser
    elegible para solicitar un permiso de aprendizaje?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: B
  explanation: De acuerdo con el Manual del Conductor de Utah, una persona debe tener
    al menos 15 años para solicitar un permiso de aprendizaje.
- id: 2
  category: license_system
  question: Si es menor de 18 años, ¿cuánto tiempo debe tener un permiso de aprendizaje
    de Utah antes de poder solicitar una licencia de conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 1 año
  answer: B
  explanation: La ley de Utah exige que los solicitantes menores de 18 años mantengan
    un permiso de aprendizaje durante al menos seis meses antes de poder solicitar
    una licencia de conducir.
- id: 3
  category: license_system
  question: Para obtener una licencia de conducir de Utah, un solicitante menor de
    18 años debe completar ¿cuántas horas de conducción supervisada, incluyendo la
    conducción nocturna?
  choices:
    A: 30 horas en total, 5 de noche
    B: 40 horas en total, 10 de noche
    C: 50 horas en total, 10 de noche
    D: 60 horas en total, 15 de noche
  answer: B
  explanation: Los solicitantes menores de 18 años deben completar 40 horas de conducción,
    de las cuales al menos 10 horas deben ser nocturnas.
- id: 4
  category: license_system
  question: Bajo las leyes de Licencia de Conducir Graduada (GDL) de Utah, un conductor
    menor de 18 años no puede conducir entre qué horas, a menos que esté acompañado
    por un adulto con licencia o por excepciones específicas como el trabajo o la
    escuela?
  choices:
    A: 10:00 PM y 4:00 AM
    B: 11:00 PM y 5:00 AM
    C: 12:00 AM (medianoche) y 5:00 AM
    D: 1:00 AM y 6:00 AM
  answer: C
  explanation: La ley de Utah restringe a los conductores menores de 18 años de operar
    un vehículo motorizado entre la medianoche y las 5:00 AM, con ciertas excepciones
    como empleo o emergencias.
- id: 5
  category: license_system
  question: Durante los primeros ______ meses después de recibir una licencia de conducir
    de Utah, un conductor menor de 18 años no puede transportar a ningún pasajero
    que no sea un miembro de su familia inmediata.
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Licencia de Conducir Graduada (GDL) de Utah prohíbe a los
    conductores menores de 18 años llevar pasajeros que no sean familiares durante
    los primeros seis meses de tener la licencia.
- id: 6
  category: license_system
  question: En Utah, si es menor de 21 años, su licencia de conducir puede ser suspendida
    si acumula ¿cuántos puntos en un período de tres años?
  choices:
    A: 50 puntos
    B: 70 puntos
    C: 100 puntos
    D: 200 puntos
  answer: B
  explanation: Para conductores menores de 21 años, el sistema de puntos de Utah activa
    una suspensión a los 70 puntos. Para conductores de 21 años o más, el umbral es
    de 200 puntos.
- id: 7
  category: license_system
  question: ¿Cuántos días tiene para notificar a la División de Licencias de Conducir
    sobre un cambio de dirección en Utah?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Utah exige que notifique a la División de Licencias de Conducir
    dentro de los 10 días posteriores al cambio de su dirección.
- id: 8
  category: license_system
  question: Una licencia de conducir de Utah suele ser válida por ¿cuántos años antes
    de que deba renovarse?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Según las regulaciones actuales de Utah, una licencia de conducir estándar
    es válida por 8 años.
- id: 9
  category: license_system
  question: ¿Cuál es la concentración mínima de alcohol en sangre (BAC) para que a
    un conductor menor de 21 años se le suspenda la licencia bajo la ley 'Not-a-Drop'
    (Ni una gota) de Utah?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: Cualquier cantidad medible
  answer: D
  explanation: La ley 'Not-a-Drop' de Utah significa que cualquier persona menor de
    21 años no puede tener ninguna cantidad medible de alcohol en su sistema mientras
    opera un vehículo.
- id: 10
  category: license_system
  question: 'Al conducir con un permiso de aprendizaje en Utah, el pasajero supervisor
    debe tener al menos 21 años, ser un conductor con licencia y:'
  choices:
    A: Sentarse en el asiento trasero
    B: Ocupar el asiento al lado del conductor
    C: Ser únicamente un tutor legal
    D: Tener licencia por al menos 5 años
  answer: B
  explanation: El conductor supervisor de un titular de permiso debe tener al menos
    21 años, contar con licencia y ocupar el asiento al lado del conductor.
- id: 11
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    por daños a la propiedad en un solo accidente en Utah?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: B
  explanation: Los límites mínimos de responsabilidad financiera de Utah son $25,000
    por persona por lesiones corporales, $50,000 por accidente por lesiones corporales
    y $15,000 por daños a la propiedad (25/50/15).
- id: 12
  category: license_system
  question: En Utah, si tiene 19 años de edad o más y nunca ha tenido una licencia,
    debe tener un permiso de aprendizaje durante al menos ______ antes de poder solicitar
    una licencia de conducir.
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: C
  explanation: Las personas de 19 años o más que no hayan tenido una licencia anteriormente
    deben tener un permiso de aprendizaje de Utah durante al menos 90 días, a menos
    que completen un curso de educación vial.
- id: 13
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es obligatorio para solicitar una
    licencia de conducir de Utah por primera vez?
  choices:
    A: Comprobante de número de Seguro Social
    B: Dos comprobantes de residencia en Utah
    C: Comprobante de identidad
    D: Un diploma de escuela secundaria
  answer: D
  explanation: Si bien se requieren comprobantes de identidad, residencia y Seguro
    Social, el diploma de escuela secundaria no es un requisito para obtener una licencia
    de conducir de Utah.
- id: 14
  category: license_system
  question: 'Si es condenado por una infracción de ''no ceder el paso'' en Utah que
    resulte en lesiones corporales a otra persona, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: La ley de Utah exige una suspensión de la licencia de 90 días por no
    ceder el paso si la infracción causa lesiones corporales.
- id: 15
  category: license_system
  question: Bajo el sistema de puntos de Utah, ¿cuántos puntos se pueden eliminar
    de su historial si completa un curso aprobado de conducción defensiva?
  choices:
    A: 25 puntos
    B: 50 puntos
    C: 75 puntos
    D: 100 puntos
  answer: B
  explanation: Utah permite a los conductores eliminar 50 puntos de su historial de
    conducción una vez cada tres años al completar un curso aprobado de conducción
    defensiva.
- id: 16
  category: license_system
  question: Según la ley de Utah, ¿cuántos puntos se eliminan de su historial de conducción
    si conduce durante un año completo sin ser condenado por una infracción de tránsito
    en movimiento?
  choices:
    A: 25 puntos
    B: 50 puntos
    C: La mitad del total de puntos en su historial
    D: Se eliminan todos los puntos
  answer: C
  explanation: La ley de Utah permite la eliminación de la mitad del total de puntos
    en un historial de conducción si un conductor completa un año entero sin una condena
    por infracción de movimiento.
- id: 17
  category: license_system
  question: En Utah, ¿cuántos años consecutivos de conducción sin una condena por
    infracción de tránsito en movimiento resultarán en la eliminación de todos los
    puntos de su historial de conducción?
  choices:
    A: Un año
    B: Dos años
    C: Tres años
    D: Cinco años
  answer: B
  explanation: Si un conductor completa dos años consecutivos sin una condena por
    infracción de movimiento, se eliminan todos los puntos de su historial de conducción
    de Utah.
- id: 18
  category: license_system
  question: Una persona que se muda a Utah y tiene una licencia válida de otro estado
    debe obtener una licencia de conducir de Utah dentro de ¿cuántos días después
    de establecer su residencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Los nuevos residentes en Utah deben obtener una licencia de conducir
    de Utah dentro de los 60 días posteriores a la fecha en que establecen su residencia.
- id: 19
  category: license_system
  question: Al solicitar una licencia de conducir de Utah, la tarifa que paga le da
    derecho a ¿cuántos intentos para aprobar el examen escrito de conocimientos dentro
    de un período de seis meses?
  choices:
    A: Un intento
    B: Dos intentos
    C: Tres intentos
    D: Intentos ilimitados
  answer: C
  explanation: La tarifa de solicitud para una licencia de conducir de Utah cubre
    tres intentos para aprobar el examen escrito de conocimientos dentro de un período
    de seis meses.
- id: 20
  category: license_system
  question: Para cumplir con los requisitos mínimos de visión para una licencia de
    conducir de Utah, un solicitante debe tener al menos ¿qué agudeza visual en al
    menos un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Utah requiere que los solicitantes tengan una visión de 20/40 o mejor
    en al menos un ojo para calificar para una licencia de conducir sin restricciones
    específicas.
- id: 21
  category: license_system
  question: Si cambia su nombre legalmente, ¿dentro de cuántos días debe visitar una
    oficina de la División de Licencias de Conducir de Utah (Driver License Division)
    para actualizar su licencia?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Utah exige que los conductores notifiquen a la División de
    Licencias de Conducir sobre un cambio de nombre legal y obtengan un duplicado
    de la licencia en un plazo de 10 días.
- id: 22
  category: license_system
  question: 'Una licencia de conducir Clase D de Utah le permite operar un vehículo
    de pasajeros con una Clasificación de Peso Bruto Vehicular (GVWR) de hasta:'
  choices:
    A: 10,000 lbs
    B: 16,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: Una licencia estándar Clase D en Utah permite la operación de vehículos
    con un GVWR de 26,000 libras o menos, siempre que el vehículo no sea un autobús
    ni transporte materiales peligrosos.
- id: 23
  category: license_system
  question: Para los residentes de Utah que sirven en las Fuerzas Armadas de los Estados
    Unidos, ¿por cuánto tiempo sigue siendo válida su licencia de conducir después
    de ser dados de baja del servicio de alta prioridad?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Las licencias de conducir de Utah que posee el personal militar siguen
    siendo válidas hasta 90 días después de su baja del servicio, independientemente
    de la fecha de vencimiento que figure en la tarjeta.
- id: 24
  category: license_system
  question: En Utah, la licencia de un conductor será suspendida por tres meses si
    es condenado por una segunda infracción de 'conducción temeraria' (reckless driving)
    ¿dentro de qué periodo de tiempo?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Una segunda condena por conducción temeraria dentro de un periodo de
    12 meses resulta en una suspensión obligatoria de tres meses de la licencia de
    conducir de Utah.
- id: 25
  category: license_system
  question: 'Utah es miembro del Pacto de Licencias de Conducir (Driver License Compact).
    Esto significa que:'
  choices:
    A: Los conductores de Utah pueden conducir en cualquier estado sin licencia
    B: Las infracciones de tránsito cometidas por conductores de Utah en otros estados
      miembros se informan a Utah
    C: Los conductores de Utah no tienen que pagar multas en otros estados
    D: Su licencia de Utah solo es válida en los estados vecinos
  answer: B
  explanation: El Pacto de Licencias de Conducir es un acuerdo entre estados para
    compartir información sobre condenas de tránsito y suspensiones de licencias de
    no residentes con su estado de origen.
- id: 26
  category: license_system
  question: 'En Utah, indicar ''Sí'' para la donación de órganos en su solicitud de
    licencia de conducir sirve como:'
  choices:
    A: Una sugerencia para su familia
    B: Una autorización temporal que debe renovarse cada año
    C: Autoridad legal para la donación de órganos y tejidos al fallecer
    D: Un requisito para pagar una tarifa de licencia más alta
  answer: C
  explanation: Bajo la Ley Uniforme de Donaciones Anatómicas de Utah, la designación
    en la licencia de conducir es un documento de donación legalmente vinculante para
    la donación de órganos y tejidos.
- id: 27
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar una Licencia de Conducir
    Comercial (CDL) de Utah para operar un vehículo en el comercio interestatal (a
    través de las fronteras estatales)?
  choices:
    A: 16 años
    B: 18 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: Si bien una persona puede obtener una CDL para conducir dentro del
    estado (intraestatal) a los 18 años, la ley federal exige que un conductor tenga
    al menos 21 años para conducir un vehículo comercial a través de las fronteras
    estatales.
- id: 28
  category: license_system
  question: ¿Cuál de las siguientes acciones no relacionadas con la conducción puede
    resultar en la suspensión de una licencia de conducir de Utah?
  choices:
    A: Falta de pago de impuestos sobre la propiedad
    B: Falta de pago de la manutención infantil ordenada por el tribunal
    C: No registrarse para el servicio militar obligatorio
    D: No mantener un promedio de calificaciones (GPA) de 2.0 en la escuela secundaria
  answer: B
  explanation: La ley de Utah permite la suspensión de una licencia de conducir por
    razones no relacionadas con la conducción, incluyendo el incumplimiento de los
    pagos de manutención infantil ordenados por el tribunal.
- id: 29
  category: license_system
  question: 'Una licencia de conducir de Utah que presenta una estrella dorada en
    la esquina superior derecha indica que la licencia:'
  choices:
    A: Pertenece a un veterano
    B: Es un documento que cumple con la ley REAL ID
    C: Es solo para uso comercial
    D: Fue emitida a un conductor con un historial perfecto
  answer: B
  explanation: La estrella dorada en una licencia de conducir de Utah indica que es
    un documento que cumple con la ley REAL ID, el cual es necesario para abordar
    vuelos nacionales y entrar a instalaciones federales.
- id: 30
  category: driver_testing
  question: ¿Cuál es el puntaje de aprobación requerido en el examen escrito de conocimientos
    de Utah de 50 preguntas?
  choices:
    A: 70% (35 correctas)
    B: 75% (38 correctas)
    C: 80% (40 correctas)
    D: 90% (45 correctas)
  answer: C
  explanation: El examen escrito de conocimientos de Utah consta de 50 preguntas,
    y el solicitante debe responder correctamente al menos 40 (80%) para aprobar.
- id: 31
  category: driver_testing
  question: ¿En Utah, cuál es el límite legal de concentración de alcohol en sangre
    (BAC) para conductores de 21 años o más?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: A partir del 30 de diciembre de 2018, Utah tiene el límite de BAC más
    estricto del país, con un 0.05% para conductores de 21 años o más.
- id: 32
  category: driver_testing
  question: Según la Ley de Consentimiento Implícito de Utah, ¿cuál es la sanción
    por negarse por primera vez a someterse a una prueba química de alcohol o drogas
    si tiene 21 años o más?
  choices:
    A: Suspensión de la licencia por 30 días
    B: Suspensión de la licencia por 90 días
    C: Suspensión de la licencia por 180 días
    D: Revocación de la licencia por 18 meses
  answer: D
  explanation: Si se niega a una prueba química en Utah, su licencia será revocada
    por 18 meses por una primera infracción (si tiene 21 años o más).
- id: 33
  category: driver_testing
  question: ¿Cuál de las siguientes situaciones resultará en una reprobación automática
    durante el examen de habilidades de conducción en Utah?
  choices:
    A: No usar una señal de giro una vez
    B: Conducir a 2 mph por encima del límite de velocidad
    C: Realizar una maniobra ilegal o causar una colisión
    D: Ajustar los espejos mientras conduce
  answer: C
  explanation: Durante el examen de manejo de Utah, cualquier acción que resulte en
    una colisión, requiera que el examinador intervenga o constituya una maniobra
    ilegal resulta en una reprobación automática.
- id: 34
  category: driver_testing
  question: En Utah, ¿cuál es la multa por una primera infracción del uso del cinturón
    de seguridad para un adulto?
  choices:
    A: $25
    B: $45
    C: $75
    D: $100
  answer: B
  explanation: La ley de Utah exige que todos los ocupantes usen el cinturón de seguridad.
    La multa por una infracción del cinturón de seguridad es de $45.
- id: 35
  category: driver_testing
  question: Al acercarse a un autobús escolar con sus luces rojas intermitentes y
    el brazo de parada extendido en una carretera con una mediana física o barrera,
    ¿qué conductores deben detenerse?
  choices:
    A: Solo los conductores que viajan en la misma dirección que el autobús
    B: Solo los conductores que viajan en la dirección opuesta al autobús
    C: Los conductores en ambas direcciones
    D: Nadie está obligado a detenerse si hay una barrera
  answer: A
  explanation: En Utah, si hay una barrera física o mediana, solo el tráfico que sigue
    al autobús debe detenerse. Si no hay barrera (incluyendo carriles de giro), el
    tráfico en ambas direcciones debe detenerse.
- id: 36
  category: driver_testing
  question: 'La ley ''Move Over'' de Utah exige que los conductores que se acerquen
    a vehículos de emergencia estacionarios con luces intermitentes:'
  choices:
    A: Se detengan por completo hasta que se les indique pasar
    B: Mantengan la velocidad pero toquen la bocina para alertar a los trabajadores
      de emergencia
    C: Reduzcan la velocidad y, si es seguro/posible, se muevan a un carril que no
      sea adyacente al vehículo
    D: Aumenten la velocidad para pasar el área lo más rápido posible
  answer: C
  explanation: La ley de Utah exige que los conductores reduzcan la velocidad y se
    cambien a otro carril si es seguro hacerlo al acercarse a vehículos de emergencia
    o de mantenimiento estacionarios con luces intermitentes.
- id: 37
  category: driver_testing
  question: Si es declarado culpable de participar en carreras callejeras en Utah,
    ¿por cuántos días se suspenderá su licencia de conducir por una primera infracción?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: Una primera condena por competencia de velocidad (carreras callejeras)
    en Utah resulta en una suspensión de la licencia por 60 días.
- id: 38
  category: driver_testing
  question: En Utah, ¿cuál es la multa máxima por arrojar basura desde un vehículo
    en una carretera pública?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Arrojar basura es ilegal en Utah, y una condena puede resultar en una
    multa de hasta $1,000.
- id: 39
  category: driver_testing
  question: Según la ley de Utah, ¿debe atenuar sus luces altas cuando se encuentre
    a cuántos pies de un vehículo que viene en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Utah exige que los conductores cambien a luces bajas cuando
    un vehículo que viene en sentido contrario esté a menos de 500 pies.
- id: 40
  category: driver_testing
  question: En Utah, ¿debe atenuar sus luces altas cuando siga a otro vehículo a una
    distancia de cuántos pies?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Al seguir a otro vehículo, la ley de Utah exige que atenúe sus luces
    altas cuando esté a menos de 300 pies del vehículo que va delante.
- id: 41
  category: driver_testing
  question: Si usted se ve involucrado en un choque en Utah que resulte en lesiones,
    muerte o daños totales a la propiedad de ______ o más, debe notificar a la policía
    de inmediato.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: D
  explanation: La ley de Utah exige la notificación inmediata a las autoridades por
    cualquier accidente que involucre lesiones, muerte o daños a la propiedad estimados
    en $2,500 o más.
- id: 42
  category: driver_testing
  question: 'En Utah, el uso de cascos para motocicletas es obligatorio por ley para
    todos los conductores y pasajeros menores de:'
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: La ley de Utah exige que cualquier persona menor de 21 años use un
    casco protector mientras conduce o viaja en una motocicleta.
- id: 43
  category: driver_testing
  question: ¿Cuál es la tarifa estándar en Utah para restablecer una licencia de conducir
    que fue suspendida (no relacionada con el alcohol)?
  choices:
    A: $25
    B: $40
    C: $65
    D: $100
  answer: B
  explanation: La tarifa general de restablecimiento para una licencia suspendida
    en Utah es de $40. Los restablecimientos relacionados con el alcohol conllevan
    tarifas significativamente más altas.
- id: 44
  category: driver_testing
  question: Si reprueba el examen de manejo (habilidades) de Utah, ¿cuánto tiempo
    debe esperar antes de ser elegible para volver a tomarlo?
  choices:
    A: Al menos 24 horas
    B: Al menos 3 días
    C: Al menos una semana
    D: Al menos 30 días
  answer: A
  explanation: Si reprueba el examen de habilidades en Utah, debe esperar al menos
    un día (24 horas) antes de poder intentar el examen nuevamente.
- id: 45
  category: driver_testing
  question: Al solicitar una licencia de conducir de Utah, ¿cuántos comprobantes de
    residencia en Utah debe proporcionar?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, si tiene una tarjeta de Seguro Social
  answer: B
  explanation: La ley de Utah exige que los solicitantes proporcionen dos documentos
    que demuestren evidencia de residencia en Utah.
- id: 46
  category: driver_testing
  question: Una licencia de conducir de Utah puede renovarse hasta ______ antes de
    que expire.
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: En Utah, puede renovar su licencia de conducir hasta seis meses antes
    de la fecha de vencimiento.
- id: 47
  category: driver_testing
  question: Si su licencia de conducir de Utah ha estado vencida por más de ______,
    se le requerirá tomar los exámenes escrito y de habilidades nuevamente.
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Si una licencia ha estado vencida por más de seis meses, la División
    de Licencias de Conducir (Driver License Division) requiere que el solicitante
    vuelva a tomar tanto el examen de conocimientos como el de habilidades.
- id: 48
  category: driver_testing
  question: 'Para aprobar el examen de la vista de Utah, su campo de visión periférica
    debe ser de al menos:'
  choices:
    A: 60 grados
    B: 90 grados
    C: 120 grados
    D: 140 grados
  answer: B
  explanation: Utah requiere un campo de visión periférica de 90 grados o más para
    calificar para una licencia de conducir.
- id: 49
  category: driver_testing
  question: 'Si un padre o tutor legal que firmó la solicitud de licencia de un menor
    en Utah decide que ya no quiere ser responsable de la conducción del menor, puede:'
  choices:
    A: Solo esperar hasta que el menor cumpla 18 años
    B: Solicitar que se cancele la licencia del menor
    C: Transferir la responsabilidad a un maestro
    D: No hacer nada; la firma es permanente hasta los 21 años
  answer: B
  explanation: En Utah, la persona que firmó la solicitud de un menor puede presentar
    una solicitud escrita verificada para que se cancele la licencia, lo que la libera
    de responsabilidad.
- id: 50
  category: driver_testing
  question: ¿Cuál es el costo de un duplicado de la licencia de conducir de Utah si
    la suya se pierde o es robada?
  choices:
    A: $10
    B: $18
    C: $23
    D: $32
  answer: C
  explanation: El costo de un duplicado de la licencia de conducir de Utah es de $23.
- id: 51
  category: driver_testing
  question: En Utah, si se le requiere presentar un SR-22 (Prueba de Responsabilidad
    Financiera), ¿por cuánto tiempo debe mantener este registro?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Utah generalmente requiere que las personas mantengan un registro SR-22
    durante tres años después de una suspensión o condena que requiera prueba de responsabilidad
    financiera.
- id: 52
  category: driver_testing
  question: Al solicitar una licencia en Utah, puede optar por donar ______ al Consejo
    de Trasplantes del Gobernador para la concientización sobre la donación de órganos.
  choices:
    A: $1
    B: $2
    C: $5
    D: $10
  answer: B
  explanation: La solicitud de licencia de conducir de Utah le permite contribuir
    voluntariamente con $2 al Consejo de Trasplantes del Gobernador.
- id: 53
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito para el vehículo que usted proporcione
    para el examen de manejo en Utah?
  choices:
    A: Debe ser un vehículo de alquiler
    B: Debe tener transmisión manual
    C: Debe estar registrado y asegurado actualmente
    D: Debe tener menos de 10 años de antigüedad
  answer: C
  explanation: El vehículo utilizado para el examen de habilidades de Utah debe estar
    debidamente registrado, cumplir con todos los estándares de seguridad y estar
    cubierto por el seguro mínimo requerido.
- id: 54
  category: driver_responsibility
  question: 'En Utah, debe notificar a la policía de inmediato si se ve involucrado
    en un accidente que resulte en daños a la propiedad de cualquier persona por un
    valor aparente de al menos:'
  choices:
    A: $1,000
    B: $1,500
    C: $2,500
    D: $5,000
  answer: C
  explanation: De acuerdo con la ley de Utah, cualquier accidente que resulte en lesiones,
    muerte o daños totales a la propiedad por un valor aparente de $2,500 o más debe
    reportarse a la policía de inmediato.
- id: 55
  category: driver_responsibility
  question: La ley de responsabilidad financiera de Utah exige que cada propietario
    residente de un vehículo motorizado mantenga un seguro de responsabilidad civil.
    ¿Cuál es la cobertura mínima requerida por lesiones corporales o muerte de una
    persona en un solo accidente?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $65,000
  answer: B
  explanation: La ley de Utah exige un mínimo de $25,000 por lesiones corporales o
    muerte de una persona en un solo accidente.
- id: 56
  category: driver_responsibility
  question: Utah es un estado de seguro "sin culpa" (no-fault). ¿Cuál es el monto
    mínimo requerido para la cobertura de Protección contra Lesiones Personales (PIP)
    por persona?
  choices:
    A: $1,000
    B: $3,000
    C: $5,000
    D: $10,000
  answer: B
  explanation: La ley de Utah exige que todas las pólizas de seguro de vehículos motorizados
    incluyan un mínimo de $3,000 en cobertura de Protección contra Lesiones Personales
    (PIP).
- id: 57
  category: driver_responsibility
  question: Bajo el sistema de puntos de Utah, ¿cuántos puntos se asignan a su historial
    de manejo por una condena de "Conducción Temeraria" (Reckless Driving)?
  choices:
    A: 50 puntos
    B: 60 puntos
    C: 80 puntos
    D: 100 puntos
  answer: C
  explanation: La conducción temeraria es una infracción grave en Utah y resulta en
    la adición de 80 puntos a su historial de manejo.
- id: 58
  category: driver_responsibility
  question: Si es condenado por exceso de velocidad a 21 millas por hora (o más) sobre
    el límite de velocidad publicado en Utah, ¿cuántos puntos se añadirán a su historial
    de manejo?
  choices:
    A: 35 puntos
    B: 55 puntos
    C: 75 puntos
    D: 100 puntos
  answer: C
  explanation: Exceder el límite de velocidad por 21 mph o más resulta en 75 puntos.
    (De 1 a 10 mph por encima del límite son 35 puntos; de 11 a 20 mph por encima
    son 55 puntos).
- id: 59
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan en un historial de manejo de Utah por una condena
    de "Seguir demasiado de cerca" (tailgating)?
  choices:
    A: 35 puntos
    B: 50 puntos
    C: 60 puntos
    D: 75 puntos
  answer: C
  explanation: Seguir demasiado de cerca se considera una infracción de tránsito en
    Utah y conlleva una penalización de 60 puntos.
- id: 60
  category: driver_responsibility
  question: En Utah, si es condenado por conducir sin prueba de seguro, su privilegio
    de conducir puede ser suspendido y se le requerirá mantener un certificado SR-22
    por ¿cuántos años?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los conductores condenados por conducir sin seguro generalmente deben
    proporcionar una prueba de responsabilidad financiera (SR-22) durante 3 años.
- id: 61
  category: driver_responsibility
  question: ¿Cuál de los siguientes condados de Utah requiere una prueba de emisiones
    para el registro de vehículos?
  choices:
    A: Condado de Washington
    B: Condado de Iron
    C: Condado de Salt Lake
    D: Condado de San Juan
  answer: C
  explanation: Se requieren pruebas de emisiones para el registro de vehículos en
    los condados de Salt Lake, Davis, Utah, Weber y Cache.
- id: 62
  category: driver_responsibility
  question: En Utah, si es condenado por una infracción de "No detenerse ante un autobús
    escolar" (Failure to Stop for a School Bus), ¿cuántos puntos se añaden a su historial?
  choices:
    A: 50 puntos
    B: 60 puntos
    C: 80 puntos
    D: 95 puntos
  answer: D
  explanation: Rebasar o no detenerse ante un autobús escolar es una infracción de
    seguridad grave en Utah y conlleva una penalización de 95 puntos.
- id: 63
  category: driver_responsibility
  question: 'Si se ve involucrado en un accidente con un vehículo desatendido y no
    puede encontrar al propietario, la ley de Utah le exige:'
  choices:
    A: Esperar al menos dos horas a que regrese el propietario
    B: Dejar una nota con su nombre, dirección y número de registro del vehículo
    C: Conducir a la estación de policía más cercana dentro de las 24 horas
    D: Informarlo solo si el daño parece ser superior a $2,500
  answer: B
  explanation: La ley de Utah exige que localice al propietario o deje una notificación
    por escrito en un lugar visible del vehículo desatendido, proporcionando su nombre,
    dirección y número de registro.
- id: 64
  category: driver_responsibility
  question: ¿Cuál es el valor en puntos por una condena de "Lado equivocado de la
    carretera" (Wrong Side of Road) o "Sentido contrario en una calle de una sola
    vía" (Wrong Way on One-Way Street) en Utah?
  choices:
    A: 35 puntos
    B: 50 puntos
    C: 60 puntos
    D: 80 puntos
  answer: C
  explanation: Conducir por el lado equivocado de la carretera o en sentido contrario
    en una calle de una sola vía resulta en 60 puntos en su historial de conducción
    de Utah.
- id: 65
  category: driver_responsibility
  question: En Utah, si es menor de 21 años y recibe una citación por "Competencia
    de velocidad" (carreras), ¿cuántos puntos se le asignan?
  choices:
    A: 50 puntos
    B: 70 puntos
    C: 80 puntos
    D: 100 puntos
  answer: D
  explanation: Una condena por competencia de velocidad (carreras) resulta en 100
    puntos, lo que activaría una suspensión automática para un conductor menor de
    21 años (quien tiene un límite de 70 puntos).
- id: 66
  category: driver_responsibility
  question: 'Según la ley de Utah, el "Consentimiento Implícito" (Implied Consent)
    significa que, al operar un vehículo motorizado, usted ha dado su consentimiento
    para:'
  choices:
    A: Un registro de su vehículo en cualquier momento
    B: Una prueba química para determinar la presencia de alcohol o drogas
    C: Permitir que los pasajeros viajen sin cinturón de seguridad
    D: Mantener solo la cantidad mínima de seguro
  answer: B
  explanation: La ley de Consentimiento Implícito de Utah significa que se considera
    que cualquier persona que opera un vehículo motorizado ha dado su consentimiento
    para una prueba química de aliento, sangre, orina o fluidos orales para determinar
    el contenido de alcohol o drogas.
- id: 67
  category: driver_responsibility
  question: ¿Cuál es la cobertura mínima requerida de seguro de responsabilidad civil
    en Utah por lesiones corporales a dos o más personas en un solo accidente?
  choices:
    A: $40,000
    B: $50,000
    C: $65,000
    D: $80,000
  answer: C
  explanation: La ley de Utah exige un mínimo de $65,000 por lesiones corporales o
    muerte de dos o más personas en un solo accidente.
- id: 68
  category: driver_responsibility
  question: Utah es un estado de seguro "sin culpa" (no-fault). Esto significa que
    su compañía de seguros incluye Protección contra Lesiones Personales (PIP) para
    cubrir gastos médicos. ¿Cuál es el requisito mínimo de PIP por persona?
  choices:
    A: $1,000
    B: $3,000
    C: $5,000
    D: $10,000
  answer: B
  explanation: La ley sin culpa de Utah exige que todas las pólizas incluyan un mínimo
    de $3,000 por persona para la Protección contra Lesiones Personales (PIP).
- id: 69
  category: driver_responsibility
  question: Bajo la Ley de Consentimiento Implícito de Utah, si tiene 21 años o más
    y se niega a someterse a una prueba química para determinar su BAC, su licencia
    de conducir será revocada por ______ por una primera infracción.
  choices:
    A: 90 días
    B: 120 días
    C: 18 meses
    D: 36 meses
  answer: C
  explanation: Si se niega a una prueba química en Utah y tiene 21 años o más, su
    licencia será revocada por 18 meses por una primera infracción.
- id: 70
  category: driver_responsibility
  question: Los nuevos residentes de Utah deben registrar sus vehículos dentro de
    ¿cuántos días después de establecer su residencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 10 días
  answer: B
  explanation: Si bien debe obtener una licencia de conducir de Utah dentro de los
    30 días, tiene 60 días para registrar su vehículo después de establecer su residencia
    en Utah.
- id: 71
  category: driver_responsibility
  question: Si su licencia de conducir de Utah es suspendida por un DUI, ¿durante
    cuántos años se le requerirá mantener un certificado de responsabilidad financiera
    SR-22?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los conductores a quienes se les ha suspendido o revocado la licencia
    por infracciones relacionadas con el alcohol suelen estar obligados a presentar
    una prueba de responsabilidad financiera (SR-22) durante 3 años.
- id: 72
  category: driver_responsibility
  question: 'Si un oficial de policía no investiga un accidente que involucre lesiones,
    muerte o daños por más de $2,500, usted debe presentar un informe por escrito
    a la División de Licencias de Conducir (Driver License Division) en un plazo de:'
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Si un accidente no es investigado por un oficial de la ley y cumple
    con los criterios de notificación, se debe enviar un informe por escrito al Departamento
    de Seguridad Pública en un plazo de 10 días.
- id: 73
  category: driver_responsibility
  question: 'Para una primera condena por DUI en Utah de un conductor de 21 años o
    más, el periodo de suspensión de la licencia ordenado por el tribunal suele ser
    de:'
  choices:
    A: 30 días
    B: 90 días
    C: 120 días
    D: 1 año
  answer: C
  explanation: Una primera condena por DUI para un adulto (mayor de 21 años) en Utah
    resulta en una suspensión de la licencia de 120 días.
- id: 74
  category: driver_responsibility
  question: 'Una persona condenada por primera vez por DUI en Utah es clasificada
    como un ''Conductor restringido por interbloqueo'' (Interlock Restricted Driver)
    por un periodo de:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 3 años
  answer: C
  explanation: En Utah, una primera infracción por DUI resulta en ser un Conductor
    restringido por interbloqueo durante 18 meses. Las infracciones posteriores pueden
    aumentar este periodo a 3 años o más.
- id: 75
  category: driver_responsibility
  question: 'Proporcionar información falsa o un documento gubernamental alterado
    al solicitar una licencia de conducir de Utah es un:'
  choices:
    A: Delito menor de Clase C
    B: Delito menor de Clase B
    C: Delito menor de Clase A
    D: Delito grave de tercer grado
  answer: B
  explanation: Proporcionar información falsa en una solicitud de licencia de conducir
    o utilizar documentos fraudulentos es un delito menor de Clase B y resultará en
    la suspensión o revocación de la licencia.
- id: 76
  category: driver_responsibility
  question: 'Si usted se ve involucrado en un accidente y no tiene seguro, la ley
    de Utah puede exigirle que deposite una garantía (efectivo o fianza) ante el estado
    para cubrir los daños. No hacerlo resultará en:'
  choices:
    A: Solo una multa de $500
    B: Suspensión de su licencia de conducir
    C: Incautación de su vehículo por 1 año
    D: Servicio comunitario obligatorio
  answer: B
  explanation: Bajo la Ley de Responsabilidad de Seguridad, si usted no tiene seguro
    y es el culpable en un accidente, debe depositar una garantía o su licencia será
    suspendida hasta que se resuelvan las reclamaciones.
- id: 77
  category: driver_responsibility
  question: ¿Cuántos meses antes de que expire su licencia de conducir de Utah se
    le permite renovarla?
  choices:
    A: 1 mes
    B: 3 meses
    C: 6 meses
    D: 12 meses
  answer: C
  explanation: Utah permite a los conductores renovar su licencia hasta 6 meses (180
    días) antes de la fecha de vencimiento.
- id: 78
  category: driver_responsibility
  question: 'Cuando firma su solicitud de licencia de conducir de Utah, se le da la
    oportunidad de unirse al registro de ''Donante de órganos''. Si decide ser donante,
    esta decisión es:'
  choices:
    A: Un documento legal que no puede ser cambiado por su familia
    B: Solo una sugerencia para sus familiares más cercanos
    C: Válida por solo 2 años
    D: Solo aplicable si es mayor de 21 años
  answer: A
  explanation: En Utah, indicar que es donante de órganos en su licencia es un documento
    legalmente vinculante bajo la Ley Uniforme de Donaciones Anatómicas, y su decisión
    no puede ser anulada por otros después de su muerte.
- id: 79
  category: safe_driving_rules
  question: En Utah, ¿cuál es el límite de velocidad máximo en una zona comercial
    o residencial a menos que se indique lo contrario?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: Según el Manual del Conductor de Utah, el límite de velocidad predeterminado
    en cualquier distrito comercial o residencial es de 25 mph, a menos que las señales
    indiquen lo contrario.
- id: 80
  category: safe_driving_rules
  question: Al pasar por una zona escolar en Utah donde hay luces intermitentes o
    señales presentes, ¿cuál es el límite de velocidad?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: En Utah, el límite de velocidad en una zona escolar es de 20 mph cuando
    las luces están parpadeando o durante las horas indicadas en la señal.
- id: 81
  category: safe_driving_rules
  question: A partir de diciembre de 2018, ¿cuál es el límite legal de concentración
    de alcohol en sangre (BAC) para conductores adultos (21 años o más) en Utah?
  choices:
    A: 0.08%
    B: 0.07%
    C: 0.05%
    D: 0.02%
  answer: C
  explanation: Utah tiene el límite de BAC más estricto de los Estados Unidos; es
    ilegal operar un vehículo motorizado con un BAC de 0.05% o superior.
- id: 82
  category: safe_driving_rules
  question: En Utah, ¿a cuántos pies de un hidrante de incendios no se permite estacionar
    su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Utah prohíbe estacionar un vehículo a menos de 15 pies de
    un hidrante de incendios.
- id: 83
  category: safe_driving_rules
  question: Al estacionar cerca de una intersección, ¿a cuántos pies de distancia
    mínima debe estar de una señal de alto, una señal de ceda el paso o una señal
    de control de tráfico?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Según la ley de Utah, no se permite estacionar a menos de 30 pies de
    una señal de alto, una señal de ceda el paso o una señal de control de tráfico
    ubicada al costado de la calzada.
- id: 84
  category: safe_driving_rules
  question: En Utah, ¿es legal dar vuelta a la izquierda con semáforo en rojo ÚNICAMENTE
    bajo cuál de las siguientes condiciones?
  choices:
    A: Desde una calle de doble sentido hacia una calle de sentido único
    B: Desde una calle de sentido único hacia una calle de doble sentido
    C: Desde una calle de sentido único hacia otra calle de sentido único
    D: En cualquier intersección si no hay tráfico en sentido contrario
  answer: C
  explanation: La ley de Utah permite dar vuelta a la izquierda en rojo solo cuando
    se gira desde una calle de sentido único hacia otra calle de sentido único, después
    de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 85
  category: safe_driving_rules
  question: ¿A cuántos pies de una intersección o un cruce de ferrocarril se le prohíbe
    rebasar a otro vehículo en Utah?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley de Utah establece que no se puede rebasar a otro vehículo al
    acercarse a menos de 100 pies de una intersección o un cruce de ferrocarril.
- id: 86
  category: safe_driving_rules
  question: Al rebasar a un ciclista en Utah, ¿cuál es el espacio mínimo que debe
    dejar entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Utah exige que los automovilistas dejen al menos 3 pies de
    espacio al rebasar a una persona que opera una bicicleta.
- id: 87
  category: safe_driving_rules
  question: 'Cuando un autobús escolar se detiene con sus luces rojas intermitentes
    y el brazo de parada extendido, los conductores que viajan en la dirección opuesta
    en una carretera con una mediana física o barrera deben:'
  choices:
    A: Detenerse hasta que las luces dejen de parpadear
    B: Reducir la velocidad a 20 mph y proceder con precaución
    C: Continuar sin detenerse
    D: Detenerse solo si hay niños cruzando la barrera
  answer: C
  explanation: En Utah, si una carretera está dividida por una barrera física o mediana,
    el tráfico que viaja en la dirección opuesta a un autobús escolar no está obligado
    a detenerse.
- id: 88
  category: safe_driving_rules
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de construcción
    o mantenimiento de carreteras en Utah cuando hay trabajadores presentes?
  choices:
    A: Una multa fija de $500
    B: Una suspensión obligatoria de la licencia por 30 días
    C: Las multas se duplican
    D: No hay ninguna sanción adicional más allá de una multa estándar
  answer: C
  explanation: Según la ley de Utah, las multas por exceso de velocidad en una zona
    de construcción designada se duplican si hay trabajadores presentes.
- id: 89
  category: safe_driving_rules
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección no controlada
    (sin señales ni semáforos), ¿qué conductor tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja a una velocidad mayor
    D: El conductor en la carretera más grande
  answer: B
  explanation: En una intersección no controlada en Utah, el conductor del vehículo
    de la izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 90
  category: safe_driving_rules
  question: En Utah, ¿a cuántos pies de un paso de peatones en una intersección no
    se permite estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: La ley de Utah prohíbe estacionar a menos de 20 pies de un paso de
    peatones en una intersección.
- id: 91
  category: safe_driving_rules
  question: Según el Manual del Conductor de Utah, ¿durante cuánto tiempo como mínimo
    debe señalizar su intención de girar antes de comenzar el giro?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 5 segundos
    D: 10 segundos
  answer: B
  explanation: La ley de Utah exige que señalice durante al menos dos segundos antes
    de realizar un giro o cambiar de carril.
- id: 92
  category: safe_driving_rules
  question: Según la ley de Utah, ¿durante cuántos segundos como mínimo debe señalizar
    su intención de girar o cambiar de carril antes de comenzar la maniobra?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: B
  explanation: La ley de Utah exige que los conductores señalicen durante al menos
    dos segundos antes de girar o cambiar de carril para dar una advertencia adecuada
    a los demás conductores.
- id: 93
  category: safe_driving_rules
  question: ¿A cuántos pies de una señal de alto (stop), una señal de ceda el paso
    (yield) o una señal de control de tráfico es ilegal estacionarse en Utah?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Utah prohíbe estacionarse a menos de 30 pies de cualquier
    baliza intermitente, señal de alto, señal de ceda el paso o señal de control de
    tráfico ubicada al costado de una carretera.
- id: 94
  category: safe_driving_rules
  question: 'En una carretera de Utah con tres o más carriles en una dirección, el
    carril del extremo izquierdo está destinado a:'
  choices:
    A: Crucero a alta velocidad
    B: Rebasar y uso de HOV (si está marcado)
    C: Camiones pesados y remolques
    D: Vehículos de movimiento lento
  answer: B
  explanation: En Utah, el carril izquierdo es principalmente para rebasar. Los conductores
    no deben permanecer en el carril izquierdo si están siendo alcanzados por tráfico
    más rápido, según la ley de 'Manténgase a la derecha' (Keep Right).
- id: 95
  category: safe_driving_rules
  question: 'Al estacionar un vehículo cuesta abajo en una calle de doble sentido
    con acera (bordillo), debe girar las ruedas delanteras:'
  choices:
    A: Hacia la acera
    B: En dirección opuesta a la acera
    C: Paralelas a la acera
    D: Hacia la izquierda
  answer: A
  explanation: Al estacionar cuesta abajo, debe girar las ruedas hacia la acera para
    que, si el vehículo rueda, lo haga hacia la acera en lugar de hacia el tráfico.
- id: 96
  category: safe_driving_rules
  question: 'La ley de Utah exige que use sus faros delanteros desde:'
  choices:
    A: El atardecer hasta el amanecer
    B: Una hora después del atardecer hasta una hora antes del amanecer
    C: Media hora después del atardecer hasta media hora antes del amanecer
    D: 6:00 PM a 6:00 AM
  answer: C
  explanation: Los faros delanteros deben encenderse desde media hora después del
    atardecer hasta media hora antes del amanecer, o siempre que la visibilidad sea
    inferior a 1,000 pies.
- id: 97
  category: defensive_driving
  question: Según el Manual del Conductor de Utah, ¿cuál es la distancia de seguimiento
    mínima recomendada detrás del vehículo que va delante de usted en condiciones
    ideales?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 4 segundos
    D: 5 segundos
  answer: B
  explanation: El Manual del Conductor de Utah recomienda una distancia de seguimiento
    mínima de dos segundos en condiciones climáticas y de carretera ideales para permitir
    suficiente tiempo para reaccionar ante peligros.
- id: 98
  category: defensive_driving
  question: Para evitar una colisión en Utah, ¿con cuánta antelación debería escanear
    normalmente la carretera en busca de posibles peligros?
  choices:
    A: 5 a 8 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: Solo el automóvil que tiene inmediatamente delante
  answer: B
  explanation: La conducción defensiva en Utah implica escanear la carretera con 10
    a 15 segundos de antelación para identificar y reaccionar a los problemas potenciales
    a tiempo.
- id: 99
  category: defensive_driving
  question: En Utah, ¿a qué velocidad puede comenzar el hidroplaneo (pérdida de contacto
    de los neumáticos con la carretera debido al agua)?
  choices:
    A: Tan baja como 35 mph
    B: Solo por encima de 55 mph
    C: Solo por encima de 65 mph
    D: Solo durante inundaciones fuertes
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph con
    lluvia intensa. En un hidroplaneo completo, los neumáticos pueden perder todo
    contacto con la carretera a 55 mph.
- id: 100
  category: defensive_driving
  question: Al conducir con niebla densa, polvo o humo en Utah, ¿qué faros delanteros
    debe usar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: No se requieren luces durante el día
  answer: B
  explanation: Se deben usar las luces bajas en condiciones de niebla, polvo o humo.
    Las luces altas se reflejan en las partículas del aire, lo que provoca deslumbramiento
    y dificulta la visión.
- id: 101
  category: defensive_driving
  question: Según la ley 'Move Over' (Hacerse a un lado) de Utah, ¿qué debe hacer
    un conductor al acercarse a un vehículo de emergencia estacionado con luces intermitentes?
  choices:
    A: Mantener la velocidad pero tocar la bocina para advertir al oficial
    B: Detenerse inmediatamente en el carril de circulación
    C: Reducir la velocidad y, si es seguro/posible, cambiarse a otro carril
    D: Aumentar la velocidad para pasar el área rápidamente
  answer: C
  explanation: La ley 'Move Over' de Utah exige que los conductores reduzcan la velocidad
    y se muevan a un carril no adyacente si es seguro hacerlo al acercarse a vehículos
    de emergencia o de mantenimiento estacionados.
- id: 102
  category: defensive_driving
  question: Al acercarse a un cruce de ferrocarril en Utah, ¿a cuántos pies del riel
    más cercano debe detener su vehículo?
  choices:
    A: De 5 a 10 pies
    B: De 10 a 25 pies
    C: De 15 a 50 pies
    D: De 50 a 100 pies
  answer: C
  explanation: La ley de Utah exige que los conductores se detengan entre 15 y 50
    pies del riel más cercano en un cruce de ferrocarril cuando las advertencias están
    activas.
- id: 103
  category: defensive_driving
  question: En Utah, durante la conducción en invierno, ¿por qué son particularmente
    peligrosos los puentes y pasos elevados?
  choices:
    A: Suelen ser más estrechos que el resto de la carretera
    B: Se congelan antes que el resto de la carretera
    C: Son propensos únicamente a vientos fuertes
    D: No se puede usar sal en los puentes
  answer: B
  explanation: Los puentes y pasos elevados se congelan antes que el resto de la calzada
    porque el aire frío circula tanto por encima como por debajo de la superficie
    de la carretera.
- id: 104
  category: defensive_driving
  question: ¿A quién debe ceder el paso al entrar en una rotonda en Utah?
  choices:
    A: Al tráfico que entra por la derecha
    B: Al tráfico que ya está en la rotonda
    C: A nadie; usted tiene el derecho de paso al entrar
    D: Solo a los peatones en el lado opuesto
  answer: B
  explanation: En Utah, los conductores que entran en una rotonda deben ceder el paso
    al tráfico que ya circula por la intersección y a los peatones en el cruce peatonal.
- id: 105
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza de Utah,
    ¿en qué dirección debe girar el volante?
  choices:
    A: En la dirección opuesta al derrape
    B: En la dirección en la que derrapa la parte trasera del vehículo
    C: Mantener las ruedas rectas y frenar a fondo
    D: Girar bruscamente hacia el arcén
  answer: B
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que se desliza la parte trasera del vehículo.
- id: 106
  category: defensive_driving
  question: 'Para evitar frenar a último momento o la necesidad de girar repentinamente,
    las pautas de conducción defensiva de Utah sugieren que debe mirar a qué distancia
    por delante de su vehículo:'
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 25 segundos
    D: 30 segundos
  answer: B
  explanation: El Manual del Conductor de Utah establece que mirar de 10 a 15 segundos
    hacia adelante le permite ver los peligros a tiempo y proporciona suficiente tiempo
    para reaccionar de manera segura.
- id: 107
  category: defensive_driving
  question: 'En Utah, el hidroplaneo (donde los neumáticos pierden contacto con la
    carretera sobre una capa de agua) puede comenzar a velocidades tan bajas como:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: B
  explanation: Según el Manual del Conductor de Utah, el hidroplaneo puede comenzar
    a velocidades tan bajas como 35 mph en condiciones de lluvia intensa.
- id: 108
  category: defensive_driving
  question: La ley de Utah exige que encienda los faros delanteros desde ______ después
    de la puesta del sol hasta ______ antes de la salida del sol.
  choices:
    A: Una hora; una hora
    B: 30 minutos; 30 minutos
    C: La puesta del sol; la salida del sol
    D: 15 minutos; 15 minutos
  answer: B
  explanation: El Código de Utah 41-6a-1601 exige que los faros se enciendan desde
    media hora (30 minutos) después de la puesta del sol hasta media hora antes de
    la salida del sol.
- id: 109
  category: defensive_driving
  question: Al conducir con niebla, lluvia intensa o nieve en Utah, ¿qué ajuste de
    faros debe usar para mantener la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Luces de emergencia
  answer: B
  explanation: Se deben usar las luces bajas en condiciones climáticas adversas como
    niebla o nieve porque las luces altas se reflejan en la humedad del aire, lo que
    provoca deslumbramiento y reduce la visibilidad.
- id: 110
  category: defensive_driving
  question: Si conduce por una autopista de Utah y se le revienta un neumático, ¿cuál
    es la acción de conducción defensiva más segura que puede tomar?
  choices:
    A: Frenar a fondo inmediatamente para detener el coche
    B: Girar el volante bruscamente hacia el arcén
    C: Sujetar el volante con firmeza y quitar el pie del acelerador
    D: Poner el coche en punto muerto inmediatamente
  answer: C
  explanation: En caso de un reventón, el Manual del Conductor de Utah aconseja a
    los conductores sujetar el volante con firmeza, mantener el coche recto y reducir
    la velocidad gradualmente soltando el acelerador.
- id: 111
  category: defensive_driving
  question: ¿Qué significa "sobrepasar el alcance de sus faros" según las normas de
    seguridad de Utah?
  choices:
    A: Usar las luces altas en la ciudad
    B: Conducir a una velocidad en la que su distancia de frenado es mayor que la
      distancia que puede ver con sus luces
    C: Conducir con faros rotos o tenues
    D: Dejar los faros encendidos durante el día
  answer: B
  explanation: Sobrepasar el alcance de sus faros significa que viaja demasiado rápido
    para detenerse dentro de la distancia iluminada por sus faros, lo cual es una
    causa principal de accidentes nocturnos.
- id: 112
  category: defensive_driving
  question: Al observar la carretera en Utah, ¿con qué frecuencia debe revisar sus
    espejos retrovisores y laterales?
  choices:
    A: Cada 2 a 5 segundos
    B: Cada 10 a 15 segundos
    C: Cada minuto
    D: Solo al cambiar de carril
  answer: A
  explanation: Las pautas de conducción defensiva en Utah sugieren revisar los espejos
    cada 2 a 5 segundos para mantener la conciencia del tráfico que rodea su vehículo.
- id: 113
  category: defensive_driving
  question: Si un vehículo que viene en sentido contrario por la noche no baja sus
    luces altas, ¿hacia dónde debe mirar un conductor de Utah para evitar quedar cegado
    temporalmente?
  choices:
    A: Directamente a los faros que se aproximan
    B: A la línea central de la carretera
    C: Hacia el lado derecho de la carretera (la línea blanca)
    D: Cerrar los ojos brevemente
  answer: C
  explanation: Para evitar el deslumbramiento de las luces altas que vienen en sentido
    contrario, debe mirar hacia el borde derecho de su carril o hacia la línea blanca
    lateral hasta que el vehículo pase.
- id: 114
  category: defensive_driving
  question: En Utah, ¿por qué debería aumentar su distancia de seguimiento cuando
    circula detrás de una motocicleta?
  choices:
    A: Las motocicletas siempre viajan más rápido que los automóviles
    B: Las motocicletas pueden detenerse mucho más rápido que otros vehículos
    C: Las motocicletas tienen un punto ciego más grande
    D: La ley exige mantenerse a 500 pies de distancia
  answer: B
  explanation: Debido a que las motocicletas pueden detenerse más rápido que los automóviles,
    es necesaria una mayor distancia de seguimiento para evitar una colisión trasera
    si el motociclista frena repentinamente.
- id: 115
  category: defensive_driving
  question: Al acercarse a una intersección en Utah, ¿cuál es la secuencia de observación
    recomendada?
  choices:
    A: Derecha, Izquierda, Derecha
    B: Izquierda, Derecha, Izquierda
    C: Solo hacia adelante
    D: Revisar solo los espejos
  answer: B
  explanation: Las normas de conducción defensiva de Utah recomiendan mirar a la izquierda,
    luego a la derecha y luego a la izquierda nuevamente antes de entrar en una intersección,
    ya que los vehículos que vienen por la izquierda están más cerca de usted.
- id: 116
  category: defensive_driving
  question: En Utah, ¿cuál de las siguientes superficies de carretera es probable
    que se congele primero y permanezca helada por más tiempo durante los meses de
    invierno?
  choices:
    A: Intersecciones
    B: Caminos de grava
    C: Puentes y pasos elevados
    D: Túneles
  answer: C
  explanation: Los puentes y pasos elevados se congelan antes que otras superficies
    de la carretera porque el aire frío circula tanto por encima como por debajo de
    la estructura, lo que los hace particularmente peligrosos en los inviernos de
    Utah.
- id: 117
  category: alcohol_drugs_health
  question: 'Según la ley de "Consentimiento Implícito" (Implied Consent) de Utah,
    al conducir por las carreteras de Utah, usted ha dado su consentimiento para:'
  choices:
    A: Un registro de su vehículo en cualquier momento
    B: Solo una prueba de sobriedad en el campo
    C: Una prueba química de su aliento, sangre, orina o fluidos orales
    D: Permitir que un oficial de policía conduzca su vehículo
  answer: C
  explanation: El Consentimiento Implícito significa que cuando conduce en Utah, acepta
    automáticamente someterse a pruebas químicas para determinar la presencia de alcohol
    o drogas si así lo solicita un oficial.
- id: 118
  category: alcohol_drugs_health
  question: La ley de "Conductor Restringido por Alcohol" de Utah establece que una
    persona condenada por un DUI tendrá restringido operar un vehículo con cualquier
    cantidad medible de alcohol por cuánto tiempo después de una primera condena?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: 10 años
  answer: B
  explanation: Una persona condenada por un DUI en Utah es clasificada como Conductor
    Restringido por Alcohol durante 2 años por una primera infracción, lo que significa
    que no puede conducir con nada de alcohol en su sistema.
- id: 119
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la "Ley
    de Metabolitos" (Metabolite Law) de Utah?
  choices:
    A: Solo se aplica a drogas ilegales como la heroína o la cocaína
    B: Es ilegal conducir con cualquier cantidad medible de una sustancia controlada
      o su metabolito en el cuerpo
    C: Solo se aplica si el conductor está visiblemente incapacitado
    D: No se aplica si la droga se tomó hace más de 24 horas
  answer: B
  explanation: La ley de Utah prohíbe conducir con cualquier sustancia controlada
    o metabolito medible en el cuerpo, a menos que la sustancia se haya tomado de
    acuerdo con una receta médica válida.
- id: 120
  category: alcohol_drugs_health
  question: 'Si es condenado por un DUI en Utah por primera vez, se le requerirá instalar
    un Dispositivo de Bloqueo de Encendido (IID) en su vehículo por:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: C
  explanation: En Utah, una primera condena por DUI (para personas de 21 años o más)
    generalmente requiere la instalación de un Dispositivo de Bloqueo de Encendido
    (IID) durante 18 meses.
- id: 121
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de Utah, ¿qué es lo primero que se ve afectado
    por el consumo de alcohol?
  choices:
    A: La coordinación
    B: La visión
    C: El juicio
    D: El tiempo de reacción
  answer: C
  explanation: El juicio es la primera facultad que se ve afectada por el alcohol,
    lo que a menudo lleva a los conductores a creer que son capaces de conducir con
    seguridad cuando no lo son.
- id: 122
  category: alcohol_drugs_health
  question: En Utah, ¿en cuál de las siguientes áreas es ilegal poseer un recipiente
    abierto de alcohol?
  choices:
    A: El maletero del vehículo
    B: El compartimiento de pasajeros de un vehículo motorizado en una vía pública
    C: La zona de vivienda de una casa rodante
    D: La guantera con llave
  answer: B
  explanation: La ley de recipientes abiertos de Utah prohíbe los recipientes abiertos
    de alcohol en el área de pasajeros de cualquier vehículo motorizado que se encuentre
    en una vía pública.
- id: 123
  category: alcohol_drugs_health
  question: 'Si tiene 21 años o más y es condenado por una primera infracción de DUI
    (conducir bajo la influencia) en Utah, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: D
  explanation: Para un conductor de 21 años o más, una primera condena por DUI resulta
    en una suspensión de la licencia de 120 días.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su concentración de alcohol
    en sangre (BAC) y recuperar la sobriedad?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Dejar que pase el tiempo
    D: Hacer ejercicio vigoroso
  answer: C
  explanation: Solo el tiempo permite que el cuerpo metabolice el alcohol. El café,
    las duchas y el ejercicio no aceleran el proceso de reducción del BAC.
- id: 125
  category: alcohol_drugs_health
  question: 'Si usa medicamentos recetados y luego consume alcohol, los efectos suelen
    ser:'
  choices:
    A: Anulados entre sí
    B: Reducidos
    C: Multiplicados (efecto sinérgico)
    D: Sin cambios
  answer: C
  explanation: Combinar alcohol con otras drogas (incluso las recetadas) crea un efecto
    sinérgico, lo que significa que el impacto combinado en su capacidad de conducción
    es mucho mayor que los efectos de cada uno por separado.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes debe informar a la División de Licencias de Conducir
    de Utah?
  choices:
    A: Si comienza a usar lentes de contacto o anteojos
    B: Si desarrolla una condición médica que pueda afectar su capacidad para operar
      un vehículo de manera segura
    C: Si le diagnostican un resfriado común
    D: Tanto A como B
  answer: D
  explanation: Los conductores están legalmente obligados a informar a la División
    de Licencias de Conducir cualquier condición física o mental (incluidos los cambios
    en la visión) que pueda afectar su capacidad para conducir de manera segura.
- id: 127
  category: alcohol_drugs_health
  question: 'En Utah, una persona puede ser acusada de DUI si se determina que tiene
    el ''control físico real'' de un vehículo mientras está bajo los efectos del alcohol
    o drogas. Esto significa que puede ser arrestado incluso si:'
  choices:
    A: El motor no está en marcha
    B: Está durmiendo en el asiento del conductor con las llaves en el bolsillo
    C: El vehículo está estacionado a un lado de la carretera
    D: Todas las anteriores
  answer: D
  explanation: La ley de Utah permite cargos por DUI si una persona tiene el 'control
    físico real' del vehículo, lo cual no requiere necesariamente que el vehículo
    esté en movimiento o que el motor esté encendido.
- id: 128
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años y es condenado por una infracción relacionada
    con el alcohol que NO implique conducir (como la posesión ilegal), la ley de Utah
    permite que el tribunal:'
  choices:
    A: Solo emita una multa
    B: Suspenda su licencia de conducir
    C: Le exija volver a tomar el examen de conducir
    D: No haga nada con su privilegio de conducir
  answer: B
  explanation: En Utah, incluso las infracciones de alcohol que no implican conducir
    cometidas por menores pueden resultar en la suspensión de su licencia de conducir.
- id: 129
  category: alcohol_drugs_health
  question: Si un conductor mayor de 21 años se niega a someterse a una prueba química
    bajo la ley de Consentimiento Implícito, ¿por cuánto tiempo se le revocará la
    licencia por una primera infracción?
  choices:
    A: 90 días
    B: 120 días
    C: 18 meses
    D: 36 meses
  answer: C
  explanation: En Utah, si se niega a una prueba química, su privilegio de conducir
    será revocado por 18 meses por una primera infracción. Para una segunda infracción
    dentro de 10 años, el período de revocación es de 36 meses.
- id: 130
  category: alcohol_drugs_health
  question: ¿A qué grupo de conductores se aplica la ley 'Ni una gota' (Not-a-Drop)
    de Utah?
  choices:
    A: Conductores menores de 21 años
    B: Solo titulares de licencia de conducir comercial (CDL)
    C: Solo conductores con antecedentes de condenas por DUI
    D: Todos los conductores independientemente de su edad
  answer: A
  explanation: La ley 'Ni una gota' de Utah (41-6a-517) prohíbe que cualquier persona
    menor de 21 años opere un vehículo con cualquier cantidad medible de alcohol en
    su sistema.
- id: 131
  category: alcohol_drugs_health
  question: La "Ley de Metabolitos" de Utah establece que es ilegal conducir con ______
    en el cuerpo, a menos que se haya tomado según lo prescrito por un médico.
  choices:
    A: Cualquier cantidad de cafeína
    B: Cualquier cantidad medible de una sustancia controlada o su metabolito
    C: Cualquier cantidad de medicamento para el resfriado de venta libre
    D: Cualquier cantidad de nicotina
  answer: B
  explanation: El Código de Utah 41-6a-517 (la Ley de Metabolitos) establece que es
    ilegal operar un vehículo con cualquier cantidad medible de una sustancia controlada
    o su metabolito en el cuerpo de la persona, a menos que la sustancia haya sido
    recetada legalmente.
- id: 132
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de Utah, ¿cuál es la mejor manera de evitar
    un DUI (conducir bajo la influencia)?
  choices:
    A: Beber café antes de conducir
    B: Tomar una ducha fría antes de conducir
    C: Esperar una hora por cada bebida consumida
    D: Designar a un conductor sobrio o usar un servicio de transporte compartido
  answer: D
  explanation: El Manual del Conductor de Utah enfatiza que la única forma segura
    de evitar un DUI es no conducir después de beber, sugiriendo conductores designados
    o servicios de transporte compartido como la solución principal.
- id: 133
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados y estos afectan su capacidad para
    conducir de manera segura, se le puede acusar de un DUI en Utah.
  choices:
    A: Verdadero, independientemente de si el medicamento fue recetado legalmente
    B: Falso, siempre que tenga una receta válida
    C: Falso, el DUI solo se aplica al alcohol y a las drogas ilegales
    D: Verdadero, pero solo si también tiene alcohol en su sistema
  answer: A
  explanation: En Utah, puede ser condenado por DUI si se encuentra bajo la influencia
    de cualquier droga (legal o ilegal) en un grado que lo incapacite para operar
    un vehículo de manera segura.
- id: 134
  category: alcohol_drugs_health
  question: En Utah, si es condenado por un DUI mientras un pasajero menor de ______
    años de edad está en el vehículo, las sanciones aumentan.
  choices:
    A: '12'
    B: '16'
    C: '18'
    D: '21'
  answer: B
  explanation: La ley de Utah prevé sanciones agravadas para las condenas por DUI
    si había un pasajero menor de 16 años en el vehículo en el momento de la infracción.
- id: 135
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años y viola la ley "Not-a-Drop" (Ni una gota) de Utah
    por primera vez, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 6 meses
    C: Hasta que cumpla 21 años o por 1 año, lo que sea más largo
    D: Hasta que cumpla 21 años o por 6 meses, lo que sea más largo
  answer: D
  explanation: Por una primera violación de la ley "Not-a-Drop" por parte de un menor,
    la licencia se suspende por 6 meses o hasta que la persona cumpla 21 años, lo
    que sea más largo.
- id: 136
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto principal de mezclar alcohol con otras drogas (efecto
    sinérgico)?
  choices:
    A: Los efectos del alcohol se anulan
    B: Los efectos de ambos se multiplican, volviéndose a menudo más peligrosos
    C: Los efectos de la droga se retrasan
    D: No hay cambios en el nivel de deterioro
  answer: B
  explanation: Mezclar alcohol con otras drogas puede crear un efecto sinérgico, donde
    el impacto combinado en el sistema nervioso central es mucho mayor que la suma
    de las partes, aumentando gravemente el deterioro.
- id: 137
  category: alcohol_drugs_health
  question: 'Según la ley de Utah, debe informar cualquier condición física o mental
    que pueda afectar su capacidad para conducir de manera segura a la:'
  choices:
    A: Departamento de policía local
    B: Patrulla de Caminos de Utah (Utah Highway Patrol)
    C: División de Licencias de Conducir (DLD)
    D: Departamento de Transporte de Utah (UDOT)
  answer: C
  explanation: Los conductores de Utah están legalmente obligados a informar a la
    División de Licencias de Conducir cualquier condición médica que pueda afectar
    su capacidad para operar un vehículo motorizado de manera segura.
- id: 138
  category: alcohol_drugs_health
  question: 'En Utah, una persona es considerada un "Conductor con Restricción de
    Alcohol" (ARD) durante dos años después de una primera condena por DUI. Esto significa
    que:'
  choices:
    A: Solo pueden conducir hacia y desde el trabajo
    B: No pueden conducir con ninguna cantidad medible de alcohol en su sistema
    C: No pueden conducir después de las 10:00 PM
    D: Siempre deben tener un pasajero sobrio en el vehículo
  answer: B
  explanation: Un "Conductor con Restricción de Alcohol" (ARD) en Utah tiene prohibido
    operar un vehículo motorizado con cualquier cantidad medible de alcohol en su
    sistema, independientemente de si es mayor de 21 años.
- id: 139
  category: penalties_and_points
  question: ¿Cuál es el valor en puntos por una condena de "Seguir demasiado de cerca"
    (tailgating) en el estado de Utah?
  choices:
    A: 35 puntos
    B: 50 puntos
    C: 60 puntos
    D: 75 puntos
  answer: C
  explanation: Seguir demasiado de cerca es una infracción de 60 puntos en el sistema
    de puntos de Utah.
- id: 140
  category: penalties_and_points
  question: 'Por una primera condena por DUI en Utah, la licencia de un conductor
    será suspendida por un período de:'
  choices:
    A: 30 días
    B: 60 días
    C: 120 días
    D: 1 año
  answer: C
  explanation: Para una primera condena por DUI (de 21 años o más), el período de
    suspensión de la licencia suele ser de 120 días.
- id: 141
  category: penalties_and_points
  question: En Utah, ¿por cuánto tiempo se requiere que un 'Conductor restringido
    por dispositivo de bloqueo de encendido' (Ignition Interlock Restricted Driver)
    tenga instalado un dispositivo de bloqueo en su vehículo tras una primera condena
    por DUI?
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: C
  explanation: Un infractor de DUI por primera vez en Utah generalmente se clasifica
    como un conductor restringido por dispositivo de bloqueo durante 18 meses.
- id: 142
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por pasarse un semáforo en rojo o una señal
    de alto en Utah?
  choices:
    A: 35 puntos
    B: 50 puntos
    C: 60 puntos
    D: 75 puntos
  answer: B
  explanation: No detenerse ante un semáforo en rojo o una señal de alto resulta en
    la adición de 50 puntos a su historial de manejo de Utah.
- id: 143
  category: penalties_and_points
  question: 'En Utah, si se le condena por exceso de velocidad en una zona de construcción
    de carreteras cuando hay trabajadores presentes, el tribunal está obligado a:'
  choices:
    A: Suspender su licencia por 30 días
    B: Duplicar la multa estándar
    C: Triplicar la multa estándar
    D: Sentenciarlo a 48 horas de servicio comunitario
  answer: B
  explanation: La ley de Utah exige que las multas por exceso de velocidad en una
    zona de construcción se dupliquen si hay trabajadores presentes.
- id: 144
  category: penalties_and_points
  question: Según la ley de Utah, ¿cuál de las siguientes situaciones resultará en
    la revocación obligatoria de la licencia?
  choices:
    A: Exceso de velocidad de 25 mph sobre el límite
    B: Homicidio por automóvil
    C: Dos condenas por seguir demasiado de cerca a otro vehículo
    D: No ceder el paso
  answer: B
  explanation: El homicidio por automóvil es un delito grave que requiere la revocación
    obligatoria de la licencia de conducir.
- id: 145
  category: penalties_and_points
  question: En Utah, ¿cuántos puntos se asignan por una condena de 'Rebase indebido'
    (Improper Passing)?
  choices:
    A: 35 puntos
    B: 50 puntos
    C: 60 puntos
    D: 70 puntos
  answer: B
  explanation: El rebase indebido es una infracción de 50 puntos en el sistema de
    puntos de Utah.
- id: 146
  category: penalties_and_points
  question: Si se le condena por una infracción de 'Ni una gota' (Not-a-Drop) (menor
    de 21 años con cualquier cantidad medible de alcohol), su licencia será suspendida
    por ______ por una primera infracción.
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Bajo la ley 'Ni una gota' de Utah, una primera infracción para un conductor
    menor de 21 años resulta en una suspensión de la licencia de 6 meses.
- id: 147
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a un historial de manejo de Utah por exceso
    de velocidad de 21 millas por hora (o más) sobre el límite establecido?
  choices:
    A: 35 puntos
    B: 55 puntos
    C: 75 puntos
    D: 80 puntos
  answer: C
  explanation: Exceder el límite de velocidad por 21 mph o más es una infracción de
    alto puntaje en Utah, lo que resulta en 75 puntos.
- id: 148
  category: penalties_and_points
  question: En Utah, ¿cuántos puntos en su historial de manejo resultarán de no detenerse
    ante un semáforo en rojo o una señal de alto?
  choices:
    A: 35 puntos
    B: 50 puntos
    C: 60 puntos
    D: 75 puntos
  answer: B
  explanation: No detenerse ante un semáforo en rojo o una señal de alto es una infracción
    de 50 puntos en Utah.
- id: 149
  category: penalties_and_points
  question: Después de una primera condena por DUI en Utah, ¿por cuánto tiempo se
    le clasifica como 'Conductor restringido por alcohol' (Alcohol Restricted Driver)?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: 10 años
  answer: B
  explanation: Una persona condenada por DUI es clasificada como conductor restringido
    por alcohol durante 2 años por una primera infracción.
- id: 150
  category: penalties_and_points
  question: 'Para una primera infracción de DUI, a un conductor de Utah de 21 años
    de edad o más generalmente se le requiere tener instalado un dispositivo de bloqueo
    de encendido durante:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 3 años
  answer: C
  explanation: La ley de Utah generalmente requiere que un infractor de DUI por primera
    vez (mayor de 21 años) use un dispositivo de bloqueo de encendido durante 18 meses.
- id: 151
  category: penalties_and_points
  question: Su licencia de conducir de Utah será revocada obligatoriamente si es condenado
    por ¿cuántos cargos de conducción temeraria dentro de un período de 12 meses?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: A
  explanation: La ley de Utah exige la revocación de la licencia si un conductor es
    condenado por dos cargos de conducción temeraria dentro de un período de un año.
- id: 152
  category: penalties_and_points
  question: ¿Cuál de las siguientes condenas resultará en la revocación obligatoria
    de su privilegio de conducir en Utah?
  choices:
    A: No señalar un giro
    B: No detenerse y prestar ayuda cuando se está involucrado en un accidente que
      resulta en lesiones o muerte
    C: Exceso de velocidad de 15 mph sobre el límite
    D: Seguir a otro vehículo demasiado de cerca
  answer: B
  explanation: No detenerse y prestar ayuda (atropello y fuga o 'hit and run') en
    un accidente que involucre lesiones o muerte resulta en la revocación obligatoria
    de la licencia.
- id: 153
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su historial de conducción de Utah por conducir
    en el lado equivocado de la carretera (sentido contrario)?
  choices:
    A: 50 puntos
    B: 60 puntos
    C: 75 puntos
    D: 80 puntos
  answer: B
  explanation: Conducir en el lado equivocado de la carretera es una infracción de
    60 puntos en Utah.
- id: 154
  category: penalties_and_points
  question: ¿Cuál es la tarifa administrativa para restablecer una licencia de conducir
    de Utah que fue suspendida o revocada por una infracción relacionada con el alcohol?
  choices:
    A: Ninguna
    B: $65
    C: $150
    D: $285
  answer: D
  explanation: Según las regulaciones actuales de Utah, la tarifa para restablecer
    una licencia después de una suspensión relacionada con el alcohol es de $285.
- id: 155
  category: penalties_and_points
  question: La ley de Utah exige la revocación obligatoria de una licencia de conducir
    por ¿cuál de los siguientes motivos?
  choices:
    A: Cualquier delito grave (felony) en el que se utilice un vehículo motorizado
    B: Estacionarse en una zona para personas con discapacidad sin un permiso
    C: Conducir con una luz trasera rota
    D: No usar el cinturón de seguridad
  answer: A
  explanation: El uso de un vehículo motorizado en la comisión de cualquier delito
    grave (felony) conlleva la revocación obligatoria de la licencia de conducir en
    Utah.
- id: 156
  category: sharing_the_road
  question: Según la ley de Utah, ¿cuál es la distancia mínima que un automovilista
    debe mantener al adelantar a una bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: El Código de Utah 41-6a-706.5 exige que los automovilistas proporcionen
    un mínimo de tres pies de espacio al adelantar a una persona que opera una bicicleta.
- id: 157
  category: sharing_the_road
  question: En Utah, el 'filtrado de carriles' (lane filtering) por parte de motociclistas
    es legal solo bajo ¿cuál de las siguientes condiciones?
  choices:
    A: En cualquier carretera a cualquier velocidad
    B: Cuando el límite de velocidad es de 45 mph o menos y los vehículos están detenidos
    C: Solo durante las horas pico en la I-15
    D: Cuando el motociclista viaja a al menos 30 mph
  answer: B
  explanation: La ley de Utah permite el filtrado de carriles cuando el límite de
    velocidad indicado es de 45 mph o menos, los otros vehículos están detenidos y
    la motocicleta viaja a 15 mph o menos.
- id: 158
  category: sharing_the_road
  question: 'Al acercarse a un vehículo de emergencia estacionado con luces intermitentes
    en una carretera de Utah con al menos dos carriles que viajan en la misma dirección,
    usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener la velocidad pero tocar la bocina para alertar al oficial
    C: Cambiarse a un carril que no esté adyacente al vehículo de emergencia, si es
      seguro
    D: Acelerar para pasar el vehículo rápidamente
  answer: C
  explanation: La ley de 'Hacerse a un lado' (Move Over) de Utah exige que los conductores
    se muevan a un carril que no sea adyacente al vehículo de emergencia estacionado
    si es seguro hacerlo; de lo contrario, deben reducir la velocidad y proceder con
    precaución.
- id: 159
  category: sharing_the_road
  question: 'En Utah, debe ceder el paso a un peatón en un cruce peatonal cuando el
    peatón está:'
  choices:
    A: Solo si se encuentra en una zona escolar
    B: En la mitad de la calzada por la que circula su vehículo
    C: Solo si utiliza un bastón blanco
    D: Solo si tiene una señal de 'Caminar' (Walk)
  answer: B
  explanation: La ley de Utah exige que los conductores cedan el paso a los peatones
    cuando el peatón se encuentra en la mitad de la calzada por la que circula el
    vehículo, o se aproxima tanto desde la mitad opuesta como para estar en peligro.
- id: 160
  category: sharing_the_road
  question: Al conducir cerca de un camión comercial grande, debe evitar la 'Zona
    No' (No-Zone). ¿Qué es la 'Zona No'?
  choices:
    A: El área directamente detrás del remolque del camión donde el conductor no puede
      verlo
    B: El área directamente frente al camión
    C: Las áreas a ambos lados del camión donde se encuentran los puntos ciegos del
      conductor
    D: Todas las anteriores
  answer: D
  explanation: La 'Zona No' (No-Zone) se refiere a los grandes puntos ciegos alrededor
    de la parte delantera, trasera y laterales de un camión donde el conductor no
    puede ver a otros vehículos.
- id: 161
  category: sharing_the_road
  question: 'En Utah, si usted está girando a la izquierda y un ciclista está entrando
    en la intersección desde la dirección opuesta, usted debe:'
  choices:
    A: Ceder el paso al ciclista como lo haría con cualquier otro vehículo
    B: Girar rápidamente antes de que el ciclista llegue a la intersección
    C: Tocar la bocina para advertir al ciclista que se detenga
    D: Asumir que el ciclista se detendrá por usted
  answer: A
  explanation: Los ciclistas tienen los mismos derechos y responsabilidades que los
    conductores de vehículos motorizados. Debe ceder el paso a un ciclista que se
    aproxima al realizar un giro a la izquierda.
- id: 162
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene en una carretera dividida por una
    barrera física o mediana, ¿qué vehículos están obligados a detenerse?
  choices:
    A: Todos los vehículos en ambas direcciones
    B: Solo los vehículos que viajan en la misma dirección que el autobús
    C: Solo los vehículos en la dirección opuesta
    D: No se requiere que ningún vehículo se detenga
  answer: B
  explanation: En Utah, si la carretera está dividida por una barrera física o mediana,
    solo el tráfico que viaja en la misma dirección que el autobús debe detenerse.
- id: 163
  category: sharing_the_road
  question: Según la ley de Utah, es ilegal seguir a menos de ______ pies de cualquier
    vehículo de bomberos que responda a una alarma.
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Utah prohíbe seguir a un camión de bomberos que viaja en
    respuesta a una alarma de incendio a una distancia menor de 500 pies.
- id: 164
  category: sharing_the_road
  question: 'Si ve a un peatón usando un bastón blanco o un perro guía en Utah, usted
    debe:'
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Detenerse y ceder el derecho de paso, incluso si el peatón no está en un cruce
      peatonal
    C: Conducir alrededor de ellos lentamente
    D: Solo detenerse si están en una intersección controlada
  answer: B
  explanation: La ley de Utah exige que los conductores tomen precauciones adicionales
    y cedan el derecho de paso a los peatones ciegos o con discapacidad visual que
    utilicen un bastón blanco o un perro guía.
- id: 165
  category: sharing_the_road
  question: 'Cuando un ciclista viaja a una velocidad menor que el flujo del tráfico
    en Utah, generalmente debe circular:'
  choices:
    A: Solo por la acera
    B: En contra del flujo del tráfico
    C: Tan a la derecha como sea posible
    D: Exactamente en el centro del carril
  answer: C
  explanation: Los ciclistas deben circular tan a la derecha como sea posible, excepto
    cuando estén rebasando, preparándose para un giro a la izquierda o evitando peligros.
- id: 166
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión puede:'
  choices:
    A: Permanecer completamente en el carril derecho
    B: Necesitar abrirse hacia el carril izquierdo para no chocar con el bordillo
    C: Girar siempre desde el carril izquierdo
    D: Detenerse y esperar a que el tráfico despeje ambos carriles
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse para completar un giro
    a la derecha. Los conductores deben evitar 'apretarse' entre el camión y el bordillo.
- id: 167
  category: sharing_the_road
  question: 'En Utah, se permite que las motocicletas utilicen los carriles para vehículos
    de alta ocupación (HOV):'
  choices:
    A: Solo si llevan dos o más personas en la moto
    B: Solo durante las horas no pico
    C: En todo momento, independientemente del número de pasajeros
    D: Nunca
  answer: C
  explanation: Según las leyes federales y del estado de Utah, las motocicletas pueden
    utilizar los carriles HOV incluso con un solo conductor.
- id: 168
  category: sharing_the_road
  question: Según la ley de 'filtrado de carriles' (Lane Filtering) de Utah, un motociclista
    puede moverse entre carriles de tráfico detenido solo si el límite de velocidad
    indicado es de ______ o menos.
  choices:
    A: 35 mph
    B: 40 mph
    C: 45 mph
    D: 55 mph
  answer: C
  explanation: La ley de Utah permite el filtrado de carriles por parte de motocicletas
    solo en carreteras donde el límite de velocidad es de 45 mph o menos, los vehículos
    están detenidos y la motocicleta no supera las 15 mph.
- id: 169
  category: sharing_the_road
  question: Los camiones grandes tienen 'Zonas Prohibidas' (No-Zones) donde el conductor
    no puede ver su vehículo. ¿Dónde se encuentra la 'Zona Prohibida' más grande en
    un camión con remolque?
  choices:
    A: Directamente frente a la cabina
    B: El lado izquierdo del remolque
    C: El lado derecho del remolque
    D: Directamente detrás del remolque
  answer: C
  explanation: El lado derecho de un camión grande es el punto ciego (No-Zone) más
    grande, y se extiende a través de varios carriles.
- id: 170
  category: sharing_the_road
  question: En Utah, ¿cuántos puntos se asignan a su historial de manejo por no detenerse
    ante un autobús escolar que tiene sus luces rojas intermitentes?
  choices:
    A: 35 puntos
    B: 50 puntos
    C: 60 puntos
    D: 100 puntos
  answer: C
  explanation: Rebasar un autobús escolar con sus luces rojas intermitentes es una
    infracción grave en Utah y conlleva una penalización de 60 puntos.
- id: 171
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima de seguimiento que debe mantener detrás de
    una motocicleta en Utah para garantizar la seguridad?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: Al menos 4 segundos
    D: 10 pies
  answer: C
  explanation: El Manual del Conductor de Utah recomienda una distancia de seguimiento
    de al menos 4 segundos detrás de las motocicletas porque estas pueden detenerse
    mucho más rápido que los automóviles.
- id: 172
  category: sharing_the_road
  question: Cuando un vehículo de emergencia responde a una llamada con su sirena
    y luces encendidas, es ilegal seguirlo a una distancia menor de ______ pies.
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: En Utah, es ilegal seguir a un vehículo de emergencia (como un camión
    de bomberos) a menos de 500 pies cuando este responde a una alarma.
- id: 173
  category: sharing_the_road
  question: El emblema de vehículo de movimiento lento es un triángulo naranja reflectante
    que debe exhibirse en la parte trasera de los vehículos diseñados para viajar
    a velocidades de ______ o menos.
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio para los
    vehículos que viajan a velocidades de 25 mph o menos, como equipos agrícolas o
    vehículos de construcción.
- id: 174
  category: sharing_the_road
  question: En Utah, ¿cuándo puede un automovilista girar legalmente a la derecha
    cruzando un carril para bicicletas?
  choices:
    A: Nunca; debe girar desde el carril de vehículos
    B: Solo después de verificar si hay ciclistas y ceder el paso a cualquiera que
      esté en el carril
    C: Solo si no hay señales de 'No girar a la derecha'
    D: Los ciclistas siempre deben ceder el paso a los autos que giran
  answer: B
  explanation: Los automovilistas deben verificar y ceder el paso a los ciclistas
    antes de cruzar un carril de bicicletas para realizar un giro.
- id: 175
  category: sharing_the_road
  question: 'Cuando un cortejo fúnebre utiliza luces intermitentes de advertencia
    (hazard lights) y sigue a un vehículo de escolta, los demás conductores en Utah
    deben:'
  choices:
    A: Unirse al cortejo para avanzar entre el tráfico
    B: Rebasar al cortejo por la derecha
    C: Ceder el derecho de paso y no interrumpir el cortejo
    D: Tocar la bocina para mostrar respeto
  answer: C
  explanation: La ley de Utah otorga el derecho de paso a los cortejos fúnebres; los
    demás conductores deben ceder el paso y no conducir entre los vehículos del cortejo.
- id: 176
  category: sharing_the_road
  question: 'Si está conduciendo y un vehículo de emergencia con sirenas y luces intermitentes
    se aproxima por detrás, usted debe:'
  choices:
    A: Detenerse exactamente donde está
    B: Hacerse a un lado hacia el borde derecho de la carretera y detenerse
    C: Aumentar la velocidad para quitarse del camino
    D: Hacerse a un lado hacia la mediana izquierda y detenerse
  answer: B
  explanation: La ley de Utah exige que los conductores se muevan hacia el borde derecho
    de la carretera y se detengan hasta que el vehículo de emergencia haya pasado.
- id: 177
  category: vehicle_information
  question: 'En Utah, las luces delanteras deben encenderse desde media hora después
    de la puesta del sol hasta media hora antes de la salida del sol y siempre que
    la visibilidad sea inferior a:'
  choices:
    A: 500 pies
    B: 700 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Según la ley de Utah, las luces delanteras deben usarse entre media
    hora después de la puesta del sol y media hora antes de la salida del sol, y en
    cualquier otro momento en que las condiciones (lluvia, nieve, niebla, etc.) impidan
    ver con claridad a 1,000 pies.
- id: 178
  category: vehicle_information
  question: De acuerdo con las leyes de tinte de ventanas de Utah, las ventanas laterales
    delanteras (a la izquierda y derecha del conductor) deben permitir el paso de
    al menos ¿qué porcentaje de luz?
  choices:
    A: 25%
    B: 35%
    C: 43%
    D: 50%
  answer: C
  explanation: La ley de Utah (41-6a-1635) especifica que las ventanas laterales delanteras
    deben tener una transmisión de luz no inferior al 43%.
- id: 179
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para vehículos de pasajeros en Utah?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros en Utah si tienen menos de 2/32
    de pulgada de profundidad de banda de rodadura en cualquiera de los dos surcos
    principales adyacentes.
- id: 180
  category: vehicle_information
  question: 'En Utah, todo vehículo motorizado debe estar equipado con un espejo montado
    en el lado izquierdo y al menos un espejo adicional ubicado para reflejar una
    vista de la carretera por al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: La ley de Utah exige espejos que proporcionen una vista de la carretera
    a una distancia de al menos 200 pies hacia la parte trasera del vehículo.
- id: 181
  category: vehicle_information
  question: 'Según la ley de Utah, la bocina de un vehículo debe ser audible en condiciones
    normales desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Todo vehículo motorizado debe estar equipado con una bocina en buen
    estado de funcionamiento capaz de emitir un sonido audible en condiciones normales
    desde una distancia no menor a 200 pies.
- id: 182
  category: vehicle_information
  question: A menos que esté específicamente exento, ¿cuántas placas de matrícula
    deben exhibirse en un vehículo registrado en Utah?
  choices:
    A: Una placa, exhibida solo en la parte trasera
    B: Una placa, exhibida solo en la parte delantera
    C: Dos placas, una en la parte delantera y otra en la parte trasera
    D: Dos placas, ambas en el parachoques trasero
  answer: C
  explanation: 'La ley de Utah generalmente requiere dos placas de matrícula: una
    firmemente sujeta en la parte delantera y otra firmemente sujeta en la parte trasera
    del vehículo.'
- id: 183
  category: vehicle_information
  question: En Utah, las lámparas de parada (luces de freno) deben ser visibles desde
    una distancia no menor a ______ bajo la luz solar normal.
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Los estándares de equipamiento de Utah requieren que las lámparas de
    parada sean visibles desde al menos 500 pies hacia atrás bajo la luz solar normal.
- id: 184
  category: vehicle_information
  question: Si una carga se extiende ______ o más allá de la parte trasera de la plataforma
    o carrocería de un vehículo en Utah, se debe exhibir una bandera roja (día) o
    una luz roja (noche) al final de la carga.
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: La ley de Utah requiere una bandera roja de al menos 12 pulgadas cuadradas
    durante el día, o una luz roja por la noche, si una carga se extiende 4 pies o
    más allá de la parte trasera del vehículo.
- id: 185
  category: vehicle_information
  question: La ley de Utah requiere que las luces de las señales de giro sean visibles
    desde una distancia no menor a ______ pies hacia adelante y hacia atrás bajo la
    luz solar normal.
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Las lámparas de las señales de giro deben ser visibles desde una distancia
    no menor a 100 pies bajo la luz solar normal.
- id: 186
  category: vehicle_information
  question: Con respecto a los sistemas de escape de los vehículos en Utah, ¿cuál
    de los siguientes es ilegal?
  choices:
    A: Un silenciador que reduzca el ruido
    B: Un tubo de escape que se extienda hasta la parte trasera del vehículo
    C: Una derivación del silenciador (muffler cutout), bypass o dispositivo similar
    D: Un sistema de escape que cumpla con las especificaciones del fabricante
  answer: C
  explanation: La ley de Utah prohíbe el uso de una derivación del silenciador (muffler
    cutout), bypass o dispositivo similar en cualquier vehículo motorizado que circule
    por una carretera.
- id: 187
  category: vehicle_information
  question: En Utah, si está remolcando un tráiler, la barra de tracción u otra conexión
    debe ser lo suficientemente fuerte para tirar de todo el peso remolcado y no debe
    exceder los ______ pies de longitud entre los vehículos.
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Utah establece que la barra de tracción o la conexión entre
    dos vehículos, uno de los cuales remolca al otro, no debe exceder los 15 pies.
- id: 188
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para los parabrisas de los vehículos
    en Utah?
  choices:
    A: Pueden estar cubiertos con una película reflectante en toda su superficie
    B: Deben estar equipados con un dispositivo para limpiar la lluvia, la nieve u
      otra humedad
    C: No son necesarios si el conductor usa gafas protectoras
    D: Pueden tener grietas de cualquier tamaño siempre que estén en el lado del pasajero
  answer: B
  explanation: La ley de Utah requiere que todo vehículo motorizado con parabrisas
    esté equipado con un sistema de limpiaparabrisas mantenido en buen estado de funcionamiento
    para limpiar la lluvia, la nieve o la humedad.
- id: 189
  category: vehicle_information
  question: Según el Manual del Conductor de Utah, ¿cuándo se requiere que encienda
    sus faros delanteros?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Entre 30 minutos después del atardecer y 30 minutos antes del amanecer
    C: Entre 1 hora después del atardecer y 1 hora antes del amanecer
    D: Solo cuando la visibilidad sea inferior a 1,000 pies
  answer: B
  explanation: La ley de Utah requiere que los faros delanteros se enciendan desde
    media hora después del atardecer hasta media hora antes del amanecer, o siempre
    que la visibilidad no sea suficiente para ver claramente a una persona o un vehículo
    a una distancia de 1,000 pies.
- id: 190
  category: vehicle_information
  question: Según la ley de Utah, ¿cuál es el porcentaje mínimo de luz que se debe
    permitir pasar a través de las ventanas laterales delanteras (las ventanas inmediatamente
    a la izquierda y derecha del conductor)?
  choices:
    A: 25%
    B: 35%
    C: 43%
    D: 70%
  answer: C
  explanation: El Código de Utah 41-6a-1635 establece que las ventanas laterales delanteras
    deben permitir al menos un 43% de transmitancia de luz.
- id: 191
  category: vehicle_information
  question: ¿En Utah, el freno de pie de su vehículo debe ser capaz de detener el
    vehículo a qué distancia en pies cuando viaja a 20 mph en pavimento seco y nivelado?
  choices:
    A: 15 pies
    B: 25 pies
    C: 35 pies
    D: 50 pies
  answer: B
  explanation: Los estándares de equipamiento de Utah requieren que el freno de servicio
    (freno de pie) debe ser capaz de detener el vehículo dentro de 25 pies a una velocidad
    de 20 mph.
- id: 192
  category: vehicle_information
  question: ¿Cuántos espejos retrovisores se requieren en un vehículo registrado en
    Utah?
  choices:
    A: Solo uno en el lado del conductor
    B: Solo uno dentro del vehículo
    C: Al menos dos espejos, uno de los cuales debe estar en el lado izquierdo
    D: 'Tres espejos: izquierdo, derecho y central'
  answer: C
  explanation: La ley de Utah requiere al menos dos espejos. Uno debe estar en el
    lado izquierdo, y el segundo puede estar en el centro (interior) o en el lado
    derecho.
- id: 193
  category: vehicle_information
  question: 'En Utah, todo vehículo motorizado debe estar equipado con una bocina
    que se pueda escuchar desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Utah requiere una bocina en buen estado de funcionamiento
    capaz de emitir un sonido audible bajo condiciones normales desde una distancia
    no menor a 200 pies.
- id: 194
  category: vehicle_information
  question: 'La placa de matrícula trasera de un vehículo en Utah debe estar iluminada
    de modo que sea claramente legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: La ley de Utah requiere una luz blanca para iluminar la placa de matrícula
    trasera para que sea visible desde al menos 100 pies hacia atrás.
- id: 195
  category: vehicle_information
  question: 'La ley de Utah requiere que las luces traseras sean de color rojo y visibles
    desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Las luces traseras de los vehículos en Utah deben ser rojas y visibles
    desde una distancia de 500 pies hacia atrás.
- id: 196
  category: vehicle_information
  question: 'Según la ley de Utah, el freno de estacionamiento de un vehículo debe
    ser capaz de sostener el vehículo:'
  choices:
    A: Solo en terreno nivelado
    B: En una pendiente del 5%
    C: En cualquier pendiente en la que se opere
    D: Solo cuando el motor está en marcha
  answer: C
  explanation: El freno de estacionamiento debe ser adecuado para sostener el vehículo
    en cualquier pendiente en la que se opere, bajo todas las condiciones de carga,
    en una superficie libre de nieve, hielo o material suelto.
- id: 197
  category: signs_and_signals
  question: ¿En Utah, qué significa una flecha amarilla intermitente en una intersección?
  choices:
    A: Usted tiene el derecho de paso para girar a la izquierda.
    B: Debe detenerse y esperar una flecha verde.
    C: Se permiten los giros, pero primero debe ceder el paso al tráfico que viene
      en sentido contrario y a los peatones.
    D: La luz está a punto de cambiar a rojo y debe despejar la intersección.
  answer: C
  explanation: Según el Manual del Conductor de Utah, una flecha amarilla intermitente
    significa que puede girar a la izquierda después de ceder el paso al tráfico que
    viene en sentido contrario y a los peatones. El tráfico que viene en sentido contrario
    todavía tiene luz verde.
- id: 198
  category: signs_and_signals
  question: Al acercarse a una zona escolar en Utah donde hay una señal de 'Límite
    de velocidad escolar 20' (School Speed Limit 20), ¿cuándo está en vigor el límite
    de 20 mph?
  choices:
    A: Solo cuando hay niños visiblemente presentes en la acera.
    B: Solo durante el horario escolar.
    C: Cuando las luces intermitentes estén encendidas o cuando se coloquen señales
      en la calzada.
    D: En todo momento del día y de la noche.
  answer: C
  explanation: En Utah, los límites de velocidad de las zonas escolares están en vigor
    cuando lo indican las luces intermitentes o cuando los guardias de cruce escolar
    colocan señales específicas en la calzada.
- id: 199
  category: signs_and_signals
  question: ¿Cuál es el significado de una línea blanca sólida doble en una carretera
    de Utah?
  choices:
    A: Separa el tráfico que se mueve en direcciones opuestas.
    B: Marca el borde de la calzada.
    C: Separa los carriles de tráfico que van en la misma dirección y está prohibido
      cruzarla.
    D: Indica un carril que puede usarse para rebasar.
  answer: C
  explanation: Una línea blanca sólida doble indica que los cambios de carril están
    prohibidos. Esto se ve comúnmente cerca de las entradas y salidas de los carriles
    expresos (Express Lanes) en Utah.
- id: 200
  category: signs_and_signals
  question: ¿En Utah, cuál es la distancia máxima que puede viajar en un carril central
    compartido para girar?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: No hay un límite de distancia específico.
  answer: C
  explanation: La ley de Utah especifica que un carril central compartido para girar
    no puede usarse para viajar más de 500 pies. Está destinado únicamente para realizar
    giros a la izquierda o para incorporarse al tráfico.
- id: 201
  category: signs_and_signals
  question: Cuando ve un emblema de "Vehículo de movimiento lento" (un triángulo naranja
    con borde rojo) en la parte trasera de un vehículo, ¿qué significa sobre la velocidad
    a la que viaja el vehículo?
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de "Vehículo de movimiento lento" es obligatorio en los
    vehículos diseñados para operar a velocidades de 25 mph o menos.
- id: 202
  category: signs_and_signals
  question: Bajo la ley de Utah, ¿cuándo se le permite girar a la izquierda con una
    luz roja?
  choices:
    A: Nunca; los giros a la izquierda en rojo siempre son ilegales.
    B: Solo cuando se gira desde una calle de un solo sentido hacia otra calle de
      un solo sentido.
    C: En cualquier momento que no haya tráfico en sentido contrario.
    D: Solo si una señal lo permite específicamente.
  answer: B
  explanation: En Utah, puede girar a la izquierda en rojo solo cuando gire de una
    calle de un solo sentido a otra calle de un solo sentido, después de detenerse
    por completo y ceder el paso al tráfico y a los peatones.
- id: 203
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente en una intersección en Utah?
  choices:
    A: Reduzca la velocidad y proceda con precaución.
    B: La señal está descompuesta; trátela como una intersección sin control.
    C: Deténgase por completo y proceda solo cuando sea seguro hacerlo, tratándola
      como una señal de alto.
    D: Espere a que la luz cambie a verde antes de proceder.
  answer: C
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de alto. Debe detenerse por completo y ceder el derecho de paso antes de continuar.
- id: 204
  category: signs_and_signals
  question: En Utah, ¿qué señal manual debe usar un conductor para indicar que está
    reduciendo la velocidad o deteniéndose?
  choices:
    A: Brazo izquierdo extendido directamente hacia afuera de la ventana.
    B: Brazo izquierdo extendido hacia arriba.
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás.
    D: Brazo derecho moviéndose de un lado a otro.
  answer: C
  explanation: La señal manual estándar para detenerse o reducir la velocidad es el
    brazo izquierdo extendido hacia abajo con la palma de la mano mirando hacia atrás.
- id: 205
  category: signs_and_signals
  question: ¿Qué indican los "sharrows" (marcas en el pavimento que muestran una bicicleta
    con dos galones encima) en las carreteras de Utah?
  choices:
    A: Un carril exclusivo para bicicletas donde los autos están prohibidos.
    B: Un carril que es compartido tanto por vehículos motorizados como por bicicletas.
    C: Un área de acera donde se permiten bicicletas.
    D: Una zona de cruce solo para bicicletas.
  answer: B
  explanation: Los sharrows, o marcas de carril compartido, indican que el carril
    es demasiado estrecho para que una bicicleta y un vehículo viajen uno al lado
    del otro de manera segura, y los automovilistas deben esperar compartir el carril
    con los ciclistas.
- id: 206
  category: signs_and_signals
  question: De acuerdo con la ley de Utah, ¿a qué distancia debe detenerse del riel
    más cercano de un cruce de ferrocarril cuando se aproxima un tren?
  choices:
    A: Entre 5 y 25 pies
    B: Entre 10 y 30 pies
    C: Entre 15 y 50 pies
    D: Exactamente 20 pies
  answer: C
  explanation: La ley de Utah exige que los conductores se detengan a una distancia
    de entre 15 y 50 pies del riel más cercano de un cruce de ferrocarril cuando las
    señales están parpadeando o se aproxima un tren.
- id: 207
  category: signs_and_signals
  question: Al entrar en una rotonda en Utah, ¿cuál de las siguientes afirmaciones
    es verdadera con respecto a la señalización?
  choices:
    A: Debe señalizar a la izquierda para entrar en la rotonda.
    B: No es necesario señalizar en ningún punto de la rotonda.
    C: Debe señalizar a la derecha cuando se esté preparando para salir de la rotonda.
    D: Debe señalizar a la izquierda hasta que llegue a la salida deseada.
  answer: C
  explanation: El Manual del Conductor de Utah instruye a los conductores a usar su
    señal de giro a la derecha cuando estén a punto de salir de una rotonda para informar
    a otros conductores sobre sus intenciones.
- id: 208
  category: signs_and_signals
  question: ¿De qué color y forma es típicamente una señal de "Sentido contrario"
    (Wrong Way) o "No entrar" (Do Not Enter) en Utah?
  choices:
    A: Diamante amarillo
    B: Rectángulo blanco con letras negras
    C: Cuadrado o rectángulo rojo y blanco
    D: Diamante naranja
  answer: C
  explanation: Las señales reglamentarias que prohíben ciertos movimientos, como "Sentido
    contrario" y "No entrar", son de color rojo y blanco.
- id: 209
  category: signs_and_signals
  question: En Utah, ¿qué significa una línea amarilla continua en su lado de la línea
    central?
  choices:
    A: Puede rebasar si es seguro hacerlo.
    B: Se encuentra en una zona de un solo sentido.
    C: No se le permite rebasar.
    D: Debe detenerse ante un autobús escolar.
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central indica una
    "zona de no rebasar". No puede cruzar la línea para rebasar a otros vehículos.
- id: 210
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de un "área de bifurcación" (gore area)
    en una autopista de Utah, marcada por líneas blancas en forma de V?
  choices:
    A: Es un área de estacionamiento de emergencia.
    B: Es un carril para vehículos de movimiento lento.
    C: Es un área neutral entre un carril de aceleración y los carriles de circulación
      donde está prohibido conducir.
    D: Es un carril exclusivo para motocicletas.
  answer: C
  explanation: El área de bifurcación (gore area) es el vértice teórico del triángulo
    entre la carretera principal y una rampa de salida o entrada. En Utah, es ilegal
    conducir a través de o estacionarse en el área de bifurcación.
- id: 211
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas continuas dobles pintadas en el pavimento
    en Utah, específicamente con respecto a los carriles expreso (Express Lanes)?
  choices:
    A: Se desaconseja el cambio de carril pero está permitido
    B: Está prohibido cruzar las líneas
    C: Puede cruzar las líneas solo para salir del carril HOV
    D: El carril es solo para vehículos de emergencia
  answer: B
  explanation: En Utah, las líneas blancas continuas dobles indican que los cambios
    de carril están prohibidos. Esto se aplica estrictamente en los carriles expreso/HOV;
    solo puede entrar o salir donde las líneas sean discontinuas.
- id: 212
  category: signs_and_signals
  question: Según la ley de Utah, ¿cuándo debe un conductor detenerse ante un peatón
    en un paso de peatones en una carretera de varios carriles?
  choices:
    A: Solo si el peatón está directamente frente al automóvil
    B: Cuando el peatón se encuentra en la mitad de la calzada por la que circula
      el vehículo
    C: Solo si hay una señal de 'Cruce escolar' (School Crossing)
    D: Solo si el peatón hace contacto visual
  answer: B
  explanation: La ley de Utah exige que los conductores se detengan ante un peatón
    cuando este se encuentre en la mitad de la calzada por la que circula el vehículo,
    o cuando el peatón esté a un carril de distancia de la mitad de la calzada del
    conductor.
- id: 213
  category: signs_and_signals
  question: Si las luces direccionales de su vehículo no funcionan, ¿cuál es la señal
    manual correcta para indicar que se va a detener o a disminuir la velocidad?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana
    B: Brazo extendido hacia arriba en un ángulo de 90 grados
    C: Brazo extendido hacia abajo con la palma hacia atrás
    D: Mover el brazo en movimiento circular
  answer: C
  explanation: Para señalar una parada o una disminución de la velocidad mediante
    señales manuales en Utah, el conductor debe extender su brazo izquierdo hacia
    abajo con la palma hacia atrás.
- id: 214
  category: signs_and_signals
  question: Al acercarse a un cruce de ferrocarril con señales intermitentes, la ley
    de Utah exige que detenga su vehículo a una distancia de entre ______ pies del
    riel más cercano.
  choices:
    A: 5 a 25 pies
    B: 10 a 30 pies
    C: 15 a 50 pies
    D: 20 a 60 pies
  answer: C
  explanation: La ley de Utah (41-6a-1203) exige que los conductores se detengan al
    menos a 15 pies pero a no más de 50 pies del riel más cercano de un cruce de ferrocarril
    cuando las señales están activas.
- id: 215
  category: signs_and_signals
  question: ¿Cuál es la regla para los 'medidores de rampa' (Ramp Meters) (semáforos
    en las entradas de las autopistas) en Utah?
  choices:
    A: Se permiten dos autos por luz verde
    B: Solo se permite un vehículo por luz verde por carril
    C: Solo están activos durante las tormentas de nieve
    D: No tiene que detenerse si viaja en un vehículo compartido (carpool)
  answer: B
  explanation: Los medidores de rampa de Utah están diseñados para espaciar los vehículos
    que entran a la autopista. A menos que se indique lo contrario, solo un vehículo
    puede pasar por cada luz verde por carril.
- id: 216
  category: signs_and_signals
  question: 'Una marca en el pavimento con una línea amarilla continua junto a una
    línea amarilla discontinua significa:'
  choices:
    A: Está prohibido rebasar en ambas direcciones
    B: Se permite rebasar al tráfico que está al lado de la línea discontinua
    C: Se permite rebasar al tráfico que está al lado de la línea continua
    D: La carretera es de un solo sentido
  answer: B
  explanation: Cuando una línea amarilla continua y una discontinua están juntas,
    los conductores que están al lado de la línea discontinua pueden rebasar si es
    seguro hacerlo. Los conductores que están al lado de la línea continua tienen
    prohibido rebasar.
- id: 217
  category: signs_and_signals
  question: ¿Qué símbolo en el pavimento identifica un carril reservado para vehículos
    de alta ocupación (HOV) en Utah?
  choices:
    A: Un cuadrado blanco
    B: Un diamante blanco
    C: Un círculo amarillo
    D: Un triángulo blanco
  answer: B
  explanation: El símbolo del diamante en el pavimento indica un carril reservado
    para vehículos específicos, tales como vehículos compartidos (carpools), autobuses
    o vehículos de combustible limpio (carriles HOV/Express).
- id: 218
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia abajo
    C: Brazo izquierdo extendido hacia arriba
    D: Brazo derecho extendido recto hacia afuera
  answer: C
  explanation: Según el Manual del Conductor de Utah, la señal manual para un giro
    a la derecha es el brazo izquierdo extendido hacia arriba en un ángulo de 90 grados.
- id: 219
  category: signs_and_signals
  question: En Utah, ¿qué distancia se le permite conducir en un carril central compartido
    para girar antes de realizar su giro?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: Tanto como sea necesario
  answer: C
  explanation: La ley de Utah establece que un carril central compartido para girar
    no puede usarse para circular por más de 500 pies. Está destinado únicamente a
    prepararse para un giro a la izquierda o para incorporarse a la carretera desde
    una entrada privada.
- id: 220
  category: signs_and_signals
  question: ¿Qué indica una luz amarilla fija del semáforo?
  choices:
    A: Debe acelerar para despejar la intersección
    B: La señal va a cambiar a rojo; deténgase si es seguro hacerlo
    C: Usted tiene el derecho de paso para terminar su giro
    D: Los peatones tienen el derecho de paso
  answer: B
  explanation: Una luz amarilla fija significa que la señal roja está a punto de aparecer.
    Debe detenerse si puede hacerlo de manera segura. Si ya se encuentra en la intersección,
    debe continuar con precaución.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 221
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 222
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 223
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de
    manera segura.
  id: 224
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 225
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 226
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 227
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 228
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 229
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 230
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad indican la velocidad máxima legal para el área
    en condiciones ideales.
  id: 231
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 232
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 233
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce ferroviario
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 234
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta más adelante
    B: Una zona de hospital
    C: Un cruce ferroviario más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce ferroviario más adelante. Reduzca la velocidad,
    mire y escuche si vienen trenes.
  id: 235
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce ferroviario
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce ferroviario se coloca
    en los cruces de tren. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 236
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 237
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos severo
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 238
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera curve primero
    en un sentido y luego en el otro.
  id: 239
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 240
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica este letrero que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 241
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la vía y ajuste
    su posición en el carril.
  id: 242
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 243
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 244
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una vía de un solo sentido o de una autopista dividida y
    se encuentre con vehículos que viajan en la dirección opuesta.
  id: 245
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 246
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 247
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de pare (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 248
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de pare (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de pare (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de pare.
  id: 249
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las carreteras
    laterales.
  id: 250
- image: side_road.png
  category: signs_and_signals
  id: 251
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
- image: added_lane.png
  category: signs_and_signals
  id: 252
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está agregando un carril nuevo; no es necesario incorporarse
    D: Se requiere girar a la derecha
  answer: C
  explanation: Una señal de carril adicional significa que un carril nuevo se une
    a la carretera sin necesidad de incorporarse (merging). El tráfico que entra desde
    la rampa tiene su propio carril nuevo.
- image: no_parking.png
  category: signs_and_signals
  id: 253
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
- image: handicap_parking.png
  category: signs_and_signals
  id: 254
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de estacionamiento para personas con discapacidad válida pueden
    estacionarse en estos espacios. Las infracciones conllevan multas elevadas.
