metadata:
  source: Driving a Passenger Vehicle (SAAQ)
  total_questions: 225
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Quebec, what is the minimum age required to apply for a Class 5 learner's
    license?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: C
  explanation: According to SAAQ regulations, a person must be at least 16 years old
    to obtain a Class 5 learner's license. If under 18, parental consent is required.
- id: 2
  category: license_system
  question: An accompanying rider for a learner's license holder in Quebec must have
    held a valid Class 5 driver's license for at least how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: The accompanying driver must have held a valid Class 5 passenger vehicle
    license for at least 2 years and be in a position to provide help and advice.
- id: 3
  category: license_system
  question: How long does the probationary license period last in Quebec before you
    can obtain a full driver's license?
  choices:
    A: 12 months
    B: 18 months
    C: 24 months
    D: 36 months
  answer: C
  explanation: The probationary license is valid for 24 months. After this period,
    if the driver has maintained a good record, they are eligible for a regular driver's
    license.
- id: 4
  category: license_system
  question: What is the maximum number of demerit points a probationary license holder
    can accumulate before their license is suspended?
  choices:
    A: 4 points
    B: 8 points
    C: 12 points
    D: 15 points
  answer: A
  explanation: In Quebec, the demerit point threshold for a probationary license holder
    is 4 points. Reaching this limit results in a minimum 3-month license suspension.
- id: 5
  category: license_system
  question: In Quebec, the 'zero alcohol' rule applies to all drivers under what age?
  choices:
    A: Under 18
    B: Under 19
    C: Under 21
    D: Under 22
  answer: D
  explanation: Quebec enforces a zero-alcohol tolerance policy for all drivers under
    the age of 22, as well as for all learner and probationary license holders regardless
    of age.
- id: 6
  category: license_system
  question: Between what hours is a Class 5 learner's license holder prohibited from
    driving in Quebec?
  choices:
    A: 11 PM to 6 AM
    B: Midnight to 5 AM
    C: 10 PM to 5 AM
    D: Midnight to 6 AM
  answer: B
  explanation: Holders of a learner's license are prohibited from driving between
    midnight and 5 AM to reduce the risk of nighttime accidents.
- id: 7
  category: license_system
  question: Which of the following is a mandatory requirement to obtain a Class 5
    license in Quebec?
  choices:
    A: Completion of a 10-hour defensive driving seminar
    B: Completion of the SAAQ-approved driving course (4 phases)
    C: A minimum of 100 hours of supervised driving
    D: Owning a registered vehicle
  answer: B
  explanation: Quebec's Graduated Licensing Program requires all new drivers to complete
    a mandatory driving course consisting of 4 phases, including both theoretical
    and practical components.
- id: 8
  category: license_system
  question: For a driver aged 23 to 24, what is the demerit point threshold for license
    suspension?
  choices:
    A: 4 points
    B: 8 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: 'Quebec uses a tiered demerit point system: 4 points for probationary
    holders, 8 points for those under 23, 12 points for those aged 23 and 24, and
    15 points for those 25 and older.'
- id: 9
  category: license_system
  question: If you change your address, you must notify the SAAQ within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Under the Highway Safety Code, a license holder must notify the SAAQ
    of any change of address within 30 days.
- id: 10
  category: license_system
  question: A probationary license holder aged 19 or younger who has held their license
    for less than 6 months cannot carry more than how many passengers aged 19 or younger
    between midnight and 5 AM?
  choices:
    A: Zero passengers
    '1': 1 passenger
    C: 2 passengers
    D: 3 passengers
  answer: B
  explanation: To improve safety for young drivers, those 19 and under with a probationary
    license for less than 6 months are limited to 1 passenger aged 19 or younger between
    midnight and 5 AM (excluding family members).
- id: 11
  category: license_system
  question: If you fail the SAAQ knowledge test, how long must you wait before you
    can take it again?
  choices:
    A: 7 days
    B: 14 days
    C: 28 days
    D: 30 days
  answer: C
  explanation: In Quebec, if a candidate fails the theoretical knowledge test, they
    must wait at least 28 days before they are permitted to retake it.
- id: 12
  category: license_system
  question: Which license class is required in Quebec to operate a moped or motorized
    scooter (Class 6D)?
  choices:
    A: Class 5
    B: Class 6D
    C: Class 8
    D: Class 6A
  answer: B
  explanation: Class 6D is the specific license required to operate a moped. Note
    that a Class 5 (passenger vehicle) license also allows the operation of a moped.
- id: 13
  category: license_system
  question: In Quebec, how often must a driver aged 75 undergo a medical examination
    and vision test to maintain their license?
  choices:
    A: Every year
    B: Every 2 years
    C: At age 75, 80, and then every 2 years
    D: Only if they are involved in an accident
  answer: C
  explanation: The SAAQ requires drivers to submit a medical report and undergo a
    vision test at age 75, again at age 80, and every 2 years thereafter.
- id: 14
  category: license_system
  question: What is the consequence for a first-time offense of using a hand-held
    cell phone while driving in Quebec?
  choices:
    A: A $100 fine and 2 points
    B: A fine of $300 to $600 and 5 demerit points
    C: Immediate 30-day license suspension and $1000 fine
    D: 3 demerit points and a warning
  answer: B
  explanation: In Quebec, using a hand-held device while driving results in a fine
    (typically $300-$600 for a first offense) and 5 demerit points. Repeat offenses
    lead to immediate license suspension.
- id: 15
  category: license_system
  question: How long must a person hold a learner's license in Quebec before they
    are eligible to take the road test for a probationary license?
  choices:
    A: 6 months
    B: 8 months
    C: 10 months
    D: 12 months
  answer: D
  explanation: A learner's license must be held for at least 12 months, during which
    the individual must complete the mandatory driving course phases, before they
    can take the SAAQ road test.
- id: 16
  category: license_system
  question: New residents who move to Quebec and hold a valid driver's license from
    another province or country must exchange it for a Quebec license within how many
    months?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: New residents are permitted to drive with their out-of-province or
    foreign license for a maximum of 6 months after settling in Quebec, after which
    they must obtain a Quebec license.
- id: 17
  category: license_system
  question: Under Quebec's public automobile insurance plan (SAAQ), which of the following
    is covered regardless of who is at fault?
  choices:
    A: Damage to the driver's vehicle
    B: Damage to public property
    C: Bodily injury resulting from a traffic accident
    D: Theft of personal items from the vehicle
  answer: C
  explanation: Quebec's 'no-fault' public insurance plan, managed by the SAAQ, covers
    bodily injury for all Quebec residents involved in a traffic accident, regardless
    of responsibility. Property damage is covered by private insurers.
- id: 18
  category: license_system
  question: A standard Class 5 driver's license in Quebec allows the holder to operate
    a vehicle with a maximum seating capacity of how many occupants?
  choices:
    A: 5 occupants
    B: 8 occupants
    C: 9 occupants
    D: 12 occupants
  answer: C
  explanation: A Class 5 license allows you to drive a passenger vehicle that can
    carry no more than 9 occupants (the driver plus 8 passengers) at a time.
- id: 19
  category: license_system
  question: How many demerit points are added to a Quebec driver's record for failing
    to stop when a school bus has its flashing lights in operation?
  choices:
    A: 3 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: C
  explanation: Failing to stop at least 5 meters from a school bus with its red lights
    flashing or its stop signal arm extended results in 9 demerit points and a significant
    fine.
- id: 20
  category: license_system
  question: To obtain a full motorcycle license (Class 6A), a person must hold a motorcycle
    learner's license (Class 6R) for at least how many months?
  choices:
    A: 6 months
    B: 9 months
    C: 11 months
    D: 12 months
  answer: C
  explanation: In Quebec, the motorcycle learner's license (Class 6R) must be held
    for a minimum of 11 months before the holder is eligible to take the final road
    test for a Class 6A license.
- id: 21
  category: license_system
  question: In Quebec, how many demerit points are assigned for failing to stop at
    the request of a peace officer?
  choices:
    A: 4 points
    B: 7 points
    C: 9 points
    D: 12 points
  answer: D
  explanation: Under the Highway Safety Code, failing to stop when signaled to do
    so by a peace officer is a serious offense that results in 12 demerit points.
- id: 22
  category: license_system
  question: What is the minimum visual acuity required (with or without corrective
    lenses) to hold a Class 5 driver's license in Quebec?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: The SAAQ requires that a driver have a visual acuity of at least 20/40
    (Snellen) in both eyes together, with or without correction, to qualify for a
    Class 5 license.
- id: 23
  category: license_system
  question: If a driver's license is suspended for the first time due to accumulating
    too many demerit points, how long is the suspension period?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 12 months
  answer: B
  explanation: For a first-time accumulation of the maximum allowed demerit points,
    the SAAQ suspends the driver's license for a period of 3 months.
- id: 24
  category: license_system
  question: When applying for a first learner's license in Quebec, which of the following
    is an acceptable primary document to prove identity?
  choices:
    A: A student ID card
    B: A Canadian birth certificate
    C: A utility bill
    D: A credit card
  answer: B
  explanation: The SAAQ requires original documents for identification. A Canadian
    birth certificate or a valid Canadian passport are considered primary identity
    documents.
- id: 25
  category: license_system
  question: In Quebec, if you develop a medical condition that could affect your ability
    to drive, when must you notify the SAAQ?
  choices:
    A: Within 30 days
    B: At the time of your license renewal
    C: Immediately
    D: Only if you are involved in an accident
  answer: C
  explanation: Drivers are legally obligated to notify the SAAQ immediately of any
    change in their state of health that could interfere with the safe operation of
    a vehicle.
- id: 26
  category: license_system
  question: How often must a Quebec driver have their photo retaken for their driver's
    license?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 4 years
    D: Every 8 years
  answer: D
  explanation: While driver's license fees must be paid annually, the physical photo
    on the license is generally valid for 8 years, at which point a new photo must
    be taken.
- id: 27
  category: license_system
  question: A tourist visiting Quebec from another country is permitted to drive with
    their valid foreign license for a maximum of how many months?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: The duration of their visa
  answer: B
  explanation: Non-residents are allowed to drive in Quebec for a period of 6 consecutive
    months using their valid foreign driver's license.
- id: 28
  category: license_system
  question: What is the penalty for speeding in a designated construction zone in
    Quebec?
  choices:
    A: The fine is tripled
    B: The fine is doubled
    C: The demerit points are tripled
    D: The vehicle is immediately impounded
  answer: B
  explanation: Under Quebec's Highway Safety Code, fines for speeding are doubled
    when the infraction occurs in a construction zone.
- id: 29
  category: license_system
  question: 'A Class 5 license in Quebec permits the holder to drive a vehicle with
    a net weight not exceeding:'
  choices:
    A: 3,000 kg
    B: 4,500 kg
    C: 5,500 kg
    D: 7,000 kg
  answer: B
  explanation: A Class 5 license is for passenger vehicles and trucks with a net weight
    of less than 4,500 kg.
- id: 30
  category: driver_testing
  question: If you fail the vision test conducted by the SAAQ, what is the next required
    step to continue your application?
  choices:
    A: Wait 28 days and retake the SAAQ vision test
    B: Consult an eye care professional and provide a report to the SAAQ
    C: Apply for a restricted license that only allows daytime driving
    D: Pay a vision waiver fee to proceed to the knowledge test
  answer: B
  explanation: If an applicant fails the SAAQ vision screening, they must consult
    an optometrist or ophthalmologist at their own expense and submit a report (Vision
    Report) to the SAAQ for evaluation.
- id: 31
  category: driver_testing
  question: The SAAQ knowledge test for a Class 5 license is divided into three sections.
    Which of the following is NOT one of those sections?
  choices:
    A: The Highway Safety Code
    B: Road Signs and Traffic Signals
    C: Vehicle Maintenance and Mechanics
    D: Specialization Class 5 (Passenger Vehicle)
  answer: C
  explanation: 'The Quebec knowledge test consists of three parts: Highway Safety
    Code, Road Signs and Traffic Signals, and Specialization Class 5. Vehicle mechanics
    is not a standalone section of the test.'
- id: 32
  category: driver_testing
  question: If you fail the SAAQ road test for a Class 5 license, how many days must
    you wait before you are eligible to attempt the test again?
  choices:
    A: 7 days
    B: 14 days
    C: 28 days
    D: 56 days
  answer: C
  explanation: In Quebec, if you fail the road test, there is a mandatory waiting
    period of 28 days before you can retake it.
- id: 33
  category: driver_testing
  question: Who is responsible for providing the vehicle used during the SAAQ road
    test?
  choices:
    A: The SAAQ provides a standardized vehicle for all applicants
    B: The applicant must provide a vehicle in good working order
    C: The driving school must provide the vehicle for their students
    D: The SAAQ provides a vehicle only if the applicant pays a rental fee
  answer: B
  explanation: The applicant is responsible for providing a vehicle for the road test.
    The vehicle must be safe, in good working order, and have a valid registration
    and insurance certificate.
- id: 34
  category: driver_testing
  question: To avoid a cancellation fee, how much notice must you give the SAAQ if
    you need to cancel or postpone your road test appointment?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 1 week
  answer: B
  explanation: The SAAQ requires at least 48 hours' notice to cancel or postpone a
    road test; otherwise, a cancellation fee will be charged.
- id: 35
  category: driver_testing
  question: If you are required to wear corrective lenses while driving, which condition
    code will be printed on your Quebec driver's license?
  choices:
    A: Condition A
    B: Condition B
    C: Condition W
    D: Condition X
  answer: A
  explanation: In Quebec, 'Condition A' on a driver's license indicates that the holder
    must wear corrective lenses (glasses or contact lenses) while operating a vehicle.
- id: 36
  category: driver_testing
  question: During the SAAQ road test, which of the following actions will result
    in an immediate failure?
  choices:
    A: Stalling the engine once
    B: The examiner having to intervene (e.g., using the dual-brake or steering)
    C: Failing to use a turn signal during a lane change
    D: Touching the curb while parallel parking
  answer: B
  explanation: Any intervention by the examiner to prevent an accident or a violation
    of the Highway Safety Code results in an immediate failure of the road test.
- id: 37
  category: driver_testing
  question: When applying for your first learner's license in Quebec, how many pieces
    of identification are generally required?
  choices:
    A: One piece of photo ID
    B: Two pieces of original identification
    C: Three pieces of identification
    D: Only a birth certificate is required
  answer: B
  explanation: Applicants must provide two original pieces of identification, such
    as a birth certificate and a health insurance card (RAMQ), to apply for their
    first license.
- id: 38
  category: driver_testing
  question: If taking a road test in Quebec between December 1 and March 15, what
    specific vehicle requirement must be met?
  choices:
    A: The vehicle must have an engine block heater
    B: The vehicle must be equipped with winter tires
    C: The vehicle must have all-wheel drive
    D: The vehicle must have a full tank of windshield washer fluid
  answer: B
  explanation: Quebec law mandates that all passenger vehicles must be equipped with
    winter tires from December 1 to March 15. This applies to vehicles used for SAAQ
    road tests.
- id: 39
  category: driver_testing
  question: How many days do you have to notify the SAAQ if you develop a medical
    condition that could affect your ability to drive safely?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Under the Highway Safety Code, you must notify the SAAQ within 30 days
    of any change in your health that could affect your ability to drive.
- id: 40
  category: driver_testing
  question: What is the minimum passing score for the 'Road Signs and Traffic Signals'
    section of the SAAQ knowledge test?
  choices:
    A: 75%
    B: 80%
    C: 81% (13 out of 16 questions)
    D: 100%
  answer: C
  explanation: To pass the Road Signs and Traffic Signals section of the SAAQ knowledge
    test, you must correctly answer at least 13 out of 16 questions (approximately
    81%).
- id: 41
  category: driver_testing
  question: Which of the following payment methods is generally NOT accepted at SAAQ
    service outlets for license fees?
  choices:
    A: Debit card
    B: Cash
    C: Credit card
    D: Cheque
  answer: C
  explanation: SAAQ service outlets typically do not accept credit cards for the payment
    of driver's license or vehicle registration fees. They accept debit, cash, or
    cheques.
- id: 42
  category: driver_testing
  question: Before the road test begins, the examiner will perform a vehicle safety
    check. If the brake lights are not functioning, what happens?
  choices:
    A: The test proceeds but with a 10-point penalty
    B: The examiner will fix the light for you
    C: The test is refused and must be rescheduled
    D: The applicant is allowed to use hand signals instead
  answer: C
  explanation: If the vehicle provided for the road test is found to be non-compliant
    with safety standards (such as broken lights), the SAAQ will refuse to conduct
    the test, and the applicant must reschedule.
- id: 43
  category: driver_testing
  question: To pass the SAAQ vision test for a Class 5 license, what is the minimum
    required visual acuity with both eyes open (with or without corrective lenses)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: In Quebec, the minimum visual acuity required to hold a Class 5 driver's
    license is 20/40 (6/12) with both eyes open and examined together.
- id: 44
  category: driver_testing
  question: 'While a learner''s license holder is driving, the accompanying rider
    must not have a blood alcohol concentration (BAC) equal to or greater than:'
  choices:
    A: '0.00'
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: C
  explanation: In Quebec, an accompanying rider must have held a valid license for
    2 years and must have a BAC of less than 0.05 (50 mg of alcohol per 100 ml of
    blood).
- id: 45
  category: driver_testing
  question: In Quebec, between which dates is it mandatory for all passenger vehicles
    to be equipped with winter tires?
  choices:
    A: November 1 to April 1
    B: December 1 to March 15
    C: December 15 to March 15
    D: November 15 to April 15
  answer: B
  explanation: Under the Highway Safety Code, winter tires are mandatory for all motorized
    road vehicles registered in Quebec from December 1 to March 15 inclusive.
- id: 46
  category: driver_testing
  question: How many demerit points are added to your record for failing to comply
    with Quebec's 'Move Over' law when an emergency vehicle is stopped with its lights
    flashing?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 9 points
  answer: C
  explanation: Failing to comply with the Move Over law (slowing down and changing
    lanes when safe to do so) results in 4 demerit points and a fine.
- id: 47
  category: driver_testing
  question: In Quebec, for how long do demerit points remain on your driving record
    from the date of conviction?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: Demerit points remain on your Quebec driving record for 2 years following
    the date of conviction or the date the fine was paid.
- id: 48
  category: driver_testing
  question: In Quebec, your driver's license must be renewed every year. When is the
    typical deadline for renewal?
  choices:
    A: January 1st
    B: The anniversary of the date you first got your license
    C: On your birthday
    D: December 31st
  answer: C
  explanation: In Quebec, the SAAQ requires you to pay for and renew your driver's
    license every year, usually by your birthday.
- id: 49
  category: driver_testing
  question: What is the passing score for each of the three sections of the SAAQ Class
    5 knowledge test?
  choices:
    A: 60%
    B: 70%
    C: 75%
    D: 80%
  answer: C
  explanation: 'To pass the knowledge test, you must obtain a score of at least 75%
    in each of the three sections: Highway Safety Code, Road Signs and Signals, and
    Specialization Class 5.'
- id: 50
  category: driver_testing
  question: In Quebec, what is the penalty for being caught using or possessing a
    radar detector?
  choices:
    A: A verbal warning only
    B: 2 demerit points and a small fine
    C: A heavy fine and confiscation of the device
    D: Immediate license suspension for 3 months
  answer: C
  explanation: Possessing or using a radar detector is illegal in Quebec. Penalties
    include heavy fines (often $500+) and the immediate seizure of the device.
- id: 51
  category: driver_testing
  question: According to the Quebec Highway Safety Code, at what distance must you
    switch from high beams to low beams when approaching an oncoming vehicle?
  choices:
    A: 50 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: C
  explanation: Drivers in Quebec must switch to low beams when they are within 150
    metres of an oncoming vehicle or when following another vehicle.
- id: 52
  category: driver_testing
  question: In Quebec, what is the minimum legal parking distance required from a
    fire hydrant?
  choices:
    A: 1.5 metres
    B: 3 metres
    C: 5 metres
    D: 10 metres
  answer: B
  explanation: The Highway Safety Code prohibits parking a vehicle within 3 metres
    of a fire hydrant.
- id: 53
  category: driver_testing
  question: In Quebec, a child must be secured in a booster seat until they reach
    what height OR age?
  choices:
    A: 135 cm or 7 years old
    B: 145 cm or 9 years old
    C: 150 cm or 10 years old
    D: 120 cm or 8 years old
  answer: B
  explanation: Quebec law requires children to use a booster seat until they are 145
    cm tall or 9 years old.
- id: 54
  category: driver_responsibility
  question: In Quebec, what is the minimum amount of civil liability insurance coverage
    required by law for all vehicle owners?
  choices:
    A: $25,000
    B: $50,000
    C: $100,000
    D: $200,000
  answer: B
  explanation: Under the Automobile Insurance Act, every vehicle owner in Quebec must
    hold a civil liability insurance policy of at least $50,000 to cover property
    damage caused to others.
- id: 55
  category: driver_responsibility
  question: If you are involved in a traffic accident in Quebec that results in a
    bodily injury, what is your immediate legal obligation?
  choices:
    A: Fill out a Joint Report and mail it to the SAAQ within 48 hours.
    B: Exchange insurance information and leave the scene.
    C: Contact the police immediately.
    D: Wait 24 hours to see if the injury persists before reporting.
  answer: C
  explanation: In Quebec, any accident involving a bodily injury must be reported
    to the police immediately. The police will then complete an accident report.
- id: 56
  category: driver_responsibility
  question: When should a 'Joint Report' (Constat amiable) be used following a vehicle
    collision in Quebec?
  choices:
    A: Only when someone is seriously injured.
    B: When there is property damage only and no injuries.
    C: Only if the police refuse to come to the scene.
    D: When the damage to both vehicles exceeds $2,000.
  answer: B
  explanation: The Joint Report is used when a collision results in property damage
    only. It allows drivers to identify themselves and describe the accident so that
    insurance companies can settle claims faster without police intervention.
- id: 57
  category: driver_responsibility
  question: What is the potential fine for a driver in Quebec caught operating a vehicle
    without valid civil liability insurance?
  choices:
    A: $100 to $200
    B: $325 to $2,800
    C: $5,000 to $10,000
    D: Exactly $500
  answer: B
  explanation: Driving without civil liability insurance is a serious offense in Quebec,
    punishable by a fine ranging from $325 to $2,800, and can lead to the immediate
    suspension of the driver's license.
- id: 58
  category: driver_responsibility
  question: Where must the vehicle's registration certificate be kept while the vehicle
    is being operated on Quebec roads?
  choices:
    A: In a safe at the owner's residence.
    B: In the vehicle or on the person driving it.
    C: Attached to the rear license plate.
    D: It must be filed with the local police station.
  answer: B
  explanation: According to the Highway Safety Code, the driver must have the vehicle's
    registration certificate and proof of insurance in the vehicle or on their person
    to present to a peace officer upon request.
- id: 59
  category: driver_responsibility
  question: When selling a used vehicle to another individual in Quebec, who is responsible
    for notifying the SAAQ to transfer the registration?
  choices:
    A: Only the buyer.
    B: Only the seller.
    C: Both the buyer and the seller must ensure the transfer is completed.
    D: The seller's insurance company.
  answer: C
  explanation: Both parties must go to an SAAQ outlet or use the online services to
    transfer the registration. The seller remains legally responsible for the vehicle
    until the SAAQ records the transfer.
- id: 60
  category: driver_responsibility
  question: A vehicle registered outside of Quebec that is being moved into the province
    must undergo what before it can be registered with the SAAQ?
  choices:
    A: A paint color verification.
    B: A mandatory mechanical inspection at an authorized center.
    C: A 48-hour quarantine period.
    D: No inspection is required if it is from another Canadian province.
  answer: B
  explanation: Most vehicles coming from outside Quebec must pass a mechanical inspection
    at a center authorized by the SAAQ to ensure they meet Quebec safety standards
    before they can be registered.
- id: 61
  category: driver_responsibility
  question: How many demerit points are added to a driver's record for 'hit and run'
    (failing to remain at the scene of an accident or return to it) in Quebec?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 9 points
  answer: D
  explanation: Failing to fulfill the obligations at the scene of an accident (hit
    and run) results in 9 demerit points being added to the driver's record in Quebec.
- id: 62
  category: driver_responsibility
  question: Under Quebec's 'no-fault' insurance system, what does the SAAQ public
    insurance plan cover?
  choices:
    A: Damage to your vehicle in a collision.
    B: Theft of personal items from the vehicle.
    C: Bodily injury resulting from a traffic accident.
    D: Vandalism to the vehicle's exterior.
  answer: C
  explanation: The SAAQ public insurance plan covers all Quebecers for bodily injury
    sustained in a traffic accident, regardless of who is at fault. Property damage
    is covered by private insurance.
- id: 63
  category: driver_responsibility
  question: What is a direct consequence of failing to pay a traffic fine in Quebec
    by the specified deadline?
  choices:
    A: The fine is automatically cancelled after 90 days.
    B: The driver's license is suspended until the fine and costs are paid.
    C: The driver must retake the vision test.
    D: The vehicle's color must be changed.
  answer: B
  explanation: If a fine is not paid, the SAAQ will suspend the driver's license or
    the right to obtain one. The suspension remains in effect until the fine, including
    interest and costs, is paid in full.
- id: 64
  category: driver_responsibility
  question: If a vehicle is seized and impounded because the driver's license was
    suspended, how long is the standard impoundment period for a first offense?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: C
  explanation: In Quebec, if you drive with a suspended or revoked license, the vehicle
    you are driving is immediately seized and impounded for a period of 30 days at
    the owner's expense.
- id: 65
  category: driver_responsibility
  question: What is the penalty for providing false information to the SAAQ regarding
    vehicle registration or driver licensing?
  choices:
    A: A verbal warning only.
    B: A fine ranging from $300 to $600.
    C: There is no penalty if the information is corrected within a year.
    D: Mandatory community service.
  answer: B
  explanation: Providing false or misleading information to the SAAQ is an offense
    under the Highway Safety Code and is subject to a fine, usually between $300 and
    $600.
- id: 66
  category: driver_responsibility
  question: According to the Highway Safety Code, which of the following is true regarding
    the visibility of a vehicle's license plate?
  choices:
    A: It can be covered with a tinted plastic protector.
    B: It must be kept free of any object or matter that hinders its visibility.
    C: It only needs to be visible during daylight hours.
    D: It can be placed inside the rear window if it is visible.
  answer: B
  explanation: The license plate must be securely attached to the rear of the vehicle
    and must be kept free of any object or substance (snow, mud, etc.) that could
    obstruct its reading.
- id: 67
  category: driver_responsibility
  question: 'In Quebec, you are legally required to report a collision with an animal
    to the police if the animal weighs more than:'
  choices:
    A: 5 kg
    B: 10 kg
    C: 25 kg
    D: 50 kg
  answer: C
  explanation: Under the Highway Safety Code, a driver who hits an animal weighing
    more than 25 kg must report the accident to a police officer.
- id: 68
  category: driver_responsibility
  question: If you are involved in a collision where there are no injuries and only
    property damage, what document should you complete with the other driver?
  choices:
    A: A police report
    B: A SAAQ claim form
    C: A Joint Report (Constat amiable)
    D: A witness statement
  answer: C
  explanation: In Quebec, for accidents involving only property damage and no injuries,
    drivers should use the Joint Report to identify themselves and describe the accident
    for their respective insurers.
- id: 69
  category: driver_responsibility
  question: Under what circumstance is it mandatory to call the police to the scene
    of a traffic accident in Quebec?
  choices:
    A: Whenever the damage exceeds $1,000
    B: Only if one of the drivers is from outside Quebec
    C: If there are injuries or a death
    D: Only if three or more vehicles are involved
  answer: C
  explanation: According to the Highway Safety Code, the police must be contacted
    immediately if an accident results in injury or death.
- id: 70
  category: driver_responsibility
  question: In Quebec's 'no-fault' insurance system, who is responsible for paying
    compensation for bodily injury resulting from a motor vehicle accident?
  choices:
    A: The driver at fault's private insurance
    B: The victim's private insurance
    C: The Société de l'assurance automobile du Québec (SAAQ)
    D: The Ministry of Transport
  answer: C
  explanation: Quebec's public automobile insurance plan, administered by the SAAQ,
    compensates all Quebecers for bodily injury sustained in an accident, regardless
    of who is at fault.
- id: 71
  category: driver_responsibility
  question: If you hit an unoccupied parked vehicle or a fixed object and the owner
    cannot be located, what must you do according to Quebec law?
  choices:
    A: Leave a note and wait 48 hours before calling the police
    B: Contact the nearest police station without delay
    C: Nothing, as long as the damage is under $500
    D: Only notify your insurance company the next business day
  answer: B
  explanation: If you cannot find the owner of a damaged vehicle or property, you
    must contact the nearest police station immediately to report the accident.
- id: 72
  category: driver_responsibility
  question: If a vehicle has been stored or unused for more than 12 months, what is
    required before it can be registered and put back on the road in Quebec?
  choices:
    A: A simple oil change
    B: A mandatory mechanical inspection by an authorized center
    C: Payment of a double registration fee
    D: A new driver's knowledge test
  answer: B
  explanation: Vehicles that have been off the road for more than 12 months must pass
    a mechanical inspection at a SAAQ-authorized center before they can be registered
    again.
- id: 73
  category: driver_responsibility
  question: In Quebec, what happens to your driver's license if you fail to pay a
    traffic fine by the prescribed deadline?
  choices:
    A: Your license is suspended until the fine and costs are paid
    B: You are assessed 2 extra demerit points
    C: Your insurance premium is automatically doubled
    D: Nothing happens until your license renewal date
  answer: A
  explanation: The SAAQ will suspend the driver's license of any person who fails
    to pay a fine for an offense under the Highway Safety Code until the debt is fully
    settled.
- id: 74
  category: driver_responsibility
  question: What is the immediate roadside license suspension period for a driver
    who refuses to provide a breath sample to a peace officer in Quebec?
  choices:
    A: 24 hours
    B: 30 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Refusing to provide a breath or fluid sample results in an immediate
    90-day roadside license suspension, the same penalty as having a BAC over 80 mg
    per 100 ml.
- id: 75
  category: driver_responsibility
  question: In Quebec, a vehicle's registration certificate must be kept where?
  choices:
    A: At the owner's residence
    B: In the vehicle or on the person driving it
    C: In the owner's safe deposit box
    D: With the insurance broker
  answer: B
  explanation: The Highway Safety Code requires that the driver of a vehicle carry
    the registration certificate (or a copy) and be able to produce it when requested
    by a peace officer.
- id: 76
  category: driver_responsibility
  question: Which of the following is true regarding license plates in Quebec?
  choices:
    A: You can use a tinted plastic cover to protect the plate
    B: The plate must be free of any object or matter that obstructs its reading
    C: You only need a rear plate if the vehicle is older than 10 years
    D: Plates are issued for the front and back of all passenger vehicles
  answer: B
  explanation: Quebec law prohibits any object or substance (like dirt, snow, or tinted
    covers) from obstructing the visibility and readability of a license plate.
- id: 77
  category: driver_responsibility
  question: If you are involved in an accident with a wild animal, what is the reporting
    requirement if the animal weighs more than 25 kg?
  choices:
    A: No report is necessary
    B: You must report the accident to a peace officer
    C: You must take the animal to a vet
    D: You only need to tell your insurance company
  answer: B
  explanation: In Quebec, you must report an accident with a wild animal to a peace
    officer if the animal weighs more than 25 kg (e.g., deer, moose, bear).
- id: 78
  category: driver_responsibility
  question: What is the consequence for a driver who is caught driving while their
    license is suspended for unpaid fines?
  choices:
    A: A verbal warning
    B: A fine of $30 to $60
    C: Immediate seizure of the vehicle for 30 days at the owner's expense
    D: The vehicle is permanently forfeited to the Crown
  answer: C
  explanation: Driving with a suspended license (including for unpaid fines) results
    in the immediate seizure and impoundment of the vehicle for a period of 30 days.
- id: 79
  category: safe_driving_rules
  question: In which of the following locations is turning right on a red light strictly
    prohibited at all times in Quebec?
  choices:
    A: In school zones
    B: On the Island of Montreal
    C: In construction zones
    '&D': In the city of Quebec (Quebec City)
  answer: B
  explanation: While turning right on red is permitted in most of Quebec where not
    prohibited by a sign, it remains strictly forbidden everywhere on the Island of
    Montreal.
- id: 80
  category: safe_driving_rules
  question: When approaching an emergency vehicle or tow truck stopped on the shoulder
    with its yellow or blue lights flashing, what does Quebec's 'Move-Over' law require
    you to do?
  choices:
    A: Maintain speed but move to the left lane
    B: Stop immediately behind the vehicle
    C: Slow down and change lanes if it is safe to do so
    D: Honk to warn the workers of your presence
  answer: C
  explanation: Quebec's move-over law requires drivers to create a 'safety buffer'
    by slowing down and, if safe, moving into another lane to protect emergency responders
    and roadside workers.
- id: 81
  category: safe_driving_rules
  question: When passing a cyclist on a road where the speed limit is 50 km/h or less,
    what is the minimum distance you must maintain between your vehicle and the cyclist?
  choices:
    A: 0.5 meters
    B: 1 meter
    C: 1.5 meters
    D: 2 meters
  answer: B
  explanation: In Quebec, drivers must maintain a distance of 1 meter when passing
    a cyclist in zones of 50 km/h or less, and 1.5 meters in zones where the speed
    limit is over 50 km/h.
- id: 82
  category: safe_driving_rules
  question: In Quebec, what is the minimum distance you must leave between your vehicle
    and a fire hydrant when parking?
  choices:
    A: 1.5 meters
    B: 3 meters
    C: 5 meters
    D: 10 meters
  answer: B
  explanation: It is prohibited to park or stop a vehicle within 3 meters of a fire
    hydrant.
- id: 83
  category: safe_driving_rules
  question: When a school bus has its red lights flashing and stop arm extended, how
    many meters away must you stop your vehicle?
  choices:
    A: At least 2 meters
    B: At least 5 meters
    C: At least 10 meters
    D: At least 20 meters
  answer: B
  explanation: Drivers must stop at least 5 meters from a school bus when its red
    lights are flashing or its stop signal is extended, unless they are on a separate
    roadway divided by a median.
- id: 84
  category: safe_driving_rules
  question: What does a flashing green light at an intersection mean in Quebec?
  choices:
    A: You must yield to oncoming traffic before turning left
    B: The light is about to turn red
    C: You have the right of way to go straight or turn left
    D: Pedestrians have the right of way in all directions
  answer: C
  explanation: A flashing green light (or a green arrow) indicates a protected turn,
    meaning you have the right of way to go straight, turn left, or turn right. Oncoming
    traffic faces a red light.
- id: 85
  category: safe_driving_rules
  question: When entering a roundabout in Quebec, who has the right of way?
  choices:
    A: The vehicle entering the roundabout
    B: The vehicle already in the roundabout
    C: The vehicle approaching from the right
    D: The fastest-moving vehicle
  answer: B
  explanation: Drivers entering a roundabout must yield the right of way to traffic
    already circulating in the circle.
- id: 86
  category: safe_driving_rules
  question: On a Quebec highway with a speed limit of 70 km/h or more, what is the
    primary purpose of the left lane?
  choices:
    A: For driving at the maximum speed limit
    B: For carpooling vehicles only
    C: For passing other vehicles only
    D: For heavy trucks and trailers
  answer: C
  explanation: On roads where the speed limit is 70 km/h or higher, the left lane
    must be used only for passing or when preparing for a left turn.
- id: 87
  category: safe_driving_rules
  question: When approaching a pedestrian crosswalk, when must a driver stop for a
    pedestrian?
  choices:
    A: Only if the pedestrian is already in the middle of the road
    B: Only if there is a stop sign
    C: As soon as the pedestrian manifests their intention to cross
    D: Only if the pedestrian is elderly or disabled
  answer: C
  explanation: Drivers must stop for a pedestrian as soon as the pedestrian enters
    the crosswalk or clearly indicates their intention to cross (e.g., by stepping
    toward the road or making eye contact).
- id: 88
  category: safe_driving_rules
  question: In Quebec, a U-turn is prohibited in which of the following situations?
  choices:
    A: On a curve where visibility is less than 150 meters
    B: On any road with a speed limit over 50 km/h
    C: At any intersection with traffic lights
    D: Only where a 'No U-Turn' sign is posted
  answer: A
  explanation: U-turns are prohibited where a sign forbids it, on a curve, or near
    the crest of a hill where visibility is less than 150 meters in both directions.
- id: 89
  category: safe_driving_rules
  question: In a zone where the speed limit is 50 km/h, what speed is considered 'excessive
    speeding' (grand excès de vitesse) in Quebec?
  choices:
    A: 70 km/h or more
    B: 80 km/h or more
    C: 90 km/h or more
    D: 100 km/h or more
  answer: C
  explanation: In a zone of 60 km/h or less, driving 40 km/h or more over the limit
    (e.g., 90 km/h in a 50 km/h zone) is classified as excessive speeding, leading
    to immediate license suspension and higher fines.
- id: 90
  category: safe_driving_rules
  question: In Quebec, where is it strictly prohibited to turn right on a red light,
    even if there is no sign indicating otherwise?
  choices:
    A: In school zones
    B: On the Island of Montreal
    C: In the city of Quebec (Old Quebec)
    D: In construction zones
  answer: B
  explanation: According to the Highway Safety Code, right turns on red are permitted
    across the province of Quebec except on the Island of Montreal and where prohibited
    by a sign.
- id: 91
  category: safe_driving_rules
  question: When approaching a school bus with its flashing red lights in operation,
    at what minimum distance must you stop your vehicle?
  choices:
    A: 3 metres
    B: 5 metres
    C: 10 metres
    D: 20 metres
  answer: B
  explanation: Drivers must stop their vehicle at least 5 metres from a school bus
    when its red lights are flashing or its stop arm is extended.
- id: 92
  category: safe_driving_rules
  question: Quebec's 'Move Over' law requires drivers to change lanes or slow down
    when approaching which type of vehicle stopped with its lights flashing?
  choices:
    A: Only police cars and ambulances
    B: Only tow trucks
    C: Only road maintenance vehicles
    D: Any emergency vehicle, tow truck, or surveillance vehicle with activated lights
  answer: D
  explanation: The Move Over law applies to emergency vehicles (police, fire, ambulance),
    tow trucks, and highway surveillance vehicles with flashing or rotating lights.
- id: 93
  category: safe_driving_rules
  question: When parking a vehicle on a steep hill facing uphill with a curb, how
    should the front wheels be positioned?
  choices:
    A: Turned toward the curb (right)
    B: Turned away from the curb (left)
    C: Parallel to the curb (straight)
    D: It does not matter as long as the handbrake is on
  answer: B
  explanation: When parking uphill with a curb, you should turn the wheels to the
    left (away from the curb) so that if the vehicle rolls, the back of the tire will
    hit the curb and stop the car.
- id: 94
  category: safe_driving_rules
  question: At what distance must you dim your high-beam headlights when following
    another vehicle from behind in Quebec?
  choices:
    A: 50 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: C
  explanation: Drivers must switch to low-beam headlights when they are within 150
    metres of the vehicle they are following or an oncoming vehicle.
- id: 95
  category: safe_driving_rules
  question: In Quebec, what is the minimum distance you must maintain when stopping
    at a railway crossing when the signals are flashing?
  choices:
    A: 3 metres
    B: 5 metres
    C: 10 metres
    D: 15 metres
  answer: B
  explanation: Drivers must stop at least 5 metres from the nearest rail of a railway
    crossing when the warning signals are active.
- id: 96
  category: safe_driving_rules
  question: When two vehicles reach an intersection with stop signs in all directions
    at the same time, which driver has the right of way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver on the busier street
    D: The driver going straight
  answer: B
  explanation: If two vehicles arrive at an all-way stop at the same time, the driver
    on the left must yield the right of way to the driver on the right.
- id: 97
  category: safe_driving_rules
  question: In Quebec, are you allowed to cross a solid single white line to pass
    another vehicle?
  choices:
    A: Yes, if the way is clear
    B: No, it is strictly prohibited
    C: Only to pass a farm tractor or a slow-moving vehicle with a warning triangle
    D: Only during daylight hours
  answer: C
  explanation: Generally, crossing a solid line is prohibited, but the Highway Safety
    Code allows crossing a solid line to pass a farm tractor, a horse-drawn vehicle,
    or a slow-moving vehicle (with the orange triangle) provided it can be done safely.
- id: 98
  category: safe_driving_rules
  question: What is the default speed limit on a gravel road in Quebec unless otherwise
    posted?
  choices:
    A: 50 km/h
    B: 60 km/h
    C: 70 km/h
    D: 80 km/h
  answer: C
  explanation: In Quebec, the default speed limit on a gravel road (unpaved road)
    is 70 km/h unless signs indicate otherwise.
- id: 99
  category: defensive_driving
  question: Under normal driving conditions in Quebec, what is the minimum recommended
    following distance behind the vehicle in front of you?
  choices:
    A: One car length
    B: Two seconds
    C: Three seconds
    D: Four seconds
    E: null
  answer: B
  explanation: The SAAQ recommends maintaining a minimum following distance of at
    least two seconds in good weather and road conditions to allow for adequate reaction
    time.
- id: 100
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet Quebec highway, what is
    the correct defensive driving action to take?
  choices:
    A: Brake hard to regain traction
    B: Accelerate slightly to push through the water
    C: Shift the car into neutral immediately
    D: Ease off the accelerator and keep the steering wheel straight
  answer: D
  explanation: To recover from hydroplaning, you should gradually reduce speed by
    taking your foot off the gas pedal and avoid sudden steering or braking movements
    until traction is restored.
- id: 101
  category: defensive_driving
  question: Quebec's 'Move Over' law (corridor de sécurité) requires drivers to slow
    down and, if safe, change lanes when approaching which of the following?
  choices:
    A: Only police cars with flashing lights
    B: Any vehicle stopped with its hazard lights flashing
    C: Emergency vehicles, tow trucks, or surveillance vehicles with activated lights
    D: Any vehicle parked on the shoulder
  answer: C
  explanation: The 'Move Over' law applies when an emergency vehicle, tow truck, or
    road surveillance vehicle is stopped and its rotating or flashing lights are activated.
- id: 102
  category: defensive_driving
  question: In urban areas, defensive driving principles suggest you should scan the
    road ahead by at least how many seconds?
  choices:
    A: 2 to 5 seconds
    B: 5 to 8 seconds
    C: 10 to 12 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: The SAAQ recommends scanning 10 to 12 seconds ahead in the city to
    anticipate potential hazards like pedestrians, cyclists, or changing lights.
- id: 103
  category: defensive_driving
  question: According to the Quebec Highway Safety Code, what is the potential fine
    for driving a vehicle covered in snow or ice that may detach and pose a danger?
  choices:
    A: $30 to $60
    B: $60 to $100
    C: $200 to $300
    D: $500 to $1,000
  answer: B
  explanation: Article 498 states that a driver must ensure the vehicle is free of
    any material (snow, ice, etc.) that could detach. Failure to do so can result
    in a fine of $60 to $100.
- id: 104
  category: defensive_driving
  question: When driving a vehicle equipped with an Anti-lock Braking System (ABS)
    in an emergency situation on a slippery road, how should you apply the brakes?
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, continuous pressure to the brake pedal
    C: Apply light pressure to avoid locking the wheels
    D: Use the emergency brake instead
  answer: B
  explanation: With ABS, you should press the brake pedal firmly and hold it down.
    The system will automatically pump the brakes to prevent wheel lock-up while allowing
    you to steer.
- id: 105
  category: defensive_driving
  question: In heavy fog in Quebec, which lights should you use to maintain the best
    visibility and safety?
  choices:
    A: High beams
    B: Parking lights only
    C: Low beams
    D: Hazard lights
  answer: C
  explanation: Low beams should be used in fog. High beams reflect off the water droplets
    in the fog, creating glare and making it harder for you to see.
- id: 106
  category: defensive_driving
  question: When performing a lane change, what is the correct sequence for checking
    your surroundings according to Quebec's defensive driving standards?
  choices:
    A: Signal, check mirrors, and move
    B: Check mirrors, signal, and move
    C: Check mirrors, signal, check blind spot, and move
    D: Signal, check blind spot, and move
  answer: C
  explanation: The safe procedure is to check your mirrors first, activate your turn
    signal, perform a shoulder check (blind spot), and then proceed with the maneuver
    if clear.
- id: 107
  category: defensive_driving
  question: When driving in heavy rain or on snow-covered roads in Quebec, how should
    you adjust your following distance?
  choices:
    A: Keep it at 2 seconds
    B: Increase it to at least 4 seconds
    C: Decrease it to 1 second to stay in the tracks of the car ahead
    D: Following distance does not need to change if you have winter tires
  answer: B
  explanation: In adverse conditions like rain, snow, or ice, the SAAQ recommends
    doubling the following distance to at least 4 seconds to account for increased
    braking distances.
- id: 108
  category: defensive_driving
  question: If you feel drowsy while driving on a long trip in Quebec, what is the
    only effective way to combat fatigue according to the SAAQ?
  choices:
    A: Opening the window for fresh air
    B: Turning up the volume on the radio
    C: Drinking coffee or energy drinks
    D: Stopping for a short nap or switching drivers
  answer: D
  explanation: The SAAQ emphasizes that tricks like coffee or fresh air are temporary
    and ineffective; sleep is the only real cure for fatigue.
- id: 109
  category: defensive_driving
  question: If the rear of your vehicle begins to skid to the right on an icy road,
    what should you do?
  choices:
    A: Turn the steering wheel to the left
    B: Turn the steering wheel to the right
    C: Brake hard immediately
    D: Accelerate to straighten the vehicle
  answer: B
  explanation: In a skid, you should always steer in the direction you want the front
    of the vehicle to go, which is the same direction the rear of the vehicle is skidding.
- id: 110
  category: defensive_driving
  question: To practice 'eco-driving' and maintain safety, the SAAQ recommends avoiding
    idling your engine for more than how many seconds?
  choices:
    A: 10 seconds
    B: 60 seconds
    C: 3 minutes
    D: 5 minutes
  answer: B
  explanation: The SAAQ and environmental guidelines suggest that if you are stopped
    for more than 60 seconds (except in traffic), you should turn off your engine
    to save fuel and reduce emissions.
- id: 111
  category: defensive_driving
  question: According to the SAAQ, what is the minimum recommended following distance
    behind another vehicle under ideal driving conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 5 meters
    E: null
  answer: B
  explanation: The SAAQ recommends a minimum following distance of at least 2 seconds
    under ideal conditions to allow enough time to react to sudden changes.
- id: 112
  category: defensive_driving
  question: To maintain a good visual lead time, the SAAQ recommends that drivers
    scan the road how far ahead?
  choices:
    A: 2 to 5 seconds
    B: 5 to 8 seconds
    C: 10 to 12 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: SAAQ defensive driving guidelines suggest looking 10 to 12 seconds
    ahead in the city and even further on highways to anticipate potential hazards.
- id: 113
  category: defensive_driving
  question: Under Quebec's 'Move Over' law, what must you do when approaching a police
    car with its flashing lights activated stopped on the shoulder?
  choices:
    A: Maintain speed but honk to alert the officer
    B: Stop immediately in the middle of the lane
    C: Slow down and, if safe to do so, change lanes to leave a lane of space
    D: Speed up to pass the area as quickly as possible
  answer: C
  explanation: The 'Move Over' law requires drivers to slow down and change lanes
    (if safe) when approaching an emergency vehicle, tow truck, or surveillance vehicle
    with activated lights.
- id: 114
  category: defensive_driving
  question: What is the 'blind spot' check requirement before changing lanes in Quebec?
  choices:
    A: Checking the rearview mirror only
    B: Checking the side mirrors only
    C: Turning your head to look out the side window in the direction of the move
    D: Rlying solely on blind-spot detection sensors
  answer: C
  explanation: A shoulder check (turning your head) is mandatory to see vehicles that
    are not visible in the rearview or side mirrors before any lane change or turn.
- id: 115
  category: defensive_driving
  question: When driving on an icy road in Quebec, how should you apply the brakes
    if your vehicle is NOT equipped with an Anti-lock Braking System (ABS)?
  choices:
    A: Press the pedal hard and hold it
    B: Pump the brake pedal rapidly
    C: Apply the emergency brake
    D: Shift into neutral and do not use the brakes
  answer: B
  explanation: On vehicles without ABS, you should pump the brakes to prevent the
    wheels from locking up and causing a skid. If you have ABS, you should apply firm,
    steady pressure.
- id: 116
  category: defensive_driving
  question: If you are following a large commercial truck on a Quebec highway, why
    should you increase your following distance beyond the standard 2 seconds?
  choices:
    A: To allow the truck driver to see you in their mirrors
    B: Because trucks can stop much faster than cars
    C: To avoid the truck's exhaust fumes
    D: Because trucks are legally required to drive slower
  answer: A
  explanation: Increasing distance behind large vehicles ensures you are not in their
    'no-zone' (blind spot) and allows you to see the road ahead more clearly.
- id: 117
  category: defensive_driving
  question: If an oncoming vehicle at night fails to dim their high beams, where should
    you look to avoid being blinded?
  choices:
    A: Directly at the oncoming headlights
    B: At the center line of the road
    C: Toward the right edge of the pavement
    D: Close your eyes momentarily
  answer: C
  explanation: To avoid glare from oncoming high beams, you should look toward the
    right edge of the road (the white line) to guide your steering while maintaining
    peripheral awareness.
- id: 118
  category: defensive_driving
  question: In Quebec, what is the legal requirement regarding snow and ice on your
    vehicle before driving?
  choices:
    A: Only the windshield must be clear
    B: Only the headlights must be clear
    C: The vehicle must be entirely cleared of snow and ice that could detach
    D: There is no specific law; it is only a recommendation
  answer: C
  explanation: The Highway Safety Code stipulates that a vehicle must be cleared of
    any material (snow, ice) that could detach and pose a danger to other road users.
    Fines can be issued for 'flying snow'.
- id: 119
  category: defensive_driving
  question: When approaching an intersection, what is the correct scanning sequence
    recommended for defensive driving?
  choices:
    A: Left, then right
    B: Right, then left
    C: Left, center, right, and left again
    D: Straight ahead only
  answer: C
  explanation: You should look left first (as that traffic is closest to you), then
    center, then right, and then left again before proceeding to ensure no new hazards
    have appeared.
- id: 120
  category: defensive_driving
  question: In Quebec, what happens to the fines for speeding when the infraction
    occurs in a designated construction zone during work periods?
  choices:
    A: They remain the same
    B: They are doubled
    C: They are tripled
    D: The driver's license is automatically suspended
  answer: B
  explanation: Under the Highway Safety Code, fines for speeding are doubled when
    the offense is committed in a construction zone where workers are present.
- id: 121
  category: alcohol_drugs_health
  question: In Quebec, what is the legal blood alcohol concentration (BAC) limit for
    a driver aged 25 or older holding a full Class 5 license?
  choices:
    A: 0.05 (50 mg of alcohol per 100 ml of blood)
    B: 0.08 (80 mg of alcohol per 100 ml of blood)
    C: 0.10 (100 mg of alcohol per 100 ml of blood)
    D: 0.02 (20 mg of alcohol per 100 ml of blood)
  answer: B
  explanation: For most adult drivers with a full license in Quebec, the legal limit
    is 0.08. However, exceeding this limit or being impaired by any amount of alcohol
    or drugs can lead to criminal charges.
- id: 122
  category: alcohol_drugs_health
  question: Quebec's Highway Safety Code applies a 'zero tolerance' policy regarding
    drugs for which group of drivers?
  choices:
    A: Only learner's license holders
    B: Only drivers under the age of 21
    C: Only commercial truck drivers
    D: All drivers, regardless of age or license type
  answer: D
  explanation: Quebec has a zero-tolerance policy for drugs (including cannabis) for
    all drivers. It is prohibited to drive if there is any detectable presence of
    cannabis or other drugs in your saliva, blood, or other bodily fluids.
- id: 123
  category: alcohol_drugs_health
  question: If a driver is caught with a BAC over 0.08 for the first time, their driver's
    license is immediately suspended at the roadside for how many days?
  choices:
    A: 24 hours
    B: 30 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Under the Highway Safety Code, an immediate 90-day roadside suspension
    is triggered if a driver fails a breathalyzer test (BAC over 0.08) or refuses
    to provide a sample.
- id: 124
  category: alcohol_drugs_health
  question: Under what circumstance will a vehicle be immediately impounded for 30
    days at the roadside in Quebec?
  choices:
    A: If the driver's BAC is over 0.08 but under 0.16
    B: If the driver's BAC is over 0.16 or if they refuse to provide a sample
    C: If the driver is caught speeding by 20 km/h
    D: If the driver's license has been expired for less than a week
  answer: B
  explanation: A vehicle is immediately impounded for 30 days if the driver has a
    BAC over 0.16 (double the legal limit) or if they refuse to obey a peace officer's
    order to provide a breath or blood sample.
- id: 125
  category: alcohol_drugs_health
  question: What is the maximum BAC allowed for a driver of a taxi, bus, or minibus
    while they are on duty?
  choices:
    A: 0.00 (Zero tolerance)
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: A
  explanation: Drivers of buses, minibuses, and taxis are subject to the zero-alcohol
    rule while in the performance of their duties.
- id: 126
  category: alcohol_drugs_health
  question: If a driver is subject to the 'zero alcohol' rule and is caught with alcohol
    in their system, how many demerit points are added to their record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: B
  explanation: A violation of the zero-alcohol rule results in an immediate 90-day
    suspension, a fine, and 4 demerit points entered into the driver's record.
- id: 127
  category: alcohol_drugs_health
  question: A driver convicted of a first impaired driving offense with a BAC exceeding
    0.16 must use an alcohol ignition interlock device for at least how long to regain
    driving privileges?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: For a first offense with a BAC over 0.16, the offender is required
    to have an alcohol ignition interlock device installed in their vehicle for a
    minimum of 2 years after their license suspension ends.
- id: 128
  category: alcohol_drugs_health
  question: 'According to the SAAQ, if you are diagnosed with a medical condition
    that may affect your driving, you must notify them within:'
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: The time of your next license renewal
  answer: B
  explanation: Drivers are legally obligated to report any change in their health
    status that could affect their ability to drive safely to the SAAQ within 30 days
    of the change.
- id: 129
  category: alcohol_drugs_health
  question: What is the effect of consuming alcohol and drugs (such as cannabis) at
    the same time before driving?
  choices:
    A: The effects of each cancel each other out
    B: The effects are the same as taking them separately
    C: The effects are significantly multiplied, increasing impairment
    D: The effects only last for 30 minutes
  answer: C
  explanation: Combining alcohol and drugs creates a synergistic effect, meaning the
    impairment is much greater than the sum of the individual effects of each substance.
- id: 130
  category: alcohol_drugs_health
  question: In Quebec, can a police officer require a driver to undergo a physical
    coordination test (STF) at the roadside?
  choices:
    A: No, only breathalyzers are legal
    B: Yes, if they have reasonable grounds to suspect the driver has drugs or alcohol
      in their system
    C: Yes, but only if the driver has already failed a breathalyzer
    D: Only if the driver is under 18 years of age
  answer: B
  explanation: Police officers in Quebec can demand a Standardized Field Sobriety
    Test (SFST/STF) if they suspect a driver's ability is impaired by alcohol, drugs,
    or a combination of both.
- id: 131
  category: alcohol_drugs_health
  question: Which of the following is true regarding the 'zero alcohol' rule for drivers
    under the age of 22?
  choices:
    A: It only applies if they are driving at night
    B: It applies to them regardless of the type of license they hold
    C: It only applies if they have a learner's license
    D: It does not apply if they are accompanied by an adult
  answer: B
  explanation: In Quebec, all drivers age 21 and under are subject to the zero-alcohol
    rule, whether they hold a learner's, probationary, or full driver's license.
- id: 132
  category: alcohol_drugs_health
  question: If a driver is taking a prescription medication that causes drowsiness,
    what is their legal responsibility in Quebec?
  choices:
    A: They can drive as long as they stay under the speed limit
    B: They must not drive, as driving while impaired by medication is an offense
    C: They can drive if they have a doctor's note in the car
    D: They can drive only during daylight hours
  answer: B
  explanation: The Highway Safety Code prohibits driving if your ability is impaired
    by any substance, including prescription or over-the-counter medications that
    cause side effects like drowsiness or slowed reflexes.
- id: 133
  category: alcohol_drugs_health
  question: What is the BAC limit for drivers of 'heavy vehicles' (those with a gross
    vehicle weight rating of 4,500 kg or more) in Quebec?
  choices:
    A: '0.00'
    B: '0.05'
    C: '0.08'
    D: '0.10'
  answer: B
  explanation: Drivers of heavy vehicles in Quebec are subject to a stricter BAC limit
    of 0.05 (50 mg of alcohol per 100 ml of blood).
- id: 134
  category: alcohol_drugs_health
  question: If a driver is convicted of a second impaired driving offense within a
    10-year period, what is the minimum duration of the court-ordered license prohibition?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: Under the Criminal Code (which applies in Quebec), a second offense
    for impaired driving carries a minimum 2-year prohibition from driving, in addition
    to other provincial penalties.
- id: 135
  category: alcohol_drugs_health
  question: Under Quebec's Highway Safety Code, what is the 'zero tolerance' rule
    regarding cannabis and other drugs?
  choices:
    A: Drivers can have up to 2ng of THC in their blood.
    B: It is prohibited to drive with any detectable presence of cannabis or other
      drugs in your saliva or blood.
    C: Only learner and probationary drivers are subject to zero tolerance for drugs.
    D: Zero tolerance only applies to drivers under the age of 21.
  answer: B
  explanation: Quebec has a zero-tolerance policy for drugs. It is strictly prohibited
    for anyone to drive a road vehicle if there is any detectable presence of cannabis
    or other prohibited drugs in their system.
- id: 136
  category: alcohol_drugs_health
  question: If a driver is caught with a BAC of 0.16 or higher for the first time,
    what happens to their vehicle?
  choices:
    A: It is towed to their home at their expense.
    B: It is immediately seized and impounded for 30 days.
    C: It is seized only if they have a prior conviction.
    D: It is sold by the SAAQ to pay for court costs.
  answer: B
  explanation: For a first offense with a BAC of 0.16 or higher, or for refusing to
    provide a sample, the vehicle the person was driving is immediately seized and
    impounded for 30 days.
- id: 137
  category: alcohol_drugs_health
  question: According to the SAAQ, how long do you have to report a change in your
    health status that could affect your ability to drive?
  choices:
    A: Within 10 days
    B: Within 30 days
    C: Within 60 days
    D: Only when you renew your license
  answer: B
  explanation: Drivers in Quebec are legally required to notify the SAAQ within 30
    days of any change in their health that could affect their ability to drive safely.
- id: 138
  category: alcohol_drugs_health
  question: What is the maximum legal BAC limit for drivers of heavy vehicles, taxis,
    or buses in Quebec?
  choices:
    A: '0.00'
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: C
  explanation: In Quebec, the BAC limit for drivers of heavy vehicles, buses, minibuses,
    and taxis is 0.05.
- id: 139
  category: alcohol_drugs_health
  question: How does alcohol consumption specifically affect a driver's vision?
  choices:
    A: It improves night vision by dilating pupils.
    B: It narrows the field of vision (tunnel vision).
    C: It increases the ability to judge distances accurately.
    D: It has no effect on vision, only on reaction time.
  answer: B
  explanation: Alcohol reduces peripheral vision, leading to 'tunnel vision,' and
    makes it difficult for the eyes to adjust to glare or changes in light.
- id: 140
  category: alcohol_drugs_health
  question: A driver with a zero-alcohol requirement who violates this rule faces
    an immediate 90-day suspension and how many demerit points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: B
  explanation: Violating the zero-alcohol rule results in an immediate 90-day license
    suspension, a fine, and 4 demerit points entered on the driving record.
- id: 141
  category: alcohol_drugs_health
  question: In Quebec, who is responsible for the costs associated with the installation
    and rental of an ignition interlock device (IID)?
  choices:
    A: The SAAQ
    B: The provincial government
    C: The driver's insurance company
    D: The driver
  answer: D
  explanation: The driver is responsible for all costs related to the ignition interlock
    device, including installation, rental, and periodic data downloads.
- id: 142
  category: alcohol_drugs_health
  question: 'According to SAAQ safety guidelines, being awake for 18 consecutive hours
    produces a level of impairment equivalent to a BAC of:'
  choices:
    A: '0.02'
    B: '0.05'
    C: '0.08'
    D: '0.10'
  answer: B
  explanation: Fatigue is a major cause of accidents. Studies cited by the SAAQ show
    that 18 hours of wakefulness is equivalent to a BAC of 0.05, and 24 hours is equivalent
    to 0.10.
- id: 143
  category: alcohol_drugs_health
  question: If you are taking prescription medication, what should you do before driving
    in Quebec?
  choices:
    A: Drive only during daylight hours.
    B: Consult a doctor or pharmacist about the medication's effect on driving.
    C: Wait at least one hour after taking the medication before driving.
    D: Nothing, as prescription drugs are legal and do not affect driving.
  answer: B
  explanation: Many prescription and over-the-counter medications can cause drowsiness
    or reduced alertness. You must consult a healthcare professional to ensure it
    is safe to drive.
- id: 144
  category: alcohol_drugs_health
  question: If a driver is convicted of a second alcohol-related offense within 10
    years in Quebec, what is the minimum duration of the vehicle seizure?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: For a repeat offense (second time or more within 10 years), the vehicle
    the offender is driving is seized and impounded for 90 days.
- id: 145
  category: penalties_and_points
  question: How many demerit points are assigned for failing to wear a seatbelt while
    driving in Quebec?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Drivers in Quebec receive 3 demerit points and a fine for failing to
    wear a seatbelt.
- id: 146
  category: penalties_and_points
  question: How many demerit points are assigned for failing to remain at the scene
    of an accident (hit and run)?
  choices:
    A: 4 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: C
  explanation: Failing to fulfill the obligations at the scene of an accident (hit
    and run) results in 9 demerit points in Quebec.
- id: 147
  category: penalties_and_points
  question: How many demerit points are assigned for following another vehicle too
    closely in Quebec?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 0 points (fine only)
  answer: A
  explanation: Following too closely (tailgating) results in 2 demerit points being
    added to the driver's record.
- id: 148
  category: penalties_and_points
  question: Under what circumstance can a driver be assigned 3 demerit points regarding
    passing?
  choices:
    A: Passing on the right when not permitted
    B: Passing a cyclist with less than 1 meter of space
    C: Speeding while passing
    D: Failing to signal a lane change
  answer: A
  explanation: Passing on the right when it is not permitted by the Highway Safety
    Code results in 3 demerit points.
- id: 149
  category: penalties_and_points
  question: How many demerit points are assigned for crossing a railway crossing when
    the signal lights are flashing or the gate is closed?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: 9 points
  answer: B
  explanation: Crossing or attempting to cross a railway crossing when prohibited
    (flashing lights, lowered gates) results in 3 demerit points.
- id: 150
  category: penalties_and_points
  question: If a driver is caught driving while their license is suspended for a Criminal
    Code offense, their vehicle will be seized and impounded for how long?
  choices:
    A: 7 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Driving while a license is suspended or revoked leads to an immediate
    30-day seizure and impoundment of the vehicle.
- id: 151
  category: penalties_and_points
  question: In Quebec, refusing to provide a breath sample to a peace officer results
    in which of the following?
  choices:
    A: A simple fine and a 24-hour suspension
    B: The same penalties as having a BAC over 160 mg/100 ml
    C: A 30-day license suspension only
    D: No penalty if it is a first offense
  answer: B
  explanation: Refusing to provide a breath or blood sample is a criminal offense
    that carries the same severe penalties as driving with a BAC of 0.16 or higher
    (the highest tier of impairment penalties).
- id: 152
  category: penalties_and_points
  question: In Quebec, 'excessive speeding' in a zone where the speed limit is 60
    km/h or less is defined as driving at least how many km/h over the posted limit?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: C
  explanation: According to the SAAQ, excessive speeding in a zone of 60 km/h or less
    occurs when a driver exceeds the limit by 40 km/h or more.
- id: 153
  category: penalties_and_points
  question: How many demerit points are entered on your record for failing to stop
    at a railway crossing when the signal lights are flashing?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: 9 points
  answer: B
  explanation: Under the Quebec Highway Safety Code, failing to obey a signal at a
    railway crossing results in 3 demerit points.
- id: 154
  category: penalties_and_points
  question: If a driver in Quebec refuses to provide a breath sample to a peace officer,
    what is the immediate administrative penalty regarding their license?
  choices:
    A: A 24-hour suspension
    B: A 30-day suspension
    C: A 90-day suspension
    D: A 1-year revocation
  answer: C
  explanation: Refusal to provide a breath or fluid sample results in an immediate
    90-day license suspension, the same as failing a breathalyzer test with a high
    BAC.
- id: 155
  category: penalties_and_points
  question: In Quebec, what is the standard number of demerit points for failing to
    wear a seat belt while driving?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Failure to wear a seat belt properly results in 3 demerit points and
    a fine.
- id: 156
  category: penalties_and_points
  question: How many demerit points are added to your record for failing to yield
    the right-of-way at a stop sign or a red light?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Failing to stop at a red light or stop sign, or failing to yield the
    right-of-way at these locations, results in 3 demerit points.
- id: 157
  category: penalties_and_points
  question: If you are caught driving while your license is suspended, the vehicle
    you are driving will be immediately impounded for how long?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 90 days
  answer: C
  explanation: Driving while a license is suspended or revoked leads to the immediate
    30-day impoundment of the vehicle, regardless of who owns it.
- id: 158
  category: penalties_and_points
  question: How many demerit points are assigned for an illegal pass on the right
    side of another vehicle?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Passing on the right when not permitted by the Highway Safety Code
    results in 3 demerit points.
- id: 159
  category: penalties_and_points
  question: How many demerit points are given for failing to yield to an emergency
    vehicle with its sirens or lights activated?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failing to yield to an emergency vehicle (police, fire, ambulance)
    results in 4 demerit points in Quebec.
- id: 160
  category: penalties_and_points
  question: For a first offense of 'excessive speeding,' how long is the driver's
    license immediately suspended at the roadside?
  choices:
    A: 24 hours
    B: 7 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: A first-time excessive speeding offense results in an immediate 7-day
    roadside license suspension. Subsequent offenses lead to longer suspensions.
- id: 161
  category: penalties_and_points
  question: How many demerit points are assigned for crossing a solid double line
    on a Quebec roadway?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Crossing a solid double line to pass or change lanes is a violation
    that carries 3 demerit points.
- id: 162
  category: penalties_and_points
  question: For drivers of heavy vehicles (Class 1, 2, or 3) in Quebec, what is the
    maximum legal Blood Alcohol Concentration (BAC) limit?
  choices:
    A: '0.00'
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: C
  explanation: While the general limit is 0.08, drivers of heavy vehicles, buses,
    and taxis are subject to a stricter BAC limit of 0.05 in Quebec.
- id: 163
  category: penalties_and_points
  question: How many demerit points are added to a driver's record for failing to
    signal their intention to turn or change lanes?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failing to use turn signals when changing lanes or turning results
    in 2 demerit points.
- id: 164
  category: sharing_the_road
  question: Under Quebec's 'Move Over' law (corridor de sécurité), what must you do
    when an emergency vehicle is stopped on the shoulder with its flashing lights
    activated?
  choices:
    A: Maintain your speed and stay in your lane.
    B: Speed up to pass the vehicle as quickly as possible.
    C: Slow down and, if safe to do so, create a buffer lane by moving over.
    D: Stop immediately in the middle of the highway.
  answer: C
  explanation: The Move Over law requires drivers to slow down and change lanes (if
    safe) to create a safety corridor for emergency vehicles, tow trucks, or surveillance
    vehicles stopped with lights flashing.
- id: 165
  category: sharing_the_road
  question: How many demerit points are added to your record for failing to comply
    with the Move Over law (corridor de sécurité) in Quebec?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failing to respect the safety corridor (Move Over law) results in 4
    demerit points and a fine ranging from $200 to $300.
- id: 166
  category: sharing_the_road
  question: In Quebec, what is the fine for 'dooring' (opening the door of a parked
    vehicle without ensuring it can be done safely for cyclists or others)?
  choices:
    A: Between $30 and $60
    B: Between $100 and $150
    C: Between $200 and $300
    D: Exactly $500
  answer: C
  explanation: Opening a vehicle door without checking for cyclists or other traffic
    carries a fine of $200 to $300 under the Highway Safety Code.
- id: 167
  category: sharing_the_road
  question: When approaching a pedestrian crosswalk where a pedestrian has clearly
    manifested their intention to cross, what is the driver's obligation in Quebec?
  choices:
    A: Slow down but keep moving if the pedestrian hasn't stepped off the curb.
    B: Honk to warn the pedestrian you are coming.
    C: Stop and allow the pedestrian to cross.
    D: Only stop if there is a stop sign or red light.
  answer: C
  explanation: Drivers must stop for pedestrians who are clearly showing an intention
    to cross at a designated crosswalk, even if there are no traffic lights.
- id: 168
  category: sharing_the_road
  question: Which of the following is true regarding school buses on a road separated
    by a raised median or physical barrier?
  choices:
    A: Drivers on both sides must stop for the flashing red lights.
    B: Only drivers following the bus must stop; oncoming traffic does not.
    C: No one has to stop if the road has more than 3 lanes.
    D: Drivers must slow to 20 km/h but do not need to stop.
  answer: B
  explanation: If the road is separated by a median strip (terre-plein), drivers traveling
    in the opposite direction of the school bus are not required to stop.
- id: 169
  category: sharing_the_road
  question: When sharing the road with a heavy vehicle (truck), where are its 'blind
    spots' (angles morts) located?
  choices:
    A: Only directly behind the trailer.
    B: Only on the left side of the cab.
    C: Directly in front, directly behind, and on both sides.
    D: There are no blind spots if the truck has convex mirrors.
  answer: C
  explanation: Heavy vehicles have significant blind spots in the front, the rear,
    and on both sides. If you cannot see the driver's face in their mirrors, they
    cannot see you.
- id: 170
  category: sharing_the_road
  question: If you are turning right at an intersection and a cyclist is positioned
    to your right and intends to go straight, what should you do?
  choices:
    A: Speed up to turn before the cyclist reaches the intersection.
    B: Yield the right of way and let the cyclist pass before turning.
    C: Honk to signal the cyclist to stop.
    D: Turn anyway, as vehicles always have priority over bicycles.
  answer: B
  explanation: Drivers must yield to cyclists traveling straight when the driver is
    intending to turn right across the cyclist's path.
- id: 171
  category: sharing_the_road
  question: In Quebec, what is the recommended formation for two motorcycles riding
    together in a single lane?
  choices:
    A: Side-by-side (abreast).
    B: One directly behind the other in the center.
    C: A staggered (zig-zag) formation.
    D: One on the shoulder and one in the lane.
  answer: C
  explanation: A staggered formation is recommended for motorcycles to provide better
    visibility and more room for maneuvering while sharing a lane.
- id: 172
  category: sharing_the_road
  question: When an emergency vehicle (police, fire, or ambulance) approaches with
    its siren and flashing lights on, what is the correct action?
  choices:
    A: Stop exactly where you are in your lane.
    B: Speed up to stay ahead of the vehicle.
    C: Move to the right as far as possible and stop.
    D: Move to the left and stop.
  answer: C
  explanation: Drivers must clear the path for emergency vehicles by moving to the
    right-hand edge of the road and coming to a complete stop.
- id: 173
  category: sharing_the_road
  question: What does an orange triangular sign with a red border on the back of a
    vehicle signify?
  choices:
    A: The vehicle is carrying dangerous goods.
    B: The vehicle is a slow-moving vehicle (under 40 km/h).
    C: The vehicle is an oversized load.
    D: The vehicle is a snowplow.
  answer: B
  explanation: This sign identifies slow-moving vehicles, such as farm tractors or
    construction equipment, which travel at speeds less than 40 km/h.
- id: 174
  category: sharing_the_road
  question: In Quebec, are cyclists allowed to ride on the sidewalk?
  choices:
    A: Yes, it is always safer than the road.
    B: Yes, but only if they are over 18 years old.
    C: No, unless authorized by a sign or in an emergency.
    D: Only if they are riding a motorized bicycle.
  answer: C
  explanation: Under the Highway Safety Code, cycling on sidewalks is generally prohibited
    unless signs indicate otherwise or for specific safety necessities.
- id: 175
  category: sharing_the_road
  question: When a horse-drawn carriage or a person on horseback is on the road, what
    should a driver do?
  choices:
    A: Honk to let them know you are passing.
    B: Slow down and pass only when it is safe, giving plenty of room.
    C: Flash your high beams to increase visibility.
    D: Drive as close as possible to encourage them to move to the shoulder.
  answer: B
  explanation: Drivers should be cautious around animals, as they can be unpredictable.
    Slow down, do not make loud noises (like honking), and provide ample space when
    passing.
- id: 176
  category: sharing_the_road
  question: In Quebec, when a school bus has its flashing red lights on and its stop
    arm extended, what is the minimum distance you must stop your vehicle from the
    bus?
  choices:
    A: 2 meters
    B: 3 meters
    C: 5 meters
    D: 10 meters
  answer: C
  explanation: According to the Quebec Highway Safety Code, drivers must stop their
    vehicle at least 5 meters from a school bus when its red flashing lights are in
    operation.
- id: 177
  category: sharing_the_road
  question: Under Quebec's 'Move-Over' law, what must a driver do when approaching
    an emergency vehicle or tow truck stopped with its flashing lights activated?
  choices:
    A: Maintain speed and stay in the current lane
    B: Honk the horn to alert the workers and continue at the speed limit
    C: Slow down and, if safe to do so, change lanes to create a buffer lane
    D: Speed up to pass the scene as quickly as possible
  answer: C
  explanation: The Move-Over law requires drivers to slow down and, if it can be done
    safely, move into another lane to provide a safety buffer for emergency personnel
    and tow truck operators.
- id: 178
  category: sharing_the_road
  question: In Quebec, you are approaching a school bus with flashing red lights from
    the opposite direction on a road separated by a raised median. What is the rule?
  choices:
    A: You must stop 5 meters away
    B: You must stop only if children are visibly crossing
    C: You are not required to stop
    D: You must slow down to 20 km/h but do not need to stop
  answer: C
  explanation: Drivers traveling in the opposite direction of a school bus on a roadway
    separated by a physical median (like a raised curb or grass strip) are not required
    to stop.
- id: 179
  category: sharing_the_road
  question: Which of the following is true regarding 'lane splitting' (driving between
    two lanes of vehicles) for motorcycles in Quebec?
  choices:
    A: It is legal on highways with more than three lanes
    B: It is legal only when traffic is moving slower than 30 km/h
    C: It is strictly prohibited
    D: It is legal for mopeds but not for heavy motorcycles
  answer: C
  explanation: Lane splitting is illegal in Quebec. Motorcycles must occupy a full
    lane and follow the same lane-usage rules as other motor vehicles.
- id: 180
  category: sharing_the_road
  question: What does the term 'No-Zone' refer to when sharing the road with heavy
    vehicles (trucks)?
  choices:
    A: The area where trucks are prohibited from driving
    B: The blind spots around the truck where the driver cannot see you
    C: The lane reserved for high-occupancy vehicles
    D: The area directly behind a truck where drafting is encouraged
  answer: B
  explanation: The 'No-Zone' refers to the significant blind spots located at the
    front, rear, and sides of large trucks where other vehicles can disappear from
    the driver's view.
- id: 181
  category: sharing_the_road
  question: In Quebec, what is the base fine range (excluding fees) for passing a
    school bus while its red lights are flashing?
  choices:
    A: $50 to $100
    B: $100 to $200
    C: $200 to $300
    D: $500 to $1,000
  answer: C
  explanation: The base fine for failing to stop for a school bus with flashing lights
    is $200 to $300, in addition to 9 demerit points and other administrative fees.
- id: 182
  category: sharing_the_road
  question: 'When a heavy vehicle is making a wide right turn at an intersection,
    you should:'
  choices:
    A: Try to pass on the right before the truck completes the turn
    B: Stay behind the truck and wait for it to complete the turn
    C: Honk your horn to let the driver know you are in their blind spot
    D: Pass the truck on the left while it is mid-turn
  answer: B
  explanation: Heavy vehicles require extra space to turn. You should never attempt
    to pass a truck on the right while it is turning, as you may be caught in its
    blind spot and crushed.
- id: 183
  category: sharing_the_road
  question: Why should you maintain a greater following distance when driving behind
    a motorcycle than when behind a car?
  choices:
    A: Motorcycles can stop much faster than cars
    B: Motorcycles are legally required to have 100 meters of space
    C: Motorcycles do not have brake lights
    D: Motorcycles are slower to accelerate
  answer: A
  explanation: Motorcycles are lighter and can often stop more quickly than cars.
    Additionally, road hazards like potholes or gravel can cause a motorcyclist to
    react suddenly.
- id: 184
  category: sharing_the_road
  question: According to the Quebec Highway Safety Code, what is the responsibility
    of a driver or passenger regarding opening a vehicle door?
  choices:
    A: The cyclist is always responsible for avoiding open doors
    B: You must ensure it can be done safely without obstructing traffic or hitting
      a cyclist
    C: Doors should only be opened on the sidewalk side
    D: There are no specific laws regarding opening doors into traffic
  answer: B
  explanation: It is an offense to open the door of a road vehicle unless it can be
    done safely without interfering with the movement of other road users, such as
    cyclists (often called 'dooring').
- id: 185
  category: vehicle_information
  question: In Quebec, between which dates are winter tires mandatory for all passenger
    vehicles registered in the province?
  choices:
    A: November 15 to April 15
    B: December 1 to March 15
    C: December 15 to March 15
    D: November 1 to May 1
  answer: B
  explanation: According to the Highway Safety Code, all passenger vehicles registered
    in Quebec must be equipped with winter tires from December 1 to March 15 inclusive.
- id: 186
  category: vehicle_information
  question: What is the minimum legal tread depth for tires on a passenger vehicle
    in Quebec?
  choices:
    A: 1.0 mm
    B: 1.6 mm
    C: 2.5 mm
    D: 3.2 mm
  answer: B
  explanation: In Quebec, tires are considered worn out and illegal if the tread depth
    is less than 1.6 mm (2/32 of an inch).
- id: 187
  category: vehicle_information
  question: In Quebec, what is the minimum percentage of light that front side windows
    must let through?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 85%
  answer: C
  explanation: The Highway Safety Code stipulates that the windshield and the front
    side windows must let through at least 70% of light when measured with a photometer.
- id: 188
  category: vehicle_information
  question: 'In Quebec, modifying a vehicle''s exhaust system to make it louder than
    the original system is:'
  choices:
    A: Legal if the noise level is below 100 decibels.
    B: Legal for off-road vehicles only.
    C: Prohibited under the Highway Safety Code.
    D: Permitted if the vehicle is more than 25 years old.
  answer: C
  explanation: It is prohibited to modify an exhaust system in a way that increases
    the noise level compared to the original equipment installed by the manufacturer.
- id: 189
  category: vehicle_information
  question: What is the rule regarding license plate covers in Quebec?
  choices:
    A: Clear covers are allowed if they are clean.
    B: Tinted covers are allowed if the plate is still readable.
    C: Any material covering the plate that interferes with legibility or photo radar
      is prohibited.
    D: Covers are mandatory in winter to protect the plate from salt.
  answer: C
  explanation: The license plate must be free of any object or substance that hinders
    its legibility or the ability of photo radar to read it. This includes clear or
    tinted plastic covers.
- id: 190
  category: vehicle_information
  question: A passenger vehicle in Quebec must be equipped with at least which mirrors?
  choices:
    A: Only the interior rear-view mirror.
    B: Only the left side exterior mirror.
    C: An interior rear-view mirror and a left side exterior mirror.
    D: Both left and right exterior mirrors, with no interior mirror required.
  answer: C
  explanation: Every passenger vehicle must have an interior rear-view mirror and
    a left side exterior mirror. If the interior mirror is obstructed, a right side
    exterior mirror becomes mandatory.
- id: 191
  category: vehicle_information
  question: If a load extends beyond the rear of your vehicle by more than how many
    meters must you attach a red flag or light?
  choices:
    A: 0.5 meters
    B: 1.0 meter
    C: 1.5 meters
    D: 2.0 meters
  answer: B
  explanation: If a load extends more than 1 meter beyond the rear of the vehicle,
    a red flag (by day) or a red light (by night) must be attached to the end of the
    load.
- id: 192
  category: vehicle_information
  question: In Quebec, between which dates are studded tires permitted on passenger
    vehicles?
  choices:
    A: October 15 to May 1
    B: December 1 to March 15
    C: November 1 to April 1
    D: September 1 to June 1
  answer: A
  explanation: Studded tires are permitted in Quebec from October 15 to May 1 inclusive.
- id: 193
  category: vehicle_information
  question: Who is responsible for ensuring that a passenger under the age of 16 is
    wearing a seat belt in Quebec?
  choices:
    A: The passenger themselves
    B: The owner of the vehicle
    C: The driver of the vehicle
    D: The passenger's parents, even if not present
  answer: C
  explanation: The driver is responsible for ensuring all passengers under 16 years
    of age are properly buckled up. If they are not, the driver faces a fine and demerit
    points.
- id: 194
  category: vehicle_information
  question: 'Every motor vehicle in Quebec must be equipped with a horn that can be
    heard from a distance of at least:'
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: B
  explanation: The Highway Safety Code requires that a motor vehicle be equipped with
    a horn that is audible from a distance of at least 60 meters.
- id: 195
  category: vehicle_information
  question: What color must the headlights of a motor vehicle be in Quebec?
  choices:
    A: White
    B: Yellow
    C: Blue
    D: White or Amber
  answer: A
  explanation: Under Quebec regulations, headlights must emit a white light. While
    some older vehicles had yellow lights, current standards require white for visibility
    and safety.
- id: 196
  category: vehicle_information
  question: According to Quebec law, what is the minimum percentage of light that
    must be allowed to pass through the front side windows of a vehicle?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 75%
  answer: C
  explanation: The Highway Safety Code stipulates that the front side windows (to
    the left and right of the driver) must let in at least 70% of light.
- id: 197
  category: vehicle_information
  question: What is the regulation regarding the modification of a vehicle's exhaust
    system (muffler) in Quebec?
  choices:
    A: Modifications are allowed if they increase horsepower.
    B: Modifications are allowed as long as the exhaust is chrome.
    C: It is prohibited to replace the original system with one that is noisier.
    D: There are no regulations regarding exhaust noise.
  answer: C
  explanation: The Highway Safety Code prohibits any modification to the exhaust system
    that results in the vehicle being noisier than the original manufacturer's system.
- id: 198
  category: vehicle_information
  question: 'Every motor vehicle registered in Quebec must be equipped with a parking
    brake that is capable of:'
  choices:
    A: Stopping the vehicle within 10 meters at 50 km/h.
    B: Holding the vehicle stationary on any grade.
    C: Locking all four wheels simultaneously.
    D: Operating automatically when the engine is turned off.
  answer: B
  explanation: The Highway Safety Code requires a parking brake system that is independent
    of the service brake and capable of holding the vehicle on any grade.
- id: 199
  category: vehicle_information
  question: If a vehicle's interior rear-view mirror is obstructed by a load or a
    trailer, what is the legal requirement in Quebec?
  choices:
    A: The driver must remove the obstruction immediately.
    B: The vehicle must have an outside mirror on the right side.
    C: The driver must use a camera system instead.
    D: No additional equipment is required if the left mirror is present.
  answer: B
  explanation: If the interior mirror cannot be used, the vehicle must be equipped
    with a mirror on the outside right side of the vehicle.
- id: 200
  category: vehicle_information
  question: In Quebec, what is the rule regarding objects hanging from the interior
    rear-view mirror?
  choices:
    A: They are allowed if they are smaller than 10 cm.
    B: They are allowed only if they are air fresheners.
    C: They are prohibited if they obstruct the driver's view.
    D: They are encouraged for safety purposes.
  answer: C
  explanation: The Highway Safety Code prohibits any object placed in a way that obstructs
    the driver's field of vision or reduces the visibility of instruments.
- id: 201
  category: vehicle_information
  question: Regarding anti-pollution devices (catalytic converters), what does Quebec
    law state?
  choices:
    A: They can be removed after the vehicle is 10 years old.
    B: They can be modified to improve fuel economy.
    C: It is prohibited to remove or modify any device installed by the manufacturer
      to reduce gas emissions.
    D: They are only required for commercial vehicles.
  answer: C
  explanation: It is a violation of the Highway Safety Code to remove, modify, or
    render inoperative any environmental protection device installed on a vehicle.
- id: 202
  category: vehicle_information
  question: 'In Quebec, headlights must be turned on when visibility is less than:'
  choices:
    A: 100 meters
    B: 150 meters
    C: 200 meters
    D: 250 meters
  answer: B
  explanation: Headlights must be used whenever atmospheric conditions (fog, rain,
    snow) reduce visibility to less than 150 meters.
- id: 203
  category: signs_and_signals
  question: What does a white diamond symbol painted on a road lane indicate in Quebec?
  choices:
    A: The lane is for high-speed traffic only.
    B: The lane is reserved for specific types of vehicles (e.g., buses, taxis, carpooling).
    C: The lane is ending soon.
    D: The lane is for emergency vehicles only.
  answer: B
  explanation: A white diamond on the pavement indicates a reserved lane. Signs nearby
    will specify which vehicles (buses, taxis, or electric vehicles) are permitted
    to use it and during which hours.
- id: 204
  category: signs_and_signals
  question: When approaching an intersection with a steady yellow light, what is the
    legal requirement for a driver in Quebec?
  choices:
    A: Speed up to clear the intersection before it turns red.
    B: Stop, unless you are already in the intersection or so close that stopping
      would be dangerous.
    C: Always stop, regardless of your distance from the intersection.
    D: Treat it as a flashing yellow light and proceed with caution.
  answer: B
  explanation: Under the Quebec Highway Safety Code, a yellow light means you must
    stop. You should only proceed if you are already in the intersection or cannot
    stop safely.
- id: 205
  category: signs_and_signals
  question: What does a solid double yellow line in the center of the roadway mean?
  choices:
    A: Passing is permitted if the way is clear.
    B: Passing is prohibited in both directions.
    C: Passing is permitted for the lane on the right only.
    D: The road is a one-way street.
  answer: B
  explanation: A double solid yellow line indicates that passing is strictly prohibited
    for traffic moving in both directions.
- id: 206
  category: signs_and_signals
  question: In Quebec, if your vehicle's turn signals are not working, what is the
    correct hand signal for a right turn?
  choices:
    A: Left arm extended straight out the window.
    B: Left arm extended out and bent upward at the elbow.
    C: Left arm extended out and bent downward at the elbow.
    D: Right arm extended straight out the passenger window.
  answer: B
  explanation: The hand signal for a right turn is the left arm extended out the window
    and bent upward at a 90-degree angle.
- id: 207
  category: signs_and_signals
  question: 'A sign with a green circle surrounding a symbol indicates:'
  choices:
    A: A warning of a hazard ahead.
    B: An action that is prohibited.
    C: An action that is permitted or mandatory.
    D: Information about tourist services.
  answer: C
  explanation: In the Canadian/Quebec sign system, a green circle indicates that the
    movement or action shown inside the circle is permitted or required.
- id: 208
  category: signs_and_signals
  question: In Quebec, what do broken white lines on the pavement separate?
  choices:
    A: Traffic moving in opposite directions.
    B: Lanes of traffic moving in the same direction.
    C: The roadway from the shoulder.
    D: Bicycle lanes from car lanes.
  answer: B
  explanation: Broken white lines are used to separate lanes of traffic traveling
    in the same direction where lane changes are permitted.
- id: 209
  category: signs_and_signals
  question: What is the meaning of a sign that is an inverted triangle with a red
    border and a white center?
  choices:
    A: Stop.
    B: Yield the right-of-way.
    C: No entry.
    D: School zone.
  answer: B
  explanation: The inverted triangle is the standard shape for a 'Yield' sign, requiring
    drivers to give the right-of-way to other traffic or pedestrians.
- id: 210
  category: signs_and_signals
  question: In Quebec, what color are signs used to indicate temporary road work or
    construction?
  choices:
    A: Yellow
    B: Green
    C: Orange
    D: Blue
  answer: C
  explanation: Orange signs are used specifically for construction and maintenance
    work zones to warn drivers of temporary conditions.
- id: 211
  category: signs_and_signals
  question: What does a steady 'X' signal over a traffic lane mean?
  choices:
    A: The lane is for express traffic only.
    B: You must not drive in this lane.
    C: The lane is about to close.
    D: Pedestrians are crossing.
  answer: B
  explanation: A red 'X' over a lane (lane control signal) means that the lane is
    closed to traffic or that traffic is moving in the opposite direction in that
    lane.
- id: 212
  category: signs_and_signals
  question: When a pedestrian signal shows a flashing orange hand, what should a driver
    expect?
  choices:
    A: The traffic light is about to turn green.
    B: The traffic light is about to turn yellow.
    C: Pedestrians are no longer allowed to enter the crosswalk.
    D: Both B and C.
  answer: D
  explanation: A flashing orange hand tells pedestrians not to start crossing and
    usually coincides with the end of the green light phase for vehicles.
- id: 213
  category: signs_and_signals
  question: What does a solid white line on the right side of the road signify?
  choices:
    A: A lane for slow-moving vehicles.
    B: The edge of the roadway (fog line).
    C: A parking zone.
    D: A bicycle-only lane.
  answer: B
  explanation: A solid white line on the right side of the road marks the outer edge
    of the pavement, helping drivers stay on the road during poor visibility.
- id: 214
  category: signs_and_signals
  question: What does a flashing green light or a green arrow displayed simultaneously
    with a red light mean in Quebec?
  choices:
    A: You must wait for a solid green light to proceed
    B: You have priority to go straight, turn left, or turn right
    C: You may only turn left; you cannot go straight
    D: Pedestrians have the right of way in all directions
  answer: B
  explanation: In Quebec, a flashing green light or a green arrow indicates a protected
    turn/priority phase. You have the right of way to move in any direction (straight,
    left, right) while oncoming traffic faces a red light.
- id: 215
  category: signs_and_signals
  question: When approaching an intersection with a flashing amber (yellow) light,
    what must a driver do?
  choices:
    A: Stop completely and wait for it to turn green
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution, yielding to those already in the intersection
    D: Treat it as a four-way stop
  answer: C
  explanation: A flashing amber light indicates caution. Drivers must reduce speed
    and proceed only after ensuring it is safe to do so, yielding to pedestrians and
    other vehicles already in the intersection.
- id: 216
  category: signs_and_signals
  question: What does a solid white line painted on the pavement between two lanes
    of traffic moving in the same direction indicate?
  choices:
    A: Lane changes are encouraged
    B: Lane changes are prohibited
    C: The lane is reserved for buses only
    D: You are approaching a school zone
  answer: B
  explanation: In Quebec, a solid white line between lanes moving in the same direction
    indicates that lane changes are prohibited. Drivers must stay in their current
    lane.
- id: 217
  category: signs_and_signals
  question: To signal a right turn using hand signals, how should a driver position
    their arm?
  choices:
    A: Arm extended straight out the window
    B: Arm out and bent upward at the elbow
    C: Arm out and bent downward at the elbow
    D: Arm waved in a circular motion
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out the window and bent upward at a 90-degree angle.
- id: 218
  category: signs_and_signals
  question: What is the meaning of a hand signal where the driver's arm is extended
    out and bent downward at the elbow?
  choices:
    A: The driver is turning left
    B: The driver is turning right
    C: The driver is slowing down or stopping
    D: The driver is signaling for others to pass
  answer: C
  explanation: A hand signal with the arm bent downward at the elbow indicates that
    the driver intends to slow down or stop.
- id: 219
  category: signs_and_signals
  question: A sign featuring a green circle on a white background indicates what type
    of instruction?
  choices:
    A: A warning of a hazard ahead
    B: A prohibition (something you cannot do)
    C: A mandatory requirement or permission (something you may or must do)
    D: Information about tourist services
  answer: C
  explanation: In Quebec's signage system, a green circle represents an obligation
    or a permitted action, such as 'Truck Route' or 'Straight Ahead Only'.
- id: 220
  category: signs_and_signals
  question: What does a red circle with a diagonal slash across a symbol mean?
  choices:
    A: The action shown is permitted
    B: The action shown is prohibited
    C: You must use caution while performing the action
    D: The rule only applies at night
  answer: B
  explanation: A red circle with a diagonal slash is a regulatory sign that indicates
    the action depicted (such as a U-turn or a left turn) is strictly prohibited.
- id: 221
  category: signs_and_signals
  question: 'A white diamond symbol painted on a lane indicates that the lane is:'
  choices:
    A: Reserved for specific classes of vehicles
    B: A high-speed passing lane
    C: An exit-only lane
    D: A parking zone
  answer: A
  explanation: The white diamond symbol on the pavement identifies a reserved lane,
    which may be restricted to buses, taxis, or carpool vehicles (HOV).
- id: 222
  category: signs_and_signals
  question: When you see a yellow 'X' signal over a lane, what does it mean?
  choices:
    A: The lane is about to close or change direction
    B: You must stop immediately in that lane
    C: The lane is reserved for emergency vehicles only
    D: You may use the lane to turn left
  answer: A
  explanation: A yellow 'X' over a lane (lane control signal) means that the lane
    is about to be closed to traffic in that direction or the signal is about to change
    to a red 'X'.
- id: 223
  category: signs_and_signals
  question: In Quebec, what does a blue rectangular sign typically provide information
    about?
  choices:
    A: Construction and detours
    B: Regulatory laws and fines
    C: Services and tourist attractions
    D: Distance to the next city
  answer: C
  explanation: Blue signs are used to provide information on services (like hospitals
    or gas stations) and tourist attractions or facilities.
- id: 224
  category: signs_and_signals
  question: What must you do when approaching a railway crossing with a flashing red
    light signal?
  choices:
    A: Slow down and look both ways
    B: Stop at least 5 meters from the nearest rail
    C: Stop only if you see a train coming
    D: Speed up to cross before the gates close
  answer: B
  explanation: According to the SAAQ, when lights are flashing at a railway crossing,
    you must stop your vehicle at least 5 meters from the nearest rail.
- id: 225
  category: signs_and_signals
  question: What is the meaning of a flashing red light at an intersection?
  choices:
    A: The light is broken; proceed with caution
    B: Stop, then proceed only when it is safe to do so
    C: Yield to traffic on the right only
    D: Wait for a green light
  answer: B
  explanation: A flashing red light must be treated exactly like a stop sign. You
    must come to a complete stop and yield the right-of-way to other vehicles or pedestrians
    already in the intersection.
