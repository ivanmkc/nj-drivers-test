questions:
- id: 1
  category: license_system
  question: Au Québec, quel est l'âge minimal requis pour demander un permis d'apprenti
    conducteur de la classe 5 ?
  choices:
    A: 14 ans
    B: 15 ans
    C: 16 ans
    D: 18 ans
  answer: C
  explanation: Selon les règlements de la SAAQ, une personne doit avoir au moins 16
    ans pour obtenir un permis d'apprenti conducteur de la classe 5. Si elle a moins
    de 18 ans, le consentement parental est requis.
- id: 2
  category: license_system
  question: Un accompagnateur pour le titulaire d'un permis d'apprenti conducteur
    au Québec doit être titulaire d'un permis de conduire de classe 5 valide depuis
    au moins combien d'années ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: B
  explanation: Le conducteur accompagnateur doit être titulaire d'un permis de conduire
    de véhicule de promenade (classe 5) valide depuis au moins 2 ans et être en mesure
    de fournir aide et conseils.
- id: 3
  category: license_system
  question: Quelle est la durée de la période du permis probatoire au Québec avant
    de pouvoir obtenir un permis de conduire complet ?
  choices:
    A: 12 mois
    B: 18 mois
    C: 24 mois
    D: 36 mois
  answer: C
  explanation: Le permis probatoire est valide pendant 24 mois. Après cette période,
    si le conducteur a maintenu un bon dossier, il est admissible à un permis de conduire
    régulier.
- id: 4
  category: license_system
  question: Quel est le nombre maximal de points d'inaptitude qu'un titulaire de permis
    probatoire peut accumuler avant que son permis ne soit suspendu ?
  choices:
    A: 4 points
    B: 8 points
    C: 12 points
    D: 15 points
  answer: A
  explanation: Au Québec, le seuil de points d'inaptitude pour un titulaire de permis
    probatoire est de 4 points. Atteindre cette limite entraîne une suspension de
    permis d'au moins 3 mois.
- id: 5
  category: license_system
  question: Au Québec, la règle du « zéro alcool » s'applique à tous les conducteurs
    de moins de quel âge ?
  choices:
    A: Moins de 18 ans
    B: Moins de 19 ans
    C: Moins de 21 ans
    D: Moins de 22 ans
  answer: D
  explanation: Le Québec applique une politique de tolérance zéro alcool pour tous
    les conducteurs de moins de 22 ans, ainsi que pour tous les titulaires d'un permis
    d'apprenti conducteur ou probatoire, quel que soit leur âge.
- id: 6
  category: license_system
  question: Entre quelles heures est-il interdit de conduire pour le titulaire d'un
    permis d'apprenti conducteur de classe 5 au Québec ?
  choices:
    A: 23 h à 6 h
    B: Minuit à 5 h
    C: 22 h à 5 h
    D: Minuit à 6 h
  answer: B
  explanation: Les titulaires d'un permis d'apprenti conducteur ont l'interdiction
    de conduire entre minuit et 5 h du matin afin de réduire les risques d'accidents
    nocturnes.
- id: 7
  category: license_system
  question: Laquelle des conditions suivantes est obligatoire pour obtenir un permis
    de classe 5 au Québec ?
  choices:
    A: Réussir un séminaire de 10 heures sur la conduite préventive
    B: Réussir le cours de conduite approuvé par la SAAQ (4 phases)
    C: Un minimum de 100 heures de conduite supervisée
    D: Posséder un véhicule immatriculé
  answer: B
  explanation: Le Programme d'éducation à la sécurité routière du Québec exige que
    tous les nouveaux conducteurs suivent un cours de conduite obligatoire comprenant
    4 phases, incluant des volets théoriques et pratiques.
- id: 8
  category: license_system
  question: Pour un conducteur âgé de 23 à 24 ans, quel est le seuil de points d'inaptitude
    entraînant la suspension du permis ?
  choices:
    A: 4 points
    B: 8 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: 'Le Québec utilise un système de points d''inaptitude par paliers :
    4 points pour les titulaires d''un permis probatoire, 8 points pour les moins
    de 23 ans, 12 points pour les 23 et 24 ans, et 15 points pour les 25 ans et plus.'
- id: 9
  category: license_system
  question: Si vous changez d'adresse, vous devez en aviser la SAAQ dans un délai
    de combien de jours ?
  choices:
    A: 10 jours
    B: 15 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: En vertu du Code de la sécurité routière, le titulaire d'un permis
    doit aviser la SAAQ de tout changement d'adresse dans les 30 jours.
- id: 10
  category: license_system
  question: Un titulaire de permis probatoire âgé de 19 ans ou moins qui détient son
    permis depuis moins de 6 mois ne peut pas transporter plus de combien de passagers
    âgés de 19 ans ou moins entre minuit et 5 h du matin ?
  choices:
    A: Zéro passager
    B: 1 passager
    C: 2 passagers
    D: 3 passagers
  answer: B
  explanation: Pour améliorer la sécurité des jeunes conducteurs, ceux de 19 ans et
    moins détenant un permis probatoire depuis moins de 6 mois sont limités à 1 passager
    âgé de 19 ans ou moins entre minuit et 5 h (à l'exclusion des membres de la famille).
- id: 11
  category: license_system
  question: Si vous échouez à l'examen théorique de la SAAQ, combien de temps devez-vous
    attendre avant de pouvoir le repasser ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 28 jours
    D: 30 jours
  answer: C
  explanation: Au Québec, si un candidat échoue à l'examen théorique, il doit attendre
    au moins 28 jours avant d'être autorisé à le repasser.
- id: 12
  category: license_system
  question: Quelle classe de permis est requise au Québec pour conduire un cyclomoteur
    ou un scooter motorisé (classe 6D) ?
  choices:
    A: Classe 5
    B: Classe 6D
    C: Classe 8
    D: Classe 6A
  answer: B
  explanation: La classe 6D est le permis spécifique requis pour conduire un cyclomoteur.
    Notez qu'un permis de classe 5 (véhicule de promenade) permet également de conduire
    un cyclomoteur.
- id: 13
  category: license_system
  question: Au Québec, à quelle fréquence un conducteur âgé de 75 ans doit-il subir
    un examen médical et un test de vision pour conserver son permis ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: À 75 ans, 80 ans, puis tous les 2 ans
    D: Seulement s'il est impliqué dans un accident
  answer: C
  explanation: La SAAQ exige que les conducteurs fournissent un rapport médical et
    passent un test de vision à l'âge de 75 ans, puis à 80 ans, et tous les 2 ans
    par la suite.
- id: 14
  category: license_system
  question: Quelle est la conséquence d'une première infraction pour l'utilisation
    d'un téléphone cellulaire tenu en main au volant au Québec ?
  choices:
    A: Une amende de 100 $ et 2 points
    B: Une amende de 300 $ à 600 $ et 5 points d'inaptitude
    C: Suspension immédiate du permis pour 30 jours et amende de 1000 $
    D: 3 points d'inaptitude et un avertissement
  answer: B
  explanation: Au Québec, l'utilisation d'un appareil tenu en main en conduisant entraîne
    une amende (généralement de 300 $ à 600 $ pour une première infraction) et 5 points
    d'inaptitude. Les récidives entraînent une suspension immédiate du permis.
- id: 15
  category: license_system
  question: Pendant combien de temps une personne doit-elle détenir un permis d'apprenti
    conducteur au Québec avant d'être admissible à l'examen pratique pour un permis
    probatoire ?
  choices:
    A: 6 mois
    B: 8 mois
    C: 10 mois
    D: 12 mois
  answer: D
  explanation: Un permis d'apprenti conducteur doit être détenu pendant au moins 12
    mois, au cours desquels la personne doit compléter les phases obligatoires du
    cours de conduite, avant de pouvoir passer l'examen pratique de la SAAQ.
- id: 16
  category: license_system
  question: Les nouveaux résidents qui s'installent au Québec et détiennent un permis
    de conduire valide d'une autre province ou d'un autre pays doivent l'échanger
    contre un permis du Québec dans un délai de combien de mois ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 9 mois
    D: 12 mois
  answer: B
  explanation: Les nouveaux résidents sont autorisés à conduire avec leur permis hors
    province ou étranger pendant un maximum de 6 mois après leur établissement au
    Québec, après quoi ils doivent obtenir un permis du Québec.
- id: 17
  category: license_system
  question: En vertu du régime public d'assurance automobile du Québec (SAAQ), lequel
    des éléments suivants est couvert, peu importe qui est responsable ?
  choices:
    A: Dommages au véhicule du conducteur
    B: Dommages aux biens publics
    C: Préjudice corporel résultant d'un accident de la route
    D: Vol d'articles personnels dans le véhicule
  answer: C
  explanation: Le régime d'assurance public « no-fault » du Québec, géré par la SAAQ,
    couvre les dommages corporels pour tous les résidents du Québec impliqués dans
    un accident de la route, sans égard à la responsabilité. Les dommages matériels
    sont couverts par les assureurs privés.
- id: 18
  category: license_system
  question: Un permis de conduire standard de classe 5 au Québec permet à son titulaire
    de conduire un véhicule ayant une capacité maximale de combien d'occupants ?
  choices:
    A: 5 occupants
    B: 8 occupants
    C: 9 occupants
    D: 12 occupants
  answer: C
  explanation: Un permis de classe 5 vous permet de conduire un véhicule de promenade
    pouvant transporter au maximum 9 occupants (le conducteur plus 8 passagers) à
    la fois.
- id: 19
  category: license_system
  question: Combien de points d'inaptitude sont ajoutés au dossier d'un conducteur
    québécois pour avoir omis de s'arrêter lorsqu'un autobus scolaire a ses feux intermittents
    en marche ?
  choices:
    A: 3 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: C
  explanation: Le fait de ne pas s'arrêter à au moins 5 mètres d'un autobus scolaire
    dont les feux rouges clignotent ou dont le signal d'arrêt est déployé entraîne
    9 points d'inaptitude et une amende importante.
- id: 20
  category: license_system
  question: Pour obtenir un permis de moto complet (classe 6A), une personne doit
    détenir un permis d'apprenti conducteur de moto (classe 6R) pendant au moins combien
    de mois ?
  choices:
    A: 6 mois
    B: 9 mois
    C: 11 mois
    D: 12 mois
  answer: C
  explanation: Au Québec, le permis d'apprenti conducteur de moto (classe 6R) doit
    être détenu pendant un minimum de 11 mois avant que le titulaire ne soit admissible
    à passer l'examen pratique final pour un permis de classe 6A.
- id: 21
  category: license_system
  question: Au Québec, combien de points d'inaptitude sont inscrits au dossier pour
    avoir omis de s'immobiliser à la demande d'un agent de la paix ?
  choices:
    A: 4 points
    B: 7 points
    C: 9 points
    D: 12 points
  answer: D
  explanation: Selon le Code de la sécurité routière, le fait de ne pas s'arrêter
    lorsqu'un agent de la paix en donne le signal est une infraction grave qui entraîne
    l'inscription de 12 points d'inaptitude.
- id: 22
  category: license_system
  question: Quelle est l'acuité visuelle minimale requise (avec ou sans lentilles
    correctrices) pour détenir un permis de conduire de classe 5 au Québec ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: La SAAQ exige qu'un conducteur ait une acuité visuelle d'au moins 20/40
    (Snellen) pour les deux yeux ensemble, avec ou sans correction, pour être admissible
    à un permis de classe 5.
- id: 23
  category: license_system
  question: Si un permis de conduire est suspendu pour la première fois en raison
    de l'accumulation d'un trop grand nombre de points d'inaptitude, quelle est la
    durée de la période de suspension ?
  choices:
    A: 1 mois
    B: 3 mois
    C: 6 mois
    D: 12 mois
  answer: B
  explanation: Pour une première accumulation du maximum de points d'inaptitude permis,
    la SAAQ suspend le permis de conduire pour une période de 3 mois.
- id: 24
  category: license_system
  question: Lors d'une demande pour un premier permis d'apprenti conducteur au Québec,
    lequel des documents suivants est un document principal acceptable pour prouver
    l'identité ?
  choices:
    A: Une carte d'identité étudiante
    B: Un certificat de naissance canadien
    C: Une facture de services publics
    D: Une carte de crédit
  answer: B
  explanation: La SAAQ exige des documents originaux pour l'identification. Un certificat
    de naissance canadien ou un passeport canadien valide sont considérés comme des
    documents d'identité principaux.
- id: 25
  category: license_system
  question: Au Québec, si vous développez un problème de santé qui pourrait affecter
    votre capacité à conduire, quand devez-vous en aviser la SAAQ ?
  choices:
    A: Dans les 30 jours
    B: Au moment du renouvellement de votre permis
    C: Immédiatement
    D: Seulement si vous êtes impliqué dans un accident
  answer: C
  explanation: Les conducteurs sont légalement tenus d'aviser la SAAQ immédiatement
    de tout changement de leur état de santé qui pourrait nuire à la conduite sécuritaire
    d'un véhicule.
- id: 26
  category: license_system
  question: À quelle fréquence un conducteur du Québec doit-il faire reprendre sa
    photo pour son permis de conduire ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 4 ans
    D: Tous les 8 ans
  answer: D
  explanation: Bien que les frais du permis de conduire doivent être payés annuellement,
    la photo physique sur le permis est généralement valide pendant 8 ans, moment
    auquel une nouvelle photo doit être prise.
- id: 27
  category: license_system
  question: Un touriste visitant le Québec en provenance d'un autre pays est autorisé
    à conduire avec son permis étranger valide pendant un maximum de combien de mois
    ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 12 mois
    D: La durée de son visa
  answer: B
  explanation: Les non-résidents sont autorisés à conduire au Québec pendant une période
    de 6 mois consécutifs en utilisant leur permis de conduire étranger valide.
- id: 28
  category: license_system
  question: Quelle est la sanction pour un excès de vitesse dans une zone de construction
    désignée au Québec ?
  choices:
    A: L'amende est triplée
    B: L'amende est doublée
    C: Les points d'inaptitude sont triplés
    D: Le véhicule est immédiatement saisi
  answer: B
  explanation: Selon le Code de la sécurité routière du Québec, les amendes pour excès
    de vitesse sont doublées lorsque l'infraction est commise dans une zone de travaux.
- id: 29
  category: license_system
  question: 'Un permis de classe 5 au Québec permet à son titulaire de conduire un
    véhicule dont la masse nette n''excède pas :'
  choices:
    A: 3 000 kg
    B: 4 500 kg
    C: 5 500 kg
    D: 7 000 kg
  answer: B
  explanation: Un permis de classe 5 est destiné aux véhicules de promenade et aux
    camions dont la masse nette est inférieure à 4 500 kg.
- id: 30
  category: driver_testing
  question: Si vous échouez au test de vision effectué par la SAAQ, quelle est la
    prochaine étape requise pour poursuivre votre demande ?
  choices:
    A: Attendre 28 jours et reprendre le test de vision de la SAAQ
    B: Consulter un professionnel de la vue et fournir un rapport à la SAAQ
    C: Demander un permis restreint qui ne permet que la conduite de jour
    D: Payer des frais de dérogation de vision pour passer à l'examen théorique
  answer: B
  explanation: Si un candidat échoue à l'examen de la vue de la SAAQ, il doit consulter
    un optométriste ou un ophtalmologiste à ses frais et soumettre un rapport (Rapport
    d'examen visuel) à la SAAQ pour évaluation.
- id: 31
  category: driver_testing
  question: L'examen théorique de la SAAQ pour un permis de classe 5 est divisé en
    trois sections. Laquelle des suivantes n'est PAS l'une de ces sections ?
  choices:
    A: Le Code de la sécurité routière
    B: La signalisation routière
    C: L'entretien et la mécanique du véhicule
    D: La spécialisation classe 5 (véhicule de promenade)
  answer: C
  explanation: 'L''examen théorique du Québec se compose de trois parties : le Code
    de la sécurité routière, la signalisation routière et la spécialisation classe
    5. La mécanique automobile n''est pas une section distincte de l''examen.'
- id: 32
  category: driver_testing
  question: Si vous échouez à l'examen pratique de la SAAQ pour un permis de classe
    5, combien de jours devez-vous attendre avant de pouvoir repasser l'examen ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 28 jours
    D: 56 jours
  answer: C
  explanation: Au Québec, si vous échouez à l'examen pratique, il y a une période
    d'attente obligatoire de 28 jours avant de pouvoir le repasser.
- id: 33
  category: driver_testing
  question: Qui est responsable de fournir le véhicule utilisé lors de l'examen pratique
    de la SAAQ ?
  choices:
    A: La SAAQ fournit un véhicule standardisé pour tous les candidats
    B: Le candidat doit fournir un véhicule en bon état de fonctionnement
    C: L'école de conduite doit fournir le véhicule à ses élèves
    D: La SAAQ fournit un véhicule uniquement si le candidat paie des frais de location
  answer: B
  explanation: Le candidat est responsable de fournir un véhicule pour l'examen pratique.
    Le véhicule doit être sécuritaire, en bon état de fonctionnement et posséder un
    certificat d'immatriculation et d'assurance valide.
- id: 34
  category: driver_testing
  question: Pour éviter des frais d'annulation, quel est le délai de préavis que vous
    devez donner à la SAAQ si vous devez annuler ou reporter votre rendez-vous d'examen
    pratique ?
  choices:
    A: 24 heures
    B: 48 heures
    C: 72 heures
    D: 1 semaine
  answer: B
  explanation: La SAAQ exige un préavis d'au moins 48 heures pour annuler ou reporter
    un examen pratique ; sinon, des frais d'annulation seront facturés.
- id: 35
  category: driver_testing
  question: Si vous êtes tenu de porter des lentilles correctrices en conduisant,
    quel code de condition sera inscrit sur votre permis de conduire du Québec ?
  choices:
    A: Condition A
    B: Condition B
    C: Condition W
    D: Condition X
  answer: A
  explanation: Au Québec, la « Condition A » sur un permis de conduire indique que
    le titulaire doit porter des lentilles correctrices (lunettes ou verres de contact)
    lorsqu'il conduit un véhicule.
- id: 36
  category: driver_testing
  question: Lors de l'examen pratique de la SAAQ, laquelle des actions suivantes entraînera
    un échec immédiat ?
  choices:
    A: Faire caler le moteur une fois
    B: 'L''intervention de l''examinateur (ex. : utilisation du double frein ou de
      la direction)'
    C: Oublier d'utiliser un clignotant lors d'un changement de voie
    D: Toucher le trottoir lors d'un stationnement en parallèle
  answer: B
  explanation: Toute intervention de l'examinateur pour prévenir un accident ou une
    infraction au Code de la sécurité routière entraîne un échec immédiat à l'examen
    pratique.
- id: 37
  category: driver_testing
  question: Lors de la demande de votre premier permis d'apprenti conducteur au Québec,
    combien de pièces d'identité sont généralement requises ?
  choices:
    A: Une pièce d'identité avec photo
    B: Deux pièces d'identité originales
    C: Trois pièces d'identité
    D: Seul un certificat de naissance est requis
  answer: B
  explanation: Les candidats doivent fournir deux pièces d'identité originales, comme
    un certificat de naissance et une carte d'assurance maladie (RAMQ), pour demander
    leur premier permis.
- id: 38
  category: driver_testing
  question: Si vous passez un examen pratique au Québec entre le 1er décembre et le
    15 mars, quelle exigence spécifique au véhicule doit être respectée ?
  choices:
    A: Le véhicule doit avoir un chauffe-moteur
    B: Le véhicule doit être équipé de pneus d'hiver
    C: Le véhicule doit avoir une traction intégrale
    D: Le véhicule doit avoir un réservoir de lave-glace plein
  answer: B
  explanation: La loi québécoise stipule que tous les véhicules de promenade doivent
    être équipés de pneus d'hiver du 1er décembre au 15 mars. Cela s'applique aux
    véhicules utilisés pour les examens pratiques de la SAAQ.
- id: 39
  category: driver_testing
  question: De combien de jours disposez-vous pour aviser la SAAQ si vous développez
    un problème de santé qui pourrait affecter votre capacité à conduire de façon
    sécuritaire ?
  choices:
    A: 10 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: En vertu du Code de la sécurité routière, vous devez aviser la SAAQ
    dans les 30 jours suivant tout changement de votre état de santé susceptible d'affecter
    votre capacité à conduire.
- id: 40
  category: driver_testing
  question: Quelle est la note de passage minimale pour la section « Signalisation
    routière » de l'examen théorique de la SAAQ ?
  choices:
    A: 75 %
    B: 80 %
    C: 81 % (13 questions sur 16)
    D: 100 %
  answer: C
  explanation: Pour réussir la section Signalisation routière de l'examen théorique
    de la SAAQ, vous devez répondre correctement à au moins 13 questions sur 16 (environ
    81 %).
- id: 41
  category: driver_testing
  question: Lequel des modes de paiement suivants n'est généralement PAS accepté dans
    les points de service de la SAAQ pour les frais de permis ?
  choices:
    A: Carte de débit
    B: Argent comptant
    C: Carte de crédit
    D: Chèque
  answer: C
  explanation: Les points de service de la SAAQ n'acceptent généralement pas les cartes
    de crédit pour le paiement des frais de permis de conduire ou d'immatriculation.
    Ils acceptent le débit, l'argent comptant ou les chèques.
- id: 42
  category: driver_testing
  question: Avant le début de l'examen pratique, l'examinateur effectuera une vérification
    de la sécurité du véhicule. Si les feux de freinage ne fonctionnent pas, que se
    passe-t-il ?
  choices:
    A: L'examen a lieu mais avec une pénalité de 10 points
    B: L'examinateur réparera le feu pour vous
    C: L'examen est refusé et doit être reporté
    D: Le candidat est autorisé à utiliser des signaux manuels à la place
  answer: C
  explanation: Si le véhicule fourni pour l'examen pratique est jugé non conforme
    aux normes de sécurité (comme des feux défectueux), la SAAQ refusera de faire
    passer l'examen et le candidat devra prendre un nouveau rendez-vous.
- id: 43
  category: driver_testing
  question: Pour réussir l'examen de la vue de la SAAQ pour un permis de classe 5,
    quelle est l'acuité visuelle minimale requise avec les deux yeux ouverts (avec
    ou sans lentilles correctrices) ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Au Québec, l'acuité visuelle minimale requise pour détenir un permis
    de conduire de classe 5 est de 20/40 (6/12) avec les deux yeux ouverts et examinés
    ensemble.
- id: 44
  category: driver_testing
  question: 'Lorsqu''un titulaire de permis d''apprenti conducteur conduit, l''accompagnateur
    ne doit pas avoir un taux d''alcoolémie (BAC) égal ou supérieur à :'
  choices:
    A: 0,00
    B: 0,02
    C: 0,05
    D: 0,08
  answer: C
  explanation: Au Québec, un accompagnateur doit être titulaire d'un permis valide
    depuis au moins 2 ans et doit avoir un taux d'alcoolémie inférieur à 0,05 (50
    mg d'alcool par 100 ml de sang).
- id: 45
  category: driver_testing
  question: Au Québec, entre quelles dates est-il obligatoire que tous les véhicules
    de promenade soient équipés de pneus d'hiver ?
  choices:
    A: Du 1er novembre au 1er avril
    B: Du 1er décembre au 15 mars
    C: Du 15 décembre au 15 mars
    D: Du 15 novembre au 15 avril
  answer: B
  explanation: En vertu du Code de la sécurité routière, les pneus d'hiver sont obligatoires
    pour tous les véhicules motorisés immatriculés au Québec du 1er décembre au 15
    mars inclusivement.
- id: 46
  category: driver_testing
  question: Combien de points d'inaptitude sont ajoutés à votre dossier pour avoir
    omis de respecter la loi sur le « corridor de sécurité » au Québec lorsqu'un véhicule
    d'urgence est arrêté avec ses gyrophares allumés ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 9 points
  answer: C
  explanation: Le non-respect de la loi sur le corridor de sécurité (ralentir et changer
    de voie lorsque cela peut être fait en toute sécurité) entraîne l'inscription
    de 4 points d'inaptitude et une amende.
- id: 47
  category: driver_testing
  question: Au Québec, pendant combien de temps les points d'inaptitude restent-ils
    à votre dossier de conduite à partir de la date de la condamnation ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: B
  explanation: Les points d'inaptitude restent au dossier de conduite du Québec pendant
    2 ans suivant la date de la condamnation ou la date du paiement de l'amende.
- id: 48
  category: driver_testing
  question: Au Québec, votre permis de conduire doit être renouvelé chaque année.
    Quelle est l'échéance habituelle pour le renouvellement ?
  choices:
    A: Le 1er janvier
    B: L'anniversaire de la date où vous avez obtenu votre permis
    C: Le jour de votre anniversaire de naissance
    D: Le 31 décembre
  answer: C
  explanation: Au Québec, la SAAQ exige que vous payiez et renouveliez votre permis
    de conduire chaque année, généralement au plus tard le jour de votre anniversaire
    de naissance.
- id: 49
  category: driver_testing
  question: Quelle est la note de passage pour chacune des trois sections de l'examen
    théorique de la SAAQ pour la classe 5 ?
  choices:
    A: 60 %
    B: 70 %
    C: 75 %
    D: 80 %
  answer: C
  explanation: 'Pour réussir l''examen théorique, vous devez obtenir une note d''au
    moins 75 % dans chacune des trois sections : Code de la sécurité routière, Signalisation
    routière et Spécialisation classe 5.'
- id: 50
  category: driver_testing
  question: Au Québec, quelle est la sanction si vous êtes pris à utiliser ou à posséder
    un détecteur de radar ?
  choices:
    A: Un avertissement verbal seulement
    B: 2 points d'inaptitude et une petite amende
    C: Une amende salée et la confiscation de l'appareil
    D: Suspension immédiate du permis pour 3 mois
  answer: C
  explanation: Posséder ou utiliser un détecteur de radar est illégal au Québec. Les
    sanctions comprennent des amendes importantes (souvent plus de 500 $) et la saisie
    immédiate de l'appareil.
- id: 51
  category: driver_testing
  question: Selon le Code de la sécurité routière du Québec, à quelle distance devez-vous
    passer des feux de route aux feux de croisement lorsque vous croisez un véhicule
    venant en sens inverse ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Les conducteurs au Québec doivent passer aux feux de croisement lorsqu'ils
    se trouvent à moins de 150 mètres d'un véhicule venant en sens inverse ou lorsqu'ils
    suivent un autre véhicule.
- id: 52
  category: driver_testing
  question: Au Québec, quelle est la distance minimale légale de stationnement à respecter
    par rapport à une borne d'incendie ?
  choices:
    A: 1,5 mètre
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: B
  explanation: Le Code de la sécurité routière interdit de stationner un véhicule
    à moins de 3 mètres d'une borne d'incendie.
- id: 53
  category: driver_testing
  question: Au Québec, un enfant doit être attaché dans un siège d'appoint jusqu'à
    ce qu'il atteigne quelle taille OU quel âge ?
  choices:
    A: 135 cm ou 7 ans
    B: 145 cm ou 9 ans
    C: 150 cm ou 10 ans
    D: 120 cm ou 8 ans
  answer: B
  explanation: La loi québécoise exige que les enfants utilisent un siège d'appoint
    jusqu'à ce qu'ils mesurent 145 cm ou qu'ils aient 9 ans.
- id: 54
  category: driver_responsibility
  question: Au Québec, quel est le montant minimal de la couverture d'assurance responsabilité
    civile exigé par la loi pour tous les propriétaires de véhicules ?
  choices:
    A: 25 000 $
    B: 50 000 $
    C: 100 000 $
    D: 200 000 $
  answer: B
  explanation: En vertu de la Loi sur l'assurance automobile, tout propriétaire de
    véhicule au Québec doit détenir une police d'assurance responsabilité civile d'au
    moins 50 000 $ pour couvrir les dommages matériels causés à autrui.
- id: 55
  category: driver_responsibility
  question: Si vous êtes impliqué dans un accident de la route au Québec entraînant
    des blessures corporelles, quelle est votre obligation légale immédiate ?
  choices:
    A: Remplir un constat amiable et l'envoyer à la SAAQ dans les 48 heures.
    B: Échanger les informations d'assurance et quitter les lieux.
    C: Contacter la police immédiatement.
    D: Attendre 24 heures pour voir si la blessure persiste avant de faire un rapport.
  answer: C
  explanation: Au Québec, tout accident impliquant des blessures corporelles doit
    être signalé immédiatement à la police. La police remplira alors un rapport d'accident.
- id: 56
  category: driver_responsibility
  question: Quand un « Constat amiable » doit-il être utilisé à la suite d'une collision
    de véhicules au Québec ?
  choices:
    A: Uniquement lorsque quelqu'un est gravement blessé.
    B: Lorsqu'il n'y a que des dommages matériels et aucun blessé.
    C: Uniquement si la police refuse de se rendre sur les lieux.
    D: Lorsque les dommages aux deux véhicules dépassent 2 000 $.
  answer: B
  explanation: Le constat amiable est utilisé lorsqu'une collision n'entraîne que
    des dommages matériels. Il permet aux conducteurs de s'identifier et de décrire
    l'accident afin que les compagnies d'assurance puissent régler les réclamations
    plus rapidement sans l'intervention de la police.
- id: 57
  category: driver_responsibility
  question: Quelle est l'amende potentielle pour un conducteur au Québec pris à conduire
    un véhicule sans assurance responsabilité civile valide ?
  choices:
    A: 100 $ à 200 $
    B: 325 $ à 2 800 $
    C: 5 000 $ à 10 000 $
    D: Exactement 500 $
  answer: B
  explanation: Conduire sans assurance responsabilité civile est une infraction grave
    au Québec, passible d'une amende allant de 325 $ à 2 800 $, et peut entraîner
    la suspension immédiate du permis de conduire.
- id: 58
  category: driver_responsibility
  question: Où le certificat d'immatriculation du véhicule doit-il être conservé lorsque
    le véhicule circule sur les routes du Québec ?
  choices:
    A: Dans un coffre-fort à la résidence du propriétaire.
    B: Dans le véhicule ou sur la personne qui le conduit.
    C: Fixé à la plaque d'immatriculation arrière.
    D: Il doit être déposé au poste de police local.
  answer: B
  explanation: Selon le Code de la sécurité routière, le conducteur doit avoir le
    certificat d'immatriculation du véhicule et la preuve d'assurance dans le véhicule
    ou sur lui pour les présenter à un agent de la paix sur demande.
- id: 59
  category: driver_responsibility
  question: Lors de la vente d'un véhicule d'occasion à un autre particulier au Québec,
    qui est responsable d'aviser la SAAQ pour transférer l'immatriculation ?
  choices:
    A: Uniquement l'acheteur.
    B: Uniquement le vendeur.
    C: L'acheteur et le vendeur doivent tous deux s'assurer que le transfert est effectué.
    D: La compagnie d'assurance du vendeur.
  answer: C
  explanation: Les deux parties doivent se rendre dans un point de service de la SAAQ
    ou utiliser les services en ligne pour transférer l'immatriculation. Le vendeur
    demeure légalement responsable du véhicule jusqu'à ce que la SAAQ enregistre le
    transfert.
- id: 60
  category: driver_responsibility
  question: Un véhicule immatriculé à l'extérieur du Québec qui arrive dans la province
    doit subir quoi avant de pouvoir être immatriculé auprès de la SAAQ ?
  choices:
    A: Une vérification de la couleur de la peinture.
    B: Une vérification mécanique obligatoire dans un centre autorisé.
    C: Une période de quarantaine de 48 heures.
    D: Aucune inspection n'est requise s'il provient d'une autre province canadienne.
  answer: B
  explanation: La plupart des véhicules provenant de l'extérieur du Québec doivent
    passer une vérification mécanique dans un centre autorisé par la SAAQ pour s'assurer
    qu'ils respectent les normes de sécurité du Québec avant de pouvoir être immatriculés.
- id: 61
  category: driver_responsibility
  question: Combien de points d'inaptitude sont ajoutés au dossier d'un conducteur
    pour un « délit de fuite » (omission de rester sur les lieux d'un accident ou
    d'y retourner) au Québec ?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 9 points
  answer: D
  explanation: Le fait de ne pas remplir ses obligations sur les lieux d'un accident
    (délit de fuite) entraîne l'ajout de 9 points d'inaptitude au dossier du conducteur
    au Québec.
- id: 62
  category: driver_responsibility
  question: Dans le cadre du régime d'assurance « no-fault » du Québec, que couvre
    le régime public d'assurance de la SAAQ ?
  choices:
    A: Les dommages à votre véhicule lors d'une collision.
    B: Le vol d'objets personnels à l'intérieur du véhicule.
    C: Les dommages corporels résultant d'un accident de la route.
    D: Le vandalisme sur l'extérieur du véhicule.
  answer: C
  explanation: Le régime public d'assurance de la SAAQ couvre tous les Québécois pour
    les dommages corporels subis lors d'un accident de la route, peu importe qui est
    responsable. Les dommages matériels sont couverts par l'assurance privée.
- id: 63
  category: driver_responsibility
  question: Quelle est la conséquence directe du non-paiement d'une amende de circulation
    au Québec avant la date limite spécifiée ?
  choices:
    A: L'amende est automatiquement annulée après 90 jours.
    B: Le permis de conduire est suspendu jusqu'à ce que l'amende et les frais soient
      payés.
    C: Le conducteur doit repasser le test de vision.
    D: La couleur du véhicule doit être changée.
  answer: B
  explanation: Si une amende n'est pas payée, la SAAQ suspendra le permis de conduire
    ou le droit d'en obtenir un. La suspension reste en vigueur jusqu'à ce que l'amende,
    incluant les intérêts et les frais, soit payée en totalité.
- id: 64
  category: driver_responsibility
  question: Si un véhicule est saisi et mis en fourrière parce que le permis du conducteur
    était suspendu, quelle est la durée standard de la mise en fourrière pour une
    première infraction ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: C
  explanation: Au Québec, si vous conduisez avec un permis suspendu ou révoqué, le
    véhicule que vous conduisez est immédiatement saisi et mis en fourrière pour une
    période de 30 jours aux frais du propriétaire.
- id: 65
  category: driver_responsibility
  question: Quelle est la sanction pour avoir fourni de fausses informations à la
    SAAQ concernant l'immatriculation d'un véhicule ou le permis de conduire ?
  choices:
    A: Un simple avertissement verbal.
    B: Une amende allant de 300 $ à 600 $.
    C: Il n'y a pas de sanction si l'information est corrigée dans l'année.
    D: Des travaux communautaires obligatoires.
  answer: B
  explanation: Fournir des informations fausses ou trompeuses à la SAAQ est une infraction
    au Code de la sécurité routière et est passible d'une amende, généralement située
    entre 300 $ et 600 $.
- id: 66
  category: driver_responsibility
  question: Selon le Code de la sécurité routière, laquelle des affirmations suivantes
    est vraie concernant la visibilité de la plaque d'immatriculation d'un véhicule
    ?
  choices:
    A: Elle peut être recouverte d'un protecteur en plastique teinté.
    B: Elle doit être libre de tout objet ou matière qui entrave sa visibilité.
    C: Elle ne doit être visible que pendant les heures de clarté.
    D: Elle peut être placée à l'intérieur de la lunette arrière si elle est visible.
  answer: B
  explanation: La plaque d'immatriculation doit être solidement fixée à l'arrière
    du véhicule et doit être libre de tout objet ou substance (neige, boue, etc.)
    qui pourrait en gêner la lecture.
- id: 67
  category: driver_responsibility
  question: 'Au Québec, vous êtes légalement tenu de signaler une collision avec un
    animal à la police si l''animal pèse plus de :'
  choices:
    A: 5 kg
    B: 10 kg
    C: 25 kg
    D: 50 kg
  answer: C
  explanation: En vertu du Code de la sécurité routière, un conducteur qui frappe
    un animal pesant plus de 25 kg doit signaler l'accident à un agent de la paix.
- id: 68
  category: driver_responsibility
  question: Si vous êtes impliqué dans une collision où il n'y a pas de blessés et
    seulement des dommages matériels, quel document devriez-vous remplir avec l'autre
    conducteur ?
  choices:
    A: Un rapport de police
    B: Un formulaire de réclamation de la SAAQ
    C: Un Constat amiable
    D: Une déclaration de témoin
  answer: C
  explanation: Au Québec, pour les accidents n'impliquant que des dommages matériels
    et aucun blessé, les conducteurs doivent utiliser le Constat amiable pour s'identifier
    et décrire l'accident pour leurs assureurs respectifs.
- id: 69
  category: driver_responsibility
  question: Dans quelle circonstance est-il obligatoire d'appeler la police sur les
    lieux d'un accident de la route au Québec ?
  choices:
    A: Chaque fois que les dommages dépassent 1 000 $
    B: Seulement si l'un des conducteurs vient de l'extérieur du Québec
    C: S'il y a des blessés ou un décès
    D: Seulement si trois véhicules ou plus sont impliqués
  answer: C
  explanation: Selon le Code de la sécurité routière, la police doit être contactée
    immédiatement si un accident entraîne des blessures ou un décès.
- id: 70
  category: driver_responsibility
  question: Dans le régime d'assurance « no-fault » du Québec, qui est responsable
    du versement des indemnités pour dommages corporels résultant d'un accident de
    la route ?
  choices:
    A: L'assurance privée du conducteur responsable
    B: L'assurance privée de la victime
    C: La Société de l'assurance automobile du Québec (SAAQ)
    D: Le ministère des Transports
  answer: C
  explanation: Le régime public d'assurance automobile du Québec, administré par la
    SAAQ, indemnise tous les Québécois pour les dommages corporels subis lors d'un
    accident, peu importe qui est responsable.
- id: 71
  category: driver_responsibility
  question: Si vous heurtez un véhicule stationné sans occupant ou un objet fixe et
    que le propriétaire ne peut être localisé, que devez-vous faire selon la loi québécoise
    ?
  choices:
    A: Laisser une note et attendre 48 heures avant d'appeler la police
    B: Communiquer sans délai avec le poste de police le plus proche
    C: Rien, tant que les dommages sont inférieurs à 500 $
    D: Aviser uniquement votre compagnie d'assurance le jour ouvrable suivant
  answer: B
  explanation: Si vous ne pouvez pas trouver le propriétaire d'un véhicule ou d'un
    bien endommagé, vous devez contacter immédiatement le poste de police le plus
    proche pour signaler l'accident.
- id: 72
  category: driver_responsibility
  question: Si un véhicule a été remisé ou inutilisé pendant plus de 12 mois, qu'est-ce
    qui est requis avant qu'il puisse être immatriculé et remis en circulation au
    Québec ?
  choices:
    A: Une simple vidange d'huile
    B: Une vérification mécanique obligatoire par un centre autorisé
    C: Le paiement de frais d'immatriculation doubles
    D: Un nouvel examen théorique de conduite
  answer: B
  explanation: Les véhicules qui ont été retirés de la circulation pendant plus de
    12 mois doivent passer une vérification mécanique dans un centre autorisé par
    la SAAQ avant de pouvoir être immatriculés à nouveau.
- id: 73
  category: driver_responsibility
  question: Au Québec, qu'arrive-t-il à votre permis de conduire si vous ne payez
    pas une amende de circulation dans le délai prescrit ?
  choices:
    A: Votre permis est suspendu jusqu'à ce que l'amende et les frais soient payés
    B: On vous impose 2 points d'inaptitude supplémentaires
    C: Votre prime d'assurance est automatiquement doublée
    D: Rien ne se passe avant la date de renouvellement de votre permis
  answer: A
  explanation: La SAAQ suspendra le permis de conduire de toute personne qui ne paie
    pas une amende pour une infraction au Code de la sécurité routière jusqu'à ce
    que la dette soit entièrement réglée.
- id: 74
  category: driver_responsibility
  question: Quelle est la période de suspension immédiate du permis sur le bord de
    la route pour un conducteur qui refuse de fournir un échantillon d'haleine à un
    agent de la paix au Québec ?
  choices:
    A: 24 heures
    B: 30 jours
    C: 90 jours
    D: 1 an
  answer: C
  explanation: Le refus de fournir un échantillon d'haleine ou de fluide entraîne
    une suspension immédiate du permis de 90 jours, soit la même sanction qu'un taux
    d'alcoolémie (BAC) supérieur à 80 mg par 100 ml.
- id: 75
  category: driver_responsibility
  question: Au Québec, où doit être conservé le certificat d'immatriculation d'un
    véhicule ?
  choices:
    A: Au domicile du propriétaire
    B: Dans le véhicule ou sur la personne qui le conduit
    C: Dans le coffre-fort du propriétaire
    D: Chez le courtier d'assurance
  answer: B
  explanation: Le Code de la sécurité routière exige que le conducteur d'un véhicule
    ait sur lui le certificat d'immatriculation (ou une copie) et soit en mesure de
    le présenter à la demande d'un agent de la paix.
- id: 76
  category: driver_responsibility
  question: Laquelle des affirmations suivantes est vraie concernant les plaques d'immatriculation
    au Québec ?
  choices:
    A: Vous pouvez utiliser un couvre-plaque en plastique teinté pour protéger la
      plaque
    B: La plaque doit être libre de tout objet ou matière qui en gêne la lecture
    C: Vous n'avez besoin d'une plaque arrière que si le véhicule a plus de 10 ans
    D: Des plaques sont émises pour l'avant et l'arrière de tous les véhicules de
      promenade
  answer: B
  explanation: La loi québécoise interdit tout objet ou substance (comme de la saleté,
    de la neige ou des couvre-plaques teintés) obstruant la visibilité et la lisibilité
    d'une plaque d'immatriculation.
- id: 77
  category: driver_responsibility
  question: Si vous êtes impliqué dans un accident avec un animal sauvage, quelle
    est l'obligation de signalement si l'animal pèse plus de 25 kg ?
  choices:
    A: Aucun rapport n'est nécessaire
    B: Vous devez signaler l'accident à un agent de la paix
    C: Vous devez emmener l'animal chez un vétérinaire
    D: Vous devez seulement en informer votre compagnie d'assurance
  answer: B
  explanation: 'Au Québec, vous devez signaler un accident avec un animal sauvage
    à un agent de la paix si l''animal pèse plus de 25 kg (ex. : cerf, orignal, ours).'
- id: 78
  category: driver_responsibility
  question: Quelle est la conséquence pour un conducteur pris à conduire alors que
    son permis est suspendu pour amendes non payées ?
  choices:
    A: Un avertissement verbal
    B: Une amende de 30 $ à 60 $
    C: La saisie immédiate du véhicule pour 30 jours aux frais du propriétaire
    D: Le véhicule est définitivement confisqué par la Couronne
  answer: C
  explanation: Conduire avec un permis suspendu (y compris pour des amendes non payées)
    entraîne la saisie immédiate et la mise en fourrière du véhicule pour une période
    de 30 jours.
- id: 79
  category: safe_driving_rules
  question: Dans lequel des endroits suivants le virage à droite au feu rouge est-il
    strictement interdit en tout temps au Québec ?
  choices:
    A: Dans les zones scolaires
    B: Sur l'île de Montréal
    C: Dans les zones de construction
    D: Dans la ville de Québec
  answer: B
  explanation: Bien que le virage à droite au feu rouge soit permis dans la majeure
    partie du Québec lorsqu'il n'est pas interdit par une signalisation, il demeure
    strictement interdit partout sur l'île de Montréal.
- id: 80
  category: safe_driving_rules
  question: À l'approche d'un véhicule d'urgence ou d'une dépanneuse arrêté sur l'accotement
    avec ses feux jaunes ou bleus clignotants, que vous oblige à faire la loi sur
    le « corridor de sécurité » du Québec ?
  choices:
    A: Maintenir votre vitesse mais vous déplacer vers la voie de gauche
    B: S'arrêter immédiatement derrière le véhicule
    C: Ralentir et changer de voie s'il est sécuritaire de le faire
    D: Klaxonner pour avertir les travailleurs de votre présence
  answer: C
  explanation: La loi sur le corridor de sécurité du Québec exige que les conducteurs
    créent un espace de protection en ralentissant et, si c'est sécuritaire, en changeant
    de voie pour protéger les intervenants d'urgence et les travailleurs routiers.
- id: 81
  category: safe_driving_rules
  question: Lorsque vous dépassez un cycliste sur une route où la limite de vitesse
    est de 50 km/h ou moins, quelle est la distance minimale que vous devez maintenir
    entre votre véhicule et le cycliste ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 1,5 mètre
    D: 2 mètres
  answer: B
  explanation: Au Québec, les conducteurs doivent maintenir une distance de 1 mètre
    lorsqu'ils dépassent un cycliste dans les zones de 50 km/h ou moins, et de 1,5
    mètre dans les zones où la limite de vitesse est supérieure à 50 km/h.
- id: 82
  category: safe_driving_rules
  question: Au Québec, quelle est la distance minimale que vous devez laisser entre
    votre véhicule et une borne d'incendie lors du stationnement ?
  choices:
    A: 1,5 mètre
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: B
  explanation: Il est interdit de stationner ou d'immobiliser un véhicule à moins
    de 3 mètres d'une borne d'incendie.
- id: 83
  category: safe_driving_rules
  question: Lorsqu'un autobus scolaire a ses feux rouges clignotants allumés et son
    signal d'arrêt escamotable déployé, à combien de mètres devez-vous immobiliser
    votre véhicule ?
  choices:
    A: À au moins 2 mètres
    B: À au moins 5 mètres
    C: À au moins 10 mètres
    D: À au moins 20 mètres
  answer: B
  explanation: Les conducteurs doivent s'arrêter à au moins 5 mètres d'un autobus
    scolaire lorsque ses feux rouges clignotent ou que son signal d'arrêt est déployé,
    sauf s'ils circulent sur une chaussée séparée par un terre-plein central.
- id: 84
  category: safe_driving_rules
  question: Que signifie un feu vert clignotant à une intersection au Québec ?
  choices:
    A: Vous devez céder le passage à la circulation en sens inverse avant de tourner
      à gauche
    B: Le feu est sur le point de passer au rouge
    C: Vous avez la priorité pour aller tout droit ou tourner à gauche
    D: Les piétons ont la priorité dans toutes les directions
  answer: C
  explanation: Un feu vert clignotant (ou une flèche verte) indique un virage protégé,
    ce qui signifie que vous avez la priorité pour aller tout droit, tourner à gauche
    ou tourner à droite. La circulation en sens inverse fait face à un feu rouge.
- id: 85
  category: safe_driving_rules
  question: En s'engageant dans un carrefour giratoire au Québec, qui a la priorité
    de passage ?
  choices:
    A: Le véhicule qui entre dans le carrefour giratoire
    B: Le véhicule déjà engagé dans le carrefour giratoire
    C: Le véhicule approchant par la droite
    D: Le véhicule circulant le plus rapidement
  answer: B
  explanation: Les conducteurs qui entrent dans un carrefour giratoire doivent céder
    le passage aux véhicules qui circulent déjà dans l'anneau.
- id: 86
  category: safe_driving_rules
  question: Sur une route du Québec dont la limite de vitesse est de 70 km/h ou plus,
    quel est l'usage principal de la voie de gauche ?
  choices:
    A: Pour circuler à la limite de vitesse maximale
    B: Pour les véhicules en covoiturage uniquement
    C: Pour le dépassement d'autres véhicules uniquement
    D: Pour les camions lourds et les remorques
  answer: C
  explanation: Sur les routes où la limite de vitesse est de 70 km/h ou plus, la voie
    de gauche ne doit être utilisée que pour le dépassement ou lorsqu'on s'apprête
    à effectuer un virage à gauche.
- id: 87
  category: safe_driving_rules
  question: À l'approche d'un passage pour piétons, quand un conducteur doit-il s'arrêter
    pour un piéton ?
  choices:
    A: Uniquement si le piéton est déjà au milieu de la route
    B: Uniquement s'il y a un panneau d'arrêt
    C: Dès que le piéton manifeste son intention de traverser
    D: Uniquement si le piéton est âgé ou handicapé
  answer: C
  explanation: Les conducteurs doivent s'arrêter pour un piéton dès que celui-ci s'engage
    dans le passage ou manifeste clairement son intention de traverser (par exemple,
    en faisant un pas vers la chaussée ou en établissant un contact visuel).
- id: 88
  category: safe_driving_rules
  question: Au Québec, le demi-tour est interdit dans laquelle des situations suivantes
    ?
  choices:
    A: Dans une courbe où la visibilité est inférieure à 150 mètres
    B: Sur toute route dont la limite de vitesse dépasse 50 km/h
    C: À toute intersection munie de feux de circulation
    D: Uniquement là où un panneau 'Interdiction de faire demi-tour' est installé
  answer: A
  explanation: Le demi-tour est interdit là où une signalisation l'interdit, dans
    une courbe, ou près du sommet d'une côte où la visibilité est inférieure à 150
    mètres dans les deux directions.
- id: 89
  category: safe_driving_rules
  question: Dans une zone où la limite de vitesse est de 50 km/h, quelle vitesse est
    considérée comme un « grand excès de vitesse » au Québec ?
  choices:
    A: 70 km/h ou plus
    B: 80 km/h ou plus
    C: 90 km/h ou plus
    D: 100 km/h ou plus
  answer: C
  explanation: 'Dans une zone de 60 km/h ou moins, circuler à 40 km/h ou plus au-dessus
    de la limite (ex: 90 km/h dans une zone de 50 km/h) est classé comme un grand
    excès de vitesse, entraînant une suspension immédiate du permis et des amendes
    plus élevées.'
- id: 90
  category: safe_driving_rules
  question: Au Québec, où est-il strictement interdit de tourner à droite au feu rouge,
    même en l'absence de signalisation contraire ?
  choices:
    A: Dans les zones scolaires
    B: Sur l'île de Montréal
    C: Dans la ville de Québec (Vieux-Québec)
    D: Dans les zones de travaux
  answer: B
  explanation: Selon le Code de la sécurité routière, le virage à droite au feu rouge
    est autorisé partout au Québec, sauf sur l'île de Montréal et aux endroits où
    une signalisation l'interdit.
- id: 91
  category: safe_driving_rules
  question: À quelle distance minimale devez-vous immobiliser votre véhicule à l'approche
    d'un autobus scolaire dont les feux rouges clignotants sont en marche ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 10 mètres
    D: 20 mètres
  answer: B
  explanation: Les conducteurs doivent immobiliser leur véhicule à au moins 5 mètres
    d'un autobus scolaire lorsque ses feux rouges clignotent ou que son signal d'arrêt
    escamotable est déployé.
- id: 92
  category: safe_driving_rules
  question: Au Québec, la loi sur le corridor de sécurité exige que les conducteurs
    changent de voie ou ralentissent à l'approche de quel type de véhicule arrêté
    avec ses feux clignotants ?
  choices:
    A: Uniquement les voitures de police et les ambulances
    B: Uniquement les dépanneuses
    C: Uniquement les véhicules d'entretien routier
    D: Tout véhicule d'urgence, dépanneuse ou véhicule de surveillance dont les feux
      sont activés
  answer: D
  explanation: La loi sur le corridor de sécurité s'applique aux véhicules d'urgence
    (police, pompiers, ambulance), aux dépanneuses et aux véhicules de surveillance
    routière munis de feux clignotants ou pivotants.
- id: 93
  category: safe_driving_rules
  question: Lorsque vous stationnez un véhicule dans une pente ascendante (vers le
    haut) avec une bordure de trottoir, comment les roues avant doivent-elles être
    positionnées ?
  choices:
    A: Tournées vers la bordure (droite)
    B: Tournées à l'opposé de la bordure (gauche)
    C: Parallèles à la bordure (droites)
    D: Cela n'a pas d'importance tant que le frein à main est serré
  answer: B
  explanation: Lors d'un stationnement en pente ascendante avec une bordure, vous
    devez tourner les roues vers la gauche (à l'opposé de la bordure) de sorte que
    si le véhicule recule, l'arrière du pneu frappera la bordure et arrêtera la voiture.
- id: 94
  category: safe_driving_rules
  question: À quelle distance devez-vous passer des feux de route aux feux de croisement
    lorsque vous suivez un autre véhicule par l'arrière au Québec ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Les conducteurs doivent passer aux feux de croisement lorsqu'ils se
    trouvent à moins de 150 mètres du véhicule qu'ils suivent ou d'un véhicule venant
    en sens inverse.
- id: 95
  category: safe_driving_rules
  question: Au Québec, quelle est la distance minimale à maintenir lors d'un arrêt
    à un passage à niveau lorsque les signaux clignotent ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Les conducteurs doivent s'arrêter à au moins 5 mètres du rail le plus
    proche d'un passage à niveau lorsque les signaux d'avertissement sont activés.
- id: 96
  category: safe_driving_rules
  question: Lorsque deux véhicules arrivent en même temps à une intersection munie
    de panneaux d'arrêt dans toutes les directions, quel conducteur a la priorité
    de passage ?
  choices:
    A: Le conducteur à gauche
    B: Le conducteur à droite
    C: Le conducteur sur la rue la plus passante
    D: Le conducteur qui va tout droit
  answer: B
  explanation: Si deux véhicules arrivent en même temps à un arrêt obligatoire (4-way
    stop), le conducteur à gauche doit céder le passage au conducteur à sa droite.
- id: 97
  category: safe_driving_rules
  question: Au Québec, êtes-vous autorisé à franchir une ligne blanche continue pour
    dépasser un autre véhicule ?
  choices:
    A: Oui, si la voie est libre
    B: Non, c'est strictement interdit
    C: Uniquement pour dépasser un tracteur de ferme ou un véhicule lent muni d'un
      triangle d'avertissement
    D: Uniquement pendant les heures de clarté
  answer: C
  explanation: En règle générale, il est interdit de franchir une ligne continue,
    mais le Code de la sécurité routière permet de franchir une ligne continue pour
    dépasser un tracteur de ferme, un véhicule à traction animale ou un véhicule lent
    (muni du triangle orange) à condition que cela puisse être fait en toute sécurité.
- id: 98
  category: safe_driving_rules
  question: Quelle est la limite de vitesse par défaut sur un chemin de gravier au
    Québec, à moins d'indication contraire ?
  choices:
    A: 50 km/h
    B: 60 km/h
    C: 70 km/h
    D: 80 km/h
  answer: C
  explanation: Au Québec, la limite de vitesse par défaut sur un chemin de gravier
    (route non pavée) est de 70 km/h, à moins que la signalisation n'indique le contraire.
- id: 99
  category: defensive_driving
  question: Dans des conditions de conduite normales au Québec, quelle est la distance
    de suivi minimale recommandée derrière le véhicule qui vous précède ?
  choices:
    A: Une longueur de voiture
    B: Deux secondes
    C: Trois secondes
    D: Quatre secondes
    E: null
  answer: B
  explanation: La SAAQ recommande de maintenir une distance de suivi minimale d'au
    moins deux secondes par beau temps et dans de bonnes conditions routières afin
    de permettre un temps de réaction adéquat.
- id: 100
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une autoroute
    mouillée au Québec, quelle est la bonne mesure de conduite préventive à prendre
    ?
  choices:
    A: Freiner brusquement pour retrouver de la traction
    B: Accélérer légèrement pour traverser l'eau
    C: Mettre immédiatement la voiture au point mort
    D: Relâcher l'accélérateur et garder le volant droit
  answer: D
  explanation: Pour se rétablir de l'aquaplanage, vous devez réduire progressivement
    la vitesse en levant le pied de la pédale d'accélérateur et éviter les mouvements
    brusques du volant ou des freins jusqu'à ce que la traction soit rétablie.
- id: 101
  category: defensive_driving
  question: La loi sur le « corridor de sécurité » du Québec exige que les conducteurs
    ralentissent et, si c'est sécuritaire, changent de voie à l'approche de quel élément
    parmi les suivants ?
  choices:
    A: Uniquement les voitures de police avec des gyrophares
    B: Tout véhicule arrêté avec ses feux de détresse allumés
    C: Les véhicules d'urgence, les dépanneuses ou les véhicules de surveillance dont
      les feux sont activés
    D: Tout véhicule stationné sur l'accotement
  answer: C
  explanation: La loi sur le corridor de sécurité s'applique lorsqu'un véhicule d'urgence,
    une dépanneuse ou un véhicule de surveillance routière est immobilisé et que ses
    gyrophares ou ses feux clignotants sont activés.
- id: 102
  category: defensive_driving
  question: En zone urbaine, les principes de conduite préventive suggèrent de scruter
    la route devant vous pendant au moins combien de secondes ?
  choices:
    A: 2 à 5 secondes
    B: 5 à 8 secondes
    C: 10 à 12 secondes
    D: 20 à 30 secondes
  answer: C
  explanation: La SAAQ recommande de scruter de 10 à 12 secondes devant soi en ville
    pour anticiper les dangers potentiels comme les piétons, les cyclistes ou les
    changements de feux.
- id: 103
  category: defensive_driving
  question: Selon le Code de la sécurité routière du Québec, quelle est l'amende potentielle
    pour la conduite d'un véhicule couvert de neige ou de glace pouvant se détacher
    et représenter un danger ?
  choices:
    A: 30 $ à 60 $
    B: 60 $ à 100 $
    C: 200 $ à 300 $
    D: 500 $ à 1 000 $
  answer: B
  explanation: L'article 498 stipule qu'un conducteur doit s'assurer que son véhicule
    est exempt de toute matière (neige, glace, etc.) pouvant se détacher. Le non-respect
    de cette règle peut entraîner une amende de 60 $ à 100 $.
- id: 104
  category: defensive_driving
  question: Lorsque vous conduisez un véhicule équipé d'un système de freinage antiblocage
    (ABS) dans une situation d'urgence sur une route glissante, comment devez-vous
    appliquer les freins ?
  choices:
    A: Pomper les freins rapidement
    B: Appliquer une pression ferme et continue sur la pédale de frein
    C: Appliquer une légère pression pour éviter de bloquer les roues
    D: Utiliser le frein à main à la place
  answer: B
  explanation: Avec l'ABS, vous devez appuyer fermement sur la pédale de frein et
    la maintenir enfoncée. Le système pompera automatiquement les freins pour empêcher
    le blocage des roues tout en vous permettant de diriger le véhicule.
- id: 105
  category: defensive_driving
  question: Dans un brouillard dense au Québec, quels feux devriez-vous utiliser pour
    maintenir la meilleure visibilité et sécurité ?
  choices:
    A: Les feux de route (hautes)
    B: Les feux de position uniquement
    C: Les feux de croisement (basses)
    D: Les feux de détresse
  answer: C
  explanation: Les feux de croisement doivent être utilisés dans le brouillard. Les
    feux de route se reflètent sur les gouttelettes d'eau du brouillard, créant un
    éblouissement qui rend la visibilité plus difficile.
- id: 106
  category: defensive_driving
  question: Lors d'un changement de voie, quelle est la séquence correcte pour vérifier
    votre environnement selon les normes de conduite préventive du Québec ?
  choices:
    A: Signaler, vérifier les rétroviseurs et changer de voie
    B: Vérifier les rétroviseurs, signaler et changer de voie
    C: Vérifier les rétroviseurs, signaler, vérifier l'angle mort et changer de voie
    D: Signaler, vérifier l'angle mort et changer de voie
  answer: C
  explanation: La procédure sécuritaire consiste à vérifier d'abord vos rétroviseurs,
    à activer votre clignotant, à effectuer une vérification de l'épaule (angle mort),
    puis à procéder à la manœuvre si la voie est libre.
- id: 107
  category: defensive_driving
  question: Lorsque vous conduisez sous une pluie forte ou sur des routes enneigées
    au Québec, comment devriez-vous ajuster votre distance de sécurité ?
  choices:
    A: La maintenir à 2 secondes
    B: L'augmenter à au plus moins 4 secondes
    C: La réduire à 1 seconde pour rester dans les traces du véhicule devant
    D: La distance de sécurité n'a pas besoin de changer si vous avez des pneus d'hiver
  answer: B
  explanation: Dans des conditions défavorables comme la pluie, la neige ou le verglas,
    la SAAQ recommande de doubler la distance de sécurité à au moins 4 secondes pour
    tenir compte de l'augmentation des distances de freinage.
- id: 108
  category: defensive_driving
  question: Si vous vous sentez somnolent en conduisant lors d'un long voyage au Québec,
    quel est le seul moyen efficace de combattre la fatigue selon la SAAQ ?
  choices:
    A: Ouvrir la fenêtre pour avoir de l'air frais
    B: Augmenter le volume de la radio
    C: Boire du café ou des boissons énergisantes
    D: S'arrêter pour une courte sieste ou changer de conducteur
  answer: D
  explanation: La SAAQ souligne que les astuces comme le café ou l'air frais sont
    temporaires et inefficaces ; le sommeil est le seul véritable remède à la fatigue.
- id: 109
  category: defensive_driving
  question: Si l'arrière de votre véhicule commence à déraper vers la droite sur une
    route glacée, que devriez-vous faire ?
  choices:
    A: Tourner le volant vers la gauche
    B: Tourner le volant vers la droite
    C: Freiner brusquement immédiatement
    D: Accélérer pour redresser le véhicule
  answer: B
  explanation: En cas de dérapage, vous devez toujours diriger le volant dans la direction
    où vous voulez que l'avant du véhicule aille, ce qui correspond à la même direction
    que celle où l'arrière du véhicule dérape.
- id: 110
  category: defensive_driving
  question: Pour pratiquer l'« écoconduite » et maintenir la sécurité, la SAAQ recommande
    d'éviter de laisser tourner votre moteur au ralenti pendant plus de combien de
    secondes ?
  choices:
    A: 10 secondes
    B: 60 secondes
    C: 3 minutes
    D: 5 minutes
  answer: B
  explanation: La SAAQ et les directives environnementales suggèrent que si vous êtes
    arrêté pendant plus de 60 secondes (sauf dans la circulation), vous devriez couper
    votre moteur pour économiser du carburant et réduire les émissions.
- id: 111
  category: defensive_driving
  question: Selon la SAAQ, quelle est la distance de suivi minimale recommandée derrière
    un autre véhicule dans des conditions de conduite idéales ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 4 secondes
    D: 5 mètres
    E: null
  answer: B
  explanation: La SAAQ recommande une distance de suivi minimale d'au moins 2 secondes
    dans des conditions idéales pour permettre un temps de réaction suffisant en cas
    de changements soudains.
- id: 112
  category: defensive_driving
  question: Pour maintenir un bon temps d'anticipation visuelle, la SAAQ recommande
    aux conducteurs de balayer la route du regard jusqu'à quelle distance devant eux
    ?
  choices:
    A: 2 à 5 secondes
    B: 5 à 8 secondes
    C: 10 à 12 secondes
    D: 20 à 30 secondes
  answer: C
  explanation: Les directives de conduite préventive de la SAAQ suggèrent de regarder
    de 10 à 12 secondes devant soi en ville et encore plus loin sur les autoroutes
    pour anticiper les dangers potentiels.
- id: 113
  category: defensive_driving
  question: En vertu de la loi sur le « corridor de sécurité » du Québec, que devez-vous
    faire à l'approche d'une voiture de police dont les gyrophares sont activés et
    qui est immobilisée sur l'accotement ?
  choices:
    A: Maintenir sa vitesse mais klaxonner pour alerter l'agent
    B: S'arrêter immédiatement au milieu de la voie
    C: Ralentir et, s'il est sécuritaire de le faire, changer de voie pour laisser
      une voie d'espace
    D: Accélérer pour quitter la zone le plus rapidement possible
  answer: C
  explanation: La loi sur le corridor de sécurité exige que les conducteurs ralentissent
    et changent de voie (si c'est sécuritaire) à l'approche d'un véhicule d'urgence,
    d'une dépanneuse ou d'un véhicule de surveillance dont les feux sont activés.
- id: 114
  category: defensive_driving
  question: Quelle est l'exigence de vérification de l'« angle mort » avant de changer
    de voie au Québec ?
  choices:
    A: Vérifier uniquement le rétroviseur intérieur
    B: Vérifier uniquement les rétroviseurs extérieurs
    C: Tourner la tête pour regarder par la fenêtre latérale dans la direction du
      déplacement
    D: Se fier uniquement aux capteurs de détection d'angle mort
  answer: C
  explanation: Une vérification par-dessus l'épaule (tourner la tête) est obligatoire
    pour voir les véhicules qui ne sont pas visibles dans le rétroviseur intérieur
    ou les rétroviseurs extérieurs avant tout changement de voie ou virage.
- id: 115
  category: defensive_driving
  question: Lorsque vous conduisez sur une route glacée au Québec, comment devez-vous
    appliquer les freins si votre véhicule n'est PAS équipé d'un système de freinage
    antiblocage (ABS) ?
  choices:
    A: Appuyer fort sur la pédale et la maintenir enfoncée
    B: Pomper la pédale de frein rapidement
    C: Appliquer le frein d'urgence
    D: Passer au point mort et ne pas utiliser les freins
  answer: B
  explanation: Sur les véhicules sans ABS, vous devez pomper les freins pour empêcher
    les roues de se bloquer et de provoquer un dérapage. Si vous avez l'ABS, vous
    devez appliquer une pression ferme et constante.
- id: 116
  category: defensive_driving
  question: Si vous suivez un gros camion commercial sur une autoroute du Québec,
    pourquoi devriez-vous augmenter votre distance de suivi au-delà des 2 secondes
    standard ?
  choices:
    A: Pour permettre au conducteur du camion de vous voir dans ses rétroviseurs
    B: Parce que les camions peuvent s'arrêter beaucoup plus vite que les voitures
    C: Pour éviter les gaz d'échappement du camion
    D: Parce que les camions sont légalement tenus de conduire plus lentement
  answer: A
  explanation: Augmenter la distance derrière les véhicules lourds garantit que vous
    ne vous trouvez pas dans leur « zone de non-visibilité » (angle mort) et vous
    permet de voir la route devant vous plus clairement.
- id: 117
  category: defensive_driving
  question: Si un véhicule venant en sens inverse la nuit n'abaisse pas ses feux de
    route (pleins phares), où devez-vous regarder pour éviter d'être ébloui ?
  choices:
    A: Directement vers les phares du véhicule arrivant en face
    B: Vers la ligne centrale de la route
    C: Vers le bord droit de la chaussée
    D: Fermer les yeux momentanément
  answer: C
  explanation: Pour éviter l'éblouissement causé par les feux de route des véhicules
    venant en sens inverse, vous devez regarder vers le bord droit de la route (la
    ligne blanche) pour guider votre direction tout en maintenant une vision périphérique.
- id: 118
  category: defensive_driving
  question: Au Québec, quelle est l'exigence légale concernant la neige et la glace
    sur votre véhicule avant de conduire ?
  choices:
    A: Seul le pare-brise doit être dégagé
    B: Seuls les phares doivent être dégagés
    C: Le véhicule doit être entièrement déneigé et déglacé de toute matière susceptible
      de se détacher
    D: Il n'y a pas de loi spécifique ; c'est seulement une recommandation
  answer: C
  explanation: Le Code de la sécurité routière stipule qu'un véhicule doit être dégagé
    de toute matière (neige, glace) qui pourrait se détacher et représenter un danger
    pour les autres usagers de la route. Des amendes peuvent être données pour la
    « neige volante ».
- id: 119
  category: defensive_driving
  question: À l'approche d'une intersection, quelle est la séquence de balayage visuel
    correcte recommandée pour la conduite préventive ?
  choices:
    A: À gauche, puis à droite
    B: À droite, puis à gauche
    C: À gauche, au centre, à droite, puis à gauche de nouveau
    D: Droit devant seulement
  answer: C
  explanation: Vous devez d'abord regarder à gauche (car ce trafic est le plus proche
    de vous), puis au centre, puis à droite, et enfin à gauche de nouveau avant de
    continuer pour vous assurer qu'aucun nouveau danger n'est apparu.
- id: 120
  category: defensive_driving
  question: Au Québec, qu'advient-il des amendes pour excès de vitesse lorsque l'infraction
    est commise dans une zone de travaux désignée pendant les périodes de travail
    ?
  choices:
    A: Elles restent les mêmes
    B: Elles sont doublées
    C: Elles sont triplées
    D: Le permis de conduire est automatiquement suspendu
  answer: B
  explanation: En vertu du Code de la sécurité routière, les amendes pour excès de
    vitesse sont doublées lorsque l'infraction est commise dans une zone de travaux
    où des travailleurs sont présents.
- id: 121
  category: alcohol_drugs_health
  question: Au Québec, quelle est la limite légale de taux d'alcoolémie (BAC) pour
    un conducteur de 25 ans ou plus titulaire d'un permis de classe 5 complet ?
  choices:
    A: 0,05 (50 mg d'alcool par 100 ml de sang)
    B: 0,08 (80 mg d'alcool par 100 ml de sang)
    C: 0,10 (100 mg d'alcool par 100 ml de sang)
    D: 0,02 (20 mg d'alcool par 100 ml de sang)
  answer: B
  explanation: Pour la plupart des conducteurs adultes titulaires d'un permis complet
    au Québec, la limite légale est de 0,08. Cependant, dépasser cette limite ou avoir
    les facultés affaiblies par n'importe quelle quantité d'alcool ou de drogue peut
    entraîner des poursuites criminelles.
- id: 122
  category: alcohol_drugs_health
  question: Le Code de la sécurité routière du Québec applique une politique de «
    zéro tolérance » concernant les drogues pour quel groupe de conducteurs ?
  choices:
    A: Uniquement les titulaires d'un permis d'apprenti conducteur
    B: Uniquement les conducteurs de moins de 21 ans
    C: Uniquement les conducteurs de camions commerciaux
    D: Tous les conducteurs, peu importe l'âge ou le type de permis
  answer: D
  explanation: Le Québec a une politique de zéro tolérance pour les drogues (y compris
    le cannabis) pour tous les conducteurs. Il est interdit de conduire s'il y a une
    présence décelable de cannabis ou d'autres drogues dans votre salive, votre sang
    ou d'autres fluides corporels.
- id: 123
  category: alcohol_drugs_health
  question: Si un conducteur est intercepté avec un taux d'alcoolémie supérieur à
    0,08 pour la première fois, son permis de conduire est immédiatement suspendu
    sur le champ pour combien de jours ?
  choices:
    A: 24 heures
    B: 30 jours
    C: 90 jours
    D: 1 an
  answer: C
  explanation: En vertu du Code de la sécurité routière, une suspension immédiate
    de 90 jours est déclenchée si un conducteur échoue à un test d'alcootest (taux
    d'alcoolémie supérieur à 0,08) ou refuse de fournir un échantillon.
- id: 124
  category: alcohol_drugs_health
  question: Dans quelle circonstance un véhicule sera-t-il immédiatement mis en fourrière
    pour 30 jours au Québec ?
  choices:
    A: Si le taux d'alcoolémie du conducteur est supérieur à 0,08 mais inférieur à
      0,16
    B: Si le taux d'alcoolémie du conducteur est supérieur à 0,16 ou s'il refuse de
      fournir un échantillon
    C: Si le conducteur est pris en excès de vitesse de 20 km/h
    D: Si le permis du conducteur est expiré depuis moins d'une semaine
  answer: B
  explanation: Un véhicule est immédiatement mis en fourrière pour 30 jours si le
    conducteur a un taux d'alcoolémie supérieur à 0,16 (le double de la limite légale)
    ou s'il refuse d'obéir à l'ordre d'un agent de la paix de fournir un échantillon
    d'haleine ou de sang.
- id: 125
  category: alcohol_drugs_health
  question: Quel est le taux d'alcoolémie maximal autorisé pour un conducteur de taxi,
    d'autobus ou de minibus lorsqu'il est en service ?
  choices:
    A: 0,00 (Zéro tolérance)
    B: 0,02
    C: 0,05
    D: 0,08
  answer: A
  explanation: Les conducteurs d'autobus, de minibus et de taxis sont soumis à la
    règle du zéro alcool dans l'exercice de leurs fonctions.
- id: 126
  category: alcohol_drugs_health
  question: Si un conducteur est soumis à la règle du « zéro alcool » et qu'il est
    pris avec de l'alcool dans son organisme, combien de points d'inaptitude sont
    ajoutés à son dossier ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: B
  explanation: Une violation de la règle du zéro alcool entraîne une suspension immédiate
    de 90 jours, une amende et l'inscription de 4 points d'inaptitude au dossier du
    conducteur.
- id: 127
  category: alcohol_drugs_health
  question: Un conducteur reconnu coupable d'une première infraction de conduite avec
    facultés affaiblies avec un taux d'alcoolémie supérieur à 0,16 doit utiliser un
    anti-démarreur éthylométrique pendant au moins combien de temps pour récupérer
    ses privilèges de conduite ?
  choices:
    A: 6 mois
    B: 1 an
    C: 2 ans
    D: 5 ans
  answer: C
  explanation: Pour une première infraction avec un taux d'alcoolémie supérieur à
    0,16, le contrevenant est tenu de faire installer un anti-démarreur éthylométrique
    dans son véhicule pendant une période minimale de 2 ans après la fin de la suspension
    de son permis.
- id: 128
  category: alcohol_drugs_health
  question: 'Selon la SAAQ, si vous recevez un diagnostic de condition médicale pouvant
    affecter votre conduite, vous devez les en informer dans un délai de :'
  choices:
    A: 10 jours
    B: 30 jours
    C: 60 jours
    D: Au moment de votre prochain renouvellement de permis
  answer: B
  explanation: Les conducteurs sont légalement tenus de signaler à la SAAQ tout changement
    de leur état de santé susceptible d'affecter leur capacité à conduire de façon
    sécuritaire dans les 30 jours suivant le changement.
- id: 129
  category: alcohol_drugs_health
  question: Quel est l'effet de la consommation simultanée d'alcool et de drogues
    (comme le cannabis) avant de conduire ?
  choices:
    A: Les effets de chacun s'annulent
    B: Les effets sont les mêmes que s'ils étaient pris séparément
    C: Les effets sont multipliés de façon significative, augmentant l'altération
      des facultés
    D: Les effets ne durent que 30 minutes
  answer: C
  explanation: La combinaison d'alcool et de drogues crée un effet synergique, ce
    qui signifie que l'altération des facultés est beaucoup plus grande que la somme
    des effets individuels de chaque substance.
- id: 130
  category: alcohol_drugs_health
  question: Au Québec, un agent de police peut-il exiger qu'un conducteur se soumette
    à un test de coordination physique (STF) sur le bord de la route ?
  choices:
    A: Non, seuls les alcootests sont légaux
    B: Oui, s'il a des motifs raisonnables de soupçonner que le conducteur a de la
      drogue ou de l'alcool dans son organisme
    C: Oui, mais seulement si le conducteur a déjà échoué à un alcootest
    D: Seulement si le conducteur a moins de 18 ans
  answer: B
  explanation: Les agents de police au Québec peuvent exiger un test de sobriété normalisé
    (SFST/STF) s'ils soupçonnent que les capacités d'un conducteur sont affaiblies
    par l'alcool, la drogue ou une combinaison des deux.
- id: 131
  category: alcohol_drugs_health
  question: Laquelle des affirmations suivantes est vraie concernant la règle du «
    zéro alcool » pour les conducteurs de moins de 22 ans ?
  choices:
    A: Elle ne s'applique que s'ils conduisent la nuit
    B: Elle s'applique à eux quel que soit le type de permis qu'ils détiennent
    C: Elle ne s'applique que s'ils détiennent un permis d'apprenti conducteur
    D: Elle ne s'applique pas s'ils sont accompagnés d'un adulte
  answer: B
  explanation: Au Québec, tous les conducteurs de 21 ans et moins sont soumis à la
    règle du zéro alcool, qu'ils détiennent un permis d'apprenti conducteur, probatoire
    ou un permis de conduire régulier.
- id: 132
  category: alcohol_drugs_health
  question: Si un conducteur prend un médicament sur ordonnance qui provoque de la
    somnolence, quelle est sa responsabilité légale au Québec ?
  choices:
    A: Il peut conduire tant qu'il respecte la limite de vitesse
    B: Il ne doit pas conduire, car la conduite avec les facultés affaiblies par des
      médicaments est une infraction
    C: Il peut conduire s'il a une note du médecin dans la voiture
    D: Il ne peut conduire que pendant les heures de clarté
  answer: B
  explanation: Le Code de la sécurité routière interdit de conduire si vos capacités
    sont affaiblies par toute substance, y compris les médicaments sur ordonnance
    ou en vente libre qui provoquent des effets secondaires comme la somnolence ou
    le ralentissement des réflexes.
- id: 133
  category: alcohol_drugs_health
  question: Quelle est la limite de taux d'alcoolémie (BAC) pour les conducteurs de
    « véhicules lourds » (ceux dont la masse totale en charge est de 4 500 kg ou plus)
    au Québec ?
  choices:
    A: 0,00
    B: 0,05
    C: 0,08
    D: 0,10
  answer: B
  explanation: Les conducteurs de véhicules lourds au Québec sont soumis à une limite
    d'alcoolémie plus stricte de 0,05 (50 mg d'alcool par 100 ml de sang).
- id: 134
  category: alcohol_drugs_health
  question: Si un conducteur est reconnu coupable d'une deuxième infraction de conduite
    avec facultés affaiblies sur une période de 10 ans, quelle est la durée minimale
    de l'interdiction de conduire ordonnée par le tribunal ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: B
  explanation: En vertu du Code criminel (qui s'applique au Québec), une deuxième
    infraction pour conduite avec facultés affaiblies entraîne une interdiction de
    conduire minimale de 2 ans, en plus des autres sanctions provinciales.
- id: 135
  category: alcohol_drugs_health
  question: En vertu du Code de la sécurité routière du Québec, quelle est la règle
    de la « tolérance zéro » concernant le cannabis et les autres drogues ?
  choices:
    A: Les conducteurs peuvent avoir jusqu'à 2 ng de THC dans le sang.
    B: Il est interdit de conduire avec toute présence décelable de cannabis ou d'autres
      drogues dans la salive ou le sang.
    C: Seuls les titulaires d'un permis d'apprenti ou probatoire sont soumis à la
      tolérance zéro pour les drogues.
    D: La tolérance zéro ne s'applique qu'aux conducteurs de moins de 21 ans.
  answer: B
  explanation: Le Québec a une politique de tolérance zéro pour les drogues. Il est
    strictement interdit à quiconque de conduire un véhicule routier s'il y a une
    présence décelable de cannabis ou d'autres drogues interdites dans son organisme.
- id: 136
  category: alcohol_drugs_health
  question: Si un conducteur est intercepté avec un taux d'alcoolémie de 0,16 ou plus
    pour la première fois, qu'arrive-t-il à son véhicule ?
  choices:
    A: Il est remorqué jusqu'à son domicile à ses frais.
    B: Il est immédiatement saisi et mis en fourrière pour 30 jours.
    C: Il n'est saisi que s'il a une condamnation antérieure.
    D: Il est vendu par la SAAQ pour payer les frais de justice.
  answer: B
  explanation: Pour une première infraction avec un taux d'alcoolémie de 0,16 ou plus,
    ou pour refus de fournir un échantillon, le véhicule que la personne conduisait
    est immédiatement saisi et mis en fourrière pour 30 jours.
- id: 137
  category: alcohol_drugs_health
  question: Selon la SAAQ, de combien de temps disposez-vous pour signaler un changement
    de votre état de santé qui pourrait affecter votre capacité à conduire ?
  choices:
    A: Dans les 10 jours
    B: Dans les 30 jours
    C: Dans les 60 jours
    D: Uniquement lors du renouvellement de votre permis
  answer: B
  explanation: Les conducteurs au Québec sont légalement tenus d'aviser la SAAQ dans
    les 30 jours suivant tout changement de leur état de santé qui pourrait affecter
    leur capacité à conduire de façon sécuritaire.
- id: 138
  category: alcohol_drugs_health
  question: Quelle est la limite légale maximale d'alcoolémie pour les conducteurs
    de véhicules lourds, de taxis ou d'autobus au Québec ?
  choices:
    A: 0,00
    B: 0,02
    C: 0,05
    D: 0,08
  answer: C
  explanation: Au Québec, la limite d'alcoolémie pour les conducteurs de véhicules
    lourds, d'autobus, de minibus et de taxis est de 0,05.
- id: 139
  category: alcohol_drugs_health
  question: Comment la consommation d'alcool affecte-t-elle spécifiquement la vision
    d'un conducteur ?
  choices:
    A: Elle améliore la vision nocturne en dilatant les pupilles.
    B: Elle rétrécit le champ de vision (vision en tunnel).
    C: Elle augmente la capacité à juger les distances avec précision.
    D: Elle n'a aucun effet sur la vision, seulement sur le temps de réaction.
  answer: B
  explanation: L'alcool réduit la vision périphérique, entraînant une « vision en
    tunnel », et rend difficile l'adaptation des yeux à l'éblouissement ou aux changements
    de lumière.
- id: 140
  category: alcohol_drugs_health
  question: Un conducteur soumis à la règle du zéro alcool qui enfreint cette règle
    s'expose à une suspension immédiate de 90 jours et à combien de points d'inaptitude
    ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: B
  explanation: La violation de la règle du zéro alcool entraîne une suspension immédiate
    du permis de 90 jours, une amende et l'inscription de 4 points d'inaptitude au
    dossier de conduite.
- id: 141
  category: alcohol_drugs_health
  question: Au Québec, qui est responsable des coûts associés à l'installation et
    à la location d'un antidémarreur éthylométrique (IID) ?
  choices:
    A: La SAAQ
    B: Le gouvernement provincial
    C: La compagnie d'assurance du conducteur
    D: Le conducteur
  answer: D
  explanation: Le conducteur est responsable de tous les coûts liés à l'antidémarreur
    éthylométrique, y compris l'installation, la location et les téléchargements périodiques
    de données.
- id: 142
  category: alcohol_drugs_health
  question: 'Selon les consignes de sécurité de la SAAQ, rester éveillé pendant 18
    heures consécutives produit un niveau de facultés affaiblies équivalent à un taux
    d''alcoolémie (BAC) de :'
  choices:
    A: 0,02
    B: 0,05
    C: 0,08
    D: 0,10
  answer: B
  explanation: La fatigue est une cause majeure d'accidents. Des études citées par
    la SAAQ montrent que 18 heures d'éveil équivalent à un taux d'alcoolémie de 0,05,
    et 24 heures équivalent à 0,10.
- id: 143
  category: alcohol_drugs_health
  question: Si vous prenez des médicaments sur ordonnance, que devriez-vous faire
    avant de conduire au Québec ?
  choices:
    A: Conduire uniquement pendant les heures de clarté.
    B: Consulter un médecin ou un pharmacien sur les effets du médicament sur la conduite.
    C: Attendre au moins une heure après avoir pris le médicament avant de conduire.
    D: Rien, car les médicaments sur ordonnance sont légaux et n'affectent pas la
      conduite.
  answer: B
  explanation: De nombreux médicaments sur ordonnance et en vente libre peuvent provoquer
    de la somnolence ou une baisse de la vigilance. Vous devez consulter un professionnel
    de la santé pour vous assurer que vous pouvez conduire en toute sécurité.
- id: 144
  category: alcohol_drugs_health
  question: Si un conducteur est reconnu coupable d'une deuxième infraction liée à
    l'alcool dans un délai de 10 ans au Québec, quelle est la durée minimale de la
    saisie du véhicule ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 1 an
  answer: C
  explanation: En cas de récidive (deuxième fois ou plus en 10 ans), le véhicule que
    conduit le contrevenant est saisi et mis en fourrière pour une période de 90 jours.
- id: 145
  category: penalties_and_points
  question: Combien de points d'inaptitude sont inscrits au dossier pour le non-port
    de la ceinture de sécurité lors de la conduite au Québec ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Les conducteurs au Québec reçoivent 3 points d'inaptitude et une amende
    pour avoir omis de porter leur ceinture de sécurité.
- id: 146
  category: penalties_and_points
  question: Combien de points d'inaptitude sont inscrits au dossier pour avoir omis
    de rester sur les lieux d'un accident (délit de fuite) ?
  choices:
    A: 4 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: C
  explanation: Le fait de ne pas remplir ses obligations sur les lieux d'un accident
    (délit de fuite) entraîne l'inscription de 9 points d'inaptitude au Québec.
- id: 147
  category: penalties_and_points
  question: Combien de points d'inaptitude sont inscrits au dossier pour avoir suivi
    un autre véhicule de trop près au Québec ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 0 point (amende seulement)
  answer: A
  explanation: Suivre un véhicule de trop près entraîne l'ajout de 2 points d'inaptitude
    au dossier du conducteur.
- id: 148
  category: penalties_and_points
  question: Dans quelle circonstance un conducteur peut-il se voir attribuer 3 points
    d'inaptitude concernant le dépassement ?
  choices:
    A: Effectuer un dépassement par la droite lorsque ce n'est pas permis
    B: Dépasser un cycliste avec moins d'un mètre de distance
    C: Faire un excès de vitesse lors d'un dépassement
    D: Omettre de signaler un changement de voie
  answer: A
  explanation: Le fait de dépasser par la droite lorsque ce n'est pas autorisé par
    le Code de la sécurité routière entraîne l'inscription de 3 points d'inaptitude.
- id: 149
  category: penalties_and_points
  question: Combien de points d'inaptitude sont inscrits au dossier pour avoir franchi
    un passage à niveau lorsque les feux de signalisation clignotent ou que la barrière
    est fermée ?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: 9 points
  answer: B
  explanation: Franchir ou tenter de franchir un passage à niveau lorsque c'est interdit
    (feux clignotants, barrières abaissées) entraîne l'inscription de 3 points d'inaptitude.
- id: 150
  category: penalties_and_points
  question: Si un conducteur est pris à conduire alors que son permis est suspendu
    pour une infraction au Code criminel, son véhicule sera saisi et mis en fourrière
    pour combien de temps ?
  choices:
    A: 7 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Conduire alors que le permis est suspendu ou révoqué entraîne une saisie
    immédiate et une mise en fourrière du véhicule pour une période de 30 jours.
- id: 151
  category: penalties_and_points
  question: Au Québec, le fait de refuser de fournir un échantillon d'haleine à un
    agent de la paix entraîne laquelle des conséquences suivantes ?
  choices:
    A: Une simple amende et une suspension de 24 heures
    B: Les mêmes sanctions que pour un taux d'alcoolémie (BAC) supérieur à 160 mg/100
      ml
    C: Une suspension de permis de 30 jours seulement
    D: Aucune sanction s'il s'agit d'une première infraction
  answer: B
  explanation: Le refus de fournir un échantillon d'haleine ou de sang est une infraction
    criminelle qui entraîne les mêmes sanctions sévères que la conduite avec un taux
    d'alcoolémie de 0,16 ou plus (le palier le plus élevé des sanctions pour facultés
    affaiblies).
- id: 152
  category: penalties_and_points
  question: Au Québec, un « grand excès de vitesse » dans une zone où la limite est
    de 60 km/h ou moins est défini comme le fait de conduire à au moins combien de
    km/h au-dessus de la limite affichée ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: C
  explanation: Selon la SAAQ, un grand excès de vitesse dans une zone de 60 km/h ou
    moins se produit lorsqu'un conducteur dépasse la limite de 40 km/h ou plus.
- id: 153
  category: penalties_and_points
  question: Combien de points d'inaptitude sont inscrits à votre dossier pour avoir
    omis de s'immobiliser à un passage à niveau lorsque les feux de signalisation
    clignotent ?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: 9 points
  answer: B
  explanation: En vertu du Code de la sécurité routière du Québec, le fait de ne pas
    respecter un signal à un passage à niveau entraîne l'inscription de 3 points d'inaptitude.
- id: 154
  category: penalties_and_points
  question: Si un conducteur au Québec refuse de fournir un échantillon d'haleine
    à un agent de la paix, quelle est la sanction administrative immédiate concernant
    son permis ?
  choices:
    A: Une suspension de 24 heures
    B: Une suspension de 30 jours
    C: Une suspension de 90 jours
    D: Une révocation d'un an
  answer: C
  explanation: Le refus de fournir un échantillon d'haleine ou de fluide entraîne
    une suspension immédiate du permis pour 90 jours, soit la même sanction que pour
    l'échec d'un test d'alcoolémie avec un taux élevé.
- id: 155
  category: penalties_and_points
  question: Au Québec, quel est le nombre standard de points d'inaptitude pour le
    non-port de la ceinture de sécurité en conduisant ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Le fait de ne pas porter correctement la ceinture de sécurité entraîne
    3 points d'inaptitude et une amende.
- id: 156
  category: penalties_and_points
  question: Combien de points d'inaptitude sont ajoutés à votre dossier pour avoir
    omis de céder le passage à un panneau d'arrêt ou à un feu rouge ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Le fait de ne pas s'arrêter à un feu rouge ou à un panneau d'arrêt,
    ou de ne pas céder le passage à ces endroits, entraîne 3 points d'inaptitude.
- id: 157
  category: penalties_and_points
  question: Si vous êtes pris à conduire alors que votre permis est suspendu, le véhicule
    que vous conduisez sera immédiatement saisi pour quelle durée ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 90 jours
  answer: C
  explanation: Conduire alors que le permis est suspendu ou révoqué entraîne la saisie
    immédiate du véhicule pour 30 jours, peu importe qui en est le propriétaire.
- id: 158
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour un dépassement illégal
    par la droite d'un autre véhicule ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Dépasser par la droite lorsque ce n'est pas permis par le Code de la
    sécurité routière entraîne 3 points d'inaptitude.
- id: 159
  category: penalties_and_points
  question: Combien de points d'inaptitude sont donnés pour avoir omis de céder le
    passage à un véhicule d'urgence dont les sirènes ou les gyrophares sont activés
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Le fait de ne pas céder le passage à un véhicule d'urgence (police,
    pompiers, ambulance) entraîne 4 points d'inaptitude au Québec.
- id: 160
  category: penalties_and_points
  question: Pour une première infraction de « grand excès de vitesse », pendant combien
    de temps le permis du conducteur est-il immédiatement suspendu sur-le-champ ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 15 jours
    D: 30 jours
  answer: B
  explanation: Une première infraction de grand excès de vitesse entraîne une suspension
    immédiate du permis de conduire pour une durée de 7 jours. Les infractions subséquentes
    entraînent des suspensions plus longues.
- id: 161
  category: penalties_and_points
  question: Combien de points d'inaptitude sont inscrits au dossier pour avoir franchi
    une ligne double continue sur une route du Québec ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Le franchissement d'une ligne double continue pour dépasser ou changer
    de voie est une infraction qui entraîne 3 points d'inaptitude.
- id: 162
  category: penalties_and_points
  question: Pour les conducteurs de véhicules lourds (classe 1, 2 ou 3) au Québec,
    quelle est la limite légale maximale de taux d'alcoolémie (BAC) ?
  choices:
    A: 0,00
    B: 0,02
    C: 0,05
    D: 0,08
  answer: C
  explanation: Bien que la limite générale soit de 0,08, les conducteurs de véhicules
    lourds, d'autobus et de taxis sont soumis à une limite de taux d'alcoolémie plus
    stricte de 0,05 au Québec.
- id: 163
  category: penalties_and_points
  question: Combien de points d'inaptitude sont ajoutés au dossier d'un conducteur
    pour avoir omis de signaler son intention de tourner ou de changer de voie ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: L'omission d'utiliser les clignotants lors d'un changement de voie
    ou d'un virage entraîne 2 points d'inaptitude.
- id: 164
  category: sharing_the_road
  question: En vertu de la loi sur le « corridor de sécurité » au Québec, que devez-vous
    faire lorsqu'un véhicule d'urgence est immobilisé sur l'accotement avec ses gyrophares
    activés ?
  choices:
    A: Maintenir votre vitesse et rester dans votre voie.
    B: Accélérer pour dépasser le véhicule le plus rapidement possible.
    C: Ralentir et, si cela peut se faire en toute sécurité, créer un corridor de
      sécurité en vous tassant.
    D: S'arrêter immédiatement au milieu de l'autoroute.
  answer: C
  explanation: La loi sur le corridor de sécurité exige que les conducteurs ralentissent
    et changent de voie (si cela est sécuritaire) pour créer un corridor de sécurité
    pour les véhicules d'urgence, les dépanneuses ou les véhicules de surveillance
    arrêtés avec leurs feux clignotants.
- id: 165
  category: sharing_the_road
  question: Combien de points d'inaptitude sont ajoutés à votre dossier pour avoir
    omis de respecter la loi sur le corridor de sécurité au Québec ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Le non-respect du corridor de sécurité entraîne 4 points d'inaptitude
    et une amende allant de 200 $ à 300 $.
- id: 166
  category: sharing_the_road
  question: Au Québec, quelle est l'amende pour l'emportiérage (ouvrir la portière
    d'un véhicule stationné sans s'assurer que cela peut être fait en toute sécurité
    pour les cyclistes ou les autres) ?
  choices:
    A: Entre 30 $ et 60 $
    B: Entre 100 $ et 150 $
    C: Entre 200 $ et 300 $
    D: Exactement 500 $
  answer: C
  explanation: L'ouverture d'une portière de véhicule sans vérifier la présence de
    cyclistes ou d'autres usagers de la route entraîne une amende de 200 $ à 300 $
    en vertu du Code de la sécurité routière.
- id: 167
  category: sharing_the_road
  question: À l'approche d'un passage pour piétons où un piéton a manifesté clairement
    son intention de traverser, quelle est l'obligation du conducteur au Québec ?
  choices:
    A: Ralentir mais continuer à avancer si le piéton n'est pas encore descendu du
      trottoir.
    B: Klaxonner pour avertir le piéton de votre arrivée.
    C: S'immobiliser et laisser le piéton traverser.
    D: S'arrêter uniquement s'il y a un panneau d'arrêt ou un feu rouge.
  answer: C
  explanation: Les conducteurs doivent s'immobiliser pour les piétons qui manifestent
    clairement leur intention de traverser à un passage pour piétons désigné, même
    s'il n'y a pas de feux de circulation.
- id: 168
  category: sharing_the_road
  question: Laquelle des affirmations suivantes est vraie concernant les autobus scolaires
    sur une route séparée par un terre-plein central ou une barrière physique ?
  choices:
    A: Les conducteurs des deux côtés doivent s'arrêter pour les feux rouges clignotants.
    B: Seuls les conducteurs qui suivent l'autobus doivent s'arrêter ; la circulation
      venant en sens inverse n'a pas à le faire.
    C: Personne n'a à s'arrêter si la route comporte plus de 3 voies.
    D: Les conducteurs doivent ralentir à 20 km/h mais n'ont pas besoin de s'arrêter.
  answer: B
  explanation: Si la route est séparée par un terre-plein, les conducteurs circulant
    dans la direction opposée à l'autobus scolaire ne sont pas tenus de s'arrêter.
- id: 169
  category: sharing_the_road
  question: Lors du partage de la route avec un véhicule lourd (camion), où se situent
    ses « angles morts » ?
  choices:
    A: Uniquement directement derrière la remorque.
    B: Uniquement sur le côté gauche de la cabine.
    C: Directement devant, directement derrière et sur les deux côtés.
    D: Il n'y a pas d'angles morts si le camion possède des miroirs convexes.
  answer: C
  explanation: Les véhicules lourds ont des angles morts importants à l'avant, à l'arrière
    et sur les deux côtés. Si vous ne pouvez pas voir le visage du conducteur dans
    ses rétroviseurs, il ne peut pas vous voir.
- id: 170
  category: sharing_the_road
  question: Si vous tournez à droite à une intersection et qu'un cycliste est positionné
    à votre droite et a l'intention d'aller tout droit, que devez-vous faire ?
  choices:
    A: Accélérer pour tourner avant que le cycliste n'atteigne l'intersection.
    B: Céder le passage et laisser le cycliste passer avant de tourner.
    C: Klaxonner pour signaler au cycliste de s'arrêter.
    D: Tourner quand même, car les véhicules ont toujours la priorité sur les vélos.
  answer: B
  explanation: Les conducteurs doivent céder le passage aux cyclistes qui circulent
    tout droit lorsque le conducteur a l'intention de tourner à droite en coupant
    la trajectoire du cycliste.
- id: 171
  category: sharing_the_road
  question: Au Québec, quelle est la formation recommandée pour deux motocyclettes
    circulant ensemble dans une seule voie ?
  choices:
    A: Côte à côte.
    B: L'une directement derrière l'autre au centre.
    C: Une formation en quinconce (zigzag).
    D: Une sur l'accotement et l'autre dans la voie.
  answer: C
  explanation: La formation en quinconce est recommandée pour les motocyclettes afin
    d'offrir une meilleure visibilité et plus d'espace de manœuvre lors du partage
    d'une voie.
- id: 172
  category: sharing_the_road
  question: Lorsqu'un véhicule d'urgence (police, pompiers ou ambulance) approche
    avec sa sirène et ses gyrophares allumés, quelle est la bonne mesure à prendre
    ?
  choices:
    A: S'arrêter exactement là où vous êtes dans votre voie.
    B: Accélérer pour rester devant le véhicule.
    C: Se ranger vers la droite le plus possible et s'arrêter.
    D: Se ranger vers la gauche et s'arrêter.
  answer: C
  explanation: Les conducteurs doivent dégager la voie pour les véhicules d'urgence
    en se déplaçant vers le bord droit de la route et en s'immobilisant complètement.
- id: 173
  category: sharing_the_road
  question: Que signifie un panneau triangulaire orange avec une bordure rouge à l'arrière
    d'un véhicule ?
  choices:
    A: Le véhicule transporte des marchandises dangereuses.
    B: Le véhicule est un véhicule lent (moins de 40 km/h).
    C: Le véhicule est un chargement hors normes.
    D: Le véhicule est un chasse-neige.
  answer: B
  explanation: Ce panneau identifie les véhicules lents, tels que les tracteurs agricoles
    ou l'équipement de construction, qui circulent à des vitesses inférieures à 40
    km/h.
- id: 174
  category: sharing_the_road
  question: Au Québec, les cyclistes sont-ils autorisés à circuler sur le trottoir
    ?
  choices:
    A: Oui, c'est toujours plus sûr que la route.
    B: Oui, mais seulement s'ils ont plus de 18 ans.
    C: Non, sauf si un panneau l'autorise ou en cas d'urgence.
    D: Seulement s'ils conduisent une bicyclette motorisée.
  answer: C
  explanation: En vertu du Code de la sécurité routière, il est généralement interdit
    de circuler à vélo sur les trottoirs, sauf si la signalisation indique le contraire
    ou pour des nécessités de sécurité spécifiques.
- id: 175
  category: sharing_the_road
  question: Lorsqu'une voiture à traction animale ou une personne à cheval se trouve
    sur la route, que doit faire le conducteur ?
  choices:
    A: Klaxonner pour leur faire savoir que vous dépassez.
    B: Ralentir et ne dépasser que lorsque c'est sécuritaire, en laissant beaucoup
      d'espace.
    C: Faire des appels de phares pour augmenter la visibilité.
    D: Conduire le plus près possible pour les encourager à se déplacer vers l'accotement.
  answer: B
  explanation: Les conducteurs doivent être prudents à proximité des animaux, car
    ils peuvent être imprévisibles. Ralentissez, ne faites pas de bruits forts (comme
    klaxonner) et laissez un espace suffisant lors du dépassement.
- id: 176
  category: sharing_the_road
  question: Au Québec, lorsqu'un autobus scolaire a ses feux rouges clignotants allumés
    et son signal d'arrêt déployé, quelle est la distance minimale à laquelle vous
    devez arrêter votre véhicule de l'autobus ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: C
  explanation: Selon le Code de la sécurité routière du Québec, les conducteurs doivent
    immobiliser leur véhicule à au moins 5 mètres d'un autobus scolaire lorsque ses
    feux rouges clignotants sont en marche.
- id: 177
  category: sharing_the_road
  question: En vertu de la loi sur le « corridor de sécurité » au Québec, que doit
    faire un conducteur à l'approche d'un véhicule d'urgence ou d'une dépanneuse arrêté
    avec ses gyrophares activés ?
  choices:
    A: Maintenir sa vitesse et rester dans la voie actuelle
    B: Klaxonner pour alerter les travailleurs et continuer à la limite de vitesse
    C: Ralentir et, si cela peut se faire en toute sécurité, changer de voie pour
      créer un corridor de sécurité
    D: Accélérer pour passer la scène le plus rapidement possible
  answer: C
  explanation: La loi sur le corridor de sécurité exige que les conducteurs ralentissent
    et, si cela peut être fait en toute sécurité, changent de voie pour offrir une
    zone de sécurité au personnel d'urgence et aux conducteurs de dépanneuses.
- id: 178
  category: sharing_the_road
  question: Au Québec, vous approchez d'un autobus scolaire avec des feux rouges clignotants
    venant de la direction opposée sur une route séparée par un terre-plein central.
    Quelle est la règle ?
  choices:
    A: Vous devez vous arrêter à 5 mètres
    B: Vous devez vous arrêter seulement si des enfants traversent visiblement
    C: Vous n'êtes pas tenu de vous arrêter
    D: Vous devez ralentir à 20 km/h mais n'avez pas besoin de vous arrêter
  answer: C
  explanation: Les conducteurs circulant dans la direction opposée d'un autobus scolaire
    sur une chaussée séparée par un terre-plein physique (comme une bordure surélevée
    ou une bande de gazon) ne sont pas tenus de s'arrêter.
- id: 179
  category: sharing_the_road
  question: Laquelle des affirmations suivantes est vraie concernant la « circulation
    entre les voies » (conduire entre deux rangées de véhicules) pour les motocyclettes
    au Québec ?
  choices:
    A: C'est légal sur les autoroutes de plus de trois voies
    B: C'est légal seulement lorsque la circulation roule à moins de 30 km/h
    C: C'est strictement interdit
    D: C'est légal pour les cyclomoteurs mais pas pour les motocyclettes lourdes
  answer: C
  explanation: La circulation entre les voies est illégale au Québec. Les motocyclettes
    doivent occuper une voie complète et suivre les mêmes règles d'utilisation des
    voies que les autres véhicules motorisés.
- id: 180
  category: sharing_the_road
  question: À quoi fait référence le terme « No-Zone » lors du partage de la route
    avec des véhicules lourds (camions) ?
  choices:
    A: La zone où les camions ont l'interdiction de circuler
    B: Les angles morts autour du camion où le conducteur ne peut pas vous voir
    C: La voie réservée aux véhicules multioccupants
    D: La zone directement derrière un camion où l'aspiration est encouragée
  answer: B
  explanation: La « No-Zone » fait référence aux angles morts importants situés à
    l'avant, à l'arrière et sur les côtés des gros camions, où d'autres véhicules
    peuvent disparaître de la vue du conducteur.
- id: 181
  category: sharing_the_road
  question: Au Québec, quelle est la fourchette de l'amende de base (excluant les
    frais) pour avoir dépassé un autobus scolaire dont les feux rouges clignotent
    ?
  choices:
    A: 50 $ à 100 $
    B: 100 $ à 200 $
    C: 200 $ à 300 $
    D: 500 $ à 1 000 $
  answer: C
  explanation: L'amende de base pour ne pas s'être arrêté devant un autobus scolaire
    dont les feux clignotent est de 200 $ à 300 $, en plus de 9 points d'inaptitude
    et d'autres frais administratifs.
- id: 182
  category: sharing_the_road
  question: 'Lorsqu''un véhicule lourd effectue un virage à droite large à une intersection,
    vous devriez :'
  choices:
    A: Tenter de dépasser par la droite avant que le camion ne termine son virage
    B: Rester derrière le camion et attendre qu'il termine son virage
    C: Klaxonner pour informer le conducteur que vous êtes dans son angle mort
    D: Dépasser le camion par la gauche pendant qu'il tourne
  answer: B
  explanation: Les véhicules lourds ont besoin d'un espace supplémentaire pour tourner.
    Vous ne devriez jamais tenter de dépasser un camion par la droite pendant qu'il
    tourne, car vous pourriez vous retrouver dans son angle mort et être écrasé.
- id: 183
  category: sharing_the_road
  question: Pourquoi devriez-vous maintenir une distance de suivi plus grande lorsque
    vous conduisez derrière une motocyclette que derrière une voiture ?
  choices:
    A: Les motocyclettes peuvent s'arrêter beaucoup plus rapidement que les voitures
    B: Les motocyclettes sont légalement tenues d'avoir un espace de 100 mètres
    C: Les motocyclettes n'ont pas de feux de freinage
    D: Les motocyclettes accélèrent plus lentement
  answer: A
  explanation: Les motocyclettes sont plus légères et peuvent souvent s'arrêter plus
    rapidement que les voitures. De plus, les dangers de la route comme les nids-de-poule
    ou le gravier peuvent forcer un motocycliste à réagir soudainement.
- id: 184
  category: sharing_the_road
  question: Selon le Code de la sécurité routière du Québec, quelle est la responsabilité
    d'un conducteur ou d'un passager concernant l'ouverture d'une portière de véhicule
    ?
  choices:
    A: Le cycliste est toujours responsable d'éviter les portières ouvertes
    B: Vous devez vous assurer que cela peut être fait en toute sécurité sans obstruer
      la circulation ni heurter un cycliste
    C: Les portières ne devraient être ouvertes que du côté du trottoir
    D: Il n'y a pas de lois spécifiques concernant l'ouverture des portières dans
      la circulation
  answer: B
  explanation: C'est une infraction d'ouvrir la portière d'un véhicule routier à moins
    que cela ne puisse être fait en toute sécurité sans gêner le mouvement des autres
    usagers de la route, tels que les cyclistes (souvent appelé « emportiérage »).
- id: 185
  category: vehicle_information
  question: Au Québec, entre quelles dates les pneus d'hiver sont-ils obligatoires
    pour tous les véhicules de promenade immatriculés dans la province ?
  choices:
    A: 15 novembre au 15 avril
    B: 1er décembre au 15 mars
    C: 15 décembre au 15 mars
    D: 1er novembre au 1er mai
  answer: B
  explanation: Selon le Code de la sécurité routière, tous les véhicules de promenade
    immatriculés au Québec doivent être munis de pneus d'hiver du 1er décembre au
    15 mars inclusivement.
- id: 186
  category: vehicle_information
  question: Quelle est la profondeur de rainure minimale légale pour les pneus d'un
    véhicule de promenade au Québec ?
  choices:
    A: 1,0 mm
    B: 1,6 mm
    C: 2,5 mm
    D: 3,2 mm
  answer: B
  explanation: Au Québec, les pneus sont considérés comme usés et illégaux si la profondeur
    de la bande de roulement est inférieure à 1,6 mm (2/32 de pouce).
- id: 187
  category: vehicle_information
  question: Au Québec, quel est le pourcentage minimal de lumière que les vitres latérales
    avant doivent laisser passer ?
  choices:
    A: 35 %
    B: 50 %
    C: 70 %
    D: 85 %
  answer: C
  explanation: Le Code de la sécurité routière stipule que le pare-brise et les vitres
    latérales avant doivent laisser passer au moins 70 % de la lumière lorsqu'ils
    sont mesurés avec un photomètre.
- id: 188
  category: vehicle_information
  question: 'Au Québec, modifier le système d''échappement d''un véhicule pour le
    rendre plus bruyant que le système d''origine est :'
  choices:
    A: Légal si le niveau sonore est inférieur à 100 décibels.
    B: Légal pour les véhicules hors route seulement.
    C: Interdit en vertu du Code de la sécurité routière.
    D: Permis si le véhicule a plus de 25 ans.
  answer: C
  explanation: Il est interdit de modifier un système d'échappement de manière à augmenter
    le niveau sonore par rapport à l'équipement d'origine installé par le fabricant.
- id: 189
  category: vehicle_information
  question: Quelle est la règle concernant les couvre-plaques d'immatriculation au
    Québec ?
  choices:
    A: Les couvre-plaques transparents sont autorisés s'ils sont propres.
    B: Les couvre-plaques teintés sont autorisés si la plaque est toujours lisible.
    C: Tout matériau recouvrant la plaque qui nuit à la lisibilité ou aux cinémomètres
      photographiques est interdit.
    D: Les couvre-plaques sont obligatoires en hiver pour protéger la plaque du sel.
  answer: C
  explanation: La plaque d'immatriculation doit être libre de tout objet ou substance
    qui nuit à sa lisibilité ou à la capacité des cinémomètres photographiques (radars
    photo) de la lire. Cela inclut les couvre-plaques en plastique transparents ou
    teintés.
- id: 190
  category: vehicle_information
  question: Un véhicule de promenade au Québec doit être équipé au moins de quels
    rétroviseurs ?
  choices:
    A: Uniquement le rétroviseur intérieur.
    B: Uniquement le rétroviseur extérieur gauche.
    C: Un rétroviseur intérieur et un rétroviseur extérieur gauche.
    D: Les rétroviseurs extérieurs gauche et droit, sans rétroviseur intérieur requis.
  answer: C
  explanation: Tout véhicule de promenade doit posséder un rétroviseur intérieur et
    un rétroviseur extérieur gauche. Si le rétroviseur intérieur est obstrué, un rétroviseur
    extérieur droit devient obligatoire.
- id: 191
  category: vehicle_information
  question: Si un chargement dépasse l'arrière de votre véhicule de plus de combien
    de mètres, devez-vous y fixer un drapeau rouge ou un feu rouge ?
  choices:
    A: 0,5 mètre
    B: 1,0 mètre
    C: 1,5 mètre
    D: 2,0 mètres
  answer: B
  explanation: Si un chargement dépasse de plus de 1 mètre l'arrière du véhicule,
    un drapeau rouge (le jour) ou un feu rouge (la nuit) doit être fixé à l'extrémité
    du chargement.
- id: 192
  category: vehicle_information
  question: Au Québec, entre quelles dates les pneus à crampons (pneus cloutés) sont-ils
    autorisés sur les véhicules de promenade ?
  choices:
    A: Du 15 octobre au 1er mai
    B: Du 1er décembre au 15 mars
    C: Du 1er novembre au 1er avril
    D: Du 1er septembre au 1er juin
  answer: A
  explanation: Les pneus à crampons sont autorisés au Québec du 15 octobre au 1er
    mai inclusivement.
- id: 193
  category: vehicle_information
  question: Qui est responsable de s'assurer qu'un passager de moins de 16 ans porte
    sa ceinture de sécurité au Québec ?
  choices:
    A: Le passager lui-même
    B: Le propriétaire du véhicule
    C: Le conducteur du véhicule
    D: Les parents du passager, même s'ils ne sont pas présents
  answer: C
  explanation: Le conducteur est responsable de s'assurer que tous les passagers de
    moins de 16 ans sont correctement attachés. Si ce n'est pas le cas, le conducteur
    s'expose à une amende et à des points d'inaptitude.
- id: 194
  category: vehicle_information
  question: 'Tout véhicule automobile au Québec doit être muni d''un avertisseur sonore
    (klaxon) pouvant être entendu à une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Le Code de la sécurité routière exige qu'un véhicule automobile soit
    équipé d'un avertisseur sonore audible à une distance d'au moins 60 mètres.
- id: 195
  category: vehicle_information
  question: De quelle couleur doivent être les phares avant d'un véhicule automobile
    au Québec ?
  choices:
    A: Blanc
    B: Jaune
    C: Bleu
    D: Blanc ou ambre
  answer: A
  explanation: Selon la réglementation du Québec, les phares doivent émettre une lumière
    blanche. Bien que certains véhicules plus anciens aient eu des phares jaunes,
    les normes actuelles exigent le blanc pour la visibilité et la sécurité.
- id: 196
  category: vehicle_information
  question: Selon la loi québécoise, quel est le pourcentage minimal de lumière qui
    doit pouvoir passer à travers les vitres latérales avant d'un véhicule ?
  choices:
    A: 35 %
    B: 50 %
    C: 70 %
    D: 75 %
  answer: C
  explanation: Le Code de la sécurité routière stipule que les vitres latérales avant
    (à gauche et à droite du conducteur) doivent laisser passer au moins 70 % de la
    lumière.
- id: 197
  category: vehicle_information
  question: Quelle est la réglementation concernant la modification du système d'échappement
    (silencieux) d'un véhicule au Québec ?
  choices:
    A: Les modifications sont autorisées si elles augmentent la puissance.
    B: Les modifications sont autorisées tant que l'échappement est chromé.
    C: Il est interdit de remplacer le système d'origine par un système plus bruyant.
    D: Il n'y a pas de réglementation concernant le bruit de l'échappement.
  answer: C
  explanation: Le Code de la sécurité routière interdit toute modification du système
    d'échappement ayant pour résultat de rendre le véhicule plus bruyant que le système
    d'origine du fabricant.
- id: 198
  category: vehicle_information
  question: 'Tout véhicule automobile immatriculé au Québec doit être muni d''un frein
    de stationnement capable de :'
  choices:
    A: Arrêter le véhicule sur une distance de 10 mètres à 50 km/h.
    B: Maintenir le véhicule immobile sur n'importe quelle pente.
    C: Bloquer les quatre roues simultanément.
    D: Fonctionner automatiquement lorsque le moteur est éteint.
  answer: B
  explanation: Le Code de la sécurité routière exige un système de frein de stationnement
    indépendant du frein de service et capable de maintenir le véhicule immobile sur
    n'importe quelle pente.
- id: 199
  category: vehicle_information
  question: Si le rétroviseur intérieur d'un véhicule est obstrué par un chargement
    ou une remorque, quelle est l'exigence légale au Québec ?
  choices:
    A: Le conducteur doit immédiatement retirer l'obstruction.
    B: Le véhicule doit être équipé d'un rétroviseur extérieur sur le côté droit.
    C: Le conducteur doit utiliser un système de caméra à la place.
    D: Aucun équipement supplémentaire n'est requis si le rétroviseur gauche est présent.
  answer: B
  explanation: Si le rétroviseur intérieur ne peut pas être utilisé, le véhicule doit
    être équipé d'un rétroviseur extérieur sur le côté droit du véhicule.
- id: 200
  category: vehicle_information
  question: Au Québec, quelle est la règle concernant les objets suspendus au rétroviseur
    intérieur ?
  choices:
    A: Ils sont autorisés s'ils mesurent moins de 10 cm.
    B: Ils sont autorisés seulement s'il s'agit de désodorisants.
    C: Ils sont interdits s'ils obstruent la vue du conducteur.
    D: Ils sont encouragés pour des raisons de sécurité.
  answer: C
  explanation: Le Code de la sécurité routière interdit tout objet placé de manière
    à obstruer le champ de vision du conducteur ou à réduire la visibilité des instruments.
- id: 201
  category: vehicle_information
  question: Concernant les dispositifs antipollution (convertisseurs catalytiques),
    que stipule la loi du Québec ?
  choices:
    A: Ils peuvent être retirés après que le véhicule a atteint l'âge de 10 ans.
    B: Ils peuvent être modifiés pour améliorer l'économie de carburant.
    C: Il est interdit de retirer ou de modifier tout dispositif installé par le fabricant
      pour réduire les émissions de gaz.
    D: Ils ne sont obligatoires que pour les véhicules commerciaux.
  answer: C
  explanation: C'est une infraction au Code de la sécurité routière de retirer, de
    modifier ou de rendre inopérant tout dispositif de protection de l'environnement
    installé sur un véhicule.
- id: 202
  category: vehicle_information
  question: 'Au Québec, les phares doivent être allumés lorsque la visibilité est
    inférieure à :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 250 mètres
  answer: B
  explanation: Les phares doivent être utilisés chaque fois que les conditions atmosphériques
    (brouillard, pluie, neige) réduisent la visibilité à moins de 150 mètres.
- id: 203
  category: signs_and_signals
  question: Que signifie un symbole de losange blanc peint sur une voie de circulation
    au Québec ?
  choices:
    A: La voie est réservée à la circulation à haute vitesse uniquement.
    B: 'La voie est réservée à des types de véhicules spécifiques (ex. : autobus,
      taxis, covoiturage).'
    C: La voie se termine bientôt.
    D: La voie est réservée uniquement aux véhicules d'urgence.
  answer: B
  explanation: Un losange blanc sur la chaussée indique une voie réservée. Des panneaux
    à proximité préciseront quels véhicules (autobus, taxis ou véhicules électriques)
    sont autorisés à l'utiliser et pendant quelles heures.
- id: 204
  category: signs_and_signals
  question: À l'approche d'une intersection avec un feu jaune fixe, quelle est l'obligation
    légale d'un conducteur au Québec ?
  choices:
    A: Accélérer pour dégager l'intersection avant qu'elle ne passe au rouge.
    B: S'arrêter, à moins d'être déjà engagé dans l'intersection ou si proche que
      l'arrêt serait dangereux.
    C: Toujours s'arrêter, peu importe la distance par rapport à l'intersection.
    D: Traiter le feu comme un feu jaune clignotant et avancer avec prudence.
  answer: B
  explanation: En vertu du Code de la sécurité routière du Québec, un feu jaune signifie
    que vous devez vous arrêter. Vous ne devez poursuivre votre route que si vous
    êtes déjà engagé dans l'intersection ou si vous ne pouvez pas vous arrêter en
    toute sécurité.
- id: 205
  category: signs_and_signals
  question: Que signifie une double ligne jaune continue au centre de la chaussée
    ?
  choices:
    A: Le dépassement est permis si la voie est libre.
    B: Le dépassement est interdit dans les deux directions.
    C: Le dépassement est permis pour la voie de droite uniquement.
    D: La route est à sens unique.
  answer: B
  explanation: Une double ligne jaune continue indique que le dépassement est strictement
    interdit pour la circulation circulant dans les deux sens.
- id: 206
  category: signs_and_signals
  question: Au Québec, si les clignotants de votre véhicule ne fonctionnent pas, quel
    est le signal manuel correct pour un virage à droite ?
  choices:
    A: Le bras gauche tendu horizontalement par la fenêtre.
    B: Le bras gauche tendu et plié vers le haut au niveau du coude.
    C: Le bras gauche tendu et plié vers le bas au niveau du coude.
    D: Le bras droit tendu horizontalement par la fenêtre du passager.
  answer: B
  explanation: Le signal manuel pour un virage à droite consiste à sortir le bras
    gauche par la fenêtre et à le plier vers le haut à un angle de 90 degrés.
- id: 207
  category: signs_and_signals
  question: 'Un panneau avec un cercle vert entourant un symbole indique :'
  choices:
    A: Un avertissement de danger à venir.
    B: Une action qui est interdite.
    C: Une action qui est permise ou obligatoire.
    D: Des informations sur les services touristiques.
  answer: C
  explanation: Dans le système de signalisation du Québec et du Canada, un cercle
    vert indique que le mouvement ou l'action illustré à l'intérieur du cercle est
    autorisé ou obligatoire.
- id: 208
  category: signs_and_signals
  question: Au Québec, que séparent les lignes blanches discontinues sur la chaussée
    ?
  choices:
    A: La circulation circulant dans des directions opposées.
    B: Les voies de circulation circulant dans la même direction.
    C: La chaussée de l'accotement.
    D: Les pistes cyclables des voies pour voitures.
  answer: B
  explanation: Les lignes blanches discontinues sont utilisées pour séparer les voies
    de circulation circulant dans la même direction où les changements de voie sont
    autorisés.
- id: 209
  category: signs_and_signals
  question: Quelle est la signification d'un panneau en forme de triangle inversé
    avec une bordure rouge et un centre blanc ?
  choices:
    A: Arrêt (Stop).
    B: Céder le passage.
    C: Entrée interdite.
    D: Zone scolaire.
  answer: B
  explanation: Le triangle inversé est la forme standard d'un panneau « Céder le passage
    », exigeant que les conducteurs accordent la priorité aux autres véhicules ou
    aux piétons.
- id: 210
  category: signs_and_signals
  question: Au Québec, de quelle couleur sont les panneaux utilisés pour indiquer
    des travaux routiers temporaires ou un chantier ?
  choices:
    A: Jaune
    B: Vert
    C: Orange
    D: Bleu
  answer: C
  explanation: Les panneaux orange sont utilisés spécifiquement pour les zones de
    construction et d'entretien afin d'avertir les conducteurs de conditions temporaires.
- id: 211
  category: signs_and_signals
  question: Que signifie un signal « X » rouge fixe au-dessus d'une voie de circulation
    ?
  choices:
    A: La voie est réservée à la circulation express uniquement.
    B: Vous ne devez pas circuler dans cette voie.
    C: La voie est sur le point de fermer.
    D: Des piétons traversent.
  answer: B
  explanation: Un « X » rouge au-dessus d'une voie (signal de contrôle de voie) signifie
    que la voie est fermée à la circulation ou que la circulation se fait en sens
    inverse dans cette voie.
- id: 212
  category: signs_and_signals
  question: Lorsqu'un signal pour piétons affiche une main orange clignotante, à quoi
    le conducteur doit-il s'attendre ?
  choices:
    A: Le feu de circulation est sur le point de passer au vert.
    B: Le feu de circulation est sur le point de passer au jaune.
    C: Les piétons ne sont plus autorisés à s'engager dans le passage pour piétons.
    D: À la fois B et C.
  answer: D
  explanation: Une main orange clignotante indique aux piétons de ne pas commencer
    à traverser et coïncide généralement avec la fin de la phase de feu vert pour
    les véhicules.
- id: 213
  category: signs_and_signals
  question: Que signifie une ligne blanche continue sur le côté droit de la route
    ?
  choices:
    A: Une voie pour les véhicules lents.
    B: La bordure de la chaussée (ligne de rive).
    C: Une zone de stationnement.
    D: Une voie réservée aux vélos.
  answer: B
  explanation: Une ligne blanche continue sur le côté droit de la route marque la
    limite extérieure de la chaussée, aidant les conducteurs à rester sur la route
    en cas de mauvaise visibilité.
- id: 214
  category: signs_and_signals
  question: Que signifie un feu vert clignotant ou une flèche verte affichée simultanément
    avec un feu rouge au Québec ?
  choices:
    A: Vous devez attendre un feu vert fixe pour avancer.
    B: Vous avez la priorité pour aller tout droit, tourner à gauche ou tourner à
      droite.
    C: Vous pouvez seulement tourner à gauche ; vous ne pouvez pas aller tout droit.
    D: Les piétons ont la priorité dans toutes les directions.
  answer: B
  explanation: Au Québec, un feu vert clignotant ou une flèche verte indique une phase
    de virage protégé ou prioritaire. Vous avez la priorité pour circuler dans n'importe
    quelle direction (tout droit, gauche, droite) alors que la circulation inverse
    fait face à un feu rouge.
- id: 215
  category: signs_and_signals
  question: En approchant d'une intersection avec un feu jaune (ambre) clignotant,
    que doit faire un conducteur ?
  choices:
    A: S'arrêter complètement et attendre qu'il passe au vert.
    B: Accélérer pour dégager l'intersection rapidement.
    C: Ralentir et avancer avec prudence, en cédant le passage à ceux qui sont déjà
      dans l'intersection.
    D: Traiter l'intersection comme un arrêt multidirectionnel (quatre sens).
  answer: C
  explanation: Un feu jaune clignotant indique la prudence. Les conducteurs doivent
    réduire leur vitesse et ne s'engager qu'après s'être assurés qu'ils peuvent le
    faire en toute sécurité, en cédant le passage aux piétons et aux autres véhicules
    déjà dans l'intersection.
- id: 216
  category: signs_and_signals
  question: Que signifie une ligne blanche continue peinte sur la chaussée entre deux
    voies de circulation circulant dans la même direction ?
  choices:
    A: Les changements de voie sont encouragés.
    B: Les changements de voie sont interdits.
    C: La voie est réservée aux autobus uniquement.
    D: Vous approchez d'une zone scolaire.
  answer: B
  explanation: Au Québec, une ligne blanche continue entre des voies circulant dans
    la même direction indique que les changements de voie sont interdits. Les conducteurs
    doivent rester dans leur voie actuelle.
- id: 217
  category: signs_and_signals
  question: Pour signaler un virage à droite à l'aide de signaux manuels, comment
    le conducteur doit-il positionner son bras ?
  choices:
    A: Le bras tendu horizontalement par la fenêtre.
    B: Le bras sorti et plié vers le haut au niveau du coude.
    C: Le bras sorti et plié vers le bas au niveau du coude.
    D: Le bras effectuant un mouvement circulaire.
  answer: B
  explanation: Le signal manuel standard pour un virage à droite est le bras gauche
    tendu par la fenêtre et plié vers le haut à un angle de 90 degrés.
- id: 218
  category: signs_and_signals
  question: Quelle est la signification d'un signal manuel où le bras du conducteur
    est tendu et plié vers le bas au niveau du coude ?
  choices:
    A: Le conducteur tourne à gauche.
    B: Le conducteur tourne à droite.
    C: Le conducteur ralentit ou s'arrête.
    D: Le conducteur signale aux autres de le dépasser.
  answer: C
  explanation: Un signal manuel avec le bras plié vers le bas au niveau du coude indique
    que le conducteur a l'intention de ralentir ou de s'arrêter.
- id: 219
  category: signs_and_signals
  question: Un panneau comportant un cercle vert sur fond blanc indique quel type
    d'instruction ?
  choices:
    A: Un avertissement de danger à venir.
    B: Une interdiction (quelque chose que vous ne pouvez pas faire).
    C: Une obligation ou une permission (quelque chose que vous pouvez ou devez faire).
    D: Des informations sur les services touristiques.
  answer: C
  explanation: Dans le système de signalisation du Québec, un cercle vert représente
    une obligation ou une action permise, comme une « route pour camions » ou « tout
    droit seulement ».
- id: 220
  category: signs_and_signals
  question: Que signifie un cercle rouge avec une barre diagonale traversant un symbole
    ?
  choices:
    A: L'action illustrée est autorisée.
    B: L'action illustrée est interdite.
    C: Vous devez faire preuve de prudence en effectuant l'action.
    D: La règle ne s'applique que la nuit.
  answer: B
  explanation: Un cercle rouge avec une barre diagonale est un panneau de prescription
    qui indique que l'action représentée (comme un demi-tour ou un virage à gauche)
    est strictement interdite.
- id: 221
  category: signs_and_signals
  question: 'Un losange blanc peint sur une voie indique que la voie est :'
  choices:
    A: Réservée à certaines catégories de véhicules
    B: Une voie de dépassement à grande vitesse
    C: Une voie de sortie obligatoire
    D: Une zone de stationnement
  answer: A
  explanation: Le symbole du losange blanc sur la chaussée identifie une voie réservée,
    qui peut être limitée aux autobus, aux taxis ou aux véhicules de covoiturage (HOV).
- id: 222
  category: signs_and_signals
  question: Lorsque vous voyez un signal « X » jaune au-dessus d'une voie, qu'est-ce
    que cela signifie ?
  choices:
    A: La voie est sur le point de fermer ou de changer de direction
    B: Vous devez vous arrêter immédiatement dans cette voie
    C: La voie est réservée uniquement aux véhicules d'urgence
    D: Vous pouvez utiliser la voie pour tourner à gauche
  answer: A
  explanation: Un « X » jaune au-dessus d'une voie (signal de contrôle de voie) signifie
    que la voie est sur le point d'être fermée à la circulation dans cette direction
    ou que le signal est sur le point de passer au « X » rouge.
- id: 223
  category: signs_and_signals
  question: Au Québec, que fournit généralement comme information un panneau rectangulaire
    bleu ?
  choices:
    A: Les travaux de construction et les détours
    B: Les lois réglementaires et les amendes
    C: Les services et les attractions touristiques
    D: La distance jusqu'à la prochaine ville
  answer: C
  explanation: Les panneaux bleus sont utilisés pour fournir des informations sur
    les services (comme les hôpitaux ou les stations-service) et les attractions ou
    installations touristiques.
- id: 224
  category: signs_and_signals
  question: Que devez-vous faire à l'approche d'un passage à niveau muni d'un signal
    à feu rouge clignotant ?
  choices:
    A: Ralentir et regarder des deux côtés
    B: S'arrêter à au moins 5 mètres du rail le plus proche
    C: S'arrêter uniquement si vous voyez un train arriver
    D: Accélérer pour traverser avant que les barrières ne se ferment
  answer: B
  explanation: Selon la SAAQ, lorsque les feux clignotent à un passage à niveau, vous
    devez immobiliser votre véhicule à au moins 5 mètres du rail le plus proche.
- id: 225
  category: signs_and_signals
  question: Quelle est la signification d'un feu rouge clignotant à une intersection
    ?
  choices:
    A: Le feu est en panne ; avancez avec prudence
    B: Arrêtez-vous, puis ne repartez que lorsqu'il est sécuritaire de le faire
    C: Cédez le passage au trafic venant de la droite uniquement
    D: Attendez le feu vert
  answer: B
  explanation: Un feu rouge clignotant doit être traité exactement comme un panneau
    d'arrêt. Vous devez effectuer un arrêt complet et céder le passage aux autres
    véhicules ou piétons déjà engagés dans l'intersection.
