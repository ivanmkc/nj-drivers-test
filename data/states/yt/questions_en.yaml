  question: When following a motorcycle in Yukon, why should you maintain a greater
    following distance than you would for a car?
  choices:
    A: Motorcycles stop much slower than cars
    B: Motorcycles are more likely to take up two lanes
    C: Motorcycles can stop very quickly and are more affected by road hazards like
      gravel or potholes
    D: It is a legal requirement to stay 100 metres back
  answer: C
  explanation: Motorcycles can stop more quickly than larger vehicles and may need
    to swerve suddenly to avoid hazards like gravel or cracks in the road, which are
    common in Yukon.
- id: 173
  category: sharing_the_road
  question: 'If you are driving on a two-way road and an emergency vehicle with sirens
    and flashing lights approaches from behind, you should:'
  choices:
    A: Speed up to get out of the way
    B: Stop exactly where you are in the lane
    C: Move to the right edge of the roadway and stop
    D: Move to the left into the oncoming lane
  answer: C
  explanation: When an emergency vehicle approaches with sirens or lights, drivers
    must pull to the right as far as possible and come to a complete stop until the
    vehicle has passed.
- id: 174
  category: sharing_the_road
  question: In Yukon, when a cyclist is sharing the road, what is the recommended
    minimum distance you should maintain when passing them?
  choices:
    A: 0.5 metres
    B: 1 metre
    C: 3 metres
    D: 5 metres
  answer: B
  explanation: Safe driving practices in Yukon recommend leaving at least 1 metre
    of space between your vehicle and a cyclist when passing to ensure their safety.
- id: 175
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' What does this term refer to?
  choices:
    A: Areas where trucks are not allowed to drive
    B: The truck's cargo area
    C: The large blind spots around the front, back, and sides of the truck
    D: The weight limit of the truck
  answer: C
  explanation: No-Zones are large blind spots where the truck driver cannot see other
    vehicles. If you cannot see the truck driver's mirrors, they cannot see you.
- id: 176
  category: sharing_the_road
  question: You are approaching an intersection where a pedestrian has just stepped
    off the curb into an unmarked crosswalk. Who has the right-of-way?
  choices:
    A: The driver, because the crosswalk is not marked
    B: The pedestrian
    C: Whoever arrived at the intersection first
    D: The driver, if they are turning right
  answer: B
  explanation: In Yukon, pedestrians have the right-of-way at all intersections, whether
    the crosswalk is marked with lines or is an unmarked extension of the sidewalk.
- id: 177
  category: sharing_the_road
  question: 'When a large truck is turning right at an intersection, it may need to:'
  choices:
    A: Swing wide to the left before turning
    B: Stop and back up mid-turn
    C: Turn from the far left lane
    D: Speed up to clear the intersection
  answer: A
  explanation: Because of their length, large trucks must often swing wide to the
    left to clear the curb when making a right turn. Drivers should never try to squeeze
    between the truck and the curb.
- id: 178
  category: sharing_the_road
  question: In Yukon, are cyclists permitted to ride on the sidewalk?
  choices:
    A: Yes, it is safer than the road
    B: Yes, but only if they are over the age of 18
    C: No, bicycles are considered vehicles and must be operated on the road
    D: Only in residential areas
  answer: C
  explanation: Under the Yukon Motor Vehicles Act, bicycles are generally treated
    as vehicles and are not permitted on sidewalks unless local municipal bylaws specifically
    allow it (usually only for small children).
- id: 179
  category: sharing_the_road
  question: 'When driving behind a slow-moving vehicle (marked with an orange triangle),
    you should:'
  choices:
    A: Honk until they pull over
    B: Pass immediately, even on a curve
    C: Be patient and only pass when it is safe and legal to do so
    D: Follow closely to encourage them to speed up
  answer: C
  explanation: Slow-moving vehicles, such as farm equipment or construction machinery,
    are common in Yukon. Drivers must be patient and wait for a safe, legal passing
    zone.
- id: 180
  category: sharing_the_road
  question: If you are driving on a highway with a physical median (divided highway)
    and a school bus is stopped on the opposite side with red lights flashing, do
    you need to stop?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, traffic on the opposite side of a divided highway does not need to stop
    C: Only if the bus driver signals you to stop
    D: Only if there are children crossing the median
  answer: B
  explanation: On a divided highway where there is a physical barrier or median between
    lanes, traffic approaching from the opposite direction of a stopped school bus
    is not required to stop.
- id: 181
  category: sharing_the_road
  question: 'When a transit bus in Yukon has signaled and is attempting to pull back
    into traffic from a bus stop, you should:'
  choices:
    A: Speed up to pass the bus
    B: Yield the right-of-way and allow the bus to merge
    C: Maintain your speed; the bus must wait for a gap
    D: Honk to warn the bus driver
  answer: B
  explanation: It is a matter of safety and courtesy to yield to transit buses that
    are signaling to re-enter the flow of traffic from a designated bus stop.
- id: 182
  category: sharing_the_road
  question: Which of the following is true regarding 'lane splitting' (driving between
    rows of stopped or moving vehicles) for motorcycles in Yukon?
  choices:
    A: It is legal if the traffic is moving slower than 30 km/h
    B: It is legal for experienced riders only
    C: It is illegal and dangerous
    D: It is encouraged to reduce traffic congestion
  answer: C
  explanation: Lane splitting is illegal in Yukon. Motorcycles are entitled to the
    full use of a lane, and they must follow the same rules of the road as other motor
    vehicles.
- id: 183
  category: sharing_the_road
  question: Under Yukon's 'Move Over' law, what must a driver do when passing a stopped
    emergency vehicle with its sirens or lights flashing on a highway with a speed
    limit of 100 km/h?
  choices:
    A: Slow down to 70 km/h
    B: Slow down to 60 km/h and move to the left lane if safe to do so
    C: Maintain speed but move to the left lane
    D: Slow down to 50 km/h
  answer: B
  explanation: Yukon law requires drivers to slow down to 60 km/h (or the posted limit
    if it is lower than 60 km/h) and move into the far lane when passing emergency
    vehicles or tow trucks stopped on the side of the road with flashing lights.
- id: 184
  category: sharing_the_road
  question: When a school bus is stopped on a highway divided by a median, which drivers
    are required to stop for the flashing red lights?
  choices:
    A: Drivers in all lanes and both directions
    B: Only drivers following the bus
    C: Only drivers in the oncoming lanes
    D: No one is required to stop on a divided highway
  answer: B
  explanation: On a highway divided by a median, only the drivers approaching the
    school bus from the rear (following the bus) are required to stop when the red
    lights are flashing.
- id: 185
  category: sharing_the_road
  question: When passing a cyclist on a Yukon roadway, what is the recommended minimum
    distance you should maintain between your vehicle and the cyclist?
  choices:
    A: 0.5 metres
    B: 1 metre
    C: 2 metres
    D: 3 metres
  answer: B
  explanation: The Yukon Driver's Handbook recommends leaving at least one metre of
    space between your vehicle and a cyclist to ensure safety, especially in case
    the cyclist needs to swerve to avoid a hazard.
- id: 186
  category: sharing_the_road
  question: 'If an emergency vehicle (ambulance, fire truck, or police car) is approaching
    you from any direction with its siren and lights on, you must:'
  choices:
    A: Speed up to get out of the way
    B: Stop exactly where you are in the lane
    C: Move to the right edge of the road and stop
    D: Move to the left edge of the road and stop
  answer: C
  explanation: Drivers must yield the right-of-way to emergency vehicles by immediately
    pulling to the right-hand curb or edge of the roadway and stopping until the vehicle
    has passed.
- id: 187
  category: sharing_the_road
  question: At an intersection where a pedestrian is crossing in an unmarked crosswalk,
    who has the right of way?
  choices:
    A: The motorist, because the crosswalk is not marked
    B: The pedestrian
    C: Whoever arrived at the intersection first
    D: The motorist, if they honk their horn first
  answer: B
  explanation: In Yukon, pedestrians have the right of way at all intersections, whether
    the crosswalk is marked or unmarked (an 'implied' crosswalk).
- id: 188
  category: sharing_the_road
  question: When sharing the road with a motorcycle, why should you leave a full lane
    width when passing them?
  choices:
    A: Motorcycles are legally entitled to the full width of a lane
    B: Motorcycles are faster than cars
    C: To avoid the wind gust from your car pushing them over
    D: Both A and C
  answer: D
  explanation: Motorcyclists are entitled to the full use of a lane. Passing too closely
    can be dangerous due to wind blasts or the motorcycle needing to adjust position
    for road hazards.
- id: 189
  category: sharing_the_road
  question: 'Large trucks often swing wide to the left before making a right turn.
    As a driver following the truck, you should:'
  choices:
    A: Pass the truck on the right while it is swinging left
    B: Stay well back and do not attempt to pass on the right
    C: Honk to warn the truck driver they are in the wrong lane
    D: Speed up to pass on the left
  answer: B
  explanation: Trucks need extra space to make turns. Attempting to pass a truck on
    the right while it is turning right is extremely dangerous and can result in a
    'right-turn squeeze' crash.
- id: 190
  category: sharing_the_road
  question: In Yukon, if you are convicted of failing to remain at the scene of an
    accident, how many demerit points are added to your driving record?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 7 points
  answer: D
  explanation: Failing to remain at the scene of an accident is a serious offense
    in Yukon and carries a penalty of 7 demerit points.
- id: 191
  category: sharing_the_road
  question: When driving near a snowplow in Yukon, what is the safest way to proceed?
  choices:
    A: Pass the snowplow on the right
    B: Follow at a safe distance and wait for the driver to pull over or for a safe
      passing zone
    C: Drive closely behind it to take advantage of the cleared road
    D: Pass the snowplow as quickly as possible, even if visibility is low
  answer: B
  explanation: Snowplows often create 'snow clouds' that obscure visibility. Drivers
    should stay back, be patient, and only pass when it is safe and legal to do so,
    keeping in mind that the road ahead of the plow is unplowed.
- id: 192
  category: sharing_the_road
  question: What is the 'two-second rule' used for in Yukon driving?
  choices:
    A: The time it takes to check your mirrors
    B: The minimum following distance behind another vehicle in ideal conditions
    C: The time you should stop at a stop sign
    D: The time allowed to clear an intersection after the light turns red
  answer: B
  explanation: The two-second rule is a simple way to ensure you are maintaining a
    safe following distance behind the vehicle in front of you under ideal conditions.
- id: 193
  category: sharing_the_road
  question: 'When you see a ''Log Haul Road'' sign in Yukon, you should be particularly
    aware that:'
  choices:
    A: Logging trucks have the right of way at all times
    B: Logging trucks may be extra long and require more room to turn or stop
    C: The road is closed to passenger vehicles
    D: You must drive with your hazard lights on
  answer: B
  explanation: Log haul signs warn drivers that large, heavy logging trucks are using
    the road. These vehicles have large blind spots and require significant distance
    to stop.
- id: 194
  category: sharing_the_road
  question: If you are involved in a collision in Yukon where someone is injured or
    the total property damage exceeds a certain amount, you must report it to the
    police. What is that amount?
  choices:
    A: Any amount
    B: $500
    C: $1,000
    D: $2,000
  answer: C
  explanation: In Yukon, collisions resulting in injury, death, or property damage
    apparently exceeding $1,000 must be reported to the nearest police officer or
    RCMP detachment immediately.
- id: 195
  category: vehicle_information
  question: In Yukon, during what time period must your vehicle's headlights be turned
    on?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From 30 minutes after sunset to 30 minutes before sunrise
    D: Only when it is dark enough that you cannot see the road
  answer: C
  explanation: According to Yukon driving regulations, headlights must be used from
    30 minutes after sunset to 30 minutes before sunrise, and at any other time when
    visibility is poor.
- id: 196
  category: vehicle_information
  question: 'Under Yukon law, you must turn on your headlights if visibility is reduced
    to less than:'
  choices:
    A: 100 metres
    B: 150 metres
    C: 200 metres
    D: 250 metres
  answer: B
  explanation: Headlights must be turned on whenever atmospheric conditions (rain,
    snow, fog, etc.) reduce visibility to less than 150 metres.
- id: 197
  category: vehicle_information
  question: What is the minimum legal tire tread depth for passenger vehicles in Yukon?
  choices:
    A: 1.0 millimetre
    B: 1.6 millimetres
    C: 2.5 millimetres
    D: 3.2 millimetres
  answer: B
  explanation: In Yukon, tires are considered unsafe if the tread depth is less than
    1.6 millimetres (2/32 of an inch).
- id: 198
  category: vehicle_information
  question: Regarding window tinting in Yukon, which of the following is true?
  choices:
    A: Full tint is allowed on the windshield if it is professional grade
    B: No aftermarket tint is allowed on the windshield or front side windows
    C: Tint is allowed on front side windows as long as it transmits 50% of light
    D: Only the top 10cm of the windshield may be tinted
  answer: B
  explanation: Yukon regulations prohibit the application of aftermarket window tint
    to the windshield and the windows to the direct left and right of the driver.
- id: 199
  category: vehicle_information
  question: 'If your vehicle''s interior rear-view mirror is obstructed by a trailer
    or load, Yukon law requires:'
  choices:
    A: An oversized vehicle permit
    B: A passenger to act as a spotter
    C: Outside mirrors on both the left and right sides
    D: A wide-angle interior mirror
  answer: C
  explanation: If the view from the internal rear-view mirror is obstructed, the vehicle
    must be equipped with side mirrors on both the left and right sides that provide
    a clear view to the rear.
- id: 200
  category: vehicle_information
  question: 'Every motor vehicle in Yukon must be equipped with a horn that can be
    heard from a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 200 metres
  answer: B
  explanation: Yukon vehicle equipment regulations state that a horn must be audible
    under normal conditions from a distance of not less than 60 metres.
- id: 201
  category: vehicle_information
  question: Which of the following is a mandatory braking requirement for all motor
    vehicles in Yukon?
  choices:
    A: Only a foot-operated service brake is required
    B: An emergency brake is only required for commercial vehicles
    C: 'Two separate braking systems: a service brake and a parking/emergency brake'
    D: Anti-lock braking systems (ABS) are mandatory on all vehicles regardless of
      age
  answer: C
  explanation: 'All motor vehicles must have two independent braking systems: the
    service brake (foot brake) and the parking or emergency brake.'
- id: 202
  category: vehicle_information
  question: 'In Yukon, your vehicle''s tail lights must be clearly visible from a
    distance of:'
  choices:
    A: 50 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: C
  explanation: Tail lights on a vehicle must be red and visible from a distance of
    at least 150 metres to the rear.
- id: 203
  category: vehicle_information
  question: 'The white light illuminating your rear license plate in Yukon must make
    the plate readable from a distance of:'
  choices:
    A: 5 metres
    B: 10 metres
    C: 15 metres
    D: 25 metres
  answer: C
  explanation: The rear license plate must be illuminated by a white light so that
    the plate is clearly legible from a distance of 15 metres.
- id: 204
  category: vehicle_information
  question: 'Turn signal lights on a vehicle in Yukon must be visible from a distance
    of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: A
  explanation: Mechanical or electrical turn signals must be visible from a distance
    of 30 metres in normal sunlight.
- id: 205
  category: vehicle_information
  question: 'In Yukon, you must switch your headlights to low beams when following
    another vehicle within a distance of:'
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: B
  explanation: When following another vehicle, you must dim your high beams within
    60 meters to prevent glare in the lead driver's rearview mirror.
- id: 206
  category: vehicle_information
  question: Under the Yukon Motor Vehicles Act, every motor vehicle must be equipped
    with which of the following braking systems?
  choices:
    A: Only a hydraulic foot brake
    B: Only an emergency hand brake
    C: Two separate braking systems (service brake and parking brake)
    D: An anti-lock braking system (ABS) is the only legal requirement
  answer: C
  explanation: 'All motor vehicles in Yukon must have two independent braking systems:
    a service brake (foot brake) and a parking/emergency brake.'
- id: 207
  category: vehicle_information
  question: In Yukon, what are the restrictions regarding window tinting on the windshield
    and front side windows?
  choices:
    A: Any level of tint is allowed as long as the driver wears glasses
    B: Tinting is allowed up to 50% light blockage
    C: No aftermarket tinting is allowed on the windshield or front side windows
    D: Only the windshield may be tinted
  answer: C
  explanation: Yukon regulations generally prohibit aftermarket window tinting on
    the windshield and the windows to the immediate left and right of the driver for
    safety and visibility.
- id: 208
  category: vehicle_information
  question: When towing a trailer in Yukon, safety chains must be used and connected
    in what manner?
  choices:
    A: Connected in a straight line under the hitch
    B: Crossed under the tongue of the trailer
    C: Wrapped around the bumper
    D: Only one chain is required on the left side
  answer: B
  explanation: Safety chains should be crossed under the trailer tongue to prevent
    the tongue from dropping to the ground if the hitch fails.
- id: 209
  category: vehicle_information
  question: 'In Yukon, the rear license plate of a vehicle must be illuminated by
    a white light so that it is visible from a distance of at least:'
  choices:
    A: 5 meters
    B: 15 meters
    C: 30 meters
    D: 50 meters
  answer: B
  explanation: The rear license plate must be illuminated by a tail lamp or a separate
    white light so that the plate is clearly legible from a distance of 15 meters.
- id: 210
  category: vehicle_information
  question: What equipment is required for a bicycle being operated on a Yukon highway
    at night?
  choices:
    A: A bell only
    B: A white light on the front and a red light or reflector on the rear
    C: A yellow light on the front and a white light on the rear
    D: Reflective clothing only
  answer: B
  explanation: Bicycles operated at night must have a front lamp emitting a white
    light and a rear red light or red reflector.
- id: 211
  category: vehicle_information
  question: According to Yukon safe driving recommendations for winter, what should
    be included in a vehicle's emergency survival kit?
  choices:
    A: Only a spare tire and jack
    B: Candles, matches, a tin cup, and warm clothing/blankets
    C: A GPS unit and a map
    D: Extra fuel in a plastic container inside the trunk
  answer: B
  explanation: Due to Yukon's extreme winter conditions, the handbook recommends a
    survival kit including candles (for heat), matches, a tin cup, and warm blankets/clothing.
- id: 212
  category: vehicle_information
  question: 'In Yukon, mudguards or fenders are required on vehicles to reduce the
    spray of water and mud. These must be wide enough to cover:'
  choices:
    A: The entire vehicle width
    B: The full width of the tire tread
    C: Only the top half of the tire
    D: The inner half of the tire
  answer: B
  explanation: Fenders or mudguards must cover the full width of the tire tread to
    effectively reduce the spray of mud, water, and gravel onto other vehicles.
- id: 213
  category: vehicle_information
  question: What is the requirement for the windshield of a vehicle registered in
    Yukon?
  choices:
    A: It must be made of tempered glass only
    B: It must be kept free of any cracks or chips that obstruct the driver's view
    C: It must be replaced every five years
    D: It must have a sun-strip covering at least 50% of the glass
  answer: B
  explanation: The windshield must be made of safety glass and must be maintained
    in a condition that does not obstruct the driver's clear view of the highway.
- id: 214
  category: signs_and_signals
  question: In Yukon, what is the correct hand signal to indicate that you are slowing
    down or stopping?
  choices:
    A: Arm out the window and pointed straight up
    B: Arm out the window and pointed straight out
    C: Arm out the window and pointed down with palm facing back
    D: Arm out the window and waving in a circular motion
  answer: C
  explanation: According to the Yukon Driver's Basic Handbook, the hand signal for
    slowing or stopping is the left arm extended out the window and pointed down with
    the palm facing the rear.
- id: 215
  category: signs_and_signals
  question: What does a flashing green light at an intersection typically indicate
    in the Yukon?
  choices:
    A: The light is about to turn red
    B: It is a pedestrian-activated signal
    C: You have the right of way to turn left
    D: The intersection is under construction
  answer: B
  explanation: In Yukon, a flashing green light usually indicates a pedestrian-activated
    signal. Drivers may proceed with caution, but must be prepared to stop if the
    light changes to yellow and then red.
- id: 216
  category: signs_and_signals
  question: When approaching a steady yellow traffic light in Yukon, what must a driver
    do?
  choices:
    A: Speed up to clear the intersection before the light turns red
    B: Stop before entering the intersection unless it is unsafe to do so
    C: Maintain speed and proceed through the intersection
    D: Stop only if there are pedestrians present
  answer: B
  explanation: A steady yellow light means the signal is about to turn red. Drivers
    must stop before entering the intersection unless they are already in it or are
    so close that stopping would be unsafe.
- id: 217
  category: signs_and_signals
  question: 'A solid yellow line on your side of a broken yellow center line means:'
  choices:
    A: Passing is permitted if the road is clear
    B: You are in a one-way zone
    C: Passing is prohibited for vehicles on your side of the road
    D: You must turn right at the next intersection
  answer: C
  explanation: In Yukon pavement markings, a solid yellow line on your side of the
    center line indicates that passing is not allowed for traffic in your direction.
- id: 218
  category: signs_and_signals
  question: In Yukon, what does a white diamond symbol painted on a road lane indicate?
  choices:
    A: The lane is reserved for specific types of vehicles
    B: There is a pedestrian crossing ahead
    C: The lane is for emergency vehicles only
    D: The road is slippery when wet
  answer: A
  explanation: A white diamond on the pavement indicates a reserved lane, which may
    be restricted to buses, bicycles, or high-occupancy vehicles (HOV).
- id: 219
  category: signs_and_signals
  question: What is the meaning of a sign that is an orange diamond shape?
  choices:
    A: School zone warning
    B: Construction or maintenance warning
    C: Railway crossing ahead
    D: Hospital zone
  answer: B
  explanation: Orange diamond-shaped signs are used in Yukon to warn drivers of construction,
    maintenance, or utility work on or near the roadway.
- id: 220
  category: signs_and_signals
  question: When you see a 'School Zone' sign without a posted speed limit, what is
    the default speed limit in Yukon when children are present?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: In Yukon, the speed limit in a school zone is 30 km/h between 8:00
    AM and 4:30 PM on school days, or as otherwise posted.
- id: 221
  category: signs_and_signals
  question: What does a steady green arrow pointing to the left mean?
  choices:
    A: You may turn left, but must yield to oncoming traffic
    B: You must stop and wait for a green circle
    C: You have a protected turn; proceed in the direction of the arrow
    D: Left turns are prohibited at this intersection
  answer: C
  explanation: A steady green arrow means you may proceed in the direction of the
    arrow. Oncoming traffic is stopped by a red light, providing a protected turn.
- id: 222
  category: signs_and_signals
  question: A 'Yield' sign is what shape and color in Yukon?
  choices:
    A: An upside-down triangle with a red border and white center
    B: A yellow diamond with black lettering
    C: A red octagon with white lettering
    D: A white square with a black circle
  answer: A
  explanation: The yield sign in Yukon is an equilateral triangle pointing downward,
    with a red border and a white interior.
- id: 223
  category: signs_and_signals
  question: In Yukon, what does a solid white line between two lanes of traffic moving
    in the same direction mean?
  choices:
    A: Lane changing is encouraged
    B: Lane changing is discouraged or prohibited
    C: One lane is for slow-moving traffic only
    D: The road is narrowing ahead
  answer: B
  explanation: A solid white line between lanes moving in the same direction indicates
    that lane changes are discouraged or illegal, often used near intersections or
    tunnels.
- id: 224
  category: signs_and_signals
  question: What does a 'Railway Crossing' sign (the X-shaped crossbuck) mean?
  choices:
    A: Stop immediately regardless of whether a train is coming
    B: Speed up to cross the tracks quickly
    C: Yield the right of way to any approaching train
    D: The crossing is no longer in use
  answer: C
  explanation: The crossbuck sign indicates a railway crossing. Drivers must look
    and listen for trains and yield the right of way to any approaching rail traffic.
- id: 225
  category: signs_and_signals
  question: Under Yukon law, when are you permitted to turn left on a red light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: Whenever there is no oncoming traffic
    D: Only if a sign specifically permits it
  answer: B
  explanation: In Yukon, you may turn left on a red light only when turning from a
    one-way street onto another one-way street, after coming to a complete stop and
    yielding to pedestrians and other traffic.
- id: 226
  category: signs_and_signals
  question: What is the purpose of a 'Slow Moving Vehicle' sign (a reflective orange
    triangle with a red border)?
  choices:
    A: To indicate a vehicle that travels at 40 km/h or less
    B: To mark the end of a construction zone
    C: To indicate a vehicle carrying hazardous materials
    D: To mark a broken-down vehicle on the shoulder
  answer: A
  explanation: The slow-moving vehicle sign is attached to the rear of vehicles that
    travel at speeds of 40 km/h or less, such as farm machinery or construction equipment.
- id: 227
  category: signs_and_signals
  question: What does a flashing yellow light at an intersection mean?
  choices:
    A: Stop and wait for the light to turn green
    B: The light is about to turn red
    C: Slow down and proceed with caution
    D: Pedestrians are crossing ahead
  answer: C
  explanation: A flashing yellow light warns drivers to slow down and proceed through
    the intersection with caution, yielding to any pedestrians or traffic already
    in the intersection.
- id: 228
  category: signs_and_signals
  question: In Yukon, what does a flashing red traffic light mean?
  choices:
    A: Slow down and proceed with caution
    B: Stop and wait for the light to turn green
    C: Stop, yield to cross traffic and pedestrians, and proceed when safe
    D: The traffic light is out of order; treat it as a four-way stop
  answer: C
  explanation: 'According to the Yukon Driver''s Basic Handbook, a flashing red light
    must be treated the same as a stop sign: come to a complete stop and proceed only
    when it is safe to do so.'
- id: 229
  category: signs_and_signals
  question: 'When you see a flashing yellow light at an intersection in Yukon, you
    should:'
  choices:
    A: Stop and wait for a green light
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: Stop and treat it as a stop sign
  answer: C
  explanation: A flashing yellow light warns drivers to slow down and proceed through
    the intersection with caution, yielding to any pedestrians or vehicles already
    in the intersection.
- id: 230
  category: signs_and_signals
  question: If a Yukon driver extends their left arm straight out the window, what
    signal are they giving?
  choices:
    A: They are slowing down or stopping
    B: They are turning right
    C: They are turning left
    D: They are giving a friendly greeting
  answer: C
  explanation: The standard hand signal for a left turn is the left arm extended straight
    out of the driver's side window.
- id: 231
  category: signs_and_signals
  question: What is the meaning of a solid yellow line next to a broken yellow line
    on a Yukon highway?
  choices:
    A: Passing is prohibited for all traffic
    B: Passing is permitted for traffic on both sides
    C: Passing is permitted only for traffic on the side of the broken line
    D: Passing is permitted only for traffic on the side of the solid line
  answer: C
  explanation: A broken line next to a solid line means that passing is allowed for
    vehicles on the side with the broken line, provided it is safe to do so.
- id: 232
  category: signs_and_signals
  question: In Yukon, what does a 'steady' green arrow pointing left combined with
    a red light mean?
  choices:
    A: You must stop and wait for a full green light
    B: You may turn left; it is a 'protected' turn and oncoming traffic is stopped
    C: You may turn left but must yield to oncoming traffic
    D: The arrow is for pedestrians only
  answer: B
  explanation: A steady green arrow means you have a protected turn in the direction
    of the arrow. Oncoming traffic is facing a red light.
- id: 233
  category: signs_and_signals
  question: In Yukon, what hand signal should a driver use to indicate they are stopping
    or suddenly decreasing speed?
  choices:
    A: Left arm extended straight out
    B: Left arm out and bent upward at the elbow
    C: Left arm out and bent downward at the elbow
    D: Right arm extended straight out
  answer: C
  explanation: To signal a stop or decrease in speed, the driver should extend their
    left arm out and bend it downward at the elbow with the palm facing backward.
- id: 234
  category: signs_and_signals
  question: What color are construction and maintenance signs in Yukon?
  choices:
    A: Yellow
    B: Red
    C: Orange
    D: Green
  answer: C
  explanation: In Yukon and across Canada, orange is the standard color for temporary
    warning signs related to construction and maintenance work.
- id: 235
  category: signs_and_signals
  question: What must you do when you see a 'Yield' sign at an intersection in Yukon?
  choices:
    A: Always come to a complete stop
    B: Slow down and give the right-of-way to traffic in the intersection; stop only
      if necessary
    C: Maintain speed and expect others to stop for you
    D: Stop only if there is a police officer present
  answer: B
  explanation: A yield sign means you must slow down and be prepared to stop. You
    must give the right-of-way to any vehicles or pedestrians already in or approaching
    the intersection.
- id: 236
  category: signs_and_signals
  question: What do double solid yellow lines in the center of a Yukon roadway mean?
  choices:
    A: Passing is allowed if the road is clear
    B: Passing is prohibited in both directions
    C: The road is one-way only
    D: You may pass only during daylight hours
  answer: B
  explanation: Double solid yellow lines mean that traffic is moving in opposite directions
    and passing is strictly prohibited for vehicles on both sides.
- id: 237
  category: signs_and_signals
  question: A Yukon driver with their left arm out and bent upward at the elbow is
    signaling what?
  choices:
    A: A left turn
    B: A right turn
    C: A stop
    D: A U-turn
  answer: B
  explanation: The hand signal for a right turn is the left arm extended out the window
    and bent upward at a 90-degree angle.
