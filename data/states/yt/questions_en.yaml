metadata:
  source: Yukon Driver Handbook
  total_questions: 237
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Yukon, what is the minimum age required to apply for a Class 7 Learner's
    license?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: According to the Yukon Driver's Basic Handbook, an individual must
    be at least 15 years of age to apply for a Class 7 Learner's license.
- id: 2
  category: license_system
  question: While driving with a Class 7 Learner's license in Yukon, what is the restricted
    driving time period?
  choices:
    A: 11:00 PM to 6:00 AM
    B: 10:00 PM to 5:00 AM
    C: Midnight to 5:00 AM
    D: Midnight to 6:00 AM
  answer: C
  explanation: Class 7 Learner drivers in Yukon are prohibited from driving between
    the hours of midnight and 5:00 AM.
- id: 3
  category: license_system
  question: A supervisor for a Class 7 Learner driver in Yukon must meet which of
    the following requirements?
  choices:
    A: Must be at least 18 years old
    B: Must have held a valid Class 5 license for at least 1 year
    C: Must have held a valid Class 5 license for at least 2 years
    D: Must be a family member
  answer: C
  explanation: The supervisor for a Learner must hold a valid Class 5 license (not
    a GDL license) and have at least 2 years of driving experience.
- id: 4
  category: license_system
  question: What is the blood alcohol concentration (BAC) limit for a driver in the
    Yukon Graduated Driver Licensing (GDL) program?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Yukon has a zero-tolerance policy for alcohol and drugs for all drivers
    in the Graduated Driver Licensing (GDL) program, including Class 7 and Class 5P.
- id: 5
  category: license_system
  question: How long must a driver hold a Class 7 Learner's license before they are
    eligible to take the road test for a Class 5P (Novice) license?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: In Yukon, you must hold a Class 7 Learner's license for at least 6
    months before you can take the road test for your Class 5P license.
- id: 6
  category: license_system
  question: Under the Yukon GDL program, how many non-family passengers is a Class
    5P (Novice) driver allowed to carry?
  choices:
    A: None
    B: Only 1
    C: Up to 2
    D: As many as there are seatbelts
  answer: B
  explanation: Class 5P drivers are restricted to carrying only one passenger who
    is not an immediate family member.
- id: 7
  category: license_system
  question: How long must a driver remain in the Class 5P (Novice) stage without any
    suspensions before they can graduate to a full Class 5 license?
  choices:
    A: 12 months
    B: 18 months
    C: 24 months
    D: 36 months
  answer: B
  explanation: A driver must hold a Class 5P license for at least 18 months of suspension-free
    driving before they are eligible for a full Class 5 license.
- id: 8
  category: license_system
  question: If you move to Yukon from another province or territory, how long do you
    have to exchange your out-of-territory driver's license for a Yukon license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: D
  explanation: New residents of Yukon who hold a valid driver's license from another
    Canadian jurisdiction must exchange it for a Yukon license within 120 days.
- id: 9
  category: license_system
  question: In Yukon, how many demerit points within a two-year period will result
    in a driver's license suspension?
  choices:
    A: 10 points
    B: 12 points
    C: 15 points
    D: 20 points
  answer: C
  explanation: A driver's license will be suspended if they accumulate 15 or more
    demerit points within a 24-month period.
- id: 10
  category: license_system
  question: 'If you change your name or address, you must notify the Yukon Motor Vehicles
    office within:'
  choices:
    A: 7 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: Yukon law requires drivers to notify Motor Vehicles of any change in
    name or address within 10 days.
- id: 11
  category: license_system
  question: Which of the following documents is NOT required to be in the vehicle
    while driving in Yukon?
  choices:
    A: A valid driver's license
    B: The vehicle's original bill of sale
    C: A valid insurance pink card
    D: The vehicle's registration certificate
  answer: B
  explanation: Drivers must carry their license, valid insurance, and registration.
    The bill of sale is not required for daily operation.
- id: 12
  category: license_system
  question: What is the minimum age to obtain a Class 5P (Novice) license in Yukon?
  choices:
    A: 15 years and 6 months
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: A
  explanation: Since the minimum age for a Class 7 is 15 and you must hold it for
    6 months, the earliest age to obtain a Class 5P is 15.5 years.
- id: 13
  category: license_system
  question: If a GDL driver (Class 7 or 5P) violates the zero-alcohol condition, what
    is the immediate roadside penalty?
  choices:
    A: A 24-hour suspension
    B: A 30-day suspension
    C: A 90-day suspension
    D: Permanent loss of license
  answer: C
  explanation: GDL drivers who have any alcohol in their system are subject to an
    immediate 90-day roadside driver's license suspension.
- id: 14
  category: license_system
  question: Which class of Yukon license is required to operate a motorcycle?
  choices:
    A: Class 4
    B: Class 5
    C: Class 6
    D: Class 8
  answer: C
  explanation: In Yukon, a Class 6 license is specifically required to operate a motorcycle.
- id: 15
  category: license_system
  question: To apply for a Yukon driver's license, you must provide proof of residency.
    Which of the following is an acceptable document for this purpose?
  choices:
    A: A library card from another province
    B: A utility bill in your name with a Yukon address
    C: A business card from a Yukon employer
    D: A credit card statement with a P.O. Box address only
  answer: B
  explanation: To prove Yukon residency, applicants must provide documents like a
    utility bill, rental agreement, or mortgage document showing a physical Yukon
    address.
- id: 16
  category: license_system
  question: In Yukon, what is the minimum third-party liability insurance coverage
    required by law for a motor vehicle?
  choices:
    A: $50,000
    B: $100,000
    C: $200,000
    D: $500,000
  answer: C
  explanation: The Motor Vehicles Act in Yukon requires all registered vehicles to
    carry a minimum of $200,000 in third-party liability insurance.
- id: 17
  category: license_system
  question: Under the Yukon Graduated Driver Licensing (GDL) program, what happens
    to your 'time served' in the Novice (5P) stage if your license is suspended?
  choices:
    A: The suspension has no effect on the graduation date.
    B: The time spent suspended is simply added to the end.
    C: The two-year clock resets, and you must start the Novice stage over from the
      beginning.
    D: You are demoted back to the Learner (Class 7) stage automatically.
  answer: C
  explanation: In Yukon's GDL program, any suspension of driving privileges resets
    the required time for that stage. You must complete the stage for the full required
    duration (e.g., 2 years for Novice) without any suspensions before graduating.
- id: 18
  category: license_system
  question: Which Yukon driver's license class is required to operate a taxi or a
    bus with a seating capacity of not more than 24 passengers?
  choices:
    A: Class 1
    B: Class 3
    C: Class 4
    D: Class 5
  answer: C
  explanation: A Class 4 license in Yukon is required to operate taxis, ambulances,
    or small buses with a seating capacity of up to 24 passengers.
- id: 19
  category: license_system
  question: When applying for a Yukon driver's license, which of the following is
    considered a 'Primary' identification document?
  choices:
    A: A Canadian Birth Certificate
    B: A student ID card
    C: A Social Insurance Number (SIN) card
    D: An employee ID badge
  answer: A
  explanation: Primary documents for Yukon licensing include a Canadian Birth Certificate,
    a valid Passport, or Canadian Citizenship/Permanent Residency documents.
- id: 20
  category: license_system
  question: If you are a Class 7 Learner in Yukon and you are caught driving with
    any amount of alcohol in your blood, how long is the immediate roadside suspension?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: D
  explanation: GDL drivers (Class 7 and 5P) in Yukon are subject to a zero-alcohol
    tolerance policy. Violating this results in an immediate 90-day roadside suspension.
- id: 21
  category: license_system
  question: In Yukon, vehicle registration renewal is staggered throughout the year.
    On what basis is the expiry month determined?
  choices:
    A: The date the vehicle was purchased
    B: The owner's birth month
    C: The first letter of the owner's last name
    D: The vehicle's make and model year
  answer: C
  explanation: Yukon uses a staggered registration system where the expiry month is
    determined by the first letter of the registered owner's surname.
- id: 22
  category: license_system
  question: Which endorsement code is required on a Yukon driver's license to operate
    a vehicle equipped with air brakes?
  choices:
    A: Endorsement A
    B: Endorsement L
    C: Endorsement S
    D: Endorsement 15
  answer: B
  explanation: In Yukon, the 'L' endorsement is required for any driver operating
    a vehicle equipped with air brakes.
- id: 23
  category: license_system
  question: How many demerit points are assigned to a Yukon driver's record for 'Failing
    to remain at the scene of an accident'?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 10 points
  answer: C
  explanation: Under the Yukon Motor Vehicles Act demerit point system, failing to
    remain at the scene of an accident is a serious offense carrying 7 demerit points.
- id: 24
  category: license_system
  question: 'A Yukon Class 5P (Novice) driver must maintain a blood alcohol concentration
    (BAC) of:'
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: All drivers in the Yukon Graduated Driver Licensing (GDL) program,
    including Novice (5P) drivers, must maintain a 0.00% BAC while operating a vehicle.
- id: 25
  category: license_system
  question: If you fail a road test in Yukon, how long must you wait before you are
    eligible to take a second attempt?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 14 days
  answer: C
  explanation: In Yukon, if you fail your first road test, there is a mandatory 7-day
    waiting period before you can attempt the test again.
- id: 26
  category: license_system
  question: Which of the following conditions applies to a Class 6 (Motorcycle) Learner
    in Yukon?
  choices:
    A: They may carry one passenger only.
    B: They may only drive during daylight hours (from sunrise to sunset).
    C: They may drive at any time of day or night.
    D: They must be accompanied by a supervisor on the same motorcycle.
  answer: B
  explanation: Class 6 Learner drivers in Yukon are restricted to daylight driving
    only and are not permitted to carry passengers.
- id: 27
  category: license_system
  question: In Yukon, who is legally responsible for reporting a medical condition
    that may affect a person's ability to drive safely?
  choices:
    A: Only the driver's physician
    B: Only the driver's insurance company
    C: The driver themselves
    D: The driver's employer
  answer: C
  explanation: It is the legal responsibility of the driver to report any medical
    condition or physical disability to Motor Vehicles that may interfere with the
    safe operation of a motor vehicle.
- id: 28
  category: license_system
  question: A standard Yukon driver's license (Class 5) is typically valid for how
    many years before it must be renewed?
  choices:
    A: 2 years
    B: 3 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: In Yukon, a standard driver's license is generally issued for a 5-year
    period, expiring on the driver's birthday.
- id: 29
  category: driver_testing
  question: To pass the Yukon written knowledge test for a Class 7 Learner's license,
    what is the minimum passing score?
  choices:
    A: 70% (14 out of 20 questions)
    B: 75% (15 out of 20 questions)
    C: 80% (16 out of 20 questions)
    D: 90% (18 out of 20 questions)
  answer: C
  explanation: The Yukon knowledge test consists of 20 multiple-choice questions,
    and applicants must answer at least 16 correctly (80%) to pass.
- id: 30
  category: driver_testing
  question: If you fail your first attempt at the Yukon written knowledge test, how
    long must you wait before you can take it again?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 30 days
  answer: A
  explanation: In Yukon, if you fail the knowledge test, you must wait at least 24
    hours before attempting the test again.
- id: 31
  category: driver_testing
  question: What is the minimum visual acuity required to obtain a standard Class
    5 driver's license in Yukon, with or without corrective lenses?
  choices:
    A: 20/20 in both eyes
    B: 20/40 in the better eye
    C: 20/50 in both eyes
    D: 20/60 in the better eye
  answer: B
  explanation: Yukon vision standards require a minimum visual acuity of 20/40 in
    the better eye for a Class 5 license.
- id: 32
  category: driver_testing
  question: At what age must a Yukon driver with a Class 5 license begin submitting
    periodic medical examination reports to Motor Vehicles?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: B
  explanation: In Yukon, drivers must submit a medical report at age 70, 75, and 80,
    and every two years thereafter.
- id: 33
  category: driver_testing
  question: Which of the following would result in an automatic failure during a Yukon
    road test?
  choices:
    A: Failing to use a turn signal once
    B: Driving 2 km/h under the speed limit
    C: A dangerous action that requires the examiner to intervene
    D: Adjusting the mirrors while stopped
  answer: C
  explanation: Any dangerous action, traffic law violation, or collision during the
    road test results in an immediate and automatic failure.
- id: 34
  category: driver_testing
  question: If you fail your third road test attempt in Yukon, what is the mandatory
    waiting period before you can attempt the test a fourth time?
  choices:
    A: 24 hours
    B: 7 days
    C: 14 days
    D: 30 days
  answer: D
  explanation: While the first failure requires a 24-hour wait, subsequent failures
    result in longer wait times; a third failure typically results in a 30-day waiting
    period.
- id: 35
  category: driver_testing
  question: To operate a vehicle equipped with air brakes in Yukon, which endorsement
    must be added to your driver's license?
  choices:
    A: Endorsement 12
    B: Endorsement 15
    C: Endorsement A
    D: Endorsement S
  answer: B
  explanation: Endorsement 15 is required in Yukon to operate any vehicle equipped
    with air brakes.
- id: 36
  category: driver_testing
  question: What is the minimum age requirement to apply for a Class 4 driver's license
    in Yukon (used for taxis, ambulances, and small buses)?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: Applicants for a Class 4 commercial license in Yukon must be at least
    18 years of age.
- id: 37
  category: driver_testing
  question: Which of the following is a requirement for the vehicle you provide for
    a Yukon Class 5 road test?
  choices:
    A: It must be a manual transmission vehicle
    B: It must have a valid license plate and insurance
    C: It must be less than 5 years old
    D: It must be a commercial-grade vehicle
  answer: B
  explanation: The vehicle used for a road test must be safe, mechanically sound,
    and have valid registration and insurance.
- id: 38
  category: driver_testing
  question: In Yukon, using a hand-held electronic communication device while driving
    results in how many demerit points?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Distracted driving (using a hand-held device) in Yukon carries a significant
    fine and 3 demerit points.
- id: 39
  category: driver_testing
  question: What is the visual acuity requirement for professional drivers (Class
    1, 2, 3, and 4) in Yukon?
  choices:
    A: 20/20 in both eyes
    B: 20/30 in the better eye
    C: 20/40 in the better eye
    D: 20/60 in both eyes
  answer: B
  explanation: Professional drivers in Yukon must meet a higher vision standard of
    20/30 in the better eye.
- id: 40
  category: driver_testing
  question: Under Yukon law, how many demerit points are applied for speeding 1 to
    15 km/h over the posted limit?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Speeding between 1 and 15 km/h over the limit in Yukon results in 2
    demerit points.
- id: 41
  category: driver_testing
  question: In Yukon, if a driver fails to yield the right-of-way to a pedestrian,
    how many demerit points are added to their record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failing to yield the right-of-way to a pedestrian is a 3-point demerit
    offense in Yukon.
- id: 42
  category: driver_testing
  question: Which of the following Yukon driver's license classes requires the applicant
    to submit a medical examination report at the time of application?
  choices:
    A: Class 5
    B: Class 6
    C: Class 7
    D: Class 1, 2, 3, or 4
  answer: D
  explanation: Applicants for professional/commercial classes (1, 2, 3, and 4) in
    the Yukon must provide a medical examination report to ensure they meet the physical
    standards for operating large vehicles or transporting passengers.
- id: 43
  category: driver_testing
  question: During a Yukon road test, which of the following vehicle defects would
    result in the immediate cancellation of the test before it begins?
  choices:
    A: A small crack in the windshield that does not obstruct vision
    B: Inoperative brake lights or turn signals
    C: An empty windshield washer fluid reservoir
    D: A dirty exterior
  answer: B
  explanation: The vehicle used for a road test must be in safe mechanical condition.
    Inoperative safety equipment like brake lights or turn signals will result in
    the test being cancelled.
- id: 44
  category: driver_testing
  question: What is the minimum horizontal field of vision required to pass the Yukon
    vision screening for a Class 5 license?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 180 degrees
  answer: C
  explanation: Yukon driver's license applicants must have a horizontal field of vision
    of at least 120 degrees to ensure they can see peripheral hazards.
- id: 45
  category: driver_testing
  question: The Yukon written knowledge test consists of 20 questions. What is the
    minimum number of correct answers required to pass?
  choices:
    A: '14'
    B: '16'
    C: '18'
    D: '20'
  answer: B
  explanation: To pass the Yukon knowledge test, you must achieve a score of at least
    80%, which equates to 16 out of 20 questions correct.
- id: 46
  category: driver_testing
  question: During a Yukon road test, which action by the driver will result in an
    automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: Driving 2 km/h under the speed limit
    C: A dangerous action that requires the examiner to intervene
    D: Adjusting the mirrors while stopped
  answer: C
  explanation: Any dangerous action, such as nearly causing a collision or violating
    a major traffic law that requires the examiner to take control or intervene, results
    in an automatic failure of the road test.
- id: 47
  category: driver_testing
  question: Who is permitted to be in the vehicle during a Yukon Class 5P road test
    besides the driver and the examiner?
  choices:
    A: A parent or legal guardian
    B: A certified driving instructor
    C: No one else is permitted
    D: A translator if the driver does not speak English
  answer: C
  explanation: For safety and to prevent distractions, only the applicant and the
    authorized examiner are allowed in the vehicle during a Yukon road test.
- id: 48
  category: driver_testing
  question: When arriving for a road test in the Yukon, what must you present regarding
    the vehicle you are using?
  choices:
    A: A bill of sale
    B: Valid registration and proof of insurance
    C: A mechanic's inspection certificate from the last 30 days
    D: The vehicle's original owner's manual
  answer: B
  explanation: You must provide a vehicle that is properly registered and insured
    for the road test. The examiner will verify these documents before the test begins.
- id: 49
  category: driver_testing
  question: The Yukon knowledge test is divided into two main sections. What are they?
  choices:
    A: Basic Math and Road Signs
    B: Road Signs and Rules of the Road
    C: Vehicle Maintenance and First Aid
    D: Highway Driving and City Driving
  answer: B
  explanation: The Yukon written test evaluates an applicant's knowledge of traffic
    signs and the territorial rules of the road.
- id: 50
  category: driver_testing
  question: After successfully completing the 24-month Novice (5P) stage in the Yukon,
    how do you obtain your full Class 5 license?
  choices:
    A: It is mailed to you automatically
    B: You must pass another road test
    C: You must go to a Motor Vehicles office and apply for the upgrade
    D: You must retake the written knowledge test
  answer: C
  explanation: Graduation from the GDL program is not automatic. Once you have completed
    the 24-month incident-free period, you must visit a Motor Vehicles office to apply
    for and pay for your full Class 5 license.
- id: 51
  category: driver_testing
  question: If you require an interpreter for the Yukon knowledge test, which of the
    following is true?
  choices:
    A: An interpreter is provided for free by the government
    B: You may bring a friend to interpret the road test instructions while driving
    C: You may use an approved interpreter for the written test, but not for the road
      test
    D: Interpreters are strictly forbidden for all parts of testing
  answer: C
  explanation: While accommodations can sometimes be made for the written knowledge
    test, an interpreter is not allowed in the vehicle during the road test; the driver
    must be able to understand the examiner's basic instructions.
- id: 52
  category: driver_responsibility
  question: 'In Yukon, you must report an accident to the police or the nearest RCMP
    detachment if the total property damage appears to exceed:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: B
  explanation: According to the Yukon Motor Vehicles Act, any accident involving injury,
    death, or property damage exceeding $1,000 must be reported to the police immediately.
- id: 53
  category: driver_responsibility
  question: When an accident occurs in Yukon that requires a police report, how soon
    must the report be made?
  choices:
    A: Within 24 hours
    B: Within 48 hours
    C: Immediately
    D: Within 7 days
  answer: C
  explanation: Drivers are legally required to report qualifying accidents to the
    nearest police officer or RCMP detachment immediately.
- id: 54
  category: driver_responsibility
  question: If you sell your Yukon-registered vehicle to another person, what must
    you do with the license plates?
  choices:
    A: Leave them on the vehicle for the new owner
    B: Remove them and keep them for your own use on another vehicle
    C: Destroy them and notify Motor Vehicles
    D: Give them to the new owner to return to Motor Vehicles
  answer: B
  explanation: In Yukon, license plates follow the owner, not the vehicle. When you
    sell a vehicle, you must remove your plates.
- id: 55
  category: driver_responsibility
  question: Under Yukon law, who is responsible for ensuring that a passenger under
    the age of 16 is properly wearing a seatbelt or child restraint?
  choices:
    A: The passenger
    B: The passenger's parents (even if not in the car)
    C: The driver of the vehicle
    D: The owner of the vehicle
  answer: C
  explanation: The driver is legally responsible for ensuring all passengers under
    the age of 16 are properly secured with seatbelts or in an approved child safety
    seat.
- id: 56
  category: driver_responsibility
  question: What is the maximum fine for a first-time conviction of driving a motor
    vehicle in Yukon without valid insurance?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Driving without insurance is a serious offense in Yukon; a first-time
    conviction can result in a fine of up to $2,000.
- id: 57
  category: driver_responsibility
  question: If you are a new resident of Yukon, how long do you have to register your
    out-of-territory vehicle with Yukon Motor Vehicles?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: While you have 90 days to exchange your driver's license, you must
    register your vehicle in Yukon within 60 days of becoming a resident.
- id: 58
  category: driver_responsibility
  question: 'If you collide with an unattended vehicle and cannot find the owner,
    Yukon law requires you to:'
  choices:
    A: Wait for at least two hours for the owner to return
    B: Leave a written notice with your name, address, and license plate number
    C: Report it to your insurance company within 24 hours only
    D: Drive away if there is no visible damage
  answer: B
  explanation: If the owner cannot be located, you must leave a note in a conspicuous
    place on the vehicle you hit, providing your contact and vehicle information.
- id: 59
  category: driver_responsibility
  question: 'It is the driver''s responsibility to ensure the vehicle''s windows are
    clear. In Yukon, driving with a windshield obstructed by snow or ice is:'
  choices:
    A: Permitted if the driver can see through a small cleared area
    B: An offense under the Motor Vehicles Act
    C: Only illegal if driving on a highway
    D: Recommended but not legally required
  answer: B
  explanation: The Yukon Motor Vehicles Act requires that a driver's view be unobstructed.
    Driving with snow or ice covering windows is an offense.
- id: 60
  category: driver_responsibility
  question: 'If a Yukon peace officer requests to see your proof of insurance and
    you do not have it in the vehicle, you may be:'
  choices:
    A: Given 48 hours to produce it at a police station
    B: Charged with failure to produce a financial responsibility card
    C: Required to leave your vehicle at the roadside
    D: Exempt if you can provide the policy number verbally
  answer: B
  explanation: Drivers must carry a valid insurance card (financial responsibility
    card) in the vehicle at all times and produce it upon the request of a peace officer.
- id: 61
  category: driver_responsibility
  question: A driver in Yukon is diagnosed with a medical condition that may affect
    their ability to drive safely. Who is responsible for notifying Motor Vehicles?
  choices:
    A: Only the driver's doctor
    B: The driver's insurance company
    C: The driver
    D: The driver's employer
  answer: C
  explanation: It is the legal responsibility of the driver to report any medical
    condition or physical disability that may interfere with the safe operation of
    a motor vehicle.
- id: 62
  category: driver_responsibility
  question: What is the legal consequence of lending your Yukon driver's license to
    another person?
  choices:
    A: It is permitted for family members only
    B: It is only an offense if they get into an accident
    C: It is an offense that can lead to a fine and license suspension
    D: It is permitted if you are a passenger in the vehicle
  answer: C
  explanation: Lending your license to someone else or using someone else's license
    is illegal and carries significant penalties, including potential suspension.
- id: 63
  category: driver_responsibility
  question: In Yukon, license plates must be kept in which condition?
  choices:
    A: Attached to the rear window inside the vehicle
    B: Clearly visible and free from dirt or obstructions
    C: Replaced every two years regardless of condition
    D: Painted to match the vehicle's color
  answer: B
  explanation: The Motor Vehicles Act requires that license plates be securely fastened
    and kept clean so that they are clearly legible at all times.
- id: 64
  category: driver_responsibility
  question: 'If you are involved in an accident in Yukon, you are legally required
    to provide your name, address, and vehicle registration number to:'
  choices:
    A: The police only
    B: Your insurance agent only
    C: The other person involved in the accident
    D: No one, until you speak with a lawyer
  answer: C
  explanation: Drivers involved in an accident must remain at the scene and provide
    their information to the other party involved or to a peace officer.
- id: 65
  category: driver_responsibility
  question: 'Under the Yukon Motor Vehicles Act, a peace officer has the authority
    to stop a vehicle and inspect it for:'
  choices:
    A: Mechanical fitness and safety equipment
    B: Cleanliness of the interior
    C: The presence of a spare tire
    D: Fuel efficiency levels
  answer: A
  explanation: Peace officers may stop and inspect vehicles to ensure they meet safety
    standards and that all required equipment (lights, brakes, etc.) is functioning
    properly.
- id: 66
  category: driver_responsibility
  question: 'In Yukon, if you are convicted of driving while your license is suspended,
    the vehicle you are driving may be:'
  choices:
    A: Sold at auction immediately
    B: Impounded for a specific period
    C: Given to the nearest municipality
    D: Painted a different color by the police
  answer: B
  explanation: Yukon law allows for the impoundment of a vehicle if the driver is
    caught operating it while their license is suspended or disqualified.
- id: 67
  category: driver_responsibility
  question: When selling a Yukon-registered vehicle, the seller must notify the Registrar
    of Motor Vehicles within how many days of the sale?
  choices:
    A: 24 hours
    B: 7 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: In Yukon, the seller of a motor vehicle is required to notify the Registrar
    within 7 days of the date of the sale or transfer of ownership.
- id: 68
  category: driver_responsibility
  question: If you are involved in a collision with an unattended vehicle and cannot
    locate the owner, what is your legal responsibility in Yukon?
  choices:
    A: Wait at the scene for at least two hours.
    B: Leave a note with your name, address, and contact information in a conspicuous
      place on the vehicle.
    C: Report it to your insurance company only.
    D: No action is required if the damage is less than $1,000.
  answer: B
  explanation: Yukon law requires drivers who collide with an unattended vehicle to
    take reasonable steps to locate the owner or leave a written notice with their
    contact information and vehicle details.
- id: 69
  category: driver_responsibility
  question: 'In Yukon, vehicle registration usually expires on:'
  choices:
    A: December 31st of every year.
    B: The last day of the owner's birth month.
    C: Exactly one year from the date of purchase.
    D: March 31st of every year.
  answer: B
  explanation: Yukon uses a staggered registration system where vehicle registration
    typically expires on the last day of the owner's birth month.
- id: 70
  category: driver_responsibility
  question: In Yukon, studded tires are legally permitted to be used on vehicles only
    during which time period?
  choices:
    A: Year-round.
    B: November 1 to March 31.
    C: October 1 to April 30.
    D: September 1 to May 31.
  answer: C
  explanation: To prevent road damage, Yukon regulations specify that studded tires
    may only be used between October 1 and April 30.
- id: 71
  category: driver_responsibility
  question: When you bring a vehicle into Yukon from another province or territory,
    how long do you have to register the vehicle in Yukon?
  choices:
    A: 7 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents must register their vehicles in Yukon within 30 days
    of establishing residency.
- id: 72
  category: driver_responsibility
  question: Under the Yukon Motor Vehicles Act, what is the 'Administrative License
    Suspension' period for a driver who provides a breath sample over 0.08 BAC?
  choices:
    A: 24 hours
    B: 30 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Drivers in Yukon who blow over 0.08 or refuse a breathalyzer test face
    an immediate 90-day Administrative License Suspension.
- id: 73
  category: driver_responsibility
  question: In Yukon, failing to stop for a school bus with its red lights flashing
    and stop arm extended can result in how many demerit points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: D
  explanation: Passing a school bus when its red lights are flashing is a serious
    safety violation in Yukon and carries 8 demerit points.
- id: 74
  category: driver_responsibility
  question: When an emergency vehicle (ambulance, fire truck, or police) is stopped
    on the side of a Yukon highway with its lights flashing, drivers must slow down
    to what speed?
  choices:
    A: 30 km/h
    B: 50 km/h (or the posted limit if it is lower)
    C: 70 km/h
    D: Stop completely until the vehicle leaves.
  answer: B
  explanation: Yukon's 'Move Over' law requires drivers to slow to 50 km/h (or the
    posted limit if it is lower than 50 km/h) when passing emergency vehicles stopped
    on the roadside.
- id: 75
  category: driver_responsibility
  question: What is the minimum amount of demerit points a driver receives for 'Careless
    Driving' in Yukon?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 9 points
  answer: C
  explanation: Careless driving is a significant offense in Yukon and results in 6
    demerit points being added to the driver's record.
- id: 76
  category: driver_responsibility
  question: If a Yukon driver is convicted of a first-time impaired driving offense
    under the Criminal Code of Canada, what is the minimum court-ordered driving prohibition?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 3 years
  answer: C
  explanation: A first-time Criminal Code conviction for impaired driving carries
    a mandatory minimum 1-year driving prohibition across Canada, including Yukon.
- id: 77
  category: safe_driving_rules
  question: In Yukon, what is the maximum speed limit in a school zone when the zone
    is in effect?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: According to the Yukon Driver's Basic Handbook, the speed limit in
    school zones is 30 km/h when the zone is in effect.
- id: 78
  category: safe_driving_rules
  question: In Yukon, what is the minimum distance you must park away from a fire
    hydrant?
  choices:
    A: 2 meters
    B: 3 meters
    C: 5 meters
    D: 6 meters
  answer: B
  explanation: Yukon law prohibits parking within 3 meters of a fire hydrant.
- id: 79
  category: safe_driving_rules
  question: When parking near a stop sign, yield sign, or a marked crosswalk in Yukon,
    what is the minimum required distance you must maintain?
  choices:
    A: 3 meters
    B: 5 meters
    C: 6 meters
    D: 10 meters
  answer: C
  explanation: You must not park within 6 meters of a stop sign, yield sign, or a
    marked crosswalk.
- id: 80
  category: safe_driving_rules
  question: Unless a sign specifically prohibits it, are you allowed to turn right
    on a red light in Yukon?
  choices:
    A: No, you must wait for a green light
    B: Yes, but only during daylight hours
    C: Yes, after coming to a complete stop and yielding to pedestrians and other
      traffic
    D: Yes, but only if there is a dedicated turn lane
  answer: C
  explanation: In Yukon, right turns on red are permitted after a full stop and yielding
    the right-of-way, unless a sign indicates otherwise.
- id: 81
  category: safe_driving_rules
  question: When an emergency vehicle with flashing lights is stopped on the side
    of a Yukon highway with a posted speed limit of 70 km/h or higher, what is the
    maximum speed you are allowed to drive while passing it?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: The posted speed limit
  answer: C
  explanation: Under Yukon's 'Move Over' laws, if the speed limit is 70 km/h or higher,
    you must slow down to 60 km/h (or lower if posted) when passing a stopped emergency
    vehicle with lights flashing.
- id: 82
  category: safe_driving_rules
  question: In Yukon, when are you legally required to use your vehicle's headlights?
  choices:
    A: Only between midnight and 5:00 AM
    B: From one hour after sunset to one hour before sunrise
    C: From one-half hour after sunset to one-half hour before sunrise, or whenever
      visibility is less than 150 meters
    D: Only when it is snowing or raining
  answer: C
  explanation: Headlights must be used from 30 minutes after sunset to 30 minutes
    before sunrise, and at any time visibility is reduced to less than 150 meters.
- id: 83
  category: safe_driving_rules
  question: You are driving on a two-lane highway and see a solid yellow line on your
    side of the center line. What does this indicate?
  choices:
    A: You may pass if the road ahead is clear
    B: Passing is prohibited
    C: You are in a high-speed zone
    D: The shoulder is unsafe for emergency stops
  answer: B
  explanation: A solid yellow line on your side of the center line means that passing
    is unsafe and strictly prohibited.
- id: 84
  category: safe_driving_rules
  question: When approaching a school bus with its red lights flashing and stop arm
    extended on an undivided highway in Yukon, who must stop?
  choices:
    A: Only the drivers following the bus
    B: Only the drivers approaching from the front
    C: Drivers in both directions
    D: No one, if there are at least three lanes of traffic
  answer: C
  explanation: On an undivided highway, traffic in both directions must stop for a
    school bus with flashing red lights and an extended stop arm.
- id: 85
  category: safe_driving_rules
  question: At an uncontrolled intersection (an intersection without signs or signals)
    in Yukon, who has the right of way?
  choices:
    A: The vehicle traveling at the higher speed
    B: The vehicle on the left must yield to the vehicle on the right
    C: The vehicle on the right must yield to the vehicle on the left
    D: The vehicle on the busier street
  answer: B
  explanation: At uncontrolled intersections, the driver on the left must yield the
    right-of-way to the driver on the right.
- id: 86
  category: safe_driving_rules
  question: Under normal driving conditions in Yukon, what is the recommended minimum
    following distance behind the vehicle in front of you?
  choices:
    A: One car length
    B: Two seconds
    C: Four seconds
    D: 50 meters
  answer: B
  explanation: The Yukon Driver's Basic Handbook recommends a minimum following distance
    of two seconds under ideal conditions.
- id: 87
  category: safe_driving_rules
  question: When stopping at a railway crossing in Yukon, what is the minimum distance
    you must stop from the nearest rail?
  choices:
    A: 3 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: When a stop is required at a railway crossing, you must stop no closer
    than 5 meters from the nearest rail.
- id: 88
  category: safe_driving_rules
  question: In Yukon, is a left turn on a red light permitted?
  choices:
    A: No, it is never permitted
    B: Yes, from a two-way street onto a one-way street
    C: Yes, from a one-way street onto another one-way street after a full stop
    D: Yes, at any intersection if no traffic is coming
  answer: C
  explanation: A left turn on a red light is only permitted in Yukon when turning
    from a one-way street onto another one-way street, provided the driver stops first
    and yields to others.
- id: 89
  category: safe_driving_rules
  question: What is the default speed limit on Yukon highways outside of municipalities
    unless otherwise posted?
  choices:
    A: 70 km/h
    B: 80 km/h
    C: 90 km/h
    D: 100 km/h
  answer: B
  explanation: Unless otherwise posted, the maximum speed limit on highways outside
    of Yukon municipalities is 80 km/h.
- id: 90
  category: safe_driving_rules
  question: When parking a vehicle uphill on a two-way street with a curb, how should
    the front wheels be turned?
  choices:
    A: To the right (toward the curb)
    B: To the left (away from the curb)
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn the wheels to the left so that
    if the vehicle rolls, the back of the front tire will hit the curb and stop the
    car.
- id: 91
  category: safe_driving_rules
  question: In Yukon, between which dates are studded tires permitted for use on vehicles?
  choices:
    A: September 1 to April 30
    B: October 1 to May 31
    C: November 1 to March 31
    D: All year round
  answer: B
  explanation: In Yukon, studded tires are legally permitted for use from October
    1st to May 31st.
- id: 92
  category: safe_driving_rules
  question: In Yukon, unless otherwise posted, what is the maximum speed limit within
    a municipality?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 30 km/h
  answer: B
  explanation: According to the Yukon Motor Vehicles Act, the standard speed limit
    within a municipality is 50 km/h unless signs indicate otherwise.
- id: 93
  category: safe_driving_rules
  question: In Yukon school zones, what is the speed limit during school days between
    08:00 and 16:30, unless otherwise posted?
  choices:
    A: 20 km/h
    B: 40 km/h
    C: 30 km/h
    D: 50 km/h
  answer: C
  explanation: In Yukon, the speed limit in school zones is 30 km/h on school days
    from 8:00 am to 4:30 pm, unless signs indicate a different time or speed.
- id: 94
  category: safe_driving_rules
  question: Under what specific condition is a left turn on a red light permitted
    in Yukon?
  choices:
    A: From a two-way street onto a one-way street
    B: From a one-way street onto a two-way street
    C: From a one-way street onto another one-way street
    D: It is never permitted
  answer: C
  explanation: In Yukon, you may turn left on a red light only if you are turning
    from a one-way street onto another one-way street, after coming to a complete
    stop and yielding to traffic and pedestrians.
- id: 95
  category: safe_driving_rules
  question: When parking on a level street or an upgrade with a curb, how should you
    position your front wheels?
  choices:
    A: Turned toward the curb
    B: Turned away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, you should turn your wheels away from
    the curb (to the left) so that if the vehicle rolls, the back of the front tire
    will hit the curb and stop the car.
- id: 96
  category: safe_driving_rules
  question: In Yukon, you must not park your vehicle within how many metres of a stop
    sign or yield sign?
  choices:
    A: 3 metres
    B: 5 metres
    C: 6 metres
    D: 10 metres
  answer: C
  explanation: Drivers are prohibited from parking within 6 metres of the approach
    side of a stop sign, yield sign, or traffic control signal.
- id: 97
  category: safe_driving_rules
  question: In Yukon, U-turns are prohibited in which of the following locations?
  choices:
    A: On a curve
    B: Near the crest of a hill where visibility is less than 150 metres
    C: Where a sign prohibits it
    D: All of the above
  answer: D
  explanation: U-turns are illegal on curves, near crests of hills where you cannot
    be seen from 150 metres in either direction, and where signs prohibit the maneuver.
- id: 98
  category: safe_driving_rules
  question: At night, you must dim your high beam headlights when you are within how
    many metres of an oncoming vehicle?
  choices:
    A: 100 metres
    B: 150 metres
    C: 300 metres
    D: 500 metres
  answer: C
  explanation: Yukon law requires drivers to switch to low beams when an oncoming
    vehicle is within 300 metres.
- id: 99
  category: safe_driving_rules
  question: 'When entering a roundabout in Yukon, you must yield the right of way
    to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one; you have the right of way
    D: Only emergency vehicles
  answer: B
  explanation: Before entering a roundabout, you must yield to traffic already circulating
    in the roundabout coming from your left.
- id: 100
  category: defensive_driving
  question: When driving on Yukon's gravel roads, why is it recommended to increase
    your following distance to more than the standard two seconds?
  choices:
    A: To avoid dust clouds that reduce visibility
    B: To prevent windshield damage from flying rocks
    C: Because braking distances are longer on loose gravel
    D: All of the above
  answer: D
  explanation: Gravel roads in the Yukon present unique hazards including reduced
    traction, flying debris, and dust clouds. Increasing following distance addresses
    all these safety concerns.
- id: 101
  category: defensive_driving
  question: To practice effective scanning, how far ahead should a driver look when
    driving on Yukon highways?
  choices:
    A: 5 to 10 seconds
    B: 12 to 15 seconds
    C: 20 to 25 seconds
    D: As far as the horizon
  answer: C
  explanation: The Yukon Driver's Basic Handbook suggests scanning 20 to 25 seconds
    ahead on highways to identify potential hazards, such as wildlife or road obstructions,
    well in advance.
- id: 102
  category: defensive_driving
  question: 'When driving at night in Yukon, you must dim your high-beam headlights
    when an oncoming vehicle is within:'
  choices:
    A: 50 metres
    B: 100 metres
    C: 150 metres
    D: 300 metres
  answer: C
  explanation: According to Yukon driving regulations, you must switch to low-beam
    headlights when an oncoming vehicle is within 150 metres to avoid blinding the
    other driver.
- id: 103
  category: defensive_driving
  question: 'When following another vehicle at night, you must switch your headlights
    to low-beams when you are within:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: In Yukon, you must dim your high beams to low beams when you are within
    60 metres of the vehicle you are following to prevent glare in their rearview
    mirrors.
- id: 104
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet Yukon road, what is the
    correct defensive driving response?
  choices:
    A: Brake hard to regain traction
    B: Turn the steering wheel sharply toward the shoulder
    C: Ease off the accelerator and steer in the direction you want to go
    D: Shift the vehicle into neutral and pump the brakes
  answer: C
  explanation: When hydroplaning, you should not brake. Instead, ease off the gas
    pedal to slow down and steer straight or in the direction you want to go until
    your tires regain contact with the road.
- id: 105
  category: defensive_driving
  question: In Yukon's sub-arctic climate, 'black ice' is a frequent hazard. Where
    is it most likely to form first?
  choices:
    A: In the middle of open fields
    B: On bridges, overpasses, and in shaded areas
    C: On steep uphill climbs
    D: Only on gravel roads
  answer: B
  explanation: Bridges and overpasses freeze sooner than regular roads because cold
    air circulates both above and below the road surface. Shaded areas also retain
    ice longer.
- id: 106
  category: defensive_driving
  question: If a large animal like a moose suddenly appears on the road in front of
    you, what is generally the safest defensive action?
  choices:
    A: Swerve into the oncoming lane to go around it
    B: Brake firmly and stay in your lane
    C: Speed up to pass the animal before it moves
    D: Honk your horn continuously and maintain speed
  answer: B
  explanation: Swerving can lead to a more serious head-on collision or a rollover.
    The safest action is to brake hard and stay in your lane. If a collision is unavoidable,
    try to aim for the animal's hindquarters.
- id: 107
  category: defensive_driving
  question: 'When performing an emergency stop in a vehicle equipped with Anti-lock
    Braking System (ABS), a defensive driver should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply steady, firm pressure to the brake pedal
    C: Lightly tap the brakes to avoid locking
    D: Use the emergency parking brake
  answer: B
  explanation: With ABS, you should 'stomp and steer.' Apply firm, continuous pressure.
    The system will automatically pump the brakes to prevent locking while you maintain
    steering control.
- id: 108
  category: defensive_driving
  question: 'In Yukon, a ''blind spot'' is an area around your vehicle that cannot
    be seen in your mirrors. To check your blind spot, you must:'
  choices:
    A: Adjust your side mirrors further out
    B: Lean forward to change the mirror angle
    C: Turn your head and look over your shoulder
    D: Install a convex 'blind spot' mirror
  answer: C
  explanation: A shoulder check is the only reliable way to ensure the blind spot
    is clear before changing lanes or turning.
- id: 109
  category: defensive_driving
  question: When driving through heavy fog or falling snow in Yukon, which lights
    should you use to maximize visibility?
  choices:
    A: High-beam headlights
    B: Parking lights only
    C: Low-beam headlights
    D: Hazard warning lights
  answer: C
  explanation: High beams reflect off fog and snow, causing glare and reducing visibility.
    Low beams direct light downward onto the road, providing better visibility in
    these conditions.
- id: 110
  category: defensive_driving
  question: When being passed by another vehicle on a two-lane Yukon highway, what
    should a defensive driver do?
  choices:
    A: Speed up to help them get back in the lane faster
    B: Maintain speed or slow down slightly and stay to the right
    C: Move onto the shoulder to give them more room
    D: Turn on high beams to light the way for them
  answer: B
  explanation: It is illegal to increase your speed while being passed. You should
    maintain your speed or slow down slightly to allow the passing vehicle to complete
    the maneuver safely.
- id: 111
  category: defensive_driving
  question: When following a snowplow on a Yukon highway, what is a critical defensive
    driving rule?
  choices:
    A: Follow closely to stay in the cleared path
    B: Pass the plow as quickly as possible on the right
    C: Stay well back to avoid the 'snow cloud' created by the plow
    D: Honk to let the driver know you are behind them
  answer: C
  explanation: Snowplows create 'snow clouds' that can completely hide the plow and
    its blade. Staying back ensures you aren't blinded and aren't hit by salt or sand
    being spread.
- id: 112
  category: defensive_driving
  question: If your vehicle's tires drop off the paved edge of the highway onto a
    soft shoulder, what is the safest way to recover?
  choices:
    A: Steer sharply back onto the pavement immediately
    B: Brake hard to stop as fast as possible
    C: Grip the wheel firmly, ease off the gas, and steer straight until you slow
      down
    D: Shift to a lower gear and accelerate back onto the road
  answer: C
  explanation: Steering sharply back onto the road can cause the vehicle to 'slingshot'
    into oncoming traffic. You should slow down gradually while keeping the vehicle
    straight before gently steering back onto the pavement.
- id: 113
  category: defensive_driving
  question: When driving on Yukon highways in adverse conditions such as rain, snow,
    or on gravel roads, how should you adjust your following distance?
  choices:
    A: Keep it at 2 seconds
    B: Increase it to at least 4 seconds
    C: Decrease it to 1 second to stay in the tracks of the lead vehicle
    D: Following distance does not need to change if you have winter tires
  answer: B
  explanation: In adverse conditions like rain, snow, or when driving on gravel, your
    stopping distance increases. You should double your following distance to at least
    four seconds.
- id: 114
  category: defensive_driving
  question: To practice effective scanning while driving in a Yukon municipality,
    how far ahead should you look?
  choices:
    A: 5 seconds
    B: 12 seconds
    C: 30 seconds
    D: Only at the bumper of the car ahead
  answer: B
  explanation: Defensive driving requires scanning the road at least 12 seconds ahead
    in urban areas to anticipate hazards before they become emergencies.
- id: 115
  category: defensive_driving
  question: When following another vehicle at night in Yukon, at what distance must
    you dim your high beam headlights?
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 200 metres
  answer: B
  explanation: You must dim your high beams when following another vehicle within
    60 metres to prevent reflecting glare into their rearview mirror.
- id: 116
  category: defensive_driving
  question: In Yukon winters, 'black ice' is a major hazard. Which of the following
    best describes how to identify it?
  choices:
    A: It looks like a thick white blanket of snow
    B: It looks like a shiny, wet patch on the road
    C: It is always visible as a dark grey texture
    D: It can only be found on gravel roads
  answer: B
  explanation: Black ice is a thin, transparent layer of ice that often looks like
    a simple wet patch or a puddle on the pavement, making it extremely deceptive
    and dangerous.
- id: 117
  category: defensive_driving
  question: You are driving on a Yukon highway and see an emergency vehicle stopped
    on the side of the road with its lights flashing. What must you do?
  choices:
    A: Maintain your speed and stay in your lane
    B: Slow down to 60 km/h (or the posted limit if lower) and move to the left lane
      if safe
    C: Stop immediately on the highway
    D: Speed up to pass the scene as quickly as possible
  answer: B
  explanation: Yukon's 'Move Over' laws require drivers to slow down to 60 km/h (or
    less if the posted limit is lower) and move into another lane if it is safe to
    do so when passing stopped emergency vehicles with flashing lights.
- id: 118
  category: defensive_driving
  question: 'To check your blind spots before changing lanes in Yukon, you should:'
  choices:
    A: Check your rearview mirror only
    B: Check your side mirrors only
    C: Turn your head and look over your shoulder in the direction of the move
    D: Rely on your vehicle's blind-spot detection system
  answer: C
  explanation: Mirrors do not show everything. A defensive driver must perform a shoulder
    check (turning the head) to ensure the blind spot is clear before changing lanes.
- id: 119
  category: defensive_driving
  question: When driving on a gravel road in Yukon and your rear wheels start to skid,
    which way should you steer?
  choices:
    A: In the opposite direction of the skid
    B: In the direction you want the front of the vehicle to go
    C: Always to the right shoulder
    D: Keep the steering wheel perfectly straight
  answer: B
  explanation: If your vehicle skids, you should steer in the direction you want the
    vehicle to go. This is often referred to as 'steering into the skid'.
- id: 120
  category: defensive_driving
  question: On long Yukon highway trips, how often should a defensive driver take
    a break to prevent fatigue?
  choices:
    A: Every 2 hours or 200 kilometres
    B: Only when they feel their eyes closing
    C: Every 5 hours
    D: Once a day
  answer: A
  explanation: To maintain alertness and prevent driver fatigue, it is recommended
    to take a break every two hours or every 200 kilometres.
- id: 121
  category: defensive_driving
  question: Total stopping distance is made up of perception distance, reaction distance,
    and braking distance. At 100 km/h, about how much distance does the average vehicle
    need to stop on dry pavement?
  choices:
    A: 25 metres
    B: 50 metres
    C: 100 metres
    D: 140 metres
  answer: C
  explanation: At 100 km/h, the total stopping distance for an average passenger vehicle
    under ideal conditions is approximately 100 metres (roughly the length of a football
    field).
- id: 122
  category: alcohol_drugs_health
  question: In Yukon, what is the administrative 'Warn' range for Blood Alcohol Concentration
    (BAC) that results in an immediate 24-hour roadside suspension for a first-time
    offender?
  choices:
    A: 0.02 to 0.04
    B: 0.05 to 0.08
    C: 0.08 to 0.10
    D: 0.10 to 0.15
  answer: B
  explanation: In Yukon, drivers with a BAC between 0.05 and 0.08 are in the 'Warn'
    range. A first-time occurrence results in an immediate 24-hour roadside driver's
    license suspension.
- id: 123
  category: alcohol_drugs_health
  question: If a fully licensed Yukon driver provides a breath sample that is a 'Fail'
    (over 0.08 BAC), how long is the immediate Administrative Roadside Prohibition
    (ARP) suspension?
  choices:
    A: 24 hours
    B: 30 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Under Yukon law, if you provide a breath sample over 0.08 or refuse
    to provide a sample, you receive an immediate 90-day Administrative Roadside Prohibition.
- id: 124
  category: alcohol_drugs_health
  question: In Yukon, if a driver is issued a 90-day Administrative Roadside Prohibition
    for a BAC over 0.08, how long is their vehicle typically impounded?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: C
  explanation: A 'Fail' on a breathalyzer (over 0.08 BAC) or a refusal to provide
    a sample results in a mandatory 30-day vehicle impoundment in addition to the
    license suspension.
- id: 125
  category: alcohol_drugs_health
  question: According to Canadian federal law applicable in Yukon, what is the legal
    limit for THC (cannabis) in the blood for a summary conviction offense?
  choices:
    A: Between 2 nanograms (ng) and 5 ng
    B: Exactly 1 ng
    C: Over 10 ng
    D: There is no limit for THC
  answer: A
  explanation: Federal law, which Yukon enforces, sets a summary conviction limit
    for THC between 2 ng and 5 ng. Having 5 ng or more is a more serious criminal
    offense.
- id: 126
  category: alcohol_drugs_health
  question: In Yukon, who is legally required to report a driver to the Registrar
    of Motor Vehicles if they have a medical condition that may make it dangerous
    for them to operate a vehicle?
  choices:
    A: Only the driver themselves
    B: The driver's employer
    C: Attending physicians and optometrists
    D: The driver's immediate family members
  answer: C
  explanation: In Yukon, medical professionals (physicians and optometrists) are legally
    mandated to report patients who have conditions that may impair their ability
    to drive safely.
- id: 127
  category: alcohol_drugs_health
  question: What is the primary purpose of the Yukon Ignition Interlock Program (IIP)?
  choices:
    A: To prevent the vehicle from starting if the driver has consumed alcohol
    B: To track the vehicle's speed via GPS
    C: To automatically call the police if a driver speeds
    D: To limit the driver to only driving during daylight hours
  answer: A
  explanation: The Ignition Interlock Program requires a device to be installed in
    the vehicle that prevents the engine from starting if it detects alcohol on the
    driver's breath.
- id: 128
  category: alcohol_drugs_health
  question: If a Yukon driver's license is suspended due to an alcohol-related conviction,
    what must they typically complete before their license can be reinstated?
  choices:
    A: A defensive driving course
    B: An impaired driving education or treatment program
    C: A minimum of 100 hours of community service
    D: A high school diploma or equivalent
  answer: B
  explanation: Reinstatement after an impaired driving conviction in Yukon usually
    requires the completion of an approved alcohol/drug education or rehabilitation
    program.
- id: 129
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with even small amounts of certain
    drugs or medications?
  choices:
    A: The effects of the drug are usually cancelled out
    B: The alcohol is absorbed more slowly
    C: The combined effect is often significantly greater than the sum of the parts
    D: There is no measurable change in impairment
  answer: C
  explanation: Combining alcohol and drugs (synergistic effect) can cause extreme
    impairment, far beyond what either substance would cause on its own.
- id: 130
  category: alcohol_drugs_health
  question: 'Under the Yukon Motor Vehicles Act, a peace officer can issue a 24-hour
    roadside suspension if they suspect a driver is impaired by:'
  choices:
    A: Alcohol only
    B: Drugs only
    C: Alcohol, drugs, or fatigue
    D: Alcohol or drugs only
  answer: C
  explanation: Yukon peace officers have the authority to remove a driver from the
    road for 24 hours if they believe the driver’s ability is affected by alcohol,
    drugs, or physical/mental fatigue.
- id: 131
  category: alcohol_drugs_health
  question: If a Yukon driver receives a second 'Warn' range BAC (0.05 to 0.08) within
    a five-year period, what is the license suspension duration?
  choices:
    A: 24 hours
    B: 30 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: While a first 'Warn' results in a 24-hour suspension, a second 'Warn'
    within five years results in a 30-day driver's license suspension in Yukon.
- id: 132
  category: alcohol_drugs_health
  question: When taking prescription or over-the-counter medication, whose responsibility
    is it to ensure the medication does not impair driving ability?
  choices:
    A: The pharmacist only
    B: The doctor only
    C: The driver
    D: The police
  answer: C
  explanation: It is the driver's legal responsibility to ensure they are not impaired.
    They should consult with a doctor or pharmacist about side effects before driving.
- id: 133
  category: alcohol_drugs_health
  question: 'In Yukon, if you are convicted of ''Refusal to provide a breath sample''
    under the Criminal Code, the penalties are:'
  choices:
    A: Lighter than a BAC conviction
    B: The same as or harsher than driving with a BAC over 0.08
    C: Only a small fine with no license suspension
    D: Applicable only if an accident occurred
  answer: B
  explanation: Refusing to provide a breath or blood sample is a criminal offense
    in Canada and carries penalties equivalent to or greater than those for impaired
    driving convictions.
- id: 134
  category: alcohol_drugs_health
  question: If a driver in Yukon is diagnosed with a condition like epilepsy or diabetes
    that may affect their driving, when must they notify the Motor Vehicles office?
  choices:
    A: Immediately
    B: Only when their license expires
    C: Only if they are involved in a collision
    D: Within 30 days of their next birthday
  answer: A
  explanation: Drivers are required to immediately report any medical condition that
    may affect their ability to safely operate a motor vehicle to the Registrar of
    Motor Vehicles.
- id: 135
  category: alcohol_drugs_health
  question: In Yukon, if an experienced (non-GDL) driver is caught with a Blood Alcohol
    Concentration (BAC) between 0.05 and 0.08 for the first time, what is the immediate
    administrative penalty?
  choices:
    A: A 24-hour roadside license suspension
    B: A 90-day license suspension
    C: A $1,000 fine and vehicle impoundment
    D: Permanent loss of driving privileges
  answer: A
  explanation: In Yukon, experienced drivers who provide a breath sample in the 'warn'
    range (0.05 to 0.08 BAC) are subject to an immediate 24-hour roadside driver's
    license suspension for a first occurrence.
- id: 136
  category: alcohol_drugs_health
  question: Under the Yukon Motor Vehicles Act, what are the consequences for refusing
    to provide a breath or blood sample when lawfully demanded by a peace officer?
  choices:
    A: A small fine and a 24-hour suspension
    B: The same penalties as having a BAC over 0.08
    C: No penalty if it is your first time being pulled over
    D: A written warning only
  answer: B
  explanation: Refusing to provide a breath or blood sample is a criminal offense
    and carries the same penalties as driving with a BAC over 0.08, including immediate
    license suspension and vehicle impoundment.
- id: 137
  category: alcohol_drugs_health
  question: What is the maximum legal Blood Alcohol Concentration (BAC) for a fully
    licensed, experienced driver in Yukon before they face Criminal Code charges?
  choices:
    A: '0.02'
    B: '0.05'
    C: '0.08'
    D: '0.10'
  answer: C
  explanation: While administrative penalties begin at 0.05 BAC in Yukon, the federal
    Criminal Code limit for impaired driving is 0.08 BAC.
- id: 138
  category: alcohol_drugs_health
  question: In Yukon, how long is the mandatory vehicle impoundment period for a driver
    caught with a BAC over 0.08 for the first time?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: C
  explanation: Under Yukon law, if you are caught driving with a BAC over 0.08 or
    refuse a breath demand, your vehicle will be impounded for 30 days.
- id: 139
  category: alcohol_drugs_health
  question: What is the Yukon policy regarding cannabis use for drivers in the Graduated
    Driver Licensing (GDL) program?
  choices:
    A: They may have up to 2ng of THC in their blood
    B: They are permitted to drive if they have a medical prescription
    C: They must have zero THC in their blood
    D: The same rules apply as for alcohol (0.05 limit)
  answer: C
  explanation: Yukon has a zero-tolerance policy for drugs (including THC/cannabis)
    for all drivers in the Graduated Driver Licensing (GDL) program, including Learner
    and Novice stages.
- id: 140
  category: alcohol_drugs_health
  question: In Yukon, what must a driver do to have their license reinstated after
    an alcohol-related suspension or conviction?
  choices:
    A: Simply wait for the suspension period to end
    B: Pay a reinstatement fee and potentially complete an assessment or education
      program
    C: Retake the Class 7 knowledge test only
    D: Write a letter of apology to the Motor Vehicles office
  answer: B
  explanation: Reinstatement after an alcohol-related suspension in Yukon usually
    requires paying a fee and may involve mandatory participation in an impaired driving
    education or treatment program.
- id: 141
  category: alcohol_drugs_health
  question: Which of the following is true regarding driving while fatigued in Yukon?
  choices:
    A: It is not considered a safety risk in the Yukon
    B: Fatigue can impair driving as much as alcohol
    C: Fatigue only affects drivers over the age of 65
    D: Loud music is a proven way to fully eliminate fatigue
  answer: B
  explanation: Fatigue slows reaction time and decreases awareness. Studies show that
    being awake for 17 to 19 hours can produce impairment levels similar to a BAC
    of 0.05.
- id: 142
  category: alcohol_drugs_health
  question: If you are taking a prescription drug, what should you do before driving?
  choices:
    A: Drive only if you feel okay
    B: Check with your doctor or pharmacist about side effects that affect driving
    C: Take a double dose to ensure you stay alert
    D: Wait at least 30 minutes after taking the pill before starting the car
  answer: B
  explanation: Many prescription and over-the-counter drugs cause drowsiness or dizziness.
    It is the driver's responsibility to ensure they are not impaired by any substance
    before driving.
- id: 143
  category: alcohol_drugs_health
  question: What is the Yukon's 'Ignition Interlock Program'?
  choices:
    A: A program that automatically starts your car in cold weather
    B: A device that prevents a vehicle from starting if it detects alcohol on the
      driver's breath
    C: A speed-limiting device for new drivers
    D: An anti-theft system required for all Yukon vehicles
  answer: B
  explanation: The Ignition Interlock Program allows certain drivers suspended for
    impaired driving to regain driving privileges early by installing a breathalyzer
    device in their vehicle.
- id: 144
  category: alcohol_drugs_health
  question: In Yukon, if a driver's license is marked with 'Condition J', what does
    this mean?
  choices:
    A: The driver must wear corrective lenses
    B: The driver is only allowed to drive during daylight hours
    C: The driver must have an ignition interlock device installed
    D: The driver is a student in the GDL program
