  explanation: Condition J on a Yukon driver's license indicates a restriction requiring
    the operation of a vehicle equipped with an ignition interlock device.
- id: 145
  category: alcohol_drugs_health
  question: If you are involved in a collision in Yukon and a peace officer suspects
    you have alcohol in your body, what can they legally require?
  choices:
    A: Nothing, unless you were clearly at fault
    B: An immediate roadside breath test
    C: A 10-day waiting period before questioning
