- id: 133
  category: alcohol_drugs_health
  question: 'Au Yukon, si vous êtes reconnu coupable de « refus de fournir un échantillon
    d''haleine » en vertu du Code criminel, les sanctions sont :'
  choices:
    A: Plus légères qu'une condamnation pour taux d'alcoolémie élevé
    B: Identiques ou plus sévères que la conduite avec un taux d'alcoolémie supérieur
      à 0,08
    C: Seulement une petite amende sans suspension de permis
    D: Applicables uniquement si un accident s'est produit
  answer: B
  explanation: Le refus de fournir un échantillon d'haleine ou de sang est une infraction
    criminelle au Canada et entraîne des sanctions équivalentes ou supérieures à celles
    d'une condamnation pour conduite avec facultés affaiblies.
- id: 134
  category: alcohol_drugs_health
  question: Si un conducteur au Yukon reçoit un diagnostic pour une condition telle
