    C: Repasser uniquement l'examen théorique de classe 7
    D: Écrire une lettre d'excuses au bureau des véhicules automobiles
  answer: B
  explanation: Le rétablissement après une suspension liée à l'alcool au Yukon nécessite
    généralement le paiement de frais et peut impliquer une participation obligatoire
    à un programme d'éducation ou de traitement contre la conduite avec facultés affaiblies.
- id: 141
  category: alcohol_drugs_health
  question: Laquelle des affirmations suivantes est vraie concernant la conduite en
    état de fatigue au Yukon ?
  choices:
    A: Cela n'est pas considéré comme un risque pour la sécurité au Yukon
    B: La fatigue peut altérer la conduite autant que l'alcool
    C: La fatigue n'affecte que les conducteurs de plus de 65 ans
    D: La musique forte est un moyen éprouvé d'éliminer complètement la fatigue
  answer: B
  explanation: La fatigue ralentit le temps de réaction et diminue la vigilance. Des
    études montrent que le fait de rester éveillé pendant 17 à 19 heures peut produire
    des niveaux d'affaiblissement similaires à un taux d'alcoolémie (BAC) de 0,05.
- id: 142
  category: alcohol_drugs_health
  question: Si vous prenez un médicament sur ordonnance, que devriez-vous faire avant
