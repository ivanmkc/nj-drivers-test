    en informer le bureau des véhicules automobiles ?
  choices:
    A: Immédiatement
    B: Uniquement à l'expiration de son permis
    C: Uniquement s'il est impliqué dans une collision
    D: Dans les 30 jours suivant son prochain anniversaire
  answer: A
  explanation: Les conducteurs sont tenus de signaler immédiatement au registraire
    des véhicules automobiles tout problème de santé susceptible d'affecter leur capacité
