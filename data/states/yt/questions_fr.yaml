  choices:
    A: Ils peuvent avoir jusqu'à 2 ng de THC dans le sang
    B: Ils sont autorisés à conduire s'ils ont une prescription médicale
    C: Ils doivent avoir un taux de THC nul dans le sang
    D: Les mêmes règles s'appliquent que pour l'alcool (limite de 0,05)
  answer: C
  explanation: Le Yukon applique une politique de tolérance zéro pour les drogues
    (y compris le THC/cannabis) pour tous les conducteurs du programme de permis de
    conduire progressif (GDL), y compris pour les étapes d'apprentissage et de débutant.
- id: 140
  category: alcohol_drugs_health
  question: Au Yukon, que doit faire un conducteur pour obtenir le rétablissement
    de son permis après une suspension ou une condamnation liée à l'alcool ?
  choices:
    A: Attendre simplement la fin de la période de suspension
    B: Payer des frais de rétablissement et potentiellement suivre un programme d'évaluation
