  answer: A
  explanation: Pour une première accumulation de 15 points en deux ans, le permis
    de conduire d'un conducteur du Yukon est suspendu pour une période d'un mois.
- id: 161
  category: penalties_and_points
  question: Au Yukon, quelle est la pénalité en points d'inaptitude pour avoir omis
    de s'arrêter devant un autobus scolaire dont les feux rouges clignotent ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: L'omission de s'arrêter pour un autobus scolaire dont les feux rouges
    clignotent est considérée comme une infraction grave au Yukon et entraîne 6 points
    d'inaptitude.
- id: 162
  category: penalties_and_points
  question: Quelle est la pénalité en points d'inaptitude pour l'utilisation d'un
    appareil électronique portatif au volant (conduite distraite) au Yukon ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: La loi du Yukon attribue 3 points d'inaptitude pour les infractions
    de conduite distraite impliquant des appareils électroniques portatifs.
- id: 163
  category: penalties_and_points
  question: Si un conducteur du programme de licence de conduite graduée (GDL - Graduated
    Driver Licensing) du Yukon accumule combien de points recevra-t-il une suspension
    ?
  choices:
    A: 3 points
    B: 6 points
    C: 9 points
    D: 15 points
  answer: B
  explanation: Alors que les titulaires d'un permis complet sont suspendus à 15 points,
    les conducteurs du programme GDL (classes 7 et 5P) font face à une suspension
    de permis s'ils accumulent 6 points d'inaptitude ou plus.
- id: 164
  category: penalties_and_points
  question: Qu'arrive-t-il aux amendes pour excès de vitesse dans une zone de construction
    désignée au Yukon lorsque des travailleurs sont présents ?
  choices:
    A: L'amende est suspendue
    B: L'amende est doublée
    C: L'amende est triplée
    D: L'amende est augmentée d'un montant fixe de 500 $
  answer: B
  explanation: Au Yukon, les amendes pour excès de vitesse sont doublées lorsque l'infraction
    se produit dans une zone de construction désignée pendant que des travailleurs
    sont présents.
- id: 165
  category: penalties_and_points
  question: Si un conducteur du Yukon reçoit une deuxième suspension pour points d'inaptitude
    au cours d'une période de deux ans, pendant combien de temps le permis sera-t-il
    suspendu ?
  choices:
    A: 1 mois
    B: 3 mois
    C: 6 mois
    D: 12 mois
  answer: B
  explanation: Une deuxième suspension au cours d'une période de 24 mois en raison
    de l'accumulation de points d'inaptitude entraîne une suspension de permis de
    3 mois.
- id: 166
  category: penalties_and_points
  question: Quelle est la pénalité en points d'inaptitude pour avoir omis de céder
    le passage à un piéton dans un passage pour piétons au Yukon ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Le fait de ne pas céder le passage à un piéton entraîne l'inscription
    de 3 points d'inaptitude au dossier de conduite du conducteur du Yukon.
- id: 167
  category: penalties_and_points
  question: Au Yukon, si vous êtes reconnu coupable de conduite sans assurance de
    véhicule automobile, quelle est l'amende maximale pour une première infraction
    ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: Conduire sans assurance valide est une infraction grave au Yukon ;
    l'amende pour une première condamnation peut s'élever à 2 000 $.
- id: 168
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour une « conduite acrobatique
    » (stunting) sur une route du Yukon ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Une condamnation pour conduite acrobatique au Yukon entraîne l'ajout
    de 3 points d'inaptitude au dossier du conducteur.
- id: 169
  category: sharing_the_road
  question: Au Yukon, lorsque vous approchez d'un autobus scolaire par l'avant ou
    par l'arrière dont les feux rouges clignotent et que le bras d'arrêt est déployé,
    que devez-vous faire ?
  choices:
    A: Ralentir à 20 km/h et dépasser avec prudence
    B: S'arrêter à au moins 5 mètres et rester arrêté jusqu'à ce que les feux cessent
      de clignoter
    C: S'arrêter uniquement si vous circulez dans la même direction que l'autobus
    D: Klaxonner et avancer lentement
  answer: B
  explanation: Selon la Loi sur les véhicules automobiles du Yukon, les conducteurs
    circulant dans les deux sens sur une route à chaussée unique doivent s'arrêter
    à au moins 5 mètres d'un autobus scolaire lorsque ses feux rouges clignotent et
    que le bras d'arrêt est sorti.
- id: 170
  category: sharing_the_road
  question: En dépassant un véhicule d'urgence arrêté avec ses sirènes ou ses feux
    clignotants activés sur une route du Yukon, quelle est la vitesse maximale autorisée
    si la limite de vitesse affichée est de 100 km/h ?
  choices:
    A: 80 km/h
    B: 70 km/h
    C: 60 km/h
    D: 50 km/h
  answer: C
  explanation: Les lois du Yukon sur le corridor de sécurité (Move Over) exigent que
    les conducteurs ralentissent à 60 km/h (ou à la limite affichée si elle est inférieure
    à 60 km/h) lorsqu'ils dépassent des véhicules d'urgence ou des dépanneuses arrêtés
    sur le bord de la route avec des feux clignotants.
- id: 171
  category: sharing_the_road
  question: Lorsqu'un piéton utilise une canne blanche ou est accompagné d'un chien-guide
    à un passage pour piétons au Yukon, que doit faire un conducteur ?
  choices:
    A: Continuer si le piéton n'est pas encore dans votre voie
    B: Lui céder le passage et lui laisser un espace supplémentaire pour terminer
      sa traversée
    C: Klaxonner pour lui signaler votre présence
    D: S'arrêter uniquement s'il y a un feu de circulation
  answer: B
  explanation: Les conducteurs doivent faire preuve d'une prudence extrême et toujours
    céder le passage aux piétons ayant une déficience visuelle, identifiés par une
    canne blanche ou un chien-guide.
- id: 172
  category: sharing_the_road
  question: Lorsque vous suivez une motocyclette au Yukon, pourquoi devriez-vous maintenir
    une distance de suivi plus grande que pour une voiture ?
  choices:
    A: Les motocyclettes s'arrêtent beaucoup plus lentement que les voitures
    B: Les motocyclettes sont plus susceptibles d'occuper deux voies
    C: Les motocyclettes peuvent s'arrêter très rapidement et sont plus affectées
      par les dangers de la route comme le gravier ou les nids-de-poule
    D: C'est une obligation légale de rester à 100 mètres derrière
  answer: C
  explanation: Les motocyclettes peuvent s'arrêter plus rapidement que les véhicules
    plus gros et peuvent devoir dévier soudainement pour éviter des dangers comme
    le gravier ou les fissures dans la chaussée, qui sont courants au Yukon.
- id: 173
  category: sharing_the_road
  question: 'Si vous conduisez sur une route à deux sens et qu''un véhicule d''urgence
    avec sirènes et feux clignotants s''approche par l''arrière, vous devez :'
  choices:
    A: Accélérer pour libérer le passage
    B: S'arrêter exactement là où vous êtes dans la voie
    C: Se ranger sur le bord droit de la chaussée et s'arrêter
    D: Se déplacer vers la gauche dans la voie inverse
  answer: C
  explanation: Lorsqu'un véhicule d'urgence s'approche avec des sirènes ou des feux
    clignotants, les conducteurs doivent se ranger à droite le plus loin possible
    et s'arrêter complètement jusqu'à ce que le véhicule soit passé.
- id: 174
  category: sharing_the_road
  question: Au Yukon, lorsqu'un cycliste partage la route, quelle est la distance
    minimale recommandée que vous devez maintenir en le dépassant ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 3 mètres
    D: 5 mètres
  answer: B
  explanation: Les pratiques de conduite sécuritaire au Yukon recommandent de laisser
    au moins 1 mètre d'espace entre votre véhicule et un cycliste lors du dépassement
    pour assurer sa sécurité.
- id: 175
  category: sharing_the_road
  question: Les gros camions commerciaux ont des « No-Zones » (zones de danger). À
    quoi ce terme fait-il référence ?
  choices:
    A: Aux zones où les camions ne sont pas autorisés à circuler
    B: À la zone de chargement du camion
    C: Aux angles morts importants situés à l'avant, à l'arrière et sur les côtés
      du camion
    D: À la limite de poids du camion
  answer: C
  explanation: Les « No-Zones » sont de grands angles morts où le conducteur du camion
    ne peut pas voir les autres véhicules. Si vous ne voyez pas les rétroviseurs du
    conducteur du camion, celui-ci ne peut pas vous voir.
- id: 176
  category: sharing_the_road
  question: Vous approchez d'une intersection où un piéton vient de descendre du trottoir
    pour s'engager dans un passage pour piétons non marqué. Qui a la priorité ?
  choices:
    A: Le conducteur, car le passage n'est pas marqué
    B: Le piéton
    C: La personne qui est arrivée à l'intersection en premier
    D: Le conducteur, s'il tourne à droite
  answer: B
  explanation: Au Yukon, les piétons ont la priorité à toutes les intersections, que
    le passage pour piétons soit marqué par des lignes ou qu'il soit un prolongement
    non marqué du trottoir.
- id: 177
  category: sharing_the_road
  question: 'Lorsqu''un gros camion tourne à droite à une intersection, il peut avoir
    besoin de :'
  choices:
    A: Faire un virage large vers la gauche avant de tourner
    B: S'arrêter et reculer au milieu du virage
    C: Tourner à partir de la voie de gauche
    D: Accélérer pour dégager l'intersection
  answer: A
  explanation: En raison de leur longueur, les gros camions doivent souvent faire
    un virage large vers la gauche pour éviter la bordure du trottoir lors d'un virage
    à droite. Les conducteurs ne doivent jamais essayer de se faufiler entre le camion
    et le trottoir.
- id: 178
  category: sharing_the_road
  question: Au Yukon, les cyclistes sont-ils autorisés à circuler sur le trottoir
    ?
  choices:
    A: Oui, c'est plus sûr que la route
    B: Oui, mais seulement s'ils ont plus de 18 ans
    C: Non, les vélos sont considérés comme des véhicules et doivent circuler sur
      la route
    D: Uniquement dans les zones résidentielles
  answer: C
  explanation: En vertu de la Loi sur les véhicules automobiles du Yukon, les vélos
    sont généralement traités comme des véhicules et ne sont pas autorisés sur les
    trottoirs, à moins que les règlements municipaux locaux ne l'autorisent spécifiquement
    (généralement uniquement pour les jeunes enfants).
- id: 179
  category: sharing_the_road
  question: 'Lorsque vous conduisez derrière un véhicule à lente allure (marqué d''un
    triangle orange), vous devez :'
  choices:
    A: Klaxonner jusqu'à ce qu'il se range
    B: Dépasser immédiatement, même dans un virage
    C: Être patient et ne dépasser que lorsque cela est sécuritaire et légal
    D: Suivre de près pour l'encourager à accélérer
  answer: C
  explanation: Les véhicules à lente allure, tels que l'équipement agricole ou les
    machines de construction, sont courants au Yukon. Les conducteurs doivent être
    patients et attendre une zone de dépassement sûre et légale.
- id: 180
  category: sharing_the_road
  question: Si vous conduisez sur une route avec un terre-plein central (route à chaussées
    séparées) et qu'un autobus scolaire est arrêté de l'autre côté avec ses feux rouges
    clignotants, devez-vous vous arrêter ?
  choices:
    A: Oui, vous devez toujours vous arrêter pour un autobus scolaire
    B: Non, la circulation du côté opposé d'une route à chaussées séparées n'a pas
      besoin de s'arrêter
    C: Seulement si le conducteur de l'autobus vous fait signe de vous arrêter
    D: Seulement s'il y a des enfants qui traversent le terre-plein
  answer: B
  explanation: Sur une route à chaussées séparées où il y a une barrière physique
    ou un terre-plein entre les voies, la circulation venant de la direction opposée
    d'un autobus scolaire arrêté n'est pas tenue de s'arrêter.
- id: 181
  category: sharing_the_road
  question: 'Lorsqu''un autobus de transport en commun au Yukon a actionné son clignotant
    et tente de réintégrer la circulation à partir d''un arrêt d''autobus, vous devez
    :'
  choices:
    A: Accélérer pour dépasser l'autobus
    B: Céder le passage et permettre à l'autobus de s'insérer
    C: Maintenir votre vitesse ; l'autobus doit attendre qu'il y ait un espace
    D: Klaxonner pour avertir le chauffeur de l'autobus
  answer: B
  explanation: C'est une question de sécurité et de courtoisie que de céder le passage
    aux autobus de transport en commun qui signalent leur intention de réintégrer
    le flux de circulation à partir d'un arrêt d'autobus désigné.
- id: 182
  category: sharing_the_road
  question: Laquelle des affirmations suivantes est vraie concernant la « circulation
    entre les files » (conduire entre des rangées de véhicules à l'arrêt ou en mouvement)
    pour les motocyclettes au Yukon ?
  choices:
    A: C'est légal si la circulation roule à moins de 30 km/h
    B: C'est légal uniquement pour les conducteurs expérimentés
    C: C'est illégal et dangereux
    D: C'est encouragé pour réduire la congestion routière
  answer: C
  explanation: La circulation entre les files est illégale au Yukon. Les motocyclettes
    ont droit à l'utilisation complète d'une voie et doivent respecter les mêmes règles
    de la route que les autres véhicules à moteur.
- id: 183
  category: sharing_the_road
  question: En vertu de la loi sur le corridor de sécurité du Yukon, que doit faire
    un conducteur lorsqu'il dépasse un véhicule d'urgence arrêté avec ses sirènes
    ou ses gyrophares clignotants sur une autoroute dont la limite de vitesse est
    de 100 km/h ?
  choices:
    A: Ralentir à 70 km/h
    B: Ralentir à 60 km/h et se déplacer vers la voie de gauche si cela peut être
      fait en toute sécurité
    C: Maintenir sa vitesse mais se déplacer vers la voie de gauche
    D: Ralentir à 50 km/h
  answer: B
  explanation: La loi du Yukon exige que les conducteurs ralentissent à 60 km/h (ou
    à la limite affichée si elle est inférieure à 60 km/h) et se déplacent vers la
    voie la plus éloignée lorsqu'ils dépassent des véhicules d'urgence ou des dépanneuses
    arrêtés sur le bord de la route avec des feux clignotants.
- id: 184
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire est arrêté sur une autoroute séparée par un
    terre-plein central, quels conducteurs sont tenus de s'arrêter pour les feux rouges
    clignotants ?
  choices:
    A: Les conducteurs dans toutes les voies et dans les deux sens
    B: Uniquement les conducteurs qui suivent l'autobus
    C: Uniquement les conducteurs dans les voies venant en sens inverse
    D: Personne n'est tenu de s'arrêter sur une autoroute divisée
  answer: B
  explanation: Sur une autoroute séparée par un terre-plein central, seuls les conducteurs
    s'approchant de l'autobus scolaire par l'arrière (suivant l'autobus) sont tenus
    de s'arrêter lorsque les feux rouges clignotent.
- id: 185
  category: sharing_the_road
  question: Lorsque vous dépassez un cycliste sur une route du Yukon, quelle est la
    distance minimale recommandée que vous devez maintenir entre votre véhicule et
    le cycliste ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 2 mètres
    D: 3 mètres
  answer: B
  explanation: Le Guide du conducteur du Yukon recommande de laisser au moins un mètre
    d'espace entre votre véhicule et un cycliste pour assurer la sécurité, surtout
    au cas où le cycliste devrait faire une embardée pour éviter un danger.
- id: 186
  category: sharing_the_road
  question: 'Si un véhicule d''urgence (ambulance, camion de pompiers ou voiture de
    police) s''approche de vous de n''importe quelle direction avec sa sirène et ses
    gyrophares allumés, vous devez :'
  choices:
    A: Accélérer pour libérer le passage
    B: S'arrêter exactement là où vous êtes dans la voie
    C: Se ranger sur le bord droit de la route et s'arrêter
    D: Se ranger sur le bord gauche de la route et s'arrêter
  answer: C
  explanation: Les conducteurs doivent céder le passage aux véhicules d'urgence en
    se rangeant immédiatement vers la bordure ou le bord droit de la chaussée et en
    s'arrêtant jusqu'à ce que le véhicule soit passé.
- id: 187
  category: sharing_the_road
  question: À une intersection où un piéton traverse dans un passage pour piétons
    non marqué, qui a la priorité de passage ?
  choices:
    A: L'automobiliste, car le passage n'est pas marqué
    B: Le piéton
    C: Celui qui est arrivé à l'intersection en premier
    D: L'automobiliste, s'il klaxonne en premier
  answer: B
  explanation: Au Yukon, les piétons ont la priorité à toutes les intersections, que
    le passage pour piétons soit marqué ou non (un passage pour piétons « implicite
    »).
- id: 188
  category: sharing_the_road
  question: Lorsque vous partagez la route avec une motocyclette, pourquoi devriez-vous
    laisser la largeur d'une voie complète en la dépassant ?
  choices:
    A: Les motocyclettes ont légalement droit à toute la largeur d'une voie
    B: Les motocyclettes sont plus rapides que les voitures
    C: Pour éviter que le souffle du vent causé par votre voiture ne les renverse
    D: À la fois A et C
  answer: D
  explanation: Les motocyclistes ont droit à l'utilisation complète d'une voie. Dépasser
    de trop près peut être dangereux en raison des rafales de vent ou de la nécessité
    pour le motocycliste d'ajuster sa position pour éviter des dangers sur la route.
- id: 189
  category: sharing_the_road
  question: 'Les gros camions font souvent un large écart vers la gauche avant d''effectuer
    un virage à droite. En tant que conducteur suivant le camion, vous devriez :'
  choices:
    A: Dépasser le camion par la droite pendant qu'il s'écarte vers la gauche
    B: Rester bien en arrière et ne pas tenter de dépasser par la droite
    C: Klaxonner pour avertir le chauffeur du camion qu'il est dans la mauvaise voie
    D: Accélérer pour dépasser par la gauche
  answer: B
  explanation: Les camions ont besoin d'espace supplémentaire pour effectuer des virages.
    Tenter de dépasser un camion par la droite pendant qu'il tourne à droite est extrêmement
    dangereux et peut entraîner une collision par coincement.
- id: 190
  category: sharing_the_road
  question: Au Yukon, si vous êtes reconnu coupable d'avoir omis de rester sur les
    lieux d'un accident, combien de points d'inaptitude sont ajoutés à votre dossier
    de conduite ?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 7 points
  answer: D
  explanation: Le délit de fuite (omission de rester sur les lieux d'un accident)
    est une infraction grave au Yukon et entraîne une pénalité de 7 points d'inaptitude.
- id: 191
  category: sharing_the_road
  question: Lorsque vous conduisez à proximité d'un chasse-neige au Yukon, quelle
    est la manière la plus sûre de procéder ?
  choices:
    A: Dépasser le chasse-neige par la droite
    B: Suivre à une distance sécuritaire et attendre que le conducteur se range sur
      le côté ou qu'il y ait une zone de dépassement sûre
    C: Conduire juste derrière lui pour profiter de la route dégagée
    D: Dépasser le chasse-neige le plus rapidement possible, même si la visibilité
      est faible
  answer: B
  explanation: Les chasse-neige créent souvent des « nuages de neige » qui obstruent
    la visibilité. Les conducteurs doivent rester en retrait, être patients et ne
    dépasser que lorsque cela est sûr et légal, en gardant à l'esprit que la route
    devant le chasse-neige n'est pas déneigée.
- id: 192
  category: sharing_the_road
  question: À quoi sert la « règle des deux secondes » lors de la conduite au Yukon
    ?
  choices:
    A: Le temps nécessaire pour vérifier vos rétroviseurs
    B: La distance de suivi minimale derrière un autre véhicule dans des conditions
      idéales
    C: Le temps pendant lequel vous devez vous arrêter à un panneau d'arrêt
    D: Le temps accordé pour dégager une intersection après que le feu est passé au
      rouge
  answer: B
  explanation: La règle des deux secondes est un moyen simple de s'assurer que vous
    maintenez une distance de sécurité suffisante derrière le véhicule qui vous précède
    dans des conditions de conduite idéales.
- id: 193
  category: sharing_the_road
  question: 'Lorsque vous voyez un panneau « Log Haul Road » (chemin de transport
    de bois) au Yukon, vous devez être particulièrement conscient que :'
  choices:
    A: Les camions de transport de bois ont la priorité en tout temps
    B: Les camions de transport de bois peuvent être très longs et nécessiter plus
      d'espace pour tourner ou s'arrêter
    C: La route est fermée aux véhicules de tourisme
    D: Vous devez conduire avec vos feux de détresse allumés
  answer: B
  explanation: Les panneaux de transport de grumes avertissent les conducteurs que
    de gros camions lourds utilisent la route. Ces véhicules ont des angles morts
    importants et nécessitent une distance considérable pour s'arrêter.
- id: 194
  category: sharing_the_road
  question: Si vous êtes impliqué dans une collision au Yukon où quelqu'un est blessé
    ou si les dommages matériels totaux dépassent un certain montant, vous devez le
    signaler à la police. Quel est ce montant ?
  choices:
    A: N'importe quel montant
    B: 500 $
    C: 1 000 $
    D: 2 000 $
  answer: C
  explanation: Au Yukon, les collisions entraînant des blessures, un décès ou des
    dommages matériels semblant dépasser 1 000 $ doivent être signalées immédiatement
    à l'agent de police ou au détachement de la GRC le plus proche.
- id: 195
  category: vehicle_information
  question: Au Yukon, pendant quelle période les phares de votre véhicule doivent-ils
    être allumés ?
  choices:
    A: Du coucher au lever du soleil
    B: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    C: De 30 minutes après le coucher du soleil à 30 minutes avant le lever du soleil
    D: Uniquement lorsqu'il fait assez sombre pour que vous ne puissiez pas voir la
      route
  answer: C
  explanation: Selon les règlements de conduite du Yukon, les phares doivent être
    utilisés de 30 minutes après le coucher du soleil jusqu'à 30 minutes avant le
    lever du soleil, et à tout autre moment où la visibilité est médiocre.
- id: 196
  category: vehicle_information
  question: 'Selon la loi du Yukon, vous devez allumer vos phares si la visibilité
    est réduite à moins de :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 250 mètres
  answer: B
  explanation: Les phares doivent être allumés chaque fois que les conditions atmosphériques
    (pluie, neige, brouillard, etc.) réduisent la visibilité à moins de 150 mètres.
- id: 197
  category: vehicle_information
  question: Quelle est la profondeur minimale légale des rainures de pneus pour les
    véhicules de tourisme au Yukon ?
  choices:
    A: 1,0 millimètre
    B: 1,6 millimètre
    C: 2,5 millimètres
    D: 3,2 millimètres
  answer: B
  explanation: Au Yukon, les pneus sont considérés comme dangereux si la profondeur
    des rainures est inférieure à 1,6 millimètre (2/32 de pouce).
- id: 198
  category: vehicle_information
  question: Concernant le teintage des vitres au Yukon, laquelle des affirmations
    suivantes est vraie ?
  choices:
    A: Le teintage complet est autorisé sur le pare-brise s'il est de qualité professionnelle
    B: Aucun teintage après-vente n'est autorisé sur le pare-brise ou les vitres latérales
      avant
    C: Le teintage est autorisé sur les vitres latérales avant tant qu'il transmet
      50 % de la lumière
    D: Seuls les 10 premiers centimètres du pare-brise peuvent être teintés
  answer: B
  explanation: Les règlements du Yukon interdisent l'application de teintage de vitre
    après-vente sur le pare-brise et sur les vitres situées directement à gauche et
    à droite du conducteur.
- id: 199
  category: vehicle_information
  question: 'Si le rétroviseur intérieur de votre véhicule est obstrué par une remorque
    ou un chargement, la loi du Yukon exige :'
  choices:
    A: Un permis de véhicule surdimensionné
    B: Qu'un passager serve de guide
    C: Des rétroviseurs extérieurs sur les côtés gauche et droit
    D: Un rétroviseur intérieur grand angle
  answer: C
  explanation: Si la vue depuis le rétroviseur intérieur est obstruée, le véhicule
    doit être équipé de rétroviseurs latéraux à gauche et à droite offrant une vue
    claire vers l'arrière.
- id: 200
  category: vehicle_information
  question: 'Tout véhicule à moteur au Yukon doit être équipé d''un klaxon pouvant
    être entendu d''une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 200 mètres
  answer: B
  explanation: Les règlements sur l'équipement des véhicules du Yukon stipulent qu'un
    klaxon doit être audible dans des conditions normales à une distance d'au moins
    60 mètres.
- id: 201
  category: vehicle_information
  question: Laquelle des propositions suivantes est une exigence de freinage obligatoire
    pour tous les véhicules à moteur au Yukon ?
  choices:
    A: Seul un frein de service actionné au pied est requis
    B: Un frein d'urgence est requis uniquement pour les véhicules commerciaux
    C: 'Deux systèmes de freinage distincts : un frein de service et un frein de stationnement
      ou d''urgence'
    D: Les systèmes de freinage antiblocage (ABS) sont obligatoires sur tous les véhicules,
      quel que soit leur âge
  answer: C
  explanation: 'Tous les véhicules à moteur doivent être équipés de deux systèmes
    de freinage indépendants : le frein de service (frein au pied) et le frein de
    stationnement ou d''urgence.'
- id: 202
  category: vehicle_information
  question: 'Au Yukon, les feux arrière de votre véhicule doivent être clairement
    visibles à une distance de :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Les feux arrière d'un véhicule doivent être rouges et visibles à une
    distance d'au moins 150 mètres vers l'arrière.
- id: 203
  category: vehicle_information
  question: 'La lumière blanche éclairant votre plaque d''immatriculation arrière
    au Yukon doit permettre de lire la plaque à une distance de :'
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 25 mètres
  answer: C
  explanation: La plaque d'immatriculation arrière doit être éclairée par une lumière
    blanche de manière à ce qu'elle soit clairement lisible à une distance de 15 mètres.
- id: 204
  category: vehicle_information
  question: 'Les feux de changement de direction d''un véhicule au Yukon doivent être
    visibles à une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: A
  explanation: Les clignotants mécaniques ou électriques doivent être visibles à une
    distance de 30 mètres à la lumière normale du jour.
- id: 205
  category: vehicle_information
  question: 'Au Yukon, vous devez passer en feux de croisement lorsque vous suivez
    un autre véhicule à une distance de :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Lorsque vous suivez un autre véhicule, vous devez baisser vos feux
    de route (passer en feux de croisement) à moins de 60 mètres pour éviter d'éblouir
    le conducteur devant vous via son rétroviseur.
- id: 206
  category: vehicle_information
  question: En vertu de la Loi sur les véhicules automobiles du Yukon, tout véhicule
    à moteur doit être équipé de quel système de freinage ?
  choices:
    A: Uniquement un frein au pied hydraulique
    B: Uniquement un frein à main d'urgence
    C: Deux systèmes de freinage distincts (frein de service et frein de stationnement)
    D: Un système de freinage antiblocage (ABS) est la seule exigence légale
  answer: C
  explanation: 'Tous les véhicules à moteur au Yukon doivent posséder deux systèmes
    de freinage indépendants : un frein de service (frein au pied) et un frein de
    stationnement ou d''urgence.'
- id: 207
  category: vehicle_information
  question: Au Yukon, quelles sont les restrictions concernant la teinte des vitres
    sur le pare-brise et les vitres latérales avant ?
  choices:
    A: Tout niveau de teinte est autorisé tant que le conducteur porte des lunettes
    B: La teinte est autorisée jusqu'à 50 % d'obstruction de la lumière
    C: Aucune teinte après-vente n'est autorisée sur le pare-brise ou les vitres latérales
      avant
    D: Seul le pare-brise peut être teinté
  answer: C
  explanation: Les règlements du Yukon interdisent généralement l'ajout de pellicules
    teintées après-vente sur le pare-brise et les vitres situées immédiatement à gauche
    et à droite du conducteur pour des raisons de sécurité et de visibilité.
- id: 208
  category: vehicle_information
  question: Lorsque vous remorquez une remorque au Yukon, comment les chaînes de sécurité
    doivent-elles être utilisées et connectées ?
  choices:
    A: Connectées en ligne droite sous l'attelage
    B: Croisées sous la flèche de la remorque
    C: Enroulées autour du pare-chocs
    D: Une seule chaîne est requise du côté gauche
  answer: B
  explanation: Les chaînes de sécurité doivent être croisées sous la flèche de la
    remorque pour empêcher celle-ci de tomber au sol en cas de défaillance de l'attelage.
- id: 209
  category: vehicle_information
  question: 'Au Yukon, la plaque d''immatriculation arrière d''un véhicule doit être
    éclairée par une lumière blanche afin d''être visible à une distance d''au moins
    :'
  choices:
    A: 5 mètres
    B: 15 mètres
    C: 30 mètres
    D: 50 mètres
  answer: B
  explanation: La plaque d'immatriculation arrière doit être éclairée par un feu arrière
    ou une lumière blanche distincte de manière à ce qu'elle soit clairement lisible
    à une distance de 15 mètres.
- id: 210
  category: vehicle_information
  question: Quel équipement est obligatoire pour une bicyclette circulant sur une
    route du Yukon la nuit ?
  choices:
    A: Uniquement une sonnette
    B: Un feu blanc à l'avant et un feu rouge ou un réflecteur à l'arrière
    C: Un feu jaune à l'avant et un feu blanc à l'arrière
    D: Uniquement des vêtements réfléchissants
  answer: B
  explanation: Les bicyclettes utilisées la nuit doivent être munies d'un phare avant
    émettant une lumière blanche et d'un feu rouge ou d'un réflecteur rouge à l'arrière.
- id: 211
  category: vehicle_information
  question: Selon les recommandations de conduite sécuritaire du Yukon pour l'hiver,
    que devrait contenir la trousse de survie d'urgence d'un véhicule ?
  choices:
    A: Uniquement un pneu de secours et un cric
    B: Des bougies, des allumettes, une tasse en métal et des vêtements chauds/couvertures
    C: Un GPS et une carte
    D: Du carburant supplémentaire dans un contenant en plastique à l'intérieur du
      coffre
  answer: B
  explanation: En raison des conditions hivernales extrêmes du Yukon, le guide recommande
    une trousse de survie comprenant des bougies (pour la chaleur), des allumettes,
    une tasse en métal et des couvertures ou vêtements chauds.
- id: 212
  category: vehicle_information
  question: 'Au Yukon, les garde-boue ou les ailes sont obligatoires sur les véhicules
    pour réduire les projections d''eau et de boue. Ceux-ci doivent être assez larges
    pour couvrir :'
  choices:
    A: Toute la largeur du véhicule
    B: Toute la largeur de la bande de roulement du pneu
    C: Uniquement la moitié supérieure du pneu
    D: La moitié intérieure du pneu
  answer: B
  explanation: Les ailes ou les garde-boue doivent couvrir toute la largeur de la
    bande de roulement du pneu pour réduire efficacement les projections de boue,
    d'eau et de gravier sur les autres véhicules.
- id: 213
  category: vehicle_information
  question: Quelle est l'exigence concernant le pare-brise d'un véhicule immatriculé
    au Yukon ?
  choices:
    A: Il doit être fait de verre trempé uniquement
    B: Il doit être exempt de toute fissure ou éclat obstruant la vue du conducteur
    C: Il doit être remplacé tous les cinq ans
    D: Il doit comporter une bande pare-soleil couvrant au moins 50 % du verre
  answer: B
  explanation: Le pare-brise doit être fait de verre de sécurité et doit être maintenu
    dans un état qui n'obstrue pas la vue claire du conducteur sur la route.
- id: 214
  category: signs_and_signals
  question: Au Yukon, quel est le signal manuel correct pour indiquer que vous ralentissez
    ou que vous vous arrêtez ?
  choices:
    A: Le bras sorti par la fenêtre et pointé vers le haut
    B: Le bras sorti par la fenêtre et pointé droit vers l'extérieur
    C: Le bras sorti par la fenêtre et pointé vers le bas, la paume vers l'arrière
    D: Le bras sorti par la fenêtre et effectuant un mouvement circulaire
  answer: C
  explanation: Selon le Guide de base du conducteur du Yukon, le signal manuel pour
    ralentir ou s'arrêter consiste à étendre le bras gauche par la fenêtre, pointé
    vers le bas avec la paume face à l'arrière.
- id: 215
  category: signs_and_signals
  question: Que signifie généralement un feu vert clignotant à une intersection au
    Yukon ?
  choices:
    A: Le feu est sur le point de passer au rouge
    B: Il s'agit d'un signal activé par les piétons
    C: Vous avez la priorité pour tourner à gauche
    D: L'intersection est en travaux
  answer: B
  explanation: Au Yukon, un feu vert clignotant indique généralement un signal activé
    par les piétons. Les conducteurs peuvent avancer avec prudence, mais doivent être
    prêts à s'arrêter si le feu passe au jaune, puis au rouge.
- id: 216
  category: signs_and_signals
  question: En approchant d'un feu jaune fixe au Yukon, que doit faire un conducteur
    ?
  choices:
    A: Accélérer pour dégager l'intersection avant que le feu ne passe au rouge
    B: S'arrêter avant d'entrer dans l'intersection, à moins qu'il ne soit dangereux
      de le faire
    C: Maintenir sa vitesse et traverser l'intersection
    D: S'arrêter uniquement si des piétons sont présents
  answer: B
  explanation: Un feu jaune fixe signifie que le signal est sur le point de passer
    au rouge. Les conducteurs doivent s'arrêter avant d'entrer dans l'intersection,
    à moins qu'ils n'y soient déjà engagés ou qu'ils soient si proches que l'arrêt
    serait dangereux.
- id: 217
  category: signs_and_signals
  question: 'Une ligne jaune continue de votre côté d''une ligne centrale jaune discontinue
    signifie :'
  choices:
    A: Le dépassement est autorisé si la route est libre
    B: Vous êtes dans une zone à sens unique
    C: Le dépassement est interdit pour les véhicules de votre côté de la route
    D: Vous devez tourner à droite à la prochaine intersection
  answer: C
  explanation: Dans le marquage routier du Yukon, une ligne jaune continue de votre
    côté de la ligne centrale indique que le dépassement n'est pas autorisé pour la
    circulation dans votre direction.
- id: 218
  category: signs_and_signals
  question: Au Yukon, que signifie un symbole de losange blanc peint sur une voie
    de circulation ?
  choices:
    A: La voie est réservée à des types spécifiques de véhicules
    B: Il y a un passage pour piétons plus loin
    C: La voie est réservée uniquement aux véhicules d'urgence
    D: La route est glissante lorsqu'elle est mouillée
  answer: A
  explanation: Un losange blanc sur la chaussée indique une voie réservée, qui peut
    être restreinte aux autobus, aux vélos ou aux véhicules multioccupants (VMO/HOV).
- id: 219
  category: signs_and_signals
  question: Quelle est la signification d'un panneau en forme de losange orange ?
  choices:
    A: Avertissement de zone scolaire
    B: Avertissement de travaux de construction ou d'entretien
    C: Passage à niveau devant
    D: Zone hospitalière
  answer: B
  explanation: Les panneaux orange en forme de losange sont utilisés au Yukon pour
    avertir les conducteurs de travaux de construction, d'entretien ou de services
    publics sur ou près de la chaussée.
- id: 220
  category: signs_and_signals
  question: Lorsque vous voyez un panneau « Zone scolaire » sans limite de vitesse
    affichée, quelle est la limite de vitesse par défaut au Yukon lorsque des enfants
    sont présents ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: Au Yukon, la limite de vitesse dans une zone scolaire est de 30 km/h
    entre 8 h 00 et 16 h 30 les jours d'école, ou selon ce qui est indiqué par la
    signalisation.
- id: 221
  category: signs_and_signals
  question: Que signifie une flèche verte fixe pointant vers la gauche ?
  choices:
    A: Vous pouvez tourner à gauche, mais vous devez céder le passage à la circulation
      venant en sens inverse
    B: Vous devez vous arrêter et attendre un feu vert circulaire
    C: Vous avez un virage protégé ; avancez dans la direction de la flèche
    D: Les virages à gauche sont interdits à cette intersection
  answer: C
  explanation: Une flèche verte fixe signifie que vous pouvez avancer dans la direction
    de la flèche. La circulation venant en sens inverse est arrêtée par un feu rouge,
    ce qui permet un virage protégé.
- id: 222
  category: signs_and_signals
  question: De quelle forme et de quelle couleur est un panneau « Cédez le passage
    » au Yukon ?
  choices:
    A: Un triangle inversé avec une bordure rouge et un centre blanc
    B: Un losange jaune avec des lettres noires
    C: Un octogone rouge avec des lettres blanches
    D: Un carré blanc avec un cercle noir
  answer: A
  explanation: Le panneau de cédez-le-passage au Yukon est un triangle équilatéral
    pointant vers le bas, avec une bordure rouge et un intérieur blanc.
- id: 223
  category: signs_and_signals
  question: Au Yukon, que signifie une ligne blanche continue entre deux voies de
    circulation circulant dans la même direction ?
  choices:
    A: Le changement de voie est encouragé
    B: Le changement de voie est déconseillé ou interdit
    C: Une voie est réservée uniquement aux véhicules lents
    D: La route se rétrécit plus loin
  answer: B
  explanation: Une ligne blanche continue entre des voies circulant dans la même direction
    indique que les changements de voie sont déconseillés ou illégaux ; elle est souvent
    utilisée à l'approche des intersections ou des tunnels.
- id: 224
  category: signs_and_signals
  question: Que signifie un panneau « Passage à niveau » (la croix de Saint-André
    en forme de X) ?
  choices:
    A: Arrêtez-vous immédiatement, qu'un train arrive ou non
    B: Accélérez pour traverser les voies rapidement
    C: Cédez le passage à tout train qui approche
    D: Le passage n'est plus utilisé
  answer: C
  explanation: Le panneau en croix de Saint-André indique un passage à niveau. Les
    conducteurs doivent regarder et écouter si des trains arrivent et céder le passage
    à tout trafic ferroviaire en approche.
- id: 225
  category: signs_and_signals
  question: Selon la loi du Yukon, quand êtes-vous autorisé à tourner à gauche au
    feu rouge ?
  choices:
    A: Jamais
    B: Uniquement lors d'un virage d'une rue à sens unique vers une autre rue à sens
      unique
    C: Chaque fois qu'il n'y a pas de circulation en sens inverse
    D: Uniquement si un panneau l'autorise spécifiquement
  answer: B
  explanation: Au Yukon, vous pouvez tourner à gauche au feu rouge uniquement lorsque
    vous passez d'une rue à sens unique à une autre rue à sens unique, après avoir
    marqué un arrêt complet et cédé le passage aux piétons et aux autres véhicules.
- id: 226
  category: signs_and_signals
  question: Quel est l'objet d'un panneau « Véhicule lent » (un triangle orange réfléchissant
    avec une bordure rouge) ?
  choices:
    A: Indiquer un véhicule qui circule à 40 km/h ou moins
    B: Marquer la fin d'une zone de travaux
    C: Indiquer un véhicule transportant des matières dangereuses
    D: Marquer un véhicule en panne sur l'accotement
  answer: A
  explanation: Le panneau de véhicule lent est fixé à l'arrière des véhicules qui
    circulent à une vitesse de 40 km/h ou moins, comme les machines agricoles ou l'équipement
    de construction.
- id: 227
  category: signs_and_signals
  question: Que signifie un feu jaune clignotant à une intersection ?
  choices:
    A: Arrêtez-vous et attendez que le feu passe au vert
    B: Le feu est sur le point de passer au rouge
    C: Ralentissez et avancez avec prudence
    D: Des piétons traversent plus loin
  answer: C
  explanation: Un feu jaune clignotant avertit les conducteurs de ralentir et de traverser
    l'intersection avec prudence, en cédant le passage aux piétons ou aux véhicules
    déjà engagés dans l'intersection.
- id: 228
  category: signs_and_signals
  question: Au Yukon, que signifie un feu rouge clignotant ?
  choices:
    A: Ralentissez et avancez avec prudence
    B: Arrêtez-vous et attendez que le feu passe au vert
    C: Arrêtez-vous, cédez le passage à la circulation transversale et aux piétons,
      et avancez quand c'est sécuritaire
    D: Le feu de circulation est en panne ; traitez-le comme un arrêt multidirectionnel
  answer: C
  explanation: 'Selon le Guide de base du conducteur du Yukon, un feu rouge clignotant
    doit être traité de la même manière qu''un panneau d''arrêt : marquez un arrêt
    complet et ne repartez que lorsque vous pouvez le faire en toute sécurité.'
- id: 229
  category: signs_and_signals
  question: 'Lorsque vous voyez un feu jaune clignotant à une intersection au Yukon,
    vous devez :'
  choices:
    A: Vous arrêter et attendre le feu vert
    B: Accélérer pour dégager l'intersection rapidement
    C: Ralentir et avancer avec prudence
    D: Vous arrêter et le traiter comme un panneau d'arrêt
  answer: C
  explanation: Un feu jaune clignotant avertit les conducteurs de ralentir et de traverser
    l'intersection avec prudence, en cédant le passage aux piétons ou aux véhicules
    déjà engagés dans l'intersection.
- id: 230
  category: signs_and_signals
  question: Si un conducteur du Yukon tend le bras gauche horizontalement par la fenêtre,
    quel signal donne-t-il ?
  choices:
    A: Il ralentit ou s'arrête
    B: Il tourne à droite
    C: Il tourne à gauche
    D: Il fait un signe amical
  answer: C
  explanation: Le signal manuel standard pour un virage à gauche est le bras gauche
    tendu horizontalement par la fenêtre du côté conducteur.
- id: 231
  category: signs_and_signals
  question: Quelle est la signification d'une ligne jaune continue à côté d'une ligne
    jaune discontinue sur une route du Yukon ?
  choices:
    A: Le dépassement est interdit pour tout le trafic
    B: Le dépassement est autorisé pour le trafic des deux côtés
    C: Le dépassement est autorisé uniquement pour le trafic du côté de la ligne discontinue
    D: Le dépassement est autorisé uniquement pour le trafic du côté de la ligne continue
  answer: C
  explanation: Une ligne discontinue à côté d'une ligne continue signifie que le dépassement
    est autorisé pour les véhicules se trouvant du côté de la ligne discontinue, à
    condition que la manœuvre puisse être effectuée en toute sécurité.
- id: 232
  category: signs_and_signals
  question: Au Yukon, que signifie une flèche verte fixe pointant vers la gauche combinée
    à un feu rouge ?
  choices:
    A: Vous devez vous arrêter et attendre le feu vert complet
    B: Vous pouvez tourner à gauche ; il s'agit d'un virage « protégé » et la circulation
      en sens inverse est arrêtée
    C: Vous pouvez tourner à gauche mais vous devez céder le passage à la circulation
      en sens inverse
    D: La flèche est réservée aux piétons uniquement
  answer: B
  explanation: Une flèche verte fixe signifie que vous bénéficiez d'un virage protégé
    dans la direction de la flèche. La circulation venant en sens inverse fait face
    à un feu rouge.
- id: 233
  category: signs_and_signals
  question: Au Yukon, quel signal manuel un conducteur doit-il utiliser pour indiquer
    qu'il s'arrête ou qu'il ralentit soudainement ?
  choices:
    A: Bras gauche tendu horizontalement
    B: Bras gauche sorti et plié vers le haut au niveau du coude
    C: Bras gauche sorti et plié vers le bas au niveau du coude
    D: Bras droit tendu horizontalement
  answer: C
  explanation: Pour signaler un arrêt ou une diminution de vitesse, le conducteur
    doit sortir le bras gauche et le plier vers le bas au niveau du coude, la paume
    de la main tournée vers l'arrière.
- id: 234
  category: signs_and_signals
  question: De quelle couleur sont les panneaux de construction et d'entretien au
    Yukon ?
  choices:
    A: Jaune
    B: Rouge
    C: Orange
    D: Vert
  answer: C
  explanation: Au Yukon et dans tout le Canada, l'orange est la couleur standard pour
    les panneaux d'avertissement temporaires liés aux travaux de construction et d'entretien.
- id: 235
  category: signs_and_signals
  question: Que devez-vous faire lorsque vous voyez un panneau « Cédez le passage
    » à une intersection au Yukon ?
  choices:
    A: Toujours marquer un arrêt complet
    B: Ralentir et céder le passage au trafic dans l'intersection ; ne s'arrêter que
      si nécessaire
    C: Maintenir sa vitesse et s'attendre à ce que les autres s'arrêtent pour vous
    D: S'arrêter uniquement si un agent de police est présent
  answer: B
  explanation: Un panneau de cédez le passage signifie que vous devez ralentir et
    être prêt à vous arrêter. Vous devez céder le passage à tout véhicule ou piéton
    se trouvant déjà dans l'intersection ou s'en approchant.
- id: 236
  category: signs_and_signals
  question: Que signifient les doubles lignes jaunes continues au centre d'une chaussée
    au Yukon ?
  choices:
    A: Le dépassement est autorisé si la route est libre
    B: Le dépassement est interdit dans les deux sens
    C: La route est à sens unique seulement
    D: Vous ne pouvez dépasser que pendant les heures de clarté
  answer: B
  explanation: Les doubles lignes jaunes continues signifient que la circulation se
    fait dans des directions opposées et que le dépassement est strictement interdit
    pour les véhicules des deux côtés.
- id: 237
  category: signs_and_signals
  question: Un conducteur au Yukon ayant le bras gauche sorti et plié vers le haut
    au niveau du coude signale quoi ?
  choices:
    A: Un virage à gauche
    B: Un virage à droite
    C: Un arrêt
    D: Un demi-tour
  answer: B
  explanation: Le signal manuel pour un virage à droite est le bras gauche tendu par
    la fenêtre et plié vers le haut à un angle de 90 degrés.
