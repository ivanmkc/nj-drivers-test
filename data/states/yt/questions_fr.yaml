questions:
- id: 1
  category: license_system
  question: Au Yukon, quel est l'âge minimum requis pour demander un permis d'apprenti
    conducteur de classe 7 ?
  choices:
    A: 14 ans
    B: 15 ans
    C: 16 ans
    D: 18 ans
  answer: B
  explanation: Selon le Guide de base du conducteur du Yukon, une personne doit être
    âgée d'au moins 15 ans pour demander un permis d'apprenti conducteur de classe
    7.
- id: 2
  category: license_system
  question: Pendant la conduite avec un permis d'apprenti conducteur de classe 7 au
    Yukon, quelle est la période de restriction de conduite ?
  choices:
    A: 23h00 à 6h00
    B: 22h00 à 5h00
    C: Minuit à 5h00
    D: Minuit à 6h00
  answer: C
  explanation: Les apprentis conducteurs de classe 7 au Yukon ont l'interdiction de
    conduire entre minuit et 5h00 du matin.
- id: 3
  category: license_system
  question: Un superviseur pour un apprenti conducteur de classe 7 au Yukon doit répondre
    à laquelle des exigences suivantes ?
  choices:
    A: Doit être âgé d'au moins 18 ans
    B: Doit détenir un permis de classe 5 valide depuis au moins 1 an
    C: Doit détenir un permis de classe 5 valide depuis au moins 2 ans
    D: Doit être un membre de la famille
  answer: C
  explanation: Le superviseur d'un apprenti doit détenir un permis de classe 5 valide
    (pas un permis GDL) et avoir au moins 2 ans d'expérience de conduite.
- id: 4
  category: license_system
  question: Quelle est la limite de taux d'alcoolémie (BAC) pour un conducteur dans
    le cadre du programme de permis de conduire progressif (GDL) du Yukon ?
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Le Yukon applique une politique de tolérance zéro pour l'alcool et
    les drogues pour tous les conducteurs du programme de permis de conduire progressif
    (GDL), y compris les classes 7 et 5P.
- id: 5
  category: license_system
  question: Pendant combien de temps un conducteur doit-il détenir un permis d'apprenti
    conducteur de classe 7 avant d'être admissible à l'examen routier pour un permis
    de classe 5P (novice) ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 9 mois
    D: 12 mois
  answer: B
  explanation: Au Yukon, vous devez détenir un permis d'apprenti conducteur de classe
    7 pendant au moins 6 mois avant de pouvoir passer l'examen routier pour votre
    permis de classe 5P.
- id: 6
  category: license_system
  question: Dans le cadre du programme GDL du Yukon, combien de passagers n'appartenant
    pas à la famille un conducteur de classe 5P (novice) est-il autorisé à transporter
    ?
  choices:
    A: Aucun
    B: Seulement 1
    C: Jusqu'à 2
    D: Autant qu'il y a de ceintures de sécurité
  answer: B
  explanation: Les conducteurs de classe 5P sont limités au transport d'un seul passager
    qui n'est pas un membre de la famille immédiate.
- id: 7
  category: license_system
  question: Pendant combien de temps un conducteur doit-il rester à l'étape de la
    classe 5P (novice) sans aucune suspension avant de pouvoir obtenir un permis complet
    de classe 5 ?
  choices:
    A: 12 mois
    B: 18 mois
    C: 24 mois
    D: 36 mois
  answer: B
  explanation: Un conducteur doit détenir un permis de classe 5P pendant au moins
    18 mois de conduite sans suspension avant d'être admissible à un permis complet
    de classe 5.
- id: 8
  category: license_system
  question: Si vous déménagez au Yukon en provenance d'une autre province ou d'un
    autre territoire, de combien de temps disposez-vous pour échanger votre permis
    de conduire de l'extérieur du territoire contre un permis du Yukon ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 120 jours
  answer: D
  explanation: Les nouveaux résidents du Yukon qui détiennent un permis de conduire
    valide d'une autre juridiction canadienne doivent l'échanger contre un permis
    du Yukon dans les 120 jours.
- id: 9
  category: license_system
  question: Au Yukon, combien de points d'inaptitude accumulés sur une période de
    deux ans entraînent la suspension du permis de conduire ?
  choices:
    A: 10 points
    B: 12 points
    C: 15 points
    D: 20 points
  answer: C
  explanation: Un permis de conduire sera suspendu si le conducteur accumule 15 points
    d'inaptitude ou plus sur une période de 24 mois.
- id: 10
  category: license_system
  question: 'Si vous changez de nom ou d''adresse, vous devez en informer le bureau
    des véhicules automobiles du Yukon dans un délai de :'
  choices:
    A: 7 jours
    B: 10 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: La loi du Yukon exige que les conducteurs informent le bureau des véhicules
    automobiles de tout changement de nom ou d'adresse dans les 10 jours.
- id: 11
  category: license_system
  question: Lequel des documents suivants n'est PAS obligatoire à bord du véhicule
    lors de la conduite au Yukon ?
  choices:
    A: Un permis de conduire valide
    B: L'acte de vente original du véhicule
    C: Une carte rose d'assurance valide
    D: Le certificat d'immatriculation du véhicule
  answer: B
  explanation: Les conducteurs doivent avoir sur eux leur permis, une assurance valide
    et l'immatriculation. L'acte de vente n'est pas requis pour l'utilisation quotidienne
    du véhicule.
- id: 12
  category: license_system
  question: Quel est l'âge minimum pour obtenir un permis de classe 5P (novice) au
    Yukon ?
  choices:
    A: 15 ans et 6 mois
    B: 16 ans
    C: 17 ans
    D: 18 ans
  answer: A
  explanation: Puisque l'âge minimum pour obtenir une classe 7 est de 15 ans et que
    vous devez détenir ce permis pendant 6 mois, l'âge le plus précoce pour obtenir
    une classe 5P est de 15,5 ans.
- id: 13
  category: license_system
  question: Si un conducteur du programme de permis progressif (GDL - classe 7 ou
    5P) enfreint la condition de tolérance zéro alcool, quelle est la sanction immédiate
    sur le bord de la route ?
  choices:
    A: Une suspension de 24 heures
    B: Une suspension de 30 jours
    C: Une suspension de 90 jours
    D: La perte permanente du permis
  answer: C
  explanation: Les conducteurs du programme GDL qui ont de l'alcool dans leur organisme
    sont passibles d'une suspension immédiate du permis de conduire de 90 jours sur
    le bord de la route.
- id: 14
  category: license_system
  question: Quelle classe de permis du Yukon est requise pour conduire une motocyclette
    ?
  choices:
    A: Classe 4
    B: Classe 5
    C: Classe 6
    D: Classe 8
  answer: C
  explanation: Au Yukon, un permis de classe 6 est spécifiquement requis pour conduire
    une motocyclette.
- id: 15
  category: license_system
  question: Pour demander un permis de conduire du Yukon, vous devez fournir une preuve
    de résidence. Lequel des documents suivants est acceptable à cette fin ?
  choices:
    A: Une carte de bibliothèque d'une autre province
    B: Une facture de services publics à votre nom avec une adresse au Yukon
    C: Une carte de visite d'un employeur du Yukon
    D: Un relevé de carte de crédit avec une adresse de case postale uniquement
  answer: B
  explanation: Pour prouver la résidence au Yukon, les demandeurs doivent fournir
    des documents tels qu'une facture de services publics, un contrat de location
    ou un document hypothécaire indiquant une adresse physique au Yukon.
- id: 16
  category: license_system
  question: Au Yukon, quelle est la couverture d'assurance responsabilité civile minimale
    requise par la loi pour un véhicule automobile ?
  choices:
    A: 50 000 $
    B: 100 000 $
    C: 200 000 $
    D: 500 000 $
  answer: C
  explanation: La Loi sur les véhicules automobiles du Yukon exige que tous les véhicules
    immatriculés détiennent une assurance responsabilité civile minimale de 200 000
    $.
- id: 17
  category: license_system
  question: Dans le cadre du programme de permis de conduire progressif (GDL) du Yukon,
    qu'advient-il de votre « temps accumulé » à l'étape novice (5P) si votre permis
    est suspendu ?
  choices:
    A: La suspension n'a aucun effet sur la date d'obtention du permis complet.
    B: Le temps passé en suspension est simplement ajouté à la fin.
    C: Le compte à rebours de deux ans est réinitialisé et vous devez recommencer
      l'étape novice depuis le début.
    D: Vous êtes automatiquement rétrogradé à l'étape d'apprenti (classe 7).
  answer: C
  explanation: 'Dans le programme GDL du Yukon, toute suspension des privilèges de
    conduite réinitialise le temps requis pour cette étape. Vous devez terminer l''étape
    pour la durée totale requise (ex. : 2 ans pour la phase novice) sans aucune suspension
    avant de pouvoir obtenir votre permis complet.'
- id: 18
  category: license_system
  question: Quelle classe de permis de conduire du Yukon est requise pour conduire
    un taxi ou un autobus d'une capacité maximale de 24 passagers ?
  choices:
    A: Classe 1
    B: Classe 3
    C: Classe 4
    D: Classe 5
  answer: C
  explanation: Un permis de classe 4 au Yukon est requis pour conduire des taxis,
    des ambulances ou de petits autobus ayant une capacité allant jusqu'à 24 passagers.
- id: 19
  category: license_system
  question: Lors d'une demande de permis de conduire du Yukon, lequel des documents
    suivants est considéré comme un document d'identification « primaire » ?
  choices:
    A: Un certificat de naissance canadien
    B: Une carte d'étudiant
    C: Une carte de numéro d'assurance sociale (NAS)
    D: Un badge d'employé
  answer: A
  explanation: Les documents primaires pour l'obtention d'un permis au Yukon comprennent
    un certificat de naissance canadien, un passeport valide ou des documents de citoyenneté
    canadienne ou de résidence permanente.
- id: 20
  category: license_system
  question: Si vous êtes un apprenti conducteur de classe 7 au Yukon et que vous êtes
    pris à conduire avec n'importe quelle quantité d'alcool dans le sang, quelle est
    la durée de la suspension immédiate sur le bord de la route ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: D
  explanation: Les conducteurs du programme GDL (classe 7 et 5P) au Yukon sont soumis
    à une politique de tolérance zéro alcool. Toute infraction entraîne une suspension
    immédiate de 90 jours sur le bord de la route.
- id: 21
  category: license_system
  question: Au Yukon, le renouvellement de l'immatriculation des véhicules est échelonné
    tout au long de l'année. Sur quelle base le mois d'expiration est-il déterminé
    ?
  choices:
    A: La date d'achat du véhicule
    B: Le mois de naissance du propriétaire
    C: La première lettre du nom de famille du propriétaire
    D: La marque et l'année du modèle du véhicule
  answer: C
  explanation: Le Yukon utilise un système d'immatriculation échelonné où le mois
    d'expiration est déterminé par la première lettre du nom de famille du propriétaire
    enregistré.
- id: 22
  category: license_system
  question: Quel code de mention est requis sur un permis de conduire du Yukon pour
    conduire un véhicule équipé de freins à air ?
  choices:
    A: Mention A
    B: Mention L
    C: Mention S
    D: Mention 15
  answer: B
  explanation: Au Yukon, la mention « L » est requise pour tout conducteur utilisant
    un véhicule équipé de freins à air.
- id: 23
  category: license_system
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    du Yukon pour avoir « fait défaut de rester sur les lieux d'un accident » ?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 10 points
  answer: C
  explanation: En vertu du système de points d'inaptitude de la Loi sur les véhicules
    automobiles du Yukon, le fait de ne pas rester sur les lieux d'un accident est
    une infraction grave entraînant 7 points d'inaptitude.
- id: 24
  category: license_system
  question: 'Un conducteur de classe 5P (novice) du Yukon doit maintenir un taux d''alcoolémie
    (BAC) de :'
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Tous les conducteurs du programme de permis de conduire progressif
    (GDL) du Yukon, y compris les conducteurs novices (5P), doivent maintenir un taux
    d'alcoolémie (BAC) de 0,00 % lorsqu'ils conduisent un véhicule.
- id: 25
  category: license_system
  question: Si vous échouez à un examen de conduite au Yukon, combien de temps devez-vous
    attendre avant de pouvoir faire une deuxième tentative ?
  choices:
    A: 24 heures
    B: 48 heures
    C: 7 jours
    D: 14 jours
  answer: C
  explanation: Au Yukon, si vous échouez à votre premier examen de conduite (examen
    pratique), il y a une période d'attente obligatoire de 7 jours avant de pouvoir
    repasser l'examen.
- id: 26
  category: license_system
  question: Laquelle des conditions suivantes s'applique à un apprenti conducteur
    de classe 6 (moto) au Yukon ?
  choices:
    A: Il peut transporter un seul passager.
    B: Il ne peut conduire que pendant les heures de clarté (du lever au coucher du
      soleil).
    C: Il peut conduire à n'importe quelle heure du jour ou de la nuit.
    D: Il doit être accompagné d'un superviseur sur la même moto.
  answer: B
  explanation: Les apprentis conducteurs de classe 6 au Yukon sont limités à la conduite
    de jour uniquement et ne sont pas autorisés à transporter des passagers.
- id: 27
  category: license_system
  question: Au Yukon, qui est légalement responsable de signaler un problème de santé
    susceptible d'affecter la capacité d'une personne à conduire en toute sécurité
    ?
  choices:
    A: Uniquement le médecin du conducteur
    B: Uniquement la compagnie d'assurance du conducteur
    C: Le conducteur lui-même
    D: L'employeur du conducteur
  answer: C
  explanation: Il est de la responsabilité légale du conducteur de signaler à la Section
    des véhicules automobiles tout problème de santé ou handicap physique susceptible
    de nuire à la conduite sécuritaire d'un véhicule automobile.
- id: 28
  category: license_system
  question: Un permis de conduire standard du Yukon (classe 5) est généralement valide
    pendant combien d'années avant de devoir être renouvelé ?
  choices:
    A: 2 ans
    B: 3 ans
    C: 5 ans
    D: 10 ans
  answer: C
  explanation: Au Yukon, un permis de conduire standard est généralement délivré pour
    une période de 5 ans et expire le jour de l'anniversaire du conducteur.
- id: 29
  category: driver_testing
  question: Pour réussir l'examen théorique écrit du Yukon pour un permis d'apprenti
    conducteur de classe 7, quel est le score minimum de passage ?
  choices:
    A: 70 % (14 questions sur 20)
    B: 75 % (15 questions sur 20)
    C: 80 % (16 questions sur 20)
    D: 90 % (18 questions sur 20)
  answer: C
  explanation: L'examen théorique du Yukon se compose de 20 questions à choix multiples,
    et les candidats doivent répondre correctement à au moins 16 d'entre elles (80
    %) pour réussir.
- id: 30
  category: driver_testing
  question: Si vous échouez à votre première tentative à l'examen théorique écrit
    du Yukon, combien de temps devez-vous attendre avant de pouvoir le repasser ?
  choices:
    A: 24 heures
    B: 48 heures
    C: 7 jours
    D: 30 jours
  answer: A
  explanation: Au Yukon, si vous échouez à l'examen théorique, vous devez attendre
    au moins 24 heures avant de tenter l'examen à nouveau.
- id: 31
  category: driver_testing
  question: Quelle est l'acuité visuelle minimale requise pour obtenir un permis de
    conduire standard de classe 5 au Yukon, avec ou sans lentilles correctrices ?
  choices:
    A: 20/20 dans les deux yeux
    B: 20/40 dans le meilleur œil
    C: 20/50 dans les deux yeux
    D: 20/60 dans le meilleur œil
  answer: B
  explanation: Les normes de vision du Yukon exigent une acuité visuelle minimale
    de 20/40 dans le meilleur œil pour un permis de classe 5.
- id: 32
  category: driver_testing
  question: À quel âge un conducteur du Yukon titulaire d'un permis de classe 5 doit-il
    commencer à soumettre des rapports d'examen médical périodiques au Bureau des
    véhicules automobiles ?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: B
  explanation: Au Yukon, les conducteurs doivent soumettre un rapport médical à l'âge
    de 70, 75 et 80 ans, puis tous les deux ans par la suite.
- id: 33
  category: driver_testing
  question: Lequel des éléments suivants entraînerait un échec automatique lors d'un
    examen de conduite au Yukon ?
  choices:
    A: Oublier d'utiliser un clignotant une seule fois
    B: Conduire à 2 km/h sous la limite de vitesse
    C: Une action dangereuse nécessitant l'intervention de l'examinateur
    D: Régler les rétroviseurs à l'arrêt
  answer: C
  explanation: Toute action dangereuse, violation du code de la route ou collision
    pendant l'examen de conduite entraîne un échec immédiat et automatique.
- id: 34
  category: driver_testing
  question: Si vous échouez à votre troisième tentative d'examen de conduite au Yukon,
    quelle est la période d'attente obligatoire avant de pouvoir tenter l'examen une
    quatrième fois ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: D
  explanation: Alors que le premier échec nécessite une attente de 24 heures, les
    échecs suivants entraînent des temps d'attente plus longs ; un troisième échec
    entraîne généralement une période d'attente de 30 jours.
- id: 35
  category: driver_testing
  question: Pour conduire un véhicule équipé de freins à air au Yukon, quelle mention
    doit être ajoutée à votre permis de conduire ?
  choices:
    A: Mention 12
    B: Mention 15
    C: Mention A
    D: Mention S
  answer: B
  explanation: La mention 15 est requise au Yukon pour conduire tout véhicule équipé
    de freins à air.
- id: 36
  category: driver_testing
  question: Quel est l'âge minimum requis pour demander un permis de conduire de classe
    4 au Yukon (utilisé pour les taxis, les ambulances et les petits autobus) ?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: Les candidats à un permis commercial de classe 4 au Yukon doivent être
    âgés d'au moins 18 ans.
- id: 37
  category: driver_testing
  question: Laquelle des conditions suivantes est requise pour le véhicule que vous
    fournissez pour un examen de conduite de classe 5 au Yukon ?
  choices:
    A: Il doit s'agir d'un véhicule à transmission manuelle
    B: Il doit avoir une plaque d'immatriculation et une assurance valides
    C: Il doit avoir moins de 5 ans
    D: Il doit s'agir d'un véhicule de type commercial
  answer: B
  explanation: Le véhicule utilisé pour un examen de conduite doit être sécuritaire,
    en bon état mécanique et posséder une immatriculation et une assurance valides.
- id: 38
  category: driver_testing
  question: Au Yukon, l'utilisation d'un appareil de communication électronique portatif
    au volant entraîne combien de points d'inaptitude ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: La conduite distraite (utilisation d'un appareil portatif) au Yukon
    entraîne une amende importante et 3 points d'inaptitude.
- id: 39
  category: driver_testing
  question: Quelle est l'exigence d'acuité visuelle pour les conducteurs professionnels
    (classes 1, 2, 3 et 4) au Yukon ?
  choices:
    A: 20/20 dans les deux yeux
    B: 20/30 dans le meilleur œil
    C: 20/40 dans le meilleur œil
    D: 20/60 dans les deux yeux
  answer: B
  explanation: Les conducteurs professionnels au Yukon doivent respecter une norme
    de vision plus élevée de 20/30 dans le meilleur œil.
- id: 40
  category: driver_testing
  question: Selon la loi du Yukon, combien de points d'inaptitude sont appliqués pour
    un excès de vitesse de 1 à 15 km/h au-dessus de la limite affichée ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Un excès de vitesse compris entre 1 et 15 km/h au-dessus de la limite
    au Yukon entraîne 2 points d'inaptitude.
- id: 41
  category: driver_testing
  question: Au Yukon, si un conducteur ne cède pas le passage à un piéton, combien
    de points d'inaptitude sont ajoutés à son dossier ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Le fait de ne pas céder le passage à un piéton est une infraction entraînant
    3 points d'inaptitude au Yukon.
- id: 42
  category: driver_testing
  question: Laquelle des classes de permis de conduire suivantes du Yukon exige que
    le candidat soumette un rapport d'examen médical au moment de la demande ?
  choices:
    A: Classe 5
    B: Classe 6
    C: Classe 7
    D: Classe 1, 2, 3 ou 4
  answer: D
  explanation: Les candidats aux classes professionnelles/commerciales (1, 2, 3 et
    4) au Yukon doivent fournir un rapport d'examen médical pour s'assurer qu'ils
    respectent les normes physiques pour la conduite de gros véhicules ou le transport
    de passagers.
- id: 43
  category: driver_testing
  question: Lors d'un examen routier au Yukon, laquelle des défectuosités de véhicule
    suivantes entraînerait l'annulation immédiate de l'examen avant qu'il ne commence
    ?
  choices:
    A: Une petite fissure dans le pare-brise qui n'obstrue pas la vision
    B: Des feux de freinage ou des clignotants inopérants
    C: Un réservoir de liquide lave-glace vide
    D: Un extérieur sale
  answer: B
  explanation: Le véhicule utilisé pour un examen routier doit être dans un état mécanique
    sûr. Un équipement de sécurité inopérant, comme les feux de freinage ou les clignotants,
    entraînera l'annulation de l'examen.
- id: 44
  category: driver_testing
  question: Quel est le champ de vision horizontal minimal requis pour réussir l'examen
    de la vue du Yukon pour un permis de classe 5 ?
  choices:
    A: 90 degrés
    B: 100 degrés
    C: 120 degrés
    D: 180 degrés
  answer: C
  explanation: Les candidats au permis de conduire du Yukon doivent avoir un champ
    de vision horizontal d'au moins 120 degrés pour s'assurer qu'ils peuvent voir
    les dangers périphériques.
- id: 45
  category: driver_testing
  question: L'examen théorique écrit du Yukon se compose de 20 questions. Quel est
    le nombre minimum de bonnes réponses requises pour réussir ?
  choices:
    A: '14'
    B: '16'
    C: '18'
    D: '20'
  answer: B
  explanation: Pour réussir l'examen théorique du Yukon, vous devez obtenir un score
    d'au moins 80 %, ce qui équivaut à 16 bonnes réponses sur 20.
- id: 46
  category: driver_testing
  question: Pendant un examen routier au Yukon, quelle action du conducteur entraînera
    un échec automatique ?
  choices:
    A: Oublier d'utiliser un clignotant une seule fois
    B: Conduire à 2 km/h sous la limite de vitesse
    C: Une action dangereuse qui nécessite l'intervention de l'examinateur
    D: Régler les rétroviseurs pendant que le véhicule est à l'arrêt
  answer: C
  explanation: Toute action dangereuse, comme le fait de presque causer une collision
    ou de violer une règle de circulation majeure nécessitant que l'examinateur prenne
    le contrôle ou intervienne, entraîne un échec automatique à l'examen routier.
- id: 47
  category: driver_testing
  question: Qui est autorisé à se trouver dans le véhicule lors d'un examen routier
    de classe 5P au Yukon, en plus du conducteur et de l'examinateur ?
  choices:
    A: Un parent ou un tuteur légal
    B: Un instructeur de conduite certifié
    C: Personne d'autre n'est autorisé
    D: Un traducteur si le conducteur ne parle pas anglais
  answer: C
  explanation: Pour des raisons de sécurité et pour éviter les distractions, seuls
    le candidat et l'examinateur autorisé sont admis dans le véhicule lors d'un examen
    routier au Yukon.
- id: 48
  category: driver_testing
  question: En arrivant pour un examen routier au Yukon, que devez-vous présenter
    concernant le véhicule que vous utilisez ?
  choices:
    A: Un acte de vente
    B: Une immatriculation valide et une preuve d'assurance
    C: Un certificat d'inspection mécanique datant des 30 derniers jours
    D: Le manuel du propriétaire original du véhicule
  answer: B
  explanation: Vous devez fournir un véhicule correctement immatriculé et assuré pour
    l'examen routier. L'examinateur vérifiera ces documents avant le début de l'examen.
- id: 49
  category: driver_testing
  question: L'examen théorique du Yukon est divisé en deux sections principales. Quelles
    sont-elles ?
  choices:
    A: Mathématiques de base et signalisation routière
    B: Signalisation routière et règles de la route
    C: Entretien du véhicule et premiers soins
    D: Conduite sur autoroute et conduite en ville
  answer: B
  explanation: L'examen écrit du Yukon évalue les connaissances du candidat sur la
    signalisation routière et les règles de la route du territoire.
- id: 50
  category: driver_testing
  question: Après avoir terminé avec succès l'étape de conducteur novice (5P) de 24
    mois au Yukon, comment obtenez-vous votre permis complet de classe 5 ?
  choices:
    A: Il vous est envoyé automatiquement par la poste
    B: Vous devez passer un autre examen routier
    C: Vous devez vous rendre dans un bureau des véhicules automobiles et demander
      la mise à niveau
    D: Vous devez repasser l'examen théorique écrit
  answer: C
  explanation: Le passage au permis complet après le programme de permis progressif
    (GDL) n'est pas automatique. Une fois que vous avez terminé la période de 24 mois
    sans incident, vous devez vous rendre dans un bureau des véhicules automobiles
    pour demander et payer votre permis complet de classe 5.
- id: 51
  category: driver_testing
  question: Si vous avez besoin d'un interprète pour l'examen théorique du Yukon,
    laquelle des affirmations suivantes est vraie ?
  choices:
    A: Un interprète est fourni gratuitement par le gouvernement
    B: Vous pouvez amener un ami pour interpréter les instructions de l'examen pratique
      pendant la conduite
    C: Vous pouvez faire appel à un interprète agréé pour l'examen écrit, mais pas
      pour l'examen pratique
    D: Les interprètes sont strictement interdits pour toutes les parties de l'examen
  answer: C
  explanation: Bien que des accommodements puissent parfois être faits pour l'examen
    théorique écrit, un interprète n'est pas autorisé dans le véhicule pendant l'examen
    pratique ; le conducteur doit être capable de comprendre les instructions de base
    de l'examinateur.
- id: 52
  category: driver_responsibility
  question: 'Au Yukon, vous devez signaler un accident à la police ou au détachement
    de la GRC le plus proche si le total des dommages matériels semble dépasser :'
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: B
  explanation: Selon la Loi sur les véhicules automobiles du Yukon, tout accident
    impliquant des blessures, un décès ou des dommages matériels dépassant 1 000 $
    doit être signalé immédiatement à la police.
- id: 53
  category: driver_responsibility
  question: Lorsqu'un accident survient au Yukon et nécessite un rapport de police,
    dans quel délai le rapport doit-il être fait ?
  choices:
    A: Dans les 24 heures
    B: Dans les 48 heures
    C: Immédiatement
    D: Dans les 7 jours
  answer: C
  explanation: Les conducteurs sont légalement tenus de signaler immédiatement les
    accidents admissibles à l'agent de police ou au détachement de la GRC le plus
    proche.
- id: 54
  category: driver_responsibility
  question: Si vous vendez votre véhicule immatriculé au Yukon à une autre personne,
    que devez-vous faire des plaques d'immatriculation ?
  choices:
    A: Les laisser sur le véhicule pour le nouveau propriétaire
    B: Les retirer et les conserver pour votre propre usage sur un autre véhicule
    C: Les détruire et en informer la Section des véhicules automobiles
    D: Les donner au nouveau propriétaire pour qu'il les rende à la Section des véhicules
      automobiles
  answer: B
  explanation: Au Yukon, les plaques d'immatriculation suivent le propriétaire, pas
    le véhicule. Lorsque vous vendez un véhicule, vous devez retirer vos plaques.
- id: 55
  category: driver_responsibility
  question: Selon la loi du Yukon, qui est responsable de s'assurer qu'un passager
    de moins de 16 ans porte correctement sa ceinture de sécurité ou son dispositif
    de retenue pour enfant ?
  choices:
    A: Le passager
    B: Les parents du passager (même s'ils ne sont pas dans la voiture)
    C: Le conducteur du véhicule
    D: Le propriétaire du véhicule
  answer: C
  explanation: Le conducteur est légalement responsable de s'assurer que tous les
    passagers de moins de 16 ans sont correctement attachés avec une ceinture de sécurité
    ou dans un siège de sécurité pour enfant approuvé.
- id: 56
  category: driver_responsibility
  question: Quelle est l'amende maximale pour une première condamnation pour conduite
    d'un véhicule à moteur au Yukon sans assurance valide ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: Conduire sans assurance est une infraction grave au Yukon ; une première
    condamnation peut entraîner une amende allant jusqu'à 2 000 $.
- id: 57
  category: driver_responsibility
  question: Si vous êtes un nouveau résident du Yukon, de quel délai disposez-vous
    pour immatriculer votre véhicule provenant de l'extérieur du territoire auprès
    de la Section des véhicules automobiles du Yukon ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 6 mois
  answer: B
  explanation: Bien que vous ayez 90 jours pour échanger votre permis de conduire,
    vous devez immatriculer votre véhicule au Yukon dans les 60 jours suivant le moment
    où vous devenez résident.
- id: 58
  category: driver_responsibility
  question: 'Si vous entrez en collision avec un véhicule sans surveillance et que
    vous ne trouvez pas le propriétaire, la loi du Yukon vous oblige à :'
  choices:
    A: Attendre au moins deux heures le retour du propriétaire
    B: Laisser un avis écrit avec votre nom, votre adresse et votre numéro de plaque
      d'immatriculation
    C: Le signaler à votre compagnie d'assurance dans les 24 heures seulement
    D: Partir s'il n'y a pas de dommages visibles
  answer: B
  explanation: Si le propriétaire ne peut pas être localisé, vous devez laisser une
    note dans un endroit bien en vue sur le véhicule que vous avez heurté, en fournissant
    vos coordonnées et les informations sur votre véhicule.
- id: 59
  category: driver_responsibility
  question: 'Il est de la responsabilité du conducteur de s''assurer que les vitres
    du véhicule sont dégagées. Au Yukon, conduire avec un pare-brise obstrué par de
    la neige ou de la glace est :'
  choices:
    A: Autorisé si le conducteur peut voir à travers une petite zone dégagée
    B: Une infraction à la Loi sur les véhicules automobiles
    C: Illégal seulement si vous conduisez sur une autoroute
    D: Recommandé mais pas légalement obligatoire
  answer: B
  explanation: La Loi sur les véhicules automobiles du Yukon exige que la vue du conducteur
    ne soit pas obstruée. Conduire avec de la neige ou de la glace recouvrant les
    vitres est une infraction.
- id: 60
  category: driver_responsibility
  question: 'Si un agent de la paix du Yukon demande à voir votre preuve d''assurance
    et que vous ne l''avez pas dans le véhicule, vous pourriez être :'
  choices:
    A: Accordé un délai de 48 heures pour la présenter à un poste de police
    B: Accusé de défaut de production d'une carte de responsabilité financière
    C: Tenu de laisser votre véhicule sur le bord de la route
    D: Exempté si vous pouvez fournir le numéro de police verbalement
  answer: B
  explanation: Les conducteurs doivent avoir une carte d'assurance valide (carte de
    responsabilité financière) dans le véhicule en tout temps et la présenter à la
    demande d'un agent de la paix.
- id: 61
  category: driver_responsibility
  question: Un conducteur au Yukon reçoit un diagnostic de problème de santé pouvant
    affecter sa capacité à conduire en toute sécurité. Qui est responsable d'en informer
    le Bureau des véhicules automobiles ?
  choices:
    A: Seulement le médecin du conducteur
    B: La compagnie d'assurance du conducteur
    C: Le conducteur
    D: L'employeur du conducteur
  answer: C
  explanation: Il est de la responsabilité légale du conducteur de signaler tout problème
    de santé ou handicap physique susceptible d'entraver l'utilisation sécuritaire
    d'un véhicule à moteur.
- id: 62
  category: driver_responsibility
  question: Quelle est la conséquence juridique du prêt de votre permis de conduire
    du Yukon à une autre personne ?
  choices:
    A: C'est permis pour les membres de la famille uniquement
    B: C'est une infraction seulement s'ils ont un accident
    C: C'est une infraction qui peut entraîner une amende et une suspension du permis
    D: C'est permis si vous êtes passager dans le véhicule
  answer: C
  explanation: Prêter votre permis à quelqu'un d'autre ou utiliser le permis de quelqu'un
    d'autre est illégal et entraîne des sanctions importantes, y compris une suspension
    potentielle.
- id: 63
  category: driver_responsibility
  question: Au Yukon, dans quel état doivent être maintenues les plaques d'immatriculation
    ?
  choices:
    A: Fixées à la lunette arrière à l'intérieur du véhicule
    B: Clairement visibles et exemptes de saleté ou d'obstructions
    C: Remplacées tous les deux ans quel que soit leur état
    D: Peintes pour correspondre à la couleur du véhicule
  answer: B
  explanation: La Loi sur les véhicules automobiles exige que les plaques d'immatriculation
    soient solidement fixées et maintenues propres afin qu'elles soient clairement
    lisibles en tout temps.
- id: 64
  category: driver_responsibility
  question: 'Si vous êtes impliqué dans un accident au Yukon, vous êtes légalement
    tenu de fournir votre nom, votre adresse et le numéro d''immatriculation de votre
    véhicule à :'
  choices:
    A: La police uniquement
    B: Votre agent d'assurance uniquement
    C: L'autre personne impliquée dans l'accident
    D: Personne, jusqu'à ce que vous parliez à un avocat
  answer: C
  explanation: Les conducteurs impliqués dans un accident doivent rester sur les lieux
    et fournir leurs informations à l'autre partie impliquée ou à un agent de la paix.
- id: 65
  category: driver_responsibility
  question: 'En vertu de la Loi sur les véhicules automobiles du Yukon, un agent de
    la paix a le pouvoir d''arrêter un véhicule et de l''inspecter pour :'
  choices:
    A: L'état mécanique et l'équipement de sécurité
    B: La propreté de l'intérieur
    C: La présence d'une roue de secours
    D: Les niveaux d'efficacité énergétique
  answer: A
  explanation: Les agents de la paix peuvent arrêter et inspecter les véhicules pour
    s'assurer qu'ils respectent les normes de sécurité et que tout l'équipement requis
    (feux, freins, etc.) fonctionne correctement.
- id: 66
  category: driver_responsibility
  question: 'Au Yukon, si vous êtes déclaré coupable de conduite pendant que votre
    permis est suspendu, le véhicule que vous conduisez peut être :'
  choices:
    A: Vendu aux enchères immédiatement
    B: Mis en fourrière pour une période déterminée
    C: Donné à la municipalité la plus proche
    D: Peint d'une couleur différente par la police
  answer: B
  explanation: La loi du Yukon permet la mise en fourrière d'un véhicule si le conducteur
    est pris en train de l'utiliser alors que son permis est suspendu ou qu'il fait
    l'objet d'une interdiction de conduire.
- id: 67
  category: driver_responsibility
  question: Lors de la vente d'un véhicule immatriculé au Yukon, le vendeur doit en
    informer le registraire des véhicules automobiles dans un délai de combien de
    jours après la vente ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: Au Yukon, le vendeur d'un véhicule à moteur est tenu d'en informer
    le registraire dans les 7 jours suivant la date de la vente ou du transfert de
    propriété.
- id: 68
  category: driver_responsibility
  question: Si vous êtes impliqué dans une collision avec un véhicule sans surveillance
    et que vous ne parvenez pas à localiser le propriétaire, quelle est votre responsabilité
    légale au Yukon ?
  choices:
    A: Attendre sur les lieux pendant au moins deux heures.
    B: Laisser une note avec votre nom, votre adresse et vos coordonnées dans un endroit
      bien en vue sur le véhicule.
    C: Le signaler uniquement à votre compagnie d'assurance.
    D: Aucune action n'est requise si les dommages sont inférieurs à 1 000 $.
  answer: B
  explanation: La loi du Yukon exige que les conducteurs qui entrent en collision
    avec un véhicule sans surveillance prennent des mesures raisonnables pour localiser
    le propriétaire ou laissent un avis écrit avec leurs coordonnées et les détails
    du véhicule.
- id: 69
  category: driver_responsibility
  question: 'Au Yukon, l''immatriculation d''un véhicule expire généralement le :'
  choices:
    A: 31 décembre de chaque année.
    B: Dernier jour du mois de naissance du propriétaire.
    C: Exactement un an après la date d'achat.
    D: 31 mars de chaque année.
  answer: B
  explanation: Le Yukon utilise un système d'immatriculation échelonné où l'immatriculation
    du véhicule expire généralement le dernier jour du mois de naissance du propriétaire.
- id: 70
  category: driver_responsibility
  question: Au Yukon, l'utilisation de pneus à clous sur les véhicules n'est légalement
    autorisée que pendant quelle période ?
  choices:
    A: Toute l'année.
    B: Du 1er novembre au 31 mars.
    C: Du 1er octobre au 30 avril.
    D: Du 1er septembre au 31 mai.
  answer: C
  explanation: Pour éviter d'endommager les routes, la réglementation du Yukon précise
    que les pneus à clous ne peuvent être utilisés qu'entre le 1er octobre et le 30
    avril.
- id: 71
  category: driver_responsibility
  question: Lorsque vous amenez un véhicule au Yukon en provenance d'une autre province
    ou d'un autre territoire, de combien de temps disposez-vous pour immatriculer
    le véhicule au Yukon ?
  choices:
    A: 7 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Les nouveaux résidents doivent immatriculer leurs véhicules au Yukon
    dans les 30 jours suivant l'établissement de leur résidence.
- id: 72
  category: driver_responsibility
  question: En vertu de la Loi sur les véhicules automobiles du Yukon, quelle est
    la période de « suspension administrative du permis » pour un conducteur qui fournit
    un échantillon d'haleine supérieur à un taux d'alcoolémie (BAC) de 0,08 ?
  choices:
    A: 24 heures
    B: 30 jours
    C: 90 jours
    D: 1 an
  answer: C
  explanation: Les conducteurs du Yukon qui présentent un taux supérieur à 0,08 ou
    qui refusent de se soumettre à un alcootest s'exposent à une suspension administrative
    immédiate de leur permis de 90 jours.
- id: 73
  category: driver_responsibility
  question: Au Yukon, le fait de ne pas s'arrêter pour un autobus scolaire dont les
    feux rouges clignotent et le bras d'arrêt est déployé peut entraîner combien de
    points d'inaptitude ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: D
  explanation: Dépasser un autobus scolaire lorsque ses feux rouges clignotent est
    une infraction grave à la sécurité au Yukon et entraîne 8 points d'inaptitude.
- id: 74
  category: driver_responsibility
  question: Lorsqu'un véhicule d'urgence (ambulance, camion de pompiers ou police)
    est arrêté sur le bord d'une route du Yukon avec ses gyrophares allumés, à quelle
    vitesse les conducteurs doivent-ils ralentir ?
  choices:
    A: 30 km/h
    B: 50 km/h (ou la limite affichée si elle est inférieure)
    C: 70 km/h
    D: S'arrêter complètement jusqu'au départ du véhicule.
  answer: B
  explanation: La loi « Move Over » (se tasser) du Yukon exige que les conducteurs
    ralentissent à 50 km/h (ou à la limite affichée si elle est inférieure à 50 km/h)
    lorsqu'ils dépassent des véhicules d'urgence arrêtés sur le bord de la route.
- id: 75
  category: driver_responsibility
  question: Quel est le nombre minimum de points d'inaptitude qu'un conducteur reçoit
    pour « conduite imprudente » (Careless Driving) au Yukon ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 9 points
  answer: C
  explanation: La conduite imprudente est une infraction importante au Yukon et entraîne
    l'ajout de 6 points d'inaptitude au dossier du conducteur.
- id: 76
  category: driver_responsibility
  question: Si un conducteur du Yukon est reconnu coupable d'une première infraction
    de conduite avec facultés affaiblies en vertu du Code criminel du Canada, quelle
    est l'interdiction de conduire minimale ordonnée par le tribunal ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 1 an
    D: 3 ans
  answer: C
  explanation: Une première condamnation en vertu du Code criminel pour conduite avec
    facultés affaiblies entraîne une interdiction de conduire obligatoire d'au moins
    1 an dans tout le Canada, y compris au Yukon.
- id: 77
  category: safe_driving_rules
  question: Au Yukon, quelle est la limite de vitesse maximale dans une zone scolaire
    lorsque la zone est en vigueur ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: Selon le Guide de base du conducteur du Yukon, la limite de vitesse
    dans les zones scolaires est de 30 km/h lorsque la zone est en vigueur.
- id: 78
  category: safe_driving_rules
  question: Au Yukon, quelle est la distance minimale à laquelle vous devez vous garer
    d'une borne d'incendie ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 6 mètres
  answer: B
  explanation: La loi du Yukon interdit de se garer à moins de 3 mètres d'une borne
    d'incendie.
- id: 79
  category: safe_driving_rules
  question: Lorsque vous vous garez près d'un panneau d'arrêt, d'un panneau de cédez
    le passage ou d'un passage pour piétons marqué au Yukon, quelle est la distance
    minimale requise que vous devez maintenir ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 6 mètres
    D: 10 mètres
  answer: C
  explanation: Vous ne devez pas vous garer à moins de 6 mètres d'un panneau d'arrêt,
    d'un panneau de cédez le passage ou d'un passage pour piétons marqué.
- id: 80
  category: safe_driving_rules
  question: À moins qu'un panneau ne l'interdise spécifiquement, êtes-vous autorisé
    à tourner à droite au feu rouge au Yukon ?
  choices:
    A: Non, vous devez attendre le feu vert
    B: Oui, mais seulement pendant les heures de clarté
    C: Oui, après avoir marqué un arrêt complet et cédé le passage aux piétons et
      aux autres véhicules
    D: Oui, mais seulement s'il y a une voie de virage réservée
  answer: C
  explanation: Au Yukon, les virages à droite au feu rouge sont autorisés après un
    arrêt complet et après avoir cédé le passage, à moins qu'un panneau n'indique
    le contraire.
- id: 81
  category: safe_driving_rules
  question: Lorsqu'un véhicule d'urgence avec des feux clignotants est arrêté sur
    le bord d'une route du Yukon où la limite de vitesse affichée est de 70 km/h ou
    plus, quelle est la vitesse maximale autorisée pour le dépasser ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: La limite de vitesse affichée
  answer: C
  explanation: Selon les lois « Move Over » (se tasser) du Yukon, si la limite de
    vitesse est de 70 km/h ou plus, vous devez ralentir à 60 km/h (ou moins si affiché)
    en dépassant un véhicule d'urgence arrêté avec ses feux clignotants.
- id: 82
  category: safe_driving_rules
  question: Au Yukon, quand êtes-vous légalement tenu d'utiliser les phares de votre
    véhicule ?
  choices:
    A: Uniquement entre minuit et 5 h 00
    B: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    C: D'une demi-heure après le coucher du soleil à une demi-heure avant le lever
      du soleil, ou chaque fois que la visibilité est inférieure à 150 mètres
    D: Uniquement lorsqu'il neige ou qu'il pleut
  answer: C
  explanation: Les phares doivent être utilisés de 30 minutes après le coucher du
    soleil à 30 minutes avant le lever du soleil, et à tout moment où la visibilité
    est réduite à moins de 150 mètres.
- id: 83
  category: safe_driving_rules
  question: Vous conduisez sur une route à deux voies et voyez une ligne jaune continue
    de votre côté de la ligne médiane. Qu'est-ce que cela indique ?
  choices:
    A: Vous pouvez dépasser si la route est libre devant vous
    B: Le dépassement est interdit
    C: Vous êtes dans une zone de haute vitesse
    D: L'accotement est dangereux pour les arrêts d'urgence
  answer: B
  explanation: Une ligne jaune continue de votre côté de la ligne médiane signifie
    que le dépassement est dangereux et strictement interdit.
- id: 84
  category: safe_driving_rules
  question: À l'approche d'un autobus scolaire dont les feux rouges clignotent et
    dont le bras d'arrêt est déployé sur une route à chaussée unique (non divisée)
    au Yukon, qui doit s'arrêter ?
  choices:
    A: Uniquement les conducteurs qui suivent l'autobus
    B: Uniquement les conducteurs arrivant de l'avant
    C: Les conducteurs dans les deux sens
    D: Personne, s'il y a au moins trois voies de circulation
  answer: C
  explanation: Sur une route à chaussée unique, la circulation dans les deux sens
    doit s'arrêter pour un autobus scolaire dont les feux rouges clignotent et le
    bras d'arrêt est déployé.
- id: 85
  category: safe_driving_rules
  question: À une intersection non contrôlée (une intersection sans panneaux ni signaux)
    au Yukon, qui a la priorité ?
  choices:
    A: Le véhicule circulant à la vitesse la plus élevée
    B: Le véhicule à gauche doit céder le passage au véhicule à droite
    C: Le véhicule à droite doit céder le passage au véhicule à gauche
    D: Le véhicule sur la rue la plus passante
  answer: B
  explanation: Aux intersections non contrôlées, le conducteur à gauche doit céder
    le passage au conducteur à droite.
- id: 86
  category: safe_driving_rules
  question: Dans des conditions de conduite normales au Yukon, quelle est la distance
    de suivi minimale recommandée derrière le véhicule qui vous précède ?
  choices:
    A: La longueur d'une voiture
    B: Deux secondes
    C: Quatre secondes
    D: 50 mètres
  answer: B
  explanation: Le Guide de base du conducteur du Yukon recommande une distance de
    suivi minimale de deux secondes dans des conditions idéales.
- id: 87
  category: safe_driving_rules
  question: Lors d'un arrêt à un passage à niveau au Yukon, quelle est la distance
    minimale à laquelle vous devez vous arrêter du rail le plus proche ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Lorsqu'un arrêt est requis à un passage à niveau, vous devez vous arrêter
    à au moins 5 mètres du rail le plus proche.
- id: 88
  category: safe_driving_rules
  question: Au Yukon, un virage à gauche au feu rouge est-il autorisé ?
  choices:
    A: Non, ce n'est jamais autorisé
    B: Oui, d'une rue à double sens vers une rue à sens unique
    C: Oui, d'une rue à sens unique vers une autre rue à sens unique après un arrêt
      complet
    D: Oui, à n'importe quelle intersection si aucun trafic n'arrive
  answer: C
  explanation: Un virage à gauche au feu rouge n'est autorisé au Yukon que lors d'un
    virage d'une rue à sens unique vers une autre rue à sens unique, à condition que
    le conducteur s'arrête d'abord et cède le passage aux autres.
- id: 89
  category: safe_driving_rules
  question: Quelle est la limite de vitesse par défaut sur les routes du Yukon à l'extérieur
    des municipalités, sauf indication contraire ?
  choices:
    A: 70 km/h
    B: 80 km/h
    C: 90 km/h
    D: 100 km/h
  answer: B
  explanation: Sauf indication contraire, la limite de vitesse maximale sur les routes
    à l'extérieur des municipalités du Yukon est de 80 km/h.
- id: 90
  category: safe_driving_rules
  question: Lorsque vous stationnez un véhicule en montée sur une rue à double sens
    avec une bordure de trottoir, comment les roues avant doivent-elles être tournées
    ?
  choices:
    A: Vers la droite (vers la bordure)
    B: Vers la gauche (à l'opposé de la bordure)
    C: Parallèles à la bordure
    D: Cela n'a pas d'importance
  answer: B
  explanation: Lors d'un stationnement en montée avec une bordure, tournez les roues
    vers la gauche de sorte que si le véhicule recule, l'arrière du pneu avant frappe
    la bordure et arrête la voiture.
- id: 91
  category: safe_driving_rules
  question: Au Yukon, entre quelles dates l'utilisation des pneus à clous est-elle
    autorisée sur les véhicules ?
  choices:
    A: Du 1er septembre au 30 avril
    B: Du 1er octobre au 31 mai
    C: Du 1er novembre au 31 mars
    D: Toute l'année
  answer: B
  explanation: Au Yukon, les pneus à clous sont légalement autorisés du 1er octobre
    au 31 mai.
- id: 92
  category: safe_driving_rules
  question: Au Yukon, sauf indication contraire, quelle est la limite de vitesse maximale
    à l'intérieur d'une municipalité ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 30 km/h
  answer: B
  explanation: Selon la Loi sur les véhicules automobiles du Yukon, la limite de vitesse
    standard à l'intérieur d'une municipalité est de 50 km/h, à moins que des panneaux
    n'indiquent le contraire.
- id: 93
  category: safe_driving_rules
  question: Dans les zones scolaires du Yukon, quelle est la limite de vitesse pendant
    les jours de classe entre 8 h 00 et 16 h 30, sauf indication contraire ?
  choices:
    A: 20 km/h
    B: 40 km/h
    C: 30 km/h
    D: 50 km/h
  answer: C
  explanation: Au Yukon, la limite de vitesse dans les zones scolaires est de 30 km/h
    les jours de classe, de 8 h 00 à 16 h 30, à moins que des panneaux n'indiquent
    une heure ou une vitesse différente.
- id: 94
  category: safe_driving_rules
  question: Sous quelle condition spécifique un virage à gauche au feu rouge est-il
    autorisé au Yukon ?
  choices:
    A: D'une rue à double sens vers une rue à sens unique
    B: D'une rue à sens unique vers une rue à double sens
    C: D'une rue à sens unique vers une autre rue à sens unique
    D: Ce n'est jamais autorisé
  answer: C
  explanation: Au Yukon, vous pouvez tourner à gauche au feu rouge uniquement si vous
    passez d'une rue à sens unique à une autre rue à sens unique, après avoir marqué
    un arrêt complet et cédé le passage à la circulation et aux piétons.
- id: 95
  category: safe_driving_rules
  question: Lorsque vous vous garez sur une rue plane ou en montée avec une bordure
    de trottoir, comment devez-vous positionner vos roues avant ?
  choices:
    A: Tournées vers la bordure
    B: Tournées à l'opposé de la bordure
    C: Parallèles à la bordure
    D: Cela n'a pas d'importance
  answer: B
  explanation: En stationnement en montée avec une bordure, vous devez tourner vos
    roues à l'opposé de la bordure (vers la gauche) de sorte que si le véhicule recule,
    l'arrière du pneu avant frappe la bordure et arrête la voiture.
- id: 96
  category: safe_driving_rules
  question: Au Yukon, à quelle distance minimale d'un panneau d'arrêt ou d'un panneau
    de cédez le passage est-il interdit de stationner ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 6 mètres
    D: 10 mètres
  answer: C
  explanation: Il est interdit aux conducteurs de stationner à moins de 6 mètres du
    côté de l'approche d'un panneau d'arrêt, d'un panneau de cédez le passage ou d'un
    signal de contrôle de la circulation.
- id: 97
  category: safe_driving_rules
  question: Au Yukon, les demi-tours sont interdits dans lequel des endroits suivants
    ?
  choices:
    A: Dans un virage
    B: Près du sommet d'une côte où la visibilité est inférieure à 150 mètres
    C: Là où un panneau l'interdit
    D: Toutes les réponses ci-dessus
  answer: D
  explanation: Les demi-tours sont illégaux dans les virages, près des sommets de
    côtes où vous ne pouvez pas être vu à 150 mètres dans les deux directions, et
    là où la signalisation interdit la manœuvre.
- id: 98
  category: safe_driving_rules
  question: La nuit, à quelle distance d'un véhicule venant en sens inverse devez-vous
    passer de vos feux de route aux feux de croisement ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 300 mètres
    D: 500 mètres
  answer: C
  explanation: La loi du Yukon exige que les conducteurs passent aux feux de croisement
    lorsqu'un véhicule venant en sens inverse se trouve à moins de 300 mètres.
- id: 99
  category: safe_driving_rules
  question: En entrant dans un carrefour giratoire au Yukon, à qui devez-vous céder
    le passage ?
  choices:
    A: À la circulation entrant par la droite
    B: À la circulation déjà engagée dans le carrefour
    C: À personne ; vous avez la priorité
    D: Uniquement aux véhicules d'urgence
  answer: B
  explanation: Avant d'entrer dans un carrefour giratoire, vous devez céder le passage
    à la circulation déjà engagée dans le carrefour venant de votre gauche.
- id: 100
  category: defensive_driving
  question: Lorsque vous conduisez sur les routes de gravier du Yukon, pourquoi est-il
    recommandé d'augmenter votre distance de sécurité à plus de deux secondes ?
  choices:
    A: Pour éviter les nuages de poussière qui réduisent la visibilité
    B: Pour prévenir les dommages au pare-brise causés par les projections de pierres
    C: Parce que les distances de freinage sont plus longues sur le gravier meuble
    D: Toutes les réponses ci-dessus
  answer: D
  explanation: Les routes de gravier au Yukon présentent des dangers uniques, notamment
    une traction réduite, des débris projetés et des nuages de poussière. L'augmentation
    de la distance de sécurité permet de répondre à toutes ces préoccupations de sécurité.
- id: 101
  category: defensive_driving
  question: Pour pratiquer un balayage visuel efficace, à quelle distance devant lui
    un conducteur doit-il regarder lorsqu'il circule sur les autoroutes du Yukon ?
  choices:
    A: 5 à 10 secondes
    B: 12 à 15 secondes
    C: 20 à 25 secondes
    D: Aussi loin que l'horizon
  answer: C
  explanation: Le Guide de base du conducteur du Yukon suggère de balayer du regard
    de 20 à 25 secondes devant soi sur les autoroutes afin d'identifier les dangers
    potentiels, tels que la faune ou les obstacles sur la route, bien à l'avance.
- id: 102
  category: defensive_driving
  question: 'Lorsque vous conduisez de nuit au Yukon, vous devez passer des feux de
    route aux feux de croisement lorsqu''un véhicule arrivant en sens inverse se trouve
    à moins de :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 300 mètres
  answer: C
  explanation: Selon les règlements de conduite du Yukon, vous devez passer aux feux
    de croisement lorsqu'un véhicule arrivant en sens inverse se trouve à moins de
    150 mètres pour éviter d'éblouir l'autre conducteur.
- id: 103
  category: defensive_driving
  question: 'Lorsque vous suivez un autre véhicule de nuit, vous devez passer vos
    phares en feux de croisement lorsque vous êtes à moins de :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Au Yukon, vous devez passer des feux de route aux feux de croisement
    lorsque vous vous trouvez à moins de 60 mètres du véhicule que vous suivez afin
    d'éviter l'éblouissement dans ses rétroviseurs.
- id: 104
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une route mouillée
    du Yukon, quelle est la bonne réaction de conduite préventive ?
  choices:
    A: Freiner fort pour regagner de la traction
    B: Tourner brusquement le volant vers l'accotement
    C: Relâcher l'accélérateur et diriger le volant dans la direction où vous voulez
      aller
    D: Mettre le véhicule au point mort et pomper les freins
  answer: C
  explanation: En cas d'aquaplanage, vous ne devez pas freiner. Au lieu de cela, relâchez
    la pédale d'accélérateur pour ralentir et dirigez le véhicule tout droit ou dans
    la direction où vous voulez aller jusqu'à ce que vos pneus retrouvent le contact
    avec la route.
- id: 105
  category: defensive_driving
  question: Dans le climat subarctique du Yukon, la « glace noire » est un danger
    fréquent. Où est-elle la plus susceptible de se former en premier ?
  choices:
    A: Au milieu des champs dégagés
    B: Sur les ponts, les viaducs et dans les zones ombragées
    C: Sur les montées abruptes
    D: Uniquement sur les routes de gravier
  answer: B
  explanation: Les ponts et les viaducs gèlent plus tôt que les routes ordinaires
    car l'air froid circule à la fois au-dessus et au-dessous de la surface de la
    route. Les zones ombragées conservent également la glace plus longtemps.
- id: 106
  category: defensive_driving
  question: Si un gros animal comme un orignal apparaît soudainement sur la route
    devant vous, quelle est généralement l'action préventive la plus sûre ?
  choices:
    A: Faire une embardée dans la voie inverse pour le contourner
    B: Freiner fermement et rester dans sa voie
    C: Accélérer pour dépasser l'animal avant qu'il ne bouge
    D: Klaxonner continuellement et maintenir sa vitesse
  answer: B
  explanation: Faire une embardée peut mener à une collision frontale plus grave ou
    à un capotage. L'action la plus sûre est de freiner fermement et de rester dans
    sa voie. Si une collision est inévitable, essayez de viser l'arrière-train de
    l'animal.
- id: 107
  category: defensive_driving
  question: 'Lors d''un arrêt d''urgence dans un véhicule équipé d''un système de
    freinage antiblocage (ABS), un conducteur préventif doit :'
  choices:
    A: Pomper les freins rapidement
    B: Appliquer une pression ferme et constante sur la pédale de frein
    C: Appuyer légèrement sur les freins pour éviter le blocage
    D: Utiliser le frein de stationnement d'urgence
  answer: B
  explanation: Avec l'ABS, vous devez « enfoncer et diriger ». Appliquez une pression
    ferme et continue. Le système pompera automatiquement les freins pour empêcher
    le blocage pendant que vous gardez le contrôle de la direction.
- id: 108
  category: defensive_driving
  question: 'Au Yukon, un « angle mort » est une zone autour de votre véhicule qui
    ne peut pas être vue dans vos rétroviseurs. Pour vérifier votre angle mort, vous
    devez :'
  choices:
    A: Régler vos rétroviseurs latéraux plus vers l'extérieur
    B: Vous pencher vers l'avant pour changer l'angle du rétroviseur
    C: Tourner la tête et regarder par-dessus votre épaule
    D: Installer un miroir convexe d'angle mort
  answer: C
  explanation: Une vérification par-dessus l'épaule est le seul moyen fiable de s'assurer
    que l'angle mort est libre avant de changer de voie ou de tourner.
- id: 109
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais ou sous une chute de neige
    au Yukon, quels feux devez-vous utiliser pour maximiser la visibilité ?
  choices:
    A: Les feux de route
    B: Les feux de stationnement uniquement
    C: Les feux de croisement
    D: Les feux de détresse
  answer: C
  explanation: Les feux de route se réfléchissent sur le brouillard et la neige, provoquant
    un éblouissement et réduisant la visibilité. Les feux de croisement dirigent la
    lumière vers le bas sur la route, offrant une meilleure visibilité dans ces conditions.
- id: 110
  category: defensive_driving
  question: Lorsqu'un autre véhicule vous dépasse sur une route à deux voies du Yukon,
    que doit faire un conducteur préventif ?
  choices:
    A: Accélérer pour l'aider à revenir plus vite dans la voie
    B: Maintenir sa vitesse ou ralentir légèrement et rester à droite
    C: Se déplacer sur l'accotement pour lui donner plus de place
    D: Allumer les feux de route pour éclairer son chemin
  answer: B
  explanation: Il est illégal d'augmenter votre vitesse pendant que vous êtes dépassé.
    Vous devez maintenir votre vitesse ou ralentir légèrement pour permettre au véhicule
    qui dépasse de terminer la manœuvre en toute sécurité.
- id: 111
  category: defensive_driving
  question: Lorsque vous suivez un chasse-neige sur une route du Yukon, quelle est
    la règle de conduite préventive essentielle ?
  choices:
    A: Suivre de près pour rester dans la voie dégagée
    B: Dépasser le chasse-neige le plus rapidement possible par la droite
    C: Rester bien en retrait pour éviter le « nuage de neige » créé par le chasse-neige
    D: Klaxonner pour signaler au conducteur que vous êtes derrière lui
  answer: C
  explanation: Les chasse-neige créent des « nuages de neige » qui peuvent masquer
    complètement le véhicule et sa lame. Rester en retrait garantit que vous ne serez
    pas aveuglé et que vous ne serez pas frappé par le sel ou le sable épandu.
- id: 112
  category: defensive_driving
  question: Si les pneus de votre véhicule quittent le bord asphalté de la route pour
    aller sur un accotement meuble, quelle est la manière la plus sûre de réagir ?
  choices:
    A: Braquer brusquement pour revenir immédiatement sur la chaussée
    B: Freiner fort pour s'arrêter le plus vite possible
    C: Tenir fermement le volant, relâcher l'accélérateur et maintenir une trajectoire
      droite jusqu'à ce que vous ralentissiez
    D: Rétrograder et accélérer pour remonter sur la route
  answer: C
  explanation: Braquer brusquement pour revenir sur la route peut projeter le véhicule
    vers la circulation inverse (effet de fronde). Vous devez ralentir progressivement
    en gardant le véhicule droit avant de revenir doucement sur l'asphalte.
- id: 113
  category: defensive_driving
  question: Lorsque vous conduisez sur les routes du Yukon dans des conditions défavorables
    comme la pluie, la neige ou sur des routes de gravier, comment devez-vous ajuster
    votre distance de sécurité ?
  choices:
    A: La maintenir à 2 secondes
    B: L'augmenter à au moins 4 secondes
    C: La réduire à 1 seconde pour rester dans les traces du véhicule de devant
    D: La distance de sécurité n'a pas besoin de changer si vous avez des pneus d'hiver
  answer: B
  explanation: Dans des conditions défavorables comme la pluie, la neige ou sur le
    gravier, votre distance de freinage augmente. Vous devriez doubler votre distance
    de sécurité pour la porter à au moins quatre secondes.
- id: 114
  category: defensive_driving
  question: Pour pratiquer un balayage visuel efficace en conduisant dans une municipalité
    du Yukon, à quelle distance devant vous devez-vous regarder ?
  choices:
    A: 5 secondes
    B: 12 secondes
    C: 30 secondes
    D: Uniquement le pare-chocs de la voiture qui précède
  answer: B
  explanation: La conduite préventive exige de balayer la route du regard au moins
    12 secondes à l'avance en zone urbaine afin d'anticiper les dangers avant qu'ils
    ne deviennent des urgences.
- id: 115
  category: defensive_driving
  question: Lorsque vous suivez un autre véhicule de nuit au Yukon, à quelle distance
    devez-vous passer de vos feux de route (pleins phares) aux feux de croisement
    ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 200 mètres
  answer: B
  explanation: Vous devez baisser vos phares lorsque vous suivez un autre véhicule
    à moins de 60 mètres pour éviter de l'éblouir via son rétroviseur intérieur.
- id: 116
  category: defensive_driving
  question: Pendant les hivers au Yukon, la « glace noire » est un danger majeur.
    Lequel des énoncés suivants décrit le mieux comment l'identifier ?
  choices:
    A: Elle ressemble à une épaisse couverture de neige blanche
    B: Elle ressemble à une plaque brillante et humide sur la route
    C: Elle est toujours visible sous la forme d'une texture gris foncé
    D: On ne la trouve que sur les routes de gravier
  answer: B
  explanation: La glace noire est une couche de glace mince et transparente qui ressemble
    souvent à une simple plaque humide ou à une flaque d'eau sur l'asphalte, ce qui
    la rend extrêmement trompeuse et dangereuse.
- id: 117
  category: defensive_driving
  question: Vous conduisez sur une autoroute du Yukon et voyez un véhicule d'urgence
    arrêté sur le côté de la route avec ses gyrophares allumés. Que devez-vous faire
    ?
  choices:
    A: Maintenir votre vitesse et rester dans votre voie
    B: Ralentir à 60 km/h (ou à la limite affichée si elle est inférieure) et changer
      de voie vers la gauche si c'est sécuritaire
    C: S'arrêter immédiatement sur l'autoroute
    D: Accélérer pour dépasser la scène le plus rapidement possible
  answer: B
  explanation: Les lois du Yukon sur le corridor de sécurité exigent que les conducteurs
    ralentissent à 60 km/h (ou moins si la limite affichée est inférieure) et changent
    de voie si cela peut être fait en toute sécurité lors du passage devant des véhicules
    d'urgence arrêtés avec des feux clignotants.
- id: 118
  category: defensive_driving
  question: 'Pour vérifier vos angles morts avant de changer de voie au Yukon, vous
    devez :'
  choices:
    A: Vérifier uniquement votre rétroviseur intérieur
    B: Vérifier uniquement vos rétroviseurs extérieurs
    C: Tourner la tête et regarder par-dessus votre épaule dans la direction du déplacement
    D: Se fier au système de détection d'angles morts de votre véhicule
  answer: C
  explanation: Les rétroviseurs ne montrent pas tout. Un conducteur préventif doit
    effectuer une vérification par-dessus l'épaule (tourner la tête) pour s'assurer
    que l'angle mort est libre avant de changer de voie.
- id: 119
  category: defensive_driving
  question: Lorsque vous conduisez sur une route de gravier au Yukon et que vos roues
    arrière commencent à déraper, dans quelle direction devez-vous braquer ?
  choices:
    A: Dans la direction opposée au dérapage
    B: Dans la direction où vous voulez que l'avant du véhicule aille
    C: Toujours vers l'accotement de droite
    D: Garder le volant parfaitement droit
  answer: B
  explanation: Si votre véhicule dérape, vous devez braquer dans la direction où vous
    voulez que le véhicule aille. C'est ce qu'on appelle souvent « contre-braquer
    » ou « braquer dans le sens du dérapage ».
- id: 120
  category: defensive_driving
  question: Lors de longs trajets sur les autoroutes du Yukon, à quelle fréquence
    un conducteur préventif devrait-il faire une pause pour éviter la fatigue ?
  choices:
    A: Toutes les 2 heures ou tous les 200 kilomètres
    B: Uniquement lorsqu'il sent ses yeux se fermer
    C: Toutes les 5 heures
    D: Une fois par jour
  answer: A
  explanation: Pour maintenir la vigilance et prévenir la fatigue du conducteur, il
    est recommandé de faire une pause toutes les deux heures ou tous les 200 kilomètres.
- id: 121
  category: defensive_driving
  question: La distance d'arrêt totale se compose de la distance de perception, de
    la distance de réaction et de la distance de freinage. À 100 km/h, de quelle distance
    environ un véhicule moyen a-t-il besoin pour s'arrêter sur une chaussée sèche
    ?
  choices:
    A: 25 mètres
    B: 50 mètres
    C: 100 mètres
    D: 140 mètres
  answer: C
  explanation: À 100 km/h, la distance d'arrêt totale pour un véhicule de tourisme
    moyen dans des conditions idéales est d'environ 100 mètres (soit à peu près la
    longueur d'un terrain de football).
- id: 122
  category: alcohol_drugs_health
  question: Au Yukon, quelle est la plage d'avertissement (« Warn ») administrative
    pour le taux d'alcoolémie (BAC) qui entraîne une suspension immédiate de 24 heures
    sur le bord de la route pour un premier contrevenant ?
  choices:
    A: 0,02 à 0,04
    B: 0,05 à 0,08
    C: 0,08 à 0,10
    D: 0,10 à 0,15
  answer: B
  explanation: Au Yukon, les conducteurs ayant un taux d'alcoolémie (BAC) compris
    entre 0,05 et 0,08 se situent dans la plage d'avertissement. Une première occurrence
    entraîne une suspension immédiate du permis de conduire de 24 heures sur le bord
    de la route.
- id: 123
  category: alcohol_drugs_health
  question: Si un conducteur du Yukon titulaire d'un permis complet fournit un échantillon
    d'haleine qui constitue un « échec » (taux d'alcoolémie supérieur à 0,08), quelle
    est la durée de la suspension immédiate par interdiction administrative de conduire
    (ARP) ?
  choices:
    A: 24 heures
    B: 30 jours
    C: 90 jours
    D: 1 an
  answer: C
  explanation: En vertu de la loi du Yukon, si vous fournissez un échantillon d'haleine
    supérieur à 0,08 ou si vous refusez de fournir un échantillon, vous recevez une
    interdiction administrative de conduire (ARP) immédiate de 90 jours.
- id: 124
  category: alcohol_drugs_health
  question: Au Yukon, si un conducteur reçoit une interdiction administrative de conduire
    de 90 jours pour un taux d'alcoolémie supérieur à 0,08, pendant combien de temps
    son véhicule est-il généralement mis en fourrière ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: C
  explanation: Un « échec » à l'alcootest (taux d'alcoolémie supérieur à 0,08) ou
    un refus de fournir un échantillon entraîne une mise en fourrière obligatoire
    du véhicule pendant 30 jours, en plus de la suspension du permis.
- id: 125
  category: alcohol_drugs_health
  question: Selon la loi fédérale canadienne applicable au Yukon, quelle est la limite
    légale de THC (cannabis) dans le sang pour une infraction punissable par procédure
    sommaire ?
  choices:
    A: Entre 2 nanogrammes (ng) et 5 ng
    B: Exactement 1 ng
    C: Plus de 10 ng
    D: Il n'y a pas de limite pour le THC
  answer: A
  explanation: La loi fédérale, que le Yukon applique, fixe une limite de condamnation
    sommaire pour le THC entre 2 ng et 5 ng. Avoir 5 ng ou plus constitue une infraction
    criminelle plus grave.
- id: 126
  category: alcohol_drugs_health
  question: Au Yukon, qui est légalement tenu de signaler un conducteur au registraire
    des véhicules automobiles s'il souffre d'un problème de santé susceptible de rendre
    la conduite d'un véhicule dangereuse ?
  choices:
    A: Uniquement le conducteur lui-même
    B: L'employeur du conducteur
    C: Les médecins traitants et les optométristes
    D: Les membres de la famille immédiate du conducteur
  answer: C
  explanation: Au Yukon, les professionnels de la santé (médecins et optométristes)
    sont légalement tenus de signaler les patients dont l'état de santé pourrait nuire
    à leur capacité de conduire en toute sécurité.
- id: 127
  category: alcohol_drugs_health
  question: Quel est l'objectif principal du Programme de verrouillage du système
    d'allumage (IIP) du Yukon ?
  choices:
    A: Empêcher le véhicule de démarrer si le conducteur a consommé de l'alcool
    B: Suivre la vitesse du véhicule via GPS
    C: Appeler automatiquement la police si un conducteur fait un excès de vitesse
    D: Limiter le conducteur à conduire uniquement pendant les heures de clarté
  answer: A
  explanation: Le programme de verrouillage du système d'allumage exige l'installation
    d'un dispositif dans le véhicule qui empêche le moteur de démarrer s'il détecte
    de l'alcool dans l'haleine du conducteur.
- id: 128
  category: alcohol_drugs_health
  question: Si le permis de conduire d'un conducteur du Yukon est suspendu en raison
    d'une condamnation liée à l'alcool, que doit-il généralement accomplir avant que
    son permis puisse être rétabli ?
  choices:
    A: Un cours de conduite préventive
    B: Un programme d'éducation ou de traitement contre la conduite avec facultés
      affaiblies
    C: Un minimum de 100 heures de service communautaire
    D: Un diplôme d'études secondaires ou l'équivalent
  answer: B
  explanation: Le rétablissement du permis après une condamnation pour conduite avec
    facultés affaiblies au Yukon nécessite généralement de suivre un programme agréé
    d'éducation ou de réadaptation en matière d'alcool ou de drogues.
- id: 129
  category: alcohol_drugs_health
  question: Quel est l'effet du mélange d'alcool avec de petites quantités de certains
    médicaments ou drogues ?
  choices:
    A: Les effets de la drogue sont généralement annulés
    B: L'alcool est absorbé plus lentement
    C: L'effet combiné est souvent nettement supérieur à la somme des parties
    D: Il n'y a aucun changement mesurable de l'affaiblissement des facultés
  answer: C
  explanation: La combinaison d'alcool et de drogues (effet synergique) peut provoquer
    une altération extrême des facultés, bien au-delà de ce que l'une ou l'autre substance
    provoquerait seule.
- id: 130
  category: alcohol_drugs_health
  question: 'En vertu de la Loi sur les véhicules automobiles du Yukon, un agent de
    la paix peut imposer une suspension de 24 heures sur le bord de la route s''il
    soupçonne qu''un conducteur a les facultés affaiblies par :'
  choices:
    A: L'alcool uniquement
    B: La drogue uniquement
    C: L'alcool, la drogue ou la fatigue
    D: L'alcool ou la drogue uniquement
  answer: C
  explanation: Les agents de la paix du Yukon ont le pouvoir de retirer un conducteur
    de la route pendant 24 heures s'ils estiment que ses capacités sont affectées
    par l'alcool, la drogue ou la fatigue physique ou mentale.
- id: 131
  category: alcohol_drugs_health
  question: Si un conducteur du Yukon reçoit un deuxième avertissement pour un taux
    d'alcoolémie (BAC) compris entre 0,05 et 0,08 sur une période de cinq ans, quelle
    est la durée de la suspension du permis ?
  choices:
    A: 24 heures
    B: 30 jours
    C: 90 jours
    D: 6 mois
  answer: B
  explanation: Alors qu'un premier avertissement entraîne une suspension de 24 heures,
    un deuxième avertissement dans une période de cinq ans entraîne une suspension
    du permis de conduire de 30 jours au Yukon.
- id: 132
  category: alcohol_drugs_health
  question: Lors de la prise de médicaments sur ordonnance ou en vente libre, à qui
    incombe la responsabilité de s'assurer que le médicament n'altère pas la capacité
    de conduire ?
  choices:
    A: Le pharmacien uniquement
    B: Le médecin uniquement
    C: Le conducteur
    D: La police
  answer: C
  explanation: Il est de la responsabilité légale du conducteur de s'assurer qu'il
    n'a pas les facultés affaiblies. Il doit consulter un médecin ou un pharmacien
