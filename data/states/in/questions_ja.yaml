questions:
- id: 1
  category: license_system
  question: インディアナ州の免許証、身分証明書（ID）、または許可証において、それが「リアルID（Real ID）」であることを示す視覚的な印は何ですか？
  choices:
    A: 州章のホログラム
    B: 右上隅にある星印
    C: 表面にあるバーコード
    D: 上部を横切る青いストライプ
  answer: B
  explanation: マニュアルによると、リアルID（Real ID）は免許証、身分証明書、許可証の右上隅にある星印によって示されます。
- id: 2
  category: license_system
  question: リアルID（Real ID）を保持することの利点は次のうちどれですか？
  choices:
    A: 商業運転免許証（CDL）なしで商用車を運転できる。
    B: 米国内の民間航空機に搭乗できる。
    C: 州間高速道路の通行料の支払いが免除される。
    D: パスポートなしで海外旅行ができる。
  answer: B
  explanation: マニュアルには、リアルID（Real ID）があれば米国内の民間航空機に搭乗できると記載されています。
- id: 3
  category: license_system
  question: 国内の民間航空機への搭乗以外に、リアルID（Real ID）でできることは何ですか？
  choices:
    A: 特定の連邦施設への立ち入りや軍事基地への訪問
    B: 空港のセキュリティチェックポイントのバイパス
    C: 別途免許なしでの船舶の操縦
    D: 指定された障害者用駐車場への駐車
  answer: A
  explanation: マニュアルでは、リアルID（Real ID）によって軍事基地への訪問や特定の連邦施設への立ち入りが可能になると規定されています。
- id: 4
  category: license_system
  question: インディアナ州の居住者は、リアルID（Real ID）へのアップグレードに必要な書類に関する情報をどこで確認できますか？
  choices:
    A: BMV.IN.gov
    B: RealID.IN.gov
    C: Indiana.gov/ID
    D: HoosierDrive.com
  answer: B
  explanation: マニュアルでは、リアルID（Real ID）へのアップグレードに必要な書類を確認するために RealID.IN.gov を参照するように案内しています。
- id: 5
  category: license_system
  question: インディアナ州陸運局（BMV）のミッションステートメントによると、BMVは運転者および車両サービスをどのように提供することを目指していますか？
  choices:
    A: 一般の運転者よりも商業運転者を優先することによって
    B: 安全性と透明性を確保しながら、迅速かつ正確な方法で
    C: すべてのインディアナ州民に無料の証明書再発行を提供することによって
    D: オンラインプラットフォームのみを通じて
  answer: B
  explanation: BMVの使命は、安全性と透明性を確保しながら、最高クラスの運転者および車両サービスを迅速かつ正確な方法で提供し、すべてのインディアナ州民に奉仕することです。
- id: 6
  category: driver_testing
  question: 新しい証明書の取得に関するマニュアルのセクションに基づくと、次のうちどの検査または試験が必要ですか？
  choices:
    A: 聴力検査
    B: 視力検査
    C: 体力テスト
    D: 心理評価
  answer: B
  explanation: 新しい証明書の取得について説明しているマニュアルの第1章では、必要な項目として「視力検査」が挙げられています。
- id: 7
  category: driver_responsibility
  question: 新しい証明書の取得プロセスにおいて、事故や損害の可能性に関してカバーされているトピックはどれですか？
  choices:
    A: 負傷または損害に対する金銭的責任
    B: 総合衝突保険
    C: 医療過誤保険
    D: 車両保証登録
  answer: A
  explanation: マニュアルの第1章には、新しい証明書を取得する際の「負傷または損害に対する金銭的責任」に関する特定のセクションが含まれています。
- id: 8
  category: license_system
  question: インディアナ州運転免許マニュアルに記載されている特定の資格（エンドースメント）または免許の種類は次のうちどれですか？
  choices:
    A: 重機オペレーター免許
    B: 旅客・貨物運送用資格（For-Hire Endorsement）
    C: 農業用車両許可証
    D: レクリエーション車両（RV）免許
  answer: B
  explanation: 制限事項と資格（エンドースメント）を扱うマニュアルの第2章には、「旅客・貨物運送用資格（For-Hire Endorsement）」が明記されています。
- id: 9
  category: license_system
  question: インディアナ州の証明書に追加できる軍歴表示（ミリタリー・インジケーター）の種類は何ですか？
  choices:
    A: 退役予備役表示
    B: 現役および退役軍人表示
    C: 州兵扶養家族表示
    D: 海外派遣表示
  answer: B
  explanation: マニュアルの第3章では、証明書のオプションとして「現役および退役軍人表示（Active Duty and Veteran Military
    Indicator）」が挙げられています。
- id: 10
  category: penalties_and_points
  question: インディアナ州運転免許マニュアルにおいて、違反点数や免許停止に関連するプログラムはどれですか？
  choices:
    A: ドライバー安全プログラム（Driver Safety Program）
    B: ハイウェイ・ウォッチ・プログラム
    C: フージャー・ヘルパー・イニシアチブ
    D: 事故免除プログラム
  answer: A
  explanation: 違反点数、免許停止、および保険要件を扱うマニュアルの第5章には、「ドライバー安全プログラム（Driver Safety Program）」に関する情報が含まれています。
- id: 11
  category: penalties_and_points
  question: インディアナ州の運転免許マニュアルでは、重大な交通違反を繰り返す運転者を何と呼んでいますか？
  choices:
    A: 慢性交通違反者 (Chronic Traffic Offenders)
    B: 常習的交通違反者 (Habitual Traffic Violators)
    C: 反復移動違反者 (Repeat Moving Violators)
    D: 高リスク運転者 (High-Risk Motorists)
  answer: B
  explanation: マニュアルの第5章では点数と免許停止について扱っており、その中に「常習的交通違反者（Habitual Traffic Violators）」専用のセクションがあります。
- id: 12
  category: signs_and_signals
  question: マニュアルで説明されている交通標識の特定のカテゴリーはどれですか？
  choices:
    A: 交通提案標識 (Traffic Suggestion Signs)
    B: 交通案内標識 (Traffic Guidance Signs)
    C: 交通執行標識 (Traffic Enforcement Signs)
    D: 交通観察標識 (Traffic Observation Signs)
  answer: B
  explanation: マニュアルの第6章では交通標識と信号について扱っており、その中に「交通案内標識（Traffic Guidance Signs）」に関する特定のセクションが含まれています。
- id: 13
  category: vehicle_information
  question: 安全な車両操作に関するマニュアルのセクションにおいて、タイヤの空気圧と並んで具体的に取り上げられている車両メンテナンスのトピックは何ですか？
  choices:
    A: オイル寿命
    B: ブレーキパッドの摩耗
    C: 溝の深さ (Tread Depth)
    D: 冷却液レベル
  answer: C
  explanation: マニュアルの第7章では安全な車両操作について扱っており、その中に「タイヤの空気圧と溝の深さ（Tire Pressure and Tread
    Depth）」というタイトルのセクションが含まれています。
- id: 14
  category: safe_driving_rules
  question: 「安全な車両操作」の章で具体的に取り上げられている運転行動はどれですか？
  choices:
    A: 脇見運転（Distracted Driving）とあおり運転（Aggressive Driving）
    B: 無断乗り回しと公道レース
    C: 車間距離の詰めすぎと急ブレーキによる威嚇
    D: 相乗りとライドシェア
  answer: A
  explanation: マニュアルの第7章では安全な車両操作について扱っており、その中に「脇見運転（Distracted Driving）」と「あおり運転（Aggressive
    Driving）」に関する特定のセクションが含まれています。
- id: 15
  category: license_system
  question: 「制限事項と裏書き（Restrictions and Endorsements）」の項目で、オートバイ以外に独自のセクションが設けられている特定の乗り物は何ですか？
  choices:
    A: 自転車
    B: 原動機付自転車 (Motor Driven Cycle / MDC)
    C: 電動スクーター
    D: 全地形対応車 (ATVs)
  answer: B
  explanation: マニュアルの第2章では制限事項と裏書きについて扱っており、その中に「原動機付自転車（Motor Driven Cycle / MDC）」に関する特定のセクションが含まれています。
- id: 16
  category: license_system
  question: 21歳未満のインディアナ州居住者に発行される証明書はどのような形式ですか？
  choices:
    A: 横型
    B: 縦型
    C: 正方形型
    D: 冊子型
  answer: B
  explanation: 21歳未満のインディアナ州居住者に発行されるすべての証明書は縦型であり、カード保持者が18歳および21歳になる日付が表示されています。
- id: 17
  category: license_system
  question: インディアナ州の証明書の右上に表示される星印は何を示していますか？
  choices:
    A: 運転者が臓器提供者であること
    B: 運転者が商用運転免許を保持していること
    C: 証明書がReal IDに準拠していること
    D: 運転者が21歳未満であること
  answer: C
  explanation: 右上の星印は、その証明書がReal IDに準拠しており、連邦政府の目的で身分証明書として使用できることを示しています。
- id: 18
  category: license_system
  question: インディアナ州の新居住者が、新しいインディアナ州の運転免許証を取得するまでに与えられる期間はどれくらいですか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 180日
  answer: B
  explanation: インディアナ州の居住者になった場合、60日以内に新しいインディアナ州の運転免許証を取得する必要があります。
- id: 19
  category: license_system
  question: 他の州の有効な運転免許証を一度も保持したことがないインディアナ州の新居住者が、運転免許証を申請する前にインディアナ州の学習許可証（Learner's
    Permit）を保持しなければならない期間はどれくらいですか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 180日
  answer: D
  explanation: 他の州の有効な運転免許証を一度も保持したことがない場合は、インディアナ州の運転免許証を申請する前に、インディアナ州の学習許可証を180日間保持する必要があります。
- id: 20
  category: driver_testing
  question: 他州の運転免許証の有効期限が5年以上切れている場合、どの試験に合格する必要がありますか？
  choices:
    A: 標準的な視力検査のみ
    B: 知識試験のみ
    C: 知識試験と運転技能試験
    D: 運転技能試験と身体検査
  answer: C
  explanation: 他州の運転免許証の有効期限が5年以上切れている場合、インディアナ州の運転免許証を取得するには、知識試験と運転技能試験の両方に合格する必要があります。
- id: 21
  category: driver_testing
  question: 他州の運転免許証の有効期限が切れてから5年未満である18歳の新規居住者には、どのような試験が義務付けられていますか？
  choices:
    A: 技能試験
    B: 学科試験
    C: 身体検査
    D: 聴力検査
  answer: B
  explanation: 他州の運転免許証の有効期限が切れてから5年未満である場合、または取り消されていない他州の運転免許証の保有期間が1年未満である場合、インディアナ州の運転免許証を取得するには学科試験に合格する必要があります。
- id: 22
  category: license_system
  question: 次のうち、インディアナ州の居住者であることの証明とみなされるものはどれですか？
  choices:
    A: 州内の一時雇用者であること
    B: インディアナ州の登録有権者であること
    C: インディアナ州の居住権を主張せずに高等教育機関に在籍していること
    D: 他州の居住権を主張している現役軍人であること
  answer: B
  explanation: インディアナ州の居住証明には、インディアナ州内に居住住所を維持していること、インディアナ州の登録有権者であること、またはインディアナ州内の初等・中等学校に扶養家族が在籍していることなどが含まれます。
- id: 23
  category: license_system
  question: インディアナ州の身分証明書（IDカード）を無料で受け取ることができるのは誰ですか？
  choices:
    A: 18歳未満のすべての個人
    B: 次回総選挙または地方選挙の当日までに18歳になる、またはすでに18歳である個人
    C: インディアナ州のすべての新規居住者
    D: 他州の運転免許証を返納した個人
  answer: B
  explanation: 身分証明書（IDカード）は、次回総選挙または地方選挙の当日までに18歳になる、またはすでに18歳である個人に対して無料で発行されます。
- id: 24
  category: license_system
  question: マニュアルによると、インディアナ州はいつからリアルID法（Real ID Act）の要件に準拠していますか？
  choices:
    A: 2005年1月1日
    B: 2010年1月1日
    C: 2015年1月1日
    D: 2020年1月1日
  answer: B
  explanation: マニュアルには、インディアナ州は2010年1月1日からリアルID法（Real ID Act）の要件に準拠していると記載されています。（2ページ）
- id: 25
  category: license_system
  question: リアルID（Real ID）準拠の証明書にアップグレードするために必要な書類として、明示的にリストされていないものは次のうちどれですか？
  choices:
    A: 本人確認書類
    B: 法的地位の証明
    C: 社会保障番号
    D: 自動車保険の証明
  answer: D
  explanation: リアルID（Real ID）準拠の証明書にアップグレードするには、本人確認、法的地位、社会保障番号、およびインディアナ州の居住証明の原本または認証コピーを提出する必要があります。自動車保険の証明は必要ありません。
- id: 26
  category: license_system
  question: 確認プロセス中に、申請者が他州の証明書を保持していることがBMVによって判明した場合、どうなりますか？
  choices:
    A: 申請者は二重居住手数料を支払わなければならない。
    B: 申請者は他州の証明書を返納することを求められる。
    C: 申請者には60日間有効なインディアナ州の暫定証明書が発行される。
    D: 申請者はインディアナ州の証明書を取得することを永久に禁止される。
  answer: B
  explanation: 確認中に、申請者に対して他州で別の証明書が発行されていることがBMVによって判明した場合、BMVがインディアナ州の証明書の申請を処理する前に、申請者は他州の証明書を返納する必要があります。
- id: 27
  category: license_system
  question: 21歳未満の居住者に発行されるインディアナ州の証明書に目立つように表示されている日付は何ですか？
  choices:
    A: カード保持者が18歳および21歳になる日付
    B: カード保持者が16歳および18歳になる日付
    C: カード保持者が許可証と免許証を取得した日付
    D: 次回の総選挙および地方選挙の日付
  answer: A
  explanation: 21歳未満のインディアナ州居住者に発行されるすべての証明書は縦型フォーマットであり、カード保持者が18歳および21歳になる日付が表示されます。
- id: 28
  category: driver_testing
  question: 必要な書類の提出に加えて、すべてのインディアナ州新規居住者がインディアナ州の運転免許証を取得する際に合格しなければならない検査は何ですか？
  choices:
    A: 標準的な聴力検査
    B: 標準的な視力検査
    C: 薬物およびアルコール検査
    D: 身体能力検査
  answer: B
  explanation: 上記のすべてのカテゴリーに該当する個人は、本人確認、法的地位、社会保障番号、およびインディアナ州の居住を証明する書類も提示しなければなりません。また、標準的な視力検査に合格することも義務付けられています。
- id: 29
  category: license_system
  question: 次の個人のうち、証明書取得の目的においてインディアナ州の居住者とみなされないのは誰ですか？
  choices:
    A: インディアナ州内に居住住所を維持し、他所での居住権を主張していない人物
    B: インディアナ州の登録有権者
    C: インディアナ州の初等学校に扶養家族が在籍している人物
    D: インディアナ州を居住州として主張していない軍の現役軍人
  answer: D
  explanation: 証明書取得の目的において、インディアナ州を居住州として主張していない軍の現役軍人は、インディアナ州の居住者とはみなされません。
- id: 30
  category: license_system
  question: 18歳以上で有効な他州の運転免許証を保持している場合、インディアナ州の免許証を申請するために支局（BMV branch）に持参できるものは次のうちどれですか？
  choices:
    A: 高校の卒業証書のコピー
    B: 公式運転記録のコピー
    C: 前の州の知事からの手紙
    D: 前の州の公共料金の請求書
  answer: B
  explanation: 18歳以上で有効な他州の運転免許証を保持している場合は、現在の他州の運転免許証、公式運転記録のコピー、または確認書の3つのうちいずれか1つを支局に持参する必要があります。
- id: 31
  category: license_system
  question: 標準的なインディアナ州の身分証明書（IDカード）の有効期限はどのくらいですか？
  choices:
    A: 2年
    B: 4年
    C: 6年
    D: 8年
  answer: C
  explanation: マニュアルによると、身分証明書およびMDC（原動機付自転車）の裏書きの有効期限は6年間です。
- id: 32
  category: license_system
  question: インディアナ州の身分証明書（IDカード）を申請する際、すでに他州の証明書を保持している場合、どうしなければなりませんか？
  choices:
    A: 異なる州のものであれば、両方の証明書を保持し続ける
    B: 他州の証明書をインディアナ州BMVに返納する
    C: 複数の証明書を保持するために追加料金を支払う
    D: 他州の証明書を自分で破棄する
  answer: B
  explanation: インディアナ州の居住者は、同時に複数の証明書を保持することはできません。したがって、身分証明書の申請を完了するには、他の証明書をインディアナ州BMVに返納する必要があります。
- id: 33
  category: license_system
  question: 身分証明書（IDカード）に原動機付自転車（MDC）の裏書き（エンドースメント）を取得するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: B
  explanation: 身分証明書には、15歳以上であり、かつMDC知識試験に合格している場合に限り、原動機付自転車（MDC）を運転する資格を付与することができます。
- id: 34
  category: driver_testing
  question: 16歳未満で仮免許（ラーナーズ・パーミット）を申請する場合、運転教育への登録を証明する書類として認められないものは次のうちどれですか？
  choices:
    A: 学校が発行した運転教育登録証明書
    B: クラス開始の2週間前の日付が記載された証明書
    C: 座学トレーニングのオンラインコース修了証
    D: BMV認可の実技トレーニング（Behind-the-wheel）提供者への登録を証明する書類
  answer: C
  explanation: マニュアルには、座学トレーニングのオンラインコース修了証は、登録を証明する書類として認められないと明記されています。
- id: 35
  category: license_system
  question: 標準的な仮免許（ラーナーズ・パーミット）は、発行日からどのくらいの期間有効ですか？
  choices:
    A: 1年
    B: 2年
    C: 4年
    D: 6年
  answer: B
  explanation: 「仮免許の有効性」のセクションによると、仮免許は発行日から2年間有効です。
- id: 36
  category: driver_testing
  question: 仮免許（ラーナーズ・パーミット）を更新する際、有効期限が切れてから何日以上経過している場合に再試験を受ける必要がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 180日
  answer: D
  explanation: 仮免許の更新のためにBMVの支局を訪れた際、有効期限が切れてから180日以上経過している場合は、再試験を受ける必要があります。
- id: 37
  category: safe_driving_rules
  question: 16歳未満で親族と一緒に運転の練習をする場合、免許を持っている親族は最低何歳である必要がありますか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 30歳
  answer: C
  explanation: 血縁、婚姻、または法的地位による親族であり、有効な運転資格を持つ25歳以上の免許保持者が同乗している場合に限り、運転の練習をすることができます。
- id: 38
  category: driver_testing
  question: コンピューターによる知識試験を受けるには、BMV支局の閉館時間の何分前までに到着しなければなりませんか？
  choices:
    A: 少なくとも15分前
    B: 少なくとも30分前
    C: 少なくとも45分前
    D: 少なくとも1時間前
  answer: B
  explanation: その日にコンピューターによる知識試験を受けるには、支局の閉館時間の少なくとも30分前までに到着する必要があります。
- id: 39
  category: driver_testing
  question: 運転知識試験に不合格となった場合、どうしなければなりませんか？
  choices:
    A: 手数料を支払った直後に再受験する
    B: 再受験まで少なくとも30分待つ
    C: 次の営業日まで待ってから再受験する
    D: 再受験まで丸1週間待つ
  answer: C
  explanation: マニュアルには、「知識試験に不合格となった場合は、次の営業日まで待ってから再受験しなければならない」と記載されています。
- id: 40
  category: penalties_and_points
  question: インディアナ州の運転免許証を更新する際、運転記録に少なくとも何点の有効な違反点数（アクティブ・ポイント）がある場合に知識試験を受ける必要がありますか？
  choices:
    A: 2点以上の有効なポイント
    B: 4点以上の有効なポイント
    C: 6点以上の有効なポイント
    D: 8点以上の有効なポイント
  answer: C
  explanation: インディアナ州の運転記録に6点以上の有効な違反点数があるドライバーが運転免許証を更新する場合、運転知識試験を受ける必要があります。
- id: 41
  category: driver_testing
  question: 運転中に通常、眼鏡やコンタクトレンズを使用している場合、視力検査を受ける際にどうすべきですか？
  choices:
    A: 裸眼の視力をテストするために外す
    B: 視力検査中もそれらを着用する
    C: 最初の検査に合格しなかった場合のみ着用する
    D: 検査を受ける代わりに医師の診断書を提出する
  answer: B
  explanation: 運転中に通常、眼鏡やコンタクトレンズを使用している場合は、BMV支局の職員にその旨を伝え、視力検査中もそれらを着用する必要があります。
- id: 42
  category: license_system
  question: 18歳未満で学習許可証（learner's permit）を申請する場合、少なくとも何歳の緊急連絡先を指定する必要がありますか？
  choices:
    A: 18歳以上
    B: 21歳以上
    C: 25歳以上
    D: 親族であれば年齢は問わない
  answer: A
  explanation: 学習許可証を申請する18歳未満の個人は、18歳以上の緊急連絡先を指定することが義務付けられています。
- id: 43
  category: safe_driving_rules
  question: 18歳未満で児童福祉局（DCS）の保護下にある場合、DCSの承認を受け、かつ少なくとも何歳の免許保有運転者（親族以外）と一緒に運転の練習ができますか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 30歳
  answer: C
  explanation: 児童福祉局（DCS）の保護下にある場合は、DCSが承認した25歳以上の免許保有運転者と一緒に運転の練習をすることを選択できます。
- id: 44
  category: driver_testing
  question: コンピューターによる知識試験に不合格となった場合、再受験までにどのくらいの期間待つ必要がありますか？
  choices:
    A: 翌営業日まで
    B: 48時間
    C: 7日間
    D: 14日間
  answer: A
  explanation: 知識試験に不合格となった場合、再受験するには翌営業日まで待つ必要があります。
- id: 45
  category: driver_testing
  question: BMVで運転技能試験を予約する場合、最長でどのくらい前から予約が可能ですか？
  choices:
    A: 1週間前
    B: 2週間前
    C: 3週間前
    D: 1ヶ月前
  answer: C
  explanation: 運転技能試験は、3週間前以内、かつ48営業時間前までに予約する必要があります。
- id: 46
  category: vehicle_information
  question: BMVの試験官が運転技能試験において、車両の使用を拒否（不合格）とする正当な理由は、次のうちどれですか？
  choices:
    A: 車両がマニュアル車である
    B: 車両のドアが作動しない
    C: 車両が製造から10年以上経過している
    D: 車両にバックカメラが装備されていない
  answer: B
  explanation: 運転技能試験で車両が拒否される理由の例としては、ドアが作動しない、タイヤが安全でない、バンパーがない、ガラスやミラーの破損、または適切に登録されていないことなどが挙げられます。
- id: 47
  category: driver_testing
  question: 運転技能試験において、即時不合格となる行為は次のうちどれですか？
  choices:
    A: 車線変更完了後にウィンカーをつけたままにする
    B: 死角の確認を怠る
    C: 後退中に縁石に乗り上げる
    D: 後退の速度が速すぎる
  answer: C
  explanation: 縁石に乗り上げる行為は、運転技能試験において即時不合格となる行為として記載されています。他の選択肢は最終スコアに影響したり不合格の原因になったりする可能性はありますが、即時不合格とはされていません。
- id: 48
  category: driver_testing
  question: 運転技能試験を受ける際、車両への同乗が許可されているのは誰ですか？
  choices:
    A: 免許を持っている親または保護者
    B: 認定された教習指導員
    C: BMVの試験官または認可されたBMV職員のみ
    D: 有効な運転免許証を持っている人なら誰でも
  answer: C
  explanation: 運転技能試験を受ける際、車両に同乗できるのは、試験を実施するBMVの試験官、またはその他の認可されたBMV職員のみです。
- id: 49
  category: driver_testing
  question: 学習許可証（learner's permit）を保持している間に、運転技能試験に3回不合格となった場合はどうなりますか？
  choices:
    A: 再受験まで2ヶ月間待たなければならない
    B: 学習許可証が永久に失効する
    C: ドライバー教育コースを再受講しなければならない
    D: 再受験まで6ヶ月間待たなければならない
  answer: A
  explanation: 学習許可証を保持している間に運転技能試験に3回不合格となった場合、最後に不合格となった試験の日から2ヶ月間待ってからでないと再受験できません。
- id: 50
  category: driver_responsibility
  question: 18歳未満の申請者のために、財政的責任に関する宣誓供述書（sworn statement of financial liability）に署名する優先順位の第一位は誰ですか？
  choices:
    A: 親権を持たない親
    B: 未成年者の後見人
    C: 義務を引き受ける意思のある成人
    D: 未成年申請者の親権を持つ親
  answer: D
  explanation: 財政的責任に関する法的優先順位の第一位は、未成年申請者の親権を持つ親（または親権を持つ親によって指定された者）です。
- id: 51
  category: driver_responsibility
  question: 未成年者のために財政的責任（financial liability）の連帯署名をした成人が、その責任を撤回する旨の書面を提出した場合、どうなりますか？
  choices:
    A: 未成年者は罰金を支払わなければならない
    B: 未成年者の仮免許証または運転免許証が取り消される
    C: 未成年者は免許を維持するために、30日以内に新しい連帯署名者を見つけなければならない
    D: 未成年者は通学のための運転のみに制限される
  answer: B
  explanation: 財政的責任を撤回する書面による要求があった場合、未成年者の仮免許証または運転免許証は取り消されます。
- id: 52
  category: license_system
  question: 未成年者の申請者が児童サービス局（DCS）の保護下にある場合、財政的責任に関する成人の署名の代わりに何を提出しなければなりませんか？
  choices:
    A: 裁判官からの推薦状
    B: 最低賠償基準を満たす自動車保険証券の証明
    C: BMVへの1,000ドルの現金預託
    D: 高度な防衛運転講習の修了証明
  answer: B
  explanation: DCSの申請者が運転免許証または仮免許証を申請する場合、インディアナ州法で定められた最低賠償基準を満たす自動車保険証券の証明を提出しなければなりません。
- id: 53
  category: license_system
  question: 21歳未満で運転免許証を申請する場合、どのような種類の免許証を受け取ることになりますか？
  choices:
    A: 制限付き免許証
    B: 商業運転免許証 (CDL)
    C: 試用運転免許証 (probationary license)
    D: 仮免許証
  answer: C
  explanation: 21歳未満の場合、運転免許証は「試用（probationary）」免許証とみなされます。
- id: 54
  category: driver_testing
  question: 運転技能試験（ロードテスト）において、自動的に不合格となるのは次のうちどれですか？
  choices:
    A: シートベルトの着用を怠る
    B: 必要な時にデフロスターを使用しない
    C: 速度が遅すぎる
    D: 車線変更時に速度を落とす
  answer: A
  explanation: シートベルトの不着用は、運転技能試験において自動的に不合格となる行為として挙げられています。他の選択肢は最終スコアに影響したり不合格の原因になったりする可能性はありますが、自動的な不合格ではありません。
- id: 55
  category: driver_testing
  question: BMVが実施する運転技能試験の費用はいくらですか？
  choices:
    A: $15
    B: $25
    C: $50
    D: 無料
  answer: D
  explanation: BMVが実施する運転技能試験には費用はかかりません。
- id: 56
  category: license_system
  question: BMV公認の運転者教育プログラムを修了していない場合、運転免許証を申請するには何歳である必要がありますか？
  choices:
    A: 16歳と90日
    B: 16歳と180日
    C: 16歳と270日
    D: 18歳
  answer: C
  explanation: マニュアルによると、BMV公認の運転者教育プログラムを修了していない場合は、少なくとも16歳と270日である必要があります。
- id: 57
  category: license_system
  question: 80歳の人の標準的な運転免許証の有効期間はどのくらいですか？
  choices:
    A: 2年間
    B: 3年間
    C: 4年間
    D: 6年間
  answer: B
  explanation: マニュアルには、75歳から84歳までの場合、運転免許証の有効期間は3年間であると記載されています。
- id: 58
  category: safe_driving_rules
  question: 試用運転免許証を取得してから最初の180日間、資格のある成人の同伴なしで同乗させることが許可されているのは、次のうちどの乗客ですか？
  choices:
    A: 学校の友人
    B: 自分の兄弟姉妹
    C: 自分のいとこ
    D: 近所の人
  answer: B
  explanation: 試用運転免許証を取得してから最初の180日間は、自分の子供、継子、兄弟姉妹、義理の兄弟姉妹、または配偶者であれば、他の同伴者なしで同乗させて運転することができます。
- id: 59
  category: safe_driving_rules
  question: 試用運転免許証を取得してから最初の180日間、運転が禁止されている時間帯はいつですか？
  choices:
    A: 午後10時から午前5時
    B: 午後11時から午前6時
    C: 午前0時から午前5時
    D: 午後9時から午前6時
  answer: A
  explanation: マニュアルには次のように記載されています。「試用運転免許証を取得してから最初の180日間は、午後10時から午前5時の間は運転できません。」
- id: 60
  category: safe_driving_rules
  question: 試用運転免許証の保持者が、自動車の運転中に通信機器を使用することが許可されるのはどのような時ですか？
  choices:
    A: ハンズフリー機器を使用している時
    B: 親または保護者にテキストメッセージを送信している時
    C: 赤信号で停車している時
    D: 911緊急通報を行う時
  answer: D
  explanation: インディアナ州法では、911緊急通報を行う場合を除き、すべての運転者が通信機器を使用して自動車を運転することを禁止しています。
- id: 61
  category: penalties_and_points
  question: 学校管理者からの通知があった場合、未成年者が以下のいずれかに該当するとき、BMV（車両管理局）は当該未成年者の運転資格を停止する義務があります。
  choices:
    A: 1回の居残り罰を受けた場合
    B: 常習的欠席者（不登校）と判断された場合
    C: 運転教育コースで不合格となった場合
    D: 3回遅刻した場合
  answer: B
  explanation: インディアナ州の法律では、未成年者が退学、除外、2度目の停学処分を受けている場合、退学した場合、または常習的欠席者と判断された場合、BMVは当該未成年者の運転資格を停止することが義務付けられています。
- id: 62
  category: license_system
  question: 乗客輸送および/またはスクールバスの資格付与（エンドースメント）を伴う商業運転免許（CDL）を申請するために必要な最低年齢は何歳ですか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 16歳と270日
  answer: B
  explanation: 商業運転免許（CDL）の申請には18歳以上である必要がありますが、乗客輸送および/またはスクールバスの資格付与を伴うCDLを申請するには21歳以上である必要があります。
- id: 63
  category: driver_testing
  question: 18歳以上で運転免許を申請する場合、合計で何時間の監督下での運転練習を完了させる必要がありますか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: C
  explanation: 18歳以上で運転免許を申請する場合、少なくとも50時間の監督下での運転練習を完了させる必要があります。
- id: 64
  category: driver_testing
  question: 義務付けられている50時間の監督下での運転練習のうち、夜間に完了しなければならないのは何時間ですか（日中限定制限がない場合）？
  choices:
    A: 5時間
    B: 10時間
    C: 15時間
    D: 20時間
  answer: B
  explanation: 仮免許（ラーナーズパーミット）に日中限定の制限がない限り、監督下での運転練習のうち少なくとも10時間は夜間に行う必要があります。
- id: 65
  category: license_system
  question: 21歳になる前に運転免許を取得した場合、そのプロベーショナリー免許（試用期間付き免許）は何歳になるまで有効ですか？
  choices:
    A: ちょうど21歳まで
    B: 21歳と30日になるまで
    C: 21歳と90日になるまで
    D: 25歳まで
  answer: B
  explanation: プロベーショナリー免許（試用期間付き免許）は、21歳と30日になるまで有効です。
- id: 66
  category: license_system
  question: 新しい免許証を申請した後、郵送先に届くまで通常何暦日かかりますか？
  choices:
    A: 7暦日
    B: 10暦日
    C: 14暦日
    D: 21暦日
  answer: C
  explanation: 免許証はBMVに登録されている住所に送付され、14暦日以内に届きます。
- id: 67
  category: license_system
  question: 写真免除の身分証明書（IDカード）は、どのような理由で利用可能ですか？
  choices:
    A: 医療上の理由のみ
    B: 宗教上の理由のみ
    C: 医療上および宗教上の両方の理由
    D: プライバシー上の理由のみ
  answer: B
  explanation: 写真免除の仮免許および運転免許は医療上および宗教上の理由で利用可能ですが、写真免除の身分証明書（IDカード）は宗教上の理由のみで利用可能です。
- id: 68
  category: driver_testing
  question: 運転免許を申請する際、学科試験と実技試験に関して正しいものはどれですか？
  choices:
    A: 実技試験を学科試験より先に完了させる必要がある
    B: 学科試験を実技試験より先に完了させる必要がある
    C: 両方の試験を同日に受ける必要がある
    D: 実技試験に合格すれば学科試験は免除される
  answer: B
  explanation: 運転免許を取得するには、取得を希望する免許の種類に応じた学科試験に合格する必要があり、これは実技試験の前に完了していなければなりません。
- id: 69
  category: safe_driving_rules
  question: プロベーショナリー免許を180日間保持した後（かつ18歳未満の場合）、以下のいずれかに参加、あるいは行き帰りの途中であれば、制限時間帯に運転することができますか？
  choices:
    A: 学校公認の活動
    B: 友人の家
    C: 観客としての地元のスポーツイベント
    D: 公立公園
  answer: A
  explanation: 合法的な雇用、学校公認の活動、または宗教的な行事に参加しているか、それらの場所への行き帰りの途中であれば、制限時間帯であっても運転することができます。
- id: 70
  category: vehicle_information
  question: インディアナ州の商業運転免許（CDL）保持者は、車両総重量定格（GVWR）が何ポンドを超える商業用自動車を運転することができますか？
  choices:
    A: 10,000ポンド
    B: 16,000ポンド
    C: 20,000ポンド
    D: 26,000ポンド
  answer: D
  explanation: インディアナ州のCDLは、車両総重量定格（GVWR）が26,000ポンドを超える商業用自動車または連結車両を運転することを許可します。
- id: 71
  category: license_system
  question: 米国郵便公社（USPS）で郵送先住所を変更したものの、インディアナ州BMVでの更新を忘れてしまった場合、どうなりますか？
  choices:
    A: USPSが自動的に新しい住所へ免許証（証明書）を転送します。
    B: 免許証は地元の郵便局で保管され、受け取りに行く必要があります。
    C: 免許証は転送されず、配達も行われません。
    D: BMVが代わりに免許証のデジタルコピーをメールで送信します。
  answer: C
  explanation: マニュアルによると、免許証などの証明書はBMVに登録されている住所にのみ郵送され、転送はされません。BMVでの住所更新を怠ると、配達が行われなくなります。
- id: 72
  category: safe_driving_rules
  question: インディアナ州法において、自動車の走行中にシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転手と助手席の乗員のみ
    B: メーカー設置の標準装備シートベルトが備わっている車両の全乗員
    C: 18歳未満の乗員のみ
    D: 運転手（商用車を運転している場合を除く）
  answer: B
  explanation: インディアナ州法では、メーカーによって標準装備として設置されたシートベルトを備えた自動車が走行している間は、いかなる時も全乗員がシートベルトを着用することを義務付けています。
- id: 73
  category: driver_responsibility
  question: 走行中の自動車を操作している際、通信機器を使用してテキストメッセージを入力したり読んだりすることが法的に許されるのはいつですか？
  choices:
    A: 時速15マイル（約24km/h）未満で走行しているとき
    B: 赤信号で停車しているとき
    C: ハンズフリー技術を使用しているとき、または911緊急通報を行うとき
    D: 他の交通がない田舎の幹線道路を走行しているとき
  answer: C
  explanation: インディアナ州法では、ハンズフリーや音声操作技術を使用する場合、または911緊急通報を行う場合を除き、走行中の車両を操作しながらテキストやメールを入力、送信、または閲覧することを禁止しています。
- id: 74
  category: driver_responsibility
  question: インディアナ州の運転法において、制限対象の「通信機器」とみなされないものは次のうちどれですか？
  choices:
    A: ワイヤレス電話
    B: 携帯情報端末（PDA）
    C: テキストメッセージ送信機器
    D: 免許保持者によって操作される市民ラジオ（CB無線）機器
  answer: D
  explanation: 通信機器の定義には、連邦通信委員会（FCC）の免許を受けた者によって操作される市民ラジオ（CB無線）機器は含まれません。
- id: 75
  category: license_system
  question: インディアナ州の運転免許証に記載される「制限事項G（Restriction G）」は何を示していますか？
  choices:
    A: 眼鏡またはコンタクトレンズが必要
    B: 車外バックミラーが必要
    C: 日中走行のみ可能
    D: インターロック装置が必要
  answer: C
  explanation: 基本運転免許制限チャートによると、制限事項Gは「日中走行のみ（Daylight Driving Only）」を意味します。
- id: 76
  category: safe_driving_rules
  question: 二輪車学習許可証（モーターサイクル・ラーナーズ・パーミット）の保持者が走行を許可されている時間はいつですか？
  choices:
    A: 午前6時から午後6時の間
    B: 日の出の30分前から日没の30分後まで
    C: 日の出から日没までのみ
    D: 許可証保持者に時間制限はありません
  answer: B
  explanation: 二輪車学習許可証を保持している場合、走行できるのは日の出の30分前から日没の30分後までの期間に限られます。
- id: 77
  category: license_system
  question: 初めてインディアナ州の運転免許証を取得する場合、同時に二輪車裏書き（モーターサイクル・エンドースメント）を取得できる最低年齢は何歳ですか？
  choices:
    A: 15歳
    B: 16歳
    C: 16歳と90日
    D: 18歳
  answer: C
  explanation: 16歳と90日以上であり、かつ二輪車安全講習を修了していれば、最初の運転免許証の取得と同時に二輪車裏書きを取得することができます。
- id: 78
  category: vehicle_information
  question: インディアナ州法でモーター・ドリブン・サイクル（MDC）と定義されるには、車両の排気量が以下を超えてはなりません：
  choices:
    A: 35立方センチメートル（cc）
    B: 50立方センチメートル（cc）
    C: 150立方センチメートル（cc）
    D: 250立方センチメートル（cc）
  answer: B
  explanation: インディアナ州法では、他の要件に加え、排気量が50立方センチメートル（cc）を超えない車両をMDCと定義しています。
- id: 79
  category: safe_driving_rules
  question: モーター・ドリブン・サイクル（MDC）の運転に適用される制限事項は次のうちどれですか？
  choices:
    A: 時速35マイル（約56km/h）以下で走行しなければならない
    B: ヘルメットを着用していれば、同乗者を1名乗せることができる
    C: 州間高速道路を走行することができる
    D: 車道の中央を走行しなければならない
  answer: A
  explanation: MDCの運転に関する制限には、時速35マイル以下での走行、同乗者の禁止、および州間高速道路での走行禁止が含まれます。
- id: 80
  category: vehicle_information
  question: インディアナ州において、三輪自動車が法的に「オートサイクル（autocycle）」と定義されるために必要な機能は次のうちどれですか？
  choices:
    A: ステアリング用のハンドルバー
    B: アンチロック・ブレーキ（ABS）
    C: サドル型の座席
    D: 50cc未満の排気量
  answer: B
  explanation: オートサイクルは、ロールケージまたはロールフープ、安全ベルト、アンチロック・ブレーキを備え、ステアリングホイール（ハンドル）とペダルで操作するように設計されている必要があります。
- id: 81
  category: license_system
  question: インディアナ州の道路でオートサイクル（autocycle）を合法的に運転するために必要な資格は何ですか？
  choices:
    A: 二輪車学習許可証（Motorcycle learner's permit）
    B: 二輪車運転資格（Motorcycle endorsement）
    C: 有効なインディアナ州運転免許証
    D: 商業運転免許証（CDL）
  answer: C
  explanation: 有効なインディアナ州運転免許証を所持していれば、インディアナ州の道路でオートサイクルを運転することができます。二輪車の学習許可証やエンドースメント（資格）は必要ありません。
- id: 82
  category: driver_testing
  question: オートサイクルを運転する際、禁止されていることは次のうちどれですか？
  choices:
    A: 州間高速道路を走行すること
    B: 運転免許の運転技能試験にオートサイクルを使用すること
    C: 二輪車用ヘルメットを着用せずに車両を操作すること
    D: 囲まれた座席エリアに同乗者を乗せること
  answer: B
  explanation: マニュアルには、オートサイクルは「運転免許の運転技能試験の目的で使用することはできない」と明記されています。
- id: 83
  category: license_system
  question: 旅客運送用（for-hire）エンドースメントを所持している場合、何人未満の乗客を運送するために設計された自動車を運転することができますか？
  choices:
    A: 10人
    B: 12人
    C: 15人
    D: 16人
  answer: D
  explanation: 旅客運送用（for-hire）エンドースメントは、報酬を得て乗客を運送する目的で、運転手を含めて16人未満を運送するように設計された自動車を運転する特権を与えます。
- id: 84
  category: license_system
  question: インディアナ州で旅客運送用（for-hire）エンドースメントを取得するための年齢と経験の要件は何ですか？
  choices:
    A: 16歳以上で、6ヶ月以上の運転経験があること
    B: 18歳以上で、有効なインディアナ州運転免許証を少なくとも1年間保持していること
    C: 21歳以上で、違反歴のない運転記録があること
    D: 18歳以上で、有効なインディアナ州運転免許証を少なくとも2年間保持していること
  answer: B
  explanation: マニュアルによると、旅客運送用（for-hire）エンドースメントは、18歳以上で、有効なインディアナ州運転免許証を少なくとも1年間保持しているインディアナ州居住者に発行されます。
- id: 85
  category: license_system
  question: インディアナ州BMVは、旅客運送用（for-hire）エンドースメント付きの運転免許証を発行するために健康診断報告書を必要としますか？
  choices:
    A: はい、2年ごとに更新する必要があります。
    B: はい、ただし65歳以上の運転手のみです。
    C: いいえ、BMVは旅客運送用エンドースメントのために健康診断報告書を必要としません。
    D: いいえ、運転手が有害物質を輸送している場合を除きます。
  answer: C
  explanation: マニュアルには、「BMVは、旅客運送用（for-hire）エンドースメント付きの運転免許証を発行するために健康診断報告書を必要としません」と記載されています。
- id: 86
  category: vehicle_information
  question: インディアナ州の運転マニュアルによると、次のうち「旅客運送（transporting for hire）」とみなされないものはどれですか？
  choices:
    A: ライドシェア車両の運転
    B: 医療サービス車両の運転
    C: タクシーまたはリムジンの運転
    D: 報酬を得て乗客を運ぶために使用されるバスの運転
  answer: B
  explanation: マニュアルでは、「医療サービス車両の運転」を旅客運送とみなされない例外として明記しています。
- id: 87
  category: driver_responsibility
  question: インディアナ州のドナー選択法（Donor Choice Law）に基づき、18歳以上の個人が臓器提供者になる意思を表明した場合、どうなりますか？
  choices:
    A: 死亡時に家族がその決定を覆すことができる。
    B: 4年ごとに意思表明を更新しなければならない。
    C: 死亡時に家族がその意思を覆すことはできない。
    D: 常に別の臓器提供者カードを携帯しなければならない。
  answer: C
  explanation: マニュアルによると、インディアナ州のドナー選択法に基づき、18歳以上の個人は臓器提供者になる意思を表明することができ、死亡時に家族がその意思を覆すことはできません。
- id: 88
  category: license_system
  question: 免許証に退役軍人表示（veteran indicator）を記載するために、退役軍人はどの書類を提出する必要がありますか？
  choices:
    A: 共通アクセスカード（CAC）
    B: 米国国防総省が発行したDD 214
    C: 退役軍人省からの書簡
    D: 有効な軍用身分証明書
  answer: B
  explanation: 退役軍人表示を取得するには、除隊を確認する米国国防総省発行のDD 214を提出する必要があります。
- id: 89
  category: safe_driving_rules
  question: インディアナ州の法律では、エンジンの出力が何馬力（horsepower）を超える船舶を操縦する場合、有効な運転免許証の携帯が義務付けられていますか？
  choices:
    A: 5馬力
    B: 10馬力
    C: 15馬力
    D: 25馬力
  answer: B
  explanation: インディアナ州の法律では、10馬力を超えるエンジンを搭載した船舶の操縦士は、有効な運転免許証を携帯することが義務付けられています。
- id: 90
  category: license_system
  question: 15歳以上で運転免許証を持っていない場合、10馬力を超えるエンジンの船舶を合法的に操縦するにはどうすればよいですか？
  choices:
    A: 承認されたボート操縦教育コースを修了し、有効なインディアナ州身分証明書（IDカード）を携帯する。
    B: 21歳以上の免許を持つ成人が同乗する。
    C: BMVで一時的な船舶操縦許可証を申請する。
    D: 運転免許証がない限り、いかなる状況でも船舶を操縦することはできない。
  answer: A
  explanation: 運転免許証のない15歳以上の方は、承認されたボート操縦教育コースを修了した後にのみ船舶を操縦することができ、その際は有効なインディアナ州身分証明書（IDカード）を所持していなければなりません。
- id: 91
  category: penalties_and_points
  question: 運転免許が停止された場合、船舶の操縦資格はどうなりますか？
  choices:
    A: 日中のみ船舶を操縦することができます。
    B: ボート操縦教育コースを修了すれば、船舶を操縦することができます。
    C: 船舶を操縦することはできません。
    D: 25馬力未満であれば、船舶を操縦することができます。
  answer: C
  explanation: マニュアルには、「運転免許が停止された場合、船舶を操縦することはできません」と記載されています。
- id: 92
  category: vehicle_information
  question: 一時的な障害に対して発行された駐車許可証（パーキング・プラカード）の有効期限はいつですか？
  choices:
    A: 医療提供者が指定した日、または発行から1年のいずれか早い方。
    B: 発行日から2年。
    C: 運転者の次の誕生日。
    D: 発行日から6ヶ月。
  answer: A
  explanation: 一時的な障害がある場合、駐車許可証の有効期限は、医療提供者が指定した日、または発行日から1年のいずれか早い方となります。
- id: 93
  category: vehicle_information
  question: インディアナ州で恒久的な駐車許可証を取得するための手数料はいくらですか？
  choices:
    A: 5.00ドル
    B: 10.00ドル
    C: 15.00ドル
    D: 恒久的な駐車許可証に手数料はかかりません。
  answer: D
  explanation: マニュアルには、「恒久的な駐車許可証に手数料はかかりません」と明記されています。
- id: 94
  category: safe_driving_rules
  question: 有効な駐車許可証を持っている場合、専用駐車スペースの隣にある斜線の引かれたスペースに駐車することは許可されますか？
  choices:
    A: はい、ただし乗客の乗り降りのためだけに限ります。
    B: はい、メインの専用スペースがすでに埋まっている場合に限ります。
    C: いいえ、斜線のスペースへの駐車はいかなる時も禁止されています。
    D: いいえ、車椅子対応のバンを運転している場合を除きます。
  answer: C
