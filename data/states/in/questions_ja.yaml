- id: 95
  category: license_system
  question: インディアナ州の見習い運転免許（probationary driver's license）の有効期限はいつですか？
  choices:
    A: 運転者の21歳の誕生日の深夜0時。
    B: 免許保持者が21歳と30日になった時。
    C: 発行日から4年。
    D: 運転者の18歳の誕生日の深夜0時。
  answer: B
  explanation: マニュアルによると、見習い運転免許は免許保持者が21歳と30日になった時に失効します。
- id: 96
  category: license_system
  question: 誕生日がBMV（車両管理局）の支店が閉まっている日にあたる場合、免許証の有効期限はいつになりますか？
  choices:
    A: 誕生日の前日の深夜0時。
    B: BMVの営業時間に関わらず、誕生日の深夜0時。
    C: 翌営業日の深夜0時。
    D: 誕生日の7日後。
  answer: C
  explanation: マニュアルには、「誕生日がBMVの支店が閉まっている日にあたる場合、免許証の有効期限は翌営業日の深夜0時になります」と記されています。
- id: 97
  category: penalties_and_points
  question: 船舶の操縦中に犯した違反に対して、運転記録に点数が加算されることはありますか？
  choices:
    A: いいえ、船舶の違反は運転記録とは別に扱われます。
    B: はい、無謀な操縦、酒気帯び操縦、または私用船舶法に違反した場合に加算されます。
    C: はい、ただし50馬力以上の船舶を操縦している場合に限ります。
    D: いいえ、船舶が自動車との衝突事故に関与しない限り加算されません。
  answer: B
  explanation: マニュアルには、無謀な操縦、酒気帯び操縦、または私用船舶法に違反した場合、運転記録に点数が加算される可能性があると記載されています。
- id: 98
  category: license_system
  question: 営利目的運転の裏書き（for-hire endorsement）付きの運転免許証は、有効期限のどのくらい前から更新できますか？
  choices:
    A: 有効期限の30日前まで。
    B: 有効期限の90日前まで。
    C: 有効期限の6ヶ月前まで。
    D: 有効期限の1年前まで。
  answer: D
  explanation: 営利目的運転の裏書き付きの運転免許証は、有効期限の1年前から、インディアナ州のBMV支店またはオンラインで更新することができます。
- id: 99
  category: license_system
  question: インディアナ州の運転免許証は、通常、誕生日の何時に失効しますか？
  choices:
    A: 正午
    B: 午後5時
    C: 深夜0時
    D: 午前11時59分
  answer: C
  explanation: マニュアルによると、その他のすべての免許証は誕生日の深夜0時に失効します。支店が閉まっている場合は、翌営業日の深夜0時に失効します。
- id: 100
  category: driver_testing
  question: 3年間失効していた運転免許証を更新するには、何をしなければなりませんか？
  choices:
    A: 行政手数料の支払いと視力検査の合格のみ。
    B: 行政手数料の支払い、知識試験の合格、および視力検査の合格。
    C: 実技試験と視力検査の合格。
    D: 行政手数料の支払い、知識試験、実技試験、および視力検査の合格。
  answer: B
  explanation: 180日以上5年未満失効していた運転免許証を更新する場合、行政手数料を支払い、知識試験と標準的な視力検査に合格する必要があります。
- id: 101
  category: license_system
  question: 米国市民または合法的永住資格を持つ個人は、運転免許証の有効期限のどのくらい前から更新手続きを行うことができますか？
  choices:
    A: 有効期限の30日前まで
    B: 有効期限の6ヶ月前まで
    C: 有効期限の12ヶ月前まで
    D: 有効期限の24ヶ月前まで
  answer: D
  explanation: 米国市民または合法的永住資格を持つ個人は、運転免許証または身分証明書の有効期限が切れる24ヶ月前まで更新手続きを行うことができます。
- id: 102
  category: driver_testing
  question: 21歳以上で、運転記録に6点以上の有効な違反点数がある場合、運転免許証を更新するために何が必要ですか？
  choices:
    A: 実技試験を受ける必要がある
    B: 知識試験（学科試験）を受ける必要がある
    C: ドライバー安全プログラムを修了する必要がある
    D: 更新料を2倍支払う必要がある
  answer: B
  explanation: 21歳以上で、運転記録に6点以上の有効な違反点数がある場合、運転免許証を更新するには知識試験を受ける必要があります。
- id: 103
  category: license_system
  question: 米軍に従事しており、インディアナ州外に一時的に居住している場合、除隊後、運転免許証はいつまで有効ですか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 180日間
  answer: C
  explanation: 運転免許証は、除隊、配属解除、または軍務によるインディアナ州外への一時的な居住が終了してから90日間有効です。
- id: 104
  category: driver_responsibility
  question: 主たる住所を変更した後、何日以内にBMVに通知し、修正された証明書（免許証）を申請しなければなりませんか？
  choices:
    A: 10日以内
    B: 15日以内
    C: 30日以内
    D: 60日以内
  answer: C
  explanation: インディアナ州の証明書を保持している場合、主たる（法的）住所を変更してから30日以内に、BMVに住所変更を通知し、修正された証明書を申請しなければなりません。
- id: 105
  category: license_system
  question: 運転免許証の氏名を正式に変更するためにBMVの支局を訪れる前に、何をしなければなりませんか？
  choices:
    A: オンラインで車両登録の氏名を変更する
    B: 社会保障局（SSA）の事務所を訪れ、少なくとも1営業日待つ
    C: BMVコネクト・キオスクで郵送先住所を更新する
    D: ドライバー安全プログラムを修了する
  answer: B
  explanation: まず社会保障局（Social Security Administration）の事務所を訪れて社会保障書類の氏名を正式に変更する必要があります。その後、氏名変更の手続きが完了してから少なくとも1営業日待ってから、BMVの支局を訪れる必要があります。
- id: 106
  category: penalties_and_points
  question: 制限速度を時速16マイルから25マイル超過して走行した場合、運転記録に何点の違反点数が加算されますか？
  choices:
    A: 2点
    B: 4点
    C: 6点
    D: 8点
  answer: B
  explanation: 違反点数表によると、制限速度を時速16〜25マイル超過した場合は4点が加算されます。
- id: 107
  category: penalties_and_points
  question: インディアナ州の運転記録において、違反点数はいつまで有効ですか？
  choices:
    A: 有罪判決日から1年間
    B: 有罪判決日から2年間
    C: 有罪判決日から3年間
    D: 有罪判決日から5年間
  answer: B
  explanation: 違反点数は、有罪判決日（確定日）から2年間、運転記録上で有効なまま残ります。
- id: 108
  category: defensive_driving
  question: インディアナ州のドライバーがBMV承認のドライバー安全プログラム（DSP）を修了した場合、何点のクレジット（減点措置）を受けることができますか？
  choices:
    A: 2点のクレジット
    B: 3点のクレジット
    C: 4点のクレジット
    D: 6点のクレジット
  answer: C
  explanation: インディアナ州のドライバーは、BMV承認のプロバイダーによるDSPコースを修了することで、4点のクレジットを受けることができます。
- id: 109
  category: penalties_and_points
  question: 21歳以上のドライバーが12ヶ月以内に何回以上の交通違反で有罪判決を受けた場合、BMVはドライバー安全プログラム（DSP）の受講を義務付けることがありますか？
  choices:
    A: 2回以上
    B: 3回以上
    C: 4回以上
    D: 5回以上
  answer: A
  explanation: BMVは、12ヶ月以内に2回以上の交通違反で有罪判決を受けた21歳以上のドライバーに対し、BMV承認のDSPコースの修了を義務付けることがあります。
- id: 110
  category: driver_responsibility
  question: インディアナ州における1件の事故あたりの財物損害に対する州の最低保険基準はいくらですか？
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: 州の最低保険基準には、1件の事故あたりの財物損害に対する25,000ドルが含まれています。これは一般的に「25/50/25」賠償責任保険の一部として知られています。
- id: 111
  category: driver_responsibility
  question: BMVが賠償責任の証明を求めた場合、保険会社から法令遵守証明書（COC）を電子的に受け取る必要があるのは何日以内ですか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: D
  explanation: COCは、BMVが賠償責任の確認依頼を郵送してから90日以内に、保険会社から電子的に受領され、BMVによって処理される必要があります。
- id: 112
  category: penalties_and_points
  question: 免許停止中の運転、または路上での速度競合（レース）に参加した場合、何ポイントが科せられますか？
  choices:
    A: 4ポイント
    B: 6ポイント
    C: 8ポイント
    D: 10ポイント
  answer: C
  explanation: マニュアルでは、「免許停止中の運転」と「路上での速度競合」の両方を8ポイントの違反として記載しています。
- id: 113
  category: license_system
  question: BMVの支局へ行く必要があるまでに、オンラインで免許証（証明書）の再発行ができる最大回数は何回ですか？
  choices:
    A: 3回
    B: 5回
    C: 10回
    D: 15回
  answer: C
  explanation: 免許証の再発行のためにBMVの支局へ行く必要があるまでに、オンラインで最大10回まで再発行の手続きを行うことができます。
- id: 114
  category: driver_responsibility
  question: インディアナ州における自動車賠償責任保険の最低補償額はいくらですか？
  choices:
    A: 20/40/20
    B: 25/50/25
    C: 50/100/50
    D: 10/25/10
  answer: B
  explanation: マニュアルには、州の最低自動車賠償責任補償額は25/50/25であると記載されています。
- id: 115
  category: penalties_and_points
  question: BMVが賠償責任の確認依頼を郵送した後、保険会社が法令遵守証明書（COC）を電子的に処理するために与えられる期間は何日ですか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 120日
  answer: C
  explanation: COCは、BMVが賠償責任の確認依頼を郵送してから90日以内に、保険会社から電子的に受領され、BMVによって処理される必要があります。
- id: 116
  category: driver_responsibility
  question: SR22フォームの目的は何ですか？
  choices:
    A: 交通事故をBMVに報告するため
    B: 将来の賠償責任の証明を示すため
    C: 既存の保険契約を解約するため
    D: 社用車を登録するため
  answer: B
  explanation: インディアナ州法では、運転免許の効力を回復させるために、保険会社を通じてSR22フォームによる将来の賠償責任の証明を電子的に提出することが義務付けられています。
- id: 117
  category: penalties_and_points
  question: SR22の提出が義務付けられている期間中に、BMVが保険会社からSR26通知を受け取った場合、どうなりますか？
  choices:
    A: 有効なSR22が受理されるか、義務期間が終了するまで、運転免許が停止されます。
    B: 保険料が減額されます。
    C: 運転技能試験の再受験が求められます。
    D: 車両登録が永久に抹消されます。
  answer: A
  explanation: BMVがSR26（SR22保険の解約）通知を受け取った場合、インディアナ州法に基づき、BMVは有効なSR22保険が受理されるか、SR22の義務期間が終了するまで、運転免許を停止しなければなりません。
- id: 118
  category: penalties_and_points
  question: 2015年1月1日以降に発生した、最初の無保険による免許停止に対する免許効力回復手数料はいくらですか？
  choices:
    A: $150
    B: $225
    C: $250
    D: $500
  answer: C
  explanation: 2015年1月1日以降に発生した最初の無保険による免許停止の効力回復手数料は250ドルです。
- id: 119
  category: penalties_and_points
  question: 運転者は、無保険による免許効力回復手数料を支払わずに、どのようにして運転免許の効力を回復させることができますか？
  choices:
    A: 安全運転講習を受講することによって
    B: 将来の賠償責任の証明（SR22）を提出し、それを180日間継続して維持することによって
    C: 元の交通違反切符の罰金を全額支払うことによって
    D: BMVに異議申し立ての手紙を書くことによって
  answer: B
  explanation: 運転者は、保険会社に将来の賠償責任の証明（SR22フォーム）を電子的に提出させ、そのSR22を180日間継続して維持することで、無保険による免許効力回復手数料を支払うことなく運転免許の効力を回復させることができます。
- id: 120
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）がどの法的制限値を超えると、車両の運転は刑事罰の対象となりますか？
  choices:
    A: '.04'
    B: '.06'
    C: '.08'
    D: '.10'
  answer: C
  explanation: 酒気帯び状態、または法的制限値（.08）を超える血中アルコール濃度（BAC）で車両を運転することは刑事罰の対象となります。
- id: 121
  category: alcohol_drugs_health
  question: 個人の血中アルコール濃度（BAC）を決定する主な要因として挙げられているのは、次のうちどれですか？
  choices:
    A: 個人の身長
    B: 摂取したアルコールの種類
    C: 個人の体重
    D: 飲酒前に食べた食事の量
  answer: C
  explanation: 個人の血中アルコール濃度（BAC）を決定する主な要因は、アルコールの摂取量、摂取速度、および個人の体重です。
- id: 122
  category: penalties_and_points
  question: アルコールの化学検査（薬物検査）に不合格となった運転者に対する罰則は何ですか？
  choices:
    A: 90日間の運転免許停止
    B: 180日間の運転免許停止
    C: 1年間の運転免許停止
    D: 2年間の運転免許停止
  answer: B
  explanation: 化学検査に不合格となった運転者は、180日間の運転免許停止処分を受けます。
- id: 123
  category: penalties_and_points
  question: 運転者が化学検査の受検を拒否した場合、運転免許はどのくらいの期間停止されますか？
  choices:
    A: 180日間
    B: 1年間
    C: 2年間
    D: 3年間
  answer: B
  explanation: 化学検査の受検を拒否した運転者は、1年間の運転免許停止処分を受けます。
- id: 124
  category: alcohol_drugs_health
  question: イグニッション・インターロック装置（酒気帯び運転防止装置）の機能は何ですか？
  choices:
    A: 法執行機関のために車両の速度と位置を追跡する。
    B: 車を始動させる前に、運転者の血中アルコール濃度を機械的に検査する。
    C: 衝突事故の際に緊急サービスに自動的に連絡する。
    D: 車両が指定速度制限を超えないように制限する。
  answer: B
  explanation: 裁判所は、車を始動させる前に運転者の血中アルコール濃度を機械的に検査するイグニッション・インターロック装置の設置を命じることがあります。
- id: 125
  category: alcohol_drugs_health
  question: 酔った状態で船舶を操縦したことによる有罪判決は、運転記録にどのように影響しますか？
  choices:
    A: 自動車の運転記録には影響しない。
    B: 警告書は届くが、免許停止にはならない。
    C: BMV（車両管理局）に送付され、運転記録の一部となる。
    D: 船舶免許にのみ影響し、運転免許には影響しない。
  answer: C
  explanation: 酔った状態での船舶操縦による有罪判決はBMVに送付され、その判決は運転記録の一部となります。
- id: 126
  category: penalties_and_points
  question: 裁判所が親の養育費支払いの滞納を認めた場合、BMV（車両管理局）はどのような措置を取ることができますか？
  choices:
    A: 滞納している親の運転免許を直ちに停止する。
    B: 親の車両を没収する。
    C: 親の車両登録料を2倍にする。
    D: 親に運転技能試験の再受験を義務付ける。
  answer: A
  explanation: 裁判所が親の養育費支払いの滞納を認めた場合、BMVに対してその親の運転免許を直ちに停止するよう命じることがあります。
- id: 127
  category: penalties_and_points
  question: サービスや手数料のためにBMV（車両管理局）に支払った内容が受理されなかった場合（不渡り小切手など）、どうなりますか？
  choices:
    A: 30日以内に支払うよう警告書が届く。
    B: 運転免許が無期限で停止される。
    C: 社会奉仕活動を義務付けられる。
    D: 車両が押収される。
  answer: B
  explanation: サービスや手数料のためにBMVに支払った内容が受理されなかった場合、BMVは運転免許を無期限で停止します。
- id: 128
  category: driver_responsibility
  question: IN.gov/BMVでオンラインで自分の運転記録を確認するのにいくらかかりますか？
  choices:
    A: 1回の閲覧につき5ドル
    B: 年間10ドル
    C: 無料
    D: 公認の写し1通につき15ドル
  answer: C
  explanation: 最初の手段として、IN.gov/BMVでいつでも無料で自分の運転記録を確認することができます。
- id: 129
  category: license_system
  question: インディアナ州で公式運転記録（Official Driver Record）を購入する費用はいくらですか？
  choices:
    A: 無料
    B: $4
    C: $10
    D: $15
  answer: B
  explanation: マニュアルによると、公式運転記録は4ドルで購入できます。
- id: 130
  category: penalties_and_points
  question: 裁判所から免許再交付の情報を受け取った後、BMV（車両管理局）が処理を完了するまでに通常どのくらいの時間がかかりますか？
  choices:
    A: 最大48時間
    B: 最大5営業日
    C: 最大10営業日
    D: 最大30日間
  answer: C
  explanation: 裁判所から再交付の情報を受け取った後、BMVによる処理には最大10営業日かかる場合があります。
- id: 131
  category: license_system
  question: 閲覧用運転記録（Viewable Driver Record）について、正しいものはどれですか？
  choices:
    A: 閲覧には4ドルかかります。
    B: 雇用主向けの公式な証明書として使用できます。
    C: 印刷することはできず、公式な証明書として使用すべきではありません。
    D: BMV Connectキオスクでのみ利用可能です。
  answer: C
  explanation: 閲覧用運転記録（Viewable Driver Record）は印刷することができず、運転記録の公式な証明書として使用してはいけません。
- id: 132
  category: penalties_and_points
  question: 常習的交通違反者（HTV）法のセクションAに基づき、10年以内に飲酒運転による死亡事故（operating a motor vehicle
    while intoxicated resulting in death）で2回の判決を受けた場合、運転免許の効力はどのくらいの期間停止されますか？
  choices:
    A: 5年
    B: 10年
    C: 15年
    D: 生涯
  answer: D
  explanation: 10年以内に飲酒運転による死亡事故で2回の判決を受けたドライバーは、運転免許が生涯停止されます。
- id: 133
  category: penalties_and_points
  question: 10年以内に無謀運転やドラッグレースなどの重大な違反を3回犯したドライバーは、どのくらいの期間の免許停止処分を受けますか？
  choices:
    A: 3年
    B: 5年
    C: 10年
    D: 生涯
  answer: C
  explanation: セクションBに基づき、10年以内にリストに記載された重大な違反を3回犯したドライバーは、10年間の免許停止処分を受けます。
- id: 134
  category: penalties_and_points
  question: 10年以内に、少なくとも1回の重大な違反を含む10回以上の交通違反を犯したドライバーに対する罰則は何ですか？
  choices:
    A: 1年間の停止
    B: 5年間の停止
    C: 10年間の停止
    D: 生涯停止
  answer: B
  explanation: セクションCに基づき、10年以内に10回以上の交通違反（そのうち1回は重大な違反）を犯した常習的交通違反者（HTV）は、5年間の免許停止処分の対象となります。
- id: 135
  category: license_system
  question: インディアナ州の運転免許証における「制限事項5（Restriction 5）」は何を示していますか？
  choices:
    A: ドライバーは矯正レンズを着用しなければならない。
    B: ドライバーは日中の運転のみに制限される。
    C: ドライバーは、困窮時、保護観察付き、条件付き、または特殊運転特権を認められている。
    D: ドライバーはイグニッションインターロック装置を装備した車両を運転しなければならない。
  answer: C
  explanation: 「制限事項5」は、裁判所の命令により、困窮時（hardship）、保護観察付き（probationary）、条件付き（conditional）、または特殊運転特権（specialized
    driving privileges）を認められた人の免許証に記載されます。
- id: 136
  category: license_system
  question: 裁判所から特殊運転特権（specialized driving privileges）を認められた人に求められる要件は次のうちどれですか？
  choices:
    A: 有効なSR22（保険証明書）をBMVに登録し続けること。
    B: 6ヶ月ごとに安全運転講習を修了すること。
    C: マニュアル車のみを運転すること。
    D: 有効な免許証をBMVに返納すること。
  answer: A
  explanation: 特殊運転特権を認められた人は、その特権の有効期間中、有効なSR22をBMVに登録し続けなければなりません。
- id: 137
  category: signs_and_signals
  question: 茶色の交通標識はどのような情報を示していますか？
  choices:
    A: 一時的な交通状況
    B: 道路サービスと施設
    C: 付近のレクリエーションおよび文化施設
    D: 許可された進行方向
  answer: C
  explanation: 茶色の交通標識は、州立公園などの付近のレクリエーションおよび文化施設を示しています。
- id: 138
  category: signs_and_signals
  question: 次の出口にある施設（アメニティ）に関する情報を表示する交通標識の背景色は何色ですか？
  choices:
    A: 緑
    B: 青
    C: 白
    D: オレンジ
  answer: B
  explanation: 青色の交通標識は、次の出口にある施設などの道路サービスや情報を表示します。
- id: 139
  category: signs_and_signals
  question: 高速道路の工事など、一時的な交通状況をドライバーに警告する交通標識には何色が使用されますか？
  choices:
    A: 黄色
    B: 赤
    C: オレンジ
    D: 茶色
  answer: C
  explanation: オレンジ色の交通標識は、多くの場合、高速道路の建設や保守プロジェクトによる一時的な交通状況をドライバーに警告します。
- id: 140
  category: signs_and_signals
  question: 白色の交通標識は通常何を表示していますか？
  choices:
    A: 速度制限などの交通規制
    B: 特定の道路上の危険に対する警告
    C: 付近の病院への道順
    D: レクリエーションおよび文化施設
  answer: A
  explanation: 白色の交通標識は、ドライバーが遵守しなければならない速度制限などの交通規制や、州道の標識などの役立つ情報を表示します。
- id: 141
  category: signs_and_signals
  question: 「路面濡れ時スリップ注意（Slippery When Wet）」の標識は、特定の道路状況に対してドライバーに注意を促す標識の一例です。この標識の背景色は何色ですか？
  choices:
    A: 赤
    B: オレンジ
    C: 黄色
    D: 緑
  answer: C
  explanation: 黄色または蛍光黄緑色の標識は、前方の特定の道路状況や危険に対してドライバーに注意を促します。「路面濡れ時スリップ注意」の標識は、背景が黄色の交通標識の一例です。
- id: 142
  category: signs_and_signals
  question: 赤色の交通標識はドライバーに何を伝えていますか？
  choices:
    A: 許可された動きや案内
    B: 安全への脅威を避けるために即時の行動を必要とする交通規制
    C: 近くのスクールゾーンや歩行者横断歩道
    D: 工事による一時的な道路状況
  answer: B
  explanation: 赤色の交通標識は、「進入禁止（Wrong Way）」の標識のように、交通の安全に対する脅威を避けるためにドライバーが即時の行動をとることを義務付ける交通規制を伝えています。
- id: 143
  category: penalties_and_points
  question: 常習的交通違反者法（Habitual Traffic Violator laws）のセクションAにおいて、2回の判決が重なると10年間の免許停止処分につながる可能性がある重大な違反は次のうちどれですか？
  choices:
    A: 10年間で9回のスピード違反
    B: 自動車の運転に起因する無謀運転致死
    C: 免許停止中の運転
    D: 方向指示器の使用不履行
  answer: B
  explanation: 自動車の運転に起因する無謀運転致死は、負傷または死亡に至る重大な違反としてセクションAに記載されています。
- id: 144
  category: signs_and_signals
  question: 蛍光黄緑色の交通標識は、ドライバーに何を警告していますか？
  choices:
    A: 高速道路の工事区域
    B: 近くの学校、歩行者、および自転車
    C: この先の踏切
    D: 即時の行動を必要とする交通規制
  answer: B
  explanation: 蛍光黄緑色の標識は、近くの学校、歩行者、自転車、遊び場、およびスクールバスのルートをドライバーに警告します。
- id: 145
  category: signs_and_signals
  question: ペナント型（三角形の横向き）の交通標識はどこに設置され、何を示していますか？
  choices:
    A: 道路の右側に設置され、スクールゾーンを示す
    B: 対面通行の道路の左側に設置され、左側からの追い越し禁止を警告する
    C: 交差点に設置され、一時停止の義務を示す
    D: 踏切の手前に設置され、列車の接近を警告する
  answer: B
  explanation: ペナント型の交通標識は、対面通行の道路の左側に設置され、他の車両を左側から追い越さないようドライバーに警告します。
- id: 146
  category: signs_and_signals
  question: 円形の交通標識は、どのような種類の危険や状況をドライバーに知らせますか？
  choices:
    A: この先の踏切
    B: 滑りやすい路面状況
    C: この先の急カーブ
    D: 高速道路の工事区域
  answer: A
  explanation: 円形の交通標識は、この先に踏切があることをドライバーに知らせます。
- id: 147
  category: signs_and_signals
  question: 五角形の交通標識は、何に近づいていることを示していますか？
  choices:
    A: 一時停止が必要な交差点
    B: 譲れ（Yield）の交差点
    C: 子供が横断している可能性のある学校近くの区域
    D: 追い越し禁止区間
  answer: C
  explanation: 五角形の交通標識は、子供が道路を横断している可能性のある学校近くの区域に入ろうとしていることをドライバーに警告します。
- id: 148
  category: vehicle_information
  question: 低速車両マーク（slow-moving vehicle emblem）は、その車両が時速何マイルを超えて走行できないことを示していますか？
  choices:
    A: 時速15マイル
    B: 時速20マイル
    C: 時速25マイル
    D: 時速30マイル
  answer: C
  explanation: 低速車両マークは、中心部がオレンジ色の蛍光色で、縁が赤色の反射材になっており、時速25マイルを超えて走行できない低速車両であることを示しています。
- id: 149
  category: signs_and_signals
  question: 低速車両マーク（slow-moving vehicle emblem）は何色で構成されていますか？
  choices:
    A: 黄色の背景に黒の縁取り
    B: オレンジ色の蛍光色の中心部と赤色の反射材の縁取り
    C: 赤色の中心部と白色の反射材の縁取り
    D: 蛍光黄緑色の中心部と黒の縁取り
  answer: B
  explanation: 低速車両マークは、中心部がオレンジ色の蛍光色で、縁が赤色の反射材になっています。
- id: 150
  category: signs_and_signals
  question: オレンジ色の交通標識は一般的に何を示していますか？
  choices:
    A: ドライバー向けサービスやレクリエーションエリア
    B: 高速道路の工事および保守区域
    C: スクールゾーンや歩行者横断歩道
    D: 直ちに従わなければならない交通規制
  answer: B
  explanation: オレンジ色の高速道路工事用交通標識は、工事区域に近づく際に注意するようドライバーに警告します。
- id: 151
  category: safe_driving_rules
  question: 交差点に接近中、黄色の点灯信号に変わったが、安全に停止するには近すぎる場合はどうすべきですか？
  choices:
    A: 急ブレーキをかけて交差点内で停止する
    B: 赤信号になる前に通過できるよう加速する
    C: そのまま交差点を通過してよい
    D: 直ちに道路の右側に寄せて停車する
  answer: C
  explanation: 黄色の点灯信号は、優先権が終了することを意味します。交差点に接近しており、安全に停止できないほど近い場合は、そのまま通過を完了させることができます。
- id: 152
  category: safe_driving_rules
  question: 矢印のない青信号の交差点で左折する場合、一度に何台の車両が左折のために交差点内に進入できますか？
  choices:
    A: 入れるだけの台数
    B: 一度に1台のみ
    C: 一度に2台
    D: 信号が赤になるまで進入してはならない
  answer: B
  explanation: 矢印のない青信号の場合、交差点内が空いていれば左折のために進入できますが、一度に交差点内に入って左折待ちができるのは1台のみです。
- id: 153
  category: safe_driving_rules
  question: 右左折用の黄色点滅の矢印信号は何を意味しますか？
  choices:
    A: 自車に優先権があり、対向車は譲らなければならない
    B: 歩行者と対向車に道を譲った後でのみ、曲がることができる
    C: 完全に停止し、青色の矢印信号を待たなければならない
    D: その交差点は右左折禁止である
  answer: B
  explanation: 右左折用の黄色点滅の矢印信号は、歩行者や対向車に優先権を譲った後であれば、曲がることができることを意味します。
- id: 154
  category: safe_driving_rules
  question: 赤信号の交差点を左折することが許可されるのは、どのような条件の場合ですか？
  choices:
    A: 対面交通の道路から一方通行の道路へ曲がる場合
    B: 一方通行の道路から対面交通の道路へ曲がる場合
    C: 一方通行の道路から別の一方通行の道路へ曲がる場合
    D: 赤信号での左折は決して許可されない
  answer: C
  explanation: 一方通行の道路から別の一方通行の道路へ曲がる場合に限り、赤信号や赤の矢印信号であっても交差点を左折することができます。
- id: 155
  category: safe_driving_rules
  question: 赤信号での右折が許可されている場合、曲がる前に義務付けられていることは何ですか？
  choices:
    A: 曲がる前に時速5マイルまで減速する
    B: 完全に停止し、車両や歩行者がいないか確認する
    C: 交差する車両に警告するためにクラクションを鳴らす
    D: ハザードランプを点灯させる
  answer: B
  explanation: 赤信号や赤の矢印信号で右折が許可されている場合、まず完全に停止し、自車の進路や進路に入ろうとしている車両や歩行者がいないことを確認しなければなりません。
- id: 156
  category: signs_and_signals
  question: 矢印のない黄色の点滅信号がある交差点に接近したとき、どうすべきですか？
  choices:
    A: 完全に停止し、青信号を待つ
    B: 4方向一時停止（4-way stop）として扱う
    C: 減速し、注意して交差点を通過する
    D: 素早く交差点を抜けるために加速する
  answer: C
  explanation: 交差点での矢印のない黄色点滅信号は、減速し、注意して交差点を通過すべきであることを意味します。
- id: 157
  category: signs_and_signals
  question: 正三角形の交通標識は何を示していますか？
  choices:
    A: 減速し、必要に応じて完全に停止して道を譲る準備をするよう警告している
    B: この先にスクールゾーンがあることを示している
    C: この先に踏切があることを運転者に知らせている
    D: 追い越し禁止区間の始まりを示している
  answer: A
  explanation: 正三角形（3辺の長さが等しい）の標識は、交差点に接近する際に減速し、他の車両や歩行者に道を譲るために完全に停止する準備をするよう運転者に促すものです。
- id: 158
  category: signs_and_signals
  question: 一時停止標識（STOP）の下に取り付けられている補助板の目的は何ですか？
  choices:
    A: 交差する道路の制限速度を示すため
    B: 交差点のどの方向が停止義務があるかを示すため
    C: 近くのスクールゾーンを警告するため
    D: 次の町までの距離を示すため
  answer: B
  explanation: 一時停止標識の下には、交差点のどの方向に停止義務があるか（例：「All Way」など）を示すために補助板が設置されることがあります。
- id: 159
  category: signs_and_signals
  question: 交差点での矢印のない黄色点滅信号は何を意味しますか？
  choices:
    A: 停止して青信号を待つ
    B: 減速し、注意して交差点を通過する
    C: 自車に優先権があるため、減速する必要はない
    D: 信号機が故障しているため、4方向一時停止として扱う必要がある
  answer: B
  explanation: マニュアルによると、矢印のない黄色点滅信号は、減速して注意深く交差点を通過することを意味します。
- id: 160
  category: signs_and_signals
  question: 全車両が停止義務のある交差点で、あなたと別の運転者が同時に赤色点滅信号に到着した場合、どちらが優先権を譲らなければなりませんか？
  choices:
    A: 右側の車両
    B: 左側の車両
    C: より速く走行している車両
    D: 右折する車両
  answer: B
  explanation: マニュアルには、全車両が停止義務のある交差点に他の運転者と同時に到着した場合、左側の車両が優先権を譲らなければならない（右側の車両に優先権がある）と記されています。
- id: 161
  category: vehicle_information
  question: 二輪車を運転中、青に変わらない赤信号の点灯した交差点を通過できるのはどのような条件ですか？
  choices:
    A: 少なくとも2分間完全停止し、細心の注意を払った後。
    B: クラクションを鳴らして30秒待った後。
    C: 交通整理を行う警察官がいる場合のみ。
    D: 二輪車が赤信号を通過することは決して許されない。
  answer: A
  explanation: 信号機のある交差点に接近した二輪車または原動機付自転車の運転者は、少なくとも2分間完全停止し、細心の注意を払った場合、赤信号の点灯中であっても通過することができます。
- id: 162
  category: vehicle_information
  question: 二輪車が2分間待機した後に赤信号を通過できるという規則は、オートサイクル（autocycles）にも適用されますか？
  choices:
    A: はい、オートサイクルはすべての二輪車の規則に従います。
    B: はい、ただし2分ではなく3分待たなければなりません。
    C: いいえ、この規則はオートサイクルには適用されません。
    D: いいえ、オートサイクルはすべての赤信号を譲れ（yield）の標識として扱わなければなりません。
  answer: C
  explanation: マニュアルには、2分間待機することで赤信号での長時間の待ち時間を回避できるという規則は、オートサイクルには適用されないと明記されています。
- id: 163
  category: signs_and_signals
  question: 作動していない信号機のある交差点に接近した際、どのように進むべきですか？
  choices:
    A: 道路が空いていれば、停止せずに交差点を通過する。
    B: 交差点に入る前に停止し、先に到着した車両や右側の車両に道を譲る。
    C: 交差点を譲れ（yield）の標識として扱い、減速する。
    D: 交通整理のために警察官が到着するまで待つ。
  answer: B
  explanation: 作動していない信号機のある交差点に接近した場合は、進入前に停止し、交差する車両、先に停止した車両、右側から同時に到着した車両、および歩行者に道を譲った後、注意して進む必要があります。
- id: 164
  category: signs_and_signals
  question: 歩行者が歩行者用ハイブリッドビーコンを作動させた直後、ビーコンは何を表示しますか？
  choices:
    A: 赤色の点灯。
    B: 黄色の点滅。
    C: 黄色の点灯。
    D: 2つの赤色の点滅。
  answer: B
  explanation: 歩行者によって作動されると、歩行者用ハイブリッドビーコンは黄色の点滅を表示し、ドライバーが横断場所を通過できるようにします。
- id: 165
  category: safe_driving_rules
  question: 道路上の黄色の区画線は何を示していますか？
  choices:
    A: 同じ方向に進む複数の車線を区切っている。
    B: バスまたは公共交通機関専用車線であることを示している。
    C: 反対方向に進む複数の車線を区切っている。
    D: 歩行者横断ゾーンであることを示している。
  answer: C
  explanation: マニュアルによると、黄色の区画線は反対方向に進む複数の車線を区切っています。
- id: 166
  category: safe_driving_rules
  question: 他の車両を追い越す際、対向車の手前で道路の右側に戻るには、どの程度の距離を空ける必要がありますか？
  choices:
    A: 50フィート以上。
    B: 100フィート以上。
    C: 200フィート以上。
    D: 500フィート以上。
  answer: B
  explanation: 追い越しの際は、対向車から少なくとも100フィート以上の距離がある状態で、道路の右側に戻らなければなりません。
- id: 167
  category: defensive_driving
  question: 車線変更をする前に死角を確認するにはどうすればよいですか？
  choices:
    A: バックミラーだけに頼る。
    B: 入ろうとしている車線の方へ素早く頭を向けて確認する。
    C: クラクションを鳴らして死角にいる車両に警告する。
    D: ヘッドライトを2回点滅させる。
  answer: B
  explanation: 車線変更をする際は、死角に車両がいないことを確認するために、入ろうとしている車線の方へ素早く頭を向けて確認する必要があります。
- id: 168
  category: safe_driving_rules
  question: 次のうち、他の車両を追い越すことが危険であり違法となる状況はどれですか？
  choices:
    A: 黄色の破線がある道路を走行しているとき。
    B: 交差点、踏切、橋、高架橋、またはトンネルから100フィート以内のとき。
    C: 前方の車両が制限速度以下で走行しているとき。
    D: 白色の破線がある多車線道路のとき。
  answer: B
  explanation: 交差点、踏切、橋、高架橋、またはトンネルから100フィート以内で他の車両を追い越そうとすることは、危険であり違法です。
- id: 169
  category: sharing_the_road
  question: 他の車両があなたの道路の左側から追い越しをしている場合、どうすべきですか？
  choices:
    A: 追い越しを阻止するために速度を上げる。
    B: 相手をブロックするために左車線に移動する。
    C: 相手の車両が安全に追い越せるようにし、速度を上げない。
    D: 対向車を警告するためにクラクションを鳴らす。
  answer: C
  explanation: 他の車両が道路の左側からあなたを追い越している場合は、その車両が安全に通過できるようにし、速度を上げないでください。
- id: 170
  category: safe_driving_rules
  question: 右折の準備をする際の適切な車線位置はどこですか？
  choices:
    A: 進行方向の一番左側の車線。
    B: 中央車線。
    C: 進行方向の一番右側の車線。
    D: 方向指示器を出していれば、どの車線でもよい。
  answer: C
  explanation: 右折するには、進行方向の一番右側の車線にいる必要があります。
- id: 171
  category: signs_and_signals
  question: 黄色の自転車のシンボルが表示されている自転車用信号機は、自転車利用者に対して何を示していますか？
  choices:
    A: 優先通行権が終了すること。
    B: 注意して進むこと。
    C: 歩行者に道を譲ること。
    D: 自転車道が終了すること。
  answer: A
  explanation: 車両用信号と同様に、黄色の自転車用信号は優先通行権が終了することを意味します。
- id: 172
  category: signs_and_signals
  question: バスまたは公共交通機関専用レーンを制御し、バスまたは公共交通機関の運転手のみに適用される信号はどのようなものですか？
  choices:
    A: 黄色の三角形を表示する信号。
    B: 白色の長方形のバーを表示する信号。
    C: 赤色の点滅する円を表示する信号。
    D: 緑色の矢印を表示する信号。
  answer: B
  explanation: 白色の長方形のバーを表示する信号は、バスまたは公共交通機関専用レーンを制御し、バスまたは公共交通機関の運転手のみに適用されます。
- id: 173
  category: safe_driving_rules
  question: 停止線も横断歩道もない交差点で一時停止標識に近づく場合、どこで停止すべきですか？
  choices:
    A: 交差する道路の端。
    B: 交差点に入る前。
    C: 一時停止標識の10フィート手前。
    D: 交通状況を確認するために交差点の真ん中。
  answer: B
  explanation: 停止線も横断歩道もない場合は、交差点に入る前に完全に停止しなければなりません。
- id: 174
  category: driver_testing
  question: 運転技能試験中に手信号を使用することは許可されていますか？
  choices:
    A: はい、ただし灯火信号が故障している場合に限ります。
    B: はい、手信号は灯火信号よりも優先されます。
    C: いいえ、運転技能試験で手信号を使用することはできません。
    D: はい、曲がるかなり前から使用するのであれば可能です。
  answer: C
  explanation: マニュアルによると、運転技能試験で手信号を使用することはできません。
- id: 175
  category: safe_driving_rules
  question: 特別指定された中央車線の適切な使用方法は何ですか？
  choices:
    A: 低速車両の追い越し
    B: 左折のみ
    C: 右折のみ
    D: 緊急時の駐車
  answer: B
  explanation: 交通量の多い道路には、左折車両専用の中央車線が設けられていることがよくあります。この種の中央車線を他の車両の追い越しに使用してはいけません。
- id: 176
  category: safe_driving_rules
  question: Uターン（転回）が明確に禁止されている場所はどこですか？
  choices:
    A: 中央分離帯のあるUターン用交差点
    B: 郡道（County road）
    C: 州間高速道路（Interstate highway）
    D: 都市部の住宅街
  answer: C
  explanation: マニュアルには、州間高速道路でUターンをしてはならないと記載されています。代わりに、次の出口まで進み、反対方向の高速道路に入り直してください。
- id: 177
  category: safe_driving_rules
  question: 全方向一時停止（All-way stop）の交差点に2台の車両が同時に到着した場合、どちらの車両が優先権を譲らなければなりませんか？
  choices:
    A: 右側の車両
    B: 左側の車両
    C: 大きい方の車両
    D: 速く走行している車両
  answer: B
  explanation: 他のドライバーと同時に全方向一時停止標識に到着した場合、左側の車両が優先権を譲らなければなりません。
- id: 178
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）では、交通はどの方向に進みますか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 時計回りと反時計回りの両方
    D: 直線
  answer: B
  explanation: ラウンドアバウトは円形の交差点で、車両は右折のみで進入または流出し、反時計回りに進行します。
- id: 179
  category: sharing_the_road
  question: 2台の大型トラックが同時にラウンドアバウトに接近または走行している場合、どうしなければなりませんか？
  choices:
    A: 左車線の運転手が右車線の運転手に譲らなければならない。
    B: 右車線の運転手が左車線の運転手に譲らなければならない。
    C: 両方のトラックが停止し、警察官を待たなければならない。
    D: 重い荷物を積んでいるトラックに優先権がある。
  answer: B
  explanation: 2台の大型トラックが同時にラウンドアバウトに接近または走行している場合、右車線の運転手は左車線の運転手に優先権を譲らなければなりません。
- id: 180
  category: safe_driving_rules
  question: 地方部の州間高速道路における乗用車の最高速度制限は何マイルですか？
  choices:
    A: 時速55マイル
    B: 時速60マイル
    C: 時速65マイル
    D: 時速70マイル
  answer: D
  explanation: 地方部の州間高速道路では、乗用車は時速70マイルまたは掲示された速度制限を超えてはなりません。
- id: 181
  category: safe_driving_rules
  question: 路地（alley）における最高速度制限は何マイルですか？
  choices:
    A: 時速10マイル
    B: 時速15マイル
    C: 時速20マイル
    D: 時速25マイル
  answer: B
  explanation: 路地では、車両は時速15マイルまたは掲示されている速度制限を超えて走行してはなりません。
- id: 182
  category: defensive_driving
  question: 車間距離に関して、ドライバーが従うべき適切なルールは何ですか？
  choices:
    A: 前方の車両から少なくとも1秒の間隔を空ける
    B: 前方の車両から少なくとも2〜3秒の間隔を空ける
    C: 前方の車両から少なくとも4〜5秒の間隔を空ける
    D: 時速10マイルごとに、車1台分の車間距離を空ける
  answer: B
  explanation: ドライバーが従うべき適切なルールは、前方の車両から少なくとも2〜3秒の間隔を空けて走行することです。
- id: 183
  category: safe_driving_rules
  question: 工事現場の速度制限は、その区域に設定されている最高速度制限と比較してどのようになっていますか？
  choices:
    A: 設定されている最高速度制限よりも、少なくとも時速5マイル低く設定されている。
    B: 設定されている最高速度制限よりも、少なくとも時速10マイル低く設定されている。
    C: 設定されている最高速度制限よりも、少なくとも時速15マイル低く設定されている。
    D: 設定されている最高速度制限と同じである。
  answer: B
  explanation: 工事現場の速度制限は、常にその区域に設定されている最高速度制限よりも少なくとも時速10マイル低く設定されます。
- id: 184
  category: signs_and_signals
  question: トラフィックサークル（交通円環）はラウンドアバウトとどのように異なりますか？
  choices:
    A: トラフィックサークルは反時計回りの通行のみである。
    B: トラフィックサークルは常に信号機によって制御されている。
    C: トラフィックサークルは時計回りと反時計回りの通行がある場合があり、一時停止標識で制御されていることがある。
    D: トラフィックサークルは田舎道にのみ存在する。
  answer: C
  explanation: トラフィックサークルがラウンドアバウトと異なる点は、時計回りと反時計回りの両方の通行がある場合があること、および進入路が譲れ（yield）の標識ではなく一時停止（stop）の標識で制御されている場合があることです。
- id: 185
  category: defensive_driving
  question: 車両の停止能力に影響を与える要因は、次のうちどれですか？
  choices:
    A: 車両の色
    B: タイヤの種類と状態
    C: 時刻（時間帯）
    D: 車両の乗客数
  answer: B
  explanation: 車両の停止能力には、車両の重量、ブレーキとタイヤの種類と状態、路面の物理的状態や滑りやすさ、道路の勾配など、多くの要因が影響します。
- id: 186
  category: sharing_the_road
  question: 地方の州間高速道路（rural interstate highway）において、車両総重量が26,000ポンドを超えるトラックの最高速度制限は何マイルですか？
  choices:
    A: 時速55マイル
    B: 時速60マイル
    C: 時速65マイル
    D: 時速70マイル
  answer: C
  explanation: 地方の州間高速道路では、車両総重量が26,000ポンドを超えるトラックは、時速65マイルまたは掲示されている速度制限を超えて走行してはなりません。
- id: 187
  category: defensive_driving
  question: アンチロック・ブレーキ・システム（ABS）を搭載した車両がスリップし始めた場合、どうすべきですか？
  choices:
    A: ブレーキを素早く何度も踏む（ポンピングブレーキ）
    B: ブレーキペダルを一定の強い力で踏み続ける
    C: ブレーキを急激に踏み込み、ハンドルを急に切る
    D: 直ちにパーキングブレーキをかける
  answer: B
  explanation: アンチロック・ブレーキ・システム（ABS）を搭載している車両の場合は、通常通りハンドル操作を行いながら、ブレーキペダルを一定の強い力で踏み続けてください。ブレーキを何度も踏み直さないでください。
- id: 188
  category: defensive_driving
  question: 車両が路道から外れてしまった場合の適切な操作は何ですか？
  choices:
    A: 直ちに舗装路に戻るようにハンドルを切る
    B: ブレーキを急激に踏み、ハンドルを急に切る
    C: アクセルペダルを緩め、安全を確認してから徐々に路面に戻る
    D: 路面に戻る前に、トラクションを回復させるために加速する
  answer: C
  explanation: 車両が路道から外れてしまった場合は、すぐに舗装路に戻ろうとしないでください。アクセルペダルを緩め、安全を確認してから、徐々に道路に戻るようにしてください。
- id: 189
  category: vehicle_information
  question: 乗用車や軽トラックにおいて、時速75マイルでの走行は時速55マイルでの走行と比較して、燃料消費にどのような影響を与えますか？
  choices:
    A: 約10パーセント多く燃料を消費する
    B: 約25パーセント多く燃料を消費する
    C: 約50パーセント多く燃料を消費する
    D: 約75パーセント多く燃料を消費する
  answer: C
  explanation: 燃料消費量は時速45マイルを超えると着実に増加します。乗用車や軽トラックが時速75マイルで走行すると、時速55マイルで走行する場合よりも約50パーセント多く燃料を消費します。
- id: 190
  category: vehicle_information
  question: 車両の推奨タイヤ空気圧（psi）はどこで確認すべきですか？
  choices:
    A: タイヤのサイドウォール（側面）
    B: 運転席側のドア枠にあるステッカー、または取扱説明書
    C: 車両のナンバープレート
    D: エンジンブロック
  answer: B
  explanation: 測定した空気圧は、車両の運転席ドアの内側にあるステッカー、または取扱説明書に記載されている数値と比較してください。タイヤのサイドウォールに記載されている数値とは比較しないでください。
- id: 191
  category: vehicle_information
  question: タイヤの摩耗を確認するためにペニーテスト（1セント硬貨を使用したテスト）を行う際、溝が法的かつ安全な深さであることを示すのはどのような状態ですか？
  choices:
    A: リンカーンの頭が完全に見えている
    B: リンカーンの頭の一部が溝に隠れている
    C: 硬貨が溝から落ちる
    D: 溝の深さがちょうど1/32インチである
  answer: B
  explanation: リンカーンの頭の一部が溝に隠れていれば、法的かつ安全な量の溝が残っている状態で運転していることになります。
- id: 192
  category: safe_driving_rules
  question: 冬の天候下で、路面の他の部分よりも先に凍結しやすい場所はどこですか？
  choices:
    A: 交差点や横断歩道
    B: 田舎の未舗装路
    C: ランプ（接続路）、橋、高架橋
    D: 複数車線の高速道路
  answer: C
  explanation: ランプ、橋、高架橋の水分は、走行車線の他の部分よりも先に凍結する場合があることに注意してください。
- id: 193
  category: defensive_driving
  question: 濡れた路面で車両がハイドロプレーニング現象を起こす原因は何ですか？
  choices:
    A: 油、泥、水が混ざった薄い層の上を走行すること
    B: 空気圧が高すぎるタイヤで走行すること
    C: 雨の中でヘッドライトをハイビームにすること
    D: ブレーキを頻繁に踏みすぎること
  answer: A
  explanation: 濡れた路面を走行しているとき、車両は実際には油、泥、水が混ざった薄い層の上を走行しており、これがハイドロプレーニング現象につながる可能性があります。
- id: 194
  category: defensive_driving
  question: 水たまりを走行した後、ブレーキを乾かすために何をすべきですか？
  choices:
    A: 急加速する
    B: 低いギアにシフトダウンする
    C: ブレーキを数回踏んでテストする
    D: パーキングブレーキを数秒間かける
  answer: C
  explanation: 水たまりを走行した後は、ブレーキを数回踏んでテストしてください。そうすることでブレーキを乾かすことができます。
- id: 195
  category: safe_driving_rules
  question: 霧の中を走行する際、ヘッドライトはどの設定にすべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: パーキングライト（車幅灯）のみ
    D: ヘッドライトは点灯せず、非常点滅表示灯（ハザード）のみ
  answer: B
  explanation: ハイビームは使用しないでください。ロービームの方が、前方の道路や物体をより適切に照らします。
- id: 196
  category: defensive_driving
  question: 冠水した場所で車両がエンストした場合、最も安全な行動は何ですか？
  choices:
    A: 車内にとどまり救助を待つ
    B: 窓を閉めてドアをロックする
    C: できるだけ早く車両を離れる
    D: 繰り返しエンジンを再始動しようとする
  answer: C
  explanation: 冠水した場所で車がエンストした場合は、できるだけ早く車を離れてください。洪水は急速に増水し、車や乗員を押し流す可能性があるためです。
- id: 197
  category: defensive_driving
  question: 夜間の運転中、対向車のヘッドライトの眩しさを避けるにはどうすればよいですか？
  choices:
    A: 対向車のヘッドライトを直視する
    B: 道路の右側に視線を集中させる
    C: 眩しさに対抗するためにハイビームをつける
    D: 車両が通り過ぎるまで片目を閉じる
  answer: B
  explanation: 眩しさを避けるために、接近してくる車両のライトを直視せず、代わりに道路の右側に視線を集中させてください。
- id: 198
  category: safe_driving_rules
  question: 運転者がヘッドライトを使用しなければならないのはいつですか？
  choices:
    A: 午後10時から午前6時の間のみ
    B: 日没から日の出まで、または視界が500フィート未満のとき
    C: 街灯のない田舎道を走行するときのみ
    D: 日の出から日没まで、または視界が1,000フィート未満のとき
  answer: B
  explanation: 運転者は、日没から日の出までの間、および視界が500フィート未満のときはいつでもヘッドライトを使用しなければなりません。
- id: 199
  category: safe_driving_rules
  question: ヘッドライトをロービームに切り替えなければならないのはどのような場合ですか？
  choices:
    A: 対向車から500フィート以内、または他車の後方200フィート以内に近づいたとき
    B: 対向車から1,000フィート以内、または他車の後方500フィート以内に近づいたとき
    C: 対向車から200フィート以内、または他車の後方100フィート以内に近づいたとき
    D: 市街地を走行しているときのみ
  answer: A
  explanation: ヘッドライトを点灯している際、対向車から500フィート以内に近づく場合、または他車の後方200フィート以内を走行する場合は、ロービームを使用しなければなりません。
- id: 200
  category: vehicle_information
  question: マニュアルによると、車両の横転の可能性を減らすために最も重要な要因は何ですか？
  choices:
    A: 田舎道を完全に避けること
    B: タイヤを適切にメンテナンスすること
    C: 重心の低い車両を運転すること
    D: 時速45マイル以上で運転しないこと
  answer: B
  explanation: 空気圧が不適切であったり摩耗したりしたタイヤは、車両のコントロールを維持する能力を損ないます。このコントロールの維持こそが、横転の可能性を減らすために最も重要な要因です。
- id: 201
  category: safe_driving_rules
  question: インディアナ州法によると、ドライバーはいつヘッドライトを使用しなければなりませんか？
  choices:
    A: 日没から日の出まで、または視界が500フィート未満のとき
    B: 街灯のない田舎道を走行するときのみ
    C: 午後8時から午前6時までの間
    D: 時速55マイル以上で走行するときはいつでも
  answer: A
  explanation: ドライバーは、日没から日の出までの間、および視界が500フィート未満のときは常にヘッドライトを使用しなければなりません。
- id: 202
  category: safe_driving_rules
  question: 他の車両の後方を走行する場合、どのくらいの距離でヘッドライトをロービームに切り替えなければなりませんか？
  choices:
    A: 100フィート以内
    B: 200フィート以内
    C: 300フィート以内
    D: 500フィート以内
  answer: B
  explanation: 対向車に500フィート以内に近づくとき、または前走車の後方200フィート以内に続くときは、ヘッドライトをロービームに切り替えなければなりません。
- id: 203
  category: alcohol_drugs_health
  question: 研究によると、18時間眠らずに過ごしたドライバーは、血中アルコール濃度（BAC）がどのレベルのドライバーと同程度に判断能力が低下するとされていますか？
  choices:
    A: '.04'
    B: '.06'
    C: '.08'
    D: '.10'
  answer: C
  explanation: 研究により、18時間眠らずに運転することは、法定飲酒制限値である血中アルコール濃度（BAC）0.08%のドライバーと同程度に判断能力が低下することが示されています。
- id: 204
  category: driver_responsibility
  question: 疲労に関連した事故の64%を占め、最もリスクが高い年齢層はどれですか？
  choices:
    A: 16-29歳
    B: 30-45歳
    C: 46-60歳
    D: 61歳以上
  answer: A
  explanation: 十分な休息をとらずに運転するという致命的な過ちは誰にでも起こり得ますが、16歳から29歳の若年層が最もリスクが高く、疲労関連事故の64%を占めています。
- id: 205
  category: safe_driving_rules
  question: インディアナ州で自動車の運転中に手持ち式の通信機器を使用することが法的に認められる唯一の例外は何ですか？
  choices:
    A: GPSナビゲーションマップを確認する場合
    B: 緊急のテキストメッセージを読む場合
    C: 正当な緊急事態のために911に通報する場合
    D: 赤信号で停車中に電話をかける場合
  answer: C
  explanation: この禁止事項の唯一の例外は、ハンズフリー通信が有効な場合、または正当な緊急事態のために通信機器を使用して911に通報する場合です。
- id: 206
  category: defensive_driving
  question: テキストメッセージの送信や確認を行うと、5秒間道路から目を離すことになります。時速55マイルで走行している場合、これは目隠しをしてどのくらいの距離を運転するのと同等ですか？
  choices:
    A: バスケットボールコートの長さ
    B: フットボール場全体の長さ
    C: 丸1マイル
    D: 500フィート
  answer: B
  explanation: テキストメッセージの送信や確認のために5秒間道路から目を離すと、時速55マイルでは、目隠しをしたままフットボール場全体の長さを走行するのと同じ距離になります。
- id: 207
  category: penalties_and_points
  question: インディアナ州法において、一連の継続的な運転中に少なくともいくつの特定の不安全な行為を行った場合、あおり運転（アグレッシブ・ドライビング）とみなされますか？
  choices:
    A: 2つ
    B: 3つ
    C: 4つ
    D: 5つ
  answer: B
  explanation: インディアナ州法によると、一連の継続的な運転中に、特定の不安全な行為のうち少なくとも3つを行った場合、あおり運転（アグレッシブ・ドライビング）とみなされます。
- id: 208
  category: defensive_driving
  question: 砂利道で停車や旋回がより困難なのはなぜですか？
  choices:
    A: 砂利道は通常、舗装路よりも幅が広いため
    B: トラクション（摩擦力）が低下し、スリップしやすくなるため
    C: 砂利道は常に制限速度が高いため
    D: 砂埃で道路の視界が完全に遮られるため
  answer: B
  explanation: 砂利道ではトラクションが低下するため、停車や旋回がより困難になります。トラクションが低下すると、スリップが発生しやすくなります。
- id: 209
  category: safe_driving_rules
  question: 田舎道で急な丘の頂上に近づく前に何をすべきですか？
  choices:
    A: 勢いを維持するために加速する
    B: 道路の左側に移動する
    C: 継続的にクラクションを鳴らす
    D: 減速し、道路の右側に寄り、対向車に注意する
  answer: D
  explanation: 急な丘の頂上に近づく前には、減速して道路の右側に寄り、対向車に注意してください。
- id: 210
  category: safe_driving_rules
  question: 州間高速道路で目的の出口を通り過ぎてしまった場合、どうしなければなりませんか？
  choices:
    A: 停車し、路肩を慎重にバックする
    B: 中央分離帯を越えてUターンする
    C: 次の出口まで走行する
    D: 右車線で停車し、交通が途切れるのを待ってから後退する
  answer: C
  explanation: 通り過ぎた出口に戻るために州間高速道路上でバックするのは危険です。出口を通り過ぎた場合は、次の出口まで走行しなければなりません。
- id: 211
  category: sharing_the_road
  question: 片側3車線以上の州間高速道路において、トラックの走行が制限されているのはどの車線ですか？
  choices:
    A: 左側の2車線
    B: 中央車線のみ
    C: 右側の2車線
    D: 任意の車線
  answer: C
  explanation: トラックは、片側2車線の州間高速道路では右側車線に、片側3車線以上の州間高速道路では右側の2車線に走行が制限されています。
- id: 212
  category: signs_and_signals
  question: 工事区域において、方向を指し示していない点滅する矢印板は何を意味しますか？
  choices:
    A: 直ちに左車線に移動しなければならない
    B: 直ちに右車線に移動しなければならない
    C: 注意を促す信号であるが、車線変更は必要ない
    D: この先、道路が完全に閉鎖されている
  answer: C
  explanation: どちらの方向も示していない点滅する矢印板は、注意を促す信号ですが、運転者に車線変更を要求するものではありません。
- id: 213
  category: signs_and_signals
  question: 工事現場の交通整理員が、蛍光オレンジまたは赤色の旗を交通路に対して水平に突き出しているとき、どうしなければなりませんか？
  choices:
    A: 現在の速度で進む
    B: 停止する
    C: 左車線に移動する
    D: クラクションを鳴らしてゆっくり進む
  answer: B
  explanation: 交通整理員が蛍光オレンジまたは赤色の旗を交通路に対して水平に突き出しているときは、停止しなければなりません。
- id: 214
  category: safe_driving_rules
  question: スクールバスなどの特定の車両は、踏切の最も近いレールからどのくらいの距離で停止しなければなりませんか？
  choices:
    A: 10フィート以上30フィート以内
    B: 15フィート以上50フィート以内
    C: 20フィート以上100フィート以内
    D: 正確に25フィート
  answer: B
  explanation: 法律により、特定の車両は踏切の最も近いレールから15フィート（約4.5メートル）以上50フィート（約15メートル）以内の場所で常に停止することが義務付けられています。
- id: 215
  category: signs_and_signals
  question: 踏切警標（クロバック標識）が単独で設置されている場合、どのように扱うべきですか？
  choices:
    A: 一時停止標識として扱う
    B: 譲れ（Yield）標識として扱う
    C: 制限速度標識として扱う
    D: 行き止まりの警告として扱う
  answer: B
  explanation: 単独で設置されている場合、踏切警標は「譲れ（Yield）」標識として扱い、停止するか線路を渡るかの判断は運転者に委ねられます。
- id: 216
  category: signs_and_signals
  question: 単独の踏切警標がある踏切に近づく際、どうすべきですか？
  choices:
    A: 列車の接近に関わらず、完全に停止する
    B: 譲れ（Yield）標識として扱い、列車が接近している場合は停止する
    C: できるだけ早く線路を通過するために加速する
    D: クラクションを鳴らし、減速せずに進む
  answer: B
  explanation: 単独で設置されている場合、踏切警標は「譲れ（Yield）」標識として扱います。列車が接近している場合は停止しなければなりません。
- id: 217
  category: safe_driving_rules
  question: 次のうち、すべての踏切で停止が義務付けられている車両はどれですか？
  choices:
    A: 営業用のすべての旅客輸送車両
    B: すべてのピックアップトラック
    C: すべての乗用車
    D: すべてのオートバイ
  answer: A
  explanation: すべての踏切で停止が義務付けられている車両には、営業用のすべての旅客輸送車両、すべてのスクールバス、および爆発物や引火性液体を運ぶすべての車両が含まれます。
- id: 218
  category: safe_driving_rules
  question: 踏切から何フィート以内で他車を追い越すことは違法ですか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: マニュアルには、踏切から100フィート（約30メートル）以内で他車を追い越してはならないと記載されています。
- id: 219
  category: defensive_driving
  question: 線路上で車両が立ち往生し、列車が接近している場合、避難した後はどの方向に走るべきですか？
  choices:
    A: 線路から45度の角度で、近づいてくる列車に向かう方向
    B: 列車から遠ざかるように線路に沿って真っ直ぐ
    C: 線路から真横に90度の角度
    D: 線路から45度の角度で、列車が進むのと同じ方向
  answer: A
  explanation: 線路上で立ち往生した場合は、そのエリアから避難し、線路から45度の角度で、近づいてくる列車に向かう方向に走ってください（衝突による破片から身を守るため）。
- id: 220
  category: safe_driving_rules
  question: 踏切の警報灯が点滅し始め、遮断機が下がり始めてから、踏切から脱出するまでに約何秒の猶予がありますか？
  choices:
    A: 10秒
    B: 20秒
    C: 30秒
    D: 45秒
  answer: B
  explanation: 踏切の警報灯が点滅し始め、遮断機が下がり始めてから、列車が到達するまで約20秒の猶予があります。
- id: 221
  category: vehicle_information
  question: インディアナ州で、特別許可証なしで運転できる車両の最大全高はどれくらいですか？
  choices:
    A: 12フィート6インチ
    B: 13フィート6インチ
    C: 14フィート
    D: 14フィート6インチ
  answer: B
  explanation: 特別許可証なしで運転できる車両の最大全高は、13フィート6インチです。
- id: 222
  category: sharing_the_road
  question: 時速55マイルで走行中、ブレーキが過熱した状態の積載量いっぱいのトラクター・トレーラーが完全に停止するまでに、およそ何フィート必要ですか？
  choices:
    A: 130〜140フィート
    B: 200フィート
    C: 300フィート
    D: 400フィート以上
  answer: D
  explanation: ブレーキが過熱した状態の積載量いっぱいのトラクター・トレーラーが完全に停止するには、400フィート以上、つまりフットボール場の長さ以上の距離が必要になる場合があります。
- id: 223
  category: sharing_the_road
  question: トラクター・トレーラーの後方の死角は、車両の後ろに最大で何フィートまで広がりますか？
  choices:
    A: 最大50フィートまで
    B: 最大100フィートまで
    C: 最大150フィートまで
    D: 最大200フィートまで
  answer: D
  explanation: トラクター・トレーラーの運転手の死角は、キャビンの前方最大20フィート、トレーラーの両側、キャビンの横、そして車両の後方最大200フィートに及びます。
- id: 224
  category: sharing_the_road
  question: 複数車線の幹線道路で、トラクター・トレーラーが中央車線を走行し続けることが多いのはなぜですか？
  choices:
    A: 規定の制限速度よりも速く走るため。
    B: ハイウェイへの出入りをする地元の交通の流れを助け、危険な状況を回避するための選択肢を増やすため。
    C: 右側車線を走行することが法律で禁止されているため。
    D: 乗用車に追い越されるのを防ぐため。
  answer: B
  explanation: 複数車線の幹線道路では、トラクター・トレーラーは地元の交通のハイウェイへの出入りをスムーズにするために中央車線を走行します。また、中央車線にいることで、危険な状況を回避するために車線を変更する必要がある場合の選択肢も増えます。
- id: 225
  category: sharing_the_road
  question: トラクター・トレーラーを追い越す際、どちら側から追い越すべきですか？
  choices:
    A: 常に左側から
    B: 常に右側から
    C: 交通量が少ない方の側から
    D: トラクター・トレーラーを追い越すべきではない
  answer: A
  explanation: トラクター・トレーラーを追い越す際は、常に完全に、かつ必ず左側から追い越してください。並走し続けると、トラクター・トレーラーの運転手が回避行動を取ることが不可能になります。
- id: 226
  category: safe_driving_rules
  question: インディアナ州のムーブ・オーバー法（Move Over Law）に基づき、点滅灯をつけた緊急車両に接近した際、別の車線に移動できない場合はどうしなければなりませんか？
  choices:
    A: 速度を維持し、注意して進む。
    B: 規定の制限速度より時速10マイル減速し、注意して進む。
    C: 自分の車線内ですぐに停止する。
    D: 緊急車両を素早く追い越すために加速する。
  answer: B
  explanation: 車線を移動できない場合、運転者は規定の制限速度より時速10マイル減速し、注意して進まなければなりません。
- id: 227
  category: penalties_and_points
  question: インディアナ州のムーブ・オーバー法（Move Over Law）に従わなかった場合、どのような扱いになりますか？
  choices:
    A: クラスA軽罪（Class A Misdemeanor）
    B: クラスB違反（Class B Infraction）
    C: クラスA違反（Class A Infraction）
    D: 重罪（Felony）
  answer: C
  explanation: 交互点滅灯を表示している緊急車両に接近する運転者は、車線を変更するか減速する必要があります。これに従わない場合は、クラスA違反（Class
    A Infraction）となります。
- id: 228
  category: defensive_driving
  question: 踏切内で車両が動かなくなり、列車が近づいていない場合、まず最初に何をすべきですか？
  choices:
    A: レッカー車を呼ぶ。
    B: 自分で車両を押して線路から出そうとする。
    C: 青い標識にある番号を使って、すぐに緊急通報システム（ENS）に電話する。
    D: 通りかかった車を呼び止める。
  answer: C
  explanation: 踏切内で車両が動かなくなり、列車が近づいていない場合は、すぐに緊急通報システム（ENS）に電話してください。電話番号は、踏切の遮断機に取り付けられている青い標識に記載されています。
- id: 229
  category: sharing_the_road
  question: トラクター・トレーラーが急な右左折をする際、どのようなことが予想されますか？
  choices:
    A: 後輪が前輪よりも外側の進路を通る。
    B: 運転手が曲がるための最初のステップとして、外側に大きく膨らむことがある。
    C: 車両は常に中央車線から曲がる。
    D: トレーラーは曲がる前に完全に停止する。
  answer: B
  explanation: どのような車両でも、曲がる際は後輪が前輪よりも内側の進路を通ります。トラクター・トレーラーの運転手は、急な右左折をするための最初のステップとして、しばしば外側に大きく膨らむことがあります。
- id: 230
  category: safe_driving_rules
  question: 踏切を渡っている間に避けるべきことは何ですか？
  choices:
    A: 左右を確認すること
    B: 停車またはギアチェンジ
    C: ヘッドライトを点灯すること
    D: ワイパーを使用すること
  answer: B
  explanation: 踏切を渡っている間は、停車やギアチェンジを避けてください。停車せずに踏切を渡りきれる確信がない限り、踏切に進入してはいけません。
- id: 231
  category: penalties_and_points
  question: 認可された緊急車両に対して、車線を変更しない、または減速しない場合の罰則は何ですか？
  choices:
    A: クラスA違反 (Class A Infraction)
    B: クラスB違反 (Class B Infraction)
    C: クラスA軽罪 (Class A Misdemeanor)
    D: 第6級重罪 (Level 6 Felony)
  answer: A
  explanation: マニュアルによると、認可された緊急車両のために車線を変更できない場合、運転者は制限速度より時速10マイル（10 mph）以上減速しなければなりません。これに従わない場合はクラスA違反となります。
- id: 232
  category: safe_driving_rules
  question: 琥珀色の点滅灯をつけた認可された停車車両から離れるために車線変更ができない場合、どのような行動をとらなければなりませんか？
  choices:
    A: 完全に停止して車両が移動するのを待つ
    B: 制限速度より時速10マイル（10 mph）減速し、注意して進む
    C: 時速15マイル（15 mph）まで減速し、注意して進む
    D: 速度を維持するが、作業員に知らせるためにクラクションを鳴らす
  answer: B
  explanation: マニュアルには、琥珀色の点滅灯をつけた認可された停車車両のために車線を変更できない場合は、制限速度より時速10マイル（10 mph）減速し、注意して進まなければならないと記載されています。
- id: 233
  category: safe_driving_rules
  question: 赤色の点滅灯をつけ、ストップアームを出しているスクールバスに対して、停止する必要がないのはどのような場合ですか？
  choices:
    A: 障壁または未舗装の中央分離帯で仕切られた道路で、反対方向に走行している場合
    B: 2車線道路で反対方向に走行している場合
    C: 分離ハイウェイでバスと同じ方向に走行している場合
    D: スクールバスが踏切で停止している場合
  answer: A
  explanation: 障壁または未舗装の中央分離帯で仕切られた道路を走行している場合、スクールバスと同じ方向に走行している場合にのみ停止が義務付けられます。
- id: 234
  category: penalties_and_points
  question: スクールバスのストップアームを無視し、その違反によって身体的傷害が生じた場合の罰則は何ですか？
  choices:
    A: クラスA違反 (Class A Infraction)
    B: クラスB違反 (Class B Infraction)
    C: クラスA軽罪 (Class A Misdemeanor)
    D: 第6級重罪 (Level 6 felony)
  answer: D
  explanation: スクールバスのストップアームを無視するとクラスA軽罪になる可能性がありますが、その違反によって身体的傷害が生じた場合は第6級重罪となります。
- id: 235
  category: sharing_the_road
  question: オートバイの後ろを走行する際、どのくらいの車間距離を空けるべきですか？
  choices:
    A: 1〜2秒
    B: 少なくとも3〜4秒
    C: 5〜6秒
    D: 時速10マイルごとに車1台分の長さ
  answer: B
  explanation: マニュアルでは、オートバイが緊急時に操縦や停止を行うための十分な時間を確保できるよう、オートバイの後ろを走る際は少なくとも3〜4秒の車間距離を空けることを推奨しています。
- id: 236
  category: sharing_the_road
  question: オートバイの方向指示器（ウィンカー）が点滅していても、実際に曲がるのを確認してから進むべきなのはなぜですか？
  choices:
    A: オートバイは配線不良が多く、ランダムに点滅することがあるため
    B: オートバイの方向指示器は通常、自動で消えないため、ライダーが消し忘れることがあるから
    C: オートバイのライダーは頻繁に曲がるのをやめることがあるから
    D: 法律で進行前に5秒間の待機が義務付けられているから
  answer: B
  explanation: オートバイの方向指示器は通常、自動で消える仕組みになっておらず、ライダーが消し忘れることがあるため、点滅しているからといってすぐに曲がると決めつけないでください。
- id: 237
  category: sharing_the_road
  question: 自転車利用者を追い越す際、運転者が確保しなければならない最小限の安全な間隔はどれくらいですか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 5フィート
  answer: C
  explanation: 運転者は、自転車利用者の横に安全な間隔がある場合に自転車利用者を追い越すことができます。その間隔は最低3フィートです。
- id: 238
  category: sharing_the_road
  question: 道路上での自転車の並走に関する一般的な規則は何ですか？
  choices:
    A: 常に一列で走行しなければならない
    B: 3台まで並走できる
    C: 自転車専用道を除き、2台を超えて並走してはならない
    D: 車線の幅が許す限り何台でも並走できる
  answer: C
  explanation: 自転車は、自転車専用の通路や道路の部分を除き、2台を超えて並走（2列以上で走行）することはできません。
- id: 239
  category: sharing_the_road
  question: 運転者が自転車道または自転車専用レーンを横切ることが許可されるのはいつですか？
  choices:
    A: 100フィート手前で右左折の準備をする際
    B: 低速の自動車を追い越す際
    C: 右左折する場合、または路地、ドライブウェイ、私道に出入りする場合のみ
    D: 自転車レーンに自転車がいないときはいつでも
  answer: C
  explanation: 運転者は、右左折する場合、または路地、ドライブウェイ、私道に出入りする場合にのみ、自転車道または自転車専用レーンを横切ることができます。
- id: 240
  category: signs_and_signals
  question: 路面の「シャロウ（Sharrow）」標示の目的は何ですか？
  choices:
    A: 自転車専用レーンであることを示すため
    B: 前方に歩行者横断歩道があることを運転者に警告するため
    C: 自転車利用者が路肩の停車車両から離れた位置を走れるようにし、運転者に自転車の存在を予期させるため
    D: 自転車専用の駐輪スペースを示すため
  answer: C
  explanation: シャロウ標示は、自転車利用者が停車中の車から離れた位置を走行できるようにし、他の道路利用者に自転車が走行車線を走ることを予期させるためのものです。
- id: 241
  category: signs_and_signals
  question: 道路上の赤い舗装は何を示していますか？
  choices:
    A: 指定された自転車専用レーン
    B: バス、タクシー、またはその他の公共交通機関用に指定されたレーン
    C: 駐車禁止区域
    D: この先の停止標識または信号機
  answer: B
  explanation: 赤い舗装は、バス、タクシー、またはその他の公共交通機関用に指定されたバスレーンやトランジットレーンの視認性を高めるために使用されることがあります。
- id: 242
  category: safe_driving_rules
  question: 交差点で警察官が交通整理をしており、青信号と矛盾する指示を出した場合、どうしなければなりませんか？
  choices:
    A: 信号機に従う
    B: 警察官の指示に従う
    C: 信号が赤になるまで待ってから移動する
    D: 青信号であることを知らせるためにクラクションを鳴らす
  answer: B
  explanation: 警察官の指示が交通信号や標識と異なる場合があります。そのような場合、警察官の指示が最優先され、それに従わなければなりません。
- id: 243
  category: safe_driving_rules
  question: 縦列駐車を始める際、空きスペースの前に駐車している車両からどのくらい離して自車を配置すべきですか？
  choices:
    A: 少なくとも1フィート
    B: 少なくとも2フィート
    C: 少なくとも3フィート
    D: 少なくとも4フィート
  answer: B
  explanation: 縦列駐車をする際は、空きスペースの前に駐車している車両と並行に自車を配置し、その車両から少なくとも2フィートの間隔を保つ必要があります。
- id: 244
  category: penalties_and_points
  question: ハザードランプを点滅させて停車している故障車に対して、車線を空けるか適切に減速しなかった場合の罰則は何ですか？
  choices:
    A: クラスA違反 (Class A Infraction)
    B: クラスB違反 (Class B Infraction)
    C: クラスC違反 (Class C Infraction)
    D: クラスA軽罪 (Class A Misdemeanor)
  answer: B
  explanation: ハザードランプを点滅させて停車している故障車に接近する運転者は、車線を移動するか、制限速度より時速10マイル（10 mph）低い速度まで減速しなければなりません。これを怠るとクラスB違反となります。
- id: 245
  category: sharing_the_road
  question: 自転車利用者は、指定された自転車レーンがある場合、そこを走行しなければなりませんか？
  choices:
    A: はい、常に自転車レーンを使用しなければなりません
    B: はい、自転車レーンが障害物で塞がれていない限り使用しなければなりません
    C: いいえ、自転車レーンまたは走行車線のいずれかを使用する権利があります
    D: いいえ、ただし時速15マイル以上で走行している場合に限ります
  answer: C
  explanation: 自転車利用者は、自転車レーンまたは走行車線のいずれかを使用する権利があるため、指定された自転車レーンを走行することは義務付けられていません。
- id: 246
  category: safe_driving_rules
  question: 下り坂で駐車する場合、車両の車輪をどちらに向けるべきですか？
  choices:
    A: 縁石から離す方向
    B: 縁石の方向
    C: 縁石と平行
    D: 道路の方向
  answer: B
  explanation: 下り坂で駐車する場合は、車両の車輪を縁石の方向に向けてください。
- id: 247
  category: safe_driving_rules
  question: 上り坂で縁石がない場所に駐車する場合、車輪をどちらに向けるべきですか？
  choices:
    A: 道路の方向
    B: 道路と平行
    C: 道路から離れる方向
    D: まっすぐ前
  answer: C
  explanation: 縁石がない場所で上り坂に向けて駐車する場合は、車両の車輪を道路から離れる方向に向けてください。
- id: 248
  category: safe_driving_rules
  question: 車両を後退（バック）させる際の適切な方法は何ですか？
  choices:
    A: バックミラーだけに頼る
    B: 体を左に回してサイドウィンドウから外を見る
    C: 体を右に回してリアウィンドウ（後ろの窓）から外を見る
    D: サイドミラーのみを使用する
  answer: C
  explanation: 後退する際は、体を右に回してリアウィンドウから直接後ろを確認してください。後退時にバックミラーのみを使用することは決してしないでください。
- id: 249
  category: safe_driving_rules
  question: 次のうち、駐車禁止場所はどれですか？
  choices:
    A: 消火栓から15フィート以内
    B: 消火栓から25フィート以内
    C: 踏切から50フィート以内
    D: 白い縁石に隣接する場所
  answer: A
  explanation: 消火栓から15フィート以内、または消防車専用レーンでの駐車は禁止されています。
- id: 250
  category: sharing_the_road
  question: 視覚障害のある歩行者であることを示すために、どのような補助具がよく使われますか？
  choices:
    A: 黄色のジャケットまたは反射ベスト
    B: 白い杖または訓練された盲導犬
    C: 赤い杖または電動車椅子
    D: 点滅するライトまたは歩行器
  answer: B
  explanation: 視覚障害のある人のための移動補助具としては、白い杖や訓練された盲導犬が一般的です。
- id: 251
  category: vehicle_information
  question: シートベルトを着用することで、運転者と助手席の乗員の生存率は何パーセント向上しますか？
  choices:
    A: 25パーセント
    B: 35パーセント
    C: 45パーセント
    D: 50パーセント
  answer: C
  explanation: シートベルトを着用すると、運転者と助手席の乗員の生存率は45パーセント向上します。
- id: 252
  category: safe_driving_rules
  question: 安全性を最大限に高めるために、運転者はハンドル（ステアリングホイール）に対してどのような位置に座るべきですか？
  choices:
    A: 少なくとも6インチ離れる
    B: 少なくとも10インチ離れる
    C: 少なくとも12インチ離れる
    D: 無理のない範囲でできるだけ近づく
  answer: C
  explanation: 安全性を最大限に高めるために、運転者はハンドルから少なくとも12インチ離れて座る必要があります。
- id: 253
  category: safe_driving_rules
  question: 次の中で、シートベルトの着用が免除されるのは誰ですか？
  choices:
    A: 乗用車の後部座席の乗員
    B: 長距離走行中の商用車の運転手
    C: 配達のために停車する新聞配達員
    D: 学校へ運転して行くティーンエイジャー
  answer: C
  explanation: 車両から配達を行うために停車する新聞配達員や新聞束の運搬人は、シートベルトの着用が免除されます。
- id: 254
  category: driver_responsibility
  question: インディアナ州の法律では、何歳未満の乗員に対してチャイルドシート（チャイルド・レストレイント・システム）の適切な使用が義務付けられていますか？
  choices:
    A: 6歳未満
    B: 7歳未満
    C: 8歳未満
    D: 10歳未満
  answer: C
  explanation: 8歳未満の乗員は、法律により、チャイルドシートやジュニアシートなどのチャイルド・レストレイント・システムで適切に固定されることが義務付けられています。
- id: 255
  category: vehicle_information
  question: 助手席にエアバッグが装備されている場合、全米安全評議会（National Safety Council）は何歳未満の子供を後部座席に乗せることを推奨していますか？
  choices:
    A: 8歳未満
    B: 10歳未満
    C: 12歳未満
    D: 14歳未満
  answer: C
  explanation: 助手席にエアバッグが装備されている場合、全米安全評議会は12歳未満の子供を後部座席に乗せることを推奨しています。
- id: 256
  category: vehicle_information
  question: 日の出から日没までの間に、車両の積載物が車両の後端から4フィートを超えて突き出している場合、その最後端に何を設置しなければなりませんか？
  choices:
    A: 500フィート先から見える赤色のランプ
    B: 12平方インチ以上の赤旗
    C: 2つの黄色い点滅灯
    D: 「Wide Load（幅広荷物）」の標識
  answer: B
  explanation: 日の出から日没までの間、車両の積載物の最後端には赤旗を設置しなければなりません。赤旗は12平方インチ以上の大きさである必要があります。
- id: 257
  category: defensive_driving
  question: 日中に車が故障して動かなくなった場合、2枚の赤旗をどこに掲示しなければなりませんか？
  choices:
    A: 車の前方50フィートと後方50フィート
    B: 車の前方100フィートと後方100フィート
    C: 車の前方200フィートと後方200フィート
    D: 車の屋根とトランクの上
  answer: B
  explanation: 日中、故障車の運転者は2枚の赤旗を掲示しなければなりません。1枚は車の前方約100フィートに、もう1枚は後方約100フィートに設置します。
- id: 258
  category: defensive_driving
  question: カーブや丘の頂上から500フィート以内の場所に車が停車している場合、警告装置は車からどのくらいの距離に設置しなければなりませんか？
  choices:
    A: 車から少なくとも100フィート
    B: 車から少なくとも200フィート
    C: 車から少なくとも300フィート
    D: 車から少なくとも500フィート
  answer: D
  explanation: カーブ、丘の頂上、またはその他の視界を遮るものから500フィート以内の場所に車が停車している場合、警告装置は車から少なくとも500フィート離れた場所に設置しなければなりません。
- id: 259
  category: safe_driving_rules
  question: 安全性を最大限に高めるために、シートベルトはどのように着用すべきですか？
  choices:
    A: 腹部の高い位置で、腕の下を通す
    B: 腰の低い位置に、鎖骨を横切るように平らに着用する
    C: 腰と首を横切るように緩めに着用する
    D: 腰の高い位置で、胸を横切るように着用する
  answer: B
  explanation: 全員がシートベルトを腰の低い位置に、そして鎖骨を横切るように平らに着用すべきです。
- id: 260
  category: safe_driving_rules
  question: 分離帯のある道路で車両が故障した場合、警告装置は車両からどのくらい離れた場所に設置しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: マニュアルによると、分離帯のある道路で車両が故障した場合、緊急警告装置は車両から200フィート離れた場所に設置しなければなりません。
- id: 261
  category: defensive_driving
  question: インディアナ州におけるすべての衝突事故で最も一般的な要因は何ですか？
  choices:
    A: スピード違反
    B: 酒気帯び・薬物影響下での運転
    C: 優先権の譲り不履行
    D: 脇見運転
  answer: C
  explanation: マニュアルによると、インディアナ州のすべての衝突事故の中で、優先権の譲り不履行が最も一般的な要因であると述べられています。
- id: 262
  category: driver_responsibility
  question: 事故後、どのような状況下で車両をハイウェイから移動させては「いけませんか」？
  choices:
    A: ラッシュアワーの時間帯に事故が発生した場合
    B: 事故に危険物の輸送が関わっている場合
    C: 車両がパンクしている場合
    D: 相手のドライバーが車両の移動を拒否した場合
  answer: B
  explanation: 事故に危険物の輸送が関わっている場合、または負傷、死亡、閉じ込めが発生した場合は、ドライバーは車両を移動させてはいけません。
- id: 263
  category: driver_responsibility
  question: 無人の車両に衝突し、所有者を見つけることができない場合、どうしなければなりませんか？
  choices:
    A: フロントガラスにメモを残して立ち去る
    B: レッカー車を呼んで車両を撤去する
    C: 法執行機関（警察など）に連絡して情報を提供する
    D: 立ち去る前に現場でちょうど1時間待つ
  answer: C
  explanation: 無人の車両と衝突し、所有者が見つからない場合は、情報を提供するために法執行機関に連絡しなければなりません。
- id: 264
  category: license_system
  question: 事故の後、保険会社が財政的責任を証明するためにBMVに電子的に提出しなければならない書類は何ですか？
  choices:
    A: 遵守証明書 (COC)
    B: 賠償責任証明 (POL)
    C: 事故報告書 (ARF)
    D: 車両登録証 (VRC)
  answer: A
  explanation: 保険会社は、遵守証明書 (COC) の形式で財政的責任の証明を電子的に提出しなければなりません。
- id: 265
  category: defensive_driving
  question: 衝突が避けられない場合、衝撃を最小限に抑えるための最も安全な選択は次のうちどれですか？
  choices:
    A: 壊れやすいものよりも硬いものにぶつかる
    B: 反対方向に動いているものにぶつかる
    C: 同じ方向に動いているものよりも動いていないものにぶつかる
    D: 動いていないものよりも自分と同じ方向に動いているものにぶつかる
  answer: D
  explanation: マニュアルでは、動いていないものよりも自分と同じ方向に動いているものにぶつかること、そして壊れやすい（衝撃を吸収する）ものを選ぶことを推奨しています。
- id: 266
  category: safe_driving_rules
  question: 車両の車輪が路肩にはみ出してしまった場合、取るべき正しい行動は何ですか？
  choices:
    A: ハンドルを急に切って舗装路に戻す
    B: すぐに止まるためにブレーキを強く踏む
    C: 路肩に沿って走り、アクセルを緩め、徐々に道路に戻る
    D: 加速して安全に交通の流れに合流する
  answer: C
  explanation: 車輪が路肩にはみ出した場合は、すぐに戻ろうとしないでください。代わりに路肩に沿って走り、アクセルを緩めます。減速した後、徐々に道路に戻ってください。
- id: 267
  category: defensive_driving
  question: 車両が水中に転落した場合、ドアを開けようとしてはいけないのはなぜですか？
  choices:
    A: 電気系統がすぐにショートするため
    B: 水圧によって開けることがほぼ不可能であり、また開いたドアから客室に水が流れ込むため
    C: ドアロックが自動的にジャム（固定）されるため
    D: 車両が瞬時に沈む原因となるため
  answer: B
  explanation: 水の重さ（水圧）によりドアを開けることはほぼ不可能であり、また開いたドアから客室に水が流れ込んでしまいます。
- id: 268
  category: alcohol_drugs_health
  question: ドライバーの能力が低下している（酒気帯びや薬物など）可能性を示す兆候は、次のうちどれですか？
  choices:
    A: 激しい雨の中で制限速度よりわずかに遅く運転している
    B: 大きく回転したり、中央線をまたいで走行したりしている
    C: 一貫して方向指示器を使用している
    D: 日中にヘッドライトを点灯して運転している
  answer: B
  explanation: 車両が大きく回転したり、中央線をまたいだり、蛇行したり、その他の異常な行動を示したりする場合、そのドライバーは能力が低下している可能性があります。
- id: 269
  category: safe_driving_rules
  question: 緊急時に路肩で車両から降りる必要がある場合、どのように降りるべきですか？
  choices:
    A: できるだけ早く運転席側から降りる
    B: 周囲の状況を確認した後、助手席側から降りる
    C: 目立つようにサンルーフから這い出る
    D: 警察官が到着してドアを開けてくれるまで待つ
  answer: B
  explanation: 路肩で車両から降りる必要がある場合は、他の車両や障害物がないか周囲を確認した上で、助手席側から降りてください。
- id: 270
  category: vehicle_information
  question: 走行中にタイヤがパンク（バースト）した場合、どうすべきですか？
  choices:
    A: すぐにブレーキを強くかける
    B: ハンドルを右に急に切る
    C: ハンドルをしっかりと握り、アクセルから足を離し、ブレーキはかけない
    D: ニュートラルに入れ、ブレーキをポンピングする
  answer: C
  explanation: タイヤがパンクしたときは、ハンドルをしっかりと握り、車を直進させます。徐々に減速し、アクセルから足を離しますが、ほぼ停止するまでブレーキはかけないでください。
- id: 271
  category: vehicle_information
  question: 車両の従来のディスクまたはドラムブレーキが突然故障した場合、まず何をすべきですか？
  choices:
    A: 低いギアにシフトダウンし、ブレーキペダルを素早く強く何度も踏む（ポンピングする）
    B: すぐにイグニッションを切る
    C: パーキングブレーキをできるだけ強く引く
    D: 近くの溝にハンドルを切る
  answer: A
  explanation: ブレーキが突然故障した場合は、可能であれば低いギアにシフトダウンし、ブレーキペダルを素早く強く数回踏み込んで（ポンピングして）、ブレーキ圧を高める必要があります。
- id: 272
  category: safe_driving_rules
  question: 他のドライバーの視界が遮られる可能性があるカーブや坂の頂上から500フィート以内で車両が故障した場合、緊急警告装置はどこに設置すべきですか？
  choices:
    A: 車両から100フィートの位置
    B: 車両から200フィートの位置
    C: 車両から少なくとも500フィート離れた位置
    D: 車両の屋根の真上
  answer: C
  explanation: カーブや坂の頂上、または他のドライバーの視界が遮られる可能性のある場所から500フィート以内で車両が故障した場合は、車両から少なくとも500フィート離れた場所に警告装置を設置してください。
- id: 273
  category: defensive_driving
  question: 車両が水中に没し、脱出する必要がある場合はどうすればよいですか？
  choices:
    A: ドアを開ける前に、車内に水が完全に満たされるのを待つ
    B: シートベルトを外し、窓を開けて、屋根の上に移動する
    C: 脱出する前に貴重品をまとめる
    D: 救急隊員が到着していても、すぐに岸に向かって泳ぐ
  answer: B
  explanation: 車両が水中に没した場合は、シートベルトを外し、窓を開け、車外に出て屋根の上に移動してください。持ち物を取りに車内に戻ってはいけません。岸に向かって泳ぐのは最終手段としてください。
- id: 274
  category: vehicle_information
  question: 走行中にイグニッションをロック（LOCK）位置に回してはいけないのはなぜですか？
  choices:
    A: エンジンがオーバーヒートするため
    B: トランスミッションに永久的な損傷を与えるため
    C: ハンドルを切った際にステアリングがロックされ、制御不能になるため
    D: ブレーキが即座にロックされ、スリップを引き起こすため
  answer: C
  explanation: ステアリングロック機構を備えた車両を運転している際、走行中にイグニッションをロック位置に回すと、ハンドルを切ったときにステアリングがロックされ、車両の制御ができなくなります。
- id: 275
  category: safe_driving_rules
  question: 車両の盗難の可能性を減らすために、どのように駐車すべきですか？
  choices:
    A: 前輪を左に大きく切った状態にする
    B: 前輪を右に大きく切り、非常用ブレーキ（パーキングブレーキ）をかける
    C: 換気のために窓を少し開けておく
    D: ギアをニュートラルに入れ、非常用ブレーキをかける
  answer: B
  explanation: 車両盗難のリスクを減らすため、マニュアルでは前輪を右に大きく切り、非常用ブレーキ（パーキングブレーキ）をかけて駐車することを推奨しています。
- id: 276
  category: driver_responsibility
  question: 警察官に停車を命じられた際、まずどのように警察官の存在を認識したことを示すべきですか？
  choices:
    A: すぐにハザードランプを点灯させる
    B: 窓から手を振る
    C: 右の方向指示器（ウィンカー）を出す
    D: クラクションを2回鳴らす
  answer: C
  explanation: 右の方向指示器を出すことで、警察官の存在を認識したことを伝えます。これにより、警察官はあなたが指示に気づいていることを確認できます。
- id: 277
  category: safe_driving_rules
  question: 高速道路で警察官に停車を命じられた場合、車両をどこに停めるべきですか？
  choices:
    A: 道路の右側の路肩
    B: 中央分離帯
    C: 一番右側の走行車線内
    D: 道路の左側の路肩
  answer: A
  explanation: 車両を道路の右側の路肩に移動させる必要があります。高速道路の中央分離帯に停車してはいけません。運転者と警察官の両方を危険にさらすことになるからです。
- id: 278
  category: safe_driving_rules
  question: 夜間に警察官に停車を命じられた場合、何を行うことが推奨されますか？
  choices:
    A: ヘッドライトを消す
    B: ハイビームを点灯させる
    C: 車内灯（ルームランプ）を点灯させる
    D: 警察官に見えるように車外に出る
  answer: C
  explanation: 夜間に停車を命じられた場合は、車内灯を点灯させ、明るい場所を探して停車することが推奨されます。
- id: 279
  category: safe_driving_rules
  question: 交通取り締まりの際、すぐに安全な停車場所が見つからない場合はどうすればよいですか？
  choices:
    A: 安全な場所が見つかるまで速度を維持する
    B: 減速し、ハザードランプを点灯させる
    C: 走行車線の真ん中で停車する
    D: 次の出口に早く着くように加速する
  answer: B
  explanation: すぐに安全な場所が見つからない場合は、減速してハザードランプを点灯させてください。これにより、警察官に対して、あなたが指示を認識しており、安全に停車できる場所を積極的に探していることを示すことができます。
- id: 280
  category: driver_responsibility
  question: 交通取り締まりの間、運転者と乗客はどこに手を置いておくべきですか？
  choices:
    A: 運転者はハンドルに手を置き、乗客は膝の上に手が見えるようにしておく
    B: 全員が両手を空中に高く上げる
    C: 手はポケットに入れるか、見えない場所に隠しておく
    D: 運転者はすぐにグローブボックスに手を伸ばす
  answer: A
  explanation: 運転者はハンドルに手を置き、乗客は膝の上に手が見えるようにしておくべきです。手が見えない状態は、警察官に脅威を感じさせる原因となります。
- id: 281
  category: driver_responsibility
  question: 交通取り締まり中に保険の証明書が携帯電話に保存されている場合、どうすべきですか？
  choices:
    A: 警察官が近づいてくる前に、素早く携帯電話を手に取る。
    B: 警察官が歩いてきたら、窓から携帯電話を差し出す。
    C: まず警察官にその旨を伝え、指示に従ってから携帯電話を取り出す。
    D: 警察官は携帯電話を見ることができないため、提示を拒否する。
  answer: C
  explanation: 保険の証明書が携帯電話に保存されている場合は、まず警察官にその旨を伝え、情報を提示するために携帯電話を取り出す前に警察官の指示に従う必要があります。
- id: 282
  category: penalties_and_points
  question: 警察官から発行された交通違反切符に署名することは何を意味しますか？
  choices:
    A: 自分の罪を認めることである。
    B: 交通裁判所での裁判を受ける権利を放棄することである。
    C: 切符を受け取ったことの確認にすぎない。
    D: 取り締まりの理由に同意することを意味する。
  answer: C
  explanation: 切符への署名は、運転者が罪を認めたことにはならず、単に切符を受け取ったことを確認するためのものです。
- id: 283
  category: alcohol_drugs_health
  question: 一酸化炭素中毒の症状は次のうちどれですか？
  choices:
    A: 車内に強い排気ガスの臭いがする。
    B: 光に対する過敏症。
    C: 突然のエネルギーの噴出。
    D: 皮膚や唇が赤みを帯びる。
  answer: B
  explanation: 一酸化炭素中毒の症状には、眠気やめまい、皮膚や唇が青白くなること、頭痛、および光に対する過敏症が含まれます。一酸化炭素は見て、臭いを嗅いで、または味で判断することはできません。
- id: 284
  category: safe_driving_rules
  question: 混雑した道路を走行中、一酸化炭素中毒を避けるにはどうすればよいですか？
  choices:
    A: すべての窓を全開にする。
    B: 車両のヒーターを最大にする。
    C: 外気導入ベントを閉じる。
    D: 外気導入ベントを開ける。
  answer: C
  explanation: 混雑した交通の中で一酸化炭素中毒を避けるには、他車の排気ガスを吸い込まないように外気導入ベントを閉じる必要があります。
- id: 285
  category: signs_and_signals
  question: マニュアルの交通規則によると、赤信号で左折が法的に許可されるのはどのような場合ですか？
  choices:
    A: 他に車両がいない場合。
    B: 一方通行の道路から別の一方通行の道路へ曲がる場合。
    C: 他の運転者がクラクションを鳴らした場合。
    D: いかなる場合も許可されない。
  answer: B
  explanation: 赤信号での法的な左折は、運転者が一方通行の道路から別の一方通行の道路へ曲がる場合にのみ許可されます。
- id: 286
  category: sharing_the_road
  question: 55 mphで走行中の、ブレーキが熱くなった荷物満載のトラクター・トレーラーが停止するまでに、どのくらいの距離が必要ですか？
  choices:
    A: 50フィート以上。
    B: 100フィート以上。
    C: 200フィート以上。
    D: 400フィート以上。
  answer: D
  explanation: 55 mphで走行中の、ブレーキが熱くなった荷物満載のトラクター・トレーラーが停止するには、400フィート（約122メートル）以上の距離が必要になる場合があります。
- id: 287
  category: safe_driving_rules
  question: インディアナ州の法律によると、車両のヘッドライトを点灯しなければならない期間はいつですか？
  choices:
    A: 日没から日の出まで、および視界が500フィート未満のとき
    B: 午後6時30分から午前6時30分まで
    C: 運転者が疲れているときはいつでも
    D: 照明のない田舎道を走行するときのみ
  answer: A
  explanation: インディアナ州の法律では、日没から日の出までの間、および視界が500フィート未満の場合に車両のヘッドライトを点灯することを義務付けています。
- id: 288
  category: safe_driving_rules
  question: 曲がろうとする道路に複数の車線がある場合、どの車線から曲がるべきですか？
  choices:
    A: 中央の車線
    B: 曲がる方向から最も遠い車線
    C: 曲がる方向に最も近い車線
    D: 方向指示器を出していればどの車線でもよい
  answer: C
  explanation: 複数の車線がある道路から曲がる場合は、曲がる方向に最も近い車線から曲がる必要があります。
- id: 289
  category: safe_driving_rules
  question: 標識で別途指定されていない限り、地方の州道分離ハイウェイ（rural state divided highway）の制限速度はいくらですか？
  choices:
    A: 時速50マイル
    B: 時速55マイル
    C: 時速60マイル
    D: 時速65マイル
  answer: C
  explanation: 標識で別途指定されていない限り、地方の州道分離ハイウェイの制限速度は時速60マイルです。
- id: 290
  category: safe_driving_rules
  question: 標識で別途指定されていない限り、都市化されていない地域の州間高速道路（interstate）における乗用車の最高速度制限はいくらですか？
  choices:
    A: 時速55マイル
    B: 時速60マイル
    C: 時速65マイル
    D: 時速70マイル
  answer: D
  explanation: 標識で別途指定されていない限り、都市化されていない地域の州間高速道路における乗用車の最高速度制限は時速70マイルです。
- id: 291
  category: safe_driving_rules
  question: 夜間の運転中、前方車両を追従する場合、何フィート以内でロービーム（すれ違い用前照灯）を使用しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 夜間の運転中、前方車両を200フィート以内で追従する場合は、ロービームを使用しなければなりません。
- id: 292
  category: safe_driving_rules
  question: 夜間の運転中、対向車とすれ違う際、何フィート以内でロービームに切り替えなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: D
  explanation: 対向車が500フィート以内に近づいたときは、ロービームを使用しなければなりません。
- id: 293
  category: defensive_driving
  question: タイヤのパンクやバーストが発生した場合、どのように対処すべきですか？
  choices:
    A: すぐにブレーキをかける
    B: ハンドルをしっかりと握り、車を直進させる
    C: 走行速度を上げる
    D: 目的地に着くまでホイールのリムだけで走行を続ける
  answer: B
  explanation: タイヤのパンクやバーストが発生した場合は、ハンドルをしっかりと握り、車を直進させるようにしてください。
- id: 294
  category: license_system
  question: 営業用許可（for-hire endorsement）を得て有償で物品を運送する場合、車両の総重量制限はいくらですか？
  choices:
    A: 16,000ポンドを超えてはならない
    B: 26,000ポンドを超えてはならない
    C: 26,000ポンドを超えなければならない
    D: 28,000ポンドを超えなければならない
  answer: B
  explanation: 営業用許可を得て有償で物品を運送する場合、車両の総重量は26,000ポンドを超えてはなりません。
- id: 295
  category: safe_driving_rules
  question: 有償で乗客を運ぶ車両は、踏切から何フィートの範囲内で停止する必要がありますか？
  choices:
    A: 5〜45フィート
    B: 10〜40フィート
    C: 15〜50フィート
    D: 20〜60フィート
  answer: C
  explanation: 有償で乗客を運ぶ車両は、踏切から15〜50フィートの範囲内で停止しなければなりません。
- id: 296
  category: vehicle_information
  question: 走行車線または路肩で故障したトラック、バス、またはトレーラーに使用できる適切な警告装置は次のうちどれですか？
  choices:
    A: 連邦規格に適合した3つの双方向反射三角表示板
    B: 3つの液体燃焼式フレア
    C: 少なくとも6本の信号紅炎（fusees）
    D: すべての回答が正しい
  answer: D
  explanation: 故障したトラック、バス、またはトレーラーに使用できる適切な警告装置には、連邦規格に適合した3つの双方向反射三角表示板、3つの液体燃焼式フレア、または少なくとも6本の信号紅炎が含まれます。したがって、すべての回答が正しいです。
- id: 297
  category: signs_and_signals
  question: 警察官が交通整理を行っており、その指示が交通信号や標識と異なる場合、どうすべきですか？
  choices:
    A: 交通標識や信号に従う
    B: 警察官の指示に従う
    C: 速度を落とさずにそのまま進む
    D: ソーシャルメディアでアラートを送信する
  answer: B
  explanation: 警察官が交通整理を行っている場合は、たとえ交通信号や標識と異なっていても、警察官の指示に従わなければなりません。
- id: 298
  category: license_system
  question: 新規の運転免許証を申請する際、インディアナ州の居住を証明する書類を何通提示する必要がありますか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: B
  explanation: 新規の運転免許証、学習許可証（仮免許）、または身分証明書を取得するには、インディアナ州の居住を証明する書類を2通提示する必要があります。
- id: 299
  category: license_system
  question: 社会保障番号（SSN）を証明するために使用できる書類は次のうちどれですか？
  choices:
    A: 公共料金の請求書
    B: W-2フォーム（源泉徴収票）
    C: 銀行の取引明細書
    D: インディアナ州の有権者登録カード
  answer: B
  explanation: マニュアルによると、氏名と完全な社会保障番号が記載された有効な書類には、社会保障カード、W-2フォーム、1099フォーム、非SSA 1099フォーム、または印字済みの給与明細が含まれます。
- id: 300
  category: license_system
  question: インディアナ州の居住を証明するために使用する公共料金会社からのコンピューター作成の請求書は、発行からどのくらい以内のものである必要がありますか？
  choices:
    A: 申請日から30日以内に発行されたもの
    B: 申請日から60日以内に発行されたもの
    C: 申請日から90日以内に発行されたもの
    D: 申請日から1年以内に発行されたもの
  answer: B
  explanation: マニュアルには、公共料金会社からのコンピューター作成の請求書は、申請日から60日以内に発行されたものであり、かつ氏名と居住住所が記載されていなければならないと記されています。
- id: 301
  category: license_system
  question: BMVの書類において、私書箱（P.O. Box）を居住地住所として使用できるのはどのような条件の場合ですか？
  choices:
    A: 申請者が全ての郵便物をそこで受け取っている場合
    B: 申請者がホームレスである場合
    C: 申請者がインディアナ州司法長官の住所機密プログラム（Address Confidentiality Program）に登録している場合
    D: いかなる状況でも私書箱を使用することはできない
  answer: C
  explanation: 申請者がインディアナ州司法長官の住所機密プログラムに登録している場合を除き、私書箱を居住地住所として使用することはできません。
- id: 302
  category: license_system
  question: 親戚や友人と同居しており、居住を証明する2つの書類を提出できない場合、その親戚や友人は何をしなければなりませんか？
  choices:
    A: BMVの支局でインディアナ州居住証明供述書（Indiana Residency Affidavit）に署名する
    B: 自身の社会保障カード（Social Security card）を提出する
    C: 公式なレターヘッドで手紙を書く
    D: 居住確認手数料を支払う
  answer: A
  explanation: 親戚や友人と同居している場合、同居している親戚または友人がBMVの支局でインディアナ州居住証明供述書（Indiana Residency
    Affidavit）に署名する必要があります。
- id: 303
  category: license_system
  question: 英語以外の言語で書かれた書類をBMVに提出する場合、何が必要ですか？
  choices:
    A: 支局での家族による口頭での翻訳
    B: 承認された機関のレターヘッドにタイピングされた完全な翻訳
    C: 元の書類の公証済みコピー
    D: 友人による翻訳
  answer: B
  explanation: 翻訳は、政府機関、認定教育機関、または翻訳会社のレターヘッドを使用し、別の用紙にタイピングされていなければなりません。
- id: 304
  category: license_system
  question: BMVの申請書類の翻訳を行うことが明確に禁止されているのは誰ですか？
  choices:
    A: 政府機関
    B: 認定教育機関
    C: 翻訳会社
    D: 家族、友人、または仕事上の関係者
  answer: D
  explanation: 翻訳者は、その書類が家族、友人、または仕事上の関係者のために翻訳されたものではないことを宣言しなければなりません。
- id: 305
  category: defensive_driving
  question: マニュアルによると、ティーンエイジャー（10代）の衝突事故において最も一般的な要因は何ですか？
  choices:
    A: 過度なスピード
    B: 誤った危険な運転および注意散漫
    C: 他のティーンエイジャーと同乗しての運転
    D: シートベルトの未着用
  answer: B
  explanation: マニュアルには、誤った危険な運転および注意散漫が、ティーンエイジャーの衝突事故において最も一般的な要因であると記載されています。
- id: 306
  category: defensive_driving
  question: ティーンエイジャーのドライバーが車両に同乗者を乗せている場合、衝突事故の可能性はどうなりますか？
  choices:
    A: 監視の目が増えるため、わずかに減少する
    B: 一人で運転している場合と変わらない
    C: 同乗者が一人増えるごとに2倍になる
    D: 同乗者が一人増えるごとに3倍になる
  answer: C
  explanation: 車両に同乗者が一人増えるごとに、衝突事故の可能性は2倍になります。
- id: 307
  category: safe_driving_rules
  question: ティーンエイジャーが関与する複数車両の衝突事故のほとんどは、どこで発生していますか？
  choices:
    A: 高速道路
    B: 駐車場
    C: 交差点
    D: 田舎道
  answer: C
  explanation: ティーンエイジャーが関与する複数車両の衝突事故のほとんどは交差点で発生しています。ティーンエイジャーのドライバーは、交差点では注意散漫を避け、他の車両に集中する必要があります。
- id: 308
  category: safe_driving_rules
  question: マニュアルが運転中に大音量で音楽を流さないよう勧めているのはなぜですか？
  choices:
    A: 車両のバッテリーを消耗させるため
    B: インディアナ州では違法であるため
    C: サイレンやクラクションの音が聞こえなくなる可能性があるため
    D: ドライバーがスピードを出す原因になるため
  answer: C
  explanation: 大音量で音楽を流さないでください。トラブルの可能性を警告するサイレンやクラクションの音が聞こえなくなる可能性があります。
- id: 309
  category: defensive_driving
  question: ティーンエイジャーが関与する単独車両の衝突事故において、一般的な要因は何ですか？
  choices:
    A: 不注意
    B: 過度なスピード
    C: 他のティーンエイジャーと同乗しての運転
    D: ラジオの調整
  answer: B
  explanation: 過度なスピードです。違法または不安全なスピードは、単独車両の衝突事故における一般的な要因です。
- id: 310
  category: license_system
  question: 社会保障番号（Social Security number）を取得する資格がない場合、その代わりにどのような書類の提出を求められることがありますか？
  choices:
    A: 有効なI-94
    B: W-2フォーム
    C: 1099フォーム
    D: インディアナ州有権者登録カード
  answer: A
  explanation: 米国での就労が許可されていない場合、社会保障番号の代わりに有効なI-94の提出を求められることがあります。
- id: 311
  category: license_system
  question: インディアナ州の居住証明として認められるためには、住宅所有者、賃借人、または自動車保険の保険証券は発行からどのくらい経過している必要がありますか？
  choices:
    A: 申請日から30日以内の日付のもの
    B: 申請日から60日以内の日付のもの
    C: 申請日から90日以内の日付のもの
    D: 申請日から1年以内の日付のもの
  answer: D
  explanation: 氏名と居住住所が記載された、現在有効な住宅所有者、賃借人、または自動車保険の保険証券は、申請日から1年以内の日付である必要があります。
- id: 312
  category: license_system
  question: ホームレスの申請者は、インディアナ州居住宣誓供述書（Indiana Residency Affidavit）と共に何を提出しなければなりませんか？
  choices:
    A: W-2フォーム
    B: サービスを提供している政府機関または非営利団体からのレターヘッド付きの書面
    C: インディアナ州所得税の納税証明
    D: 有効なインディアナ州拳銃携帯許可証
  answer: B
  explanation: ホームレスの申請者は、政府機関または非営利団体からの、名称、住所、電話番号、および法的代表者の氏名、署名、署名日が記載されたレターヘッド付きの書面を提出する必要があります。
- id: 313
  category: driver_responsibility
  question: シートとミラーを調整するのに最適なタイミングはいつですか？
  choices:
    A: 赤信号で停止している間
    B: 運転を開始する前毎回
    C: 低速で走行している間
    D: 新しい車を運転するときのみ
  answer: B
  explanation: マニュアルでは、最高の視界を確保するために、運転を開始する前に必ずシートとミラーを調整することを推奨しています。
- id: 314
  category: safe_driving_rules
  question: ラジオの調整を車両が停止するまで待つべきなのはなぜですか？
  choices:
    A: 車両が動いていると車のバッテリーを消耗するため。
    B: わずか数秒間でも道路から注意をそらすと、衝突につながる可能性があるため。
    C: 車両の走行中はラジオの信号が弱くなるため。
    D: インディアナ州では運転中にラジオに触れることは違法であるため。
  answer: B
  explanation: マニュアルには、わずか数秒間でも道路から注意をそらすと衝突につながる可能性があるため、ラジオの調整は停止するまで待つ方が良いと記載されています。
- id: 315
  category: safe_driving_rules
  question: 運転中に大音量で音楽を流すことの潜在的な危険は何ですか？
  choices:
    A: トラブルを警告するサイレンやクラクションの音が聞こえなくなる可能性がある。
    B: 時間の経過とともに車両の電気システムを損傷する可能性がある。
    C: 運転者が無意識のうちに制限速度を超えて走行する原因となる。
    D: 騒音違反とみなされ、重罪（felony）となる。
  answer: A
  explanation: マニュアルによると、トラブルを警告するサイレンやクラクションの音が聞こえなくなる可能性があるため、大音量で音楽を流すべきではありません。
- id: 316
  category: safe_driving_rules
  question: 運転中の行為として、法律違反であると明記されているのは次のうちどれですか？
  choices:
    A: ラジオの調整。
    B: 電話での通話やテキストメッセージの送信。
    C: 食事をとること。
    D: 髪をとかすこと。
  answer: B
  explanation: マニュアルには、「運転中に電話で話したり、テキストメッセージを送ったりしないでください。それは法律違反です」と明記されています。
- id: 317
  category: alcohol_drugs_health
  question: 一部の市販薬は運転にどのような影響を与える可能性がありますか？
  choices:
    A: 反応時間を改善する可能性がある。
    B: 眠気を誘う可能性がある。
    C: 視力を向上させる。
    D: 運転能力には影響しない。
  answer: B
  explanation: マニュアルは、影響下での運転をしないよう警告しており、「一部の市販薬であっても眠気を誘う可能性がある」と指摘しています。
- id: 318
  category: safe_driving_rules
  question: 交差点に近づいたときに青信号が黄色に変わった場合、どうすべきですか？
  choices:
    A: 赤信号になる前に交差点を通過するために加速する。
    B: 注意して交差点に進入し、交差する交通に道を譲る。
    C: 信号が黄色に変わった後は、すでに交差点内にいない限り、進入してはならない。
    D: すでに交差点の真ん中にいたとしても、直ちに停止する。
  answer: C
  explanation: マニュアルには、「信号が黄色に変わったときにすでに交差点内にいない限り、信号が黄色に変わった後に交差点に進入してはならない」と記載されています。
- id: 319
  category: safe_driving_rules
  question: 制限速度を守ることが重要なのはなぜですか？
  choices:
    A: スピードを出しすぎると、車両の燃費が向上するため。
    B: スピードを出しすぎると、停止や反応のための時間が短くなるため。
    C: タイヤの過度な摩耗を防ぐため。
    D: 黄信号に遭遇しないようにするため。
  answer: B
  explanation: マニュアルには、「制限速度を守ってください。スピードを出しすぎると、停止や反応のための時間が短くなります」と記載されています。
- id: 320
  category: driver_responsibility
  question: 10代のドライバーのために車両を選ぶ際、保護者は何を優先すべきですか？
  choices:
    A: 車両のイメージやスタイル。
    B: 車両の最高速度性能。
    C: 安全性。
    D: 車両のオーディオやエンターテインメントシステム。
  answer: C
  explanation: 「10代の子供を持つ保護者へのヒント」のセクションでは、保護者に対して「イメージではなく、安全性のために車両を選ぶこと」とアドバイスしています。
- id: 321
  category: driver_responsibility
  question: 10代のドライバーが経験を積み、適切な判断ができるようになるにつれて、保護者に推奨される戦略は何ですか？
  choices:
    A: 即座に無制限の運転特権を与えること。
    B: 段階的な特権付与のための戦略を立てること。
    C: 知識をテストするために仮免許を取り消すこと。
    D: 監督下での運転練習時間を減らすこと。
  answer: B
  explanation: マニュアルでは、経験を積み適切な判断ができるようになるにつれて、10代のドライバーがより高いレベルの運転責任へと移行できるよう、段階的な特権付与のための戦略を立てることを推奨しています。
- id: 322
  category: vehicle_information
  question: オフロード車両（ORV）を運転または乗車する際、DOT（米国運輸省）承認のヘルメット着用が義務付けられている年齢要件は何ですか？
  choices:
    A: 16歳未満の全員。
    B: 18歳未満の全員。
    C: 21歳未満の全員。
    D: 年齢に関わらず、すべての乗員。
  answer: B
  explanation: マニュアルには次のように記載されています。「ORVを運転または乗車する18歳未満の者は、米国運輸省（DOT）が定めた基準を満たすヘルメットを着用しなければならない。」
- id: 323
  category: driver_responsibility
  question: オフロード車両（ORV）を所有している場合、未成年者に関して禁止されている行為は何ですか？
  choices:
    A: 18歳未満の者がDOT承認のヘルメットを着用せずにORVを運転することを、知りながら許可すること。
    B: いかなる状況においても、18歳未満の者が私有地でORVに乗ることを許可すること。
    C: 21歳未満の者にORVを販売すること。
    D: 16歳未満の者にORVのメンテナンスを行わせること。
  answer: A
  explanation: ORVの所有者または占有者は、18歳未満の者がDOT承認のヘルメットを着用せずにORVを運転することを、知りながら承認または許可してはなりません。
- id: 324
  category: license_system
  question: 資格のある個人がBMVを通じて有権者登録を申請できるのはいつですか？
  choices:
    A: 完全に新規の証明書を取得する場合のみ。
    B: 大統領選挙の年のみ。
    C: 証明書の新規取得、更新、再発行、または記載事項変更を行うとき。
    D: BMVの店舗に直接出向く場合のみ。
  answer: C
  explanation: マニュアルには次のように記載されています。「新規、更新、再発行、または記載事項変更の証明書を取得する個人は、投票資格がある場合、有権者登録の申請も行うことができます。」
- id: 325
  category: license_system
  question: インディアナ州法に基づき、運転免許証の新規取得または更新時にBMVが選抜徴兵制度（Selective Service system）に情報を提出することを義務付けているのは、どのグループですか？
  choices:
    A: 18歳未満のすべての個人。
    B: 26歳未満の男性。
    C: 26歳未満の女性。
    D: 18歳以上のすべての個人。
  answer: B
  explanation: BMVは、運転免許証の新規取得または更新時に、26歳未満の男性を選抜徴兵制度に登録するために必要な情報を提出することが義務付けられています。
- id: 326
  category: penalties_and_points
  question: 義務付けられている場合に選抜徴兵制度（Selective Service system）への登録を怠った場合の罰則は何ですか？
  choices:
    A: 500ドルの罰金が科せられる軽罪（misdemeanor）。
    B: 最大5年の禁錮刑および250,000ドルの罰金が科せられる重罪（felony）。
    C: 1年間の運転特権の即時停止。
    D: 書面による警告と強制的な出廷。
  answer: B
  explanation: マニュアルによると、選抜徴兵制度への登録を怠ることは重罪（felony）であり、最大5年の禁錮刑および250,000ドルの罰金が科せられます。
- id: 327
  category: vehicle_information
  question: 車両登録の更新後、ナンバープレートとステッカーが郵送で届くまでに通常どのくらいの時間がかかりますか？
  choices:
    A: 7日
    B: 14日
    C: 21日
    D: 30日
  answer: C
  explanation: マニュアルでは、さまざまな更新方法（オンライン、電話、郵送）において、「プレートとステッカーは約21日で届きます」と繰り返し述べられています。
- id: 328
  category: vehicle_information
  question: BMVを通じて車両登録を更新する便利な方法として、次の中で記載されていないものはどれですか？
  choices:
    A: BMV Connectキオスクを利用する。
    B: 電話で更新する。
    C: 郵送で更新する。
    D: サードパーティのモバイルアプリを通じて更新する。
  answer: D
  explanation: BMVは、オンライン（IN.gov/BMV）、電話、BMV Connectキオスク、郵送の4つの更新方法を提供しています。サードパーティのモバイルアプリは選択肢として言及されていません。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 徐行して注意深く進む
    B: 一時停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に交通状況と歩行者を確認してください。
  id: 329
- image: yield.png
  category: signs_and_signals
  question: この標識はあなたに何をすることを求めていますか？
  choices:
    A: 一時停止する
    B: 交通の流れに合流するために加速する
    C: 減速し、車両や歩行者に道を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」標識は、減速して車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 330
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターン（転回）する
    B: 注意深く運転を続ける
    C: 停止して後退するか、向きを変える。あなたは逆走しています
    D: そのエリアを素早く抜けるために加速する
  answer: C
  explanation: 赤と白の「WRONG WAY（進入禁止・逆走）」の標識は、一方通行の道路や高速道路のランプで対向車線を走行していることを意味します。直ちに停止し、安全に向きを変えるか後退してください。
  id: 331
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通の流れは一方通行（左方向）である
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」の標識は、その道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 332
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所でのUターン（転回）が禁止されていることを意味します。
  id: 333
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  id: 334
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転者に何を指示していますか？
  choices:
    A: 右側に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先で右車線がなくなる
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 335
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。速度制限の標識は、理想的な条件下におけるそのエリアの法定最高速度を示しています。
  id: 336
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園やアニマルパークがある
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先は狩猟エリアである
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色のひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 337
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区域
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 338
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型のクロスバック（踏切警標）は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 339
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: より大きな減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 340
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先に1つのカーブ
    C: 反対方向への2つの連続するカーブ（S字カーブ）
    D: この先にラウンドアバウト（環状交差点）
  answer: C
  explanation: 反対方向へのカーブ（背向曲線）の標識は、この先に反対方向への2つのカーブがあることを警告しています。減速し、道路が最初に一方に曲がり、次に反対側に曲がることに備えてください。
  id: 341
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 1つの急なカーブ
    B: 滑りやすい路面
    C: この先に連続するカーブや曲がり角
    D: この先に坂道
  answer: C
  explanation: 「曲がりくねった道」の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、道路状況の変化に注意してください。
  id: 342
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の終了
    B: 他の道路からの交通の合流
    C: 分離高速道路の開始
    D: 道路が1車線に狭まる
  answer: B
  explanation: 黄色のひし形の「合流」標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
  id: 343
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 分離高速道路の開始
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって反対方向の交通が分離された「分離高速道路」になることを警告しています。右側を通行してください。
  id: 344
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識はこの先に何を予測するよう伝えていますか？
  choices:
    A: 「譲れ」の標識
    B: 信号機
    C: 一時停止しなければならない「止まれ」の標識
    D: スピードバンプ（段差）
  answer: C
  explanation: この標識は、この先に一時停止の標識があることを警告しています。減速を開始し、一時停止標識の場所で完全に停止できるよう準備してください。
  id: 345
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転者
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者のために予約された駐車スペースを示しています。有効な障害者用駐車許可証（プラカード）またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反には高額な罰金が科せられます。
  id: 346
