- id: 100
  category: driver_testing
  question: 失効してから3年が経過した運転免許証を更新するには、何をしなければなりませんか？
  choices:
    A: 罰金を支払い、視力検査のみに合格する
    B: 罰金を支払い、知識試験と視力検査に合格する
    C: 運転技能試験と視力検査に合格する
    D: 罰金を支払い、知識試験、運転技能試験、および視力検査に合格する
  answer: B
  explanation: 180日以上5年未満失効している運転免許証を更新する場合、行政罰金を支払い、知識試験に合格し、標準的な視力検査に合格する必要があります。
- id: 101
  category: license_system
  question: 米国市民または永住権を持つ個人は、運転免許証の更新を有効期限のどのくらい前から行うことができますか？
  choices:
    A: 有効期限の30日前まで
    B: 有効期限の6ヶ月前まで
    C: 有効期限の12ヶ月前まで
    D: 有効期限の24ヶ月前まで
  answer: D
  explanation: 米国市民または永住権を持つ個人は、運転免許証または身分証明書の有効期限が切れる24ヶ月前から更新手続きを行うことができます。
- id: 102
  category: driver_testing
  question: 21歳以上で、運転記録に6点以上の有効な違反点数がある場合、運転免許証を更新するために何が必要ですか？
  choices:
    A: 運転技能試験を受ける必要がある
    B: 知識試験（学科試験）を受ける必要がある
    C: 運転者安全プログラム（DSP）を修了する必要がある
    D: 更新料を2倍支払う必要がある
  answer: B
  explanation: 21歳以上で、運転記録に6点以上の有効な違反点数がある場合、運転免許証を更新するには知識試験（学科試験）に合格する必要があります。
- id: 103
  category: license_system
  question: 米国軍に従事し、インディアナ州外に一時的に居住している場合、除隊後、運転免許証はいつまで有効ですか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 180日間
  answer: C
  explanation: 運転免許証は、除隊、配属終了、または軍務による州外居住が終了してから90日間有効です。
- id: 104
  category: driver_responsibility
  question: 主な住所（現住所）を変更した後、何日以内にBMVに通知し、修正された免許証を申請しなければなりませんか？
  choices:
    A: 10日以内
    B: 15日以内
    C: 30日以内
    D: 60日以内
  answer: C
  explanation: インディアナ州の免許証を保持している場合、主な（法的）住所を変更してから30日以内にBMVに通知し、修正された免許証を申請する必要があります。
- id: 105
  category: license_system
  question: 運転免許証の氏名を正式に変更するためにBMVの支局を訪れる前に、何をしなければなりませんか？
  choices:
    A: オンラインで車両登録の氏名を変更する
    B: 社会保障局（SSA）を訪れ、少なくとも1営業日待つ
    C: BMVコネクト・キオスクで郵送先住所を更新する
    D: 運転者安全プログラム（DSP）を修了する
  answer: B
  explanation: まず社会保障局（SSA）を訪れて社会保障書類の氏名を正式に変更し、その手続きが完了してから少なくとも1営業日待ってからBMVの支局を訪れる必要があります。
- id: 106
  category: penalties_and_points
  question: 制限速度を時速16〜25マイル超過して走行した場合、運転記録に何点の違反点数が加算されますか？
  choices:
    A: 2点
    B: 4点
    C: 6点
    D: 8点
  answer: B
  explanation: 違反点数表によると、制限速度を時速16〜25マイル超過した場合は4点が加算されます。
- id: 107
  category: penalties_and_points
  question: インディアナ州の運転記録において、違反点数はどのくらいの期間有効（アクティブ）なまま残りますか？
  choices:
    A: 有罪判決日から1年間
    B: 有罪判決日から2年間
    C: 有罪判決日から3年間
    D: 有罪判決日から5年間
  answer: B
  explanation: 違反点数は、有罪判決日から2年間、運転記録上で有効なまま残ります。
- id: 108
  category: defensive_driving
  question: インディアナ州のドライバーがBMV承認の運転者安全プログラム（DSP）を修了した場合、何点のポイントクレジット（減点）を受けることができますか？
  choices:
    A: 2点のクレジット
    B: 3点のクレジット
    C: 4点のクレジット
    D: 6点のクレジット
  answer: C
  explanation: インディアナ州のドライバーは、BMV承認のプロバイダーによるDSPコースを修了することで、4点のポイントクレジットを受けることができます。
- id: 109
  category: penalties_and_points
  question: 21歳以上のドライバーが12ヶ月以内に何回以上の交通違反で有罪判決を受けた場合、BMVは運転者安全プログラム（DSP）の受講を義務付けることがありますか？
  choices:
    A: 2回以上
    B: 3回以上
    C: 4回以上
    D: 5回以上
  answer: A
  explanation: BMVは、12ヶ月以内に2回以上の交通違反で有罪判決を受けた21歳以上のドライバーに対し、BMV承認のDSPコースの修了を義務付けることがあります。
- id: 110
  category: driver_responsibility
  question: インディアナ州における、1回の事故あたりの物損に対する州の最低保険基準額はいくらですか？
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: 州の最低保険基準には、1回の事故あたりの物損に対して$25,000が含まれており、これは一般的に「25/50/25」賠償責任保険の一部として知られています。
- id: 111
  category: driver_responsibility
  question: BMVが財政的責任の証明を求めた場合、保険会社から電子的にコンプライアンス証明書（COC）が届くまでに何日間の猶予がありますか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: D
  explanation: COCは、BMVが財政的責任の確認依頼を郵送してから90日以内に、保険会社から電子的に受信され、BMVによって処理される必要があります。
- id: 112
  category: penalties_and_points
  question: 免許停止中の運転、または路上での速度競走（スピードコンテスト）に参加した場合、何ポイントが科せられますか？
  choices:
    A: 4ポイント
    B: 6ポイント
    C: 8ポイント
    D: 10ポイント
  answer: C
  explanation: マニュアルでは、「免許停止中の運転」と「路上での速度競走」の両方を、8ポイントが科せられる違反として記載しています。
- id: 113
  category: license_system
  question: BMVの窓口に行く必要があるまでに、オンラインで免許証（資格証）を再発行できる最大回数は何回ですか？
  choices:
    A: 3回
    B: 5回
    C: 10回
    D: 15回
  answer: C
  explanation: 窓口での再発行が必要になる前に、オンラインで免許証を再発行できる回数は最大10回までです。
- id: 114
  category: driver_responsibility
  question: インディアナ州における自動車賠償責任保険の最低補償額はいくらですか？
  choices:
    A: 20/40/20
    B: 25/50/25
    C: 50/100/50
    D: 10/25/10
  answer: B
  explanation: マニュアルによると、州の最低自動車賠償責任補償額は25/50/25です。
- id: 115
  category: penalties_and_points
  question: BMVが財政的責任の確認依頼を郵送した後、保険会社が電子的にコンプライアンス証明書（COC）を処理するまでに何日間の猶予がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 120日
  answer: C
  explanation: COCは、BMVが財政的責任の確認依頼を郵送してから90日以内に、保険会社から電子的に受信され、BMVによって処理される必要があります。
- id: 116
  category: driver_responsibility
  question: SR22フォームの目的は何ですか？
  choices:
    A: 交通事故をBMVに報告するため
    B: 将来の財政的責任の証明を示すため
    C: 既存の保険契約を解約するため
    D: 会社所有の車両を登録するため
  answer: B
  explanation: インディアナ州法では、運転免許の効力を回復させるために、保険会社を通じて将来の財政的責任の証明（SR22フォーム）を電子的に提出することが義務付けられています。
- id: 117
  category: penalties_and_points
  question: SR22の義務期間中に、BMVが保険会社からSR26通知を受け取った場合、どうなりますか？
  choices:
    A: 有効なSR22が受理されるか期間が終了するまで、運転免許が停止されます。
    B: 保険料が減額されます。
    C: 運転技能試験の再受験が求められます。
    D: 車両登録が永久に抹消されます。
  answer: A
  explanation: BMVがSR26（SR22保険の解約）通知を受け取った場合、インディアナ州法に基づき、BMVは有効なSR22保険証券を受理するか、SR22の義務期間が終了するまで、運転免許を停止しなければなりません。
- id: 118
  category: penalties_and_points
  question: 2015年1月1日以降に発生した、最初の無保険による免許停止処分に対する再交付手数料はいくらですか？
  choices:
    A: $150
    B: $225
    C: $250
    D: $500
  answer: C
  explanation: 2015年1月1日以降に発生した最初の無保険による免許停止の場合、再交付手数料は250ドルです。
- id: 119
  category: penalties_and_points
  question: 無保険による再交付手数料を支払わずに、運転免許を回復させるにはどうすればよいですか？
  choices:
    A: 安全運転講習（ディフェンシブ・ドライビング・コース）を修了する
    B: 将来の財政的責任の証明（SR22フォーム）を提出し、180日間継続して維持する
    C: 元の交通違反切符の罰金を全額支払う
    D: BMVに不服申し立ての手紙を書く
  answer: B
  explanation: 保険会社から将来の財政的責任の証明（SR22フォーム）を電子的に提出し、そのSR22を180日間継続して維持することで、無保険による再交付手数料を支払わずに運転免許を回復させることができます。
- id: 120
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）が法定限度であるどの値を超えると、車両の運転は刑事罰の対象となりますか？
  choices:
    A: '.04'
    B: '.06'
    C: '.08'
    D: '.10'
  answer: C
  explanation: 酒気帯び状態、または法定限度（.08）を超える血中アルコール濃度（BAC）で車両を運転することは刑事罰の対象となります。
- id: 121
  category: alcohol_drugs_health
  question: 個人の血中アルコール濃度（BAC）を決定する際の主な要因として挙げられているのは次のうちどれですか？
  choices:
    A: 個人の身長
    B: 摂取したアルコールの種類
    C: 個人の体重
    D: 飲酒前に食べた食事の量
  answer: C
  explanation: 個人の血中アルコール濃度（BAC）を決定する主な要因は、アルコールの摂取量、アルコールを摂取した速さ、および個人の体重です。
- id: 122
  category: penalties_and_points
  question: アルコールの化学検査（薬物・アルコール検査）に不合格となった運転者に対する罰則は何ですか？
  choices:
    A: 90日間の運転免許停止
    B: 180日間の運転免許停止
    C: 1年間の運転免許停止
    D: 2年間の運転免許停止
  answer: B
  explanation: 化学検査に不合格となった運転者は、180日間の運転免許停止処分を受けます。
- id: 123
  category: penalties_and_points
  question: 運転者が化学検査（薬物・アルコール検査）の受検を拒否した場合、運転免許はどのくらいの期間停止されますか？
  choices:
    A: 180日間
    B: 1年間
    C: 2年間
    D: 3年間
  answer: B
  explanation: 化学検査の受検を拒否した運転者は、1年間の運転免許停止処分を受けます。
- id: 124
  category: alcohol_drugs_health
  question: イグニッション・インターロック装置（飲酒運転防止装置）の機能は何ですか？
  choices:
    A: 法執行機関のために車両の速度と位置を追跡する。
    B: 車を始動させる前に、運転者の血中アルコール濃度を機械的に検査する。
    C: 衝突事故の際に自動的に緊急サービスに連絡する。
    D: 車両が掲示された制限速度を超えないように制限する。
  answer: B
  explanation: 裁判所は、車を始動させる前に運転者の血中アルコール濃度を機械的に検査するイグニッション・インターロック装置の設置を命じることがあります。
- id: 125
  category: alcohol_drugs_health
  question: 酒気帯び状態で船舶を操縦したことによる有罪判決は、運転記録にどのように影響しますか？
  choices:
    A: 自動車の運転記録には一切影響しない。
    B: 警告書は届くが、免許停止にはならない。
    C: 陸運局（BMV）に送付され、運転記録の一部となる。
    D: ボートの免許にのみ影響し、運転免許には影響しない。
  answer: C
  explanation: 酒気帯び状態での船舶操縦による有罪判決は陸運局（BMV）に送付され、その判決は運転記録の一部となります。
- id: 126
  category: penalties_and_points
  question: 裁判所が親による養育費の支払いが滞っていると判断した場合、陸運局（BMV）はどのような措置を取ることができますか？
  choices:
    A: 滞納している親の運転免許を直ちに停止する。
    B: 親の車両を没収する。
    C: 親の車両登録料を2倍にする。
    D: 親に運転技能試験の再受験を義務付ける。
  answer: A
  explanation: 親が養育費を滞納していると判断した裁判所は、陸運局（BMV）に対し、その親の運転免許を直ちに停止するよう命じることができます。
- id: 127
  category: penalties_and_points
  question: サービスや手数料のために陸運局（BMV）に支払いを提出し、その支払いが不渡り（例：不渡り小切手）となった場合、どうなりますか？
  choices:
    A: 30日以内の支払いを求める警告書が届く。
    B: 運転免許が無期限で停止される。
    C: 社会奉仕活動に従事することが義務付けられる。
    D: 車両が押収される。
  answer: B
  explanation: サービスや手数料のために陸運局（BMV）に提出した支払いが認められなかった場合、BMVは運転免許を無期限で停止します。
- id: 128
  category: driver_responsibility
  question: IN.gov/BMVで自分の運転記録をオンラインで閲覧するのにいくらかかりますか？
  choices:
    A: 1回の閲覧につき5.00ドル
    B: 年間10.00ドル
    C: 無料
    D: 公認コピー1部につき15.00ドル
  answer: C
  explanation: まず最初に行うべきことは自分の運転記録を確認することです。これはIN.gov/BMVでいつでも無料で閲覧できます。
- id: 129
  category: license_system
  question: インディアナ州で公式運転記録（Official Driver Record）を購入する費用はいくらですか？
  choices:
    A: 無料
    B: $4
    C: $10
    D: $15
  answer: B
  explanation: マニュアルによると、公式運転記録は4ドルで購入できます。
- id: 130
  category: penalties_and_points
  question: 裁判所から再交付（復権）情報を受け取った後、陸運局（BMV）が処理を完了するまでに通常どのくらいの時間がかかりますか？
  choices:
    A: 最大48時間
    B: 最大5営業日
    C: 最大10営業日
    D: 最大30日間
  answer: C
  explanation: 裁判所から再交付情報を受け取った後、陸運局（BMV）による処理には最大10営業日かかる場合があります。
- id: 131
  category: license_system
  question: 閲覧用運転記録（Viewable Driver Record）について、正しいものはどれですか？
  choices:
    A: 閲覧には4ドルかかります。
    B: 雇用主向けの公式な証明書として使用できます。
    C: 印刷することはできず、公式な運転記録の証明書として使用すべきではありません。
    D: BMV Connectのキオスクでのみ利用可能です。
  answer: C
  explanation: 閲覧用運転記録（Viewable Driver Record）は印刷することができず、運転記録の公式な証明書として使用することはできません。
- id: 132
  category: penalties_and_points
  question: 常習的交通違反者（HTV）法のセクションAに基づき、飲酒または薬物等の影響下での運転により死亡事故を起こし、10年以内に2回の判決を受けた場合、運転特権はどのくらいの期間停止されますか？
  choices:
    A: 5年間
    B: 10年間
    C: 15年間
    D: 生涯
  answer: D
  explanation: 飲酒または薬物等の影響下での運転により死亡事故を起こし、10年以内に2回の判決を受けた運転者は、運転特権が生涯停止されます。
- id: 133
  category: penalties_and_points
  question: 無謀運転やドラッグレースなどの重大な違反を10年以内に3回犯した運転者は、どのくらいの期間の運転特権停止に直面しますか？
  choices:
    A: 3年間
    B: 5年間
    C: 10年間
    D: 生涯
  answer: C
  explanation: セクションBに基づき、規定のリストにある重大な違反を10年以内に3回犯した運転者は、10年間の運転特権停止となります。
- id: 134
  category: penalties_and_points
  question: 少なくとも1つの重大な違反を含む、10年以内に10回以上の交通違反を犯した運転者に対する罰則は何ですか？
  choices:
    A: 1年間の停止
    B: 5年間の停止
    C: 10年間の停止
    D: 生涯停止
  answer: B
  explanation: セクションCに基づき、10年間に10回以上の交通違反（そのうち1つが重大な違反である場合）を犯した常習的交通違反者（HTV）は、5年間の運転特権停止の対象となります。
- id: 135
  category: license_system
  question: インディアナ州の運転免許証にある「制限事項5（Restriction 5）」は何を示していますか？
  choices:
    A: 運転者は矯正レンズ（眼鏡・コンタクト）を着用しなければならない。
    B: 運転者は日中の運転のみに制限されている。
    C: 運転者は、困窮、保護観察、条件付き、または特別運転特権を付与されている。
    D: 運転者はイグニッション・インターロック装置（アルコール検知式エンジン始動制限装置）を装備した車両を運転しなければならない。
  answer: C
  explanation: 「制限事項5（Restriction 5）」は、裁判所の命令により、困窮、保護観察、条件付き、または特別運転特権（Specialized
    Driving Privileges）を付与された人の免許証に記載されます。
- id: 136
  category: license_system
  question: 裁判所から特別運転特権（Specialized Driving Privileges）を付与された人に対する要件は、次のうちどれですか？
  choices:
    A: 有効なSR22（保険証明）をBMVに登録し続けること。
    B: 6ヶ月ごとに安全運転講習を修了すること。
    C: マニュアル車のみを運転すること。
    D: 有効に発行された免許証をBMVに返納すること。
  answer: A
  explanation: 特別運転特権を付与された人は、その特権の期間中、有効なSR22（保険証明）をBMVに登録し維持し続ける必要があります。
- id: 137
  category: signs_and_signals
  question: 茶色の交通標識は、どのような種類の情報を示していますか？
  choices:
    A: 一時的な交通状況
    B: 道路サービスとアメニティ（施設）
    C: 近隣のレクリエーションおよび文化的関心のある場所
    D: 許可された動きと方向
  answer: C
  explanation: 茶色の交通標識は、州立公園などの近隣のレクリエーションおよび文化的関心のある場所を示します。
- id: 138
  category: signs_and_signals
  question: 前方の出口にある施設（アメニティ）に関する情報を表示する交通標識の背景色は、通常何色ですか？
  choices:
    A: 緑
    B: 青
    C: 白
    D: オレンジ
  answer: B
  explanation: 青色の交通標識は、前方の出口にある施設などの道路サービスや情報を表示します。
- id: 139
  category: signs_and_signals
  question: 高速道路の建設工事など、一時的な交通状況を運転者に警告する交通標識には何色が使用されますか？
  choices:
    A: 黄色
    B: 赤
    C: オレンジ
    D: 茶色
  answer: C
  explanation: オレンジ色の交通標識は、多くの場合、高速道路の建設や保守プロジェクトによる一時的な交通状況を運転者に警告します。
- id: 140
  category: signs_and_signals
  question: 白色の交通標識は、通常何を表示していますか？
  choices:
    A: 制限速度などの交通規制
    B: 特定の道路上の危険に対する警告
    C: 近隣の病院への道順
    D: レクリエーションおよび文化的関心のある場所
  answer: A
  explanation: 白色の交通標識は、運転者が従わなければならない制限速度などの交通規制や、州道のマーカーなどの役立つ情報を表示します。
- id: 141
  category: signs_and_signals
  question: 「路面濡れ時スリップ注意（Slippery When Wet）」の標識は、特定の道路状況に対してドライバーに注意を促す標識の一例です。この標識の背景は何色ですか？
  choices:
    A: 赤
    B: オレンジ
    C: 黄色
    D: 緑
  answer: C
  explanation: 黄色または蛍光黄緑色の標識は、前方の特定の道路状況や危険に対してドライバーに注意を促します。「路面濡れ時スリップ注意」の標識は、背景が黄色の交通標識の一例です。
- id: 142
  category: signs_and_signals
  question: 赤色の交通標識はドライバーに何を伝えていますか？
  choices:
    A: 許可された動きや案内
    B: 安全への脅威を避けるために即時の行動を必要とする交通規制
    C: 近くのスクールゾーンや歩行者横断歩道
    D: 工事による一時的な道路状況
  answer: B
  explanation: 赤色の交通標識は、「進入禁止（Wrong Way）」の標識のように、交通の安全に対する脅威を避けるためにドライバーが即座に行動をとる必要がある交通規制を伝えています。
- id: 143
  category: penalties_and_points
  question: 常習的交通違反者法（Habitual Traffic Violator laws）のセクションAにおいて、2回の判決が累積した場合に10年間の免許停止につながる可能性がある重大な違反は次のうちどれですか？
  choices:
    A: 10年間で9回のスピード違反
    B: 自動車の運転に起因する無謀運転致死
    C: 免許停止中の運転
    D: ウインカーの使用忘れ
  answer: B
  explanation: 自動車の運転に起因する無謀運転致死は、負傷または死亡に至る重大な違反としてセクションAに記載されています。
- id: 144
  category: signs_and_signals
  question: 蛍光黄緑色の交通標識はドライバーに何を警告していますか？
  choices:
    A: 高速道路の工事区域
    B: 近くの学校、歩行者、および自転車
    C: 前方の踏切
    D: 即時の行動を必要とする交通規制
  answer: B
  explanation: 蛍光黄緑色の標識は、近くの学校、歩行者、自転車、遊び場、およびスクールバスのルートをドライバーに警告します。
- id: 145
  category: signs_and_signals
  question: ペナント型（三角形の横向き）の交通標識はどこに設置され、何を示していますか？
  choices:
    A: 道路の右側に設置され、スクールゾーンを示す
    B: 対面通行の道路の左側に設置され、左側からの追い越し禁止を警告する
    C: 交差点に設置され、一時停止の必要性を示す
    D: 踏切の手前に設置され、列車の接近を警告する
  answer: B
  explanation: ペナント型の交通標識は、対面通行の道路の左側に設置され、他の車両を左側から追い越さないようドライバーに警告します。
- id: 146
  category: signs_and_signals
  question: 円形の交通標識は、どのような種類の危険や状況をドライバーに知らせますか？
  choices:
    A: 前方の踏切
    B: 滑りやすい路面状況
    C: 前方の急カーブ
    D: 高速道路の工事区域
  answer: A
  explanation: 円形の交通標識は、前方に踏切があることをドライバーに知らせます。
- id: 147
  category: signs_and_signals
  question: 五角形の交通標識は、何に近づいていることを示していますか？
  choices:
    A: 一時停止が必要な交差点
    B: 前方優先（Yield）の交差点
    C: 子供が横断している可能性のある学校近くの区域
    D: 追い越し禁止区域
  answer: C
  explanation: 五角形の交通標識は、子供が道路を横断している可能性のある学校近くの区域に入ろうとしていることをドライバーに警告します。
- id: 148
  category: vehicle_information
  question: 低速車両マーク（slow-moving vehicle emblem）は、その車両が時速何マイルを超えて走行できないことを示していますか？
  choices:
    A: 時速15マイル
    B: 時速20マイル
    C: 時速25マイル
    D: 時速30マイル
  answer: C
  explanation: 低速車両マークは、中心部がオレンジ色の蛍光色で、縁が赤色の反射材になっており、時速25マイルを超えて走行できない低速車両であることを示します。
- id: 149
  category: signs_and_signals
  question: 低速車両マーク（slow-moving vehicle emblem）は何色で構成されていますか？
  choices:
    A: 黄色の背景に黒の縁取り
    B: オレンジ色の蛍光色の中心部と赤色の反射材の縁取り
    C: 赤色の中心部と白色の反射材の縁取り
    D: 蛍光黄緑色の中心部と黒の縁取り
  answer: B
  explanation: 低速車両マークは、中心部がオレンジ色の蛍光色で、縁が赤色の反射材になっています。
- id: 150
  category: signs_and_signals
  question: オレンジ色の交通標識は一般的に何を示していますか？
  choices:
    A: ドライバー向けサービスやレクリエーションエリア
    B: 高速道路の工事および保守区域
    C: スクールゾーンや歩行者横断歩道
    D: 即座に従わなければならない交通規制
  answer: B
  explanation: オレンジ色の高速道路工事用標識は、工事区域に近づく際に注意するようドライバーに警告します。
- id: 151
  category: safe_driving_rules
  question: 交差点に接近中、黄色の点灯信号に変わったが、安全に停止するには交差点に近すぎる場合はどうすべきですか？
  choices:
    A: 急ブレーキをかけて交差点内で停止する
    B: 赤信号になる前に通過できるよう加速する
    C: そのまま交差点を通過して進行を完了してもよい
    D: 直ちに道路の右側に寄せて停車する
  answer: C
  explanation: 黄色の点灯信号は、優先権が終了することを意味します。交差点に接近しており、安全に停止できないほど近い場合は、そのまま進行を完了させることができます。
- id: 152
  category: safe_driving_rules
  question: 矢印のない青信号の交差点で左折する場合、一度に何台の車両が左折のために交差点内に進入できますか？
  choices:
    A: 入れるだけの台数
    B: 一度に1台のみ
    C: 一度に2台
    D: 信号が赤になるまで進入してはならない
  answer: B
  explanation: 矢印のない青信号の場合、交差点内がクリアであれば左折のために進行できますが、左折のために交差点内に進入できるのは一度に1台のみです。
- id: 153
  category: safe_driving_rules
  question: 右左折用の黄色の点滅矢印信号は何を意味しますか？
  choices:
    A: 自分に優先権があり、対向車は道を譲らなければならない
    B: 歩行者と対向車に道を譲った後でのみ、曲がることができる
    C: 完全に停止し、青色の矢印信号を待たなければならない
    D: その交差点は右左折禁止である
  answer: B
  explanation: 右左折用の黄色の点滅矢印信号は、歩行者および対向車に優先権を譲った後でのみ、進行できることを意味します。
- id: 154
  category: safe_driving_rules
  question: 赤信号の交差点で左折が許可されるのは、どのような条件のときですか？
  choices:
    A: 対面通行の道路から一方通行の道路へ曲がる場合
    B: 一方通行の道路から対面通行の道路へ曲がる場合
    C: 一方通行の道路から別の一方通行の道路へ曲がる場合
    D: 赤信号での左折は決して許可されない
  answer: C
  explanation: 一方通行の道路から別の一方通行の道路へ曲がる場合に限り、赤信号または赤色の矢印信号であっても交差点を左折することができます。
- id: 155
  category: safe_driving_rules
  question: 赤信号での右折が許可されている場合、右折する前に義務付けられていることは何ですか？
  choices:
    A: 曲がる前に時速5マイルまで減速する
    B: 完全に停止し、車両や歩行者がいないか確認する
    C: 交差する車両に警告するためにクラクションを鳴らす
    D: ハザードランプを点灯させる
  answer: B
  explanation: 赤信号や赤色の矢印信号で右折が許可されている場合、まず完全に停止し、進行方向や進入しようとしている経路に車両や歩行者がいないことを確認しなければなりません。
- id: 156
  category: signs_and_signals
  question: 矢印のない黄色の点滅信号がある交差点に接近する際、どうすべきですか？
  choices:
    A: 完全に停止し、青信号を待つ
    B: 全方向一時停止（4-way stop）の交差点として扱う
    C: 減速し、注意して交差点を通過する
    D: 素早く交差点を抜けるために加速する
  answer: C
  explanation: 交差点で矢印のない黄色の点滅信号が表示されている場合は、減速し、注意を払って交差点を通過する必要があります。
- id: 157
  category: signs_and_signals
  question: 正三角形の交通標識は何を示していますか？
  choices:
    A: 減速し、優先権を譲るために完全に停止する準備をするよう警告している
    B: 前方にスクールゾーンがあることを示している
    C: 前方に踏切があることをドライバーに知らせている
    D: 追い越し禁止区間の始まりを示している
  answer: A
  explanation: 三辺の長さが等しい正三角形の標識（譲れ/Yield）は、交差点に接近する際に減速し、他の車両や歩行者に優先権を譲るためにいつでも停止できる態勢をとるようドライバーに警告するものです。
- id: 158
  category: signs_and_signals
  question: 一時停止標識（STOPサイン）の下に取り付けられた補助標識の目的は何ですか？
  choices:
    A: 交差する道路の制限速度を示すため
    B: 交差点のどの方向が停止義務があるかを示すため
    C: 近くのスクールゾーンを警告するため
    D: 次の町までの距離を示すため
  answer: B
  explanation: 一時停止標識の下には、その交差点でどの方向の交通が停止しなければならないか（例：「ALL WAY」など）を示す補助標識が設置されることがあります。
- id: 159
  category: signs_and_signals
  question: 交差点で矢印のない黄色の点滅信号が表示されている場合、何を意味しますか？
  choices:
    A: 停止して青信号を待つ
    B: 減速し、注意して交差点を通過する
    C: 自分に優先権があるため、減速する必要はない
    D: 信号機が故障しているため、全方向一時停止として扱う
  answer: B
  explanation: マニュアルによると、矢印のない黄色の点滅信号は、減速して注意深く交差点を通過すべきであることを意味します。
- id: 160
  category: signs_and_signals
  question: 全車両に停止義務がある交差点で、あなたともう一人のドライバーが同時に赤色の点滅信号に到着した場合、どちらが優先権を譲らなければなりませんか？
  choices:
    A: 右側にいる車両
    B: 左側にいる車両
    C: より速い速度で走行している車両
    D: 右折しようとしている車両
  answer: B
  explanation: マニュアルには、全車両が停止義務のある交差点に複数のドライバーが同時に到着した場合、左側の車両が右側の車両に優先権を譲らなければならないと記されています。
- id: 161
  category: vehicle_information
  question: オートバイを運転している人が、青に変わらない赤信号を通過できるのはどのような条件の場合ですか？
  choices:
    A: 少なくとも2分間完全に停止し、細心の注意を払った後。
    B: クラクションを鳴らし、30秒間待った後。
    C: 交通整理を行う警察官がいる場合に限る。
    D: オートバイが赤信号を通過することは、いかなる場合も許可されていない。
  answer: A
  explanation: 信号機によって制御されている交差点に接近したオートバイおよび原動機付自転車の運転者は、少なくとも2分間完全に停止し、細心の注意を払った後であれば、変わらない赤信号を通過することができます。
- id: 162
  category: vehicle_information
  question: オートバイが2分間待機した後に赤信号を通過できるというルールは、オートサイクル（autocycles）にも適用されますか？
  choices:
    A: はい、オートサイクルはすべてのオートバイのルールに従います。
    B: はい、ただし2分ではなく3分待たなければなりません。
    C: いいえ、このルールはオートサイクルには適用されません。
    D: いいえ、オートサイクルはすべての赤信号を一時停止（yield）の標識として扱わなければなりません。
  answer: C
  explanation: マニュアルには、2分間待機することで赤信号での長時間の待ちを回避できるというルールは、オートサイクル（autocycles）には適用されないと明記されています。
- id: 163
  category: signs_and_signals
  question: 作動していない信号機のある交差点に近づいた場合、どのように進むべきですか？
  choices:
    A: 道路が空いていれば、停止せずに交差点を通過する。
    B: 交差点に入る前に停止し、先に到着した車両や右側の車両に道を譲る。
    C: 交差点を一時停止（yield）標識として扱い、減速する。
    D: 交通整理のために警察官が到着するまで待つ。
  answer: B
  explanation: 作動していない信号機のある交差点に近づいた場合は、進入前に停止し、交差する交通、自分より先に停止した車両、同時に到着した右側の車両、および歩行者に道を譲った後、注意して進む必要があります。
- id: 164
  category: signs_and_signals
  question: 歩行者が歩行者用ハイブリッドビーコン（pedestrian hybrid beacon）を作動させた直後、信号は何を表示しますか？
  choices:
    A: 赤色の点灯。
    B: 黄色の点滅。
    C: 黄色の点灯。
    D: 2つの赤色の点滅。
  answer: B
  explanation: 歩行者によって作動されると、歩行者用ハイブリッドビーコンはまず黄色の点滅を表示し、ドライバーが横断歩道を通過して空けられるようにします。
- id: 165
  category: safe_driving_rules
  question: 道路上の黄色の車線境界線は何を示していますか？
  choices:
    A: 同じ方向に進む複数の車線を区切っている。
    B: バスまたは公共交通機関専用車線であることを示している。
    C: 反対方向に進む複数の車線を区切っている。
    D: 歩行者横断区域であることを示している。
  answer: C
  explanation: マニュアルによると、黄色の車線境界線は、反対方向に進む複数の車線を区切るために使用されます。
- id: 166
  category: safe_driving_rules
  question: 他の車両を追い越す際、対向車の前で道路の右側に戻るまでに、最低でもどのくらいの距離を空ける必要がありますか？
  choices:
    A: 50フィート以上。
    B: 100フィート以上。
    C: 200フィート以上。
    D: 500フィート以上。
  answer: B
  explanation: 追い越しを行う際は、対向車から100フィート以上の距離がある状態で、道路の右側（元の車線）に戻らなければなりません。
- id: 167
  category: defensive_driving
  question: 車線変更をする前に、死角を確認するために何をすべきですか？
  choices:
    A: バックミラー（ルームミラー）だけに頼る。
    B: 進入しようとしている車線の方へ素早く顔を向けて確認する。
    C: クラクションを鳴らして、死角にいる車両に警告する。
    D: ヘッドライトを2回点滅させる。
  answer: B
  explanation: 車線変更をする際は、進入しようとしている車線の方を短時間目視で確認し、死角に車両がいないことを確かめる必要があります。
- id: 168
  category: safe_driving_rules
  question: 次のうち、他の車両を追い越すことが危険であり、かつ違法となる状況はどれですか？
  choices:
    A: 黄色の破線がある道路を走行しているとき。
    B: 交差点、踏切、橋、高架橋、またはトンネルから100フィート以内の場所。
    C: 前方の車両が制限速度以下で走行しているとき。
    D: 白色の破線がある多車線道路。
  answer: B
  explanation: 交差点、踏切、橋、高架橋、またはトンネルから100フィート以内の場所で他の車両を追い越そうとすることは、危険であり違法です。
- id: 169
  category: sharing_the_road
  question: 他の車両があなたの車の左側から追い越しをしようとしている場合、どうすべきですか？
  choices:
    A: 追い越しを阻止するために速度を上げる。
    B: 相手をブロックするために左車線に移動する。
    C: 相手の車両が安全に追い越せるようにし、速度を上げない。
    D: 対向車を知らせるためにクラクションを鳴らす。
  answer: C
  explanation: 他の車両があなたの左側から追い越しをしている場合は、その車両が安全に追い越せるように協力し、速度を上げてはいけません。
- id: 170
  category: safe_driving_rules
  question: 右折の準備をする際、適切な車線の位置はどこですか？
  choices:
    A: 進行方向の一番左側の車線。
    B: 中央の車線。
    C: 進行方向の一番右側の車線。
    D: 方向指示器（ウィンカー）を出していれば、どの車線でもよい。
  answer: C
  explanation: 右折する場合は、進行方向の一番右側の車線にいる必要があります。
- id: 171
  category: signs_and_signals
  question: 自転車用の信号機で黄色の自転車のシンボルが表示されている場合、自転車利用者に対して何を示していますか？
  choices:
    A: 優先権が終了すること。
    B: 注意して進むこと。
    C: 歩行者に道を譲ること。
    D: 自転車専用レーンが終了すること。
  answer: A
  explanation: 車両用信号と同様に、黄色の自転車信号は優先権が終了することを意味します。
- id: 172
  category: signs_and_signals
  question: バスまたは公共交通機関専用車線を制御し、バスまたは公共交通機関の運転手のみに適用される信号の種類は何ですか？
  choices:
    A: 黄色の三角形を表示する信号。
    B: 白色の長方形のバーを表示する信号。
    C: 赤色の点滅する円を表示する信号。
    D: 緑色の矢印を表示する信号。
  answer: B
  explanation: 白色の長方形のバーを表示する信号は、バスまたは公共交通機関専用車線を制御し、バスまたは公共交通機関の運転手のみに適用されます。
- id: 173
  category: safe_driving_rules
  question: 停止線も横断歩道もない交差点で一時停止標識（ストップサイン）に近づいた場合、どこで停止すべきですか？
  choices:
    A: 交差する道路の端。
    B: 交差点に入る前。
    C: 一時停止標識の10フィート手前。
    D: 交通状況を確認するために交差点の真ん中。
  answer: B
  explanation: 停止線も横断歩道もない場合は、交差点に入る前に完全に停止する必要があります。
- id: 174
  category: driver_testing
  question: 運転技能試験中に手信号を使用することは許可されていますか？
  choices:
    A: はい、ただし灯火信号が故障している場合に限ります。
    B: はい、灯火信号よりも手信号が好まれます。
    C: いいえ、運転技能試験で手信号を使用することはできません。
    D: はい、曲がるかなり前から使用するのであれば可能です。
  answer: C
  explanation: マニュアルによると、運転技能試験で手信号を使用することはできません。
- id: 175
  category: safe_driving_rules
  question: 特別指定された中央車線の適切な使用方法は何ですか？
  choices:
    A: 低速車両の追い越し
    B: 左折のみ
    C: 右折のみ
    D: 緊急時の停車
  answer: B
  explanation: 交通量の多い道路には、左折車両専用の中央車線が設けられていることがよくあります。このような中央車線を他の車両の追い越しに使用してはいけません。
- id: 176
  category: safe_driving_rules
  question: Uターン（転回）が明示的に禁止されている場所はどこですか？
  choices:
    A: 中央分離帯があるUターン用の交差点
    B: 郡道（カウンティ・ロード）
    C: 州間高速道路（インターステート・ハイウェイ）
    D: 都市部の住宅街
  answer: C
  explanation: マニュアルには、州間高速道路でUターンをしてはならないと記載されています。代わりに、次の出口まで進み、反対方向の高速道路に入り直してください。
- id: 177
  category: safe_driving_rules
  question: 全方向一時停止の交差点に2台の車両が同時に到着した場合、どちらの車両が優先権（Right-of-way）を譲らなければなりませんか？
  choices:
    A: 右側の車両
    B: 左側の車両
    C: 大きい方の車両
    D: より速く走行している車両
  answer: B
  explanation: 全方向一時停止の標識がある場所に他のドライバーと同時に到着した場合、左側の車両が優先権を譲らなければなりません。
- id: 178
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）では、交通はどの方向に進みますか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 時計回りと反時計回りの両方
    D: 直線
  answer: B
  explanation: ラウンドアバウトは、右折のみで進入または脱出し、反時計回りに進行する円形の交差点です。
- id: 179
  category: sharing_the_road
  question: 2台の大型トラックが同時にラウンドアバウトに接近、または走行している場合、どうしなければなりませんか？
  choices:
    A: 左車線の運転手は、右車線の運転手に道を譲らなければならない。
    B: 右車線の運転手は、左車線の運転手に道を譲らなければならない。
    C: 両方のトラックは停止し、警察官を待たなければならない。
    D: より重い荷物を積んでいるトラックに優先権がある。
  answer: B
  explanation: 2台の大型トラックが同時にラウンドアバウトに接近、または走行している場合、右車線の運転手は左車線の運転手に優先権を譲らなければなりません。
- id: 180
  category: safe_driving_rules
  question: 地方部の州間高速道路における乗用車の最高速度制限は何ですか？
  choices:
    A: 時速55マイル
    B: 時速60マイル
    C: 時速65マイル
    D: 時速70マイル
  answer: D
  explanation: 地方部の州間高速道路では、乗用車は時速70マイルまたは掲示された速度制限を超えて走行してはなりません。
- id: 181
  category: safe_driving_rules
  question: 路地（アレー）における最高速度制限は何マイルですか？
  choices:
    A: 時速10マイル
    B: 時速15マイル
    C: 時速20マイル
    D: 時速25マイル
  answer: B
  explanation: 路地では、車両は時速15マイルまたは掲示されている速度制限を超えて走行してはなりません。
- id: 182
  category: defensive_driving
  question: 車間距離に関して、ドライバーが従うべき適切なルールは何ですか？
  choices:
    A: 前方の車両から少なくとも1秒以上の距離を保つ
    B: 前方の車両から少なくとも2〜3秒の距離を保つ
    C: 前方の車両から少なくとも4〜5秒の距離を保つ
    D: 時速10マイルごとに車1台分の距離を保つ
  answer: B
  explanation: ドライバーが従うべき良いルールは、前方の車両から少なくとも2〜3秒の距離を保つことです。
- id: 183
  category: safe_driving_rules
  question: 工事現場の速度制限は、その区域に設定されている最高速度制限と比較してどうなっていますか？
  choices:
    A: 設定されている最高速度制限より少なくとも時速5マイル低い
    B: 設定されている最高速度制限より少なくとも時速10マイル低い
    C: 設定されている最高速度制限より少なくとも時速15マイル低い
    D: 設定されている最高速度制限と同じである
  answer: B
  explanation: 工事現場の速度制限は、常にその区域に設定されている最高速度制限よりも少なくとも時速10マイル低く設定されます。
- id: 184
  category: signs_and_signals
  question: トラフィック・サークル（交通円環）はラウンドアバウト（環状交差点）とどのように異なりますか？
  choices:
    A: トラフィック・サークルは反時計回りの交通のみである。
    B: トラフィック・サークルは常に信号機で制御されている。
    C: トラフィック・サークルは時計回りと反時計回りの両方の交通がある場合があり、一時停止標識で制御されている場合がある。
    D: トラフィック・サークルは田舎道にのみ存在する。
  answer: C
  explanation: トラフィック・サークルがラウンドアバウトと異なる点は、時計回りと反時計回りの両方の交通がある場合があること、また、進入路が譲れ（Yield）標識ではなく一時停止（Stop）標識で制御されている場合があることです。
- id: 185
  category: defensive_driving
  question: 車両の停止能力に影響を与える要因は次のうちどれですか？
  choices:
    A: 車両の色
    B: タイヤの種類と状態
    C: 時間帯
    D: 車両の乗客数
  answer: B
  explanation: 車両の重量、ブレーキとタイヤの種類と状態、路面の物理的状態や滑りやすさ、道路の勾配など、多くの要因が車両の停止能力に影響を与えます。
- id: 186
  category: sharing_the_road
  question: 地方の州間高速道路（インターステート）において、申告総重量が26,000ポンドを超えるトラックの最高速度制限は何マイルですか？
  choices:
    A: 時速55マイル
    B: 時速60マイル
    C: 時速65マイル
    D: 時速70マイル
  answer: C
  explanation: 地方の州間高速道路では、申告総重量が26,000ポンドを超えるトラックは、時速65マイルまたは掲示されている速度制限を超えて走行してはなりません。
- id: 187
  category: defensive_driving
  question: アンチロック・ブレーキ・システム（ABS）を搭載した車両がスリップし始めた場合、どうすべきですか？
  choices:
    A: ブレーキを素早くポンピングする（断続的に踏む）
    B: ブレーキペダルを一定の強い力で踏み続ける
    C: ブレーキを急激に踏み込み、ハンドルを急に切る
    D: 直ちにパーキングブレーキをかける
  answer: B
  explanation: 車両にアンチロック・ブレーキ・システム（ABS）が搭載されている場合は、通常通りハンドル操作を行いながら、ブレーキペダルを一定の強い力で踏み続けてください。ブレーキをポンピングしてはいけません。
- id: 188
  category: defensive_driving
  question: 車両が路道から外れてしまった場合の適切な操縦技術は何ですか？
  choices:
    A: すぐに舗装路に戻るようにハンドルを切る
    B: ブレーキを急激に踏み、ハンドルを鋭く切る
    C: アクセルを緩め、安全を確認してから徐々に路道に戻る
    D: 路道に戻る前に、トラクションを回復させるために加速する
  answer: C
  explanation: 車両が路道から外れた場合は、すぐに舗装路に戻ろうとしないでください。アクセルを緩め、安全が確認できたら、徐々に道路に戻るようにします。
- id: 189
  category: vehicle_information
  question: 乗用車や軽トラックにおいて、時速75マイルでの走行は時速55マイルでの走行と比較して、燃料消費にどのような影響を与えますか？
  choices:
    A: 燃料を約10パーセント多く消費する
    B: 燃料を約25パーセント多く消費する
    C: 燃料を約50パーセント多く消費する
    D: 燃料を約75パーセント多く消費する
  answer: C
  explanation: 燃料消費量は時速45マイルを超えると着実に増加し、乗用車や軽トラックが時速75マイルで走行する場合、時速55マイルで走行するよりも約50パーセント多くの燃料を消費します。
- id: 190
  category: vehicle_information
  question: 車両の推奨タイヤ空気圧（psi）を確認するには、どこを見るべきですか？
  choices:
    A: タイヤのサイドウォール（側面）
    B: 運転席ドアの枠（ドアジャム）の内側のステッカー、またはオーナーズマニュアル
    C: 車両のナンバープレート
    D: エンジンブロック
  answer: B
  explanation: 測定したpsiを、車両の運転席ドアの内側にあるステッカーまたはオーナーズマニュアルに記載されているpsiと比較してください。タイヤのサイドウォールに記載されているpsiと比較してはいけません。
- id: 191
  category: vehicle_information
  question: 1セント硬貨テスト（penny test）を使用してタイヤの摩耗をチェックする場合、タイヤの溝が法的かつ安全な深さであることを示すのはどれですか？
  choices:
    A: リンカーンの頭が完全に見えている
    B: リンカーンの頭の一部が溝に隠れている
    C: 硬貨が溝から落ちる
    D: 溝の深さが正確に1/32インチである
  answer: B
  explanation: リンカーンの頭の一部がタイヤの溝で隠れていれば、法的かつ安全な基準を満たす溝の深さで走行していることになります。
- id: 192
  category: safe_driving_rules
  question: 冬の天候下で、路面の他の部分よりも先に凍結しやすい場所はどこですか？
  choices:
    A: 交差点と横断歩道
    B: 田舎の未舗装路
    C: ランプ（接続道路）、橋、および高架橋
    D: 複数車線の高速道路
  answer: C
  explanation: ランプ、橋、および高架橋の水分は、走行車線の他の部分よりも先に凍結する場合があることに注意してください。
- id: 193
  category: defensive_driving
  question: 濡れた路面で車両がハイドロプレーニング現象を起こす原因は何ですか？
  choices:
    A: オイル、泥、水の薄い層の上を走行すること
    B: 空気圧が高すぎるタイヤで走行すること
    C: 雨の中でヘッドライトをハイビームにすること
    D: ブレーキを頻繁に踏みすぎること
  answer: A
  explanation: 濡れた路面を走行しているとき、車両は実際にはオイル、泥、水の薄い層の上を走行しており、これがハイドロプレーニング現象につながる可能性があります。
- id: 194
  category: defensive_driving
  question: 水たまりを走行した後、ブレーキを乾かすためにすべきことは何ですか？
  choices:
    A: 急加速する
    B: 低いギアにシフトダウンする
    C: ブレーキを数回踏んで（ポンピングして）テストする
    D: パーキングブレーキを数秒間かける
  answer: C
  explanation: 水たまりを走行した後は、ブレーキを数回踏んでテストしてください。そうすることでブレーキを乾かすのに役立ちます。
- id: 195
  category: safe_driving_rules
  question: 霧の中を走行する際、ヘッドライトはどの設定を使用すべきですか？
  choices:
    A: ハイビーム（走行用前照灯）
    B: ロービーム（すれ違い用前照灯）
    C: パーキングライト（車幅灯）のみ
    D: ヘッドライトは点灯せず、非常点滅表示灯（ハザード）のみ
  answer: B
  explanation: ハイビームは使用しないでください。ロービームの方が、前方の道路や物体をより適切に照らします。
- id: 196
  category: defensive_driving
  question: 冠水した場所で車両がエンストした場合、最も安全な行動は何ですか？
  choices:
    A: 車内にとどまり救助を待つ
    B: 窓を閉め、ドアをロックする
    C: できるだけ早く車両を離れる
    D: 繰り返しエンジンを再始動しようとする
  answer: C
  explanation: 冠水した場所で車がエンストした場合は、できるだけ早く車を離れてください。洪水は急速に水位が上がり、車や乗員を押し流す可能性があるためです。
- id: 197
  category: defensive_driving
  question: 夜間の運転中、対向車のヘッドライトの眩しさを避けるにはどうすればよいですか？
  choices:
    A: 対向車のヘッドライトを直視する
    B: 道路の右側に視線を集中させる
    C: 眩しさに対抗するためにハイビームをつける
    D: 車両が通り過ぎるまで片目を閉じる
  answer: B
  explanation: 眩しさを避けるために、接近してくる車両のライトを直視せず、代わりに道路の右側に視線を集中させてください。
- id: 198
  category: safe_driving_rules
  question: 運転者がヘッドライトを使用しなければならないのはいつですか？
  choices:
    A: 午後10時から午前6時の間のみ
    B: 日没から日の出まで、または視界が500フィート未満のとき
    C: 街灯のない田舎道を走行するときのみ
    D: 日の出から日没まで、または視界が1,000フィート未満のとき
  answer: B
  explanation: 運転者は、日没から日の出までの間、および視界が500フィート未満のときはいつでもヘッドライトを使用しなければなりません。
- id: 199
  category: safe_driving_rules
  question: ロービーム（下向きライト）を使用しなければならないのはどのような場合ですか？
  choices:
    A: 対向車から500フィート以内、または他車の後方200フィート以内にいるとき
    B: 対向車から1,000フィート以内、または他車の後方500フィート以内にいるとき
    C: 対向車から200フィート以内、または他車の後方100フィート以内にいるとき
    D: 市街地を走行しているときのみ
  answer: A
  explanation: ヘッドライト点灯時、対向車に500フィート以内に接近する場合、または他車の後方200フィート以内を走行する場合は、ロービームを使用しなければなりません。
- id: 200
  category: vehicle_information
  question: マニュアルによると、車両の横転の可能性を減らすために最も重要な要因は何ですか？
  choices:
    A: 田舎道を完全に避けること
    B: タイヤを適切にメンテナンスすること
    C: 重心の低い車両を運転すること
    D: 時速45マイル以上で運転しないこと
  answer: B
  explanation: 不適切な空気圧や摩耗したタイヤは、車両のコントロールを維持する能力を妨げます。コントロールの維持は、横転の可能性を減らすために最も重要な要因です。
- id: 201
  category: safe_driving_rules
  question: インディアナ州法によると、ドライバーはいつヘッドライトを使用しなければなりませんか？
  choices:
    A: 日没から日の出まで、または視界が500フィート未満のとき
    B: 街灯のない田舎道を走行するときのみ
    C: 午後8時から午前6時までの間
    D: 時速55マイル以上で走行するときはいつでも
  answer: A
  explanation: ドライバーは日没から日の出までの間、および視界が500フィート未満のときはいつでもヘッドライトを使用しなければなりません。
- id: 202
  category: safe_driving_rules
  question: 他の車両の後ろを走行する場合、どのくらいの距離でヘッドライトをロービームに切り替えなければなりませんか？
  choices:
    A: 100フィート以内
    B: 200フィート以内
    C: 300フィート以内
    D: 500フィート以内
  answer: B
  explanation: 対向車と500フィート以内に接近する場合、または先行車の後方200フィート以内に接近する場合は、ヘッドライトをロービームに切り替えなければなりません。
- id: 203
  category: alcohol_drugs_health
  question: 研究によると、18時間眠らずに過ごしたドライバーは、血中アルコール濃度（BAC）がどのレベルのドライバーと同程度の機能低下を招くとされていますか？
  choices:
    A: '.04'
    B: '.06'
    C: '.08'
    D: '.10'
  answer: C
  explanation: 研究により、18時間眠らずに過ごすと、法定のアルコール制限値である血中アルコール濃度（BAC）0.08と同程度の機能低下を招くことが示されています。
- id: 204
  category: driver_responsibility
  question: 疲労に関連した事故の64パーセントを占め、最もリスクが高い年齢層はどれですか？
  choices:
    A: 16-29歳
    B: 30-45歳
    C: 46-60歳
    D: 61歳以上
  answer: A
  explanation: 十分な休息をとらずに運転するという致命的なミスは誰にでも起こり得ますが、16歳から29歳の若年層が最もリスクが高く、疲労関連事故の64パーセントを占めています。
- id: 205
  category: safe_driving_rules
  question: インディアナ州で自動車の運転中に携帯型通信機器を使用することが法的に認められる唯一の例外は何ですか？
  choices:
    A: GPSナビゲーションマップを確認する場合
    B: 緊急のテキストメッセージを読む場合
    C: 正当な緊急事態のために911に通報する場合
    D: 赤信号で停車中に電話をかける場合
  answer: C
  explanation: この禁止事項の例外は、ハンズフリー通信が有効な場合、または正当な緊急事態のために通信機器を使用して911に通報する場合のみです。
- id: 206
  category: defensive_driving
  question: テキストメッセージの送信や確認のために5秒間道路から目を離すことは、時速55マイルで走行している場合、目隠しをしてどのくらいの距離を運転するのと同等ですか？
  choices:
    A: バスケットボールコートの長さ
    B: フットボール場全体の長さ
    C: 丸1マイル
    D: 500フィート
  answer: B
  explanation: テキストの送信や確認で5秒間道路から目を離すことは、時速55マイルでは、目を閉じたままフットボール場全体の長さを走行するのと同じです。
- id: 207
  category: penalties_and_points
  question: インディアナ州法において、一連の継続的な運転中に少なくともいくつの特定の危険行為を行った場合に「あおり運転（アグレッシブ・ドライビング）」とみなされますか？
  choices:
    A: 2つ
    B: 3つ
    C: 4つ
    D: 5つ
  answer: B
  explanation: インディアナ州法によれば、車両の一連の継続的な運転中に、特定の危険行為のうち少なくとも3つを行った場合に、あおり運転に従事したとみなされます。
- id: 208
  category: defensive_driving
  question: 砂利道（未舗装路）で停車や旋回がより困難なのはなぜですか？
  choices:
    A: 砂利道は通常、舗装路よりも幅が広いため
    B: トラクション（摩擦力）が低下し、スリップしやすくなるため
    C: 砂利道は常に制限速度が高いため
    D: 埃で道路の視界が完全に遮られるため
  answer: B
  explanation: 砂利道ではトラクションが低下するため、停車や旋回がより困難になります。トラクションが低下すると、スリップが発生しやすくなります。
- id: 209
  category: safe_driving_rules
  question: 田舎道の急な坂の頂上に近づく前に、何をすべきですか？
  choices:
    A: 勢いを維持するために加速する
    B: 道路の左側に移動する
    C: 継続的にクラクションを鳴らす
    D: 減速し、道路の右側に寄り、対向車に注意する
  answer: D
  explanation: 急な坂の頂上に近づく前には、減速して道路の右側に寄り、対向車に注意してください。
- id: 210
  category: safe_driving_rules
  question: 州間高速道路（インターステート）で目的の出口を通り過ぎてしまった場合、どうしなければなりませんか？
  choices:
    A: 停車し、路肩を慎重にバックする
    B: 中央分離帯を越えてUターンする
    C: 次の出口まで走行する
    D: 右車線で停車し、交通が途切れるのを待ってから後退する
  answer: C
  explanation: 通り過ぎた出口に戻るために州間高速道路上でバックするのは危険です。出口を通り過ぎた場合は、次の出口まで走行しなければなりません。
- id: 211
  category: sharing_the_road
  question: 片側3車線以上の州間高速道路において、トラックの走行が制限されているのはどの車線ですか？
  choices:
    A: 左側の2車線
    B: 中央車線のみ
    C: 右側の2車線
    D: どの車線でも自由に走行できる
  answer: C
  explanation: トラックは、片側2車線の州間高速道路では右側車線に、片側3車線以上の州間高速道路では右側の2車線に走行が制限されています。
- id: 212
  category: signs_and_signals
  question: 工事区域において、方向を示していない点滅矢印板は何を意味しますか？
  choices:
    A: 直ちに左車線に移動しなければならない
    B: 直ちに右車線に移動しなければならない
    C: 注意を促す信号であるが、別の車線への移動は必要ない
    D: この先、道路が完全に閉鎖されている
  answer: C
  explanation: どちらの方向も示していない点滅矢印板は、注意を促す信号ですが、運転者に別の車線への移動を義務付けるものではありません。
- id: 213
  category: signs_and_signals
  question: 工事現場の誘導員が、蛍光オレンジまたは赤色の旗を交通路に対して水平に突き出した場合、どうしなければなりませんか？
  choices:
    A: 現在の速度で進む
    B: 停止する
    C: 左車線に移動する
    D: 警笛を鳴らしてゆっくり進む
  answer: B
  explanation: 誘導員が蛍光オレンジまたは赤色の旗を交通路に対して水平に突き出した場合は、停止しなければなりません。
- id: 214
  category: safe_driving_rules
  question: スクールバスなどの特定の車両は、踏切の最も近いレールからどのくらいの距離で停止しなければなりませんか？
  choices:
    A: 10フィート以上30フィート以内
    B: 15フィート以上50フィート以内
    C: 20フィート以上100フィート以内
    D: 正確に25フィート
  answer: B
  explanation: 一部の車両は法律により、踏切の最も近いレールから15フィート以上50フィート以内の場所で常に停止することが義務付けられています。
- id: 215
  category: signs_and_signals
  question: 十字型踏切道標識（クロバック）が単独で設置されている場合、どのように扱うべきですか？
  choices:
    A: 一時停止標識として扱う
    B: 「譲れ」の標識として扱う
    C: 制限速度標識として扱う
    D: 行き止まりの警告として扱う
  answer: B
  explanation: 十字型標識が単独で設置されている場合は、「譲れ」の標識として扱い、停止するか線路を渡るかの判断は運転者に委ねられます。
- id: 216
  category: signs_and_signals
  question: 十字型踏切道標識（クロバック）が単独で設置されている踏切に近づく際、どうすべきですか？
  choices:
    A: 列車の接近に関わらず、必ず完全停止する
    B: 「譲れ」の標識として扱い、列車が接近している場合は停止する
    C: できるだけ早く線路を通過するために加速する
    D: 警笛を鳴らし、減速せずに進む
  answer: B
  explanation: 十字型標識が単独で設置されている場合は、「譲れ」の標識として扱い、停止するか線路を渡るかの判断は運転者に委ねられます。列車が接近している場合は停止しなければなりません。
- id: 217
  category: safe_driving_rules
  question: 次の車両のうち、すべての踏切で停止が義務付けられているのはどれですか？
  choices:
    A: 有料で客を運ぶすべての車両（営業用旅客車両）
    B: すべてのピックアップトラック
    C: すべての乗用車
    D: すべてのオートバイ
  answer: A
  explanation: すべての踏切で停止が義務付けられている車両には、有料で客を運ぶすべての車両、すべてのスクールバス、および爆発物や引火性液体を運ぶすべての車両が含まれます。
- id: 218
  category: safe_driving_rules
  question: 踏切から何フィート以内で他車を追い越すことは違法ですか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: マニュアルには、踏切の100フィート以内で他車を追い越してはならないと記載されています。
- id: 219
  category: defensive_driving
  question: 車両が踏切内で立ち往生し、列車が近づいている場合、避難した後はどの方向に走るべきですか？
  choices:
    A: 線路から離れるように、向かってくる列車の方へ45度の角度で走る
    B: 列車から離れるように、線路に沿って真っ直ぐ走る
    C: 線路から真横に90度の角度で走る
    D: 線路から離れるように、列車が進むのと同じ方向へ45度の角度で走る
  answer: A
  explanation: 線路上で立ち往生した場合は、その場から避難し、線路から離れるようにして、向かってくる列車の方向へ45度の角度で走るべきです。
- id: 220
  category: safe_driving_rules
  question: 踏切の警報灯が点滅し始め、遮断機が下がり始めてから、踏切から脱出するまでに約何秒の猶予がありますか？
  choices:
    A: 10秒
    B: 20秒
    C: 30秒
    D: 45秒
  answer: B
  explanation: 踏切の警報灯が点滅し始め、遮断機が下がり始めてから、列車が到達するまで約20秒の猶予があります。
- id: 221
  category: vehicle_information
  question: インディアナ州において、特別な許可なしに運転できる車両の最大全高は何フィートですか？
  choices:
    A: 12フィート6インチ
    B: 13フィート6インチ
    C: 14フィート
    D: 14フィート6インチ
  answer: B
  explanation: 特別な許可なしに運転できる車両の最大全高は、13フィート6インチです。
- id: 222
  category: sharing_the_road
  question: 時速55マイルで走行中、ブレーキが熱くなった状態のフル積載のトラクター・トレーラーが完全に停止するまでに、およそ何フィートかかりますか？
  choices:
    A: 130〜140フィート
    B: 200フィート
    C: 300フィート
    D: 400フィート以上
  answer: D
  explanation: ブレーキが熱くなった状態のフル積載のトラクター・トレーラーが完全に停止するまでには、400フィート以上（フットボール場の長さ以上）かかる場合があります。
- id: 223
  category: sharing_the_road
  question: トラクター・トレーラーの後方の死角は、車両の後ろに最大で何フィートまで及びますか？
  choices:
    A: 最大50フィートまで
    B: 最大100フィートまで
    C: 最大150フィートまで
    D: 最大200フィートまで
  answer: D
  explanation: トラクター・トレーラーの運転手の死角は、運転席（キャブ）の前方最大20フィート、トレーラーの両側、運転席の横、そして車両の後方最大200フィートに及びます。
- id: 224
  category: sharing_the_road
  question: トラクター・トレーラーが複数車線の高速道路で中央車線を走行し続けることが多いのはなぜですか？
  choices:
    A: 制限速度を超えて速く走るため。
    B: 高速道路に出入りする地元の交通の流れを助け、危険な状況を回避するための選択肢を増やすため。
    C: 右側車線を走行することが違法であるため。
    D: 乗用車に追い越されるのを防ぐため。
  answer: B
  explanation: 複数車線の高速道路では、トラクター・トレーラーは高速道路に出入りする地元の交通の流れを助けるために中央車線を走行します。また、中央車線に留まることで、危険な状況を回避するために車線を変更する必要がある場合の選択肢が増えます。
- id: 225
  category: sharing_the_road
  question: トラクター・トレーラーを追い越す際、どちら側から追い越すべきですか？
  choices:
    A: 常に左側から
    B: 常に右側から
    C: 交通量が少ない方の側から
    D: トラクター・トレーラーを追い越すべきではない
  answer: A
  explanation: トラクター・トレーラーを追い越す際は、常に完全に、かつ必ず左側から追い越してください。並走し続けると、トラクター・トレーラーの運転手が回避行動を取ることができなくなります。
- id: 226
  category: safe_driving_rules
  question: インディアナ州の「ムーブ・オーバー法（Move Over Law）」に基づき、点滅灯をつけた緊急車両に近づく際、別の車線に移動できない場合はどうしなければなりませんか？
  choices:
    A: 速度を維持し、注意して進む。
    B: 制限速度より時速10マイル低い速度まで減速し、注意して進む。
    C: 自分の車線ですぐに停止する。
    D: 緊急車両を素早く追い越すために加速する。
  answer: B
  explanation: 車線を移動できない場合、運転者は制限速度より時速10マイル低い速度まで減速し、注意して進まなければなりません。
- id: 227
  category: penalties_and_points
  question: インディアナ州の「ムーブ・オーバー法（Move Over Law）」に従わなかった場合、どのような違反とみなされますか？
  choices:
    A: クラスA軽罪（Class A Misdemeanor）
    B: クラスB違反（Class B Infraction）
    C: クラスA違反（Class A Infraction）
    D: 重罪（Felony）
  answer: C
  explanation: 交互点滅灯を表示している緊急車両に近づく運転者は、車線を変更するか減速することが義務付けられています。これに従わない場合は、クラスA違反（Class
    A Infraction）となります。
- id: 228
  category: defensive_driving
  question: 踏切内で車両が動かなくなり、列車が近づいていない場合、まず最初に何をすべきですか？
  choices:
    A: レッカー車を呼ぶ。
    B: 自分で車両を線路の外へ押そうとする。
    C: 青い標識に記載されている番号を使用して、すぐに緊急通報システム（ENS）に電話する。
    D: 通りかかった車に合図を送る。
  answer: C
  explanation: 踏切内で車両が動かなくなり、列車が近づいていない場合は、すぐに緊急通報システム（ENS）に電話してください。電話番号は、踏切の遮断機に取り付けられている青い標識に記載されています。
- id: 229
  category: sharing_the_road
  question: トラクター・トレーラーが急な右左折をする際、どのようなことが予想されますか？
  choices:
    A: 後輪が前輪よりも外側の進路を通る。
    B: 右左折の最初の段階として、運転手が外側に膨らんで曲がることがある。
    C: 車両は常に中央車線から曲がる。
    D: トレーラーは曲がる前に完全に停止する。
  answer: B
  explanation: どのような車両でも、曲がる際は後輪が前輪よりも内側の進路を通ります。トラクター・トレーラーの運転手は、急な右左折をするための最初のステップとして、しばしば外側に大きく膨らんで（スイングして）運転します。
- id: 230
  category: safe_driving_rules
  question: 踏切を走行中に避けるべきことは何ですか？
  choices:
    A: 左右を確認すること
    B: 停止することやギアチェンジをすること
    C: ヘッドライトを点灯させること
    D: ワイパーを使用すること
  answer: B
  explanation: 踏切を渡っている間は、停止したりギアチェンジをしたりすることを避けてください。停止することなく線路を渡りきれる確信がない限り、運転者は踏切に進入してはいけません。
- id: 231
  category: penalties_and_points
  question: 認可された緊急車両に対して、車線を変更しない、または減速しなかった場合の罰則は何ですか？
  choices:
    A: クラスA違反
    B: クラスB違反
    C: クラスA軽罪
    D: 第6級重罪
  answer: A
  explanation: マニュアルによると、認可された緊急車両のために車線を変更できない場合、運転者は制限速度より時速10マイル（10 mph）以上減速しなければなりません。これに従わない場合はクラスA違反となります。
- id: 232
  category: safe_driving_rules
  question: 黄色の点滅灯をつけた認可された停車車両から離れるために車線変更ができない場合、どのような行動をとらなければなりませんか？
  choices:
    A: 完全に停止して車両が移動するのを待つ
    B: 制限速度より時速10マイル（10 mph）減速し、注意して進む
    C: 時速15マイル（15 mph）まで減速し、注意して進む
    D: 速度を維持するが、作業員に知らせるためにクラクションを鳴らす
  answer: B
  explanation: マニュアルには、黄色の点滅灯をつけた認可された停車車両のために車線を変更できない場合は、制限速度より時速10マイル（10 mph）減速し、注意して進まなければならないと記載されています。
- id: 233
  category: safe_driving_rules
  question: 赤色の点滅灯と停止信号腕（ストップアーム）を出しているスクールバスに対して、停止する必要がないのはどのような場合ですか？
  choices:
    A: 障壁または未舗装の中央分離帯で仕切られた道路で、反対方向に走行している場合
    B: 2車線道路で反対方向に走行している場合
    C: 分離ハイウェイでスクールバスと同じ方向に走行している場合
    D: スクールバスが踏切で停止している場合
  answer: A
  explanation: 障壁または未舗装の中央分離帯で仕切られた道路を走行している場合、スクールバスと同じ方向に走行している場合にのみ停止が義務付けられます。
- id: 234
  category: penalties_and_points
  question: スクールバスの停止信号腕（ストップアーム）を無視し、その違反によって身体的傷害が生じた場合の罰則は何ですか？
  choices:
    A: クラスA違反
    B: クラスB違反
    C: クラスA軽罪
    D: 第6級重罪
  answer: D
  explanation: スクールバスの停止信号腕を無視するとクラスA軽罪になる可能性がありますが、その違反によって身体的傷害が生じた場合は第6級重罪となります。
- id: 235
  category: sharing_the_road
  question: オートバイの後ろを走行する場合、どのくらいの車間距離を空けるべきですか？
  choices:
    A: 1〜2秒
    B: 少なくとも3〜4秒
    C: 5〜6秒
    D: 時速10マイルごとに車1台分
  answer: B
  explanation: マニュアルでは、オートバイの運転者が緊急時に操縦や停止を行うための十分な時間を確保できるよう、オートバイの後ろを走る際は少なくとも3〜4秒の車間距離を空けることを推奨しています。
- id: 236
  category: sharing_the_road
  question: オートバイの方向指示器（ウィンカー）が点滅していても、実際に曲がるのを確認してから進むべきなのはなぜですか？
  choices:
    A: オートバイは配線不良が多く、ランダムに点滅することがあるため
    B: オートバイの方向指示器は通常、自動キャンセル機能がなく、ライダーが消し忘れることがあるため
    C: オートバイの運転者は頻繁に曲がるのをやめることがあるため
    D: 法律で進む前に5秒間の待機が義務付けられているため
  answer: B
  explanation: オートバイの方向指示器が点滅していても、すぐに曲がるとは限りません。これらの車両の指示器には通常、自動キャンセル機能がなく、ライダーが消し忘れることがあるためです。
- id: 237
  category: sharing_the_road
  question: 自転車を追い越す際、運転者が確保しなければならない最低限の安全な間隔はどれくらいですか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 5フィート
  answer: C
  explanation: 運転者は、自転車の横に安全な間隔がある場合に追い越すことができます。その間隔は最低3フィートです。
- id: 238
  category: sharing_the_road
  question: 道路上での自転車の並走に関する一般的な規則は何ですか？
  choices:
    A: 常に一列で走行しなければならない
    B: 3台まで並走できる
    C: 自転車専用道を除き、2台を超えて並走してはならない
    D: 車線の幅が許す限り何台でも並走できる
  answer: C
  explanation: 自転車は、自転車専用の道や車線を除き、2台を超えて並走してはなりません。
- id: 239
  category: sharing_the_road
  question: 運転者が自転車道または自転車車線を横切ることが許可されるのはいつですか？
  choices:
    A: 100フィート手前で右左折の準備をする際
    B: 低速の自動車を追い越す際
    C: 右左折する場合、または路地、ドライブウェイ、私道に出入りする場合のみ
    D: 自転車車線にサイクリストがいないときはいつでも
  answer: C
  explanation: 運転者は、右左折する場合、または路地、ドライブウェイ、私道に出入りする場合にのみ、自転車道または自転車車線を横切ることができます。
- id: 240
  category: signs_and_signals
  question: 路面の「シャロウ（Sharrow）」マークの目的は何ですか？
  choices:
    A: 自転車専用車線であることを示すため
    B: 前方に歩行者横断歩道があることを運転者に警告するため
    C: サイクリストが駐車車両から離れた位置を走るのを助け、運転者にサイクリストがいることを予期させるため
    D: 自転車専用の駐輪場所を示すため
  answer: C
  explanation: シャロウマークは、サイクリストが駐車車両から離れた位置を走るのを助け、他の道路利用者にサイクリストが走行車線を走ることを予期させるためのものです。
- id: 241
  category: signs_and_signals
  question: 道路上の赤色の舗装は何を示していますか？
  choices:
    A: 指定された自転車専用レーン
    B: バス、タクシー、またはその他の公共交通機関用に指定されたレーン
    C: 駐車禁止区域
    D: この先の停止標識または交通信号機
  answer: B
  explanation: 赤色の舗装は、バス、タクシー、またはその他の公共交通機関用に指定されたバスレーンや交通レーンの視認性を高めるために使用されることがあります。
- id: 242
  category: safe_driving_rules
  question: 交差点で警察官が交通整理をしており、青信号と矛盾する指示を出した場合、どうすべきですか？
  choices:
    A: 信号機に従う
    B: 警察官の指示に従う
    C: 信号が赤に変わるまで待ってから移動する
    D: 青信号であることを知らせるために警察官に向かってクラクションを鳴らす
  answer: B
  explanation: 警察官の指示が交通信号や標識と異なる場合があります。そのような場合、警察官の指示が優先され、それに従わなければなりません。
- id: 243
  category: safe_driving_rules
  question: 縦列駐車を始める際、空きスペースの前に停車している車両からどのくらい離して自車を配置すべきですか？
  choices:
    A: 少なくとも1フィート（約30cm）
    B: 少なくとも2フィート（約60cm）
    C: 少なくとも3フィート（約90cm）
    D: 少なくとも4フィート（約1.2m）
  answer: B
  explanation: 縦列駐車をする際は、空きスペースの前に停車している車両と並行に自車を配置し、その車両から少なくとも2フィート（約60cm）の間隔を保つ必要があります。
- id: 244
  category: penalties_and_points
  question: ハザードランプを点滅させて停車している故障車に対して、車線を移動するか適切に減速しなかった場合の罰則は何ですか？
  choices:
    A: クラスA違反
    B: クラスB違反
    C: クラスC違反
    D: クラスA軽罪
  answer: B
  explanation: ハザードランプを点滅させて停車している故障車に接近する運転者は、車線を移動するか、制限速度より時速10マイル（約16km/h）低い速度まで減速しなければなりません。これを怠るとクラスB違反となります。
- id: 245
  category: sharing_the_road
  question: 自転車利用者は、専用の自転車レーンがある場合、そこを走行しなければなりませんか？
  choices:
    A: はい、常に自転車レーンを使用しなければなりません
    B: はい、自転車レーンが障害物で塞がれている場合を除きます
    C: いいえ、自転車レーンまたは走行車線のいずれかを使用する権利があります
    D: いいえ、ただし時速15マイル（約24km/h）以上で走行している場合に限ります
  answer: C
  explanation: 自転車利用者は、自転車レーンまたは走行車線のいずれかを使用する権利があるため、指定された自転車レーンを走行することは義務付けられていません。
- id: 246
  category: safe_driving_rules
  question: 下り坂で駐車する場合、車両の車輪はどちらに向けるべきですか？
  choices:
    A: 縁石から離れる方向
    B: 縁石の方向
    C: 縁石と平行
    D: 道路の方向
  answer: B
  explanation: 下り坂で駐車する場合は、車両の車輪を縁石の方向に向けてください。
- id: 247
  category: safe_driving_rules
  question: 上り坂で縁石がない場所に駐車する場合、車輪はどちらに向けるべきですか？
  choices:
    A: 道路の方向
    B: 道路と平行
    C: 道路から離れる方向
    D: まっすぐ前
  answer: C
  explanation: 縁石がない場所で上り坂に向けて駐車する場合は、車両の車輪を道路から離れる方向に向けます。
- id: 248
  category: safe_driving_rules
  question: 車両を後退（バック）させる際の正しい技術は何ですか？
  choices:
    A: バックミラーだけに頼る
    B: 体を左に回してサイドウィンドウから外を見る
    C: 体を右に回してリアウィンドウ（後ろの窓）から外を見る
    D: サイドミラーのみを使用する
  answer: C
  explanation: 後退する際は、体を右に回してリアウィンドウから直接後ろを確認してください。後退時にバックミラーのみを使用することは決してしないでください。
- id: 249
  category: safe_driving_rules
  question: 次のうち、駐車禁止場所はどれですか？
  choices:
    A: 消火栓から15フィート（約4.5m）以内
    B: 消火栓から25フィート（約7.6m）以内
    C: 踏切から50フィート（約15m）以内
    D: 白色の縁石に隣接する場所
  answer: A
  explanation: 消火栓から15フィート（約4.5m）以内、または消防車専用レーンでの駐車は禁止されています。
- id: 250
  category: sharing_the_road
  question: 視覚障害のある歩行者であることを示す補助具は何ですか？
  choices:
    A: 黄色のジャケットまたは反射ベスト
    B: 白い杖または訓練された盲導犬
    C: 赤い杖または電動車椅子
    D: 点滅するライトまたは歩行器
  answer: B
  explanation: 視覚障害のある方の移動補助具としては、白い杖や訓練された盲導犬が一般的です。
- id: 251
  category: vehicle_information
  question: シートベルトを着用することで、運転者と助手席の乗員の生存率は何パーセント向上しますか？
  choices:
    A: 25パーセント
    B: 35パーセント
    C: 45パーセント
    D: 50パーセント
  answer: C
  explanation: シートベルトを着用した場合、運転者と助手席の乗員の生存率は45パーセント向上します。
- id: 252
  category: safe_driving_rules
  question: 安全性を最大限に高めるために、運転者はハンドル（ステアリングホイール）に対してどのような位置に座るべきですか？
  choices:
    A: 少なくとも6インチ（約15cm）離れる
    B: 少なくとも10インチ（約25cm）離れる
    C: 少なくとも12インチ（約30cm）離れる
    D: 快適に座れる範囲でできるだけ近づく
  answer: C
  explanation: 安全性を最大限に高めるために、運転者はハンドルから少なくとも12インチ（約30cm）離れて座る必要があります。
- id: 253
  category: safe_driving_rules
  question: 次の中で、シートベルトの着用が免除されるのは誰ですか？
  choices:
    A: 乗用車の後部座席の乗員
    B: 長距離走行中の商用車の運転手
    C: 配達のために停車を繰り返す新聞配達員
    D: 学校へ運転して行くティーンエイジャー
  answer: C
  explanation: 車両から配達を行う新聞配達員や新聞の束を運ぶ担当者は、シートベルトの着用が免除されます。
- id: 254
  category: driver_responsibility
  question: インディアナ州の法律では、何歳未満の乗員に対してチャイルドシート（乳幼児用補助乗車装置）で適切に固定することが義務付けられていますか？
  choices:
    A: 6歳
    B: 7歳
    C: 8歳
    D: 10歳
  answer: C
  explanation: 8歳未満の乗員は、法律により、チャイルドシートやジュニアシートなどの補助乗車装置で適切に固定することが義務付けられています。
- id: 255
  category: vehicle_information
  question: 助手席にエアバッグが装備されている場合、全米安全評議会（National Safety Council）は何歳未満の子供を後部座席に乗せることを推奨していますか？
  choices:
    A: 8歳
    B: 10歳
    C: 12歳
    D: 14歳
  answer: C
  explanation: 助手席にエアバッグが装備されている場合、全米安全評議会は12歳未満の子供を後部座席に乗せることを推奨しています。
- id: 256
  category: vehicle_information
  question: 日の出から日没までの間に、車両の積載物が車両の後端から4フィート（約1.2メートル）を超えて突き出している場合、その最後端に何を設置しなければなりませんか？
  choices:
    A: 500フィート先から見える赤いランプ
    B: 12平方インチ（約77平方センチメートル）以上の赤い旗
    C: 2つの黄色い点滅灯
    D: 「Wide Load（幅広荷物）」の標識
  answer: B
  explanation: 日の出から日没までの間、車両の積載物の最後端には赤い旗を設置しなければなりません。その赤い旗は12平方インチ以上の大きさである必要があります。
- id: 257
  category: defensive_driving
  question: 日中に車が故障して動けなくなった場合、2枚の赤い旗をどこに掲示しなければなりませんか？
  choices:
    A: 車の前方50フィートと後方50フィート
    B: 車の前方100フィートと後方100フィート
    C: 車の前方200フィートと後方200フィート
    D: 車の屋根とトランクの上
  answer: B
  explanation: 日中に故障した車の運転者は、2枚の赤い旗を掲示する必要があります。1枚は車の前方約100フィート（約30メートル）、もう1枚は後方約100フィートの位置に設置します。
- id: 258
  category: defensive_driving
  question: カーブや丘の頂上から500フィート（約152メートル）以内の場所に車が停車している場合、警告装置は車からどのくらいの距離に設置しなければなりませんか？
  choices:
    A: 車から少なくとも100フィート
    B: 車から少なくとも200フィート
    C: 車から少なくとも300フィート
    D: 車から少なくとも500フィート
  answer: D
  explanation: カーブ、丘の頂上、またはその他の視界を遮る障害物から500フィート以内の場所に車が停車している場合、警告装置は車から少なくとも500フィート離れた場所に設置しなければなりません。
- id: 259
  category: safe_driving_rules
  question: 安全性を最大限に高めるために、シートベルトは体に対してどのように着用すべきですか？
  choices:
    A: 腹部の高い位置、かつ脇の下を通す
    B: 腰の低い位置、かつ鎖骨の上を平らに通す
    C: 腰と首をまたいで緩めに通す
    D: 腰の高い位置、かつ胸を横切るように通す
  answer: B
  explanation: シートベルトは、腰の低い位置に、そして鎖骨の上を平らに通るように着用する必要があります。
- id: 260
  category: safe_driving_rules
  question: 分離帯のある道路で車両が故障した場合、警告装置は車両からどのくらいの距離に設置しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: マニュアルによると、分離帯のある道路で車両が故障した場合、緊急警告装置は車両から200フィート（約60メートル）離れた場所に設置する必要があります。
- id: 261
  category: defensive_driving
  question: インディアナ州におけるすべての衝突事故で最も一般的な要因は何ですか？
  choices:
    A: 速度超過
    B: 飲酒・薬物運転
    C: 優先権の譲り合いの不履行（優先権無視）
    D: 脇見運転
  answer: C
  explanation: マニュアルによると、インディアナ州のすべての衝突事故の中で、優先権の譲り合いの不履行が最も一般的な要因であるとされています。
- id: 262
  category: driver_responsibility
  question: 事故の後、どのような状況下で車両をハイウェイから移動させてはいけませんか？
  choices:
    A: ラッシュアワーの交通時間帯に事故が発生した場合
    B: 事故に危険物の輸送が関わっている場合
    C: 車両がパンクしている場合
    D: 相手のドライバーが車両の移動を拒否した場合
  answer: B
  explanation: 事故に危険物の輸送が関わっている場合、または負傷、死亡、閉じ込めが発生した場合は、ドライバーは車両を移動させてはいけません。
- id: 263
  category: driver_responsibility
  question: 無人の車両に衝突し、所有者を見つけることができない場合、どうしなければなりませんか？
  choices:
    A: フロントガラスにメモを残して立ち去る
    B: レッカー車を呼んで車両を移動させる
    C: 法執行機関（警察など）に連絡して情報を提供する
    D: 立ち去る前に現場でちょうど1時間待つ
  answer: C
  explanation: 無人の車両と衝突し、所有者が見つからない場合は、情報を提供するために法執行機関に連絡しなければなりません。
- id: 264
  category: license_system
  question: 事故の後、賠償責任能力を証明するために、保険会社がBMVに電子的に提出しなければならない書類は何ですか？
  choices:
    A: コンプライアンス証明書 (COC)
    B: 賠償責任証明 (POL)
    C: 事故報告書 (ARF)
    D: 車両登録証 (VRC)
  answer: A
  explanation: 保険会社は、コンプライアンス証明書 (COC) の形式で賠償責任能力の証明を電子的に提出しなければなりません。
- id: 265
  category: defensive_driving
  question: 衝突が避けられない場合、衝撃を最小限に抑えるための最も安全な選択肢は次のうちどれですか？
  choices:
    A: 壊れやすいものよりも硬いものにぶつかる
    B: 反対方向に動いているものにぶつかる
    C: 同じ方向に動いているものよりも動いていないものにぶつかる
    D: 動いていないものよりも自分と同じ方向に動いているものにぶつかる
  answer: D
  explanation: マニュアルでは、動いていないものよりも自分と同じ方向に動いているものにぶつかること、そして衝撃を吸収して壊れやすいものを選ぶことを推奨しています。
- id: 266
  category: safe_driving_rules
  question: 車両の車輪が路肩にはみ出してしまった場合、取るべき正しい行動は何ですか？
  choices:
    A: ハンドルを舗装路の方へ急に切る
    B: すぐに止まるためにブレーキを強く踏む
    C: 路肩に沿って走り、アクセルを緩め、徐々に道路に戻る
    D: 交通の流れに安全に合流するために加速する
  answer: C
  explanation: 車輪が路肩にはみ出した場合は、すぐに戻ろうとしないでください。代わりに路肩に沿って走り、アクセルを緩めます。減速した後、徐々に道路に戻ってください。
- id: 267
  category: defensive_driving
  question: 車両が水中に転落した場合、ドアを開けようとしてはいけないのはなぜですか？
  choices:
    A: 電気系統がすぐにショートするため
    B: 水圧で開けることがほぼ不可能であり、開いたドアから客室に水が流れ込むため
    C: ドアロックが自動的に動かなくなるため
    D: 車両が瞬時に沈んでしまうため
  answer: B
  explanation: 水の重さ（水圧）によりドアを開けることはほぼ不可能であり、また開いたドアから客室に水が流れ込んでしまいます。
- id: 268
  category: alcohol_drugs_health
  question: ドライバーの能力が低下している（飲酒や薬物などの影響を受けている）可能性がある兆候は、次のうちどれですか？
  choices:
    A: 激しい雨の中で制限速度をわずかに下回って運転している
    B: 大きく膨らんで曲がったり、中央線をまたいで走ったりしている
    C: 一貫して方向指示器を使用している
    D: 日中にヘッドライトを点灯して運転している
  answer: B
  explanation: 車両が大きく膨らんで曲がったり、中央線をまたいだり、蛇行したり、その他の異常な行動を示したりする場合、そのドライバーは能力が低下している可能性があります。
- id: 269
  category: safe_driving_rules
  question: 緊急時に路肩に停車中、車両から降りなければならない場合、どのようにすべきですか？
  choices:
    A: できるだけ早く運転席側から降りる
    B: 周囲の状況を確認した後、助手席側から降りる
    C: 目立つようにサンルーフから這い出る
    D: 警察官が到着してドアを開けてくれるまで待つ
  answer: B
  explanation: 路肩で車両から降りる必要がある場合は、周囲に他の車両や障害物がないか確認した上で、助手席側から降りてください。
- id: 270
  category: vehicle_information
  question: 走行中にタイヤがパンク（バースト）した場合、どうすべきですか？
  choices:
    A: すぐにブレーキを強く踏む
    B: ハンドルを右に急に切る
    C: ハンドルをしっかりと握り、アクセルから足を離し、ブレーキを踏まない
    D: ギアをニュートラルに入れ、ブレーキをポンピングする
  answer: C
  explanation: タイヤがパンクしたときは、ハンドルをしっかりと握り、車を直進させます。徐々に減速し、アクセルから足を離しますが、ほぼ停止するまでブレーキは踏まないでください。
- id: 271
  category: vehicle_information
  question: 車両の従来のディスクブレーキまたはドラムブレーキが突然故障した場合、まず何をすべきですか？
  choices:
    A: 低いギアにシフトダウンし、ブレーキペダルを素早く強く踏み込む
    B: すぐにイグニッションを切る
    C: パーキングブレーキをできるだけ強く引く
    D: 最寄りの溝にハンドルを切る
  answer: A
  explanation: ブレーキが突然故障した場合は、可能であれば低いギアにシフトダウンし、ブレーキペダルを素早く強く数回踏み込んで（ポンピングして）、ブレーキ圧を高める必要があります。
- id: 272
  category: safe_driving_rules
  question: ドライバーの視界が遮られる可能性があるカーブや丘の頂上から500フィート以内で車両が故障した場合、緊急警告装置はどこに設置すべきですか？
  choices:
    A: 車両から100フィート
    B: 車両から200フィート
    C: 車両から少なくとも500フィート
    D: 車両の屋根の真上
  answer: C
  explanation: カーブや丘の頂上、またはドライバーの視界が遮られる可能性のあるその他の場所から500フィート以内で車両が故障した場合は、車両から少なくとも500フィート離れた場所に装置を設置してください。
- id: 273
  category: defensive_driving
  question: 車両が水中に転落し、脱出する必要がある場合はどうすべきですか？
  choices:
    A: ドアを開ける前に、車内が完全に水で満たされるのを待つ
    B: シートベルトを外し、窓を開けて、屋根の上に移動する
    C: 脱出する前に貴重品を集める
    D: 救急隊員が到着していても、すぐに岸に向かって泳ぐ
  answer: B
  explanation: 車両が水中に転落した場合は、シートベルトを外し、窓を開け、車両から脱出して屋根の上に移動してください。持ち物を取りに車内に戻ってはいけません。岸に向かって泳ぐのは最終手段としてのみ行ってください。
- id: 274
  category: vehicle_information
  question: 車両の走行中にイグニッションをロック位置にしてはいけないのはなぜですか？
  choices:
    A: エンジンがオーバーヒートするため。
    B: トランスミッションに永久的な損傷を与えるため。
    C: ハンドルを切った際にステアリングがロックされ、制御不能になるため。
    D: ブレーキが即座にロックされ、スリップを引き起こすため。
  answer: C
  explanation: ステアリングホイール・インターロック・システムを搭載した車両を運転中、走行中にイグニッションをロック位置に回すと、ハンドルを切った際にステアリングがロックされ、車両の制御ができなくなります。
- id: 275
  category: safe_driving_rules
  question: 車両が盗難に遭う可能性を減らすために、どのように駐車すべきですか？
  choices:
    A: 前輪を左に大きく切った状態にする。
    B: 前輪を右に大きく切り、非常用ブレーキをかけた状態にする。
    C: 窓を少し開けて換気する。
    D: ギアをニュートラルに入れ、非常用ブレーキをかけた状態にする。
  answer: B
  explanation: 車両盗難の可能性を減らすために、マニュアルでは前輪を右に大きく切り、非常用ブレーキ（パーキングブレーキ）をかけて駐車することを推奨しています。
- id: 276
  category: driver_responsibility
  question: 警察官に停車を命じられた際、まずどのように警察官の存在を認識したことを示すべきですか？
  choices:
    A: すぐにハザードランプを点灯させる。
    B: 窓から手を振る。
    C: 右のウィンカーを出す。
    D: クラクションを2回鳴らす。
  answer: C
  explanation: 右のウィンカーを出すことで、警察官の存在を認識したことを伝えてください。これにより、警察官はあなたが彼らの存在に気づいていることを知ることができます。
- id: 277
  category: safe_driving_rules
  question: 高速道路で警察官に停車を命じられた場合、車両をどこに停めるべきですか？
  choices:
    A: 道路の右側の路肩。
    B: 中央分離帯。
    C: 一番右側の走行車線。
    D: 道路の左側の路肩。
  answer: A
  explanation: 車両を道路の右側の路肩に移動させる必要があります。高速道路の中央分離帯に停車してはいけません。ドライバーと警察官の両方を危険にさらすことになるからです。
- id: 278
  category: safe_driving_rules
  question: 夜間に警察官に停車を命じられた場合、どのような行動が推奨されますか？
  choices:
    A: ヘッドライトを消す。
    B: ハイビームを点灯させる。
    C: 車内灯を点灯させる。
    D: 警察官から見えるように車から降りる。
  answer: C
  explanation: 夜間に停車を命じられた場合は、車内灯を点灯させ、停車するために明るい場所を探すことが推奨されます。
- id: 279
  category: safe_driving_rules
  question: 停車を命じられた際、すぐに安全な停車場所が見つからない場合はどうすべきですか？
  choices:
    A: 安全な場所が現れるまで速度を維持する。
    B: 減速してハザードランプを点灯させる。
    C: 走行車線の真ん中で停車する。
    D: 次の出口に早く着くように加速する。
  answer: B
  explanation: すぐに安全な場所が見つからない場合は、減速してハザードランプを点灯させてください。これにより、警察官に対して、あなたがその存在を認識しており、安全に停車できる場所を積極的に探していることを示すことができます。
- id: 280
  category: driver_responsibility
  question: 停車命令を受けている間、運転者と乗客はどこに手を置いておくべきですか？
  choices:
    A: 運転者はハンドルに手を置き、乗客の手は膝の上で見えるようにしておく。
    B: 全員が空中に手を挙げる。
    C: 手はポケットに入れるか、見えないようにしておく。
    D: 運転者はすぐにグローブボックスに手を伸ばす。
  answer: A
  explanation: 運転者はハンドルに手を置き、乗客の手は膝の上で見えるようにしておく必要があります。手が見えないと、警察官が脅威を感じる原因となります。
- id: 281
  category: driver_responsibility
  question: 交通検問中に保険加入証明がスマートフォン内に保存されている場合、どのように対応すべきですか？
  choices:
    A: 警察官が近づいてくる前に、素早くスマートフォンを手に取る。
    B: 警察官が歩み寄ってきたら、窓からスマートフォンを差し出す。
    C: まず警察官にその旨を伝え、指示に従ってからスマートフォンを取り出す。
    D: 警察官はスマートフォンを見ることはできないため、提示を拒否する。
  answer: C
  explanation: 保険加入証明がスマートフォンに保存されている場合は、まず警察官にその事実を伝え、情報を取り出すために手を動かす前に警察官の指示に従う必要があります。
- id: 282
  category: penalties_and_points
  question: 警察官から交付された交通違反切符（チケット）に署名することは何を意味しますか？
  choices:
    A: 自分の罪を認めること。
    B: 交通裁判所での裁判を受ける権利を放棄すること。
    C: 切符を受け取ったことを確認することのみを意味する。
    D: 停車させられた理由に同意することを意味する。
  answer: C
  explanation: 交通違反切符への署名は、運転者が罪を認めたことにはならず、単に切符を受け取ったことを確認するためのものです。
- id: 283
  category: alcohol_drugs_health
  question: 次の中で、一酸化炭素中毒の症状はどれですか？
  choices:
    A: 車内に強い排気ガスの臭いがする。
    B: 光に対して過敏になる。
    C: 急にエネルギーが湧いてくる。
    D: 皮膚や唇が赤みを帯びる。
  answer: B
  explanation: 一酸化炭素中毒の症状には、眠気やめまい、皮膚や唇が青白くなる、頭痛、そして光への過敏症などがあります。一酸化炭素は無色・無臭・無味であるため、五感で感知することはできません。
- id: 284
  category: safe_driving_rules
  question: 混雑した道路を走行中、一酸化炭素中毒を避けるにはどうすればよいですか？
  choices:
    A: すべての窓を全開にする。
    B: 車両のヒーターを最大にする。
    C: 外気導入ベントを閉じる。
    D: 外気導入ベントを開ける。
  answer: C
  explanation: 混雑した交通状況で一酸化炭素中毒を避けるには、他車の排気ガスを吸い込まないよう、外気導入ベントを閉じる必要があります。
- id: 285
  category: signs_and_signals
  question: 交通規則に従い、赤信号で合法的に左折ができるのはどのような時ですか？
  choices:
    A: 他に車両がいない時。
    B: 一方通行の道路から別の一方通行の道路へ曲がる時。
    C: 他の運転者がクラクションを鳴らした時。
    D: いかなる場合も不可。
  answer: B
  explanation: 赤信号での合法的な左折は、運転者が一方通行の道路から別の一方通行の道路へ曲がる場合にのみ許可されます。
- id: 286
  category: sharing_the_road
  question: 時速55マイルで走行中の、ブレーキが過熱した荷物満載のトラクター・トレーラーが停止するまでに、どのくらいの距離が必要ですか？
  choices:
    A: 50フィート以上。
    B: 100フィート以上。
    C: 200フィート以上。
    D: 400フィート以上。
  answer: D
  explanation: 時速55マイルで走行している、ブレーキが過熱した荷物満載のトラクター・トレーラーが停止するには、400フィート（約122メートル）以上の距離が必要になる場合があります。
- id: 287
  category: safe_driving_rules
  question: インディアナ州の法律によれば、車両のヘッドライトを点灯しなければならないのはどの期間ですか？
  choices:
    A: 日没から日の出までの間、および視界が500フィート未満の時
    B: 午後6時30分から午前6時30分の間
    C: 運転者が疲労を感じている時はいつでも
    D: 街灯のない田舎道を走行している時のみ
  answer: A
  explanation: インディアナ州法では、日没から日の出までの間、および視界が500フィート未満の場合にヘッドライトを点灯することを義務付けています。
- id: 288
  category: safe_driving_rules
  question: 曲がろうとしている道路に複数の車線がある場合、どの車線から曲がるべきですか？
  choices:
    A: 中央の車線
    B: 曲がる方向から最も遠い車線
    C: 曲がる方向に最も近い車線
    D: 方向指示器を出していれば、どの車線からでもよい
  answer: C
  explanation: 複数の車線がある道路から右左折する場合は、曲がる方向に最も近い車線から曲がる必要があります。
- id: 289
  category: safe_driving_rules
  question: 特に標識がない場合、地方の州道分離ハイウェイ（rural state divided highway）の制限速度はいくらですか？
  choices:
    A: 時速50マイル
    B: 時速55マイル
    C: 時速60マイル
    D: 時速65マイル
  answer: C
  explanation: 特に標識で指定されていない限り、地方の州道分離ハイウェイの制限速度は時速60マイルです。
- id: 290
  category: safe_driving_rules
  question: 特に標識がない場合、市街化区域外にある州間高速道路（インターステート）での乗用車の最高速度制限はいくらですか？
  choices:
    A: 時速55マイル
    B: 時速60マイル
    C: 時速65マイル
    D: 時速70マイル
  answer: D
  explanation: 特に標識で指定されていない限り、市街化区域外の州間高速道路における乗用車の最高速度制限は時速70マイルです。
- id: 291
  category: safe_driving_rules
  question: 夜間の運転中、前方車両を追従する場合、何フィート以内でロービーム（すれ違い用前照灯）を使用しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 夜間の運転中、前方車両を200フィート以内で追従する場合は、ロービームを使用しなければなりません。
- id: 292
  category: safe_driving_rules
  question: 夜間の運転中、対向車とすれ違う際、何フィート以内でロービームに切り替えなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: D
  explanation: 対向車が500フィート以内に近づいたときは、ロービームを使用しなければなりません。
- id: 293
  category: defensive_driving
  question: タイヤのパンクやバーストが発生した場合、どのように対処すべきですか？
  choices:
    A: すぐにブレーキをかける
    B: ハンドルをしっかりと握り、車を直進させる
    C: 走行速度を上げる
    D: 目的地に着くまでホイールのリムだけで走行を続ける
  answer: B
  explanation: タイヤのパンクやバーストが発生した場合は、ハンドルをしっかりと握り、車を直進させるようにしてください。
- id: 294
  category: license_system
  question: 有償運送許可（for-hire endorsement）を得て有償で物品を運送する場合、車両総重量の制限はいくらですか？
  choices:
    A: 16,000ポンドを超えてはならない
    B: 26,000ポンドを超えてはならない
    C: 26,000ポンドを超えなければならない
    D: 28,000ポンドを超えなければならない
  answer: B
  explanation: 有償運送許可を得て有償で物品を運送する場合、車両総重量は26,000ポンドを超えてはなりません。
- id: 295
  category: safe_driving_rules
  question: 有償で旅客を運送する車両は、鉄道の線路から何フィートの範囲内で停止する必要がありますか？
  choices:
    A: 5〜45フィート
    B: 10〜40フィート
    C: 15〜50フィート
    D: 20〜60フィート
  answer: C
  explanation: 有償で旅客を運送する車両は、鉄道の線路から15〜50フィートの範囲内で停止しなければなりません。
- id: 296
  category: vehicle_information
  question: 車道や路肩で故障したトラック、バス、またはトレーラーにおいて、許容される警告装置は次のうちどれですか？
  choices:
    A: 連邦規格に適合した3つの双方向緊急反射三角表示板
    B: 3つの液体燃焼式フレア（発炎筒）
    C: 少なくとも6つの信号紅炎（fusees）
    D: すべての回答が正しい
  answer: D
  explanation: 故障したトラック、バス、またはトレーラーの許容される警告装置には、連邦規格に適合した3つの双方向緊急反射三角表示板、3つの液体燃焼式フレア、または少なくとも6つの信号紅炎が含まれます。したがって、すべての回答が正しいです。
- id: 297
  category: signs_and_signals
  question: 警察官が交通整理を行っており、その指示が交通信号や標識と異なる場合、どうすべきですか？
  choices:
    A: 交通標識や信号に従う
    B: 警察官の指示に従う
    C: 速度を落とさずにそのまま進む
    D: ソーシャルメディアでアラートを送信する
  answer: B
  explanation: 警察官が交通整理を行っている場合は、たとえ交通信号や標識と異なっていても、警察官の指示に従わなければなりません。
- id: 298
  category: license_system
  question: 新規の運転免許証を申請する際、インディアナ州の居住地を証明する書類を何通提示する必要がありますか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: B
  explanation: 新規の運転免許証、学習許可証（仮免許）、または身分証明書を取得するには、インディアナ州の居住地を証明する書類を2通提示する必要があります。
- id: 299
  category: license_system
  question: 社会保障番号（SSN）を証明する書類として認められるのは、次のうちどれですか？
  choices:
    A: 公共料金の請求書
    B: W-2フォーム（源泉徴収票）
    C: 銀行の取引明細書
    D: インディアナ州の有権者登録カード
  answer: B
  explanation: マニュアルによると、氏名と完全な社会保障番号が記載された有効な書類には、社会保障カード、W-2フォーム、1099フォーム、非SSA 1099フォーム、または印字済みの給与明細が含まれます。
- id: 300
  category: license_system
  question: インディアナ州の居住地を証明するために使用する公共料金会社からのコンピュータ作成の請求書は、発行からどのくらい以内のものである必要がありますか？
  choices:
    A: 申請日から30日以内に発行されたもの
    B: 申請日から60日以内に発行されたもの
    C: 申請日から90日以内に発行されたもの
    D: 申請日から1年以内に発行されたもの
  answer: B
  explanation: マニュアルには、公共料金会社からのコンピュータ作成の請求書は、申請日から60日以内に発行されたものであり、かつ氏名と居住住所が記載されていなければならないと記されています。
- id: 301
  category: license_system
  question: BMVの書類において、私書箱（PO Box）を居住地住所として使用できるのはどのような条件の場合ですか？
  choices:
    A: 申請者がすべての郵便物をそこで受け取っている場合
    B: 申請者がホームレスである場合
    C: 申請者がインディアナ州司法長官の住所秘匿プログラム（Address Confidentiality Program）に登録している場合
    D: いかなる状況においても私書箱を使用することはできない
  answer: C
  explanation: 申請者がインディアナ州司法長官の住所秘匿プログラムに登録されていない限り、私書箱を居住地住所として使用することはできません。
- id: 302
  category: license_system
  question: 親戚や友人と同居しており、居住地を証明する2つの書類を提出できない場合、その親戚や友人は何をしなければなりませんか？
  choices:
    A: BMVの支局でインディアナ州居住証明宣誓供述書（Indiana Residency Affidavit）に署名する
    B: 自身の社会保障カードを提出する
    C: 公式のレターヘッドで手紙を書く
    D: 居住確認手数料を支払う
  answer: A
  explanation: 親戚や友人と同居している場合、同居している親戚や友人がBMVの支局でインディアナ州居住証明宣誓供述書に署名する必要があります。
- id: 303
  category: license_system
  question: 英語以外の言語で書かれた書類をBMVに提出する場合、何が必要ですか？
  choices:
    A: 支局において家族による口頭での翻訳
    B: 承認された機関のレターヘッドにタイピングされた完全な翻訳
    C: 元の書類の公証済みコピー
    D: 友人によって提供された翻訳
  answer: B
  explanation: 翻訳は、政府機関、認定された教育機関、または翻訳会社のレターヘッドを使用し、別の用紙にタイピングされたものでなければなりません。
- id: 304
  category: license_system
  question: BMVの申請書類の翻訳を行うことが明確に禁止されているのは誰ですか？
  choices:
    A: 政府機関
    B: 認定された教育機関
    C: 翻訳会社
    D: 家族、友人、またはビジネス関係者
  answer: D
  explanation: 翻訳者は、その書類が家族、友人、またはビジネス関係者のために翻訳されたものではないことを宣言しなければなりません。
- id: 305
  category: defensive_driving
  question: マニュアルによると、ティーンエイジャー（10代）の事故において最も一般的な要因は何ですか？
  choices:
    A: 過度なスピード
    B: 誤った危険な運転および注意散漫（わき見運転）
    C: 他のティーンエイジャーと同乗しての運転
    D: シートベルトの未着用
  answer: B
  explanation: マニュアルには、誤った危険な運転および注意散漫が、ティーンエイジャーの事故における最も一般的な要因であると記載されています。
- id: 306
  category: defensive_driving
  question: ティーンエイジャーのドライバーが車両に同乗者を乗せている場合、事故の確率はどうなりますか？
  choices:
    A: 監視の目が増えるため、わずかに減少する
    B: 一人で運転している場合と変わらない
    C: 同乗者が一人増えるごとに2倍になる
    D: 同乗者が一人増えるごとに3倍になる
  answer: C
  explanation: 車両に同乗者が一人増えるごとに、事故の確率は2倍になります。
- id: 307
  category: safe_driving_rules
  question: ティーンエイジャーが関与する複数車両の事故のほとんどは、どこで発生していますか？
  choices:
    A: 高速道路
    B: 駐車場
    C: 交差点
    D: 田舎道
  answer: C
  explanation: ティーンエイジャーが関与する複数車両の事故のほとんどは交差点で発生しています。ティーンエイジャーのドライバーは、交差点では注意散漫を避け、他の車両に集中する必要があります。
- id: 308
  category: safe_driving_rules
  question: マニュアルで、運転中に大音量で音楽を流さないよう勧めているのはなぜですか？
  choices:
    A: 車両のバッテリーを消耗させるため
    B: インディアナ州では違法であるため
    C: サイレンやクラクションの音が聞こえなくなる可能性があるため
    D: ドライバーがスピードを出しすぎる原因になるため
  answer: C
  explanation: 音楽を大音量で流さないでください。トラブルの可能性を警告するサイレンやクラクションの音が聞こえなくなる可能性があります。
- id: 309
  category: defensive_driving
  question: ティーンエイジャーが関与する単独車両事故の一般的な要因は何ですか？
  choices:
    A: 不注意
    B: 過度なスピード
    C: 他のティーンエイジャーと同乗しての運転
    D: ラジオの調整
  answer: B
  explanation: 過度なスピードです。違法または安全でない速度は、単独車両事故の一般的な要因です。
- id: 310
  category: license_system
  question: 社会保障番号（SSN）を取得する資格がない場合、その代わりに提出を求められる可能性がある書類は何ですか？
  choices:
    A: 有効なI-94
    B: W-2フォーム
    C: 1099フォーム
    D: インディアナ州有権者登録カード
  answer: A
  explanation: 米国での就労が許可されていない場合、社会保障番号の代わりに有効なI-94の提出を求められることがあります。
- id: 311
  category: license_system
  question: インディアナ州の居住証明として認められるためには、住宅所有者保険、賃借人保険、または自動車保険の保険証券は発行からどのくらい経過している必要がありますか？
  choices:
    A: 申請日から30日以内の日付のもの
    B: 申請日から60日以内の日付のもの
    C: 申請日から90日以内の日付のもの
    D: 申請日から1年以内の日付のもの
  answer: D
  explanation: 氏名と居住住所が記載された、現在有効な住宅所有者保険、賃借人保険、または自動車保険の保険証券は、申請日から1年以内の日付である必要があります。
- id: 312
  category: license_system
  question: ホームレスの申請者は、インディアナ州居住証明宣誓供述書（Indiana Residency Affidavit）と共に何を提出しなければなりませんか？
  choices:
    A: W-2フォーム
    B: サービスを提供している政府機関または非営利団体からのレターヘッド付きの書面
    C: インディアナ州所得税の納税証明
    D: 有効なインディアナ州拳銃携帯許可証
  answer: B
  explanation: ホームレスの申請者は、政府機関または非営利団体から、その名称、住所、電話番号、および法的代表者の氏名、署名、署名日が記載されたレターヘッド付きの書面を提出する必要があります。
- id: 313
  category: driver_responsibility
  question: シートとミラーを調整するのに最適なタイミングはいつですか？
  choices:
    A: 赤信号で停止しているとき
    B: 運転を開始する前毎回
    C: 低速で走行しているとき
    D: 新しい車を運転するときのみ
  answer: B
  explanation: マニュアルでは、最高の視界を確保するために、運転を開始する前に必ずシートとミラーを調整することを推奨しています。
- id: 314
  category: safe_driving_rules
  question: ラジオの調整を車両が停止するまで待つべきなのはなぜですか？
  choices:
    A: 車両が動いていると車のバッテリーを消耗するため。
    B: ほんの数秒間でも道路から注意をそらすと、衝突につながる可能性があるため。
    C: 車両が走行中はラジオの信号が弱くなるため。
    D: インディアナ州では運転中にラジオに触れることは違法であるため。
  answer: B
  explanation: マニュアルには、ほんの数秒間でも道路から注意をそらすと衝突につながる可能性があるため、ラジオの調整は停止するまで待つ方が良いと記載されています。
- id: 315
  category: safe_driving_rules
  question: 運転中に大音量で音楽を流すことの潜在的な危険は何ですか？
  choices:
    A: トラブルの可能性を警告するサイレンやクラクションの音が聞こえなくなる可能性がある。
    B: 時間の経過とともに車両の電気システムを損傷する可能性がある。
    C: 運転者が無意識のうちに制限速度よりも速く走ってしまう原因となる。
    D: 騒音違反とみなされ、重罪（felony）となる。
  answer: A
  explanation: マニュアルによると、トラブルの可能性を警告するサイレンやクラクションの音が聞こえなくなる可能性があるため、大音量で音楽を流すべきではありません。
- id: 316
  category: safe_driving_rules
  question: 運転中に法律違反であるとはっきりと述べられている行為はどれですか？
  choices:
    A: ラジオの調整。
    B: 電話での通話やテキストメッセージの送信。
    C: 食事。
    D: 髪をとかすこと。
  answer: B
  explanation: マニュアルには「運転中に電話で話したり、テキストメッセージを送ったりしないでください。それは法律違反です」とはっきりと記載されています。
- id: 317
  category: alcohol_drugs_health
  question: 一部の市販薬は運転にどのような影響を与える可能性がありますか？
  choices:
    A: 反応時間を改善する可能性がある。
    B: 眠気を誘う可能性がある。
    C: 視力を高める。
    D: 運転能力に影響を与えない。
  answer: B
  explanation: マニュアルは、影響下での運転をしないよう警告しており、「一部の市販薬でさえ眠気を誘う可能性がある」と記しています。
- id: 318
  category: safe_driving_rules
  question: 交差点に近づいたときに信号が青から黄色に変わった場合、どうすべきですか？
  choices:
    A: 赤に変わる前に交差点を通過するために加速する。
    B: 注意して交差点に進入し、交差する交通に道を譲る。
    C: すでに交差点内にいる場合を除き、信号が黄色に変わった後は交差点に進入すべきではない。
    D: すでに交差点の真ん中にいる場合でも、直ちに停止する。
  answer: C
  explanation: マニュアルには「信号が黄色に変わったときにすでに交差点内にいる場合を除き、信号が黄色に変わった後は交差点に進入すべきではありません」と記載されています。
- id: 319
  category: safe_driving_rules
  question: 制限速度を守ることが重要なのはなぜですか？
  choices:
    A: スピードを出しすぎると、車両の燃費が向上するため。
    B: スピードを出しすぎると、停止したり反応したりするための時間が短くなるため。
    C: タイヤの過度な摩耗を防ぐため。
    D: 黄信号に遭遇しないようにするため。
  answer: B
  explanation: マニュアルには「制限速度を守ってください。スピードを出しすぎると、停止したり反応したりするための時間が短くなります」と記載されています。
- id: 320
  category: driver_responsibility
  question: 10代のドライバーのために車両を選ぶ際、保護者は何を優先すべきですか？
  choices:
    A: 車両のイメージとスタイル。
    B: 車両の最高速度性能。
    C: 安全性。
    D: 車両のオーディオおよびエンターテインメントシステム。
  answer: C
  explanation: 「10代の保護者へのヒント」のセクションでは、保護者に対し「イメージではなく、安全性のために車両を選ぶこと」とアドバイスしています。
- id: 321
  category: driver_responsibility
  question: 10代のドライバーが経験を積み、適切な判断ができるようになるにつれて、保護者に推奨される戦略は何ですか？
  choices:
    A: 即座に無制限の運転特権を与えること。
    B: 段階的に特権を拡大していく戦略を立てること。
    C: 知識を試すために学習許可証を取り消すこと。
    D: 監督下での運転練習時間を減らすこと。
  answer: B
  explanation: マニュアルでは、経験を積むにつれて10代のドライバーがより高いレベルの運転責任を担えるよう、段階的に特権を拡大していく戦略を立てることを推奨しています。
- id: 322
  category: vehicle_information
  question: オフロード車両（ORV）を運転または乗車する際、DOT（運輸省）承認のヘルメット着用が義務付けられている年齢は何歳ですか？
  choices:
    A: 16歳未満の全員。
    B: 18歳未満の全員。
    C: 21歳未満の全員。
    D: 年齢に関わらず、すべての乗員。
  answer: B
  explanation: マニュアルには、「ORVを運転または乗車する18歳未満の者は、米国運輸省（DOT）が定めた基準を満たすヘルメットを着用しなければならない」と記載されています。
- id: 323
  category: driver_responsibility
  question: オフロード車両（ORV）の所有者が、未成年者に関して禁止されている行為は何ですか？
  choices:
    A: 18歳未満の者がDOT承認のヘルメットを着用せずにORVを運転することを、知りながら許可すること。
    B: いかなる状況においても、18歳未満の者が私有地でORVに乗ることを許可すること。
    C: 21歳未満の者にORVを販売すること。
    D: 16歳未満の者にORVのメンテナンスを行わせること。
  answer: A
  explanation: ORVの所有者または保持者は、18歳未満の者がDOT承認のヘルメットを着用せずにORVを運転することを、知りながら承認または許可してはなりません。
- id: 324
  category: license_system
  question: 資格のある個人がBMV（車両管理局）を通じて有権者登録の申請ができるのはいつですか？
  choices:
    A: 完全に新規の証明書を取得する場合のみ。
    B: 大統領選挙の年のみ。
    C: 証明書の新規取得、更新、再発行、または記載事項変更を行うとき。
    D: BMVの支局に直接出向く場合のみ。
  answer: C
  explanation: マニュアルには、「証明書の新規取得、更新、再発行、または記載事項変更を行う個人は、投票資格がある場合に限り、有権者登録の申請も行うことができる」と記載されています。
- id: 325
  category: license_system
  question: インディアナ州法に基づき、BMVが運転免許証の新規取得または更新時に選抜徴兵対象者登録制度（Selective Service system）へ情報を提出しなければならないのは、どのグループですか？
  choices:
    A: 18歳未満のすべての個人。
    B: 26歳未満の男性。
    C: 26歳未満の女性。
    D: 18歳以上のすべての個人。
  answer: B
  explanation: BMVは、運転免許証の新規取得または更新時に、26歳未満の男性を選抜徴兵対象者登録制度に登録するために必要な情報を提出することが義務付けられています。
- id: 326
  category: penalties_and_points
  question: 義務付けられている場合に選抜徴兵対象者登録制度への登録を怠った場合の罰則は何ですか？
  choices:
    A: 500ドルの罰金が科せられる軽罪。
    B: 最大5年の禁錮と25万ドルの罰金が科せられる重罪。
    C: 1年間の運転特権の即時停止。
    D: 書面による警告と強制的な出廷。
  answer: B
  explanation: マニュアルによると、選抜徴兵対象者登録制度への登録を怠ることは重罪（フェロニー）であり、最大5年の禁錮と25万ドルの罰金が科せられる可能性があります。
- id: 327
  category: vehicle_information
  question: 車両登録の更新後、ナンバープレートとステッカーが郵送で届くまでに通常どれくらいの時間がかかりますか？
  choices:
    A: 7日間
    B: 14日間
    C: 21日間
    D: 30日間
  answer: C
  explanation: マニュアルでは、オンライン、電話、郵送のいずれの更新方法においても、「プレートとステッカーは約21日で届く」と繰り返し述べられています。
- id: 328
  category: vehicle_information
  question: BMVを通じて車両登録を更新する便利な方法として、リストに含まれていないものはどれですか？
  choices:
    A: BMVコネクト・キオスクを利用する。
    B: 電話で更新する。
    C: 郵送で更新する。
    D: サードパーティのモバイルアプリを通じて更新する。
  answer: D
  explanation: BMVは、オンライン（IN.gov/BMV）、電話、BMVコネクト・キオスク、郵送の4つの更新方法を提供しています。サードパーティのモバイルアプリは選択肢として言及されていません。
- id: 329
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 徐行して注意深く進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤色の八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に交通状況と歩行者を確認してください。
  image: stop.png
- id: 330
  category: signs_and_signals
  question: この標識は何をすることを求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通の流れに合流する
    C: 減速し、車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」標識は、減速して他の車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  image: yield.png
- id: 331
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターン（転回）する
    B: 注意深く運転を続ける
    C: 停止して後退するか、向きを変える。あなたは逆走しています。
    D: その場所を素早く離れるために加速する
  answer: C
  explanation: 赤と白の「WRONG WAY（進入禁止/逆走）」の標識は、一方通行の道路や高速道路のランプで対向車線に入っていることを意味します。直ちに停止し、安全に向きを変えるか後退してください。
  image: wrong_way.png
- id: 332
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方通行（左方向）に流れている
    C: 中央分離帯の左側を走行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」の標識は、その通りの交通が矢印の指す一方向にのみ進むことを示しています。
  image: one_way_left.png
- id: 333
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所でのUターン（転回）が禁止されていることを意味します。
  image: no_u_turn.png
- id: 334
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  image: no_left_turn.png
- id: 335
  category: signs_and_signals
  question: この標識はドライバーに何を指示していますか？
  choices:
    A: 右側に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線がなくなる
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  image: keep_right.png
- id: 336
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。速度制限の標識は、理想的な条件下でのその区域の法定最高速度を示しています。
  image: speed_limit_25.png
- id: 337
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園やサファリパークがある
    B: この区域ではシカが頻繁に道路を横断する
    C: この先は狩猟区域である
    D: 近くに野生動物保護区がある
  answer: B
  explanation: シカのシルエットが描かれた黄色いひし形の標識は、その区域でシカが頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  image: deer_crossing.png
- id: 338
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区域
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  image: school_zone.png
- id: 339
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型の鉄道交差標識（クロバック）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  image: railroad_crossbuck.png
- id: 340
  category: signs_and_signals
  question: この標識はカーブの標識とどう違いますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: 大幅な減速が必要な急カーブを警告している
    C: 右折専用を意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。このカーブの手前では、より大幅に速度を落とす必要があります。
  image: sharp_turn_right.png
- id: 341
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先にカーブが1つある
    C: 反対方向への2つの連続するカーブ
    D: この先にラウンドアバウト（環状交差点）がある
  answer: C
  explanation: 「背向（はいこう）カーブ」の標識は、この先に反対方向への2つのカーブがあることを警告しています。減速し、道路が最初に一方へ、次に反対側へ曲がることに備えてください。
  image: reverse_curve.png
- id: 342
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 1つの急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブまたは曲がり角
    D: この先に坂道がある
  answer: C
  explanation: 「屈曲あり（ワインディングロード）」の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、道路状況の変化に注意してください。
  image: winding_road.png
- id: 343
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 他の道路からの合流車両
    C: 分離高速道路の始まり
    D: 1車線への幅員減少
  answer: B
  explanation: 黄色のひし形の「合流」標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
  image: merge.png
- id: 344
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 分離高速道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって反対車線と仕切られた分離高速道路になることを警告しています。右側を通行してください。
  image: divided_highway.png
- id: 345
  category: signs_and_signals
  question: この標識はこの先に何があることを伝えていますか？
  choices:
    A: 「譲れ」の標識
    B: 信号機
    C: 一時停止しなければならない「止まれ」の標識
    D: スピードバンプ（段差）
  answer: C
  explanation: この標識は、この先に一時停止の標識があることを警告しています。減速を開始し、一時停止の標識で完全に停止できるよう準備してください。
  image: stop_ahead.png
- id: 346
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車標章またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転者
  answer: C
  explanation: 車椅子のシンボルが描かれた青色の標識は、障害者専用の駐車スペースであることを示しています。有効な障害者用駐車標章またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反には高額な罰金が科せられます。
  image: handicap_parking.png
- id: 347
  category: sharing_the_road
  question: インディアナ州の「Move Over（進路譲渡）法」に基づき、赤色灯を点滅させている緊急車両に接近する際、運転者は何をしなければなりませんか？
  choices:
    A: 時速5マイル減速し、同じ車線を走行し続ける
    B: 優先権を譲り、脇に寄って停止するか、車線を変更する
    C: 緊急車両に知らせるためにクラクションを鳴らす
    D: ハザードランプを点灯させ、現在の速度を維持する
  answer: B
  explanation: マニュアルには、インディアナ州のMove Over法は「赤色灯を点滅させている緊急車両に接近する際、運転者に優先権を譲ること、右側に寄って完全に停止すること、または車線を変更することを義務付けている」と記載されています。
- id: 348
  category: sharing_the_road
  question: インディアナ州で、赤色灯を点滅させている緊急車両のために車線を空ける（Move Over）ことができない場合、どうしなければなりませんか？
  choices:
    A: 自分の車線内で完全に停止する
    B: 制限速度より時速10マイル低い速度まで減速し、注意して進む
    C: 制限速度を維持する
    D: ハザードランプを点灯させ、通常通り走行を続ける
  answer: B
  explanation: マニュアルには、「車線を空けることができない場合、運転者は制限速度より時速10マイル低い速度まで減速し、注意して進まなければならない」と記載されています。
- id: 349
  category: sharing_the_road
  question: インディアナ州において、琥珀色（アンバー）の点滅灯をつけた認可済みの停車車両に対して、車線を空けなかったり減速しなかったりした場合、どのクラスの違反になりますか？
  choices:
    A: クラスA違反
    B: クラスB違反
    C: クラスC軽罪
    D: クラスD重罪
  answer: B
  explanation: マニュアルには、琥珀色の点滅灯をつけた車両に対するMove Over要件に従わなかった場合は「クラスB違反となる」と記載されています。
- id: 350
  category: sharing_the_road
  question: インディアナ州のMove Over法において、琥珀色の点滅灯をつけた「認可済み車両」に該当するのは次のうちどれですか？
  choices:
    A: ハザードランプを点灯させた個人車両
    B: レッカー車／牽引トラック
    C: 配達中の民間車両
    D: 琥珀色のライトをつけたスクールバス
  answer: B
  explanation: マニュアルには、琥珀色の点滅灯をつけた認可済み車両として、「レッカー車／牽引トラック、道路維持管理車両、公共事業サービス車両、廃棄物運搬車／ゴミ収集車、測量／建設車両」などが挙げられています。
- id: 351
  category: sharing_the_road
  question: インディアナ州の法律では、ハザードランプを点滅させて停車している故障車に接近する際、運転者は何をしなければなりませんか？
  choices:
    A: 故障車の運転者に知らせるためにクラクションを鳴らす
    B: 故障車から離れるように車線を変更するか、車線変更ができない場合は制限速度より時速10マイル（10 mph）以上減速する
    C: 停車して助けを申し出る
    D: 制限速度のまま走行を続ける
  answer: B
  explanation: マニュアルには、「ハザードランプを点滅させて停車している故障車に接近する運転者は、故障車から離れるように車線を変更する必要があります。車線変更ができない場合は、制限速度より時速10マイル（10
    mph）減速し、注意して進まなければなりません」と記載されています。
- id: 352
  category: sharing_the_road
  question: インディアナ州の運転マニュアルによると、なぜオートバイの運転者には車線の全幅の使用が認められるべきなのですか？
  choices:
    A: インディアナ州法が礼儀としてそれを義務付けているため
    B: 安全に操縦し、他の運転者には見えない潜在的な危険を回避するために、車線をフルに使用する必要がある場合があるため
    C: オートバイは車線全体を使わないと低速でバランスを保てないため
    D: オートバイの運転者は常に車線の中央を走行するため
  answer: B
  explanation: マニュアルには、「オートバイやMDC（原動機付自転車）の運転者は、安全に操縦し、他の自動車運転者には見えない潜在的な危険を回避するために、車線をフルに使用する必要がある場合があることを考慮することが重要です」と記載されています。
- id: 353
  category: sharing_the_road
  question: インディアナ州の運転マニュアルによると、駐車後に車のドアを開ける前に、運転者は何をすべきですか？
  choices:
    A: 警告としてクラクションを鳴らす
    B: 自転車利用者がいないか確認する
    C: 車内灯をつける
    D: 停車後10秒間待つ
  answer: B
  explanation: マニュアルには、「駐車後、車のドアを開ける前に、運転者はまず自転車利用者がいないか確認する必要があります」と記載されています。
- id: 354
  category: sharing_the_road
  question: インディアナ州において、道路上の「シャロウ（sharrow）」標示とは何ですか？
  choices:
    A: 共有右左折車線を示す標示
    B: 自転車と2つの矢印が描かれた路面標示で、走行車線に自転車がいる可能性があることを運転者に警告するもの
    C: 共有駐車エリアの標示
    D: この先合流地点があることを示す記号
  answer: B
  explanation: マニュアルには、「シャロウ標示は、自転車の上に2つの矢印が描かれた路面標示であり、自転車利用者が路肩の停車車両から離れた位置を走行するのを助け、他の道路利用者に自転車が走行車線を走る可能性があることを警告するためのものです」と記載されています。
- id: 355
  category: sharing_the_road
  question: インディアナ州の公道において、馬の乗り手や馬車の運転者はどのような権利と責任を持っていますか？
  choices:
    A: 常に路肩にいなければならない
    B: 自動車の運転者と同じ権利と責任
    C: すべての自動車に対して優先権を持つ
    D: 田舎道でのみ許可されている
  answer: B
  explanation: マニュアルには、「公道を走行する際、馬の乗り手や馬車の運転者は、自動車の運転者と同じ権利と責任を有します」と記載されています。
- id: 356
  category: sharing_the_road
  question: インディアナ州では、歩行者が近くにいる場合、運転者は常に何をしなければなりませんか？
  choices:
    A: ヘッドライトを点滅させて注意を促す
    B: 常に歩行者に道を譲る（優先権を譲る）
    C: 横断歩道に近づく際にクラクションを鳴らす
    D: 交通信号に関係なく完全に停止する
  answer: B
  explanation: マニュアルには、歩行者に関する最初の規則として「常に歩行者に道を譲る」と記載されています。
