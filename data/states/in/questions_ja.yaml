questions:
- id: 1
  category: license_system
  question: インディアナ州の免許証、身分証明書（ID）、または許可証において、それがReal IDであることを示す視覚的な印は何ですか？
  choices:
    A: 州章のホログラム
    B: 右上の隅にある星印
    C: 表面にあるバーコード
    D: 上部を横切る青いストライプ
  answer: B
  explanation: マニュアルによると、Real IDは免許証、ID、および許可証の右上の隅にある星印によって示されます。
- id: 2
  category: license_system
  question: Real IDを保持することの利点は次のうちどれですか？
  choices:
    A: CDL（商用運転免許）なしで商用車を運転できる。
    B: 米国内の民間航空機に搭乗できる。
    C: 州間高速道路の通行料の支払いが免除される。
    D: パスポートなしで海外旅行ができる。
  answer: B
  explanation: マニュアルには、Real IDがあれば米国内の民間航空機に搭乗できると記載されています。
- id: 3
  category: license_system
  question: 国内の民間航空機への搭乗に加えて、Real IDで他に何ができますか？
  choices:
    A: 特定の連邦施設への立ち入りや軍事基地への訪問
    B: 空港のセキュリティチェックポイントのバイパス
    C: 別の免許なしでの船舶の操縦
    D: 指定された障害者用駐車場への駐車
  answer: A
  explanation: マニュアルでは、Real IDによって軍事基地への訪問や特定の連邦施設への立ち入りが可能になると規定されています。
- id: 4
  category: license_system
  question: インディアナ州の居住者は、Real IDへのアップグレードに必要な書類に関する情報をどこで見つけることができますか？
  choices:
    A: BMV.IN.gov
    B: RealID.IN.gov
    C: Indiana.gov/ID
    D: HoosierDrive.com
  answer: B
  explanation: マニュアルでは、Real IDへのアップグレードに必要な書類を確認するために RealID.IN.gov にアクセスするよう案内しています。
- id: 5
  category: license_system
  question: インディアナ州車両管理局（BMV）のミッションステートメントによると、BMVはドライバーおよび車両サービスをどのように提供することを目指していますか？
  choices:
    A: 標準的なドライバーよりも商用ドライバーを優先することによって
    B: 安全性と透明性を確保しつつ、迅速かつ正確な方法で
    C: すべてのインディアナ州民に無料の資格更新を提供することによって
    D: オンラインプラットフォームのみを通じて
  answer: B
  explanation: BMVの使命は、安全性と透明性を確保しながら、最高クラスのドライバーおよび車両サービスを迅速かつ正確な方法で提供することにより、すべてのインディアナ州民に奉仕することです。
- id: 6
  category: driver_testing
  question: 新しい免許等（資格）の取得に関するマニュアルのセクションに基づき、次のうちどの検査または試験が必要ですか？
  choices:
    A: 聴力検査
    B: 視力検査
    C: 体力テスト
    D: 心理評価
  answer: B
  explanation: マニュアルの第1章「新しい資格の取得」では、必要な項目として「視力検査」が挙げられています。
- id: 7
  category: driver_responsibility
  question: 新しい免許等を取得するプロセスにおいて、事故や損害の可能性に関してカバーされているトピックはどれですか？
  choices:
    A: 負傷または損害に対する金銭的責任
    B: 包括的な衝突補償
    C: 医療過誤保険
    D: 車両保証登録
  answer: A
  explanation: マニュアルの第1章には、新しい免許等を取得する際の「負傷または損害に対する金銭的責任」に関する特定のセクションが含まれています。
- id: 8
  category: license_system
  question: インディアナ州のドライバーズマニュアルに、特定の特記事項（エンドースメント）または免許の種類として記載されているのは次のうちどれですか？
  choices:
    A: 重機オペレーター免許
    B: 旅客・貨物運送用（For-Hire）エンドースメント
    C: 農業用車両許可証
    D: レクリエーション車両（RV）免許
  answer: B
  explanation: マニュアルの第2章では制限事項とエンドースメントについて説明しており、その中に「旅客・貨物運送用（For-Hire）エンドースメント」が明記されています。
- id: 9
  category: license_system
  question: インディアナ州の免許等に追加できる軍歴表示の種類は何ですか？
  choices:
    A: 退役予備役表示
    B: 現役および退役軍人表示
    C: 州兵扶養家族表示
    D: 海外派遣表示
  answer: B
  explanation: マニュアルの第3章では、免許等に追加できるオプションとして「現役および退役軍人表示」を挙げています。
- id: 10
  category: penalties_and_points
  question: インディアナ州のドライバーズマニュアルにおいて、違反点数や免許停止に関連するプログラムはどれですか？
  choices:
    A: ドライバー安全プログラム
    B: ハイウェイ・ウォッチ・プログラム
    C: フージャー・ヘルパー・イニシアチブ
    D: 事故免除プログラム
  answer: A
  explanation: マニュアルの第5章「点数、免許停止、および保険要件」には、「ドライバー安全プログラム」に関する情報が含まれています。
- id: 11
  category: penalties_and_points
  question: インディアナ州運転免許マニュアルでは、重大な交通違反を繰り返す運転者を指すためにどのような用語を使用していますか？
  choices:
    A: 慢性交通違反者 (Chronic Traffic Offenders)
    B: 常習的交通違反者 (Habitual Traffic Violators)
    C: 反復移動違反者 (Repeat Moving Violators)
    D: 高リスクドライバー (High-Risk Motorists)
  answer: B
  explanation: マニュアルの第5章では点数と免許停止について説明しており、その中に「常習的交通違反者 (Habitual Traffic Violators)」専用のセクションがあります。
- id: 12
  category: signs_and_signals
  question: マニュアルで説明されている交通標識の特定のカテゴリーは次のうちどれですか？
  choices:
    A: 交通提案標識 (Traffic Suggestion Signs)
    B: 交通案内標識 (Traffic Guidance Signs)
    C: 交通執行標識 (Traffic Enforcement Signs)
    D: 交通観察標識 (Traffic Observation Signs)
  answer: B
  explanation: マニュアルの第6章では交通標識と信号について説明しており、その中に「交通案内標識 (Traffic Guidance Signs)」に関する特定のセクションが含まれています。
- id: 13
  category: vehicle_information
  question: マニュアルの安全な車両操作に関するセクションにおいて、タイヤの空気圧と並んで具体的に取り上げられている車両メンテナンスの項目は何ですか？
  choices:
    A: オイルの寿命
    B: ブレーキパッドの摩耗
    C: 溝の深さ (Tread Depth)
    D: 冷却水の量
  answer: C
  explanation: マニュアルの第7章では安全な車両操作について説明しており、「タイヤの空気圧と溝の深さ (Tire Pressure and Tread
    Depth)」というタイトルのセクションが含まれています。
- id: 14
  category: safe_driving_rules
  question: 「安全な車両操作」の章で具体的に取り上げられている運転行動は次のうちどれですか？
  choices:
    A: 脇見運転 (Distracted Driving) と攻撃的な運転 (Aggressive Driving)
    B: 無断乗り回しと公道レース
    C: 車間距離の詰めすぎと急ブレーキによる嫌がらせ
    D: 相乗り (Carpooling) とライドシェア
  answer: A
  explanation: マニュアルの第7章では安全な車両操作について説明しており、「脇見運転 (Distracted Driving)」と「攻撃的な運転 (Aggressive
    Driving)」に関する特定のセクションが含まれています。
- id: 15
  category: license_system
  question: オートバイ以外で、「制限事項と裏書き (Restrictions and Endorsements)」の項目に独自のセクションがある特定の種類の乗り物は何ですか？
  choices:
    A: 自転車
    B: 原動機付自転車 (Motor Driven Cycle / MDC)
    C: 電動スクーター
    D: 全地形対応車 (ATV)
  answer: B
  explanation: マニュアルの第2章では制限事項と裏書きについて説明しており、その中に「原動機付自転車 (MDC)」に関する特定のセクションが含まれています。
- id: 16
  category: license_system
  question: 21歳未満のインディアナ州居住者に発行される証明書（免許証等）はどのような形式ですか？
  choices:
    A: 横型
    B: 縦型
    C: 正方形
    D: 冊子形式
  answer: B
  explanation: 21歳未満のインディアナ州居住者に発行されるすべての証明書は縦型であり、カード保持者が18歳および21歳になる日付が表示されます。
- id: 17
  category: license_system
  question: インディアナ州の証明書の右上隅にある星印は何を示していますか？
  choices:
    A: 運転者が臓器提供者であること
    B: 運転者が商用運転免許証を所持していること
    C: 証明書がReal IDに準拠していること
    D: 運転者が21歳未満であること
  answer: C
  explanation: 右上隅に表示される星印は、その証明書がReal IDに準拠しており、連邦政府の目的で身分証明書として使用できることを示しています。
- id: 18
  category: license_system
  question: インディアナ州の新しい居住者は、インディアナ州の運転免許証を取得するまでにどれくらいの期間が与えられますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 180日
  answer: B
  explanation: インディアナ州の居住者になった場合、60日以内にインディアナ州の新しい運転免許証を取得する必要があります。
- id: 19
  category: license_system
  question: 他の州の有効な運転免許証を一度も所持したことがないインディアナ州の新規居住者の場合、運転免許証を申請する前にインディアナ州の仮免許証（ラーナーズパーミット）を最低何日間保持する必要がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 180日
  answer: D
  explanation: 他の州の有効な運転免許証を一度も所持したことがない場合は、インディアナ州の運転免許証を申請する前に、インディアナ州の仮免許証を180日間保持する必要があります。
- id: 20
  category: driver_testing
  question: 他州の運転免許証の有効期限が5年以上切れている場合、どの試験に合格する必要がありますか？
  choices:
    A: 標準的な視力検査のみ
    B: 知識試験のみ
    C: 知識試験と運転技能試験
    D: 運転技能試験と身体検査
  answer: C
  explanation: 他州の運転免許証の有効期限が5年以上切れている場合、インディアナ州の運転免許証を取得するには、知識試験と運転技能試験の両方に合格する必要があります。
- id: 21
  category: driver_testing
  question: 18歳の新居住者で、他州の運転免許証の有効期限が切れてから5年未満の場合、どの試験を受ける必要がありますか？
  choices:
    A: 運転技能試験
    B: 知識試験（学科試験）
    C: 身体検査
    D: 聴力検査
  answer: B
  explanation: 他州の運転免許証の有効期限が切れてから5年未満であるか、取り消されていない他州の運転免許証を1年未満保持していた場合、インディアナ州の運転免許証を取得するには知識試験に合格する必要があります。
- id: 22
  category: license_system
  question: インディアナ州の居住者である証拠とみなされるのは、次のうちどれですか？
  choices:
    A: 州内での臨時雇用者であること
    B: インディアナ州で有権者登録をしていること
    C: インディアナ州の居住権を主張せずに高等教育機関に在籍していること
    D: 他州の居住権を主張している現役軍人であること
  answer: B
  explanation: インディアナ州の居住者の証拠には、インディアナ州内に居住住所を維持していること、インディアナ州で有権者登録をしていること、またはインディアナ州内の初等・中等学校に扶養家族が在籍していることなどが含まれます。
- id: 23
  category: license_system
  question: インディアナ州の身分証明書（IDカード）を無料で受け取ることができるのは誰ですか？
  choices:
    A: 18歳未満のすべての個人
    B: 次回の総選挙または地方選挙の当日までに18歳になる、あるいはすでに18歳である個人
    C: インディアナ州のすべての新居住者
    D: 他州の運転免許証を返納した個人
  answer: B
  explanation: 身分証明書（IDカード）は、次回の総選挙または地方選挙の当日までに18歳になる、あるいはすでに18歳である個人に対して無料で発行されます。
- id: 24
  category: license_system
  question: マニュアルによると、インディアナ州はいつからリアルID法（Real ID Act）の要件に準拠していますか？
  choices:
    A: 2005年1月1日
    B: 2010年1月1日
    C: 2015年1月1日
    D: 2020年1月1日
  answer: B
  explanation: マニュアルには、インディアナ州は2010年1月1日からリアルID法（Real ID Act）の要件に準拠していると記載されています。（p.
    2）
- id: 25
  category: license_system
  question: リアルID（Real ID）準拠の証明書にアップグレードするために必要な書類として、明示的に記載されていないものはどれですか？
  choices:
    A: 本人確認書類
    B: 法的居住資格の証明
    C: 社会保障番号
    D: 自動車保険の証明
  answer: D
  explanation: リアルID準拠の証明書にアップグレードするには、本人確認、法的居住資格、社会保障番号、およびインディアナ州居住の証明の原本または認証コピーを提出する必要があります。自動車保険の証明は必要ありません。
- id: 26
  category: license_system
  question: 確認プロセス中に、申請者が他州の証明書を保持していることがBMV（車両管理局）によって判明した場合、どうなりますか？
  choices:
    A: 申請者は二重居住手数料を支払わなければならない。
    B: 申請者は他州の証明書を返納することを求められる。
    C: 申請者には60日間有効なインディアナ州の暫定証明書が発行される。
    D: 申請者はインディアナ州の証明書を取得することを永久に禁止される。
  answer: B
  explanation: 確認中に、申請者に他州で別の証明書が発行されていることがBMVによって判明した場合、BMVがインディアナ州の証明書の申請を処理する前に、申請者は他州の証明書を返納する必要があります。
- id: 27
  category: license_system
  question: 21歳未満の居住者に発行されるインディアナ州の証明書に目立つように表示されている日付は何ですか？
  choices:
    A: カード保持者が18歳および21歳になる日付
    B: カード保持者が16歳および18歳になる日付
    C: カード保持者が許可証および免許証を取得した日付
    D: 次回の総選挙および地方選挙の日付
  answer: A
  explanation: 21歳未満のインディアナ州居住者に発行されるすべての証明書は縦型の形式であり、カード保持者が18歳および21歳になる日付が表示されます。
- id: 28
  category: driver_testing
  question: 必要な書類の提出に加えて、すべてのインディアナ州の新居住者が運転免許証を取得する際に合格しなければならない検査は何ですか？
  choices:
    A: 標準的な聴力検査
    B: 標準的な視力検査
    C: 薬物およびアルコール検査
    D: 身体能力検査
  answer: B
  explanation: リストされたすべてのカテゴリーに該当する個人は、本人確認、法的居住資格、社会保障番号、およびインディアナ州居住を証明する書類も提示しなければなりません。また、標準的な視力検査に合格することも義務付けられています。
- id: 29
  category: license_system
  question: 証明書の取得において、インディアナ州の居住者とみなされないのは次のうち誰ですか？
  choices:
    A: インディアナ州に居住住所を維持し、他州での居住権を主張していない人
    B: インディアナ州の有権者登録をしている人
    C: インディアナ州の小学校に扶養家族が在籍している人
    D: インディアナ州を居住州として申告していない現役軍人
  answer: D
  explanation: 証明書取得の目的において、インディアナ州を居住州として申告していない現役軍人は、インディアナ州居住者とはみなされません。
- id: 30
  category: license_system
  question: 18歳以上で有効な他州の運転免許証を保持している場合、インディアナ州の免許を申請するために支局に持参できるものは次のうちどれですか？
  choices:
    A: 高校の卒業証書のコピー
    B: 公式な運転記録のコピー
    C: 以前の州の知事からの書簡
    D: 以前の州の公共料金の請求書
  answer: B
  explanation: 18歳以上で有効な他州の運転免許証を保持している場合は、現在の他州の運転免許証、公式な運転記録のコピー、または確認書の3つのうちいずれか1つを支局に持参する必要があります。
- id: 31
  category: license_system
  question: インディアナ州の標準的な身分証明書（IDカード）の有効期限はどのくらいですか？
  choices:
    A: 2年
    B: 4年
    C: 6年
    D: 8年
  answer: C
  explanation: マニュアルによると、身分証明書（IDカード）およびMDC（原動機付自転車）の裏書きの有効期限は6年間です。
- id: 32
  category: license_system
  question: インディアナ州の身分証明書（IDカード）を申請する際、すでに他州の証明書を保持している場合、どうしなければなりませんか？
  choices:
    A: 異なる州のものであれば、両方の証明書を保持し続ける
    B: 他州の証明書をインディアナ州BMVに返納する
    C: 追加料金を支払って複数の証明書を保持する
    D: 自分で他州の証明書を破棄する
  answer: B
  explanation: インディアナ州の居住者は、同時に複数の証明書を保持することはできません。したがって、身分証明書の申請を完了するには、他の証明書をインディアナ州BMVに返納する必要があります。
- id: 33
  category: license_system
  question: 身分証明書（IDカード）に原動機付自転車（MDC）の裏書き（エンドースメント）を取得するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: B
  explanation: 身分証明書には、15歳以上であり、MDC知識試験に合格していれば、原動機付自転車（MDC）を運転する資格を付帯させることができます。
- id: 34
  category: driver_testing
  question: 16歳未満で仮免許（ラーナーズ・パーミット）を申請する場合、運転教育への登録を証明する書類として認められないものは次のうちどれですか？
  choices:
    A: 学校発行の運転教育登録証明書
    B: クラス開始の2週間前の日付が記載された証明書
    C: 理論講習のオンラインコース修了証
    D: BMV認可の実技訓練（Behind-the-wheel）プロバイダーへの登録を証明する書類
  answer: C
  explanation: マニュアルには、理論講習のオンラインコース修了証は、登録を証明する書類としては認められないと明記されています。
- id: 35
  category: license_system
  question: 標準的な仮免許（ラーナーズ・パーミット）は、発行日からどのくらいの期間有効ですか？
  choices:
    A: 1年
    B: 2年
    C: 4年
    D: 6年
  answer: B
  explanation: 仮免許の有効期間のセクションによると、仮免許は発行日から2年間有効です。
- id: 36
  category: driver_testing
  question: 仮免許（ラーナーズ・パーミット）を更新する際、失効してから何日以上経過していると再試験を受ける必要がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 180日
  answer: D
  explanation: 仮免許の更新のためにBMVの支局を訪れた際、失効から180日以上経過している場合は、再試験を受ける必要があります。
- id: 37
  category: safe_driving_rules
  question: 16歳未満で親族と一緒に運転の練習をする場合、免許を持っている親族は最低何歳である必要がありますか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 30歳
  answer: C
  explanation: 血縁、婚姻、または法的地位による親族であり、有効な運転資格を持つ25歳以上の免許保持者が同乗していれば、運転の練習をすることができます。
- id: 38
  category: driver_testing
  question: コンピューターによる知識試験を受けるには、BMVの支局が閉まる何分前までに到着しなければなりませんか？
  choices:
    A: 少なくとも15分前
    B: 少なくとも30分前
    C: 少なくとも45分前
    D: 少なくとも1時間前
  answer: B
  explanation: その日にコンピューターによる知識試験を受けるには、支局が閉まる少なくとも30分前には到着していなければなりません。
- id: 39
  category: driver_testing
  question: 運転知識試験に不合格となった場合、どうしなければなりませんか？
  choices:
    A: 料金を支払ってすぐに再受験する
    B: 30分待って再受験する
    C: 翌営業日まで待って再受験する
    D: 丸1週間待って再受験する
  answer: C
  explanation: マニュアルには「知識試験に不合格となった場合、再受験するには翌営業日まで待たなければならない」と記載されています。
- id: 40
  category: penalties_and_points
  question: インディアナ州の運転免許証を更新する際、運転記録に少なくとも何ポイントの有効な違反点数（アクティブ・ポイント）がある場合に知識試験を受ける必要がありますか？
  choices:
    A: 2ポイント以上
    B: 4ポイント以上
    C: 6ポイント以上
    D: 8ポイント以上
  answer: C
  explanation: インディアナ州の運転記録に6ポイント以上の有効な違反点数があるドライバーが免許を更新する場合、運転知識試験を受ける必要があります。
- id: 41
  category: driver_testing
  question: 運転中に通常、眼鏡やコンタクトレンズを使用している場合、視力検査を受ける際にはどうすべきですか？
  choices:
    A: 裸眼の視力を測定するために外す
    B: 視力検査中もそれらを着用する
    C: 最初の検査に合格しなかった場合のみ着用する
    D: 検査を受ける代わりに医師の診断書を提出する
  answer: B
  explanation: 運転中に通常、眼鏡やコンタクトレンズを使用している場合は、BMV支局の職員にその旨を伝え、視力検査中もそれらを着用する必要があります。
- id: 42
  category: license_system
  question: 18歳未満でラーナーズパーミット（学習許可証）を申請する場合、少なくとも何歳以上の緊急連絡先を指定しなければなりませんか？
  choices:
    A: 18歳以上
    B: 21歳以上
    C: 25歳以上
    D: 親族であれば年齢は問わない
  answer: A
  explanation: ラーナーズパーミットを申請する18歳未満の個人は、18歳以上の緊急連絡先を指定することが義務付けられています。
- id: 43
  category: safe_driving_rules
  question: 18歳未満で児童福祉局（DCS）の保護下にある場合、DCSの承認を受け、かつ少なくとも何歳以上の免許保有運転者であれば、親族以外の運転者と運転の練習をすることができますか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 30歳
  answer: C
  explanation: 児童福祉局（DCS）の保護下にある場合は、DCSが承認した25歳以上の免許保有運転者と一緒に運転の練習をすることを選択できます。
- id: 44
  category: driver_testing
  question: コンピュータによる知識試験（学科試験）に不合格となった場合、再受験までにどのくらいの期間待つ必要がありますか？
  choices:
    A: 翌営業日まで
    B: 48時間
    C: 7日間
    D: 14日間
  answer: A
  explanation: 知識試験に不合格となった場合、再受験するには翌営業日まで待つ必要があります。
- id: 45
  category: driver_testing
  question: BMVで運転技能試験（実技試験）を予約する際、最大でどのくらい前から予約が可能ですか？
  choices:
    A: 1週間前
    B: 2週間前
    C: 3週間前
    D: 1ヶ月前
  answer: C
  explanation: 運転技能試験は、3週間前以内、かつ48営業時間前までに予約する必要があります。
- id: 46
  category: vehicle_information
  question: BMVの試験官が運転技能試験において車両を不適格とする正当な理由は、次のうちどれですか？
  choices:
    A: 車両がマニュアル車である
    B: 車両のドアが作動しない
    C: 車両が製造から10年以上経過している
    D: 車両にバックカメラが装備されていない
  answer: B
  explanation: 運転技能試験で車両が拒否される理由の例としては、ドアが作動しない、タイヤが安全でない、バンパーがない、ガラスやミラーの破損、または適切に登録されていないことなどが挙げられます。
- id: 47
  category: driver_testing
  question: 運転技能試験において、自動的に不合格となる行為は次のうちどれですか？
  choices:
    A: 車線変更完了後にウィンカーをつけたままにする
    B: 死角の確認を怠る
    C: 後退中に縁石に乗り上げる
    D: 後退の速度が速すぎる
  answer: C
  explanation: 縁石に乗り上げる行為は、運転技能試験において自動不合格となる行為として挙げられています。他の選択肢は最終スコアに影響したり不合格の原因になったりする可能性はありますが、自動不合格として明記されているものではありません。
- id: 48
  category: driver_testing
  question: 運転技能試験を受ける際、車両への同乗が許可されているのは誰ですか？
  choices:
    A: 免許を持っている親または保護者
    B: 認定された教習指導員
    C: BMV試験官または認可されたBMV職員のみ
    D: 有効な運転免許証を持っている人なら誰でも
  answer: C
  explanation: 運転技能試験を受ける際、試験を実施するBMV試験官またはその他の認可されたBMV職員以外は、車両に同乗することはできません。
- id: 49
  category: driver_testing
  question: ラーナーズパーミット（学習許可証）の保持中に運転技能試験に3回不合格となった場合、どうなりますか？
  choices:
    A: 再受験まで2ヶ月間待たなければならない
    B: ラーナーズパーミットが永久に失効する
    C: ドライバー教育コースを再受講しなければならない
    D: 再受験まで6ヶ月間待たなければならない
  answer: A
  explanation: ラーナーズパーミット保持中に運転技能試験に3回不合格となった場合、最後に不合格となった試験の日から2ヶ月間待ってからでないと再受験できません。
- id: 50
  category: driver_responsibility
  question: 18歳未満の申請者のために、財政的責任に関する宣誓供述書に署名する際の第一優先順位は誰ですか？
  choices:
    A: 親権を持たない親
    B: 未成年者の後見人
    C: 義務を引き受ける意思のある成人
    D: 未成年申請者の親権を持つ親
  answer: D
  explanation: 財政的責任に関する法的優先順位の第一位は、未成年申請者の親権を持つ親（または親権を持つ親によって指定された者）です。
- id: 51
  category: driver_responsibility
  question: 未成年者の賠償責任について共同署名した成人が、その責任を撤回する旨の書面による要請を提出した場合、どうなりますか？
  choices:
    A: 未成年者は罰金を支払わなければならない
    B: 未成年者の仮免許または運転免許が取り消される
    C: 未成年者は免許を維持するために30日以内に新しい共同署名者を見つけなければならない
    D: 未成年者は学校への通学のみの運転に制限される
  answer: B
  explanation: 賠償責任を撤回する書面による要請があった場合、未成年者の仮免許または運転免許は取り消されます。
- id: 52
  category: license_system
  question: 未成年者の申請者が児童福祉局（DCS）の保護下にある場合、成人の賠償責任に関する署名の代わりに何を提供しなければなりませんか？
  choices:
    A: 裁判官からの推薦状
    B: 最低賠償基準を満たす自動車保険の証明
    C: BMVへの1,000ドルの現金預託
    D: 高度な安全運転講習の修了証明
  answer: B
  explanation: DCSの申請者が運転免許または仮免許を申請する場合、インディアナ州法で定められた最低賠償基準を満たす自動車保険の証明を提出する必要があります。
- id: 53
  category: license_system
  question: 21歳未満で運転免許を申請する場合、どのような種類の免許証を受け取りますか？
  choices:
    A: 制限付き免許
    B: 商業運転免許（CDL）
    C: 試用運転免許（プロベーショナリー・ライセンス）
    D: 仮免許
  answer: C
  explanation: 21歳未満の場合、運転免許証は「試用（プロベーショナリー）」免許とみなされます。
- id: 54
  category: driver_testing
  question: 運転技能試験において、即不合格となるのは次のうちどれですか？
  choices:
    A: シートベルトの着用を怠る
    B: 必要時にデフロスターを使用しない
    C: 低速で走行する
    D: 車線変更時に減速する
  answer: A
  explanation: シートベルトの着用を怠ることは、運転技能試験において即不合格となる行為として挙げられています。他の選択肢は最終スコアに影響したり不合格の原因になったりする可能性はありますが、即不合格ではありません。
- id: 55
  category: driver_testing
  question: BMVが実施する運転技能試験の費用はいくらですか？
  choices:
    A: $15
    B: $25
    C: $50
    D: 無料
  answer: D
  explanation: BMVが実施する運転技能試験に費用はかかりません。
- id: 56
  category: license_system
  question: BMV公認の運転教育プログラムを修了していない場合、運転免許を申請するには何歳である必要がありますか？
  choices:
    A: 16歳と90日
    B: 16歳と180日
    C: 16歳と270日
    D: 18歳
  answer: C
  explanation: マニュアルによると、BMV公認の運転教育プログラムを修了していない場合、少なくとも16歳と270日である必要があります。
- id: 57
  category: license_system
  question: 80歳の人の標準的な運転免許証の有効期間はどのくらいですか？
  choices:
    A: 2年間
    B: 3年間
    C: 4年間
    D: 6年間
  answer: B
  explanation: マニュアルには、75歳から84歳までの場合、運転免許証の有効期間は3年間であると記載されています。
- id: 58
  category: safe_driving_rules
  question: 試用運転免許を取得してから最初の180日間、資格のある成人の同伴なしで同乗させることが許可されているのは、次のうちどの乗客ですか？
  choices:
    A: 学校の友人
    B: 兄弟姉妹
    C: いとこ
    D: 近所の人
  answer: B
  explanation: 試用運転免許を取得してから最初の180日間は、自分の子供、継子、兄弟姉妹、義理の兄弟姉妹、または配偶者であれば、他の人の同伴なしで運転することができます。
- id: 59
  category: safe_driving_rules
  question: 試用運転免許を取得してから最初の180日間、運転が禁止されている時間帯はいつですか？
  choices:
    A: 午後10時から午前5時
    B: 午後11時から午前6時
    C: 午前0時から午前5時
    D: 午後9時から午前6時
  answer: A
  explanation: マニュアルには、「試用運転免許を取得してから最初の180日間は、午後10時から午前5時の間は運転できません」と記載されています。
- id: 60
  category: safe_driving_rules
  question: 試用運転免許の保持者が、自動車の運転中に通信機器を使用することが許可されるのはどのような場合ですか？
  choices:
    A: ハンズフリー機器を使用しているとき
    B: 親または保護者にテキストメッセージを送るとき
    C: 赤信号で停止しているとき
    D: 911緊急通報を行うとき
  answer: D
  explanation: インディアナ州法では、911緊急通報を行う場合を除き、すべての運転者が通信機器を使用して自動車を運転することを禁止しています。
- id: 61
  category: penalties_and_points
  question: 学校管理者からの通知に基づき、BMV（車両管理局）が未成年者の運転特権を停止しなければならないのは、その未成年者がどのような場合ですか？
  choices:
    A: 1回の居残りを命じられた場合
    B: 常習的な不登校者であると判断された場合
    C: 運転者教育コースで不合格となった場合
    D: 学校に3回遅刻した場合
  answer: B
  explanation: インディアナ州の法律では、未成年者が退学、除籍、2度目の停学処分を受けている場合、退学した場合、または常習的な不登校者であると判断された場合、BMVは該当する未成年者の運転特権を停止することが義務付けられています。
- id: 62
  category: license_system
  question: 旅客および/またはスクールバスの資格（エンドースメント）が付いた商業運転免許（CDL）を申請するために必要な最低年齢は何歳ですか？
  choices:
    A: 18歳
    B: 21歳
    C: 25歳
    D: 16歳と270日
  answer: B
  explanation: CDLを申請するには18歳以上である必要がありますが、旅客および/またはスクールバスの資格（エンドースメント）が付いたCDLを申請するには21歳以上である必要があります。
- id: 63
  category: driver_testing
  question: 運転免許を申請する際、18歳以上の場合、何時間の監督下での運転練習を完了させる必要がありますか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: C
  explanation: 運転免許を申請する際、18歳以上の場合は、少なくとも50時間の監督下での運転練習を完了させる必要があります。
- id: 64
  category: driver_testing
  question: 義務付けられている50時間の監督下での運転練習のうち、夜間に完了しなければならないのは何時間ですか（日中限定の制限がある場合を除く）？
  choices:
    A: 5時間
    B: 10時間
    C: 15時間
    D: 20時間
  answer: B
  explanation: 仮免許（ラーナーズパーミット）に日中限定の制限がない限り、監督下での運転練習のうち少なくとも10時間は夜間に行う必要があります。
- id: 65
  category: license_system
  question: 21歳になる前に運転免許を取得した場合、その試用運転免許（プロベーショナリー・ライセンス）は何歳まで有効ですか？
  choices:
    A: ちょうど21歳まで
    B: 21歳と30日まで
    C: 21歳と90日まで
    D: 25歳まで
  answer: B
  explanation: 試用運転免許（プロベーショナリー・ライセンス）は、21歳と30日になるまで有効です。
- id: 66
  category: license_system
  question: 新しい免許証等の申請後、通常何暦日以内に郵送先に届きますか？
  choices:
    A: 7暦日
    B: 10暦日
    C: 14暦日
    D: 21暦日
  answer: C
  explanation: 免許証等はBMVに登録されている住所に送付され、14暦日以内に郵送先に届きます。
- id: 67
  category: license_system
  question: 写真免除の身分証明書（IDカード）は、どのような理由で利用可能ですか？
  choices:
    A: 医学的理由のみ
    B: 宗教的理由のみ
    C: 医学的理由と宗教的理由の両方
    D: プライバシー上の理由のみ
  answer: B
  explanation: 写真免除の仮免許および運転免許は医学的および宗教的理由で利用可能ですが、写真免除の身分証明書（IDカード）は宗教的理由のみで利用可能です。
- id: 68
  category: driver_testing
  question: 運転免許を申請する際、知識試験（学科）と技能試験（実技）に関して正しいものはどれですか？
  choices:
