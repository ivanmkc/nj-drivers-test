questions:
- id: 1
  category: license_system
  question: ¿Qué indicador visual en una licencia, identificación o permiso de Indiana
    significa que es una Real ID?
  choices:
    A: Un holograma del sello del estado
    B: Una estrella en la esquina superior derecha
    C: Un código de barras en el frente
    D: Una franja azul en la parte superior
  answer: B
  explanation: Según el manual, una Real ID se identifica mediante una estrella en
    la esquina superior derecha de las licencias, identificaciones y permisos.
- id: 2
  category: license_system
  question: ¿Cuál de los siguientes es un beneficio de tener una Real ID?
  choices:
    A: Puede conducir vehículos comerciales sin una CDL.
    B: Puede abordar vuelos comerciales dentro de los Estados Unidos.
    C: Está exento de pagar peajes en las autopistas interestatales.
    D: Puede viajar internacionalmente sin pasaporte.
  answer: B
  explanation: El manual establece que con una Real ID, usted puede abordar vuelos
    comerciales dentro de los Estados Unidos.
- id: 3
  category: license_system
  question: Además de abordar vuelos comerciales nacionales, ¿qué más le permite hacer
    una Real ID?
  choices:
    A: Ingresar a ciertas instalaciones federales y visitar bases militares
    B: Evitar los puntos de control de seguridad en los aeropuertos
    C: Operar una embarcación sin una licencia por separado
    D: Estacionar en espacios de estacionamiento designados para personas con discapacidad
  answer: A
  explanation: El manual especifica que una Real ID le permite visitar bases militares
    e ingresar a ciertas instalaciones federales.
- id: 4
  category: license_system
  question: ¿Dónde pueden los residentes de Indiana encontrar información sobre los
    documentos necesarios para actualizar a una Real ID?
  choices:
    A: BMV.IN.gov
    B: RealID.IN.gov
    C: Indiana.gov/ID
    D: HoosierDrive.com
  answer: B
  explanation: El manual indica a las personas que visiten RealID.IN.gov para saber
    qué documentos se necesitan para actualizar a una Real ID.
- id: 5
  category: license_system
  question: De acuerdo con la declaración de misión de la Oficina de Vehículos Motorizados
    (BMV) de Indiana, ¿cómo pretende la BMV proporcionar servicios de conductor y
    de vehículos?
  choices:
    A: Priorizando a los conductores comerciales sobre los conductores estándar
    B: De manera oportuna y precisa, garantizando al mismo tiempo la seguridad y la
      transparencia
    C: Ofreciendo reemplazos de credenciales gratuitos a todos los habitantes de Indiana
    D: A través de plataformas exclusivamente en línea
  answer: B
  explanation: La misión de la BMV es servir a todos los habitantes de Indiana proporcionando
    los mejores servicios de conductor y de vehículos de su clase de manera oportuna
    y precisa, garantizando al mismo tiempo la seguridad y la transparencia.
- id: 6
  category: driver_testing
  question: Según la sección del manual sobre la obtención de una nueva credencial,
    ¿cuál de los siguientes exámenes o evaluaciones es obligatorio?
  choices:
    A: Examen de audición
    B: Evaluación de la vista
    C: Prueba de aptitud física
    D: Evaluación psicológica
  answer: B
  explanation: El Capítulo 1 del manual, que trata sobre la Obtención de una Nueva
    Credencial, enumera la 'Evaluación de la vista' como un componente obligatorio.
- id: 7
  category: driver_responsibility
  question: ¿Qué tema se cubre en el proceso de obtención de una nueva credencial
    con respecto a posibles accidentes o daños?
  choices:
    A: Responsabilidad financiera por lesiones o daños
    B: Cobertura integral de colisión
    C: Seguro de negligencia médica
    D: Registro de garantía del vehículo
  answer: A
  explanation: El Capítulo 1 del manual incluye una sección específica sobre 'Responsabilidad
    financiera por lesiones o daños' al obtener una nueva credencial.
- id: 8
  category: license_system
  question: ¿Cuál de los siguientes figura como un endoso o tipo de licencia específico
    en el Manual del Conductor de Indiana?
  choices:
    A: Licencia de operador de maquinaria pesada
    B: Endoso de transporte público o privado remunerado (For-Hire Endorsement)
    C: Permiso de vehículo agrícola
    D: Licencia de vehículo recreativo (RV)
  answer: B
  explanation: El Capítulo 2 del manual cubre Restricciones y Endosos, que incluye
    explícitamente el 'Endoso de transporte público o privado remunerado' (For-Hire
    Endorsement).
- id: 9
  category: license_system
  question: ¿Qué tipo de indicador militar se puede agregar a una credencial de Indiana?
  choices:
    A: Indicador de reserva retirada
    B: Indicador militar de servicio activo y veterano
    C: Indicador de dependiente de la Guardia Nacional
    D: Indicador de despliegue en el extranjero
  answer: B
  explanation: El Capítulo 3 del manual enumera el 'Indicador militar de servicio
    activo y veterano' como una opción para las credenciales.
- id: 10
  category: penalties_and_points
  question: ¿Qué programa está asociado con puntos y suspensiones en el Manual del
    Conductor de Indiana?
  choices:
    A: Programa de Seguridad del Conductor
    B: Programa de Vigilancia de Carreteras
    C: Iniciativa Hoosier Helper
    D: Programa de Perdón de Accidentes
  answer: A
  explanation: El Capítulo 5 del manual, que cubre Puntos, Suspensiones y Requisitos
    de Seguro, incluye información sobre el 'Programa de Seguridad del Conductor'.
- id: 11
  category: penalties_and_points
  question: ¿Qué término utiliza el Manual del Conductor de Indiana para describir
    a los conductores con múltiples infracciones de tráfico graves?
  choices:
    A: Infractores de tráfico crónicos
    B: Infractores de tráfico habituales (Habitual Traffic Violators)
    C: Infractores de movimiento reincidentes
    D: Automovilistas de alto riesgo
  answer: B
  explanation: El Capítulo 5 del manual trata sobre puntos y suspensiones, incluyendo
    una sección específica dedicada a los 'Infractores de tráfico habituales' (Habitual
    Traffic Violators).
- id: 12
  category: signs_and_signals
  question: ¿Cuál de las siguientes es una categoría específica de señales de tráfico
    analizada en el manual?
  choices:
    A: Señales de sugerencia de tráfico
    B: Señales de guía de tráfico (Traffic Guidance Signs)
    C: Señales de cumplimiento de la ley de tráfico
    D: Señales de observación de tráfico
  answer: B
  explanation: El Capítulo 6 del manual cubre las señales y semáforos, lo cual incluye
    una sección específica sobre 'Señales de guía de tráfico' (Traffic Guidance Signs).
- id: 13
  category: vehicle_information
  question: Según la sección del manual sobre la operación segura del vehículo, ¿qué
    tema de mantenimiento del vehículo se aborda específicamente junto con la presión
    de los neumáticos?
  choices:
    A: Vida útil del aceite
    B: Desgaste de las pastillas de freno
    C: Profundidad de la banda de rodadura (Tread Depth)
    D: Niveles de refrigerante
  answer: C
  explanation: El Capítulo 7 del manual cubre la Operación Segura del Vehículo, que
    incluye una sección titulada específicamente 'Presión de los neumáticos y profundidad
    de la banda de rodadura' (Tire Pressure and Tread Depth).
- id: 14
  category: safe_driving_rules
  question: ¿Cuáles de los siguientes comportamientos de conducción se abordan específicamente
    en el capítulo de Operación Segura del Vehículo?
  choices:
    A: Conducción distraída y conducción agresiva
    B: Paseos recreativos no autorizados y carreras callejeras
    C: Seguir de cerca al vehículo de adelante y frenar bruscamente para molestar
      al de atrás
    D: Viajes compartidos y servicios de transporte
  answer: A
  explanation: El Capítulo 7 del manual cubre la Operación Segura del Vehículo, que
    incluye secciones específicas sobre 'Conducción distraída' (Distracted Driving)
    y 'Conducción agresiva' (Aggressive Driving).
- id: 15
  category: license_system
  question: ¿Qué tipo específico de ciclo, además de una motocicleta, tiene su propia
    sección bajo Restricciones y Endosos?
  choices:
    A: Bicicletas
    B: Ciclo impulsado por motor (MDC)
    C: Scooters eléctricos
    D: Vehículos todo terreno (ATVs)
  answer: B
  explanation: El Capítulo 2 del manual cubre Restricciones y Endosos, incluyendo
    una sección específica para el 'Ciclo impulsado por motor' (Motor Driven Cycle
    - MDC).
- id: 16
  category: license_system
  question: ¿En qué formato se emiten las credenciales a los residentes de Indiana
    menores de 21 años?
  choices:
    A: Formato horizontal
    B: Formato vertical
    C: Formato cuadrado
    D: Formato de folleto
  answer: B
  explanation: Todas las credenciales emitidas a los residentes de Indiana menores
    de 21 años tienen un formato vertical y muestran las fechas en que el titular
    cumple 18 y 21 años de edad.
- id: 17
  category: license_system
  question: ¿Qué indica una marca de estrella en la esquina superior derecha de una
    credencial de Indiana?
  choices:
    A: El conductor es un donante de órganos.
    B: El conductor tiene una licencia de conducir comercial.
    C: La credencial cumple con Real ID (Real ID-compliant).
    D: El conductor es menor de 21 años de edad.
  answer: C
  explanation: Aparece una marca de estrella en la esquina superior derecha para indicar
    que una credencial cumple con Real ID (Real ID-compliant) y puede usarse como
    identificación para fines federales.
- id: 18
  category: license_system
  question: ¿Cuánto tiempo tiene un nuevo residente de Indiana para obtener una nueva
    licencia de conducir de Indiana?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Cuando usted se convierte en residente de Indiana, tiene 60 días para
    obtener una nueva licencia de conducir de Indiana.
- id: 19
  category: license_system
  question: Si usted es un nuevo residente de Indiana que nunca ha tenido una licencia
    de conducir válida de otro estado, ¿cuánto tiempo debe tener un permiso de aprendizaje
    de Indiana antes de solicitar una licencia de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: D
  explanation: Si nunca ha tenido una licencia de conducir válida de otro estado,
    debe tener un permiso de aprendizaje de Indiana durante 180 días antes de poder
    solicitar una licencia de conducir de Indiana.
- id: 20
  category: driver_testing
  question: ¿Qué exámenes debe aprobar si su licencia de conducir de otro estado ha
    estado vencida por más de cinco años?
  choices:
    A: Solo un examen de la vista estándar
    B: Solo un examen de conocimientos
    C: Un examen de conocimientos y una prueba de habilidades de conducción
    D: Una prueba de habilidades de conducción y un examen físico
  answer: C
  explanation: Si su licencia de conducir de otro estado ha estado vencida por más
    de cinco años, debe aprobar un examen de conocimientos y una prueba de habilidades
    de conducción para obtener una licencia de conducir de Indiana.
- id: 21
  category: driver_testing
  question: ¿Qué examen se requiere para un nuevo residente de 18 años cuya licencia
    de conducir de otro estado ha estado vencida por menos de cinco años?
  choices:
    A: Un examen de habilidades de conducción
    B: Un examen de conocimientos
    C: Un examen físico
    D: Un examen de audición
  answer: B
  explanation: Si su licencia de conducir de otro estado ha estado vencida por menos
    de cinco años, o si ha tenido una licencia de conducir de otro estado no revocada
    por menos de un año, debe aprobar un examen de conocimientos para obtener una
    licencia de conducir de Indiana.
- id: 22
  category: license_system
  question: ¿Cuál de las siguientes se considera evidencia de residencia en Indiana?
  choices:
    A: Ser un empleado temporal en el estado
    B: Estar registrado para votar en Indiana
    C: Estar inscrito en una institución de educación postsecundaria sin reclamar
      la residencia en Indiana
    D: Ser un miembro militar en servicio activo que reclama la residencia en otro
      estado
  answer: B
  explanation: La evidencia de residencia en Indiana incluye mantener una dirección
    residencial en Indiana, estar registrado para votar en Indiana o tener un dependiente
    inscrito en una escuela primaria o secundaria ubicada en Indiana.
- id: 23
  category: license_system
  question: ¿Quién es elegible para recibir una tarjeta de identificación de Indiana
    sin costo?
  choices:
    A: Cualquier persona menor de 18 años
    B: Personas que tengan o cumplan 18 años de edad en o antes de las próximas elecciones
      generales o municipales
    C: Cualquier nuevo residente de Indiana
    D: Personas que hayan entregado una licencia de conducir de otro estado
  answer: B
  explanation: Las tarjetas de identificación se emiten sin costo a las personas que
    tienen o cumplirán 18 años de edad en o antes de las próximas elecciones generales
    o municipales.
- id: 24
  category: license_system
  question: Según el manual, ¿desde qué fecha ha cumplido Indiana con los requisitos
    de la Ley Real ID?
  choices:
    A: 1 de enero de 2005
    B: 1 de enero de 2010
    C: 1 de enero de 2015
    D: 1 de enero de 2020
  answer: B
  explanation: El manual establece que Indiana ha cumplido con los requisitos de la
    Ley Real ID desde el 1 de enero de 2010. (pág. 2)
- id: 25
  category: license_system
  question: ¿Cuál de los siguientes documentos NO figura explícitamente como requisito
    para actualizar a una credencial que cumpla con Real ID?
  choices:
    A: Prueba de identidad
    B: Prueba de estatus legal
    C: Número de Seguro Social
    D: Prueba de seguro del vehículo
  answer: D
  explanation: Para actualizar a una credencial que cumpla con Real ID, debe proporcionar
    versiones originales o copias certificadas de su identidad, estatus legal, número
    de Seguro Social y prueba de residencia en Indiana. No se requiere prueba de seguro
    del vehículo.
- id: 26
  category: license_system
  question: ¿Qué sucede si la BMV descubre que un solicitante posee una credencial
    de otro estado durante el proceso de verificación?
  choices:
    A: El solicitante debe pagar una tarifa de doble residencia.
    B: El solicitante deberá entregar la credencial del otro estado.
    C: Al solicitante se le emitirá una credencial temporal de Indiana por 60 días.
    D: Al solicitante se le prohíbe permanentemente obtener una credencial de Indiana.
  answer: B
  explanation: Si durante la verificación, la BMV descubre que se ha emitido otra
    credencial a un solicitante en otro estado... el solicitante deberá entregar la
    credencial del otro estado antes de que la BMV procese una solicitud para una
    credencial de Indiana.
- id: 27
  category: license_system
  question: ¿Qué fechas se muestran de manera destacada en una credencial de Indiana
    emitida a un residente menor de 21 años?
  choices:
    A: Las fechas en que el titular de la tarjeta cumple 18 y 21 años de edad
    B: Las fechas en que el titular de la tarjeta cumple 16 y 18 años de edad
    C: Las fechas en que el titular obtuvo su permiso y licencia
    D: Las fechas de las próximas elecciones generales y municipales
  answer: A
  explanation: Todas las credenciales emitidas a residentes de Indiana menores de
    21 años tienen un formato vertical y muestran las fechas en que el titular de
    la tarjeta cumple 18 y 21 años de edad.
- id: 28
  category: driver_testing
  question: Además de proporcionar la documentación requerida, ¿qué evaluación deben
    aprobar todos los nuevos residentes de Indiana al obtener una licencia de conducir
    de Indiana?
  choices:
    A: Una evaluación de audición estándar
    B: Una evaluación de la vista estándar
    C: Una evaluación de drogas y alcohol
    D: Una evaluación de agilidad física
  answer: B
  explanation: Las personas en todas las categorías enumeradas anteriormente también
    deben presentar documentación que acredite su identidad, estatus legal, número
    de Seguro Social y residencia en Indiana... También se requiere que apruebe una
    evaluación de la vista estándar.
- id: 29
  category: license_system
  question: ¿Cuál de las siguientes personas NO se considera residente de Indiana
    a efectos de obtener una credencial?
  choices:
    A: Una persona que mantiene una dirección residencial en Indiana y no reclama
      residencia en otro lugar
    B: Un votante registrado en Indiana
    C: Una persona con un dependiente inscrito en una escuela primaria de Indiana
    D: Personal militar en servicio activo en las fuerzas armadas que no reclama a
      Indiana como su estado de residencia
  answer: D
  explanation: A efectos de obtener una credencial, el personal militar en servicio
    activo en las fuerzas armadas que no reclama a Indiana como su estado de residencia
    no se considera residente de Indiana.
- id: 30
  category: license_system
  question: Si tiene 18 años de edad o más y posee una licencia de conducir válida
    de otro estado, ¿cuál de los siguientes elementos puede llevar a la sucursal para
    solicitar una licencia de Indiana?
  choices:
    A: Una copia de su diploma de escuela secundaria
    B: Una copia de su registro oficial de conducción
    C: Una carta del gobernador de su estado anterior
    D: Una factura de servicios públicos de su estado anterior
  answer: B
  explanation: 'Si tiene al menos 18 años de edad y posee una licencia de conducir
    válida de otro estado, debe llevar uno de los siguientes tres elementos a la sucursal:
    su licencia de conducir actual de otro estado, una copia de su registro oficial
    de conducción o una carta de verificación.'
- id: 31
  category: license_system
  question: ¿Por cuánto tiempo es válida una tarjeta de identificación estándar de
    Indiana?
  choices:
    A: 2 años
    B: 4 años
    C: 6 años
    D: 8 años
  answer: C
  explanation: Según el manual, una tarjeta de identificación y un endoso de Ciclo
    Impulsado por Motor (MDC) son válidos por seis años.
- id: 32
  category: license_system
  question: Si está solicitando una tarjeta de identificación de Indiana pero ya posee
    una credencial de otro estado, ¿qué debe hacer?
  choices:
    A: Conservar ambas credenciales siempre que sean de estados diferentes
    B: Entregar la otra credencial al BMV de Indiana
    C: Pagar una tarifa adicional para tener múltiples credenciales
    D: Destruir usted mismo la credencial de fuera del estado
  answer: B
  explanation: Los residentes de Indiana no pueden tener más de una credencial al
    mismo tiempo. Por lo tanto, debe entregar cualquier otra credencial al BMV de
    Indiana para completar una solicitud de tarjeta de identificación.
- id: 33
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener un endoso de Ciclo Impulsado
    por Motor (MDC) en una tarjeta de identificación?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: B
  explanation: Las tarjetas de identificación pueden otorgar privilegios para operar
    un Ciclo Impulsado por Motor (MDC) siempre que tenga al menos 15 años de edad
    y apruebe un examen de conocimientos de MDC.
- id: 34
  category: driver_testing
  question: Si es menor de 16 años y solicita un permiso de aprendizaje, ¿cuál de
    los siguientes NO es un documento aceptable para demostrar la inscripción en educación
    vial?
  choices:
    A: Un Certificado de Inscripción en Educación Vial de la escuela
    B: Un certificado con fecha de dos semanas antes del inicio de la clase
    C: Un certificado de finalización de un curso en línea para la formación teórica
    D: Un documento que acredite la inscripción en un proveedor de formación práctica
      (detrás del volante) autorizado por el BMV
  answer: C
  explanation: El manual establece explícitamente que el certificado de finalización
    del curso en línea para la formación teórica no es un documento aceptable para
    demostrar la inscripción.
- id: 35
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de aprendizaje estándar desde
    la fecha de emisión?
  choices:
    A: 1 año
    B: 2 años
    C: 4 años
    D: 6 años
  answer: B
  explanation: Según la sección de Validez del Permiso de Aprendizaje, los permisos
    de aprendizaje son válidos por dos años a partir de la fecha de emisión.
- id: 36
  category: driver_testing
  question: ¿Debe volver a tomar el examen al renovar su permiso de aprendizaje si
    este ha estado vencido por más de cuántos días?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: D
  explanation: Si visita una sucursal del BMV para renovar su permiso de aprendizaje
    y este ha estado vencido por más de 180 días, se requiere que vuelva a tomar el
    examen.
- id: 37
  category: safe_driving_rules
  question: Si es menor de 16 años y está practicando la conducción con un pariente,
    ¿cuál es la edad mínima que debe tener el pariente con licencia?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: C
  explanation: Puede practicar la conducción con un conductor con licencia que tenga
    privilegios de conducción válidos y tenga 25 años de edad o más, siempre que sea
    su pariente por consanguinidad, matrimonio o estatus legal.
- id: 38
  category: driver_testing
  question: ¿Con cuánta anticipación debe llegar a una sucursal del BMV antes de que
    cierre para tomar el examen de conocimientos por computadora?
  choices:
    A: Al menos 15 minutos
    B: Al menos 30 minutos
    C: Al menos 45 minutos
    D: Al menos 1 hora
  answer: B
  explanation: Debe llegar a la sucursal al menos 30 minutos antes de que esta cierre
    para tomar el examen de conocimientos por computadora ese día.
- id: 39
  category: driver_testing
  question: ¿Qué debe hacer si reprueba el examen de conocimientos de conducción?
  choices:
    A: Volver a tomarlo inmediatamente después de pagar una tarifa
    B: Esperar al menos 30 minutos para volver a tomarlo
    C: Esperar hasta el siguiente día hábil para volver a tomarlo
    D: Esperar una semana completa para volver a tomarlo
  answer: C
  explanation: 'El manual establece: ''Si reprueba el examen de conocimientos, debe
    esperar hasta el siguiente día hábil para volver a tomarlo''.'
- id: 40
  category: penalties_and_points
  question: ¿Un conductor que renueva su licencia de conducir de Indiana debe tomar
    el examen de conocimientos si tiene al menos cuántos puntos activos en su historial
    de conducción?
  choices:
    A: 2 o más puntos activos
    B: 4 o más puntos activos
    C: 6 o más puntos activos
    D: 8 o más puntos activos
  answer: C
  explanation: El examen de conocimientos del conductor es obligatorio para un conductor
    que tiene seis o más puntos activos en un historial de conducción de Indiana y
    está renovando su licencia de conducir.
- id: 41
  category: driver_testing
  question: ¿Qué debe hacer si normalmente usa anteojos o lentes de contacto al conducir
    y va a realizar el examen de la vista?
  choices:
    A: Quitárselos para evaluar su visión natural
    B: Usarlos durante el examen de la vista
    C: Usarlos solo si reprueba el examen inicial
    D: Proporcionar una nota del médico en lugar de realizar el examen
  answer: B
  explanation: Si normalmente usa anteojos o lentes de contacto al conducir, debe
    informar al personal de la sucursal del BMV y usarlos durante el examen de la
    vista.
- id: 42
  category: license_system
  question: Si es menor de 18 años y solicita un permiso de aprendizaje, ¿qué edad
    mínima debe tener el contacto de emergencia que proporcione?
  choices:
    A: 18 años de edad o más
    B: 21 años de edad o más
    C: 25 años de edad o más
    D: Cualquier edad, siempre que sea un familiar
  answer: A
  explanation: Una persona menor de 18 años que solicita un permiso de aprendizaje
    debe proporcionar un contacto de emergencia que tenga al menos 18 años de edad
    o más.
- id: 43
  category: safe_driving_rules
  question: Si es menor de 18 años y está bajo el cuidado del Departamento de Servicios
    Infantiles (DCS), ¿puede practicar la conducción con un conductor con licencia
    que no sea familiar si está aprobado por el DCS y tiene al menos qué edad?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: C
  explanation: Si está bajo el cuidado del Departamento de Servicios Infantiles, puede
    optar por practicar la conducción con un conductor con licencia que tenga 25 años
    de edad o más y esté aprobado por el Departamento de Servicios Infantiles (DCS).
- id: 44
  category: driver_testing
  question: Si reprueba el examen de conocimientos por computadora, ¿cuánto tiempo
    debe esperar antes de poder volver a realizarlo?
  choices:
    A: Hasta el siguiente día hábil
    B: 48 horas
    C: 7 días
    D: 14 días
  answer: A
  explanation: Si reprueba el examen de conocimientos, debe esperar hasta el siguiente
    día hábil para volver a realizarlo.
- id: 45
  category: driver_testing
  question: Al programar un examen de habilidades de conducción en el BMV, ¿cuál es
    el tiempo máximo de antelación con el que puede programar la cita?
  choices:
    A: Una semana
    B: Dos semanas
    C: Tres semanas
    D: Un mes
  answer: C
  explanation: Un examen de habilidades de conducción se puede programar con no más
    de tres semanas y no menos de 48 horas hábiles de antelación.
- id: 46
  category: vehicle_information
  question: ¿Cuál de las siguientes es una razón válida para que un examinador del
    BMV rechace un vehículo para el examen de habilidades de conducción?
  choices:
    A: El vehículo tiene transmisión manual
    B: El vehículo tiene una puerta que no funciona
    C: El vehículo tiene más de 10 años
    D: El vehículo no tiene cámara de reversa
  answer: B
  explanation: Algunos ejemplos de razones por las que se pueden rechazar vehículos
    para el examen de habilidades de conducción incluyen una puerta que no funciona,
    neumáticos inseguros, falta de parachoques, vidrios o espejos rotos, o no estar
    debidamente registrado.
- id: 47
  category: driver_testing
  question: ¿Cuál de las siguientes acciones resultará en una reprobación automática
    del examen de habilidades de conducción?
  choices:
    A: Dejar la luz direccional encendida después de completar un cambio de carril
    B: No revisar su punto ciego
    C: Subirse a la acera (bordillo) al retroceder
    D: Retroceder demasiado rápido
  answer: C
  explanation: Subirse a la acera al retroceder figura como una acción que resultará
    en la reprobación automática del examen de habilidades de conducción. Las otras
    opciones son acciones que podrían afectar su puntaje final o hacer que repruebe,
    pero no figuran como reprobaciones automáticas.
- id: 48
  category: driver_testing
  question: ¿Quién tiene permitido estar en el vehículo con usted cuando realiza el
    examen de habilidades de conducción?
  choices:
    A: Un padre o tutor con licencia
    B: Un instructor de manejo certificado
    C: Solo el examinador del BMV o el personal autorizado del BMV
    D: Cualquier persona con una licencia de conducir válida
  answer: C
  explanation: Nadie más que el examinador o examinadores del BMV que realizan el
    examen de habilidades u otro personal autorizado del BMV tiene permitido estar
    en su vehículo cuando realice el examen de habilidades de conducción.
- id: 49
  category: driver_testing
  question: ¿Qué sucede si reprueba un tercer examen de habilidades de conducción
    mientras tiene un permiso de aprendizaje?
  choices:
    A: Debe esperar dos meses antes de volver a realizar el examen
    B: Su permiso de aprendizaje es revocado permanentemente
    C: Debe volver a tomar el curso de educación vial
    D: Debe esperar seis meses antes de volver a realizar el examen
  answer: A
  explanation: Al reprobar un tercer examen de habilidades de conducción mientras
    tiene un permiso de aprendizaje, debe esperar dos meses a partir de la fecha del
    último examen de habilidades reprobado antes de volver a realizar el examen.
- id: 50
  category: driver_responsibility
  question: ¿Quién tiene el primer orden de preferencia para firmar una declaración
    jurada de responsabilidad financiera para un solicitante menor de 18 años?
  choices:
    A: El padre que no tiene la custodia
    B: El tutor que tiene la custodia del menor
    C: Cualquier adulto dispuesto a asumir la obligación
    D: El padre que tiene la custodia del solicitante menor de edad
  answer: D
  explanation: El orden legal de preferencia para la responsabilidad financiera es,
    en primer lugar, el padre que tiene la custodia del solicitante menor de edad
    (o una persona designada por el padre con custodia).
- id: 51
  category: driver_responsibility
  question: ¿Qué sucede si el adulto que firmó conjuntamente la responsabilidad financiera
    presenta una solicitud por escrito para retirar su responsabilidad financiera
    por un menor?
  choices:
    A: El menor debe pagar una multa
    B: El permiso de aprendizaje o la licencia de conducir del menor serán cancelados
    C: El menor debe encontrar un nuevo cofirmante en un plazo de 30 días para conservar
      su licencia
    D: El menor está restringido a conducir únicamente hacia y desde la escuela
  answer: B
  explanation: Una solicitud por escrito para retirar la responsabilidad financiera
    cancelará el permiso de aprendizaje o la licencia de conducir del menor.
- id: 52
  category: license_system
  question: Si un solicitante menor de edad está bajo el cuidado del Departamento
    de Servicios Infantiles (DCS), ¿qué debe proporcionar en lugar de la firma de
    un adulto para la responsabilidad financiera?
  choices:
    A: Una carta de recomendación de un juez
    B: Prueba de una póliza de seguro de vehículo motorizado que cumpla con los estándares
      mínimos de responsabilidad
    C: Un depósito en efectivo de $1,000 al BMV
    D: Prueba de haber completado un curso avanzado de conducción defensiva
  answer: B
  explanation: Si el solicitante del DCS solicita una licencia de conducir o un permiso
    de aprendizaje, el solicitante también debe proporcionar prueba de una póliza
    de seguro de vehículo motorizado que cumpla con los estándares mínimos de responsabilidad
    establecidos en la ley de Indiana.
- id: 53
  category: license_system
  question: Si solicita una licencia de conducir y es menor de 21 años, ¿qué tipo
    de licencia recibirá?
  choices:
    A: Una licencia restringida
    B: Una licencia de conducir comercial (CDL)
    C: Una licencia de conducir a prueba (probationary)
    D: Un permiso de aprendizaje
  answer: C
  explanation: Si es menor de 21 años, su licencia de conducir se considera una licencia
    "a prueba" (probationary).
- id: 54
  category: driver_testing
  question: Durante el examen de habilidades de conducción, ¿cuál de las siguientes
    acciones causará una reprobación automática?
  choices:
    A: No utilizar el cinturón de seguridad
    B: No utilizar el desempañador cuando sea necesario
    C: Conducir demasiado lento
    D: Reducir la velocidad al cambiar de carril
  answer: A
  explanation: No utilizar el cinturón de seguridad figura entre las acciones que
    darán lugar a la reprobación automática del examen de habilidades de conducción.
    Las otras opciones son acciones que podrían afectar su puntuación final o hacer
    que repruebe, pero no son reprobaciones automáticas.
- id: 55
  category: driver_testing
  question: ¿Cuánto cobra el BMV por administrar un examen de habilidades de conducción?
  choices:
    A: $15
    B: $25
    C: $50
    D: No hay ningún cargo
  answer: D
  explanation: No hay ningún cargo por el examen de habilidades de conducción administrado
    por el BMV.
- id: 56
  category: license_system
  question: ¿Qué edad debe tener para solicitar una licencia de conducir si NO ha
    completado un programa de educación vial autorizado por el BMV?
  choices:
    A: 16 años y 90 días de edad
    B: 16 años y 180 días de edad
    C: 16 años y 270 días de edad
    D: 18 años de edad
  answer: C
  explanation: Según el manual, debe tener al menos 16 años y 270 días de edad sin
    haber completado un programa de educación vial autorizado por el BMV.
- id: 57
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir estándar para una
    persona de 80 años?
  choices:
    A: Dos años
    B: Tres años
    C: Cuatro años
    D: Seis años
  answer: B
  explanation: El manual establece que una licencia de conducir es válida por tres
    años si usted tiene entre 75 y 84 años.
- id: 58
  category: safe_driving_rules
  question: Durante los primeros 180 días de tener una licencia de conducir a prueba,
    ¿con cuál de los siguientes pasajeros se le permite conducir sin estar acompañado
    por un adulto calificado?
  choices:
    A: Sus amigos de la escuela
    B: Su hermano o hermana
    C: Su primo o prima
    D: Su vecino o vecina
  answer: B
  explanation: Puede conducir con su hijo, hijastro, hermano, hermanastro o medio
    hermano, o cónyuge sin otra persona que lo acompañe durante los primeros 180 días
    después de obtener su licencia de conducir a prueba.
- id: 59
  category: safe_driving_rules
  question: Durante los primeros 180 días después de obtener su licencia de conducir
    a prueba, ¿entre qué horas no puede conducir?
  choices:
    A: 10 p.m. y 5 a.m.
    B: 11 p.m. y 6 a.m.
    C: Medianoche y 5 a.m.
    D: 9 p.m. y 6 a.m.
  answer: A
  explanation: 'El manual establece: "Durante los primeros 180 días después de obtener
    su licencia de conducir a prueba, no podrá conducir entre las 10 p.m. y las 5
    a.m."'
- id: 60
  category: safe_driving_rules
  question: ¿Cuándo se le permite al titular de una licencia de conducir a prueba
    utilizar un dispositivo de telecomunicaciones mientras opera un vehículo motorizado?
  choices:
    A: Al usar un dispositivo de manos libres
    B: Al enviar mensajes de texto a un padre o tutor
    C: Al estar detenido en un semáforo en rojo
    D: Al realizar una llamada de emergencia al 911
  answer: D
  explanation: La ley de Indiana prohíbe a todos los conductores operar un vehículo
    motorizado mientras utilizan cualquier forma de dispositivo de telecomunicaciones,
    a menos que el dispositivo se utilice para realizar una llamada de emergencia
    al 911.
- id: 61
  category: penalties_and_points
  question: 'El BMV está obligado a suspender los privilegios de conducción de un
    menor tras recibir una notificación de un administrador escolar si el menor:'
  choices:
    A: Recibe una sola detención
    B: Es determinado como un ausente habitual (habitual truant)
    C: Reprueba un curso de educación vial
    D: Llega tarde a la escuela tres veces
  answer: B
  explanation: La ley de Indiana exige que el BMV suspenda los privilegios de conducción
    de un menor si se encuentra bajo una expulsión, exclusión o segunda suspensión,
    si se ha retirado de la escuela o si se ha determinado que es un ausente habitual
    (habitual truant).
- id: 62
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar una Licencia de Conducir
    Comercial (CDL) con endosos para pasajeros y/o autobús escolar?
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: 16 años y 270 días
  answer: B
  explanation: Debe tener al menos 18 años de edad para solicitar una CDL y 21 años
    de edad para solicitar una CDL con endosos para pasajeros y/o autobús escolar.
- id: 63
  category: driver_testing
  question: Si está solicitando una licencia de conducir y tiene al menos 18 años
    de edad, ¿cuántas horas de práctica de conducción supervisada debe completar?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Si está solicitando una licencia de conducir y tiene al menos 18 años
    de edad, debe completar al menos 50 horas de práctica de conducción supervisada.
- id: 64
  category: driver_testing
  question: De las 50 horas requeridas de práctica de conducción supervisada, ¿cuántas
    horas deben completarse por la noche (a menos que tenga una restricción de solo
    horario diurno)?
  choices:
    A: 5 horas
    B: 10 horas
    C: 15 horas
    D: 20 horas
  answer: B
  explanation: Al menos 10 horas de práctica de conducción supervisada deben completarse
    por la noche, a menos que tenga una restricción de solo horario diurno en su permiso
    de aprendizaje.
- id: 65
  category: license_system
  question: 'Si obtiene una licencia de conducir antes de los 21 años, su licencia
    de conducir probatoria es válida hasta que cumpla:'
  choices:
    A: 21 años de edad exactamente
    B: 21 años y 30 días de edad
    C: 21 años y 90 días de edad
    D: 25 años de edad
  answer: B
  explanation: Su licencia de conducir probatoria es válida hasta que cumpla 21 años
    y 30 días de edad.
- id: 66
  category: license_system
  question: Después de solicitar una nueva credencial, ¿dentro de cuántos días naturales
    llegará a su dirección postal?
  choices:
    A: 7 días naturales
    B: 10 días naturales
    C: 14 días naturales
    D: 21 días naturales
  answer: C
  explanation: Su credencial se enviará a la dirección postal registrada en el BMV
    y llegará a su dirección postal en un plazo de 14 días naturales.
- id: 67
  category: license_system
  question: ¿Por qué motivos están disponibles las tarjetas de identificación exentas
    de fotografía?
  choices:
    A: Solo motivos médicos
    B: Solo motivos religiosos
    C: Tanto motivos médicos como religiosos
    D: Solo motivos de privacidad
  answer: B
  explanation: Los permisos de aprendizaje y las licencias de conducir exentos de
    fotografía están disponibles por motivos médicos y religiosos. Las tarjetas de
    identificación exentas de fotografía están disponibles únicamente por motivos
    religiosos.
- id: 68
  category: driver_testing
  question: Al solicitar una licencia de conducir, ¿cuál de las siguientes afirmaciones
    es verdadera con respecto a los exámenes de conocimientos y de habilidades?
  choices:
    A: El examen de habilidades debe completarse antes del examen de conocimientos
    B: El examen de conocimientos debe completarse antes del examen de habilidades
    C: Ambos exámenes deben realizarse el mismo día
    D: El examen de conocimientos se exonera si aprueba el examen de habilidades
  answer: B
  explanation: Para obtener una licencia de conducir, debe aprobar un examen de conocimientos
    para la licencia de conducir que desea obtener, el cual debe completarse antes
    del examen de habilidades.
- id: 69
  category: safe_driving_rules
  question: 'Después de tener una licencia probatoria durante 180 días (y ser menor
    de 18 años), puede conducir durante las horas restringidas si está participando,
    yendo o regresando de:'
  choices:
    A: Una actividad sancionada por la escuela
    B: La casa de un amigo
    C: Un evento deportivo local como espectador
    D: Un parque público
  answer: A
  explanation: Puede conducir durante los períodos restringidos si está participando,
    yendo o regresando de un empleo legal, una actividad sancionada por la escuela
    o un evento religioso.
- id: 70
  category: vehicle_information
  question: 'Una CDL de Indiana permite al titular operar vehículos motorizados comerciales
    con clasificaciones de peso bruto vehicular superiores a:'
  choices:
    A: 10,000 libras
    B: 16,000 libras
    C: 20,000 libras
    D: 26,000 libras
  answer: D
  explanation: Una CDL de Indiana permite al titular operar vehículos motorizados
    comerciales o una combinación de vehículos con clasificaciones de peso bruto vehicular
    superiores a 26,000 libras.
- id: 71
  category: license_system
  question: ¿Qué sucede si cambia su dirección postal en el Servicio Postal de los
    Estados Unidos (USPS) pero olvida actualizarla en el BMV de Indiana?
  choices:
    A: El USPS reenviará automáticamente su credencial a su nueva dirección.
    B: Su credencial se guardará en la oficina de correos local para que la recoja.
    C: Su credencial no será reenviada, lo que impedirá la entrega.
    D: En su lugar, el BMV le enviará por correo electrónico una copia digital de
      su credencial.
  answer: C
  explanation: El manual establece que las credenciales solo se enviarán por correo
    a la dirección registrada en el BMV y no se reenviarán. No actualizar su dirección
    en el BMV impedirá la entrega.
- id: 72
  category: safe_driving_rules
  question: Según la ley de Indiana, ¿quién está obligado a usar el cinturón de seguridad
    cuando un vehículo motorizado está en movimiento?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Todos los ocupantes de un vehículo motorizado equipado con un cinturón de seguridad
      de instalación estándar
    C: Solo los pasajeros menores de 18 años
    D: El conductor, a menos que esté operando un vehículo comercial
  answer: B
  explanation: La ley de Indiana exige que todos los ocupantes de un vehículo motorizado
    equipado con un cinturón de seguridad que sea equipo estándar instalado por el
    fabricante usen el cinturón de seguridad en cualquier momento que el vehículo
    esté en movimiento.
- id: 73
  category: driver_responsibility
  question: ¿Cuándo es legalmente permisible usar un dispositivo de telecomunicaciones
    para escribir o leer un mensaje de texto mientras se opera un vehículo motorizado
    en movimiento?
  choices:
    A: Al viajar a velocidades inferiores a 15 mph
    B: Al estar detenido en un semáforo en rojo
    C: Al usar tecnología de manos libres o realizar una llamada de emergencia al
      911
    D: Al conducir en una carretera rural sin otro tráfico
  answer: C
  explanation: La ley de Indiana prohíbe escribir, transmitir o leer un mensaje de
    texto o correo electrónico mientras se opera un vehículo en movimiento, a menos
    que el dispositivo se utilice con tecnología de manos libres o activada por voz,
    o para realizar una llamada de emergencia al 911.
- id: 74
  category: driver_responsibility
  question: ¿Cuál de los siguientes NO se considera un dispositivo de telecomunicaciones
    restringido según las leyes de conducción de Indiana?
  choices:
    A: Un teléfono inalámbrico
    B: Un asistente digital personal (PDA)
    C: Un dispositivo de mensajería de texto
    D: Equipo de radio de banda ciudadana (CB) operado por un operador con licencia
  answer: D
  explanation: La definición de dispositivo de telecomunicaciones no incluye el equipo
    de radio de banda ciudadana (CB) operado por una persona con licencia de la FCC.
- id: 75
  category: license_system
  question: ¿Qué indica la Restricción G cuando se coloca en una licencia de conducir
    de Indiana?
  choices:
    A: Se requieren anteojos o lentes de contacto
    B: Se requieren espejos retrovisores exteriores
    C: Conducción únicamente durante el día
    D: Se requiere un dispositivo de interbloqueo
  answer: C
  explanation: Según la tabla de Restricciones de la Licencia de Conducir Base, la
    Restricción G significa 'Conducción únicamente durante el día'.
- id: 76
  category: safe_driving_rules
  question: ¿Cuáles son las horas de conducción permitidas para una persona que posee
    un permiso de aprendizaje de motocicleta?
  choices:
    A: Entre las 6:00 AM y las 6:00 PM
    B: Media hora antes del amanecer hasta media hora después del atardecer
    C: Desde el amanecer hasta el atardecer únicamente
    D: No hay restricciones de horario para los titulares de permisos
  answer: B
  explanation: Si posee un permiso de aprendizaje de motocicleta, solo puede conducir
    durante el período de media hora antes del amanecer y media hora después del atardecer.
- id: 77
  category: license_system
  question: Si va a obtener su licencia de conducir de Indiana por primera vez, ¿cuál
    es el requisito de edad mínima para obtener un endoso de motocicleta al mismo
    tiempo?
  choices:
    A: 15 años de edad
    B: 16 años de edad
    C: 16 años y 90 días de edad
    D: 18 años de edad
  answer: C
  explanation: Puede obtener un endoso de motocicleta al mismo tiempo que su primera
    licencia de conducir, siempre que tenga 16 años y 90 días de edad o más y haya
    completado un curso de seguridad en motocicleta.
- id: 78
  category: vehicle_information
  question: 'Para ser definido como un Ciclo Impulsado por Motor (MDC) según la ley
    de Indiana, la capacidad del cilindro del vehículo no debe exceder:'
  choices:
    A: 35 centímetros cúbicos
    B: 50 centímetros cúbicos
    C: 150 centímetros cúbicos
    D: 250 centímetros cúbicos
  answer: B
  explanation: La ley de Indiana define un vehículo como un MDC si, entre otros requisitos,
    tiene una capacidad de cilindro que no excede los 50 centímetros cúbicos.
- id: 79
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una restricción que se aplica a la operación
    de un Ciclo Impulsado por Motor (MDC)?
  choices:
    A: Debe operar a no más de 35 millas por hora
    B: Puede llevar un pasajero si este usa casco
    C: Puede operarse en autopistas interestatales
    D: Debe operarse en el centro de la calzada
  answer: A
  explanation: Las restricciones para operar un MDC incluyen operar a no más de 35
    millas por hora, no llevar pasajeros y no operar en una autopista interestatal.
- id: 80
  category: vehicle_information
  question: ¿Cuál de las siguientes características es necesaria para que un vehículo
    motorizado de tres ruedas se defina legalmente como un autociclo en Indiana?
  choices:
    A: Manubrios para la dirección
    B: Frenos antibloqueo
    C: Un asiento tipo silla de montar
    D: Una capacidad de cilindro inferior a 50cc
  answer: B
  explanation: Un autociclo debe estar equipado con una jaula o arcos de seguridad,
    cinturones de seguridad, frenos antibloqueo y estar diseñado para ser controlado
    con un volante y pedales.
- id: 81
  category: license_system
  question: ¿Qué credencial se requiere para operar legalmente un autociclo en las
    carreteras de Indiana?
  choices:
    A: Un permiso de aprendizaje de motocicleta
    B: Un endoso de motocicleta
    C: Una licencia de conducir de Indiana válida
    D: Una licencia de conducir comercial (CDL)
  answer: C
  explanation: Puede operar un autociclo en las carreteras de Indiana si posee una
    licencia de conducir de Indiana válida. No se requiere un permiso de aprendizaje
    ni un endoso de motocicleta.
- id: 82
  category: driver_testing
  question: ¿Cuál de las siguientes acciones está prohibida al operar un autociclo?
  choices:
    A: Conducir en autopistas interestatales
    B: Utilizar el autociclo para un examen de habilidades de conducción para una
      licencia de conducir
    C: Operar el vehículo sin un casco de motocicleta
    D: Llevar a un pasajero en el área de asientos cerrada
  answer: B
  explanation: El manual establece explícitamente que un autociclo "No puede ser utilizado
    para el propósito de un examen de habilidades de conducción para una licencia
    de conducir".
- id: 83
  category: license_system
  question: ¿Un endoso para alquiler (for-hire) permite al titular de la credencial
    operar un vehículo motorizado diseñado para transportar a menos de cuántos pasajeros
    por compensación?
  choices:
    A: 10 pasajeros
    B: 12 pasajeros
    C: 15 pasajeros
    D: 16 pasajeros
  answer: D
  explanation: Un endoso para alquiler (for-hire) otorga privilegios para operar un
    vehículo motorizado diseñado para transportar a menos de 16 pasajeros, incluido
    el conductor, con el propósito de transportar pasajeros por compensación.
- id: 84
  category: license_system
  question: ¿Cuáles son los requisitos de edad y experiencia para obtener un endoso
    para alquiler (for-hire) en Indiana?
  choices:
    A: Al menos 16 años de edad con 6 meses de experiencia de conducción
    B: Al menos 18 años de edad y haber tenido una licencia de conducir de Indiana
      válida durante al menos un año
    C: Al menos 21 años de edad con un historial de conducción limpio
    D: Al menos 18 años de edad y haber tenido una licencia de conducir de Indiana
      válida durante al menos dos años
  answer: B
  explanation: Según el manual, se puede emitir un endoso para alquiler (for-hire)
    a los residentes de Indiana que tengan al menos 18 años de edad y que hayan tenido
    una licencia de conducir de Indiana válida durante al menos un año.
- id: 85
  category: license_system
  question: ¿Requiere el BMV de Indiana un informe de examen médico para emitir una
    licencia de conducir con un endoso para alquiler (for-hire)?
  choices:
    A: Sí, debe actualizarse cada dos años.
    B: Sí, pero solo para conductores mayores de 65 años.
    C: No, el BMV no requiere un informe de examen médico para un endoso para alquiler
      (for-hire).
    D: No, a menos que el conductor transporte materiales peligrosos.
  answer: C
  explanation: 'El manual establece: "El BMV no requiere un informe de examen médico
    para emitir una licencia de conducir con el endoso para alquiler (for-hire)".'
- id: 86
  category: vehicle_information
  question: ¿Cuál de los siguientes NO se considera transporte para alquiler según
    el manual del conductor de Indiana?
  choices:
    A: Operar un vehículo de transporte compartido
    B: Operar un vehículo de servicios médicos
    C: Operar un taxi o limusina
    D: Operar un autobús utilizado para transportar pasajeros por compensación
  answer: B
  explanation: El manual enumera explícitamente "Operar un vehículo de servicios médicos"
    como una excepción que no se considera transporte para alquiler.
- id: 87
  category: driver_responsibility
  question: Bajo la Ley de Elección del Donante de Indiana, ¿qué sucede si una persona
    de 18 años o más declara su intención de ser donante de órganos?
  choices:
    A: Sus familiares pueden anular la decisión en el momento de la muerte.
    B: Deben renovar su declaración cada cuatro años.
    C: Sus familiares no pueden anular su intención en el momento de la muerte.
    D: Deben llevar una tarjeta de donante de órganos por separado en todo momento.
  answer: C
  explanation: El manual establece que, bajo la Ley de Elección del Donante de Indiana,
    las personas de 18 años o más pueden declarar su intención de ser donantes de
    órganos y sus familiares no pueden anular su intención en el momento de la muerte.
- id: 88
  category: license_system
  question: ¿Qué documento debe proporcionar un veterano para obtener un indicador
    de veterano en su credencial?
  choices:
    A: Una Tarjeta de Acceso Común (CAC)
    B: Un formulario DD 214 emitido por el Departamento de Defensa de los Estados
      Unidos
    C: Una carta del Departamento de Asuntos de Veteranos
    D: Una tarjeta de identificación militar válida
  answer: B
  explanation: Para obtener el indicador de veterano, debe proporcionar un formulario
    DD 214 emitido por el Departamento de Defensa de los Estados Unidos que verifique
    su baja.
- id: 89
  category: safe_driving_rules
  question: La ley de Indiana requiere que el operador de una embarcación lleve una
    licencia de conducir válida si el motor produce más de ¿cuántos caballos de fuerza?
  choices:
    A: 5 caballos de fuerza
    B: 10 caballos de fuerza
    C: 15 caballos de fuerza
    D: 25 caballos de fuerza
  answer: B
  explanation: La ley de Indiana requiere que el operador de una embarcación con un
    motor que produzca más de 10 caballos de fuerza lleve una licencia de conducir
    válida.
- id: 90
  category: license_system
  question: Si tiene 15 años o más y no tiene licencia de conducir, ¿qué debe hacer
    para operar legalmente una embarcación con un motor de más de 10 caballos de fuerza?
  choices:
    A: Completar con éxito un curso de educación para navegantes aprobado y llevar
      una tarjeta de identificación de Indiana válida.
    B: Tener a un adulto con licencia mayor de 21 años en la embarcación con usted.
    C: Solicitar un permiso temporal para embarcaciones en el BMV.
    D: No puede operar una embarcación bajo ninguna circunstancia sin una licencia
      de conducir.
  answer: A
  explanation: Si tiene 15 años o más sin licencia de conducir, puede operar una embarcación
    solo después de completar con éxito un curso de educación para navegantes aprobado,
    y debe tener en su poder una tarjeta de identificación de Indiana válida.
- id: 91
  category: penalties_and_points
  question: ¿Qué sucede con su capacidad para operar una embarcación si se suspende
    su licencia de conducir?
  choices:
    A: Solo puede operar una embarcación durante las horas del día.
    B: Puede operar una embarcación si completa un curso de educación para navegantes.
    C: No puede operar una embarcación.
    D: Puede operar una embarcación siempre que tenga menos de 25 caballos de fuerza.
  answer: C
  explanation: 'El manual establece: ''Si su licencia de conducir es suspendida, no
    podrá operar una embarcación''.'
- id: 92
  category: vehicle_information
  question: ¿Cuándo vence un cartel de estacionamiento emitido por una discapacidad
    temporal?
  choices:
    A: En la fecha indicada por el proveedor de atención médica o un año después de
      la emisión, lo que ocurra primero.
    B: Dos años a partir de la fecha de emisión.
    C: En el próximo cumpleaños del conductor.
    D: Seis meses a partir de la fecha de emisión.
  answer: A
  explanation: Si tiene una discapacidad temporal, su cartel de estacionamiento vence
    en la fecha indicada por el proveedor de atención médica o un año después de la
    fecha de emisión, lo que ocurra primero.
- id: 93
  category: vehicle_information
  question: ¿Cuál es la tarifa para obtener un cartel de estacionamiento permanente
    en Indiana?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: No hay tarifa por un cartel de estacionamiento permanente.
  answer: D
  explanation: 'El manual establece explícitamente: ''No hay tarifa por un cartel
    de estacionamiento permanente''.'
- id: 94
  category: safe_driving_rules
  question: ¿Está permitido estacionarse en el espacio con franjas diagonales junto
    a un espacio de estacionamiento reservado si tiene un cartel de estacionamiento
    válido?
  choices:
    A: Sí, pero solo para subir y bajar pasajeros.
    B: Sí, si el espacio reservado principal ya está ocupado.
    C: No, estacionarse en el espacio con franjas diagonales está prohibido en todo
      momento.
    D: No, a menos que esté conduciendo una camioneta accesible para sillas de ruedas.
  answer: C
  explanation: 'El manual establece: ''Estacionarse en el espacio con franjas diagonales
    junto a un espacio de estacionamiento reservado está prohibido en todo momento,
    incluso con un cartel válido''.'
- id: 95
  category: license_system
  question: ¿Cuándo vence una licencia de conducir a prueba (probationary) de Indiana?
  choices:
    A: A la medianoche del cumpleaños número 21 del conductor.
    B: Cuando el titular de la tarjeta tiene 21 años y 30 días de edad.
    C: Cuatro años a partir de la fecha de emisión.
    D: A la medianoche del cumpleaños número 18 del conductor.
  answer: B
  explanation: Según el manual, una licencia de conducir a prueba vence cuando el
    titular de la tarjeta tiene 21 años y 30 días de edad.
- id: 96
  category: license_system
  question: Si su cumpleaños cae en un día en que las sucursales del BMV están cerradas,
    ¿cuándo vence su credencial?
  choices:
    A: A la medianoche del día anterior a su cumpleaños.
    B: A la medianoche de su cumpleaños, independientemente del horario del BMV.
    C: A la medianoche del siguiente día hábil.
    D: Siete días después de su cumpleaños.
  answer: C
  explanation: 'El manual señala: ''Si su cumpleaños cae en un día en que las sucursales
    del BMV están cerradas, su credencial vence a la medianoche del siguiente día
    hábil''.'
- id: 97
  category: penalties_and_points
  question: ¿Puede recibir puntos en su historial de conductor por infracciones cometidas
    mientras opera una embarcación?
  choices:
    A: No, las infracciones en embarcaciones se manejan por separado de los historiales
      de conducción.
    B: Sí, si opera su embarcación de manera imprudente, bajo los efectos del alcohol
      o si infringe las leyes de embarcaciones privadas.
    C: Sí, pero solo si opera una embarcación con más de 50 caballos de fuerza.
    D: No, a menos que la embarcación esté involucrada en una colisión con un vehículo
      motorizado.
  answer: B
  explanation: El manual establece que si opera su embarcación de manera imprudente,
    bajo los efectos del alcohol o infringe las leyes de embarcaciones privadas, se
    le pueden asignar puntos en su historial de conductor.
- id: 98
  category: license_system
  question: ¿Con cuánta anticipación puede renovar su licencia de conducir con un
    endoso de transporte público (for-hire) antes de que venza?
  choices:
    A: Hasta 30 días antes de que venza.
    B: Hasta 90 días antes de que venza.
    C: Hasta seis meses antes de que venza.
    D: Hasta un año antes de que venza.
  answer: D
  explanation: Puede renovar su licencia de conducir con un endoso de transporte público
    (for-hire) en cualquier sucursal del BMV de Indiana o en línea hasta un año antes
    de que la licencia venza.
- id: 99
  category: license_system
  question: ¿A qué hora vence normalmente una licencia de conducir de Indiana en su
    cumpleaños?
  choices:
    A: Al mediodía
    B: A las 5:00 PM
    C: A la medianoche
    D: A las 11:59 AM
  answer: C
  explanation: Según el manual, todas las demás credenciales vencen a la medianoche
    de su cumpleaños. Si la sucursal está cerrada, vence a la medianoche del siguiente
    día hábil.
- id: 100
  category: driver_testing
  question: ¿Qué debe hacer para renovar una licencia de conducir que ha estado vencida
    por tres años?
  choices:
    A: Pagar una multa y aprobar únicamente un examen de la vista
    B: Pagar una multa, aprobar un examen de conocimientos y aprobar un examen de
      la vista
    C: Aprobar un examen de habilidades de conducción y un examen de la vista
    D: Pagar una multa, aprobar un examen de conocimientos, un examen de habilidades
      de conducción y un examen de la vista
  answer: B
  explanation: Si está renovando una licencia de conducir que ha estado vencida por
    al menos 180 días pero no más de cinco años, debe pagar una multa administrativa,
    aprobar un examen de conocimientos y aprobar un examen de la vista estándar.
- id: 101
  category: license_system
  question: ¿Con cuánta antelación puede un ciudadano estadounidense o una persona
    con estatus legal permanente renovar su licencia de conducir?
  choices:
    A: Hasta 30 días antes del vencimiento
    B: Hasta 6 meses antes del vencimiento
    C: Hasta 12 meses antes del vencimiento
    D: Hasta 24 meses antes del vencimiento
  answer: D
  explanation: Los ciudadanos estadounidenses o las personas con estatus legal permanente
    pueden renovar su licencia de conducir o tarjeta de identificación hasta 24 meses
    antes del vencimiento de la credencial.
- id: 102
  category: driver_testing
  question: Si tiene al menos 21 años de edad y tiene seis o más puntos activos en
    su historial de conducción, ¿qué se requiere para renovar su licencia de conducir?
  choices:
    A: Debe realizar un examen de habilidades de conducción
    B: Debe realizar el examen de conocimientos
    C: Debe completar un Programa de Seguridad del Conductor (DSP)
    D: Debe pagar el doble de la tarifa de renovación
  answer: B
  explanation: Si tiene al menos 21 años de edad y tiene seis o más puntos activos
    en su historial de conducción, debe realizar el examen de conocimientos para renovar
    su licencia de conducir.
- id: 103
  category: license_system
  question: Si vive temporalmente fuera de Indiana sirviendo en las Fuerzas Armadas
    de los EE. UU., ¿durante cuánto tiempo sigue siendo válida su licencia de conducir
    después de su baja?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Su licencia de conducir sigue siendo válida durante 90 días después
    de su baja del servicio, después de su despliegue, o después de que ya no resida
    temporalmente fuera de Indiana debido al servicio.
- id: 104
  category: driver_responsibility
  question: ¿Dentro de cuántos días debe notificar a la BMV y solicitar una credencial
    enmendada después de cambiar su dirección principal?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Si tiene una credencial de Indiana, debe notificar a la BMV sobre un
    cambio en su dirección principal (legal) y solicitar una credencial enmendada
    dentro de los 30 días posteriores al cambio de dirección.
- id: 105
  category: license_system
  question: ¿Qué debe hacer antes de visitar una sucursal de la BMV para cambiar oficialmente
    su nombre en su licencia de conducir?
  choices:
    A: Cambiar su nombre en el registro de su vehículo en línea
    B: Visitar una oficina de la Administración del Seguro Social y esperar al menos
      un día hábil
    C: Actualizar su dirección postal en un quiosco BMV Connect
    D: Completar un Programa de Seguridad del Conductor
  answer: B
  explanation: Debe visitar una oficina de la Administración del Seguro Social para
    cambiar oficialmente su nombre en la documentación del Seguro Social y dejar pasar
    al menos un día hábil después de que se complete la transacción de cambio de nombre
    antes de visitar una sucursal de la BMV.
- id: 106
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su historial de conducción por exceder el
    límite de velocidad entre 16 y 25 millas por hora?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Según la tabla de valores de puntos, exceder el límite de velocidad
    entre 16 y 25 millas por hora resulta en 4 puntos.
- id: 107
  category: penalties_and_points
  question: ¿Cuánto tiempo permanecen activos los puntos en su historial de conductor
    de Indiana?
  choices:
    A: Un año desde la fecha de la condena
    B: Dos años desde la fecha de la condena
    C: Tres años desde la fecha de la condena
    D: Cinco años desde la fecha de la condena
  answer: B
  explanation: Los puntos permanecen activos en su historial de conductor durante
    dos años a partir de la fecha de la condena.
- id: 108
  category: defensive_driving
  question: ¿Cuántos créditos de puntos puede recibir un conductor de Indiana por
    completar un Programa de Seguridad del Conductor (DSP) aprobado por la BMV?
  choices:
    A: Un crédito de dos puntos
    B: Un crédito de tres puntos
    C: Un crédito de cuatro puntos
    D: Un crédito de seis puntos
  answer: C
  explanation: Cualquier conductor de Indiana puede completar un curso de DSP de un
    proveedor aprobado por la BMV y recibir un crédito de cuatro puntos.
- id: 109
  category: penalties_and_points
  question: La BMV puede requerir que los conductores de 21 años de edad o más completen
    un Programa de Seguridad del Conductor (DSP) si son condenados por ¿cuántas infracciones
    de tránsito en un período de 12 meses?
  choices:
    A: Dos o más
    B: Tres o más
    C: Cuatro o más
    D: Cinco o más
  answer: A
  explanation: La BMV puede requerir que los conductores de 21 años de edad o más
    que sean condenados por dos o más infracciones de tránsito en un período de 12
    meses completen un curso de DSP aprobado por la BMV.
- id: 110
  category: driver_responsibility
  question: ¿Cuál es el estándar mínimo de seguro estatal para daños a la propiedad
    en cualquier accidente en Indiana?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: El estándar mínimo de seguro estatal incluye $25,000 para daños a la
    propiedad en cualquier accidente, comúnmente conocido como parte del seguro de
    responsabilidad civil 25/50/25.
- id: 111
  category: driver_responsibility
  question: Si la BMV solicita una prueba de responsabilidad financiera, ¿dentro de
    cuántos días debe recibirse electrónicamente el Certificado de Cumplimiento (COC)
    de su aseguradora?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: D
  explanation: El COC debe recibirse electrónicamente de su aseguradora y ser procesado
    por la BMV dentro de los 90 días posteriores al envío por correo de la solicitud
    de la BMV para verificar la responsabilidad financiera.
- id: 112
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por conducir con la licencia suspendida o participar
    en una competencia de velocidad en la carretera?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 10 puntos
  answer: C
  explanation: El manual enumera tanto 'Conducir con la licencia suspendida' como
    'Competencia de velocidad en la carretera' como infracciones que resultan en 8
    puntos.
- id: 113
  category: license_system
  question: ¿Cuál es el número máximo de veces que puede reemplazar su credencial
    en línea antes de que se le requiera visitar una sucursal de la BMV?
  choices:
    A: 3 veces
    B: 5 veces
    C: 10 veces
    D: 15 veces
  answer: C
  explanation: Puede reemplazar su credencial en línea un máximo de 10 veces antes
    de que se le requiera visitar una sucursal de la BMV para obtener un reemplazo.
- id: 114
  category: driver_responsibility
  question: ¿Cuál es la protección mínima de responsabilidad civil para vehículos
    motorizados del estado en Indiana?
  choices:
    A: 20/40/20
    B: 25/50/25
    C: 50/100/50
    D: 10/25/10
  answer: B
  explanation: El manual establece que la protección mínima de responsabilidad civil
    para vehículos motorizados del estado es 25/50/25.
- id: 115
  category: penalties_and_points
  question: ¿De cuántos días dispone para que su aseguradora procese electrónicamente
    un Certificado de Cumplimiento (COC) después de que la BMV envíe por correo una
    solicitud para verificar la responsabilidad financiera?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: El COC debe recibirse electrónicamente de su aseguradora y ser procesado
    por la BMV dentro de los 90 días posteriores al envío por correo de la solicitud
    de la BMV para verificar la responsabilidad financiera.
- id: 116
  category: driver_responsibility
  question: ¿Cuál es el propósito de un formulario SR22?
  choices:
    A: Informar un accidente de tráfico a la BMV
    B: Demostrar prueba de responsabilidad financiera futura
    C: Cancelar una póliza de seguro existente
    D: Registrar un vehículo propiedad de una empresa
  answer: B
  explanation: La ley de Indiana exige que su proveedor de seguros presente electrónicamente
    una prueba de responsabilidad financiera futura con un formulario SR22 para que
    se restablezcan sus privilegios de conducción.
- id: 117
  category: penalties_and_points
  question: ¿Qué sucede si la BMV recibe un aviso SR26 de su proveedor de seguros
    mientras usted tiene un requisito de SR22?
  choices:
    A: Sus privilegios de conducción serán suspendidos hasta que se reciba un SR22
      vigente o expire el período.
    B: Sus primas de seguro se reducirán.
    C: Se le requerirá volver a tomar el examen de habilidades de conducción.
    D: El registro de su vehículo será revocado permanentemente.
  answer: A
  explanation: Si la BMV recibe un aviso SR26 (cancelación del seguro SR22), la ley
    de Indiana exige que la BMV suspenda sus privilegios de conducción hasta que reciba
    una póliza SR22 vigente, o hasta que expire el período del requisito de SR22.
- id: 118
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento por una primera suspensión por
    falta de seguro que ocurrió después del 1 de enero de 2015?
  choices:
    A: $150
    B: $225
    C: $250
    D: $500
  answer: C
  explanation: Las tarifas de restablecimiento son de $250 por una primera suspensión
    por falta de seguro que ocurrió después del 1 de enero de 2015.
- id: 119
  category: penalties_and_points
  question: ¿Cómo puede un conductor restablecer sus privilegios de conducción sin
    pagar una tarifa de restablecimiento por falta de seguro?
  choices:
    A: Completando un curso de conducción defensiva
    B: Presentando una prueba de responsabilidad financiera futura (SR22) y manteniéndola
      continuamente durante 180 días
    C: Pagando la multa de tráfico original en su totalidad
    D: Escribiendo una carta de apelación a la BMV
  answer: B
  explanation: Un conductor puede restablecer sus privilegios de conducción sin tener
    que pagar una tarifa de restablecimiento por falta de seguro haciendo que su proveedor
    de seguros envíe electrónicamente una prueba de responsabilidad financiera futura
    (formulario SR22) y manteniendo el SR22 de forma continua durante 180 días.
- id: 120
  category: alcohol_drugs_health
  question: ¿Se considera un delito penal operar un vehículo si su concentración de
    alcohol en sangre (BAC) supera qué límite legal?
  choices:
    A: '.04'
    B: '.06'
    C: '.08'
    D: '.10'
  answer: C
  explanation: Operar un vehículo mientras se está intoxicado o con una concentración
    de alcohol en sangre (BAC) que exceda el límite legal (.08) es un delito penal.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes se enumera como un factor principal para determinar
    la concentración de alcohol en sangre (BAC) de un individuo?
  choices:
    A: La estatura del individuo
    B: El tipo de alcohol consumido
    C: El peso corporal del individuo
    D: La cantidad de comida ingerida antes de beber
  answer: C
  explanation: Los factores principales para determinar el BAC de un individuo son
    la cantidad de alcohol consumida, la rapidez con la que se consume el alcohol
    y el peso corporal del individuo.
- id: 122
  category: penalties_and_points
  question: ¿Cuál es la sanción para un automovilista que no pasa una prueba química
    de alcohol?
  choices:
    A: Una suspensión de 90 días de los privilegios de conducir
    B: Una suspensión de 180 días de los privilegios de conducir
    C: Una suspensión de un año de los privilegios de conducir
    D: Una suspensión de dos años de los privilegios de conducir
  answer: B
  explanation: Un automovilista que no pase una prueba química se enfrentará a una
    suspensión de los privilegios de conducir por 180 días.
- id: 123
  category: penalties_and_points
  question: Si un automovilista se niega a someterse a una prueba química, ¿por cuánto
    tiempo se suspenderán sus privilegios de conducir?
  choices:
    A: 180 días
    B: Un año
    C: Dos años
    D: Tres años
  answer: B
  explanation: Un automovilista que se niegue a someterse a una prueba química se
    enfrentará a una suspensión de los privilegios de conducir por un año.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál es la función de un dispositivo de interbloqueo de encendido?
  choices:
    A: Rastrea la velocidad y ubicación del vehículo para las autoridades.
    B: Analiza mecánicamente el nivel de alcohol en sangre del conductor antes de
      que el vehículo pueda ponerse en marcha.
    C: Contacta automáticamente a los servicios de emergencia en caso de un choque.
    D: Evita que el vehículo exceda el límite de velocidad establecido.
  answer: B
  explanation: El tribunal también puede exigir la instalación de un dispositivo de
    interbloqueo de encendido, el cual analiza mecánicamente el nivel de alcohol en
    sangre del conductor antes de que su vehículo pueda ponerse en marcha.
- id: 125
  category: alcohol_drugs_health
  question: ¿Cómo afecta a su historial de conducción una condena por operar una embarcación
    bajo los efectos del alcohol o drogas?
  choices:
    A: No tiene ningún efecto en su historial de conducción de vehículos motorizados.
    B: Resulta en una carta de advertencia pero no en una suspensión.
    C: Se envía al BMV y pasa a formar parte de su historial de conductor.
    D: Solo afecta su licencia de navegación, no su licencia de conducir.
  answer: C
  explanation: Una condena por operar una embarcación bajo los efectos del alcohol
    o drogas se envía al BMV y la condena pasa a formar parte de su historial de conductor.
- id: 126
  category: penalties_and_points
  question: ¿Qué medida puede tomar el BMV si un tribunal determina que un padre está
    en mora con el pago de la manutención infantil?
  choices:
    A: Suspender inmediatamente los privilegios de conducir del padre moroso.
    B: Confiscar el vehículo del padre.
    C: Duplicar las tarifas de registro del vehículo del padre.
    D: Exigir que el padre vuelva a tomar el examen de habilidades de conducción.
  answer: A
  explanation: Un tribunal que haya determinado que un padre está en mora con el pago
    de la manutención infantil puede ordenar al BMV que suspenda inmediatamente los
    privilegios de conducir del padre moroso.
- id: 127
  category: penalties_and_points
  question: ¿Qué sucederá si envía un pago al BMV por servicios o tarifas y el pago
    no es aceptado (por ejemplo, un cheque sin fondos)?
  choices:
    A: Recibirá una carta de advertencia dándole 30 días para pagar.
    B: Sus privilegios de conducir serán suspendidos indefinidamente.
    C: Se le requerirá realizar servicio comunitario.
    D: Su vehículo será incautado.
  answer: B
  explanation: El BMV suspenderá indefinidamente sus privilegios de conducir si envía
    un pago al BMV por cualquier servicio o tarifa y dicho pago no es aceptado.
- id: 128
  category: driver_responsibility
  question: ¿Cuánto cuesta ver su historial de conductor en línea en IN.gov/BMV?
  choices:
    A: $5.00 por consulta
    B: $10.00 anuales
    C: No tiene costo.
    D: $15.00 por una copia certificada
  answer: C
  explanation: Su primer recurso debe ser consultar su historial de conductor, el
    cual puede ver en cualquier momento sin costo alguno en IN.gov/BMV.
- id: 129
  category: license_system
  question: ¿Cuál es el costo de comprar un Historial Oficial del Conductor en Indiana?
  choices:
    A: Gratis
    B: $4
    C: $10
    D: $15
  answer: B
  explanation: Según el manual, se puede comprar un Historial Oficial del Conductor
    por $4.
- id: 130
  category: penalties_and_points
  question: ¿Cuánto tiempo le toma normalmente al BMV procesar la información de restablecimiento
    una vez que se recibe de un tribunal?
  choices:
    A: Hasta 48 horas
    B: Hasta 5 días hábiles
    C: Hasta 10 días hábiles
    D: Hasta 30 días
  answer: C
  explanation: El procesamiento por parte del BMV puede tardar hasta 10 días hábiles
    una vez que se recibe la información de restablecimiento del tribunal.
- id: 131
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al Registro
    de Conductor Visualizable (Viewable Driver Record)?
  choices:
    A: Cuesta $4 verlo.
    B: Puede usarse como un certificado oficial para empleadores.
    C: No se puede imprimir y no debe usarse como un certificado oficial.
    D: Solo está disponible en un quiosco BMV Connect.
  answer: C
  explanation: El Registro de Conductor Visualizable no se puede imprimir y no debe
    usarse como un certificado oficial de su historial de conductor.
- id: 132
  category: penalties_and_points
  question: Según la Sección A de las leyes de Infractor de Tráfico Habitual (HTV),
    ¿por cuánto tiempo se suspenderán los privilegios de un conductor si acumula dos
    sentencias en un período de 10 años por operar un vehículo motorizado en estado
    de ebriedad con resultado de muerte?
  choices:
    A: 5 años
    B: 10 años
    C: 15 años
    D: De por vida
  answer: D
  explanation: Los conductores que acumulen dos sentencias en un período de 10 años
    por operar un vehículo motorizado en estado de ebriedad con resultado de muerte
    verán suspendidos sus privilegios de conducción de por vida.
- id: 133
  category: penalties_and_points
  question: Un conductor que acumule tres infracciones graves, como conducción temeraria
    o carreras de autos (drag racing), en un período de 10 años, ¿enfrentará una suspensión
    de sus privilegios de conducción de qué duración?
  choices:
    A: 3 años
    B: 5 años
    C: 10 años
    D: De por vida
  answer: C
  explanation: Según la Sección B, los conductores que acumulen tres infracciones
    graves de la lista proporcionada en un período de 10 años verán suspendidos sus
    privilegios de conducción por 10 años.
- id: 134
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor que acumula 10 o más infracciones
    de tráfico en un período de 10 años, incluyendo al menos una infracción grave?
  choices:
    A: Una suspensión de 1 año
    B: Una suspensión de 5 años
    C: Una suspensión de 10 años
    D: Una suspensión de por vida
  answer: B
  explanation: Según la Sección C, un HTV está sujeto a una suspensión de los privilegios
    de conducción de cinco años por acumular 10 o más infracciones de tráfico en un
    período de 10 años, una de las cuales sea una infracción grave.
- id: 135
  category: license_system
  question: ¿Qué indica una 'Restricción 5' en una licencia de conducir de Indiana?
  choices:
    A: El conductor debe usar lentes correctivos.
    B: El conductor está restringido a conducir solo durante el día.
    C: Al conductor se le han otorgado privilegios de conducción por dificultades,
      a prueba, condicionales o especializados.
    D: El conductor debe operar un vehículo con un dispositivo de interbloqueo de
      encendido.
  answer: C
  explanation: Se coloca una 'Restricción 5' en la licencia de conducir de una persona
    a la que un tribunal le ha otorgado privilegios de conducción por dificultades,
    a prueba, condicionales o especializados.
- id: 136
  category: penalties_and_points
  question: ¿Cuál de los siguientes es un requisito para una persona a la que un tribunal
    le ha otorgado privilegios de conducción especializados?
  choices:
    A: Mantener un SR22 vigente en los archivos del BMV.
    B: Completar un curso de conducción defensiva cada 6 meses.
    C: Solo conducir un vehículo con transmisión manual.
    D: Entregar su credencial válidamente emitida al BMV.
  answer: A
  explanation: Una persona a la que se le otorgan privilegios de conducción especializados
    debe mantener un SR22 vigente en los archivos del BMV durante la duración de dichos
    privilegios.
- id: 137
  category: signs_and_signals
  question: ¿Qué tipo de información indican las señales de tráfico de color marrón?
  choices:
    A: Condiciones de tráfico temporales
    B: Servicios y comodidades en la carretera
    C: Sitios de interés recreativo y cultural cercanos
    D: Movimientos y direcciones permitidos
  answer: C
  explanation: Las señales de tráfico marrones indican sitios de interés recreativo
    y cultural cercanos, como un parque estatal.
- id: 138
  category: signs_and_signals
  question: Una señal de tráfico que muestra información sobre servicios en una próxima
    salida, ¿qué color de fondo tendrá típicamente?
  choices:
    A: Verde
    B: Azul
    C: Blanco
    D: Naranja
  answer: B
  explanation: Las señales de tráfico azules muestran servicios e información vial,
    como las comodidades en una próxima salida.
- id: 139
  category: signs_and_signals
  question: ¿Qué color se utiliza para las señales de tráfico que advierten a los
    conductores sobre condiciones de tráfico temporales, como la construcción de carreteras?
  choices:
    A: Amarillo
    B: Rojo
    C: Naranja
    D: Marrón
  answer: C
  explanation: Las señales de tráfico naranjas advierten a los conductores sobre condiciones
    de tráfico temporales, a menudo debido a proyectos de construcción y mantenimiento
    de carreteras.
- id: 140
  category: signs_and_signals
  question: ¿Qué muestran típicamente las señales de tráfico blancas?
  choices:
    A: Regulaciones de tráfico como límites de velocidad
    B: Advertencias sobre peligros específicos en la carretera
    C: Direcciones a hospitales cercanos
    D: Sitios de interés recreativo y cultural
  answer: A
  explanation: Las señales de tráfico blancas muestran regulaciones de tráfico, como
    límites de velocidad, que los conductores deben obedecer, así como información
    útil como marcadores de carreteras estatales.
- id: 141
  category: signs_and_signals
  question: Una señal de 'Resbaladizo cuando está mojado' es un ejemplo de una señal
    que prepara a los conductores para condiciones específicas de la carretera. ¿De
    qué color es su fondo?
  choices:
    A: Rojo
    B: Naranja
    C: Amarillo
    D: Verde
  answer: C
  explanation: Las señales amarillas o de color verde-amarillo fluorescente preparan
    a los conductores para condiciones específicas de la carretera y peligros más
    adelante. Una señal de 'Resbaladizo cuando está mojado' es un ejemplo de una señal
    de tráfico con fondo amarillo.
- id: 142
  category: signs_and_signals
  question: ¿Qué comunican las señales de tráfico rojas a los conductores?
  choices:
    A: Movimientos permitidos y guía
    B: Regulaciones de tráfico que requieren acción inmediata para evitar amenazas
      a la seguridad
    C: Zonas escolares cercanas y cruces de peatones
    D: Condiciones de tráfico temporales debido a la construcción
  answer: B
  explanation: Las señales de tráfico rojas comunican regulaciones de tráfico que
    requieren que los conductores tomen medidas inmediatas para evitar amenazas a
    la seguridad vial, como una señal de 'Contramano' (Wrong Way).
- id: 143
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones se considera una infracción mayor
    bajo la Sección A de las leyes de Infractores de Tráfico Habituales, lo que podría
    llevar a una suspensión de 10 años si se acumulan dos sentencias?
  choices:
    A: Nueve multas por exceso de velocidad en un período de 10 años
    B: Homicidio imprudente resultante de la operación de un vehículo motorizado
    C: Conducir con una licencia suspendida
    D: No usar una señal de giro
  answer: B
  explanation: El homicidio imprudente resultante de la operación de un vehículo motorizado
    figura en la Sección A como una infracción mayor que resulta en lesiones o muerte.
- id: 144
  category: signs_and_signals
  question: ¿De qué advierten a los conductores las señales de tráfico de color verde-amarillo
    fluorescente?
  choices:
    A: Zonas de construcción de carreteras
    B: Escuelas, peatones y bicicletas cercanos
    C: Próximos cruces de ferrocarril
    D: Regulaciones de tráfico que requieren acción inmediata
  answer: B
  explanation: Las señales de color verde-amarillo fluorescente advierten a los conductores
    sobre escuelas, peatones, bicicletas, áreas de juego y rutas de autobuses escolares
    cercanos.
- id: 145
  category: signs_and_signals
  question: ¿Dónde se colocan las señales de tráfico en forma de banderín y qué indican?
  choices:
    A: En el lado derecho de la carretera para indicar una zona escolar
    B: En el lado izquierdo de las carreteras de doble sentido para advertir que no
      se debe adelantar por la izquierda
    C: En las intersecciones para indicar una parada obligatoria
    D: Antes de los cruces de ferrocarril para advertir sobre trenes que se aproximan
  answer: B
  explanation: Las señales de tráfico en forma de banderín se colocan en el lado izquierdo
    de las carreteras de doble sentido para advertir a los conductores que no deben
    adelantar a otros vehículos por la izquierda.
- id: 146
  category: signs_and_signals
  question: ¿A qué tipo de peligro o condición alerta a los conductores una señal
    de tráfico circular?
  choices:
    A: Próximos cruces de ferrocarril
    B: Condiciones de carretera resbaladiza
    C: Curvas cerradas más adelante
    D: Zonas de construcción de carreteras
  answer: A
  explanation: Las señales de tráfico circulares alertan a los conductores sobre los
    próximos cruces de ferrocarril.
- id: 147
  category: signs_and_signals
  question: 'Una señal de tráfico de cinco lados indica que se está aproximando a:'
  choices:
    A: Una intersección de parada
    B: Una intersección de ceda el paso
    C: Un área cerca de una escuela donde los niños pueden estar cruzando
    D: Una zona de no adelantar
  answer: C
  explanation: Las señales de tráfico de cinco lados advierten a los conductores que
    están entrando en un área cerca de una escuela en la que los niños pueden estar
    cruzando la calle.
- id: 148
  category: vehicle_information
  question: ¿El emblema de vehículo de movimiento lento indica que el vehículo no
    puede exceder qué velocidad?
  choices:
    A: 15 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 30 millas por hora
  answer: C
  explanation: Un emblema de vehículo de movimiento lento tiene un centro naranja
    fluorescente y bordes reflectantes rojos, e indica un vehículo de movimiento lento
    que no puede exceder las 25 millas por hora.
- id: 149
  category: signs_and_signals
  question: ¿Qué colores componen un emblema de vehículo de movimiento lento?
  choices:
    A: Un fondo amarillo con bordes negros
    B: Un centro naranja fluorescente y bordes reflectantes rojos
    C: Un centro rojo con bordes reflectantes blancos
    D: Un centro verde-amarillo fluorescente con bordes negros
  answer: B
  explanation: Un emblema de vehículo de movimiento lento tiene un centro naranja
    fluorescente y bordes reflectantes rojos.
- id: 150
  category: signs_and_signals
  question: ¿Qué indican generalmente las señales de tráfico naranjas?
  choices:
    A: Servicios al conductor y áreas recreativas
    B: Zonas de construcción y mantenimiento de carreteras
    C: Zonas escolares y cruces de peatones
    D: Regulaciones de tráfico que deben obedecerse de inmediato
  answer: B
  explanation: Las señales de tráfico naranjas de construcción de carreteras advierten
    a los conductores que tengan cuidado al acercarse a las zonas de construcción.
- id: 151
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a una intersección y se encuentra con una
    luz amarilla fija, pero está demasiado cerca para detenerse de manera segura?
  choices:
    A: Frenar bruscamente y detenerse en la intersección
    B: Acelerar para ganarle a la luz roja
    C: Puede completar su movimiento a través de la intersección
    D: Orillarse al lado derecho de la carretera inmediatamente
  answer: C
  explanation: Si se encuentra con una luz amarilla fija, su derecho de paso está
    terminando. Si se aproxima a la intersección y está demasiado cerca para detenerse
    de manera segura, puede completar su movimiento.
- id: 152
  category: safe_driving_rules
  question: Al girar a la izquierda en una intersección con una luz verde encendida
    sin flecha, ¿cuántos vehículos pueden avanzar hacia la intersección a la vez para
    girar?
  choices:
    A: Tantos como quepan
    B: Solo un vehículo a la vez
    C: Dos vehículos a la vez
    D: Ningún vehículo puede entrar hasta que la luz se ponga roja
  answer: B
  explanation: Si se encuentra con una luz verde encendida sin flecha, puede girar
    a través de una intersección siempre que la intersección esté despejada... Solo
    un vehículo a la vez puede avanzar hacia una intersección para girar a la izquierda.
- id: 153
  category: safe_driving_rules
  question: ¿Qué significa una flecha amarilla intermitente para un movimiento de
    giro?
  choices:
    A: Usted tiene el derecho de paso y el tráfico que viene en sentido contrario
      debe cederlo
    B: Puede proceder con el giro solo después de ceder el paso a los peatones y al
      tráfico en sentido contrario
    C: Debe detenerse por completo y esperar a una flecha verde
    D: La intersección está cerrada al tráfico que gira
  answer: B
  explanation: Una flecha amarilla intermitente para un movimiento de giro significa
    que puede proceder con el giro solo después de haber cedido el derecho de paso
    a los peatones y al tráfico que viene en sentido contrario.
- id: 154
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite girar a la izquierda a través de una
    intersección con una luz roja fija?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido
    B: Al girar desde una calle de un solo sentido hacia una calle de doble sentido
    C: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
    D: Nunca se le permite girar a la izquierda con luz roja
  answer: C
  explanation: Puede girar a la izquierda a través de una intersección con una luz
    o flecha roja si está girando desde una calle de un solo sentido hacia otra calle
    de un solo sentido.
- id: 155
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un requisito antes de realizar un giro a la
    derecha permitido con luz roja?
  choices:
    A: Reducir la velocidad a 5 mph antes de girar
    B: Detenerse por completo y verificar si hay vehículos y peatones
    C: Tocar la bocina para advertir al tráfico transversal
    D: Encender las luces de emergencia
  answer: B
  explanation: Para girar a la derecha a través de una intersección con una luz o
    flecha roja, cuando esté permitido, debe detenerse por completo, verificar que
    no haya vehículos ni peatones en la trayectoria de su giro o a punto de entrar
    en ella...
- id: 156
  category: signs_and_signals
  question: ¿Qué debe hacer al aproximarse a una intersección con una luz amarilla
    intermitente encendida sin flecha?
  choices:
    A: Detenerse por completo y esperar a una luz verde
    B: Tratar la intersección como una parada de cuatro vías
    C: Reducir la velocidad y tener precaución al circular por la intersección
    D: Acelerar para despejar la intersección rápidamente
  answer: C
  explanation: Una luz amarilla intermitente encendida sin flecha en una intersección
    significa que debe reducir la velocidad y tener precaución al circular por la
    intersección.
- id: 157
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico de triángulo equilátero?
  choices:
    A: Advierte a los conductores que reduzcan la velocidad y se preparen para detenerse
      por completo para ceder el paso
    B: Indica que hay una zona escolar más adelante
    C: Alerta a los conductores sobre un próximo cruce de ferrocarril
    D: Marca el inicio de una zona de no rebasar
  answer: A
  explanation: Las señales de tráfico con tres lados de igual longitud advierten a
    los conductores que reduzcan la velocidad al acercarse a una intersección y que
    se preparen para detenerse por completo a fin de ceder el paso a otros conductores
    o peatones.
- id: 158
  category: signs_and_signals
  question: ¿Cuál es el propósito de una placa suplementaria añadida a la parte inferior
    de una señal de alto (STOP)?
  choices:
    A: Indicar el límite de velocidad de la calle transversal
    B: Indicar las direcciones en las que la intersección debe detenerse
    C: Advertir de una zona escolar cercana
    D: Proporcionar la distancia al siguiente pueblo
  answer: B
  explanation: A veces se añaden placas suplementarias a la parte inferior de las
    señales de alto para indicar las direcciones en las que la intersección debe detenerse.
- id: 159
  category: signs_and_signals
  question: ¿Qué significa una luz amarilla intermitente encendida sin flecha en una
    intersección?
  choices:
    A: Detenerse y esperar a una luz verde.
    B: Reducir la velocidad y tener precaución al circular por la intersección.
    C: Usted tiene el derecho de paso y no necesita reducir la velocidad.
    D: El semáforo está averiado y debe tratarse como una parada de cuatro vías.
  answer: B
  explanation: Según el manual, una luz amarilla intermitente encendida sin flecha
    significa que debe reducir la velocidad y tener precaución al circular por una
    intersección.
- id: 160
  category: signs_and_signals
  question: Si usted y otro conductor llegan al mismo tiempo a una luz roja intermitente
    en una intersección donde todo el tráfico debe detenerse, ¿quién debe ceder el
    derecho de paso?
  choices:
    A: El vehículo de la derecha.
    B: El vehículo de la izquierda.
    C: El vehículo que circula más rápido.
    D: El vehículo que gira a la derecha.
  answer: B
  explanation: El manual establece que si llega al mismo tiempo que otro conductor
    a una intersección donde todo el tráfico debe detenerse, el vehículo de la izquierda
    deberá ceder el derecho de paso.
- id: 161
  category: vehicle_information
  question: ¿Bajo qué condición puede una persona que opera una motocicleta pasar
    a través de una luz roja fija que no cambia a verde?
  choices:
    A: Después de detenerse por completo durante al menos dos minutos y ejercer la
      debida precaución.
    B: Después de tocar la bocina y esperar 30 segundos.
    C: Solo si hay un oficial de policía presente para dirigir el tráfico.
    D: A las motocicletas nunca se les permite pasar a través de una luz roja fija.
  answer: A
  explanation: Los operadores de motocicletas y ciclos impulsados por motor que se
    aproximen a una intersección controlada por una señal de tráfico pueden pasar
    a través de una luz roja fija si el operador se detiene por completo durante al
    menos dos minutos y ejerce la debida precaución.
- id: 162
  category: vehicle_information
  question: ¿Se aplica a los autociclos (autocycles) la regla que permite a las motocicletas
    pasar a través de una luz roja fija después de esperar dos minutos?
  choices:
    A: Sí, los autociclos siguen todas las reglas de las motocicletas.
    B: Sí, pero deben esperar tres minutos en lugar de dos.
    C: No, esta regla no se aplica a los autociclos.
    D: No, los autociclos deben tratar todas las luces rojas como señales de ceda
      el paso.
  answer: C
  explanation: El manual establece explícitamente que la regla que permite a los operadores
    evitar esperas prolongadas en luces rojas esperando dos minutos no se aplica a
    los autociclos.
- id: 163
  category: signs_and_signals
  question: ¿Cómo debe proceder al acercarse a una intersección con una señal de tráfico
    que no funciona?
  choices:
    A: Pasar por la intersección sin detenerse si la carretera está despejada.
    B: Detenerse antes de entrar en la intersección y ceder el paso a los vehículos
      que llegaron antes que usted o que están a su derecha.
    C: Tratar la intersección como una señal de ceda el paso y reducir la velocidad.
    D: Esperar hasta que llegue un oficial de tránsito para dirigir el tráfico.
  answer: B
  explanation: Si se acerca a una intersección con una señal que no funciona, debe
    detenerse antes de entrar y proceder con precaución después de ceder el paso al
    tráfico transversal, a los vehículos que se detuvieron antes que usted, a los
    vehículos que llegaron al mismo tiempo a su derecha y a los peatones.
- id: 164
  category: signs_and_signals
  question: ¿Qué muestra una baliza híbrida para peatones inmediatamente después de
    que un peatón la activa?
  choices:
    A: Una luz roja fija.
    B: Una luz amarilla intermitente.
    C: Una luz amarilla fija.
    D: Dos luces rojas intermitentes.
  answer: B
  explanation: Una vez activada por un peatón, la baliza híbrida para peatones mostrará
    una luz amarilla intermitente para permitir que los conductores despejen el cruce.
- id: 165
  category: safe_driving_rules
  question: ¿Qué indican las marcas amarillas de carril en una calzada?
  choices:
    A: Separan múltiples carriles de tráfico que van en la misma dirección.
    B: Indican un carril de autobús o de tránsito.
    C: Separan múltiples carriles de tráfico que van en direcciones opuestas.
    D: Indican una zona de cruce de peatones.
  answer: C
  explanation: Según el manual, las marcas amarillas de carril separan múltiples carriles
    de tráfico que van en direcciones opuestas.
- id: 166
  category: safe_driving_rules
  question: Al adelantar a otro vehículo, ¿cuánta distancia debe dejar antes de regresar
    al lado derecho de la carretera frente a un vehículo que viene en sentido contrario?
  choices:
    A: No menos de 50 pies.
    B: No menos de 100 pies.
    C: No menos de 200 pies.
    D: No menos de 500 pies.
  answer: B
  explanation: Debe regresar al lado derecho de la carretera no menos de 100 pies
    antes de cualquier vehículo que venga en sentido contrario al adelantar.
- id: 167
  category: defensive_driving
  question: ¿Qué debe hacer para revisar su punto ciego antes de cambiar de carril?
  choices:
    A: Confiar totalmente en su espejo retrovisor.
    B: Girar brevemente la cabeza hacia el carril al que está entrando.
    C: Tocar la bocina para alertar a los vehículos en su punto ciego.
    D: Hacer parpadear sus faros delanteros dos veces.
  answer: B
  explanation: Al cambiar de carril, debe girar brevemente la cabeza hacia el carril
    al que está entrando para asegurarse de que no haya ningún vehículo en su punto
    ciego.
- id: 168
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es peligroso e ilegal adelantar
    a otro vehículo?
  choices:
    A: Al conducir en una carretera con una línea amarilla discontinua.
    B: A menos de 100 pies de una intersección, cruce de ferrocarril, puente, viaducto
      o túnel.
    C: Cuando el vehículo de adelante viaja por debajo del límite de velocidad.
    D: En una autopista de varios carriles con líneas blancas discontinuas.
  answer: B
  explanation: Es peligroso e ilegal intentar adelantar a otros vehículos a menos
    de 100 pies de una intersección, cruce de ferrocarril, puente, viaducto o túnel.
- id: 169
  category: sharing_the_road
  question: ¿Qué debe hacer si otro vehículo lo está adelantando por el lado izquierdo
    de la carretera?
  choices:
    A: Aumentar su velocidad para evitar que lo adelanten.
    B: Moverse al carril izquierdo para bloquearlo.
    C: Permitir que el otro vehículo pase de manera segura y no aumentar su velocidad.
    D: Tocar la bocina para advertirle del tráfico que viene en sentido contrario.
  answer: C
  explanation: Si otro vehículo lo está adelantando por el lado izquierdo de la carretera,
    permita que el otro vehículo pase de manera segura y no aumente su velocidad.
- id: 170
  category: safe_driving_rules
  question: ¿Cuál es la posición adecuada del carril al prepararse para girar a la
    derecha?
  choices:
    A: El carril del extremo izquierdo para su dirección de viaje.
    B: El carril central.
    C: El carril del extremo derecho para su dirección de viaje.
    D: Cualquier carril, siempre que use su señal de giro.
  answer: C
  explanation: Para girar a la derecha, debe estar en el carril del extremo derecho
    para su dirección de viaje.
- id: 171
  category: signs_and_signals
  question: ¿Qué indica a un ciclista una señal de bicicleta que muestra un símbolo
    de bicicleta amarillo?
  choices:
    A: El derecho de paso está terminando.
    B: Proceda con precaución.
    C: Ceda el paso a los peatones.
    D: El carril para bicicletas está terminando.
  answer: A
  explanation: Al igual que con las señales vehiculares, una señal de bicicleta amarilla
    significa que el derecho de paso está terminando.
- id: 172
  category: signs_and_signals
  question: ¿Qué tipo de señal controla un carril de autobús o de tránsito y es aplicable
    únicamente a los operadores de autobuses o de tránsito?
  choices:
    A: Una señal que muestra un triángulo amarillo.
    B: Una señal que muestra barras rectangulares blancas.
    C: Una señal que muestra un círculo rojo intermitente.
    D: Una señal que muestra una flecha verde.
  answer: B
  explanation: Una señal que muestra barras rectangulares blancas controla un carril
    de autobús o de tránsito y es aplicable únicamente a los operadores de autobuses
    o de tránsito.
- id: 173
  category: safe_driving_rules
  question: ¿Dónde debe detenerse si se aproxima a una señal de alto (stop) en una
    intersección que no tiene línea de parada ni paso de peatones?
  choices:
    A: En el borde de la calzada que cruza.
    B: Antes de entrar en la intersección.
    C: Diez pies antes de la señal de alto.
    D: En medio de la intersección para comprobar el tráfico.
  answer: B
  explanation: Si no hay línea de parada ni paso de peatones, debe detenerse por completo
    antes de entrar en la intersección.
- id: 174
  category: driver_testing
  question: ¿Se le permite utilizar señales manuales durante un examen de habilidades
    de conducción?
  choices:
    A: Sí, pero solo si sus señales luminosas no funcionan correctamente.
    B: Sí, se prefieren las señales manuales a las luminosas.
    C: No, no puede utilizar señales manuales en un examen de habilidades de conducción.
    D: Sí, siempre que las utilice con suficiente antelación antes del giro.
  answer: C
  explanation: Según el manual, no puede utilizar señales manuales en un examen de
    habilidades de conducción.
- id: 175
  category: safe_driving_rules
  question: ¿Cuál es el uso adecuado de un carril central especialmente designado?
  choices:
    A: Rebasar vehículos más lentos
    B: Realizar giros a la izquierda únicamente
    C: Realizar giros a la derecha únicamente
    D: Estacionar en caso de emergencia
  answer: B
  explanation: Las carreteras con mucho tráfico suelen tener un carril central designado
    exclusivamente para vehículos que giran a la izquierda. Nunca debe utilizar este
    tipo de carril central para rebasar a otros vehículos.
- id: 176
  category: safe_driving_rules
  question: ¿Dónde está explícitamente prohibido hacer un giro en U?
  choices:
    A: En una intersección con giro en U en la mediana
    B: En una carretera del condado
    C: En una autopista interestatal
    D: En una zona residencial urbana
  answer: C
  explanation: El manual establece que nunca se debe hacer un giro en U en una autopista
    interestatal. En su lugar, continúe hasta la siguiente salida y vuelva a entrar
    en la autopista en la dirección opuesta.
- id: 177
  category: safe_driving_rules
  question: Si dos vehículos llegan al mismo tiempo a una parada de cuatro vías (all-way
    stop), ¿qué vehículo debe ceder el derecho de paso?
  choices:
    A: El vehículo de la derecha
    B: El vehículo de la izquierda
    C: El vehículo más grande
    D: El vehículo que viaja más rápido
  answer: B
  explanation: Si llega a una señal de alto de cuatro vías al mismo tiempo que otro
    conductor, el vehículo de la izquierda deberá ceder el derecho de paso.
- id: 178
  category: safe_driving_rules
  question: ¿En qué dirección circula el tráfico en una glorieta o rotonda?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: Tanto en el sentido de las agujas del reloj como en sentido contrario
    D: En línea recta
  answer: B
  explanation: Una glorieta es una intersección circular en la que el tráfico entra
    o sale solo mediante giros a la derecha y circula en sentido contrario a las agujas
    del reloj.
- id: 179
  category: sharing_the_road
  question: Si dos camiones grandes se aproximan o circulan por una glorieta al mismo
    tiempo, ¿qué debe suceder?
  choices:
    A: El conductor del carril izquierdo debe ceder el paso al conductor del carril
      derecho.
    B: El conductor del carril derecho debe ceder el paso al conductor del carril
      izquierdo.
    C: Ambos camiones deben detenerse y esperar a un oficial de policía.
    D: El camión que transporta la carga más pesada tiene el derecho de paso.
  answer: B
  explanation: Si dos camiones grandes se aproximan o circulan por una glorieta al
    mismo tiempo, el conductor del carril derecho debe ceder el derecho de paso al
    conductor del carril izquierdo.
- id: 180
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo para vehículos de pasajeros en
    una autopista interestatal rural?
  choices:
    A: 55 millas por hora
    B: 60 millas por hora
    C: 65 millas por hora
    D: 70 millas por hora
  answer: D
  explanation: En las autopistas interestatales rurales, los vehículos de pasajeros
    no pueden exceder las 70 millas por hora o el límite de velocidad señalizado.
- id: 181
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en los callejones?
  choices:
    A: 10 millas por hora
    B: 15 millas por hora
    C: 20 millas por hora
    D: 25 millas por hora
  answer: B
  explanation: En los callejones, los vehículos no pueden exceder las 15 millas por
    hora o el límite de velocidad señalizado.
- id: 182
  category: defensive_driving
  question: ¿Cuál es una buena regla que los conductores deben seguir con respecto
    a la distancia de seguimiento?
  choices:
    A: Mantenerse al menos un segundo detrás del vehículo que va adelante
    B: Mantenerse al menos de dos a tres segundos detrás del vehículo que va adelante
    C: Mantenerse al menos de cuatro a cinco segundos detrás del vehículo que va adelante
    D: Mantenerse al menos la longitud de un vehículo por cada 10 mph detrás del vehículo
      que va adelante
  answer: B
  explanation: Una buena regla que los conductores deben seguir es mantenerse al menos
    de dos a tres segundos detrás del vehículo que va adelante.
- id: 183
  category: safe_driving_rules
  question: ¿Cómo se comparan los límites de velocidad en zonas de obras con el límite
    de velocidad máximo establecido para el área?
  choices:
    A: Son al menos 5 millas por hora inferiores al límite de velocidad máximo establecido.
    B: Son al menos 10 millas por hora inferiores al límite de velocidad máximo establecido.
    C: Son al menos 15 millas por hora inferiores al límite de velocidad máximo establecido.
    D: Son iguales al límite de velocidad máximo establecido.
  answer: B
  explanation: Los límites de velocidad en zonas de obras son siempre al menos 10
    millas por hora inferiores al límite de velocidad máximo establecido para el área.
- id: 184
  category: signs_and_signals
  question: ¿En qué se diferencia un círculo de tráfico de una rotonda?
  choices:
    A: Un círculo de tráfico solo tiene tráfico en sentido contrario a las agujas
      del reloj.
    B: Un círculo de tráfico siempre está controlado por semáforos.
    C: Un círculo de tráfico puede tener tráfico en el sentido de las agujas del reloj
      y en sentido contrario, y puede estar controlado por señales de alto.
    D: Un círculo de tráfico solo se encuentra en áreas rurales.
  answer: C
  explanation: Un círculo de tráfico se diferencia de una rotonda en que puede tener
    tráfico en el sentido de las agujas del reloj y en sentido contrario, y sus accesos
    pueden estar controlados por señales de alto en lugar de señales de ceda el paso.
- id: 185
  category: defensive_driving
  question: ¿Cuál de los siguientes es un factor que afecta la capacidad de un vehículo
    para detenerse?
  choices:
    A: El color del vehículo
    B: El tipo y estado de los neumáticos
    C: La hora del día
    D: El número de pasajeros en el vehículo
  answer: B
  explanation: Muchos factores afectan la capacidad de un vehículo para detenerse,
    incluyendo el peso del vehículo, el tipo y estado de los frenos y neumáticos,
    la condición física y lo resbaladizo del pavimento, y la pendiente de la carretera.
- id: 186
  category: sharing_the_road
  question: ¿Cuál es el límite de velocidad máximo para un camión con un peso bruto
    vehicular declarado superior a 26,000 libras en una autopista interestatal rural?
  choices:
    A: 55 millas por hora
    B: 60 millas por hora
    C: 65 millas por hora
    D: 70 millas por hora
  answer: C
  explanation: En las autopistas interestatales rurales, los camiones que tienen un
    peso bruto vehicular declarado superior a 26,000 libras no pueden exceder las
    65 millas por hora o el límite de velocidad señalizado.
- id: 187
  category: defensive_driving
  question: Si su vehículo comienza a derrapar y está equipado con un sistema de frenos
    antibloqueo (ABS), ¿qué debe hacer?
  choices:
    A: Bombear los frenos rápidamente
    B: Mantener el pie en el pedal del freno con presión firme y continua
    C: Frenar bruscamente y girar el volante con fuerza
    D: Aplicar el freno de mano inmediatamente
  answer: B
  explanation: Si su vehículo tiene un sistema de frenos antibloqueo (ABS), mantenga
    el pie en el pedal del freno, manteniendo una presión firme y continua, mientras
    gira el volante normalmente. No bombee los frenos.
- id: 188
  category: defensive_driving
  question: ¿Cuál es la técnica de maniobra adecuada si su vehículo se sale de la
    calzada?
  choices:
    A: Girar de vuelta al pavimento inmediatamente
    B: Frenar bruscamente y girar el volante con fuerza
    C: Soltar gradualmente el acelerador y girar de vuelta poco a poco cuando sea
      seguro
    D: Acelerar para recuperar la tracción antes de volver a girar
  answer: C
  explanation: Si su vehículo se sale de la calzada, no intente volver al pavimento
    de inmediato. Suelte gradualmente el pedal del acelerador. Cuando sea seguro hacerlo,
    gire gradualmente de vuelta a la carretera.
- id: 189
  category: vehicle_information
  question: ¿Cómo afecta viajar a 75 millas por hora al consumo de combustible en
    comparación con viajar a 55 millas por hora para automóviles de pasajeros y camionetas
    ligeras?
  choices:
    A: Utiliza aproximadamente un 10 por ciento más de combustible
    B: Utiliza aproximadamente un 25 por ciento más de combustible
    C: Utiliza aproximadamente un 50 por ciento más de combustible
    D: Utiliza aproximadamente un 75 por ciento más de combustible
  answer: C
  explanation: El consumo de combustible aumenta constantemente por encima de las
    45 millas por hora; los automóviles de pasajeros y las camionetas ligeras utilizan
    aproximadamente un 50 por ciento más de combustible al viajar a 75 millas por
    hora que a 55 millas por hora.
- id: 190
  category: vehicle_information
  question: ¿Dónde debe mirar para encontrar la presión de neumáticos recomendada
    (psi) para su vehículo?
  choices:
    A: En la pared lateral del neumático
    B: En una calcomanía dentro del marco de la puerta del conductor o en el manual
      del propietario
    C: En la placa de matrícula del vehículo
    D: En el bloque del motor
  answer: B
  explanation: Compare los psi medidos con los psi que se encuentran en la calcomanía
    dentro de la puerta del conductor de su vehículo o en el manual del propietario;
    NO los compare con los psi que figuran en la pared lateral de su neumático.
- id: 191
  category: vehicle_information
  question: ¿Al usar la prueba de la moneda de un centavo para revisar el desgaste
    de las llantas, qué indica que la banda de rodadura tiene una profundidad legal
    y segura?
  choices:
    A: La cabeza de Lincoln es completamente visible
    B: Cualquier parte de la cabeza de Lincoln está cubierta por la banda de rodadura
    C: La moneda se cae de la ranura
    D: La banda de rodadura tiene exactamente 1/32 de pulgada de profundidad
  answer: B
  explanation: Si cualquier parte de la cabeza de Lincoln está cubierta por la banda
    de rodadura, usted está conduciendo con la cantidad legal y segura de banda de
    rodadura.
- id: 192
  category: safe_driving_rules
  question: Durante el clima invernal, ¿qué áreas de la calzada es probable que se
    congelen antes que otras secciones?
  choices:
    A: Intersecciones y cruces peatonales
    B: Caminos rurales de tierra
    C: Rampas, puentes y pasos elevados
    D: Autopistas de varios carriles
  answer: C
  explanation: Tenga en cuenta que la humedad en las rampas, puentes y pasos elevados
    puede congelarse ocasionalmente antes que otras secciones de la calzada.
- id: 193
  category: defensive_driving
  question: ¿Qué causa que un vehículo experimente hidroplaneo (hydroplaning) en carreteras
    mojadas?
  choices:
    A: Viajar sobre una capa delgada de aceite, suciedad y agua
    B: Conducir con llantas excesivamente infladas
    C: Usar las luces altas en la lluvia
    D: Bombear los frenos con demasiada frecuencia
  answer: A
  explanation: Cuando conduce en carreteras mojadas, su vehículo en realidad viaja
    sobre una capa delgada de aceite, suciedad y agua, lo que puede provocar hidroplaneo.
- id: 194
  category: defensive_driving
  question: ¿Qué debe hacer después de conducir a través de charcos de agua para ayudar
    a secar sus frenos?
  choices:
    A: Acelerar rápidamente
    B: Cambiar a una marcha más baja
    C: Probar sus frenos bombeándolos
    D: Aplicar el freno de estacionamiento durante unos segundos
  answer: C
  explanation: Después de conducir a través de charcos de agua, pruebe sus frenos
    bombeándolos. Hacer esto ayudará a secarlos.
- id: 195
  category: safe_driving_rules
  question: ¿Qué configuración de faros debe usar al conducir en la niebla?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Sin faros, solo señales de emergencia intermitentes
  answer: B
  explanation: No use las luces altas. Las luces bajas iluminan mejor la carretera
    y los objetos que se encuentran adelante.
- id: 196
  category: defensive_driving
  question: ¿Cuál es el curso de acción más seguro si su vehículo se apaga en un área
    inundada?
  choices:
    A: Permanecer en el vehículo y esperar el rescate
    B: Subir las ventanas y cerrar las puertas con llave
    C: Abandonar el vehículo lo antes posible
    D: Intentar arrancar el motor repetidamente
  answer: C
  explanation: Si su automóvil se apaga en un área inundada, abandónelo lo antes posible,
    ya que las aguas de la inundación pueden subir rápidamente y arrastrar un automóvil
    y a sus ocupantes.
- id: 197
  category: defensive_driving
  question: ¿Cómo puede evitar el deslumbramiento de los faros que vienen en sentido
    contrario al conducir de noche?
  choices:
    A: Mirar directamente a los faros del vehículo que se aproxima
    B: Enfocarse en el lado derecho de la carretera
    C: Encender sus luces altas para contrarrestar el deslumbramiento
    D: Cerrar un ojo hasta que pase el vehículo
  answer: B
  explanation: Para evitar el deslumbramiento, no mire directamente a las luces de
    un vehículo que se aproxima y, en su lugar, enfóquese en el lado derecho de la
    carretera.
- id: 198
  category: safe_driving_rules
  question: ¿Cuándo se requiere que los conductores usen sus faros?
  choices:
    A: Solo entre las 10 PM y las 6 AM
    B: Entre la puesta del sol y la salida del sol o cuando la visibilidad es inferior
      a 500 pies
    C: Solo cuando se conduce por caminos rurales sin iluminación
    D: Entre la salida del sol y la puesta del sol o cuando la visibilidad es inferior
      a 1,000 pies
  answer: B
  explanation: Los conductores deben usar los faros entre la puesta del sol y la salida
    del sol, así como en cualquier otro momento en que la visibilidad sea inferior
    a 500 pies.
- id: 199
  category: safe_driving_rules
  question: ¿Cuándo debe usar las luces bajas?
  choices:
    A: A menos de 500 pies de un vehículo que viene en sentido contrario o a 200 pies
      de la parte trasera de otro vehículo
    B: A menos de 1,000 pies de un vehículo que viene en sentido contrario o a 500
      pies de la parte trasera de otro vehículo
    C: A menos de 200 pies de un vehículo que viene en sentido contrario o a 100 pies
      de la parte trasera de otro vehículo
    D: Solo cuando se conduce dentro de los límites de la ciudad
  answer: A
  explanation: Cuando los faros están encendidos, se deben usar las luces bajas al
    acercarse a menos de 500 pies de un vehículo que viene en sentido contrario o
    al seguir a menos de 200 pies de la parte trasera de otro vehículo.
- id: 200
  category: vehicle_information
  question: Según el manual, ¿cuál es el factor más importante para reducir la posibilidad
    de un vuelco?
  choices:
    A: Evitar por completo los caminos rurales
    B: Mantener sus llantas adecuadamente
    C: Conducir un vehículo con un centro de gravedad bajo
    D: Nunca conducir a más de 45 millas por hora
  answer: B
  explanation: Las llantas infladas incorrectamente y desgastadas inhiben su capacidad
    para mantener el control del vehículo, lo cual es el factor más importante para
    reducir la posibilidad de un vuelco.
- id: 201
  category: safe_driving_rules
  question: ¿Cuándo deben los conductores usar sus faros delanteros según la ley de
    Indiana?
  choices:
    A: Entre la puesta del sol y el amanecer o cuando la visibilidad sea inferior
      a 500 pies
    B: Solo cuando se conduce por caminos rurales sin iluminación
    C: Entre las 8:00 p. m. y las 6:00 a. m.
    D: Siempre que se conduzca a velocidades superiores a 55 mph
  answer: A
  explanation: Los conductores deben usar los faros delanteros entre la puesta del
    sol y el amanecer, así como en cualquier otro momento en que la visibilidad sea
    inferior a 500 pies.
- id: 202
  category: safe_driving_rules
  question: Al seguir a otro vehículo, ¿a qué distancia debe bajar las luces de sus
    faros (cambiar a luces bajas)?
  choices:
    A: A menos de 100 pies
    B: A menos de 200 pies
    C: A menos de 300 pies
    D: A menos de 500 pies
  answer: B
  explanation: Se deben usar las luces bajas al acercarse a menos de 500 pies de un
    vehículo que viene en sentido contrario o al seguir a menos de 200 pies de la
    parte trasera de otro vehículo.
- id: 203
  category: alcohol_drugs_health
  question: Los estudios demuestran que pasar 18 horas sin dormir deja a un conductor
    tan incapacitado como a un conductor con ¿qué nivel de contenido de alcohol en
    sangre (BAC)?
  choices:
    A: '.04'
    B: '.06'
    C: '.08'
    D: '.10'
  answer: C
  explanation: Los estudios han demostrado que pasar 18 horas sin dormir deja a un
    conductor tan incapacitado como a un conductor con un contenido de alcohol en
    sangre (BAC) de .08, que es el límite legal de alcohol.
- id: 204
  category: driver_responsibility
  question: ¿Qué grupo de edad tiene el mayor riesgo de sufrir accidentes relacionados
    con la fatiga, representando el 64 por ciento de ellos?
  choices:
    A: 16-29
    B: 30-45
    C: 46-60
    D: 61 años o más
  answer: A
  explanation: Aunque cualquier persona puede cometer el error fatal de conducir sin
    el descanso adecuado, los adultos jóvenes de 16 a 29 años corren el mayor riesgo,
    representando el 64 por ciento de los accidentes relacionados con la fatiga.
- id: 205
  category: safe_driving_rules
  question: ¿Cuál es la única excepción legal para usar un dispositivo de telecomunicaciones
    portátil mientras se opera un vehículo motorizado en Indiana?
  choices:
    A: Consultar un mapa de navegación GPS
    B: Leer un mensaje de texto urgente
    C: Comunicarse con el 911 por una emergencia de buena fe
    D: Hacer una llamada telefónica mientras está detenido en un semáforo en rojo
  answer: C
  explanation: Las únicas excepciones a esta prohibición son cuando la comunicación
    de manos libres está habilitada o si el dispositivo de telecomunicaciones se utiliza
    para comunicarse con el 911 por una emergencia de buena fe.
- id: 206
  category: defensive_driving
  question: Enviar o leer un mensaje de texto quita la vista de la carretera durante
    cinco segundos. A 55 mph, ¿esto equivale a conducir qué distancia con los ojos
    vendados?
  choices:
    A: La longitud de una cancha de baloncesto
    B: La longitud de un campo de fútbol americano completo
    C: Una milla completa
    D: 500 pies
  answer: B
  explanation: Enviar o leer un mensaje de texto quita la vista de la carretera durante
    cinco segundos. A 55 mph, eso es como conducir la longitud de un campo de fútbol
    americano completo con los ojos cerrados.
- id: 207
  category: penalties_and_points
  question: Según la ley de Indiana, una persona incurre en conducción agresiva si
    comete al menos ¿cuántas acciones inseguras específicas durante un episodio de
    conducción continua?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Según la ley de Indiana, una persona incurre en conducción agresiva
    si, durante un episodio de conducción continua de un vehículo, la persona realiza
    o comete al menos tres de las siguientes [acciones inseguras].
- id: 208
  category: defensive_driving
  question: ¿Por qué es más difícil detenerse y girar en carreteras de grava suelta?
  choices:
    A: Los caminos de grava suelen ser más anchos que los pavimentados
    B: Su tracción se reduce, lo que puede provocar derrapes
    C: Los caminos de grava siempre tienen límites de velocidad más altos
    D: El polvo bloquea completamente la vista de la carretera
  answer: B
  explanation: Detenerse y girar es más difícil en grava suelta porque se reduce la
    tracción. Cuando se reduce la tracción, pueden producirse derrapes.
- id: 209
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de acercarse a la cima de una colina empinada en
    un camino rural?
  choices:
    A: Acelerar para mantener el impulso
    B: Moverse al lado izquierdo de la carretera
    C: Tocar la bocina continuamente
    D: Reducir la velocidad, moverse al lado derecho de la carretera y estar atento
      a los vehículos que vienen en sentido contrario
  answer: D
  explanation: Antes de acercarse a la cima de una colina empinada, reduzca la velocidad,
    muévase al lado derecho de la carretera y esté atento a los vehículos que vienen
    en sentido contrario.
- id: 210
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de la salida prevista en una autopista interestatal?
  choices:
    A: Detenerse y retroceder con cuidado por el arcén
    B: Dar una vuelta en U a través de la mediana
    C: Conducir hasta la siguiente salida
    D: Detenerse en el carril derecho y esperar a que el tráfico se despeje antes
      de retroceder
  answer: C
  explanation: No es seguro retroceder en una autopista interestatal para llegar a
    una salida que se pasó. Si se pasa una salida, debe conducir hasta la siguiente.
- id: 211
  category: sharing_the_road
  question: ¿En una carretera interestatal con tres o más carriles en una dirección,
    por dónde tienen restringido circular los camiones?
  choices:
    A: Los dos carriles de la izquierda
    B: Solo el carril central
    C: Los dos carriles de la derecha
    D: Cualquier carril que elijan
  answer: C
  explanation: Los camiones tienen restringido el paso al carril derecho en tramos
    de la interestatal con dos carriles en una dirección y a los dos carriles de la
    derecha en la interestatal con tres carriles o más en una dirección.
- id: 212
  category: signs_and_signals
  question: ¿Qué significa un panel de flechas intermitentes en una zona de obras
    que NO indica una dirección?
  choices:
    A: Debe moverse inmediatamente al carril izquierdo
    B: Debe moverse inmediatamente al carril derecho
    C: Es una señal para tener precaución, pero no requiere moverse a otro carril
    D: La carretera está completamente cerrada más adelante
  answer: C
  explanation: Un panel de flechas intermitentes que no indica una dirección en ningún
    sentido es una señal para tener precaución, pero no requiere que el conductor
    se mueva a otro carril.
- id: 213
  category: signs_and_signals
  question: ¿Qué debe hacer cuando un señalero en una zona de obras extiende una bandera
    naranja/roja fluorescente en posición horizontal hacia la línea de tráfico?
  choices:
    A: Continuar a su velocidad actual
    B: Detenerse
    C: Moverse al carril izquierdo
    D: Tocar la bocina y avanzar lentamente
  answer: B
  explanation: Debe detenerse cuando un señalero extiende una bandera naranja/roja
    fluorescente en posición horizontal hacia la línea de tráfico.
- id: 214
  category: safe_driving_rules
  question: ¿A qué distancia deben detenerse ciertos vehículos, como los autobuses
    escolares, del riel más cercano en un cruce de ferrocarril?
  choices:
    A: No a menos de 10 pies ni a más de 30 pies
    B: No a menos de 15 pies ni a más de 50 pies
    C: No a menos de 20 pies ni a más de 100 pies
    D: Exactamente 25 pies
  answer: B
  explanation: La ley exige que algunos vehículos se detengan siempre en los cruces
    de ferrocarril a una distancia no menor de 15 pies ni mayor de 50 pies del riel
    más cercano.
- id: 215
  category: signs_and_signals
  question: ¿Cómo debe tratar una señal de cruce de ferrocarril (crossbuck) cuando
    se presenta sola?
  choices:
    A: Como una señal de pare (stop)
    B: Como una señal de ceda el paso (yield)
    C: Como una señal de límite de velocidad
    D: Como una advertencia de calle sin salida
  answer: B
  explanation: Cuando se presenta sola, debe tratar una señal de cruce de ferrocarril
    como una señal de ceda el paso, y la decisión de detenerse o cruzar las vías es
    suya.
- id: 216
  category: signs_and_signals
  question: ¿Qué debe hacer cuando se acerca a un cruce de ferrocarril que tiene una
    señal de cruce (crossbuck) sola?
  choices:
    A: Detenerse por completo independientemente de si se acerca un tren.
    B: Tratarla como una señal de ceda el paso y detenerse si se acerca un tren.
    C: Acelerar para despejar las vías lo más rápido posible.
    D: Tocar la bocina y continuar sin reducir la velocidad.
  answer: B
  explanation: Cuando se presenta sola, debe tratar una señal de cruce de ferrocarril
    como una señal de ceda el paso y la decisión de detenerse o cruzar las vías es
    suya. Debe detenerse si se aproxima un tren.
- id: 217
  category: safe_driving_rules
  question: ¿Cuáles de los siguientes vehículos están obligados a detenerse en todos
    los cruces de ferrocarril?
  choices:
    A: Todos los vehículos que transportan pasajeros por contrato
    B: Todas las camionetas pickup
    C: Todos los automóviles de pasajeros
    D: Todas las motocicletas
  answer: A
  explanation: Los vehículos obligados a detenerse en todos los cruces de ferrocarril
    incluyen todos los vehículos que transportan pasajeros por contrato, todos los
    autobuses escolares y todos los vehículos que transportan explosivos o líquidos
    inflamables.
- id: 218
  category: safe_driving_rules
  question: ¿A cuántos pies de un cruce de ferrocarril es ilegal adelantar a otro
    vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: 'El manual establece: No adelante a otro vehículo a menos de 100 pies
    de un cruce de ferrocarril.'
- id: 219
  category: defensive_driving
  question: Si su vehículo se queda atascado en las vías del tren y se acerca un tren,
    ¿en qué dirección debe correr después de evacuar?
  choices:
    A: En un ángulo de 45 grados alejándose de las vías en la dirección del tren que
      se aproxima
    B: Directamente por las vías alejándose del tren
    C: En un ángulo de 90 grados directamente lejos de las vías
    D: En un ángulo de 45 grados alejándose de las vías en la misma dirección en la
      que viaja el tren
  answer: A
  explanation: En caso de que se quede atascado en las vías, debe evacuar el área
    y correr en un ángulo de 45 grados alejándose de las vías en la dirección del
    tren que se aproxima.
- id: 220
  category: safe_driving_rules
  question: Una vez que las luces del cruce de vías comienzan a parpadear y la barrera
    comienza a bajar, ¿de cuánto tiempo dispone aproximadamente para escapar del cruce?
  choices:
    A: 10 segundos
    B: 20 segundos
    C: 30 segundos
    D: 45 segundos
  answer: B
  explanation: Una vez que las luces del cruce de vías comienzan a parpadear y la
    barrera comienza a bajar, tiene aproximadamente 20 segundos para escapar del cruce.
- id: 221
  category: vehicle_information
  question: ¿Cuál es la altura máxima de cualquier vehículo que puede operarse sin
    un permiso especial en Indiana?
  choices:
    A: 12 pies, 6 pulgadas
    B: 13 pies, 6 pulgadas
    C: 14 pies
    D: 14 pies, 6 pulgadas
  answer: B
  explanation: La altura máxima de cualquier vehículo que puede operarse sin un permiso
    especial es de 13 pies y 6 pulgadas.
- id: 222
  category: sharing_the_road
  question: Aproximadamente, ¿cuántos pies le toma a un camión con remolque (tractor-trailer)
    totalmente cargado y con los frenos calientes detenerse por completo cuando viaja
    a 55 millas por hora?
  choices:
    A: De 130 a 140 pies
    B: 200 pies
    C: 300 pies
    D: Más de 400 pies
  answer: D
  explanation: Un camión con remolque totalmente cargado con los frenos calientes
    puede tardar más de 400 pies en detenerse por completo, lo cual es más de la longitud
    de un campo de fútbol americano.
- id: 223
  category: sharing_the_road
  question: ¿Hasta qué distancia detrás de un camión con remolque puede extenderse
    su punto ciego trasero?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 150 pies
    D: Hasta 200 pies
  answer: D
  explanation: Los puntos ciegos para el conductor de un camión con remolque se extienden
    hasta 20 pies frente a la cabina, a ambos lados del remolque, junto a la cabina
    y hasta 200 pies detrás del vehículo.
- id: 224
  category: sharing_the_road
  question: ¿Por qué los camiones con remolque a menudo permanecen en el carril central
    en las autopistas de varios carriles?
  choices:
    A: Para conducir más rápido que el límite de velocidad establecido.
    B: Para ayudar al flujo del tráfico local que entra y sale de la autopista y aumentar
      las opciones para evitar situaciones peligrosas.
    C: Porque es ilegal que conduzcan en el carril derecho.
    D: Para evitar que los automóviles de pasajeros los rebasen.
  answer: B
  explanation: En las autopistas de varios carriles, los camiones con remolque permanecen
    en el carril central para ayudar al flujo del tráfico local que entra y sale de
    la autopista. Permanecer en el carril central también aumenta las opciones del
    conductor del camión si tiene que cambiar de carril para evitar una situación
    peligrosa.
- id: 225
  category: sharing_the_road
  question: Al rebasar un camión con remolque, ¿por qué lado debe hacerlo?
  choices:
    A: Siempre por el lado izquierdo
    B: Siempre por el lado derecho
    C: Por el lado que tenga menos tráfico
    D: Nunca se debe rebasar a un camión con remolque
  answer: A
  explanation: Siempre rebase un camión con remolque por completo y siempre por el
    lado izquierdo. Demorarse al rebasar hace que sea imposible para el conductor
    del camión realizar una maniobra evasiva.
- id: 226
  category: safe_driving_rules
  question: Según la Ley de Ceder el Paso (Move Over Law) de Indiana, ¿qué debe hacer
    si no puede cambiarse a otro carril al acercarse a un vehículo de emergencia con
    luces intermitentes?
  choices:
    A: Mantener su velocidad y proceder con precaución.
    B: Reducir su velocidad a 10 mph por debajo del límite establecido y proceder
      con precaución.
    C: Detenerse inmediatamente en su carril.
    D: Acelerar para rebasar el vehículo de emergencia rápidamente.
  answer: B
  explanation: Si no puede cambiarse de carril, los automovilistas deben reducir su
    velocidad a 10 mph por debajo del límite establecido y proceder con precaución.
- id: 227
  category: penalties_and_points
  question: 'El incumplimiento de la Ley de Ceder el Paso (Move Over Law) de Indiana
    se considera una:'
  choices:
    A: Delito menor de Clase A (Class A Misdemeanor)
    B: Infracción de Clase B (Class B Infraction)
    C: Infracción de Clase A (Class A Infraction)
    D: Delito grave (Felony)
  answer: C
  explanation: Los automovilistas que se acerquen a un vehículo de emergencia que
    muestre luces intermitentes alternas deben cambiar de carril o reducir la velocidad.
    El incumplimiento es una Infracción de Clase A.
- id: 228
  category: defensive_driving
  question: Si su vehículo queda averiado en un cruce de ferrocarril y no se aproxima
    ningún tren, ¿qué es lo primero que debe hacer?
  choices:
    A: Llamar a una grúa.
    B: Intentar empujar el vehículo fuera de las vías usted mismo.
    C: Llamar inmediatamente al Sistema de Notificación de Emergencia (ENS) usando
      el número que aparece en la señal azul.
    D: Hacer señas a un automovilista que pase.
  answer: C
  explanation: Si su vehículo queda averiado en el cruce y no se aproxima ningún tren,
    llame inmediatamente al Sistema de Notificación de Emergencia (ENS). El número
    de teléfono se encuentra en la señal azul fijada en la barrera del cruce de la
    vía férrea.
- id: 229
  category: sharing_the_road
  question: Cuando un camión con remolque está haciendo un giro cerrado, ¿qué debe
    esperar usted?
  choices:
    A: Las ruedas traseras seguirán una trayectoria más amplia que las delanteras.
    B: El conductor puede abrirse hacia afuera como primer paso para realizar el giro.
    C: El vehículo siempre girará desde el carril central.
    D: El remolque se detendrá por completo antes de girar.
  answer: B
  explanation: En cualquier vehículo que gira, las ruedas traseras siguen una trayectoria
    más corta que las delanteras. Los conductores de camiones con remolque a menudo
    se abren hacia afuera como primer paso para realizar un giro cerrado.
- id: 230
  category: safe_driving_rules
  question: ¿Qué debe evitar hacer mientras conduce a través de las vías del tren?
  choices:
    A: Mirar hacia ambos lados
    B: Detenerse o cambiar de marcha
    C: Encender sus faros delanteros
    D: Usar sus limpiaparabrisas
  answer: B
  explanation: Evite detenerse o cambiar de marcha mientras cruza las vías del tren.
    Un conductor nunca debe comenzar a cruzar las vías del tren a menos que pueda
    despejarlas por completo sin detenerse.
- id: 231
  category: penalties_and_points
  question: ¿Cuál es la sanción por no hacerse a un lado o no reducir la velocidad
    ante un vehículo de emergencia autorizado?
  choices:
    A: Infracción de Clase A
    B: Infracción de Clase B
    C: Delito menor de Clase A
    D: Felonía de Nivel 6
  answer: A
  explanation: Según el manual, si un automovilista no puede cambiarse de carril para
    alejarse de un vehículo de emergencia autorizado, debe reducir su velocidad a
    10 mph por debajo del límite de velocidad señalizado. El incumplimiento de esta
    norma es una Infracción de Clase A.
- id: 232
  category: safe_driving_rules
  question: Si no puede cambiar de carril para alejarse de un vehículo autorizado
    estacionado con luces ámbar intermitentes, ¿qué acción debe tomar?
  choices:
    A: Detenerse por completo y esperar a que el vehículo se mueva
    B: Reducir su velocidad a 10 mph por debajo del límite de velocidad señalizado
      y proceder con precaución
    C: Reducir su velocidad a 15 mph y proceder con precaución
    D: Mantener su velocidad pero tocar la bocina para alertar a los trabajadores
  answer: B
  explanation: El manual establece que si no puede cambiarse de carril para alejarse
    de un vehículo autorizado estacionado con luces ámbar intermitentes, deberá reducir
    su velocidad a 10 mph por debajo del límite de velocidad señalizado y proceder
    con precaución.
- id: 233
  category: safe_driving_rules
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar con luces
    rojas intermitentes y un brazo de parada extendido?
  choices:
    A: Cuando viaja en la dirección opuesta en una calzada dividida por una barrera
      o una mediana no pavimentada
    B: Cuando viaja en una carretera de dos carriles en la dirección opuesta
    C: Cuando viaja en la misma dirección que el autobús en una carretera dividida
    D: Cuando el autobús escolar está detenido en un cruce de ferrocarril
  answer: A
  explanation: Si conduce por una calzada dividida por una barrera o una mediana no
    pavimentada, solo está obligado a detenerse si viaja en la misma dirección que
    el autobús escolar.
- id: 234
  category: penalties_and_points
  question: ¿Cuál es la sanción por ignorar el brazo de parada de un autobús escolar
    si la infracción resulta en lesiones corporales?
  choices:
    A: Infracción de Clase A
    B: Infracción de Clase B
    C: Delito menor de Clase A
    D: Felonía de Nivel 6
  answer: D
  explanation: Ignorar el brazo de parada de un autobús escolar puede resultar en
    un delito menor de Clase A, pero se convierte en una felonía de Nivel 6 si la
    infracción resulta en lesiones corporales.
- id: 235
  category: sharing_the_road
  question: ¿Cuánta distancia de seguimiento debe dejar cuando conduce detrás de una
    motocicleta?
  choices:
    A: Uno o dos segundos
    B: Al menos tres o cuatro segundos
    C: Cinco o seis segundos
    D: La longitud de un automóvil por cada 10 mph
  answer: B
  explanation: El manual aconseja dejar al menos tres o cuatro segundos al seguir
    a una motocicleta para que el motociclista tenga tiempo suficiente para maniobrar
    o detenerse en caso de emergencia.
- id: 236
  category: sharing_the_road
  question: ¿Por qué debe esperar a estar seguro de que un motociclista va a girar
    antes de avanzar, incluso si su luz de giro está parpadeando?
  choices:
    A: Las motocicletas suelen tener un cableado defectuoso que provoca parpadeos
      aleatorios
    B: Las luces de giro de las motocicletas no suelen cancelarse automáticamente
      y los conductores a veces olvidan apagarlas
    C: Los motociclistas cambian de opinión con frecuencia sobre el giro
    D: La ley exige un tiempo de espera obligatorio de cinco segundos antes de avanzar
  answer: B
  explanation: No asuma que una luz de giro intermitente en una motocicleta significa
    que el giro se realizará pronto, ya que estos vehículos tienen señales que generalmente
    no se cancelan solas y los conductores a veces olvidan apagarlas.
- id: 237
  category: sharing_the_road
  question: ¿Cuál es el espacio mínimo de seguridad que un conductor debe dejar al
    adelantar a un ciclista?
  choices:
    A: Un pie
    B: Dos pies
    C: Tres pies
    D: Cinco pies
  answer: C
  explanation: Los conductores pueden adelantar a un ciclista cuando haya una cantidad
    segura de espacio al lado del ciclista, que es un mínimo de tres pies.
- id: 238
  category: sharing_the_road
  question: ¿Cuál es la regla general con respecto a los ciclistas que circulan en
    paralelo en las calzadas?
  choices:
    A: Siempre deben circular en fila india
    B: Pueden circular hasta tres en paralelo
    C: No pueden circular más de dos en paralelo, excepto en carriles exclusivos para
      bicicletas
    D: Pueden circular tantos en paralelo como lo permita el ancho del carril
  answer: C
  explanation: Los ciclistas no pueden circular más de dos (2) en paralelo, excepto
    en senderos o partes de calzadas reservadas para el uso exclusivo de bicicletas.
- id: 239
  category: sharing_the_road
  question: ¿Cuándo se le permite a un conductor cruzar un sendero o carril para bicicletas?
  choices:
    A: Al prepararse para un giro con 100 pies de antelación
    B: Al adelantar a un vehículo motorizado más lento
    C: Solo al girar o al entrar o salir de un callejón, entrada para autos o camino
      privado
    D: Siempre que el carril para bicicletas esté libre de ciclistas
  answer: C
  explanation: Los conductores pueden cruzar un sendero o carril para bicicletas solo
    al girar o al entrar o salir de un callejón, entrada para autos o camino privado.
- id: 240
  category: signs_and_signals
  question: ¿Cuál es el propósito de las marcas 'Sharrow' en el pavimento?
  choices:
    A: Indicar un carril exclusivo para bicicletas
    B: Advertir a los conductores de un próximo cruce de peatones
    C: Ayudar a los ciclistas a posicionarse lejos de los autos estacionados y alertar
      a los conductores para que esperen ciclistas
    D: Marcar un área de estacionamiento designada para bicicletas
  answer: C
  explanation: Las marcas Sharrow (flechas de carril compartido) tienen como objetivo
    ayudar a los ciclistas a posicionarse lejos de los autos estacionados y alertar
    a otros usuarios de la vía para que esperen que los ciclistas ocupen los carriles
    de circulación.
- id: 241
  category: signs_and_signals
  question: ¿Qué indica el pavimento de color rojo en una calzada?
  choices:
    A: Un carril designado para bicicletas
    B: Un carril designado para autobuses, taxis u otros modos de transporte público
    C: Una zona donde está prohibido estacionar
    D: Una señal de alto o un semáforo más adelante
  answer: B
  explanation: El pavimento de color rojo puede utilizarse para mejorar la visibilidad
    de los carriles de autobuses o de tránsito que están designados para autobuses,
    taxis u otros modos de transporte público.
- id: 242
  category: safe_driving_rules
  question: Si un oficial de la ley está dirigiendo el tráfico en una intersección
    y da una orden que contradice una señal de tráfico en verde, ¿qué debe hacer usted?
  choices:
    A: Seguir la señal de tráfico
    B: Obedecer la orden del oficial de la ley
    C: Esperar hasta que la señal de tráfico se ponga en rojo antes de avanzar
    D: Tocar la bocina para alertar al oficial que tiene la luz verde
  answer: B
  explanation: La orden de un oficial de la ley puede ser diferente de una señal o
    semáforo de tráfico. En tal caso, la orden del oficial de la ley es la que debe
    obedecerse.
- id: 243
  category: safe_driving_rules
  question: Al comenzar a estacionar en paralelo, ¿a qué distancia debe colocar su
    vehículo del vehículo estacionado delante del espacio vacío?
  choices:
    A: Al menos un pie
    B: Al menos dos pies
    C: Al menos tres pies
    D: Al menos cuatro pies
  answer: B
  explanation: Al estacionar en paralelo, debe colocar su vehículo de forma paralela
    al vehículo estacionado delante del espacio vacío y mantener al menos dos pies
    de distancia de este vehículo.
- id: 244
  category: penalties_and_points
  question: ¿Cuál es la sanción por no cambiarse de carril o no reducir la velocidad
    adecuadamente ante un vehículo detenido y averiado con luces de advertencia de
    peligro intermitentes?
  choices:
    A: Infracción de Clase A
    B: Infracción de Clase B
    C: Infracción de Clase C
    D: Delito menor de Clase A
  answer: B
  explanation: Los automovilistas que se aproximen a un vehículo detenido y averiado
    con luces de advertencia de peligro intermitentes deben cambiarse de carril o
    reducir la velocidad a 10 mph por debajo del límite. No hacerlo es una infracción
    de Clase B.
- id: 245
  category: sharing_the_road
  question: ¿Está obligado un ciclista a circular por un carril para bicicletas designado
    si hay uno disponible?
  choices:
    A: Sí, siempre deben usar el carril para bicicletas
    B: Sí, a menos que el carril para bicicletas esté bloqueado por escombros
    C: No, tienen derecho a utilizar tanto el carril para bicicletas como el carril
      de circulación
    D: No, pero solo si viajan a más de 15 mph
  answer: C
  explanation: Un ciclista no está obligado a circular por un carril para bicicletas
    designado porque tiene derecho a utilizar tanto el carril para bicicletas como
    el carril de circulación.
- id: 246
  category: safe_driving_rules
  question: ¿Hacia dónde debe girar las ruedas de su vehículo al estacionar cuesta
    abajo?
  choices:
    A: En dirección contraria al bordillo
    B: Hacia el bordillo
    C: Paralelas al bordillo
    D: Hacia la calle
  answer: B
  explanation: Cuando estacione cuesta abajo, gire las ruedas de su vehículo hacia
    el bordillo.
- id: 247
  category: safe_driving_rules
  question: Si está estacionando cuesta arriba y no hay bordillo, ¿hacia qué lado
    debe girar las ruedas?
  choices:
    A: Hacia la calle
    B: Paralelas a la calle
    C: En dirección contraria a la calle
    D: Hacia adelante
  answer: C
  explanation: Si no hay bordillo, gire las ruedas de su vehículo en dirección contraria
    a la calle cuando estacione cuesta arriba.
- id: 248
  category: safe_driving_rules
  question: ¿Cuál es la técnica adecuada para dar marcha atrás con un vehículo?
  choices:
    A: Confiar totalmente en su espejo retrovisor
    B: Girar el cuerpo hacia la izquierda para mirar por la ventana lateral
    C: Girar el cuerpo hacia la derecha para mirar a través de la ventana trasera
    D: Usar solo los espejos laterales
  answer: C
  explanation: Para dar marcha atrás, gire el cuerpo hacia la derecha para mirar a
    través de la ventana trasera. Nunca use solo el espejo retrovisor para dar marcha
    atrás.
- id: 249
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una zona de estacionamiento ilegal?
  choices:
    A: A menos de 15 pies de un hidrante de incendios
    B: A menos de 25 pies de un hidrante de incendios
    C: A menos de 50 pies de un cruce de ferrocarril
    D: Junto a un bordillo blanco
  answer: A
  explanation: Está prohibido estacionar a menos de 15 pies de un hidrante de incendios
    o en carriles de bomberos.
- id: 250
  category: sharing_the_road
  question: ¿Qué ayudas para el desplazamiento suelen indicar que un peatón tiene
    una discapacidad visual?
  choices:
    A: Una chaqueta amarilla o un chaleco reflectante
    B: Un bastón blanco o un perro guía entrenado
    C: Un bastón rojo o una silla de ruedas motorizada
    D: Una luz intermitente o un andador
  answer: B
  explanation: Las ayudas para el desplazamiento de una persona con discapacidad visual
    suelen ser un bastón blanco o un perro guía entrenado.
- id: 251
  category: vehicle_information
  question: ¿En qué porcentaje aumentan los cinturones de seguridad las probabilidades
    de supervivencia de los conductores y los pasajeros del asiento delantero?
  choices:
    A: 25 por ciento
    B: 35 por ciento
    C: 45 por ciento
    D: 50 por ciento
  answer: C
  explanation: Cuando se usan, los cinturones de seguridad para conductores y pasajeros
    del asiento delantero aumentan las probabilidades de supervivencia en un 45 por
    ciento.
- id: 252
  category: safe_driving_rules
  question: ¿Cómo debe posicionarse un conductor en relación con el volante para maximizar
    la seguridad?
  choices:
    A: Al menos a 6 pulgadas de distancia
    B: Al menos a 10 pulgadas de distancia
    C: Al menos a 12 pulgadas de distancia
    D: Tan cerca como sea cómodamente posible
  answer: C
  explanation: Para maximizar la seguridad, el conductor debe sentarse al menos a
    12 pulgadas de distancia del volante.
- id: 253
  category: safe_driving_rules
  question: ¿Cuál de las siguientes personas está exenta de usar el cinturón de seguridad?
  choices:
    A: Un pasajero en el asiento trasero de un automóvil de pasajeros
    B: Un conductor de un vehículo comercial en un viaje de larga distancia
    C: Un repartidor de periódicos en ruta motorizada que se detiene para realizar
      entregas
    D: Un adolescente que conduce a la escuela
  answer: C
  explanation: Un repartidor de periódicos en ruta motorizada o un transportista de
    paquetes de periódicos que se detiene para realizar entregas desde un vehículo
    está exento de usar el cinturón de seguridad.
- id: 254
  category: driver_responsibility
  question: Según la ley de Indiana, ¿los pasajeros menores de qué edad deben estar
    debidamente asegurados en un sistema de retención infantil?
  choices:
    A: Seis años de edad
    B: Siete años de edad
    C: Ocho años de edad
    D: Diez años de edad
  answer: C
  explanation: La ley exige que los pasajeros menores de ocho años de edad estén debidamente
    asegurados en un sistema de retención infantil, como un asiento de seguridad para
    niños o un asiento elevado (booster seat).
- id: 255
  category: vehicle_information
  question: Si un automóvil está equipado con una bolsa de aire (air bag) en el lado
    del pasajero, ¿el Consejo Nacional de Seguridad recomienda colocar a los niños
    menores de qué edad en el asiento trasero?
  choices:
    A: 8 años de edad
    B: 10 años de edad
    C: 12 años de edad
    D: 14 años de edad
  answer: C
  explanation: Si un automóvil está equipado con una bolsa de aire en el lado del
    pasajero, el Consejo Nacional de Seguridad recomienda colocar a los niños menores
    de 12 años de edad en el asiento trasero.
- id: 256
  category: vehicle_information
  question: Si la carga de un vehículo se extiende más de cuatro pies más allá de
    la parte trasera del vehículo entre el amanecer y el atardecer, ¿qué se debe montar
    en el extremo posterior?
  choices:
    A: Una lámpara roja visible desde 500 pies
    B: Una bandera roja de no menos de 12 pulgadas cuadradas
    C: Dos luces amarillas intermitentes
    D: Un letrero de "Carga ancha" (Wide Load)
  answer: B
  explanation: Entre el amanecer y el atardecer, se debe montar una bandera roja en
    el extremo posterior de la carga del vehículo. La bandera roja no debe tener menos
    de 12 pulgadas cuadradas.
- id: 257
  category: defensive_driving
  question: Si su automóvil queda inhabilitado durante el día, ¿dónde debe colocar
    dos banderas rojas?
  choices:
    A: 50 pies delante y 50 pies detrás del automóvil
    B: 100 pies delante y 100 pies detrás del automóvil
    C: 200 pies delante y 200 pies detrás del automóvil
    D: En el techo y el maletero del automóvil
  answer: B
  explanation: 'Durante el día, los conductores de automóviles inhabilitados deben
    colocar dos banderas rojas: una aproximadamente a 100 pies delante del automóvil
    y la otra aproximadamente a 100 pies detrás de este.'
- id: 258
  category: defensive_driving
  question: Si su automóvil se detiene a menos de 500 pies de una curva o la cima
    de una colina, ¿a qué distancia se debe colocar un dispositivo de advertencia?
  choices:
    A: Al menos a 100 pies de su automóvil
    B: Al menos a 200 pies de su automóvil
    C: Al menos a 300 pies de su automóvil
    D: Al menos a 500 pies de su automóvil
  answer: D
  explanation: Si su automóvil se detiene a menos de 500 pies de una curva, la cima
    de una colina u otra obstrucción, se debe colocar un dispositivo de advertencia
    al menos a 500 pies de su automóvil.
- id: 259
  category: safe_driving_rules
  question: ¿Cómo se deben usar los cinturones de seguridad en el cuerpo para maximizar
    la seguridad?
  choices:
    A: Altos sobre el estómago y debajo del brazo
    B: Bajos sobre las caderas y planos sobre la clavícula
    C: Holgados sobre la cintura y el cuello
    D: Altos sobre las caderas y a través del pecho
  answer: B
  explanation: Todos deben usar sus cinturones de seguridad bajos sobre las caderas
    y planos sobre la clavícula.
- id: 260
  category: safe_driving_rules
  question: Si su vehículo queda inhabilitado en una carretera dividida, ¿a qué distancia
    de su vehículo se debe colocar un dispositivo de advertencia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Según el manual, si su vehículo queda inhabilitado en una carretera
    dividida, el dispositivo de advertencia de emergencia debe colocarse a 200 pies
    de su vehículo.
- id: 261
  category: defensive_driving
  question: ¿Cuál es el factor más común en todas las colisiones en Indiana?
  choices:
    A: Exceso de velocidad
    B: Conducir bajo la influencia
    C: No ceder el paso
    D: Conducción distraída
  answer: C
  explanation: El manual establece que, entre todas las colisiones en Indiana, no
    ceder el paso es el factor más común.
- id: 262
  category: driver_responsibility
  question: ¿Bajo qué condición NO debe retirar su vehículo de la carretera después
    de un accidente?
  choices:
    A: Si el accidente ocurre durante las horas pico de tráfico
    B: Si el accidente involucra el transporte de materiales peligrosos
    C: Si el vehículo tiene un neumático desinflado
    D: Si el otro conductor se niega a mover su vehículo
  answer: B
  explanation: El conductor no debe mover el vehículo motorizado si el accidente involucra
    el transporte de materiales peligrosos o resulta en lesiones, muerte o atrapamiento.
- id: 263
  category: driver_responsibility
  question: ¿Qué debe hacer si choca con un vehículo desatendido y no puede localizar
    al propietario?
  choices:
    A: Dejar una nota en el parabrisas y marcharse
    B: Llamar a una grúa para que retire el vehículo
    C: Llamar a una agencia del orden público para proporcionar información
    D: Esperar en la escena exactamente una hora antes de irse
  answer: C
  explanation: Si la colisión fue con un vehículo desatendido y no se puede localizar
    al propietario, debe llamar a una agencia del orden público para proporcionar
    información.
- id: 264
  category: license_system
  question: Después de un accidente, ¿qué documento debe presentar electrónicamente
    su proveedor de seguros ante el BMV para demostrar responsabilidad financiera?
  choices:
    A: Certificado de Cumplimiento (COC)
    B: Prueba de Responsabilidad Civil (POL)
    C: Formulario de Informe de Accidente (ARF)
    D: Certificado de Registro del Vehículo (VRC)
  answer: A
  explanation: Su proveedor de seguros debe presentar electrónicamente la prueba de
    responsabilidad financiera en forma de un Certificado de Cumplimiento (COC).
- id: 265
  category: defensive_driving
  question: Si una colisión es inevitable, ¿cuál de las siguientes es la opción más
    segura para minimizar el impacto?
  choices:
    A: Chocar contra algo duro en lugar de algo que ceda
    B: Chocar contra algo que se mueve en dirección opuesta
    C: Chocar contra algo que no se mueve en lugar de algo que se mueve en la misma
      dirección
    D: Chocar contra algo que se mueve en su misma dirección en lugar de algo que
      no se mueve
  answer: D
  explanation: El manual aconseja chocar contra algo que se mueva en su misma dirección
    en lugar de algo que no se mueva, y elegir chocar contra algo que ceda al impacto.
- id: 266
  category: safe_driving_rules
  question: ¿Cuál es la acción correcta a tomar si las ruedas de su vehículo se desvían
    hacia el arcén (shoulder) de la carretera?
  choices:
    A: Girar el volante bruscamente hacia el pavimento
    B: Pisar los frenos a fondo para detenerse inmediatamente
    C: Conducir por el arcén, soltar el pedal del acelerador y volver a la carretera
      gradualmente
    D: Acelerar para incorporarse de forma segura al tráfico
  answer: C
  explanation: Si sus ruedas se desvían hacia el arcén, no intente volver de inmediato.
    En su lugar, conduzca por el arcén y suelte el pedal del acelerador. Después de
    reducir la velocidad, vuelva a la carretera gradualmente.
- id: 267
  category: defensive_driving
  question: ¿Por qué NO debe intentar abrir una puerta si su vehículo cae al agua?
  choices:
    A: Causará un cortocircuito inmediato en el sistema eléctrico
    B: El peso del agua lo hará casi imposible y el agua inundará el compartimiento
      de pasajeros
    C: Los seguros de las puertas se atascarán automáticamente
    D: Hará que el vehículo se hunda instantáneamente
  answer: B
  explanation: El peso del agua hará que sea casi imposible abrir una puerta y el
    agua inundará el compartimiento de pasajeros a través de una puerta abierta.
- id: 268
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes comportamientos es una señal de que un conductor
    puede estar bajo los efectos de sustancias (impaired)?
  choices:
    A: Conducir ligeramente por debajo del límite de velocidad bajo lluvia intensa
    B: Hacer giros amplios y circular sobre la línea central
    C: Usar las luces direccionales constantemente
    D: Conducir con las luces delanteras encendidas durante el día
  answer: B
  explanation: Un conductor puede estar bajo los efectos de sustancias si el vehículo
    realiza giros amplios, circula sobre la línea central, zigzaguea o muestra otros
    comportamientos erráticos.
- id: 269
  category: safe_driving_rules
  question: Si debe salir de su vehículo mientras está en el arcén de la carretera
    durante una emergencia, ¿cómo debe hacerlo?
  choices:
    A: Salir por el lado del conductor lo más rápido posible
    B: Salir por el lado del pasajero después de revisar los alrededores inmediatos
    C: Salir por el techo corredizo para mantenerse visible
    D: Esperar a que llegue un oficial de policía para abrir la puerta
  answer: B
  explanation: Si debe salir del vehículo mientras está en el arcén de la carretera,
    salga por el lado del pasajero y solo después de revisar sus alrededores inmediatos
    en busca de otros vehículos motorizados u obstrucciones.
- id: 270
  category: vehicle_information
  question: ¿Qué debe hacer si experimenta el reventón de un neumático mientras conduce?
  choices:
    A: Pisar los frenos con firmeza e inmediatamente
    B: Girar el volante bruscamente hacia la derecha
    C: Sujetar el volante con firmeza, retirar el pie del pedal del acelerador y no
      aplicar los frenos
    D: Poner en punto muerto y bombear los frenos
  answer: C
  explanation: En caso de reventón de un neumático, sujete el volante con firmeza
    y mantenga el automóvil recto. Reduzca la velocidad gradualmente, retire el pie
    del pedal del acelerador, pero no aplique los frenos hasta que esté casi detenido.
- id: 271
  category: vehicle_information
  question: ¿Qué es lo primero que debe hacer si los frenos convencionales de disco
    o de tambor de su vehículo fallan repentinamente?
  choices:
    A: Cambiar a una marcha más baja y bombear el pedal del freno rápida y fuertemente
    B: Apagar el encendido inmediatamente
    C: Tirar del freno de mano con la mayor fuerza posible
    D: Dirigirse hacia la zanja más cercana
  answer: A
  explanation: Si sus frenos fallan repentinamente, debe cambiar a una marcha más
    baja, si es posible, y bombear el pedal del freno rápida y fuertemente varias
    veces para aumentar la presión de los frenos.
- id: 272
  category: safe_driving_rules
  question: Si su vehículo queda averiado a menos de 500 pies de una curva o la cima
    de una colina donde la vista de un conductor pueda estar bloqueada, ¿dónde debe
    colocar el dispositivo de advertencia de emergencia?
  choices:
    A: A 100 pies de su vehículo
    B: A 200 pies de su vehículo
    C: Al menos a 500 pies de su vehículo
    D: Directamente en el techo de su vehículo
  answer: C
  explanation: Si su vehículo queda averiado a menos de 500 pies de una curva, la
    cima de una colina u otra área donde la vista de un conductor pueda estar bloqueada,
    coloque el dispositivo al menos a 500 pies de su vehículo.
- id: 273
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo se sumerge en el agua y necesita escapar?
  choices:
    A: Esperar a que el vehículo se llene completamente de agua antes de abrir la
      puerta
    B: Quitarse el cinturón de seguridad, abrir una ventana y subir al techo
    C: Reunir sus pertenencias valiosas antes de salir
    D: Nadar hacia la orilla inmediatamente, incluso si el personal de emergencia
      está llegando
  answer: B
  explanation: Si su vehículo se sumerge en el agua, quítese el cinturón de seguridad,
    abra una ventana, salga del vehículo y suba al techo. Nunca vuelva a entrar para
    recoger pertenencias y nade hacia la orilla solo como último recurso.
- id: 274
  category: vehicle_information
  question: ¿Por qué nunca debe girar el encendido a la posición de bloqueo (lock)
    mientras su vehículo está en movimiento?
  choices:
    A: Hará que el motor se sobrecaliente.
    B: Dañará permanentemente la transmisión.
    C: La dirección se bloqueará al girar el volante, provocando una pérdida de control.
    D: Los frenos se bloquearán inmediatamente y provocarán un derrape.
  answer: C
  explanation: Al operar un vehículo con un sistema de interbloqueo del volante, girar
    el encendido a la posición de bloqueo mientras se está en movimiento bloqueará
    la dirección al girar el volante, lo que provocará la pérdida de control del vehículo.
- id: 275
  category: safe_driving_rules
  question: Para ayudar reducir las posibilidades de que le roben el vehículo, ¿cómo
    debe estacionarlo?
  choices:
    A: Con las ruedas delanteras giradas bruscamente hacia la izquierda.
    B: Con las ruedas delanteras giradas bruscamente hacia la derecha y el freno de
      emergencia puesto.
    C: Con las ventanas ligeramente abiertas para ventilación.
    D: Con el vehículo en punto muerto (neutral) y el freno de emergencia puesto.
  answer: B
  explanation: Para reducir las posibilidades de robo del vehículo, el manual recomienda
    estacionar con las ruedas delanteras giradas bruscamente hacia la derecha y poner
    el freno de emergencia.
- id: 276
  category: driver_responsibility
  question: ¿Cómo debe reconocer primero la presencia de un oficial de la ley cuando
    le ordenan detenerse?
  choices:
    A: Encendiendo sus luces de emergencia (hazard lights) inmediatamente.
    B: Agitando la mano por la ventana.
    C: Encendiendo su señal de giro a la derecha.
    D: Tocando la bocina dos veces.
  answer: C
  explanation: Debe reconocer la presencia del oficial encendiendo su señal de giro
    a la derecha. Esto le permite al oficial saber que usted reconoce su presencia.
- id: 277
  category: safe_driving_rules
  question: Cuando un oficial de la ley le ordena detenerse en una autopista, ¿dónde
    debe detener su vehículo?
  choices:
    A: En el arcén (shoulder) derecho de la carretera.
    B: En la mediana central.
    C: En el carril de circulación situado más a la derecha.
    D: En el arcén izquierdo de la carretera.
  answer: A
  explanation: Debe mover su vehículo al arcén derecho de la carretera. No debe detenerse
    en la mediana central de una autopista, ya que esto pone en peligro tanto al conductor
    como al oficial.
- id: 278
  category: safe_driving_rules
  question: Si un oficial de la ley lo detiene por la noche, ¿qué se le recomienda
    hacer?
  choices:
    A: Apagar sus faros delanteros.
    B: Encender sus luces altas.
    C: Encender la luz interior del vehículo.
    D: Salir del vehículo para que el oficial pueda verlo.
  answer: C
  explanation: Si lo detienen por la noche, se le recomienda encender la luz interior
    del vehículo y buscar lugares bien iluminados para detenerse.
- id: 279
  category: safe_driving_rules
  question: ¿Qué debe hacer si no puede encontrar inmediatamente un lugar seguro para
    detenerse durante una parada de tráfico?
  choices:
    A: Mantener su velocidad hasta que aparezca un área segura.
    B: Reducir la velocidad y encender las luces de emergencia (hazard lights).
    C: Detenerse en medio del carril de circulación.
    D: Aumentar la velocidad para llegar más rápido a la siguiente salida.
  answer: B
  explanation: Si no puede encontrar un lugar seguro de inmediato, reduzca la velocidad
    y encienda las luces de emergencia. Esto le indica al oficial que usted reconoce
    su presencia y que está intentando activamente encontrar un lugar seguro para
    detenerse.
- id: 280
  category: driver_responsibility
  question: Durante una parada de tráfico, ¿dónde deben mantener sus manos el conductor
    y los pasajeros?
  choices:
    A: El conductor debe mantener las manos en el volante y las manos de los pasajeros
      deben estar visibles en sus regazos.
    B: Todos deben mantener las manos en el aire.
    C: Las manos deben mantenerse en los bolsillos o fuera de la vista.
    D: El conductor debe buscar en la guantera inmediatamente.
  answer: A
  explanation: El conductor debe mantener sus manos en el volante y las manos de los
    pasajeros deben estar visibles en sus regazos. La incapacidad de ver las manos
    puede hacer que el oficial se sienta amenazado.
- id: 281
  category: driver_responsibility
  question: ¿Qué debe hacer si su comprobante de seguro está guardado en su teléfono
    celular durante una parada de tráfico?
  choices:
    A: Tomar rápidamente su teléfono antes de que el oficial se acerque.
    B: Sacar el teléfono por la ventana mientras el oficial se acerca caminando.
    C: Informar primero al oficial de policía sobre ese hecho y luego seguir sus instrucciones
      antes de buscarlo.
    D: Negarse a mostrarlo, ya que los oficiales no pueden mirar los teléfonos celulares.
  answer: C
  explanation: Si el comprobante de seguro está guardado en un teléfono celular, primero
    debe informar al oficial de policía sobre ese hecho y luego seguir las instrucciones
    del oficial antes de intentar recuperar la información.
- id: 282
  category: penalties_and_points
  question: ¿Qué significa firmar una multa de tráfico emitida por un oficial de policía?
  choices:
    A: Es una admisión de su culpabilidad.
    B: Renuncia a su derecho a un juicio en un tribunal de tráfico.
    C: Es solo un acuse de recibo de la multa.
    D: Significa que está de acuerdo con el motivo de la parada.
  answer: C
  explanation: Firmar una multa no es una admisión de culpabilidad del conductor,
    sino solo un acuse de recibo de la multa.
- id: 283
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de intoxicación por monóxido de
    carbono?
  choices:
    A: Un fuerte olor a escape en la cabina.
    B: Aumento de la sensibilidad a la luz.
    C: Un repentino estallido de energía.
    D: Un tinte rojizo en la piel o los labios.
  answer: B
  explanation: Los síntomas de intoxicación por monóxido de carbono pueden incluir
    somnolencia o mareos, un tinte azulado en la piel o los labios, dolor de cabeza
    y aumento de la sensibilidad a la luz. No se puede ver, oler ni saborear el monóxido
    de carbono.
- id: 284
  category: safe_driving_rules
  question: ¿Cómo puede ayudar a evitar la intoxicación por monóxido de carbono al
    conducir en tráfico congestionado?
  choices:
    A: Abrir todas las ventanas por completo.
    B: Encender la calefacción del vehículo al máximo.
    C: Cerrar la rejilla de ventilación de aire fresco.
    D: Abrir la rejilla de ventilación de aire fresco.
  answer: C
  explanation: Para evitar la intoxicación por monóxido de carbono en tráfico congestionado,
    debe cerrar la rejilla de ventilación de aire fresco para no inhalar los gases
    de escape de otros vehículos.
- id: 285
  category: signs_and_signals
  question: Según las normas de tráfico del manual, ¿cuándo se puede realizar un giro
    a la izquierda legal con luz roja?
  choices:
    A: Cuando no haya otros vehículos presentes.
    B: Al girar desde una calle de sentido único hacia otra calle de sentido único.
    C: Cuando otro conductor toca la bocina.
    D: Nunca.
  answer: B
  explanation: Se puede realizar un giro a la izquierda legal con luz roja cuando
    el conductor gira desde una calle de sentido único hacia otra calle de sentido
    único.
- id: 286
  category: sharing_the_road
  question: ¿Qué distancia puede tardar en detenerse un camión con remolque (tractor-trailer)
    completamente cargado con frenos calientes que viaja a 55 mph?
  choices:
    A: 50 pies o más.
    B: 100 pies o más.
    C: 200 pies o más.
    D: 400 pies o más.
  answer: D
  explanation: Un camión con remolque completamente cargado con frenos calientes que
    viaja a cincuenta y cinco (55) mph puede tardar 400 pies o más en detenerse.
- id: 287
  category: safe_driving_rules
  question: Según la ley de Indiana, ¿durante qué período de tiempo debe un vehículo
    tener encendidas sus luces delanteras?
  choices:
    A: Entre la puesta del sol y el amanecer cuando la visibilidad es inferior a 500
      pies
    B: Entre las 6:30 p.m. y las 6:30 a.m.
    C: Siempre que el conductor esté cansado
    D: Solo cuando se conduce por carreteras rurales sin iluminación
  answer: A
  explanation: La ley de Indiana exige que un vehículo tenga encendidas sus luces
    delanteras entre la puesta del sol y el amanecer cuando la visibilidad es inferior
    a 500 pies.
- id: 288
  category: safe_driving_rules
  question: Si la carretera desde la que va a girar tiene más de un carril, ¿desde
    qué carril debe girar?
  choices:
    A: El carril central
    B: El carril más alejado de la dirección en la que va a girar
    C: El carril más cercano a la dirección en la que va a girar
    D: Cualquier carril, siempre que use su señal de giro
  answer: C
  explanation: Si gira desde una carretera con más de un carril, debe girar desde
    el carril más cercano a la dirección en la que va a girar.
- id: 289
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    una carretera estatal dividida rural?
  choices:
    A: 50 millas por hora
    B: 55 millas por hora
    C: 60 millas por hora
    D: 65 millas por hora
  answer: C
  explanation: A menos que se indique lo contrario, el límite de velocidad en una
    carretera estatal dividida rural es de 60 millas por hora.
- id: 290
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    para un vehículo de pasajeros en una autopista interestatal ubicada fuera de un
    área urbanizada?
  choices:
    A: 55 millas por hora
    B: 60 millas por hora
    C: 65 millas por hora
    D: 70 millas por hora
  answer: D
  explanation: El límite de velocidad máximo para un vehículo de pasajeros en una
    autopista interestatal ubicada fuera de un área urbanizada es de 70 millas por
    hora, a menos que se indique lo contrario.
- id: 291
  category: safe_driving_rules
  question: ¿Al conducir de noche, a qué distancia de otro vehículo que va adelante
    debe usar las luces bajas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Al conducir de noche, se deben usar las luces bajas cuando se sigue
    a un vehículo a una distancia de 200 pies.
- id: 292
  category: safe_driving_rules
  question: ¿Al conducir de noche, a qué distancia del tráfico en sentido contrario
    debe usar las luces bajas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Se deben usar las luces bajas al acercarse al tráfico en sentido contrario
    a una distancia de 500 pies.
- id: 293
  category: defensive_driving
  question: ¿Qué debe hacer en una situación de neumático desinflado o reventón de
    llanta?
  choices:
    A: Frenar de inmediato
    B: Sujetar el volante con firmeza y mantener el vehículo en línea recta
    C: Aumentar la velocidad de conducción
    D: Continuar conduciendo sobre el rin hasta llegar al destino
  answer: B
  explanation: En una situación de neumático desinflado o reventón de llanta, debe
    sujetar el volante con firmeza y mantener el vehículo en línea recta.
- id: 294
  category: license_system
  question: Si transporta bienes por contrato con un endoso de transporte público
    (for-hire), ¿cuál es el límite de peso bruto del vehículo?
  choices:
    A: No debe exceder las 16,000 libras
    B: No debe exceder las 26,000 libras
    C: Debe exceder las 26,000 libras
    D: Debe exceder las 28,000 libras
  answer: B
  explanation: Al transportar bienes por contrato con un endoso de transporte público,
    el peso bruto del vehículo no debe exceder las 26,000 libras.
- id: 295
  category: safe_driving_rules
  question: ¿A qué distancia de las vías del tren deben detenerse los vehículos que
    transportan pasajeros por contrato?
  choices:
    A: De 5 a 45 pies
    B: De 10 a 40 pies
    C: De 15 a 50 pies
    D: De 20 a 60 pies
  answer: C
  explanation: Los vehículos que transportan pasajeros por contrato deben detenerse
    a una distancia de entre 15 y 50 pies de las vías del tren.
- id: 296
  category: vehicle_information
  question: ¿Cuál de los siguientes es un dispositivo de advertencia aceptable para
    un camión, autobús o remolque de tractor que está averiado en una calzada transitada
    o en su arcén?
  choices:
    A: Tres triángulos reflectantes de emergencia bidireccionales que cumplan con
      las normas federales
    B: Tres bengalas de combustible líquido
    C: Al menos seis fusibles
    D: Todas las respuestas son correctas
  answer: D
  explanation: Los dispositivos de advertencia aceptables para un camión, autobús
    o remolque de tractor averiado incluyen tres triángulos reflectantes de emergencia
    bidireccionales que cumplan con las normas federales, tres bengalas de combustible
    líquido o al menos seis fusibles. Por lo tanto, todas las respuestas son correctas.
- id: 297
  category: signs_and_signals
  question: Cuando un oficial de la ley está dirigiendo el tráfico y su orden es diferente
    a una señal o letrero de tráfico, ¿qué debe hacer?
  choices:
    A: Obedecer la señal o letrero de tráfico
    B: Obedecer la orden del oficial
    C: Continuar sin reducir la velocidad
    D: Enviar una alerta en las redes sociales
  answer: B
  explanation: Cuando un oficial de la ley está dirigiendo el tráfico, debe obedecer
    la orden del oficial, incluso si es diferente a una señal o letrero de tráfico.
- id: 298
  category: license_system
  question: Al solicitar una nueva licencia de conducir, ¿cuántos documentos que demuestren
    su residencia en Indiana debe presentar?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para obtener una nueva licencia de conducir, permiso de aprendizaje
    o tarjeta de identificación, debe presentar dos documentos que demuestren su residencia
    en Indiana.
- id: 299
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para demostrar su número
    de Seguro Social?
  choices:
    A: Una factura de servicios públicos
    B: Un formulario W-2
    C: Un estado de cuenta bancario
    D: Una tarjeta de registro de votante de Indiana
  answer: B
  explanation: Según el manual, los documentos que contienen su nombre y el número
    completo de Seguro Social que califican incluyen una tarjeta de Seguro Social,
    un formulario W-2, un formulario 1099, un formulario 1099 que no sea de la SSA
    o un talón de pago preimpreso.
- id: 300
  category: license_system
  question: ¿Qué antigüedad máxima debe tener una factura generada por computadora
    de una compañía de servicios públicos para demostrar la residencia en Indiana?
  choices:
    A: Emitida dentro de los 30 días anteriores a la fecha de la solicitud
    B: Emitida dentro de los 60 días anteriores a la fecha de la solicitud
    C: Emitida dentro de los 90 días anteriores a la fecha de la solicitud
    D: Emitida dentro del año anterior a la fecha de la solicitud
  answer: B
  explanation: El manual establece que una factura generada por computadora de una
    compañía de servicios públicos debe haber sido emitida dentro de los 60 días anteriores
    a la fecha de la solicitud y contener su nombre y dirección residencial.
- id: 301
  category: license_system
  question: ¿Bajo qué condición se puede utilizar un apartado de correos (P.O. Box)
    como dirección residencial para los documentos del BMV?
  choices:
    A: Si el solicitante recibe todo su correo allí
    B: Si el solicitante no tiene hogar
    C: Si el solicitante está inscrito en el Programa de Confidencialidad de Dirección
      del Fiscal General de Indiana
    D: Los apartados de correos nunca pueden utilizarse bajo ninguna circunstancia
  answer: C
  explanation: Los apartados de correos no pueden utilizarse como dirección residencial,
    a menos que el solicitante esté inscrito en el Programa de Confidencialidad de
    Dirección del Fiscal General de Indiana.
- id: 302
  category: license_system
  question: Si vive con un familiar o amigo y no puede proporcionar dos documentos
    que demuestren su residencia, ¿qué debe hacer el familiar o amigo?
  choices:
    A: Firmar una Declaración Jurada de Residencia de Indiana (Indiana Residency Affidavit)
      en una sucursal del BMV
    B: Proporcionar su propia tarjeta de Seguro Social
    C: Escribir una carta en papel con membrete oficial
    D: Pagar una tarifa de verificación de residencia
  answer: A
  explanation: Si vive con un familiar o amigo, este debe firmar una Declaración Jurada
    de Residencia de Indiana en una sucursal del BMV.
- id: 303
  category: license_system
  question: ¿Qué se requiere si presenta un documento al BMV que esté en un idioma
    distinto al inglés?
  choices:
    A: Una traducción verbal por parte de un familiar en la sucursal
    B: Una traducción completa escrita a máquina en el papel con membrete de una entidad
      aprobada
    C: Una copia notariada del documento original
    D: Una traducción proporcionada por un amigo
  answer: B
  explanation: La traducción debe estar escrita a máquina en una página separada con
    el membrete de una entidad gubernamental, una institución educativa acreditada
    o una agencia de traducción.
- id: 304
  category: license_system
  question: ¿A quién se le prohíbe explícitamente traducir un documento para su solicitud
    del BMV?
  choices:
    A: Una entidad gubernamental
    B: Una institución educativa acreditada
    C: Una agencia de traducción
    D: Un familiar, amigo o socio comercial
  answer: D
  explanation: El traductor debe declarar que el documento no ha sido traducido para
    un familiar, amigo o socio comercial.
- id: 305
  category: defensive_driving
  question: Según el manual, ¿cuál es el factor contribuyente más común en los choques
    de adolescentes?
  choices:
    A: Velocidad excesiva
    B: Conducción errática y arriesgada y distracción
    C: Conducir con otros adolescentes
    D: No usar el cinturón de seguridad
  answer: B
  explanation: El manual establece que la conducción errática y arriesgada y la distracción
    son el factor contribuyente más común en los choques de adolescentes.
- id: 306
  category: defensive_driving
  question: ¿Qué sucede con la probabilidad de un choque cuando un conductor adolescente
    lleva pasajeros en el vehículo?
  choices:
    A: Disminuye ligeramente debido a los pares de ojos adicionales
    B: Sigue siendo la misma que al conducir solo
    C: Se duplica con cada pasajero presente
    D: Se triplica con cada pasajero presente
  answer: C
  explanation: La probabilidad de un choque se duplica con cada pasajero presente
    en el vehículo.
- id: 307
  category: safe_driving_rules
  question: ¿Dónde ocurren la mayoría de los choques de varios vehículos que involucran
    a adolescentes?
  choices:
    A: En autopistas
    B: En estacionamientos
    C: En intersecciones
    D: En caminos rurales
  answer: C
  explanation: La mayoría de los choques de varios vehículos que involucran a adolescentes
    ocurren en las intersecciones. Los conductores adolescentes deben estar libres
    de distracciones y concentrados en otros vehículos en las intersecciones.
- id: 308
  category: safe_driving_rules
  question: ¿Por qué el manual aconseja no escuchar música a alto volumen mientras
    se conduce?
  choices:
    A: Agota la batería del vehículo
    B: Es ilegal en el estado de Indiana
    C: Podría no escuchar una sirena o una bocina
    D: Hace que el conductor acelere
  answer: C
  explanation: No escuche música a alto volumen. Podría no escuchar una sirena o una
    bocina que podría advertirle de un posible problema.
- id: 309
  category: defensive_driving
  question: ¿Cuál es un factor contribuyente común en los choques de un solo vehículo
    que involucran a adolescentes?
  choices:
    A: Falta de atención
    B: Velocidad excesiva
    C: Conducir con otros adolescentes
    D: Ajustar el radio
  answer: B
  explanation: Velocidad excesiva. La velocidad ilegal o insegura es un factor contribuyente
    común en los choques de un solo vehículo.
- id: 310
  category: license_system
  question: Si no califica para un número de Seguro Social, ¿qué documento se le puede
    pedir que proporcione en su lugar?
  choices:
    A: Un I-94 válido
    B: Un formulario W-2
    C: Un formulario 1099
    D: Una tarjeta de registro de votante de Indiana
  answer: A
  explanation: Si no está autorizado para trabajar en los Estados Unidos, se le puede
    pedir que proporcione un I-94 válido en lugar de un número de Seguro Social.
- id: 311
  category: license_system
  question: ¿Qué antigüedad debe tener una póliza de seguro de propietario, de inquilino
    o de vehículo motorizado para calificar como prueba de residencia en Indiana?
  choices:
    A: Con fecha dentro de los 30 días posteriores a la fecha de solicitud
    B: Con fecha dentro de los 60 días posteriores a la fecha de solicitud
    C: Con fecha dentro de los 90 días posteriores a la fecha de solicitud
    D: Con fecha dentro de un año a partir de la fecha de solicitud
  answer: D
  explanation: Una póliza de seguro vigente y válida de propietario, inquilino o vehículo
    motorizado que muestre su nombre y dirección residencial debe tener una fecha
    dentro de un año a partir de la fecha de solicitud.
- id: 312
  category: license_system
  question: ¿Qué debe proporcionar un solicitante sin hogar junto con una Declaración
    Jurada de Residencia de Indiana?
  choices:
    A: Un formulario W-2
    B: Una carta con membrete de la entidad gubernamental u organización sin fines
      de lucro que presta los servicios
    C: Prueba de pago de impuestos sobre la renta de Indiana
    D: Un permiso de armas de mano de Indiana válido
  answer: B
  explanation: Los solicitantes sin hogar deben proporcionar una carta de la entidad
    gubernamental u organización sin fines de lucro en su papel con membrete que muestre
    su nombre, dirección y número de teléfono, y que muestre el nombre, la firma y
    la fecha de la firma del representante legal.
- id: 313
  category: driver_responsibility
  question: ¿Cuándo es el mejor momento para ajustar sus asientos y espejos?
  choices:
    A: Mientras está detenido en un semáforo en rojo
    B: Antes de comenzar cada viaje
    C: Mientras conduce a baja velocidad
    D: Solo cuando conduce un vehículo nuevo
  answer: B
  explanation: El manual aconseja ajustar siempre los asientos y los espejos para
    obtener la mejor visibilidad antes de comenzar cada viaje.
- id: 314
  category: safe_driving_rules
  question: ¿Por qué debería esperar hasta que su vehículo esté detenido antes de
    ajustar su radio?
  choices:
    A: Agota la batería del automóvil si el vehículo está en movimiento.
    B: Quitar la atención de la carretera incluso por unos segundos podría provocar
      una colisión.
    C: La señal de radio es más débil mientras el vehículo está en movimiento.
    D: Es ilegal tocar la radio mientras se conduce en Indiana.
  answer: B
  explanation: El manual establece que es mejor esperar hasta estar detenido para
    ajustar la radio porque quitar la atención de la carretera incluso por unos segundos
    podría provocar una colisión.
- id: 315
  category: safe_driving_rules
  question: ¿Cuál es un peligro potencial de escuchar música a alto volumen mientras
    conduce?
  choices:
    A: Podría no escuchar una sirena o una bocina que podría advertirle de un posible
      problema.
    B: Puede dañar el sistema eléctrico del vehículo con el tiempo.
    C: Hace que el conductor conduzca inconscientemente más rápido que el límite de
      velocidad.
    D: Se considera una violación por ruido y es un delito grave.
  answer: A
  explanation: Según el manual, no debe escuchar música a alto volumen porque podría
    no escuchar una sirena o una bocina que podría advertirle de un posible problema.
- id: 316
  category: safe_driving_rules
  question: ¿Cuál de las siguientes actividades se establece explícitamente como contraria
    a la ley mientras se conduce?
  choices:
    A: Ajustar la radio.
    B: Hablar por teléfono o enviar mensajes de texto.
    C: Comer una comida.
    D: Peinarse.
  answer: B
  explanation: 'El manual establece explícitamente: "No hable por teléfono ni envíe
    mensajes de texto mientras conduce, es contra la ley".'
- id: 317
  category: alcohol_drugs_health
  question: ¿Qué efecto pueden tener algunos medicamentos de venta libre en su conducción?
  choices:
    A: Pueden mejorar su tiempo de reacción.
    B: Pueden causarle somnolencia.
    C: Aumentan su agudeza visual.
    D: No tienen ningún efecto en la capacidad de conducción.
  answer: B
  explanation: El manual advierte a los conductores que no conduzcan bajo la influencia,
    señalando que "incluso algunos medicamentos de venta libre pueden causarle somnolencia".
- id: 318
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a una intersección y la luz verde cambia
    a amarillo?
  choices:
    A: Acelerar para pasar la intersección antes de que cambie a rojo.
    B: Entrar en la intersección con precaución y ceder el paso al tráfico que cruza.
    C: No debe entrar en la intersección después de que la luz cambie a amarillo a
      menos que ya se encuentre en ella.
    D: Detenerse inmediatamente, incluso si ya se encuentra en medio de la intersección.
  answer: C
  explanation: 'El manual establece: "A menos que ya se encuentre en una intersección
    cuando la luz cambie a amarillo, no debe entrar en la intersección después de
    que la luz cambie a amarillo".'
- id: 319
  category: safe_driving_rules
  question: ¿Por qué es importante obedecer el límite de velocidad?
  choices:
    A: Ir demasiado rápido aumenta la eficiencia de combustible de su vehículo.
    B: Ir demasiado rápido le da menos tiempo para detenerse o reaccionar.
    C: Evita el desgaste excesivo de sus neumáticos.
    D: Asegura que no encontrará semáforos en amarillo.
  answer: B
  explanation: 'El manual establece: "Obedezca el límite de velocidad. Ir demasiado
    rápido le da menos tiempo para detenerse o reaccionar".'
- id: 320
  category: driver_responsibility
  question: Al elegir un vehículo para un conductor adolescente, ¿qué deben priorizar
    los padres?
  choices:
    A: La imagen y el estilo del vehículo.
    B: Las capacidades de velocidad máxima del vehículo.
    C: La seguridad.
    D: El sistema de audio y entretenimiento del vehículo.
  answer: C
  explanation: 'La sección "Consejos para padres de adolescentes" aconseja a los padres:
    "Elija vehículos por seguridad, no por imagen".'
- id: 321
  category: driver_responsibility
  question: ¿Qué estrategia se recomienda para los padres a medida que su conductor
    adolescente adquiere experiencia y demuestra decisiones apropiadas?
  choices:
    A: Otorgar privilegios de conducción sin restricciones de inmediato.
    B: Desarrollar una estrategia de privilegios progresivos.
    C: Revocar el permiso de aprendizaje para poner a prueba sus conocimientos.
    D: Disminuir la cantidad de tiempo de práctica de conducción supervisada.
  answer: B
  explanation: El manual recomienda desarrollar una estrategia de privilegios progresivos,
    lo que permite al adolescente avanzar a un nivel superior de responsabilidad al
    conducir a medida que adquiere experiencia.
- id: 322
  category: vehicle_information
  question: ¿Cuál es el requisito de edad para usar un casco aprobado por el DOT al
    operar o viajar en un vehículo todoterreno (ORV)?
  choices:
    A: Cualquier persona menor de 16 años.
    B: Cualquier persona menor de 18 años.
    C: Cualquier persona menor de 21 años.
    D: Todos los conductores, independientemente de su edad.
  answer: B
  explanation: 'El manual establece: "Cualquier persona menor de 18 años que opere
    o viaje en un ORV deberá usar un casco que cumpla con los estándares establecidos
    por el Departamento de Transporte (DOT) de los Estados Unidos".'
- id: 323
  category: driver_responsibility
  question: Si usted es dueño de un vehículo todoterreno (ORV), ¿qué tiene prohibido
    hacer con respecto a los menores?
  choices:
    A: Permitir a sabiendas que una persona menor de 18 años opere el ORV sin un casco
      aprobado por el DOT.
    B: Permitir que una persona menor de 18 años conduzca el ORV en propiedad privada
      bajo cualquier circunstancia.
    C: Vender el ORV a cualquier persona menor de 21 años.
    D: Permitir que una persona menor de 16 años realice el mantenimiento del ORV.
  answer: A
  explanation: El propietario o poseedor de un ORV no puede autorizar o permitir a
    sabiendas que una persona menor de 18 años opere el ORV sin usar un casco aprobado
    por el DOT.
- id: 324
  category: license_system
  question: ¿Cuándo puede una persona elegible solicitar registrarse para votar a
    través del BMV?
  choices:
    A: Solo al obtener una credencial completamente nueva.
    B: Solo durante un año de elecciones presidenciales.
    C: Al obtener una credencial nueva, renovada, de reemplazo o enmendada.
    D: Solo al visitar una sucursal física del BMV en persona.
  answer: C
  explanation: 'El manual establece: "Cualquier persona que obtenga una credencial
    nueva, renovada, de reemplazo o enmendada también puede solicitar registrarse
    para votar si esa persona es elegible para votar".'
- id: 325
  category: license_system
  question: La ley de Indiana exige que el BMV envíe información al sistema del Servicio
    Selectivo (Selective Service) para ¿qué grupo de personas que obtienen una licencia
    de conducir nueva o renovada?
  choices:
    A: Todas las personas menores de 18 años.
    B: Varones menores de 26 años.
    C: Mujeres menores de 26 años.
    D: Todas las personas mayores de 18 años.
  answer: B
  explanation: El BMV está obligado a enviar la información necesaria para registrar
    a los varones menores de 26 años en el sistema del Servicio Selectivo al obtener
    una licencia de conducir nueva o renovada.
- id: 326
  category: penalties_and_points
  question: ¿Cuál es la sanción por no registrarse en el sistema del Servicio Selectivo
    (Selective Service) cuando es obligatorio?
  choices:
    A: Un delito menor castigado con una multa de $500.
    B: Un delito grave castigado con hasta cinco años de prisión y una multa de $250,000.
    C: Suspensión inmediata de los privilegios de conducción por un año.
    D: Una advertencia por escrito y una comparecencia obligatoria ante el tribunal.
  answer: B
  explanation: Según el manual, no registrarse en el sistema del Servicio Selectivo
    es un delito grave y se castiga con hasta cinco años de prisión y una multa de
    $250,000.
- id: 327
  category: vehicle_information
  question: ¿Aproximadamente cuánto tiempo tardan en llegar por correo las placas
    y calcomanías después de renovar el registro de su vehículo?
  choices:
    A: 7 días
    B: 14 días
    C: 21 días
    D: 30 días
  answer: C
  explanation: El manual establece repetidamente en los diferentes métodos de renovación
    (en línea, por teléfono, por correo) que "las placas y calcomanías llegan en aproximadamente
    21 días".
- id: 328
  category: vehicle_information
  question: ¿Cuál de las siguientes NO se menciona como una forma conveniente de renovar
    el registro de su vehículo a través del BMV?
  choices:
    A: Visitar un quiosco BMV Connect.
    B: Renovar por teléfono.
    C: Renovar por correo.
    D: Renovar a través de una aplicación móvil de terceros.
  answer: D
  explanation: 'El BMV ofrece cuatro formas de renovar: en línea (IN.gov/BMV), por
    teléfono, en un quiosco BMV Connect o por correo. No se mencionan las aplicaciones
    móviles de terceros como una opción.'
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Hacer un alto total (detenerse por completo)
    C: Ceder el paso al tráfico que se aproxima
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 329
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Hacer un alto total (detenerse por completo)
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 330
- image: wrong_way.png
  category: signs_and_signals
  question: ¿Qué debe hacer si ve esta señal?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 331
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Mantenerse a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 332
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 333
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 334
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 335
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 336
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los venados cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un venado
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 337
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 338
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces de tren. Significa que debe ceder el paso a los trenes. Si
    se acerca un tren, debe detenerse.
  id: 339
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 340
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    gire primero en un sentido y luego en el otro.
  id: 341
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 342
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 343
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 344
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 345
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 346
