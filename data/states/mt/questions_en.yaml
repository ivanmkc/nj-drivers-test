metadata:
  source: Montana Driver Manual (opi.mt.gov)
  total_questions: 460
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: What is the primary legal reference that courts use for Montana motor
    vehicle laws?
  choices:
    A: The Montana Driver Manual
    B: The Montana Code Annotated
    C: The Office of Public Instruction Guide
    D: The Attorney General's Handbook
  answer: B
  explanation: The manual states that it paraphrases Montana's motor vehicle laws
    and is not a complete legal reference. Courts go by the actual language of the
    Montana Code Annotated.
- id: 2
  category: license_system
  question: According to the Montana Driver Manual, what does a Class D Standard Driver
    License represent?
  choices:
    A: A commercial license
    B: A non-commercial license
    C: A motorcycle endorsement only
    D: A learner license
  answer: B
  explanation: The Table of Contents lists the 'Class D Standard Driver License' explicitly
    as a '(non-commercial license)'.
- id: 3
  category: driver_testing
  question: Where can you schedule your Montana driving test online?
  choices:
    A: www.dojmt.gov/driving
    B: www.mt.gov/mvd
    C: www.montanadriving.com
    D: www.opi.mt.gov/driving
  answer: A
  explanation: 'The manual''s introduction clearly states to ''Schedule your test
    online: www.dojmt.gov/driving''.'
- id: 4
  category: license_system
  question: What does GDL stand for in the Montana driver licensing system?
  choices:
    A: General Driver License
    B: Graduated Driver Licensing
    C: Guided Driver Learning
    D: Guaranteed Driver Liability
  answer: B
  explanation: The Table of Contents for Chapter 1 includes a section titled 'Graduated
    Driver Licensing (GDL) Program'.
- id: 5
  category: driver_testing
  question: Which organization provides an adapted illustrated driver manual?
  choices:
    A: The Motor Vehicle Division
    B: The Office of Public Instruction
    C: The Attorney General's Office
    D: The Department of Transportation
  answer: B
  explanation: The introduction notes that an adapted illustrated driver manual is
    available from the Office of Public Instruction on their website or by calling
    1-888-231-9393.
- id: 6
  category: license_system
  question: What does CDL stand for?
  choices:
    A: Certified Driver License
    B: Commercial Driver License
    C: Class D License
    D: County Driver License
  answer: B
  explanation: The Table of Contents lists 'Commercial Driver License (CDL)' under
    the types of Montana licenses.
- id: 7
  category: safe_driving_rules
  question: According to the Attorney General's letter, which of the following is
    part of the 'way of the road'?
  choices:
    A: Drive faster
    B: Leave sooner
    C: Stay relaxed
    D: Live free
  answer: B
  explanation: 'Attorney General Austin Knudsen advises drivers to follow the way
    of the road: ''leave sooner, drive slower, stay alert, and live longer.'''
- id: 8
  category: vehicle_information
  question: Which of the following is NOT listed as a vehicle system to check during
    trip planning?
  choices:
    A: Braking System
    B: Exhaust System
    C: Entertainment System
    D: Suspension System
  answer: C
  explanation: The Table of Contents for Chapter 2 lists Braking System, Exhaust System,
    and Suspension System under 'Check the Vehicle', but does not list an Entertainment
    System.
- id: 9
  category: vehicle_information
  question: What color are the rear reflectors required to be on a motor vehicle?
  choices:
    A: White
    B: Amber
    C: Red
    D: Yellow
  answer: C
  explanation: The Table of Contents for Chapter 2 specifically lists 'Red Reflectors
    (rear)' under Motor Vehicle Equipment.
- id: 10
  category: vehicle_information
  question: Which chapter of the Montana Driver Manual covers Motor Vehicle Equipment?
  choices:
    A: Chapter 1
    B: Chapter 2
    C: Chapter 3
    D: Chapter 4
  answer: B
  explanation: The Table of Contents clearly labels 'CHAPTER 2 – MOTOR VEHICLE EQUIPMENT'.
- id: 11
  category: license_system
  question: If you need further information not found in the manual, which of the
    following is NOT listed as a source to obtain it?
  choices:
    A: A public library
    B: A law enforcement agency
    C: A driver examiner
    D: A private driving school
  answer: D
  explanation: The manual states further information may be obtained from a public
    library, law enforcement agency, driver examiner, the DOJ website, or the Motor
    Vehicle Division. It does not mention private driving schools.
- id: 12
  category: license_system
  question: What is the phone number for the Motor Vehicle Division in Helena, MT?
  choices:
    A: 1-888-231-9393
    B: 1-406-444-3933
    C: 1-800-555-1234
    D: 1-406-555-9876
  answer: B
  explanation: The manual provides the contact information for the Motor Vehicle Division
    at P.O. Box 201430, Helena, MT 59620-1430 or 1-406-444-3933.
- id: 13
  category: vehicle_information
  question: Which of the following is listed under Motor Vehicle Equipment in Chapter
    2?
  choices:
    A: License Plate Lamp
    B: Airbags
    C: Seatbelts
    D: GPS Navigation
  answer: A
  explanation: The Table of Contents for Chapter 2 lists 'License Plate Lamp' under
    the Motor Vehicle Equipment section.
- id: 14
  category: driver_testing
  question: According to the manual's introduction, what happens if you do not know
    the information contained in the manual?
  choices:
    A: You will have to pay a higher fee
    B: You cannot pass the written and road tests
    C: You must take a mandatory driver's education course
    D: You will only receive a restricted license
  answer: B
  explanation: The introduction explicitly states, 'Unless you know the information
    that it contains, you cannot pass the written and road tests.'
- id: 15
  category: penalties_and_points
  question: According to the manual, what happens to traffic fines in school zones?
  choices:
    A: They are halved
    B: They are waived
    C: They are doubled
    D: They remain the same
  answer: C
  explanation: The manual specifically includes a section titled 'Fines Doubled in
    School Zones'.
- id: 16
  category: vehicle_information
  question: Where are red reflectors required to be located on a vehicle?
  choices:
    A: The front
    B: The rear
    C: The sides
    D: The roof
  answer: B
  explanation: The manual lists 'Red Reflectors (rear)' under the vehicle equipment
    requirements.
- id: 17
  category: vehicle_information
  question: What is another term used in the manual for spot lamps and auxiliary lamps?
  choices:
    A: Clearance lamps
    B: Fog lamps
    C: Projecting load lamps
    D: Marker lamps
  answer: B
  explanation: The manual groups these together in the section titled 'Spot Lamps
    & Auxiliary Lamps (Fog Lamps)'.
- id: 18
  category: safe_driving_rules
  question: What must be used to mark a projecting load on a vehicle?
  choices:
    A: A lamp or flag
    B: A flare or cone
    C: A safety chain
    D: A mud flap
  answer: A
  explanation: The manual includes a section on equipment titled 'Projecting Load
    Lamp or Flag'.
- id: 19
  category: signs_and_signals
  question: How does the manual suggest you can identify and know traffic signs?
  choices:
    A: By their size and weight
    B: By their shape and color
    C: By their material and texture
    D: By their height and placement
  answer: B
  explanation: The manual includes a section titled 'Know Signs by Their Shape and
    Color'.
- id: 20
  category: safe_driving_rules
  question: What must a driver display when their vehicle becomes disabled?
  choices:
    A: Proof of insurance
    B: Warning devices
    C: A white flag
    D: Their driver's license
  answer: B
  explanation: The manual contains a section titled 'Display of Warning Devices When
    Vehicles Disabled'.
- id: 21
  category: vehicle_information
  question: Which of the following equipment is explicitly listed as required for
    vehicles?
  choices:
    A: Custom rims
    B: Mud flaps
    C: Window tinting
    D: Auxiliary horns
  answer: B
  explanation: The manual explicitly lists 'Mud Flaps Required' under vehicle equipment.
- id: 22
  category: safe_driving_rules
  question: According to the manual, what type of restraints are required for young
    passengers?
  choices:
    A: Child restraints
    B: Booster seats only
    C: Lap belts only
    D: Airbags
  answer: A
  explanation: The manual includes a section titled 'Child Restraints Required'.
- id: 23
  category: safe_driving_rules
  question: Before driving, what should you do regarding your vehicle's windows and
    glass surfaces?
  choices:
    A: Tint them
    B: Clean them all
    C: Roll them down
    D: Remove them
  answer: B
  explanation: The manual includes a pre-driving step titled 'Clean All Windows and
    Glass Surfaces'.
- id: 24
  category: vehicle_information
  question: Which types of vehicles have special lighting requirements according to
    the manual?
  choices:
    A: Motorcycles and mopeds
    B: Farm tractors and implements of husbandry
    C: Bicycles and scooters
    D: Sports cars and convertibles
  answer: B
  explanation: The manual includes a section titled 'Special Lighting for Farm Tractors
    & Implements of Husbandry'.
- id: 25
  category: safe_driving_rules
  question: What adjustments should a driver make before operating the vehicle?
  choices:
    A: Adjust the seat and mirrors
    B: Adjust the tire pressure
    C: Adjust the engine timing
    D: Adjust the muffler
  answer: A
  explanation: The manual lists 'Adjust Seat and Mirrors' as a step for drivers.
- id: 26
  category: signs_and_signals
  question: Which of the following is listed as a warning sign or signal at a railroad
    crossing?
  choices:
    A: Cross buck signs
    B: Stop signs
    C: Yield signs
    D: Speed limit signs
  answer: A
  explanation: The manual lists 'Railroad Cross Buck Signs' under Railroad Crossing
    Warning Signs/Signals.
- id: 27
  category: vehicle_information
  question: What are certain vehicles required to carry in case of emergencies?
  choices:
    A: Spare tires
    B: Flares or other warning devices
    C: Extra fuel
    D: A tool kit
  answer: B
  explanation: The manual includes a section titled 'Certain Vehicles to Carry Flares
    or Other Warning Devices'.
- id: 28
  category: signs_and_signals
  question: What topics are covered in Chapter 3 of the Montana Driver Manual?
  choices:
    A: Licensing and Registration
    B: Signs, Signals, & Markings
    C: Vehicle Maintenance
    D: Driving Under the Influence
  answer: B
  explanation: The manual explicitly titles Chapter 3 as 'SIGNS, SIGNALS, & MARKINGS'.
- id: 29
  category: vehicle_information
  question: Which of the following is listed as a specific equipment requirement or
    consideration in the manual?
  choices:
    A: Safety chains
    B: Roof racks
    C: Trailer hitches
    D: Winches
  answer: A
  explanation: The manual lists 'Safety Chains' as a topic under vehicle equipment.
- id: 30
  category: sharing_the_road
  question: According to the manual's section on Bicyclists & Motorists, what principle
    applies to sharing the road?
  choices:
    A: Bicyclists must always yield to motor vehicles
    B: Same Road – Same Rules – Same Rights
    C: Motorists have the primary right-of-way
    D: Bicycles are restricted to sidewalks and bike lanes
  answer: B
  explanation: The provided manual text explicitly lists 'Same Road – Same Rules –
    Same Rights' under the 'Bicyclists & Motorists' section.
- id: 31
  category: driver_responsibility
  question: Which of the following is listed as a specific sub-topic under 'Motor
    Vehicle Insurance'?
  choices:
    A: Self-Insurers
    B: Collision Repair
    C: Health Insurance
    D: Life Insurance
  answer: A
  explanation: The manual text lists 'Requirements', 'Consequences', 'Self-Insurers',
    and 'Montana Insurance Verification System (MTIVS)' under the Motor Vehicle Insurance
    section.
- id: 32
  category: safe_driving_rules
  question: 'According to the ''Adjusting Speed'' section, drivers must adjust their
    speed to road conditions, traffic, and:'
  choices:
    A: The type of vehicle they are driving
    B: How well they can see
    C: The number of passengers in the vehicle
    D: The speed limit of the previous zone
  answer: B
  explanation: The 'Adjusting Speed' section includes sub-headings for 'Adjusting
    to Road Conditions', 'Adjusting to Traffic', and 'Adjusting to How Well You Can
    See'.
- id: 33
  category: defensive_driving
  question: The 'Sharing Space' section of the manual emphasizes maintaining space
    in which of the following areas?
  choices:
    A: Only space ahead of the vehicle
    B: Space ahead, behind, and to the side
    C: Only space to merge
    D: Space above and below the vehicle
  answer: B
  explanation: The 'Sharing Space' section explicitly lists 'Space Ahead', 'Space
    Behind', and 'Space to the Side' as key areas to manage.
- id: 34
  category: safe_driving_rules
  question: Under the 'Right-of-Way' section, which of the following situations is
    specifically addressed?
  choices:
    A: Funeral Processions
    B: Drive-thru lanes
    C: Parking lots
    D: Private driveways
  answer: A
  explanation: The provided text lists 'Funeral Procession' as a specific sub-topic
    under the 'Right-of-Way' section.
- id: 35
  category: defensive_driving
  question: What two main concepts are covered under the 'Communicating' section of
    safe driving?
  choices:
    A: Using a cell phone and CB radio
    B: Honking the horn and flashing lights
    C: Letting others know you are there and what you are doing
    D: Reading road signs and listening to traffic reports
  answer: C
  explanation: 'The ''Communicating'' section is divided into two parts: ''Letting
    Others Know You Are There'' and ''Letting Others Know What You Are Doing''.'
- id: 36
  category: safe_driving_rules
  question: Which of the following skills are included in the 'Basic Driving' section?
  choices:
    A: Changing a tire and checking oil
    B: Accelerating and Steering
    C: Pumping gas and washing the windshield
    D: Parallel parking and reversing
  answer: B
  explanation: 'The ''Basic Driving'' section includes the sub-topics: Starting, Accelerating,
    Steering, Controlling Speed, and Stopping.'
- id: 37
  category: safe_driving_rules
  question: According to the manual's table of contents, which of the following is
    a specific type of parking covered?
  choices:
    A: Diagonal Parking
    B: Parallel Parking
    C: Reverse Angle Parking
    D: Valet Parking
  answer: B
  explanation: The 'Parking' section explicitly lists 'Parallel Parking' alongside
    'Parking on a Hill' and 'No Parking Zones'.
- id: 38
  category: sharing_the_road
  question: The manual includes a specific section on equipment and lighting required
    for which type of transportation?
  choices:
    A: Motorcycles
    B: Bicycles
    C: Commercial Trucks
    D: Horse-drawn carriages
  answer: B
  explanation: The text lists 'Equipment and Lighting Required for Bicycles' under
    the Bicyclists & Motorists section.
- id: 39
  category: defensive_driving
  question: Under the 'Seeing Well' section, what specific driving condition is addressed?
  choices:
    A: Driving in fog
    B: Night Driving
    C: Driving in snow
    D: Driving in heavy rain
  answer: B
  explanation: The 'Seeing Well' section includes sub-topics for 'Scanning' and 'Night
    Driving'.
- id: 40
  category: signs_and_signals
  question: Which of the following is listed under the 'Pavement Markings' section?
  choices:
    A: Edge and Lane Lines
    B: Stop Signs
    C: Traffic Signals
    D: Speed Bumps
  answer: A
  explanation: The 'Pavement Markings' section covers 'Edge and Lane Lines', 'Other
    Lane Controls', and 'No Lane Markings'.
- id: 41
  category: sharing_the_road
  question: In the 'Right-of-Way' section, which specific types of vehicles are mentioned
    alongside School Buses?
  choices:
    A: Delivery Trucks
    B: Emergency Vehicles
    C: Taxis
    D: Public Transit Buses
  answer: B
  explanation: The 'Right-of-Way' section explicitly lists 'Emergency Vehicles' right
    before 'School Buses'.
- id: 42
  category: driver_testing
  question: The manual mentions a driver test application specifically available for
    which devices?
  choices:
    A: Android and Windows
    B: iPad and iPhone
    C: Mac and PC
    D: Kindle and Nook
  answer: B
  explanation: The text explicitly lists a 'Driver Test for iPad and iPhone' at the
    beginning of Chapter 4.
- id: 43
  category: defensive_driving
  question: 'According to the ''Sharing Space'' section, drivers need to manage space
    to merge and space to cross or:'
  choices:
    A: Enter
    B: Exit
    C: Park
    D: Turn around
  answer: A
  explanation: The final item listed under the 'Sharing Space' section in the provided
    text is 'Space to Cross or Enter'.
- id: 44
  category: license_system
  question: What is the minimum age requirement to be eligible to renew your Montana
    driver license online?
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '67'
  answer: B
  explanation: According to the Motor Vehicle Division, customers must be between
    the ages of 21-67 to renew their driver license online.
- id: 45
  category: license_system
  question: What is the maximum age at which a customer is eligible to renew their
    driver license online?
  choices:
    A: '55'
    B: '65'
    C: '67'
    D: '70'
  answer: C
  explanation: To renew a driver license online, the customer must be between the
    ages of 21-67.
- id: 46
  category: license_system
  question: How far in advance of your expiration date are you eligible to renew your
    driver license online?
  choices:
    A: 1 month prior
    B: 3 months prior
    C: 6 months prior
    D: 12 months prior
  answer: C
  explanation: Customers are eligible for online renewal up to 6 months prior to their
    license expiration date.
- id: 47
  category: license_system
  question: How long after your driver license expiration date can you still renew
    it online?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: You cannot renew online after it expires.
  answer: B
  explanation: Customers are eligible for online renewal within 3 months after their
    expiration date.
- id: 48
  category: license_system
  question: Which of the following is a requirement to renew your driver license online?
  choices:
    A: You must be a U.S. Citizen.
    B: You must take a vision test online.
    C: You must be at least 18 years old.
    D: You must have a commercial driver license.
  answer: A
  explanation: To renew a driver license online, the manual states that the customer
    must be a U.S. Citizen.
- id: 49
  category: defensive_driving
  question: According to the manual, which of the following is a recognized maneuver
    for avoiding collisions?
  choices:
    A: Closing your eyes
    B: Speeding up
    C: Honking continuously
    D: Shifting to neutral
  answer: B
  explanation: The manual lists "Speeding Up" alongside "Stopping Quickly" and "Turning
    Quickly" as methods for avoiding collisions.
- id: 50
  category: safe_driving_rules
  question: Which of the following is classified as a vehicle emergency in the driver
    manual?
  choices:
    A: A dirty windshield
    B: Gas pedal sticks
    C: Running out of windshield washer fluid
    D: A burnt-out interior dome light
  answer: B
  explanation: The manual specifically covers "Gas Pedal Sticks" as a vehicle emergency,
    along with brake failure, tire blowout, power failure, and headlight failure.
- id: 51
  category: license_system
  question: Which of the following services is discussed in the "Other Services" chapter
    of the Montana Driver Manual?
  choices:
    A: Vehicle Registration
    B: Organ & Tissue Donation
    C: Passport Applications
    D: Property Tax Payments
  answer: B
  explanation: Chapter 9 (Other Services) includes information on Voter Registration,
    Selective Service, Organ & Tissue Donation, and Living Wills.
- id: 52
  category: license_system
  question: What is one of the benefits of using the online appointment scheduling
    service?
  choices:
    A: It guarantees you will pass your driving test.
    B: It helps you avoid waiting on the phone when Customer Care Center lines are
      busy.
    C: It provides a discount on your license fee.
    D: It allows you to skip the vision exam.
  answer: B
  explanation: Scheduling online lets you manage appointments 24/7 and helps you avoid
    waiting on the phone when Customer Care Center lines are busy.
- id: 53
  category: defensive_driving
  question: The manual provides specific advice on how to protect yourself in collisions
    based on the direction of impact. Which of the following is one of the collision
    types covered?
  choices:
    A: Hit from above
    B: Hit from the rear
    C: Hit while parked
    D: Hit by a pedestrian
  answer: B
  explanation: The manual covers how to protect yourself when hit from the rear, hit
    from the side, and hit from the front.
- id: 54
  category: license_system
  question: Which website is provided by the Motor Vehicle Division to access online
    driving services?
  choices:
    A: dojmt.gov/driving
    B: montana.gov/cars
    C: mvd.mt.gov
    D: drivemontana.com
  answer: A
  explanation: The Motor Vehicle Division offers online services at dojmt.gov/driving
    and mtrealid.gov.
- id: 55
  category: driver_responsibility
  question: According to the manual's section on accidents, what is one of the key
    topics you must know how to handle?
  choices:
    A: How to repair a dented bumper
    B: If someone is injured
    C: How to calculate insurance premiums
    D: How to tow a vehicle yourself
  answer: B
  explanation: The Accidents section covers what to do at the accident scene, what
    to do if someone is injured, and how to report the accident.
- id: 56
  category: alcohol_drugs_health
  question: Which of the following is covered under the Physical Requirements for
    driving?
  choices:
    A: Height and weight
    B: Vision, Hearing, & Fatigue
    C: Physical strength
    D: Running speed
  answer: B
  explanation: Chapter 6 on Physical Requirements specifically covers Vision, Hearing,
    & Fatigue.
- id: 57
  category: driver_responsibility
  question: Which of the following topics is specifically addressed in the section
    for Senior Drivers?
  choices:
    A: Buying a new car
    B: Giving Up Driving
    C: Upgrading to a commercial license
    D: Driving with teenagers
  answer: B
  explanation: The Senior Drivers section includes "Considerations for Senior Citizens"
    and "Giving Up Driving".
- id: 58
  category: license_system
  question: To be eligible to renew a Montana driver license online, a U.S. citizen
    must be between what ages?
  choices:
    A: 18 and 65
    B: 21 and 67
    C: 25 and 70
    D: 16 and 80
  answer: B
  explanation: According to the manual, online driver license renewal requires the
    customer to be a U.S. Citizen between the ages of 21-67.
- id: 59
  category: license_system
  question: Which of the following pieces of information is NOT displayed when an
    authorized user views a Montana Driver History Record?
  choices:
    A: The driver's name
    B: The driver's date of birth
    C: The driver's Social Security number
    D: The driver's current license status
  answer: C
  explanation: The manual states that Driver History Records do not display the driver’s
    Social Security number, address, or any previous driver license numbers.
- id: 60
  category: license_system
  question: How many days does a new resident have to apply to convert their valid
    out-of-state non-commercial driver license to a Montana license?
  choices:
    A: 30 consecutive days
    B: 60 consecutive days
    C: 90 consecutive days
    D: 120 consecutive days
  answer: B
  explanation: New residents must apply to convert their valid license within 60 consecutive
    days (30 consecutive days for commercial licenses).
- id: 61
  category: license_system
  question: A basic Class D Montana driver license is valid for a maximum of how many
    years?
  choices:
    A: Two to four years
    B: Four to eight years
    C: Five to ten years
    D: Eight to twelve years
  answer: B
  explanation: A basic driver license (Class D) is valid for a maximum of four to
    eight years, typically expiring on the holder’s birthday.
- id: 62
  category: license_system
  question: What is the minimum age to obtain a standard driver license in Montana
    if the applicant has successfully completed an approved driver education course?
  choices:
    A: 14 ½ years
    B: 15 years
    C: 15 ½ years
    D: 16 years
  answer: B
  explanation: For residents under 21 years old, the minimum age for a license is
    16 years, or 15 years with driver education.
- id: 63
  category: license_system
  question: 'At participating driver license stations, appointments are required for
    all services EXCEPT:'
  choices:
    A: First-time commercial driver licenses
    B: Out-of-state license conversions
    C: Montana license renewal and Montana license replacement
    D: Motorcycle endorsement testing
  answer: C
  explanation: At participating stations, appointments are required for all services
    except Montana license renewal and Montana license replacement.
- id: 64
  category: vehicle_information
  question: A Class D basic driver license allows you to drive a non-commercial vehicle
    up to what maximum gross vehicle weight?
  choices:
    A: 10,000 pounds
    B: 16,000 pounds
    C: 26,000 pounds
    D: 33,000 pounds
  answer: C
  explanation: A Class D basic driver license allows you to drive any non-commercial
    vehicle under 26,000 pounds gross vehicle weight.
- id: 65
  category: license_system
  question: Who is NOT eligible to receive a Montana identification (ID) card?
  choices:
    A: A Montana resident who does not drive
    B: A Montana resident who holds a valid driver license from another jurisdiction
    C: A 16-year-old Montana resident without a driver license
    D: A Montana resident whose driver license has been surrendered
  answer: B
  explanation: Any person who is a Montana resident and has a valid driver license
    from a jurisdiction other than Montana is not eligible for a Montana identification
    card.
- id: 66
  category: driver_testing
  question: When is a Traffic Education Permit (TEP) valid for operating a motor vehicle?
  choices:
    A: Anytime the student is accompanied by a parent or guardian
    B: Only during daylight hours
    C: Only during traffic education training under the direct supervision of an instructor
    D: For six months after completing a traffic education course
  answer: C
  explanation: A TEP allows a student to operate a motor vehicle during the traffic
    education training, while under the direct supervision of a traffic education
    instructor, and is only valid for the period in which the student is enrolled
    in the course.
- id: 67
  category: license_system
  question: What is the minimum age to be issued a learner license if the applicant
    is participating in a state-approved traffic education course?
  choices:
    A: 14 years
    B: 14 ½ years
    C: 15 years
    D: 16 years
  answer: B
  explanation: A learner license may be issued to any person who is at least 14 ½
    years of age and who is participating in or successfully completed a traffic education
    course.
- id: 68
  category: driver_responsibility
  question: What obligation does a parent or guardian accept when signing a consent
    form for a driver under the age of 18?
  choices:
    A: They must ride in the vehicle at all times until the driver turns 18
    B: They accept financial responsibility for any damage resulting from the minor's
      operation of a motor vehicle
    C: They agree to pay all traffic fines issued to the minor
    D: They must provide the vehicle for the minor's driving test
  answer: B
  explanation: Signing the consent form obligates the parent/guardian to accept financial
    responsibility for any damage resulting from the minor’s operation of a motor
    vehicle.
- id: 69
  category: driver_testing
  question: How long must a new driver under 18 years old use a learner license before
    being eligible for a standard license?
  choices:
    A: Three consecutive months
    B: Six consecutive months
    C: Nine consecutive months
    D: Twelve consecutive months
  answer: B
  explanation: The learner license must be used for six consecutive months by any
    new driver under 18 years old.
- id: 70
  category: driver_testing
  question: Which of the following statements is true regarding traffic education
    courses in Montana?
  choices:
    A: Online traffic education courses are fully approved
    B: Any third-party driving school can issue a valid certificate
    C: Courses must be approved by the Office of Public Instruction and the Department
      of Justice
    D: Traffic education is mandatory for all new drivers regardless of age
  answer: C
  explanation: Traffic education courses must be approved by the Office of Public
    Instruction and the Department of Justice. Online or 3rd party traffic education
    courses are not approved.
- id: 71
  category: license_system
  question: What is a prerequisite for obtaining a Montana motorcycle endorsement?
  choices:
    A: You must be at least 21 years old
    B: You must hold or be eligible for a basic driver license
    C: You must have at least one year of driving experience
    D: You must own a registered motorcycle
  answer: B
  explanation: To be eligible for a motorcycle endorsement you must hold or be eligible
    for a basic driver license.
- id: 72
  category: license_system
  question: When applying for a Montana driver license or ID card, your full legal
    name and date of birth must match the primary document you provide and the records
    on file with which agency?
  choices:
    A: The Internal Revenue Service (IRS)
    B: The Department of Homeland Security (DHS)
    C: The Social Security Administration (SSA)
    D: The Federal Bureau of Investigation (FBI)
  answer: C
  explanation: The manual states that the full legal name and date of birth used on
    your application must match what is on file with the Social Security Administration.
- id: 73
  category: license_system
  question: How can the motorcycle road test be waived for a new applicant?
  choices:
    A: By passing the written test with a perfect score.
    B: By providing a Montana Motorcycle Safety Foundation (MSF) certificate from
      a course passed in the past year.
    C: By holding a valid basic driver license for at least 5 years.
    D: By paying an additional waiver fee at the licensing office.
  answer: B
  explanation: The road test may be waived if you have successfully completed and
    passed a Montana MSF course in the past year and provide the certificate upon
    application.
- id: 74
  category: license_system
  question: How long is a Montana motorcycle learner license valid?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 4 years
  answer: B
  explanation: According to the manual, the motorcycle learner license is valid for
    one year.
- id: 75
  category: safe_driving_rules
  question: What supervision is required when operating a motorcycle with a learner
    license?
  choices:
    A: You must be supervised by any licensed driver over the age of 18.
    B: You must be under the immediate and proximate supervision of a licensed driver
      who has a motorcycle endorsement.
    C: You must be supervised by a certified motorcycle safety instructor.
    D: No supervision is required during daylight hours.
  answer: B
  explanation: Licensees must have immediate possession of their motorcycle learner
    license and be under the immediate and proximate supervision of a licensed driver
    who has a motorcycle endorsement.
- id: 76
  category: license_system
  question: What is the minimum age for a minor to apply for a driver license if they
    have NOT completed a state-approved traffic education program?
  choices:
    A: 15 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: A minor can apply if they are 16 years old, OR if they are 15 years
    old and successfully complete a state-approved traffic education program.
- id: 77
  category: driver_testing
  question: Are online traffic education courses approved for 15-year-olds applying
    for a Montana driver license?
  choices:
    A: Yes, if they are approved by the federal government.
    B: Yes, but only if accompanied by a parent.
    C: No, online courses are not approved.
    D: Yes, if the student passes a vision test first.
  answer: C
  explanation: The manual explicitly states that for a 15-year-old completing a state-approved
    traffic education program, "online courses are not approved."
- id: 78
  category: license_system
  question: How long can a new resident use a valid out-of-state driver license before
    they must qualify for a Montana license?
  choices:
    A: Up to 30 consecutive days
    B: Up to 60 consecutive days
    C: Up to 90 consecutive days
    D: Until the out-of-state license expires
  answer: B
  explanation: If you have a valid driver license issued by the jurisdiction you moved
    from, you can use it for up to 60 consecutive days, after which you must surrender
    it and qualify for a Montana license.
- id: 79
  category: license_system
  question: Under what condition must active duty military personnel obtain a Montana
    driver license?
  choices:
    A: If they reside in Montana for more than 30 days.
    B: If they purchase a vehicle in Montana.
    C: If they become gainfully employed in Montana.
    D: Active duty military are never required to obtain a Montana license.
  answer: C
  explanation: Active duty military personnel and their dependents may retain their
    valid out-of-state license and drive in Montana unless they become gainfully employed.
    If employment is secured, a Montana license must be obtained.
- id: 80
  category: license_system
  question: How long is a driver license with a military exemption valid after an
    honorable discharge?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: The military exemption notation on the back of the license states it
    is "Valid for 90 days after honorable discharge."
- id: 81
  category: license_system
  question: When does a driver license issued to a foreign national with temporary
    authorization expire?
  choices:
    A: Exactly 8 years from the date of issuance.
    B: No later than the expiration date of the official document issued by the USCIS.
    C: One year from the date the license was issued.
    D: On the driver's next birthday.
  answer: B
  explanation: A driver license issued to a person who is a foreign national and whose
    presence in the U.S. is temporarily authorized must expire no later than the expiration
    date of the official document issued to the person by the U.S. Citizenship and
    Immigration Services (USCIS).
- id: 82
  category: license_system
  question: How many valid driver licenses are you legally allowed to have at any
    one time?
  choices:
    A: One for each state you reside in.
    B: Two, provided one is an international license.
    C: Only one valid driver license issued by any licensing jurisdiction.
    D: One basic driver license and one commercial driver license.
  answer: C
  explanation: The manual states, "You may have only one valid driver license, issued
    by any licensing jurisdiction, at any time."
- id: 83
  category: driver_testing
  question: What tests are typically waived for an out-of-state driver who holds a
    valid out-of-state license in their immediate possession when exchanging it for
    a Montana license?
  choices:
    A: The vision and written tests.
    B: The written and road tests.
    C: The vision and road tests.
    D: No tests are waived.
  answer: B
  explanation: Out-of-state drivers who hold a valid out-of-state license, and have
    it in their immediate possession, may exchange their basic driver license for
    a Montana driver license without a written or road test.
- id: 84
  category: license_system
  question: Which of the following documents is acceptable as Proof of Authorized
    Presence when applying for a Montana driver license?
  choices:
    A: A library card issued by a Montana county.
    B: A valid, unexpired passport issued by the U.S. Department of State.
    C: A utility bill from a Montana address.
    D: A student ID card from a Montana high school.
  answer: B
  explanation: A valid, unexpired passport issued by the U.S. Department of State
    is listed in the manual as an acceptable document to prove authorized presence.
- id: 85
  category: license_system
  question: What system is used to verify the authorized presence of a foreign national
    applying for a Montana driver license?
  choices:
    A: The federal Systematic Alien Verification for Entitlements (SAVE) system.
    B: The Montana Department of Revenue database.
    C: The National Driver Register (NDR).
    D: The Transportation Security Administration (TSA) portal.
  answer: A
  explanation: Per MCA 61-5-105, in order to issue a Montana driver license or ID
    card to a foreign national, their authorized presence in the U.S. will be verified
    using the federal Systematic Alien Verification for Entitlements (SAVE) system.
- id: 86
  category: license_system
  question: Which of the following is an acceptable form of identification from a
    Native American Tribe for proving authorized presence?
  choices:
    A: A handwritten letter from a tribal elder.
    B: A digital identification card issued by a federally recognized Native American
      Tribe whose reservation is located in Montana.
    C: A tribal fishing permit.
    D: A standard paper tribal enrollment certificate without a photo.
  answer: B
  explanation: An acceptable document is a digital identification card issued to the
    applicant by a federally recognized Native American Tribe, whose reservation is
    located in Montana, that contains a digitized image of the applicant, date of
    birth, and tribal enrollment number.
- id: 87
  category: license_system
  question: When applying for a Montana ID card or driver license, what combination
    of documents can you provide to show proof of your Full Legal Name and Date of
    Birth?
  choices:
    A: Three secondary documents
    B: Two primary documents, or one primary and one secondary document
    C: One primary document and two secondary documents
    D: Only one primary document is required
  answer: B
  explanation: The manual states that you must provide two documents—either two primary
    documents, or one primary and one secondary document—to show proof of Full Legal
    Name and Date of Birth.
- id: 88
  category: license_system
  question: 'A color photo driver license issued by a U.S. jurisdiction can be used
    as a primary document for proof of identity as long as it has not been expired
    for more than:'
  choices:
    A: One year
    B: Two years
    C: Four years
    D: Five years
  answer: C
  explanation: Primary documents can include a color photo driver license or identification
    card, not expired for more than four years, issued by a U.S. or Canadian jurisdiction.
- id: 89
  category: license_system
  question: Which of the following features is typically required on a certified birth
    certificate for it to be accepted as a primary document?
  choices:
    A: A photograph of the applicant as an infant
    B: The hospital's letterhead
    C: The registrar's unique seal, signature, and date filed
    D: A notarized signature from the attending physician
  answer: C
  explanation: The manual notes that a certified birth certificate typically has the
    registrar's unique seal, the registrar's signature, and the date the certificate
    was filed with the registrar's office.
- id: 90
  category: license_system
  question: 'An emergency identification photo issued by a U.S. driver licensing authority
    is accepted as a primary document, but it is NOT acceptable for:'
  choices:
    A: In-person renewals
    B: Mail renewals or mail duplicates
    C: First-time driver license applications
    D: Upgrading to a commercial driver license
  answer: B
  explanation: An emergency identification photo issued and certified by the driver
    licensing authority is listed as a primary document, but the manual specifies
    it is 'not acceptable for mail renewals or mail duplicate'.
- id: 91
  category: license_system
  question: If you are using a bank statement or a utility bill as proof of Montana
    residence, it must be dated or issued no more than how many months prior to the
    application?
  choices:
    A: One month
    B: Two months
    C: Four months
    D: Six months
  answer: C
  explanation: The manual states that a bank statement or utility bill must be dated
    or issued not more than four months prior to application to be accepted as proof
    of Montana residence.
- id: 92
  category: license_system
  question: If an applicant is homeless, what must they provide in addition to a descriptive
    address and a separate mailing address to prove Montana residency?
  choices:
    A: A written statement from a social service agency on the agency's letterhead
    B: A notarized letter from a local police officer
    C: A utility bill in a relative's name
    D: A recent pay stub from any employer
  answer: A
  explanation: If the applicant is homeless, they must provide a descriptive address,
    a separate mailing address, and present a written statement from a social service
    agency on the agency's letterhead verifying their homeless status and the descriptive
    address.
- id: 93
  category: license_system
  question: 'An unexpired, color photo concealed weapon permit can be used as a secondary
    document if it was issued by:'
  choices:
    A: A certified firearms instructor
    B: A chief of police or county Sheriff in a local U.S. jurisdiction
    C: The Montana Department of Fish, Wildlife & Parks
    D: The National Rifle Association
  answer: B
  explanation: Secondary documents include an unexpired, color photo firearm or concealed
    weapon permit issued by a chief of police in an organized, full-time police department
    or the county Sheriff in a local jurisdiction within the U.S.
- id: 94
  category: license_system
  question: 'According to Step 1 of the REAL ID requirements, applicants must provide
    proof of their current legal name, date of birth, and:'
  choices:
    A: Proof of vehicle ownership
    B: Authorized presence in the United States
    C: A valid U.S. passport
    D: A certified driving record
  answer: B
  explanation: Step 1 of the REAL ID documentation requires applicants to provide
    proof of their current legal name, date of birth, and that their presence in the
    United States is authorized under federal law.
- id: 95
  category: license_system
  question: What must an applicant prove they have been issued under Step 2 of the
    REAL ID documentation requirements?
  choices:
    A: A Social Security Number (SSN)
    B: A voter registration card
    C: A permanent resident card
    D: A Montana tax return
  answer: A
  explanation: Under Step 2 of the REAL ID requirements, applicants must prove they
    have been issued a social security number (SSN).
- id: 96
  category: license_system
  question: How can a minor or adult child use their parent's address to prove Montana
    residency?
  choices:
    A: By bringing the parent's original birth certificate
    B: By providing a written statement from the parent along with a permitted document
      showing the parent's residential address
    C: By showing a family photograph taken at the residence
    D: By providing the parent's social security card
  answer: B
  explanation: Proof of residence can include a written statement from the applicant's
    parent, guardian or adult child that the applicant resides at the same address,
    along with a copy of a permitted document showing the residential address of that
    parent, guardian or adult child.
- id: 97
  category: license_system
  question: 'A certified copy of school records or a transcript can be used as a secondary
    document for proof of identity if it contains the applicant''s full name and is
    issued by:'
  choices:
    A: A driving school instructor
    B: An elementary, secondary, or postsecondary school
    C: A local public library
    D: A homeschooling parent without state certification
  answer: B
  explanation: Secondary documents include a certified copy of school records or a
    transcript containing the applicant's full name and issued by an elementary, secondary
    or postsecondary school.
- id: 98
  category: license_system
  question: 'A digital identification card issued by a federally recognized Native
    American Tribe can be used as a primary document if the tribe''s reservation is
    located in Montana and the card contains:'
  choices:
    A: The applicant's digitized image, date of birth, and tribal enrollment number
    B: The applicant's blood quantum and family tree
    C: A signature from the tribal chief and a utility bill
    D: The applicant's social security number and physical address
  answer: A
  explanation: A primary document includes a digital identification card issued by
    a federally recognized Indian tribe whose reservation is located in Montana, that
    contains the applicant's digitized image, date of birth and tribal enrollment
    number.
- id: 99
  category: license_system
  question: 'A receipt for personal or real property taxes can be used as evidence
    of a Montana residence address if the taxes were paid to the state of Montana
    or a Montana county within the last:'
  choices:
    A: Six months
    B: Year
    C: Two years
    D: Five years
  answer: B
  explanation: The manual lists a receipt for personal or real property taxes paid
    within the last year to the state of Montana or a Montana county as acceptable
    evidence of a Montana residence address.
- id: 100
  category: license_system
  question: Can an applicant use their child's birth certificate as a secondary document
    for their own proof of identity?
  choices:
    A: No, birth certificates can only be used to prove the identity of the child.
    B: Yes, but only if the child is present at the driver license station.
    C: Yes, a certified copy of the child's birth certificate is acceptable if it
      lists the applicant's name and date of birth as a parent.
    D: Yes, but only if the child is under the age of 18.
  answer: C
  explanation: Secondary documents can include a certified copy, fax or photocopy
    of a certified copy of the birth certificate of the applicant's child, if the
    certificate lists the applicant's name and date of birth as parent.
- id: 101
  category: license_system
  question: How many acceptable documents are required to prove Montana residency
    when applying for a license?
  choices:
    A: One document
    B: Two documents
    C: Three documents
    D: Four documents
  answer: B
  explanation: According to the manual, proving Montana residency requires two acceptable
    documents that display the applicant's name and current physical address.
- id: 102
  category: driver_testing
  question: How many hours of supervised driving practice must a teen driver acquire
    during GDL Step 1?
  choices:
    A: 30 hours, including 5 hours at night
    B: 40 hours, including 10 hours at night
    C: 50 hours, including 10 hours at night
    D: 60 hours, including 15 hours at night
  answer: C
  explanation: Teen drivers must acquire at least 50 hours of supervised driving experience,
    which must include 10 hours at night, during a minimum of six months.
- id: 103
  category: license_system
  question: What is the youngest age a teenager may obtain a learner license if they
    are participating in a state-approved traffic education program?
  choices:
    A: 14 years old
    B: 14 ½ years old
    C: 15 years old
    D: 16 years old
  answer: B
  explanation: A teenager may obtain a learner license as early as 14 ½ years old
    only if he/she is participating in or has successfully completed a state-approved
    traffic education program.
- id: 104
  category: safe_driving_rules
  question: During what hours are teenage drivers with a first-year restricted license
    generally prohibited from driving?
  choices:
    A: Between 9:00 p.m. and 5:00 a.m.
    B: Between 10:00 p.m. and 6:00 a.m.
    C: Between 11:00 p.m. and 5:00 a.m.
    D: Between midnight and 6:00 a.m.
  answer: C
  explanation: Teenage drivers with a restricted driver license may not drive between
    11:00 p.m. and 5:00 a.m., with limited exceptions such as emergencies or work.
- id: 105
  category: safe_driving_rules
  question: For the first six months of a first-year restricted license, how many
    unrelated passengers under age 18 may ride in the vehicle without a supervising
    adult?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: B
  explanation: For the first six months, unless supervised by a licensed adult driver,
    a teenage driver may have only one unrelated passenger under the age of 18 in
    the vehicle.
- id: 106
  category: penalties_and_points
  question: What is the penalty for a first offense violation of the first-year restricted
    license restrictions?
  choices:
    A: A fine of $100
    B: 20 to 60 hours of community service
    C: Suspension of the driver license for six months
    D: Revocation of the driver license until age 18
  answer: B
  explanation: The penalty for a first offense of violating any step 2 first-year
    restricted license restrictions is between 20 to 60 hours of community service.
- id: 107
  category: license_system
  question: If you are under the age of 21, when does your Montana driver license
    expire?
  choices:
    A: Four years from the date of issuance
    B: Eight years from the date of issuance
    C: On your 18th birthday
    D: On your 21st birthday
  answer: D
  explanation: The manual states that if you are under the age of 21, your license
    expires on your 21st birthday.
- id: 108
  category: license_system
  question: If you are 75 years of age or older, how long is your driver license valid?
  choices:
    A: Four years or less after the date of issuance
    B: Five years or less after the date of issuance
    C: Eight years or less after the date of issuance
    D: It does not expire
  answer: A
  explanation: If you are 75 years of age or older, your license expires on your birthday
    four years or less after the date of issuance.
- id: 109
  category: license_system
  question: What is the standard fee per year for a Class D basic license or learner
    license (excluding administrative fees)?
  choices:
    A: $0.50
    B: $5.00
    C: $8.00
    D: $16.00
  answer: B
  explanation: The fee for any Class D basic license or a learner license is listed
    as $5.00 per year.
- id: 110
  category: driver_testing
  question: How long is a driver license receipt valid for testing purposes?
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Driver license receipts are valid for one year. If the licensing process
    is not completed within one year, the applicant will need to re-apply.
- id: 111
  category: driver_testing
  question: How many attempts to successfully pass all required examinations does
    a testing receipt allow within its valid period?
  choices:
    A: One
    B: Two
    C: Three
    D: Unlimited
  answer: C
  explanation: For those testing, the receipt allows the applicant three attempts
    within that year to successfully pass all required examinations.
- id: 112
  category: license_system
  question: A teenager under 18 must hold a learner license for a minimum of how many
    consecutive months before applying for a first-year restricted license?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A teenager under 18 must hold a learner license for a minimum of six
    consecutive months before applying for a first-year restricted license.
- id: 113
  category: driver_testing
  question: According to the Montana Driver Manual, are online traffic education courses
    approved for obtaining a learner license at 14 ½ or 15 years old?
  choices:
    A: Yes, all online courses are approved
    B: Yes, but only if supervised by a parent
    C: No, online courses are not approved
    D: No, unless the teen has already passed the written test
  answer: C
  explanation: The manual specifically notes that a teenager may obtain a learner
    license by completing a state-approved traffic education program, but explicitly
    states "(online courses are not approved)."
- id: 114
  category: license_system
  question: What is the additional REAL ID fee for a customer renewing or replacing
    their current Montana REAL ID?
  choices:
    A: $10.30
    B: $25.75
    C: $51.50
    D: $10.00
  answer: B
  explanation: According to the manual, customers renewing or replacing their current
    Montana REAL ID will pay a REAL ID fee of $25.75 in addition to regular license
    fees.
- id: 115
  category: license_system
  question: What is the earliest you may renew your Montana driver license prior to
    its expiration date?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: You may renew your license up to six months before the expiration date
    of your license.
- id: 116
  category: license_system
  question: If your driver license has been expired for more than three months, what
    must you do to obtain a valid license?
  choices:
    A: Pay a late fee of $51.50 and take a vision test
    B: Mail a renewal form to the Driver Services Bureau
    C: Reapply as a new driver and pass all applicable licensing tests
    D: Complete a defensive driving course
  answer: C
  explanation: If your license is more than three months expired, you must reapply
    as a new driver and will be required to pass all applicable licensing tests.
- id: 117
  category: license_system
  question: What is the fee to apply for a replacement if your Montana driver license
    is lost or destroyed?
  choices:
    A: $10
    B: $25.75
    C: $51.50
    D: $15
  answer: A
  explanation: If your license is lost or destroyed, you may apply for a replacement
    at your local licensing station and will be required to pay a $10 fee.
- id: 118
  category: driver_responsibility
  question: How many days do you have to notify the Driver Services Bureau of any
    change of address?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: To make sure your driver license is kept current, you must notify the
    Driver Services Bureau of the Department of Justice within 10 days of any change
    of address.
- id: 119
  category: license_system
  question: Which of the following is an acceptable document to present when changing
    the legal name on your driver license?
  choices:
    A: A notarized letter from a family member
    B: A certified copy of a divorce decree specifying the name change
    C: A valid student identification card
    D: A recent utility bill in your new name
  answer: B
  explanation: To change your legal name, you must present a certified document such
    as a marriage certificate, court decree, divorce decree, or certificate of naturalization.
- id: 120
  category: driver_testing
  question: What is required before visiting a Montana driver license station for
    services?
  choices:
    A: A scheduled appointment
    B: A completed written exam
    C: A vehicle inspection report
    D: A printed copy of the driver manual
  answer: A
  explanation: All driver license stations require scheduled appointments, which can
    be scheduled online.
- id: 121
  category: driver_responsibility
  question: 'When parents sign for their child under 18 years of age to get a license,
    they are indicating that:'
  choices:
    A: Their child has passed a driver education course
    B: Their child is a careful driver
    C: They are affirming their child's correct date of birth
    D: They are accepting financial responsibility for any damage that results from
      the minor operating a motor vehicle
  answer: D
  explanation: According to the Chapter 1 Quiz in the manual, when signing for a child
    under 18, parents are accepting financial responsibility for any damage that results
    from the minor operating a motor vehicle.
- id: 122
  category: safe_driving_rules
  question: Which of the following is a recommended trip planning practice to save
    fuel and prolong the life of your vehicle?
  choices:
    A: Drive during heavy traffic to maintain lower speeds
    B: Take multiple short trips instead of combining errands
    C: Use car pools or share rides whenever possible
    D: Avoid using public transportation
  answer: C
  explanation: Trip planning recommendations include using car pools or sharing rides
    whenever possible, taking public transportation, avoiding heavy traffic, and combining
    errands.
- id: 123
  category: vehicle_information
  question: Why does the manual recommend driving with your headlights on all the
    time?
  choices:
    A: It prevents the battery from overcharging
    B: It helps other drivers see your vehicle during the day and at night
    C: It automatically adjusts your vehicle's suspension
    D: It improves your fuel economy
  answer: B
  explanation: Driving with headlights on all the time helps other drivers see your
    vehicle during the day and at night.
- id: 124
  category: vehicle_information
  question: What must you do regarding snow and ice on your vehicle before you drive?
  choices:
    A: Remove it only from the front windshield
    B: Remove it from all windows to clear your view of the road
    C: Turn on the defroster and wait for it to melt completely
    D: Use your windshield wipers to push it off while driving
  answer: B
  explanation: The manual states to "Remove snow and ice from all windows before you
    drive to clear your view of the road."
- id: 125
  category: vehicle_information
  question: When is the best time to check your tire air pressure with a gauge?
  choices:
    A: Immediately after a long trip
    B: When the tires are cold
    C: While the vehicle is running
    D: During heavy rain
  answer: B
  explanation: You should check the tire air pressure with an air pressure gauge when
    the tires are cold.
- id: 126
  category: vehicle_information
  question: When using a penny to check your tire tread, how do you know if the tire
    is unsafe and needs to be replaced?
  choices:
    A: If the tread covers Abraham Lincoln's head
    B: If the tread does not come at least to Abraham Lincoln's head
    C: If the penny falls out of the tread
    D: If the penny turns sideways in the tread
  answer: B
  explanation: Stick the penny into the tread "head" first. If the tread does not
    come at least to Abraham Lincoln’s head, the tire is unsafe and you need to replace
    it.
- id: 127
  category: vehicle_information
  question: What is the primary function of your vehicle's suspension system?
  choices:
    A: It keeps your vehicle balanced and provides a comfortable ride over varying
      road surfaces
    B: It tells other road users that you are stopping or turning
    C: It clears rain and snow off the windshield
    D: It prevents hydroplaning on wet roads
  answer: A
  explanation: Your suspension keeps your vehicle balanced, helps you control your
    vehicle, and provides a comfortable ride over varying road surfaces.
- id: 128
  category: vehicle_information
  question: What is a major danger of a leaky exhaust system?
  choices:
    A: It will cause the engine to overheat immediately.
    B: It can cause drowsiness or death in a very short time.
    C: It significantly increases the vehicle's fuel economy.
    D: It causes the suspension system to bounce excessively.
  answer: B
  explanation: According to the manual, fumes from a leaky exhaust can cause death
    in a very short time and can also make you drowsy while driving.
- id: 129
  category: safe_driving_rules
  question: Why must you ensure there are no loose objects on the floor of your vehicle?
  choices:
    A: They can increase the vehicle's overall weight and reduce fuel economy.
    B: They can roll under the brake pedal, preventing you from slowing or stopping.
    C: They will cause the vehicle to fail an emissions inspection.
    D: They can interfere with the vehicle's suspension system.
  answer: B
  explanation: The manual states to make sure there are no objects on the floor that
    could roll under the brake pedal so that you could not slow or stop the vehicle.
- id: 130
  category: safe_driving_rules
  question: At what distance must you dim your high beam headlights when meeting another
    vehicle?
  choices:
    A: 300 feet
    B: 500 feet
    C: 1000 feet
    D: 1500 feet
  answer: C
  explanation: High beam headlights must be dimmed when meeting other vehicles at
    1000 feet.
- id: 131
  category: safe_driving_rules
  question: When are headlamps required to be in use in Montana?
  choices:
    A: From one hour after sunset to one hour before sunrise.
    B: Only when driving on unlit rural highways.
    C: From a half hour after sunset to a half hour before sunrise, or when visibility
      is less than 500 feet.
    D: At all times when driving a motor vehicle manufactured after 1968.
  answer: C
  explanation: Head lamps are required to be in use at all times from a half hour
    after sunset to a half hour before sunrise and any other times when visibility
    is less than 500 feet.
- id: 132
  category: vehicle_information
  question: How far ahead should your low beam headlights illuminate persons or vehicles?
  choices:
    A: 50 feet
    B: 100 feet
    C: 300 feet
    D: 350 feet
  answer: B
  explanation: Headlights should be capable of illuminating persons or vehicles for
    a distance of 100 feet on low beam.
- id: 133
  category: vehicle_information
  question: How far must your vehicle's turn signals be visible in normal sunlight?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Vehicles manufactured after January 1, 1956, must emit a white or amber
    light to the front and red or amber light to the rear, visible for 300 feet in
    the sunlight for turn signals.
- id: 134
  category: vehicle_information
  question: What is the required visibility distance for a license plate lamp?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: A
  explanation: Vehicles manufactured after January 1, 1956, must emit white light
    to illuminate the license plate for 50 feet to the rear.
- id: 135
  category: vehicle_information
  question: How far away must a vehicle's horn be audible?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: The horn must provide a warning audible for 200 feet.
- id: 136
  category: safe_driving_rules
  question: What does Montana law require regarding seatbelt use?
  choices:
    A: Only the driver and front-seat passengers are required to wear seatbelts.
    B: Seatbelts are optional for vehicles manufactured before 1980.
    C: No person may drive unless each occupant is wearing a properly adjusted and
      fastened safety belt.
    D: Seatbelts are only required when driving on interstate highways.
  answer: C
  explanation: No person may drive a motor vehicle in Montana unless each occupant
    is wearing a properly adjusted and fastened safety belt.
- id: 137
  category: vehicle_information
  question: If a load extends four feet or more beyond the rear of a vehicle during
    the day, what must be attached to the extreme rear end of the load?
  choices:
    A: A red light visible for 500 feet.
    B: A red flag not less than 12 inches square.
    C: An amber reflector visible for 300 feet.
    D: A white sign indicating 'Oversized Load'.
  answer: B
  explanation: Whenever any load extends four feet or more beyond the body of the
    vehicle... At all other times [when headlamps are not required] there shall be
    a red flag, not less than 12 inches square.
- id: 138
  category: vehicle_information
  question: Which of the following types of lighting is generally prohibited for non-emergency
    vehicles?
  choices:
    A: Amber turn signals
    B: White license plate lamps
    C: Flashing, blinking, or pulsating lights
    D: Red brake lights
  answer: C
  explanation: Flashing, blinking, sequential, rotating, or pulsating lights (other
    than turn signals) are prohibited except for emergency or authorized vehicles.
- id: 139
  category: vehicle_information
  question: If your vehicle keeps bouncing after hitting a bump or after you stop,
    which system likely needs to be checked by a mechanic?
  choices:
    A: The steering system
    B: The exhaust system
    C: The suspension system
    D: The braking system
  answer: C
  explanation: If the vehicle bounces a lot, keeps bouncing after a bump or after
    you stop, you may need new shocks or other suspension parts.
- id: 140
  category: vehicle_information
  question: When moved on a highway at night, how far must the front white light of
    a farm tractor be visible?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: During the time head lamps are required, any farm tractor or implement
    of husbandry... must display a white light to the front, visible for at least
    500 feet.
- id: 141
  category: vehicle_information
  question: When must a vehicle's spot lamps be turned off?
  choices:
    A: When driving in city limits
    B: When approaching another moving vehicle from either direction
    C: When driving at speeds over 45 mph
    D: When following another vehicle within 200 feet
  answer: B
  explanation: According to the manual, spot lamps must be turned off when approaching
    another moving vehicle from either direction.
- id: 142
  category: vehicle_information
  question: Which of the following trailers must be equipped with 'break-away' brakes?
  choices:
    A: Any trailer weighing over 1,000 pounds
    B: Only trailers carrying hazardous materials
    C: Every trailer with a gross weight in excess of 3,000 pounds
    D: Any trailer manufactured after 2010
  answer: C
  explanation: The manual states that every trailer, semi-trailer, and pole trailer
    equipped with air or vacuum brakes, or which has a gross weight in excess of 3,000
    pounds, must have 'break-away' brakes.
- id: 143
  category: vehicle_information
  question: Which of the following warning devices is prohibited on a standard civilian
    vehicle?
  choices:
    A: A horn
    B: A siren, whistle, or bell
    C: Hazard lights
    D: A backup alarm
  answer: B
  explanation: No vehicle shall be equipped with, nor shall any person use upon a
    vehicle, any siren, whistle, or bell, except as permitted for authorized emergency
    vehicles.
- id: 144
  category: vehicle_information
  question: How far down must mud flaps or splash aprons extend on the rearmost wheels
    of a truck or trailer when the vehicle is empty?
  choices:
    A: To a point not more than 10 inches above the surface of the highway
    B: To a point not more than 20 inches above the surface of the highway
    C: To a point touching the surface of the highway
    D: To a point not more than 15 inches above the surface of the highway
  answer: B
  explanation: Trucks, trailers, and certain other vehicles must have fenders or flaps
    on the rearmost wheels that extend down to a point not more than 20 inches above
    the surface of the highway when the vehicle is empty.
- id: 145
  category: vehicle_information
  question: What is the minimum required diameter for a safety chain or cable on a
    trailer of 3,000 pounds GVW or less?
  choices:
    A: 1/8 inch
    B: 1/4 inch
    C: 1/2 inch
    D: 3/4 inch
  answer: B
  explanation: Every trailer of 3,000 pounds GVW or less must have a steel chain or
    cable fastened securely to the towing unit, and such chain or cable shall be no
    less than 1/4 inch in diameter.
- id: 146
  category: safe_driving_rules
  question: What type of warning device is strictly prohibited for disabled vehicles
    transporting explosives or flammable liquids?
  choices:
    A: Red electric lanterns
    B: Portable red emergency reflectors
    C: Emergency reflective triangles
    D: Any warning device which produces a signal by flame
  answer: D
  explanation: Flares, fuses, or signals produced by flame shall NOT be used as warning
    devices for vehicles transporting explosives, flammable liquids, or compressed
    gases.
- id: 147
  category: safe_driving_rules
  question: If a truck is disabled within 500 feet of a curve or hill, how far away
    should the warning signal be placed in that direction?
  choices:
    A: No less than 100 feet
    B: No less than 200 feet
    C: No less than 300 feet
    D: No less than 500 feet
  answer: D
  explanation: Whenever a vehicle is disabled within 500 feet of a curve, hill, or
    other obstruction to view, the warning signal in that direction shall be placed
    no less than 500 feet from the vehicle.
- id: 148
  category: signs_and_signals
  question: What does the emblem for a slow-moving vehicle look like?
  choices:
    A: A fluorescent yellow-orange triangle with a reflective red border
    B: A red octagon with white reflective borders
    C: A yellow diamond with black stripes
    D: A white rectangle with a red circle in the center
  answer: A
  explanation: The slow-moving vehicle emblem is a triangle of fluorescent yellow-orange
    color with a base of 14 inches and a border with reflective red stripes.
- id: 149
  category: sharing_the_road
  question: What must a slow-moving vehicle do on a two-lane highway when it does
    not leave a clear lane for overtaking traffic?
  choices:
    A: Increase its speed to the posted speed limit
    B: Turn on its hazard lights and continue in the lane
    C: Pull over at the first safe opportunity to allow other vehicles to pass
    D: Drive on the shoulder of the highway at all times
  answer: C
  explanation: On a two-lane highway, when a slow-moving vehicle does not leave a
    clear lane for passing, it must pull over at the first safe opportunity with sufficient
    room for turnout to allow other vehicles to pass.
- id: 150
  category: safe_driving_rules
  question: According to the manual, how much can dirt on the lenses cut the effectiveness
    of your headlights?
  choices:
    A: By 10%
    B: By 25%
    C: By 50%
    D: By 75%
  answer: C
  explanation: The manual states to keep the headlights, backup, brake, and taillights
    clean because dirt on the lenses can cut the lights' effectiveness by 50%.
- id: 151
  category: safe_driving_rules
  question: What is a recommended adjustment for your side mirrors?
  choices:
    A: Set them so you can see the entire rear window
    B: Set them so that when you lean forward slightly, you can see the side of your
      vehicle
    C: Set them so you cannot see your own vehicle at all
    D: Set them angled downwards to see the lane lines
  answer: B
  explanation: A good adjustment for the side mirrors is to set them so that when
    you lean forward slightly, you can see the side of your vehicle.
- id: 152
  category: penalties_and_points
  question: What is the fine for a driver who violates the Montana safety belt law?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: Montana law places responsibility on the driver to ensure each occupant
    is properly buckled, and a driver who violates the law will be fined $20.
- id: 153
  category: defensive_driving
  question: 'According to the manual, a person not wearing a seat belt in a 30 mph
    crash experiences the same force as:'
  choices:
    A: Falling from a 3-story building
    B: Falling from a 10-story building
    C: Being hit by a bicycle at 15 mph
    D: Falling off a 10-foot ladder
  answer: A
  explanation: At just 30 mph, a person not wearing a seat belt in a crash has the
    same experience as falling from a 3-story building or getting rammed by a three
    and a half-ton elephant.
- id: 154
  category: defensive_driving
  question: The manual states there are three collisions in every crash. Which of
    the following is one of those three collisions?
  choices:
    A: The external collision
    B: The internal collision (inside your body)
    C: The airbag collision
    D: The secondary vehicle collision
  answer: B
  explanation: 'There are actually three collisions in every crash: the vehicle collision;
    the human collision; and the internal collision (inside your body).'
- id: 155
  category: driver_responsibility
  question: Under Montana law, who is responsible for ensuring that each occupant
    in a motor vehicle is properly buckled or in a child safety seat?
  choices:
    A: Each individual passenger
    B: The owner of the vehicle
    C: The driver of the vehicle
    D: The front-seat passenger
  answer: C
  explanation: Montana law places responsibility on the driver to ensure each occupant
    is properly buckled or in a child safety seat.
- id: 156
  category: safe_driving_rules
  question: Which of the following is an exception to the Montana seatbelt law?
  choices:
    A: Vehicles manufactured prior to January 1, 1980.
    B: Vehicles manufactured prior to January 1, 1968.
    C: Any passenger over the age of 18.
    D: Drivers operating a vehicle strictly within city limits.
  answer: B
  explanation: Exceptions to the seatbelt law include if the vehicle was manufactured
    prior to January 1, 1968.
- id: 157
  category: vehicle_information
  question: If your vehicle has a two-part safety belt system with an automatic shoulder
    belt, what must you do?
  choices:
    A: You only need to use the automatic shoulder belt.
    B: You must buckle your lap belt as well.
    C: You should disconnect the automatic shoulder belt.
    D: You must sit in the back seat.
  answer: B
  explanation: If you have an automatic shoulder belt, you must buckle your lap belt
    as well. Otherwise, in a collision you could slide out of the belt and be hurt
    or killed.
- id: 158
  category: safe_driving_rules
  question: Under Montana law, which children are required to be buckled in a child
    safety seat?
  choices:
    A: Children up to age 4 and 40 pounds.
    B: Children up to age 8 and 80 pounds.
    C: Children up to age 6 and 60 pounds.
    D: Children up to age 5 and 50 pounds.
  answer: C
  explanation: Babies and children up to age 6 and 60 pounds must be buckled in a
    child safety seat.
- id: 159
  category: safe_driving_rules
  question: What is the rule regarding rear-facing car seats and active front passenger
    air bags?
  choices:
    A: They can be used if the seat is moved back as far as possible.
    B: They should only be used if the child is over 20 pounds.
    C: Never place a rear-facing car seat in the front passenger seat with an active
      air bag.
    D: They are permitted if the vehicle is traveling under 30 mph.
  answer: C
  explanation: 'The manual explicitly states: ''Never place a rear-facing car seat
    in the front passenger seat with an active air bag.'''
- id: 160
  category: driver_responsibility
  question: In a 30 mph crash, a 100-pound adult holding a child becomes what amount
    of force against the child?
  choices:
    A: 1,000 pounds
    B: 2,000 pounds
    C: 3,000 pounds
    D: 5,000 pounds
  answer: C
  explanation: If you hold your child while riding in a vehicle, you could crush the
    child during a crash. In a 30 mph crash, a 100 pound adult becomes a 3,000 pound
    force against the child.
- id: 161
  category: safe_driving_rules
  question: Whenever possible, children under what age should be secured in the backseat?
  choices:
    A: Age 10
    B: Age 12
    C: Age 13
    D: Age 15
  answer: C
  explanation: Whenever possible, children under age 13 should be secured in the backseat.
- id: 162
  category: signs_and_signals
  question: What does the color red always indicate on a traffic sign?
  choices:
    A: Warning or caution
    B: Stop, yield, do not enter, or wrong way
    C: Construction or maintenance
    D: Motorist services or guidance
  answer: B
  explanation: 'Remember: red always means stop, yield, do not enter, or wrong way.'
- id: 163
  category: signs_and_signals
  question: Which traffic sign is the only eight-sided sign?
  choices:
    A: YIELD sign
    B: DO NOT ENTER sign
    C: STOP sign
    D: RAILROAD CROSSING sign
  answer: C
  explanation: The STOP sign is the only eight-sided traffic sign.
- id: 164
  category: signs_and_signals
  question: What is the only round warning traffic sign?
  choices:
    A: School Ahead
    B: Railroad Crossing Ahead
    C: Speed Zone Ahead
    D: Winding Road
  answer: B
  explanation: The 'railroad crossing ahead' sign is round. It is the only round warning
    traffic sign.
- id: 165
  category: signs_and_signals
  question: What shape and color are regulatory signs usually?
  choices:
    A: Diamond shaped with black words on a yellow background
    B: Rectangular with black words or symbols on a white background
    C: Round with white words on a red background
    D: Square with white words on a green background
  answer: B
  explanation: Regulatory signs are rectangular with black words or symbols on a white
    background. You must obey the rules on all regulatory signs.
- id: 166
  category: signs_and_signals
  question: What is the primary purpose of black and yellow diamond-shaped signs?
  choices:
    A: To show the driver's maximum speed
    B: To warn of dangerous conditions ahead
    C: To indicate a one-way roadway
    D: To prohibit certain actions like U-turns
  answer: B
  explanation: Warning signs are black and yellow. These signs are used to warn you
    of dangerous conditions ahead where you are required to drive with great caution.
    Warning signs are usually diamond shaped.
- id: 167
  category: signs_and_signals
  question: What does a sign with a red circle and a red slash mark across a black
    arrow or symbol mean?
  choices:
    A: You must perform the action shown.
    B: The action shown is recommended but not required.
    C: Don't do whatever is shown.
    D: Proceed with caution.
  answer: C
  explanation: When you see a sign with a red circle and a red slash mark across a
    black arrow or symbol, it means don't do whatever is shown.
- id: 168
  category: signs_and_signals
  question: What is the difference between a 'Narrow Bridge' sign and a 'One Lane
    Bridge' sign?
  choices:
    A: A Narrow Bridge has room to meet and pass, while a One Lane Bridge does not.
    B: A One Lane Bridge has room to meet and pass, while a Narrow Bridge does not.
    C: A Narrow Bridge is for pedestrians only.
    D: There is no difference; they mean the same thing.
  answer: A
  explanation: The 'Narrow Bridge' sign indicates the bridge is narrower than the
    road but there is room to meet and pass. The 'One Lane Bridge' sign indicates
    there is not room on the bridge to meet or pass another car or truck.
- id: 169
  category: safe_driving_rules
  question: When are headlights required to be turned on?
  choices:
    A: Only when traffic is very heavy
    B: From 1/2 hour after sunset to 1/2 hour before sunrise, or when visibility is
      less than 500 feet
    C: From 1/2 hour before sunset to 1/2 hour after sunrise
    D: Only during daylight savings time
  answer: B
  explanation: Headlights are required at any time you cannot see persons or vehicles
    for 500 feet and from 1/2 hour after sunset to 1/2 hour before sunrise.
- id: 170
  category: vehicle_information
  question: According to the manual, turn signals must be visible for what distance?
  choices:
    A: 100 feet
    B: 250 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: The Chapter 2 Quiz indicates that turn signals must be visible for
    300 feet.
- id: 171
  category: safe_driving_rules
  question: What should you do when driving on a road marked with a 'Slippery When
    Wet' sign?
  choices:
    A: Brake hard to test traction
    B: Increase the distance between your vehicle and the vehicle in front of you
    C: Change directions quickly to avoid puddles
    D: Maintain your normal speed
  answer: B
  explanation: 'The manual states for Slippery When Wet signs: ''Reduce your speed;
    do not brake hard or change directions suddenly. Increase the distance between
    your vehicle and the vehicle in front of you.'''
- id: 172
  category: penalties_and_points
  question: What is the penalty for exceeding the posted speed limit in a construction
    or work zone?
  choices:
    A: A warning for the first offense
    B: A 30-day license suspension
    C: The fines are doubled
    D: The fines are tripled
  answer: C
  explanation: According to the manual, 'The fines for violation of a work zone are
    double the amount.'
- id: 173
  category: signs_and_signals
  question: On a barricade or vertical panel in a work zone, what do diagonal stripes
    sloping downward to the right indicate?
  choices:
    A: The road is closed ahead
    B: The driver should bear to the left
    C: The driver should bear to the right
    D: Traffic must stop immediately
  answer: C
  explanation: The manual states, 'Stripes sloping downward to the right mean the
    driver should bear to the right.'
- id: 174
  category: penalties_and_points
  question: What charge may you face if you purposely remove, ignore, or intentionally
    strike a traffic control device in a highway construction zone?
  choices:
    A: Vehicular manslaughter
    B: Reckless Endangerment of a Highway Worker
    C: Highway Vandalism
    D: Aggravated Speeding
  answer: B
  explanation: The manual states you may be charged with Reckless Endangerment of
    a Highway Worker if you 'remove, ignore, or intentionally strike a traffic control
    device.'
- id: 175
  category: safe_driving_rules
  question: 'According to Montana law, school zone speed limits may be set as low
    as:'
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The manual states, 'School zone speed limits may be as low as 15 mph
    (MCA 61-8-310).'
- id: 176
  category: penalties_and_points
  question: How does Montana law handle speed violations in or near school zones?
  choices:
    A: Fines are doubled in all school zones
    B: Violators must attend traffic school
    C: Fines are tripled when children are present
    D: Points on the license are doubled
  answer: A
  explanation: The manual states, 'Fines are doubled in all school zones throughout
    Montana.'
- id: 177
  category: sharing_the_road
  question: 'When a school crossing guard is directing children across a roadway and
    holding an official sign in the stop position, a driver must:'
  choices:
    A: Honk to alert the children and proceed slowly
    B: Yield only if children are in the driver's lane
    C: Not drive past the crossing guard
    D: Pass the crossing guard at 15 mph or less
  answer: C
  explanation: The manual states, 'Drivers can’t drive through a column of school
    children crossing a roadway, or past a school crossing guard while the crossing
    guard is directing the movement of children across a roadway and while the crossing
    guard is holding an official sign in the stop position.'
- id: 178
  category: signs_and_signals
  question: What should you do if you approach an intersection where the traffic signal
    is not working?
  choices:
    A: Yield to the right and proceed without stopping
    B: Stop as you would if there were stop signs in all directions
    C: Treat the intersection as a yield sign
    D: Wait for law enforcement to direct traffic
  answer: B
  explanation: The manual states, 'Generally, if a signal is not working, stop as
    you would if there were stop signs in all directions. Common courtesy says the
    driver who stops first should get to go first.'
- id: 179
  category: signs_and_signals
  question: What should a pedestrian do if they are already in the crosswalk and the
    DON'T WALK signal begins flashing?
  choices:
    A: Stop and wait in the middle of the street
    B: Turn around and return to the starting curb
    C: Continue crossing the street
    D: Run as fast as possible to the nearest curb
  answer: C
  explanation: The manual states, 'Pedestrians who are in the crosswalk when the DON’T
    WALK signal begins flashing should continue crossing the street.'
- id: 180
  category: signs_and_signals
  question: What does a 'Low Clearance' sign indicate?
  choices:
    A: The road surface is uneven ahead
    B: The overpass has a low clearance and tall vehicles should not proceed
    C: The bridge ahead has a low weight limit
    D: Low-flying aircraft may be present
  answer: B
  explanation: 'The manual states for Low Clearance: ''The overpass has a low clearance.
    Do not proceed if your vehicle is too tall to pass under.'''
- id: 181
  category: signs_and_signals
  question: When you see a 'Divided Highway Begins' sign, what action should you take?
  choices:
    A: Keep to the left
    B: Keep to the right
    C: Prepare for oncoming traffic in your lane
    D: Merge into the center lane
  answer: B
  explanation: 'The manual states for Divided Highway Begins: ''A median or divider
    ahead splits the highway into two separate roadways, and each roadway is one-way.
    Keep to the right.'''
- id: 182
  category: signs_and_signals
  question: What precaution should you take when you see a 'Hill' warning sign?
  choices:
    A: Accelerate to maintain speed up the hill
    B: Check your brakes and consider shifting into a lower gear
    C: Shift into neutral to save gas
    D: Pull over and wait for your brakes to cool
  answer: B
  explanation: 'The manual states for Hill: ''A steep grade is ahead. Check your brakes.
    You may need to shift into a lower gear.'''
- id: 183
  category: defensive_driving
  question: Why is mixing speeding or distracted driving with child pedestrians particularly
    dangerous?
  choices:
    A: Children always have the right of way by law
    B: Children are difficult to see due to their size and have unpredictable behavior
    C: Children move faster than adult pedestrians
    D: Children are required to wear reflective clothing
  answer: B
  explanation: The manual states, 'Mixing speeding or distracted driving with child
    pedestrians and bicyclists is dangerous because children are difficult to see
    due to their size and tendency toward unpredictable behavior.'
- id: 184
  category: signs_and_signals
  question: What does an upheld orange hand on a pedestrian signal mean?
  choices:
    A: WALK
    B: Yield to vehicles
    C: DON'T WALK
    D: Caution
  answer: C
  explanation: The manual states, 'An upheld orange hand means DON’T WALK.'
- id: 185
  category: signs_and_signals
  question: What must you do when approaching a flashing red traffic signal?
  choices:
    A: Slow down and proceed with caution if the intersection is clear.
    B: Treat it the same as a stop sign and come to a complete stop.
    C: Yield to traffic on the right but do not stop.
    D: Stop only if pedestrians are actively in the crosswalk.
  answer: B
  explanation: A flashing red signal means the same as a stop sign. You must come
    to a complete stop, look to the left, right, and ahead, yield to traffic and pedestrians,
    and proceed when it is safe to do so.
- id: 186
  category: signs_and_signals
  question: What does a steady yellow traffic signal indicate?
  choices:
    A: The signal is about to turn red and you should not enter unless you are too
      close to stop safely.
    B: You have the right-of-way to proceed through the intersection.
    C: You must come to a complete stop before the crosswalk.
    D: Left turns are protected and oncoming traffic is stopped.
  answer: A
  explanation: A steady yellow signal means 'CAUTION.' The signal is about to turn
    red. Do not enter an intersection against a steady yellow light unless you are
    too close to stop safely.
- id: 187
  category: safe_driving_rules
  question: Under what condition may you make a left turn on a steady red light?
  choices:
    A: When turning from a two-way street onto a two-way street.
    B: When turning from a one-way street onto a one-way street after stopping.
    C: Whenever there is no oncoming traffic visible.
    D: Left turns on red are never permitted under any circumstances.
  answer: B
  explanation: When entering a one-way street from a one-way street, you may also
    turn left after stopping for the red light, yielding if needed.
- id: 188
  category: signs_and_signals
  question: What does a flashing yellow arrow mean?
  choices:
    A: Left turns are prohibited.
    B: You have a protected left turn.
    C: Left turns are allowed, but you must first yield to oncoming traffic and pedestrians.
    D: The traffic signal is broken and should be treated as a four-way stop.
  answer: C
  explanation: A flashing yellow arrow means left turns are allowed, but you must
    first yield to oncoming traffic and pedestrians. Oncoming traffic has a green
    light.
- id: 189
  category: safe_driving_rules
  question: What is the recommended driving speed in a roundabout?
  choices:
    A: 15 mph or less
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: A
  explanation: Driving speeds in roundabouts are 15 mph or less.
- id: 190
  category: safe_driving_rules
  question: When entering a roundabout, who has the right-of-way?
  choices:
    A: Vehicles entering the roundabout.
    B: Vehicles that are already in the roundabout.
    C: Vehicles approaching from the right.
    D: Large trucks only.
  answer: B
  explanation: When entering a roundabout, you must look to the left and yield to
    vehicles that are already in the roundabout; they have the right-of-way.
- id: 191
  category: sharing_the_road
  question: What should you do if approached by an emergency vehicle while you are
    driving inside a roundabout?
  choices:
    A: Stop immediately inside the roundabout to let them pass.
    B: Pull over to the center island.
    C: Continue on, exit as normal, and then pull to the right.
    D: Speed up to exit the roundabout before the emergency vehicle enters.
  answer: C
  explanation: Do not pull over or stop in the roundabout when approached by an emergency
    vehicle. Continue on and exit as normal, then pull to the right where there is
    room for the emergency vehicle to pass.
- id: 192
  category: sharing_the_road
  question: How should a driver of a smaller vehicle interact with a large truck navigating
    a single-lane roundabout?
  choices:
    A: Pass the truck on the right side.
    B: Pass the truck on the left side using the center island.
    C: Honk to warn the truck driver of your presence.
    D: Drop back behind the larger truck as it completes its travel.
  answer: D
  explanation: The rear wheels of a large vehicle will cross over the truck apron.
    The driver of the smaller vehicle should drop back behind the larger truck as
    it completes its travel through the roundabout.
- id: 193
  category: safe_driving_rules
  question: When required to stop at a railroad crossing, what is the minimum distance
    you must stop from the nearest rail?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 25 feet
  answer: C
  explanation: You are required to STOP at railroad crossings as close as practicable
    but not less than 15 feet from the nearest rail when warning signals indicate
    the approach of a train.
- id: 194
  category: safe_driving_rules
  question: Which of the following is a recommended safety practice when crossing
    railroad tracks?
  choices:
    A: Shift gears while crossing the tracks to maintain speed.
    B: Do not shift gears when crossing the tracks in case you stall.
    C: Stop on the tracks to look for oncoming trains.
    D: Accelerate rapidly to beat the train if the crossing gates are lowering.
  answer: B
  explanation: It is wise to not shift gears when crossing railroad tracks, just in
    case you might stall.
- id: 195
  category: signs_and_signals
  question: What does a solid yellow line on your side of the centerline mean?
  choices:
    A: You may pass if the way is clear.
    B: You cannot pass over the centerline.
    C: You are on a one-way street.
    D: You must reduce your speed to 15 mph.
  answer: B
  explanation: A solid yellow line on your side means that you cannot pass over the
    centerline.
- id: 196
  category: safe_driving_rules
  question: Under what circumstance is crossing a solid yellow centerline permitted?
  choices:
    A: When overtaking a slow-moving vehicle.
    B: When making a left turn maneuver.
    C: When driving on a multi-lane highway.
    D: Crossing a solid yellow centerline is never permitted.
  answer: B
  explanation: Crossing a solid centerline is permitted only as part of a left turn
    maneuver.
- id: 197
  category: signs_and_signals
  question: What is the difference between white and yellow lane markings?
  choices:
    A: White lines separate traffic moving in opposite directions; yellow lines separate
      traffic moving in the same direction.
    B: White lines indicate parking zones; yellow lines indicate no-parking zones.
    C: White lines separate traffic moving in the same direction; yellow lines separate
      traffic moving in opposite directions.
    D: White lines are for highways; yellow lines are for city streets.
  answer: C
  explanation: Lines separating lanes of traffic moving in the same direction are
    white. Lines separating traffic moving in opposite directions are yellow.
- id: 198
  category: signs_and_signals
  question: What does a steady green arrow indicate?
  choices:
    A: You have a protected turning movement.
    B: You must yield to oncoming traffic before turning.
    C: The traffic signal is about to turn red.
    D: You may turn, but pedestrians have the right-of-way.
  answer: A
  explanation: A steady green arrow means that you have a 'protected' turning movement.
- id: 199
  category: signs_and_signals
  question: What does a dashed yellow line between opposing lanes of traffic indicate?
  choices:
    A: You may cross it to pass if it is safe to do so.
    B: You may not pass under any circumstances.
    C: The lane is reserved for high-occupancy vehicles.
    D: You are approaching a reversible lane.
  answer: A
  explanation: According to the manual, a dashed yellow line between opposing lanes
    of traffic means that you may cross it to pass if it is safe to do so.
- id: 200
  category: safe_driving_rules
  question: When is it permissible to cross a solid yellow line?
  choices:
    A: To pass a slow-moving vehicle on a two-lane highway.
    B: To turn into a public or private parking lot, private driveway, or a roadway
      if it is safe.
    C: When the vehicle ahead is traveling below the speed limit.
    D: It is never permissible to cross a solid yellow line.
  answer: B
  explanation: 'The manual states: ''You may cross a solid yellow line to turn into
    a public or private parking lot, private driveway, or a roadway if it is safe
    to do so.'''
- id: 201
  category: signs_and_signals
  question: What does an 'HOV 3' sign indicate about a reserved lane?
  choices:
    A: The lane is reserved for vehicles with at least three people in them.
    B: The lane is reserved for heavy commercial vehicles with 3 axles.
    C: The speed limit in the lane is 30 mph.
    D: The lane is open to all traffic between 3 PM and 3 AM.
  answer: A
  explanation: HOV stands for High Occupancy Vehicles. The manual explains that 'HOV
    3' means there must be at least three people in the vehicle.
- id: 202
  category: signs_and_signals
  question: How is a shared center lane marked on each side?
  choices:
    A: By a single solid white line.
    B: By a double solid yellow line.
    C: By a solid yellow and dashed yellow line.
    D: By a double dashed white line.
  answer: C
  explanation: Shared center lanes are marked on each side by a solid yellow and dashed
    yellow line.
- id: 203
  category: safe_driving_rules
  question: How far in advance must you use a proper turn signal before turning on
    rural roads?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: D
  explanation: The manual requires drivers to use a proper turn signal 100 feet before
    turning in town, and 300 feet before turning on rural roads.
- id: 204
  category: safe_driving_rules
  question: What should you do if you approach a turn in the wrong lane or forget
    to signal?
  choices:
    A: Stop in your lane and wait for traffic to clear before turning.
    B: Quickly change lanes to make the turn.
    C: Proceed to the next intersection, get into the proper lane, signal, and turn.
    D: Back up safely and move into the correct lane.
  answer: C
  explanation: If you approach a turn in the wrong lane or forget to signal, you should
    proceed, get into the proper lane, go to the next intersection, signal, and then
    turn.
- id: 205
  category: safe_driving_rules
  question: By how much may vehicles traveling on a two-lane road exceed the speed
    limit in order to overtake and pass another vehicle?
  choices:
    A: 5 miles an hour
    B: 10 miles an hour
    C: 15 miles an hour
    D: You may never exceed the speed limit to pass.
  answer: B
  explanation: Vehicles traveling on a two-lane road may exceed the speed limit by
    10 miles an hour in order to overtake and pass another vehicle and return safely
    to the right lane.
- id: 206
  category: safe_driving_rules
  question: What is the daytime speed limit for cars and light trucks on a two-lane
    highway in Montana?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: D
  explanation: According to the speed limits chart, the daytime speed limit for cars
    and light trucks on two-lane highways is 70 mph.
- id: 207
  category: safe_driving_rules
  question: Under what condition is it legal to pass a vehicle on the right?
  choices:
    A: When the vehicle you are passing is driving below the speed limit.
    B: When you can safely drive off the pavement onto the shoulder to pass.
    C: When the vehicle you are passing is making or about to make a left turn.
    D: When you are on a two-lane road with a solid yellow line.
  answer: C
  explanation: Passing on the right is legal only when the vehicle you're passing
    is making or about to make a left turn, or on a road with unobstructed pavement
    wide enough for two or more lanes of vehicles legally going in the same direction.
- id: 208
  category: safe_driving_rules
  question: On a multi-lane road, which lane is intended to be used to pass slower
    vehicles?
  choices:
    A: The right-most lane
    B: The center lane
    C: The left-most lane
    D: The shoulder
  answer: C
  explanation: On multi-lane roads, the left-most lane is intended to be used to pass
    slower vehicles.
- id: 209
  category: safe_driving_rules
  question: When making a right turn, why should you avoid swinging wide to the left
    before turning?
  choices:
    A: It will cause you to enter a reversible lane.
    B: The driver behind you may think you are changing lanes or turning left and
      try to pass you on the right.
    C: It is illegal to turn right from a multi-lane road.
    D: You will not be able to see pedestrians in the crosswalk.
  answer: B
  explanation: On right turns, avoid swinging wide to the left before turning. If
    you swing wide, the driver behind you may think you are changing lanes or going
    to turn left and may try to pass you on the right.
- id: 210
  category: safe_driving_rules
  question: 'You may turn your vehicle around on a roadway if you have an unobstructed
    view in both directions for at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: You may turn around on a roadway where the driver has 500 feet in both
    directions of unobstructed view and no vehicles are approaching.
- id: 211
  category: safe_driving_rules
  question: What should you do before backing up a parked car?
  choices:
    A: Honk your horn three times.
    B: Walk around your parked car.
    C: Turn on your hazard lights.
    D: Check your rearview mirror only.
  answer: B
  explanation: Under General Driving rules, the manual states you must 'Walk around
    your parked car before backing up.'
- id: 212
  category: signs_and_signals
  question: What does a steady yellow 'X' above a reversible lane indicate?
  choices:
    A: The lane is only for turning.
    B: You can use the lane beneath it.
    C: The use of the lane is changing and you should move out of it as soon as it
      is safe.
    D: The lane is reserved for high-occupancy vehicles.
  answer: C
  explanation: A steady yellow 'X' means that the use of the lane is changing and
    you should move out of it as soon as it is safe to do so.
- id: 213
  category: sharing_the_road
  question: What should you do if you encounter a pedestrian using a guide dog or
    carrying a white cane?
  choices:
    A: Honk your horn to let them know you are approaching.
    B: Yield the right-of-way but proceed quickly around them.
    C: Yield absolute right-of-way and do not use your horn.
    D: Treat them like any other pedestrian and expect them to stop.
  answer: C
  explanation: According to the manual, pedestrians using a guide dog or carrying
    a white cane have absolute right-of-way. Drivers must not use their horn because
    it could confuse or frighten the blind pedestrian.
- id: 214
  category: safe_driving_rules
  question: 'When walking on a roadway where no sidewalks are provided, pedestrians
    must:'
  choices:
    A: Walk on the right side with the flow of traffic.
    B: Walk on the left side facing oncoming traffic.
    C: Walk in the center of the lane.
    D: Walk on either side as long as they wear reflective clothing.
  answer: B
  explanation: The manual states that when people are walking on the roadway, they
    must walk on the left (facing oncoming traffic).
- id: 215
  category: safe_driving_rules
  question: 'At an intersection where there is no stop sign or traffic signal, a driver
    should:'
  choices:
    A: Yield to vehicles coming from the left.
    B: Yield to vehicles coming from the right.
    C: Accelerate to clear the intersection quickly.
    D: Stop completely before proceeding.
  answer: B
  explanation: At an intersection where there is no stop sign or traffic signal, drivers
    should yield to vehicles coming from the right.
- id: 216
  category: safe_driving_rules
  question: 'When turning left at an intersection, you must:'
  choices:
    A: Yield to oncoming cars going straight ahead.
    B: Take the right-of-way over oncoming traffic.
    C: Stop and wait for a green arrow, even if the light is solid green.
    D: Yield only to vehicles turning right.
  answer: A
  explanation: The right-of-way rules for intersections state that drivers turning
    left must yield to oncoming cars going straight ahead.
- id: 217
  category: safe_driving_rules
  question: Under Montana law, when is it permissible to make a left turn on a red
    light?
  choices:
    A: Never.
    B: When turning from a two-way street onto a one-way street.
    C: When turning from a one-way street to a one-way street, after coming to a complete
      stop.
    D: When there is no oncoming traffic, without stopping.
  answer: C
  explanation: Montana law permits turning left from a one-way street to a one-way
    street on a red light AFTER you have stopped and determined it is safe to do so.
- id: 218
  category: sharing_the_road
  question: 'If a vehicle is stopped at a marked or unmarked crosswalk to let a pedestrian
    cross, approaching drivers from the rear:'
  choices:
    A: May pass on the left if the lane is clear.
    B: May pass on the right.
    C: May not pass the stopped vehicle.
    D: Should honk to alert the pedestrian before passing.
  answer: C
  explanation: When a vehicle is stopped at a marked or unmarked crosswalk to let
    a pedestrian cross the street, other drivers approaching from the rear may not
    pass the stopped vehicle.
- id: 219
  category: safe_driving_rules
  question: What must you do if you are in an intersection when you see or hear an
    emergency vehicle approaching with its lights and siren on?
  choices:
    A: Stop immediately in the middle of the intersection.
    B: Pull over to the right edge of the intersection and stop.
    C: Drive through the intersection before you pull over and stop.
    D: Reverse out of the intersection to clear the way.
  answer: C
  explanation: If you are in an intersection when an emergency vehicle approaches,
    you must drive through the intersection before you pull over and stop.
- id: 220
  category: sharing_the_road
  question: How far must you stop from a school bus that is stopped with its red lights
    flashing?
  choices:
    A: At least 15 feet.
    B: At least 20 feet.
    C: At least 30 feet.
    D: At least 50 feet.
  answer: C
  explanation: Upon meeting or passing a school bus stopped with its red lights flashing,
    the driver of a vehicle must stop at least 30 feet from the bus.
- id: 221
  category: sharing_the_road
  question: 'When approaching a school bus that is displaying a yellow flashing light,
    you must:'
  choices:
    A: Stop immediately and wait for the red lights.
    B: Slow down and proceed carefully.
    C: Maintain your speed but honk your horn.
    D: Change lanes and pass the bus quickly.
  answer: B
  explanation: If you approach a bus displaying a yellow flashing light, you must
    slow down and proceed carefully, keeping in mind that the bus is about to stop.
- id: 222
  category: safe_driving_rules
  question: Which of the following is true regarding driving in a funeral procession?
  choices:
    A: You must leave sufficient space between vehicles to allow others to enter.
    B: You are exempt from yielding to emergency vehicles.
    C: You must follow the preceding vehicle as closely as possible.
    D: You may drive up to 10 miles per hour over the posted speed limit.
  answer: C
  explanation: When driving in a funeral procession, a driver must follow the preceding
    vehicle as closely as possible. Laws requiring sufficient space between vehicles
    do not apply.
- id: 223
  category: safe_driving_rules
  question: What is the maximum speed a driver in a funeral procession may travel
    on a highway where the speed limit is 55 mph or more?
  choices:
    A: 45 miles per hour.
    B: 50 miles per hour.
    C: 55 miles per hour.
    D: 65 miles per hour.
  answer: C
  explanation: A driver in a funeral procession may not drive faster than 55 miles
    per hour on a highway where the speed limit is 55 miles per hour or more.
- id: 224
  category: safe_driving_rules
  question: According to the manual, what does the law say regarding the right-of-way?
  choices:
    A: It gives the right-of-way to the largest vehicle.
    B: It gives the right-of-way to pedestrians in all circumstances.
    C: It says who must yield the right-of-way, but does not give anyone the right-of-way.
    D: It gives the right-of-way to the driver who arrives at an intersection first.
  answer: C
  explanation: The law says who must yield the right-of-way; it does not give anyone
    the right-of-way. Drivers must do everything they can to prevent striking a pedestrian
    or vehicle.
- id: 225
  category: safe_driving_rules
  question: 'When entering a traffic circle or rotary, a driver must:'
  choices:
    A: Yield to drivers already in the circle.
    B: Take the right-of-way if entering from the right.
    C: Stop completely before entering, regardless of traffic.
    D: Yield only to commercial vehicles.
  answer: A
  explanation: Drivers entering a traffic circle or rotary must yield to drivers already
    in the circle.
- id: 226
  category: safe_driving_rules
  question: 'You are approaching an intersection with a green light, but traffic is
    backed up across the intersection. You should:'
  choices:
    A: Enter the intersection and wait for traffic to clear.
    B: Wait until traffic ahead clears so that you do not block the intersection.
    C: Honk your horn to encourage the vehicles ahead to move.
    D: Proceed slowly and weave through the stopped vehicles.
  answer: B
  explanation: Drivers may not enter an intersection unless they can get through it
    without having to stop. You should wait until traffic ahead clears so that you
    are not blocking the intersection.
- id: 227
  category: sharing_the_road
  question: 'If you are NOT part of a funeral procession, you may not pass the procession
    on a multiple-lane highway on the procession''s right side unless:'
  choices:
    A: The procession is traveling below the speed limit.
    B: You are driving an emergency vehicle.
    C: The procession is in the farthest left lane.
    D: You have your hazard lights on.
  answer: C
  explanation: A driver may not pass a procession on a multiple-lane highway on the
    procession’s right side unless the procession is in the farthest left lane.
- id: 228
  category: sharing_the_road
  question: What lighting requirement applies to the first and last vehicles in a
    funeral procession?
  choices:
    A: They must use high-beam headlights.
    B: They must have their turn signals flashing simultaneously.
    C: They must display a flashing yellow beacon.
    D: They are not required to have any special lighting.
  answer: B
  explanation: Turn signals must be flashing simultaneously as warning lights on a
    vehicle that is the first vehicle in a funeral procession or believed to be the
    last vehicle in a funeral procession.
- id: 229
  category: sharing_the_road
  question: If you are driving in a funeral procession, what must you do if an authorized
    emergency vehicle approaches with an audible or visual signal?
  choices:
    A: Maintain your speed and position in the procession.
    B: Stop immediately in your lane.
    C: Yield the right-of-way to the emergency vehicle.
    D: Speed up to clear the intersection.
  answer: C
  explanation: A driver in a funeral procession must yield the right-of-way to an
    approaching authorized emergency vehicle giving an audible or visual signal.
- id: 230
  category: sharing_the_road
  question: When passing a bicyclist on a high-speed, two-lane roadway with no oncoming
    traffic, what is the recommended distance to leave between your vehicle and the
    cyclist?
  choices:
    A: Two feet
    B: Three feet
    C: Five feet
    D: Ten feet
  answer: C
  explanation: If there is no oncoming traffic, carefully cross the centerline to
    give the cyclist a recommended five-feet distance between them and your motor
    vehicle.
- id: 231
  category: signs_and_signals
  question: What do Shared Lane Markings (sharrows) indicate to motorists?
  choices:
    A: The lane is exclusively for bicycles.
    B: Motorists must look out for bicyclists and leave them enough space when passing.
    C: Bicyclists must ride on the sidewalk in this area.
    D: Motorists are prohibited from using the lane.
  answer: B
  explanation: When you see a shared lane marking, you must look out for bicyclists
    and make sure that you leave them enough space when passing.
- id: 232
  category: sharing_the_road
  question: Under Montana law, when must a motorist yield the right-of-way to a person
    riding a bicycle?
  choices:
    A: Only when the bicyclist is in a crosswalk.
    B: When the bicyclist is within a designated bicycle lane.
    C: Only during daylight hours.
    D: When the bicyclist is riding on the sidewalk.
  answer: B
  explanation: Motorists must yield the right-of-way to a person riding a bicycle
    within a designated bicycle lane.
- id: 233
  category: sharing_the_road
  question: In which of the following situations are bicyclists allowed to ride two
    abreast (side-by-side) on a roadway?
  choices:
    A: When riding on a paved shoulder or parking lane.
    B: When riding on a high-speed, two-lane rural roadway.
    C: When approaching a blind curve.
    D: Bicyclists are never allowed to ride two abreast.
  answer: A
  explanation: Individuals riding bicycles on a roadway must ride in single file except
    when... riding on a paved shoulder or on a parking lane, in which case the persons
    may ride two abreast.
- id: 234
  category: sharing_the_road
  question: Why might a bicyclist ride further into the lane rather than staying strictly
    on the shoulder?
  choices:
    A: To intentionally slow down motor vehicle traffic.
    B: To discourage motorists from attempting a dangerous in-lane pass.
    C: Because bicycles are not permitted on shoulders.
    D: To prepare for an upcoming right turn.
  answer: B
  explanation: Many bicyclists will often ride further into the lane (approximately
    18-24 inches) to discourage motorists from trying to attempt a dangerous in-lane
    pass.
- id: 235
  category: defensive_driving
  question: What does the term 'doored' refer to in the context of bicycle safety?
  choices:
    A: A bicyclist running into a closed garage door.
    B: A motorist suddenly opening their parked car door without checking for approaching
      bicyclists.
    C: A bicyclist riding too close to the front door of a business.
    D: A vehicle's door falling off into the bicycle lane.
  answer: B
  explanation: This term describes a situation when an individual within a parked
    vehicle suddenly opens their car door without checking for any bicyclists approaching
    from behind.
- id: 236
  category: sharing_the_road
  question: If a bicycle is traveling in your lane and you need to make a right turn,
    what should you do?
  choices:
    A: Speed up and quickly turn in front of the bicyclist.
    B: Honk your horn to warn the bicyclist to move out of the way.
    C: Check to make sure the bicyclist has stopped, or allow them to pass before
      making the turn.
    D: Squeeze past the bicyclist on the right side.
  answer: C
  explanation: When a bicycle is traveling in your lane and you need to make a right
    turn, always check to make sure the bicyclist has either stopped to let you turn,
    or allow the bicyclist to pass you before making the turn.
- id: 237
  category: vehicle_information
  question: What lighting equipment is required on a bicycle when it is used at nighttime?
  choices:
    A: A front light emitting white light visible for at least 500 feet.
    B: A flashing yellow beacon on the rear.
    C: A front light emitting red light visible for at least 300 feet.
    D: No lighting is required if the bicycle has reflectors.
  answer: A
  explanation: 'Montana law requires that bicycles be equipped as follows: When used
    at nighttime, a light on the front, which must emit white light visible for at
    least 500 feet to the front.'
- id: 238
  category: vehicle_information
  question: What are the requirements for bicycle brakes under Montana law?
  choices:
    A: The bicycle must have disc brakes on both wheels.
    B: The brake must enable the operator to make the wheels skid on dry, level, clean
      pavement.
    C: Brakes are only required for bicycles ridden on highways.
    D: The brake must stop the bicycle within 10 feet at 15 mph.
  answer: B
  explanation: Montana law requires that bicycles be equipped with a brake that will
    enable the operator to make the wheels skid on dry, level, clean pavement.
- id: 239
  category: vehicle_information
  question: What safety equipment is encouraged, though not legally required, for
    every bicyclist to equip their bicycle with?
  choices:
    A: A loud motorized horn.
    B: A rear-view mirror on the left handlebar.
    C: A fluorescent orange flag suspended at least 6 feet above the roadway.
    D: A flashing blue light on the front wheel.
  answer: C
  explanation: Every bicyclist is encouraged to equip his/her bicycle with a fluorescent
    orange flag, clearly visible from the rear and suspended at least 6 feet above
    the roadway when the bicycle is standing upright.
- id: 240
  category: safe_driving_rules
  question: When parking your vehicle on a roadway with a curb, how close must your
    vehicle be to the curb?
  choices:
    A: Within 6 inches
    B: Within 12 inches
    C: Within 18 inches
    D: Within 24 inches
  answer: C
  explanation: Your vehicle must be within 18 inches (1.5 feet) of the curb or shoulder.
- id: 241
  category: safe_driving_rules
  question: What should you do with your vehicle's transmission when parking?
  choices:
    A: Leave it in neutral regardless of transmission type.
    B: Leave it in gear if it has a manual transmission, or in park if it has an automatic
      transmission.
    C: Leave it in neutral and only use the parking brake.
    D: Leave it in drive if it has an automatic transmission.
  answer: B
  explanation: Always set your parking brake when you park. Leave the vehicle in gear
    if it has a manual transmission, or in park if it has an automatic transmission.
- id: 242
  category: safe_driving_rules
  question: What is the lighting requirement for vehicles parked on a roadway or shoulder
    during hours of darkness?
  choices:
    A: They must have their hazard lights flashing continuously.
    B: They must have front and rear lights visible for 500 feet.
    C: They must have their high-beam headlights turned on.
    D: No lights are required if parked off the main travel lane.
  answer: B
  explanation: Vehicles parked on a roadway or shoulder during hours of darkness must
    have front and rear lights visible for 500 feet.
- id: 243
  category: safe_driving_rules
  question: How close must your vehicle be to the curb or shoulder when parked?
  choices:
    A: Within 12 inches (1 foot)
    B: Within 18 inches (1.5 feet)
    C: Within 24 inches (2 feet)
    D: Within 36 inches (3 feet)
  answer: B
  explanation: According to the manual, your vehicle must be within 18 inches (1.5
    feet) of the curb or shoulder when parked.
- id: 244
  category: safe_driving_rules
  question: When parking on a roadway or shoulder during hours of darkness, your vehicle
    must have front and rear lights visible for what distance?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: The manual states that vehicles parked on a roadway or shoulder during
    hours of darkness must have front and rear lights visible for 500 feet.
- id: 245
  category: safe_driving_rules
  question: Which way should you turn your steering wheel when you park facing downhill
    with a curb?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Straight ahead
    D: Toward the street
  answer: A
  explanation: When you park facing downhill, you must turn your wheels toward the
    curb so that if the car rolls, it will roll away from traffic.
- id: 246
  category: safe_driving_rules
  question: If you park facing uphill and there is no curb, which way should you turn
    your wheels?
  choices:
    A: Toward the street
    B: Away from the street
    C: Straight ahead
    D: Parallel to the shoulder
  answer: B
  explanation: When parking on a hill where there is no curb, you should turn your
    wheels away from the street.
- id: 247
  category: signs_and_signals
  question: What does a yellow painted curb indicate?
  choices:
    A: Do not stop, stand, or park
    B: Stopping only to pick up or unload passengers
    C: Stopping only long enough to load or unload and you must stay with the car
    D: Reserved for handicapped parking
  answer: C
  explanation: A yellow curb means stopping only long enough to load or unload, and
    you must stay with the car.
- id: 248
  category: safe_driving_rules
  question: You are not allowed to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: The manual states that you must not park within 15 feet of a fire hydrant.
- id: 249
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a traffic signal, stop sign,
    or yield sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: You may not park within 30 feet of a traffic signal, stop sign, or
    yield sign.
- id: 250
  category: safe_driving_rules
  question: You must not park your vehicle within how many feet of a railroad crossing?
  choices:
    A: 15 feet
    B: 25 feet
    C: 50 feet
    D: 75 feet
  answer: C
  explanation: The manual prohibits parking within 50 feet of a railroad crossing.
- id: 251
  category: driver_responsibility
  question: What is the minimum required liability insurance for injury to or destruction
    of property of others in any one accident?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: A
  explanation: Owners must have insurance of at least $10,000 for injury to or destruction
    of property of others in any one accident.
- id: 252
  category: penalties_and_points
  question: 'Driving without a valid liability insurance policy for the first time
    results in a fine, possible jail time, and:'
  choices:
    A: 2 points against your driving record
    B: 5 points against your driving record
    C: 10 points against your driving record
    D: Automatic license revocation
  answer: B
  explanation: A first offense for driving without a valid liability insurance policy
    results in 5 points against your driving record, in addition to a fine and/or
    imprisonment.
- id: 253
  category: penalties_and_points
  question: 'A second offense of driving without valid liability insurance is punishable
    by a fine, possible jail time, and:'
  choices:
    A: Suspension of your driver's license for 1 year
    B: Suspension of your license plates and registration for 90 days
    C: Confiscation of your vehicle
    D: Mandatory 30 days in county jail
  answer: B
  explanation: A 2nd or subsequent offense is punishable by a fine, possible imprisonment,
    and suspension of your license plates and registration for 90 days.
- id: 254
  category: driver_responsibility
  question: Under Montana law, an owner may qualify as a self-insurer if they own
    more than how many motor vehicles registered in the state?
  choices:
    A: '5'
    B: '10'
    C: '25'
    D: '50'
  answer: C
  explanation: The law states that owners of more than 25 motor vehicles registered
    in Montana may qualify as self-insurers.
- id: 255
  category: driver_responsibility
  question: What is the primary purpose of the Montana Insurance Verification System
    (MTIVS)?
  choices:
    A: To allow drivers to purchase insurance directly from the state
    B: To confirm that vehicle owners and operators are in compliance with vehicle
      liability policy requirements
    C: To track the driving records and points of uninsured motorists
    D: To provide free liability insurance to low-income drivers
  answer: B
  explanation: MTIVS was established to confirm that vehicle owners and operators
    on Montana roadways are in compliance with vehicle liability policy requirements.
- id: 256
  category: defensive_driving
  question: What percentage of driving decisions are based on what we see?
  choices:
    A: 50%
    B: 75%
    C: 90%
    D: 99%
  answer: C
  explanation: According to the manual, driving requires decision making and critical
    thinking, and 90% of driving decisions are based on what we see.
- id: 257
  category: safe_driving_rules
  question: 'Sending or reading a text takes your eyes off the road for 5 seconds.
    At 55 mph, this is equivalent to driving the length of:'
  choices:
    A: A basketball court
    B: An entire football field blindfolded
    C: A city block
    D: A quarter of a mile
  answer: B
  explanation: The manual states that sending or reading a text takes your eyes off
    the road for 5 seconds, which at 55 mph is like driving the length of an entire
    football field while blindfolded.
- id: 258
  category: driver_responsibility
  question: Why is texting considered the most alarming distraction while driving?
  choices:
    A: It involves simultaneous manual, visual, and cognitive distraction.
    B: It drains the phone battery quickly, leading to navigation loss.
    C: It requires both hands to type effectively.
    D: It is the only distraction that is illegal in all cities.
  answer: A
  explanation: Texting is the most alarming distraction because it involves simultaneous
    manual, visual, and cognitive distraction.
- id: 259
  category: vehicle_information
  question: 'Before starting a vehicle with an automatic transmission, the shift selector
    must be in:'
  choices:
    A: Drive
    B: Neutral
    C: First gear
    D: Park
  answer: D
  explanation: For a vehicle that has an automatic transmission, you must put the
    shift selector in 'park.' The vehicle will not start otherwise.
- id: 260
  category: defensive_driving
  question: What can happen if you try to accelerate too fast on a slippery surface?
  choices:
    A: The engine will stall immediately.
    B: The drive wheels can spin and cause the vehicle to slide.
    C: The transmission will automatically shift into neutral.
    D: The parking brake will engage.
  answer: B
  explanation: Trying to start too fast can cause the drive wheels to spin, particularly
    on slippery surfaces, and cause the vehicle to slide.
- id: 261
  category: vehicle_information
  question: What is the recommended steering wheel grip for newer vehicles equipped
    with airbags mounted in the steering wheel?
  choices:
    A: 10 and 2 o'clock positions
    B: 8 and 4 o'clock positions
    C: 12 and 6 o'clock positions
    D: One hand at the 12 o'clock position
  answer: B
  explanation: Both hands should be placed on opposite sides of the steering wheel,
    such as the 8 and 4 o'clock positions for newer vehicles equipped with airbags
    mounted in the steering wheel.
- id: 262
  category: safe_driving_rules
  question: When turning corners, which technique should you use to turn the steering
    wheel?
  choices:
    A: The palm-of-one-hand technique
    B: The hand-over-hand technique
    C: The slip-through-fingers technique
    D: The single-finger technique
  answer: B
  explanation: When turning corners, turn the steering wheel using the 'hand-over-hand'
    technique; do not turn the wheel with just the palm of one hand or you could lose
    control.
- id: 263
  category: safe_driving_rules
  question: What is the best way to control your speed while driving?
  choices:
    A: Match the speed of the vehicle next to you.
    B: Check the speedometer often.
    C: Rely on your judgment of how fast you are going.
    D: Listen to the sound of the engine.
  answer: B
  explanation: The best way to control your speed is to know how fast you are going.
    Check the speedometer often, as people are not very good at judging how fast they
    are going.
- id: 264
  category: defensive_driving
  question: According to the manual, what is the single biggest contributor to crashes?
  choices:
    A: Failing to see what is happening
    B: Driving above the speed limit
    C: Driving under the influence of alcohol
    D: Poor weather conditions
  answer: A
  explanation: The manual states that the single biggest contributor to crashes is
    failing to see what is happening.
- id: 265
  category: safe_driving_rules
  question: Why should you avoid driving with headphones or earbuds?
  choices:
    A: They drain your phone's battery quickly.
    B: They make it too hard to hear emergency horns and sirens.
    C: They are a visual distraction.
    D: They interfere with the vehicle's electronic ignition.
  answer: B
  explanation: Do not drive with headphones or earbuds. They make it too hard to hear
    emergency horns and sirens.
- id: 266
  category: defensive_driving
  question: 'Slowing down to stare at a crash or roadside activity is often called:'
  choices:
    A: Tailgating
    B: Rubbernecking
    C: Scanning
    D: Multi-tasking
  answer: B
  explanation: When passing a crash or other roadside activity, do not take your eyes
    off the road and do not slow down to stare, which is often called 'rubbernecking'.
- id: 267
  category: defensive_driving
  question: In order to avoid last-minute braking, you should look down the road at
    least how many seconds ahead of your vehicle?
  choices:
    A: 3 seconds
    B: 5 seconds
    C: 10 seconds
    D: 15 seconds
  answer: C
  explanation: In order to avoid last-minute braking or the need to turn, you should
    look down the road at least 10 seconds ahead of your vehicle.
- id: 268
  category: defensive_driving
  question: 'When driving on the highway, looking 10 seconds ahead is equivalent to
    about:'
  choices:
    A: One city block
    B: Two city blocks
    C: Four city blocks or a quarter of a mile
    D: One mile
  answer: C
  explanation: On the highway, 10 seconds is about four city blocks or a quarter of
    a mile.
- id: 269
  category: defensive_driving
  question: How can looking well ahead help you save on fuel?
  choices:
    A: It allows you to drive at higher speeds safely.
    B: It reduces the aerodynamic drag on your vehicle.
    C: It helps you avoid unnecessary braking that leads to lower miles-per-gallon.
    D: It automatically shifts the transmission into a higher gear.
  answer: C
  explanation: Drivers who look well ahead and can slow down gradually or change lanes
    can avoid unnecessary braking that leads to lower miles-per-gallon.
- id: 270
  category: driver_responsibility
  question: What is the reality of 'multi-tasking' while driving?
  choices:
    A: It improves your reaction time to sudden hazards.
    B: Your brain is actually dealing with one task at a time but shifting between
      tasks very quickly.
    C: It is a safe practice as long as you use hands-free devices.
    D: It allows you to process visual information faster.
  answer: B
  explanation: What is commonly referred to as 'multi-tasking' really isn't. Your
    brain is actually dealing with one task at a time, but shifting between tasks
    very quickly.
- id: 271
  category: safe_driving_rules
  question: When are you required to turn on your headlights in Montana?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: From a half hour after sunset to a half hour before sunrise
    C: Only when it is completely dark outside
    D: From sunset to sunrise
  answer: B
  explanation: The manual states that you shall turn on your headlights anytime from
    a half hour after sunset and a half hour before sunrise, or when persons or vehicles
    are not visible for 500 feet.
- id: 272
  category: defensive_driving
  question: What should you do if you are stopped at an intersection and your view
    of the cross street is blocked?
  choices:
    A: Honk your horn and accelerate quickly through the intersection
    B: Wait for another driver to wave you through
    C: Edge forward slowly until you can clearly see crossing traffic
    D: Turn right instead of going straight
  answer: C
  explanation: The manual advises that if your view of a cross street is blocked,
    you should edge forward slowly until you can see, giving crossing drivers a chance
    to see the front of your vehicle.
- id: 273
  category: safe_driving_rules
  question: What is a crucial safety rule when crossing railroad tracks with more
    than one track?
  choices:
    A: Proceed immediately once the first train clears the crossing
    B: Wait until the passing train is well down the track before starting to cross
    C: Drive around the crossing gates if they remain down after the train passes
    D: Honk your horn to warn any hidden trains before crossing
  answer: B
  explanation: At crossings with more than one track, you must wait until the passing
    train is well down the track because another train could be coming that is hidden
    by the one that just passed.
- id: 274
  category: defensive_driving
  question: Why is it necessary to look over your shoulder when changing lanes?
  choices:
    A: To check your blind spots because you cannot see them through your mirrors
    B: To ensure your rear passengers are seated properly
    C: To see if law enforcement is following you
    D: To judge the speed of the vehicle directly behind you
  answer: A
  explanation: The manual states you must look over your shoulder to check the rear
    corners of your vehicle, which are called 'blind spots' because you cannot see
    them through your mirrors.
- id: 275
  category: safe_driving_rules
  question: Which of the following is the recommended technique for backing up your
    vehicle?
  choices:
    A: Rely solely on your rearview and side mirrors
    B: Place your right arm on the back of the seat and look directly through the
      rear window
    C: Open your door and look down at the ground while reversing
    D: Honk your horn continuously while backing up
  answer: B
  explanation: When backing up, the manual instructs drivers to place their right
    arm on the back of the seat and turn around to look directly through the rear
    window, rather than depending on mirrors.
- id: 276
  category: safe_driving_rules
  question: What does the manual state regarding driving with your parking lights
    on?
  choices:
    A: You should drive with parking lights at dusk to save battery power
    B: Parking lights should be used when driving in heavy traffic
    C: NEVER drive with your parking lights, as oncoming traffic may think you are
      stopped
    D: Parking lights are required when driving under 25 mph at night
  answer: C
  explanation: 'The manual explicitly states: ''NEVER drive with your parking lights,
    as oncoming traffic may think that you are stopped.'''
- id: 277
  category: vehicle_information
  question: How far ahead should your headlights reveal persons and vehicles when
    on the upper (bright) beam?
  choices:
    A: 100 feet
    B: 350 feet
    C: 500 feet
    D: 1000 feet
  answer: B
  explanation: According to the manual, headlights on the upper beam (bright) shall
    reveal persons and vehicles for 350 feet.
- id: 278
  category: defensive_driving
  question: Where should you look when meeting oncoming traffic at night to avoid
    the glare of headlights?
  choices:
    A: Stare directly at the oncoming headlights
    B: Close one eye to preserve your night vision
    C: Watch the right edge of the roadway
    D: Look at the center line of the road
  answer: C
  explanation: When meeting traffic at night, the manual advises to avoid looking
    directly at oncoming headlights and instead watch the right edge of the roadway.
- id: 279
  category: safe_driving_rules
  question: Are you allowed to turn left from a one-way street onto another one-way
    street?
  choices:
    A: No, it is always illegal
    B: Yes, but only if there is a green arrow signal
    C: Yes, unless prohibited by a sign or signal
    D: Yes, but only if you come to a complete stop for 5 seconds first
  answer: C
  explanation: 'The manual states: ''Unless prohibited, you may turn left from a one-way
    street onto another one-way street.'''
- id: 280
  category: defensive_driving
  question: In which of the following situations is it especially important to look
    behind your vehicle?
  choices:
    A: Only when you are backing up out of a driveway
    B: When you change lanes, slow down, back up, or drive down a long or steep hill
    C: Only when driving on the interstate in heavy traffic
    D: When you are accelerating on a flat, straight road
  answer: B
  explanation: The manual notes that it is very important to look behind for vehicles
    when you change lanes, slow down, back up, or are driving down a long or steep
    hill.
- id: 281
  category: defensive_driving
  question: How can tinted or 'photo gray' lenses affect your driving at night?
  choices:
    A: They improve contrast and help you see better in the dark
    B: They are required if you have sensitive eyes
    C: They can detract up to 30% of your night vision
    D: They have no measurable effect on night driving
  answer: C
  explanation: The manual warns that even tinted and some 'photo gray' lenses can
    detract up to 30% of your night vision, making them dangerous for night driving.
- id: 282
  category: defensive_driving
  question: When changing lanes, why is it important to check the far lane if there
    is one?
  choices:
    A: To see if you can safely skip a lane while changing
    B: Because someone in that lane may be planning to move into the same lane you
      want to enter
    C: To check for law enforcement vehicles in the distance
    D: Because it is required by law to always cross two lanes at once
  answer: B
  explanation: The manual advises checking the far lane because 'someone in that lane
    may be planning to move into the same lane you want to enter.'
- id: 283
  category: safe_driving_rules
  question: In addition to specific times of day, when else must you turn on your
    headlights?
  choices:
    A: Anytime persons or vehicles are not visible for 100 feet
    B: Anytime persons or vehicles are not visible for 350 feet
    C: Anytime persons or vehicles are not visible for 500 feet
    D: Anytime persons or vehicles are not visible for 1000 feet
  answer: C
  explanation: You shall turn on your headlights anytime when, due to insufficient
    light conditions, persons or vehicles are not visible for 500 feet.
- id: 284
  category: safe_driving_rules
  question: What should you do before getting into your vehicle to back up?
  choices:
    A: Honk your horn twice to warn pedestrians
    B: Check behind your vehicle because children or small objects cannot be seen
      from the driver’s seat
    C: Turn on your high beams to see better in your mirrors
    D: Ensure your rearview camera is turned on before opening the door
  answer: B
  explanation: 'The manual provides a hint for backing up safely: ''Check behind your
    vehicle before you get in. Children or small objects cannot be seen from the driver’s
    seat.'''
- id: 285
  category: safe_driving_rules
  question: When driving long distances, how often should you stop for a short break
    to prevent fatigue?
  choices:
    A: At least every hour
    B: At least every two hours
    C: At least every three hours
    D: Only when you feel drowsy
  answer: B
  explanation: The manual states that when you are fatigued, you should stop at least
    every two hours for a short break.
- id: 286
  category: defensive_driving
  question: What is a good rule to remember regarding headlights on rainy, snowy,
    or foggy days?
  choices:
    A: If you turn on your wipers, turn on your headlights.
    B: Only use your parking lights to avoid glare.
    C: Headlights are only necessary when it begins to get dark.
    D: Use your emergency flashers instead of headlights.
  answer: A
  explanation: 'The manual advises that in rainy, snowy, or foggy conditions, headlights
    make your vehicle easier to see, noting: "Remember, if you turn on your wipers,
    turn on your headlights."'
- id: 287
  category: vehicle_information
  question: When is it appropriate to drive with only your parking lights on?
  choices:
    A: When driving away from a rising or setting sun
    B: During heavy rain or snow
    C: Just before it gets completely dark
    D: Never, parking lights are for parked cars only
  answer: D
  explanation: 'The manual explicitly states: "Whenever driving and lights are necessary,
    use your headlights. Parking lights are for parked cars only."'
- id: 288
  category: defensive_driving
  question: In which of the following situations should you give your horn a light
    tap?
  choices:
    A: To encourage someone to drive faster
    B: To greet a friend walking on the sidewalk
    C: When coming to a place where you cannot see what is ahead, like a steep hill
    D: When you are around visually impaired pedestrians
  answer: C
  explanation: A light tap on the horn is recommended when coming to a place where
    you cannot see what is ahead, such as a steep hill, a sharp curve, or exiting
    a narrow alley.
- id: 289
  category: defensive_driving
  question: When is it appropriate to sound a SHARP BLAST on your horn?
  choices:
    A: When a child or older person is about to walk, run, or ride into the street
    B: To apprise other drivers of a driving error
    C: When a person on a bike appears to be moving into your lane
    D: When you are passing a driver who starts to turn into your lane
  answer: A
  explanation: The manual instructs drivers to sound a sharp blast on the horn if
    there is danger, such as when a child or older person is about to walk, run, or
    ride into the street.
- id: 290
  category: safe_driving_rules
  question: If your vehicle breaks down and you cannot get it off the roadway, where
    should you try to stop?
  choices:
    A: Just over the crest of a hill
    B: Just around a sharp curve
    C: In the center lane to be more visible
    D: Where other drivers have a clear view of your vehicle
  answer: D
  explanation: If you cannot get your vehicle off the roadway, the manual says to
    "try to stop where other drivers have a clear view of your vehicle. Do not stop
    just over a hill or just around a curve."
- id: 291
  category: defensive_driving
  question: How can you signal an emergency to other drivers if your vehicle breaks
    down?
  choices:
    A: Stand in the traffic lane and wave your arms
    B: Lift the hood or tie a white cloth to the antenna, side mirror, or door handle
    C: Sound a continuous sharp blast on your horn
    D: Turn on your parking lights and leave the vehicle running
  answer: B
  explanation: To signal an emergency, the manual suggests you "Lift the hood or tie
    a white cloth to the antenna, side mirror, or door handle."
- id: 292
  category: sharing_the_road
  question: Why should you never stay alongside a large vehicle such as a truck or
    bus?
  choices:
    A: They travel at much higher speeds than passenger cars
    B: They have large blind spots and it is hard for their drivers to see you
    C: They are more likely to have tire blowouts
    D: They frequently make sudden stops
  answer: B
  explanation: The manual warns never to stay alongside a large vehicle such as a
    truck or bus because "These vehicles have large blind spots and it is hard for
    their drivers to see you."
- id: 293
  category: defensive_driving
  question: While waiting to complete a left turn, how should you position your vehicle's
    wheels?
  choices:
    A: Pointed slightly to the left
    B: Pointed slightly to the right
    C: Pointed straight ahead
    D: Turned sharply to the left
  answer: C
  explanation: While waiting to complete a left turn, you should keep your wheels
    pointed straight ahead so that if you are struck from behind, you will not be
    forced into oncoming traffic.
- id: 294
  category: safe_driving_rules
  question: If there are streets or driveways between you and where you want to turn,
    when should you activate your turn signal?
  choices:
    A: As early as possible to warn drivers behind you
    B: At least 500 feet before the turn
    C: Wait until you have passed them to signal
    D: Exactly 100 feet before the first driveway
  answer: C
  explanation: 'The manual states: "If there are streets, driveways, or entrances
    between you and where you want to turn, wait until you have passed them to signal."
    Signaling earlier might confuse other drivers.'
- id: 295
  category: defensive_driving
  question: How can you let drivers behind you know that you are about to slow down
    at an unexpected place?
  choices:
    A: Turn on your emergency flashers
    B: Tap your brake pedal three or four times quickly
    C: Sound a sharp blast on your horn
    D: Use hand signals out the window
  answer: B
  explanation: If you are going to stop or slow down at a place where another driver
    does not expect it, the manual says to "tap your brake pedal three or four times
    quickly to let those behind you know you are about to slow down."
- id: 296
  category: vehicle_information
  question: According to the manual, how does the stopping distance at 60 mph compare
    to the stopping distance at 30 mph?
  choices:
    A: It takes exactly twice the distance
    B: It takes slightly less than twice the distance
    C: It takes over three times the distance
    D: It takes four times the distance
  answer: C
  explanation: 'The manual states: "For example, stopping at 60 mph does not take
    twice the distance as it takes at 30 mph, but over three times the distance."'
- id: 297
  category: safe_driving_rules
  question: Why must you slow down when driving on gravel or dirt roads compared to
    asphalt roads?
  choices:
    A: You do not have as much traction and it is easier to skid
    B: Gravel roads always have lower posted speed limits
    C: Your tires will overheat more quickly
    D: Dust will completely blind drivers behind you
  answer: A
  explanation: The manual explains that you do not have as much traction on gravel
    and dirt roads, meaning it will take much longer to stop and it is much easier
    to skid when turning.
- id: 298
  category: safe_driving_rules
  question: 'When making a right turn, you should:'
  choices:
    A: Make a wide-sweeping turn into the left lane
    B: Keep as close to the right side as possible
    C: Enter the street just to the right of the center
    D: Signal for exactly 50 feet before turning
  answer: B
  explanation: For right turns, the manual instructs drivers to "Keep as close to
    the right side as possible when completing a right turn" and warns not to make
    a wide-sweeping turn or cross into the left lane.
- id: 299
  category: safe_driving_rules
  question: What is recommended to make your vehicle more visible to others when driving
    on extremely dusty gravel roads?
  choices:
    A: Use high beam headlights
    B: Use low beam headlights
    C: Turn on your hazard lights
    D: Sound your horn periodically
  answer: B
  explanation: The manual states that during dry periods, gravel roads can become
    extremely dusty and vision can be reduced. It is recommended that drivers use
    low beam headlights to make the vehicle more visible to others.
- id: 300
  category: safe_driving_rules
  question: When is the proper time to slow down for a curve?
  choices:
    A: Before you enter the curve
    B: While you are in the middle of the curve
    C: Just as you begin to exit the curve
    D: Whenever you feel the vehicle start to skid
  answer: A
  explanation: According to the manual, you should always slow down before you enter
    the curve so you do not have to brake in the curve, which can cause the vehicle
    to skid.
- id: 301
  category: safe_driving_rules
  question: How much should you reduce your speed when driving on a wet road?
  choices:
    A: Cut your speed in half
    B: Slow to a crawl
    C: Reduce your speed by about 10 mph
    D: Reduce your speed by 25 mph
  answer: C
  explanation: The manual advises that on a wet road, you should reduce your speed
    by about 10 mph. On packed snow, you should cut your speed in half, and on ice,
    you must slow to a crawl.
- id: 302
  category: vehicle_information
  question: During which time period are studded tires NOT allowed on the roads?
  choices:
    A: April 1 through October 31
    B: June 1 through September 30
    C: May 1 through August 31
    D: July 1 through November 30
  answer: B
  explanation: Because studded tires can cause road damage, the manual states they
    are not allowed from June 1 through September 30.
- id: 303
  category: defensive_driving
  question: Why do overpasses and bridges tend to have icy spots even when other pavement
    does not?
  choices:
    A: They are usually made of concrete instead of asphalt.
    B: They do not have earth underneath them to help insulate against the cold.
    C: They are exposed to more direct sunlight.
    D: They collect more water from rain and snow.
  answer: B
  explanation: The manual explains that the pavement on bridges can be icy even when
    other pavement is not because bridges do not have earth underneath them to help
    insulate them against the cold.
- id: 304
  category: defensive_driving
  question: Why can pavement be very slippery for the first few minutes when it starts
    to rain on a hot day?
  choices:
    A: The rain cools the tires too quickly.
    B: Heat causes oil in the asphalt to come to the surface.
    C: The water mixes with dust to form a thick mud.
    D: The hot pavement causes the water to boil.
  answer: B
  explanation: If it starts to rain on a hot day, pavement can be very slippery for
    the first few minutes because heat causes oil in the asphalt to come to the surface,
    making it slippery until washed off.
- id: 305
  category: safe_driving_rules
  question: At approximately what speed can your tires lose all traction with the
    road during a heavy rain?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: While most tires have good traction up to about 35 mph on wet roads,
    in a heavy rain, your tires can lose all traction with the road at about 50 mph
    due to hydroplaning.
- id: 306
  category: defensive_driving
  question: If it feels like your tires have lost traction due to hydroplaning, what
    is the correct action to take?
  choices:
    A: Slam on the brakes immediately.
    B: Turn the steering wheel sharply to regain control.
    C: Ease your foot off the gas pedal and keep the steering wheel straight.
    D: Accelerate slightly to push through the water.
  answer: C
  explanation: If your tires lose traction, the manual instructs you to ease your
    foot off the gas pedal, keep the steering wheel straight, and do not try to stop
    or turn until your tires are gripping the road again.
- id: 307
  category: defensive_driving
  question: What is the first thing you should do if your vehicle begins to slide
    or skid?
  choices:
    A: Pump the brakes rapidly.
    B: Stay off the brake and take your foot off the accelerator.
    C: Steer in the opposite direction of the skid.
    D: Apply the emergency parking brake.
  answer: B
  explanation: If your vehicle begins to slide, you should stay off the brake (which
    could cause you to skid more) and take your foot off the accelerator to slow down.
- id: 308
  category: defensive_driving
  question: If you see an animal in the road and do not have time to stop, what is
    the safest course of action?
  choices:
    A: Swerve sharply into the oncoming traffic lane.
    B: Swerve sharply into the ditch.
    C: Honk your horn and accelerate.
    D: Do not swerve sharply; hitting the animal is safer than swerving into oncoming
      traffic or a ditch.
  answer: D
  explanation: The manual states that if there isn't time to stop, do not swerve sharply.
    A driver's chances of getting seriously hurt are decreased if they hit the animal
    and avoid swerving into oncoming traffic or rolling the vehicle in the ditch.
- id: 309
  category: safe_driving_rules
  question: 'When entering a high-speed roadway from an on-ramp, you should:'
  choices:
    A: Drive to the end of the ramp and stop before merging.
    B: Use the ramp to reach the speed of other vehicles before pulling onto the road.
    C: Enter the highway at a slow speed and gradually accelerate.
    D: Wait for a gap in traffic while stopped at the beginning of the ramp.
  answer: B
  explanation: High-speed roadways generally have ramps to give you time to build
    up speed. You should use the ramp to reach the speed of other vehicles before
    you pull onto the road, and you should not drive to the end of the ramp and stop.
- id: 310
  category: sharing_the_road
  question: When traveling on a controlled-access highway and you observe another
    driver entering from an on-ramp, what should you do?
  choices:
    A: Speed up to block them from entering.
    B: Maintain your lane and speed regardless of their position.
    C: Whenever possible, move to your left so that they may enter safely.
    D: Honk your horn to warn them to yield.
  answer: C
  explanation: The manual advises that when traveling on a controlled-access highway
    and you observe another driver entering, you should, whenever possible, move to
    your left so that they may enter safely.
- id: 311
  category: safe_driving_rules
  question: When exiting a high-speed, two-lane roadway using an exit ramp, when should
    you slow down?
  choices:
    A: A quarter-mile before the exit ramp.
    B: As soon as you turn on your turn signal.
    C: Do not slow down until you move onto the exit ramp.
    D: Only after you have reached the end of the exit ramp.
  answer: C
  explanation: When leaving traffic, you should signal your intent to exit and do
    not slow down until you move onto the exit ramp.
- id: 312
  category: sharing_the_road
  question: Under what condition must a slow-moving vehicle turn off the roadway?
  choices:
    A: When driving on any two-lane highway.
    B: When four or more vehicles are slowed up behind them and there is sufficient
      room for a safe turnout.
    C: When traveling at night.
    D: When approaching a steep grade or hill.
  answer: B
  explanation: The manual states that when four or more vehicles are slowed up, slow-moving
    vehicles must turn off the roadway whenever there is sufficient room for a safe
    turnout.
- id: 313
  category: defensive_driving
  question: If you become stranded in a snow storm, what is the best thing to do?
  choices:
    A: Leave your vehicle and walk to find help.
    B: Stay in the car because you are more likely to be found.
    C: Abandon the car and seek shelter in a ditch.
    D: Keep the engine running continuously to stay warm.
  answer: B
  explanation: According to the manual, if you become stranded in a snow storm, the
    best thing to do is stay in the car because you are more likely to be found.
- id: 314
  category: safe_driving_rules
  question: Where must slow-moving vehicles drive on the roadway?
  choices:
    A: In the extreme left lane
    B: In the center lane
    C: In the extreme right lane
    D: In any lane as long as their hazard lights are on
  answer: C
  explanation: According to the manual, slow-moving vehicles must drive in the extreme
    right lane of the roadway and turn off the roadway whenever there is sufficient
    room for a safe turnout.
- id: 315
  category: safe_driving_rules
  question: At 50 mph on dry pavement with good tires and brakes, approximately how
    far does it take to react and bring your vehicle to a stop?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 400 feet
  answer: D
  explanation: The manual states that at 50 mph, it can take about 400 feet to react
    to something you see and bring your vehicle to a stop, which is about the length
    of a city block.
- id: 316
  category: safe_driving_rules
  question: If you are driving at 30 mph, about how many feet will it take to stop
    your vehicle?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 400 feet
  answer: C
  explanation: At 30 mph, it can take about 200 feet to stop, which is almost half
    of a city block.
- id: 317
  category: driver_responsibility
  question: According to the manual, what is the cause of nine out of ten crashes?
  choices:
    A: Mechanical failure
    B: Errors in human judgment
    C: Poor weather conditions
    D: Defective roadways
  answer: B
  explanation: The manual explicitly states that nine out of ten crashes are caused
    by errors in human judgment.
- id: 318
  category: safe_driving_rules
  question: When driving at night, you must be able to stop within the distance you
    can see ahead with your headlights. Approximately how far is this?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: C
  explanation: You must be able to stop within the distance you can see ahead with
    your headlights, which is about 400 feet.
- id: 319
  category: defensive_driving
  question: In heavy rain, snow, or thick fog, your visibility may be reduced to 200
    feet. What is the maximum safe speed under these conditions?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: When you cannot see any farther than 200 feet ahead due to heavy rain,
    snow, or fog, you cannot safely drive faster than 30 mph.
- id: 320
  category: defensive_driving
  question: What is the most common cause of crashes between parallel parked cars
    and cars being driven on the street?
  choices:
    A: Speeding by the driver on the street
    B: Carelessness of the driver pulling away from the curb
    C: Doors opening into traffic
    D: Pedestrians walking between cars
  answer: B
  explanation: Most crashes between cars that are parallel parked and cars being driven
    on the street are caused by the carelessness of the driver pulling away from the
    curb.
- id: 321
  category: safe_driving_rules
  question: Which rule should you use to tell if you are driving too fast for your
    sight distance?
  choices:
    A: The Two-Second Rule
    B: The Three-Second Rule
    C: The Four Second Sight Distance Rule
    D: The Ten-Second Rule
  answer: C
  explanation: To tell if you are driving too fast for conditions, use the 'Four Second
    Sight Distance Rule.' If you reach a stationary object before you finish counting
    to four seconds, you are going too fast.
- id: 322
  category: penalties_and_points
  question: Can you get a ticket for driving under the posted speed limit?
  choices:
    A: No, as long as you are under the limit
    B: Yes, if you are traveling too fast for conditions like wet or icy roads
    C: Yes, but only in school zones
    D: No, speed limits are absolute minimums
  answer: B
  explanation: Even if you are driving under the posted speed limit, you can get a
    ticket for traveling too fast under conditions such as wet or icy roads, poor
    visibility, or heavy traffic.
- id: 323
  category: safe_driving_rules
  question: What is the standard rule for determining a safe following distance to
    avoid rear-end crashes?
  choices:
    A: The Two-Second Rule
    B: The Three-Second Rule
    C: The Four-Second Rule
    D: The One Car Length Rule
  answer: B
  explanation: There is an easy way to tell if you are following too closely. It is
    called the 'Three-Second Rule,' and it works at any speed.
- id: 324
  category: sharing_the_road
  question: In which of the following situations should you increase your following
    distance to four seconds?
  choices:
    A: When driving on dry pavement
    B: When following a motorcycle
    C: When driving in a residential area
    D: When passing a bicyclist
  answer: B
  explanation: You need a four-second following distance when following motorcycles,
    because if the motorcycle should fall, you need extra distance to avoid the rider.
- id: 325
  category: defensive_driving
  question: What should you do if you are being tailgated and there is no right lane
    to move into?
  choices:
    A: Tap your brakes quickly to warn the driver
    B: Speed up to increase the distance
    C: Wait until the way is clear and reduce speed slowly
    D: Turn on your hazard lights and stop in the lane
  answer: C
  explanation: If you are being followed too closely and there is no right lane, wait
    until the way is clear then reduce speed slowly to encourage the tailgater to
    drive around you. Never slow down quickly.
- id: 326
  category: defensive_driving
  question: Why should you leave extra space when stopped on a hill behind another
    vehicle?
  choices:
    A: To allow pedestrians to cross between vehicles
    B: The vehicle ahead may roll back when it starts up
    C: To give yourself room to make a U-turn
    D: To prevent exhaust fumes from entering your car
  answer: B
  explanation: You should leave extra space when stopped on a hill because the vehicle
    ahead may roll back when it starts up.
- id: 327
  category: defensive_driving
  question: 'To maintain a safe space to the side of your vehicle on a multi-lane
    road, you should:'
  choices:
    A: Drive right next to other vehicles to block wind
    B: Crowd the center line
    C: Avoid driving next to other vehicles by moving ahead or dropping back
    D: Weave between lanes to keep other drivers alert
  answer: C
  explanation: You should avoid driving next to other vehicles on multi-lane roads
    because someone may crowd your lane or try to change lanes. Move ahead or drop
    to the back of the other vehicle.
- id: 328
  category: safe_driving_rules
  question: Which of the following is considered a 'trouble spot' where your room
    to maneuver is limited and you need to lower your speed?
  choices:
    A: Toll plazas
    B: Open highways
    C: Rural two-lane roads
    D: Interstate passing lanes
  answer: A
  explanation: Toll plazas are listed as trouble spots where vehicles are changing
    lanes, preparing to stop, and speeding up again, requiring you to lower your speed.
- id: 329
  category: defensive_driving
  question: What should you do to avoid driving next to other vehicles on multi-lane
    roads?
  choices:
    A: Honk your horn to warn them of your presence.
    B: Move ahead or drop to the back of the other vehicle.
    C: Drive on the shoulder of the road.
    D: Swerve slightly into their lane to encourage them to move.
  answer: B
  explanation: The manual advises to avoid driving next to other vehicles on multi-lane
    roads by moving ahead or dropping to the back of the other vehicle, preventing
    them from crowding your lane.
- id: 330
  category: defensive_driving
  question: What does the 'Split the Difference Rule' mean when you are facing two
    hazards?
  choices:
    A: Speed up to pass both hazards as quickly as possible.
    B: Pull completely off the road and wait for both hazards to pass.
    C: Steer a middle course between the hazards, leaving a little more space on the
      side of the more dangerous hazard.
    D: Drive as close to the smaller hazard as possible to avoid the larger one.
  answer: C
  explanation: The 'Split the Difference Rule' means to steer a middle course between
    two hazards. If one is more dangerous, you should leave a little more space on
    the danger side.
- id: 331
  category: safe_driving_rules
  question: How large of a gap do you need anytime you want to merge with other traffic,
    change lanes, or enter a roadway?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: You need a gap of about four seconds anytime you want to merge with
    other traffic, change lanes, enter a roadway, or when your lane merges with another
    travel lane.
- id: 332
  category: safe_driving_rules
  question: If you want to cross several lanes of traffic, what is the safest way
    to do so?
  choices:
    A: Cross all lanes at once to minimize your time in the intersection.
    B: Wait until all lanes are completely clear before moving.
    C: Speed up and cross at a sharp angle.
    D: Take them one at a time, merging one lane at a time.
  answer: D
  explanation: If you want to cross several lanes, take them one at a time. It is
    safest and easiest to merge one lane at a time, just like going up or down stairs
    one step at a time.
- id: 333
  category: safe_driving_rules
  question: What should you do if you have a green light but there are vehicles blocking
    the intersection ahead?
  choices:
    A: Proceed into the intersection and wait for them to move.
    B: Do not start across the intersection until the path is clear.
    C: Honk your horn until the intersection clears.
    D: Steer around the blocking vehicles by using the crosswalk.
  answer: B
  explanation: Even if you have a green light, do not start across the intersection
    if there are cars blocking your way. If you get caught in the intersection when
    the light turns red, you will block traffic and can get a ticket.
- id: 334
  category: sharing_the_road
  question: Why should you not turn just because an approaching motorcycle has a turn
    signal on?
  choices:
    A: Motorcycles are not legally required to use turn signals.
    B: Motorcycles always turn from the center lane.
    C: Motorcycle signals often do not cancel by themselves.
    D: The motorcycle is likely signaling to pass, not turn.
  answer: C
  explanation: Do not turn just because an approaching vehicle has a turn signal on.
    This is particularly true of motorcycles because their signals often do not cancel
    by themselves. Wait until the driver actually starts to turn.
- id: 335
  category: safe_driving_rules
  question: At a speed of 55 mph, approximately how many seconds do you need to pass
    another vehicle safely?
  choices:
    A: 4 seconds
    B: 7 seconds
    C: 10 seconds
    D: 15 seconds
  answer: C
  explanation: As a general rule, at a speed of 55 mph, you need about 10 seconds
    to pass. That means you need a 10-second gap in oncoming traffic.
- id: 336
  category: safe_driving_rules
  question: At 55 mph, how much distance do you need to safely pass another vehicle?
  choices:
    A: Over 1600 feet or about one-third of a mile
    B: 800 feet or about one-sixth of a mile
    C: 500 feet
    D: One full mile
  answer: A
  explanation: At 55 mph you will travel over 800 feet in 10 seconds, and so will
    an oncoming vehicle. Therefore, you need over 1600 feet or about one-third of
    a mile to pass safely.
- id: 337
  category: safe_driving_rules
  question: You should not start to pass a vehicle if you are within what distance
    of a hill or a curve?
  choices:
    A: One-quarter of a mile
    B: One-third of a mile
    C: One-half of a mile
    D: One mile
  answer: B
  explanation: You should treat a curve or a hill as you do an oncoming vehicle. This
    means you should not start to pass if you are within one-third of a mile of a
    hill or a curve.
- id: 338
  category: safe_driving_rules
  question: When is it safe to return to the driving lane after passing another vehicle?
  choices:
    A: When you are one car length ahead of the passed vehicle.
    B: When the driver you passed flashes their headlights.
    C: When you can see both headlights of the vehicle you just passed in your rearview
      mirror.
    D: As soon as your rear bumper clears the front bumper of the passed vehicle.
  answer: C
  explanation: Before you return to the driving lane, be sure to leave enough room.
    When you can see both headlights of the vehicle you just passed in your rearview
    mirror, it is safe to return to the driving lane.
- id: 339
  category: sharing_the_road
  question: What is illegal to do when approaching or passing a horse being ridden
    or led along a road?
  choices:
    A: Slowing down
    B: Stopping if the rider signals you to do so
    C: Sounding your horn
    D: Leaving plenty of room
  answer: C
  explanation: The law requires you to exercise due care when approaching a horse.
    It is illegal to sound your horn when approaching or passing a horse.
- id: 340
  category: defensive_driving
  question: If another driver makes a mistake, such as passing you when they do not
    have enough room, what should you do?
  choices:
    A: Speed up to prevent them from entering your lane.
    B: Honk your horn and maintain your speed.
    C: Slow down and let them return to the driving lane safely.
    D: Swerve into the oncoming lane to give them space.
  answer: C
  explanation: If another driver makes a mistake, do not make it worse. For example,
    if a driver passes you when they do not have enough room, slow down and let them
    return to the driving lane.
- id: 341
  category: sharing_the_road
  question: How should you share a lane with a pedestrian or bicyclist?
  choices:
    A: Drive as close to the center line as possible while staying in the same lane.
    B: Honk to let them know you are passing in the same lane.
    C: Do not share a lane with a pedestrian or bicyclist; wait until it is safe to
      pass in the adjoining lane.
    D: Speed up to pass them quickly in the same lane.
  answer: C
  explanation: 'The manual states: ''Do not share a lane with a pedestrian or bicyclist.
    Wait until it is safe to pass in the adjoining lane.'''
- id: 342
  category: safe_driving_rules
  question: When crossing traffic, when is it considered safe to stop halfway across
    the road?
  choices:
    A: Whenever there is a gap in traffic from the left.
    B: Only when there is a median divider large enough to hold your entire vehicle.
    C: When you are turning left and the light turns yellow.
    D: It is never safe to stop halfway across a road.
  answer: B
  explanation: Stopping halfway across is only safe when there is a median divider
    large enough to hold your car. Do not stop in a divider where part of your vehicle
    is sticking out into traffic.
- id: 343
  category: defensive_driving
  question: What should you do if another driver attempts to pass you but does not
    have enough room?
  choices:
    A: Speed up to get out of their way.
    B: Honk your horn and maintain your speed.
    C: Slow down and let them return to the drive lane safely.
    D: Move onto the shoulder and stop completely.
  answer: C
  explanation: The manual states that if another driver makes a mistake, such as passing
    when they do not have enough room, you should slow down and let them return to
    the drive lane safely.
- id: 344
  category: safe_driving_rules
  question: What should you do when driving at dusk or on overcast days?
  choices:
    A: Drive with your four-way flashers on.
    B: Turn on your vehicle lights.
    C: Drive with your parking lights on.
    D: Not turn any vehicle lights on.
  answer: B
  explanation: According to the Chapter 5 Quiz in the manual, at dusk or on overcast
    days, you should turn on your vehicle lights.
- id: 345
  category: sharing_the_road
  question: Why should you exercise caution when passing a bicycle?
  choices:
    A: Bicycles always have the right-of-way.
    B: The cyclist may have to swerve into traffic to avoid an object on the road.
    C: Bicycles are required to ride on the sidewalk.
    D: Oncoming traffic cannot see bicycles.
  answer: B
  explanation: The manual notes that you should be cautious when passing a bicycle
    because the cyclist may have to swerve into traffic to avoid an object on the
    road.
- id: 346
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, how far down
    the road should you look?
  choices:
    A: 2 seconds ahead of your vehicle.
    B: 4 seconds ahead of your vehicle.
    C: 10 seconds ahead of your vehicle.
    D: 15 seconds ahead of your vehicle.
  answer: C
  explanation: The Chapter 5 Quiz states that in order to avoid last-minute braking,
    or the need to turn, you should look down the road at least 10 seconds ahead of
    your vehicle.
- id: 347
  category: safe_driving_rules
  question: Which of the following best describes "hydroplaning"?
  choices:
    A: Your tires pushing water out of their paths.
    B: Your tires throwing water to the rear, causing problems for following vehicles.
    C: Your tires actually floating on a film of water.
    D: Your vehicle sliding on black ice.
  answer: C
  explanation: The manual describes "hydroplaning" as your tires actually floating
    on a film of water.
- id: 348
  category: license_system
  question: What is the minimum vision requirement to pass the Montana driver license
    vision test?
  choices:
    A: 20/20 vision in both eyes.
    B: 20/30 vision in at least one eye.
    C: 20/40 vision in at least one eye.
    D: 20/50 vision in both eyes.
  answer: C
  explanation: Montana requires that you pass a vision test measuring at least 20/40
    vision in at least one eye, with or without corrective lenses.
- id: 349
  category: penalties_and_points
  question: What could happen if your driver license indicates you must wear corrective
    lenses, but you are stopped while driving without them?
  choices:
    A: You will be given a warning.
    B: You could get a ticket.
    C: Your vehicle will be impounded.
    D: Your license will be permanently revoked.
  answer: B
  explanation: 'The manual states: "If your driver license says you must wear corrective
    lenses and you are not and you happen to be stopped, you could get a ticket."'
- id: 350
  category: safe_driving_rules
  question: Why should you avoid wearing dark glasses or tinted contact lenses when
    driving at night?
  choices:
    A: They can cause you to fall asleep faster.
    B: They reflect oncoming headlights into your eyes.
    C: They cut too much light that you need in order to see clearly.
    D: They are illegal to wear at any time while driving.
  answer: C
  explanation: You should avoid using dark glasses or tinted contact lenses at night
    because they cut too much light that you need in order to see clearly.
- id: 351
  category: driver_responsibility
  question: How do the driving records of hearing-impaired drivers compare to those
    of drivers with good hearing?
  choices:
    A: They are significantly worse due to the inability to hear sirens.
    B: They are just as good as those of drivers with good hearing.
    C: They have more minor accidents but fewer fatal crashes.
    D: They are better because they drive at slower speeds.
  answer: B
  explanation: Studies have shown that the driving records of hearing-impaired drivers
    are just as good as those drivers with good hearing, as they learn to rely more
    on their vision and stay alert.
- id: 352
  category: driver_responsibility
  question: To help prevent fatigue on a long trip, how often should you take a rest
    break?
  choices:
    A: Every hour.
    B: Every two hours or so.
    C: Every four hours.
    D: Only when you need to refuel your vehicle.
  answer: B
  explanation: To prevent fatigue, the manual recommends taking breaks by stopping
    every two hours or so, or when you need to.
- id: 353
  category: alcohol_drugs_health
  question: Approximately what percentage of fatal crashes involve alcohol?
  choices:
    A: 10%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: The manual states that alcohol is involved in approximately 40% of
    fatal crashes.
- id: 354
  category: alcohol_drugs_health
  question: How quickly can alcohol affect your brain after it is consumed?
  choices:
    A: Within one minute.
    B: Within fifteen minutes.
    C: Within thirty minutes.
    D: Within one hour.
  answer: A
  explanation: Alcohol can be absorbed through the walls of the stomach, and can affect
    your brain within one minute.
- id: 355
  category: alcohol_drugs_health
  question: Why are new drivers more affected by alcohol than experienced drivers?
  choices:
    A: New drivers typically consume higher amounts of alcohol.
    B: New drivers have slower natural reflexes.
    C: New drivers are still learning to drive.
    D: New drivers are more likely to drive at night.
  answer: C
  explanation: New drivers are more affected by alcohol than experienced drivers because
    new drivers are still learning to drive.
- id: 356
  category: defensive_driving
  question: Judging distances and speeds is especially important when performing which
    of the following maneuvers?
  choices:
    A: Parallel parking on a one-way street.
    B: Merging and passing on two-lane roads.
    C: Stopping at a four-way intersection.
    D: Yielding to pedestrians in a crosswalk.
  answer: B
  explanation: The manual states that judging distances and speeds is especially important
    in knowing how far you are from other vehicles and judging safe gaps when merging,
    and when passing on two lane roads.
- id: 357
  category: alcohol_drugs_health
  question: On average, how long does it take for a person's body to process one alcoholic
    drink?
  choices:
    A: 30 minutes
    B: One hour
    C: Two hours
    D: Four hours
  answer: B
  explanation: The average person's body will process one alcoholic drink in one hour.
    Alcohol can still accumulate if you drink at a rate of one drink per hour.
- id: 358
  category: alcohol_drugs_health
  question: Which of the following is considered equivalent to one standard alcoholic
    drink?
  choices:
    A: 16 ounces of commercial beer
    B: 8 ounces of wine
    C: 1-1/2 ounces of 80-proof liquor
    D: 3 ounces of 80-proof liquor
  answer: C
  explanation: One alcoholic drink is defined as 1-1/2 ounces of 80-proof liquor,
    12 ounces of commercial beer, or a 5-ounce glass of wine.
- id: 359
  category: penalties_and_points
  question: What is the legal blood alcohol concentration (BAC) limit for a driver
    under 21 years of age in Montana?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: B
  explanation: The BAC limit for a driver under 21 years of age is 0.02%.
- id: 360
  category: penalties_and_points
  question: You can be arrested for driving under the influence if your blood alcohol
    concentration (BAC) is at or above what percentage?
  choices:
    A: 0.04%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: You can be arrested for driving with a blood alcohol concentration
    (BAC) of 0.08% or more, or while driving under the influence.
- id: 361
  category: penalties_and_points
  question: What is the penalty if you refuse to take a blood alcohol concentration
    (BAC) test when asked by a police officer?
  choices:
    A: You will receive a warning.
    B: You can lose your driver license.
    C: You will be fined exactly $50.
    D: You must attend a defensive driving course.
  answer: B
  explanation: If a police officer asks you to take a test, you must do so. You can
    lose your driver license if you refuse to take a BAC test.
- id: 362
  category: penalties_and_points
  question: Which of the following is a potential penalty for a first conviction of
    an alcohol violation?
  choices:
    A: A fine of $100 to $200
    B: License suspension for one year
    C: 1 to 60 days in jail
    D: Permanent revocation of your license
  answer: C
  explanation: If you are found guilty of an alcohol violation and it is your first
    conviction, you could be sentenced to 1 to 60 days in jail, fined $300 to $1000,
    and have your license suspended for six months.
- id: 363
  category: safe_driving_rules
  question: Where is it legal to keep an open alcoholic beverage container in a motor
    vehicle?
  choices:
    A: In the center console cup holder
    B: Under the driver's seat
    C: In the passenger's lap
    D: In a locked glove compartment
  answer: D
  explanation: Open alcoholic beverage containers must be kept in a locked glove compartment,
    trunk, cargo compartment, or behind the last upright seat if there is no trunk.
- id: 364
  category: driver_responsibility
  question: What information should you provide when calling the "Report A Drunk Driver"
    program?
  choices:
    A: The driver's full name and address
    B: A description of the vehicle and the direction it is traveling
    C: Your own driver license number
    D: Photographic evidence of the driver
  answer: B
  explanation: Citizens are asked to call their local law enforcement agency or the
    Montana Highway Patrol and give a description of the vehicle and the direction
    in which the suspected vehicle is traveling.
- id: 365
  category: alcohol_drugs_health
  question: What does a drug warning about "operating heavy machinery" mean for drivers?
  choices:
    A: You can drive a car, but not a commercial truck.
    B: You should only drive during daylight hours.
    C: Do not drive your car or truck.
    D: You must drive at least 10 mph below the speed limit.
  answer: C
  explanation: Drug warnings about operating heavy machinery mean DO NOT DRIVE YOUR
    CAR OR TRUCK.
- id: 366
  category: alcohol_drugs_health
  question: According to the manual, how does marijuana use affect driving?
  choices:
    A: It improves night vision.
    B: It causes drivers to have slower reflexes and trouble adjusting to glare.
    C: It increases alertness and concentration.
    D: It has no effect if used with a medical prescription.
  answer: B
  explanation: Studies have shown that people who use marijuana – even with a prescription
    - make more mistakes, have slower reflexes, and have more trouble adjusting to
    glare.
- id: 367
  category: alcohol_drugs_health
  question: What is required for a person suffering from epilepsy to operate a motor
    vehicle safely?
  choices:
    A: They must wear sunglasses at all times.
    B: They need a physician to attest in writing that their condition has stabilized.
    C: They are only allowed to drive during daylight hours.
    D: They must take a driving test every six months.
  answer: B
  explanation: A person suffering from epilepsy needs a physician to attest in writing
    that the person’s condition has stabilized and would not likely interfere with
    a person’s ability to safely operate a motor vehicle.
- id: 368
  category: alcohol_drugs_health
  question: Why should diabetics who take insulin be cautious about driving?
  choices:
    A: Insulin causes immediate drowsiness.
    B: They could go into shock from skipping a meal or taking the wrong insulin amount.
    C: Insulin permanently impairs peripheral vision.
    D: They are legally required to have a specialized driver's license.
  answer: B
  explanation: Diabetics who take insulin should not drive when there is any chance
    of going into shock. Such a situation could result from skipping a meal or snack,
    or from taking the wrong amount of insulin.
- id: 369
  category: driver_responsibility
  question: What should you do if you are angry or excited before you drive?
  choices:
    A: Drive faster to get to your destination sooner.
    B: Turn up the radio to drown out your thoughts.
    C: Give yourself time to cool off and stay off the road until you have calmed
      down.
    D: Roll down the windows to get fresh air while driving.
  answer: C
  explanation: If you are angry or excited, give yourself time to cool off. If necessary,
    take a short walk, but stay off the road until you have calmed down.
- id: 370
  category: alcohol_drugs_health
  question: What physical changes often develop gradually in older drivers that can
    affect their ability to handle emergencies?
  choices:
    A: Increased impulsivity and aggression
    B: Deterioration of vision, hearing, and reaction time
    C: Sudden onset of epilepsy
    D: Increased tolerance to alcohol
  answer: B
  explanation: Deterioration of vision, hearing, and reaction time develops almost
    unnoticed until we find ourselves faced with an emergency that we are no longer
    equipped to handle.
- id: 371
  category: safe_driving_rules
  question: In terms of miles traveled, the accident rate of drivers 65 and over is
    exceeded only by which age group?
  choices:
    A: Drivers aged 25 to 35
    B: Drivers under 24 years old
    C: Drivers aged 40 to 50
    D: Drivers aged 55 to 64
  answer: B
  explanation: According to the manual, the accident rate of drivers 65 and over,
    in terms of miles traveled, is exceeded only by the rate of drivers under 24 years
    old.
- id: 372
  category: safe_driving_rules
  question: Which of the following is a frequently reported error made by older drivers?
  choices:
    A: Driving too fast for conditions
    B: Tailgating other vehicles
    C: Unreasonably slow driving on busy highways
    D: Excessive lane changing
  answer: C
  explanation: Frequently reported errors made by older drivers include inattention,
    failure to drive in the proper lane, failure to signal or to observe stop signs
    and signals, and unreasonably slow driving on busy highways.
- id: 373
  category: license_system
  question: If a driver chooses to give up their driving privilege and turns in their
    license more than six months before it expires, what are they eligible to receive?
  choices:
    A: A partial refund of their license fee
    B: A free lifetime bus pass
    C: An identification card at no charge
    D: A restricted driver's license
  answer: C
  explanation: If you turn in your license before it's eligible for renewal (more
    than six months before it expires), you can receive an identification card at
    no charge.
- id: 374
  category: safe_driving_rules
  question: To help relieve fatigue on a long trip, it is a good idea to do what?
  choices:
    A: Drink a large amount of caffeine
    B: Stop for a rest every two hours
    C: Drive with one eye open at a time
    D: Change feet on the gas pedal
  answer: B
  explanation: The Chapter 6 Quiz confirms that to help relieve fatigue on a trip,
    it is a good idea to stop for a rest every two hours.
- id: 375
  category: alcohol_drugs_health
  question: What is the main reason why drinking alcohol and then driving is so dangerous?
  choices:
    A: It makes you overly cautious
    B: It improves your reflexes but blurs your vision
    C: It affects your judgment and skill
    D: It causes sudden engine failure
  answer: C
  explanation: The Chapter 6 Quiz notes that the main reason why drinking alcohol
    and then driving is so dangerous is that it affects your judgment and skill.
- id: 376
  category: driver_responsibility
  question: How can stress affect your driving?
  choices:
    A: By making you more aware of others around you
    B: By decreasing your chances of an accident
    C: By lessening your concentration on the driving task
    D: By improving your physical dexterity
  answer: C
  explanation: According to the Chapter 6 Quiz, stress can affect your driving by
    lessening your concentration on the driving task.
- id: 377
  category: alcohol_drugs_health
  question: What is the number one killer on Montana's roads?
  choices:
    A: Poor or unkempt roads
    B: Inclement weather/driving conditions
    C: Excessive speed
    D: Drunk drivers
  answer: D
  explanation: The Chapter 6 Quiz identifies drunk drivers as the number one killer
    on Montana's roads.
- id: 378
  category: defensive_driving
  question: What is the first thing you should do if your brakes suddenly stop working?
  choices:
    A: Shift into neutral and coast
    B: Pump the brake pedal several times
    C: Pull the parking brake as hard as you can
    D: Turn off the engine immediately
  answer: B
  explanation: If your brakes stop working, the manual advises to first pump the brake
    pedal several times, as this often builds up enough brake pressure to let you
    stop.
- id: 379
  category: defensive_driving
  question: When using the parking brake to stop a vehicle after regular brake failure,
    why should you pull the handle slowly?
  choices:
    A: To avoid breaking the handle
    B: To prevent the engine from stalling
    C: To avoid locking the rear wheels and causing a skid
    D: To activate the anti-lock braking system
  answer: C
  explanation: The manual states to pull on the parking brake handle slowly so you
    will not lock the rear wheels and cause a skid.
- id: 380
  category: defensive_driving
  question: What is the proper response if a tire suddenly goes flat while driving?
  choices:
    A: Slam on the brakes and pull over immediately
    B: Hold the steering wheel tightly, keep going straight, and slow down gradually
    C: Accelerate slightly to maintain control of the vehicle
    D: Turn the steering wheel sharply toward the side of the blowout
  answer: B
  explanation: If a tire suddenly goes flat, you should hold the steering wheel tightly,
    keep the vehicle going straight, and slow down gradually by taking your foot off
    the gas and using the brakes lightly.
- id: 381
  category: vehicle_information
  question: If your vehicle experiences a power failure and the engine dies while
    driving, what should you expect?
  choices:
    A: The steering wheel will lock completely
    B: The brakes will stop working entirely
    C: The steering will be difficult to turn and you may have to push very hard on
      the brake pedal
    D: The vehicle will automatically shift into park
  answer: C
  explanation: During a power failure, the manual notes that steering may be difficult
    to turn, and while the brakes will still work, you may have to push very hard
    on the brake pedal.
- id: 382
  category: defensive_driving
  question: What should you do if your headlights suddenly go out while driving at
    night and the headlight switch and high beams do not work?
  choices:
    A: Continue driving slowly using the moonlight
    B: Turn on your emergency flashers, turn signals, or fog lights
    C: Stop immediately in the middle of the road
    D: Close your eyes and brake hard
  answer: B
  explanation: If trying the headlight switch and high beams does not work, the manual
    advises to turn on the emergency flashers, turn signals, or fog lights if you
    have them, and pull off the road as soon as safely possible.
- id: 383
  category: defensive_driving
  question: What should you do first if your gas pedal sticks and the motor keeps
    going faster and faster?
  choices:
    A: Turn off the ignition immediately
    B: Shift into reverse
    C: Quickly shift to neutral and apply steady pressure on the brake
    D: Pump the brake pedal rapidly
  answer: C
  explanation: If the gas pedal sticks, you should keep your eyes on the road, quickly
    shift to neutral, apply steady pressure on the brake, and pull off the road.
- id: 384
  category: defensive_driving
  question: If your vehicle's right wheels drift off the pavement, how should you
    safely return to the road?
  choices:
    A: Jerk the steering wheel sharply to the left
    B: Brake hard and stop on the shoulder
    C: Take your foot off the accelerator, steer parallel to the road, and ease back
      on when slowed down
    D: Accelerate to gain traction before turning back onto the road
  answer: C
  explanation: If you drift off the road, take your foot off the accelerator and steer
    parallel to the road. When slowed down, ease back on the road when it's safe with
    a small left quarter turn.
- id: 385
  category: safe_driving_rules
  question: What should you do first if your vehicle's right wheels leave the pavement?
  choices:
    A: Brake hard immediately
    B: Take your foot off the accelerator and steer parallel to the road
    C: Turn the steering wheel sharply to the left
    D: Speed up to regain traction
  answer: B
  explanation: The manual states that if your vehicle's right wheels leave the pavement,
    you should take your foot off the accelerator and steer parallel to the road,
    braking only when you are back on the pavement.
- id: 386
  category: defensive_driving
  question: According to the manual, what are a driver's three options to avoid a
    collision?
  choices:
    A: Stop, turn, and speed up
    B: Brake, honk, and swerve
    C: Stop, reverse, and turn
    D: Accelerate, brake, and brace
  answer: A
  explanation: 'In avoiding a collision, the manual states that drivers have three
    options: (1) stop, (2) turn, and (3) speed up.'
- id: 387
  category: vehicle_information
  question: 'If you need to stop quickly and your vehicle is equipped with an Anti-lock
    Braking System (ABS), you should:'
  choices:
    A: Pump the brakes rapidly to avoid skidding
    B: Press the brake pedal as hard as you can and keep pressing on it
    C: Apply the brakes lightly and steer away
    D: Press the brake pedal hard and let up if you feel it pushing back
  answer: B
  explanation: With ABS, if you need to stop quickly, you should press on the brake
    pedal as hard as you can and keep pressing on it. You should not let up on the
    brake pedal even if you feel it pushing back.
- id: 388
  category: vehicle_information
  question: What should you do if you must stop quickly in a vehicle without ABS and
    the brakes lock up?
  choices:
    A: Keep pressing the brake pedal harder
    B: Quickly let up on the brake pedal
    C: Turn the steering wheel sharply
    D: Apply the parking brake
  answer: B
  explanation: In a vehicle without ABS, if the brakes lock up, you will feel the
    vehicle start to skid. You must quickly let up on the brake pedal, and as soon
    as the vehicle stops skidding, push down on the brake pedal again.
- id: 389
  category: defensive_driving
  question: When turning quickly to avoid a collision in a vehicle without ABS, why
    is it helpful to step on the brake pedal and then let up before turning?
  choices:
    A: It locks the front wheels to prevent skidding
    B: It puts more weight on the front tires, allowing for a quicker turn
    C: It activates the electronic stability control
    D: It shifts the vehicle's weight to the rear tires
  answer: B
  explanation: Without ABS, braking will slow the vehicle some, and it puts more weight
    on the front tires, which allows for a quicker turn.
- id: 390
  category: defensive_driving
  question: 'If you are about to be hit from the rear, you should:'
  choices:
    A: Lean forward away from the seat back
    B: Take your hands off the steering wheel
    C: Press yourself against the back of your seat and be ready to apply your brakes
    D: Turn your vehicle to avoid a direct hit
  answer: C
  explanation: If your vehicle is hit from the rear, your body will be thrown backward.
    You should press yourself against the back of your seat, put your head against
    the head restraint, and be ready to apply your brakes so you are not pushed into
    another vehicle.
- id: 391
  category: driver_responsibility
  question: What should you do with your vehicle if you are involved in a crash and
    the vehicle can still move?
  choices:
    A: Leave it exactly where it is until police arrive
    B: Get it off the road so that it does not block traffic
    C: Drive it to the nearest police station
    D: Move it to the center median and turn on your high beams
  answer: B
  explanation: At an accident scene, if your vehicle can move, you should get it off
    the road so that it does not block traffic.
- id: 392
  category: driver_responsibility
  question: When is it appropriate to move an injured person at the scene of an accident?
  choices:
    A: Whenever they ask to be moved
    B: Only when they are in a burning car or other immediate danger
    C: When they are blocking the flow of traffic
    D: As soon as emergency medical services are called
  answer: B
  explanation: 'The manual states: ''Do not move the injured, unless they are in a
    burning car or in other immediate danger. Moving a person can make their injuries
    worse.'''
- id: 393
  category: driver_responsibility
  question: 'If someone is injured in a crash and asks for water, you should:'
  choices:
    A: Give them a small amount of water
    B: Give them a warm beverage to prevent shock
    C: Not give them anything to drink
    D: Give them water only if they are not bleeding
  answer: C
  explanation: 'When dealing with an injured person at an accident scene, the manual
    explicitly states: ''Do not give injured persons anything to drink, not even water.'''
- id: 394
  category: driver_responsibility
  question: What must you do if you are involved in an accident with a parked vehicle
    and cannot find the owner?
  choices:
    A: Wait by the vehicle until the owner returns
    B: Leave a note in a visible place with your contact information and the date
      and time of the accident
    C: Report the accident to your insurance company and leave the scene
    D: Call a tow truck to remove the parked vehicle
  answer: B
  explanation: If an accident involves a parked car and you cannot find the owner,
    you must leave a note in a place where it can be seen with information on how
    the owner can reach you and the date and time of the accident.
- id: 395
  category: penalties_and_points
  question: 'You must immediately report an accident to law enforcement if property
    damage is at least:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: You must report an accident immediately to law enforcement if anyone
    is injured or killed, or property damage is $500 or more.
- id: 396
  category: driver_responsibility
  question: How many days do you have to file an accident report after a crash?
  choices:
    A: 3 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: According to the manual, you must file the accident report within 10
    days of the accident.
- id: 397
  category: sharing_the_road
  question: What must you do when approached by an emergency vehicle using its audio
    and visual signals?
  choices:
    A: Stop immediately in your current lane
    B: Speed up to get out of the emergency vehicle's way
    C: Yield the right-of-way and drive as close as possible to the right-hand edge
      or curb of the road
    D: Move to the left lane and slow down
  answer: C
  explanation: Montana state law requires that all non-emergency vehicles yield the
    right-of-way and immediately drive to a position parallel and as close as possible
    to the right-hand edge or curb of the road when an emergency vehicle approaches
    using audio and visual signals.
- id: 398
  category: driver_responsibility
  question: How should you treat a bleeding wound on an injured person at an accident
    scene?
  choices:
    A: Apply a tourniquet above the wound
    B: Wash the wound with water
    C: Apply direct pressure directly on the wound with your hand or a cloth
    D: Elevate the wound and wait for paramedics
  answer: C
  explanation: If there is bleeding, you should apply direct pressure directly on
    the wound with your hand or with a cloth. Even severe bleeding can almost always
    be stopped or slowed by using pressure.
- id: 399
  category: sharing_the_road
  question: What must you do on a highway with a posted speed limit of 50 MPH or more
    when approaching a stationary emergency vehicle displaying emergency signals in
    the adjacent lane?
  choices:
    A: Stop immediately and wait for the vehicle to move
    B: Slow down to a speed of at least 20 miles below the posted speed limit
    C: Maintain your speed but honk your horn to acknowledge them
    D: Speed up to pass the emergency vehicle as quickly as possible
  answer: B
  explanation: On highways with a posted speed limit of 50 MPH or more, vehicles in
    a lane directly next to a stationary emergency or police vehicle displaying emergency
    signals must slow down to a speed of at least 20 miles below the posted speed
    limit.
- id: 400
  category: safe_driving_rules
  question: How should you acknowledge a law enforcement officer's presence when you
    are being pulled over?
  choices:
    A: Turn on your hazard lights
    B: Wave your hand out the window
    C: Turn on your right turn signal
    D: Tap your brakes three times
  answer: C
  explanation: If a law enforcement officer pulls you over, acknowledge the officer's
    presence by turning on your right turn signal. This lets the officer know that
    you recognize their presence.
- id: 401
  category: safe_driving_rules
  question: Where is the safest and most appropriate place to pull over during an
    enforcement stop?
  choices:
    A: The center median of the interstate
    B: The opposite side of a two-lane road
    C: The right shoulder of the road
    D: The middle of the nearest intersection
  answer: C
  explanation: You should move your vehicle onto the right shoulder of the road. Do
    not move onto the center median or the opposite side of a two-lane road, as this
    places both the driver and officer in danger.
- id: 402
  category: driver_responsibility
  question: During a traffic stop, why is it important for the driver and passengers
    to place their hands in clear view?
  choices:
    A: It is required by federal law for all passengers
    B: It prevents you from accidentally shifting gears
    C: It reduces the officer's level of feeling threatened
    D: It prepares you to hand over your license quickly
  answer: C
  explanation: An officer's inability to see the hands of the driver and all occupants
    increases the officer's level of feeling threatened, as most violent criminal
    acts against officers occur through the use of a person's hands.
- id: 403
  category: safe_driving_rules
  question: If your vehicle has tinted windows, what is recommended during an enforcement
    stop?
  choices:
    A: Roll them down after stopping on the right shoulder, before the officer makes
      contact
    B: Keep them rolled up until the officer taps on the glass
    C: Roll them down only halfway so the officer can slide your license through
    D: Turn on your interior dome light and leave the windows up
  answer: A
  explanation: If your windows are tinted, it is recommended that you roll them down
    after you have stopped your vehicle on the right shoulder of the road and before
    the officer makes contact with you.
- id: 404
  category: defensive_driving
  question: What should you do if your accelerator sticks while driving?
  choices:
    A: Reach down and attempt to pull it up
    B: Shift to park
    C: Shift to neutral and apply steady pressure on the brake
    D: Turn the engine off
  answer: C
  explanation: According to the Chapter 7 Quiz, if your accelerator sticks while driving,
    you should shift to neutral and apply steady pressure on the brake.
- id: 405
  category: penalties_and_points
  question: A driver license is considered a privilege that can be suspended, revoked,
    or cancelled for which of the following reasons?
  choices:
    A: Impaired driving
    B: Distracted driving
    C: Being a minor in possession
    D: All of the above
  answer: D
  explanation: Impaired driving, distracted driving, driving with a suspended or revoked
    license, and being a minor in possession are examples of choices that can cause
    you to lose your license.
- id: 406
  category: license_system
  question: Which of the following is NOT one of the five major categories of information
    featured on a Montana driving record?
  choices:
    A: Personal history information
    B: Vehicle maintenance history
    C: Conviction/accident history
    D: Driver license sanctions
  answer: B
  explanation: 'The five major categories on a driving record are: personal history
    information, licensing information, conviction/accident history, driver license
    sanctions, and motor vehicle accident history. Vehicle maintenance history is
    not included.'
- id: 407
  category: license_system
  question: At what age must young men be able to fulfill Selective Service registration
    requirements when applying for a Montana instruction permit, driver license, or
    ID?
  choices:
    A: At least 15 years old
    B: At least 16 years old
    C: At least 18 years old
    D: At least 21 years old
  answer: A
  explanation: Young men who are at least 15 years old and not older than 26 are required
    to register with the Selective Service when applying for an instruction permit,
    basic driver license, CDL, or Montana ID card.
- id: 408
  category: license_system
  question: What is the minimum age for a minor to request an organ donor designation
    on their driver license without parental authorization?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: A minor who is at least 15 years old can request an organ donor designation
    on his/her driver license. Parental authorization is not required.
- id: 409
  category: license_system
  question: How old must you be to choose to have your driver license indicate that
    you have a living will?
  choices:
    A: 15 or older
    B: 16 or older
    C: 18 or older
    D: 21 or older
  answer: C
  explanation: If you are 18 or older, you can choose to have your driver license
    indicate that you have a living will.
- id: 410
  category: alcohol_drugs_health
  question: 'According to the manual, being awake for 18 hours straight results in
    driving skills similar to:'
  choices:
    A: A newly licensed teenage driver
    B: Someone driving with a suspended license
    C: Someone under the influence of drugs or alcohol
    D: A driver using a hands-free cell phone
  answer: C
  explanation: After being awake for 18 hours straight, driving skills are the same
    as someone under the influence of drugs or alcohol.
- id: 411
  category: safe_driving_rules
  question: During a traffic stop, why should you remain inside your vehicle unless
    directed otherwise by the officer?
  choices:
    A: Exiting the vehicle is an automatic traffic violation
    B: Exiting increases the risk of being struck by passing vehicles and makes the
      officer feel threatened
    C: Exiting will automatically result in a vehicle search
    D: Exiting prevents the officer from checking your license plates
  answer: B
  explanation: Exiting your vehicle without first being directed by an officer can
    increase the risk of being struck by a passing vehicle and increase the officer's
    level of feeling threatened.
- id: 412
  category: driver_responsibility
  question: 'If involved in an accident, a driver should:'
  choices:
    A: Stop their vehicle at or near the scene
    B: Do not stand or walk in traffic lanes
    C: Turn off the ignitions of wrecked vehicles
    D: All of the above
  answer: D
  explanation: According to the Chapter 7 Quiz, if involved in an accident, a driver
    should stop their vehicle at or near the scene, not stand or walk in traffic lanes,
    and turn off the ignitions of wrecked vehicles (All of the above).
- id: 413
  category: safe_driving_rules
  question: According to a AAA Foundation for Traffic Safety study, what percentage
    of crashes in which a person was killed involved a drowsy driver?
  choices:
    A: 13%
    B: 21%
    C: 33%
    D: 50%
  answer: B
  explanation: A recent AAA Foundation for Traffic Safety study showed 21% of crashes
    in which a person was killed involved a drowsy driver.
- id: 414
  category: alcohol_drugs_health
  question: 'After being awake for 18 hours straight, a person''s driving skills are
    comparable to:'
  choices:
    A: A newly licensed teen driver.
    B: Someone driving in severe weather conditions.
    C: Someone under the influence of drugs or alcohol.
    D: A driver who is texting while driving.
  answer: C
  explanation: After being awake for 18 hours straight, driving skills are the same
    as someone under the influence of drugs or alcohol.
- id: 415
  category: signs_and_signals
  question: What information is listed on an Emergency Notification System (ENS) sign
    at a railroad crossing?
  choices:
    A: The train schedule and speed limit.
    B: A telephone number and a US DOT number.
    C: The distance to the nearest hospital.
    D: The maximum clearance height for trucks.
  answer: B
  explanation: The ENS is a sign posted at or near a crossing which lists a telephone
    number along with a US DOT number.
- id: 416
  category: safe_driving_rules
  question: At what core body temperature does a child's thermoregulatory system become
    overwhelmed, beginning heatstroke?
  choices:
    A: 99 degrees
    B: 101 degrees
    C: 104 degrees
    D: 107 degrees
  answer: C
  explanation: Heatstroke begins when the core body temperature reaches about 104
    degrees and the thermoregulatory system is overwhelmed.
- id: 417
  category: safe_driving_rules
  question: A core body temperature of about ______ is considered lethal for a child
    left in a hot vehicle.
  choices:
    A: 102 degrees
    B: 104 degrees
    C: 105 degrees
    D: 107 degrees
  answer: D
  explanation: A core body temperature of about 107 degrees is lethal.
- id: 418
  category: sharing_the_road
  question: What is the primary focus of the Truckers Against Trafficking (TAT) program?
  choices:
    A: Preventing the smuggling of illegal drugs across state lines.
    B: Fighting the crime of human trafficking on the nation's highways.
    C: Enforcing speed limits for commercial vehicles.
    D: Providing emergency roadside assistance to stranded motorists.
  answer: B
  explanation: Truckers Against Trafficking recognizes that members of the trucking
    industry and individual truckers are invaluable in the fight against the heinous
    crime of human trafficking.
- id: 419
  category: vehicle_information
  question: In what year did Montana begin issuing license plates?
  choices:
    A: '1891'
    B: '1913'
    C: '1914'
    D: '1928'
  answer: C
  explanation: Montana began issuing license plates in 1914. The first plate displayed
    only the plate number.
- id: 420
  category: vehicle_information
  question: What material were Montana license plates manufactured from in 1944 due
    to a wartime steel shortage?
  choices:
    A: Pressed soybean fiberboard
    B: Recycled aluminum
    C: Treated leather
    D: Heavy-duty cardboard
  answer: A
  explanation: During 1944, license plates were manufactured from pressed soybean
    fiberboard due to a shortage of steel caused by the war.
- id: 421
  category: vehicle_information
  question: When was the "Big Sky Country" slogan first used on Montana license plates?
  choices:
    A: '1933'
    B: '1950'
    C: '1967'
    D: '2010'
  answer: C
  explanation: The "Treasure State" slogan was first used in 1950 and changed to the
    popular "Big Sky Country" slogan in 1967.
- id: 422
  category: vehicle_information
  question: What did the prefix number on a Montana license plate designate starting
    in 1933?
  choices:
    A: The horsepower of the vehicle
    B: The county in which the vehicle was registered
    C: The population center as it existed in 1914
    D: The year the vehicle was manufactured
  answer: B
  explanation: In 1933, the prefix number was revised to designate the county in which
    that vehicle was registered.
- id: 423
  category: vehicle_information
  question: What unique feature was added to the Montana license plate for a single
    year in 1938?
  choices:
    A: The state map outline
    B: The words "PRISON MADE"
    C: A bison skull
    D: The "Treasure State" slogan
  answer: C
  explanation: The state map, which outlines the standard issue license plate of today,
    was first found on the 1933 orange and maroon plate, and the bison skull was first
    added for a single year in 1938.
- id: 424
  category: vehicle_information
  question: 'In 1913, taxation on motor vehicles was put into effect in Montana primarily
    to raise revenue for:'
  choices:
    A: Funding the state's public school system.
    B: The construction, maintenance, and improvement of public highways.
    C: Expanding the state's railroad infrastructure.
    D: Manufacturing the first state-issued license plates.
  answer: B
  explanation: Taxation on motor vehicles was put into effect in 1913 for the purpose
    of raising revenue for the construction, maintenance, and improvement of public
    highways.
- id: 425
  category: vehicle_information
  question: How many standard-issue plate designs does Montana currently offer?
  choices:
    A: One
    B: Three
    C: Five
    D: Over 190
  answer: C
  explanation: Montana currently offers five standard-issue plate designs and over
    190 specialty and collegiate plates.
- id: 426
  category: defensive_driving
  question: Which of the following is a common consequence of driving while drowsy?
  choices:
    A: Increased ability to process complex information.
    B: Faster reaction times to road conditions.
    C: Becoming careless when making driving decisions.
    D: Heightened awareness of potential crashes.
  answer: C
  explanation: If you drive while drowsy, you may become slower to respond... You
    may become careless when making driving decisions, have trouble paying attention,
    or actually fall asleep while driving.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 427
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 428
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 429
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 430
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 431
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 432
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 433
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 434
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 435
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 436
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 437
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 438
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 439
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 440
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 441
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 442
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 443
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 444
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 445
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 446
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 447
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 448
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 449
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 450
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 451
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 452
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 453
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 454
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 455
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 456
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 457
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 458
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle
    in this area. You may briefly stop to load or unload passengers.
  id: 459
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 460
