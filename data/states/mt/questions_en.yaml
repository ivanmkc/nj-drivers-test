metadata:
  source: 2025 Montana Driver's Manual
  total_questions: 248
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Montana, what is the minimum age a student can obtain an Instruction
    Permit if they are enrolled in a state-approved traffic education program?
  choices:
    A: 14 years old
    B: 14.5 years old
    C: 15 years old
    D: 16 years old
  answer: B
  explanation: According to the Montana Department of Justice Motor Vehicle Division,
    a student must be at least 14.5 years old and enrolled in an approved driver education
    course to receive an instruction permit.
- id: 2
  category: license_system
  question: Under the Montana GDL (Graduated Driver Licensing) program, how long must
    a teen hold an Instruction Permit before applying for a First-Year Restricted
    License?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Montana law requires permit holders to maintain a clean driving record
    for at least 6 consecutive months before they are eligible for the First-Year
    Restricted License.
- id: 3
  category: license_system
  question: To graduate to a First-Year Restricted License in Montana, a teen must
    complete how many hours of supervised driving practice?
  choices:
    A: 40 hours total, with 5 at night
    B: 50 hours total, with 10 at night
    C: 60 hours total, with 15 at night
    D: 30 hours total, with 10 at night
  answer: B
  explanation: Montana GDL requirements specify 50 hours of supervised driving, at
    least 10 of which must be at night, certified by a parent or legal guardian.
- id: 4
  category: license_system
  question: During the first 6 months of holding a Montana First-Year Restricted License,
    how many non-family passengers under age 18 are allowed in the vehicle?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: For the first 6 months of the restricted license, only one non-family
    passenger under age 18 is permitted unless supervised by a licensed adult.
- id: 5
  category: license_system
  question: What are the restricted nighttime driving hours for a Montana driver with
    a First-Year Restricted License?
  choices:
    A: 10:00 PM to 6:00 AM
    B: 11:00 PM to 5:00 AM
    C: Midnight to 5:00 AM
    D: 9:00 PM to 5:00 AM
  answer: B
  explanation: Drivers with a First-Year Restricted License are prohibited from driving
    between 11:00 PM and 5:00 AM, with limited exceptions for work, school, or emergencies.
- id: 6
  category: license_system
  question: If a Montana driver moves to a new address, they must notify the Motor
    Vehicle Division of the change within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: A
  explanation: Montana law requires all licensed drivers to notify the MVD of a change
    of address or name within 10 days.
- id: 7
  category: license_system
  question: What is the minimum age to apply for a Montana driver's license if the
    applicant has NOT completed a state-approved driver education course?
  choices:
    A: 15 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: If a teen does not take driver education, they must wait until they
    are 16 years old to apply for a permit or license in Montana.
- id: 8
  category: license_system
  question: A Montana driver's license for an individual between the ages of 21 and
    67 is typically valid for how many years?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: In Montana, standard driver's licenses for adults aged 21 to 67 are
    issued for an 8-year period.
- id: 9
  category: license_system
  question: Under Montana's point system, a driver's license will be suspended if
    they accumulate how many points within a 3-year period?
  choices:
    A: 10 points
    B: 12 points
    C: 15 points
    D: 18 points
  answer: B
  explanation: The Montana MVD will suspend a driver's license if they accumulate
    12 or more points within any 3-year period.
- id: 10
  category: license_system
  question: What is the mandatory minimum liability insurance coverage in Montana
    for bodily injury to or death of one person in any one accident?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Montana law requires a minimum of $25,000 for bodily injury to one
    person, $50,000 for bodily injury to two or more people, and $20,000 for property
    damage (25/50/20).
- id: 11
  category: license_system
  question: When applying for a Montana REAL ID-compliant license, which of the following
    is an acceptable proof of Montana residency?
  choices:
    A: A social security card
    B: A birth certificate
    C: A utility bill showing a physical address
    D: A valid U.S. Passport
  answer: C
  explanation: To prove residency for a REAL ID, Montana requires documents showing
    a physical address, such as a utility bill, rental agreement, or insurance policy.
    Passports and SSN cards prove identity/citizenship but not residency.
- id: 12
  category: license_system
  question: What is the penalty for a first-time violation of the GDL (Graduated Driver
    Licensing) restrictions in Montana?
  choices:
    A: A $500 fine
    B: 20 to 60 hours of community service
    C: Immediate revocation of the license until age 18
    D: A mandatory 1-year jail sentence
  answer: B
  explanation: A first-time violation of Montana's GDL restrictions is punishable
    by 20 to 60 hours of community service. A second violation may result in license
    suspension.
- id: 13
  category: license_system
  question: An Instruction Permit holder in Montana must be accompanied by a licensed
    driver who is at least how old?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: Any age, as long as they have a license
  answer: A
  explanation: Montana law requires the supervising driver for a permit holder to
    be a licensed driver who is at least 18 years of age.
- id: 14
  category: license_system
  question: How many times can an applicant attempt the Montana driver's knowledge
    (written) test in a single day?
  choices:
    A: Once
    B: Twice
    C: Three times
    D: Unlimited
  answer: A
  explanation: Montana MVD policy generally limits applicants to one attempt at the
    knowledge test per day.
- id: 15
  category: license_system
  question: In Montana, if you are under 18 and wish to be an organ donor, what is
    required?
  choices:
    A: Nothing, you can decide independently
    B: The signature of a parent or legal guardian
    C: A court order
    D: You cannot be a donor until you are 21
  answer: B
  explanation: In Montana, applicants under the age of 18 must have the consent of
    a parent or guardian to be designated as an organ donor on their license.
- id: 16
  category: license_system
  question: To meet the visual acuity standard for an unrestricted Montana driver's
    license, an applicant must have at least what vision in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/60
  answer: C
  explanation: According to the Montana Driver Manual, an applicant must have visual
    acuity of at least 20/40 in at least one eye, with or without corrective lenses,
    to qualify for an unrestricted license.
- id: 17
  category: license_system
  question: A standard Montana Class D driver's license allows you to operate a non-commercial
    vehicle with a Gross Vehicle Weight Rating (GVWR) of up to how many pounds?
  choices:
    A: 10,000 lbs
    B: 15,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: A Class D license in Montana is required for anyone operating a non-commercial
    motor vehicle that does not exceed 26,000 pounds GVWR.
- id: 18
  category: license_system
  question: If you legally change your name due to marriage or a court order, you
    must apply for a replacement Montana driver's license within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: A
  explanation: Montana law (MCA 61-5-115) requires drivers to notify the Motor Vehicle
    Division and apply for a corrected license within 10 days of a legal name change.
- id: 19
  category: license_system
  question: New residents to Montana who hold a valid driver's license from another
    state must obtain a Montana driver's license within how many days of becoming
    a resident?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: Under Montana law, a person is considered a resident for driving purposes
    after 60 days and must obtain a Montana license within that timeframe.
- id: 20
  category: license_system
  question: In Montana, when a parent or guardian signs a minor's driver's license
    application, what is the legal result?
  choices:
    A: They are only responsible for the application fee.
    B: They are exempt from all liability for the minor's actions.
    C: They assume joint and several liability for any negligence or willful misconduct
      by the minor while driving.
    D: They are only liable if the minor is driving their specific vehicle.
  answer: C
  explanation: Per MCA 61-5-108, the person who signs a minor's application for an
    instruction permit or driver's license is jointly and severally liable with the
    minor for any damages caused by the minor's negligence or willful misconduct.
- id: 21
  category: license_system
  question: What is the standard reinstatement fee for a Montana driver's license
    that was suspended for reasons other than alcohol or drug-related offenses?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: The standard fee to reinstate a suspended Montana driver's license
    is $100, though alcohol-related offenses may carry higher fees ($200).
- id: 22
  category: license_system
  question: 'By law, any male applicant between the ages of 18 and 25 who applies
    for a Montana driver''s license or ID card is also consenting to:'
  choices:
    A: Mandatory military service.
    B: Registration with the Selective Service System.
    C: Automatic voter registration for the next primary.
    D: A background check by the FBI.
  answer: B
  explanation: Montana law (MCA 61-5-126) requires that male applicants between 18
    and 25 be registered with the Selective Service System when they apply for a license
    or ID.
- id: 23
  category: license_system
  question: While licenses for younger adults are valid for 8 years, a Montana driver's
    license for a person aged 75 or older is valid for how many years?
  choices:
    A: 2 years
    B: 4 years
    C: 5 years
    D: 8 years
  answer: B
  explanation: In Montana, driver's licenses issued to individuals 75 years of age
    or older expire after 4 years rather than the standard 8 years.
- id: 24
  category: license_system
  question: Under Montana's Implied Consent law, if you refuse to take a chemical
    test for alcohol or drugs when requested by an officer, your license will be seized
    and suspended for how long (first offense)?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Under the Implied Consent law, a first-time refusal to take a breath
    or blood test results in an immediate seizure of the license and a 6-month suspension.
- id: 25
  category: license_system
  question: A Montana Motorcycle Instruction Permit is valid for how long from the
    date of issuance?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Until the driver turns 18
  answer: B
  explanation: A Montana motorcycle instruction permit is valid for one year and allows
    the holder to practice riding before taking the skills test.
- id: 26
  category: license_system
  question: What is the minimum age to apply for a Montana Identification (ID) card
    (non-driver)?
  choices:
    A: There is no minimum age.
    B: 12 years old
    C: 14 years old
    D: 15 years old
  answer: A
  explanation: In Montana, there is no minimum age requirement to obtain a state identification
    card, though minors will need parental consent.
- id: 27
  category: license_system
  question: Which of the following non-driving related actions can result in the suspension
    of your Montana driver's license?
  choices:
    A: Failure to pay child support.
    B: Failure to graduate high school.
    C: Failure to register a pet.
    D: Failure to pay federal income tax.
  answer: A
  explanation: Montana law allows for the suspension of a driver's license for non-driving
    reasons, including the failure to pay court-ordered child support.
- id: 28
  category: license_system
  question: 'When taking the Montana road (skills) test, the applicant must provide
    a vehicle that has:'
  choices:
    A: A dual-braking system for the examiner.
    B: A manual transmission.
    C: Valid registration and proof of insurance.
    D: Less than 50,000 miles on the odometer.
  answer: C
  explanation: Applicants must provide their own vehicle for the road test, and it
    must be legally registered and insured, in addition to being in safe mechanical
    condition.
- id: 29
  category: license_system
  question: To have a 'Veteran' designation added to a Montana driver's license, what
    must the applicant provide?
  choices:
    A: A verbal statement of service.
    B: A letter from a local VFW post.
    C: A discharge document (such as a DD-214) showing honorable discharge.
    D: Proof of current enrollment in the National Guard.
  answer: C
  explanation: To receive the Veteran designation on a Montana license, the applicant
    must present proof of honorable discharge, typically via a DD-214 form.
- id: 30
  category: license_system
  question: How many months before your Montana driver's license expires are you allowed
    to renew it?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 12 months
  answer: C
  explanation: Montana allows drivers to renew their licenses up to 6 months before
    the expiration date.
- id: 31
  category: driver_testing
  question: 'To pass the vision screening for an unrestricted Montana driver''s license,
    an applicant must have a combined field of vision of at least:'
  choices:
    A: 100 degrees
    B: 120 degrees
    C: 140 degrees
    D: 160 degrees
  answer: C
  explanation: According to the Montana Driver Manual, an applicant must have a visual
    acuity of at least 20/40 in at least one eye and a combined field of vision of
    140 degrees for an unrestricted license.
- id: 32
  category: driver_testing
  question: If you fail the Montana driving (road) test, how long must you wait before
    you are eligible to retake it?
  choices:
    A: 24 hours
    B: 3 days
    C: 1 week
    D: 1 month
  answer: C
  explanation: In Montana, if an applicant fails the road test, they must wait at
    least one week (7 days) before they can attempt the test again.
- id: 33
  category: driver_testing
  question: Which of the following is a requirement for the vehicle used during a
    Montana road test?
  choices:
    A: It must be a rental car
    B: It must have a dual-braking system for the examiner
    C: It must be currently registered and insured
    D: It must be a manual transmission vehicle
  answer: C
  explanation: The vehicle used for the road test must be in safe operating condition
    and have valid registration and proof of Montana liability insurance.
- id: 34
  category: driver_testing
  question: In Montana, what is the maximum speed limit for passenger vehicles on
    interstate highways outside of urban areas, unless otherwise posted?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: Montana law sets the maximum speed limit for passenger vehicles on
    rural interstate highways at 80 mph.
- id: 35
  category: driver_testing
  question: What is the daytime speed limit for passenger vehicles on a two-lane,
    undivided Montana highway unless otherwise posted?
  choices:
    A: 55 mph
    B: 60 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: The statutory speed limit for passenger vehicles on two-lane, undivided
    highways in Montana is 70 mph during the day.
- id: 36
  category: driver_testing
  question: 'In Montana, a person under the age of 21 is considered to be driving
    under the influence (DUI) if their Blood Alcohol Concentration (BAC) is at or
    above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Montana has a 'zero tolerance' law for minors; a driver under 21 is
    considered DUI with a BAC of 0.02% or higher.
- id: 37
  category: driver_testing
  question: Under Montana's point system, how many points are assessed against your
    driving record for a conviction of Reckless Driving?
  choices:
    A: 2 points
    B: 5 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Montana assigns 5 points to a driver's record for a conviction of reckless
    driving.
- id: 38
  category: driver_testing
  question: To maintain a safe following distance in Montana, you should use the 'three-second
    rule' under normal conditions. When should you increase this distance?
  choices:
    A: Only when driving at night
    B: Only when it is raining
    C: When following a motorcycle or driving in bad weather
    D: Only when driving on an interstate
  answer: C
  explanation: The Montana Driver Manual advises increasing your following distance
    beyond three seconds in poor weather, on slippery roads, or when following motorcycles
    or large trucks.
- id: 39
  category: driver_testing
  question: 'Montana law requires you to turn on your headlights from:'
  choices:
    A: One hour after sunset to one hour before sunrise
    B: Half hour after sunset to half hour before sunrise
    C: Sunset to sunrise
    D: 6:00 PM to 6:00 AM
  answer: B
  explanation: Montana law requires headlights to be used from a half hour after sunset
    to a half hour before sunrise, and any other time visibility is less than 500
    feet.
- id: 40
  category: driver_testing
  question: 'When parking a vehicle headed downhill on a two-way street with a curb,
    you should turn your front wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the left
  answer: A
  explanation: When parking downhill, you should turn your wheels toward the curb
    so that if the vehicle rolls, it will roll into the curb and stop.
- id: 41
  category: driver_testing
  question: In Montana, you must signal your intention to turn at least ______ before
    the turn in a business or residential district.
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Montana law requires a turn signal to be given continuously for at
    least 100 feet before turning in a business or residential district.
- id: 42
  category: driver_testing
  question: 'When approaching a school bus from either direction that has stopped
    and is displaying flashing red lights, you must stop unless:'
  choices:
    A: You are traveling in the opposite direction on a highway with at least two
      lanes in each direction
    B: You are in a residential zone
    C: The bus is on the opposite side of a divided highway separated by a median
      or physical barrier
    D: You are driving a commercial vehicle
  answer: C
  explanation: Drivers do not need to stop for a school bus if they are traveling
    in the opposite direction on a divided highway where the lanes are separated by
    a median or physical barrier.
- id: 43
  category: driver_testing
  question: 'Montana''s ''Move Over'' law requires drivers approaching a stationary
    emergency vehicle with flashing lights to:'
  choices:
    A: Stop immediately in the lane of travel
    B: Maintain speed but honk the horn
    C: Move to the far lane if possible, or slow down significantly if changing lanes
      is unsafe
    D: Speed up to pass the scene quickly
  answer: C
  explanation: Montana law requires drivers to move to a non-adjacent lane or slow
    down to a safe speed when approaching stationary emergency or maintenance vehicles
    with flashing lights.
- id: 44
  category: driver_testing
  question: New Montana residents must register their vehicles within how many days
    of becoming a resident?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: According to Montana law, new residents have 60 days to register their
    vehicles in the state.
- id: 45
  category: driver_testing
  question: To pass the Montana driver's knowledge (written) test, what is the minimum
    number of questions you must answer correctly out of 33?
  choices:
    A: '20'
    B: '24'
    C: '27'
    D: '30'
  answer: C
  explanation: According to the Montana Driver Manual, the knowledge test consists
    of 33 questions, and you must answer at least 27 correctly (approximately 82%)
    to pass.
- id: 46
  category: driver_testing
  question: When taking the Montana road test, which of the following must you provide
    for the vehicle you are using?
  choices:
    A: A valid vehicle registration and proof of insurance
    B: A notarized letter from the vehicle owner
    C: The vehicle's original title
    D: A maintenance log from the last 12 months
  answer: A
  explanation: For the road test in Montana, the applicant must provide a vehicle
    that is safe to operate and has a valid registration and current proof of Montana
    liability insurance.
- id: 47
  category: driver_testing
  question: Under Montana law, what is the Blood Alcohol Concentration (BAC) limit
    for drivers under the age of 21?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Montana has a 'zero tolerance' policy for minors; drivers under 21
    are considered under the influence if their BAC is 0.02% or higher.
- id: 48
  category: driver_testing
  question: Under Montana's Implied Consent law, what is the penalty for a first-time
    refusal to take a chemical test for alcohol or drugs?
  choices:
    A: A 30-day license suspension
    B: A 90-day license suspension
    C: A 6-month license suspension
    D: A 1-year license suspension
  answer: C
  explanation: If you refuse a chemical test in Montana for the first time, your driver's
    license will be seized and suspended for 6 months.
- id: 49
  category: driver_testing
  question: In Montana, what happens to the fine for speeding in a designated construction
    zone where workers are present?
  choices:
    A: The fine is waived for first-time offenders
    B: The fine is doubled
    C: The fine is tripled
    D: The fine is increased by a flat $500
  answer: B
  explanation: Montana law dictates that fines for traffic violations, including speeding,
    are doubled in work zones when workers are present.
- id: 50
  category: driver_testing
  question: The Montana Driver Manual recommends using which rule to maintain a safe
    following distance behind the vehicle in front of you?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The three-second rule
    D: The four-second rule
  answer: D
  explanation: While many states use a two or three-second rule, the Montana Driver
    Manual specifically recommends a four-second following distance to allow for better
    reaction time.
- id: 51
  category: driver_testing
  question: 'In Montana, when a school bus is stopped with its red lights flashing
    and stop arm extended, you must stop your vehicle:'
  choices:
    A: Only if you are traveling in the same direction as the bus
    B: Only if the bus is on a two-lane road
    C: Regardless of which direction you are traveling, unless on a divided highway
      with a physical barrier
    D: Only if there are children currently crossing the street
  answer: C
  explanation: Drivers in Montana must stop for a school bus with flashing red lights
    from either direction, unless they are on a divided highway with a median or physical
    barrier separating the roadways.
- id: 52
  category: driver_testing
  question: At what speed can hydroplaning (tires losing contact with the road due
    to water) begin in Montana weather conditions?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Only above 65 mph
    D: At any speed over 15 mph
  answer: A
  explanation: The Montana Driver Manual warns that hydroplaning can start at speeds
    as low as 35 mph in heavy rain.
- id: 53
  category: driver_testing
  question: When parking a vehicle headed uphill on a two-way street with a curb in
    Montana, how should the front wheels be turned?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter as long as the parking brake is set
  answer: B
  explanation: When parking uphill against a curb, turn your wheels away from the
    curb so that if the vehicle rolls, the back of the front tire will hit the curb
    and stop the car.
- id: 54
  category: driver_testing
  question: In Montana, you must dim your high-beam headlights when you are within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Montana law requires drivers to switch to low beams when an oncoming
    vehicle is within 500 feet.
- id: 55
  category: driver_testing
  question: 'In Montana, you must immediately report a motor vehicle accident to the
    authorities if it results in injury, death, or property damage to any one person''s
    property in excess of:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Montana law requires an immediate report to the police, sheriff, or
    highway patrol if an accident involves injury, death, or property damage exceeding
    $1,000.
- id: 56
  category: driver_testing
  question: 'According to Montana law, children must be secured in an appropriate
    child safety restraint if they are:'
  choices:
    A: Under 4 years of age or weigh less than 40 pounds
    B: Under 6 years of age and weigh less than 60 pounds
    C: Under 8 years of age or weigh less than 80 pounds
    D: Under 10 years of age
  answer: B
  explanation: Montana law requires children under 6 years old who weigh less than
    60 pounds to be properly restrained in a child safety seat.
- id: 57
  category: driver_responsibility
  question: If a Montana driver is convicted of a first-time offense for failing to
    carry valid liability insurance, what is the potential fine?
  choices:
    A: Between $100 and $250
    B: Between $250 and $500
    C: Exactly $1,000
    D: No fine, only community service
  answer: B
  explanation: A first-time conviction for operating a vehicle without liability insurance
    in Montana carries a fine of $250 to $500, and may include up to 10 days in jail.
- id: 58
  category: driver_responsibility
  question: When you sell a vehicle in Montana, what should you do with the license
    plates?
  choices:
    A: Leave them on the vehicle for the new owner.
    B: Remove them and keep them for your next vehicle.
    C: Turn them into the local police station.
    D: Destroy them immediately.
  answer: B
  explanation: In Montana, license plates stay with the owner, not the vehicle. When
    you sell a car, you must remove the plates.
- id: 59
  category: driver_responsibility
  question: A Montana driver is classified as a 'Habitual Traffic Offender' if they
    accumulate how many points within a 3-year period?
  choices:
    A: 15 points
    B: 20 points
    C: 30 points
    D: 40 points
  answer: C
  explanation: Accumulating 30 or more points within a 3-year period results in being
    designated a Habitual Traffic Offender, which leads to a 3-year license revocation.
- id: 60
  category: driver_responsibility
  question: 'If you are involved in an accident in Montana where you cannot locate
    the owner of a damaged unattended vehicle, you must:'
  choices:
    A: Wait for at least 4 hours for the owner to return.
    B: Leave a note with your name, address, and vehicle information and notify the
      police.
    C: Drive away if the damage appears to be less than $500.
    D: Only report it if the owner contacts you later.
  answer: B
  explanation: Montana law requires you to leave a written notice in a conspicuous
    place on the unattended vehicle and notify law enforcement immediately.
- id: 61
  category: driver_responsibility
  question: In Montana, how many points are added to your driving record for a conviction
    of 'Speeding' (except for specific 'Basic Rule' violations)?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: A
  explanation: Most speeding convictions in Montana result in 2 points being added
    to the driver's record.
- id: 62
  category: driver_responsibility
  question: 'In Montana, if you are convicted of a DUI for the first time, your license
    will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: A first-offense DUI conviction in Montana typically results in a 6-month
    license suspension.
- id: 63
  category: driver_responsibility
  question: 'Under Montana''s ''Implied Consent'' law, by driving on Montana''s public
    roads, you have given your consent to:'
  choices:
    A: A search of your vehicle for illegal substances
    B: A chemical test of your blood, breath, or urine to determine alcohol or drug
      content
    C: A review of your medical records by the DMV
    D: Allowing passengers to drink alcohol in your vehicle
  answer: B
  explanation: Montana's Implied Consent law means that any person who operates a
    motor vehicle upon the ways of the state open to the public is considered to have
    given consent to a test or tests of their blood or breath for the purpose of determining
    any measured amount or presence of alcohol or drugs.
- id: 64
  category: driver_responsibility
  question: What is the penalty for a first-time conviction of driving without the
    required liability insurance in Montana?
  choices:
    A: A fine between $250 and $500
    B: A flat fine of $100
    C: Mandatory 30-day license suspension
    D: Permanent vehicle impoundment
  answer: A
  explanation: For a first offense of failing to carry liability insurance, Montana
    law prescribes a fine of not less than $250 or more than $500, or imprisonment
    in the county jail for not more than 10 days.
- id: 65
  category: driver_responsibility
  question: In Montana, if you are convicted of a third or subsequent offense of driving
    without insurance, what is the mandatory penalty regarding your driver's license?
  choices:
    A: A 30-day suspension
    B: A 90-day suspension
    C: A 1-year revocation
    D: There is no license penalty, only a fine
  answer: B
  explanation: For a third or subsequent conviction of driving without insurance,
    Montana law requires the surrender of the driver's license for a 90-day suspension
    period.
- id: 66
  category: driver_responsibility
  question: What is the maximum fine for littering from a motor vehicle on Montana's
    highways?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,000
  answer: D
  explanation: Montana law takes littering seriously; a person convicted of littering
    on a public highway can be fined up to $2,000.
- id: 67
  category: driver_responsibility
  question: In Montana, for a driver under the age of 21, it is illegal to operate
    a motor vehicle with a Blood Alcohol Concentration (BAC) of ____ or higher.
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Montana has a 'zero tolerance' policy for minors; the legal BAC limit
    for drivers under 21 is 0.02%.
- id: 68
  category: driver_responsibility
  question: If a Montana driver refuses to take a chemical test for alcohol/drugs
    upon the request of a peace officer, their license will be suspended for how long
    for a first refusal?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Under the Implied Consent law, a first-time refusal to submit to a
    chemical test results in a 6-month suspension of driving privileges.
- id: 69
  category: driver_responsibility
  question: Under Montana's point system, how many points are assessed against your
    driving record for a conviction of 'Failure to remain at the scene of an accident'
    that results in death or personal injury?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: Montana's point system assigns 8 points for failing to remain at the
    scene of an accident that results in death or personal injury.
- id: 70
  category: driver_responsibility
  question: When a vehicle is sold in Montana, the seller must provide the buyer with
    the title and a completed 'Bill of Sale.' The buyer then has how many days to
    apply for a new title and registration?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 40 days
  answer: D
  explanation: In Montana, a person who purchases a vehicle has 40 days from the date
    of purchase to apply for a new title and registration.
- id: 71
  category: driver_responsibility
  question: In Montana, who is legally responsible for ensuring that all passengers
    under the age of 18 are properly restrained by a seatbelt or child safety seat?
  choices:
    A: The passenger themselves
    B: The parent of the passenger, even if not in the car
    C: The driver of the vehicle
    D: No one, as seatbelt use is optional for minors in the back seat
  answer: C
  explanation: The driver is responsible for ensuring that all occupants under the
    age of 18 are buckled up or in an appropriate child safety seat.
- id: 72
  category: driver_responsibility
  question: A Montana driver's license can be suspended if the driver is convicted
    of 'Reckless Driving.' How many points is a Reckless Driving conviction worth
    on a Montana driving record?
  choices:
    A: 2 points
    B: 5 points
    C: 8 points
    D: 10 points
  answer: B
  explanation: Under the Montana point system, a conviction for Reckless Driving results
    in 5 points being added to the driver's record.
- id: 73
  category: safe_driving_rules
  question: When passing another vehicle on a two-lane road in Montana, you must return
    to your lane before coming within how many feet of an oncoming vehicle?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Montana law requires that you return to your lane of travel before
    coming within 100 feet of any vehicle approaching from the opposite direction.
- id: 74
  category: safe_driving_rules
  question: In Montana, you are prohibited from parking within how many feet of a
    fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: According to the Montana Driver Manual, you may not park within 15
    feet of a fire hydrant.
- id: 75
  category: safe_driving_rules
  question: What is the maximum speed limit on a two-lane Montana highway during the
    nighttime for passenger vehicles?
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 70 mph
  answer: B
  explanation: On two-lane highways in Montana, the nighttime speed limit for passenger
    vehicles is 55 mph unless otherwise posted.
- id: 76
  category: safe_driving_rules
  question: When following another vehicle in Montana, what is the recommended minimum
    following distance under normal driving conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Montana Driver Manual recommends a following distance of at least
    3 seconds to allow for adequate reaction time.
- id: 77
  category: safe_driving_rules
  question: In Montana, you are not allowed to park within how many feet of a stop
    sign, flashing beacon, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Montana law prohibits parking within 30 feet of any flashing beacon,
    stop sign, or traffic control signal located at the side of a roadway.
- id: 78
  category: safe_driving_rules
  question: For a driver under the age of 21 in Montana, what is the Blood Alcohol
    Concentration (BAC) limit that constitutes a DUI?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Montana has a 'zero tolerance' law for minors; if you are under 21,
    a BAC of 0.02% or higher is considered a DUI.
- id: 79
  category: safe_driving_rules
  question: When following a vehicle at night in Montana, you must dim your high beams
    when you are within how many feet of the vehicle ahead?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Montana law requires you to dim your high beams when following another
    vehicle within 500 feet.
- id: 80
  category: safe_driving_rules
  question: Under Montana law, you are prohibited from passing another vehicle when
    you are within how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: You may not drive on the left side of the road (pass) when approaching
    within 100 feet of any intersection or railroad crossing.
- id: 81
  category: safe_driving_rules
  question: When parking on a hill in Montana, if you are parked facing uphill next
    to a curb, which way should you turn your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill next to a curb, turn your wheels away from the
    curb so the back of the tire will hit the curb if the car rolls.
- id: 82
  category: safe_driving_rules
  question: 'In Montana, you must use your headlights from one-half hour after sunset
    until:'
  choices:
    A: Sunrise
    B: One-half hour before sunrise
    C: One hour before sunrise
    D: When visibility is 1,000 feet
  answer: B
  explanation: Montana law requires headlights to be on from one-half hour after sunset
    to one-half hour before sunrise, or whenever visibility is less than 500 feet.
- id: 83
  category: safe_driving_rules
  question: When driving on a Montana highway outside of business or residential districts,
    you must signal your intention to turn at least how many feet before the turn?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: In Montana, you must signal at least 100 feet before a turn in business
    or residential areas, but at least 300 feet before turning on highways.
- id: 84
  category: safe_driving_rules
  question: In Montana, you may not pass another vehicle when you are within how many
    feet of an intersection, railroad crossing, bridge, or tunnel?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Montana Code 61-8-325 prohibits driving on the left side of the roadway
    when approaching within 100 feet of an intersection, railroad crossing, bridge,
    viaduct, or tunnel.
- id: 85
  category: safe_driving_rules
  question: Under Montana law, you are prohibited from parking within how many feet
    of a stop sign, yield sign, or traffic control signal?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: According to Montana Code 61-8-354, you cannot park within 30 feet
    of any flashing beacon, stop sign, yield sign, or traffic control signal located
    at the side of a roadway.
- id: 86
  category: safe_driving_rules
  question: When a school bus is stopped on a highway with its red lights flashing,
    which drivers are NOT required to stop in Montana?
  choices:
    A: Drivers following the bus
    B: Drivers on the opposite side of a divided highway with a median or physical
      barrier
    C: Drivers on a four-lane road without a median
    D: All drivers must stop regardless of the road type
  answer: B
  explanation: Montana Code 61-8-351 states that a driver of a vehicle upon a highway
    with separate roadways (divided by a physical barrier or median) need not stop
    upon meeting or passing a school bus that is on a different roadway.
- id: 87
  category: safe_driving_rules
  question: What is the penalty for speeding in a posted Montana work zone when workers
    are present?
  choices:
    A: A flat $500 fine
    B: Fines are doubled
    C: Mandatory 30-day license suspension
    D: Fines are tripled
  answer: B
  explanation: Montana law (61-8-314) stipulates that the fine for a person violated
    a speed limit in a work zone is double the amount of the fine that would normally
    be imposed.
- id: 88
  category: safe_driving_rules
  question: When two vehicles reach an uncontrolled intersection (no signs or signals)
    at the same time in Montana, who has the right-of-way?
  choices:
    A: The vehicle on the left must yield to the vehicle on the right
    B: The vehicle on the right must yield to the vehicle on the left
    C: The vehicle on the busier street has the right-of-way
    D: The larger vehicle has the right-of-way
  answer: A
  explanation: Montana Code 61-8-339 states that when two vehicles enter an intersection
    from different highways at approximately the same time, the driver of the vehicle
    on the left shall yield the right-of-way to the vehicle on the right.
- id: 89
  category: safe_driving_rules
  question: When parking a vehicle facing downhill on a street with a curb in Montana,
    how should you position your wheels?
  choices:
    A: Turn wheels toward the curb
    B: Turn wheels away from the curb
    C: Keep wheels straight
    D: Turn wheels toward the center of the street
  answer: A
  explanation: The Montana Driver Manual instructs drivers to turn their wheels toward
    the curb when parking downhill so that if the vehicle rolls, it will roll into
    the curb.
- id: 90
  category: safe_driving_rules
  question: What is the recommended following distance behind the vehicle in front
    of you under normal driving conditions in Montana?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 10 seconds
  answer: C
  explanation: The Montana Driver Manual recommends a 'four-second rule' to maintain
    a safe following distance under normal conditions.
- id: 91
  category: safe_driving_rules
  question: 'In Montana, headlights must be turned on from:'
  choices:
    A: One hour after sunset to one hour before sunrise
    B: Sunset to sunrise
    C: Half an hour after sunset to half an hour before sunrise
    D: 9:00 PM to 6:00 AM
  answer: C
  explanation: Montana Code 61-9-201 requires headlights to be used from a half hour
    after sunset to a half hour before sunrise, and at any other time when visibility
    is less than 500 feet.
- id: 92
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in Montana traffic,
    how far ahead should you typically scan the road?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 seconds
  answer: B
  explanation: Safe drivers try to look 10 to 15 seconds ahead of their vehicle to
    identify potential hazards early.
- id: 93
  category: defensive_driving
  question: If your vehicle starts to hydroplane on a wet Montana highway, what is
    the best course of action?
  choices:
    A: Brake hard to regain traction
    B: Turn the steering wheel sharply toward the shoulder
    C: Gradually take your foot off the gas pedal
    D: Shift the car into neutral immediately
  answer: C
  explanation: If hydroplaning, you should ease your foot off the gas pedal and keep
    the steering wheel straight. Do not stop or turn until your tires are gripping
    the road again.
- id: 94
  category: defensive_driving
  question: When driving on Montana roads during winter, 'black ice' is most likely
    to form first on which of the following?
  choices:
    A: Gravel roads
    B: Bridges and overpasses
    C: Steep mountain inclines
    D: Interstate off-ramps
  answer: B
  explanation: Bridges and overpasses freeze sooner than the rest of the road because
    cold air circulates both above and below the structure.
- id: 95
  category: defensive_driving
  question: When entering an intersection in Montana, in which order should you scan
    for traffic?
  choices:
    A: Right, Left, Right
    B: Left, Right, Left
    C: Straight ahead, then Left
    D: Only in the direction you are turning
  answer: B
  explanation: You should look left, then right, then left again. Looking left first
    is critical because vehicles coming from the left are closer to you.
- id: 96
  category: defensive_driving
  question: 'In Montana, if a large animal like a deer or elk jumps in front of your
    vehicle, the safest defensive action is usually to:'
  choices:
    A: Swerve into the opposite lane to miss it
    B: Brake firmly and stay in your lane
    C: Speed up to pass the animal before it hits
    D: Aim for the animal's head
  answer: B
  explanation: Swerving can cause a more serious head-on collision or rollover. The
    Montana manual advises braking firmly and staying in your lane.
- id: 97
  category: defensive_driving
  question: When driving in heavy fog in Montana, which light setting should you use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Emergency flashers
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the fog and
    cause glare, making it harder to see.
- id: 98
  category: defensive_driving
  question: If you are being tailgated on a two-lane Montana highway, what should
    you do to maintain safety?
  choices:
    A: Brake suddenly to scare the tailgater
    B: Speed up to increase the gap
    C: Slow down gradually to encourage them to pass
    D: Turn on your high beams
  answer: C
  explanation: If being tailgated, you should slowly reduce your speed. This encourages
    the tailgater to pass and increases the safety cushion in front of you.
- id: 99
  category: defensive_driving
  question: When driving on a Montana highway with three or more lanes, which lane
    is typically used for the smoothest flow of traffic?
  choices:
    A: The left lane
    B: The right lane
    C: The middle lane
    D: The shoulder
  answer: C
  explanation: The middle lane usually offers the smoothest flow, while the left is
    for passing and the right is for slower traffic and entering/exiting.
- id: 100
  category: defensive_driving
  question: In Montana, what is the 'Basic Rule' regarding speed limits?
  choices:
    A: Always drive exactly the posted speed limit
    B: Drive at a speed that is reasonable and prudent for current conditions
    C: Never drive slower than 10 mph below the limit
    D: Speed limits do not apply on rural gravel roads
  answer: B
  explanation: The Basic Rule (MCA 61-8-303) states you must always drive at a speed
    that is reasonable and proper for the existing conditions, regardless of the posted
    limit.
- id: 101
  category: defensive_driving
  question: 'When descending a steep mountain grade in Montana, you should:'
  choices:
    A: Shift to a lower gear to use engine braking
    B: Coast in neutral to save fuel
    C: Keep your foot constantly on the brake
    D: Turn off the engine to prevent overheating
  answer: A
  explanation: Shifting to a lower gear helps control speed through engine braking,
    preventing the brakes from overheating and failing.
- id: 102
  category: defensive_driving
  question: If you are driving on a Montana road that is slippery with ice or snow,
    how should you adjust your following distance?
  choices:
    A: Keep it at 4 seconds
    B: Decrease it to 2 seconds to stay in the tracks of the car ahead
    C: Increase it to 6 seconds or more
    D: Following distance does not matter if you have winter tires
  answer: C
  explanation: On slippery roads, you should increase your following distance significantly
    (to 6 seconds or more) to allow for much longer stopping distances.
- id: 103
  category: defensive_driving
  question: When entering a curve on a rural Montana road, when is the best time to
    slow down?
  choices:
    A: While you are in the middle of the curve
    B: Before you enter the curve
    C: Just as you are exiting the curve
    D: Only if you feel the tires sliding
  answer: B
  explanation: The Montana Driver Manual instructs drivers to slow down before entering
    a curve. Braking while in the curve can cause a skid.
- id: 104
  category: defensive_driving
  question: Under Montana's 'Move Over' law, what must you do when approaching a stationary
    emergency vehicle with flashing lights on a multi-lane highway?
  choices:
    A: Stop completely in your lane
    B: Maintain speed but honk your horn
    C: Move to the lane farthest from the emergency vehicle if safe to do so
    D: Speed up to pass the scene quickly
  answer: C
  explanation: Montana law requires drivers to move to a non-adjacent lane or slow
    down significantly if changing lanes is unsafe when passing emergency or authorized
    vehicles on the shoulder.
- id: 105
  category: defensive_driving
  question: If your Montana vehicle is equipped with Anti-lock Braking System (ABS)
    and you need to stop quickly on a slippery surface, how should you apply the brakes?
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure without letting go
    C: Lightly tap the brakes
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should press the brake pedal hard and keep holding it.
    The system will automatically 'pump' the brakes for you to prevent lock-up.
- id: 106
  category: defensive_driving
  question: When scanning for hazards in Montana, what does the 'Left-Right-Left'
    rule refer to?
  choices:
    A: The order of checking mirrors before backing up
    B: The way to steer out of a skid
    C: How to look before entering an intersection
    D: The pattern for cleaning your windshield
  answer: C
  explanation: Before entering an intersection, you should look left, then right,
    then left again, because the first vehicle that could hit you would come from
    the left.
- id: 107
  category: alcohol_drugs_health
  question: For a driver under the age of 21 in Montana, what is the maximum legal
    BAC limit before they are cited for driving after consuming alcohol?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Montana has a 'zero tolerance' policy for minors; a driver under 21
    can be cited if their BAC is 0.02% or higher.
- id: 108
  category: alcohol_drugs_health
  question: If a Montana driver refuses to take a chemical test for alcohol or drugs
    for the first time, what is the immediate penalty regarding their driver's license?
  choices:
    A: A 30-day suspension
    B: A 90-day suspension
    C: A 6-month suspension
    D: A permanent revocation
  answer: C
  explanation: According to Montana law, a first-time refusal to take a chemical test
    results in the immediate seizure of the license and a 6-month suspension.
- id: 109
  category: alcohol_drugs_health
  question: 'In Montana, a driver can be charged with ''Aggravated DUI'' if their
    Blood Alcohol Concentration (BAC) is at or above:'
  choices:
    A: 0.12%
    B: 0.16%
    C: 0.20%
    D: 0.25%
  answer: B
  explanation: Montana law defines Aggravated DUI as driving with a BAC of 0.16% or
    higher, or committing a DUI while already under license suspension for a prior
    DUI.
- id: 110
  category: alcohol_drugs_health
  question: What is the mandatory minimum fine for a first-offense DUI conviction
    in Montana (for an adult with a BAC between 0.08% and 0.16%)?
  choices:
    A: $100
    B: $300
    C: $600
    D: $1,500
  answer: C
  explanation: For a first DUI conviction in Montana, the fine ranges from a minimum
    of $600 to a maximum of $1,000.
- id: 111
  category: alcohol_drugs_health
  question: 'A first-offense DUI conviction in Montana carries a mandatory minimum
    jail sentence of:'
  choices:
    A: 24 consecutive hours
    B: 48 consecutive hours
    C: 7 days
    D: 30 days
  answer: A
  explanation: A first-time DUI conviction in Montana requires a jail term of 24 consecutive
    hours to 6 months.
- id: 112
  category: alcohol_drugs_health
  question: Montana's 'Open Container' law prohibits which of the following?
  choices:
    A: Carrying an unopened six-pack of beer in the front seat
    B: Possessing an open alcoholic beverage in the passenger area of a motor vehicle
      on a public highway
    C: Transporting an open bottle of wine in the trunk of the car
    D: Drinking water from an unsealed container while driving
  answer: B
  explanation: Montana law prohibits the possession of an open alcoholic beverage
    container by a person in the passenger area of a motor vehicle located on a public
    highway.
- id: 113
  category: alcohol_drugs_health
  question: In Montana, a driver is considered to be driving under the influence of
    marijuana if their blood contains how much THC?
  choices:
    A: 1 nanogram per milliliter
    B: 2 nanograms per milliliter
    C: 5 nanograms per milliliter
    D: 10 nanograms per milliliter
  answer: C
  explanation: Montana law sets a 'per se' limit of 5 nanograms of delta-9-tetrahydrocannabinol
    (THC) per milliliter of blood for driving under the influence.
- id: 114
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and it impairs your driving, can
    you be convicted of a DUI in Montana?
  choices:
    A: No, as long as you have a valid prescription
    B: No, DUI laws only apply to alcohol and illegal drugs
    C: Yes, if the drug renders you incapable of safely operating a vehicle
    D: Only if you also have alcohol in your system
  answer: C
  explanation: Montana law states that it is unlawful to drive under the influence
    of any drug (prescription, over-the-counter, or illicit) that makes the driver
    unsafe.
- id: 115
  category: alcohol_drugs_health
  question: What is the first thing affected by the consumption of alcohol?
  choices:
    A: Vision
    B: Coordination
    C: Judgment
    D: Reaction time
  answer: C
  explanation: Judgment is the first faculty to be impaired by alcohol, often leading
    drivers to believe they are capable of driving when they are not.
- id: 116
  category: alcohol_drugs_health
  question: Upon a first DUI conviction in Montana, for how long is the driver's license
    typically suspended?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: A first-offense DUI conviction in Montana results in a 6-month suspension
    of the driver's license.
- id: 117
  category: alcohol_drugs_health
  question: If a driver under 21 is convicted of a first-offense 'driving after consuming
    alcohol' (0.02% - 0.08% BAC), what is the license suspension period?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: For a first offense of driving after consuming alcohol under age 21,
    the penalty includes a 90-day license suspension and a fine of $100 to $500.
- id: 118
  category: alcohol_drugs_health
  question: What is the effect of combining alcohol with another drug, such as a cold
    medicine or marijuana?
  choices:
    A: The effects of both are cancelled out
    B: The effects are the same as if you only took the drug
    C: The alcohol prevents the drug from working
    D: The combined effect is much greater than the effect of either alone
  answer: D
  explanation: Combining alcohol with other drugs creates a synergistic effect, meaning
    the impairment is significantly multiplied and much more dangerous.
- id: 119
  category: alcohol_drugs_health
  question: If you are convicted of a second DUI in Montana within a 10-year period,
    what is the mandatory minimum jail time?
  choices:
    A: 48 hours
    B: 7 days
    C: 30 days
    D: 6 months
  answer: B
  explanation: A second DUI conviction in Montana carries a mandatory minimum of 7
    days in jail, though it can be as long as 1 year.
- id: 120
  category: alcohol_drugs_health
  question: For a first-offense DUI conviction in Montana, what is the range of the
    fine imposed (excluding court costs)?
  choices:
    A: $100 to $500
    B: $300 to $600
    C: $600 to $1,000
    D: $1,000 to $5,000
  answer: C
  explanation: A first-offense DUI in Montana carries a fine of at least $600 and
    no more than $1,000.
- id: 121
  category: alcohol_drugs_health
  question: What is the Blood Alcohol Concentration (BAC) threshold for an 'Aggravated
    DUI' charge in Montana?
  choices:
    A: 0.08% or higher
    B: 0.10% or higher
    C: 0.16% or higher
    D: 0.20% or higher
  answer: C
  explanation: In Montana, a person can be charged with Aggravated DUI if their BAC
    is 0.16% or higher at the time of the offense.
- id: 122
  category: alcohol_drugs_health
  question: Montana's 'Open Container' law prohibits the possession of an open alcoholic
    beverage container in which part of the vehicle?
  choices:
    A: Only the driver's seat
    B: The trunk only
    C: The passenger area of a motor vehicle on a public highway
    D: Behind the last upright seat of a hatchback
  answer: C
  explanation: It is unlawful to possess an open alcoholic beverage container in the
    passenger area of a motor vehicle on a public highway in Montana.
- id: 123
  category: alcohol_drugs_health
  question: 'If a Montana driver is convicted of a DUI while a passenger under the
    age of 16 is in the vehicle, the maximum fine and jail time are:'
  choices:
    A: Tripled
    B: Doubled
    C: Increased by $500
    D: Unchanged
  answer: B
  explanation: Montana law stipulates that if a person is convicted of DUI with a
    passenger under age 16, the minimum and maximum fines and imprisonment terms are
    doubled.
- id: 124
  category: alcohol_drugs_health
  question: What is the legal BAC limit for a commercial driver operating a commercial
    motor vehicle in Montana?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Commercial drivers are held to a stricter standard and are considered
    under the influence if their BAC is 0.04% or higher.
- id: 125
  category: alcohol_drugs_health
  question: 'A second DUI conviction in Montana results in a mandatory driver''s license
    suspension of:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: A second DUI conviction in Montana carries a mandatory 1-year license
    suspension.
- id: 126
  category: alcohol_drugs_health
  question: If a Montana driver refuses a chemical test for a second time within 5
    years, how long will their license be suspended?
  choices:
    A: 6 months
    B: 1 year
    C: 18 months
    D: 3 years
  answer: B
  explanation: A second or subsequent refusal of a chemical test within 5 years results
    in a 1-year license suspension with no provision for a restricted probationary
    license.
- id: 127
  category: alcohol_drugs_health
  question: In Montana, is it a valid legal defense to a DUI charge if you were using
    a drug that was prescribed to you by a doctor?
  choices:
    A: Yes, as long as you have the prescription with you
    B: Yes, if the doctor said it was safe to drive
    C: No, if the drug rendered you incapable of safely operating a vehicle
    D: Only if the drug is not a narcotic
  answer: C
  explanation: Montana law states that the fact that a person is or has been entitled
    to use a drug under the laws of the state is not a defense against a charge of
    driving under the influence.
- id: 128
  category: alcohol_drugs_health
  question: How does eating food before or while drinking alcohol affect a driver's
    BAC in Montana?
  choices:
    A: It prevents the driver from becoming intoxicated
    B: It speeds up the process of alcohol leaving the body
    C: It slows the absorption of alcohol into the bloodstream
    D: It has no effect on BAC levels
  answer: C
  explanation: Food in the stomach slows down the rate at which alcohol is absorbed
    into the blood, but it does not prevent intoxication or lower the final BAC level
    reached.
- id: 129
  category: alcohol_drugs_health
  question: Which of the following is the only way to reduce your Blood Alcohol Concentration
    (BAC) before driving?
  choices:
    A: Drinking strong black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time for your body to process the alcohol
  answer: D
  explanation: Only time allows the body to metabolize alcohol. Coffee, showers, and
    exercise do not speed up the process of becoming sober.
- id: 130
  category: alcohol_drugs_health
  question: Under Montana law, who has the authority to choose which chemical test
    (breath, blood, or urine) is administered to a driver suspected of DUI?
  choices:
    A: The driver
    B: The driver's attorney
    C: The peace officer
    D: A medical doctor
  answer: C
  explanation: Under Montana's implied consent law, the peace officer designates which
    of the tests (breath, blood, or urine) shall be administered.
- id: 131
  category: penalties_and_points
  question: If a Montana driver is declared a 'Habitual Traffic Offender,' for how
    long is their driving privilege revoked?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: A person designated as a Habitual Traffic Offender (accumulating 30
    points in 3 years) faces a mandatory 3-year revocation of their driver's license.
- id: 132
  category: penalties_and_points
  question: What is the maximum fine for a first-time violation of Montana's open
    container law?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: A person convicted of violating Montana's open container law (possessing
    an open alcoholic beverage in the passenger area) can be fined up to $100.
- id: 133
  category: penalties_and_points
  question: In Montana, how many points are assessed for a standard speeding violation
    that is NOT in a restricted zone?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: B
  explanation: Standard speeding violations in Montana typically result in 2 points
    being added to the driver's record.
- id: 134
  category: penalties_and_points
  question: For a first-time DUI conviction in Montana, what is the minimum mandatory
    jail sentence?
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: B
  explanation: A first-offense DUI conviction in Montana carries a mandatory minimum
    jail sentence of 24 hours, which can range up to 6 months.
- id: 135
  category: penalties_and_points
  question: What is the standard fee required to reinstate a Montana driver's license
    after it has been suspended or revoked?
  choices:
    A: $50
    B: $75
    C: $100
    D: $200
  answer: C
  explanation: Montana generally charges a $100 reinstatement fee to restore driving
    privileges after a suspension or revocation.
- id: 136
  category: penalties_and_points
  question: How many points are assessed against a driver's record for 'Failure to
    Yield' the right-of-way in Montana?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: A conviction for failure to yield the right-of-way results in 2 points
    being added to a Montana driving record.
- id: 137
  category: penalties_and_points
  question: How many points are assessed for leaving the scene of an accident that
    results in bodily injury in Montana?
  choices:
    A: 2 points
    B: 5 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: Leaving the scene of an accident involving personal injury is a major
    violation in Montana and carries an 8-point penalty.
- id: 138
  category: penalties_and_points
  question: Montana law requires all motor vehicles to carry liability insurance.
    What is the minimum required coverage for property damage in a single accident?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: Montana's minimum liability requirements are 25/50/20, which includes
    $20,000 for property damage to others.
- id: 139
  category: penalties_and_points
  question: What is the maximum fine for a person convicted of violating Montana's
    open container law (possessing an open alcoholic beverage in the passenger area)?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: A person convicted of violating the open container law in Montana can
    be fined up to $100.
- id: 140
  category: penalties_and_points
  question: How many points are assessed for a conviction of 'Careless Driving' in
    Montana?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: Careless driving, along with most standard moving violations like failing
    to yield or following too closely, results in 2 points in Montana.
- id: 141
  category: penalties_and_points
  question: In Montana, how many points are assessed for a conviction of 'Failure
    to Yield to an Emergency Vehicle'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: A
  explanation: Failure to yield the right-of-way, including to emergency vehicles,
    is assessed 2 points on a Montana driving record.
- id: 142
  category: penalties_and_points
  question: If you are convicted of driving while your license is suspended or revoked
    in Montana, what is the mandatory minimum jail sentence for a first offense?
  choices:
    A: 24 hours
    B: 2 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: Under MCA 61-5-212, a person convicted of driving with a suspended
    or revoked license shall be punished by imprisonment for not less than 2 days
    or more than 6 months.
- id: 143
  category: sharing_the_road
  question: When approaching a school bus from either direction in Montana, how far
    from the bus must a driver stop when its red lights are flashing?
  choices:
    A: At least 10 feet
    B: At least 20 feet
    C: At least 30 feet
    D: At least 50 feet
  answer: C
  explanation: Montana law requires drivers to stop at least 30 feet from a school
    bus that is receiving or discharging school children with its red lights flashing.
- id: 144
  category: sharing_the_road
  question: 'In Montana, a person operating a bicycle who is approaching a stop sign
    must:'
  choices:
    A: Always come to a complete stop for at least 3 seconds
    B: Slow down and may proceed without stopping if it is safe to do so
    C: Stop only if there are motor vehicles present
    D: Dismount and walk the bicycle across the intersection
  answer: B
  explanation: Montana law (MCA 61-8-607) allows cyclists to treat stop signs as yield
    signs, slowing down and proceeding without stopping if the way is clear.
- id: 145
  category: sharing_the_road
  question: As of 2021, Montana law allows 'lane filtering' for motorcycles. Under
    what condition is this permitted?
  choices:
    A: On any road at any speed
    B: Only on highways when traffic is moving at the speed limit
    C: When traffic is stopped or moving slowly, and the motorcycle travels no faster
      than 20 mph
    D: Only when the motorcycle is being operated by a police officer
  answer: C
  explanation: MCA 61-8-359 allows motorcycle lane filtering between lanes of stopped
    or slow-moving traffic at a speed not exceeding 20 mph, provided conditions are
    safe.
- id: 146
  category: sharing_the_road
  question: When following a fire apparatus (fire truck) in Montana that is responding
    to an emergency, what is the minimum following distance allowed by law?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: MCA 61-8-364 prohibits drivers from following a fire apparatus traveling
    in response to a fire alarm closer than 500 feet.
- id: 147
  category: sharing_the_road
  question: In Montana, when must a driver yield to a pedestrian carrying a visible
    white cane or accompanied by a guide dog?
  choices:
    A: Only if the pedestrian is in a marked crosswalk
    B: Only if the pedestrian is at a traffic light
    C: At all times, as these are indicators of a blind or visually impaired pedestrian
    D: Only during daylight hours
  answer: C
  explanation: Montana law requires drivers to take all necessary precautions and
    yield the right-of-way to any pedestrian who is blind or visually impaired and
    using a white cane or guide dog.
- id: 148
  category: sharing_the_road
  question: 'When a funeral procession is led by a flashing amber light or escorted
    by police in Montana, other drivers must:'
  choices:
    A: Yield the right-of-way to all vehicles in the procession
    B: Only yield to the lead vehicle
    C: Pass the procession on the right
    D: Honk to show respect
  answer: A
  explanation: Under Montana law, vehicles in a funeral procession have the right-of-way
    at intersections regardless of traffic control devices, provided the lead vehicle
    entered legally.
- id: 149
  category: sharing_the_road
  question: What is the 'No-Zone' in regards to large trucks and commercial vehicles?
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the front, rear, and sides of the truck where the driver
      cannot see you
    C: The speed-restricted zone for trucks in Montana
    D: The weight limit area for bridges
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck. If you
    cannot see the truck driver's face in their side mirrors, they cannot see you.
- id: 150
  category: sharing_the_road
  question: 'In Montana, when a school bus is stopped on a divided highway with a
    median or physical barrier, traffic traveling in the opposite direction is:'
  choices:
    A: Required to stop at least 30 feet away
    B: Required to slow to 15 mph
    C: Not required to stop
    D: Required to stop only if children are crossing the median
  answer: C
  explanation: According to MCA 61-8-351, the driver of a vehicle on a highway with
    separate roadways (divided by a median or barrier) need not stop upon meeting
    or passing a school bus on a different roadway.
- id: 151
  category: sharing_the_road
  question: When passing a bicycle in Montana, what is the recommended safe distance
    a motorist should maintain between the vehicle and the bicycle?
  choices:
    A: At least 1 foot
    B: At least 3 feet
    C: At least 5 feet
    D: At least 10 feet
  answer: B
  explanation: While Montana law requires passing at a 'safe distance,' the Montana
    Driver Manual and safety guidelines recommend at least 3 feet of clearance when
    passing a cyclist.
- id: 152
  category: sharing_the_road
  question: 'If you are driving and an emergency vehicle with a siren and flashing
    lights approaches from behind, you should:'
  choices:
    A: Stop immediately in your lane
    B: Pull over to the right edge of the road and stop
    C: Speed up to get out of the way
    D: Pull over to the left median
  answer: B
  explanation: Montana law requires drivers to yield the right-of-way by pulling as
    close as possible to the right-hand edge or shoulder of the road and stopping
    until the emergency vehicle has passed.
- id: 153
  category: sharing_the_road
  question: Why should you allow more following distance when traveling behind a motorcycle?
  choices:
    A: Motorcycles have a much shorter stopping distance than cars
    B: Motorcycles are more likely to speed
    C: Motorcycles are required to stop at all intersections
    D: Motorcycles are lighter and easier to pass
  answer: A
  explanation: Motorcycles can stop much more quickly than larger vehicles. Following
    too closely (tailgating) can result in a rear-end collision if the motorcyclist
    brakes suddenly.
- id: 154
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may:'
  choices:
    A: Stay entirely in the right lane
    B: Swing wide to the left to complete the turn
    C: Turn from the left lane only
    D: Stop and wait for all traffic to clear in both directions
  answer: B
  explanation: Large trucks often need to swing wide to the left to clear the curb
    when making a right turn. Drivers should avoid 'squeezing' between the truck and
    the curb.
- id: 155
  category: sharing_the_road
  question: 'In Montana, pedestrians have the right-of-way:'
  choices:
    A: Only in marked crosswalks
    B: Only when a 'Walk' signal is displayed
    C: In both marked and unmarked crosswalks at intersections
    D: Only if they are crossing a highway
  answer: C
  explanation: Montana law grants pedestrians the right-of-way in crosswalks, whether
    they are marked with paint or are unmarked extensions of the sidewalk at an intersection.
- id: 156
  category: sharing_the_road
  question: When passing a person riding a bicycle in Montana, what is the minimum
    safe distance a motorist must maintain?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Montana law (MCA 61-8-320) requires motorists to provide a minimum
    of 3 feet of clearance when passing a person riding a bicycle.
- id: 157
  category: sharing_the_road
  question: In Montana, what is the maximum number of motorcycles allowed to ride
    abreast (side-by-side) in a single lane?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Montana law allows motorcycles to be operated no more than two abreast
    in a single lane.
- id: 158
  category: sharing_the_road
  question: When a pedestrian is crossing the street in an unmarked crosswalk at an
    intersection in Montana, who has the right-of-way?
  choices:
    A: The motorist, because the crosswalk is not marked
    B: The pedestrian
    C: The motorist, but only during daylight hours
    D: Whomever arrived at the intersection first
  answer: B
  explanation: In Montana, pedestrians have the right-of-way at all intersections,
    whether the crosswalk is marked or unmarked.
- id: 159
  category: sharing_the_road
  question: In Montana, what is the maximum fine for a first-time conviction of failing
    to stop for a school bus with its red lights flashing?
  choices:
    A: Up to $100
    B: Up to $250
    C: Up to $500
    D: Up to $1,000
  answer: C
  explanation: Under Montana law, a person convicted of failing to stop for a school
    bus can be fined up to $500 for a first offense.
- id: 160
  category: sharing_the_road
  question: When encountering a funeral procession in Montana, which of the following
    is true?
  choices:
    A: You may cut through the procession if there is a gap
    B: You must yield the right-of-way to the entire procession
    C: You should honk to show respect
    D: Processions must follow standard stop sign rules even if they have an escort
  answer: B
  explanation: In Montana, motorists must yield the right-of-way to a funeral procession.
    It is illegal to drive between vehicles in a procession or to enter an intersection
    while a procession is passing, regardless of traffic lights.
- id: 161
  category: sharing_the_road
  question: 'According to Montana law, a bicycle operated at night must be equipped
    with a lamp on the front that emits a white light visible from a distance of at
    least:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Montana Code 61-8-607 requires bicycles used at night to have a front
    lamp visible from 500 feet and a rear red reflector visible from 300 feet.
- id: 162
  category: sharing_the_road
  question: In Montana, how many feet must you stay behind a fire truck or apparatus
    that is responding to an alarm?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Montana law prohibits drivers from following fire apparatus closer
    than 500 feet when it is responding to an emergency.
- id: 163
  category: sharing_the_road
  question: Which motorcycle riders are required by Montana law to wear a protective
    helmet?
  choices:
    A: All riders regardless of age
    B: Only riders under the age of 18
    C: Only riders with less than 2 years of experience
    D: Only passengers, not the driver
  answer: B
  explanation: Montana law requires that any person under 18 years of age operating
    or riding upon a motorcycle must wear a helmet.
- id: 164
  category: sharing_the_road
  question: In Montana, if you are driving a slow-moving vehicle and a queue of how
    many vehicles forms behind you, must you pull over at the first safe turnout?
  choices:
    A: 3 vehicles
    B: 5 vehicles
    C: 7 vehicles
    D: 10 vehicles
  answer: B
  explanation: Montana Code 61-8-311 states that if 5 or more vehicles are formed
    in a line behind a slow-moving vehicle, the driver must pull over at the nearest
    safe turnout to let them pass.
- id: 165
  category: sharing_the_road
  question: 'When a bicyclist is using a left-turn lane at an intersection in Montana,
    they should be treated as:'
  choices:
    A: A pedestrian
    B: An obstruction that should be bypassed
    C: A vehicle
    D: A trespasser
  answer: C
  explanation: In Montana, bicyclists have the same rights and responsibilities as
    motor vehicle drivers. When using a turn lane, they should be treated as any other
    vehicle.
- id: 166
  category: sharing_the_road
  question: Large trucks often need to do what to complete a right turn in Montana?
  choices:
    A: Swing wide to the left before turning right
    B: Stop and back up mid-turn
    C: Turn from the left-most lane
    D: Speed up to maintain momentum
  answer: A
  explanation: Because of their length, large trucks must often swing wide to the
    left to clear the curb when making a right turn. Drivers should never try to squeeze
    between a truck and the curb.
- id: 167
  category: vehicle_information
  question: 'In Montana, you must turn on your headlights if you cannot see persons
    or vehicles clearly at a distance of:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: According to the Montana Driver Manual and MCA 61-9-201, headlights
    must be used from a half-hour after sunset to a half-hour before sunrise, and
    at any other time when visibility is less than 500 feet.
- id: 168
  category: vehicle_information
  question: 'In Montana, when following another vehicle from behind at night, you
    must dim your high beams when you are within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Montana law (MCA 61-9-221) requires drivers to switch to low beams
    when following another vehicle within 300 feet.
- id: 169
  category: vehicle_information
  question: Between which dates is it legal to use studded snow tires on Montana roadways?
  choices:
    A: November 1 through April 1
    B: October 1 through May 31
    C: September 15 through May 1
    D: October 15 through April 15
  answer: B
  explanation: Under Montana law (MCA 61-9-406), studded tires are permitted only
    from October 1 to May 31 of each year.
- id: 170
  category: vehicle_information
  question: 'In Montana, tires are considered unsafe and must be replaced if the tread
    depth is less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Montana vehicle safety standards specify that tires must have at least
    2/32 of an inch of tread depth in all major grooves.
- id: 171
  category: vehicle_information
  question: 'Every motor vehicle in Montana must be equipped with a horn that can
    be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: According to MCA 61-9-401, a motor vehicle must have a horn in good
    working order capable of emitting sound audible under normal conditions from a
    distance of not less than 200 feet.
- id: 172
  category: vehicle_information
  question: 'Montana law requires that a rearview mirror must allow the driver to
    see the highway for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: MCA 61-9-404 states that every motor vehicle must be equipped with
    a mirror so located as to reflect to the driver a view of the highway for a distance
    of at least 200 feet to the rear.
- id: 173
  category: vehicle_information
  question: 'The tail lamp or a separate lamp on a vehicle in Montana must illuminate
    the rear registration plate with a white light so it is legible from a distance
    of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: MCA 61-9-204 requires that the rear license plate be illuminated by
    a white light so as to be clearly legible from a distance of 50 feet to the rear.
- id: 174
  category: vehicle_information
  question: Under Montana law, the service brakes on a passenger vehicle must be able
    to stop the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 45 feet
  answer: B
  explanation: MCA 61-9-312 specifies that passenger vehicles must have a braking
    system capable of stopping the vehicle within 25 feet from a speed of 20 mph on
    a dry, smooth, level road.
- id: 175
  category: vehicle_information
  question: In Montana, what is the minimum light transmission percentage allowed
    for the front side windows of a motor vehicle?
  choices:
    A: 24%
    B: 35%
    C: 50%
    D: 70%
  answer: A
  explanation: According to MCA 61-9-405, window tinting on the front side windows
    must allow at least 24% light transmission (plus or minus 3%).
- id: 176
  category: vehicle_information
  question: 'Every motor vehicle in Montana must be equipped with at least two tail
    lamps (unless manufactured before 1956) that are visible from a distance of:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: MCA 61-9-204 states that tail lamps must be mounted on the rear and
    shall be visible from a distance of 500 feet to the rear.
- id: 177
  category: vehicle_information
  question: 'A ''Slow-Moving Vehicle'' emblem must be displayed on the rear of any
    vehicle in Montana that is designed for and travels at speeds less than:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: MCA 61-9-415 requires a slow-moving vehicle emblem on vehicles that
    normally travel at speeds of less than 25 miles per hour.
- id: 178
  category: vehicle_information
  question: 'In Montana, turn signal lights must be visible in normal sunlight from
    a distance of not less than:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: MCA 61-9-218 requires that signal lamps used to indicate a turn must
    be visible from a distance of not less than 100 feet in normal sunlight.
- id: 179
  category: vehicle_information
  question: Regarding exhaust systems, Montana law prohibits which of the following?
  choices:
    A: Dual exhaust pipes
    B: Mufflers with chrome tips
    C: Muffler cutouts or bypasses
    D: Exhaust systems that exit to the side
  answer: C
  explanation: MCA 61-9-403 states that every motor vehicle must be equipped with
    a muffler in good working order and prohibits the use of a muffler cutout, bypass,
    or similar device.
- id: 180
  category: vehicle_information
  question: If a load extends more than how many feet beyond the rear of a vehicle
    in Montana, a red flag (day) or red light (night) must be attached to the end
    of the load?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: MCA 61-9-213 requires that whenever a load extends to the rear 4 feet
    or more beyond the bed or body of a vehicle, it must be marked with a red flag
    during the day and a red light at night.
- id: 181
  category: vehicle_information
  question: According to Montana law, when must you turn on your vehicle's headlights?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: Only when it is raining or snowing
    C: From half an hour after sunset to half an hour before sunrise
    D: Only when you cannot see 1,000 feet ahead
  answer: C
  explanation: Montana law (61-9-201, MCA) requires headlights to be turned on from
    one-half hour after sunset to one-half hour before sunrise, and at any other time
    when visibility is less than 500 feet.
- id: 182
  category: vehicle_information
  question: What is the maximum allowable window tinting for the side windows to the
    immediate right and left of the driver in Montana?
  choices:
    A: Must allow at least 24% of light to pass through
    B: Must allow at least 35% of light to pass through
    C: Must allow at least 50% of light to pass through
    D: No tinting is allowed on side windows
  answer: A
  explanation: Montana law (61-9-405, MCA) specifies that window tinting on the front
    side windows must have a total light transmittance of no less than 24%.
- id: 183
  category: vehicle_information
  question: In Montana, every motor vehicle must be equipped with a mirror that allows
    the driver to see the highway for a distance of at least how many feet to the
    rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Montana Code 61-9-404 requires vehicles to have a mirror located to
    reflect to the driver a view of the highway for a distance of at least 200 feet
    to the rear.
- id: 184
  category: vehicle_information
  question: Regarding vehicle exhaust systems in Montana, which of the following is
    prohibited?
  choices:
    A: A muffler that is newer than the original equipment
    B: A muffler cutout, bypass, or similar device
    C: An exhaust pipe that extends to the rear of the vehicle
    D: A muffler that reduces engine noise
  answer: B
  explanation: Montana law (61-9-403, MCA) prohibits the use of a muffler cutout,
    bypass, or similar device upon a motor vehicle on a highway.
- id: 185
  category: vehicle_information
  question: In Montana, any trailer or semi-trailer must be equipped with independent
    braking systems if its gross weight exceeds how many pounds?
  choices:
    A: 1,500 pounds
    B: 2,000 pounds
    C: 3,000 pounds
    D: 5,000 pounds
  answer: C
  explanation: According to Montana Code 61-9-301, every trailer or semi-trailer with
    a gross weight of 3,000 pounds or more must be equipped with brakes acting on
    all wheels.
- id: 186
  category: vehicle_information
  question: Which type of vehicle is required by Montana law to be equipped with fenders
    or 'mud flaps' to prevent the throwing of water or rocks?
  choices:
    A: All passenger cars regardless of weight
    B: Only motorcycles and mopeds
    C: Trucks, trailers, or buses with a manufacturer's rated capacity exceeding 8,000
      pounds
    D: Only vehicles with out-of-state registrations
  answer: C
  explanation: Montana Code 61-9-407 requires fenders or splash aprons (mud flaps)
    for trucks, truck tractors, trailers, or buses with a capacity exceeding 8,000
    pounds GVW.
- id: 187
  category: vehicle_information
  question: 'A motor vehicle horn in Montana must be audible under normal conditions
    from a distance of not less than:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: Montana Code 61-9-401 states that a horn must be audible under normal
    conditions from a distance of not less than 200 feet.
- id: 188
  category: vehicle_information
  question: Tail lamps on a vehicle in Montana must be red and visible from a distance
    of how many feet to the rear?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Montana Code 61-9-204 requires every motor vehicle to have at least
    two tail lamps (for vehicles manufactured after 1956) that are visible from a
    distance of 500 feet to the rear.
- id: 189
  category: vehicle_information
  question: 'The light illuminating the rear registration plate (license plate) must
    make the plate clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: According to Montana Code 61-9-204, the rear registration plate must
    be illuminated so that it is clearly legible from a distance of 50 feet to the
    rear.
- id: 190
  category: signs_and_signals
  question: In Montana, what is the correct hand signal to indicate a right turn?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward at a 90-degree angle
    C: Left arm extended downward with palm facing the rear
    D: Right arm extended straight out the window
  answer: B
  explanation: According to the Montana Driver Manual, a right turn is signaled by
    extending the left arm out the window and pointing it upward at a 90-degree angle.
- id: 191
  category: signs_and_signals
  question: 'A pennant-shaped sign (isosceles triangle pointing right) found on the
    left side of the road in Montana indicates:'
  choices:
    A: A school zone ahead
    B: A yield requirement
    C: The start of a no-passing zone
    D: A railroad crossing
  answer: C
  explanation: In Montana and across the US, a pennant-shaped sign is placed on the
    left side of the road to mark the beginning of a no-passing zone.
- id: 192
  category: signs_and_signals
  question: What does a flashing yellow traffic light mean at a Montana intersection?
  choices:
    A: Stop and wait for the light to turn green
    B: Slow down and proceed with caution
    C: The light is about to turn red; clear the intersection
    D: Yield to all traffic, even if you have the right-of-way
  answer: B
  explanation: A flashing yellow light means you should slow down and proceed with
    caution, staying alert for hazards or crossing traffic.
- id: 193
  category: signs_and_signals
  question: 'In Montana, a solid white line painted on the pavement between lanes
    of traffic means:'
  choices:
    A: You may change lanes whenever it is safe
    B: The road is a one-way street
    C: You should stay in your lane; lane changes are discouraged
    D: Passing is permitted on the right only
  answer: C
  explanation: Solid white lines are used to discourage lane changes in areas where
    they might be dangerous, such as near intersections or off-ramps.
- id: 194
  category: signs_and_signals
  question: What is the standard shape for a school zone or school crossing sign in
    Montana?
  choices:
    A: Diamond
    B: Circle
    C: Pentagon (five-sided)
    D: Octagon
  answer: C
  explanation: School zone and school crossing signs are pentagon-shaped (five-sided)
    and are typically fluorescent yellow-green.
- id: 195
  category: signs_and_signals
  question: When you see a 'Shared Center Lane' marked with solid and dashed yellow
    lines on both sides, what is its primary purpose?
  choices:
    A: Passing slower traffic on a two-lane road
    B: Emergency parking only
    C: Making left turns from either direction
    D: High-occupancy vehicle (HOV) travel
  answer: C
  explanation: Shared center lanes are reserved for making left turns by vehicles
    traveling in either direction and should not be used for passing or through travel.
- id: 196
  category: signs_and_signals
  question: 'Under Montana law, you may turn right on a red light after a complete
    stop EXCEPT:'
  choices:
    A: During peak rush hour times
    B: If there is a sign prohibiting it
    C: If you are in a residential area
    D: If you have been stopped for more than 30 seconds
  answer: B
  explanation: Montana law allows drivers to turn right on red after coming to a complete
    stop and yielding to pedestrians and other traffic, unless a sign specifically
    prohibits the turn.
- id: 197
  category: signs_and_signals
  question: 'A yellow diamond-shaped sign with a black ''X'' and the letters ''RR''
    indicates:'
  choices:
    A: A rest area is 2 miles ahead
    B: A rural road intersection
    C: A railroad crossing is ahead
    D: A road repair zone
  answer: C
  explanation: The round or diamond-shaped yellow sign with a black 'X' and 'RR' is
    a warning sign that you are approaching a railroad crossing.
- id: 198
  category: signs_and_signals
  question: In Montana, what does a steady red arrow signal mean?
  choices:
    A: You may turn in the direction of the arrow after stopping
    B: You must stop and cannot turn in the direction of the arrow
    C: Yield to oncoming traffic before turning
    D: The arrow is about to turn green
  answer: B
  explanation: A steady red arrow means you must stop and remain stopped. You cannot
    make a turn in the direction indicated by the red arrow.
- id: 199
  category: signs_and_signals
  question: What does a triangular orange sign with a red border represent when attached
    to the rear of a vehicle?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is a wide load
    C: The vehicle is a slow-moving vehicle (traveling 25 mph or less)
    D: The vehicle is a student driver
  answer: C
  explanation: The slow-moving vehicle emblem is a reflective orange triangle with
    a red border, used on vehicles like tractors or construction equipment that travel
    at speeds of 25 mph or less.
- id: 200
  category: signs_and_signals
  question: 'A flashing red light at an intersection in Montana has the same meaning
    as:'
  choices:
    A: A yield sign
    B: A stop sign
    C: A caution sign
    D: A construction zone sign
  answer: B
  explanation: A flashing red light requires a complete stop. You may proceed only
    after yielding the right-of-way to other vehicles and pedestrians, just like at
    a stop sign.
- id: 201
  category: signs_and_signals
  question: Which of these is the correct hand signal for 'Slow or Stop' in Montana?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm waving toward the ground
  answer: C
  explanation: To signal that you are slowing down or stopping using hand signals,
    extend your left arm out the window and point it downward with your palm facing
    the rear.
- id: 202
  category: signs_and_signals
  question: 'In Montana, double solid yellow lines in the center of the road mean:'
  choices:
    A: Passing is allowed from either side
    B: Passing is allowed only on the right
    C: Passing is prohibited from either direction
    D: The road is one-way
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    traffic traveling in either direction.
- id: 203
  category: signs_and_signals
  question: What does a flashing yellow traffic light signify in Montana?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection
    C: Proceed with caution
    D: Treat it as a four-way stop
  answer: C
  explanation: A flashing yellow light means you should slow down and proceed with
    caution, staying alert for potential hazards.
- id: 204
  category: signs_and_signals
  question: When you see a 'Slow Moving Vehicle' emblem (an orange triangle with a
    red strip on each side) on the rear of a vehicle, it means the vehicle is traveling
    at what speed?
  choices:
    A: 35 mph or less
    B: 25 mph or less
    C: 15 mph or less
    D: 45 mph or less
  answer: B
  explanation: The slow-moving vehicle emblem is required on vehicles that travel
    at speeds of 25 mph or less, such as farm machinery or construction equipment.
- id: 205
  category: signs_and_signals
  question: In Montana, what is the default speed limit in a residential district
    if no signs are posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: Unless otherwise posted, the speed limit in Montana residential districts
    is 25 mph.
- id: 206
  category: signs_and_signals
  question: A steady yellow traffic light means that the signal is about to turn red.
    What should a Montana driver do?
  choices:
    A: Stop if it is safe to do so
    B: Accelerate to beat the red light
    C: Always stop, even if in the middle of the intersection
    D: Honk to warn other drivers
  answer: A
  explanation: A steady yellow light indicates the light is changing to red. You should
    stop if you can do so safely; otherwise, proceed through the intersection with
    caution.
- id: 207
  category: signs_and_signals
  question: 'To signal a right turn using hand signals, a Montana driver should:'
  choices:
    A: Extend the left arm straight out the window
    B: Extend the left arm out and bend it upward at the elbow
    C: Extend the left arm out and bend it downward at the elbow
    D: Extend the right arm straight out the window
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out the window and bent upward at a 90-degree angle.
- id: 208
  category: signs_and_signals
  question: What is the meaning of a flashing red traffic light in Montana?
  choices:
    A: Slow down and yield to all traffic
    B: The light is broken; proceed with caution
    C: Stop completely and proceed only when it is safe
    D: Stop and wait for the light to turn green
  answer: C
  explanation: A flashing red light is treated the same as a stop sign. You must come
    to a complete stop and yield the right-of-way before proceeding.
- id: 209
  category: signs_and_signals
  question: A 'Shared Center Lane' (marked by solid and dashed yellow lines) is intended
    for which of the following?
  choices:
    A: Passing slower traffic
    B: Emergency parking only
    C: Making left turns only
    D: High-occupancy vehicles only
  answer: C
  explanation: Shared center lanes are reserved for making left turns and cannot be
    used for passing or through-travel.
- id: 210
  category: signs_and_signals
  question: In Montana, what shape is a standard 'School Zone' or 'School Crossing'
    sign?
  choices:
    A: Diamond
    B: Octagon
    C: Pentagon
    D: Circle
  answer: C
  explanation: School-related warning signs are five-sided (pentagon) and are typically
    fluorescent yellow-green.
- id: 211
  category: signs_and_signals
  question: What does a solid white line between lanes of traffic moving in the same
    direction indicate?
  choices:
    A: You are in a one-way street
    B: You should stay in your lane and avoid changing lanes
    C: You must turn at the next intersection
    D: Passing is encouraged
  answer: B
  explanation: A solid white line indicates that lane changes are discouraged for
    safety reasons, though not strictly prohibited like a double solid line.
- id: 212
  category: signs_and_signals
  question: What is the standard color for construction and maintenance warning signs
    in Montana?
  choices:
    A: Yellow
    B: Red
    C: Orange
    D: Green
  answer: C
  explanation: Orange is the standard background color for signs in work zones to
    alert drivers to construction or maintenance activities.
- id: 213
  category: signs_and_signals
  question: In Montana, if you are turning left at an intersection and the traffic
    light shows a green 'arrow' pointing left, what does this mean?
  choices:
    A: You must yield to oncoming traffic before turning
    B: You have a protected turn and oncoming traffic is stopped
    C: You must wait for a solid green light before turning
    D: The turn is prohibited
  answer: B
  explanation: A green arrow means you have a 'protected' turn, meaning oncoming traffic
    should be stopped by a red light.
- id: 214
  category: signs_and_signals
  question: What is the meaning of a pennant-shaped (sideways triangle) sign placed
    on the left side of the road?
  choices:
    A: Yield right-of-way
    B: School zone ahead
    C: No passing zone
    D: End of construction
  answer: C
  explanation: A pennant-shaped sign is used specifically to mark the beginning of
    a 'No Passing Zone' and is placed on the left side of the road for better visibility.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 215
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 216
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 217
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 218
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 219
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 220
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 221
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 222
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 223
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 224
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 225
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 226
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 227
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 228
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 229
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 230
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 231
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 232
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 233
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 234
- image: merge.png
