questions:
- id: 1
  category: driver_responsibility
  question: ¿Cuál es la referencia legal principal que utilizan los tribunales para
    las leyes de vehículos motorizados de Montana?
  choices:
    A: El Manual del Conductor de Montana
    B: El Código de Montana Anotado (Montana Code Annotated)
    C: La Guía de la Oficina de Instrucción Pública
    D: El Manual del Fiscal General
  answer: B
  explanation: El manual establece que parafrasea las leyes de vehículos motorizados
    de Montana y no es una referencia legal completa. Los tribunales se rigen por
    el lenguaje real del Código de Montana Anotado (Montana Code Annotated).
- id: 2
  category: license_system
  question: Según el Manual del Conductor de Montana, ¿qué representa una Licencia
    de Conducir Estándar Clase D?
  choices:
    A: Una licencia comercial
    B: Una licencia no comercial
    C: Solo un endoso de motocicleta
    D: Una licencia de aprendizaje
  answer: B
  explanation: El índice enumera explícitamente la 'Licencia de Conducir Estándar
    Clase D' como una '(licencia no comercial)'.
- id: 3
  category: driver_testing
  question: ¿Dónde puede programar su examen de conducir de Montana en línea?
  choices:
    A: www.dojmt.gov/driving
    B: www.mt.gov/mvd
    C: www.montanadriving.com
    D: www.opi.mt.gov/driving
  answer: A
  explanation: 'La introducción del manual establece claramente: ''Programe su examen
    en línea: www.dojmt.gov/driving''.'
- id: 4
  category: license_system
  question: ¿Qué significa GDL en el sistema de licencias de conducir de Montana?
  choices:
    A: Licencia de Conducir General (General Driver License)
    B: Licencia de Conducir Graduada (Graduated Driver Licensing)
    C: Aprendizaje de Conducción Guiado (Guided Driver Learning)
    D: Responsabilidad del Conductor Garantizada (Guaranteed Driver Liability)
  answer: B
  explanation: El índice del Capítulo 1 incluye una sección titulada 'Programa de
    Licencia de Conducir Graduada (GDL)'.
- id: 5
  category: driver_testing
  question: ¿Qué organización proporciona un manual del conductor ilustrado adaptado?
  choices:
    A: La División de Vehículos Motorizados (Motor Vehicle Division)
    B: La Oficina de Instrucción Pública (Office of Public Instruction)
    C: La Oficina del Fiscal General
    D: El Departamento de Transporte
  answer: B
  explanation: La introducción señala que un manual del conductor ilustrado adaptado
    está disponible en la Oficina de Instrucción Pública en su sitio web o llamando
    al 1-888-231-9393.
- id: 6
  category: license_system
  question: ¿Qué significa CDL?
  choices:
    A: Licencia de Conducir Certificada (Certified Driver License)
    B: Licencia de Conducir Comercial (Commercial Driver License)
    C: Licencia Clase D
    D: Licencia de Conducir del Condado
  answer: B
  explanation: El índice enumera 'Licencia de Conducir Comercial (CDL)' bajo los tipos
    de licencias de Montana.
- id: 7
  category: safe_driving_rules
  question: Según la carta del Fiscal General, ¿cuál de los siguientes es parte de
    la 'regla de la carretera' (way of the road)?
  choices:
    A: Conducir más rápido
    B: Salir más temprano
    C: Mantenerse relajado
    D: Vivir libre
  answer: B
  explanation: 'El Fiscal General Austin Knudsen aconseja a los conductores seguir
    la regla de la carretera: ''salga más temprano, conduzca más despacio, manténgase
    alerta y viva más tiempo''.'
- id: 8
  category: vehicle_information
  question: ¿Cuál de los siguientes NO figura como un sistema del vehículo a revisar
    durante la planificación de un viaje?
  choices:
    A: Sistema de frenado
    B: Sistema de escape
    C: Sistema de entretenimiento
    D: Sistema de suspensión
  answer: C
  explanation: El índice del Capítulo 2 enumera el Sistema de Frenado, el Sistema
    de Escape y el Sistema de Suspensión bajo 'Revisar el Vehículo', pero no enumera
    un Sistema de Entretenimiento.
- id: 9
  category: vehicle_information
  question: ¿De qué color deben ser los reflectores traseros obligatorios en un vehículo
    motorizado?
  choices:
    A: Blanco
    B: Ámbar
    C: Rojo
    D: Amarillo
  answer: C
  explanation: El índice del Capítulo 2 enumera específicamente 'Reflectores rojos
    (traseros)' bajo Equipo de Vehículos Motorizados.
- id: 10
  category: vehicle_information
  question: ¿Qué capítulo del Manual del Conductor de Montana cubre el Equipo de Vehículos
    Motorizados?
  choices:
    A: Capítulo 1
    B: Capítulo 2
    C: Capítulo 3
    D: Capítulo 4
  answer: B
  explanation: El índice etiqueta claramente el 'CAPÍTULO 2 – EQUIPO DE VEHÍCULOS
    MOTORIZADOS'.
- id: 11
  category: license_system
  question: ¿Si necesita información adicional que no se encuentra en el manual, cuál
    de las siguientes NO figura como una fuente para obtenerla?
  choices:
    A: Una biblioteca pública
    B: Una agencia de aplicación de la ley
    C: Un examinador de conductores
    D: Una escuela de manejo privada
  answer: D
  explanation: El manual establece que se puede obtener información adicional en una
    biblioteca pública, una agencia de aplicación de la ley, un examinador de conductores,
    el sitio web del DOJ o la División de Vehículos Motorizados. No menciona las escuelas
    de manejo privadas.
- id: 12
  category: license_system
  question: ¿Cuál es el número de teléfono de la División de Vehículos Motorizados
    (Motor Vehicle Division) en Helena, MT?
  choices:
    A: 1-888-231-9393
    B: 1-406-444-3933
    C: 1-800-555-1234
    D: 1-406-555-9876
  answer: B
  explanation: El manual proporciona la información de contacto de la División de
    Vehículos Motorizados en P.O. Box 201430, Helena, MT 59620-1430 o al 1-406-444-3933.
- id: 13
  category: vehicle_information
  question: ¿Cuál de los siguientes elementos figura bajo el rubro de Equipo de Vehículos
    Motorizados en el Capítulo 2?
  choices:
    A: Luz de la placa de matrícula
    B: Bolsas de aire
    C: Cinturones de seguridad
    D: Navegación GPS
  answer: A
  explanation: El índice del Capítulo 2 enumera 'Luz de la placa de matrícula' (License
    Plate Lamp) bajo la sección de Equipo de Vehículos Motorizados.
- id: 14
  category: driver_testing
  question: Según la introducción del manual, ¿qué sucede si usted no conoce la información
    contenida en el manual?
  choices:
    A: Tendrá que pagar una tarifa más alta
    B: No podrá aprobar los exámenes escrito y de conducción
    C: Debe tomar un curso obligatorio de educación vial
    D: Solo recibirá una licencia restringida
  answer: B
  explanation: 'La introducción establece explícitamente: ''A menos que conozca la
    información que contiene, no podrá aprobar los exámenes escrito y de conducción''.'
- id: 15
  category: penalties_and_points
  question: Según el manual, ¿qué sucede con las multas de tráfico en las zonas escolares?
  choices:
    A: Se reducen a la mitad
    B: Se anulan
    C: Se duplican
    D: Permanecen iguales
  answer: C
  explanation: El manual incluye específicamente una sección titulada 'Multas duplicadas
    en zonas escolares'.
- id: 16
  category: vehicle_information
  question: ¿Dónde deben estar ubicados los reflectores rojos en un vehículo?
  choices:
    A: En la parte delantera
    B: En la parte trasera
    C: En los laterales
    D: En el techo
  answer: B
  explanation: El manual enumera 'Reflectores rojos (traseros)' bajo los requisitos
    de equipo del vehículo.
- id: 17
  category: vehicle_information
  question: ¿Qué otro término se utiliza en el manual para las luces de búsqueda (spot
    lamps) y las luces auxiliares?
  choices:
    A: Luces de gálibo
    B: Luces de niebla
    C: Luces de carga proyectada
    D: Luces demarcadoras
  answer: B
  explanation: El manual agrupa estos elementos en la sección titulada 'Luces de búsqueda
    y luces auxiliares (Luces de niebla)'.
- id: 18
  category: safe_driving_rules
  question: ¿Qué se debe utilizar para marcar una carga proyectada en un vehículo?
  choices:
    A: Una lámpara o bandera
    B: Una bengala o cono
    C: Una cadena de seguridad
    D: Un guardabarros
  answer: A
  explanation: El manual incluye una sección sobre equipo titulada 'Lámpara o bandera
    de carga proyectada'.
- id: 19
  category: signs_and_signals
  question: ¿Cómo sugiere el manual que se pueden identificar y conocer las señales
    de tráfico?
  choices:
    A: Por su tamaño y peso
    B: Por su forma y color
    C: Por su material y textura
    D: Por su altura y ubicación
  answer: B
  explanation: El manual incluye una sección titulada 'Conozca las señales por su
    forma y color'.
- id: 20
  category: safe_driving_rules
  question: ¿Qué debe mostrar un conductor cuando su vehículo queda averiado?
  choices:
    A: Comprobante de seguro
    B: Dispositivos de advertencia
    C: Una bandera blanca
    D: Su licencia de conducir
  answer: B
  explanation: El manual contiene una sección titulada 'Exhibición de dispositivos
    de advertencia cuando los vehículos están averiados'.
- id: 21
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos se indica explícitamente como obligatorio
    para los vehículos?
  choices:
    A: Llantas personalizadas
    B: Guardabarros (Mud flaps)
    C: Vidrios polarizados
    D: Bocinas auxiliares
  answer: B
  explanation: El manual indica explícitamente "Guardabarros obligatorios" (Mud Flaps
    Required) en la sección de equipo del vehículo.
- id: 22
  category: safe_driving_rules
  question: Según el manual, ¿qué tipo de sistemas de sujeción se requieren para los
    pasajeros jóvenes?
  choices:
    A: Sistemas de sujeción para niños
    B: Solo asientos elevados (booster seats)
    C: Solo cinturones de regazo
    D: Bolsas de aire
  answer: A
  explanation: El manual incluye una sección titulada "Sistemas de sujeción para niños
    obligatorios" (Child Restraints Required).
- id: 23
  category: safe_driving_rules
  question: Antes de conducir, ¿qué debe hacer con respecto a las ventanas y superficies
    de vidrio de su vehículo?
  choices:
    A: Polarizarlas
    B: Limpiarlas todas
    C: Bajarlas
    D: Quitarlas
  answer: B
  explanation: El manual incluye un paso previo a la conducción titulado "Limpiar
    todas las ventanas y superficies de vidrio".
- id: 24
  category: vehicle_information
  question: ¿Qué tipos de vehículos tienen requisitos especiales de iluminación según
    el manual?
  choices:
    A: Motocicletas y ciclomotores
    B: Tractores agrícolas e implementos de labranza
    C: Bicicletas y scooters
    D: Autos deportivos y descapotables
  answer: B
  explanation: El manual incluye una sección titulada "Iluminación especial para tractores
    agrícolas e implementos de labranza".
- id: 25
  category: safe_driving_rules
  question: ¿Qué ajustes debe realizar un conductor antes de operar el vehículo?
  choices:
    A: Ajustar el asiento y los espejos
    B: Ajustar la presión de los neumáticos
    C: Ajustar la sincronización del motor
    D: Ajustar el silenciador
  answer: A
  explanation: El manual enumera "Ajustar el asiento y los espejos" como un paso para
    los conductores.
- id: 26
  category: signs_and_signals
  question: ¿Cuál de los siguientes se enumera como una señal o advertencia en un
    cruce de ferrocarril?
  choices:
    A: Señales de aspa (Cross buck signs)
    B: Señales de alto (Stop)
    C: Señales de ceda el paso (Yield)
    D: Señales de límite de velocidad
  answer: A
  explanation: El manual enumera las "Señales de aspa de ferrocarril" (Railroad Cross
    Buck Signs) en la sección de Señales/Advertencias de cruce de ferrocarril.
- id: 27
  category: vehicle_information
  question: ¿Qué deben llevar ciertos vehículos en caso de emergencia?
  choices:
    A: Neumáticos de repuesto
    B: Bengalas u otros dispositivos de advertencia
    C: Combustible extra
    D: Un kit de herramientas
  answer: B
  explanation: El manual incluye una sección titulada "Ciertos vehículos deben llevar
    bengalas u otros dispositivos de advertencia".
- id: 28
  category: signs_and_signals
  question: ¿Qué temas se tratan en el Capítulo 3 del Manual del Conductor de Montana?
  choices:
    A: Licencias y registro
    B: Señales, semáforos y marcas viales
    C: Mantenimiento del vehículo
    D: Conducir bajo la influencia (DUI)
  answer: B
  explanation: El manual titula explícitamente el Capítulo 3 como "SEÑALES, SEMÁFOROS
    Y MARCAS VIALES".
- id: 29
  category: vehicle_information
  question: ¿Cuál de los siguientes se enumera como un requisito o consideración de
    equipo específico en el manual?
  choices:
    A: Cadenas de seguridad
    B: Portaequipajes de techo
    C: Enganches de remolque
    D: Cabrestantes (Winches)
  answer: A
  explanation: El manual enumera las "Cadenas de seguridad" como un tema dentro del
    equipo del vehículo.
- id: 30
  category: sharing_the_road
  question: Según la sección del manual sobre Ciclistas y Automovilistas, ¿qué principio
    se aplica al compartir la carretera?
  choices:
    A: Los ciclistas siempre deben ceder el paso a los vehículos motorizados
    B: Misma carretera – Mismas reglas – Mismos derechos
    C: Los automovilistas tienen el derecho de paso principal
    D: Las bicicletas están restringidas a las aceras y carriles para bicicletas
  answer: B
  explanation: El texto del manual proporcionado enumera explícitamente "Misma carretera
    – Mismas reglas – Mismos derechos" en la sección "Ciclistas y automovilistas".
- id: 31
  category: driver_responsibility
  question: ¿Cuál de los siguientes se menciona como un subtema específico bajo 'Seguro
    de Vehículos Motorizados'?
  choices:
    A: Autoaseguradores (Self-Insurers)
    B: Reparación de colisiones
    C: Seguro de salud
    D: Seguro de vida
  answer: A
  explanation: El texto del manual enumera 'Requisitos', 'Consecuencias', 'Autoaseguradores'
    y el 'Sistema de Verificación de Seguros de Montana (MTIVS)' bajo la sección de
    Seguro de Vehículos Motorizados.
- id: 32
  category: safe_driving_rules
  question: 'Según la sección ''Ajuste de la velocidad'', los conductores deben ajustar
    su velocidad a las condiciones de la carretera, el tráfico y:'
  choices:
    A: El tipo de vehículo que conducen
    B: Qué tan bien pueden ver
    C: El número de pasajeros en el vehículo
    D: El límite de velocidad de la zona anterior
  answer: B
  explanation: La sección 'Ajuste de la velocidad' incluye subencabezados para 'Ajuste
    a las condiciones de la carretera', 'Ajuste al tráfico' y 'Ajuste a qué tan bien
    puede ver'.
- id: 33
  category: defensive_driving
  question: La sección 'Compartir el espacio' del manual enfatiza el mantenimiento
    del espacio en ¿cuál de las siguientes áreas?
  choices:
    A: Solo el espacio delante del vehículo
    B: Espacio delante, detrás y a los lados
    C: Solo el espacio para incorporarse
    D: Espacio por encima y por debajo del vehículo
  answer: B
  explanation: La sección 'Compartir el espacio' enumera explícitamente 'Espacio adelante',
    'Espacio atrás' y 'Espacio a los lados' como áreas clave a gestionar.
- id: 34
  category: safe_driving_rules
  question: Bajo la sección 'Derecho de paso', ¿cuál de las siguientes situaciones
    se aborda específicamente?
  choices:
    A: Cortejos fúnebres
    B: Carriles de autoservicio
    C: Estacionamientos
    D: Entradas privadas
  answer: A
  explanation: El texto proporcionado enumera 'Cortejo fúnebre' como un subtema específico
    bajo la sección de 'Derecho de paso'.
- id: 35
  category: defensive_driving
  question: ¿Qué dos conceptos principales se cubren en la sección 'Comunicación'
    de la conducción segura?
  choices:
    A: Usar un teléfono celular y radio CB
    B: Tocar la bocina y parpadear las luces
    C: Hacer saber a los demás que usted está allí y qué está haciendo
    D: Leer las señales de tráfico y escuchar los informes de tráfico
  answer: C
  explanation: 'La sección ''Comunicación'' se divide en dos partes: ''Hacer saber
    a los demás que usted está allí'' y ''Hacer saber a los demás qué está haciendo''.'
- id: 36
  category: safe_driving_rules
  question: ¿Cuáles de las siguientes habilidades se incluyen en la sección 'Conducción
    básica'?
  choices:
    A: Cambiar una llanta y revisar el aceite
    B: Acelerar y maniobrar (Steering)
    C: Cargar gasolina y lavar el parabrisas
    D: Estacionamiento en paralelo y retroceder
  answer: B
  explanation: 'La sección ''Conducción básica'' incluye los subtemas: Arrancar, Acelerar,
    Maniobrar (Steering), Controlar la velocidad y Detenerse.'
- id: 37
  category: safe_driving_rules
  question: Según la tabla de contenido del manual, ¿cuál de los siguientes es un
    tipo específico de estacionamiento cubierto?
  choices:
    A: Estacionamiento en diagonal
    B: Estacionamiento en paralelo
    C: Estacionamiento en ángulo inverso
    D: Estacionamiento con valet
  answer: B
  explanation: La sección 'Estacionamiento' enumera explícitamente 'Estacionamiento
    en paralelo' junto con 'Estacionamiento en una colina' y 'Zonas de no estacionar'.
- id: 38
  category: sharing_the_road
  question: El manual incluye una sección específica sobre el equipo e iluminación
    requeridos para ¿qué tipo de transporte?
  choices:
    A: Motocicletas
    B: Bicicletas
    C: Camiones comerciales
    D: Carruajes tirados por caballos
  answer: B
  explanation: El texto enumera 'Equipo e iluminación requeridos para bicicletas'
    bajo la sección de Ciclistas y Automovilistas.
- id: 39
  category: defensive_driving
  question: Bajo la sección 'Ver bien', ¿qué condición de conducción específica se
    aborda?
  choices:
    A: Conducir con niebla
    B: Conducción nocturna
    C: Conducir en la nieve
    D: Conducir bajo lluvia intensa
  answer: B
  explanation: La sección 'Ver bien' incluye subtemas para 'Escaneo' y 'Conducción
    nocturna'.
- id: 40
  category: signs_and_signals
  question: ¿Cuál de los siguientes se enumera bajo la sección 'Marcas en el pavimento'?
  choices:
    A: Líneas de borde y de carril
    B: Señales de alto
    C: Semáforos
    D: Reductores de velocidad
  answer: A
  explanation: La sección 'Marcas en el pavimento' cubre 'Líneas de borde y de carril',
    'Otros controles de carril' y 'Sin marcas de carril'.
- id: 41
  category: sharing_the_road
  question: En la sección de 'Derecho de paso' (Right-of-Way), ¿qué tipos específicos
    de vehículos se mencionan junto con los autobuses escolares?
  choices:
    A: Camiones de entrega
    B: Vehículos de emergencia
    C: Taxis
    D: Autobuses de transporte público
  answer: B
  explanation: La sección de 'Derecho de paso' enumera explícitamente los 'Vehículos
    de emergencia' justo antes de los 'Autobuses escolares'.
- id: 42
  category: driver_testing
  question: ¿Para qué dispositivos menciona el manual que está disponible específicamente
    una aplicación de examen de conducir?
  choices:
    A: Android y Windows
    B: iPad y iPhone
    C: Mac y PC
    D: Kindle y Nook
  answer: B
  explanation: El texto enumera explícitamente un 'Examen de conducir para iPad e
    iPhone' al comienzo del Capítulo 4.
- id: 43
  category: defensive_driving
  question: 'Según la sección ''Compartir el espacio'' (Sharing Space), los conductores
    deben gestionar el espacio para incorporarse y el espacio para cruzar o:'
  choices:
    A: Entrar
    B: Salir
    C: Estacionar
    D: Dar la vuelta
  answer: A
  explanation: El último elemento enumerado en la sección 'Compartir el espacio' en
    el texto proporcionado es 'Espacio para cruzar o entrar'.
- id: 44
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para ser elegible para renovar su
    licencia de conducir de Montana en línea?
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '67'
  answer: B
  explanation: Según la División de Vehículos Motorizados, los clientes deben tener
    entre 21 y 67 años para renovar su licencia de conducir en línea.
- id: 45
  category: license_system
  question: ¿Cuál es la edad máxima a la que un cliente es elegible para renovar su
    licencia de conducir en línea?
  choices:
    A: '55'
    B: '65'
    C: '67'
    D: '70'
  answer: C
  explanation: Para renovar una licencia de conducir en línea, el cliente debe tener
    entre 21 y 67 años.
- id: 46
  category: license_system
  question: ¿Con cuánta antelación a su fecha de vencimiento es elegible para renovar
    su licencia de conducir en línea?
  choices:
    A: 1 mes antes
    B: 3 meses antes
    C: 6 meses antes
    D: 12 meses antes
  answer: C
  explanation: Los clientes son elegibles para la renovación en línea hasta 6 meses
    antes de la fecha de vencimiento de su licencia.
- id: 47
  category: license_system
  question: ¿Cuánto tiempo después de la fecha de vencimiento de su licencia de conducir
    aún puede renovarla en línea?
  choices:
    A: 1 mes
    B: 3 meses
    C: 6 meses
    D: No se puede renovar en línea después de que venza.
  answer: B
  explanation: Los clientes son elegibles para la renovación en línea dentro de los
    3 meses posteriores a su fecha de vencimiento.
- id: 48
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para renovar su licencia de conducir
    en línea?
  choices:
    A: Usted debe ser ciudadano de los EE. UU.
    B: Usted debe realizar un examen de la vista en línea.
    C: Usted debe tener al menos 18 años de edad.
    D: Usted debe tener una licencia de conducir comercial.
  answer: A
  explanation: Para renovar una licencia de conducir en línea, el manual establece
    que el cliente debe ser ciudadano de los EE. UU.
- id: 49
  category: defensive_driving
  question: Según el manual, ¿cuál de las siguientes es una maniobra reconocida para
    evitar colisiones?
  choices:
    A: Cerrar los ojos
    B: Acelerar
    C: Tocar la bocina continuamente
    D: Poner el vehículo en punto muerto (neutral)
  answer: B
  explanation: El manual enumera 'Acelerar' junto con 'Detenerse rápidamente' y 'Girar
    rápidamente' como métodos para evitar colisiones.
- id: 50
  category: safe_driving_rules
  question: ¿Cuál de las siguientes situaciones se clasifica como una emergencia del
    vehículo en el manual del conductor?
  choices:
    A: Un parabrisas sucio
    B: El pedal del acelerador se queda trabado
    C: Quedarse sin líquido limpiaparabrisas
    D: Una luz de cortesía interior fundida
  answer: B
  explanation: El manual cubre específicamente 'El pedal del acelerador se queda trabado'
    como una emergencia del vehículo, junto con fallas en los frenos, reventón de
    neumáticos, falla de energía y falla de los faros.
- id: 51
  category: license_system
  question: ¿Cuál de los siguientes servicios se analiza en el capítulo "Otros servicios"
    del Manual del Conductor de Montana?
  choices:
    A: Registro de vehículos
    B: Donación de órganos y tejidos
    C: Solicitudes de pasaporte
    D: Pagos de impuestos sobre la propiedad
  answer: B
  explanation: El Capítulo 9 (Otros servicios) incluye información sobre el Registro
    de votantes, el Servicio Selectivo, la Donación de órganos y tejidos y los Testamentos
    vitales.
- id: 52
  category: license_system
  question: ¿Cuál es uno de los beneficios de utilizar el servicio de programación
    de citas en línea?
  choices:
    A: Garantiza que usted aprobará su examen de conducir.
    B: Le ayuda a evitar esperar al teléfono cuando las líneas del Centro de Atención
      al Cliente están ocupadas.
    C: Proporciona un descuento en la tarifa de su licencia.
    D: Le permite omitir el examen de la vista.
  answer: B
  explanation: Programar en línea le permite gestionar citas las 24 horas, los 7 días
    de la semana y le ayuda a evitar esperar al teléfono cuando las líneas del Centro
    de Atención al Cliente están ocupadas.
- id: 53
  category: defensive_driving
  question: El manual ofrece consejos específicos sobre cómo protegerse en caso de
    colisión según la dirección del impacto. ¿Cuál de los siguientes es uno de los
    tipos de colisión cubiertos?
  choices:
    A: Golpeado desde arriba
    B: Golpeado por detrás
    C: Golpeado mientras está estacionado
    D: Golpeado por un peatón
  answer: B
  explanation: El manual explica cómo protegerse cuando lo golpean por detrás, por
    el lado y por delante.
- id: 54
  category: license_system
  question: ¿Qué sitio web proporciona la División de Vehículos Motorizados para acceder
    a los servicios de conducción en línea?
  choices:
    A: dojmt.gov/driving
    B: montana.gov/cars
    C: mvd.mt.gov
    D: drivemontana.com
  answer: A
  explanation: La División de Vehículos Motorizados ofrece servicios en línea en dojmt.gov/driving
    y mtrealid.gov.
- id: 55
  category: driver_responsibility
  question: Según la sección del manual sobre accidentes, ¿cuál es uno de los temas
    clave que debe saber cómo manejar?
  choices:
    A: Cómo reparar un parachoques abollado
    B: Si alguien resulta herido
    C: Cómo calcular las primas de seguro
    D: Cómo remolcar un vehículo usted mismo
  answer: B
  explanation: La sección de Accidentes cubre qué hacer en la escena del accidente,
    qué hacer si alguien resulta herido y cómo reportar el accidente.
- id: 56
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes puntos se incluye en los Requisitos Físicos para
    conducir?
  choices:
    A: Altura y peso
    B: Visión, audición y fatiga
    C: Fuerza física
    D: Velocidad al correr
  answer: B
  explanation: El Capítulo 6 sobre Requisitos Físicos cubre específicamente la visión,
    la audición y la fatiga.
- id: 57
  category: driver_responsibility
  question: ¿Cuál de los siguientes temas se aborda específicamente en la sección
    para conductores de la tercera edad (Senior Drivers)?
  choices:
    A: Comprar un auto nuevo
    B: Dejar de conducir
    C: Actualizar a una licencia comercial
    D: Conducir con adolescentes
  answer: B
  explanation: La sección para conductores de la tercera edad incluye "Consideraciones
    para ciudadanos de la tercera edad" y "Dejar de conducir".
- id: 58
  category: license_system
  question: Para ser elegible para renovar una licencia de conducir de Montana en
    línea, ¿entre qué edades debe estar un ciudadano estadounidense?
  choices:
    A: 18 y 65 años
    B: 21 y 67 años
    C: 25 y 70 años
    D: 16 y 80 años
  answer: B
  explanation: Según el manual, la renovación de la licencia de conducir en línea
    requiere que el cliente sea ciudadano estadounidense y tenga entre 21 y 67 años.
- id: 59
  category: license_system
  question: ¿Cuál de los siguientes datos NO se muestra cuando un usuario autorizado
    consulta un Registro de Historial del Conductor de Montana?
  choices:
    A: El nombre del conductor
    B: La fecha de nacimiento del conductor
    C: El número de Seguro Social del conductor
    D: El estado actual de la licencia del conductor
  answer: C
  explanation: El manual establece que los Registros de Historial del Conductor no
    muestran el número de Seguro Social, la dirección ni ningún número de licencia
    de conducir anterior del conductor.
- id: 60
  category: license_system
  question: ¿Cuántos días tiene un nuevo residente para solicitar la conversión de
    su licencia de conducir no comercial válida de otro estado a una licencia de Montana?
  choices:
    A: 30 días consecutivos
    B: 60 días consecutivos
    C: 90 días consecutivos
    D: 120 días consecutivos
  answer: B
  explanation: Los nuevos residentes deben solicitar la conversión de su licencia
    válida dentro de los 60 días consecutivos (30 días consecutivos para licencias
    comerciales).
- id: 61
  category: license_system
  question: ¿Por cuántos años como máximo es válida una licencia de conducir básica
    Clase D de Montana?
  choices:
    A: Dos a cuatro años
    B: Cuatro a ocho años
    C: Cinco a diez años
    D: Ocho a doce años
  answer: B
  explanation: Una licencia de conducir básica (Clase D) es válida por un máximo de
    cuatro a ocho años, y generalmente vence en el cumpleaños del titular.
- id: 62
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia de conducir estándar
    en Montana si el solicitante ha completado con éxito un curso de educación vial
    aprobado?
  choices:
    A: 14 ½ años
    B: 15 años
    C: 15 ½ años
    D: 16 años
  answer: B
  explanation: Para los residentes menores de 21 años, la edad mínima para obtener
    una licencia es de 16 años, o 15 años con educación vial.
- id: 63
  category: license_system
  question: 'En las estaciones de licencias de conducir participantes, se requieren
    citas para todos los servicios EXCEPTO:'
  choices:
    A: Licencias de conducir comerciales por primera vez
    B: Conversiones de licencias de otros estados
    C: Renovación y reemplazo de licencias de Montana
    D: Pruebas de endoso para motocicletas
  answer: C
  explanation: En las estaciones participantes, se requieren citas para todos los
    servicios, excepto para la renovación y el reemplazo de licencias de Montana.
- id: 64
  category: vehicle_information
  question: ¿Una licencia de conducir básica Clase D le permite conducir un vehículo
    no comercial hasta qué peso bruto vehicular máximo?
  choices:
    A: 10,000 libras
    B: 16,000 libras
    C: 26,000 libras
    D: 33,000 libras
  answer: C
  explanation: Una licencia de conducir básica Clase D le permite conducir cualquier
    vehículo no comercial de menos de 26,000 libras de peso bruto vehicular.
- id: 65
  category: license_system
  question: ¿Quién NO es elegible para recibir una tarjeta de identificación (ID)
    de Montana?
  choices:
    A: Un residente de Montana que no conduce
    B: Un residente de Montana que posee una licencia de conducir válida de otra jurisdicción
    C: Un residente de Montana de 16 años sin licencia de conducir
    D: Un residente de Montana cuya licencia de conducir ha sido entregada
  answer: B
  explanation: Cualquier persona que sea residente de Montana y tenga una licencia
    de conducir válida de una jurisdicción distinta a Montana no es elegible para
    una tarjeta de identificación de Montana.
- id: 66
  category: driver_testing
  question: ¿Cuándo es válido un Permiso de Educación Vial (TEP) para operar un vehículo
    motorizado?
  choices:
    A: En cualquier momento que el estudiante esté acompañado por un padre o tutor
    B: Solo durante las horas del día
    C: Solo durante el entrenamiento de educación vial bajo la supervisión directa
      de un instructor
    D: Durante seis meses después de completar un curso de educación vial
  answer: C
  explanation: Un TEP permite a un estudiante operar un vehículo motorizado durante
    el entrenamiento de educación vial, bajo la supervisión directa de un instructor
    de educación vial, y solo es válido durante el período en el que el estudiante
    está inscrito en el curso.
- id: 67
  category: license_system
  question: ¿Cuál es la edad mínima para que se le otorgue una licencia de aprendizaje
    si el solicitante está participando en un curso de educación vial aprobado por
    el estado?
  choices:
    A: 14 años
    B: 14 ½ años
    C: 15 años
    D: 16 años
  answer: B
  explanation: Se puede otorgar una licencia de aprendizaje a cualquier persona que
    tenga al menos 14 ½ años de edad y que esté participando en un curso de educación
    vial o lo haya completado con éxito.
- id: 68
  category: driver_responsibility
  question: ¿Qué obligación acepta un padre o tutor al firmar un formulario de consentimiento
    para un conductor menor de 18 años?
  choices:
    A: Deben viajar en el vehículo en todo momento hasta que el conductor cumpla 18
      años
    B: Aceptan la responsabilidad financiera por cualquier daño resultante de la operación
      de un vehículo motorizado por parte del menor
    C: Aceptan pagar todas las multas de tránsito emitidas al menor
    D: Deben proporcionar el vehículo para el examen de conducir del menor
  answer: B
  explanation: La firma del formulario de consentimiento obliga al padre/tutor a aceptar
    la responsabilidad financiera por cualquier daño resultante de la operación de
    un vehículo motorizado por parte del menor.
- id: 69
  category: driver_testing
  question: ¿Cuánto tiempo debe usar una licencia de aprendizaje un nuevo conductor
    menor de 18 años antes de ser elegible para una licencia estándar?
  choices:
    A: Tres meses consecutivos
    B: Seis meses consecutivos
    C: Nueve meses consecutivos
    D: Dece meses consecutivos
  answer: B
  explanation: La licencia de aprendizaje debe ser utilizada durante seis meses consecutivos
    por cualquier conductor nuevo menor de 18 años.
- id: 70
  category: driver_testing
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los cursos
    de educación vial en Montana?
  choices:
    A: Los cursos de educación vial en línea están totalmente aprobados
    B: Cualquier escuela de manejo de terceros puede emitir un certificado válido
    C: Los cursos deben ser aprobados por la Oficina de Instrucción Pública y el Departamento
      de Justicia
    D: La educación vial es obligatoria para todos los nuevos conductores, independientemente
      de su edad
  answer: C
  explanation: Los cursos de educación vial deben ser aprobados por la Oficina de
    Instrucción Pública y el Departamento de Justicia. Los cursos de educación vial
    en línea o de terceros no están aprobados.
- id: 71
  category: license_system
  question: ¿Cuál es un requisito previo para obtener un endoso de motocicleta en
    Montana?
  choices:
    A: Debe tener al menos 21 años de edad
    B: Debe poseer o ser elegible para una licencia de conducir básica
    C: Debe tener al menos un año de experiencia de conducción
    D: Debe ser dueño de una motocicleta registrada
  answer: B
  explanation: Para ser elegible para un endoso de motocicleta, debe poseer o ser
    elegible para una licencia de conducir básica.
- id: 72
  category: license_system
  question: Al solicitar una licencia de conducir o tarjeta de identificación de Montana,
    ¿su nombre legal completo y fecha de nacimiento deben coincidir con el documento
    principal que proporcione y los registros archivados en qué agencia?
  choices:
    A: El Servicio de Impuestos Internos (IRS)
    B: El Departamento de Seguridad Nacional (DHS)
    C: La Administración del Seguro Social (SSA)
    D: La Oficina Federal de Investigaciones (FBI)
  answer: C
  explanation: El manual establece que el nombre legal completo y la fecha de nacimiento
    utilizados en su solicitud deben coincidir con lo que figura en los archivos de
    la Administración del Seguro Social (SSA).
- id: 73
  category: license_system
  question: ¿Cómo puede un nuevo solicitante eximirse del examen de conducción de
    motocicleta?
  choices:
    A: Aprobando el examen escrito con una puntuación perfecta.
    B: Proporcionando un certificado de la Fundación para la Seguridad de la Motocicleta
      (MSF) de Montana de un curso aprobado en el último año.
    C: Poseyendo una licencia de conducir básica válida durante al menos 5 años.
    D: Pagando una tarifa de exención adicional en la oficina de licencias.
  answer: B
  explanation: El examen de conducción puede eximirse si ha completado y aprobado
    con éxito un curso de la MSF de Montana en el último año y presenta el certificado
    al momento de la solicitud.
- id: 74
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de aprendizaje de motocicleta
    en Montana?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 4 años
  answer: B
  explanation: Según el manual, la licencia de aprendizaje de motocicleta es válida
    por un año.
- id: 75
  category: safe_driving_rules
  question: ¿Qué supervisión se requiere al operar una motocicleta con una licencia
    de aprendizaje?
  choices:
    A: Debe ser supervisado por cualquier conductor con licencia mayor de 18 años.
    B: Debe estar bajo la supervisión inmediata y cercana de un conductor con licencia
      que tenga un endoso de motocicleta.
    C: Debe ser supervisado por un instructor certificado de seguridad en motocicletas.
    D: No se requiere supervisión durante las horas del día.
  answer: B
  explanation: Los titulares de la licencia deben tener en su posesión inmediata su
    licencia de aprendizaje de motocicleta y estar bajo la supervisión inmediata y
    cercana de un conductor con licencia que tenga un endoso de motocicleta.
- id: 76
  category: license_system
  question: ¿Cuál es la edad mínima para que un menor solicite una licencia de conducir
    si NO ha completado un programa de educación vial aprobado por el estado?
  choices:
    A: 15 años
    B: 16 años
    C: 17 años
    D: 18 años
  answer: B
  explanation: Un menor puede solicitarla si tiene 16 años, O si tiene 15 años y completa
    con éxito un programa de educación vial aprobado por el estado.
- id: 77
  category: driver_testing
  question: ¿Están aprobados los cursos de educación vial en línea para jóvenes de
    15 años que solicitan una licencia de conducir en Montana?
  choices:
    A: Sí, si están aprobados por el gobierno federal.
    B: Sí, pero solo si están acompañados por un padre.
    C: No, los cursos en línea no están aprobados.
    D: Sí, si el estudiante aprueba primero un examen de la vista.
  answer: C
  explanation: El manual establece explícitamente que para un joven de 15 años que
    completa un programa de educación vial aprobado por el estado, "los cursos en
    línea no están aprobados".
- id: 78
  category: license_system
  question: ¿Cuánto tiempo puede un nuevo residente usar una licencia de conducir
    válida de otro estado antes de tener que calificar para una licencia de Montana?
  choices:
    A: Hasta 30 días consecutivos
    B: Hasta 60 días consecutivos
    C: Hasta 90 días consecutivos
    D: Hasta que expire la licencia de otro estado
  answer: B
  explanation: Si tiene una licencia de conducir válida emitida por la jurisdicción
    de la que se mudó, puede usarla hasta por 60 días consecutivos, después de los
    cuales debe entregarla y calificar para una licencia de Montana.
- id: 79
  category: license_system
  question: ¿Bajo qué condición debe el personal militar en servicio activo obtener
    una licencia de conducir de Montana?
  choices:
    A: Si residen en Montana por más de 30 días.
    B: Si compran un vehículo en Montana.
    C: Si obtienen un empleo remunerado en Montana.
    D: Al personal militar en servicio activo nunca se le requiere obtener una licencia
      de Montana.
  answer: C
  explanation: El personal militar en servicio activo y sus dependientes pueden conservar
    su licencia válida de otro estado y conducir en Montana a menos que obtengan un
    empleo remunerado. Si se consigue empleo, se debe obtener una licencia de Montana.
- id: 80
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir con una exención
    militar después de una baja honorable?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: La anotación de exención militar en el reverso de la licencia establece
    que es "Válida por 90 días después de una baja honorable".
- id: 81
  category: license_system
  question: ¿Cuándo vence una licencia de conducir emitida a un ciudadano extranjero
    con autorización temporal?
  choices:
    A: Exactamente 8 años a partir de la fecha de emisión.
    B: A más tardar en la fecha de vencimiento del documento oficial emitido por el
      USCIS.
    C: Un año a partir de la fecha en que se emitió la licencia.
    D: En el próximo cumpleaños del conductor.
  answer: B
  explanation: Una licencia de conducir emitida a una persona que es ciudadana extranjera
    y cuya presencia en los EE. UU. está autorizada temporalmente debe vencer a más
    tardar en la fecha de vencimiento del documento oficial emitido a la persona por
    el Servicio de Ciudadanía e Inmigración de los Estados Unidos (USCIS).
- id: 82
  category: license_system
  question: ¿Cuántas licencias de conducir válidas se le permite legalmente tener
    al mismo tiempo?
  choices:
    A: Una por cada estado en el que resida.
    B: Dos, siempre que una sea una licencia internacional.
    C: Solo una licencia de conducir válida emitida por cualquier jurisdicción de
      licencias.
    D: Una licencia de conducir básica y una licencia de conducir comercial.
  answer: C
  explanation: 'El manual establece: "Usted puede tener solo una licencia de conducir
    válida, emitida por cualquier jurisdicción de licencias, en cualquier momento".'
- id: 83
  category: driver_testing
  question: ¿Qué exámenes suelen eximirse para un conductor de otro estado que posee
    una licencia válida de otro estado en su poder inmediato al canjearla por una
    licencia de Montana?
  choices:
    A: Los exámenes de la vista y escritos.
    B: Los exámenes escritos y de conducción.
    C: Los exámenes de la vista y de conducción.
    D: No se exime ningún examen.
  answer: B
  explanation: Los conductores de otros estados que poseen una licencia válida de
    otro estado, y la tienen en su poder inmediato, pueden canjear su licencia de
    conducir básica por una licencia de conducir de Montana sin necesidad de realizar
    un examen escrito o de conducción.
- id: 84
  category: license_system
  question: ¿Cuál de los siguientes documentos es aceptable como prueba de presencia
    autorizada al solicitar una licencia de conducir de Montana?
  choices:
    A: Una tarjeta de biblioteca emitida por un condado de Montana.
    B: Un pasaporte válido y vigente emitido por el Departamento de Estado de los
      EE. UU.
    C: Una factura de servicios públicos de una dirección de Montana.
    D: Una tarjeta de identificación de estudiante de una escuela secundaria de Montana.
  answer: B
  explanation: Un pasaporte válido y vigente emitido por el Departamento de Estado
    de los EE. UU. figura en el manual como un documento aceptable para demostrar
    la presencia autorizada.
- id: 85
  category: license_system
  question: ¿Qué sistema se utiliza para verificar la presencia autorizada de un ciudadano
    extranjero que solicita una licencia de conducir de Montana?
  choices:
    A: El sistema federal de Verificación Sistemática de Extranjeros para Derechos
      (SAVE).
    B: La base de datos del Departamento de Ingresos de Montana.
    C: El Registro Nacional de Conductores (NDR).
    D: El portal de la Administración de Seguridad en el Transporte (TSA).
  answer: A
  explanation: Según el MCA 61-5-105, para emitir una licencia de conducir o tarjeta
    de identificación de Montana a un ciudadano extranjero, su presencia autorizada
    en los EE. UU. se verificará utilizando el sistema federal de Verificación Sistemática
    de Extranjeros para Derechos (SAVE).
- id: 86
  category: license_system
  question: ¿Cuál de las siguientes es una forma aceptable de identificación de una
    tribu nativa americana para demostrar la presencia autorizada?
  choices:
    A: Una carta escrita a mano por un anciano de la tribu.
    B: Una tarjeta de identificación digital emitida por una tribu nativa americana
      reconocida federalmente cuya reserva se encuentre en Montana.
    C: Un permiso de pesca tribal.
    D: Un certificado de inscripción tribal estándar en papel sin fotografía.
  answer: B
  explanation: Un documento aceptable es una tarjeta de identificación digital emitida
    al solicitante por una tribu nativa americana reconocida federalmente, cuya reserva
    se encuentre en Montana, que contenga una imagen digitalizada del solicitante,
    la fecha de nacimiento y el número de inscripción tribal.
- id: 87
  category: license_system
  question: Al solicitar una tarjeta de identificación o licencia de conducir de Montana,
    ¿qué combinación de documentos puede proporcionar para demostrar su nombre legal
    completo y fecha de nacimiento?
  choices:
    A: Tres documentos secundarios
    B: Dos documentos primarios, o un documento primario y uno secundario
    C: Un documento primario y dos documentos secundarios
    D: Solo se requiere un documento primario
  answer: B
  explanation: El manual establece que debe proporcionar dos documentos, ya sea dos
    documentos primarios o un documento primario y uno secundario, para demostrar
    el nombre legal completo y la fecha de nacimiento.
- id: 88
  category: license_system
  question: 'Una licencia de conducir con foto a color emitida por una jurisdicción
    de los EE. UU. puede usarse como documento primario para prueba de identidad siempre
    que no haya vencido hace más de:'
  choices:
    A: Un año
    B: Dos años
    C: Cuatro años
    D: Cinco años
  answer: C
  explanation: Los documentos primarios pueden incluir una licencia de conducir o
    tarjeta de identificación con foto a color, que no haya vencido hace más de cuatro
    años, emitida por una jurisdicción de los EE. UU. o Canadá.
- id: 89
  category: license_system
  question: ¿Cuál de las siguientes características se requiere típicamente en un
    certificado de nacimiento certificado para que sea aceptado como documento primario?
  choices:
    A: Una fotografía del solicitante cuando era bebé
    B: El membrete del hospital
    C: El sello único del registrador, la firma y la fecha de presentación
    D: Una firma notariada del médico tratante
  answer: C
  explanation: El manual señala que un certificado de nacimiento certificado suele
    tener el sello único del registrador, la firma del registrador y la fecha en que
    se presentó el certificado en la oficina del registrador.
- id: 90
  category: license_system
  question: 'Una foto de identificación de emergencia emitida por una autoridad de
    licencias de conducir de los EE. UU. se acepta como documento primario, pero NO
    es aceptable para:'
  choices:
    A: Renovaciones en persona
    B: Renovaciones por correo o duplicados por correo
    C: Solicitudes de licencia de conducir por primera vez
    D: Actualización a una licencia de conducir comercial
  answer: B
  explanation: Una foto de identificación de emergencia emitida y certificada por
    la autoridad de licencias de conducir figura como un documento primario, pero
    el manual especifica que "no es aceptable para renovaciones por correo o duplicados
    por correo".
- id: 91
  category: license_system
  question: Si utiliza un estado de cuenta bancario o una factura de servicios públicos
    como prueba de residencia en Montana, ¿cuántos meses como máximo debe tener de
    antigüedad la fecha de emisión antes de la solicitud?
  choices:
    A: Un mes
    B: Dos meses
    C: Cuatro meses
    D: Seis meses
  answer: C
  explanation: El manual establece que un estado de cuenta bancario o una factura
    de servicios públicos debe tener una fecha de emisión no mayor a cuatro meses
    antes de la solicitud para ser aceptado como prueba de residencia en Montana.
- id: 92
  category: license_system
  question: Si un solicitante no tiene hogar, ¿qué debe proporcionar además de una
    dirección descriptiva y una dirección postal separada para demostrar la residencia
    en Montana?
  choices:
    A: Una declaración por escrito de una agencia de servicios sociales en papel con
      membrete de la agencia
    B: Una carta ante notario de un oficial de policía local
    C: Una factura de servicios públicos a nombre de un familiar
    D: Un talón de pago reciente de cualquier empleador
  answer: A
  explanation: Si el solicitante no tiene hogar, debe proporcionar una dirección descriptiva,
    una dirección postal separada y presentar una declaración por escrito de una agencia
    de servicios sociales en papel con membrete de la agencia que verifique su condición
    de persona sin hogar y la dirección descriptiva.
- id: 93
  category: license_system
  question: 'Un permiso de portación de armas ocultas con foto a color y vigente puede
    utilizarse como documento secundario si fue emitido por:'
  choices:
    A: Un instructor de armas de fuego certificado
    B: Un jefe de policía o el Sheriff del condado en una jurisdicción local de los
      EE. UU.
    C: El Departamento de Pesca, Vida Silvestre y Parques de Montana
    D: La Asociación Nacional del Rifle (NRA)
  answer: B
  explanation: Los documentos secundarios incluyen un permiso de arma de fuego o de
    portación de armas ocultas con foto a color y vigente, emitido por un jefe de
    policía en un departamento de policía organizado de tiempo completo o por el Sheriff
    del condado en una jurisdicción local dentro de los EE. UU.
- id: 94
  category: license_system
  question: 'De acuerdo con el Paso 1 de los requisitos de la REAL ID, los solicitantes
    deben proporcionar prueba de su nombre legal actual, fecha de nacimiento y:'
  choices:
    A: Prueba de propiedad del vehículo
    B: Presencia autorizada en los Estados Unidos
    C: Un pasaporte válido de los EE. UU.
    D: Un registro de conducción certificado
  answer: B
  explanation: El Paso 1 de la documentación de la REAL ID requiere que los solicitantes
    proporcionen prueba de su nombre legal actual, fecha de nacimiento y que su presencia
    en los Estados Unidos esté autorizada bajo la ley federal.
- id: 95
  category: license_system
  question: ¿Qué debe demostrar un solicitante que se le ha emitido según el Paso
    2 de los requisitos de documentación de la REAL ID?
  choices:
    A: Un Número de Seguro Social (SSN)
    B: Una tarjeta de registro de votante
    C: Una tarjeta de residente permanente
    D: Una declaración de impuestos de Montana
  answer: A
  explanation: Según el Paso 2 de los requisitos de la REAL ID, los solicitantes deben
    demostrar que se les ha emitido un número de seguro social (SSN).
- id: 96
  category: license_system
  question: ¿Cómo puede un menor o un hijo adulto utilizar la dirección de sus padres
    para demostrar la residencia en Montana?
  choices:
    A: Presentando el certificado de nacimiento original del padre o la madre
    B: Proporcionando una declaración por escrito del padre o la madre junto con un
      documento permitido que muestre la dirección residencial del padre o la madre
    C: Mostrando una fotografía familiar tomada en la residencia
    D: Proporcionando la tarjeta de seguro social del padre o la madre
  answer: B
  explanation: La prueba de residencia puede incluir una declaración por escrito del
    padre, tutor o hijo adulto del solicitante indicando que el solicitante reside
    en la misma dirección, junto con una copia de un documento permitido que muestre
    la dirección residencial de ese padre, tutor o hijo adulto.
- id: 97
  category: license_system
  question: 'Una copia certificada de los expedientes escolares o un certificado de
    notas puede utilizarse como documento secundario para la prueba de identidad si
    contiene el nombre completo del solicitante y es emitido por:'
  choices:
    A: Un instructor de una escuela de manejo
    B: Una escuela primaria, secundaria o postsecundaria
    C: Una biblioteca pública local
    D: Un padre que educa en el hogar sin certificación estatal
  answer: B
  explanation: Los documentos secundarios incluyen una copia certificada de expedientes
    escolares o un certificado de notas que contenga el nombre completo del solicitante
    y sea emitido por una escuela primaria, secundaria o postsecundaria.
- id: 98
  category: license_system
  question: 'Una tarjeta de identificación digital emitida por una tribu nativa americana
    reconocida federalmente puede utilizarse como documento principal si la reserva
    de la tribu se encuentra en Montana y la tarjeta contiene:'
  choices:
    A: La imagen digitalizada del solicitante, la fecha de nacimiento y el número
      de inscripción tribal
    B: El grado de sangre (blood quantum) y el árbol genealógico del solicitante
    C: Una firma del jefe tribal y una factura de servicios públicos
    D: El número de seguro social y la dirección física del solicitante
  answer: A
  explanation: Un documento principal incluye una tarjeta de identificación digital
    emitida por una tribu indígena reconocida federalmente cuya reserva se encuentre
    en Montana, que contenga la imagen digitalizada del solicitante, la fecha de nacimiento
    y el número de inscripción tribal.
- id: 99
  category: license_system
  question: 'Un recibo de impuestos sobre la propiedad personal o inmobiliaria puede
    utilizarse como evidencia de una dirección de residencia en Montana si los impuestos
    se pagaron al estado de Montana o a un condado de Montana dentro de:'
  choices:
    A: Los últimos seis meses
    B: El último año
    C: Los últimos dos años
    D: Los últimos cinco años
  answer: B
  explanation: El manual enumera un recibo de impuestos sobre la propiedad personal
    o inmobiliaria pagados dentro del último año al estado de Montana o a un condado
    de Montana como evidencia aceptable de una dirección de residencia en Montana.
- id: 100
  category: license_system
  question: ¿Puede un solicitante utilizar el certificado de nacimiento de su hijo
    como documento secundario para su propia prueba de identidad?
  choices:
    A: No, los certificados de nacimiento solo pueden utilizarse para demostrar la
      identidad del niño.
    B: Sí, pero solo si el niño está presente en la oficina de licencias de conducir.
    C: Sí, una copia certificada del certificado de nacimiento del niño es aceptable
      si incluye el nombre y la fecha de nacimiento del solicitante como padre o madre.
    D: Sí, pero solo si el niño es menor de 18 años.
  answer: C
  explanation: Los documentos secundarios pueden incluir una copia certificada, fax
    o fotocopia de una copia certificada del certificado de nacimiento del hijo del
    solicitante, si el certificado indica el nombre y la fecha de nacimiento del solicitante
    como padre o madre.
- id: 101
  category: license_system
  question: ¿Cuántos documentos aceptables se requieren para demostrar la residencia
    en Montana al solicitar una licencia?
  choices:
    A: Un documento
    B: Dos documentos
    C: Tres documentos
    D: Cuatro documentos
  answer: B
  explanation: Según el manual, para demostrar la residencia en Montana se requieren
    dos documentos aceptables que muestren el nombre del solicitante y su dirección
    física actual.
- id: 102
  category: driver_testing
  question: ¿Cuántas horas de práctica de conducción supervisada debe adquirir un
    conductor adolescente durante el Paso 1 del GDL (Graduated Driver Licensing)?
  choices:
    A: 30 horas, incluyendo 5 horas de noche
    B: 40 horas, incluyendo 10 horas de noche
    C: 50 horas, incluyendo 10 horas de noche
    D: 60 horas, incluyendo 15 horas de noche
  answer: C
  explanation: Los conductores adolescentes deben adquirir al menos 50 horas de experiencia
    de conducción supervisada, que deben incluir 10 horas de noche, durante un período
    mínimo de seis meses.
- id: 103
  category: license_system
  question: ¿Cuál es la edad mínima en la que un adolescente puede obtener una licencia
    de aprendizaje si está participando en un programa de educación vial aprobado
    por el estado?
  choices:
    A: 14 años
    B: 14 años y medio
    C: 15 años
    D: 16 años
  answer: B
  explanation: Un adolescente puede obtener una licencia de aprendizaje a partir de
    los 14 años y medio solo si está participando en un programa de educación vial
    aprobado por el estado o si lo ha completado con éxito.
- id: 104
  category: safe_driving_rules
  question: ¿En qué horario se prohíbe generalmente conducir a los conductores adolescentes
    con una licencia restringida de primer año?
  choices:
    A: Entre las 9:00 p.m. y las 5:00 a.m.
    B: Entre las 10:00 p.m. y las 6:00 a.m.
    C: Entre las 11:00 p.m. y las 5:00 a.m.
    D: Entre la medianoche y las 6:00 a.m.
  answer: C
  explanation: Los conductores adolescentes con una licencia de conducir restringida
    no pueden conducir entre las 11:00 p.m. y las 5:00 a.m., con excepciones limitadas
    como emergencias o trabajo.
- id: 105
  category: safe_driving_rules
  question: Durante los primeros seis meses de una licencia restringida de primer
    año, ¿cuántos pasajeros menores de 18 años que no sean familiares pueden viajar
    en el vehículo sin un adulto supervisor?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante los primeros seis meses, a menos que esté supervisado por un
    conductor adulto con licencia, un conductor adolescente solo puede llevar a un
    pasajero menor de 18 años que no sea familiar en el vehículo.
- id: 106
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de las restricciones de
    la licencia restringida de primer año?
  choices:
    A: Una multa de $100
    B: De 20 a 60 horas de servicio comunitario
    C: Suspensión de la licencia de conducir por seis meses
    D: Revocación de la licencia de conducir hasta los 18 años
  answer: B
  explanation: La sanción por una primera infracción de cualquiera de las restricciones
    del paso 2 de la licencia restringida de primer año es de entre 20 y 60 horas
    de servicio comunitario.
- id: 107
  category: license_system
  question: Si es menor de 21 años, ¿cuándo vence su licencia de conducir de Montana?
  choices:
    A: Cuatro años después de la fecha de emisión
    B: Ocho años después de la fecha de emisión
    C: En su cumpleaños número 18
    D: En su cumpleaños número 21
  answer: D
  explanation: El manual establece que si usted es menor de 21 años, su licencia vence
    al cumplir los 21 años.
- id: 108
  category: license_system
  question: Si tiene 75 años de edad o más, ¿por cuánto tiempo es válida su licencia
    de conducir?
  choices:
    A: Cuatro años o menos después de la fecha de emisión
    B: Cinco años o menos después de la fecha de emisión
    C: Ocho años o menos después de la fecha de emisión
    D: No vence
  answer: A
  explanation: Si tiene 75 años de edad o más, su licencia vence en su cumpleaños
    cuatro años o menos después de la fecha de emisión.
- id: 109
  category: license_system
  question: ¿Cuál es la tarifa estándar por año para una licencia básica Clase D o
    una licencia de aprendizaje (excluyendo las tarifas administrativas)?
  choices:
    A: $0.50
    B: $5.00
    C: $8.00
    D: $16.00
  answer: B
  explanation: La tarifa para cualquier licencia básica Clase D o una licencia de
    aprendizaje se indica como $5.00 por año.
- id: 110
  category: driver_testing
  question: ¿Por cuánto tiempo es válido el recibo de la licencia de conducir para
    fines de examen?
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Los recibos de la licencia de conducir son válidos por un año. Si el
    proceso de obtención de la licencia no se completa en un año, el solicitante deberá
    volver a presentar la solicitud.
- id: 111
  category: driver_testing
  question: ¿Cuántos intentos para aprobar con éxito todos los exámenes requeridos
    permite un recibo de examen dentro de su periodo de validez?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ilimitados
  answer: C
  explanation: Para quienes realizan el examen, el recibo permite al solicitante tres
    intentos dentro de ese año para aprobar con éxito todos los exámenes requeridos.
- id: 112
  category: license_system
  question: Un adolescente menor de 18 años debe tener una licencia de aprendizaje
    por un mínimo de ¿cuántos meses consecutivos antes de solicitar una licencia restringida
    de primer año?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Un adolescente menor de 18 años debe tener una licencia de aprendizaje
    por un mínimo de seis meses consecutivos antes de solicitar una licencia restringida
    de primer año.
- id: 113
  category: driver_testing
  question: Según el Manual del Conductor de Montana, ¿están aprobados los cursos
    de educación vial en línea para obtener una licencia de aprendizaje a los 14 años
    y medio o 15 años?
  choices:
    A: Sí, todos los cursos en línea están aprobados
    B: Sí, pero solo si son supervisados por un padre
    C: No, los cursos en línea no están aprobados
    D: No, a menos que el adolescente ya haya aprobado el examen escrito
  answer: C
  explanation: El manual señala específicamente que un adolescente puede obtener una
    licencia de aprendizaje al completar un programa de educación vial aprobado por
    el estado, pero establece explícitamente que "(los cursos en línea no están aprobados)".
- id: 114
  category: license_system
  question: ¿Cuál es la tarifa adicional de REAL ID para un cliente que renueva o
    reemplaza su REAL ID actual de Montana?
  choices:
    A: $10.30
    B: $25.75
    C: $51.50
    D: $10.00
  answer: B
  explanation: Según el manual, los clientes que renueven o reemplacen su REAL ID
    actual de Montana pagarán una tarifa de REAL ID de $25.75 además de las tarifas
    regulares de la licencia.
- id: 115
  category: license_system
  question: ¿Con cuánta antelación, como máximo, puede renovar su licencia de conducir
    de Montana antes de su fecha de vencimiento?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Puede renovar su licencia hasta seis meses antes de la fecha de vencimiento
    de su licencia.
- id: 116
  category: license_system
  question: Si su licencia de conducir ha estado vencida por más de tres meses, ¿qué
    debe hacer para obtener una licencia válida?
  choices:
    A: Pagar una tarifa por retraso de $51.50 y realizar un examen de la vista
    B: Enviar por correo un formulario de renovación a la Oficina de Servicios al
      Conductor (Driver Services Bureau)
    C: Volver a solicitarla como conductor nuevo y aprobar todos los exámenes de licencia
      correspondientes
    D: Completar un curso de conducción defensiva
  answer: C
  explanation: Si su licencia tiene más de tres meses de vencida, debe volver a solicitarla
    como conductor nuevo y se le requerirá aprobar todos los exámenes de licencia
    correspondientes.
- id: 117
  category: license_system
  question: ¿Cuál es la tarifa para solicitar un reemplazo si su licencia de conducir
    de Montana se pierde o se destruye?
  choices:
    A: $10
    B: $25.75
    C: $51.50
    D: $15
  answer: A
  explanation: Si su licencia se pierde o se destruye, puede solicitar un reemplazo
    en su estación local de licencias y se le requerirá pagar una tarifa de $10.
- id: 118
  category: driver_responsibility
  question: ¿Cuántos días tiene para notificar a la Oficina de Servicios al Conductor
    (Driver Services Bureau) sobre cualquier cambio de dirección?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Para asegurarse de que su licencia de conducir se mantenga actualizada,
    debe notificar a la Oficina de Servicios al Conductor del Departamento de Justicia
    dentro de los 10 días posteriores a cualquier cambio de dirección.
- id: 119
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para presentar al cambiar
    el nombre legal en su licencia de conducir?
  choices:
    A: Una carta ante notario de un familiar
    B: Una copia certificada de una sentencia de divorcio que especifique el cambio
      de nombre
    C: Una tarjeta de identificación de estudiante válida
    D: Una factura de servicios públicos reciente a su nuevo nombre
  answer: B
  explanation: Para cambiar su nombre legal, debe presentar un documento certificado,
    como un certificado de matrimonio, una orden judicial, una sentencia de divorcio
    o un certificado de naturalización.
- id: 120
  category: driver_testing
  question: ¿Qué se requiere antes de visitar una estación de licencias de conducir
    de Montana para obtener servicios?
  choices:
    A: Una cita programada
    B: Un examen escrito completado
    C: Un informe de inspección del vehículo
    D: Una copia impresa del manual del conductor
  answer: A
  explanation: Todas las estaciones de licencias de conducir requieren citas programadas,
    las cuales pueden agendarse en línea.
- id: 121
  category: driver_responsibility
  question: 'Cuando los padres firman para que su hijo menor de 18 años obtenga una
    licencia, están indicando que:'
  choices:
    A: Su hijo ha aprobado un curso de educación vial
    B: Su hijo es un conductor cuidadoso
    C: Están afirmando la fecha de nacimiento correcta de su hijo
    D: Están aceptando la responsabilidad financiera por cualquier daño que resulte
      de que el menor opere un vehículo motorizado
  answer: D
  explanation: Según el cuestionario del Capítulo 1 del manual, al firmar por un hijo
    menor de 18 años, los padres aceptan la responsabilidad financiera por cualquier
    daño que resulte de que el menor opere un vehículo motorizado.
- id: 122
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una práctica recomendada de planificación de
    viajes para ahorrar combustible y prolongar la vida útil de su vehículo?
  choices:
    A: Conducir durante el tráfico pesado para mantener velocidades más bajas
    B: Realizar múltiples viajes cortos en lugar de combinar los recados
    C: Usar vehículos compartidos (car pools) o compartir viajes siempre que sea posible
    D: Evitar el uso del transporte público
  answer: C
  explanation: Las recomendaciones para la planificación de viajes incluyen usar vehículos
    compartidos (car pools) o compartir viajes siempre que sea posible, usar el transporte
    público, evitar el tráfico pesado y combinar los recados.
- id: 123
  category: vehicle_information
  question: ¿Por qué el manual recomienda conducir con las luces delanteras encendidas
    en todo momento?
  choices:
    A: Evita que la batería se sobrecargue
    B: Ayuda a otros conductores a ver su vehículo durante el día y la noche
    C: Ajusta automáticamente la suspensión de su vehículo
    D: Mejora el ahorro de combustible
  answer: B
  explanation: Conducir con las luces delanteras encendidas en todo momento ayuda
    a otros conductores a ver su vehículo durante el día y la noche.
- id: 124
  category: vehicle_information
  question: ¿Qué debe hacer con respecto a la nieve y el hielo en su vehículo antes
    de conducir?
  choices:
    A: Quitarlo solo del parabrisas delantero
    B: Quitarlo de todas las ventanas para despejar su vista de la carretera
    C: Encender el desempañador y esperar a que se derrita por completo
    D: Usar los limpiaparabrisas para quitarlo mientras conduce
  answer: B
  explanation: 'El manual establece: "Quite la nieve y el hielo de todas las ventanas
    antes de conducir para despejar su vista de la carretera".'
- id: 125
  category: vehicle_information
  question: ¿Cuál es el mejor momento para revisar la presión de aire de sus neumáticos
    con un manómetro?
  choices:
    A: Inmediatamente después de un viaje largo
    B: Cuando los neumáticos están fríos
    C: Mientras el vehículo está en marcha
    D: Durante una lluvia fuerte
  answer: B
  explanation: Debe revisar la presión de aire de los neumáticos con un manómetro
    cuando los neumáticos estén fríos.
- id: 126
  category: vehicle_information
  question: Al usar una moneda de un centavo para revisar la banda de rodadura de
    sus neumáticos, ¿cómo sabe si el neumático no es seguro y debe ser reemplazado?
  choices:
    A: Si la banda de rodadura cubre la cabeza de Abraham Lincoln
    B: Si la banda de rodadura no llega al menos a la cabeza de Abraham Lincoln
    C: Si la moneda se cae de la banda de rodadura
    D: Si la moneda se pone de lado en la banda de rodadura
  answer: B
  explanation: Inserte la moneda en la banda de rodadura con la "cabeza" primero.
    Si la banda de rodadura no llega al menos a la cabeza de Abraham Lincoln, el neumático
    no es seguro y debe reemplazarlo.
- id: 127
  category: vehicle_information
  question: ¿Cuál es la función principal del sistema de suspensión de su vehículo?
  choices:
    A: Mantiene su vehículo equilibrado y proporciona un viaje cómodo sobre diversas
      superficies de la carretera
    B: Indica a otros usuarios de la carretera que se está deteniendo o girando
    C: Limpia la lluvia y la nieve del parabrisas
    D: Evita el hidroplaneo en carreteras mojadas
  answer: A
  explanation: Su suspensión mantiene su vehículo equilibrado, le ayuda a controlar
    su vehículo y proporciona un viaje cómodo sobre diversas superficies de la carretera.
- id: 128
  category: vehicle_information
  question: ¿Cuál es uno de los mayores peligros de un sistema de escape con fugas?
  choices:
    A: Causará que el motor se sobrecaliente inmediatamente.
    B: Puede causar somnolencia o la muerte en muy poco tiempo.
    C: Aumenta significativamente el ahorro de combustible del vehículo.
    D: Hace que el sistema de suspensión rebote excesivamente.
  answer: B
  explanation: Según el manual, los gases de un escape con fugas pueden causar la
    muerte en muy poco tiempo y también pueden provocarle somnolencia mientras conduce.
- id: 129
  category: safe_driving_rules
  question: ¿Por qué debe asegurarse de que no haya objetos sueltos en el piso de
    su vehículo?
  choices:
    A: Pueden aumentar el peso total del vehículo y reducir el ahorro de combustible.
    B: Pueden rodar debajo del pedal del freno, impidiéndole reducir la velocidad
      o detenerse.
    C: Causarán que el vehículo no pase una inspección de emisiones.
    D: Pueden interferir con el sistema de suspensión del vehículo.
  answer: B
  explanation: El manual establece que debe asegurarse de que no haya objetos en el
    piso que puedan rodar debajo del pedal del freno, de modo que no pueda reducir
    la velocidad o detener el vehículo.
- id: 130
  category: safe_driving_rules
  question: ¿A qué distancia debe bajar las luces altas (cambiar a luces bajas) al
    encontrarse con otro vehículo?
  choices:
    A: 300 pies
    B: 500 pies
    C: 1000 pies
    D: 1500 pies
  answer: C
  explanation: Las luces delanteras de carretera (luces altas) deben bajarse al encontrarse
    con otros vehículos a una distancia de 1000 pies.
- id: 131
  category: safe_driving_rules
  question: ¿Cuándo es obligatorio el uso de los faros delanteros en Montana?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol.
    B: Solo cuando se conduce por carreteras rurales sin iluminación.
    C: Desde media hora después de la puesta del sol hasta media hora antes de la
      salida del sol, o cuando la visibilidad sea inferior a 500 pies.
    D: En todo momento al conducir un vehículo de motor fabricado después de 1968.
  answer: C
  explanation: Los faros delanteros deben utilizarse en todo momento desde media hora
    después de la puesta del sol hasta media hora antes de la salida del sol y en
    cualquier otro momento en que la visibilidad sea inferior a 500 pies.
- id: 132
  category: vehicle_information
  question: ¿A qué distancia deben iluminar a personas o vehículos las luces bajas
    de sus faros delanteros?
  choices:
    A: 50 pies
    B: 100 pies
    C: 300 pies
    D: 350 pies
  answer: B
  explanation: Los faros delanteros deben ser capaces de iluminar a personas o vehículos
    a una distancia de 100 pies con las luces bajas.
- id: 133
  category: vehicle_information
  question: ¿A qué distancia deben ser visibles las luces direccionales de su vehículo
    bajo la luz solar normal?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Los vehículos fabricados después del 1 de enero de 1956 deben emitir
    una luz blanca o ámbar hacia adelante y una luz roja o ámbar hacia atrás, visible
    a 300 pies bajo la luz del sol para las señales de giro.
- id: 134
  category: vehicle_information
  question: ¿Cuál es la distancia de visibilidad requerida para la luz de la placa
    de matrícula?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: A
  explanation: Los vehículos fabricados después del 1 de enero de 1956 deben emitir
    una luz blanca para iluminar la placa de matrícula a 50 pies hacia atrás.
- id: 135
  category: vehicle_information
  question: ¿A qué distancia debe ser audible la bocina (claxon) de un vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: La bocina debe proporcionar una advertencia audible a una distancia
    de 200 pies.
- id: 136
  category: safe_driving_rules
  question: ¿Qué exige la ley de Montana con respecto al uso del cinturón de seguridad?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero están obligados a usar
      el cinturón de seguridad.
    B: Los cinturones de seguridad son opcionales para los vehículos fabricados antes
      de 1980.
    C: Ninguna persona puede conducir a menos que cada ocupante lleve puesto un cinturón
      de seguridad debidamente ajustado y abrochado.
    D: Los cinturones de seguridad solo son obligatorios cuando se conduce por carreteras
      interestatales.
  answer: C
  explanation: Ninguna persona puede conducir un vehículo de motor en Montana a menos
    que cada ocupante lleve puesto un cinturón de seguridad debidamente ajustado y
    abrochado.
- id: 137
  category: vehicle_information
  question: Si una carga se extiende cuatro pies o más más allá de la parte trasera
    de un vehículo durante el día, ¿qué debe colocarse en el extremo posterior de
    la carga?
  choices:
    A: Una luz roja visible a 500 pies.
    B: Una bandera roja de no menos de 12 pulgadas cuadradas.
    C: Un reflector ámbar visible a 300 pies.
    D: Un letrero blanco que indique 'Carga sobredimensionada' (Oversized Load).
  answer: B
  explanation: Siempre que cualquier carga se extienda cuatro pies o más más allá
    de la carrocería del vehículo... En todos los demás momentos [cuando no se requieran
    faros delanteros] deberá haber una bandera roja, de no menos de 12 pulgadas cuadradas.
- id: 138
  category: vehicle_information
  question: ¿Cuál de los siguientes tipos de iluminación está generalmente prohibido
    para vehículos que no son de emergencia?
  choices:
    A: Luces direccionales ámbar
    B: Luces blancas para la placa de matrícula
    C: Luces intermitentes, destellantes o pulsantes
    D: Luces de freno rojas
  answer: C
  explanation: Las luces intermitentes, destellantes, secuenciales, giratorias o pulsantes
    (que no sean las señales de giro) están prohibidas, excepto para vehículos de
    emergencia o autorizados.
- id: 139
  category: vehicle_information
  question: Si su vehículo sigue rebotando después de pasar por un bache o después
    de detenerse, ¿qué sistema probablemente deba ser revisado por un mecánico?
  choices:
    A: El sistema de dirección
    B: El sistema de escape
    C: El sistema de suspensión
    D: El sistema de frenado
  answer: C
  explanation: Si el vehículo rebota mucho, sigue rebotando después de un bache o
    después de detenerse, es posible que necesite amortiguadores nuevos u otras piezas
    de la suspensión.
- id: 140
  category: vehicle_information
  question: Cuando se desplaza por una carretera de noche, ¿a qué distancia debe ser
    visible la luz blanca delantera de un tractor agrícola?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Durante el tiempo en que se requieren faros delanteros, cualquier tractor
    agrícola o implemento de labranza... debe mostrar una luz blanca hacia adelante,
    visible por lo menos a 500 pies.
- id: 141
  category: vehicle_information
  question: ¿Cuándo deben apagarse los faros buscahuellas (spot lamps) de un vehículo?
  choices:
    A: Al conducir dentro de los límites de la ciudad
    B: Al aproximarse a otro vehículo en movimiento desde cualquier dirección
    C: Al conducir a velocidades superiores a 45 mph
    D: Al seguir a otro vehículo a menos de 200 pies
  answer: B
  explanation: Según el manual, los faros buscahuellas deben apagarse al aproximarse
    a otro vehículo en movimiento desde cualquier dirección.
- id: 142
  category: vehicle_information
  question: ¿Cuál de los siguientes remolques debe estar equipado con frenos de seguridad
    de desconexión ("break-away")?
  choices:
    A: Cualquier remolque que pese más de 1,000 libras
    B: Solo los remolques que transporten materiales peligrosos
    C: Todo remolque con un peso bruto superior a 3,000 libras
    D: Cualquier remolque fabricado después de 2010
  answer: C
  explanation: El manual establece que todo remolque, semirremolque y remolque de
    poste equipado con frenos de aire o de vacío, o que tenga un peso bruto superior
    a 3,000 libras, debe tener frenos de seguridad de desconexión ("break-away").
- id: 143
  category: vehicle_information
  question: ¿Cuál de los siguientes dispositivos de advertencia está prohibido en
    un vehículo civil estándar?
  choices:
    A: Una bocina (claxon)
    B: Una sirena, silbato o campana
    C: Luces de emergencia (hazard lights)
    D: Una alarma de retroceso
  answer: B
  explanation: Ningún vehículo estará equipado con, ni ninguna persona utilizará en
    un vehículo, ninguna sirena, silbato o campana, excepto según lo permitido para
    vehículos de emergencia autorizados.
- id: 144
  category: vehicle_information
  question: ¿Hasta qué punto deben extenderse hacia abajo los protectores contra el
    lodo (mud flaps) o faldones en las ruedas traseras de un camión o remolque cuando
    el vehículo está vacío?
  choices:
    A: Hasta un punto no mayor a 10 pulgadas sobre la superficie de la carretera
    B: Hasta un punto no mayor a 20 pulgadas sobre la superficie de la carretera
    C: Hasta un punto que toque la superficie de la carretera
    D: Hasta un punto no mayor a 15 pulgadas sobre la superficie de la carretera
  answer: B
  explanation: Los camiones, remolques y ciertos otros vehículos deben tener guardabarros
    o protectores en las ruedas traseras que se extiendan hacia abajo hasta un punto
    no mayor a 20 pulgadas sobre la superficie de la carretera cuando el vehículo
    está vacío.
- id: 145
  category: vehicle_information
  question: ¿Cuál es el diámetro mínimo requerido para una cadena o cable de seguridad
    en un remolque de 3,000 libras de GVW (peso bruto del vehículo) o menos?
  choices:
    A: 1/8 de pulgada
    B: 1/4 de pulgada
    C: 1/2 pulgada
    D: 3/4 de pulgada
  answer: B
  explanation: Todo remolque de 3,000 libras de GVW o menos debe tener una cadena
    o cable de acero sujeto de forma segura a la unidad de remolque, y dicha cadena
    o cable no debe tener menos de 1/4 de pulgada de diámetro.
- id: 146
  category: safe_driving_rules
  question: ¿Qué tipo de dispositivo de advertencia está estrictamente prohibido para
    vehículos averiados que transportan explosivos o líquidos inflamables?
  choices:
    A: Linternas eléctricas rojas
    B: Reflectores rojos de emergencia portátiles
    C: Triángulos reflectantes de emergencia
    D: Cualquier dispositivo de advertencia que produzca una señal mediante llama
  answer: D
  explanation: Las bengalas, fusibles o señales producidas por llama NO deben usarse
    como dispositivos de advertencia para vehículos que transporten explosivos, líquidos
    inflamables o gases comprimidos.
- id: 147
  category: safe_driving_rules
  question: Si un camión queda averiado a menos de 500 pies de una curva o colina,
    ¿a qué distancia debe colocarse la señal de advertencia en esa dirección?
  choices:
    A: No menos de 100 pies
    B: No menos de 200 pies
    C: No menos de 300 pies
    D: No menos de 500 pies
  answer: D
  explanation: Siempre que un vehículo quede averiado a menos de 500 pies de una curva,
    colina u otra obstrucción a la vista, la señal de advertencia en esa dirección
    se colocará a no menos de 500 pies del vehículo.
- id: 148
  category: signs_and_signals
  question: ¿Cómo es el emblema de un vehículo de movimiento lento?
  choices:
    A: Un triángulo de color naranja amarillento fluorescente con un borde rojo reflectante
    B: Un octágono rojo con bordes blancos reflectantes
    C: Un diamante amarillo con rayas negras
    D: Un rectángulo blanco con un círculo rojo en el centro
  answer: A
  explanation: El emblema de vehículo de movimiento lento es un triángulo de color
    naranja amarillento fluorescente con una base de 14 pulgadas y un borde con rayas
    rojas reflectantes.
- id: 149
  category: sharing_the_road
  question: ¿Qué debe hacer un vehículo de movimiento lento en una carretera de dos
    carriles cuando no deja un carril libre para el tráfico que intenta rebasar?
  choices:
    A: Aumentar su velocidad hasta el límite de velocidad indicado
    B: Encender sus luces de emergencia y continuar en el carril
    C: Orillarse en la primera oportunidad segura para permitir que otros vehículos
      pasen
    D: Conducir por el acotamiento (hombro) de la carretera en todo momento
  answer: C
  explanation: En una carretera de dos carriles, cuando un vehículo de movimiento
    lento no deja un carril libre para rebasar, debe orillarse en la primera oportunidad
    segura con espacio suficiente para permitir que otros vehículos pasen.
- id: 150
  category: safe_driving_rules
  question: Según el manual, ¿cuánto puede reducir la suciedad en los lentes la efectividad
    de sus faros delanteros?
  choices:
    A: En un 10%
    B: En un 25%
    C: En un 50%
    D: En un 75%
  answer: C
  explanation: El manual indica que se deben mantener limpios los faros delanteros,
    las luces de reversa, de freno y traseras, ya que la suciedad en los lentes puede
    reducir la efectividad de las luces en un 50%.
- id: 151
  category: safe_driving_rules
  question: ¿Cuál es un ajuste recomendado para sus espejos laterales?
  choices:
    A: Ajústelos para que pueda ver toda la ventana trasera
    B: Ajústelos de modo que, al inclinarse ligeramente hacia adelante, pueda ver
      el costado de su vehículo
    C: Ajústelos de modo que no pueda ver su propio vehículo en absoluto
    D: Ajústelos en ángulo hacia abajo para ver las líneas del carril
  answer: B
  explanation: Un buen ajuste para los espejos laterales es colocarlos de modo que,
    al inclinarse ligeramente hacia adelante, pueda ver el costado de su vehículo.
- id: 152
  category: penalties_and_points
  question: ¿Cuál es la multa para un conductor que infringe la ley del cinturón de
    seguridad de Montana?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: La ley de Montana asigna al conductor la responsabilidad de asegurar
    que cada ocupante esté debidamente abrochado, y el conductor que infrinja la ley
    será multado con $20.
- id: 153
  category: defensive_driving
  question: 'Según el manual, una persona que no lleva puesto el cinturón de seguridad
    en un choque a 30 mph experimenta la misma fuerza que:'
  choices:
    A: Caer desde un edificio de 3 pisos
    B: Caer desde un edificio de 10 pisos
    C: Ser golpeado por una bicicleta a 15 mph
    D: Caer de una escalera de 10 pies
  answer: A
  explanation: A solo 30 mph, una persona que no lleva puesto el cinturón de seguridad
    en un choque tiene la misma experiencia que caer desde un edificio de 3 pisos
    o ser embestido por un elefante de tres toneladas y media.
- id: 154
  category: defensive_driving
  question: El manual establece que hay tres colisiones en cada choque. ¿Cuál de las
    siguientes es una de esas tres colisiones?
  choices:
    A: La colisión externa
    B: La colisión interna (dentro de su cuerpo)
    C: La colisión de la bolsa de aire (airbag)
    D: La colisión secundaria del vehículo
  answer: B
  explanation: 'En realidad, hay tres colisiones en cada choque: la colisión del vehículo;
    la colisión humana; y la colisión interna (dentro de su cuerpo).'
- id: 155
  category: driver_responsibility
  question: Según la ley de Montana, ¿quién es responsable de asegurar que cada ocupante
    de un vehículo motorizado esté debidamente abrochado o en un asiento de seguridad
    para niños?
  choices:
    A: Cada pasajero individualmente
    B: El propietario del vehículo
    C: El conductor del vehículo
    D: El pasajero del asiento delantero
  answer: C
  explanation: La ley de Montana asigna al conductor la responsabilidad de asegurar
    que cada ocupante esté debidamente abrochado o en un asiento de seguridad para
    niños.
- id: 156
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción a la ley del cinturón de seguridad
    de Montana?
  choices:
    A: Vehículos fabricados antes del 1 de enero de 1980.
    B: Vehículos fabricados antes del 1 de enero de 1968.
    C: Cualquier pasajero mayor de 18 años.
    D: Conductores que operan un vehículo estrictamente dentro de los límites de la
      ciudad.
  answer: B
  explanation: Las excepciones a la ley del cinturón de seguridad incluyen si el vehículo
    fue fabricado antes del 1 de enero de 1968.
- id: 157
  category: vehicle_information
  question: Si su vehículo tiene un sistema de cinturón de seguridad de dos partes
    con un cinturón de hombro automático, ¿qué debe hacer?
  choices:
    A: Solo necesita usar el cinturón de hombro automático.
    B: También debe abrocharse el cinturón de regazo.
    C: Debe desconectar el cinturón de hombro automático.
    D: Debe sentarse en el asiento trasero.
  answer: B
  explanation: Si tiene un cinturón de hombro automático, también debe abrocharse
    el cinturón de regazo. De lo contrario, en una colisión podría deslizarse fuera
    del cinturón y resultar herido o muerto.
- id: 158
  category: safe_driving_rules
  question: Según la ley de Montana, ¿qué niños deben estar abrochados en un asiento
    de seguridad para niños?
  choices:
    A: Niños de hasta 4 años y 40 libras.
    B: Niños de hasta 8 años y 80 libras.
    C: Niños de hasta 6 años y 60 libras.
    D: Niños de hasta 5 años y 50 libras.
  answer: C
  explanation: Los bebés y niños de hasta 6 años de edad y 60 libras deben estar abrochados
    en un asiento de seguridad para niños.
- id: 159
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a los asientos de seguridad orientados
    hacia atrás y las bolsas de aire (airbags) frontales activas del pasajero?
  choices:
    A: Pueden usarse si el asiento se echa hacia atrás lo más posible.
    B: Solo deben usarse si el niño pesa más de 20 libras.
    C: Nunca coloque un asiento de seguridad orientado hacia atrás en el asiento del
      pasajero delantero con una bolsa de aire activa.
    D: Están permitidos si el vehículo viaja a menos de 30 mph.
  answer: C
  explanation: 'El manual establece explícitamente: ''Nunca coloque un asiento de
    seguridad orientado hacia atrás en el asiento del pasajero delantero con una bolsa
    de aire activa''.'
- id: 160
  category: driver_responsibility
  question: En un choque a 30 mph, un adulto de 100 libras que sostiene a un niño
    se convierte en ¿qué cantidad de fuerza contra el niño?
  choices:
    A: 1,000 libras
    B: 2,000 libras
    C: 3,000 libras
    D: 5,000 libras
  answer: C
  explanation: Si sostiene a su hijo mientras viaja en un vehículo, podría aplastarlo
    durante un choque. En un choque a 30 mph, un adulto de 100 libras se convierte
    en una fuerza de 3,000 libras contra el niño.
- id: 161
  category: safe_driving_rules
  question: ¿Siempre que sea posible, los niños menores de qué edad deben estar asegurados
    en el asiento trasero?
  choices:
    A: 10 años
    B: 12 años
    C: 13 años
    D: 15 años
  answer: C
  explanation: Siempre que sea posible, los niños menores de 13 años deben estar asegurados
    en el asiento trasero.
- id: 162
  category: signs_and_signals
  question: ¿Qué indica siempre el color rojo en una señal de tráfico?
  choices:
    A: Advertencia o precaución
    B: Pare, ceda el paso, no entre o sentido contrario
    C: Construcción o mantenimiento
    D: Servicios al automovilista o guía
  answer: B
  explanation: 'Recuerde: el rojo siempre significa pare (stop), ceda el paso, no
    entre o sentido contrario (wrong way).'
- id: 163
  category: signs_and_signals
  question: ¿Cuál es la única señal de tráfico que tiene ocho lados?
  choices:
    A: Señal de CEDA EL PASO (YIELD)
    B: Señal de NO ENTRE (DO NOT ENTER)
    C: Señal de PARE (STOP)
    D: Señal de CRUCE DE FERROCARRIL
  answer: C
  explanation: La señal de PARE (STOP) es la única señal de tráfico de ocho lados.
- id: 164
  category: signs_and_signals
  question: ¿Cuál es la única señal de advertencia de tráfico que es redonda?
  choices:
    A: Escuela más adelante
    B: Cruce de ferrocarril más adelante
    C: Zona de velocidad más adelante
    D: Camino sinuoso
  answer: B
  explanation: La señal de 'cruce de ferrocarril más adelante' es redonda. Es la única
    señal de advertencia de tráfico que es redonda.
- id: 165
  category: signs_and_signals
  question: ¿Qué forma y color tienen generalmente las señales reglamentarias?
  choices:
    A: En forma de diamante con letras negras sobre un fondo amarillo
    B: Rectangulares con letras o símbolos negros sobre un fondo blanco
    C: Redondas con letras blancas sobre un fondo rojo
    D: Cuadradas con letras blancas sobre un fondo verde
  answer: B
  explanation: Las señales reglamentarias son rectangulares con letras o símbolos
    negros sobre un fondo blanco. Debe obedecer las reglas de todas las señales reglamentarias.
- id: 166
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de las señales en forma de diamante de
    color negro y amarillo?
  choices:
    A: Mostrar la velocidad máxima del conductor
    B: Advertir sobre condiciones peligrosas más adelante
    C: Indicar una vía de un solo sentido
    D: Prohibir ciertas acciones como vueltas en U
  answer: B
  explanation: Las señales de advertencia son negras y amarillas. Estas señales se
    utilizan para advertirle sobre condiciones peligrosas más adelante donde se requiere
    que conduzca con mucha precaución. Las señales de advertencia suelen tener forma
    de diamante.
- id: 167
  category: signs_and_signals
  question: ¿Qué significa una señal con un círculo rojo y una raya roja diagonal
    sobre una flecha o símbolo negro?
  choices:
    A: Debe realizar la acción mostrada.
    B: La acción mostrada es recomendada pero no obligatoria.
    C: No haga lo que se muestra.
    D: Proceda con precaución.
  answer: C
  explanation: Cuando vea una señal con un círculo rojo y una raya roja diagonal sobre
    una flecha o símbolo negro, significa que no debe hacer lo que se muestra.
- id: 168
  category: signs_and_signals
  question: ¿Cuál es la diferencia entre una señal de 'Puente Estrecho' (Narrow Bridge)
    y una de 'Puente de un Solo Carril' (One Lane Bridge)?
  choices:
    A: Un puente estrecho tiene espacio para encontrarse y pasar, mientras que un
      puente de un solo carril no.
    B: Un puente de un solo carril tiene espacio para encontrarse y pasar, mientras
      que un puente estrecho no.
    C: Un puente estrecho es solo para peatones.
    D: No hay diferencia; significan lo mismo.
  answer: A
  explanation: La señal de 'Puente Estrecho' indica que el puente es más estrecho
    que la carretera, pero hay espacio para encontrarse y pasar. La señal de 'Puente
    de un Solo Carril' indica que no hay espacio en el puente para encontrarse o pasar
    a otro automóvil o camión.
- id: 169
  category: safe_driving_rules
  question: ¿Cuándo es obligatorio encender las luces delanteras?
  choices:
    A: Solo cuando el tráfico es muy pesado
    B: Desde media hora después de la puesta del sol hasta media hora antes de la
      salida del sol, o cuando la visibilidad sea inferior a 500 pies
    C: Desde media hora antes de la puesta del sol hasta media hora después de la
      salida del sol
    D: Solo durante el horario de verano
  answer: B
  explanation: Se requieren luces delanteras en cualquier momento en que no pueda
    ver personas o vehículos a 500 pies de distancia y desde media hora después de
    la puesta del sol hasta media hora antes de la salida del sol.
- id: 170
  category: vehicle_information
  question: Según el manual, ¿a qué distancia deben ser visibles las luces direccionales?
  choices:
    A: 100 pies
    B: 250 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: El cuestionario del Capítulo 2 indica que las luces direccionales deben
    ser visibles a una distancia de 300 pies.
- id: 171
  category: safe_driving_rules
  question: ¿Qué debe hacer al conducir por una carretera marcada con una señal de
    "Resbaladizo cuando está mojado"?
  choices:
    A: Frenar bruscamente para probar la tracción
    B: Aumentar la distancia entre su vehículo y el vehículo que tiene delante
    C: Cambiar de dirección rápidamente para evitar los charcos
    D: Mantener su velocidad normal
  answer: B
  explanation: 'El manual establece para las señales de "Resbaladizo cuando está mojado":
    "Reduzca su velocidad; no frene bruscamente ni cambie de dirección repentinamente.
    Aumente la distancia entre su vehículo y el vehículo que tiene delante".'
- id: 172
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceder el límite de velocidad indicado en una
    zona de construcción o de obras?
  choices:
    A: Una advertencia por la primera infracción
    B: Una suspensión de la licencia por 30 días
    C: Las multas se duplican
    D: Las multas se triplican
  answer: C
  explanation: Según el manual, "Las multas por infracciones en una zona de obras
    son el doble del monto".
- id: 173
  category: signs_and_signals
  question: En una barricada o panel vertical en una zona de obras, ¿qué indican las
    franjas diagonales con inclinación hacia abajo a la derecha?
  choices:
    A: La carretera está cerrada más adelante
    B: El conductor debe desviarse hacia la izquierda
    C: El conductor debe desviarse hacia la derecha
    D: El tráfico debe detenerse inmediatamente
  answer: C
  explanation: 'El manual establece: "Las franjas con inclinación hacia abajo a la
    derecha significan que el conductor debe desviarse hacia la derecha".'
- id: 174
  category: penalties_and_points
  question: ¿A qué cargo podría enfrentarse si retira, ignora o golpea intencionalmente
    un dispositivo de control de tráfico en una zona de construcción de carreteras?
  choices:
    A: Homicidio vehicular
    B: Poner en peligro imprudentemente a un trabajador de la carretera (Reckless
      Endangerment of a Highway Worker)
    C: Vandalismo en la carretera
    D: Exceso de velocidad agravado
  answer: B
  explanation: El manual establece que se le puede acusar de poner en peligro imprudentemente
    a un trabajador de la carretera si "retira, ignora o golpea intencionalmente un
    dispositivo de control de tráfico".
- id: 175
  category: safe_driving_rules
  question: 'Según la ley de Montana, los límites de velocidad en zonas escolares
    pueden establecerse tan bajos como:'
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: 'El manual establece: "Los límites de velocidad en zonas escolares
    pueden ser tan bajos como 15 mph (MCA 61-8-310)".'
- id: 176
  category: penalties_and_points
  question: ¿Cómo maneja la ley de Montana las infracciones de velocidad en o cerca
    de las zonas escolares?
  choices:
    A: Las multas se duplican en todas las zonas escolares
    B: Los infractores deben asistir a una escuela de tráfico
    C: Las multas se triplican cuando hay niños presentes
    D: Los puntos en la licencia se duplican
  answer: A
  explanation: 'El manual establece: "Las multas se duplican en todas las zonas escolares
    de Montana".'
- id: 177
  category: sharing_the_road
  question: 'Cuando un guardia de cruce escolar está dirigiendo a los niños a través
    de una calzada y sostiene una señal oficial en la posición de alto (stop), el
    conductor debe:'
  choices:
    A: Tocar la bocina para alertar a los niños y avanzar lentamente
    B: Ceder el paso solo si hay niños en el carril del conductor
    C: No pasar por delante del guardia de cruce
    D: Pasar al guardia de cruce a 15 mph o menos
  answer: C
  explanation: 'El manual establece: "Los conductores no pueden conducir a través
    de una columna de niños escolares que cruzan una calzada, ni pasar por delante
    de un guardia de cruce escolar mientras este dirige el movimiento de los niños
    a través de una calzada y sostiene una señal oficial en la posición de alto".'
- id: 178
  category: signs_and_signals
  question: ¿Qué debe hacer si se aproxima a una intersección donde el semáforo no
    funciona?
  choices:
    A: Ceder el paso a la derecha y continuar sin detenerse
    B: Detenerse como lo haría si hubiera señales de alto en todas las direcciones
    C: Tratar la intersección como una señal de ceder el paso
    D: Esperar a que las autoridades dirijan el tráfico
  answer: B
  explanation: 'El manual establece: "Generalmente, si un semáforo no funciona, deténgase
    como lo haría si hubiera señales de alto en todas las direcciones. La cortesía
    común dicta que el conductor que se detiene primero debe pasar primero".'
- id: 179
  category: signs_and_signals
  question: ¿Qué debe hacer un peatón si ya está en el cruce peatonal y la señal de
    NO CAMINE (DON'T WALK) comienza a parpadear?
  choices:
    A: Detenerse y esperar en medio de la calle
    B: Dar la vuelta y regresar a la acera de inicio
    C: Continuar cruzando la calle
    D: Correr lo más rápido posible hacia la acera más cercana
  answer: C
  explanation: 'El manual establece: "Los peatones que se encuentran en el cruce peatonal
    cuando la señal de NO CAMINE comienza a parpadear deben continuar cruzando la
    calle".'
- id: 180
  category: signs_and_signals
  question: ¿Qué indica una señal de "Paso bajo" (Low Clearance)?
  choices:
    A: La superficie de la carretera es irregular más adelante
    B: El paso elevado tiene poca altura y los vehículos altos no deben avanzar
    C: El puente de adelante tiene un límite de peso bajo
    D: Puede haber aeronaves volando a baja altura
  answer: B
  explanation: 'El manual establece para "Paso bajo": "El paso elevado tiene poca
    altura. No avance si su vehículo es demasiado alto para pasar por debajo".'
- id: 181
  category: signs_and_signals
  question: Cuando vea una señal de "Comienzo de autopista dividida" (Divided Highway
    Begins), ¿qué acción debe tomar?
  choices:
    A: Manténgase a la izquierda
    B: Manténgase a la derecha
    C: Prepárese para el tráfico en sentido contrario en su carril
    D: Incorpórese al carril central
  answer: B
  explanation: 'El manual establece para Comienzo de autopista dividida: "Una mediana
    o divisor adelante divide la autopista en dos calzadas separadas, y cada calzada
    es de un solo sentido. Manténgase a la derecha".'
- id: 182
  category: signs_and_signals
  question: ¿Qué precaución debe tomar cuando vea una señal de advertencia de "Colina"
    (Hill)?
  choices:
    A: Acelere para mantener la velocidad al subir la colina
    B: Revise sus frenos y considere cambiar a una marcha más baja
    C: Ponga el vehículo en punto muerto (neutral) para ahorrar gasolina
    D: Deténgase a un lado y espere a que sus frenos se enfríen
  answer: B
  explanation: 'El manual establece para Colina: "Hay una pendiente pronunciada adelante.
    Revise sus frenos. Es posible que deba cambiar a una marcha más baja".'
- id: 183
  category: defensive_driving
  question: ¿Por qué es particularmente peligroso combinar el exceso de velocidad
    o la conducción distraída con peatones infantiles?
  choices:
    A: Los niños siempre tienen el derecho de paso por ley
    B: Los niños son difíciles de ver debido a su tamaño y tienen un comportamiento
      impredecible
    C: Los niños se mueven más rápido que los peatones adultos
    D: Se requiere que los niños usen ropa reflectante
  answer: B
  explanation: 'El manual establece: "Combinar el exceso de velocidad o la conducción
    distraída con peatones infantiles y ciclistas es peligroso porque los niños son
    difíciles de ver debido a su tamaño y su tendencia al comportamiento impredecible".'
- id: 184
  category: signs_and_signals
  question: ¿Qué significa una mano naranja levantada en una señal peatonal?
  choices:
    A: CAMINE (WALK)
    B: Ceda el paso a los vehículos
    C: NO CAMINE (DON'T WALK)
    D: Precaución
  answer: C
  explanation: 'El manual establece: "Una mano naranja levantada significa NO CAMINE
    (DON’T WALK)".'
- id: 185
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a un semáforo en rojo intermitente?
  choices:
    A: Reduzca la velocidad y continúe con precaución si la intersección está despejada.
    B: Trátelo igual que una señal de alto (STOP) y deténgase por completo.
    C: Ceda el paso al tráfico de la derecha pero no se detenga.
    D: Deténgase solo si hay peatones cruzando activamente.
  answer: B
  explanation: Una señal roja intermitente significa lo mismo que una señal de alto.
    Debe detenerse por completo, mirar a la izquierda, a la derecha y adelante, ceder
    el paso al tráfico y a los peatones, y avanzar cuando sea seguro hacerlo.
- id: 186
  category: signs_and_signals
  question: ¿Qué indica un semáforo en amarillo fijo?
  choices:
    A: La señal está a punto de cambiar a rojo y no debe entrar a menos que esté demasiado
      cerca para detenerse de manera segura.
    B: Usted tiene el derecho de paso para avanzar a través de la intersección.
    C: Debe detenerse por completo antes del paso de peatones.
    D: Los giros a la izquierda están protegidos y el tráfico en sentido contrario
      está detenido.
  answer: A
  explanation: Una señal amarilla fija significa "PRECAUCIÓN". La señal está a punto
    de cambiar a rojo. No entre en una intersección con una luz amarilla fija a menos
    que esté demasiado cerca para detenerse de manera segura.
- id: 187
  category: safe_driving_rules
  question: ¿Bajo qué condición puede realizar un giro a la izquierda con una luz
    roja fija?
  choices:
    A: Al girar desde una calle de doble sentido hacia otra calle de doble sentido.
    B: Al girar desde una calle de sentido único hacia otra calle de sentido único
      después de detenerse.
    C: Siempre que no haya tráfico visible en sentido contrario.
    D: Los giros a la izquierda en rojo nunca están permitidos bajo ninguna circunstancia.
  answer: B
  explanation: Al entrar en una calle de sentido único desde otra calle de sentido
    único, también puede girar a la izquierda después de detenerse ante la luz roja,
    cediendo el paso si es necesario.
- id: 188
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente?
  choices:
    A: Los giros a la izquierda están prohibidos.
    B: Usted tiene un giro a la izquierda protegido.
    C: Se permiten los giros a la izquierda, pero primero debe ceder el paso al tráfico
      en sentido contrario y a los peatones.
    D: El semáforo está averiado y debe tratarse como una parada de cuatro vías.
  answer: C
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero primero debe ceder el paso al tráfico en sentido contrario
    y a los peatones. El tráfico en sentido contrario tiene luz verde.
- id: 189
  category: safe_driving_rules
  question: ¿Cuál es la velocidad de conducción recomendada en una glorieta (roundabout)?
  choices:
    A: 15 mph o menos
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: A
  explanation: Las velocidades de conducción en las glorietas son de 15 mph o menos.
- id: 190
  category: safe_driving_rules
  question: Al entrar en una glorieta, ¿quién tiene el derecho de paso?
  choices:
    A: Los vehículos que entran a la glorieta.
    B: Los vehículos que ya están en la glorieta.
    C: Los vehículos que se aproximan por la derecha.
    D: Solo los camiones grandes.
  answer: B
  explanation: Al entrar en una glorieta, debe mirar a la izquierda y ceder el paso
    a los vehículos que ya están en ella; ellos tienen el derecho de paso.
- id: 191
  category: sharing_the_road
  question: ¿Qué debe hacer si se le acerca un vehículo de emergencia mientras conduce
    dentro de una glorieta?
  choices:
    A: Detenerse inmediatamente dentro de la glorieta para dejarlo pasar.
    B: Orillarse hacia la isla central.
    C: Continuar, salir de forma normal y luego orillarse a la derecha.
    D: Acelerar para salir de la glorieta antes de que entre el vehículo de emergencia.
  answer: C
  explanation: No se orille ni se detenga en la glorieta cuando se le acerque un vehículo
    de emergencia. Continúe y salga de forma normal, luego oríllese a la derecha donde
    haya espacio para que pase el vehículo de emergencia.
- id: 192
  category: sharing_the_road
  question: ¿Cómo debe interactuar el conductor de un vehículo pequeño con un camión
    grande que circula por una glorieta de un solo carril?
  choices:
    A: Rebasar al camión por el lado derecho.
    B: Rebasar al camión por el lado izquierdo usando la isla central.
    C: Tocar la bocina para advertir al conductor del camión de su presencia.
    D: Retroceder y quedarse detrás del camión grande mientras este completa su trayecto.
  answer: D
  explanation: Las ruedas traseras de un vehículo grande pasarán sobre la plataforma
    del camión (truck apron). El conductor del vehículo más pequeño debe retroceder
    y quedarse detrás del camión grande mientras este completa su trayecto por la
    glorieta.
- id: 193
  category: safe_driving_rules
  question: Cuando se requiere detenerse en un cruce de ferrocarril, ¿cuál es la distancia
    mínima a la que debe detenerse del riel más cercano?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 25 pies
  answer: C
  explanation: Se requiere DETENERSE en los cruces de ferrocarril lo más cerca posible
    de manera práctica, pero a no menos de 15 pies del riel más cercano cuando las
    señales de advertencia indiquen la aproximación de un tren.
- id: 194
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una práctica de seguridad recomendada al cruzar
    vías de ferrocarril?
  choices:
    A: Cambiar de marcha mientras cruza las vías para mantener la velocidad.
    B: No cambiar de marcha al cruzar las vías en caso de que el motor se apague.
    C: Detenerse en las vías para buscar trenes que se aproximen.
    D: Acelerar rápidamente para ganarle al tren si las barreras del cruce están bajando.
  answer: B
  explanation: Es prudente no cambiar de marcha al cruzar las vías del tren, en caso
    de que el vehículo se apague o se cale.
- id: 195
  category: signs_and_signals
  question: ¿Qué significa una línea amarilla continua en su lado de la línea central?
  choices:
    A: Puede rebasar si el camino está despejado.
    B: No puede cruzar la línea central para rebasar.
    C: Está en una calle de un solo sentido.
    D: Debe reducir su velocidad a 15 mph.
  answer: B
  explanation: Una línea amarilla continua en su lado significa que no puede cruzar
    la línea central para rebasar.
- id: 196
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia se permite cruzar una línea central amarilla continua?
  choices:
    A: Al adelantar a un vehículo que circula despacio.
    B: Al realizar una maniobra de giro a la izquierda.
    C: Al conducir en una carretera de varios carriles.
    D: Nunca se permite cruzar una línea central amarilla continua.
  answer: B
  explanation: Cruzar una línea central continua se permite únicamente como parte
    de una maniobra de giro a la izquierda.
- id: 197
  category: signs_and_signals
  question: ¿Cuál es la diferencia entre las marcas de carril blancas y amarillas?
  choices:
    A: Las líneas blancas separan el tráfico que se mueve en direcciones opuestas;
      las líneas amarillas separan el tráfico que se mueve en la misma dirección.
    B: Las líneas blancas indican zonas de estacionamiento; las líneas amarillas indican
      zonas de no estacionar.
    C: Las líneas blancas separan el tráfico que se mueve en la misma dirección; las
      líneas amarillas separan el tráfico que se mueve en direcciones opuestas.
    D: Las líneas blancas son para autopistas; las líneas amarillas son para calles
      de la ciudad.
  answer: C
  explanation: Las líneas que separan los carriles de tráfico que se mueven en la
    misma dirección son blancas. Las líneas que separan el tráfico que se mueve en
    direcciones opuestas son amarillas.
- id: 198
  category: signs_and_signals
  question: ¿Qué indica una flecha verde fija?
  choices:
    A: Tiene un movimiento de giro protegido.
    B: Debe ceder el paso al tráfico que viene en sentido contrario antes de girar.
    C: La señal de tráfico está a punto de ponerse en rojo.
    D: Puede girar, pero los peatones tienen el derecho de paso.
  answer: A
  explanation: Una flecha verde fija significa que tiene un movimiento de giro 'protegido'.
- id: 199
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla discontinua entre carriles de tráfico opuestos?
  choices:
    A: Puede cruzarla para rebasar si es seguro hacerlo.
    B: No puede rebasar bajo ninguna circunstancia.
    C: El carril está reservado para vehículos de alta ocupación.
    D: Se está aproximando a un carril reversible.
  answer: A
  explanation: Según el manual, una línea amarilla discontinua entre carriles de tráfico
    opuestos significa que puede cruzarla para rebasar si es seguro hacerlo.
- id: 200
  category: safe_driving_rules
  question: ¿Cuándo es permisible cruzar una línea amarilla continua?
  choices:
    A: Para rebasar a un vehículo lento en una carretera de dos carriles.
    B: Para girar hacia un estacionamiento público o privado, una entrada privada
      o una calzada si es seguro.
    C: Cuando el vehículo de adelante circula por debajo del límite de velocidad.
    D: Nunca es permisible cruzar una línea amarilla continua.
  answer: B
  explanation: 'El manual establece: ''Puede cruzar una línea amarilla continua para
    girar hacia un estacionamiento público o privado, una entrada privada o una calzada
    si es seguro hacerlo''.'
- id: 201
  category: signs_and_signals
  question: ¿Qué indica una señal de "HOV 3" sobre un carril reservado?
  choices:
    A: El carril está reservado para vehículos con al menos tres personas en ellos.
    B: El carril está reservado para vehículos comerciales pesados de 3 ejes.
    C: El límite de velocidad en el carril es de 30 mph.
    D: El carril está abierto a todo el tráfico entre las 3 PM y las 3 AM.
  answer: A
  explanation: HOV significa Vehículos de Alta Ocupación (High Occupancy Vehicles).
    El manual explica que "HOV 3" significa que debe haber al menos tres personas
    en el vehículo.
- id: 202
  category: signs_and_signals
  question: ¿Cómo está marcado cada lado de un carril central compartido?
  choices:
    A: Por una sola línea blanca continua.
    B: Por una doble línea amarilla continua.
    C: Por una línea amarilla continua y una línea amarilla discontinua.
    D: Por una doble línea blanca discontinua.
  answer: C
  explanation: Los carriles centrales compartidos están marcados en cada lado por
    una línea amarilla continua y una línea amarilla discontinua.
- id: 203
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe usar una señal de giro adecuada antes de girar
    en caminos rurales?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: D
  explanation: El manual requiere que los conductores usen una señal de giro adecuada
    100 pies antes de girar en la ciudad, y 300 pies antes de girar en caminos rurales.
- id: 204
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a un giro en el carril equivocado o se
    olvida de señalizar?
  choices:
    A: Detenerse en su carril y esperar a que el tráfico se despeje antes de girar.
    B: Cambiar de carril rápidamente para realizar el giro.
    C: Continuar hasta la siguiente intersección, colocarse en el carril adecuado,
      señalizar y girar.
    D: Retroceder de forma segura y moverse al carril correcto.
  answer: C
  explanation: Si se aproxima a un giro en el carril equivocado o se olvida de señalizar,
    debe continuar, colocarse en el carril adecuado, ir a la siguiente intersección,
    señalizar y luego girar.
- id: 205
  category: safe_driving_rules
  question: ¿Por cuánto pueden los vehículos que circulan por una carretera de dos
    carriles exceder el límite de velocidad para alcanzar y rebasar a otro vehículo?
  choices:
    A: 5 millas por hora
    B: 10 millas por hora
    C: 15 millas por hora
    D: Nunca se debe exceder el límite de velocidad para rebasar.
  answer: B
  explanation: Los vehículos que circulan por una carretera de dos carriles pueden
    exceder el límite de velocidad por 10 millas por hora para alcanzar y rebasar
    a otro vehículo y regresar de manera segura al carril derecho.
- id: 206
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad diurno para automóviles y camiones ligeros
    en una carretera de dos carriles en Montana?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: D
  explanation: Según la tabla de límites de velocidad, el límite de velocidad diurno
    para automóviles y camiones ligeros en carreteras de dos carriles es de 70 mph.
- id: 207
  category: safe_driving_rules
  question: ¿Bajo qué condición es legal rebasar a un vehículo por la derecha?
  choices:
    A: Cuando el vehículo que está rebasando circula por debajo del límite de velocidad.
    B: Cuando puede conducir con seguridad fuera del pavimento hacia el acotamiento
      para rebasar.
    C: Cuando el vehículo que está rebasando está haciendo o está a punto de hacer
      un giro a la izquierda.
    D: Cuando se encuentra en una carretera de dos carriles con una línea amarilla
      continua.
  answer: C
  explanation: Rebasar por la derecha es legal solo cuando el vehículo que está rebasando
    está haciendo o está a punto de hacer un giro a la izquierda, o en una carretera
    con pavimento sin obstrucciones lo suficientemente ancho para dos o más carriles
    de vehículos que circulan legalmente en la misma dirección.
- id: 208
  category: safe_driving_rules
  question: En una carretera de varios carriles, ¿qué carril está destinado a ser
    utilizado para rebasar a los vehículos más lentos?
  choices:
    A: El carril del extremo derecho
    B: El carril central
    C: El carril del extremo izquierdo
    D: El acotamiento
  answer: C
  explanation: En carreteras de varios carriles, el carril del extremo izquierdo está
    destinado a ser utilizado para rebasar a los vehículos más lentos.
- id: 209
  category: safe_driving_rules
  question: Al hacer un giro a la derecha, ¿por qué debe evitar abrirse demasiado
    hacia la izquierda antes de girar?
  choices:
    A: Hará que entre en un carril reversible.
    B: El conductor detrás de usted puede pensar que está cambiando de carril o girando
      a la izquierda e intentar rebasarlo por la derecha.
    C: Es ilegal girar a la derecha desde una carretera de varios carriles.
    D: No podrá ver a los peatones en el cruce peatonal.
  answer: B
  explanation: En los giros a la derecha, evite abrirse demasiado hacia la izquierda
    antes de girar. Si se abre demasiado, el conductor detrás de usted puede pensar
    que está cambiando de carril o que va a girar a la izquierda y puede intentar
    rebasarlo por la derecha.
- id: 210
  category: safe_driving_rules
  question: 'Puede dar la vuelta con su vehículo en una calzada si tiene una vista
    despejada en ambas direcciones de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Puede dar la vuelta en una calzada donde el conductor tenga 500 pies
    de vista despejada en ambas direcciones y no se aproximen vehículos.
- id: 211
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de dar marcha atrás con un vehículo estacionado?
  choices:
    A: Tocar la bocina tres veces.
    B: Caminar alrededor de su vehículo estacionado.
    C: Encender las luces de emergencia.
    D: Revisar solo el espejo retrovisor.
  answer: B
  explanation: Según las normas generales de conducción, el manual establece que debe
    "caminar alrededor de su vehículo estacionado antes de dar marcha atrás".
- id: 212
  category: signs_and_signals
  question: ¿Qué indica una "X" amarilla fija sobre un carril reversible?
  choices:
    A: El carril es solo para girar.
    B: Puede utilizar el carril debajo de ella.
    C: El uso del carril está cambiando y debe salir de él tan pronto como sea seguro.
    D: El carril está reservado para vehículos de alta ocupación (HOV).
  answer: C
  explanation: Una "X" amarilla fija significa que el uso del carril está cambiando
    y debe salir de él tan pronto como sea seguro hacerlo.
- id: 213
  category: sharing_the_road
  question: ¿Qué debe hacer si se encuentra con un peatón que utiliza un perro guía
    o lleva un bastón blanco?
  choices:
    A: Tocar la bocina para avisarles que se está acercando.
    B: Ceder el paso pero avanzar rápidamente a su alrededor.
    C: Ceder el derecho de paso absoluto y no utilizar la bocina.
    D: Tratarlos como a cualquier otro peatón y esperar a que se detengan.
  answer: C
  explanation: Según el manual, los peatones que utilizan un perro guía o llevan un
    bastón blanco tienen el derecho de paso absoluto. Los conductores no deben usar
    la bocina porque podría confundir o asustar al peatón ciego.
- id: 214
  category: safe_driving_rules
  question: 'Al caminar por una calzada donde no hay aceras, los peatones deben:'
  choices:
    A: Caminar por el lado derecho en el sentido del tráfico.
    B: Caminar por el lado izquierdo de frente al tráfico que viene en sentido contrario.
    C: Caminar por el centro del carril.
    D: Caminar por cualquier lado siempre que lleven ropa reflectante.
  answer: B
  explanation: El manual establece que cuando las personas caminan por la calzada,
    deben hacerlo por la izquierda (de frente al tráfico que viene en sentido contrario).
- id: 215
  category: safe_driving_rules
  question: 'En una intersección donde no hay una señal de pare (STOP) ni un semáforo,
    el conductor debe:'
  choices:
    A: Ceder el paso a los vehículos que vienen por la izquierda.
    B: Ceder el paso a los vehículos que vienen por la derecha.
    C: Acelerar para despejar la intersección rápidamente.
    D: Detenerse por completo antes de continuar.
  answer: B
  explanation: En una intersección donde no hay una señal de pare ni un semáforo,
    los conductores deben ceder el paso a los vehículos que vienen por la derecha.
- id: 216
  category: safe_driving_rules
  question: 'Al girar a la izquierda en una intersección, usted debe:'
  choices:
    A: Ceder el paso a los vehículos que vienen en sentido contrario y siguen recto.
    B: Tomar el derecho de paso sobre el tráfico que viene en sentido contrario.
    C: Detenerse y esperar una flecha verde, incluso si la luz es verde fija.
    D: Ceder el paso solo a los vehículos que giran a la derecha.
  answer: A
  explanation: Las reglas de derecho de paso en las intersecciones establecen que
    los conductores que giran a la izquierda deben ceder el paso a los vehículos que
    vienen en sentido contrario y siguen recto.
- id: 217
  category: safe_driving_rules
  question: Según la ley de Montana, ¿cuándo está permitido girar a la izquierda con
    luz roja?
  choices:
    A: Nunca.
    B: Al girar desde una calle de doble sentido hacia una calle de sentido único.
    C: Al girar de una calle de sentido único a otra de sentido único, después de
      detenerse por completo.
    D: Cuando no hay tráfico en sentido contrario, sin detenerse.
  answer: C
  explanation: La ley de Montana permite girar a la izquierda de una calle de sentido
    único a otra de sentido único con luz roja DESPUÉS de haberse detenido y determinado
    que es seguro hacerlo.
- id: 218
  category: sharing_the_road
  question: 'Si un vehículo se detiene en un paso de peatones marcado o no marcado
    para dejar pasar a un peatón, los conductores que se acercan por detrás:'
  choices:
    A: Pueden adelantar por la izquierda si el carril está despejado.
    B: Pueden adelantar por la derecha.
    C: No pueden adelantar al vehículo detenido.
    D: Deben tocar la bocina para alertar al peatón antes de adelantar.
  answer: C
  explanation: Cuando un vehículo se detiene en un paso de peatones marcado o no marcado
    para dejar que un peatón cruce la calle, otros conductores que se acerquen por
    detrás no pueden adelantar al vehículo detenido.
- id: 219
  category: safe_driving_rules
  question: ¿Qué debe hacer si se encuentra en una intersección cuando ve o escucha
    que se acerca un vehículo de emergencia con las luces y la sirena encendidas?
  choices:
    A: Detenerse inmediatamente en medio de la intersección.
    B: Orillarse al borde derecho de la intersección y detenerse.
    C: Cruzar la intersección antes de orillarse y detenerse.
    D: Dar marcha atrás para salir de la intersección y despejar el camino.
  answer: C
  explanation: Si se encuentra en una intersección cuando se acerca un vehículo de
    emergencia, debe cruzar la intersección antes de orillarse y detenerse.
- id: 220
  category: sharing_the_road
  question: ¿A qué distancia debe detenerse de un autobús escolar que está detenido
    con sus luces rojas intermitentes?
  choices:
    A: Al menos 15 pies.
    B: Al menos 20 pies.
    C: Al menos 30 pies.
    D: Al menos 50 pies.
  answer: C
  explanation: Al encontrarse o adelantar a un autobús escolar detenido con sus luces
    rojas intermitentes, el conductor de un vehículo debe detenerse al menos a 30
    pies del autobús.
- id: 221
  category: sharing_the_road
  question: 'Al acercarse a un autobús escolar que muestra una luz amarilla intermitente,
    usted debe:'
  choices:
    A: Detenerse inmediatamente y esperar las luces rojas.
    B: Reducir la velocidad y avanzar con cuidado.
    C: Mantener su velocidad pero tocar la bocina.
    D: Cambiar de carril y rebasar el autobús rápidamente.
  answer: B
  explanation: Si se acerca a un autobús que muestra una luz amarilla intermitente,
    debe reducir la velocidad y avanzar con cuidado, teniendo en cuenta que el autobús
    está a punto de detenerse.
- id: 222
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a conducir
    en un cortejo fúnebre?
  choices:
    A: Debe dejar suficiente espacio entre los vehículos para permitir que otros entren.
    B: Está exento de ceder el paso a los vehículos de emergencia.
    C: Debe seguir al vehículo que le precede lo más cerca posible.
    D: Puede conducir hasta 10 millas por hora por encima del límite de velocidad
      establecido.
  answer: C
  explanation: Al conducir en un cortejo fúnebre, el conductor debe seguir al vehículo
    que le precede lo más cerca posible. Las leyes que exigen un espacio suficiente
    entre los vehículos no se aplican.
- id: 223
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima a la que puede viajar un conductor en un
    cortejo fúnebre en una carretera donde el límite de velocidad es de 55 mph o más?
  choices:
    A: 45 millas por hora.
    B: 50 millas por hora.
    C: 55 millas por hora.
    D: 65 millas por hora.
  answer: C
  explanation: Un conductor en un cortejo fúnebre no puede conducir a más de 55 millas
    por hora en una carretera donde el límite de velocidad es de 55 millas por hora
    o más.
- id: 224
  category: safe_driving_rules
  question: Según el manual, ¿qué dice la ley con respecto al derecho de paso?
  choices:
    A: Otorga el derecho de paso al vehículo más grande.
    B: Otorga el derecho de paso a los peatones en todas las circunstancias.
    C: Indica quién debe ceder el derecho de paso, pero no otorga el derecho de paso
      a nadie.
    D: Otorga el derecho de paso al conductor que llega primero a una intersección.
  answer: C
  explanation: La ley indica quién debe ceder el derecho de paso; no otorga el derecho
    de paso a nadie. Los conductores deben hacer todo lo posible para evitar atropellar
    a un peatón o chocar con un vehículo.
- id: 225
  category: safe_driving_rules
  question: 'Al entrar en una glorieta o rotonda, un conductor debe:'
  choices:
    A: Ceder el paso a los conductores que ya están en la glorieta.
    B: Tomar el derecho de paso si entra por la derecha.
    C: Detenerse por completo antes de entrar, independientemente del tráfico.
    D: Ceder el paso únicamente a los vehículos comerciales.
  answer: A
  explanation: Los conductores que entran en una glorieta o rotonda deben ceder el
    paso a los conductores que ya se encuentran en ella.
- id: 226
  category: safe_driving_rules
  question: 'Usted se acerca a una intersección con luz verde, pero el tráfico está
    congestionado a lo largo de la intersección. Usted debe:'
  choices:
    A: Entrar en la intersección y esperar a que el tráfico se despeje.
    B: Esperar hasta que el tráfico de adelante se despeje para no bloquear la intersección.
    C: Tocar la bocina para animar a los vehículos de adelante a avanzar.
    D: Avanzar lentamente y zigzaguear entre los vehículos detenidos.
  answer: B
  explanation: Los conductores no pueden entrar en una intersección a menos que puedan
    atravesarla sin tener que detenerse. Debe esperar hasta que el tráfico de adelante
    se despeje para no bloquear la intersección.
- id: 227
  category: sharing_the_road
  question: 'Si NO forma parte de un cortejo fúnebre, no puede rebasar al cortejo
    en una carretera de varios carriles por el lado derecho del mismo, a menos que:'
  choices:
    A: El cortejo viaje por debajo del límite de velocidad.
    B: Usted esté conduciendo un vehículo de emergencia.
    C: El cortejo se encuentre en el carril del extremo izquierdo.
    D: Usted tenga encendidas las luces de emergencia.
  answer: C
  explanation: Un conductor no puede rebasar a un cortejo fúnebre en una carretera
    de varios carriles por el lado derecho del cortejo, a menos que este se encuentre
    en el carril del extremo izquierdo.
- id: 228
  category: sharing_the_road
  question: ¿Qué requisito de iluminación se aplica al primer y al último vehículo
    de un cortejo fúnebre?
  choices:
    A: Deben usar luces delanteras de carretera (altas).
    B: Deben tener sus luces direccionales parpadeando simultáneamente.
    C: Deben mostrar una luz amarilla intermitente.
    D: No se requiere que tengan ninguna iluminación especial.
  answer: B
  explanation: Las luces direccionales deben parpadear simultáneamente como luces
    de advertencia en un vehículo que sea el primero en un cortejo fúnebre o que se
    considere el último vehículo del mismo.
- id: 229
  category: sharing_the_road
  question: Si conduce en un cortejo fúnebre, ¿qué debe hacer si se acerca un vehículo
    de emergencia autorizado con una señal auditiva o visual?
  choices:
    A: Mantener su velocidad y posición en el cortejo.
    B: Detenerse inmediatamente en su carril.
    C: Ceder el derecho de paso al vehículo de emergencia.
    D: Acelerar para despejar la intersección.
  answer: C
  explanation: Un conductor en un cortejo fúnebre debe ceder el derecho de paso a
    un vehículo de emergencia autorizado que se aproxime emitiendo una señal auditiva
    o visual.
- id: 230
  category: sharing_the_road
  question: Al rebasar a un ciclista en una carretera de dos carriles de alta velocidad
    sin tráfico en sentido contrario, ¿cuál es la distancia recomendada que debe dejar
    entre su vehículo y el ciclista?
  choices:
    A: Dos pies
    B: Tres pies
    C: Cinco pies
    D: Ten pies
  answer: C
  explanation: Si no hay tráfico en sentido contrario, cruce con cuidado la línea
    central para dejar al ciclista una distancia recomendada de cinco pies entre él
    y su vehículo motorizado.
- id: 231
  category: signs_and_signals
  question: ¿Qué indican las marcas de carril compartido (sharrows) a los automovilistas?
  choices:
    A: El carril es exclusivamente para bicicletas.
    B: Los automovilistas deben estar atentos a los ciclistas y dejarles suficiente
      espacio al rebasarlos.
    C: Los ciclistas deben circular por la acera en esta zona.
    D: Los automovilistas tienen prohibido usar el carril.
  answer: B
  explanation: Cuando vea una marca de carril compartido, debe estar atento a los
    ciclistas y asegurarse de dejarles suficiente espacio al rebasarlos.
- id: 232
  category: sharing_the_road
  question: Según la ley de Montana, ¿cuándo debe un automovilista ceder el derecho
    de paso a una persona que circula en bicicleta?
  choices:
    A: Solo cuando el ciclista se encuentra en un paso de peatones.
    B: Cuando el ciclista se encuentra dentro de un carril para bicicletas designado.
    C: Solo durante las horas del día.
    D: Cuando el ciclista circula por la acera.
  answer: B
  explanation: Los automovilistas deben ceder el derecho de paso a una persona que
    circula en bicicleta dentro de un carril para bicicletas designado.
- id: 233
  category: sharing_the_road
  question: ¿En cuál de las siguientes situaciones se permite a los ciclistas circular
    en fila de a dos (uno al lado del otro) en una calzada?
  choices:
    A: Cuando circulan por un arcén (hombro) pavimentado o un carril de estacionamiento.
    B: Cuando circulan por una carretera rural de dos carriles y alta velocidad.
    C: Al acercarse a una curva sin visibilidad.
    D: A los ciclistas nunca se les permite circular en fila de a dos.
  answer: A
  explanation: Las personas que circulan en bicicleta por una calzada deben hacerlo
    en fila india, excepto cuando... circulen por un arcén pavimentado o en un carril
    de estacionamiento, en cuyo caso las personas pueden circular en fila de a dos.
- id: 234
  category: sharing_the_road
  question: ¿Por qué un ciclista podría circular más hacia el centro del carril en
    lugar de permanecer estrictamente en el arcén?
  choices:
    A: Para retrasar intencionadamente el tráfico de vehículos motorizados.
    B: Para disuadir a los automovilistas de intentar un adelantamiento peligroso
      dentro del mismo carril.
    C: Porque no se permiten bicicletas en los arcenes.
    D: Para prepararse para un próximo giro a la derecha.
  answer: B
  explanation: Muchos ciclistas suelen circular más hacia el interior del carril (aproximadamente
    de 18 a 24 pulgadas) para disuadir a los automovilistas de intentar un adelantamiento
    peligroso dentro del mismo carril.
- id: 235
  category: defensive_driving
  question: ¿A qué se refiere el término 'doored' (recibir un portazo) en el contexto
    de la seguridad de los ciclistas?
  choices:
    A: A un ciclista que choca contra la puerta cerrada de un garaje.
    B: A un automovilista que abre repentinamente la puerta de su auto estacionado
      sin comprobar si se acercan ciclistas.
    C: A un ciclista que circula demasiado cerca de la puerta principal de un negocio.
    D: A la puerta de un vehículo que se cae en el carril de bicicletas.
  answer: B
  explanation: Este término describe una situación en la que una persona dentro de
    un vehículo estacionado abre repentinamente la puerta de su auto sin comprobar
    si se acerca algún ciclista por detrás.
- id: 236
  category: sharing_the_road
  question: Si una bicicleta circula por su carril y usted necesita girar a la derecha,
    ¿qué debe hacer?
  choices:
    A: Acelerar y girar rápidamente delante del ciclista.
    B: Tocar la bocina para advertir al ciclista que se aparte del camino.
    C: Verificar que el ciclista se haya detenido, o permitirle pasar antes de realizar
      el giro.
    D: Pasar rozando al ciclista por el lado derecho.
  answer: C
  explanation: Cuando una bicicleta circula por su carril y usted necesita girar a
    la derecha, compruebe siempre que el ciclista se ha detenido para dejarle girar,
    o permita que el ciclista le pase antes de realizar el giro.
- id: 237
  category: vehicle_information
  question: ¿Qué equipo de iluminación se requiere en una bicicleta cuando se utiliza
    por la noche?
  choices:
    A: Una luz delantera que emita una luz blanca visible desde al menos 500 pies.
    B: Una baliza amarilla intermitente en la parte trasera.
    C: Una luz delantera que emita una luz roja visible desde al menos 300 pies.
    D: No se requiere iluminación si la bicicleta tiene reflectores.
  answer: A
  explanation: 'La ley de Montana exige que las bicicletas estén equipadas de la siguiente
    manera: Cuando se utilicen de noche, una luz en la parte delantera, que debe emitir
    una luz blanca visible desde al menos 500 pies hacia adelante.'
- id: 238
  category: vehicle_information
  question: ¿Cuáles son los requisitos para los frenos de las bicicletas según la
    ley de Montana?
  choices:
    A: La bicicleta debe tener frenos de disco en ambas ruedas.
    B: El freno debe permitir al operador hacer que las ruedas derrapen sobre pavimento
      seco, nivelado y limpio.
    C: Solo se requieren frenos para las bicicletas que circulan por autopistas.
    D: El freno debe detener la bicicleta en un espacio de 10 pies a 15 mph.
  answer: B
  explanation: La ley de Montana exige que las bicicletas estén equipadas con un freno
    que permita al operador hacer que las ruedas derrapen sobre un pavimento seco,
    nivelado y limpio.
- id: 239
  category: vehicle_information
  question: ¿Qué equipo de seguridad se recomienda, aunque no sea obligatorio por
    ley, para que todo ciclista equipe su bicicleta?
  choices:
    A: Una bocina motorizada de gran potencia.
    B: Un espejo retrovisor en el manillar izquierdo.
    C: Una bandera naranja fluorescente suspendida al menos a 6 pies por encima de
      la calzada.
    D: Una luz azul intermitente en la rueda delantera.
  answer: C
  explanation: Se recomienda a todos los ciclistas que equipen su bicicleta con una
    bandera naranja fluorescente, claramente visible desde la parte trasera y suspendida
    al menos a 6 pies por encima de la calzada cuando la bicicleta esté en posición
    vertical.
- id: 240
  category: safe_driving_rules
  question: Al estacionar su vehículo en una calzada con bordillo (curb), ¿a qué distancia
    debe estar su vehículo del bordillo?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 12 pulgadas
    C: A menos de 18 pulgadas
    D: A menos de 24 pulgadas
  answer: C
  explanation: Su vehículo debe estar a menos de 18 pulgadas (1.5 pies) del bordillo
    o del arcén.
- id: 241
  category: safe_driving_rules
  question: ¿Qué debe hacer con la transmisión de su vehículo al estacionar?
  choices:
    A: Dejarla en punto muerto (neutral) independientemente del tipo de transmisión.
    B: Dejarla en una marcha (velocidad) si tiene transmisión manual, o en posición
      de estacionamiento (P) si tiene transmisión automática.
    C: Dejarla en punto muerto y usar solo el freno de mano.
    D: Dejarla en posición de conducir (D) si tiene transmisión automática.
  answer: B
  explanation: Siempre ponga el freno de mano al estacionar. Deje el vehículo en una
    marcha si tiene transmisión manual, o en posición de estacionamiento (P) si tiene
    transmisión automática.
- id: 242
  category: safe_driving_rules
  question: ¿Cuál es el requisito de iluminación para los vehículos estacionados en
    una calzada o arcén durante las horas de oscuridad?
  choices:
    A: Deben tener las luces de emergencia parpadeando continuamente.
    B: Deben tener luces delanteras y traseras visibles a 500 pies.
    C: Deben tener las luces altas encendidas.
    D: No se requieren luces si está estacionado fuera del carril principal de circulación.
  answer: B
  explanation: Los vehículos estacionados en una calzada o arcén durante las horas
    de oscuridad deben tener luces delanteras y traseras visibles a una distancia
    de 500 pies.
- id: 243
  category: safe_driving_rules
  question: ¿A qué distancia máxima debe estar su vehículo del bordillo o arcén al
    estacionar?
  choices:
    A: A menos de 12 pulgadas (1 pie)
    B: A menos de 18 pulgadas (1.5 pies)
    C: A menos de 24 pulgadas (2 pies)
    D: A menos de 36 pulgadas (3 pies)
  answer: B
  explanation: Según el manual, su vehículo debe estar a menos de 18 pulgadas (1.5
    pies) del bordillo o arcén al estacionar.
- id: 244
  category: safe_driving_rules
  question: Al estacionar en una calzada o arcén durante las horas de oscuridad, ¿a
    qué distancia deben ser visibles las luces delanteras y traseras de su vehículo?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El manual establece que los vehículos estacionados en una calzada o
    arcén durante las horas de oscuridad deben tener luces delanteras y traseras visibles
    a 500 pies.
- id: 245
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante cuando se estaciona cuesta abajo
    con bordillo?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Recto hacia adelante
    D: Hacia la calle
  answer: A
  explanation: Cuando se estaciona cuesta abajo, debe girar las ruedas hacia el bordillo
    para que, si el vehículo rueda, lo haga alejándose del tráfico.
- id: 246
  category: safe_driving_rules
  question: Si se estaciona cuesta arriba y no hay bordillo, ¿hacia qué lado debe
    girar las ruedas?
  choices:
    A: Hacia la calle
    B: En dirección contraria a la calle
    C: Recto hacia adelante
    D: Paralelo al arcén
  answer: B
  explanation: Al estacionar en una colina donde no hay bordillo, debe girar las ruedas
    en dirección contraria a la calle.
- id: 247
  category: signs_and_signals
  question: ¿Qué indica un bordillo pintado de amarillo?
  choices:
    A: No detenerse, pararse ni estacionar
    B: Detenerse solo para recoger o dejar pasajeros
    C: Detenerse solo el tiempo suficiente para cargar o descargar y debe permanecer
      con el vehículo
    D: Reservado para estacionamiento de personas con discapacidad
  answer: C
  explanation: Un bordillo amarillo significa detenerse solo el tiempo suficiente
    para cargar o descargar, y el conductor debe permanecer con el vehículo.
- id: 248
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios no se permite estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: El manual establece que no debe estacionar a menos de 15 pies de un
    hidrante de incendios.
- id: 249
  category: safe_driving_rules
  question: ¿A cuántos pies de un semáforo, señal de pare (STOP) o señal de ceda el
    paso es ilegal estacionar?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: No puede estacionar a menos de 30 pies de un semáforo, señal de pare
    o señal de ceda el paso.
- id: 250
  category: safe_driving_rules
  question: ¿A cuántos pies de un cruce ferroviario no debe estacionar su vehículo?
  choices:
    A: 15 pies
    B: 25 pies
    C: 50 pies
    D: 75 pies
  answer: C
  explanation: El manual prohíbe estacionar un vehículo a menos de 50 pies de un cruce
    ferroviario.
- id: 251
  category: driver_responsibility
  question: ¿Cuál es el seguro de responsabilidad civil mínimo requerido por lesiones
    o destrucción de la propiedad de terceros en un solo accidente?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: A
  explanation: Los propietarios deben tener un seguro de al menos $10,000 por lesiones
    o destrucción de la propiedad de terceros en un solo accidente.
- id: 252
  category: penalties_and_points
  question: 'Conducir sin una póliza de seguro de responsabilidad civil válida por
    primera vez resulta en una multa, posible tiempo en la cárcel y:'
  choices:
    A: 2 puntos contra su historial de conducción
    B: 5 puntos contra su historial de conducción
    C: 10 puntos contra su historial de conducción
    D: Revocación automática de la licencia
  answer: B
  explanation: Una primera infracción por conducir sin una póliza de seguro de responsabilidad
    civil válida resulta en 5 puntos contra su historial de conducción, además de
    una multa y/o encarcelamiento.
- id: 253
  category: penalties_and_points
  question: 'Una segunda infracción por conducir sin un seguro de responsabilidad
    civil válido es sancionable con una multa, posible tiempo en la cárcel y:'
  choices:
    A: Suspensión de su licencia de conducir por 1 año
    B: Suspensión de sus placas y registro por 90 días
    C: Confiscación de su vehículo
    D: 30 días obligatorios en la cárcel del condado
  answer: B
  explanation: Una segunda infracción o posterior es sancionable con una multa, posible
    encarcelamiento y la suspensión de sus placas y registro por 90 días.
- id: 254
  category: driver_responsibility
  question: Según la ley de Montana, ¿un propietario puede calificar como autoasegurador
    si posee más de cuántos vehículos motorizados registrados en el estado?
  choices:
    A: '5'
    B: '10'
    C: '25'
    D: '50'
  answer: C
  explanation: La ley establece que los propietarios de más de 25 vehículos motorizados
    registrados en Montana pueden calificar como autoaseguradores.
- id: 255
  category: driver_responsibility
  question: ¿Cuál es el propósito principal del Sistema de Verificación de Seguros
    de Montana (MTIVS)?
  choices:
    A: Permitir que los conductores compren seguros directamente del estado
    B: Confirmar que los propietarios y operadores de vehículos cumplan con los requisitos
      de la póliza de responsabilidad civil del vehículo
    C: Rastrear los historiales de conducción y los puntos de los automovilistas sin
      seguro
    D: Proporcionar seguro de responsabilidad civil gratuito a los conductores de
      bajos ingresos
  answer: B
  explanation: El MTIVS se estableció para confirmar que los propietarios y operadores
    de vehículos en las carreteras de Montana cumplan con los requisitos de la póliza
    de responsabilidad civil del vehículo.
- id: 256
  category: defensive_driving
  question: ¿Qué porcentaje de las decisiones al conducir se basan en lo que vemos?
  choices:
    A: 50%
    B: 75%
    C: 90%
    D: 99%
  answer: C
  explanation: Según el manual, conducir requiere la toma de decisiones y el pensamiento
    crítico, y el 90% de las decisiones al conducir se basan en lo que vemos.
- id: 257
  category: safe_driving_rules
  question: 'Enviar o leer un mensaje de texto aparta la vista de la carretera durante
    5 segundos. A 55 mph, esto equivale a conducir la longitud de:'
  choices:
    A: Una cancha de baloncesto
    B: Un campo de fútbol americano entero con los ojos vendados
    C: Una cuadra de la ciudad
    D: Un cuarto de milla
  answer: B
  explanation: El manual establece que enviar o leer un mensaje de texto aparta la
    vista de la carretera durante 5 segundos, lo que a 55 mph es como conducir la
    longitud de un campo de fútbol americano entero con los ojos vendados.
- id: 258
  category: driver_responsibility
  question: ¿Por qué se considera que enviar mensajes de texto es la distracción más
    alarmante al conducir?
  choices:
    A: Involucra distracción manual, visual y cognitiva simultánea.
    B: Agota la batería del teléfono rápidamente, lo que provoca la pérdida de navegación.
    C: Requiere ambas manos para escribir con eficacia.
    D: Es la única distracción que es ilegal en todas las ciudades.
  answer: A
  explanation: Enviar mensajes de texto es la distracción más alarmante porque involucra
    distracción manual, visual y cognitiva simultánea.
- id: 259
  category: vehicle_information
  question: 'Antes de arrancar un vehículo con transmisión automática, el selector
    de marchas debe estar en:'
  choices:
    A: Drive (conducir)
    B: Neutral (punto muerto)
    C: Primera marcha
    D: Park (estacionamiento)
  answer: D
  explanation: Para un vehículo que tiene transmisión automática, debe colocar el
    selector de marchas en 'park' (estacionamiento). De lo contrario, el vehículo
    no arrancará.
- id: 260
  category: defensive_driving
  question: ¿Qué puede suceder si intenta acelerar demasiado rápido en una superficie
    resbaladiza?
  choices:
    A: El motor se detendrá inmediatamente.
    B: Las ruedas motrices pueden patinar y hacer que el vehículo se deslice.
    C: La transmisión cambiará automáticamente a neutral.
    D: El freno de mano se activará.
  answer: B
  explanation: Intentar arrancar demasiado rápido puede hacer que las ruedas motrices
    patinen, particularmente en superficies resbaladizas, y causar que el vehículo
    se deslice.
- id: 261
  category: vehicle_information
  question: ¿Cuál es el agarre del volante recomendado para los vehículos más nuevos
    equipados con bolsas de aire (airbags) montadas en el volante?
  choices:
    A: Posiciones de las 10 y las 2 en punto
    B: Posiciones de las 8 y las 4 en punto
    C: Posiciones de las 12 y las 6 en punto
    D: Una mano en la posición de las 12 en punto
  answer: B
  explanation: Ambas manos deben colocarse en lados opuestos del volante, como en
    las posiciones de las 8 y las 4 en punto para los vehículos más nuevos equipados
    con bolsas de aire (airbags) montadas en el volante.
- id: 262
  category: safe_driving_rules
  question: Al girar en las esquinas, ¿qué técnica debe utilizar para girar el volante?
  choices:
    A: La técnica de la palma de una mano
    B: La técnica de mano sobre mano
    C: La técnica de deslizar entre los dedos
    D: La técnica de un solo dedo
  answer: B
  explanation: Al girar en las esquinas, gire el volante utilizando la técnica de
    'mano sobre mano'; no gire el volante solo con la palma de una mano o podría perder
    el control.
- id: 263
  category: safe_driving_rules
  question: ¿Cuál es la mejor manera de controlar su velocidad al conducir?
  choices:
    A: Igualar la velocidad del vehículo que está a su lado.
    B: Revisar el velocímetro con frecuencia.
    C: Confiar en su juicio sobre qué tan rápido va.
    D: Escuchar el sonido del motor.
  answer: B
  explanation: La mejor manera de controlar su velocidad es saber a qué velocidad
    va. Revise el velocímetro con frecuencia, ya que las personas no son muy buenas
    juzgando qué tan rápido van.
- id: 264
  category: defensive_driving
  question: Según el manual, ¿cuál es el factor que más contribuye a los choques?
  choices:
    A: No ver lo que está sucediendo
    B: Conducir por encima del límite de velocidad
    C: Conducir bajo la influencia del alcohol
    D: Malas condiciones climáticas
  answer: A
  explanation: El manual establece que el factor que más contribuye a los choques
    es no ver lo que está sucediendo.
- id: 265
  category: safe_driving_rules
  question: ¿Por qué debe evitar conducir con auriculares o audífonos?
  choices:
    A: Agotan la batería de su teléfono rápidamente.
    B: Hacen que sea demasiado difícil escuchar las bocinas y sirenas de emergencia.
    C: Son una distracción visual.
    D: Interfieren con el encendido electrónico del vehículo.
  answer: B
  explanation: No conduzca con auriculares o audífonos. Hacen que sea demasiado difícil
    escuchar las bocinas y sirenas de emergencia.
- id: 266
  category: defensive_driving
  question: 'Reducir la velocidad para mirar un choque o actividad al costado de la
    carretera a menudo se llama:'
  choices:
    A: Seguir muy de cerca (Tailgating)
    B: Mirar con curiosidad (Rubbernecking)
    C: Escanear
    D: Multitarea
  answer: B
  explanation: Al pasar por un choque u otra actividad al costado de la carretera,
    no quite la vista del camino y no reduzca la velocidad para mirar, lo cual a menudo
    se llama 'rubbernecking'.
- id: 267
  category: defensive_driving
  question: Para evitar frenar a último momento, ¿cuántos segundos por delante de
    su vehículo debe mirar hacia la carretera?
  choices:
    A: 3 segundos
    B: 5 segundos
    C: 10 segundos
    D: 15 segundos
  answer: C
  explanation: Para evitar frenar a último momento o la necesidad de girar, debe mirar
    hacia la carretera al menos 10 segundos por delante de su vehículo.
- id: 268
  category: defensive_driving
  question: 'Al conducir en la autopista, mirar 10 segundos hacia adelante equivale
    aproximadamente a:'
  choices:
    A: Una cuadra de la ciudad
    B: Dos cuadras de la ciudad
    C: Cuatro cuadras de la ciudad o un cuarto de milla
    D: Una milla
  answer: C
  explanation: En la autopista, 10 segundos son aproximadamente cuatro cuadras de
    la ciudad o un cuarto de milla.
- id: 269
  category: defensive_driving
  question: ¿Cómo puede ayudarle a ahorrar combustible el mirar bien hacia adelante?
  choices:
    A: Le permite conducir a velocidades más altas de manera segura.
    B: Reduce la resistencia aerodinámica de su vehículo.
    C: Le ayuda a evitar frenazos innecesarios que provocan un menor rendimiento de
      millas por galón.
    D: Cambia automáticamente la transmisión a una marcha superior.
  answer: C
  explanation: Los conductores que miran bien hacia adelante y pueden reducir la velocidad
    gradualmente o cambiar de carril pueden evitar frenazos innecesarios que provocan
    un menor rendimiento de millas por galón.
- id: 270
  category: driver_responsibility
  question: ¿Cuál es la realidad de la 'multitarea' al conducir?
  choices:
    A: Mejora su tiempo de reacción ante peligros repentinos.
    B: En realidad, su cerebro se ocupa de una tarea a la vez, pero cambia entre tareas
      muy rápidamente.
    C: Es una práctica segura siempre que utilice dispositivos de manos libres.
    D: Le permite procesar información visual más rápido.
  answer: B
  explanation: Lo que comúnmente se conoce como 'multitarea' en realidad no lo es.
    Su cerebro en realidad se ocupa de una tarea a la vez, pero cambia entre tareas
    muy rápidamente.
- id: 271
  category: safe_driving_rules
  question: ¿Cuándo es obligatorio encender los faros delanteros en Montana?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol
    B: Desde media hora después de la puesta del sol hasta media hora antes de la
      salida del sol
    C: Solo cuando está completamente oscuro afuera
    D: Desde la puesta del sol hasta la salida del sol
  answer: B
  explanation: El manual establece que debe encender los faros delanteros en cualquier
    momento desde media hora después de la puesta del sol hasta media hora antes de
    la salida del sol, o cuando las personas o los vehículos no sean visibles a 500
    pies.
- id: 272
  category: defensive_driving
  question: ¿Qué debe hacer si se detiene en una intersección y su visión de la calle
    transversal está bloqueada?
  choices:
    A: Tocar la bocina y acelerar rápidamente a través de la intersección
    B: Esperar a que otro conductor le haga una señal para pasar
    C: Avanzar lentamente hacia adelante hasta que pueda ver claramente el tráfico
      que cruza
    D: Girar a la derecha en lugar de seguir recto
  answer: C
  explanation: El manual aconseja que si su visión de una calle transversal está bloqueada,
    debe avanzar lentamente hacia adelante hasta que pueda ver, dando a los conductores
    que cruzan la oportunidad de ver la parte delantera de su vehículo.
- id: 273
  category: safe_driving_rules
  question: ¿Cuál es una regla de seguridad crucial al cruzar vías de ferrocarril
    con más de una vía?
  choices:
    A: Proceder de inmediato una vez que el primer tren despeje el cruce
    B: Esperar hasta que el tren que pasa esté bien alejado en la vía antes de comenzar
      a cruzar
    C: Conducir alrededor de las barreras del cruce si permanecen bajadas después
      de que pase el tren
    D: Tocar la bocina para advertir a cualquier tren oculto antes de cruzar
  answer: B
  explanation: En los cruces con más de una vía, debe esperar hasta que el tren que
    pasa esté bien alejado en la vía porque podría venir otro tren que esté oculto
    por el que acaba de pasar.
- id: 274
  category: defensive_driving
  question: ¿Por qué es necesario mirar por encima del hombro al cambiar de carril?
  choices:
    A: Para revisar sus puntos ciegos porque no puede verlos a través de sus espejos
    B: Para asegurarse de que sus pasajeros traseros estén sentados correctamente
    C: Para ver si las autoridades lo están siguiendo
    D: Para juzgar la velocidad del vehículo que está directamente detrás de usted
  answer: A
  explanation: El manual establece que debe mirar por encima del hombro para revisar
    las esquinas traseras de su vehículo, las cuales se denominan 'puntos ciegos'
    porque no puede verlas a través de sus espejos.
- id: 275
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es la técnica recomendada para dar marcha atrás
    con su vehículo?
  choices:
    A: Confiar únicamente en sus espejos retrovisores y laterales
    B: Colocar su brazo derecho en el respaldo del asiento y mirar directamente a
      través de la ventana trasera
    C: Abrir la puerta y mirar hacia el suelo mientras da marcha atrás
    D: Tocar la bocina continuamente mientras da marcha atrás
  answer: B
  explanation: Al dar marcha atrás, el manual instruye a los conductores a colocar
    su brazo derecho en el respaldo del asiento y girarse para mirar directamente
    a través de la ventana trasera, en lugar de depender de los espejos.
- id: 276
  category: safe_driving_rules
  question: ¿Qué establece el manual con respecto a conducir con las luces de estacionamiento
    encendidas?
  choices:
    A: Debe conducir con las luces de estacionamiento al anochecer para ahorrar energía
      de la batería
    B: Las luces de estacionamiento deben usarse al conducir en tráfico pesado
    C: NUNCA conduzca con las luces de estacionamiento, ya que el tráfico que viene
      en sentido contrario puede pensar que usted está detenido
    D: Se requieren luces de estacionamiento al conducir a menos de 25 mph por la
      noche
  answer: C
  explanation: 'El manual establece explícitamente: ''NUNCA conduzca con las luces
    de estacionamiento, ya que el tráfico que viene en sentido contrario puede pensar
    que usted está detenido''.'
- id: 277
  category: vehicle_information
  question: ¿A qué distancia deben revelar sus faros delanteros a personas y vehículos
    cuando están en la luz alta (brillante)?
  choices:
    A: 100 pies
    B: 350 pies
    C: 500 pies
    D: 1000 pies
  answer: B
  explanation: Según el manual, los faros delanteros en la luz alta (brillante) deben
    revelar personas y vehículos a 350 pies.
- id: 278
  category: defensive_driving
  question: ¿Hacia dónde debe mirar cuando se encuentre con tráfico en sentido contrario
    por la noche para evitar el resplandor de los faros?
  choices:
    A: Mirar fijamente a los faros que vienen en sentido contrario
    B: Cerrar un ojo para preservar su visión nocturna
    C: Observar el borde derecho de la calzada
    D: Mirar la línea central de la carretera
  answer: C
  explanation: Al encontrarse con tráfico por la noche, el manual aconseja evitar
    mirar directamente a los faros que vienen en sentido contrario y, en su lugar,
    observar el borde derecho de la calzada.
- id: 279
  category: safe_driving_rules
  question: ¿Se le permite girar a la izquierda desde una calle de un solo sentido
    hacia otra calle de un solo sentido?
  choices:
    A: No, siempre es ilegal
    B: Sí, pero solo si hay una señal de flecha verde
    C: Sí, a menos que lo prohíba una señal o semáforo
    D: Sí, pero solo si primero se detiene por completo durante 5 segundos
  answer: C
  explanation: 'El manual establece: ''A menos que esté prohibido, puede girar a la
    izquierda desde una calle de un solo sentido hacia otra calle de un solo sentido''.'
- id: 280
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones es especialmente importante mirar
    detrás de su vehículo?
  choices:
    A: Solo cuando está dando marcha atrás para salir de una entrada
    B: Cuando cambia de carril, reduce la velocidad, da marcha atrás o conduce por
      una colina larga o empinada
    C: Solo cuando conduce por la interestatal con tráfico pesado
    D: Cuando está acelerando en una carretera plana y recta
  answer: B
  explanation: El manual señala que es muy importante mirar hacia atrás para ver si
    hay vehículos cuando cambia de carril, reduce la velocidad, da marcha atrás o
    conduce por una colina larga o empinada.
- id: 281
  category: defensive_driving
  question: ¿Cómo pueden afectar su conducción nocturna los lentes tintados o "fotocromáticos"
    (photo gray)?
  choices:
    A: Mejoran el contraste y le ayudan a ver mejor en la oscuridad
    B: Son obligatorios si tiene ojos sensibles
    C: Pueden restar hasta un 30% de su visión nocturna
    D: No tienen un efecto medible en la conducción nocturna
  answer: C
  explanation: El manual advierte que incluso los lentes tintados y algunos lentes
    "fotocromáticos" pueden restar hasta un 30% de su visión nocturna, lo que los
    hace peligrosos para la conducción nocturna.
- id: 282
  category: defensive_driving
  question: Al cambiar de carril, ¿por qué es importante revisar el carril más alejado
    si lo hay?
  choices:
    A: Para ver si puede saltarse un carril de forma segura mientras cambia
    B: Porque alguien en ese carril podría estar planeando moverse al mismo carril
      al que usted desea entrar
    C: Para buscar vehículos de las fuerzas del orden a lo lejos
    D: Porque la ley exige cruzar siempre dos carriles a la vez
  answer: B
  explanation: El manual aconseja revisar el carril más alejado porque "alguien en
    ese carril podría estar planeando moverse al mismo carril al que usted desea entrar".
- id: 283
  category: safe_driving_rules
  question: Además de los momentos específicos del día, ¿en qué otro momento debe
    encender las luces delanteras?
  choices:
    A: En cualquier momento en que las personas o los vehículos no sean visibles a
      100 pies
    B: En cualquier momento en que las personas o los vehículos no sean visibles a
      350 pies
    C: En cualquier momento en que las personas o los vehículos no sean visibles a
      500 pies
    D: En cualquier momento en que las personas o los vehículos no sean visibles a
      1000 pies
  answer: C
  explanation: Debe encender las luces delanteras en cualquier momento en que, debido
    a condiciones de luz insuficientes, las personas o los vehículos no sean visibles
    a 500 pies.
- id: 284
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de subir a su vehículo para retroceder?
  choices:
    A: Tocar la bocina dos veces para advertir a los peatones
    B: Revisar detrás de su vehículo porque los niños u objetos pequeños no se pueden
      ver desde el asiento del conductor
    C: Encender las luces altas para ver mejor en sus espejos
    D: Asegurarse de que su cámara de visión trasera esté encendida antes de abrir
      la puerta
  answer: B
  explanation: 'El manual ofrece un consejo para retroceder de forma segura: "Revise
    detrás de su vehículo antes de entrar. Los niños u objetos pequeños no se pueden
    ver desde el asiento del conductor".'
- id: 285
  category: safe_driving_rules
  question: Al conducir largas distancias, ¿con qué frecuencia debe detenerse para
    un breve descanso para evitar la fatiga?
  choices:
    A: Al menos cada hora
    B: Al menos cada dos horas
    C: Al menos cada tres horas
    D: Solo cuando se sienta somnoliento
  answer: B
  explanation: El manual establece que cuando esté fatigado, debe detenerse al menos
    cada dos horas para un breve descanso.
- id: 286
  category: defensive_driving
  question: ¿Cuál es una buena regla para recordar con respecto a las luces delanteras
    en días de lluvia, nieve o niebla?
  choices:
    A: Si enciende los limpiaparabrisas, encienda las luces delanteras.
    B: Use solo las luces de estacionamiento para evitar el deslumbramiento.
    C: Las luces delanteras solo son necesarias cuando empieza a oscurecer.
    D: Use las luces de emergencia en lugar de las luces delanteras.
  answer: A
  explanation: 'El manual aconseja que en condiciones de lluvia, nieve o niebla, las
    luces delanteras hacen que su vehículo sea más fácil de ver, señalando: "Recuerde,
    si enciende los limpiaparabrisas, encienda las luces delanteras".'
- id: 287
  category: vehicle_information
  question: ¿Cuándo es apropiado conducir solo con las luces de estacionamiento encendidas?
  choices:
    A: Al alejarse de un sol naciente o poniente
    B: Durante lluvia o nieve intensa
    C: Justo antes de que oscurezca por completo
    D: Nunca, las luces de estacionamiento son solo para autos estacionados
  answer: D
  explanation: 'El manual establece explícitamente: "Siempre que conduzca y las luces
    sean necesarias, use sus luces delanteras. Las luces de estacionamiento son solo
    para autos estacionados".'
- id: 288
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones debería dar un toque ligero a la
    bocina?
  choices:
    A: Para animar a alguien a conducir más rápido
    B: Para saludar a un amigo que camina por la acera
    C: Al llegar a un lugar donde no puede ver lo que hay adelante, como una colina
      empinada
    D: Cuando esté cerca de peatones con discapacidad visual
  answer: C
  explanation: Se recomienda un toque ligero de la bocina al llegar a un lugar donde
    no se puede ver lo que hay adelante, como una colina empinada, una curva cerrada
    o al salir de un callejón estrecho.
- id: 289
  category: defensive_driving
  question: ¿Cuándo es apropiado hacer sonar un TOQUE FUERTE Y BREVE con la bocina?
  choices:
    A: Cuando un niño o una persona mayor está a punto de caminar, correr o entrar
      en la calle
    B: Para informar a otros conductores de un error de conducción
    C: Cuando una persona en bicicleta parece estar moviéndose hacia su carril
    D: Cuando está pasando a un conductor que comienza a girar hacia su carril
  answer: A
  explanation: El manual instruye a los conductores a hacer sonar un toque fuerte
    con la bocina si hay peligro, como cuando un niño o una persona mayor está a punto
    de caminar, correr o entrar en la calle.
- id: 290
  category: safe_driving_rules
  question: Si su vehículo se avería y no puede sacarlo de la calzada, ¿dónde debería
    intentar detenerse?
  choices:
    A: Justo después de la cima de una colina
    B: Justo después de una curva cerrada
    C: En el carril central para ser más visible
    D: Donde otros conductores tengan una vista clara de su vehículo
  answer: D
  explanation: Si no puede sacar su vehículo de la calzada, el manual dice que debe
    "intentar detenerse donde otros conductores tengan una vista clara de su vehículo.
    No se detenga justo después de una colina o justo después de una curva".
- id: 291
  category: defensive_driving
  question: ¿Cómo puede señalar una emergencia a otros conductores si su vehículo
    se avería?
  choices:
    A: Pararse en el carril de tráfico y agitar los brazos
    B: Levantar el capó o atar un paño blanco a la antena, al espejo lateral o a la
      manija de la puerta
    C: Hacer sonar la bocina de forma continua y aguda
    D: Encender las luces de estacionamiento y dejar el vehículo encendido
  answer: B
  explanation: Para señalar una emergencia, el manual sugiere que usted "levante el
    capó o ate un paño blanco a la antena, al espejo lateral o a la manija de la puerta".
- id: 292
  category: sharing_the_road
  question: ¿Por qué nunca debe permanecer al lado de un vehículo grande, como un
    camión o un autobús?
  choices:
    A: Viajan a velocidades mucho más altas que los turismos
    B: Tienen puntos ciegos grandes y es difícil para sus conductores verlo
    C: Tienen más probabilidades de sufrir reventones de neumáticos
    D: Realizan paradas repentinas con frecuencia
  answer: B
  explanation: El manual advierte que nunca debe permanecer al lado de un vehículo
    grande, como un camión o un autobús, porque "estos vehículos tienen puntos ciegos
    grandes y es difícil para sus conductores verlo".
- id: 293
  category: defensive_driving
  question: Mientras espera para completar un giro a la izquierda, ¿cómo debe posicionar
    las ruedas de su vehículo?
  choices:
    A: Apuntando ligeramente hacia la izquierda
    B: Apuntando ligeramente hacia la derecha
    C: Apuntando recto hacia adelante
    D: Giradas bruscamente hacia la izquierda
  answer: C
  explanation: Mientras espera para completar un giro a la izquierda, debe mantener
    las ruedas apuntando recto hacia adelante para que, si lo golpean por detrás,
    no se vea obligado a entrar en el tráfico en sentido contrario.
- id: 294
  category: safe_driving_rules
  question: Si hay calles o entradas de vehículos entre usted y el lugar donde desea
    girar, ¿cuándo debe activar la señal de giro?
  choices:
    A: Lo antes posible para advertir a los conductores que vienen detrás
    B: Al menos 500 pies antes del giro
    C: Espere hasta haberlos pasado para hacer la señal
    D: Exactamente 100 pies antes de la primera entrada
  answer: C
  explanation: 'El manual establece: "Si hay calles, entradas de vehículos o accesos
    entre usted y el lugar donde desea girar, espere hasta haberlos pasado para hacer
    la señal". Señalizar antes podría confundir a otros conductores.'
- id: 295
  category: defensive_driving
  question: ¿Cómo puede avisar a los conductores que vienen detrás de que está a punto
    de reducir la velocidad en un lugar inesperado?
  choices:
    A: Encender las luces intermitentes de emergencia
    B: Presionar el pedal del freno tres o cuatro veces rápidamente
    C: Hacer sonar la bocina de forma aguda
    D: Usar señales manuales por la ventana
  answer: B
  explanation: Si va a detenerse o reducir la velocidad en un lugar donde otro conductor
    no lo espera, el manual dice que debe "presionar el pedal del freno tres o cuatro
    veces rápidamente para que quienes vienen detrás sepan que está a punto de reducir
    la velocidad".
- id: 296
  category: vehicle_information
  question: Según el manual, ¿cómo se compara la distancia de frenado a 60 mph con
    la distancia de frenado a 30 mph?
  choices:
    A: Toma exactamente el doble de distancia
    B: Toma un poco menos del doble de distancia
    C: Toma más de tres veces la distancia
    D: Toma cuatro veces la distancia
  answer: C
  explanation: 'El manual establece: "Por ejemplo, frenar a 60 mph no toma el doble
    de distancia que a 30 mph, sino más de tres veces la distancia".'
- id: 297
  category: safe_driving_rules
  question: ¿Por qué debe reducir la velocidad al conducir por caminos de grava o
    tierra en comparación con las carreteras de asfalto?
  choices:
    A: No tiene tanta tracción y es más fácil derrapar
    B: Los caminos de grava siempre tienen límites de velocidad publicados más bajos
    C: Sus neumáticos se sobrecalentarán más rápido
    D: El polvo cegará por completo a los conductores que vienen detrás
  answer: A
  explanation: El manual explica que no se tiene tanta tracción en caminos de grava
    y tierra, lo que significa que tomará mucho más tiempo detenerse y es mucho más
    fácil derrapar al girar.
- id: 298
  category: safe_driving_rules
  question: 'Al realizar un giro a la derecha, usted debe:'
  choices:
    A: Hacer un giro amplio hacia el carril izquierdo
    B: Mantenerse lo más cerca posible del lado derecho
    C: Entrar en la calle justo a la derecha del centro
    D: Señalizar exactamente durante 50 pies antes de girar
  answer: B
  explanation: Para los giros a la derecha, el manual instruye a los conductores a
    "mantenerse lo más cerca posible del lado derecho al completar un giro a la derecha"
    y advierte que no se debe hacer un giro amplio ni cruzar al carril izquierdo.
- id: 299
  category: safe_driving_rules
  question: ¿Qué se recomienda para que su vehículo sea más visible para los demás
    cuando conduce por caminos de grava extremadamente polvorientos?
  choices:
    A: Usar las luces altas
    B: Usar las luces bajas
    C: Encender las luces de advertencia de peligro
    D: Tocar la bocina periódicamente
  answer: B
  explanation: El manual establece que durante los períodos secos, los caminos de
    grava pueden volverse extremadamente polvorientos y la visión puede reducirse.
    Se recomienda que los conductores usen las luces bajas para que el vehículo sea
    más visible para los demás.
- id: 300
  category: safe_driving_rules
  question: ¿Cuándo es el momento adecuado para reducir la velocidad en una curva?
  choices:
    A: Antes de entrar en la curva
    B: Mientras está en medio de la curva
    C: Justo cuando comienza a salir de la curva
    D: Siempre que sienta que el vehículo comienza a derrapar
  answer: A
  explanation: Según el manual, siempre debe reducir la velocidad antes de entrar
    en la curva para no tener que frenar dentro de ella, lo que puede hacer que el
    vehículo derrape.
- id: 301
  category: safe_driving_rules
  question: ¿Cuánto debe reducir su velocidad al conducir en una carretera mojada?
  choices:
    A: Reduzca su velocidad a la mitad
    B: Reduzca la velocidad al mínimo (a paso de tortuga)
    C: Reduzca su velocidad en unas 10 mph
    D: Reduzca su velocidad en 25 mph
  answer: C
  explanation: El manual aconseja que en una carretera mojada, debe reducir su velocidad
    en unas 10 mph. En nieve compacta, debe reducir su velocidad a la mitad, y en
    hielo, debe reducir la velocidad al mínimo.
- id: 302
  category: vehicle_information
  question: ¿Durante qué período de tiempo NO se permiten los neumáticos con clavos
    (studded tires) en las carreteras?
  choices:
    A: Del 1 de abril al 31 de octubre
    B: Del 1 de junio al 30 de septiembre
    C: Del 1 de mayo al 31 de agosto
    D: Del 1 de julio al 30 de noviembre
  answer: B
  explanation: Debido a que los neumáticos con clavos pueden causar daños en la carretera,
    el manual establece que no están permitidos desde el 1 de junio hasta el 30 de
    septiembre.
- id: 303
  category: defensive_driving
  question: ¿Por qué los pasos elevados y los puentes suelen tener placas de hielo
    incluso cuando el resto del pavimento no las tiene?
  choices:
    A: Generalmente están hechos de concreto en lugar de asfalto.
    B: No tienen tierra debajo para ayudar a aislarlos contra el frío.
    C: Están expuestos a una luz solar más directa.
    D: Acumulan más agua de la lluvia y la nieve.
  answer: B
  explanation: El manual explica que el pavimento en los puentes puede estar helado
    incluso cuando el resto del pavimento no lo está, porque los puentes no tienen
    tierra debajo para ayudar a aislarlos contra el frío.
- id: 304
  category: defensive_driving
  question: ¿Por qué el pavimento puede estar muy resbaladizo durante los primeros
    minutos cuando empieza a llover en un día caluroso?
  choices:
    A: La lluvia enfría los neumáticos demasiado rápido.
    B: El calor hace que el aceite del asfalto suba a la superficie.
    C: El agua se mezcla con el polvo para formar un lodo espeso.
    D: El pavimento caliente hace que el agua hierva.
  answer: B
  explanation: Si empieza a llover en un día caluroso, el pavimento puede estar muy
    resbaladizo durante los primeros minutos porque el calor hace que el aceite del
    asfalto suba a la superficie, volviéndolo resbaladizo hasta que se lava.
- id: 305
  category: safe_driving_rules
  question: ¿A qué velocidad aproximada pueden sus neumáticos perder toda tracción
    con la carretera durante una lluvia intensa?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: Aunque la mayoría de los neumáticos tienen buena tracción hasta unas
    35 mph en carreteras mojadas, en una lluvia intensa, sus neumáticos pueden perder
    toda tracción con la carretera a unas 50 mph debido al hidroplaneo (hydroplaning).
- id: 306
  category: defensive_driving
  question: Si siente que sus neumáticos han perdido tracción debido al hidroplaneo
    (hydroplaning), ¿cuál es la acción correcta a tomar?
  choices:
    A: Pise los frenos a fondo inmediatamente.
    B: Gire el volante bruscamente para recuperar el control.
    C: Retire suavemente el pie del acelerador y mantenga el volante derecho.
    D: Acelere ligeramente para atravesar el agua.
  answer: C
  explanation: Si sus neumáticos pierden tracción, el manual le indica que retire
    suavemente el pie del acelerador, mantenga el volante derecho y no intente detenerse
    ni girar hasta que sus neumáticos vuelvan a agarrarse a la carretera.
- id: 307
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si su vehículo comienza a deslizarse
    o derrapar?
  choices:
    A: Bombee los frenos rápidamente.
    B: No use el freno y retire el pie del acelerador.
    C: Gire en la dirección opuesta al derrape.
    D: Aplique el freno de estacionamiento de emergencia.
  answer: B
  explanation: Si su vehículo comienza a deslizarse, debe evitar usar el freno (lo
    que podría hacer que derrape más) y retirar el pie del acelerador para reducir
    la velocidad.
- id: 308
  category: defensive_driving
  question: Si ve un animal en la carretera y no tiene tiempo para detenerse, ¿cuál
    es el curso de acción más seguro?
  choices:
    A: Desvíese bruscamente hacia el carril de tráfico en sentido contrario.
    B: Desvíese bruscamente hacia la cuneta.
    C: Toque la bocina y acelere.
    D: No se desvíe bruscamente; golpear al animal es más seguro que desviarse hacia
      el tráfico en sentido contrario o hacia una cuneta.
  answer: D
  explanation: El manual establece que si no hay tiempo para detenerse, no se desvíe
    bruscamente. Las posibilidades de que un conductor resulte gravemente herido disminuyen
    si golpea al animal y evita desviarse hacia el tráfico en sentido contrario o
    volcar el vehículo en la cuneta.
- id: 309
  category: safe_driving_rules
  question: 'Al entrar en una carretera de alta velocidad desde una rampa de entrada,
    usted debe:'
  choices:
    A: Conducir hasta el final de la rampa y detenerse antes de incorporarse.
    B: Usar la rampa para alcanzar la velocidad de los otros vehículos antes de incorporarse
      a la carretera.
    C: Entrar en la autopista a baja velocidad y acelerar gradualmente.
    D: Esperar un espacio en el tráfico mientras está detenido al principio de la
      rampa.
  answer: B
  explanation: Las carreteras de alta velocidad generalmente tienen rampas para darle
    tiempo a aumentar la velocidad. Debe usar la rampa para alcanzar la velocidad
    de los otros vehículos antes de incorporarse a la carretera, y no debe conducir
    hasta el final de la rampa y detenerse.
- id: 310
  category: sharing_the_road
  question: Cuando viaje por una autopista de acceso controlado y observe a otro conductor
    entrar desde una rampa de entrada, ¿qué debe hacer?
  choices:
    A: Acelerar para bloquearles la entrada.
    B: Mantener su carril y velocidad independientemente de la posición de ellos.
    C: Siempre que sea posible, muévase a su izquierda para que ellos puedan entrar
      de manera segura.
    D: Toque la bocina para advertirles que cedan el paso.
  answer: C
  explanation: El manual aconseja que cuando viaje por una autopista de acceso controlado
    y observe a otro conductor entrar, debe, siempre que sea posible, moverse a su
    izquierda para que este pueda entrar de manera segura.
- id: 311
  category: safe_driving_rules
  question: Al salir de una carretera de dos carriles y alta velocidad usando una
    rampa de salida, ¿cuándo debe reducir la velocidad?
  choices:
    A: Un cuarto de milla antes de la rampa de salida.
    B: Tan pronto como encienda su luz direccional.
    C: No reduzca la velocidad hasta que se haya movido a la rampa de salida.
    D: Solo después de haber llegado al final de la rampa de salida.
  answer: C
  explanation: Al salir del tráfico, debe señalizar su intención de salir y no reducir
    la velocidad hasta que se mueva a la rampa de salida.
- id: 312
  category: sharing_the_road
  question: ¿Bajo qué condición debe un vehículo de movimiento lento salirse de la
    calzada?
  choices:
    A: Al conducir en cualquier carretera de dos carriles.
    B: Cuando cuatro o más vehículos se retrasan detrás de ellos y hay suficiente
      espacio para un desvío seguro.
    C: Al viajar de noche.
    D: Al acercarse a una pendiente pronunciada o colina.
  answer: B
  explanation: El manual establece que cuando cuatro o más vehículos se retrasan,
    los vehículos de movimiento lento deben salirse de la calzada siempre que haya
    suficiente espacio para un desvío seguro.
- id: 313
  category: defensive_driving
  question: Si queda varado en una tormenta de nieve, ¿qué es lo mejor que puede hacer?
  choices:
    A: Dejar su vehículo y caminar para buscar ayuda.
    B: Permanecer en el automóvil porque es más probable que lo encuentren.
    C: Abandonar el automóvil y buscar refugio en una zanja.
    D: Mantener el motor en marcha continuamente para mantenerse caliente.
  answer: B
  explanation: Según el manual, si queda varado en una tormenta de nieve, lo mejor
    que puede hacer es permanecer en el automóvil porque es más probable que lo encuentren.
- id: 314
  category: safe_driving_rules
  question: ¿Por dónde deben circular los vehículos de movimiento lento en la calzada?
  choices:
    A: En el carril del extremo izquierdo
    B: En el carril central
    C: En el carril del extremo derecho
    D: En cualquier carril siempre que tengan encendidas las luces de emergencia
  answer: C
  explanation: Según el manual, los vehículos de movimiento lento deben circular por
    el carril del extremo derecho de la calzada y salirse de la misma siempre que
    haya suficiente espacio para un desvío seguro.
- id: 315
  category: safe_driving_rules
  question: A 50 mph en pavimento seco con buenos neumáticos y frenos, ¿aproximadamente
    qué distancia se necesita para reaccionar y detener su vehículo por completo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: D
  explanation: El manual establece que a 50 mph, puede tomar unos 400 pies reaccionar
    ante algo que ve y detener su vehículo, lo cual es aproximadamente la longitud
    de una cuadra de la ciudad.
- id: 316
  category: safe_driving_rules
  question: Si conduce a 30 mph, ¿aproximadamente cuántos pies le tomará detener su
    vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 400 pies
  answer: C
  explanation: A 30 mph, puede tomar unos 200 pies detenerse, lo que es casi la mitad
    de una cuadra de la ciudad.
- id: 317
  category: driver_responsibility
  question: Según el manual, ¿cuál es la causa de nueve de cada diez choques?
  choices:
    A: Falla mecánica
    B: Errores en el juicio humano
    C: Malas condiciones climáticas
    D: Calzadas defectuosas
  answer: B
  explanation: El manual establece explícitamente que nueve de cada diez choques son
    causados por errores en el juicio humano.
- id: 318
  category: safe_driving_rules
  question: Al conducir de noche, debe poder detenerse dentro de la distancia que
    puede ver hacia adelante con sus faros delanteros. ¿Aproximadamente qué distancia
    es esta?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: C
  explanation: Debe poder detenerse dentro de la distancia que puede ver hacia adelante
    con sus faros delanteros, que es de unos 400 pies.
- id: 319
  category: defensive_driving
  question: Con lluvia intensa, nieve o niebla espesa, su visibilidad puede reducirse
    a 200 pies. ¿Cuál es la velocidad máxima segura bajo estas condiciones?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: Cuando no puede ver a más de 200 pies de distancia debido a la lluvia
    intensa, la nieve o la niebla, no puede conducir de manera segura a más de 30
    mph.
- id: 320
  category: defensive_driving
  question: ¿Cuál es la causa más común de choques entre autos estacionados en paralelo
    y autos que circulan por la calle?
  choices:
    A: Exceso de velocidad por parte del conductor en la calle
    B: Descuido del conductor que se retira de la acera
    C: Puertas que se abren hacia el tráfico
    D: Peatones que caminan entre los autos
  answer: B
  explanation: La mayoría de los choques entre autos que están estacionados en paralelo
    y autos que circulan por la calle son causados por el descuido del conductor que
    se retira de la acera.
- id: 321
  category: safe_driving_rules
  question: ¿Qué regla debe utilizar para saber si está conduciendo demasiado rápido
    para su distancia de visibilidad?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de los cuatro segundos de distancia de visibilidad
    D: La regla de los diez segundos
  answer: C
  explanation: Para saber si está conduciendo demasiado rápido para las condiciones,
    utilice la 'Regla de los cuatro segundos de distancia de visibilidad'. Si llega
    a un objeto fijo antes de terminar de contar cuatro segundos, va demasiado rápido.
- id: 322
  category: penalties_and_points
  question: ¿Puede recibir una multa por conducir por debajo del límite de velocidad
    indicado?
  choices:
    A: No, siempre que esté por debajo del límite
    B: Sí, si viaja demasiado rápido para las condiciones, como carreteras mojadas
      o con hielo
    C: Sí, pero solo en zonas escolares
    D: No, los límites de velocidad son mínimos absolutos
  answer: B
  explanation: Incluso si conduce por debajo del límite de velocidad indicado, puede
    recibir una multa por circular demasiado rápido en condiciones tales como carreteras
    mojadas o con hielo, poca visibilidad o tráfico denso.
- id: 323
  category: safe_driving_rules
  question: ¿Cuál es la regla estándar para determinar una distancia de seguimiento
    segura para evitar choques por alcance?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de los cuatro segundos
    D: La regla de la longitud de un vehículo
  answer: B
  explanation: Existe una forma sencilla de saber si está siguiendo a alguien demasiado
    de cerca. Se llama la 'Regla de los tres segundos' y funciona a cualquier velocidad.
- id: 324
  category: sharing_the_road
  question: ¿En cuál de las siguientes situaciones debe aumentar su distancia de seguimiento
    a cuatro segundos?
  choices:
    A: Al conducir sobre pavimento seco
    B: Al seguir a una motocicleta
    C: Al conducir en una zona residencial
    D: Al adelantar a un ciclista
  answer: B
  explanation: Necesita una distancia de seguimiento de cuatro segundos cuando sigue
    a motocicletas, porque si la motocicleta llegara a caerse, necesita una distancia
    adicional para evitar al conductor.
- id: 325
  category: defensive_driving
  question: ¿Qué debe hacer si alguien lo sigue demasiado de cerca (tailgating) y
    no hay un carril derecho al cual moverse?
  choices:
    A: Pisar los frenos rápidamente para advertir al conductor
    B: Acelerar para aumentar la distancia
    C: Esperar hasta que el camino esté despejado y reducir la velocidad lentamente
    D: Encender las luces de emergencia y detenerse en el carril
  answer: C
  explanation: Si lo siguen demasiado de cerca y no hay un carril derecho, espere
    hasta que el camino esté despejado y luego reduzca la velocidad lentamente para
    animar al conductor de atrás a que lo adelante. Nunca reduzca la velocidad bruscamente.
- id: 326
  category: defensive_driving
  question: ¿Por qué debe dejar un espacio adicional cuando se detiene en una colina
    detrás de otro vehículo?
  choices:
    A: Para permitir que los peatones crucen entre los vehículos
    B: El vehículo de adelante puede rodar hacia atrás al arrancar
    C: Para tener espacio para dar una vuelta en U
    D: Para evitar que los gases de escape entren en su automóvil
  answer: B
  explanation: Debe dejar un espacio adicional cuando se detiene en una colina porque
    el vehículo de adelante puede rodar hacia atrás al arrancar.
- id: 327
  category: defensive_driving
  question: 'Para mantener un espacio seguro a los lados de su vehículo en una carretera
    de varios carriles, debe:'
  choices:
    A: Conducir justo al lado de otros vehículos para bloquear el viento
    B: Acercarse demasiado a la línea central
    C: Evitar conducir al lado de otros vehículos adelantándose o quedándose atrás
    D: Zigzaguear entre carriles para mantener alerta a los demás conductores
  answer: C
  explanation: Debe evitar conducir al lado de otros vehículos en carreteras de varios
    carriles porque alguien podría invadir su carril o intentar cambiar de carril.
    Adelántese o quédese detrás del otro vehículo.
- id: 328
  category: safe_driving_rules
  question: ¿Cuál de los siguientes se considera un 'punto problemático' donde su
    espacio para maniobrar es limitado y necesita reducir su velocidad?
  choices:
    A: Plazas de peaje
    B: Autopistas abiertas
    C: Carreteras rurales de dos carriles
    D: Carriles de adelantamiento en la interestatal
  answer: A
  explanation: Las plazas de peaje se enumeran como puntos problemáticos donde los
    vehículos cambian de carril, se preparan para detenerse y aceleran de nuevo, lo
    que requiere que usted reduzca su velocidad.
- id: 329
  category: defensive_driving
  question: ¿Qué debe hacer para evitar conducir al lado de otros vehículos en carreteras
    de varios carriles?
  choices:
    A: Tocar la bocina para advertirles de su presencia.
    B: Adelantarse o quedarse detrás del otro vehículo.
    C: Conducir por el arcén (hombro) de la carretera.
    D: Desviarse ligeramente hacia su carril para animarlos a moverse.
  answer: B
  explanation: El manual aconseja evitar conducir al lado de otros vehículos en carreteras
    de varios carriles adelantándose o quedándose detrás del otro vehículo, evitando
    que invadan su carril.
- id: 330
  category: defensive_driving
  question: ¿Qué significa la 'Regla de dividir la diferencia' cuando se enfrenta
    a dos peligros?
  choices:
    A: Acelerar para pasar ambos peligros lo más rápido posible.
    B: Salirse completamente de la carretera y esperar a que pasen ambos peligros.
    C: Dirigirse por un camino intermedio entre los peligros, dejando un poco más
      de espacio del lado del peligro más grave.
    D: Conducir lo más cerca posible del peligro menor para evitar el mayor.
  answer: C
  explanation: La 'Regla de dividir la diferencia' significa dirigir un curso intermedio
    entre dos peligros. Si uno es más peligroso, debe dejar un poco más de espacio
    en el lado del peligro.
- id: 331
  category: safe_driving_rules
  question: ¿Qué tan grande debe ser el espacio que necesita cada vez que desee incorporarse
    al tráfico, cambiar de carril o entrar en una carretera?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: Necesita un espacio de aproximadamente cuatro segundos cada vez que
    desee incorporarse al tráfico, cambiar de carril, entrar en una carretera o cuando
    su carril se incorpore a otro carril de circulación.
- id: 332
  category: safe_driving_rules
  question: Si desea cruzar varios carriles de tráfico, ¿cuál es la forma más segura
    de hacerlo?
  choices:
    A: Cruzar todos los carriles a la vez para minimizar su tiempo en la intersección.
    B: Esperar hasta que todos los carriles estén completamente despejados antes de
      moverse.
    C: Acelerar y cruzar en un ángulo agudo.
    D: Cruzarlos uno a la vez, incorporándose a un carril a la vez.
  answer: D
  explanation: Si desea cruzar varios carriles, hágalo uno a la vez. Es más seguro
    y fácil incorporarse a un carril a la vez, al igual que subir o bajar escaleras
    un escalón a la vez.
- id: 333
  category: safe_driving_rules
  question: ¿Qué debe hacer si tiene la luz verde pero hay vehículos bloqueando la
    intersección más adelante?
  choices:
    A: Avanzar hacia la intersección y esperar a que se muevan.
    B: No comenzar a cruzar la intersección hasta que el camino esté despejado.
    C: Tocar la bocina hasta que la intersección se despeje.
    D: Maniobrar alrededor de los vehículos que bloquean usando el paso de peatones.
  answer: B
  explanation: Incluso si tiene la luz verde, no comience a cruzar la intersección
    si hay autos bloqueando su camino. Si se queda atrapado en la intersección cuando
    la luz cambia a rojo, bloqueará el tráfico y podría recibir una multa.
- id: 334
  category: sharing_the_road
  question: ¿Por qué no debe girar solo porque una motocicleta que se aproxima tiene
    encendida una señal de giro?
  choices:
    A: Las motocicletas no están obligadas legalmente a usar señales de giro.
    B: Las motocicletas siempre giran desde el carril central.
    C: Las señales de las motocicletas a menudo no se cancelan por sí solas.
    D: Es probable que la motocicleta esté señalizando para rebasar, no para girar.
  answer: C
  explanation: No gire solo porque un vehículo que se aproxima tenga encendida una
    señal de giro. Esto es particularmente cierto en el caso de las motocicletas porque
    sus señales a menudo no se cancelan por sí solas. Espere hasta que el conductor
    realmente comience a girar.
- id: 335
  category: safe_driving_rules
  question: A una velocidad de 55 mph, ¿aproximadamente cuántos segundos necesita
    para rebasar a otro vehículo de manera segura?
  choices:
    A: 4 segundos
    B: 7 segundos
    C: 10 segundos
    D: 15 segundos
  answer: C
  explanation: Como regla general, a una velocidad de 55 mph, necesita unos 10 segundos
    para rebasar. Eso significa que necesita un espacio de 10 segundos en el tráfico
    que viene en sentido contrario.
- id: 336
  category: safe_driving_rules
  question: A 55 mph, ¿cuánta distancia necesita para rebasar de forma segura a otro
    vehículo?
  choices:
    A: Más de 1600 pies o aproximadamente un tercio de milla
    B: 800 pies o aproximadamente un sexto de milla
    C: 500 pies
    D: Una milla completa
  answer: A
  explanation: A 55 mph, usted recorrerá más de 800 pies en 10 segundos, al igual
    que un vehículo que viene en sentido contrario. Por lo tanto, necesita más de
    1600 pies o aproximadamente un tercio de milla para rebasar de manera segura.
- id: 337
  category: safe_driving_rules
  question: ¿No debe comenzar a rebasar a un vehículo si se encuentra a qué distancia
    de una colina o una curva?
  choices:
    A: Un cuarto de milla
    B: Un tercio de milla
    C: Media milla
    D: Una milla
  answer: B
  explanation: Debe tratar una curva o una colina como lo hace con un vehículo que
    viene en sentido contrario. Esto significa que no debe comenzar a rebasar si se
    encuentra a menos de un tercio de milla de una colina o una curva.
- id: 338
  category: safe_driving_rules
  question: ¿Cuándo es seguro regresar al carril de circulación después de rebasar
    a otro vehículo?
  choices:
    A: Cuando esté a la distancia de un vehículo por delante del vehículo rebasado.
    B: Cuando el conductor al que rebasó parpadee sus faros delanteros.
    C: Cuando pueda ver ambos faros delanteros del vehículo que acaba de rebasar en
      su espejo retrovisor.
    D: Tan pronto como su parachoques trasero pase el parachoques delantero del vehículo
      rebasado.
  answer: C
  explanation: Antes de regresar al carril de circulación, asegúrese de dejar suficiente
    espacio. Cuando pueda ver ambos faros delanteros del vehículo que acaba de rebasar
    en su espejo retrovisor, es seguro regresar al carril de circulación.
- id: 339
  category: sharing_the_road
  question: ¿Qué es ilegal hacer al acercarse o rebasar a un caballo que está siendo
    montado o guiado por una carretera?
  choices:
    A: Reducir la velocidad
    B: Detenerse si el jinete le indica que lo haga
    C: Tocar la bocina
    D: Dejar mucho espacio
  answer: C
  explanation: La ley exige que tenga el debido cuidado al acercarse a un caballo.
    Es ilegal tocar la bocina al acercarse o rebasar a un caballo.
- id: 340
  category: defensive_driving
  question: Si otro conductor comete un error, como rebasarlo cuando no tiene suficiente
    espacio, ¿qué debe hacer?
  choices:
    A: Acelerar para evitar que entre en su carril.
    B: Tocar la bocina y mantener su velocidad.
    C: Reducir la velocidad y dejar que regrese al carril de circulación de manera
      segura.
    D: Virar bruscamente hacia el carril contrario para darle espacio.
  answer: C
  explanation: Si otro conductor comete un error, no lo empeore. Por ejemplo, si un
    conductor lo rebasa cuando no tiene suficiente espacio, reduzca la velocidad y
    deje que regrese al carril de circulación.
- id: 341
  category: sharing_the_road
  question: ¿Cómo debe compartir un carril con un peatón o un ciclista?
  choices:
    A: Conduzca lo más cerca posible de la línea central mientras permanece en el
      mismo carril.
    B: Toque la bocina para avisarles que está pasando en el mismo carril.
    C: No comparta el carril con un peatón o ciclista; espere hasta que sea seguro
      rebasar en el carril contiguo.
    D: Acelere para pasarlos rápidamente en el mismo carril.
  answer: C
  explanation: 'El manual establece: ''No comparta el carril con un peatón o ciclista.
    Espere hasta que sea seguro rebasar en el carril contiguo''.'
- id: 342
  category: safe_driving_rules
  question: Al cruzar el tráfico, ¿cuándo se considera seguro detenerse a mitad del
    camino?
  choices:
    A: Siempre que haya un espacio en el tráfico desde la izquierda.
    B: Solo cuando haya un divisor central (mediana) lo suficientemente grande como
      para que quepa todo su vehículo.
    C: Cuando esté girando a la izquierda y el semáforo cambie a amarillo.
    D: Nunca es seguro detenerse a mitad de una carretera.
  answer: B
  explanation: Detenerse a mitad del camino solo es seguro cuando hay un divisor central
    lo suficientemente grande como para que quepa su automóvil. No se detenga en un
    divisor donde parte de su vehículo sobresalga hacia el tráfico.
- id: 343
  category: defensive_driving
  question: ¿Qué debe hacer si otro conductor intenta rebasarlo pero no tiene suficiente
    espacio?
  choices:
    A: Acelere para apartarse de su camino.
    B: Toque la bocina y mantenga su velocidad.
    C: Reduzca la velocidad y permítales regresar al carril de circulación de manera
      segura.
    D: Muévase hacia el arcén y deténgase por completo.
  answer: C
  explanation: El manual establece que si otro conductor comete un error, como rebasar
    cuando no tiene suficiente espacio, usted debe reducir la velocidad y permitirle
    regresar al carril de circulación de manera segura.
- id: 344
  category: safe_driving_rules
  question: ¿Qué debe hacer al conducir al anochecer o en días nublados?
  choices:
    A: Conduzca con las luces intermitentes de emergencia encendidas.
    B: Encienda las luces de su vehículo.
    C: Conduzca con las luces de estacionamiento encendidas.
    D: No encender ninguna luz del vehículo.
  answer: B
  explanation: Según el cuestionario del Capítulo 5 del manual, al anochecer o en
    días nublados, debe encender las luces de su vehículo.
- id: 345
  category: sharing_the_road
  question: ¿Por qué debe tener precaución al rebasar una bicicleta?
  choices:
    A: Las bicicletas siempre tienen el derecho de paso.
    B: El ciclista puede tener que desviarse hacia el tráfico para evitar un objeto
      en la carretera.
    C: Se requiere que las bicicletas circulen por la acera.
    D: El tráfico que viene en sentido contrario no puede ver las bicicletas.
  answer: B
  explanation: El manual señala que debe tener precaución al rebasar una bicicleta
    porque el ciclista puede tener que desviarse hacia el tráfico para evitar un objeto
    en la carretera.
- id: 346
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente,
    ¿qué tan adelante en la carretera debe mirar?
  choices:
    A: 2 segundos por delante de su vehículo.
    B: 4 segundos por delante de su vehículo.
    C: 10 segundos por delante de su vehículo.
    D: 15 segundos por delante de su vehículo.
  answer: C
  explanation: El cuestionario del Capítulo 5 establece que para evitar frenar a último
    momento, o la necesidad de girar, debe mirar hacia adelante en la carretera al
    menos 10 segundos por delante de su vehículo.
- id: 347
  category: safe_driving_rules
  question: ¿Cuál de las siguientes opciones describe mejor el "hidroplaneo" (hydroplaning)?
  choices:
    A: Sus neumáticos empujando el agua fuera de su camino.
    B: Sus neumáticos lanzando agua hacia atrás, causando problemas a los vehículos
      que lo siguen.
    C: Sus neumáticos flotando realmente sobre una capa de agua.
    D: Su vehículo deslizándose sobre hielo negro.
  answer: C
  explanation: El manual describe el "hidroplaneo" como el momento en que sus neumáticos
    flotan realmente sobre una capa de agua.
- id: 348
  category: license_system
  question: ¿Cuál es el requisito mínimo de visión para aprobar el examen de la vista
    de la licencia de conducir de Montana?
  choices:
    A: Visión 20/20 en ambos ojos.
    B: Visión 20/30 en al menos un ojo.
    C: Visión 20/40 en al menos un ojo.
    D: Visión 20/50 en ambos ojos.
  answer: C
  explanation: Montana requiere que apruebe un examen de la vista que mida al menos
    una visión de 20/40 en al menos un ojo, con o sin lentes correctivos.
- id: 349
  category: penalties_and_points
  question: ¿Qué podría suceder si su licencia de conducir indica que debe usar lentes
    correctivos, pero lo detienen mientras conduce sin ellos?
  choices:
    A: Se le dará una advertencia.
    B: Podría recibir una multa.
    C: Su vehículo será confiscado.
    D: Su licencia será revocada permanentemente.
  answer: B
  explanation: 'El manual establece: "Si su licencia de conducir dice que debe usar
    lentes correctivos y no los usa y resulta que lo detienen, podría recibir una
    multa".'
- id: 350
  category: safe_driving_rules
  question: ¿Por qué debe evitar el uso de gafas oscuras o lentes de contacto teñidos
    al conducir de noche?
  choices:
    A: Pueden hacer que se quede dormido más rápido.
    B: Reflejan los faros que vienen en sentido contrario hacia sus ojos.
    C: Reducen demasiada luz que usted necesita para ver con claridad.
    D: Es ilegal usarlos en cualquier momento mientras se conduce.
  answer: C
  explanation: Debe evitar el uso de gafas oscuras o lentes de contacto teñidos por
    la noche porque reducen demasiada luz que usted necesita para ver con claridad.
- id: 351
  category: driver_responsibility
  question: ¿Cómo se comparan los expedientes de conducción de los conductores con
    discapacidad auditiva con los de los conductores con buena audición?
  choices:
    A: Son significativamente peores debido a la incapacidad de oír las sirenas.
    B: Son tan buenos como los de los conductores con buena audición.
    C: Tienen más accidentes menores pero menos choques fatales.
    D: Son mejores porque conducen a velocidades más lentas.
  answer: B
  explanation: Los estudios han demostrado que los expedientes de conducción de los
    conductores con discapacidad auditiva son tan buenos como los de los conductores
    con buena audición, ya que aprenden a confiar más en su visión y a mantenerse
    alerta.
- id: 352
  category: driver_responsibility
  question: Para ayudar a prevenir la fatiga en un viaje largo, ¿con qué frecuencia
    debe tomar un descanso?
  choices:
    A: Cada hora.
    B: Aproximadamente cada dos horas.
    C: Cada cuatro horas.
    D: Solo cuando necesite reabastecer combustible a su vehículo.
  answer: B
  explanation: Para prevenir la fatiga, el manual recomienda tomar descansos deteniéndose
    aproximadamente cada dos horas, o cuando lo necesite.
- id: 353
  category: alcohol_drugs_health
  question: ¿Aproximadamente qué porcentaje de los choques fatales involucran alcohol?
  choices:
    A: 10%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: El manual establece que el alcohol está involucrado en aproximadamente
    el 40% de los choques fatales.
- id: 354
  category: alcohol_drugs_health
  question: ¿Qué tan rápido puede el alcohol afectar su cerebro después de ser consumido?
  choices:
    A: En un minuto.
    B: En quince minutos.
    C: En treinta minutos.
    D: En una hora.
  answer: A
  explanation: El alcohol puede ser absorbido a través de las paredes del estómago
    y puede afectar su cerebro en un minuto.
- id: 355
  category: alcohol_drugs_health
  question: ¿Por qué los conductores nuevos se ven más afectados por el alcohol que
    los conductores experimentados?
  choices:
    A: Los conductores nuevos suelen consumir mayores cantidades de alcohol.
    B: Los conductores nuevos tienen reflejos naturales más lentos.
    C: Los conductores nuevos todavía están aprendiendo a conducir.
    D: Los conductores nuevos tienen más probabilidades de conducir de noche.
  answer: C
  explanation: Los conductores nuevos se ven más afectados por el alcohol que los
    conductores experimentados porque los conductores nuevos todavía están aprendiendo
    a conducir.
- id: 356
  category: defensive_driving
  question: Juzgar las distancias y las velocidades es especialmente importante al
    realizar ¿cuál de las siguientes maniobras?
  choices:
    A: Estacionarse en paralelo en una calle de un solo sentido.
    B: Incorporarse y rebasar en carreteras de dos carriles.
    C: Detenerse en una intersección de cuatro vías.
    D: Ceder el paso a los peatones en un cruce de peatones.
  answer: B
  explanation: El manual establece que juzgar las distancias y las velocidades es
    especialmente importante para saber qué tan lejos se encuentra de otros vehículos
    y juzgar los espacios seguros al incorporarse y al rebasar en carreteras de dos
    carriles.
- id: 357
  category: alcohol_drugs_health
  question: En promedio, ¿cuánto tiempo le toma al cuerpo de una persona procesar
    una bebida alcohólica?
  choices:
    A: 30 minutos
    B: Una hora
    C: Dos horas
    D: Cuatro horas
  answer: B
  explanation: El cuerpo de una persona promedio procesará una bebida alcohólica en
    una hora. El alcohol aún puede acumularse si bebe a un ritmo de una bebida por
    hora.
- id: 358
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes se considera equivalente a una bebida alcohólica
    estándar?
  choices:
    A: 16 onzas de cerveza comercial
    B: 8 onzas de vino
    C: 1-1/2 onzas de licor de 80 grados (80-proof)
    D: 3 onzas de licor de 80 grados (80-proof)
  answer: C
  explanation: Una bebida alcohólica se define como 1-1/2 onzas de licor de 80 grados
    (80-proof), 12 onzas de cerveza comercial o una copa de vino de 5 onzas.
- id: 359
  category: penalties_and_points
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    un conductor menor de 21 años en Montana?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: B
  explanation: El límite de BAC para un conductor menor de 21 años es de 0.02%.
- id: 360
  category: penalties_and_points
  question: Usted puede ser arrestado por conducir bajo la influencia (DUI) si su
    concentración de alcohol en sangre (BAC) es igual o superior a ¿qué porcentaje?
  choices:
    A: 0.04%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Usted puede ser arrestado por conducir con una concentración de alcohol
    en sangre (BAC) de 0.08% o más, o mientras conduce bajo la influencia (DUI).
- id: 361
  category: penalties_and_points
  question: ¿Cuál es la sanción si se niega a realizar una prueba de concentración
    de alcohol en sangre (BAC) cuando se lo solicita un oficial de policía?
  choices:
    A: Recibirá una advertencia.
    B: Puede perder su licencia de conducir.
    C: Se le multará exactamente con $50.
    D: Debe asistir a un curso de conducción defensiva.
  answer: B
  explanation: Si un oficial de policía le pide que se realice una prueba, debe hacerlo.
    Puede perder su licencia de conducir si se niega a realizar una prueba de BAC.
- id: 362
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una posible sanción por una primera condena
    por una infracción relacionada con el alcohol?
  choices:
    A: Una multa de $100 a $200
    B: Suspensión de la licencia por un año
    C: De 1 a 60 días de cárcel
    D: Revocación permanente de su licencia
  answer: C
  explanation: Si se le declara culpable de una infracción por alcohol y es su primera
    condena, podría ser sentenciado a entre 1 y 60 días de cárcel, multado con $300
    a $1000 y se le suspendería la licencia por seis meses.
- id: 363
  category: safe_driving_rules
  question: ¿Dónde es legal llevar un recipiente de bebida alcohólica abierto en un
    vehículo motorizado?
  choices:
    A: En el portavasos de la consola central
    B: Debajo del asiento del conductor
    C: En el regazo del pasajero
    D: En una guantera cerrada con llave
  answer: D
  explanation: Los recipientes abiertos de bebidas alcohólicas deben guardarse en
    una guantera cerrada con llave, en el maletero, en el compartimento de carga o
    detrás del último asiento vertical si no hay maletero.
- id: 364
  category: driver_responsibility
  question: ¿Qué información debe proporcionar al llamar al programa "Report A Drunk
    Driver" (Reportar a un conductor ebrio)?
  choices:
    A: El nombre completo y la dirección del conductor
    B: Una descripción del vehículo y la dirección en la que viaja
    C: Su propio número de licencia de conducir
    D: Evidencia fotográfica del conductor
  answer: B
  explanation: Se pide a los ciudadanos que llamen a su agencia local de aplicación
    de la ley o a la Patrulla de Caminos de Montana y den una descripción del vehículo
    y la dirección en la que viaja el vehículo sospechoso.
- id: 365
  category: alcohol_drugs_health
  question: ¿Qué significa para los conductores una advertencia de medicamento sobre
    "operar maquinaria pesada"?
  choices:
    A: Puede conducir un automóvil, pero no un camión comercial.
    B: Solo debe conducir durante las horas del día.
    C: No conduzca su automóvil o camión.
    D: Debe conducir al menos 10 mph por debajo del límite de velocidad.
  answer: C
  explanation: Las advertencias de medicamentos sobre operar maquinaria pesada significan
    NO CONDUZCA SU AUTOMÓVIL O CAMIÓN.
- id: 366
  category: alcohol_drugs_health
  question: Según el manual, ¿cómo afecta el consumo de marihuana a la conducción?
  choices:
    A: Mejora la visión nocturna.
    B: Hace que los conductores tengan reflejos más lentos y problemas para adaptarse
      al resplandor.
    C: Aumenta el estado de alerta y la concentración.
    D: No tiene efecto si se usa con una receta médica.
  answer: B
  explanation: Los estudios han demostrado que las personas que consumen marihuana,
    incluso con receta médica, cometen más errores, tienen reflejos más lentos y tienen
    más problemas para adaptarse al resplandor.
- id: 367
  category: alcohol_drugs_health
  question: ¿Qué se requiere para que una persona que padece epilepsia pueda operar
    un vehículo motorizado de manera segura?
  choices:
    A: Deben usar gafas de sol en todo momento.
    B: Necesitan que un médico certifique por escrito que su condición se ha estabilizado.
    C: Solo se les permite conducir durante las horas del día.
    D: Deben realizar un examen de conducir cada seis meses.
  answer: B
  explanation: Una persona que padece epilepsia necesita que un médico certifique
    por escrito que la condición de la persona se ha estabilizado y que no es probable
    que interfiera con la capacidad de la persona para operar un vehículo motorizado
    de manera segura.
- id: 368
  category: alcohol_drugs_health
  question: ¿Por qué los diabéticos que toman insulina deben tener precaución al conducir?
  choices:
    A: La insulina causa somnolencia inmediata.
    B: Podrían entrar en shock por saltarse una comida o tomar la cantidad incorrecta
      de insulina.
    C: La insulina deteriora permanentemente la visión periférica.
    D: Se les exige legalmente tener una licencia de conducir especializada.
  answer: B
  explanation: Los diabéticos que toman insulina no deben conducir cuando exista alguna
    posibilidad de entrar en shock. Tal situación podría resultar de saltarse una
    comida o refrigerio, o de tomar la cantidad incorrecta de insulina.
- id: 369
  category: driver_responsibility
  question: ¿Qué debe hacer si está enojado o emocionado antes de conducir?
  choices:
    A: Conducir más rápido para llegar antes a su destino.
    B: Subir el volumen de la radio para ahogar sus pensamientos.
    C: Darse tiempo para calmarse y mantenerse fuera de la carretera hasta que se
      haya tranquilizado.
    D: Bajar las ventanillas para que entre aire fresco mientras conduce.
  answer: C
  explanation: Si está enojado o emocionado, dese tiempo para calmarse. Si es necesario,
    dé un paseo corto, pero manténgase fuera de la carretera hasta que se haya tranquilizado.
- id: 370
  category: alcohol_drugs_health
  question: ¿Qué cambios físicos suelen desarrollarse gradualmente en los conductores
    de edad avanzada que pueden afectar su capacidad para manejar emergencias?
  choices:
    A: Aumento de la impulsividad y la agresión.
    B: Deterioro de la visión, la audición y el tiempo de reacción.
    C: Aparición repentina de epilepsia.
    D: Aumento de la tolerancia al alcohol.
  answer: B
  explanation: El deterioro de la visión, la audición y el tiempo de reacción se desarrolla
    casi sin notarse hasta que nos encontramos ante una emergencia que ya no estamos
    equipados para manejar.
- id: 371
  category: safe_driving_rules
  question: ¿En términos de millas recorridas, la tasa de accidentes de los conductores
    de 65 años o más es superada únicamente por qué grupo de edad?
  choices:
    A: Conductores de 25 a 35 años
    B: Conductores menores de 24 años
    C: Conductores de 40 a 50 años
    D: Conductores de 55 a 64 años
  answer: B
  explanation: Según el manual, la tasa de accidentes de los conductores de 65 años
    o más, en términos de millas recorridas, es superada únicamente por la tasa de
    los conductores menores de 24 años.
- id: 372
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un error reportado con frecuencia cometido
    por conductores mayores?
  choices:
    A: Conducir demasiado rápido para las condiciones
    B: Seguir muy de cerca a otros vehículos
    C: Conducir excesivamente lento en autopistas transitadas
    D: Cambios de carril excesivos
  answer: C
  explanation: Los errores reportados con frecuencia cometidos por conductores mayores
    incluyen la falta de atención, no conducir en el carril adecuado, no señalizar
    o no respetar las señales de alto y semáforos, y conducir excesivamente lento
    en autopistas transitadas.
- id: 373
  category: license_system
  question: Si un conductor decide renunciar a su privilegio de conducir y entrega
    su licencia más de seis meses antes de que expire, ¿qué es elegible para recibir?
  choices:
    A: Un reembolso parcial de la tarifa de su licencia
    B: Un pase de autobús gratuito de por vida
    C: Una tarjeta de identificación sin cargo
    D: Una licencia de conducir restringida
  answer: C
  explanation: Si entrega su licencia antes de que sea elegible para renovación (más
    de seis meses antes de que expire), puede recibir una tarjeta de identificación
    sin cargo.
- id: 374
  category: safe_driving_rules
  question: Para ayudar a aliviar la fatiga en un viaje largo, ¿qué es una buena idea
    hacer?
  choices:
    A: Beber una gran cantidad de cafeína
    B: Detenerse para descansar cada dos horas
    C: Conducir con un solo ojo abierto a la vez
    D: Cambiar de pie en el pedal del acelerador
  answer: B
  explanation: El cuestionario del Capítulo 6 confirma que para ayudar a aliviar la
    fatiga en un viaje, es una buena idea detenerse para descansar cada dos horas.
- id: 375
  category: alcohol_drugs_health
  question: ¿Cuál es la razón principal por la que beber alcohol y luego conducir
    es tan peligroso?
  choices:
    A: Lo hace excesivamente cauteloso
    B: Mejora sus reflejos pero nubla su visión
    C: Afecta su juicio y habilidad
    D: Causa una falla repentina del motor
  answer: C
  explanation: El cuestionario del Capítulo 6 señala que la razón principal por la
    que beber alcohol y luego conducir es tan peligroso es que afecta su juicio y
    habilidad.
- id: 376
  category: driver_responsibility
  question: ¿Cómo puede el estrés afectar su conducción?
  choices:
    A: Al hacerlo más consciente de los demás a su alrededor
    B: Al disminuir sus posibilidades de un accidente
    C: Al disminuir su concentración en la tarea de conducir
    D: Al mejorar su destreza física
  answer: C
  explanation: Según el cuestionario del Capítulo 6, el estrés puede afectar su conducción
    al disminuir su concentración en la tarea de conducir.
- id: 377
  category: alcohol_drugs_health
  question: ¿Cuál es la causa número uno de muertes en las carreteras de Montana?
  choices:
    A: Carreteras en mal estado o descuidadas
    B: Clima inclemente/condiciones de conducción adversas
    C: Velocidad excesiva
    D: Conductores ebrios
  answer: D
  explanation: El cuestionario del Capítulo 6 identifica a los conductores ebrios
    como la causa número uno de muertes en las carreteras de Montana.
- id: 378
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si sus frenos dejan de funcionar repentinamente?
  choices:
    A: Cambiar a punto muerto (neutral) y avanzar por inercia
    B: Bombear el pedal del freno varias veces
    C: Tirar del freno de estacionamiento con todas sus fuerzas
    D: Apagar el motor inmediatamente
  answer: B
  explanation: Si sus frenos dejan de funcionar, el manual aconseja bombear primero
    el pedal del freno varias veces, ya que esto a menudo genera suficiente presión
    de frenado para permitirle detenerse.
- id: 379
  category: defensive_driving
  question: Al usar el freno de estacionamiento para detener un vehículo después de
    una falla de los frenos regulares, ¿por qué debe tirar de la palanca lentamente?
  choices:
    A: Para evitar romper la palanca
    B: Para evitar que el motor se apague
    C: Para evitar bloquear las ruedas traseras y causar un derrape
    D: Para activar el sistema de frenos antibloqueo (ABS)
  answer: C
  explanation: El manual indica tirar de la palanca del freno de estacionamiento lentamente
    para no bloquear las ruedas traseras y causar un derrape.
- id: 380
  category: defensive_driving
  question: ¿Cuál es la respuesta adecuada si un neumático se desinfla repentinamente
    mientras conduce?
  choices:
    A: Frenar bruscamente y orillarse inmediatamente
    B: Sujetar el volante con firmeza, seguir recto y reducir la velocidad gradualmente
    C: Acelerar ligeramente para mantener el control del vehículo
    D: Girar el volante bruscamente hacia el lado del reventón
  answer: B
  explanation: Si un neumático se desinfla repentinamente, debe sujetar el volante
    con firmeza, mantener el vehículo recto y reducir la velocidad gradualmente quitando
    el pie del acelerador y usando los frenos ligeramente.
- id: 381
  category: vehicle_information
  question: ¿Qué debe esperar si su vehículo experimenta una falla de energía y el
    motor se apaga mientras conduce?
  choices:
    A: El volante se bloqueará por completo
    B: Los frenos dejarán de funcionar por completo
    C: El volante será difícil de girar y es posible que deba presionar el pedal del
      freno con mucha fuerza
    D: El vehículo cambiará automáticamente a la posición de estacionamiento (park)
  answer: C
  explanation: Durante una falla de energía, el manual indica que el volante puede
    ser difícil de girar y, aunque los frenos seguirán funcionando, es posible que
    deba presionar el pedal del freno con mucha fuerza.
- id: 382
  category: defensive_driving
  question: ¿Qué debe hacer si sus faros delanteros se apagan repentinamente mientras
    conduce de noche y el interruptor de los faros y las luces altas no funcionan?
  choices:
    A: Continuar conduciendo lentamente usando la luz de la luna
    B: Encender las luces intermitentes de emergencia, las luces de giro o las luces
      antiniebla
    C: Detenerse inmediatamente en medio de la carretera
    D: Cerrar los ojos y frenar con fuerza
  answer: B
  explanation: Si intentar con el interruptor de los faros y las luces altas no funciona,
    el manual aconseja encender las luces intermitentes de emergencia, las luces de
    giro o las luces antiniebla si las tiene, y salir de la carretera tan pronto como
    sea posible de manera segura.
- id: 383
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si el pedal del acelerador se queda
    pegado y el motor sigue acelerando cada vez más?
  choices:
    A: Apagar el encendido inmediatamente
    B: Cambiar a reversa
    C: Cambiar rápidamente a neutral y aplicar una presión constante sobre el freno
    D: Bombear el pedal del freno rápidamente
  answer: C
  explanation: Si el pedal del acelerador se queda pegado, debe mantener la vista
    en la carretera, cambiar rápidamente a neutral, aplicar una presión constante
    sobre el freno y salir de la carretera.
- id: 384
  category: defensive_driving
  question: Si las ruedas derechas de su vehículo se salen del pavimento, ¿cómo debe
    regresar a la carretera de manera segura?
  choices:
    A: Girar el volante bruscamente hacia la izquierda
    B: Frenar con fuerza y detenerse en el acotamiento
    C: Quitar el pie del acelerador, dirigir el vehículo paralelamente a la carretera
      y regresar suavemente cuando haya disminuido la velocidad
    D: Acelerar para ganar tracción antes de volver a la carretera
  answer: C
  explanation: Si se sale de la carretera, quite el pie del acelerador y dirija el
    vehículo paralelamente a la carretera. Cuando haya disminuido la velocidad, regrese
    suavemente a la carretera cuando sea seguro con un pequeño giro de un cuarto hacia
    la izquierda.
- id: 385
  category: safe_driving_rules
  question: ¿Qué es lo primero que debe hacer si las ruedas derechas de su vehículo
    se salen del pavimento?
  choices:
    A: Frenar con fuerza inmediatamente
    B: Quitar el pie del acelerador y dirigir el vehículo paralelamente a la carretera
    C: Girar el volante bruscamente hacia la izquierda
    D: Acelerar para recuperar la tracción
  answer: B
  explanation: El manual establece que si las ruedas derechas de su vehículo se salen
    del pavimento, debe quitar el pie del acelerador y dirigir el vehículo paralelamente
    a la carretera, frenando solo cuando esté de regreso en el pavimento.
- id: 386
  category: defensive_driving
  question: Según el manual, ¿cuáles son las tres opciones de un conductor para evitar
    una colisión?
  choices:
    A: Detenerse, girar y acelerar
    B: Frenar, tocar la bocina y desviarse
    C: Detenerse, dar marcha atrás y girar
    D: Acelerar, frenar y prepararse para el impacto
  answer: A
  explanation: 'Para evitar una colisión, el manual establece que los conductores
    tienen tres opciones: (1) detenerse, (2) girar y (3) acelerar.'
- id: 387
  category: vehicle_information
  question: 'Si necesita detenerse rápidamente y su vehículo está equipado con un
    Sistema de Frenos Antibloqueo (ABS), usted debe:'
  choices:
    A: Bombear los frenos rápidamente para evitar derrapar
    B: Presionar el pedal del freno tan fuerte como pueda y mantenerlo presionado
    C: Aplicar los frenos ligeramente y alejarse girando
    D: Presionar el pedal del freno con fuerza y soltarlo si siente que el pedal lo
      empuja hacia atrás
  answer: B
  explanation: Con el ABS, si necesita detenerse rápidamente, debe presionar el pedal
    del freno tan fuerte como pueda y mantenerlo presionado. No debe soltar el pedal
    del freno incluso si siente que este lo empuja hacia atrás.
- id: 388
  category: vehicle_information
  question: ¿Qué debe hacer si debe detenerse rápidamente en un vehículo sin ABS y
    los frenos se bloquean?
  choices:
    A: Seguir presionando el pedal del freno con más fuerza
    B: Soltar rápidamente el pedal del freno
    C: Girar el volante bruscamente
    D: Aplicar el freno de mano
  answer: B
  explanation: En un vehículo sin ABS, si los frenos se bloquean, sentirá que el vehículo
    comienza a derrapar. Debe soltar rápidamente el pedal del freno y, tan pronto
    como el vehículo deje de derrapar, presionar el pedal del freno nuevamente.
- id: 389
  category: defensive_driving
  question: Al girar rápidamente para evitar una colisión en un vehículo sin ABS,
    ¿por qué es útil pisar el pedal del freno y luego soltarlo antes de girar?
  choices:
    A: Bloquea las ruedas delanteras para evitar derrapes
    B: Pone más peso en los neumáticos delanteros, lo que permite un giro más rápido
    C: Activa el control electrónico de estabilidad
    D: Desplaza el peso del vehículo hacia los neumáticos traseros
  answer: B
  explanation: Sin ABS, frenar reducirá un poco la velocidad del vehículo y pondrá
    más peso en los neumáticos delanteros, lo que permite un giro más rápido.
- id: 390
  category: defensive_driving
  question: 'Si está a punto de ser golpeado por detrás, usted debe:'
  choices:
    A: Inclinarse hacia adelante alejándose del respaldo del asiento
    B: Quitar las manos del volante
    C: Presionarse contra el respaldo de su asiento y estar listo para aplicar los
      frenos
    D: Girar su vehículo para evitar un impacto directo
  answer: C
  explanation: Si su vehículo es golpeado por detrás, su cuerpo será lanzado hacia
    atrás. Debe presionarse contra el respaldo de su asiento, apoyar la cabeza contra
    el reposacabezas y estar listo para aplicar los frenos para no ser empujado contra
    otro vehículo.
- id: 391
  category: driver_responsibility
  question: ¿Qué debe hacer con su vehículo si se ve involucrado en un choque y el
    vehículo aún puede moverse?
  choices:
    A: Dejarlo exactamente donde está hasta que llegue la policía
    B: Sacarlo de la carretera para que no bloquee el tráfico
    C: Conducirlo hasta la estación de policía más cercana
    D: Moverlo a la mediana central y encender las luces altas
  answer: B
  explanation: En la escena de un accidente, si su vehículo puede moverse, debe sacarlo
    de la carretera para que no bloquee el tráfico.
- id: 392
  category: driver_responsibility
  question: ¿Cuándo es apropiado mover a una persona lesionada en la escena de un
    accidente?
  choices:
    A: Siempre que pidan ser movidos
    B: Solo cuando estén en un automóvil en llamas u otro peligro inmediato
    C: Cuando estén bloqueando el flujo del tráfico
    D: Tan pronto como se llame a los servicios médicos de emergencia
  answer: B
  explanation: 'El manual establece: ''No mueva a los heridos, a menos que estén en
    un automóvil en llamas o en otro peligro inmediato. Mover a una persona puede
    empeorar sus lesiones''.'
- id: 393
  category: driver_responsibility
  question: 'Si alguien resulta herido en un choque y pide agua, usted debe:'
  choices:
    A: Darle una pequeña cantidad de agua
    B: Darle una bebida caliente para prevenir el choque (shock)
    C: No darle nada de beber
    D: Darle agua solo si no está sangrando
  answer: C
  explanation: 'Al tratar con una persona lesionada en la escena de un accidente,
    el manual establece explícitamente: ''No dé nada de beber a las personas heridas,
    ni siquiera agua''.'
- id: 394
  category: driver_responsibility
  question: ¿Qué debe hacer si se ve involucrado en un accidente con un vehículo estacionado
    y no puede encontrar al propietario?
  choices:
    A: Esperar junto al vehículo hasta que el propietario regrese
    B: Dejar una nota en un lugar visible con su información de contacto y la fecha
      y hora del accidente
    C: Reportar el accidente a su compañía de seguros y abandonar la escena
    D: Llamar a una grúa para retirar el vehículo estacionado
  answer: B
  explanation: Si un accidente involucra un automóvil estacionado y no puede encontrar
    al propietario, debe dejar una nota en un lugar donde se pueda ver con información
    sobre cómo el propietario puede contactarlo y la fecha y hora del accidente.
- id: 395
  category: penalties_and_points
  question: 'Debe reportar inmediatamente un accidente a las autoridades si los daños
    a la propiedad son de al menos:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Debe reportar un accidente inmediatamente a las autoridades si alguien
    resulta herido o muere, o si los daños a la propiedad son de $500 o más.
- id: 396
  category: driver_responsibility
  question: ¿Cuántos días tiene para presentar un informe de accidente después de
    un choque?
  choices:
    A: 3 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Según el manual, debe presentar el informe del accidente dentro de
    los 10 días posteriores al mismo.
- id: 397
  category: sharing_the_road
  question: ¿Qué debe hacer cuando se le acerque un vehículo de emergencia que utiliza
    sus señales auditivas y visuales?
  choices:
    A: Detenerse inmediatamente en su carril actual
    B: Aumentar la velocidad para apartarse del camino del vehículo de emergencia
    C: Ceder el paso y conducir lo más cerca posible del borde derecho o de la acera
      de la carretera
    D: Moverse al carril izquierdo y reducir la velocidad
  answer: C
  explanation: La ley estatal de Montana exige que todos los vehículos que no sean
    de emergencia cedan el paso y conduzcan inmediatamente a una posición paralela
    y lo más cerca posible del borde derecho o de la acera de la carretera cuando
    se acerque un vehículo de emergencia utilizando señales auditivas y visuales.
- id: 398
  category: driver_responsibility
  question: ¿Cómo debe tratar una herida sangrante en una persona lesionada en la
    escena de un accidente?
  choices:
    A: Aplicar un torniquete por encima de la herida
    B: Lavar la herida con agua
    C: Aplicar presión directa sobre la herida con la mano o un paño
    D: Elevar la herida y esperar a los paramédicos
  answer: C
  explanation: Si hay sangrado, debe aplicar presión directa sobre la herida con la
    mano o con un paño. Incluso el sangrado severo casi siempre puede detenerse o
    ralentizarse mediante el uso de presión.
- id: 399
  category: sharing_the_road
  question: ¿Qué debe hacer en una carretera con un límite de velocidad indicado de
    50 MPH o más al acercarse a un vehículo de emergencia estacionado que muestra
    señales de emergencia en el carril adyacente?
  choices:
    A: Detenerse inmediatamente y esperar a que el vehículo se mueva
    B: Reducir la velocidad a una velocidad de al menos 20 millas por debajo del límite
      de velocidad indicado
    C: Mantener su velocidad pero tocar la bocina para reconocer su presencia
    D: Aumentar la velocidad para pasar el vehículo de emergencia lo más rápido posible
  answer: B
  explanation: En carreteras con un límite de velocidad indicado de 50 MPH o más,
    los vehículos en un carril directamente al lado de un vehículo de emergencia o
    de policía estacionado que muestre señales de emergencia deben reducir la velocidad
    a una velocidad de al menos 20 millas por debajo del límite de velocidad indicado.
- id: 400
  category: safe_driving_rules
  question: ¿Cómo debe reconocer la presencia de un oficial de la ley cuando le están
    ordenando detenerse?
  choices:
    A: Encender las luces de emergencia (hazard lights)
    B: Agitar la mano por la ventana
    C: Encender la luz de giro a la derecha
    D: Tocar los frenos tres veces
  answer: C
  explanation: Si un oficial de la ley le ordena detenerse, reconozca la presencia
    del oficial encendiendo su luz de giro a la derecha. Esto le permite al oficial
    saber que usted reconoce su presencia.
- id: 401
  category: safe_driving_rules
  question: ¿Cuál es el lugar más seguro y apropiado para detenerse durante una parada
    de cumplimiento de la ley?
  choices:
    A: La mediana central de la interestatal
    B: El lado opuesto de una carretera de dos carriles
    C: El acotamiento derecho de la carretera
    D: El medio de la intersección más cercana
  answer: C
  explanation: Debe mover su vehículo hacia el acotamiento derecho de la carretera.
    No se mueva hacia la mediana central ni al lado opuesto de una carretera de dos
    carriles, ya que esto pone en peligro tanto al conductor como al oficial.
- id: 402
  category: driver_responsibility
  question: Durante una parada de tráfico, ¿por qué es importante que el conductor
    y los pasajeros coloquen sus manos a la vista?
  choices:
    A: Es un requisito de la ley federal para todos los pasajeros
    B: Evita que cambie de marcha accidentalmente
    C: Reduce el nivel de amenaza que siente el oficial
    D: Le prepara para entregar su licencia rápidamente
  answer: C
  explanation: La incapacidad de un oficial para ver las manos del conductor y de
    todos los ocupantes aumenta el nivel de amenaza que siente el oficial, ya que
    la mayoría de los actos criminales violentos contra los oficiales ocurren mediante
    el uso de las manos de una persona.
- id: 403
  category: safe_driving_rules
  question: Si su vehículo tiene vidrios polarizados, ¿qué se recomienda durante una
    parada de cumplimiento de la ley?
  choices:
    A: Bajarlos después de detenerse en el acotamiento derecho, antes de que el oficial
      haga contacto
    B: Mantenerlos subidos hasta que el oficial toque el vidrio
    C: Bajarlos solo hasta la mitad para que el oficial pueda pasar su licencia
    D: Encender la luz interior del techo y dejar los vidrios subidos
  answer: A
  explanation: Si sus vidrios están polarizados, se recomienda que los baje después
    de haber detenido su vehículo en el acotamiento derecho de la carretera y antes
    de que el oficial haga contacto con usted.
- id: 404
  category: defensive_driving
  question: ¿Qué debe hacer si su acelerador se queda trabado mientras conduce?
  choices:
    A: Agacharse e intentar jalarlo hacia arriba
    B: Cambiar a la posición de estacionamiento (Park)
    C: Cambiar a neutral y aplicar presión constante en el freno
    D: Apagar el motor
  answer: C
  explanation: Según el cuestionario del Capítulo 7, si su acelerador se queda trabado
    mientras conduce, debe cambiar a neutral y aplicar presión constante en el freno.
- id: 405
  category: penalties_and_points
  question: La licencia de conducir se considera un privilegio que puede ser suspendido,
    revocado o cancelado por ¿cuál de las siguientes razones?
  choices:
    A: Conducir bajo los efectos del alcohol o drogas
    B: Conducción distraída
    C: Ser un menor en posesión (de alcohol o drogas)
    D: Todas las anteriores
  answer: D
  explanation: Conducir bajo los efectos del alcohol o drogas, la conducción distraída,
    conducir con una licencia suspendida o revocada y ser un menor en posesión son
    ejemplos de situaciones que pueden hacer que pierda su licencia.
- id: 406
  category: license_system
  question: ¿Cuál de las siguientes NO es una de las cinco categorías principales
    de información que aparecen en un historial de conducción de Montana?
  choices:
    A: Información de antecedentes personales
    B: Historial de mantenimiento del vehículo
    C: Historial de condenas/accidentes
    D: Sanciones de la licencia de conducir
  answer: B
  explanation: 'Las cinco categorías principales en un historial de conducción son:
    información de antecedentes personales, información de la licencia, historial
    de condenas/accidentes, sanciones de la licencia de conducir e historial de accidentes
    de vehículos motorizados. El historial de mantenimiento del vehículo no está incluido.'
- id: 407
  category: license_system
  question: ¿A qué edad deben los hombres jóvenes poder cumplir con los requisitos
    de registro del Servicio Selectivo al solicitar un permiso de instrucción, licencia
    de conducir o identificación de Montana?
  choices:
    A: Al menos 15 años de edad
    B: Al menos 16 años de edad
    C: Al menos 18 años de edad
    D: Al menos 21 años de edad
  answer: A
  explanation: Los hombres jóvenes que tienen al menos 15 años y no más de 26 años
    deben registrarse en el Servicio Selectivo al solicitar un permiso de instrucción,
    una licencia de conducir básica, una CDL o una tarjeta de identificación de Montana.
- id: 408
  category: license_system
  question: ¿Cuál es la edad mínima para que un menor solicite la designación de donante
    de órganos en su licencia de conducir sin autorización de los padres?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: B
  explanation: Un menor que tiene al menos 15 años puede solicitar una designación
    de donante de órganos en su licencia de conducir. No se requiere autorización
    de los padres.
- id: 409
  category: license_system
  question: ¿Qué edad debe tener para elegir que su licencia de conducir indique que
    tiene un testamento vital?
  choices:
    A: 15 años o más
    B: 16 años o más
    C: 18 años o más
    D: 21 años o más
  answer: C
  explanation: Si tiene 18 años o más, puede elegir que su licencia de conducir indique
    que tiene un testamento vital.
- id: 410
  category: alcohol_drugs_health
  question: 'Según el manual, estar despierto durante 18 horas seguidas da como resultado
    habilidades de conducción similares a:'
  choices:
    A: Un conductor adolescente con licencia reciente
    B: Alguien que conduce con una licencia suspendida
    C: Alguien bajo la influencia de drogas o alcohol
    D: Un conductor que usa un teléfono celular manos libres
  answer: C
  explanation: Después de estar despierto durante 18 horas seguidas, las habilidades
    de conducción son las mismas que las de alguien bajo la influencia de drogas o
    alcohol.
- id: 411
  category: safe_driving_rules
  question: ¿Durante una parada de tráfico, por qué debe permanecer dentro de su vehículo
    a menos que el oficial le indique lo contrario?
  choices:
    A: Salir del vehículo es una infracción de tráfico automática
    B: Salir aumenta el riesgo de ser golpeado por vehículos que pasan y hace que
      el oficial se sienta amenazado
    C: Salir resultará automáticamente en un registro del vehículo
    D: Salir impide que el oficial verifique sus placas de matrícula
  answer: B
  explanation: Salir de su vehículo sin que un oficial se lo indique primero puede
    aumentar el riesgo de ser golpeado por un vehículo que pasa y aumentar el nivel
    de amenaza que siente el oficial.
- id: 412
  category: driver_responsibility
  question: 'Si se ve involucrado en un accidente, un conductor debe:'
  choices:
    A: Detener su vehículo en la escena o cerca de ella
    B: No pararse ni caminar en los carriles de tráfico
    C: Apagar el encendido de los vehículos accidentados
    D: Todas las anteriores
  answer: D
  explanation: De acuerdo con el cuestionario del Capítulo 7, si se ve involucrado
    en un accidente, un conductor debe detener su vehículo en la escena o cerca de
    ella, no pararse ni caminar en los carriles de tráfico y apagar el encendido de
    los vehículos accidentados (Todas las anteriores).
- id: 413
  category: safe_driving_rules
  question: ¿Según un estudio de la Fundación AAA para la Seguridad del Tráfico, qué
    porcentaje de choques en los que murió una persona involucró a un conductor somnoliento?
  choices:
    A: 13%
    B: 21%
    C: 33%
    D: 50%
  answer: B
  explanation: Un estudio reciente de la Fundación AAA para la Seguridad del Tráfico
    mostró que el 21% de los choques en los que murió una persona involucraron a un
    conductor somnoliento.
- id: 414
  category: alcohol_drugs_health
  question: 'Después de estar despierto durante 18 horas seguidas, las habilidades
    de conducción de una persona son comparables a las de:'
  choices:
    A: Un conductor adolescente con licencia reciente.
    B: Alguien que conduce en condiciones climáticas severas.
    C: Alguien bajo la influencia de drogas o alcohol.
    D: Un conductor que envía mensajes de texto mientras conduce.
  answer: C
  explanation: Después de estar despierto durante 18 horas seguidas, las habilidades
    de conducción son las mismas que las de alguien bajo la influencia de drogas o
    alcohol.
- id: 415
  category: signs_and_signals
  question: ¿Qué información aparece en una señal del Sistema de Notificación de Emergencia
    (ENS) en un cruce de ferrocarril?
  choices:
    A: El horario del tren y el límite de velocidad.
    B: Un número de teléfono y un número del DOT de los EE. UU.
    C: La distancia al hospital más cercano.
    D: La altura máxima de paso para camiones.
  answer: B
  explanation: El ENS es una señal colocada en o cerca de un cruce que indica un número
    de teléfono junto con un número del DOT de los EE. UU.
- id: 416
  category: safe_driving_rules
  question: ¿A qué temperatura corporal central el sistema termorregulador de un niño
    se ve abrumado, comenzando un golpe de calor?
  choices:
    A: 99 grados
    B: 101 grados
    C: 104 grados
    D: 107 grados
  answer: C
  explanation: El golpe de calor comienza cuando la temperatura corporal central alcanza
    aproximadamente los 104 grados y el sistema termorregulador se ve abrumado.
- id: 417
  category: safe_driving_rules
  question: Una temperatura corporal central de aproximadamente ______ se considera
    letal para un niño que se deja en un vehículo caliente.
  choices:
    A: 102 grados
    B: 104 grados
    C: 105 grados
    D: 107 grados
  answer: D
  explanation: Una temperatura corporal central de aproximadamente 107 grados es letal.
- id: 418
  category: sharing_the_road
  question: ¿Cuál es el enfoque principal del programa Camioneros Contra la Trata
    (TAT, por sus siglas en inglés)?
  choices:
    A: Prevenir el contrabando de drogas ilegales a través de las fronteras estatales.
    B: Combatir el delito de trata de personas en las carreteras del país.
    C: Hacer cumplir los límites de velocidad para vehículos comerciales.
    D: Proporcionar asistencia de emergencia en carretera a automovilistas varados.
  answer: B
  explanation: Camioneros Contra la Trata (Truckers Against Trafficking) reconoce
    que los miembros de la industria del transporte por carretera y los camioneros
    individuales son invaluables en la lucha contra el atroz delito de la trata de
    personas.
- id: 419
  category: vehicle_information
  question: ¿En qué año comenzó Montana a emitir placas de matrícula?
  choices:
    A: '1891'
    B: '1913'
    C: '1914'
    D: '1928'
  answer: C
  explanation: Montana comenzó a emitir placas de matrícula en 1914. La primera placa
    mostraba solo el número de la placa.
- id: 420
  category: vehicle_information
  question: ¿De qué material se fabricaron las placas de matrícula de Montana en 1944
    debido a la escasez de acero durante la guerra?
  choices:
    A: Tablero de fibra de soja prensada
    B: Aluminio reciclado
    C: Cuero tratado
    D: Cartón de alta resistencia
  answer: A
  explanation: Durante 1944, las placas de matrícula se fabricaron con tablero de
    fibra de soja prensada debido a la escasez de acero causada por la guerra.
- id: 421
  category: vehicle_information
  question: ¿Cuándo se utilizó por primera vez el eslogan "Big Sky Country" en las
    matrículas de Montana?
  choices:
    A: '1933'
    B: '1950'
    C: '1967'
    D: '2010'
  answer: C
  explanation: El eslogan "Treasure State" se utilizó por primera vez en 1950 y se
    cambió al popular eslogan "Big Sky Country" en 1967.
- id: 422
  category: vehicle_information
  question: ¿Qué designaba el número de prefijo en una matrícula de Montana a partir
    de 1933?
  choices:
    A: La potencia del vehículo
    B: El condado en el que se registró el vehículo
    C: El centro de población tal como existía en 1914
    D: El año en que se fabricó el vehículo
  answer: B
  explanation: En 1933, el número de prefijo fue revisado para designar el condado
    en el que se registró ese vehículo.
- id: 423
  category: vehicle_information
  question: ¿Qué característica única se añadió a la matrícula de Montana por un solo
    año en 1938?
  choices:
    A: El contorno del mapa del estado
    B: Las palabras "PRISON MADE"
    C: Un cráneo de bisonte
    D: El eslogan "Treasure State"
  answer: C
  explanation: El mapa del estado, que delimita la matrícula de emisión estándar de
    hoy, se encontró por primera vez en la placa naranja y granate de 1933, y el cráneo
    de bisonte se añadió por primera vez por un solo año en 1938.
- id: 424
  category: vehicle_information
  question: 'En 1913, se puso en vigor el cobro de impuestos sobre los vehículos de
    motor en Montana principalmente para recaudar ingresos para:'
  choices:
    A: Financiar el sistema de escuelas públicas del estado.
    B: La construcción, el mantenimiento y la mejora de las carreteras públicas.
    C: Ampliar la infraestructura ferroviaria del estado.
    D: Fabricar las primeras matrículas emitidas por el estado.
  answer: B
  explanation: El cobro de impuestos sobre los vehículos de motor se puso en vigor
    en 1913 con el fin de recaudar ingresos para la construcción, el mantenimiento
    y la mejora de las carreteras públicas.
- id: 425
  category: vehicle_information
  question: ¿Cuántos diseños de matrículas de emisión estándar ofrece Montana actualmente?
  choices:
    A: Uno
    B: Tres
    C: Cinco
    D: Más de 190
  answer: C
  explanation: Montana ofrece actualmente cinco diseños de matrículas de emisión estándar
    y más de 190 matrículas de especialidad y universitarias.
- id: 426
  category: defensive_driving
  question: ¿Cuál de las siguientes es una consecuencia común de conducir con somnolencia?
  choices:
    A: Mayor capacidad para procesar información compleja.
    B: Tiempos de reacción más rápidos ante las condiciones de la carretera.
    C: Volverse descuidado al tomar decisiones de conducción.
    D: Mayor conciencia de posibles choques.
  answer: C
  explanation: Si conduce con somnolencia, puede volverse más lento para responder...
    Puede volverse descuidado al tomar decisiones de conducción, tener problemas para
    prestar atención o incluso quedarse dormido mientras conduce.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que se aproxima
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 427
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 428
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar le pondría en la trayectoria del tráfico en sentido contrario.
  id: 429
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 430
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 431
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 432
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 433
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 434
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 435
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 436
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 437
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 438
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 439
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 440
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta (rotonda) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 441
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de tren. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 442
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 443
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 444
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta (rotonda) más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino gire primero
    en un sentido y luego en el otro.
  id: 445
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 446
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 447
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 448
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 449
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Una zona de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 450
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: Zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una calle de sentido único o de una carretera dividida
    y se encuentre con vehículos que circulan en la dirección opuesta.
  id: 451
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 452
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción en la carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 453
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca
    donde el semáforo puede no ser visible desde la distancia.
  id: 454
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 455
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 456
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 457
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: 'Se está añadiendo un nuevo carril: no es necesario fusionarse'
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir fusión. El tráfico que entra desde la rampa tiene su
    propio carril nuevo.
  id: 458
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionar en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 459
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que muestren un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 460
