questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima en Montana para que un estudiante obtenga un Permiso
    de instrucción si está inscrito en un programa de educación vial aprobado por
    el estado?
  choices:
    A: 14 años
    B: 14 años y medio
    C: 15 años
    D: 16 años
  answer: B
  explanation: Según la División de Vehículos Motorizados del Departamento de Justicia
    de Montana, un estudiante debe tener al menos 14 años y medio y estar inscrito
    en un curso de educación vial aprobado para recibir un permiso de instrucción.
- id: 2
  category: license_system
  question: Bajo el programa GDL (Licencia de Conducir Graduada) de Montana, ¿cuánto
    tiempo debe un adolescente tener un Permiso de instrucción antes de solicitar
    una Licencia restringida de primer año?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Montana exige que los titulares de permisos mantengan un
    historial de conducción limpio durante al menos 6 meses consecutivos antes de
    ser elegibles para la Licencia restringida de primer año.
- id: 3
  category: license_system
  question: Para obtener una Licencia restringida de primer año en Montana, ¿cuántas
    horas de práctica de conducción supervisada debe completar un adolescente?
  choices:
    A: 40 horas en total, con 5 de noche
    B: 50 horas en total, con 10 de noche
    C: 60 horas en total, con 15 de noche
    D: 30 horas en total, con 10 de noche
  answer: B
  explanation: Los requisitos del GDL de Montana especifican 50 horas de conducción
    supervisada, de las cuales al menos 10 deben ser nocturnas, certificadas por un
    padre o tutor legal.
- id: 4
  category: license_system
  question: Durante los primeros 6 meses de tener una Licencia restringida de primer
    año en Montana, ¿cuántos pasajeros menores de 18 años que no sean familiares están
    permitidos en el vehículo?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante los primeros 6 meses de la licencia restringida, solo se permite
    un pasajero menor de 18 años que no sea familiar, a menos que esté supervisado
    por un adulto con licencia.
- id: 5
  category: license_system
  question: ¿Cuál es el horario restringido de conducción nocturna para un conductor
    de Montana con una Licencia restringida de primer año?
  choices:
    A: 10:00 PM a 6:00 AM
    B: 11:00 PM a 5:00 AM
    C: Medianoche a 5:00 AM
    D: 9:00 PM a 5:00 AM
  answer: B
  explanation: Los conductores con una Licencia restringida de primer año tienen prohibido
    conducir entre las 11:00 PM y las 5:00 AM, con excepciones limitadas por trabajo,
    escuela o emergencias.
- id: 6
  category: license_system
  question: Si un conductor de Montana se muda a una nueva dirección, ¿dentro de cuántos
    días debe notificar el cambio a la División de Vehículos Motorizados (MVD)?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: A
  explanation: La ley de Montana exige que todos los conductores con licencia notifiquen
    a la MVD cualquier cambio de dirección o nombre en un plazo de 10 días.
- id: 7
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una licencia de conducir en Montana
    si el solicitante NO ha completado un curso de educación vial aprobado por el
    estado?
  choices:
    A: 15 años
    B: 16 años
    C: 17 años
    D: 18 años
  answer: B
  explanation: Si un adolescente no toma el curso de educación vial, debe esperar
    hasta tener 16 años para solicitar un permiso o licencia en Montana.
- id: 8
  category: license_system
  question: Una licencia de conducir de Montana para una persona de entre 21 y 67
    años suele ser válida por ¿cuántos años?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: En Montana, las licencias de conducir estándar para adultos de 21 a
    67 años se emiten por un período de 8 años.
- id: 9
  category: license_system
  question: Bajo el sistema de puntos de Montana, ¿la licencia de un conductor será
    suspendida si acumula cuántos puntos en un período de 3 años?
  choices:
    A: 10 puntos
    B: 12 puntos
    C: 15 puntos
    D: 18 puntos
  answer: B
  explanation: La MVD de Montana suspenderá la licencia de un conductor si acumula
    12 o más puntos en cualquier período de 3 años.
- id: 10
  category: license_system
  question: ¿Cuál es la cobertura mínima obligatoria de seguro de responsabilidad
    civil en Montana por lesiones corporales o muerte de una persona en un solo accidente?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Montana exige un mínimo de $25,000 por lesiones corporales
    a una persona, $50,000 por lesiones corporales a dos o más personas y $20,000
    por daños a la propiedad (25/50/20).
- id: 11
  category: license_system
  question: Al solicitar una licencia de Montana que cumpla con REAL ID, ¿cuál de
    los siguientes es un comprobante aceptable de residencia en Montana?
  choices:
    A: Una tarjeta de seguro social
    B: Un acta de nacimiento
    C: Una factura de servicios públicos que muestre una dirección física
    D: Un pasaporte válido de los EE. UU.
  answer: C
  explanation: Para demostrar la residencia para una REAL ID, Montana requiere documentos
    que muestren una dirección física, como una factura de servicios públicos, un
    contrato de arrendamiento o una póliza de seguro. Los pasaportes y las tarjetas
    de SSN prueban la identidad o ciudadanía, pero no la residencia.
- id: 12
  category: license_system
  question: ¿Cuál es la sanción por una primera infracción de las restricciones de
    la GDL (Licencia de Conducir Graduada) en Montana?
  choices:
    A: Una multa de $500
    B: De 20 a 60 horas de servicio comunitario
    C: Revocación inmediata de la licencia hasta los 18 años
    D: Una sentencia obligatoria de 1 año de cárcel
  answer: B
  explanation: Una primera infracción de las restricciones de la GDL de Montana se
    castiga con 20 a 60 horas de servicio comunitario. Una segunda infracción puede
    resultar en la suspensión de la licencia.
- id: 13
  category: license_system
  question: El titular de un Permiso de Instrucción en Montana debe estar acompañado
    por un conductor con licencia que tenga al menos ¿cuántos años?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: Cualquier edad, siempre que tenga licencia
  answer: A
  explanation: La ley de Montana exige que el conductor supervisor de un titular de
    permiso sea un conductor con licencia que tenga al menos 18 años de edad.
- id: 14
  category: license_system
  question: ¿Cuántas veces puede un solicitante intentar el examen de conocimientos
    (escrito) de conducir de Montana en un solo día?
  choices:
    A: Una vez
    B: Dos veces
    C: Tres veces
    D: Ilimitadas
  answer: A
  explanation: La política del MVD de Montana generalmente limita a los solicitantes
    a un solo intento del examen de conocimientos por día.
- id: 15
  category: license_system
  question: En Montana, si usted es menor de 18 años y desea ser donante de órganos,
    ¿qué se requiere?
  choices:
    A: Nada, puede decidir de forma independiente
    B: La firma de un padre o tutor legal
    C: Una orden judicial
    D: No puede ser donante hasta los 21 años
  answer: B
  explanation: En Montana, los solicitantes menores de 18 años deben tener el consentimiento
    de un padre o tutor para ser designados como donantes de órganos en su licencia.
- id: 16
  category: license_system
  question: Para cumplir con el estándar de agudeza visual para una licencia de conducir
    de Montana sin restricciones, ¿qué visión debe tener un solicitante en al menos
    un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/60
  answer: C
  explanation: Según el Manual del Conductor de Montana, un solicitante debe tener
    una agudeza visual de al menos 20/40 en al menos un ojo, con o sin lentes correctivos,
    para calificar para una licencia sin restricciones.
- id: 17
  category: license_system
  question: Una licencia de conducir estándar Clase D de Montana le permite operar
    un vehículo no comercial con una Clasificación de Peso Bruto Vehicular (GVWR)
    de hasta ¿cuántas libras?
  choices:
    A: 10,000 lbs
    B: 15,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: Se requiere una licencia Clase D en Montana para cualquier persona
    que opere un vehículo motorizado no comercial que no exceda las 26,000 libras
    de GVWR.
- id: 18
  category: license_system
  question: Si cambia legalmente su nombre debido a un matrimonio o una orden judicial,
    debe solicitar una licencia de conducir de Montana de reemplazo dentro de ¿cuántos
    días?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: A
  explanation: La ley de Montana (MCA 61-5-115) exige que los conductores notifiquen
    a la División de Vehículos Motorizados y soliciten una licencia corregida dentro
    de los 10 días posteriores a un cambio de nombre legal.
- id: 19
  category: license_system
  question: Los nuevos residentes de Montana que tengan una licencia de conducir válida
    de otro estado deben obtener una licencia de conducir de Montana dentro de ¿cuántos
    días después de convertirse en residentes?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Según la ley de Montana, una persona se considera residente a efectos
    de conducción después de 60 días y debe obtener una licencia de Montana dentro
    de ese plazo.
- id: 20
  category: license_system
  question: En Montana, cuando un padre o tutor firma la solicitud de licencia de
    conducir de un menor, ¿cuál es el resultado legal?
  choices:
    A: Solo son responsables de la tarifa de la solicitud.
    B: Están exentos de toda responsabilidad por las acciones del menor.
    C: Asumen responsabilidad solidaria e individual por cualquier negligencia o mala
      conducta deliberada del menor al conducir.
    D: Solo son responsables si el menor conduce su vehículo específico.
  answer: C
  explanation: Según MCA 61-5-108, la persona que firma la solicitud de un menor para
    un permiso de instrucción o licencia de conducir es solidaria e individualmente
    responsable con el menor por cualquier daño causado por la negligencia o mala
    conducta deliberada del menor.
- id: 21
  category: license_system
  question: ¿Cuál es la tarifa estándar de restablecimiento para una licencia de conducir
    de Montana que fue suspendida por razones distintas a delitos relacionados con
    el alcohol o las drogas?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: La tarifa estándar para restablecer una licencia de conducir suspendida
    en Montana es de $100, aunque los delitos relacionados con el alcohol pueden conllevar
    tarifas más altas ($200).
- id: 22
  category: license_system
  question: 'Por ley, cualquier solicitante masculino entre las edades de 18 y 25
    años que solicite una licencia de conducir o tarjeta de identificación de Montana
    también está dando su consentimiento para:'
  choices:
    A: Servicio militar obligatorio.
    B: Registro en el Sistema de Servicio Selectivo.
    C: Registro automático de votantes para las próximas elecciones primarias.
    D: Una verificación de antecedentes por parte del FBI.
  answer: B
  explanation: La ley de Montana (MCA 61-5-126) requiere que los solicitantes masculinos
    entre 18 y 25 años se registren en el Sistema de Servicio Selectivo cuando soliciten
    una licencia o identificación.
- id: 23
  category: license_system
  question: Mientras que las licencias para adultos más jóvenes son válidas por 8
    años, ¿por cuántos años es válida una licencia de conducir de Montana para una
    persona de 75 años o más?
  choices:
    A: 2 años
    B: 4 años
    C: 5 años
    D: 8 años
  answer: B
  explanation: En Montana, las licencias de conducir emitidas a personas de 75 años
    de edad o más vencen después de 4 años en lugar de los 8 años estándar.
- id: 24
  category: license_system
  question: Bajo la ley de Consentimiento Implícito (Implied Consent) de Montana,
    si usted se niega a realizarse una prueba química de alcohol o drogas cuando lo
    solicita un oficial, ¿por cuánto tiempo se le incautará y suspenderá su licencia
    (primera infracción)?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Bajo la ley de Consentimiento Implícito, la primera negativa a realizarse
    una prueba de aliento o de sangre resulta en la incautación inmediata de la licencia
    y una suspensión de 6 meses.
- id: 25
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Instrucción de Motocicleta
    de Montana a partir de la fecha de emisión?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que el conductor cumpla 18 años
  answer: B
  explanation: Un permiso de instrucción de motocicleta de Montana es válido por un
    año y permite al titular practicar la conducción antes de realizar el examen de
    habilidades.
- id: 26
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una tarjeta de identificación (ID)
    de Montana (para no conductores)?
  choices:
    A: No hay una edad mínima.
    B: 12 años
    C: 14 años
    D: 15 años
  answer: A
  explanation: En Montana, no existe un requisito de edad mínima para obtener una
    tarjeta de identificación estatal, aunque los menores necesitarán el consentimiento
    de los padres.
- id: 27
  category: license_system
  question: ¿Cuál de las siguientes acciones no relacionadas con la conducción puede
    resultar en la suspensión de su licencia de conducir de Montana?
  choices:
    A: Falta de pago de la manutención infantil.
    B: No graduarse de la escuela secundaria.
    C: No registrar una mascota.
    D: No pagar el impuesto federal sobre la renta.
  answer: A
  explanation: La ley de Montana permite la suspensión de una licencia de conducir
    por razones no relacionadas con la conducción, incluyendo la falta de pago de
    la manutención infantil ordenada por el tribunal.
- id: 28
  category: license_system
  question: 'Al realizar el examen de conducción (habilidades) de Montana, el solicitante
    debe proporcionar un vehículo que tenga:'
  choices:
    A: Un sistema de doble freno para el examinador.
    B: Una transmisión manual.
    C: Registro válido y prueba de seguro.
    D: Menos de 50,000 millas en el odómetro.
  answer: C
  explanation: Los solicitantes deben proporcionar su propio vehículo para el examen
    de conducción, y este debe estar legalmente registrado y asegurado, además de
    estar en condiciones mecánicas seguras.
- id: 29
  category: license_system
  question: Para que se agregue una designación de "Veterano" a una licencia de conducir
    de Montana, ¿qué debe proporcionar el solicitante?
  choices:
    A: Una declaración verbal de servicio.
    B: Una carta de un puesto local de la VFW.
    C: Un documento de baja (como un DD-214) que muestre una baja honorable.
    D: Prueba de inscripción actual en la Guardia Nacional.
  answer: C
  explanation: Para recibir la designación de Veterano en una licencia de Montana,
    el solicitante debe presentar una prueba de baja honorable, generalmente a través
    de un formulario DD-214.
- id: 30
  category: license_system
  question: ¿Cuántos meses antes de que venza su licencia de conducir de Montana se
    le permite renovarla?
  choices:
    A: 1 mes
    B: 3 meses
    C: 6 meses
    D: 12 meses
  answer: C
  explanation: Montana permite a los conductores renovar sus licencias hasta 6 meses
    antes de la fecha de vencimiento.
- id: 31
  category: driver_testing
  question: 'Para aprobar el examen de la vista para una licencia de conducir de Montana
    sin restricciones, el solicitante debe tener un campo de visión combinado de al
    menos:'
  choices:
    A: 100 grados
    B: 120 grados
    C: 140 grados
    D: 160 grados
  answer: C
  explanation: De acuerdo con el Manual del Conductor de Montana, un solicitante debe
    tener una agudeza visual de al menos 20/40 en al menos un ojo y un campo de visión
    combinado de 140 grados para obtener una licencia sin restricciones.
- id: 32
  category: driver_testing
  question: Si reprueba el examen de manejo (práctico) de Montana, ¿cuánto tiempo
    debe esperar antes de ser elegible para volver a tomarlo?
  choices:
    A: 24 horas
    B: 3 días
    C: 1 semana
    D: 1 mes
  answer: C
  explanation: En Montana, si un solicitante reprueba el examen de manejo, debe esperar
    al menos una semana (7 días) antes de poder intentar el examen nuevamente.
- id: 33
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito para el vehículo utilizado durante
    un examen de manejo en Montana?
  choices:
    A: Debe ser un auto de alquiler
    B: Debe tener un sistema de doble freno para el examinador
    C: Debe estar registrado y asegurado actualmente
    D: Debe ser un vehículo de transmisión manual
  answer: C
  explanation: El vehículo utilizado para el examen de manejo debe estar en condiciones
    seguras de funcionamiento y contar con un registro vigente y comprobante de seguro
    de responsabilidad civil de Montana.
- id: 34
  category: driver_testing
  question: En Montana, ¿cuál es el límite de velocidad máximo para vehículos de pasajeros
    en autopistas interestatales fuera de las áreas urbanas, a menos que se indique
    lo contrario?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: La ley de Montana establece el límite de velocidad máximo para vehículos
    de pasajeros en autopistas interestatales rurales en 80 mph.
- id: 35
  category: driver_testing
  question: ¿Cuál es el límite de velocidad diurno para vehículos de pasajeros en
    una carretera de Montana de dos carriles sin división, a menos que se indique
    lo contrario?
  choices:
    A: 55 mph
    B: 60 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: El límite de velocidad legal para vehículos de pasajeros en carreteras
    de dos carriles sin división en Montana es de 70 mph durante el día.
- id: 36
  category: driver_testing
  question: 'En Montana, se considera que una persona menor de 21 años conduce bajo
    la influencia (DUI) si su concentración de alcohol en sangre (BAC) es igual o
    superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Montana tiene una ley de 'tolerancia cero' para menores; se considera
    que un conductor menor de 21 años comete un DUI con un BAC de 0.02% o superior.
- id: 37
  category: driver_testing
  question: Bajo el sistema de puntos de Montana, ¿cuántos puntos se asignan a su
    registro de conducir por una condena de conducción temeraria (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 5 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Montana asigna 5 puntos al registro de un conductor por una condena
    de conducción temeraria.
- id: 38
  category: driver_testing
  question: Para mantener una distancia de seguimiento segura en Montana, debe usar
    la 'regla de los tres segundos' en condiciones normales. ¿Cuándo debería aumentar
    esta distancia?
  choices:
    A: Solo cuando conduzca de noche
    B: Solo cuando esté lloviendo
    C: Al seguir a una motocicleta o conducir con mal tiempo
    D: Solo cuando conduzca en una interestatal
  answer: C
  explanation: El Manual del Conductor de Montana aconseja aumentar la distancia de
    seguimiento a más de tres segundos en condiciones climáticas adversas, en carreteras
    resbaladizas o al seguir motocicletas o camiones grandes.
- id: 39
  category: driver_testing
  question: 'La ley de Montana exige que encienda los faros delanteros desde:'
  choices:
    A: Una hora después de la puesta del sol hasta una hora antes de la salida del
      sol
    B: Media hora después de la puesta del sol hasta media hora antes de la salida
      del sol
    C: Desde la puesta del sol hasta la salida del sol
    D: De 6:00 PM a 6:00 AM
  answer: B
  explanation: La ley de Montana exige el uso de faros delanteros desde media hora
    después de la puesta del sol hasta media hora antes de la salida del sol, y en
    cualquier otro momento en que la visibilidad sea inferior a 500 pies.
- id: 40
  category: driver_testing
  question: 'Al estacionar un vehículo cuesta abajo en una calle de doble sentido
    con bordillo (acera), debe girar las ruedas delanteras:'
  choices:
    A: Hacia el bordillo
    B: Lejos del bordillo
    C: Paralelas al bordillo
    D: Hacia la izquierda
  answer: A
  explanation: Al estacionar cuesta abajo, debe girar las ruedas hacia el bordillo
    para que, si el vehículo rueda, lo haga hacia el bordillo y se detenga.
- id: 41
  category: driver_testing
  question: En Montana, debe señalizar su intención de girar al menos ______ antes
    del giro en un distrito comercial o residencial.
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: La ley de Montana exige que se haga la señal de giro de forma continua
    durante al menos 100 pies antes de girar en un distrito comercial o residencial.
- id: 42
  category: driver_testing
  question: 'Al acercarse a un autobús escolar desde cualquier dirección que se haya
    detenido y esté mostrando luces rojas intermitentes, debe detenerse a menos que:'
  choices:
    A: Usted viaje en la dirección opuesta en una carretera con al menos dos carriles
      en cada dirección
    B: Se encuentre en una zona residencial
    C: El autobús esté en el lado opuesto de una carretera dividida por una mediana
      o barrera física
    D: Usted esté conduciendo un vehículo comercial
  answer: C
  explanation: Los conductores no necesitan detenerse ante un autobús escolar si viajan
    en la dirección opuesta en una carretera dividida donde los carriles están separados
    por una mediana o una barrera física.
- id: 43
  category: driver_testing
  question: 'La ley ''Move Over'' (hacerse a un lado) de Montana exige que los conductores
    que se acerquen a un vehículo de emergencia estacionado con luces intermitentes
    deban:'
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Mantener la velocidad pero tocar la bocina
    C: Moverse al carril más alejado si es posible, o reducir la velocidad significativamente
      si cambiar de carril no es seguro
    D: Acelerar para pasar la escena rápidamente
  answer: C
  explanation: La ley de Montana exige que los conductores se muevan a un carril no
    adyacente o reduzcan la velocidad a una velocidad segura al acercarse a vehículos
    de emergencia o de mantenimiento estacionados con luces intermitentes.
- id: 44
  category: driver_testing
  question: ¿Dentro de cuántos días después de convertirse en residentes deben registrar
    sus vehículos los nuevos residentes de Montana?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Según la ley de Montana, los nuevos residentes tienen 60 días para
    registrar sus vehículos en el estado.
- id: 45
  category: driver_testing
  question: Para aprobar el examen de conocimientos (escrito) de conducir de Montana,
    ¿cuál es el número mínimo de preguntas que debe responder correctamente de un
    total de 33?
  choices:
    A: '20'
    B: '24'
    C: '27'
    D: '30'
  answer: C
  explanation: Según el Manual del Conductor de Montana, el examen de conocimientos
    consta de 33 preguntas y debe responder al menos 27 correctamente (aproximadamente
    el 82%) para aprobar.
- id: 46
  category: driver_testing
  question: Al realizar el examen práctico de conducir en Montana, ¿cuál de los siguientes
    requisitos debe proporcionar para el vehículo que está utilizando?
  choices:
    A: Un registro de vehículo válido y comprobante de seguro
    B: Una carta notariada del propietario del vehículo
    C: El título original del vehículo
    D: Un registro de mantenimiento de los últimos 12 meses
  answer: A
  explanation: Para el examen práctico en Montana, el solicitante debe proporcionar
    un vehículo que sea seguro de operar y que tenga un registro válido y un comprobante
    actual de seguro de responsabilidad civil de Montana.
- id: 47
  category: driver_testing
  question: Según la ley de Montana, ¿cuál es el límite de concentración de alcohol
    en sangre (BAC) para los conductores menores de 21 años?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Montana tiene una política de 'tolerancia cero' para los menores; se
    considera que los conductores menores de 21 años están bajo la influencia si su
    BAC es de 0.02% o superior.
- id: 48
  category: driver_testing
  question: Según la ley de Consentimiento Implícito de Montana, ¿cuál es la sanción
    por negarse por primera vez a realizar una prueba química de alcohol o drogas?
  choices:
    A: Una suspensión de la licencia por 30 días
    B: Una suspensión de la licencia por 90 días
    C: Una suspensión de la licencia por 6 meses
    D: Una suspensión de la licencia por 1 año
  answer: C
  explanation: Si se niega a una prueba química en Montana por primera vez, se le
    confiscará la licencia de conducir y se suspenderá por 6 meses.
- id: 49
  category: driver_testing
  question: En Montana, ¿qué sucede con la multa por exceso de velocidad en una zona
    de construcción designada donde hay trabajadores presentes?
  choices:
    A: La multa se anula para los infractores por primera vez
    B: La multa se duplica
    C: La multa se triplica
    D: La multa aumenta en un monto fijo de $500
  answer: B
  explanation: La ley de Montana dicta que las multas por infracciones de tráfico,
    incluido el exceso de velocidad, se duplican en las zonas de trabajo cuando hay
    trabajadores presentes.
- id: 50
  category: driver_testing
  question: El Manual del Conductor de Montana recomienda usar ¿qué regla para mantener
    una distancia de seguimiento segura detrás del vehículo que está delante de usted?
  choices:
    A: La regla de la longitud de un vehículo
    B: La regla de los dos segundos
    C: La regla de los tres segundos
    D: La regla de los cuatro segundos
  answer: D
  explanation: Si bien muchos estados usan una regla de dos o tres segundos, el Manual
    del Conductor de Montana recomienda específicamente una distancia de seguimiento
    de cuatro segundos para permitir un mejor tiempo de reacción.
- id: 51
  category: driver_testing
  question: 'En Montana, cuando un autobús escolar se detiene con sus luces rojas
    intermitentes y el brazo de parada extendido, usted debe detener su vehículo:'
  choices:
    A: Solo si viaja en la misma dirección que el autobús
    B: Solo si el autobús está en una carretera de dos carriles
    C: Independientemente de la dirección en la que viaje, a menos que sea en una
      carretera dividida con una barrera física
    D: Solo si hay niños cruzando la calle en ese momento
  answer: C
  explanation: Los conductores en Montana deben detenerse ante un autobús escolar
    con luces rojas intermitentes desde cualquier dirección, a menos que se encuentren
    en una carretera dividida con una mediana o barrera física que separe las calzadas.
- id: 52
  category: driver_testing
  question: ¿A qué velocidad puede comenzar el hidroplaneo (cuando los neumáticos
    pierden contacto con la carretera debido al agua) en las condiciones climáticas
    de Montana?
  choices:
    A: Tan baja como 35 mph
    B: Solo por encima de 55 mph
    C: Solo por encima de 65 mph
    D: A cualquier velocidad superior a 15 mph
  answer: A
  explanation: El Manual del Conductor de Montana advierte que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph en condiciones de lluvia intensa.
- id: 53
  category: driver_testing
  question: Al estacionar un vehículo cuesta arriba en una calle de doble sentido
    con bordillo (acera) en Montana, ¿hacia dónde deben girarse las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: No importa, siempre que el freno de mano esté puesto
  answer: B
  explanation: Al estacionar cuesta arriba contra un bordillo, gire las ruedas en
    dirección contraria al bordillo para que, si el vehículo rueda, la parte trasera
    de la llanta delantera golpee el bordillo y detenga el auto.
- id: 54
  category: driver_testing
  question: En Montana, ¿a cuántos pies de distancia de un vehículo que viene en sentido
    contrario debe atenuar sus luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Montana exige que los conductores cambien a luces bajas cuando
    un vehículo que viene en sentido contrario se encuentra a menos de 500 pies.
- id: 55
  category: driver_testing
  question: 'En Montana, debe informar inmediatamente un accidente de vehículo motorizado
    a las autoridades si resulta en lesiones, muerte o daños a la propiedad de cualquier
    persona que excedan los:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: La ley de Montana exige un informe inmediato a la policía, al alguacil
    (sheriff) o a la patrulla de caminos si un accidente involucra lesiones, muerte
    o daños a la propiedad que superen los $1,000.
- id: 56
  category: driver_testing
  question: 'Según la ley de Montana, los niños deben estar asegurados en un sistema
    de retención infantil adecuado si tienen:'
  choices:
    A: Menos de 4 años de edad o pesan menos de 40 libras
    B: Menos de 6 años de edad y pesan menos de 60 libras
    C: Menos de 8 años de edad o pesan menos de 80 libras
    D: Menos de 10 años de edad
  answer: B
  explanation: La ley de Montana exige que los niños menores de 6 años que pesen menos
    de 60 libras estén debidamente sujetos en un asiento de seguridad para niños.
- id: 57
  category: driver_responsibility
  question: Si un conductor de Montana es condenado por primera vez por no portar
    un seguro de responsabilidad civil (liability insurance) válido, ¿cuál es la multa
    potencial?
  choices:
    A: Entre $100 y $250
    B: Entre $250 y $500
    C: Exactamente $1,000
    D: Sin multa, solo servicio comunitario
  answer: B
  explanation: Una primera condena por operar un vehículo sin seguro de responsabilidad
    civil en Montana conlleva una multa de $250 a $500, y puede incluir hasta 10 días
    de cárcel.
- id: 58
  category: driver_responsibility
  question: Cuando vende un vehículo en Montana, ¿qué debe hacer con las placas de
    matrícula?
  choices:
    A: Dejarlas en el vehículo para el nuevo propietario.
    B: Quitarlas y guardarlas para su próximo vehículo.
    C: Entregarlas en la estación de policía local.
    D: Destruirlas inmediatamente.
  answer: B
  explanation: En Montana, las placas de matrícula permanecen con el propietario,
    no con el vehículo. Cuando vende un automóvil, debe quitar las placas.
- id: 59
  category: driver_responsibility
  question: Un conductor de Montana es clasificado como 'Infractor de Tránsito Habitual'
    si acumula ¿cuántos puntos en un período de 3 años?
  choices:
    A: 15 puntos
    B: 20 puntos
    C: 30 puntos
    D: 40 puntos
  answer: C
  explanation: Acumular 30 puntos o más en un período de 3 años resulta en la designación
    de Infractor de Tránsito Habitual, lo que conlleva a una revocación de la licencia
    por 3 años.
- id: 60
  category: driver_responsibility
  question: 'Si se ve involucrado en un accidente en Montana donde no puede localizar
    al propietario de un vehículo dañado que estaba desatendido, usted debe:'
  choices:
    A: Esperar al menos 4 horas a que regrese el propietario.
    B: Dejar una nota con su nombre, dirección e información del vehículo y notificar
      a la policía.
    C: Irse si el daño parece ser menor a $500.
    D: Solo informarlo si el propietario lo contacta más tarde.
  answer: B
  explanation: La ley de Montana exige que deje un aviso por escrito en un lugar visible
    en el vehículo desatendido y notifique a las autoridades de inmediato.
- id: 61
  category: driver_responsibility
  question: En Montana, ¿cuántos puntos se añaden a su historial de conducción por
    una condena de 'Exceso de velocidad' (excepto por violaciones específicas de la
    'Regla Básica')?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: A
  explanation: La mayoría de las condenas por exceso de velocidad en Montana resultan
    en la adición de 2 puntos al historial del conductor.
- id: 62
  category: driver_responsibility
  question: 'En Montana, si es condenado por un DUI (conducir bajo la influencia)
    por primera vez, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Una condena por DUI por primera vez en Montana generalmente resulta
    en una suspensión de la licencia de 6 meses.
- id: 63
  category: driver_responsibility
  question: 'Bajo la ley de ''Consentimiento Implícito'' de Montana, al conducir en
    las vías públicas de Montana, usted ha dado su consentimiento para:'
  choices:
    A: Un registro de su vehículo en busca de sustancias ilegales
    B: Una prueba química de su sangre, aliento u orina para determinar el contenido
      de alcohol o drogas
    C: Una revisión de sus registros médicos por parte del DMV
    D: Permitir que los pasajeros beban alcohol en su vehículo
  answer: B
  explanation: La ley de Consentimiento Implícito de Montana significa que se considera
    que cualquier persona que opere un vehículo motorizado en las vías del estado
    abiertas al público ha dado su consentimiento para una prueba o pruebas de su
    sangre o aliento con el fin de determinar cualquier cantidad medida o presencia
    de alcohol o drogas.
- id: 64
  category: driver_responsibility
  question: ¿Cuál es la sanción por una condena por primera vez por conducir sin el
    seguro de responsabilidad civil requerido en Montana?
  choices:
    A: Una multa de entre $250 y $500
    B: Una multa fija de $100
    C: Suspensión obligatoria de la licencia por 30 días
    D: Incautación permanente del vehículo
  answer: A
  explanation: Para una primera infracción por no portar seguro de responsabilidad
    civil, la ley de Montana prescribe una multa no menor de $250 ni mayor de $500,
    o encarcelamiento en la cárcel del condado por no más de 10 días.
- id: 65
  category: driver_responsibility
  question: En Montana, si es condenado por una tercera o subsiguiente infracción
    de conducir sin seguro, ¿cuál es la sanción obligatoria con respecto a su licencia
    de conducir?
  choices:
    A: Una suspensión de 30 días
    B: Una suspensión de 90 días
    C: Una revocación de 1 año
    D: No hay sanción de licencia, solo una multa
  answer: B
  explanation: Para una tercera o subsiguiente condena por conducir sin seguro, la
    ley de Montana exige la entrega de la licencia de conducir para un período de
    suspensión de 90 días.
- id: 66
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por arrojar basura desde un vehículo motorizado
    en las carreteras de Montana?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,000
  answer: D
  explanation: La ley de Montana toma en serio el arrojar basura; una persona condenada
    por arrojar basura en una carretera pública puede ser multada con hasta $2,000.
- id: 67
  category: driver_responsibility
  question: En Montana, para un conductor menor de 21 años, es ilegal operar un vehículo
    motorizado con una Concentración de Alcohol en Sangre (BAC) de ____ o superior.
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Montana tiene una política de 'tolerancia cero' para menores; el límite
    legal de BAC para conductores menores de 21 años es 0.02%.
- id: 68
  category: driver_responsibility
  question: Si un conductor de Montana se niega a realizar una prueba química de alcohol/drogas
    a petición de un agente del orden, ¿por cuánto tiempo se suspenderá su licencia
    por una primera negativa?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Bajo la ley de Consentimiento Implícito, una primera negativa a someterse
    a una prueba química resulta en una suspensión de 6 meses de los privilegios de
    conducir.
- id: 69
  category: driver_responsibility
  question: Bajo el sistema de puntos de Montana, ¿cuántos puntos se asignan a su
    historial de conducción por una condena de 'No permanecer en la escena de un accidente'
    que resulte en muerte o lesiones personales?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: El sistema de puntos de Montana asigna 8 puntos por no permanecer en
    la escena de un accidente que resulte en muerte o lesiones personales.
- id: 70
  category: driver_responsibility
  question: Cuando se vende un vehículo en Montana, el vendedor debe proporcionar
    al comprador el título y una 'Factura de Venta' (Bill of Sale) completada. ¿Cuántos
    días tiene entonces el comprador para solicitar un nuevo título y registro?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 40 días
  answer: D
  explanation: En Montana, una persona que compra un vehículo tiene 40 días a partir
    de la fecha de compra para solicitar un nuevo título y registro.
- id: 71
  category: driver_responsibility
  question: En Montana, ¿quién es legalmente responsable de asegurar que todos los
    pasajeros menores de 18 años estén debidamente sujetos por un cinturón de seguridad
    o un asiento de seguridad para niños?
  choices:
    A: El pasajero mismo
    B: El padre del pasajero, incluso si no está en el auto
    C: El conductor del vehículo
    D: Nadie, ya que el uso del cinturón de seguridad es opcional para menores en
      el asiento trasero
  answer: C
  explanation: El conductor es responsable de asegurar que todos los ocupantes menores
    de 18 años lleven puesto el cinturón de seguridad o estén en un asiento de seguridad
    infantil apropiado.
- id: 72
  category: driver_responsibility
  question: Una licencia de conducir de Montana puede ser suspendida si el conductor
    es condenado por "Conducción Temeraria" (Reckless Driving). ¿Cuántos puntos vale
    una condena por Conducción Temeraria en el historial de conducción de Montana?
  choices:
    A: 2 puntos
    B: 5 puntos
    C: 8 puntos
    D: 10 puntos
  answer: B
  explanation: Bajo el sistema de puntos de Montana, una condena por Conducción Temeraria
    (Reckless Driving) resulta en la adición de 5 puntos al historial del conductor.
- id: 73
  category: safe_driving_rules
  question: Al adelantar a otro vehículo en una carretera de dos carriles en Montana,
    ¿debe regresar a su carril antes de estar a cuántos pies de un vehículo que viene
    en sentido contrario?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley de Montana exige que regrese a su carril de circulación antes
    de estar a menos de 100 pies de cualquier vehículo que se aproxime en dirección
    opuesta.
- id: 74
  category: safe_driving_rules
  question: En Montana, ¿se prohíbe estacionar a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: Según el Manual del Conductor de Montana, no se puede estacionar a
    menos de 15 pies de un hidrante de incendios.
- id: 75
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en una carretera de dos carriles
    de Montana durante la noche para vehículos de pasajeros?
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 70 mph
  answer: B
  explanation: En las carreteras de dos carriles en Montana, el límite de velocidad
    nocturno para vehículos de pasajeros es de 55 mph, a menos que se indique lo contrario.
- id: 76
  category: safe_driving_rules
  question: Al seguir a otro vehículo en Montana, ¿cuál es la distancia de seguimiento
    mínima recomendada bajo condiciones normales de conducción?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Montana recomienda una distancia de seguimiento
    de al menos 3 segundos para permitir un tiempo de reacción adecuado.
- id: 77
  category: safe_driving_rules
  question: En Montana, ¿no se permite estacionar a menos de cuántos pies de una señal
    de pare (stop), una baliza intermitente o una señal de control de tráfico?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Montana prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de pare (stop) o señal de control de tráfico ubicada
    al costado de una calzada.
- id: 78
  category: safe_driving_rules
  question: Para un conductor menor de 21 años en Montana, ¿cuál es el límite de concentración
    de alcohol en sangre (BAC) que constituye un DUI?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Montana tiene una ley de "tolerancia cero" para menores; si es menor
    de 21 años, un BAC de 0.02% o superior se considera un DUI.
- id: 79
  category: safe_driving_rules
  question: Al seguir a un vehículo por la noche en Montana, ¿debe bajar sus luces
    altas cuando esté a menos de cuántos pies del vehículo de adelante?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Montana exige que baje las luces altas cuando siga a otro
    vehículo a una distancia de 500 pies o menos.
- id: 80
  category: safe_driving_rules
  question: Según la ley de Montana, ¿se le prohíbe adelantar a otro vehículo cuando
    se encuentra a menos de cuántos pies de una intersección o un cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: No puede conducir por el lado izquierdo de la carretera (adelantar)
    cuando se aproxime a menos de 100 pies de cualquier intersección o cruce de ferrocarril.
- id: 81
  category: safe_driving_rules
  question: Al estacionar en una colina en Montana, si está estacionado cuesta arriba
    junto a un bordillo (curb), ¿hacia qué lado debe girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba junto a un bordillo, gire las ruedas en
    dirección contraria al bordillo para que la parte trasera del neumático golpee
    el bordillo si el vehículo rueda.
- id: 82
  category: safe_driving_rules
  question: 'En Montana, debe usar sus faros delanteros desde media hora después de
    la puesta del sol hasta:'
  choices:
    A: El amanecer
    B: Media hora antes del amanecer
    C: Una hora antes del amanecer
    D: Cuando la visibilidad sea de 1,000 pies
  answer: B
  explanation: La ley de Montana exige que los faros delanteros estén encendidos desde
    media hora después de la puesta del sol hasta media hora antes del amanecer, o
    siempre que la visibilidad sea inferior a 500 pies.
- id: 83
  category: safe_driving_rules
  question: Al conducir en una carretera de Montana fuera de distritos comerciales
    o residenciales, ¿con cuántos pies de antelación como mínimo debe señalizar su
    intención de girar?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: En Montana, debe señalizar al menos 100 pies antes de un giro en zonas
    comerciales o residenciales, pero al menos 300 pies antes de girar en carreteras.
- id: 84
  category: safe_driving_rules
  question: En Montana, ¿no puede adelantar a otro vehículo cuando se encuentre a
    cuántos pies de una intersección, cruce de ferrocarril, puente o túnel?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: El Código de Montana 61-8-325 prohíbe conducir por el lado izquierdo
    de la calzada al acercarse a menos de 100 pies de una intersección, cruce de ferrocarril,
    puente, viaducto o túnel.
- id: 85
  category: safe_driving_rules
  question: Según la ley de Montana, se prohíbe estacionar a menos de cuántos pies
    de una señal de pare (stop), una señal de ceda el paso (yield) o una señal de
    control de tráfico?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: De acuerdo con el Código de Montana 61-8-354, no se puede estacionar
    a menos de 30 pies de cualquier baliza intermitente, señal de pare, señal de ceda
    el paso o señal de control de tráfico situada al lado de una calzada.
- id: 86
  category: safe_driving_rules
  question: Cuando un autobús escolar se detiene en una carretera con sus luces rojas
    intermitentes, ¿qué conductores NO están obligados a detenerse en Montana?
  choices:
    A: Los conductores que siguen al autobús
    B: Los conductores en el lado opuesto de una carretera dividida con una mediana
      o barrera física
    C: Los conductores en una carretera de cuatro carriles sin mediana
    D: Todos los conductores deben detenerse independientemente del tipo de carretera
  answer: B
  explanation: El Código de Montana 61-8-351 establece que el conductor de un vehículo
    en una carretera con calzadas separadas (divididas por una barrera física o mediana)
    no necesita detenerse al encontrarse o pasar a un autobús escolar que se encuentra
    en una calzada diferente.
- id: 87
  category: safe_driving_rules
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de obras señalizada
    en Montana cuando hay trabajadores presentes?
  choices:
    A: Una multa fija de $500
    B: Las multas se duplican
    C: Suspensión obligatoria de la licencia por 30 días
    D: Las multas se triplican
  answer: B
  explanation: La ley de Montana (61-8-314) estipula que la multa para una persona
    que infrinja un límite de velocidad en una zona de obras es el doble del monto
    de la multa que se impondría normalmente.
- id: 88
  category: safe_driving_rules
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección no controlada
    (sin señales ni semáforos) en Montana, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda debe ceder el paso al vehículo de la derecha
    B: El vehículo de la derecha debe ceder el paso al vehículo de la izquierda
    C: El vehículo en la calle más transitada tiene el derecho de paso
    D: El vehículo más grande tiene el derecho de paso
  answer: A
  explanation: El Código de Montana 61-8-339 establece que cuando dos vehículos entran
    en una intersección desde diferentes carreteras aproximadamente al mismo tiempo,
    el conductor del vehículo de la izquierda deberá ceder el derecho de paso al vehículo
    de la derecha.
- id: 89
  category: safe_driving_rules
  question: Al estacionar un vehículo cuesta abajo en una calle con bordillo en Montana,
    ¿cómo debe colocar las ruedas?
  choices:
    A: Gire las ruedas hacia el bordillo
    B: Gire las ruedas en dirección contraria al bordillo
    C: Mantenga las ruedas rectas
    D: Gire las ruedas hacia el centro de la calle
  answer: A
  explanation: El Manual del Conductor de Montana instruye a los conductores a girar
    sus ruedas hacia el bordillo al estacionar cuesta abajo para que, si el vehículo
    rueda, lo haga hacia el bordillo.
- id: 90
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada detrás del vehículo que
    va delante de usted en condiciones normales de conducción en Montana?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 4 segundos
    D: 10 segundos
  answer: C
  explanation: El Manual del Conductor de Montana recomienda una "regla de los cuatro
    segundos" para mantener una distancia de seguimiento segura en condiciones normales.
- id: 91
  category: safe_driving_rules
  question: 'En Montana, los faros delanteros deben encenderse desde:'
  choices:
    A: Una hora después de la puesta del sol hasta una hora antes de la salida del
      sol
    B: Desde la puesta del sol hasta la salida del sol
    C: Media hora después de la puesta del sol hasta media hora antes de la salida
      del sol
    D: De 9:00 PM a 6:00 AM
  answer: C
  explanation: El Código de Montana 61-9-201 exige que los faros delanteros se utilicen
    desde media hora después de la puesta del sol hasta media hora antes de la salida
    del sol, y en cualquier otro momento en que la visibilidad sea inferior a 500
    pies.
- id: 92
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar de último momento en el tráfico
    de Montana, ¿con cuánta anticipación debería escanear la carretera normalmente?
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 25 segundos
    D: 30 segundos
  answer: B
  explanation: Los conductores seguros intentan mirar de 10 a 15 segundos por delante
    de su vehículo para identificar posibles peligros a tiempo.
- id: 93
  category: defensive_driving
  question: Si su vehículo comienza a hidroplanear (hydroplane) en una carretera mojada
    de Montana, ¿cuál es la mejor acción a seguir?
  choices:
    A: Frenar a fondo para recuperar la tracción
    B: Girar el volante bruscamente hacia el arcén
    C: Retirar gradualmente el pie del pedal del acelerador
    D: Poner el coche en punto muerto (neutral) inmediatamente
  answer: C
  explanation: Si ocurre un hidroplaneo, debe levantar el pie del acelerador y mantener
    el volante recto. No se detenga ni gire hasta que sus neumáticos vuelvan a agarrarse
    a la carretera.
- id: 94
  category: defensive_driving
  question: Al conducir por las carreteras de Montana durante el invierno, ¿en cuál
    de los siguientes lugares es más probable que se forme primero el 'hielo negro'
    (black ice)?
  choices:
    A: Caminos de grava
    B: Puentes y pasos elevados
    C: Inclinaciones montañosas empinadas
    D: Rampas de salida de la interestatal
  answer: B
  explanation: Los puentes y pasos elevados se congelan antes que el resto de la carretera
    porque el aire frío circula tanto por encima como por debajo de la estructura.
- id: 95
  category: defensive_driving
  question: Al entrar en una intersección en Montana, ¿en qué orden debe escanear
    el tráfico?
  choices:
    A: Derecha, Izquierda, Derecha
    B: Izquierda, Derecha, Izquierda
    C: Hacia adelante, luego a la Izquierda
    D: Solo en la dirección en la que va a girar
  answer: B
  explanation: Debe mirar a la izquierda, luego a la derecha y luego a la izquierda
    de nuevo. Mirar a la izquierda primero es fundamental porque los vehículos que
    vienen por la izquierda están más cerca de usted.
- id: 96
  category: defensive_driving
  question: 'En Montana, si un animal grande como un ciervo o un alce salta delante
    de su vehículo, la acción defensiva más segura suele ser:'
  choices:
    A: Virar bruscamente hacia el carril opuesto para esquivarlo
    B: Frenar firmemente y permanecer en su carril
    C: Acelerar para pasar al animal antes de que lo golpee
    D: Apuntar a la cabeza del animal
  answer: B
  explanation: Virar bruscamente puede causar una colisión frontal más grave o un
    vuelco. El manual de Montana aconseja frenar firmemente y permanecer en su carril.
- id: 97
  category: defensive_driving
  question: Al conducir con niebla densa en Montana, ¿qué ajuste de luces debe utilizar?
  choices:
    A: Luces altas (High beams)
    B: Luces bajas (Low beams)
    C: Solo luces de estacionamiento
    D: Luces de emergencia (intermitentes)
  answer: B
  explanation: Se deben usar las luces bajas en la niebla. Las luces altas se reflejan
    en la niebla y causan deslumbramiento, lo que dificulta la visión.
- id: 98
  category: defensive_driving
  question: Si alguien lo sigue muy de cerca (tailgating) en una carretera de dos
    carriles en Montana, ¿qué debe hacer para mantener la seguridad?
  choices:
    A: Frenar repentinamente para asustar al conductor de atrás
    B: Acelerar para aumentar la distancia
    C: Reducir la velocidad gradualmente para animarlo a rebasar
    D: Encender sus luces altas
  answer: C
  explanation: Si lo siguen muy de cerca, debe reducir lentamente su velocidad. Esto
    anima al conductor de atrás a rebasar y aumenta el margen de seguridad delante
    de usted.
- id: 99
  category: defensive_driving
  question: Al conducir por una carretera de Montana con tres o más carriles, ¿qué
    carril se utiliza normalmente para el flujo de tráfico más fluido?
  choices:
    A: El carril izquierdo
    B: El carril derecho
    C: El carril central
    D: El arcén (hombro)
  answer: C
  explanation: El carril central suele ofrecer el flujo más fluido, mientras que el
    izquierdo es para rebasar y el derecho es para el tráfico más lento y para entrar
    o salir.
- id: 100
  category: defensive_driving
  question: En Montana, ¿cuál es la 'Regla Básica' (Basic Rule) con respecto a los
    límites de velocidad?
  choices:
    A: Conducir siempre exactamente al límite de velocidad indicado
    B: Conducir a una velocidad que sea razonable y prudente para las condiciones
      actuales
    C: Nunca conducir a menos de 10 mph por debajo del límite
    D: Los límites de velocidad no se aplican en caminos rurales de grava
  answer: B
  explanation: La Regla Básica (MCA 61-8-303) establece que siempre debe conducir
    a una velocidad que sea razonable y adecuada para las condiciones existentes,
    independientemente del límite indicado.
- id: 101
  category: defensive_driving
  question: ¿Qué debe hacer al descender una pendiente montañosa empinada en Montana?
  choices:
    A: Cambiar a una marcha más baja para usar el frenado de motor
    B: Bajar en punto muerto para ahorrar combustible
    C: Mantener el pie constantemente en el freno
    D: Apagar el motor para evitar el sobrecalentamiento
  answer: A
  explanation: Cambiar a una marcha más baja ayuda a controlar la velocidad mediante
    el frenado de motor, evitando que los frenos se sobrecalienten y fallen.
- id: 102
  category: defensive_driving
  question: Si conduce por una carretera de Montana que está resbaladiza por el hielo
    o la nieve, ¿cómo debe ajustar su distancia de seguimiento?
  choices:
    A: Mantenerla en 4 segundos
    B: Disminuirla a 2 segundos para mantenerse en las huellas del vehículo de adelante
    C: Aumentarla a 6 segundos o más
    D: La distancia de seguimiento no importa si tiene neumáticos de invierno
  answer: C
  explanation: En carreteras resbaladizas, debe aumentar significativamente su distancia
    de seguimiento (a 6 segundos o más) para permitir distancias de frenado mucho
    más largas.
- id: 103
  category: defensive_driving
  question: Al entrar en una curva en una carretera rural de Montana, ¿cuál es el
    mejor momento para reducir la velocidad?
  choices:
    A: Mientras está en medio de la curva
    B: Antes de entrar en la curva
    C: Justo cuando está saliendo de la curva
    D: Solo si siente que los neumáticos se deslizan
  answer: B
  explanation: El Manual del Conductor de Montana indica a los conductores que reduzcan
    la velocidad antes de entrar en una curva. Frenar mientras se está en la curva
    puede provocar un derrape.
- id: 104
  category: defensive_driving
  question: Según la ley de "hacerse a un lado" (Move Over law) de Montana, ¿qué debe
    hacer al acercarse a un vehículo de emergencia estacionado con luces intermitentes
    en una autopista de varios carriles?
  choices:
    A: Detenerse por completo en su carril
    B: Mantener la velocidad pero tocar la bocina
    C: Cambiarse al carril más alejado del vehículo de emergencia si es seguro hacerlo
    D: Aumentar la velocidad para pasar la escena rápidamente
  answer: C
  explanation: La ley de Montana exige que los conductores se muevan a un carril no
    adyacente o reduzcan la velocidad significativamente si cambiar de carril no es
    seguro al pasar vehículos de emergencia o autorizados en el arcén.
- id: 105
  category: defensive_driving
  question: Si su vehículo en Montana está equipado con un Sistema de Frenos Antibloqueo
    (ABS) y necesita detenerse rápidamente en una superficie resbaladiza, ¿cómo debe
    aplicar los frenos?
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante sin soltar
    C: Tocar ligeramente los frenos
    D: Cambiar a punto muerto y usar el freno de emergencia
  answer: B
  explanation: Con el ABS, debe presionar el pedal del freno con fuerza y mantenerlo
    presionado. El sistema "bombeará" automáticamente los frenos por usted para evitar
    el bloqueo.
- id: 106
  category: defensive_driving
  question: Al buscar peligros en Montana, ¿a qué se refiere la regla de "Izquierda-Derecha-Izquierda"?
  choices:
    A: El orden de revisar los espejos antes de retroceder
    B: La forma de maniobrar para salir de un derrape
    C: Cómo mirar antes de entrar en una intersección
    D: El patrón para limpiar el parabrisas
  answer: C
  explanation: Antes de entrar en una intersección, debe mirar a la izquierda, luego
    a la derecha y luego a la izquierda otra vez, porque el primer vehículo que podría
    golpearlo vendría por la izquierda.
- id: 107
  category: alcohol_drugs_health
  question: Para un conductor menor de 21 años en Montana, ¿cuál es el límite legal
    máximo de concentración de alcohol en sangre (BAC) antes de ser citado por conducir
    después de consumir alcohol?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Montana tiene una política de "tolerancia cero" para menores; un conductor
    menor de 21 años puede ser citado si su BAC es de 0.02% o superior.
- id: 108
  category: alcohol_drugs_health
  question: Si un conductor de Montana se niega a realizarse una prueba química de
    alcohol o drogas por primera vez, ¿cuál es la sanción inmediata con respecto a
    su licencia de conducir?
  choices:
    A: Una suspensión de 30 días
    B: Una suspensión de 90 días
    C: Una suspensión de 6 meses
    D: Una revocación permanente
  answer: C
  explanation: Según la ley de Montana, la primera negativa a realizarse una prueba
    química resulta en la incautación inmediata de la licencia y una suspensión de
    6 meses.
- id: 109
  category: alcohol_drugs_health
  question: 'En Montana, un conductor puede ser acusado de "DUI agravado" si su concentración
    de alcohol en sangre (BAC) es igual o superior a:'
  choices:
    A: 0.12%
    B: 0.16%
    C: 0.20%
    D: 0.25%
  answer: B
  explanation: La ley de Montana define el DUI agravado como conducir con un BAC de
    0.16% o superior, o cometer un DUI mientras ya tiene la licencia suspendida por
    un DUI previo.
- id: 110
  category: alcohol_drugs_health
  question: ¿Cuál es la multa mínima obligatoria por una primera condena por DUI en
    Montana (para un adulto con un BAC entre 0.08% y 0.16%)?
  choices:
    A: $100
    B: $300
    C: $600
    D: $1,500
  answer: C
  explanation: Para una primera condena por DUI en Montana, la multa oscila entre
    un mínimo de $600 y un máximo de $1,000.
- id: 111
  category: alcohol_drugs_health
  question: 'Una condena por primera ofensa de DUI en Montana conlleva una sentencia
    mínima obligatoria de cárcel de:'
  choices:
    A: 24 horas consecutivas
    B: 48 horas consecutivas
    C: 7 días
    D: 30 días
  answer: A
  explanation: Una condena por DUI por primera vez en Montana requiere un periodo
    de cárcel de 24 horas consecutivas a 6 meses.
- id: 112
  category: alcohol_drugs_health
  question: ¿Qué prohíbe la ley de "Contenedor Abierto" (Open Container) de Montana?
  choices:
    A: Llevar un paquete de seis cervezas sin abrir en el asiento delantero
    B: Poseer una bebida alcohólica abierta en el área de pasajeros de un vehículo
      motorizado en una vía pública
    C: Transportar una botella de vino abierta en el maletero del coche
    D: Beber agua de un recipiente sin sellar mientras se conduce
  answer: B
  explanation: La ley de Montana prohíbe la posesión de un contenedor de bebida alcohólica
    abierto por parte de una persona en el área de pasajeros de un vehículo motorizado
    ubicado en una vía pública.
- id: 113
  category: alcohol_drugs_health
  question: En Montana, se considera que un conductor está conduciendo bajo la influencia
    de la marihuana si su sangre contiene ¿qué cantidad de THC?
  choices:
    A: 1 nanogramo por mililitro
    B: 2 nanogramos por mililitro
    C: 5 nanogramos por mililitro
    D: 10 nanogramos por mililitro
  answer: C
  explanation: La ley de Montana establece un límite "per se" de 5 nanogramos de delta-9-tetrahidrocannabinol
    (THC) por mililitro de sangre para conducir bajo la influencia.
- id: 114
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado y este afecta su capacidad de
    conducir, ¿puede ser condenado por un DUI en Montana?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, las leyes de DUI solo se aplican al alcohol y a las drogas ilegales
    C: Sí, si el medicamento lo vuelve incapaz de operar un vehículo de manera segura
    D: Solo si también tiene alcohol en su sistema
  answer: C
  explanation: La ley de Montana establece que es ilegal conducir bajo la influencia
    de cualquier droga (recetada, de venta libre o ilícita) que haga que el conductor
    no sea seguro.
- id: 115
  category: alcohol_drugs_health
  question: ¿Qué es lo primero que se ve afectado por el consumo de alcohol?
  choices:
    A: La visión
    B: La coordinación
    C: El juicio
    D: El tiempo de reacción
  answer: C
  explanation: El juicio es la primera facultad que se ve afectada por el alcohol,
    lo que a menudo lleva a los conductores a creer que son capaces de conducir cuando
    no lo son.
- id: 116
  category: alcohol_drugs_health
  question: Tras una primera condena por DUI en Montana, ¿por cuánto tiempo se suspende
    típicamente la licencia de conducir?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Una condena por DUI por primera ofensa en Montana resulta en una suspensión
    de 6 meses de la licencia de conducir.
- id: 117
  category: alcohol_drugs_health
  question: Si un conductor menor de 21 años es condenado por una primera ofensa de
    "conducir después de consumir alcohol" (0.02% - 0.08% de BAC), ¿cuál es el periodo
    de suspensión de la licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Para una primera ofensa de conducir después de consumir alcohol siendo
    menor de 21 años, la sanción incluye una suspensión de la licencia de 90 días
    y una multa de $100 a $500.
- id: 118
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de combinar alcohol con otra droga, como un medicamento
    para el resfriado o marihuana?
  choices:
    A: Los efectos de ambos se cancelan entre sí
    B: Los efectos son los mismos que si solo hubiera tomado la droga
    C: El alcohol evita que la droga funcione
    D: El efecto combinado es mucho mayor que el efecto de cualquiera de los dos por
      separado
  answer: D
  explanation: Combinar alcohol con otras drogas crea un efecto sinérgico, lo que
    significa que el deterioro se multiplica significativamente y es mucho más peligroso.
- id: 119
  category: alcohol_drugs_health
  question: Si es condenado por un segundo DUI en Montana dentro de un periodo de
    10 años, ¿cuál es el tiempo mínimo obligatorio de cárcel?
  choices:
    A: 48 horas
    B: 7 días
    C: 30 días
    D: 6 meses
  answer: B
  explanation: Una segunda condena por DUI en Montana conlleva un mínimo obligatorio
    de 7 días de cárcel, aunque puede ser de hasta 1 año.
- id: 120
  category: alcohol_drugs_health
  question: Para una condena por DUI por primera ofensa en Montana, ¿cuál es el rango
    de la multa impuesta (excluyendo los costos judiciales)?
  choices:
    A: $100 a $500
    B: $300 a $600
    C: $600 a $1,000
    D: $1,000 a $5,000
  answer: C
  explanation: Un DUI por primera ofensa en Montana conlleva una multa de al menos
    $600 y no más de $1,000.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál es el umbral de concentración de alcohol en sangre (BAC) para un
    cargo de 'DUI agravado' en Montana?
  choices:
    A: 0.08% o superior
    B: 0.10% o superior
    C: 0.16% o superior
    D: 0.20% o superior
  answer: C
  explanation: En Montana, una persona puede ser acusada de DUI agravado si su concentración
    de alcohol en sangre (BAC) es de 0.16% o superior al momento de la infracción.
- id: 122
  category: alcohol_drugs_health
  question: La ley de 'recipiente abierto' (Open Container) de Montana prohíbe la
    posesión de un recipiente de bebida alcohólica abierto en ¿qué parte del vehículo?
  choices:
    A: Solo en el asiento del conductor
    B: Solo en el maletero
    C: En el área de pasajeros de un vehículo motorizado en una vía pública
    D: Detrás del último asiento vertical de un vehículo con puerta trasera (hatchback)
  answer: C
  explanation: Es ilegal poseer un recipiente de bebida alcohólica abierto en el área
    de pasajeros de un vehículo motorizado en una vía pública en Montana.
- id: 123
  category: alcohol_drugs_health
  question: 'Si un conductor de Montana es condenado por un DUI mientras un pasajero
    menor de 16 años está en el vehículo, la multa máxima y el tiempo de cárcel se:'
  choices:
    A: Triplican
    B: Duplican
    C: Aumentan en $500
    D: Mantienen igual
  answer: B
  explanation: La ley de Montana estipula que si una persona es condenada por DUI
    con un pasajero menor de 16 años, las multas mínimas y máximas y los términos
    de encarcelamiento se duplican.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de BAC para un conductor comercial que opera
    un vehículo motorizado comercial en Montana?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Los conductores comerciales están sujetos a un estándar más estricto
    y se consideran bajo la influencia si su concentración de alcohol en sangre (BAC)
    es de 0.04% o superior.
- id: 125
  category: alcohol_drugs_health
  question: 'Una segunda condena por DUI en Montana resulta en una suspensión obligatoria
    de la licencia de conducir de:'
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Una segunda condena por DUI en Montana conlleva una suspensión obligatoria
    de la licencia por 1 año.
- id: 126
  category: alcohol_drugs_health
  question: Si un conductor de Montana se niega a una prueba química por segunda vez
    en un plazo de 5 años, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 6 meses
    B: 1 año
    C: 18 meses
    D: 3 años
  answer: B
  explanation: Una segunda o subsiguiente negativa a una prueba química en un plazo
    de 5 años resulta en una suspensión de la licencia por 1 año sin disposición para
    una licencia de prueba restringida.
- id: 127
  category: alcohol_drugs_health
  question: En Montana, ¿es una defensa legal válida para un cargo de DUI si estaba
    usando una droga que le fue recetada por un médico?
  choices:
    A: Sí, siempre que tenga la receta con usted
    B: Sí, si el médico dijo que era seguro conducir
    C: No, si la droga lo incapacitó para operar un vehículo de manera segura
    D: Solo si la droga no es un narcótico
  answer: C
  explanation: La ley de Montana establece que el hecho de que una persona tenga o
    haya tenido derecho a usar una droga bajo las leyes del estado no es una defensa
    contra un cargo de conducir bajo la influencia (DUI).
- id: 128
  category: alcohol_drugs_health
  question: ¿Cómo afecta el consumo de alimentos antes o mientras se bebe alcohol
    al BAC de un conductor en Montana?
  choices:
    A: Evita que el conductor se intoxique
    B: Acelera el proceso de eliminación del alcohol del cuerpo
    C: Retrasa la absorción del alcohol en el torrente sanguíneo
    D: No tiene ningún efecto en los niveles de BAC
  answer: C
  explanation: La comida en el estómago retrasa la velocidad a la que el alcohol se
    absorbe en la sangre, pero no evita la intoxicación ni reduce el nivel final de
    BAC alcanzado.
- id: 129
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma de reducir su concentración
    de alcohol en sangre (BAC) antes de conducir?
  choices:
    A: Beber café negro cargado
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Permitir que pase el tiempo para que su cuerpo procese el alcohol
  answer: D
  explanation: Solo el tiempo permite que el cuerpo metabolice el alcohol. El café,
    las duchas y el ejercicio no aceleran el proceso de sobriedad.
- id: 130
  category: alcohol_drugs_health
  question: Según la ley de Montana, ¿quién tiene la autoridad para elegir qué prueba
    química (aliento, sangre u orina) se le administra a un conductor sospechoso de
    DUI?
  choices:
    A: El conductor
    B: El abogado del conductor
    C: El oficial de paz (policía)
    D: Un médico
  answer: C
  explanation: Según la ley de consentimiento implícito de Montana, el oficial de
    paz designa cuál de las pruebas (aliento, sangre u orina) se debe administrar.
- id: 131
  category: penalties_and_points
  question: ¿Si un conductor de Montana es declarado 'Infractor de Tráfico Habitual',
    por cuánto tiempo se le revoca su privilegio de conducir?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Una persona designada como Infractor de Tráfico Habitual (que acumula
    30 puntos en 3 años) se enfrenta a una revocación obligatoria de 3 años de su
    licencia de conducir.
- id: 132
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera infracción de la ley de envases
    abiertos de Montana?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Una persona condenada por violar la ley de envases abiertos de Montana
    (poseer una bebida alcohólica abierta en el área de pasajeros) puede ser multada
    con hasta $100.
- id: 133
  category: penalties_and_points
  question: En Montana, ¿cuántos puntos se asignan por una infracción estándar de
    exceso de velocidad que NO sea en una zona restringida?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: B
  explanation: Las infracciones estándar por exceso de velocidad en Montana suelen
    resultar en la adición de 2 puntos al historial del conductor.
- id: 134
  category: penalties_and_points
  question: Para una primera condena por DUI (conducir bajo la influencia) en Montana,
    ¿cuál es la sentencia mínima obligatoria de cárcel?
  choices:
    A: 12 horas
    B: 24 horas
    C: 48 horas
    D: 72 horas
  answer: B
  explanation: Una condena por DUI por primera vez en Montana conlleva una sentencia
    mínima obligatoria de cárcel de 24 horas, que puede extenderse hasta 6 meses.
- id: 135
  category: penalties_and_points
  question: ¿Cuál es la tarifa estándar requerida para restablecer una licencia de
    conducir de Montana después de haber sido suspendida o revocada?
  choices:
    A: $50
    B: $75
    C: $100
    D: $200
  answer: C
  explanation: Montana generalmente cobra una tarifa de restablecimiento de $100 para
    restaurar los privilegios de conducir después de una suspensión o revocación.
- id: 136
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan al historial de un conductor por 'No Ceder
    el Paso' (Failure to Yield) en Montana?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: A
  explanation: Una condena por no ceder el paso resulta en la adición de 2 puntos
    al historial de conducción de Montana.
- id: 137
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por abandonar la escena de un accidente que
    resulta en lesiones corporales en Montana?
  choices:
    A: 2 puntos
    B: 5 puntos
    C: 8 puntos
    D: 12 puntos
  answer: C
  explanation: Abandonar la escena de un accidente que involucre lesiones personales
    es una infracción grave en Montana y conlleva una penalización de 8 puntos.
- id: 138
  category: penalties_and_points
  question: La ley de Montana exige que todos los vehículos motorizados cuenten con
    un seguro de responsabilidad civil. ¿Cuál es la cobertura mínima requerida para
    daños a la propiedad en un solo accidente?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: Los requisitos mínimos de responsabilidad civil de Montana son 25/50/20,
    lo que incluye $20,000 para daños a la propiedad de terceros.
- id: 139
  category: penalties_and_points
  question: ¿Cuál es la multa máxima para una persona condenada por violar la ley
    de envases abiertos de Montana (poseer una bebida alcohólica abierta en el área
    de pasajeros)?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Una persona condenada por violar la ley de envases abiertos en Montana
    puede ser multada con hasta $100.
- id: 140
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por una condena de 'Conducción Descuidada'
    (Careless Driving) en Montana?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: A
  explanation: La conducción descuidada, junto con la mayoría de las infracciones
    de movimiento estándar como no ceder el paso o seguir demasiado de cerca, resulta
    en 2 puntos en Montana.
- id: 141
  category: penalties_and_points
  question: ¿En Montana, cuántos puntos se asignan por una condena de 'No ceder el
    paso a un vehículo de emergencia'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: A
  explanation: No ceder el derecho de paso, incluso a vehículos de emergencia, conlleva
    la asignación de 2 puntos en el historial de conducción de Montana.
- id: 142
  category: penalties_and_points
  question: Si se le condena por conducir mientras su licencia está suspendida o revocada
    en Montana, ¿cuál es la sentencia mínima obligatoria de cárcel por una primera
    infracción?
  choices:
    A: 24 horas
    B: 2 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: Según el MCA 61-5-212, una persona condenada por conducir con una licencia
    suspendida o revocada será castigada con una pena de prisión de no menos de 2
    días ni más de 6 meses.
- id: 143
  category: sharing_the_road
  question: Al acercarse a un autobús escolar desde cualquier dirección en Montana,
    ¿a qué distancia del autobús debe detenerse un conductor cuando sus luces rojas
    están parpadeando?
  choices:
    A: Al menos 10 pies
    B: Al menos 20 pies
    C: Al menos 30 pies
    D: Al menos 50 pies
  answer: C
  explanation: La ley de Montana exige que los conductores se detengan al menos a
    30 pies de un autobús escolar que esté recibiendo o dejando niños con sus luces
    rojas parpadeando.
- id: 144
  category: sharing_the_road
  question: 'En Montana, una persona que opera una bicicleta y se aproxima a una señal
    de alto debe:'
  choices:
    A: Detenerse siempre por completo durante al menos 3 segundos
    B: Reducir la velocidad y puede continuar sin detenerse si es seguro hacerlo
    C: Detenerse solo si hay vehículos motorizados presentes
    D: Bajarse de la bicicleta y cruzar la intersección caminando con ella
  answer: B
  explanation: La ley de Montana (MCA 61-8-607) permite a los ciclistas tratar las
    señales de alto como señales de ceder el paso, disminuyendo la velocidad y continuando
    sin detenerse si el camino está despejado.
- id: 145
  category: sharing_the_road
  question: A partir de 2021, la ley de Montana permite el 'filtrado de carriles'
    (lane filtering) para motocicletas. ¿Bajo qué condición se permite esto?
  choices:
    A: En cualquier carretera a cualquier velocidad
    B: Solo en autopistas cuando el tráfico se mueve al límite de velocidad
    C: Cuando el tráfico está detenido o se mueve lentamente, y la motocicleta no
      viaja a más de 20 mph
    D: Solo cuando la motocicleta es operada por un oficial de policía
  answer: C
  explanation: El MCA 61-8-359 permite el filtrado de carriles para motocicletas entre
    carriles de tráfico detenido o que se mueve lentamente a una velocidad que no
    exceda las 20 mph, siempre que las condiciones sean seguras.
- id: 146
  category: sharing_the_road
  question: Al seguir a un equipo de bomberos (camión de bomberos) en Montana que
    está respondiendo a una emergencia, ¿cuál es la distancia mínima de seguimiento
    permitida por la ley?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El MCA 61-8-364 prohíbe a los conductores seguir a un equipo de bomberos
    que se desplaza en respuesta a una alarma de incendio a una distancia menor de
    500 pies.
- id: 147
  category: sharing_the_road
  question: En Montana, ¿cuándo debe un conductor ceder el paso a un peatón que lleva
    un bastón blanco visible o que va acompañado por un perro guía?
  choices:
    A: Solo si el peatón está en un cruce de peatones marcado
    B: Solo si el peatón está en un semáforo
    C: En todo momento, ya que estos son indicadores de un peatón ciego o con discapacidad
      visual
    D: Solo durante las horas del día
  answer: C
  explanation: La ley de Montana exige que los conductores tomen todas las precauciones
    necesarias y cedan el derecho de paso a cualquier peatón que sea ciego o tenga
    una discapacidad visual y que utilice un bastón blanco o un perro guía.
- id: 148
  category: sharing_the_road
  question: 'Cuando un cortejo fúnebre es encabezado por una luz ámbar parpadeante
    o escoltado por la policía en Montana, los demás conductores deben:'
  choices:
    A: Ceder el derecho de paso a todos los vehículos del cortejo
    B: Solo ceder el paso al vehículo principal
    C: Rebasar al cortejo por la derecha
    D: Tocar la bocina para mostrar respeto
  answer: A
  explanation: Según la ley de Montana, los vehículos en un cortejo fúnebre tienen
    el derecho de paso en las intersecciones independientemente de los dispositivos
    de control de tráfico, siempre que el vehículo guía haya entrado legalmente.
- id: 149
  category: sharing_the_road
  question: ¿Qué es la 'Zona No' (No-Zone) en relación con los camiones grandes y
    los vehículos comerciales?
  choices:
    A: El área donde no se permite la circulación de camiones
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión donde el conductor no puede verlo
    C: La zona de velocidad restringida para camiones en Montana
    D: El área de límite de peso para puentes
  answer: B
  explanation: La 'Zona No' se refiere a los grandes puntos ciegos alrededor de un
    camión. Si no puede ver la cara del conductor del camión en sus espejos laterales,
    él no puede verlo a usted.
- id: 150
  category: sharing_the_road
  question: 'En Montana, cuando un autobús escolar se detiene en una carretera dividida
    con una mediana o barrera física, el tráfico que viaja en la dirección opuesta:'
  choices:
    A: Está obligado a detenerse al menos a 30 pies de distancia
    B: Está obligado a reducir la velocidad a 15 mph
    C: No está obligado a detenerse
    D: Está obligado a detenerse solo si hay niños cruzando la mediana
  answer: C
  explanation: De acuerdo con el MCA 61-8-351, el conductor de un vehículo en una
    carretera con calzadas separadas (divididas por una mediana o barrera física)
    no necesita detenerse al encontrarse o pasar a un autobús escolar que se encuentre
    en una calzada diferente.
- id: 151
  category: sharing_the_road
  question: Al rebasar una bicicleta en Montana, ¿cuál es la distancia de seguridad
    recomendada que un automovilista debe mantener entre el vehículo y la bicicleta?
  choices:
    A: Al menos 1 pie
    B: Al menos 3 pies
    C: Al menos 5 pies
    D: Al menos 10 pies
  answer: B
  explanation: Aunque la ley de Montana exige rebasar a una "distancia segura", el
    Manual del Conductor de Montana y las pautas de seguridad recomiendan al menos
    3 pies de espacio libre al rebasar a un ciclista.
- id: 152
  category: sharing_the_road
  question: 'Si está conduciendo y un vehículo de emergencia con sirena y luces intermitentes
    se aproxima por detrás, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Orillarse al borde derecho de la carretera y detenerse
    C: Acelerar para salir del camino
    D: Orillarse a la mediana izquierda
  answer: B
  explanation: La ley de Montana exige que los conductores cedan el paso (yield) orillándose
    lo más cerca posible al borde derecho o al acotamiento de la carretera y deteniéndose
    hasta que el vehículo de emergencia haya pasado.
- id: 153
  category: sharing_the_road
  question: ¿Por qué debería dejar más distancia de seguimiento al viajar detrás de
    una motocicleta?
  choices:
    A: Las motocicletas tienen una distancia de frenado mucho más corta que los autos
    B: Es más probable que las motocicletas excedan el límite de velocidad
    C: Las motocicletas deben detenerse en todas las intersecciones
    D: Las motocicletas son más ligeras y fáciles de rebasar
  answer: A
  explanation: Las motocicletas pueden detenerse mucho más rápido que los vehículos
    más grandes. Seguir demasiado de cerca (tailgating) puede resultar en una colisión
    por alcance si el motociclista frena repentinamente.
- id: 154
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión puede:'
  choices:
    A: Permanecer completamente en el carril derecho
    B: Abrirse hacia la izquierda para completar el giro
    C: Girar únicamente desde el carril izquierdo
    D: Detenerse y esperar a que el tráfico se despeje en ambas direcciones
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para no subir al bordillo al dar una vuelta a la derecha. Los conductores deben
    evitar "apretarse" entre el camión y el bordillo.
- id: 155
  category: sharing_the_road
  question: 'En Montana, los peatones tienen el derecho de paso:'
  choices:
    A: Solo en cruces peatonales marcados
    B: Solo cuando se muestra una señal de "Caminar" (Walk)
    C: Tanto en cruces peatonales marcados como no marcados en las intersecciones
    D: Solo si están cruzando una autopista
  answer: C
  explanation: La ley de Montana otorga a los peatones el derecho de paso en los cruces
    peatonales, ya sea que estén marcados con pintura o sean extensiones no marcadas
    de la acera en una intersección.
- id: 156
  category: sharing_the_road
  question: Al rebasar a una persona que monta una bicicleta en Montana, ¿cuál es
    la distancia mínima de seguridad que un automovilista debe mantener?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Montana (MCA 61-8-320) exige que los automovilistas proporcionen
    un mínimo de 3 pies de espacio libre al rebasar a una persona que monta una bicicleta.
- id: 157
  category: sharing_the_road
  question: En Montana, ¿cuál es el número máximo de motocicletas permitido para circular
    en paralelo (lado a lado) en un solo carril?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Four
  answer: B
  explanation: La ley de Montana permite que las motocicletas operen no más de dos
    en paralelo en un solo carril.
- id: 158
  category: sharing_the_road
  question: Cuando un peatón cruza la calle en un cruce peatonal no marcado en una
    intersección en Montana, ¿quién tiene el derecho de paso?
  choices:
    A: El automovilista, porque el cruce no está marcado
    B: El peatón
    C: El automovilista, pero solo durante las horas del día
    D: Quien haya llegado primero a la intersección
  answer: B
  explanation: En Montana, los peatones tienen el derecho de paso en todas las intersecciones,
    ya sea que el cruce peatonal esté marcado o no.
- id: 159
  category: sharing_the_road
  question: En Montana, ¿cuál es la multa máxima por una primera condena por no detenerse
    ante un autobús escolar con sus luces rojas intermitentes?
  choices:
    A: Hasta $100
    B: Hasta $250
    C: Hasta $500
    D: Hasta $1,000
  answer: C
  explanation: Según la ley de Montana, una persona condenada por no detenerse ante
    un autobús escolar puede ser multada con hasta $500 por una primera infracción.
- id: 160
  category: sharing_the_road
  question: Al encontrarse con un cortejo fúnebre en Montana, ¿cuál de las siguientes
    afirmaciones es verdadera?
  choices:
    A: Puede atravesar el cortejo si hay un espacio
    B: Debe ceder el derecho de paso a todo el cortejo
    C: Debe tocar la bocina para mostrar respeto
    D: Los cortejos deben seguir las reglas estándar de las señales de alto incluso
      si tienen escolta
  answer: B
  explanation: En Montana, los automovilistas deben ceder el derecho de paso a un
    cortejo fúnebre. Es ilegal conducir entre los vehículos de un cortejo o entrar
    en una intersección mientras pasa un cortejo, independientemente de los semáforos.
- id: 161
  category: sharing_the_road
  question: 'Según la ley de Montana, una bicicleta operada de noche debe estar equipada
    con una lámpara en la parte delantera que emita una luz blanca visible desde una
    distancia de al menos:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Código de Montana 61-8-607 exige que las bicicletas utilizadas de
    noche tengan una lámpara delantera visible desde 500 pies y un reflector rojo
    trasero visible desde 300 pies.
- id: 162
  category: sharing_the_road
  question: En Montana, ¿a cuántos pies debe mantenerse detrás de un camión de bomberos
    o aparato que esté respondiendo a una alarma?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Montana prohíbe a los conductores seguir a los aparatos de
    bomberos a menos de 500 pies cuando están respondiendo a una emergencia.
- id: 163
  category: sharing_the_road
  question: ¿Qué motociclistas están obligados por la ley de Montana a usar un casco
    protector?
  choices:
    A: Todos los motociclistas independientemente de su edad
    B: Solo los conductores menores de 18 años
    C: Solo los conductores con menos de 2 años de experiencia
    D: Solo los pasajeros, no el conductor
  answer: B
  explanation: La ley de Montana exige que cualquier persona menor de 18 años que
    opere o viaje en una motocicleta debe usar casco.
- id: 164
  category: sharing_the_road
  question: En Montana, si conduce un vehículo de movimiento lento y se forma una
    fila de ¿cuántos vehículos detrás de usted?, ¿debe detenerse en el primer apartadero
    (turnout) seguro?
  choices:
    A: 3 vehículos
    B: 5 vehículos
    C: 7 vehículos
    D: 10 vehículos
  answer: B
  explanation: El Código de Montana 61-8-311 establece que si se forma una fila de
    5 o más vehículos detrás de un vehículo de movimiento lento, el conductor debe
    detenerse en el apartadero seguro más cercano para dejarlos pasar.
- id: 165
  category: sharing_the_road
  question: 'Cuando un ciclista utiliza un carril de giro a la izquierda en una intersección
    en Montana, debe ser tratado como:'
  choices:
    A: Un peatón
    B: Una obstrucción que debe ser evitada
    C: Un vehículo
    D: Un intruso
  answer: C
  explanation: En Montana, los ciclistas tienen los mismos derechos y responsabilidades
    que los conductores de vehículos motorizados. Al usar un carril de giro, deben
    ser tratados como cualquier otro vehículo.
- id: 166
  category: sharing_the_road
  question: ¿Qué necesitan hacer a menudo los camiones grandes para completar un giro
    a la derecha en Montana?
  choices:
    A: Abrirse hacia la izquierda antes de girar a la derecha
    B: Detenerse y retroceder a mitad del giro
    C: Girar desde el carril del extremo izquierdo
    D: Aumentar la velocidad para mantener el impulso
  answer: A
  explanation: Debido a su longitud, los camiones grandes a menudo deben abrirse hacia
    la izquierda para no golpear la acera al girar a la derecha. Los conductores nunca
    deben intentar meterse entre un camión y la acera.
- id: 167
  category: vehicle_information
  question: 'En Montana, debe encender los faros delanteros si no puede ver claramente
    a personas o vehículos a una distancia de:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: Según el Manual del Conductor de Montana y el MCA 61-9-201, los faros
    deben usarse desde media hora después de la puesta del sol hasta media hora antes
    de la salida del sol, y en cualquier otro momento en que la visibilidad sea inferior
    a 500 pies.
- id: 168
  category: vehicle_information
  question: 'En Montana, al seguir a otro vehículo desde atrás por la noche, debe
    bajar las luces altas cuando se encuentre a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Montana (MCA 61-9-221) exige que los conductores cambien
    a luces bajas al seguir a otro vehículo a menos de 300 pies.
- id: 169
  category: vehicle_information
  question: ¿Entre qué fechas es legal usar neumáticos para nieve con clavos en las
    carreteras de Montana?
  choices:
    A: Del 1 de noviembre al 1 de abril
    B: Del 1 de octubre al 31 de mayo
    C: Del 15 de septiembre al 1 de mayo
    D: Del 15 de octubre al 15 de abril
  answer: B
  explanation: Según la ley de Montana (MCA 61-9-406), los neumáticos con clavos están
    permitidos solo del 1 de octubre al 31 de mayo de cada año.
- id: 170
  category: vehicle_information
  question: 'En Montana, los neumáticos se consideran inseguros y deben reemplazarse
    si la profundidad de la banda de rodadura es inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Las normas de seguridad de vehículos de Montana especifican que los
    neumáticos deben tener al menos 2/32 de pulgada de profundidad de banda de rodadura
    en todas las ranuras principales.
- id: 171
  category: vehicle_information
  question: 'Todo vehículo motorizado en Montana debe estar equipado con una bocina
    que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Según MCA 61-9-401, un vehículo motorizado debe tener una bocina en
    buen estado de funcionamiento capaz de emitir un sonido audible en condiciones
    normales desde una distancia no menor a 200 pies.
- id: 172
  category: vehicle_information
  question: 'La ley de Montana exige que el espejo retrovisor debe permitir al conductor
    ver la carretera por una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: MCA 61-9-404 establece que todo vehículo motorizado debe estar equipado
    con un espejo ubicado de tal manera que refleje al conductor una vista de la carretera
    por una distancia de al menos 200 pies hacia atrás.
- id: 173
  category: vehicle_information
  question: 'La luz trasera o una lámpara independiente en un vehículo en Montana
    debe iluminar la placa de matrícula trasera con una luz blanca para que sea legible
    desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: MCA 61-9-204 exige que la placa de matrícula trasera esté iluminada
    por una luz blanca para que sea claramente legible desde una distancia de 50 pies
    hacia atrás.
- id: 174
  category: vehicle_information
  question: ¿Según la ley de Montana, los frenos de servicio de un vehículo de pasajeros
    deben poder detener el vehículo en cuántos pies cuando viaja a 20 mph?
  choices:
    A: 15 pies
    B: 25 pies
    C: 35 pies
    D: 45 pies
  answer: B
  explanation: MCA 61-9-312 especifica que los vehículos de pasajeros deben tener
    un sistema de frenado capaz de detener el vehículo en un tramo de 25 pies desde
    una velocidad de 20 mph en una carretera seca, lisa y nivelada.
- id: 175
  category: vehicle_information
  question: ¿En Montana, cuál es el porcentaje mínimo de transmisión de luz permitido
    para las ventanas laterales delanteras de un vehículo motorizado?
  choices:
    A: 24%
    B: 35%
    C: 50%
    D: 70%
  answer: A
  explanation: Según MCA 61-9-405, el polarizado de las ventanas laterales delanteras
    debe permitir al menos un 24% de transmisión de luz (más o menos un 3%).
- id: 176
  category: vehicle_information
  question: 'Todo vehículo motorizado en Montana debe estar equipado con al menos
    dos luces traseras (a menos que haya sido fabricado antes de 1956) que sean visibles
    desde una distancia de:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: MCA 61-9-204 establece que las luces traseras deben estar montadas
    en la parte posterior y deben ser visibles desde una distancia de 500 pies hacia
    atrás.
- id: 177
  category: vehicle_information
  question: 'Se debe exhibir un emblema de ''Vehículo de movimiento lento'' en la
    parte trasera de cualquier vehículo en Montana que esté diseñado para y viaje
    a velocidades inferiores a:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: MCA 61-9-415 exige un emblema de vehículo de movimiento lento en los
    vehículos que normalmente viajan a velocidades inferiores a 25 millas por hora.
- id: 178
  category: vehicle_information
  question: 'En Montana, las luces de las señales de giro deben ser visibles bajo
    la luz solar normal desde una distancia no menor a:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: MCA 61-9-218 exige que las lámparas de señalización utilizadas para
    indicar un giro deben ser visibles desde una distancia no menor a 100 pies bajo
    la luz solar normal.
- id: 179
  category: vehicle_information
  question: Con respecto a los sistemas de escape, ¿cuál de las siguientes opciones
    prohíbe la ley de Montana?
  choices:
    A: Tubos de escape dobles
    B: Silenciadores con puntas cromadas
    C: Recortes o derivaciones del silenciador (muffler cutouts or bypasses)
    D: Sistemas de escape con salida lateral
  answer: C
  explanation: MCA 61-9-403 establece que todo vehículo motorizado debe estar equipado
    con un silenciador en buen estado de funcionamiento y prohíbe el uso de un recorte
    de silenciador, derivación o dispositivo similar.
- id: 180
  category: vehicle_information
  question: Si una carga se extiende más de cuántos pies más allá de la parte trasera
    de un vehículo en Montana, ¿se debe colocar una bandera roja (día) o una luz roja
    (noche) al final de la carga?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: MCA 61-9-213 exige que siempre que una carga se extienda hacia atrás
    4 pies o más más allá de la plataforma o carrocería de un vehículo, debe marcarse
    con una bandera roja durante el día y una luz roja por la noche.
- id: 181
  category: vehicle_information
  question: ¿Según la ley de Montana, cuándo debe encender los faros delanteros de
    su vehículo?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol
    B: Solo cuando esté lloviendo o nevando
    C: Desde media hora después de la puesta del sol hasta media hora antes de la
      salida del sol
    D: Solo cuando no pueda ver a 1,000 pies de distancia
  answer: C
  explanation: La ley de Montana (61-9-201, MCA) exige que los faros se enciendan
    desde media hora después de la puesta del sol hasta media hora antes de la salida
    del sol, y en cualquier otro momento en que la visibilidad sea inferior a 500
    pies.
- id: 182
  category: vehicle_information
  question: ¿Cuál es el tinte máximo permitido para las ventanas laterales inmediatamente
    a la derecha e izquierda del conductor en Montana?
  choices:
    A: Debe permitir el paso de al menos el 24% de la luz
    B: Debe permitir el paso de al menos el 35% de la luz
    C: Debe permitir el paso de al menos el 50% de la luz
    D: No se permite ningún tinte en las ventanas laterales
  answer: A
  explanation: La ley de Montana (61-9-405, MCA) especifica que el tinte de las ventanas
    laterales delanteras debe tener una transmisión de luz total no inferior al 24%.
- id: 183
  category: vehicle_information
  question: En Montana, todo vehículo motorizado debe estar equipado con un espejo
    que permita al conductor ver la carretera hacia atrás a una distancia de al menos
    ¿cuántos pies?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El Código de Montana 61-9-404 exige que los vehículos tengan un espejo
    ubicado para reflejar al conductor una vista de la carretera a una distancia de
    al menos 200 pies hacia atrás.
- id: 184
  category: vehicle_information
  question: Con respecto a los sistemas de escape de los vehículos en Montana, ¿cuál
    de los siguientes está prohibido?
  choices:
    A: Un silenciador que sea más nuevo que el equipo original
    B: Un recorte de silenciador (muffler cutout), derivación (bypass) o dispositivo
      similar
    C: Un tubo de escape que se extienda hasta la parte trasera del vehículo
    D: Un silenciador que reduzca el ruido del motor
  answer: B
  explanation: La ley de Montana (61-9-403, MCA) prohíbe el uso de un recorte de silenciador,
    derivación o dispositivo similar en un vehículo motorizado en una carretera.
- id: 185
  category: vehicle_information
  question: En Montana, cualquier remolque o semirremolque debe estar equipado con
    sistemas de frenado independientes si su peso bruto excede ¿cuántas libras?
  choices:
    A: 1,500 libras
    B: 2,000 libras
    C: 3,000 libras
    D: 5,000 libras
  answer: C
  explanation: Según el Código de Montana 61-9-301, todo remolque o semirremolque
    con un peso bruto de 3,000 libras o más debe estar equipado con frenos que actúen
    en todas las ruedas.
- id: 186
  category: vehicle_information
  question: ¿Qué tipo de vehículo está obligado por la ley de Montana a estar equipado
    con guardabarros o 'faldones' (mud flaps) para evitar que se arroje agua o piedras?
  choices:
    A: Todos los automóviles de pasajeros independientemente de su peso
    B: Solo motocicletas y ciclomotores
    C: Camiones, remolques o autobuses con una capacidad nominal del fabricante que
      exceda las 8,000 libras
    D: Solo vehículos con registros de fuera del estado
  answer: C
  explanation: El Código de Montana 61-9-407 exige guardabarros o faldones (mud flaps)
    para camiones, tractocamiones, remolques o autobuses con una capacidad que exceda
    las 8,000 libras de peso bruto vehicular (GVW).
- id: 187
  category: vehicle_information
  question: 'La bocina de un vehículo motorizado en Montana debe ser audible en condiciones
    normales desde una distancia no menor a:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: El Código de Montana 61-9-401 establece que una bocina debe ser audible
    en condiciones normales desde una distancia no menor a 200 pies.
- id: 188
  category: vehicle_information
  question: Las luces traseras de un vehículo en Montana deben ser rojas y visibles
    desde una distancia de ¿cuántos pies hacia atrás?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Código de Montana 61-9-204 exige que todo vehículo motorizado tenga
    al menos dos luces traseras (para vehículos fabricados después de 1956) que sean
    visibles desde una distancia de 500 pies hacia atrás.
- id: 189
  category: vehicle_information
  question: 'La luz que ilumina la placa de matrícula trasera debe hacer que la placa
    sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: Según el Código de Montana 61-9-204, la placa de matrícula trasera
    debe estar iluminada de modo que sea claramente legible desde una distancia de
    50 pies hacia atrás.
- id: 190
  category: signs_and_signals
  question: En Montana, ¿cuál es la señal manual correcta para indicar un giro a la
    derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba en un ángulo de 90 grados
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: Según el Manual del Conductor de Montana, un giro a la derecha se indica
    extendiendo el brazo izquierdo por la ventana y apuntando hacia arriba en un ángulo
    de 90 grados.
- id: 191
  category: signs_and_signals
  question: 'Una señal en forma de banderín (triángulo isósceles que apunta a la derecha)
    situada en el lado izquierdo de la carretera en Montana indica:'
  choices:
    A: Una zona escolar más adelante
    B: Un requisito de ceder el paso
    C: El inicio de una zona de no rebasar (no adelantar)
    D: Un cruce de ferrocarril
  answer: C
  explanation: En Montana y en todo EE. UU., se coloca una señal en forma de banderín
    en el lado izquierdo de la carretera para marcar el comienzo de una zona donde
    está prohibido adelantar o rebasar a otros vehículos.
- id: 192
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico amarilla intermitente en una intersección
    de Montana?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Disminuir la velocidad y proceder con precaución
    C: La luz está a punto de cambiar a rojo; despeje la intersección
    D: Ceder el paso a todo el tráfico, incluso si usted tiene la preferencia
  answer: B
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y proceder con cuidado, manteniéndose alerta ante posibles peligros o tráfico
    que cruce.
- id: 193
  category: signs_and_signals
  question: 'En Montana, una línea blanca continua pintada en el pavimento entre los
    carriles de tráfico significa:'
  choices:
    A: Puede cambiar de carril siempre que sea seguro
    B: La carretera es una calle de un solo sentido
    C: Debe permanecer en su carril; se desaconseja el cambio de carril
    D: Se permite adelantar únicamente por la derecha
  answer: C
  explanation: Las líneas blancas continuas se utilizan para desaconsejar los cambios
    de carril en áreas donde podrían ser peligrosos, como cerca de intersecciones
    o rampas de salida.
- id: 194
  category: signs_and_signals
  question: ¿Cuál es la forma estándar para una señal de zona escolar o de cruce escolar
    en Montana?
  choices:
    A: Diamante (Rombo)
    B: Círculo
    C: Pentágono (cinco lados)
    D: Octágono
  answer: C
  explanation: Las señales de zona escolar y de cruce escolar tienen forma de pentágono
    (cinco lados) y suelen ser de color amarillo-verde fluorescente.
- id: 195
  category: signs_and_signals
  question: Cuando ve un 'Carril Central Compartido' marcado con líneas amarillas
    continuas y discontinuas en ambos lados, ¿cuál es su propósito principal?
  choices:
    A: Adelantar al tráfico más lento en una carretera de dos carriles
    B: Estacionamiento de emergencia únicamente
    C: Realizar giros a la izquierda desde cualquier dirección
    D: Viaje de vehículos de alta ocupación (HOV)
  answer: C
  explanation: Los carriles centrales compartidos están reservados para que los vehículos
    que viajan en cualquier dirección realicen giros a la izquierda, y no deben usarse
    para adelantar ni para circular de forma continua.
- id: 196
  category: signs_and_signals
  question: 'Según la ley de Montana, usted puede girar a la derecha con luz roja
    después de una parada completa EXCEPTO:'
  choices:
    A: Durante las horas pico de mayor tráfico
    B: Si hay una señal que lo prohíba
    C: Si se encuentra en una zona residencial
    D: Si ha estado detenido por más de 30 segundos
  answer: B
  explanation: La ley de Montana permite a los conductores girar a la derecha en rojo
    después de detenerse por completo y ceder el paso a peatones y otros vehículos,
    a menos que una señal prohíba específicamente el giro.
- id: 197
  category: signs_and_signals
  question: 'Una señal amarilla en forma de diamante con una ''X'' negra y las letras
    ''RR'' indica:'
  choices:
    A: Un área de descanso a 2 millas de distancia
    B: Una intersección de camino rural
    C: Un cruce de ferrocarril más adelante
    D: Una zona de reparación de carreteras
  answer: C
  explanation: La señal amarilla redonda o en forma de diamante con una 'X' negra
    y las letras 'RR' es una señal de advertencia de que se está aproximando a un
    cruce de ferrocarril.
- id: 198
  category: signs_and_signals
  question: En Montana, ¿qué significa una señal de flecha roja fija?
  choices:
    A: Puede girar en la dirección de la flecha después de detenerse
    B: Debe detenerse y no puede girar en la dirección de la flecha
    C: Ceda el paso al tráfico que viene en sentido contrario antes de girar
    D: La flecha está a punto de cambiar a verde
  answer: B
  explanation: Una flecha roja fija significa que debe detenerse y permanecer detenido.
    No puede realizar un giro en la dirección indicada por la flecha roja.
- id: 199
  category: signs_and_signals
  question: ¿Qué representa una señal naranja triangular con un borde rojo cuando
    está fijada en la parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo tiene una carga ancha
    C: El vehículo es de movimiento lento (viaja a 25 mph o menos)
    D: El vehículo es conducido por un estudiante
  answer: C
  explanation: El emblema de vehículo de movimiento lento es un triángulo naranja
    reflectante con borde rojo, utilizado en vehículos como tractores o equipo de
    construcción que circulan a velocidades de 25 mph o menos.
- id: 200
  category: signs_and_signals
  question: 'Una luz roja intermitente en una intersección en Montana tiene el mismo
    significado que:'
  choices:
    A: Una señal de ceder el paso
    B: Una señal de alto (pare)
    C: Una señal de precaución
    D: Una señal de zona de construcción
  answer: B
  explanation: Una luz roja intermitente requiere una parada completa. Puede proceder
    solo después de ceder el paso a otros vehículos y peatones, exactamente igual
    que en una señal de alto.
- id: 201
  category: signs_and_signals
  question: ¿Cuál de estas es la señal manual correcta para 'Reducir la velocidad
    o Detenerse' en Montana?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho moviéndose hacia el suelo
  answer: C
  explanation: Para indicar que está reduciendo la velocidad o deteniéndose mediante
    señales manuales, extienda el brazo izquierdo por la ventana y apunte hacia abajo
    con la palma de la mano hacia atrás.
- id: 202
  category: signs_and_signals
  question: 'En Montana, las líneas amarillas continuas dobles en el centro de la
    carretera significan:'
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Se prohíbe rebasar desde cualquier dirección
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas continuas dobles indican que no se permite rebasar
    al tráfico que circula en ninguna de las dos direcciones.
- id: 203
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico amarilla intermitente en Montana?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Acelerar para despejar la intersección
    C: Proceder con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y proceder con precaución, manteniéndose alerta ante posibles peligros.
- id: 204
  category: signs_and_signals
  question: Cuando ve un emblema de 'Vehículo de movimiento lento' (un triángulo naranja
    con una franja roja en cada lado) en la parte trasera de un vehículo, ¿significa
    que el vehículo viaja a qué velocidad?
  choices:
    A: 35 mph o menos
    B: 25 mph o menos
    C: 15 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio en los vehículos
    que viajan a velocidades de 25 mph o menos, como maquinaria agrícola o equipo
    de construcción.
- id: 205
  category: signs_and_signals
  question: En Montana, ¿cuál es el límite de velocidad predeterminado en un distrito
    residencial si no hay señales publicadas?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: A menos que se indique lo contrario, el límite de velocidad en los
    distritos residenciales de Montana es de 25 mph.
- id: 206
  category: signs_and_signals
  question: Una luz de tráfico amarilla fija significa que la señal está a punto de
    cambiar a rojo. ¿Qué debe hacer un conductor en Montana?
  choices:
    A: Detenerse si es seguro hacerlo
    B: Acelerar para ganarle a la luz roja
    C: Detenerse siempre, incluso si está en medio de la intersección
    D: Tocar la bocina para advertir a otros conductores
  answer: A
  explanation: Una luz amarilla fija indica que la luz está cambiando a rojo. Debe
    detenerse si puede hacerlo de manera segura; de lo contrario, cruce la intersección
    con precaución.
- id: 207
  category: signs_and_signals
  question: 'Para indicar un giro a la derecha mediante señales manuales, un conductor
    en Montana debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera de la ventana
    B: Extender el brazo izquierdo hacia afuera y doblarlo hacia arriba por el codo
    C: Extender el brazo izquierdo hacia afuera y doblarlo hacia abajo por el codo
    D: Extender el brazo derecho recto hacia afuera de la ventana
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido hacia afuera de la ventana y doblado hacia arriba en un ángulo de 90
    grados.
- id: 208
  category: signs_and_signals
  question: ¿Cuál es el significado de una luz de tráfico roja intermitente en Montana?
  choices:
    A: Reducir la velocidad y ceder el paso a todo el tráfico
    B: La luz está descompuesta; proceda con precaución
    C: Detenerse por completo y proceder solo cuando sea seguro
    D: Detenerse y esperar a que la luz cambie a verde
  answer: C
  explanation: Una luz roja intermitente se trata igual que una señal de alto (stop).
    Debe detenerse por completo y ceder el derecho de paso antes de continuar.
- id: 209
  category: signs_and_signals
  question: ¿Para cuál de los siguientes propósitos está destinado un 'Carril central
    compartido' (marcado por líneas amarillas continuas y discontinuas)?
  choices:
    A: Rebasar tráfico más lento
    B: Solo para estacionamiento de emergencia
    C: Solo para realizar giros a la izquierda
    D: Solo para vehículos de alta ocupación
  answer: C
  explanation: Los carriles centrales compartidos están reservados para realizar giros
    a la izquierda y no pueden usarse para rebasar o para circular de paso.
- id: 210
  category: signs_and_signals
  question: En Montana, ¿qué forma tiene una señal estándar de 'Zona escolar' o 'Cruce
    escolar'?
  choices:
    A: Diamante
    B: Octágono
    C: Pentágono
    D: Círculo
  answer: C
  explanation: Las señales de advertencia relacionadas con la escuela tienen cinco
    lados (pentágono) y suelen ser de color amarillo verdoso fluorescente.
- id: 211
  category: signs_and_signals
  question: ¿Qué indica una línea blanca continua entre carriles de tráfico que se
    mueven en la misma dirección?
  choices:
    A: Usted está en una calle de sentido único
    B: Debe permanecer en su carril y evitar cambiar de carril
    C: Debe girar en la próxima intersección
    D: Se recomienda rebasar
  answer: B
  explanation: Una línea blanca continua indica que se desaconseja cambiar de carril
    por razones de seguridad, aunque no está estrictamente prohibido como una línea
    continua doble.
- id: 212
  category: signs_and_signals
  question: ¿Cuál es el color estándar para las señales de advertencia de construcción
    y mantenimiento en Montana?
  choices:
    A: Amarillo
    B: Rojo
    C: Naranja
    D: Verde
  answer: C
  explanation: El naranja es el color de fondo estándar para las señales en zonas
    de obra para alertar a los conductores sobre actividades de construcción o mantenimiento.
- id: 213
  category: signs_and_signals
  question: En Montana, si está girando a la izquierda en una intersección y el semáforo
    muestra una 'flecha' verde apuntando a la izquierda, ¿qué significa esto?
  choices:
    A: Debe ceder el paso al tráfico en sentido contrario antes de girar
    B: Usted tiene un giro protegido y el tráfico en sentido contrario está detenido
    C: Debe esperar a una luz verde circular antes de girar
    D: El giro está prohibido
  answer: B
  explanation: Una flecha verde significa que tiene un giro 'protegido', lo que significa
    que el tráfico en sentido contrario debería estar detenido por una luz roja.
- id: 214
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de banderín (triángulo lateral)
    colocada en el lado izquierdo de la carretera?
  choices:
    A: Ceder el paso
    B: Zona escolar más adelante
    C: Zona de no rebasar
    D: Fin de la construcción
  answer: C
  explanation: Una señal en forma de banderín se utiliza específicamente para marcar
    el inicio de una 'Zona de no rebasar' y se coloca en el lado izquierdo de la carretera
    para una mejor visibilidad.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 215
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 216
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 217
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debería hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 218
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 219
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 220
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Dar una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 221
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite dar la vuelta en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 222
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal amarilla en forma de banderín con letras negras que dice
    "NO PASSING ZONE" significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 223
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Gire a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "KEEP RIGHT" (Manténgase a la derecha)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 224
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 225
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 226
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de caminata cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 227
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 228
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 229
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de ferrocarril se coloca en los
    cruces de tren. Significa que debe ceder el paso a los trenes. Si se acerca un
    tren, debe detenerse.
  id: 230
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    sobre una curva en el camino más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 231
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte sobre un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 232
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que el camino gire
    primero en un sentido y luego en el otro.
  id: 233
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte sobre una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 234
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 235
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: El carril termina
    D: Fin de la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Prepárese para una reducción en el ancho de la carretera y ajuste
    su posición en el carril.
  id: 236
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: El camino termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que el camino más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 237
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 238
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 239
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: El camino puede estar resbaladizo cuando está mojado
    C: Camino sinuoso más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 240
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en el camino
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción en la carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 241
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un puesto de control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo
    donde el semáforo puede no ser visible desde la distancia.
  id: 242
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (pare) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 243
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde los caminos laterales.
  id: 244
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la autopista desde el camino lateral.
  id: 245
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir una incorporación (merging). El tráfico que entra desde
    la rampa tiene su propio carril nuevo.
  id: 246
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer de pie o en ralentí
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 247
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que muestren un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de estacionamiento para discapacitados válido pueden estacionarse
    en estos espacios. Las infracciones conllevan multas elevadas.
  id: 248
