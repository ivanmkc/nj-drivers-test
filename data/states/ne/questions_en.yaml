metadata:
  source: 2025 Nebraska Driver's Manual
  total_questions: 253
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Nebraska, what is the minimum age to apply for a Learner's Permit (LPD)?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 years and 6 months old
    D: 16 years old
  answer: B
  explanation: According to the Nebraska DMV, the minimum age to apply for a Learner's
    Permit (LPD) is 15 years old.
- id: 2
  category: license_system
  question: How long must a Nebraska teen hold a Learner's Permit (LPD) before they
    are eligible to apply for a Provisional Operator's Permit (POP)?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: An individual must hold an LPD, LPE, or SCP for at least six months
    prior to applying for a POP.
- id: 3
  category: license_system
  question: Under Nebraska's GDL laws, what is the curfew for a driver holding a Provisional
    Operator's Permit (POP)?
  choices:
    A: 10 PM to 5 AM
    B: 11 PM to 6 AM
    C: 12 AM to 6 AM
    D: 1 AM to 5 AM
  answer: C
  explanation: POP holders are restricted from driving between 12 AM and 6 AM unless
    they are driving to or from school or work.
- id: 4
  category: license_system
  question: For the first six months of holding a POP, how many passengers under age
    19 (who are not immediate family) is the driver allowed to transport?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: During the first six months of holding a POP, the driver may only transport
    one passenger under age 19 who is not an immediate family member.
- id: 5
  category: license_system
  question: To qualify for a School Permit (SCP) in Nebraska, the applicant must live
    outside a city of 5,000 or more, or attend a school outside a city of 5,000 or
    more, and live how far from school?
  choices:
    A: At least 1 mile
    B: At least 1.5 miles
    C: At least 2 miles
    D: At least 5 miles
  answer: B
  explanation: The applicant must reside more than 1.5 miles or more from the school
    they attend to be eligible for an SCP.
- id: 6
  category: license_system
  question: If you change your name or address, you must apply for a replacement Nebraska
    license within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: Nebraska law requires that you notify the DMV of a name or address
    change and obtain a replacement license within 60 days.
- id: 7
  category: license_system
  question: Under the Nebraska point system, your driver's license will be revoked
    if you accumulate how many points within a two-year period?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: Nebraska law mandates the revocation of driving privileges if a driver
    accumulates 12 points in any two-year period.
- id: 8
  category: license_system
  question: What is the 'Zero Tolerance' Blood Alcohol Concentration (BAC) limit for
    drivers under the age of 21 in Nebraska?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Nebraska's Zero Tolerance law makes it unlawful for anyone under 21
    to operate a vehicle with a BAC of 0.02% or higher.
- id: 9
  category: license_system
  question: A Provisional Operator's Permit (POP) expires on the holder's 18th birthday.
    When can the holder apply for a full Class O Operator's license?
  choices:
    A: On their 17th birthday, if they have held the POP for at least 12 months without
      3 or more points
    B: Only on their 18th birthday
    C: On their 16th birthday
    D: After 6 months of holding a POP
  answer: A
  explanation: A POP holder is eligible for a Class O license at age 17 if they have
    held the POP for at least 12 months and have not accumulated three or more points
    in the previous 12 months.
- id: 10
  category: license_system
  question: To be eligible for a POP, an applicant must not have accumulated more
    than how many points on their driving record in the six months immediately preceding
    the application?
  choices:
    A: 0 points
    B: 1 point
    C: 2 points
    D: 3 points
  answer: D
  explanation: Applicants for a POP must not have accumulated three or more points
    on their driving record during the six-month period immediately preceding the
    application date.
- id: 11
  category: license_system
  question: In Nebraska, how many points can be removed from your driving record by
    successfully completing a DMV-approved Driver Safety Course?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Drivers may complete a DMV-approved Driver Safety Course once every
    five years to have 2 points reduced from their driving record.
- id: 12
  category: license_system
  question: What are the minimum liability insurance requirements for a motor vehicle
    in Nebraska?
  choices:
    A: 15/30/10 ($15k bodily injury per person, $30k per accident, $10k property damage)
    B: 25/50/25 ($25k bodily injury per person, $50k per accident, $25k property damage)
    C: 50/100/50 ($50k bodily injury per person, $100k per accident, $50k property
      damage)
    D: 10/20/10 ($10k bodily injury per person, $20k per accident, $10k property damage)
  answer: B
  explanation: Nebraska law requires minimum liability coverage of $25,000 for bodily
    injury to one person, $50,000 for bodily injury to two or more people in one accident,
    and $25,000 for property damage.
- id: 13
  category: license_system
  question: How long is a standard Nebraska Class O (Operator's) license valid for
    an individual aged 21 or older?
  choices:
    A: 2 years
    B: 4 years
    C: 5 years
    D: 8 years
  answer: C
  explanation: A standard Nebraska driver's license (Class O) is valid for five years.
- id: 14
  category: license_system
  question: If you are under 18 and applying for a POP, which of the following is
    required regarding the 50-hour driving practice requirement?
  choices:
    A: All 50 hours must be during daylight
    B: At least 10 of the 50 hours must be at night
    C: At least 20 of the 50 hours must be on highways
    D: No night driving is required
  answer: B
  explanation: Applicants for a POP must complete 50 hours of driving practice, at
    least 10 of which must be at night, certified by a parent or guardian.
- id: 15
  category: license_system
  question: A Nebraska Learner's Permit-School (LPE) is valid for what length of time?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: A
  explanation: According to the Nebraska Driver's Manual, a Learner's Permit-School
    (LPE) is valid for three months and may be renewed.
- id: 16
  category: license_system
  question: How many days prior to the expiration date are you allowed to renew your
    Nebraska driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Nebraska law allows drivers to renew their license up to 90 days prior
    to the expiration date.
- id: 17
  category: license_system
  question: New residents to Nebraska must obtain a Nebraska driver's license within
    how many days of establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents are required to obtain a Nebraska driver's license within
    30 days of establishing residency in the state.
- id: 18
  category: license_system
  question: What is the reinstatement fee for a Nebraska driver's license that has
    been revoked due to the accumulation of too many points?
  choices:
    A: 50 dollars
    B: 75 dollars
    C: 100 dollars
    D: 125 dollars
  answer: D
  explanation: The Nebraska DMV requires a $125 reinstatement fee for licenses revoked
    under the point system or for DUI violations.
- id: 19
  category: license_system
  question: To meet the vision requirements for a Nebraska driver's license, an applicant
    must have at least what visual acuity in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: The minimum vision requirement for a Nebraska driver's license is 20/40
    with or without corrective lenses.
- id: 20
  category: license_system
  question: How long do points remain on your Nebraska driving record from the date
    of the violation?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: In Nebraska, points stay on your driving record for a period of two
    years from the date of the violation.
- id: 21
  category: license_system
  question: If you are issued an Ignition Interlock Permit (IIP), which of the following
    is true?
  choices:
    A: You may only drive during daylight hours
    B: You may only drive to and from work
    C: You may only operate a vehicle equipped with an ignition interlock device
    D: You may only drive with a licensed adult over age 21
  answer: C
  explanation: An Ignition Interlock Permit (IIP) allows an individual to operate
    a motor vehicle only if it is equipped with a functional ignition interlock device.
- id: 22
  category: license_system
  question: Which of the following is true regarding organ and tissue donation on
    a Nebraska driver's license?
  choices:
    A: You must be 21 to register as a donor
    B: You can only register as a donor at the time of your first license issuance
    C: The 'Donation' symbol will be placed on the front of your license if you choose
      to be a donor
    D: You must provide a doctor's note to become a donor
  answer: C
  explanation: When you choose to be an organ and tissue donor in Nebraska, a heart-shaped
    'Donation' symbol is placed on the front of your license.
- id: 23
  category: license_system
  question: Under the 'Motor Voter' law, Nebraska residents can do which of the following
    at the DMV?
  choices:
    A: Cast a ballot in a local election
    B: Apply to register to vote or update voter registration
    C: Pay property taxes
    D: Apply for a passport
  answer: B
  explanation: The National Voter Registration Act (Motor Voter) allows individuals
    to apply to register to vote or update their registration when applying for or
    renewing a driver's license.
- id: 24
  category: license_system
  question: What is the minimum age required to apply for a Nebraska Commercial Driver's
    License (CDL) to operate in interstate commerce?
  choices:
    A: '18'
    B: '19'
    C: '20'
    D: '21'
  answer: D
  explanation: While you can obtain a CDL for intrastate (within Nebraska) commerce
    at 18, you must be at least 21 years old to operate a commercial vehicle in interstate
    commerce.
- id: 25
  category: license_system
  question: A Medical Hardship Permit (MHP) in Nebraska is specifically designed for
    which purpose?
  choices:
    A: To allow a driver to go to the pharmacy only
    B: To allow a driver with a physical disability to drive a modified vehicle
    C: To allow driving for medical treatments when no other transportation is available
    D: To allow a driver to skip the vision test
  answer: C
  explanation: The Medical Hardship Permit (MHP) is available to individuals whose
    licenses are suspended and who have no other transportation to receive necessary
    medical care for themselves or their family.
- id: 26
  category: license_system
  question: Which of the following is true regarding Nebraska State Identification
    Cards and Driver's Licenses?
  choices:
    A: You may hold both a valid license and a state ID card simultaneously
    B: You cannot hold both a valid Nebraska driver's license and a Nebraska state
      ID card
    C: A state ID card allows you to drive in emergencies
    D: State ID cards are only for residents over age 65
  answer: B
  explanation: Nebraska law prohibits a person from holding both a valid Nebraska
    driver's license and a Nebraska state ID card at the same time.
- id: 27
  category: license_system
  question: If a Nebraska resident is on active duty in the military, their driver's
    license remains valid until how many days after their discharge?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: The license of a person on active duty in the military (and their family
    members) remains valid until 60 days after their discharge or return to the state.
- id: 28
  category: driver_testing
  question: In Nebraska, what is the maximum speed limit on rural Interstate highways
    unless otherwise posted?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: C
  explanation: According to the Nebraska Driver's Manual, the maximum speed limit
    on rural Interstate highways is 75 mph unless otherwise posted.
- id: 29
  category: driver_testing
  question: Under the Nebraska point system, how many points are assessed for speeding
    11 through 15 mph over the limit?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Nebraska assesses 1 point for 1-5 mph over, 2 points for 6-10 mph over,
    and 3 points for 11-15 mph over the limit.
- id: 30
  category: driver_testing
  question: 'Nebraska law requires drivers to file a Driver''s Motor Vehicle Accident
    Report if an accident results in injury, death, or property damage to one person''s
    property in excess of:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: If an accident results in bodily injury, death, or property damage
    of $1,500 or more to any one person's property, a report must be filed with the
    Department of Transportation within 10 days.
- id: 31
  category: driver_testing
  question: When driving at night in Nebraska, you must switch from high beam to low
    beam headlights when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Nebraska law requires drivers to dim high beams to low beams when within
    500 feet of an oncoming vehicle.
- id: 32
  category: driver_testing
  question: In Nebraska, when following another vehicle at night, you must use low
    beam headlights when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Drivers must use low beam headlights when following another vehicle
    within 200 feet.
- id: 33
  category: driver_testing
  question: When intending to turn, Nebraska law requires you to signal continuously
    for at least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: The Nebraska Driver's Manual states that a signal of intention to turn
    right or left shall be given continuously during not less than the last 100 feet
    traveled by the vehicle before turning.
- id: 34
  category: driver_testing
  question: On a highway with at least two lanes of traffic in the same direction,
    Nebraska's 'Move Over' law requires drivers to do what when approaching a stopped
    emergency vehicle with flashing lights?
  choices:
    A: Stop completely until the emergency vehicle leaves
    B: Move into a lane at least one lane away from the vehicle if safe to do so
    C: Maintain speed but honk to alert the emergency workers
    D: Speed up to pass the scene as quickly as possible
  answer: B
  explanation: Nebraska law requires drivers to move over to an adjacent lane or slow
    down to a safe speed if a lane change is not possible when approaching stopped
    emergency or road assistance vehicles.
- id: 35
  category: driver_testing
  question: When parking a vehicle facing uphill on a two-way street with a curb,
    how should the front wheels be turned?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the right
  answer: B
  explanation: When parking uphill with a curb, you should turn your wheels away from
    the curb so the vehicle will roll into the curb if the brakes fail.
- id: 36
  category: driver_testing
  question: In Nebraska, what is the recommended following distance behind the vehicle
    in front of you under normal conditions?
  choices:
    A: 1 car length
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Nebraska Driver's Manual recommends using the 'three-second rule'
    to maintain a safe following distance under normal driving conditions.
- id: 37
  category: driver_testing
  question: When a school bus is stopped on a roadway with its stop signal arm extended
    and red lights flashing, which drivers must stop?
  choices:
    A: Only drivers following the bus
    B: Only drivers approaching from the front
    C: All drivers approaching from any direction, unless on a divided highway with
      a median
    D: No one is required to stop if there are more than two lanes
  answer: C
  explanation: In Nebraska, all drivers must stop for a school bus with flashing red
    lights and an extended stop arm, unless they are traveling in the opposite direction
    on a divided highway separated by a median or visual barrier.
- id: 38
  category: driver_testing
  question: What is the first-offense penalty for a driver over 21 convicted of DUI
    in Nebraska with a BAC between .08 and .15?
  choices:
    A: Mandatory 1-year jail sentence
    B: 6-month license revocation and a fine
    C: Permanent loss of driving privileges
    D: A verbal warning and a $50 fine
  answer: B
  explanation: A first-offense DUI in Nebraska (standard BAC) typically results in
    a 6-month license revocation, a $500 fine, and 7 to 60 days in jail (though probation
    may be offered).
- id: 39
  category: driver_testing
  question: When passing a bicycle in Nebraska, what is the minimum safe distance
    a motorist should maintain between the vehicle and the bicycle?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: Nebraska law requires motorists to leave a safe distance when passing
    a bicycle, which is generally defined as at least 3 feet of clearance.
- id: 40
  category: driver_testing
  question: To use a hand signal to indicate a right turn, how should the driver's
    arm be positioned?
  choices:
    A: Arm extended straight out the window
    B: Arm extended upward
    C: Arm extended downward
    D: Arm waving in a circular motion
  answer: B
  explanation: A right turn is signaled by extending the left arm out the window and
    bending it upward at the elbow.
- id: 41
  category: driver_testing
  question: At an intersection with no stop signs or signals (uncontrolled intersection),
    which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling faster
    D: The driver who honks first
  answer: B
  explanation: In Nebraska, when two vehicles reach an uncontrolled intersection at
    approximately the same time, the driver on the left must yield to the driver on
    the right.
- id: 42
  category: driver_testing
  question: When taking the Nebraska driving skills test, which of the following must
    the applicant provide for the vehicle being used?
  choices:
    A: A letter from the manufacturer
    B: A full tank of premium gasoline
    C: Current proof of insurance and registration
    D: A spare tire and a jack
  answer: C
  explanation: For the Nebraska road test, the applicant must provide a vehicle that
    is in safe operating condition and present valid proof of registration and Nebraska
    liability insurance for that vehicle.
- id: 43
  category: driver_testing
  question: In a Nebraska business or residential district, how many feet before making
    a turn must you signal?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Nebraska law requires drivers to signal at least 100 feet before turning
    in a business or residential district. On highways, the requirement is 500 feet.
- id: 44
  category: driver_testing
  question: The Nebraska Driver's Manual recommends maintaining a following distance
    of at least how many seconds behind the vehicle in front of you?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 5 seconds
    D: 10 seconds
  answer: B
  explanation: Nebraska recommends the 'three-second rule' to maintain a safe following
    distance under normal driving conditions.
- id: 45
  category: driver_testing
  question: 'In Nebraska, a crash report (DOT Form 41) must be filed with the Department
    of Transportation if an accident results in injury, death, or property damage
    to any one person exceeding:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Drivers involved in a crash resulting in injury, death, or property
    damage of $1,500 or more to any one person must file a report within 10 days.
- id: 46
  category: driver_testing
  question: 'Nebraska law requires that headlights be used when visibility is less
    than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: B
  explanation: Headlights must be used from sunset to sunrise and at any time when
    visibility is less than 500 feet due to weather or other conditions.
- id: 47
  category: driver_testing
  question: 'Under Nebraska''s Implied Consent Law, if a driver refuses to submit
    to a chemical test for alcohol or drugs, their license will be automatically revoked
    for:'
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: Refusal to submit to a chemical test under the Implied Consent Law
    results in a mandatory one-year license revocation.
- id: 48
  category: driver_testing
  question: In Nebraska, children must be secured in a federally approved child safety
    seat until they reach what age?
  choices:
    A: 6 years old
    B: 8 years old
    C: 10 years old
    D: 12 years old
  answer: B
  explanation: Nebraska law requires all children up to age 8 to ride in a federally
    approved child safety seat.
- id: 49
  category: driver_testing
  question: In Nebraska, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: Drivers are prohibited from parking within 15 feet of a fire hydrant
    in Nebraska.
- id: 50
  category: driver_testing
  question: Nebraska's 'Move Over Law' requires drivers to move to an adjacent lane
    or slow down when passing which type of stopped vehicle with flashing lights?
  choices:
    A: Only police cars
    B: Only ambulances and fire trucks
    C: Emergency, tow, and maintenance vehicles
    D: Any vehicle with hazard lights
  answer: C
  explanation: The law requires drivers to move over or slow down for any stopped
    emergency vehicle, tow truck, or highway maintenance vehicle displaying flashing
    lights.
- id: 51
  category: driver_testing
  question: 'When passing a bicycle in Nebraska, a motorist must maintain a minimum
    distance of at least:'
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 6 feet
  answer: B
  explanation: Nebraska law requires motorists to leave a safe distance when passing
    a bicycle, which is defined as at least 3 feet of clearance.
- id: 52
  category: driver_testing
  question: When stopping for a train at a railroad crossing, you must stop your vehicle
    no closer than how many feet from the nearest rail?
  choices:
    A: 10 feet
    B: 15 feet
    C: 25 feet
    D: 50 feet
  answer: B
  explanation: In Nebraska, when a stop is required at a railroad crossing, the driver
    must stop between 15 and 50 feet from the nearest rail.
- id: 53
  category: driver_testing
  question: 'In Nebraska, fines for speeding in a designated work zone when workers
    are present are:'
  choices:
    A: Increased by $50
    B: Increased by $100
    C: Doubled
    D: Tripled
  answer: C
  explanation: Nebraska law mandates that fines for speeding are doubled in maintenance
    or construction zones when workers are present.
- id: 54
  category: driver_testing
  question: 'When entering a roundabout in Nebraska, drivers must yield the right-of-way
    to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the roundabout
    C: No one, as entering traffic has the right-of-way
    D: Only emergency vehicles
  answer: B
  explanation: Drivers entering a roundabout must yield to the traffic circulating
    within the roundabout and to pedestrians in the crosswalk.
- id: 55
  category: driver_responsibility
  question: If you are involved in a reportable motor vehicle accident in Nebraska,
    you must submit a written report to the Department of Transportation within how
    many days?
  choices:
    A: 2 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: Nebraska law requires that a written accident report be submitted to
    the Department of Transportation within 10 days of the occurrence.
- id: 56
  category: driver_responsibility
  question: After moving to Nebraska and establishing residency, how many days do
    you have to register your motor vehicle in the state?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents must register their motor vehicles with the county treasurer
    within 30 days of establishing residency in Nebraska.
- id: 57
  category: driver_responsibility
  question: In Nebraska, what is the point assessment for a conviction of 'Willful
    Reckless Driving' (First Offense)?
  choices:
    A: 1 point
    B: 3 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Under the Nebraska point system, Willful Reckless Driving is a serious
    offense that results in 6 points being assessed against the driver's record.
- id: 58
  category: driver_responsibility
  question: If a Nebraska driver is required to provide proof of financial responsibility
    (SR-22) following a suspension, they must typically maintain this filing for how
    long?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: Nebraska law generally requires an SR-22 (Certificate of Insurance)
    to be on file for three years from the date the driver is eligible for reinstatement.
- id: 59
  category: driver_responsibility
  question: 'If you are arrested for DUI in Nebraska and refuse to submit to a chemical
    test of your blood, breath, or urine, your license will be administratively revoked
    for:'
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: Under Nebraska's Administrative License Revocation (ALR) law, refusal
    to submit to a chemical test results in a one-year license revocation.
- id: 60
  category: driver_responsibility
  question: In Nebraska, a driver convicted of 'Careless Driving' will have how many
    points assessed against their driving record?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Careless Driving results in 4 points being assessed against a Nebraska
    driving record, whereas Reckless Driving is 5 points.
- id: 61
  category: driver_responsibility
  question: When selling a vehicle in Nebraska, what must the seller do with the license
    plates?
  choices:
    A: Leave them on the vehicle for the new owner.
    B: Remove them and keep them for another vehicle or return them to the county
      treasurer.
    C: Hand them over to the local police department.
    D: The plates must be destroyed in the presence of a notary.
  answer: B
  explanation: In Nebraska, license plates belong to the owner, not the vehicle. When
    a vehicle is sold, the seller must remove the plates.
- id: 62
  category: driver_responsibility
  question: 'Nebraska''s ''Implied Consent'' law means that by driving on Nebraska
    roads, you have given consent to:'
  choices:
    A: A search of your vehicle's trunk at any time.
    B: A chemical test for alcohol or drugs if requested by a law enforcement officer.
    C: Allow the state to track your vehicle via GPS.
    D: Waive your right to a trial for any traffic violation.
  answer: B
  explanation: The Implied Consent law states that any person who operates a motor
    vehicle in Nebraska is deemed to have given consent to a chemical test for the
    purpose of determining the amount of alcohol or drugs in their system.
- id: 63
  category: driver_responsibility
  question: What is the maximum fine for a first-offense littering conviction from
    a motor vehicle in Nebraska?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $5,000
  answer: B
  explanation: In Nebraska, littering is a violation of state law and is punishable
    by a fine of up to $500.
- id: 64
  category: driver_responsibility
  question: 'In Nebraska, if you are caught speeding in a maintenance or construction
    zone when workers are present, the fine is:'
  choices:
    A: Reduced by half
    B: Doubled
    C: Tripled
    D: The same as a normal speeding ticket
  answer: B
  explanation: Nebraska law mandates that fines for speeding are doubled in maintenance
    or construction zones when workers are present.
- id: 65
  category: driver_responsibility
  question: If a Nebraska driver's license is revoked for the first time due to accumulating
    12 points in two years, how long is the revocation period?
  choices:
    A: 60 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: For a first-time accumulation of 12 points in a two-year period, the
    license revocation period in Nebraska is 6 months.
- id: 66
  category: driver_responsibility
  question: Which of the following is an acceptable form of proof of financial responsibility
    (insurance) when requested by a Nebraska law enforcement officer?
  choices:
    A: An original paper insurance card only
    B: An electronic image of an insurance card displayed on a smartphone
    C: A verbal statement of the insurance company name
    D: A signed letter from an employer
  answer: B
  explanation: Nebraska law allows drivers to provide proof of insurance in either
    a printed (paper) format or an electronic format on a mobile device.
- id: 67
  category: driver_responsibility
  question: In Nebraska, what is the point assessment for 'Failure to yield to a pedestrian'?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Failure to yield to a pedestrian results in 2 points being assessed
    against the driver's record in Nebraska.
- id: 68
  category: driver_responsibility
  question: Where is a Nebraska driver required to keep proof of financial responsibility
    (insurance) for their vehicle?
  choices:
    A: At their primary residence
    B: In the vehicle at all times
    C: With their insurance agent
    D: In a secure safe deposit box
  answer: B
  explanation: Nebraska law requires that proof of insurance (financial responsibility)
    be carried in the vehicle at all times and must be presented to law enforcement
    upon request.
- id: 69
  category: driver_responsibility
  question: When you purchase a vehicle from a private party in Nebraska, how many
    days do you have to register the vehicle and pay the appropriate taxes?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: In Nebraska, you have 30 days from the date of purchase to register
    a newly acquired vehicle with the County Treasurer.
- id: 70
  category: driver_responsibility
  question: How many points are assessed against a Nebraska driver's record for speeding
    16 to 35 miles per hour over the posted limit?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 12 points
  answer: B
  explanation: Speeding 16 to 35 mph over the limit in Nebraska results in 4 points
    being added to the driver's record.
- id: 71
  category: driver_responsibility
  question: In Nebraska, how many points are assessed for a conviction of 'Willful
    Reckless Driving'?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Willful Reckless Driving is a serious offense in Nebraska and carries
    a penalty of 6 points on the driver's record.
- id: 72
  category: driver_responsibility
  question: What does Nebraska's 'Implied Consent' law mean for drivers?
  choices:
    A: You agree to yield the right-of-way to all pedestrians
    B: You consent to a chemical test for alcohol or drugs if requested by an officer
    C: You agree to carry passengers only if they wear seat belts
    D: You consent to have your vehicle searched at any time
  answer: B
  explanation: The Implied Consent law means that by operating a vehicle in Nebraska,
    you have given consent to submit to a chemical test of your blood, breath, or
    urine to determine alcohol or drug content.
- id: 73
  category: driver_responsibility
  question: For most passenger vehicles in Nebraska, where must license plates be
    displayed?
  choices:
    A: On the rear bumper only
    B: On the front bumper only
    C: On both the front and rear bumpers
    D: In the rear window
  answer: C
  explanation: 'Nebraska law requires most motor vehicles to display two license plates:
    one on the front and one on the rear.'
- id: 74
  category: driver_responsibility
  question: In Nebraska, how many points are assessed for a conviction of using a
    handheld wireless communication device to read, type, or send written communication
    (texting) while driving?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Texting while driving is a secondary offense in Nebraska and results
    in 3 points being assessed against the driver's record.
- id: 75
  category: driver_responsibility
  question: If your Nebraska driver's license is revoked, for how long must you typically
    maintain an SR-22 (Proof of Financial Responsibility) after becoming eligible
    for reinstatement?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: In Nebraska, proof of financial responsibility (SR-22) must generally
    be filed for 3 years from the date the person is eligible for reinstatement.
- id: 76
  category: driver_responsibility
  question: If you collide with an unattended vehicle in Nebraska and cannot locate
    the owner, what is your legal responsibility?
  choices:
    A: Wait for 30 minutes, then leave if no one arrives
    B: Leave a note with your contact information and report the crash to the police
    C: Drive to the nearest repair shop to report the damage
    D: Take a photo of the damage and leave without further action
  answer: B
  explanation: Nebraska law requires you to leave a note in a conspicuous place on
    the vehicle with your name, address, and telephone number, and you must also report
    the crash to law enforcement.
- id: 77
  category: driver_responsibility
  question: Under Nebraska's Open Container law, who is prohibited from possessing
    an open alcoholic beverage container in the passenger area of a motor vehicle?
  choices:
    A: Only the driver
    B: Only passengers under 21
    C: Both the driver and all passengers
    D: Only passengers in the front seat
  answer: C
  explanation: Nebraska's Open Container law makes it illegal for any person (driver
    or passenger) to possess an open alcoholic beverage container in the passenger
    area of a motor vehicle on a highway or public parking lot.
- id: 78
  category: driver_responsibility
  question: In Nebraska, it is illegal for a driver 21 years of age or older to operate
    a motor vehicle with a Blood Alcohol Concentration (BAC) at or above what level?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: For drivers age 21 and older in Nebraska, the legal limit for Blood
    Alcohol Concentration (BAC) is 0.08%.
- id: 79
  category: safe_driving_rules
  question: What is the default speed limit on Nebraska county roads (unpaved/gravel)
    unless otherwise posted?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: B
  explanation: In Nebraska, the speed limit for unpaved county roads is 50 mph unless
    signs indicate a different limit.
- id: 80
  category: safe_driving_rules
  question: When making a turn in Nebraska, you must signal your intention at least
    how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Nebraska law requires drivers to signal at least 100 feet before turning
    or changing lanes.
- id: 81
  category: safe_driving_rules
  question: When parking near an intersection, you must be at least how many feet
    away from a crosswalk?
  choices:
    A: 15 feet
    B: 20 feet
    C: 25 feet
    D: 30 feet
  answer: B
  explanation: In Nebraska, you may not park within 20 feet of a crosswalk at an intersection.
- id: 82
  category: safe_driving_rules
  question: 'Nebraska law requires you to use your headlights from sunset to sunrise
    and whenever visibility is less than:'
  choices:
    A: 300 feet
    B: 400 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Headlights must be used from sunset to sunrise and any time visibility
    is less than 500 feet due to weather or other conditions.
- id: 83
  category: safe_driving_rules
  question: What is the speed limit in a Nebraska business district unless otherwise
    posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The Nebraska Driver's Manual states that the speed limit in a business
    district is 20 mph unless otherwise posted.
- id: 84
  category: safe_driving_rules
  question: If you are approaching a school bus with flashing red lights on a roadway
    with a median or divider, who must stop?
  choices:
    A: All traffic in both directions
    B: Only traffic following the bus
    C: Only traffic approaching from the front
    D: No one is required to stop
  answer: B
  explanation: On a divided highway with a median or other physical barrier, only
    traffic traveling in the same direction as the bus must stop when the red lights
    are flashing.
- id: 85
  category: safe_driving_rules
  question: In Nebraska, you must not park within how many feet of a stop sign, flashing
    beacon, or traffic control signal?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Nebraska law prohibits parking within 30 feet of any flashing beacon,
    stop sign, or traffic control signal located at the side of a roadway.
- id: 86
  category: safe_driving_rules
  question: What is the penalty for speeding in a Nebraska highway maintenance or
    construction zone when workers are present?
  choices:
    A: A flat $500 fine
    B: License suspension for 30 days
    C: Fines are doubled
    D: Triple points on your license
  answer: C
  explanation: Nebraska law dictates that fines for speeding are doubled in maintenance
    or construction zones when workers are present.
- id: 87
  category: safe_driving_rules
  question: When passing another vehicle in Nebraska, you must return to the right
    lane before coming within how many feet of an oncoming vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: You must return to the right side of the road before coming within
    200 feet of any vehicle approaching from the opposite direction.
- id: 88
  category: safe_driving_rules
  question: 'Under Nebraska law, you may not make a U-turn on a curve or near the
    crest of a hill if your vehicle cannot be seen by other drivers within:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 700 feet
    D: 1,000 feet
  answer: B
  explanation: U-turns are prohibited in Nebraska on curves or hills where the vehicle
    cannot be seen by other drivers approaching from either direction within 500 feet.
- id: 89
  category: safe_driving_rules
  question: When two vehicles reach an intersection without traffic signals at the
    same time, which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling at a higher speed
    D: The driver on the more major road
  answer: B
  explanation: In Nebraska, when two vehicles reach an uncontrolled intersection at
    the same time, the driver on the left must yield to the driver on the right.
- id: 90
  category: safe_driving_rules
  question: In Nebraska, it is illegal to pass another vehicle within how many feet
    of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: According to the Nebraska Driver's Manual, you should not pass within
    100 feet of an intersection or a railroad crossing.
- id: 91
  category: safe_driving_rules
  question: In Nebraska, what is the default speed limit in a business district?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The Nebraska speed limit in a business district is 20 mph unless otherwise
    posted.
- id: 92
  category: safe_driving_rules
  question: 'The Nebraska Driver''s Manual recommends following the vehicle in front
    of you with a minimum time gap of:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: Nebraska recommends using the 'three-second rule' to maintain a safe
    following distance under normal conditions.
- id: 93
  category: safe_driving_rules
  question: Nebraska's 'Move Over Law' requires drivers to do what when approaching
    a stationary emergency vehicle with flashing lights?
  choices:
    A: Stop immediately in the lane
    B: Maintain speed but honk the horn
    C: Move to a lane not adjacent to the vehicle, or slow down if a lane change is
      unsafe
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: The Move Over Law requires drivers to move to a lane not adjacent to
    the emergency vehicle on multi-lane highways, or reduce speed and maintain a safe
    speed if a lane change is not possible.
- id: 94
  category: defensive_driving
  question: To maintain a safe path of travel in Nebraska, how far ahead should a
    driver scan the road for potential hazards?
  choices:
    A: 5 seconds
    B: 8 seconds
    C: 12 seconds
    D: 20 seconds
  answer: C
  explanation: The Nebraska Driver's Manual states that drivers should look at least
    12 seconds ahead to identify potential problems and have enough time to react.
- id: 95
  category: defensive_driving
  question: In Nebraska, at what speed can hydroplaning (where tires lose contact
    with the road on a wet surface) begin to occur?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph. At 55 mph, tires
    may lose all contact with the road surface if it is covered in water.
- id: 96
  category: defensive_driving
  question: When driving in heavy fog, snow, or rain in Nebraska, which headlight
    setting should you use to ensure the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights are required during the day
  answer: B
  explanation: Low beams should be used in fog, snow, or rain. High beams reflect
    off the moisture in the air, causing glare and making it harder to see.
- id: 97
  category: defensive_driving
  question: If your vehicle is equipped with Anti-lock Brakes (ABS) and you need to
    stop quickly on a slippery Nebraska road, how should you apply the brakes?
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure without letting up
    C: Lightly tap the brakes to avoid locking
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: For vehicles with ABS, the driver should apply firm, steady pressure.
    Pumping the brakes is only for older vehicles without ABS.
- id: 98
  category: defensive_driving
  question: Nebraska's 'Move Over' law requires drivers to move to a lane not adjacent
    to a stopped emergency vehicle. If you cannot safely move over, what must you
    do?
  choices:
    A: Maintain speed and stay in your lane
    B: Stop completely in the lane of travel
    C: Slow down and be prepared to stop
    D: Honk to warn the emergency workers
  answer: C
  explanation: If a driver cannot safely move over to a non-adjacent lane, they must
    slow down and be prepared to stop while passing the emergency vehicle.
- id: 99
  category: defensive_driving
  question: When changing lanes in Nebraska, what is the correct defensive driving
    procedure to check your blind spots?
  choices:
    A: Check the rearview mirror only
    B: Check the side mirrors only
    C: Turn your head and look over your shoulder in the direction you plan to move
    D: Rely on your vehicle's blind-spot monitoring system
  answer: C
  explanation: Mirrors do not show everything. To check blind spots, you must turn
    your head and look over your shoulder before changing lanes.
- id: 100
  category: defensive_driving
  question: In Nebraska, you are approaching a school bus with flashing red lights
    and an extended stop arm on a roadway with four lanes separated by a median. Which
    of the following is true?
  choices:
    A: All lanes in both directions must stop
    B: Only traffic following the bus must stop
    C: Traffic in the opposite direction does not need to stop
    D: Traffic in the opposite direction must slow to 15 mph
  answer: C
  explanation: In Nebraska, if a roadway is divided by a median or a physical barrier,
    traffic moving in the opposite direction of a stopped school bus is not required
    to stop.
- id: 101
  category: defensive_driving
  question: 'In Nebraska, it is illegal to follow a fire apparatus (fire truck) traveling
    in response to a fire alarm closer than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Nebraska law prohibits following a fire truck responding to an alarm
    closer than 500 feet.
- id: 102
  category: defensive_driving
  question: In Nebraska, you must turn on your headlights if you cannot see clearly
    for at least how many feet?
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Nebraska law requires headlights to be on from sunset to sunrise and
    at any time when visibility is less than 500 feet.
- id: 103
  category: defensive_driving
  question: When driving in heavy fog in Nebraska, which headlight setting should
    you use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights are required during the day
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    moisture in the air, causing glare and making it harder to see.
- id: 104
  category: defensive_driving
  question: During Nebraska winters, which of the following road surfaces is likely
    to freeze first and remain icy longest?
  choices:
    A: Interstate highways
    B: Gravel roads
    C: Bridges and overpasses
    D: Asphalt city streets
  answer: C
  explanation: Bridges and overpasses freeze before other road surfaces because cold
    air circulates both above and below the structure.
- id: 105
  category: defensive_driving
  question: When approaching an intersection in Nebraska, in what order should you
    scan for traffic?
  choices:
    A: Right, left, right
    B: Left, right, left
    C: Straight ahead only
    D: Check mirrors only
  answer: B
  explanation: The Nebraska manual advises scanning left, then right, then left again,
    as the first danger comes from the left.
- id: 106
  category: defensive_driving
  question: To check your 'blind spot' before changing lanes in Nebraska, what must
    you do?
  choices:
    A: Check your rearview mirror
    B: Check your side-view mirror
    C: Turn your head and look over your shoulder
    D: Honk your horn to alert others
  answer: C
  explanation: Mirrors do not show everything; you must turn your head and look over
    your shoulder in the direction you plan to move to check blind spots.
- id: 107
  category: defensive_driving
  question: When driving on Nebraska roads that are slippery with rain, snow, or ice,
    how should you adjust your following distance?
  choices:
    A: Keep it at three seconds
    B: Decrease it to one second to stay in tracks
    C: Increase it to at least four or more seconds
    D: Following distance does not matter in snow
  answer: C
  explanation: In adverse conditions like rain or snow, you should increase your following
    distance to provide more time and space for stopping.
- id: 108
  category: defensive_driving
  question: What does 'overdriving your headlights' mean when driving at night in
    Nebraska?
  choices:
    A: Driving with your high beams on in the city
    B: Driving so fast that your stopping distance is farther than you can see with
      your lights
    C: Using fog lights and high beams at the same time
    D: Driving with broken headlights
  answer: B
  explanation: Overdriving your headlights occurs when your vehicle's stopping distance
    exceeds the distance illuminated by your headlights, which is a dangerous practice
    at night.
- id: 109
  category: alcohol_drugs_health
  question: 'Under Nebraska''s ''Implied Consent'' law, by driving a motor vehicle,
    you have given your consent to:'
  choices:
    A: A search of your vehicle for illegal substances
    B: A chemical test of your blood, breath, or urine for alcohol or drugs
    C: A psychological evaluation by a state-appointed doctor
    D: Allowing a passenger to hold an open container of alcohol
  answer: B
  explanation: Nebraska's Implied Consent law means that any person who operates a
    motor vehicle in the state is deemed to have given consent to a chemical test
    of their blood, breath, or urine to determine alcohol or drug content.
- id: 110
  category: alcohol_drugs_health
  question: What is the mandatory driver's license revocation period for a first-offense
    DUI conviction in Nebraska?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: A first-offense DUI conviction in Nebraska results in a mandatory 6-month
    revocation of the driver's license.
- id: 111
  category: alcohol_drugs_health
  question: 'If a Nebraska driver is convicted of a DUI with a BAC of 0.15% or higher,
    the offense is subject to:'
  choices:
    A: The same penalties as a standard DUI
    B: Enhanced penalties and a longer revocation period
    C: A simple warning for the first offense
    D: Mandatory community service only
  answer: B
  explanation: Nebraska law imposes significantly harsher penalties for 'High BAC'
    offenses, which are defined as having a BAC of 0.15% or higher.
- id: 112
  category: alcohol_drugs_health
  question: In Nebraska, what is the maximum fine for a first-offense DUI conviction
    (excluding court costs)?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,500
  answer: B
  explanation: A first-offense DUI in Nebraska is a Class W misdemeanor, which carries
    a maximum fine of $500.
- id: 113
  category: alcohol_drugs_health
  question: 'Refusing to submit to a chemical blood alcohol test in Nebraska results
    in:'
  choices:
    A: A $50 fine only
    B: No penalty if it is your first time being pulled over
    C: The same or similar penalties as a DUI conviction, including license revocation
    D: A mandatory 24-hour jail stay but no license suspension
  answer: C
  explanation: Refusing a chemical test is a separate crime in Nebraska and carries
    penalties similar to a DUI, including immediate Administrative License Revocation
    (ALR).
- id: 114
  category: alcohol_drugs_health
  question: What is the Blood Alcohol Concentration (BAC) limit for drivers operating
    a Commercial Motor Vehicle (CMV) in Nebraska?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Commercial drivers are held to a stricter standard; it is illegal to
    operate a CMV in Nebraska with a BAC of 0.04% or higher.
- id: 115
  category: alcohol_drugs_health
  question: 'Nebraska''s ''Open Container Law'' makes it illegal to:'
  choices:
    A: Possess an open alcoholic beverage container in the passenger area of a vehicle
      on a highway
    B: Transport an unopened six-pack of beer in the front seat
    C: Drink water while driving a motor vehicle
    D: Have an empty soda can on the floorboard
  answer: A
  explanation: It is illegal in Nebraska for any person in the passenger area of a
    motor vehicle on a public highway to possess an open alcoholic beverage container.
- id: 116
  category: alcohol_drugs_health
  question: If you are convicted of a DUI in Nebraska and are granted probation, what
    is the minimum jail time required for a first offense?
  choices:
    A: 0 days
    B: 7 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: If probation is granted for a first-offense DUI in Nebraska, there
    is no mandatory minimum jail time, though other conditions like a fine and license
    revocation still apply.
- id: 117
  category: alcohol_drugs_health
  question: What is the only effective way to reduce your Blood Alcohol Concentration
    (BAC) after drinking?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising or running
    D: Allowing time for your body to process the alcohol
  answer: D
  explanation: Only time can reduce BAC. The body processes alcohol at a steady rate,
    and coffee, showers, or exercise do not speed up this process.
- id: 118
  category: alcohol_drugs_health
  question: 'In Nebraska, an Ignition Interlock Permit (IIP) allows a person whose
    license is revoked for DUI to:'
  choices:
    A: Drive any vehicle at any time without restrictions
    B: Drive only to and from work or school
    C: Drive a vehicle equipped with an ignition interlock device
    D: Drive only during daylight hours
  answer: C
  explanation: An IIP allows a revoked driver to operate a vehicle equipped with a
    device that measures breath alcohol before the engine will start.
- id: 119
  category: alcohol_drugs_health
  question: What happens to your Nebraska driver's license immediately if you fail
    or refuse a chemical test when requested by an officer?
  choices:
    A: Nothing happens until you go to court
    B: The officer will issue a 15-day temporary permit and then your license is revoked
      (ALR)
    C: Your license is permanently cancelled on the spot
    D: You are required to pay a $1,000 bond to keep your license
  answer: B
  explanation: Under Administrative License Revocation (ALR), the officer will take
    your license and issue a temporary 15-day permit. Unless a hearing is requested,
    the revocation begins after those 15 days.
- id: 120
  category: alcohol_drugs_health
  question: Which of the following is true regarding prescription drugs and driving
    in Nebraska?
  choices:
    A: You cannot be arrested for DUI if the drug was legally prescribed
    B: Prescription drugs never affect driving ability
    C: You can be arrested for DUI if a prescription drug impairs your ability to
      drive safely
    D: Only illegal 'street' drugs are covered under Nebraska's DUI laws
  answer: C
  explanation: Nebraska's DUI laws apply to any drug that impairs a driver's ability
    to operate a vehicle safely, including legal prescription and over-the-counter
    medications.
- id: 121
  category: alcohol_drugs_health
  question: 'Combining alcohol with another drug, such as a sedative or antihistamine,
    typically results in:'
  choices:
    A: The effects of the alcohol being cancelled out
    B: A synergistic effect, where the impairment is much greater than either substance
      alone
    C: Increased alertness and better reaction times
    D: No change in the level of impairment
  answer: B
  explanation: Mixing alcohol and drugs can multiply the effects of both, leading
    to severe impairment even if small amounts of each are consumed.
- id: 122
  category: alcohol_drugs_health
  question: How many points are assessed against a Nebraska driving record for a DUI
    conviction?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: A conviction for Operating Under the Influence of Alcohol or Drugs
    in Nebraska results in 6 points being assessed against the driver's record.
- id: 123
  category: alcohol_drugs_health
  question: In Nebraska, what is the legal Blood Alcohol Concentration (BAC) limit
    for a driver over the age of 21?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: According to the Nebraska Driver's Manual, it is unlawful for any person
    to operate or be in actual physical control of a motor vehicle while having a
    BAC of 0.08% or more.
- id: 124
  category: alcohol_drugs_health
  question: 'Under Nebraska''s Implied Consent Law, if you refuse to submit to a chemical
    test of your blood, breath, or urine when requested by an officer, your license
    will be revoked for:'
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: Under Nebraska law, refusal to submit to a chemical test under the
    Implied Consent Law results in a one-year administrative license revocation.
- id: 125
  category: alcohol_drugs_health
  question: In Nebraska, it is illegal to possess an open container of alcohol in
    the passenger area of a motor vehicle. Where is it legal to store an open container?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: In the trunk
    D: In a cup holder if it has a lid
  answer: C
  explanation: Nebraska's open container law prohibits open alcoholic beverages in
    the passenger area. They must be kept in the trunk or an area not normally occupied
    by the driver or passengers if the vehicle has no trunk.
- id: 126
  category: alcohol_drugs_health
  question: If a Nebraska driver is arrested for DUI and a chemical test indicates
    a BAC of 0.08% or higher, how long is the Administrative License Revocation (ALR)
    for a first offense?
  choices:
    A: 30 days
    B: 60 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: For a first-time failure of a chemical test (0.08% or higher), the
    Nebraska DMV will administratively revoke the driver's license for 180 days.
- id: 127
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and it impairs your driving ability,
    can you be charged with a DUI in Nebraska?
  choices:
    A: No, as long as the drug was legally prescribed
    B: No, DUI only applies to alcohol and illegal narcotics
    C: Yes, if the drug renders you incapable of safely operating a motor vehicle
    D: Yes, but only if you also have alcohol in your system
  answer: C
  explanation: Nebraska law states it is illegal to drive while under the influence
    of any drug, including prescription or over-the-counter medications, if they impair
    your ability to drive safely.
- id: 128
  category: alcohol_drugs_health
  question: According to Nebraska medical standards for passenger vehicles, a person
    with a history of seizures must be seizure-free for at least how long before they
    can be considered for a license?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Nebraska generally requires a person with a seizure disorder to be
    seizure-free for a period of six months before they are eligible to hold a driver's
    license.
- id: 129
  category: alcohol_drugs_health
  question: A first-time DUI offender in Nebraska may be eligible for an Ignition
    Interlock Permit (IIP). What does this permit allow?
  choices:
    A: Driving only during daylight hours
    B: Driving to and from work or school only
    C: Driving anywhere at any time, provided the vehicle has an interlock device
    D: Driving only with a sober adult in the passenger seat
  answer: C
  explanation: In Nebraska, an Ignition Interlock Permit (IIP) allows an individual
    to operate a vehicle equipped with an ignition interlock device for any purpose,
    24 hours a day.
- id: 130
  category: alcohol_drugs_health
  question: In Nebraska, what is the penalty for a driver who refuses to submit to
    a Preliminary Breath Test (PBT) at the request of a law enforcement officer?
  choices:
    A: It is a Class V misdemeanor and a fine
    B: Automatic 5-year prison sentence
    C: There is no penalty for refusing a PBT
    D: Immediate permanent loss of license
  answer: A
  explanation: Refusal to submit to a Preliminary Breath Test (PBT) is a Class V misdemeanor
    in Nebraska, which is a separate offense from the DUI itself.
- id: 131
  category: alcohol_drugs_health
  question: What is the mandatory minimum jail time for a first-offense DUI conviction
    in Nebraska if probation is NOT granted?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: For a first-offense DUI in Nebraska, if the court does not grant probation,
    the mandatory minimum sentence is 7 days in jail.
- id: 132
  category: alcohol_drugs_health
  question: In Nebraska, a 'High BAC' or 'Aggravated DUI' carries stiffer penalties.
    At what BAC level is a DUI considered aggravated?
  choices:
    A: 0.10% or higher
    B: 0.15% or higher
    C: 0.20% or higher
    D: 0.25% or higher
  answer: B
  explanation: Nebraska law imposes enhanced penalties for drivers with a BAC of 0.15%
    or higher, often referred to as an aggravated DUI.
- id: 133
  category: alcohol_drugs_health
  question: If you are convicted of a second DUI within a 15-year period in Nebraska,
    what is the minimum period your license will be revoked?
  choices:
    A: 6 months
    B: 1 year
    C: 18 months
    D: 5 years
  answer: C
  explanation: A second DUI conviction within 15 years in Nebraska results in a mandatory
    license revocation period of 18 months.
- id: 134
  category: alcohol_drugs_health
  question: If a Nebraska driver is involved in a crash resulting in serious bodily
    injury or death, and is suspected of DUI, what does the law require regarding
    chemical testing?
  choices:
    A: The driver must give verbal consent
    B: A chemical test is required and can be compelled by law
    C: Testing is only required if the driver is at fault
    D: Testing can only be done with a lawyer present
  answer: B
  explanation: Nebraska law requires drivers involved in accidents involving serious
    injury or death to submit to chemical tests if there is reasonable cause to believe
    they were under the influence.
- id: 135
  category: penalties_and_points
  question: In Nebraska, what is the point assessment for speeding more than 35 mph
    over the posted speed limit?
  choices:
    A: 4 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: C
  explanation: Speeding more than 35 mph over the limit is a serious violation in
    Nebraska and carries a penalty of 9 points.
- id: 136
  category: penalties_and_points
  question: Under Nebraska's Administrative License Revocation (ALR) law, what is
    the revocation period for a driver who refuses to submit to a chemical test (breath,
    blood, or urine)?
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: Refusing a chemical test under Nebraska's Implied Consent law results
    in an automatic 1-year administrative license revocation.
- id: 137
  category: penalties_and_points
  question: How many points are assessed on a Nebraska driving record for the violation
    of 'Texting While Driving'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Nebraska law assesses 3 points for a texting while driving violation.
- id: 138
  category: penalties_and_points
  question: In Nebraska, how many points are assessed for failing to yield to an authorized
    emergency vehicle?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Failure to yield to an emergency vehicle is a 3-point violation in
    Nebraska.
- id: 139
  category: penalties_and_points
  question: How many points are assessed for leaving the scene of an accident involving
    property damage only in Nebraska?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Leaving the scene of an accident involving property damage results
    in 6 points being assessed.
- id: 140
  category: penalties_and_points
  question: Under Nebraska law, how many points are assessed for 'Careless Driving'?
  choices:
    A: 2 points
    C: 4 points
    B: 3 points
    D: 6 points
  answer: C
  explanation: Careless driving is a 4-point violation in Nebraska.
- id: 141
  category: penalties_and_points
  question: After a license is revoked due to the point system, for how long must
    a Nebraska driver maintain proof of financial responsibility (SR-22) with the
    DMV?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Drivers who have their license revoked under the point system must
    provide and maintain proof of financial responsibility (SR-22) for 3 years from
    the date of eligibility for reinstatement.
- id: 142
  category: penalties_and_points
  question: What is the fine for a first offense of 'Texting While Driving' in Nebraska?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: The fine for a first offense of texting while driving in Nebraska is
    $200.
- id: 143
  category: penalties_and_points
  question: How many points are assessed for failing to stop for a school bus that
    has its stop arm extended and red lights flashing?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Failing to stop for a school bus is a 3-point violation in Nebraska.
- id: 144
  category: penalties_and_points
  question: In Nebraska, how many points are assessed for 'Reckless Driving' (first
    offense)?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: Reckless driving results in 5 points being assessed on the driver's
    record in Nebraska.
- id: 145
  category: penalties_and_points
  question: For a first-time DUI conviction in Nebraska, for how long is the driver's
    license typically revoked?
  choices:
    A: 60 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: A first conviction for Driving Under the Influence (DUI) in Nebraska
    typically results in a 6-month license revocation.
- id: 146
  category: penalties_and_points
  question: Failure to yield to an authorized emergency vehicle in Nebraska results
    in how many points on your driving record?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Failure to yield to an emergency vehicle is a 3-point violation under
    the Nebraska point system.
- id: 147
  category: penalties_and_points
  question: What is the fine for a first-time violation of Nebraska's seat belt law?
  choices:
    A: No fine, warning only
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: The fine for a seat belt violation in Nebraska is $25, though court
    costs may also apply.
- id: 148
  category: penalties_and_points
  question: How many points are assessed for failing to yield to a pedestrian who
    has the right of way in Nebraska?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failure to yield to a pedestrian with the right of way results in 2
    points on the driver's record.
- id: 149
  category: penalties_and_points
  question: Under Nebraska's Implied Consent Law, what happens if you refuse to submit
    to a chemical test for alcohol or drugs?
  choices:
    A: You will be fined $100 and allowed to drive home.
    B: Your license will be revoked and you may be subject to criminal penalties.
    C: Nothing happens unless you are later proven to be drunk.
    D: You receive 2 points on your license.
  answer: B
  explanation: Refusal to submit to a chemical test under the Implied Consent Law
    is a separate crime and results in the automatic revocation of your driver's license.
- id: 150
  category: penalties_and_points
  question: A Nebraska driver whose license is revoked under the point system may
    be eligible for an Employment Drive Permit (EDP). What does this permit allow?
  choices:
    A: Driving to and from work only
    B: Driving for any reason during daylight hours
    C: Driving to work and the grocery store
    D: Driving anywhere as long as a sober adult is present
  answer: A
  explanation: The Employment Drive Permit (EDP) is strictly for driving to and from
    the person's place of employment or as part of their job duties.
- id: 151
  category: penalties_and_points
  question: In Nebraska, how many points are assessed for speeding 1 to 5 mph over
    the limit?
  choices:
    A: 0 points
    B: 1 point
    C: 2 points
    D: 3 points
  answer: B
  explanation: Speeding 1 through 5 mph over the limit results in 1 point on the Nebraska
    driving record.
- id: 152
  category: sharing_the_road
  question: Under Nebraska's 'Move Over' law, what must a driver do when approaching
    a stationary emergency vehicle with flashing lights on a multi-lane highway?
  choices:
    A: Maintain speed but honk to alert the emergency workers
    B: Stop completely until signaled to proceed
    C: Move into a lane that is not adjacent to the emergency vehicle, if safe to
      do so
    D: Speed up to pass the area as quickly as possible
  answer: C
  explanation: Nebraska law requires drivers to move to a lane not adjacent to the
    stationary emergency vehicle or slow down considerably if a lane change is not
    possible or safe.
- id: 153
  category: sharing_the_road
  question: As of 2024, what is the helmet requirement for motorcycle operators in
    Nebraska?
  choices:
    A: All riders must wear a helmet regardless of age
    B: Helmets are optional for everyone
    C: Riders 21 and older may ride without a helmet if they have completed a safety
      course and carry proof
    D: Only passengers are required to wear helmets
  answer: C
  explanation: Following a change in Nebraska law (LB138), riders age 21 and older
    may ride without a helmet if they have successfully completed a certified motorcycle
    safety course and possess proof of completion.
- id: 154
  category: sharing_the_road
  question: In Nebraska, how many points are assessed against your driving record
    for the offense of 'Failure to yield to a pedestrian'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: The Nebraska Department of Motor Vehicles assigns 2 points to a driver's
    record for failing to yield to a pedestrian.
- id: 155
  category: sharing_the_road
  question: 'When following a large truck, if you cannot see the truck driver''s face
    in their side-view mirrors, you are:'
  choices:
    A: In the truck's 'No-Zone' (blind spot)
    B: In a safe drafting position
    C: Following at a legal distance
    D: Ready to pass on the right
  answer: A
  explanation: The 'No-Zone' represents the large blind spots around a truck. If you
    can't see the driver in their mirror, they cannot see you.
- id: 156
  category: sharing_the_road
  question: In Nebraska, what is the specific rule regarding funeral processions at
    intersections?
  choices:
    A: They must follow all traffic signals like any other vehicle
    B: The lead vehicle must stop, but the rest of the procession can go through red
      lights
    C: The procession has the right-of-way at intersections regardless of traffic
      control devices, provided the lead vehicle entered legally
    D: Processions are only allowed on Sundays
  answer: C
  explanation: Nebraska law grants funeral processions the right-of-way at intersections.
    Once the lead vehicle enters an intersection legally, the remaining vehicles in
    the procession may follow regardless of traffic signals.
- id: 157
  category: sharing_the_road
  question: What is the minimum following distance Nebraska recommends when driving
    behind a motorcycle?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 to 4 seconds
    D: 10 seconds
  answer: C
  explanation: Because motorcycles can stop much more quickly than cars and are more
    susceptible to road hazards, Nebraska recommends a following distance of at least
    3 to 4 seconds.
- id: 158
  category: sharing_the_road
  question: 'When a pedestrian is crossing a street guided by a dog or carrying a
    white cane, Nebraska law requires drivers to:'
  choices:
    A: Honk to let them know you are there
    B: Come to a complete stop and take precautions to avoid injury
    C: Slow down to 5 mph
    D: Only stop if there is a marked crosswalk
  answer: B
  explanation: Drivers must come to a complete stop for blind or visually impaired
    pedestrians using a white cane or guide dog to ensure their safety.
- id: 159
  category: sharing_the_road
  question: 'When a bicyclist is operating on a Nebraska roadway, they are required
    to:'
  choices:
    A: Ride against the flow of traffic
    B: Ride on the sidewalk only
    C: Follow the same traffic laws as operators of motor vehicles
    D: Always ride in the exact center of the lane
  answer: C
  explanation: Bicyclists in Nebraska have the same rights and responsibilities as
    motorists and must obey all traffic signs, signals, and lane markings.
- id: 160
  category: sharing_the_road
  question: 'If you are driving and a police vehicle behind you activates its flashing
    lights and siren, you should:'
  choices:
    A: Stop immediately in the lane you are in
    B: Speed up to find a parking lot
    C: Pull over to the right edge of the road and stop
    D: Pull over to the left median and stop
  answer: C
  explanation: When signaled by an emergency vehicle, you must pull as far to the
    right as possible and come to a complete stop until the vehicle has passed.
- id: 161
  category: sharing_the_road
  question: Which of the following is true regarding 'lane splitting' (driving between
    rows of stopped or moving vehicles) for motorcycles in Nebraska?
  choices:
    A: It is legal at speeds under 15 mph
    B: It is legal only on interstate highways
    C: It is illegal in the state of Nebraska
    D: It is legal if the motorcyclist has a POP permit
  answer: C
  explanation: Lane splitting is not permitted in Nebraska; motorcycles are entitled
    to the full use of a lane, and no motor vehicle shall be driven in a manner to
    deprive them of that use.
- id: 162
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the driver may:'
  choices:
    A: Stay entirely in the right lane
    B: Swing wide to the left to complete the turn
    C: Turn from the left lane only
    D: Back up to make the turn sharper
  answer: B
  explanation: Large trucks often need to swing wide to the left to clear the curb
    when making a right turn. Motorists should avoid 'squeezing' between the truck
    and the curb.
- id: 163
  category: sharing_the_road
  question: In Nebraska, when a school bus is stopped on a roadway with a median or
    visual barrier separating the lanes of traffic, which vehicles must stop for the
    bus's flashing red lights?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching from the front
    C: Traffic in both directions
    D: No vehicles are required to stop if there is a median
  answer: A
  explanation: According to the Nebraska Driver's Manual, on a highway divided by
    a median or barrier, only traffic following the bus must stop. Traffic on the
    opposite side of the median does not need to stop.
- id: 164
  category: sharing_the_road
  question: What is the maximum fine for a first-time violation of Nebraska's Move
    Over Law (approaching stationary emergency/road assistance vehicles)?
  choices:
    A: Up to $50
    B: Up to $100
    C: Exactly $250
    D: Exactly $500
  answer: B
  explanation: A first offense for violating Nebraska's Move Over Law is an infraction
    punishable by a fine of up to $100.
- id: 165
  category: sharing_the_road
  question: When following a motorcycle in Nebraska, what is the recommended following
    distance to ensure safety?
  choices:
    A: At least 1 second
    B: At least 2 seconds
    C: At least 3 to 4 seconds
    D: At least 10 seconds
  answer: C
  explanation: The Nebraska Driver's Manual recommends a following distance of at
    least three to four seconds when following a motorcycle to allow for sudden maneuvers
    or stops.
- id: 166
  category: sharing_the_road
  question: 'According to Nebraska law, it is illegal to follow a fire aircraft or
    vehicle responding to an alarm closer than:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Nebraska Revised Statute 60-6,183 prohibits following any fire apparatus
    traveling in response to a fire alarm closer than 500 feet.
- id: 167
  category: sharing_the_road
  question: When a funeral procession is led by an escort vehicle with flashing lights,
    what is the rule for other drivers at intersections in Nebraska?
  choices:
    A: Drivers may cut through the procession if there is a gap
    B: Drivers must yield the right-of-way to the entire procession
    C: Only the first three cars in the procession have the right-of-way
    D: Processions must follow standard traffic light signals regardless of the escort
  answer: B
  explanation: In Nebraska, motorists should yield the right-of-way to the entire
    funeral procession until all vehicles in the procession have passed.
- id: 168
  category: sharing_the_road
  question: 'In Nebraska, a person riding a bicycle on a roadway has:'
  choices:
    A: No legal rights as a vehicle
    B: The same rights and duties as a driver of a motor vehicle
    C: The right-of-way over all motor vehicles at all times
    D: The obligation to ride only on sidewalks
  answer: B
  explanation: Nebraska law treats bicycles as vehicles; therefore, cyclists have
    the same rights and are subject to the same duties as motor vehicle drivers.
- id: 169
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' Where is the largest 'No-Zone'
    located?
  choices:
    A: Directly in front of the truck
    B: Directly behind the truck
    C: On the left side of the truck
    D: On the right side of the truck
  answer: D
  explanation: While trucks have blind spots on all sides, the right-side blind spot
    is the largest and most dangerous 'No-Zone' because it extends across multiple
    lanes.
- id: 170
  category: sharing_the_road
  question: 'In Nebraska, if you see a pedestrian with a white cane or a guide dog,
    you must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Stop and yield the right-of-way
    C: Drive around them quickly
    D: Slow down but do not stop unless they enter your lane
  answer: B
  explanation: Nebraska law requires drivers to come to a complete stop and yield
    the right-of-way to any pedestrian who is blind or visually impaired and carrying
    a white cane or using a guide dog.
- id: 171
  category: sharing_the_road
  question: 'When a commercial truck is making a right turn at an intersection, a
    driver should be aware that:'
  choices:
    A: The truck will always stay in the right-most lane
    B: The truck may need to swing wide to the left to complete the turn
    C: The truck can turn as sharply as a passenger car
    D: It is safe to pass the truck on the right during the turn
  answer: B
  explanation: Because of their length, large trucks often need to swing wide to the
    left to clear the curb when making a right turn. Drivers should never try to squeeze
    between the truck and the curb.
- id: 172
  category: sharing_the_road
  question: In Nebraska, what equipment is a bicycle required to have when operated
    at night?
  choices:
    A: A white light on the front and a red reflector or red light on the rear
    B: A yellow light on the front and a white light on the rear
    C: Reflective tape on the pedals only
    D: No specific equipment is required by law
  answer: A
  explanation: Nebraska law requires bicycles ridden at night to be equipped with
    a front lamp emitting a white light visible from 500 feet and a rear red reflector
    or light visible from 600 feet.
- id: 173
  category: sharing_the_road
  question: 'When an emergency vehicle with sirens and flashing lights is approaching
    from behind, you should:'
  choices:
    A: Stop immediately in your lane
    B: Speed up to stay ahead of it
    C: Pull over to the right edge of the road and stop
    D: Pull over to the left median and stop
  answer: C
  explanation: Nebraska law requires drivers to yield the right-of-way by pulling
    as close as possible to the right-hand edge or curb of the roadway and remaining
    stopped until the emergency vehicle has passed.
- id: 174
  category: vehicle_information
  question: According to Nebraska law, what is the minimum legal tread depth for tires
    on a passenger vehicle?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/16 of an inch
  answer: B
  explanation: Nebraska law requires that tires have a tread depth of at least 2/32
    of an inch to be considered safe and legal for operation.
- id: 175
  category: vehicle_information
  question: 'In Nebraska, you must turn on your headlights from sunset to sunrise
    and any time visibility is less than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Nebraska Revised Statute 60-6,219 requires headlights to be on from
    sunset to sunrise and when visibility is less than 500 feet due to weather or
    other conditions.
- id: 176
  category: vehicle_information
  question: 'Nebraska law requires that the service (foot) brake must be capable of
    stopping a passenger vehicle traveling 20 mph within a distance of:'
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 50 feet
  answer: B
  explanation: Under Nebraska equipment regulations, the foot brake must be able to
    stop the vehicle within 25 feet when traveling at 20 mph on a dry, level pavement.
- id: 177
  category: vehicle_information
  question: 'Every motor vehicle operated on Nebraska highways must be equipped with
    a horn that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Nebraska law requires a horn in good working order capable of emitting
