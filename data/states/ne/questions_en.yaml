metadata:
  source: Nebraska Class O Driver Manual (dmv.nebraska.gov)
  total_questions: 332
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: How many consecutive times can you renew your Class O or Class M license
    online if it expires prior to your 72nd birthday?
  choices:
    A: One time
    B: Two times
    C: Three times
    D: Unlimited times
  answer: B
  explanation: 'The manual states: ''If your license expires prior to your 72nd birthday,
    you may renew your Class O or Class M license two consecutive times online.'''
- id: 2
  category: license_system
  question: Regardless of age, how many consecutive times may an individual renew
    their State ID Card online?
  choices:
    A: One time
    B: Two times
    C: Three times
    D: Four times
  answer: C
  explanation: According to the DMV Tips section, 'All individuals, regardless of
    age, may renew their State ID Card three consecutive times online.'
- id: 3
  category: driver_testing
  question: In which of the following Nebraska cities is drive testing strictly by
    appointment only?
  choices:
    A: Grand Island, Kearney, and North Platte
    B: Bellevue, Lincoln, and Omaha
    C: Scottsbluff, Norfolk, and Fremont
    D: Hastings, Columbus, and Papillion
  answer: B
  explanation: 'The manual specifies: ''If you are visiting an office located in Bellevue,
    Lincoln, or Omaha, drive testing is by appointment only.'''
- id: 4
  category: license_system
  question: Who is given The Parent’s Supervised Driving Program?
  choices:
    A: All drivers applying for a commercial driver's license
    B: Teens under age 16 applying for a Learner’s Permit
    C: Individuals renewing their license after age 72
    D: Drivers who have had their license suspended
  answer: B
  explanation: The manual states that The Parent’s Supervised Driving Program 'is
    given to all teens under age 16 applying for a Learner’s Permit.'
- id: 5
  category: license_system
  question: What documentation is required for all first-time and renewal driver's
    license applicants in Nebraska?
  choices:
    A: A high school diploma or GED
    B: Proof of social security number or a valid I-94/I-94A document
    C: A voter registration card
    D: A certified copy of a driving record
  answer: B
  explanation: 'The manual notes: ''Proof of social security number or a valid U.S.
    Citizenship and Immigration Services I-94 or I-94A document (in a valid foreign
    passport) is required for all first time and renewal applicants.'''
- id: 6
  category: driver_testing
  question: According to the Nebraska DMV, approximately what percentage of first-time
    applicants fail the written test?
  choices:
    A: Over 10%
    B: Over 20%
    C: Over 32%
    D: Over 50%
  answer: C
  explanation: The DMV Tips section warns applicants to carefully review the manual
    because 'Over 32% of first-time applicants fail the written test.'
- id: 7
  category: license_system
  question: How early can individuals 21 years of age and older renew their driver's
    license?
  choices:
    A: 30 days prior to their birthday
    B: 60 days prior to their birthday
    C: 90 days prior to their birthday
    D: 120 days prior to their birthday
  answer: C
  explanation: 'The manual states: ''Individuals 21 years of age and older may renew
    90 days prior to their birthday.'''
- id: 8
  category: license_system
  question: How early may individuals under 21 apply for license renewal prior to
    their 21st birthday?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: According to the manual, 'Individuals under 21 may apply for renewal
    60 days prior to their 21st birthday.'
- id: 9
  category: license_system
  question: How long can it take to receive permanent driver licensing documents in
    the mail?
  choices:
    A: Up to 5 days
    B: Up to 10 days
    C: Up to 20 days
    D: Up to 30 days
  answer: C
  explanation: The manual explains that permanent documents are mailed to an applicant’s
    principal address and 'it can take up to 20 days to receive them.'
- id: 10
  category: license_system
  question: What happens if you move and have a forwarding address on file with the
    post office when your permanent driver's license is mailed?
  choices:
    A: It will be forwarded to your new address
    B: It will be held at the local post office for pickup
    C: It will not be forwarded
    D: It will be delivered to your new address with an additional fee
  answer: C
  explanation: 'The manual explicitly states regarding permanent documents mailed
    to your principal address: ''These documents are not forwarded.'''
- id: 11
  category: license_system
  question: Which of the following is considered a peak busy time at driver licensing
    offices that applicants should try to avoid?
  choices:
    A: Tuesday mornings at 9:00 a.m.
    B: The day before and after a holiday
    C: Mid-day on a Wednesday
    D: When schools are in session
  answer: B
  explanation: 'The manual advises avoiding peak busy times, which include: ''1) after
    3:00 p.m. each workday, 2) when schools are not in session, and 3) the day before
    and after a holiday.'''
- id: 12
  category: license_system
  question: Which payment method is NOT accepted at state driver licensing offices
    in Douglas, Lancaster, and Sarpy Counties?
  choices:
    A: Cash
    B: Credit cards
    C: Checks
    D: Debit cards
  answer: C
  explanation: 'The manual warns: ''Be aware that the state driver licensing offices
    in Douglas, Lancaster, and Sarpy Counties do not accept checks.'''
- id: 13
  category: driver_responsibility
  question: Which of the following is listed as a potential red flag for human trafficking
    at a business or home?
  choices:
    A: Having a well-lit parking lot
    B: Extraordinary security measures such as barred windows and excessive exterior
      cameras
    C: Having a standard home security alarm system
    D: Employing workers who commute from neighboring towns
  answer: B
  explanation: The manual lists 'Extraordinary security measures for a business or
    home (e.g., barred or covered windows, barbed wire, excessive exterior cameras...)'
    as a red flag for human trafficking.
- id: 14
  category: driver_responsibility
  question: When observing a business, which worker behavior might be a red flag for
    human trafficking?
  choices:
    A: Taking regular, scheduled lunch breaks
    B: Complaining about their hourly wage
    C: Appearing to live at the place of business or always working
    D: Leaving the premises immediately after their shift ends
  answer: C
  explanation: The manual identifies 'Workers who appear to live at the place of business
    or are always working' as a red flag for human trafficking.
- id: 15
  category: defensive_driving
  question: According to the Governor's letter, what is an obstacle drivers may encounter
    on Nebraska roadways?
  choices:
    A: Speeds increasing sharply when approaching a town
    B: Paved roads giving way to gravel
    C: Weather conditions remaining constant year-round
    D: Traffic lights at every rural intersection
  answer: B
  explanation: 'The Governor''s letter states: ''In Nebraska, weather conditions change
    unexpectedly, paved roads give way to gravel, and speeds drop sharply when approaching
    town.'''
- id: 16
  category: license_system
  question: How many days does a new resident with a valid license from another state
    have to obtain a Nebraska license?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to Section 1A of the manual, any new resident with a valid
    license from another state must obtain a Nebraska license within 30 days.
- id: 17
  category: penalties_and_points
  question: What is the fine for a first offense of using an interactive wireless
    communication device while operating a motor vehicle in motion under the GDL laws?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: The manual states that the violation for using any type of interactive
    wireless communication device while operating a motor vehicle in motion carries
    a $200 fine for the first offense and assessed points on the license.
- id: 18
  category: penalties_and_points
  question: What is the fine for violating the seat belt rule when riding with a permit
    holder?
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: According to the GDL driving restrictions, all occupants riding with
    a permit holder must wear a seat belt, and a violation carries a $25 fine.
- id: 19
  category: license_system
  question: Who may the holder of a School Permit (SCP) transport?
  choices:
    A: Any passenger under the age of 19
    B: Up to two friends who attend the same school
    C: Only family members who reside with them to the school attended by the holder
    D: Anyone as long as an adult is present
  answer: C
  explanation: The manual specifies that a holder of a School Permit (SCP) may only
    transport family members who reside with them to the school attended by the holder.
- id: 20
  category: license_system
  question: During the first 6 months, a holder of a Provisional Operator’s Permit
    (POP) is limited to how many passengers younger than 19 who are not immediate
    family members?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: A holder of a Provisional Operator’s Permit (POP) is limited to one
    passenger younger than 19 who is not an immediate family member for the first
    6 months.
- id: 21
  category: safe_driving_rules
  question: What are the nighttime driving restrictions for a holder of a Provisional
    Operator’s Permit (POP)?
  choices:
    A: Cannot drive from 10 PM to 5 AM
    B: Cannot drive from 11 PM to 6 AM
    C: Cannot drive from midnight to 6 AM unless to or from school activities or work
    D: Cannot drive after sunset unless accompanied by an adult
  answer: C
  explanation: The manual states that a holder of a POP shall not drive from midnight
    to 6 AM unless to or from school activities or work.
- id: 22
  category: alcohol_drugs_health
  question: Under Nebraska's 'Zero tolerance' laws for drivers under 21, what is the
    penalty for a first alcohol offense?
  choices:
    A: A $500 fine and 6 points on the license
    B: Court impounding of the permit or license for 30 days
    C: Mandatory 10 days in jail
    D: Permanent revocation of the driver's license
  answer: B
  explanation: For drivers under the age of 21, a first offense under the 'Zero tolerance'
    laws results in the court impounding the permit or license for 30 days.
- id: 23
  category: penalties_and_points
  question: Individuals under 21 who accumulate six or more points on their driving
    record within one year are required to do what?
  choices:
    A: Pay a $200 surcharge
    B: Retake the driving skills test
    C: Take a driver improvement course within three months
    D: Surrender their license for 6 months
  answer: C
  explanation: The manual states that individuals under 21 accumulating six or more
    points within one year are required to take a driver improvement course within
    three months.
- id: 24
  category: license_system
  question: What type of vehicles does a Farm Husbandry Permit authorize a person
    to operate?
  choices:
    A: Commercial semi-trucks and buses
    B: Minitrucks and farm husbandry equipment
    C: Motorcycles and mopeds
    D: Any vehicle weighing over 26,000 pounds
  answer: B
  explanation: According to Section 1C-1, a Farm Husbandry Permit authorizes the operation
    of minitrucks and farm husbandry equipment.
- id: 25
  category: vehicle_information
  question: 'According to the Nebraska driver''s manual, a minitruck must have an
    engine size of:'
  choices:
    A: 500 cc's or less
    B: 1,000 cc's or less
    C: 1,500 cc's or less
    D: 2,000 cc's or less
  answer: C
  explanation: A minitruck is defined as having an engine of one thousand five hundred
    (1,500) cc's or less.
- id: 26
  category: vehicle_information
  question: What is the maximum dry weight allowed for a vehicle to be classified
    as a minitruck?
  choices:
    A: 2,500 pounds
    B: 3,000 pounds
    C: 4,200 pounds
    D: 5,000 pounds
  answer: C
  explanation: The manual defines a minitruck as a vehicle which has a dry weight
    of 4,200 pounds or less.
- id: 27
  category: safe_driving_rules
  question: Who is required to wear a seat belt when riding in a vehicle driven by
    a permit holder?
  choices:
    A: Only the driver
    B: Only passengers in the front seat
    C: Only passengers under the age of 18
    D: All occupants riding with the permit holder, including the driver
  answer: D
  explanation: Under the GDL driving restrictions, all occupants riding with a permit
    holder, including the driver, must wear a seat belt.
- id: 28
  category: penalties_and_points
  question: What is the penalty for violating the passenger limit restriction on a
    Provisional Operator’s Permit (POP)?
  choices:
    A: A $100 fine
    B: A one-point assessment on the driving record
    C: Immediate license revocation
    D: A 30-day suspension
  answer: B
  explanation: Violating the passenger restriction for a Provisional Operator's Permit
    (POP) carries a one-point assessment on the driving record.
- id: 29
  category: alcohol_drugs_health
  question: At what Blood Alcohol Content (BAC) is a driver under age 21 subject to
    the same DWI laws as a person age 21 or over?
  choices:
    A: .02 or greater
    B: .04 or greater
    C: .06 or greater
    D: .08 or greater
  answer: D
  explanation: An under age 21 driver is subject to the same DWI laws as a person
    age 21 or over if the blood alcohol content is .08 (BAC) or greater.
- id: 30
  category: vehicle_information
  question: What is the approximate top speed of a vehicle classified as a minitruck
    under the Farm Husbandry Permit?
  choices:
    A: 35 miles per hour
    B: 45 miles per hour
    C: 55 miles per hour
    D: 65 miles per hour
  answer: C
  explanation: The definition of a minitruck states that it has a top speed of approximately
    55 miles per hour.
- id: 31
  category: license_system
  question: What is the minimum age to obtain a Farm Husbandry Permit if you live
    on a farm?
  choices:
    A: 13 years old
    B: 14 years old
    C: 15 years old
    D: 16 years old
  answer: A
  explanation: According to the manual, the minimum age for a Farm Husbandry Permit
    is 13 if you live on a farm, or 14 if employed on a farm for compensation.
- id: 32
  category: license_system
  question: When does a Farm Husbandry Permit expire?
  choices:
    A: Six months after the date of issuance
    B: One year after the date of issuance
    C: On the driver's 16th birthday
    D: On the driver's 18th birthday
  answer: C
  explanation: The manual states that the expiration for a Farm Husbandry Permit is
    the driver's 16th birthday.
- id: 33
  category: license_system
  question: How long is a School Learner’s Permit (Type LPE) valid?
  choices:
    A: Three months following the date of issuance
    B: Six months following the date of issuance
    C: One year following the date of issuance
    D: Until the driver's 16th birthday
  answer: B
  explanation: The manual specifies that a School Learner’s Permit (Type LPE) expires
    six months following the date of issuance.
- id: 34
  category: safe_driving_rules
  question: Who must accompany a driver operating a motor vehicle with a School Learner’s
    Permit (LPE)?
  choices:
    A: Any licensed driver who is at least 18 years old
    B: A parent or legal guardian only
    C: A licensed driver who is at least 21 years old occupying the seat beside the
      driver
    D: No one is required if the driver is traveling to or from school
  answer: C
  explanation: The manual states that an LPE holder must be accompanied by a licensed
    motor vehicle driver who is at least 21 years of age and occupies the seat beside
    the driver.
- id: 35
  category: license_system
  question: To be eligible for a School Permit (Type SCP), a person must live or attend
    a school outside a city of at least what population?
  choices:
    A: 1,000
    B: 5,000
    C: 10,000
    D: 50,000
  answer: B
  explanation: A School Permit can be issued if the person lives outside a city of
    5,000 or more or attends a school outside a city of 5,000 or more.
- id: 36
  category: license_system
  question: What is the minimum age to apply for a School Permit (Type SCP)?
  choices:
    A: 14 years
    B: 14 years and two months
    C: 15 years
    D: 16 years
  answer: B
  explanation: The minimum age for a School Permit (Type SCP) is 14 years and two
    months, and the individual must have held an LPE or LPD for at least two months.
- id: 37
  category: driver_testing
  question: If using a 50-hour certification form to apply for a School Permit or
    Provisional Operator’s Permit, how many of those hours must be driven between
    sunset and sunrise?
  choices:
    A: 5 hours
    B: 10 hours
    C: 15 hours
    D: 20 hours
  answer: B
  explanation: The 50-hour certification form must indicate that at least 10 hours
    of motor vehicle operation was between sunset and sunrise.
- id: 38
  category: license_system
  question: When does a School Permit (Type SCP) expire?
  choices:
    A: On the driver's 16th birthday
    B: 16 years and three months
    C: On the driver's 18th birthday
    D: One year after issuance
  answer: B
  explanation: According to the manual, a School Permit (Type SCP) expires when the
    driver reaches 16 years and three months of age.
- id: 39
  category: license_system
  question: What is the minimum age at which a Learner's Permit (Type LPD) can be
    issued?
  choices:
    A: 14 years old
    B: 14 years and two months old
    C: 15 years old
    D: 16 years old
  answer: C
  explanation: The minimum age for a Learner's Permit (LPD) is 15. While you may apply
    60 days before, issuance must be on or after the 15th birthday.
- id: 40
  category: license_system
  question: How long is a Learner's Permit (Type LPD) valid before it expires?
  choices:
    A: Six months following the date of issuance
    B: One year following the date of issuance
    C: Until the driver's 16th birthday
    D: Until the driver's 18th birthday
  answer: B
  explanation: The manual states that a Learner's Permit (Type LPD) expires one year
    following the date of issuance.
- id: 41
  category: safe_driving_rules
  question: During what hours is an individual with a Provisional Operator’s Permit
    (POP) allowed to drive unsupervised for any reason?
  choices:
    A: 5 a.m. to 10 p.m.
    B: 6 a.m. to 12 midnight
    C: 7 a.m. to 9 p.m.
    D: 6 a.m. to 10 p.m.
  answer: B
  explanation: The Provisional Operator’s Permit allows an individual to operate a
    motor vehicle unsupervised in Nebraska from 6 a.m. to 12 midnight.
- id: 42
  category: safe_driving_rules
  question: Under what condition may a Provisional Operator’s Permit (POP) holder
    drive unsupervised between 12 midnight and 6 a.m.?
  choices:
    A: If they are driving to or from home to work or a school activity
    B: If they are driving with a sibling who is under 18
    C: If they have held the permit for more than 3 months
    D: Under no circumstances
  answer: A
  explanation: An individual with a POP may only drive unsupervised between 12 midnight
    and 6 a.m. if they are driving to or from home to work or a school activity.
- id: 43
  category: safe_driving_rules
  question: During the first six months of holding a Provisional Operator’s Permit
    (POP), what is the restriction on passengers?
  choices:
    A: No passengers are allowed at any time
    B: No more than one passenger who is not an immediate family member and who is
      under 19 years of age
    C: Only adult passengers over the age of 21 are allowed
    D: No more than three passengers under the age of 18
  answer: B
  explanation: During the first six months of the POP, the holder can only operate
    a motor vehicle with no more than one passenger who is not an immediate family
    member and who is under nineteen years of age.
- id: 44
  category: penalties_and_points
  question: To be eligible for a Provisional Operator’s Permit (POP), the applicant
    must not have accumulated how many points on their driving record during the preceding
    six months?
  choices:
    A: One or more points
    B: Two or more points
    C: Three or more points
    D: Five or more points
  answer: C
  explanation: Prior to making an application for a POP, the individual must not have
    accumulated three or more points on their driving record during the six month
    period immediately preceding the application date.
- id: 45
  category: vehicle_information
  question: 'According to the Farm Husbandry Permit rules, a minitruck must have an
    engine size of no more than:'
  choices:
    A: 500 cc
    B: 1,000 cc
    C: 1,500 cc
    D: 2,000 cc
  answer: C
  explanation: A minitruck is defined as a vehicle which has an engine of one thousand
    five hundred (1,500) cc’s or less.
- id: 46
  category: license_system
  question: What is the minimum age required to obtain a Class O Operator's License?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: B
  explanation: According to the manual, the minimum age to obtain a Class O Operator's
    License is 17.
- id: 47
  category: driver_testing
  question: What happens if an applicant for a Class O license fails three successive
    drive tests?
  choices:
    A: They must wait 6 months before reapplying.
    B: They must complete a DMV approved driver training course or hold an LPD for
      at least 90 days.
    C: They are permanently barred from obtaining a license.
    D: They must pay a fine and retake the written test immediately.
  answer: B
  explanation: The manual states that applicants who fail three successive drive tests
    will not be eligible to reapply until they show proof of successful completion
    of a DMV approved driver training course, or have held a Learner's Permit (LPD)
    for at least 90 days.
- id: 48
  category: license_system
  question: Which of the following vehicles CANNOT be operated with a standard Class
    O License?
  choices:
    A: Autocycle
    B: Moped
    C: Utility-Terrain Vehicle (UTV)
    D: Motorcycle
  answer: D
  explanation: A Class O License authorizes the operation of any motor vehicle, including
    a Moped, Autocycle, ATV, and UTV, but it specifically does not include a motorcycle
    or commercial motor vehicle.
- id: 49
  category: safe_driving_rules
  question: When operating an ATV or UTV on a public roadway, what are the restricted
    hours of operation?
  choices:
    A: Between sunset and sunrise
    B: Between sunrise and sunset
    C: Only between 8:00 AM and 5:00 PM
    D: There are no restricted hours
  answer: B
  explanation: Any authorized ATV/UTV operation on public roadways must occur only
    between sunrise and sunset.
- id: 50
  category: vehicle_information
  question: What is the maximum dry weight allowed for an All-Terrain Vehicle (ATV)?
  choices:
    A: 1,000 pounds
    B: 1,200 pounds
    C: 1,500 pounds
    D: 2,000 pounds
  answer: B
  explanation: The manual defines an ATV as a motorized off-highway device which has
    a dry weight of twelve hundred (1,200) pounds or less.
- id: 51
  category: safe_driving_rules
  question: When crossing a highway in an ATV or UTV, at what angle must the crossing
    be made?
  choices:
    A: 45 degrees
    B: 60 degrees
    C: 90 degrees
    D: 180 degrees
  answer: C
  explanation: When crossing a highway in an ATV/UTV, the crossing must be made at
    an angle of approximately 90 degrees and at a place where no obstruction prevents
    a quick and safe crossing.
- id: 52
  category: vehicle_information
  question: What specific equipment must be active and present when operating an ATV
    or UTV on a public roadway?
  choices:
    A: Hazard lights and a slow-moving vehicle sign
    B: Headlight, taillight, and a bicycle safety flag
    C: A flashing yellow beacon
    D: Reflective tape on all sides
  answer: B
  explanation: For authorized ATV/UTV operation on public roadways, the headlight
    and taillight must be on and the vehicle must be equipped with a bicycle safety
    flag.
- id: 53
  category: safe_driving_rules
  question: What is the maximum speed an ATV or UTV can be operated at on public roadways?
  choices:
    A: Lower than 25 mph
    B: Lower than 30 mph
    C: Lower than 35 mph
    D: Lower than 45 mph
  answer: B
  explanation: Authorized ATV/UTV operation on public roadways must occur at speeds
    lower than 30 mph.
- id: 54
  category: license_system
  question: For an individual under 18 to be eligible for a Class O operator's license,
    how long must they have held a Provisional Operator's Permit (POP)?
  choices:
    A: At least 3 months
    B: At least 6 months
    C: At least 9 months
    D: At least 12 months
  answer: D
  explanation: Individuals under the age of 18 must have held a POP for at least 12
    months to be eligible for an operator's license.
- id: 55
  category: penalties_and_points
  question: How many points on their driving record in the previous 12 months would
    disqualify an individual under 18 from upgrading their POP to a Class O operator's
    license?
  choices:
    A: One or more points
    B: Two or more points
    C: Three or more points
    D: Five or more points
  answer: C
  explanation: To be eligible for an operator's license, individuals under 18 must
    not have accumulated three or more points on their driving records during the
    previous 12 month period.
- id: 56
  category: driver_testing
  question: What type of vehicle CANNOT be used to administer a drive test for a Class
    O license?
  choices:
    A: A passenger car
    B: A pickup truck
    C: An autocycle
    D: An SUV
  answer: C
  explanation: The manual explicitly states, 'A drive test cannot be administered
    in an autocycle for a Class O license.'
- id: 57
  category: safe_driving_rules
  question: What is required of all passengers being transported in a motor vehicle
    operated by a Provisional Operator's Permit (POP) holder?
  choices:
    A: They must be over the age of 18.
    B: They must ride secured in an occupant protection system.
    C: They must sit in the back seat.
    D: They must hold a valid driver's license.
  answer: B
  explanation: The manual states that all persons being transported in a motor vehicle
    operated by a holder of a POP are required to ride secured in an occupant protection
    system.
- id: 58
  category: license_system
  question: When does a Provisional Operator's Permit (POP) expire?
  choices:
    A: On the driver's 17th birthday
    B: On the driver's 18th birthday
    C: On the driver's 21st birthday
    D: Five years from the date of issuance
  answer: B
  explanation: According to the manual, the expiration for a Provisional Operator's
    Permit (POP) is the driver's 18th birthday.
- id: 59
  category: license_system
  question: Under what circumstance will a "Z" restriction be placed on a driver's
    license?
  choices:
    A: When the driver requires corrective lenses to pass the vision test.
    B: When the driver is under 18 years of age.
    C: When a motor scooter, 3-wheeled scooter, or 3-wheeled motorcycle is used during
      the drive test.
    D: When the driver is restricted to daylight driving only.
  answer: C
  explanation: The manual states that a "Z" restriction will be placed on the license
    when a motor scooter, 3-wheeled scooter, or 3-wheeled motorcycle is used during
    the drive test.
- id: 60
  category: license_system
  question: A Commercial Driver's License (CDL) is required to drive a vehicle with
    a Gross Vehicle Weight Rating (GVWR) of more than how many pounds?
  choices:
    A: 10,000 pounds
    B: 16,000 pounds
    C: 26,000 pounds
    D: 36,000 pounds
  answer: C
  explanation: A CDL is required for anyone driving a vehicle that has a Gross Combination
    Weight Rating (GCWR) or Gross Vehicle Weight Rating (GVWR) of more than 26,000
    pounds.
- id: 61
  category: license_system
  question: You must obtain a Commercial Driver's License (CDL) if you drive a vehicle
    designed to carry at least how many persons, including the driver?
  choices:
    A: '10'
    B: '12'
    C: '15'
    D: '16'
  answer: D
  explanation: A CDL is required for anyone driving a vehicle that carries 16 or more
    persons (including the driver).
- id: 62
  category: penalties_and_points
  question: For which type of violation is a CDL holder allowed to enter a traffic
    diversion program to avoid a conviction?
  choices:
    A: Speeding in a school zone
    B: A parking violation
    C: Running a red light
    D: CDL holders cannot enter a diversion program for any violation
  answer: B
  explanation: The manual specifies that no holder of a CDL can enter a traffic diversion
    program to avoid a conviction for a traffic citation, except for a parking violation.
- id: 63
  category: license_system
  question: How often must an applicant who is NOT a U.S. citizen provide proof of
    lawful status at the driver licensing office?
  choices:
    A: Only on their first visit
    B: Every five years
    C: For each visit to the driver licensing office
    D: Only when changing their principal address
  answer: C
  explanation: Applicants who are not U.S. citizens will be required to provide proof
    of lawful status for each visit to the driver licensing office.
- id: 64
  category: license_system
  question: Which of the following is true regarding the documents you present for
    a Nebraska permit, license, or ID card?
  choices:
    A: Faxed documents are accepted if they are legible.
    B: Photocopied documents are accepted if notarized.
    C: Faxed or photocopied documents will not be accepted.
    D: Digital copies on a smartphone are preferred.
  answer: C
  explanation: The manual explicitly states that faxed or photocopied documents will
    NOT be accepted.
- id: 65
  category: license_system
  question: What must you present if you have had a name change and are applying for
    a permit, driver's license, or State ID Card?
  choices:
    A: A utility bill with your new name
    B: A document such as a certified marriage license or court order linking your
      new name to your current name
    C: A notarized letter from a family member
    D: A new social security card only
  answer: B
  explanation: In the event of a name change, you must present document(s) (certified
    marriage license(s), certified divorce decree(s) or a court order) that links
    your new name to the name that currently exists on your permit, driver’s license
    or State ID Card.
- id: 66
  category: license_system
  question: Which of the following birth certificates is NOT acceptable as proof of
    U.S. citizenship or lawful status?
  choices:
    A: A certified birth certificate issued by a state government office
    B: A hospital-issued birth certificate
    C: A Consular Report of Birth Abroad
    D: A Puerto Rican birth certificate issued in 2012
  answer: B
  explanation: The manual states that hospital issued birth certificates cannot be
    accepted, nor can Puerto Rican birth certificates issued prior to September 30,
    2010.
- id: 67
  category: license_system
  question: When verifying your principal address in Nebraska, which of the following
    is true?
  choices:
    A: You only need to present one document.
    B: A P.O. Box is an acceptable proof of principal address.
    C: You must present two documents from two different issuing sources.
    D: Both documents can be from the same issuing source.
  answer: C
  explanation: You must present TWO documents with your Nebraska principal address
    listed, and proof of principal address must be from two different issuing sources.
    A P.O. Box will not be accepted.
- id: 68
  category: license_system
  question: What can an applicant under the age of 21 do if they cannot provide proof
    of their principal address?
  choices:
    A: They can use their high school transcript as sole proof.
    B: They can use their parents' or guardians' principal address documents.
    C: They are exempt from the principal address requirement.
    D: They must wait until they are 21 to apply.
  answer: B
  explanation: If you are under 21 and cannot provide proof of principal address,
    parents or guardians’ principal address documents will be accepted.
- id: 69
  category: license_system
  question: Driver's licenses issued to individuals with a PAROLEE immigration status
    will carry a distinguishing mark indicating what?
  choices:
    A: RESTRICTED TO DAYLIGHT DRIVING
    B: NOT FOR FEDERAL IDENTIFICATION
    C: TEMPORARY RESIDENT
    D: NON-CITIZEN DRIVER
  answer: B
  explanation: Individuals with a PAROLEE immigration status are allowed to receive
    cards that carry a distinguishing mark that indicates they are NOT FOR FEDERAL
    IDENTIFICATION.
- id: 70
  category: driver_testing
  question: What does the DMV vision test measure?
  choices:
    A: Color blindness and depth perception
    B: Visual acuity and peripheral vision
    C: Night vision and glare resistance
    D: Distance estimation and visual acuity
  answer: B
  explanation: The manual states that the DMV vision test measures visual acuity and
    peripheral vision.
- id: 71
  category: driver_testing
  question: If you are taking a drive test in a vehicle with a model year of 1973
    or after, what seat belt requirement must the vehicle meet?
  choices:
    A: Only the driver must have a working seat belt.
    B: Only the passenger seat must have a working seat belt.
    C: It must have clean and working seat belts for both the passenger and the driver.
    D: Seat belts are optional for vehicles manufactured before 1980.
  answer: C
  explanation: Model year vehicles 1973 or after must have passenger and driver seat
    belts that are clean and in working order for driver licensing staff and driver's
    use.
- id: 72
  category: vehicle_information
  question: Which of the following is a requirement for the vehicle you furnish for
    your drive test?
  choices:
    A: It must have an automatic transmission.
    B: It must have a working speedometer and brake lights.
    C: It must be less than 10 years old.
    D: It must have dual controls for the examiner.
  answer: B
  explanation: The vehicle furnished for the drive test must be in good mechanical
    condition, have working brake lights, and the vehicle speedometer must work properly.
- id: 73
  category: driver_testing
  question: If you fail a driver's test, are you allowed to retake it on the same
    day?
  choices:
    A: Yes, if you pay an additional fee.
    B: Yes, but only if you failed the written test.
    C: No, any test failed may not be retaken the same day.
    D: No, you must wait at least 14 days to retake any test.
  answer: C
  explanation: The manual explicitly states that any test failed may not be retaken
    the same day.
- id: 74
  category: license_system
  question: After passing your test, how many days do you have to present the Issuance
    Certificate to the county treasurer or state driver licensing office?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: D
  explanation: You must present the Issuance Certificate to any county treasurer or
    state driver licensing office within 90 days of passing the test.
- id: 75
  category: license_system
  question: Can you use the 30-day receipt issued after paying your fee to board a
    commercial airplane?
  choices:
    A: Yes, it is a valid federal ID.
    B: Yes, but only for domestic flights.
    C: No, the Transportation Security Administration (TSA) does not accept the 30-day
      receipt as acceptable proof of identification.
    D: No, unless you also present your birth certificate.
  answer: C
  explanation: The manual notes that the Transportation Security Administration does
    not accept the 30-day receipt as acceptable proof of identification to board planes
    or enter certain federal facilities.
- id: 76
  category: license_system
  question: What will happen if you move and do not update your address with the DMV
    before your permanent license is mailed?
  choices:
    A: The U.S. Postal Service will forward it to your new address.
    B: The document will not be forwarded to another address by the U.S. Postal Service.
    C: The DMV will automatically track your new address and resend it.
    D: You will be fined by the county treasurer.
  answer: B
  explanation: The manual states to ensure the address provided is current as these
    documents will not be forwarded to another address by the U.S. Postal Service.
- id: 77
  category: license_system
  question: If an applicant is denied or refused a license or State ID Card, to whom
    can the driver licensing staff's decision be appealed?
  choices:
    A: The County Treasurer
    B: The State Supreme Court
    C: The Director of the Department of Motor Vehicles
    D: The local police department
  answer: C
  explanation: The driver licensing staff's decision can be appealed to the Director
    of the Department of Motor Vehicles as provided in Nebraska Revised Statute §60-4,114.
- id: 78
  category: license_system
  question: Under special licensing rules for active duty military personnel stationed
    outside of Nebraska, how long is a Nebraska license valid after discharge or return
    to the state?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: The license is valid while serving on active duty and for 60 days following
    a discharge or return to Nebraska – whichever is later.
- id: 79
  category: license_system
  question: If you indicate a desire to register to vote when applying for a license,
    within how many days will your Voter Registration card be mailed to you?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Within 30 days of completion of an application where the applicant
    has indicated a desire to register to vote, a Voter Registration card is mailed
    to the applicant.
- id: 80
  category: license_system
  question: Which of the following groups is NOT eligible to obtain documents online
    through the Nebraska DMV services?
  choices:
    A: Individuals over the age of 21
    B: Active duty military personnel
    C: Non-U.S. citizens
    D: Applicants for a Provisional Operator's Permit
  answer: C
  explanation: The manual explicitly states, "Non-U.S. citizens are not eligible for
    online services."
- id: 81
  category: license_system
  question: To obtain a Provisional Operator's Permit (POP) online, an applicant must
    be within 60 days of their 16th birthday and have held a Learner's Permit or School
    Permit for at least how long?
  choices:
    A: Two months
    B: Three months
    C: Six months
    D: Twelve months
  answer: C
  explanation: To get a Provisional Operator's Permit online, the applicant must have
    held a School Learner's Permit, Learner's Permit, School Permit or combination
    for at least six months.
- id: 82
  category: penalties_and_points
  question: To obtain a Class O Operator's License online, you must be at least 17
    years old and have NOT accumulated how many points on your driving record during
    the previous 12 months?
  choices:
    A: One or more points
    B: Two or more points
    C: Three or more points
    D: Six or more points
  answer: C
  explanation: To obtain a Class O Operator's License online, you must not have accumulated
    three or more points on your driving record during the previous 12 month period.
- id: 83
  category: license_system
  question: How many consecutive times may a Class O (car) or Class M (motorcycle)
    license holder renew their license online?
  choices:
    A: One time
    B: Two consecutive times
    C: Three consecutive times
    D: Unlimited times before age 72
  answer: B
  explanation: Class O and Class M license holders may renew two consecutive times
    online. (State ID Card holders may renew three consecutive times).
- id: 84
  category: license_system
  question: What symbol will be placed on the front of your permit, license, or State
    ID Card if you say yes to organ and tissue donation?
  choices:
    A: A red cross
    B: A green ribbon
    C: A heart donor symbol
    D: A medical caduceus
  answer: C
  explanation: If a person says yes to organ and/or tissue donation, a heart donor
    symbol will be placed on the front of the permit, license or State ID Card.
- id: 85
  category: license_system
  question: Can a minor between 16 and 18 years old elect to be an organ donor on
    their Nebraska driver's license?
  choices:
    A: No, only individuals 18 and older can elect to be donors.
    B: Yes, and their decision is final and cannot be changed by anyone.
    C: Yes, however their parents or legal adult guardians may amend their donation
      decision.
    D: No, they must wait until they are 21 years old.
  answer: C
  explanation: A minor (between 16 and 18 years old) may elect to be a donor, however
    their parents or legal adult guardians, if available, may amend their donation
    decision.
- id: 86
  category: driver_responsibility
  question: Under Nebraska First Person Legislation, who can rescind a person's decision
    to be an organ donor after their death?
  choices:
    A: The person's immediate family
    B: The attending physician
    C: No one
    D: The Department of Motor Vehicles
  answer: C
  explanation: According to Nebraska First Person Legislation, a donation made by
    permit, license, or State ID Card cannot be rescinded by anyone after a person's
    death.
- id: 87
  category: driver_testing
  question: What happens if a driver is recalled for a re-examination of their driving
    capability and fails to report for the examination?
  choices:
    A: Their license will be suspended for 30 days
    B: Their license will be cancelled
    C: They will be fined $100
    D: They will receive a warning letter
  answer: B
  explanation: Failure to report for a re-examination, submit required medical/vision
    statements, or pass the tests will result in the license being cancelled.
- id: 88
  category: license_system
  question: When do driver's licenses issued to individuals 21 or older generally
    expire in Nebraska?
  choices:
    A: On their birthday in the 3rd year after issuance
    B: On their birthday in the 4th year after issuance
    C: On their birthday in the 5th year after issuance
    D: On their birthday in the 10th year after issuance
  answer: C
  explanation: Licenses issued to individuals 21 or older expire on the license holder's
    birthday in the fifth year after issuance.
- id: 89
  category: license_system
  question: How many days prior to their birthday may an individual who is 21 or older
    apply to renew their driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Individuals 21 and over may renew their license 90 days prior to their
    birthday.
- id: 90
  category: license_system
  question: How many days do you have to update your name or address on your driver's
    license after a change?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: State statute requires that name and address changes be made within
    60 days of the change.
- id: 91
  category: license_system
  question: What does a 'G' restriction on a Nebraska driver's license indicate?
  choices:
    A: Corrective Lenses required
    B: Limited to Daylight Only
    C: No Interstate Driving
    D: Automatic Transmission required
  answer: B
  explanation: A 'G' restriction on a license means the driver is limited to daylight
    driving only.
- id: 92
  category: license_system
  question: Which restriction code indicates that a driver is not permitted to drive
    on the interstate?
  choices:
    A: Code C
    B: Code F
    C: Code Q
    D: Code W
  answer: C
  explanation: Restriction code 'Q' stands for 'No Interstate Driving.'
- id: 93
  category: license_system
  question: Which of the following is true regarding holding multiple identification
    documents in Nebraska?
  choices:
    A: You may hold a learner's permit and a State ID Card at the same time.
    B: You may hold a driver's license and a State ID Card at the same time.
    C: No person shall hold a permit or license with a State ID Card at the same time.
    D: You may hold a commercial driver's license and a State ID Card at the same
      time.
  answer: C
  explanation: Nebraska law states that no person shall hold a permit or license with
    a State ID Card at the same time.
- id: 94
  category: penalties_and_points
  question: What is the legal term for when the court seizes and holds a license for
    a specified period of time before returning it to the licensee?
  choices:
    A: Suspension
    B: Revocation
    C: Impoundment
    D: Confiscation
  answer: C
  explanation: Impoundment is the seizure and holding of the license by the court,
    after which the license is returned to the licensee.
- id: 95
  category: penalties_and_points
  question: If a law enforcement officer confiscates your license for failing an alcohol
    content test, how long is the temporary license valid?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: Upon confiscation of a license for failing or refusing an alcohol test,
    the driver is issued a temporary license that is valid for 15 days.
- id: 96
  category: penalties_and_points
  question: 'Your license may be suspended or revoked if you are involved in an at-fault
    crash and fail to have the required minimum personal injury liability coverage
    of:'
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: C
  explanation: A license may be suspended or revoked for failing to have the minimum
    insurance liability coverage, which includes $50,000 for personal injury, and
    being involved in an at-fault crash.
- id: 97
  category: penalties_and_points
  question: An individual under 21 may have their license suspended or revoked if
    they fail to complete a driver improvement course after accumulating how many
    points in one year?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Individuals under 21 can face suspension or revocation if they fail
    to complete a driver improvement course after accumulating 6 points in one year.
- id: 98
  category: penalties_and_points
  question: Accumulating 12 points on your driving record within a two-year period
    will cause an automatic license revocation for what length of time?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Accumulating 12 points in a two-year period causes automatic revocation
    of the operator's license for six months.
- id: 99
  category: license_system
  question: Before a 'Veteran' designation can be added to a Nebraska driver's license,
    where must the veteran certify their eligibility?
  choices:
    A: The Department of Motor Vehicles (DMV)
    B: The Nebraska Department of Veterans' Affairs (NDVA)
    C: The local county treasurer's office
    D: The Social Security Administration
  answer: B
  explanation: Veterans must certify their eligibility through the Nebraska Department
    of Veterans’ Affairs (NDVA) prior to adding the designation to their license.
- id: 100
  category: license_system
  question: What will happen if you apply for a Nebraska driver's license while your
    driving privileges are currently suspended in another state?
  choices:
    A: You will be issued a restricted Nebraska license.
    B: You will be issued a temporary 30-day license.
    C: A Nebraska license will not be issued.
    D: You must pay double the standard application fee to get a license.
  answer: C
  explanation: If driving privileges are revoked or suspended in Nebraska or any other
    state or jurisdiction, a Nebraska license will not be issued.
- id: 101
  category: penalties_and_points
  question: Accumulating 12 points in a two-year period causes automatic revocation
    of the operator's license for how long?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 3 years
  answer: B
  explanation: According to the manual, accumulating 12 points in a two-year period
    causes automatic revocation of the operator's license for six months.
- id: 102
  category: penalties_and_points
  question: How many points are assessed for a third offense drunk driving conviction?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: D
  explanation: The Nebraska Point System assesses 12 points for a third offense drunk
    driving conviction.
- id: 103
  category: penalties_and_points
  question: If a person fails to surrender their revoked license, what is the maximum
    penalty?
  choices:
    A: Fined $500 or less, and/or imprisoned in county jail for 30 days or less
    B: Fined $1000 and imprisoned for 6 months
    C: Fined $250 and 100 hours of community service
    D: Permanent loss of driving privileges
  answer: A
  explanation: Persons who fail to surrender the license will be fined $500 or less,
    and/or imprisoned in county jail for 30 days or less.
- id: 104
  category: penalties_and_points
  question: How long do points from a traffic conviction count against your driving
    record?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: Convictions remain on the record for five years; however, the points
    no longer count two years after the date of violation.
- id: 105
  category: alcohol_drugs_health
  question: Under the Administrative License Revocation (ALR) law, how long is the
    temporary license valid after it is issued?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: Drivers receive a temporary license which expires 15 days after it
    is issued.
- id: 106
  category: alcohol_drugs_health
  question: For a first-time offender who fails an alcohol test, how long is the administrative
    license revocation (ALR)?
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 3 years
  answer: B
  explanation: First time offenders who fail an alcohol test serve a 180 day administrative
    license revocation (ALR).
- id: 107
  category: penalties_and_points
  question: How many points are assessed for using a handheld wireless communication
    device to read, type, or send written communication while operating a motor vehicle?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Using a handheld wireless communication device to read, type or send
    written communication while operating a motor vehicle results in 3 points.
- id: 108
  category: penalties_and_points
  question: Which of the following violations results in 0 points being assessed (for
    citations dated on or after 11/14/20)?
  choices:
    A: Speeding 1 thru 5 MPH over the posted speed limit
    B: Speeding over 5 thru 10 MPH inside city limits
    C: Unlawful obstruction of the view of an operator
    D: Violation of Child Restraint Law
  answer: A
  explanation: Speeding 1 thru 5 MPH over the posted speed limit (inside or outside
    city limits) results in 0 points for citations dated on or after 11/14/20.
- id: 109
  category: penalties_and_points
  question: How many points are assessed for leaving the scene of a crash?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Leaving the scene of a crash results in 6 points under the Nebraska
    Point System.
- id: 110
  category: alcohol_drugs_health
  question: If an underage driver (age 20 and younger) is convicted of a .02% drinking
    and driving violation, how long will the court impound their license?
  choices:
    A: 15 days
    B: 30 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: For a conviction of .02% the license will be impounded by the court
    for 30 days and will become part of the driving record for 90 days.
- id: 111
  category: penalties_and_points
  question: What is required to maintain proof of financial responsibility following
    a license revocation?
  choices:
    A: A cash deposit of $10,000
    B: Form SR-22 from an insurance company for three years
    C: A letter of recommendation from an employer
    D: Completion of an 8-hour defensive driving course
  answer: B
  explanation: Proof of financial responsibility must be maintained for three years
    following the ending date of the original revocation, usually provided with a
    written certification of insurance identified as Form SR-22.
- id: 112
  category: penalties_and_points
  question: How can a driver receive a 2-point credit on their driving record?
  choices:
    A: By driving one full year without a citation
    B: By successfully completing a DMV approved driver improvement course prior to
      accumulating 12 points
    C: By paying a $100 fee to the DMV
    D: By surrendering their license voluntarily for 30 days
  answer: B
  explanation: A credit of 2 points may be granted to a driver successfully completing
    a DMV approved driver improvement course prior to twelve points being accumulated.
- id: 113
  category: penalties_and_points
  question: For which of the following violations are NO points assessed?
  choices:
    A: Operating a vehicle with an expired license
    B: Failure to submit to an alcohol content test
    C: Parking violations
    D: Unlawful obstruction of the view of an operator
  answer: C
  explanation: No points are assessed for parking, muffler, no valid operator's license
    on person, or for violations involving occupant protection system, motorcycle
    or a moped protective helmet.
- id: 114
  category: alcohol_drugs_health
  question: If a person refuses to submit to a chemical test for alcohol or drugs,
    how long must they serve an Administrative License Revocation (ALR)?
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 3 years
  answer: C
  explanation: Persons who refuse to submit to a chemical test for alcohol or drugs
    must serve a one year ALR.
- id: 115
  category: penalties_and_points
  question: What is the penalty for an underage driver who is convicted of driving
    during their impoundment period?
  choices:
    A: License revoked for six months by the court
    B: License revoked for one year by the court
    C: License permanently revoked
    D: 30 days in county jail
  answer: A
  explanation: Any underage driver that is convicted of driving during the impoundment
    will have their license revoked for six months by the court.
- id: 116
  category: penalties_and_points
  question: If an offender refuses to submit to a chemical test, how long must they
    wait after their temporary license expires to apply for a Special Purpose Permit
    (SPP)?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 90 days
  answer: D
  explanation: For a refusal to submit to a test, the offender must wait 90 days after
    the temporary license expires to apply for the SPP.
- id: 117
  category: license_system
  question: 'An Employment Drive Permit allows a driver whose privileges are revoked
    under the point system to drive:'
  choices:
    A: Anywhere within their county of residence
    B: To and from work and home via the most direct route
    C: Only during daylight hours
    D: Any non-commercial vehicle for any purpose
  answer: B
  explanation: Employment Drive Permits only allow the holder to drive to and from
    the work location and home via the most direct route and strictly in reference
    to the terms of employment.
- id: 118
  category: penalties_and_points
  question: When can a first-time offender subject to an Administrative License Revocation
    (ALR) apply for an Ignition Interlock Permit (IIP)?
  choices:
    A: Immediately upon revocation
    B: After the 15-day temporary license expires
    C: After 45 days
    D: After 90 days
  answer: B
  explanation: First time offenders subject to an ALR may install an ignition interlock
    system and apply for an Ignition Interlock Permit (IIP) after the 15 day temporary
    license expires.
- id: 119
  category: penalties_and_points
  question: What is the penalty if a driver is convicted of tampering with an ignition
    interlock system and has a blood alcohol content (BAC) of at least .02%?
  choices:
    A: Class I Misdemeanor
    B: Class II Misdemeanor
    C: Class III Felony
    D: Class IV Felony
  answer: D
  explanation: A conviction of a driver tampering with or circumventing an interlock
    system is a Class I Misdemeanor. If the driver has an alcohol content of at least
    .02 with the above indicated violations, it is a Class IV Felony.
- id: 120
  category: license_system
  question: 'A Medical Hardship Driving Permit allows individuals with revoked driving
    privileges to drive:'
  choices:
    A: To the pharmacy to pick up prescriptions
    B: From home or work to a specified hospital, clinic, or doctor's office for medical
      treatment
    C: To any medical facility within a 50-mile radius
    D: Only in emergency situations requiring an ambulance
  answer: B
  explanation: Permit holders can only drive from home or work to a specified hospital,
    clinic, doctor's office, or similar location and return for the purpose of medical
    treatment.
- id: 121
  category: penalties_and_points
  question: 'Fleeing from a law enforcement officer to avoid arrest for the violation
    of any Nebraska law which constitutes a felony is considered a:'
  choices:
    A: Class I Misdemeanor
    B: Class II Misdemeanor
    C: Class IV Felony
    D: Class I Felony
  answer: C
  explanation: Any driver who flees in order to avoid arrest for the violation of
    any Nebraska law which constitutes a felony commits a Class IV felony.
- id: 122
  category: penalties_and_points
  question: What is the maximum period a driver's license may be revoked for leaving
    the scene of a motor vehicle crash upon conviction?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: Persons who leave the scene of a motor vehicle crash may have their
    driver license revoked for up to one year upon conviction.
- id: 123
  category: alcohol_drugs_health
  question: For a second conviction of a minor in possession (age 20 and younger),
    how long will the court impound the permit or license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 12 months
  answer: C
  explanation: For a second offense of minor in possession, the permit or license
    will be impounded by the court for 90 days.
- id: 124
  category: alcohol_drugs_health
  question: Under Nebraska law, who is prohibited from consuming or possessing an
    open container of an alcoholic beverage inside a vehicle on a public roadway?
  choices:
    A: Only the driver
    B: Only passengers under the age of 21
    C: Both drivers and passengers
    D: Only passengers in the front seat
  answer: C
  explanation: It is unlawful to consume or be in possession of an open container
    of an alcoholic beverage inside any vehicle on any public roadway or public parking
    area in Nebraska. This includes both drivers and passengers.
- id: 125
  category: alcohol_drugs_health
  question: 'It is unlawful to operate a motor vehicle on Nebraska roadways if a driver
    under the age of 21 has a Blood Alcohol Concentration (BAC) of:'
  choices:
    A: .00% or higher
    B: .02% or higher
    C: .04% or higher
    D: .08% or higher
  answer: B
  explanation: It is unlawful to operate a motor vehicle on Nebraska roadways if the
    driver has a Blood Alcohol Concentration (BAC) of .02% or higher and the driver
    is under 21.
- id: 126
  category: alcohol_drugs_health
  question: What is the legal Blood Alcohol Concentration (BAC) limit for operating
    a commercial motor vehicle in Nebraska?
  choices:
    A: .02% or higher
    B: .04% or higher
    C: .06% or higher
    D: .08% or higher
  answer: B
  explanation: It is unlawful to operate a motor vehicle on Nebraska roadways if the
    driver has a Blood Alcohol Concentration (BAC) of .04% or higher when operating
    a commercial motor vehicle.
- id: 127
  category: alcohol_drugs_health
  question: 'Under Nebraska''s "Implied Consent" law, any driver operating a vehicle
    on Nebraska roadways has already agreed to:'
  choices:
    A: Allow their vehicle to be searched without a warrant
    B: Submit to a chemical test of blood, breath, or urine when requested by law
      enforcement
    C: Pay all traffic fines within 30 days
    D: Have an ignition interlock device installed
  answer: B
  explanation: Any driver that operates a vehicle on Nebraska roadways has already
    agreed to submit to a chemical test or tests when requested by a law enforcement
    officer.
- id: 128
  category: penalties_and_points
  question: What is the administrative sanction for refusing to submit to a chemical
    test of blood, breath, or urine?
  choices:
    A: 30 days of license revocation
    B: 6 months of license revocation
    C: 1 year of license revocation
    D: 5 years of license revocation
  answer: C
  explanation: The administrative sanction for refusal to submit to a chemical test
    is one year of license revocation.
- id: 129
  category: alcohol_drugs_health
  question: Which of the following is a factor that affects an individual's absorption
    of alcohol?
  choices:
    A: The type of alcoholic beverage consumed
    B: The driver's height
    C: The amount of food in the digestive tract
    D: The time of day the alcohol is consumed
  answer: C
  explanation: 'Many factors affect an individual''s absorption of alcohol. These
    include: 1) weight, 2) sex, 3) amount of food in the digestive tract, and 4) time
    spent drinking.'
- id: 130
  category: alcohol_drugs_health
  question: At what Blood Alcohol Concentration (BAC) does impairment of a driver's
    choice reaction time begin?
  choices:
    A: .02%
    B: .03%
    C: .04%
    D: .08%
  answer: B
  explanation: When the driver must choose from a number of responses (choice reaction),
    impairment begins at .03% BAC.
- id: 131
  category: alcohol_drugs_health
  question: By the time a driver reaches a .08% BAC, how much more likely are they
    to be involved in a fatal crash compared to a non-drinking driver?
  choices:
    A: Twice as likely
    B: Three times as likely
    C: Four times as likely
    D: Five times as likely
  answer: B
  explanation: The manual states that by the time a driver reaches .08% BAC, he or
    she is three times more likely to be involved in a fatal crash than a non-drinking
    driver.
- id: 132
  category: vehicle_information
  question: What is the recommended hand position on the steering wheel for vehicles
    equipped with airbags?
  choices:
    A: 10 o'clock and 2 o'clock
    B: 8 o'clock and 4 o'clock
    C: 9 o'clock and 3 o'clock
    D: 11 o'clock and 1 o'clock
  answer: C
  explanation: The driver's recommended hand position for vehicles equipped with airbags
    located in the steering wheel is the 9 o'clock and 3 o'clock position.
- id: 133
  category: safe_driving_rules
  question: How much space should drivers of air bag-equipped vehicles allow between
    themselves and the steering wheel?
  choices:
    A: At least 5 inches
    B: At least 8 inches
    C: At least 10 inches
    D: At least 12 inches
  answer: C
  explanation: Drivers of air bag-equipped vehicles should allow at least 10 inches
    of space between themselves and the steering wheel.
- id: 134
  category: safe_driving_rules
  question: For maximum safety, children of what age and younger should ride in the
    rear seat of a vehicle?
  choices:
    A: Age 8 and younger
    B: Age 10 and younger
    C: Age 12 and younger
    D: Age 14 and younger
  answer: C
  explanation: For maximum safety, children age 12 and younger should ride in the
    rear seat.
- id: 135
  category: penalties_and_points
  question: 'The law requiring children up to age eight to ride correctly secured
    in a federally approved child safety seat is considered a:'
  choices:
    A: Primary Law
    B: Secondary Law
    C: Provisional Law
    D: Commercial Law
  answer: A
  explanation: The manual identifies the requirement for children up to age eight
    to ride correctly secured in a federally approved child safety seat as a Primary
    Law, meaning a driver can be stopped and ticketed solely for this violation.
- id: 136
  category: safe_driving_rules
  question: How long are children required to ride in a rear-facing car seat?
  choices:
    A: Up to age one
    B: Up to age two or until they reach the upper height or weight limit allowed
      by the manufacturer
    C: Up to age three
    D: Until they weigh 40 pounds
  answer: B
  explanation: Children ride rear-facing up to age two or until they reach the upper
    height or weight limit allowed by the car seat's manufacturer.
- id: 137
  category: safe_driving_rules
  question: Children up to what age are prohibited from riding in cargo areas?
  choices:
    A: Age 12
    B: Age 14
    C: Age 16
    D: Age 18
  answer: D
  explanation: Children up to age eighteen are prohibited from riding in cargo areas.
    This is a Primary Law.
- id: 138
  category: penalties_and_points
  question: What is the penalty for violating the Child Passenger Restraint Law?
  choices:
    A: A $25 fine plus court costs and 1 point assessed against the driving record
    B: A $50 fine and 2 points assessed against the driving record
    C: A $100 fine and immediate license suspension
    D: A $10 fine and mandatory traffic school
  answer: A
  explanation: Violation of the Child Passenger Restraint Law carries a $25 fine plus
    court costs and 1 point is assessed against the operator's driving record.
- id: 139
  category: defensive_driving
  question: If you are about to hit a deer, what is your safest action?
  choices:
    A: Swerve into the oncoming traffic lane
    B: Veer off the roadway into the ditch
    C: Brake firmly, steer to maintain control, and stop as safely as possible
    D: Accelerate to reduce the time of impact
  answer: C
  explanation: If you are about to hit a deer, your safest action is to BRAKE (firmly),
    STEER (to maintain control) and STOP (as safely as possible). You should not veer
    off the roadway.
- id: 140
  category: license_system
  question: If an applicant has suffered a loss of consciousness within how many months
    prior to obtaining or renewing a license must they have a physician certify they
    can drive safely?
  choices:
    A: One month
    B: Three months
    C: Six months
    D: Twelve months
  answer: B
  explanation: Any person who suffers from a medical condition that results in an
    incident involving a loss of consciousness within a three month period prior to
    obtaining or renewing a license will be required to have a physician certify they
    are capable of safely operating a motor vehicle.
- id: 141
  category: vehicle_information
  question: What is the law regarding the use of nitrous oxide in a motor vehicle
    on a public roadway in Nebraska?
  choices:
    A: It is allowed only for passing other vehicles
    B: It is allowed if the vehicle is registered as a sports car
    C: It is unlawful to use nitrous oxide in any motor vehicle on a public roadway
    D: It is allowed only outside of city limits
  answer: C
  explanation: It is unlawful to use nitrous oxide in any motor vehicle operated on
    any public roadway in this state.
- id: 142
  category: safe_driving_rules
  question: What is the first thing you should do when you see police emergency lights
    behind you?
  choices:
    A: Stop immediately in your current lane of traffic
    B: Speed up to find a well-lit parking lot
    C: Activate your turn signal and pull off or to the side of the roadway as soon
      as it is safe
    D: Turn on your hazard lights and continue driving to your destination
  answer: C
  explanation: When you see emergency lights behind you, remember to activate your
    turn signal and pull off or to the side of the roadway as soon as it is safe to
    do so.
- id: 143
  category: alcohol_drugs_health
  question: How does body fat affect alcohol absorption compared to muscle tissue?
  choices:
    A: Fat absorbs more alcohol than muscle tissue
    B: Fat absorbs less alcohol than muscle tissue
    C: Fat metabolizes alcohol faster than muscle tissue
    D: Fat prevents alcohol from entering the bloodstream entirely
  answer: B
  explanation: A higher proportion of a woman's body weight is in fat, and fat absorbs
    less alcohol than muscle tissue, which is one of the factors affecting alcohol
    levels.
- id: 144
  category: penalties_and_points
  question: 'The Occupant Protection Law, which requires drivers and front seat passengers
    to ride buckled up, is classified as a:'
  choices:
    A: Primary Law
    B: Secondary Law
    C: Federal Law
    D: Zero Tolerance Law
  answer: B
  explanation: Drivers and front seat passengers are required to ride buckled up in
    a seat belt or child safety seat. This is listed as a Secondary Law, meaning drivers
    are cited only if stopped and ticketed for another violation.
- id: 145
  category: safe_driving_rules
  question: What should you do with your vehicle's interior lights if you are pulled
    over by law enforcement at night?
  choices:
    A: Turn them off to avoid blinding the officer
    B: Turn them on to assist with visibility
    C: Flash them to signal compliance
    D: Dim them to the lowest setting
  answer: B
  explanation: The manual states that during a traffic stop at night, you should turn
    on your interior lights to assist with visibility.
- id: 146
  category: penalties_and_points
  question: What may happen if you refuse to sign a traffic ticket during a traffic
    stop?
  choices:
    A: You are legally admitting guilt
    B: The ticket will be automatically dismissed
    C: It may result in your arrest
    D: Your driver's license will be immediately revoked
  answer: C
  explanation: According to the manual, your acceptance and signature on a traffic
    ticket is not an admission of guilt, but the refusal to sign a traffic ticket
    may result in your arrest.
- id: 147
  category: driver_responsibility
  question: What is the minimum required amount of financial responsibility (insurance)
    for injury to or destruction of property of others in any one crash in Nebraska?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: Nebraska law requires financial responsibility in the amount of twenty-five
    thousand dollars ($25,000) because of injury to or destruction of property of
    others in any one crash.
- id: 148
  category: vehicle_information
  question: According to Nebraska law, what is the minimum required tread depth for
    pneumatic tires?
  choices:
    A: 1/32 inch
    B: 2/32 inch
    C: 3/32 inch
    D: 4/32 inch
  answer: B
  explanation: The required equipment list in the manual specifies that vehicles must
    have pneumatic tires with at least 2/32” tread.
- id: 149
  category: vehicle_information
  question: Where is the Vehicle Identification Number (VIN) usually located if you
    need to check your vehicle for a safety recall?
  choices:
    A: Inside the glove compartment
    B: On the lower corner below the windshield
    C: On the rear bumper
    D: Under the driver's seat
  answer: B
  explanation: The manual states that the vehicle identification number (VIN) is usually
    located on the lower corner below the windshield.
- id: 150
  category: safe_driving_rules
  question: Why must you never turn your vehicle's ignition to the 'lock' position
    while the vehicle is in motion?
  choices:
    A: It will cause the engine to overheat
    B: It will permanently damage the transmission
    C: You will be unable to control the vehicle
    D: The airbags will automatically deploy
  answer: C
  explanation: Most vehicles have a steering wheel lock device that engages when the
    key is turned to the lock position. Doing this while in motion means you will
    be unable to control the vehicle.
- id: 151
  category: penalties_and_points
  question: What is the penalty for owning or operating a motor vehicle in violation
    of Nebraska's sunscreening and window tinting restrictions?
  choices:
    A: Class I misdemeanor
    B: Class II misdemeanor
    C: Class III misdemeanor
    D: Class IV felony
  answer: C
  explanation: Any person owning or operating a motor vehicle in violation of the
    sunscreening or tinting restrictions shall be guilty of a Class III misdemeanor.
- id: 152
  category: vehicle_information
  question: Where should you look to find your vehicle's recommended tire pressure
    (PSI)?
  choices:
    A: On the tire's sidewall
    B: On a sticker inside the driver's door or in the owner's manual
    C: On the engine block
    D: On the vehicle's registration card
  answer: B
  explanation: You should compare the measured psi to the psi found on the sticker
    inside the driver’s door of your vehicle or in the owner’s manual. You should
    DO NOT compare it to the psi on your tire’s sidewall.
- id: 153
  category: vehicle_information
  question: When is the best time to check your tire pressure?
  choices:
    A: Immediately after a long road trip
    B: While the vehicle is in motion
    C: When the tires are 'cold' - before driving or at least three hours after driving
    D: Only during the summer months
  answer: C
  explanation: The manual advises to check your tires 'cold' – before you’ve driven
    or at least three hours after you’ve driven.
- id: 154
  category: vehicle_information
  question: When using the penny test to check tire wear, what indicates that you
    are driving with a safe amount of tread?
  choices:
    A: You can see all of Abraham Lincoln's head
    B: Any part of Abraham Lincoln's head is covered by the tread
    C: The penny falls out of the tire groove
    D: The tread does not touch the penny at all
  answer: B
  explanation: When placing Lincoln's head into a tire groove, if any part of Lincoln’s
    head is covered by the tread, you’re driving with the safe amount of tread.
- id: 155
  category: signs_and_signals
  question: How must you treat an intersection if the traffic signal is dark due to
    a power failure and no traffic control is in place?
  choices:
    A: Treat it as a yield sign
    B: Proceed without stopping if the road is clear
    C: Treat it as an all-way stop
    D: Only the vehicles on the larger road have the right-of-way
  answer: C
  explanation: If a traffic signal is not operational (dark) because of a power failure
    or other cause and no peace officer, flagger or other traffic control is in place,
    the intersection shall be treated as an all-way stop.
- id: 156
  category: signs_and_signals
  question: What must you do when approaching a flashing red light at a railroad crossing?
  choices:
    A: Slow down and proceed if no train is visible
    B: Come to a complete stop even if a train is not visible
    C: Speed up to cross the tracks quickly
    D: Yield only to pedestrians
  answer: B
  explanation: A flashing red light at a railroad crossing requires a complete stop
    even if a train is not visible.
- id: 157
  category: signs_and_signals
  question: What does a steady yellow traffic light indicate?
  choices:
    A: The light is about to change and you should stop safely if not yet in the intersection
    B: You have the right-of-way to turn left
    C: You must come to a complete stop immediately regardless of your position
    D: You should speed up to beat the light before it turns red
  answer: A
  explanation: A steady yellow light is a warning that the light is about to change.
    If the vehicle has not entered the intersection, it should be brought to a safe
    stop. Speeding up to 'beat the light' is unlawful.
- id: 158
  category: safe_driving_rules
  question: During a traffic stop, when should you reach for your driver's license
    or vehicle documents?
  choices:
    A: As soon as you pull your vehicle over
    B: While the officer is walking up to your vehicle
    C: Only after waiting for the officer's instructions to do so
    D: Before rolling down your window
  answer: C
  explanation: The manual instructs drivers to wait for the officer’s instructions
    before reaching for your driver’s license or vehicle documents.
- id: 159
  category: vehicle_information
  question: Which of the following is required equipment on vehicles by Nebraska law?
  choices:
    A: A backup camera
    B: Two systems of brakes (service brake and parking brake)
    C: Fog lights
    D: A spare tire
  answer: B
  explanation: According to the 'Required Equipment' section, Nebraska law requires
    vehicles to have two systems of brakes (service brake and parking brake).
- id: 160
  category: signs_and_signals
  question: What must a driver do when approaching a flashing red traffic light?
  choices:
    A: Slow down and proceed with caution if the intersection is clear.
    B: Stop only if pedestrians or other vehicles are present.
    C: Come to a complete stop, yield to oncoming traffic or pedestrians, and proceed
      when clear.
    D: Wait for the flashing red light to change to a solid green light.
  answer: C
  explanation: According to the manual, a flashing red light requires a complete stop,
    yielding to oncoming traffic or pedestrians, before proceeding when the way is
    clear.
- id: 161
  category: safe_driving_rules
  question: Under what condition is it legal to make a left turn at a circular red
    light?
  choices:
    A: It is never allowed under any circumstances.
    B: When traveling on a one-way street and turning onto another one-way street.
    C: When turning from a two-way street onto a one-way street.
    D: When there is no oncoming traffic within 500 feet.
  answer: B
  explanation: The manual states that turning left at a circular red light after stopping
    is allowed only if traveling on a one-way street and turning onto another one-way
    street.
- id: 162
  category: signs_and_signals
  question: What is the rule regarding turning on a red arrow signal?
  choices:
    A: You may turn right after coming to a complete stop.
    B: You may turn left if you are turning onto a one-way street.
    C: Turning on a red arrow is strictly prohibited.
    D: You may turn if you yield to all pedestrians in the crosswalk.
  answer: C
  explanation: 'The manual explicitly states: "Turning on a red arrow is prohibited."'
- id: 163
  category: signs_and_signals
  question: What does a steady yellow 'X' lane use signal indicate?
  choices:
    A: The driver should move out of the lane as safely as possible because a red
      'X' will soon appear.
    B: The lane is open only for making left turns.
    C: Drivers may continue in the lane but must reduce their speed.
    D: The lane direction is changing, but drivers have the right-of-way.
  answer: A
  explanation: A steady yellow 'X' signal means the driver should move out of the
    lane as soon as safely possible as a red 'X' will soon appear.
- id: 164
  category: signs_and_signals
  question: When approaching a Pedestrian Hybrid Beacon that is flashing red, what
    must a driver do?
  choices:
    A: Remain completely stopped until the beacon turns off.
    B: Stop and verify that no pedestrian is in their lane or any adjacent lane before
      proceeding.
    C: Proceed without stopping if the crosswalk appears clear.
    D: Yield to oncoming traffic before making a turn.
  answer: B
  explanation: During the flashing red interval of a pedestrian hybrid beacon, drivers
    must stop and verify that no pedestrian is in their lane nor in any adjacent lane
    before proceeding.
- id: 165
  category: signs_and_signals
  question: What type of information is indicated by a pink roadway sign?
  choices:
    A: Motorist services, such as rest areas.
    B: Recreation and cultural interest areas.
    C: Incident management.
    D: Pedestrian and school warnings.
  answer: C
  explanation: The manual lists the color pink as being used for "Incident management
    signs."
- id: 166
  category: signs_and_signals
  question: Which sign shape is used exclusively to mark school zones and warn of
    school children crosswalks?
  choices:
    A: Diamond
    B: Pentagon
    C: Octagon
    D: Pennant
  answer: B
  explanation: The pentagon (five-sided) shape marks school zones and warns of school
    children crosswalks.
- id: 167
  category: signs_and_signals
  question: What does a pennant-shaped sign indicate?
  choices:
    A: A railroad crossing ahead
    B: A no passing zone
    C: A yield requirement
    D: A school zone
  answer: B
  explanation: The pennant shape indicates a no passing zone.
- id: 168
  category: safe_driving_rules
  question: What should you do if you approach a railroad crossing and the gates are
    down but no train is visible?
  choices:
    A: Drive around the gates carefully.
    B: Wait for the lights to stop flashing, then drive around the gates.
    C: Never drive around the gates.
    D: Call the police to report a broken gate, then proceed.
  answer: C
  explanation: 'The manual states: "NEVER DRIVE AROUND THE GATES. It is dangerous
    and against the law."'
- id: 169
  category: signs_and_signals
  question: What does an 'Added Lane' warning sign mean?
  choices:
    A: You must merge into the left lane immediately.
    B: Traffic from another road will be entering, but no merging is necessary because
      a lane has been added.
    C: The right lane is ending soon and a merging maneuver is required.
    D: A divided highway begins ahead.
  answer: B
  explanation: The Added Lane sign means traffic from another road will be entering
    the road, and no merging is necessary because a lane has been added.
- id: 170
  category: signs_and_signals
  question: What does the 'Divided Highway Ends' sign indicate?
  choices:
    A: The traffic lanes ahead are divided by a median.
    B: A lane is ending and you must merge left.
    C: Two-way traffic is changing to one-way traffic.
    D: The oncoming traffic lane ahead is no longer divided by a median or divider.
  answer: D
  explanation: The Divided Highway Ends sign means the oncoming traffic lane ahead
    is no longer divided by a median or divider, and you should keep to the right.
- id: 171
  category: safe_driving_rules
  question: Where should you stop at a stop sign if there is no painted stop line
    or crosswalk?
  choices:
    A: Directly parallel to the stop sign.
    B: At the safest point nearest the intersecting roadway to obtain a clear view
      of approaching traffic.
    C: At least 10 feet before the intersecting roadway.
    D: You do not need to come to a complete stop if the intersection is clear.
  answer: B
  explanation: If there is no crosswalk or painted stop line, you must stop at the
    safest point nearest the intersecting roadway to obtain a clear view of approaching
    traffic.
- id: 172
  category: safe_driving_rules
  question: When approaching an intersection with a steady yellow arrow, what is unlawful?
  choices:
    A: Bringing the vehicle to a safe stop before entering the intersection.
    B: Continuing to move in the direction of the arrow if already in the intersection.
    C: Speeding up to 'beat the arrow'.
    D: Clearing the intersection safely.
  answer: C
  explanation: 'A steady yellow arrow warns that the light is about to change. The
    manual explicitly states: "Speeding up to ''beat the arrow'' is unlawful."'
- id: 173
  category: signs_and_signals
  question: How should a driver treat a Pedestrian Hybrid Beacon when it is completely
    dark?
  choices:
    A: Treat it as a four-way stop.
    B: Stop and wait for the beacon to turn green.
    C: Proceed without stopping, as the statute requiring stops at dark signals does
      not apply to these midblock beacons.
    D: Yield to the right before proceeding.
  answer: C
  explanation: After the pedestrian cycle is complete, the beacons will be dark. The
    manual notes that the state statute requiring vehicles approaching a dark traffic
    signal to stop does not apply to these midblock beacons.
- id: 174
  category: signs_and_signals
  question: What color is used for guide information signs, such as distance or direction?
  choices:
    A: Blue
    B: Brown
    C: Green
    D: White
  answer: C
  explanation: According to the sign colors section, Green is used for "Guide information,
    such as distance or direction."
- id: 175
  category: signs_and_signals
  question: What does a 'No Train Horn' sign installed under a Railroad Crossing sign
    indicate?
  choices:
    A: Trains are not allowed to cross at this location.
    B: A quiet zone has been established and trains do not blow their horns here.
    C: The railroad crossing signal is broken.
    D: Drivers must honk their horns before crossing.
  answer: B
  explanation: According to the manual, the 'No Train Horn' sign is installed in locations
    where a quiet zone has been established, meaning trains do not blow the horn at
    this location.
- id: 176
  category: signs_and_signals
  question: What color and shape is a 'No Passing Zone' sign?
  choices:
    A: A yellow pennant shape found on the left side of the road.
    B: A white rectangle found on the right side of the road.
    C: A red triangle found on the left side of the road.
    D: An orange diamond found on the right side of the road.
  answer: A
  explanation: The manual states that a yellow 'No Passing Zone' pennant shape sign
    may be found on the left side of the road at the beginning of a no passing zone.
- id: 177
  category: signs_and_signals
  question: What do blue and white service signs direct motorists to?
  choices:
    A: Directional and distance information
    B: Highway work zones
    C: Services such as hospitals, gas, food, and lodging
    D: Reference points for emergencies
  answer: C
  explanation: Service Signs are blue and white signs that direct motorists to services,
    such as hospitals, gas, food, lodging, etc.
- id: 178
  category: sharing_the_road
  question: At what speed do vehicles displaying a Slow Moving Vehicle Warning emblem
    travel?
  choices:
    A: 15 MPH or less
    B: 25 MPH or less
    C: 35 MPH or less
    D: 45 MPH or less
  answer: B
  explanation: Slow Moving Vehicles Warning emblems must be displayed on vehicles
    which travel 25 MPH or less, such as farm equipment, when using a public roadway.
- id: 179
  category: signs_and_signals
  question: What color are highway work zone warning signs?
  choices:
    A: Green with white letters
    B: Yellow with black letters
    C: Orange with black letters
    D: Red with white letters
  answer: C
  explanation: A highway work zone can be easily identified by unique orange warning
    signs with messages in black letters, which are reserved strictly to identify
    work zones.
- id: 180
  category: safe_driving_rules
  question: What should you do when you see a 'Flagger' sign in a work zone?
  choices:
    A: Speed up to clear the work zone quickly.
    B: Change lanes immediately.
    C: Honk your horn to alert the flagger of your presence.
    D: Stay alert and be prepared to stop.
  answer: D
  explanation: The manual states that when you see the 'Flagger' sign, you should
    STAY ALERT and be prepared to stop, remaining stopped until directed to proceed.
- id: 181
  category: signs_and_signals
  question: Which of the following are commonly used as channelizing devices in a
    work zone?
  choices:
    A: Dynamic message signs and reference posts
    B: Barricades, vertical panels, drums, and cones
    C: Stop lines and crosswalk markings
    D: Flashing arrow panels and advisory speed plaques
  answer: B
  explanation: Channelizing Devices such as barricades, vertical panels, drums, and
    cones are the most commonly used devices to guide drivers safely through the work
    zone.
- id: 182
  category: safe_driving_rules
  question: What does a broken yellow center line indicate?
  choices:
    A: Passing on the left is permitted when the way ahead is clear.
    B: Passing is not allowed in either direction.
    C: Traffic is flowing in the same direction.
    D: You must stop before crossing the line.
  answer: A
  explanation: A broken yellow line indicates that passing on the left is permitted
    when the way ahead is clear, though overtaking should be done with care.
- id: 183
  category: safe_driving_rules
  question: When are you lawfully allowed to cross double solid yellow lines?
  choices:
    A: When passing a slow-moving vehicle.
    B: When making a left turn into an alley, private road, or driveway.
    C: When the vehicle ahead of you is turning right.
    D: You are never allowed to cross double solid yellow lines.
  answer: B
  explanation: Making a left turn or avoiding an obstruction are the only lawful crossings
    allowed over double yellow lines, when turning into or from an alley, private
    road, or driveway.
- id: 184
  category: safe_driving_rules
  question: What is the purpose of a center lane separated with solid and broken yellow
    lines?
  choices:
    A: It is a passing lane for traffic in both directions.
    B: It is reserved for emergency vehicles only.
    C: It reserves a lane for left turns shared with traffic from the opposite direction.
    D: It is a designated bike lane.
  answer: C
  explanation: A center lane separated with solid and broken yellow lines reserves
    a lane for left turns shared with traffic from the opposite direction. Using this
    lane to pass is prohibited.
- id: 185
  category: signs_and_signals
  question: What do white lane lines separate?
  choices:
    A: Lanes of traffic going in opposite directions.
    B: Lanes of traffic going in the same direction.
    C: Motor vehicle traffic from bicycle traffic.
    D: The roadway from the shoulder.
  answer: B
  explanation: According to the manual, white lines separate lanes of traffic going
    in the same direction.
- id: 186
  category: safe_driving_rules
  question: Where must a driver stop when a white stop line is present at an intersection?
  choices:
    A: At the stop sign or traffic control signal.
    B: In the middle of the crosswalk.
    C: At the line, not at the stop sign or traffic control signal.
    D: Four feet after the crosswalk.
  answer: C
  explanation: Drivers must stop at the stop line (when present), not at the stop
    sign or traffic control signal.
- id: 187
  category: defensive_driving
  question: What is the purpose of rumble strips on a roadway?
  choices:
    A: To indicate a passing zone.
    B: To alert drowsy or inattentive drivers through vibration and sound.
    C: To mark the location of a crosswalk.
    D: To provide a safe lane for bicyclists.
  answer: B
  explanation: Rumble strips are intended to alert drowsy or inattentive drivers through
    vibration and sound that their vehicles have left the travel lane or are approaching
    a stop sign or signal.
- id: 188
  category: sharing_the_road
  question: When is it legal for a motorist to cross over a designated bike lane?
  choices:
    A: When passing a slower motor vehicle.
    B: When using it as a continuous right turn lane.
    C: To move into another travel lane, enter/exit parking spaces, or enter/exit
      private property.
    D: It is never legal to cross over a bike lane.
  answer: C
  explanation: While it is illegal to drive in bike lanes, motorists may cross over
    the bike lane to move into another appropriate travel lane, to enter or exit on-street
    parking spaces or to enter or exit private property.
- id: 189
  category: sharing_the_road
  question: What is the minimum safe distance clearance a motorist should maintain
    when passing a bicyclist in a shared lane?
  choices:
    A: One foot
    B: Two feet
    C: Three feet
    D: Five feet
  answer: C
  explanation: Motorists should avoid passing bicyclists until a safe distance of
    no less than three feet clearance exists.
- id: 190
  category: safe_driving_rules
  question: If you are driving at less than the normal speed of traffic, which lane
    should you drive in?
  choices:
    A: The left lane
    B: The center lane
    C: The right lane
    D: Any lane as long as you are at the speed limit
  answer: C
  explanation: Any vehicle proceeding at less than the normal speed of traffic must
    be driven in the right lane when available, except when passing or preparing for
    a left turn.
- id: 191
  category: safe_driving_rules
  question: At an uncontrolled intersection where vehicles approach at about the same
    time, which vehicle must yield the right-of-way?
  choices:
    A: The vehicle on the right must yield to the vehicle on the left.
    B: The vehicle on the left must yield to the vehicle on the right.
    C: The vehicle going faster has the right-of-way.
    D: The larger vehicle has the right-of-way.
  answer: B
  explanation: For right-of-way at an uncontrolled intersection, watch for vehicles
    coming from the right and yield the right-of-way. The vehicle on the left yields
    to the vehicle on the right.
- id: 192
  category: safe_driving_rules
  question: What is the common courtesy rule for proceeding at an intersection with
    a four-way stop?
  choices:
    A: The driver who stops first should be permitted to go first.
    B: The driver turning left always goes first.
    C: The driver on the left always goes first.
    D: The driver going straight must yield to turning vehicles.
  answer: A
  explanation: At four-way stops, common courtesy is that the driver who stops first
    should be permitted to go first. If in doubt, yield to the driver on your right.
- id: 193
  category: safe_driving_rules
  question: Who is permitted to use the truck aprons located in roundabouts?
  choices:
    A: Cars and SUVs
    B: Bicyclists and pedestrians
    C: Pickup trucks
    D: The rear wheels of large trucks
  answer: D
  explanation: Roundabouts provide truck aprons for the rear wheels of large trucks
    to use when turning. They are not to be used by cars, SUVs, pickup trucks, bicyclists,
    or pedestrians.
- id: 194
  category: safe_driving_rules
  question: When approaching a roundabout, who must you yield to before entering?
  choices:
    A: Traffic approaching on your right
    B: Traffic approaching on your left already in the roundabout
    C: Only large trucks
    D: Vehicles entering from the opposite side
  answer: B
  explanation: When driving a roundabout, you must yield to traffic approaching on
    your left already in the roundabout before entering.
- id: 195
  category: safe_driving_rules
  question: What should you do if an emergency vehicle approaches while you are already
    driving inside a roundabout?
  choices:
    A: Stop immediately inside the roundabout.
    B: Speed up and exit as quickly as possible.
    C: Continue to your exit, then pull over once beyond the splitter island.
    D: Pull over onto the center island.
  answer: C
  explanation: If you have entered the roundabout, continue to your exit, then once
    beyond the splitter island, pull over and allow the emergency vehicles to pass.
    Avoid stopping within the roundabout.
- id: 196
  category: safe_driving_rules
  question: Under the Nebraska Move Over Law, what must a driver do when approaching
    a stopped emergency vehicle with flashing lights on a multi-lane highway?
  choices:
    A: Stop immediately in their lane.
    B: Move into a lane at least one travel lane away from the stopped vehicle.
    C: Honk the horn to alert the emergency workers.
    D: Accelerate to pass the scene quickly.
  answer: B
  explanation: The Move Over Law requires drivers approaching a stopped emergency
    vehicle with flashing lights to move into a lane at least one travel lane away.
    If not possible, they must reduce speed and maintain a safe speed.
- id: 197
  category: penalties_and_points
  question: What is the penalty for a first offense violation of the Nebraska Move
    Over Law?
  choices:
    A: A fine of up to $100
    B: A fine of up to $500
    C: Up to 7 days in jail
    D: License suspension for 30 days
  answer: A
  explanation: The fines for violating the Move Over Law are up to $100 for a 1st
    offense.
- id: 198
  category: safe_driving_rules
  question: If you are involved in a minor crash on the interstate with no injuries
    and your vehicle is still drivable, what should you do?
  choices:
    A: Leave the vehicles exactly where they are until police arrive.
    B: Drive the vehicles to the nearest shoulder out of the travel lanes.
    C: Stand in the travel lane to direct traffic around your vehicle.
    D: Wait for a tow truck to move the vehicle.
  answer: B
  explanation: Drivers involved in minor crashes on the interstate or freeway system
    in which there are no injuries and the vehicles are still drivable should drive
    the vehicles to the nearest shoulder out of the travel lanes.
- id: 199
  category: safe_driving_rules
  question: What must you do when leaving an alley, driveway, or parking lot to enter
    a roadway?
  choices:
    A: Sound your horn and proceed without stopping.
    B: Stop only if there is a vehicle approaching.
    C: Stop before driving onto a sidewalk or sidewalk area.
    D: Yield only to vehicles, not pedestrians.
  answer: C
  explanation: When leaving alleys/driveways/parking lots to enter a roadway, STOP
    before driving onto a sidewalk or onto the sidewalk area and proceed slowly. Yield
    the right of way to any pedestrian and approaching vehicles.
- id: 200
  category: safe_driving_rules
  question: How far back must you stay when following a fire apparatus traveling in
    an emergency status?
  choices:
    A: At least 100 feet
    B: At least 200 feet
    C: At least 300 feet
    D: At least 500 feet
  answer: D
  explanation: No vehicle may follow any fire apparatus traveling in an emergency
    status closer than 500 feet.
- id: 201
  category: sharing_the_road
  question: How are funeral procession escort vehicles classified under Nebraska right-of-way
    rules?
  choices:
    A: As standard passenger vehicles
    B: As commercial vehicles
    C: As emergency vehicles
    D: As highway maintenance vehicles
  answer: C
  explanation: Funeral procession escort vehicles are classified as emergency vehicles.
    Drivers are required to yield to funeral escort vehicles displaying proper audio
    or visual signals.
- id: 202
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit in a residential
    district in Nebraska?
  choices:
    A: 15 MPH
    B: 20 MPH
    C: 25 MPH
    D: 35 MPH
  answer: C
  explanation: Unless otherwise posted, the maximum speed limit is 25 MPH in residential
    districts.
- id: 203
  category: safe_driving_rules
  question: What is the maximum speed limit on rural interstate highways in Nebraska,
    unless otherwise posted?
  choices:
    A: 65 MPH
    B: 70 MPH
    C: 75 MPH
    D: 80 MPH
  answer: C
  explanation: Unless otherwise posted, the maximum speed limit is 75 MPH on rural
    interstate highways.
- id: 204
  category: penalties_and_points
  question: What happens to speeding fines in school zones and when workers are present
    in work zones?
  choices:
    A: They are reduced by half
    B: They are doubled
    C: They remain the same
    D: They are tripled
  answer: B
  explanation: According to the manual, fines are doubled in school zones and when
    workers are present in work zones.
- id: 205
  category: safe_driving_rules
  question: It is unlawful to pass another vehicle within how many feet of any intersection
    or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: The manual explicitly states that it is unlawful to pass within 100
    feet of any intersection or within 100 feet of any railroad crossing.
- id: 206
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to signal and move back
    into the right lane?
  choices:
    A: As soon as you are past the vehicle's front bumper
    B: When you can see the front of the passed vehicle or its headlights in your
      rear view mirror
    C: After you have maintained your passing speed for 5 seconds
    D: When the driver you are passing flashes their headlights
  answer: B
  explanation: You should signal and move back into the right lane when the front
    of the vehicle being passed or the vehicle's headlights are seen in the rear view
    mirror.
- id: 207
  category: sharing_the_road
  question: What should you do when another vehicle is passing you?
  choices:
    A: Speed up to prevent them from passing
    B: Slow down significantly to let them pass quickly
    C: Move onto the shoulder of the road
    D: Stay in your lane and maintain speed unless there is an emergency
  answer: D
  explanation: When another vehicle is passing, you must stay in the lane and maintain
    speed unless there is an emergency.
- id: 208
  category: safe_driving_rules
  question: You must signal at least how many feet before turning or moving right
    or left?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: The manual requires drivers to signal at least 100 feet before turning,
    or moving right or left.
- id: 209
  category: signs_and_signals
  question: What type of pavement markings indicate a reversible lane?
  choices:
    A: Solid double yellow lines
    B: Single dashed white lines
    C: Double-dashed broken yellow lines
    D: Solid white lines with arrows
  answer: C
  explanation: Reversible Lanes are indicated by double-dashed broken yellow lines,
    showing the lane changes direction of traffic flow as indicated by signs or signals.
- id: 210
  category: safe_driving_rules
  question: Where is it explicitly stated in the manual that you should NOT change
    lanes?
  choices:
    A: On a multi-lane highway
    B: In an intersection
    C: In a school zone
    D: On a one-way street
  answer: B
  explanation: 'Under the ''Lane Changing'' section, the manual specifically states:
    ''DO NOT change lanes in an intersection.'''
- id: 211
  category: safe_driving_rules
  question: When making an emergency roadside stop, you should park your vehicle within
    how many inches of the curb or road's edge?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: For an emergency roadside stop, you must park the vehicle within 12
    inches of and parallel to the curb, or road's edge.
- id: 212
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: The manual lists 'Within 15 feet of a fire hydrant' under the section
    'Where Not to Park or Stop a Vehicle.'
- id: 213
  category: safe_driving_rules
  question: How should you turn your wheels when parking facing uphill where there
    is a curb?
  choices:
    A: Turn the wheels toward the curb
    B: Keep the wheels straight
    C: Turn the wheels away from the curb
    D: Turn the wheels to the left regardless of the curb
  answer: C
  explanation: If you park facing uphill where there is a curb, set the parking brake
    and turn the wheels away from the curb.
- id: 214
  category: penalties_and_points
  question: What is the maximum fine for a first offense of violating handicapped
    parking laws?
  choices:
    A: Up to $50
    B: Up to $100
    C: Up to $150
    D: Up to $300
  answer: C
  explanation: The fines for violating handicapped parking laws are up to $150 for
    a 1st offense.
- id: 215
  category: safe_driving_rules
  question: When required to stop at a railroad crossing, how far from the nearest
    rail must you stop?
  choices:
    A: Not less than 10 feet nor more than 30 feet
    B: Not less than 15 feet nor more than 50 feet
    C: Not less than 20 feet nor more than 100 feet
    D: Exactly 15 feet
  answer: B
  explanation: When required to stop at a railroad crossing, you must stop at the
    stop line. If none, stop not less than 15 feet nor more than 50 feet from the
    nearest rail.
- id: 216
  category: safe_driving_rules
  question: What action should you avoid doing while driving across railroad tracks?
  choices:
    A: Looking both ways
    B: Changing gears
    C: Maintaining a constant speed
    D: Gripping the steering wheel firmly
  answer: B
  explanation: 'The manual explicitly states under ''After Stopping'' at railroad
    crossings: ''Do not change gears when crossing the tracks.'''
- id: 217
  category: defensive_driving
  question: If your vehicle stalls on a railroad crossing, what is the first thing
    you should do?
  choices:
    A: Try to restart the engine immediately
    B: Call a tow truck
    C: Get everyone out and off the tracks immediately
    D: Put the vehicle in neutral and try to push it off the tracks
  answer: C
  explanation: If the vehicle stalls on a crossing, the manual instructs to get everyone
    out and off the tracks immediately, then move in the direction the train is expected.
- id: 218
  category: signs_and_signals
  question: What color is the Emergency Notification System (ENS) sign typically found
    at highway-rail grade crossings?
  choices:
    A: Red
    B: Blue
    C: Yellow
    D: Green
  answer: B
  explanation: The typically blue colored ENS sign is at every highway-rail grade
    crossing and provides the public with a telephone number to report problems or
    emergencies.
- id: 219
  category: defensive_driving
  question: How much stopping distance does an average 150-car freight train traveling
    at 60 MPH require?
  choices:
    A: 3150 feet
    B: 5000 feet
    C: 8500 feet
    D: 10000 feet
  answer: C
  explanation: An average 150-car freight train traveling 60 MPH requires 8500 feet
    or one and three-fifths (1-3/5) miles to stop.
- id: 220
  category: safe_driving_rules
  question: When using an interstate entrance ramp, what should you do when the solid
    white line changes to a broken white line?
  choices:
    A: Come to a complete stop before merging.
    B: Adjust your speed, use your turn signal, and merge into a traffic gap when
      safe.
    C: Cross the median to enter the express lanes.
    D: Maintain a minimum speed of 60 MPH before merging.
  answer: B
  explanation: When the broken white line begins on an entrance ramp, adjust your
    speed, use your turn signal, and merge into a traffic gap when safe to do so.
- id: 221
  category: safe_driving_rules
  question: What is the minimum speed allowed on the interstate?
  choices:
    A: 30 MPH
    B: 40 MPH
    C: 45 MPH
    D: 50 MPH
  answer: B
  explanation: Minimum speed on the interstate is 40 MPH.
- id: 222
  category: safe_driving_rules
  question: What must you do if you miss your intended exit on the interstate?
  choices:
    A: Back up carefully on the right shoulder.
    B: Use the emergency crossover point in the median.
    C: Stop and wait for traffic to clear before reversing.
    D: Go on to the next exit.
  answer: D
  explanation: If you miss your exit, go on to the next exit. Backing up or using
    emergency crossover points on the interstate is prohibited.
- id: 223
  category: safe_driving_rules
  question: According to the manual, when must your vehicle's headlights be used?
  choices:
    A: From sunset to sunrise
    B: Only when visibility is less than 500 feet
    C: From 8 PM to 6 AM
    D: Only when driving on unlit roads
  answer: A
  explanation: Headlights must be used from sunset to sunrise.
- id: 224
  category: defensive_driving
  question: If the headlights of an oncoming vehicle are blinding you at night, where
    should you look?
  choices:
    A: Directly at the oncoming vehicle's headlights
    B: Toward the left edge of the road
    C: Toward the right edge of the road
    D: At your vehicle's dashboard
  answer: C
  explanation: If the oncoming lights are blinding do not look directly at the vehicle
    but look toward the right edge of the road.
- id: 225
  category: defensive_driving
  question: How much moving water does it take to carry away most vehicles, including
    sport utility vehicles and pick-up trucks?
  choices:
    A: Six inches
    B: One foot
    C: Two feet
    D: Three feet
  answer: C
  explanation: Two feet of moving water can carry away most vehicles including sport
    utility vehicles and pick-up trucks.
- id: 226
  category: vehicle_information
  question: How should you apply the brakes on snow and ice if your vehicle is equipped
    with antilock (ABS) brakes?
  choices:
    A: Pump the brake pedal rapidly.
    B: Press the brake pedal firmly and do not pump the brakes.
    C: Lightly tap the brakes while steering sharply.
    D: Apply the emergency brake instead of the foot brake.
  answer: B
  explanation: 'For vehicles equipped with antilock (ABS) brakes: press brake pedal
    firmly; do not pump brakes.'
- id: 227
  category: vehicle_information
  question: During which time period are studded tires lawful to use?
  choices:
    A: October 1 to March 1
    B: November 1 to April 1
    C: December 1 to March 31
    D: November 15 to April 15
  answer: B
  explanation: Studded tires are only lawful from November 1 to April 1.
- id: 228
  category: defensive_driving
  question: If you become stranded in a blizzard, what should you do to stay safe
    while running the engine and heater?
  choices:
    A: Keep all windows tightly closed to retain heat.
    B: Open a window slightly for fresh air and keep snow from blocking the exhaust
      pipe.
    C: Leave the vehicle and walk to find help.
    D: Run the engine continuously until the storm passes.
  answer: B
  explanation: 'If stranded: Open a window slightly for fresh air. Conserve fuel,
    run the engine and heater sparingly, and only with a slightly open window for
    ventilation. Keep snow from blocking exhaust (tail) pipe.'
- id: 229
  category: defensive_driving
  question: What is the first thing you should do if your wheels drop off the edge
    of the roadway or pavement?
  choices:
    A: Immediately turn the steering wheel sharply back onto the road.
    B: Slam on the brakes to stop as quickly as possible.
    C: Hold the steering wheel firmly and steer so the wheels straddle the edge of
      the roadway.
    D: Accelerate to regain traction before turning back.
  answer: C
  explanation: 'If wheels drop off roadway or pavement edge: Hold steering wheel firmly
    and steer so wheels straddle the edge of the roadway. Don''t attempt to turn back
    onto the roadway immediately.'
- id: 230
  category: driver_responsibility
  question: According to studies, texting while driving increases a driver's crash
    risk by how much?
  choices:
    A: 4 times
    B: 6 times
    C: 10 times
    D: 23 times
  answer: D
  explanation: Studies reveal that text messaging increases a driver’s crash risk
    by 23 times.
- id: 231
  category: penalties_and_points
  question: What is the fine for texting and driving?
  choices:
    A: $50 to $100
    B: $100 to $200
    C: $200 to $500
    D: $500 to $1000
  answer: C
  explanation: The fine for texting and driving is $200 to $500.
- id: 232
  category: driver_responsibility
  question: What are the three main types of driving distractions?
  choices:
    A: Visual, Manual, and Cognitive
    B: Physical, Mental, and Emotional
    C: Internal, External, and Mechanical
    D: Auditory, Visual, and Physical
  answer: A
  explanation: 'There are three main types of distraction: Visual – taking your eyes
    off the road; Manual – taking your hands off the wheel; and Cognitive – taking
    your mind/focus off the driving task.'
- id: 233
  category: safe_driving_rules
  question: Why are "hands-free" cell phones still considered a dangerous distraction
    while driving?
  choices:
    A: They require you to take your hands off the wheel to answer.
    B: The conversation reduces the brain's capacity to process moving visual information
      by 37%.
    C: They are illegal to use in Nebraska.
    D: They cause the driver to look away from the road for an average of 4.6 seconds.
  answer: B
  explanation: The manual states that the area of the brain responsible for processing
    moving visual information has 37% less capacity when focusing on a cell phone
    conversation, even if hands-free. It's the conversation, not the device, that
    creates the danger.
- id: 234
  category: safe_driving_rules
  question: Which of the following is illegal in Nebraska regarding televisions in
    vehicles?
  choices:
    A: Having a television set anywhere inside a moving vehicle.
    B: Operating a vehicle with a television screen that is visible to the driver.
    C: Allowing passengers in the back seat to watch television.
    D: Having a television screen larger than 10 inches in the vehicle.
  answer: B
  explanation: In Nebraska, it is illegal to operate upon any public roadway a vehicle
    equipped with a television set if the viewing screen is visible to the driver.
- id: 235
  category: defensive_driving
  question: Which of the following behaviors is an example of aggressive driving?
  choices:
    A: Using the horn to alert another driver of immediate danger.
    B: Tapping the brakes to warn drivers behind you.
    C: Tailgating and cutting off other drivers.
    D: Driving 5 mph under the speed limit.
  answer: C
  explanation: Aggressive driving includes behaviors that are frightening or rude,
    such as tailgating, cutting off other drivers, running red lights, and failing
    to yield.
- id: 236
  category: safe_driving_rules
  question: If you become drowsy while driving, which of the following is an effective
    way to stay alert?
  choices:
    A: Rolling down the window.
    B: Chewing gum.
    C: Turning up the radio.
    D: Pulling over to a safe area and taking a 10-20 minute nap.
  answer: D
  explanation: The manual states that rolling down a window, chewing gum, or turning
    up the radio do not work to prevent drowsiness. Taking a short 10-20 minute nap
    can make a big difference.
- id: 237
  category: defensive_driving
  question: When practicing defensive driving, how far ahead should you scan the road?
  choices:
    A: 3 to 4 seconds
    B: 5 to 8 seconds
    C: 10 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Defensive driving techniques require you to look ahead and take in
    the situation on the road at least 10-15 seconds ahead.
- id: 238
  category: defensive_driving
  question: How often should you check the traffic behind you using your mirrors?
  choices:
    A: At least every 5 seconds
    B: At least every 10 seconds
    C: At least every 30 seconds
    D: Only when changing lanes
  answer: B
  explanation: You should check the traffic behind you at least every 10 seconds,
    as well as when changing lanes, backing up, slowing, or driving down steep hills.
- id: 239
  category: safe_driving_rules
  question: How far in advance must you signal your intentions before planning to
    change direction?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: You must signal your intentions at least 100 feet before planning to
    change direction.
- id: 240
  category: defensive_driving
  question: Under the three-second rule, what should you do if you encounter an adversity
    factor such as rain or heavy traffic?
  choices:
    A: Decrease your following distance by one second.
    B: Increase your following distance by one second for each adversity factor.
    C: Maintain the three-second following distance.
    D: Double your speed to pass the traffic quickly.
  answer: B
  explanation: The three-second rule is a minimum requirement and should be increased
    by one second for each adversity factor encountered, such as rain or heavy traffic.
- id: 241
  category: sharing_the_road
  question: 'When sharing the road with a motorcycle, you should:'
  choices:
    A: Share the lane with the motorcycle since it is small.
    B: Allow the motorcyclist a full lane width.
    C: Follow the motorcycle at a distance of one second.
    D: Expect the motorcycle's turn signals to cancel automatically.
  answer: B
  explanation: You must allow the motorcyclist a full lane width. Although there may
    seem to be enough room, motorcycles need the room to maneuver safely, so you should
    not share the lane.
- id: 242
  category: sharing_the_road
  question: 'Nearly 40 percent of motorcycle crashes involving another motor vehicle
    are caused by:'
  choices:
    A: The motorcycle tailgating the other vehicle.
    B: The other vehicle turning left in front of the motorcyclist.
    C: The motorcycle running a red light.
    D: The other vehicle rear-ending the motorcycle.
  answer: B
  explanation: According to the manual, nearly 40 percent of crashes involving a motorcycle
    and another motor vehicle were caused by the other vehicle turning left in front
    of the motorcyclist.
- id: 243
  category: sharing_the_road
  question: What is the recommended following distance when driving behind a motorcycle?
  choices:
    A: One to two seconds
    B: Two to three seconds
    C: Three to four seconds
    D: Five to six seconds
  answer: C
  explanation: You should allow more following distance, three or four seconds, following
    a motorcycle so the motorcyclist has enough time to maneuver or stop in an emergency.
- id: 244
  category: sharing_the_road
  question: According to Nebraska law, what rights and duties do bicyclists have on
    the roadway?
  choices:
    A: They have the same duties and rights as a driver of a motor vehicle.
    B: They must always yield the right-of-way to motor vehicles.
    C: They are considered pedestrians and must use sidewalks.
    D: They are only allowed to ride on paved shoulders.
  answer: A
  explanation: Per Nebraska Revised Statute §60-6,314, a person riding a bicycle has
    the same duties and rights as a driver of a motor vehicle and must obey traffic
    laws.
- id: 245
  category: sharing_the_road
  question: When may a bicyclist ride in the main lane of travel instead of on the
    far right?
  choices:
    A: Whenever they want to ride side-by-side with another bicyclist.
    B: When the lane is too narrow for a bicycle and a vehicle to travel safely side
      by side.
    C: Only when traveling at the same speed as motor vehicle traffic.
    D: Bicyclists are never allowed in the main lane of travel.
  answer: B
  explanation: Bicyclists may ride in the lane of travel where the lane is too narrow
    for a bicycle and vehicle to travel safely side by side within the lane.
- id: 246
  category: defensive_driving
  question: What should you do if you need to warn drivers behind you that you are
    slowing down?
  choices:
    A: Sound a sharp blast on your horn.
    B: Turn on your hazard lights.
    C: Quickly tap your brakes several times.
    D: Use hand signals out the window.
  answer: C
  explanation: To communicate and warn drivers behind you when slowing down, you should
    quickly tap your brakes several times.
- id: 247
  category: sharing_the_road
  question: On one-way streets in urban areas, where are bicyclists permitted to ride?
  choices:
    A: Only on the sidewalk
    B: Only in the far right lane
    C: In the far left lane
    D: Bicycles are not permitted on one-way streets
  answer: C
  explanation: According to the manual, on one-way streets in urban areas, bicyclists
    may ride in the far left lane.
- id: 248
  category: sharing_the_road
  question: What should you do if you approach a vehicle that has stopped for a pedestrian
    at a crosswalk?
  choices:
    A: Honk to alert the pedestrian and proceed carefully
    B: Pass the vehicle on the right
    C: Pass the vehicle on the left
    D: Do not pass the stopped vehicle
  answer: D
  explanation: Do not pass a vehicle which has stopped for a pedestrian. The stopped
    vehicle may block the view of the pedestrian in the street.
- id: 249
  category: sharing_the_road
  question: How should a driver react to a blind or visually impaired person using
    a white cane or service dog?
  choices:
    A: Honk the horn to let them know you are there
    B: Stop and remain stopped until the person is clear of the roadway
    C: Yield only if they are in a marked crosswalk
    D: Steer around them slowly
  answer: B
  explanation: Always give the right-of-way to a blind or visually impaired person
    (who is using a white cane or service dog) by stopping and remaining stopped until
    the person is clear of the roadway.
- id: 250
  category: safe_driving_rules
  question: What is the required following distance from snow removal equipment or
    maintenance vehicles working on roadways, except to pass?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Drivers must maintain a following distance of 100 feet from snow removal
    equipment or other maintenance vehicles while working on roadways, except to pass.
- id: 251
  category: safe_driving_rules
  question: 'When meeting or overtaking a school bus that has activated its overhead
    amber warning lights, you must:'
  choices:
    A: Stop immediately
    B: Speed up to pass before the red lights flash
    C: Slow to 25 MPH and prepare to stop
    D: Maintain your speed but move to the left lane
  answer: C
  explanation: When meeting or overtaking a bus that has activated its amber warning
    lights, you must slow to 25 MPH and prepare to stop.
- id: 252
  category: safe_driving_rules
  question: In which situation are you NOT required to stop for a school bus with
    its stop lights on and stop arm extended?
  choices:
    A: When you are running late for an emergency
    B: When approaching in the opposite direction on a roadway divided by a median
    C: When the bus is stopped at an intersection with a green light
    D: When you are traveling in the right lane of a four-lane undivided highway
  answer: B
  explanation: Not stopping when approaching or overtaking a school bus which has
    stop lights on and the stop arm extended is unlawful. The only exception occurs
    when approaching a school bus in the opposite direction on a roadway divided by
    a median.
- id: 253
  category: vehicle_information
  question: How much distance does a loaded truck with good tires and properly adjusted
    brakes traveling at 55 MPH on a clear, dry roadway require to come to a complete
    stop?
  choices:
    A: 150 feet
    B: 240 feet
    C: 340 feet
    D: 440 feet
  answer: C
  explanation: A loaded truck with good tires and properly adjusted brakes, traveling
    at 55 MPH on a clear, dry roadway, requires a minimum of 340 feet to come to a
    complete stop.
- id: 254
  category: defensive_driving
  question: When passing a large truck or bus, when is it safe to pull back in front
    of the vehicle?
  choices:
    A: As soon as you clear the front bumper
    B: When you can see the driver in their side mirror
    C: When the entire front of the truck or bus can be seen in your rear view mirror
    D: After you have maintained your passing speed for 5 seconds
  answer: C
  explanation: One of the biggest mistakes made is to cut in too soon when passing.
    Don’t pull in front of the truck or bus unless the entire front of the truck or
    bus can be seen in the rear view mirror.
- id: 255
  category: defensive_driving
  question: Why should you avoid driving in the right lane when traveling up or down
    steep hills?
  choices:
    A: To allow emergency vehicles to pass
    B: Because the right lane is reserved for passenger cars only
    C: To reduce the possibility of rear-ending or being rear-ended by a slow-moving
      large vehicle
    D: Because large vehicles are required to drive in the left lane on steep hills
  answer: C
  explanation: When traveling up or down steep grades, larger vehicles often drive
    slower and use the right lane. By avoiding the right lane in these areas, you
    will reduce the possibility of rear-ending or being rear-ended by a large vehicle.
- id: 256
  category: driver_responsibility
  question: If you are involved in a crash and hit an unattended vehicle, what must
    you do?
  choices:
    A: Wait 15 minutes and leave if no one shows up
    B: Leave the scene immediately if there is no visible damage
    C: Contact proper authorities and leave written information where the owner can
      find it
    D: Only report it to your insurance company
  answer: C
  explanation: If you hit an unattended vehicle, contact the proper authorities and
    provide written information (name, address, phone, license plate, etc.) where
    the owner can find it.
- id: 257
  category: driver_responsibility
  question: Within how many days must you send a Driver’s Motor Vehicle Crash Report
    to the Department of Transportation if the crash meets the reporting criteria
    and was not investigated by law enforcement?
  choices:
    A: 3 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: You must complete a Driver’s Motor Vehicle Crash Report and send it
    to the Department of Transportation within ten (10) days if the crash meets the
    criteria and was not investigated by a law enforcement officer.
- id: 258
  category: driver_responsibility
  question: What is the minimum property damage threshold for a single person's property
    that requires a Driver’s Motor Vehicle Crash Report to be filed?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: C
  explanation: A report must be sent if any person is injured or killed, or damage
    to the property of any one person equals or exceeds $1,500.
- id: 259
  category: penalties_and_points
  question: What is the penalty for failing to report a crash as required by law?
  choices:
    A: A warning for the first offense
    B: A Class II or III misdemeanor and possible license revocation
    C: A mandatory 30-day jail sentence
    D: A fine of exactly $1,500
  answer: B
  explanation: Failure to report a crash as required is unlawful and persons in violation
    shall be guilty of a Class II or III misdemeanor and may have their license or
    privilege to drive revoked.
- id: 260
  category: sharing_the_road
  question: What should a motorist do when preparing for a right turn and there is
    bicycle traffic traveling in the same direction?
  choices:
    A: Speed up to pass the bicyclist before turning
    B: Honk the horn to warn the bicyclist to stop
    C: Turn directly across the path of the bicyclist
    D: Merge with bicycle traffic and avoid turning directly across their path
  answer: D
  explanation: Motorists should merge with bicycle traffic when preparing for a right
    turn. Avoid turning directly across a path of bicycles traveling in the same direction.
- id: 261
  category: driver_responsibility
  question: Which form must be used to submit a crash report to the state?
  choices:
    A: DMV Form 10
    B: Safety Form 99
    C: NDOT Form 41
    D: Traffic Form 1040
  answer: C
  explanation: The manual states that the crash report must be submitted on NDOT Form
    41, which is available through state and local law enforcement authorities.
- id: 262
  category: driver_testing
  question: Which of the following is true regarding the North Express Driver Licensing
    Office in Omaha?
  choices:
    A: It is open on weekends.
    B: It only serves commercial drivers.
    C: It is the only location in Douglas County.
    D: No drive tests are given there.
  answer: D
  explanation: The manual specifically notes under the North Express Driver Licensing
    Office in Omaha that there are 'No drive tests given'.
- id: 263
  category: alcohol_drugs_health
  question: At what Blood Alcohol Concentration (BAC) does the risk of being in a
    crash begin to rise noticeably?
  choices:
    A: Between .01% and .02%
    B: Between .04% and .05%
    C: Exactly .08%
    D: Above .10%
  answer: B
  explanation: The manual states that the risk of being in a crash begins to rise
    noticeably between .04% and .05% BAC, and increases rapidly thereafter.
- id: 264
  category: safe_driving_rules
  question: According to Nebraska law, who is required to properly wear a seat belt?
  choices:
    A: Only the driver
    B: The driver and all front seat passengers
    C: Only passengers under the age of 18
    D: Passengers in the rear seats only
  answer: B
  explanation: Nebraska law requires the driver and all front seat passengers to properly
    wear seat belts.
- id: 265
  category: safe_driving_rules
  question: Up to what age must children ride correctly secured in a federally-approved
    child passenger restraint system?
  choices:
    A: Age four
    B: Age six
    C: Age eight
    D: Age ten
  answer: C
  explanation: The manual states that children up to age eight must ride correctly
    secured in a federally-approved child passenger restraint system.
- id: 266
  category: vehicle_information
  question: Even in a low-speed crash, a deployed airbag can pose a risk of injury
    to which of the following groups?
  choices:
    A: Adults taller than 6 feet
    B: Children age 12 and younger
    C: Teenagers between 13 and 17
    D: Anyone sitting in the rear seat
  answer: B
  explanation: It is possible that when an air bag deploys, even in a low speed crash,
    it can pose some risk of injury to children age 12 and younger, elderly drivers
    and passengers, and short statured adults of 5 feet or less.
- id: 267
  category: vehicle_information
  question: Where should you NEVER place a rear-facing infant safety seat?
  choices:
    A: In the rear middle seat
    B: In the rear passenger-side seat
    C: In the front passenger seat of an airbag-equipped vehicle
    D: In a vehicle without side airbags
  answer: C
  explanation: The manual explicitly warns to never use a rear facing infant safety
    seat in the front passenger seat of an airbag equipped vehicle.
- id: 268
  category: sharing_the_road
  question: What should a motorist do regarding bicycle traffic when preparing for
    a right turn?
  choices:
    A: Honk to warn the bicyclist to move out of the way
    B: Speed up to pass the bicyclist before turning
    C: Merge with the bicycle traffic
    D: Stop and wait for all bicycles to clear the street
  answer: C
  explanation: Motorists should merge with bicycle traffic when preparing for a right
    turn.
- id: 269
  category: sharing_the_road
  question: Which of the following is a recommended practice for motorcyclists?
  choices:
    A: They should constantly change positions within a lane.
    B: They should not constantly change positions within a lane.
    C: They should always ride on the shoulder.
    D: They should share a single lane with a car.
  answer: B
  explanation: The manual states that motorcyclists should not constantly change positions
    within a lane.
- id: 270
  category: signs_and_signals
  question: When is it permissible to turn right at a circular red light?
  choices:
    A: Anytime, without stopping
    B: Only if a green arrow is also illuminated
    C: After stopping, unless signs prohibiting it are posted
    D: It is never permissible in Nebraska
  answer: C
  explanation: Turning right at a circular red light after stopping is allowed, unless
    signs prohibiting it are posted at the intersection.
- id: 271
  category: safe_driving_rules
  question: What is the correct hand signal for a left turn?
  choices:
    A: Left arm pointing down
    B: Left arm pointing up
    C: Right arm extended outward
    D: Left arm out and fully extended
  answer: D
  explanation: The correct hand signal for a left turn is left arm out and fully extended.
- id: 272
  category: safe_driving_rules
  question: When are you required to use your headlights?
  choices:
    A: From 8:00 PM to 6:00 AM
    B: From sunset to sunrise
    C: Only when you cannot see 500 feet ahead
    D: From one hour after sunset to one hour before sunrise
  answer: B
  explanation: The manual states that headlights must be used from sunset to sunrise.
- id: 273
  category: safe_driving_rules
  question: When is it lawful to cross double yellow lines?
  choices:
    A: Only when making a left turn or avoiding an obstruction.
    B: When passing a slow-moving vehicle.
    C: When traveling on a one-way street.
    D: It is never lawful to cross double yellow lines.
  answer: A
  explanation: According to the manual, making a left turn or avoiding an obstruction
    are the only lawful crossings allowed over double yellow lines.
- id: 274
  category: sharing_the_road
  question: Who has the right-of-way if a pedestrian is in a crosswalk and the driver
    has a green traffic light?
  choices:
    A: The driver, because they have a green light.
    B: The pedestrian.
    C: Whoever entered the intersection first.
    D: The driver, but they must honk their horn.
  answer: B
  explanation: The manual states that pedestrians have the right of way when in crosswalks
    even if the driver has the green light.
- id: 275
  category: signs_and_signals
  question: What do white lines on the roadway indicate?
  choices:
    A: They separate lanes of traffic going in opposite directions.
    B: They separate lanes of traffic going in the same direction.
    C: They indicate a no-passing zone.
    D: They mark the center of a two-way road.
  answer: B
  explanation: White lines separate lanes of traffic going in the same direction.
- id: 276
  category: safe_driving_rules
  question: When passing another vehicle, are you allowed to exceed the posted speed
    limit?
  choices:
    A: Yes, by up to 5 mph.
    B: Yes, but only on highways.
    C: No, it is unlawful to exceed the posted speed limit when passing.
    D: Yes, if the vehicle being passed is traveling below the speed limit.
  answer: C
  explanation: It is unlawful to exceed the posted speed limit when passing.
- id: 277
  category: defensive_driving
  question: What is the recommended following distance between your vehicle and the
    car in front of you?
  choices:
    A: One second
    B: Two seconds
    C: Three seconds
    D: Five seconds
  answer: C
  explanation: You should allow three seconds between your vehicle and the car in
    front of you.
- id: 278
  category: signs_and_signals
  question: What do orange traffic signs indicate?
  choices:
    A: Recreation areas
    B: Construction
    C: Upcoming hazards
    D: Rest areas
  answer: B
  explanation: Orange signs indicate construction.
- id: 279
  category: signs_and_signals
  question: What must a driver do when encountering a triangle-shaped road sign?
  choices:
    A: Stop
    B: Speed up
    C: Yield
    D: Make a left turn
  answer: C
  explanation: A triangle shaped road sign requires that the driver yield.
- id: 280
  category: sharing_the_road
  question: What must you do when you hear a siren or see the flashing lights of an
    emergency vehicle?
  choices:
    A: Pull over to the curb and stop.
    B: Pull into an intersection.
    C: Speed up to get out of the way.
    D: Slow down and continue driving.
  answer: A
  explanation: When you hear a siren or see the flashing lights of an emergency vehicle
    you must pull over to the curb and stop.
- id: 281
  category: safe_driving_rules
  question: What is the speed limit in residential areas?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: The speed limit in residential areas is 25 mph.
- id: 282
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when parking near a fire
    hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: You may not park within 15 feet of a fire hydrant.
- id: 283
  category: safe_driving_rules
  question: Which lane should slower traffic use when driving on the interstate?
  choices:
    A: The left lane
    B: The right lane
    C: The center lane
    D: Any lane
  answer: B
  explanation: When driving on the interstate, slower traffic should keep to the right.
- id: 284
  category: defensive_driving
  question: Which headlights should you use when driving in fog?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: When driving in fog, one should use low beams.
- id: 285
  category: safe_driving_rules
  question: Under the Move Over Law, if you cannot safely change lanes when approaching
    a stopped emergency vehicle with flashing lights, what must you do?
  choices:
    A: Speed up to pass as quickly as possible
    B: Honk the horn and maintain current speed
    C: Slow down and maintain a safe speed while passing
    D: Stop completely and wait until the vehicle leaves
  answer: C
  explanation: The Move Over Law requires you to move over a lane when approaching
    stopped emergency or roadside assistance vehicles. If you are unable to move
    over, you must slow down and maintain a safe speed while passing. (p. 79)
- id: 286
  category: penalties_and_points
  question: 'For subsequent offenses of violating this law, fines can reach up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: The manual states that "Subsequent offenses can result in fines of
    up to $500..."
- id: 287
  category: penalties_and_points
  question: What is the maximum jail time a driver can receive for a subsequent offense
    of this law?
  choices:
    A: Up to 48 hours
    B: Up to seven days
    C: Up to 30 days
    D: Up to six months
  answer: B
  explanation: The text specifies that subsequent offenses can result in "up to seven
    days in jail."
- id: 288
  category: penalties_and_points
  question: Which of the following accurately describes the potential penalties for
    a subsequent offense?
  choices:
    A: Only a fine of up to $100
    B: Fines up to $500 and/or up to seven days in jail
    C: Mandatory license suspension for seven days
    D: A fine of exactly $500 and mandatory jail time
  answer: B
  explanation: 'The manual explicitly states: "Subsequent offenses can result in fines
    of up to $500 and/or up to seven days in jail."'
- id: 289
  category: penalties_and_points
  question: According to the manual, what type of penalty is explicitly mentioned
    for a first offense?
  choices:
    A: Community service
    B: Jail time
    C: A fine
    D: License revocation
  answer: C
  explanation: 'The only penalty listed for a first offense is a fine, as the text
    states: "For a first offense, drivers can be fined up to $100."'
- id: 290
  category: safe_driving_rules
  question: Under the Move Over Law, what is the maximum fine for a first offense
    of failing to move over or slow down for a stopped emergency vehicle?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: For a first offense of violating the Move Over Law, drivers can be
    fined up to $100. Subsequent offenses can result in fines of up to $500 and/or
    up to seven days in jail. (p. 79)
- id: 291
  category: penalties_and_points
  question: How does the maximum fine for a subsequent offense compare to a first
    offense?
  choices:
    A: It is the same
    B: It increases from up to $100 to up to $500
    C: It doubles from $250 to $500
    D: It increases from $50 to $100
  answer: B
  explanation: A first offense fine is up to $100, while subsequent offenses can result
