- id: 192
  category: vehicle_information
  question: Nebraska law requires brake lights to be visible from a distance of at
    least how many feet?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Brake lights (stop lamps) must be visible from a distance of at least
