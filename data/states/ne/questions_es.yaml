  choices:
    A: $100
    B: $500
    C: $1,000
    D: $5,000
  answer: B
  explanation: En Nebraska, arrojar basura es una violación de la ley estatal y se
    castiga con una multa de hasta $500.
- id: 64
  category: driver_responsibility
  question: 'En Nebraska, si lo sorprenden excediendo el límite de velocidad en una
    zona de mantenimiento o construcción cuando hay trabajadores presentes, la multa
    es:'
  choices:
    A: Reducida a la mitad
    B: Duplicada
    C: Triplicada
    D: La misma que una multa por exceso de velocidad normal
