    presentes.
- id: 54
  category: driver_testing
  question: 'Al entrar en una rotonda en Nebraska, los conductores deben ceder el
    derecho de paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en la rotonda
    C: Nadie, ya que el tráfico que entra tiene la prioridad
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el paso al tráfico
