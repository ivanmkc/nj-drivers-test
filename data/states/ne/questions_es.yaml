  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: En Nebraska, la prueba de responsabilidad financiera (SR-22) generalmente
    debe presentarse durante 3 años a partir de la fecha en que la persona es elegible
