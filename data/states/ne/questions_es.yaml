- id: 52
  category: driver_testing
  question: Al detenerse ante un tren en un cruce ferroviario, ¿a qué distancia mínima
    en pies del riel más cercano debe detener su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: B
  explanation: En Nebraska, cuando es necesario detenerse en un cruce ferroviario,
    el conductor debe detenerse a una distancia de entre 15 y 50 pies del riel más
    cercano.
- id: 53
  category: driver_testing
  question: 'En Nebraska, las multas por exceso de velocidad en una zona de obras
    designada cuando hay trabajadores presentes son:'
  choices:
    A: Aumentadas en $50
    B: Aumentadas en $100
    C: Duplicadas
    D: Triplicadas
  answer: C
  explanation: La ley de Nebraska establece que las multas por exceso de velocidad
