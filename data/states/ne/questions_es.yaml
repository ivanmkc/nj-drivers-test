  explanation: La ley de Nebraska exige que las multas por exceso de velocidad se
    dupliquen en las zonas de mantenimiento o construcción cuando hay trabajadores
    presentes.
- id: 65
  category: driver_responsibility
  question: Si se revoca la licencia de conducir de Nebraska por primera vez debido
    a la acumulación de 12 puntos en dos años, ¿cuánto dura el periodo de revocación?
  choices:
    A: 60 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Para una primera acumulación de 12 puntos en un periodo de dos años,
