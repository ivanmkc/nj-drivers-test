questions:
- id: 1
  category: license_system
  question: ¿Cuántas veces consecutivas puede renovar su licencia Clase O o Clase
    M en línea si esta vence antes de cumplir 72 años?
  choices:
    A: Una vez
    B: Dos veces
    C: Tres veces
    D: Veces ilimitadas
  answer: B
  explanation: 'El manual establece: ''Si su licencia vence antes de cumplir 72 años,
    puede renovar su licencia Clase O o Clase M dos veces consecutivas en línea''.'
- id: 2
  category: license_system
  question: Independientemente de la edad, ¿cuántas veces consecutivas puede una persona
    renovar su tarjeta de identificación estatal en línea?
  choices:
    A: Una vez
    B: Dos veces
    C: Tres veces
    D: Cuatro veces
  answer: C
  explanation: Según la sección de consejos del DMV, 'Todas las personas, independientemente
    de su edad, pueden renovar su tarjeta de identificación estatal tres veces consecutivas
    en línea'.
- id: 3
  category: driver_testing
  question: ¿En cuáles de las siguientes ciudades de Nebraska el examen de manejo
    se realiza estrictamente solo con cita previa?
  choices:
    A: Grand Island, Kearney y North Platte
    B: Bellevue, Lincoln y Omaha
    C: Scottsbluff, Norfolk y Fremont
    D: Hastings, Columbus y Papillion
  answer: B
  explanation: 'El manual especifica: ''Si visita una oficina ubicada en Bellevue,
    Lincoln u Omaha, el examen de manejo es solo con cita previa''.'
- id: 4
  category: license_system
  question: ¿A quién se le entrega el Programa de Conducción Supervisada por los Padres
    (The Parent’s Supervised Driving Program)?
  choices:
    A: A todos los conductores que solicitan una licencia de conducir comercial
    B: A los adolescentes menores de 16 años que solicitan un permiso de aprendizaje
    C: A las personas que renuevan su licencia después de los 72 años
    D: A los conductores a quienes se les ha suspendido la licencia
  answer: B
  explanation: El manual establece que el Programa de Conducción Supervisada por los
    Padres 'se entrega a todos los adolescentes menores de 16 años que solicitan un
    permiso de aprendizaje'.
- id: 5
  category: license_system
  question: ¿Qué documentación se requiere para todos los solicitantes de licencia
    de conducir por primera vez y de renovación en Nebraska?
  choices:
    A: Un diploma de escuela secundaria o GED
    B: Comprobante de número de seguro social o un documento I-94/I-94A válido
    C: Una tarjeta de registro de votante
    D: Una copia certificada del historial de manejo
  answer: B
  explanation: 'El manual señala: ''Se requiere comprobante del número de seguro social
    o un documento I-94 o I-94A válido del Servicio de Ciudadanía e Inmigración de
    los EE. UU. (en un pasaporte extranjero válido) para todos los solicitantes por
    primera vez y de renovación''.'
- id: 6
  category: driver_testing
  question: Según el DMV de Nebraska, ¿aproximadamente qué porcentaje de los solicitantes
    por primera vez reprueba el examen escrito?
  choices:
    A: Más del 10%
    B: Más del 20%
    C: Más del 32%
    D: Más del 50%
  answer: C
  explanation: La sección de consejos del DMV advierte a los solicitantes que revisen
    cuidadosamente el manual porque 'más del 32% de los solicitantes por primera vez
    reprueban el examen escrito'.
- id: 7
  category: license_system
  question: ¿Con cuánta anticipación pueden renovar su licencia de conducir las personas
    de 21 años o más?
  choices:
    A: 30 días antes de su cumpleaños
    B: 60 días antes de su cumpleaños
    C: 90 días antes de su cumpleaños
    D: 120 días antes de su cumpleaños
  answer: C
  explanation: 'El manual establece: ''Las personas de 21 años o más pueden renovar
    90 días antes de su cumpleaños''.'
- id: 8
  category: license_system
  question: ¿Con cuánta anticipación pueden solicitar la renovación de la licencia
    las personas menores de 21 años antes de cumplir los 21?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Según el manual, 'las personas menores de 21 años pueden solicitar
    la renovación 60 días antes de cumplir los 21 años'.
- id: 9
  category: license_system
  question: ¿Cuánto tiempo puede tardar en recibir por correo los documentos permanentes
    de la licencia de conducir?
  choices:
    A: Hasta 5 días
    B: Hasta 10 días
    C: Hasta 20 días
    D: Hasta 30 días
  answer: C
  explanation: El manual explica que los documentos permanentes se envían por correo
    a la dirección principal del solicitante y 'puede tardar hasta 20 días en recibirlos'.
- id: 10
  category: license_system
  question: ¿Qué sucede si se muda y tiene una dirección de reenvío registrada en
    la oficina de correos cuando se envía por correo su licencia de conducir permanente?
  choices:
    A: Se reenviará a su nueva dirección
    B: Se retendrá en la oficina de correos local para su recogida
    C: No se reenviará
    D: Se entregará en su nueva dirección con un cargo adicional
  answer: C
  explanation: 'El manual establece explícitamente con respecto a los documentos permanentes
    enviados por correo a su dirección principal: ''Estos documentos no se reenvían''.'
- id: 11
  category: license_system
  question: ¿Cuál de los siguientes se considera un horario de mayor afluencia en
    las oficinas de licencias de conducir que los solicitantes deben tratar de evitar?
  choices:
    A: Martes por la mañana a las 9:00 a.m.
    B: El día antes y después de un día festivo
    C: Al mediodía de un miércoles
    D: Cuando las escuelas están en sesión
  answer: B
  explanation: 'El manual aconseja evitar las horas de mayor afluencia, que incluyen:
    ''1) después de las 3:00 p.m. cada día laborable, 2) cuando las escuelas no están
    en sesión, y 3) el día antes y después de un día festivo''.'
- id: 12
  category: license_system
  question: ¿Qué método de pago NO se acepta en las oficinas estatales de licencias
    de conducir en los condados de Douglas, Lancaster y Sarpy?
  choices:
    A: Efectivo
    B: Tarjetas de crédito
    C: Cheques
    D: Tarjetas de débito
  answer: C
  explanation: 'El manual advierte: ''Tenga en cuenta que las oficinas estatales de
    licencias de conducir en los condados de Douglas, Lancaster y Sarpy no aceptan
    cheques''.'
- id: 13
  category: driver_responsibility
  question: ¿Cuál de los siguientes se menciona como una posible señal de alerta de
    trata de personas en un negocio o vivienda?
  choices:
    A: Tener un estacionamiento bien iluminado
    B: Medidas de seguridad extraordinarias, como ventanas con rejas y exceso de cámaras
      exteriores
    C: Tener un sistema de alarma de seguridad estándar en el hogar
    D: Emplear trabajadores que viajan diariamente desde pueblos vecinos
  answer: B
  explanation: El manual enumera las 'Medidas de seguridad extraordinarias para un
    negocio o vivienda (por ejemplo, ventanas con rejas o cubiertas, alambre de púas,
    exceso de cámaras exteriores...)' como una señal de alerta de trata de personas.
- id: 14
  category: driver_responsibility
  question: Al observar un negocio, ¿qué comportamiento de un trabajador podría ser
    una señal de alerta de trata de personas?
  choices:
    A: Tomar descansos para almorzar regulares y programados
    B: Quejarse de su salario por hora
    C: Parecer que vive en el lugar de trabajo o estar siempre trabajando
    D: Abandonar las instalaciones inmediatamente después de que termine su turno
  answer: C
  explanation: El manual identifica a los 'Trabajadores que parecen vivir en el lugar
    de trabajo o que siempre están trabajando' como una señal de alerta de trata de
    personas.
- id: 15
  category: defensive_driving
  question: Según la carta del Gobernador, ¿cuál es un obstáculo que los conductores
    pueden encontrar en las carreteras de Nebraska?
  choices:
    A: Aumentos bruscos de velocidad al acercarse a un pueblo
    B: Caminos pavimentados que se convierten en grava
    C: Condiciones climáticas que permanecen constantes durante todo el año
    D: Semáforos en cada intersección rural
  answer: B
  explanation: 'La carta del Gobernador establece: ''En Nebraska, las condiciones
    climáticas cambian inesperadamente, los caminos pavimentados dan paso a la grava
    y las velocidades disminuyen drásticamente al acercarse a la ciudad''.'
- id: 16
  category: license_system
  question: ¿Cuántos días tiene un nuevo residente con una licencia válida de otro
    estado para obtener una licencia de Nebraska?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Según la Sección 1A del manual, cualquier nuevo residente con una licencia
    válida de otro estado debe obtener una licencia de Nebraska en un plazo de 30
    días.
- id: 17
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción por el uso de un dispositivo
    de comunicación inalámbrica interactivo mientras se opera un vehículo motorizado
    en movimiento bajo las leyes de GDL (Licencia de Conducir Graduada)?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: El manual establece que la infracción por usar cualquier tipo de dispositivo
    de comunicación inalámbrica interactivo mientras se opera un vehículo motorizado
    en movimiento conlleva una multa de $200 por la primera infracción y la asignación
    de puntos en la licencia.
- id: 18
  category: penalties_and_points
  question: ¿Cuál es la multa por violar la regla del cinturón de seguridad cuando
    se viaja con el titular de un permiso?
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: De acuerdo con las restricciones de conducción de GDL (Licencia de
    Conducir Graduada), todos los ocupantes que viajen con el titular de un permiso
    deben usar el cinturón de seguridad, y una infracción conlleva una multa de $25.
- id: 19
  category: license_system
  question: ¿A quién puede transportar el titular de un Permiso Escolar (SCP)?
  choices:
    A: Cualquier pasajero menor de 19 años
    B: Hasta dos amigos que asistan a la misma escuela
    C: Solo a los miembros de la familia que residan con ellos a la escuela a la que
      asiste el titular
    D: A cualquier persona siempre que un adulto esté presente
  answer: C
  explanation: El manual especifica que el titular de un Permiso Escolar (SCP) solo
    puede transportar a los miembros de la familia que residan con él a la escuela
    a la que asiste el titular.
- id: 20
  category: license_system
  question: Durante los primeros 6 meses, ¿a cuántos pasajeros menores de 19 años
    que no sean miembros de la familia inmediata está limitado el titular de un Permiso
    de Operador Provisional (POP)?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: El titular de un Permiso de Operador Provisional (POP) está limitado
    a un pasajero menor de 19 años que no sea un miembro de la familia inmediata durante
    los primeros 6 meses.
- id: 21
  category: safe_driving_rules
  question: ¿Cuáles son las restricciones de conducción nocturna para el titular de
    un Permiso de Operador Provisional (POP)?
  choices:
    A: No puede conducir de 10 PM a 5 AM
    B: No puede conducir de 11 PM a 6 AM
    C: No puede conducir desde la medianoche hasta las 6 AM, a menos que sea hacia
      o desde actividades escolares o el trabajo
    D: No puede conducir después de la puesta del sol a menos que esté acompañado
      por un adulto
  answer: C
  explanation: El manual establece que el titular de un POP no debe conducir desde
    la medianoche hasta las 6 AM, a menos que sea hacia o desde actividades escolares
    o el trabajo.
- id: 22
  category: alcohol_drugs_health
  question: Bajo las leyes de "Tolerancia cero" de Nebraska para conductores menores
    de 21 años, ¿cuál es la sanción por una primera infracción por alcohol?
  choices:
    A: Una multa de $500 y 6 puntos en la licencia
    B: Incautación judicial del permiso o licencia por 30 días
    C: 10 días obligatorios de cárcel
    D: Revocación permanente de la licencia de conducir
  answer: B
  explanation: Para los conductores menores de 21 años, una primera infracción bajo
    las leyes de "Tolerancia cero" resulta en la incautación judicial del permiso
    o licencia por 30 días.
- id: 23
  category: penalties_and_points
  question: ¿Qué deben hacer las personas menores de 21 años que acumulen seis o más
    puntos en su historial de conducción en un plazo de un año?
  choices:
    A: Pagar un recargo de $200
    B: Volver a tomar el examen de habilidades de conducción
    C: Tomar un curso de perfeccionamiento para conductores en un plazo de tres meses
    D: Entregar su licencia por 6 meses
  answer: C
  explanation: El manual establece que las personas menores de 21 años que acumulen
    seis o más puntos en un año deben tomar un curso de perfeccionamiento para conductores
    en un plazo de tres meses.
- id: 24
  category: license_system
  question: ¿Qué tipo de vehículos autoriza a operar un Permiso de Explotación Agrícola
    (Farm Husbandry Permit)?
  choices:
    A: Semirremolques comerciales y autobuses
    B: Minicamiones y equipos de explotación agrícola
    C: Motocicletas y ciclomotores
    D: Cualquier vehículo que pese más de 26,000 libras
  answer: B
  explanation: Según la Sección 1C-1, un Permiso de Explotación Agrícola autoriza
    la operación de minicamiones y equipos de explotación agrícola.
- id: 25
  category: vehicle_information
  question: 'Según el manual del conductor de Nebraska, un minicamión debe tener un
    tamaño de motor de:'
  choices:
    A: 500 cc o menos
    B: 1,000 cc o menos
    C: 1,500 cc o menos
    D: 2,000 cc o menos
  answer: C
  explanation: Un minicamión se define como aquel que tiene un motor de mil quinientos
    (1,500) cc o menos.
- id: 26
  category: vehicle_information
  question: ¿Cuál es el peso en seco máximo permitido para que un vehículo sea clasificado
    como minicamión?
  choices:
    A: 2,500 libras
    B: 3,000 libras
    C: 4,200 libras
    D: 5,000 libras
  answer: C
  explanation: El manual define un minicamión como un vehículo que tiene un peso en
    seco de 4,200 libras o menos.
- id: 27
  category: safe_driving_rules
  question: ¿Quién está obligado a usar el cinturón de seguridad cuando viaja en un
    vehículo conducido por el titular de un permiso?
  choices:
    A: Solo el conductor
    B: Solo los pasajeros en el asiento delantero
    C: Solo los pasajeros menores de 18 años
    D: Todos los ocupantes que viajen con el titular del permiso, incluido el conductor
  answer: D
  explanation: Bajo las restricciones de conducción de la GDL (Licencia Graduada de
    Conducir), todos los ocupantes que viajen con el titular de un permiso, incluido
    el conductor, deben usar el cinturón de seguridad.
- id: 28
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar la restricción del límite de pasajeros
    en un Permiso de Operador Provisional (POP)?
  choices:
    A: Una multa de $100
    B: Una evaluación de un punto en el historial de conducción
    C: Revocación inmediata de la licencia
    D: Una suspensión de 30 días
  answer: B
  explanation: Violar la restricción de pasajeros para un Permiso de Operador Provisional
    (POP) conlleva una evaluación de un punto en el historial de conducción.
- id: 29
  category: alcohol_drugs_health
  question: ¿Con qué contenido de alcohol en sangre (BAC) un conductor menor de 21
    años está sujeto a las mismas leyes de DWI que una persona de 21 años o más?
  choices:
    A: .02 o más
    B: .04 o más
    C: .06 o más
    D: .08 o más
  answer: D
  explanation: Un conductor menor de 21 años está sujeto a las mismas leyes de DWI
    (conducir bajo la influencia) que una persona de 21 años o más si el contenido
    de alcohol en sangre es de .08 (BAC) o más.
- id: 30
  category: vehicle_information
  question: ¿Cuál es la velocidad máxima aproximada de un vehículo clasificado como
    minicamión bajo el Permiso de Explotación Agrícola?
  choices:
    A: 35 millas por hora
    B: 45 millas por hora
    C: 55 millas por hora
    D: 65 millas por hora
  answer: C
  explanation: La definición de un minicamión establece que tiene una velocidad máxima
    de aproximadamente 55 millas por hora.
- id: 31
  category: license_system
  question: ¿Cuál es la edad mínima para obtener un Permiso de Explotación Agrícola
    (Farm Husbandry Permit) si vive en una granja?
  choices:
    A: 13 años
    B: 14 años
    C: 15 años
    D: 16 años
  answer: A
  explanation: Según el manual, la edad mínima para un Permiso de Explotación Agrícola
    es de 13 años si vive en una granja, o de 14 años si está empleado en una granja
    por una remuneración.
- id: 32
  category: license_system
  question: ¿Cuándo vence un Permiso de Explotación Agrícola (Farm Husbandry Permit)?
  choices:
    A: Seis meses después de la fecha de emisión
    B: Un año después de la fecha de emisión
    C: En el cumpleaños número 16 del conductor
    D: En el cumpleaños número 18 del conductor
  answer: C
  explanation: El manual establece que el vencimiento de un Permiso de Explotación
    Agrícola es el día del cumpleaños número 16 del conductor.
- id: 33
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Aprendizaje Escolar (Tipo LPE)?
  choices:
    A: Tres meses después de la fecha de emisión
    B: Seis meses después de la fecha de emisión
    C: Un año después de la fecha de emisión
    D: Hasta el cumpleaños número 16 del conductor
  answer: B
  explanation: El manual especifica que un Permiso de Aprendizaje Escolar (Tipo LPE)
    vence seis meses después de la fecha de emisión.
- id: 34
  category: safe_driving_rules
  question: ¿Quién debe acompañar a un conductor que opera un vehículo motorizado
    con un Permiso de Aprendizaje Escolar (LPE)?
  choices:
    A: Cualquier conductor con licencia que tenga al menos 18 años
    B: Únicamente un padre o tutor legal
    C: Un conductor con licencia que tenga al menos 21 años y ocupe el asiento al
      lado del conductor
    D: Nadie es necesario si el conductor viaja hacia o desde la escuela
  answer: C
  explanation: El manual establece que el titular de un LPE debe estar acompañado
    por un conductor de vehículo motorizado con licencia que tenga al menos 21 años
    de edad y ocupe el asiento al lado del conductor.
- id: 35
  category: license_system
  question: Para ser elegible para un Permiso Escolar (Tipo SCP), ¿una persona debe
    vivir o asistir a una escuela fuera de una ciudad de al menos qué población?
  choices:
    A: 1,000
    B: 5,000
    C: 10,000
    D: 50,000
  answer: B
  explanation: Se puede emitir un Permiso Escolar si la persona vive fuera de una
    ciudad de 5,000 habitantes o más, o si asiste a una escuela fuera de una ciudad
    de 5,000 habitantes o más.
- id: 36
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un Permiso Escolar (Tipo SCP)?
  choices:
    A: 14 años
    B: 14 años y dos meses
    C: 15 años
    D: 16 años
  answer: B
  explanation: La edad mínima para un Permiso Escolar (Tipo SCP) es de 14 años y dos
    meses, y la persona debe haber tenido un LPE o LPD durante al menos dos meses.
- id: 37
  category: driver_testing
  question: Si se utiliza un formulario de certificación de 50 horas para solicitar
    un Permiso Escolar o un Permiso de Operador Provisional (POP), ¿cuántas de esas
    horas deben haberse conducido entre la puesta del sol y el amanecer?
  choices:
    A: 5 horas
    B: 10 horas
    C: 15 horas
    D: 20 horas
  answer: B
  explanation: El formulario de certificación de 50 horas debe indicar que al menos
    10 horas de operación del vehículo motorizado fueron entre la puesta del sol y
    el amanecer.
- id: 38
  category: license_system
  question: ¿Cuándo vence un Permiso Escolar (Tipo SCP)?
  choices:
    A: En el cumpleaños número 16 del conductor
    B: A los 16 años y tres meses
    C: En el cumpleaños número 18 del conductor
    D: Un año después de la emisión
  answer: B
  explanation: Según el manual, un Permiso Escolar (Tipo SCP) vence cuando el conductor
    cumple 16 años y tres meses de edad.
- id: 39
  category: license_system
  question: ¿Cuál es la edad mínima a la que se puede emitir un Permiso de Aprendizaje
    (Tipo LPD)?
  choices:
    A: 14 años
    B: 14 años y dos meses
    C: 15 años
    D: 16 años
  answer: C
  explanation: La edad mínima para un Permiso de Aprendizaje (LPD) es de 15 años.
    Aunque puede solicitarlo 60 días antes, la emisión debe ser en o después del cumpleaños
    número 15.
- id: 40
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Aprendizaje (Tipo LPD) antes
    de que venza?
  choices:
    A: Seis meses después de la fecha de emisión
    B: Un año después de la fecha de emisión
    C: Hasta el cumpleaños número 16 del conductor
    D: Hasta el cumpleaños número 18 del conductor
  answer: B
  explanation: El manual establece que un Permiso de Aprendizaje (Tipo LPD) vence
    un año después de la fecha de emisión.
- id: 41
  category: safe_driving_rules
  question: ¿En qué horario se le permite a una persona con un Permiso de Operador
    Provisional (POP) conducir sin supervisión por cualquier motivo?
  choices:
    A: De 5 a.m. a 10 p.m.
    B: De 6 a.m. a 12 de la medianoche
    C: De 7 a.m. a 9 p.m.
    D: De 6 a.m. a 10 p.m.
  answer: B
  explanation: El Permiso de Operador Provisional permite a una persona operar un
    vehículo motorizado sin supervisión en Nebraska desde las 6 a.m. hasta las 12
    de la medianoche.
- id: 42
  category: safe_driving_rules
  question: ¿Bajo qué condición puede el titular de un Permiso de Operador Provisional
    (POP) conducir sin supervisión entre las 12 de la medianoche y las 6 a.m.?
  choices:
    A: Si conduce desde o hacia su hogar al trabajo o a una actividad escolar
    B: Si conduce con un hermano menor de 18 años
    C: Si ha tenido el permiso por más de 3 meses
    D: Bajo ninguna circunstancia
  answer: A
  explanation: Una persona con un POP solo puede conducir sin supervisión entre las
    12 de la medianoche y las 6 a.m. si se dirige desde o hacia su hogar al trabajo
    o a una actividad escolar.
- id: 43
  category: safe_driving_rules
  question: Durante los primeros seis meses de tener un Permiso de Operador Provisional
    (POP), ¿cuál es la restricción sobre los pasajeros?
  choices:
    A: No se permiten pasajeros en ningún momento
    B: No más de un pasajero que no sea un miembro de la familia inmediata y que sea
      menor de 19 años de edad
    C: Solo se permiten pasajeros adultos mayores de 21 años
    D: No más de tres pasajeros menores de 18 años
  answer: B
  explanation: Durante los primeros seis meses del POP, el titular solo puede operar
    un vehículo motorizado con no más de un pasajero que no sea un miembro de la familia
    inmediata y que sea menor de diecinueve años de edad.
- id: 44
  category: penalties_and_points
  question: Para ser elegible para un Permiso de Operador Provisional (POP), ¿cuántos
    puntos no debe haber acumulado el solicitante en su historial de manejo durante
    los seis meses anteriores?
  choices:
    A: Uno o más puntos
    B: Dos o más puntos
    C: Tres o más puntos
    D: Cinco o más puntos
  answer: C
  explanation: Antes de solicitar un POP, la persona no debe haber acumulado tres
    o más puntos en su historial de manejo durante el período de seis meses inmediatamente
    anterior a la fecha de la solicitud.
- id: 45
  category: vehicle_information
  question: 'De acuerdo con las reglas del Permiso de Explotación Agrícola (Farm Husbandry
    Permit), un minicamión (minitruck) debe tener un tamaño de motor de no más de:'
  choices:
    A: 500 cc
    B: 1,000 cc
    C: 1,500 cc
    D: 2,000 cc
  answer: C
  explanation: Un minicamión se define como un vehículo que tiene un motor de mil
    quinientos (1,500) cc o menos.
- id: 46
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener una Licencia de Operador
    Clase O?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: B
  explanation: Según el manual, la edad mínima para obtener una Licencia de Operador
    Clase O es de 17 años.
- id: 47
  category: driver_testing
  question: ¿Qué sucede si un solicitante de una licencia Clase O reprueba tres exámenes
    de manejo sucesivos?
  choices:
    A: Debe esperar 6 meses antes de volver a solicitarla.
    B: Debe completar un curso de capacitación para conductores aprobado por el DMV
      o tener un LPD por al menos 90 días.
    C: Se le prohíbe permanentemente obtener una licencia.
    D: Debe pagar una multa y volver a tomar el examen escrito de inmediato.
  answer: B
  explanation: El manual establece que los solicitantes que reprueben tres exámenes
    de manejo sucesivos no serán elegibles para volver a solicitarla hasta que presenten
    un comprobante de haber completado con éxito un curso de capacitación para conductores
    aprobado por el DMV, o hayan tenido un Permiso de Aprendiz (LPD) durante al menos
    90 días.
- id: 48
  category: license_system
  question: ¿Cuál de los siguientes vehículos NO se puede operar con una Licencia
    Clase O estándar?
  choices:
    A: Autociclo
    B: Ciclomotor (Moped)
    C: Vehículo utilitario todo terreno (UTV)
    D: Motocicleta
  answer: D
  explanation: Una Licencia Clase O autoriza la operación de cualquier vehículo motorizado,
    incluyendo un ciclomotor, autociclo, ATV y UTV, pero específicamente no incluye
    una motocicleta o un vehículo motorizado comercial.
- id: 49
  category: safe_driving_rules
  question: Al operar un ATV o UTV en una vía pública, ¿cuáles son las horas restringidas
    de operación?
  choices:
    A: Entre la puesta del sol y la salida del sol
    B: Entre la salida del sol y la puesta del sol
    C: Solo entre las 8:00 AM y las 5:00 PM
    D: No hay horas restringidas
  answer: B
  explanation: Cualquier operación autorizada de ATV/UTV en vías públicas debe ocurrir
    únicamente entre la salida y la puesta del sol.
- id: 50
  category: vehicle_information
  question: ¿Cuál es el peso en seco máximo permitido para un vehículo todo terreno
    (ATV)?
  choices:
    A: 1,000 libras
    B: 1,200 libras
    C: 1,500 libras
    D: 2,000 libras
  answer: B
  explanation: El manual define un ATV como un dispositivo motorizado para fuera de
    la carretera que tiene un peso en seco de mil doscientas (1,200) libras o menos.
- id: 51
  category: safe_driving_rules
  question: ¿A qué ángulo se debe realizar el cruce al atravesar una carretera en
    un ATV o UTV?
  choices:
    A: 45 grados
    B: 60 grados
    C: 90 grados
    D: 180 grados
  answer: C
  explanation: Al cruzar una carretera en un ATV/UTV, el cruce debe realizarse a un
    ángulo de aproximadamente 90 grados y en un lugar donde ninguna obstrucción impida
    un cruce rápido y seguro.
- id: 52
  category: vehicle_information
  question: ¿Qué equipo específico debe estar activo y presente al operar un ATV o
    UTV en una vía pública?
  choices:
    A: Luces de emergencia y una señal de vehículo de movimiento lento
    B: Faro delantero, luz trasera y una bandera de seguridad para bicicletas
    C: Una baliza amarilla intermitente
    D: Cinta reflectante en todos los lados
  answer: B
  explanation: Para la operación autorizada de un ATV/UTV en vías públicas, el faro
    delantero y la luz trasera deben estar encendidos y el vehículo debe estar equipado
    con una bandera de seguridad para bicicletas.
- id: 53
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima a la que se puede operar un ATV o UTV en
    vías públicas?
  choices:
    A: Menos de 25 mph
    B: Menos de 30 mph
    C: Menos de 35 mph
    D: Menos de 45 mph
  answer: B
  explanation: La operación autorizada de un ATV/UTV en vías públicas debe realizarse
    a velocidades inferiores a 30 mph.
- id: 54
  category: license_system
  question: Para que una persona menor de 18 años sea elegible para una licencia de
    operador Clase O, ¿durante cuánto tiempo debe haber tenido un Permiso de Operador
    Provisional (POP)?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 9 meses
    D: Al menos 12 meses
  answer: D
  explanation: Las personas menores de 18 años deben haber tenido un POP durante al
    menos 12 meses para ser elegibles para una licencia de operador.
- id: 55
  category: penalties_and_points
  question: ¿Cuántos puntos en su historial de manejo en los últimos 12 meses descalificarían
    a una persona menor de 18 años para actualizar su POP a una licencia de operador
    Clase O?
  choices:
    A: Uno o más puntos
    B: Dos o más puntos
    C: Tres o más puntos
    D: Cinco o más puntos
  answer: C
  explanation: Para ser elegible para una licencia de operador, las personas menores
    de 18 años no deben haber acumulado tres o más puntos en sus historiales de manejo
    durante el período de los 12 meses anteriores.
- id: 56
  category: driver_testing
  question: ¿Qué tipo de vehículo NO se puede utilizar para administrar una prueba
    de manejo para una licencia Clase O?
  choices:
    A: Un automóvil de pasajeros
    B: Una camioneta pickup
    C: Un autociclo (autocycle)
    D: Un SUV
  answer: C
  explanation: 'El manual establece explícitamente: ''No se puede administrar una
    prueba de manejo en un autociclo (autocycle) para una licencia Clase O''.'
- id: 57
  category: safe_driving_rules
  question: ¿Qué se requiere de todos los pasajeros que son transportados en un vehículo
    motorizado operado por el titular de un Permiso de Operador Provisional (POP)?
  choices:
    A: Deben ser mayores de 18 años.
    B: Deben viajar asegurados en un sistema de protección para ocupantes.
    C: Deben sentarse en el asiento trasero.
    D: Deben tener una licencia de conducir válida.
  answer: B
  explanation: El manual establece que todas las personas que sean transportadas en
    un vehículo motorizado operado por un titular de un POP deben viajar aseguradas
    en un sistema de protección para ocupantes.
- id: 58
  category: license_system
  question: ¿Cuándo vence un Permiso de Operador Provisional (POP)?
  choices:
    A: En el cumpleaños número 17 del conductor
    B: En el cumpleaños número 18 del conductor
    C: En el cumpleaños número 21 del conductor
    D: Cinco años después de la fecha de emisión
  answer: B
  explanation: Según el manual, el vencimiento de un Permiso de Operador Provisional
    (POP) es el día del cumpleaños número 18 del conductor.
- id: 59
  category: license_system
  question: ¿Bajo qué circunstancia se colocará una restricción "Z" en una licencia
    de conducir?
  choices:
    A: Cuando el conductor requiere lentes correctivos para pasar la prueba de visión.
    B: Cuando el conductor es menor de 18 años.
    C: Cuando se utiliza una motoneta (motor scooter), un scooter de 3 ruedas o una
      motocicleta de 3 ruedas durante la prueba de manejo.
    D: Cuando el conductor está restringido a conducir solo durante el día.
  answer: C
  explanation: El manual establece que se colocará una restricción "Z" en la licencia
    cuando se utilice una motoneta (motor scooter), un scooter de 3 ruedas o una motocicleta
    de 3 ruedas durante la prueba de manejo.
- id: 60
  category: license_system
  question: ¿Se requiere una Licencia de Conducir Comercial (CDL) para conducir un
    vehículo con una Clasificación de Peso Bruto Vehicular (GVWR) de más de cuántas
    libras?
  choices:
    A: 10,000 libras
    B: 16,000 libras
    C: 26,000 libras
    D: 36,000 libras
  answer: C
  explanation: Se requiere una CDL para cualquier persona que conduzca un vehículo
    que tenga una Clasificación de Peso Combinado Bruto (GCWR) o una Clasificación
    de Peso Bruto Vehicular (GVWR) de más de 26,000 libras.
- id: 61
  category: license_system
  question: ¿Debe obtener una Licencia de Conducir Comercial (CDL) si conduce un vehículo
    diseñado para transportar al menos a cuántas personas, incluyendo al conductor?
  choices:
    A: '10'
    B: '12'
    C: '15'
    D: '16'
  answer: D
  explanation: Se requiere una CDL para cualquier persona que conduzca un vehículo
    que transporte a 16 o más personas (incluyendo al conductor).
- id: 62
  category: penalties_and_points
  question: ¿Para qué tipo de infracción se le permite al titular de una CDL ingresar
    a un programa de desvío de tráfico para evitar una condena?
  choices:
    A: Exceso de velocidad en una zona escolar
    B: Una infracción de estacionamiento
    C: Pasarse un semáforo en rojo
    D: Los titulares de CDL no pueden ingresar a un programa de desvío por ninguna
      infracción
  answer: B
  explanation: El manual especifica que ningún titular de una CDL puede ingresar a
    un programa de desvío de tráfico para evitar una condena por una citación de tráfico,
    excepto por una infracción de estacionamiento.
- id: 63
  category: license_system
  question: ¿Con qué frecuencia debe un solicitante que NO es ciudadano de los EE.
    UU. presentar prueba de estatus legal en la oficina de licencias de conducir?
  choices:
    A: Solo en su primera visita
    B: Cada cinco años
    C: En cada visita a la oficina de licencias de conducir
    D: Solo al cambiar su dirección principal
  answer: C
  explanation: Los solicitantes que no son ciudadanos de los EE. UU. deberán presentar
    prueba de estatus legal en cada visita a la oficina de licencias de conducir.
- id: 64
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los documentos
    que presenta para un permiso, licencia o tarjeta de identificación de Nebraska?
  choices:
    A: Se aceptan documentos enviados por fax si son legibles.
    B: Se aceptan documentos fotocopiados si están notarizados.
    C: No se aceptarán documentos enviados por fax o fotocopiados.
    D: Se prefieren las copias digitales en un teléfono inteligente.
  answer: C
  explanation: El manual establece explícitamente que NO se aceptarán documentos enviados
    por fax o fotocopiados.
- id: 65
  category: license_system
  question: ¿Qué debe presentar si ha tenido un cambio de nombre y está solicitando
    un permiso, licencia de conducir o tarjeta de identificación estatal?
  choices:
    A: Una factura de servicios públicos con su nuevo nombre
    B: Un documento como una licencia de matrimonio certificada o una orden judicial
      que vincule su nuevo nombre con su nombre actual
    C: Una carta notarizada de un familiar
    D: Solo una nueva tarjeta de seguro social
  answer: B
  explanation: En caso de un cambio de nombre, debe presentar documentos (licencia
    de matrimonio certificada, sentencia de divorcio certificada o una orden judicial)
    que vinculen su nuevo nombre con el nombre que figura actualmente en su permiso,
    licencia de conducir o tarjeta de identificación estatal.
- id: 66
  category: license_system
  question: ¿Cuál de los siguientes certificados de nacimiento NO es aceptable como
    prueba de ciudadanía estadounidense o estatus legal?
  choices:
    A: Un certificado de nacimiento certificado emitido por una oficina del gobierno
      estatal
    B: Un certificado de nacimiento emitido por un hospital
    C: Un Informe Consular de Nacimiento en el Extranjero
    D: Un certificado de nacimiento de Puerto Rico emitido en 2012
  answer: B
  explanation: El manual establece que no se pueden aceptar certificados de nacimiento
    emitidos por hospitales, ni certificados de nacimiento de Puerto Rico emitidos
    antes del 30 de septiembre de 2010.
- id: 67
  category: license_system
  question: Al verificar su dirección principal en Nebraska, ¿cuál de las siguientes
    afirmaciones es verdadera?
  choices:
    A: Solo necesita presentar un documento.
    B: Un apartado postal (P.O. Box) es una prueba aceptable de dirección principal.
    C: Debe presentar dos documentos de dos fuentes emisoras diferentes.
    D: Ambos documentos pueden ser de la misma fuente emisora.
  answer: C
  explanation: Debe presentar DOS documentos con su dirección principal de Nebraska
    listada, y la prueba de dirección principal debe ser de dos fuentes emisoras diferentes.
    No se aceptará un apartado postal (P.O. Box).
- id: 68
  category: license_system
  question: ¿Qué puede hacer un solicitante menor de 21 años si no puede proporcionar
    una prueba de su dirección principal?
  choices:
    A: Pueden usar su expediente académico de la escuela secundaria como única prueba.
    B: Pueden usar los documentos de dirección principal de sus padres o tutores.
    C: Están exentos del requisito de dirección principal.
    D: Deben esperar hasta tener 21 años para solicitarla.
  answer: B
  explanation: Si es menor de 21 años y no puede proporcionar una prueba de dirección
    principal, se aceptarán los documentos de dirección principal de los padres o
    tutores.
- id: 69
  category: license_system
  question: Las licencias de conducir emitidas a personas con un estatus migratorio
    de LIBERTAD CONDICIONAL (PAROLEE) llevarán una marca distintiva que indica ¿qué?
  choices:
    A: RESTRICTED TO DAYLIGHT DRIVING (Restringido a conducción diurna)
    B: NOT FOR FEDERAL IDENTIFICATION (No para identificación federal)
    C: TEMPORARY RESIDENT (Residente temporal)
    D: NON-CITIZEN DRIVER (Conductor no ciudadano)
  answer: B
  explanation: Las personas con un estatus migratorio de LIBERTAD CONDICIONAL (PAROLEE)
    pueden recibir tarjetas que llevan una marca distintiva que indica que NO SON
    PARA IDENTIFICACIÓN FEDERAL (NOT FOR FEDERAL IDENTIFICATION).
- id: 70
  category: driver_testing
  question: ¿Qué mide el examen de la vista del DMV?
  choices:
    A: Daltonismo y percepción de profundidad
    B: Agudeza visual y visión periférica
    C: Visión nocturna y resistencia al deslumbramiento
    D: Estimación de distancia y agudeza visual
  answer: B
  explanation: El manual establece que el examen de la vista del DMV mide la agudeza
    visual y la visión periférica.
- id: 71
  category: driver_testing
  question: Si está realizando una prueba de manejo en un vehículo con un año de modelo
    de 1973 o posterior, ¿qué requisito de cinturón de seguridad debe cumplir el vehículo?
  choices:
    A: Solo el conductor debe tener un cinturón de seguridad que funcione.
    B: Solo el asiento del pasajero debe tener un cinturón de seguridad que funcione.
    C: Debe tener cinturones de seguridad limpios y que funcionen tanto para el pasajero
      como para el conductor.
    D: Los cinturones de seguridad son opcionales para los vehículos fabricados antes
      de 1980.
  answer: C
  explanation: Los vehículos con año de modelo 1973 o posterior deben tener cinturones
    de seguridad para el pasajero y el conductor que estén limpios y en buen estado
    de funcionamiento para el uso del personal de licencias y del conductor.
- id: 72
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para el vehículo que usted proporcione
    para su prueba de manejo?
  choices:
    A: Debe tener transmisión automática.
    B: Debe tener un velocímetro y luces de freno que funcionen.
    C: Debe tener menos de 10 años de antigüedad.
    D: Debe tener controles dobles para el examinador.
  answer: B
  explanation: El vehículo proporcionado para la prueba de manejo debe estar en buenas
    condiciones mecánicas, tener luces de freno que funcionen y el velocímetro del
    vehículo debe funcionar correctamente.
- id: 73
  category: driver_testing
  question: Si reprueba un examen de conducir, ¿se le permite volver a tomarlo el
    mismo día?
  choices:
    A: Sí, si paga una tarifa adicional.
    B: Sí, pero solo si reprobó el examen escrito.
    C: No, cualquier examen reprobado no puede volver a tomarse el mismo día.
    D: No, debe esperar al menos 14 días para volver a tomar cualquier examen.
  answer: C
  explanation: El manual establece explícitamente que cualquier examen reprobado no
    puede volver a tomarse el mismo día.
- id: 74
  category: license_system
  question: Después de aprobar su examen, ¿cuántos días tiene para presentar el Certificado
    de Emisión (Issuance Certificate) al tesorero del condado o a la oficina estatal
    de licencias de conducir?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: D
  explanation: Debe presentar el Certificado de Emisión a cualquier tesorero del condado
    o a la oficina estatal de licencias de conducir dentro de los 90 días posteriores
    a la aprobación del examen.
- id: 75
  category: license_system
  question: ¿Puede usar el recibo de 30 días emitido después de pagar su tarifa para
    abordar un avión comercial?
  choices:
    A: Sí, es una identificación federal válida.
    B: Sí, pero solo para vuelos nacionales.
    C: No, la Administración de Seguridad en el Transporte (TSA) no acepta el recibo
      de 30 días como prueba aceptable de identificación.
    D: No, a menos que también presente su certificado de nacimiento.
  answer: C
  explanation: El manual señala que la Administración de Seguridad en el Transporte
    (TSA) no acepta el recibo de 30 días como prueba aceptable de identificación para
    abordar aviones o ingresar a ciertas instalaciones federales.
- id: 76
  category: license_system
  question: ¿Qué sucederá si se muda y no actualiza su dirección con el DMV antes
    de que se envíe por correo su licencia permanente?
  choices:
    A: El Servicio Postal de los EE. UU. la reenviará a su nueva dirección.
    B: El documento no será reenviado a otra dirección por el Servicio Postal de los
      EE. UU.
    C: El DMV rastreará automáticamente su nueva dirección y la volverá a enviar.
    D: Será multado por el tesorero del condado.
  answer: B
  explanation: El manual indica que debe asegurarse de que la dirección proporcionada
    sea la actual, ya que estos documentos no serán reenviados a otra dirección por
    el Servicio Postal de los EE. UU.
- id: 77
  category: license_system
  question: Si a un solicitante se le deniega o rechaza una licencia o una tarjeta
    de identificación estatal, ¿ante quién se puede apelar la decisión del personal
    de licencias de conducir?
  choices:
    A: El Tesorero del Condado
    B: La Corte Suprema del Estado
    C: El Director del Departamento de Vehículos Motorizados (DMV)
    D: El departamento de policía local
  answer: C
  explanation: La decisión del personal de licencias de conducir puede apelarse ante
    el Director del Departamento de Vehículos Motorizados, según lo dispuesto en el
    Estatuto Revisado de Nebraska §60-4,114.
- id: 78
  category: license_system
  question: Bajo las reglas especiales de licencias para el personal militar en servicio
    activo estacionado fuera de Nebraska, ¿por cuánto tiempo es válida una licencia
    de Nebraska después del licenciamiento o del regreso al estado?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: La licencia es válida mientras se esté en servicio activo y durante
    los 60 días posteriores al licenciamiento o al regreso a Nebraska, lo que ocurra
    más tarde.
- id: 79
  category: license_system
  question: Si indica el deseo de registrarse para votar al solicitar una licencia,
    ¿dentro de cuántos días se le enviará por correo su tarjeta de registro de votante?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Dentro de los 30 días posteriores a la finalización de una solicitud
    en la que el solicitante haya indicado el deseo de registrarse para votar, se
    le enviará por correo una tarjeta de registro de votante.
- id: 80
  category: license_system
  question: ¿Cuál de los siguientes grupos NO es elegible para obtener documentos
    en línea a través de los servicios del DMV de Nebraska?
  choices:
    A: Personas mayores de 21 años
    B: Personal militar en servicio activo
    C: Ciudadanos que no son de los EE. UU.
    D: Solicitantes de un Permiso de Operador Provisional (POP)
  answer: C
  explanation: 'El manual establece explícitamente: "Los ciudadanos que no son de
    los EE. UU. no son elegibles para los servicios en línea".'
- id: 81
  category: license_system
  question: Para obtener un Permiso de Operador Provisional (POP) en línea, ¿dentro
    de cuántos días de su cumpleaños número 16 debe estar el solicitante y cuánto
    tiempo debe haber tenido un Permiso de Aprendiz o un Permiso Escolar?
  choices:
    A: Dos meses
    B: Tres meses
    C: Seis meses
    D: Doce meses
  answer: C
  explanation: Para obtener un Permiso de Operador Provisional en línea, el solicitante
    debe haber tenido un Permiso de Aprendiz Escolar, Permiso de Aprendiz, Permiso
    Escolar o una combinación de estos durante al menos seis meses.
- id: 82
  category: penalties_and_points
  question: Para obtener una Licencia de Operador Clase O en línea, debe tener al
    menos 17 años y NO haber acumulado ¿cuántos puntos en su historial de manejo durante
    los 12 meses anteriores?
  choices:
    A: Uno o más puntos
    B: Dos o más puntos
    C: Tres o más puntos
    D: Seis o más puntos
  answer: C
  explanation: Para obtener una Licencia de Operador Clase O en línea, no debe haber
    acumulado tres o más puntos en su historial de manejo durante el período de 12
    meses anterior.
- id: 83
  category: license_system
  question: ¿Cuántas veces consecutivas puede el titular de una licencia Clase O (automóvil)
    o Clase M (motocicleta) renovar su licencia en línea?
  choices:
    A: Una vez
    B: Dos veces consecutivas
    C: Tres veces consecutivas
    D: Veces ilimitadas antes de los 72 años
  answer: B
  explanation: Los titulares de licencias Clase O y Clase M pueden renovar su licencia
    en línea dos veces consecutivas. (Los titulares de Tarjetas de Identificación
    Estatal pueden renovarla tres veces consecutivas).
- id: 84
  category: license_system
  question: ¿Qué símbolo se colocará en la parte frontal de su permiso, licencia o
    Tarjeta de Identificación Estatal si acepta la donación de órganos y tejidos?
  choices:
    A: Una cruz roja
    B: Un lazo verde
    C: Un símbolo de donante de corazón
    D: Un caduceo médico
  answer: C
  explanation: Si una persona acepta la donación de órganos y/o tejidos, se colocará
    un símbolo de donante de corazón en la parte frontal del permiso, licencia o Tarjeta
    de Identificación Estatal.
- id: 85
  category: license_system
  question: ¿Puede un menor de entre 16 y 18 años elegir ser donante de órganos en
    su licencia de conducir de Nebraska?
  choices:
    A: No, solo las personas de 18 años o más pueden elegir ser donantes.
    B: Sí, y su decisión es definitiva y nadie puede cambiarla.
    C: Sí, sin embargo, sus padres o tutores legales adultos pueden modificar su decisión
      de donación.
    D: No, deben esperar hasta tener 21 años.
  answer: C
  explanation: Un menor (de entre 16 y 18 años) puede elegir ser donante; sin embargo,
    sus padres o tutores legales adultos, si están disponibles, pueden modificar su
    decisión de donación.
- id: 86
  category: driver_responsibility
  question: Según la Legislación de Primera Persona de Nebraska, ¿quién puede rescindir
    la decisión de una persona de ser donante de órganos después de su muerte?
  choices:
    A: La familia inmediata de la persona
    B: El médico tratante
    C: Nadie
    D: El Departamento de Vehículos Motorizados (DMV)
  answer: C
  explanation: De acuerdo con la Legislación de Primera Persona de Nebraska, una donación
    realizada mediante permiso, licencia o Tarjeta de Identificación Estatal no puede
    ser rescindida por nadie después de la muerte de la persona.
- id: 87
  category: driver_testing
  question: ¿Qué sucede si un conductor es convocado para un reexamen de su capacidad
    de conducción y no se presenta al examen?
  choices:
    A: Su licencia será suspendida por 30 días
    B: Su licencia será cancelada
    C: Se le multará con $100
    D: Recibirá una carta de advertencia
  answer: B
  explanation: No presentarse a un reexamen, no presentar las declaraciones médicas
    o de la vista requeridas, o no aprobar las pruebas resultará en la cancelación
    de la licencia.
- id: 88
  category: license_system
  question: ¿Cuándo vencen generalmente las licencias de conducir emitidas a personas
    de 21 años o más en Nebraska?
  choices:
    A: En su cumpleaños en el 3er año después de la emisión
    B: En su cumpleaños en el 4to año después de la emisión
    C: En su cumpleaños en el 5to año después de la emisión
    D: En su cumpleaños en el 10mo año después de la emisión
  answer: C
  explanation: Las licencias emitidas a personas de 21 años o más vencen el día del
    cumpleaños del titular de la licencia en el quinto año después de su emisión.
- id: 89
  category: license_system
  question: ¿Cuántos días antes de su cumpleaños puede una persona de 21 años o más
    solicitar la renovación de su licencia de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Las personas de 21 años o más pueden renovar su licencia 90 días antes
    de su cumpleaños.
- id: 90
  category: license_system
  question: ¿Cuántos días tiene para actualizar su nombre o dirección en su licencia
    de conducir después de un cambio?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: El estatuto estatal requiere que los cambios de nombre y dirección
    se realicen dentro de los 60 días posteriores al cambio.
- id: 91
  category: license_system
  question: ¿Qué indica una restricción 'G' en una licencia de conducir de Nebraska?
  choices:
    A: Se requieren lentes correctivos
    B: Limitado únicamente a las horas del día
    C: No se permite conducir en autopistas interestatales
    D: Se requiere transmisión automática
  answer: B
  explanation: Una restricción 'G' en una licencia significa que el conductor está
    limitado a conducir únicamente durante el día.
- id: 92
  category: license_system
  question: ¿Qué código de restricción indica que un conductor no tiene permitido
    conducir en la autopista interestatal?
  choices:
    A: Código C
    B: Código F
    C: Código Q
    D: Código W
  answer: C
  explanation: El código de restricción 'Q' significa 'No conducir en autopistas interestatales'.
- id: 93
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a poseer
    múltiples documentos de identificación en Nebraska?
  choices:
    A: Puede poseer un permiso de aprendizaje y una tarjeta de identificación estatal
      al mismo tiempo.
    B: Puede poseer una licencia de conducir y una tarjeta de identificación estatal
      al mismo tiempo.
    C: Ninguna persona podrá poseer un permiso o licencia junto con una tarjeta de
      identificación estatal al mismo tiempo.
    D: Puede poseer una licencia de conducir comercial y una tarjeta de identificación
      estatal al mismo tiempo.
  answer: C
  explanation: La ley de Nebraska establece que ninguna persona podrá poseer un permiso
    o licencia junto con una tarjeta de identificación estatal al mismo tiempo.
- id: 94
  category: penalties_and_points
  question: ¿Cuál es el término legal para cuando el tribunal confisca y retiene una
    licencia por un período de tiempo específico antes de devolverla al titular?
  choices:
    A: Suspensión
    B: Revocación
    C: Incautación (Impoundment)
    D: Confiscación
  answer: C
  explanation: La incautación es la confiscación y retención de la licencia por parte
    del tribunal, después de lo cual la licencia se devuelve al titular.
- id: 95
  category: penalties_and_points
  question: Si un oficial de la ley confisca su licencia por no pasar una prueba de
    contenido de alcohol, ¿por cuánto tiempo es válida la licencia temporal?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Al confiscarse una licencia por fallar o rechazar una prueba de alcohol,
    al conductor se le emite una licencia temporal que es válida por 15 días.
- id: 96
  category: penalties_and_points
  question: 'Su licencia puede ser suspendida o revocada si usted está involucrado
    en un choque en el que tuvo la culpa y no tiene la cobertura mínima requerida
    de responsabilidad por lesiones personales de:'
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: C
  explanation: Una licencia puede ser suspendida o revocada por no tener la cobertura
    mínima de seguro de responsabilidad civil, que incluye $50,000 por lesiones personales,
    y estar involucrado en un choque con culpa.
- id: 97
  category: penalties_and_points
  question: A una persona menor de 21 años se le puede suspender o revocar la licencia
    si no completa un curso de mejora para conductores después de acumular ¿cuántos
    puntos en un año?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Las personas menores de 21 años pueden enfrentar una suspensión o revocación
    si no completan un curso de mejora para conductores después de acumular 6 puntos
    en un año.
- id: 98
  category: penalties_and_points
  question: Acumular 12 puntos en su historial de manejo dentro de un período de dos
    años causará una revocación automática de la licencia por ¿cuánto tiempo?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Acumular 12 puntos en un período de dos años provoca la revocación
    automática de la licencia de operador por seis meses.
- id: 99
  category: license_system
  question: Antes de que se pueda agregar una designación de 'Veterano' a una licencia
    de conducir de Nebraska, ¿dónde debe el veterano certificar su elegibilidad?
  choices:
    A: El Departamento de Vehículos Motorizados (DMV)
    B: El Departamento de Asuntos de Veteranos de Nebraska (NDVA)
    C: La oficina del tesorero del condado local
    D: La Administración del Seguro Social
  answer: B
  explanation: Los veteranos deben certificar su elegibilidad a través del Departamento
    de Asuntos de Veteranos de Nebraska (NDVA) antes de agregar la designación a su
    licencia.
- id: 100
  category: license_system
  question: ¿Qué sucederá si solicita una licencia de conducir de Nebraska mientras
    sus privilegios de conducir están actualmente suspendidos en otro estado?
  choices:
    A: Se le emitirá una licencia restringida de Nebraska.
    B: Se le emitirá una licencia temporal de 30 días.
    C: No se emitirá una licencia de Nebraska.
    D: Debe pagar el doble de la tarifa de solicitud estándar para obtener una licencia.
  answer: C
  explanation: Si los privilegios de conducir están revocados o suspendidos en Nebraska
    o en cualquier otro estado o jurisdicción, no se emitirá una licencia de Nebraska.
- id: 101
  category: penalties_and_points
  question: ¿La acumulación de 12 puntos en un período de dos años causa la revocación
    automática de la licencia de conducir por cuánto tiempo?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 3 años
  answer: B
  explanation: Según el manual, acumular 12 puntos en un período de dos años causa
    la revocación automática de la licencia de conducir por seis meses.
- id: 102
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por una tercera condena por conducir bajo los
    efectos del alcohol?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: El Sistema de Puntos de Nebraska asigna 12 puntos por una tercera condena
    por conducir bajo los efectos del alcohol.
- id: 103
  category: penalties_and_points
  question: Si una persona no entrega su licencia revocada, ¿cuál es la sanción máxima?
  choices:
    A: Multa de $500 o menos, y/o encarcelamiento en la cárcel del condado por 30
      días o menos
    B: Multa de $1000 y encarcelamiento por 6 meses
    C: Multa de $250 y 100 horas de servicio comunitario
    D: Pérdida permanente de los privilegios de conducir
  answer: A
  explanation: Las personas que no entreguen la licencia serán multadas con $500 o
    menos, y/o encarceladas en la cárcel del condado por 30 días o menos.
- id: 104
  category: penalties_and_points
  question: ¿Por cuánto tiempo cuentan los puntos de una condena de tráfico contra
    su historial de manejo?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: B
  explanation: Las condenas permanecen en el historial durante cinco años; sin embargo,
    los puntos dejan de contar dos años después de la fecha de la infracción.
- id: 105
  category: alcohol_drugs_health
  question: Bajo la ley de Revocación Administrativa de Licencia (ALR), ¿por cuánto
    tiempo es válida la licencia temporal después de ser emitida?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: Los conductores reciben una licencia temporal que vence 15 días después
    de su emisión.
- id: 106
  category: alcohol_drugs_health
  question: Para un infractor por primera vez que no pasa una prueba de alcohol, ¿cuánto
    tiempo dura la revocación administrativa de la licencia (ALR)?
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 3 años
  answer: B
  explanation: Los infractores por primera vez que no pasan una prueba de alcohol
    cumplen una revocación administrativa de la licencia (ALR) de 180 días.
- id: 107
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por usar un dispositivo de comunicación inalámbrica
    portátil para leer, escribir o enviar comunicaciones escritas mientras se opera
    un vehículo motorizado?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: El uso de un dispositivo de comunicación inalámbrica portátil para
    leer, escribir o enviar comunicaciones escritas mientras se opera un vehículo
    motorizado resulta en 3 puntos.
- id: 108
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resulta en la asignación de 0 puntos
    (para citaciones con fecha del 14/11/20 o posterior)?
  choices:
    A: Exceso de velocidad de 1 a 5 MPH sobre el límite de velocidad indicado
    B: Exceso de velocidad de más de 5 a 10 MPH dentro de los límites de la ciudad
    C: Obstrucción ilegal de la vista de un operador
    D: Violación de la Ley de Restricción para Niños
  answer: A
  explanation: El exceso de velocidad de 1 a 5 MPH sobre el límite de velocidad indicado
    (dentro o fuera de los límites de la ciudad) resulta en 0 puntos para las citaciones
    con fecha del 14/11/20 o posterior.
- id: 109
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por abandonar la escena de un choque?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Abandonar la escena de un choque resulta en 6 puntos bajo el Sistema
    de Puntos de Nebraska.
- id: 110
  category: alcohol_drugs_health
  question: Si un conductor menor de edad (20 años o menos) es condenado por una infracción
    de conducir con un nivel de alcohol del .02%, ¿por cuánto tiempo confiscará el
    tribunal su licencia?
  choices:
    A: 15 días
    B: 30 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Por una condena de .02%, la licencia será confiscada por el tribunal
    durante 30 días y formará parte del historial de manejo durante 90 días.
- id: 111
  category: penalties_and_points
  question: ¿Qué se requiere para mantener la prueba de responsabilidad financiera
    después de una revocación de la licencia?
  choices:
    A: Un depósito en efectivo de $10,000
    B: El Formulario SR-22 de una compañía de seguros durante tres años
    C: Una carta de recomendación de un empleador
    D: Completar un curso de conducción defensiva de 8 horas
  answer: B
  explanation: La prueba de responsabilidad financiera debe mantenerse durante tres
    años a partir de la fecha de finalización de la revocación original, generalmente
    proporcionada mediante una certificación de seguro por escrito identificada como
    Formulario SR-22.
- id: 112
  category: penalties_and_points
  question: ¿Cómo puede un conductor recibir un crédito de 2 puntos en su historial
    de conducción?
  choices:
    A: Conduciendo un año completo sin recibir una citación
    B: Completando con éxito un curso de mejora para conductores aprobado por el DMV
      antes de acumular 12 puntos
    C: Pagando una tarifa de $100 al DMV
    D: Entregando su licencia voluntariamente durante 30 días
  answer: B
  explanation: Se puede otorgar un crédito de 2 puntos a un conductor que complete
    con éxito un curso de mejora para conductores aprobado por el DMV antes de que
    se acumulen doce puntos.
- id: 113
  category: penalties_and_points
  question: ¿Por cuál de las siguientes infracciones NO se asignan puntos?
  choices:
    A: Operar un vehículo con una licencia vencida
    B: Negarse a someterse a una prueba de contenido de alcohol
    C: Infracciones de estacionamiento
    D: Obstrucción ilegal de la vista de un operador
  answer: C
  explanation: No se asignan puntos por infracciones de estacionamiento, silenciador,
    no portar una licencia de operador válida, o por infracciones relacionadas con
    el sistema de protección de ocupantes, casco protector de motocicleta o de ciclomotor.
- id: 114
  category: alcohol_drugs_health
  question: Si una persona se niega a someterse a una prueba química de alcohol o
    drogas, ¿cuánto tiempo debe cumplir de Revocación Administrativa de la Licencia
    (ALR)?
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 3 años
  answer: C
  explanation: Las personas que se nieguen a someterse a una prueba química de alcohol
    o drogas deben cumplir una ALR de un año.
- id: 115
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor menor de edad que es condenado por
    conducir durante su período de confiscación?
  choices:
    A: Licencia revocada por seis meses por el tribunal
    B: Licencia revocada por un año por el tribunal
    C: Licencia revocada permanentemente
    D: 30 días en la cárcel del condado
  answer: A
  explanation: Cualquier conductor menor de edad que sea condenado por conducir durante
    la confiscación tendrá su licencia revocada por seis meses por el tribunal.
- id: 116
  category: penalties_and_points
  question: Si un infractor se niega a someterse a una prueba química, ¿cuánto tiempo
    debe esperar después de que expire su licencia temporal para solicitar un Permiso
    de Propósito Especial (SPP)?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 90 días
  answer: D
  explanation: En caso de negativa a someterse a una prueba, el infractor debe esperar
    90 días después de que expire la licencia temporal para solicitar el SPP.
- id: 117
  category: license_system
  question: 'Un Permiso de Conducción por Empleo permite a un conductor cuyos privilegios
    están revocados bajo el sistema de puntos conducir:'
  choices:
    A: A cualquier lugar dentro de su condado de residencia
    B: Hacia y desde el trabajo y el hogar por la ruta más directa
    C: Solo durante las horas del día
    D: Cualquier vehículo no comercial para cualquier propósito
  answer: B
  explanation: Los Permisos de Conducción por Empleo solo permiten al titular conducir
    hacia y desde el lugar de trabajo y el hogar por la ruta más directa y estrictamente
    en referencia a los términos del empleo.
- id: 118
  category: penalties_and_points
  question: ¿Cuándo puede un infractor por primera vez sujeto a una Revocación Administrativa
    de la Licencia (ALR) solicitar un Permiso de Dispositivo de Bloqueo de Encendido
    (IIP)?
  choices:
    A: Inmediatamente después de la revocación
    B: Después de que expire la licencia temporal de 15 días
    C: Después de 45 días
    D: Después de 90 días
  answer: B
  explanation: Los infractores por primera vez sujetos a una ALR pueden instalar un
    sistema de bloqueo de encendido y solicitar un Permiso de Dispositivo de Bloqueo
    de Encendido (IIP) después de que expire la licencia temporal de 15 días.
- id: 119
  category: penalties_and_points
  question: ¿Cuál es la sanción si un conductor es condenado por manipular un sistema
    de bloqueo de encendido y tiene un contenido de alcohol en la sangre (BAC) de
    al menos .02%?
  choices:
    A: Delito menor de Clase I
    B: Delito menor de Clase II
    C: Delito grave de Clase III
    D: Delito grave de Clase IV
  answer: D
  explanation: Una condena de un conductor por manipular o eludir un sistema de bloqueo
    es un delito menor de Clase I. Si el conductor tiene un contenido de alcohol de
    al menos .02 con las infracciones indicadas anteriormente, es un delito grave
    de Clase IV.
- id: 120
  category: license_system
  question: 'Un Permiso de Conducción por Dificultad Médica permite a las personas
    con privilegios de conducción revocados conducir:'
  choices:
    A: A la farmacia para recoger recetas
    B: Desde el hogar o el trabajo a un hospital, clínica o consultorio médico específico
      para recibir tratamiento médico
    C: A cualquier instalación médica dentro de un radio de 50 millas
    D: Solo en situaciones de emergencia que requieran una ambulancia
  answer: B
  explanation: Los titulares de permisos solo pueden conducir desde el hogar o el
    trabajo a un hospital, clínica, consultorio médico o lugar similar especificado
    y regresar con el propósito de recibir tratamiento médico.
- id: 121
  category: penalties_and_points
  question: 'Huir de un oficial de la ley para evitar el arresto por la violación
    de cualquier ley de Nebraska que constituya un delito grave se considera un:'
  choices:
    A: Delito menor de Clase I
    B: Delito menor de Clase II
    C: Delito grave de Clase IV
    D: Delito grave de Clase I
  answer: C
  explanation: Cualquier conductor que huya para evitar el arresto por la violación
    de cualquier ley de Nebraska que constituya un delito grave comete un delito grave
    de Clase IV.
- id: 122
  category: penalties_and_points
  question: ¿Cuál es el período máximo por el que se puede revocar una licencia de
    conducir por abandonar la escena de un choque de vehículo motorizado tras una
    condena?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: A las personas que abandonan la escena de un choque de vehículo motorizado
    se les puede revocar la licencia de conducir hasta por un año tras ser condenadas.
- id: 123
  category: alcohol_drugs_health
  question: Para una segunda condena de un menor en posesión (20 años o menos), ¿por
    cuánto tiempo confiscará el tribunal el permiso o la licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 12 meses
  answer: C
  explanation: Para una segunda infracción de menor en posesión, el tribunal confiscará
    el permiso o la licencia por 90 días.
- id: 124
  category: alcohol_drugs_health
  question: Según la ley de Nebraska, ¿quién tiene prohibido consumir o poseer un
    recipiente abierto de una bebida alcohólica dentro de un vehículo en una vía pública?
  choices:
    A: Solo el conductor
    B: Solo los pasajeros menores de 21 años
    C: Tanto los conductores como los pasajeros
    D: Solo los pasajeros en el asiento delantero
  answer: C
  explanation: Es ilegal consumir o estar en posesión de un recipiente abierto de
    una bebida alcohólica dentro de cualquier vehículo en cualquier vía pública o
    área de estacionamiento público en Nebraska. Esto incluye tanto a conductores
    como a pasajeros.
- id: 125
  category: alcohol_drugs_health
  question: 'Es ilegal operar un vehículo motorizado en las carreteras de Nebraska
    si un conductor menor de 21 años tiene una concentración de alcohol en sangre
    (BAC) de:'
  choices:
    A: .00% o superior
    B: .02% o superior
    C: .04% o superior
    D: .08% o superior
  answer: B
  explanation: Es ilegal operar un vehículo motorizado en las carreteras de Nebraska
    si el conductor tiene una concentración de alcohol en sangre (BAC) de .02% o superior
    y el conductor es menor de 21 años.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    operar un vehículo motorizado comercial en Nebraska?
  choices:
    A: .02% o superior
    B: .04% o superior
    C: .06% o superior
    D: .08% o superior
  answer: B
  explanation: Es ilegal operar un vehículo motorizado en las carreteras de Nebraska
    si el conductor tiene una concentración de alcohol en sangre (BAC) de .04% o superior
    al operar un vehículo motorizado comercial.
- id: 127
  category: alcohol_drugs_health
  question: 'Bajo la ley de "Consentimiento Implícito" de Nebraska, cualquier conductor
    que opere un vehículo en las carreteras de Nebraska ya ha aceptado:'
  choices:
    A: Permitir que su vehículo sea registrado sin una orden judicial
    B: Someterse a una prueba química de sangre, aliento u orina cuando lo solicite
      la ley
    C: Pagar todas las multas de tráfico en un plazo de 30 días
    D: Tener instalado un dispositivo de bloqueo de encendido
  answer: B
  explanation: Cualquier conductor que opere un vehículo en las carreteras de Nebraska
    ya ha aceptado someterse a una prueba o pruebas químicas cuando lo solicite un
    oficial de la ley.
- id: 128
  category: penalties_and_points
  question: ¿Cuál es la sanción administrativa por negarse a someterse a una prueba
    química de sangre, aliento u orina?
  choices:
    A: 30 días de revocación de la licencia
    B: 6 meses de revocación de la licencia
    C: 1 año de revocación de la licencia
    D: 5 años de revocación de la licencia
  answer: C
  explanation: La sanción administrativa por negarse a someterse a una prueba química
    es un año de revocación de la licencia.
- id: 129
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un factor que afecta la absorción de alcohol
    de un individuo?
  choices:
    A: El tipo de bebida alcohólica consumida
    B: La estatura del conductor
    C: La cantidad de comida en el tracto digestivo
    D: La hora del día en que se consume el alcohol
  answer: C
  explanation: 'Muchos factores afectan la absorción de alcohol de un individuo. Estos
    incluyen: 1) peso, 2) sexo, 3) cantidad de comida en el tracto digestivo y 4)
    tiempo dedicado a beber.'
- id: 130
  category: alcohol_drugs_health
  question: ¿A qué concentración de alcohol en sangre (BAC) comienza el deterioro
    del tiempo de reacción de elección de un conductor?
  choices:
    A: .02%
    B: .03%
    C: .04%
    D: .08%
  answer: B
  explanation: Cuando el conductor debe elegir entre varias respuestas (reacción de
    elección), el deterioro comienza con un .03% de BAC.
- id: 131
  category: alcohol_drugs_health
  question: ¿Para cuando un conductor alcanza un .08% de BAC (concentración de alcohol
    en sangre), qué tan probable es que se vea involucrado en un choque fatal en comparación
    con un conductor que no ha bebido?
  choices:
    A: El doble de probable
    B: Tres veces más probable
    C: Cuatro veces más probable
    D: Cinco veces más probable
  answer: B
  explanation: El manual establece que para cuando un conductor alcanza un .08% de
    BAC, tiene tres veces más probabilidades de verse involucrado en un choque fatal
    que un conductor que no ha bebido.
- id: 132
  category: vehicle_information
  question: ¿Cuál es la posición recomendada de las manos en el volante para vehículos
    equipados con bolsas de aire (airbags)?
  choices:
    A: A las 10 y a las 2 en punto
    B: A las 8 y a las 4 en punto
    C: A las 9 y a las 3 en punto
    D: A las 11 y a las 1 en punto
  answer: C
  explanation: La posición recomendada de las manos del conductor para vehículos equipados
    con bolsas de aire ubicadas en el volante es la posición de las 9 y las 3 en punto.
- id: 133
  category: safe_driving_rules
  question: ¿Cuánto espacio deben dejar los conductores de vehículos equipados con
    bolsas de aire entre ellos y el volante?
  choices:
    A: Al menos 5 pulgadas
    B: Al menos 8 pulgadas
    C: Al menos 10 pulgadas
    D: Al menos 12 pulgadas
  answer: C
  explanation: Los conductores de vehículos equipados con bolsas de aire deben dejar
    al menos 10 pulgadas de espacio entre ellos y el volante.
- id: 134
  category: safe_driving_rules
  question: Para una máxima seguridad, ¿los niños de qué edad o menores deben viajar
    en el asiento trasero de un vehículo?
  choices:
    A: 8 años o menos
    B: 10 años o menos
    C: 12 años o menos
    D: 14 años o menos
  answer: C
  explanation: Para una máxima seguridad, los niños de 12 años o menos deben viajar
    en el asiento trasero.
- id: 135
  category: penalties_and_points
  question: 'La ley que exige que los niños de hasta ocho años viajen correctamente
    asegurados en un asiento de seguridad infantil aprobado por el gobierno federal
    se considera una:'
  choices:
    A: Ley Primaria
    B: Ley Secundaria
    C: Ley Provisional
    D: Ley Comercial
  answer: A
  explanation: El manual identifica el requisito de que los niños de hasta ocho años
    viajen correctamente asegurados en un asiento de seguridad infantil aprobado por
    el gobierno federal como una Ley Primaria, lo que significa que un conductor puede
    ser detenido y multado únicamente por esta infracción.
- id: 136
  category: safe_driving_rules
  question: ¿Durante cuánto tiempo se requiere que los niños viajen en un asiento
    de seguridad orientado hacia atrás?
  choices:
    A: Hasta el año de edad
    B: Hasta los dos años o hasta que alcancen el límite superior de altura o peso
      permitido por el fabricante
    C: Hasta los tres años
    D: Hasta que pesen 40 libras
  answer: B
  explanation: Los niños deben viajar orientados hacia atrás hasta los dos años o
    hasta que alcancen el límite superior de altura o peso permitido por el fabricante
    del asiento de seguridad.
- id: 137
  category: safe_driving_rules
  question: ¿Hasta qué edad se prohíbe que los niños viajen en las áreas de carga?
  choices:
    A: 12 años
    B: 14 años
    C: 16 años
    D: 18 años
  answer: D
  explanation: Se prohíbe que los niños de hasta dieciocho años viajen en áreas de
    carga. Esta es una Ley Primaria.
- id: 138
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar la Ley de Restricción de Pasajeros Infantiles?
  choices:
    A: Una multa de $25 más costos judiciales y 1 punto asignado al historial de conducción
    B: Una multa de $50 y 2 puntos asignados al historial de conducción
    C: Una multa de $100 y suspensión inmediata de la licencia
    D: Una multa de $10 y escuela de tráfico obligatoria
  answer: A
  explanation: La violación de la Ley de Restricción de Pasajeros Infantiles conlleva
    una multa de $25 más costos judiciales y se asigna 1 punto al historial de conducción
    del operador.
- id: 139
  category: defensive_driving
  question: Si está a punto de chocar con un ciervo, ¿cuál es su acción más segura?
  choices:
    A: Virar hacia el carril de tráfico en sentido contrario
    B: Desviarse de la calzada hacia la cuneta
    C: Frenar firmemente, maniobrar para mantener el control y detenerse de la manera
      más segura posible
    D: Acelerar para reducir el tiempo de impacto
  answer: C
  explanation: Si está a punto de chocar con un ciervo, su acción más segura es FRENAR
    (firmemente), MANIOBRAR (para mantener el control) y DETENERSE (de la manera más
    segura posible). No debe desviarse de la calzada.
- id: 140
  category: license_system
  question: Si un solicitante ha sufrido una pérdida de conocimiento, ¿dentro de cuántos
    meses previos a la obtención o renovación de una licencia debe hacer que un médico
    certifique que puede conducir de manera segura?
  choices:
    A: Un mes
    B: Tres meses
    C: Six meses
    D: Doce meses
  answer: B
  explanation: Cualquier persona que sufra de una condición médica que resulte en
    un incidente que involucre una pérdida de conocimiento dentro de un período de
    tres meses antes de obtener o renovar una licencia deberá contar con la certificación
    de un médico de que es capaz de operar un vehículo motorizado de manera segura.
- id: 141
  category: vehicle_information
  question: ¿Cuál es la ley con respecto al uso de óxido nitroso en un vehículo motorizado
    en una vía pública en Nebraska?
  choices:
    A: Se permite solo para rebasar a otros vehículos
    B: Se permite si el vehículo está registrado como un auto deportivo
    C: Es ilegal usar óxido nitroso en cualquier vehículo motorizado en una vía pública
    D: Se permite solo fuera de los límites de la ciudad
  answer: C
  explanation: Es ilegal usar óxido nitroso en cualquier vehículo motorizado operado
    en cualquier vía pública en este estado.
- id: 142
  category: safe_driving_rules
  question: ¿Qué es lo primero que debe hacer cuando ve luces de emergencia de la
    policía detrás de usted?
  choices:
    A: Detenerse inmediatamente en su carril de tráfico actual
    B: Acelerar para encontrar un estacionamiento bien iluminado
    C: Activar su señal de giro y orillarse o salir de la calzada tan pronto como
      sea seguro
    D: Encender sus luces de emergencia y continuar conduciendo hasta su destino
  answer: C
  explanation: Cuando vea luces de emergencia detrás de usted, recuerde activar su
    señal de giro y orillarse o salir de la calzada tan pronto como sea seguro hacerlo.
- id: 143
  category: alcohol_drugs_health
  question: ¿Cómo afecta la grasa corporal la absorción de alcohol en comparación
    con el tejido muscular?
  choices:
    A: La grasa absorbe más alcohol que el tejido muscular
    B: La grasa absorbe menos alcohol que el tejido muscular
    C: La grasa metaboliza el alcohol más rápido que el tejido muscular
    D: La grasa evita por completo que el alcohol entre en el torrente sanguíneo
  answer: B
  explanation: Una mayor proporción del peso corporal de una mujer es grasa, y la
    grasa absorbe menos alcohol que el tejido muscular, lo cual es uno de los factores
    que afectan los niveles de alcohol.
- id: 144
  category: penalties_and_points
  question: 'La Ley de Protección de Ocupantes, que requiere que los conductores y
    los pasajeros del asiento delantero viajen con el cinturón abrochado, se clasifica
    como una:'
  choices:
    A: Ley Primaria
    B: Ley Secundaria
    C: Ley Federal
    D: Ley de Tolerancia Cero
  answer: B
  explanation: Se requiere que los conductores y los pasajeros del asiento delantero
    viajen abrochados con un cinturón de seguridad o en un asiento de seguridad para
    niños. Esta se enumera como una Ley Secundaria, lo que significa que los conductores
    son citados solo si son detenidos y multados por otra infracción.
- id: 145
  category: safe_driving_rules
  question: ¿Qué debe hacer con las luces interiores de su vehículo si la policía
    lo detiene por la noche?
  choices:
    A: Apagarlas para evitar cegar al oficial
    B: Encenderlas para ayudar con la visibilidad
    C: Parpadearlas para señalar conformidad
    D: Atenuarlas al nivel más bajo
  answer: B
  explanation: El manual establece que durante una parada de tráfico por la noche,
    debe encender las luces interiores para ayudar con la visibilidad.
- id: 146
  category: penalties_and_points
  question: ¿Qué puede suceder si se niega a firmar una multa de tráfico durante una
    parada de tráfico?
  choices:
    A: Está admitiendo legalmente su culpabilidad
    B: La multa será desestimada automáticamente
    C: Puede resultar en su arresto
    D: Su licencia de conducir será revocada inmediatamente
  answer: C
  explanation: Según el manual, su aceptación y firma en una multa de tráfico no es
    una admisión de culpabilidad, pero la negativa a firmar una multa de tráfico puede
    resultar en su arresto.
- id: 147
  category: driver_responsibility
  question: ¿Cuál es el monto mínimo requerido de responsabilidad financiera (seguro)
    por lesiones o destrucción de la propiedad de terceros en un solo choque en Nebraska?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: La ley de Nebraska requiere responsabilidad financiera por un monto
    de veinticinco mil dólares ($25,000) debido a lesiones o destrucción de la propiedad
    de terceros en cualquier choque.
- id: 148
  category: vehicle_information
  question: Según la ley de Nebraska, ¿cuál es la profundidad mínima requerida de
    la banda de rodadura para los neumáticos neumáticos?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: La lista de equipo requerido en el manual especifica que los vehículos
    deben tener neumáticos neumáticos con al menos 2/32” de banda de rodadura.
- id: 149
  category: vehicle_information
  question: ¿Dónde se encuentra generalmente el Número de Identificación del Vehículo
    (VIN) si necesita revisar su vehículo para un llamado a revisión de seguridad?
  choices:
    A: Dentro de la guantera
    B: En la esquina inferior debajo del parabrisas
    C: En el parachoques trasero
    D: Debajo del asiento del conductor
  answer: B
  explanation: El manual establece que el número de identificación del vehículo (VIN)
    generalmente se encuentra en la esquina inferior debajo del parabrisas.
- id: 150
  category: safe_driving_rules
  question: ¿Por qué nunca debe girar el encendido de su vehículo a la posición de
    'bloqueo' (lock) mientras el vehículo está en movimiento?
  choices:
    A: Hará que el motor se sobrecaliente
    B: Dañará permanentemente la transmisión
    C: No podrá controlar el vehículo
    D: Las bolsas de aire se desplegarán automáticamente
  answer: C
  explanation: La mayoría de los vehículos tienen un dispositivo de bloqueo del volante
    que se activa cuando la llave se gira a la posición de bloqueo. Hacer esto mientras
    está en movimiento significa que no podrá controlar el vehículo.
- id: 151
  category: penalties_and_points
  question: ¿Cuál es la sanción por poseer u operar un vehículo motorizado en violación
    de las restricciones de protección solar y polarizado de ventanas de Nebraska?
  choices:
    A: Delito menor de Clase I
    B: Delito menor de Clase II
    C: Delito menor de Clase III
    D: Delito grave de Clase IV
  answer: C
  explanation: Cualquier persona que posea u opere un vehículo motorizado en violación
    de las restricciones de protección solar o polarizado será culpable de un delito
    menor de Clase III.
- id: 152
  category: vehicle_information
  question: ¿Dónde debe buscar para encontrar la presión de neumáticos recomendada
    (PSI) de su vehículo?
  choices:
    A: En el flanco (pared lateral) del neumático
    B: En una calcomanía dentro de la puerta del conductor o en el manual del propietario
    C: En el bloque del motor
    D: En la tarjeta de registro del vehículo
  answer: B
  explanation: Debe comparar la presión (PSI) medida con la presión (PSI) que se encuentra
    en la calcomanía dentro de la puerta del conductor de su vehículo o en el manual
    del propietario. NO debe compararla con la presión (PSI) que figura en el flanco
    del neumático.
- id: 153
  category: vehicle_information
  question: ¿Cuál es el mejor momento para revisar la presión de sus neumáticos?
  choices:
    A: Inmediatamente después de un viaje largo por carretera
    B: Mientras el vehículo está en movimiento
    C: 'Cuando los neumáticos están "fríos": antes de conducir o al menos tres horas
      después de haber conducido'
    D: Solo durante los meses de verano
  answer: C
  explanation: El manual aconseja revisar los neumáticos cuando están "fríos", es
    decir, antes de haber conducido o al menos tres horas después de haber conducido.
- id: 154
  category: vehicle_information
  question: Al usar la prueba de la moneda de un centavo (penny test) para revisar
    el desgaste de los neumáticos, ¿qué indica que está conduciendo con una cantidad
    segura de banda de rodadura?
  choices:
    A: Puede ver toda la cabeza de Abraham Lincoln
    B: Cualquier parte de la cabeza de Abraham Lincoln está cubierta por la banda
      de rodadura
    C: La moneda se cae de la ranura del neumático
    D: La banda de rodadura no toca la moneda en absoluto
  answer: B
  explanation: Al colocar la cabeza de Lincoln en una ranura del neumático, si alguna
    parte de la cabeza de Lincoln queda cubierta por la banda de rodadura, está conduciendo
    con una cantidad segura de banda de rodadura.
- id: 155
  category: signs_and_signals
  question: ¿Cómo debe tratar una intersección si el semáforo está apagado debido
    a una falla de energía y no hay ningún control de tráfico presente?
  choices:
    A: Tratarla como una señal de ceder el paso
    B: Continuar sin detenerse si el camino está despejado
    C: Tratarla como una parada obligatoria en todas las direcciones (all-way stop)
    D: Solo los vehículos en la carretera más grande tienen el derecho de paso
  answer: C
  explanation: Si un semáforo no está funcionando (está apagado) debido a una falla
    de energía u otra causa y no hay un oficial de paz, señalizador u otro control
    de tráfico en el lugar, la intersección debe tratarse como una parada obligatoria
    en todas las direcciones (all-way stop).
- id: 156
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a una luz roja intermitente en un cruce de
    ferrocarril?
  choices:
    A: Reducir la velocidad y continuar si no se ve ningún tren
    B: Detenerse por completo incluso si no se ve ningún tren
    C: Aumentar la velocidad para cruzar las vías rápidamente
    D: Ceder el paso solo a los peatones
  answer: B
  explanation: Una luz roja intermitente en un cruce de ferrocarril requiere una parada
    completa, incluso si no se ve ningún tren.
- id: 157
  category: signs_and_signals
  question: ¿Qué indica una luz de semáforo amarilla fija?
  choices:
    A: La luz está a punto de cambiar y debe detenerse de manera segura si aún no
      está en la intersección
    B: Usted tiene el derecho de paso para girar a la izquierda
    C: Debe detenerse por completo de inmediato sin importar su posición
    D: Debe acelerar para pasar la luz antes de que cambie a rojo
  answer: A
  explanation: Una luz amarilla fija es una advertencia de que la luz está a punto
    de cambiar. Si el vehículo no ha entrado en la intersección, debe detenerse de
    manera segura. Acelerar para "ganarle a la luz" es ilegal.
- id: 158
  category: safe_driving_rules
  question: Durante una parada de tráfico, ¿cuándo debe buscar su licencia de conducir
    o los documentos del vehículo?
  choices:
    A: Tan pronto como detenga su vehículo a un lado
    B: Mientras el oficial camina hacia su vehículo
    C: Solo después de esperar las instrucciones del oficial para hacerlo
    D: Antes de bajar la ventanilla
  answer: C
  explanation: El manual instruye a los conductores a esperar las instrucciones del
    oficial antes de buscar su licencia de conducir o los documentos del vehículo.
- id: 159
  category: vehicle_information
  question: ¿Cuál de los siguientes es un equipo requerido en los vehículos por la
    ley de Nebraska?
  choices:
    A: Una cámara de reversa
    B: Dos sistemas de frenos (freno de servicio y freno de estacionamiento)
    C: Luces para niebla
    D: Un neumático de repuesto
  answer: B
  explanation: De acuerdo con la sección de "Equipo Requerido", la ley de Nebraska
    exige que los vehículos tengan dos sistemas de frenos (freno de servicio y freno
    de estacionamiento).
- id: 160
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor al acercarse a una luz de semáforo roja intermitente?
  choices:
    A: Reducir la velocidad y continuar con precaución si la intersección está despejada.
    B: Detenerse solo si hay peatones u otros vehículos presentes.
    C: Detenerse por completo, ceder el paso al tráfico que se aproxima o a los peatones,
      y continuar cuando esté despejado.
    D: Esperar a que la luz roja intermitente cambie a una luz verde fija.
  answer: C
  explanation: Según el manual, una luz roja intermitente requiere una parada completa,
    cediendo el paso al tráfico que se aproxima o a los peatones, antes de continuar
    cuando el camino esté despejado.
- id: 161
  category: safe_driving_rules
  question: ¿Bajo qué condición es legal girar a la izquierda con un semáforo en rojo
    circular?
  choices:
    A: Nunca se permite bajo ninguna circunstancia.
    B: Cuando se circula por una calle de sentido único y se gira hacia otra calle
      de sentido único.
    C: Al girar desde una calle de doble sentido hacia una calle de sentido único.
    D: Cuando no hay tráfico en sentido contrario a menos de 500 pies.
  answer: B
  explanation: El manual establece que girar a la izquierda con un semáforo en rojo
    circular después de detenerse se permite solo si se circula por una calle de sentido
    único y se gira hacia otra calle de sentido único.
- id: 162
  category: signs_and_signals
  question: ¿Cuál es la regla con respecto a girar con una señal de flecha roja?
  choices:
    A: Puede girar a la derecha después de detenerse por completo.
    B: Puede girar a la izquierda si está girando hacia una calle de sentido único.
    C: Girar con una flecha roja está estrictamente prohibido.
    D: Puede girar si cede el paso a todos los peatones en el cruce peatonal.
  answer: C
  explanation: 'El manual establece explícitamente: "Girar con una flecha roja está
    prohibido".'
- id: 163
  category: signs_and_signals
  question: ¿Qué indica una señal de uso de carril con una "X" amarilla fija?
  choices:
    A: El conductor debe salir del carril de la manera más segura posible porque pronto
      aparecerá una "X" roja.
    B: El carril está abierto solo para realizar giros a la izquierda.
    C: Los conductores pueden continuar en el carril pero deben reducir su velocidad.
    D: La dirección del carril está cambiando, pero los conductores tienen el derecho
      de paso.
  answer: A
  explanation: Una señal de "X" amarilla fija significa que el conductor debe salir
    del carril tan pronto como sea posible de manera segura, ya que pronto aparecerá
    una "X" roja.
- id: 164
  category: signs_and_signals
  question: Al acercarse a una baliza híbrida para peatones (Pedestrian Hybrid Beacon)
    que parpadea en rojo, ¿qué debe hacer un conductor?
  choices:
    A: Permanecer completamente detenido hasta que la baliza se apague.
    B: Detenerse y verificar que no haya ningún peatón en su carril ni en ningún carril
      adyacente antes de continuar.
    C: Continuar sin detenerse si el cruce peatonal parece estar despejado.
    D: Ceder el paso al tráfico que viene en sentido contrario antes de girar.
  answer: B
  explanation: Durante el intervalo de rojo intermitente de una baliza híbrida para
    peatones, los conductores deben detenerse y verificar que no haya ningún peatón
    en su carril ni en ningún carril adyacente antes de continuar.
- id: 165
  category: signs_and_signals
  question: ¿Qué tipo de información indica una señal de carretera de color rosa?
  choices:
    A: Servicios para automovilistas, como áreas de descanso.
    B: Áreas de recreación e interés cultural.
    C: Gestión de incidentes.
    D: Advertencias de peatones y zonas escolares.
  answer: C
  explanation: El manual indica que el color rosa se utiliza para las "señales de
    gestión de incidentes".
- id: 166
  category: signs_and_signals
  question: ¿Qué forma de señal se utiliza exclusivamente para marcar zonas escolares
    y advertir sobre cruces peatonales de niños en edad escolar?
  choices:
    A: Diamante (rombo)
    B: Pentágono
    C: Octágono
    D: Banderín (triangular horizontal)
  answer: B
  explanation: La forma de pentágono (cinco lados) marca las zonas escolares y advierte
    sobre los cruces peatonales de niños en edad escolar.
- id: 167
  category: signs_and_signals
  question: ¿Qué indica una señal con forma de banderín (pennant)?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Una zona de no rebasar
    C: Un requisito de ceder el paso
    D: Una zona escolar
  answer: B
  explanation: La forma de banderín indica una zona de no rebasar (no adelantar).
- id: 168
  category: safe_driving_rules
  question: ¿Qué debe hacer si se acerca a un cruce de ferrocarril y las barreras
    están bajadas pero no se ve ningún tren?
  choices:
    A: Conducir alrededor de las barreras con cuidado.
    B: Esperar a que las luces dejen de parpadear y luego conducir alrededor de las
      barreras.
    C: Nunca conduzca alrededor de las barreras.
    D: Llamar a la policía para informar que la barrera está rota y luego continuar.
  answer: C
  explanation: 'El manual establece: "NUNCA CONDUZCA ALREDEDOR DE LAS BARRERAS. Es
    peligroso y contra la ley".'
- id: 169
  category: signs_and_signals
  question: ¿Qué significa una señal de advertencia de "Carril adicional" (Added Lane)?
  choices:
    A: Debe incorporarse al carril izquierdo de inmediato.
    B: Entrará tráfico de otra carretera, pero no es necesario incorporarse porque
      se ha añadido un carril.
    C: El carril derecho termina pronto y se requiere una maniobra de incorporación.
    D: Una carretera dividida comienza más adelante.
  answer: B
  explanation: La señal de carril adicional significa que el tráfico de otra carretera
    entrará a la vía, y no es necesario incorporarse porque se ha añadido un carril.
- id: 170
  category: signs_and_signals
  question: ¿Qué indica la señal de "Fin de carretera dividida" (Divided Highway Ends)?
  choices:
    A: Los carriles de tráfico más adelante están divididos por una mediana.
    B: Un carril está terminando y debe incorporarse a la izquierda.
    C: El tráfico de doble sentido está cambiando a tráfico de sentido único.
    D: El carril de tráfico en sentido contrario más adelante ya no está dividido
      por una mediana o divisor.
  answer: D
  explanation: La señal de fin de carretera dividida significa que el carril de tráfico
    en sentido contrario más adelante ya no está dividido por una mediana o divisor,
    y usted debe mantenerse a la derecha.
- id: 171
  category: safe_driving_rules
  question: ¿Dónde debe detenerse ante una señal de alto (stop) si no hay una línea
    de parada pintada o un cruce de peatones?
  choices:
    A: Directamente en paralelo a la señal de alto.
    B: En el punto más seguro más cercano a la vía que se cruza para obtener una visión
      clara del tráfico que se aproxima.
    C: Al menos 10 pies antes de la vía que se cruza.
    D: No es necesario detenerse por completo si la intersección está despejada.
  answer: B
  explanation: Si no hay un cruce de peatones o una línea de parada pintada, debe
    detenerse en el punto más seguro más cercano a la vía que se cruza para obtener
    una visión clara del tráfico que se aproxima.
- id: 172
  category: safe_driving_rules
  question: Al acercarse a una intersección con una flecha amarilla fija, ¿qué es
    ilegal?
  choices:
    A: Detener el vehículo de manera segura antes de entrar en la intersección.
    B: Continuar avanzando en la dirección de la flecha si ya se encuentra en la intersección.
    C: Acelerar para "ganarle a la flecha".
    D: Despejar la intersección de manera segura.
  answer: C
  explanation: 'Una flecha amarilla fija advierte que la luz está a punto de cambiar.
    El manual establece explícitamente: "Acelerar para ''ganarle a la flecha'' es
    ilegal".'
- id: 173
  category: signs_and_signals
  question: ¿Cómo debe tratar un conductor una Baliza Híbrida para Peatones (Pedestrian
    Hybrid Beacon) cuando está completamente oscura?
  choices:
    A: Tratarla como una parada de cuatro vías.
    B: Detenerse y esperar a que la baliza se ponga en verde.
    C: Continuar sin detenerse, ya que el estatuto que exige detenerse ante señales
      de tráfico oscuras no se aplica a estas balizas de mitad de cuadra.
    D: Ceder el paso a la derecha antes de continuar.
  answer: C
  explanation: Una vez finalizado el ciclo peatonal, las balizas estarán oscuras.
    El manual señala que el estatuto estatal que exige que los vehículos que se aproximan
    a una señal de tráfico oscura se detengan no se aplica a estas balizas de mitad
    de cuadra.
- id: 174
  category: signs_and_signals
  question: ¿Qué color se utiliza para las señales de información de guía, como la
    distancia o la dirección?
  choices:
    A: Azul
    B: Marrón
    C: Verde
    D: Blanco
  answer: C
  explanation: Según la sección de colores de las señales, el verde se utiliza para
    "Información de guía, como distancia o dirección".
- id: 175
  category: signs_and_signals
  question: ¿Qué indica una señal de "No Train Horn" (Sin bocina de tren) instalada
    debajo de una señal de cruce de ferrocarril?
  choices:
    A: No se permite que los trenes crucen en este lugar.
    B: Se ha establecido una zona de silencio y los trenes no tocan la bocina aquí.
    C: La señal de cruce de ferrocarril está averiada.
    D: Los conductores deben tocar la bocina antes de cruzar.
  answer: B
  explanation: Según el manual, la señal "No Train Horn" se instala en lugares donde
    se ha establecido una zona de silencio, lo que significa que los trenes no tocan
    la bocina en ese lugar.
- id: 176
  category: signs_and_signals
  question: ¿De qué color y forma es una señal de "No Passing Zone" (Zona de no adelantar)?
  choices:
    A: Una forma de banderín amarillo que se encuentra en el lado izquierdo de la
      carretera.
    B: Un rectángulo blanco que se encuentra en el lado derecho de la carretera.
    C: Un triángulo rojo que se encuentra en el lado izquierdo de la carretera.
    D: Un diamante naranja que se encuentra en el lado derecho de la carretera.
  answer: A
  explanation: El manual establece que se puede encontrar una señal amarilla en forma
    de banderín de "No Passing Zone" en el lado izquierdo de la carretera al comienzo
    de una zona donde no se permite adelantar.
- id: 177
  category: signs_and_signals
  question: ¿Hacia qué dirigen a los automovilistas las señales de servicio azules
    y blancas?
  choices:
    A: Información de dirección y distancia
    B: Zonas de obras en la carretera
    C: Servicios como hospitales, gasolina, comida y alojamiento
    D: Puntos de referencia para emergencias
  answer: C
  explanation: Las señales de servicio son señales azules y blancas que dirigen a
    los automovilistas hacia servicios, como hospitales, gasolina, comida, alojamiento,
    etc.
- id: 178
  category: sharing_the_road
  question: ¿A qué velocidad viajan los vehículos que exhiben un emblema de advertencia
    de vehículo de movimiento lento (Slow Moving Vehicle)?
  choices:
    A: 15 MPH o menos
    B: 25 MPH o menos
    C: 35 MPH o menos
    D: 45 MPH o menos
  answer: B
  explanation: Los emblemas de advertencia de vehículos de movimiento lento deben
    exhibirse en vehículos que viajan a 25 MPH o menos, como equipos agrícolas, cuando
    utilizan una vía pública.
- id: 179
  category: signs_and_signals
  question: ¿De qué color son las señales de advertencia de zonas de obras en la carretera?
  choices:
    A: Verde con letras blancas
    B: Amarillo con letras negras
    C: Naranja con letras negras
    D: Red con letras blancas
  answer: C
  explanation: Una zona de obras en la carretera se puede identificar fácilmente por
    señales de advertencia naranjas únicas con mensajes en letras negras, las cuales
    están reservadas estrictamente para identificar zonas de trabajo.
- id: 180
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando vea una señal de "Flagger" (Señalizador) en una
    zona de obras?
  choices:
    A: Acelerar para despejar la zona de obras rápidamente.
    B: Cambiar de carril inmediatamente.
    C: Tocar la bocina para alertar al señalizador de su presencia.
    D: Mantenerse alerta y estar preparado para detenerse.
  answer: D
  explanation: El manual establece que cuando vea la señal de "Flagger", debe MANTENERSE
    ALERTA y estar preparado para detenerse, permaneciendo detenido hasta que se le
    indique que continúe.
- id: 181
  category: signs_and_signals
  question: ¿Cuáles de los siguientes se utilizan comúnmente como dispositivos de
    canalización en una zona de obras?
  choices:
    A: Señales de mensaje dinámico y postes de referencia
    B: Barricadas, paneles verticales, tambores y conos
    C: Líneas de parada y marcas de cruce peatonal
    D: Paneles de flechas intermitentes y placas de velocidad recomendada
  answer: B
  explanation: Los dispositivos de canalización, como barricadas, paneles verticales,
    tambores y conos, son los dispositivos más utilizados para guiar a los conductores
    de manera segura a través de la zona de obras.
- id: 182
  category: safe_driving_rules
  question: ¿Qué indica una línea central amarilla discontinua?
  choices:
    A: Se permite rebasar por la izquierda cuando el camino adelante está despejado.
    B: No se permite rebasar en ninguna dirección.
    C: El tráfico fluye en la misma dirección.
    D: Debe detenerse antes de cruzar la línea.
  answer: A
  explanation: Una línea amarilla discontinua indica que se permite rebasar por la
    izquierda cuando el camino adelante está despejado, aunque el adelantamiento debe
    hacerse con precaución.
- id: 183
  category: safe_driving_rules
  question: ¿Cuándo se le permite legalmente cruzar líneas amarillas dobles continuas?
  choices:
    A: Al rebasar un vehículo que circula despacio.
    B: Al realizar un giro a la izquierda hacia un callejón, camino privado o entrada
      particular.
    C: Cuando el vehículo delante de usted está girando a la derecha.
    D: Nunca se permite cruzar líneas amarillas dobles continuas.
  answer: B
  explanation: Realizar un giro a la izquierda o evitar una obstrucción son los únicos
    cruces legales permitidos sobre líneas amarillas dobles, al girar hacia o desde
    un callejón, camino privado o entrada particular.
- id: 184
  category: safe_driving_rules
  question: ¿Cuál es el propósito de un carril central separado con líneas amarillas
    continuas y discontinuas?
  choices:
    A: Es un carril de adelantamiento para el tráfico en ambas direcciones.
    B: Está reservado solo para vehículos de emergencia.
    C: Reserva un carril para giros a la izquierda compartido con el tráfico de la
      dirección opuesta.
    D: Es un carril designado para bicicletas.
  answer: C
  explanation: Un carril central separado con líneas amarillas continuas y discontinuas
    reserva un carril para giros a la izquierda compartido con el tráfico de la dirección
    opuesta. Está prohibido usar este carril para rebasar.
- id: 185
  category: signs_and_signals
  question: ¿Qué separan las líneas blancas de carril?
  choices:
    A: Carriles de tráfico que van en direcciones opuestas.
    B: Carriles de tráfico que van en la misma dirección.
    C: El tráfico de vehículos motorizados del tráfico de bicicletas.
    D: La calzada del arcén (hombro).
  answer: B
  explanation: Según el manual, las líneas blancas separan los carriles de tráfico
    que van en la misma dirección.
- id: 186
  category: safe_driving_rules
  question: ¿Dónde debe detenerse un conductor cuando hay una línea de parada blanca
    en una intersección?
  choices:
    A: En la señal de alto o semáforo.
    B: En medio del cruce peatonal.
    C: En la línea, no en la señal de alto o semáforo.
    D: Cuatro pies después del cruce peatonal.
  answer: C
  explanation: Los conductores deben detenerse en la línea de parada (cuando esté
    presente), no en la señal de alto ni en el semáforo.
- id: 187
  category: defensive_driving
  question: ¿Cuál es el propósito de las bandas sonoras (rumble strips) en una carretera?
  choices:
    A: Indicar una zona de adelantamiento.
    B: Alertar a los conductores somnolientos o distraídos mediante vibración y sonido.
    C: Marcar la ubicación de un cruce peatonal.
    D: Proporcionar un carril seguro para ciclistas.
  answer: B
  explanation: Las bandas sonoras tienen como objetivo alertar a los conductores somnolientos
    o distraídos, mediante vibración y sonido, de que sus vehículos han salido del
    carril de circulación o se están acercando a una señal de alto o semáforo.
- id: 188
  category: sharing_the_road
  question: ¿Cuándo es legal que un automovilista cruce un carril para bicicletas
    designado?
  choices:
    A: Al rebasar un vehículo motorizado más lento.
    B: Al usarlo como un carril continuo de giro a la derecha.
    C: Para moverse a otro carril de circulación, entrar/salir de espacios de estacionamiento
      o entrar/salir de una propiedad privada.
    D: Nunca es legal cruzar un carril para bicicletas.
  answer: C
  explanation: Si bien es ilegal conducir en carriles para bicicletas, los automovilistas
    pueden cruzar el carril para bicicletas para moverse a otro carril de circulación
    apropiado, para entrar o salir de espacios de estacionamiento en la calle o para
    entrar o salir de una propiedad privada.
- id: 189
  category: sharing_the_road
  question: ¿Cuál es el espacio libre mínimo de distancia de seguridad que un automovilista
    debe mantener al rebasar a un ciclista en un carril compartido?
  choices:
    A: Un pie
    B: Dos pies
    C: Tres pies
    D: Cinco pies
  answer: C
  explanation: Los automovilistas deben evitar rebasar a los ciclistas hasta que exista
    una distancia de seguridad de no menos de tres pies de espacio libre.
- id: 190
  category: safe_driving_rules
  question: Si conduce a una velocidad inferior a la normal del tráfico, ¿en qué carril
    debe conducir?
  choices:
    A: El carril izquierdo
    B: El carril central
    C: El carril derecho
    D: Cualquier carril, siempre que esté en el límite de velocidad
  answer: C
  explanation: Cualquier vehículo que circule a una velocidad inferior a la normal
    del tráfico debe ser conducido en el carril derecho cuando esté disponible, excepto
    al rebasar o prepararse para un giro a la izquierda.
- id: 191
  category: safe_driving_rules
  question: En una intersección no controlada donde los vehículos se aproximan aproximadamente
    al mismo tiempo, ¿qué vehículo debe ceder el paso?
  choices:
    A: El vehículo de la derecha debe ceder el paso al vehículo de la izquierda.
    B: El vehículo de la izquierda debe ceder el paso al vehículo de la derecha.
    C: El vehículo que va más rápido tiene el derecho de paso.
    D: El vehículo más grande tiene el derecho de paso.
  answer: B
  explanation: Para el derecho de paso en una intersección no controlada, esté atento
    a los vehículos que vienen por la derecha y ceda el paso. El vehículo de la izquierda
    cede el paso al vehículo de la derecha.
- id: 192
  category: safe_driving_rules
  question: ¿Cuál es la regla de cortesía común para avanzar en una intersección con
    una parada de cuatro vías (four-way stop)?
  choices:
    A: Se debe permitir que el conductor que se detenga primero pase primero.
    B: El conductor que gira a la izquierda siempre pasa primero.
    C: El conductor de la izquierda siempre pasa primero.
    D: El conductor que va recto debe ceder el paso a los vehículos que giran.
  answer: A
  explanation: En las paradas de cuatro vías, la cortesía común es que se debe permitir
    que el conductor que se detenga primero pase primero. En caso de duda, ceda el
    paso al conductor a su derecha.
- id: 193
  category: safe_driving_rules
  question: ¿A quién se le permite utilizar los delantales para camiones (truck aprons)
    ubicados en las rotondas?
  choices:
    A: Automóviles y SUVs
    B: Ciclistas y peatones
    C: Camionetas (pickups)
    D: Las ruedas traseras de camiones grandes
  answer: D
  explanation: Las rotondas cuentan con delantales para camiones (truck aprons) para
    que las ruedas traseras de los camiones grandes los utilicen al girar. No deben
    ser utilizados por automóviles, SUVs, camionetas, ciclistas ni peatones.
- id: 194
  category: safe_driving_rules
  question: Al acercarse a una rotonda, ¿a quién debe cederle el paso antes de entrar?
  choices:
    A: Al tráfico que se aproxima por su derecha
    B: Al tráfico que se aproxima por su izquierda y que ya está en la rotonda
    C: Solo a los camiones grandes
    D: A los vehículos que entran por el lado opuesto
  answer: B
  explanation: Al conducir en una rotonda, debe ceder el paso al tráfico que se aproxima
    por su izquierda y que ya se encuentra dentro de la rotonda antes de entrar.
- id: 195
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima un vehículo de emergencia mientras usted
    ya está conduciendo dentro de una rotonda?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda.
    B: Acelerar y salir lo más rápido posible.
    C: Continuar hasta su salida y luego orillarse una vez pasada la isla divisoria
      (splitter island).
    D: Orillarse en la isla central.
  answer: C
  explanation: Si ha entrado en la rotonda, continúe hasta su salida y, una vez pasada
    la isla divisoria, oríllese y permita que pasen los vehículos de emergencia. Evite
    detenerse dentro de la rotonda.
- id: 196
  category: safe_driving_rules
  question: Según la Ley de Hacerse a un Lado (Move Over Law) de Nebraska, ¿qué debe
    hacer un conductor al acercarse a un vehículo de emergencia detenido con luces
    intermitentes en una carretera de varios carriles?
  choices:
    A: Detenerse inmediatamente en su carril.
    B: Moverse a un carril que esté al menos a un carril de distancia del vehículo
      detenido.
    C: Tocar la bocina para alertar a los trabajadores de emergencia.
    D: Acelerar para pasar la escena rápidamente.
  answer: B
  explanation: La Ley de Hacerse a un Lado exige que los conductores que se aproximen
    a un vehículo de emergencia detenido con luces intermitentes se muevan a un carril
    que esté al menos a un carril de distancia. Si no es posible, deben reducir la
    velocidad y mantener una velocidad segura.
- id: 197
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de la Ley de Hacerse a
    un Lado (Move Over Law) de Nebraska?
  choices:
    A: Una multa de hasta $100
    B: Una multa de hasta $500
    C: Hasta 7 días de cárcel
    D: Suspensión de la licencia por 30 días
  answer: A
  explanation: Las multas por violar la Ley de Hacerse a un Lado son de hasta $100
    por una primera infracción.
- id: 198
  category: safe_driving_rules
  question: Si se ve involucrado en un choque menor en la interestatal sin heridos
    y su vehículo aún se puede conducir, ¿qué debe hacer?
  choices:
    A: Dejar los vehículos exactamente donde están hasta que llegue la policía.
    B: Conducir los vehículos al arcén (hombro) más cercano fuera de los carriles
      de circulación.
    C: Permanecer en el carril de circulación para dirigir el tráfico alrededor de
      su vehículo.
    D: Esperar a que una grúa mueva el vehículo.
  answer: B
  explanation: Los conductores involucrados en choques menores en el sistema de autopistas
    o interestatales en los que no hay heridos y los vehículos aún se pueden conducir,
    deben llevar los vehículos al arcén más cercano fuera de los carriles de circulación.
- id: 199
  category: safe_driving_rules
  question: ¿Qué debe hacer al salir de un callejón, entrada privada o estacionamiento
    para entrar en una calzada?
  choices:
    A: Tocar la bocina y avanzar sin detenerse.
    B: Detenerse solo si se aproxima un vehículo.
    C: Detenerse antes de conducir sobre una acera o área de acera.
    D: Ceder el paso solo a los vehículos, no a los peatones.
  answer: C
  explanation: Al salir de callejones, entradas privadas o estacionamientos para entrar
    en una calzada, DETÉNGASE antes de conducir sobre una acera o sobre el área de
    la acera y avance lentamente. Ceda el derecho de paso a cualquier peatón y a los
    vehículos que se aproximen.
- id: 200
  category: safe_driving_rules
  question: ¿A qué distancia debe mantenerse cuando sigue a un equipo de bomberos
    (fire apparatus) que viaja en estado de emergencia?
  choices:
    A: Al menos 100 pies
    B: Al menos 200 pies
    C: Al menos 300 pies
    D: Al menos 500 pies
  answer: D
  explanation: Ningún vehículo puede seguir a un equipo de bomberos que viaje en estado
    de emergencia a una distancia menor de 500 pies.
- id: 201
  category: sharing_the_road
  question: ¿Cómo se clasifican los vehículos de escolta de cortejos fúnebres según
    las reglas de derecho de paso de Nebraska?
  choices:
    A: Como vehículos de pasajeros estándar
    B: Como vehículos comerciales
    C: Como vehículos de emergencia
    D: Como vehículos de mantenimiento de carreteras
  answer: C
  explanation: Los vehículos de escolta de cortejos fúnebres se clasifican como vehículos
    de emergencia. Los conductores deben ceder el paso a los vehículos de escolta
    fúnebre que muestren las señales auditivas o visuales adecuadas.
- id: 202
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en un distrito residencial en Nebraska?
  choices:
    A: 15 MPH
    B: 20 MPH
    C: 25 MPH
    D: 35 MPH
  answer: C
  explanation: A menos que se indique lo contrario, el límite de velocidad máximo
    es de 25 MPH en distritos residenciales.
- id: 203
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en las autopistas interestatales
    rurales en Nebraska, a menos que se indique lo contrario?
  choices:
    A: 65 MPH
    B: 70 MPH
    C: 75 MPH
    D: 80 MPH
  answer: C
  explanation: A menos que se indique lo contrario, el límite de velocidad máximo
    es de 75 MPH en las autopistas interestatales rurales.
- id: 204
  category: penalties_and_points
  question: ¿Qué sucede con las multas por exceso de velocidad en las zonas escolares
    y cuando hay trabajadores presentes en las zonas de obra?
  choices:
    A: Se reducen a la mitad
    B: Se duplican
    C: Permanecen iguales
    D: Se triplican
  answer: B
  explanation: Según el manual, las multas se duplican en las zonas escolares y cuando
    hay trabajadores presentes en las zonas de obra.
- id: 205
  category: safe_driving_rules
  question: ¿Es ilegal rebasar a otro vehículo a menos de cuántos pies de cualquier
    intersección o cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: El manual establece explícitamente que es ilegal rebasar a menos de
    100 pies de cualquier intersección o a menos de 100 pies de cualquier cruce de
    ferrocarril.
- id: 206
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cuándo es seguro señalizar y volver al carril
    derecho?
  choices:
    A: Tan pronto como haya pasado el parachoques delantero del vehículo
    B: Cuando pueda ver la parte delantera del vehículo rebasado o sus faros en su
      espejo retrovisor
    C: Después de haber mantenido su velocidad de rebase durante 5 segundos
    D: Cuando el conductor al que está rebasando parpadee sus faros
  answer: B
  explanation: Debe señalizar y volver al carril derecho cuando vea la parte delantera
    del vehículo rebasado o los faros del vehículo en el espejo retrovisor.
- id: 207
  category: sharing_the_road
  question: ¿Qué debe hacer cuando otro vehículo lo está rebasando?
  choices:
    A: Acelerar para evitar que lo rebasen
    B: Reducir la velocidad significativamente para dejarlo pasar rápidamente
    C: Moverse hacia el arcén de la carretera
    D: Permanecer en su carril y mantener la velocidad a menos que haya una emergencia
  answer: D
  explanation: Cuando otro vehículo lo esté rebasando, debe permanecer en el carril
    y mantener la velocidad a menos que haya una emergencia.
- id: 208
  category: safe_driving_rules
  question: ¿Debe señalizar al menos cuántos pies antes de girar o moverse a la derecha
    o a la izquierda?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: El manual requiere que los conductores señalicen al menos 100 pies
    antes de girar o moverse a la derecha o a la izquierda.
- id: 209
  category: signs_and_signals
  question: ¿Qué tipo de marcas en el pavimento indican un carril reversible?
  choices:
    A: Líneas amarillas dobles continuas
    B: Líneas blancas discontinuas simples
    C: Líneas amarillas discontinuas dobles
    D: Líneas blancas continuas con flechas
  answer: C
  explanation: Los carriles reversibles se indican mediante líneas amarillas discontinuas
    dobles, que muestran que el carril cambia de dirección del flujo de tráfico según
    lo indiquen las señales o semáforos.
- id: 210
  category: safe_driving_rules
  question: ¿Dónde se establece explícitamente en el manual que NO debe cambiar de
    carril?
  choices:
    A: En una autopista de varios carriles
    B: En una intersección
    C: En una zona escolar
    D: En una calle de sentido único
  answer: B
  explanation: 'En la sección de ''Cambio de carril'', el manual establece específicamente:
    ''NO cambie de carril en una intersección''.'
- id: 211
  category: safe_driving_rules
  question: Al realizar una parada de emergencia al costado de la carretera, ¿a cuántas
    pulgadas del bordillo o del borde de la carretera debe estacionar su vehículo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Para una parada de emergencia al costado de la carretera, debe estacionar
    el vehículo a no más de 12 pulgadas y de forma paralela al bordillo o al borde
    de la carretera.
- id: 212
  category: safe_driving_rules
  question: ¿Es ilegal estacionar a menos de cuántos pies de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: El manual enumera 'A menos de 15 pies de un hidrante de incendios'
    bajo la sección 'Dónde no estacionar ni detener un vehículo'.
- id: 213
  category: safe_driving_rules
  question: ¿Hacia dónde debe girar las ruedas al estacionar cuesta arriba donde hay
    un bordillo?
  choices:
    A: Girar las ruedas hacia el bordillo
    B: Mantener las ruedas rectas
    C: Girar las ruedas en dirección contraria al bordillo
    D: Girar las ruedas hacia la izquierda independientemente del bordillo
  answer: C
  explanation: Si estaciona cuesta arriba donde hay un bordillo, ponga el freno de
    mano y gire las ruedas en dirección contraria al bordillo.
- id: 214
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera infracción de las leyes de estacionamiento
    para personas con discapacidad?
  choices:
    A: Hasta $50
    B: Hasta $100
    C: Hasta $150
    D: Hasta $300
  answer: C
  explanation: Las multas por violar las leyes de estacionamiento para personas con
    discapacidad son de hasta $150 por una primera infracción.
- id: 215
  category: safe_driving_rules
  question: Cuando se le requiera detenerse en un cruce de ferrocarril, ¿a qué distancia
    del riel más cercano debe detenerse?
  choices:
    A: No menos de 10 pies ni más de 30 pies
    B: No menos de 15 pies ni más de 50 pies
    C: No menos de 20 pies ni más de 100 pies
    D: Exactamente 15 pies
  answer: B
  explanation: Cuando se le requiera detenerse en un cruce de ferrocarril, debe detenerse
    en la línea de parada. Si no hay ninguna, deténgase a no menos de 15 pies ni más
    de 50 pies del riel más cercano.
- id: 216
  category: safe_driving_rules
  question: ¿Qué acción debe evitar realizar mientras conduce a través de las vías
    del ferrocarril?
  choices:
    A: Mirar hacia ambos lados
    B: Cambiar de marcha (velocidades)
    C: Mantener una velocidad constante
    D: Sujetar el volante con firmeza
  answer: B
  explanation: 'El manual establece explícitamente bajo la sección ''Después de detenerse''
    en los cruces de ferrocarril: ''No cambie de marcha al cruzar las vías''.'
- id: 217
  category: defensive_driving
  question: Si su vehículo se apaga (se cala) en un cruce de ferrocarril, ¿qué es
    lo primero que debe hacer?
  choices:
    A: Intentar reiniciar el motor inmediatamente
    B: Llamar a una grúa
    C: Hacer que todos salgan y se alejen de las vías de inmediato
    D: Poner el vehículo en punto muerto e intentar empujarlo fuera de las vías
  answer: C
  explanation: Si el vehículo se apaga en un cruce, el manual instruye que todos salgan
    y se alejen de las vías de inmediato, y luego se muevan en la dirección de donde
    se espera que venga el tren.
- id: 218
  category: signs_and_signals
  question: ¿De qué color es la señal del Sistema de Notificación de Emergencia (ENS)
    que se encuentra típicamente en los cruces a nivel de carretera y ferrocarril?
  choices:
    A: Rojo
    B: Azul
    C: Amarillo
    D: Verde
  answer: B
  explanation: La señal ENS, que suele ser de color azul, se encuentra en todos los
    cruces a nivel de carretera y ferrocarril y proporciona al público un número de
    teléfono para informar problemas o emergencias.
- id: 219
  category: defensive_driving
  question: ¿Cuánta distancia de frenado requiere un tren de carga promedio de 150
    vagones que viaja a 60 MPH?
  choices:
    A: 3150 pies
    B: 5000 pies
    C: 8500 pies
    D: 10000 pies
  answer: C
  explanation: Un tren de carga promedio de 150 vagones que viaja a 60 MPH requiere
    8500 pies o una y tres quintas (1-3/5) millas para detenerse.
- id: 220
  category: safe_driving_rules
  question: Al usar una rampa de entrada a la interestatal, ¿qué debe hacer cuando
    la línea blanca continua cambia a una línea blanca discontinua?
  choices:
    A: Detenerse por completo antes de incorporarse.
    B: Ajustar su velocidad, usar su señal de giro e incorporarse a un espacio en
      el tráfico cuando sea seguro.
    C: Cruzar la mediana para entrar en los carriles expresos.
    D: Mantener una velocidad mínima de 60 MPH antes de incorporarse.
  answer: B
  explanation: Cuando comienza la línea blanca discontinua en una rampa de entrada,
    ajuste su velocidad, use su señal de giro e incorpórese a un espacio en el tráfico
    cuando sea seguro hacerlo.
- id: 221
  category: safe_driving_rules
  question: ¿Cuál es la velocidad mínima permitida en la interestatal?
  choices:
    A: 30 MPH
    B: 40 MPH
    C: 45 MPH
    D: 50 MPH
  answer: B
  explanation: La velocidad mínima en la interestatal es de 40 MPH.
- id: 222
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de la salida deseada en la interestatal?
  choices:
    A: Retroceder con cuidado por el arcén (hombro) derecho.
    B: Usar el punto de cruce de emergencia en la mediana.
    C: Detenerse y esperar a que el tráfico se despeje antes de dar marcha atrás.
    D: Continuar hasta la siguiente salida.
  answer: D
  explanation: Si se pasa de su salida, continúe hasta la siguiente. Está prohibido
    retroceder o usar los puntos de cruce de emergencia en la interestatal.
- id: 223
  category: safe_driving_rules
  question: Según el manual, ¿cuándo deben usarse las luces delanteras (faros) de
    su vehículo?
  choices:
    A: Desde la puesta del sol hasta el amanecer
    B: Solo cuando la visibilidad sea inferior a 500 pies
    C: De 8 PM a 6 AM
    D: Solo cuando se conduce por carreteras sin iluminación
  answer: A
  explanation: Las luces delanteras deben usarse desde la puesta del sol hasta el
    amanecer.
- id: 224
  category: defensive_driving
  question: Si las luces delanteras de un vehículo que viene en sentido contrario
    lo deslumbran por la noche, ¿hacia dónde debe mirar?
  choices:
    A: Directamente a las luces del vehículo que viene en sentido contrario
    B: Hacia el borde izquierdo de la carretera
    C: Hacia el borde derecho de la carretera
    D: Al tablero de instrumentos de su vehículo
  answer: C
  explanation: Si las luces del sentido contrario lo deslumbran, no mire directamente
    al vehículo, sino hacia el borde derecho de la carretera.
- id: 225
  category: defensive_driving
  question: ¿Cuánta agua en movimiento se necesita para arrastrar a la mayoría de
    los vehículos, incluidos los vehículos utilitarios deportivos (SUV) y las camionetas
    (pick-up)?
  choices:
    A: Seis pulgadas
    B: Un pie
    C: Dos pies
    D: Tres pies
  answer: C
  explanation: Dos pies de agua en movimiento pueden arrastrar a la mayoría de los
    vehículos, incluidos los vehículos utilitarios deportivos y las camionetas.
- id: 226
  category: vehicle_information
  question: ¿Cómo debe aplicar los frenos sobre nieve y hielo si su vehículo está
    equipado con frenos antibloqueo (ABS)?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Presionar el pedal del freno con firmeza y no bombear los frenos.
    C: Tocar ligeramente los frenos mientras gira bruscamente.
    D: Aplicar el freno de emergencia en lugar del freno de pie.
  answer: B
  explanation: 'Para vehículos equipados con frenos antibloqueo (ABS): presione el
    pedal del freno con firmeza; no bombee los frenos.'
- id: 227
  category: vehicle_information
  question: ¿Durante qué período de tiempo es legal el uso de neumáticos con clavos?
  choices:
    A: Del 1 de octubre al 1 de marzo
    B: Del 1 de noviembre al 1 de abril
    C: Del 1 de diciembre al 31 de marzo
    D: Del 15 de noviembre al 15 de abril
  answer: B
  explanation: Los neumáticos con clavos solo son legales desde el 1 de noviembre
    hasta el 1 de abril.
- id: 228
  category: defensive_driving
  question: Si queda varado en una tormenta de nieve, ¿qué debe hacer para mantenerse
    a salvo mientras mantiene encendidos el motor y la calefacción?
  choices:
    A: Mantener todas las ventanas bien cerradas para conservar el calor.
    B: Abrir un poco una ventana para que entre aire fresco y evitar que la nieve
      bloquee el tubo de escape.
    C: Salir del vehículo y caminar para buscar ayuda.
    D: Mantener el motor en marcha continuamente hasta que pase la tormenta.
  answer: B
  explanation: 'Si queda varado: Abra un poco una ventana para que entre aire fresco.
    Ahorre combustible, use el motor y la calefacción con moderación, y solo con una
    ventana ligeramente abierta para ventilación. Evite que la nieve bloquee el tubo
    de escape.'
- id: 229
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si sus ruedas se salen del borde de
    la calzada o del pavimento?
  choices:
    A: Girar inmediatamente el volante de forma brusca para volver a la carretera.
    B: Frenar de golpe para detenerse lo más rápido posible.
    C: Sujetar el volante con firmeza y conducir de modo que las ruedas queden a ambos
      lados del borde de la calzada.
    D: Acelerar para recuperar la tracción antes de volver a girar.
  answer: C
  explanation: 'Si las ruedas se salen del borde de la calzada o del pavimento: Sujete
    el volante con firmeza y conduzca de modo que las ruedas queden a ambos lados
    del borde de la calzada. No intente volver a la calzada de inmediato.'
- id: 230
  category: driver_responsibility
  question: Según los estudios, ¿en cuánto aumenta el riesgo de choque de un conductor
    el enviar mensajes de texto mientras conduce?
  choices:
    A: 4 veces
    B: 6 veces
    C: 10 veces
    D: 23 veces
  answer: D
  explanation: Los estudios revelan que el envío de mensajes de texto aumenta el riesgo
    de choque de un conductor en 23 veces.
- id: 231
  category: penalties_and_points
  question: ¿Cuál es la multa por enviar mensajes de texto mientras se conduce?
  choices:
    A: $50 a $100
    B: $100 a $200
    C: $200 a $500
    D: $500 a $1000
  answer: C
  explanation: La multa por enviar mensajes de texto mientras se conduce es de $200
    a $500.
- id: 232
  category: driver_responsibility
  question: ¿Cuáles son los tres tipos principales de distracciones al conducir?
  choices:
    A: Visual, manual y cognitiva
    B: Física, mental y emocional
    C: Interna, externa y mecánica
    D: Auditiva, visual y física
  answer: A
  explanation: 'Existen tres tipos principales de distracción: Visual (apartar la
    vista de la carretera), Manual (quitar las manos del volante) y Cognitiva (apartar
    la mente o el enfoque de la tarea de conducir).'
- id: 233
  category: safe_driving_rules
  question: ¿Por qué los teléfonos celulares "manos libres" se siguen considerando
    una distracción peligrosa al conducir?
  choices:
    A: Requieren que quite las manos del volante para contestar.
    B: La conversación reduce la capacidad del cerebro para procesar información visual
      en movimiento en un 37%.
    C: Su uso es ilegal en Nebraska.
    D: Hacen que el conductor aparte la vista de la carretera durante un promedio
      de 4.6 segundos.
  answer: B
  explanation: El manual establece que el área del cerebro responsable de procesar
    la información visual en movimiento tiene un 37% menos de capacidad cuando se
    concentra en una conversación por teléfono celular, incluso si es manos libres.
    Es la conversación, no el dispositivo, lo que genera el peligro.
- id: 234
  category: safe_driving_rules
  question: ¿Cuál de las siguientes opciones es ilegal en Nebraska con respecto a
    los televisores en los vehículos?
  choices:
    A: Tener un televisor en cualquier lugar dentro de un vehículo en movimiento.
    B: Operar un vehículo con una pantalla de televisión que sea visible para el conductor.
    C: Permitir que los pasajeros en el asiento trasero vean televisión.
    D: Tener una pantalla de televisión de más de 10 pulgadas en el vehículo.
  answer: B
  explanation: En Nebraska, es ilegal operar en cualquier vía pública un vehículo
    equipado con un televisor si la pantalla de visualización es visible para el conductor.
- id: 235
  category: defensive_driving
  question: ¿Cuál de los siguientes comportamientos es un ejemplo de conducción agresiva?
  choices:
    A: Usar la bocina para alertar a otro conductor de un peligro inmediato.
    B: Tocar ligeramente los frenos para advertir a los conductores que vienen detrás.
    C: Seguir muy de cerca (tailgating) y cerrarle el paso a otros conductores.
    D: Conducir a 5 mph por debajo del límite de velocidad.
  answer: C
  explanation: La conducción agresiva incluye comportamientos que son intimidantes
    o groseros, como seguir muy de cerca a otros vehículos, cerrarle el paso a otros
    conductores, pasarse semáforos en rojo y no ceder el paso.
- id: 236
  category: safe_driving_rules
  question: Si siente somnolencia mientras conduce, ¿cuál de las siguientes es una
    forma eficaz de mantenerse alerta?
  choices:
    A: Bajar la ventanilla.
    B: Mascar chicle.
    C: Subir el volumen de la radio.
    D: Detenerse en un área segura y tomar una siesta de 10 a 20 minutos.
  answer: D
  explanation: El manual establece que bajar la ventanilla, mascar chicle o subir
    el volumen de la radio no funcionan para prevenir la somnolencia. Tomar una siesta
    corta de 10 a 20 minutos puede marcar una gran diferencia.
- id: 237
  category: defensive_driving
  question: Al practicar la conducción defensiva, ¿con cuánta anticipación debe observar
    la carretera?
  choices:
    A: 3 a 4 segundos
    B: 5 a 8 segundos
    C: 10 a 15 segundos
    D: 20 a 30 segundos
  answer: C
  explanation: Las técnicas de conducción defensiva requieren que mire hacia adelante
    y analice la situación en la carretera con al menos 10 a 15 segundos de anticipación.
- id: 238
  category: defensive_driving
  question: ¿Con qué frecuencia debe revisar el tráfico detrás de usted usando sus
    espejos?
  choices:
    A: Al menos cada 5 segundos
    B: Al menos cada 10 segundos
    C: Al menos cada 30 segundos
    D: Solo al cambiar de carril
  answer: B
  explanation: Debe revisar el tráfico detrás de usted al menos cada 10 segundos,
    así como al cambiar de carril, retroceder, reducir la velocidad o bajar colinas
    empinadas.
- id: 239
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalizar sus intenciones antes de planear
    cambiar de dirección?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: Debe señalizar sus intenciones al menos 100 pies antes de planear cambiar
    de dirección.
- id: 240
  category: defensive_driving
  question: Bajo la regla de los tres segundos, ¿qué debe hacer si se encuentra con
    un factor de adversidad como lluvia o tráfico pesado?
  choices:
    A: Disminuir su distancia de seguimiento por un segundo.
    B: Aumentar su distancia de seguimiento por un segundo por cada factor de adversidad.
    C: Mantener la distancia de seguimiento de tres segundos.
    D: Duplicar su velocidad para rebasar el tráfico rápidamente.
  answer: B
  explanation: La regla de los tres segundos es un requisito mínimo y debe aumentarse
    un segundo por cada factor de adversidad encontrado, como lluvia o tráfico pesado.
- id: 241
  category: sharing_the_road
  question: 'Al compartir la carretera con una motocicleta, usted debe:'
  choices:
    A: Compartir el carril con la motocicleta ya que es pequeña.
    B: Permitir al motociclista el ancho completo de un carril.
    C: Seguir a la motocicleta a una distancia de un segundo.
    D: Esperar que las señales de giro de la motocicleta se cancelen automáticamente.
  answer: B
  explanation: Debe permitir al motociclista el ancho completo de un carril. Aunque
    parezca haber suficiente espacio, las motocicletas necesitan el espacio para maniobrar
    de forma segura, por lo que no debe compartir el carril.
- id: 242
  category: sharing_the_road
  question: 'Casi el 40 por ciento de los choques de motocicletas que involucran a
    otro vehículo motorizado son causados por:'
  choices:
    A: La motocicleta siguiendo demasiado cerca al otro vehículo.
    B: El otro vehículo girando a la izquierda frente al motociclista.
    C: La motocicleta pasándose un semáforo en rojo.
    D: El otro vehículo chocando por detrás a la motocicleta.
  answer: B
  explanation: Según el manual, casi el 40 por ciento de los choques que involucran
    a una motocicleta y otro vehículo motorizado fueron causados por el otro vehículo
    girando a la izquierda frente al motociclista.
- id: 243
  category: sharing_the_road
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir detrás de
    una motocicleta?
  choices:
    A: Uno a dos segundos
    B: Dos a tres segundos
    C: Tres a cuatro segundos
    D: Cinco a seis segundos
  answer: C
  explanation: Debe permitir una mayor distancia de seguimiento, de tres o cuatro
    segundos, al seguir a una motocicleta para que el motociclista tenga suficiente
    tiempo para maniobrar o detenerse en una emergencia.
- id: 244
  category: sharing_the_road
  question: Según la ley de Nebraska, ¿qué derechos y deberes tienen los ciclistas
    en la calzada?
  choices:
    A: Tienen los mismos deberes y derechos que el conductor de un vehículo motorizado.
    B: Siempre deben ceder el paso a los vehículos motorizados.
    C: Se consideran peatones y deben usar las aceras.
    D: Solo se les permite circular por los arcenes (hombros) pavimentados.
  answer: A
  explanation: Según el Estatuto Revisado de Nebraska §60-6,314, una persona que monta
    en bicicleta tiene los mismos deberes y derechos que el conductor de un vehículo
    motorizado y debe obedecer las leyes de tránsito.
- id: 245
  category: sharing_the_road
  question: ¿Cuándo puede un ciclista circular por el carril principal de circulación
    en lugar de hacerlo por el extremo derecho?
  choices:
    A: Siempre que quiera circular al lado de otro ciclista.
    B: Cuando el carril es demasiado estrecho para que una bicicleta y un vehículo
      circulen de forma segura uno al lado del otro.
    C: Solo cuando viaja a la misma velocidad que el tráfico de vehículos motorizados.
    D: A los ciclistas nunca se les permite circular por el carril principal de circulación.
  answer: B
  explanation: Los ciclistas pueden circular por el carril de circulación cuando el
    carril es demasiado estrecho para que una bicicleta y un vehículo circulen de
    forma segura uno al lado del otro dentro del carril.
- id: 246
  category: defensive_driving
  question: ¿Qué debe hacer si necesita advertir a los conductores que vienen detrás
    de usted que está disminuyendo la velocidad?
  choices:
    A: Tocar la bocina con un sonido fuerte y seco.
    B: Encender las luces de emergencia.
    C: Presionar rápidamente los frenos varias veces.
    D: Usar señales manuales por la ventana.
  answer: C
  explanation: Para comunicarse y advertir a los conductores que vienen detrás de
    usted cuando disminuye la velocidad, debe presionar rápidamente los frenos varias
    veces.
- id: 247
  category: sharing_the_road
  question: En calles de un solo sentido en áreas urbanas, ¿dónde se les permite circular
    a los ciclistas?
  choices:
    A: Solo en la acera
    B: Solo en el carril del extremo derecho
    C: En el carril del extremo izquierdo
    D: No se permiten bicicletas en calles de un solo sentido
  answer: C
  explanation: Según el manual, en calles de un solo sentido en áreas urbanas, los
    ciclistas pueden circular por el carril del extremo izquierdo.
- id: 248
  category: sharing_the_road
  question: ¿Qué debe hacer si se aproxima a un vehículo que se ha detenido para ceder
    el paso a un peatón en un paso de cebra?
  choices:
    A: Tocar la bocina para alertar al peatón y avanzar con cuidado
    B: Rebasar al vehículo por la derecha
    C: Rebasar al vehículo por la izquierda
    D: No rebasar al vehículo detenido
  answer: D
  explanation: No rebase a un vehículo que se haya detenido para ceder el paso a un
    peatón. El vehículo detenido puede bloquear la vista del peatón en la calle.
- id: 249
  category: sharing_the_road
  question: ¿Cómo debe reaccionar un conductor ante una persona ciega o con discapacidad
    visual que utiliza un bastón blanco o un perro guía?
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Detenerse y permanecer detenido hasta que la persona haya despejado la calzada
    C: Ceder el paso solo si se encuentran en un paso de cebra marcado
    D: Maniobrar para rodearlos lentamente
  answer: B
  explanation: Siempre ceda el paso a una persona ciega o con discapacidad visual
    (que esté usando un bastón blanco o un perro guía) deteniéndose y permaneciendo
    detenido hasta que la persona haya despejado la calzada.
- id: 250
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento requerida respecto a los equipos
    de remoción de nieve o vehículos de mantenimiento que trabajan en las calzadas,
    excepto para rebasar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Los conductores deben mantener una distancia de seguimiento de 100
    pies respecto a los equipos de remoción de nieve u otros vehículos de mantenimiento
    mientras trabajan en las calzadas, excepto para rebasar.
- id: 251
  category: safe_driving_rules
  question: 'Al encontrarse o rebasar un autobús escolar que ha activado sus luces
    de advertencia ámbar superiores, usted debe:'
  choices:
    A: Detenerse inmediatamente
    B: Acelerar para pasar antes de que las luces rojas parpadeen
    C: Reducir la velocidad a 25 MPH y prepararse para detenerse
    D: Mantener su velocidad pero cambiarse al carril izquierdo
  answer: C
  explanation: Al encontrarse o rebasar un autobús que ha activado sus luces de advertencia
    ámbar, debe reducir la velocidad a 25 MPH y prepararse para detenerse.
- id: 252
  category: safe_driving_rules
  question: ¿En qué situación NO se requiere que usted se detenga ante un autobús
    escolar que tiene sus luces de parada encendidas y el brazo de parada extendido?
  choices:
    A: Cuando llega tarde a una emergencia
    B: Al acercarse en la dirección opuesta en una calzada dividida por una mediana
    C: Cuando el autobús está detenido en una intersección con luz verde
    D: Cuando viaja por el carril derecho de una carretera de cuatro carriles no dividida
  answer: B
  explanation: No detenerse al acercarse o rebasar un autobús escolar que tiene las
    luces de parada encendidas y el brazo de parada extendido es ilegal. La única
    excepción ocurre cuando se aproxima a un autobús escolar en la dirección opuesta
    en una calzada dividida por una mediana.
- id: 253
  category: vehicle_information
  question: ¿Cuánta distancia requiere un camión cargado con buenos neumáticos y frenos
    debidamente ajustados que viaja a 55 MPH en una calzada despejada y seca para
    detenerse por completo?
  choices:
    A: 150 pies
    B: 240 pies
    C: 340 pies
    D: 440 pies
  answer: C
  explanation: Un camión cargado con buenos neumáticos y frenos debidamente ajustados,
    que viaja a 55 MPH en una calzada despejada y seca, requiere un mínimo de 340
    pies para detenerse por completo.
- id: 254
  category: defensive_driving
  question: Al rebasar un camión grande o un autobús, ¿cuándo es seguro volver a incorporarse
    delante del vehículo?
  choices:
    A: Tan pronto como pase el parachoques delantero
    B: Cuando pueda ver al conductor en su espejo lateral
    C: Cuando se pueda ver toda la parte delantera del camión o autobús en su espejo
      retrovisor
    D: Después de haber mantenido su velocidad de rebase durante 5 segundos
  answer: C
  explanation: Uno de los mayores errores que se cometen es incorporarse demasiado
    pronto al rebasar. No se coloque delante del camión o autobús a menos que se pueda
    ver toda la parte delantera del camión o autobús en el espejo retrovisor.
- id: 255
  category: defensive_driving
  question: ¿Por qué debería evitar conducir en el carril derecho al subir o bajar
    colinas empinadas?
  choices:
    A: Para permitir el paso de vehículos de emergencia
    B: Porque el carril derecho está reservado solo para automóviles de pasajeros
    C: Para reducir la posibilidad de chocar por detrás o ser chocado por detrás por
      un vehículo grande que se mueve lentamente
    D: Porque los vehículos grandes están obligados a conducir en el carril izquierdo
      en colinas empinadas
  answer: C
  explanation: Al viajar por pendientes pronunciadas, los vehículos más grandes suelen
    conducir más despacio y utilizar el carril derecho. Al evitar el carril derecho
    en estas zonas, reducirá la posibilidad de chocar por detrás o ser chocado por
    detrás por un vehículo grande.
- id: 256
  category: driver_responsibility
  question: Si se ve involucrado en un choque y golpea un vehículo desatendido, ¿qué
    debe hacer?
  choices:
    A: Esperar 15 minutos e irse si no aparece nadie
    B: Abandonar la escena inmediatamente si no hay daños visibles
    C: Contactar a las autoridades competentes y dejar información por escrito donde
      el propietario pueda encontrarla
    D: Informarlo únicamente a su compañía de seguros
  answer: C
  explanation: Si golpea un vehículo desatendido, comuníquese con las autoridades
    competentes y proporcione información por escrito (nombre, dirección, teléfono,
    placa, etc.) donde el propietario pueda encontrarla.
- id: 257
  category: driver_responsibility
  question: ¿En cuántos días debe enviar un Informe de Choque de Vehículo Motorizado
    del Conductor al Departamento de Transporte si el choque cumple con los criterios
    de informe y no fue investigado por las autoridades policiales?
  choices:
    A: 3 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Debe completar un Informe de Choque de Vehículo Motorizado del Conductor
    y enviarlo al Departamento de Transporte dentro de los diez (10) días si el choque
    cumple con los criterios y no fue investigado por un oficial de la ley.
- id: 258
  category: driver_responsibility
  question: ¿Cuál es el umbral mínimo de daños a la propiedad de una sola persona
    que requiere la presentación de un Informe de Choque de Vehículo Motorizado del
    Conductor?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: C
  explanation: Se debe enviar un informe si alguna persona resulta herida o muere,
    o si los daños a la propiedad de cualquier persona igualan o superan los $1,500.
- id: 259
  category: penalties_and_points
  question: ¿Cuál es la sanción por no informar un choque según lo exige la ley?
  choices:
    A: Una advertencia por la primera infracción
    B: Un delito menor de Clase II o III y posible revocación de la licencia
    C: Una sentencia de cárcel obligatoria de 30 días
    D: Una multa de exactamente $1,500
  answer: B
  explanation: No informar un choque según lo requerido es ilegal y las personas que
    infrinjan la norma serán culpables de un delito menor de Clase II o III y se les
    podrá revocar su licencia o privilegio de conducir.
- id: 260
  category: sharing_the_road
  question: ¿Qué debe hacer un automovilista cuando se prepara para girar a la derecha
    y hay tráfico de bicicletas viajando en la misma dirección?
  choices:
    A: Acelerar para rebasar al ciclista antes de girar
    B: Tocar la bocina para advertir al ciclista que se detenga
    C: Girar directamente cruzando la trayectoria del ciclista
    D: Incorporarse al tráfico de bicicletas y evitar girar directamente a través
      de su trayectoria
  answer: D
  explanation: Los automovilistas deben incorporarse al tráfico de bicicletas cuando
    se preparen para girar a la derecha. Evite girar directamente a través de la trayectoria
    de las bicicletas que viajan en la misma dirección.
- id: 261
  category: driver_responsibility
  question: ¿Qué formulario debe utilizarse para enviar un informe de accidente al
    estado?
  choices:
    A: Formulario 10 del DMV
    B: Formulario de Seguridad 99
    C: Formulario 41 del NDOT
    D: Formulario de Tráfico 1040
  answer: C
  explanation: El manual establece que el informe de accidente debe presentarse en
    el Formulario 41 del NDOT, el cual está disponible a través de las autoridades
    policiales estatales y locales.
- id: 262
  category: driver_testing
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la Oficina
    de Licencias de Conducir North Express en Omaha?
  choices:
    A: Está abierta los fines de semana.
    B: Solo atiende a conductores comerciales.
    C: Es la única ubicación en el condado de Douglas.
    D: No se realizan exámenes de manejo allí.
  answer: D
  explanation: El manual señala específicamente, bajo la Oficina de Licencias de Conducir
    North Express en Omaha, que "no se realizan exámenes de manejo".
- id: 263
  category: alcohol_drugs_health
  question: ¿A qué nivel de concentración de alcohol en sangre (BAC) comienza a aumentar
    notablemente el riesgo de sufrir un accidente?
  choices:
    A: Entre .01% y .02%
    B: Entre .04% y .05%
    C: Exactamente .08%
    D: Por encima de .10%
  answer: B
  explanation: El manual establece que el riesgo de sufrir un accidente comienza a
    aumentar notablemente entre .04% y .05% de BAC, y aumenta rápidamente a partir
    de ese punto.
- id: 264
  category: safe_driving_rules
  question: Según la ley de Nebraska, ¿quién está obligado a usar correctamente el
    cinturón de seguridad?
  choices:
    A: Solo el conductor
    B: El conductor y todos los pasajeros del asiento delantero
    C: Solo los pasajeros menores de 18 años
    D: Solo los pasajeros en los asientos traseros
  answer: B
  explanation: La ley de Nebraska exige que el conductor y todos los pasajeros del
    asiento delantero usen correctamente los cinturones de seguridad.
- id: 265
  category: safe_driving_rules
  question: ¿Hasta qué edad deben los niños viajar correctamente asegurados en un
    sistema de retención infantil aprobado por el gobierno federal?
  choices:
    A: Cuatro años
    B: Seis años
    C: Ocho años
    D: Diez años
  answer: C
  explanation: El manual establece que los niños hasta los ocho años deben viajar
    correctamente asegurados en un sistema de retención infantil aprobado por el gobierno
    federal.
- id: 266
  category: vehicle_information
  question: Incluso en un accidente a baja velocidad, ¿el despliegue de una bolsa
    de aire puede representar un riesgo de lesiones para cuál de los siguientes grupos?
  choices:
    A: Adultos de más de 6 pies de altura
    B: Niños de 12 años o menos
    C: Adolescentes entre 13 y 17 años
    D: Cualquier persona sentada en el asiento trasero
  answer: B
  explanation: Es posible que cuando se despliega una bolsa de aire, incluso en un
    accidente a baja velocidad, pueda representar algún riesgo de lesiones para niños
    de 12 años o menos, conductores y pasajeros de edad avanzada y adultos de baja
    estatura de 5 pies o menos.
- id: 267
  category: vehicle_information
  question: ¿Dónde NUNCA debe colocar un asiento de seguridad para bebés orientado
    hacia atrás?
  choices:
    A: En el asiento trasero central
    B: En el asiento trasero del lado del pasajero
    C: En el asiento del pasajero delantero de un vehículo equipado con bolsas de
      aire
    D: En un vehículo sin bolsas de aire laterales
  answer: C
  explanation: El manual advierte explícitamente que nunca se debe usar un asiento
    de seguridad para bebés orientado hacia atrás en el asiento del pasajero delantero
    de un vehículo equipado con bolsas de aire.
- id: 268
  category: sharing_the_road
  question: ¿Qué debe hacer un automovilista con respecto al tráfico de bicicletas
    al prepararse para girar a la derecha?
  choices:
    A: Tocar la bocina para advertir al ciclista que se quite del camino
    B: Acelerar para rebasar al ciclista antes de girar
    C: Incorporarse al tráfico de bicicletas
    D: Detenerse y esperar a que todas las bicicletas despejen la calle
  answer: C
  explanation: Los automovilistas deben incorporarse al tráfico de bicicletas al prepararse
    para girar a la derecha.
- id: 269
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una práctica recomendada para los motociclistas?
  choices:
    A: Deben cambiar de posición constantemente dentro de un carril.
    B: No deben cambiar de posición constantemente dentro de un carril.
    C: Siempre deben circular por el acotamiento (hombro).
    D: Deben compartir un solo carril con un automóvil.
  answer: B
  explanation: El manual establece que los motociclistas no deben cambiar de posición
    constantemente dentro de un carril.
- id: 270
  category: signs_and_signals
  question: ¿Cuándo está permitido girar a la derecha en un semáforo con luz roja
    circular?
  choices:
    A: En cualquier momento, sin detenerse
    B: Solo si también está iluminada una flecha verde
    C: Después de detenerse, a menos que haya señales que lo prohíban
    D: Nunca está permitido en Nebraska
  answer: C
  explanation: Se permite girar a la derecha en un semáforo con luz roja circular
    después de detenerse, a menos que haya señales que lo prohíban en la intersección.
- id: 271
  category: safe_driving_rules
  question: ¿Cuál es la señal manual correcta para dar vuelta a la izquierda?
  choices:
    A: Brazo izquierdo apuntando hacia abajo
    B: Brazo izquierdo apuntando hacia arriba
    C: Brazo derecho extendido hacia afuera
    D: Brazo izquierdo hacia afuera y totalmente extendido
  answer: D
  explanation: La señal manual correcta para dar vuelta a la izquierda es el brazo
    izquierdo hacia afuera y totalmente extendido.
- id: 272
  category: safe_driving_rules
  question: ¿Cuándo es obligatorio usar los faros delanteros?
  choices:
    A: De 8:00 PM a 6:00 AM
    B: Desde el atardecer hasta el amanecer
    C: Solo cuando no pueda ver a 500 pies de distancia
    D: Desde una hora después del atardecer hasta una hora antes del amanecer
  answer: B
  explanation: El manual establece que los faros delanteros deben usarse desde el
    atardecer hasta el amanecer.
- id: 273
  category: safe_driving_rules
  question: ¿Cuándo es legal cruzar líneas amarillas dobles?
  choices:
    A: Solo al dar vuelta a la izquierda o para evitar una obstrucción.
    B: Al rebasar a un vehículo que circula despacio.
    C: Al viajar en una calle de un solo sentido.
    D: Nunca es legal cruzar líneas amarillas dobles.
  answer: A
  explanation: Según el manual, dar vuelta a la izquierda o evitar una obstrucción
    son los únicos cruces legales permitidos sobre líneas amarillas dobles.
- id: 274
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso si un peatón está en un cruce peatonal
    y el conductor tiene el semáforo en verde?
  choices:
    A: El conductor, porque tiene la luz verde.
    B: El peatón.
    C: Quien haya entrado primero a la intersección.
    D: El conductor, pero debe tocar la bocina.
  answer: B
  explanation: El manual establece que los peatones tienen el derecho de paso cuando
    están en los cruces peatonales, incluso si el conductor tiene la luz verde.
- id: 275
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas en la calzada?
  choices:
    A: Separan carriles de tráfico que van en direcciones opuestas.
    B: Separan carriles de tráfico que van en la misma dirección.
    C: Indican una zona de no rebasar.
    D: Marcan el centro de una carretera de doble sentido.
  answer: B
  explanation: Las líneas blancas separan los carriles de tráfico que circulan en
    la misma dirección.
- id: 276
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿se le permite exceder el límite de velocidad
    establecido?
  choices:
    A: Sí, hasta por 5 mph.
    B: Sí, pero solo en autopistas.
    C: No, es ilegal exceder el límite de velocidad establecido al rebasar.
    D: Sí, si el vehículo que se está rebasando circula por debajo del límite de velocidad.
  answer: C
  explanation: Es ilegal exceder el límite de velocidad establecido al rebasar.
- id: 277
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento recomendada entre su vehículo y el
    automóvil que tiene delante?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Tres segundos
    D: Cinco segundos
  answer: C
  explanation: Debe dejar tres segundos entre su vehículo y el automóvil que tiene
    delante.
- id: 278
  category: signs_and_signals
  question: ¿Qué indican las señales de tráfico de color naranja?
  choices:
    A: Áreas recreativas
    B: Construcción
    C: Peligros próximos
    D: Áreas de descanso
  answer: B
  explanation: Las señales naranjas indican construcción.
- id: 279
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor al encontrarse con una señal de tránsito
    en forma de triángulo?
  choices:
    A: Detenerse
    B: Acelerar
    C: Ceder el paso
    D: Dar vuelta a la izquierda
  answer: C
  explanation: Una señal de tránsito en forma de triángulo requiere que el conductor
    ceda el paso.
- id: 280
  category: sharing_the_road
  question: ¿Qué debe hacer cuando escucha una sirena o ve las luces intermitentes
    de un vehículo de emergencia?
  choices:
    A: Orillarse hacia la acera y detenerse.
    B: Entrar en una intersección.
    C: Acelerar para quitarse del camino.
    D: Reducir la velocidad y continuar conduciendo.
  answer: A
  explanation: Cuando escuche una sirena o vea las luces intermitentes de un vehículo
    de emergencia, debe orillarse hacia la acera y detenerse.
- id: 281
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en zonas residenciales?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: El límite de velocidad en zonas residenciales es de 25 mph.
- id: 282
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener al estacionarse cerca de
    un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: No puede estacionarse a menos de 15 pies de un hidrante de incendios.
- id: 283
  category: safe_driving_rules
  question: ¿Qué carril debe utilizar el tráfico más lento al conducir en la interestatal?
  choices:
    A: El carril izquierdo
    B: El carril derecho
    C: El carril central
    D: Cualquier carril
  answer: B
  explanation: Al conducir en la interestatal, el tráfico más lento debe mantenerse
    a la derecha.
- id: 284
  category: defensive_driving
  question: ¿Qué luces delanteras debe utilizar al conducir con niebla?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Luces de emergencia
  answer: B
  explanation: Al conducir con niebla, se deben utilizar las luces bajas.
- id: 285
  category: safe_driving_rules
  question: Según el texto, ¿qué acción debe tomar un conductor al rebasar?
  choices:
    A: Acelerar para rebasar lo más rápido posible
    B: Tocar la bocina y mantener la velocidad actual
    C: Reducir la velocidad y mantener una velocidad segura
    D: Detenerse por completo antes de continuar
  answer: C
  explanation: El manual establece que al rebasar, debe "reducir la velocidad y mantener
    una velocidad segura".
- id: 286
  category: penalties_and_points
  question: 'Para infracciones posteriores de esta ley, las multas pueden alcanzar
    hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: El manual establece que "las infracciones posteriores pueden resultar
    en multas de hasta $500..."
- id: 287
  category: penalties_and_points
  question: ¿Cuál es el tiempo máximo de cárcel que un conductor puede recibir por
    una infracción posterior de esta ley?
  choices:
    A: Hasta 48 horas
    B: Hasta siete días
    C: Hasta 30 días
    D: Hasta seis meses
  answer: B
  explanation: El texto especifica que las infracciones posteriores pueden resultar
    en "hasta siete días de cárcel".
- id: 288
  category: penalties_and_points
  question: ¿Cuál de las siguientes opciones describe con precisión las posibles sanciones
    por una infracción posterior?
  choices:
    A: Solo una multa de hasta $100
    B: Multas de hasta $500 y/o hasta siete días de cárcel
    C: Suspensión obligatoria de la licencia por siete días
    D: Una multa de exactamente $500 y tiempo de cárcel obligatorio
  answer: B
  explanation: 'El manual establece explícitamente: "Las infracciones posteriores
    pueden resultar en multas de hasta $500 y/o hasta siete días de cárcel".'
- id: 289
  category: penalties_and_points
  question: Según el manual, ¿qué tipo de sanción se menciona explícitamente para
    una primera infracción?
  choices:
    A: Servicio comunitario
    B: Tiempo de cárcel
    C: Una multa
    D: Revocación de la licencia
  answer: C
  explanation: 'La única sanción enumerada para una primera infracción es una multa,
    ya que el texto indica: "Para una primera infracción, los conductores pueden ser
    multados con hasta $100".'
- id: 290
  category: safe_driving_rules
  question: 'Al rebasar, el manual establece que debe reducir la velocidad y mantener
    una:'
  choices:
    A: Velocidad segura
    B: Velocidad mínima de 15 mph
    C: Velocidad igual a la del vehículo que está rebasando
    D: Velocidad constante
  answer: A
  explanation: El texto instruye a los conductores a "reducir la velocidad y mantener
    una velocidad segura al rebasar".
- id: 291
  category: penalties_and_points
  question: ¿Cómo se compara la multa máxima por una infracción posterior con la de
    una primera infracción?
  choices:
    A: Es la misma
    B: Aumenta de hasta $100 a hasta $500
    C: Se duplica de $250 a $500
    D: Aumenta de $50 a $100
  answer: B
  explanation: La multa por una primera infracción es de hasta $100, mientras que
    las infracciones posteriores pueden resultar en multas de hasta $500.
- id: 292
  category: penalties_and_points
  question: Bajo esta ley específica, ¿cuándo se menciona el tiempo de cárcel como
    una posible sanción?
  choices:
    A: Solo para una primera infracción
    B: Para infracciones posteriores
    C: Solo si ocurren daños a la propiedad
    D: El tiempo de cárcel no es una sanción potencial
  answer: B
  explanation: 'El tiempo de cárcel solo se menciona para infracciones posteriores:
    "Las infracciones posteriores pueden resultar en... hasta siete días de cárcel".'
- id: 293
  category: penalties_and_points
  question: ¿Establece el texto proporcionado que un conductor puede ir a la cárcel
    por una primera infracción de esta ley?
  choices:
    A: Sí, por hasta siete días
    B: Sí, por hasta 48 horas
    C: No, solo se menciona una multa de hasta $100 para una primera infracción
    D: No, el tiempo de cárcel nunca está permitido para esta infracción
  answer: C
  explanation: El texto solo enumera una multa de hasta $100 para una primera infracción;
    el tiempo de cárcel se reserva para infracciones posteriores.
- id: 294
  category: penalties_and_points
  question: 'Por una infracción posterior, un juez puede imponer:'
  choices:
    A: Solo una multa, sin posibilidad de cárcel
    B: Solo tiempo de cárcel, sin posibilidad de multa
    C: Multas de hasta $500 y/o hasta siete días de cárcel
    D: Un mínimo obligatorio de siete días de cárcel
  answer: C
  explanation: El manual establece que las infracciones posteriores pueden resultar
    en "multas de hasta $500 y/o hasta siete días de cárcel".
- id: 295
  category: safe_driving_rules
  question: ¿Qué debe hacer con respecto a su velocidad al rebasar, según el texto?
  choices:
    A: Acelerar rápidamente
    B: Reducir la velocidad
    C: Mantener su velocidad original
    D: Detenerse por completo
  answer: B
  explanation: El texto indica explícitamente a los conductores "reducir la velocidad
    y mantener una velocidad segura al rebasar".
- id: 296
  category: penalties_and_points
  question: Si un conductor es sorprendido infringiendo esta ley por segunda vez,
    ¿cuál es la multa máxima que se le podría exigir pagar?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Una segunda infracción se considera una "infracción posterior", que
    puede resultar en multas de hasta $500.
- id: 297
  category: penalties_and_points
  question: Si un conductor comete una tercera infracción de esta ley, ¿cuál es el
    tiempo máximo de cárcel que podría enfrentar?
  choices:
    A: Ninguno
    B: Hasta siete días
    C: Hasta 14 días
    D: Hasta 30 días
  answer: B
  explanation: Una tercera infracción entra en la categoría de "infracciones posteriores",
    que conllevan una sanción de "hasta siete días de cárcel".
- id: 298
  category: penalties_and_points
  question: 'La sanción por una primera infracción de esta ley es una multa de:'
  choices:
    A: Exactamente $100
    B: Hasta $100
    C: Al menos $100
    D: Hasta $500
  answer: B
  explanation: El manual especifica que para una primera infracción, los conductores
    pueden ser multados con "hasta $100", no una tarifa fija o mínima.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 299
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 300
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRE (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se encuentra en las rampas de salida de las autopistas o en calles de un solo
    sentido donde entrar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 301
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 302
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: El tráfico fluye en una sola dirección — hacia la izquierda
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección — la dirección
    que señala la flecha.
  id: 303
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 304
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 305
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 306
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 307
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 308
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 309
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta área
    C: Área de caza adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan la carretera con frecuencia en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 310
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de rombo con una figura de peatón advierte
    sobre un cruce de peatones más adelante. Esté preparado para detenerse ante los
    peatones que crucen la vía.
  id: 311
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal pentagonal (de 5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 312
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 313
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los pasos a nivel. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 314
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de rombo?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de rombo con una flecha curva advierte
    sobre una curva en el camino más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 315
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 316
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la vía advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y esté preparado para que el camino
    gire primero en un sentido y luego en el otro.
  id: 317
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte sobre una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la vía.
  id: 318
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra vía
    C: Inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de rombo de incorporación (merge) advierte
    que el tráfico de otra vía se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 319
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción del ancho de la vía y ajuste su
    posición en el carril.
  id: 320
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en direcciones
    opuestas. Manténgase a la derecha.
  id: 321
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción vial más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Esté preparado para
    el tráfico de doble sentido.
  id: 322
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de un solo sentido o de una autopista dividida y
    se encuentre con vehículos que viajan en la dirección opuesta.
  id: 323
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 324
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción vial
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 325
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  id: 326
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 327
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 328
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una calle lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la carretera desde la calle lateral.
  id: 329
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 330
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse momentáneamente o dejar el motor en marcha
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 331
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 332
