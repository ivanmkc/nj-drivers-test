- id: 66
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma aceptable de prueba de responsabilidad
    financiera (seguro) cuando lo solicita un oficial de la ley de Nebraska?
  choices:
    A: Únicamente una tarjeta de seguro original en papel
