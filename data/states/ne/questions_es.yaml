    D: Una carta firmada por un empleador
  answer: B
  explanation: La ley de Nebraska permite a los conductores proporcionar una prueba
    de seguro ya sea en formato impreso (papel) o en formato electrónico en un dispositivo
    móvil.
- id: 67
  category: driver_responsibility
  question: En Nebraska, ¿cuántos puntos se asignan por 'No ceder el paso a un peatón'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: No ceder el paso a un peatón resulta en la asignación de 2 puntos en
