- id: 89
  category: safe_driving_rules
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección sin señales
    de tráfico, ¿qué conductor tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja a mayor velocidad
    D: El conductor que circula por la vía más principal
  answer: B
  explanation: En Nebraska, cuando dos vehículos llegan al mismo tiempo a una intersección
    no controlada, el conductor de la izquierda debe ceder el paso al conductor de
    la derecha.
- id: 90
  category: safe_driving_rules
  question: En Nebraska, ¿es ilegal rebasar a otro vehículo a menos de cuántos pies
    de una intersección o un cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Según el Manual del Conductor de Nebraska, no debe rebasar a menos
    de 100 pies de una intersección o un cruce de ferrocarril.
- id: 91
  category: safe_driving_rules
  question: ¿En Nebraska, cuál es el límite de velocidad predeterminado en un distrito
    comercial?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El límite de velocidad de Nebraska en un distrito comercial es de 20
    mph, a menos que se indique lo contrario.
- id: 92
  category: safe_driving_rules
  question: 'El Manual del Conductor de Nebraska recomienda seguir al vehículo que
    tiene delante con un intervalo de tiempo mínimo de:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: Nebraska recomienda usar la 'regla de los tres segundos' para mantener
    una distancia de seguimiento segura en condiciones normales.
- id: 93
  category: safe_driving_rules
  question: ¿Qué exige la 'Ley de Moverse a un Lado' (Move Over Law) de Nebraska que
    hagan los conductores al acercarse a un vehículo de emergencia estacionado con
    luces intermitentes?
  choices:
    A: Detenerse inmediatamente en el carril
    B: Mantener la velocidad pero tocar la bocina
    C: Moverse a un carril que no esté adyacente al vehículo, o reducir la velocidad
      si el cambio de carril no es seguro
    D: Acelerar para rebasar el vehículo rápidamente
  answer: C
  explanation: La Ley de Moverse a un Lado exige que los conductores se muevan a un
    carril que no sea adyacente al vehículo de emergencia en autopistas de carriles
    múltiples, o que reduzcan la velocidad y mantengan una velocidad segura si no
    es posible cambiar de carril.
- id: 94
  category: defensive_driving
  question: Para mantener una trayectoria de viaje segura en Nebraska, ¿con cuánta
    antelación debe un conductor observar la carretera en busca de posibles peligros?
  choices:
    A: 5 segundos
    B: 8 segundos
    C: 12 segundos
    D: 20 segundos
  answer: C
  explanation: El Manual del Conductor de Nebraska establece que los conductores deben
    mirar al menos 12 segundos hacia adelante para identificar posibles problemas
    y tener suficiente tiempo para reaccionar.
- id: 95
  category: defensive_driving
  question: ¿En Nebraska, a qué velocidad puede comenzar a ocurrir el hidroplaneo
    (cuando los neumáticos pierden contacto con la carretera en una superficie mojada)?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    A 55 mph, los neumáticos pueden perder todo contacto con la superficie de la carretera
    si está cubierta de agua.
- id: 96
  category: defensive_driving
  question: Al conducir con niebla densa, nieve o lluvia en Nebraska, ¿qué ajuste
    de los faros delanteros debe usar para garantizar la mejor visibilidad?
  choices:
    A: Luces altas (High beams)
    B: Luces bajas (Low beams)
    C: Solo luces de estacionamiento
    D: No se requieren luces durante el día
  answer: B
  explanation: Se deben usar las luces bajas en condiciones de niebla, nieve o lluvia.
    Las luces altas se reflejan en la humedad del aire, lo que provoca deslumbramiento
    y dificulta la visión.
- id: 97
  category: defensive_driving
  question: Si su vehículo está equipado con frenos antibloqueo (ABS) y necesita detenerse
    rápidamente en una carretera resbaladiza de Nebraska, ¿cómo debe aplicar los frenos?
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante sin soltar
    C: Tocar ligeramente los frenos para evitar el bloqueo
    D: Cambiar a punto muerto (neutral) y usar el freno de emergencia
  answer: B
  explanation: Para vehículos con ABS, el conductor debe aplicar una presión firme
    y constante. Bombear los frenos es solo para vehículos más antiguos sin ABS.
- id: 98
  category: defensive_driving
  question: La ley de 'Moverse a un Lado' de Nebraska exige que los conductores se
    muevan a un carril que no sea adyacente a un vehículo de emergencia detenido.
    Si no puede moverse de carril de manera segura, ¿qué debe hacer?
  choices:
    A: Mantener la velocidad y permanecer en su carril
    B: Detenerse por completo en el carril de circulación
    C: Reducir la velocidad y estar preparado para detenerse
    D: Tocar la bocina para advertir a los trabajadores de emergencia
  answer: C
  explanation: Si un conductor no puede moverse de manera segura a un carril no adyacente,
    debe reducir la velocidad y estar preparado para detenerse al pasar el vehículo
    de emergencia.
- id: 99
  category: defensive_driving
  question: Al cambiar de carril en Nebraska, ¿cuál es el procedimiento correcto de
    conducción defensiva para revisar sus puntos ciegos?
  choices:
    A: Revisar solo el espejo retrovisor
    B: Revisar solo los espejos laterales
    C: Girar la cabeza y mirar por encima del hombro en la dirección en la que planea
      moverse
    D: Confiar en el sistema de monitoreo de puntos ciegos de su vehículo
  answer: C
  explanation: Los espejos no lo muestran todo. Para revisar los puntos ciegos, debe
    girar la cabeza y mirar por encima del hombro antes de cambiar de carril.
- id: 100
  category: defensive_driving
  question: En Nebraska, usted se acerca a un autobús escolar con luces rojas intermitentes
    y un brazo de parada extendido en una carretera de cuatro carriles separada por
    una mediana. ¿Cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Todos los carriles en ambas direcciones deben detenerse
    B: Solo el tráfico que sigue al autobús debe detenerse
    C: El tráfico en la dirección opuesta no necesita detenerse
    D: El tráfico en la dirección opuesta debe reducir la velocidad a 15 mph
  answer: C
  explanation: En Nebraska, si una carretera está dividida por una mediana o una barrera
    física, el tráfico que circula en la dirección opuesta a un autobús escolar detenido
    no está obligado a detenerse.
- id: 101
  category: defensive_driving
  question: 'En Nebraska, es ilegal seguir a un aparato de bomberos (camión de bomberos)
    que viaja en respuesta a una alarma de incendio a una distancia menor de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Nebraska prohíbe seguir a un camión de bomberos que responde
    a una alarma a una distancia menor de 500 pies.
- id: 102
  category: defensive_driving
  question: ¿En Nebraska, debe encender sus faros delanteros si no puede ver claramente
    por al menos cuántos pies?
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Nebraska exige que los faros delanteros estén encendidos
    desde el atardecer hasta el amanecer y en cualquier momento en que la visibilidad
    sea inferior a 500 pies.
- id: 103
  category: defensive_driving
  question: Al conducir con niebla densa en Nebraska, ¿qué ajuste de faros delanteros
    debe utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: No se requieren luces durante el día
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en la humedad del aire, lo que provoca deslumbramiento y dificulta la
    visión.
- id: 104
  category: defensive_driving
  question: Durante los inviernos de Nebraska, ¿cuál de las siguientes superficies
    de la carretera es probable que se congele primero y permanezca helada por más
    tiempo?
  choices:
    A: Autopistas interestatales
    B: Caminos de grava
    C: Puentes y pasos elevados
    D: Calles de la ciudad de asfalto
  answer: C
  explanation: Los puentes y pasos elevados se congelan antes que otras superficies
    de la carretera porque el aire frío circula tanto por encima como por debajo de
    la estructura.
- id: 105
  category: defensive_driving
  question: Al acercarse a una intersección en Nebraska, ¿en qué orden debe observar
    el tráfico?
  choices:
    A: Derecha, izquierda, derecha
    B: Izquierda, derecha, izquierda
    C: Solo hacia adelante
    D: Revisar solo los espejos
  answer: B
  explanation: El manual de Nebraska aconseja observar a la izquierda, luego a la
    derecha y después a la izquierda de nuevo, ya que el primer peligro proviene de
    la izquierda.
- id: 106
  category: defensive_driving
  question: Para revisar su "punto ciego" antes de cambiar de carril en Nebraska,
    ¿qué debe hacer?
  choices:
    A: Revisar su espejo retrovisor
    B: Revisar su espejo lateral
    C: Girar la cabeza y mirar por encima del hombro
    D: Tocar la bocina para alertar a los demás
  answer: C
  explanation: Los espejos no lo muestran todo; debe girar la cabeza y mirar por encima
    del hombro en la dirección en la que planea moverse para revisar los puntos ciegos.
- id: 107
  category: defensive_driving
  question: Al conducir por carreteras de Nebraska que están resbaladizas por la lluvia,
    la nieve o el hielo, ¿cómo debe ajustar su distancia de seguimiento?
  choices:
    A: Mantenerla en tres segundos
    B: Disminuirla a un segundo para mantenerse en las huellas
    C: Aumentarla a al menos cuatro segundos o más
    D: La distancia de seguimiento no importa en la nieve
  answer: C
  explanation: En condiciones adversas como lluvia o nieve, debe aumentar su distancia
    de seguimiento para disponer de más tiempo y espacio para detenerse.
- id: 108
  category: defensive_driving
  question: ¿Qué significa "conducir más allá del alcance de los faros" (overdriving
    your headlights) al conducir de noche en Nebraska?
  choices:
    A: Conducir con las luces altas encendidas en la ciudad
    B: Conducir tan rápido que su distancia de frenado es mayor de lo que puede ver
      con sus luces
    C: Usar luces antiniebla y luces altas al mismo tiempo
    D: Conducir con los faros delanteros rotos
  answer: B
  explanation: Conducir más allá del alcance de los faros ocurre cuando la distancia
    de frenado de su vehículo excede la distancia iluminada por sus faros, lo cual
    es una práctica peligrosa por la noche.
- id: 109
  category: alcohol_drugs_health
  question: 'Bajo la ley de "Consentimiento Implícito" (Implied Consent) de Nebraska,
    al conducir un vehículo motorizado, usted ha dado su consentimiento para:'
  choices:
    A: Un registro de su vehículo en busca de sustancias ilegales
    B: Una prueba química de su sangre, aliento u orina para detectar alcohol o drogas
    C: Una evaluación psicológica por un médico designado por el estado
    D: Permitir que un pasajero tenga un recipiente abierto de alcohol
  answer: B
  explanation: La ley de Consentimiento Implícito de Nebraska significa que se considera
    que cualquier persona que opera un vehículo motorizado en el estado ha dado su
    consentimiento para una prueba química de su sangre, aliento u orina para determinar
    el contenido de alcohol o drogas.
- id: 110
  category: alcohol_drugs_health
  question: ¿Cuál es el período obligatorio de revocación de la licencia de conducir
    por una condena de DUI (conducir bajo la influencia) por primera vez en Nebraska?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Una condena por DUI por primera vez en Nebraska resulta en una revocación
    obligatoria de 6 meses de la licencia de conducir.
- id: 111
  category: alcohol_drugs_health
  question: 'Si un conductor de Nebraska es condenado por un DUI con un BAC (concentración
    de alcohol en sangre) de 0.15% o superior, la infracción está sujeta a:'
  choices:
    A: Las mismas sanciones que un DUI estándar
    B: Sanciones agravadas y un período de revocación más largo
    C: Una simple advertencia por la primera infracción
    D: Únicamente servicio comunitario obligatorio
  answer: B
  explanation: La ley de Nebraska impone sanciones significativamente más severas
    para las infracciones de 'BAC alto', que se definen como tener un BAC de 0.15%
    o superior.
- id: 112
  category: alcohol_drugs_health
  question: En Nebraska, ¿cuál es la multa máxima por una condena de DUI por primera
    vez (excluyendo los costos judiciales)?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,500
  answer: B
  explanation: Un DUI por primera vez en Nebraska es un delito menor de Clase W, que
    conlleva una multa máxima de $500.
- id: 113
  category: alcohol_drugs_health
  question: 'Negarse a someterse a una prueba química de alcohol en sangre en Nebraska
    resulta en:'
  choices:
    A: Solo una multa de $50
    B: Ninguna sanción si es la primera vez que lo detienen
    C: Las mismas o similares sanciones que una condena por DUI, incluyendo la revocación
      de la licencia
    D: Una estancia obligatoria de 24 horas en la cárcel, pero sin suspensión de la
      licencia
  answer: C
  explanation: Negarse a una prueba química es un delito separado en Nebraska y conlleva
    sanciones similares a un DUI, incluyendo la Revocación Administrativa de la Licencia
    (ALR).
- id: 114
  category: alcohol_drugs_health
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) para los
    conductores que operan un Vehículo Motorizado Comercial (CMV) en Nebraska?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Los conductores comerciales están sujetos a un estándar más estricto;
    es ilegal operar un CMV en Nebraska con un BAC de 0.04% o superior.
- id: 115
  category: alcohol_drugs_health
  question: 'La ''Ley de Contenedor Abierto'' de Nebraska hace que sea ilegal:'
  choices:
    A: Poseer un recipiente de bebida alcohólica abierto en el área de pasajeros de
      un vehículo en una carretera
    B: Transportar un paquete de seis cervezas sin abrir en el asiento delantero
    C: Beber agua mientras se conduce un vehículo motorizado
    D: Tener una lata de refresco vacía en el piso del vehículo
  answer: A
  explanation: En Nebraska es ilegal que cualquier persona en el área de pasajeros
    de un vehículo motorizado en una carretera pública posea un recipiente de bebida
    alcohólica abierto.
- id: 116
  category: alcohol_drugs_health
  question: Si se le condena por un DUI en Nebraska y se le concede la libertad condicional
    (probation), ¿cuál es el tiempo mínimo de cárcel requerido para una primera infracción?
  choices:
    A: 0 días
    B: 7 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: Si se concede la libertad condicional por un DUI por primera vez en
    Nebraska, no hay un tiempo mínimo obligatorio de cárcel, aunque se aplican otras
    condiciones como una multa y la revocación de la licencia.
- id: 117
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su concentración de alcohol
    en sangre (BAC) después de beber?
  choices:
    A: Beber café negro
    B: Tomar una ducha fría
    C: Hacer ejercicio o correr
    D: Permitir que pase el tiempo para que su cuerpo procese el alcohol
  answer: D
  explanation: Solo el tiempo puede reducir el BAC. El cuerpo procesa el alcohol a
    un ritmo constante, y el café, las duchas o el ejercicio no aceleran este proceso.
- id: 118
  category: alcohol_drugs_health
  question: 'En Nebraska, un Permiso de Dispositivo de Bloqueo de Encendido (IIP)
    permite que una persona cuya licencia ha sido revocada por DUI pueda:'
  choices:
    A: Conducir cualquier vehículo en cualquier momento sin restricciones
    B: Conducir solo hacia y desde el trabajo o la escuela
    C: Conducir un vehículo equipado con un dispositivo de bloqueo de encendido
    D: Conducir solo durante las horas del día
  answer: C
  explanation: Un IIP permite a un conductor con la licencia revocada operar un vehículo
    equipado con un dispositivo que mide el alcohol en el aliento antes de que el
    motor arranque.
- id: 119
  category: alcohol_drugs_health
  question: ¿Qué sucede con su licencia de conducir de Nebraska de inmediato si no
    pasa o se niega a una prueba química cuando lo solicita un oficial?
  choices:
    A: No sucede nada hasta que vaya a la corte
    B: El oficial emitirá un permiso temporal de 15 días y luego su licencia será
      revocada (ALR)
    C: Su licencia se cancela permanentemente en el acto
    D: Se le requiere pagar una fianza de $1,000 para conservar su licencia
  answer: B
  explanation: Bajo la Revocación Administrativa de la Licencia (ALR), el oficial
    tomará su licencia y emitirá un permiso temporal de 15 días. A menos que se solicite
    una audiencia, la revocación comienza después de esos 15 días.
- id: 120
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los medicamentos
    recetados y la conducción en Nebraska?
  choices:
    A: No puede ser arrestado por DUI si el medicamento fue recetado legalmente
    B: Los medicamentos recetados nunca afectan la capacidad de conducción
    C: Puede ser arrestado por DUI si un medicamento recetado afecta su capacidad
      para conducir de manera segura
    D: Solo las drogas ilegales 'callejeras' están cubiertas por las leyes de DUI
      de Nebraska
  answer: C
  explanation: Las leyes de DUI de Nebraska se aplican a cualquier droga que afecte
    la capacidad de un conductor para operar un vehículo de manera segura, incluidos
    los medicamentos recetados legales y los de venta libre.
- id: 121
  category: alcohol_drugs_health
  question: 'Combinar alcohol con otra droga, como un sedante o un antihistamínico,
    generalmente resulta en:'
  choices:
    A: Que los efectos del alcohol se cancelen
    B: Un efecto sinérgico, donde el deterioro es mucho mayor que con cualquiera de
      las sustancias por sí sola
    C: Mayor estado de alerta y mejores tiempos de reacción
    D: Ningún cambio en el nivel de deterioro
  answer: B
  explanation: Mezclar alcohol y drogas puede multiplicar los efectos de ambos, lo
    que provoca un deterioro grave incluso si se consumen pequeñas cantidades de cada
    uno.
- id: 122
  category: alcohol_drugs_health
  question: ¿Cuántos puntos se asignan al historial de conducción de Nebraska por
    una condena por DUI?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Una condena por Operar Bajo la Influencia de Alcohol o Drogas (DUI)
    en Nebraska resulta en la asignación de 6 puntos al historial del conductor.
- id: 123
  category: alcohol_drugs_health
  question: En Nebraska, ¿cuál es el límite legal de concentración de alcohol en sangre
    (BAC) para un conductor mayor de 21 años?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Según el Manual del Conductor de Nebraska, es ilegal que cualquier
    persona opere o tenga el control físico real de un vehículo motorizado con un
    BAC de 0.08% o más.
- id: 124
  category: alcohol_drugs_health
  question: 'Bajo la Ley de Consentimiento Implícito (Implied Consent Law) de Nebraska,
    si usted se niega a someterse a una prueba química de sangre, aliento u orina
    cuando lo solicita un oficial, su licencia será revocada por:'
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: Según la ley de Nebraska, la negativa a someterse a una prueba química
    bajo la Ley de Consentimiento Implícito resulta en una revocación administrativa
    de la licencia por un año.
- id: 125
  category: alcohol_drugs_health
  question: En Nebraska, es ilegal poseer un recipiente abierto de alcohol en el área
    de pasajeros de un vehículo motorizado. ¿Dónde es legal guardar un recipiente
    abierto?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: En el maletero
    D: En un portavasos si tiene tapa
  answer: C
  explanation: La ley de recipientes abiertos de Nebraska prohíbe las bebidas alcohólicas
    abiertas en el área de pasajeros. Deben mantenerse en el maletero o en un área
    que no sea ocupada normalmente por el conductor o los pasajeros si el vehículo
    no tiene maletero.
- id: 126
  category: alcohol_drugs_health
  question: Si un conductor de Nebraska es arrestado por DUI y una prueba química
    indica un BAC de 0.08% o superior, ¿cuánto tiempo dura la Revocación Administrativa
    de la Licencia (ALR) por una primera infracción?
  choices:
    A: 30 días
    B: 60 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Por no pasar una prueba química por primera vez (0.08% o superior),
    el DMV de Nebraska revocará administrativamente la licencia del conductor por
    180 días.
- id: 127
  category: alcohol_drugs_health
  question: Si usted toma un medicamento recetado y este afecta su capacidad para
    conducir, ¿puede ser acusado de DUI en Nebraska?
  choices:
    A: No, siempre que el medicamento haya sido recetado legalmente
    B: No, el DUI solo se aplica al alcohol y narcóticos ilegales
    C: Sí, si el medicamento lo incapacita para operar un vehículo motorizado de manera
      segura
    D: Sí, pero solo si también tiene alcohol en su sistema
  answer: C
  explanation: La ley de Nebraska establece que es ilegal conducir bajo la influencia
    de cualquier droga, incluidos los medicamentos recetados o de venta libre, si
    estos afectan su capacidad para conducir de manera segura.
- id: 128
  category: alcohol_drugs_health
  question: Según los estándares médicos de Nebraska para vehículos de pasajeros,
    ¿cuánto tiempo debe estar libre de convulsiones una persona con antecedentes de
    convulsiones antes de que se pueda considerar otorgarle una licencia?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Nebraska generalmente requiere que una persona con un trastorno convulsivo
    esté libre de convulsiones por un período de seis meses antes de ser elegible
    para obtener una licencia de conducir.
- id: 129
  category: alcohol_drugs_health
  question: Un infractor de DUI por primera vez en Nebraska puede ser elegible para
    un Permiso de Dispositivo de Bloqueo de Encendido (IIP). ¿Qué permite este permiso?
  choices:
    A: Conducir solo durante las horas del día
    B: Conducir únicamente hacia y desde el trabajo o la escuela
    C: Conducir a cualquier lugar en cualquier momento, siempre que el vehículo tenga
      un dispositivo de bloqueo
    D: Conducir solo con un adulto sobrio en el asiento del pasajero
  answer: C
  explanation: En Nebraska, un Permiso de Dispositivo de Bloqueo de Encendido (IIP)
    permite a una persona operar un vehículo equipado con dicho dispositivo para cualquier
    propósito, las 24 horas del día.
- id: 130
  category: alcohol_drugs_health
  question: En Nebraska, ¿cuál es la sanción para un conductor que se niega a someterse
    a una Prueba Preliminar de Aliento (PBT) a petición de un oficial de la ley?
  choices:
    A: Es un delito menor de Clase V y una multa
    B: Sentencia automática de 5 años de prisión
    C: No hay sanción por rechazar una PBT
    D: Pérdida inmediata y permanente de la licencia
  answer: A
  explanation: La negativa a someterse a una Prueba Preliminar de Aliento (PBT) es
    un delito menor de Clase V en Nebraska, lo cual es una infracción separada del
    DUI en sí.
- id: 131
  category: alcohol_drugs_health
  question: ¿Cuál es el tiempo mínimo obligatorio de cárcel por una primera condena
    de DUI en Nebraska si NO se concede la libertad condicional (probation)?
  choices:
    A: 24 horas
    B: 7 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Para una primera condena de DUI en Nebraska, si el tribunal no concede
    la libertad condicional, la sentencia mínima obligatoria es de 7 días de cárcel.
- id: 132
  category: alcohol_drugs_health
  question: En Nebraska, un 'BAC alto' o 'DUI agravado' conlleva sanciones más severas.
    ¿A qué nivel de BAC se considera que un DUI es agravado?
  choices:
    A: 0.10% o más
    B: 0.15% o más
    C: 0.20% o más
    D: 0.25% o más
  answer: B
  explanation: La ley de Nebraska impone sanciones mayores para los conductores con
    un BAC de 0.15% o más, lo que a menudo se denomina DUI agravado.
- id: 133
  category: alcohol_drugs_health
  question: Si es condenado por un segundo DUI en un período de 15 años en Nebraska,
    ¿cuál es el período mínimo de revocación de su licencia?
  choices:
    A: 6 meses
    B: 1 año
    C: 18 meses
    D: 5 años
  answer: C
  explanation: Una segunda condena por DUI dentro de un período de 15 años en Nebraska
    resulta en un período de revocación de licencia obligatorio de 18 meses.
- id: 134
  category: alcohol_drugs_health
  question: Si un conductor de Nebraska se ve involucrado en un choque que resulta
    en lesiones corporales graves o la muerte, y se sospecha de DUI, ¿qué exige la
    ley con respecto a las pruebas químicas?
  choices:
    A: El conductor debe dar su consentimiento verbal
    B: Se requiere una prueba química y puede ser obligada por ley
    C: La prueba solo es obligatoria si el conductor tiene la culpa
    D: La prueba solo puede realizarse con un abogado presente
  answer: B
  explanation: La ley de Nebraska exige que los conductores involucrados en accidentes
    con lesiones graves o muerte se sometan a pruebas químicas si existe una causa
    razonable para creer que estaban bajo la influencia.
- id: 135
  category: penalties_and_points
  question: En Nebraska, ¿cuántos puntos se asignan por exceder el límite de velocidad
    indicado en más de 35 mph?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 9 puntos
    D: 12 puntos
  answer: C
  explanation: Exceder el límite de velocidad por más de 35 mph es una infracción
    grave en Nebraska y conlleva una sanción de 9 puntos.
- id: 136
  category: penalties_and_points
  question: Bajo la ley de Revocación Administrativa de Licencia (ALR) de Nebraska,
    ¿cuál es el período de revocación para un conductor que se niega a someterse a
    una prueba química (aliento, sangre u orina)?
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: Negarse a una prueba química bajo la ley de Consentimiento Implícito
    de Nebraska resulta en una revocación administrativa automática de la licencia
    por 1 año.
- id: 137
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan en el historial de conducción de Nebraska por
    la infracción de 'enviar mensajes de texto al conducir'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: La ley de Nebraska asigna 3 puntos por una infracción de enviar mensajes
    de texto al conducir.
- id: 138
  category: penalties_and_points
  question: En Nebraska, ¿cuántos puntos se asignan por no ceder el paso a un vehículo
    de emergencia autorizado?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: No ceder el paso a un vehículo de emergencia es una infracción de 3
    puntos en Nebraska.
- id: 139
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por abandonar la escena de un accidente que
    solo involucra daños a la propiedad en Nebraska?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Abandonar la escena de un accidente que involucra daños a la propiedad
    resulta en la asignación de 6 puntos.
- id: 140
  category: penalties_and_points
  question: Según la ley de Nebraska, ¿cuántos puntos se asignan por 'conducción descuidada'
    (Careless Driving)?
  choices:
    A: 2 puntos
    C: 4 puntos
    B: 3 puntos
    D: 6 puntos
  answer: C
  explanation: La conducción descuidada es una infracción de 4 puntos en Nebraska.
- id: 141
  category: penalties_and_points
  question: ¿Después de que se revoque una licencia debido al sistema de puntos, por
    cuánto tiempo debe un conductor de Nebraska mantener una prueba de responsabilidad
    financiera (SR-22) ante el DMV?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los conductores a quienes se les revoque la licencia bajo el sistema
    de puntos deben proporcionar y mantener una prueba de responsabilidad financiera
    (SR-22) durante 3 años a partir de la fecha de elegibilidad para la reinstalación.
- id: 142
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de 'Enviar mensajes de texto
    mientras conduce' en Nebraska?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: La multa por una primera infracción de enviar mensajes de texto mientras
    conduce en Nebraska es de $200.
- id: 143
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por no detenerse ante un autobús escolar que
    tiene su brazo de parada extendido y las luces rojas parpadeando?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar es una infracción de 3 puntos
    en Nebraska.
- id: 144
  category: penalties_and_points
  question: En Nebraska, ¿cuántos puntos se asignan por 'Conducción temeraria' (primera
    infracción)?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 6 puntos
  answer: C
  explanation: La conducción temeraria resulta en la asignación de 5 puntos en el
    historial del conductor en Nebraska.
- id: 145
  category: penalties_and_points
  question: Para una primera condena por DUI (conducir bajo la influencia) en Nebraska,
    ¿por cuánto tiempo se revoca típicamente la licencia de conducir?
  choices:
    A: 60 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Una primera condena por conducir bajo la influencia (DUI) en Nebraska
    generalmente resulta en una revocación de la licencia por 6 meses.
- id: 146
  category: penalties_and_points
  question: No ceder el paso a un vehículo de emergencia autorizado en Nebraska, ¿cuántos
    puntos genera en su historial de conducción?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: No ceder el paso a un vehículo de emergencia es una infracción de 3
    puntos bajo el sistema de puntos de Nebraska.
- id: 147
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de la ley de cinturón de
    seguridad de Nebraska?
  choices:
    A: Sin multa, solo advertencia
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: La multa por una infracción del cinturón de seguridad en Nebraska es
    de $25, aunque también pueden aplicarse costos judiciales.
- id: 148
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por no ceder el paso a un peatón que tiene
    el derecho de paso en Nebraska?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: No ceder el paso a un peatón con derecho de paso resulta en 2 puntos
    en el historial del conductor.
- id: 149
  category: penalties_and_points
  question: Bajo la Ley de Consentimiento Implícito de Nebraska, ¿qué sucede si se
    niega a someterse a una prueba química de alcohol o drogas?
  choices:
    A: Se le multará con $100 y se le permitirá conducir a casa.
    B: Su licencia será revocada y puede estar sujeto a sanciones penales.
    C: No pasa nada a menos que luego se demuestre que estaba ebrio.
    D: Recibe 2 puntos en su licencia.
  answer: B
  explanation: Negarse a someterse a una prueba química bajo la Ley de Consentimiento
    Implícito es un delito separado y resulta en la revocación automática de su licencia
    de conducir.
- id: 150
  category: penalties_and_points
  question: Un conductor de Nebraska cuya licencia sea revocada bajo el sistema de
    puntos puede ser elegible para un Permiso de Conducción por Empleo (EDP). ¿Qué
    permite este permiso?
  choices:
    A: Conducir únicamente hacia y desde el trabajo
    B: Conducir por cualquier motivo durante las horas del día
    C: Conducir al trabajo y al supermercado
    D: Conducir a cualquier lugar siempre que esté presente un adulto sobrio
  answer: A
  explanation: El Permiso de Conducción por Empleo (EDP) es estrictamente para conducir
    hacia y desde el lugar de empleo de la persona o como parte de sus deberes laborales.
- id: 151
  category: penalties_and_points
  question: ¿En Nebraska, cuántos puntos se asignan por exceder el límite de velocidad
    de 1 a 5 mph?
  choices:
    A: 0 puntos
    B: 1 punto
    C: 2 puntos
    D: 3 puntos
  answer: B
  explanation: Exceder el límite de velocidad de 1 a 5 mph resulta en 1 punto en el
    registro de conducción de Nebraska.
- id: 152
  category: sharing_the_road
  question: Según la ley 'Move Over' (hacerse a un lado) de Nebraska, ¿qué debe hacer
    un conductor al acercarse a un vehículo de emergencia estacionado con luces intermitentes
    en una carretera de varios carriles?
  choices:
    A: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    B: Detenerse por completo hasta que se le indique que puede continuar
    C: Cambiarse a un carril que no sea adyacente al vehículo de emergencia, si es
      seguro hacerlo
    D: Aumentar la velocidad para pasar el área lo más rápido posible
  answer: C
  explanation: La ley de Nebraska exige que los conductores se muevan a un carril
    que no sea adyacente al vehículo de emergencia estacionado o que reduzcan la velocidad
    considerablemente si un cambio de carril no es posible o seguro.
- id: 153
  category: sharing_the_road
  question: A partir de 2024, ¿cuál es el requisito de casco para los operadores de
    motocicletas en Nebraska?
  choices:
    A: Todos los conductores deben usar casco independientemente de su edad
    B: El uso del casco es opcional para todos
    C: Los conductores de 21 años o más pueden conducir sin casco si han completado
      un curso de seguridad y llevan el comprobante
    D: Solo los pasajeros están obligados a usar casco
  answer: C
  explanation: Tras un cambio en la ley de Nebraska (LB138), los conductores de 21
    años o más pueden conducir sin casco si han completado con éxito un curso certificado
    de seguridad en motocicleta y poseen el comprobante de finalización.
- id: 154
  category: sharing_the_road
  question: ¿En Nebraska, cuántos puntos se asignan a su registro de conducción por
    la infracción de 'No ceder el paso a un peatón'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: El Departamento de Vehículos Motorizados de Nebraska asigna 2 puntos
    al registro de un conductor por no ceder el paso a un peatón.
- id: 155
  category: sharing_the_road
  question: 'Al seguir a un camión grande, si no puede ver la cara del conductor del
    camión en sus espejos laterales, usted se encuentra:'
  choices:
    A: En la 'No-Zone' (punto ciego) del camión
    B: En una posición segura de succión (drafting)
    C: Siguiendo a una distancia legal
    D: Listo para rebasar por la derecha
  answer: A
  explanation: La 'No-Zone' representa los grandes puntos ciegos alrededor de un camión.
    Si no puede ver al conductor en su espejo, él no puede verlo a usted.
- id: 156
  category: sharing_the_road
  question: ¿En Nebraska, cuál es la regla específica con respecto a los cortejos
    fúnebres en las intersecciones?
  choices:
    A: Deben seguir todas las señales de tráfico como cualquier otro vehículo
    B: El vehículo guía debe detenerse, pero el resto del cortejo puede pasar los
      semáforos en rojo
    C: El cortejo tiene el derecho de paso en las intersecciones independientemente
      de los dispositivos de control de tráfico, siempre que el vehículo guía haya
      entrado legalmente
    D: Los cortejos solo están permitidos los domingos
  answer: C
  explanation: La ley de Nebraska otorga a los cortejos fúnebres el derecho de paso
    en las intersecciones. Una vez que el vehículo guía entra legalmente en una intersección,
    los vehículos restantes del cortejo pueden seguirlo independientemente de las
    señales de tráfico.
- id: 157
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima de seguimiento que recomienda Nebraska al
    conducir detrás de una motocicleta?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 a 4 segundos
    D: 10 segundos
  answer: C
  explanation: Debido a que las motocicletas pueden detenerse mucho más rápido que
    los automóviles y son más susceptibles a los peligros de la carretera, Nebraska
    recomienda una distancia de seguimiento de al menos 3 a 4 segundos.
- id: 158
  category: sharing_the_road
  question: 'Cuando un peatón cruza una calle guiado por un perro o lleva un bastón
    blanco, la ley de Nebraska exige que los conductores:'
  choices:
    A: Toquen la bocina para hacerles saber que usted está allí
    B: Se detengan por completo y tomen precauciones para evitar lesiones
    C: Reduzcan la velocidad a 5 mph
    D: Solo se detengan si hay un cruce peatonal marcado
  answer: B
  explanation: Los conductores deben detenerse por completo ante peatones ciegos o
    con discapacidad visual que utilicen un bastón blanco o un perro guía para garantizar
    su seguridad.
- id: 159
  category: sharing_the_road
  question: 'Cuando un ciclista circula por una carretera de Nebraska, se le exige:'
  choices:
    A: Circular en sentido contrario al flujo del tráfico
    B: Circular únicamente por la acera
    C: Seguir las mismas leyes de tránsito que los operadores de vehículos motorizados
    D: Circular siempre exactamente en el centro del carril
  answer: C
  explanation: Los ciclistas en Nebraska tienen los mismos derechos y responsabilidades
    que los automovilistas y deben obedecer todas las señales de tráfico, semáforos
    y marcas de carril.
- id: 160
  category: sharing_the_road
  question: 'Si está conduciendo y un vehículo policial detrás de usted activa sus
    luces intermitentes y sirena, usted debe:'
  choices:
    A: Detenerse inmediatamente en el carril en el que se encuentra
    B: Aumentar la velocidad para buscar un estacionamiento
    C: Orillarse al borde derecho de la carretera y detenerse
    D: Orillarse a la mediana izquierda y detenerse
  answer: C
  explanation: Cuando un vehículo de emergencia le haga una señal, debe orillarse
    lo más a la derecha posible y detenerse por completo hasta que el vehículo haya
    pasado.
- id: 161
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la "división
    de carril" (lane splitting - conducir entre filas de vehículos detenidos o en
    movimiento) para motocicletas en Nebraska?
  choices:
    A: Es legal a velocidades inferiores a 15 mph
    B: Es legal solo en autopistas interestatales
    C: Es ilegal en el estado de Nebraska
    D: Es legal si el motociclista tiene un permiso POP
  answer: C
  explanation: La división de carril (lane splitting) no está permitida en Nebraska;
    las motocicletas tienen derecho al uso total de un carril, y ningún vehículo motorizado
    debe conducirse de manera que las prive de ese uso.
- id: 162
  category: sharing_the_road
  question: 'Cuando un camión grande está girando a la derecha en una calle con dos
    carriles en cada dirección, el conductor puede:'
  choices:
    A: Permanecer completamente en el carril derecho
    B: Abrirse hacia la izquierda para completar el giro
    C: Girar únicamente desde el carril izquierdo
    D: Retroceder para que el giro sea más cerrado
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para no golpear el bordillo al realizar un giro a la derecha. Los automovilistas
    deben evitar "apretarse" entre el camión y el bordillo.
- id: 163
  category: sharing_the_road
  question: En Nebraska, cuando un autobús escolar se detiene en una calzada con una
    mediana o barrera visual que separa los carriles de tráfico, ¿qué vehículos deben
    detenerse ante las luces rojas intermitentes del autobús?
  choices:
    A: Solo el tráfico que circula detrás del autobús
    B: Solo el tráfico que se aproxima por delante
    C: El tráfico en ambas direcciones
    D: No se requiere que ningún vehículo se detenga si hay una mediana
  answer: A
  explanation: Según el Manual del Conductor de Nebraska, en una carretera dividida
    por una mediana o barrera, solo el tráfico que circula detrás del autobús debe
    detenerse. El tráfico en el lado opuesto de la mediana no necesita detenerse.
- id: 164
  category: sharing_the_road
  question: ¿Cuál es la multa máxima por una primera infracción de la Ley de Moverse
    al Carril de al Lado (Move Over Law) de Nebraska (al aproximarse a vehículos de
    emergencia o de asistencia vial estacionados)?
  choices:
    A: Hasta $50
    B: Hasta $100
    C: Exactamente $250
    D: Exactamente $500
  answer: B
  explanation: Una primera infracción por violar la Ley de Moverse al Carril de al
    Lado (Move Over Law) de Nebraska es una falta sancionable con una multa de hasta
    $100.
- id: 165
  category: sharing_the_road
  question: Al seguir a una motocicleta en Nebraska, ¿cuál es la distancia de seguimiento
    recomendada para garantizar la seguridad?
  choices:
    A: Al menos 1 segundo
    B: Al menos 2 segundos
    C: Al menos 3 a 4 segundos
    D: Al menos 10 segundos
  answer: C
  explanation: El Manual del Conductor de Nebraska recomienda una distancia de seguimiento
    de al menos tres a cuatro segundos cuando se circula detrás de una motocicleta
    para permitir maniobras o paradas repentinas.
- id: 166
  category: sharing_the_road
  question: 'Según la ley de Nebraska, es ilegal seguir a un aparato o vehículo de
    bomberos que responda a una alarma a una distancia menor de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Estatuto Revisado de Nebraska 60-6,183 prohíbe seguir a cualquier
    aparato de bomberos que viaje en respuesta a una alarma de incendio a una distancia
    menor de 500 pies.
- id: 167
  category: sharing_the_road
  question: Cuando un cortejo fúnebre es encabezado por un vehículo de escolta con
    luces intermitentes, ¿cuál es la regla para otros conductores en las intersecciones
    en Nebraska?
  choices:
    A: Los conductores pueden atravesar el cortejo si hay un espacio
    B: Los conductores deben ceder el paso a todo el cortejo
    C: Solo los tres primeros autos del cortejo tienen el derecho de paso
    D: Los cortejos deben seguir las señales de semáforo estándar independientemente
      de la escolta
  answer: B
  explanation: En Nebraska, los automovilistas deben ceder el paso a todo el cortejo
    fúnebre hasta que hayan pasado todos los vehículos que lo integran.
- id: 168
  category: sharing_the_road
  question: 'En Nebraska, una persona que monta en bicicleta por una calzada tiene:'
  choices:
    A: Ningún derecho legal como vehículo
    B: Los mismos derechos y obligaciones que el conductor de un vehículo motorizado
    C: El derecho de paso sobre todos los vehículos motorizados en todo momento
    D: La obligación de circular únicamente por las aceras
  answer: B
  explanation: La ley de Nebraska trata a las bicicletas como vehículos; por lo tanto,
    los ciclistas tienen los mismos derechos y están sujetos a las mismas obligaciones
    que los conductores de vehículos motorizados.
- id: 169
  category: sharing_the_road
  question: Los camiones comerciales grandes tienen "Zonas Prohibidas" (No-Zones).
    ¿Dónde se encuentra la "Zona Prohibida" más grande?
  choices:
    A: Directamente delante del camión
    B: Directamente detrás del camión
    C: En el lado izquierdo del camión
    D: En el lado derecho del camión
  answer: D
  explanation: Aunque los camiones tienen puntos ciegos en todos los lados, el punto
    ciego del lado derecho es la "Zona Prohibida" (No-Zone) más grande y peligrosa
    porque se extiende a través de varios carriles.
- id: 170
  category: sharing_the_road
  question: 'En Nebraska, si ve a un peatón con un bastón blanco o un perro guía,
    usted debe:'
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Detenerse y ceder el paso
    C: Conducir alrededor de ellos rápidamente
    D: Reducir la velocidad pero no detenerse a menos que entren en su carril
  answer: B
  explanation: La ley de Nebraska exige que los conductores se detengan por completo
    y cedan el paso a cualquier peatón ciego o con discapacidad visual que lleve un
    bastón blanco o utilice un perro guía.
- id: 171
  category: sharing_the_road
  question: 'Cuando un camión comercial está girando a la derecha en una intersección,
    el conductor debe tener en cuenta que:'
  choices:
    A: El camión siempre permanecerá en el carril del extremo derecho
    B: El camión puede necesitar abrirse hacia la izquierda para completar el giro
    C: El camión puede girar de forma tan cerrada como un automóvil de pasajeros
    D: Es seguro rebasar al camión por la derecha durante el giro
  answer: B
  explanation: Debido a su longitud, los camiones grandes a menudo necesitan abrirse
    hacia la izquierda para no golpear el bordillo al girar a la derecha. Los conductores
    nunca deben intentar meterse entre el camión y el bordillo.
- id: 172
  category: sharing_the_road
  question: En Nebraska, ¿qué equipo debe tener una bicicleta cuando se utiliza de
    noche?
  choices:
    A: Una luz blanca en la parte delantera y un reflector rojo o luz roja en la parte
      trasera
    B: Una luz amarilla en la parte delantera y una luz blanca en la parte trasera
    C: Cinta reflectante solo en los pedales
    D: La ley no exige ningún equipo específico
  answer: A
  explanation: La ley de Nebraska exige que las bicicletas que circulen de noche estén
    equipadas con una lámpara delantera que emita una luz blanca visible desde 500
    pies y un reflector o luz roja trasera visible desde 600 pies.
- id: 173
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima por detrás, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Aumentar la velocidad para mantenerse por delante de él
    C: Orillarse al borde derecho de la carretera y detenerse
    D: Orillarse a la mediana izquierda y detenerse
  answer: C
  explanation: La ley de Nebraska exige que los conductores cedan el paso orillándose
    lo más posible al borde derecho o bordillo de la calzada y permaneciendo detenidos
    hasta que el vehículo de emergencia haya pasado.
- id: 174
  category: vehicle_information
  question: Según la ley de Nebraska, ¿cuál es la profundidad mínima legal de la banda
    de rodadura de los neumáticos de un vehículo de pasajeros?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/16 de pulgada
  answer: B
  explanation: La ley de Nebraska exige que los neumáticos tengan una profundidad
    de banda de rodadura de al menos 2/32 de pulgada para ser considerados seguros
    y legales para su funcionamiento.
- id: 175
  category: vehicle_information
  question: 'En Nebraska, debe encender los faros delanteros desde el atardecer hasta
    el amanecer y en cualquier momento en que la visibilidad sea inferior a:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Estatuto Revisado de Nebraska 60-6,219 exige que los faros estén
    encendidos desde el atardecer hasta el amanecer y cuando la visibilidad sea inferior
    a 500 pies debido al clima u otras condiciones.
- id: 176
  category: vehicle_information
  question: 'La ley de Nebraska exige que el freno de servicio (de pie) debe ser capaz
    de detener un vehículo de pasajeros que viaja a 20 mph en una distancia de:'
  choices:
    A: 15 pies
    B: 25 pies
    C: 35 pies
    D: 50 pies
  answer: B
  explanation: Según las regulaciones de equipo de Nebraska, el freno de pie debe
    ser capaz de detener el vehículo en un máximo de 25 pies cuando viaja a 20 mph
    en un pavimento seco y nivelado.
- id: 177
  category: vehicle_information
  question: 'Todo vehículo motorizado que circule por las autopistas de Nebraska debe
    estar equipado con una bocina que pueda oírse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Nebraska exige una bocina en buen estado de funcionamiento
    capaz de emitir un sonido audible en condiciones normales desde una distancia
    no inferior a 200 pies.
- id: 178
  category: vehicle_information
  question: La ley de Nebraska exige que todos los vehículos motorizados tengan un
    espejo retrovisor que permita al conductor ver la carretera al menos a cuántos
    pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El espejo retrovisor debe estar ubicado de manera que refleje al conductor
    una vista de la carretera por una distancia de al menos 200 pies hacia la parte
    trasera del vehículo.
- id: 179
  category: vehicle_information
  question: En Nebraska, ¿cuál es el porcentaje mínimo de transmisión de luz requerido
    para las ventanas laterales delanteras de un vehículo motorizado?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: El Estatuto Revisado de Nebraska 60-6,257 establece que las ventanas
    laterales delanteras deben permitir el paso de al menos el 35% de la luz.
- id: 180
  category: vehicle_information
  question: 'La ley de Nebraska exige una luz en la placa de matrícula trasera que
    haga que la placa sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La placa de matrícula trasera debe estar iluminada por una luz blanca
    para que los caracteres de la placa puedan leerse desde una distancia de 50 pies.
- id: 181
  category: vehicle_information
  question: 'En Nebraska, las luces traseras deben ser de color rojo y visibles desde
    una distancia de al menos:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Los estándares de equipamiento de Nebraska requieren que las luces
    traseras sean visibles desde una distancia de 500 pies hacia atrás.
- id: 182
  category: vehicle_information
  question: 'Se debe exhibir un emblema de ''Vehículo de movimiento lento'' (Slow
    Moving Vehicle) en la parte trasera de cualquier maquinaria o equipo agrícola
    que viaje a velocidades inferiores a:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: En Nebraska, el emblema triangular de Vehículo de movimiento lento
    es obligatorio para los vehículos diseñados para velocidades de 25 mph o menos.
- id: 183
  category: vehicle_information
  question: 'Cuando un vehículo remolca a otro en Nebraska, la barra de tracción u
    otra conexión no debe exceder los:'
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Nebraska especifica que la barra de tracción o la conexión
    entre dos vehículos, cuando uno remolca al otro, no debe exceder los 15 pies de
    longitud.
- id: 184
  category: vehicle_information
  question: Con respecto a los parabrisas, ¿cuál de las siguientes opciones prohíbe
    la ley de Nebraska?
  choices:
    A: Cualquier calcomanía no requerida por la ley que obstruya la vista del conductor
    B: Limpiaparabrisas que funcionen manualmente
    C: Teñido (polarizado) en las 5 pulgadas superiores del parabrisas
    D: Parabrisas de vidrio transparente
  answer: A
  explanation: La ley de Nebraska prohíbe colocar cualquier letrero, póster u otro
    material no transparente en el parabrisas delantero que obstruya la vista clara
    del conductor de la carretera.
- id: 185
  category: vehicle_information
  question: En Nebraska, ¿las luces de freno (lámparas de parada) deben ser visibles
    desde una distancia de al menos cuántos pies bajo la luz solar normal?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Las lámparas de parada (luces de freno) en los vehículos de Nebraska
    deben ser rojas o ámbar y deben ser visibles desde una distancia no menor a 100
    pies bajo la luz solar normal.
- id: 186
  category: vehicle_information
  question: Según el Manual del Conductor de Nebraska, ¿cuándo debe usar sus faros
    delanteros?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes del amanecer
    B: Desde la puesta del sol hasta el amanecer y cuando la visibilidad sea inferior
      a 500 pies
    C: Solo cuando esté lloviendo o nevando
    D: De 8:00 PM a 6:00 AM
  answer: B
  explanation: La ley de Nebraska exige que los faros se enciendan desde la puesta
    del sol hasta el amanecer y en cualquier otro momento en que la visibilidad sea
    inferior a 500 pies.
- id: 187
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para vehículos de pasajeros en Nebraska?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/16 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros en Nebraska si la profundidad
    de la banda de rodadura es inferior a 2/32 de pulgada.
- id: 188
  category: vehicle_information
  question: En Nebraska, todo vehículo motorizado debe estar equipado con un freno
    de pie que sea capaz de detener el vehículo en cuántos pies cuando viaja a 20
    mph?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 45 pies
  answer: C
  explanation: Las regulaciones de equipamiento de Nebraska establecen que el freno
    de servicio (de pie) debe poder detener el vehículo dentro de los 30 pies a una
    velocidad de 20 mph.
- id: 189
  category: vehicle_information
  question: ¿Las luces de las señales de giro en un vehículo en Nebraska deben ser
    visibles desde una distancia no menor a cuántos pies bajo la luz solar normal?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Las señales de giro deben ser visibles durante al menos 100 pies para
    garantizar que otros conductores estén al tanto de su intención de girar o cambiar
    de carril.
- id: 190
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos está prohibido en un vehículo motorizado
    que circule por las carreteras de Nebraska?
  choices:
    A: Un silenciador
    B: Un recorte de silenciador (muffler cutout) o derivación (bypass)
    C: Un enganche de remolque
    D: Neumáticos para nieve con clavos en invierno
  answer: B
  explanation: La ley de Nebraska prohíbe el uso de un recorte de silenciador, derivación
    o dispositivo similar que aumente el ruido o impida el silenciamiento efectivo
    del escape.
- id: 191
  category: vehicle_information
  question: En Nebraska, ¿cuáles son las restricciones con respecto a los letreros
    o carteles en el parabrisas o las ventanas laterales?
  choices:
    A: Se permiten si son más pequeños de 5x5 pulgadas
    B: Se permiten solo en la ventana del lado del conductor
    C: Están prohibidos a menos que lo exija la ley
    D: Se permiten siempre que no cubran el centro del parabrisas
  answer: C
  explanation: La ley de Nebraska prohíbe conducir con cualquier letrero, cartel u
    otro material no transparente sobre el parabrisas delantero, las aletas laterales
    o las ventanas laterales o traseras que obstruya la visión clara del conductor,
    excepto aquellos requeridos por la ley.
- id: 192
  category: vehicle_information
  question: La ley de Nebraska exige que las luces de freno sean visibles desde una
    distancia de al menos ¿cuántos pies?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Las luces de freno (lámparas de parada) deben ser visibles desde una
    distancia de al menos 100 pies bajo la luz solar normal.
- id: 193
  category: signs_and_signals
  question: En Nebraska, ¿qué indica una señal con forma de banderín?
  choices:
    A: Zona escolar más adelante
    B: Ceder el paso
    C: Zona de no rebasar
    D: Cruce de ferrocarril
  answer: C
  explanation: Una señal con forma de banderín se coloca en el lado izquierdo de la
    carretera e indica el inicio de una zona de no rebasar (no passing zone).
- id: 194
  category: signs_and_signals
  question: Cuando vea una luz amarilla intermitente en una intersección en Nebraska,
    ¿qué debe hacer?
  choices:
    A: Detenerse por completo y esperar a que la luz cambie
    B: Acelerar para despejar la intersección rápidamente
    C: Proceder con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y proceder con precaución a través de la intersección.
- id: 195
  category: signs_and_signals
  question: 'En Nebraska, un conductor puede girar a la izquierda con luz roja solo
    cuando:'
  choices:
    A: Gira desde una calle de doble sentido hacia una calle de sentido único
    B: Gira desde una calle de sentido único hacia otra calle de sentido único
    C: La intersección está libre de todo tráfico
    D: Nunca es legal girar a la izquierda en rojo en Nebraska
  answer: B
  explanation: La ley de Nebraska permite girar a la izquierda en rojo después de
    una parada completa solo cuando se gira desde una calle de sentido único hacia
    otra calle de sentido único.
- id: 196
  category: signs_and_signals
  question: ¿Cuál es el límite de velocidad estándar en las autopistas interestatales
    rurales de Nebraska?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: C
  explanation: El límite de velocidad máximo en las autopistas interestatales rurales
    en Nebraska es de 75 mph.
- id: 197
  category: signs_and_signals
  question: Si las señales de giro de su vehículo no funcionan, ¿cuál es la señal
    manual correcta para un giro a la derecha en Nebraska?
  choices:
    A: Brazo y mano extendidos hacia afuera
    B: Brazo y mano extendidos hacia arriba
    C: Brazo y mano extendidos hacia abajo
    D: Brazo y mano moviéndose en círculos
  answer: B
  explanation: Para señalar un giro a la derecha usando señales manuales, el brazo
    y la mano del conductor deben estar extendidos hacia arriba.
- id: 198
  category: signs_and_signals
  question: En Nebraska, ¿qué significa una línea amarilla continua en su lado de
    la línea central?
  choices:
    A: Se permite rebasar si es seguro
    B: Está en una zona de sentido único
    C: Está prohibido rebasar
    D: Debe reducir la velocidad a 25 mph
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central indica que
    está prohibido rebasar.
- id: 199
  category: signs_and_signals
  question: ¿Qué indica una señal en forma de pentágono (cinco lados) en Nebraska?
  choices:
    A: Una zona de construcción
    B: Un cruce de ferrocarril
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal de cinco lados (pentágono) se utiliza para advertir a los
    conductores sobre zonas escolares o cruces escolares.
- id: 200
  category: signs_and_signals
  question: 'Según la ley de Nebraska, las multas por exceso de velocidad se duplican
    en las zonas de mantenimiento o construcción cuando:'
  choices:
    A: El sol se ha puesto
    B: Hay trabajadores presentes
    C: El límite de velocidad es superior a 55 mph
    D: La zona tiene más de una milla de largo
  answer: B
  explanation: La ley de Nebraska exige que las multas por exceso de velocidad se
    dupliquen en las zonas de trabajo cuando hay trabajadores presentes.
- id: 201
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas sólidas dobles pintadas en el pavimento?
  choices:
    A: Se permite rebasar con precaución
    B: El tráfico se mueve en direcciones opuestas
    C: Está prohibido cruzar las líneas
    D: Se está acercando a un cruce de ferrocarril
  answer: C
  explanation: Las líneas blancas sólidas dobles separan los carriles de tráfico que
    se mueven en la misma dirección e indican que está prohibido cruzar las líneas.
- id: 202
  category: signs_and_signals
  question: 'Una señal amarilla redonda con una ''X'' negra y las letras ''RR'' es
    una:'
  choices:
    A: Señal de alto (Stop)
    B: Señal de ceda el paso (Yield)
    C: Señal de advertencia anticipada de cruce de ferrocarril
    D: Señal de zona de no rebasar
  answer: C
  explanation: Una señal amarilla redonda con una 'X' negra y 'RR' advierte a los
    conductores que se están acercando a un cruce de ferrocarril.
- id: 203
  category: signs_and_signals
  question: En Nebraska, ¿cuál es el significado de una luz roja intermitente?
  choices:
    A: Reduzca la velocidad y ceda el paso a todo el tráfico
    B: Deténgase por completo y continúe cuando sea seguro hacerlo
    C: La luz está a punto de cambiar a verde
    D: El semáforo está averiado; trátelo como una señal de ceda el paso
  answer: B
  explanation: 'Una luz roja intermitente debe tratarse igual que una señal de alto:
    deténgase por completo y continúe solo cuando sea seguro.'
- id: 204
  category: signs_and_signals
  question: Al acercarse a una zona de obras en Nebraska, ¿de qué color son las señales
    de advertencia?
  choices:
    A: Amarillo
    B: Naranja
    C: Rojo
    D: Verde
  answer: B
  explanation: El naranja es el color estándar para las señales de advertencia en
    zonas de construcción y mantenimiento.
- id: 205
  category: signs_and_signals
  question: ¿Cuál es la señal manual para 'reducir la velocidad o detenerse' en Nebraska?
  choices:
    A: Brazo y mano extendidos hacia arriba
    B: Brazo y mano extendidos hacia afuera
    C: Brazo y mano extendidos hacia abajo
    D: Mano apuntando hacia el suelo con la palma abierta
  answer: C
  explanation: Para indicar que está reduciendo la velocidad o deteniéndose, extienda
    el brazo y la mano hacia abajo.
- id: 206
  category: signs_and_signals
  question: En Nebraska, ¿qué indica una señal de tráfico amarilla intermitente?
  choices:
    A: Deténgase y espere a que la luz cambie a verde
    B: Aumente la velocidad para despejar la intersección
    C: Proceda con precaución
    D: Ceda el paso a todo el tráfico, luego deténgase por completo
  answer: C
  explanation: Según el Manual del Conductor de Nebraska, una luz amarilla intermitente
    significa que debe proceder con precaución y estar alerta a otros vehículos o
    peatones.
- id: 207
  category: signs_and_signals
  question: Según la ley de Nebraska, ¿cuándo se permite un giro a la izquierda con
    luz roja?
  choices:
    A: Nunca
    B: Desde una calle de doble sentido hacia una calle de un solo sentido
    C: Desde una calle de un solo sentido hacia otra calle de un solo sentido
    D: En cualquier intersección si no viene tráfico
  answer: C
  explanation: En Nebraska, un giro a la izquierda en rojo solo es legal cuando se
    gira desde una calle de un solo sentido hacia otra calle de un solo sentido, después
    de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 208
  category: signs_and_signals
  question: ¿Cuál es la forma estándar de una señal de 'Zona Escolar' o 'Cruce Escolar'
    en Nebraska?
  choices:
    A: Diamante
    B: Octágono
    C: Pentágono
    D: Rectángulo
  answer: C
  explanation: Las señales de zona escolar y cruce escolar en Nebraska tienen forma
    de pentágono (cinco lados) y suelen ser de color amarillo verdoso fluorescente.
- id: 209
  category: signs_and_signals
  question: En Nebraska, ¿qué significan las líneas amarillas sólidas dobles en el
    centro de la carretera?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Está prohibido rebasar desde cualquier dirección
    D: La carretera es una calle de un solo sentido
  answer: C
  explanation: Las líneas amarillas sólidas dobles indican que no se permite rebasar
    a los vehículos que viajan en cualquier dirección.
- id: 210
  category: signs_and_signals
  question: Según el Manual del Conductor de Nebraska, ¿cuál es la señal manual adecuada
    para indicar un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido hacia afuera
  answer: B
  explanation: Para señalar un giro a la derecha mediante señales manuales, el conductor
    debe extender su brazo izquierdo por la ventana y apuntarlo hacia arriba.
- id: 211
  category: signs_and_signals
  question: ¿En Nebraska, qué significa una línea blanca continua pintada en el pavimento
    entre carriles?
  choices:
    A: Se le anima a cambiar de carril
    B: Los cambios de carril están prohibidos
    C: Se desaconseja el cambio de carril
    D: La carretera está por terminar
  answer: C
  explanation: Una línea blanca continua indica que se desaconseja el cambio de carril
    debido a posibles peligros, aunque no está estrictamente prohibido como una línea
    continua doble.
- id: 212
  category: signs_and_signals
  question: ¿Qué representa una señal de tráfico de Nebraska con fondo naranja y letras
    negras?
  choices:
    A: Información reglamentaria
    B: Información de servicios (comida/gasolina)
    C: Advertencia de construcción o mantenimiento
    D: Guía de áreas recreativas
  answer: C
  explanation: Las señales naranjas se utilizan específicamente para zonas de trabajo
    de construcción y mantenimiento para advertir a los conductores sobre condiciones
    inusuales o potencialmente peligrosas.
- id: 213
  category: signs_and_signals
  question: En Nebraska, las multas por exceso de velocidad se ________ en zonas designadas
    de mantenimiento o construcción cuando hay trabajadores presentes.
  choices:
    A: Triplican
    B: Duplican
    C: Reducen a la mitad
    D: Aumentan en $100
  answer: B
  explanation: La ley de Nebraska exige que las multas por infracciones de tráfico,
    incluido el exceso de velocidad, se dupliquen en las zonas de construcción o mantenimiento
    cuando hay trabajadores presentes.
- id: 214
  category: signs_and_signals
  question: 'Una señal en forma de diamante en una carretera de Nebraska se utiliza
    para:'
  choices:
    A: Dar instrucciones a los conductores
    B: Advertir a los conductores sobre peligros existentes o posibles
    C: Indicar que se requiere una parada
    D: Mostrar la distancia a la siguiente salida
  answer: B
  explanation: Las señales en forma de diamante son señales de advertencia estándar
    que se utilizan para alertar a los conductores sobre las condiciones de la carretera,
    intersecciones u otros peligros adelante.
- id: 215
  category: signs_and_signals
  question: ¿Qué significa una luz amarilla fija en un semáforo en Nebraska?
  choices:
    A: La luz está a punto de cambiar a rojo; despeje la intersección
    B: Deténgase inmediatamente, incluso si está en la intersección
    C: La luz está a punto de cambiar a verde
    D: Los peatones tienen el derecho de paso
  answer: A
  explanation: Una luz amarilla fija advierte que la señal está cambiando a rojo.
    Los conductores deben detenerse si es seguro hacerlo; de lo contrario, deben despejar
    la intersección.
- id: 216
  category: signs_and_signals
  question: ¿Qué señal manual debe usar un conductor de Nebraska para indicar que
    está disminuyendo la velocidad o deteniéndose?
  choices:
    A: Brazo izquierdo extendido hacia arriba
    B: Brazo izquierdo extendido hacia afuera
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho saludando
  answer: C
  explanation: Para indicar que se está disminuyendo la velocidad o deteniéndose,
    el conductor debe extender el brazo izquierdo por la ventana y apuntar hacia abajo.
- id: 217
  category: signs_and_signals
  question: 'En Nebraska, un ''Carril compartido para girar a la izquierda'' está
    marcado por:'
  choices:
    A: Líneas blancas continuas en ambos lados
    B: Una línea amarilla continua y una línea amarilla discontinua en ambos lados
    C: Líneas amarillas continuas dobles
    D: Líneas blancas discontinuas
  answer: B
  explanation: Los carriles compartidos para girar a la izquierda (carriles de giro
    centrales) están marcados por una línea amarilla continua en el exterior y una
    línea amarilla discontinua en el interior del carril.
- id: 218
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de aspa (en forma de X) que se encuentra
    en una intersección de carreteras?
  choices:
    A: No se permiten giros en U
    B: Hospital adelante
    C: Cruce de ferrocarril
    D: Parada de cuatro vías
  answer: C
  explanation: Una señal de aspa es una señal reglamentaria que identifica un cruce
    de ferrocarril y debe tratarse de manera similar a una señal de ceda el paso.
- id: 219
  category: signs_and_signals
  question: 'Al entrar en una rotonda en Nebraska, usted debe:'
  choices:
    A: Detenerse siempre antes de entrar
    B: Ceder el paso al tráfico que ya está en el círculo
    C: Ceder el paso al tráfico que entra por la derecha
    D: Acelerar para incorporarse al tráfico
  answer: B
  explanation: En las rotondas de Nebraska, el tráfico que entra debe ceder el derecho
    de paso al tráfico que ya circula dentro de la rotonda.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Disminuya la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) octogonal roja significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 220
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 221
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico en sentido contrario.
  id: 222
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda
    de manera segura.
  id: 223
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 224
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 225
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 226
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 227
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico en ambos sentidos más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 228
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 229
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 230
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 231
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que cruzan la carretera.
  id: 232
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal de forma pentagonal (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 233
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 234
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de vías férreas. Significa que debe ceder el paso a los trenes.
    Si se aproxima un tren, debe detenerse.
  id: 235
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Se requiere giro a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 236
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 237
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera curve
    primero hacia un lado y luego hacia el otro.
  id: 238
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 239
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico incorporándose desde otra carretera
    C: Comienzo de una carretera dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación (merge) en forma de diamante advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 240
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera se estrecha más adelante.
    Esté preparado para una reducción en el ancho de la vía y ajuste su posición en
    el carril.
  id: 241
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 242
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    de doble sentido.
  id: 243
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de sentido único o de una autopista dividida y se
    encuentre con vehículos que circulan en dirección opuesta.
  id: 244
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 245
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 246
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 247
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 248
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las carreteras
    laterales.
  id: 249
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la autopista desde la carretera lateral.
  id: 250
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse al tráfico existente. El tráfico que
    entra desde la rampa tiene su propio carril nuevo.
  id: 251
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 252
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 253
