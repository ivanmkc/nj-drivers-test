  answer: C
  explanation: 'La ley de Nebraska exige que la mayoría de los vehículos motorizados
    exhiban dos placas de matrícula: una en la parte delantera y otra en la trasera.'
- id: 74
  category: driver_responsibility
  question: ¿En Nebraska, cuántos puntos se asignan por una condena por usar un dispositivo
    de comunicación inalámbrica portátil para leer, escribir o enviar comunicaciones
