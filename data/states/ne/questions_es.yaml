- id: 51
  category: driver_testing
  question: 'Al rebasar una bicicleta en Nebraska, un automovilista debe mantener
    una distancia mínima de al menos:'
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 6 pies
  answer: B
  explanation: La ley de Nebraska exige que los automovilistas dejen una distancia
    segura al rebasar una bicicleta, la cual se define como al menos 3 pies de espacio
