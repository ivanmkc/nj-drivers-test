  choices:
    A: Solo al conductor
    B: Solo a los pasajeros menores de 21 años
    C: Tanto al conductor como a todos los pasajeros
    D: Solo a los pasajeros en el asiento delantero
  answer: C
  explanation: La ley de Contenedor Abierto de Nebraska establece que es ilegal que
    cualquier persona (conductor o pasajero) posea un contenedor de bebida alcohólica
