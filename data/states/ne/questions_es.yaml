- id: 60
  category: driver_responsibility
  question: En Nebraska, ¿cuántos puntos se le asignarán al historial de conducción
    de un conductor condenado por "Conducción Descuidada" (Careless Driving)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: La Conducción Descuidada resulta en la asignación de 4 puntos en el
    historial de conducción de Nebraska, mientras que la Conducción Temeraria (Reckless
    Driving) conlleva 5 puntos.
- id: 61
  category: driver_responsibility
  question: Al vender un vehículo en Nebraska, ¿qué debe hacer el vendedor con las
    placas de matrícula?
  choices:
    A: Dejarlas en el vehículo para el nuevo propietario.
    B: Quitarlas y conservarlas para otro vehículo o devolverlas al tesorero del condado.
    C: Entregarlas al departamento de policía local.
    D: Las placas deben ser destruidas en presencia de un notario.
  answer: B
  explanation: En Nebraska, las placas de matrícula pertenecen al propietario, no
    al vehículo. Cuando se vende un vehículo, el vendedor debe retirar las placas.
- id: 62
  category: driver_responsibility
  question: 'La ley de ''Consentimiento Implícito'' (Implied Consent) de Nebraska
    significa que, al conducir por las carreteras de Nebraska, usted ha dado su consentimiento
    para:'
  choices:
    A: Un registro del maletero de su vehículo en cualquier momento.
    B: Una prueba química de alcohol o drogas si lo solicita un oficial de la ley.
    C: Permitir que el estado rastree su vehículo a través de GPS.
    D: Renunciar a su derecho a un juicio por cualquier infracción de tráfico.
  answer: B
  explanation: La ley de Consentimiento Implícito establece que se considera que cualquier
    persona que opera un vehículo motorizado en Nebraska ha dado su consentimiento
    para una prueba química con el fin de determinar la cantidad de alcohol o drogas
    en su sistema.
- id: 63
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por una primera infracción por arrojar basura
