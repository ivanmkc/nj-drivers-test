questions:
- id: 1
  category: license_system
  question: ¿En Nebraska, cuál es la edad mínima para solicitar un Permiso de Aprendizaje
    (LPD)?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y 6 meses
    D: 16 años
  answer: B
  explanation: Según el DMV de Nebraska, la edad mínima para solicitar un Permiso
    de Aprendizaje (LPD) es de 15 años.
- id: 2
  category: license_system
  question: ¿Cuánto tiempo debe tener un adolescente de Nebraska un Permiso de Aprendizaje
    (LPD) antes de ser elegible para solicitar un Permiso de Operador Provisional
    (POP)?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Una persona debe tener un LPD, LPE o SCP durante al menos seis meses
    antes de solicitar un POP.
- id: 3
  category: license_system
  question: Bajo las leyes de Licencia de Conducir Graduada (GDL) de Nebraska, ¿cuál
    es el toque de queda para un conductor que tiene un Permiso de Operador Provisional
    (POP)?
  choices:
    A: De 10 PM a 5 AM
    B: De 11 PM a 6 AM
    C: De 12 AM a 6 AM
    D: De 1 AM a 5 AM
  answer: C
  explanation: Los titulares de un POP tienen restringido conducir entre las 12 AM
    y las 6 AM, a menos que se dirijan hacia o desde la escuela o el trabajo.
- id: 4
  category: license_system
  question: Durante los primeros seis meses de tener un POP, ¿cuántos pasajeros menores
    de 19 años (que no sean familiares directos) se le permite transportar al conductor?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Durante los primeros seis meses de tener un POP, el conductor solo
    puede transportar a un pasajero menor de 19 años que no sea un miembro de la familia
    inmediata.
- id: 5
  category: license_system
  question: Para calificar para un Permiso Escolar (SCP) en Nebraska, el solicitante
    debe vivir fuera de una ciudad de 5,000 habitantes o más, o asistir a una escuela
    fuera de una ciudad de 5,000 habitantes o más, y ¿a qué distancia de la escuela
    debe vivir?
  choices:
    A: Al menos 1 milla
    B: Al menos 1.5 millas
    C: Al menos 2 millas
    D: Al menos 5 millas
  answer: B
  explanation: El solicitante debe residir a 1.5 millas o más de la escuela a la que
    asiste para ser elegible para un SCP.
- id: 6
  category: license_system
  question: Si cambia su nombre o dirección, ¿dentro de cuántos días debe solicitar
    un reemplazo de su licencia de Nebraska?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: La ley de Nebraska exige que notifique al DMV sobre un cambio de nombre
    o dirección y obtenga una licencia de reemplazo dentro de los 60 días.
- id: 7
  category: license_system
  question: Bajo el sistema de puntos de Nebraska, ¿su licencia de conducir será revocada
    si acumula cuántos puntos en un período de dos años?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: La ley de Nebraska exige la revocación de los privilegios de conducir
    si un conductor acumula 12 puntos en cualquier período de dos años.
- id: 8
  category: license_system
  question: ¿Cuál es el límite de Concentración de Alcohol en Sangre (BAC) de 'Tolerancia
    Cero' para conductores menores de 21 años en Nebraska?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: La ley de Tolerancia Cero de Nebraska establece que es ilegal que cualquier
    persona menor de 21 años opere un vehículo con un BAC de 0.02% o superior.
- id: 9
  category: license_system
  question: Un Permiso de Operador Provisional (POP) vence en el cumpleaños número
    18 del titular. ¿Cuándo puede el titular solicitar una licencia de Operador Clase
    O completa?
  choices:
    A: En su cumpleaños número 17, si ha tenido el POP durante al menos 12 meses sin
      acumular 3 o más puntos
    B: Solo en su cumpleaños número 18
    C: En su cumpleaños número 16
    D: Después de 6 meses de tener un POP
  answer: A
  explanation: El titular de un POP es elegible para una licencia Clase O a los 17
    años si ha tenido el POP durante al menos 12 meses y no ha acumulado tres o más
    puntos en los 12 meses anteriores.
- id: 10
  category: license_system
  question: Para ser elegible para un POP, ¿el solicitante no debe haber acumulado
    más de cuántos puntos en su historial de manejo en los seis meses inmediatamente
    anteriores a la solicitud?
  choices:
    A: 0 puntos
    B: 1 punto
    C: 2 puntos
    D: 3 puntos
  answer: D
  explanation: Los solicitantes de un POP no deben haber acumulado tres o más puntos
    en su historial de manejo durante el período de seis meses inmediatamente anterior
    a la fecha de la solicitud.
- id: 11
  category: license_system
  question: ¿En Nebraska, cuántos puntos se pueden eliminar de su historial de manejo
    al completar con éxito un Curso de Seguridad para Conductores aprobado por el
    DMV?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Los conductores pueden completar un Curso de Seguridad para Conductores
    aprobado por el DMV una vez cada cinco años para reducir 2 puntos de su historial
    de manejo.
- id: 12
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    para un vehículo motorizado en Nebraska?
  choices:
    A: 15/30/10 ($15k por lesiones corporales por persona, $30k por accidente, $10k
      por daños a la propiedad)
    B: 25/50/25 ($25k por lesiones corporales por persona, $50k por accidente, $25k
      por daños a la propiedad)
    C: 50/100/50 ($50k por lesiones corporales por persona, $100k por accidente, $50k
      por daños a la propiedad)
    D: 10/20/10 ($10k por lesiones corporales por persona, $20k por accidente, $10k
      por daños a la propiedad)
  answer: B
  explanation: La ley de Nebraska exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones corporales a una persona, $50,000 por lesiones corporales
    a dos o más personas en un accidente y $25,000 por daños a la propiedad.
- id: 13
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia estándar de Clase O (Operador)
    de Nebraska para una persona de 21 años o más?
  choices:
    A: 2 años
    B: 4 años
    C: 5 años
    D: 8 años
  answer: C
  explanation: Una licencia de conducir estándar de Nebraska (Clase O) es válida por
    cinco años.
- id: 14
  category: license_system
  question: Si es menor de 18 años y solicita un Permiso de Operador Provisional (POP),
    ¿cuál de los siguientes es un requisito con respecto a las 50 horas de práctica
    de manejo?
  choices:
    A: Todas las 50 horas deben ser durante el día
    B: Al menos 10 de las 50 horas deben ser de noche
    C: Al menos 20 de las 50 horas deben ser en autopistas
    D: No se requiere conducir de noche
  answer: B
  explanation: Los solicitantes de un POP deben completar 50 horas de práctica de
    manejo, de las cuales al menos 10 deben ser de noche, certificadas por un padre
    o tutor.
- id: 15
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Aprendizaje Escolar (LPE) de
    Nebraska?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: A
  explanation: Según el Manual del Conductor de Nebraska, un Permiso de Aprendizaje
    Escolar (LPE) es válido por tres meses y puede ser renovado.
- id: 16
  category: license_system
  question: ¿Cuántos días antes de la fecha de vencimiento se le permite renovar su
    licencia de conducir de Nebraska?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: La ley de Nebraska permite a los conductores renovar su licencia hasta
    90 días antes de la fecha de vencimiento.
- id: 17
  category: license_system
  question: Los nuevos residentes de Nebraska deben obtener una licencia de conducir
    de Nebraska dentro de ¿cuántos días después de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes deben obtener una licencia de conducir de Nebraska
    dentro de los 30 días posteriores a la fecha de establecimiento de su residencia
    en el estado.
- id: 18
  category: license_system
  question: ¿Cuál es el cargo de restablecimiento para una licencia de conducir de
    Nebraska que ha sido revocada debido a la acumulación de demasiados puntos?
  choices:
    A: 50 dólares
    B: 75 dólares
    C: 100 dólares
    D: 125 dólares
  answer: D
  explanation: El DMV de Nebraska exige un cargo de restablecimiento de $125 para
    las licencias revocadas bajo el sistema de puntos o por infracciones de DUI.
- id: 19
  category: license_system
  question: Para cumplir con los requisitos de visión para una licencia de conducir
    de Nebraska, ¿un solicitante debe tener al menos qué agudeza visual en al menos
    un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: El requisito mínimo de visión para una licencia de conducir de Nebraska
    es 20/40 con o sin lentes correctivos.
- id: 20
  category: license_system
  question: ¿Cuánto tiempo permanecen los puntos en su historial de manejo de Nebraska
    a partir de la fecha de la infracción?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: B
  explanation: En Nebraska, los puntos permanecen en su historial de manejo por un
    período de dos años a partir de la fecha de la infracción.
- id: 21
  category: license_system
  question: Si se le expide un Permiso de Dispositivo de Bloqueo de Encendido (IIP),
    ¿cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Solo puede conducir durante las horas del día
    B: Solo puede conducir hacia y desde el trabajo
    C: Solo puede operar un vehículo equipado con un dispositivo de bloqueo de encendido
    D: Solo puede conducir con un adulto con licencia mayor de 21 años
  answer: C
  explanation: Un Permiso de Dispositivo de Bloqueo de Encendido (IIP) permite a una
    persona operar un vehículo motorizado solo si está equipado con un dispositivo
    de bloqueo de encendido funcional.
- id: 22
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la donación
    de órganos y tejidos en una licencia de conducir de Nebraska?
  choices:
    A: Debe tener 21 años para registrarse como donante
    B: Solo puede registrarse como donante en el momento de la emisión de su primera
      licencia
    C: El símbolo de 'Donación' se colocará en la parte frontal de su licencia si
      decide ser donante
    D: Debe proporcionar una nota del médico para convertirse en donante
  answer: C
  explanation: Cuando elige ser donante de órganos y tejidos en Nebraska, se coloca
    un símbolo de 'Donación' en forma de corazón en la parte frontal de su licencia.
- id: 23
  category: license_system
  question: Bajo la ley 'Motor Voter' (Votante Motorizado), ¿qué pueden hacer los
    residentes de Nebraska en el DMV?
  choices:
    A: Emitir un voto en una elección local
    B: Solicitar el registro para votar o actualizar su registro de votante
    C: Pagar impuestos sobre la propiedad
    D: Solicitar un pasaporte
  answer: B
  explanation: La Ley Nacional de Registro de Votantes (Motor Voter) permite a las
    personas solicitar el registro para votar o actualizar su registro al solicitar
    o renovar una licencia de conducir.
- id: 24
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar una Licencia de Conducir
    Comercial (CDL) de Nebraska para operar en el comercio interestatal?
  choices:
    A: '18'
    B: '19'
    C: '20'
    D: '21'
  answer: D
  explanation: Aunque puede obtener una CDL para el comercio intraestatal (dentro
    de Nebraska) a los 18 años, debe tener al menos 21 años para operar un vehículo
    comercial en el comercio interestatal.
- id: 25
  category: license_system
  question: ¿Para qué propósito está diseñado específicamente un Permiso por Dificultad
    Médica (MHP) en Nebraska?
  choices:
    A: Para permitir que un conductor vaya solo a la farmacia
    B: Para permitir que un conductor con una discapacidad física conduzca un vehículo
      modificado
    C: Para permitir la conducción para tratamientos médicos cuando no hay otro transporte
      disponible
    D: Para permitir que un conductor se salte el examen de la vista
  answer: C
  explanation: El Permiso por Dificultad Médica (MHP) está disponible para personas
    cuyas licencias están suspendidas y que no tienen otro medio de transporte para
    recibir la atención médica necesaria para ellos o su familia.
- id: 26
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las Tarjetas
    de Identificación Estatal y las Licencias de Conducir de Nebraska?
  choices:
    A: Puede tener tanto una licencia válida como una tarjeta de identificación estatal
      simultáneamente
    B: No puede tener una licencia de conducir de Nebraska válida y una tarjeta de
      identificación estatal de Nebraska al mismo tiempo
    C: Una tarjeta de identificación estatal le permite conducir en emergencias
    D: Las tarjetas de identificación estatal son solo para residentes mayores de
      65 años
  answer: B
  explanation: La ley de Nebraska prohíbe que una persona tenga una licencia de conducir
    de Nebraska válida y una tarjeta de identificación estatal de Nebraska al mismo
    tiempo.
- id: 27
  category: license_system
  question: Si un residente de Nebraska está en servicio activo en el ejército, ¿su
    licencia de conducir sigue siendo válida hasta cuántos días después de su baja?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: La licencia de una persona en servicio activo en el ejército (y sus
    familiares) sigue siendo válida hasta 60 días después de su baja o regreso al
    estado.
- id: 28
  category: driver_testing
  question: En Nebraska, ¿cuál es el límite de velocidad máximo en las autopistas
    interestatales rurales a menos que se indique lo contrario?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: C
  explanation: Según el Manual del Conductor de Nebraska, el límite de velocidad máximo
    en las autopistas interestatales rurales es de 75 mph a menos que se indique lo
    contrario.
- id: 29
  category: driver_testing
  question: Bajo el sistema de puntos de Nebraska, ¿cuántos puntos se asignan por
    exceder el límite de velocidad de 11 a 15 mph?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: Nebraska asigna 1 punto por exceder de 1 a 5 mph, 2 puntos por 6 a
    10 mph y 3 puntos por 11 a 15 mph sobre el límite.
- id: 30
  category: driver_testing
  question: 'La ley de Nebraska exige que los conductores presenten un Informe de
    Accidente de Vehículo Motorizado del Conductor si un accidente resulta en lesiones,
    muerte o daños a la propiedad de una persona que excedan los:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: C
  explanation: Si un accidente resulta en lesiones corporales, muerte o daños a la
    propiedad de $1,500 o más para cualquier persona, se debe presentar un informe
    al Departamento de Transporte dentro de los 10 días.
- id: 31
  category: driver_testing
  question: Al conducir de noche en Nebraska, ¿a cuántos pies de distancia de un vehículo
    que viene en sentido contrario debe cambiar de luces altas a luces bajas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Nebraska exige que los conductores cambien de luces altas
    a bajas cuando se encuentren a menos de 500 pies de un vehículo que se aproxima
    en sentido contrario.
- id: 32
  category: driver_testing
  question: En Nebraska, al seguir a otro vehículo de noche, ¿a cuántos pies del vehículo
    de adelante debe usar las luces bajas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los conductores deben usar luces bajas cuando sigan a otro vehículo
    a una distancia de 200 pies o menos.
- id: 33
  category: driver_testing
  question: Cuando tenga la intención de girar, ¿durante cuántos pies como mínimo
    exige la ley de Nebraska que señalice continuamente antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: El Manual del Conductor de Nebraska establece que la señal de intención
    de girar a la derecha o a la izquierda debe darse continuamente durante no menos
    de los últimos 100 pies recorridos por el vehículo antes de girar.
- id: 34
  category: driver_testing
  question: En una carretera con al menos dos carriles de tráfico en la misma dirección,
    ¿qué exige la ley de 'Hacerse a un lado' (Move Over) de Nebraska que hagan los
    conductores al acercarse a un vehículo de emergencia detenido con luces intermitentes?
  choices:
    A: Detenerse por completo hasta que el vehículo de emergencia se retire
    B: Moverse a un carril que esté al menos a un carril de distancia del vehículo
      si es seguro hacerlo
    C: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    D: Acelerar para pasar la escena lo más rápido posible
  answer: B
  explanation: La ley de Nebraska exige que los conductores se muevan a un carril
    adyacente o reduzcan la velocidad a una velocidad segura si no es posible cambiar
    de carril al acercarse a vehículos de emergencia o de asistencia vial detenidos.
- id: 35
  category: driver_testing
  question: Al estacionar un vehículo cuesta arriba en una calle de doble sentido
    con bordillo (acera), ¿hacia dónde se deben girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: Hacia la derecha
  answer: B
  explanation: Al estacionar cuesta arriba con bordillo, debe girar las ruedas en
    dirección contraria al bordillo para que el vehículo ruede hacia el bordillo si
    fallan los frenos.
- id: 36
  category: driver_testing
  question: ¿Cuál es la distancia de seguimiento recomendada en Nebraska detrás del
    vehículo que va delante de usted en condiciones normales?
  choices:
    A: La longitud de 1 automóvil
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Nebraska recomienda utilizar la 'regla de
    los tres segundos' para mantener una distancia de seguimiento segura en condiciones
    normales de conducción.
- id: 37
  category: driver_testing
  question: Cuando un autobús escolar se detiene en una calzada con su brazo de señal
    de pare (STOP) extendido y las luces rojas parpadeando, ¿qué conductores deben
    detenerse?
  choices:
    A: Solo los conductores que siguen al autobús
    B: Solo los conductores que se acercan por delante
    C: Todos los conductores que se acerquen desde cualquier dirección, a menos que
      sea en una carretera dividida con una mediana
    D: Nadie está obligado a detenerse si hay más de dos carriles
  answer: C
  explanation: En Nebraska, todos los conductores deben detenerse ante un autobús
    escolar con luces rojas intermitentes y un brazo de pare extendido, a menos que
    viajen en la dirección opuesta en una carretera dividida separada por una mediana
    o barrera visual.
- id: 38
  category: driver_testing
  question: ¿Cuál es la sanción por la primera infracción para un conductor mayor
    de 21 años condenado por DUI en Nebraska con un nivel de alcohol en sangre (BAC)
    entre .08 y .15?
  choices:
    A: Sentencia de cárcel obligatoria de 1 año
    B: Revocación de la licencia por 6 meses y una multa
    C: Pérdida permanente de los privilegios de conducir
    D: Una advertencia verbal y una multa de $50
  answer: B
  explanation: Una primera infracción por DUI en Nebraska (BAC estándar) generalmente
    resulta en la revocación de la licencia por 6 meses, una multa de $500 y de 7
    a 60 días de cárcel (aunque se puede ofrecer libertad condicional).
- id: 39
  category: driver_testing
  question: Al adelantar a una bicicleta en Nebraska, ¿cuál es la distancia mínima
    de seguridad que un automovilista debe mantener entre el vehículo y la bicicleta?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La ley de Nebraska exige que los automovilistas dejen una distancia
    segura al adelantar a una bicicleta, lo que generalmente se define como al menos
    3 pies de espacio libre.
- id: 40
  category: driver_testing
  question: Para utilizar una señal manual para indicar un giro a la derecha, ¿cómo
    debe colocarse el brazo del conductor?
  choices:
    A: Brazo extendido directamente hacia afuera de la ventana
    B: Brazo extendido hacia arriba
    C: Brazo extendido hacia abajo
    D: Brazo moviéndose en forma circular
  answer: B
  explanation: Un giro a la derecha se señaliza extendiendo el brazo izquierdo por
    la ventana y doblándolo hacia arriba a la altura del codo.
- id: 41
  category: driver_testing
  question: ¿En una intersección sin señales de alto ni semáforos (intersección no
    controlada), qué conductor tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja más rápido
    D: El conductor que toque la bocina primero
  answer: B
  explanation: En Nebraska, cuando dos vehículos llegan a una intersección no controlada
    aproximadamente al mismo tiempo, el conductor de la izquierda debe ceder el paso
    al conductor de la derecha.
- id: 42
  category: driver_testing
  question: Al realizar el examen de habilidades de conducción de Nebraska, ¿cuál
    de los siguientes debe proporcionar el solicitante para el vehículo que se utilizará?
  choices:
    A: Una carta del fabricante
    B: Un tanque lleno de gasolina premium
    C: Comprobante vigente de seguro y registro
    D: Una llanta de repuesto y un gato
  answer: C
  explanation: Para el examen de manejo de Nebraska, el solicitante debe proporcionar
    un vehículo que esté en condiciones seguras de funcionamiento y presentar un comprobante
    válido de registro y seguro de responsabilidad civil de Nebraska para ese vehículo.
- id: 43
  category: driver_testing
  question: En un distrito comercial o residencial de Nebraska, ¿cuántos pies antes
    de dar una vuelta debe señalizar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: La ley de Nebraska exige que los conductores señalicen al menos 100
    pies antes de girar en un distrito comercial o residencial. En las carreteras,
    el requisito es de 500 pies.
- id: 44
  category: driver_testing
  question: El Manual del Conductor de Nebraska recomienda mantener una distancia
    de seguimiento de al menos ¿cuántos segundos detrás del vehículo que va delante
    de usted?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 5 segundos
    D: 10 segundos
