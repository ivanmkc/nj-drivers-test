- id: 85
  category: safe_driving_rules
  question: En Nebraska, ¿a cuántos pies de una señal de alto (stop), baliza intermitente
    o señal de control de tráfico no se debe estacionar?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Nebraska prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico ubicada al costado
