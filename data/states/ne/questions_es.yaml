- id: 55
  category: driver_responsibility
  question: Si usted se ve involucrado en un accidente de vehículo motorizado que
    deba ser reportado en Nebraska, ¿dentro de cuántos días debe presentar un informe
    por escrito al Departamento de Transporte?
  choices:
    A: 2 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: La ley de Nebraska exige que se presente un informe de accidente por
    escrito al Departamento de Transporte dentro de los 10 días posteriores al suceso.
- id: 56
  category: driver_responsibility
  question: Después de mudarse a Nebraska y establecer su residencia, ¿cuántos días
    tiene para registrar su vehículo motorizado en el estado?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes deben registrar sus vehículos motorizados ante
    el tesorero del condado dentro de los 30 días posteriores al establecimiento de
    la residencia en Nebraska.
- id: 57
  category: driver_responsibility
  question: En Nebraska, ¿cuál es la evaluación de puntos por una condena de "Conducción
    Temeraria Intencional" (Willful Reckless Driving) (Primera infracción)?
  choices:
    A: 1 punto
    B: 3 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Bajo el sistema de puntos de Nebraska, la Conducción Temeraria Intencional
    es una infracción grave que resulta en la asignación de 6 puntos en el historial
    del conductor.
- id: 58
  category: driver_responsibility
  question: Si a un conductor de Nebraska se le exige presentar una prueba de responsabilidad
    financiera (SR-22) tras una suspensión, ¿por cuánto tiempo debe mantener generalmente
    este registro?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: La ley de Nebraska generalmente requiere que un SR-22 (Certificado
    de Seguro) esté registrado durante tres años a partir de la fecha en que el conductor
    sea elegible para la restitución de su licencia.
- id: 59
  category: driver_responsibility
  question: 'Si es arrestado por conducir bajo los efectos del alcohol o drogas (DUI)
    en Nebraska y se niega a someterse a una prueba química de sangre, aliento u orina,
    su licencia será revocada administrativamente por:'
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: Bajo la ley de Revocación Administrativa de Licencia (ALR) de Nebraska,
    la negativa a someterse a una prueba química resulta en la revocación de la licencia
