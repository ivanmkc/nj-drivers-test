  choices:
    A: 15 pies
    B: 20 pies
    C: 25 pies
    D: 30 pies
  answer: B
  explanation: En Nebraska, no se puede estacionar a menos de 20 pies de un paso de
    peatones en una intersección.
- id: 82
  category: safe_driving_rules
  question: 'La ley de Nebraska exige el uso de los faros delanteros desde el atardecer
    hasta el amanecer y siempre que la visibilidad sea inferior a:'
  choices:
    A: 300 pies
    B: 400 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Los faros delanteros deben utilizarse desde el atardecer hasta el amanecer
    y en cualquier momento en que la visibilidad sea inferior a 500 pies debido al
    clima u otras condiciones.
- id: 83
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en un distrito comercial de Nebraska a
