metadata:
  source: Connecticut Driver's Manual (portal.ct.gov)
  total_questions: 364
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: 'According to the Connecticut driver''s manual, driving is considered:'
  choices:
    A: A constitutional right
    B: A privilege and not a right
    C: A right for anyone over 18
    D: An unconditional right for state residents
  answer: B
  explanation: The manual reminds all license holders that driving is a privilege
    and not a right.
- id: 2
  category: safe_driving_rules
  question: What has been noted as a contributing factor in many serious accidents
    in Connecticut?
  choices:
    A: Driving hybrid vehicles
    B: Distracted driving, including the use of phones
    C: Registering to vote at the DMV
    D: Using the Limited Licenses Program
  answer: B
  explanation: The Governor's message notes that distracted driving, including the
    use of phones while driving, has been a contributing factor in many serious accidents.
- id: 3
  category: license_system
  question: Connecticut recently imposed tougher teen driving laws and stiffer penalties
    for which age group?
  choices:
    A: 14- and 15-year-old drivers
    B: 16- and 17-year-old drivers
    C: 18- and 19-year-old drivers
    D: 21-year-old drivers
  answer: B
  explanation: The manual states that Connecticut imposed tougher teen driving laws
    for 16- and 17-year-old drivers to keep them safe as they learn.
- id: 4
  category: penalties_and_points
  question: What is the primary purpose of the tougher laws and stiffer penalties
    for teen drivers?
  choices:
    A: To generate revenue for the state
    B: To reduce crashes, injuries, and deaths
    C: To discourage teens from getting a license
    D: To increase the number of road tests
  answer: B
  explanation: The laws and penalties are in place to help reduce crashes, injuries,
    and deaths.
- id: 5
  category: safe_driving_rules
  question: What does the Governor's message ask all drivers to do to ensure safety
    on the road?
  choices:
    A: Only drive during daylight hours
    B: Buckle up, because seatbelts save lives
    C: Never drive with passengers
    D: Only use hands-free devices
  answer: B
  explanation: 'The message explicitly states: "Remember, please buckle up. Seatbelts
    save lives."'
- id: 6
  category: driver_responsibility
  question: Is the Connecticut Driver's Manual a precise statement of the Connecticut
    General Statutes?
  choices:
    A: Yes, it contains the exact legal wording of all traffic laws.
    B: No, it only attempts to provide a general familiarity with safe and lawful
      operation.
    C: Yes, but only for drivers under 18.
    D: No, it only covers federal driving laws.
  answer: B
  explanation: The manual states that its contents are not a precise statement of
    the Connecticut General Statutes, but rather attempt to provide a general familiarity
    with safe and lawful operation.
- id: 7
  category: driver_responsibility
  question: Where should a driver look to find the specific wording of a Connecticut
    motor vehicle law?
  choices:
    A: The Table of Contents
    B: The most recent edition of the General Statutes
    C: The American Association of Motor Vehicle Administrators guide
    D: The Limited Licenses Program brochure
  answer: B
  explanation: The manual advises readers to use the most recent edition of the General
    Statutes for finding the specific wording in a law.
- id: 8
  category: vehicle_information
  question: Which organization assisted the Connecticut Department of Motor Vehicles
    in compiling the driver's manual?
  choices:
    A: The American Association of Motor Vehicle Administrators
    B: The Connecticut Department of Transportation
    C: The Federal Highway Administration
    D: The National Highway Traffic Safety Administration
  answer: A
  explanation: The manual was compiled by the Connecticut DMV with the assistance
    of the American Association of Motor Vehicle Administrators.
- id: 9
  category: license_system
  question: According to the manual's Table of Contents, what specific training requirement
    exists for 16- and 17-year-old applicants in addition to driver education?
  choices:
    A: Advanced Highway Training
    B: Parent Training Requirements
    C: Commercial Driver Training
    D: Night Driving Certification
  answer: B
  explanation: The Table of Contents lists "Parent Training Requirements" under the
    section for 16- and 17-Year-Old Applicants.
- id: 10
  category: license_system
  question: Based on the Table of Contents, what program is available under "Services
    for Drivers with Disabilities"?
  choices:
    A: The Unlimited Licenses Program
    B: The Limited Licenses Program
    C: The Green Driving Program
    D: The Space Cushion Program
  answer: B
  explanation: The Table of Contents lists the "Limited Licenses Program" under "Services
    for Drivers with Disabilities."
- id: 11
  category: driver_responsibility
  question: Who is the Governor of Connecticut that provided the introductory message
    in the revised March 2023 manual?
  choices:
    A: Antonio Guerrera
    B: Ned Lamont
    C: Tony Guerrera
    D: The Commissioner of Motor Vehicles
  answer: B
  explanation: The introductory message is from Governor Ned Lamont and Commissioner
    Antonio "Tony" Guerrera.
- id: 12
  category: license_system
  question: According to the Table of Contents, which age group of drivers has specific
    "Restrictions" outlined in Chapter 1?
  choices:
    A: 16- and 17-Year-Old Drivers
    B: Drivers 18 Years of Age or Older
    C: First Time Drivers over 21
    D: Drivers with Disabilities
  answer: A
  explanation: Chapter 1 of the Table of Contents includes a section titled "Restrictions
    for 16- and 17-Year-Old Drivers."
- id: 13
  category: driver_responsibility
  question: What is the primary goal of the Connecticut Driver's Manual?
  choices:
    A: To provide a precise statement of the Connecticut General Statutes
    B: To provide a general familiarity with the principles of safe and lawful operation
      of a motor vehicle
    C: To replace the need for a driver's education course
    D: To serve as a legal defense in traffic court
  answer: B
  explanation: The manual states it "attempts to provide a general familiarity with
    the principles of safe and lawful operation of a motor vehicle."
- id: 14
  category: vehicle_information
  question: When was this specific edition of the Connecticut Driver's Manual revised?
  choices:
    A: January 2022
    B: March 2023
    C: July 2021
    D: December 2023
  answer: B
  explanation: The text indicates the manual was "Revised March 2023."
- id: 15
  category: defensive_driving
  question: According to the Governor's message, what does driving require at all
    times?
  choices:
    A: Complete concentration
    B: A hands-free device
    C: A passenger to assist with navigation
    D: The use of cruise control
  answer: A
  explanation: The message states, "Driving is a constant learning experience and
    it takes complete concentration at all times."
- id: 16
  category: license_system
  question: In Connecticut, what class is a standard non-commercial driver's license
    designated as?
  choices:
    A: Class A
    B: Class C
    C: Class D
    D: Class M
  answer: C
  explanation: According to the manual, a non-commercial driver's license is known
    and designated as Class D.
- id: 17
  category: license_system
  question: 'Unless restrictions appear on the license, a Class D license allows you
    to operate any motor vehicle EXCEPT:'
  choices:
    A: A passenger vehicle
    B: A commercial motor vehicle
    C: A sport utility vehicle
    D: A minivan
  answer: B
  explanation: The manual states that unless restrictions appear on the license, a
    Class D license may be used to operate any motor vehicle except a commercial motor
    vehicle.
- id: 18
  category: license_system
  question: If you want a license to drive a commercial or public service vehicle,
    such as a truck or bus, which manual must you read?
  choices:
    A: The Motorcycle Operator's manual
    B: The Class D Driver's manual
    C: The Commercial Driver's License (CDL) manual
    D: The Public Transit manual
  answer: C
  explanation: The text specifies that if you want a license to drive a commercial
    or public service vehicle, you need to read the Commercial Driver's License (CDL)
    manual.
- id: 19
  category: license_system
  question: What is required in addition to reading the Motorcycle Operator's manual
    if you want to drive a motorcycle?
  choices:
    A: A Class D restriction
    B: A commercial driver's license
    C: A motorcycle endorsement
    D: A youth operator permit
  answer: C
  explanation: The manual states that if you want an endorsement to drive a motorcycle,
    you need to read the Motorcycle Operator's manual.
- id: 20
  category: safe_driving_rules
  question: According to the manual, what is the number one cause of death for 15-19
    year-old teenagers?
  choices:
    A: Drug overdoses
    B: Motor vehicle crashes
    C: Sports injuries
    D: Alcohol poisoning
  answer: B
  explanation: 'The manual explicitly states under ''Crashes Kill Teens'' that motor
    vehicle crashes are the #1 cause of death for 15-19 year-old teenagers.'
- id: 21
  category: defensive_driving
  question: During what period do most teen crashes occur?
  choices:
    A: During the first six weeks of having a permit
    B: During the first two years of having their license
    C: After five years of driving experience
    D: Only when driving at night
  answer: B
  explanation: The text notes that most teen crashes occur during the first two years
    of having their license.
- id: 22
  category: defensive_driving
  question: Which period is considered the most dangerous for a newly licensed teen
    driver?
  choices:
    A: The first six months
    B: The first year
    C: The second year
    D: The first month
  answer: A
  explanation: According to the manual, the first six months are the most dangerous
    for the newly licensed teen.
- id: 23
  category: driver_testing
  question: Where should you go to find a list of required documents to apply for
    a learner's permit and to make a knowledge test appointment online?
  choices:
    A: A local police station
    B: ct.gov/teendriving
    C: ct.gov/dmv
    D: The Commercial Driver's License manual
  answer: C
  explanation: The manual instructs readers to visit ct.gov/dmv for a list of required
    documents to apply for a learner's permit and to make a knowledge test appointment
    online.
- id: 24
  category: driver_responsibility
  question: Which website does the DMV Commissioner's Advisory Committee on Teen Safe
    Driving want parents to visit?
  choices:
    A: ct.gov/dmv
    B: ct.gov/teendriving
    C: ct.gov/safety
    D: ct.gov/parents
  answer: B
  explanation: The text states that the DMV Commissioner's Advisory Committee on Teen
    Safe Driving wants parents to visit ct.gov/teendriving.
- id: 25
  category: driver_responsibility
  question: What does the manual recommend parents provide as much of as possible
    during the licensing period?
  choices:
    A: Financial support for insurance
    B: Supervised practice
    C: Advanced driving courses
    D: A safe, new vehicle
  answer: B
  explanation: The manual advises parents to 'Provide as much supervised practice
    as you can during the licensing period.'
- id: 26
  category: safe_driving_rules
  question: According to the manual's table of contents, which chapter covers 'Road
    Safety'?
  choices:
    A: Chapter 3
    B: Chapter 4
    C: Chapter 5
    D: Chapter 6
  answer: B
  explanation: 'The table of contents lists ''CHAPTER 4: ROAD SAFETY''.'
- id: 27
  category: signs_and_signals
  question: Based on the table of contents, where would you look to find information
    on 'Pavement Markings' and 'Traffic Signals'?
  choices:
    A: 'Chapter 4: Road Safety'
    B: 'Chapter 5: Know the Road'
    C: 'Chapter 6: DMV Consumer Directory'
    D: Avoiding the Risks
  answer: B
  explanation: 'The table of contents lists ''Pavement Markings'' and ''Traffic Signals''
    under ''CHAPTER 5: KNOW THE ROAD''.'
- id: 28
  category: penalties_and_points
  question: According to the table of contents, what program exists for repeat offenders?
  choices:
    A: Operator Retraining Program
    B: Youthful Offender Status Program
    C: Defensive Driving Initiative
    D: License Revocation Program
  answer: A
  explanation: The table of contents includes a section titled 'Operator Retraining
    Program for Repeat Offenders'.
- id: 29
  category: penalties_and_points
  question: Which of the following topics is listed under the 'Your License and the
    Law' section in the table of contents?
  choices:
    A: Roundabouts
    B: Pavement Markings
    C: Youthful Offender Status
    D: Vehicle Emergencies
  answer: C
  explanation: In the table of contents, 'Youthful Offender Status' is listed directly
    under the 'Your License and the Law' section.
- id: 30
  category: driver_responsibility
  question: What biological factor is mentioned as being researched in relation to
    teen driving?
  choices:
    A: Vision development
    B: Reflex speed
    C: Brain development
    D: Muscle memory
  answer: C
  explanation: The text includes a bullet point specifically titled 'Brain Development'
    when discussing research related to teen driving.
- id: 31
  category: driver_responsibility
  question: Research shows that the portion of the brain that assesses risk and danger
    does not fully develop until what age?
  choices:
    A: 18 years old
    B: 21 years old
    C: Mid-20s
    D: Early 30s
  answer: C
  explanation: Research shows that the portion of the brain that assesses risk and
    danger does not fully develop until the mid 20's.
- id: 32
  category: alcohol_drugs_health
  question: What is Connecticut's policy on teens drinking and driving?
  choices:
    A: A 0.08% BAC limit
    B: A Zero-Tolerance Law
    C: A warning for the first offense
    D: Allowed if accompanied by a parent
  answer: B
  explanation: Connecticut has a Zero-Tolerance Law for teens drinking and driving.
    Even one drink impairs a teen's driving ability.
- id: 33
  category: license_system
  question: What course is required for anyone, regardless of age, who has not previously
    held a license in Connecticut or another state?
  choices:
    A: A 4-hour defensive driving course
    B: An 8-hour Safe Driving Practices course
    C: A 12-hour behind-the-wheel course
    D: A 2-hour parent training course
  answer: B
  explanation: Connecticut law requires anyone who has not previously held a license
    to take an 8-hour Safe Driving Practices course at a Connecticut Commercial Driving
    School before obtaining a license.
- id: 34
  category: license_system
  question: What is the minimum age required to obtain a learner's permit in Connecticut?
  choices:
    A: 15 years of age
    B: 15 and a half years of age
    C: 16 years of age
    D: 17 years of age
  answer: C
  explanation: To obtain a learner's permit, you must be at least 16 years of age.
- id: 35
  category: license_system
  question: How long is a Connecticut learner's permit valid?
  choices:
    A: 6 months from the date of issue
    B: 1 year from the date of issue
    C: Until you obtain a driver's license or 2 years from the date it is issued
    D: Until the driver turns 18
  answer: C
  explanation: The permit will be valid until you obtain a driver's license or 2 years
    from the date it is issued (whichever comes first).
- id: 36
  category: driver_testing
  question: How many questions must you answer correctly to pass the knowledge test
    for a learner's permit?
  choices:
    A: 15 out of 20
    B: 18 out of 25
    C: 20 out of 25
    D: 25 out of 25
  answer: C
  explanation: The knowledge test consists of 25 questions and you need 20 correct
    answers to pass.
- id: 37
  category: driver_testing
  question: What is the minimum vision requirement for all classes of license in Connecticut?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: The minimum vision requirements for all classes of license are at least
    20/40 with or without glasses or contact lenses.
- id: 38
  category: driver_testing
  question: If an applicant is blind in one eye, what are the vision requirements
    for the other eye?
  choices:
    A: 20/20 with a 120-degree visual field
    B: 20/40 with a minimal visual field of 100 degrees or more
    C: 20/30 with a minimal visual field of 90 degrees
    D: They cannot obtain a driver's license
  answer: B
  explanation: If the applicant is blind in one eye, the other eye must be at least
    20/40 with a minimal visual field of 100 degrees or more.
- id: 39
  category: penalties_and_points
  question: What may happen if your driver's license says you must wear corrective
    lenses and you are stopped by law enforcement while not wearing them?
  choices:
    A: You will be given a verbal warning
    B: Your vehicle will be impounded
    C: You may be issued a citation
    D: Your license will be permanently revoked
  answer: C
  explanation: If your driver's license says you must wear corrective lenses and you
    are stopped by a law enforcement officer while not wearing them, you may be issued
    a citation.
- id: 40
  category: safe_driving_rules
  question: Where must the qualified trainer sit when giving instruction to a learner's
    permit holder?
  choices:
    A: In the back seat directly behind the driver
    B: In the front passenger seat next to the learner
    C: Anywhere in the vehicle as long as they can see the road
    D: In the back seat on the passenger side
  answer: B
  explanation: The person giving instruction to the learner's permit holder must sit
    in the front passenger seat next to the learner and must be alert and ready to
    take over control.
- id: 41
  category: license_system
  question: If a 16- or 17-year-old learner's permit holder is being instructed by
    someone other than a licensed driving instructor, what qualifications must that
    person meet?
  choices:
    A: At least 18 years old and held a license for 2 years
    B: At least 20 years old, held a license for 4 consecutive years with no suspensions
      in the prior 4 years
    C: At least 21 years old and held a license for 5 years
    D: At least 25 years old with a clean driving record
  answer: B
  explanation: The instructor must be at least 20 years old, have held a driver's
    license for four or more consecutive years, and not have had their license suspended
    during the four years prior to training.
- id: 42
  category: license_system
  question: How many hours of instruction must a parent or legal guardian complete
    with their 16- or 17-year-old teen who obtains a learner's permit?
  choices:
    A: 2 hours
    B: 4 hours
    C: 6 hours
    D: 8 hours
  answer: A
  explanation: A parent or legal guardian of a 16- or 17-year-old who obtains a learner's
    permit is required to complete two hours of instruction with his or her teen concerning
    the laws governing drivers under age 18 and the dangers of teen driving.
- id: 43
  category: safe_driving_rules
  question: According to the manual, which age group has the lowest rate of seatbelt
    use?
  choices:
    A: Children under 12
    B: Teens
    C: Adults ages 25-35
    D: Senior citizens
  answer: B
  explanation: The manual states under 'Require Your Teen to Buckle Up' that teens
    have the lowest rate of seatbelt use.
- id: 44
  category: driver_testing
  question: What do studies show regarding the driving records of hearing-impaired
    drivers?
  choices:
    A: They have significantly more crashes than other drivers
    B: They are restricted to daytime driving only
    C: Their driving records are just as good as those drivers with good hearing
    D: They must wear hearing aids while driving by law
  answer: C
  explanation: Studies have shown that the driving records of hearing-impaired drivers
    are just as good as those drivers with good hearing because they learn to rely
    more on their vision and tend to stay more alert.
- id: 45
  category: license_system
  question: How long must a 16- or 17-year-old applicant wait to take the road test
    if they successfully complete driver education through a commercial driving school?
  choices:
    A: 90 days
    B: 120 days
    C: 180 days
    D: 6 months
  answer: B
  explanation: According to the manual, applicants who successfully complete driver
    education through a commercial driving school or a secondary school must wait
    120 days after the issuance of the learner's permit before taking the road test.
- id: 46
  category: license_system
  question: What is the required waiting period before taking the road test for an
    applicant who is 18 years of age or older?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: The manual states that a person 18 years of age or older must obtain
    and hold a learner's permit for at least 90 days prior to taking a road test.
- id: 47
  category: driver_testing
  question: Who is qualified to act as an instructor for the Home Training Program?
  choices:
    A: Anyone who is at least 18 years old with a valid license.
    B: A person at least 20 years old who has held a license for four or more years
      without suspension.
    C: Any licensed driver who has been driving for at least two years.
    D: A person at least 21 years old who has a clean driving record for one year.
  answer: B
  explanation: Applicants for home training must train with an instructor who is at
    least 20 years of age or older, and who has held a license for four or more years
    prior to training, which has not been suspended during the four year period.
- id: 48
  category: driver_responsibility
  question: How many hours of behind-the-wheel, on-the-road training are required
    for all 16- or 17-year-old applicants?
  choices:
    A: 20 hours
    B: 30 hours
    C: 40 hours
    D: 50 hours
  answer: C
  explanation: The manual specifies that all applicants who are 16 or 17 years of
    age must have at least 40 hours of behind-the-wheel, on-the-road training.
- id: 49
  category: driver_testing
  question: What happens if the vehicle you bring for your road test is found to be
    in an unsafe operating condition?
  choices:
    A: You will be charged a $50 penalty fee.
    B: The test will be conducted only in a parking lot.
    C: You must rent a vehicle from the DMV.
    D: No evaluation will be conducted and you will reschedule for no fee.
  answer: D
  explanation: If the test vehicle is found to be in an unsafe operating condition,
    no behind-the-wheel evaluation will be conducted; the applicant will reschedule
    the road test for no fee.
- id: 50
  category: alcohol_drugs_health
  question: The mandatory eight-hour safe driving course includes a minimum of how
    many hours focused on the effects of alcohol and drugs?
  choices:
    A: Two hours
    B: Four hours
    C: Six hours
    D: Eight hours
  answer: B
  explanation: The eight-hour course includes a minimum of four hours on the nature
    and the medical, biological and physiological effects of alcohol and drugs and
    their impact on the operator of a motor vehicle.
- id: 51
  category: driver_testing
  question: Which of the following is a requirement before shifting the car into gear
    from the 'park' position during your road test?
  choices:
    A: Honk the horn twice.
    B: Turn on the hazard lights.
    C: Apply the brake.
    D: Roll down the driver's side window.
  answer: C
  explanation: During your test, you should remember to apply the brake before you
    shift the car into gear from the 'park' position.
- id: 52
  category: license_system
  question: What is the required fee for a driver's license after you pass the road
    test?
  choices:
    A: $40
    B: $65
    C: $84
    D: $120
  answer: C
  explanation: 'Under ''To Begin the Road Test You Will Need'', the manual states:
    ''License Fees. You must pay $84 for a license after you pass the road test.'''
- id: 53
  category: driver_responsibility
  question: What must a parent or legal guardian of a 16- or 17-year-old learner's
    permit holder complete?
  choices:
    A: A four-hour defensive driving course.
    B: Two hours of instruction concerning teen driving laws and dangers.
    C: A written exam at the DMV.
    D: 40 hours of certified instructor training.
  answer: B
  explanation: A parent or legal guardian of a teen who obtains a learner's permit
    is required to complete two hours of instruction concerning the laws governing
    drivers under age 18 and the dangers of teen driving.
- id: 54
  category: vehicle_information
  question: Can a rented vehicle be used for a road test?
  choices:
    A: Yes, under all circumstances.
    B: Yes, but only if you pay an extra fee.
    C: No, unless you already have a valid driver's license.
    D: No, rented vehicles are strictly prohibited for any DMV test.
  answer: C
  explanation: 'The manual states: ''If you do not have a valid driver''s license
    you cannot test in a rented vehicle.'''
- id: 55
  category: license_system
  question: After passing the road test and paying for your license at the DMV, how
    will you receive your permanent driver's license card?
  choices:
    A: It will be printed and handed to you immediately at the office.
    B: It will arrive through the mail within 20 days.
    C: You must return to the DMV after 7 days to pick it up.
    D: It will be emailed to you as a digital copy.
  answer: B
  explanation: Qualified applicants will receive a temporary paper card at the office.
    The permanent license card will arrive through the mail within 20 days.
- id: 56
  category: driver_testing
  question: During the road test, the agent or inspector will evaluate your ability
    to operate vehicle equipment. Which of the following is specifically mentioned
    as equipment you must be able to operate?
  choices:
    A: The GPS navigation system
    B: The radio and sound system
    C: Windshield wipers and washers
    D: The cruise control function
  answer: C
  explanation: The road test evaluates the operation of vehicle equipment such as
    windshield wipers and washers, heater and defroster, parking brake, headlights
    and high beams, and the horn.
- id: 57
  category: defensive_driving
  question: What should you maintain around your vehicle that is appropriate for the
    existing speed, road, and traffic conditions?
  choices:
    A: A constant speed of 45 mph
    B: A space cushion
    C: High beam headlights
    D: A minimum of three passengers
  answer: B
  explanation: During your test, you should remember to maintain a 'space cushion'
    around your vehicle that is appropriate for the existing speed, road, and traffic
    conditions.
- id: 58
  category: license_system
  question: If a 16- or 17-year-old applicant does not complete driver education through
    a commercial or secondary school, how long must they wait after the issuance of
    a learner's permit before taking the driver's exam?
  choices:
    A: 90 days
    B: 120 days
    C: 150 days
    D: 180 days
  answer: D
  explanation: Applicants who successfully complete driver education through a commercial
    or secondary school wait 120 days. All other applicants must wait 180 days after
    the issuance of the learner's permit before taking the driver's exam.
- id: 59
  category: license_system
  question: Are 16- and 17-year-old licensed drivers from out-of-state required to
    take the eight-hour safe driving course to obtain a Connecticut license?
  choices:
    A: No, their out-of-state license waives all requirements.
    B: Yes, this eight-hour course requirement is necessary for them.
    C: Only if they have had a previous license suspension.
    D: No, they only need to take a two-hour parent training class.
  answer: B
  explanation: 'The manual explicitly states: ''This eight-hour course requirement
    is also necessary for 16- and 17-year-old licensed drivers from out-of-state who
    wish to obtain a license in Connecticut.'''
- id: 60
  category: license_system
  question: After qualifying for a driver's license at the DMV, how long does it typically
    take for the permanent license card to arrive through the mail?
  choices:
    A: Within 10 days
    B: Within 20 days
    C: Within 30 days
    D: Within 60 days
  answer: B
  explanation: According to the manual, the permanent license card will arrive through
    the mail within 20 days.
- id: 61
  category: license_system
  question: During the first six months of being licensed, a 16- or 17-year-old driver
    may transport which of the following passengers?
  choices:
    A: Any family member
    B: Up to three friends
    C: A licensed driving instructor
    D: Anyone over the age of 18
  answer: C
  explanation: During the first six months, newly licensed 16- and 17-year-old drivers
    may not have any passengers except for a licensed driving instructor, parents/legal
    guardians, or a qualified 20-year-old driver.
- id: 62
  category: license_system
  question: If a 16- or 17-year-old driver transports a 20-year-old passenger during
    their first six months of licensing, what requirement must the passenger meet?
  choices:
    A: They must be an immediate family member.
    B: They must have held a license for at least four consecutive years with no suspensions
      in that time.
    C: They must be a certified driving instructor.
    D: They must own the vehicle being driven.
  answer: B
  explanation: The manual states the passenger must be at least 20 years old, have
    held a driver's license for four or more consecutive years, and have no license
    suspensions during the four years preceding the transport.
- id: 63
  category: license_system
  question: During the second six months of licensing (months seven through twelve),
    who are the only additional passengers allowed in a 16- or 17-year-old driver's
    vehicle?
  choices:
    A: Members of the driver's immediate family
    B: Friends who also have a driver's license
    C: Coworkers traveling to the same job
    D: Anyone over the age of 21
  answer: A
  explanation: During the second six months (months seven through twelve), the only
    additional passengers allowed in the vehicle are members of the driver's immediate
    family.
- id: 64
  category: safe_driving_rules
  question: What are the standard hour restrictions (curfew) for 16- and 17-year-old
    drivers?
  choices:
    A: 9 p.m. to 6 a.m.
    B: 10 p.m. to 5 a.m.
    C: 11 p.m. to 5 a.m.
    D: Midnight to 6 a.m.
  answer: C
  explanation: The curfew for 16- and 17-year-old drivers is 11 p.m. to 5 a.m., unless
    a specific exception applies.
- id: 65
  category: safe_driving_rules
  question: Which of the following is a valid exception to the curfew restrictions
    for a 16- or 17-year-old driver?
  choices:
    A: Traveling to a friend's house
    B: Traveling for employment or school
    C: Going to a late-night movie
    D: Running errands for a parent
  answer: B
  explanation: The curfew does not apply if the teen is traveling for employment,
    school, religious activities, medical necessity, or is an assigned driver in the
    Safe Ride Program.
- id: 66
  category: driver_responsibility
  question: What is the rule regarding cell phone use for 16- and 17-year-old licensed
    drivers?
  choices:
    A: They may use a cell phone only if it is hands-free.
    B: They may use a cell phone for GPS purposes only.
    C: They may NOT use a cell phone or mobile electronic device while driving.
    D: They may use a cell phone only when stopped at a red light.
  answer: C
  explanation: Learner's permit holders and 16- and 17-year-old licensed drivers may
    NOT use a cell phone (even if it is hands-free) or mobile electronic device while
    driving.
- id: 67
  category: license_system
  question: How long must a 16- or 17-year-old wait after the issuance of a motorcycle
    endorsement before they can transport any passenger on a motorcycle?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: 16- and 17-year-old licensed drivers may NOT transport any passenger
    on a motorcycle for six months after the issuance of a motorcycle endorsement.
- id: 68
  category: license_system
  question: What is the fee to be registered as an organ and tissue donor when obtaining
    or renewing your license?
  choices:
    A: $10.00
    B: $15.00
    C: $30.00
    D: There is no fee
  answer: D
  explanation: The manual states, 'Just so you know, there is "no fee" to be registered
    as an organ and tissue donor.'
- id: 69
  category: license_system
  question: When you apply for voter registration through the DMV, approximately how
    long will it take to receive a confirmation notice from the registrar of voters?
  choices:
    A: 1 week
    B: 2 weeks
    C: 3 weeks
    D: 4 weeks
  answer: C
  explanation: You should receive a confirmation notice in approximately three (3)
    weeks from the registrar of voters in your city or town of residence.
- id: 70
  category: license_system
  question: If a driver is issued a limited license with a daylight restriction, when
    are they permitted to drive?
  choices:
    A: From sunrise to sunset
    B: Beginning a half an hour before sunrise and ending a half an hour after sunset
    C: Between 6 a.m. and 6 p.m.
    D: Beginning one hour before sunrise and ending one hour after sunset
  answer: B
  explanation: A limited license may restrict operation to the period of daylight
    beginning a half an hour before sunrise and ending a half an hour after sunset.
- id: 71
  category: vehicle_information
  question: A limited license may require a vehicle to be equipped with external mirrors
    that reflect a view of the highway at least how far to the rear?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: A limited license may require external mirrors located on both the
    left and right sides of the vehicle to reflect a view of the highway at least
    200 feet to the rear.
- id: 72
  category: vehicle_information
  question: What could it indicate if your vehicle pulls to one side when the brake
    is applied?
  choices:
    A: Your tires are overinflated.
    B: There is a problem in the braking system.
    C: Your steering fluid is low.
    D: Your headlights are out of alignment.
  answer: B
  explanation: If the vehicle pulls to one side when the brake is applied, this would
    indicate a problem in the braking system and that it should be serviced.
- id: 73
  category: vehicle_information
  question: What is a consequence of driving with unbalanced tires and low tire pressure?
  choices:
    A: Improved fuel economy
    B: Faster tire wear and reduced fuel economy
    C: Easier steering and stopping
    D: Decreased stopping distance
  answer: B
  explanation: Unbalanced tires and low-pressure cause faster tire wear, reduce fuel
    economy, and make the vehicle harder to steer and stop.
- id: 74
  category: vehicle_information
  question: Why is it important to have a damaged windshield replaced?
  choices:
    A: It will cause the windshield wipers to malfunction.
    B: It can break very easily in a minor collision or when something hits it.
    C: It reduces the fuel efficiency of the vehicle.
    D: It causes the vehicle to pull to one side.
  answer: B
  explanation: Damaged glass can break very easily in a minor collision or when something
    hits the windshield. Have a damaged windshield replaced.
- id: 75
  category: vehicle_information
  question: How can you check if your tires have a safe amount of tread using the
    'penny test'?
  choices:
    A: If Lincoln's head is completely visible above the tread.
    B: If any part of Lincoln's head is covered by the tread.
    C: If the penny falls completely into the groove.
    D: If the tread touches the bottom edge of the penny.
  answer: B
  explanation: According to the manual, when using the penny test, if any part of
    Lincoln's head is covered by the tread, you're driving with the safe amount of
    tread.
- id: 76
  category: vehicle_information
  question: If your vehicle fails an emissions inspection, how long do you have to
    get the problem fixed and rechecked?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: The manual states that if the vehicle does not pass the emissions inspection,
    you will be given 60 days to have the problem fixed and the emissions rechecked.
- id: 77
  category: safe_driving_rules
  question: Why is it dangerous to leave your vehicle's motor running in a closed
    garage?
  choices:
    A: It will quickly drain the vehicle's battery.
    B: It can cause the engine to overheat and catch fire.
    C: Gases from a leaky exhaust can cause death in a very short time.
    D: It will cause the suspension system to wear out faster.
  answer: C
  explanation: The manual warns that gases from a leaky exhaust can cause death inside
    a vehicle in a very short time, and you should never run the motor in a closed
    garage.
- id: 78
  category: vehicle_information
  question: What is a good rule of thumb for adjusting your side mirrors?
  choices:
    A: You should see the entire side of your vehicle while sitting normally.
    B: You should set them so that when you lean forward slightly, you can see the
      side of your vehicle.
    C: You should angle them down to clearly see the rear tires.
    D: You should adjust them outward to completely eliminate the blind spot.
  answer: B
  explanation: A good adjustment for the side mirrors is to set them so that when
    you lean forward slightly, you can see the side of your vehicle.
- id: 79
  category: penalties_and_points
  question: In Connecticut, what is the fine if a driver or passenger fails to wear
    a seat belt?
  choices:
    A: $50
    B: $75
    C: $100
    D: $150
  answer: B
  explanation: If either the driver or the passenger fails to wear the seat belt,
    each could be cited for a seat belt violation and fined $75.
- id: 80
  category: safe_driving_rules
  question: What is the child restraint requirement for a child under age 2, or weighing
    less than 30 pounds?
  choices:
    A: A forward-facing child restraint with a 5-point harness.
    B: A booster seat secured with a standard seat belt.
    C: A rear-facing-only car seat or rear-facing convertible seat with a 5-point
      harness.
    D: Any child restraint system placed in the front passenger seat.
  answer: C
  explanation: State law requires children under age 2, or weighing less than 30 pounds,
    to be in a rear-facing-only car seat or rear-facing convertible seat with a 5-point
    harness.
- id: 81
  category: safe_driving_rules
  question: If a child's age and weight fall into two different restraint requirement
    categories, which rule applies?
  choices:
    A: The less restrictive requirement applies.
    B: The more restrictive requirement applies.
    C: The requirement based on weight always applies.
    D: The requirement based on age always applies.
  answer: B
  explanation: If a child's age and weight fall in two different categories, the manual
    states that the more restrictive requirement applies.
- id: 82
  category: driver_responsibility
  question: Which of the following is a true statement regarding seat belts and crashes?
  choices:
    A: You are better off being thrown clear of the crash.
    B: Over half of all traffic deaths happen within 25 miles of home.
    C: You can easily brace yourself for a head-on crash at 25 mph.
    D: If struck from the side, you will slide away from the point of the crash.
  answer: B
  explanation: Addressing misconceptions about seat belts, the manual notes that over
    half of all traffic deaths happen within 25 miles of home.
- id: 83
  category: safe_driving_rules
  question: According to Connecticut state law, do you need to wear a seat belt if
    your vehicle is equipped with airbags?
  choices:
    A: No, airbags provide sufficient protection in all types of crashes.
    B: Yes, because airbags do not protect you if you are hit from the side, rear,
      or if the vehicle rolls over.
    C: No, unless you are driving on the highway at high speeds.
    D: Yes, but only the lap belt is required when airbags are present.
  answer: B
  explanation: State law requires safety belts to be worn even with airbags, because
    airbags do not protect you if you are hit from the side or rear or if the vehicle
    rolls over.
- id: 84
  category: vehicle_information
  question: Where can you find the recommended tire pressure (psi) for your vehicle?
  choices:
    A: On the sidewall of the tire itself.
    B: In the vehicle owner's manual or the driver's side door jamb.
    C: On the vehicle's registration card.
    D: On the dashboard instrument panel.
  answer: B
  explanation: You can check tire pressure using the recommended psi located in the
    vehicle owner's manual or the driver's side door jamb of the vehicle.
- id: 85
  category: safe_driving_rules
  question: Why is it important to ensure there are no loose objects on the floor
    of your vehicle?
  choices:
    A: They can reduce the vehicle's overall fuel economy.
    B: They can roll under the brake pedal and prevent you from stopping the vehicle.
    C: They can interfere with the vehicle's suspension system.
    D: They can cause the steering wheel to shake at high speeds.
  answer: B
  explanation: Make sure there are no objects on the floor that could roll under the
    brake pedal and prevent you from stopping the vehicle.
- id: 86
  category: safe_driving_rules
  question: Under Connecticut law, where is it prohibited to place a rear-facing child
    restraint system?
  choices:
    A: In the back seat behind the driver.
    B: In the middle of the back seat.
    C: In the front seat of a vehicle with a functional passenger side airbag.
    D: In any vehicle that does not have side-curtain airbags.
  answer: C
  explanation: The law prohibits the placement of a rear-facing child restraint system
    in the front seat of a vehicle with a functional passenger side airbag.
- id: 87
  category: defensive_driving
  question: In addition to protecting you from injury, how else do safety belts help
    you as a driver?
  choices:
    A: They improve your vehicle's fuel efficiency.
    B: They help you keep control of the vehicle if struck from the side.
    C: They prevent the vehicle from hydroplaning on wet roads.
    D: They reduce the wear on your suspension system.
  answer: B
  explanation: In addition to protecting yourself from injury, safety belts help you
    keep control of the vehicle. If struck from the side, the force could push you
    sideways, and you cannot steer if you are not behind the wheel.
- id: 88
  category: safe_driving_rules
  question: According to the manual, what is the proper use of your vehicle's horn?
  choices:
    A: To greet other drivers or pedestrians on the road.
    B: To express frustration in heavy traffic.
    C: Only to be used as a warning to others.
    D: To signal that you are about to park your vehicle.
  answer: C
  explanation: The horn may not seem like it is important for safety, but it could
    save your life as a warning device. Only use your horn as a warning to others.
- id: 89
  category: vehicle_information
  question: What is a potential consequence of driving with worn or bald tires?
  choices:
    A: Increased stopping distance and increased effect of hydroplaning.
    B: Decreased stopping distance and improved fuel economy.
    C: Reduced chance of having a flat tire.
    D: Easier turning when the road is wet.
  answer: A
  explanation: Worn or bald tires can increase your stopping distance, make turning
    more difficult when wet, increase the effect of hydroplaning, and increase the
    chance of a flat tire.
- id: 90
  category: defensive_driving
  question: When a vehicle is struck from the side, in which direction will unfastened
    items and passengers slide?
  choices:
    A: Away from the point of the crash
    B: Toward the point of the crash
    C: Toward the front windshield
    D: They will remain stationary
  answer: B
  explanation: According to the manual, when a vehicle is struck from the side, everything
    in the vehicle that is not fastened down will slide toward the point of crash,
    not away from it.
- id: 91
  category: safe_driving_rules
  question: 'The force of a head-on crash at 25 mph is equivalent to:'
  choices:
    A: Falling off a bicycle at a slow speed
    B: Jumping from a moving vehicle at 10 mph
    C: Diving off a three-story building onto the sidewalk
    D: Hitting a brick wall at 50 mph
  answer: C
  explanation: The manual states that even at 25 mph, the force of a head-on crash
    is the same as pedaling a bicycle full-speed into a brick wall or diving off a
    three-story building onto the sidewalk.
- id: 92
  category: driver_responsibility
  question: Are 16- or 17-year-old drivers permitted to use a hands-free mobile electronic
    device while driving?
  choices:
    A: Yes, hands-free devices are permitted for all ages.
    B: Yes, but only if they are calling a parent or guardian.
    C: No, unless they are temporarily stopped at a red light.
    D: No, they are not permitted to use any type of cell phone or mobile electronic
      device.
  answer: D
  explanation: The manual explicitly states that drivers who are 16 or 17 years of
    age are not permitted to use any type of cell phone or mobile electronic device,
    including a hands-free device.
- id: 93
  category: safe_driving_rules
  question: Under what circumstance may a driver of any age use a cell phone or mobile
    electronic device while driving?
  choices:
    A: When stopped in heavy traffic
    B: In an emergency situation to contact an emergency response operator
    C: When checking GPS directions
    D: When stopped at a traffic control signal
  answer: B
  explanation: The exception to the cell phone requirement for a driver of any age
    is an emergency situation, when contacting an emergency response operator, a hospital,
    physician's office, health clinic, ambulance company, or fire/police department.
- id: 94
  category: penalties_and_points
  question: What is the penalty for an operator under the age of 18 who is convicted
    of violating the cell phone law?
  choices:
    A: A written warning for the first offense
    B: A fine of $500 only
    C: A license suspension and a moving violation
    D: Immediate vehicle impoundment
  answer: C
  explanation: Any 16- or 17-year-old found violating Connecticut's cell phone law
    will be charged with a moving violation, and a conviction will result in a license
    suspension.
- id: 95
  category: penalties_and_points
  question: What will happen if a registered vehicle owner fails to respond to a DMV
    warning notice regarding a lack of insurance coverage?
  choices:
    A: The driver's license will be permanently revoked.
    B: The vehicle's registration will be suspended.
    C: The owner will be required to retake the driving test.
    D: The vehicle will be towed at the owner's expense.
  answer: B
  explanation: Failure to respond to the warning notice regarding insurance cancellation
    will result in suspension of the registration.
- id: 96
  category: vehicle_information
  question: 'Before starting a vehicle with an automatic transmission, the shift selector
    must be placed in:'
  choices:
    A: Neutral
    B: Drive
    C: First gear
    D: Park
  answer: D
  explanation: For a vehicle that has an automatic transmission, you must put the
    shift selector in 'park' before starting the vehicle.
- id: 97
  category: safe_driving_rules
  question: What is the recommended hand position on the steering wheel?
  choices:
    A: Left hand between 8 and 10 o'clock and right hand between 2 and 4 o'clock
    B: Left hand at 7 o'clock and right hand at 5 o'clock
    C: Both hands at the 12 o'clock position
    D: Left hand at 9 o'clock and right hand at 12 o'clock
  answer: A
  explanation: 'Both hands should be placed on opposite sides of the steering wheel:
    left hand between 8 and 10 o''clock and right hand between 2 and 4 o''clock.'
- id: 98
  category: vehicle_information
  question: When using the Push/Pull method of steering, which of the following is
    true?
  choices:
    A: The hands cross over each other at the 12 o'clock position.
    B: The driver's knuckles should be facing inward.
    C: The two hands will never cross and remain on the wheel at all times.
    D: The steering wheel is allowed to slip freely through the fingers.
  answer: C
  explanation: In the Push/Pull method, if done correctly, the two hands will never
    cross and will remain on the wheel at all times.
- id: 99
  category: defensive_driving
  question: To drive safely and avoid last-minute braking, safer drivers tend to look
    at least how far ahead of their vehicles?
  choices:
    A: 3 seconds ahead
    B: 5 seconds ahead
    C: 12 seconds ahead
    D: 20 seconds ahead
  answer: C
  explanation: Safer drivers tend to look at least 12 seconds ahead of their vehicles
    to avoid last-minute braking or turning.
- id: 100
  category: defensive_driving
  question: 'When driving on the highway, looking 12 seconds ahead is equivalent to
    a distance of about:'
  choices:
    A: One city block
    B: Four city blocks or a quarter of a mile
    C: One mile
    D: Two car lengths
  answer: B
  explanation: On the highway, 12 seconds is about four city blocks (or a quarter
    of a mile).
- id: 101
  category: defensive_driving
  question: When is it especially important to look behind your vehicle?
  choices:
    A: When you change lanes, slow down, back up, or drive down a long or steep hill
    B: Only when you are parallel parking
    C: When you are accelerating on a highway on-ramp
    D: When you are stopped at a red light
  answer: A
  explanation: The manual states it is very important to look for vehicles behind
    you when you change lanes, slow down, back up or drive down a long or steep hill.
- id: 102
  category: sharing_the_road
  question: Before you turn left across traffic at an intersection, who has the right-of-way?
  choices:
    A: The turning vehicle has the right-of-way.
    B: Oncoming traffic, including bicycles, always has the right-of-way.
    C: Pedestrians must yield to the turning vehicle.
    D: The vehicle that arrived at the intersection last has the right-of-way.
  answer: B
  explanation: Before you turn left across traffic, remember that oncoming traffic,
    including bicycles, always has the right-of-way.
- id: 103
  category: sharing_the_road
  question: When preparing to make a right turn, what should you do if you have just
    passed a bicycle?
  choices:
    A: Honk your horn and turn immediately.
    B: Turn immediately if the bicycle is moving slowly.
    C: Do not turn immediately after passing a bicycle.
    D: Assume the bicycle will yield to your turning vehicle.
  answer: C
  explanation: 'The manual explicitly warns: ''Do not turn immediately after passing
    a bicycle.'''
- id: 104
  category: defensive_driving
  question: Why should you not rely solely on traffic signals or signs at an intersection?
  choices:
    A: Because traffic signals guarantee that pedestrians will not cross.
    B: Because you can assume no one will cross in front of you if you have a green
      light.
    C: Because some drivers do not obey traffic signals or signs, so you should look
      left and right even on a green light.
    D: Because traffic signs are only suggestions.
  answer: C
  explanation: Do not rely on traffic signals or signs to tell you that no one will
    be crossing in front of you, because some drivers do not obey them. You should
    look left and right at an intersection, even if other traffic has a red light
    or stop sign.
- id: 105
  category: safe_driving_rules
  question: What must you do if you approach an intersection with an inoperative stop
    light?
  choices:
    A: Proceed through the intersection without stopping if the coast is clear.
    B: Stop as though the intersection was controlled by a stop sign.
    C: Yield to the vehicle on your left and proceed with caution.
    D: Treat the intersection as a yield sign and slow down.
  answer: B
  explanation: State law requires a driver at an intersection with an inoperative
    stop light to stop as though the intersection was controlled by a stop sign.
- id: 106
  category: defensive_driving
  question: What does the term 'blocking the box' refer to in heavy traffic?
  choices:
    A: Parking your vehicle in a designated loading zone.
    B: Stopping on a crosswalk while waiting for a pedestrian.
    C: Entering an intersection without sufficient space on the opposite side to accommodate
      your vehicle.
    D: Driving too closely to a large commercial truck.
  answer: C
  explanation: During heavy traffic, drivers are prohibited from entering any intersection
    unless there is sufficient space on the opposite side to accommodate their vehicle.
    This is commonly known as 'blocking the box' or causing 'gridlock.'
- id: 107
  category: defensive_driving
  question: If you are stopped at an intersection and your view of the cross street
    is blocked, what is the safest course of action?
  choices:
    A: Accelerate quickly to clear the intersection as fast as possible.
    B: Sound your horn to warn crossing traffic before proceeding.
    C: Wait for the vehicle behind you to honk before moving.
    D: Edge forward slowly until you can clearly see crossing traffic.
  answer: D
  explanation: If you are stopped and your view of a cross street is blocked, edge
    forward slowly until you can see. This allows crossing drivers to see the front
    of your vehicle and slow down if necessary.
- id: 108
  category: defensive_driving
  question: What is one of the leading causes of fatalities at railroad crossings?
  choices:
    A: Assuming that a train is not coming.
    B: Driving over the tracks too slowly.
    C: Failing to roll down the windows to listen for a train.
    D: Stopping too far away from the railroad tracks.
  answer: A
  explanation: Even if you have never seen a train at that crossing before, do not
    assume that none are coming. Assuming that a train is not coming is one of the
    leading causes of fatalities at railroad crossings.
- id: 109
  category: defensive_driving
  question: At a railroad crossing with more than one track, why should you wait until
    a passing train is well down the track before crossing?
  choices:
    A: To allow the crossing gates to fully reset.
    B: Because the train that just passed may hide another train that is approaching.
    C: To ensure your vehicle's tires do not get stuck in the tracks.
    D: Because it is illegal to cross within 30 seconds of a train passing.
  answer: B
  explanation: At crossings with more than one track, wait until the passing train
    is well down the track before starting to cross. The train that just passed may
    hide another one that is approaching.
- id: 110
  category: signs_and_signals
  question: What color are all temporary signs in work zones?
  choices:
    A: Yellow background with black letters
    B: Orange background with black letters or symbols
    C: White background with red letters
    D: Fluorescent green background with black symbols
  answer: B
  explanation: All temporary signs in work zones have an orange background and black
    letters or symbols.
- id: 111
  category: penalties_and_points
  question: In Connecticut, what is the maximum fine a driver could face for endangering
    a highway worker within a work zone?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $5,000
  answer: C
  explanation: In Connecticut, anyone convicted of speeding, disobeying traffic control
    devices, using an improper lane or endangering a highway worker within a work
    zone could face fines of up to $1,000.
- id: 112
  category: penalties_and_points
  question: What is the penalty for illegally using a hand-held cellphone while driving
    in a work zone?
  choices:
    A: The driver's license is immediately suspended for 30 days.
    B: Distracted driving fines are doubled.
    C: The driver must perform 50 hours of community service.
    D: The vehicle is impounded for 48 hours.
  answer: B
  explanation: Distracted driving fines are doubled for anyone convicted of illegally
    using a hand-held cellphone or mobile electronic device while driving in a work
    zone.
- id: 113
  category: safe_driving_rules
  question: When approaching a work zone, when should a motorist merge into the appropriate
    lane?
  choices:
    A: Right before the lane ends to maximize traffic flow.
    B: Only when instructed by a flagger.
    C: As soon as possible at the first notice of an approaching work zone.
    D: After passing the first orange warning sign.
  answer: C
  explanation: Merge as soon as possible. Motorists can help maintain traffic flow
    and posted speeds by moving to the appropriate lane at first notice of an approaching
    work zone.
- id: 114
  category: sharing_the_road
  question: Under Connecticut's Vulnerable User's Law, how much distance must drivers
    allow when passing a vulnerable user?
  choices:
    A: At least two feet
    B: At least three feet
    C: At least four feet
    D: At least five feet
  answer: B
  explanation: Drivers must allow for three feet of distance when passing vulnerable
    users, who are at greater risk of serious injury or death.
- id: 115
  category: sharing_the_road
  question: Which of the following is considered a 'vulnerable user' under Connecticut
    law?
  choices:
    A: A passenger in a commercial bus
    B: A driver of an emergency vehicle
    C: A person driving a garbage truck
    D: A driver of a passenger car
  answer: C
  explanation: Vulnerable users include pedestrians, bicyclists, wheelchair users,
    a person riding or driving an animal, highway workers, garbage trucks, tank vehicles,
    vehicles authorized by the US Government to carry mail and express delivery carriers.
- id: 116
  category: sharing_the_road
  question: What must you do when you see or hear an emergency vehicle approaching
    from any direction with sirens or flashing lights?
  choices:
    A: Speed up to get out of the emergency vehicle's way.
    B: Pull over to the left edge of the road and stop.
    C: Pull over to the right edge of the road, or as near to the right as possible,
      and stop.
    D: Slow down and turn on your hazard lights, but keep moving.
  answer: C
  explanation: When you see or hear an emergency vehicle approaching from any direction
    you must pull over to the right edge of the road, or as near to the right as possible,
    and stop your vehicle.
- id: 117
  category: safe_driving_rules
  question: According to the 'Move Over Law', what must a driver do when approaching
    any vehicle pulled over on a highway?
  choices:
    A: Maintain speed but move over one lane.
    B: Slow down below the posted speed limit and move over one lane whenever it is
      safe to do so.
    C: Stop completely and wait for the pulled-over vehicle to re-enter traffic.
    D: Honk the horn to alert the pulled-over vehicle of your presence.
  answer: B
  explanation: When any vehicle is pulled over on any part of a highway or road, drivers
    must SLOW DOWN (below the posted speed limit) and move their vehicle over one
    lane whenever it is safe to do so.
- id: 118
  category: sharing_the_road
  question: How can a driver determine the location of an unmarked crosswalk at an
    intersection?
  choices:
    A: Look for a pedestrian crossing sign on the right side of the road.
    B: Imagine that the sidewalk or shoulder at the corner extends across the road
      and meets the sidewalk or shoulder on the other side.
    C: Measure 10 feet from the stop line at the intersection.
    D: Unmarked crosswalks only exist where there is a traffic light.
  answer: B
  explanation: To determine where an unmarked crosswalk is, imagine that the sidewalk
    or shoulder at the corner extends across the road and meets the sidewalk or shoulder
    on the other side.
- id: 119
  category: sharing_the_road
  question: A driver must slow or stop and grant the right-of-way to a pedestrian
    when the pedestrian does which of the following?
  choices:
    A: Makes eye contact with the driver from the sidewalk.
    B: Stands on the sidewalk looking at their cell phone.
    C: Indicates intent to cross by moving an extension of a body part, such as a
      cane or leashed dog, into the crosswalk's entrance.
    D: Waits at a bus stop near the intersection.
  answer: C
  explanation: Drivers must grant the right-of-way when a pedestrian indicates intent
    to cross the road by moving into the crosswalk's entrance any body part or any
    extension of a body part, including a wheelchair, cane, walking stick, crutch,
    bicycle, electric bicycle, stroller, carriage, cart, or leashed or harnessed dog.
- id: 120
  category: sharing_the_road
  question: How might a pedestrian indicate their intent to cross the road at a crosswalk?
  choices:
    A: By waving a brightly colored flag at oncoming traffic
    B: By stepping to the curb and raising their hand and arm toward oncoming traffic
    C: By making eye contact with the driver for at least three seconds
    D: By standing completely still at the edge of the curb
  answer: B
  explanation: According to the manual, a pedestrian indicates intent to cross by
    stepping to the curb and raising his or her hand and arm toward oncoming traffic,
    or by moving any body part or extension into the crosswalk.
- id: 121
  category: penalties_and_points
  question: What is a consequence of failing to obey the slower posted speed limit
    in a school zone?
  choices:
    A: You will be subject to fines
    B: Your vehicle will be immediately impounded
    C: You will receive a warning for the first offense
    D: Your license will be permanently revoked
  answer: A
  explanation: The manual states that you must obey the slower posted speed limit
    in school zones or be subject to fines.
- id: 122
  category: sharing_the_road
  question: If you have a green light at a regulated intersection, but a blind pedestrian
    is still in the process of crossing, what must you do?
  choices:
    A: Honk your horn to alert them of the green light
    B: Slowly and carefully drive around them
    C: Remain stopped until the pedestrian is out of the road
    D: Proceed through the intersection as you have the right-of-way
  answer: C
  explanation: The manual specifies that at regulated intersections, you must remain
    stopped until the pedestrian is out of the road, even if you have a green light.
- id: 123
  category: sharing_the_road
  question: When a travel lane is too narrow for cars and bicycles to drive side-by-side,
    what is a bicyclist expected to do?
  choices:
    A: Move onto the adjacent sidewalk
    B: Stop and wait for cars to pass
    C: Ride in the opposite direction of traffic to increase visibility
    D: Take the travel lane by driving in or near the center of the lane
  answer: D
  explanation: When a lane is too narrow for cars and bikes to drive side-by-side,
    the bicyclist will 'take the travel lane' which means driving in or near the center
    of the lane.
- id: 124
  category: safe_driving_rules
  question: At what age is a bicyclist required by law to wear a helmet?
  choices:
    A: Under 12 years of age
    B: Under 16 years of age
    C: Under 18 years of age
    D: All bicyclists must wear helmets regardless of age
  answer: B
  explanation: As a bicyclist, you are required to wear a helmet if you are under
    16 years of age.
- id: 125
  category: penalties_and_points
  question: What is the penalty for a driver who fails to yield the right-of-way to
    a bicyclist?
  choices:
    A: A mandatory license suspension
    B: Fines are doubled
    C: A written warning is issued
    D: Mandatory community service
  answer: B
  explanation: The manual explicitly states that fines are doubled for failure to
    yield right-of-way to a bicyclist.
- id: 126
  category: safe_driving_rules
  question: When approaching and passing a bicyclist, what is the minimum distance
    you must leave between your vehicle and the bicycle?
  choices:
    A: Two feet
    B: Three feet
    C: Four feet
    D: Five feet
  answer: B
  explanation: When approaching or passing a bicyclist, slow down and pass only when
    you are able to give a minimum of three feet distance between your vehicle and
    the bicycle.
- id: 127
  category: defensive_driving
  question: Why should you avoid sounding your horn close to a bicyclist unless you
    have good cause?
  choices:
    A: It is illegal to use a horn in residential areas
    B: It may startle them and cause them to steer into your path and crash
    C: It will cause the bicyclist to stop immediately in the travel lane
    D: It can damage the bicyclist's hearing
  answer: B
  explanation: Do not sound your horn close to bicyclists unless you have good cause,
    because sounding your horn to alert your presence may startle them and cause them
    to steer into your path and crash.
- id: 128
  category: safe_driving_rules
  question: Are you allowed to pass a slow-moving bicyclist in a no passing zone?
  choices:
    A: Yes, if you can make the maneuver safely
    B: Yes, but only if the bicyclist waves you past
    C: No, it is strictly prohibited under all circumstances
    D: No, unless you are driving an emergency vehicle
  answer: A
  explanation: You may pass slow moving vehicles, including bicyclists, in a no passing
    zone if you can make the maneuver safely.
- id: 129
  category: sharing_the_road
  question: If you are about to make a right turn and there is a bicyclist ahead of
    you, what should you do?
  choices:
    A: Speed up and pass the bicyclist immediately before the turn
    B: Honk your horn so the bicyclist stops and lets you turn
    C: Slow down and let the cyclist clear the intersection before making your turn
    D: Turn closely behind the bicyclist to save time
  answer: C
  explanation: If you are about to make a right turn, you must not pass a bicyclist
    immediately before the turn. You should slow down and let the cyclist clear the
    intersection before making your turn.
- id: 130
  category: sharing_the_road
  question: Which of the following statements about motorcycles sharing a traffic
    lane is true?
  choices:
    A: A car and a motorcycle may share the same lane
    B: Two motorcycles may share a lane
    C: Motorcycles are not allowed to use a complete traffic lane
    D: You may pass a motorcycle in the same lane if there is enough room
  answer: B
  explanation: Motorcycle operators have the right to use a complete traffic lane
    and two motorcycles may share a lane. Do not pass a motorcycle in the same lane.
- id: 131
  category: defensive_driving
  question: 'Nearly 40 percent of motorcycle crashes involving another motor vehicle
    are caused by:'
  choices:
    A: The motorcycle tailgating the other vehicle
    B: The other vehicle turning left in front of the motorcyclist
    C: The motorcycle passing on the right side
    D: The other vehicle stopping too quickly
  answer: B
  explanation: Approximately one-half of all motorcycle crashes involve another motor
    vehicle, and nearly 40 percent were caused by the other vehicle turning left in
    front of the motorcyclist.
- id: 132
  category: defensive_driving
  question: What should you do if you see a motorcycle approaching with its turn signal
    flashing?
  choices:
    A: Assume the motorcycle is turning and proceed into its path
    B: Flash your headlights to acknowledge the signal
    C: Do not pull out in front of the motorcycle until you see that it is actually
      beginning to turn
    D: Honk your horn to remind the rider to turn off the signal
  answer: C
  explanation: Do not assume a motorcycle is turning when you see its turn signal
    flashing, as they may not self-cancel. Do not pull out in front of a motorcycle
    until you see that it is actually beginning to turn.
- id: 133
  category: safe_driving_rules
  question: What is the recommended following distance when you are driving behind
    a motorcyclist under normal conditions?
  choices:
    A: 1 to 2 seconds
    B: 3 to 4 seconds
    C: 5 to 6 seconds
    D: 7 to 8 seconds
  answer: B
  explanation: When following a motorcyclist, allow for a 3 to 4 second following
    distance or more in wet conditions.
- id: 134
  category: safe_driving_rules
  question: When are you permitted to drive in a designated bicycle lane?
  choices:
    A: When you are approaching a turn
    B: When you want to pass a slow-moving vehicle
    C: When you are entering or leaving an alley or driveway
    D: When there are no bicyclists currently using the lane
  answer: C
  explanation: Do not stop, park or drive on a designated bicycle path or lane unless
    you are entering or leaving an alley or driveway, performing official duties,
    directed by a police officer, or an emergency situation exists. You may turn across
    a bicycle lane but may not drive in it when approaching a turn.
- id: 135
  category: sharing_the_road
  question: What should you do with your headlights when approaching a motorcycle?
  choices:
    A: Flash your high beams to ensure they see you
    B: Keep your high beams on for better visibility
    C: Always dim your headlights
    D: Turn your headlights off briefly
  answer: C
  explanation: You should always dim your headlights when approaching a motorcycle
    because the blinding effect of high beams can be far more dangerous to them due
    to their vulnerability.
- id: 136
  category: signs_and_signals
  question: What does a slow-moving vehicle decal look like?
  choices:
    A: A red square
    B: A yellow circle
    C: An orange triangle
    D: A white diamond
  answer: C
  explanation: According to the manual, slow-moving vehicles like farm tractors and
    animal-drawn vehicles should have a slow-moving decal, which is an orange triangle,
    on the back.
- id: 137
  category: safe_driving_rules
  question: Under what condition does state law permit you to cross a double yellow
    line in a no-passing zone?
  choices:
    A: When passing a slow-moving vehicle, pedestrian, or bicycle, provided you can
      see far enough ahead to pass safely.
    B: When you are driving at least 15 mph under the speed limit.
    C: When you are running late and traffic is backed up.
    D: You are never permitted to cross a double yellow line under any circumstances.
  answer: A
  explanation: State law permits crossing a double yellow line in a no-passing zone
    to pass slow-moving traffic, pedestrians, parked vehicles, animals, bicycles,
    mopeds, and scooters, provided you can see far enough ahead to safely complete
    the maneuver.
- id: 138
  category: defensive_driving
  question: Which rule should you use to determine if you are driving too fast for
    road conditions?
  choices:
    A: The two-second following rule
    B: The three-second stopping rule
    C: The four-second sight-distance rule
    D: The five-second hazard rule
  answer: C
  explanation: The manual advises using the 'four-second sight-distance rule' to tell
    if you are driving too fast for conditions. If you reach a stationary object before
    counting to four-one-thousand, you are going too fast.
- id: 139
  category: safe_driving_rules
  question: When approaching an ice cream truck displaying flashing lights and an
    extended stop signal arm, how far away must you stop?
  choices:
    A: At least 5 feet
    B: At least 10 feet
    C: At least 15 feet
    D: At least 25 feet
  answer: B
  explanation: State law requires drivers to stop their vehicles at least 10 feet
    from the front or back of an ice cream truck displaying flashing lights and extending
    its stop signal arm.
- id: 140
  category: safe_driving_rules
  question: After stopping for an ice cream truck with flashing lights and an extended
    stop arm, at what maximum speed are you allowed to proceed past it?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: A
  explanation: After stopping for an ice cream truck, you may proceed past the truck
    at a reasonable speed, up to 5 mph, and must yield the right-of-way to any pedestrian.
- id: 141
  category: sharing_the_road
  question: What is illegal to do when approaching or passing a horse on a public
    highway?
  choices:
    A: Reducing your speed
    B: Stopping your vehicle
    C: Sounding your horn
    D: Leaving a reasonable distance
  answer: C
  explanation: The manual explicitly states that it is illegal to sound your horn
    or cause loud or unusual noises when approaching or passing a horse.
- id: 142
  category: sharing_the_road
  question: How can you tell if you are driving in a truck driver's side blind spot
    (No-Zone)?
  choices:
    A: You are less than 50 feet behind the truck.
    B: You cannot see the driver's face in their side view mirror.
    C: The truck is traveling faster than 55 mph.
    D: You can see the truck's headlights in your rearview mirror.
  answer: B
  explanation: The manual explains that if you can’t see the truck driver’s face in
    his side view mirror, then he can’t see you, meaning you are in their side No-Zone.
- id: 143
  category: safe_driving_rules
  question: When is it safe to return to the right lane after passing a large truck?
  choices:
    A: As soon as your rear bumper clears the truck's front bumper.
    B: When you can see the entire front of the truck in your rearview mirror.
    C: When the truck driver flashes their headlights.
    D: Three seconds after you have passed the truck's cab.
  answer: B
  explanation: When passing a truck, you should look for the entire front of the truck
    in your rearview mirror before pulling in front to avoid the front No-Zone.
- id: 144
  category: vehicle_information
  question: Approximately how far can a large truck's blind spots stretch behind the
    vehicle?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: D
  explanation: A truck's blind spots may stretch up to 20 feet in front of the cab
    and approximately 200 feet behind the truck.
- id: 145
  category: sharing_the_road
  question: What should you do if a large truck is passing your vehicle?
  choices:
    A: Speed up to get out of the truck's way.
    B: Maintain your speed and move to the left side of your lane.
    C: Slow down slightly to shorten the time required for the truck to pass.
    D: Sound your horn to let the driver know you are there.
  answer: C
  explanation: If a truck passes you, you should help the truck driver to pass safely
    by slowing down slightly to shorten the time required to pass. You should never
    speed up.
- id: 146
  category: safe_driving_rules
  question: What is the minimum recommended time interval for following a large truck?
  choices:
    A: One second
    B: Two seconds
    C: Three seconds
    D: Five seconds
  answer: C
  explanation: The manual states that you should never follow a truck at a time interval
    of less than three seconds.
- id: 147
  category: safe_driving_rules
  question: Why should you never use your high beams when following a truck at night?
  choices:
    A: The glare in the large side mirrors can blind the truck driver.
    B: It will cause the truck's taillights to reflect back at you.
    C: It is illegal to use high beams on any multi-lane highway.
    D: It drains your vehicle's battery faster.
  answer: A
  explanation: You should never use your high beams when following a truck at night
    because the glare in the large side mirrors can blind the truck driver.
- id: 148
  category: sharing_the_road
  question: Compared to passenger cars, how much time and room do large trucks and
    RVs need to stop?
  choices:
    A: About the same amount of time and room.
    B: Nearly twice the time and room.
    C: Half the time and room due to air brakes.
    D: Three times the time and room.
  answer: B
  explanation: The manual notes that trucks, buses, and RVs need nearly twice the
    time and room to stop as cars.
- id: 149
  category: sharing_the_road
  question: When stopping behind a truck on an upgrade, why should you leave extra
    space?
  choices:
    A: The truck may roll back when starting up and damage your vehicle.
    B: The truck's exhaust fumes are heavier on an incline.
    C: You need room to quickly pass the truck on the right.
    D: The truck driver needs extra space to apply the parking brake.
  answer: A
  explanation: The manual states to avoid stopping too close behind a truck on an
    upgrade because if the truck rolls back when starting up, your vehicle could be
    damaged.
- id: 150
  category: vehicle_information
  question: What is the term used to describe how a vehicle's rear wheels follow a
    shorter path than the front wheels during a turn?
  choices:
    A: Over-steering
    B: Off-track
    C: Rear-wheel drift
    D: Tail-swing
  answer: B
  explanation: The manual explains that on every vehicle, the rear wheels follow a
    shorter path than the front wheels, and this is called off-track.
- id: 151
  category: sharing_the_road
  question: Why should you resist the temptation to pass on the right of a truck approaching
    an intersection?
  choices:
    A: The truck driver may not be able to hear your horn.
    B: You could be caught between the truck and the curb if the truck turns right.
    C: Trucks are required to use the right lane for passing only.
    D: It is illegal to pass any vehicle at an intersection.
  answer: B
  explanation: The manual warns to resist passing on the right of a truck approaching
    an intersection because if the truck driver makes a right turn, you could be caught
    between the truck and the curb.
- id: 152
  category: safe_driving_rules
  question: What should you do if you are on a highway entrance ramp and have to wait
    for space to enter the roadway?
  choices:
    A: Drive to the end of the ramp and stop completely.
    B: Stop immediately at the beginning of the ramp.
    C: Slow down on the ramp so you have room to speed up before merging.
    D: Drive on the shoulder until a gap opens up.
  answer: C
  explanation: If you have to wait for space to enter a roadway, you should slow down
    on the ramp so you have some room to speed up before you have to merge onto the
    main road.
- id: 153
  category: safe_driving_rules
  question: 'Any time you want to merge with other traffic, you need an opening of
    about:'
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: The manual states that any time you want to merge with other traffic,
    you need an opening of about four seconds.
- id: 154
  category: safe_driving_rules
  question: On a road with three or more lanes traveling in the same direction, which
    lane should you use if there is a lot of entering or exiting traffic?
  choices:
    A: The far left lane
    B: The center travel lane
    C: The far right lane
    D: The shoulder
  answer: B
  explanation: On a road with three or more lanes traveling in the same direction,
    you should use the center travel lane if there is a lot of entering or exiting
    traffic.
- id: 155
  category: safe_driving_rules
  question: When traveling on a main road with exit ramps, when should you begin to
    slow down to exit?
  choices:
    A: A quarter mile before the exit ramp.
    B: As soon as you see the exit sign.
    C: Only after you move onto the exit ramp.
    D: While you are still in the right travel lane.
  answer: C
  explanation: If the road you are traveling has exit ramps, do not slow down until
    you move onto the exit ramp.
- id: 156
  category: penalties_and_points
  question: What can happen if you start across an intersection with a green light
    but get caught in the middle when the light turns red due to blocking vehicles?
  choices:
    A: You will automatically lose your license.
    B: You can get a ticket for blocking an intersection.
    C: You must immediately put your vehicle in reverse.
    D: You have the right-of-way to clear the intersection.
  answer: B
  explanation: Even if you have the green light, do not start across the intersection
    if there are vehicles blocking your way. You can get a ticket for blocking an
    intersection.
- id: 157
  category: defensive_driving
  question: Why should you never assume another driver will turn just because their
    turn signal is on?
  choices:
    A: Turn signals are often invisible in bright sunlight.
    B: The driver may plan to turn after passing you or forgot to turn the signal
      off.
    C: It is illegal to turn if another vehicle is waiting.
    D: Turn signals are only required on highways.
  answer: B
  explanation: Do not assume that you can turn just because an approaching vehicle
    has a turn signal on. The driver may plan to turn after they pass your vehicle
    or may have forgotten to turn the signal off.
- id: 158
  category: safe_driving_rules
  question: What is the recommended method to tell if you are following another vehicle
    too closely under normal conditions?
  choices:
    A: The "two-second rule"
    B: The "three-second rule"
    C: The "four-second rule"
    D: The "one car length per 10 mph rule"
  answer: B
  explanation: The manual recommends the "three-second rule" as an easy way to tell
    if you are following too closely, and it works at any speed.
- id: 159
  category: defensive_driving
  question: In which of the following situations should you increase your following
    distance to four seconds?
  choices:
    A: When driving on a freshly paved road.
    B: When following a motorcycle.
    C: When driving in a residential neighborhood.
    D: When approaching a green traffic light.
  answer: B
  explanation: You should use the "four-second" rule when following motorcycles because
    if the motorcycle should fall, you need extra distance to avoid the rider.
- id: 160
  category: defensive_driving
  question: What should you do if you are being followed closely by another vehicle?
  choices:
    A: Speed up to create more distance.
    B: Tap your brakes repeatedly to warn the driver.
    C: Pull to the right and allow the vehicle behind you to pass.
    D: Move to the left lane and slow down.
  answer: C
  explanation: If you are being followed closely, the manual advises to pull to the
    right and allow the vehicle behind you to pass.
- id: 161
  category: sharing_the_road
  question: If you see a truck driver attempting to back from the street into a loading
    area, what should you do?
  choices:
    A: Honk your horn and drive around them quickly.
    B: Stop to give them a chance to back up safely.
    C: Pull up closely behind the truck so they can see you.
    D: Pass them on the right side.
  answer: B
  explanation: If you see a truck driver attempting to back, stop to give them a chance
    to do so safely. Never attempt to drive around a backing truck.
- id: 162
  category: safe_driving_rules
  question: What is an important rule to remember when crossing railroad tracks?
  choices:
    A: Always shift gears while crossing the tracks.
    B: Stop on the tracks to check for oncoming trains.
    C: Make sure you can cross without having to stop on the tracks.
    D: Speed up to cross the tracks as quickly as possible.
  answer: C
  explanation: 'The manual states: "When you cross railroad tracks, make sure you
    can cross without having to stop on the tracks."'
- id: 163
  category: defensive_driving
  question: What should you do if you are being tailgated by another driver and there
    is no right lane to move into?
  choices:
    A: Tap your brakes quickly to warn the driver behind you.
    B: Speed up to increase the distance between your vehicles.
    C: Wait until the road ahead is clear, then reduce speed slowly.
    D: Maintain your speed and ignore the tailgater.
  answer: C
  explanation: If you are being followed too closely and there is no right lane, wait
    until the road ahead is clear, then reduce speed slowly. This will encourage the
    tailgater to drive around you. Never slow down quickly.
- id: 164
  category: safe_driving_rules
  question: Why is it important to leave extra space when stopped on a hill or incline
    behind another vehicle?
  choices:
    A: To improve your visibility of the road signs ahead.
    B: The vehicle ahead may roll back when it starts up.
    C: To allow pedestrians to cross safely between the vehicles.
    D: It prevents your vehicle's brakes from overheating.
  answer: B
  explanation: You should leave extra space when stopped on a hill or incline because
    the vehicle ahead may roll back when it starts up.
- id: 165
  category: sharing_the_road
  question: How much space must you allow between your vehicle and a bicycle when
    passing?
  choices:
    A: At least 2 feet
    B: At least 3 feet
    C: At least 4 feet
    D: At least 5 feet
  answer: B
  explanation: You must allow at least three feet of space between your vehicle and
    the bicycle when passing a bicycle.
- id: 166
  category: defensive_driving
  question: What is the best way to handle overtaking a bicycle when an oncoming vehicle
    is also approaching?
  choices:
    A: Speed up to pass the bicycle before the oncoming vehicle reaches you.
    B: Honk your horn so the bicycle moves off the road.
    C: Squeeze past the bicycle while the oncoming vehicle passes.
    D: Slow down and let the oncoming vehicle pass first before giving extra room
      to the bicycle.
  answer: D
  explanation: When possible, take potential hazards one at a time. If you are overtaking
    a bicycle and an oncoming vehicle is approaching, slow down and let the vehicle
    pass first so that you can give extra room to the bicycle.
- id: 167
  category: defensive_driving
  question: Where is another driver's blind spot generally located?
  choices:
    A: Directly in front of their vehicle.
    B: On either side and slightly to the rear of their vehicle.
    C: Directly behind their rear bumper.
    D: Only on the passenger side of their vehicle.
  answer: B
  explanation: Try to avoid driving on either side and slightly to the rear of another
    vehicle, as you will be in their blind spot.
- id: 168
  category: safe_driving_rules
  question: Which of the following is a rule regarding driving near railroad grade
    crossings?
  choices:
    A: You should speed up to cross bumpy tracks quickly.
    B: You may pass other vehicles if the crossing has no warning lights.
    C: Do not pass if there is a railroad grade crossing ahead.
    D: You must always stop at least 50 feet before the tracks.
  answer: C
  explanation: When approaching railroad crossings, you need to slow down to cross
    safely, and you must not pass if there is a railroad grade crossing ahead.
- id: 169
  category: safe_driving_rules
  question: Why is it important to look over your shoulder in the direction you plan
    to move when changing lanes?
  choices:
    A: To check your vehicle's blind spots.
    B: To see if the driver behind you is braking.
    C: To ensure your turn signal is functioning properly.
    D: To judge the speed of oncoming traffic.
  answer: A
  explanation: You must look over your shoulder to check your blind spots, as you
    cannot see these areas through your mirrors.
- id: 170
  category: safe_driving_rules
  question: If you need to change several lanes on a multi-lane highway, what is the
    safest way to do so?
  choices:
    A: Wait until all lanes are clear and cross them all at once.
    B: Take them one lane at a time.
    C: Speed up significantly to cross the lanes quickly.
    D: Slow down to a crawl before crossing the lanes.
  answer: B
  explanation: If you want to change several lanes, take them one at a time. It is
    safest and easiest to merge one lane at a time, as it is very difficult to determine
    that all lanes are free and safe to cross at once.
- id: 171
  category: safe_driving_rules
  question: At a speed of 55 mph, approximately how much time do you need to pass
    another vehicle safely?
  choices:
    A: 3 seconds
    B: 5 seconds
    C: 10 seconds
    D: 15 seconds
  answer: C
  explanation: At a speed of 55 mph, you need about 10 seconds to pass. That means
    you need a 10-second opening in oncoming traffic and sight-distance to pass.
- id: 172
  category: safe_driving_rules
  question: At 55 mph, approximately how much distance do you need to safely pass
    another vehicle, accounting for oncoming traffic?
  choices:
    A: 400 feet
    B: 800 feet
    C: 1000 feet
    D: Over 1600 feet (about one-third of a mile)
  answer: D
  explanation: At 55 mph, you will travel over 800 feet in 10 seconds, and so will
    an oncoming vehicle. That means you need over 1600 feet (about one-third of a
    mile) to pass safely.
- id: 173
  category: safe_driving_rules
  question: After passing another vehicle, how do you know it is safe to return to
    the driving lane?
  choices:
    A: When you are one car length ahead of the passed vehicle.
    B: When you can see both headlights of the passed vehicle in your rear-view mirror.
    C: When the driver of the passed vehicle flashes their headlights.
    D: When you have accelerated to 10 mph over the speed limit.
  answer: B
  explanation: Before you return to the driving lane, be sure to leave enough room.
    When you can see both headlights of the vehicle you just passed in your rear-view
    mirror, it is safe to return to the driving lane.
- id: 174
  category: defensive_driving
  question: What should you do if you want to parallel park and there is traffic coming
    from behind you?
  choices:
    A: Stop abruptly to block the traffic while you park.
    B: Put on your turn signal, pull next to the space, and allow following vehicles
      to pass before parking.
    C: Pull into the space head-first to save time.
    D: Wave the traffic around you while you begin backing up.
  answer: B
  explanation: If you want to parallel park and there is traffic coming behind you,
    put on your turn signal, pull next to the space and allow following vehicles to
    pass before you park.
- id: 175
  category: defensive_driving
  question: What does it mean to 'split the difference' between two hazards?
  choices:
    A: Driving directly toward the smaller hazard.
    B: Stopping your vehicle until both hazards have passed.
    C: Steering a middle course between them, leaving a little more space on the more
      dangerous side.
    D: Speeding up to pass between the hazards as quickly as possible.
  answer: C
  explanation: To 'split the difference' means to steer a middle course between two
    hazards. However, if one is more dangerous than the other, you should leave a
    little more space on the dangerous side.
- id: 176
  category: defensive_driving
  question: When checking your blind spots during a lane change, why is it important
    to check quickly?
  choices:
    A: Because your turn signal will turn off automatically.
    B: Because traffic ahead of you could stop suddenly while you are looking away.
    C: Because other drivers might speed up to block you.
    D: Because it is illegal to look away from the road for more than one second.
  answer: B
  explanation: You must check quickly and not take your eyes off the road ahead for
    more than an instant, because traffic ahead of you could stop suddenly while you
    are checking traffic to the sides, rear, or over your shoulder.
- id: 177
  category: defensive_driving
  question: Why are toll plazas considered 'trouble spots' where you may need to slow
    down?
  choices:
    A: Because pedestrians frequently cross the highway there.
    B: Because vehicles are changing lanes, preparing to stop, and speeding up again.
    C: Because the speed limit always drops to 15 mph.
    D: Because toll booths create large blind spots.
  answer: B
  explanation: Toll plazas are trouble spots because vehicles are changing lanes,
    preparing to stop, and then speeding up again when they leave the plaza. The number
    of lanes could also change.
- id: 178
  category: safe_driving_rules
  question: Under what circumstances is it permitted to pass a vehicle on the shoulder?
  choices:
    A: When the vehicle ahead is turning left
    B: When the shoulder is paved and wide enough
    C: Never, whether the shoulder is paved or not
    D: Only during daylight hours on multi-lane highways
  answer: C
  explanation: 'The manual explicitly states: "Never pass on the shoulder, whether
    it is paved or not. Other drivers will never expect you to be there and may pull
    off the road without looking."'
- id: 179
  category: safe_driving_rules
  question: According to Connecticut law, what lane must you drive in when your direction
    of travel is less than three lanes?
  choices:
    A: The left lane, to leave room for merging traffic
    B: The center lane, if available
    C: The right lane, except when passing or turning left
    D: Any lane, as long as you are traveling at the speed limit
  answer: C
  explanation: When your direction of travel is less than three lanes, Connecticut
    law requires you to drive in the right lane, except when passing or if you need
    to make a left turn or exit on the left.
- id: 180
  category: safe_driving_rules
  question: What should you avoid doing when making a right turn?
  choices:
    A: Swinging wide to the left before making the turn
    B: Turning from the lane closest to the direction you want to go
    C: Signaling before changing lanes
    D: Looking for pedestrians in the crosswalk
  answer: A
  explanation: On right turns, avoid swinging wide to the left before making the turn.
    If you swing wide, the driver behind you may think you are changing lanes or going
    to turn left and may try to pass you on the right.
- id: 181
  category: sharing_the_road
  question: What special care must you take when turning near bicyclists?
  choices:
    A: Honk your horn to warn the bicyclist before turning
    B: Speed up to pass the bicyclist quickly before turning right
    C: Never turn right immediately after passing a bicyclist
    D: Assume bicyclists will yield to you when you are turning
  answer: C
  explanation: 'State law and safety require special care when turning near bicyclists.
    The manual states: "Never turn right immediately after passing a bicyclist. Yield
    to bicycles when turning as you would to any other road vehicle."'
- id: 182
  category: safe_driving_rules
  question: When is it legal to back a vehicle in a travel lane?
  choices:
    A: When you miss your exit on the highway
    B: Only to parallel park or to perform a three-point or K turn
    C: When you need to let out a passenger quickly
    D: When your vehicle breaks down and you need to reach the shoulder
  answer: B
  explanation: 'The manual states: "Never back a vehicle in any travel lane, it is
    illegal and unsafe to do so, except to parallel park or to perform a three-point
    or K turn."'
- id: 183
  category: defensive_driving
  question: What is the proper way to look when backing your vehicle?
  choices:
    A: Depend entirely on your rearview mirror
    B: Depend entirely on your side mirrors
    C: Turn around and look over your right shoulder directly through the rear window
    D: Look over your left shoulder out the driver's side window
  answer: C
  explanation: When backing, you should turn around and look over your right shoulder
    so that you can look directly through the rear window. You should not depend on
    your rearview or side mirrors.
- id: 184
  category: defensive_driving
  question: How far ahead must you be able to see to safely start a pass near a hill
    or curve?
  choices:
    A: At least one-quarter of a mile
    B: At least one-third of a mile
    C: At least one-half of a mile
    D: At least one mile
  answer: B
  explanation: You have to be able to see at least one-third of a mile (about 10 seconds)
    ahead. You should not start to pass if you are within one-third of a mile of a
    hill or curve.
- id: 185
  category: driver_responsibility
  question: Which of the following is illegal in many states and makes it too hard
    to hear emergency horns or sirens?
  choices:
    A: Listening to the radio at a moderate volume
    B: Driving with head or earphones that cover or go into both ears
    C: Talking to passengers while driving
    D: Using a hands-free Bluetooth device in one ear
  answer: B
  explanation: 'The manual warns: "Do not drive with head or earphones that cover
    or go into both ears. These are illegal in many states and make it too hard to
    hear emergency horns or sirens."'
- id: 186
  category: defensive_driving
  question: What is "rubbernecking"?
  choices:
    A: Stretching your neck to see over the steering wheel
    B: Checking your blind spots by turning your head quickly
    C: Slowing down just to look at a crash or someone getting a ticket
    D: Bouncing your vehicle over speed bumps
  answer: C
  explanation: Slowing down just to look at a crash, someone getting a ticket, or
    other roadside activity is called "rubbernecking" and could cause you to be in
    a crash.
- id: 187
  category: safe_driving_rules
  question: What is the safest way to navigate a curve?
  choices:
    A: Brake firmly while you are in the middle of the curve
    B: Accelerate sharply as you enter the curve
    C: Shift to neutral before entering the curve
    D: Slow down before you enter the curve so you do not have to brake in the curve
  answer: D
  explanation: Always slow down before you enter the curve so you do not have to brake
    in the curve. Braking in a curve can cause the vehicle to skid.
- id: 188
  category: safe_driving_rules
  question: How much should you reduce your speed when driving on a wet road?
  choices:
    A: By about 5 mph
    B: By about 10 mph
    C: Cut your speed in half
    D: Slow to a crawl
  answer: B
  explanation: According to the manual, on a wet road, you should reduce your speed
    by about 10 mph. (On packed snow you cut it in half, and on ice you slow to a
    crawl).
- id: 189
  category: vehicle_information
  question: During what dates are studded tires permitted in Connecticut?
  choices:
    A: October 1st through March 31st
    B: November 15th through April 30th
    C: December 1st through February 28th
    D: They are never permitted in Connecticut
  answer: B
  explanation: Studded tires are permitted in Connecticut from November 15th through
    April 30th.
- id: 190
  category: defensive_driving
  question: Why can the pavement on bridges be icy even when other pavement is not?
  choices:
    A: Bridges are usually made of concrete instead of asphalt
    B: Bridges do not have earth underneath them to help insulate them against the
      cold
    C: Bridges are typically located at higher elevations where the air is colder
    D: Bridges are exposed to more direct sunlight which melts and refreezes ice
  answer: B
  explanation: The pavement on bridges can be icy even when other pavement is not
    because bridges do not have earth underneath them to help insulate them against
    the cold, making them colder and icier than other roadways.
- id: 191
  category: safe_driving_rules
  question: Why can overpasses and bridges be icier than other roadways?
  choices:
    A: They are exposed to more wind.
    B: They do not have earth underneath them to help insulate against the cold.
    C: They are usually made of concrete instead of asphalt.
    D: They collect more water during rainstorms.
  answer: B
  explanation: According to the manual, the pavement on bridges can be icy even when
    other pavement is not because bridges do not have earth underneath them to help
    insulate them against the cold.
- id: 192
  category: safe_driving_rules
  question: At what temperature is ice on the road generally the most slippery?
  choices:
    A: Well below freezing.
    B: Exactly zero degrees Fahrenheit.
    C: Around the freezing point when it becomes wet.
    D: Ice has the same slipperiness at all temperatures.
  answer: C
  explanation: The manual states that when the temperature is around the freezing
    point, ice can become wet, making it more slippery than at temperatures well below
    freezing.
- id: 193
  category: safe_driving_rules
  question: Why is the pavement more slippery for the first few minutes when it starts
    to rain on a hot day?
  choices:
    A: The rain mixes with dirt to create thick mud.
    B: Heat causes the oil in the asphalt to come to the surface.
    C: The hot pavement causes the rain to instantly freeze.
    D: The tires expand from the heat and lose their tread.
  answer: B
  explanation: When it starts to rain on a hot day, heat causes the oil in the asphalt
    to come to the surface, making the road more slippery until the oil is washed
    off.
- id: 194
  category: safe_driving_rules
  question: When it is raining or the road is wet, at what speed do most tires begin
    to lose traction and risk hydroplaning?
  choices:
    A: Around 25 mph
    B: Around 35 mph
    C: Around 45 mph
    D: Around 55 mph
  answer: B
  explanation: When it is raining or the road is wet, most tires have good traction
    up to about 35 mph. As you go faster, your tires will start to ride up on the
    water, which is called hydroplaning.
- id: 195
  category: defensive_driving
  question: What should you do if it feels like your tires have lost traction with
    the surface of the road?
  choices:
    A: Slam on the brakes immediately.
    B: Turn the steering wheel sharply to regain control.
    C: Ease your foot off the gas pedal and keep the steering wheel straight.
    D: Accelerate slightly to push through the water.
  answer: C
  explanation: If you lose traction, you should ease your foot off the gas pedal,
    keep the steering wheel straight, and only try to turn if it is an emergency.
- id: 196
  category: driver_responsibility
  question: If another driver's aggressive driving makes you feel compelled to retaliate,
    what is the best course of action?
  choices:
    A: Follow them closely to get their license plate number.
    B: Flash your high beams to warn them.
    C: Leave punishment to the police and report the instance when you arrive at your
      destination.
    D: Pull up next to them at the next red light to confront them.
  answer: C
  explanation: The manual advises that it is best to leave punishment to the police
    and to call the police to report any instances of aggressive driving when you
    arrive at your destination.
- id: 197
  category: sharing_the_road
  question: To avoid lane blocking on a highway, what should you do when another vehicle
    wants to pass?
  choices:
    A: Speed up to prevent them from passing.
    B: Stay out of the far left lane and yield to the right.
    C: Move to the far left lane and turn on your hazard lights.
    D: Brake lightly to signal them to go around.
  answer: B
  explanation: To avoid lane blocking, you should stay out of the far left lane and
    yield to the right for any vehicle that wants to pass.
- id: 198
  category: driver_responsibility
  question: According to the manual, why should you think twice before using your
    horn to say "hello" to a pedestrian?
  choices:
    A: It is illegal to honk at pedestrians.
    B: The driver in front of you may think you are honking at them and become stressed.
    C: It will drain your vehicle's battery.
    D: Pedestrians always have the right-of-way.
  answer: B
  explanation: You should think twice before using your horn to say hello to a pedestrian
    because the driver in front of you may think you are honking at him or her, which
    could set off a stressed-out motorist.
- id: 199
  category: safe_driving_rules
  question: What should you do if an oncoming vehicle fails to dim their high beams?
  choices:
    A: Retaliate by turning on your own high beams to teach them a lesson.
    B: Flash your high beams rapidly until they pass.
    C: Keep your headlights on low beam and do not retaliate.
    D: Turn your headlights off completely for a few seconds.
  answer: C
  explanation: 'The manual explicitly states: "Don''t retaliate to oncoming high beams
    with your own in order to ''teach them a lesson.''" You should keep your headlights
    on low beam.'
- id: 200
  category: sharing_the_road
  question: How can you help vehicles entering a multi-lane highway from an on-ramp?
  choices:
    A: Stop in the right-hand lane to let them in.
    B: Move out of the right-hand lane when traffic permits.
    C: Speed up to pass the on-ramp quickly.
    D: Honk your horn to let them know you are there.
  answer: B
  explanation: When traffic permits, you should move out of the right-hand lane of
    a multi-lane highway to allow vehicles to enter from the on-ramps.
- id: 201
  category: defensive_driving
  question: If a hostile motorist tries to pick a fight with you, why should you avoid
    making eye contact?
  choices:
    A: It can be seen as a challenging gesture and incite violence.
    B: It will distract you from looking at the road ahead.
    C: It is considered a traffic violation.
    D: It will make it harder to remember their license plate.
  answer: A
  explanation: Making eye contact with a hostile motorist can be seen as a challenging
    gesture and can incite the other driver to violence.
- id: 202
  category: defensive_driving
  question: If you are being pursued by a hostile motorist, where should you drive?
  choices:
    A: Directly to your home.
    B: To a quiet, unlit side street to hide.
    C: To a police station, convenience store, or other public and well-lit location.
    D: Onto the nearest highway and drive above the speed limit.
  answer: C
  explanation: If a motorist pursues you, do not go home. Instead, drive to a police
    station, convenience store, or other public and well-lit location where you can
    get help.
- id: 203
  category: driver_responsibility
  question: What is the recommended way to handle pets while driving?
  choices:
    A: Let them sit in the front passenger seat.
    B: Hold them in your lap to keep them calm.
    C: Properly secure them in a pet carrier or portable kennel before moving the
      vehicle.
    D: Allow them to roam freely in the back seat.
  answer: C
  explanation: To keep from getting distracted, you should properly secure pets in
    a pet carrier or portable kennel before moving your vehicle.
- id: 204
  category: safe_driving_rules
  question: Which of the following is considered a driver distraction that could occur
    outside a moving vehicle?
  choices:
    A: Adjusting the climate controls.
    B: A police officer pulling someone over.
    C: Attending to children in the back seat.
    D: Using a global positioning system (GPS).
  answer: B
  explanation: According to the manual's list of possible distractions outside a moving
    vehicle, "Police pulling someone over" is an external distraction. The others
    are internal distractions.
- id: 205
  category: safe_driving_rules
  question: What rule should you use at night to make sure you are not "over-driving"
    your headlights?
  choices:
    A: The two-second following rule
    B: The three-second stopping rule
    C: The four-second sight-distance rule
    D: The ten-second scanning rule
  answer: C
  explanation: The manual states that you should use the "four-second sight-distance
    rule" at night to make sure you are not "over-driving" your headlights.
- id: 206
  category: defensive_driving
  question: What should you do if you need to look at a map while driving?
  choices:
    A: Ask a friend in another vehicle to guide you.
    B: Stop in a safe parking area to review it.
    C: Hold the map up to the steering wheel to keep your eyes on the road.
    D: Slow down and drift slightly while reading it.
  answer: B
  explanation: The manual states to review maps and plan your route before driving.
    If you need to look at a map while driving, you should stop in a safe parking
    area.
- id: 207
  category: defensive_driving
  question: How much following distance should you give a driver who appears to be
    distracted?
  choices:
    A: 1 to 2 seconds
    B: 2 to 3 seconds
    C: 3 to 4 seconds
    D: 5 to 6 seconds
  answer: C
  explanation: The manual advises to give a distracted driver plenty of room and maintain
    a safe following distance of 3 to 4 seconds.
- id: 208
  category: driver_responsibility
  question: If you are distracted and experience a crash, who or what is responsible?
  choices:
    A: The distraction itself
    B: The passengers in the vehicle
    C: The other driver involved
    D: You, the driver
  answer: D
  explanation: You are completely and solely responsible for operating your vehicle
    safely. If you are distracted and experience a crash, the responsibility falls
    on you, not the distraction.
- id: 209
  category: alcohol_drugs_health
  question: How does fatigue affect your driving ability?
  choices:
    A: It increases your reaction time and makes you more alert.
    B: It impairs your vision and judgment, similar to alcohol and drugs.
    C: It helps you make quicker decisions on the road.
    D: It decreases your risk of being in a crash.
  answer: B
  explanation: According to the manual, fatigue impairs your vision and judgment just
    like alcohol and drugs, and causes errors related to speed and distance.
- id: 210
  category: alcohol_drugs_health
  question: People with untreated obstructive sleep apnea are how many times more
    likely to fall asleep at the wheel?
  choices:
    A: 2 times
    B: 5 times
    C: 7 times
    D: 10 times
  answer: C
  explanation: The manual states that people with untreated obstructive sleep apnea
    are 7 times more likely to fall asleep at the wheel.
- id: 211
  category: safe_driving_rules
  question: How often should you schedule proper breaks during long trips to help
    prevent fatigue?
  choices:
    A: Every 50 miles or 1 hour
    B: Every 100 miles or 2 hours
    C: Every 150 miles or 3 hours
    D: Every 200 miles or 4 hours
  answer: B
  explanation: Before a trip, you should schedule proper breaks about every 100 miles
    or 2 hours during long trips to maintain proper alertness.
- id: 212
  category: alcohol_drugs_health
  question: Which of the following is considered a warning sign of driver fatigue?
  choices:
    A: Checking your mirrors frequently
    B: Maintaining a consistent speed
    C: Turning up the radio or rolling down the window to wake yourself up
    D: Keeping your eyes focused on your immediate path of travel
  answer: C
  explanation: Warning signs of fatigue include turning up the radio or rolling down
    the window to wake yourself up, yawning, and having trouble focusing.
- id: 213
  category: defensive_driving
  question: What is the recommended duration for a nap if you need to pull over due
    to fatigue?
  choices:
    A: 5 to 10 minutes
    B: 15 to 20 minutes
    C: 30 to 45 minutes
    D: 1 to 2 hours
  answer: B
  explanation: To prevent a fatigue-related crash, the manual recommends finding a
    safe parking area to take a 15 to 20 minute nap.
- id: 214
  category: safe_driving_rules
  question: 'To help prevent fatigue-related crashes, you should try to avoid driving
    late at night between the hours of:'
  choices:
    A: 9 p.m. and midnight
    B: 10 p.m. and 2 a.m.
    C: Midnight and 6 a.m.
    D: 2 a.m. and 8 a.m.
  answer: C
  explanation: The manual advises trying not to drive late at night between the hours
    of midnight and 6 a.m. to prevent fatigue.
- id: 215
  category: vehicle_information
  question: What is the primary purpose of rumble strips on the roadway?
  choices:
    A: To help vehicles stop faster in rain or snow
    B: To alert drivers of an upcoming toll booth
    C: To prevent fatigue-related crashes by alerting inattentive drivers
    D: To measure the speed of passing vehicles
  answer: C
  explanation: Rumble strips help prevent fatigue-related crashes. When a vehicle's
    tires pass over them, the driver is alerted by a sudden loud rumbling sound and
    vibration.
- id: 216
  category: alcohol_drugs_health
  question: How should you handle driving if you are feeling impatient?
  choices:
    A: Dart in and around other traffic to reach your destination faster.
    B: Drive slightly faster than the flow of traffic.
    C: Give yourself extra time for your trip and leave a few minutes early.
    D: Turn on your hazard lights to warn other drivers.
  answer: C
  explanation: If you are impatient, the manual suggests giving yourself extra time
    for your driving trip and leaving a few minutes early so you do not tend to speed.
- id: 217
  category: driver_responsibility
  question: According to the Teen-Parent Driver Agreement, why is driving especially
    dangerous for teens?
  choices:
    A: Teens have slower physical reflexes than older adults.
    B: The human brain does not fully develop its ability to assess risk and danger
      until the mid-20s.
    C: Teen driver training courses do not cover highway driving.
    D: Teens are not required to take a written knowledge test.
  answer: B
  explanation: Driving is especially dangerous for teens because the human brain does
    not fully develop its ability to assess risk and danger or control impulse until
    we reach our mid-20s.
- id: 218
  category: license_system
  question: What is the minimum number of supervised driving practice hours required
    by Connecticut law prior to getting a license?
  choices:
    A: 20 hours
    B: 30 hours
    C: 40 hours
    D: 100 hours
  answer: C
  explanation: Connecticut law requires a minimum of 40 hours of supervised driving
    practice prior to getting a license, though 100 hours is recommended.
- id: 219
  category: defensive_driving
  question: Which of the following is a sign that another driver on the road may be
    distracted?
  choices:
    A: They are traveling at a consistent speed.
    B: They are drifting over the lane divider lines.
    C: They are maintaining a 3 to 4 second following distance.
    D: They are checking their mirrors frequently.
  answer: B
  explanation: Signs of a distracted driver include vehicles that may drift over the
    lane divider lines or within their own lane, and vehicles traveling at inconsistent
    speeds.
- id: 220
  category: driver_responsibility
  question: What does passing a training course and obtaining a driver’s license mean
    for a teen driver?
  choices:
    A: They are now considered an expert driver.
    B: They no longer need to follow the Teen-Parent Driver Agreement.
    C: They are only a beginner, not necessarily a safe driver.
    D: They are legally allowed to use hands-free electronic devices.
  answer: C
  explanation: The manual states that passing a training course and obtaining a driver’s
    license means that a teen is only a beginner; it does not mean that a teen is
    a safe driver.
- id: 221
  category: safe_driving_rules
  question: In Connecticut, a teen driver may not drive between what hours, except
    for specific exemptions like school or a job?
  choices:
    A: 10pm and 6am
    B: 11pm and 5am
    C: Midnight and 5am
    D: 11pm and 6am
  answer: B
  explanation: Teen drivers in Connecticut may not drive between 11pm and 5am, except
    for school, a job, a medical or religious reason, or a Safe Rides program.
- id: 222
  category: license_system
  question: For the first six months with a license, who is a teen driver allowed
    to carry as a passenger?
  choices:
    A: Immediate family members only
    B: Up to two friends
    C: One adult who is supervising their driving
    D: Anyone as long as they wear a seatbelt
  answer: C
  explanation: For the first six months with a license, a teen driver may only carry
    one adult who is supervising their driving.
- id: 223
  category: safe_driving_rules
  question: Which of the following is true regarding electronic devices and teen drivers?
  choices:
    A: Hands-free cell phone use is permitted.
    B: Texting is allowed only when stopped at a red light.
    C: Driving while talking on a cell phone, even hands-free, is illegal.
    D: GPS devices can be programmed while the vehicle is in motion.
  answer: C
  explanation: Driving while texting, or talking on a cell phone (even hands-free)
    is illegal. Teen drivers should not use any illegal or distracting electronic
    device while the vehicle is in motion.
- id: 224
  category: alcohol_drugs_health
  question: Alcohol is involved in more than what percentage of traffic crashes in
    which someone is killed?
  choices:
    A: 20 percent
    B: 30 percent
    C: 40 percent
    D: 50 percent
  answer: C
  explanation: According to the manual, alcohol is involved in more than 40 percent
    of the traffic crashes in which someone is killed.
- id: 225
  category: alcohol_drugs_health
  question: What is the only thing that will sober you up after drinking alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Getting fresh air and exercise
    D: Time
  answer: D
  explanation: There is no way to sober up quickly. Coffee, fresh air, exercise, or
    cold showers will not help. Time is the only thing that will sober you up.
- id: 226
  category: alcohol_drugs_health
  question: According to the manual, which of the following constitutes one standard
    alcoholic drink?
  choices:
    A: A 5 oz. glass of wine
    B: An 8 oz. glass of beer
    C: A 2 oz. shot of 80-proof liquor
    D: A 16 oz. mug of beer
  answer: A
  explanation: An alcohol drink is defined as 1.5 oz. of 80-proof liquor, 12 oz. of
    beer, or a 5 oz. glass of wine.
- id: 227
  category: penalties_and_points
  question: Under Connecticut's "zero tolerance" law for drivers under 21, what blood
    alcohol content (BAC) is considered driving with a measurable amount of alcohol?
  choices:
    A: .01% or more
    B: .02% or more
    C: .05% or more
    D: .08% or more
  answer: B
  explanation: The law provides penalties for drivers under 21 driving with any measurable
    amount of alcohol in their blood, defined as two hundredths of one percent (.02%)
    or more.
- id: 228
  category: penalties_and_points
  question: Regardless of age, if you refuse to take a blood, breath, or urine test,
    your operator's license will be suspended for at least how many days?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Regardless of age, if you refuse to take a test, your operator’s license
    will be suspended for at least 45 days.
- id: 229
  category: penalties_and_points
  question: If a driver under 21 years of age fails a BAC test (.02% or higher), they
    will be required to install an ignition interlock device (IID) for at least how
    long?
  choices:
    A: 45 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: If a driver under 21 has test results of .02 percent or higher, they
    will be required to install and maintain an IID for at least one year as a condition
    of reinstatement.
- id: 230
  category: penalties_and_points
  question: For a 16- or 17-year-old driver, a first offense for speeding (20 mph
    over the speed limit) will result in a license suspension of how many days?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: For a 16- or 17-year-old driver, speeding (20 mph over the speed limit)
    carries a 60-day suspension for the first offense.
- id: 231
  category: penalties_and_points
  question: What is the penalty for a 16- or 17-year-old driver's first offense of
    using a cell phone or text messaging device?
  choices:
    A: A warning and a $50 fine
    B: A 30-day suspension and a $175 license restoration fee
    C: A 60-day suspension and a $175 license restoration fee
    D: A 6-month suspension and court fines
  answer: B
  explanation: A first offense for use of a cell phone or text messaging device by
    a 16- or 17-year-old results in a 30-day suspension, a $175 license restoration
    fee, and court fines.
- id: 232
  category: alcohol_drugs_health
  question: What can happen if you drink alcohol while taking other prescription or
    over-the-counter drugs?
  choices:
    A: The drugs will cancel out the effects of the alcohol.
    B: The alcohol will help the drugs work faster.
    C: It could multiply the effects of the alcohol or cause serious health problems.
    D: It will have no additional effect on your driving ability.
  answer: C
  explanation: Never drink alcohol while taking other drugs. These drugs could multiply
    the effects of alcohol or have additional effects of their own, potentially causing
    serious health problems or death.
- id: 233
  category: safe_driving_rules
  question: According to the Teen-Parent Driver Obligations, what is "joyriding"?
  choices:
    A: Driving with more than two passengers
    B: Driving with no destination or reason
    C: Driving over the speed limit for fun
    D: Driving a vehicle without the owner's permission
  answer: B
  explanation: The manual defines joyriding as "driving with no destination or reason"
    and states that it is not allowed.
- id: 234
  category: penalties_and_points
  question: A driver under the age of 18 cannot be considered a youthful offender
    if they commit which of the following offenses?
  choices:
    A: Street racing
    B: Driving under the influence of alcohol or drugs
    C: Operating while under suspension
    D: Reckless driving
  answer: B
  explanation: According to the manual, someone under the age of 18 cannot be considered
    a youthful offender if they commit negligent homicide with a motor vehicle, evade
    responsibility following an accident with death or serious injury, or drive under
    the influence of alcohol or drugs.
- id: 235
  category: driver_responsibility
  question: What should you do if you are pulled over by a police vehicle at night?
  choices:
    A: Step out of the vehicle to greet the officer
    B: Turn off your headlights and wait in the dark
    C: Turn on the vehicle's interior light after stopping and before the officer
      approaches
    D: Reach into your glove box to have your registration ready before the officer
      approaches
  answer: C
  explanation: When being stopped by a police vehicle at night, police recommend that
    you turn on the vehicle's interior light after stopping and before the officer
    approaches.
- id: 236
  category: penalties_and_points
  question: A motorist who is 25 years old or older is required to attend a certified
    operator retraining program if they have how many moving violation convictions?
  choices:
    A: One or more
    B: Two or more
    C: Three or more
    D: Five or more
  answer: C
  explanation: A motorist who is 25 years old or older and who has three or more such
    convictions is required to attend and successfully pass a certified operator retraining
    program.
- id: 237
  category: penalties_and_points
  question: If a driver completes the operator retraining program and commits another
    moving violation within three years, what is the penalty?
  choices:
    A: A fine of $500
    B: A license suspension of at least 30 days
    C: A permanent revocation of their license
    D: They must retake the driving test
  answer: B
  explanation: After completing operator retraining, an additional moving violation
    within three years of the completion date will result in a license suspension
    of at least 30 days.
- id: 238
  category: safe_driving_rules
  question: Which of the following is true regarding speed limits?
  choices:
    A: You cannot get a ticket if you are driving exactly the posted speed limit
    B: Speed limits are posted for ideal road conditions
    C: Stopping at 60 mph takes exactly twice the distance as stopping at 30 mph
    D: Speed limits only apply during daylight hours
  answer: B
  explanation: Speed limits are posted for ideal conditions. If the road is wet or
    icy, if you cannot see well, or if traffic is heavy, you must slow down. You can
    get a ticket for traveling too fast for road conditions even if you are driving
    the posted speed limit.
- id: 239
  category: safe_driving_rules
  question: Under ideal conditions, about how much distance does it take to react
    and bring your vehicle to a complete stop when traveling at 50 mph?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 400 feet
  answer: D
  explanation: At 50 mph, it can take you about 400 feet to react to something you
    see and bring your vehicle to a stop. That is about the length of a city block.
- id: 240
  category: safe_driving_rules
  question: How does the stopping distance at 60 mph compare to the stopping distance
    at 30 mph?
  choices:
    A: It takes half the distance
    B: It takes exactly twice the distance
    C: It takes over three times the distance
    D: It takes four times the distance
  answer: C
  explanation: The faster your vehicle is going, the more distance it will take to
    turn, slow, or stop. Stopping at 60 mph does not take twice the distance it takes
    at 30 mph, but over three times the distance.
- id: 241
  category: safe_driving_rules
  question: At an intersection where there is no stop sign, yield sign, or oncoming
    traffic signal, who must you yield to?
  choices:
    A: Vehicles coming from the left
    B: Vehicles coming from the right
    C: Vehicles turning left
    D: The largest vehicle
  answer: B
  explanation: At an intersection where there is no stop sign, yield sign or oncoming
    traffic signal, drivers must yield to vehicles coming from the right.
- id: 242
  category: safe_driving_rules
  question: If two vehicles arrive at a four-way stop at the same time, who has the
    right-of-way?
  choices:
    A: The vehicle on the left goes first
    B: The vehicle on the right goes first
    C: The vehicle traveling faster goes first
    D: The vehicle going straight goes first
  answer: B
  explanation: At a four-way stop, the driver reaching the intersection first goes
    first. If more than one vehicle arrives at the same time, the vehicle on the right
    goes first.
- id: 243
  category: sharing_the_road
  question: What should you do if you encounter a pedestrian using a guide dog or
    carrying a white cane?
  choices:
    A: Honk your horn lightly to let them know you are there
    B: Yield the right-of-way only if they are in a marked crosswalk
    C: Give them absolute right-of-way and do not use your horn
    D: Drive around them as quickly as possible
  answer: C
  explanation: Pedestrians using a guide dog or carrying a white cane have absolute
    right-of-way. Do not use your horn because it could confuse or frighten the pedestrian.
- id: 244
  category: safe_driving_rules
  question: When entering a traffic circle or rotary, who must yield the right-of-way?
  choices:
    A: Drivers already in the circle must yield to entering drivers
    B: Drivers entering the circle must yield to drivers already in the circle
    C: The driver on the left always yields
    D: Commercial vehicles have the right-of-way over passenger cars
  answer: B
  explanation: Drivers entering a traffic circle or rotary must yield to drivers already
    in the circle.
- id: 245
  category: driver_responsibility
  question: When being stopped by a police vehicle, when should you obtain your driver's
    license and vehicle registration?
  choices:
    A: As soon as you see the police lights
    B: While the officer is walking up to your car
    C: Only when requested by the officer
    D: Before you pull over to the side of the road
  answer: C
  explanation: When being stopped by a police vehicle, police recommend that you limit
    movements and obtain your driver license and/or vehicle registration only when
    requested.
- id: 246
  category: safe_driving_rules
  question: What is a potential consequence of driving much slower than other vehicles
    on the road?
  choices:
    A: It improves overall traffic flow
    B: It tends to make vehicles bunch up behind you and causes other traffic to pass
      you
    C: It reduces the chance of a rear-end collision
    D: It gives you the right-of-way at all intersections
  answer: B
  explanation: Going much slower than other vehicles can be just as bad as speeding.
    It tends to make vehicles bunch up behind you and causes the other traffic to
    pass you.
- id: 247
  category: safe_driving_rules
  question: When making a left turn at an intersection, who must you yield to?
  choices:
    A: Oncoming vehicles going straight
    B: Vehicles turning right from the opposite direction
    C: Vehicles behind you
    D: No one, left-turning vehicles have the right-of-way
  answer: A
  explanation: Drivers turning left must yield to oncoming vehicles going straight.
- id: 248
  category: safe_driving_rules
  question: What should you do if you and another vehicle arrive at a four-way stop
    at the exact same time?
  choices:
    A: The vehicle on the left goes first.
    B: The vehicle on the right goes first.
    C: The vehicle going straight goes first.
    D: The larger vehicle goes first.
  answer: B
  explanation: According to the manual, at a four-way stop, if more than one vehicle
    arrives at the same time, the vehicle on the right goes first.
- id: 249
  category: sharing_the_road
  question: What must you do if you are in the middle of an intersection when you
    see or hear an emergency vehicle approaching?
  choices:
    A: Stop immediately in the middle of the intersection.
    B: Pull over to the right side of the intersection and stop.
    C: Drive through the intersection before you pull over to the right and stop.
    D: Put your vehicle in reverse and back out of the intersection.
  answer: C
  explanation: The manual states that if you are in an intersection when an emergency
    vehicle approaches, you must drive through the intersection before you pull over.
- id: 250
  category: sharing_the_road
  question: When are you NOT required to stop for a school bus with its red lights
    flashing?
  choices:
    A: When the bus is on the opposite side of a standard two-lane road.
    B: When you are approaching the bus at an intersection.
    C: When the bus is traveling towards you and a median or physical barrier separates
      the roadway.
    D: When you are driving in the lane adjacent to the bus.
  answer: C
  explanation: You are not required to stop if the bus is traveling towards you and
    a median or other physical barrier separates the roadway.
- id: 251
  category: safe_driving_rules
  question: Which turn signal should you use when you are about to reach your intended
    exit point in a roundabout?
  choices:
    A: Left turn signal.
    B: Right turn signal.
    C: Both turn signals (hazard lights).
    D: No turn signal is required in a roundabout.
  answer: B
  explanation: The manual instructs drivers to use their right turn signal when they
    are about to reach their intended exit point in a roundabout.
- id: 252
  category: safe_driving_rules
  question: Where is it always illegal to make a U-turn?
  choices:
    A: In a residential neighborhood.
    B: On a multi-lane city street.
    C: On an expressway.
    D: At an intersection with a green light.
  answer: C
  explanation: 'The manual explicitly states: "Never make a U-turn on an expressway."'
- id: 253
  category: safe_driving_rules
  question: How should you position your wheels when parking on a hill?
  choices:
    A: Turn them sharply away from the curb.
    B: Keep them perfectly straight.
    C: Turn them sharply towards the side of the road or curb.
    D: Turn them to the left, regardless of the incline.
  answer: C
  explanation: When you park on a hill, you should turn your wheels sharply towards
    the side of the road or curb so that if the vehicle rolls, it will roll away from
    traffic.
- id: 254
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: A
  explanation: The manual lists "Within 10 feet of a fire hydrant" under the No-Parking
    Zones.
- id: 255
  category: safe_driving_rules
  question: You must not park your vehicle within how many feet of a stop sign?
  choices:
    A: 10 feet
    B: 15 feet
    C: 25 feet
    D: 50 feet
  answer: C
  explanation: The manual prohibits parking "Within 25 feet of a stop sign."
- id: 256
  category: safe_driving_rules
  question: According to the manual, what must you do if you turn on your windshield
    wipers due to rain or snow?
  choices:
    A: Turn on your hazard lights.
    B: Turn on your high beams.
    C: Turn on your headlights.
    D: Turn on your parking lights.
  answer: C
  explanation: 'The manual states: "Remember, if you turn on your wipers, turn on
    your headlights. It’s the law."'
- id: 257
  category: defensive_driving
  question: Why should you use low beams instead of high beams in fog or heavy rain?
  choices:
    A: High beams drain the vehicle's battery faster in cold weather.
    B: Light from high beams will reflect back, causing glare.
    C: Low beams are brighter than high beams in foggy conditions.
    D: High beams are illegal to use during the daytime.
  answer: B
  explanation: Use low beams in fog or when it is snowing or raining hard because
    light from high beams will reflect back, causing glare and making it more difficult
    to see ahead.
- id: 258
  category: safe_driving_rules
  question: When approaching an oncoming vehicle at night, at what distance should
    you dim your high beams?
  choices:
    A: Within about a one-block distance.
    B: Within 100 feet.
    C: Within 500 feet.
    D: Only when the other driver flashes their lights.
  answer: A
  explanation: The manual instructs drivers to "Dim your high beams whenever you come
    within about a one-block distance of an oncoming vehicle."
- id: 259
  category: safe_driving_rules
  question: High beam headlights allow you to see about 400 feet ahead. What is the
    recommended maximum speed to ensure you can stop within this distance?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: Your high beam headlights let you see about 400 feet ahead. You should
    drive at a speed that allows you to stop within this distance, or about 50 mph.
- id: 260
  category: safe_driving_rules
  question: When is it permissible to enter an intersection?
  choices:
    A: As soon as the light turns green, regardless of traffic ahead.
    B: Only when you can get completely through it without having to stop.
    C: When you need to make a turn and are waiting for a gap in oncoming traffic.
    D: Whenever you are following a large truck.
  answer: B
  explanation: Drivers may not enter an intersection unless they can get through it
    without having to stop, ensuring they do not block the intersection.
- id: 261
  category: safe_driving_rules
  question: 'When parking parallel to a curb, it is illegal to park your vehicle:'
  choices:
    A: Less than six inches from the curb.
    B: More than one foot from the curb.
    C: Facing the same direction as traffic.
    D: With the parking brake engaged.
  answer: B
  explanation: The No-Parking Zones section states that you must not park "More than
    one foot from the curb."
- id: 262
  category: defensive_driving
  question: When should you use a sharp blast on your horn rather than a light tap?
  choices:
    A: When greeting a friend.
    B: When a child is about to run into the street.
    C: When a driver is not paying attention.
    D: When approaching horses.
  answer: B
  explanation: According to the manual, you should sound a sharp blast on your horn
    when there is danger, such as a child or older person about to walk, run, or ride
    into the street.
- id: 263
  category: safe_driving_rules
  question: How far in advance should you try to signal before you make a move to
    change directions?
  choices:
    A: At least one second.
    B: At least three seconds.
    C: At least five seconds.
    D: At least ten seconds.
  answer: B
  explanation: The manual advises drivers to try and signal at least three seconds
    before making a move.
- id: 264
  category: defensive_driving
  question: What should you do if you intend to turn into a driveway just after an
    intersection?
  choices:
    A: Signal before entering the intersection to give ample warning.
    B: Wait until you reach the intersection before signaling.
    C: Use your emergency flashers instead of a turn signal.
    D: Tap your horn three times before signaling.
  answer: B
  explanation: If there are streets, driveways, or intersections between you and where
    you want to turn, wait until you have reached that point before signaling so other
    drivers do not get confused and pull into your path.
- id: 265
  category: defensive_driving
  question: How can you let drivers behind you know that you are about to slow down
    at an unexpected place?
  choices:
    A: Turn on your high beam headlights.
    B: Tap your brake pedal quickly three or four times.
    C: Sound a sharp blast on your horn.
    D: Shift into neutral and coast.
  answer: B
  explanation: If you are going to stop or slow down where another driver does not
    expect it, tap your brake pedal quickly three or four times to let those behind
    you know you are about to slow down.
- id: 266
  category: vehicle_information
  question: If your vehicle breaks down on the highway and you cannot get it off the
    roadway, where should you try to stop?
  choices:
    A: Just over a hill.
    B: Just around a blind curve.
    C: Where other drivers have a clear view of your vehicle.
    D: In the center lane of traffic.
  answer: C
  explanation: If you cannot get your vehicle off the roadway, try to stop where other
    drivers have a clear view of your vehicle, and do not stop just over a hill or
    around a curve.
- id: 267
  category: defensive_driving
  question: Which of the following is a recommended way to signal a vehicle emergency
    if your car breaks down?
  choices:
    A: Stand in the roadway and wave your arms.
    B: Tie a white cloth to the antenna, side mirror, or door handle.
    C: Sound your horn continuously for five minutes.
    D: Turn your headlights off and on rapidly.
  answer: B
  explanation: To signal an emergency, you can lift the hood or tie a white cloth
    to the antenna, side mirror, or door handle. The manual explicitly states to never
    stand in the roadway.
- id: 268
  category: vehicle_information
  question: What is the first thing you should do if your brakes suddenly stop working?
  choices:
    A: Shift into neutral immediately.
    B: Pull on the parking brake as hard and fast as possible.
    C: Pump the brake pedal several times.
    D: Turn off the ignition.
  answer: C
  explanation: If your brakes stop working, you should first pump the brake pedal
    several times, which will often build up enough brake pressure to allow you to
    stop.
- id: 269
  category: vehicle_information
  question: What is the proper response if you experience a sudden tire blowout while
    driving?
  choices:
    A: Slam on the brakes and stop in the road immediately.
    B: Hold the steering wheel tightly, keep going straight, and slow down gradually.
    C: Turn the steering wheel sharply toward the side of the blowout.
    D: Speed up to maintain control of the vehicle's momentum.
  answer: B
  explanation: If a tire suddenly goes flat, hold the steering wheel tightly, keep
    the vehicle going straight, and slow down gradually by taking your foot off the
    gas and using the brakes lightly.
- id: 270
  category: vehicle_information
  question: If your engine dies while you are driving, what should you expect regarding
    your vehicle's controls?
  choices:
    A: The steering wheel will lock immediately.
    B: The brakes will stop working completely.
    C: It may be difficult to turn the steering wheel, and you may have to push very
      hard on the brake pedal.
    D: The vehicle will automatically shift into park.
  answer: C
  explanation: If the engine dies (power failure), keep a strong grip on the steering
    wheel as it may be difficult to turn. The brakes will still work, but you may
    have to push very hard on the brake pedal.
- id: 271
  category: vehicle_information
  question: What should you do if your gas pedal sticks and the motor keeps going
    faster and faster?
  choices:
    A: Quickly shift to neutral.
    B: Turn the ignition to the 'lock' position immediately.
    C: Pump the gas pedal repeatedly.
    D: Apply the parking brake abruptly.
  answer: A
  explanation: If the gas pedal sticks, you should keep your eyes on the road, quickly
    shift to neutral, pull off the road when safe, and turn off the engine.
- id: 272
  category: safe_driving_rules
  question: Why must you never turn your vehicle's ignition to the 'lock' position
    while it is still in motion?
  choices:
    A: It will cause the engine to catch fire.
    B: The steering will lock and you will lose control of your vehicle.
    C: It will cause the tires to blow out.
    D: The gas pedal will stick.
  answer: B
  explanation: Never turn your vehicle's ignition to the 'lock' position while it
    is still in motion or the steering will lock and you will lose control of your
    vehicle.
- id: 273
  category: vehicle_information
  question: How should you brake if you need to stop quickly and your vehicle is equipped
    with an Antilock Braking System (ABS)?
  choices:
    A: Pump the brakes rapidly to avoid skidding.
    B: Press on the brake pedal as hard as you can and keep pressing on it.
    C: Apply the brakes lightly and shift to a lower gear.
    D: Let up on the brake pedal if you feel it pushing back.
  answer: B
  explanation: With ABS, if you need to stop quickly, press on the brake pedal as
    hard as you can and keep pressing on it. Do not let up if you feel the pedal pushing
    back, as the system only works with the pedal pushed down.
- id: 274
  category: vehicle_information
  question: If you must stop quickly and your vehicle does NOT have ABS, what should
    you do if the brakes lock up and the vehicle starts to skid?
  choices:
    A: Quickly let up on the brake pedal, then push down again as soon as the vehicle
      stops skidding.
    B: Press harder on the brake pedal until the vehicle stops.
    C: Pull the parking brake immediately.
    D: Turn the steering wheel sharply in the opposite direction of the skid.
  answer: A
  explanation: Without ABS, if the brakes lock up and you feel the vehicle start to
    skid, quickly let up on the brake pedal. As soon as the vehicle stops skidding,
    push down on the brake pedal again.
- id: 275
  category: defensive_driving
  question: When trying to avoid a collision, what is generally true about turning
    versus stopping?
  choices:
    A: It is always better to crash head-on than to run off the road.
    B: You can usually stop the vehicle more quickly than you can turn it.
    C: In most cases, you can turn the vehicle more quickly than you can stop it.
    D: You should never turn away from a collision if you are driving without ABS.
  answer: C
  explanation: The manual states that in most cases, you can turn the vehicle more
    quickly than you can stop it, and you should consider turning in order to avoid
    a collision. It also notes it is generally better to run off the road than to
    crash head-on.
- id: 276
  category: vehicle_information
  question: What is the primary cause of a vehicle skidding?
  choices:
    A: Driving with under-inflated tires
    B: Traveling too fast for conditions
    C: Applying the parking brake while moving
    D: Steering too sharply at low speeds
  answer: B
  explanation: According to the manual, skids happen when a driver travels too fast
    for conditions, causing the tires to lose their grip on the road.
- id: 277
  category: defensive_driving
  question: If your vehicle begins to skid, what is the first thing you should do?
  choices:
    A: Pump the brakes rapidly
    B: Steer in the opposite direction of the skid
    C: Stay off the brake
    D: Accelerate to regain traction
  answer: C
  explanation: The manual states that if your vehicle begins to skid, you should stay
    off the brake. Until the vehicle slows, your brakes will not work and could cause
    you to skid more.
- id: 278
  category: defensive_driving
  question: If you are about to be hit from the front, what is the best action to
    take to lessen injuries?
  choices:
    A: Lock your brakes and brace for impact
    B: Try to turn the vehicle to have a 'glancing blow'
    C: Throw your hands in front of your face
    D: Speed up to reduce the impact time
  answer: B
  explanation: If your vehicle is about to be hit from the front, it is important
    to try and have a 'glancing blow' rather than being struck head-on by turning
    the vehicle.
- id: 279
  category: defensive_driving
  question: What should you do to prepare if your vehicle is about to be hit from
    the rear?
  choices:
    A: Lean forward toward the steering wheel
    B: Unbuckle your seatbelt to escape quickly
    C: Press yourself against the back of your seat and put your head against the
      head restraint
    D: Turn your vehicle sideways
  answer: C
  explanation: If hit from the rear, your body will be thrown backwards. You should
    press yourself against the back of your seat, put your head against the head restraint,
    and be ready to apply your brakes.
- id: 280
  category: driver_responsibility
  question: What must you do if you are involved in an accident with a parked vehicle
    and cannot locate the owner?
  choices:
    A: Leave the scene and report it to your insurance company later
    B: Wait by the vehicle until the owner returns
    C: Leave a note in a visible place with the date, time, and your contact information
    D: Call a tow truck to move the parked vehicle
  answer: C
  explanation: Should the accident involve a parked vehicle and you cannot find the
    owner, you must leave a note in a place where it can be seen with the date and
    time of the accident and information on how the owner can reach you.
- id: 281
  category: driver_responsibility
  question: Under what circumstances should you move an injured person at an accident
    scene?
  choices:
    A: Only if they are in a burning vehicle or in other immediate danger of being
      hit
    B: Whenever they complain of back or neck pain
    C: As soon as possible to get them off the roadway
    D: Only if they ask you to help them stand up
  answer: A
  explanation: Do not move the injured unless they are in a burning vehicle or in
    other immediate danger of being hit by another vehicle, as moving a person can
    make their injuries worse.
- id: 282
  category: driver_responsibility
  question: If someone is injured in a crash and is bleeding severely, what should
    you do?
  choices:
    A: Give them plenty of water to drink
    B: Apply pressure directly on the wound with your hand or a cloth
    C: Move them to the side of the road immediately
    D: Wait for paramedics before attempting to stop the bleeding
  answer: B
  explanation: If there is bleeding, apply pressure directly on the wound with your
    hand or with a cloth. Even severe bleeding can almost always be stopped or slowed
    by putting pressure on the wound.
- id: 283
  category: signs_and_signals
  question: What do solid white lines on the right edge of the roadway indicate?
  choices:
    A: The center of a two-way road
    B: A lane reserved for high occupancy vehicles
    C: Where the right edge of the road is located
    D: A crosswalk is approaching
  answer: C
  explanation: Edge lines are solid lines along the side of the road that show you
    where the edge of the road is located. Solid white lines are used on the right
    of the roadway edge.
- id: 284
  category: signs_and_signals
  question: What does a dashed yellow line alongside a solid yellow line indicate?
  choices:
    A: Passing is permitted on both sides
    B: Passing is permitted on the side of the broken line, but not on the side of
      the solid line
    C: Passing is not permitted on either side
    D: The lane is reserved for left turns only
  answer: B
  explanation: A dashed yellow line alongside a solid yellow line indicates that passing
    is permitted on the side of the broken line, but not on the side of the solid
    line.
- id: 285
  category: safe_driving_rules
  question: When are you allowed to cross solid double yellow lines?
  choices:
    A: When passing a slow-moving vehicle
    B: When making a left turn to or from an alley, private road, driveway, or street
    C: When the vehicle ahead is stopped for a pedestrian
    D: You are never allowed to cross solid double yellow lines
  answer: B
  explanation: Solid double yellow lines mark the center of the roadway. However,
    solid yellow lines may be crossed to make a left turn to or from an alley, private
    road, driveway, or street.
- id: 286
  category: signs_and_signals
  question: What does a white diamond painted on the road surface generally indicate?
  choices:
    A: A pedestrian crosswalk
    B: A lane reserved for special use, such as High Occupancy Vehicles (HOV)
    C: A shared center turn lane
    D: A yield line
  answer: B
  explanation: Reserved lanes are marked by signs stating that the lane is reserved
    for special use and often have a white diamond posted at the side of the road
    or painted on the road surface.
- id: 287
  category: safe_driving_rules
  question: What is the purpose of a shared center lane?
  choices:
    A: For passing slow-moving vehicles
    B: For parking during emergencies
    C: For making left turns or U-turns when permitted
    D: For high occupancy vehicles only
  answer: C
  explanation: Shared center lanes are reserved for making left turns (or U-turns
    when they are permitted), but can be used by vehicles traveling in both directions.
- id: 288
  category: driver_responsibility
  question: When is it legally required to report an accident to the police?
  choices:
    A: Only if the damage exceeds $1,000
    B: Only if one of the drivers is uninsured
    C: If there is an injury, a death, or property damage
    D: Only if the accident occurs on a state highway
  answer: C
  explanation: 'The manual states: ''You must report the accident to police if there
    is an injury, a death or property damage.'''
- id: 289
  category: signs_and_signals
  question: What do solid white lines between lanes of traffic moving in the same
    direction indicate?
  choices:
    A: You may cross freely to change lanes
    B: You should stay in your lane unless a special situation requires you to change
      lanes
    C: The lane is ending and you must merge left
    D: You are approaching a toll booth
  answer: B
  explanation: Solid white lines are between lanes of traffic that indicate you should
    stay in your lane unless a special situation requires you to change lanes.
- id: 290
  category: signs_and_signals
  question: What does a pentagon-shaped sign indicate?
  choices:
    A: Railroad crossing
    B: School zone and school crossing
    C: No passing zone
    D: Yield the right-of-way
  answer: B
  explanation: According to the manual, the pentagon (five-sided) shape marks school
    zones and warns you about school crossings.
- id: 291
  category: signs_and_signals
  question: What does a steady yellow 'X' above a reversible lane mean?
  choices:
    A: The lane is for turning only.
    B: You can safely use the lane beneath it.
    C: The use of the lane is changing and you should move out of it as soon as it
      is safe.
    D: You cannot use the lane under any circumstances.
  answer: C
  explanation: A steady yellow 'X' means that the use of the lane is changing and
    you should move out of it as soon as it is safe to do so.
- id: 292
  category: safe_driving_rules
  question: What should you do if you are already in the intersection when the traffic
    light turns yellow?
  choices:
    A: Stop immediately in the middle of the intersection.
    B: Back up out of the intersection.
    C: Do not stop and continue through the intersection.
    D: Pull over to the side of the intersection and wait for a green light.
  answer: C
  explanation: The manual states that if you are in the intersection when the yellow
    light comes on, do not stop—continue through the intersection.
- id: 293
  category: signs_and_signals
  question: Which sign color is used to indicate parks and recreation areas?
  choices:
    A: Blue
    B: Green
    C: Orange
    D: Brown
  answer: D
  explanation: According to the manual, brown is used for parks and recreation signs.
- id: 294
  category: signs_and_signals
  question: What does a flashing red light on a High-Intensity Activated CrossWalK
    (HAWK) signal indicate?
  choices:
    A: The signal is about to deactivate; drivers must stop but may proceed when pedestrians
      have cleared.
    B: Pedestrians are currently in the crosswalk and motorists must remain stopped.
    C: The signal has not been activated and vehicles may proceed without stopping.
    D: The pedestrian signal is about to change to solid yellow.
  answer: A
  explanation: A flashing red HAWK signal means the signal is about to deactivate.
    Drivers must stop but may proceed when pedestrians have cleared the crosswalk.
- id: 295
  category: sharing_the_road
  question: What does a bicycle sharrow (two chevrons painted above a bicycle symbol)
    indicate?
  choices:
    A: The lane is reserved for bicycles only.
    B: The lane is shared and vehicle or bicycle traffic may be in the lane.
    C: Bicycles are prohibited from using the lane.
    D: A bicycle crossing is ahead.
  answer: B
  explanation: A bicycle sharrow indicates the lane is shared. Vehicle or bicycle
    traffic may be in the lane, serving as an additional warning to watch for bicycles.
- id: 296
  category: signs_and_signals
  question: Where is a pennant-shaped 'No Passing Zone' sign typically posted?
  choices:
    A: On the right side of a four-lane highway.
    B: On the left side of a two-lane, two-way roadway.
    C: Above the center of an intersection.
    D: On the right side of a one-way street.
  answer: B
  explanation: The manual states that the three-sided pennant sign is used on the
    left side of a two-lane, two-way roadway at the beginning of a NO-PASSING ZONE.
- id: 297
  category: signs_and_signals
  question: 'A flashing red traffic light means the same as a:'
  choices:
    A: Yield sign
    B: Stop sign
    C: Warning sign
    D: Do Not Enter sign
  answer: B
  explanation: A flashing red traffic light means the same as a stop sign. You must
    come to a full stop and you may proceed when it is safe to do so.
- id: 298
  category: safe_driving_rules
  question: What does a double solid white line on the pavement indicate?
  choices:
    A: It marks a shared center lane for left turns.
    B: It channels traffic around a hazard.
    C: It prohibits lane changing.
    D: It indicates a reversible lane.
  answer: C
  explanation: According to the manual's section on pavement markings, a double solid
    white line prohibits lane changing.
- id: 299
  category: signs_and_signals
  question: What type of information do orange traffic signs provide?
  choices:
    A: Directions and distances to cities.
    B: Rules for traffic direction and speed.
    C: Services available along the roadway.
    D: Possible dangers ahead due to construction and maintenance projects.
  answer: D
  explanation: Orange is used for warning signs to alert you to possible dangers ahead
    due to construction and maintenance projects.
- id: 300
  category: safe_driving_rules
  question: When are you permitted to turn right on a red traffic light?
  choices:
    A: Only when a green arrow is also illuminated.
    B: After coming to a full stop, checking for traffic, and if no sign prohibits
      it.
    C: Without stopping, as long as there are no pedestrians in the crosswalk.
    D: Right turns on red are never permitted.
  answer: B
  explanation: If you are turning right on red, you may turn after coming to a full
    stop and checking to make sure that there is no oncoming traffic and no sign prohibiting
    the turn on a red light.
- id: 301
  category: signs_and_signals
  question: Which sign is described as a square sign with a white horizontal line
    inside a red ball?
  choices:
    A: Stop Sign
    B: Yield Sign
    C: Do Not Enter Sign
    D: Wrong Way Sign
  answer: C
  explanation: A square sign with a white horizontal line inside a red ball means
    you cannot enter. This is the Do Not Enter sign.
- id: 302
  category: safe_driving_rules
  question: What does a diamond-shaped marker on the roadway indicate?
  choices:
    A: A lane reserved for bicycles.
    B: A lane reserved for buses only.
    C: A lane reserved for vehicles with more than one person in them (HOV).
    D: A fixed obstruction ahead.
  answer: C
  explanation: A diamond-shaped marker indicates 'HOV' (High Occupancy Vehicles) lanes,
    which are reserved for vehicles with more than one person in them.
- id: 303
  category: signs_and_signals
  question: What does a yellow arrow traffic signal mean?
  choices:
    A: You can safely turn in the direction of the arrow.
    B: The protection of a green arrow is ending and you should prepare to stop.
    C: You must stop and cannot go in that direction.
    D: Yield to pedestrians before turning.
  answer: B
  explanation: A yellow arrow means that the protection of a green arrow is ending;
    if you are turning in the direction of the arrow, you should prepare to stop.
- id: 304
  category: signs_and_signals
  question: What does a square sign with a white horizontal line inside a red ball
    indicate?
  choices:
    A: You must yield to oncoming traffic.
    B: You cannot enter the roadway.
    C: A railroad crossing is ahead.
    D: You are approaching a school zone.
  answer: B
  explanation: According to the manual, a square sign with a white horizontal line
    inside a red ball is a 'Do Not Enter' sign, which means you cannot enter.
- id: 305
  category: signs_and_signals
  question: What color and shape are most warning signs?
  choices:
    A: Red and octagonal
    B: Green and rectangular
    C: Yellow and diamond-shaped
    D: Blue and square
  answer: C
  explanation: The manual states that warning signs are usually yellow with black
    lettering or symbols, and most are diamond-shaped.
- id: 306
  category: safe_driving_rules
  question: 'When driving on wet pavement where a ''Slippery when Wet'' sign is posted,
    you should:'
  choices:
    A: Brake hard to test the road surface.
    B: Increase the distance between your car and the one ahead.
    C: Change directions quickly to avoid puddles.
    D: Maintain your normal speed and following distance.
  answer: B
  explanation: When pavement is wet, you should reduce your speed, avoid braking hard
    or changing direction suddenly, and increase the distance between your car and
    the one ahead.
- id: 307
  category: signs_and_signals
  question: What is the purpose of a Rectangular Rapid Flashing Beacon (RRFB)?
  choices:
    A: To warn drivers of a railroad crossing ahead.
    B: To indicate a detour route in a construction zone.
    C: To allow pedestrians to safely cross streets with high traffic volumes at uncontrolled
      approaches.
    D: To signal that a divided highway is ending.
  answer: C
  explanation: An RRFB is designed to allow pedestrians to safely cross streets with
    high volumes of traffic at uncontrolled approaches to unsignalized intersections
    or mid-block pedestrian crossings.
- id: 308
  category: sharing_the_road
  question: When a 'Merge' sign indicates that two lanes of traffic are about to become
    one, who is responsible for merging smoothly?
  choices:
    A: Only the drivers in the lane that is ending.
    B: Only the drivers in the continuing lane.
    C: Drivers in both lanes.
    D: The vehicle traveling at the highest speed.
  answer: C
  explanation: The manual states that when two lanes of traffic are about to become
    one, drivers in both lanes are responsible for merging smoothly.
- id: 309
  category: signs_and_signals
  question: What do brown traffic signs indicate?
  choices:
    A: Construction and maintenance areas
    B: Parks and recreational areas
    C: Motorist services like gas stations and hospitals
    D: Destination and distance information
  answer: B
  explanation: Parks and Recreation signs are brown. They guide you to recreational
    areas and parks.
- id: 310
  category: signs_and_signals
  question: Which signs are square or rectangle shaped and blue with white letters
    or symbols?
  choices:
    A: Service signs
    B: Warning signs
    C: Work area signs
    D: Route number signs
  answer: A
  explanation: Service signs are square or rectangle shaped and are blue with white
    letters or symbols. They show the locations of various services, such as rest
    areas, gas stations, or hospitals.
- id: 311
  category: signs_and_signals
  question: How are mileposts typically numbered along a freeway?
  choices:
    A: Zero starts at the north and east borders of the state.
    B: Zero starts at the south and west borders of the state.
    C: They are numbered randomly based on exit numbers.
    D: Zero starts at the exact center of the state.
  answer: B
  explanation: Mileposts are placed every mile along the freeway, and zero usually
    starts at the south and west borders of the state.
- id: 312
  category: safe_driving_rules
  question: 'When crossing railroad tracks, it is wise NOT to:'
  choices:
    A: Look both ways before crossing.
    B: Shift gears while crossing.
    C: Ensure there is room for your vehicle on the far side.
    D: Yield to crossing trains.
  answer: B
  explanation: The manual advises that it is wise not to shift gears when crossing
    railroad tracks because your vehicle might stall.
- id: 313
  category: signs_and_signals
  question: 'A white, X-shaped ''crossbuck'' sign at a railroad crossing has the same
    meaning as a:'
  choices:
    A: Stop sign
    B: Yield sign
    C: Do Not Enter sign
    D: Speed Limit sign
  answer: B
  explanation: A white, X-shaped sign or 'crossbuck' is located at the railroad crossing
    and has the same meaning as a 'Yield' sign. You must yield to crossing trains.
- id: 314
  category: signs_and_signals
  question: What does a blue Emergency Notification System sign at a highway-rail
    grade crossing provide?
  choices:
    A: The current speed limit for trains
    B: A 24/7 telephone number to report problems or emergencies at the crossing
    C: Directions to the nearest hospital
    D: The radio frequency for weather updates
  answer: B
  explanation: A blue colored Emergency Notification System sign provides the public
    with a 24/7/365 telephone number to call to report problems or emergencies at
    these railroad locations.
- id: 315
  category: signs_and_signals
  question: If you see a downward-pointing arrow plaque below a Pedestrian Crossing
    sign, what does it indicate?
  choices:
    A: A detour route for pedestrians
    B: The actual location of the crosswalk
    C: That pedestrians must yield to vehicles
    D: A steep hill ahead
  answer: B
  explanation: Pedestrian Crossing signs may have a separate downward-pointing arrow
    plaque, which indicates the actual location of the crosswalk.
- id: 316
  category: signs_and_signals
  question: What does a 'Keep Right' sign tell you to do?
  choices:
    A: Drive to the side indicated by the arrow when approaching obstructions in the
      middle of the roadway.
    B: Move into the right lane to allow faster traffic to pass.
    C: Only make right turns at the next intersection.
    D: Park your vehicle on the right side of the road.
  answer: A
  explanation: The Keep Right sign tells you where to drive when you approach traffic
    islands, medians or other obstructions in the middle of the roadway. You must
    drive to the side indicated by the arrow.
- id: 317
  category: sharing_the_road
  question: What is the "No-Zone" area?
  choices:
    A: A zone where parking is strictly prohibited
    B: An area where passing is not allowed
    C: The danger areas around a truck where there are blind spots for the driver
    D: A designated quiet zone in residential areas
  answer: C
  explanation: The manual defines the No-Zone area as the danger areas around a truck
    where there are blind spots for the driver.
- id: 318
  category: safe_driving_rules
  question: At a four-way stop, which vehicle goes first?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The largest vehicle
    D: The vehicle going straight
  answer: B
  explanation: According to the study question answers, at a four-way stop, the vehicle
    on the right goes first.
- id: 319
  category: safe_driving_rules
  question: What should you do when you change lanes?
  choices:
    A: Look over your shoulder in the direction you plan to move
    B: Rely solely on your rearview mirror
    C: Speed up to merge quickly
    D: Tap your brakes before moving
  answer: A
  explanation: The manual states that when you change lanes you should look over your
    shoulder in the direction you plan to move.
- id: 320
  category: defensive_driving
  question: 'If an approaching vehicle fails to dim their headlights, you should:'
  choices:
    A: Turn on your high beams and leave them on
    B: Flash your headlights quickly a couple of times
    C: Look directly into the approaching headlights
    D: Pull over and wait for them to pass
  answer: B
  explanation: If an approaching vehicle fails to dim their headlights, the manual
    advises to flash your headlights quickly a couple of times.
- id: 321
  category: signs_and_signals
  question: 'A pentagon-shaped sign means:'
  choices:
    A: There is a railroad crossing
    B: There is a No Passing Zone
    C: There is a school zone
    D: You must yield
  answer: C
  explanation: The manual's study questions indicate that a pentagon-shaped sign means
    there is a school zone.
- id: 322
  category: signs_and_signals
  question: 'Green road signs are used as:'
  choices:
    A: Regulatory signs
    B: Guide signs
    C: Warning signs
    D: Stop signs
  answer: B
  explanation: According to the study questions, green road signs are guide signs.
- id: 323
  category: signs_and_signals
  question: 'Solid yellow lines between lanes indicate:'
  choices:
    A: Only cars on one side of the lane may pass
    B: You may change lanes if you choose to do so
    C: Passing is not allowed
    D: The lane is ending
  answer: C
  explanation: Solid yellow lines between lanes indicate that passing is not allowed.
- id: 324
  category: vehicle_information
  question: According to the manual, which of the following statements about after-market
    vehicle equipment is true?
  choices:
    A: Any changes to equipment, such as tinted windows, are always legal.
    B: After-market changes to equipment, such as tinted windows, are not automatically
      legal.
    C: Tinted windows are required on all after-market vehicles.
    D: You may not make any changes to your vehicle's equipment.
  answer: B
  explanation: The manual identifies the statement 'After market, any changes to equipment,
    such as tinted windows, are legal' as false, meaning such changes are not automatically
    legal.
- id: 325
  category: penalties_and_points
  question: How are license suspension and revocation inquiries handled by the DMV?
  choices:
    A: By telephone and mail only
    B: In person at any DMV branch
    C: Through the DMV website only
    D: By email and telephone
  answer: A
  explanation: 'The DMV directory notes: ''Please Note: Suspension and revocation
    inquiries are handled by telephone and mail only.'''
- id: 326
  category: license_system
  question: During what hours are DMV agents available by telephone for general inquiries?
  choices:
    A: Monday through Friday, 9 a.m. to 5 p.m.
    B: Monday through Friday, 8 a.m. to 4 p.m.
    C: 24 hours a day, 7 days a week
    D: Weekends only, 8 a.m. to 4 p.m.
  answer: B
  explanation: The manual states that DMV agents are available Monday through Friday,
    8 a.m. to 4 p.m.
- id: 327
  category: license_system
  question: When is pre-recorded DMV information available by telephone?
  choices:
    A: Monday through Friday, 8 a.m. to 4 p.m.
    B: Only during weekend hours
    C: 24 hours a day
    D: Only when agents are unavailable
  answer: C
  explanation: The DMV directory states that pre-recorded information is available
    24 hours a day.
- id: 328
  category: vehicle_information
  question: Purchasing a "Sound Plate" helps to preserve which Connecticut resource?
  choices:
    A: The Connecticut River
    B: State Parks and Forests
    C: Long Island Sound
    D: Local wildlife habitats
  answer: C
  explanation: The manual includes a notice to 'Buy the Sound Plate' to 'Help To Preserve
    Long Island Sound, Connecticut's Treasured Resource.'
- id: 329
  category: penalties_and_points
  question: If you need to speak to an agent regarding a suspension matter, what days
    are they available?
  choices:
    A: Monday through Saturday
    B: Monday through Friday
    C: Tuesday through Thursday
    D: Weekends only
  answer: B
  explanation: For suspension matters, the manual lists agent availability as Monday
    through Friday, 8 a.m. to 4 p.m.
- id: 330
  category: driver_responsibility
  question: What is the vision of the Connecticut Coalition for Organ and Tissue Donation?
  choices:
    A: To provide free medical care to all drivers
    B: A world where everyone who needs an organ or tissue transplant gets one
    C: To mandate organ donation for all licensed drivers
    D: To fund research for artificial organs
  answer: B
  explanation: The manual states that the Coalition 'sees a world where everyone who
    needs an organ or tissue transplant – gets one.'
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 331
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
