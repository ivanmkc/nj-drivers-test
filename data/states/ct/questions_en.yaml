metadata:
  source: 2025 Connecticut Driver's Manual
  total_questions: 259
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Connecticut, what is the minimum age an individual must be to obtain
    a learner's permit?
  choices:
    A: 15 years old
    B: 15 and a half years old
    C: 16 years old
    D: 17 years old
  answer: C
  explanation: In Connecticut, you must be at least 16 years old to be eligible for
    a learner's permit.
- id: 2
  category: license_system
  question: During the first six months of holding a driver's license, a 16 or 17-year-old
    driver in Connecticut may only transport which of the following passengers?
  choices:
    A: Any friend over the age of 18
    B: A licensed driving instructor or a parent/guardian
    C: Up to three siblings
    D: Anyone as long as they wear a seatbelt
  answer: B
  explanation: For the first six months, a 16 or 17-year-old driver is restricted
    to carrying a licensed driving instructor, parents or legal guardians (at least
    one of whom holds a valid license), or one person who is at least 20 years old
    and has held a license for four years without suspension.
- id: 3
  category: license_system
  question: What is the curfew for a 16 or 17-year-old licensed driver in Connecticut?
  choices:
    A: 10 PM to 5 AM
    B: 11 PM to 5 AM
    C: Midnight to 6 AM
    D: 9 PM to 6 AM
  answer: B
  explanation: Connecticut law prohibits 16 and 17-year-old drivers from being on
    the road between 11 PM and 5 AM, unless for employment, school, religious activities,
    or medical necessity.
- id: 4
  category: license_system
  question: In Connecticut, how many hours of behind-the-wheel training are required
    for a 16 or 17-year-old applicant before they can take the road test?
  choices:
    A: 20 hours
    B: 30 hours
    C: 40 hours
    D: 50 hours
  answer: C
  explanation: Connecticut requires 40 hours of behind-the-wheel instruction for 16
    and 17-year-old applicants before they are eligible for a driver's license.
- id: 5
  category: license_system
  question: Which of the following is true regarding cell phone use for a 16 or 17-year-old
    driver in Connecticut?
  choices:
    A: They may use a hands-free device only.
    B: They may use a cell phone only for GPS navigation.
    C: They are prohibited from using any mobile device, including hands-free, while
      driving.
    D: They may use a cell phone if they are stopped at a red light.
  answer: C
  explanation: Drivers under the age of 18 in Connecticut are strictly prohibited
    from using any mobile electronic device while driving, even if it is hands-free.
- id: 6
  category: license_system
  question: If a 16 or 17-year-old driver violates the passenger restriction or curfew
    laws, their license will be suspended for how long for a first offense?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: A first-time violation of GDL restrictions (passenger, curfew, or cell
    phone) results in a 30-day license suspension and a $175 license restoration fee.
- id: 7
  category: license_system
  question: In Connecticut, a learner's permit is valid for how long from the date
    of issuance?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: Until the holder turns 21
  answer: B
  explanation: A Connecticut learner's permit is valid for two years from the date
    it is issued.
- id: 8
  category: license_system
  question: If you are 18 years of age or older and applying for a Connecticut driver's
    license for the first time, you must hold an adult learner's permit for at least
    how many days before taking the road test?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Adults (18+) who have never held a license must hold an adult learner's
    permit for at least 90 days before they can take the road test.
- id: 9
  category: license_system
  question: Under Connecticut law, a police officer can immediately seize the driver's
    license of a 16 or 17-year-old for 48 hours for which of the following?
  choices:
    A: Any moving violation
    B: Driving with more than one passenger
    C: Failing to use a turn signal
    D: Driving 10 mph over the speed limit
  answer: B
  explanation: Police can impose a 48-hour on-the-spot license suspension for 16/17-year-olds
    for certain violations, including passenger restrictions, curfew violations, or
    reckless driving.
- id: 10
  category: license_system
  question: What is the minimum vision requirement in Connecticut to obtain a driver's
    license without restrictions?
  choices:
    A: 20/20 in both eyes
    B: 20/40 in at least one eye
    C: 20/50 in both eyes
    D: 20/70 in at least one eye
  answer: B
  explanation: Connecticut requires at least 20/40 vision in at least one eye, with
    or without corrective lenses, to qualify for a license.
- id: 11
  category: license_system
  question: How many hours of classroom instruction are required as part of the mandatory
    'Safe Driving Practices' course for all new CT drivers?
  choices:
    A: 4 hours
    B: 8 hours
    C: 12 hours
    D: 15 hours
  answer: B
  explanation: All applicants for a new driver's license in Connecticut must complete
    an 8-hour Safe Driving Practices course, which includes a drug and alcohol safety
    component.
- id: 12
  category: license_system
  question: If you change your address within Connecticut, you must notify the DMV
    of the change within how many hours?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 1 week
  answer: B
  explanation: Connecticut law requires residents to notify the DMV of an address
    change within 48 hours.
- id: 13
  category: license_system
  question: In Connecticut, a 16 or 17-year-old driver's license will be suspended
    for 6 months for a first offense of which of the following?
  choices:
    A: Speeding (20 mph or more over the limit)
    B: Driving under the influence (DUI)
    C: Failure to wear a seatbelt
    D: Parking in a fire zone
  answer: B
  explanation: A first-offense DUI for a driver under 21 in Connecticut results in
    a license suspension of at least 45 days followed by a period of driving only
    with an Ignition Interlock Device (IID), but the administrative suspension for
    the arrest itself is significant.
- id: 14
  category: license_system
  question: Which of the following documents is NOT acceptable as primary proof of
    identity for a Connecticut REAL ID-compliant license?
  choices:
    A: A valid U.S. Passport
    B: A certified U.S. Birth Certificate
    C: A Social Security Card
    D: A Permanent Resident Card
  answer: C
  explanation: While a Social Security Card is required for the application, it is
    used as proof of SSN, not as primary proof of identity/legal presence. Primary
    identity documents include passports, birth certificates, or green cards.
- id: 15
  category: license_system
  question: In Connecticut, a parent or legal guardian of a 16 or 17-year-old permit
    holder must complete which of the following before the teen can take the road
    test?
  choices:
    A: A 5-hour defensive driving course
    B: A 2-hour mandatory parent training session
    C: A 10-hour supervised driving log verification
    D: A written exam on Connecticut traffic laws
  answer: B
  explanation: Connecticut law requires a parent or legal guardian of a 16 or 17-year-old
    to attend a two-hour parent training session at a commercial driving school or
    secondary school.
- id: 16
  category: license_system
  question: If you move to Connecticut from another state, how many days do you have
    to transfer your out-of-state driver's license to a Connecticut license?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New Connecticut residents must transfer their out-of-state driver's
    license within 30 days of establishing residency.
- id: 17
  category: license_system
  question: In Connecticut, if you change your legal name, you must notify the DMV
    and obtain a duplicate license within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Connecticut law requires drivers to notify the DMV of a legal name
    change and update their license within 30 days.
- id: 18
  category: license_system
  question: What is the specific purpose of the Connecticut 'Drive Only' license program?
  choices:
    A: For individuals who only drive during daylight hours
    B: For individuals who cannot establish legal presence in the United States
    C: For individuals with medical conditions that limit their driving
    D: For individuals who only drive for employment purposes
  answer: B
  explanation: The 'Drive Only' license is for undocumented individuals who are 16
    years of age or older and cannot establish legal presence in the United States.
- id: 19
  category: license_system
  question: To supervise a learner's permit holder in Connecticut, the accompanying
    licensed driver must be at least 20 years old and have held a license for at least
    how many consecutive years?
  choices:
    A: 1 year
    B: 2 years
    C: 4 years
    D: 5 years
  answer: C
  explanation: The person providing instruction to a permit holder must be at least
    20 years old and have held a driver's license for at least four consecutive years
    with no suspensions during that period.
- id: 20
  category: license_system
  question: A standard Connecticut driver's license is typically issued for a renewal
    period of how many years?
  choices:
    A: 2 or 4 years
    B: 4 or 6 years
    C: 6 or 8 years
    D: 5 or 10 years
  answer: C
  explanation: Connecticut driver's licenses are generally issued for a period of
    either six or eight years.
- id: 21
  category: license_system
  question: If a 16 or 17-year-old is found in possession of alcohol in a public place
    or on a public highway, their license will be suspended for at least how many
    days?
  choices:
    A: 30 days
    B: 60 days
    C: 150 days
    D: 1 year
  answer: C
  explanation: Under Connecticut's zero-tolerance laws, a 16 or 17-year-old convicted
    of possession of alcohol will face a 150-day license suspension.
- id: 22
  category: license_system
  question: In Connecticut, what is the fee required to restore a driver's license
    after it has been suspended?
  choices:
    A: $50
    B: $100
    C: $175
    D: $250
  answer: C
  explanation: Connecticut requires a $175 restoration fee to reinstate a driver's
    license or registration after a suspension.
- id: 23
  category: license_system
  question: Which of the following is a requirement for an applicant aged 18 or older
    to obtain a Connecticut driver's license?
  choices:
    A: They must complete a 30-hour classroom course
    B: They must complete an 8-hour Safe Driving Practices course
    C: They must hold a permit for 120 days
    D: They are exempt from all classroom training
  answer: B
  explanation: All applicants for a first-time driver's license in Connecticut, including
    those 18 and older, must complete an 8-hour Safe Driving Practices course.
- id: 24
  category: license_system
  question: To have the 'Veteran' status symbol added to a Connecticut driver's license,
    the applicant must provide which document to the Department of Veterans Affairs?
  choices:
    A: A birth certificate
    B: Form DD-214
    C: A social security card
    D: A military ID only
  answer: B
  explanation: To get the veteran's flag on a license, an applicant must submit a
    DD-214 (discharge papers) to the Department of Veterans Affairs at least 30 days
    before visiting the DMV.
- id: 25
  category: license_system
  question: In Connecticut, if you have vision in only one eye, what is the minimum
    visual acuity requirement to obtain a license?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: For individuals with vision in only one eye, the visual acuity must
    be at least 20/40 in that eye to qualify for a Connecticut driver's license.
- id: 26
  category: license_system
  question: What is the minimum age required to apply for a Commercial Driver's License
    (CDL) in Connecticut for the purpose of interstate commerce?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: While you can obtain a CDL for intrastate (within CT) driving at 18,
    federal law requires you to be at least 21 years old for interstate commerce.
- id: 27
  category: license_system
  question: In Connecticut, a motorcycle learner's permit is valid for how many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: A Connecticut motorcycle learner's permit is valid for 60 days and
    can be renewed once for an additional 60 days.
- id: 28
  category: license_system
  question: Under the 'Motor Voter' law in Connecticut, where can you register to
    vote or update your voter registration?
  choices:
    A: Only at the Town Hall
    B: At the DMV when applying for or renewing a license
    C: Only online through the Secretary of State
    D: At any police station
  answer: B
  explanation: The National Voter Registration Act (Motor Voter) allows Connecticut
    residents to register to vote or update their registration at the DMV.
- id: 29
  category: license_system
  question: A visitor to Connecticut who has a valid driver's license from another
    country may drive in the state for up to how long?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: Visitors to Connecticut may use a valid out-of-country driver's license
    for a period of up to one year.
- id: 30
  category: driver_testing
  question: To pass the Connecticut knowledge test, how many questions must you answer
    correctly out of the 25 provided?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '22'
  answer: C
  explanation: The Connecticut DMV knowledge test consists of 25 questions, and a
    passing score of 80% is required, which means you must answer at least 20 questions
    correctly.
- id: 31
  category: driver_testing
  question: When taking the Connecticut road test, the vehicle used must have which
    of the following features for the examiner's safety?
  choices:
    A: Dual steering wheels
    B: A passenger-side brake pedal or a hand brake reachable by the examiner
    C: Automatic emergency braking system
    D: A manual transmission
  answer: B
  explanation: For the road test in Connecticut, the vehicle must have a brake that
    the examiner can reach, such as a center console hand brake or a passenger-side
    dual brake (common in driving school cars).
- id: 32
  category: driver_testing
  question: In Connecticut, what is the minimum liability insurance coverage required
    for bodily injury to one person?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Connecticut law requires minimum liability coverage of $25,000 per
    person and $50,000 per accident for bodily injury, and $25,000 for property damage
    (25/50/25).
- id: 33
  category: driver_testing
  question: 'If you are under age 21, you are considered to be driving under the influence
    in Connecticut if your Blood Alcohol Content (BAC) is at or above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Connecticut has a 'Zero Tolerance' law for minors. If you are under
    21, a BAC of 0.02% or higher is considered driving under the influence.
- id: 34
  category: driver_testing
  question: How many points will be added to your Connecticut driving record for the
    offense of passing a stopped school bus?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: D
  explanation: Under the Connecticut point system, passing a stopped school bus is
    a serious offense that results in 4 points being added to your driving record.
- id: 35
  category: driver_testing
  question: At what point total does the Connecticut DMV send a warning letter to
    a driver regarding their accumulated points?
  choices:
    A: 3 points
    B: 6 points
    C: 10 points
    D: 12 points
  answer: B
  explanation: The Connecticut DMV sends a warning letter to drivers who have accumulated
    6 points on their driving record.
- id: 36
  category: driver_testing
  question: For an adult driver (21+) in Connecticut, what is the fine for a first
    offense of using a handheld mobile device while driving?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: D
  explanation: In Connecticut, the fine for a first offense of using a handheld cell
    phone or mobile electronic device while driving is $200.
- id: 37
  category: driver_testing
  question: If you move to Connecticut and have a vehicle registered in another state,
    how many days do you have to register that vehicle in Connecticut?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: New residents must register their vehicles in Connecticut within 60
    days of establishing residency.
- id: 38
  category: driver_testing
  question: In Connecticut, what is the penalty for speeding in a designated highway
    work zone?
  choices:
    A: A flat $500 fine
    B: Fines are doubled
    C: Automatic 30-day license suspension
    D: Mandatory community service
  answer: B
  explanation: Connecticut law dictates that fines for speeding or other traffic violations
    are doubled when committed in a designated highway work zone.
- id: 39
  category: driver_testing
  question: Which of the following is a requirement for the vehicle used during a
    Connecticut DMV road test?
  choices:
    A: It must be a mid-sized sedan
    B: It must have a valid registration and insurance card
    C: It must have a GPS navigation system
    D: It must be less than 5 years old
  answer: B
  explanation: The vehicle used for the road test must be mechanically safe, have
    a valid registration, and proof of insurance.
- id: 40
  category: driver_testing
  question: According to Connecticut's 'Move Over' law, what must you do when approaching
    an emergency vehicle with flashing lights stopped on the side of a multi-lane
    highway?
  choices:
    A: Stop immediately in the travel lane
    B: Maintain speed but honk your horn
    C: Move over one lane from the emergency vehicle if it is safe to do so
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: Connecticut's Move Over law requires drivers to slow down and, if safe,
    move over one lane when approaching stationary emergency or maintenance vehicles
    with flashing lights.
- id: 41
  category: driver_testing
  question: In Connecticut, who is required to wear a seat belt in a motor vehicle?
  choices:
    A: Only the driver and front-seat passenger
    B: Only passengers under the age of 18
    C: All passengers in the front and back seats
    D: Only the driver
  answer: C
  explanation: Connecticut law requires the driver and all passengers in the vehicle
    to wear a seat belt, regardless of where they are sitting.
- id: 42
  category: driver_testing
  question: If a Connecticut driver is convicted of 'Operating Under the Influence'
    (OUI) for the first time, their license will be suspended for how long?
  choices:
    A: 30 days
    B: 45 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: For a first OUI conviction in Connecticut, the driver's license is
    suspended for 45 days, followed by a requirement to use an Ignition Interlock
    Device (IID) for one year.
- id: 43
  category: driver_testing
  question: In Connecticut, how many points are assessed for 'Wreckless Driving'?
  choices:
    A: 1 point
    B: 3 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Reckless driving is a serious offense in Connecticut and results in
    6 points being added to the driver's record.
- id: 44
  category: driver_testing
  question: If you fail the Connecticut road test, how many days must you wait before
    you are eligible to retake it?
  choices:
    A: 7 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: C
  explanation: According to the Connecticut DMV, if an applicant fails the road test,
    they must wait at least 14 days before they can take the test again.
- id: 45
  category: driver_testing
  question: In Connecticut, what are the minimum liability insurance coverage requirements
    for a private passenger vehicle?
  choices:
    A: $20,000/$40,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$25,000
    D: $15,000/$30,000/$5,000
  answer: B
  explanation: Connecticut law requires minimum liability coverage of $25,000 per
    person and $50,000 per accident for bodily injury, and $25,000 for property damage.
- id: 46
  category: driver_testing
  question: Under the Connecticut driver point system, how many points accumulated
    on your driving record will trigger a warning letter from the DMV?
  choices:
    A: 3 points
    B: 5 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: The Connecticut DMV sends a warning letter to drivers who have accumulated
    6 points on their driving record.
- id: 47
  category: driver_testing
  question: At how many points will a Connecticut driver's license be suspended for
    30 days?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: B
  explanation: In Connecticut, reaching 10 points on your driving record results in
    a 30-day license suspension.
- id: 48
  category: driver_testing
  question: For a first DUI conviction in Connecticut, an adult driver (21+) will
    have their license suspended for 45 days and must then use an Ignition Interlock
    Device (IID) for how long?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: For a first DUI offense, an adult driver faces a 45-day suspension
    followed by 1 year of driving only a vehicle equipped with an IID.
- id: 49
  category: driver_testing
  question: In Connecticut, if an adult driver (21+) refuses to submit to a chemical
    blood alcohol test, their license will be suspended for 45 days and they must
    use an IID for how long for a first offense?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: Under the Implied Consent law, a first-time refusal of a chemical test
    results in a 45-day suspension and a 1-year IID requirement.
- id: 50
  category: driver_testing
  question: What is the fine for a first offense of failing to stop for a school bus
    with flashing red lights in Connecticut?
  choices:
    A: $150
    B: $250
    C: $450
    D: $1,000
  answer: C
  explanation: Connecticut law (CGS 14-279) mandates a $450 fine for the first offense
    of passing a stopped school bus with its red lights flashing.
- id: 51
  category: driver_testing
  question: According to the Connecticut Driver's Manual, you must dim your high beam
    headlights when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Connecticut law requires drivers to dim high beams when within 500
    feet of an oncoming vehicle to prevent blinding the other driver.
- id: 52
  category: driver_testing
  question: When following another vehicle at night in Connecticut, you must dim your
    high beams when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Drivers must dim their high beams when they are within 300 feet of
    a vehicle they are following.
- id: 53
  category: driver_testing
  question: In Connecticut, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Connecticut state law prohibits parking a vehicle within 10 feet of
    a fire hydrant.
- id: 54
  category: driver_testing
  question: The Connecticut Driver's Manual recommends using which rule to maintain
    a safe following distance behind the vehicle in front of you?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The three-second rule
    D: The four-second rule
  answer: C
  explanation: The Connecticut Driver's Manual recommends the 'three-second rule'
    to ensure a safe following distance under normal weather conditions.
- id: 55
  category: driver_testing
  question: According to the Connecticut Driver's Manual, at what speed can hydroplaning
    (tires losing contact with the road) begin in heavy rain?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The manual states that hydroplaning can start at speeds as low as 35
    mph, and tires may lose all contact with the road at 50 mph.
- id: 56
  category: driver_testing
  question: In Connecticut, if you are involved in a crash that results in injury,
    death, or property damage exceeding $1,000, you must file an accident report with
    the DMV if the police did not file one. Within how many days must this be done?
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: If a police officer does not file a report, the driver must file a
    'Report of Motor Vehicle Accident' (Form PR-1) with the DMV within 5 days if there
    is injury, death, or property damage over $1,000.
- id: 57
  category: driver_responsibility
  question: If you are involved in a motor vehicle accident in Connecticut that results
    in property damage exceeding what amount, you must file an accident report with
    the DMV if the police did not?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: Drivers must file a report with the DMV within 5 days if there is an
    injury, death, or property damage to any one person's property in excess of $1,000.
- id: 58
  category: driver_responsibility
  question: After moving to Connecticut, how many days do you have to register your
    out-of-state vehicle with the CT DMV?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: New residents must register their vehicles in Connecticut within 60
    days of establishing residency.
- id: 59
  category: driver_responsibility
  question: Operating a motor vehicle in Connecticut without the required minimum
    insurance may result in which of the following penalties?
  choices:
    A: A fine of up to $100 only
    B: A fine of up to $1,000 and license/registration suspension
    C: Permanent loss of driving privileges
    D: No penalty if it is a first offense
  answer: B
  explanation: Operating an uninsured vehicle is a serious offense in CT, carrying
    fines between $100 and $1,000 and the suspension of the driver's license and vehicle
    registration.
- id: 60
  category: driver_responsibility
  question: How often are most vehicles in Connecticut required to undergo an emissions
    inspection?
  choices:
    A: Every year
    B: Every two years
    C: Every five years
    D: Only when the vehicle is sold
  answer: B
  explanation: Connecticut requires most vehicles to undergo emissions testing every
    two years to ensure they meet environmental standards.
- id: 61
  category: driver_responsibility
  question: For a driver aged 21 or older, what is the legal Blood Alcohol Content
    (BAC) limit in Connecticut?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In Connecticut, a driver 21 years of age or older is considered legally
    intoxicated if their BAC is 0.08% or higher.
- id: 62
  category: driver_responsibility
  question: 'Under Connecticut''s ''Zero Tolerance'' law, a driver under the age of
    21 is considered to be driving under the influence if their BAC is at or above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Connecticut has a zero-tolerance policy for underage drinking and driving;
    a BAC of 0.02% or higher for someone under 21 results in a license suspension.
- id: 63
  category: driver_responsibility
  question: 'Under Connecticut''s Implied Consent law, if you refuse to submit to
    a chemical test for alcohol or drugs, your license will be suspended for at least:'
  choices:
    A: 30 days
    B: 45 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: Refusal to take a chemical test results in a 45-day license suspension
    and the requirement to use an Ignition Interlock Device (IID) for at least one
    year.
- id: 64
  category: driver_responsibility
  question: What is the maximum fine for littering from a motor vehicle in Connecticut?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Littering is illegal in Connecticut, and a driver can be fined up to
    $1,000 for throwing trash from a vehicle.
- id: 65
  category: driver_responsibility
  question: 'Connecticut''s ''Move Over'' law requires drivers approaching stationary
    emergency or maintenance vehicles with flashing lights to:'
  choices:
    A: Stop immediately
    B: Maintain speed but honk the horn
    C: Move over one lane if safe, or slow down significantly
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: The Move Over law requires drivers to move over one lane on multi-lane
    highways or slow down if moving over is not possible when approaching emergency
    vehicles.
- id: 66
  category: driver_responsibility
  question: How long do points assessed for moving violations remain on your Connecticut
    driving record?
  choices:
    A: 12 months
    B: 24 months
    C: 36 months
    D: 5 years
  answer: B
  explanation: Points assessed against a driver's license in Connecticut remain on
    the driving record for 24 months from the date they are assessed.
- id: 67
  category: driver_responsibility
  question: 'The Connecticut DMV will refuse to renew a vehicle registration if the
    owner has:'
  choices:
    A: Unpaid local property taxes on the vehicle
    B: An expired library card
    C: A credit score below 600
    D: Not washed the vehicle in 6 months
  answer: A
  explanation: Connecticut law prevents the DMV from renewing a registration if the
    owner has outstanding local property taxes or unpaid parking tickets in certain
    municipalities.
- id: 68
  category: driver_responsibility
  question: 'When operating a motor vehicle in Connecticut, you must be able to provide
    proof of insurance to a law enforcement officer:'
  choices:
    A: Only if you are involved in an accident
    B: Within 24 hours of being pulled over
    C: Whenever you are operating the vehicle
    D: Only if you are over the age of 21
  answer: C
  explanation: Drivers in Connecticut must carry an insurance identification card
    in the vehicle at all times and present it upon request by a law enforcement officer.
- id: 69
  category: driver_responsibility
  question: In Connecticut, you must file a Motor Vehicle Accident Report (form PR-1)
    with the DMV if there is an injury, death, or property damage exceeding which
    amount?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: According to Connecticut law, any motor vehicle accident resulting
    in an injury, death, or property damage in excess of $1,000 must be reported to
    the DMV.
- id: 70
  category: driver_responsibility
  question: Under Connecticut's 'Administrative Per Se' law, if you are arrested for
    DUI and refuse to submit to a chemical test, your driving privilege will be suspended
    for at least how many days?
  choices:
    A: 30 days
    B: 45 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: In Connecticut, a first-offense refusal of a chemical test results
    in a 45-day license suspension followed by a period of required Ignition Interlock
    Device (IID) use.
- id: 71
  category: driver_responsibility
  question: 'In Connecticut, if you are involved in an accident with an unattended
    vehicle and cannot find the owner, you must:'
  choices:
    A: Wait for 2 hours then leave
    B: Leave a note with your name, address, and registration and notify the police
    C: Drive away if there is no visible damage
    D: Call a tow truck for the other vehicle
  answer: B
  explanation: Connecticut law requires you to leave your contact and vehicle information
    and report the incident to the local police if you strike an unattended vehicle.
- id: 72
  category: driver_responsibility
  question: What is the penalty for a first-offense conviction of operating a motor
    vehicle without the required minimum insurance in Connecticut?
  choices:
    A: A fine of $100 to $1,000 and a one-month license suspension
    B: A permanent loss of license
    C: A verbal warning only
    D: A mandatory 48-hour jail sentence
  answer: A
  explanation: Operating without insurance in CT can lead to a fine between $100 and
    $1,000 and a license/registration suspension.
- id: 73
  category: driver_responsibility
  question: In Connecticut, fines for speeding or other moving violations are _______
    when committed in a designated construction or maintenance work zone.
  choices:
    A: Tripled
    B: Doubled
    C: Reduced by half
    D: Waived for first-time offenders
  answer: B
  explanation: Connecticut law mandates that fines for traffic violations are doubled
    in work zones when workers are present.
- id: 74
  category: driver_responsibility
  question: If you are convicted of a DUI in Connecticut, you will be required to
    install an Ignition Interlock Device (IID) in your vehicle for how long for a
    first offense (if over 21)?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: For a first DUI conviction for a driver 21 or older, the license is
    suspended for 45 days followed by 6 months of driving only a vehicle equipped
    with an IID.
- id: 75
  category: driver_responsibility
  question: Which of the following is a requirement for maintaining a valid vehicle
    registration in Connecticut?
  choices:
    A: The vehicle must have a GPS tracker
    B: The owner must have continuous liability insurance
    C: The vehicle must be washed monthly
    D: The owner must have a clean criminal record
  answer: B
  explanation: Connecticut requires all registered vehicles to maintain continuous
    liability insurance. Failure to do so can result in the suspension of the registration.
- id: 76
  category: driver_responsibility
  question: In Connecticut, if your vehicle fails an emissions test, how many days
    do you have to have the vehicle repaired and retested?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: If a vehicle fails its emissions test in Connecticut, the owner has
    60 days to perform the necessary repairs and have it retested.
- id: 77
  category: safe_driving_rules
  question: In Connecticut, when parking your vehicle near a fire hydrant, what is
    the minimum distance you must maintain?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: According to the Connecticut Driver's Manual, you may not park within
    10 feet of a fire hydrant.
- id: 78
  category: safe_driving_rules
  question: Under Connecticut law, what is the minimum distance you must maintain
    when parking near a stop sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 25 feet
    D: 50 feet
  answer: C
  explanation: In Connecticut, it is illegal to park within 25 feet of a stop sign
    to ensure visibility for other drivers.
- id: 79
  category: safe_driving_rules
  question: What is the recommended following distance behind the vehicle in front
    of you under normal driving conditions in Connecticut?
  choices:
    A: Two-second rule
    B: Three-second rule
    C: Four-second rule
    D: One car length for every 10 mph
  answer: B
  explanation: The Connecticut Driver's Manual recommends using the 'three-second
    rule' to maintain a safe following distance under normal conditions.
- id: 80
  category: safe_driving_rules
  question: When driving in a work zone in Connecticut, how are speeding fines typically
    handled?
  choices:
    A: Fines are reduced if it is your first offense
    B: Fines are doubled
    C: Fines are tripled
    D: Fines remain the same as standard speeding tickets
  answer: B
  explanation: In Connecticut, fines for speeding or other traffic violations are
    doubled in designated work zones when workers are present.
- id: 81
  category: safe_driving_rules
  question: In Connecticut, you must signal your intention to turn at least how many
    feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: The Connecticut Driver's Manual states that you should signal at least
    100 feet before you make a turn.
- id: 82
  category: safe_driving_rules
  question: In Connecticut, when must you dim your high beam headlights for an oncoming
    vehicle?
  choices:
    A: Within 200 feet
    B: Within 300 feet
    C: Within 500 feet
    D: Within 1,000 feet
  answer: C
  explanation: Connecticut law requires drivers to switch to low beams when an oncoming
    vehicle is within 500 feet.
- id: 83
  category: safe_driving_rules
  question: 'In Connecticut, if you are involved in a crash that results in property
    damage of $1,000 or more, you must:'
  choices:
    A: Only notify your insurance company
    B: File an accident report with the DMV
    C: Wait 30 days before reporting
    D: Only report it if there is an injury
  answer: B
  explanation: Connecticut law requires drivers to file an accident report (form PR-1)
    with the DMV if there is an injury, death, or property damage exceeding $1,000.
- id: 84
  category: safe_driving_rules
  question: In Connecticut, what is the minimum legal tire tread depth for a passenger
    vehicle?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Connecticut law requires that tires have at least 2/32 of an inch of
    tread depth in all major grooves.
- id: 85
  category: safe_driving_rules
  question: 'When approaching a stationary emergency vehicle with flashing lights
    on a Connecticut highway with three lanes, the ''Move Over Law'' requires you
    to:'
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but honk your horn
    C: Move over one lane to the left if safe to do so
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: Connecticut's Move Over Law requires drivers to move over one lane,
    if safe, or slow down when approaching stationary emergency, maintenance, or recovery
    vehicles.
- id: 86
  category: safe_driving_rules
  question: In Connecticut, you may not park within how many feet of a pedestrian
    crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: D
  explanation: The Connecticut Driver's Manual specifies that you cannot park within
    25 feet of a crosswalk at an intersection.
- id: 87
  category: safe_driving_rules
  question: When parking a vehicle on a public road in Connecticut, how far must your
    wheels be from the curb?
  choices:
    A: No more than 6 inches
    B: No more than 12 inches
    C: No more than 18 inches
    D: Exactly 10 inches
  answer: B
  explanation: The Connecticut Driver's Manual states that when parking next to a
    curb, you must park no more than 12 inches away from it.
- id: 88
  category: safe_driving_rules
  question: 'When approaching a school bus that is stopped with its red lights flashing
    and stop arm extended on a non-divided highway, you must stop:'
  choices:
    A: Only if you are traveling in the same direction as the bus
    B: At least 10 feet away
    C: Only if children are currently crossing
    D: Regardless of your direction of travel
  answer: D
  explanation: In Connecticut, you must stop for a school bus with flashing red lights
    whether you are approaching from the front or following from behind, unless the
    bus is on the opposite side of a divided highway.
- id: 89
  category: safe_driving_rules
  question: When overtaking or passing a bicycle in Connecticut, what is the minimum
    distance you must maintain between your vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Connecticut law requires motorists to grant at least three feet of
    distance when overtaking or passing a person riding a bicycle.
- id: 90
  category: safe_driving_rules
  question: What is the 'Move Over' law in Connecticut regarding emergency vehicles
    on the side of a multi-lane highway?
  choices:
    A: You must stop immediately
    B: You must move over one lane if safe to do so, or slow down
    C: You must speed up to pass quickly
    D: You must only move over for police cars, not tow trucks
  answer: B
  explanation: Connecticut's Move Over Law requires drivers to move over one lane
    when approaching stationary emergency, maintenance, or recovery vehicles. If moving
    over is unsafe, the driver must slow down.
- id: 91
  category: safe_driving_rules
  question: In Connecticut, for a driver aged 21 or older, what is the Blood Alcohol
    Content (BAC) level at which they are considered to be driving under the influence?
  choices:
    A: 0.02% or higher
    B: 0.05% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: In Connecticut, the legal limit for BAC for drivers 21 and older is
    0.08%.
- id: 92
  category: safe_driving_rules
  question: When entering a roundabout in Connecticut, to whom must you yield the
    right-of-way?
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one; you have the right-of-way
    D: Only pedestrians, not other vehicles
  answer: B
  explanation: When approaching a roundabout, you must yield to traffic already circulating
    in the circle and to pedestrians in the crosswalk.
- id: 93
  category: safe_driving_rules
  question: 'In Connecticut, the ''Three-Second Rule'' is used to determine:'
  choices:
    A: How long to wait at a stop sign
    B: The time it takes to clear an intersection
    C: A safe following distance
    D: How long to signal before a turn
  answer: C
  explanation: The Connecticut Driver's Manual recommends the 'three-second rule'
    to maintain a safe following distance behind the vehicle in front of you.
- id: 94
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, the Connecticut
    Driver's Manual suggests scanning the road how far ahead?
  choices:
    A: 5 seconds
    B: 8 seconds
    C: 12 seconds
    D: 20 seconds
  answer: C
  explanation: Connecticut guidelines state that drivers should scan the road at least
    12 seconds ahead to anticipate potential hazards and traffic flow changes.
- id: 95
  category: defensive_driving
  question: In Connecticut, you must turn on your headlights whenever you are using
    your windshield wipers due to weather conditions. What is the other specific visibility
    requirement for headlights?
  choices:
    A: When you cannot see clearly for 500 feet
    B: When you cannot see clearly for 1,000 feet
    C: Only between sunset and sunrise
    D: When you cannot see clearly for 200 feet
  answer: A
  explanation: Connecticut law requires headlights to be used when wipers are in use
    and whenever visibility is reduced to less than 500 feet.
- id: 96
  category: defensive_driving
  question: According to the Connecticut Driver's Manual, at what speed can your tires
    start to ride up on a pool of water (hydroplane)?
  choices:
    A: As low as 35 mph
    B: Exactly 45 mph
    C: Only above 55 mph
    D: Only during heavy downpours
  answer: A
  explanation: The manual warns that hydroplaning can begin at speeds as low as 35
    mph, and in a heavy rain, tires can lose all traction at 50 mph.
- id: 97
  category: defensive_driving
  question: When following a large commercial truck, the Connecticut Driver's Manual
    recommends increasing your following distance to at least how many seconds?
  choices:
    A: 3 seconds
    B: 4 seconds
    C: 6 seconds
    D: 10 seconds
  answer: B
  explanation: While 3 seconds is standard for cars, the manual recommends at least
    4 seconds when following large trucks to ensure you are not in their rear blind
    spot (No-Zone).
- id: 98
  category: defensive_driving
  question: Which steering technique does the Connecticut Driver's Manual recommend
    for most turning maneuvers?
  choices:
    A: One-handed steering
    B: Hand-over-hand steering
    C: Palming the wheel
    D: Crossing arms at the 12 o'clock position
  answer: B
  explanation: The CT Driver's Manual specifically recommends the hand-over-hand steering
    method for turning at low speeds or when recovering from a skid.
- id: 99
  category: defensive_driving
  question: When parking your vehicle on a downhill grade with a curb, in which direction
    should you turn your wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: A
  explanation: When parking downhill, you should turn your wheels toward the curb
    so that if the vehicle rolls, it will hit the curb and stop.
- id: 100
  category: defensive_driving
  question: In Connecticut, fines for speeding or other traffic violations are doubled
    when committed in which of the following areas?
  choices:
    A: Residential zones
    B: Hospital zones
    C: Designated construction or maintenance work zones
    D: State parks
  answer: C
  explanation: Connecticut law mandates that fines for traffic violations are doubled
    in designated work zones when workers are present.
- id: 101
  category: defensive_driving
  question: When an emergency vehicle with sirens and flashing lights is approaching,
    you must pull over to the right edge of the road and stop. How much following
    distance must you maintain behind an emergency vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Drivers are generally required to stay at least 500 feet behind an
    emergency vehicle that is responding to an alarm.
- id: 102
  category: defensive_driving
  question: According to the Connecticut Driver's Manual, when is the only time you
    should use your horn?
  choices:
    A: To greet friends
    B: To show anger at another driver
    C: To signal a desire to pass
    D: To warn other drivers of a dangerous situation
  answer: D
  explanation: The manual states the horn should only be used as a warning to other
    drivers or pedestrians to prevent an accident, not for social or aggressive reasons.
- id: 103
  category: defensive_driving
  question: According to the Connecticut Driver's Manual, how many seconds of following
    distance should you maintain behind the vehicle in front of you under ideal conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: B
  explanation: The Connecticut Driver's Manual recommends using the 'three-second
    rule' to maintain a safe following distance under ideal weather and traffic conditions.
- id: 104
  category: defensive_driving
  question: To be a safe driver in Connecticut, you should scan the road ahead to
    see what is happening at least how many seconds in front of your vehicle?
  choices:
    A: 5 seconds
    B: 8 seconds
    C: 12 seconds
    D: 20 seconds
  answer: C
  explanation: Connecticut guidelines state that you should look ahead at least 12
    seconds to help you avoid the need for last-minute braking or turning.
- id: 105
  category: defensive_driving
  question: 'In Connecticut, hydroplaning (where tires lose traction on a thin film
    of water) can begin at speeds as low as:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The CT Driver's Manual warns that in heavy rain, your tires can ride
    on a thin film of water and lose contact with the road at speeds as low as 35
    mph.
- id: 106
  category: defensive_driving
  question: When driving in fog, rain, or snow in Connecticut, which light setting
    should you use to ensure the best visibility and safety?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights
  answer: B
  explanation: In fog, rain, or snow, you should use low beams. High beams reflect
    off the precipitation and cause glare, making it harder to see.
- id: 107
  category: defensive_driving
  question: 'Under Connecticut law, when passing a bicycle traveling in the same direction,
    you must leave a distance of at least:'
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Connecticut state law requires motorists to grant at least three feet
    of distance when passing a person riding a bicycle.
- id: 108
  category: defensive_driving
  question: 'When sharing the road with large commercial trucks, ''No-Zones'' refer
    to:'
  choices:
    A: Areas where trucks are not allowed to drive
    B: The blind spots around the front, rear, and sides of the truck
    C: The speed-restricted lanes on CT highways
    D: The weight limit zones for bridges
  answer: B
  explanation: The CT Driver's Manual identifies 'No-Zones' as the large blind spots
    around a truck where the truck driver cannot see your vehicle.
- id: 109
  category: defensive_driving
  question: 'In Connecticut, when the road is wet, it is most slippery:'
  choices:
    A: After it has been raining for several hours
    B: Just after it starts to rain
    C: When the temperature is above 70 degrees
    D: Only during a heavy downpour
  answer: B
  explanation: Roads are most slippery just after it starts to rain because the water
    mixes with oil and grease on the pavement that has not yet washed away.
- id: 110
  category: defensive_driving
  question: 'If your vehicle is equipped with Anti-lock Braking System (ABS) and you
    need to stop quickly in an emergency, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Press the brake pedal hard and keep pressing
    C: Lightly tap the brakes
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should press the brake pedal hard and maintain steady
    pressure. Do not pump the brakes, as this deactivates the system's effectiveness.
- id: 111
  category: defensive_driving
  question: When scanning an intersection for potential hazards, the Connecticut Driver's
    Manual recommends looking in which order?
  choices:
    A: Right, then left, then right again
    B: Left, then right, then left again
    C: Straight ahead only
    D: At your rearview mirror first
  answer: B
  explanation: You should look left, then right, then left again because vehicles
    coming from the left are closer to you and represent the more immediate danger.
- id: 112
  category: defensive_driving
  question: 'When following a motorcycle in Connecticut, you should allow for more
    following distance (at least 3-4 seconds) because:'
  choices:
    A: Motorcycles have much shorter stopping distances than cars
    B: Motorcycles are faster than cars
    C: Motorcyclists are required to weave in traffic
    D: Motorcycles have no brake lights
  answer: A
  explanation: Motorcycles can stop much more quickly than other vehicles. Following
    too closely can result in a rear-end collision if the motorcyclist brakes suddenly.
- id: 113
  category: defensive_driving
  question: At 50 mph, it can take about how many feet to react to a hazard and bring
    your vehicle to a complete stop?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 600 feet
  answer: C
  explanation: According to the CT Driver's Manual, at 50 mph, the total stopping
    distance (including perception, reaction, and braking) is approximately 400 feet.
- id: 114
  category: alcohol_drugs_health
  question: 'Connecticut''s ''Implied Consent'' law means that by operating a motor
    vehicle, you have effectively agreed to:'
  choices:
    A: Allow a search of your vehicle at any time.
    B: Carry minimum liability insurance.
    C: Take a chemical test to determine your BAC or drug content.
    D: Keep your vehicle in good mechanical condition.
  answer: C
  explanation: The Implied Consent law means that any person who operates a motor
    vehicle in CT is presumed to have given their consent to a test of their blood,
    breath, or urine.
- id: 115
  category: alcohol_drugs_health
  question: 'If a driver age 21 or older refuses to submit to a chemical test in Connecticut
    for the first time, their license will be suspended for 45 days and they must
    use an Ignition Interlock Device (IID) for:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: For a first offense of refusing a chemical test, a driver 21 or older
    faces a 45-day license suspension followed by one year of driving with an Ignition
    Interlock Device (IID).
- id: 116
  category: alcohol_drugs_health
  question: 'If a 16 or 17-year-old driver in Connecticut refuses to take a BAC test,
    their license will be suspended for 45 days and they will be required to use an
    IID for:'
  choices:
    A: 6 months
    B: 1 year
    C: 18 months
    D: 2 years
  answer: C
  explanation: For 16 and 17-year-old drivers, a first-time refusal of a chemical
    test results in a 45-day suspension and an 18-month IID requirement.
- id: 117
  category: alcohol_drugs_health
  question: In Connecticut, what is the mandatory minimum jail sentence for a first
    DUI conviction, which may be suspended if the driver performs 100 hours of community
    service?
  choices:
    A: 24 hours
    B: 48 hours
    C: 10 days
    D: 30 days
  answer: B
  explanation: A first DUI conviction carries a mandatory minimum sentence of six
    months, but the execution of that sentence can be suspended with a period of probation
    that includes 48 consecutive hours in jail or 100 hours of community service.
- id: 118
  category: alcohol_drugs_health
  question: Which of the following is true regarding the use of prescription or over-the-counter
    drugs while driving in Connecticut?
  choices:
    A: They are always legal as long as a doctor prescribed them.
    B: They are only illegal if they are classified as narcotics.
    C: It is the driver's responsibility to know the effects of the drug before driving.
    D: They do not affect driving ability as much as alcohol does.
  answer: C
  explanation: Under CT law, driving under the influence of any drug (legal or illegal)
    that impairs your ability to drive is a violation. Drivers must check labels and
    consult doctors about side effects.
- id: 119
  category: alcohol_drugs_health
  question: 'If you are involved in a crash while your license is suspended for a
    DUI-related offense in Connecticut, you may face:'
  choices:
    A: A simple fine.
    B: No additional penalties if it wasn't your fault.
    C: Mandatory prison time.
    D: A verbal warning only.
  answer: C
  explanation: Operating a vehicle while under suspension for a DUI-related offense
    carries severe penalties, including mandatory minimum jail time.
- id: 120
  category: alcohol_drugs_health
  question: What is the primary effect of mixing alcohol with other drugs (even over-the-counter
    ones)?
  choices:
    A: The effects of the alcohol are cancelled out.
    B: The effects of the drugs are cancelled out.
    C: It can multiply the effects of both, significantly increasing impairment.
    D: It has no measurable effect on driving performance.
  answer: C
  explanation: Combining alcohol and drugs often produces a synergistic effect, meaning
    the impairment is much greater than the sum of the two substances individually.
- id: 121
  category: alcohol_drugs_health
  question: In Connecticut, how long does it typically take for the body to get rid
    of the alcohol contained in one standard drink?
  choices:
    A: 15 minutes
    B: 30 minutes
    C: About 1 hour
    D: 3 hours
  answer: C
  explanation: The human body oxidizes alcohol at a constant rate of approximately
    one standard drink per hour.
- id: 122
  category: alcohol_drugs_health
  question: Which of the following will help you 'sober up' before driving?
  choices:
    A: Drinking black coffee.
    B: Taking a cold shower.
    C: Exercising vigorously.
    D: Only time.
  answer: D
  explanation: Only time allows the body to process alcohol. Coffee, showers, and
    exercise do not lower your BAC or reduce impairment.
- id: 123
  category: alcohol_drugs_health
  question: 'If a Connecticut driver is convicted of a second DUI within 10 years,
    the IID requirement increases to:'
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: Permanent requirement
  answer: C
  explanation: For a second DUI conviction within 10 years, the driver must use an
    Ignition Interlock Device for 3 years following a 45-day suspension.
- id: 124
  category: alcohol_drugs_health
  question: 'In Connecticut, if you are under 21 and your BAC is found to be 0.02%
    or higher, your license will be suspended for 45 days and you must use an IID
    for:'
  choices:
    A: 6 months
    B: 1 year
    C: 18 months
    D: 2 years
  answer: B
  explanation: Under the Zero Tolerance law, a driver under 21 with a BAC of 0.02%
    or higher faces a 45-day suspension and a 1-year IID requirement for a first offense.
- id: 125
  category: alcohol_drugs_health
  question: If you have a health condition that may affect your ability to drive safely,
    what is your responsibility according to the Connecticut Driver's Manual?
  choices:
    A: You must stop driving immediately and forever.
    B: You must inform the DMV when you apply for or renew your license.
    C: You only need to tell your insurance company.
    D: You do not need to report it unless you are involved in a crash.
  answer: B
  explanation: Connecticut law requires drivers to report any physical or mental condition
    that may affect their ability to operate a motor vehicle safely to the DMV.
- id: 126
  category: alcohol_drugs_health
  question: In Connecticut, a driver is considered to be operating 'under the influence'
    if their Blood Alcohol Content (BAC) is at or above what level?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: For drivers age 21 or older in Connecticut, the legal limit for Blood
    Alcohol Content (BAC) is 0.08%.
- id: 127
  category: alcohol_drugs_health
  question: What does Connecticut's 'Implied Consent' law mean for motorists?
  choices:
    A: You consent to a search of your vehicle at any time.
    B: You agree to provide your insurance information to other drivers.
    C: By driving, you have agreed to take a chemical test for alcohol or drugs if
      requested by an officer.
    D: You consent to have your license revoked if you are involved in any accident.
  answer: C
  explanation: Implied Consent means that by holding a CT driver's license and operating
    a vehicle, you have already given consent to submit to a chemical test (blood,
    breath, or urine) to determine BAC or drug content.
- id: 128
  category: alcohol_drugs_health
  question: 'In Connecticut, if you are 21 or older and refuse to submit to a chemical
    test for the first time, your driver''s license will be suspended for at least:'
  choices:
    A: 30 days
    B: 45 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: Under the Administrative Per Se law, a first-time refusal of a chemical
    test results in a 45-day license suspension, followed by a required period of
    using an Ignition Interlock Device (IID).
- id: 129
  category: alcohol_drugs_health
  question: What is the fine range for a first-time DUI conviction in the state of
    Connecticut?
  choices:
    A: Between $100 and $500
    B: Between $500 and $1,000
    C: Between $1,000 and $2,000
    D: Exactly $2,500
  answer: B
  explanation: A first DUI conviction in Connecticut carries a fine ranging from $500
    to $1,000, in addition to potential jail time and license suspension.
- id: 130
  category: alcohol_drugs_health
  question: If a 16 or 17-year-old driver in Connecticut is pulled over and fails
    a BAC test (0.02% or higher), the police officer will immediately seize their
    license for how long?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 7 days
  answer: B
  explanation: Connecticut law requires police to immediately seize the license of
    a 16 or 17-year-old for 48 hours if they fail a BAC test or refuse to take one.
- id: 131
  category: alcohol_drugs_health
  question: Which of the following is the only way to effectively reduce your Blood
    Alcohol Content (BAC) before driving?
  choices:
    A: Drinking strong black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time to pass
  answer: D
  explanation: Only time can lower BAC. Coffee, showers, and exercise do not speed
    up the process of the liver metabolizing alcohol.
- id: 132
  category: alcohol_drugs_health
  question: In Connecticut, if you are convicted of a DUI and it is your second offense,
    how long must you use an Ignition Interlock Device (IID)?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: Permanently
  answer: C
  explanation: For a second DUI conviction in Connecticut, the driver must use an
    Ignition Interlock Device (IID) for three years.
- id: 133
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with other drugs, such as prescription
    medication or marijuana, on driving ability?
  choices:
    A: The drugs cancel out the effects of the alcohol.
    B: The effects are multiplied, significantly increasing impairment.
    C: There is no additional effect beyond the alcohol itself.
    D: It makes the driver more alert to compensate for the alcohol.
  answer: B
  explanation: Combining alcohol with other drugs creates a synergistic effect, meaning
    the impairment is much greater than the sum of the individual substances.
- id: 134
  category: alcohol_drugs_health
  question: In Connecticut, if you are under 21 and refuse a BAC test, your license
    will be suspended for how long for a first offense?
  choices:
    A: 45 days
    B: 6 months
    C: 1 year
    D: 18 months
  answer: A
  explanation: Under the Administrative Per Se law, the suspension period for a first-time
    refusal is 45 days for all drivers, though the subsequent IID requirements vary
    by age and history.
- id: 135
  category: alcohol_drugs_health
  question: According to the Connecticut Driver's Manual, alcohol is involved in approximately
    what percentage of fatal traffic accidents nationally?
  choices:
    A: 10%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: The Connecticut Driver's Manual notes that alcohol is a factor in approximately
    40% of all traffic fatalities.
- id: 136
  category: alcohol_drugs_health
  question: Which of the following statements regarding marijuana and driving in Connecticut
    is true?
  choices:
    A: It is legal to drive under the influence of marijuana if you have a medical
      card.
    B: Marijuana does not affect reaction time or coordination.
    C: Driving under the influence of marijuana is illegal and carries the same penalties
      as alcohol DUI.
    D: Marijuana is only illegal to use while driving if it is smoked, not if it is
      ingested as an edible.
  answer: C
  explanation: In Connecticut, driving under the influence of any drug, including
    marijuana (remedial or recreational), is illegal and subject to the same DUI penalties
    as alcohol.
- id: 137
  category: alcohol_drugs_health
  question: 'If you are taking a prescription drug and are unsure if it will affect
    your driving, you should:'
  choices:
    A: Drive only on familiar local roads.
    B: Check the label or ask your doctor/pharmacist before driving.
    C: Drink coffee to counteract any potential drowsiness.
    D: Wait one hour after taking the medication before driving.
  answer: B
  explanation: Drivers are responsible for knowing the effects of any medication they
    take. Checking labels for warnings about operating heavy machinery or consulting
    a medical professional is required.
- id: 138
  category: alcohol_drugs_health
  question: 'In Connecticut, if a driver has a health condition that may affect their
    ability to drive safely, they must:'
  choices:
    A: Surrender their license immediately.
    B: Report the condition to the DMV when applying for or renewing a license.
    C: Only drive during daylight hours.
    D: Have a passenger in the car at all times.
  answer: B
  explanation: Connecticut law requires drivers to report any physical or mental condition
    that may affect their ability to safely operate a motor vehicle to the DMV.
- id: 139
  category: penalties_and_points
  question: Under the Connecticut point system, how many points are assessed for passing
    a stopped school bus?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Passing a standing school bus in Connecticut results in 4 points being
    added to your driving record.
- id: 140
  category: penalties_and_points
  question: For a first DUI conviction in Connecticut for a driver over 21, the driver's
    license will be suspended for 45 days followed by how long with an Ignition Interlock
    Device (IID)?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: A first DUI conviction for an adult in CT carries a 45-day license
    suspension and a mandatory 1-year requirement for an Ignition Interlock Device.
- id: 141
  category: penalties_and_points
  question: What is the minimum amount of property damage liability insurance required
    by law in Connecticut?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Connecticut law requires a minimum of $25,000 for property damage liability
    (part of the 25/50/25 requirement).
- id: 142
  category: penalties_and_points
  question: How many points are assessed on a Connecticut driving record for a conviction
    of reckless driving?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: D
  explanation: Reckless driving is a serious offense in Connecticut and results in
    6 points being added to the driver's record.
- id: 143
  category: penalties_and_points
  question: How many points are assessed on your Connecticut driving record for failing
    to obey a stop sign or a red light?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failing to obey a stop sign or a traffic signal (red light) results
    in 2 points on your CT driving record.
- id: 144
  category: penalties_and_points
  question: 'If a 16 or 17-year-old driver is convicted of speeding (20 mph or more
    over the limit) for the first time, their license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: For 16 and 17-year-old drivers, a first conviction for speeding (20+
    mph over) results in a 60-day license suspension.
- id: 145
  category: penalties_and_points
  question: In Connecticut, how many points are added to your record for 'Following
    Too Closely'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Following too closely is a 2-point violation in the state of Connecticut.
- id: 146
  category: penalties_and_points
  question: A Connecticut driver's license will be suspended if the driver accumulates
    how many points?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: B
  explanation: In Connecticut, reaching 10 points on your driving record results in
    a license suspension.
- id: 147
  category: penalties_and_points
  question: How many points are assessed for 'Improper Passing' in the state of Connecticut?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Improper passing is considered a 3-point violation in Connecticut.
- id: 148
  category: penalties_and_points
  question: In Connecticut, if you accumulate how many points on your driving record,
    the DMV will send you a warning letter?
  choices:
    A: 3 points
    B: 6 points
    C: 8 points
    D: 10 points
  answer: B
  explanation: According to the Connecticut DMV point system, a warning letter is
    sent to the driver when they reach 6 points on their driving record.
- id: 149
  category: penalties_and_points
  question: 'If a driver is convicted of ''Reckless Driving'' for the first time in
    Connecticut, they may face a fine of up to:'
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: A first offense of reckless driving in Connecticut can result in a
    fine of up to $300 and/or up to 30 days in jail.
- id: 150
  category: penalties_and_points
  question: In Connecticut, if you are 21 or older and refuse to take a chemical BAC
    test under Implied Consent, your license will be suspended for 45 days followed
    by how long with an Ignition Interlock Device (IID)?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: For a first refusal of a chemical test (21+), the penalty is a 45-day
    suspension followed by 1 year of driving only a vehicle equipped with an IID.
- id: 151
  category: penalties_and_points
  question: 'Fines for traffic violations committed in a designated construction or
    maintenance ''Work Zone'' in Connecticut are:'
  choices:
    A: Tripled
    B: Doubled
    C: Increased by $100
    D: Unchanged
  answer: B
  explanation: Connecticut law dictates that fines for speeding or other traffic violations
    are doubled when committed in a designated work zone.
- id: 152
  category: penalties_and_points
  question: In Connecticut, a driver's license will be suspended if they accumulate
    a total of how many points on their record?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: B
  explanation: The Connecticut DMV will suspend a driver's license once they reach
    10 points on their driving record.
- id: 153
  category: penalties_and_points
  question: 'For a first conviction of using a handheld mobile phone while driving
    (for drivers 18 and older), the fine in Connecticut is:'
  choices:
    A: $100
    B: $150
    C: $200
    D: $250
  answer: C
  explanation: The fine for a first offense of using a handheld cell phone or mobile
    electronic device while driving in CT is $200.
- id: 154
  category: penalties_and_points
  question: 'Connecticut law requires drivers to maintain minimum liability insurance
    coverage of:'
  choices:
    A: $20,000/$40,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$25,000
    D: $15,000/$30,000/$5,000
  answer: B
  explanation: CT law requires $25,000 per person/$50,000 per accident for bodily
    injury and $25,000 for property damage.
- id: 155
  category: penalties_and_points
  question: If a driver 24 years old or younger commits how many moving violations,
    they are required to complete the DMV's Operator Retraining Program?
  choices:
    A: One violation
    B: Two violations
    C: Three violations
    D: Four violations
  answer: B
  explanation: In Connecticut, drivers 24 and younger who have two or more moving
    violations must complete an Operator Retraining Program.
- id: 156
  category: penalties_and_points
  question: How many points are added to your Connecticut driving record for 'Evading
    Responsibility' (Hit and Run) involving property damage?
  choices:
    A: 5 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: C
  explanation: Evading responsibility (hit and run) is one of the most serious violations
    and carries 10 points in Connecticut.
- id: 157
  category: penalties_and_points
  question: In Connecticut, failing to yield the right-of-way to an emergency vehicle
    (Move Over Law) results in how many points on your driving record?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failure to yield to an emergency vehicle is a 2-point violation in
    Connecticut.
- id: 158
  category: penalties_and_points
  question: A person convicted of a first DUI offense in Connecticut must use an Ignition
    Interlock Device (IID) for how long after their license suspension ends?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: A first DUI conviction requires a 45-day license suspension followed
    by 1 year of IID usage.
- id: 159
  category: penalties_and_points
  question: How many points are assessed for 'Speeding' (exceeding the posted limit
    but not considered reckless) in Connecticut?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: A
  explanation: Standard speeding violations in Connecticut result in 1 point being
    added to the driver's record.
- id: 160
  category: sharing_the_road
  question: When passing a bicycle in Connecticut, how much distance must a driver
    maintain between their vehicle and the cyclist?
  choices:
    A: At least 2 feet
    B: At least 3 feet
    C: At least 5 feet
    D: A distance equal to the width of the car
  answer: B
  explanation: Connecticut law (CGS 14-232a) requires motorists to grant at least
    three feet of distance when overtaking and passing a person riding a bicycle.
- id: 161
  category: sharing_the_road
  question: Connecticut's 'Move Over' law requires drivers to move over one lane or
    slow down when approaching which of the following stationary vehicles?
  choices:
    A: Only police and fire vehicles
    B: Only ambulances and tow trucks
    C: Emergency vehicles, tow trucks, and maintenance vehicles with flashing lights
    D: Any vehicle parked on the shoulder with hazard lights on
  answer: C
  explanation: Connecticut's 'Move Over' law (CGS 14-283b) applies to stationary emergency
    vehicles, tow trucks, and highway maintenance vehicles that are displaying flashing
    lights.
- id: 162
  category: sharing_the_road
  question: In Connecticut, when following a motorcycle, what is the recommended following
    distance to ensure safety?
  choices:
    A: At least 1 second
    B: At least 2 seconds
    C: At least 3 to 4 seconds
    D: At least 10 seconds
  answer: C
  explanation: The Connecticut Driver's Manual recommends a following distance of
    at least 3 to 4 seconds when behind a motorcycle to allow the motorcyclist enough
    space to maneuver or stop in an emergency.
- id: 163
  category: sharing_the_road
  question: Under Connecticut law, when are you NOT required to stop for a school
    bus with flashing red lights?
  choices:
    A: When you are traveling in the opposite direction on a multi-lane road without
      a median
    B: When you are traveling in the opposite direction on a divided highway separated
      by a median or barrier
    C: When the bus is stopped in a school parking lot
    D: When you are traveling at least 20 mph under the speed limit
  answer: B
  explanation: In Connecticut, you must stop for a school bus with flashing red lights
    unless you are on the opposite side of a divided highway separated by a physical
    barrier or median.
- id: 164
  category: sharing_the_road
  question: According to the Connecticut Driver's Manual, how much distance should
    you maintain when following a fire apparatus (fire truck) responding to an alarm?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Connecticut law prohibits following any fire apparatus traveling in
    response to a fire alarm closer than 500 feet.
- id: 165
  category: sharing_the_road
  question: In Connecticut, if a pedestrian is using a white cane or a guide dog,
    what must a driver do?
  choices:
    A: Honk to let them know you are there
    B: Slow down and proceed with caution
    C: Come to a complete stop and yield the right-of-way
    D: Drive around them if there is enough space
  answer: C
  explanation: Connecticut law requires drivers to come to a complete stop and yield
    the right-of-way to any blind or visually impaired pedestrian carrying a white
    cane or using a guide dog.
- id: 166
  category: sharing_the_road
  question: 'Large commercial trucks have blind spots where the driver cannot see
    other vehicles. These areas are commonly referred to as:'
  choices:
    A: Dead Zones
    B: No-Zones
    C: Danger Circles
    D: Shadow Areas
  answer: B
  explanation: The Connecticut Driver's Manual refers to the large blind spots around
    the front, back, and sides of commercial trucks as 'No-Zones'.
- id: 167
  category: sharing_the_road
  question: In Connecticut, is 'lane splitting' (a motorcycle driving between rows
    of stopped or moving vehicles in the same lane) legal?
  choices:
    A: Yes, it is legal at speeds under 30 mph
    B: Yes, but only on highways
    C: No, it is illegal
    D: Yes, if the motorcyclist is wearing a helmet
  answer: C
  explanation: Lane splitting is illegal in Connecticut. Motorcyclists are entitled
    to the full use of a lane, and no motor vehicle shall be driven in such a manner
    as to deprive any motorcycle of the full use of a lane.
- id: 168
  category: sharing_the_road
  question: Under Connecticut's 'Vulnerable User' law, what can happen to a driver
    who fails to exercise reasonable care and causes the death or serious injury of
    a pedestrian or cyclist?
  choices:
    A: A fine of up to $1,000
    B: A mandatory 5-year license suspension
    C: A fine of up to $10,000
    D: No specific penalty other than a standard traffic ticket
  answer: A
  explanation: Connecticut's Vulnerable User Law (CGS 14-300i) allows for a fine of
    up to $1,000 for drivers who fail to exercise reasonable care and cause the serious
    injury or death of a 'vulnerable user' (pedestrians, cyclists, etc.).
- id: 169
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may:'
  choices:
    A: Stay entirely in the right lane
    B: Need to swing wide to the left to complete the turn
    C: Always stop and wait for all traffic to clear
    D: Turn from the left lane
  answer: B
  explanation: Large trucks often need to swing wide to the left to clear the curb
    when making a right turn. Drivers should avoid 'squeezing' between the truck and
    the curb.
- id: 170
  category: sharing_the_road
  question: 'In Connecticut, if you are approaching a pedestrian in a crosswalk that
    is NOT controlled by a traffic signal, you must:'
  choices:
    A: Slow down and honk
    B: Yield only if the pedestrian is in your half of the road
    C: Yield the right-of-way if the pedestrian has stepped off the curb
    D: Maintain speed unless the pedestrian is directly in front of you
  answer: C
  explanation: Connecticut law (CGS 14-300) requires drivers to yield the right-of-way
    to a pedestrian who has stepped off the curb or into the crosswalk at an unsignalized
    intersection.
- id: 171
  category: sharing_the_road
  question: Which of the following is true regarding bicycles on Connecticut roadways?
  choices:
    A: Bicycles must always ride on the sidewalk
    B: Bicycles have the same rights and duties as motor vehicle operators
    C: Bicycles are not allowed on roads with speed limits over 35 mph
    D: Bicycles must always ride against the flow of traffic
  answer: B
  explanation: In Connecticut, bicycles are legally considered vehicles when operated
    on the road and cyclists have the same rights and responsibilities as motor vehicle
    drivers.
- id: 172
  category: sharing_the_road
  question: 'When an emergency vehicle with sirens and flashing lights is approaching
    from behind, Connecticut law requires you to:'
  choices:
    A: Stop exactly where you are
    B: Speed up to get out of the way
    C: Pull over to the right edge of the road and stop
    D: Pull over to the left median and stop
  answer: C
  explanation: Connecticut law requires drivers to pull over to the right-hand edge
    or curb of the road and stop until the emergency vehicle has passed.
- id: 173
  category: sharing_the_road
  question: 'A slow-moving vehicle emblem (an orange triangle with a red border) is
    required in Connecticut for vehicles that travel at speeds less than:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The slow-moving vehicle emblem is used on vehicles, such as farm machinery,
    that are designed to operate at speeds of 25 mph or less.
- id: 174
  category: sharing_the_road
  question: 'When following a motorcycle in Connecticut, a driver should maintain
    a minimum following distance of at least:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 to 4 seconds
    D: 10 seconds
  answer: C
  explanation: The CT Driver's Manual recommends a 3 to 4-second following distance
    behind motorcycles because they can stop much quicker than cars and are more easily
    affected by road conditions.
- id: 175
  category: sharing_the_road
  question: 'Under Connecticut law, if you are turning right and a bicyclist is traveling
    straight through the intersection on your right side, you must:'
  choices:
    A: Speed up to pass the bicycle before turning
    B: Yield to the bicyclist and let them go through before you turn
    C: Honk to tell the bicyclist to stop
    D: Turn quickly so the bicyclist has to brake
  answer: B
  explanation: CT law prohibits 'hooking' a bicyclist. You must yield to any bicyclist
    traveling straight before making a right turn.
- id: 176
  category: sharing_the_road
  question: 'Large commercial trucks have ''No-Zones.'' These are areas where:'
  choices:
    A: Trucks are not allowed to drive
    B: Cars are allowed to park for short periods
    C: The truck driver has limited or no visibility
    D: The speed limit is reduced for all vehicles
  answer: C
  explanation: No-Zones are the large blind spots around the front, back, and sides
    of a truck where the driver cannot see other vehicles.
- id: 177
  category: sharing_the_road
  question: 'In Connecticut, when a pedestrian is crossing the street using a white
    cane or a guide dog, you must:'
  choices:
    A: Slow down and proceed with caution
    B: Honk your horn to let them know you are there
    C: Come to a complete stop and yield the right-of-way
    D: Drive around them if there is enough room
  answer: C
  explanation: Connecticut law requires drivers to come to a complete stop for any
    pedestrian carrying a white cane or using a guide dog.
- id: 178
  category: sharing_the_road
  question: 'In Connecticut, bicyclists are generally required to:'
  choices:
    A: Ride on the sidewalk at all times
    B: Ride against the flow of traffic
    C: Follow the same rules of the road as motor vehicles
    D: Only ride in designated bike lanes
  answer: C
  explanation: Under CT law, bicyclists have the same rights and duties as drivers
    of motor vehicles and must follow all traffic signals and signs.
- id: 179
  category: sharing_the_road
  question: 'When driving near a motorcycle, you should never:'
  choices:
    A: Share a lane with the motorcycle
    B: Pass the motorcycle in a passing zone
    C: Dim your high beams
    D: Use your turn signals
  answer: A
  explanation: A motorcycle is entitled to the full width of a lane. You should never
    attempt to share a lane with a motorcycle.
- id: 180
  category: sharing_the_road
  question: 'When a school bus is displaying flashing yellow lights, it means:'
  choices:
    A: The bus is about to stop and you should prepare to stop
    B: You must stop immediately
    C: The bus is breaking down
    D: You should speed up to pass the bus
  answer: A
  explanation: Flashing yellow lights on a school bus indicate that the bus is preparing
    to stop to load or unload children. Drivers should slow down and prepare to stop.
- id: 181
  category: sharing_the_road
  question: 'If you are following a truck at night, you should:'
  choices:
    A: Keep your high beams on to see the road better
    B: Dim your headlights to avoid blinding the truck driver via their large side
      mirrors
    C: Follow as closely as possible to stay in their draft
    D: Flash your lights repeatedly to let them know you are there
  answer: B
  explanation: Large side mirrors on trucks can reflect high beams into the driver's
    eyes. You should dim your headlights when following any vehicle, especially large
    trucks.
- id: 182
  category: sharing_the_road
  question: 'In Connecticut, pedestrians have the right-of-way in a crosswalk:'
  choices:
    A: Only if the crosswalk is marked with paint
    B: Only if there is a 'Walk' signal
    C: At both marked and unmarked crosswalks
    D: Only during daylight hours
  answer: C
  explanation: Connecticut law grants pedestrians the right-of-way at any intersection,
    whether the crosswalk is marked or unmarked.
- id: 183
  category: vehicle_information
  question: 'According to the Connecticut Driver''s Manual, you must turn on your
    headlights from:'
  choices:
    A: Sunset to sunrise
    B: One hour after sunset to one hour before sunrise
    C: One-half hour after sunset to one-half hour before sunrise
    D: 8:00 PM to 6:00 AM
  answer: C
  explanation: In Connecticut, headlights must be used from one-half hour after sunset
    to one-half hour before sunrise, or whenever visibility is less than 500 feet.
- id: 184
  category: vehicle_information
  question: Under Connecticut law, aftermarket window tinting on the side windows
    of a passenger vehicle must allow at least what percentage of light to pass through?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: Connecticut law (CGS 14-99g) requires that side windows allow at least
    35% of light to pass through (plus or minus 3% for variance).
- id: 185
  category: vehicle_information
  question: As of October 1, 2021, what is the seat belt requirement for adult passengers
    in the back seat of a vehicle in Connecticut?
  choices:
    A: Only passengers under 18 must wear a seat belt in the back seat
    B: Only passengers in the front seat are required to wear seat belts
    C: All passengers in all seating positions must wear a seat belt
    D: Back seat passengers are only required to wear belts on highways
  answer: C
  explanation: Effective October 1, 2021, Connecticut law requires all passengers
    in a motor vehicle to wear a seat belt, regardless of their age or where they
    are sitting in the vehicle.
- id: 186
  category: vehicle_information
  question: In Connecticut, a child must remain in a rear-facing child restraint system
    until they reach which of the following milestones?
  choices:
    A: 1 year old and 20 pounds
    B: 2 years old and 30 pounds
    C: 4 years old and 40 pounds
    D: 5 years old and 50 pounds
  answer: B
  explanation: Connecticut law requires children to remain in a rear-facing child
    restraint until they are at least two years of age AND weigh 30 pounds or more.
- id: 187
  category: vehicle_information
  question: 'In Connecticut, a child must be secured in a booster seat or other appropriate
    child restraint until they are:'
  choices:
    A: 5 years old and 40 pounds
    B: 6 years old and 50 pounds
    C: 8 years old and 60 pounds
    D: 10 years old and 80 pounds
  answer: C
  explanation: Children in Connecticut must use a booster seat until they are at least
    8 years old AND weigh at least 60 pounds.
- id: 188
  category: vehicle_information
  question: If you fail to have your vehicle's emissions tested by the due date in
    Connecticut, what is the late fee penalty?
  choices:
    A: No fee, just a warning
    B: $10
    C: $20
    D: $50
  answer: C
  explanation: Connecticut charges a $20 late fee if the emissions test is not performed
    by the scheduled due date.
- id: 189
  category: vehicle_information
  question: 'Connecticut law requires that your vehicle''s parking brake must be able
    to hold the vehicle on any grade:'
  choices:
    A: Only when the vehicle is empty
    B: Only on flat surfaces
    C: Regardless of the load the vehicle is carrying
    D: Only if the vehicle is an automatic transmission
  answer: C
  explanation: The parking brake must be strong enough to hold the vehicle on any
    hill (grade) it is driven on, regardless of the weight of the load.
- id: 190
  category: vehicle_information
  question: In Connecticut, every motor vehicle must have at least how many mirrors
    that provide a view of the highway to the rear for at least 200 feet?
  choices:
    A: One mirror
    B: Two mirrors
    C: Three mirrors
    D: Four mirrors
  answer: B
  explanation: Connecticut law requires at least two mirrors (usually a driver's side
    mirror and an interior rearview mirror) that provide a view of at least 200 feet
    to the rear.
- id: 191
  category: vehicle_information
  question: 'According to Connecticut''s ''Wipers On, Lights On'' law, you must turn
    on your headlights when:'
  choices:
    A: It is cloudy
    B: You are driving through a tunnel
    C: You are using your windshield wipers due to rain, snow, or ice
    D: You are driving on a one-way street
  answer: C
  explanation: Connecticut law requires drivers to turn on headlights whenever weather
    conditions require the continuous use of windshield wipers.
- id: 192
  category: vehicle_information
  question: In Connecticut, between which dates are studded tires permitted for use
    on motor vehicles?
  choices:
    A: October 1 to April 1
    B: November 1 to April 1
    C: November 15 to April 30
    D: December 1 to March 15
  answer: C
  explanation: Connecticut law allows the use of studded tires only from November
    15th through April 30th.
- id: 193
  category: vehicle_information
  question: In Connecticut, what is the minimum legal tread depth for tires to pass
    inspection and be considered safe?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: According to the Connecticut Driver's Manual, tires are considered
    unsafe if they are worn down to less than 2/32 of an inch of tread.
- id: 194
  category: vehicle_information
  question: Under Connecticut law, when must you turn on your headlights?
  choices:
    A: From sunset to sunrise
    B: From one-half hour after sunset to one-half hour before sunrise
    C: From one hour after sunset to one hour before sunrise
    D: Only when it is raining or snowing
  answer: B
  explanation: Connecticut law requires headlights to be on from one-half hour after
    sunset to one-half hour before sunrise, or whenever visibility is less than 500
    feet.
- id: 195
  category: vehicle_information
  question: In Connecticut, you must dim your high beams whenever you come within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Connecticut law requires drivers to switch to low beams when an oncoming
    vehicle is within 500 feet to avoid blinding the other driver.
- id: 196
  category: vehicle_information
  question: According to Connecticut law, what is the maximum level of window tinting
    allowed on the side windows of a passenger vehicle?
  choices:
    A: No tinting is allowed
    B: Light transmission of at least 20%
    C: Light transmission of at least 35%
    D: Light transmission of at least 50%
  answer: C
  explanation: Connecticut law requires that side windows allow at least 35% of light
    to pass through. Tinting darker than this is illegal without a medical exemption.
- id: 197
  category: vehicle_information
  question: 'Under Connecticut''s ''Wipers On, Lights On'' law, if you are using your
    windshield wipers due to weather, you must also:'
  choices:
    A: Turn on your hazard lights
    B: Turn on your high beams
    C: Turn on your headlights
    D: Turn off your radio
  answer: C
  explanation: Connecticut law requires that if weather conditions require the use
    of windshield wipers, the vehicle's headlights must also be turned on.
- id: 198
  category: vehicle_information
  question: In Connecticut, what is the fine for a non-commercial driver who fails
    to remove accumulated ice or snow from their vehicle before driving?
  choices:
    A: $25
    B: $75
    C: $150
    D: $250
  answer: B
  explanation: Under Connecticut General Statute 14-252a, failing to remove snow or
    ice from a non-commercial vehicle results in a $75 fine, which can increase significantly
    if the ice/snow causes injury or property damage.
- id: 199
  category: vehicle_information
  question: 'Every motor vehicle in Connecticut must be equipped with a horn that
    can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Connecticut safety regulations require a horn that is audible for at
    least 200 feet under normal conditions.
- id: 200
  category: vehicle_information
  question: 'In Connecticut, your vehicle''s brake lights must be visible from the
    rear for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Brake lights must be red and visible from a distance of at least 300
    feet in normal sunlight.
- id: 201
  category: vehicle_information
  question: What are the minimum bodily injury liability insurance limits required
    by law in Connecticut for an accident involving two or more people?
  choices:
    A: $20,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: C
  explanation: Connecticut law requires minimum bodily injury liability of $25,000
    per person and $50,000 per accident (when two or more people are injured).
- id: 202
  category: vehicle_information
  question: 'In Connecticut, a rearview mirror must be adjusted so that the driver
    can see the highway for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: State regulations require mirrors to provide a view of the road for
    at least 200 feet behind the vehicle.
- id: 203
  category: vehicle_information
  question: If your vehicle's turn signals are not working, you must use hand signals.
    What is the correct hand signal for a right turn in Connecticut?
  choices:
    A: Arm extended straight out the window
    B: Arm extended out and bent upward at the elbow
    C: Arm extended out and bent downward at the elbow
    D: Arm waving in a circular motion
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out the window and bent upward at a 90-degree angle.
- id: 204
  category: signs_and_signals
  question: In Connecticut, what does a flashing yellow traffic light signify?
  choices:
    A: Stop and wait for the light to turn green
    B: Slow down and proceed with caution
    C: Speed up to clear the intersection quickly
    D: Treat it like a four-way stop
  answer: B
  explanation: According to the Connecticut Driver's Manual, a flashing yellow light
    means you should slow down and proceed with caution through the intersection.
- id: 205
  category: signs_and_signals
  question: When you encounter a flashing yellow arrow at an intersection in Connecticut,
    what must you do?
  choices:
    A: You have the right-of-way to turn
    B: Stop and wait for a green arrow
    C: Turns are permitted, but you must first yield to oncoming traffic and pedestrians
    D: The signal is broken; treat it as a stop sign
  answer: C
  explanation: A flashing yellow arrow means left turns are allowed, but they are
    'unprotected,' meaning you must yield to oncoming traffic and pedestrians before
    turning.
- id: 206
  category: signs_and_signals
  question: 'In Connecticut, a ''Pennant'' shaped sign (isosceles triangle pointing
    right) found on the left side of the road indicates:'
  choices:
    A: A school zone
    B: A yield requirement
    C: A no passing zone
    D: A railroad crossing
  answer: C
  explanation: The pennant-shaped sign is placed on the left side of the road and
    marks the beginning of a no-passing zone.
- id: 207
  category: signs_and_signals
  question: What is the meaning of a pentagon-shaped sign in Connecticut?
  choices:
    A: Yield
    B: Stop
    C: School zone or school crossing
    D: Railroad crossing ahead
  answer: C
  explanation: A five-sided (pentagon) sign indicates you are near a school. It warns
    of school zones and school crossings.
- id: 208
  category: signs_and_signals
  question: 'Under Connecticut law, if you are approaching an intersection with a
    steady red light but intend to turn right, you may do so after stopping unless:'
  choices:
    A: It is after 11:00 PM
    B: There is a 'No Turn on Red' sign posted
    C: You are in a residential area
    D: You have a passenger under 18
  answer: B
  explanation: In Connecticut, you may turn right on red after coming to a complete
    stop and yielding to traffic/pedestrians, provided there is no sign prohibiting
    the turn.
- id: 209
  category: signs_and_signals
  question: What do 'Shared Lane Markings' (Sharrows) — a bicycle symbol with two
    chevrons — indicate on Connecticut roads?
  choices:
    A: Bicycles are prohibited on this road
    B: The lane is reserved exclusively for bicycles
    C: Bicycles may occupy the entire lane and motorists should expect them
    D: Motorists must maintain a speed of at least 25 mph
  answer: C
  explanation: Sharrows are used to assist bicyclists with positioning in a shared
    lane and alert motorists that bicyclists may occupy the full travel lane.
- id: 210
  category: signs_and_signals
  question: 'In Connecticut, a diamond-shaped sign with an orange background indicates:'
  choices:
    A: General warning of road hazards
    B: Construction or maintenance work zones
    C: State park or recreational area
    D: Directional guidance for highways
  answer: B
  explanation: Orange diamond-shaped signs are used specifically for construction
    and maintenance work zones to warn drivers of unusual or potentially dangerous
    conditions.
- id: 211
  category: signs_and_signals
  question: According to the Connecticut Driver's Manual, what does a double solid
    white line between lanes of traffic mean?
  choices:
    A: You may cross to pass if it is safe
    B: Lane changes are discouraged but permitted
    C: You are on a one-way street
    D: You are prohibited from crossing the lines to change lanes
  answer: D
  explanation: A double solid white line indicates that lane changes are prohibited.
    You must stay in your lane.
- id: 212
  category: signs_and_signals
  question: If you are at an intersection in Connecticut and the traffic light is
    a steady green arrow pointing left, what does this indicate?
  choices:
    A: You may turn left after yielding to oncoming traffic
    B: You have a protected turn; oncoming traffic is stopped by a red light
    C: You must stop and wait for a circular green light
    D: The arrow is only for emergency vehicles
  answer: B
  explanation: A green arrow means you have a 'protected' turn. Oncoming traffic is
    stopped, allowing you to turn in the direction of the arrow.
- id: 213
  category: signs_and_signals
  question: In Connecticut, when using hand signals to indicate a turn, how do you
    signal a 'Right Turn'?
  choices:
    A: Extend left arm out the window and point it straight out
    B: Extend left arm out the window and point it downward
    C: Extend left arm out the window and point it upward
    D: Extend right arm out the passenger window
  answer: C
  explanation: To signal a right turn using hand signals, extend your left arm out
    the window and bend it upward at the elbow.
- id: 214
  category: signs_and_signals
  question: A 'High Occupancy Vehicle' (HOV) lane in Connecticut is marked by which
    pavement symbol?
  choices:
    A: A white square
    B: A white diamond
    C: A yellow circle
    D: A green triangle
  answer: B
  explanation: HOV lanes, which are reserved for vehicles with a specific number of
    occupants, are marked with a white diamond symbol on the pavement.
- id: 215
  category: signs_and_signals
  question: When approaching a roundabout in Connecticut, what do the pavement markings
    and signs typically require you to do?
  choices:
    A: Stop before entering the circle
    B: Yield to traffic already in the circle
    C: Always use the left lane to exit
    D: Speed up to merge with traffic
  answer: B
  explanation: Drivers approaching a roundabout must yield to the traffic already
    circulating in the roundabout and to pedestrians in the crosswalk.
- id: 216
  category: signs_and_signals
  question: 'In Connecticut, a brown-colored traffic sign provides information about:'
  choices:
    A: Hospital and medical services
    B: Regulatory laws
    C: Public recreation and cultural interest areas
    D: Construction detours
  answer: C
  explanation: Brown signs are used to guide travelers to public recreation areas,
    state parks, and points of cultural or historical interest.
- id: 217
  category: signs_and_signals
  question: In Connecticut, if you are using hand signals and your left arm is extended
    straight out the window, what does this indicate?
  choices:
    A: You are slowing down or stopping
    B: You are making a right turn
    C: You are making a left turn
    D: You are signaling for the car behind to pass
  answer: C
  explanation: According to the Connecticut Driver's Manual, a left arm extended straight
    out indicates a left turn.
- id: 218
  category: signs_and_signals
  question: In Connecticut, what does a steady yellow 'X' signal above a highway lane
    mean?
  choices:
    A: The lane is about to be closed; you should move out of it as soon as safe
    B: The lane is reserved for emergency vehicles only
    C: You may use the lane to pass slower traffic
    D: The lane is open for all traffic
  answer: A
  explanation: A steady yellow 'X' over a lane indicates that the lane signal is about
    to change to a red 'X' and the driver should prepare to leave that lane safely.
- id: 219
  category: signs_and_signals
  question: Under Connecticut law, when a pedestrian is in a crosswalk, even if it
    is unmarked, what must a driver do?
  choices:
    A: Honk to warn the pedestrian of your presence
    B: Slow down but continue if the pedestrian is not in your lane
    C: Stop and remain stopped until the pedestrian has crossed the driver's lane
    D: Only stop if there is a 'Yield to Pedestrians' sign present
  answer: C
  explanation: Connecticut law requires drivers to stop and stay stopped for pedestrians
    in a crosswalk (marked or unmarked) once the pedestrian has stepped off the curb.
- id: 220
  category: signs_and_signals
  question: In Connecticut, what do double solid white lines painted on the pavement
    indicate?
  choices:
    A: Changing lanes is permitted with caution
    B: The edge of the roadway
    C: Lane changes are prohibited
    D: A shared turn lane
  answer: C
  explanation: Double solid white lines indicate that changing lanes is prohibited.
    These are often seen near exit ramps or in HOV lanes.
- id: 221
  category: signs_and_signals
  question: If you are at an intersection with a green light but traffic is backed
    up into the intersection, what should you do according to CT law?
  choices:
    A: Enter the intersection and wait for traffic to move
    B: Honk your horn until the traffic clears
    C: Wait until there is enough space on the other side to clear the intersection
      completely
    D: Turn right instead to avoid the congestion
  answer: C
  explanation: Connecticut's 'Don't Block the Box' principles state you should not
    enter an intersection unless you can get all the way through without stopping,
    to avoid blocking cross traffic.
- id: 222
  category: signs_and_signals
  question: What is the purpose of a 'sharrow' marking (a bicycle symbol with two
    chevrons) on a Connecticut roadway?
  choices:
    A: It marks a lane reserved exclusively for bicycles
    B: It indicates a lane shared by both bicyclists and motor vehicles
    C: It indicates a pedestrian-only zone
    D: It marks the start of a highway
  answer: B
  explanation: Sharrows are used to indicate that a lane is shared by bicycles and
    motor vehicles and help bicyclists position themselves safely in traffic.
- id: 223
  category: signs_and_signals
  question: 'In Connecticut, a sign showing a white arrow curving to the right with
    a red circle and a slash through it means:'
  choices:
    A: Right turns are permitted only after stopping
    B: No right turn is permitted
    C: One-way traffic to the right
    D: Yield to traffic coming from the right
  answer: B
  explanation: A red circle with a slash is the standard symbol for 'No' or 'Prohibited.'
    Combined with a right arrow, it means no right turns are allowed.
- id: 224
  category: signs_and_signals
  question: 'When you see a ''Yield'' sign at the entrance of a roundabout in Connecticut,
    you must yield to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the roundabout
    C: No one; you have the right of way
    D: Only emergency vehicles
  answer: B
  explanation: In a roundabout, traffic already in the circle has the right of way.
    Entering vehicles must yield to those circulating.
- id: 225
  category: signs_and_signals
  question: What does a solid yellow line next to a broken yellow line on the pavement
    mean in Connecticut?
  choices:
    A: Passing is prohibited for both directions
    B: Passing is permitted for both directions
    C: Passing is permitted only for the side with the broken line
    D: Passing is permitted only for the side with the solid line
  answer: C
  explanation: A broken yellow line next to a solid yellow line indicates that passing
    is allowed only for drivers on the side of the broken line.
- id: 226
  category: signs_and_signals
  question: In Connecticut, what does a sign with a yellow background and a black
    'X' with the letters 'RR' indicate?
  choices:
    A: Road Rage zone ahead
    B: Restricted Roadway
    C: Railroad crossing ahead
    D: Rough Road ahead
  answer: C
  explanation: The circular yellow sign with a black 'X' and 'RR' is the advance warning
    sign for a railroad crossing.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 227
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 228
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 229
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 230
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 231
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 232
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 233
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 234
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
