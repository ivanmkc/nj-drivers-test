questions:
- id: 1
  category: driver_responsibility
  question: 'Según el manual del conductor de Connecticut, conducir se considera:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio y no un derecho
    C: Un derecho para cualquier persona mayor de 18 años
    D: Un derecho incondicional para los residentes del estado
  answer: B
  explanation: El manual recuerda a todos los titulares de licencias que conducir
    es un privilegio y no un derecho.
- id: 2
  category: safe_driving_rules
  question: ¿Qué se ha señalado como un factor contribuyente en muchos accidentes
    graves en Connecticut?
  choices:
    A: Conducir vehículos híbridos
    B: La conducción distraída, incluyendo el uso de teléfonos
    C: Registrarse para votar en el DMV
    D: Usar el Programa de Licencias Limitadas
  answer: B
  explanation: El mensaje del Gobernador señala que la conducción distraída, incluyendo
    el uso de teléfonos al conducir, ha sido un factor contribuyente en muchos accidentes
    graves.
- id: 3
  category: license_system
  question: ¿Para qué grupo de edad impuso Connecticut recientemente leyes de conducción
    para adolescentes más estrictas y sanciones más severas?
  choices:
    A: Conductores de 14 y 15 años
    B: Conductores de 16 y 17 años
    C: Conductores de 18 y 19 años
    D: Conductores de 21 años
  answer: B
  explanation: El manual establece que Connecticut impuso leyes de conducción para
    adolescentes más estrictas para los conductores de 16 y 17 años para mantenerlos
    seguros mientras aprenden.
- id: 4
  category: penalties_and_points
  question: ¿Cuál es el propósito principal de las leyes más estrictas y las sanciones
    más severas para los conductores adolescentes?
  choices:
    A: Generar ingresos para el estado
    B: Reducir choques, lesiones y muertes
    C: Desalentar a los adolescentes de obtener una licencia
    D: Aumentar el número de exámenes de carretera
  answer: B
  explanation: Las leyes y sanciones existen para ayudar a reducir los choques, las
    lesiones y las muertes.
- id: 5
  category: safe_driving_rules
  question: ¿Qué pide el mensaje del Gobernador a todos los conductores para garantizar
    la seguridad en la carretera?
  choices:
    A: Conducir solo durante las horas del día
    B: Abrocharse el cinturón, porque los cinturones de seguridad salvan vidas
    C: Nunca conducir con pasajeros
    D: Usar solo dispositivos de manos libres
  answer: B
  explanation: 'El mensaje establece explícitamente: "Recuerde, por favor abróchese
    el cinturón. Los cinturones de seguridad salvan vidas".'
- id: 6
  category: driver_responsibility
  question: ¿Es el Manual del Conductor de Connecticut una declaración precisa de
    los Estatutos Generales de Connecticut?
  choices:
    A: Sí, contiene la redacción legal exacta de todas las leyes de tránsito.
    B: No, solo intenta proporcionar una familiaridad general con la operación segura
      y legal.
    C: Sí, pero solo para conductores menores de 18 años.
    D: No, solo cubre las leyes federales de conducción.
  answer: B
  explanation: El manual establece que su contenido no es una declaración precisa
    de los Estatutos Generales de Connecticut, sino que intenta proporcionar una familiaridad
    general con la operación segura y legal.
- id: 7
  category: driver_responsibility
  question: ¿Dónde debe buscar un conductor para encontrar la redacción específica
    de una ley de vehículos motorizados de Connecticut?
  choices:
    A: El Índice (Table of Contents)
    B: La edición más reciente de los Estatutos Generales
    C: La guía de la Asociación Americana de Administradores de Vehículos Motorizados
    D: El folleto del Programa de Licencias Limitadas
  answer: B
  explanation: El manual aconseja a los lectores utilizar la edición más reciente
    de los Estatutos Generales para encontrar la redacción específica de una ley.
- id: 8
  category: vehicle_information
  question: ¿Qué organización asistió al Departamento de Vehículos Motorizados (DMV)
    de Connecticut en la recopilación del manual del conductor?
  choices:
    A: La Asociación Americana de Administradores de Vehículos Motorizados (AAMVA)
    B: El Departamento de Transporte de Connecticut
    C: La Administración Federal de Carreteras
    D: La Administración Nacional de Seguridad del Tráfico en las Carreteras
  answer: A
  explanation: El manual fue compilado por el DMV de Connecticut con la asistencia
    de la Asociación Americana de Administradores de Vehículos Motorizados (AAMVA).
- id: 9
  category: license_system
  question: Según el Índice del manual, ¿qué requisito de capacitación específico
    existe para los solicitantes de 16 y 17 años además de la educación vial?
  choices:
    A: Capacitación avanzada en carreteras
    B: Requisitos de capacitación para padres
    C: Capacitación para conductores comerciales
    D: Certificación de conducción nocturna
  answer: B
  explanation: El Índice enumera los "Requisitos de capacitación para padres" bajo
    la sección para solicitantes de 16 y 17 años.
- id: 10
  category: license_system
  question: Según el Índice, ¿qué programa está disponible bajo "Servicios para conductores
    con discapacidades"?
  choices:
    A: El Programa de Licencias Ilimitadas
    B: El Programa de Licencias Limitadas
    C: El Programa de Conducción Ecológica
    D: El Programa de Cojín de Espacio
  answer: B
  explanation: El Índice enumera el "Programa de Licencias Limitadas" bajo la sección
    de "Servicios para conductores con discapacidades".
- id: 11
  category: driver_responsibility
  question: ¿Quién es el Gobernador de Connecticut que proporcionó el mensaje introductorio
    en el manual revisado de marzo de 2023?
  choices:
    A: Antonio Guerrera
    B: Ned Lamont
    C: Tony Guerrera
    D: El Comisionado de Vehículos Motorizados
  answer: B
  explanation: El mensaje introductorio es del Gobernador Ned Lamont y del Comisionado
    Antonio "Tony" Guerrera.
- id: 12
  category: license_system
  question: Según el Índice, ¿qué grupo de edad de conductores tiene "Restricciones"
    específicas detalladas en el Capítulo 1?
  choices:
    A: Conductores de 16 y 17 años
    B: Conductores de 18 años de edad o más
    C: Conductores primerizos mayores de 21 años
    D: Conductores con discapacidades
  answer: A
  explanation: El Capítulo 1 del Índice incluye una sección titulada "Restricciones
    para conductores de 16 y 17 años".
- id: 13
  category: driver_responsibility
  question: ¿Cuál es el objetivo principal del Manual del Conductor de Connecticut?
  choices:
    A: Proporcionar una declaración precisa de los Estatutos Generales de Connecticut
    B: Proporcionar una familiaridad general con los principios de operación segura
      y legal de un vehículo motorizado
    C: Reemplazar la necesidad de un curso de educación vial
    D: Servir como defensa legal en un tribunal de tránsito
  answer: B
  explanation: El manual establece que "intenta proporcionar una familiaridad general
    con los principios de operación segura y legal de un vehículo motorizado".
- id: 14
  category: vehicle_information
  question: ¿Cuándo se revisó esta edición específica del Manual del Conductor de
    Connecticut?
  choices:
    A: Enero de 2022
    B: Marzo de 2023
    C: Julio de 2021
    D: Diciembre de 2023
  answer: B
  explanation: El texto indica que el manual fue "Revisado en marzo de 2023".
- id: 15
  category: defensive_driving
  question: Según el mensaje del Gobernador, ¿qué requiere la conducción en todo momento?
  choices:
    A: Concentración total
    B: Un dispositivo de manos libres
    C: Un pasajero para ayudar con la navegación
    D: El uso del control de crucero
  answer: A
  explanation: 'El mensaje indica: "Conducir es una experiencia de aprendizaje constante
    y requiere una concentración total en todo momento".'
- id: 16
  category: license_system
  question: En Connecticut, ¿con qué clase se designa una licencia de conducir estándar
    no comercial?
  choices:
    A: Clase A
    B: Clase C
    C: Clase D
    D: Clase M
  answer: C
  explanation: Según el manual, una licencia de conducir no comercial se conoce y
    se designa como Clase D.
- id: 17
  category: license_system
  question: 'A menos que aparezcan restricciones en la licencia, una licencia Clase
    D le permite operar cualquier vehículo motorizado EXCEPTO:'
  choices:
    A: Un vehículo de pasajeros
    B: Un vehículo motorizado comercial
    C: Un vehículo utilitario deportivo (SUV)
    D: Una minivan
  answer: B
  explanation: El manual establece que, a menos que aparezcan restricciones en la
    licencia, una licencia Clase D puede usarse para operar cualquier vehículo motorizado,
    excepto un vehículo motorizado comercial.
- id: 18
  category: license_system
  question: Si desea una licencia para conducir un vehículo comercial o de servicio
    público, como un camión o un autobús, ¿qué manual debe leer?
  choices:
    A: El manual del Operador de Motocicletas
    B: El manual del Conductor Clase D
    C: El manual de Licencia de Conducir Comercial (CDL)
    D: El manual de Tránsito Público
  answer: C
  explanation: El texto especifica que si desea una licencia para conducir un vehículo
    comercial o de servicio público, debe leer el manual de Licencia de Conducir Comercial
    (CDL).
- id: 19
  category: license_system
  question: ¿Qué se requiere además de leer el manual del Operador de Motocicletas
    si desea conducir una motocicleta?
  choices:
    A: Una restricción de Clase D
    B: Una licencia de conducir comercial
    C: Un endoso de motocicleta
    D: Un permiso de operador juvenil
  answer: C
  explanation: El manual establece que si desea un endoso para conducir una motocicleta,
    debe leer el manual del Operador de Motocicletas.
- id: 20
  category: safe_driving_rules
  question: Según el manual, ¿cuál es la causa número uno de muerte para los adolescentes
    de 15 a 19 años?
  choices:
    A: Sobredosis de drogas
    B: Choques de vehículos motorizados
    C: Lesiones deportivas
    D: Intoxicación por alcohol
  answer: B
  explanation: El manual establece explícitamente bajo "Los choques matan a los adolescentes"
    que los choques de vehículos motorizados son la causa número uno de muerte para
    los adolescentes de 15 a 19 años.
- id: 21
  category: defensive_driving
  question: ¿Durante qué periodo ocurre la mayoría de los choques de adolescentes?
  choices:
    A: Durante las primeras seis semanas de tener un permiso
    B: Durante los primeros dos años de tener su licencia
    C: Después de cinco años de experiencia al conducir
    D: Solo cuando conducen de noche
  answer: B
  explanation: El texto señala que la mayoría de los choques de adolescentes ocurren
    durante los primeros dos años de tener su licencia.
- id: 22
  category: defensive_driving
  question: ¿Qué periodo se considera el más peligroso para un conductor adolescente
    recién licenciado?
  choices:
    A: Los primeros seis meses
    B: El primer año
    C: El segundo año
    D: El primer mes
  answer: A
  explanation: Según el manual, los primeros seis meses son los más peligrosos para
    el adolescente recién licenciado.
- id: 23
  category: driver_testing
  question: ¿A dónde debe acudir para encontrar una lista de los documentos requeridos
    para solicitar un permiso de aprendizaje y para programar una cita para el examen
    de conocimientos en línea?
  choices:
    A: Una estación de policía local
    B: ct.gov/teendriving
    C: ct.gov/dmv
    D: El manual de Licencia de Conducir Comercial (CDL)
  answer: C
  explanation: El manual indica a los lectores que visiten ct.gov/dmv para obtener
    una lista de los documentos requeridos para solicitar un permiso de aprendizaje
    y para programar una cita para el examen de conocimientos en línea.
- id: 24
  category: driver_responsibility
  question: ¿Qué sitio web desea el Comité Asesor del Comisionado del DMV sobre la
    Conducción Segura de Adolescentes que visiten los padres?
  choices:
    A: ct.gov/dmv
    B: ct.gov/teendriving
    C: ct.gov/safety
    D: ct.gov/parents
  answer: B
  explanation: El texto establece que el Comité Asesor del Comisionado del DMV sobre
    la Conducción Segura de Adolescentes desea que los padres visiten ct.gov/teendriving.
- id: 25
  category: driver_responsibility
  question: ¿Qué recomienda el manual que los padres proporcionen tanto como sea posible
    durante el periodo de obtención de la licencia?
  choices:
    A: Apoyo financiero para el seguro
    B: Práctica supervisada
    C: Cursos de conducción avanzada
    D: Un vehículo nuevo y seguro
  answer: B
  explanation: 'El manual aconseja a los padres: "Proporcione tanta práctica supervisada
    como pueda durante el periodo de obtención de la licencia".'
- id: 26
  category: safe_driving_rules
  question: Según el índice del manual, ¿qué capítulo trata sobre "Seguridad Vial"?
  choices:
    A: Capítulo 3
    B: Capítulo 4
    C: Capítulo 5
    D: Capítulo 6
  answer: B
  explanation: 'El índice enumera el "CAPÍTULO 4: SEGURIDAD VIAL" (CHAPTER 4: ROAD
    SAFETY).'
- id: 27
  category: signs_and_signals
  question: Según el índice, ¿dónde buscaría información sobre "Marcas en el pavimento"
    y "Señales de tráfico"?
  choices:
    A: 'Capítulo 4: Seguridad Vial'
    B: 'Capítulo 5: Conozca la carretera'
    C: 'Capítulo 6: Directorio del consumidor del DMV'
    D: Evitar los riesgos
  answer: B
  explanation: 'El índice enumera "Marcas en el pavimento" y "Señales de tráfico"
    bajo el "CAPÍTULO 5: CONOZCA LA CARRETERA" (CHAPTER 5: KNOW THE ROAD).'
- id: 28
  category: penalties_and_points
  question: Según el índice, ¿qué programa existe para infractores reincidentes?
  choices:
    A: Programa de reentrenamiento de operadores
    B: Programa de estatus de ofensor juvenil
    C: Iniciativa de conducción defensiva
    D: Programa de revocación de licencia
  answer: A
  explanation: El índice incluye una sección titulada "Programa de reentrenamiento
    de operadores para infractores reincidentes" (Operator Retraining Program for
    Repeat Offenders).
- id: 29
  category: penalties_and_points
  question: ¿Cuál de los siguientes temas aparece bajo la sección "Su licencia y la
    ley" en el índice?
  choices:
    A: Rotondas
    B: Marcas en el pavimento
    C: Estatus de ofensor juvenil
    D: Emergencias del vehículo
  answer: C
  explanation: En el índice, el "Estatus de ofensor juvenil" (Youthful Offender Status)
    aparece directamente bajo la sección "Su licencia y la ley".
- id: 30
  category: driver_responsibility
  question: ¿Qué factor biológico se menciona como objeto de investigación en relación
    con la conducción de adolescentes?
  choices:
    A: Desarrollo de la visión
    B: Velocidad de los reflejos
    C: Desarrollo del cerebro
    D: Memoria muscular
  answer: C
  explanation: El texto incluye un punto específicamente titulado "Desarrollo del
    cerebro" (Brain Development) al discutir la investigación relacionada con la conducción
    de adolescentes.
- id: 31
  category: driver_responsibility
  question: ¿Las investigaciones muestran que la parte del cerebro que evalúa el riesgo
    y el peligro no se desarrolla completamente hasta qué edad?
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: Mediados de los 20 años
    D: Principios de los 30 años
  answer: C
  explanation: Las investigaciones muestran que la parte del cerebro que evalúa el
    riesgo y el peligro no se desarrolla completamente hasta mediados de los 20 años.
- id: 32
  category: alcohol_drugs_health
  question: ¿Cuál es la política de Connecticut sobre los adolescentes que beben y
    conducen?
  choices:
    A: Un límite de 0.08% de BAC
    B: Una ley de Tolerancia Cero (Zero-Tolerance Law)
    C: Una advertencia por la primera infracción
    D: Permitido si está acompañado por un padre
  answer: B
  explanation: Connecticut tiene una ley de Tolerancia Cero (Zero-Tolerance Law) para
    los adolescentes que beben y conducen. Incluso una sola bebida afecta la capacidad
    de conducción de un adolescente.
- id: 33
  category: license_system
  question: ¿Qué curso se requiere para cualquier persona, independientemente de su
    edad, que no haya tenido previamente una licencia en Connecticut u otro estado?
  choices:
    A: Un curso de conducción defensiva de 4 horas
    B: Un curso de Prácticas de Conducción Segura (Safe Driving Practices) de 8 horas
    C: Un curso de 12 horas al volante
    D: Un curso de capacitación para padres de 2 horas
  answer: B
  explanation: La ley de Connecticut exige que cualquier persona que no haya tenido
    previamente una licencia tome un curso de Prácticas de Conducción Segura (Safe
    Driving Practices) de 8 horas en una Escuela de Manejo Comercial de Connecticut
    antes de obtener una licencia.
- id: 34
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener un permiso de aprendizaje
    en Connecticut?
  choices:
    A: 15 años de edad
    B: 15 años y medio de edad
    C: 16 años de edad
    D: 17 años de edad
  answer: C
  explanation: Para obtener un permiso de aprendizaje, debe tener al menos 16 años
    de edad.
- id: 35
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de aprendizaje de Connecticut?
  choices:
    A: 6 meses a partir de la fecha de emisión
    B: 1 año a partir de la fecha de emisión
    C: Hasta que obtenga una licencia de conducir o 2 años a partir de la fecha de
      emisión
    D: Hasta que el conductor cumpla 18 años
  answer: C
  explanation: El permiso será válido hasta que obtenga una licencia de conducir o
    2 años a partir de la fecha de emisión (lo que ocurra primero).
- id: 36
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el examen
    de conocimientos para un permiso de aprendizaje?
  choices:
    A: 15 de 20
    B: 18 de 25
    C: 20 de 25
    D: 25 de 25
  answer: C
  explanation: El examen de conocimientos consta de 25 preguntas y necesita 20 respuestas
    correctas para aprobar.
- id: 37
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para todas las clases de licencia
    en Connecticut?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Los requisitos mínimos de visión para todas las clases de licencia
    son de al menos 20/40 con o sin anteojos o lentes de contacto.
- id: 38
  category: driver_testing
  question: Si un solicitante es ciego de un ojo, ¿cuáles son los requisitos de visión
    para el otro ojo?
  choices:
    A: 20/20 con un campo visual de 120 grados
    B: 20/40 con un campo visual mínimo de 100 grados o más
    C: 20/30 con un campo visual mínimo de 90 grados
    D: No pueden obtener una licencia de conducir
  answer: B
  explanation: Si el solicitante es ciego de un ojo, el otro ojo debe tener al menos
    20/40 con un campo visual mínimo de 100 grados o más.
- id: 39
  category: penalties_and_points
  question: ¿Qué puede suceder si su licencia de conducir indica que debe usar lentes
    correctivos y la policía lo detiene mientras no los usa?
  choices:
    A: Se le dará una advertencia verbal
    B: Su vehículo será confiscado
    C: Se le puede emitir una citación
    D: Su licencia será revocada permanentemente
  answer: C
  explanation: Si su licencia de conducir indica que debe usar lentes correctivos
    y un oficial de la ley lo detiene mientras no los usa, se le puede emitir una
    citación.
- id: 40
  category: safe_driving_rules
  question: ¿Dónde debe sentarse el instructor calificado al dar instrucción al titular
    de un permiso de aprendizaje?
  choices:
    A: En el asiento trasero directamente detrás del conductor
    B: En el asiento del pasajero delantero junto al aprendiz
    C: En cualquier lugar del vehículo siempre que pueda ver la carretera
    D: En el asiento trasero del lado del pasajero
  answer: B
  explanation: La persona que da instrucción al titular del permiso de aprendizaje
    debe sentarse en el asiento del pasajero delantero junto al aprendiz y debe estar
    alerta y lista para tomar el control.
- id: 41
  category: license_system
  question: ¿Qué requisitos debe cumplir una persona que no es un instructor de manejo
    con licencia para instruir a un titular de permiso de aprendizaje de 16 o 17 años?
  choices:
    A: Al menos 18 años de edad y haber tenido una licencia durante 2 años
    B: Al menos 20 años de edad, haber tenido una licencia durante 4 años consecutivos
      sin suspensiones en los 4 años anteriores
    C: Al menos 21 años de edad y haber tenido una licencia durante 5 años
    D: Al menos 25 años de edad con un historial de conducción limpio
  answer: B
  explanation: El instructor debe tener al menos 20 años de edad, haber tenido una
    licencia de conducir durante cuatro o más años consecutivos y no haber tenido
    su licencia suspendida durante los cuatro años anteriores al entrenamiento.
- id: 42
  category: license_system
  question: ¿Cuántas horas de instrucción debe completar un padre o tutor legal con
    su hijo adolescente de 16 o 17 años que obtiene un permiso de aprendizaje?
  choices:
    A: 2 horas
    B: 4 horas
    C: 6 horas
    D: 8 horas
  answer: A
  explanation: Se requiere que el padre o tutor legal de un joven de 16 o 17 años
    que obtiene un permiso de aprendizaje complete dos horas de instrucción con su
    hijo adolescente sobre las leyes que rigen a los conductores menores de 18 años
    y los peligros de la conducción en adolescentes.
- id: 43
  category: safe_driving_rules
  question: Según el manual, ¿qué grupo de edad tiene la tasa más baja de uso del
    cinturón de seguridad?
  choices:
    A: Niños menores de 12 años
    B: Adolescentes
    C: Adultos de 25 a 35 años
    D: Personas mayores
  answer: B
  explanation: El manual establece en la sección 'Exija que su hijo adolescente se
    abroche el cinturón' que los adolescentes tienen la tasa más baja de uso del cinturón
    de seguridad.
- id: 44
  category: driver_testing
  question: ¿Qué muestran los estudios con respecto a los registros de conducción
    de los conductores con discapacidad auditiva?
  choices:
    A: Tienen significativamente más choques que otros conductores
    B: Están restringidos a conducir solo durante el día
    C: Sus registros de conducción son tan buenos como los de los conductores con
      buena audición
    D: Deben usar audífonos al conducir por ley
  answer: C
  explanation: Los estudios han demostrado que los registros de conducción de los
    conductores con discapacidad auditiva son tan buenos como los de los conductores
    con buena audición porque aprenden a confiar más en su visión y tienden a mantenerse
    más alerta.
- id: 45
  category: license_system
  question: ¿Cuánto tiempo debe esperar un solicitante de 16 o 17 años para realizar
    el examen de conducción si completa con éxito la educación vial a través de una
    escuela de manejo comercial?
  choices:
    A: 90 días
    B: 120 días
    C: 180 días
    D: 6 meses
  answer: B
  explanation: Según el manual, los solicitantes que completen con éxito la educación
    vial a través de una escuela de manejo comercial o una escuela secundaria deben
    esperar 120 días después de la emisión del permiso de aprendizaje antes de realizar
    el examen de conducción.
- id: 46
  category: license_system
  question: ¿Cuál es el período de espera requerido antes de realizar el examen de
    conducción para un solicitante que tiene 18 años de edad o más?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: El manual establece que una persona de 18 años de edad o más debe obtener
    y mantener un permiso de aprendizaje durante al menos 90 días antes de realizar
    un examen de conducción.
- id: 47
  category: driver_testing
  question: ¿Quién está calificado para actuar como instructor en el Programa de Entrenamiento
    en el Hogar?
  choices:
    A: Cualquier persona que tenga al menos 18 años con una licencia válida.
    B: Una persona de al menos 20 años que haya tenido una licencia durante cuatro
      o más años sin suspensiones.
    C: Cualquier conductor con licencia que haya estado conduciendo durante al menos
      dos años.
    D: Una persona de al menos 21 años que tenga un historial de conducción limpio
      durante un año.
  answer: B
  explanation: Los solicitantes de entrenamiento en el hogar deben entrenar con un
    instructor que tenga al menos 20 años de edad y que haya tenido una licencia durante
    cuatro o más años antes del entrenamiento, la cual no haya sido suspendida durante
    ese período de cuatro años.
- id: 48
  category: driver_responsibility
  question: ¿Cuántas horas de entrenamiento al volante y en carretera se requieren
    para todos los solicitantes de 16 o 17 años?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 50 horas
  answer: C
  explanation: El manual especifica que todos los solicitantes que tengan 16 o 17
    años de edad deben tener al menos 40 horas de entrenamiento al volante y en carretera.
- id: 49
  category: driver_testing
  question: ¿Qué sucede si se determina que el vehículo que trae para su examen de
    conducción se encuentra en una condición de funcionamiento insegura?
  choices:
    A: Se le cobrará una multa de $50.
    B: El examen se realizará únicamente en un estacionamiento.
    C: Debe alquilar un vehículo del DMV.
    D: No se realizará ninguna evaluación y deberá reprogramar la cita sin costo alguno.
  answer: D
  explanation: Si se determina que el vehículo de prueba está en una condición de
    funcionamiento insegura, no se realizará ninguna evaluación al volante; el solicitante
    reprogramará el examen de conducción sin costo alguno.
- id: 50
  category: alcohol_drugs_health
  question: El curso obligatorio de ocho horas de conducción segura incluye un mínimo
    de ¿cuántas horas enfocadas en los efectos del alcohol y las drogas?
  choices:
    A: Dos horas
    B: Cuatro horas
    C: Seis horas
    D: Ocho horas
  answer: B
  explanation: El curso de ocho horas incluye un mínimo de cuatro horas sobre la naturaleza
    y los efectos médicos, biológicos y fisiológicos del alcohol y las drogas, y su
    impacto en el operador de un vehículo motorizado.
- id: 51
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito antes de cambiar la marcha del
    vehículo desde la posición de estacionamiento ('park') durante su examen de conducción?
  choices:
    A: Tocar la bocina dos veces.
    B: Encender las luces de emergencia.
    C: Presionar el freno.
    D: Bajar la ventanilla del lado del conductor.
  answer: C
  explanation: Durante su examen, debe recordar presionar el freno antes de cambiar
    la marcha del vehículo desde la posición de estacionamiento ('park').
- id: 52
  category: license_system
  question: ¿Cuál es la tarifa requerida para una licencia de conducir después de
    aprobar el examen de conducción?
  choices:
    A: $40
    B: $65
    C: $84
    D: $120
  answer: C
  explanation: 'Bajo la sección ''Para comenzar el examen de conducción necesitará'',
    el manual establece: ''Tarifas de licencia. Debe pagar $84 por una licencia después
    de aprobar el examen de conducción''.'
- id: 53
  category: driver_responsibility
  question: ¿Qué debe completar el padre o tutor legal de un titular de permiso de
    aprendizaje de 16 o 17 años?
  choices:
    A: Un curso de conducción defensiva de cuatro horas.
    B: Dos horas de instrucción sobre las leyes y los peligros de la conducción en
      adolescentes.
    C: Un examen escrito en el DMV.
    D: 40 horas de formación con un instructor certificado.
  answer: B
  explanation: El padre o tutor legal de un adolescente que obtiene un permiso de
    aprendizaje debe completar dos horas de instrucción sobre las leyes que rigen
    a los conductores menores de 18 años y los peligros de la conducción en adolescentes.
- id: 54
  category: vehicle_information
  question: ¿Se puede utilizar un vehículo alquilado para un examen de conducción?
  choices:
    A: Sí, bajo cualquier circunstancia.
    B: Sí, pero solo si paga una tarifa adicional.
    C: No, a menos que ya tenga una licencia de conducir válida.
    D: No, los vehículos alquilados están estrictamente prohibidos para cualquier
      examen del DMV.
  answer: C
  explanation: 'El manual establece: ''Si no tiene una licencia de conducir válida,
    no puede realizar el examen en un vehículo alquilado''.'
- id: 55
  category: license_system
  question: Después de aprobar el examen de conducción y pagar su licencia en el DMV,
    ¿cómo recibirá su tarjeta de licencia de conducir permanente?
  choices:
    A: Se imprimirá y se le entregará inmediatamente en la oficina.
    B: Llegará por correo en un plazo de 20 días.
    C: Debe regresar al DMV después de 7 días para recogerla.
    D: Se le enviará por correo electrónico como una copia digital.
  answer: B
  explanation: Los solicitantes calificados recibirán una tarjeta de papel temporal
    en la oficina. La tarjeta de licencia permanente llegará por correo en un plazo
    de 20 días.
- id: 56
  category: driver_testing
  question: Durante el examen de conducción, el agente o inspector evaluará su capacidad
    para operar el equipo del vehículo. ¿Cuál de los siguientes se menciona específicamente
    como equipo que debe ser capaz de operar?
  choices:
    A: El sistema de navegación GPS
    B: La radio y el sistema de sonido
    C: Los limpiaparabrisas y lavaparabrisas
    D: La función de control de crucero
  answer: C
  explanation: El examen de conducción evalúa el funcionamiento del equipo del vehículo,
    como los limpiaparabrisas y lavaparabrisas, la calefacción y el desempañador,
    el freno de mano, los faros delanteros y las luces altas, y la bocina.
- id: 57
  category: defensive_driving
  question: ¿Qué debe mantener alrededor de su vehículo que sea apropiado para la
    velocidad, la carretera y las condiciones de tráfico existentes?
  choices:
    A: Una velocidad constante de 45 mph
    B: Un margen de seguridad (space cushion)
    C: Luces altas encendidas
    D: Un mínimo de tres pasajeros
  answer: B
  explanation: Durante su examen, debe recordar mantener un 'margen de seguridad'
    (space cushion) alrededor de su vehículo que sea apropiado para la velocidad,
    la carretera y las condiciones de tráfico existentes.
- id: 58
  category: license_system
  question: Si un solicitante de 16 o 17 años no completa la educación vial a través
    de una escuela comercial o secundaria, ¿cuánto tiempo debe esperar después de
    la emisión del permiso de aprendizaje antes de realizar el examen de conducir?
  choices:
    A: 90 días
    B: 120 días
    C: 150 días
    D: 180 días
  answer: D
  explanation: Los solicitantes que completan con éxito la educación vial a través
    de una escuela comercial o secundaria esperan 120 días. Todos los demás solicitantes
    deben esperar 180 días después de la emisión del permiso de aprendizaje antes
    de realizar el examen de conducir.
- id: 59
  category: license_system
  question: ¿Están obligados los conductores con licencia de 16 y 17 años de otros
    estados a tomar el curso de conducción segura de ocho horas para obtener una licencia
    de Connecticut?
  choices:
    A: No, su licencia de otro estado anula todos los requisitos.
    B: Sí, este requisito del curso de ocho horas es necesario para ellos.
    C: Solo si han tenido una suspensión de licencia previa.
    D: No, solo necesitan tomar una clase de capacitación para padres de dos horas.
  answer: B
  explanation: 'El manual establece explícitamente: ''Este requisito del curso de
    ocho horas también es necesario para los conductores con licencia de 16 y 17 años
    de otros estados que deseen obtener una licencia en Connecticut''.'
- id: 60
  category: license_system
  question: Después de calificar para una licencia de conducir en el DMV, ¿cuánto
    tiempo suele tardar en llegar la tarjeta de licencia permanente por correo?
  choices:
    A: En un plazo de 10 días
    B: En un plazo de 20 días
    C: En un plazo de 30 días
    D: En un plazo de 60 días
  answer: B
  explanation: Según el manual, la tarjeta de licencia permanente llegará por correo
    en un plazo de 20 días.
- id: 61
  category: license_system
  question: ¿Durante los primeros seis meses de tener la licencia, qué pasajeros puede
    transportar un conductor de 16 o 17 años?
  choices:
    A: Cualquier miembro de la familia
    B: Hasta tres amigos
    C: Un instructor de manejo con licencia
    D: Cualquier persona mayor de 18 años
  answer: C
  explanation: Durante los primeros seis meses, los conductores de 16 y 17 años recién
    licenciados no pueden llevar pasajeros, excepto un instructor de manejo con licencia,
    sus padres o tutores legales, o un conductor calificado de al menos 20 años.
- id: 62
  category: license_system
  question: Si un conductor de 16 o 17 años transporta a un pasajero de 20 años durante
    sus primeros seis meses de licencia, ¿qué requisito debe cumplir el pasajero?
  choices:
    A: Debe ser un miembro de la familia inmediata.
    B: Debe haber tenido una licencia durante al menos cuatro años consecutivos sin
      suspensiones en ese tiempo.
    C: Debe ser un instructor de manejo certificado.
    D: Debe ser el dueño del vehículo que se conduce.
  answer: B
  explanation: El manual establece que el pasajero debe tener al menos 20 años, haber
    tenido una licencia de conducir durante cuatro o más años consecutivos y no haber
    tenido suspensiones de licencia durante los cuatro años anteriores al transporte.
- id: 63
  category: license_system
  question: ¿Durante los segundos seis meses de licencia (meses siete al doce), quiénes
    son los únicos pasajeros adicionales permitidos en el vehículo de un conductor
    de 16 o 17 años?
  choices:
    A: Miembros de la familia inmediata del conductor
    B: Amigos que también tengan licencia de conducir
    C: Compañeros de trabajo que viajen al mismo empleo
    D: Cualquier persona mayor de 21 años
  answer: A
  explanation: Durante los segundos seis meses (meses siete al doce), los únicos pasajeros
    adicionales permitidos en el vehículo son los miembros de la familia inmediata
    del conductor.
- id: 64
  category: safe_driving_rules
  question: ¿Cuáles son las restricciones de horario estándar (toque de queda) para
    los conductores de 16 y 17 años?
  choices:
    A: 9 p.m. a 6 a.m.
    B: 10 p.m. a 5 a.m.
    C: 11 p.m. a 5 a.m.
    D: Medianoche a 6 a.m.
  answer: C
  explanation: El toque de queda para los conductores de 16 y 17 años es de 11 p.m.
    a 5 a.m., a menos que se aplique una excepción específica.
- id: 65
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción válida a las restricciones del
    toque de queda para un conductor de 16 o 17 años?
  choices:
    A: Viajar a la casa de un amigo
    B: Viajar por motivos de empleo o escuela
    C: Ir a una película nocturna
    D: Hacer mandados para uno de los padres
  answer: B
  explanation: El toque de queda no se aplica si el adolescente viaja por empleo,
    escuela, actividades religiosas, necesidad médica o si es un conductor asignado
    en el Programa de Viaje Seguro (Safe Ride Program).
- id: 66
  category: driver_responsibility
  question: ¿Cuál es la regla con respecto al uso del teléfono celular para los conductores
    con licencia de 16 y 17 años?
  choices:
    A: Pueden usar un teléfono celular solo si es manos libres.
    B: Pueden usar un teléfono celular solo para fines de GPS.
    C: NO pueden usar un teléfono celular ni un dispositivo electrónico móvil mientras
      conducen.
    D: Pueden usar un teléfono celular solo cuando están detenidos en un semáforo
      en rojo.
  answer: C
  explanation: Los titulares de permisos de aprendizaje y los conductores con licencia
    de 16 y 17 años NO pueden usar un teléfono celular (incluso si es manos libres)
    ni ningún dispositivo electrónico móvil mientras conducen.
- id: 67
  category: license_system
  question: ¿Cuánto tiempo debe esperar un joven de 16 o 17 años después de la emisión
    de un endoso de motocicleta antes de poder transportar a cualquier pasajero en
    una motocicleta?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Los conductores con licencia de 16 y 17 años NO pueden transportar
    a ningún pasajero en una motocicleta durante los seis meses posteriores a la emisión
    de un endoso de motocicleta.
- id: 68
  category: license_system
  question: ¿Cuál es la tarifa para registrarse como donante de órganos y tejidos
    al obtener o renovar su licencia?
  choices:
    A: $10.00
    B: $15.00
    C: $30.00
    D: No hay tarifa
  answer: D
  explanation: 'El manual establece: ''Para que lo sepa, no hay tarifa para registrarse
    como donante de órganos y tejidos''.'
- id: 69
  category: license_system
  question: Cuando solicita el registro de votantes a través del DMV, ¿aproximadamente
    cuánto tiempo tardará en recibir un aviso de confirmación del registrador de votantes?
  choices:
    A: 1 semana
    B: 2 semanas
    C: 3 semanas
    D: 4 semanas
  answer: C
  explanation: Debería recibir un aviso de confirmación en aproximadamente tres (3)
    semanas por parte del registrador de votantes de su ciudad o pueblo de residencia.
- id: 70
  category: license_system
  question: Si a un conductor se le emite una licencia limitada con restricción de
    luz diurna, ¿cuándo se le permite conducir?
  choices:
    A: Desde el amanecer hasta el atardecer
    B: Comenzando media hora antes del amanecer y terminando media hora después del
      atardecer
    C: Entre las 6 a.m. y las 6 p.m.
    D: Comenzando una hora antes del amanecer y terminando una hora después del atardecer
  answer: B
  explanation: Una licencia limitada puede restringir la operación al período de luz
    diurna que comienza media hora antes del amanecer y termina media hora después
    del atardecer.
- id: 71
  category: vehicle_information
  question: ¿Una licencia limitada puede requerir que un vehículo esté equipado con
    espejos exteriores que reflejen una vista de la carretera al menos a qué distancia
    hacia atrás?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Una licencia limitada puede requerir espejos exteriores ubicados tanto
    en el lado izquierdo como en el derecho del vehículo para reflejar una vista de
    la carretera al menos 200 pies hacia atrás.
- id: 72
  category: vehicle_information
  question: ¿Qué podría indicar si su vehículo se jala hacia un lado cuando se aplica
    el freno?
  choices:
    A: Sus neumáticos están demasiado inflados.
    B: Hay un problema en el sistema de frenos.
    C: El líquido de la dirección está bajo.
    D: Sus faros están desalineados.
  answer: B
  explanation: Si el vehículo se jala hacia un lado cuando se aplica el freno, esto
    indicaría un problema en el sistema de frenos y que debe recibir mantenimiento.
- id: 73
  category: vehicle_information
  question: ¿Cuál es una consecuencia de conducir con neumáticos desequilibrados y
    baja presión de aire?
  choices:
    A: Mejor economía de combustible
    B: Desgaste más rápido de los neumáticos y menor economía de combustible
    C: Dirección y frenado más fáciles
    D: Menor distancia de frenado
  answer: B
  explanation: Los neumáticos desequilibrados y la baja presión causan un desgaste
    más rápido de los neumáticos, reducen la economía de combustible y hacen que el
    vehículo sea más difícil de dirigir y detener.
- id: 74
  category: vehicle_information
  question: ¿Por qué es importante reemplazar un parabrisas dañado?
  choices:
    A: Causará que los limpiaparabrisas funcionen mal.
    B: Puede romperse muy fácilmente en una colisión menor o cuando algo lo golpea.
    C: Reduce la eficiencia del combustible del vehículo.
    D: Hace que el vehículo se jale hacia un lado.
  answer: B
  explanation: El vidrio dañado puede romperse muy fácilmente en una colisión menor
    o cuando algo golpea el parabrisas. Reemplace el parabrisas si está dañado.
- id: 75
  category: vehicle_information
  question: ¿Cómo puede verificar si sus neumáticos tienen una cantidad segura de
    banda de rodadura usando la 'prueba del centavo'?
  choices:
    A: Si la cabeza de Lincoln es completamente visible sobre la banda de rodadura.
    B: Si alguna parte de la cabeza de Lincoln está cubierta por la banda de rodadura.
    C: Si el centavo cae completamente en la ranura.
    D: Si la banda de rodadura toca el borde inferior del centavo.
  answer: B
  explanation: Según el manual, al usar la prueba del centavo, si alguna parte de
    la cabeza de Lincoln está cubierta por la banda de rodadura, usted está conduciendo
    con una cantidad segura de banda de rodadura.
- id: 76
  category: vehicle_information
  question: Si su vehículo no pasa una inspección de emisiones, ¿cuánto tiempo tiene
    para solucionar el problema y volver a revisarlo?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: El manual establece que si el vehículo no pasa la inspección de emisiones,
    se le darán 60 días para que se solucione el problema y se vuelvan a revisar las
    emisiones.
- id: 77
  category: safe_driving_rules
  question: ¿Por qué es peligroso dejar el motor de su vehículo encendido en un garaje
    cerrado?
  choices:
    A: Agotará rápidamente la batería del vehículo.
    B: Puede causar que el motor se sobrecaliente y se incendie.
    C: Los gases de un escape con fugas pueden causar la muerte en muy poco tiempo.
    D: Hará que el sistema de suspensión se desgaste más rápido.
  answer: C
  explanation: El manual advierte que los gases de un escape con fugas pueden causar
    la muerte dentro de un vehículo en muy poco tiempo, y nunca debe encender el motor
    en un garaje cerrado.
- id: 78
  category: vehicle_information
  question: ¿Cuál es una buena regla general para ajustar sus espejos laterales?
  choices:
    A: Debe ver todo el costado de su vehículo mientras está sentado normalmente.
    B: Debe ajustarlos de modo que, al inclinarse ligeramente hacia adelante, pueda
      ver el costado de su vehículo.
    C: Debe inclinarlos hacia abajo para ver claramente los neumáticos traseros.
    D: Debe ajustarlos hacia afuera para eliminar por completo el punto ciego.
  answer: B
  explanation: Un buen ajuste para los espejos laterales es colocarlos de modo que,
    al inclinarse ligeramente hacia adelante, pueda ver el costado de su vehículo.
- id: 79
  category: penalties_and_points
  question: En Connecticut, ¿cuál es la multa si un conductor o pasajero no usa el
    cinturón de seguridad?
  choices:
    A: $50
    B: $75
    C: $100
    D: $150
  answer: B
  explanation: Si el conductor o el pasajero no usan el cinturón de seguridad, cada
    uno podría ser citado por una infracción del cinturón de seguridad y multado con
    $75.
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es el requisito de sujeción infantil para un niño menor de 2 años
    o que pese menos de 30 libras?
  choices:
    A: Un asiento de seguridad orientado hacia adelante con un arnés de 5 puntos.
    B: Un asiento elevado (booster seat) asegurado con un cinturón de seguridad estándar.
    C: Un asiento de automóvil orientado solo hacia atrás o un asiento convertible
      orientado hacia atrás con un arnés de 5 puntos.
    D: Cualquier sistema de sujeción infantil colocado en el asiento del pasajero
      delantero.
  answer: C
  explanation: La ley estatal exige que los niños menores de 2 años, o que pesen menos
    de 30 libras, viajen en un asiento de automóvil orientado solo hacia atrás o en
    un asiento convertible orientado hacia atrás con un arnés de 5 puntos.
- id: 81
  category: safe_driving_rules
  question: Si la edad y el peso de un niño entran en dos categorías diferentes de
    requisitos de sujeción, ¿qué regla se aplica?
  choices:
    A: Se aplica el requisito menos restrictivo.
    B: Se aplica el requisito más restrictivo.
    C: Siempre se aplica el requisito basado en el peso.
    D: Siempre se aplica el requisito basado en la edad.
  answer: B
  explanation: Si la edad y el peso de un niño entran en dos categorías diferentes,
    el manual establece que se aplica el requisito más restrictivo.
- id: 82
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los cinturones
    de seguridad y los choques?
  choices:
    A: Es mejor ser expulsado fuera del choque.
    B: Más de la mitad de todas las muertes por accidentes de tráfico ocurren a menos
      de 25 millas de casa.
    C: Usted puede prepararse fácilmente para un choque frontal a 25 mph.
    D: Si lo golpean de lado, se deslizará lejos del punto del choque.
  answer: B
  explanation: Al abordar conceptos erróneos sobre los cinturones de seguridad, el
    manual señala que más de la mitad de todas las muertes por accidentes de tráfico
    ocurren a menos de 25 millas de casa.
- id: 83
  category: safe_driving_rules
  question: Según la ley estatal de Connecticut, ¿es necesario usar el cinturón de
    seguridad si su vehículo está equipado con bolsas de aire (airbags)?
  choices:
    A: No, las bolsas de aire brindan protección suficiente en todo tipo de choques.
    B: Sí, porque las bolsas de aire no lo protegen si lo golpean de lado, por detrás
      o si el vehículo vuelca.
    C: No, a menos que esté conduciendo por la autopista a altas velocidades.
    D: Sí, pero solo se requiere el cinturón de regazo cuando hay bolsas de aire presentes.
  answer: B
  explanation: La ley estatal exige el uso de cinturones de seguridad incluso con
    bolsas de aire, porque estas no lo protegen si lo golpean de lado o por detrás,
    o si el vehículo vuelca.
- id: 84
  category: vehicle_information
  question: ¿Dónde puede encontrar la presión recomendada de los neumáticos (psi)
    para su vehículo?
  choices:
    A: En el flanco (pared lateral) del propio neumático.
    B: En el manual del propietario del vehículo o en el marco de la puerta del lado
      del conductor.
    C: En la tarjeta de registro del vehículo.
    D: En el panel de instrumentos del tablero.
  answer: B
  explanation: Puede verificar la presión de los neumáticos utilizando los psi recomendados
    que se encuentran en el manual del propietario del vehículo o en el marco de la
    puerta del lado del conductor del vehículo.
- id: 85
  category: safe_driving_rules
  question: ¿Por qué es importante asegurarse de que no haya objetos sueltos en el
    piso de su vehículo?
  choices:
    A: Pueden reducir el ahorro general de combustible del vehículo.
    B: Pueden rodar debajo del pedal del freno y evitar que detenga el vehículo.
    C: Pueden interferir con el sistema de suspensión del vehículo.
    D: Pueden hacer que el volante vibre a altas velocidades.
  answer: B
  explanation: Asegúrese de que no haya objetos en el piso que puedan rodar debajo
    del pedal del freno y evitar que detenga el vehículo.
- id: 86
  category: safe_driving_rules
  question: Según la ley de Connecticut, ¿dónde está prohibido colocar un sistema
    de sujeción para niños orientado hacia atrás?
  choices:
    A: En el asiento trasero detrás del conductor.
    B: En el medio del asiento trasero.
    C: En el asiento delantero de un vehículo con una bolsa de aire (airbag) del lado
      del pasajero funcional.
    D: En cualquier vehículo que no tenga bolsas de aire de cortina lateral.
  answer: C
  explanation: La ley prohíbe la colocación de un sistema de sujeción para niños orientado
    hacia atrás en el asiento delantero de un vehículo con una bolsa de aire del lado
    del pasajero funcional.
- id: 87
  category: defensive_driving
  question: Además de protegerlo de lesiones, ¿de qué otra manera le ayudan los cinturones
    de seguridad como conductor?
  choices:
    A: Mejoran la eficiencia de combustible de su vehículo.
    B: Le ayudan a mantener el control del vehículo si lo golpean de lado.
    C: Evitan que el vehículo experimente hidroplaneo (hydroplaning) en carreteras
      mojadas.
    D: Reducen el desgaste de su sistema de suspensión.
  answer: B
  explanation: Además de protegerse de lesiones, los cinturones de seguridad le ayudan
    a mantener el control del vehículo. Si lo golpean de lado, la fuerza podría empujarlo
    lateralmente y no podrá maniobrar si no está detrás del volante.
- id: 88
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el uso adecuado de la bocina (claxon) de su
    vehículo?
  choices:
    A: Para saludar a otros conductores o peatones en la carretera.
    B: Para expresar frustración en el tráfico pesado.
    C: Solo debe usarse como advertencia para los demás.
    D: Para indicar que está a punto de estacionar su vehículo.
  answer: C
  explanation: La bocina puede no parecer importante para la seguridad, pero podría
    salvarle la vida como dispositivo de advertencia. Use su bocina solo como advertencia
    para los demás.
- id: 89
  category: vehicle_information
  question: ¿Cuál es una consecuencia potencial de conducir con neumáticos desgastados
    o lisos?
  choices:
    A: Aumento de la distancia de frenado y mayor efecto de hidroplaneo (hydroplaning).
    B: Disminución de la distancia de frenado y mejor ahorro de combustible.
    C: Menor probabilidad de tener un neumático desinflado.
    D: Giros más fáciles cuando la carretera está mojada.
  answer: A
  explanation: Los neumáticos desgastados o lisos pueden aumentar su distancia de
    frenado, dificultar los giros cuando está mojado, aumentar el efecto de hidroplaneo
    y aumentar la probabilidad de tener un neumático desinflado.
- id: 90
  category: defensive_driving
  question: Cuando un vehículo es golpeado de lado, ¿en qué dirección se deslizarán
    los objetos y pasajeros que no estén sujetos?
  choices:
    A: Lejos del punto del choque
    B: Hacia el punto del choque
    C: Hacia el parabrisas delantero
    D: Permanecerán inmóviles
  answer: B
  explanation: Según el manual, cuando un vehículo es golpeado de lado, todo lo que
    no esté sujeto dentro del vehículo se deslizará hacia el punto del choque, no
    lejos de él.
- id: 91
  category: safe_driving_rules
  question: 'La fuerza de un choque frontal a 25 mph es equivalente a:'
  choices:
    A: Caerse de una bicicleta a baja velocidad
    B: Saltar de un vehículo en movimiento a 10 mph
    C: Lanzarse desde un edificio de tres pisos hacia la acera
    D: Chocar contra una pared de ladrillos a 50 mph
  answer: C
  explanation: El manual establece que incluso a 25 mph, la fuerza de un choque frontal
    es la misma que la de pedalear una bicicleta a toda velocidad contra una pared
    de ladrillos o lanzarse desde un edificio de tres pisos hacia la acera.
- id: 92
  category: driver_responsibility
  question: ¿Se les permite a los conductores de 16 o 17 años usar un dispositivo
    electrónico móvil de manos libres mientras conducen?
  choices:
    A: Sí, los dispositivos de manos libres están permitidos para todas las edades.
    B: Sí, pero solo si están llamando a un padre o tutor.
    C: No, a menos que estén detenidos temporalmente en un semáforo en rojo.
    D: No, no se les permite usar ningún tipo de teléfono celular o dispositivo electrónico
      móvil.
  answer: D
  explanation: El manual establece explícitamente que a los conductores de 16 o 17
    años de edad no se les permite usar ningún tipo de teléfono celular o dispositivo
    electrónico móvil, incluyendo dispositivos de manos libres.
- id: 93
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia puede un conductor de cualquier edad usar un teléfono
    celular o dispositivo electrónico móvil mientras conduce?
  choices:
    A: Cuando está detenido en tráfico pesado
    B: En una situación de emergencia para contactar a un operador de respuesta a
      emergencias
    C: Al consultar las direcciones del GPS
    D: Cuando está detenido en una señal de control de tráfico
  answer: B
  explanation: La excepción al requisito del teléfono celular para un conductor de
    cualquier edad es una situación de emergencia, al contactar a un operador de respuesta
    a emergencias, un hospital, un consultorio médico, una clínica de salud, una compañía
    de ambulancias o el departamento de bomberos/policía.
- id: 94
  category: penalties_and_points
  question: ¿Cuál es la sanción para un operador menor de 18 años que es condenado
    por violar la ley de teléfonos celulares?
  choices:
    A: Una advertencia por escrito por la primera infracción
    B: Solo una multa de $500
    C: Una suspensión de la licencia y una infracción de tránsito (moving violation)
    D: Inmovilización inmediata del vehículo
  answer: C
  explanation: Cualquier joven de 16 o 17 años que sea sorprendido violando la ley
    de teléfonos celulares de Connecticut será acusado de una infracción de tránsito
    (moving violation), y una condena resultará en la suspensión de la licencia.
- id: 95
  category: penalties_and_points
  question: ¿Qué sucederá si el propietario de un vehículo registrado no responde
    a un aviso de advertencia del DMV sobre la falta de cobertura de seguro?
  choices:
    A: La licencia de conducir será revocada permanentemente.
    B: El registro del vehículo será suspendido.
    C: El propietario deberá volver a realizar el examen de conducir.
    D: El vehículo será remolcado a expensas del propietario.
  answer: B
  explanation: No responder al aviso de advertencia sobre la cancelación del seguro
    resultará en la suspensión del registro.
- id: 96
  category: vehicle_information
  question: 'Antes de arrancar un vehículo con transmisión automática, el selector
    de cambios debe colocarse en:'
  choices:
    A: Neutral
    B: Drive
    C: Primera marcha
    D: Park
  answer: D
  explanation: Para un vehículo que tiene transmisión automática, debe colocar el
    selector de cambios en 'park' (estacionamiento) antes de arrancar el vehículo.
- id: 97
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada de las manos en el volante?
  choices:
    A: Mano izquierda entre las 8 y las 10 en punto y mano derecha entre las 2 y las
      4 en punto
    B: Mano izquierda a las 7 en punto y mano derecha a las 5 en punto
    C: Ambas manos en la posición de las 12 en punto
    D: Mano izquierda a las 9 en punto y mano derecha a las 12 en punto
  answer: A
  explanation: 'Ambas manos deben colocarse en lados opuestos del volante: la mano
    izquierda entre las 8 y las 10 en punto y la mano derecha entre las 2 y las 4
    en punto.'
- id: 98
  category: vehicle_information
  question: Al usar el método de dirección de empujar/tirar (Push/Pull), ¿cuál de
    las siguientes afirmaciones es verdadera?
  choices:
    A: Las manos se cruzan entre sí en la posición de las 12 en punto.
    B: Los nudillos del conductor deben estar orientados hacia adentro.
    C: Las dos manos nunca se cruzarán y permanecerán en el volante en todo momento.
    D: Se permite que el volante se deslice libremente entre los dedos.
  answer: C
  explanation: En el método de empujar/tirar (Push/Pull), si se hace correctamente,
    las dos manos nunca se cruzarán y permanecerán en el volante en todo momento.
- id: 99
  category: defensive_driving
  question: Para conducir de manera segura y evitar frenazos de último momento, ¿los
    conductores más seguros tienden a mirar al menos a qué distancia por delante de
    sus vehículos?
  choices:
    A: 3 segundos adelante
    B: 5 segundos adelante
    C: 12 segundos adelante
    D: 20 segundos adelante
  answer: C
  explanation: Los conductores más seguros tienden a mirar al menos 12 segundos por
    delante de sus vehículos para evitar frenar o girar en el último momento.
- id: 100
  category: defensive_driving
  question: 'Al conducir en la autopista, mirar 12 segundos adelante equivale a una
    distancia de aproximadamente:'
  choices:
    A: Una cuadra de la ciudad
    B: Cuatro cuadras de la ciudad o un cuarto de milla
    C: Una milla
    D: La longitud de dos autos
  answer: B
  explanation: En la autopista, 12 segundos son aproximadamente cuatro cuadras de
    la ciudad (o un cuarto de milla).
- id: 101
  category: defensive_driving
  question: ¿Cuándo es especialmente importante mirar detrás de su vehículo?
  choices:
    A: Al cambiar de carril, reducir la velocidad, dar marcha atrás o conducir por
      una colina larga o empinada
    B: Solo cuando se está estacionando en paralelo
    C: Cuando está acelerando en una rampa de entrada a la autopista
    D: Cuando está detenido en un semáforo en rojo
  answer: A
  explanation: El manual establece que es muy importante buscar vehículos detrás de
    usted cuando cambia de carril, reduce la velocidad, da marcha atrás o conduce
    por una colina larga o empinada.
- id: 102
  category: sharing_the_road
  question: Antes de girar a la izquierda a través del tráfico en una intersección,
    ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo que gira tiene el derecho de paso.
    B: El tráfico que viene en sentido contrario, incluidas las bicicletas, siempre
      tiene el derecho de paso.
    C: Los peatones deben ceder el paso al vehículo que gira.
    D: El vehículo que llegó último a la intersección tiene el derecho de paso.
  answer: B
  explanation: Antes de girar a la izquierda a través del tráfico, recuerde que el
    tráfico que viene en sentido contrario, incluidas las bicicletas, siempre tiene
    el derecho de paso.
- id: 103
  category: sharing_the_road
  question: Al prepararse para girar a la derecha, ¿qué debe hacer si acaba de pasar
    a una bicicleta?
  choices:
    A: Toque la bocina y gire inmediatamente.
    B: Gire inmediatamente si la bicicleta se mueve lentamente.
    C: No gire inmediatamente después de pasar a una bicicleta.
    D: Asuma que la bicicleta cederá el paso a su vehículo que gira.
  answer: C
  explanation: 'El manual advierte explícitamente: ''No gire inmediatamente después
    de pasar a una bicicleta''.'
- id: 104
  category: defensive_driving
  question: ¿Por qué no debe confiar únicamente en las señales de tráfico o semáforos
    en una intersección?
  choices:
    A: Porque las señales de tráfico garantizan que los peatones no cruzarán.
    B: Porque puede asumir que nadie cruzará frente a usted si tiene luz verde.
    C: Porque algunos conductores no obedecen las señales de tráfico o semáforos,
      por lo que debe mirar a la izquierda y a la derecha incluso con luz verde.
    D: Porque las señales de tráfico son solo sugerencias.
  answer: C
  explanation: No confíe en que las señales de tráfico o semáforos le indiquen que
    nadie cruzará frente a usted, porque algunos conductores no los obedecen. Debe
    mirar a la izquierda y a la derecha en una intersección, incluso si el resto del
    tráfico tiene una luz roja o una señal de alto.
- id: 105
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a una intersección con un semáforo que
    no funciona?
  choices:
    A: Cruzar la intersección sin detenerse si el camino está despejado.
    B: Detenerse como si la intersección estuviera controlada por una señal de alto
      (stop).
    C: Ceder el paso al vehículo a su izquierda y proceder con precaución.
    D: Tratar la intersección como una señal de ceda el paso y reducir la velocidad.
  answer: B
  explanation: La ley estatal exige que un conductor en una intersección con un semáforo
    que no funciona se detenga como si la intersección estuviera controlada por una
    señal de alto (stop).
- id: 106
  category: defensive_driving
  question: ¿A qué se refiere el término 'bloquear el cuadro' (blocking the box) en
    condiciones de tráfico intenso?
  choices:
    A: Estacionar su vehículo en una zona de carga designada.
    B: Detenerse en un cruce de peatones mientras espera a un peatón.
    C: Entrar en una intersección sin espacio suficiente en el lado opuesto para acomodar
      su vehículo.
    D: Conducir demasiado cerca de un camión comercial grande.
  answer: C
  explanation: Durante el tráfico intenso, se prohíbe a los conductores entrar en
    cualquier intersección a menos que haya espacio suficiente en el lado opuesto
    para acomodar su vehículo. Esto se conoce comúnmente como 'bloquear el cuadro'
    (blocking the box) o causar un 'embotellamiento' (gridlock).
- id: 107
  category: defensive_driving
  question: Si está detenido en una intersección y su visión de la calle transversal
    está bloqueada, ¿cuál es la acción más segura?
  choices:
    A: Acelerar rápidamente para despejar la intersección lo más rápido posible.
    B: Tocar la bocina para advertir al tráfico que cruza antes de avanzar.
    C: Esperar a que el vehículo de atrás toque la bocina antes de moverse.
    D: Avanzar lentamente poco a poco hasta que pueda ver claramente el tráfico que
      cruza.
  answer: D
  explanation: Si está detenido y su visión de una calle transversal está bloqueada,
    avance lentamente poco a poco hasta que pueda ver. Esto permite que los conductores
    que cruzan vean la parte delantera de su vehículo y reduzcan la velocidad si es
    necesario.
- id: 108
  category: defensive_driving
  question: ¿Cuál es una de las principales causas de muertes en los cruces ferroviarios?
  choices:
    A: Asumir que no viene ningún tren.
    B: Conducir sobre las vías demasiado lento.
    C: No bajar las ventanillas para escuchar si viene un tren.
    D: Detenerse demasiado lejos de las vías del tren.
  answer: A
  explanation: Incluso si nunca antes ha visto un tren en ese cruce, no asuma que
    no viene ninguno. Asumir que no viene un tren es una de las principales causas
    de muertes en los cruces ferroviarios.
- id: 109
  category: defensive_driving
  question: En un cruce ferroviario con más de una vía, ¿por qué debe esperar hasta
    que el tren que pasa esté bien alejado antes de cruzar?
  choices:
    A: Para permitir que las barreras del cruce se restablezcan por completo.
    B: Porque el tren que acaba de pasar puede ocultar a otro tren que se aproxima.
    C: Para asegurarse de que los neumáticos de su vehículo no se atasquen en las
      vías.
    D: Porque es ilegal cruzar dentro de los 30 segundos posteriores al paso de un
      tren.
  answer: B
  explanation: En los cruces con más de una vía, espere hasta que el tren que pasa
    esté bien alejado de la vía antes de comenzar a cruzar. El tren que acaba de pasar
    puede ocultar a otro que se aproxima.
- id: 110
  category: signs_and_signals
  question: ¿De qué color son todas las señales temporales en las zonas de obras?
  choices:
    A: Fondo amarillo con letras negras
    B: Fondo naranja con letras o símbolos negros
    C: Fondo blanco con letras rojas
    D: Fondo verde fluorescente con símbolos negros
  answer: B
  explanation: Todas las señales temporales en las zonas de obras tienen un fondo
    naranja y letras o símbolos negros.
- id: 111
  category: penalties_and_points
  question: ¿En Connecticut, cuál es la multa máxima que un conductor podría enfrentar
    por poner en peligro a un trabajador vial dentro de una zona de obras?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $5,000
  answer: C
  explanation: En Connecticut, cualquier persona condenada por exceso de velocidad,
    desobedecer dispositivos de control de tráfico, usar un carril inadecuado o poner
    en peligro a un trabajador vial dentro de una zona de obras podría enfrentar multas
    de hasta $1,000.
- id: 112
  category: penalties_and_points
  question: ¿Cuál es la sanción por usar ilegalmente un teléfono celular de mano mientras
    se conduce en una zona de obras?
  choices:
    A: La licencia del conductor se suspende inmediatamente por 30 días.
    B: Las multas por conducción distraída se duplican.
    C: El conductor debe realizar 50 horas de servicio comunitario.
    D: El vehículo es confiscado por 48 horas.
  answer: B
  explanation: Las multas por conducción distraída se duplican para cualquier persona
    condenada por usar ilegalmente un teléfono celular de mano o un dispositivo electrónico
    móvil mientras conduce en una zona de obras.
- id: 113
  category: safe_driving_rules
  question: Al acercarse a una zona de obras, ¿cuándo debe un automovilista incorporarse
    al carril correspondiente?
  choices:
    A: Justo antes de que termine el carril para maximizar el flujo de tráfico.
    B: Solo cuando lo indique un señalizador (flagger).
    C: Tan pronto como sea posible al notar por primera vez una zona de obras próxima.
    D: Después de pasar la primera señal naranja de advertencia.
  answer: C
  explanation: Incorpórese tan pronto como sea posible. Los automovilistas pueden
    ayudar a mantener el flujo de tráfico y las velocidades establecidas al moverse
    al carril correspondiente al notar por primera vez una zona de obras próxima.
- id: 114
  category: sharing_the_road
  question: Según la Ley de Usuarios Vulnerables de Connecticut, ¿cuánta distancia
    deben dejar los conductores al rebasar a un usuario vulnerable?
  choices:
    A: Al menos dos pies
    B: Al menos tres pies
    C: Al menos cuatro pies
    D: Al menos cinco pies
  answer: B
  explanation: Los conductores deben dejar tres pies de distancia al rebasar a usuarios
    vulnerables, quienes corren un mayor riesgo de sufrir lesiones graves o la muerte.
- id: 115
  category: sharing_the_road
  question: ¿Cuál de los siguientes se considera un 'usuario vulnerable' según la
    ley de Connecticut?
  choices:
    A: Un pasajero en un autobús comercial
    B: Un conductor de un vehículo de emergencia
    C: Una persona que conduce un camión de basura
    D: Un conductor de un automóvil de pasajeros
  answer: C
  explanation: Los usuarios vulnerables incluyen peatones, ciclistas, usuarios de
    sillas de ruedas, personas que montan o conducen un animal, trabajadores viales,
    camiones de basura, vehículos cisterna, vehículos autorizados por el gobierno
    de los EE. UU. para transportar correo y transportistas de entrega urgente.
- id: 116
  category: sharing_the_road
  question: ¿Qué debe hacer cuando ve o escucha un vehículo de emergencia que se aproxima
    desde cualquier dirección con sirenas o luces intermitentes?
  choices:
    A: Acelerar para salir del camino del vehículo de emergencia.
    B: Orillarse al borde izquierdo de la carretera y detenerse.
    C: Orillarse al borde derecho de la carretera, o lo más cerca posible de la derecha,
      y detenerse.
    D: Reducir la velocidad y encender las luces de emergencia, pero seguir moviéndose.
  answer: C
  explanation: Cuando vea o escuche un vehículo de emergencia que se aproxima desde
    cualquier dirección, debe orillarse al borde derecho de la carretera, o lo más
    cerca posible de la derecha, y detener su vehículo.
- id: 117
  category: safe_driving_rules
  question: De acuerdo con la 'Ley de Moverse a un Lado' (Move Over Law), ¿qué debe
    hacer un conductor al acercarse a cualquier vehículo detenido en una autopista?
  choices:
    A: Mantener la velocidad pero cambiarse de carril.
    B: Reducir la velocidad por debajo del límite de velocidad establecido y cambiarse
      a un carril siempre que sea seguro hacerlo.
    C: Detenerse por completo y esperar a que el vehículo detenido se reincorpore
      al tráfico.
    D: Tocar la bocina para alertar al vehículo detenido de su presencia.
  answer: B
  explanation: Cuando cualquier vehículo está detenido en cualquier parte de una autopista
    o carretera, los conductores deben REDUCIR LA VELOCIDAD (por debajo del límite
    de velocidad establecido) y mover su vehículo un carril siempre que sea seguro
    hacerlo.
- id: 118
  category: sharing_the_road
  question: ¿Cómo puede un conductor determinar la ubicación de un paso de peatones
    no marcado en una intersección?
  choices:
    A: Buscar una señal de cruce de peatones en el lado derecho de la carretera.
    B: Imaginar que la acera o el arcén en la esquina se extiende a través de la carretera
      y se une con la acera o el arcén del otro lado.
    C: Medir 10 pies desde la línea de parada en la intersección.
    D: Los pasos de peatones no marcados solo existen donde hay un semáforo.
  answer: B
  explanation: Para determinar dónde hay un paso de peatones no marcado, imagine que
    la acera o el arcén en la esquina se extiende a través de la carretera y se une
    con la acera o el arcén del otro lado.
- id: 119
  category: sharing_the_road
  question: Un conductor debe reducir la velocidad o detenerse y ceder el derecho
    de paso a un peatón cuando el peatón hace ¿cuál de las siguientes acciones?
  choices:
    A: Hace contacto visual con el conductor desde la acera.
    B: Se para en la acera mirando su teléfono celular.
    C: Indica su intención de cruzar moviendo una extensión de una parte del cuerpo,
      como un bastón o un perro con correa, hacia la entrada del paso de peatones.
    D: Espera en una parada de autobús cerca de la intersección.
  answer: C
  explanation: Los conductores deben ceder el derecho de paso cuando un peatón indica
    su intención de cruzar la calle moviendo hacia la entrada del paso de peatones
    cualquier parte del cuerpo o cualquier extensión de una parte del cuerpo, incluyendo
    una silla de ruedas, bastón, vara, muleta, bicicleta, bicicleta eléctrica, cochecito,
    carruaje, carrito o un perro con correa o arnés.
- id: 120
  category: sharing_the_road
  question: ¿Cómo podría un peatón indicar su intención de cruzar la calle en un paso
    de peatones?
  choices:
    A: Agitando una bandera de colores brillantes al tráfico que se aproxima.
    B: Acercándose al bordillo y levantando la mano y el brazo hacia el tráfico que
      se aproxima.
    C: Haciendo contacto visual con el conductor durante al menos tres segundos.
    D: Quedándose completamente quieto en el borde del bordillo.
  answer: B
  explanation: Según el manual, un peatón indica su intención de cruzar acercándose
    al bordillo y levantando su mano y brazo hacia el tráfico que se aproxima, o moviendo
    cualquier parte del cuerpo o extensión hacia el paso de peatones.
- id: 121
  category: penalties_and_points
  question: ¿Cuál es una consecuencia de no obedecer el límite de velocidad más bajo
    señalizado en una zona escolar?
  choices:
    A: Estará sujeto a multas
    B: Su vehículo será confiscado de inmediato
    C: Recibirá una advertencia por la primera infracción
    D: Su licencia será revocada permanentemente
  answer: A
  explanation: El manual establece que debe obedecer el límite de velocidad más bajo
    señalizado en las zonas escolares o estará sujeto a multas.
- id: 122
  category: sharing_the_road
  question: Si tiene luz verde en una intersección regulada, pero un peatón ciego
    todavía está cruzando, ¿qué debe hacer?
  choices:
    A: Tocar la bocina para alertarle de la luz verde
    B: Conducir lenta y cuidadosamente alrededor de él
    C: Permanecer detenido hasta que el peatón esté fuera de la vía
    D: Avanzar por la intersección ya que usted tiene el derecho de paso
  answer: C
  explanation: El manual especifica que en las intersecciones reguladas, debe permanecer
    detenido hasta que el peatón esté fuera de la vía, incluso si tiene luz verde.
- id: 123
  category: sharing_the_road
  question: Cuando un carril de circulación es demasiado estrecho para que los autos
    y las bicicletas circulen uno al lado del otro, ¿qué se espera que haga el ciclista?
  choices:
    A: Moverse a la acera adyacente
    B: Detenerse y esperar a que pasen los autos
    C: Circular en dirección opuesta al tráfico para aumentar la visibilidad
    D: Ocupar el carril de circulación conduciendo en el centro o cerca del centro
      del carril
  answer: D
  explanation: Cuando un carril es demasiado estrecho para que los autos y las bicicletas
    circulen uno al lado del otro, el ciclista 'ocupará el carril de circulación',
    lo que significa conducir en el centro o cerca del centro del carril.
- id: 124
  category: safe_driving_rules
  question: ¿A qué edad la ley exige que un ciclista use casco?
  choices:
    A: Menores de 12 años de edad
    B: Menores de 16 años de edad
    C: Menores de 18 años de edad
    D: Todos los ciclistas deben usar casco independientemente de su edad
  answer: B
  explanation: Como ciclista, se requiere que use un casco si es menor de 16 años
    de edad.
- id: 125
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor que no cede el derecho de paso a
    un ciclista?
  choices:
    A: Una suspensión obligatoria de la licencia
    B: Las multas se duplican
    C: Se emite una advertencia por escrito
    D: Servicio comunitario obligatorio
  answer: B
  explanation: El manual establece explícitamente que las multas se duplican por no
    ceder el derecho de paso a un ciclista.
- id: 126
  category: safe_driving_rules
  question: Al acercarse y adelantar a un ciclista, ¿cuál es la distancia mínima que
    debe dejar entre su vehículo y la bicicleta?
  choices:
    A: Dos pies
    B: Tres pies
    C: Cuatro pies
    D: Cinco pies
  answer: B
  explanation: Al acercarse o adelantar a un ciclista, reduzca la velocidad y pase
    solo cuando pueda dejar una distancia mínima de tres pies entre su vehículo y
    la bicicleta.
- id: 127
  category: defensive_driving
  question: ¿Por qué debe evitar tocar la bocina cerca de un ciclista a menos que
    tenga una buena razón?
  choices:
    A: Es ilegal usar la bocina en zonas residenciales
    B: Puede asustarlos y hacer que se desvíen hacia su camino y choquen
    C: Hará que el ciclista se detenga inmediatamente en el carril de circulación
    D: Puede dañar la audición del ciclista
  answer: B
  explanation: No toque la bocina cerca de los ciclistas a menos que tenga una buena
    razón, porque tocar la bocina para alertar de su presencia puede asustarlos y
    hacer que se desvíen hacia su camino y choquen.
- id: 128
  category: safe_driving_rules
  question: ¿Se le permite adelantar a un ciclista que circula despacio en una zona
    de no adelantar?
  choices:
    A: Sí, si puede realizar la maniobra de forma segura
    B: Sí, pero solo si el ciclista le indica con la mano que pase
    C: No, está estrictamente prohibido bajo cualquier circunstancia
    D: No, a menos que esté conduciendo un vehículo de emergencia
  answer: A
  explanation: Puede adelantar a vehículos que circulan despacio, incluidos los ciclistas,
    en una zona de no adelantar si puede realizar la maniobra de forma segura.
- id: 129
  category: sharing_the_road
  question: Si está a punto de girar a la derecha y hay un ciclista delante de usted,
    ¿qué debe hacer?
  choices:
    A: Acelerar y adelantar al ciclista inmediatamente antes del giro
    B: Tocar la bocina para que el ciclista se detenga y le deje girar
    C: Reducir la velocidad y dejar que el ciclista despeje la intersección antes
      de realizar su giro
    D: Girar muy cerca detrás del ciclista para ahorrar tiempo
  answer: C
  explanation: Si está a punto de girar a la derecha, no debe adelantar a un ciclista
    inmediatamente antes del giro. Debe reducir la velocidad y dejar que el ciclista
    despeje la intersección antes de realizar su giro.
- id: 130
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones sobre motocicletas que comparten
    un carril de tráfico es verdadera?
  choices:
    A: Un auto y una motocicleta pueden compartir el mismo carril
    B: Dos motocicletas pueden compartir un carril
    C: Las motocicletas no tienen permitido usar un carril de tráfico completo
    D: Puede adelantar a una motocicleta en el mismo carril si hay suficiente espacio
  answer: B
  explanation: Los operadores de motocicletas tienen derecho a usar un carril de tráfico
    completo y dos motocicletas pueden compartir un carril. No adelante a una motocicleta
    en el mismo carril.
- id: 131
  category: defensive_driving
  question: 'Casi el 40 por ciento de los accidentes de motocicleta que involucran
    a otro vehículo motorizado son causados por:'
  choices:
    A: La motocicleta sigue demasiado de cerca al otro vehículo
    B: El otro vehículo gira a la izquierda frente al motociclista
    C: La motocicleta rebasa por el lado derecho
    D: El otro vehículo se detiene demasiado rápido
  answer: B
  explanation: Aproximadamente la mitad de todos los accidentes de motocicleta involucran
    a otro vehículo motorizado, y casi el 40 por ciento fueron causados por el otro
    vehículo girando a la izquierda frente al motociclista.
- id: 132
  category: defensive_driving
  question: ¿Qué debe hacer si ve una motocicleta acercándose con su luz direccional
    parpadeando?
  choices:
    A: Asumir que la motocicleta va a girar y avanzar en su trayectoria
    B: Parpadear sus faros para reconocer la señal
    C: No se interponga frente a la motocicleta hasta que vea que realmente está comenzando
      a girar
    D: Tocar la bocina para recordarle al conductor que apague la señal
  answer: C
  explanation: No asuma que una motocicleta va a girar cuando vea su luz direccional
    parpadeando, ya que es posible que estas no se cancelen automáticamente. No se
    interponga frente a una motocicleta hasta que vea que realmente está comenzando
    a girar.
- id: 133
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada cuando conduce detrás
    de un motociclista en condiciones normales?
  choices:
    A: 1 a 2 segundos
    B: 3 a 4 segundos
    C: 5 a 6 segundos
    D: 7 a 8 segundos
  answer: B
  explanation: Al seguir a un motociclista, permita una distancia de seguimiento de
    3 a 4 segundos o más en condiciones de humedad.
- id: 134
  category: safe_driving_rules
  question: ¿Cuándo se le permite conducir en un carril para bicicletas designado?
  choices:
    A: Cuando se aproxima a un giro
    B: Cuando desea rebasar a un vehículo que circula despacio
    C: Cuando está entrando o saliendo de un callejón o entrada privada
    D: Cuando no hay ciclistas usando el carril en ese momento
  answer: C
  explanation: No se detenga, estacione ni conduzca en un sendero o carril para bicicletas
    designado a menos que esté entrando o saliendo de un callejón o entrada privada,
    realizando tareas oficiales, siguiendo las indicaciones de un oficial de policía
    o si existe una situación de emergencia. Puede cruzar un carril de bicicletas
    para girar, pero no puede conducir en él al aproximarse a un giro.
- id: 135
  category: sharing_the_road
  question: ¿Qué debe hacer con sus faros al acercarse a una motocicleta?
  choices:
    A: Parpadear las luces altas para asegurarse de que lo vean
    B: Mantener las luces altas encendidas para una mejor visibilidad
    C: Bajar siempre la intensidad de sus faros (usar luces bajas)
    D: Apagar sus faros brevemente
  answer: C
  explanation: Siempre debe bajar la intensidad de sus faros al acercarse a una motocicleta
    porque el efecto cegador de las luces altas puede ser mucho más peligroso para
    ellos debido a su vulnerabilidad.
- id: 136
  category: signs_and_signals
  question: ¿Cómo es la calcomanía de un vehículo de movimiento lento?
  choices:
    A: Un cuadrado rojo
    B: Un círculo amarillo
    C: Un triángulo naranja
    D: Un diamante blanco
  answer: C
  explanation: Según el manual, los vehículos de movimiento lento, como los tractores
    agrícolas y los vehículos tirados por animales, deben tener una calcomanía de
    movimiento lento, que es un triángulo naranja, en la parte trasera.
- id: 137
  category: safe_driving_rules
  question: ¿Bajo qué condición permite la ley estatal cruzar una línea amarilla doble
    en una zona de no rebasar?
  choices:
    A: Al rebasar a un vehículo de movimiento lento, un peatón o una bicicleta, siempre
      que pueda ver lo suficientemente adelante para rebasar con seguridad.
    B: Cuando conduce al menos 15 mph por debajo del límite de velocidad.
    C: Cuando llega tarde y el tráfico está congestionado.
    D: Nunca se permite cruzar una línea amarilla doble bajo ninguna circunstancia.
  answer: A
  explanation: La ley estatal permite cruzar una línea amarilla doble en una zona
    de no rebasar para adelantar tráfico lento, peatones, vehículos estacionados,
    animales, bicicletas, ciclomotores y scooters, siempre que pueda ver lo suficientemente
    adelante para completar la maniobra de manera segura.
- id: 138
  category: defensive_driving
  question: ¿Qué regla debe utilizar para determinar si conduce demasiado rápido para
    las condiciones de la carretera?
  choices:
    A: La regla de seguimiento de dos segundos
    B: La regla de parada de tres segundos
    C: La regla de distancia visual de cuatro segundos
    D: La regla de peligro de cinco segundos
  answer: C
  explanation: El manual aconseja utilizar la 'regla de distancia visual de cuatro
    segundos' para saber si conduce demasiado rápido para las condiciones. Si llega
    a un objeto estacionario antes de terminar de contar cuatro segundos, significa
    que va demasiado rápido.
- id: 139
  category: safe_driving_rules
  question: Al acercarse a un camión de helados que muestra luces intermitentes y
    un brazo de señal de alto extendido, ¿a qué distancia debe detenerse?
  choices:
    A: Al menos 5 pies
    B: Al menos 10 pies
    C: Al menos 15 pies
    D: Al menos 25 pies
  answer: B
  explanation: La ley estatal exige que los conductores detengan sus vehículos a una
    distancia mínima de 10 pies de la parte delantera o trasera de un camión de helados
    que muestre luces intermitentes y extienda su brazo de señal de alto.
- id: 140
  category: safe_driving_rules
  question: Después de detenerse ante un camión de helados con luces intermitentes
    y un brazo de alto extendido, ¿a qué velocidad máxima se le permite pasar junto
    a él?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: A
  explanation: Después de detenerse ante un camión de helados, puede pasar junto al
    camión a una velocidad razonable, de hasta 5 mph, y debe ceder el paso a cualquier
    peatón.
- id: 141
  category: sharing_the_road
  question: ¿Qué es ilegal hacer al acercarse o rebasar a un caballo en una vía pública?
  choices:
    A: Reducir su velocidad
    B: Detener su vehículo
    C: Tocar la bocina
    D: Dejar una distancia razonable
  answer: C
  explanation: El manual establece explícitamente que es ilegal tocar la bocina o
    causar ruidos fuertes o inusuales al acercarse o rebasar a un caballo.
- id: 142
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego lateral (No-Zone)
    de un conductor de camión?
  choices:
    A: Está a menos de 50 pies detrás del camión.
    B: No puede ver la cara del conductor en su espejo retrovisor lateral.
    C: El camión viaja a más de 55 mph.
    D: Puede ver los faros del camión en su espejo retrovisor.
  answer: B
  explanation: El manual explica que si no puede ver la cara del conductor del camión
    en su espejo retrovisor lateral, entonces él no puede verlo a usted, lo que significa
    que se encuentra en su punto ciego lateral (No-Zone).
- id: 143
  category: safe_driving_rules
  question: ¿Cuándo es seguro regresar al carril derecho después de rebasar a un camión
    grande?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del camión.
    B: Cuando pueda ver toda la parte delantera del camión en su espejo retrovisor.
    C: Cuando el conductor del camión parpadee sus faros.
    D: Tres segundos después de haber pasado la cabina del camión.
  answer: B
  explanation: Al rebasar un camión, debe ver toda la parte delantera del camión en
    su espejo retrovisor antes de incorporarse delante de él para evitar el punto
    ciego delantero (No-Zone).
- id: 144
  category: vehicle_information
  question: ¿Aproximadamente qué distancia pueden extenderse los puntos ciegos de
    un camión grande detrás del vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: D
  explanation: Los puntos ciegos de un camión pueden extenderse hasta 20 pies delante
    de la cabina y aproximadamente 200 pies detrás del camión.
- id: 145
  category: sharing_the_road
  question: ¿Qué debe hacer si un camión grande está rebasando su vehículo?
  choices:
    A: Acelerar para salir del camino del camión.
    B: Mantener su velocidad y moverse hacia el lado izquierdo de su carril.
    C: Reducir la velocidad ligeramente para acortar el tiempo necesario para que
      el camión pase.
    D: Tocar la bocina para que el conductor sepa que usted está allí.
  answer: C
  explanation: Si un camión lo rebasa, debe ayudar al conductor del camión a pasar
    de manera segura reduciendo ligeramente la velocidad para acortar el tiempo necesario
    para rebasar. Nunca debe acelerar.
- id: 146
  category: safe_driving_rules
  question: ¿Cuál es el intervalo de tiempo mínimo recomendado para seguir a un camión
    grande?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Tres segundos
    D: Cinco segundos
  answer: C
  explanation: El manual establece que nunca debe seguir a un camión a un intervalo
    de tiempo inferior a tres segundos.
- id: 147
  category: safe_driving_rules
  question: ¿Por qué nunca debe usar las luces altas al seguir a un camión por la
    noche?
  choices:
    A: El resplandor en los grandes espejos laterales puede cegar al conductor del
      camión.
    B: Hará que las luces traseras del camión se reflejen hacia usted.
    C: Es ilegal usar luces altas en cualquier carretera de varios carriles.
    D: Agota la batería de su vehículo más rápido.
  answer: A
  explanation: Nunca debe usar las luces altas cuando sigue a un camión por la noche
    porque el resplandor en los grandes espejos laterales puede cegar al conductor
    del camión.
- id: 148
  category: sharing_the_road
  question: En comparación con los automóviles de pasajeros, ¿cuánto tiempo y espacio
    necesitan los camiones grandes y los vehículos recreativos (RV) para detenerse?
  choices:
    A: Aproximadamente la misma cantidad de tiempo y espacio.
    B: Casi el doble de tiempo y espacio.
    C: La mitad del tiempo y espacio debido a los frenos de aire.
    D: El triple de tiempo y espacio.
  answer: B
  explanation: El manual señala que los camiones, autobuses y vehículos recreativos
    (RV) necesitan casi el doble de tiempo y espacio para detenerse que los automóviles.
- id: 149
  category: sharing_the_road
  question: Al detenerse detrás de un camión en una pendiente ascendente, ¿por qué
    debe dejar espacio adicional?
  choices:
    A: El camión puede rodar hacia atrás al arrancar y dañar su vehículo.
    B: Los gases de escape del camión son más pesados en una pendiente.
    C: Necesita espacio para rebasar rápidamente al camión por la derecha.
    D: El conductor del camión necesita espacio adicional para aplicar el freno de
      mano.
  answer: A
  explanation: El manual indica que se debe evitar detenerse demasiado cerca detrás
    de un camión en una pendiente ascendente porque si el camión rueda hacia atrás
    al arrancar, su vehículo podría resultar dañado.
- id: 150
  category: vehicle_information
  question: ¿Cuál es el término utilizado para describir cómo las ruedas traseras
    de un vehículo siguen una trayectoria más corta que las ruedas delanteras durante
    un giro?
  choices:
    A: Sobre-dirección (Over-steering)
    B: Desviación de trayectoria (Off-track)
    C: Deriva de las ruedas traseras
    D: Giro de la cola (Tail-swing)
  answer: B
  explanation: El manual explica que en todos los vehículos, las ruedas traseras siguen
    una trayectoria más corta que las ruedas delanteras, y esto se denomina desviación
    de trayectoria (off-track).
- id: 151
  category: sharing_the_road
  question: ¿Por qué debe resistir la tentación de rebasar por la derecha a un camión
    que se aproxima a una intersección?
  choices:
    A: El conductor del camión podría no escuchar su bocina.
    B: Podría quedar atrapado entre el camión y el bordillo si el camión gira a la
      derecha.
    C: Los camiones están obligados a usar el carril derecho solo para rebasar.
    D: Es ilegal rebasar a cualquier vehículo en una intersección.
  answer: B
  explanation: El manual advierte que se debe evitar rebasar por la derecha a un camión
    que se aproxima a una intersección porque, si el conductor del camión gira a la
    derecha, usted podría quedar atrapado entre el camión y el bordillo.
- id: 152
  category: safe_driving_rules
  question: ¿Qué debe hacer si se encuentra en una rampa de entrada a la autopista
    y tiene que esperar un espacio para incorporarse a la vía?
  choices:
    A: Conducir hasta el final de la rampa y detenerse por completo.
    B: Detenerse inmediatamente al principio de la rampa.
    C: Reducir la velocidad en la rampa para tener espacio para acelerar antes de
      incorporarse.
    D: Conducir por el arcén hasta que se abra un espacio.
  answer: C
  explanation: Si tiene que esperar un espacio para entrar en una vía, debe reducir
    la velocidad en la rampa para tener algo de espacio para acelerar antes de tener
    que incorporarse a la carretera principal.
- id: 153
  category: safe_driving_rules
  question: 'Cada vez que desee incorporarse al tráfico, necesita un espacio de aproximadamente:'
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Six segundos
  answer: C
  explanation: El manual establece que cada vez que desee incorporarse al tráfico,
    necesita un espacio de aproximadamente cuatro segundos.
- id: 154
  category: safe_driving_rules
  question: En una carretera con tres o más carriles que circulan en la misma dirección,
    ¿qué carril debe utilizar si hay mucho tráfico entrando o saliendo?
  choices:
    A: El carril del extremo izquierdo
    B: El carril central de circulación
    C: El carril del extremo derecho
    D: El arcén
  answer: B
  explanation: En una carretera con tres o más carriles que circulan en la misma dirección,
    debe utilizar el carril central de circulación si hay mucho tráfico entrando o
    saliendo.
- id: 155
  category: safe_driving_rules
  question: Al circular por una carretera principal con rampas de salida, ¿cuándo
    debe empezar a reducir la velocidad para salir?
  choices:
    A: Un cuarto de milla antes de la rampa de salida.
    B: Tan pronto como vea la señal de salida.
    C: Solo después de pasar a la rampa de salida.
    D: Mientras todavía se encuentra en el carril derecho de circulación.
  answer: C
  explanation: Si la carretera por la que circula tiene rampas de salida, no reduzca
    la velocidad hasta que se haya desplazado a la rampa de salida.
- id: 156
  category: penalties_and_points
  question: ¿Qué puede suceder si comienza a cruzar una intersección con luz verde
    pero se queda atrapado en medio cuando la luz cambia a rojo debido a vehículos
    que bloquean el paso?
  choices:
    A: Perderá automáticamente su licencia.
    B: Puede recibir una multa por bloquear una intersección.
    C: Debe poner inmediatamente su vehículo en reversa.
    D: Tiene el derecho de paso para despejar la intersección.
  answer: B
  explanation: Incluso si tiene la luz verde, no comience a cruzar la intersección
    si hay vehículos bloqueando su camino. Puede recibir una multa por bloquear una
    intersección.
- id: 157
  category: defensive_driving
  question: ¿Por qué nunca debe asumir que otro conductor girará solo porque su luz
    direccional está encendida?
  choices:
    A: Las luces direccionales suelen ser invisibles bajo la luz solar intensa.
    B: El conductor puede planear girar después de pasarlo a usted o puede haber olvidado
      apagar la señal.
    C: Es ilegal girar si otro vehículo está esperando.
    D: Las luces direccionales solo son obligatorias en las autopistas.
  answer: B
  explanation: No asuma que puede girar solo porque un vehículo que se aproxima tiene
    encendida una luz direccional. El conductor puede planear girar después de pasar
    su vehículo o puede haber olvidado apagar la señal.
- id: 158
  category: safe_driving_rules
  question: ¿Cuál es el método recomendado para saber si está siguiendo a otro vehículo
    demasiado de cerca en condiciones normales?
  choices:
    A: La "regla de los dos segundos"
    B: La "regla de los tres segundos"
    C: La "regla de los cuatro segundos"
    D: La regla de "la longitud de un vehículo por cada 10 mph"
  answer: B
  explanation: El manual recomienda la "regla de los tres segundos" como una forma
    sencilla de saber si está siguiendo demasiado de cerca, y funciona a cualquier
    velocidad.
- id: 159
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones debe aumentar su distancia de seguimiento
    a cuatro segundos?
  choices:
    A: Al conducir por una carretera recién pavimentada.
    B: Al seguir a una motocicleta.
    C: Al conducir en un vecindario residencial.
    D: Al acercarse a un semáforo en verde.
  answer: B
  explanation: Debe utilizar la "regla de los cuatro segundos" al seguir motocicletas
    porque, si la motocicleta llegara a caerse, usted necesita una distancia adicional
    para evitar al conductor.
- id: 160
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo lo sigue muy de cerca?
  choices:
    A: Acelerar para crear más distancia.
    B: Tocar los frenos repetidamente para advertir al conductor.
    C: Orillarse a la derecha y permitir que el vehículo que viene detrás lo rebase.
    D: Moverse al carril izquierdo y reducir la velocidad.
  answer: C
  explanation: Si lo siguen de cerca, el manual aconseja orillarse a la derecha y
    permitir que el vehículo que viene detrás lo rebase.
- id: 161
  category: sharing_the_road
  question: ¿Qué debe hacer si ve al conductor de un camión intentando retroceder
    desde la calle hacia un área de carga?
  choices:
    A: Tocar la bocina y rodearlo rápidamente.
    B: Detenerse para darle la oportunidad de retroceder de manera segura.
    C: Acercarse mucho detrás del camión para que el conductor pueda verlo.
    D: Rebasarlo por el lado derecho.
  answer: B
  explanation: Si ve al conductor de un camión intentando retroceder, deténgase para
    darle la oportunidad de hacerlo de manera segura. Nunca intente rodear a un camión
    que está retrocediendo.
- id: 162
  category: safe_driving_rules
  question: ¿Cuál es una regla importante que debe recordar al cruzar vías de ferrocarril?
  choices:
    A: Cambiar siempre de marcha mientras cruza las vías.
    B: Detenerse sobre las vías para verificar si vienen trenes.
    C: Asegurarse de que puede cruzar sin tener que detenerse sobre las vías.
    D: Acelerar para cruzar las vías lo más rápido posible.
  answer: C
  explanation: 'El manual establece: "Cuando cruce vías de ferrocarril, asegúrese
    de que puede cruzar sin tener que detenerse sobre las vías".'
- id: 163
  category: defensive_driving
  question: ¿Qué debe hacer si otro conductor lo sigue demasiado de cerca (tailgating)
    y no hay un carril derecho al cual cambiarse?
  choices:
    A: Presionar los frenos rápidamente para advertir al conductor detrás de usted.
    B: Acelerar para aumentar la distancia entre sus vehículos.
    C: Esperar hasta que el camino adelante esté despejado y luego reducir la velocidad
      lentamente.
    D: Mantener su velocidad e ignorar al conductor que lo sigue de cerca.
  answer: C
  explanation: Si lo siguen demasiado de cerca y no hay un carril derecho, espere
    hasta que el camino adelante esté despejado y luego reduzca la velocidad lentamente.
    Esto animará al conductor que lo sigue a rebasarlo. Nunca reduzca la velocidad
    bruscamente.
- id: 164
  category: safe_driving_rules
  question: ¿Por qué es importante dejar espacio adicional cuando se detiene en una
    colina o pendiente detrás de otro vehículo?
  choices:
    A: Para mejorar su visibilidad de las señales de tránsito adelante.
    B: El vehículo de adelante podría rodar hacia atrás al arrancar.
    C: Para permitir que los peatones crucen de manera segura entre los vehículos.
    D: Evita que los frenos de su vehículo se sobrecalienten.
  answer: B
  explanation: Debe dejar espacio adicional cuando se detiene en una colina o pendiente
    porque el vehículo de adelante podría rodar hacia atrás al arrancar.
- id: 165
  category: sharing_the_road
  question: ¿Cuánto espacio debe dejar entre su vehículo y una bicicleta al rebasarla?
  choices:
    A: Al menos 2 pies
    B: Al menos 3 pies
    C: Al menos 4 pies
    D: Al menos 5 pies
  answer: B
  explanation: Debe dejar al menos tres pies de espacio entre su vehículo y la bicicleta
    al rebasar una bicicleta.
- id: 166
  category: defensive_driving
  question: ¿Cuál es la mejor manera de manejar el rebasar una bicicleta cuando también
    se aproxima un vehículo en sentido contrario?
  choices:
    A: Acelerar para rebasar la bicicleta antes de que el vehículo en sentido contrario
      llegue a usted.
    B: Tocar la bocina para que la bicicleta se salga del camino.
    C: Pasar rozando la bicicleta mientras el vehículo en sentido contrario pasa.
    D: Reducir la velocidad y dejar que el vehículo en sentido contrario pase primero
      antes de darle espacio adicional a la bicicleta.
  answer: D
  explanation: Cuando sea posible, enfrente los peligros potenciales uno a la vez.
    Si está rebasando una bicicleta y se aproxima un vehículo en sentido contrario,
    reduzca la velocidad y deje que el vehículo pase primero para que pueda darle
    espacio adicional a la bicicleta.
- id: 167
  category: defensive_driving
  question: ¿Dónde se encuentra generalmente el punto ciego de otro conductor?
  choices:
    A: Directamente frente a su vehículo.
    B: A cada lado y ligeramente hacia la parte trasera de su vehículo.
    C: Directamente detrás de su parachoques trasero.
    D: Solo en el lado del pasajero de su vehículo.
  answer: B
  explanation: Trate de evitar conducir a ambos lados y ligeramente hacia la parte
    trasera de otro vehículo, ya que estará en su punto ciego.
- id: 168
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla con respecto a la conducción cerca
    de cruces ferroviarios a nivel?
  choices:
    A: Debe acelerar para cruzar vías con baches rápidamente.
    B: Puede rebasar a otros vehículos si el cruce no tiene luces de advertencia.
    C: No rebase si hay un cruce ferroviario a nivel adelante.
    D: Siempre debe detenerse al menos 50 pies antes de las vías.
  answer: C
  explanation: Al acercarse a cruces ferroviarios, debe reducir la velocidad para
    cruzar de manera segura, y no debe rebasar si hay un cruce ferroviario a nivel
    adelante.
- id: 169
  category: safe_driving_rules
  question: ¿Por qué es importante mirar sobre su hombro en la dirección en la que
    planea moverse al cambiar de carril?
  choices:
    A: Para revisar los puntos ciegos de su vehículo.
    B: Para ver si el conductor detrás de usted está frenando.
    C: Para asegurarse de que su luz de giro funcione correctamente.
    D: Para juzgar la velocidad del tráfico en sentido contrario.
  answer: A
  explanation: Debe mirar sobre su hombro para revisar sus puntos ciegos, ya que no
    puede ver estas áreas a través de sus espejos.
- id: 170
  category: safe_driving_rules
  question: Si necesita cambiar varios carriles en una carretera de carriles múltiples,
    ¿cuál es la forma más segura de hacerlo?
  choices:
    A: Esperar hasta que todos los carriles estén despejados y cruzarlos todos a la
      vez.
    B: Cambiarlos de uno en uno.
    C: Acelerar significativamente para cruzar los carriles rápidamente.
    D: Reducir la velocidad al mínimo antes de cruzar los carriles.
  answer: B
  explanation: Si desea cambiar varios carriles, hágalo de uno en uno. Es más seguro
    y fácil incorporarse a un carril a la vez, ya que es muy difícil determinar que
    todos los carriles estén libres y sean seguros para cruzar a la vez.
- id: 171
  category: safe_driving_rules
  question: ¿A una velocidad de 55 mph, aproximadamente cuánto tiempo necesita para
    rebasar a otro vehículo de manera segura?
  choices:
    A: 3 segundos
    B: 5 segundos
    C: 10 segundos
    D: 15 segundos
  answer: C
  explanation: A una velocidad de 55 mph, necesita unos 10 segundos para rebasar.
    Eso significa que necesita un espacio de 10 segundos en el tráfico que viene en
    sentido contrario y distancia de visibilidad para rebasar.
- id: 172
  category: safe_driving_rules
  question: A 55 mph, ¿aproximadamente cuánta distancia necesita para rebasar de manera
    segura a otro vehículo, teniendo en cuenta el tráfico en sentido contrario?
  choices:
    A: 400 pies
    B: 800 pies
    C: 1000 pies
    D: Más de 1600 pies (aproximadamente un tercio de milla)
  answer: D
  explanation: A 55 mph, usted recorrerá más de 800 pies en 10 segundos, al igual
    que un vehículo que venga en sentido contrario. Eso significa que necesita más
    de 1600 pies (aproximadamente un tercio de milla) para rebasar de manera segura.
- id: 173
  category: safe_driving_rules
  question: Después de rebasar a otro vehículo, ¿cómo sabe que es seguro regresar
    al carril de circulación?
  choices:
    A: Cuando esté a la longitud de un auto por delante del vehículo rebasado.
    B: Cuando pueda ver ambos faros delanteros del vehículo rebasado en su espejo
      retrovisor.
    C: Cuando el conductor del vehículo rebasado le haga señales con las luces.
    D: Cuando haya acelerado a 10 mph por encima del límite de velocidad.
  answer: B
  explanation: Antes de regresar al carril de circulación, asegúrese de dejar suficiente
    espacio. Cuando pueda ver ambos faros delanteros del vehículo que acaba de rebasar
    en su espejo retrovisor, es seguro regresar al carril de circulación.
- id: 174
  category: defensive_driving
  question: ¿Qué debe hacer si desea estacionarse en paralelo y hay tráfico viniendo
    detrás de usted?
  choices:
    A: Detenerse bruscamente para bloquear el tráfico mientras se estaciona.
    B: Poner la luz direccional, colocarse junto al espacio y permitir que los vehículos
      que le siguen pasen antes de estacionarse.
    C: Entrar al espacio de frente para ahorrar tiempo.
    D: Hacer señas al tráfico para que lo rodee mientras comienza a retroceder.
  answer: B
  explanation: Si desea estacionarse en paralelo y hay tráfico viniendo detrás de
    usted, ponga su luz direccional, colóquese junto al espacio y permita que los
    vehículos que le siguen pasen antes de estacionarse.
- id: 175
  category: defensive_driving
  question: ¿Qué significa 'dividir la diferencia' (split the difference) entre dos
    peligros?
  choices:
    A: Conducir directamente hacia el peligro más pequeño.
    B: Detener su vehículo hasta que ambos peligros hayan pasado.
    C: Dirigirse por un camino intermedio entre ellos, dejando un poco más de espacio
      en el lado más peligroso.
    D: Acelerar para pasar entre los peligros lo más rápido posible.
  answer: C
  explanation: “Dividir la diferencia” significa dirigirse por un camino intermedio
    entre dos peligros. Sin embargo, si uno es más peligroso que el otro, debe dejar
    un poco más de espacio en el lado más peligroso.
- id: 176
  category: defensive_driving
  question: Al revisar sus puntos ciegos durante un cambio de carril, ¿por qué es
    importante hacerlo rápidamente?
  choices:
    A: Porque su luz direccional se apagará automáticamente.
    B: Porque el tráfico delante de usted podría detenerse repentinamente mientras
      mira hacia otro lado.
    C: Porque otros conductores podrían acelerar para bloquearlo.
    D: Porque es ilegal apartar la vista de la carretera por más de un segundo.
  answer: B
  explanation: Debe revisar rápidamente y no apartar la vista de la carretera por
    más de un instante, porque el tráfico delante de usted podría detenerse repentinamente
    mientras revisa el tráfico a los lados, atrás o sobre su hombro.
- id: 177
  category: defensive_driving
  question: ¿Por qué las plazas de peaje se consideran 'puntos problemáticos' donde
    es posible que deba reducir la velocidad?
  choices:
    A: Porque los peatones cruzan la autopista con frecuencia allí.
    B: Porque los vehículos están cambiando de carril, preparándose para detenerse
      y acelerando de nuevo.
    C: Porque el límite de velocidad siempre baja a 15 mph.
    D: Porque las cabinas de peaje crean grandes puntos ciegos.
  answer: B
  explanation: Las plazas de peaje son puntos problemáticos porque los vehículos están
    cambiando de carril, preparándose para detenerse y luego acelerando de nuevo al
    salir de la plaza. El número de carriles también podría cambiar.
- id: 178
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias se permite rebasar a un vehículo por el acotamiento
    (shoulder)?
  choices:
    A: Cuando el vehículo de adelante está girando a la izquierda
    B: Cuando el acotamiento está pavimentado y es lo suficientemente ancho
    C: Nunca, ya sea que el acotamiento esté pavimentado o no
    D: Solo durante las horas del día en autopistas de varios carriles
  answer: C
  explanation: 'El manual establece explícitamente: "Nunca rebase por el acotamiento,
    ya sea que esté pavimentado o no. Otros conductores nunca esperarán que usted
    esté allí y podrían salirse de la carretera sin mirar".'
- id: 179
  category: safe_driving_rules
  question: Según la ley de Connecticut, ¿en qué carril debe conducir cuando su dirección
    de viaje tiene menos de tres carriles?
  choices:
    A: El carril izquierdo, para dejar espacio al tráfico que se incorpora
    B: El carril central, si está disponible
    C: El carril derecho, excepto al rebasar o girar a la izquierda
    D: Cualquier carril, siempre que viaje al límite de velocidad
  answer: C
  explanation: Cuando su dirección de viaje tiene menos de tres carriles, la ley de
    Connecticut exige que conduzca en el carril derecho, excepto al rebasar o si necesita
    hacer un giro a la izquierda o salir por la izquierda.
- id: 180
  category: safe_driving_rules
  question: ¿Qué debe evitar hacer al realizar un giro a la derecha?
  choices:
    A: Abrirse demasiado hacia la izquierda antes de realizar el giro
    B: Girar desde el carril más cercano a la dirección a la que desea ir
    C: Señalizar antes de cambiar de carril
    D: Buscar peatones en el cruce peatonal
  answer: A
  explanation: En los giros a la derecha, evite abrirse demasiado hacia la izquierda
    antes de realizar el giro. Si se abre demasiado, el conductor detrás de usted
    puede pensar que está cambiando de carril o que va a girar a la izquierda y puede
    intentar rebasarlo por la derecha.
- id: 181
  category: sharing_the_road
  question: ¿Qué cuidado especial debe tener al girar cerca de ciclistas?
  choices:
    A: Tocar la bocina para advertir al ciclista antes de girar
    B: Acelerar para rebasar al ciclista rápidamente antes de girar a la derecha
    C: Nunca girar a la derecha inmediatamente después de rebasar a un ciclista
    D: Asumir que los ciclistas le cederán el paso cuando usted esté girando
  answer: C
  explanation: 'La ley estatal y la seguridad requieren un cuidado especial al girar
    cerca de ciclistas. El manual establece: "Nunca gire a la derecha inmediatamente
    después de rebasar a un ciclista. Ceda el paso a las bicicletas al girar, tal
    como lo haría con cualquier otro vehículo en la vía".'
- id: 182
  category: safe_driving_rules
  question: ¿Cuándo es legal retroceder un vehículo en un carril de circulación?
  choices:
    A: Cuando se pasa de su salida en la autopista
    B: Solo para estacionar en paralelo o para realizar un giro de tres puntos o en
      K
    C: Cuando necesita dejar a un pasajero rápidamente
    D: Cuando su vehículo se avería y necesita llegar al arcén
  answer: B
  explanation: 'El manual establece: "Nunca retroceda un vehículo en ningún carril
    de circulación; es ilegal y peligroso hacerlo, excepto para estacionar en paralelo
    o para realizar un giro de tres puntos o en K".'
- id: 183
  category: defensive_driving
  question: ¿Cuál es la forma correcta de mirar al retroceder su vehículo?
  choices:
    A: Depender totalmente de su espejo retrovisor
    B: Depender totalmente de sus espejos laterales
    C: Girar y mirar por encima de su hombro derecho directamente a través de la ventana
      trasera
    D: Mirar por encima de su hombro izquierdo por la ventana del lado del conductor
  answer: C
  explanation: Al retroceder, debe girar y mirar por encima de su hombro derecho para
    poder ver directamente a través de la ventana trasera. No debe depender de sus
    espejos retrovisores o laterales.
- id: 184
  category: defensive_driving
  question: ¿Qué tan lejos debe poder ver para iniciar de manera segura una maniobra
    de rebase cerca de una colina o curva?
  choices:
    A: Al menos un cuarto de milla
    B: Al menos un tercio de milla
    C: Al menos media milla
    D: Al menos una milla
  answer: B
  explanation: Debe poder ver al menos un tercio de milla (unos 10 segundos) hacia
    adelante. No debe comenzar a rebasar si se encuentra a menos de un tercio de milla
    de una colina o curva.
- id: 185
  category: driver_responsibility
  question: ¿Cuál de las siguientes acciones es ilegal en muchos estados y dificulta
    demasiado escuchar las bocinas o sirenas de emergencia?
  choices:
    A: Escuchar la radio a un volumen moderado
    B: Conducir con cascos o auriculares que cubran o se introduzcan en ambos oídos
    C: Hablar con los pasajeros mientras conduce
    D: Usar un dispositivo Bluetooth de manos libres en un solo oído
  answer: B
  explanation: 'El manual advierte: "No conduzca con cascos o auriculares que cubran
    o se introduzcan en ambos oídos. Estos son ilegales en muchos estados y dificultan
    demasiado escuchar las bocinas o sirenas de emergencia".'
- id: 186
  category: defensive_driving
  question: ¿Qué es el "rubbernecking" (curiosear)?
  choices:
    A: Estirar el cuello para ver por encima del volante
    B: Revisar sus puntos ciegos girando la cabeza rápidamente
    C: Reducir la velocidad solo para mirar un choque o a alguien que recibe una multa
    D: Hacer que su vehículo rebote sobre los resaltos
  answer: C
  explanation: Reducir la velocidad solo para mirar un choque, a alguien que recibe
    una multa u otra actividad al costado de la carretera se llama "rubbernecking"
    y podría causar que usted sufra un choque.
- id: 187
  category: safe_driving_rules
  question: ¿Cuál es la forma más segura de navegar una curva?
  choices:
    A: Frenar firmemente mientras está en medio de la curva
    B: Acelerar bruscamente al entrar en la curva
    C: Poner el vehículo en punto muerto (neutral) antes de entrar en la curva
    D: Reducir la velocidad antes de entrar en la curva para no tener que frenar dentro
      de ella
  answer: D
  explanation: Siempre reduzca la velocidad antes de entrar en la curva para no tener
    que frenar dentro de ella. Frenar en una curva puede hacer que el vehículo patine.
- id: 188
  category: safe_driving_rules
  question: ¿Cuánto debe reducir su velocidad al conducir en una carretera mojada?
  choices:
    A: Aproximadamente 5 mph
    B: Aproximadamente 10 mph
    C: Reducir su velocidad a la mitad
    D: Reducir la velocidad al mínimo
  answer: B
  explanation: Según el manual, en una carretera mojada, debe reducir su velocidad
    en aproximadamente 10 mph. (En nieve compacta la reduce a la mitad, y en hielo
    reduce la velocidad al mínimo).
- id: 189
  category: vehicle_information
  question: ¿En qué fechas se permiten los neumáticos con clavos en Connecticut?
  choices:
    A: Del 1 de octubre al 31 de marzo
    B: Del 15 de noviembre al 30 de abril
    C: Del 1 de diciembre al 28 de febrero
    D: Nunca se permiten en Connecticut
  answer: B
  explanation: Los neumáticos con clavos están permitidos en Connecticut desde el
    15 de noviembre hasta el 30 de abril.
- id: 190
  category: defensive_driving
  question: ¿Por qué el pavimento de los puentes puede estar helado incluso cuando
    el resto del pavimento no lo está?
  choices:
    A: Los puentes suelen estar hechos de hormigón en lugar de asfalto
    B: Los puentes no tienen tierra debajo para ayudar a aislarlos contra el frío
    C: Los puentes suelen estar situados a mayor altitud, donde el aire es más frío
    D: Los puentes están expuestos a una luz solar más directa que derrite y vuelve
      a congelar el hielo
  answer: B
  explanation: El pavimento de los puentes puede estar helado incluso cuando el resto
    del pavimento no lo está porque los puentes no tienen tierra debajo para ayudar
    a aislarlos contra el frío, lo que los hace más fríos y propensos a congelarse
    que otras carreteras.
- id: 191
  category: safe_driving_rules
  question: ¿Por qué los pasos elevados y los puentes pueden estar más helados que
    otras carreteras?
  choices:
    A: Están expuestos a más viento.
    B: No tienen tierra debajo para ayudar a aislarlos del frío.
    C: Suelen estar hechos de hormigón en lugar de asfalto.
    D: Acumulan más agua durante las tormentas de lluvia.
  answer: B
  explanation: Según el manual, el pavimento de los puentes puede estar helado incluso
    cuando el resto del pavimento no lo está, porque los puentes no tienen tierra
    debajo para ayudar a aislarlos del frío.
- id: 192
  category: safe_driving_rules
  question: ¿A qué temperatura suele ser más resbaladizo el hielo en la carretera?
  choices:
    A: Muy por debajo del punto de congelación.
    B: Exactamente a cero grados Fahrenheit.
    C: Alrededor del punto de congelación cuando se moja.
    D: El hielo tiene la misma resbaladicidad a todas las temperaturas.
  answer: C
  explanation: El manual establece que cuando la temperatura está cerca del punto
    de congelación, el hielo puede mojarse, lo que lo hace más resbaladizo que a temperaturas
    muy por debajo del punto de congelación.
- id: 193
  category: safe_driving_rules
  question: ¿Por qué el pavimento es más resbaladizo durante los primeros minutos
    cuando empieza a llover en un día caluroso?
  choices:
    A: La lluvia se mezcla con la suciedad para crear lodo espeso.
    B: El calor hace que el aceite del asfalto suba a la superficie.
    C: El pavimento caliente hace que la lluvia se congele instantáneamente.
    D: Los neumáticos se expanden por el calor y pierden su dibujo.
  answer: B
  explanation: Cuando empieza a llover en un día caluroso, el calor hace que el aceite
    del asfalto suba a la superficie, haciendo que la carretera sea más resbaladiza
    hasta que el aceite se lave.
- id: 194
  category: safe_driving_rules
  question: Cuando llueve o la carretera está mojada, ¿a qué velocidad comienzan la
    mayoría de los neumáticos a perder tracción y corren el riesgo de hidroplaneo
    (hydroplaning)?
  choices:
    A: Alrededor de 25 mph
    B: Alrededor de 35 mph
    C: Alrededor de 45 mph
    D: Alrededor de 55 mph
  answer: B
  explanation: Cuando llueve o la carretera está mojada, la mayoría de los neumáticos
    tienen buena tracción hasta unas 35 mph. A medida que aumenta la velocidad, los
    neumáticos comenzarán a deslizarse sobre el agua, lo que se denomina hidroplaneo
    (hydroplaning).
- id: 195
  category: defensive_driving
  question: ¿Qué debe hacer si siente que sus neumáticos han perdido tracción con
    la superficie de la carretera?
  choices:
    A: Pisar los frenos a fondo de inmediato.
    B: Girar el volante bruscamente para recuperar el control.
    C: Levantar suavemente el pie del acelerador y mantener el volante recto.
    D: Acelerar ligeramente para atravesar el agua.
  answer: C
  explanation: Si pierde tracción, debe levantar suavemente el pie del acelerador,
    mantener el volante recto y solo intentar girar si es una emergencia.
- id: 196
  category: driver_responsibility
  question: Si la conducción agresiva de otro conductor le hace sentir obligado a
    tomar represalias, ¿cuál es la mejor forma de actuar?
  choices:
    A: Seguirlos de cerca para obtener su número de placa.
    B: Hacerles señales con las luces altas para advertirles.
    C: Dejar el castigo en manos de la policía y reportar el incidente cuando llegue
      a su destino.
    D: Detenerse junto a ellos en el próximo semáforo en rojo para confrontarlos.
  answer: C
  explanation: El manual aconseja que lo mejor es dejar el castigo en manos de la
    policía y llamar a la policía para reportar cualquier caso de conducción agresiva
    cuando llegue a su destino.
- id: 197
  category: sharing_the_road
  question: Para evitar el bloqueo de carriles en una autopista, ¿qué debe hacer cuando
    otro vehículo quiere rebasar?
  choices:
    A: Acelerar para evitar que lo rebasen.
    B: Mantenerse fuera del carril del extremo izquierdo y ceder el paso hacia la
      derecha.
    C: Moverse al carril del extremo izquierdo y encender las luces de emergencia.
    D: Frenar ligeramente para indicarles que lo rodeen.
  answer: B
  explanation: Para evitar el bloqueo de carriles, debe mantenerse fuera del carril
    del extremo izquierdo y ceder el paso hacia la derecha a cualquier vehículo que
    quiera rebasar.
- id: 198
  category: driver_responsibility
  question: Según el manual, ¿por qué debería pensarlo dos veces antes de usar la
    bocina para saludar a un peatón?
  choices:
    A: Es ilegal tocar la bocina a los peatones.
    B: El conductor que está delante de usted puede pensar que le está tocando la
      bocina a él y estresarse.
    C: Agotará la batería de su vehículo.
    D: Los peatones siempre tienen el derecho de paso.
  answer: B
  explanation: Debe pensarlo dos veces antes de usar la bocina para saludar a un peatón
    porque el conductor que está delante de usted puede pensar que le está tocando
    la bocina a él o ella, lo que podría alterar a un automovilista estresado.
- id: 199
  category: safe_driving_rules
  question: ¿Qué debe hacer si un vehículo que viene en sentido contrario no baja
    sus luces altas?
  choices:
    A: Tomar represalias encendiendo sus propias luces altas para darles una lección.
    B: Hacer destellos rápidos con las luces altas hasta que pasen.
    C: Mantener sus faros en luces bajas y no tomar represalias.
    D: Apagar sus faros por completo durante unos segundos.
  answer: C
  explanation: 'El manual establece explícitamente: "No tome represalias contra las
    luces altas de los vehículos que vienen en sentido contrario con las suyas para
    ''darles una lección''". Debe mantener sus faros en luces bajas.'
- id: 200
  category: sharing_the_road
  question: ¿Cómo puede ayudar a los vehículos que entran en una autopista de varios
    carriles desde una rampa de entrada?
  choices:
    A: Detenerse en el carril derecho para dejarlos entrar.
    B: Salir del carril derecho cuando el tráfico lo permita.
    C: Acelerar para pasar la rampa de entrada rápidamente.
    D: Tocar la bocina para avisarles que usted está allí.
  answer: B
  explanation: Cuando el tráfico lo permita, debe salir del carril derecho de una
    autopista de varios carriles para permitir que los vehículos entren desde las
    rampas de entrada.
- id: 201
  category: defensive_driving
  question: ¿Si un automovilista hostil intenta buscarle pelea, por qué debería evitar
    el contacto visual?
  choices:
    A: Puede verse como un gesto desafiante e incitar a la violencia.
    B: Le distraerá de mirar hacia la carretera.
    C: Se considera una infracción de tráfico.
    D: Hará que sea más difícil recordar su matrícula.
  answer: A
  explanation: Hacer contacto visual con un automovilista hostil puede verse como
    un gesto desafiante y puede incitar al otro conductor a la violencia.
- id: 202
  category: defensive_driving
  question: ¿Si un automovilista hostil lo persigue, hacia dónde debe conducir?
  choices:
    A: Directamente a su casa.
    B: A una calle lateral tranquila y sin iluminación para esconderse.
    C: A una estación de policía, tienda de conveniencia u otro lugar público y bien
      iluminado.
    D: A la autopista más cercana y conducir por encima del límite de velocidad.
  answer: C
  explanation: Si un automovilista lo persigue, no vaya a casa. En su lugar, conduzca
    a una estación de policía, tienda de conveniencia u otro lugar público y bien
    iluminado donde pueda obtener ayuda.
- id: 203
  category: driver_responsibility
  question: ¿Cuál es la forma recomendada de manejar a las mascotas mientras se conduce?
  choices:
    A: Dejar que se sienten en el asiento del pasajero delantero.
    B: Sostenerlas en su regazo para mantenerlas tranquilas.
    C: Asegurarlas adecuadamente en un transportador de mascotas o jaula portátil
      antes de poner en marcha el vehículo.
    D: Permitir que deambulen libremente en el asiento trasero.
  answer: C
  explanation: Para evitar distraerse, debe asegurar adecuadamente a las mascotas
    en un transportador de mascotas o jaula portátil antes de poner en marcha su vehículo.
- id: 204
  category: safe_driving_rules
  question: ¿Cuál de las siguientes se considera una distracción del conductor que
    podría ocurrir fuera de un vehículo en movimiento?
  choices:
    A: Ajustar los controles de climatización.
    B: Un oficial de policía deteniendo a alguien.
    C: Atender a los niños en el asiento trasero.
    D: Usar un sistema de posicionamiento global (GPS).
  answer: B
  explanation: Según la lista del manual de posibles distracciones fuera de un vehículo
    en movimiento, "un policía deteniendo a alguien" es una distracción externa. Las
    otras son distracciones internas.
- id: 205
  category: safe_driving_rules
  question: ¿Qué regla debe usar por la noche para asegurarse de no estar "conduciendo
    más allá" del alcance de sus faros delanteros?
  choices:
    A: La regla de seguimiento de dos segundos
    B: La regla de parada de tres segundos
    C: La regla de distancia visual de cuatro segundos
    D: La regla de escaneo de diez segundos
  answer: C
  explanation: El manual establece que debe usar la "regla de distancia visual de
    cuatro segundos" por la noche para asegurarse de no estar "conduciendo más allá"
    del alcance de sus faros delanteros.
- id: 206
  category: defensive_driving
  question: ¿Qué debe hacer si necesita mirar un mapa mientras conduce?
  choices:
    A: Pedirle a un amigo en otro vehículo que lo guíe.
    B: Detenerse en un área de estacionamiento segura para revisarlo.
    C: Sostener el mapa contra el volante para mantener la vista en la carretera.
    D: Reducir la velocidad y desviarse ligeramente mientras lo lee.
  answer: B
  explanation: El manual indica revisar los mapas y planificar su ruta antes de conducir.
    Si necesita mirar un mapa mientras conduce, debe detenerse en un área de estacionamiento
    segura.
- id: 207
  category: defensive_driving
  question: ¿Cuánta distancia de seguimiento debe darle a un conductor que parece
    estar distraído?
  choices:
    A: 1 a 2 segundos
    B: 2 a 3 segundos
    C: 3 a 4 segundos
    D: 5 a 6 segundos
  answer: C
  explanation: El manual aconseja dar a un conductor distraído mucho espacio y mantener
    una distancia de seguimiento segura de 3 a 4 segundos.
- id: 208
  category: driver_responsibility
  question: ¿Si usted se distrae y tiene un choque, quién o qué es responsable?
  choices:
    A: La distracción en sí misma
    B: Los pasajeros en el vehículo
    C: El otro conductor involucrado
    D: Usted, el conductor
  answer: D
  explanation: Usted es completa y únicamente responsable de operar su vehículo de
    manera segura. Si se distrae y tiene un choque, la responsabilidad recae sobre
    usted, no sobre la distracción.
- id: 209
  category: alcohol_drugs_health
  question: ¿Cómo afecta la fatiga su capacidad de conducción?
  choices:
    A: Aumenta su tiempo de reacción y lo hace estar más alerta.
    B: Afecta su visión y juicio, de manera similar al alcohol y las drogas.
    C: Le ayuda a tomar decisiones más rápidas en la carretera.
    D: Disminuye su riesgo de sufrir un choque.
  answer: B
  explanation: Según el manual, la fatiga afecta su visión y juicio al igual que el
    alcohol y las drogas, y provoca errores relacionados con la velocidad y la distancia.
- id: 210
  category: alcohol_drugs_health
  question: ¿Las personas con apnea obstructiva del sueño no tratada tienen cuántas
    veces más probabilidades de quedarse dormidas al volante?
  choices:
    A: 2 veces
    B: 5 veces
    C: 7 veces
    D: 10 veces
  answer: C
  explanation: El manual establece que las personas con apnea obstructiva del sueño
    no tratada tienen 7 veces más probabilidades de quedarse dormidas al volante.
- id: 211
  category: safe_driving_rules
  question: ¿Con qué frecuencia debe programar descansos adecuados durante viajes
    largos para ayudar a prevenir la fatiga?
  choices:
    A: Cada 50 millas o 1 hora
    B: Cada 100 millas o 2 horas
    C: Cada 150 millas o 3 horas
    D: Cada 200 millas o 4 horas
  answer: B
  explanation: Antes de un viaje, debe programar descansos adecuados aproximadamente
    cada 100 millas o 2 horas durante los viajes largos para mantener el estado de
    alerta adecuado.
- id: 212
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes se considera una señal de advertencia de fatiga
    del conductor?
  choices:
    A: Revisar los espejos con frecuencia
    B: Mantener una velocidad constante
    C: Subir el volumen de la radio o bajar la ventana para despertarse
    D: Mantener los ojos enfocados en su trayectoria inmediata de viaje
  answer: C
  explanation: Las señales de advertencia de fatiga incluyen subir el volumen de la
    radio o bajar la ventana para despertarse, bostezar y tener problemas para concentrarse.
- id: 213
  category: defensive_driving
  question: ¿Cuál es la duración recomendada para una siesta si necesita detenerse
    a un lado del camino debido a la fatiga?
  choices:
    A: 5 a 10 minutos
    B: 15 a 20 minutos
    C: 30 a 45 minutos
    D: 1 a 2 horas
  answer: B
  explanation: Para prevenir un choque relacionado con la fatiga, el manual recomienda
    buscar un área de estacionamiento segura para tomar una siesta de 15 a 20 minutos.
- id: 214
  category: safe_driving_rules
  question: 'Para ayudar a prevenir choques relacionados con la fatiga, debe intentar
    evitar conducir tarde por la noche entre las horas de:'
  choices:
    A: 9 p.m. y medianoche
    B: 10 p.m. y 2 a.m.
    C: Medianoche y 6 a.m.
    D: 2 a.m. y 8 a.m.
  answer: C
  explanation: El manual aconseja intentar no conducir tarde por la noche entre las
    horas de la medianoche y las 6 a.m. para prevenir la fatiga.
- id: 215
  category: vehicle_information
  question: ¿Cuál es el propósito principal de las bandas sonoras (rumble strips)
    en la calzada?
  choices:
    A: Ayudar a los vehículos a detenerse más rápido en lluvia o nieve
    B: Alertar a los conductores de una próxima cabina de peaje
    C: Prevenir choques relacionados con la fatiga al alertar a los conductores distraídos
    D: Medir la velocidad de los vehículos que pasan
  answer: C
  explanation: Las bandas sonoras (rumble strips) ayudan a prevenir choques relacionados
    con la fatiga. Cuando los neumáticos de un vehículo pasan sobre ellas, el conductor
    es alertado por un sonido de vibración repentino y fuerte.
- id: 216
  category: alcohol_drugs_health
  question: ¿Cómo debe manejar la conducción si se siente impaciente?
  choices:
    A: Entrar y salir rápidamente del tráfico para llegar más rápido a su destino.
    B: Conducir un poco más rápido que el flujo del tráfico.
    C: Darse tiempo extra para su viaje y salir unos minutos antes.
    D: Encender las luces de emergencia para advertir a otros conductores.
  answer: C
  explanation: Si se siente impaciente, el manual sugiere darse tiempo extra para
    su viaje y salir unos minutos antes para no tener la tendencia a exceder la velocidad.
- id: 217
  category: driver_responsibility
  question: Según el Acuerdo de Conducción entre Adolescentes y Padres, ¿por qué es
    especialmente peligroso conducir para los adolescentes?
  choices:
    A: Los adolescentes tienen reflejos físicos más lentos que los adultos mayores.
    B: El cerebro humano no desarrolla completamente su capacidad para evaluar el
      riesgo y el peligro hasta mediados de los 20 años.
    C: Los cursos de capacitación para conductores adolescentes no cubren la conducción
      en autopistas.
    D: Los adolescentes no están obligados a tomar un examen de conocimientos por
      escrito.
  answer: B
  explanation: Conducir es especialmente peligroso para los adolescentes porque el
    cerebro humano no desarrolla completamente su capacidad para evaluar el riesgo
    y el peligro o controlar los impulsos hasta que llegamos a mediados de los 20
    años.
- id: 218
  category: license_system
  question: ¿Cuál es el número mínimo de horas de práctica de conducción supervisada
    que exige la ley de Connecticut antes de obtener una licencia?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 100 horas
  answer: C
  explanation: La ley de Connecticut exige un mínimo de 40 horas de práctica de conducción
    supervisada antes de obtener una licencia, aunque se recomiendan 100 horas.
- id: 219
  category: defensive_driving
  question: ¿Cuál de las siguientes es una señal de que otro conductor en la carretera
    puede estar distraído?
  choices:
    A: Viajan a una velocidad constante.
    B: Se están desviando sobre las líneas divisorias de carril.
    C: Mantienen una distancia de seguimiento de 3 a 4 segundos.
    D: Revisan sus espejos con frecuencia.
  answer: B
  explanation: Las señales de un conductor distraído incluyen vehículos que pueden
    desviarse sobre las líneas divisorias de carril o dentro de su propio carril,
    y vehículos que viajan a velocidades inconsistentes.
- id: 220
  category: driver_responsibility
  question: ¿Qué significa para un conductor adolescente aprobar un curso de capacitación
    y obtener una licencia de conducir?
  choices:
    A: Ahora se le considera un conductor experto.
    B: Ya no necesita seguir el Acuerdo de Conducción entre Adolescentes y Padres.
    C: Solo es un principiante, no necesariamente un conductor seguro.
    D: Se le permite legalmente usar dispositivos electrónicos de manos libres.
  answer: C
  explanation: El manual establece que aprobar un curso de capacitación y obtener
    una licencia de conducir significa que un adolescente es solo un principiante;
    no significa que el adolescente sea un conductor seguro.
- id: 221
  category: safe_driving_rules
  question: ¿En Connecticut, entre qué horas no puede conducir un conductor adolescente,
    excepto por exenciones específicas como la escuela o un trabajo?
  choices:
    A: 10 p. m. y 6 a. m.
    B: 11 p. m. y 5 a. m.
    C: Medianoche y 5 a. m.
    D: 11 p. m. y 6 a. m.
  answer: B
  explanation: Los conductores adolescentes en Connecticut no pueden conducir entre
    las 11 p. m. y las 5 a. m., excepto por motivos escolares, laborales, médicos
    o religiosos, o por un programa de viajes seguros (Safe Rides).
- id: 222
  category: license_system
  question: Durante los primeros seis meses con licencia, ¿a quién se le permite llevar
    como pasajero a un conductor adolescente?
  choices:
    A: Solo miembros de la familia inmediata
    B: Hasta dos amigos
    C: Un adulto que esté supervisando su conducción
    D: Cualquier persona, siempre que use el cinturón de seguridad
  answer: C
  explanation: Durante los primeros seis meses con licencia, un conductor adolescente
    solo puede llevar a un adulto que esté supervisando su conducción.
- id: 223
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los dispositivos
    electrónicos y los conductores adolescentes?
  choices:
    A: Se permite el uso de teléfonos celulares con manos libres.
    B: Se permite enviar mensajes de texto solo cuando se está detenido en un semáforo
      en rojo.
    C: Conducir mientras se habla por teléfono celular, incluso con manos libres,
      es ilegal.
    D: Los dispositivos GPS se pueden programar mientras el vehículo está en movimiento.
  answer: C
  explanation: Conducir mientras se envían mensajes de texto o se habla por teléfono
    celular (incluso con manos libres) es ilegal. Los conductores adolescentes no
    deben usar ningún dispositivo electrónico ilegal o que cause distracción mientras
    el vehículo está en movimiento.
- id: 224
  category: alcohol_drugs_health
  question: ¿En qué porcentaje de los accidentes de tráfico en los que alguien muere
    está involucrado el alcohol?
  choices:
    A: 20 por ciento
    B: 30 por ciento
    C: 40 por ciento
    D: 50 por ciento
  answer: C
  explanation: Según el manual, el alcohol está involucrado en más del 40 por ciento
    de los accidentes de tráfico en los que alguien muere.
- id: 225
  category: alcohol_drugs_health
  question: ¿Qué es lo único que le ayudará a recuperar la sobriedad después de beber
    alcohol?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Tomar aire fresco y hacer ejercicio
    D: El tiempo
  answer: D
  explanation: No hay forma de recuperar la sobriedad rápidamente. El café, el aire
    fresco, el ejercicio o las duchas frías no ayudarán. El tiempo es lo único que
    le devolverá la sobriedad.
- id: 226
  category: alcohol_drugs_health
  question: Según el manual, ¿cuál de los siguientes constituye una bebida alcohólica
    estándar?
  choices:
    A: Una copa de vino de 5 oz.
    B: Un vaso de cerveza de 8 oz.
    C: Un trago (shot) de 2 oz. de licor de 80 grados (80-proof)
    D: Una jarra de cerveza de 16 oz.
  answer: A
  explanation: Una bebida alcohólica se define como 1.5 oz. de licor de 80 grados
    (80-proof), 12 oz. de cerveza o una copa de vino de 5 oz.
- id: 227
  category: penalties_and_points
  question: Bajo la ley de "tolerancia cero" de Connecticut para conductores menores
    de 21 años, ¿qué contenido de alcohol en sangre (BAC) se considera conducir con
    una cantidad medible de alcohol?
  choices:
    A: .01% o más
    B: .02% o más
    C: .05% o más
    D: .08% o más
  answer: B
  explanation: La ley establece sanciones para los conductores menores de 21 años
    que conduzcan con cualquier cantidad medible de alcohol en la sangre, definida
    como dos centésimas del uno por ciento (.02%) o más.
- id: 228
  category: penalties_and_points
  question: Independientemente de la edad, si se niega a hacerse una prueba de sangre,
    aliento u orina, ¿por cuántos días como mínimo se suspenderá su licencia de conducir?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Independientemente de la edad, si se niega a realizarse una prueba,
    su licencia de conducir será suspendida por al menos 45 días.
- id: 229
  category: penalties_and_points
  question: Si un conductor menor de 21 años no pasa una prueba de BAC (.02% o superior),
    ¿por cuánto tiempo se le requerirá instalar un dispositivo de bloqueo de encendido
    (IID)?
  choices:
    A: 45 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Si un conductor menor de 21 años tiene resultados de prueba de .02
    por ciento o más, se le requerirá instalar y mantener un IID durante al menos
    un año como condición para la restitución de la licencia.
- id: 230
  category: penalties_and_points
  question: Para un conductor de 16 o 17 años, ¿una primera infracción por exceso
    de velocidad (20 mph por encima del límite de velocidad) resultará en una suspensión
    de la licencia de cuántos días?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Para un conductor de 16 o 17 años, el exceso de velocidad (20 mph por
    encima del límite de velocidad) conlleva una suspensión de 60 días por la primera
    infracción.
- id: 231
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor de 16 o 17 años por su primera infracción
    al usar un teléfono celular o un dispositivo de mensajería de texto?
  choices:
    A: Una advertencia y una multa de $50
    B: Una suspensión de 30 días y una tarifa de restablecimiento de la licencia de
      $175
    C: Una suspensión de 60 días y una tarifa de restablecimiento de la licencia de
      $175
    D: Una suspensión de 6 meses y multas judiciales
  answer: B
  explanation: La primera infracción por el uso de un teléfono celular o un dispositivo
    de mensajería de texto por parte de un joven de 16 o 17 años resulta en una suspensión
    de 30 días, una tarifa de restablecimiento de la licencia de $175 y multas judiciales.
- id: 232
  category: alcohol_drugs_health
  question: ¿Qué puede suceder si consume alcohol mientras toma otros medicamentos
    recetados o de venta libre?
  choices:
    A: Los medicamentos anularán los efectos del alcohol.
    B: El alcohol ayudará a que los medicamentos funcionen más rápido.
    C: Podría multiplicar los efectos del alcohol o causar problemas de salud graves.
    D: No tendrá ningún efecto adicional en su capacidad de conducción.
  answer: C
  explanation: Nunca consuma alcohol mientras toma otros medicamentos. Estos medicamentos
    podrían multiplicar los efectos del alcohol o tener efectos adicionales propios,
    lo que podría causar problemas de salud graves o la muerte.
- id: 233
  category: safe_driving_rules
  question: De acuerdo con las Obligaciones del Conductor Adolescente y sus Padres,
    ¿qué es el "joyriding" (conducir sin rumbo)?
  choices:
    A: Conducir con más de dos pasajeros
    B: Conducir sin destino ni motivo
    C: Conducir por encima del límite de velocidad por diversión
    D: Conducir un vehículo sin el permiso del propietario
  answer: B
  explanation: El manual define el "joyriding" como "conducir sin destino ni motivo"
    y establece que no está permitido.
- id: 234
  category: penalties_and_points
  question: Un conductor menor de 18 años no puede ser considerado un delincuente
    juvenil (youthful offender) si comete ¿cuál de las siguientes infracciones?
  choices:
    A: Carreras callejeras
    B: Conducir bajo la influencia del alcohol o las drogas (DUI)
    C: Operar un vehículo mientras la licencia está suspendida
    D: Conducción temeraria
  answer: B
  explanation: Según el manual, alguien menor de 18 años no puede ser considerado
    un delincuente juvenil si comete homicidio negligente con un vehículo motorizado,
    evade la responsabilidad tras un accidente con muerte o lesiones graves, o conduce
    bajo la influencia del alcohol o las drogas.
- id: 235
  category: driver_responsibility
  question: ¿Qué debe hacer si un vehículo policial lo detiene por la noche?
  choices:
    A: Salir del vehículo para saludar al oficial
    B: Apagar los faros y esperar en la oscuridad
    C: Encender la luz interior del vehículo después de detenerse y antes de que el
      oficial se acerque
    D: Buscar en la guantera para tener su registro listo antes de que el oficial
      se acerque
  answer: C
  explanation: Al ser detenido por un vehículo policial por la noche, la policía recomienda
    encender la luz interior del vehículo después de detenerse y antes de que el oficial
    se acerque.
- id: 236
  category: penalties_and_points
  question: ¿A cuántas condenas por infracciones de tránsito debe llegar un automovilista
    de 25 años o más para que se le exija asistir a un programa certificado de reentrenamiento
    para conductores?
  choices:
    A: Una o más
    B: Dos o más
    C: Tres o más
    D: Cinco o más
  answer: C
  explanation: Un automovilista de 25 años o más que tenga tres o más condenas de
    este tipo debe asistir y aprobar con éxito un programa certificado de reentrenamiento
    para conductores.
- id: 237
  category: penalties_and_points
  question: Si un conductor completa el programa de reentrenamiento para conductores
    y comete otra infracción de tránsito en un plazo de tres años, ¿cuál es la sanción?
  choices:
    A: Una multa de $500
    B: Una suspensión de la licencia de al menos 30 días
    C: Una revocación permanente de su licencia
    D: Debe volver a tomar el examen de conducir
  answer: B
  explanation: Después de completar el reentrenamiento para conductores, una infracción
    de tránsito adicional dentro de los tres años posteriores a la fecha de finalización
    resultará en una suspensión de la licencia de al menos 30 días.
- id: 238
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los límites
    de velocidad?
  choices:
    A: No puede recibir una multa si conduce exactamente al límite de velocidad indicado
    B: Los límites de velocidad se publican para condiciones ideales de la carretera
    C: Detenerse a 60 mph toma exactamente el doble de distancia que detenerse a 30
      mph
    D: Los límites de velocidad solo se aplican durante las horas del día
  answer: B
  explanation: Los límites de velocidad se publican para condiciones ideales. Si la
    carretera está mojada o helada, si no puede ver bien o si el tráfico es pesado,
    debe reducir la velocidad. Puede recibir una multa por viajar demasiado rápido
    para las condiciones de la carretera, incluso si conduce al límite de velocidad
    indicado.
- id: 239
  category: safe_driving_rules
  question: En condiciones ideales, ¿aproximadamente cuánta distancia se necesita
    para reaccionar y detener el vehículo por completo cuando se viaja a 50 mph?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: D
  explanation: A 50 mph, puede tomarle unos 400 pies reaccionar ante algo que ve y
    detener su vehículo. Eso es aproximadamente la longitud de una manzana de la ciudad.
- id: 240
  category: safe_driving_rules
  question: ¿Cómo se compara la distancia de frenado a 60 mph con la distancia de
    frenado a 30 mph?
  choices:
    A: Toma la mitad de la distancia
    B: Toma exactamente el doble de la distancia
    C: Toma más de tres veces la distancia
    D: Toma cuatro veces la distancia
  answer: C
  explanation: Cuanto más rápido vaya su vehículo, más distancia necesitará para girar,
    reducir la velocidad o detenerse. Detenerse a 60 mph no toma el doble de la distancia
    que a 30 mph, sino más de tres veces la distancia.
- id: 241
  category: safe_driving_rules
  question: ¿A quién debe ceder el paso en una intersección donde no hay una señal
    de alto, una señal de ceda el paso o una señal de tráfico en sentido contrario?
  choices:
    A: A los vehículos que vienen por la izquierda
    B: A los vehículos que vienen por la derecha
    C: A los vehículos que giran a la izquierda
    D: Al vehículo más grande
  answer: B
  explanation: En una intersección donde no hay señal de alto, señal de ceda el paso
    o señal de tráfico en sentido contrario, los conductores deben ceder el paso a
    los vehículos que vienen por la derecha.
- id: 242
  category: safe_driving_rules
  question: Si dos vehículos llegan a una parada de cuatro vías al mismo tiempo, ¿quién
    tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda pasa primero
    B: El vehículo de la derecha pasa primero
    C: El vehículo que viaja más rápido pasa primero
    D: El vehículo que sigue recto pasa primero
  answer: B
  explanation: En una parada de cuatro vías, el conductor que llega primero a la intersección
    pasa primero. Si más de un vehículo llega al mismo tiempo, el vehículo de la derecha
    tiene la prioridad.
- id: 243
  category: sharing_the_road
  question: ¿Qué debe hacer si se encuentra con un peatón que utiliza un perro guía
    o lleva un bastón blanco?
  choices:
    A: Tocar la bocina ligeramente para que sepan que usted está allí
    B: Ceder el derecho de paso solo si están en un cruce de peatones marcado
    C: Darles el derecho de paso absoluto y no usar la bocina
    D: Conducir alrededor de ellos lo más rápido posible
  answer: C
  explanation: Los peatones que utilizan un perro guía o llevan un bastón blanco tienen
    el derecho de paso absoluto. No use la bocina porque podría confundir o asustar
    al peatón.
- id: 244
  category: safe_driving_rules
  question: Al entrar en una glorieta o rotonda, ¿quién debe ceder el derecho de paso?
  choices:
    A: Los conductores que ya están en la glorieta deben ceder el paso a los conductores
      que entran
    B: Los conductores que entran en la glorieta deben ceder el paso a los conductores
      que ya están en ella
    C: El conductor de la izquierda siempre cede el paso
    D: Los vehículos comerciales tienen prioridad sobre los automóviles de pasajeros
  answer: B
  explanation: Los conductores que entran en una glorieta o rotonda deben ceder el
    paso a los conductores que ya se encuentran circulando dentro de ella.
- id: 245
  category: driver_responsibility
  question: Al ser detenido por un vehículo policial, ¿cuándo debe obtener su licencia
    de conducir y el registro del vehículo?
  choices:
    A: Tan pronto como vea las luces de la policía
    B: Mientras el oficial camina hacia su auto
    C: Solo cuando lo solicite el oficial
    D: Antes de detenerse a un lado de la carretera
  answer: C
  explanation: Al ser detenido por un vehículo policial, la policía recomienda limitar
    los movimientos y obtener la licencia de conducir y/o el registro del vehículo
    solo cuando se le solicite.
- id: 246
  category: safe_driving_rules
  question: ¿Cuál es una consecuencia potencial de conducir mucho más lento que otros
    vehículos en la carretera?
  choices:
    A: Mejora el flujo general del tráfico
    B: Tiende a hacer que los vehículos se amontonen detrás de usted y provoca que
      el resto del tráfico intente rebasarlo
    C: Reduce la posibilidad de una colisión por alcance
    D: Le otorga el derecho de paso en todas las intersecciones
  answer: B
  explanation: Ir mucho más lento que otros vehículos puede ser tan malo como el exceso
    de velocidad. Tiende a hacer que los vehículos se acumulen detrás de usted y provoca
    que el resto del tráfico lo adelante.
- id: 247
  category: safe_driving_rules
  question: Al realizar un giro a la izquierda en una intersección, ¿a quién debe
    ceder el paso?
  choices:
    A: A los vehículos que vienen en sentido contrario y siguen recto
    B: A los vehículos que giran a la derecha desde la dirección opuesta
    C: A los vehículos que vienen detrás de usted
    D: A nadie, los vehículos que giran a la izquierda tienen el derecho de paso
  answer: A
  explanation: Los conductores que giran a la izquierda deben ceder el paso a los
    vehículos que vienen en sentido contrario y continúan recto.
- id: 248
  category: safe_driving_rules
  question: ¿Qué debe hacer si usted y otro vehículo llegan a una parada de cuatro
    vías exactamente al mismo tiempo?
  choices:
    A: El vehículo de la izquierda pasa primero.
    B: El vehículo de la derecha pasa primero.
    C: El vehículo que sigue recto pasa primero.
    D: El vehículo más grande pasa primero.
  answer: B
  explanation: De acuerdo con el manual, en una parada de cuatro vías, si más de un
    vehículo llega al mismo tiempo, el vehículo de la derecha tiene la prioridad de
    paso.
- id: 249
  category: sharing_the_road
  question: ¿Qué debe hacer si se encuentra en medio de una intersección cuando ve
    o escucha que se aproxima un vehículo de emergencia?
  choices:
    A: Detenerse inmediatamente en medio de la intersección.
    B: Orillarse al lado derecho de la intersección y detenerse.
    C: Cruzar la intersección antes de orillarse a la derecha y detenerse.
    D: Poner su vehículo en reversa y salir de la intersección.
  answer: C
  explanation: El manual establece que si se encuentra en una intersección cuando
    se aproxima un vehículo de emergencia, debe terminar de cruzar la intersección
    antes de orillarse.
- id: 250
  category: sharing_the_road
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar con sus luces
    rojas intermitentes encendidas?
  choices:
    A: Cuando el autobús está en el lado opuesto de una carretera estándar de dos
      carriles.
    B: Cuando se aproxima al autobús en una intersección.
    C: Cuando el autobús viaja hacia usted y una mediana o barrera física separa la
      calzada.
    D: Cuando conduce en el carril adyacente al autobús.
  answer: C
  explanation: No es obligatorio detenerse si el autobús viaja hacia usted y una mediana
    u otra barrera física separa los sentidos de la carretera.
- id: 251
  category: safe_driving_rules
  question: ¿Qué señal de giro debe utilizar cuando esté a punto de llegar a su punto
    de salida previsto en una rotonda?
  choices:
    A: Señal de giro a la izquierda.
    B: Señal de giro a la derecha.
    C: Ambas señales de giro (luces de emergencia).
    D: No se requiere señal de giro en una rotonda.
  answer: B
  explanation: El manual indica a los conductores que utilicen la señal de giro a
    la derecha cuando estén a punto de llegar al punto de salida previsto en una rotonda.
- id: 252
  category: safe_driving_rules
  question: ¿Dónde es siempre ilegal realizar un giro en U?
  choices:
    A: En un vecindario residencial.
    B: En una calle de la ciudad de varios carriles.
    C: En una autopista (expressway).
    D: En una intersección con luz verde.
  answer: C
  explanation: 'El manual establece explícitamente: "Nunca realice un giro en U en
    una autopista (expressway)".'
- id: 253
  category: safe_driving_rules
  question: ¿Cómo debe posicionar las ruedas al estacionar en una pendiente?
  choices:
    A: Gírelas bruscamente en dirección contraria al bordillo.
    B: Manténgalas perfectamente rectas.
    C: Gírelas bruscamente hacia el lado de la carretera o hacia el bordillo.
    D: Gírelas hacia la izquierda, independientemente de la inclinación.
  answer: C
  explanation: Cuando estacione en una pendiente, debe girar las ruedas bruscamente
    hacia el lado de la carretera o el bordillo para que, si el vehículo rueda, lo
    haga lejos del tráfico.
- id: 254
  category: safe_driving_rules
  question: ¿A menos de cuántos pies de un hidrante de incendios es ilegal estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: A
  explanation: El manual enumera "A menos de 10 pies de un hidrante de incendios"
    bajo las zonas donde no se permite estacionar.
- id: 255
  category: safe_driving_rules
  question: ¿A menos de cuántos pies de una señal de alto (stop) no debe estacionar
    su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: C
  explanation: El manual prohíbe estacionar "A menos de 25 pies de una señal de alto
    (stop)".
- id: 256
  category: safe_driving_rules
  question: Según el manual, ¿qué debe hacer si enciende los limpiaparabrisas debido
    a la lluvia o la nieve?
  choices:
    A: Encender las luces de emergencia.
    B: Encender las luces altas.
    C: Encender los faros delanteros.
    D: Encender las luces de estacionamiento.
  answer: C
  explanation: 'El manual establece: "Recuerde, si enciende los limpiaparabrisas,
    encienda los faros delanteros. Es la ley".'
- id: 257
  category: defensive_driving
  question: ¿Por qué debe usar las luces bajas en lugar de las luces altas en condiciones
    de niebla o lluvia intensa?
  choices:
    A: Las luces altas agotan la batería del vehículo más rápido en climas fríos.
    B: La luz de las luces altas se reflejará, causando deslumbramiento.
    C: Las luces bajas son más brillantes que las luces altas en condiciones de niebla.
    D: Es ilegal usar las luces altas durante el día.
  answer: B
  explanation: Use las luces bajas en la niebla o cuando esté nevando o lloviendo
    fuerte porque la luz de las luces altas se reflejará, causando deslumbramiento
    y dificultando la visión hacia adelante.
- id: 258
  category: safe_driving_rules
  question: Al acercarse a un vehículo que viene en sentido contrario por la noche,
    ¿a qué distancia debe atenuar las luces altas?
  choices:
    A: A una distancia aproximada de una cuadra.
    B: A menos de 100 pies.
    C: A menos de 500 pies.
    D: Solo cuando el otro conductor haga parpadear sus luces.
  answer: A
  explanation: El manual instruye a los conductores a "Atenuar las luces altas siempre
    que se encuentre a una distancia aproximada de una cuadra de un vehículo que viene
    en sentido contrario".
- id: 259
  category: safe_driving_rules
  question: Las luces altas le permiten ver a unos 400 pies de distancia. ¿Cuál es
    la velocidad máxima recomendada para asegurar que pueda detenerse dentro de esta
    distancia?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: Sus faros de luz alta le permiten ver a unos 400 pies de distancia.
    Debe conducir a una velocidad que le permita detenerse dentro de esta distancia,
    o aproximadamente a 50 mph.
- id: 260
  category: safe_driving_rules
  question: ¿Cuándo está permitido entrar en una intersección?
  choices:
    A: Tan pronto como la luz cambie a verde, independientemente del tráfico que haya
      adelante.
    B: Solo cuando pueda atravesarla por completo sin tener que detenerse.
    C: Cuando necesite hacer un giro y esté esperando un espacio en el tráfico que
      viene en sentido contrario.
    D: Siempre que esté siguiendo a un camión grande.
  answer: B
  explanation: Los conductores no pueden entrar en una intersección a menos que puedan
    atravesarla sin tener que detenerse, asegurándose de no bloquear la intersección.
- id: 261
  category: safe_driving_rules
  question: 'Al estacionar en paralelo a un bordillo (curb), es ilegal estacionar
    su vehículo:'
  choices:
    A: A menos de seis pulgadas del bordillo.
    B: A más de un pie del bordillo.
    C: Mirando en la misma dirección que el tráfico.
    D: Con el freno de mano puesto.
  answer: B
  explanation: La sección de Zonas de No Estacionar establece que no debe estacionar
    "A más de un pie del bordillo".
- id: 262
  category: defensive_driving
  question: ¿Cuándo debe usar un toque fuerte de bocina en lugar de un toque ligero?
  choices:
    A: Al saludar a un amigo.
    B: Cuando un niño está a punto de correr hacia la calle.
    C: Cuando un conductor no está prestando atención.
    D: Al acercarse a caballos.
  answer: B
  explanation: Según el manual, debe tocar la bocina con un sonido fuerte cuando haya
    peligro, como un niño o una persona mayor a punto de caminar, correr o circular
    hacia la calle.
- id: 263
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe intentar señalizar antes de realizar un movimiento
    para cambiar de dirección?
  choices:
    A: Al menos un segundo.
    B: Al menos tres segundos.
    C: Al menos cinco segundos.
    D: Al menos diez segundos.
  answer: B
  explanation: El manual aconseja a los conductores intentar señalizar al menos tres
    segundos antes de realizar un movimiento.
- id: 264
  category: defensive_driving
  question: ¿Qué debe hacer si tiene la intención de girar hacia una entrada privada
    (driveway) justo después de una intersección?
  choices:
    A: Señalizar antes de entrar en la intersección para dar suficiente aviso.
    B: Esperar hasta llegar a la intersección antes de señalizar.
    C: Usar las luces de emergencia en lugar de la señal de giro.
    D: Tocar la bocina tres veces antes de señalizar.
  answer: B
  explanation: Si hay calles, entradas o intersecciones entre usted y el lugar donde
    desea girar, espere hasta haber llegado a ese punto antes de señalizar para que
    otros conductores no se confundan y se interpongan en su camino.
- id: 265
  category: defensive_driving
  question: ¿Cómo puede avisar a los conductores que vienen detrás de que está a punto
    de reducir la velocidad en un lugar inesperado?
  choices:
    A: Encender las luces altas.
    B: Tocar el pedal del freno rápidamente tres o cuatro veces.
    C: Tocar la bocina con un sonido fuerte.
    D: Poner el vehículo en punto muerto (neutral) y avanzar por inercia.
  answer: B
  explanation: Si va a detenerse o reducir la velocidad donde otro conductor no lo
    espera, toque el pedal del freno rápidamente tres o cuatro veces para avisar a
    quienes vienen detrás que está a punto de disminuir la velocidad.
- id: 266
  category: vehicle_information
  question: Si su vehículo se avería en la carretera y no puede sacarlo de la calzada,
    ¿dónde debería intentar detenerse?
  choices:
    A: Justo después de una colina.
    B: Justo después de una curva cerrada.
    C: Donde otros conductores tengan una visión clara de su vehículo.
    D: En el carril central del tráfico.
  answer: C
  explanation: Si no puede sacar su vehículo de la calzada, intente detenerse donde
    otros conductores tengan una visión clara de su vehículo, y no se detenga justo
    después de una colina o en una curva.
- id: 267
  category: defensive_driving
  question: ¿Cuál de las siguientes es una forma recomendada de señalizar una emergencia
    del vehículo si su automóvil se avería?
  choices:
    A: Pararse en la calzada y agitar los brazos.
    B: Atar un paño blanco a la antena, al espejo lateral o a la manija de la puerta.
    C: Tocar la bocina continuamente durante cinco minutos.
    D: Apagar y encender los faros rápidamente.
  answer: B
  explanation: Para señalizar una emergencia, puede levantar el capó o atar un paño
    blanco a la antena, al espejo lateral o a la manija de la puerta. El manual establece
    explícitamente que nunca debe pararse en la calzada.
- id: 268
  category: vehicle_information
  question: ¿Qué es lo primero que debe hacer si sus frenos dejan de funcionar repentinamente?
  choices:
    A: Poner el vehículo en punto muerto (neutral) inmediatamente.
    B: Tirar del freno de mano tan fuerte y rápido como sea posible.
    C: Bombear el pedal del freno varias veces.
    D: Apagar el motor.
  answer: C
  explanation: Si sus frenos dejan de funcionar, primero debe bombear el pedal del
    freno varias veces, lo que a menudo generará suficiente presión de frenado para
    permitirle detenerse.
- id: 269
  category: vehicle_information
  question: ¿Cuál es la respuesta adecuada si experimenta el reventón repentino de
    un neumático mientras conduce?
  choices:
    A: Frenar bruscamente y detenerse en la carretera de inmediato.
    B: Sujetar el volante con firmeza, seguir recto y reducir la velocidad gradualmente.
    C: Girar el volante bruscamente hacia el lado del reventón.
    D: Acelerar para mantener el control del impulso del vehículo.
  answer: B
  explanation: Si un neumático se desinfla repentinamente, sujete el volante con firmeza,
    mantenga el vehículo recto y reduzca la velocidad gradualmente quitando el pie
    del acelerador y usando los frenos ligeramente.
- id: 270
  category: vehicle_information
  question: Si el motor se apaga mientras conduce, ¿qué debe esperar con respecto
    a los controles de su vehículo?
  choices:
    A: El volante se bloqueará inmediatamente.
    B: Los frenos dejarán de funcionar por completo.
    C: Puede ser difícil girar el volante y es posible que deba presionar el pedal
      del freno con mucha fuerza.
    D: El vehículo se pondrá automáticamente en posición de estacionamiento (park).
  answer: C
  explanation: Si el motor se apaga (falla de energía), mantenga el volante sujeto
    con firmeza, ya que puede ser difícil girar. Los frenos seguirán funcionando,
    pero es posible que deba presionar el pedal del freno con mucha fuerza.
- id: 271
  category: vehicle_information
  question: ¿Qué debe hacer si el pedal del acelerador se queda pegado y el motor
    sigue acelerando cada vez más?
  choices:
    A: Cambiar rápidamente a punto muerto (neutral).
    B: Girar el encendido a la posición de 'bloqueo' (lock) inmediatamente.
    C: Bombear el pedal del acelerador repetidamente.
    D: Aplicar el freno de estacionamiento bruscamente.
  answer: A
  explanation: Si el pedal del acelerador se queda pegado, debe mantener la vista
    en la carretera, cambiar rápidamente a punto muerto (neutral), salir de la carretera
    cuando sea seguro y apagar el motor.
- id: 272
  category: safe_driving_rules
  question: ¿Por qué nunca debe girar el encendido de su vehículo a la posición de
    'bloqueo' (lock) mientras todavía está en movimiento?
  choices:
    A: Hará que el motor se incendie.
    B: El volante se bloqueará y perderá el control de su vehículo.
    C: Hará que los neumáticos estallen.
    D: El pedal del acelerador se quedará pegado.
  answer: B
  explanation: Nunca gire el encendido de su vehículo a la posición de 'bloqueo' (lock)
    mientras esté en movimiento, o el volante se bloqueará y perderá el control de
    su vehículo.
- id: 273
  category: vehicle_information
  question: ¿Cómo debe frenar si necesita detenerse rápidamente y su vehículo está
    equipado con un Sistema de Frenos Antibloqueo (ABS)?
  choices:
    A: Bombear los frenos rápidamente para evitar derrapar.
    B: Presionar el pedal del freno con toda su fuerza y mantenerlo presionado.
    C: Aplicar los frenos ligeramente y cambiar a una marcha más baja.
    D: Soltar el pedal del freno si siente que este lo empuja hacia atrás.
  answer: B
  explanation: Con ABS, si necesita detenerse rápidamente, presione el pedal del freno
    con toda su fuerza y manténgalo presionado. No lo suelte si siente que el pedal
    lo empuja hacia atrás, ya que el sistema solo funciona con el pedal presionado.
- id: 274
  category: vehicle_information
  question: Si debe detenerse rápidamente y su vehículo NO tiene ABS, ¿qué debe hacer
    si los frenos se bloquean y el vehículo comienza a derrapar?
  choices:
    A: Soltar rápidamente el pedal del freno y luego volver a presionarlo tan pronto
      como el vehículo deje de derrapar.
    B: Presionar más fuerte el pedal del freno hasta que el vehículo se detenga.
    C: Tirar del freno de estacionamiento inmediatamente.
    D: Girar el volante bruscamente en la dirección opuesta al derrape.
  answer: A
  explanation: Sin ABS, si los frenos se bloquean y siente que el vehículo comienza
    a derrapar, suelte rápidamente el pedal del freno. Tan pronto como el vehículo
    deje de derrapar, vuelva a presionar el pedal del freno.
- id: 275
  category: defensive_driving
  question: Al intentar evitar una colisión, ¿qué es generalmente cierto acerca de
    girar en comparación con detenerse?
  choices:
    A: Siempre es mejor chocar de frente que salirse de la carretera.
    B: Por lo general, puede detener el vehículo más rápido de lo que puede girarlo.
    C: En la mayoría de los casos, puede girar el vehículo más rápido de lo que puede
      detenerlo.
    D: Nunca debe girar para evitar una colisión si conduce sin ABS.
  answer: C
  explanation: El manual establece que, en la mayoría de los casos, se puede girar
    el vehículo más rápido de lo que se puede detener, y se debe considerar girar
    para evitar una colisión. También señala que generalmente es mejor salirse de
    la carretera que chocar de frente.
- id: 276
  category: vehicle_information
  question: ¿Cuál es la causa principal de que un vehículo derrape?
  choices:
    A: Conducir con neumáticos poco inflados
    B: Viajar demasiado rápido para las condiciones del camino
    C: Aplicar el freno de estacionamiento mientras se está en movimiento
    D: Girar el volante con demasiada brusquedad a bajas velocidades
  answer: B
  explanation: Según el manual, los derrapes ocurren cuando un conductor viaja demasiado
    rápido para las condiciones, lo que hace que los neumáticos pierdan su agarre
    en la carretera.
- id: 277
  category: defensive_driving
  question: Si su vehículo comienza a derrapar, ¿qué es lo primero que debe hacer?
  choices:
    A: Bombear los frenos rápidamente
    B: Girar el volante en la dirección opuesta al derrape
    C: No pisar el freno
    D: Acelerar para recuperar la tracción
  answer: C
  explanation: El manual establece que si su vehículo comienza a derrapar, debe mantenerse
    alejado del freno. Hasta que el vehículo disminuya la velocidad, sus frenos no
    funcionarán y podrían hacer que derrape más.
- id: 278
  category: defensive_driving
  question: Si está a punto de ser golpeado por delante, ¿cuál es la mejor acción
    a tomar para disminuir las lesiones?
  choices:
    A: Bloquear los frenos y prepararse para el impacto
    B: Intentar girar el vehículo para recibir un 'golpe de refilón'
    C: Poner las manos frente a su cara
    D: Acelerar para reducir el tiempo de impacto
  answer: B
  explanation: Si su vehículo está a punto de ser golpeado por delante, es importante
    intentar recibir un 'golpe de refilón' en lugar de ser golpeado de frente, girando
    el vehículo.
- id: 279
  category: defensive_driving
  question: ¿Qué debe hacer para prepararse si su vehículo está a punto de ser golpeado
    por detrás?
  choices:
    A: Inclinarse hacia adelante hacia el volante
    B: Desabrocharse el cinturón de seguridad para escapar rápidamente
    C: Presionarse contra el respaldo de su asiento y colocar la cabeza contra el
      reposacabezas
    D: Poner su vehículo de lado
  answer: C
  explanation: Si lo golpean por detrás, su cuerpo será lanzado hacia atrás. Debe
    presionarse contra el respaldo de su asiento, apoyar la cabeza contra el reposacabezas
    y estar preparado para aplicar los frenos.
- id: 280
  category: driver_responsibility
  question: ¿Qué debe hacer si se ve involucrado en un accidente con un vehículo estacionado
    y no puede localizar al propietario?
  choices:
    A: Abandonar la escena e informarlo a su compañía de seguros más tarde
    B: Esperar junto al vehículo hasta que regrese el propietario
    C: Dejar una nota en un lugar visible con la fecha, la hora y su información de
      contacto
    D: Llamar a una grúa para mover el vehículo estacionado
  answer: C
  explanation: Si el accidente involucra a un vehículo estacionado y no puede encontrar
    al propietario, debe dejar una nota en un lugar donde se pueda ver con la fecha
    y hora del accidente e información sobre cómo el propietario puede contactarlo.
- id: 281
  category: driver_responsibility
  question: ¿Bajo qué circunstancias debe mover a una persona lesionada en la escena
    de un accidente?
  choices:
    A: Solo si se encuentran en un vehículo en llamas o en otro peligro inmediato
      de ser atropellados
    B: Siempre que se quejen de dolor de espalda o cuello
    C: Tan pronto como sea posible para sacarlos de la calzada
    D: Solo si le piden que les ayude a ponerse de pie
  answer: A
  explanation: No mueva a los heridos a menos que se encuentren en un vehículo en
    llamas o en otro peligro inmediato de ser atropellados por otro vehículo, ya que
    mover a una persona puede empeorar sus lesiones.
- id: 282
  category: driver_responsibility
  question: Si alguien resulta herido en un choque y sangra profusamente, ¿qué debe
    hacer?
  choices:
    A: Darle mucha agua para beber
    B: Aplicar presión directamente sobre la herida con la mano o un paño
    C: Moverlo al costado de la carretera inmediatamente
    D: Esperar a los paramédicos antes de intentar detener el sangrado
  answer: B
  explanation: Si hay sangrado, aplique presión directamente sobre la herida con la
    mano o con un paño. Incluso el sangrado severo casi siempre se puede detener o
    reducir aplicando presión sobre la herida.
- id: 283
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas continuas en el borde derecho de la calzada?
  choices:
    A: El centro de una carretera de doble sentido
    B: Un carril reservado para vehículos de alta ocupación
    C: Dónde se encuentra el borde derecho de la carretera
    D: Que se aproxima un cruce de peatones
  answer: C
  explanation: Las líneas de borde son líneas continuas a lo largo del costado de
    la carretera que le indican dónde se encuentra el borde de la misma. Las líneas
    blancas continuas se utilizan en el borde derecho de la calzada.
- id: 284
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla discontinua junto a una línea amarilla
    continua?
  choices:
    A: Se permite rebasar en ambos lados
    B: Se permite rebasar en el lado de la línea discontinua, pero no en el lado de
      la línea continua
    C: No se permite rebasar en ninguno de los dos lados
    D: El carril está reservado solo para giros a la izquierda
  answer: B
  explanation: Una línea amarilla discontinua junto a una línea amarilla continua
    indica que se permite rebasar en el lado de la línea discontinua, pero no en el
    lado de la línea continua.
- id: 285
  category: safe_driving_rules
  question: ¿Cuándo se le permite cruzar líneas amarillas dobles continuas?
  choices:
    A: Al rebasar a un vehículo que circula despacio
    B: Al realizar un giro a la izquierda hacia o desde un callejón, camino privado,
      entrada o calle
    C: Cuando el vehículo de adelante se detiene para un peatón
    D: Nunca se le permite cruzar líneas amarillas dobles continuas
  answer: B
  explanation: Las líneas amarillas dobles continuas marcan el centro de la calzada.
    Sin embargo, se pueden cruzar las líneas amarillas continuas para realizar un
    giro a la izquierda hacia o desde un callejón, camino privado, entrada o calle.
- id: 286
  category: signs_and_signals
  question: ¿Qué indica generalmente un diamante blanco pintado en la superficie de
    la carretera?
  choices:
    A: Un cruce de peatones
    B: Un carril reservado para uso especial, como vehículos de alta ocupación (HOV)
    C: Un carril central compartido para giros
    D: Una línea de ceda el paso
  answer: B
  explanation: Los carriles reservados están marcados con señales que indican que
    el carril es para uso especial y, a menudo, tienen un diamante blanco colocado
    al costado de la carretera o pintado en la superficie de la misma.
- id: 287
  category: safe_driving_rules
  question: ¿Cuál es el propósito de un carril central compartido?
  choices:
    A: Para rebasar vehículos que circulan despacio
    B: Para estacionar durante emergencias
    C: Para realizar giros a la izquierda o giros en U cuando esté permitido
    D: Solo para vehículos de alta ocupación
  answer: C
  explanation: Los carriles centrales compartidos están reservados para realizar giros
    a la izquierda (o giros en U cuando están permitidos), pero pueden ser utilizados
    por vehículos que viajan en ambas direcciones.
- id: 288
  category: driver_responsibility
  question: ¿Cuándo es legalmente obligatorio reportar un accidente a la policía?
  choices:
    A: Solo si los daños superan los $1,000
    B: Solo si uno de los conductores no tiene seguro
    C: Si hay un herido, una muerte o daños a la propiedad
    D: Solo si el accidente ocurre en una carretera estatal
  answer: C
  explanation: 'El manual establece: ''Debe reportar el accidente a la policía si
    hay un herido, una muerte o daños a la propiedad''.'
- id: 289
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas continuas entre carriles de tráfico que
    se mueven en la misma dirección?
  choices:
    A: Puede cruzar libremente para cambiar de carril
    B: Debe permanecer en su carril a menos que una situación especial requiera que
      cambie de carril
    C: El carril está terminando y debe incorporarse a la izquierda
    D: Se está aproximando a una cabina de peaje
  answer: B
  explanation: Las líneas blancas continuas se encuentran entre los carriles de tráfico
    e indican que debe permanecer en su carril a menos que una situación especial
    requiera que cambie de carril.
- id: 290
  category: signs_and_signals
  question: ¿Qué indica una señal con forma de pentágono?
  choices:
    A: Cruce de ferrocarril
    B: Zona escolar y cruce escolar
    C: Zona de no rebasar
    D: Ceder el paso
  answer: B
  explanation: Según el manual, la forma de pentágono (cinco lados) marca las zonas
    escolares y advierte sobre los cruces escolares.
- id: 291
  category: signs_and_signals
  question: ¿Qué significa una 'X' amarilla fija sobre un carril reversible?
  choices:
    A: El carril es solo para girar.
    B: Puede usar el carril debajo de ella de forma segura.
    C: El uso del carril está cambiando y debe salirse de él tan pronto como sea seguro.
    D: No puede usar el carril bajo ninguna circunstancia.
  answer: C
  explanation: Una 'X' amarilla fija significa que el uso del carril está cambiando
    y debe salirse de él tan pronto como sea seguro hacerlo.
- id: 292
  category: safe_driving_rules
  question: ¿Qué debe hacer si ya se encuentra en la intersección cuando el semáforo
    cambia a amarillo?
  choices:
    A: Detenerse inmediatamente en medio de la intersección.
    B: Retroceder para salir de la intersección.
    C: No detenerse y continuar a través de la intersección.
    D: Orillarse a un lado de la intersección y esperar a que la luz cambie a verde.
  answer: C
  explanation: El manual establece que si se encuentra en la intersección cuando se
    enciende la luz amarilla, no se detenga; continúe a través de la intersección.
- id: 293
  category: signs_and_signals
  question: ¿Qué color de señal se utiliza para indicar parques y áreas recreativas?
  choices:
    A: Azul
    B: Verde
    C: Naranja
    D: Marrón
  answer: D
  explanation: Según el manual, el color marrón se utiliza para las señales de parques
    y recreación.
- id: 294
  category: signs_and_signals
  question: ¿Qué indica una luz roja intermitente en una señal de cruce peatonal activado
    de alta intensidad (HAWK)?
  choices:
    A: La señal está a punto de desactivarse; los conductores deben detenerse pero
      pueden avanzar cuando los peatones hayan despejado el cruce.
    B: Los peatones se encuentran actualmente en el cruce y los automovilistas deben
      permanecer detenidos.
    C: La señal no ha sido activada y los vehículos pueden avanzar sin detenerse.
    D: La señal peatonal está a punto de cambiar a amarillo fijo.
  answer: A
  explanation: Una señal HAWK roja intermitente significa que la señal está a punto
    de desactivarse. Los conductores deben detenerse, pero pueden avanzar cuando los
    peatones hayan despejado el cruce peatonal.
- id: 295
  category: sharing_the_road
  question: ¿Qué indica una marca de carril compartido para bicicletas o 'sharrow'
    (dos galones pintados sobre el símbolo de una bicicleta)?
  choices:
    A: El carril está reservado solo para bicicletas.
    B: El carril es compartido y puede haber tráfico de vehículos o bicicletas en
      él.
    C: Se prohíbe el uso del carril a las bicicletas.
    D: Hay un cruce de bicicletas más adelante.
  answer: B
  explanation: Una marca de carril compartido o 'sharrow' indica que el carril es
    compartido. Puede haber tráfico de vehículos o bicicletas en el carril, sirviendo
    como una advertencia adicional para estar atento a las bicicletas.
- id: 296
  category: signs_and_signals
  question: ¿Dónde se coloca normalmente una señal de 'Zona de no adelantar' (No Passing
    Zone) con forma de banderín?
  choices:
    A: En el lado derecho de una autopista de cuatro carriles.
    B: En el lado izquierdo de una carretera de dos carriles y doble sentido.
    C: Sobre el centro de una intersección.
    D: En el lado derecho de una calle de sentido único.
  answer: B
  explanation: El manual establece que la señal de tres lados en forma de banderín
    se utiliza en el lado izquierdo de una carretera de dos carriles y doble sentido
    al comienzo de una ZONA DE NO ADELANTAR.
- id: 297
  category: signs_and_signals
  question: 'Una luz de semáforo roja intermitente significa lo mismo que:'
  choices:
    A: Una señal de ceda el paso (Yield)
    B: Una señal de alto (Stop)
    C: Una señal de advertencia
    D: Una señal de no entrar (Do Not Enter)
  answer: B
  explanation: Una luz de semáforo roja intermitente significa lo mismo que una señal
    de alto. Debe detenerse por completo y puede avanzar cuando sea seguro hacerlo.
- id: 298
  category: safe_driving_rules
  question: ¿Qué indica una línea blanca sólida doble en el pavimento?
  choices:
    A: Marca un carril central compartido para giros a la izquierda.
    B: Canaliza el tráfico alrededor de un peligro.
    C: Prohíbe el cambio de carril.
    D: Indica un carril reversible.
  answer: C
  explanation: Según la sección del manual sobre marcas en el pavimento, una línea
    blanca sólida doble prohíbe el cambio de carril.
- id: 299
  category: signs_and_signals
  question: ¿Qué tipo de información proporcionan las señales de tráfico naranjas?
  choices:
    A: Direcciones y distancias a las ciudades.
    B: Reglas para la dirección y velocidad del tráfico.
    C: Servicios disponibles a lo largo de la carretera.
    D: Posibles peligros más adelante debido a proyectos de construcción y mantenimiento.
  answer: D
  explanation: El naranja se utiliza para las señales de advertencia para alertarle
    sobre posibles peligros más adelante debido a proyectos de construcción y mantenimiento.
- id: 300
  category: safe_driving_rules
  question: ¿Cuándo se le permite girar a la derecha con una luz roja de semáforo?
  choices:
    A: Solo cuando también está iluminada una flecha verde.
    B: Después de detenerse por completo, verificar el tráfico y si ninguna señal
      lo prohíbe.
    C: Sin detenerse, siempre que no haya peatones en el cruce.
    D: Nunca se permiten los giros a la derecha en rojo.
  answer: B
  explanation: Si va a girar a la derecha en rojo, puede hacerlo después de detenerse
    por completo y verificar que no haya tráfico aproximándose ni ninguna señal que
    prohíba el giro con luz roja.
- id: 301
  category: signs_and_signals
  question: ¿Qué señal se describe como un letrero cuadrado con una línea horizontal
    blanca dentro de un círculo rojo?
  choices:
    A: Señal de Pare (Stop)
    B: Señal de Ceda el paso (Yield)
    C: Señal de No entrar (Do Not Enter)
    D: Señal de Sentido contrario (Wrong Way)
  answer: C
  explanation: Una señal cuadrada con una línea horizontal blanca dentro de un círculo
    rojo significa que no puede entrar. Esta es la señal de No entrar (Do Not Enter).
- id: 302
  category: safe_driving_rules
  question: ¿Qué indica una marca en forma de diamante en la calzada?
  choices:
    A: Un carril reservado para bicicletas.
    B: Un carril reservado solo para autobuses.
    C: Un carril reservado para vehículos con más de una persona en ellos (HOV).
    D: Una obstrucción fija más adelante.
  answer: C
  explanation: Una marca en forma de diamante indica carriles 'HOV' (Vehículos de
    alta ocupación), los cuales están reservados para vehículos con más de una persona
    en ellos.
- id: 303
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico con una flecha amarilla?
  choices:
    A: Puede girar con seguridad en la dirección de la flecha.
    B: La protección de una flecha verde está terminando y debe prepararse para detenerse.
    C: Debe detenerse y no puede ir en esa dirección.
    D: Ceda el paso a los peatones antes de girar.
  answer: B
  explanation: Una flecha amarilla significa que la protección de una flecha verde
    está terminando; si está girando en la dirección de la flecha, debe prepararse
    para detenerse.
- id: 304
  category: signs_and_signals
  question: ¿Qué indica una señal cuadrada con una línea horizontal blanca dentro
    de un círculo rojo?
  choices:
    A: Debe ceder el paso al tráfico que viene en sentido contrario.
    B: No puede entrar a la vía.
    C: Hay un cruce de ferrocarril más adelante.
    D: Se aproxima a una zona escolar.
  answer: B
  explanation: Según el manual, una señal cuadrada con una línea horizontal blanca
    dentro de un círculo rojo es una señal de 'No entrar' (Do Not Enter), lo que significa
    que no puede entrar.
- id: 305
  category: signs_and_signals
  question: ¿De qué color y forma son la mayoría de las señales de advertencia?
  choices:
    A: Rojas y octogonales
    B: Verdes y rectangulares
    C: Amarillas y en forma de diamante
    D: Azules y cuadradas
  answer: C
  explanation: El manual establece que las señales de advertencia suelen ser amarillas
    con letras o símbolos negros, y la mayoría tiene forma de diamante.
- id: 306
  category: safe_driving_rules
  question: 'Al conducir sobre pavimento mojado donde hay una señal de ''Resbaladizo
    cuando está mojado'' (Slippery when Wet), usted debe:'
  choices:
    A: Frenar bruscamente para probar la superficie de la carretera.
    B: Aumentar la distancia entre su vehículo y el de adelante.
    C: Cambiar de dirección rápidamente para evitar los charcos.
    D: Mantener su velocidad y distancia de seguimiento normales.
  answer: B
  explanation: Cuando el pavimento está mojado, debe reducir su velocidad, evitar
    frenar bruscamente o cambiar de dirección repentinamente, y aumentar la distancia
    entre su vehículo y el de adelante.
- id: 307
  category: signs_and_signals
  question: ¿Cuál es el propósito de una baliza rectangular de destello rápido (RRFB)?
  choices:
    A: Advertir a los conductores sobre un cruce de ferrocarril más adelante.
    B: Indicar una ruta de desvío en una zona de construcción.
    C: Permitir que los peatones crucen las calles de manera segura en áreas de alto
      volumen de tráfico en accesos no controlados.
    D: Señalar que una autopista dividida está terminando.
  answer: C
  explanation: Una RRFB está diseñada para permitir que los peatones crucen de manera
    segura las calles con altos volúmenes de tráfico en accesos no controlados en
    intersecciones sin semáforos o cruces de peatones a mitad de cuadra.
- id: 308
  category: sharing_the_road
  question: Cuando una señal de 'Incorporación' (Merge) indica que dos carriles de
    tráfico están a punto de convertirse en uno, ¿quién es responsable de incorporarse
    sin problemas?
  choices:
    A: Solo los conductores en el carril que termina.
    B: Solo los conductores en el carril que continúa.
    C: Los conductores en ambos carriles.
    D: El vehículo que viaja a la velocidad más alta.
  answer: C
  explanation: El manual establece que cuando dos carriles de tráfico están a punto
    de convertirse en uno, los conductores de ambos carriles son responsables de incorporarse
    sin problemas.
- id: 309
  category: signs_and_signals
  question: ¿Qué indican las señales de tráfico de color marrón?
  choices:
    A: Áreas de construcción y mantenimiento
    B: Parques y áreas recreativas
    C: Servicios para automovilistas como gasolineras y hospitales
    D: Información de destino y distancia
  answer: B
  explanation: Las señales de parques y recreación son de color marrón. Le guían hacia
    áreas recreativas y parques.
- id: 310
  category: signs_and_signals
  question: ¿Qué señales tienen forma cuadrada o rectangular y son azules con letras
    o símbolos blancos?
  choices:
    A: Señales de servicio
    B: Señales de advertencia
    C: Señales de zona de obras
    D: Señales de número de ruta
  answer: A
  explanation: Las señales de servicio tienen forma cuadrada o rectangular y son azules
    con letras o símbolos blancos. Muestran la ubicación de diversos servicios, como
    áreas de descanso, gasolineras u hospitales.
- id: 311
  category: signs_and_signals
  question: ¿Cómo se numeran habitualmente los postes de millaje (mileposts) a lo
    largo de una autopista?
  choices:
    A: El cero comienza en las fronteras norte y este del estado.
    B: El cero comienza en las fronteras sur y oeste del estado.
    C: Se numeran aleatoriamente según los números de salida.
    D: El cero comienza en el centro exacto del estado.
  answer: B
  explanation: Los postes de millaje se colocan cada milla a lo largo de la autopista,
    y el cero suele comenzar en las fronteras sur y oeste del estado.
- id: 312
  category: safe_driving_rules
  question: 'Al cruzar vías de ferrocarril, es prudente NO hacer lo siguiente:'
  choices:
    A: Mirar a ambos lados antes de cruzar.
    B: Cambiar de marcha (velocidad) mientras cruza.
    C: Asegurarse de que haya espacio para su vehículo al otro lado.
    D: Ceder el paso a los trenes que cruzan.
  answer: B
  explanation: El manual aconseja que es prudente no cambiar de marcha al cruzar las
    vías del tren porque su vehículo podría calarse.
- id: 313
  category: signs_and_signals
  question: 'Una señal blanca en forma de X (''crossbuck'') en un cruce de ferrocarril
    tiene el mismo significado que una:'
  choices:
    A: Señal de Pare (Stop)
    B: Señal de Ceda el paso (Yield)
    C: Señal de No Entrar (Do Not Enter)
    D: Señal de Límite de Velocidad (Speed Limit)
  answer: B
  explanation: Una señal blanca en forma de X o 'crossbuck' se encuentra en el cruce
    de ferrocarril y tiene el mismo significado que una señal de 'Ceda el paso'. Debe
    ceder el paso a los trenes que cruzan.
- id: 314
  category: signs_and_signals
  question: ¿Qué proporciona una señal azul del Sistema de Notificación de Emergencias
    (ENS) en un cruce de carretera y ferrocarril a nivel?
  choices:
    A: El límite de velocidad actual para los trenes
    B: Un número de teléfono disponible las 24 horas para informar problemas o emergencias
      en el cruce
    C: Direcciones al hospital más cercano
    D: La frecuencia de radio para actualizaciones meteorológicas
  answer: B
  explanation: Una señal azul del Sistema de Notificación de Emergencias proporciona
    al público un número de teléfono disponible las 24 horas, los 7 días de la semana,
    los 365 días del año para llamar e informar problemas o emergencias en estas ubicaciones
    ferroviarias.
- id: 315
  category: signs_and_signals
  question: Si ve una placa con una flecha apuntando hacia abajo debajo de una señal
    de Cruce de Peatones, ¿qué indica?
  choices:
    A: Una ruta de desvío para peatones
    B: La ubicación real del paso de peatones
    C: Que los peatones deben ceder el paso a los vehículos
    D: Una colina empinada más adelante
  answer: B
  explanation: Las señales de Cruce de Peatones pueden tener una placa separada con
    una flecha apuntando hacia abajo, que indica la ubicación real del paso de peatones.
- id: 316
  category: signs_and_signals
  question: ¿Qué le indica hacer una señal de 'Manténgase a la derecha' (Keep Right)?
  choices:
    A: Conducir hacia el lado indicado por la flecha al acercarse a obstrucciones
      en medio de la calzada.
    B: Moverse al carril derecho para permitir que el tráfico más rápido pase.
    C: Solo realizar giros a la derecha en la siguiente intersección.
    D: Estacionar su vehículo en el lado derecho de la carretera.
  answer: A
  explanation: La señal de 'Manténgase a la derecha' le indica por dónde conducir
    cuando se acerca a islas de tráfico, medianas u otras obstrucciones en medio de
    la calzada. Debe conducir hacia el lado indicado por la flecha.
- id: 317
  category: sharing_the_road
  question: ¿Qué es el área "No-Zone"?
  choices:
    A: Una zona donde el estacionamiento está estrictamente prohibido
    B: Un área donde no se permite rebasar
    C: Las áreas de peligro alrededor de un camión donde hay puntos ciegos para el
      conductor
    D: Una zona de silencio designada en áreas residenciales
  answer: C
  explanation: El manual define el área No-Zone como las zonas de peligro alrededor
    de un camión donde existen puntos ciegos para el conductor.
- id: 318
  category: safe_driving_rules
  question: En una parada de cuatro vías (four-way stop), ¿qué vehículo pasa primero?
  choices:
    A: El vehículo a la izquierda
    B: El vehículo a la derecha
    C: El vehículo más grande
    D: El vehículo que va recto
  answer: B
  explanation: Según las respuestas a las preguntas de estudio, en una parada de cuatro
    vías, el vehículo a la derecha pasa primero.
- id: 319
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando cambia de carril?
  choices:
    A: Mirar por encima del hombro en la dirección en la que planea moverse
    B: Confiar únicamente en su espejo retrovisor
    C: Acelerar para incorporarse rápidamente
    D: Tocar los frenos antes de moverse
  answer: A
  explanation: El manual establece que cuando cambia de carril debe mirar por encima
    del hombro en la dirección en la que planea moverse.
- id: 320
  category: defensive_driving
  question: 'Si un vehículo que se aproxima no baja sus luces delanteras, usted debe:'
  choices:
    A: Encender sus luces altas y dejarlas encendidas
    B: Parpadear sus luces delanteras rápidamente un par de veces
    C: Mirar directamente a las luces delanteras que se aproximan
    D: Detenerse a un lado y esperar a que pasen
  answer: B
  explanation: Si un vehículo que se aproxima no baja sus luces delanteras, el manual
    aconseja parpadear sus luces delanteras rápidamente un par de veces.
- id: 321
  category: signs_and_signals
  question: 'Una señal con forma de pentágono significa:'
  choices:
    A: Hay un cruce de ferrocarril
    B: Hay una zona de no rebasar
    C: Hay una zona escolar
    D: Debe ceder el paso
  answer: C
  explanation: Las preguntas de estudio del manual indican que una señal con forma
    de pentágono significa que hay una zona escolar.
- id: 322
  category: signs_and_signals
  question: 'Las señales de tráfico verdes se utilizan como:'
  choices:
    A: Señales reglamentarias
    B: Señales de guía
    C: Señales de advertencia
    D: Señales de alto
  answer: B
  explanation: Según las preguntas de estudio, las señales de tráfico verdes son señales
    de guía.
- id: 323
  category: signs_and_signals
  question: 'Las líneas amarillas continuas entre los carriles indican:'
  choices:
    A: Solo los autos de un lado del carril pueden rebasar
    B: Puede cambiar de carril si decide hacerlo
    C: No se permite rebasar
    D: El carril está terminando
  answer: C
  explanation: Las líneas amarillas continuas entre los carriles indican que no se
    permite rebasar.
- id: 324
  category: vehicle_information
  question: Según el manual, ¿cuál de las siguientes afirmaciones sobre el equipo
    de posventa del vehículo es verdadera?
  choices:
    A: Cualquier cambio en el equipo, como las ventanas tintadas, siempre es legal.
    B: Los cambios de posventa en el equipo, como las ventanas tintadas, no son automáticamente
      legales.
    C: Se requieren ventanas tintadas en todos los vehículos de posventa.
    D: No puede realizar ningún cambio en el equipo de su vehículo.
  answer: B
  explanation: El manual identifica como falsa la afirmación 'Después de la compra,
    cualquier cambio en el equipo, como las ventanas tintadas, es legal', lo que significa
    que tales cambios no son automáticamente legales.
- id: 325
  category: penalties_and_points
  question: ¿Cómo maneja el DMV las consultas sobre la suspensión y revocación de
    la licencia?
  choices:
    A: Solo por teléfono y correo
    B: En persona en cualquier sucursal del DMV
    C: Solo a través del sitio web del DMV
    D: Por correo electrónico y teléfono
  answer: A
  explanation: 'El directorio del DMV señala: ''Tenga en cuenta: Las consultas sobre
    suspensión y revocación se manejan solo por teléfono y correo''.'
- id: 326
  category: license_system
  question: ¿En qué horario están disponibles los agentes del DMV por teléfono para
    consultas generales?
  choices:
    A: De lunes a viernes, de 9 a.m. a 5 p.m.
    B: De lunes a viernes, de 8 a.m. a 4 p.m.
    C: Las 24 horas del día, los 7 días de la semana
    D: Solo los fines de semana, de 8 a.m. a 4 p.m.
  answer: B
  explanation: El manual establece que los agentes del DMV están disponibles de lunes
    a viernes, de 8 a.m. a 4 p.m.
- id: 327
  category: license_system
  question: ¿Cuándo está disponible la información pregrabada del DMV por teléfono?
  choices:
    A: De lunes a viernes, de 8 a.m. a 4 p.m.
    B: Solo durante las horas del fin de semana
    C: Las 24 horas del día
    D: Solo cuando los agentes no están disponibles
  answer: C
  explanation: El directorio del DMV establece que la información pregrabada está
    disponible las 24 horas del día.
- id: 328
  category: vehicle_information
  question: Comprar una "Placa del Sound" (Sound Plate) ayuda a preservar ¿qué recurso
    de Connecticut?
  choices:
    A: El río Connecticut
    B: Parques y bosques estatales
    C: El estrecho de Long Island (Long Island Sound)
    D: Hábitats de vida silvestre locales
  answer: C
  explanation: El manual incluye un aviso para 'Comprar la Placa del Sound' para 'Ayudar
    a preservar el estrecho de Long Island, el recurso atesorado de Connecticut'.
- id: 329
  category: penalties_and_points
  question: Si necesita hablar con un agente sobre un asunto de suspensión, ¿qué días
    están disponibles?
  choices:
    A: De lunes a sábado
    B: De lunes a viernes
    C: De martes a jueves
    D: Solo los fines de semana
  answer: B
  explanation: Para asuntos de suspensión, el manual indica que la disponibilidad
    de los agentes es de lunes a viernes, de 8 a.m. a 4 p.m.
- id: 330
  category: driver_responsibility
  question: ¿Cuál es la visión de la Coalición de Connecticut para la Donación de
    Órganos y Tejidos?
  choices:
    A: Proporcionar atención médica gratuita a todos los conductores
    B: Un mundo donde todos los que necesiten un trasplante de órganos o tejidos lo
      obtengan
    C: Hacer obligatoria la donación de órganos para todos los conductores con licencia
    D: Financiar la investigación de órganos artificiales
  answer: B
  explanation: El manual establece que la Coalición 've un mundo donde todos los que
    necesiten un trasplante de órganos o tejidos lo obtengan'.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 331
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 332
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 333
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de
    manera segura.
  id: 334
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 335
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 336
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 337
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 338
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite adelantar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido rebasar.
  id: 339
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 340
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 341
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 342
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 343
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 344
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 345
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los pasos a nivel. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 346
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 347
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 348
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera gire
    primero en un sentido y luego en el otro.
  id: 349
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 350
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica este letrero que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 351
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la vía y ajuste
    su posición en el carril.
  id: 352
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 353
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 354
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una vía de un solo sentido o de una autopista dividida y
    se encuentre con vehículos que viajan en la dirección opuesta.
  id: 355
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 356
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 357
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 358
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 359
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las carreteras
    laterales.
  id: 360
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 361
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un carril nuevo; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse (merging). El tráfico que entra desde
    la rampa tiene su propio carril nuevo.
  id: 362
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 363
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 364
