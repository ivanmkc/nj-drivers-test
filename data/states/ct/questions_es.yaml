questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima que debe tener una persona para obtener un permiso
    de aprendizaje en Connecticut?
  choices:
    A: 15 años
    B: 15 años y medio
    C: 16 años
    D: 17 años
  answer: C
  explanation: En Connecticut, debe tener al menos 16 años para ser elegible para
    un permiso de aprendizaje.
- id: 2
  category: license_system
  question: Durante los primeros seis meses de tener una licencia de conducir, ¿a
    cuál de los siguientes pasajeros puede transportar un conductor de 16 o 17 años
    en Connecticut?
  choices:
    A: Cualquier amigo mayor de 18 años
    B: Un instructor de manejo con licencia o un padre/tutor
    C: Hasta tres hermanos
    D: Cualquier persona siempre que use el cinturón de seguridad
  answer: B
  explanation: Durante los primeros seis meses, un conductor de 16 o 17 años está
    restringido a transportar a un instructor de manejo con licencia, padres o tutores
    legales (al menos uno de los cuales debe tener una licencia válida), o una persona
    que tenga al menos 20 años y haya tenido una licencia durante cuatro años sin
    suspensiones.
- id: 3
  category: license_system
  question: ¿Cuál es el toque de queda para un conductor con licencia de 16 o 17 años
    en Connecticut?
  choices:
    A: 10 PM a 5 AM
    B: 11 PM a 5 AM
    C: Medianoche a 6 AM
    D: 9 PM a 6 AM
  answer: B
  explanation: La ley de Connecticut prohíbe que los conductores de 16 y 17 años estén
    en la carretera entre las 11 PM y las 5 AM, a menos que sea por empleo, escuela,
    actividades religiosas o necesidad médica.
- id: 4
  category: license_system
  question: En Connecticut, ¿cuántas horas de capacitación al volante se requieren
    para un solicitante de 16 o 17 años antes de que pueda realizar el examen práctico?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 50 horas
  answer: C
  explanation: Connecticut requiere 40 horas de instrucción al volante para los solicitantes
    de 16 y 17 años antes de que sean elegibles para una licencia de conducir.
- id: 5
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    del teléfono celular para un conductor de 16 o 17 años en Connecticut?
  choices:
    A: Solo pueden usar un dispositivo de manos libres.
    B: Solo pueden usar un teléfono celular para navegación GPS.
    C: Se les prohíbe el uso de cualquier dispositivo móvil, incluyendo manos libres,
      mientras conducen.
    D: Pueden usar un teléfono celular si están detenidos en un semáforo en rojo.
  answer: C
  explanation: Los conductores menores de 18 años en Connecticut tienen estrictamente
    prohibido el uso de cualquier dispositivo electrónico móvil mientras conducen,
    incluso si es de manos libres.
- id: 6
  category: license_system
  question: Si un conductor de 16 o 17 años viola las restricciones de pasajeros o
    las leyes de toque de queda, ¿por cuánto tiempo se suspenderá su licencia por
    una primera infracción?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Una primera violación de las restricciones de la Licencia de Conducir
    Graduada (GDL) (pasajeros, toque de queda o teléfono celular) resulta en una suspensión
    de la licencia por 30 días y una tarifa de restauración de la licencia de $175.
- id: 7
  category: license_system
  question: En Connecticut, ¿por cuánto tiempo es válido un permiso de aprendizaje
    desde la fecha de emisión?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: Hasta que el titular cumpla 21 años
  answer: B
  explanation: Un permiso de aprendizaje de Connecticut es válido por dos años a partir
    de la fecha en que se emite.
- id: 8
  category: license_system
  question: Si tiene 18 años de edad o más y solicita una licencia de conducir de
    Connecticut por primera vez, ¿durante cuántos días como mínimo debe tener un permiso
    de aprendizaje para adultos antes de realizar el examen práctico?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Los adultos (mayores de 18 años) que nunca han tenido una licencia
    deben tener un permiso de aprendizaje para adultos durante al menos 90 días antes
    de poder realizar el examen práctico.
- id: 9
  category: license_system
  question: Según la ley de Connecticut, ¿por cuál de las siguientes razones puede
    un oficial de policía confiscar inmediatamente la licencia de conducir de un joven
    de 16 o 17 años durante 48 horas?
  choices:
    A: Cualquier infracción de tránsito
    B: Conducir con más de un pasajero
    C: No usar una señal de giro
    D: Conducir a 10 mph por encima del límite de velocidad
  answer: B
  explanation: La policía puede imponer una suspensión de la licencia en el acto de
    48 horas a jóvenes de 16 y 17 años por ciertas infracciones, incluidas las restricciones
    de pasajeros, violaciones del toque de queda o conducción temeraria.
- id: 10
  category: license_system
  question: ¿Cuál es el requisito mínimo de visión en Connecticut para obtener una
    licencia de conducir sin restricciones?
  choices:
    A: 20/20 en ambos ojos
    B: 20/40 en al menos un ojo
    C: 20/50 en ambos ojos
    D: 20/70 en al menos un ojo
  answer: B
  explanation: Connecticut requiere una visión de al menos 20/40 en al menos un ojo,
    con o sin lentes correctivos, para calificar para una licencia.
- id: 11
  category: license_system
  question: ¿Cuántas horas de instrucción en el aula se requieren como parte del curso
    obligatorio de "Prácticas de Conducción Segura" para todos los nuevos conductores
    de Connecticut (CT)?
  choices:
    A: 4 horas
    B: 8 horas
    C: 12 horas
    D: 15 horas
  answer: B
  explanation: Todos los solicitantes de una nueva licencia de conducir en Connecticut
    deben completar un curso de 8 horas de Prácticas de Conducción Segura, que incluye
    un componente de seguridad sobre drogas y alcohol.
- id: 12
  category: license_system
  question: Si cambia su dirección dentro de Connecticut, ¿dentro de cuántas horas
    debe notificar el cambio al DMV?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 1 semana
  answer: B
  explanation: La ley de Connecticut exige que los residentes notifiquen al DMV un
    cambio de dirección en un plazo de 48 horas.
- id: 13
  category: license_system
  question: En Connecticut, ¿por cuál de las siguientes infracciones se suspenderá
    la licencia de un conductor de 16 o 17 años por 6 meses en su primera ofensa?
  choices:
    A: Exceso de velocidad (20 mph o más sobre el límite)
    B: Conducir bajo la influencia (DUI)
    C: No usar el cinturón de seguridad
    D: Estacionarse en una zona de incendios
  answer: B
  explanation: Una primera ofensa de DUI para un conductor menor de 21 años en Connecticut
    resulta en una suspensión de la licencia de al menos 45 días seguida de un período
    de conducción solo con un Dispositivo de Bloqueo de Encendido (IID), pero la suspensión
    administrativa por el arresto en sí es significativa.
- id: 14
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es aceptable como prueba principal
    de identidad para una licencia de Connecticut que cumpla con la ley REAL ID?
  choices:
    A: Un pasaporte estadounidense válido
    B: Un certificado de nacimiento estadounidense certificado
    C: Una tarjeta de Seguro Social
    D: Una tarjeta de residente permanente
  answer: C
  explanation: Aunque se requiere una tarjeta de Seguro Social para la solicitud,
    se utiliza como prueba del número de Seguro Social (SSN), no como prueba principal
    de identidad o presencia legal. Los documentos de identidad principales incluyen
    pasaportes, certificados de nacimiento o tarjetas de residencia.
- id: 15
  category: license_system
  question: En Connecticut, ¿qué debe completar el padre o tutor legal de un titular
    de permiso de 16 o 17 años antes de que el adolescente pueda realizar el examen
    de conducción?
  choices:
    A: Un curso de conducción defensiva de 5 horas
    B: Una sesión obligatoria de capacitación para padres de 2 horas
    C: Una verificación del registro de 10 horas de conducción supervisada
    D: Un examen escrito sobre las leyes de tránsito de Connecticut
  answer: B
  explanation: La ley de Connecticut exige que el padre o tutor legal de un joven
    de 16 o 17 años asista a una sesión de capacitación para padres de dos horas en
    una escuela de manejo comercial o escuela secundaria.
- id: 16
  category: license_system
  question: Si se muda a Connecticut desde otro estado, ¿cuántos días tiene para transferir
    su licencia de conducir de otro estado a una licencia de Connecticut?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes de Connecticut deben transferir su licencia de
    conducir de otro estado dentro de los 30 días posteriores al establecimiento de
    la residencia.
- id: 17
  category: license_system
  question: En Connecticut, si cambia su nombre legal, ¿dentro de cuántos días debe
    notificar al DMV y obtener un duplicado de la licencia?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Connecticut exige que los conductores notifiquen al DMV un
    cambio de nombre legal y actualicen su licencia en un plazo de 30 días.
- id: 18
  category: license_system
  question: ¿Cuál es el propósito específico del programa de licencia "Solo para Conducir"
    (Drive Only) de Connecticut?
  choices:
    A: Para personas que solo conducen durante las horas del día
    B: Para personas que no pueden establecer presencia legal en los Estados Unidos
    C: Para personas con condiciones médicas que limitan su conducción
    D: Para personas que solo conducen con fines de empleo
  answer: B
  explanation: La licencia "Solo para Conducir" (Drive Only) es para personas indocumentadas
    que tienen 16 años o más y no pueden establecer presencia legal en los Estados
    Unidos.
- id: 19
  category: license_system
  question: Para supervisar al titular de un permiso de aprendizaje en Connecticut,
    el conductor con licencia que lo acompaña debe tener al menos 20 años y haber
    tenido una licencia durante al menos ¿cuántos años consecutivos?
  choices:
    A: 1 año
    B: 2 años
    C: 4 años
    D: 5 años
  answer: C
  explanation: La persona que brinda instrucción al titular de un permiso debe tener
    al menos 20 años y haber tenido una licencia de conducir durante al menos cuatro
    años consecutivos sin haber tenido suspensiones durante ese período.
- id: 20
  category: license_system
  question: Una licencia de conducir estándar de Connecticut se emite normalmente
    por un período de renovación de ¿cuántos años?
  choices:
    A: 2 o 4 años
    B: 4 o 6 años
    C: 6 o 8 años
    D: 5 o 10 años
  answer: C
  explanation: Las licencias de conducir de Connecticut se emiten generalmente por
    un período de seis u ocho años.
- id: 21
  category: license_system
  question: ¿Si un joven de 16 o 17 años es encontrado en posesión de alcohol en un
    lugar público o en una vía pública, su licencia será suspendida por al menos cuántos
    días?
  choices:
    A: 30 días
    B: 60 días
    C: 150 días
    D: 1 año
  answer: C
  explanation: Bajo las leyes de tolerancia cero de Connecticut, un joven de 16 o
    17 años condenado por posesión de alcohol enfrentará una suspensión de licencia
    de 150 días.
- id: 22
  category: license_system
  question: En Connecticut, ¿cuál es la tarifa requerida para restablecer una licencia
    de conducir después de haber sido suspendida?
  choices:
    A: $50
    B: $100
    C: $175
    D: $250
  answer: C
  explanation: Connecticut requiere una tarifa de restablecimiento de $175 para reinstaurar
    una licencia de conducir o registro después de una suspensión.
- id: 23
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que un solicitante de 18
    años o más obtenga una licencia de conducir de Connecticut?
  choices:
    A: Debe completar un curso presencial de 30 horas
    B: Debe completar un curso de 8 horas sobre Prácticas de Conducción Segura
    C: Debe tener un permiso durante 120 días
    D: Está exento de toda formación teórica
  answer: B
  explanation: Todos los solicitantes de una licencia de conducir por primera vez
    en Connecticut, incluidos los de 18 años o más, deben completar un curso de 8
    horas sobre Prácticas de Conducción Segura.
- id: 24
  category: license_system
  question: Para que se agregue el símbolo de estatus de 'Veterano' a una licencia
    de conducir de Connecticut, ¿qué documento debe proporcionar el solicitante al
    Departamento de Asuntos de Veteranos?
  choices:
    A: Un certificado de nacimiento
    B: Formulario DD-214
    C: Una tarjeta de seguro social
    D: Solo una identificación militar
  answer: B
  explanation: Para obtener la bandera de veterano en una licencia, el solicitante
    debe presentar un formulario DD-214 (documentos de baja) al Departamento de Asuntos
    de Veteranos al menos 30 días antes de visitar el DMV.
- id: 25
  category: license_system
  question: En Connecticut, si tiene visión en un solo ojo, ¿cuál es el requisito
    mínimo de agudeza visual para obtener una licencia?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Para las personas con visión en un solo ojo, la agudeza visual debe
    ser de al menos 20/40 en ese ojo para calificar para una licencia de conducir
    de Connecticut.
- id: 26
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar una Licencia de Conducir
    Comercial (CDL) en Connecticut con el propósito de comercio interestatal?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: Aunque puede obtener una CDL para conducir de forma intraestatal (dentro
    de CT) a los 18 años, la ley federal exige que tenga al menos 21 años para el
    comercio interestatal.
- id: 27
  category: license_system
  question: En Connecticut, ¿por cuántos días es válido un permiso de aprendizaje
    de motocicleta?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Un permiso de aprendizaje de motocicleta de Connecticut es válido por
    60 días y puede renovarse una vez por otros 60 días adicionales.
- id: 28
  category: license_system
  question: Bajo la ley 'Motor Voter' en Connecticut, ¿dónde puede registrarse para
    votar o actualizar su registro de votante?
  choices:
    A: Solo en el ayuntamiento (Town Hall)
    B: En el DMV al solicitar o renovar una licencia
    C: Solo en línea a través del Secretario de Estado
    D: En cualquier estación de policía
  answer: B
  explanation: La Ley Nacional de Registro de Votantes (Motor Voter) permite a los
    residentes de Connecticut registrarse para votar o actualizar su registro en el
    DMV.
- id: 29
  category: license_system
  question: Un visitante en Connecticut que tenga una licencia de conducir válida
    de otro país, ¿por cuánto tiempo puede conducir en el estado?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Los visitantes de Connecticut pueden usar una licencia de conducir
    válida de fuera del país por un período de hasta un año.
- id: 30
  category: driver_testing
  question: Para aprobar el examen de conocimientos de Connecticut, ¿cuántas preguntas
    debe responder correctamente de las 25 proporcionadas?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '22'
  answer: C
  explanation: El examen de conocimientos del DMV de Connecticut consta de 25 preguntas
    y se requiere una puntuación de aprobación del 80%, lo que significa que debe
    responder correctamente al menos 20 preguntas.
- id: 31
  category: driver_testing
  question: Al realizar el examen de conducción de Connecticut, ¿cuál de las siguientes
    características debe tener el vehículo utilizado para la seguridad del examinador?
  choices:
    A: Volantes de dirección dobles
    B: Un pedal de freno en el lado del pasajero o un freno de mano al alcance del
      examinador
    C: Sistema de frenado de emergencia automático
    D: Una transmisión manual
  answer: B
  explanation: Para el examen de conducción en Connecticut, el vehículo debe tener
    un freno que el examinador pueda alcanzar, como un freno de mano en la consola
    central o un freno doble en el lado del pasajero (común en los autos de las escuelas
    de manejo).
- id: 32
  category: driver_testing
  question: ¿Cuál es la cobertura mínima de seguro de responsabilidad civil requerida
    en Connecticut por lesiones corporales a una persona?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Connecticut exige una cobertura mínima de responsabilidad
    civil de $25,000 por persona y $50,000 por accidente por lesiones corporales,
    y $25,000 por daños a la propiedad (25/50/25).
- id: 33
  category: driver_testing
  question: 'Si es menor de 21 años, se considera que conduce bajo los efectos del
    alcohol en Connecticut si su contenido de alcohol en sangre (BAC) es igual o superior
    a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Connecticut tiene una ley de 'Tolerancia Cero' para menores. Si tiene
    menos de 21 años, un BAC de 0.02% o superior se considera conducir bajo los efectos
    del alcohol.
- id: 34
  category: driver_testing
  question: ¿Cuántos puntos se añadirán a su historial de conducción de Connecticut
    por la infracción de rebasar a un autobús escolar detenido?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: D
  explanation: Bajo el sistema de puntos de Connecticut, rebasar a un autobús escolar
    detenido es una infracción grave que resulta en la adición de 4 puntos a su historial
    de conducción.
- id: 35
  category: driver_testing
  question: ¿A qué total de puntos envía el DMV de Connecticut una carta de advertencia
    a un conductor con respecto a sus puntos acumulados?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 10 puntos
    D: 12 puntos
  answer: B
  explanation: El DMV de Connecticut envía una carta de advertencia a los conductores
    que han acumulado 6 puntos en su historial de conducción.
- id: 36
  category: driver_testing
  question: Para un conductor adulto (21+) en Connecticut, ¿cuál es la multa por una
    primera infracción por usar un dispositivo móvil de mano mientras conduce?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: D
  explanation: En Connecticut, la multa por una primera infracción por usar un teléfono
    celular de mano o un dispositivo electrónico móvil mientras se conduce es de $200.
- id: 37
  category: driver_testing
  question: Si se muda a Connecticut y tiene un vehículo registrado en otro estado,
    ¿cuántos días tiene para registrar ese vehículo en Connecticut?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Los nuevos residentes deben registrar sus vehículos en Connecticut
    dentro de los 60 días posteriores al establecimiento de la residencia.
- id: 38
  category: driver_testing
  question: En Connecticut, ¿cuál es la sanción por exceso de velocidad en una zona
    de obras en la autopista designada?
  choices:
    A: Una multa fija de $500
    B: Las multas se duplican
    C: Suspensión automática de la licencia por 30 días
    D: Servicio comunitario obligatorio
  answer: B
  explanation: La ley de Connecticut dicta que las multas por exceso de velocidad
    u otras infracciones de tráfico se duplican cuando se cometen en una zona de obras
    en la autopista designada.
- id: 39
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito para el vehículo utilizado durante
    un examen de conducción del DMV de Connecticut?
  choices:
    A: Debe ser un sedán de tamaño mediano
    B: Debe tener un registro y una tarjeta de seguro vigentes
    C: Debe tener un sistema de navegación GPS
    D: Debe tener menos de 5 años de antigüedad
  answer: B
  explanation: El vehículo utilizado para el examen de conducción debe ser mecánicamente
    seguro, tener un registro vigente y comprobante de seguro.
- id: 40
  category: driver_testing
  question: De acuerdo con la ley 'Move Over' (hacerse a un lado) de Connecticut,
    ¿qué debe hacer al acercarse a un vehículo de emergencia con luces intermitentes
    detenido a un lado de una autopista de varios carriles?
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Mantener la velocidad pero tocar la bocina
    C: Moverse un carril de distancia del vehículo de emergencia si es seguro hacerlo
    D: Acelerar para rebasar el vehículo rápidamente
  answer: C
  explanation: La ley Move Over de Connecticut exige que los conductores reduzcan
    la velocidad y, si es seguro, se muevan un carril al acercarse a vehículos de
    emergencia o de mantenimiento estacionarios con luces intermitentes.
- id: 41
  category: driver_testing
  question: En Connecticut, ¿quién está obligado a usar el cinturón de seguridad en
    un vehículo motorizado?
  choices:
    A: Solo el conductor y el pasajero del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: Todos los pasajeros en los asientos delanteros y traseros
    D: Solo el conductor
  answer: C
  explanation: La ley de Connecticut exige que el conductor y todos los pasajeros
    del vehículo usen el cinturón de seguridad, independientemente de dónde estén
    sentados.
- id: 42
  category: driver_testing
  question: Una licencia de conducir de Connecticut suele ser válida por un período
    de ¿cuántos años antes de que deba renovarse?
  choices:
    A: 2 o 4 años
    B: 5 años
    C: 6 u 8 años
    D: 10 años
  answer: C
  explanation: Connecticut suele emitir licencias de conducir que son válidas por
    6 u 8 años.
- id: 43
  category: driver_testing
  question: Si un conductor de Connecticut es condenado por "Operar bajo la influencia"
    (OUI) por primera vez, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 30 días
    B: 45 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: Por una primera condena de OUI en Connecticut, la licencia de conducir
    se suspende por 45 días, seguido del requisito de usar un dispositivo de bloqueo
    de encendido (IID) durante un año.
- id: 44
  category: driver_testing
  question: En Connecticut, ¿cuántos puntos se asignan por "Conducción temeraria"
    (Reckless Driving)?
  choices:
    A: 1 punto
    B: 3 puntos
    C: 6 puntos
    D: 10 puntos
  answer: C
  explanation: La conducción temeraria es una infracción grave en Connecticut y resulta
    en la adición de 6 puntos al historial del conductor.
- id: 45
  category: driver_testing
  question: Si reprueba el examen práctico de manejo en Connecticut, ¿cuántos días
    debe esperar antes de ser elegible para volver a tomarlo?
  choices:
    A: 7 días
    B: 10 días
    C: 14 días
    D: 30 días
  answer: C
  explanation: Según el DMV de Connecticut, si un solicitante reprueba el examen práctico,
    debe esperar al menos 14 días antes de poder realizar el examen nuevamente.
- id: 46
  category: driver_testing
  question: En Connecticut, ¿cuáles son los requisitos mínimos de cobertura de seguro
    de responsabilidad civil para un vehículo de pasajeros privado?
  choices:
    A: $20,000/$40,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$25,000
    D: $15,000/$30,000/$5,000
  answer: B
  explanation: La ley de Connecticut exige una cobertura mínima de responsabilidad
    civil de $25,000 por persona y $50,000 por accidente por lesiones corporales,
    y $25,000 por daños a la propiedad.
- id: 47
  category: driver_testing
  question: Bajo el sistema de puntos para conductores de Connecticut, ¿cuántos puntos
    acumulados en su historial de manejo activarán una carta de advertencia del DMV?
  choices:
    A: 3 puntos
    B: 5 puntos
    C: 6 puntos
    D: 10 puntos
  answer: C
  explanation: El DMV de Connecticut envía una carta de advertencia a los conductores
    que han acumulado 6 puntos en su historial de manejo.
- id: 48
  category: driver_testing
  question: ¿Con cuántos puntos se suspenderá la licencia de conducir de Connecticut
    por 30 días?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: B
  explanation: En Connecticut, alcanzar 10 puntos en su historial de manejo resulta
    en una suspensión de la licencia por 30 días.
- id: 49
  category: driver_testing
  question: Por una primera condena de DUI en Connecticut, a un conductor adulto (21+)
    se le suspenderá la licencia por 45 días y luego deberá usar un dispositivo de
    bloqueo de encendido (IID) ¿por cuánto tiempo?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: B
  explanation: Por una primera infracción de DUI, un conductor adulto enfrenta una
    suspensión de 45 días seguida de 1 año de conducir únicamente un vehículo equipado
    con un IID.
- id: 50
  category: driver_testing
  question: En Connecticut, si un conductor adulto (21+) se niega a someterse a una
    prueba química de alcohol en sangre, su licencia será suspendida por 45 días y
    deberá usar un IID ¿por cuánto tiempo por una primera infracción?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito, la primera negativa a una
    prueba química resulta en una suspensión de 45 días y el requisito de usar un
    IID por 1 año.
- id: 51
  category: driver_testing
  question: ¿Cuál es la multa por una primera infracción por no detenerse ante un
    autobús escolar con luces rojas intermitentes en Connecticut?
  choices:
    A: $150
    B: $250
    C: $450
    D: $1,000
  answer: C
  explanation: La ley de Connecticut (CGS 14-279) exige una multa de $450 por la primera
    infracción al rebasar un autobús escolar detenido con sus luces rojas intermitentes.
- id: 52
  category: driver_testing
  question: Según el Manual del Conductor de Connecticut, ¿a cuántos pies de distancia
    de un vehículo que viene en sentido contrario debe bajar las luces altas de sus
    faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Connecticut exige que los conductores bajen las luces altas
    cuando se encuentren a menos de 500 pies de un vehículo que se aproxima para evitar
    cegar al otro conductor.
- id: 53
  category: driver_testing
  question: Al seguir a otro vehículo por la noche en Connecticut, ¿a cuántos pies
    del vehículo de adelante debe bajar las luces altas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Los conductores deben bajar las luces altas cuando se encuentren a
    menos de 300 pies de un vehículo al que están siguiendo.
- id: 54
  category: driver_testing
  question: En Connecticut, ¿es ilegal estacionarse a menos de cuántos pies de un
    hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley estatal de Connecticut prohíbe estacionar un vehículo a menos
    de 10 pies de un hidrante de incendios.
- id: 55
  category: driver_testing
  question: ¿Qué regla recomienda el Manual del Conductor de Connecticut para mantener
    una distancia de seguimiento segura detrás del vehículo que va delante de usted?
  choices:
    A: La regla de la longitud de un vehículo
    B: La regla de los dos segundos
    C: La regla de los tres segundos
    D: La regla de los cuatro segundos
  answer: C
  explanation: El Manual del Conductor de Connecticut recomienda la 'regla de los
    tres segundos' para garantizar una distancia de seguimiento segura en condiciones
    climáticas normales.
- id: 56
  category: driver_testing
  question: Según el Manual del Conductor de Connecticut, ¿a qué velocidad puede comenzar
    el hidroplaneo (cuando los neumáticos pierden contacto con la carretera) bajo
    una lluvia intensa?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El manual establece que el hidroplaneo puede comenzar a velocidades
    tan bajas como 35 mph, y los neumáticos pueden perder todo contacto con la carretera
    a 50 mph.
- id: 57
  category: driver_testing
  question: En Connecticut, si usted se ve involucrado en un choque que resulte en
    lesiones, muerte o daños a la propiedad que superen los $1,000, debe presentar
    un informe de accidente ante el DMV si la policía no lo hizo. ¿En cuántos días
    debe hacerse esto?
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: Si un oficial de policía no presenta un informe, el conductor debe
    presentar un 'Informe de Accidente de Vehículo Motorizado' (Formulario PR-1) ante
    el DMV en un plazo de 5 días si hay lesiones, muerte o daños a la propiedad superiores
    a $1,000.
- id: 58
  category: driver_responsibility
  question: Si usted se ve involucrado en un accidente de vehículo motorizado en Connecticut
    que resulte en daños a la propiedad que superen ¿qué cantidad?, debe presentar
    un informe de accidente ante el DMV si la policía no lo hizo?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: Los conductores deben presentar un informe ante el DMV en un plazo
    de 5 días si hay una lesión, muerte o daños a la propiedad de cualquier persona
    que superen los $1,000.
- id: 59
  category: driver_responsibility
  question: Después de mudarse a Connecticut, ¿cuántos días tiene para registrar su
    vehículo de otro estado ante el DMV de CT?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Los nuevos residentes deben registrar sus vehículos en Connecticut
    dentro de los 60 días posteriores a la fijación de su residencia.
- id: 60
  category: driver_responsibility
  question: Operar un vehículo motorizado en Connecticut sin el seguro mínimo requerido
    puede resultar en ¿cuál de las siguientes sanciones?
  choices:
    A: Solo una multa de hasta $100
    B: Una multa de hasta $1,000 y la suspensión de la licencia/registro
    C: Pérdida permanente de los privilegios de conducir
    D: Ninguna sanción si es la primera infracción
  answer: B
  explanation: Operar un vehículo sin seguro es una infracción grave en CT, que conlleva
    multas de entre $100 y $1,000 y la suspensión de la licencia de conducir y el
    registro del vehículo.
- id: 61
  category: driver_responsibility
  question: ¿Con qué frecuencia se requiere que la mayoría de los vehículos en Connecticut
    se sometan a una inspección de emisiones?
  choices:
    A: Cada año
    B: Cada dos años
    C: Cada cinco años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Connecticut requiere que la mayoría de los vehículos se sometan a pruebas
    de emisiones cada dos años para asegurar que cumplan con los estándares ambientales.
- id: 62
  category: driver_responsibility
  question: Para un conductor de 21 años o más, ¿cuál es el límite legal de contenido
    de alcohol en sangre (BAC) en Connecticut?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En Connecticut, se considera que un conductor de 21 años de edad o
    más está legalmente intoxicado si su BAC es de 0.08% o superior.
- id: 63
  category: driver_responsibility
  question: 'Bajo la ley de "Tolerancia Cero" de Connecticut, se considera que un
    conductor menor de 21 años está conduciendo bajo la influencia si su BAC es igual
    o superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Connecticut tiene una política de tolerancia cero para el consumo de
    alcohol y la conducción de menores de edad; un BAC de 0.02% o superior para alguien
    menor de 21 años resulta en la suspensión de la licencia.
- id: 64
  category: driver_responsibility
  question: 'Bajo la ley de Consentimiento Implícito de Connecticut, si se niega a
    someterse a una prueba química de alcohol o drogas, su licencia será suspendida
    por al menos:'
  choices:
    A: 30 días
    B: 45 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: Negarse a realizar una prueba química resulta en una suspensión de
    la licencia de 45 días y el requisito de usar un dispositivo de bloqueo de encendido
    (IID) durante al menos un año.
- id: 65
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por arrojar basura desde un vehículo motorizado
    en Connecticut?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Arrojar basura es ilegal en Connecticut, y un conductor puede ser multado
    con hasta $1,000 por tirar basura desde un vehículo.
- id: 66
  category: driver_responsibility
  question: 'La ley de "Hacerse a un lado" (Move Over) de Connecticut requiere que
    los conductores que se aproximen a vehículos de emergencia o mantenimiento estacionados
    con luces intermitentes:'
  choices:
    A: Se detengan inmediatamente
    B: Mantengan la velocidad pero toquen la bocina
    C: Se cambien a otro carril si es seguro, o reduzcan la velocidad significativamente
    D: Aumenten la velocidad para pasar el vehículo rápidamente
  answer: C
  explanation: La ley Move Over requiere que los conductores se cambien a otro carril
    en autopistas de carriles múltiples o reduzcan la velocidad si no es posible cambiarse
    de carril al aproximarse a vehículos de emergencia.
- id: 67
  category: driver_responsibility
  question: ¿Cuánto tiempo permanecen en su historial de conducción de Connecticut
    los puntos asignados por infracciones de tránsito?
  choices:
    A: 12 meses
    B: 24 meses
    C: 36 meses
    D: 5 años
  answer: B
  explanation: Los puntos asignados contra una licencia de conducir en Connecticut
    permanecen en el historial de conducción durante 24 meses a partir de la fecha
    en que se asignan.
- id: 68
  category: driver_responsibility
  question: 'El DMV de Connecticut se negará a renovar el registro de un vehículo
    si el propietario tiene:'
  choices:
    A: Impuestos locales sobre la propiedad del vehículo sin pagar
    B: Una tarjeta de biblioteca vencida
    C: Un puntaje de crédito inferior a 600
    D: No ha lavado el vehículo en 6 meses
  answer: A
  explanation: La ley de Connecticut impide que el DMV renueve un registro si el propietario
    tiene impuestos locales sobre la propiedad pendientes o multas de estacionamiento
    sin pagar en ciertos municipios.
- id: 69
  category: driver_responsibility
  question: 'Al operar un vehículo motorizado en Connecticut, debe poder proporcionar
    un comprobante de seguro a un oficial de la ley:'
  choices:
    A: Solo si está involucrado en un accidente
    B: Dentro de las 24 horas posteriores a ser detenido
    C: Siempre que esté operando el vehículo
    D: Solo si es mayor de 21 años
  answer: C
  explanation: Los conductores en Connecticut deben llevar una tarjeta de identificación
    de seguro en el vehículo en todo momento y presentarla a petición de un oficial
    de la ley.
- id: 70
  category: driver_responsibility
  question: En Connecticut, debe presentar un Informe de Accidente de Vehículo Motorizado
    (formulario PR-1) ante el DMV si hay una lesión, muerte o daños a la propiedad
    que excedan ¿qué cantidad?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: De acuerdo con la ley de Connecticut, cualquier accidente de vehículo
    motorizado que resulte en una lesión, muerte o daños a la propiedad que excedan
    los $1,000 debe informarse al DMV.
- id: 71
  category: driver_responsibility
  question: Bajo la ley de "Administrative Per Se" de Connecticut, si es arrestado
    por conducir bajo la influencia (DUI) y se niega a someterse a una prueba química,
    ¿por cuántos días como mínimo se suspenderá su privilegio de conducir?
  choices:
    A: 30 días
    B: 45 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: En Connecticut, la negativa a una prueba química por primera vez resulta
    en una suspensión de la licencia de 45 días, seguida de un período de uso obligatorio
    de un Dispositivo de Bloqueo de Encendido (IID).
- id: 72
  category: driver_responsibility
  question: 'En Connecticut, si se ve involucrado en un accidente con un vehículo
    desatendido y no puede encontrar al propietario, usted debe:'
  choices:
    A: Esperar 2 horas y luego retirarse
    B: Dejar una nota con su nombre, dirección y registro, y notificar a la policía
    C: Retirarse si no hay daños visibles
    D: Llamar a una grúa para el otro vehículo
  answer: B
  explanation: La ley de Connecticut exige que deje su información de contacto y del
    vehículo e informe el incidente a la policía local si choca contra un vehículo
    desatendido.
- id: 73
  category: driver_responsibility
  question: ¿Cuál es la sanción por una primera condena por operar un vehículo motorizado
    sin el seguro mínimo requerido en Connecticut?
  choices:
    A: Una multa de $100 a $1,000 y una suspensión de la licencia de un mes
    B: La pérdida permanente de la licencia
    C: Solo una advertencia verbal
    D: Una sentencia obligatoria de 48 horas de cárcel
  answer: A
  explanation: Operar sin seguro en CT puede conllevar una multa de entre $100 y $1,000
    y la suspensión de la licencia y el registro.
- id: 74
  category: driver_responsibility
  question: En Connecticut, las multas por exceso de velocidad u otras infracciones
    de tránsito se _______ cuando se cometen en una zona de construcción o mantenimiento
    designada.
  choices:
    A: Triplican
    B: Duplican
    C: Reducen a la mitad
    D: Eximen para los infractores por primera vez
  answer: B
  explanation: La ley de Connecticut exige que las multas por infracciones de tránsito
    se dupliquen en las zonas de trabajo cuando hay trabajadores presentes.
- id: 75
  category: driver_responsibility
  question: Si es condenado por un DUI en Connecticut, ¿por cuánto tiempo se le exigirá
    instalar un Dispositivo de Bloqueo de Encendido (IID) en su vehículo por una primera
    infracción (si es mayor de 21 años)?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Para una primera condena por DUI de un conductor de 21 años o más,
    la licencia se suspende por 45 días, seguidos de 6 meses conduciendo únicamente
    un vehículo equipado con un IID.
- id: 76
  category: driver_responsibility
  question: ¿Cuál de los siguientes es un requisito para mantener un registro de vehículo
    válido en Connecticut?
  choices:
    A: El vehículo debe tener un rastreador GPS
    B: El propietario debe tener un seguro de responsabilidad civil continuo
    C: El vehículo debe lavarse mensualmente
    D: El propietario debe tener antecedentes penales limpios
  answer: B
  explanation: Connecticut exige que todos los vehículos registrados mantengan un
    seguro de responsabilidad civil continuo. No hacerlo puede resultar en la suspensión
    del registro.
- id: 77
  category: driver_responsibility
  question: En Connecticut, si su vehículo no pasa una prueba de emisiones, ¿cuántos
    días tiene para reparar el vehículo y volver a realizar la prueba?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Si un vehículo no pasa la prueba de emisiones en Connecticut, el propietario
    tiene 60 días para realizar las reparaciones necesarias y volver a realizar la
    prueba.
- id: 78
  category: safe_driving_rules
  question: En Connecticut, al estacionar su vehículo cerca de un hidrante de incendios,
    ¿cuál es la distancia mínima que debe mantener?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: Según el Manual del Conductor de Connecticut, no se puede estacionar
    a menos de 10 pies de un hidrante de incendios.
- id: 79
  category: safe_driving_rules
  question: Según la ley de Connecticut, ¿cuál es la distancia mínima que debe mantener
    al estacionar cerca de una señal de alto (pare)?
  choices:
    A: 15 pies
    B: 20 pies
    C: 25 pies
    D: 50 pies
  answer: C
  explanation: En Connecticut, es ilegal estacionar a menos de 25 pies de una señal
    de alto para garantizar la visibilidad de otros conductores.
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada detrás del vehículo que
    va delante de usted en condiciones normales de conducción en Connecticut?
  choices:
    A: Regla de los dos segundos
    B: Regla de los tres segundos
    C: Regla de los cuatro segundos
    D: La longitud de un automóvil por cada 10 mph
  answer: B
  explanation: El Manual del Conductor de Connecticut recomienda utilizar la "regla
    de los tres segundos" para mantener una distancia de seguimiento segura en condiciones
    normales.
- id: 81
  category: safe_driving_rules
  question: ¿Cómo se manejan normalmente las multas por exceso de velocidad al conducir
    en una zona de obras en Connecticut?
  choices:
    A: Las multas se reducen si es su primera infracción
    B: Las multas se duplican
    C: Las multas se triplican
    D: Las multas siguen siendo las mismas que las de las infracciones estándar por
      exceso de velocidad
  answer: B
  explanation: In Connecticut, las multas por exceso de velocidad u otras infracciones
    de tráfico se duplican en las zonas de obras designadas cuando hay trabajadores
    presentes.
- id: 82
  category: safe_driving_rules
  question: En Connecticut, ¿con cuántos pies de antelación como mínimo debe señalizar
    su intención de girar antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: El Manual del Conductor de Connecticut establece que debe señalizar
    al menos 100 pies antes de realizar un giro.
- id: 83
  category: safe_driving_rules
  question: En Connecticut, ¿cuándo debe atenuar las luces altas (cambiar a luces
    bajas) ante un vehículo que se aproxima en sentido contrario?
  choices:
    A: A menos de 200 pies
    B: A menos de 300 pies
    C: A menos de 500 pies
    D: A menos de 1,000 pies
  answer: C
  explanation: La ley de Connecticut exige que los conductores cambien a luces bajas
    cuando un vehículo que viene en sentido contrario se encuentra a menos de 500
    pies.
- id: 84
  category: safe_driving_rules
  question: 'En Connecticut, si se ve involucrado en un choque que resulte en daños
    a la propiedad de $1,000 o más, usted debe:'
  choices:
    A: Notificar únicamente a su compañía de seguros
    B: Presentar un informe de accidente ante el DMV
    C: Esperar 30 días antes de informar
    D: Informar solo si hay una persona lesionada
  answer: B
  explanation: La ley de Connecticut exige que los conductores presenten un informe
    de accidente (formulario PR-1) ante el DMV si hay lesiones, muertes o daños a
    la propiedad que superen los $1,000.
- id: 85
  category: safe_driving_rules
  question: En Connecticut, ¿cuál es la profundidad mínima legal de la banda de rodadura
    de los neumáticos para un vehículo de pasajeros?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Connecticut exige que los neumáticos tengan al menos 2/32
    de pulgada de profundidad de la banda de rodadura en todas las ranuras principales.
- id: 86
  category: safe_driving_rules
  question: 'Al acercarse a un vehículo de emergencia estacionado con luces intermitentes
    en una carretera de tres carriles en Connecticut, la ''Ley de hacerse a un lado''
    (Move Over Law) le exige:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener la velocidad pero tocar la bocina
    C: Moverse un carril a la izquierda si es seguro hacerlo
    D: Aumentar la velocidad para pasar el vehículo rápidamente
  answer: C
  explanation: La Ley de hacerse a un lado (Move Over Law) de Connecticut exige que
    los conductores se muevan un carril, si es seguro, o reduzcan la velocidad al
    acercarse a vehículos de emergencia, mantenimiento o recuperación que estén estacionados.
- id: 87
  category: safe_driving_rules
  question: En Connecticut, ¿a menos de cuántos pies de un cruce de peatones en una
    intersección no se permite estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: D
  explanation: El Manual del Conductor de Connecticut especifica que no se puede estacionar
    a menos de 25 pies de un cruce de peatones en una intersección.
- id: 88
  category: safe_driving_rules
  question: Al estacionar un vehículo en una vía pública en Connecticut, ¿a qué distancia
    máxima deben estar las ruedas del bordillo?
  choices:
    A: A no más de 6 pulgadas
    B: A no más de 12 pulgadas
    C: A no más de 18 pulgadas
    D: Exactamente a 10 pulgadas
  answer: B
  explanation: El Manual del Conductor de Connecticut establece que al estacionar
    junto a un bordillo, debe hacerlo a una distancia no mayor a 12 pulgadas de este.
- id: 89
  category: safe_driving_rules
  question: 'Al acercarse a un autobús escolar que está detenido con sus luces rojas
    intermitentes encendidas y el brazo de parada extendido en una carretera no dividida,
    usted debe detenerse:'
  choices:
    A: Solo si viaja en la misma dirección que el autobús
    B: Al menos a 10 pies de distancia
    C: Solo si hay niños cruzando en ese momento
    D: Independientemente de su dirección de viaje
  answer: D
  explanation: En Connecticut, debe detenerse ante un autobús escolar con luces rojas
    intermitentes, ya sea que se aproxime por delante o lo siga por detrás, a menos
    que el autobús esté en el lado opuesto de una carretera dividida.
- id: 90
  category: safe_driving_rules
  question: Al adelantar o pasar a una bicicleta en Connecticut, ¿cuál es la distancia
    mínima que debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Connecticut exige que los automovilistas otorguen al menos
    tres pies de distancia al adelantar o pasar a una persona que circula en bicicleta.
- id: 91
  category: safe_driving_rules
  question: ¿Cuál es la ley de 'Hacerse a un lado' (Move Over) en Connecticut con
    respecto a los vehículos de emergencia al costado de una autopista de varios carriles?
  choices:
    A: Debe detenerse inmediatamente
    B: Debe cambiarse de carril si es seguro hacerlo, o reducir la velocidad
    C: Debe acelerar para pasar rápidamente
    D: Solo debe hacerse a un lado para los patrulleros de policía, no para las grúas
  answer: B
  explanation: La Ley de Hacerse a un Lado (Move Over Law) de Connecticut exige que
    los conductores se cambien de carril al acercarse a vehículos de emergencia, mantenimiento
    o recuperación que estén detenidos. Si cambiarse de carril no es seguro, el conductor
    debe reducir la velocidad.
- id: 92
  category: safe_driving_rules
  question: En Connecticut, para un conductor de 21 años o más, ¿cuál es el nivel
    de contenido de alcohol en sangre (BAC) a partir del cual se considera que conduce
    bajo la influencia?
  choices:
    A: 0.02% o más
    B: 0.05% o más
    C: 0.08% o más
    D: 0.10% o más
  answer: C
  explanation: En Connecticut, el límite legal de BAC para conductores de 21 años
    o más es de 0.08%.
- id: 93
  category: safe_driving_rules
  question: Al entrar en una rotonda en Connecticut, ¿a quién debe ceder el paso?
  choices:
    A: Al tráfico que entra por la derecha
    B: Al tráfico que ya está en el círculo
    C: A nadie; usted tiene el derecho de paso
    D: Solo a los peatones, no a otros vehículos
  answer: B
  explanation: Al acercarse a una rotonda, debe ceder el paso al tráfico que ya circula
    por el círculo y a los peatones en el cruce peatonal.
- id: 94
  category: safe_driving_rules
  question: 'En Connecticut, la ''regla de los tres segundos'' se utiliza para determinar:'
  choices:
    A: Cuánto tiempo esperar en una señal de alto
    B: El tiempo que se tarda en despejar una intersección
    C: Una distancia de seguimiento segura
    D: Cuánto tiempo señalizar antes de un giro
  answer: C
  explanation: El Manual del Conductor de Connecticut recomienda la 'regla de los
    tres segundos' para mantener una distancia de seguimiento segura detrás del vehículo
    que va delante de usted.
- id: 95
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente,
    ¿con cuánta anticipación sugiere el Manual del Conductor de Connecticut escanear
    la carretera?
  choices:
    A: 5 segundos
    B: 8 segundos
    C: 12 segundos
    D: 20 segundos
  answer: C
  explanation: Las pautas de Connecticut establecen que los conductores deben escanear
    la carretera al menos 12 segundos por delante para anticipar posibles peligros
    y cambios en el flujo del tráfico.
- id: 96
  category: defensive_driving
  question: En Connecticut, debe encender los faros delanteros siempre que use los
    limpiaparabrisas debido a las condiciones climáticas. ¿Cuál es el otro requisito
    específico de visibilidad para los faros delanteros?
  choices:
    A: Cuando no pueda ver claramente a 500 pies
    B: Cuando no pueda ver claramente a 1,000 pies
    C: Solo entre la puesta del sol y la salida del sol
    D: Cuando no pueda ver claramente a 200 pies
  answer: A
  explanation: La ley de Connecticut exige el uso de los faros delanteros cuando los
    limpiaparabrisas están en uso y siempre que la visibilidad se reduzca a menos
    de 500 pies.
- id: 97
  category: defensive_driving
  question: Según el Manual del Conductor de Connecticut, ¿a qué velocidad pueden
    sus neumáticos comenzar a deslizarse sobre una capa de agua (hidroplaneo)?
  choices:
    A: Tan solo a 35 mph
    B: Exactamente a 45 mph
    C: Solo por encima de 55 mph
    D: Solo durante lluvias intensas
  answer: A
  explanation: El manual advierte que el hidroplaneo (hydroplaning) puede comenzar
    a velocidades tan bajas como 35 mph, y en una lluvia intensa, los neumáticos pueden
    perder toda la tracción a 50 mph.
- id: 98
  category: defensive_driving
  question: Al seguir a un camión comercial grande, ¿el Manual del Conductor de Connecticut
    recomienda aumentar su distancia de seguimiento a por lo menos cuántos segundos?
  choices:
    A: 3 segundos
    B: 4 segundos
    C: 6 segundos
    D: 10 segundos
  answer: B
  explanation: Si bien 3 segundos es el estándar para los automóviles, el manual recomienda
    al menos 4 segundos cuando se sigue a camiones grandes para asegurarse de no estar
    en su punto ciego trasero (No-Zone).
- id: 99
  category: defensive_driving
  question: ¿Qué técnica de dirección recomienda el Manual del Conductor de Connecticut
    para la mayoría de las maniobras de giro?
  choices:
    A: Dirección con una sola mano
    B: Dirección de mano sobre mano (hand-over-hand)
    C: Girar el volante con la palma de la mano
    D: Cruzar los brazos en la posición de las 12 en punto
  answer: B
  explanation: El Manual del Conductor de CT recomienda específicamente el método
    de dirección de mano sobre mano para girar a bajas velocidades o al recuperarse
    de un derrape.
- id: 100
  category: defensive_driving
  question: Al estacionar su vehículo en una pendiente cuesta abajo con acera, ¿en
    qué dirección debe girar las ruedas?
  choices:
    A: Hacia la acera
    B: En dirección contraria a la acera
    C: Paralelas a la acera
    D: No importa
  answer: A
  explanation: Al estacionar cuesta abajo, debe girar las ruedas hacia la acera para
    que, si el vehículo rueda, golpee la acera y se detenga.
- id: 101
  category: defensive_driving
  question: ¿En Connecticut, las multas por exceso de velocidad u otras infracciones
    de tránsito se duplican cuando se cometen en cuál de las siguientes áreas?
  choices:
    A: Zonas residenciales
    B: Zonas hospitalarias
    C: Zonas de construcción o mantenimiento designadas
    D: Parques estatales
  answer: C
  explanation: La ley de Connecticut exige que las multas por infracciones de tránsito
    se dupliquen en las zonas de trabajo designadas cuando hay trabajadores presentes.
- id: 102
  category: defensive_driving
  question: Cuando se aproxima un vehículo de emergencia con sirenas y luces intermitentes,
    usted debe orillarse al borde derecho de la carretera y detenerse. ¿Qué distancia
    de seguimiento debe mantener detrás de un vehículo de emergencia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Por lo general, se requiere que los conductores se mantengan al menos
    a 500 pies de distancia de un vehículo de emergencia que esté respondiendo a una
    alarma.
- id: 103
  category: defensive_driving
  question: Según el Manual del Conductor de Connecticut, ¿cuál es el único momento
    en el que debe usar la bocina?
  choices:
    A: Para saludar a amigos
    B: Para mostrar enojo hacia otro conductor
    C: Para indicar el deseo de rebasar
    D: Para advertir a otros conductores sobre una situación peligrosa
  answer: D
  explanation: El manual establece que la bocina solo debe usarse como advertencia
    para otros conductores o peatones para evitar un accidente, no por razones sociales
    o agresivas.
- id: 104
  category: defensive_driving
  question: Según el Manual del Conductor de Connecticut, ¿cuántos segundos de distancia
    de seguimiento debe mantener detrás del vehículo que va delante de usted en condiciones
    ideales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: B
  explanation: El Manual del Conductor de Connecticut recomienda usar la 'regla de
    los tres segundos' para mantener una distancia de seguimiento segura en condiciones
    ideales de clima y tráfico.
- id: 105
  category: defensive_driving
  question: Para ser un conductor seguro en Connecticut, ¿debe observar el camino
    adelante para ver qué está sucediendo al menos cuántos segundos frente a su vehículo?
  choices:
    A: 5 segundos
    B: 8 segundos
    C: 12 segundos
    D: 20 segundos
  answer: C
  explanation: Las pautas de Connecticut establecen que debe mirar hacia adelante
    al menos 12 segundos para ayudarlo a evitar la necesidad de frenar o girar en
    el último momento.
- id: 106
  category: defensive_driving
  question: 'En Connecticut, el hidroplaneo (donde los neumáticos pierden tracción
    sobre una fina capa de agua) puede comenzar a velocidades tan bajas como:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El Manual del Conductor de CT advierte que, bajo lluvia intensa, sus
    neumáticos pueden deslizarse sobre una fina capa de agua y perder contacto con
    la carretera a velocidades tan bajas como 35 mph.
- id: 107
  category: defensive_driving
  question: Al conducir con niebla, lluvia o nieve en Connecticut, ¿qué ajuste de
    luces debe usar para garantizar la mejor visibilidad y seguridad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Sin luces
  answer: B
  explanation: En condiciones de niebla, lluvia o nieve, debe usar las luces bajas.
    Las luces altas se reflejan en la precipitación y causan deslumbramiento, lo que
    dificulta la visión.
- id: 108
  category: defensive_driving
  question: 'Según la ley de Connecticut, al rebasar una bicicleta que viaja en la
    misma dirección, debe dejar una distancia de al menos:'
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley estatal de Connecticut exige que los automovilistas otorguen
    al menos tres pies de distancia al rebasar a una persona que monta en bicicleta.
- id: 109
  category: defensive_driving
  question: 'Al compartir la carretera con camiones comerciales grandes, las ''Zonas
    Prohibidas'' (No-Zones) se refieren a:'
  choices:
    A: Áreas donde no se permite conducir camiones
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: Los carriles con restricción de velocidad en las autopistas de CT
    D: Las zonas de límite de peso para puentes
  answer: B
  explanation: El Manual del Conductor de CT identifica las 'No-Zones' como los grandes
    puntos ciegos alrededor de un camión donde el conductor del camión no puede ver
    su vehículo.
- id: 110
  category: defensive_driving
  question: 'En Connecticut, cuando la carretera está mojada, está más resbaladiza:'
  choices:
    A: Después de que ha estado lloviendo durante varias horas
    B: Justo después de que empieza a llover
    C: Cuando la temperatura es superior a 70 grados
    D: Solo durante un aguacero intenso
  answer: B
  explanation: Las carreteras están más resbaladizas justo después de que empieza
    a llover porque el agua se mezcla con el aceite y la grasa del pavimento que aún
    no se han lavado.
- id: 111
  category: defensive_driving
  question: 'Si su vehículo está equipado con un Sistema de Frenos Antibloqueo (ABS)
    y necesita detenerse rápidamente en una emergencia, usted debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Presionar el pedal del freno con fuerza y mantener la presión
    C: Tocar ligeramente los frenos
    D: Poner el vehículo en punto muerto (neutral) y usar el freno de emergencia
  answer: B
  explanation: Con el ABS, debe presionar el pedal del freno con fuerza y mantener
    una presión constante. No bombee los frenos, ya que esto desactiva la efectividad
    del sistema.
- id: 112
  category: defensive_driving
  question: Al observar una intersección en busca de posibles peligros, ¿en qué orden
    recomienda mirar el Manual del Conductor de Connecticut?
  choices:
    A: Derecha, luego izquierda, luego derecha de nuevo
    B: Izquierda, luego derecha, luego izquierda de nuevo
    C: Solo hacia adelante
    D: Primero a su espejo retrovisor
  answer: B
  explanation: Debe mirar a la izquierda, luego a la derecha y luego a la izquierda
    de nuevo porque los vehículos que vienen de la izquierda están más cerca de usted
    y representan el peligro más inmediato.
- id: 113
  category: defensive_driving
  question: 'Al seguir a una motocicleta en Connecticut, debe dejar una mayor distancia
    de seguimiento (al menos 3 a 4 segundos) porque:'
  choices:
    A: Las motocicletas tienen distancias de frenado mucho más cortas que los automóviles
    B: Las motocicletas son más rápidas que los automóviles
    C: Los motociclistas están obligados a zigzaguear en el tráfico
    D: Las motocicletas no tienen luces de freno
  answer: A
  explanation: Las motocicletas pueden detenerse mucho más rápido que otros vehículos.
    Seguir demasiado de cerca puede resultar en una colisión por alcance si el motociclista
    frena repentinamente.
- id: 114
  category: defensive_driving
  question: A 50 mph, ¿aproximadamente cuántos pies puede tomar reaccionar ante un
    peligro y detener su vehículo por completo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 600 pies
  answer: C
  explanation: Según el Manual del Conductor de CT, a 50 mph, la distancia total de
    parada (incluyendo la percepción, reacción y frenado) es de aproximadamente 400
    pies.
- id: 115
  category: alcohol_drugs_health
  question: 'La ley de ''Consentimiento Implícito'' (Implied Consent) de Connecticut
    significa que, al operar un vehículo motorizado, usted ha aceptado efectivamente:'
  choices:
    A: Permitir un registro de su vehículo en cualquier momento.
    B: Contar con un seguro de responsabilidad civil mínimo.
    C: Realizarse una prueba química para determinar su BAC o contenido de drogas.
    D: Mantener su vehículo en buenas condiciones mecánicas.
  answer: C
  explanation: La ley de Consentimiento Implícito significa que se presume que cualquier
    persona que opera un vehículo motorizado en CT ha dado su consentimiento para
    una prueba de sangre, aliento u orina.
- id: 116
  category: alcohol_drugs_health
  question: 'Si un conductor de 21 años o más se niega a someterse a una prueba química
    en Connecticut por primera vez, su licencia será suspendida por 45 días y deberá
    usar un Dispositivo de Bloqueo de Encendido (IID) durante:'
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: B
  explanation: Por una primera infracción de negarse a una prueba química, un conductor
    de 21 años o más enfrenta una suspensión de licencia de 45 días seguida de un
    año de conducción con un Dispositivo de Bloqueo de Encendido (IID).
- id: 117
  category: alcohol_drugs_health
  question: 'Si un conductor de 16 o 17 años en Connecticut se niega a realizarse
    una prueba de BAC, su licencia será suspendida por 45 días y se le requerirá usar
    un IID durante:'
  choices:
    A: 6 meses
    B: 1 año
    C: 18 meses
    D: 2 años
  answer: C
  explanation: Para los conductores de 16 y 17 años, la primera negativa a una prueba
    química resulta en una suspensión de 45 días y el requisito de usar un IID por
    18 meses.
- id: 118
  category: alcohol_drugs_health
  question: ¿Cuál es la sentencia mínima obligatoria de cárcel en Connecticut por
    una primera condena por DUI, la cual puede suspenderse si el conductor realiza
    100 horas de servicio comunitario?
  choices:
    A: 24 horas
    B: 48 horas
    C: 10 días
    D: 30 días
  answer: B
  explanation: Una primera condena por DUI conlleva una sentencia mínima obligatoria
    de seis meses, pero la ejecución de esa sentencia puede suspenderse con un período
    de libertad condicional que incluya 48 horas consecutivas en la cárcel o 100 horas
    de servicio comunitario.
- id: 119
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de medicamentos recetados o de venta libre mientras se conduce en Connecticut?
  choices:
    A: Siempre son legales siempre que un médico los haya recetado.
    B: Solo son ilegales si se clasifican como narcóticos.
    C: Es responsabilidad del conductor conocer los efectos del medicamento antes
      de conducir.
    D: No afectan la capacidad de conducción tanto como el alcohol.
  answer: C
  explanation: Según la ley de CT, conducir bajo la influencia de cualquier droga
    (legal o ilegal) que afecte su capacidad para conducir es una infracción. Los
    conductores deben revisar las etiquetas y consultar a los médicos sobre los efectos
    secundarios.
- id: 120
  category: alcohol_drugs_health
  question: 'Si se ve involucrado en un choque mientras su licencia está suspendida
    por una infracción relacionada con DUI en Connecticut, podría enfrentar:'
  choices:
    A: Una multa simple.
    B: Ninguna sanción adicional si no fue su culpa.
    C: Tiempo de prisión obligatorio.
    D: Solo una advertencia verbal.
  answer: C
  explanation: Operar un vehículo mientras se tiene la licencia suspendida por una
    infracción relacionada con DUI conlleva sanciones severas, incluyendo tiempo de
    cárcel mínimo obligatorio.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto principal de mezclar alcohol con otras drogas (incluso
    las de venta libre)?
  choices:
    A: Los efectos del alcohol se cancelan.
    B: Los efectos de las drogas se cancelan.
    C: Puede multiplicar los efectos de ambos, aumentando significativamente el deterioro.
    D: No tiene un efecto medible en el rendimiento al conducir.
  answer: C
  explanation: Combinar alcohol y drogas a menudo produce un efecto sinérgico, lo
    que significa que el deterioro es mucho mayor que la suma de las dos sustancias
    individualmente.
- id: 122
  category: alcohol_drugs_health
  question: En Connecticut, ¿cuánto tiempo le toma normalmente al cuerpo eliminar
    el alcohol contenido en una bebida estándar?
  choices:
    A: 15 minutos
    B: 30 minutos
    C: Aproximadamente 1 hora
    D: 3 horas
  answer: C
  explanation: El cuerpo humano oxida el alcohol a una tasa constante de aproximadamente
    una bebida estándar por hora.
- id: 123
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes opciones le ayudará a 'recuperar la sobriedad'
    antes de conducir?
  choices:
    A: Beber café solo (negro).
    B: Tomar una ducha fría.
    C: Hacer ejercicio vigorosamente.
    D: Solo el tiempo.
  answer: D
  explanation: Solo el tiempo permite que el cuerpo procese el alcohol. El café, las
    duchas y el ejercicio no reducen su BAC ni disminuyen el deterioro.
- id: 124
  category: alcohol_drugs_health
  question: 'Si un conductor de Connecticut es condenado por un segundo DUI dentro
    de un periodo de 10 años, el requisito del dispositivo de bloqueo de encendido
    (IID) aumenta a:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: Requisito permanente
  answer: C
  explanation: Por una segunda condena de DUI dentro de 10 años, el conductor debe
    usar un Dispositivo de Bloqueo de Encendido (IID) durante 3 años después de una
    suspensión de 45 días.
- id: 125
  category: alcohol_drugs_health
  question: 'En Connecticut, si usted es menor de 21 años y se determina que su BAC
    es de 0.02% o superior, su licencia será suspendida por 45 días y deberá usar
    un IID por:'
  choices:
    A: 6 meses
    B: 1 año
    C: 18 meses
    D: 2 años
  answer: B
  explanation: Bajo la ley de Tolerancia Cero, un conductor menor de 21 años con un
    BAC de 0.02% o superior enfrenta una suspensión de 45 días y un requisito de IID
    de 1 año por una primera infracción.
- id: 126
  category: alcohol_drugs_health
  question: Si tiene una condición de salud que pueda afectar su capacidad para conducir
    de manera segura, ¿cuál es su responsabilidad según el Manual del Conductor de
    Connecticut?
  choices:
    A: Debe dejar de conducir de inmediato y para siempre.
    B: Debe informar al DMV cuando solicite o renueve su licencia.
    C: Solo necesita informar a su compañía de seguros.
    D: No necesita informarlo a menos que esté involucrado en un choque.
  answer: B
  explanation: La ley de Connecticut exige que los conductores informen al DMV sobre
    cualquier condición física o mental que pueda afectar su capacidad para operar
    un vehículo motorizado de manera segura.
- id: 127
  category: alcohol_drugs_health
  question: En Connecticut, se considera que un conductor está operando 'bajo la influencia'
    si su Contenido de Alcohol en Sangre (BAC) está en o por encima de ¿qué nivel?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Para conductores de 21 años o más en Connecticut, el límite legal de
    Contenido de Alcohol en Sangre (BAC) es de 0.08%.
- id: 128
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de 'Consentimiento Implícito' de Connecticut para
    los automovilistas?
  choices:
    A: Usted consiente el registro de su vehículo en cualquier momento.
    B: Usted acepta proporcionar la información de su seguro a otros conductores.
    C: Al conducir, usted ha aceptado someterse a una prueba química de alcohol o
      drogas si lo solicita un oficial.
    D: Usted acepta que se le revoque la licencia si se ve involucrado en cualquier
      accidente.
  answer: C
  explanation: El Consentimiento Implícito significa que, al poseer una licencia de
    conducir de CT y operar un vehículo, usted ya ha dado su consentimiento para someterse
    a una prueba química (sangre, aliento u orina) para determinar el BAC o el contenido
    de drogas.
- id: 129
  category: alcohol_drugs_health
  question: 'En Connecticut, si tiene 21 años o más y se niega a someterse a una prueba
    química por primera vez, su licencia de conducir será suspendida por al menos:'
  choices:
    A: 30 días
    B: 45 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: Según la ley Administrative Per Se, la primera negativa a una prueba
    química resulta en una suspensión de la licencia de 45 días, seguida de un período
    obligatorio de uso de un Dispositivo de Bloqueo de Encendido (IID).
- id: 130
  category: alcohol_drugs_health
  question: ¿Cuál es el rango de multa por una primera condena de DUI en el estado
    de Connecticut?
  choices:
    A: Entre $100 y $500
    B: Entre $500 y $1,000
    C: Entre $1,000 y $2,000
    D: Exactamente $2,500
  answer: B
  explanation: Una primera condena por DUI en Connecticut conlleva una multa que oscila
    entre $500 y $1,000, además de una posible pena de cárcel y la suspensión de la
    licencia.
- id: 131
  category: alcohol_drugs_health
  question: Si un conductor de 16 o 17 años en Connecticut es detenido y no pasa una
    prueba de BAC (0.02% o más), ¿por cuánto tiempo confiscará inmediatamente su licencia
    el oficial de policía?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 7 días
  answer: B
  explanation: La ley de Connecticut exige que la policía confisque inmediatamente
    la licencia de un joven de 16 o 17 años durante 48 horas si no pasa una prueba
    de BAC o se niega a realizarla.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma de reducir eficazmente su contenido
    de alcohol en sangre (BAC) antes de conducir?
  choices:
    A: Beber café negro cargado
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Dejar que pase el tiempo
  answer: D
  explanation: Solo el tiempo puede reducir el BAC. El café, las duchas y el ejercicio
    no aceleran el proceso de metabolización del alcohol por parte del hígado.
- id: 133
  category: alcohol_drugs_health
  question: En Connecticut, si es declarado culpable de conducir bajo los efectos
    del alcohol o drogas (DUI) y es su segunda infracción, ¿por cuánto tiempo debe
    usar un dispositivo de bloqueo de encendido (IID)?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: Permanentemente
  answer: C
  explanation: Para una segunda condena por DUI en Connecticut, el conductor debe
    usar un dispositivo de bloqueo de encendido (IID) durante tres años.
- id: 134
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes opciones describe el efecto de mezclar alcohol
    con otras drogas, como medicamentos recetados o marihuana, en la capacidad de
    conducir?
  choices:
    A: Las drogas anulan los efectos del alcohol.
    B: Los efectos se multiplican, aumentando significativamente el deterioro.
    C: No hay ningún efecto adicional más allá del alcohol mismo.
    D: Hace que el conductor esté más alerta para compensar el alcohol.
  answer: B
  explanation: Combinar alcohol con otras drogas crea un efecto sinérgico, lo que
    significa que el deterioro es mucho mayor que la suma de las sustancias individuales.
- id: 135
  category: alcohol_drugs_health
  question: En Connecticut, si es menor de 21 años y se niega a realizar una prueba
    de BAC, ¿por cuánto tiempo se suspenderá su licencia por una primera infracción?
  choices:
    A: 45 días
    B: 6 meses
    C: 1 año
    D: 18 meses
  answer: A
  explanation: Bajo la ley Administrative Per Se, el período de suspensión por una
    primera negativa es de 45 días para todos los conductores, aunque los requisitos
    posteriores del IID varían según la edad y los antecedentes.
- id: 136
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de Connecticut, ¿en qué porcentaje aproximado
    de los accidentes de tráfico mortales a nivel nacional está involucrado el alcohol?
  choices:
    A: 10%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: El Manual del Conductor de Connecticut señala que el alcohol es un
    factor en aproximadamente el 40% de todas las muertes por accidentes de tráfico.
- id: 137
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones con respecto a la marihuana y la
    conducción en Connecticut es verdadera?
  choices:
    A: Es legal conducir bajo la influencia de la marihuana si tiene una tarjeta médica.
    B: La marihuana no afecta el tiempo de reacción ni la coordinación.
    C: Conducir bajo la influencia de la marihuana es ilegal y conlleva las mismas
      sanciones que un DUI por alcohol.
    D: La marihuana solo es ilegal de usar mientras se conduce si se fuma, no si se
      ingiere como un comestible.
  answer: C
  explanation: En Connecticut, conducir bajo la influencia de cualquier droga, incluida
    la marihuana (medicinal o recreativa), es ilegal y está sujeto a las mismas sanciones
    por DUI que el alcohol.
- id: 138
  category: alcohol_drugs_health
  question: 'Si está tomando un medicamento recetado y no está seguro de si afectará
    su conducción, usted debe:'
  choices:
    A: Conducir solo por carreteras locales familiares.
    B: Revisar la etiqueta o preguntar a su médico o farmacéutico antes de conducir.
    C: Beber café para contrarrestar cualquier posible somnolencia.
    D: Esperar una hora después de tomar el medicamento antes de conducir.
  answer: B
  explanation: Los conductores son responsables de conocer los efectos de cualquier
    medicamento que tomen. Se requiere revisar las etiquetas para ver las advertencias
    sobre el manejo de maquinaria pesada o consultar a un profesional médico.
- id: 139
  category: alcohol_drugs_health
  question: 'En Connecticut, si un conductor tiene una condición de salud que puede
    afectar su capacidad para conducir de manera segura, debe:'
  choices:
    A: Entregar su licencia de inmediato.
    B: Informar la condición al DMV al solicitar o renovar una licencia.
    C: Solo conducir durante las horas del día.
    D: Tener un pasajero en el automóvil en todo momento.
  answer: B
  explanation: La ley de Connecticut exige que los conductores informen al DMV sobre
    cualquier condición física o mental que pueda afectar su capacidad para operar
    un vehículo motorizado de manera segura.
- id: 140
  category: penalties_and_points
  question: Bajo el sistema de puntos de Connecticut, ¿cuántos puntos se asignan por
    rebasar a un autobús escolar detenido?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: Rebasar a un autobús escolar detenido en Connecticut resulta en la
    adición de 4 puntos a su historial de conducción.
- id: 141
  category: penalties_and_points
  question: Para una primera condena por DUI en Connecticut para un conductor mayor
    de 21 años, la licencia de conducir será suspendida por 45 días, seguida de ¿cuánto
    tiempo con un Dispositivo de Bloqueo de Encendido (IID)?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: B
  explanation: Una primera condena por DUI para un adulto en CT conlleva una suspensión
    de la licencia de 45 días y un requisito obligatorio de 1 año para un Dispositivo
    de Bloqueo de Encendido (IID).
- id: 142
  category: penalties_and_points
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad civil por daños
    a la propiedad requerido por ley en Connecticut?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Connecticut exige un mínimo de $25,000 para la responsabilidad
    por daños a la propiedad (parte del requisito 25/50/25).
- id: 143
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan en un historial de conducción de Connecticut
    por una condena de conducción temeraria (reckless driving)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: La conducción temeraria es una infracción grave en Connecticut y resulta
    en la adición de 6 puntos al historial del conductor.
- id: 144
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan en su historial de conducción de Connecticut
    por no obedecer una señal de alto o un semáforo en rojo?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: No obedecer una señal de alto o una señal de tráfico (luz roja) resulta
    en 2 puntos en su historial de conducción de CT.
- id: 145
  category: penalties_and_points
  question: 'Si un conductor de 16 o 17 años es condenado por exceso de velocidad
    (20 mph o más sobre el límite) por primera vez, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: Para conductores de 16 y 17 años, una primera condena por exceso de
    velocidad (más de 20 mph sobre el límite) resulta en una suspensión de la licencia
    de 60 días.
- id: 146
  category: penalties_and_points
  question: En Connecticut, ¿cuántos puntos se añaden a su historial por 'Seguir demasiado
    de cerca' (Following Too Closely)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Seguir demasiado de cerca es una infracción de 2 puntos en el estado
    de Connecticut.
- id: 147
  category: penalties_and_points
  question: ¿La licencia de conducir de Connecticut será suspendida si el conductor
    acumula cuántos puntos?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: B
  explanation: En Connecticut, alcanzar 10 puntos en su historial de conducción resulta
    en la suspensión de la licencia.
- id: 148
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'Rebase indebido' (Improper Passing) en
    el estado de Connecticut?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: El rebase indebido se considera una infracción de 3 puntos en Connecticut.
- id: 149
  category: penalties_and_points
  question: En Connecticut, si acumula cuántos puntos en su historial de conducción,
    ¿el DMV le enviará una carta de advertencia?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 8 puntos
    D: 10 puntos
  answer: B
  explanation: De acuerdo con el sistema de puntos del DMV de Connecticut, se envía
    una carta de advertencia al conductor cuando alcanza los 6 puntos en su historial
    de conducción.
- id: 150
  category: penalties_and_points
  question: 'Si un conductor es condenado por ''Conducción temeraria'' (Reckless Driving)
    por primera vez en Connecticut, puede enfrentar una multa de hasta:'
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: Una primera infracción de conducción temeraria en Connecticut puede
    resultar en una multa de hasta $300 y/o hasta 30 días de cárcel.
- id: 151
  category: penalties_and_points
  question: En Connecticut, si tiene 21 años o más y se niega a realizar una prueba
    química de BAC bajo el Consentimiento Implícito (Implied Consent), su licencia
    será suspendida por 45 días, seguidos de ¿cuánto tiempo con un Dispositivo de
    Bloqueo de Encendido (IID)?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: B
  explanation: Por una primera negativa a una prueba química (21 años o más), la sanción
    es una suspensión de 45 días seguida de 1 año conduciendo únicamente un vehículo
    equipado con un IID.
- id: 152
  category: penalties_and_points
  question: 'Las multas por infracciones de tráfico cometidas en una ''Zona de Trabajo''
    (Work Zone) de construcción o mantenimiento designada en Connecticut se:'
  choices:
    A: Triplican
    B: Duplican
    C: Aumentan en $100
    D: No cambian
  answer: B
  explanation: La ley de Connecticut dicta que las multas por exceso de velocidad
    u otras infracciones de tráfico se duplican cuando se cometen en una zona de trabajo
    designada.
- id: 153
  category: penalties_and_points
  question: En Connecticut, la licencia de un conductor será suspendida si acumula
    un total de ¿cuántos puntos en su registro?
  choices:
    A: 8 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: B
  explanation: El DMV de Connecticut suspenderá la licencia de un conductor una vez
    que alcance los 10 puntos en su registro de conducir.
- id: 154
  category: penalties_and_points
  question: 'Por una primera condena por usar un teléfono móvil de mano mientras conduce
    (para conductores de 18 años o más), la multa en Connecticut es de:'
  choices:
    A: $100
    B: $150
    C: $200
    D: $250
  answer: C
  explanation: La multa por una primera infracción por usar un teléfono celular de
    mano o un dispositivo electrónico móvil mientras se conduce en CT es de $200.
- id: 155
  category: penalties_and_points
  question: 'La ley de Connecticut exige que los conductores mantengan una cobertura
    mínima de seguro de responsabilidad civil de:'
  choices:
    A: $20,000/$40,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$25,000
    D: $15,000/$30,000/$5,000
  answer: B
  explanation: La ley de CT exige $25,000 por persona/$50,000 por accidente por lesiones
    corporales y $25,000 por daños a la propiedad.
- id: 156
  category: penalties_and_points
  question: Si un conductor de 24 años o menos comete ¿cuántas infracciones de movimiento?,
    se le requiere completar el Programa de Reentrenamiento de Operadores (Operator
    Retraining Program) del DMV.
  choices:
    A: Una infracción
    B: Dos infracciones
    C: Tres infracciones
    D: Cuatro infracciones
  answer: B
  explanation: En Connecticut, los conductores de 24 años o menos que tengan dos o
    más infracciones de movimiento deben completar un Programa de Reentrenamiento
    de Operadores.
- id: 157
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su registro de conducir de Connecticut por
    'Evadir Responsabilidad' (Evading Responsibility - Choque y Fuga) que involucre
    daños a la propiedad?
  choices:
    A: 5 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: C
  explanation: Evadir la responsabilidad (choque y fuga) es una de las infracciones
    más graves y conlleva 10 puntos en Connecticut.
- id: 158
  category: penalties_and_points
  question: En Connecticut, no ceder el paso a un vehículo de emergencia (Ley de Moverse
    a un Lado o 'Move Over Law') resulta en ¿cuántos puntos en su registro de conducir?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: No ceder el paso a un vehículo de emergencia es una infracción de 2
    puntos en Connecticut.
- id: 159
  category: penalties_and_points
  question: Una persona condenada por una primera infracción de DUI en Connecticut
    debe usar un Dispositivo de Bloqueo de Encendido (IID) por ¿cuánto tiempo después
    de que termine la suspensión de su licencia?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: B
  explanation: Una primera condena por DUI requiere una suspensión de la licencia
    de 45 días seguida de 1 año de uso del IID.
- id: 160
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'Exceso de Velocidad' (Speeding - exceder
    el límite indicado pero no considerado conducción temeraria) en Connecticut?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: A
  explanation: Las infracciones estándar por exceso de velocidad en Connecticut resultan
    en la adición de 1 punto al registro del conductor.
- id: 161
  category: sharing_the_road
  question: ¿Al rebasar una bicicleta en Connecticut, qué distancia debe mantener
    un conductor entre su vehículo y el ciclista?
  choices:
    A: Al menos 2 pies
    B: Al menos 3 pies
    C: Al menos 5 pies
    D: Una distancia igual al ancho del automóvil
  answer: B
  explanation: La ley de Connecticut (CGS 14-232a) exige que los automovilistas otorguen
    al menos tres pies de distancia al alcanzar y rebasar a una persona que monta
    una bicicleta.
- id: 162
  category: sharing_the_road
  question: La ley de "Hacerse a un lado" (Move Over) de Connecticut exige que los
    conductores se cambien a otro carril o reduzcan la velocidad al acercarse a ¿cuál
    de los siguientes vehículos estacionarios?
  choices:
    A: Solo vehículos de policía y bomberos
    B: Solo ambulancias y grúas
    C: Vehículos de emergencia, grúas y vehículos de mantenimiento con luces intermitentes
    D: Cualquier vehículo estacionado en el arcén con las luces de emergencia encendidas
  answer: C
  explanation: La ley de "Hacerse a un lado" (Move Over) de Connecticut (CGS 14-283b)
    se aplica a vehículos de emergencia estacionarios, grúas y vehículos de mantenimiento
    de carreteras que muestran luces intermitentes.
- id: 163
  category: sharing_the_road
  question: En Connecticut, al seguir a una motocicleta, ¿cuál es la distancia de
    seguimiento recomendada para garantizar la seguridad?
  choices:
    A: Al menos 1 segundo
    B: Al menos 2 segundos
    C: Al menos 3 a 4 segundos
    D: Al menos 10 segundos
  answer: C
  explanation: El Manual del Conductor de Connecticut recomienda una distancia de
    seguimiento de al menos 3 a 4 segundos cuando se circula detrás de una motocicleta
    para permitir que el motociclista tenga suficiente espacio para maniobrar o detenerse
    en una emergencia.
- id: 164
  category: sharing_the_road
  question: Según la ley de Connecticut, ¿cuándo NO es obligatorio detenerse ante
    un autobús escolar con luces rojas intermitentes?
  choices:
    A: Cuando viaja en la dirección opuesta en una carretera de varios carriles sin
      mediana
    B: Cuando viaja en la dirección opuesta en una carretera dividida separada por
      una mediana o barrera
    C: Cuando el autobús está detenido en el estacionamiento de una escuela
    D: Cuando viaja al menos 20 mph por debajo del límite de velocidad
  answer: B
  explanation: En Connecticut, debe detenerse ante un autobús escolar con luces rojas
    intermitentes a menos que se encuentre en el lado opuesto de una carretera dividida
    separada por una barrera física o mediana.
- id: 165
  category: sharing_the_road
  question: Según el Manual del Conductor de Connecticut, ¿qué distancia debe mantener
    al seguir a un equipo de bomberos (camión de bomberos) que responde a una alarma?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Connecticut prohíbe seguir a cualquier equipo de bomberos
    que viaje en respuesta a una alarma de incendio a una distancia menor de 500 pies.
- id: 166
  category: sharing_the_road
  question: En Connecticut, si un peatón utiliza un bastón blanco o un perro guía,
    ¿qué debe hacer el conductor?
  choices:
    A: Tocar la bocina para avisar que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse por completo y ceder el paso
    D: Rodearlos si hay suficiente espacio
  answer: C
  explanation: La ley de Connecticut exige que los conductores se detengan por completo
    y cedan el paso a cualquier peatón ciego o con discapacidad visual que lleve un
    bastón blanco o utilice un perro guía.
- id: 167
  category: sharing_the_road
  question: 'Los camiones comerciales grandes tienen puntos ciegos donde el conductor
    no puede ver a otros vehículos. Estas áreas se conocen comúnmente como:'
  choices:
    A: Zonas muertas (Dead Zones)
    B: Zonas prohibidas (No-Zones)
    C: Círculos de peligro
    D: Áreas de sombra
  answer: B
  explanation: El Manual del Conductor de Connecticut se refiere a los grandes puntos
    ciegos alrededor de la parte delantera, trasera y laterales de los camiones comerciales
    como "No-Zones" (Zonas prohibidas).
- id: 168
  category: sharing_the_road
  question: En Connecticut, ¿es legal el "lane splitting" (una motocicleta que circula
    entre filas de vehículos detenidos o en movimiento en el mismo carril)?
  choices:
    A: Sí, es legal a velocidades inferiores a 30 mph
    B: Sí, pero solo en autopistas
    C: No, es ilegal
    D: Sí, si el motociclista lleva casco
  answer: C
  explanation: El "lane splitting" es ilegal en Connecticut. Los motociclistas tienen
    derecho al uso completo de un carril, y ningún vehículo motorizado debe conducirse
    de manera que prive a cualquier motocicleta del uso completo de un carril.
- id: 169
  category: sharing_the_road
  question: Según la ley de "Usuario Vulnerable" de Connecticut, ¿qué le puede suceder
    a un conductor que no ejerce el cuidado razonable y causa la muerte o lesiones
    graves a un peatón o ciclista?
  choices:
    A: Una multa de hasta $1,000
    B: Una suspensión obligatoria de la licencia por 5 años
    C: Una multa de hasta $10,000
    D: Ninguna sanción específica aparte de una multa de tráfico estándar
  answer: A
  explanation: La Ley de Usuario Vulnerable de Connecticut (CGS 14-300i) permite una
    multa de hasta $1,000 para los conductores que no ejerzan el cuidado razonable
    y causen lesiones graves o la muerte de un "usuario vulnerable" (peatones, ciclistas,
    etc.).
- id: 170
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión puede:'
  choices:
    A: Permanecer completamente en el carril derecho
    B: Necesitar abrirse hacia la izquierda para completar el giro
    C: Detenerse siempre y esperar a que todo el tráfico se despeje
    D: Girar desde el carril izquierdo
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para no subir al bordillo al realizar un giro a la derecha. Los conductores deben
    evitar "apretarse" entre el camión y el bordillo.
- id: 171
  category: sharing_the_road
  question: 'En Connecticut, si se aproxima a un peatón en un cruce de peatones que
    NO está controlado por una señal de tráfico, usted debe:'
  choices:
    A: Reducir la velocidad y tocar la bocina
    B: Ceder el paso solo si el peatón está en su mitad de la carretera
    C: Ceder el derecho de paso si el peatón ha bajado de la acera
    D: Mantener la velocidad a menos que el peatón esté directamente frente a usted
  answer: C
  explanation: La ley de Connecticut (CGS 14-300) exige que los conductores cedan
    el derecho de paso a un peatón que haya bajado de la acera o haya entrado en el
    cruce de peatones en una intersección sin semáforos.
- id: 172
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las bicicletas
    en las carreteras de Connecticut?
  choices:
    A: Las bicicletas siempre deben circular por la acera
    B: Las bicicletas tienen los mismos derechos y deberes que los operadores de vehículos
      motorizados
    C: No se permiten bicicletas en carreteras con límites de velocidad superiores
      a 35 mph
    D: Las bicicletas siempre deben circular en sentido contrario al tráfico
  answer: B
  explanation: En Connecticut, las bicicletas se consideran legalmente vehículos cuando
    circulan por la carretera y los ciclistas tienen los mismos derechos y responsabilidades
    que los conductores de vehículos motorizados.
- id: 173
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima por detrás, la ley de Connecticut le exige:'
  choices:
    A: Detenerse exactamente donde está
    B: Aumentar la velocidad para apartarse del camino
    C: Detenerse en el borde derecho de la carretera y parar
    D: Detenerse en la mediana izquierda y parar
  answer: C
  explanation: La ley de Connecticut exige que los conductores se detengan en el borde
    o acera derecha de la carretera y paren hasta que el vehículo de emergencia haya
    pasado.
- id: 174
  category: sharing_the_road
  question: 'En Connecticut, se requiere un emblema de vehículo de movimiento lento
    (un triángulo naranja con borde rojo) para los vehículos que viajan a velocidades
    inferiores a:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El emblema de vehículo de movimiento lento se utiliza en vehículos,
    como maquinaria agrícola, que están diseñados para operar a velocidades de 25
    mph o menos.
- id: 175
  category: sharing_the_road
  question: Según la ley de Connecticut, ¿cuál es la distancia mínima que debe mantener
    un automovilista al adelantar o pasar una bicicleta que viaja en la misma dirección?
  choices:
    A: 2 pies
    B: 3 pies
    C: 10 pies
  answer: B
  explanation: Los Estatutos Generales de Connecticut exigen que los automovilistas
    otorguen al menos tres pies de distancia al pasar una bicicleta.
- id: 176
  category: sharing_the_road
  question: 'Al seguir a una motocicleta en Connecticut, un conductor debe mantener
    una distancia de seguimiento mínima de al menos:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 a 4 segundos
    D: 10 segundos
  answer: C
  explanation: El Manual del Conductor de CT recomienda una distancia de seguimiento
    de 3 a 4 segundos detrás de las motocicletas porque pueden detenerse mucho más
    rápido que los automóviles y se ven afectados más fácilmente por las condiciones
    de la carretera.
- id: 177
  category: sharing_the_road
  question: 'Según la ley de Connecticut, si usted está girando a la derecha y un
    ciclista viaja recto a través de la intersección por su lado derecho, usted debe:'
  choices:
    A: Aumentar la velocidad para pasar la bicicleta antes de girar
    B: Ceder el paso al ciclista y dejarlo pasar antes de girar
    C: Tocar la bocina para decirle al ciclista que se detenga
    D: Girar rápidamente para que el ciclista tenga que frenar
  answer: B
  explanation: La ley de CT prohíbe 'cortar el paso' (hooking) a un ciclista. Debe
    ceder el paso a cualquier ciclista que viaje recto antes de realizar un giro a
    la derecha.
- id: 178
  category: sharing_the_road
  question: 'Los camiones comerciales grandes tienen ''Zonas Prohibidas'' (No-Zones).
    Estas son áreas donde:'
  choices:
    A: No se permite la circulación de camiones
    B: Se permite que los autos se estacionen por períodos cortos
    C: El conductor del camión tiene visibilidad limitada o nula
    D: El límite de velocidad se reduce para todos los vehículos
  answer: C
  explanation: Las 'No-Zones' son los grandes puntos ciegos alrededor de la parte
    delantera, trasera y laterales de un camión donde el conductor no puede ver a
    otros vehículos.
- id: 179
  category: sharing_the_road
  question: 'En Connecticut, cuando un peatón cruza la calle usando un bastón blanco
    o un perro guía, usted debe:'
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Tocar la bocina para avisarles que usted está allí
    C: Detenerse por completo y ceder el derecho de paso
    D: Rodearlos si hay suficiente espacio
  answer: C
  explanation: La ley de Connecticut exige que los conductores se detengan por completo
    ante cualquier peatón que lleve un bastón blanco o utilice un perro guía.
- id: 180
  category: sharing_the_road
  question: 'En Connecticut, los ciclistas generalmente están obligados a:'
  choices:
    A: Circular por la acera en todo momento
    B: Circular en sentido contrario al tráfico
    C: Seguir las mismas reglas de la carretera que los vehículos motorizados
    D: Solo circular por carriles para bicicletas designados
  answer: C
  explanation: Según la ley de CT, los ciclistas tienen los mismos derechos y deberes
    que los conductores de vehículos motorizados y deben seguir todas las señales
    y letreros de tráfico.
- id: 181
  category: sharing_the_road
  question: 'Al conducir cerca de una motocicleta, nunca debe:'
  choices:
    A: Compartir un carril con la motocicleta
    B: Rebasar la motocicleta en una zona de adelantamiento
    C: Bajar las luces altas
    D: Usar sus señales de giro
  answer: A
  explanation: Una motocicleta tiene derecho al ancho total de un carril. Nunca debe
    intentar compartir un carril con una motocicleta.
- id: 182
  category: sharing_the_road
  question: 'Cuando un autobús escolar muestra luces amarillas intermitentes, significa
    que:'
  choices:
    A: El autobús está a punto de detenerse y usted debe prepararse para parar
    B: Debe detenerse inmediatamente
    C: El autobús se ha averiado
    D: Debe acelerar para rebasar al autobús
  answer: A
  explanation: Las luces amarillas intermitentes en un autobús escolar indican que
    el autobús se está preparando para detenerse para subir o bajar niños. Los conductores
    deben reducir la velocidad y prepararse para detenerse.
- id: 183
  category: sharing_the_road
  question: 'Si sigue a un camión por la noche, debe:'
  choices:
    A: Mantener las luces altas encendidas para ver mejor el camino
    B: Bajar sus luces delanteras para evitar cegar al conductor del camión a través
      de sus grandes espejos laterales
    C: Seguir lo más cerca posible para mantenerse en su corriente de aire
    D: Parpadear sus luces repetidamente para que sepan que usted está allí
  answer: B
  explanation: Los espejos laterales grandes de los camiones pueden reflejar las luces
    altas hacia los ojos del conductor. Debe bajar sus luces delanteras cuando siga
    a cualquier vehículo, especialmente a camiones grandes.
- id: 184
  category: sharing_the_road
  question: 'En Connecticut, los peatones tienen el derecho de paso en un cruce peatonal:'
  choices:
    A: Solo si el cruce está marcado con pintura
    B: Solo si hay una señal de "Caminar" (Walk)
    C: Tanto en cruces marcados como no marcados
    D: Solo durante las horas del día
  answer: C
  explanation: La ley de Connecticut otorga a los peatones el derecho de paso en cualquier
    intersección, ya sea que el cruce peatonal esté marcado o no.
- id: 185
  category: vehicle_information
  question: 'Según el Manual del Conductor de Connecticut, debe encender sus luces
    delanteras desde:'
  choices:
    A: El atardecer hasta el amanecer
    B: Una hora después del atardecer hasta una hora antes del amanecer
    C: Media hora después del atardecer hasta media hora antes del amanecer
    D: 8:00 PM hasta las 6:00 AM
  answer: C
  explanation: En Connecticut, las luces delanteras deben usarse desde media hora
    después del atardecer hasta media hora antes del amanecer, o siempre que la visibilidad
    sea inferior a 500 pies.
- id: 186
  category: vehicle_information
  question: Según la ley de Connecticut, el polarizado de ventanas no original en
    las ventanas laterales de un vehículo de pasajeros debe permitir el paso de al
    menos ¿qué porcentaje de luz?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: La ley de Connecticut (CGS 14-99g) exige que las ventanas laterales
    permitan el paso de al menos el 35% de la luz (más o menos un 3% de variación).
- id: 187
  category: vehicle_information
  question: A partir del 1 de octubre de 2021, ¿cuál es el requisito del cinturón
    de seguridad para los pasajeros adultos en el asiento trasero de un vehículo en
    Connecticut?
  choices:
    A: Solo los pasajeros menores de 18 años deben usar el cinturón de seguridad en
      el asiento trasero
    B: Solo los pasajeros en el asiento delantero están obligados a usar el cinturón
      de seguridad
    C: Todos los pasajeros en todas las posiciones de asiento deben usar el cinturón
      de seguridad
    D: Los pasajeros del asiento trasero solo están obligados a usar el cinturón en
      las autopistas
  answer: C
  explanation: A partir del 1 de octubre de 2021, la ley de Connecticut exige que
    todos los pasajeros de un vehículo motorizado usen el cinturón de seguridad, independientemente
    de su edad o de dónde estén sentados en el vehículo.
- id: 188
  category: vehicle_information
  question: En Connecticut, un niño debe permanecer en un sistema de retención infantil
    orientado hacia atrás hasta que alcance ¿cuál de los siguientes hitos?
  choices:
    A: 1 año de edad y 20 libras
    B: 2 años de edad y 30 libras
    C: 4 años de edad y 40 libras
    D: 5 años de edad y 50 libras
  answer: B
  explanation: La ley de Connecticut exige que los niños permanezcan en un sistema
    de retención infantil orientado hacia atrás hasta que tengan al menos dos años
    de edad Y pesen 30 libras o más.
- id: 189
  category: vehicle_information
  question: 'En Connecticut, un niño debe estar asegurado en un asiento elevado (booster
    seat) u otro sistema de retención infantil apropiado hasta que tenga:'
  choices:
    A: 5 años de edad y 40 libras
    B: 6 años de edad y 50 libras
    C: 8 años de edad y 60 libras
    D: 10 años de edad y 80 libras
  answer: C
  explanation: Los niños en Connecticut deben usar un asiento elevado (booster seat)
    hasta que tengan al menos 8 años de edad Y pesen al menos 60 libras.
- id: 190
  category: vehicle_information
  question: Si no realiza la prueba de emisiones de su vehículo antes de la fecha
    de vencimiento en Connecticut, ¿cuál es la multa por pago atrasado?
  choices:
    A: Sin cargo, solo una advertencia
    B: $10
    C: $20
    D: $50
  answer: C
  explanation: Connecticut cobra un cargo por pago atrasado de $20 si la prueba de
    emisiones no se realiza para la fecha de vencimiento programada.
- id: 191
  category: vehicle_information
  question: 'La ley de Connecticut exige que el freno de estacionamiento de su vehículo
    sea capaz de detener el vehículo en cualquier pendiente:'
  choices:
    A: Solo cuando el vehículo está vacío
    B: Solo en superficies planas
    C: Independientemente de la carga que lleve el vehículo
    D: Solo si el vehículo es de transmisión automática
  answer: C
  explanation: El freno de estacionamiento debe ser lo suficientemente fuerte como
    para detener el vehículo en cualquier colina (pendiente) en la que se conduzca,
    independientemente del peso de la carga.
- id: 192
  category: vehicle_information
  question: En Connecticut, ¿cuántos espejos debe tener como mínimo cada vehículo
    motorizado que proporcionen una vista de la carretera hacia atrás de al menos
    200 pies?
  choices:
    A: Un espejo
    B: Dos espejos
    C: Tres espejos
    D: Cuatro espejos
  answer: B
  explanation: La ley de Connecticut exige al menos dos espejos (generalmente un espejo
    lateral del conductor y un espejo retrovisor interior) que proporcionen una vista
    de al menos 200 pies hacia atrás.
- id: 193
  category: vehicle_information
  question: 'De acuerdo con la ley de Connecticut ''Limpiaparabrisas encendidos, luces
    encendidas'' (Wipers On, Lights On), debe encender los faros delanteros cuando:'
  choices:
    A: Está nublado
    B: Está conduciendo a través de un túnel
    C: Está usando los limpiaparabrisas debido a la lluvia, nieve o hielo
    D: Está conduciendo en una calle de un solo sentido
  answer: C
  explanation: La ley de Connecticut exige que los conductores enciendan los faros
    delanteros siempre que las condiciones climáticas requieran el uso continuo de
    los limpiaparabrisas.
- id: 194
  category: vehicle_information
  question: ¿Entre qué fechas se permite el uso de neumáticos con clavos (studded
    tires) en vehículos motorizados en Connecticut?
  choices:
    A: Del 1 de octubre al 1 de abril
    B: Del 1 de noviembre al 1 de abril
    C: Del 15 de noviembre al 30 de abril
    D: Del 1 de diciembre al 15 de marzo
  answer: C
  explanation: La ley de Connecticut permite el uso de neumáticos con clavos únicamente
    desde el 15 de noviembre hasta el 30 de abril.
- id: 195
  category: vehicle_information
  question: En Connecticut, ¿cuál es la profundidad mínima legal de la banda de rodadura
    de los neumáticos para pasar la inspección y ser considerados seguros?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Según el Manual del Conductor de Connecticut, los neumáticos se consideran
    inseguros si están desgastados a menos de 2/32 de pulgada de banda de rodadura.
- id: 196
  category: vehicle_information
  question: Según la ley de Connecticut, ¿cuándo debe encender los faros delanteros?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde media hora después del atardecer hasta media hora antes del amanecer
    C: Desde una hora después del atardecer hasta una hora antes del amanecer
    D: Solo cuando está lloviendo o nevando
  answer: B
  explanation: La ley de Connecticut exige que los faros delanteros estén encendidos
    desde media hora después del atardecer hasta media hora antes del amanecer, o
    siempre que la visibilidad sea inferior a 500 pies.
- id: 197
  category: vehicle_information
  question: En Connecticut, ¿debe bajar las luces altas (cambiar a luces bajas) siempre
    que se encuentre a cuántos pies de un vehículo que viene en dirección contraria?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Connecticut exige que los conductores cambien a luces bajas
    cuando un vehículo que viene en dirección contraria esté a menos de 500 pies para
    evitar cegar al otro conductor.
- id: 198
  category: vehicle_information
  question: Según la ley de Connecticut, ¿cuál es el nivel máximo de polarizado de
    ventanas permitido en las ventanas laterales de un vehículo de pasajeros?
  choices:
    A: No se permite ningún polarizado
    B: Transmisión de luz de al menos el 20%
    C: Transmisión de luz de al menos el 35%
    D: Transmisión de luz de al menos el 50%
  answer: C
  explanation: La ley de Connecticut exige que las ventanas laterales permitan el
    paso de al menos el 35% de la luz. Un polarizado más oscuro que este es ilegal
    sin una exención médica.
- id: 199
  category: vehicle_information
  question: 'Bajo la ley de Connecticut ''Limpiaparabrisas encendidos, luces encendidas''
    (Wipers On, Lights On), si está usando los limpiaparabrisas debido al clima, también
    debe:'
  choices:
    A: Encender las luces de emergencia
    B: Encender las luces altas
    C: Encender los faros delanteros
    D: Apagar la radio
  answer: C
  explanation: La ley de Connecticut exige que si las condiciones climáticas requieren
    el uso de limpiaparabrisas, también se deben encender los faros delanteros del
    vehículo.
- id: 200
  category: vehicle_information
  question: En Connecticut, ¿cuál es la multa para un conductor no comercial que no
    retira el hielo o la nieve acumulada de su vehículo antes de conducir?
  choices:
    A: $25
    B: $75
    C: $150
    D: $250
  answer: B
  explanation: Según el Estatuto General de Connecticut 14-252a, no retirar la nieve
    o el hielo de un vehículo no comercial resulta en una multa de $75, que puede
    aumentar significativamente si el hielo/nieve causa lesiones o daños a la propiedad.
- id: 201
  category: vehicle_information
  question: 'Todo vehículo motorizado en Connecticut debe estar equipado con una bocina
    que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Las regulaciones de seguridad de Connecticut requieren una bocina que
    sea audible por al menos 200 pies en condiciones normales.
- id: 202
  category: vehicle_information
  question: 'En Connecticut, las luces de freno de su vehículo deben ser visibles
    desde la parte trasera a una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Las luces de freno deben ser rojas y visibles desde una distancia de
    al menos 300 pies bajo la luz solar normal.
- id: 203
  category: vehicle_information
  question: ¿Cuáles son los límites mínimos de seguro de responsabilidad civil por
    lesiones corporales requeridos por ley en Connecticut para un accidente que involucre
    a dos o más personas?
  choices:
    A: $20,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: C
  explanation: La ley de Connecticut exige una responsabilidad civil mínima por lesiones
    corporales de $25,000 por persona y $50,000 por accidente (cuando dos o más personas
    resultan heridas).
- id: 204
  category: vehicle_information
  question: 'En Connecticut, el espejo retrovisor debe ajustarse de modo que el conductor
    pueda ver la carretera a una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: Las regulaciones estatales requieren que los espejos proporcionen una
    vista de la carretera de al menos 200 pies detrás del vehículo.
- id: 205
  category: vehicle_information
  question: Si las luces direccionales de su vehículo no funcionan, debe usar señales
    manuales. ¿Cuál es la señal manual correcta para un giro a la derecha en Connecticut?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana
    B: Brazo extendido hacia afuera y doblado hacia arriba en el codo
    C: Brazo extendido hacia afuera y doblado hacia abajo en el codo
    D: Brazo moviéndose en movimiento circular
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido hacia afuera de la ventana y doblado hacia arriba en un ángulo de 90
    grados.
- id: 206
  category: signs_and_signals
  question: En Connecticut, ¿qué significa una luz de tráfico amarilla intermitente?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Reducir la velocidad y proceder con precaución
    C: Aumentar la velocidad para despejar la intersección rápidamente
    D: Tratarla como una parada de cuatro vías (four-way stop)
  answer: B
  explanation: Según el Manual del Conductor de Connecticut, una luz amarilla intermitente
    significa que debe reducir la velocidad y proceder con precaución a través de
    la intersección.
- id: 207
  category: signs_and_signals
  question: Cuando encuentre una flecha amarilla intermitente en una intersección
    en Connecticut, ¿qué debe hacer?
  choices:
    A: Usted tiene el derecho de paso para girar
    B: Detenerse y esperar a una flecha verde
    C: Se permiten los giros, pero primero debe ceder el paso al tráfico que viene
      en sentido contrario y a los peatones
    D: La señal está averiada; trátela como una señal de alto
  answer: C
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero no están "protegidos", lo que significa que debe ceder el
    paso al tráfico que viene en sentido contrario y a los peatones antes de girar.
- id: 208
  category: signs_and_signals
  question: 'En Connecticut, una señal en forma de "Banderín" (triángulo isósceles
    que apunta a la derecha) que se encuentra en el lado izquierdo de la carretera
    indica:'
  choices:
    A: Una zona escolar
    B: Un requisito de ceder el paso
    C: Una zona de no rebasar
    D: Un cruce de ferrocarril
  answer: C
  explanation: La señal en forma de banderín se coloca en el lado izquierdo de la
    carretera y marca el comienzo de una zona de no rebasar.
- id: 209
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de pentágono en Connecticut?
  choices:
    A: Ceda el paso
    B: Pare
    C: Zona escolar o cruce escolar
    D: Cruce de ferrocarril más adelante
  answer: C
  explanation: Una señal de cinco lados (pentágono) indica que está cerca de una escuela.
    Advierte sobre zonas escolares y cruces escolares.
- id: 210
  category: signs_and_signals
  question: 'Según la ley de Connecticut, si se aproxima a una intersección con una
    luz roja fija pero tiene la intención de girar a la derecha, puede hacerlo después
    de detenerse a menos que:'
  choices:
    A: Sea después de las 11:00 PM
    B: Haya una señal de "No Turn on Red" (No girar en rojo) publicada
    C: Se encuentre en una zona residencial
    D: Tenga un pasajero menor de 18 años
  answer: B
  explanation: En Connecticut, puede girar a la derecha en rojo después de detenerse
    por completo y ceder el paso al tráfico y peatones, siempre que no haya una señal
    que prohíba el giro.
- id: 211
  category: signs_and_signals
  question: ¿Qué indican las 'Marcas de carril compartido' (Sharrows) —un símbolo
    de bicicleta con dos galones (chevrones)— en las carreteras de Connecticut?
  choices:
    A: Las bicicletas están prohibidas en esta carretera
    B: El carril está reservado exclusivamente para bicicletas
    C: Las bicicletas pueden ocupar todo el carril y los automovilistas deben esperarlas
    D: Los automovilistas deben mantener una velocidad de al menos 25 mph
  answer: C
  explanation: Las marcas Sharrows se utilizan para ayudar a los ciclistas a posicionarse
    en un carril compartido y alertar a los automovilistas de que los ciclistas pueden
    ocupar todo el carril de circulación.
- id: 212
  category: signs_and_signals
  question: 'En Connecticut, una señal en forma de diamante con fondo naranja indica:'
  choices:
    A: Advertencia general de peligros en la carretera
    B: Zonas de trabajo de construcción o mantenimiento
    C: Parque estatal o área recreativa
    D: Guía direccional para autopistas
  answer: B
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para zonas de trabajo de construcción y mantenimiento para advertir a los conductores
    sobre condiciones inusuales o potencialmente peligrosas.
- id: 213
  category: signs_and_signals
  question: Según el Manual del Conductor de Connecticut, ¿qué significa una línea
    blanca sólida doble entre los carriles de tráfico?
  choices:
    A: Puede cruzar para rebasar si es seguro
    B: Se desaconsejan los cambios de carril, pero están permitidos
    C: Está en una calle de sentido único
    D: Se le prohíbe cruzar las líneas para cambiar de carril
  answer: D
  explanation: Una línea blanca sólida doble indica que los cambios de carril están
    prohibidos. Debe permanecer en su carril.
- id: 214
  category: signs_and_signals
  question: Si se encuentra en una intersección en Connecticut y el semáforo tiene
    una flecha verde fija apuntando a la izquierda, ¿qué indica esto?
  choices:
    A: Puede girar a la izquierda después de ceder el paso al tráfico que viene en
      sentido contrario
    B: Tiene un giro protegido; el tráfico que viene en sentido contrario está detenido
      por una luz roja
    C: Debe detenerse y esperar a una luz verde circular
    D: La flecha es solo para vehículos de emergencia
  answer: B
  explanation: Una flecha verde significa que tiene un giro 'protegido'. El tráfico
    que viene en sentido contrario está detenido, lo que le permite girar en la dirección
    de la flecha.
- id: 215
  category: signs_and_signals
  question: En Connecticut, al usar señales manuales para indicar un giro, ¿cómo se
    señala un 'Giro a la derecha'?
  choices:
    A: Extienda el brazo izquierdo por la ventana y apunte directamente hacia afuera
    B: Extienda el brazo izquierdo por la ventana y apunte hacia abajo
    C: Extienda el brazo izquierdo por la ventana y apunte hacia arriba
    D: Extienda el brazo derecho por la ventana del pasajero
  answer: C
  explanation: Para señalar un giro a la derecha mediante señales manuales, extienda
    el brazo izquierdo por la ventana y dóblelo hacia arriba a la altura del codo.
- id: 216
  category: signs_and_signals
  question: ¿Qué símbolo en el pavimento marca un carril para 'Vehículos de alta ocupación'
    (HOV) en Connecticut?
  choices:
    A: Un cuadrado blanco
    B: Un diamante blanco
    C: Un círculo amarillo
    D: Un triángulo verde
  answer: B
  explanation: Los carriles HOV, que están reservados para vehículos con un número
    específico de ocupantes, están marcados con un símbolo de diamante blanco en el
    pavimento.
- id: 217
  category: signs_and_signals
  question: Al acercarse a una rotonda en Connecticut, ¿qué le exigen normalmente
    las marcas en el pavimento y las señales?
  choices:
    A: Detenerse antes de entrar al círculo
    B: Ceder el paso al tráfico que ya está en el círculo
    C: Usar siempre el carril izquierdo para salir
    D: Acelerar para incorporarse al tráfico
  answer: B
  explanation: Los conductores que se acercan a una rotonda deben ceder el paso al
    tráfico que ya circula en ella y a los peatones en el cruce peatonal.
- id: 218
  category: signs_and_signals
  question: 'En Connecticut, una señal de tráfico de color marrón proporciona información
    sobre:'
  choices:
    A: Servicios hospitalarios y médicos
    B: Leyes reglamentarias
    C: Áreas de recreación pública e interés cultural
    D: Desvíos de construcción
  answer: C
  explanation: Las señales marrones se utilizan para guiar a los viajeros a áreas
    de recreación pública, parques estatales y puntos de interés cultural o histórico.
- id: 219
  category: signs_and_signals
  question: En Connecticut, si está usando señales manuales y su brazo izquierdo está
    extendido directamente hacia afuera de la ventana, ¿qué indica esto?
  choices:
    A: Está disminuyendo la velocidad o deteniéndose
    B: Está haciendo un giro a la derecha
    C: Está haciendo un giro a la izquierda
    D: Está indicando al coche de atrás que lo rebase
  answer: C
  explanation: Según el Manual del Conductor de Connecticut, el brazo izquierdo extendido
    directamente hacia afuera indica un giro a la izquierda.
- id: 220
  category: signs_and_signals
  question: En Connecticut, ¿qué significa una señal de 'X' amarilla fija sobre un
    carril de la autopista?
  choices:
    A: El carril está a punto de cerrarse; debe salir de él tan pronto como sea seguro
    B: El carril está reservado solo para vehículos de emergencia
    C: Puede usar el carril para rebasar el tráfico más lento
    D: El carril está abierto para todo el tráfico
  answer: A
  explanation: Una 'X' amarilla fija sobre un carril indica que la señal del carril
    está a punto de cambiar a una 'X' roja y el conductor debe prepararse para abandonar
    ese carril de manera segura.
- id: 221
  category: signs_and_signals
  question: Según la ley de Connecticut, cuando un peatón se encuentra en un cruce
    de peatones, incluso si no está marcado, ¿qué debe hacer un conductor?
  choices:
    A: Tocar la bocina para advertir al peatón de su presencia
    B: Reducir la velocidad pero continuar si el peatón no está en su carril
    C: Detenerse y permanecer detenido hasta que el peatón haya cruzado el carril
      del conductor
    D: Solo detenerse si hay una señal de "Ceda el paso a los peatones" (Yield to
      Pedestrians) presente
  answer: C
  explanation: La ley de Connecticut exige que los conductores se detengan y permanezcan
    detenidos ante los peatones en un cruce de peatones (marcado o no marcado) una
    vez que el peatón haya bajado de la acera.
- id: 222
  category: signs_and_signals
  question: En Connecticut, ¿qué indican las líneas blancas sólidas dobles pintadas
    en el pavimento?
  choices:
    A: Se permite cambiar de carril con precaución
    B: El borde de la calzada
    C: Los cambios de carril están prohibidos
    D: Un carril de giro compartido
  answer: C
  explanation: Las líneas blancas sólidas dobles indican que está prohibido cambiar
    de carril. Estas se ven a menudo cerca de las rampas de salida o en los carriles
    para vehículos de alta ocupación (HOV).
- id: 223
  category: signs_and_signals
  question: Si se encuentra en una intersección con luz verde pero el tráfico está
    congestionado dentro de la intersección, ¿qué debe hacer según la ley de CT?
  choices:
    A: Entrar en la intersección y esperar a que el tráfico avance
    B: Tocar la bocina hasta que el tráfico se despeje
    C: Esperar hasta que haya suficiente espacio al otro lado para despejar la intersección
      por completo
    D: Girar a la derecha en su lugar para evitar la congestión
  answer: C
  explanation: Los principios de "No bloquee el cruce" (Don't Block the Box) de Connecticut
    establecen que no debe entrar en una intersección a menos que pueda atravesarla
    por completo sin detenerse, para evitar bloquear el tráfico transversal.
- id: 224
  category: signs_and_signals
  question: ¿Cuál es el propósito de una marca de "sharrow" (un símbolo de bicicleta
    con dos galones o flechas) en una carretera de Connecticut?
  choices:
    A: Marca un carril reservado exclusivamente para bicicletas
    B: Indica un carril compartido tanto por ciclistas como por vehículos motorizados
    C: Indica una zona solo para peatones
    D: Marca el inicio de una autopista
  answer: B
  explanation: Los "sharrows" se utilizan para indicar que un carril es compartido
    por bicicletas y vehículos motorizados, y ayudan a los ciclistas a posicionarse
    de forma segura en el tráfico.
- id: 225
  category: signs_and_signals
  question: 'En Connecticut, una señal que muestra una flecha blanca curvada hacia
    la derecha con un círculo rojo y una raya diagonal encima significa:'
  choices:
    A: Se permiten los giros a la derecha solo después de detenerse
    B: No se permite girar a la derecha
    C: Tráfico en un solo sentido hacia la derecha
    D: Ceder el paso al tráfico que viene por la derecha
  answer: B
  explanation: Un círculo rojo con una raya diagonal es el símbolo estándar para "No"
    o "Prohibido". Combinado con una flecha a la derecha, significa que no se permiten
    los giros a la derecha.
- id: 226
  category: signs_and_signals
  question: 'Cuando vea una señal de "Ceda el paso" (Yield) en la entrada de una rotonda
    en Connecticut, debe ceder el paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en la rotonda
    C: A nadie; usted tiene la prioridad de paso
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: En una rotonda, el tráfico que ya está en el círculo tiene la prioridad
    de paso. Los vehículos que entran deben ceder el paso a los que están circulando.
- id: 227
  category: signs_and_signals
  question: ¿Qué significa una línea amarilla sólida junto a una línea amarilla discontinua
    en el pavimento en Connecticut?
  choices:
    A: Está prohibido adelantar en ambas direcciones
    B: Se permite adelantar en ambas direcciones
    C: Se permite adelantar solo para el lado que tiene la línea discontinua
    D: Se permite adelantar solo para el lado que tiene la línea sólida
  answer: C
  explanation: Una línea amarilla discontinua junto a una línea amarilla sólida indica
    que el adelantamiento solo está permitido para los conductores del lado de la
    línea discontinua.
- id: 228
  category: signs_and_signals
  question: En Connecticut, ¿qué indica una señal con fondo amarillo y una "X" negra
    con las letras "RR"?
  choices:
    A: Zona de furia al volante (Road Rage) más adelante
    B: Calzada restringida
    C: Cruce de ferrocarril (Railroad crossing) más adelante
    D: Carretera en mal estado más adelante
  answer: C
  explanation: La señal circular amarilla con una "X" negra y "RR" es la señal de
    advertencia anticipada de un cruce de ferrocarril.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octogonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 229
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para dejar que otros pasen con seguridad.
  id: 230
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRE (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 231
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una calle de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 232
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: El tráfico fluye en una sola dirección — hacia la izquierda
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección — la dirección
    hacia la que apunta la flecha.
  id: 233
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 234
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 235
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 236
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 237
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 238
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 239
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 240
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 241
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 242
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 243
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de vías. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 244
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 245
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 246
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera curve
    primero hacia un lado y luego hacia el otro.
  id: 247
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 248
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: Inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 249
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción del ancho de la vía y ajuste su
    posición en el carril.
  id: 250
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 251
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    de doble sentido.
  id: 252
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 253
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 254
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente empinada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente empinada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 255
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 256
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 257
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 258
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la autopista desde la calle lateral.
  id: 259
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril — no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 260
