metadata:
  source: Hawaii Driver's Manual (hidot.hawaii.gov)
  total_questions: 374
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: vehicle_information
  question: What constitutes an 'abandoned vehicle' according to the Hawaii driver's
    manual?
  choices:
    A: Any vehicle left unattended on the highway for more than 12 hours.
    B: Any vehicle left unattended on the highway for more than 24 hours.
    C: Any vehicle parked illegally in a tow-away zone.
    D: Any vehicle left on private property for more than 48 hours.
  answer: B
  explanation: The manual defines an Abandoned Vehicle as 'Any vehicle left unattended
    on the highway for more than 24 hours.'
- id: 2
  category: vehicle_information
  question: Which of the following is required for a vehicle to be classified as an
    emergency vehicle?
  choices:
    A: A yellow flashing light and a megaphone.
    B: A white flashing light and a siren.
    C: A blue or red flashing light and a warning sound system.
    D: A green flashing light and a public address system.
  answer: C
  explanation: An Emergency Vehicle is defined as being 'properly equipped with a
    blue or red flashing light and warning sound system.'
- id: 3
  category: vehicle_information
  question: How is a 'bicycle' defined in terms of wheel diameter?
  choices:
    A: 12 inches or greater
    B: 14 inches or greater
    C: 16 inches or greater
    D: 20 inches or greater
  answer: C
  explanation: A bicycle is defined as 'A device with two or three wheels having a
    diameter of 16" or greater propelled by human power.'
- id: 4
  category: vehicle_information
  question: A 'bus' is defined as a motor vehicle designed for carrying more than
    how many passengers?
  choices:
    A: 6 passengers
    B: 8 passengers
    C: 10 passengers
    D: 15 passengers
  answer: C
  explanation: The manual defines a Bus as 'Every motor vehicle designed for carrying
    more than ten passengers and used for the transportation of persons.'
- id: 5
  category: safe_driving_rules
  question: In a business district, buildings in use for business or industrial purposes
    must occupy at least how much frontage along a 600-foot stretch of highway?
  choices:
    A: 100 feet on one side
    B: 200 feet collectively on both sides
    C: 300 feet on one side or 300 feet collectively on both sides
    D: 400 feet on one side
  answer: C
  explanation: A Business District requires buildings that 'occupy at least three
    hundred feet of frontage on one side or three hundred feet collectively on both
    sides of the highway' within a 600-foot stretch.
- id: 6
  category: license_system
  question: 'A single vehicle is considered a Commercial Motor Vehicle for driver
    licensing purposes if it has a gross vehicle weight rating (GVWR) of at least:'
  choices:
    A: 10,001 pounds
    B: 15,000 pounds
    C: 20,001 pounds
    D: 26,001 pounds
  answer: D
  explanation: A Commercial Motor Vehicle includes a single vehicle that 'has a gross
    vehicle weight rating of 26,001 or more pounds.'
- id: 7
  category: license_system
  question: A vehicle of any GVWR is considered a Commercial Motor Vehicle if it is
    designed to transport how many occupants, including the driver?
  choices:
    A: 10 or more
    B: 12 or more
    C: 15 or more
    D: 16 or more
  answer: D
  explanation: A vehicle is a Commercial Motor Vehicle 'If the vehicle (any GVWR),
    is designed to transport sixteen or more occupants including the driver.'
- id: 8
  category: license_system
  question: 'A vehicle of any GVWR is classified as a Commercial Motor Vehicle if
    it is used for:'
  choices:
    A: Transporting agricultural goods across state lines.
    B: Transporting hazardous materials requiring placarding.
    C: Interstate commerce only.
    D: Towing vehicles under 10,000 pounds.
  answer: B
  explanation: A vehicle is considered a Commercial Motor Vehicle 'If the vehicle,
    (any GVWR), is used in the transportation of hazardous materials requiring placarding.'
- id: 9
  category: license_system
  question: How many documents are required to prove principal residence when applying
    for a driver's license?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: 'The manual explicitly states: ''Two documents are required to prove
    principal residence.'''
- id: 10
  category: license_system
  question: 'According to the manual, a birth certificate can document a person''s
    legal name, date of birth, and:'
  choices:
    A: Principal residence
    B: Social security number
    C: Legal presence
    D: Driving record
  answer: C
  explanation: 'The manual notes that some documents serve more than one purpose:
    ''For example, a birth certificate can document a person’s legal name, date of
    birth and legal presence.'''
- id: 11
  category: vehicle_information
  question: Which manual provides comprehensive coverage of laws and operating techniques
    concerning motorcycles?
  choices:
    A: DOTH2044
    B: DOTH2053
    C: DOTH1022
    D: DOTH3055
  answer: B
  explanation: 'The text states: ''A separate Motorcycle Operator Manual, DOTH2053,
    is available to provide more comprehensive coverage of laws and operating techniques
    concerning motorcycles.'''
- id: 12
  category: license_system
  question: What is the document number for the Driver's Manual for Commercial Vehicle
    Driver Licensing?
  choices:
    A: DOTH2044
    B: DOTH2053
    C: DOTH1912
    D: DOTH2000
  answer: A
  explanation: 'The text states: ''A separate Driver’s Manual for Commercial Vehicle
    Driver Licensing, DOTH2044, is available...'''
- id: 13
  category: vehicle_information
  question: A bicycle is defined as a device propelled by human power with how many
    wheels?
  choices:
    A: Exactly two wheels
    B: Two or three wheels
    C: Two or four wheels
    D: Three or four wheels
  answer: B
  explanation: The manual defines a bicycle as 'A device with two or three wheels...
    propelled by human power.'
- id: 14
  category: license_system
  question: 'A combination of motor vehicles is considered a Commercial Motor Vehicle
    if it has a gross combination weight rating of 26,001 or more pounds inclusive
    of a towed unit(s) with a gross vehicle weight rating of more than:'
  choices:
    A: 5,000 pounds
    B: 8,000 pounds
    C: 10,000 pounds
    D: 15,000 pounds
  answer: C
  explanation: A Commercial Motor Vehicle includes a combination of vehicles with
    a GCWR of 26,001+ pounds 'inclusive of a towed unit(s) with a gross vehicle weight
    rating of more than 10,000 pounds.'
- id: 15
  category: driver_testing
  question: In the City and County of Honolulu, what are the standard testing hours
    for a driver's license?
  choices:
    A: 7:45 a.m. to 4:00 p.m.
    B: 8:00 a.m. to 3:30 p.m.
    C: 9:00 a.m. to 5:00 p.m.
    D: 8:00 a.m. to 4:00 p.m.
  answer: B
  explanation: According to the Honolulu section of the manual, the Hours of Operation
    are 8:00 a.m. to 4:00 p.m., but the 'Testing Hours' are specifically '8:00 a.m.
    to 3:30 p.m.'
- id: 16
  category: safe_driving_rules
  question: According to the manual, what is the definition of a crosswalk?
  choices:
    A: An area officially set apart within a roadway for the exclusive use of pedestrians.
    B: That part of a roadway at an intersection included within the connections of
      the lateral lines of the sidewalks on opposite sides of the highway.
    C: The entire width between the boundary lines of every way publicly maintained.
    D: A designated lane for commercial motor vehicles to load and unload passengers.
  answer: B
  explanation: A crosswalk is defined as that part of a roadway at an intersection
    included within the connections of the lateral lines of the sidewalks on opposite
    sides of the highway measured from the curbs or edges of the transversable roadway.
- id: 17
  category: license_system
  question: Under what condition is a 13-year-old exempt from obtaining a Hawaii driver's
    license?
  choices:
    A: When driving a moped to school.
    B: When supervised by a licensed driver who is at least 21 years old.
    C: When operating a farm tractor or implement of husbandry temporarily on a highway.
    D: When driving a federal government vehicle on a military base.
  answer: C
  explanation: You are exempted from obtaining a Hawaii driver's license when you
    are thirteen years of age or older and operating any road machine, farm tractor
    or implement of husbandry temporarily on a highway.
- id: 18
  category: penalties_and_points
  question: How long must a person wait to be licensed after being convicted of drunk
    driving while unlicensed?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: You cannot be licensed to operate a motor vehicle in Hawaii for a period
    of two years after you have been convicted of drunk driving while unlicensed.
- id: 19
  category: license_system
  question: Which of the following will prevent you from obtaining a Hawaii driver's
    license?
  choices:
    A: Having outstanding traffic citations.
    B: Being 17 years old.
    C: Not having a Social Security Number.
    D: Having a valid driver's license from another U.S. state.
  answer: A
  explanation: You cannot be licensed to operate a motor vehicle in Hawaii when you
    have outstanding traffic citations.
- id: 20
  category: license_system
  question: If you are unable to provide a Social Security Number when applying for
    a license, what type of license can you obtain?
  choices:
    A: A provisional license
    B: A commercial driver's license
    C: A limited purpose driver's license
    D: An instruction permit only
  answer: C
  explanation: Drivers who choose not to provide a social security number or unable
    to provide one may obtain a limited purpose driver's license. This license will
    be valid for driving only.
- id: 21
  category: license_system
  question: What is the minimum age required to be eligible for an instruction permit
    in Hawaii?
  choices:
    A: 14 years
    B: 15 years
    C: 16 years
    D: 17 years
  answer: B
  explanation: You must be at least 15 years to be eligible for an instruction permit.
- id: 22
  category: driver_responsibility
  question: When driving with an instruction permit in a standard passenger vehicle,
    where must the supervising licensed driver sit?
  choices:
    A: In the back seat directly behind the driver
    B: In the right front seat
    C: Anywhere in the vehicle
    D: In a separate vehicle following closely
  answer: B
  explanation: In all vehicles except motorcycles, the licensed driver must sit in
    the right front seat.
- id: 23
  category: license_system
  question: If you are under 18, how long must you operate on a provisional license
    before being eligible for a class 3 driver's license?
  choices:
    A: At least 3 months
    B: At least 6 months
    C: At least 9 months
    D: At least 1 year
  answer: B
  explanation: If you are under the age of 18, you must operate on a provisional license
    for at least 6 months before being eligible for a class 3 driver's license.
- id: 24
  category: license_system
  question: Which class of license is required to operate a moped on Hawaii highways?
  choices:
    A: Class 1
    B: Class 2
    C: Class 3
    D: Class 4
  answer: A
  explanation: You must have a class 1 license to operate a moped in Hawaii highways.
- id: 25
  category: license_system
  question: What is the minimum age to obtain a standard Class 3 driver's license
    in Hawaii?
  choices:
    A: 15 years
    B: 16 years
    C: 17 years
    D: 18 years
  answer: C
  explanation: To get a class 3 license, you must be at least 17 years old.
- id: 26
  category: license_system
  question: Which of the following pieces of medical information can be indicated
    on a Hawaii driver's license?
  choices:
    A: Blood type
    B: Allergies to medication
    C: Advance healthcare directive
    D: Primary care physician's name
  answer: C
  explanation: The license also indicates if the driver is under 21 years old, a commercial
    driver and if he or she has consented to be an organ donor or has an advance healthcare
    directive.
- id: 27
  category: driver_testing
  question: Under what condition might the knowledge and road tests be waived for
    a Class 3 license applicant?
  choices:
    A: If the applicant is at least 18 and possesses a valid license from another
      U.S. state.
    B: If the applicant has held an instruction permit for over a year.
    C: If the applicant is under 18 but has completed driver's education.
    D: If the applicant is applying for a limited purpose license.
  answer: A
  explanation: The knowledge and road tests may be waived for class 1 through 3 license
    applicants if the applicant is at least 18 years old and possesses a valid driver's
    license that was issued by another state of the United States...
- id: 28
  category: license_system
  question: How long is a compact foreign driver's license accompanied by an International
    Driving Permit valid after the date of entry into the USA?
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Compact foreign drivers' licenses accompanied by an International Driving
    Permit issued in the foreign jurisdiction are valid for one year after the date
    of entry into the USA.
- id: 29
  category: license_system
  question: Which of the following is true regarding a limited purpose driver's license?
  choices:
    A: It can be used to register to vote.
    B: It is acceptable for official federal purposes like boarding an airplane.
    C: It establishes eligibility for employment.
    D: It is only a license to drive a motor vehicle.
  answer: D
  explanation: The manual states that a limited purpose driver's license is not acceptable
    for federal purposes, employment, voter registration, or public benefits; it is
    only a license to drive a motor vehicle.
- id: 30
  category: driver_testing
  question: During your driver performance test, who is permitted to ride in the vehicle
    with you and the examiner?
  choices:
    A: A licensed driving instructor
    B: A parent or legal guardian
    C: No passengers are permitted
    D: Any licensed driver over the age of 21
  answer: C
  explanation: The manual explicitly states regarding the driver performance test
    that "Passengers are not permitted during the tests."
- id: 31
  category: license_system
  question: How long must a minor hold a valid instruction permit before applying
    for a provisional license?
  choices:
    A: 90 days
    B: 180 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: You must hold a valid instruction permit for a period of 180 days before
    applying for a provisional license.
- id: 32
  category: safe_driving_rules
  question: If you are driving with an instruction permit between the hours of 11:00
    p.m. and 5:00 a.m., who must accompany you?
  choices:
    A: Any licensed driver at least 21 years of age
    B: A licensed driving instructor
    C: Your parent or guardian
    D: A licensed driver who is at least 25 years old
  answer: C
  explanation: The manual states that if driving with an instruction permit between
    11:00 p.m. and 5:00 a.m., you must be accompanied by your parent or guardian.
- id: 33
  category: license_system
  question: What is the minimum age required to obtain a provisional driver's license?
  choices:
    A: 15 1/2 years
    B: 16 years
    C: 17 years
    D: 18 years
  answer: B
  explanation: The manual states that the minimum age to obtain a provisional license
    is 16 years.
- id: 34
  category: license_system
  question: Under a provisional license, what is the restriction on transporting passengers
    under the age of 18 who are not household members?
  choices:
    A: You may not transport any non-household members under 18.
    B: You may transport only one person under age 18 who is not a household member.
    C: You may transport up to three non-household members under 18.
    D: There are no restrictions during daylight hours.
  answer: B
  explanation: Your provisional license allows you to transport only one person under
    age 18 who is not a household member.
- id: 35
  category: vehicle_information
  question: A Class 3 driver's license allows you to drive a single vehicle with a
    Gross Vehicle Weight Rating (GVWR) of 18,000 pounds or less that is designed to
    transport a maximum of how many passengers?
  choices:
    A: 10 or fewer passengers
    B: 12 or fewer passengers
    C: 15 or fewer passengers
    D: 16 or more passengers
  answer: C
  explanation: A Class 3 license is for any single vehicle with a GVWR of 18,000 pounds
    or less, and vehicles designed to transport 15 or fewer passengers, including
    the driver.
- id: 36
  category: driver_testing
  question: Which of the following vehicles is explicitly prohibited from being used
    for a Category 3 performance test?
  choices:
    A: A lightweight truck
    B: A bus designed to carry 15 occupants
    C: A passenger car
    D: An autocycle
  answer: D
  explanation: The manual states, "Although you may drive an autocycle with a category
    3 driver's license, you are not allowed to use an autocycle for the category 3
    performance test."
- id: 37
  category: driver_responsibility
  question: If you change your residence address, within how many days must you notify
    the county examiner of drivers in writing?
  choices:
    A: 10 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Whenever you change your residence address you must, within 30 days,
    notify the county examiner of drivers in writing of your old and new address.
- id: 38
  category: license_system
  question: What is the grace period for driving with an expired Hawaii State driver's
    license?
  choices:
    A: There is no grace period; the license is void after the expiration date.
    B: 30 days after the expiration date.
    C: 6 months after the expiration date.
    D: 1 year after the expiration date.
  answer: A
  explanation: The manual emphasizes that "EVERY HAWAII STATE DRIVER’S LICENSE IS
    VOID AFTER THE EXPIRATION DATE. THERE IS NO GRACE PERIOD."
- id: 39
  category: driver_testing
  question: During the Light Motor Vehicle Test (Category 3), you will be required
    to demonstrate your ability to do which of the following?
  choices:
    A: Perform a three-point turn in a residential area
    B: Put your vehicle in motion on a slight grade without rolling backwards
    C: Drive safely on an interstate highway
    D: Back up in a straight line for 50 feet
  answer: B
  explanation: The Category 3 test requires you to demonstrate the ability to "be
    able to put your vehicle in motion on a slight grade without rolling backwards."
- id: 40
  category: license_system
  question: How often are you permitted to renew your driver's license by mail?
  choices:
    A: Every time it expires
    B: Only if you are out of state
    C: Once, but you must present yourself in person every other renewal
    D: You cannot renew your license by mail
  answer: C
  explanation: The manual states, "You may renew your license once by mail but must
    present yourself before the examiner of drivers every other renewal."
- id: 41
  category: license_system
  question: What does the restriction code "G" indicate on a Hawaii driver's license?
  choices:
    A: Corrective lenses must be worn
    B: No manual transmission vehicle
    C: Limit to daylight only
    D: Outside mirror required
  answer: C
  explanation: According to the License Restrictions table, code "G" stands for "LIMIT
    TO DAYLIGHT ONLY".
- id: 42
  category: license_system
  question: What will happen if the National Driver Register (NDR) shows that your
    license has been suspended or revoked in another state?
  choices:
    A: You will be issued a restricted Hawaii driver's license.
    B: A Hawaii driver's license will not be issued to you.
    C: You must pay an additional fee to obtain a Hawaii license.
    D: You will be required to take a remedial driving course.
  answer: B
  explanation: According to the manual, if the records of the NDR show that you have
    had a license suspended or revoked in another state or D.C., a Hawaii driver's
    license will not be issued.
- id: 43
  category: license_system
  question: What does the notation "AHCD" on a Hawaii driver's license indicate?
  choices:
    A: Authorized Highway Commercial Driver
    B: Automatic Highway Control Device
    C: Advance Health Care Directive
    D: Approved Handicapped Condition Driver
  answer: C
  explanation: Putting "AHCD" on your license stands for Advance Health Care Directive,
    which alerts medical personnel that you have special instructions for health care
    in the event of a serious illness or accident.
- id: 44
  category: driver_responsibility
  question: When are you required to show your driver's license to a Police Officer?
  choices:
    A: Only when you are involved in a traffic accident.
    B: Only if you are driving a commercial motor vehicle.
    C: Only when you are issued a traffic citation.
    D: On demand while operating a motor vehicle or moped.
  answer: D
  explanation: The manual states that you must have a valid driver's license with
    you at all times while operating a motor vehicle or moped and must show it on
    demand to a Police Officer.
- id: 45
  category: penalties_and_points
  question: What is a key difference between a "traffic infraction" and a "traffic
    crime" in Hawaii?
  choices:
    A: Traffic crimes carry the possibility of jail and require a court appearance.
    B: Traffic infractions always require a mandatory court appearance.
    C: Traffic crimes are subject to civil proceedings rather than criminal.
    D: Traffic infractions result in immediate license revocation.
  answer: A
  explanation: The manual explains that a person receiving a traffic crime citation
    may face the possibility of jail and, therefore, court appearances are required,
    whereas traffic infractions are less serious civil proceedings.
- id: 46
  category: vehicle_information
  question: 'By definition in the Hawaii driver''s manual, a moped has a motor no
    larger than:'
  choices:
    A: One horsepower
    B: Two horsepower
    C: Three horsepower
    D: Five horsepower
  answer: B
  explanation: A moped is defined as a two- or three-wheeled device with a motor no
    larger than two horse-power.
- id: 47
  category: license_system
  question: What type of driver's license is required to operate a moped on public
    streets and highways in Hawaii?
  choices:
    A: Only a Category 1 (mopeds) license is valid.
    B: A commercial driver's license is required.
    C: Any category of driver's license.
    D: No license is required to operate a moped.
  answer: C
  explanation: You are required to have a driver's license (any category) to operate
    a moped on the public streets and highways. If you do not have one, you may obtain
    a Category 1 license.
- id: 48
  category: vehicle_information
  question: Which of the following lighting equipment is prohibited on a non-emergency
    vehicle?
  choices:
    A: A white light showing from the front.
    B: A red light showing from the rear.
    C: Yellow hazard lights visible from the outside.
    D: A blue light visible outside of the vehicle.
  answer: D
  explanation: Illegal equipment includes a red light showing from the front, or a
    blue light visible outside of the vehicle, except on authorized emergency vehicles.
- id: 49
  category: vehicle_information
  question: Which of the following exhaust system modifications is illegal?
  choices:
    A: Installing a muffler cut-out or by-pass.
    B: Replacing a muffler with an original equipment manufacturer muffler.
    C: Repairing a leak in the exhaust pipe.
    D: Installing a secondary catch on the hood.
  answer: A
  explanation: The manual prohibits a muffler cut-out or by-pass, or a muffler that
    makes more noise than an original equipment manufacturer muffler.
- id: 50
  category: vehicle_information
  question: How often must most motor vehicles operated on public highways have an
    official Periodic Motor Vehicle Inspection (PMVI)?
  choices:
    A: At least once every six months.
    B: At least once a year.
    C: Once every two years.
    D: Only when the vehicle changes ownership.
  answer: B
  explanation: All motor vehicles operated on the public highways must have an official
    Periodic Motor Vehicle Inspection (PMVI), at least once a year (with exceptions
    for ambulances and new vehicles).
- id: 51
  category: vehicle_information
  question: When do new vehicles need their first safety inspection after their initial
    inspection on the date they are first sold?
  choices:
    A: Six months later
    B: One year later
    C: Two years later
    D: Three years later
  answer: C
  explanation: New vehicles do not need to be inspected until two years after their
    initial inspection on the date that they are first sold.
- id: 52
  category: vehicle_information
  question: What document is required to pass the Hawaii safety inspection (PMVI)?
  choices:
    A: A bill of sale for the vehicle
    B: A Hawaii state automobile insurance identification card
    C: An advance health care directive
    D: A county reconstructed vehicle emblem
  answer: B
  explanation: A Hawaii state automobile insurance identification card is required
    to pass the inspection.
- id: 53
  category: vehicle_information
  question: When performing a common brake test at a speed of 4 to 8 mph, what should
    you look for?
  choices:
    A: The vehicle should stop within 50 feet.
    B: The antilock brakes should activate immediately.
    C: The vehicle should not pull to either side.
    D: The brake pedal should pump automatically.
  answer: C
  explanation: A common brake test is to apply the brakes rather hard at a speed of
    4 to 8 mph. The vehicle should not pull to either side.
- id: 54
  category: safe_driving_rules
  question: What should you do if your vehicle's directional signals fail while driving?
  choices:
    A: Drive only during daylight hours.
    B: Use your horn to indicate turns.
    C: Flash your head lamps before turning.
    D: Use hand signals until you can have them repaired.
  answer: D
  explanation: If the directional signals fail, the manual instructs drivers to use
    hand signals until they can have them repaired.
- id: 55
  category: safe_driving_rules
  question: According to Hawaii law, who is required to use seat belts in the front
    seat of a vehicle?
  choices:
    A: Only the driver
    B: Only passengers under age 18
    C: All front seat occupants
    D: Only occupants in vehicles without air bags
  answer: C
  explanation: All front seat occupants are required by law (291-11.6, HRS) to use
    seat belts.
- id: 56
  category: safe_driving_rules
  question: What is the seat belt requirement for persons age 4 through 17 in Hawaii?
  choices:
    A: They must be in a child restraint system.
    B: They must be belted in the rear seats.
    C: They are not required to wear seat belts if air bags are present.
    D: They may ride in the front seat without a belt if supervised.
  answer: B
  explanation: The manual states that children under age 4 must be in a child restraint,
    and persons age 4 through 17 must be belted in the rear seats.
- id: 57
  category: vehicle_information
  question: What is the primary purpose of air bags according to the manual?
  choices:
    A: To replace the need for seat belts
    B: To provide supplemental occupant protection for a first impact
    C: To protect against multiple subsequent impacts
    D: To prevent the vehicle from rolling over
  answer: B
  explanation: The manual states that air bags are supplemental occupant protection
    for a first impact, and occupants must rely on belts for protection if subsequent
    impacts occur.
- id: 58
  category: vehicle_information
  question: How much free play is acceptable in a steering wheel if your vehicle has
    power steering?
  choices:
    A: No more than 1 inch
    B: No more than 2 inches
    C: No more than 3 inches
    D: No more than 4 inches
  answer: B
  explanation: According to the manual, there should be no more than two inches of
    free play in the steering wheel if you have power steering (checked with the motor
    running).
- id: 59
  category: vehicle_information
  question: When using a Lincoln penny to check tire tread, how do you know the tire
    needs to be replaced?
  choices:
    A: If the top of Lincoln's head is visible
    B: If the penny falls over in the tread
    C: If Lincoln's face is completely covered
    D: If the tread is deeper than the penny
  answer: A
  explanation: The manual advises placing a Lincoln penny upside down within the tread.
    If the top of Lincoln's head is visible, the tire has less than 1/16 inch of tread
    and needs to be replaced.
- id: 60
  category: license_system
  question: Where must you register the motor vehicle you operate on public highways
    in Hawaii?
  choices:
    A: In the capital city of Honolulu
    B: In the county where you originally purchased the vehicle
    C: In the county in which you operate the vehicle
    D: At any state Department of Transportation office
  answer: C
  explanation: Hawaii law requires that the motor vehicle you operate on the public
    highways be registered in the county in which you operate the vehicle.
- id: 61
  category: license_system
  question: What must your vehicle have before it can be registered in Hawaii?
  choices:
    A: A new set of tires
    B: A current and valid safety inspection certificate
    C: A custom license plate
    D: A recent oil change receipt
  answer: B
  explanation: The manual explicitly states that your vehicle must have a current
    and valid safety inspection certificate before it can be registered.
- id: 62
  category: license_system
  question: Who holds the Hawaii certificate of ownership (title) if there is an active
    loan on the vehicle?
  choices:
    A: The purchaser
    B: The county registration office
    C: The legal owner or the lien holder
    D: The insurance company
  answer: C
  explanation: The Hawaii certificate of ownership of title is held by the legal owner
    or the lien holder until the lien is satisfied (the loan on the vehicle is paid).
- id: 63
  category: license_system
  question: How often do motor vehicle registrations expire in Hawaii?
  choices:
    A: Every 6 months
    B: Annually at the end of the 12th month
    C: Every 2 years
    D: Every 5 years on your birthday
  answer: B
  explanation: Motor vehicle registrations are staggered and expire annually at the
    end of the 12th month.
- id: 64
  category: license_system
  question: If you change your address, how many days do you have to notify the appropriate
    county agency?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Whenever the address of the registered owner is changed, they must
    notify the appropriate county agency in writing within thirty (30) days after
    the change.
- id: 65
  category: license_system
  question: What is required if the name of a registered owner of a motor vehicle
    changes?
  choices:
    A: Mail a letter to the county agency within 10 days
    B: Appear in person at the county agency within 30 days with proof of the change
    C: Update the name online within 60 days
    D: Wait until the next registration renewal to update it
  answer: B
  explanation: If the name of a registered owner changes, they must appear in person
    at the appropriate county agency within thirty (30) days with proof of change
    of name.
- id: 66
  category: license_system
  question: Who is exempt from paying vehicle registration fees in Hawaii?
  choices:
    A: All active duty military personnel
    B: Senior citizens over the age of 65
    C: A 100% medically disabled veteran with accompanying paperwork
    D: Anyone driving a hybrid or electric vehicle
  answer: C
  explanation: According to the manual, a 100% medically disabled veteran with accompanying
    paperwork is exempt from paying registration fees.
- id: 67
  category: license_system
  question: What specific requirement must be met when purchasing a vehicle in a foreign
    country to register it in Hawaii?
  choices:
    A: It must have a 15-character Vehicle Identification Number
    B: It must have a manufacturer certification label indicating compliance with
      USA standards
    C: It must be painted a standard factory color
    D: It must have less than 50,000 miles
  answer: B
  explanation: When you purchase a vehicle in a foreign country, the vehicle must
    have a manufacturer certification label indicating compliance with USA standards
    and a 17-character Vehicle Identification Number.
- id: 68
  category: license_system
  question: What is the maximum duration for a temporary registration permit for an
    out-of-state vehicle brought into Hawaii?
  choices:
    A: 30 days
    B: 6 months
    C: 12 months
    D: 2 years
  answer: C
  explanation: Under no circumstances will a permit (temporary registration) be issued
    to exceed a twelve-month period.
- id: 69
  category: vehicle_information
  question: Which vehicles are required to display a license plate on the rear ONLY?
  choices:
    A: Passenger cars and trucks
    B: Motorcycles, trailers, and semi-trailers
    C: Buses and commercial vehicles
    D: All motor vehicles
  answer: B
  explanation: Motorcycles, trailers and semi-trailers must display a license plate
    on the rear; all other vehicles must display a license plate on both the front
    and rear.
- id: 70
  category: vehicle_information
  question: Where must the license plate and inspection sticker be displayed on a
    moped?
  choices:
    A: On the front handlebars
    B: On the left side panel
    C: On the rear of the moped
    D: Under the seat
  answer: C
  explanation: Mopeds are required to be inspected, registered and licensed. The license
    plate and inspection sticker must be displayed on the rear of the moped.
- id: 71
  category: driver_responsibility
  question: According to the manual, what should a person do if they have just had
    a violent argument or are angry before driving?
  choices:
    A: Drive faster to relieve stress
    B: Take some time for 'cooling off' before driving
    C: Turn on loud music to distract themselves
    D: Only drive on familiar roads
  answer: B
  explanation: Persons who have just had violent arguments, or who are angry or in
    grief, need some time for 'cooling off' or for making an adjustment before they
    drive a car.
- id: 72
  category: driver_responsibility
  question: According to accident statistics, which age group of drivers has the least
    number of accidents?
  choices:
    A: Under 20 years of age
    B: 25 to 30 years of age
    C: 50 to 54 years of age
    D: Over 75 years of age
  answer: C
  explanation: The manual states that as driver age increases, they continue to have
    fewer accidents until about 50 to 54 years of age, and these drivers have the
    least number of accidents of any age group.
- id: 73
  category: driver_responsibility
  question: What should you do if you are angry, in grief, or experiencing strong
    emotions before driving?
  choices:
    A: Drive faster to reach your destination sooner
    B: Take time to cool off or let someone else drive
    C: Listen to loud music to distract yourself
    D: Roll down the windows for fresh air while driving
  answer: B
  explanation: The manual advises that persons who are angry or in grief need some
    time for 'cooling off' before driving, and if worried, ill, nervous, frightened,
    angry or depressed, you should let someone else drive.
- id: 74
  category: alcohol_drugs_health
  question: Which of the following is a common effect of the aging process on driving
    capabilities?
  choices:
    A: Decreased reaction time
    B: Increased attention span
    C: Increased decision time in driving situations
    D: Improved physical dexterity
  answer: C
  explanation: The manual notes that the aging process eventually results in increased
    decision time in driving situations, as well as reduced dexterity, increased reaction
    time, and decreased attention span.
- id: 75
  category: safe_driving_rules
  question: In which of the following situations are you PROHIBITED from driving on
    the left half of the roadway?
  choices:
    A: When driving on a one-way street
    B: When overtaking a vehicle on a two-lane road with no oncoming traffic
    C: When approaching within 100 feet of an intersection
    D: When there is an obstruction on the right side of the road
  answer: C
  explanation: You MUST NOT drive on the left half of the roadway when approaching
    within 100 feet (30.5m) of or passing through an intersection or railroad crossing.
- id: 76
  category: safe_driving_rules
  question: Under what condition are you permitted to pass another vehicle on the
    right?
  choices:
    A: When the vehicle ahead is about to make a left turn, provided you do not drive
      off the pavement
    B: By driving off the pavement onto the unpaved shoulder
    C: When approaching the top of a hill
    D: On a narrow two-lane road with oncoming traffic
  answer: A
  explanation: You may pass to the right when the vehicle you are passing is about
    to make a left turn, but you may not drive your vehicle off the pavement or main
    traveled portion of the roadway to pass.
- id: 77
  category: sharing_the_road
  question: Which lane should you use when you are moving slower than other traffic?
  choices:
    A: The extreme left lane
    B: The center lane
    C: The extreme right lane
    D: Any lane as long as you maintain the minimum speed
  answer: C
  explanation: The manual states that when moving slower than other traffic you should
    drive in the extreme right lane.
- id: 78
  category: safe_driving_rules
  question: How far in advance must you signal before changing lanes, turning, or
    stopping?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: Signals must be given for at least 100 feet (30.5m) before you change
    lanes, turn or stop. This is about five car lengths.
- id: 79
  category: safe_driving_rules
  question: Which of the following is true regarding the use of turn signals?
  choices:
    A: You only need to signal if other vehicles are in sight
    B: Signaling gives you the right-of-way to make the maneuver
    C: You must signal every time, even when no other vehicles are in sight
    D: Hand signals are illegal and should never be used
  answer: C
  explanation: 'The manual explicitly states: ''You must signal every time, even when
    there are no other vehicles in sight.'''
- id: 80
  category: safe_driving_rules
  question: What is the minimum distance you must stop your vehicle from the nearest
    rail at a railroad crossing when a train is approaching?
  choices:
    A: 10 feet
    B: 15 feet
    C: 25 feet
    D: 50 feet
  answer: B
  explanation: You must stop your vehicle not less than 15 feet (4.6m) from the nearest
    rail when a signal warns of a train, a gate is lowered, or a train is visible
    or gives an audible warning.
- id: 81
  category: safe_driving_rules
  question: You must stop at a railroad crossing if an approaching train gives an
    audible warning within what distance?
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: C
  explanation: You must stop when a train approaching within 1,500 feet (460m) gives
    audible warning of its approach.
- id: 82
  category: safe_driving_rules
  question: What does the Basic Speed Law require of drivers?
  choices:
    A: You must always drive at the posted maximum speed limit
    B: You must not drive at a speed that is greater than is reasonable and prudent
    C: You must drive 5 mph below the speed limit in bad weather
    D: You must never drive slower than 45 mph on a highway
  answer: B
  explanation: 'The Basic Law states: ''You must not drive at a speed that is greater
    than is reasonable and prudent.'''
- id: 83
  category: safe_driving_rules
  question: What should you do if you cannot keep up with traffic and are holding
    back other vehicles?
  choices:
    A: Turn on your hazard lights and stay in your lane
    B: Honk your horn to warn other drivers to go around you
    C: Pull off the roadway and let other traffic pass or change to another route
    D: Speed up beyond the posted limit to match the flow of traffic
  answer: C
  explanation: 'The manual states: ''If you cannot keep up with traffic, pull off
    the roadway and let other traffic pass or change to another route.'''
- id: 84
  category: safe_driving_rules
  question: According to the manual, where is parking strictly prohibited?
  choices:
    A: On a one-way street
    B: In a residential area
    C: On a sidewalk or sidewalk area
    D: In a marked parking stall
  answer: C
  explanation: Parking is prohibited on a sidewalk or sidewalk area, as well as in
    front of driveways or where it is hazardous to other traffic.
- id: 85
  category: safe_driving_rules
  question: When towing another vehicle, what special following distance rule applies?
  choices:
    A: You must stay within 50 feet of the vehicle ahead
    B: You must leave enough space ahead of your vehicle to allow an overtaking vehicle
      to occupy the space safely
    C: You must maintain a two-second following distance
    D: You must drive in the left lane only
  answer: B
  explanation: When towing another vehicle, you must 'leave enough space ahead of
    your vehicle to allow an overtaking vehicle to occupy the space safely.'
- id: 86
  category: safe_driving_rules
  question: Under which condition are you permitted to drive on the left half of the
    roadway?
  choices:
    A: When approaching the top of a hill
    B: When the road has four or more lanes for moving traffic
    C: When there is an obstruction in the roadway and oncoming vehicles are not using
      the left half
    D: When approaching within 100 feet of a bridge with poor visibility
  answer: C
  explanation: You may drive on the left half of the roadway when there is an obstruction
    in the roadway and oncoming vehicles are not using the left half of the road.
- id: 87
  category: safe_driving_rules
  question: You are prohibited from parking your vehicle more than how many inches
    from the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: According to the manual, parking is prohibited if your vehicle is more
    than 12 inches (30cm) from the curb.
- id: 88
  category: driver_responsibility
  question: When leaving your vehicle unattended on a grade, what must you do with
    the wheels?
  choices:
    A: Turn them away from the curb
    B: Keep them pointing straight ahead
    C: Turn them toward the curb
    D: Turn them to the left
  answer: C
  explanation: When you leave your vehicle unattended on a grade, you must turn the
    wheels toward the curb, in addition to stopping the engine, locking the ignition,
    and setting the parking brake.
- id: 89
  category: safe_driving_rules
  question: Driving with more than how many persons in the front seat may constitute
    prohibited interference with the driver?
  choices:
    A: One person
    B: Two persons
    C: Three persons
    D: Four persons
  answer: C
  explanation: Driving with more than three persons in the front seat of your vehicle
    may constitute interference with the driver, which is prohibited.
- id: 90
  category: sharing_the_road
  question: If an emergency vehicle with its warning signals on is directly behind
    you in heavy traffic, what should you do?
  choices:
    A: Stop immediately in your current lane
    B: Keep moving slowly until you can get out of the way
    C: Speed up to outrun the emergency vehicle
    D: Jam on the brakes and pull to the left
  answer: B
  explanation: If the emergency vehicle is directly behind your vehicle when you are
    in heavy traffic, you should keep moving slowly until you can get out of the way.
- id: 91
  category: sharing_the_road
  question: Which of the following is a rule regarding funeral processions?
  choices:
    A: You may pass them if you sound your horn
    B: You should not drive your vehicle between the vehicles in a funeral procession
    C: They must yield to all other traffic at intersections
    D: They are not allowed to use headlamps during the day
  answer: B
  explanation: Funeral processions have the right of way at intersections, and you
    should not drive your vehicle between the vehicles in a funeral procession.
- id: 92
  category: signs_and_signals
  question: What does a highly reflective 18-inch triangular emblem on the rear of
    a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is an emergency responder
    C: The vehicle is designed to operate at speeds of 25 mph or less
    D: The vehicle is broken down and cannot move
  answer: C
  explanation: The Slow Moving Vehicle Emblem is a highly reflective 18-inch triangular
    emblem required on the rear of vehicles designed to operate at speeds of 25 mph
    (40 km/h) or less.
- id: 93
  category: safe_driving_rules
  question: 'When another vehicle is passing you, it is unlawful to:'
  choices:
    A: Maintain your current speed
    B: Move slightly to the right
    C: Increase your speed
    D: Tap your brakes
  answer: C
  explanation: The manual notes that when you are being passed by another vehicle,
    it is unlawful to increase your speed.
- id: 94
  category: safe_driving_rules
  question: You must not pass another vehicle when approaching within how many feet
    of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: You must not pass when approaching within 100 feet (30m) of or when
    traversing any intersection or railroad crossing.
- id: 95
  category: safe_driving_rules
  question: 'When entering a public street from an alley, driveway, or farmyard, you
    must:'
  choices:
    A: Yield only if traffic is approaching from the right
    B: Stop and yield to all traffic on the public street
    C: Sound your horn and proceed without stopping
    D: Maintain your speed and merge smoothly
  answer: B
  explanation: The rules of right-of-way require you to stop and yield when entering
    any public street or road from an alley, driveway, or farmyard.
- id: 96
  category: signs_and_signals
  question: Which type of traffic control device advises you of hazardous conditions?
  choices:
    A: Regulatory Devices
    B: Guide Signs
    C: Information Signs
    D: Warning Devices
  answer: D
  explanation: Warning Devices advise you of hazardous conditions or the possibility
    of hazardous conditions. Disregarding them may result in an accident due to negligence.
- id: 97
  category: signs_and_signals
  question: When are you permitted to cross double solid yellow lines?
  choices:
    A: When passing a slow-moving vehicle
    B: Only to make a left turn into or from an alley, private road, or driveway
    C: When the vehicle ahead is stopped
    D: You may never cross a double solid yellow line under any circumstances
  answer: B
  explanation: Double Solid Yellow Lines prohibit passing in both directions, but
    you may cross these lines ONLY to make a left turn into or from an alley, private
    road, or driveway.
- id: 98
  category: signs_and_signals
  question: What action is required when encountering double solid white lines on
    the roadway?
  choices:
    A: You must not cross them, as movement from lane to lane is prohibited
    B: You may cross them only in unusual circumstances with great care
    C: You may cross them to pass a slow-moving vehicle
    D: You must stop and wait for the lines to change to dashed
  answer: A
  explanation: Double Solid White Lines indicate that movement from lane to lane is
    prohibited. You MUST NOT CROSS a double solid white line.
- id: 99
  category: signs_and_signals
  question: 'A two-way left turn channelization marking (a lane in the center of the
    roadway marked with yellow solid and dashed lines) may be used for:'
  choices:
    A: Passing slow vehicles
    B: Left turn maneuvers only
    C: Emergency vehicle parking
    D: Through traffic during rush hour
  answer: B
  explanation: This center lane may be used by vehicles travelling in either direction
    for left turn maneuvers ONLY. The lane must NEVER be used for passing.
- id: 100
  category: signs_and_signals
  question: How must you navigate around yellow obstruction markings painted in the
    traffic lane?
  choices:
    A: You may pass on either side of the markings
    B: You must pass only to the left of the markings
    C: You must pass only to the right of the markings
    D: You must stop and wait for clearance
  answer: C
  explanation: You may pass to either side of white obstruction markings, but you
    must pass only to the right of yellow obstruction markings.
- id: 101
  category: safe_driving_rules
  question: 'It is prohibited to park a vehicle on a public street or highway for
    a continuous period of more than:'
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: B
  explanation: Parking is prohibited on a public street or highway for a continuous
    period of more than 24 hours.
- id: 102
  category: signs_and_signals
  question: What is the rule for passing yellow obstruction markings painted on the
    road?
  choices:
    A: You may pass on either side of the markings.
    B: You must pass only to the right of the yellow markings.
    C: You must pass only to the left of the yellow markings.
    D: You must not pass the markings under any circumstances.
  answer: B
  explanation: According to the manual, you may pass to either side of white obstruction
    markings, but you must pass only to the right of yellow obstruction markings.
- id: 103
  category: sharing_the_road
  question: What is the purpose of a 'Safety Island'?
  choices:
    A: To provide an area for vehicles to pull over during emergencies.
    B: To direct vehicles into high-occupancy vehicle lanes.
    C: To protect pedestrians who may have to stand in the roadway.
    D: To designate a zone for construction workers.
  answer: C
  explanation: The manual states that traffic islands are called 'Safety Islands'
    when they are used to protect pedestrians who may have to stand in the roadway.
- id: 104
  category: safe_driving_rules
  question: When facing a steady red traffic light, what must you do before making
    a permitted right turn?
  choices:
    A: Slow down to 5 mph and proceed if the intersection is clear.
    B: Stop, then yield to all pedestrians and vehicles before making the turn.
    C: Wait for a green arrow to appear before turning.
    D: Honk your horn to warn pedestrians before turning.
  answer: B
  explanation: The manual states that after stopping at a red light, you may turn
    right (except when prohibited by a sign) but you must yield to all pedestrians
    and all vehicles when making such a turn.
- id: 105
  category: safe_driving_rules
  question: Under what condition are you permitted to make a left turn on a red light?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: When turning from a one-way street into a one-way street where traffic is moving
      to the left.
    C: When there is no oncoming traffic visible for at least 500 feet.
    D: Left turns on a red light are never permitted.
  answer: B
  explanation: After stopping, you may turn left on a red light from a one-way street
    into a one-way street where traffic is moving to the left, except when a sign
    prohibits such movement.
- id: 106
  category: signs_and_signals
  question: What does a flashing red traffic signal mean?
  choices:
    A: Proceed only with caution.
    B: The traffic signal is broken and you have the right-of-way.
    C: It has the same meaning as a stop sign.
    D: Yield to traffic approaching from the right.
  answer: C
  explanation: The manual states that a Red Flashing Signal has the same meaning as
    a stop sign.
- id: 107
  category: signs_and_signals
  question: What does a steady Yellow 'X' lane control signal indicate?
  choices:
    A: You may use the lane only when preparing to turn left.
    B: You must move out of that lane because it is going to be used for traffic moving
      in the opposite direction.
    C: The lane is closed ahead for road construction.
    D: You have the exclusive right-of-way in that lane.
  answer: B
  explanation: The Yellow 'X' means that you must move out of that lane of traffic
    because it is going to be used for traffic moving in the opposite direction.
- id: 108
  category: sharing_the_road
  question: What should a pedestrian do if the 'DON'T WALK' signal begins flashing
    while they are already crossing the roadway?
  choices:
    A: Stop immediately and wait in the middle of the road.
    B: Turn around and return to the starting sidewalk.
    C: Continue crossing to the nearest sidewalk, traffic island, or safety zone.
    D: Run as fast as possible to the other side of the intersection.
  answer: C
  explanation: A flashing 'DON'T WALK' signal means pedestrians may not start to cross,
    but those already crossing may continue to the nearest sidewalk, traffic island,
    or safety zone.
- id: 109
  category: signs_and_signals
  question: What does the color orange on a traffic sign indicate?
  choices:
    A: An action is prohibited.
    B: A warning of hazardous or dangerous conditions.
    C: A required action.
    D: A warning concerning road work.
  answer: D
  explanation: The manual specifies that the color orange indicates a warning concerning
    road work, appearing on rectangular or diamond-shaped signs.
- id: 110
  category: signs_and_signals
  question: Which sign is pennant-shaped and located on the left side of the road?
  choices:
    A: Do Not Pass sign
    B: No Passing Zone sign
    C: Pass With Care sign
    D: Yield sign
  answer: B
  explanation: NO PASSING ZONE SIGNS are pennant-shaped yellow and black signs located
    at the left side of the road that point to the beginning of the no-passing zone.
- id: 111
  category: signs_and_signals
  question: What is the shape and color of a YIELD sign?
  choices:
    A: 8-sided, white on red
    B: Rectangular, black and white
    C: Triangular, red and white
    D: Diamond-shaped, black and yellow
  answer: C
  explanation: A YIELD SIGN is described in the manual as a triangular red and white
    sign indicating that other traffic has the right-of-way.
- id: 112
  category: signs_and_signals
  question: When you pass a 'REDUCED SPEED AHEAD' sign, where does the new speed limit
    officially begin?
  choices:
    A: Immediately at the 'REDUCED SPEED AHEAD' sign.
    B: 100 feet after the sign.
    C: At the next speed limit sign.
    D: When you enter the next intersection.
  answer: C
  explanation: The manual states that these signs inform you to begin reducing your
    speed, and that 'The new speed limit begins at the next speed limit sign.'
- id: 113
  category: signs_and_signals
  question: How is the pavement marked before a railroad crossing?
  choices:
    A: With a large 'X' and two 'R's'.
    B: With a solid white triangle.
    C: With yellow diagonal stripes.
    D: With a red stop line.
  answer: A
  explanation: Railroad Crossing Markings include a large 'X' and two 'R's' painted
    in the traffic lane before railroad crossings.
- id: 114
  category: signs_and_signals
  question: What shape and color are most warning signs?
  choices:
    A: Rectangular with black lettering on a white background.
    B: Diamond-shaped with a black legend and border on a yellow background.
    C: Circular with a red border on a white background.
    D: Octagonal with white lettering on a red background.
  answer: B
  explanation: The manual notes that warning signs are usually diamond-shaped with
    a black legend and border on a yellow background.
- id: 115
  category: signs_and_signals
  question: What do rectangular signs containing a red circle with a red diagonal
    line indicate?
  choices:
    A: They provide route and location identification.
    B: They warn of upcoming road construction.
    C: They restrict or prohibit vehicles, vehicle movements, or other activities.
    D: They indicate the end of a no-passing zone.
  answer: C
  explanation: These are Exclusion Signs, which restrict or prohibit vehicles or vehicle
    movements or prohibit some other activity.
- id: 116
  category: signs_and_signals
  question: What is the basic color used for construction and maintenance traffic
    control devices?
  choices:
    A: Yellow
    B: Orange
    C: Red
    D: White
  answer: B
  explanation: According to the manual, orange is the basic color for construction
    and maintenance devices such as signs, barricades, drums, and cones.
- id: 117
  category: signs_and_signals
  question: What do diagonal stripes on a barricade sloping downward to the right
    indicate to a driver?
  choices:
    A: The road is closed ahead
    B: The driver should bear to the left
    C: The driver should bear to the right
    D: The driver must stop immediately
  answer: C
  explanation: The diagonal stripes on a barricade guide the driver. Stripes sloping
    downward to the right mean the driver should bear to the right.
- id: 118
  category: driver_responsibility
  question: Under what circumstances must a traffic accident be reported to the police
    immediately?
  choices:
    A: Only if someone is killed
    B: If property damage is $1,000 or more
    C: If it results in personal injury, death, or property damage of $3,000 or more
    D: Any time two vehicles make contact
  answer: C
  explanation: Traffic accidents resulting in personal injury to any extent, or death,
    or property damage of $3,000 or more must be reported to the police immediately.
- id: 119
  category: safe_driving_rules
  question: What must you do if you strike an unattended vehicle?
  choices:
    A: Leave the scene immediately if there is no visible damage
    B: Wait in your car until the owner returns
    C: Stop and locate the owner, or leave a written notice containing your name and
      address
    D: Call your insurance company and then drive away
  answer: C
  explanation: Upon striking an unattended vehicle, you must stop and locate the owner,
    or leave a written notice containing your name, address, and circumstances of
    the accident.
- id: 120
  category: safe_driving_rules
  question: If someone is injured in an accident and has severe bleeding, what is
    the recommended first aid response?
  choices:
    A: Apply a tourniquet above the wound
    B: Attempt to stop the flow of blood with direct pressure
    C: Elevate the victim's head and offer them water
    D: Move the victim to the side of the road immediately
  answer: B
  explanation: The manual states that if there is severe bleeding, you should attempt
    to stop the flow of blood with direct pressure.
- id: 121
  category: penalties_and_points
  question: What is the penalty for non-compliance with the Motor Vehicle Safety Responsibility
    Law?
  choices:
    A: A $500 fine
    B: Your vehicle will be impounded
    C: Your driver's license will be suspended
    D: You must retake the driving test
  answer: C
  explanation: The penalty for non-compliance with the Motor Vehicle Safety Responsibility
    Law is that your driver's license will be suspended.
- id: 122
  category: vehicle_information
  question: Under the Motor Vehicle Insurance Law, what is the minimum mandatory liability
    coverage for property damage per accident?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $40,000
  answer: B
  explanation: The minimum mandatory coverages include liability coverage of $10,000
    for property damage per accident.
- id: 123
  category: driver_responsibility
  question: In Hawaii, when are you allowed to sue for bodily injury resulting from
    a motor vehicle accident?
  choices:
    A: At any time, regardless of the injury severity
    B: Only if the other driver was intoxicated
    C: If medical bills exceed $5,000, or the injury results in death, loss of body
      function, or serious disfigurement
    D: Only if your vehicle is completely totaled
  answer: C
  explanation: You can sue for bodily injury only if medical bills exceed $5,000,
    the injury results in loss of body function or permanent/serious disfigurement,
    or the injury results in death.
- id: 124
  category: alcohol_drugs_health
  question: Which of the following statements about alcohol is true?
  choices:
    A: Alcohol is a stimulant that increases alertness
    B: Drinking black coffee will help you sober up faster
    C: Alcohol is a depressant that slows normal reflexes and interferes with judgment
    D: A cold shower can eliminate alcohol from your blood
  answer: C
  explanation: Alcohol is a depressant, not a stimulant. It slows normal reflexes,
    interferes with judgment, reduces alertness, and impairs vision. Coffee and cold
    showers will not sober you up.
- id: 125
  category: alcohol_drugs_health
  question: What does Hawaii's 'Implied Consent' law mean?
  choices:
    A: You consent to having your vehicle searched if stopped by police
    B: You consent to be tested to determine the amount of alcohol in your blood if
      you operate a motor vehicle on public highways
    C: You consent to pay all fines immediately upon receiving a citation
    D: You consent to share your medical records with the DMV
  answer: B
  explanation: Implied Consent means any person who operates a motor vehicle on public
    highways in Hawaii is deemed to have given consent to be tested to determine the
    amount of alcohol in their blood.
- id: 126
  category: alcohol_drugs_health
  question: What is the 'Zero Tolerance' law for drivers under 21 in Hawaii?
  choices:
    A: They cannot drive with any passengers under 21
    B: They are prohibited from operating a motor vehicle with a blood alcohol content
      level of .02 or more
    C: They will lose their license for any moving violation
    D: They cannot drive between midnight and 5 AM
  answer: B
  explanation: Zero Tolerance prohibits drivers under 21 from operating a motor vehicle
    with a blood alcohol content level of .02 or more.
- id: 127
  category: penalties_and_points
  question: What may happen if you refuse to take a blood alcohol test when requested
    by a police officer?
  choices:
    A: You will be given a warning and allowed to drive home
    B: Your license may be revoked for one, two, or four years depending on prior
      contacts
    C: You will automatically be sentenced to 30 days in jail
    D: Your vehicle will be permanently confiscated
  answer: B
  explanation: Refusal to take the test may result in the revocation of your license
    for one year, two years, or four years depending upon the driver's prior alcohol
    enforcement contacts.
- id: 128
  category: alcohol_drugs_health
  question: At what blood alcohol content (BAC) is a driver considered to be 'under
    the influence of alcohol' in Hawaii?
  choices:
    A: .02 percent or more
    B: .04 percent or more
    C: .05 percent or more
    D: .08 percent or more
  answer: D
  explanation: A driver is considered to be under the influence of alcohol if the
    blood alcohol content is .08 percent or more.
- id: 129
  category: alcohol_drugs_health
  question: What is the law regarding open alcoholic beverage containers in a motor
    vehicle?
  choices:
    A: They are allowed as long as the driver is not drinking
    B: They must be held by a passenger in the back seat
    C: Storing an opened container in the area normally occupied by the driver or
      passengers is prohibited on any public road
    D: They are permitted if the container is less than half full
  answer: C
  explanation: Storing an opened alcoholic beverage container in the area of a motor
    vehicle normally occupied by the driver or passengers is prohibited on any public
    road.
- id: 130
  category: penalties_and_points
  question: Which of the following is a potential penalty for violating the motor
    vehicle insurance law?
  choices:
    A: A fine not to exceed $5,000
    B: Thirty days imprisonment
    C: Suspension of motor vehicle operator's license
    D: All of the above
  answer: D
  explanation: Violators of the motor vehicle insurance law are subject to a fine
    up to $5,000, 30 days imprisonment, suspension of license, forfeiture of registration,
    or any combination of such penalties.
- id: 131
  category: alcohol_drugs_health
  question: What is the effect of combining alcohol and drugs?
  choices:
    A: It cancels out the effects of the drugs.
    B: It can have a much more pronounced effect than either taken separately.
    C: It is safe as long as the drugs are prescribed by a doctor.
    D: It only affects your driving if you take illegal drugs.
  answer: B
  explanation: The manual states that the combination of alcohol and drugs can have
    a much more pronounced effect than either taken separately, and advises to never
    mix alcohol and drugs.
- id: 132
  category: alcohol_drugs_health
  question: Which of the following is true regarding allergy remedies and cold pills
    you can buy without a prescription?
  choices:
    A: They are completely safe to use while driving.
    B: They may contain ingredients which can affect your driving ability.
    C: They improve your alertness and reaction time.
    D: They are only dangerous if mixed with illegal drugs.
  answer: B
  explanation: The manual warns that some allergy remedies and cold pills bought without
    a prescription may contain ingredients which can affect your driving ability.
- id: 133
  category: driver_responsibility
  question: According to the manual, 'bad' driving habits are caused by which of the
    following?
  choices:
    A: Laziness, Impatience, Inattention, Arrogance, and Ignorance.
    B: Fatigue, Hunger, Thirst, and Stress.
    C: Poor vehicle maintenance and bad weather conditions.
    D: Overconfidence, Speeding, and Tailgating.
  answer: A
  explanation: 'The manual explicitly lists the causes of ''bad'' driving habits as:
    (1) Laziness, (2) Impatience, (3) Inattention, (4) Arrogance, and (5) Ignorance.'
- id: 134
  category: safe_driving_rules
  question: 'Failing to turn your head and look behind you for oncoming traffic before
    changing lanes is an example of a bad driving habit caused by:'
  choices:
    A: Ignorance
    B: Arrogance
    C: Laziness
    D: Impatience
  answer: C
  explanation: The manual categorizes reducing the required action of turning your
    head to check for traffic to just looking in the rear view mirror as a bad habit
    caused by laziness.
- id: 135
  category: safe_driving_rules
  question: A driver who speeds from stop to stop, weaves in and out of traffic, and
    tailgates other drivers is exhibiting which bad driving habit?
  choices:
    A: Ignorance
    B: Impatience
    C: Inattention
    D: Laziness
  answer: B
  explanation: The manual describes an impatient driver as one who speeds from stop
    to stop, weaves in and out of traffic, and tailgates other drivers.
- id: 136
  category: driver_responsibility
  question: How does the manual describe an 'arrogant' driver?
  choices:
    A: A driver who daydreams and gazes at objects off the roadway.
    B: A driver who is purposely in a hurry and competes with their vehicle.
    C: A driver who does not know the meaning of traffic signs.
    D: A driver who only checks their rearview mirror instead of turning their head.
  answer: B
  explanation: According to the manual, the arrogant driver is purposely in a hurry,
    competes with his vehicle (which is an extension of his ego), and has little or
    no respect for traffic laws.
- id: 137
  category: safe_driving_rules
  question: 'If a driver is stopped at the end of a freeway on-ramp or driving too
    slowly because they are unsure, they are likely displaying a bad habit caused
    by:'
  choices:
    A: Ignorance
    B: Inattention
    C: Arrogance
    D: Impatience
  answer: A
  explanation: The manual notes that an ignorant driver may drive too slowly because
    he is unsure or stop at the end of a freeway on-ramp because they do not know
    the rules of safe driving procedures.
- id: 138
  category: safe_driving_rules
  question: What is the rule regarding driving with headsets or earphones?
  choices:
    A: You may use them if the volume is kept low.
    B: You must not drive with headsets or earphones that cover or go in both ears.
    C: They are permitted only when listening to a GPS device.
    D: They are recommended to block out distracting road noise.
  answer: B
  explanation: 'The manual states: ''Do not drive with headsets or earphones that
    cover or go in both ears. They make it too hard to hear emergency horns or sirens.'''
- id: 139
  category: safe_driving_rules
  question: Why is talking on a cell phone with 'hands free' equipment still considered
    dangerous?
  choices:
    A: The equipment can easily become tangled in the steering wheel.
    B: It takes your attention away from driving and makes you less likely to notice
      dangerous situations.
    C: Hands-free devices often cause electrical interference with the vehicle.
    D: It is illegal to have any electronic device powered on while driving.
  answer: B
  explanation: The manual explains that even with 'hands free' equipment, talking
    on a phone takes your attention away from driving and can cause you to be less
    likely to notice a dangerous situation.
- id: 140
  category: safe_driving_rules
  question: What is the safest way to travel with a pet in your vehicle?
  choices:
    A: In the driver's lap so they can be closely monitored.
    B: In the front passenger seat with the window rolled down.
    C: In a carrier.
    D: Held securely by a passenger in the front seat.
  answer: C
  explanation: The manual states that pets can be distracting and should not ride
    in the driver's lap, noting that 'A carrier is the safest place.'
- id: 141
  category: defensive_driving
  question: What is the basic idea of defensive driving?
  choices:
    A: To always drive below the posted speed limit.
    B: To recognize possible hazards and adjust your driving to avoid them before
      an accident develops.
    C: To aggressively defend your right-of-way against other drivers.
    D: To rely on your vehicle's safety features to protect you in a crash.
  answer: B
  explanation: Defensive driving is defined in the manual as recognizing possible
    hazards associated with various driving situations and adjusting your driving
    to allow you to avoid hazards when they develop.
- id: 142
  category: defensive_driving
  question: 'To avoid accidents as a defensive driver, you should always have an alternate
    plan of action ready. This means you should:'
  choices:
    A: Always leave yourself a way out.
    B: Keep a map open on the passenger seat.
    C: Memorize the phone numbers of emergency services.
    D: Drive with your hazard lights on in heavy traffic.
  answer: A
  explanation: 'The manual lists steps for defensive drivers, including: ''Have an
    alternate plan of action ready in case an unexpected event develops. (Always leave
    yourself a way out.)'''
- id: 143
  category: defensive_driving
  question: According to the manual, how does speed affect your vision while driving?
  choices:
    A: Speed increases your ability to focus on distant objects.
    B: Speed reduces your field of vision.
    C: Speed has no effect on your field of vision.
    D: Speed improves your peripheral vision.
  answer: B
  explanation: The manual explicitly states in a heading and section that 'SPEED REDUCES
    YOUR FIELD OF VISION'.
- id: 144
  category: alcohol_drugs_health
  question: Why are all types of drugs on the 'illegal' market considered dangerous
    for drivers?
  choices:
    A: They are too expensive to use regularly.
    B: There is no way to be certain of their strength or purity.
    C: They always cause immediate drowsiness.
    D: They are easily confused with prescription medications.
  answer: B
  explanation: 'The manual states: ''All types of drugs on the ''illegal'' market
    are dangerous because there is no way to be certain of their strength or purity.'''
- id: 145
  category: driver_responsibility
  question: How are 'good' driving habits formed?
  choices:
    A: By reading the driver's manual once a year.
    B: By deliberately accomplishing the proper action over and over again until the
      habit is formed.
    C: By driving only during daylight hours.
    D: By observing other drivers on the road.
  answer: B
  explanation: The manual explains that to form good driving habits, 'All you have
    to do is to deliberately accomplish the proper action over and over again until
    the good habit is formed.'
- id: 146
  category: defensive_driving
  question: What should your visual scanning pattern consist of while driving?
  choices:
    A: Staring straight ahead at all times to avoid distractions.
    B: Devoting most attention ahead with frequent glances to the sides, mirrors,
      and instrument panel.
    C: Looking primarily at the rear-view mirror to monitor traffic behind you.
    D: Focusing mainly on the vehicle directly in front of you.
  answer: B
  explanation: The manual states to develop a scanning pattern with most of your attention
    devoted to the situation ahead but with glances to either side, in the rear view
    mirror, and at the instrument panel at regular and frequent intervals.
- id: 147
  category: alcohol_drugs_health
  question: If you are taking medication and need to drive, what is the recommended
    course of action?
  choices:
    A: Drive only during daylight hours.
    B: Drink coffee or an energy drink before driving.
    C: Obtain and follow your physician's advice about driving.
    D: Drive at a slower speed than the posted limit.
  answer: C
  explanation: The manual advises that if you are taking medication, you should obtain
    and follow your physician's advice about driving.
- id: 148
  category: vehicle_information
  question: After starting your vehicle, what does it mean if a red warning light
    remains illuminated on the instrument panel?
  choices:
    A: The system is functioning normally and running a diagnostic.
    B: It is a minor warning that can be ignored until your next service.
    C: It indicates danger and should be checked immediately.
    D: The parking brake is successfully disengaged.
  answer: C
  explanation: According to the manual, after the computer check, a red light indicates
    danger and should be checked immediately.
- id: 149
  category: vehicle_information
  question: 'If the brake warning lamp illuminates when you press the foot brake pedal,
    it indicates that:'
  choices:
    A: The parking brake is applied.
    B: The brake system is defective and the vehicle should not be driven.
    C: The anti-lock braking system is engaging properly.
    D: The brake pads are warming up to optimal temperature.
  answer: B
  explanation: The manual states that if the brake warning lamp illuminates when the
    foot brake pedal is pressed, the brake system is defective and the vehicle should
    not be driven.
- id: 150
  category: safe_driving_rules
  question: According to the manual, your chances of being killed in a crash are how
    much greater if you are thrown from your car?
  choices:
    A: Two times greater
    B: Three times greater
    C: Four times greater
    D: Five times greater
  answer: D
  explanation: Safety belts prevent you from being thrown from your car. The manual
    notes that your chances of being killed are five times greater if you are thrown
    from your car.
- id: 151
  category: safe_driving_rules
  question: 'If you are not buckled up, it is possible to be killed in a crash at
    speeds as low as:'
  choices:
    A: 12 miles per hour
    B: 20 miles per hour
    C: 25 miles per hour
    D: 35 miles per hour
  answer: A
  explanation: The manual warns that if not buckled up, it is possible to be killed
    in a crash at speeds as low as 12 miles per hour (19 km/h).
- id: 152
  category: safe_driving_rules
  question: How should a shoulder belt be worn for proper fit?
  choices:
    A: As tight as possible across the chest.
    B: Loose enough so that you can insert your fist between the belt and your chest.
    C: Tucked under your arm for maximum comfort.
    D: Snugly across your hip bones and lower abdomen.
  answer: B
  explanation: The manual specifies that the shoulder belt should be not quite so
    tight—so that you can insert your fist between the belt and your chest.
- id: 153
  category: driver_responsibility
  question: 'Under Hawaii law, it is illegal to leave a child unattended in a motor
    vehicle for five minutes or longer if the child is under the age of:'
  choices:
    A: Six
    B: Seven
    C: Eight
    D: Nine
  answer: D
  explanation: Hawaii law prohibits leaving a child under nine years of age unattended
    in a motor vehicle for five minutes or longer.
- id: 154
  category: safe_driving_rules
  question: When backing your vehicle, why should you turn around and look to the
    rear instead of relying solely on your rear-view mirrors?
  choices:
    A: Mirrors distort the distance of objects behind you.
    B: The view through rear-view mirrors is too small to use for this purpose.
    C: It is illegal to use mirrors while backing up.
    D: Mirrors do not show the front clearance of the vehicle.
  answer: B
  explanation: The manual instructs drivers to turn around and look to the rear because
    the view through rear-view mirrors is too small to use for this purpose.
- id: 155
  category: sharing_the_road
  question: Who bears the chief responsibility for avoiding a collision when a vehicle
    is leaving a parking space?
  choices:
    A: The driver of the vehicle leaving the parking space.
    B: The drivers in the oncoming traffic lane.
    C: Pedestrians walking near the parking space.
    D: The driver parked in the space directly behind.
  answer: A
  explanation: 'The manual states: "The chief responsibility for avoiding a collision
    lies with the driver who is leaving a parking space."'
- id: 156
  category: safe_driving_rules
  question: What must you do before entering a roadway from a driveway?
  choices:
    A: Sound your horn to warn oncoming traffic.
    B: Stop before crossing the sidewalk area.
    C: Accelerate quickly to merge into traffic.
    D: Yield only to vehicles, not pedestrians.
  answer: B
  explanation: When entering traffic from a driveway, you must always stop before
    entering the roadway, and the stop should be made before crossing the sidewalk
    area.
- id: 157
  category: safe_driving_rules
  question: In which direction should you proceed when driving around the central
    island of a roundabout?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a straight line
    D: Whichever direction has less traffic
  answer: B
  explanation: 'Tips for driving through a roundabout include: "Drive to the right
    of the central island and proceed in a counterclockwise direction."'
- id: 158
  category: sharing_the_road
  question: When approaching a roundabout, where should you look for traffic that
    has the right-of-way?
  choices:
    A: To the right
    B: To the left
    C: In your rear-view mirror
    D: Straight ahead only
  answer: B
  explanation: When entering a roundabout, you should "Look to the left for traffic
    and yield to traffic, including bicyclists, already in the roundabout."
- id: 159
  category: defensive_driving
  question: If you are doubtful about your ability to comfortably cope with undesirable
    weather or road conditions for a trip, what does the manual recommend?
  choices:
    A: Drive at half the posted speed limit.
    B: Follow closely behind a larger vehicle.
    C: Postpone or cancel the trip.
    D: Turn on your hazard lights for the entire trip.
  answer: C
  explanation: 'The manual advises: "If you are doubtful as to whether you are able
    to comfortably cope with any undesirable conditions, POSTPONE OR CANCEL THE TRIP."'
- id: 160
  category: vehicle_information
  question: Before driving an unfamiliar vehicle, what should you take a few minutes
    to do?
  choices:
    A: Check the engine coolant and battery water.
    B: Familiarize yourself with the location and operation of signals, lamps, wipers,
      brakes, and horn.
    C: Read the entire vehicle owner's manual.
    D: Drive it around the block at a high speed to test the brakes.
  answer: B
  explanation: For an unfamiliar vehicle, the manual says to "Take a few minutes to
    familiarize yourself with the location and operation of the turn and hazard warning
    signals, head lamps and beam selector, windshield wipers and washers, brakes,
    gear selector and horn."
- id: 161
  category: safe_driving_rules
  question: What should you do if you miss your exit while driving in a roundabout?
  choices:
    A: Stop and reverse to your exit
    B: Make a U-turn over the central island
    C: Drive through the roundabout again until you reach your exit
    D: Exit at the next available road and turn around
  answer: C
  explanation: According to the manual, if you miss your exit, you should drive through
    the roundabout again until you reach your exit.
- id: 162
  category: defensive_driving
  question: When driving on a roadway with three or more lanes in your direction of
    travel, which lanes generally have the fewest traffic conflicts?
  choices:
    A: The right lanes
    B: The left lanes
    C: The center lanes
    D: The shoulder lanes
  answer: C
  explanation: The manual advises to choose the center lanes on roads with three or
    more lanes in the direction of travel, as there will be fewer traffic conflicts.
- id: 163
  category: safe_driving_rules
  question: How far in advance does the law require you to signal before starting
    a lane change?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: The law requires that you signal your intention for at least 100 feet
    (30m) before you start a lane change.
- id: 164
  category: safe_driving_rules
  question: According to the manual, when is it strictly prohibited to change lanes?
  choices:
    A: When driving in heavy traffic
    B: When approaching or moving through intersections and crosswalks
    C: When driving on a three-lane highway
    D: When moving slower than the flow of traffic
  answer: B
  explanation: 'The manual explicitly states: ''NEVER CHANGE LANES WHEN APPROACHING
    OR MOVING THROUGH INTERSECTIONS AND CROSSWALKS.'''
- id: 165
  category: defensive_driving
  question: What is the minimum recommended following interval between your vehicle
    and the vehicle ahead?
  choices:
    A: One second
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: B
  explanation: To ensure an adequate interval, you should count 'one thousand one,
    one thousand two'. The manual states you should have at least a two-second interval
    and never less.
- id: 166
  category: safe_driving_rules
  question: When is the proper time to slow down for a curve or a turn?
  choices:
    A: Before you enter the curve or begin the turn
    B: While you are in the middle of the curve
    C: Just as you begin to accelerate out of the turn
    D: Only if the road is wet or icy
  answer: A
  explanation: The manual instructs drivers to slow to a proper speed before entering
    a curve or beginning a turn, as braking abruptly in a curve can cause a loss of
    control.
- id: 167
  category: safe_driving_rules
  question: While waiting to turn left at an intersection, the traffic light turns
    green. What should you do with your front wheels while waiting for traffic to
    clear?
  choices:
    A: Point them to the left
    B: Point them to the right
    C: Keep them pointing straight ahead
    D: Turn them slightly toward the curb
  answer: C
  explanation: While waiting to turn left on a green light, you should move slowly
    into the intersection and keep the wheels pointing straight ahead until it is
    clear and safe to turn.
- id: 168
  category: safe_driving_rules
  question: If a vehicle ahead of you is making a left turn, what is a prohibited
    action when attempting to pass it?
  choices:
    A: Passing the vehicle carefully on the right
    B: Driving onto the road shoulder to pass
    C: Waiting for the vehicle to complete its turn
    D: Checking your blind spots before moving right
  answer: B
  explanation: 'The manual emphasizes: ''NEVER DRIVE ONTO THE ROAD SHOULDER TO PASS
    A VEHICLE MAKING A LEFT TURN.'''
- id: 169
  category: defensive_driving
  question: If a conflict appears before you have completed passing another vehicle
    on a two-lane road, what should you do?
  choices:
    A: Accelerate to complete the pass quickly
    B: Sound your horn and force the other vehicle to the shoulder
    C: Brake sharply and return to the lane behind the overtaken vehicle
    D: Move into the left shoulder to avoid the oncoming traffic
  answer: C
  explanation: If a conflict appears before you complete a pass, you should brake
    sharply and return to the lane behind the overtaken vehicle. You should not attempt
    to increase your speed to complete the pass.
- id: 170
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to move back into your proper
    traffic lane?
  choices:
    A: As soon as your front bumper clears the other vehicle
    B: When you can see the overtaken vehicle in your interior rear-view mirror
    C: After you have traveled at least 100 feet past the vehicle
    D: When the driver you are passing flashes their headlights
  answer: B
  explanation: You should move back into the proper traffic lane when you can see
    the overtaken vehicle in your interior rear-view mirror.
- id: 171
  category: defensive_driving
  question: Which of the following is a clue that a parked car might suddenly move
    into your traffic lane?
  choices:
    A: The vehicle's windows are rolled down
    B: The vehicle is parked on a hill
    C: Smoke or visible vapor is coming from the exhaust pipe
    D: The vehicle has a sunshade in the windshield
  answer: C
  explanation: When passing parked cars, clues that a vehicle may move include movement
    inside, illuminated lamps, turning front wheels, and smoke or visible vapor from
    the exhaust pipe.
- id: 172
  category: safe_driving_rules
  question: When driving in an open area with free-flowing traffic on a roadway with
    two lanes in your direction, how should you use the lanes?
  choices:
    A: Use the left lane for normal driving and the right lane for passing
    B: Use the right lane for normal driving and the left lane for passing
    C: Drive in the center of both lanes
    D: Constantly change lanes to maintain the highest speed
  answer: B
  explanation: For two lanes in the direction of travel in an open area when traffic
    is free-flowing, you should use the right lane, and use the left lane for passing
    or when vehicles are entering from the right.
- id: 173
  category: sharing_the_road
  question: When making a right turn at an intersection, what must you avoid doing?
  choices:
    A: Using your turn signal
    B: Driving in a bike lane
    C: Looking for pedestrians
    D: Slowing down before the turn
  answer: B
  explanation: 'The manual explicitly states: ''When making a right turn at an intersection,
    do not drive in a bike lane.'''
- id: 174
  category: defensive_driving
  question: What should you do if you are in danger of striking another vehicle, person,
    or object?
  choices:
    A: Jam on the brakes and hold them down firmly.
    B: Apply and release the brakes rapidly and steer toward a clear area.
    C: Turn off the engine and apply the emergency brake.
    D: Downshift to the lowest gear immediately.
  answer: B
  explanation: The manual states that if you are in danger of striking something,
    you shouldn't just jam on the brakes and slide the wheels. Instead, apply and
    release the brakes rapidly and steer the vehicle toward a clear area.
- id: 175
  category: safe_driving_rules
  question: When is it safe to drive your vehicle into an intersection or crosswalk?
  choices:
    A: As soon as the traffic light turns green.
    B: When you are making a right turn on red.
    C: Only when there is space for your entire vehicle on the opposite side.
    D: When the vehicle ahead of you begins to move.
  answer: C
  explanation: 'The manual explicitly warns: NEVER DRIVE YOUR VEHICLE INTO AN INTERSECTION
    OR A CROSSWALK UNLESS THERE IS SPACE FOR YOUR ENTIRE VEHICLE ON THE OPPOSITE SIDE
    OF THE INTERSECTION OR CROSSWALK.'
- id: 176
  category: safe_driving_rules
  question: What should you do immediately after driving through water?
  choices:
    A: Accelerate quickly to dry the tires.
    B: Shift into a lower gear.
    C: Pull over and wait for the brakes to dry.
    D: Test the action of the brakes.
  answer: D
  explanation: According to the manual, you should always test the action of the brakes
    after driving through water. If braking action is reduced, apply them lightly
    several times until proper action is restored.
- id: 177
  category: defensive_driving
  question: When stopping in traffic behind another vehicle, how much space should
    you leave?
  choices:
    A: Exactly one car length.
    B: Enough space to see the point where the rear tires of the vehicle ahead rest
      on the road.
    C: At least three feet of distance from their rear bumper.
    D: Close enough so that another vehicle cannot cut in front of you.
  answer: B
  explanation: The manual advises stopping far enough behind the vehicle ahead so
    that you can see the point where the rear tires of the vehicle ahead rest on the
    road, which allows room to go around if needed.
- id: 178
  category: vehicle_information
  question: Why is downshifting as a regular routine to reduce speed NOT recommended?
  choices:
    A: It causes rapid deceleration without giving a warning signal to following drivers.
    B: It uses more fuel than applying the brakes.
    C: It automatically activates the hazard warning lights.
    D: It causes the vehicle's wheels to lock up and slide.
  answer: A
  explanation: The practice of downshifting as a regular routine is not recommended
    because it causes a rapid deceleration of the vehicle without a warning (stop
    lamp) signal to following drivers.
- id: 179
  category: vehicle_information
  question: When using downshifting to obtain additional braking effect on a steep
    downgrade, when should the downshift be made?
  choices:
    A: Halfway down the grade.
    B: Before starting the downgrade.
    C: Only after the brakes have started to overheat.
    D: At the bottom of the downgrade.
  answer: B
  explanation: The manual states that the downshift should be made before starting
    the downgrade because it is more difficult to downshift at higher speeds.
- id: 180
  category: vehicle_information
  question: What does it mean if the brake warning lamp on the instrument panel lights
    up when you apply the brakes?
  choices:
    A: The parking brake is fully engaged.
    B: The brake system has partially failed and requires immediate repair.
    C: The brake fluid is at an optimal level.
    D: The anti-lock braking system is functioning normally.
  answer: B
  explanation: If the brake warning lamp lights up when you apply the brakes, it indicates
    that the brake system has partially failed and immediate repair is required.
- id: 181
  category: safe_driving_rules
  question: When parking on a hill, whether uphill or downhill, which direction should
    you turn your wheels?
  choices:
    A: To the left.
    B: Straight ahead.
    C: To the right.
    D: Away from the curb.
  answer: C
  explanation: 'The manual instructs: "Whether you park uphill or downhill turn the
    wheels to the right. This will ensure that the vehicle will roll away from traffic
    if something causes it to roll free."'
- id: 182
  category: safe_driving_rules
  question: When parallel parked, how close must your vehicle's curbside wheels be
    to the curb?
  choices:
    A: Within 6 inches
    B: Within 12 inches
    C: Within 18 inches
    D: Within 24 inches
  answer: B
  explanation: When parallel parked, the vehicle’s curbside wheels shall be within
    12 inches of the curb (30cm), or completely within the marked parking stall.
- id: 183
  category: vehicle_information
  question: What is a common cause for an electric turn signal failing to cancel automatically?
  choices:
    A: Making a turn or lane change that is too small to trigger the self-cancelling
      mechanism.
    B: Driving at speeds exceeding 60 miles per hour.
    C: A burned-out brake light bulb.
    D: Using the turn signal in inclement weather.
  answer: A
  explanation: Failure to cancel is usually caused by making a turn or lane change
    which is too small to cause operation of the self-cancelling mechanism.
- id: 184
  category: safe_driving_rules
  question: When parallel parking, how far should your front and rear bumpers be from
    the other parked vehicles?
  choices:
    A: No closer than one foot.
    B: No closer than two feet.
    C: No closer than three feet.
    D: No closer than four feet.
  answer: B
  explanation: The manual states that front and rear bumpers should not be closer
    than two feet from the other vehicles when in a parked position unless the street
    is otherwise marked.
- id: 185
  category: vehicle_information
  question: Why should you avoid resting your foot on the brake pedal while driving?
  choices:
    A: It causes the engine to stall.
    B: It deactivates the vehicle's electric signals.
    C: It activates the stop lamps and gives following drivers an improper signal.
    D: It increases the vehicle's fuel efficiency.
  answer: C
  explanation: Resting your foot on the brake pedal causes the brake (stop) lamps
    to be activated, which gives following drivers an improper signal and causes excessive
    brake wear.
- id: 186
  category: vehicle_information
  question: How can you usually avoid prolonged brake applications that cause brakes
    to heat up and become less effective?
  choices:
    A: By shifting to a lower gear and allowing the engine to assist in holding speed
      down.
    B: By pumping the brakes rapidly every few seconds.
    C: By shifting into neutral while coasting downhill.
    D: By applying the parking brake lightly.
  answer: A
  explanation: Usually, prolonged brake use can be avoided by shifting to a lower
    gear and allowing the engine to assist in holding the vehicle speed down.
- id: 187
  category: safe_driving_rules
  question: Where should you avoid parking your vehicle?
  choices:
    A: In a designated loading zone.
    B: At locations that are hidden, such as just beyond a curve or the crest of a
      hill.
    C: On a street with parallel parking markings.
    D: In a marked parking stall.
  answer: B
  explanation: You should always park at a location clear of traffic and readily visible.
    Avoid locations that are hidden, such as just beyond a curve or the crest of a
    hill.
- id: 188
  category: vehicle_information
  question: What is a disadvantage of using hand signals instead of electric turn
    signals?
  choices:
    A: They are usually subject to mechanical failure.
    B: They are not readily visible to drivers on the right of the signaling vehicle.
    C: They require the driver to use both hands to control the vehicle.
    D: They are only legally permitted during daylight hours.
  answer: B
  explanation: According to the manual, a disadvantage of hand signals is that they
    are not readily visible to drivers on the right of the signaling vehicle.
- id: 189
  category: safe_driving_rules
  question: When is it appropriate to use your hazard warning signals (4-way flashers)?
  choices:
    A: When driving in heavy rain or fog.
    B: When your vehicle is moving slowly up a steep hill.
    C: To warn other drivers that your vehicle is in a hazardous position on the roadway.
    D: When you are preparing to make a sudden U-turn.
  answer: C
  explanation: Hazard warning signals are intended to warn other drivers that a vehicle
    is in a hazardous position on the roadway and should never be used when the vehicle
    is moving.
- id: 190
  category: safe_driving_rules
  question: If you must slow your vehicle before making an intended turn, when should
    you begin signaling?
  choices:
    A: Before you begin slowing your vehicle.
    B: While you are applying the brakes.
    C: After you have reached the proper turning speed.
    D: Just as you begin to turn the steering wheel.
  answer: A
  explanation: If you must slow your vehicle before you can make the intended turn
    or lane change, it is important that you begin signaling before slowing your vehicle
    to alert other drivers.
- id: 191
  category: sharing_the_road
  question: When sharing the road with motorcycles, what rule must drivers remember
    regarding lane usage?
  choices:
    A: Motorcyclists must ride on the right edge of the lane.
    B: Motorcyclists are entitled to the entire width of their traffic lane.
    C: Two motorcycles must share a single lane to save space.
    D: Cars may share a lane with a motorcycle if the lane is wide enough.
  answer: B
  explanation: The manual explicitly states that a motorcyclist is entitled to the
    entire width of his traffic lane.
- id: 192
  category: defensive_driving
  question: Why are the first few drops of rain considered a danger signal to a defensive
    driver?
  choices:
    A: They indicate that hydroplaning is immediately imminent.
    B: They cause immediate fog to form on the windshield.
    C: Roads are most slippery because oil dropped from passing cars has not been
      washed away.
    D: The rain will wash away the painted lane markings.
  answer: C
  explanation: The first few drops of rain are a danger signal because roads are most
    slippery at this time; the oil dropped from passing cars has not yet been washed
    away.
- id: 193
  category: defensive_driving
  question: At what speed does partial hydroplaning typically start to occur?
  choices:
    A: 25 miles per hour
    B: 35 miles per hour
    C: 45 miles per hour
    D: 55 miles per hour
  answer: B
  explanation: According to the manual, partial hydroplaning may start at 35 miles
    per hour (56 km/h).
- id: 194
  category: defensive_driving
  question: What happens to a vehicle when it hydroplanes at high speeds, such as
    55 mph in heavy rain?
  choices:
    A: The tires lose all contact with the pavement and the driver has no control.
    B: The vehicle's brakes automatically lock up.
    C: The steering wheel becomes significantly heavier to turn.
    D: The engine will stall due to water intake.
  answer: A
  explanation: At 55 miles per hour in heavy rain, the tires may lose all contact
    with the pavement, meaning you cannot brake, accelerate, or turn, and you have
    no control over your vehicle.
- id: 195
  category: vehicle_information
  question: Which of the following is a recommended way to prevent your vehicle from
    hydroplaning?
  choices:
    A: Over-inflate your tires above the recommended pressure.
    B: Ensure your tires have good tread depth.
    C: Increase your speed to push through the water faster.
    D: Drive with your hazard lights on.
  answer: B
  explanation: To prevent hydroplaning, you should ensure that the tires on the vehicle
    have good tread depth, as worn or bald tires will hydroplane at lower speeds.
- id: 196
  category: defensive_driving
  question: What should you do if your brakes become wet after driving through deep
    water and do not hold properly?
  choices:
    A: Pump the brakes rapidly and forcefully.
    B: Shift into neutral and coast until they dry.
    C: Reduce speed and apply gentle pressure on the brake pedal until they work properly
      again.
    D: Pull the emergency parking brake immediately.
  answer: C
  explanation: If brakes become wet, you should reduce speed and apply gentle pressure
    on the brake pedal until your brakes work properly again.
- id: 197
  category: safe_driving_rules
  question: What should you do if heavy rain reduces your visibility while driving?
  choices:
    A: Turn on your high beam headlamps.
    B: Turn on your hazard warning signals while moving.
    C: Reduce your speed and turn on your low beam headlamps.
    D: Stop immediately in the middle of your lane.
  answer: C
  explanation: When heavy rain reduces your visibility, reduce your speed and turn
    on your head lamps (low beam) so that others may see you.
- id: 198
  category: defensive_driving
  question: When driving in fog, why should you never use your high beam headlamps?
  choices:
    A: High beams will drain the vehicle's battery faster in cold weather.
    B: High beams are illegal to use outside of city limits.
    C: The reflection will reduce your ability to see and blind approaching drivers.
    D: High beams do not activate the vehicle's taillights.
  answer: C
  explanation: In fog, you should never use the high beam because the reflection will
    reduce your ability to see and the light will reduce the approaching driver's
    ability to see.
- id: 199
  category: defensive_driving
  question: If fog is so thick that you are unable to see at least two car lengths
    (40 feet) ahead, what is the safest course of action?
  choices:
    A: Roll down your windows and honk your horn periodically.
    B: Pull completely off the pavement, stop, and turn on hazard warning signals.
    C: Straddle the center line to stay on the road.
    D: Turn on your high beams and proceed at 10 mph.
  answer: B
  explanation: If you are unable to see at least two car lengths in fog, pull completely
    off the pavement and stop, and turn on the hazard warning signals.
- id: 200
  category: defensive_driving
  question: When driving in winter conditions, where should you expect ice to accumulate
    even when the rest of the road is clear?
  choices:
    A: On the crests of hills
    B: On or under bridges
    C: In the center lane of a multi-lane highway
    D: Near intersections with traffic lights
  answer: B
  explanation: During winter driving, watch for danger spots because ice may accumulate
    on or under bridges even when the rest of the road is clear.
- id: 201
  category: safe_driving_rules
  question: What lighting should you use during the short periods of dawn and dusk
    when there is not enough light to see objects clearly?
  choices:
    A: High beam headlamps
    B: Low beam headlamps
    C: Hazard warning signals
    D: Parking lights only
  answer: B
  explanation: During dawn and dusk when there is not enough light to see clearly,
    you should turn the head lamps on low beam so others can see you.
- id: 202
  category: defensive_driving
  question: What should you do if the lights of an approaching vehicle are too bright
    at night?
  choices:
    A: Turn on your high beams until the vehicle passes.
    B: Flash your high beams once and look at the right edge of the road.
    C: Close your eyes briefly to avoid the glare.
    D: Steer toward the center line to give the vehicle more room.
  answer: B
  explanation: The manual states that if the lights of an approaching vehicle are
    too bright, you should flash your high beams once and look at the right edge of
    the road, using lane markings or reflectors as a guide.
- id: 203
  category: signs_and_signals
  question: What do red lane marking reflectors indicate on the roadway?
  choices:
    A: You are approaching a stop sign or traffic signal.
    B: There is a hazard or construction zone on the shoulder.
    C: You are going the wrong direction in the traffic lane.
    D: You are entering a school zone.
  answer: C
  explanation: According to the manual, you must recognize that red lane marking reflectors
    mean you are going the wrong direction in the traffic lane.
- id: 204
  category: safe_driving_rules
  question: If traffic in a freeway entrance lane is congested, what is a dangerous
    action you must avoid?
  choices:
    A: Slowing down near the entrance.
    B: Stopping near the entrance.
    C: Moving slowly to the end of the entrance lane and stopping.
    D: Observing traffic in the entrance lane before merging.
  answer: C
  explanation: 'The manual explicitly warns: "DO NOT MOVE SLOWLY TO THE END OF THE
    ENTRANCE LANE AND STOP. It is very difficult and dangerous to attempt to enter
    freeway traffic when you are stopped at the end of the entrance lane."'
- id: 205
  category: safe_driving_rules
  question: Which lane(s) should through traffic use on a freeway?
  choices:
    A: The right lane only.
    B: The shoulder lane.
    C: The exit lane.
    D: The left or center lanes.
  answer: D
  explanation: The manual states that through traffic should use the left or center
    lanes and move at or near the posted speed limit, while the right lane is used
    by slower vehicles and entering/leaving traffic.
- id: 206
  category: safe_driving_rules
  question: What should you do if you pass the place where you intended to exit the
    freeway?
  choices:
    A: Stop and back up carefully on the shoulder.
    B: Make a U-turn at the next median opening.
    C: Continue on to the next exit.
    D: Stop in the right lane and wait for a gap in traffic to reverse.
  answer: C
  explanation: 'If you pass your intended exit, the manual instructs: "DO NOT STOP;
    DO NOT BACK UP! Continue on to the next exit."'
- id: 207
  category: defensive_driving
  question: If you see another driver in trouble on the freeway, what is the recommended
    procedure?
  choices:
    A: Stop immediately on the shoulder to assist them.
    B: Do not stop to assist, but report the situation to the proper authorities.
    C: Pull over in the right lane and turn on your hazard lights.
    D: Slow down to 15 mph to ask if they need a tow truck.
  answer: B
  explanation: 'For emergency stops on the freeway, the manual advises: "Do not stop
    to assist other drivers in trouble but report the situation to the proper authorities."'
- id: 208
  category: defensive_driving
  question: What is the first thing you should do if you experience a tire blowout
    while driving?
  choices:
    A: Apply the brakes firmly and quickly.
    B: Pump the brake pedal to maintain hydraulic pressure.
    C: Grip the steering wheel firmly and do not apply the brakes.
    D: Jerk the steering wheel to pull off the road immediately.
  answer: C
  explanation: 'If you experience a tire blowout, the manual states: "DO NOT APPLY
    THE BRAKES... Grip the steering wheel firmly and steer to remain in your traffic
    lane."'
- id: 209
  category: vehicle_information
  question: If your vehicle's brakes fail completely, what sequence of actions should
    you take first?
  choices:
    A: Turn off the ignition and apply the parking brake rapidly.
    B: Pump the brake pedal quickly, then shift to a lower gear.
    C: Shift into neutral and coast to a stop.
    D: Slam on the parking brake with great force.
  answer: B
  explanation: If your brakes fail completely, the manual instructs you to "Pump the
    brake pedal quickly; then Shift to a lower gear" before looking for an escape
    route and applying the parking brake gradually.
- id: 210
  category: defensive_driving
  question: If your vehicle's wheels slip off the edge of the pavement, what should
    you NOT do?
  choices:
    A: Reduce your speed.
    B: Use the brakes gently.
    C: Attempt to force the vehicle back onto the pavement by jerking the steering
      wheel.
    D: Continue to drive with the wheels off the pavement until at a safe speed.
  answer: C
  explanation: 'When wheels go off the pavement, the manual explicitly warns: "DO
    NOT ATTEMPT TO FORCE THE VEHICLE BACK ONTO THE PAVEMENT BY JERKING THE STEERING
    WHEEL."'
- id: 211
  category: sharing_the_road
  question: If a vehicle is attempting to pass you but cannot complete the pass because
    of oncoming traffic, how can you help avoid a collision?
  choices:
    A: Steer your vehicle as far to the left as possible.
    B: Speed up to prevent them from merging behind you.
    C: Steer your vehicle as far to the right as you can with safety.
    D: Honk your horn to warn the oncoming traffic.
  answer: C
  explanation: To help a passing vehicle in danger, you should steer your vehicle
    as far to the right as you can with safety, even onto the shoulder if possible.
- id: 212
  category: defensive_driving
  question: If you observe an oncoming vehicle in your traffic lane, what is the correct
    evasive action?
  choices:
    A: Enter the oncoming traffic lane to avoid them.
    B: Stop immediately in your lane and brace for impact.
    C: Accelerate and steer to the left.
    D: Flash your lights, honk the horn, and steer to the right.
  answer: D
  explanation: If there is an oncoming vehicle in your lane, you should "Flash your
    lights and honk the horn" and "Quickly slow your vehicle and steer to the right
    out of the lane... DO NOT ENTER THE ONCOMING TRAFFIC LANE."
- id: 213
  category: vehicle_information
  question: What is one of the first actions you should take if your vehicle's accelerator
    sticks open?
  choices:
    A: Slap the accelerator pedal hard with your foot.
    B: Pump the brakes rapidly.
    C: Shift into reverse.
    D: Jerk the steering wheel from side to side.
  answer: A
  explanation: If your accelerator sticks open, the manual advises that you should
    "Slap the accelerator pedal hard with your foot."
- id: 214
  category: safe_driving_rules
  question: When leaving a freeway, at what point should you slow down your vehicle?
  choices:
    A: While you are still in the main freeway traffic lane.
    B: As soon as you turn on your turn signal.
    C: After you are completely into the exit ramp.
    D: Only when you see a stop sign at the end of the ramp.
  answer: C
  explanation: When leaving the freeway, you should "Maintain your speed until you
    are completely into the exit ramp, then slow down smoothly."
- id: 215
  category: safe_driving_rules
  question: During the short period before the sun rises and after the sun sets, what
    lights should you use?
  choices:
    A: Parking lights only.
    B: High beam head lamps.
    C: Low beam head lamps.
    D: Hazard lights.
  answer: C
  explanation: The manual states that during the short period before sunrise and after
    sunset, "you should turn the head lamps on low beam so others can see you."
- id: 216
  category: defensive_driving
  question: What is a basic rule regarding the use of brakes during a driving emergency?
  choices:
    A: Always slam on the brakes to stop as quickly as possible.
    B: Avoid slamming on the brakes and sliding the wheels.
    C: Lock the wheels to maintain steering control.
    D: Only use the parking brake to slow down.
  answer: B
  explanation: In emergency driving procedures, a basic point is to "Avoid slamming
    on the brakes and sliding the wheels. You cannot control a vehicle when the wheels
    are sliding."
- id: 217
  category: vehicle_information
  question: If your vehicle experiences power steering failure, what will happen when
    you try to steer?
  choices:
    A: The steering wheel will lock completely.
    B: The vehicle will automatically apply the brakes.
    C: Additional effort will be required to maintain steering control.
    D: The steering wheel will spin freely without turning the tires.
  answer: C
  explanation: In the event of power steering failure, additional effort will be required
    to maintain steering control. You should reduce speed, drive to a safe area, and
    stop.
- id: 218
  category: defensive_driving
  question: According to the manual, what is the most common cause of skidding?
  choices:
    A: Driving with under-inflated tires.
    B: Excessive speed for existing road and traffic conditions.
    C: Driving with worn brake pads.
    D: Sudden changes in wind direction.
  answer: B
  explanation: Most skidding is caused by making sudden changes in direction or speed,
    with excessive speed for existing road and traffic conditions being the most common
    cause.
- id: 219
  category: defensive_driving
  question: How should you steer if the rear of your vehicle begins to skid to the
    right?
  choices:
    A: Turn the steering wheel to the left.
    B: Hold the steering wheel perfectly straight.
    C: Turn the steering wheel to the right.
    D: Pump the brakes while steering left.
  answer: C
  explanation: To steer out of a skid, you should turn the steering wheel in the direction
    that the rear of the vehicle is skidding. If skidding to the right, turn the wheel
    to the right.
- id: 220
  category: safe_driving_rules
  question: Which of the following should you NEVER use to extinguish a gasoline,
    oil, or electrical fire in your vehicle?
  choices:
    A: Dirt
    B: Sand
    C: A blanket
    D: Water
  answer: D
  explanation: If a small fire occurs, you can use a fire extinguisher, dirt, sand,
    or a blanket to smother it. However, you must DO NOT USE WATER ON GASOLINE, OIL,
    OR ELECTRICAL FIRES.
- id: 221
  category: safe_driving_rules
  question: How can you indicate the need for assistance if your vehicle breaks down
    on the highway?
  choices:
    A: Honk your horn continuously.
    B: Stand in the middle of the lane and wave your arms.
    C: Raise the hood and tie a white cloth to the radio antenna or door handle.
    D: Flash your high beams at passing vehicles.
  answer: C
  explanation: To indicate the need for assistance during a breakdown, raise the hood
    of your vehicle and tie a white cloth to the radio antenna or the door handle.
- id: 222
  category: safe_driving_rules
  question: If you must walk along the highway after a vehicle breakdown, how should
    you walk?
  choices:
    A: Walk with your back to traffic.
    B: Walk facing traffic and well clear of the roadway.
    C: Walk on the shoulder in the same direction as traffic.
    D: Walk in the center median.
  answer: B
  explanation: If you must walk along the highway, the manual states you should walk
    facing traffic and well clear of the roadway.
- id: 223
  category: safe_driving_rules
  question: What should you do if your vehicle breaks down on a freeway and you need
    help?
  choices:
    A: Walk along the freeway facing traffic to find a phone.
    B: Hitchhike to the nearest exit.
    C: Stay with your vehicle until help arrives; do not walk on freeways.
    D: Walk along the freeway in the same direction as traffic.
  answer: C
  explanation: 'The manual explicitly states: "Do not walk on freeways; stay with
    your vehicle until help arrives."'
- id: 224
  category: sharing_the_road
  question: Which statement is true regarding the visibility of drivers in large vehicles?
  choices:
    A: They have excellent visibility to the sides and rear.
    B: They can easily see the area to the immediate rear of their vehicle.
    C: They generally have better forward visibility because their position is above
      most other vehicles.
    D: They have worse forward visibility than passenger cars.
  answer: C
  explanation: Larger vehicles generally provide better forward visibility because
    the driver's position is above most other vehicles, though visibility to the sides
    and rear is severely limited.
- id: 225
  category: sharing_the_road
  question: 'When changing lanes or at intersections near large vehicles, other drivers
    must make allowances for the large vehicle''s:'
  choices:
    A: Faster acceleration.
    B: Increased stopping distance.
    C: Tighter turning radius.
    D: Better rear visibility.
  answer: B
  explanation: Large vehicles require greater stopping distances than other vehicles.
    Other drivers must make allowances for this increased stopping distance when changing
    lanes or at intersections.
- id: 226
  category: vehicle_information
  question: What should drivers of large vehicles do before descending a steep hill
    to prevent brake overheating?
  choices:
    A: Shift to an appropriate lower gear.
    B: Shift into neutral.
    C: Pump the brakes continuously.
    D: Turn off the engine.
  answer: A
  explanation: Drivers of large vehicles should shift to an appropriate lower gear
    before descending a steep hill to minimize the possibility of overheating the
    brakes.
- id: 227
  category: sharing_the_road
  question: What hazard do large, fast-moving vehicles create for smaller vehicles
    passing them?
  choices:
    A: They emit toxic exhaust fumes that obscure vision.
    B: They cause wind gusts with enough force to cause direction changes in smaller
      vehicles.
    C: They drop debris from their tires.
    D: They create a vacuum that pulls smaller vehicles forward.
  answer: B
  explanation: Large fast-moving vehicles cause wind gusts (slipstream) with a force
    great enough to cause direction changes in smaller vehicles.
- id: 228
  category: vehicle_information
  question: If you are towing a trailer that obstructs your view through the inside
    rear-view mirror, what is required?
  choices:
    A: A passenger to act as a spotter.
    B: A rear-facing camera system.
    C: Outside rear-view mirrors of proper size on both sides of your car.
    D: A "Wide Load" sign on the back of the trailer.
  answer: C
  explanation: If your trailer is large enough to obstruct your view through your
    inside rear-view mirror, you must have outside rear-view mirrors of proper size
    on both sides of your car.
- id: 229
  category: vehicle_information
  question: 'A trailer must be equipped with brakes if its loaded weight is 3,000
    pounds or more, OR if it weighs more than:'
  choices:
    A: One-quarter the weight of the towing vehicle.
    B: One-third the weight of the towing vehicle.
    C: Half the weight of the towing vehicle.
    D: Three-quarters the weight of the towing vehicle.
  answer: C
  explanation: If your loaded trailer weighs more than half the weight of the towing
    vehicle or is 3,000 pounds or more, the trailer must be equipped with brakes.
- id: 230
  category: defensive_driving
  question: If your vehicle begins to skid and the skid started when you applied the
    brakes, what is the first thing you should do?
  choices:
    A: Press harder on the brakes.
    B: Release the brakes.
    C: Pump the brakes rapidly.
    D: Apply the emergency parking brake.
  answer: B
  explanation: To steer out of a skid, you should avoid using the brakes. If the skid
    started when you applied the brakes, you should release the brakes.
- id: 231
  category: vehicle_information
  question: If your trailer is large enough to obstruct your view through your inside
    rear-view mirror, what must your vehicle be equipped with?
  choices:
    A: A rear-view camera system
    B: Outside rear-view mirrors of proper size on both sides of your car
    C: A passenger to act as a spotter
    D: Extended bumper hitches
  answer: B
  explanation: According to the manual, if a trailer obstructs your view through the
    inside rear-view mirror, you must have outside rear-view mirrors of proper size
    on both sides of your car.
- id: 232
  category: vehicle_information
  question: Under what conditions must a trailer be equipped with brakes and breakaway
    protection?
  choices:
    A: If the loaded trailer weighs more than 1,000 pounds
    B: If the trailer is used for commercial purposes
    C: If the loaded trailer weighs more than half the weight of the towing vehicle
      or is 3,000 pounds or more
    D: If the trailer is longer than 15 feet
  answer: C
  explanation: The manual states that if your loaded trailer weighs more than half
    the weight of the towing vehicle or is 3,000 pounds or more, it must be equipped
    with brakes and breakaway protection.
- id: 233
  category: safe_driving_rules
  question: What is the rule regarding passengers riding in house trailers?
  choices:
    A: It is allowed if they are wearing seatbelts.
    B: It is allowed only at speeds under 35 mph.
    C: It is prohibited at all times.
    D: It is allowed if the trailer has safety chains.
  answer: C
  explanation: 'The manual explicitly states: "You should not permit passengers to
    ride in trailers. Riding in house trailers is prohibited."'
- id: 234
  category: vehicle_information
  question: How must safety chains be attached when towing a trailer?
  choices:
    A: To the bumper of the towing vehicle
    B: To a part of the trailer hitch
    C: To the frame of the towing vehicle and the trailer
    D: To the axles of both vehicles
  answer: C
  explanation: Safety chains must be attached to the frame of the towing vehicle and
    the trailer and not connected to a part of the trailer hitch.
- id: 235
  category: safe_driving_rules
  question: What is likely to happen if there is insufficient weight on the vehicle's
    trailer hitch?
  choices:
    A: The vehicle will have difficulty steering.
    B: The trailer will "fishtail."
    C: The brakes will lock up.
    D: The tires will blow out.
  answer: B
  explanation: About 10% to 15% of the trailer weight should be on the hitch. The
    manual warns that if the weight is too small, the trailer will "fishtail."
- id: 236
  category: sharing_the_road
  question: According to research, what is the cause of over two-thirds of car/motorcycle
    accidents?
  choices:
    A: Motorcyclists speeding
    B: A car driver turning in front of the motorcyclist
    C: Motorcyclists weaving through traffic
    D: Poor weather conditions
  answer: B
  explanation: Research shows that over two-thirds of car/motorcycle accidents are
    the result of a car driver turning in front of the motorcyclist.
- id: 237
  category: sharing_the_road
  question: 'Because of a motorcycle''s small profile, it may appear to a car driver
    to be:'
  choices:
    A: Closer and traveling faster than it actually is
    B: Farther away and traveling slower than it actually is
    C: The same size as a compact car
    D: Moving erratically
  answer: B
  explanation: The small profile of the motorcycle may make it appear farther away
    and travelling slower than it actually is, making it difficult to judge distance
    and speed.
- id: 238
  category: sharing_the_road
  question: How should a driver treat a motorcycle's lane space?
  choices:
    A: Share the lane if the motorcycle is on the right side
    B: Pass the motorcycle within the same lane to save space
    C: Refrain from sharing a lane because motorcycles are allowed the full width
      of a lane
    D: Honk to force the motorcycle to the edge of the lane
  answer: C
  explanation: Motorcycles are allowed the full width of a lane in which to maneuver.
    Drivers must refrain from sharing a lane with a motorcyclist as it restricts their
    ability to avoid hazards.
- id: 239
  category: sharing_the_road
  question: Where are car/motorcycle collisions most likely to occur?
  choices:
    A: On highways
    B: In parking lots
    C: At intersections
    D: On rural roads
  answer: C
  explanation: The manual states that intersections are the most likely places for
    car/motorcycle collisions to occur, usually because a car driver does not see
    the motorcycle.
- id: 240
  category: defensive_driving
  question: What is the minimum recommended following distance when driving behind
    a motorcycle?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 4 seconds
  answer: B
  explanation: When driving behind a motorcycle, you should allow at least a 2-second
    following distance to provide the cyclist enough room to maneuver or stop in an
    emergency.
- id: 241
  category: sharing_the_road
  question: In Hawaii, what percentage of all traffic fatalities are pedestrians?
  choices:
    A: 10%
    B: 20%
    C: 30%
    D: 50%
  answer: B
  explanation: The summary of facts in the manual states that in Hawaii, 20% of all
    traffic fatalities are pedestrians.
- id: 242
  category: sharing_the_road
  question: What must you do if you see a blind person (identified by a white cane
    or guide dog) in the roadway?
  choices:
    A: Stop regardless of the traffic signal indication or traffic situation
    B: Honk your horn to warn them of your approach
    C: Yield only if the traffic light is red
    D: Steer around them carefully without stopping
  answer: A
  explanation: Drivers must stop for all blind persons in the roadway (identified
    by a white cane or guide dog) regardless of the traffic signal indication or traffic
    situation.
- id: 243
  category: safe_driving_rules
  question: 'If a vehicle is stopped to allow a pedestrian to cross the street, you
    must:'
  choices:
    A: Pass on the right side only
    B: Honk your horn before passing
    C: Never pass the stopped vehicle
    D: Pass quickly to avoid delaying traffic
  answer: C
  explanation: It is prohibited by law to pass a vehicle that is stopped to allow
    a pedestrian to cross the street.
- id: 244
  category: safe_driving_rules
  question: 'Driving through a pedestrian safety zone is:'
  choices:
    A: Allowed if no pedestrians are present
    B: Prohibited by law
    C: Allowed only to make a right turn
    D: Recommended to avoid traffic jams
  answer: B
  explanation: The manual explicitly states that you must never drive through a pedestrian
    safety zone, and that doing so is prohibited by law.
- id: 245
  category: safe_driving_rules
  question: As a pedestrian, what should you do if you arrive at an intersection and
    the green light has been showing for some time?
  choices:
    A: Run quickly across the street
    B: Wait for the green signal on the next cycle
    C: Cross only if no cars are visible
    D: Wave at drivers to stop before crossing
  answer: B
  explanation: Pedestrians should never start across the street on a green light that
    has been showing for some time; they should wait for the green signal on the next
    cycle.
- id: 246
  category: sharing_the_road
  question: Which side of the street should you walk on if you are a pedestrian walking
    in the roadway?
  choices:
    A: The right side, moving with traffic
    B: The left side, facing oncoming traffic
    C: The center of the road
    D: Either side, as long as you wear bright clothing
  answer: B
  explanation: The manual states that pedestrians should walk on the left side of
    the street facing oncoming traffic.
- id: 247
  category: sharing_the_road
  question: When must you stop for a school bus that has alternating red signal lamps
    flashing?
  choices:
    A: Only when you are travelling directly behind the bus
    B: In all directions on any type of highway
    C: When travelling in the same lane or any adjacent lane on the same highway
    D: Only during active school hours
  answer: C
  explanation: The driver of any motor vehicle on the same highway in the lane occupied
    by the school bus and all lanes adjacent to the lane occupied by the school bus
    shall stop before reaching the school bus.
- id: 248
  category: penalties_and_points
  question: What is the potential fine for failing to stop for a school bus with flashing
    red lights?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Failure to comply with the law regarding stopping for a school bus
    (291C-95, HRS) can cost you $1,000.
- id: 249
  category: sharing_the_road
  question: Are vehicles travelling in the opposite direction on a divided highway
    required to stop for a school bus?
  choices:
    A: Yes, all traffic must stop for a school bus
    B: No, they are not required to stop
    C: Yes, but only if children are actively crossing the street
    D: No, unless the bus driver uses a hand signal to stop them
  answer: B
  explanation: Vehicles proceeding in the opposite direction on a divided highway
    (two roadways separated by a strip of land or space) are not required to stop
    for a school bus.
- id: 250
  category: sharing_the_road
  question: How much space should a motorist maintain when passing a bicyclist?
  choices:
    A: At least 1 foot
    B: At least 2 feet
    C: At least 3 feet
    D: At least 5 feet
  answer: C
  explanation: Motorists should maintain at least 3 feet of space between the bicyclist
    and their vehicle until they have safely passed.
- id: 251
  category: sharing_the_road
  question: Approximately what percentage of bicycle-car crashes are caused by bicyclists
    riding the wrong way against traffic?
  choices:
    A: 10%
    B: 25%
    C: 50%
    D: 75%
  answer: B
  explanation: Although it is illegal to ride against traffic, many inexperienced
    bicyclists ride this way, which leads to approximately 25% of all bicycle-car
    crashes.
- id: 252
  category: sharing_the_road
  question: When is a bicyclist legally allowed to move out of the right-hand edge
    of the roadway and into the travel lane?
  choices:
    A: When preparing to make a left turn or avoiding an obstacle
    B: When they want to ride side-by-side with a motor vehicle
    C: When riding slower than the normal speed of traffic
    D: Bicyclists must always stay on the right edge without exception
  answer: A
  explanation: Exceptions when a bicyclist may move into the lane include preparing
    to make a left turn, passing another bicycle, or avoiding an obstacle in the edge
    of the road.
- id: 253
  category: sharing_the_road
  question: Under what conditions are bicyclists allowed to ride two abreast?
  choices:
    A: At all times on the roadway
    B: On a bicycle lane or path if it is wide enough not to impede traffic
    C: Only when passing another motor vehicle
    D: They are never allowed to ride two abreast
  answer: B
  explanation: On the roadway, bicyclists must ride single file. They may ride two
    abreast on a bicycle lane or path if it is wide enough not to impede traffic.
- id: 254
  category: vehicle_information
  question: What equipment is legally required for a bicycle when riding at night?
  choices:
    A: A headlight and a rear reflector
    B: A rear light and pedal reflectors
    C: A reflective safety vest
    D: A horn and a headlight
  answer: A
  explanation: If you ride at night you must have a headlight and rear reflector.
    A rear light and pedal reflectors are only recommended.
- id: 255
  category: sharing_the_road
  question: Under what conditions may a bicyclist ride on a sidewalk outside of a
    business district?
  choices:
    A: If they ride at 15 MPH or less
    B: If they stay at 10 MPH or less and always yield the right-of-way to pedestrians
    C: Bicycles are never allowed on sidewalks under any circumstances
    D: Only if the bicyclist is under 12 years of age
  answer: B
  explanation: In areas outside of business districts, bicyclists may ride on the
    sidewalks provided they stay at 10 MPH or less and always yield the right-of-way
    to pedestrians.
- id: 256
  category: license_system
  question: What are your driving privileges if your driver's license expires?
  choices:
    A: You may drive during a grace period of 90 days
    B: You may drive to and from work only
    C: You may drive as long as you are accompanied by a licensed driver
    D: You may not drive, but you may renew your license within a year after expiration
  answer: D
  explanation: When your driver's license expires, you may not drive but you may renew
    your driver's license within a year after the expiration following normal license
    renewal steps.
- id: 257
  category: safe_driving_rules
  question: Is it legal to stand on the travelled portion of the roadway to solicit
    a ride or guard a parking place?
  choices:
    A: Yes, if you are wearing bright colored clothing
    B: Yes, but only during daylight hours
    C: No, it is prohibited by law
    D: No, unless you are on a one-way street
  answer: C
  explanation: 'The manual states: ''Do not walk or stand upon the travelled portion
    of the roadway to solicit for any reason or to guard a vehicle or parking place.
    (Prohibited by law)'''
- id: 258
  category: vehicle_information
  question: Where should a copy of your vehicle inspection certificate be kept?
  choices:
    A: Filed with your State income tax return
    B: In a safe place in your home
    C: In the vehicle
    D: At the County Department of Finance
  answer: C
  explanation: According to the manual, a copy of the vehicle inspection certificate
    should be kept in the vehicle.
- id: 259
  category: driver_responsibility
  question: Who is responsible for the mechanical condition of a vehicle?
  choices:
    A: The garage mechanic
    B: The vehicle driver and registered owner of the vehicle
    C: The legal owner of the vehicle only
    D: The insurance company
  answer: B
  explanation: The mechanical condition of the vehicle is the responsibility of both
    the vehicle driver and the registered owner of the vehicle.
- id: 260
  category: safe_driving_rules
  question: Why is a leaky exhaust system in your vehicle dangerous?
  choices:
    A: It can cause carbon monoxide poisoning.
    B: It causes a loss of hearing.
    C: It leads to poor engine performance.
    D: It increases noise pollution.
  answer: A
  explanation: A leaky exhaust system in your vehicle is dangerous because it can
    cause carbon monoxide poisoning.
- id: 261
  category: license_system
  question: What must you do if you change your address from the one shown on your
    vehicle registration certificate?
  choices:
    A: Notify the County Department of Finance within 30 days after the change.
    B: Notify the County Department of Finance only when renewing the license.
    C: Make the change only when selling or trading the car.
    D: You do not have to do anything.
  answer: A
  explanation: When you as a registered owner of a vehicle change your address, you
    must notify the County Department of Finance within 30 days after the change.
- id: 262
  category: defensive_driving
  question: If you are angry or upset before getting into your car to drive home,
    what should you do?
  choices:
    A: Play the radio loud so you won't think about it.
    B: Drive fast on the Interstate so you can let off steam.
    C: Stop in at your favorite bar and have a few drinks before driving.
    D: Take a few minutes to cool off before you drive home.
  answer: D
  explanation: If you are angry, you should take a few minutes to cool off before
    you drive home to ensure you are in the right state of mind to operate a vehicle
    safely.
- id: 263
  category: signs_and_signals
  question: What should you do if a police officer directing traffic directs you to
    go through a red light?
  choices:
    A: Stop, and then go.
    B: Wait for the green light.
    C: Go on as directed.
    D: Make a right turn instead.
  answer: C
  explanation: If a police officer directing traffic directs you to go through a red
    light, you must go on as directed.
- id: 264
  category: sharing_the_road
  question: 'When driving on a narrow road and meeting an oncoming vehicle, you must:'
  choices:
    A: Pull completely off the road and stop.
    B: Allow the on-coming vehicle at least one-half of the main travelled portion
      of the road.
    C: Make the other vehicle pull over as you were there first.
    D: Turn on your headlights to make sure the other vehicle sees you.
  answer: B
  explanation: You are required to allow an on-coming vehicle at least one-half of
    the main travelled portion of the road when driving on a narrow road.
- id: 265
  category: safe_driving_rules
  question: When turning or changing lanes, when must you signal your intentions?
  choices:
    A: Only if there is traffic visible.
    B: Only when driving at night.
    C: Always signal your intentions even when there is no traffic visible.
    D: Only when driving in traffic at night.
  answer: C
  explanation: When turning or changing lanes, you must always signal your intentions
    even when there is no traffic visible.
- id: 266
  category: signs_and_signals
  question: What should you do when approaching a railroad crossing with flashing
    signals?
  choices:
    A: Slow down and look for a train.
    B: Stop and look for a train.
    C: Look for a train, then speed up.
    D: Do what the approaching vehicle does.
  answer: B
  explanation: When you are coming to a railroad crossing and the crossing signals
    are flashing, you should stop and look for a train.
- id: 267
  category: safe_driving_rules
  question: Which of the following must you do when leaving your vehicle unattended?
  choices:
    A: Stop the engine.
    B: Lock the ignition and remove the ignition key.
    C: Set the parking brake.
    D: All of the above.
  answer: D
  explanation: When you leave your vehicle unattended, you must stop the engine, lock
    the ignition and remove the key, and set the parking brake.
- id: 268
  category: sharing_the_road
  question: 'If you are driving on the roadway and hear a siren behind you, you should:'
  choices:
    A: Stop immediately in your current lane.
    B: Speed up to get out of the way.
    C: Pull over to the right and stop.
    D: Slow down and continue driving.
  answer: C
  explanation: When you hear a siren behind you on the roadway, you should pull over
    to the right and stop to yield to the emergency vehicle.
- id: 269
  category: sharing_the_road
  question: When may you pass a school bus from the front or rear on an undivided
    roadway?
  choices:
    A: Never.
    B: When the red lamps on the school bus are flashing.
    C: When the red lamps on the school bus are not flashing.
    D: At anytime, if you go slow.
  answer: C
  explanation: You may pass a school bus from the front or rear on an undivided roadway
    only when the red lamps on the school bus are not flashing.
- id: 270
  category: sharing_the_road
  question: You are approaching an intersection and have a green light, but pedestrians
    are crossing against the red light. What should you do?
  choices:
    A: Honk your horn.
    B: Speed up and pass in front of the pedestrians.
    C: Drive close and frighten the pedestrians so they'll think twice.
    D: Stop to let the pedestrians cross safely.
  answer: D
  explanation: Even if you have a green light, if pedestrians are crossing against
    the red, you must stop to let the pedestrians cross safely.
- id: 271
  category: safe_driving_rules
  question: 'When driving into the street from any driveway, you:'
  choices:
    A: Must drive slowly so approaching vehicles and pedestrians can get out of your
      way.
    B: Must honk the horn so approaching vehicles and pedestrians can allow you room.
    C: Must stop and proceed only when there are no pedestrians or vehicles approaching.
    D: Can disregard pedestrians if there is no sidewalk.
  answer: C
  explanation: When you drive into the street from any driveway, you must stop and
    proceed only when there are no pedestrians or vehicles approaching.
- id: 272
  category: signs_and_signals
  question: 'You are stopped behind other vehicles waiting at a stop sign. When the
    intersection is clear, you:'
  choices:
    A: May proceed through the intersection without stopping again.
    B: Must stop again at the stop sign or stop line.
    C: May go through the intersection slowly without stopping if there is no other
      traffic.
    D: May follow the vehicle ahead without stopping again.
  answer: B
  explanation: If you are stopped behind other vehicles waiting at a stop sign, you
    must stop again at the stop sign or stop line once the vehicle ahead of you moves.
- id: 273
  category: signs_and_signals
  question: What type of highway signs and markings require that you must obey the
    indicated instruction?
  choices:
    A: Warning signs
    B: Guide signs
    C: Regulatory signs
    D: Information signs
  answer: C
  explanation: Certain highway signs and markings require that you must obey the indicated
    instruction. Such signs are known as regulatory signs.
- id: 274
  category: signs_and_signals
  question: What type of highway signs contain information about hazardous conditions?
  choices:
    A: Regulatory signs
    B: Warning signs
    C: Information signs
    D: Guide signs
  answer: B
  explanation: Certain highway signs and markings contain information about hazardous
    conditions. Such signs are known as warning signs.
- id: 275
  category: safe_driving_rules
  question: 'If you are turning onto a two-lane road divided by a broken yellow line,
    you immediately know that:'
  choices:
    A: You are on a one-way road.
    B: You are on a two-way road.
    C: The road is under repair.
    D: You must stay to the left of the broken yellow lines.
  answer: B
  explanation: A broken yellow line divides a two-lane road, indicating that you are
    on a two-way road with traffic moving in opposite directions.
- id: 276
  category: safe_driving_rules
  question: When driving on a highway divided by two solid yellow lines, when are
    you allowed to cross these lines?
  choices:
    A: Only to make a left turn into or from an alley, private road, or driveway.
    B: To pass other vehicles if there is no oncoming traffic.
    C: Only to make a U-turn.
    D: You may never cross these lines under any circumstances.
  answer: A
  explanation: You may cross two solid yellow lines only to make a left turn into
    or from an alley, private road, or a driveway.
- id: 277
  category: safe_driving_rules
  question: What is the purpose of white lane lines on a four-lane divided highway?
  choices:
    A: They separate lanes of traffic moving in opposite directions.
    B: They indicate pedestrian crosswalks.
    C: They separate lanes of traffic moving in the same direction.
    D: They mark the center of a two-way road.
  answer: C
  explanation: On a four-lane divided highway, white lane lines separate lanes of
    traffic moving in the same direction.
- id: 278
  category: safe_driving_rules
  question: What does a solid white line separating traffic lanes on a four-lane divided
    highway indicate?
  choices:
    A: It may be crossed at any time.
    B: It separates traffic moving in opposite directions.
    C: It may not be crossed under any circumstances.
    D: It may be crossed only in unusual circumstances and then only with great care.
  answer: D
  explanation: A solid white line separating traffic lanes moving in the same direction
    may be crossed only in unusual circumstances and then only with great care.
- id: 279
  category: signs_and_signals
  question: Where are solid white stop lines painted across traffic lanes to indicate
    the exact place to stop?
  choices:
    A: At curves and hills.
    B: At freeway on-ramps and fire stations.
    C: At intersections and pedestrian crosswalks.
    D: At churches and schools.
  answer: C
  explanation: Stop lines are solid white lines painted across the traffic lanes at
    intersections and pedestrian crosswalks indicating the exact place at which to
    stop.
- id: 280
  category: sharing_the_road
  question: When pedestrians are in a crosswalk marked by two solid white lines, who
    has the right of way?
  choices:
    A: Motor vehicles have the right of way over pedestrians.
    B: Pedestrians have the right of way over motor vehicles.
    C: No one has the right of way in a crosswalk.
    D: Pedestrians must yield to all oncoming traffic.
  answer: B
  explanation: When pedestrians are in these crosswalks, they have the right of way
    over motor vehicles.
- id: 281
  category: signs_and_signals
  question: What must you do when approaching a red traffic signal light?
  choices:
    A: Stop at the stop line.
    B: Stop before entering any crosswalk if there is no stop line.
    C: Stop before entering the intersection if there is no stop line or crosswalk.
    D: All of the above.
  answer: D
  explanation: A red traffic signal light means that you must stop at the stop line,
    before entering any crosswalk if there is no stop line, or before entering the
    intersection where there is no stop line or crosswalk.
- id: 282
  category: signs_and_signals
  question: If not prohibited by a traffic sign, what may a stopped vehicle facing
    a circular red traffic light do?
  choices:
    A: Turn right at any time without stopping.
    B: Turn right only after blowing the horn.
    C: Turn right after yielding to other traffic and pedestrians.
    D: Nothing, it is always illegal to turn right on red.
  answer: C
  explanation: A stopped vehicle facing a circular red traffic light may turn right
    after yielding to other traffic and pedestrians, if not prohibited by a traffic
    sign.
- id: 283
  category: signs_and_signals
  question: Under what condition may a stopped vehicle facing a circular red traffic
    light make a left turn?
  choices:
    A: When turning from a one-way street into another one-way street, after yielding
      to traffic and pedestrians.
    B: When there is no other traffic or pedestrians, regardless of the street type.
    C: Only when a green arrow is also illuminated.
    D: Never; left turns on red are always illegal.
  answer: A
  explanation: A stopped vehicle facing a circular red traffic light may turn left
    after yielding to pedestrians and traffic, when turning from a one-way street
    into another one-way street (if not prohibited by a traffic sign).
- id: 284
  category: signs_and_signals
  question: What does a steady circular yellow light on a traffic signal indicate?
  choices:
    A: You should speed up to beat the red light.
    B: A red light is going to be shown immediately thereafter and you should avoid
      entering the intersection if possible.
    C: You have the right of way to proceed through the intersection.
    D: Cross traffic is about to enter the intersection.
  answer: B
  explanation: A steady circular yellow light means that a red light is going to be
    shown immediately thereafter and you should avoid entering the intersection if
    possible.
- id: 285
  category: signs_and_signals
  question: What does a yellow "X" lighted over a traffic lane mean?
  choices:
    A: You may use that lane with caution.
    B: The lane is for left turns only.
    C: You may use that lane for passing only.
    D: You must move out of that lane because it is going to be used for oncoming
      traffic.
  answer: D
  explanation: A yellow "X" over the traffic lane means that you must move out of
    that lane of traffic because it is going to be used for oncoming traffic.
- id: 286
  category: alcohol_drugs_health
  question: How should drivers view the issue of people driving under the influence
    of intoxicating liquor?
  choices:
    A: It is only a problem for those who drink.
    B: It is a police enforcement problem only.
    C: It is every driver's problem whether they drink or not.
    D: It is not a significant problem in Hawaii.
  answer: C
  explanation: According to the manual, persons driving under the influence of intoxicating
    liquor are every driver's problem whether they drink or not.
- id: 287
  category: alcohol_drugs_health
  question: What is the manual's guidance regarding having a few drinks after work
    before driving home?
  choices:
    A: It is beneficial because it helps release the day's tension.
    B: It should be avoided because it may make you a dangerous driver.
    C: It is recommended if you want to wait out rush hour traffic.
    D: It is safe as long as you have a meal beforehand.
  answer: B
  explanation: A few drinks after work before driving home should be avoided because
    they may make you a dangerous driver.
- id: 288
  category: alcohol_drugs_health
  question: How does food consumption affect the absorption of alcoholic beverages?
  choices:
    A: Alcohol will affect you more rapidly on an empty stomach.
    B: Alcohol will affect you more rapidly just after eating.
    C: Food neutralizes the alcohol completely.
    D: Alcohol affects you the same way regardless of food intake.
  answer: A
  explanation: Alcoholic beverages will affect you more rapidly on an empty stomach.
- id: 289
  category: alcohol_drugs_health
  question: After alcohol has entered your blood, how can you lessen its effect?
  choices:
    A: By taking a cold shower.
    B: By drinking black coffee.
    C: By doing both A and B.
    D: There is nothing you can do to lessen the effect.
  answer: D
  explanation: Once alcohol has entered your blood, there is nothing you can do to
    lessen its effect; taking a cold shower or drinking coffee will not work.
- id: 290
  category: penalties_and_points
  question: If a police officer stops you, charges you with driving under the influence,
    and requests a blood alcohol test, what must you do?
  choices:
    A: You do not have to take the test if you haven't violated any traffic rules.
    B: You must take the test or risk losing your driver's license.
    C: You can refuse the test if you can prove you weren't drinking.
    D: You are not required to do anything.
  answer: B
  explanation: You must take the test to determine the amount of alcohol in your blood
    or risk losing your driver's license.
- id: 291
  category: penalties_and_points
  question: 'If you refuse to take a required test for blood alcohol, you may lose
    your driver''s license for twelve months:'
  choices:
    A: Only if you are convicted of driving under the influence.
    B: Only if you are convicted of a moving violation.
    C: Because you have refused to take the test.
    D: Only if you are involved in a collision.
  answer: C
  explanation: You may lose your driver's license for twelve months simply because
    you have refused to take the required blood alcohol test.
- id: 292
  category: alcohol_drugs_health
  question: Under what conditions may you drink alcoholic beverages in a vehicle on
    a public highway?
  choices:
    A: As long as you are not the one driving.
    B: Only if you are riding in the back seat.
    C: Only if you ride in the back of a pick-up truck.
    D: It is against the law to drink alcoholic beverages on a public highway.
  answer: D
  explanation: It is against the law to drink alcoholic beverages in a vehicle on
    a public highway, regardless of where you are sitting.
- id: 293
  category: alcohol_drugs_health
  question: What happens when you consume alcohol while taking drugs?
  choices:
    A: It has a less pronounced effect than either taken separately.
    B: It can have a more pronounced effect than either taken separately.
    C: It improves your driving ability by keeping you alert.
    D: It is always safe as long as the drugs are prescribed by a doctor.
  answer: B
  explanation: The consumption of alcohol while taking drugs can have a more pronounced
    effect than either taken separately.
- id: 294
  category: alcohol_drugs_health
  question: 'The effect that alcohol has on your reflexes and judgment depends primarily
    on:'
  choices:
    A: Whether you were drinking beer or wine.
    B: Whether you were drinking whiskey or hard liquor.
    C: The amount of alcohol in your blood stream.
    D: Your physical fitness level.
  answer: C
  explanation: The effect that alcohol has on your reflexes and judgment depends on
    the amount of alcohol in your blood stream, not the type of beverage.
- id: 295
  category: safe_driving_rules
  question: 'When driving, failing to turn your head to check for traffic before changing
    lanes or driving away from a curb is:'
  choices:
    A: Acceptable if you first check your rear-view mirror.
    B: A bad driving habit and many times the cause of an accident.
    C: Only dangerous when driving at night.
    D: Unnecessary if your vehicle has blind-spot monitoring.
  answer: B
  explanation: Failing to turn your head to check for traffic before changing lanes
    or exiting into traffic is a bad driving habit and many times the cause of a traffic
    accident.
- id: 296
  category: safe_driving_rules
  question: 'Signaling your intentions before turning, changing lanes, or driving
    away from a curb:'
  choices:
    A: Is necessary only if other traffic is present.
    B: Is necessary only during the maneuver, not before.
    C: Is not necessary if the maneuver is done slowly.
    D: Is a good driving habit and is required by law.
  answer: D
  explanation: Signaling your intentions before turning, changing lanes, or driving
    away from a curb is a good driving habit and is required by law.
- id: 297
  category: safe_driving_rules
  question: When driving in heavy traffic, what following distance should you maintain?
  choices:
    A: Drive close to the vehicle ahead to keep others from cutting in.
    B: Keep at least a two-second interval behind the vehicle ahead.
    C: Drive close to the vehicle ahead but be ready for a sudden stop.
    D: Maintain a one-second interval to keep traffic flowing.
  answer: B
  explanation: When driving in heavy traffic, you should keep at least a two-second
    interval behind the vehicle ahead.
- id: 298
  category: defensive_driving
  question: Which of the following behaviors is characteristic of an inattentive driver?
  choices:
    A: Daydreaming or gazing at objects off the roadway.
    B: Carrying on an eye-contact conversation with a passenger.
    C: Restricting attention to only watching the vehicle ahead.
    D: All of the above.
  answer: D
  explanation: An inattentive driver is one who daydreams, carries on eye-contact
    conversations while driving, or restricts their attention to only watching the
    vehicle ahead.
- id: 299
  category: safe_driving_rules
  question: How does increasing your vehicle's speed affect your vision?
  choices:
    A: It increases your field of vision.
    B: It decreases your field of vision.
    C: It makes it easier to see cross traffic.
    D: It has no effect on your field of vision.
  answer: B
  explanation: According to the manual, increasing your vehicle's speed decreases
    your field of vision.
- id: 300
  category: safe_driving_rules
  question: What is the rule regarding safety belts in a vehicle?
  choices:
    A: They should be worn only when driving at higher speeds.
    B: They must be worn at all times when driving or riding in a vehicle.
    C: They should be worn loosely.
    D: They need to be worn only if riding in the front seat.
  answer: B
  explanation: Safety belts are life belts and must be worn at all times when driving
    or riding in a vehicle.
- id: 301
  category: safe_driving_rules
  question: How should your seat belt be properly adjusted?
  choices:
    A: It should be loose for comfort.
    B: It should be hidden beneath the seat.
    C: It should be buckled snugly across your hip bones and lower abdomen.
    D: It should be adjusted to keep the seat belt buzzer from operating.
  answer: C
  explanation: The seat belt should be adjusted so that it is buckled snugly across
    your hip bones and lower abdomen.
- id: 302
  category: defensive_driving
  question: If you are late to work, in a hurry, and need to back into the street,
    what should you do before backing?
  choices:
    A: Honk your horn to warn others.
    B: Check for children and other objects around your car.
    C: Race your engine so that pets will get out of the way.
    D: Check for traffic only after getting in the vehicle.
  answer: B
  explanation: Before backing into the street, you must always check for children
    and other objects around your car, regardless of being in a hurry.
- id: 303
  category: safe_driving_rules
  question: When driving forward out of your driveway, what must you do before crossing
    the sidewalk area?
  choices:
    A: You must come to a complete stop.
    B: You must slow down but do not need to stop.
    C: You have the right-of-way over pedestrians.
    D: You can cross without stopping if you honk your horn.
  answer: A
  explanation: You must come to a complete stop before crossing the sidewalk area
    when driving forward out of a driveway.
- id: 304
  category: safe_driving_rules
  question: When driving on a multi-lane highway and wishing to change lanes, when
    must you signal your intentions?
  choices:
    A: Immediately before changing lanes.
    B: Only when actually changing lanes.
    C: At least 50 feet before beginning to change lanes.
    D: At least 100 feet before beginning to change lanes.
  answer: D
  explanation: Traffic regulations require that you display a turn signal for at least
    100 feet before making every turn or lane change.
- id: 305
  category: defensive_driving
  question: To avoid accidents caused by following too closely, what is the proper
    following interval?
  choices:
    A: Close enough so no one will cut in front of you.
    B: At least 2 seconds behind the vehicle ahead.
    C: Exactly 100 feet.
    D: Exactly 75 feet.
  answer: B
  explanation: The proper interval for following is found by spacing your vehicle
    at least 2 seconds behind the vehicle ahead.
- id: 306
  category: defensive_driving
  question: What should you do if you are driving and it begins to rain?
  choices:
    A: Drive faster than other traffic.
    B: Drive at least the speed limit.
    C: Slow down and allow for weather conditions.
    D: Drive close behind the vehicle ahead.
  answer: C
  explanation: When it begins to rain, you should slow down and allow for the changing
    weather conditions to maintain safety.
- id: 307
  category: safe_driving_rules
  question: You are stopped at an intersection with a green light, but the traffic
    ahead is stopped. What should you do?
  choices:
    A: Drive into the intersection as far as you can.
    B: Wait until there is space for your entire vehicle on the opposite side before
      proceeding.
    C: Honk your horn at the vehicles ahead.
    D: Drive part way into the intersection.
  answer: B
  explanation: You should wait until there is space for your entire vehicle on the
    opposite side of the intersection before proceeding to avoid blocking the intersection.
- id: 308
  category: sharing_the_road
  question: What is required when passing a motorcycle?
  choices:
    A: Give the motorcyclist the right hand part of their traffic lane.
    B: Give the motorcyclist their entire traffic lane as if their vehicle were a
      car.
    C: Pull to the left just far enough to miss the motorcyclist.
    D: Pass quickly without letting the motorcyclist know.
  answer: B
  explanation: When passing a motorcycle, you must give the motorcyclist their entire
    traffic lane as if their vehicle were a car.
- id: 309
  category: safe_driving_rules
  question: When driving at night and another vehicle is approaching, what should
    you do with your headlamps?
  choices:
    A: They should be on high beam.
    B: They should be on low beam.
    C: They should be off, and you should use your parking lights.
    D: They may be on either high or low beam.
  answer: B
  explanation: When another vehicle is approaching at night, your headlamps should
    be on low beam to avoid blinding the other driver.
- id: 310
  category: safe_driving_rules
  question: What is the proper procedure when driving on the entry on-ramp of a freeway?
  choices:
    A: Drive to the end of the ramp, stop, check for traffic, and enter.
    B: Stop immediately, check for vehicles, speed up, and enter.
    C: Check for vehicles in the near lane, adjust speed for approaching vehicles,
      signal, and enter.
    D: Always stop before entering the freeway.
  answer: C
  explanation: On a freeway entry on-ramp, you should check for vehicles in the near
    lane, adjust your speed for approaching vehicles, signal, and enter the near lane.
- id: 311
  category: safe_driving_rules
  question: What should you do if you wish to exit the freeway but have missed your
    exit ramp?
  choices:
    A: Back up on the shoulder to get to your exit ramp.
    B: Turn around and drive on the shoulder to your exit.
    C: Cut across the grass to reach your exit.
    D: Continue driving to the next exit.
  answer: D
  explanation: If you miss your freeway exit, you should never back up or turn around;
    instead, continue driving to the next exit.
- id: 312
  category: defensive_driving
  question: How should you react if you have a tire blowout while driving?
  choices:
    A: Slam on your brakes immediately.
    B: Hold your steering wheel tight, and steer to stop on the shoulder.
    C: Keep driving at the same speed.
    D: Turn on your emergency flashers and stop in the lane.
  answer: B
  explanation: In the event of a blowout, you should hold your steering wheel tight
    and steer to stop safely on the shoulder.
- id: 313
  category: defensive_driving
  question: What is the safest action to take if your wheels slip off the edge of
    the road while driving?
  choices:
    A: Jerk the steering wheel to force the vehicle back onto the pavement.
    B: Speed up and steer back onto the pavement gradually.
    C: Slam on your brakes and stop immediately.
    D: Slow down using the brakes gently, and when at a safe speed, turn the steering
      wheel to return to the pavement.
  answer: D
  explanation: If your wheels slip off the road edge, slow down using the brakes gently,
    and when at a safe speed, turn the steering wheel to return to the pavement.
- id: 314
  category: sharing_the_road
  question: Why should you give heavy trucks and buses extra room when driving?
  choices:
    A: Trucks can stop in a shorter distance than cars.
    B: Trucks require more room to maneuver and a greater distance to stop than cars.
    C: Trucks are allowed to drive faster than cars.
    D: Trucks have the right-of-way over all other vehicles.
  answer: B
  explanation: You should give heavy trucks and buses extra room because they require
    more room to maneuver and a greater distance to stop than cars.
- id: 315
  category: sharing_the_road
  question: When driving directly behind a heavy truck or bus, why must extra caution
    be taken?
  choices:
    A: The heavy truck or bus driver may not be able to see you.
    B: Your forward visibility is blocked by the truck or bus.
    C: Both A and B.
    D: Heavy trucks and buses frequently stop without warning.
  answer: C
  explanation: Extra caution must be taken because the heavy truck or bus driver may
    not be able to see you, and your forward visibility is blocked by the large vehicle.
- id: 316
  category: sharing_the_road
  question: 'When passing a large vehicle, a driver of a small vehicle must be prepared
    for:'
  choices:
    A: A loud noise.
    B: Excess air pollution.
    C: Wind gusts produced by the large vehicle.
    D: Falling vehicle parts.
  answer: C
  explanation: When passing a large vehicle, a driver of a small vehicle must be prepared
    for wind gusts produced by the large vehicle.
- id: 317
  category: vehicle_information
  question: 'When towing a trailer large enough to obstruct your inside rear-view
    mirror, you are required to:'
  choices:
    A: Have an outside rear-view mirror installed on the driver's side only.
    B: Have an outside rear-view mirror installed on the passenger side only.
    C: Have outside rear-view mirrors installed on both sides of your vehicle.
    D: Have a person in the vehicle to clear you for right turns.
  answer: C
  explanation: You are required to have outside rear-view mirrors installed on both
    sides of your vehicle if the trailer obstructs your inside rear-view mirror.
- id: 318
  category: vehicle_information
  question: 'When towing a loaded trailer weighing more than one-half of the towing
    vehicle''s weight, or 3,000 pounds or more, the trailer must be equipped with:'
  choices:
    A: Brakes only.
    B: Breakaway protection only.
    C: Hub caps.
    D: Brakes and breakaway protection.
  answer: D
  explanation: A loaded trailer weighing more than one-half of the towing vehicle's
    weight, or 3,000 pounds or more, must be equipped with both brakes and breakaway
    protection.
- id: 319
  category: safe_driving_rules
  question: 'When towing a trailer or a house trailer, you should always:'
  choices:
    A: Have someone ride in the trailer to keep the load steady.
    B: Allow only adults to ride in the trailer.
    C: Never allow anyone to ride in the trailer.
    D: Allow persons to ride in house trailers only.
  answer: C
  explanation: When towing a trailer or a house trailer, you should always never allow
    anyone to ride in the trailer.
- id: 320
  category: vehicle_information
  question: 'When towing a trailer, you must make sure that it has a safety chain
    which is securely attached to:'
  choices:
    A: The trailer hitch.
    B: The vehicle's bumper.
    C: The frame of the towing vehicle.
    D: The fail-safe latch.
  answer: C
  explanation: You must make sure that the trailer has a safety chain which is securely
    attached to the frame of the towing vehicle.
- id: 321
  category: driver_responsibility
  question: 'If you are involved in an accident and your vehicle is blocking traffic,
    you should:'
  choices:
    A: If possible, move your vehicle off of the travelled portion of the roadway.
    B: Not move your vehicle under any circumstances.
    C: Wait until the police arrive before you move your vehicle.
    D: Leave your vehicle and walk to get help.
  answer: A
  explanation: If your vehicle is blocking traffic after an accident, you should,
    if possible, move your vehicle off of the travelled portion of the roadway.
- id: 322
  category: driver_responsibility
  question: 'If you inadvertently drive your vehicle into the side of an unattended
    parked vehicle and cannot locate the owner, you must:'
  choices:
    A: Wait by the vehicle until the owner returns.
    B: Stay until the police arrive.
    C: Leave a written notice containing your name, address, and circumstances of
      the accident.
    D: Go on your way since you cannot find the owner.
  answer: C
  explanation: If you strike an unattended parked vehicle and cannot locate the owner,
    you must leave a written notice containing your name, address, and the circumstances
    of the accident.
- id: 323
  category: sharing_the_road
  question: 'As a pedestrian, you should know that:'
  choices:
    A: You should always insist on the right of way over a vehicle when in a crosswalk.
    B: You must never enter the street or crosswalk when there are vehicles approaching
      close by.
    C: You can enter a crosswalk at any time and it is the driver's responsibility
      to stop.
    D: You only have to use crosswalks when they are convenient.
  answer: B
  explanation: A pedestrian must never enter the street or crosswalk when there are
    vehicles approaching close by.
- id: 324
  category: sharing_the_road
  question: 'As a driver, you should give a bicyclist:'
  choices:
    A: The same rights and privileges as motorists.
    B: Twice as much room as you think he needs.
    C: The right of way when you are crossing bike lanes.
    D: All of the above.
  answer: D
  explanation: Drivers should give bicyclists the same rights and privileges, twice
    as much room as they think is needed, and the right of way when crossing bike
    lanes.
- id: 325
  category: signs_and_signals
  question: 'When approaching a 4-way stop sign, you must:'
  choices:
    A: Stop and yield to all traffic within the intersection.
    B: Drive through if there is no other crossing traffic without stopping.
    C: Yield only to vehicles on your right.
    D: Not stop if you are turning right.
  answer: A
  explanation: At a 4-way stop sign, you must stop and yield to all traffic within
    the intersection.
- id: 326
  category: driver_responsibility
  question: 'Hawaii law prohibits leaving a child unattended in a motor vehicle:'
  choices:
    A: For five minutes or longer.
    B: If the child is under the age of nine.
    C: By you or any adult passenger of the motor vehicle.
    D: All of the above.
  answer: D
  explanation: Hawaii law prohibits leaving a child under the age of nine unattended
    in a motor vehicle for five minutes or longer by you or any adult passenger.
- id: 327
  category: safe_driving_rules
  question: 'Safety belts are life belts. They:'
  choices:
    A: Must be worn at all times when driving or riding in a vehicle.
    B: Should be worn only when driving at high speeds.
    C: Should be worn loosely.
    D: Need to be worn only if riding in the front seat of the vehicle.
  answer: A
  explanation: Safety belts must be worn at all times when driving or riding in a
    vehicle.
- id: 328
  category: driver_responsibility
  question: What is the purpose of the access aisle next to an accessible parking
    space?
  choices:
    A: To allow for parking for emergency vehicles.
    B: To allow for the deployment of a wheelchair lift/ramp and other mobility devices
      from a vehicle parked in the accessible parking space.
    C: To allow parking space for motorcycles, mopeds, and bicycles.
    D: To allow vehicles to park temporarily while waiting for a passenger.
  answer: B
  explanation: The access aisle is designed to allow for the deployment of a wheelchair
    lift/ramp and other mobility devices from a vehicle parked in the accessible parking
    space.
- id: 331
  category: vehicle_information
  question: What are the general hours of operation for most Satellite City Hall offices
    in the City & County of Honolulu?
  choices:
    A: 8:00 a.m. to 5:00 p.m.
    B: 7:45 a.m. to 4:00 p.m.
    C: 9:00 a.m. to 5:00 p.m.
    D: 8:00 a.m. to 4:15 p.m.
  answer: B
  explanation: The general hours of operation for Satellite City Hall offices in Honolulu
    are Monday-Friday except holidays 7:45 a.m. to 4:00 p.m.
- id: 332
  category: vehicle_information
  question: Which Satellite City Hall office in Honolulu has different general hours
    of 9:00 am to 5:00 pm?
  choices:
    A: Kapolei
    B: Wahiawa
    C: Pearlridge Shopping Center
    D: Windward City Shopping Center
  answer: C
  explanation: The manual specifies that the Pearlridge Shopping Center location operates
    from 9:00 am - 5:00pm.
- id: 333
  category: vehicle_information
  question: At the Kapahulu Station Vehicle Registration Office, what time is the
    last car accepted?
  choices:
    A: 3:00 p.m.
    B: 3:30 p.m.
    C: 4:00 p.m.
    D: 4:30 p.m.
  answer: B
  explanation: For the Kapahulu Station, the manual states that the 'Last car at 3:30
    p.m.'
- id: 334
  category: vehicle_information
  question: Where is the Vehicle Registration Office located in the County of Hawaii?
  choices:
    A: '101 Pauahi Street, Suite #5, Hilo'
    B: 1000 Uluohia Street, Kapolei
    C: 335 Keawe Street, Suite 209, Lahaina
    D: 4444 Rice Street, Suite 466, Lihue
  answer: A
  explanation: 'The County of Hawaii Vehicle Registration Office is located in Hilo
    at 101 Pauahi Street, Suite #5.'
- id: 335
  category: vehicle_information
  question: Which of the following is a Vehicle Registration Office location in the
    County of Maui?
  choices:
    A: Fort Street Mall
    B: Lihue Civic Center
    C: Hannibal Tavares Community Center, Pukalani
    D: Kapalama Hale
  answer: C
  explanation: In the County of Maui, one of the listed registration offices is located
    in Pukalani at the Hannibal Tavares Community Center.
- id: 336
  category: vehicle_information
  question: What are the hours of operation for the Hana Office in the County of Maui?
  choices:
    A: 8:00 a.m. to 4:00 p.m. straight through
    B: 7:45 a.m. to 4:15 p.m.
    C: 8:00 a.m. to 10:45 a.m. & 12:00 p.m. to 3:30 p.m.
    D: 8:00 a.m. to 11:00 a.m. & 1:00 p.m. to 4:00 p.m.
