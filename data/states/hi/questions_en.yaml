metadata:
  source: 2025 Hawaii Driver's Manual
  total_questions: 259
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Hawaii, what is the minimum age an individual must reach to apply for
    an Instructional Permit?
  choices:
    A: 15 years old
    B: 15 and a half years old
    C: 16 years old
    D: 14 and a half years old
  answer: B
  explanation: According to the Hawaii Graduated Licensing Program, an applicant must
    be at least 15 1/2 years of age to obtain an instructional permit.
- id: 2
  category: license_system
  question: How long must a minor hold a Hawaii Instructional Permit before they are
    eligible to apply for a Provisional License?
  choices:
    A: 90 days
    B: 120 days
    C: 180 days
    D: One year
  answer: C
  explanation: Hawaii law requires permit holders under the age of 18 to hold their
    instructional permit for a minimum of 180 days before taking the road test for
    a provisional license.
- id: 3
  category: license_system
  question: While driving with a Hawaii Instructional Permit, the supervising driver
    must be at least how many years of age?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: B
  explanation: The person occupying the seat beside the permit holder must be at least
    21 years of age and licensed to operate that type of vehicle.
- id: 4
  category: license_system
  question: Under Hawaii's GDL law, a Provisional License holder is generally restricted
    from driving between what hours?
  choices:
    A: 10:00 PM and 4:00 AM
    B: 11:00 PM and 5:00 AM
    C: Midnight and 6:00 AM
    D: 9:00 PM and 6:00 AM
  answer: B
  explanation: Provisional license holders may not drive between 11:00 PM and 5:00
    AM unless accompanied by a parent or guardian, or for specific work/school reasons
    with documentation.
- id: 5
  category: license_system
  question: A Hawaii Provisional License holder may transport how many passengers
    under the age of 18 who are not household members?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: The provisional license restricts the driver to carrying only one passenger
    under the age of 18 who is not a household member, unless accompanied by a parent
    or guardian.
- id: 6
  category: license_system
  question: What is the minimum age to obtain a full, unrestricted Hawaii Driver's
    License?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: A driver may obtain a full license at age 17, provided they have held
    a provisional license for at least six months and have had no pending violations
    or convictions.
- id: 7
  category: license_system
  question: If you change your address in Hawaii, you must notify the driver licensing
    center in writing within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Hawaii state law requires all licensed drivers to notify the examiner
    of drivers of any change in residence or name within 30 days.
- id: 8
  category: license_system
  question: For a driver between the ages of 25 and 71, a Hawaii Driver's License
    is typically valid for how many years?
  choices:
    A: 2 years
    B: 4 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: In Hawaii, drivers between the ages of 25 and 71 are issued licenses
    that expire eight years after the date of issuance.
- id: 9
  category: license_system
  question: If a provisional license holder in Hawaii is convicted of a first-time
    moving violation, the license will be suspended for how long?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: Under Hawaii's GDL laws, a first conviction for a moving violation
    results in a 90-day suspension of the provisional license.
- id: 10
  category: license_system
  question: 'To comply with Hawaii''s ''Legal Presence'' requirements for a Real ID
    license, an applicant must provide proof of:'
  choices:
    A: Voter registration
    B: A valid Hawaii bank account
    C: U.S. Citizenship or legal authorization to be in the U.S.
    D: Employment in the state of Hawaii
  answer: C
  explanation: Legal Presence means that a person is either a U.S. citizen or is legally
    authorized to be in the United States; this is required for a Hawaii driver's
    license.
- id: 11
  category: license_system
  question: A Hawaii Instructional Permit is valid for a period of how long from the
    date of issuance?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Until the applicant turns 18
  answer: B
  explanation: A Hawaii Instructional Permit is valid for one year and may be renewed
    for another year if it has not expired for more than 90 days.
- id: 12
  category: license_system
  question: Which of the following is NOT a requirement to move from a Provisional
    License to a Full License in Hawaii?
  choices:
    A: Must be at least 17 years old
    B: Must have held the provisional license for at least 6 months
    C: Must have no pending violations or convictions
    D: Must retake the written knowledge test
  answer: D
  explanation: You do not need to retake the written knowledge test to convert a provisional
    license to a full license, provided you meet the age and clean-record requirements.
- id: 13
  category: license_system
  question: In Hawaii, if you are under 18 and applying for a permit, who must sign
    your application?
  choices:
    A: Only the applicant
    B: Both parents (if living and having custody)
    C: Any adult over 21
    D: A school principal
  answer: B
  explanation: Hawaii law requires both parents to sign the application for a minor,
    unless one parent has exclusive custody or is deceased.
- id: 14
  category: license_system
  question: What is the maximum blood alcohol concentration (BAC) limit for a driver
    under the age of 21 in Hawaii?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: Hawaii has a 'Zero Tolerance' law for minors, which sets the BAC limit
    at 0.02% for drivers under 21.
- id: 15
  category: license_system
  question: When applying for a Hawaii driver's license, how many documents are required
    to prove Hawaii residency?
  choices:
    A: One
    B: Two
    C: Three
    D: None, if you have a passport
  answer: B
  explanation: To meet federal Real ID requirements, Hawaii requires two separate
    documents to prove physical residency in the state.
- id: 16
  category: license_system
  question: To meet the minimum vision requirements for a Hawaii driver's license,
    an applicant must have at least what visual acuity in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: In Hawaii, applicants must have a distant visual acuity of at least
    20/40 in at least one eye, with or without corrective lenses.
- id: 17
  category: license_system
  question: How many months before your Hawaii driver's license expires are you permitted
    to renew it?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Hawaii law allows drivers to renew their licenses up to six months
    before the expiration date.
- id: 18
  category: license_system
  question: 'Under Hawaii''s GDL law, a Provisional License holder may drive between
    11:00 p.m. and 5:00 a.m. only if they are accompanied by a parent or guardian,
    OR if they possess:'
  choices:
    A: A signed statement from an employer or school official for work or school-related
      activities
    B: A notarized letter from a friend over the age of 21
    C: A valid student ID card
    D: There are no exceptions to the nighttime driving restriction
  answer: A
  explanation: Provisional licensees may drive during restricted hours for employment
    or school-authorized activities if they carry a signed statement from the employer
    or school official.
- id: 19
  category: license_system
  question: 'A standard Hawaii driver''s license for operating passenger vehicles
    (under 18,000 lbs GVWR) is classified as a:'
  choices:
    A: Class 1 license
    B: Class 2 license
    C: Class 3 license
    D: Class 4 license
  answer: C
  explanation: In Hawaii, a Class 3 license is the standard category required to operate
    most passenger vehicles and trucks weighing less than 18,000 pounds.
- id: 20
  category: license_system
  question: If you move to Hawaii and possess a valid out-of-state driver's license,
    you must generally apply for a Hawaii license within how many days of establishing
    residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents in Hawaii must transfer their out-of-state driver's license
    to a Hawaii license within 30 days of establishing residency.
- id: 21
  category: license_system
  question: When taking the Hawaii practical road test, which of the following documents
    must be presented for the vehicle being used?
  choices:
    A: Only the vehicle's title
    B: A valid registration and a current safety inspection certificate
    C: The owner's manual
    D: A letter of permission from the dealer
  answer: B
  explanation: The vehicle used for the road test must have a valid motor vehicle
    registration and a current Hawaii safety inspection certificate and sticker.
- id: 22
  category: license_system
  question: 'If a Hawaii driver is convicted of driving without a valid motor vehicle
    insurance policy for the first time, their license may be suspended for:'
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 1 year
  answer: B
  explanation: Under Hawaii law, a first-time conviction for driving without insurance
    results in a 3-month license suspension (or until proof of insurance is provided).
- id: 23
  category: license_system
  question: 'In Hawaii, if you legally change your name through marriage or court
    order, you must notify the driver licensing office and apply for a duplicate license
    within:'
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: Drivers must notify the licensing agency of a legal name change and
    obtain a corrected license within 30 days.
- id: 24
  category: license_system
  question: What is the minimum age to apply for a Class 2 (Motorcycle) Instructional
    Permit in Hawaii?
  choices:
    A: 15 years old
    B: 15 and a half years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: The minimum age to apply for a motorcycle (Class 2) instructional permit
    in Hawaii is 15 and a half, the same as for a Class 3 permit.
- id: 25
  category: license_system
  question: 'If your Hawaii driver''s license is lost or stolen, you should immediately:'
  choices:
    A: Wait until it expires to get a new one
    B: Apply for a duplicate license at a driver licensing center
    C: Continue driving as long as you have a photo of it
    D: Call the police to have them issue a temporary permit
  answer: B
  explanation: If a license is lost or stolen, the driver must apply for a duplicate
    license at a licensing center and pay the required fee to remain legally authorized
    to drive.
- id: 26
  category: license_system
  question: Which of the following is a requirement for a Hawaii Instructional Permit
    holder to operate a motorcycle (Class 2) at night?
  choices:
    A: They must have a supervisor on a second motorcycle
    B: They must wear reflective gear
    C: They are prohibited from operating a motorcycle at night
    D: They must have at least 10 hours of night practice
  answer: C
  explanation: Hawaii motorcycle permit holders are restricted from carrying passengers
    and from operating a motorcycle during nighttime hours.
- id: 27
  category: license_system
  question: 'In Hawaii, a driver''s license for individuals aged 72 or older is valid
    for a period of:'
  choices:
    A: 1 year
    B: 2 years
    C: 4 years
    D: 8 years
  answer: B
  explanation: While licenses for younger adults are valid for 8 years, Hawaii requires
    drivers aged 72 and older to renew their licenses every 2 years.
- id: 28
  category: license_system
  question: 'To apply for a Commercial Driver''s License (CDL) in Hawaii to operate
    a vehicle in intrastate commerce, an applicant must be at least:'
  choices:
    A: 18 years old
    B: 19 years old
    C: 21 years old
    D: 25 years old
  answer: A
  explanation: The minimum age for a CDL for intrastate (within Hawaii only) operation
    is 18, though 21 is required for interstate commerce or hazardous materials.
- id: 29
  category: license_system
  question: Which of the following is NOT a valid reason for the Hawaii DMV to refuse
    to issue or renew a driver's license?
  choices:
    A: Failure to pay outstanding traffic fines
    B: Failure to provide a Social Security Number
    C: Failure to have a high school diploma
    D: Failure to pass the required vision test
  answer: C
  explanation: A high school diploma is not a requirement for a driver's license in
    Hawaii, whereas vision, SSN verification, and clearing traffic fines are required.
- id: 30
  category: driver_testing
  question: When arriving for your Hawaii road test, which of the following documents
    MUST be current and present in the vehicle?
  choices:
    A: The vehicle's title and bill of sale
    B: The vehicle's registration and Hawaii motor vehicle insurance card
    C: The vehicle's original factory window sticker
    D: A notarized letter from the vehicle owner
  answer: B
  explanation: According to the Hawaii Driver's Manual, you must present a valid registration
    and a valid Hawaii motor vehicle insurance card for the vehicle being used for
    the road test.
- id: 31
  category: driver_testing
  question: In addition to registration and insurance, what other certificate must
    be valid and displayed on the vehicle during a Hawaii road test?
  choices:
    A: Emissions certificate
    B: Weight tax certificate
    C: Safety inspection certificate
    D: County parking permit
  answer: C
  explanation: Hawaii law requires all vehicles to have a valid safety inspection
    certificate (sticker) displayed on the rear bumper or frame to be legal for operation
    and road testing.
- id: 32
  category: driver_testing
  question: Under Hawaii law, what is the minimum liability insurance coverage required
    for bodily injury to one person in any one accident?
  choices:
    A: $10,000
    B: $20,000
    C: $40,000
    D: $50,000
  answer: B
  explanation: Hawaii Revised Statutes §431:10C-301 requires a minimum of $20,000
    per person for bodily injury liability.
- id: 33
  category: driver_testing
  question: For most passenger vehicles in Hawaii, how often must a safety inspection
    be performed?
  choices:
    A: Every 6 months
    B: Every 12 months
    C: Every 24 months
    D: Only when the vehicle is sold
  answer: B
  explanation: In Hawaii, most vehicles are required to undergo a safety inspection
    every 12 months (annually).
- id: 34
  category: driver_testing
  question: Under Hawaii's 'Implied Consent' law, what happens if you refuse to take
    a chemical test for alcohol or drugs when requested by an officer?
  choices:
    A: Your license will be revoked for at least one year
    B: You will be fined $50 and released
    C: You will only receive a warning for the first refusal
    D: Your vehicle will be permanently impounded
  answer: A
  explanation: Hawaii's Implied Consent law (HRS §291E-15) states that by driving
    on Hawaii roads, you consent to testing. Refusal results in a mandatory license
    revocation, typically for one year for a first offense.
- id: 35
  category: driver_testing
  question: Hawaii's 'Move Over Law' requires drivers to do what when approaching
    a stationary emergency vehicle with flashing lights?
  choices:
    A: Stop completely in the middle of the lane
    B: Speed up to pass the vehicle quickly
    C: Slow down and, if safe, vacate the lane next to the emergency vehicle
    D: Turn on hazard lights and maintain current speed
  answer: C
  explanation: HRS §291C-27 requires drivers to slow down to a reasonable speed and
    move over to an adjacent lane if it is safe to do so when approaching emergency
    vehicles.
- id: 36
  category: driver_testing
  question: According to Hawaii's updated child passenger safety law, children under
    what age must be properly restrained in a rear-facing car seat?
  choices:
    A: Under 1 year old
    B: Under 2 years old
    C: Under 4 years old
    D: Under 5 years old
  answer: B
  explanation: As of 2022, Hawaii law (HRS §291-11.5) requires children under two
    years of age to be properly restrained in a rear-facing child passenger restraint
    system.
- id: 37
  category: driver_testing
  question: In Hawaii, who is required to wear a seat belt while the vehicle is in
    motion?
  choices:
    A: Only the driver and front-seat passengers
    B: Only passengers under the age of 18
    C: The driver and all passengers in both the front and back seats
    D: Only the driver
  answer: C
  explanation: Hawaii law (HRS §291-11.6) requires the driver and all passengers in
    the front and back seats to be restrained by a seat belt assembly.
- id: 38
  category: driver_testing
  question: 'Using a mobile electronic device while driving in Hawaii (unless using
    hands-free technology) is:'
  choices:
    A: Legal if you are at a red light
    B: Illegal and subject to a fine
    C: Legal for texting but not for calling
    D: Only illegal for drivers under 18
  answer: B
  explanation: Hawaii Revised Statutes §291C-137 prohibits the use of mobile electronic
    devices while operating a vehicle, including while stopped at a red light or stop
    sign.
- id: 39
  category: driver_testing
  question: 'In Hawaii, when a school bus is stopped with its red signal lights flashing,
    drivers must:'
  choices:
    A: Stop from either direction unless on a divided highway
    B: Only stop if they are behind the bus
    C: Slow down to 10 mph and pass carefully
    D: Stop only if there are children currently crossing
  answer: A
  explanation: Under HRS §291C-95, drivers traveling in both directions must stop
    for a school bus with flashing red lights, except when traveling on a divided
    highway in the opposite direction.
- id: 40
  category: driver_testing
  question: What is the definition of 'Excessive Speeding' in Hawaii, which carries
    harsher penalties than a standard speeding ticket?
  choices:
    A: 5 mph over the limit
    B: 15 mph over the limit
    C: 30 mph or more over the speed limit, or over 80 mph regardless of the limit
    D: Any speed over 55 mph
  answer: C
  explanation: HRS §291C-105 defines excessive speeding as driving 30 mph or more
    over the speed limit or exceeding 80 mph.
- id: 41
  category: driver_testing
  question: When can you legally turn right on a red light in Hawaii?
  choices:
    A: Never
    B: Only if there is no 'No Turn on Red' sign and you have come to a complete stop
      and yielded to traffic/pedestrians
    C: Only during daylight hours
    D: At any time without stopping as long as no cars are coming
  answer: B
  explanation: In Hawaii, right turns on red are permitted after a complete stop and
    yielding to traffic and pedestrians, provided no sign prohibits the turn.
- id: 42
  category: driver_testing
  question: 'In Hawaii, vehicle registration must be renewed:'
  choices:
    A: Every two years
    B: Every five years
    C: Annually (every year)
    D: Only when the title changes hands
  answer: C
  explanation: Vehicle registrations in the State of Hawaii must be renewed every
    year.
- id: 43
  category: driver_testing
  question: During the Hawaii road test, which of the following is grounds for immediate
    failure?
  choices:
    A: Failing to use a turn signal once
    B: Adjusting your mirrors before starting
    C: An action that requires the examiner to intervene to prevent an accident
    D: Driving exactly the speed limit
  answer: C
  explanation: According to the Hawaii Driver's Manual, any dangerous action or incident
    that requires the examiner to take control of the vehicle or intervene to avoid
    a collision results in immediate failure.
- id: 44
  category: driver_testing
  question: When appearing for the Hawaii road test, which document must be presented
    for the vehicle in addition to a valid motor vehicle insurance card?
  choices:
    A: The vehicle's original title
    B: A valid certificate of inspection and a valid registration certificate
    C: A notarized letter from the vehicle owner
    D: The vehicle's bill of sale
  answer: B
  explanation: To take the road test in Hawaii, the vehicle must have a valid safety
    inspection certificate (sticker and paper) and a valid motor vehicle registration
    certificate.
- id: 45
  category: driver_testing
  question: In Hawaii, a driver is considered to be driving under the influence (DUI)
    if their Blood Alcohol Concentration (BAC) is at or above what level?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: According to Hawaii Revised Statutes §291E-61, it is unlawful for a
    person 21 years or older to operate a vehicle with a BAC of 0.08% or higher.
- id: 46
  category: driver_testing
  question: Hawaii's 'Move Over' law requires drivers to slow down and, if safe, move
    to a non-adjacent lane when approaching which of the following stopped on a highway?
  choices:
    A: Only police cars with flashing lights
    B: Only ambulances and fire trucks
    C: Any emergency vehicle with flashing lights, including tow trucks and hazard
      vehicles
    D: Any vehicle with its hazard lights on
  answer: C
  explanation: Hawaii Revised Statutes §291C-27 requires drivers to vacate the lane
    closest to stationary emergency vehicles, including police, fire, first aid, and
    tow trucks, or slow to a safe speed if moving over is not possible.
- id: 47
  category: driver_testing
  question: Under Hawaii's updated child passenger restraint law, children under what
    age are required to use a child safety seat or booster seat?
  choices:
    A: 5 years old
    B: 7 years old
    C: 10 years old
    D: 12 years old
  answer: C
  explanation: As of 2022, Hawaii law requires children under 10 years of age to be
    properly restrained in a child passenger restraint system or booster seat.
- id: 48
  category: driver_testing
  question: In Hawaii, what is the standard fine for a first-time violation of the
    law prohibiting the use of a mobile electronic device while driving?
  choices:
    A: $50
    B: $150
    C: $250
    D: $500
  answer: C
  explanation: Under Hawaii Revised Statutes §291C-137, the fine for using a handheld
    mobile electronic device while driving is $250, which increases to $300 if the
    violation occurs in a school zone or construction area.
- id: 49
  category: driver_testing
  question: What is the minimum amount of property damage liability insurance required
    for a motor vehicle in the state of Hawaii?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $25,000
  answer: B
  explanation: Hawaii is a no-fault state. The minimum liability requirements include
    $20,000 per person for bodily injury, $40,000 per accident for bodily injury,
    and $10,000 for property damage.
- id: 50
  category: driver_testing
  question: When you intend to turn, Hawaii law requires you to signal continuously
    for at least how many feet before reaching the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: According to the Hawaii Driver's Manual, you must give a continuous
    signal for at least 100 feet before you turn or change lanes.
- id: 51
  category: driver_testing
  question: 'To maintain a safe following distance in Hawaii under normal driving
    conditions, you should use the:'
  choices:
    A: One-car-length rule
    B: Two-second rule
    C: Five-second rule
    D: Ten-foot rule
  answer: B
  explanation: The Hawaii Driver's Manual recommends the 'two-second rule' to maintain
    a safe following distance behind the vehicle in front of you.
- id: 52
  category: driver_testing
  question: 'Hawaii''s ''Implied Consent'' law means that by driving on Hawaii roads,
    you have given consent to:'
  choices:
    A: A search of your vehicle at any time
    B: A chemical test of your breath, blood, or urine for alcohol or drugs
    C: The impoundment of your vehicle for any traffic ticket
    D: A review of your cell phone records by police
  answer: B
  explanation: Under Hawaii's Implied Consent law, any person who operates a vehicle
    is deemed to have given consent to a test of their breath, blood, or urine to
    determine alcohol or drug content if arrested for DUI.
- id: 53
  category: driver_testing
  question: 'In Hawaii, when a pedestrian is in a crosswalk on your half of the roadway,
    you must:'
  choices:
    A: Slow down and proceed with caution
    B: Honk to warn the pedestrian
    C: Stop and remain stopped until the pedestrian has passed your lane
    D: Only stop if there is a crossing guard present
  answer: C
  explanation: Hawaii law requires drivers to stop and stay stopped for pedestrians
    in a crosswalk when the pedestrian is on the half of the roadway upon which the
    vehicle is traveling or approaching so closely as to be in danger.
- id: 54
  category: driver_testing
  question: 'For a first DUI conviction in Hawaii, an adult driver''s license is typically
    revoked for a period of:'
  choices:
    A: 30 days
    B: 90 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: For a first-time DUI offense in Hawaii, the administrative revocation
    of a driver's license is generally for a period of one year.
- id: 55
  category: driver_testing
  question: 'When a school bus is stopped on a two-way highway with its red lights
    flashing and stop arm extended, drivers traveling in the opposite direction must:'
  choices:
    A: Continue at the speed limit
    B: Slow down to 10 mph
    C: Stop until the red lights stop flashing and the stop arm is retracted
    D: Stop only if there are children currently crossing
  answer: C
  explanation: In Hawaii, drivers traveling in both directions on a two-way road must
    stop for a school bus with flashing red lights. You do not need to stop if you
    are on the opposite side of a divided highway.
- id: 56
  category: driver_testing
  question: 'In Hawaii, you may turn right on a red light after a complete stop UNLESS:'
  choices:
    A: It is between the hours of 11:00 PM and 5:00 AM
    B: There is a sign prohibited 'Right Turn on Red'
    C: You are in a residential district
    D: You have a passenger under 18 in the car
  answer: B
  explanation: Hawaii law allows a right turn on red after a complete stop and yielding
    to traffic/pedestrians, provided there is no sign prohibiting the turn.
- id: 57
  category: driver_testing
  question: In Hawaii, it is illegal to park a vehicle within how many feet of a fire
    hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: According to Hawaii traffic laws, you are prohibited from parking within
    10 feet of a fire hydrant.
- id: 58
  category: driver_testing
  question: 'When driving at night in Hawaii, you must dim your high-beam headlights
    when an oncoming vehicle is within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: The Hawaii Driver's Manual states you must dim your high beams when
    an oncoming vehicle is within 500 feet to avoid blinding the other driver.
- id: 59
  category: driver_responsibility
  question: 'Under Hawaii law, you must immediately notify the police if you are involved
    in an accident resulting in property damage to any one person''s property in excess
    of:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $3,000
  answer: D
  explanation: Hawaii Revised Statutes require drivers to report accidents to the
    police if there is an injury, death, or property damage exceeding $3,000.
- id: 60
  category: driver_responsibility
  question: 'For a first-time conviction of driving without valid motor vehicle insurance
    in Hawaii, the minimum fine is generally:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: A first-time offense for driving without insurance in Hawaii carries
    a minimum fine of $500, though the court may grant community service in lieu of
    the fine in some cases.
- id: 61
  category: driver_responsibility
  question: Hawaii is a 'no-fault' insurance state. What does 'Personal Injury Protection'
    (PIP) coverage primarily pay for?
  choices:
    A: Damage to the other driver's vehicle
    B: Theft of your vehicle
    C: Medical and hospital expenses for you and your passengers regardless of who
      is at fault
    D: Legal fees if you are sued for a traffic violation
  answer: C
  explanation: In Hawaii's no-fault system, PIP coverage pays for medical and rehabilitative
    expenses for the driver and passengers up to the policy limit, regardless of who
    caused the accident.
- id: 62
  category: driver_responsibility
  question: Where must the motor vehicle insurance identification card be kept while
    operating a vehicle in Hawaii?
  choices:
    A: At the driver's residence
    B: In the driver's wallet/purse at all times
    C: In the vehicle at all times
    D: In the office of the insurance agent
  answer: C
  explanation: Hawaii law requires that a valid motor vehicle insurance identification
    card be kept in the vehicle at all times while it is being operated.
- id: 63
  category: driver_responsibility
  question: 'To renew your vehicle registration in Hawaii, you must provide proof
    of a valid:'
  choices:
    A: Voter registration
    B: Safety inspection certificate
    C: Employment in Hawaii
    D: Notarized bill of sale
  answer: B
  explanation: A current safety inspection certificate is a prerequisite for renewing
    a vehicle's registration in the State of Hawaii.
- id: 64
  category: driver_responsibility
  question: If you bring a vehicle into Hawaii from out-of-state, you must register
    it within how many days of its arrival?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents or owners bringing vehicles into Hawaii must register
    the vehicle within 30 days of arrival in the state.
- id: 65
  category: driver_responsibility
  question: When a vehicle is sold in Hawaii, the transfer of ownership must be recorded
    with the county motor vehicle office within how many days?
  choices:
    A: 5 days
    B: 10 days
    C: 20 days
    D: 30 days
  answer: B
  explanation: The transferor (seller) must notify the county within 10 days, and
    the transferee (buyer) must complete the transfer within 10 days to avoid late
    fees.
- id: 66
  category: driver_responsibility
  question: 'In Hawaii, the minimum required Personal Injury Protection (PIP) coverage
    amount is:'
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $50,000
  answer: B
  explanation: Hawaii law mandates a minimum of $10,000 in Personal Injury Protection
    (PIP) benefits per person.
- id: 67
  category: driver_responsibility
  question: 'If you are convicted of a second offense for driving without insurance
    within a five-year period in Hawaii, the fine increases to at least:'
  choices:
    A: $750
    B: $1,000
    C: $1,500
    D: $3,000
  answer: C
  explanation: For a second or subsequent insurance violation within five years, the
    fine in Hawaii increases to a minimum of $1,500.
- id: 68
  category: driver_responsibility
  question: 'If you strike an unattended vehicle and cannot find the owner, Hawaii
    law requires you to:'
  choices:
    A: Wait for at least 4 hours for the owner to return
    B: Leave a note with your name, address, and vehicle information in a conspicuous
      place
    C: Drive away if the damage appears to be less than $500
    D: Only report it if the other vehicle is a luxury car
  answer: B
  explanation: If the owner of an unattended vehicle or property cannot be located,
    you must leave a written notice providing your contact information and the circumstances
    of the accident.
- id: 69
  category: driver_responsibility
  question: In Hawaii, which document serves as the primary proof of legal ownership
    of a vehicle?
  choices:
    A: The Registration Certificate
    B: The Safety Inspection Slip
    C: The Certificate of Title
    D: The Insurance Identification Card
  answer: C
  explanation: The Certificate of Title (often called the 'pink slip' or 'blue slip'
    depending on the county) is the legal document proving ownership of the vehicle.
- id: 70
  category: driver_responsibility
  question: 'Under Hawaii''s ''No-Fault'' insurance law, Personal Injury Protection
    (PIP) benefits are primarily used to pay for:'
  choices:
    A: Damage to your own vehicle regardless of who is at fault
    B: Damage to the other driver's vehicle
    C: Medical and rehabilitative expenses for you and your passengers
    D: Stolen vehicle recovery costs
  answer: C
  explanation: Hawaii is a no-fault state, meaning your own insurance (PIP) pays for
    your medical expenses and those of your passengers up to the policy limit, regardless
    of who caused the accident.
- id: 71
  category: driver_responsibility
  question: How often must most passenger vehicles in Hawaii undergo a safety inspection
    (Periodic Motor Vehicle Inspection)?
  choices:
    A: Every 6 months
    B: Every 12 months
    C: Every 24 months
    D: Only when the vehicle is sold
  answer: B
  explanation: Most passenger vehicles in Hawaii are required to pass a safety inspection
    every 12 months to remain legally registered.
- id: 72
  category: driver_responsibility
  question: In Hawaii, a driver can be charged with 'Excessive Speeding' if they are
    caught driving at what speed?
  choices:
    A: 15 mph over the limit
    B: 20 mph over the limit
    C: 30 mph over the limit or more than 80 mph
    D: Any speed over 65 mph
  answer: C
  explanation: Excessive Speeding in Hawaii is defined as traveling 30 mph or more
    over the speed limit OR exceeding 80 mph regardless of the posted limit.
- id: 73
  category: driver_responsibility
  question: Where must the Hawaii safety inspection (PMVI) sticker be displayed on
    a passenger vehicle?
  choices:
    A: On the front windshield, lower left corner
    B: On the front windshield, behind the rearview mirror
    C: On the rear bumper or a bracket on the right side of the rear of the vehicle
    D: On the driver's side door jamb
  answer: C
  explanation: Hawaii law requires the safety inspection sticker to be affixed to
    the right side of the rear bumper or on a special bracket attached to the right
    side of the rear of the vehicle.
- id: 74
  category: driver_responsibility
  question: Under Hawaii's Open Container Law, it is illegal to possess an open container
    of alcohol in which part of the vehicle?
  choices:
    A: Only the driver's seat
    B: Only the front passenger seat
    C: The passenger area, including the glove compartment
    D: The trunk or behind the last upright seat of a vehicle without a trunk
  answer: C
  explanation: It is illegal to possess an open alcohol container in the passenger
    area of any motor vehicle upon a public highway. This includes the glove compartment
    or any area reachable by the driver or passengers.
- id: 75
  category: driver_responsibility
  question: For a first-time DUI offense in Hawaii, what is the standard license revocation
    period for an adult driver?
  choices:
    A: 30 days
    B: 90 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: For a first DUI conviction in Hawaii, the administrative license revocation
    period is typically one year.
- id: 76
  category: driver_responsibility
  question: In Hawaii, what is the maximum fine for a first-time offense of littering
    from a motor vehicle?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Littering from a vehicle is a violation in Hawaii that can carry a
    fine of up to $500 for a first offense.
- id: 77
  category: driver_responsibility
  question: 'If you are involved in an accident in Hawaii, you are required by law
    to provide your name, address, and vehicle registration number to:'
  choices:
    A: Only the police
    B: The other driver or person struck
    C: Your insurance company only
    D: A witness only
  answer: B
  explanation: Hawaii law requires drivers involved in an accident to stop and exchange
    information (name, address, and registration) with the other party involved.
- id: 78
  category: driver_responsibility
  question: In Hawaii, what is the Blood Alcohol Concentration (BAC) limit for a driver
    operating a Commercial Motor Vehicle (CMV)?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: While the limit for standard drivers is 0.08%, the legal BAC limit
    for commercial drivers in Hawaii is 0.04%.
- id: 79
  category: safe_driving_rules
  question: In Hawaii, you must signal your intention to turn at least how many feet
    before making the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: According to the Hawaii Driver's Manual and HRS §291C-84, a signal
    of intention to turn right or left when required shall be given continuously during
    not less than the last 100 feet traveled by the vehicle before turning.
- id: 80
  category: safe_driving_rules
  question: Under Hawaii law, what is the minimum distance you must park your vehicle
    from a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Hawaii Revised Statutes §291C-111 prohibits parking a vehicle within
    10 feet of a fire hydrant.
- id: 81
  category: safe_driving_rules
  question: When parking near an intersection in Hawaii, you must be at least how
    many feet away from a stop sign, flashing beacon, or yield sign?
  choices:
    A: 10 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Per HRS §291C-111, it is illegal to park within 30 feet upon the approach
    to any flashing beacon, stop sign, or traffic-control signal located at the side
    of a roadway.
- id: 82
  category: safe_driving_rules
  question: In Hawaii, fines for speeding are generally doubled when the violation
    occurs in which of the following areas?
  choices:
    A: Residential areas
    B: Business districts
    C: School zones or construction (work) zones
    D: One-way streets
  answer: C
  explanation: Under Hawaii law, speeding fines are doubled for violations occurring
    in designated school zones and highway work zones when workers are present or
    signs are posted.
- id: 83
  category: safe_driving_rules
  question: According to Hawaii law, U-turns are specifically prohibited in which
    of the following locations?
  choices:
    A: On any highway with more than two lanes
    B: In a business district, except at intersections where permitted
    C: On any residential street
    D: Within 100 feet of a driveway
  answer: B
  explanation: HRS §291C-82 states that no vehicle shall be turned so as to proceed
    in the opposite direction in a business district, except at intersections and
    otherwise provided by law.
- id: 84
  category: safe_driving_rules
  question: The Hawaii Driver's Manual recommends using which rule to maintain a safe
    following distance behind the vehicle in front of you?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The five-second rule
    D: The ten-foot rule
  answer: B
  explanation: The Hawaii Driver's Manual recommends the 'two-second rule' as a minimum
    following distance under ideal conditions, though this should be increased in
    poor weather or at higher speeds.
- id: 85
  category: safe_driving_rules
  question: Under Hawaii's updated child passenger safety law, children under what
    age must be secured in a child safety seat or booster seat unless they are over
    4 feet 9 inches tall?
  choices:
    A: Age 5
    B: Age 7
    C: Age 8
    D: Age 10
  answer: D
  explanation: Hawaii law (Act 122, effective 2022) requires children under 10 years
    old to be properly restrained in a child passenger restraint system or booster
    seat unless they have reached a height of 4'9".
- id: 86
  category: safe_driving_rules
  question: 'When entering a roundabout in Hawaii, you must yield the right-of-way
    to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle approaching from your left
    C: No one; traffic in the circle must yield to you
    D: Only pedestrians, not other vehicles
  answer: B
  explanation: In a roundabout, drivers must yield to traffic already circulating
    in the roundabout, which will be approaching from the left.
- id: 87
  category: safe_driving_rules
  question: 'In Hawaii, making a right turn on a red light is:'
  choices:
    A: Always illegal
    B: Legal only if there is a green arrow
    C: Permitted after a complete stop, yielding to pedestrians and traffic, unless
      a sign prohibits it
    D: Permitted without stopping if no traffic is coming
  answer: C
  explanation: Hawaii law allows drivers to make a right turn on red after coming
    to a complete stop and yielding to pedestrians and other vehicles, provided there
    is no sign prohibiting the turn.
- id: 88
  category: safe_driving_rules
  question: According to Hawaii law, where are U-turns generally prohibited even if
    no sign is present?
  choices:
    A: In a residential district
    B: In a business district
    C: On a one-way street
    D: Near a park
  answer: B
  explanation: Hawaii Revised Statutes (HRS 291C-82) state that no vehicle shall be
    turned so as to proceed in the opposite direction in any business district, except
    at an intersection or on a divided highway where an opening is provided.
- id: 89
  category: safe_driving_rules
  question: 'Hawaii''s pedestrian law requires drivers to stop for a pedestrian in
    a crosswalk when the pedestrian is:'
  choices:
    A: Waiting on the sidewalk
    B: Within five feet of the vehicle
    C: On the half of the roadway upon which the vehicle is traveling
    D: Wearing bright clothing
  answer: C
  explanation: Hawaii law (HRS 291C-72) requires drivers to stop for a pedestrian
    when the pedestrian is upon the half of the roadway upon which the vehicle is
    traveling, or when the pedestrian is approaching so closely from the opposite
    half of the roadway as to be in danger.
- id: 90
  category: safe_driving_rules
  question: 'Hawaii''s ''Move Over Law'' requires drivers to vacate the lane closest
    to stationary emergency vehicles. If moving over is unsafe, the driver must:'
  choices:
    A: Maintain speed but honk the horn
    B: Slow down to a reasonable speed that is safe under the circumstances
    C: Stop completely in the current lane
    D: Speed up to pass the vehicle quickly
  answer: B
  explanation: If a driver cannot safely move over to an adjacent lane when approaching
    a stationary emergency vehicle with flashing lights, they must slow down to a
    speed that is safe and prudent.
- id: 91
  category: safe_driving_rules
  question: Under what condition is it legal to pass another vehicle on the right
    in Hawaii?
  choices:
    A: When the vehicle being overtaken is making a left turn
    B: When you are in a hurry and the left lane is slow
    C: On a two-lane, two-way road with a paved shoulder
    D: It is never legal to pass on the right
  answer: A
  explanation: Passing on the right is permitted in Hawaii when the vehicle overtaken
    is making or about to make a left turn, or upon a street with unobstructed pavement
    of sufficient width for two or more lines of moving vehicles in each direction.
- id: 92
  category: safe_driving_rules
  question: 'When following another vehicle in good conditions, the Hawaii Driver''s
    Manual recommends maintaining a following distance of at least:'
  choices:
    A: One second
    B: Two seconds
    C: Three seconds
    D: Five seconds
  answer: C
  explanation: The Hawaii Driver's Manual recommends the 'three-second rule' to maintain
    a safe following distance behind the vehicle in front of you.
- id: 93
  category: safe_driving_rules
  question: 'When parking a vehicle facing downhill on a two-way street with a curb,
    you should turn your front wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the left
  answer: A
  explanation: When parking downhill with a curb, you should turn your wheels toward
    the curb so that if the vehicle rolls, it will roll into the curb and stop.
- id: 94
  category: safe_driving_rules
  question: 'In Hawaii, using a mobile electronic device while driving (including
    texting or talking without a hands-free setup) is:'
  choices:
    A: Allowed for drivers over 21
    B: Prohibited for all drivers
    C: Allowed only at red lights
    D: Prohibited only for provisional license holders
  answer: B
  explanation: Hawaii law prohibits all drivers from using a mobile electronic device
    while operating a motor vehicle, unless using a hands-free setup (though drivers
    under 18 are prohibited from even hands-free use).
- id: 95
  category: safe_driving_rules
  question: Hawaii is a 'no-fault' insurance state. What is the minimum amount of
    liability insurance required for bodily injury for one person?
  choices:
    A: $10,000
    B: $20,000
    C: $40,000
    D: $50,000
  answer: B
  explanation: Hawaii law requires a minimum of $20,000 per person for bodily injury
    liability insurance.
- id: 96
  category: safe_driving_rules
  question: When two vehicles reach an uncontrolled intersection (no signs or signals)
    at the same time from different streets, which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver on the larger road
    D: The driver traveling faster
  answer: B
  explanation: Under Hawaii law, when two vehicles enter an intersection from different
    highways at approximately the same time, the driver of the vehicle on the left
    shall yield the right-of-way to the vehicle on the right.
- id: 97
  category: defensive_driving
  question: According to the Hawaii Driver's Manual, what is the recommended following
    distance behind the vehicle in front of you under normal driving conditions?
  choices:
    A: One car length for every 10 mph
    B: At least two seconds
    C: At least three seconds
    D: At least five seconds
  answer: C
  explanation: The Hawaii Driver's Manual recommends using the 'three-second rule'
    to maintain a safe following distance under normal weather and traffic conditions.
- id: 98
  category: defensive_driving
  question: When following another vehicle at night in Hawaii, you must dim your high-beam
    headlights when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: Per Hawaii state regulations, you must switch to low beams when following
    another vehicle within 200 feet so your lights do not reflect in their rearview
    mirror.
- id: 99
  category: defensive_driving
  question: Under Hawaii's 'Move Over Law,' what must a driver do when approaching
    a stationary emergency vehicle with flashing lights on the side of a highway?
  choices:
    A: Maintain speed but honk to alert the emergency workers
    B: Stop immediately in the lane of travel
    C: Slow down and, if safe, vacate the lane closest to the emergency vehicle
    D: Speed up to pass the area as quickly as possible
  answer: C
  explanation: Hawaii's Move Over Law (HRS §291C-27) requires drivers to slow down
    to a reasonable speed and move over to an adjacent lane if it is safe to do so
    when passing emergency vehicles.
- id: 100
  category: defensive_driving
  question: To avoid hydroplaning on wet Hawaii roads during a heavy tropical downpour,
    what is the best defensive driving technique?
  choices:
    A: Apply the brakes firmly and frequently
    B: Slow down and keep your tires properly inflated
    C: Increase your speed to cut through the water
    D: Turn the steering wheel sharply from side to side
  answer: B
  explanation: Hydroplaning can occur at speeds as low as 35 mph. Slowing down and
    ensuring tires have good tread and proper pressure are the best ways to prevent
    it.
- id: 101
  category: defensive_driving
  question: In Hawaii, if your vehicle begins to skid on a slippery surface, which
    way should you turn your steering wheel?
  choices:
    A: In the opposite direction of the skid
    B: In the direction the rear of the vehicle is skidding
    C: Keep the wheel perfectly straight and brake hard
    D: Toward the shoulder of the road regardless of skid direction
  answer: B
  explanation: To regain control during a skid, you should take your foot off the
    accelerator and steer in the direction the rear of the vehicle is sliding.
- id: 102
  category: defensive_driving
  question: Hawaii law requires you to turn on your headlights whenever you cannot
    see clearly for at least how many feet ahead?
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: According to Hawaii state law, headlights must be used from 30 minutes
    after sunset to 30 minutes before sunrise, or whenever visibility is less than
    500 feet.
- id: 103
  category: defensive_driving
  question: When scanning the road ahead for potential hazards, the Hawaii Driver's
    Manual suggests looking how far down the road?
  choices:
    A: 5 to 8 seconds
    B: 10 to 12 seconds
    C: 20 to 30 seconds
    D: Only at the vehicle directly in front of you
  answer: B
  explanation: Defensive driving in Hawaii involves scanning 10 to 12 seconds ahead
    to identify hazards early and have time to react.
- id: 104
  category: defensive_driving
  question: Under Hawaii's 'Stop for Pedestrians' law, when must a driver stop for
    a pedestrian in a crosswalk?
  choices:
    A: Only if the pedestrian is in the driver's lane
    B: Only if there is a stop sign or red light
    C: When the pedestrian is on the half of the roadway the vehicle is traveling
      on or approaching closely
    D: Only if the pedestrian waves at the driver
  answer: C
  explanation: HRS §291C-72 requires drivers to stop for pedestrians when they are
    in the driver's half of the road or within one lane of the driver's half of the
    road.
- id: 105
  category: defensive_driving
  question: If you are driving in heavy fog on the H-3 or other Hawaii highways, which
    lights should you use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the moisture
    in the air, creating glare and making it harder to see.
- id: 106
  category: defensive_driving
  question: In Hawaii, what is the first thing you should do if your accelerator pedal
    sticks while driving?
  choices:
    A: Turn off the engine immediately
    B: Shift to neutral and apply the brakes
    C: Pull the emergency brake as hard as possible
    D: Open the door and jump out
  answer: B
  explanation: If the accelerator sticks, you should shift to neutral, apply the brakes
    to slow down, and steer safely off the road before turning off the engine.
- id: 107
  category: defensive_driving
  question: When entering a tunnel in Hawaii, such as the Pali or Likelike tunnels,
    what action is recommended for safety?
  choices:
    A: Speed up to get through faster
    B: Turn on your headlights
    C: Turn on your interior dome light
    D: Honk your horn to alert others
  answer: B
  explanation: Drivers should turn on their headlights before entering tunnels to
    increase visibility for themselves and other drivers.
- id: 108
  category: defensive_driving
  question: 'In Hawaii, if you are involved in a collision where the total property
    damage is $3,000 or more, you must:'
  choices:
    A: Wait 48 hours before reporting it
    B: File a written report with the Chief of Police
    C: Only report it if someone is injured
    D: Exchange info and leave without calling police
  answer: B
  explanation: Hawaii law requires accidents involving injury, death, or property
    damage of $3,000 or more to be reported to the police immediately.
- id: 109
  category: defensive_driving
  question: What is the 'blind spot' defensive driving rule when preparing to change
    lanes in Hawaii?
  choices:
    A: Trust your side mirrors completely
    B: Turn your head and look over your shoulder in the direction you plan to move
    C: Honk your horn and wait for others to move
    D: Speed up so no one can be in your blind spot
  answer: B
  explanation: Mirrors do not show everything. You must perform a shoulder check to
    ensure your blind spot is clear before changing lanes.
- id: 110
  category: defensive_driving
  question: When driving on a multi-lane highway in Hawaii, if you are being tailgated,
    what is the safest defensive action?
  choices:
    A: Brake suddenly to scare the tailgater
    B: Slow down and encourage the tailgater to pass
    C: Speed up to maintain a gap
    D: Turn on your hazard lights and stay in your lane
  answer: B
  explanation: If being tailgated, you should avoid sudden movements. Slow down gradually
    or move to the right lane to allow the other driver to pass safely.
- id: 111
  category: defensive_driving
  question: In Hawaii, how far ahead should you scan the road to identify potential
    hazards early?
  choices:
    A: 5 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: As far as your headlights reach
  answer: B
  explanation: Defensive driving in Hawaii requires looking 10 to 15 seconds ahead
    of your vehicle to allow enough time to react to changing traffic conditions.
- id: 112
  category: defensive_driving
  question: At what speed can hydroplaning (tires losing contact with the road due
    to water) begin on wet Hawaii roads?
  choices:
    A: As low as 35 mph
    B: Only above 60 mph
    C: Exactly 50 mph
    D: Only during heavy thunderstorms
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rainstorm,
    tires can lose all contact with the road at 55 mph.
- id: 113
  category: defensive_driving
  question: 'When driving in heavy rain or fog in Hawaii, you should turn on your
    headlights whenever visibility is reduced to less than:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Hawaii law requires the use of headlights when visibility is less than
    500 feet due to rain, fog, or other atmospheric conditions.
- id: 114
  category: defensive_driving
  question: 'In Hawaii, ''Excessive Speeding'' is a petty misdemeanor defined as driving
    more than:'
  choices:
    A: 10 mph over the limit
    B: 20 mph over the limit
    C: 30 mph over the limit or 80 mph regardless of the limit
    D: 15 mph over the limit in a school zone
  answer: C
  explanation: According to HRS §291C-105, excessive speeding in Hawaii is defined
    as driving 30 mph or more over the speed limit or exceeding 80 mph regardless
    of the posted limit.
- id: 115
  category: defensive_driving
  question: When passing a bicyclist in Hawaii, what is the minimum distance a motorist
    must maintain between their vehicle and the bicycle?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: Hawaii's 'Safe Passing' law (HRS §291C-94) requires motorists to maintain
    a minimum distance of 3 feet when passing a bicyclist.
- id: 116
  category: defensive_driving
  question: 'For a first DUI conviction in Hawaii, the Administrative Driver''s License
    Revocation Office (ADLRO) will typically revoke a driver''s license for:'
  choices:
    A: 30 days
    B: 90 days
    C: 1 year
    D: 5 years
  answer: C
  explanation: For a first DUI offense in Hawaii, the standard administrative license
    revocation period is 1 year.
- id: 117
  category: defensive_driving
  question: If your vehicle starts to skid on a wet Hawaii road, what is the first
    thing you should do?
  choices:
    A: Slam on the brakes
    B: Turn the steering wheel sharply in the opposite direction of the skid
    C: Take your foot off the accelerator and steer in the direction you want the
      front of the vehicle to go
    D: Shift into neutral and turn off the engine
  answer: C
  explanation: To recover from a skid, you should ease off the gas and steer in the
    direction you want the car to go. Avoid slamming on the brakes as this can lock
    the wheels and worsen the skid.
- id: 118
  category: alcohol_drugs_health
  question: If you refuse to take a chemical test for alcohol or drugs when requested
    by a police officer in Hawaii, your driving privileges will be revoked for a period
    of ________ for a first refusal.
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: Under Hawaii law, refusing to submit to a chemical test results in
    an administrative revocation of your driver's license for one year for a first-time
    refusal.
- id: 119
  category: alcohol_drugs_health
  question: 'In Hawaii, a driver is classified as a ''Highly Intoxicated Driver''
    if their Blood Alcohol Concentration (BAC) is at or above:'
  choices:
    A: 0.10%
    B: 0.12%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: Hawaii law defines a 'Highly Intoxicated Driver' as someone with a
    BAC of 0.15% or higher, which carries enhanced penalties.
- id: 120
  category: alcohol_drugs_health
  question: Hawaii's 'Open Container' law prohibits which of the following?
  choices:
    A: Possessing an open alcoholic beverage container in the passenger area of a
      motor vehicle
    B: Carrying an unopened six-pack of beer in the front seat
    C: Having an open container of water in the vehicle
    D: Transporting an open bottle of wine in the trunk of the car
  answer: A
  explanation: It is illegal to possess an open alcoholic beverage container in the
    passenger area of a motor vehicle while on a public highway. The trunk is generally
    excluded.
- id: 121
  category: alcohol_drugs_health
  question: 'In Hawaii, if your license is revoked for a DUI, you may be required
    to install an Ignition Interlock Device (IID) which:'
  choices:
    A: Tracks your vehicle's speed via GPS
    B: Prevents the vehicle from starting if it detects alcohol on your breath
    C: Automatically calls the police if you exceed the speed limit
    D: Records video of the driver at all times
  answer: B
  explanation: An Ignition Interlock Device (IID) is a breathalyzer for an individual's
    vehicle that prevents the engine from starting if the driver has alcohol on their
    breath.
- id: 122
  category: alcohol_drugs_health
  question: What is the maximum jail sentence for a first-offense DUI conviction in
    Hawaii (without aggravating factors)?
  choices:
    A: 24 hours
    B: 5 days
    C: 30 days
    D: 6 months
  answer: B
  explanation: A first-offense DUI in Hawaii can result in a jail term of up to 5
    days, though community service or fines are also common penalties.
- id: 123
  category: alcohol_drugs_health
  question: 'If you are convicted of driving while your license is revoked for a DUI
    in Hawaii, the penalties include:'
  choices:
    A: A mandatory fine of $100
    B: A mandatory term of imprisonment for not less than 3 days
    C: A simple warning for the first offense
    D: Only a 10-day extension of the revocation
  answer: B
  explanation: Driving while a license is suspended or revoked for DUI is a serious
    offense in Hawaii, carrying a mandatory minimum jail sentence of 3 days.
- id: 124
  category: alcohol_drugs_health
  question: Which of the following is the first thing affected by alcohol consumption?
  choices:
    A: Muscle coordination
    B: Vision
    C: Judgment and self-control
    D: Hearing
  answer: C
  explanation: Alcohol affects judgment and self-control long before it affects physical
    coordination or vision.
- id: 125
  category: alcohol_drugs_health
  question: What is the only effective way to reduce your Blood Alcohol Concentration
    (BAC) after drinking?
  choices:
    A: Drinking strong black coffee
    B: Taking a cold shower
    C: Exercising or running
    D: Allowing time to pass
  answer: D
  explanation: Time is the only factor that will lower BAC. The body metabolizes alcohol
    at a steady rate that cannot be accelerated by coffee, showers, or exercise.
- id: 126
  category: alcohol_drugs_health
  question: Regarding prescription drugs and driving in Hawaii, which statement is
    true?
  choices:
    A: It is legal to drive as long as the drug was prescribed by a doctor
    B: You can be charged with a DUI if a prescription drug impairs your ability to
      drive safely
    C: Prescription drugs never affect driving ability
    D: Only illegal narcotics can lead to a DUI charge
  answer: B
  explanation: In Hawaii, a DUI charge can result from impairment caused by any drug,
    including legal prescription medications and over-the-counter drugs.
- id: 127
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with other drugs (synergistic effect)?
  choices:
    A: The effects of the drug are cancelled out by the alcohol
    B: The effects of the alcohol are cancelled out by the drug
    C: The combined effect is much greater than the sum of the individual effects
    D: There is no change in the level of impairment
  answer: C
  explanation: Combining alcohol with other drugs can multiply the effects of both,
    leading to severe impairment even with small amounts of each.
- id: 128
  category: alcohol_drugs_health
  question: 'In Hawaii, if you have a medical condition that may affect your ability
    to drive safely, you must:'
  choices:
    A: Surrender your license immediately
    B: Report the condition to the driver licensing clinic and may be required to
      provide a medical report
    C: Only drive during daylight hours
    D: Keep the condition secret to avoid losing your license
  answer: B
  explanation: Drivers are required to disclose medical conditions that could impair
    driving. The licensing authority may require a medical examiner's report to determine
    if the driver is fit to operate a vehicle.
- id: 129
  category: alcohol_drugs_health
  question: A person is considered a 'Habitual OUI (Operating Under the Influence)
    Offender' in Hawaii if they are convicted of a DUI for the ________ time within
    a 10-year period.
  choices:
    A: Second
    B: Third
    C: Fourth
    D: Fifth
  answer: B
  explanation: Under Hawaii law, a person who is convicted of three or more OUI offenses
    within a 10-year period is considered a habitual offender, which is a Class C
    felony.
- id: 130
  category: alcohol_drugs_health
  question: If a driver in Hawaii refuses to take a chemical test for alcohol or drugs
    when requested by an officer, what is the mandatory license revocation period
    for a first offense?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 90 days
  answer: B
  explanation: Under Hawaii law, a first-time refusal to submit to a breath, blood,
    or urine test results in a mandatory 1-year administrative license revocation.
- id: 131
  category: alcohol_drugs_health
  question: Hawaii's 'Open Container' law prohibits the possession of an open alcoholic
    beverage container in which part of the vehicle while on a public highway?
  choices:
    A: Only the driver's seat area
    B: Only the front passenger seat
    C: Anywhere in the passenger area, including the glove compartment
    D: Only the trunk
  answer: C
  explanation: HRS §291-3.1 prohibits keeping an open container of alcohol in the
    passenger area of any motor vehicle upon any public highway. This includes unlocked
    glove compartments or any area reachable by the driver or passengers.
- id: 132
  category: alcohol_drugs_health
  question: 'For a first DUI conviction in Hawaii, a driver may be ordered to pay
    a fine ranging from:'
  choices:
    A: $50 to $100
    B: $150 to $500
    C: $250 to $1,000
    D: $1,000 to $5,000
  answer: C
  explanation: A first-time DUI offender in Hawaii faces a fine of no less than $250
    and no more than $1,000, in addition to other fees and penalties.
- id: 133
  category: alcohol_drugs_health
  question: Can a driver in Hawaii be convicted of a DUI if they are under the influence
    of legally prescribed medication?
  choices:
    A: No, as long as they have a valid prescription
    B: No, only illegal drugs count toward a DUI
    C: Yes, if the medication impairs their ability to drive safely
    D: Yes, but only if the medication is a narcotic
  answer: C
  explanation: HRS §291E-61 applies to any substance that impairs a person's ability
    to operate a vehicle safely, including prescription drugs and over-the-counter
    medications.
- id: 134
  category: alcohol_drugs_health
  question: A first-time DUI offender in Hawaii is required to complete a substance
    abuse rehabilitation program consisting of at least how many hours?
  choices:
    A: 8 hours
    B: 14 hours
    C: 24 hours
    D: 40 hours
  answer: B
  explanation: Hawaii law requires first-time DUI offenders to attend a 14-hour minimum
    alcohol and drug rehabilitation program.
- id: 135
  category: alcohol_drugs_health
  question: What device is a Hawaii driver often required to install in their vehicle
    to regain driving privileges after a DUI revocation?
  choices:
    A: A speed governor
    B: An Ignition Interlock Device (IID)
    C: A dash camera
    D: An automatic emergency braking system
  answer: B
  explanation: Hawaii requires the use of an Ignition Interlock Device (IID) for drivers
    whose licenses have been revoked for DUI, allowing them to drive during the revocation
    period if the device is installed.
- id: 136
  category: alcohol_drugs_health
  question: 'In Hawaii, if you are convicted of a DUI while a passenger under the
    age of 15 is in the vehicle, you face:'
  choices:
    A: No extra penalty
    B: A mandatory extra fine of $500 and 48 hours in jail
    C: A mandatory license suspension of 5 years
    D: A requirement to retake the driving test
  answer: B
  explanation: Under Hawaii law, if a person commits a DUI with a passenger under
    the age of 15, they are subject to an additional mandatory fine of $500 and a
    mandatory 48 hours of imprisonment.
- id: 137
  category: alcohol_drugs_health
  question: 'Under Hawaii''s ''Zero Tolerance'' law, a driver under the age of 21
    can have their license suspended if their BAC is at or above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Hawaii's Zero Tolerance law (HRS §291E-64) makes it illegal for anyone
    under 21 to drive with a BAC of 0.02% or higher.
- id: 138
  category: alcohol_drugs_health
  question: Which Hawaii agency is responsible for the administrative revocation of
    a driver's license following a DUI arrest?
  choices:
    A: The Department of Transportation (DOT)
    B: The Administrative Driver's License Revocation Office (ADLRO)
    C: The Honolulu Police Department
    D: The Judiciary of Hawaii
  answer: B
  explanation: The ADLRO is the specific agency in Hawaii that handles the administrative
    process of revoking licenses for alcohol or drug-related driving offenses, independent
    of criminal court proceedings.
- id: 139
  category: alcohol_drugs_health
  question: How does alcohol typically affect a driver's vision?
  choices:
    A: It improves night vision
    B: It sharpens peripheral vision
    C: It reduces the ability to judge distance and causes double vision
    D: It has no effect on vision
  answer: C
  explanation: Alcohol slows the eye muscles, making it difficult to focus, reducing
    peripheral vision, and impairing the ability to judge distances accurately.
- id: 140
  category: alcohol_drugs_health
  question: 'In Hawaii, if you are involved in a fatal accident and a police officer
    has probable cause to believe you were driving under the influence:'
  choices:
    A: You can choose to take the test the next day
    B: You can refuse the test without any penalty
    C: The officer can require a mandatory blood test
    D: You only have to take a breath test
  answer: C
  explanation: In cases involving collisions resulting in injury or death, Hawaii
    law allows for mandatory testing if there is probable cause to believe the driver
    was under the influence.
- id: 141
  category: alcohol_drugs_health
  question: 'If you are feeling fatigued or sleepy while driving on a Hawaii highway,
    the safest action is to:'
  choices:
    A: Turn up the radio and open the windows
    B: Drink a high-caffeine energy drink and continue
    C: Pull over at a safe rest area or parking lot and take a nap
    D: Drive faster to reach your destination sooner
  answer: C
  explanation: Fatigue impairs reaction time and judgment similarly to alcohol. The
    only safe remedy for fatigue is sleep; temporary fixes like caffeine or loud music
    do not eliminate the risk of falling asleep at the wheel.
- id: 142
  category: penalties_and_points
  question: Under Hawaii's Implied Consent law, what is the penalty for a first-time
    refusal to submit to a breath, blood, or urine test for intoxicants?
  choices:
    A: A 3-month license suspension
    B: A 6-month license suspension
    C: A 1-year license revocation
    D: A 2-year license revocation
  answer: C
  explanation: In Hawaii, if you refuse a chemical test under the Implied Consent
    law, your driver's license will be revoked for a period of one year for a first
    offense.
- id: 143
  category: penalties_and_points
  question: Under Hawaii's updated Child Passenger Safety Law, children must remain
    in a rear-facing child safety seat until they reach what age?
  choices:
    A: 1 year old
    B: 2 years old
    C: 4 years old
    D: 5 years old
  answer: B
  explanation: As of 2022, Hawaii law requires children to be in a rear-facing child
    safety seat until they are at least two years of age.
- id: 144
  category: penalties_and_points
  question: In Hawaii, a driver is considered to be 'Habitually Operating a Vehicle
    Under the Influence' if they have how many prior DUI convictions within the last
    10 years?
  choices:
    A: One
    B: Two
    C: Three
    D: Five
  answer: C
  explanation: Under Hawaii law, a person is a habitual offender if they are convicted
    of a DUI and have three or more prior convictions for intoxicant-related driving
    offenses within a 10-year period.
- id: 145
  category: penalties_and_points
  question: 'If a Hawaii driver is involved in an accident resulting in property damage,
    they must report the accident to the police immediately if the damage to property
    of any one person exceeds:'
  choices:
    A: $500
    B: $1,000
    C: $3,000
    D: $5,000
  answer: C
  explanation: Hawaii Revised Statutes require drivers to report an accident to the
    nearest police station if it involves injury, death, or property damage estimated
    at $3,000 or more.
- id: 146
  category: penalties_and_points
  question: In Hawaii, what is the maximum fine for a first-time conviction of failing
    to stop for a school bus with its red lights flashing and stop arm extended?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Drivers in Hawaii who fail to stop for a school bus loading or unloading
    students face a fine of up to $500 for a first offense.
- id: 147
  category: penalties_and_points
  question: What is the legal blood alcohol concentration (BAC) limit for commercial
    drivers (CDL holders) in Hawaii?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: In alignment with federal regulations, Hawaii sets the legal BAC limit
    for commercial vehicle operators at 0.04%.
- id: 148
  category: penalties_and_points
  question: Hawaii's 'Move Over Law' requires drivers to slow down and, if safe, vacate
    the lane closest to stationary emergency vehicles. This law also applies to which
    of the following?
  choices:
    A: Tow trucks and Hawaii Department of Transportation (HDOT) vehicles
    B: Only police cars and fire trucks
    C: Any vehicle with hazard lights on
    D: School buses only
  answer: A
  explanation: Hawaii's Move Over Law (HRS 291C-27) includes police, fire, ambulance,
    tow trucks, and HDOT freeway service patrol vehicles with flashing lights.
- id: 149
  category: penalties_and_points
  question: 'In Hawaii, it is illegal to possess an open container of alcohol in the
    passenger area of a motor vehicle. This law applies to:'
  choices:
    A: The driver only
    B: The driver and all passengers
    C: Only passengers under 21
    D: Only the driver if they are moving
  answer: B
  explanation: Hawaii law prohibits both the driver and any passengers from possessing
    an open container of alcohol while in a motor vehicle on a public highway.
- id: 150
  category: penalties_and_points
  question: A person convicted of 'Racing on Highways' in Hawaii may face which of
    the following penalties for a first offense?
  choices:
    A: A fine of up to $500 and up to 6 months in jail
    B: Mandatory permanent license revocation
    C: A $50 fine only
    D: No jail time, only a community service requirement
  answer: A
  explanation: Racing on highways is a petty misdemeanor in Hawaii, punishable by
    a fine of up to $500 and/or imprisonment for up to six months.
- id: 151
  category: penalties_and_points
  question: What is the minimum age for a motorcycle or motor scooter operator to
    ride without a helmet in Hawaii?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: Helmets are mandatory for all ages
  answer: B
  explanation: In Hawaii, motorcycle and motor scooter operators and passengers under
    the age of 18 are required by law to wear a helmet.
- id: 152
  category: penalties_and_points
  question: In Hawaii, 'Excessive Speeding' is defined as driving at what speed relative
    to the posted limit?
  choices:
    A: 15 mph or more over the limit
    B: 20 mph or more over the limit
    C: 25 mph or more over the limit
    D: 30 mph or more over the limit
  answer: D
  explanation: Hawaii Revised Statutes (HRS 291C-105) defines excessive speeding as
    driving 30 mph or more over the speed limit, or driving in excess of 80 mph regardless
    of the limit.
- id: 153
  category: penalties_and_points
  question: According to Hawaii's updated child passenger restraint law (Act 122),
    children between the ages of 4 and 9 must be secured in a booster seat unless
    they are at least how tall?
  choices:
    A: 4 feet 5 inches
    B: 4 feet 7 inches
    C: 4 feet 9 inches
    D: 5 feet 0 inches
  answer: C
  explanation: Hawaii law requires children ages 4 through 9 to be in a booster seat
    or child safety seat unless they are at least 4 feet 9 inches tall.
- id: 154
  category: penalties_and_points
  question: In Hawaii, if you are involved in an accident resulting in property damage
    only, and the damage appears to be more than ________, you must report the accident
    to the police immediately.
  choices:
    A: $500
    B: $1,000
    C: $3,000
    D: $5,000
  answer: C
  explanation: Hawaii law requires drivers to report any accident involving injury,
    death, or property damage estimated at $3,000 or more to the police.
- id: 155
  category: penalties_and_points
  question: 'In Hawaii, littering from a motor vehicle is a violation that can carry
    a fine of up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Littering from a vehicle in Hawaii is illegal and can result in a fine
    of up to $500.
- id: 156
  category: penalties_and_points
  question: 'If convicted of ''Racing on Highways'' in Hawaii, a driver faces a mandatory
    license suspension of at least:'
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: Racing on highways is a serious offense in Hawaii. A conviction results
    in a mandatory one-year license revocation.
- id: 157
  category: penalties_and_points
  question: 'In Hawaii, if you fail to yield the right-of-way to a pedestrian in a
    crosswalk, the fine for a first offense is between:'
  choices:
    A: $50 and $100
    B: $150 and $500
    C: $500 and $1,000
    D: $1,000 and $2,000
  answer: B
  explanation: Hawaii law (HRS 291C-72) mandates a fine of $150 to $500 for drivers
    who fail to yield to pedestrians in a crosswalk.
- id: 158
  category: sharing_the_road
  question: 'Under Hawaii Revised Statutes §291C-72, when a pedestrian is in a crosswalk
    on the half of the roadway upon which a vehicle is traveling, the driver must:'
  choices:
    A: Slow down and proceed with caution
    B: Honk to warn the pedestrian
    C: Stop and yield the right of way
    D: Only stop if the pedestrian is using a white cane
  answer: C
  explanation: Hawaii law requires drivers to stop for pedestrians who are within
    the driver's half of the crosswalk or approaching so closely from the opposite
    half as to be in danger.
- id: 159
  category: sharing_the_road
  question: 'In Hawaii, if you are approaching a stationary emergency vehicle with
    flashing lights on a highway with at least two lanes in your direction, you must:'
  choices:
    A: Maintain speed but move to the left lane
    B: Stop immediately in your lane
    C: Move to a non-adjacent lane or slow down to a reasonable speed if changing
      lanes is unsafe
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: Hawaii's 'Move Over' law (HRS §291C-27) requires drivers to vacate
    the lane next to a stationary emergency vehicle or slow down if a lane change
    is not possible.
- id: 160
  category: sharing_the_road
  question: 'When a school bus is stopped on a divided highway with a concrete median
    barrier, drivers traveling in the opposite direction are:'
  choices:
    A: Required to stop until the bus moves
    B: Required to stop only if the red lights are flashing
    C: Not required to stop
    D: Required to slow to 10 mph
  answer: C
  explanation: In Hawaii, if a highway is divided by a physical barrier or median,
    traffic traveling in the opposite direction of a stopped school bus is not required
    to stop.
- id: 161
  category: sharing_the_road
  question: According to Hawaii law, who is required to wear a safety helmet while
    operating or riding as a passenger on a motorcycle?
  choices:
    A: All riders regardless of age
    B: Only the operator
    C: Persons under the age of 18
    D: Only persons with a learner's permit
  answer: C
  explanation: Hawaii law requires motorcycle and motor scooter operators and passengers
    under the age of 18 to wear a safety helmet secured with a chin strap.
- id: 162
  category: sharing_the_road
  question: Regarding mopeds in Hawaii, which of the following statements is true?
  choices:
    A: Mopeds are allowed to carry one passenger
    B: Mopeds may be driven on sidewalks
    C: It is illegal to carry a passenger on a moped
    D: Mopeds do not require a driver's license
  answer: C
  explanation: Under Hawaii law (HRS §291C-195), no person shall drive a moped with
    a passenger, and no person shall ride as a passenger on a moped.
- id: 163
  category: sharing_the_road
  question: In Hawaii, it is illegal to ride a bicycle on a sidewalk in which of the
    following areas?
  choices:
    A: Residential neighborhoods
    B: A business district
    C: Near a school
    D: Near a public park
  answer: B
  explanation: Hawaii law prohibits riding bicycles on sidewalks within a business
    district, such as downtown Honolulu or Waikiki.
- id: 164
  category: sharing_the_road
  question: 'When following a large truck, if you cannot see the truck driver''s side
    mirrors, you are:'
  choices:
    A: In the truck's 'No-Zone' (blind spot)
    B: In a safe following position
    C: Required to turn on your high beams
    D: In the truck's 'Clear-Zone'
  answer: A
  explanation: If you cannot see the truck driver's mirrors, the driver cannot see
    you, meaning you are in one of the truck's blind spots or 'No-Zones'.
- id: 165
  category: sharing_the_road
  question: In Hawaii, what is the minimum distance you must maintain when following
    a fire apparatus (fire truck) traveling in response to a fire alarm?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: HRS §291C-121 prohibits following a fire apparatus closer than 500
    feet when it is responding to an alarm.
- id: 166
  category: sharing_the_road
  question: 'When you see a pedestrian carrying a white cane or using a guide dog
    at an intersection, you must:'
  choices:
    A: Honk to let them know you are there
    B: Stop and take precautions to avoid injury to the pedestrian
    C: Drive around them if there is space
    D: Wait for them to signal you to pass
  answer: B
  explanation: Hawaii law (HRS §291C-76) requires drivers to take necessary precautions
    and stop to avoid injury to blind or partially blind pedestrians using a cane
    or guide dog.
- id: 167
  category: sharing_the_road
  question: 'Under Hawaii''s ''Lane Filtering'' law, two-wheeled motorcycles may pass
    other vehicles that are stopped in the same direction if:'
  choices:
    A: The motorcycle is traveling on the shoulder
    B: The speed limit is 45 mph or higher and the road has at least two lanes
    C: The motorcycle is traveling between lanes of moving traffic
    D: The motorcycle is on a one-way street only
  answer: B
  explanation: Hawaii allows 'lane filtering' (not splitting) for two-wheeled motorcycles
    on roadways with at least two lanes in the same direction and a speed limit of
    45 mph or higher, provided the other vehicles are stopped.
- id: 168
  category: sharing_the_road
  question: 'A bicyclist in Hawaii signaling a right turn may do so by extending their
    left arm upward OR by:'
  choices:
    A: Extending their right arm horizontally
    B: Pointing toward the ground with the left arm
    C: Waving both arms
    D: Flashing their headlamp
  answer: A
  explanation: Hawaii law allows bicyclists to signal a right turn by extending the
    left hand and arm upward or by extending the right hand and arm horizontally.
- id: 169
  category: sharing_the_road
  question: 'In Hawaii, it is illegal for a person to stand in a roadway for the purpose
    of:'
  choices:
    A: Waiting for a bus at a marked stop
    B: Soliciting a ride (hitchhiking)
    C: Crossing at a crosswalk
    D: Assisting a disabled vehicle
  answer: B
  explanation: HRS §291C-77 states that no person shall stand in a roadway for the
    purpose of soliciting a ride (hitchhiking) from the occupant of any vehicle.
- id: 170
  category: sharing_the_road
  question: 'When a large truck is turning right onto a narrow street, the driver
    may need to:'
  choices:
    A: Stay close to the right curb
    B: Swing wide to the left before turning
    C: Speed up to clear the intersection
    D: Turn from the left-most lane
  answer: B
  explanation: Large trucks have a wide turning radius and often need to swing wide
    to the left to clear the curb when making a right turn.
- id: 171
  category: sharing_the_road
  question: In Hawaii, what is the minimum lateral distance a motorist must maintain
    when overtaking or passing a bicycle proceeding in the same direction?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Hawaii law (Act 171) requires motorists to leave a safe distance of
    no less than three feet when overtaking or passing a bicycle.
- id: 172
  category: sharing_the_road
  question: In Hawaii, what is the legal requirement for carrying passengers on a
    moped?
  choices:
    A: Passengers are allowed if they are over 12 years old
    B: Passengers are allowed if the moped has a seat for two
    C: No person shall drive a moped carrying any other person
    D: Passengers are allowed only in residential areas
  answer: C
  explanation: Under Hawaii Revised Statutes §291C-195, no person shall drive a moped
    carrying any other person. Mopeds are strictly for single riders.
- id: 173
  category: sharing_the_road
  question: 'When a pedestrian is crossing the street guided by a dog or carrying
    a white cane (or white cane tipped with red), Hawaii law requires you to:'
  choices:
    A: Honk to let them know you are there
    B: Take precautions and stop to avoid injury to the pedestrian
    C: Wait for them to wave you through
    D: Drive around them if there is room
  answer: B
  explanation: Drivers must take all necessary precautions to avoid injury to blind
    or partially blind pedestrians. You must stop and remain stopped until the pedestrian
    has safely crossed.
- id: 174
  category: sharing_the_road
  question: Which of the following is true regarding bicycle operation on Hawaii sidewalks?
  choices:
    A: Bicycles are allowed on all sidewalks at all times
    B: Bicycles are prohibited from sidewalks in business districts
    C: Bicycles must always be ridden on the sidewalk, never the road
    D: Only electric bicycles are allowed on sidewalks
  answer: B
  explanation: Under HRS §291C-148, no person shall ride a bicycle on a sidewalk in
    a business district. In other areas, bicyclists on sidewalks must yield to pedestrians.
- id: 175
  category: sharing_the_road
  question: 'When an emergency vehicle with sirens and flashing lights is approaching
    from behind, you should:'
  choices:
    A: Stop immediately in your lane
    B: Speed up to stay ahead of it
    C: Pull over to the right edge of the road and stop
    D: Pull over to the left edge of the road and stop
  answer: C
  explanation: Hawaii law requires drivers to yield the right-of-way by pulling to
    the right-hand edge or curb of the highway, clear of any intersection, and stopping
    until the emergency vehicle has passed.
- id: 176
  category: sharing_the_road
  question: In Hawaii, motorcycle operators under what age are required by law to
    wear a safety helmet?
  choices:
    A: Under 16
    B: Under 18
    C: Under 21
    D: All ages must wear helmets
  answer: B
  explanation: Hawaii law requires motorcycle and motor scooter operators and passengers
    under the age of 18 to wear a safety helmet secured with a chin strap.
- id: 177
  category: sharing_the_road
  question: 'When following a fire apparatus (fire truck) responding to an alarm,
    Hawaii law prohibits following closer than:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: According to HRS §291C-128, it is illegal to follow any fire apparatus
    traveling in response to a fire alarm closer than 500 feet.
- id: 178
  category: sharing_the_road
  question: 'If you are driving on a highway with a physical median or divider, and
    a school bus is stopped on the opposite side of the divider with red lights flashing,
    you:'
  choices:
    A: Must stop until the bus moves
    B: Must slow down to 10 mph
    C: May proceed without stopping
    D: Must stop only if there are children present
  answer: C
  explanation: On a divided highway (where the roadways are separated by a physical
    barrier or median), drivers traveling in the opposite direction of a school bus
    are not required to stop.
- id: 179
  category: sharing_the_road
  question: 'When turning right across a bicycle lane in Hawaii, you should:'
  choices:
    A: Turn quickly to get ahead of any cyclists
    B: Check for cyclists, signal, and yield to any cyclist in the lane before turning
    C: Always stop in the bike lane before turning
    D: Honk to warn cyclists to stop
  answer: B
  explanation: Drivers must yield to any bicyclist in a bicycle lane before making
    a turn. You should check your blind spots and mirrors to ensure no cyclists are
    approaching from behind.
- id: 180
  category: vehicle_information
  question: In the State of Hawaii, how often must most vehicles undergo a safety
    inspection?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: According to Hawaii law, most vehicles must pass an annual safety inspection
    to ensure they meet state equipment standards.
- id: 181
  category: vehicle_information
  question: Under Hawaii law, what is the minimum Visible Light Transmission (VLT)
    percentage required for window tint on the side and rear windows of a passenger
    sedan?
  choices:
    A: 20%
    B: 25%
    C: 35%
    D: 50%
  answer: C
  explanation: Hawaii Revised Statutes specify that window tint on passenger cars
    must allow at least 35% of light to pass through (plus or minus 6% tolerance).
- id: 182
  category: vehicle_information
  question: When are you required to turn on your headlights in Hawaii?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: From 30 minutes after sunset to 30 minutes before sunrise
    C: Only when it is raining
    D: Only when driving on unlit highways
  answer: B
  explanation: The Hawaii Driver's Manual states that headlights must be turned on
    from 30 minutes after sunset until 30 minutes before sunrise, or whenever visibility
    is poor.
- id: 183
  category: vehicle_information
  question: In Hawaii, what is the minimum legal tire tread depth for a passenger
    vehicle?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: To pass a Hawaii safety inspection, tires must have a minimum tread
    depth of at least 2/32 of an inch.
- id: 184
  category: vehicle_information
  question: Hawaii is a 'no-fault' insurance state. What does this primarily mean
    for drivers?
  choices:
    A: Drivers are never responsible for accidents
    B: Your own insurance company pays for your medical expenses regardless of who
      caused the accident
    C: You do not need to carry insurance if you have a clean record
    D: The state pays for all vehicle damages in an accident
  answer: B
  explanation: Hawaii's no-fault law requires Personal Injury Protection (PIP) coverage,
    which pays for the driver's and passengers' medical expenses up to a certain limit,
    regardless of fault.
- id: 185
  category: vehicle_information
  question: In Hawaii, a child must be secured in a booster seat until they reach
    what age or height?
  choices:
    A: 8 years old or 4 feet 5 inches
    B: 10 years old or 4 feet 9 inches
    C: 12 years old or 5 feet tall
    D: 7 years old or 4 feet tall
  answer: B
  explanation: Hawaii law requires children between ages 4 and 10 to use a booster
    seat unless they are over 4 feet 9 inches tall.
- id: 186
  category: vehicle_information
  question: 'If your vehicle''s rearview mirror is obstructed by a load or the vehicle''s
    design, Hawaii law requires you to have:'
  choices:
    A: A backup camera only
    B: A passenger to guide you
    C: Both left and right side-view mirrors
    D: A wide-angle interior mirror
  answer: C
  explanation: If the view from the inside rearview mirror is obstructed, Hawaii law
    requires the vehicle to be equipped with side mirrors on both the left and right
    sides.
- id: 187
  category: vehicle_information
  question: 'In Hawaii, every motor vehicle must be equipped with a horn that can
    be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Hawaii vehicle equipment laws require a horn capable of emitting sound
    audible under normal conditions from a distance of not less than 200 feet.
- id: 188
  category: vehicle_information
  question: 'Hawaii law requires that a vehicle''s parking brake must be able to hold
    the vehicle:'
  choices:
    A: Only on flat surfaces
    B: On any grade (hill) on which it is operated
    C: Only when the engine is running
    D: Only if the vehicle is in gear
  answer: B
  explanation: The parking brake system must be adequate to hold the vehicle on any
    grade on which it is operated, under all conditions of loading, on a surface free
    from snow, ice, or loose material.
- id: 189
  category: vehicle_information
  question: Where is a Hawaii driver required to keep the vehicle's current Certificate
    of Registration?
  choices:
    A: At the driver's home
    B: In the vehicle
    C: At the County DMV office
    D: In the driver's wallet at all times
  answer: B
  explanation: Hawaii law requires that the current vehicle registration certificate
    be kept in the vehicle and presented upon demand by a law enforcement officer.
- id: 190
  category: vehicle_information
  question: Hawaii's mandatory motor vehicle insurance law requires a minimum of how
    much coverage for bodily injury to one person in an accident?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: Hawaii law requires a minimum of $20,000 per person for bodily injury
    liability coverage.
- id: 191
  category: vehicle_information
  question: What is the minimum legal tread depth for tires on a passenger vehicle
    in Hawaii to pass a safety inspection?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: To pass the Hawaii safety inspection, tires must have a minimum tread
    depth of 2/32 of an inch.
- id: 192
  category: vehicle_information
  question: Where must the Hawaii motor vehicle registration certificate be kept?
  choices:
    A: At the owner's residence
    B: In the vehicle's glove compartment or otherwise in the vehicle
    C: Attached to the rear license plate
    D: In the driver's wallet at all times
  answer: B
  explanation: Hawaii law requires that the registration certificate be kept in the
    vehicle for which it is registered.
- id: 193
  category: vehicle_information
  question: 'Hawaii law requires that every motor vehicle be equipped with a parking
    brake that is capable of holding the vehicle:'
  choices:
    A: On a level surface only
    B: On a 10% grade only
    C: On any grade on which it is operated
    D: Only when the vehicle is in 'Park' gear
  answer: C
  explanation: The parking brake must be adequate to hold the vehicle on any grade
    on which it is operated, regardless of load.
- id: 194
  category: vehicle_information
  question: 'When following another vehicle at night in Hawaii, you must switch to
    low beams when you are within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Hawaii law requires drivers to dim their high beams when following
    another vehicle within 300 feet.
- id: 195
  category: vehicle_information
  question: 'Hawaii is a ''no-fault'' insurance state. In this context, ''no-fault''
    primarily refers to:'
  choices:
    A: No one is ever blamed for an accident
    B: Your own insurance company pays for your medical expenses regardless of who
      caused the accident
    C: Drivers do not need to carry liability insurance
    D: Police do not issue tickets at the scene of an accident
  answer: B
  explanation: Hawaii's no-fault law means your Personal Injury Protection (PIP) coverage
    pays for your own medical expenses up to a certain limit, regardless of who was
    at fault.
- id: 196
  category: vehicle_information
  question: Under Hawaii law, it is illegal to operate a vehicle with a muffler that
    has been modified with which of the following?
  choices:
    A: A chrome tip
    B: A cutout, bypass, or similar device
    C: A heat shield
    D: New mounting brackets
  answer: B
  explanation: Hawaii law prohibits the use of mufflers equipped with cutouts, bypasses,
    or similar devices that increase noise levels.
- id: 197
  category: vehicle_information
  question: 'Every motor vehicle in Hawaii must be equipped with at least one mirror
    located to reflect to the driver a view of the highway for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: Hawaii law requires mirrors to provide a view of the highway for at
    least 200 feet to the rear of the vehicle.
- id: 198
  category: vehicle_information
  question: 'In Hawaii, a motor vehicle''s horn must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: Hawaii Revised Statutes require that a horn be audible from a distance
    of not less than 200 feet.
- id: 199
  category: signs_and_signals
  question: In Hawaii, when a traffic signal shows a flashing red light, what must
    a driver do?
  choices:
    A: Slow down and proceed with caution
    B: Stop completely and proceed only when it is safe to do so
    C: Stop and wait for the light to turn green
    D: Yield to oncoming traffic but do not stop
  answer: B
  explanation: According to the Hawaii Driver's Manual, a flashing red signal means
    the same as a stop sign. You must come to a complete stop and proceed only when
    it is safe.
- id: 200
  category: signs_and_signals
  question: Which hand signal is the correct way to indicate a right turn in Hawaii?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward at a 90-degree angle
    C: Left arm extended downward with palm facing back
    D: Right arm extended straight out the window
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at the elbow.
- id: 201
  category: signs_and_signals
  question: Under Hawaii law (HRS 291C-33), what is a pedestrian prohibited from doing
    when a 'Countdown' timer is displayed at a crosswalk?
  choices:
    A: Finishing their crossing if they are already in the street
    B: Starting to cross the roadway
    C: Walking faster to beat the timer
    D: Waiting on the curb for the next cycle
  answer: B
  explanation: Hawaii state law prohibits pedestrians from starting to cross the roadway
    once the countdown timer or 'Don't Walk' signal has begun.
- id: 202
  category: signs_and_signals
  question: What does a solid yellow line next to a broken yellow line on a Hawaii
    roadway indicate?
  choices:
    A: Passing is permitted from either side
    B: Passing is prohibited from either side
    C: Passing is permitted only from the side with the broken line
    D: Passing is permitted only from the side with the solid line
  answer: C
  explanation: A broken yellow line next to a solid yellow line means that passing
    is allowed only for the traffic next to the broken line.
- id: 203
  category: signs_and_signals
  question: 'In Hawaii, a white diamond symbol painted on the pavement indicates:'
  choices:
    A: A pedestrian crossing is ahead
    B: A high-occupancy vehicle (HOV) or restricted lane
    C: A railroad crossing is ahead
    D: The lane is for emergency vehicles only
  answer: B
  explanation: The diamond symbol is used in Hawaii to mark lanes reserved for high-occupancy
    vehicles (HOV), such as buses and carpools.
- id: 204
  category: signs_and_signals
  question: 'When you see a flashing yellow traffic signal in Hawaii, you should:'
  choices:
    A: Stop and wait for it to turn green
    B: Speed up to clear the intersection
    C: Slow down and proceed with caution
    D: Treat it like a four-way stop
  answer: C
  explanation: A flashing yellow light means you should slow down and be extra alert
    as you proceed through the intersection.
- id: 205
  category: signs_and_signals
  question: What is the meaning of a 'Pennant' shaped sign (isosceles triangle pointing
    right) found on Hawaii roads?
  choices:
    A: Yield right-of-way
    B: No Passing Zone
    C: School Zone
    D: Railroad Crossing
  answer: B
  explanation: A pennant-shaped sign is placed on the left side of the road to indicate
    the beginning of a 'No Passing Zone'.
- id: 206
  category: signs_and_signals
  question: 'In Hawaii, you may turn left on a red light ONLY when turning from:'
  choices:
    A: A two-way street onto a one-way street
    B: A one-way street onto another one-way street
    C: A one-way street onto a two-way street
    D: Any street, provided there is no traffic
  answer: B
  explanation: Hawaii law allows a left turn on red only when turning from a one-way
    street onto another one-way street, after coming to a complete stop and yielding
    to traffic and pedestrians.
- id: 207
  category: signs_and_signals
  question: What does a double solid white line on a Hawaii highway signify?
  choices:
    A: You may cross it to change lanes if safe
    B: It separates traffic moving in opposite directions
    C: Lane changing is prohibited
    D: It marks the edge of the roadway
  answer: C
  explanation: Double solid white lines are used to separate lanes of traffic moving
    in the same direction where lane changing is prohibited.
- id: 208
  category: signs_and_signals
  question: 'A pentagon-shaped (five-sided) sign on a Hawaii road indicates:'
  choices:
    A: A stop sign
    B: A yield sign
    C: A school zone or school crossing
    D: A county boundary
  answer: C
  explanation: The five-sided pentagon shape is reserved exclusively for school zones
    and school crossings.
- id: 209
  category: signs_and_signals
  question: 'When a traffic signal turns from green to yellow in Hawaii, it means:'
  choices:
    A: You must stop immediately, even if in the intersection
    B: The signal is about to turn red; clear the intersection if you are already
      in it
    C: Speed up to beat the red light
    D: You have the right of way to continue for 5 more seconds
  answer: B
  explanation: A yellow light warns that the red signal is about to appear. If you
    are already in the intersection, you should continue through safely. If you have
    not entered, you should stop if it is safe to do so.
- id: 210
  category: signs_and_signals
  question: In Hawaii, what does a 'Circular' yellow sign with a black 'X' and the
    letters 'RR' indicate?
  choices:
    A: A sharp curve ahead
    B: A highway intersection
    C: A railroad crossing ahead
    D: A restricted roadway
  answer: C
  explanation: The round yellow sign with a black 'X' and 'RR' is a warning sign that
    you are approaching a railroad crossing.
- id: 211
  category: signs_and_signals
  question: What is the purpose of 'Sharrows' (a bicycle symbol with two chevrons)
    painted on Hawaii roads?
  choices:
    A: They indicate a lane reserved exclusively for bicycles
    B: They indicate a lane shared by both motorists and bicyclists
    C: They mark where bicyclists must stop for traffic
    D: They indicate a pedestrian-only zone
  answer: B
  explanation: Sharrows, or shared-lane markings, are used in Hawaii to indicate that
    motorists and bicyclists must share the travel lane.
- id: 212
  category: signs_and_signals
  question: In Hawaii, what must you do at a red light if you intend to turn right
    and there is no sign prohibiting it?
  choices:
    A: Slow down and turn without stopping
    B: Wait for the light to turn green
    C: Stop completely, yield to all traffic and pedestrians, then turn
    D: Turn only if there are no other cars within 100 feet
  answer: C
  explanation: In Hawaii, you may turn right on red after coming to a complete stop
    and yielding to pedestrians and other vehicles, unless a sign specifically prohibits
    the turn.
- id: 213
  category: signs_and_signals
  question: Which hand signal is used to indicate that a driver is stopping or slowing
    down?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward with palm to the rear
    D: Right arm waving out the window
  answer: C
  explanation: To signal stopping or slowing down, the driver extends the left arm
    out the window and points it downward with the palm facing the rear.
- id: 214
  category: signs_and_signals
  question: In Hawaii, if your vehicle's turn signals are not working, how should
    you signal a left turn using a hand signal?
  choices:
    A: Extend your left arm straight out the window
    B: Extend your left arm upward
    C: Extend your left arm downward
    D: Wave your hand in a circular motion
  answer: A
  explanation: According to the Hawaii Driver's Manual, a left turn is signaled by
    extending the left arm horizontally out of the window.
- id: 215
  category: signs_and_signals
  question: To signal a right turn using hand signals in Hawaii, what is the correct
    arm position?
  choices:
    A: Left arm straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm straight out
  answer: B
  explanation: The Hawaii Driver's Manual states that a right turn is signaled by
    extending the left arm upward at a 90-degree angle.
- id: 216
  category: signs_and_signals
  question: When using hand signals in Hawaii, how do you indicate that you are stopping
    or slowing down suddenly?
  choices:
    A: Extend your left arm upward
    B: Extend your left arm straight out
    C: Extend your left arm downward, palm to the rear
    D: Extend your right arm downward
  answer: C
  explanation: To signal a stop or decrease in speed, the Hawaii Driver's Manual requires
    extending the left arm downward with the palm facing the rear.
- id: 217
  category: signs_and_signals
  question: In Hawaii, what does a flashing red traffic light mean?
  choices:
    A: Slow down and proceed with caution
    B: Stop completely and proceed only when it is safe to do so
    C: The light is about to turn green
    D: Yield to all traffic, but do not stop
  answer: B
  explanation: 'A flashing red light in Hawaii has the same meaning as a stop sign:
    you must come to a complete stop and proceed only when safe.'
- id: 218
  category: signs_and_signals
  question: Under Hawaii law, what must a driver do when approaching a flashing yellow
    traffic signal?
  choices:
    A: Stop and wait for a green light
    B: Speed up to clear the intersection
    C: Proceed with caution
    D: Treat it like a four-way stop
  answer: C
  explanation: A flashing yellow signal in Hawaii warns drivers to slow down and proceed
    through the intersection with caution.
- id: 219
  category: signs_and_signals
  question: On Hawaii highways, what does a white diamond symbol painted on the pavement
    indicate?
  choices:
    A: The lane is reserved for high-occupancy vehicles (HOV)
    B: The lane is for emergency vehicles only
    C: A pedestrian crossing is ahead
    D: The lane is ending soon
  answer: A
  explanation: The diamond symbol indicates a preferential lane, most commonly used
    in Hawaii for HOV (carpool) lanes.
- id: 220
  category: signs_and_signals
  question: What does a solid white line painted between lanes of traffic moving in
    the same direction mean in Hawaii?
  choices:
    A: You are encouraged to change lanes
    B: You should stay in your lane; lane changes are discouraged
    C: The lane is for bicycles only
    D: Traffic is moving in opposite directions
  answer: B
  explanation: In Hawaii, solid white lines are used to separate lanes of traffic
    moving in the same direction where lane changing is discouraged for safety.
- id: 221
  category: signs_and_signals
  question: In Hawaii, what do double solid yellow lines in the center of the road
    signify?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: Passing is prohibited in both directions
    D: The road is one-way
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    traffic moving in either direction.
- id: 222
  category: signs_and_signals
  question: 'On some Honolulu streets, a ''Steady Red X'' signal over a lane means:'
  choices:
    A: The lane is about to change direction
    B: You must not drive in this lane
    C: The lane is for left turns only
    D: You may use the lane with caution
  answer: B
  explanation: In reversible lane systems (like those found on Kapiolani Blvd), a
    steady Red X means the lane is closed to traffic traveling in your direction.
- id: 223
  category: signs_and_signals
  question: What is the meaning of a triangular-shaped orange sign on the back of
    a vehicle?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is a slow-moving vehicle (traveling 25 mph or less)
    C: The vehicle is an oversized load
    D: The vehicle is a student driver
  answer: B
  explanation: The orange reflective triangle is the universal symbol for a slow-moving
    vehicle, which is defined as a vehicle that travels at speeds of 25 mph or less.
- id: 224
  category: signs_and_signals
  question: What do broken white lines on a Hawaii roadway indicate?
  choices:
    A: Traffic is moving in opposite directions
    B: The edge of the roadway
    C: Traffic is moving in the same direction and lane changes are permitted
    D: A no-passing zone
  answer: C
  explanation: Broken white lines separate lanes of traffic moving in the same direction
    where crossing the line to change lanes is permitted.
- id: 225
  category: signs_and_signals
  question: 'In Hawaii, a pentagon-shaped (five-sided) sign indicates:'
  choices:
    A: A stop sign
    B: A yield sign
    C: A school zone or school crossing
    D: A railroad crossing
  answer: C
  explanation: A five-sided sign is unique to school zones and school crossings in
    Hawaii and across the US.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 226
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 227
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
