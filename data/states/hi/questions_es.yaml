questions:
- id: 1
  category: vehicle_information
  question: ¿Qué constituye un "vehículo abandonado" según el manual del conductor
    de Hawái?
  choices:
    A: Cualquier vehículo dejado sin vigilancia en la carretera por más de 12 horas.
    B: Cualquier vehículo dejado sin vigilancia en la carretera por más de 24 horas.
    C: Cualquier vehículo estacionado ilegalmente en una zona de remolque.
    D: Cualquier vehículo dejado en propiedad privada por más de 48 horas.
  answer: B
  explanation: El manual define un Vehículo Abandonado como 'Cualquier vehículo dejado
    sin vigilancia en la carretera por más de 24 horas'.
- id: 2
  category: vehicle_information
  question: ¿Cuál de los siguientes requisitos es necesario para que un vehículo sea
    clasificado como vehículo de emergencia?
  choices:
    A: Una luz amarilla intermitente y un megáfono.
    B: Una luz blanca intermitente y una sirena.
    C: Una luz intermitente azul o roja y un sistema de sonido de advertencia.
    D: Una luz verde intermitente y un sistema de megafonía.
  answer: C
  explanation: Un Vehículo de Emergencia se define como aquel que está 'debidamente
    equipado con una luz intermitente azul o roja y un sistema de sonido de advertencia'.
- id: 3
  category: vehicle_information
  question: ¿Cómo se define una "bicicleta" en términos del diámetro de la rueda?
  choices:
    A: 12 pulgadas o más
    B: 14 pulgadas o más
    C: 16 pulgadas o más
    D: 20 pulgadas o más
  answer: C
  explanation: Una bicicleta se define como 'Un dispositivo de dos o tres ruedas que
    tienen un diámetro de 16" o más, propulsado por fuerza humana'.
- id: 4
  category: vehicle_information
  question: Un "autobús" se define como un vehículo motorizado diseñado para transportar
    a más de ¿cuántos pasajeros?
  choices:
    A: 6 pasajeros
    B: 8 pasajeros
    C: 10 pasajeros
    D: 15 pasajeros
  answer: C
  explanation: El manual define un Autobús como 'Todo vehículo motorizado diseñado
    para transportar a más de diez pasajeros y utilizado para el transporte de personas'.
- id: 5
  category: safe_driving_rules
  question: En un distrito comercial, los edificios destinados a fines comerciales
    o industriales deben ocupar al menos ¿cuánto frente a lo largo de un tramo de
    carretera de 600 pies?
  choices:
    A: 100 pies en un lado
    B: 200 pies colectivamente en ambos lados
    C: 300 pies en un lado o 300 pies colectivamente en ambos lados
    D: 400 pies en un lado
  answer: C
  explanation: Un Distrito Comercial requiere edificios que 'ocupen al menos trescientos
    pies de frente en un lado o trescientos pies colectivamente en ambos lados de
    la carretera' dentro de un tramo de 600 pies.
- id: 6
  category: license_system
  question: 'Un solo vehículo se considera un Vehículo Motorizado Comercial para fines
    de licencia de conducir si tiene una clasificación de peso bruto vehicular (GVWR)
    de al menos:'
  choices:
    A: 10,001 libras
    B: 15,000 libras
    C: 20,001 libras
    D: 26,001 libras
  answer: D
  explanation: Un Vehículo Motorizado Comercial incluye un solo vehículo que 'tiene
    una clasificación de peso bruto vehicular de 26,001 libras o más'.
- id: 7
  category: license_system
  question: Un vehículo de cualquier GVWR se considera un Vehículo Motorizado Comercial
    si está diseñado para transportar a ¿cuántos ocupantes, incluyendo al conductor?
  choices:
    A: 10 o más
    B: 12 o más
    C: 15 o más
    D: 16 o más
  answer: D
  explanation: Un vehículo es un Vehículo Motorizado Comercial 'si el vehículo (de
    cualquier GVWR), está diseñado para transportar a dieciséis o más ocupantes, incluyendo
    al conductor'.
- id: 8
  category: license_system
  question: 'Un vehículo de cualquier GVWR se clasifica como Vehículo Motorizado Comercial
    si se utiliza para:'
  choices:
    A: Transportar productos agrícolas a través de las fronteras estatales.
    B: Transportar materiales peligrosos que requieran rotulación (placarding).
    C: Comercio interestatal únicamente.
    D: Remolcar vehículos de menos de 10,000 libras.
  answer: B
  explanation: Un vehículo se considera un Vehículo Motorizado Comercial 'si el vehículo
    (de cualquier GVWR), se utiliza en el transporte de materiales peligrosos que
    requieran rotulación'.
- id: 9
  category: license_system
  question: ¿Cuántos documentos se requieren para probar la residencia principal al
    solicitar una licencia de conducir?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: 'El manual establece explícitamente: ''Se requieren dos documentos
    para probar la residencia principal''.'
- id: 10
  category: license_system
  question: 'Según el manual, un certificado de nacimiento puede documentar el nombre
    legal de una persona, la fecha de nacimiento y la:'
  choices:
    A: Residencia principal
    B: Número de seguro social
    C: Presencia legal
    D: Historial de conducción
  answer: C
  explanation: 'El manual señala que algunos documentos sirven para más de un propósito:
    ''Por ejemplo, un certificado de nacimiento puede documentar el nombre legal de
    una persona, la fecha de nacimiento y la presencia legal''.'
- id: 11
  category: vehicle_information
  question: ¿Qué manual ofrece una cobertura exhaustiva de las leyes y técnicas de
    operación relacionadas con las motocicletas?
  choices:
    A: DOTH2044
    B: DOTH2053
    C: DOTH1022
    D: DOTH3055
  answer: B
  explanation: 'El texto establece: ''Un Manual del Operador de Motocicletas por separado,
    DOTH2053, está disponible para proporcionar una cobertura más exhaustiva de las
    leyes y técnicas de operación relacionadas con las motocicletas''.'
- id: 12
  category: license_system
  question: ¿Cuál es el número de documento del Manual del Conductor para la Licencia
    de Conducir de Vehículos Comerciales?
  choices:
    A: DOTH2044
    B: DOTH2053
    C: DOTH1912
    D: DOTH2000
  answer: A
  explanation: 'El texto establece: ''Un Manual del Conductor para la Licencia de
    Conducir de Vehículos Comerciales por separado, DOTH2044, está disponible...'''
- id: 13
  category: vehicle_information
  question: ¿Una bicicleta se define como un dispositivo impulsado por fuerza humana
    con cuántas ruedas?
  choices:
    A: Exactamente dos ruedas
    B: Dos o tres ruedas
    C: Dos o cuatro ruedas
    D: Tres o cuatro ruedas
  answer: B
  explanation: El manual define una bicicleta como 'Un dispositivo con dos o tres
    ruedas... impulsado por fuerza humana'.
- id: 14
  category: license_system
  question: 'Una combinación de vehículos de motor se considera un Vehículo de Motor
    Comercial (CMV) si tiene una clasificación de peso bruto combinado de 26,001 libras
    o más, incluyendo una unidad o unidades remolcadas con una clasificación de peso
    bruto vehicular de más de:'
  choices:
    A: 5,000 libras
    B: 8,000 libras
    C: 10,000 libras
    D: 15,000 libras
  answer: C
  explanation: Un Vehículo de Motor Comercial incluye una combinación de vehículos
    con un GCWR de 26,001+ libras 'incluyendo una unidad o unidades remolcadas con
    una clasificación de peso bruto vehicular de más de 10,000 libras'.
- id: 15
  category: driver_testing
  question: En la Ciudad y el Condado de Honolulu, ¿cuáles son las horas estándar
    de examen para una licencia de conducir?
  choices:
    A: 7:45 a.m. a 4:00 p.m.
    B: 8:00 a.m. a 3:30 p.m.
    C: 9:00 a.m. a 5:00 p.m.
    D: 8:00 a.m. a 4:00 p.m.
  answer: B
  explanation: Según la sección de Honolulu del manual, el horario de atención es
    de 8:00 a.m. a 4:00 p.m., pero las 'Horas de Examen' son específicamente de '8:00
    a.m. a 3:30 p.m.'
- id: 16
  category: safe_driving_rules
  question: Según el manual, ¿cuál es la definición de un cruce de peatones?
  choices:
    A: Un área oficialmente apartada dentro de una calzada para el uso exclusivo de
      los peatones.
    B: Esa parte de una calzada en una intersección incluida dentro de las conexiones
      de las líneas laterales de las aceras en lados opuestos de la carretera.
    C: Todo el ancho entre las líneas divisorias de cada vía mantenida públicamente.
    D: Un carril designado para que los vehículos de motor comerciales carguen y descarguen
      pasajeros.
  answer: B
  explanation: Un cruce de peatones se define como esa parte de una calzada en una
    intersección incluida dentro de las conexiones de las líneas laterales de las
    aceras en lados opuestos de la carretera, medida desde los bordillos o bordes
    de la calzada transitable.
- id: 17
  category: license_system
  question: ¿Bajo qué condición está exenta una persona de 13 años de obtener una
    licencia de conducir de Hawái?
  choices:
    A: Al conducir un ciclomotor (moped) a la escuela.
    B: Cuando es supervisado por un conductor con licencia que tiene al menos 21 años.
    C: Al operar un tractor agrícola o un implemento de labranza temporalmente en
      una carretera.
    D: Al conducir un vehículo del gobierno federal en una base militar.
  answer: C
  explanation: Usted está exento de obtener una licencia de conducir de Hawái cuando
    tiene trece años de edad o más y opera cualquier máquina de carretera, tractor
    agrícola o implemento de labranza temporalmente en una carretera.
- id: 18
  category: penalties_and_points
  question: ¿Cuánto tiempo debe esperar una persona para obtener la licencia después
    de ser condenada por conducir ebria mientras no tenía licencia?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: No se le puede otorgar una licencia para operar un vehículo de motor
    en Hawái por un período de dos años después de haber sido condenado por conducir
    ebrio mientras no tenía licencia.
- id: 19
  category: license_system
  question: ¿Cuál de los siguientes le impedirá obtener una licencia de conducir de
    Hawái?
  choices:
    A: Tener citaciones de tráfico pendientes.
    B: Tener 17 años de edad.
    C: No tener un Número de Seguro Social.
    D: Tener una licencia de conducir válida de otro estado de EE. UU.
  answer: A
  explanation: No se le puede otorgar una licencia para operar un vehículo de motor
    en Hawái cuando tiene citaciones de tráfico pendientes.
- id: 20
  category: license_system
  question: Si no puede proporcionar un Número de Seguro Social al solicitar una licencia,
    ¿qué tipo de licencia puede obtener?
  choices:
    A: Una licencia provisional
    B: Una licencia de conducir comercial
    C: Una licencia de conducir de propósito limitado
    D: Solo un permiso de instrucción
  answer: C
  explanation: Los conductores que elijan no proporcionar un número de seguro social
    o que no puedan proporcionar uno pueden obtener una licencia de conducir de propósito
    limitado. Esta licencia será válida únicamente para conducir.
- id: 21
  category: license_system
  question: ¿Cuál es la edad mínima requerida para ser elegible para un permiso de
    instrucción en Hawái?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 17 años
  answer: B
  explanation: Debe tener al menos 15 años para ser elegible para un permiso de instrucción.
- id: 22
  category: driver_responsibility
  question: Al conducir con un permiso de instrucción en un vehículo de pasajeros
    estándar, ¿dónde debe sentarse el conductor con licencia que supervisa?
  choices:
    A: En el asiento trasero directamente detrás del conductor
    B: En el asiento delantero derecho
    C: En cualquier lugar del vehículo
    D: En un vehículo separado que lo siga de cerca
  answer: B
  explanation: En todos los vehículos, excepto en las motocicletas, el conductor con
    licencia debe sentarse en el asiento delantero derecho.
- id: 23
  category: license_system
  question: Si es menor de 18 años, ¿cuánto tiempo debe operar con una licencia provisional
    antes de ser elegible para una licencia de conducir de clase 3?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 9 meses
    D: Al menos 1 año
  answer: B
  explanation: Si es menor de 18 años, debe operar con una licencia provisional durante
    al menos 6 meses antes de ser elegible para una licencia de conducir de clase
    3.
- id: 24
  category: license_system
  question: ¿Qué clase de licencia se requiere para operar un ciclomotor (moped) en
    las autopistas de Hawái?
  choices:
    A: Clase 1
    B: Clase 2
    C: Clase 3
    D: Clase 4
  answer: A
  explanation: Debe tener una licencia de clase 1 para operar un ciclomotor en las
    autopistas de Hawái.
- id: 25
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia de conducir estándar
    de Clase 3 en Hawái?
  choices:
    A: 15 años
    B: 16 años
    C: 17 años
    D: 18 años
  answer: C
  explanation: Para obtener una licencia de clase 3, debe tener al menos 17 años.
- id: 26
  category: license_system
  question: ¿Cuál de los siguientes datos de información médica puede indicarse en
    una licencia de conducir de Hawái?
  choices:
    A: Tipo de sangre
    B: Alergias a medicamentos
    C: Directiva anticipada de atención médica
    D: Nombre del médico de atención primaria
  answer: C
  explanation: La licencia también indica si el conductor es menor de 21 años, si
    es un conductor comercial y si ha dado su consentimiento para ser donante de órganos
    o si tiene una directiva anticipada de atención médica.
- id: 27
  category: driver_testing
  question: ¿Bajo qué condición podrían exonerarse los exámenes de conocimientos y
    de carretera para un solicitante de licencia de Clase 3?
  choices:
    A: Si el solicitante tiene al menos 18 años y posee una licencia válida de otro
      estado de los EE. UU.
    B: Si el solicitante ha tenido un permiso de instrucción por más de un año.
    C: Si el solicitante es menor de 18 años pero ha completado la educación vial.
    D: Si el solicitante está solicitando una licencia de propósito limitado.
  answer: A
  explanation: Los exámenes de conocimientos y de carretera pueden exonerarse para
    los solicitantes de licencias de clase 1 a 3 si el solicitante tiene al menos
    18 años y posee una licencia de conducir válida emitida por otro estado de los
    Estados Unidos.
- id: 28
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir extranjera de un
    país con convenio, acompañada de un Permiso Internacional de Conducir, después
    de la fecha de entrada a los EE. UU.?
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Las licencias de conducir extranjeras de países con convenio acompañadas
    de un Permiso Internacional de Conducir emitido en la jurisdicción extranjera
    son válidas por un año después de la fecha de entrada a los EE. UU.
- id: 29
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a una licencia
    de conducir de propósito limitado?
  choices:
    A: Puede usarse para registrarse para votar.
    B: Es aceptable para fines federales oficiales como abordar un avión.
    C: Establece la elegibilidad para el empleo.
    D: Es solo una licencia para conducir un vehículo motorizado.
  answer: D
  explanation: El manual establece que una licencia de conducir de propósito limitado
    no es aceptable para fines federales, empleo, registro de votantes o beneficios
    públicos; es solo una licencia para conducir un vehículo motorizado.
- id: 30
  category: driver_testing
  question: Durante su examen de desempeño del conductor, ¿quién tiene permitido viajar
    en el vehículo con usted y el examinador?
  choices:
    A: Un instructor de manejo con licencia
    B: Un padre o tutor legal
    C: No se permiten pasajeros
    D: Cualquier conductor con licencia mayor de 21 años
  answer: C
  explanation: El manual establece explícitamente con respecto al examen de desempeño
    del conductor que "No se permiten pasajeros durante las pruebas".
- id: 31
  category: license_system
  question: ¿Cuánto tiempo debe un menor tener un permiso de instrucción válido antes
    de solicitar una licencia provisional?
  choices:
    A: 90 días
    B: 180 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Debe tener un permiso de instrucción válido por un período de 180 días
    antes de solicitar una licencia provisional.
- id: 32
  category: safe_driving_rules
  question: Si conduce con un permiso de instrucción entre las 11:00 p.m. y las 5:00
    a.m., ¿quién debe acompañarlo?
  choices:
    A: Cualquier conductor con licencia de al menos 21 años de edad
    B: Un instructor de manejo con licencia
    C: Su padre, madre o tutor legal
    D: Un conductor con licencia que tenga al menos 25 años
  answer: C
  explanation: El manual establece que si conduce con un permiso de instrucción entre
    las 11:00 p.m. y las 5:00 a.m., debe estar acompañado por su padre, madre o tutor
    legal.
- id: 33
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener una licencia de conducir
    provisional?
  choices:
    A: 15 años y medio
    B: 16 años
    C: 17 años
    D: 18 años
  answer: B
  explanation: El manual establece que la edad mínima para obtener una licencia provisional
    es de 16 años.
- id: 34
  category: license_system
  question: Bajo una licencia provisional, ¿cuál es la restricción para transportar
    pasajeros menores de 18 años que no sean miembros del hogar?
  choices:
    A: No puede transportar a ningún menor de 18 años que no sea miembro del hogar.
    B: Solo puede transportar a una persona menor de 18 años que no sea miembro del
      hogar.
    C: Puede transportar hasta tres personas menores de 18 años que no sean miembros
      del hogar.
    D: No hay restricciones durante las horas del día.
  answer: B
  explanation: Su licencia provisional le permite transportar solo a una persona menor
    de 18 años que no sea miembro del hogar.
- id: 35
  category: vehicle_information
  question: Una licencia de conducir Clase 3 le permite conducir un solo vehículo
    con una Clasificación de Peso Bruto Vehicular (GVWR) de 18,000 libras o menos
    que esté diseñado para transportar un máximo de ¿cuántos pasajeros?
  choices:
    A: 10 pasajeros o menos
    B: 12 pasajeros o menos
    C: 15 pasajeros o menos
    D: 16 pasajeros o más
  answer: C
  explanation: Una licencia Clase 3 es para cualquier vehículo individual con un GVWR
    de 18,000 libras o menos, y vehículos diseñados para transportar 15 pasajeros
    o menos, incluyendo al conductor.
- id: 36
  category: driver_testing
  question: ¿Cuál de los siguientes vehículos está explícitamente prohibido para ser
    utilizado en una prueba de desempeño de Categoría 3?
  choices:
    A: Un camión ligero
    B: Un autobús diseñado para transportar a 15 ocupantes
    C: Un automóvil de pasajeros
    D: Un autociclo (autocycle)
  answer: D
  explanation: 'El manual establece: "Aunque puede conducir un autociclo (autocycle)
    con una licencia de conducir de categoría 3, no se le permite usar un autociclo
    para la prueba de desempeño de categoría 3".'
- id: 37
  category: driver_responsibility
  question: Si cambia su dirección de residencia, ¿dentro de cuántos días debe notificar
    por escrito al examinador de conductores del condado?
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Cada vez que cambie su dirección de residencia debe, dentro de los
    30 días, notificar por escrito al examinador de conductores del condado su dirección
    antigua y la nueva.
- id: 38
  category: license_system
  question: ¿Cuál es el período de gracia para conducir con una licencia de conducir
    del estado de Hawái vencida?
  choices:
    A: No hay período de gracia; la licencia es nula después de la fecha de vencimiento.
    B: 30 días después de la fecha de vencimiento.
    C: 6 meses después de la fecha de vencimiento.
    D: 1 año después de la fecha de vencimiento.
  answer: A
  explanation: El manual enfatiza que "TODA LICENCIA DE CONDUCIR DEL ESTADO DE HAWÁI
    ES NULA DESPUÉS DE LA FECHA DE VENCIMIENTO. NO HAY PERÍODO DE GRACIA".
- id: 39
  category: driver_testing
  question: Durante la Prueba de Vehículos Motorizados Ligeros (Categoría 3), ¿se
    le requerirá demostrar su capacidad para hacer cuál de las siguientes acciones?
  choices:
    A: Realizar un giro de tres puntos en una zona residencial
    B: Poner su vehículo en movimiento en una pendiente ligera sin rodar hacia atrás
    C: Conducir de manera segura en una carretera interestatal
    D: Retroceder en línea recta durante 50 pies
  answer: B
  explanation: La prueba de Categoría 3 requiere que demuestre la capacidad de "ser
    capaz de poner su vehículo en movimiento en una pendiente ligera sin rodar hacia
    atrás".
- id: 40
  category: license_system
  question: ¿Con qué frecuencia se le permite renovar su licencia de conducir por
    correo?
  choices:
    A: Cada vez que venza
    B: Solo si se encuentra fuera del estado
    C: Una vez, pero debe presentarse en persona en cada otra renovación
    D: No puede renovar su licencia por correo
  answer: C
  explanation: 'El manual establece: "Puede renovar su licencia una vez por correo,
    pero debe presentarse ante el examinador de conductores en cada otra renovación".'
- id: 41
  category: license_system
  question: ¿Qué indica el código de restricción "G" en una licencia de conducir de
    Hawái?
  choices:
    A: Se deben usar lentes correctores
    B: No se permiten vehículos de transmisión manual
    C: Limitado solo a horas del día
    D: Se requiere espejo exterior
  answer: C
  explanation: Según la tabla de Restricciones de Licencia, el código "G" significa
    "LIMITADO SOLO A HORAS DEL DÍA".
- id: 42
  category: license_system
  question: ¿Qué sucederá si el Registro Nacional de Conductores (NDR) muestra que
    su licencia ha sido suspendida o revocada en otro estado?
  choices:
    A: Se le emitirá una licencia de conducir restringida de Hawái.
    B: No se le emitirá una licencia de conducir de Hawái.
    C: Debe pagar una tarifa adicional para obtener una licencia de Hawái.
    D: Se le requerirá tomar un curso de conducción correctiva.
  answer: B
  explanation: Según el manual, si los registros del NDR muestran que se le ha suspendido
    o revocado una licencia en otro estado o en D.C., no se le emitirá una licencia
    de conducir de Hawái.
- id: 43
  category: license_system
  question: ¿Qué indica la anotación "AHCD" en una licencia de conducir de Hawái?
  choices:
    A: Conductor Comercial de Carretera Autorizado
    B: Dispositivo de Control Automático de Carretera
    C: Directiva Anticipada de Atención Médica (AHCD)
    D: Conductor con Condición de Discapacidad Aprobada
  answer: C
  explanation: Poner "AHCD" en su licencia significa Directiva Anticipada de Atención
    Médica (Advance Health Care Directive), lo cual alerta al personal médico de que
    usted tiene instrucciones especiales para la atención de su salud en caso de una
    enfermedad o accidente grave.
- id: 44
  category: driver_responsibility
  question: ¿Cuándo se le requiere mostrar su licencia de conducir a un oficial de
    policía?
  choices:
    A: Solo cuando esté involucrado en un accidente de tráfico.
    B: Solo si está conduciendo un vehículo motorizado comercial.
    C: Solo cuando se le emita una citación de tráfico.
    D: A petición, mientras opera un vehículo motorizado o ciclomotor (moped).
  answer: D
  explanation: El manual establece que debe llevar consigo una licencia de conducir
    válida en todo momento mientras opera un vehículo motorizado o ciclomotor y debe
    mostrarla a petición de un oficial de policía.
- id: 45
  category: penalties_and_points
  question: ¿Cuál es una diferencia clave entre una "infracción de tráfico" y un "delito
    de tráfico" en Hawái?
  choices:
    A: Los delitos de tráfico conllevan la posibilidad de cárcel y requieren una comparecencia
      ante el tribunal.
    B: Las infracciones de tráfico siempre requieren una comparecencia obligatoria
      ante el tribunal.
    C: Los delitos de tráfico están sujetos a procedimientos civiles en lugar de penales.
    D: Las infracciones de tráfico resultan en la revocación inmediata de la licencia.
  answer: A
  explanation: El manual explica que una persona que recibe una citación por un delito
    de tráfico puede enfrentar la posibilidad de cárcel y, por lo tanto, se requieren
    comparecencias ante el tribunal, mientras que las infracciones de tráfico son
    procedimientos civiles menos graves.
- id: 46
  category: vehicle_information
  question: 'Según la definición del manual del conductor de Hawái, un ciclomotor
    (moped) tiene un motor no mayor de:'
  choices:
    A: Un caballo de fuerza
    B: Dos caballos de fuerza
    C: Tres caballos de fuerza
    D: Cinco caballos de fuerza
  answer: B
  explanation: Un ciclomotor se define como un dispositivo de dos o tres ruedas con
    un motor no mayor de dos caballos de fuerza.
- id: 47
  category: license_system
  question: ¿Qué tipo de licencia de conducir se requiere para operar un ciclomotor
    (moped) en las calles y carreteras públicas de Hawái?
  choices:
    A: Solo es válida una licencia de Categoría 1 (ciclomotores).
    B: Se requiere una licencia de conducir comercial.
    C: Cualquier categoría de licencia de conducir.
    D: No se requiere licencia para operar un ciclomotor.
  answer: C
  explanation: Se requiere tener una licencia de conducir (de cualquier categoría)
    para operar un ciclomotor en las calles y carreteras públicas. Si no tiene una,
    puede obtener una licencia de Categoría 1.
- id: 48
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos de iluminación está prohibido en un vehículo
    que no sea de emergencia?
  choices:
    A: Una luz blanca que se vea desde el frente.
    B: Una luz roja que se vea desde la parte trasera.
    C: Luces de advertencia amarillas visibles desde el exterior.
    D: Una luz azul visible fuera del vehículo.
  answer: D
  explanation: El equipo ilegal incluye una luz roja que se vea desde el frente, o
    una luz azul visible fuera del vehículo, excepto en vehículos de emergencia autorizados.
- id: 49
  category: vehicle_information
  question: ¿Cuál de las siguientes modificaciones al sistema de escape es ilegal?
  choices:
    A: Instalar un recorte de silenciador (muffler cut-out) o una derivación (by-pass).
    B: Reemplazar un silenciador por uno del fabricante de equipo original.
    C: Reparar una fuga en el tubo de escape.
    D: Instalar un pestillo secundario en el capó.
  answer: A
  explanation: El manual prohíbe un recorte de silenciador o derivación, o un silenciador
    que haga más ruido que el silenciador del fabricante de equipo original.
- id: 50
  category: vehicle_information
  question: ¿Con qué frecuencia deben tener la mayoría de los vehículos motorizados
    que operan en carreteras públicas una Inspección Periódica de Vehículos Motorizados
    (PMVI) oficial?
  choices:
    A: Al menos una vez cada seis meses.
    B: Al menos una vez al año.
    C: Una vez cada dos años.
    D: Solo cuando el vehículo cambia de propietario.
  answer: B
  explanation: Todos los vehículos motorizados que operan en las carreteras públicas
    deben tener una Inspección Periódica de Vehículos Motorizados (PMVI) oficial,
    al menos una vez al año (con excepciones para ambulancias y vehículos nuevos).
- id: 51
  category: vehicle_information
  question: ¿Cuándo necesitan los vehículos nuevos su primera inspección de seguridad
    después de su inspección inicial en la fecha en que se venden por primera vez?
  choices:
    A: Seis meses después
    B: Un año después
    C: Dos años después
    D: Tres años después
  answer: C
  explanation: Los vehículos nuevos no necesitan ser inspeccionados hasta dos años
    después de su inspección inicial en la fecha en que se venden por primera vez.
- id: 52
  category: vehicle_information
  question: ¿Qué documento se requiere para aprobar la inspección de seguridad de
    Hawái (PMVI)?
  choices:
    A: Una factura de venta del vehículo
    B: Una tarjeta de identificación de seguro de automóvil del estado de Hawái
    C: Una directiva anticipada de atención médica
    D: Un emblema de vehículo reconstruido del condado
  answer: B
  explanation: Se requiere una tarjeta de identificación de seguro de automóvil del
    estado de Hawái para aprobar la inspección.
- id: 53
  category: vehicle_information
  question: Al realizar una prueba de frenos común a una velocidad de 4 a 8 mph, ¿qué
    debe observar?
  choices:
    A: El vehículo debe detenerse en un tramo de 50 pies.
    B: Los frenos antibloqueo deben activarse de inmediato.
    C: El vehículo no debe desviarse hacia ningún lado.
    D: El pedal del freno debe bombear automáticamente.
  answer: C
  explanation: Una prueba de frenos común consiste en aplicar los frenos con bastante
    fuerza a una velocidad de 4 a 8 mph. El vehículo no debe desviarse hacia ningún
    lado.
- id: 54
  category: safe_driving_rules
  question: ¿Qué debe hacer si las señales direccionales de su vehículo fallan mientras
    conduce?
  choices:
    A: Conducir solo durante las horas del día.
    B: Usar la bocina para indicar los giros.
    C: Encender y apagar los faros delanteros antes de girar.
    D: Usar señales manuales hasta que pueda repararlas.
  answer: D
  explanation: Si las señales direccionales fallan, el manual indica a los conductores
    que utilicen señales manuales hasta que puedan repararlas.
- id: 55
  category: safe_driving_rules
  question: Según la ley de Hawái, ¿quién está obligado a usar el cinturón de seguridad
    en el asiento delantero de un vehículo?
  choices:
    A: Solo el conductor
    B: Solo los pasajeros menores de 18 años
    C: Todos los ocupantes del asiento delantero
    D: Solo los ocupantes de vehículos sin bolsas de aire
  answer: C
  explanation: Todos los ocupantes del asiento delantero están obligados por ley (291-11.6,
    HRS) a usar el cinturón de seguridad.
- id: 56
  category: safe_driving_rules
  question: ¿Cuál es el requisito del cinturón de seguridad para personas de 4 a 17
    años en Hawái?
  choices:
    A: Deben estar en un sistema de retención infantil.
    B: Deben llevar puesto el cinturón en los asientos traseros.
    C: No están obligados a usar el cinturón de seguridad si hay bolsas de aire presentes.
    D: Pueden viajar en el asiento delantero sin cinturón si están supervisados.
  answer: B
  explanation: El manual establece que los niños menores de 4 años deben estar en
    un sistema de retención infantil, y las personas de 4 a 17 años deben llevar puesto
    el cinturón en los asientos traseros.
- id: 57
  category: vehicle_information
  question: ¿Cuál es el propósito principal de las bolsas de aire según el manual?
  choices:
    A: Reemplazar la necesidad de cinturones de seguridad
    B: Proporcionar protección suplementaria a los ocupantes en un primer impacto
    C: Proteger contra múltiples impactos posteriores
    D: Evitar que el vehículo vuelque
  answer: B
  explanation: El manual establece que las bolsas de aire son una protección suplementaria
    para los ocupantes en un primer impacto, y los ocupantes deben confiar en los
    cinturones para protegerse si ocurren impactos posteriores.
- id: 58
  category: vehicle_information
  question: ¿Cuánto juego libre es aceptable en un volante si su vehículo tiene dirección
    asistida?
  choices:
    A: No más de 1 pulgada
    B: No más de 2 pulgadas
    C: No más de 3 pulgadas
    D: No más de 4 pulgadas
  answer: B
  explanation: Según el manual, no debe haber más de dos pulgadas de juego libre en
    el volante si tiene dirección asistida (verificado con el motor en marcha).
- id: 59
  category: vehicle_information
  question: Al usar una moneda de un centavo de Lincoln para revisar la banda de rodadura
    de los neumáticos, ¿cómo sabe que el neumático debe ser reemplazado?
  choices:
    A: Si la parte superior de la cabeza de Lincoln es visible
    B: Si la moneda se cae en la banda de rodadura
    C: Si la cara de Lincoln está completamente cubierta
    D: Si la banda de rodadura es más profunda que la moneda
  answer: A
  explanation: El manual aconseja colocar una moneda de un centavo de Lincoln boca
    abajo dentro de la banda de rodadura. Si la parte superior de la cabeza de Lincoln
    es visible, el neumático tiene menos de 1/16 de pulgada de banda de rodadura y
    debe ser reemplazado.
- id: 60
  category: license_system
  question: ¿Dónde debe registrar el vehículo motorizado que opera en las vías públicas
    de Hawái?
  choices:
    A: En la ciudad capital de Honolulu
    B: En el condado donde compró originalmente el vehículo
    C: En el condado en el que opera el vehículo
    D: En cualquier oficina del Departamento de Transporte del estado
  answer: C
  explanation: La ley de Hawái exige que el vehículo motorizado que opera en las vías
    públicas esté registrado en el condado en el que opera el vehículo.
- id: 61
  category: license_system
  question: ¿Qué debe tener su vehículo antes de que pueda ser registrado en Hawái?
  choices:
    A: Un juego de neumáticos nuevos
    B: Un certificado de inspección de seguridad vigente y válido
    C: Una placa de matrícula personalizada
    D: Un recibo de cambio de aceite reciente
  answer: B
  explanation: El manual establece explícitamente que su vehículo debe tener un certificado
    de inspección de seguridad vigente y válido antes de que pueda ser registrado.
- id: 62
  category: license_system
  question: ¿Quién conserva el certificado de propiedad (título) de Hawái si existe
    un préstamo activo sobre el vehículo?
  choices:
    A: El comprador
    B: La oficina de registro del condado
    C: El propietario legal o el titular del gravamen (lien holder)
    D: La compañía de seguros
  answer: C
  explanation: El certificado de propiedad o título de Hawái es conservado por el
    propietario legal o el titular del gravamen hasta que se satisfaga el gravamen
    (se pague el préstamo del vehículo).
- id: 63
  category: license_system
  question: ¿Con qué frecuencia vencen los registros de vehículos motorizados en Hawái?
  choices:
    A: Cada 6 meses
    B: Anualmente al final del duodécimo mes
    C: Cada 2 años
    D: Cada 5 años en su cumpleaños
  answer: B
  explanation: Los registros de vehículos motorizados son escalonados y vencen anualmente
    al final del duodécimo mes.
- id: 64
  category: license_system
  question: Si cambia su dirección, ¿cuántos días tiene para notificar a la agencia
    del condado correspondiente?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Siempre que cambie la dirección del propietario registrado, este debe
    notificar por escrito a la agencia del condado correspondiente dentro de los treinta
    (30) días posteriores al cambio.
- id: 65
  category: license_system
  question: ¿Qué se requiere si cambia el nombre de un propietario registrado de un
    vehículo motorizado?
  choices:
    A: Enviar una carta por correo a la agencia del condado dentro de los 10 días
    B: Presentarse en persona en la agencia del condado dentro de los 30 días con
      el comprobante del cambio
    C: Actualizar el nombre en línea dentro de los 60 días
    D: Esperar hasta la próxima renovación del registro para actualizarlo
  answer: B
  explanation: Si el nombre de un propietario registrado cambia, debe presentarse
    en persona en la agencia del condado correspondiente dentro de los treinta (30)
    días con el comprobante del cambio de nombre.
- id: 66
  category: license_system
  question: ¿Quién está exento de pagar las tasas de registro de vehículos en Hawái?
  choices:
    A: Todo el personal militar en servicio activo
    B: Personas mayores de 65 años
    C: Un veterano con una discapacidad médica del 100% con la documentación adjunta
    D: Cualquier persona que conduzca un vehículo híbrido o eléctrico
  answer: C
  explanation: Según el manual, un veterano con una discapacidad médica del 100% con
    la documentación adjunta está exento de pagar las tasas de registro.
- id: 67
  category: license_system
  question: ¿Qué requisito específico debe cumplirse al comprar un vehículo en un
    país extranjero para registrarlo en Hawái?
  choices:
    A: Debe tener un Número de Identificación del Vehículo de 15 caracteres
    B: Debe tener una etiqueta de certificación del fabricante que indique el cumplimiento
      con las normas de EE. UU.
    C: Debe estar pintado de un color de fábrica estándar
    D: Debe tener menos de 50,000 millas
  answer: B
  explanation: Cuando compra un vehículo en un país extranjero, el vehículo debe tener
    una etiqueta de certificación del fabricante que indique el cumplimiento con las
    normas de EE. UU. y un Número de Identificación del Vehículo (VIN) de 17 caracteres.
- id: 68
  category: license_system
  question: ¿Cuál es la duración máxima de un permiso de registro temporal para un
    vehículo de fuera del estado traído a Hawái?
  choices:
    A: 30 días
    B: 6 meses
    C: 12 meses
    D: 2 años
  answer: C
  explanation: Bajo ninguna circunstancia se emitirá un permiso (registro temporal)
    que exceda un período de doce meses.
- id: 69
  category: vehicle_information
  question: ¿Qué vehículos están obligados a mostrar una placa de matrícula ÚNICAMENTE
    en la parte trasera?
  choices:
    A: Automóviles de pasajeros y camiones
    B: Motocicletas, remolques y semirremolques
    C: Autobuses y vehículos comerciales
    D: Todos los vehículos motorizados
  answer: B
  explanation: Las motocicletas, remolques y semirremolques deben mostrar una placa
    de matrícula en la parte trasera; todos los demás vehículos deben mostrar una
    placa de matrícula tanto en la parte delantera como en la trasera.
- id: 70
  category: vehicle_information
  question: ¿Dónde deben mostrarse la placa de matrícula y la calcomanía de inspección
    en un ciclomotor (moped)?
  choices:
    A: En el manubrio delantero
    B: En el panel lateral izquierdo
    C: En la parte trasera del ciclomotor
    D: Debajo del asiento
  answer: C
  explanation: Los ciclomotores deben ser inspeccionados, registrados y tener licencia.
    La placa de matrícula y la calcomanía de inspección deben mostrarse en la parte
    trasera del ciclomotor.
- id: 71
  category: driver_responsibility
  question: Según el manual, ¿qué debe hacer una persona si acaba de tener una discusión
    violenta o está enojada antes de conducir?
  choices:
    A: Conducir más rápido para aliviar el estrés
    B: Tomarse un tiempo para "calmarse" antes de conducir
    C: Poner música fuerte para distraerse
    D: Solo conducir por caminos conocidos
  answer: B
  explanation: Las personas que acaban de tener discusiones violentas, o que están
    enojadas o de duelo, necesitan algo de tiempo para "calmarse" o para adaptarse
    antes de conducir un automóvil.
- id: 72
  category: driver_responsibility
  question: Según las estadísticas de accidentes, ¿qué grupo de edad de conductores
    tiene el menor número de accidentes?
  choices:
    A: Menores de 20 años de edad
    B: De 25 a 30 años de edad
    C: De 50 a 54 años de edad
    D: Mayores de 75 años de edad
  answer: C
  explanation: El manual establece que a medida que aumenta la edad del conductor,
    este sigue teniendo menos accidentes hasta aproximadamente los 50 a 54 años de
    edad, y estos conductores tienen el menor número de accidentes de cualquier grupo
    de edad.
- id: 73
  category: driver_responsibility
  question: ¿Qué debe hacer si está enojado, de duelo o experimenta emociones fuertes
    antes de conducir?
  choices:
    A: Conducir más rápido para llegar antes a su destino
    B: Tomarse un tiempo para calmarse o dejar que otra persona conduzca
    C: Escuchar música fuerte para distraerse
    D: Bajar las ventanillas para que entre aire fresco mientras conduce
  answer: B
  explanation: El manual aconseja que las personas que están enojadas o de duelo necesitan
    algo de tiempo para "calmarse" antes de conducir, y si está preocupado, enfermo,
    nervioso, asustado, enojado o deprimido, debe dejar que otra persona conduzca.
- id: 74
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un efecto común del proceso de envejecimiento
    en las capacidades de conducción?
  choices:
    A: Disminución del tiempo de reacción
    B: Aumento del periodo de atención
    C: Aumento del tiempo de decisión en situaciones de conducción
    D: Mejora de la destreza física
  answer: C
  explanation: El manual señala que el proceso de envejecimiento eventualmente resulta
    en un aumento del tiempo de decisión en situaciones de conducción, así como en
    una reducción de la destreza, un aumento del tiempo de reacción y una disminución
    del periodo de atención.
- id: 75
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones se le PROHÍBE conducir en la mitad
    izquierda de la calzada?
  choices:
    A: Al conducir en una calle de sentido único
    B: Al adelantar a un vehículo en una carretera de dos carriles sin tráfico en
      sentido contrario
    C: Al acercarse a menos de 100 pies de una intersección
    D: Cuando hay una obstrucción en el lado derecho de la carretera
  answer: C
  explanation: NO DEBE conducir en la mitad izquierda de la calzada al acercarse a
    menos de 100 pies (30.5 m) de una intersección o un cruce de ferrocarril, o al
    pasar por ellos.
- id: 76
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite adelantar a otro vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante está a punto de girar a la izquierda, siempre
      que usted no se salga del pavimento
    B: Conduciendo fuera del pavimento hacia el arcén no pavimentado
    C: Al acercarse a la cima de una colina
    D: En una carretera estrecha de dos carriles con tráfico en sentido contrario
  answer: A
  explanation: Puede adelantar por la derecha cuando el vehículo al que está adelantando
    está a punto de girar a la izquierda, pero no puede conducir su vehículo fuera
    del pavimento o de la parte principal transitada de la calzada para adelantar.
- id: 77
  category: sharing_the_road
  question: ¿Qué carril debe utilizar cuando circula más lento que el resto del tráfico?
  choices:
    A: El carril del extremo izquierdo
    B: El carril central
    C: El carril del extremo derecho
    D: Cualquier carril, siempre que mantenga la velocidad mínima
  answer: C
  explanation: El manual establece que cuando circule más lento que el resto del tráfico,
    debe conducir en el carril del extremo derecho.
- id: 78
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe hacer la señal antes de cambiar de carril,
    girar o detenerse?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: Las señales deben hacerse durante al menos 100 pies (30.5 m) antes
    de cambiar de carril, girar o detenerse. Esto equivale aproximadamente a la longitud
    de cinco automóviles.
- id: 79
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de las señales de giro?
  choices:
    A: Solo necesita hacer la señal si hay otros vehículos a la vista
    B: Hacer la señal le da el derecho de paso para realizar la maniobra
    C: Debe hacer la señal cada vez, incluso cuando no haya otros vehículos a la vista
    D: Las señales manuales son ilegales y nunca deben usarse
  answer: C
  explanation: 'El manual establece explícitamente: "Debe hacer la señal cada vez,
    incluso cuando no haya otros vehículos a la vista".'
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima a la que debe detener su vehículo del riel
    más cercano en un cruce de ferrocarril cuando se acerca un tren?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: B
  explanation: Debe detener su vehículo a no menos de 15 pies (4.6 m) del riel más
    cercano cuando una señal advierte de un tren, se baja una barrera, o un tren es
    visible o emite una advertencia audible.
- id: 81
  category: safe_driving_rules
  question: ¿A qué distancia debe detenerse en un cruce de ferrocarril si un tren
    que se aproxima emite una señal audible?
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: C
  explanation: Debe detenerse cuando un tren que se aproxima a menos de 1,500 pies
    (460 m) emite una advertencia audible de su proximidad.
- id: 82
  category: safe_driving_rules
  question: ¿Qué exige la Ley de Velocidad Básica (Basic Speed Law) a los conductores?
  choices:
    A: Siempre debe conducir al límite de velocidad máximo indicado
    B: No debe conducir a una velocidad superior a la que sea razonable y prudente
    C: Debe conducir 5 mph por debajo del límite de velocidad en mal tiempo
    D: Nunca debe conducir a menos de 45 mph en una autopista
  answer: B
  explanation: 'La Ley Básica establece: ''No debe conducir a una velocidad superior
    a la que sea razonable y prudente''.'
- id: 83
  category: safe_driving_rules
  question: ¿Qué debe hacer si no puede mantener el ritmo del tráfico y está retrasando
    a otros vehículos?
  choices:
    A: Encender las luces de emergencia y permanecer en su carril
    B: Tocar la bocina para advertir a otros conductores que lo rodeen
    C: Salirse de la calzada y dejar pasar al resto del tráfico o cambiar a otra ruta
    D: Aumentar la velocidad más allá del límite indicado para igualar el flujo del
      tráfico
  answer: C
  explanation: 'El manual establece: ''Si no puede mantener el ritmo del tráfico,
    sálgase de la calzada y deje pasar al resto del tráfico o cambie a otra ruta''.'
- id: 84
  category: safe_driving_rules
  question: Según el manual, ¿dónde está estrictamente prohibido estacionarse?
  choices:
    A: En una calle de un solo sentido
    B: En una zona residencial
    C: En una acera o área de acera
    D: En un espacio de estacionamiento marcado
  answer: C
  explanation: Está prohibido estacionarse en una acera o área de acera, así como
    frente a entradas de vehículos o donde sea peligroso para el resto del tráfico.
- id: 85
  category: safe_driving_rules
  question: Al remolcar otro vehículo, ¿qué regla especial de distancia de seguimiento
    se aplica?
  choices:
    A: Debe permanecer a menos de 50 pies del vehículo de adelante
    B: Debe dejar suficiente espacio delante de su vehículo para permitir que un vehículo
      que lo esté adelantando ocupe el espacio de manera segura
    C: Debe mantener una distancia de seguimiento de dos segundos
    D: Debe conducir únicamente por el carril izquierdo
  answer: B
  explanation: Al remolcar otro vehículo, debe 'dejar suficiente espacio delante de
    su vehículo para permitir que un vehículo que lo esté adelantando ocupe el espacio
    de manera segura'.
- id: 86
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite conducir en la mitad izquierda de la
    calzada?
  choices:
    A: Al acercarse a la cima de una colina
    B: Cuando la carretera tiene cuatro o más carriles para el tráfico en movimiento
    C: Cuando hay una obstrucción en la calzada y los vehículos que vienen en sentido
      contrario no están utilizando la mitad izquierda
    D: Al acercarse a menos de 100 pies de un puente con poca visibilidad
  answer: C
  explanation: Puede conducir en la mitad izquierda de la calzada cuando hay una obstrucción
    en la vía y los vehículos que vienen en sentido contrario no están utilizando
    la mitad izquierda de la carretera.
- id: 87
  category: safe_driving_rules
  question: ¿A cuántas pulgadas del bordillo (curb) se le prohíbe estacionar su vehículo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Según el manual, está prohibido estacionarse si su vehículo está a
    más de 12 pulgadas (30 cm) del bordillo.
- id: 88
  category: driver_responsibility
  question: Al dejar su vehículo desatendido en una pendiente, ¿qué debe hacer con
    las ruedas?
  choices:
    A: Girarlas en dirección opuesta al bordillo
    B: Mantenerlas apuntando hacia adelante
    C: Girarlas hacia el bordillo
    D: Girarlas hacia la izquierda
  answer: C
  explanation: Cuando deje su vehículo desatendido en una pendiente, debe girar las
    ruedas hacia el bordillo, además de apagar el motor, bloquear el encendido y poner
    el freno de estacionamiento.
- id: 89
  category: safe_driving_rules
  question: Conducir con más de ¿cuántas personas en el asiento delantero puede constituir
    una interferencia prohibida con el conductor?
  choices:
    A: Una persona
    B: Dos personas
    C: Tres personas
    D: Cuatro personas
  answer: C
  explanation: Conducir con más de tres personas en el asiento delantero de su vehículo
    puede constituir una interferencia con el conductor, lo cual está prohibido.
- id: 90
  category: sharing_the_road
  question: Si un vehículo de emergencia con sus señales de advertencia encendidas
    está directamente detrás de usted en medio de un tráfico denso, ¿qué debe hacer?
  choices:
    A: Detenerse inmediatamente en su carril actual
    B: Seguir moviéndose lentamente hasta que pueda apartarse del camino
    C: Aumentar la velocidad para rebasar al vehículo de emergencia
    D: Frenar bruscamente y hacerse hacia la izquierda
  answer: B
  explanation: Si el vehículo de emergencia está directamente detrás de su vehículo
    cuando se encuentra en tráfico denso, debe seguir moviéndose lentamente hasta
    que pueda apartarse del camino.
- id: 91
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una regla con respecto a los cortejos fúnebres?
  choices:
    A: Puede rebasarlos si toca la bocina
    B: No debe conducir su vehículo entre los vehículos de un cortejo fúnebre
    C: Deben ceder el paso a todo el resto del tráfico en las intersecciones
    D: No se les permite usar los faros delanteros durante el día
  answer: B
  explanation: Los cortejos fúnebres tienen el derecho de paso en las intersecciones,
    y usted no debe conducir su vehículo entre los vehículos de un cortejo fúnebre.
- id: 92
  category: signs_and_signals
  question: ¿Qué indica un emblema triangular de 18 pulgadas altamente reflectante
    en la parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo es de respuesta a emergencias
    C: El vehículo está diseñado para operar a velocidades de 25 mph o menos
    D: El vehículo está averiado y no puede moverse
  answer: C
  explanation: El emblema de vehículo de movimiento lento es un emblema triangular
    de 18 pulgadas altamente reflectante que se requiere en la parte trasera de los
    vehículos diseñados para operar a velocidades de 25 mph (40 km/h) o menos.
- id: 93
  category: safe_driving_rules
  question: 'Cuando otro vehículo lo está rebasando, es ilegal:'
  choices:
    A: Mantener su velocidad actual
    B: Moverse ligeramente hacia la derecha
    C: Aumentar su velocidad
    D: Tocar ligeramente los frenos
  answer: C
  explanation: El manual señala que cuando otro vehículo lo está rebasando, es ilegal
    aumentar su velocidad.
- id: 94
  category: safe_driving_rules
  question: ¿A cuántos pies de una intersección o cruce de ferrocarril no debe rebasar
    a otro vehículo al acercarse?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: No debe rebasar al acercarse a menos de 100 pies (30 m) de cualquier
    intersección o cruce de ferrocarril, ni al atravesarlos.
- id: 95
  category: safe_driving_rules
  question: 'Al entrar en una calle pública desde un callejón, entrada privada o corral
    de granja, usted debe:'
  choices:
    A: Ceder el paso solo si el tráfico se aproxima por la derecha
    B: Detenerse y ceder el paso a todo el tráfico en la calle pública
    C: Tocar la bocina y continuar sin detenerse
    D: Mantener su velocidad e incorporarse suavemente
  answer: B
  explanation: Las reglas de derecho de paso requieren que se detenga y ceda el paso
    al entrar en cualquier calle o camino público desde un callejón, entrada privada
    o corral de granja.
- id: 96
  category: signs_and_signals
  question: ¿Qué tipo de dispositivo de control de tráfico le advierte sobre condiciones
    peligrosas?
  choices:
    A: Dispositivos reglamentarios
    B: Señales de guía
    C: Señales de información
    D: Dispositivos de advertencia
  answer: D
  explanation: Los dispositivos de advertencia le avisan de condiciones peligrosas
    o de la posibilidad de condiciones peligrosas. Ignorarlos puede resultar en un
    accidente debido a negligencia.
- id: 97
  category: signs_and_signals
  question: ¿Cuándo se le permite cruzar líneas amarillas sólidas dobles?
  choices:
    A: Al rebasar un vehículo de movimiento lento
    B: Solo para realizar un giro a la izquierda hacia o desde un callejón, camino
      privado o entrada privada
    C: Cuando el vehículo de adelante está detenido
    D: Nunca puede cruzar una línea amarilla sólida doble bajo ninguna circunstancia
  answer: B
  explanation: Las líneas amarillas sólidas dobles prohíben rebasar en ambas direcciones,
    pero puede cruzar estas líneas ÚNICAMENTE para realizar un giro a la izquierda
    hacia o desde un callejón, camino privado o entrada privada.
- id: 98
  category: signs_and_signals
  question: ¿Qué acción se requiere al encontrar líneas blancas sólidas dobles en
    la calzada?
  choices:
    A: No debe cruzarlas, ya que el movimiento de carril a carril está prohibido
    B: Puede cruzarlas solo en circunstancias inusuales con mucho cuidado
    C: Puede cruzarlas para rebasar un vehículo de movimiento lento
    D: Debe detenerse y esperar a que las líneas cambien a discontinuas
  answer: A
  explanation: Las líneas blancas sólidas dobles indican que el movimiento de carril
    a carril está prohibido. NO DEBE CRUZAR una línea blanca sólida doble.
- id: 99
  category: signs_and_signals
  question: 'Una marca de canalización de giro a la izquierda de dos sentidos (un
    carril en el centro de la calzada marcado con líneas amarillas sólidas y discontinuas)
    puede usarse para:'
  choices:
    A: Rebasar vehículos lentos
    B: Únicamente maniobras de giro a la izquierda
    C: Estacionamiento de vehículos de emergencia
    D: Tráfico directo durante las horas pico
  answer: B
  explanation: Este carril central puede ser utilizado por vehículos que viajan en
    cualquier dirección ÚNICAMENTE para maniobras de giro a la izquierda. El carril
    NUNCA debe usarse para rebasar.
- id: 100
  category: signs_and_signals
  question: ¿Cómo debe navegar alrededor de las marcas amarillas de obstrucción pintadas
    en el carril de tráfico?
  choices:
    A: Puede pasar por cualquier lado de las marcas
    B: Debe pasar solo por la izquierda de las marcas
    C: Debe pasar solo por la derecha de las marcas
    D: Debe detenerse y esperar a que se despeje el camino
  answer: C
  explanation: Puede pasar por cualquier lado de las marcas de obstrucción blancas,
    pero debe pasar solo por la derecha de las marcas de obstrucción amarillas.
- id: 101
  category: safe_driving_rules
  question: 'Está prohibido estacionar un vehículo en una calle pública o carretera
    por un período continuo de más de:'
  choices:
    A: 12 horas
    B: 24 horas
    C: 48 horas
    D: 72 horas
  answer: B
  explanation: El estacionamiento está prohibido en una calle pública o carretera
    por un período continuo de más de 24 horas.
- id: 102
  category: signs_and_signals
  question: ¿Cuál es la regla para rebasar las marcas amarillas de obstrucción pintadas
    en la carretera?
  choices:
    A: Puede rebasar por cualquier lado de las marcas.
    B: Debe rebasar únicamente por la derecha de las marcas amarillas.
    C: Debe rebasar únicamente por la izquierda de las marcas amarillas.
    D: No debe rebasar las marcas bajo ninguna circunstancia.
  answer: B
  explanation: Según el manual, usted puede rebasar por cualquier lado de las marcas
    blancas de obstrucción, pero debe rebasar únicamente por la derecha de las marcas
    amarillas de obstrucción.
- id: 103
  category: sharing_the_road
  question: ¿Cuál es el propósito de una 'Isla de Seguridad' (Safety Island)?
  choices:
    A: Proporcionar un área para que los vehículos se detengan durante emergencias.
    B: Dirigir los vehículos hacia los carriles para vehículos de alta ocupación.
    C: Proteger a los peatones que puedan tener que permanecer en la calzada.
    D: Designar una zona para los trabajadores de la construcción.
  answer: C
  explanation: El manual establece que las islas de tráfico se denominan 'Islas de
    Seguridad' cuando se utilizan para proteger a los peatones que puedan tener que
    permanecer en la calzada.
- id: 104
  category: safe_driving_rules
  question: Al encontrarse con una luz roja fija en un semáforo, ¿qué debe hacer antes
    de realizar un giro a la derecha permitido?
  choices:
    A: Reducir la velocidad a 5 mph y avanzar si la intersección está despejada.
    B: Detenerse, luego ceder el paso a todos los peatones y vehículos antes de realizar
      el giro.
    C: Esperar a que aparezca una flecha verde antes de girar.
    D: Tocar la bocina para advertir a los peatones antes de girar.
  answer: B
  explanation: El manual establece que después de detenerse ante una luz roja, usted
    puede girar a la derecha (excepto cuando una señal lo prohíba), pero debe ceder
    el paso a todos los peatones y a todos los vehículos al realizar dicho giro.
- id: 105
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite realizar un giro a la izquierda con
    luz roja?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    B: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
      donde el tráfico se mueve hacia la izquierda.
    C: Cuando no haya tráfico en sentido contrario visible durante al menos 500 pies.
    D: Los giros a la izquierda con luz roja nunca están permitidos.
  answer: B
  explanation: Después de detenerse, usted puede girar a la izquierda con luz roja
    desde una calle de un solo sentido hacia otra calle de un solo sentido donde el
    tráfico se mueva hacia la izquierda, excepto cuando una señal prohíba dicho movimiento.
- id: 106
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico roja intermitente?
  choices:
    A: Proceder únicamente con precaución.
    B: La señal de tráfico está averiada y usted tiene el derecho de paso.
    C: Tiene el mismo significado que una señal de alto (pare).
    D: Ceder el paso al tráfico que se aproxima por la derecha.
  answer: C
  explanation: El manual establece que una señal roja intermitente tiene el mismo
    significado que una señal de alto (pare).
- id: 107
  category: signs_and_signals
  question: ¿Qué indica una señal de control de carril con una 'X' amarilla fija?
  choices:
    A: Puede usar el carril solo cuando se prepare para girar a la izquierda.
    B: Debe salir de ese carril porque se va a utilizar para el tráfico que se mueve
      en la dirección opuesta.
    C: El carril está cerrado más adelante por obras viales.
    D: Usted tiene el derecho de paso exclusivo en ese carril.
  answer: B
  explanation: La 'X' amarilla significa que debe salir de ese carril de tráfico porque
    se va a utilizar para el tráfico que se mueve en la dirección opuesta.
- id: 108
  category: sharing_the_road
  question: ¿Qué debe hacer un peatón si la señal de 'NO CRUCE' (DON'T WALK) comienza
    a parpadear mientras ya está cruzando la calzada?
  choices:
    A: Detenerse inmediatamente y esperar en medio de la carretera.
    B: Dar la vuelta y regresar a la acera de inicio.
    C: Continuar cruzando hasta la acera, isla de tráfico o zona de seguridad más
      cercana.
    D: Correr lo más rápido posible hacia el otro lado de la intersección.
  answer: C
  explanation: Una señal de 'NO CRUCE' (DON'T WALK) intermitente significa que los
    peatones no pueden comenzar a cruzar, pero aquellos que ya están cruzando pueden
    continuar hasta la acera, isla de tráfico o zona de seguridad más cercana.
- id: 109
  category: signs_and_signals
  question: ¿Qué indica el color naranja en una señal de tráfico?
  choices:
    A: Una acción está prohibida.
    B: Una advertencia de condiciones peligrosas o de riesgo.
    C: Una acción requerida.
    D: Una advertencia relativa a obras viales.
  answer: D
  explanation: El manual especifica que el color naranja indica una advertencia relativa
    a obras viales, y aparece en señales rectangulares o en forma de diamante.
- id: 110
  category: signs_and_signals
  question: ¿Qué señal tiene forma de banderín (pennant) y se encuentra en el lado
    izquierdo de la carretera?
  choices:
    A: Señal de No Rebasar (Do Not Pass)
    B: Señal de Zona de No Rebasar (No Passing Zone)
    C: Señal de Rebase con Cuidado (Pass With Care)
    D: Señal de Ceda el Paso (Yield)
  answer: B
  explanation: Las SEÑALES DE ZONA DE NO REBASAR (NO PASSING ZONE) son señales amarillas
    y negras en forma de banderín situadas en el lado izquierdo de la carretera que
    señalan el inicio de la zona de no rebasar.
- id: 111
  category: signs_and_signals
  question: ¿Cuál es la forma y el color de una señal de CEDA EL PASO (YIELD)?
  choices:
    A: De 8 lados, blanco sobre rojo
    B: Rectangular, blanco y negro
    C: Triangular, rojo y blanco
    D: En forma de diamante, negro y amarillo
  answer: C
  explanation: El manual describe la señal de CEDA EL PASO (YIELD) como una señal
    triangular roja y blanca que indica que el resto del tráfico tiene la preferencia
    de paso.
- id: 112
  category: signs_and_signals
  question: Cuando pasa una señal de "REDUCCIÓN DE VELOCIDAD ADELANTE" (REDUCED SPEED
    AHEAD), ¿dónde comienza oficialmente el nuevo límite de velocidad?
  choices:
    A: Inmediatamente en la señal de "REDUCCIÓN DE VELOCIDAD ADELANTE".
    B: 100 pies después de la señal.
    C: En la siguiente señal de límite de velocidad.
    D: Cuando entra en la siguiente intersección.
  answer: C
  explanation: El manual establece que estas señales le informan que debe comenzar
    a reducir su velocidad, y que "el nuevo límite de velocidad comienza en la siguiente
    señal de límite de velocidad".
- id: 113
  category: signs_and_signals
  question: ¿Cómo está marcado el pavimento antes de un cruce de ferrocarril?
  choices:
    A: Con una "X" grande y dos letras "R".
    B: Con un triángulo blanco sólido.
    C: Con franjas diagonales amarillas.
    D: Con una línea de parada roja.
  answer: A
  explanation: Las marcas de cruce de ferrocarril incluyen una "X" grande y dos letras
    "R" pintadas en el carril de circulación antes de los cruces ferroviarios.
- id: 114
  category: signs_and_signals
  question: ¿Qué forma y color tienen la mayoría de las señales de advertencia?
  choices:
    A: Rectangulares con letras negras sobre un fondo blanco.
    B: En forma de diamante con una leyenda y borde negros sobre un fondo amarillo.
    C: Circulares con un borde rojo sobre un fondo blanco.
    D: Octogonales con letras blancas sobre un fondo rojo.
  answer: B
  explanation: El manual señala que las señales de advertencia suelen tener forma
    de diamante con una leyenda y borde negros sobre un fondo amarillo.
- id: 115
  category: signs_and_signals
  question: ¿Qué indican las señales rectangulares que contienen un círculo rojo con
    una línea diagonal roja?
  choices:
    A: Proporcionan identificación de ruta y ubicación.
    B: Advierten sobre una construcción vial próxima.
    C: Restringen o prohíben vehículos, movimientos de vehículos u otras actividades.
    D: Indican el final de una zona de no rebasar.
  answer: C
  explanation: Estas son señales de exclusión, que restringen o prohíben vehículos
    o movimientos de vehículos, o prohíben alguna otra actividad.
- id: 116
  category: signs_and_signals
  question: ¿Cuál es el color básico utilizado para los dispositivos de control de
    tráfico de construcción y mantenimiento?
  choices:
    A: Amarillo
    B: Naranja
    C: Rojo
    D: Blanco
  answer: B
  explanation: Según el manual, el naranja es el color básico para los dispositivos
    de construcción y mantenimiento, como señales, barricadas, tambores y conos.
- id: 117
  category: signs_and_signals
  question: ¿Qué indican a un conductor las franjas diagonales en una barricada que
    se inclinan hacia abajo a la derecha?
  choices:
    A: La carretera está cerrada más adelante
    B: El conductor debe desviarse hacia la izquierda
    C: El conductor debe desviarse hacia la derecha
    D: El conductor debe detenerse inmediatamente
  answer: C
  explanation: Las franjas diagonales en una barricada guían al conductor. Las franjas
    que se inclinan hacia abajo a la derecha significan que el conductor debe desviarse
    hacia la derecha.
- id: 118
  category: driver_responsibility
  question: ¿Bajo qué circunstancias se debe informar inmediatamente a la policía
    sobre un accidente de tráfico?
  choices:
    A: Solo si alguien fallece
    B: Si los daños a la propiedad son de $1,000 o más
    C: Si resulta en lesiones personales, muerte o daños a la propiedad de $3,000
      o más
    D: Cada vez que dos vehículos tengan contacto
  answer: C
  explanation: Los accidentes de tráfico que resulten en lesiones personales de cualquier
    tipo, muerte o daños a la propiedad de $3,000 o más deben informarse a la policía
    de inmediato.
- id: 119
  category: safe_driving_rules
  question: ¿Qué debe hacer si choca contra un vehículo desatendido?
  choices:
    A: Abandonar la escena de inmediato si no hay daños visibles
    B: Esperar en su automóvil hasta que regrese el dueño
    C: Detenerse y localizar al dueño, o dejar una nota por escrito que contenga su
      nombre y dirección
    D: Llamar a su compañía de seguros y luego marcharse
  answer: C
  explanation: Al chocar contra un vehículo desatendido, debe detenerse y localizar
    al dueño, o dejar una nota por escrito que contenga su nombre, dirección y las
    circunstancias del accidente.
- id: 120
  category: safe_driving_rules
  question: Si alguien resulta herido en un accidente y tiene una hemorragia grave,
    ¿cuál es la respuesta de primeros auxilios recomendada?
  choices:
    A: Aplicar un torniquete por encima de la herida
    B: Intentar detener el flujo de sangre con presión directa
    C: Elevar la cabeza de la víctima y ofrecerle agua
    D: Mover a la víctima al costado de la carretera de inmediato
  answer: B
  explanation: El manual establece que si hay una hemorragia grave, se debe intentar
    detener el flujo de sangre con presión directa.
- id: 121
  category: penalties_and_points
  question: ¿Cuál es la sanción por el incumplimiento de la Ley de Responsabilidad
    de Seguridad de Vehículos Motorizados?
  choices:
    A: Una multa de $500
    B: Su vehículo será confiscado
    C: Su licencia de conducir será suspendida
    D: Debe volver a tomar el examen de conducir
  answer: C
  explanation: La sanción por el incumplimiento de la Ley de Responsabilidad de Seguridad
    de Vehículos Motorizados es que su licencia de conducir será suspendida.
- id: 122
  category: vehicle_information
  question: Según la Ley de Seguros de Vehículos Motorizados, ¿cuál es la cobertura
    mínima obligatoria de responsabilidad civil por daños a la propiedad por accidente?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $40,000
  answer: B
  explanation: Las coberturas mínimas obligatorias incluyen una cobertura de responsabilidad
    civil de $10,000 por daños a la propiedad por accidente.
- id: 123
  category: driver_responsibility
  question: En Hawái, ¿cuándo se le permite demandar por lesiones corporales resultantes
    de un accidente de vehículo motorizado?
  choices:
    A: En cualquier momento, independientemente de la gravedad de la lesión
    B: Solo si el otro conductor estaba intoxicado
    C: Si las facturas médicas superan los $5,000, o si la lesión resulta en muerte,
      pérdida de una función corporal o desfiguración grave
    D: Solo si su vehículo queda totalmente destruido
  answer: C
  explanation: Puede demandar por lesiones corporales solo si las facturas médicas
    superan los $5,000, si la lesión resulta en la pérdida de una función corporal
    o desfiguración permanente o grave, o si la lesión resulta en la muerte.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones sobre el alcohol es verdadera?
  choices:
    A: El alcohol es un estimulante que aumenta el estado de alerta
    B: Beber café solo le ayudará a recuperar la sobriedad más rápido
    C: El alcohol es un depresor que ralentiza los reflejos normales e interfiere
      con el juicio
    D: Una ducha fría puede eliminar el alcohol de su sangre
  answer: C
  explanation: El alcohol es un depresor, no un estimulante. Ralentiza los reflejos
    normales, interfiere con el juicio, reduce el estado de alerta y afecta la visión.
    El café y las duchas frías no le ayudarán a recuperar la sobriedad.
- id: 125
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de 'Consentimiento Implícito' (Implied Consent)
    de Hawái?
  choices:
    A: Usted da su consentimiento para que registren su vehículo si la policía lo
      detiene
    B: Usted acepta someterse a una prueba para determinar la cantidad de alcohol
      en su sangre si opera un vehículo motorizado en vías públicas
    C: Usted acepta pagar todas las multas inmediatamente al recibir una citación
    D: Usted acepta compartir sus registros médicos con el DMV
  answer: B
  explanation: El Consentimiento Implícito significa que se considera que cualquier
    persona que opere un vehículo motorizado en las vías públicas de Hawái ha dado
    su consentimiento para someterse a una prueba para determinar la cantidad de alcohol
    en su sangre.
- id: 126
  category: alcohol_drugs_health
  question: ¿Qué es la ley de 'Tolerancia Cero' (Zero Tolerance) para conductores
    menores de 21 años en Hawái?
  choices:
    A: No pueden conducir con ningún pasajero menor de 21 años
    B: Se les prohíbe operar un vehículo motorizado con un nivel de contenido de alcohol
      en sangre (BAC) de .02 o más
    C: Perderán su licencia por cualquier infracción de tránsito
    D: No pueden conducir entre la medianoche y las 5 AM
  answer: B
  explanation: La ley de Tolerancia Cero prohíbe a los conductores menores de 21 años
    operar un vehículo motorizado con un nivel de contenido de alcohol en sangre (BAC)
    de .02 o más.
- id: 127
  category: penalties_and_points
  question: ¿Qué puede suceder si se niega a hacerse una prueba de alcohol en sangre
    cuando lo solicita un oficial de policía?
  choices:
    A: Se le dará una advertencia y se le permitirá conducir a casa
    B: Su licencia puede ser revocada por uno, dos o cuatro años, dependiendo de contactos
      previos
    C: Será sentenciado automáticamente a 30 días de cárcel
    D: Su vehículo será confiscado permanentemente
  answer: B
  explanation: Negarse a realizar la prueba puede resultar en la revocación de su
    licencia por un año, dos años o cuatro años, dependiendo de los contactos previos
    del conductor con la aplicación de la ley por alcohol.
- id: 128
  category: alcohol_drugs_health
  question: ¿Con qué contenido de alcohol en sangre (BAC) se considera que un conductor
    está 'bajo la influencia del alcohol' en Hawái?
  choices:
    A: .02 por ciento o más
    B: .04 por ciento o más
    C: .05 por ciento o más
    D: .08 por ciento o más
  answer: D
  explanation: Se considera que un conductor está bajo la influencia del alcohol si
    el contenido de alcohol en sangre (BAC) es de .08 por ciento o más.
- id: 129
  category: alcohol_drugs_health
  question: ¿Cuál es la ley con respecto a los recipientes abiertos de bebidas alcohólicas
    en un vehículo motorizado?
  choices:
    A: Están permitidos siempre que el conductor no esté bebiendo
    B: Deben ser sostenidos por un pasajero en el asiento trasero
    C: Está prohibido guardar un recipiente abierto en el área normalmente ocupada
      por el conductor o los pasajeros en cualquier vía pública
    D: Se permiten si el recipiente está a menos de la mitad
  answer: C
  explanation: Está prohibido guardar un recipiente de bebida alcohólica abierto en
    el área de un vehículo motorizado normalmente ocupada por el conductor o los pasajeros
    en cualquier vía pública.
- id: 130
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una posible sanción por violar la ley de seguros
    de vehículos motorizados?
  choices:
    A: Una multa que no exceda los $5,000
    B: Treinta días de prisión
    C: Suspensión de la licencia de operador de vehículos motorizados
    D: Todas las anteriores
  answer: D
  explanation: Los infractores de la ley de seguros de vehículos motorizados están
    sujetos a una multa de hasta $5,000, 30 días de prisión, suspensión de la licencia,
    pérdida del registro o cualquier combinación de dichas sanciones.
- id: 131
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de combinar alcohol y drogas?
  choices:
    A: Anula los efectos de las drogas.
    B: Puede tener un efecto mucho más pronunciado que cualquiera de los dos por separado.
    C: Es seguro siempre que las drogas sean recetadas por un médico.
    D: Solo afecta su conducción si consume drogas ilegales.
  answer: B
  explanation: El manual establece que la combinación de alcohol y drogas puede tener
    un efecto mucho más pronunciado que cualquiera de los dos por separado, y aconseja
    no mezclar nunca alcohol y drogas.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los remedios
    para la alergia y las pastillas para el resfriado que se pueden comprar sin receta
    médica?
  choices:
    A: Son completamente seguros de usar mientras se conduce.
    B: Pueden contener ingredientes que pueden afectar su capacidad de conducción.
    C: Mejoran su estado de alerta y tiempo de reacción.
    D: Solo son peligrosos si se mezclan con drogas ilegales.
  answer: B
  explanation: El manual advierte que algunos remedios para la alergia y pastillas
    para el resfriado comprados sin receta pueden contener ingredientes que pueden
    afectar su capacidad de conducción.
- id: 133
  category: driver_responsibility
  question: Según el manual, ¿cuáles de los siguientes factores causan los "malos"
    hábitos de conducción?
  choices:
    A: Pereza, impaciencia, falta de atención, arrogancia e ignorancia.
    B: Fatiga, hambre, sed y estrés.
    C: Mantenimiento deficiente del vehículo y malas condiciones climáticas.
    D: Exceso de confianza, exceso de velocidad y seguir muy de cerca al vehículo
      de adelante.
  answer: A
  explanation: 'El manual enumera explícitamente las causas de los "malos" hábitos
    de conducción como: (1) Pereza, (2) Impaciencia, (3) Falta de atención, (4) Arrogancia
    y (5) Ignorancia.'
- id: 134
  category: safe_driving_rules
  question: 'No girar la cabeza y mirar hacia atrás para ver el tráfico que se aproxima
    antes de cambiar de carril es un ejemplo de un mal hábito de conducción causado
    por:'
  choices:
    A: Ignorancia
    B: Arrogancia
    C: Pereza
    D: Impaciencia
  answer: C
  explanation: El manual categoriza el reducir la acción requerida de girar la cabeza
    para revisar el tráfico a simplemente mirar por el espejo retrovisor como un mal
    hábito causado por la pereza.
- id: 135
  category: safe_driving_rules
  question: Un conductor que acelera de parada en parada, zigzaguea entre el tráfico
    y sigue muy de cerca a otros conductores está exhibiendo ¿qué mal hábito de conducción?
  choices:
    A: Ignorancia
    B: Impaciencia
    C: Falta de atención
    D: Pereza
  answer: B
  explanation: El manual describe a un conductor impaciente como aquel que acelera
    de parada en parada, zigzaguea entre el tráfico y sigue muy de cerca a otros conductores.
- id: 136
  category: driver_responsibility
  question: ¿Cómo describe el manual a un conductor "arrogante"?
  choices:
    A: Un conductor que sueña despierto y mira objetos fuera de la carretera.
    B: Un conductor que tiene prisa a propósito y compite con su vehículo.
    C: Un conductor que no conoce el significado de las señales de tráfico.
    D: Un conductor que solo revisa su espejo retrovisor en lugar de girar la cabeza.
  answer: B
  explanation: Según el manual, el conductor arrogante tiene prisa a propósito, compite
    con su vehículo (que es una extensión de su ego) y tiene poco o ningún respeto
    por las leyes de tránsito.
- id: 137
  category: safe_driving_rules
  question: 'Si un conductor se detiene al final de una rampa de entrada a la autopista
    o conduce demasiado lento porque no está seguro, es probable que esté mostrando
    un mal hábito causado por:'
  choices:
    A: Ignorancia
    B: Falta de atención
    C: Arrogancia
    D: Impaciencia
  answer: A
  explanation: El manual señala que un conductor ignorante puede conducir demasiado
    lento porque no está seguro o detenerse al final de una rampa de entrada a la
    autopista porque no conoce las reglas de los procedimientos de conducción segura.
- id: 138
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a conducir con cascos o auriculares?
  choices:
    A: Puede usarlos si el volumen se mantiene bajo.
    B: No debe conducir con cascos o auriculares que cubran o entren en ambos oídos.
    C: Se permiten solo cuando se escucha un dispositivo GPS.
    D: Se recomiendan para bloquear el ruido molesto de la carretera.
  answer: B
  explanation: 'El manual establece: "No conduzca con cascos o auriculares que cubran
    o entren en ambos oídos. Hacen que sea demasiado difícil escuchar las bocinas
    o sirenas de emergencia".'
- id: 139
  category: safe_driving_rules
  question: ¿Por qué hablar por teléfono celular con equipo de "manos libres" todavía
    se considera peligroso?
  choices:
    A: El equipo puede enredarse fácilmente en el volante.
    B: Aleja su atención de la conducción y hace que sea menos probable que note situaciones
      peligrosas.
    C: Los dispositivos de manos libres a menudo causan interferencias eléctricas
      con el vehículo.
    D: Es ilegal tener cualquier dispositivo electrónico encendido mientras se conduce.
  answer: B
  explanation: El manual explica que incluso con equipo de "manos libres", hablar
    por teléfono aleja su atención de la conducción y puede hacer que sea menos probable
    que note una situación peligrosa.
- id: 140
  category: safe_driving_rules
  question: ¿Cuál es la forma más segura de viajar con una mascota en su vehículo?
  choices:
    A: En el regazo del conductor para que puedan ser monitoreados de cerca.
    B: En el asiento del pasajero delantero con la ventana bajada.
    C: En un transportador.
    D: Sujetado de forma segura por un pasajero en el asiento delantero.
  answer: C
  explanation: El manual establece que las mascotas pueden distraer y no deben viajar
    en el regazo del conductor, señalando que "Un transportador es el lugar más seguro".
- id: 141
  category: defensive_driving
  question: ¿Cuál es la idea básica del manejo defensivo?
  choices:
    A: Conducir siempre por debajo del límite de velocidad indicado.
    B: Reconocer los posibles peligros y ajustar su conducción para evitarlos antes
      de que ocurra un accidente.
    C: Defender agresivamente su derecho de paso frente a otros conductores.
    D: Confiar en las características de seguridad de su vehículo para protegerlo
      en un choque.
  answer: B
  explanation: El manejo defensivo se define en el manual como el reconocimiento de
    los posibles peligros asociados con diversas situaciones de conducción y el ajuste
    de su manejo para permitirle evitar los peligros cuando estos se presentan.
- id: 142
  category: defensive_driving
  question: 'Para evitar accidentes como conductor defensivo, siempre debe tener listo
    un plan de acción alternativo. Esto significa que debe:'
  choices:
    A: Dejarse siempre una vía de escape.
    B: Mantener un mapa abierto en el asiento del pasajero.
    C: Memorizar los números de teléfono de los servicios de emergencia.
    D: Conducir con las luces de emergencia encendidas en tráfico pesado.
  answer: A
  explanation: 'El manual enumera los pasos para los conductores defensivos, incluyendo:
    "Tenga listo un plan de acción alternativo en caso de que ocurra un evento inesperado.
    (Déjese siempre una vía de escape)".'
- id: 143
  category: defensive_driving
  question: Según el manual, ¿cómo afecta la velocidad a su visión mientras conduce?
  choices:
    A: La velocidad aumenta su capacidad para enfocar objetos distantes.
    B: La velocidad reduce su campo de visión.
    C: La velocidad no tiene ningún efecto en su campo de visión.
    D: La velocidad mejora su visión periférica.
  answer: B
  explanation: El manual establece explícitamente en un encabezado y sección que "LA
    VELOCIDAD REDUCE SU CAMPO DE VISIÓN".
- id: 144
  category: alcohol_drugs_health
  question: ¿Por qué se consideran peligrosos para los conductores todos los tipos
    de drogas del mercado "ilegal"?
  choices:
    A: Son demasiado caras para usarlas con regularidad.
    B: No hay forma de estar seguro de su potencia o pureza.
    C: Siempre causan somnolencia inmediata.
    D: Se confunden fácilmente con medicamentos recetados.
  answer: B
  explanation: 'El manual establece: "Todos los tipos de drogas en el mercado ''ilegal''
    son peligrosos porque no hay forma de estar seguro de su potencia o pureza".'
- id: 145
  category: driver_responsibility
  question: ¿Cómo se forman los "buenos" hábitos de conducción?
  choices:
    A: Leyendo el manual del conductor una vez al año.
    B: Realizando deliberadamente la acción adecuada una y otra vez hasta que se forme
      el hábito.
    C: Conduciendo solo durante las horas del día.
    D: Observando a otros conductores en la carretera.
  answer: B
  explanation: El manual explica que para formar buenos hábitos de conducción, "Todo
    lo que tiene que hacer es realizar deliberadamente la acción adecuada una y otra
    vez hasta que se forme el buen hábito".
- id: 146
  category: defensive_driving
  question: ¿En qué debe consistir su patrón de exploración visual mientras conduce?
  choices:
    A: Mirar fijamente hacia adelante en todo momento para evitar distracciones.
    B: Dedicar la mayor parte de la atención hacia adelante con miradas frecuentes
      a los lados, los espejos y el panel de instrumentos.
    C: Mirar principalmente al espejo retrovisor para vigilar el tráfico detrás de
      usted.
    D: Enfocarse principalmente en el vehículo que está directamente delante de usted.
  answer: B
  explanation: El manual indica desarrollar un patrón de exploración dedicando la
    mayor parte de su atención a la situación de adelante, pero con miradas a ambos
    lados, al espejo retrovisor y al panel de instrumentos a intervalos regulares
    y frecuentes.
- id: 147
  category: alcohol_drugs_health
  question: Si está tomando medicamentos y necesita conducir, ¿cuál es el curso de
    acción recomendado?
  choices:
    A: Conducir solo durante las horas del día.
    B: Beber café o una bebida energética antes de conducir.
    C: Obtener y seguir el consejo de su médico sobre la conducción.
    D: Conducir a una velocidad menor que el límite indicado.
  answer: C
  explanation: El manual aconseja que si está tomando medicamentos, debe obtener y
    seguir el consejo de su médico sobre la conducción.
- id: 148
  category: vehicle_information
  question: Después de arrancar su vehículo, ¿qué significa si una luz roja de advertencia
    permanece iluminada en el panel de instrumentos?
  choices:
    A: El sistema está funcionando normalmente y realizando un diagnóstico.
    B: Es una advertencia menor que puede ignorarse hasta su próximo servicio.
    C: Indica peligro y debe revisarse de inmediato.
    D: El freno de estacionamiento se ha desactivado con éxito.
  answer: C
  explanation: Según el manual, después de la comprobación de la computadora, una
    luz roja indica peligro y debe revisarse de inmediato.
- id: 149
  category: vehicle_information
  question: 'Si la lámpara de advertencia de los frenos se ilumina cuando presiona
    el pedal del freno de pie, indica que:'
  choices:
    A: El freno de estacionamiento está puesto.
    B: El sistema de frenos está defectuoso y el vehículo no debe conducirse.
    C: El sistema de frenos antibloqueo se está activando correctamente.
    D: Las pastillas de freno se están calentando a la temperatura óptima.
  answer: B
  explanation: El manual establece que si la lámpara de advertencia de los frenos
    se ilumina cuando se presiona el pedal del freno de pie, el sistema de frenos
    está defectuoso y el vehículo no debe conducirse.
- id: 150
  category: safe_driving_rules
  question: Según el manual, ¿cuántas veces más probabilidades tiene de morir en un
    choque si sale despedido de su automóvil?
  choices:
    A: Dos veces más
    B: Tres veces más
    C: Cuatro veces más
    D: Cinco veces más
  answer: D
  explanation: Los cinturones de seguridad evitan que usted salga despedido de su
    automóvil. El manual señala que sus probabilidades de morir son cinco veces mayores
    si sale despedido de su automóvil.
- id: 151
  category: safe_driving_rules
  question: 'Si no lleva puesto el cinturón de seguridad, es posible morir en un choque
    a velocidades tan bajas como:'
  choices:
    A: 12 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 35 millas por hora
  answer: A
  explanation: El manual advierte que, si no lleva puesto el cinturón de seguridad,
    es posible morir en un choque a velocidades tan bajas como 12 millas por hora
    (19 km/h).
- id: 152
  category: safe_driving_rules
  question: ¿Cómo debe usarse el cinturón de hombro para un ajuste adecuado?
  choices:
    A: Tan apretado como sea posible a través del pecho.
    B: Lo suficientemente flojo como para que pueda insertar el puño entre el cinturón
      y el pecho.
    C: Metido debajo del brazo para máxima comodidad.
    D: Ajustado a través de los huesos de la cadera y la parte inferior del abdomen.
  answer: B
  explanation: El manual especifica que el cinturón de hombro no debe estar tan apretado,
    de modo que pueda insertar el puño entre el cinturón y el pecho.
- id: 153
  category: driver_responsibility
  question: 'Según la ley de Hawái, es ilegal dejar a un niño desatendido en un vehículo
    motorizado durante cinco minutos o más si el niño es menor de:'
  choices:
    A: Seis años
    B: Siete años
    C: Ocho años
    D: Nueve años
  answer: D
  explanation: La ley de Hawái prohíbe dejar a un niño menor de nueve años desatendido
    en un vehículo motorizado durante cinco minutos o más.
- id: 154
  category: safe_driving_rules
  question: Al retroceder su vehículo, ¿por qué debe darse la vuelta y mirar hacia
    atrás en lugar de confiar únicamente en sus espejos retrovisores?
  choices:
    A: Los espejos distorsionan la distancia de los objetos detrás de usted.
    B: La vista a través de los espejos retrovisores es demasiado pequeña para usarse
      con este propósito.
    C: Es ilegal usar espejos al retroceder.
    D: Los espejos no muestran el espacio libre delantero del vehículo.
  answer: B
  explanation: El manual instruye a los conductores a darse la vuelta y mirar hacia
    atrás porque la vista a través de los espejos retrovisores es demasiado pequeña
    para usarse con este propósito.
- id: 155
  category: sharing_the_road
  question: ¿Quién tiene la responsabilidad principal de evitar una colisión cuando
    un vehículo sale de un espacio de estacionamiento?
  choices:
    A: El conductor del vehículo que sale del espacio de estacionamiento.
    B: Los conductores en el carril de tráfico que se aproxima.
    C: Los peatones que caminan cerca del espacio de estacionamiento.
    D: El conductor estacionado en el espacio directamente detrás.
  answer: A
  explanation: 'El manual establece: "La responsabilidad principal de evitar una colisión
    recae en el conductor que sale de un espacio de estacionamiento".'
- id: 156
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de entrar a una calzada desde una entrada privada
    (driveway)?
  choices:
    A: Tocar la bocina para advertir al tráfico que se aproxima.
    B: Detenerse antes de cruzar el área de la acera.
    C: Acelerar rápidamente para incorporarse al tráfico.
    D: Ceder el paso solo a los vehículos, no a los peatones.
  answer: B
  explanation: Al incorporarse al tráfico desde una entrada privada, siempre debe
    detenerse antes de entrar a la calzada, y la parada debe hacerse antes de cruzar
    el área de la acera.
- id: 157
  category: safe_driving_rules
  question: ¿En qué dirección debe avanzar al conducir alrededor de la isla central
    de una rotonda?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En línea recta
    D: En cualquier dirección que tenga menos tráfico
  answer: B
  explanation: 'Los consejos para conducir a través de una rotonda incluyen: "Conduzca
    a la derecha de la isla central y avance en sentido contrario a las agujas del
    reloj".'
- id: 158
  category: sharing_the_road
  question: Al acercarse a una rotonda, ¿hacia dónde debe mirar para ver el tráfico
    que tiene el derecho de paso?
  choices:
    A: A la derecha
    B: A la izquierda
    C: En su espejo retrovisor
    D: Solo hacia adelante
  answer: B
  explanation: Al entrar en una rotonda, debe "Mirar a la izquierda para ver el tráfico
    y ceder el paso al tráfico, incluidos los ciclistas, que ya se encuentren en la
    rotonda".
- id: 159
  category: defensive_driving
  question: Si tiene dudas sobre su capacidad para lidiar cómodamente con condiciones
    climáticas o de la carretera desfavorables para un viaje, ¿qué recomienda el manual?
  choices:
    A: Conducir a la mitad del límite de velocidad indicado.
    B: Seguir de cerca a un vehículo más grande.
    C: Posponer o cancelar el viaje.
    D: Encender las luces de emergencia durante todo el viaje.
  answer: C
  explanation: 'El manual aconseja: "Si tiene dudas sobre si es capaz de lidiar cómodamente
    con cualquier condición desfavorable, POSPONGA O CANCELE EL VIAJE".'
- id: 160
  category: vehicle_information
  question: Antes de conducir un vehículo desconocido, ¿qué debería tomarse unos minutos
    para hacer?
  choices:
    A: Revisar el refrigerante del motor y el agua de la batería.
    B: Familiarizarse con la ubicación y el funcionamiento de las señales, luces,
      limpiaparabrisas, frenos y bocina.
    C: Leer todo el manual del propietario del vehículo.
    D: Conducirlo alrededor de la cuadra a alta velocidad para probar los frenos.
  answer: B
  explanation: 'Para un vehículo desconocido, el manual dice: "Tómese unos minutos
    para familiarizarse con la ubicación y el funcionamiento de las señales de giro
    y de advertencia de peligro, los faros delanteros y el selector de haz, los limpiaparabrisas
    y lavaparabrisas, los frenos, el selector de marchas y la bocina".'
- id: 161
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida mientras conduce en una rotonda?
  choices:
    A: Detenerse y retroceder hasta su salida
    B: Hacer un giro en U sobre la isla central
    C: Conducir por la rotonda de nuevo hasta llegar a su salida
    D: Salir en la siguiente calle disponible y dar la vuelta
  answer: C
  explanation: Según el manual, si se pasa de su salida, debe conducir por la rotonda
    de nuevo hasta llegar a su salida.
- id: 162
  category: defensive_driving
  question: Al conducir en una calzada con tres o más carriles en su dirección de
    viaje, ¿qué carriles suelen tener menos conflictos de tráfico?
  choices:
    A: Los carriles de la derecha
    B: Los carriles de la izquierda
    C: Los carriles centrales
    D: Los carriles del acotamiento
  answer: C
  explanation: El manual aconseja elegir los carriles centrales en carreteras con
    tres o más carriles en la dirección de viaje, ya que habrá menos conflictos de
    tráfico.
- id: 163
  category: safe_driving_rules
  question: ¿Con cuánta antelación exige la ley que se señalice antes de comenzar
    un cambio de carril?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: La ley exige que señalice su intención durante al menos 100 pies (30
    m) antes de comenzar un cambio de carril.
- id: 164
  category: safe_driving_rules
  question: Según el manual, ¿cuándo está estrictamente prohibido cambiar de carril?
  choices:
    A: Cuando se conduce con tráfico pesado
    B: Al aproximarse o circular por intersecciones y cruces peatonales
    C: Cuando se conduce en una autopista de tres carriles
    D: Cuando se circula más lento que el flujo del tráfico
  answer: B
  explanation: 'El manual establece explícitamente: ''NUNCA CAMBIE DE CARRIL AL APROXIMARSE
    O CIRCULAR POR INTERSECCIONES Y CRUCES PEATONALES''.'
- id: 165
  category: defensive_driving
  question: ¿Cuál es el intervalo de seguimiento mínimo recomendado entre su vehículo
    y el vehículo de adelante?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: B
  explanation: Para asegurar un intervalo adecuado, debe contar 'mil uno, mil dos'.
    El manual establece que debe tener al menos un intervalo de dos segundos y nunca
    menos.
- id: 166
  category: safe_driving_rules
  question: ¿Cuándo es el momento adecuado para reducir la velocidad ante una curva
    o un giro?
  choices:
    A: Antes de entrar en la curva o comenzar el giro
    B: Mientras está en medio de la curva
    C: Justo cuando comienza a acelerar para salir del giro
    D: Solo si la carretera está mojada o helada
  answer: A
  explanation: El manual instruye a los conductores a reducir a una velocidad adecuada
    antes de entrar en una curva o comenzar un giro, ya que frenar bruscamente en
    una curva puede causar la pérdida de control.
- id: 167
  category: safe_driving_rules
  question: Mientras espera para girar a la izquierda en una intersección, el semáforo
    se pone en verde. ¿Qué debe hacer con sus ruedas delanteras mientras espera a
    que el tráfico se despeje?
  choices:
    A: Apuntarlas hacia la izquierda
    B: Apuntarlas hacia la derecha
    C: Mantenerlas apuntando recto hacia adelante
    D: Girarlas ligeramente hacia el bordillo
  answer: C
  explanation: Mientras espera para girar a la izquierda con luz verde, debe avanzar
    lentamente hacia la intersección y mantener las ruedas apuntando recto hacia adelante
    hasta que sea seguro y esté despejado para girar.
- id: 168
  category: safe_driving_rules
  question: Si un vehículo delante de usted está girando a la izquierda, ¿qué acción
    está prohibida al intentar rebasarlo?
  choices:
    A: Rebasar el vehículo con cuidado por la derecha
    B: Conducir por el acotamiento de la carretera para rebasar
    C: Esperar a que el vehículo complete su giro
    D: Revisar sus puntos ciegos antes de moverse a la derecha
  answer: B
  explanation: 'El manual enfatiza: ''NUNCA CONDUZCA POR EL ACOTAMIENTO DE LA CARRETERA
    PARA REBASAR A UN VEHÍCULO QUE ESTÁ GIRANDO A LA IZQUIERDA''.'
- id: 169
  category: defensive_driving
  question: Si aparece un conflicto antes de haber terminado de rebasar a otro vehículo
    en una carretera de dos carriles, ¿qué debe hacer?
  choices:
    A: Acelerar para completar el adelantamiento rápidamente
    B: Tocar la bocina y obligar al otro vehículo a irse al acotamiento
    C: Frenar bruscamente y regresar al carril detrás del vehículo rebasado
    D: Moverse hacia el acotamiento izquierdo para evitar el tráfico que viene de
      frente
  answer: C
  explanation: Si aparece un conflicto antes de completar un adelantamiento, debe
    frenar bruscamente y regresar al carril detrás del vehículo rebasado. No debe
    intentar aumentar su velocidad para completar el adelantamiento.
- id: 170
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cuándo es seguro volver a su carril de tráfico
    correspondiente?
  choices:
    A: Tan pronto como su parachoques delantero pase al otro vehículo
    B: Cuando pueda ver al vehículo rebasado en su espejo retrovisor interior
    C: Después de haber viajado al menos 100 pies más allá del vehículo
    D: Cuando el conductor al que está rebasando parpadee sus faros
  answer: B
  explanation: Debe volver al carril de tráfico correspondiente cuando pueda ver al
    vehículo rebasado en su espejo retrovisor interior.
- id: 171
  category: defensive_driving
  question: ¿Cuál de las siguientes es una pista de que un vehículo estacionado podría
    incorporarse repentinamente a su carril de circulación?
  choices:
    A: Las ventanillas del vehículo están bajadas
    B: El vehículo está estacionado en una colina
    C: Sale humo o vapor visible del tubo de escape
    D: El vehículo tiene un parasol en el parabrisas
  answer: C
  explanation: Al pasar junto a vehículos estacionados, las pistas de que un vehículo
    puede moverse incluyen movimiento en su interior, luces encendidas, ruedas delanteras
    giradas y humo o vapor visible saliendo del tubo de escape.
- id: 172
  category: safe_driving_rules
  question: Al conducir en un área abierta con tráfico fluido en una carretera con
    dos carriles en su dirección, ¿cómo debe utilizar los carriles?
  choices:
    A: Usar el carril izquierdo para la conducción normal y el carril derecho para
      rebasar
    B: Usar el carril derecho para la conducción normal y el carril izquierdo para
      rebasar
    C: Conducir en el centro de ambos carriles
    D: Cambiar de carril constantemente para mantener la velocidad más alta
  answer: B
  explanation: En carreteras de dos carriles por sentido en áreas abiertas con tráfico
    fluido, debe usar el carril derecho para la conducción normal y el carril izquierdo
    para rebasar o cuando entren vehículos por la derecha.
- id: 173
  category: sharing_the_road
  question: Al realizar un giro a la derecha en una intersección, ¿qué debe evitar
    hacer?
  choices:
    A: Usar su luz de giro
    B: Conducir en un carril para bicicletas
    C: Buscar peatones
    D: Reducir la velocidad antes del giro
  answer: B
  explanation: 'El manual establece explícitamente: ''Al realizar un giro a la derecha
    en una intersección, no conduzca en un carril para bicicletas''.'
- id: 174
  category: defensive_driving
  question: ¿Qué debe hacer si está en peligro de chocar contra otro vehículo, persona
    u objeto?
  choices:
    A: Pisar los frenos a fondo y mantenerlos presionados firmemente.
    B: Presionar y soltar los frenos rápidamente y maniobrar hacia un área despejada.
    C: Apagar el motor y aplicar el freno de emergencia.
    D: Reducir a la marcha más baja inmediatamente.
  answer: B
  explanation: El manual indica que si está en peligro de chocar contra algo, no debe
    simplemente clavar los frenos y deslizar las ruedas. En su lugar, presione y suelte
    los frenos rápidamente y dirija el vehículo hacia un área despejada.
- id: 175
  category: safe_driving_rules
  question: ¿Cuándo es seguro conducir su vehículo hacia una intersección o paso de
    peatones?
  choices:
    A: Tan pronto como el semáforo se ponga en verde.
    B: Cuando esté realizando un giro a la derecha en rojo.
    C: Solo cuando haya espacio para todo su vehículo en el lado opuesto.
    D: Cuando el vehículo delante de usted comience a moverse.
  answer: C
  explanation: 'El manual advierte explícitamente: NUNCA CONDUZCA SU VEHÍCULO HACIA
    UNA INTERSECCIÓN O UN PASO DE PEATONES A MENOS QUE HAYA ESPACIO PARA TODO SU VEHÍCULO
    EN EL LADO OPUESTO DE LA INTERSECCIÓN O DEL PASO DE PEATONES.'
- id: 176
  category: safe_driving_rules
  question: ¿Qué debe hacer inmediatamente después de conducir a través de agua?
  choices:
    A: Acelerar rápidamente para secar las llantas.
    B: Cambiar a una marcha más baja.
    C: Detenerse a un lado y esperar a que los frenos se sequen.
    D: Probar el funcionamiento de los frenos.
  answer: D
  explanation: Según el manual, siempre debe probar el funcionamiento de los frenos
    después de conducir a través de agua. Si la acción de frenado se reduce, aplíquelos
    ligeramente varias veces hasta que se restaure el funcionamiento adecuado.
- id: 177
  category: defensive_driving
  question: Al detenerse en el tráfico detrás de otro vehículo, ¿cuánto espacio debe
    dejar?
  choices:
    A: Exactamente la longitud de un automóvil.
    B: Suficiente espacio para ver el punto donde las llantas traseras del vehículo
      de adelante tocan la carretera.
    C: Al menos tres pies de distancia desde su parachoques trasero.
    D: Lo suficientemente cerca para que otro vehículo no pueda meterse delante de
      usted.
  answer: B
  explanation: El manual aconseja detenerse lo suficientemente lejos detrás del vehículo
    de adelante para poder ver el punto donde sus llantas traseras tocan la carretera,
    lo que permite tener espacio para rodearlo si es necesario.
- id: 178
  category: vehicle_information
  question: ¿Por qué NO se recomienda reducir de marcha (hacer cambios descendentes)
    como rutina habitual para disminuir la velocidad?
  choices:
    A: Provoca una desaceleración rápida sin dar una señal de advertencia a los conductores
      que vienen detrás.
    B: Consume más combustible que aplicar los frenos.
    C: Activa automáticamente las luces de advertencia de peligro (intermitentes).
    D: Hace que las ruedas del vehículo se bloqueen y se deslicen.
  answer: A
  explanation: La práctica de reducir de marcha como rutina habitual no se recomienda
    porque provoca una desaceleración rápida del vehículo sin una señal de advertencia
    (luz de freno) para los conductores que le siguen.
- id: 179
  category: vehicle_information
  question: Al utilizar cambios descendentes para obtener un efecto de frenado adicional
    en una pendiente descendente pronunciada, ¿cuándo se debe realizar el cambio?
  choices:
    A: A mitad de la pendiente.
    B: Antes de comenzar la pendiente descendente.
    C: Solo después de que los frenos hayan comenzado a sobrecalentarse.
    D: Al final de la pendiente descendente.
  answer: B
  explanation: El manual establece que el cambio descendente debe realizarse antes
    de comenzar la pendiente porque es más difícil reducir de marcha a velocidades
    más altas.
- id: 180
  category: vehicle_information
  question: ¿Qué significa si la luz de advertencia de los frenos en el panel de instrumentos
    se enciende cuando usted aplica los frenos?
  choices:
    A: El freno de estacionamiento está totalmente accionado.
    B: El sistema de frenos ha fallado parcialmente y requiere reparación inmediata.
    C: El líquido de frenos está en un nivel óptimo.
    D: El sistema de frenos antibloqueo (ABS) está funcionando normalmente.
  answer: B
  explanation: Si la luz de advertencia de los frenos se enciende al aplicar los frenos,
    indica que el sistema de frenos ha fallado parcialmente y se requiere una reparación
    inmediata.
- id: 181
  category: safe_driving_rules
  question: ¿En qué dirección debe girar las ruedas al estacionar en una colina, ya
    sea cuesta arriba o cuesta abajo?
  choices:
    A: Hacia la izquierda.
    B: Hacia adelante.
    C: Hacia la derecha.
    D: Lejos del bordillo.
  answer: C
  explanation: 'El manual indica: "Ya sea que estacione cuesta arriba o cuesta abajo,
    gire las ruedas hacia la derecha. Esto asegurará que el vehículo ruede lejos del
    tráfico si algo hace que se desplace libremente".'
- id: 182
  category: safe_driving_rules
  question: Al estacionar en paralelo, ¿a qué distancia deben estar las ruedas del
    lado de la acera del vehículo con respecto al bordillo?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 12 pulgadas
    C: A menos de 18 pulgadas
    D: A menos de 24 pulgadas
  answer: B
  explanation: Al estacionar en paralelo, las ruedas del lado de la acera del vehículo
    deben estar a menos de 12 pulgadas del bordillo (30 cm), o completamente dentro
    del espacio de estacionamiento marcado.
- id: 183
  category: vehicle_information
  question: ¿Cuál es una causa común por la que una señal de giro eléctrica no se
    cancela automáticamente?
  choices:
    A: Realizar un giro o cambio de carril que es demasiado pequeño para activar el
      mecanismo de autocancelación.
    B: Conducir a velocidades superiores a 60 millas por hora.
    C: Una bombilla de luz de freno fundida.
    D: Usar la señal de giro en condiciones climáticas adversas.
  answer: A
  explanation: La falta de cancelación suele ser causada por realizar un giro o cambio
    de carril que es demasiado pequeño para provocar el funcionamiento del mecanismo
    de autocancelación.
- id: 184
  category: safe_driving_rules
  question: Al estacionar en paralelo, ¿a qué distancia deben estar sus parachoques
    delantero y trasero de los otros vehículos estacionados?
  choices:
    A: A no menos de un pie.
    B: A no menos de dos pies.
    C: A no menos de tres pies.
    D: A no menos de cuatro pies.
  answer: B
  explanation: El manual establece que los parachoques delantero y trasero no deben
    estar a menos de dos pies de los otros vehículos cuando se está en posición de
    estacionamiento, a menos que la calle esté marcada de otra manera.
- id: 185
  category: vehicle_information
  question: ¿Por qué debe evitar apoyar el pie en el pedal del freno mientras conduce?
  choices:
    A: Hace que el motor se apague.
    B: Desactiva las señales eléctricas del vehículo.
    C: Activa las luces de freno y da una señal incorrecta a los conductores que vienen
      detrás.
    D: Aumenta la eficiencia de combustible del vehículo.
  answer: C
  explanation: Apoyar el pie en el pedal del freno hace que se activen las luces de
    freno (stop), lo que da una señal incorrecta a los conductores que vienen detrás
    y provoca un desgaste excesivo de los frenos.
- id: 186
  category: vehicle_information
  question: ¿Cómo se pueden evitar generalmente las aplicaciones prolongadas de los
    frenos que hacen que estos se calienten y pierdan eficacia?
  choices:
    A: Cambiando a una marcha más baja y permitiendo que el motor ayude a mantener
      la velocidad baja.
    B: Bombeando los frenos rápidamente cada pocos segundos.
    C: Poniendo el vehículo en punto muerto mientras baja una pendiente.
    D: Aplicando ligeramente el freno de mano.
  answer: A
  explanation: Por lo general, el uso prolongado de los frenos se puede evitar cambiando
    a una marcha más baja y permitiendo que el motor ayude a mantener baja la velocidad
    del vehículo.
- id: 187
  category: safe_driving_rules
  question: ¿Dónde debe evitar estacionar su vehículo?
  choices:
    A: En una zona de carga designada.
    B: En lugares que estén ocultos, como justo después de una curva o en la cima
      de una colina.
    C: En una calle con marcas de estacionamiento en paralelo.
    D: En un espacio de estacionamiento marcado.
  answer: B
  explanation: Siempre debe estacionar en un lugar libre de tráfico y que sea fácilmente
    visible. Evite los lugares que estén ocultos, como justo después de una curva
    o en la cima de una colina.
- id: 188
  category: vehicle_information
  question: ¿Cuál es una desventaja de usar señales manuales en lugar de señales de
    giro eléctricas?
  choices:
    A: Suelen estar sujetas a fallos mecánicos.
    B: No son fácilmente visibles para los conductores a la derecha del vehículo que
      hace la señal.
    C: Requieren que el conductor use ambas manos para controlar el vehículo.
    D: Solo están permitidas legalmente durante las horas del día.
  answer: B
  explanation: Según el manual, una desventaja de las señales manuales es que no son
    fácilmente visibles para los conductores a la derecha del vehículo que hace la
    señal.
- id: 189
  category: safe_driving_rules
  question: ¿Cuándo es apropiado usar sus señales de advertencia de peligro (luces
    intermitentes de 4 vías)?
  choices:
    A: Al conducir bajo lluvia intensa o niebla.
    B: Cuando su vehículo se mueve lentamente subiendo una colina empinada.
    C: Para advertir a otros conductores que su vehículo se encuentra en una posición
      peligrosa en la calzada.
    D: Cuando se está preparando para hacer un giro en U repentino.
  answer: C
  explanation: Las señales de advertencia de peligro están destinadas a advertir a
    otros conductores que un vehículo se encuentra en una posición peligrosa en la
    calzada y nunca deben usarse cuando el vehículo está en movimiento.
- id: 190
  category: safe_driving_rules
  question: Si debe reducir la velocidad de su vehículo antes de realizar un giro
    previsto, ¿cuándo debe comenzar a señalizar?
  choices:
    A: Antes de comenzar a reducir la velocidad de su vehículo.
    B: Mientras está aplicando los frenos.
    C: Después de haber alcanzado la velocidad de giro adecuada.
    D: Justo cuando comienza a girar el volante.
  answer: A
  explanation: Si debe reducir la velocidad de su vehículo antes de poder realizar
    el giro o cambio de carril previsto, es importante que comience a señalizar antes
    de reducir la velocidad para alertar a otros conductores.
- id: 191
  category: sharing_the_road
  question: ¿Al compartir la carretera con motocicletas, qué regla deben recordar
    los conductores con respecto al uso del carril?
  choices:
    A: Los motociclistas deben circular por el borde derecho del carril.
    B: Los motociclistas tienen derecho al ancho total de su carril de circulación.
    C: Dos motocicletas deben compartir un solo carril para ahorrar espacio.
    D: Los automóviles pueden compartir un carril con una motocicleta si el carril
      es lo suficientemente ancho.
  answer: B
  explanation: El manual establece explícitamente que un motociclista tiene derecho
    al ancho total de su carril de circulación.
- id: 192
  category: defensive_driving
  question: ¿Por qué las primeras gotas de lluvia se consideran una señal de peligro
    para un conductor defensivo?
  choices:
    A: Indican que el hidroplaneo (hydroplaning) es inminente.
    B: Hacen que se forme niebla inmediata en el parabrisas.
    C: Las carreteras están más resbaladizas porque el aceite derramado por los autos
      que pasan no ha sido lavado.
    D: La lluvia lavará las marcas pintadas de los carriles.
  answer: C
  explanation: Las primeras gotas de lluvia son una señal de peligro porque las carreteras
    están más resbaladizas en ese momento; el aceite derramado por los autos que pasan
    aún no ha sido lavado.
- id: 193
  category: defensive_driving
  question: ¿A qué velocidad suele empezar a producirse el hidroplaneo (hydroplaning)
    parcial?
  choices:
    A: 25 millas por hora
    B: 35 millas por hora
    C: 45 millas por hora
    D: 55 millas por hora
  answer: B
  explanation: Según el manual, el hidroplaneo parcial puede comenzar a las 35 millas
    por hora (56 km/h).
- id: 194
  category: defensive_driving
  question: ¿Qué le sucede a un vehículo cuando hidroplanea a altas velocidades, como
    a 55 mph bajo lluvia intensa?
  choices:
    A: Los neumáticos pierden todo contacto con el pavimento y el conductor no tiene
      control.
    B: Los frenos del vehículo se bloquean automáticamente.
    C: El volante se vuelve significativamente más pesado para girar.
    D: El motor se detendrá debido a la entrada de agua.
  answer: A
  explanation: A 55 millas por hora bajo lluvia intensa, los neumáticos pueden perder
    todo contacto con el pavimento, lo que significa que no puede frenar, acelerar
    ni girar, y no tiene control sobre su vehículo.
- id: 195
  category: vehicle_information
  question: ¿Cuál de las siguientes es una forma recomendada de evitar que su vehículo
    hidroplanee?
  choices:
    A: Inflar demasiado los neumáticos por encima de la presión recomendada.
    B: Asegurarse de que sus neumáticos tengan una buena profundidad de dibujo (banda
      de rodadura).
    C: Aumentar su velocidad para atravesar el agua más rápido.
    D: Conducir con las luces de emergencia encendidas.
  answer: B
  explanation: Para evitar el hidroplaneo, debe asegurarse de que los neumáticos del
    vehículo tengan una buena profundidad de dibujo, ya que los neumáticos desgastados
    o lisos hidroplanearán a velocidades más bajas.
- id: 196
  category: defensive_driving
  question: ¿Qué debe hacer si sus frenos se mojan después de conducir por agua profunda
    y no frenan correctamente?
  choices:
    A: Bombear los frenos de forma rápida y con fuerza.
    B: Poner el vehículo en punto muerto (neutral) y avanzar por inercia hasta que
      se sequen.
    C: Reducir la velocidad y aplicar una presión suave en el pedal del freno hasta
      que vuelvan a funcionar correctamente.
    D: Poner el freno de mano de emergencia inmediatamente.
  answer: C
  explanation: Si los frenos se mojan, debe reducir la velocidad y aplicar una presión
    suave en el pedal del freno hasta que sus frenos vuelvan a funcionar correctamente.
- id: 197
  category: safe_driving_rules
  question: ¿Qué debe hacer si la lluvia intensa reduce su visibilidad mientras conduce?
  choices:
    A: Encender las luces altas (high beam).
    B: Encender sus señales de advertencia de peligro (luces de emergencia) mientras
      se desplaza.
    C: Reducir su velocidad y encender las luces bajas (low beam).
    D: Detenerse inmediatamente en medio de su carril.
  answer: C
  explanation: Cuando la lluvia intensa reduzca su visibilidad, reduzca su velocidad
    y encienda los faros (luces bajas) para que otros puedan verlo.
- id: 198
  category: defensive_driving
  question: Al conducir con niebla, ¿por qué nunca debe usar las luces altas (high
    beam)?
  choices:
    A: Las luces altas agotarán la batería del vehículo más rápido en climas fríos.
    B: Es ilegal usar luces altas fuera de los límites de la ciudad.
    C: El reflejo reducirá su capacidad de ver y cegará a los conductores que se aproximan.
    D: Las luces altas no activan las luces traseras del vehículo.
  answer: C
  explanation: En condiciones de niebla, nunca debe usar las luces altas porque el
    reflejo reducirá su capacidad de ver y la luz reducirá la capacidad de ver del
    conductor que se aproxima.
- id: 199
  category: defensive_driving
  question: Si la niebla es tan espesa que no puede ver al menos la longitud de dos
    autos (40 pies) hacia adelante, ¿cuál es la acción más segura?
  choices:
    A: Bajar las ventanillas y tocar la bocina periódicamente.
    B: Salirse completamente del pavimento, detenerse y encender las señales de advertencia
      de peligro (luces de emergencia).
    C: Situarse sobre la línea central para mantenerse en la carretera.
    D: Encender las luces altas y avanzar a 10 mph.
  answer: B
  explanation: Si no puede ver al menos la longitud de dos autos en la niebla, sálgase
    completamente del pavimento, deténgase y encienda las señales de advertencia de
    peligro.
- id: 200
  category: defensive_driving
  question: Al conducir en condiciones invernales, ¿dónde debe esperar que se acumule
    hielo incluso cuando el resto de la carretera esté despejado?
  choices:
    A: En las cimas de las colinas.
    B: Sobre o debajo de los puentes.
    C: En el carril central de una autopista de varios carriles.
    D: Cerca de las intersecciones con semáforos.
  answer: B
  explanation: Durante la conducción en invierno, preste atención a los puntos peligrosos
    porque el hielo puede acumularse sobre o debajo de los puentes, incluso cuando
    el resto de la carretera esté despejado.
- id: 201
  category: safe_driving_rules
  question: ¿Qué luces debe utilizar durante los breves periodos del amanecer y el
    atardecer cuando no hay suficiente luz para ver los objetos con claridad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Señales de advertencia de peligro
    D: Solo luces de estacionamiento
  answer: B
  explanation: Durante el amanecer y el atardecer, cuando no hay suficiente luz para
    ver con claridad, debe encender las luces bajas para que los demás puedan verlo.
- id: 202
  category: defensive_driving
  question: ¿Qué debe hacer si las luces de un vehículo que se aproxima son demasiado
    brillantes por la noche?
  choices:
    A: Encender las luces altas hasta que pase el vehículo.
    B: Hacer un cambio de luces altas una vez y mirar hacia el borde derecho de la
      carretera.
    C: Cerrar los ojos brevemente para evitar el deslumbramiento.
    D: Dirigirse hacia la línea central para darle más espacio al vehículo.
  answer: B
  explanation: El manual establece que si las luces de un vehículo que se aproxima
    son demasiado brillantes, debe hacer un cambio de luces altas una vez y mirar
    hacia el borde derecho de la carretera, utilizando las marcas del carril o los
    reflectores como guía.
- id: 203
  category: signs_and_signals
  question: ¿Qué indican los reflectores rojos de marcación de carril en la calzada?
  choices:
    A: Se está aproximando a una señal de alto o a un semáforo.
    B: Hay un peligro o una zona de construcción en el acotamiento.
    C: Va en dirección contraria en el carril de circulación.
    D: Está entrando en una zona escolar.
  answer: C
  explanation: Según el manual, debe reconocer que los reflectores rojos de marcación
    de carril significan que va en dirección contraria en el carril de circulación.
- id: 204
  category: safe_driving_rules
  question: Si el tráfico en un carril de entrada a la autopista está congestionado,
    ¿cuál es una acción peligrosa que debe evitar?
  choices:
    A: Reducir la velocidad cerca de la entrada.
    B: Detenerse cerca de la entrada.
    C: Avanzar lentamente hasta el final del carril de entrada y detenerse.
    D: Observar el tráfico en el carril de entrada antes de incorporarse.
  answer: C
  explanation: 'El manual advierte explícitamente: "NO AVANCE LENTAMENTE HASTA EL
    FINAL DEL CARRIL DE ENTRADA Y SE DETENGA. Es muy difícil y peligroso intentar
    entrar al tráfico de la autopista cuando se está detenido al final del carril
    de entrada".'
- id: 205
  category: safe_driving_rules
  question: ¿Qué carril(es) debe utilizar el tráfico de paso en una autopista?
  choices:
    A: Solo el carril derecho.
    B: El carril del acotamiento.
    C: El carril de salida.
    D: Los carriles de la izquierda o del centro.
  answer: D
  explanation: El manual establece que el tráfico de paso debe utilizar los carriles
    de la izquierda o del centro y circular a la velocidad máxima permitida o cerca
    de ella, mientras que el carril derecho es utilizado por los vehículos más lentos
    y el tráfico que entra o sale.
- id: 206
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa del lugar donde pretendía salir de la autopista?
  choices:
    A: Detenerse y retroceder con cuidado por el acotamiento.
    B: Hacer un giro en U en la siguiente apertura de la mediana.
    C: Continuar hasta la siguiente salida.
    D: Detenerse en el carril derecho y esperar un espacio en el tráfico para dar
      marcha atrás.
  answer: C
  explanation: 'Si se pasa de la salida prevista, el manual indica: "¡NO SE DETENGA;
    NO DÉ MARCHA ATRÁS! Continúe hasta la siguiente salida".'
- id: 207
  category: defensive_driving
  question: Si ve a otro conductor en problemas en la autopista, ¿cuál es el procedimiento
    recomendado?
  choices:
    A: Detenerse inmediatamente en el acotamiento para ayudarlo.
    B: No detenerse para ayudar, sino informar de la situación a las autoridades competentes.
    C: Detenerse en el carril derecho y encender las luces de emergencia.
    D: Reducir la velocidad a 15 mph para preguntar si necesitan una grúa.
  answer: B
  explanation: 'Para las paradas de emergencia en la autopista, el manual aconseja:
    "No se detenga para ayudar a otros conductores en problemas, sino informe de la
    situación a las autoridades competentes".'
- id: 208
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si se le revienta un neumático mientras
    conduce?
  choices:
    A: Aplicar los frenos con firmeza y rapidez.
    B: Bombear el pedal del freno para mantener la presión hidráulica.
    C: Sujetar el volante con firmeza y no aplicar los frenos.
    D: Dar un volantazo para salirse de la carretera inmediatamente.
  answer: C
  explanation: 'Si se le revienta un neumático, el manual establece: "NO APLIQUE LOS
    FRENOS... Sujete el volante con firmeza y maniobre para permanecer en su carril
    de circulación".'
- id: 209
  category: vehicle_information
  question: Si los frenos de su vehículo fallan por completo, ¿qué secuencia de acciones
    debe realizar primero?
  choices:
    A: Apagar el motor y aplicar el freno de estacionamiento rápidamente.
    B: Bombear el pedal del freno rápidamente y luego cambiar a una marcha más baja.
    C: Poner punto muerto y avanzar por inercia hasta detenerse.
    D: Pisar el freno de estacionamiento con gran fuerza.
  answer: B
  explanation: Si los frenos fallan por completo, el manual le indica que debe "Bombear
    el pedal del freno rápidamente; luego cambiar a una marcha más baja" antes de
    buscar una ruta de escape y aplicar el freno de estacionamiento gradualmente.
- id: 210
  category: defensive_driving
  question: Si las ruedas de su vehículo se salen del borde del pavimento, ¿qué NO
    debe hacer?
  choices:
    A: Reducir la velocidad.
    B: Usar los frenos suavemente.
    C: Intentar forzar el vehículo a volver al pavimento dando un volantazo.
    D: Continuar conduciendo con las ruedas fuera del pavimento hasta alcanzar una
      velocidad segura.
  answer: C
  explanation: 'Cuando las ruedas se salen del pavimento, el manual advierte explícitamente:
    "NO INTENTE FORZAR EL VEHÍCULO A VOLVER AL PAVIMENTO DANDO UN VOLANTAZO".'
- id: 211
  category: sharing_the_road
  question: ¿Si un vehículo intenta rebasarlo pero no puede completar la maniobra
    debido al tráfico en sentido contrario, cómo puede ayudar a evitar una colisión?
  choices:
    A: Gire su vehículo lo más a la izquierda posible.
    B: Acelere para evitar que se incorporen detrás de usted.
    C: Dirija su vehículo lo más a la derecha posible con seguridad.
    D: Toque la bocina para advertir al tráfico en sentido contrario.
  answer: C
  explanation: Para ayudar a un vehículo que rebasa y está en peligro, debe dirigir
    su vehículo lo más a la derecha posible con seguridad, incluso hacia el acotamiento
    si es posible.
- id: 212
  category: defensive_driving
  question: Si observa un vehículo que viene en sentido contrario en su carril de
    circulación, ¿cuál es la acción evasiva correcta?
  choices:
    A: Entre en el carril de tráfico en sentido contrario para evitarlo.
    B: Deténgase inmediatamente en su carril y prepárese para el impacto.
    C: Acelere y gire a la izquierda.
    D: Use las luces, toque la bocina y gire a la derecha.
  answer: D
  explanation: Si hay un vehículo en sentido contrario en su carril, debe "usar las
    luces y tocar la bocina" y "reducir rápidamente la velocidad de su vehículo y
    girar a la derecha fuera del carril... NO ENTRE EN EL CARRIL DE TRÁFICO EN SENTIDO
    CONTRARIO".
- id: 213
  category: vehicle_information
  question: ¿Cuál es una de las primeras acciones que debe tomar si el acelerador
    de su vehículo se queda pegado (abierto)?
  choices:
    A: Golpee el pedal del acelerador con fuerza con el pie.
    B: Bombee los frenos rápidamente.
    C: Cambie a reversa.
    D: Mueva el volante bruscamente de un lado a otro.
  answer: A
  explanation: Si su acelerador se queda pegado, el manual aconseja que debe "golpear
    el pedal del acelerador con fuerza con el pie".
- id: 214
  category: safe_driving_rules
  question: Al salir de una autopista (freeway), ¿en qué momento debe reducir la velocidad
    de su vehículo?
  choices:
    A: Mientras todavía se encuentra en el carril principal de tráfico de la autopista.
    B: Tan pronto como encienda su luz direccional.
    C: Después de haber entrado completamente en la rampa de salida.
    D: Solo cuando vea una señal de alto al final de la rampa.
  answer: C
  explanation: Al salir de la autopista, debe "mantener su velocidad hasta que esté
    completamente dentro de la rampa de salida, luego reduzca la velocidad suavemente".
- id: 215
  category: safe_driving_rules
  question: Durante el corto período antes de que salga el sol y después de que se
    ponga el sol, ¿qué luces debe utilizar?
  choices:
    A: Solo las luces de estacionamiento.
    B: Luces altas (high beam).
    C: Luces bajas (low beam).
    D: Luces de emergencia.
  answer: C
  explanation: El manual establece que durante el corto período antes del amanecer
    y después del atardecer, "debe encender las luces delanteras en la posición de
    luces bajas para que otros puedan verlo".
- id: 216
  category: defensive_driving
  question: ¿Cuál es una regla básica con respecto al uso de los frenos durante una
    emergencia de conducción?
  choices:
    A: Siempre pise los frenos a fondo para detenerse lo más rápido posible.
    B: Evite frenar bruscamente y que las ruedas se deslicen.
    C: Bloquee las ruedas para mantener el control de la dirección.
    D: Use solo el freno de mano para reducir la velocidad.
  answer: B
  explanation: En los procedimientos de conducción de emergencia, un punto básico
    es "evitar frenar bruscamente y que las ruedas se deslicen. No puede controlar
    un vehículo cuando las ruedas se están deslizando".
- id: 217
  category: vehicle_information
  question: Si su vehículo experimenta una falla en la dirección asistida (power steering),
    ¿qué sucederá cuando intente maniobrar?
  choices:
    A: El volante se bloqueará por completo.
    B: El vehículo aplicará los frenos automáticamente.
    C: Se requerirá un esfuerzo adicional para mantener el control de la dirección.
    D: El volante girará libremente sin mover los neumáticos.
  answer: C
  explanation: En caso de falla de la dirección asistida, se requerirá un esfuerzo
    adicional para mantener el control de la dirección. Debe reducir la velocidad,
    conducir a un área segura y detenerse.
- id: 218
  category: defensive_driving
  question: Según el manual, ¿cuál es la causa más común de los derrapes?
  choices:
    A: Conducir con neumáticos poco inflados.
    B: Velocidad excesiva para las condiciones existentes de la carretera y el tráfico.
    C: Conducir con pastillas de freno desgastadas.
    D: Cambios repentinos en la dirección del viento.
  answer: B
  explanation: La mayoría de los derrapes son causados por cambios repentinos de dirección
    o velocidad, siendo la velocidad excesiva para las condiciones existentes de la
    carretera y el tráfico la causa más común.
- id: 219
  category: defensive_driving
  question: ¿Hacia dónde debe girar el volante si la parte trasera de su vehículo
    comienza a derrapar hacia la derecha?
  choices:
    A: Gire el volante hacia la izquierda.
    B: Mantenga el volante perfectamente recto.
    C: Gire el volante hacia la derecha.
    D: Bombee los frenos mientras gira a la izquierda.
  answer: C
  explanation: Para salir de un derrape, debe girar el volante en la dirección en
    la que derrapa la parte trasera del vehículo. Si derrapa hacia la derecha, gire
    el volante hacia la derecha.
- id: 220
  category: safe_driving_rules
  question: ¿Cuál de los siguientes elementos NUNCA debe usar para extinguir un incendio
    de gasolina, aceite o eléctrico en su vehículo?
  choices:
    A: Tierra
    B: Arena
    C: Una manta
    D: Agua
  answer: D
  explanation: Si ocurre un incendio pequeño, puede usar un extintor, tierra, arena
    o una manta para sofocarlo. Sin embargo, NO DEBE USAR AGUA EN INCENDIOS DE GASOLINA,
    ACEITE O ELÉCTRICOS.
- id: 221
  category: safe_driving_rules
  question: ¿Cómo puede indicar que necesita asistencia si su vehículo se avería en
    la carretera?
  choices:
    A: Toque la bocina continuamente.
    B: Párese en medio del carril y agite los brazos.
    C: Levante el capó y ate un paño blanco a la antena de la radio o a la manija
      de la puerta.
    D: Haga destellos con las luces altas a los vehículos que pasan.
  answer: C
  explanation: Para indicar la necesidad de asistencia durante una avería, levante
    el capó de su vehículo y ate un paño blanco a la antena de la radio o a la manija
    de la puerta.
- id: 222
  category: safe_driving_rules
  question: Si debe caminar por la carretera después de una avería del vehículo, ¿cómo
    debe caminar?
  choices:
    A: Camine de espaldas al tráfico.
    B: Camine de frente al tráfico y bien alejado de la calzada.
    C: Camine por el arcén en la misma dirección que el tráfico.
    D: Camine por la mediana central.
  answer: B
  explanation: Si debe caminar por la carretera, el manual establece que debe caminar
    de frente al tráfico y bien alejado de la calzada.
- id: 223
  category: safe_driving_rules
  question: ¿Qué debe hacer si su vehículo se avería en una autopista y necesita ayuda?
  choices:
    A: Camine por la autopista de frente al tráfico para buscar un teléfono.
    B: Pida un aventón (haga autostop) hasta la salida más cercana.
    C: Permanezca con su vehículo hasta que llegue la ayuda; no camine por las autopistas.
    D: Camine por la autopista en la misma dirección que el tráfico.
  answer: C
  explanation: 'El manual establece explícitamente: "No camine por las autopistas;
    permanezca con su vehículo hasta que llegue la ayuda".'
- id: 224
  category: sharing_the_road
  question: ¿Qué afirmación es verdadera con respecto a la visibilidad de los conductores
    en vehículos grandes?
  choices:
    A: Tienen una visibilidad excelente hacia los lados y hacia atrás.
    B: Pueden ver fácilmente el área inmediatamente detrás de su vehículo.
    C: Generalmente tienen una mejor visibilidad hacia adelante porque su posición
      está por encima de la mayoría de los demás vehículos.
    D: Tienen peor visibilidad hacia adelante que los automóviles de pasajeros.
  answer: C
  explanation: Los vehículos más grandes generalmente brindan una mejor visibilidad
    hacia adelante porque la posición del conductor está por encima de la mayoría
    de los demás vehículos, aunque la visibilidad hacia los lados y hacia atrás es
    muy limitada.
- id: 225
  category: sharing_the_road
  question: 'Al cambiar de carril o en intersecciones cerca de vehículos grandes,
    los otros conductores deben tener en cuenta lo siguiente del vehículo grande:'
  choices:
    A: Su aceleración más rápida.
    B: Su mayor distancia de frenado.
    C: Su radio de giro más cerrado.
    D: Su mejor visibilidad trasera.
  answer: B
  explanation: Los vehículos grandes requieren distancias de frenado mayores que otros
    vehículos. Los demás conductores deben tener en cuenta esta mayor distancia de
    frenado al cambiar de carril o en las intersecciones.
- id: 226
  category: vehicle_information
  question: ¿Qué deben hacer los conductores de vehículos grandes antes de descender
    una colina empinada para evitar el sobrecalentamiento de los frenos?
  choices:
    A: Cambiar a una marcha inferior adecuada.
    B: Poner el vehículo en punto muerto (neutral).
    C: Bombear los frenos continuamente.
    D: Apagar el motor.
  answer: A
  explanation: Los conductores de vehículos grandes deben cambiar a una marcha inferior
    adecuada antes de descender una colina empinada para minimizar la posibilidad
    de sobrecalentar los frenos.
- id: 227
  category: sharing_the_road
  question: ¿Qué peligro crean los vehículos grandes que se mueven rápido para los
    vehículos más pequeños que los rebasan?
  choices:
    A: Emiten gases de escape tóxicos que oscurecen la visión.
    B: Causan ráfagas de viento con fuerza suficiente para provocar cambios de dirección
      en vehículos más pequeños.
    C: Sueltan escombros de sus neumáticos.
    D: Crean un vacío que empuja a los vehículos más pequeños hacia adelante.
  answer: B
  explanation: Los vehículos grandes que se mueven rápido causan ráfagas de viento
    (estela) con una fuerza lo suficientemente grande como para provocar cambios de
    dirección en vehículos más pequeños.
- id: 228
  category: vehicle_information
  question: Si está remolcando un remolque que obstruye su visión a través del espejo
    retrovisor interior, ¿qué se requiere?
  choices:
    A: Un pasajero que actúe como observador.
    B: Un sistema de cámara de visión trasera.
    C: Espejos retrovisores exteriores de tamaño adecuado en ambos lados de su automóvil.
    D: Un letrero de "Carga ancha" (Wide Load) en la parte trasera del remolque.
  answer: C
  explanation: Si su remolque es lo suficientemente grande como para obstruir su visión
    a través del espejo retrovisor interior, debe tener espejos retrovisores exteriores
    de tamaño adecuado en ambos lados de su automóvil.
- id: 229
  category: vehicle_information
  question: 'Un remolque debe estar equipado con frenos si su peso cargado es de 3,000
    libras o más, O si pesa más de:'
  choices:
    A: Un cuarto del peso del vehículo remolcador.
    B: Un tercio del peso del vehículo remolcador.
    C: La mitad del peso del vehículo remolcador.
    D: Tres cuartos del peso del vehículo remolcador.
  answer: C
  explanation: Si su remolque cargado pesa más de la mitad del peso del vehículo remolcador
    o es de 3,000 libras o más, el remolque debe estar equipado con frenos.
- id: 230
  category: defensive_driving
  question: Si su vehículo comienza a derrapar y el derrape comenzó cuando aplicó
    los frenos, ¿qué es lo primero que debe hacer?
  choices:
    A: Presionar los frenos con más fuerza.
    B: Soltar los frenos.
    C: Bombear los frenos rápidamente.
    D: Aplicar el freno de mano de emergencia.
  answer: B
  explanation: Para salir de un derrape mediante la dirección, debe evitar usar los
    frenos. Si el derrape comenzó cuando aplicó los frenos, debe soltar los frenos.
- id: 231
  category: vehicle_information
  question: Si su remolque es lo suficientemente grande como para obstruir su visión
    a través del espejo retrovisor interior, ¿con qué debe estar equipado su vehículo?
  choices:
    A: Un sistema de cámara de visión trasera
    B: Espejos retrovisores exteriores de tamaño adecuado en ambos lados de su automóvil
    C: Un pasajero que actúe como observador
    D: Enganches de parachoques extendidos
  answer: B
  explanation: Según el manual, si un remolque obstruye su visión a través del espejo
    retrovisor interior, debe tener espejos retrovisores exteriores de tamaño adecuado
    en ambos lados de su automóvil.
- id: 232
  category: vehicle_information
  question: ¿Bajo qué condiciones debe un remolque estar equipado con frenos y protección
    contra desprendimiento (breakaway protection)?
  choices:
    A: Si el remolque cargado pesa más de 1,000 libras
    B: Si el remolque se utiliza para fines comerciales
    C: Si el remolque cargado pesa más de la mitad del peso del vehículo remolcador
      o pesa 3,000 libras o más
    D: Si el remolque mide más de 15 pies de largo
  answer: C
  explanation: El manual establece que si su remolque cargado pesa más de la mitad
    del peso del vehículo remolcador o pesa 3,000 libras o más, debe estar equipado
    con frenos y protección contra desprendimiento.
- id: 233
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a los pasajeros que viajan en casas remolque
    (house trailers)?
  choices:
    A: Está permitido si llevan puestos los cinturones de seguridad.
    B: Está permitido solo a velocidades inferiores a 35 mph.
    C: Está prohibido en todo momento.
    D: Está permitido si el remolque tiene cadenas de seguridad.
  answer: C
  explanation: 'El manual establece explícitamente: "No debe permitir que los pasajeros
    viajen en remolques. Viajar en casas remolque está prohibido".'
- id: 234
  category: vehicle_information
  question: ¿Cómo deben sujetarse las cadenas de seguridad al remolcar un remolque?
  choices:
    A: Al parachoques del vehículo remolcador
    B: A una parte del enganche del remolque
    C: Al chasis del vehículo remolcador y del remolque
    D: A los ejes de ambos vehículos
  answer: C
  explanation: Las cadenas de seguridad deben estar sujetas al chasis del vehículo
    remolcador y del remolque, y no conectadas a una parte del enganche del remolque.
- id: 235
  category: safe_driving_rules
  question: ¿Qué es probable que suceda si no hay suficiente peso en el enganche del
    remolque del vehículo?
  choices:
    A: El vehículo tendrá dificultades para maniobrar.
    B: El remolque "coleará" (fishtail).
    C: Los frenos se bloquearán.
    D: Los neumáticos estallarán.
  answer: B
  explanation: Entre el 10% y el 15% del peso del remolque debe recaer sobre el enganche.
    El manual advierte que si el peso es demasiado bajo, el remolque "coleará" (fishtail).
- id: 236
  category: sharing_the_road
  question: Según las investigaciones, ¿cuál es la causa de más de dos tercios de
    los accidentes entre automóviles y motocicletas?
  choices:
    A: Motociclistas que conducen a exceso de velocidad
    B: Un conductor de automóvil que gira frente al motociclista
    C: Motociclistas que zigzaguean entre el tráfico
    D: Malas condiciones climáticas
  answer: B
  explanation: Las investigaciones muestran que más de dos tercios de los accidentes
    entre automóviles y motocicletas son el resultado de que un conductor de automóvil
    gira frente al motociclista.
- id: 237
  category: sharing_the_road
  question: 'Debido al perfil pequeño de una motocicleta, a un conductor de automóvil
    le puede parecer que está:'
  choices:
    A: Más cerca y viajando más rápido de lo que realmente está
    B: Más lejos y viajando más lento de lo que realmente está
    C: Del mismo tamaño que un automóvil compacto
    D: Moviéndose de manera errática
  answer: B
  explanation: El perfil pequeño de la motocicleta puede hacer que parezca estar más
    lejos y viajar más lento de lo que realmente está, lo que dificulta juzgar la
    distancia y la velocidad.
- id: 238
  category: sharing_the_road
  question: ¿Cómo debe tratar un conductor el espacio del carril de una motocicleta?
  choices:
    A: Compartir el carril si la motocicleta está en el lado derecho
    B: Rebasar a la motocicleta dentro del mismo carril para ahorrar espacio
    C: Abstenerse de compartir el carril porque a las motocicletas se les permite
      el ancho total de un carril
    D: Tocar la bocina para obligar a la motocicleta a ir al borde del carril
  answer: C
  explanation: A las motocicletas se les permite el ancho total de un carril para
    maniobrar. Los conductores deben abstenerse de compartir el carril con un motociclista,
    ya que esto restringe su capacidad para evitar peligros.
- id: 239
  category: sharing_the_road
  question: ¿Dónde es más probable que ocurran colisiones entre automóviles y motocicletas?
  choices:
    A: En autopistas
    B: En estacionamientos
    C: En intersecciones
    D: En caminos rurales
  answer: C
  explanation: El manual establece que las intersecciones son los lugares más probables
    para que ocurran colisiones entre automóviles y motocicletas, generalmente porque
    el conductor de un automóvil no ve la motocicleta.
- id: 240
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento mínima recomendada al conducir detrás
    de una motocicleta?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 4 segundos
  answer: B
  explanation: Al conducir detrás de una motocicleta, debe dejar al menos una distancia
    de seguimiento de 2 segundos para darle al ciclista suficiente espacio para maniobrar
    o detenerse en una emergencia.
- id: 241
  category: sharing_the_road
  question: ¿En Hawái, qué porcentaje de todas las muertes por accidentes de tráfico
    son peatones?
  choices:
    A: 10%
    B: 20%
    C: 30%
    D: 50%
  answer: B
  explanation: El resumen de hechos en el manual establece que en Hawái, el 20% de
    todas las muertes por accidentes de tráfico son peatones.
- id: 242
  category: sharing_the_road
  question: ¿Qué debe hacer si ve a una persona ciega (identificada por un bastón
    blanco o un perro guía) en la calzada?
  choices:
    A: Detenerse independientemente de la indicación de la señal de tráfico o de la
      situación del tráfico
    B: Tocar la bocina para advertirles de su acercamiento
    C: Ceder el paso solo si el semáforo está en rojo
    D: Maniobrar alrededor de ellos con cuidado sin detenerse
  answer: A
  explanation: Los conductores deben detenerse ante todas las personas ciegas en la
    calzada (identificadas por un bastón blanco o un perro guía) independientemente
    de la indicación de la señal de tráfico o de la situación del tráfico.
- id: 243
  category: safe_driving_rules
  question: 'Si un vehículo se detiene para permitir que un peatón cruce la calle,
    usted debe:'
  choices:
    A: Rebasar solo por el lado derecho
    B: Tocar la bocina antes de rebasar
    C: Nunca rebasar al vehículo detenido
    D: Rebasar rápidamente para evitar retrasar el tráfico
  answer: C
  explanation: La ley prohíbe rebasar a un vehículo que se ha detenido para permitir
    que un peatón cruce la calle.
- id: 244
  category: safe_driving_rules
  question: 'Conducir a través de una zona de seguridad para peatones está:'
  choices:
    A: Permitido si no hay peatones presentes
    B: Prohibido por la ley
    C: Permitido solo para realizar un giro a la derecha
    D: Recomendado para evitar atascos de tráfico
  answer: B
  explanation: El manual establece explícitamente que nunca debe conducir a través
    de una zona de seguridad para peatones, y que hacerlo está prohibido por la ley.
- id: 245
  category: safe_driving_rules
  question: Como peatón, ¿qué debe hacer si llega a una intersección y la luz verde
    ha estado encendida durante algún tiempo?
  choices:
    A: Correr rápidamente para cruzar la calle
    B: Esperar a la señal verde del siguiente ciclo
    C: Cruzar solo si no hay autos visibles
    D: Hacer señas a los conductores para que se detengan antes de cruzar
  answer: B
  explanation: Los peatones nunca deben comenzar a cruzar la calle con una luz verde
    que ha estado encendida durante algún tiempo; deben esperar a la señal verde del
    siguiente ciclo.
- id: 246
  category: sharing_the_road
  question: ¿Por qué lado de la calle debe caminar si es un peatón que camina por
    la calzada?
  choices:
    A: El lado derecho, moviéndose con el tráfico
    B: El lado izquierdo, de frente al tráfico que viene en sentido contrario
    C: El centro de la carretera
    D: Cualquier lado, siempre que use ropa brillante
  answer: B
  explanation: El manual establece que los peatones deben caminar por el lado izquierdo
    de la calle de frente al tráfico que viene en sentido contrario.
- id: 247
  category: sharing_the_road
  question: ¿Cuándo debe detenerse ante un autobús escolar que tiene luces rojas intermitentes
    alternas?
  choices:
    A: Solo cuando viaja directamente detrás del autobús
    B: En todas las direcciones en cualquier tipo de carretera
    C: Cuando viaja en el mismo carril o en cualquier carril adyacente en la misma
      carretera
    D: Solo durante las horas escolares activas
  answer: C
  explanation: El conductor de cualquier vehículo motorizado en la misma carretera,
    en el carril ocupado por el autobús escolar y en todos los carriles adyacentes
    al carril ocupado por el autobús escolar, deberá detenerse antes de llegar al
    autobús escolar.
- id: 248
  category: penalties_and_points
  question: ¿Cuál es la multa potencial por no detenerse ante un autobús escolar con
    luces rojas intermitentes?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: El incumplimiento de la ley con respecto a detenerse ante un autobús
    escolar (291C-95, HRS) puede costarle $1,000.
- id: 249
  category: sharing_the_road
  question: ¿Están obligados a detenerse ante un autobús escolar los vehículos que
    viajan en la dirección opuesta en una carretera dividida?
  choices:
    A: Sí, todo el tráfico debe detenerse ante un autobús escolar
    B: No, no están obligados a detenerse
    C: Sí, pero solo si hay niños cruzando la calle activamente
    D: No, a menos que el conductor del autobús use una señal manual para detenerlos
  answer: B
  explanation: Los vehículos que circulan en la dirección opuesta en una carretera
    dividida (dos calzadas separadas por una franja de terreno o espacio) no están
    obligados a detenerse ante un autobús escolar.
- id: 250
  category: sharing_the_road
  question: ¿Cuánto espacio debe mantener un automovilista al rebasar a un ciclista?
  choices:
    A: Al menos 1 pie
    B: Al menos 2 pies
    C: Al menos 3 pies
    D: Al menos 5 pies
  answer: C
  explanation: Los automovilistas deben mantener al menos 3 pies de espacio entre
    el ciclista y su vehículo hasta que lo hayan rebasado de manera segura.
- id: 251
  category: sharing_the_road
  question: ¿Aproximadamente qué porcentaje de los choques entre bicicletas y automóviles
    son causados por ciclistas que circulan en sentido contrario al tráfico?
  choices:
    A: 10%
    B: 25%
    C: 50%
    D: 75%
  answer: B
  explanation: Aunque es ilegal circular en sentido contrario al tráfico, muchos ciclistas
    inexpertos lo hacen, lo que provoca aproximadamente el 25% de todos los choques
    entre bicicletas y automóviles.
- id: 252
  category: sharing_the_road
  question: ¿Cuándo se le permite legalmente a un ciclista alejarse del borde derecho
    de la calzada e incorporarse al carril de circulación?
  choices:
    A: Al prepararse para girar a la izquierda o al evitar un obstáculo
    B: Cuando quieren circular al lado de un vehículo motorizado
    C: Cuando circulan a una velocidad inferior a la normal del tráfico
    D: Los ciclistas siempre deben permanecer en el borde derecho sin excepción
  answer: A
  explanation: Las excepciones en las que un ciclista puede incorporarse al carril
    incluyen prepararse para girar a la izquierda, adelantar a otra bicicleta o evitar
    un obstáculo en el borde de la carretera.
- id: 253
  category: sharing_the_road
  question: ¿Bajo qué condiciones se permite a los ciclistas circular de dos en fondo
    (en paralelo)?
  choices:
    A: En todo momento en la calzada
    B: En un carril o sendero para bicicletas si es lo suficientemente ancho como
      para no impedir el tráfico
    C: Solo al adelantar a otro vehículo motorizado
    D: Nunca se les permite circular de dos en fondo
  answer: B
  explanation: En la calzada, los ciclistas deben circular en fila india. Pueden circular
    de dos en fondo en un carril o sendero para bicicletas si es lo suficientemente
    ancho como para no impedir el tráfico.
- id: 254
  category: vehicle_information
  question: ¿Qué equipo se requiere legalmente para una bicicleta cuando se circula
    de noche?
  choices:
    A: Un faro delantero y un reflector trasero
    B: Una luz trasera y reflectores en los pedales
    C: Un chaleco de seguridad reflectante
    D: Una bocina y un faro delantero
  answer: A
  explanation: Si circula de noche, debe tener un faro delantero y un reflector trasero.
    La luz trasera y los reflectores en los pedales solo son recomendados.
- id: 255
  category: sharing_the_road
  question: ¿Bajo qué condiciones puede un ciclista circular por una acera fuera de
    un distrito comercial?
  choices:
    A: Si circulan a 15 MPH o menos
    B: Si se mantienen a 10 MPH o menos y siempre ceden el paso a los peatones
    C: Las bicicletas nunca están permitidas en las aceras bajo ninguna circunstancia
    D: Solo si el ciclista es menor de 12 años
  answer: B
  explanation: En áreas fuera de los distritos comerciales, los ciclistas pueden circular
    por las aceras siempre que se mantengan a 10 MPH o menos y siempre ceden el paso
    a los peatones.
- id: 256
  category: license_system
  question: ¿Cuáles son sus privilegios de conducción si su licencia de conducir expira?
  choices:
    A: Puede conducir durante un período de gracia de 90 días
    B: Puede conducir únicamente hacia y desde el trabajo
    C: Puede conducir siempre que esté acompañado por un conductor con licencia
    D: No puede conducir, pero puede renovar su licencia dentro de un año después
      de la expiración
  answer: D
  explanation: Cuando su licencia de conducir expira, no puede conducir, pero puede
    renovar su licencia de conducir dentro de un año después de la fecha de vencimiento
    siguiendo los pasos normales de renovación de licencia.
- id: 257
  category: safe_driving_rules
  question: ¿Es legal permanecer en la parte transitada de la calzada para solicitar
    transporte o cuidar un lugar de estacionamiento?
  choices:
    A: Sí, si lleva ropa de colores brillantes
    B: Sí, pero solo durante las horas del día
    C: No, está prohibido por ley
    D: No, a menos que esté en una calle de un solo sentido
  answer: C
  explanation: 'El manual establece: ''No camine ni permanezca en la parte transitada
    de la calzada para solicitar transporte por cualquier motivo o para cuidar un
    vehículo o lugar de estacionamiento. (Prohibido por ley)'''
- id: 258
  category: vehicle_information
  question: ¿Dónde debe guardarse una copia de su certificado de inspección del vehículo?
  choices:
    A: Archivada con su declaración de impuestos estatales
    B: En un lugar seguro en su hogar
    C: En el vehículo
    D: En el Departamento de Finanzas del Condado
  answer: C
  explanation: Según el manual, se debe guardar una copia del certificado de inspección
    del vehículo dentro del vehículo.
- id: 259
  category: driver_responsibility
  question: ¿Quién es responsable de la condición mecánica de un vehículo?
  choices:
    A: El mecánico del taller
    B: El conductor del vehículo y el propietario registrado del vehículo
    C: Solo el propietario legal del vehículo
    D: La compañía de seguros
  answer: B
  explanation: La condición mecánica del vehículo es responsabilidad tanto del conductor
    del vehículo como del propietario registrado del mismo.
- id: 260
  category: safe_driving_rules
  question: ¿Por qué es peligroso un sistema de escape con fugas en su vehículo?
  choices:
    A: Puede causar envenenamiento por monóxido de carbono.
    B: Causa pérdida de audición.
    C: Provoca un mal rendimiento del motor.
    D: Aumenta la contaminación acústica.
  answer: A
  explanation: Un sistema de escape con fugas en su vehículo es peligroso porque puede
    causar envenenamiento por monóxido de carbono.
- id: 261
  category: license_system
  question: ¿Qué debe hacer si cambia su dirección de la que figura en el certificado
    de registro de su vehículo?
  choices:
    A: Notificar al Departamento de Finanzas del Condado dentro de los 30 días posteriores
      al cambio.
    B: Notificar al Departamento de Finanzas del Condado solo al renovar la licencia.
    C: Realizar el cambio solo al vender o canjear el automóvil.
    D: No tiene que hacer nada.
  answer: A
  explanation: Cuando usted, como propietario registrado de un vehículo, cambia su
    dirección, debe notificar al Departamento de Finanzas del Condado dentro de los
    30 días posteriores al cambio.
- id: 262
  category: defensive_driving
  question: Si está enojado o alterado antes de subir a su automóvil para conducir
    a casa, ¿qué debe hacer?
  choices:
    A: Poner la radio a todo volumen para no pensar en ello.
    B: Conducir rápido por la carretera interestatal para desahogarse.
    C: Pasar por su bar favorito y tomar unas copas antes de conducir.
    D: Tomarse unos minutos para calmarse antes de conducir a casa.
  answer: D
  explanation: Si está enojado, debe tomarse unos minutos para calmarse antes de conducir
    a casa para asegurarse de estar en el estado mental adecuado para operar un vehículo
    de manera segura.
- id: 263
  category: signs_and_signals
  question: ¿Qué debe hacer si un oficial de policía que dirige el tráfico le indica
    que pase un semáforo en rojo?
  choices:
    A: Detenerse y luego avanzar.
    B: Esperar a la luz verde.
    C: Continuar según las indicaciones.
    D: Girar a la derecha en su lugar.
  answer: C
  explanation: Si un oficial de policía que dirige el tráfico le indica que pase un
    semáforo en rojo, debe continuar según las indicaciones.
- id: 264
  category: sharing_the_road
  question: 'Al conducir por una carretera estrecha y encontrarse con un vehículo
    que viene en sentido contrario, usted debe:'
  choices:
    A: Salirse completamente de la carretera y detenerse.
    B: Permitir al vehículo que viene en sentido contrario al menos la mitad de la
      parte principal transitada de la carretera.
    C: Hacer que el otro vehículo se detenga a un lado, ya que usted llegó primero.
    D: Encender sus luces delanteras para asegurarse de que el otro vehículo lo vea.
  answer: B
  explanation: Se requiere que permita a un vehículo que viene en sentido contrario
    al menos la mitad de la parte principal transitada de la carretera cuando conduce
    por una carretera estrecha.
- id: 265
  category: safe_driving_rules
  question: Al girar o cambiar de carril, ¿cuándo debe señalar sus intenciones?
  choices:
    A: Solo si hay tráfico visible.
    B: Solo cuando conduzca de noche.
    C: Señalar siempre sus intenciones, incluso cuando no haya tráfico visible.
    D: Solo cuando conduzca con tráfico de noche.
  answer: C
  explanation: Al girar o cambiar de carril, siempre debe señalar sus intenciones,
    incluso cuando no haya tráfico visible.
- id: 266
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a un cruce de ferrocarril con señales intermitentes?
  choices:
    A: Reducir la velocidad y buscar un tren.
    B: Detenerse y buscar un tren.
    C: Buscar un tren y luego acelerar.
    D: Hacer lo mismo que el vehículo que se aproxima.
  answer: B
  explanation: Cuando se acerque a un cruce de ferrocarril y las señales del cruce
    estén parpadeando, debe detenerse y buscar un tren.
- id: 267
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones debe realizar al dejar su vehículo desatendido?
  choices:
    A: Apagar el motor.
    B: Bloquear el encendido y retirar la llave de contacto.
    C: Poner el freno de estacionamiento.
    D: Todas las anteriores.
  answer: D
  explanation: Cuando deje su vehículo desatendido, debe apagar el motor, bloquear
    el encendido, retirar la llave y poner el freno de estacionamiento.
- id: 268
  category: sharing_the_road
  question: 'Si está conduciendo por la calzada y escucha una sirena detrás de usted,
    debe:'
  choices:
    A: Detenerse inmediatamente en su carril actual.
    B: Acelerar para apartarse del camino.
    C: Detenerse a la derecha y parar.
    D: Reducir la velocidad y continuar conduciendo.
  answer: C
  explanation: Cuando escuche una sirena detrás de usted en la calzada, debe detenerse
    a la derecha y parar para ceder el paso al vehículo de emergencia.
- id: 269
  category: sharing_the_road
  question: ¿Cuándo puede adelantar a un autobús escolar por delante o por detrás
    en una carretera no dividida?
  choices:
    A: Nunca.
    B: Cuando las luces rojas del autobús escolar estén parpadeando.
    C: Cuando las luces rojas del autobús escolar no estén parpadeando.
    D: En cualquier momento, si va despacio.
  answer: C
  explanation: Puede adelantar a un autobús escolar por delante o por detrás en una
    carretera no dividida solo cuando las luces rojas del autobús escolar no estén
    parpadeando.
- id: 270
  category: sharing_the_road
  question: Se aproxima a una intersección y tiene luz verde, pero los peatones están
    cruzando con el semáforo en rojo. ¿Qué debe hacer?
  choices:
    A: Tocar la bocina.
    B: Acelerar y pasar por delante de los peatones.
    C: Conducir cerca y asustar a los peatones para que lo piensen dos veces.
    D: Detenerse para dejar que los peatones crucen de forma segura.
  answer: D
  explanation: Incluso si tiene luz verde, si los peatones están cruzando en rojo,
    debe detenerse para permitir que los peatones crucen de manera segura.
- id: 271
  category: safe_driving_rules
  question: 'Al incorporarse a la calle desde cualquier entrada privada (driveway),
    usted:'
  choices:
    A: Debe conducir despacio para que los vehículos y peatones que se aproximan puedan
      apartarse de su camino.
    B: Debe tocar la bocina para que los vehículos y peatones que se aproximan le
      den espacio.
    C: Debe detenerse y avanzar solo cuando no se aproximen peatones ni vehículos.
    D: Puede ignorar a los peatones si no hay acera.
  answer: C
  explanation: Al incorporarse a la calle desde cualquier entrada privada, debe detenerse
    y avanzar solo cuando no se aproximen peatones ni vehículos.
- id: 272
  category: signs_and_signals
  question: 'Usted está detenido detrás de otros vehículos esperando en una señal
    de alto (stop). Cuando la intersección esté despejada, usted:'
  choices:
    A: Puede avanzar a través de la intersección sin detenerse de nuevo.
    B: Debe detenerse de nuevo en la señal de alto o en la línea de parada.
    C: Puede pasar por la intersección lentamente sin detenerse si no hay otro tráfico.
    D: Puede seguir al vehículo de adelante sin detenerse de nuevo.
  answer: B
  explanation: Si está detenido detrás de otros vehículos esperando en una señal de
    alto, debe detenerse de nuevo en la señal de alto o en la línea de parada una
    vez que el vehículo delante de usted se mueva.
- id: 273
  category: signs_and_signals
  question: ¿Qué tipo de señales y marcas viales requieren que usted obedezca la instrucción
    indicada?
  choices:
    A: Señales de advertencia (Warning signs)
    B: Señales de guía (Guide signs)
    C: Señales reglamentarias (Regulatory signs)
    D: Señales de información (Information signs)
  answer: C
  explanation: Ciertas señales y marcas viales requieren que usted obedezca la instrucción
    indicada. Dichas señales se conocen como señales reglamentarias.
- id: 274
  category: signs_and_signals
  question: ¿Qué tipo de señales viales contienen información sobre condiciones peligrosas?
  choices:
    A: Señales reglamentarias
    B: Señales de advertencia
    C: Señales de información
    D: Señales de guía
  answer: B
  explanation: Ciertas señales y marcas viales contienen información sobre condiciones
    peligrosas. Dichas señales se conocen como señales de advertencia.
- id: 275
  category: safe_driving_rules
  question: 'Si está girando hacia una carretera de dos carriles dividida por una
    línea amarilla discontinua, sabe inmediatamente que:'
  choices:
    A: Está en una carretera de un solo sentido.
    B: Está en una carretera de doble sentido.
    C: La carretera está en reparación.
    D: Debe permanecer a la izquierda de las líneas amarillas discontinuas.
  answer: B
  explanation: Una línea amarilla discontinua divide una carretera de dos carriles,
    lo que indica que se encuentra en una carretera de doble sentido con tráfico moviéndose
    en direcciones opuestas.
- id: 276
  category: safe_driving_rules
  question: Al conducir por una carretera dividida por dos líneas amarillas continuas,
    ¿cuándo se le permite cruzar estas líneas?
  choices:
    A: Solo para realizar un giro a la izquierda hacia o desde un callejón, camino
      privado o entrada.
    B: Para rebasar a otros vehículos si no hay tráfico en sentido contrario.
    C: Solo para realizar un giro en U.
    D: Nunca puede cruzar estas líneas bajo ninguna circunstancia.
  answer: A
  explanation: Puede cruzar dos líneas amarillas continuas solo para realizar un giro
    a la izquierda hacia o desde un callejón, camino privado o una entrada.
- id: 277
  category: safe_driving_rules
  question: ¿Cuál es el propósito de las líneas blancas de carril en una carretera
    dividida de cuatro carriles?
  choices:
    A: Separan los carriles de tráfico que se mueven en direcciones opuestas.
    B: Indican los cruces peatonales.
    C: Separan los carriles de tráfico que se mueven en la misma dirección.
    D: Marcan el centro de una carretera de doble sentido.
  answer: C
  explanation: En una carretera dividida de cuatro carriles, las líneas blancas de
    carril separan los carriles de tráfico que se mueven en la misma dirección.
- id: 278
  category: safe_driving_rules
  question: ¿Qué indica una línea blanca continua que separa los carriles de tráfico
    en una carretera dividida de cuatro carriles?
  choices:
    A: Se puede cruzar en cualquier momento.
    B: Separa el tráfico que se mueve en direcciones opuestas.
    C: No se puede cruzar bajo ninguna circunstancia.
    D: Se puede cruzar solo en circunstancias inusuales y solo con mucho cuidado.
  answer: D
  explanation: Una línea blanca continua que separa los carriles de tráfico que se
    mueven en la misma dirección se puede cruzar solo en circunstancias inusuales
    y solo con mucho cuidado.
- id: 279
  category: signs_and_signals
  question: ¿Dónde se pintan las líneas blancas continuas de parada a través de los
    carriles de tráfico para indicar el lugar exacto donde detenerse?
  choices:
    A: En curvas y colinas.
    B: En las rampas de entrada a la autopista y estaciones de bomberos.
    C: En intersecciones y cruces peatonales.
    D: En iglesias y escuelas.
  answer: C
  explanation: Las líneas de parada son líneas blancas continuas pintadas a través
    de los carriles de tráfico en las intersecciones y cruces peatonales que indican
    el lugar exacto en el que debe detenerse.
- id: 280
  category: sharing_the_road
  question: Cuando los peatones están en un cruce peatonal marcado por dos líneas
    blancas continuas, ¿quién tiene el derecho de paso?
  choices:
    A: Los vehículos motorizados tienen el derecho de paso sobre los peatones.
    B: Los peatones tienen el derecho de paso sobre los vehículos motorizados.
    C: Nadie tiene el derecho de paso en un cruce peatonal.
    D: Los peatones deben ceder el paso a todo el tráfico que se aproxima.
  answer: B
  explanation: Cuando los peatones están en estos cruces peatonales, tienen el derecho
    de paso sobre los vehículos motorizados.
- id: 281
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a una luz roja de un semáforo?
  choices:
    A: Detenerse en la línea de parada.
    B: Detenerse antes de entrar en cualquier paso de peatones si no hay línea de
      parada.
    C: Detenerse antes de entrar en la intersección si no hay línea de parada ni paso
      de peatones.
    D: Todas las anteriores.
  answer: D
  explanation: Una luz roja de un semáforo significa que debe detenerse en la línea
    de parada, antes de entrar en cualquier paso de peatones si no hay línea de parada,
    o antes de entrar en la intersección donde no hay línea de parada ni paso de peatones.
- id: 282
  category: signs_and_signals
  question: Si no está prohibido por una señal de tráfico, ¿qué puede hacer un vehículo
    detenido frente a una luz roja circular de un semáforo?
  choices:
    A: Girar a la derecha en cualquier momento sin detenerse.
    B: Girar a la derecha solo después de tocar la bocina.
    C: Girar a la derecha después de ceder el paso a otros vehículos y peatones.
    D: Nada, siempre es ilegal girar a la derecha en rojo.
  answer: C
  explanation: Un vehículo detenido frente a una luz roja circular de un semáforo
    puede girar a la derecha después de ceder el paso a otros vehículos y peatones,
    si no está prohibido por una señal de tráfico.
- id: 283
  category: signs_and_signals
  question: ¿Bajo qué condición puede un vehículo detenido frente a una luz roja circular
    de un semáforo girar a la izquierda?
  choices:
    A: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido,
      después de ceder el paso al tráfico y a los peatones.
    B: Cuando no hay otro tráfico ni peatones, independientemente del tipo de calle.
    C: Solo cuando también está iluminada una flecha verde.
    D: Nunca; los giros a la izquierda en rojo siempre son ilegales.
  answer: A
  explanation: Un vehículo detenido frente a una luz roja circular de un semáforo
    puede girar a la izquierda después de ceder el paso a los peatones y al tráfico,
    al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
    (si no está prohibido por una señal de tráfico).
- id: 284
  category: signs_and_signals
  question: ¿Qué indica una luz amarilla circular fija en un semáforo?
  choices:
    A: Debe acelerar para ganarle a la luz roja.
    B: Se mostrará una luz roja inmediatamente después y debe evitar entrar en la
      intersección si es posible.
    C: Usted tiene el derecho de paso para avanzar a través de la intersección.
    D: El tráfico transversal está a punto de entrar en la intersección.
  answer: B
  explanation: Una luz amarilla circular fija significa que se mostrará una luz roja
    inmediatamente después y debe evitar entrar en la intersección si es posible.
- id: 285
  category: signs_and_signals
  question: ¿Qué significa una "X" amarilla iluminada sobre un carril de tráfico?
  choices:
    A: Puede usar ese carril con precaución.
    B: El carril es solo para giros a la izquierda.
    C: Puede usar ese carril solo para rebasar.
    D: Debe salir de ese carril porque se va a utilizar para el tráfico en sentido
      contrario.
  answer: D
  explanation: Una "X" amarilla sobre el carril de tráfico significa que debe salir
    de ese carril de tráfico porque se va a utilizar para el tráfico en sentido contrario.
- id: 286
  category: alcohol_drugs_health
  question: ¿Cómo deben ver los conductores el problema de las personas que conducen
    bajo la influencia de bebidas alcohólicas?
  choices:
    A: Es solo un problema para quienes beben.
    B: Es solo un problema de aplicación de la ley por parte de la policía.
    C: Es un problema de todos los conductores, beban o no.
    D: No es un problema significativo en Hawái.
  answer: C
  explanation: Según el manual, las personas que conducen bajo la influencia de bebidas
    alcohólicas son un problema de todos los conductores, beban o no.
- id: 287
  category: alcohol_drugs_health
  question: ¿Cuál es la guía del manual con respecto a tomar unos tragos después del
    trabajo antes de conducir a casa?
  choices:
    A: Es beneficioso porque ayuda a liberar la tensión del día.
    B: Debe evitarse porque puede convertirlo en un conductor peligroso.
    C: Se recomienda si desea esperar a que pase el tráfico de la hora pico.
    D: Es seguro siempre que coma algo de antemano.
  answer: B
  explanation: Se debe evitar tomar unos tragos después del trabajo antes de conducir
    a casa porque pueden convertirlo en un conductor peligroso.
- id: 288
  category: alcohol_drugs_health
  question: ¿Cómo afecta el consumo de alimentos a la absorción de bebidas alcohólicas?
  choices:
    A: El alcohol le afectará más rápidamente con el estómago vacío.
    B: El alcohol le afectará más rápidamente justo después de comer.
    C: La comida neutraliza el alcohol por completo.
    D: El alcohol le afecta de la misma manera independientemente de la ingesta de
      alimentos.
  answer: A
  explanation: Las bebidas alcohólicas le afectarán más rápidamente con el estómago
    vacío.
- id: 289
  category: alcohol_drugs_health
  question: Después de que el alcohol ha entrado en su sangre, ¿cómo puede disminuir
    su efecto?
  choices:
    A: Tomando una ducha fría.
    B: Bebiendo café negro.
    C: Haciendo tanto la A como la B.
    D: No hay nada que pueda hacer para disminuir el efecto.
  answer: D
  explanation: Una vez que el alcohol ha entrado en su sangre, no hay nada que pueda
    hacer para disminuir su efecto; tomar una ducha fría o beber café no funcionará.
- id: 290
  category: penalties_and_points
  question: Si un oficial de policía lo detiene, lo acusa de conducir bajo la influencia
    (DUI) y solicita una prueba de alcohol en sangre, ¿qué debe hacer?
  choices:
    A: No tiene que hacerse la prueba si no ha violado ninguna norma de tráfico.
    B: Debe hacerse la prueba o arriesgarse a perder su licencia de conducir.
    C: Puede rechazar la prueba si puede demostrar que no estaba bebiendo.
    D: No se requiere que haga nada.
  answer: B
  explanation: Debe hacerse la prueba para determinar la cantidad de alcohol en su
    sangre o arriesgarse a perder su licencia de conducir.
- id: 291
  category: penalties_and_points
  question: 'Si se niega a realizar una prueba requerida de alcohol en sangre, puede
    perder su licencia de conducir por doce meses:'
  choices:
    A: Solo si es declarado culpable de conducir bajo la influencia.
    B: Solo si es declarado culpable de una infracción de tránsito en movimiento.
    C: Simplemente por haberse negado a realizar la prueba.
    D: Solo si está involucrado en una colisión.
  answer: C
  explanation: Puede perder su licencia de conducir por doce meses simplemente por
    haberse negado a realizar la prueba de alcohol en sangre requerida.
- id: 292
  category: alcohol_drugs_health
  question: ¿Bajo qué condiciones puede beber bebidas alcohólicas en un vehículo en
    una vía pública?
  choices:
    A: Siempre y cuando usted no sea quien conduce.
    B: Solo si viaja en el asiento trasero.
    C: Solo si viaja en la parte trasera de una camioneta (pick-up).
    D: Es contra la ley beber bebidas alcohólicas en una vía pública.
  answer: D
  explanation: Es contra la ley beber bebidas alcohólicas en un vehículo en una vía
    pública, independientemente de dónde esté sentado.
- id: 293
  category: alcohol_drugs_health
  question: ¿Qué sucede cuando consume alcohol mientras toma drogas?
  choices:
    A: Tiene un efecto menos pronunciado que si se toman por separado.
    B: Puede tener un efecto más pronunciado que si se toman por separado.
    C: Mejora su capacidad de conducción al mantenerlo alerta.
    D: Siempre es seguro siempre que las drogas sean recetadas por un médico.
  answer: B
  explanation: El consumo de alcohol mientras se toman drogas puede tener un efecto
    más pronunciado que si se consumen por separado.
- id: 294
  category: alcohol_drugs_health
  question: 'El efecto que el alcohol tiene sobre sus reflejos y juicio depende principalmente
    de:'
  choices:
    A: Si estaba bebiendo cerveza o vino.
    B: Si estaba bebiendo whisky o licores fuertes.
    C: La cantidad de alcohol en su torrente sanguíneo.
    D: Su nivel de condición física.
  answer: C
  explanation: El efecto que el alcohol tiene sobre sus reflejos y juicio depende
    de la cantidad de alcohol en su torrente sanguíneo, no del tipo de bebida.
- id: 295
  category: safe_driving_rules
  question: 'Al conducir, no girar la cabeza para comprobar el tráfico antes de cambiar
    de carril o alejarse de la acera es:'
  choices:
    A: Aceptable si primero revisa su espejo retrovisor.
    B: Un mal hábito de conducción y muchas veces la causa de un accidente.
    C: Peligroso solo cuando se conduce de noche.
    D: Innecesario si su vehículo tiene monitoreo de punto ciego.
  answer: B
  explanation: No girar la cabeza para comprobar el tráfico antes de cambiar de carril
    o incorporarse al tráfico es un mal hábito de conducción y muchas veces la causa
    de un accidente de tráfico.
- id: 296
  category: safe_driving_rules
  question: 'Señalizar sus intenciones antes de girar, cambiar de carril o alejarse
    de la acera:'
  choices:
    A: Es necesario solo si hay otro tráfico presente.
    B: Es necesario solo durante la maniobra, no antes.
    C: No es necesario si la maniobra se realiza lentamente.
    D: Es un buen hábito de conducción y es requerido por la ley.
  answer: D
  explanation: Señalizar sus intenciones antes de girar, cambiar de carril o alejarse
    de la acera es un buen hábito de conducción y es requerido por la ley.
- id: 297
  category: safe_driving_rules
  question: Al conducir en tráfico pesado, ¿qué distancia de seguimiento debe mantener?
  choices:
    A: Conducir cerca del vehículo de adelante para evitar que otros se interpongan.
    B: Mantener al menos un intervalo de dos segundos detrás del vehículo de adelante.
    C: Conducir cerca del vehículo de adelante pero estar listo para una parada repentina.
    D: Mantener un intervalo de un segundo para que el tráfico fluya.
  answer: B
  explanation: Al conducir en tráfico pesado, debe mantener al menos un intervalo
    de dos segundos detrás del vehículo que va delante.
- id: 298
  category: defensive_driving
  question: ¿Cuál de los siguientes comportamientos es característico de un conductor
    distraído?
  choices:
    A: Soñar despierto o mirar objetos fuera de la carretera.
    B: Mantener una conversación con contacto visual con un pasajero.
    C: Limitar la atención a observar únicamente al vehículo de adelante.
    D: Todas las anteriores.
  answer: D
  explanation: Un conductor distraído es aquel que sueña despierto, mantiene conversaciones
    con contacto visual mientras conduce o limita su atención a observar únicamente
    al vehículo que tiene delante.
- id: 299
  category: safe_driving_rules
  question: ¿Cómo afecta el aumento de la velocidad de su vehículo a su visión?
  choices:
    A: Aumenta su campo de visión.
    B: Disminuye su campo de visión.
    C: Hace que sea más fácil ver el tráfico transversal.
    D: No tiene ningún efecto en su campo de visión.
  answer: B
  explanation: Según el manual, aumentar la velocidad de su vehículo disminuye su
    campo de visión.
- id: 300
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a los cinturones de seguridad en un vehículo?
  choices:
    A: Deben usarse solo cuando se conduce a altas velocidades.
    B: Deben usarse en todo momento al conducir o viajar en un vehículo.
    C: Deben usarse de forma holgada.
    D: Solo es necesario usarlos si se viaja en el asiento delantero.
  answer: B
  explanation: Los cinturones de seguridad son cinturones de vida y deben usarse en
    todo momento al conducir o viajar en un vehículo.
- id: 301
  category: safe_driving_rules
  question: ¿Cómo debe ajustarse correctamente el cinturón de seguridad?
  choices:
    A: Debe estar flojo para mayor comodidad.
    B: Debe estar oculto debajo del asiento.
    C: Debe estar abrochado firmemente sobre los huesos de la cadera y la parte baja
      del abdomen.
    D: Debe ajustarse para evitar que suene la alarma del cinturón de seguridad.
  answer: C
  explanation: El cinturón de seguridad debe ajustarse de modo que quede abrochado
    firmemente sobre los huesos de la cadera y la parte baja del abdomen.
- id: 302
  category: defensive_driving
  question: Si llega tarde al trabajo, tiene prisa y necesita salir en reversa a la
    calle, ¿qué debe hacer antes de retroceder?
  choices:
    A: Tocar la bocina para advertir a los demás.
    B: Revisar si hay niños u otros objetos alrededor de su automóvil.
    C: Acelerar el motor para que las mascotas se quiten del camino.
    D: Revisar el tráfico solo después de subir al vehículo.
  answer: B
  explanation: Antes de salir en reversa a la calle, siempre debe revisar si hay niños
    u otros objetos alrededor de su automóvil, independientemente de si tiene prisa.
- id: 303
  category: safe_driving_rules
  question: Al salir de su entrada (driveway) hacia adelante, ¿qué debe hacer antes
    de cruzar la zona de la acera?
  choices:
    A: Debe detenerse por completo.
    B: Debe reducir la velocidad, pero no es necesario detenerse.
    C: Usted tiene la preferencia de paso sobre los peatones.
    D: Puede cruzar sin detenerse si toca la bocina.
  answer: A
  explanation: Debe detenerse por completo antes de cruzar la zona de la acera al
    salir de una entrada hacia adelante.
- id: 304
  category: safe_driving_rules
  question: Al conducir en una carretera de varios carriles y desear cambiar de carril,
    ¿cuándo debe señalizar sus intenciones?
  choices:
    A: Inmediatamente antes de cambiar de carril.
    B: Solo al momento de cambiar de carril.
    C: Al menos 50 pies antes de comenzar a cambiar de carril.
    D: Al menos 100 pies antes de comenzar a cambiar de carril.
  answer: D
  explanation: Las normas de tránsito exigen que active la señal de giro al menos
    100 pies antes de realizar cada giro o cambio de carril.
- id: 305
  category: defensive_driving
  question: Para evitar accidentes causados por seguir demasiado cerca, ¿cuál es el
    intervalo de seguimiento adecuado?
  choices:
    A: Lo suficientemente cerca para que nadie se interponga delante de usted.
    B: Al menos 2 segundos detrás del vehículo que va adelante.
    C: Exactamente 100 pies.
    D: Exactamente 75 pies.
  answer: B
  explanation: El intervalo adecuado para seguir a otro vehículo se determina manteniendo
    una distancia de al menos 2 segundos detrás del vehículo que va adelante.
- id: 306
  category: defensive_driving
  question: ¿Qué debe hacer si está conduciendo y comienza a llover?
  choices:
    A: Conducir más rápido que el resto del tráfico.
    B: Conducir al menos al límite de velocidad.
    C: Reducir la velocidad y adaptarse a las condiciones climáticas.
    D: Conducir cerca del vehículo que va adelante.
  answer: C
  explanation: Cuando comienza a llover, debe reducir la velocidad y adaptarse a las
    cambiantes condiciones climáticas para mantener la seguridad.
- id: 307
  category: safe_driving_rules
  question: Usted está detenido en una intersección con luz verde, pero el tráfico
    de adelante está detenido. ¿Qué debe hacer?
  choices:
    A: Avanzar hacia la intersección tanto como pueda.
    B: Esperar hasta que haya espacio para todo su vehículo en el lado opuesto antes
      de avanzar.
    C: Tocar la bocina a los vehículos de adelante.
    D: Avanzar parcialmente hacia la intersección.
  answer: B
  explanation: Debe esperar hasta que haya espacio para todo su vehículo en el lado
    opuesto de la intersección antes de avanzar para evitar bloquear la intersección.
- id: 308
  category: sharing_the_road
  question: ¿Qué se requiere al rebasar una motocicleta?
  choices:
    A: Darle al motociclista la parte derecha de su carril de circulación.
    B: Darle al motociclista todo su carril de circulación como si su vehículo fuera
      un automóvil.
    C: Desviarse a la izquierda lo justo para no golpear al motociclista.
    D: Rebasar rápidamente sin que el motociclista se dé cuenta.
  answer: B
  explanation: Al rebasar una motocicleta, debe darle al motociclista todo su carril
    de circulación como si su vehículo fuera un automóvil.
- id: 309
  category: safe_driving_rules
  question: Al conducir de noche y se aproxima otro vehículo, ¿qué debe hacer con
    sus faros delanteros?
  choices:
    A: Deben estar en luces altas.
    B: Deben estar en luces bajas.
    C: Deben estar apagados y debe usar sus luces de estacionamiento.
    D: Pueden estar en luces altas o bajas.
  answer: B
  explanation: Cuando otro vehículo se aproxima de noche, sus faros deben estar en
    luces bajas para evitar cegar al otro conductor.
- id: 310
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado al conducir en la rampa de entrada
    de una autopista?
  choices:
    A: Conducir hasta el final de la rampa, detenerse, revisar el tráfico y entrar.
    B: Detenerse inmediatamente, revisar si hay vehículos, acelerar y entrar.
    C: Revisar si hay vehículos en el carril cercano, ajustar la velocidad para los
      vehículos que se aproximan, señalizar y entrar.
    D: Detenerse siempre antes de entrar a la autopista.
  answer: C
  explanation: En una rampa de entrada a la autopista, debe revisar si hay vehículos
    en el carril cercano, ajustar su velocidad para los vehículos que se aproximan,
    señalizar y entrar al carril cercano.
- id: 311
  category: safe_driving_rules
  question: ¿Qué debe hacer si desea salir de la autopista pero se ha pasado la rampa
    de salida?
  choices:
    A: Retroceder por el acotamiento para llegar a su rampa de salida.
    B: Dar la vuelta y conducir por el acotamiento hasta su salida.
    C: Cruzar por el césped para llegar a su salida.
    D: Continuar conduciendo hasta la siguiente salida.
  answer: D
  explanation: Si se pasa su salida de la autopista, nunca debe retroceder ni dar
    la vuelta; en su lugar, continúe conduciendo hasta la siguiente salida.
- id: 312
  category: defensive_driving
  question: ¿Cómo debe reaccionar si se le revienta un neumático mientras conduce?
  choices:
    A: Frenar bruscamente de inmediato.
    B: Sujetar el volante con firmeza y maniobrar para detenerse en el acotamiento.
    C: Seguir conduciendo a la misma velocidad.
    D: Encender las luces de emergencia y detenerse en el carril.
  answer: B
  explanation: En caso de un reventón, debe sujetar el volante con firmeza y maniobrar
    para detenerse de forma segura en el acotamiento.
- id: 313
  category: defensive_driving
  question: ¿Cuál es la acción más segura a tomar si sus ruedas se salen del borde
    de la carretera mientras conduce?
  choices:
    A: Dar un tirón al volante para obligar al vehículo a volver al pavimento.
    B: Acelerar y maniobrar gradualmente de vuelta al pavimento.
    C: Frenar bruscamente y detenerse de inmediato.
    D: Reducir la velocidad usando los frenos suavemente y, cuando esté a una velocidad
      segura, girar el volante para volver al pavimento.
  answer: D
  explanation: Si sus ruedas se salen del borde de la carretera, reduzca la velocidad
    usando los frenos suavemente y, cuando esté a una velocidad segura, gire el volante
    para volver al pavimento.
- id: 314
  category: sharing_the_road
  question: ¿Por qué debe dar espacio adicional a los camiones pesados y autobuses
    al conducir?
  choices:
    A: Los camiones pueden detenerse en una distancia más corta que los automóviles.
    B: Los camiones requieren más espacio para maniobrar y una mayor distancia para
      detenerse que los automóviles.
    C: A los camiones se les permite conducir más rápido que a los automóviles.
    D: Los camiones tienen el derecho de paso sobre todos los demás vehículos.
  answer: B
  explanation: Debe dar espacio adicional a los camiones pesados y autobuses porque
    requieren más espacio para maniobrar y una mayor distancia para detenerse que
    los automóviles.
- id: 315
  category: sharing_the_road
  question: Al conducir directamente detrás de un camión pesado o autobús, ¿por qué
    se debe tener precaución adicional?
  choices:
    A: Es posible que el conductor del camión pesado o autobús no pueda verlo.
    B: Su visibilidad hacia adelante está bloqueada por el camión o autobús.
    C: Tanto A como B.
    D: Los camiones pesados y autobuses suelen detenerse sin previo aviso.
  answer: C
  explanation: Se debe tener precaución adicional porque es posible que el conductor
    del camión pesado o autobús no pueda verlo, y su visibilidad hacia adelante está
    bloqueada por el vehículo grande.
- id: 316
  category: sharing_the_road
  question: 'Al adelantar a un vehículo grande, el conductor de un vehículo pequeño
    debe estar preparado para:'
  choices:
    A: Un ruido fuerte.
    B: Exceso de contaminación del aire.
    C: Ráfagas de viento producidas por el vehículo grande.
    D: Caída de piezas del vehículo.
  answer: C
  explanation: Al adelantar a un vehículo grande, el conductor de un vehículo pequeño
    debe estar preparado para las ráfagas de viento producidas por el vehículo grande.
- id: 317
  category: vehicle_information
  question: 'Al remolcar un remolque lo suficientemente grande como para obstruir
    su espejo retrovisor interior, se le requiere:'
  choices:
    A: Tener un espejo retrovisor exterior instalado únicamente en el lado del conductor.
    B: Tener un espejo retrovisor exterior instalado únicamente en el lado del pasajero.
    C: Tener espejos retrovisores exteriores instalados en ambos lados de su vehículo.
    D: Tener a una persona en el vehículo para que le indique los giros a la derecha.
  answer: C
  explanation: Se requiere que tenga espejos retrovisores exteriores instalados en
    ambos lados de su vehículo si el remolque obstruye su espejo retrovisor interior.
- id: 318
  category: vehicle_information
  question: 'Al remolcar un remolque cargado que pese más de la mitad del peso del
    vehículo remolcador, o 3,000 libras o más, el remolque debe estar equipado con:'
  choices:
    A: Solo frenos.
    B: Solo protección contra desprendimiento (breakaway protection).
    C: Tapacubos.
    D: Frenos y protección contra desprendimiento (breakaway protection).
  answer: D
  explanation: Un remolque cargado que pese más de la mitad del peso del vehículo
    remolcador, o 3,000 libras o más, debe estar equipado tanto con frenos como con
    protección contra desprendimiento (breakaway protection).
- id: 319
  category: safe_driving_rules
  question: 'Al remolcar un remolque o una casa rodante, siempre debe:'
  choices:
    A: Hacer que alguien viaje en el remolque para mantener la carga estable.
    B: Permitir que solo adultos viajen en el remolque.
    C: Nunca permitir que nadie viaje en el remolque.
    D: Permitir que las personas viajen únicamente en casas rodantes.
  answer: C
  explanation: Al remolcar un remolque o una casa rodante, siempre debe asegurarse
    de nunca permitir que nadie viaje en el remolque.
- id: 320
  category: vehicle_information
  question: 'Al remolcar un remolque, debe asegurarse de que tenga una cadena de seguridad
    que esté firmemente sujeta a:'
  choices:
    A: El enganche del remolque.
    B: El parachoques del vehículo.
    C: El chasis del vehículo remolcador.
    D: El pestillo de seguridad.
  answer: C
  explanation: Debe asegurarse de que el remolque tenga una cadena de seguridad que
    esté firmemente sujeta al chasis del vehículo remolcador.
- id: 321
  category: driver_responsibility
  question: 'Si usted está involucrado en un accidente y su vehículo está bloqueando
    el tráfico, debe:'
  choices:
    A: Si es posible, mover su vehículo fuera de la parte transitada de la calzada.
    B: No mover su vehículo bajo ninguna circunstancia.
    C: Esperar hasta que llegue la policía antes de mover su vehículo.
    D: Dejar su vehículo y caminar para buscar ayuda.
  answer: A
  explanation: Si su vehículo está bloqueando el tráfico después de un accidente,
    debe, si es posible, mover su vehículo fuera de la parte transitada de la calzada.
- id: 322
  category: driver_responsibility
  question: 'Si usted choca inadvertidamente su vehículo contra el costado de un vehículo
    estacionado sin vigilancia y no puede localizar al propietario, debe:'
  choices:
    A: Esperar junto al vehículo hasta que el propietario regrese.
    B: Quedarse hasta que llegue la policía.
    C: Dejar una notificación por escrito que contenga su nombre, dirección y las
      circunstancias del accidente.
    D: Seguir su camino ya que no puede encontrar al propietario.
  answer: C
  explanation: Si golpea un vehículo estacionado sin vigilancia y no puede localizar
    al propietario, debe dejar una notificación por escrito que contenga su nombre,
    dirección y las circunstancias del accidente.
- id: 323
  category: sharing_the_road
  question: 'Como peatón, debe saber que:'
  choices:
    A: Siempre debe insistir en el derecho de paso sobre un vehículo cuando esté en
      un paso de peatones.
    B: Nunca debe entrar a la calle o al paso de peatones cuando haya vehículos acercándose
      a poca distancia.
    C: Puede entrar a un paso de peatones en cualquier momento y es responsabilidad
      del conductor detenerse.
    D: Solo tiene que usar los pasos de peatones cuando le resulten convenientes.
  answer: B
  explanation: Un peatón nunca debe entrar a la calle o al paso de peatones cuando
    hay vehículos acercándose a poca distancia.
- id: 324
  category: sharing_the_road
  question: 'Como conductor, debe darle a un ciclista:'
  choices:
    A: Los mismos derechos y privilegios que a los automovilistas.
    B: El doble de espacio del que usted cree que necesita.
    C: El derecho de paso cuando usted esté cruzando carriles para bicicletas.
    D: Todas las anteriores.
  answer: D
  explanation: Los conductores deben dar a los ciclistas los mismos derechos y privilegios,
    el doble de espacio del que creen que necesitan y el derecho de paso al cruzar
    carriles para bicicletas.
- id: 325
  category: signs_and_signals
  question: 'Al acercarse a una señal de alto de 4 vías (4-way stop), debe:'
  choices:
    A: Detenerse y ceder el paso a todo el tráfico dentro de la intersección.
    B: Pasar sin detenerse si no hay otro tráfico cruzando.
    C: Ceder el paso solo a los vehículos a su derecha.
    D: No detenerse si está girando a la derecha.
  answer: A
  explanation: En una señal de alto de 4 vías, debe detenerse y ceder el paso a todo
    el tráfico dentro de la intersección.
- id: 326
  category: driver_responsibility
  question: 'La ley de Hawái prohíbe dejar a un niño sin supervisión en un vehículo
    motorizado:'
  choices:
    A: Durante cinco minutos o más.
    B: Si el niño es menor de nueve años.
    C: Por parte de usted o de cualquier pasajero adulto del vehículo motorizado.
    D: Todas las anteriores.
  answer: D
  explanation: La ley de Hawái prohíbe que usted o cualquier pasajero adulto deje
    a un niño menor de nueve años sin supervisión en un vehículo motorizado durante
    cinco minutos o más.
- id: 327
  category: safe_driving_rules
  question: 'Los cinturones de seguridad son cinturones de vida. Estos:'
  choices:
    A: Deben usarse en todo momento al conducir o viajar en un vehículo.
    B: Deben usarse solo cuando se conduce a altas velocidades.
    C: Deben usarse holgados.
    D: Solo es necesario usarlos si se viaja en el asiento delantero del vehículo.
  answer: A
  explanation: Los cinturones de seguridad deben usarse en todo momento al conducir
    o viajar en un vehículo.
- id: 328
  category: driver_responsibility
  question: ¿Cuál es el propósito del pasillo de acceso junto a un espacio de estacionamiento
    accesible?
  choices:
    A: Permitir el estacionamiento de vehículos de emergencia.
    B: Permitir el despliegue de un elevador/rampa para sillas de ruedas y otros dispositivos
      de movilidad desde un vehículo estacionado en el espacio de estacionamiento
      accesible.
    C: Permitir espacio de estacionamiento para motocicletas, ciclomotores y bicicletas.
    D: Permitir que los vehículos se estacionen temporalmente mientras esperan a un
      pasajero.
  answer: B
  explanation: El pasillo de acceso está diseñado para permitir el despliegue de un
    elevador/rampa para sillas de ruedas y otros dispositivos de movilidad desde un
    vehículo estacionado en el espacio de estacionamiento accesible.
- id: 331
  category: vehicle_information
  question: ¿Cuáles son las horas generales de operación para la mayoría de las oficinas
    del Satellite City Hall en la Ciudad y el Condado de Honolulu?
  choices:
    A: 8:00 a.m. a 5:00 p.m.
    B: 7:45 a.m. a 4:00 p.m.
    C: 9:00 a.m. a 5:00 p.m.
    D: 8:00 a.m. a 4:15 p.m.
  answer: B
  explanation: El horario general de atención de las oficinas del Satellite City Hall
    en Honolulu es de lunes a viernes, excepto feriados, de 7:45 a.m. a 4:00 p.m.
- id: 332
  category: vehicle_information
  question: ¿Qué oficina del Satellite City Hall en Honolulu tiene un horario general
    diferente de 9:00 a.m. a 5:00 p.m.?
  choices:
    A: Kapolei
    B: Wahiawa
    C: Pearlridge Shopping Center
    D: Windward City Shopping Center
  answer: C
  explanation: El manual especifica que la ubicación del Pearlridge Shopping Center
    opera de 9:00 a.m. a 5:00 p.m.
- id: 333
  category: vehicle_information
  question: ¿A qué hora se acepta el último vehículo en la Oficina de Registro de
    Vehículos de la Estación de Kapahulu?
  choices:
    A: 3:00 p.m.
    B: 3:30 p.m.
    C: 4:00 p.m.
    D: 4:30 p.m.
  answer: B
  explanation: Para la Estación de Kapahulu, el manual establece que el "Último vehículo
    se acepta a las 3:30 p.m."
- id: 334
  category: vehicle_information
  question: ¿Dónde se encuentra la Oficina de Registro de Vehículos en el Condado
    de Hawái?
  choices:
    A: '101 Pauahi Street, Suite #5, Hilo'
    B: 1000 Uluohia Street, Kapolei
    C: 335 Keawe Street, Suite 209, Lahaina
    D: 4444 Rice Street, Suite 466, Lihue
  answer: A
  explanation: 'La Oficina de Registro de Vehículos del Condado de Hawái se encuentra
    en Hilo, en 101 Pauahi Street, Suite #5.'
- id: 335
  category: vehicle_information
  question: ¿Cuál de las siguientes es una ubicación de la Oficina de Registro de
    Vehículos en el Condado de Maui?
  choices:
    A: Fort Street Mall
    B: Lihue Civic Center
    C: Hannibal Tavares Community Center, Pukalani
    D: Kapalama Hale
  answer: C
  explanation: En el Condado de Maui, una de las oficinas de registro mencionadas
    se encuentra en Pukalani, en el Hannibal Tavares Community Center.
- id: 336
  category: vehicle_information
  question: ¿Cuáles son las horas de atención de la Oficina de Hana en el Condado
    de Maui?
  choices:
    A: 8:00 a.m. a 4:00 p.m. corrido
    B: 7:45 a.m. a 4:15 p.m.
    C: 8:00 a.m. a 10:45 a.m. y 12:00 p.m. a 3:30 p.m.
    D: 8:00 a.m. a 11:00 a.m. y 1:00 p.m. a 4:00 p.m.
  answer: C
  explanation: La Oficina de Hana atiende de lunes a viernes, excepto días festivos,
    de 8:00 a.m. a 10:45 a.m. y de 12:00 p.m. a 3:30 p.m.
- id: 337
  category: vehicle_information
  question: La Oficina de Lanai para el trámite de licencias de vehículos motorizados
    cierra durante un periodo del día. ¿Cuáles son sus horas de atención?
  choices:
    A: 8:00 a.m. a 11:00 a.m. y 1:00 p.m. a 4:00 p.m.
    B: 8:00 a.m. a 10:45 a.m. y 12:00 p.m. a 3:30 p.m.
    C: 8:00 a.m. a 11:00 a.m. y 12:00 p.m. a 4:00 p.m.
    D: 7:45 a.m. a 12:00 p.m. y 1:00 p.m. a 4:15 p.m.
  answer: A
  explanation: El horario de atención de la Oficina de Lanai es de lunes a viernes,
    excepto días festivos, de 8:00 a.m. a 11:00 a.m. y de 1:00 p.m. a 4:00 p.m.
- id: 338
  category: vehicle_information
  question: ¿Cuáles son las horas de atención de la oficina de registro de vehículos
    motorizados del Condado de Kauai?
  choices:
    A: 8:00 a.m. a 4:00 p.m.
    B: 7:45 a.m. a 4:00 p.m.
    C: 7:45 a.m. a 4:15 p.m.
    D: 9:00 a.m. a 5:00 p.m.
  answer: C
  explanation: El horario de atención de la oficina del Condado de Kauai es de 7:45
    a.m. a 4:15 p.m., de lunes a viernes, excepto días festivos.
- id: 339
  category: vehicle_information
  question: ¿Dónde se encuentra la Estación de Inspección de Vehículos Reconstruidos
    en la Ciudad y el Condado de Honolulu?
  choices:
    A: 1112 Kapahlu Avenue
    B: 925 Dillingham Blvd
    C: 1000 Uluohia Street
    D: 330 N. Cane Street
  answer: A
  explanation: 'La Estación de Inspección de Vehículos Reconstruidos para la Ciudad
    y el Condado de Honolulu se encuentra en la Estación de Kapahlu: 1112 Kapahlu
    Avenue.'
- id: 340
  category: vehicle_information
  question: En la Estación de Inspección de Vehículos Reconstruidos en Honolulu, ¿a
    qué hora comienza la última inspección?
  choices:
    A: 3:00 p.m.
    B: 3:30 p.m.
    C: 4:00 p.m.
    D: 4:15 p.m.
  answer: B
  explanation: Según el manual, en la Estación de Inspección de Vehículos Reconstruidos,
    "La última inspección comienza a las 3:30 p.m."
- id: 341
  category: vehicle_information
  question: ¿Qué empresa imprime y publica el Manual del Conductor de Hawái en conjunto
    con el Departamento de Transporte del Estado?
  choices:
    A: Hawaii State Printing Office
    B: Hagadone Printing Company
    C: Honolulu Star-Advertiser
    D: Pacific Commercial Advertiser
  answer: B
  explanation: El manual establece que es "impreso y publicado por Hagadone Printing
    Company en conjunto con el Departamento de Transporte del Estado".
- id: 342
  category: vehicle_information
  question: ¿Cuál es el sitio web oficial proporcionado para el trámite de licencias
    de vehículos motorizados en el Condado de Maui?
  choices:
    A: http://www.stallitecityhall.com/
    B: http://www.hawaiicounty.gov/finance-vrl-general-info
    C: https://www.mauicounty.gov/1328/Motor-vehicle-Licensing
    D: https://www.kauai.gov/MVR
  answer: C
  explanation: El sitio web indicado para el Condado de Maui es https://www.mauicounty.gov/1328/Motor-vehicle-Licensing.
- id: 343
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y continúe con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  image: stop.png
- id: 344
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  image: yield.png
- id: 345
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  image: do_not_enter.png
- id: 346
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: 'Detenerse y retroceder o dar la vuelta: va en sentido contrario'
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  image: wrong_way.png
- id: 347
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  image: one_way_left.png
- id: 348
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  image: no_u_turn.png
- id: 349
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  image: no_left_turn.png
- id: 350
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite adelantar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  image: no_right_turn.png
- id: 351
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No adelante a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO ADELANTAR
    (NO PASSING ZONE) significa que no se le permite adelantar a otros vehículos en
    esta área. Marca el comienzo de una zona de no adelantar.
  image: no_passing.png
- id: 352
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  image: keep_right.png
- id: 353
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  image: speed_limit_25.png
- id: 354
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  image: deer_crossing.png
- id: 355
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  image: pedestrian_crossing.png
- id: 356
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  image: school_zone.png
- id: 357
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  image: railroad_crossing.png
- id: 358
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) se coloca en los cruces de ferrocarril.
    Significa que debe ceder el paso a los trenes. Si se acerca un tren, debe detenerse.
  image: railroad_crossbuck.png
- id: 359
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  image: curve_right.png
- id: 360
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  image: sharp_turn_right.png
- id: 361
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera gire
    primero en un sentido y luego en el otro.
  image: reverse_curve.png
- id: 362
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  image: winding_road.png
- id: 363
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  image: merge.png
- id: 364
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción del ancho de la vía y ajuste su
    posición en el carril.
  image: road_narrows.png
- id: 365
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en direcciones
    opuestas. Manténgase a la derecha.
  image: divided_highway.png
- id: 366
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Esté preparado para
    el tráfico de doble sentido.
  image: divided_highway_ends.png
- id: 367
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de sentido único o de una autopista dividida y se
    encuentre con vehículos que circulan en dirección opuesta.
  image: two_way_traffic.png
- id: 368
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  image: slippery_when_wet.png
- id: 369
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  image: hill.png
- id: 370
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  image: signal_ahead.png
- id: 371
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  image: stop_ahead.png
- id: 372
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las carreteras
    laterales.
  image: cross_road.png
- id: 373
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  image: side_road.png
- id: 374
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario fusionarse
    D: Se requiere girar a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de fusionarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  image: added_lane.png
- id: 375
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse o dejar el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  image: no_parking.png
- id: 376
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de estacionamiento para personas con discapacidad vigente pueden
    estacionarse en estos espacios. Las infracciones conllevan multas elevadas.
  image: handicap_parking.png
- id: 377
  category: penalties_and_points
  question: En Hawái, ¿cuál es la diferencia entre una "infracción de tráfico" y un
    "delito de tráfico"?
  choices:
    A: Las infracciones de tráfico implican daños al vehículo; los delitos de tráfico
      implican lesiones personales
    B: Las infracciones de tráfico están sujetas a procedimientos civiles con multas;
      los delitos de tráfico pueden resultar en tiempo de cárcel y requieren comparecencias
      ante el tribunal
    C: Las infracciones de tráfico se aplican solo a conductores comerciales; los
      delitos de tráfico se aplican a todos los conductores
    D: No hay diferencia legal entre ambos
  answer: B
  explanation: El manual establece que las ofensas de tráfico menos graves (infracciones)
    "estarán sujetas a procedimientos civiles en lugar de penales con sanciones tales
    como multas", mientras que las citaciones por delitos de tráfico pueden resultar
    en "la posibilidad de cárcel y, por lo tanto, se requieren comparecencias ante
    el tribunal".
  image: null
- id: 378
  category: penalties_and_points
  question: Según la ley de Hawái, ¿cuál es el nivel de contenido de alcohol en sangre
    en el que se considera que un conductor está "bajo la influencia"?
  choices:
    A: .04 por ciento o más
    B: .05 por ciento o más
    C: .08 por ciento o más
    D: .10 por ciento o más
  answer: C
  explanation: El manual establece que un conductor puede ser considerado "bajo la
    influencia del alcohol si el contenido de alcohol en sangre (BAC) es de .08 por
    ciento o más".
  image: null
- id: 379
  category: penalties_and_points
  question: Según la ley de Tolerancia Cero de Hawái, ¿qué nivel de contenido de alcohol
    en sangre prohíbe a los conductores menores de 21 años operar un vehículo motorizado?
  choices:
    A: .00 o más
    B: .02 o más
    C: .04 o más
    D: .08 o más
  answer: B
  explanation: 'El manual establece: "Se prohíbe a los conductores menores de 21 años
    operar un vehículo motorizado con un nivel de contenido de alcohol en sangre de
    .02 o más".'
  image: null
- id: 380
  category: penalties_and_points
  question: Bajo la Revocación Administrativa de la Licencia de Hawái, ¿qué sucede
    cuando una prueba de alcohol en sangre muestra un contenido de .08 o más?
  choices:
    A: El conductor recibe una advertencia por escrito
    B: Se le retira la licencia al conductor y se le expide un permiso de conducir
      temporal de 30 días
    C: El conductor debe asistir a un programa de educación sobre el alcohol en un
      plazo de 10 días
    D: El vehículo del conductor es confiscado de inmediato
  answer: B
  explanation: 'El manual establece: "Se le retirará su licencia y se le entregará
    un permiso de conducir temporal de 30 días si una prueba muestra que tiene un
    contenido de alcohol en sangre de .08 o más o si se niega a realizar la prueba".'
  image: null
- id: 381
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por violar cualquier disposición aplicable de
    la ley de seguros de vehículos motorizados de Hawái?
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: C
  explanation: El manual establece que cada violación de la ley de seguros de vehículos
    motorizados "estará sujeta a una multa que no excederá los $5,000 o treinta (30)
    días de prisión, o la suspensión de la licencia de operador de vehículos motorizados,
    o la pérdida del certificado de registro del vehículo motorizado, o cualquier
    combinación de dichas sanciones".
  image: null
- id: 382
  category: penalties_and_points
  question: En Hawái, ¿cuál es la sanción por el incumplimiento de la Ley de Responsabilidad
    de Seguridad de Vehículos Motorizados tras ser condenado por ciertos delitos relacionados
    con vehículos?
  choices:
    A: Una multa de $500
    B: La licencia de conducir será suspendida
    C: Horas de servicio comunitario
    D: Inspección vehicular obligatoria
  answer: B
  explanation: El manual establece bajo "¿Cuál es la sanción por incumplimiento?"
    que "La licencia de conducir será suspendida".
  image: null
- id: 383
  category: penalties_and_points
  question: ¿En Hawái, por cuánto tiempo debe presentar y mantener una prueba de responsabilidad
    financiera tras ser condenado por ciertas infracciones relacionadas con vehículos?
  choices:
    A: Un año a partir de la fecha de la condena
    B: Dos años a partir de la fecha de la condena
    C: Tres años a partir de la fecha de la condena
    D: Cinco años a partir de la fecha de la condena
  answer: C
  explanation: El manual establece que usted debe "presentar y mantener una prueba
    de responsabilidad financiera por un período de tres (3) años a partir de la fecha
    de la condena".
- id: 384
  category: penalties_and_points
  question: ¿A qué nivel de contenido de alcohol en la sangre (BAC) se considera que
    un conductor está "bajo los efectos" (impaired) según la ley de Hawái?
  choices:
    A: Más del .02 por ciento pero menos del .05 por ciento
    B: Más del .05 por ciento pero menos del .08 por ciento
    C: Exactamente .08 por ciento
    D: Cualquier cantidad medible
  answer: B
  explanation: El manual establece que un conductor puede ser considerado "bajo los
    efectos si el contenido de alcohol en la sangre es superior al .05 por ciento
    pero inferior al .08 por ciento".
- id: 385
  category: penalties_and_points
  question: Según la ley de Hawái, ¿es legal poseer o consumir bebidas alcohólicas
    en una carretera pública o acera?
  choices:
    A: Sí, siempre y cuando no esté conduciendo
    B: Sí, pero solo durante ciertas horas
    C: No, es contra la ley
    D: Solo en áreas designadas
  answer: C
  explanation: 'El manual establece en letras mayúsculas: "ES CONTRA LA LEY CONSUMIR
    O POSEER CUALQUIER BEBIDA ALCOHÓLICA EN CUALQUIER CARRETERA PÚBLICA O CUALQUIER
    ACERA PÚBLICA".'
- id: 386
  category: penalties_and_points
  question: ¿En Hawái, está prohibido guardar un recipiente de bebida alcohólica abierto
    en el área de pasajeros de un vehículo motorizado en una vía pública?
  choices:
    A: No, siempre y cuando el conductor no esté bebiendo
    B: Solo si hay un menor en el vehículo
    C: Sí, está prohibido guardar un recipiente abierto en el área normalmente ocupada
      por el conductor o los pasajeros
    D: Solo en zonas escolares
  answer: C
  explanation: 'El manual establece: "Está prohibido guardar un recipiente de bebida
    alcohólica abierto en el área de un vehículo motorizado normalmente ocupada por
    el conductor o los pasajeros en cualquier vía pública".'
- id: 387
  category: penalties_and_points
  question: En Hawái, ¿qué deben hacer todos los conductores involucrados en accidentes
    de tráfico que resulten en muerte, lesiones o daños a la propiedad que superen
    una cierta cantidad según la Ley de Responsabilidad de Seguridad de Vehículos
    Motorizados?
  choices:
    A: Informar a su compañía de seguros en un plazo de 30 días
    B: Informar del accidente a la policía y presentar una prueba de seguro (Formulario
      SR-21)
    C: Entregar su licencia al tribunal en un plazo de 10 días
    D: Asistir a un curso obligatorio de seguridad vial
  answer: B
  explanation: El manual establece que los afectados deben "Informar del accidente
    al Departamento de Policía y a la compañía de seguros" y "Presentar prueba de
    seguro (Formulario SR-21)".
