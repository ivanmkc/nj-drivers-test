- id: 331
  category: vehicle_information
  question: ノースカロライナ州において、自己保険証明書を賠償責任保険の証明として使用できるのは、少なくとも何台以上の車両を所有するフリート（車両群）の場合ですか？
  choices:
    A: 5台以上
    B: 10台以上
    C: 15台以上
    D: 25台以上
  answer: D
