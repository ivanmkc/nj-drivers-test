- id: 327
  category: vehicle_information
  question: オンラインで車両登録の現住所を変更するために必要な情報は何ですか？
  choices:
    A: 社会保障番号と生年月日
    B: 車両のナンバープレート番号、車両所有権番号の下5桁、および有効なメールアドレス
    C: 運転記録の認証済みコピーと保険の証明
    D: 他州の運転免許証と仮運転証明書
  answer: B
