- id: 357
  category: license_system
  question: ドライバーが対面で運転免許証を更新する必要がある場合、ロッキーマウントのDMV本部が適切な場所ではないのはなぜですか？
  choices:
    A: 一般公開が永久に停止されているため
    B: 商業運転免許証（CDL）のみを扱っているため
    C: この場所では運転免許証やIDのサービスが提供されていないため
    D: 6ヶ月前の事前予約が必要なため
  answer: C
  explanation: 本文には、DMV本部に関して「（この場所では運転免許証/ID、またはタイトル/登録サービスは提供されていません）」と明記されています。
- id: 358
  category: vehicle_information
  question: このテキストに記載されているノースカロライナ州ドライバー・ハンドブックの改訂日はいつですか？
  choices:
    A: 2024年1月
    B: 2025年5月
    C: 2023年12月
    D: 2025年7月
  answer: B
  explanation: テキストには、ハンドブックは「2025年5月改訂（Revised May 2025）」と記載されています。
- id: 359
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 徐行して注意深く進む
    B: 一時停止（完全停止）する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（止まれ）」の標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に、交通状況と歩行者を確認してください。
  image: stop.png
- id: 360
  category: signs_and_signals
  question: この標識は何をすることを求めていますか？
  choices:
    A: 一時停止（完全停止）する
    B: 加速して交通の流れに合流する
    C: 徐行して車両や歩行者に道を譲る（ゆずれ）
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（ゆずれ）」の標識は、速度を落とし、他の車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  image: yield.png
- id: 361
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意深く運転を続ける
    C: 停止して後退するか、向きを変える — あなたは逆走しています
    D: そのエリアを早く抜けるために加速する
  answer: C
  explanation: 赤と白の「WRONG WAY（進入禁止/逆走）」標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに安全に停止し、向きを変えるか後退してください。
  image: wrong_way.png
- id: 362
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方通行（左方向）である
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」標識は、その道路の交通が矢印の指す一方向にのみ進むことを示しています。
  image: one_way_left.png
- id: 363
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所でのUターン（転回）が禁止されていることを意味します。
  image: no_u_turn.png
- id: 364
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  image: no_left_turn.png
- id: 365
  category: signs_and_signals
  question: この標識は運転者に何を指示していますか？
  choices:
    A: 右側に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線がなくなる
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  image: keep_right.png
- id: 366
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 白い長方形に黒い文字の標識は規制標識です。制限速度の標識は、理想的な条件下でのそのエリアの法定最高速度を示します。
  image: speed_limit_25.png
- id: 367
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園やサファリパークがある
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先は狩猟区域である
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色のひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  image: deer_crossing.png
- id: 368
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  image: school_zone.png
- id: 369
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型のクロスパッチ（踏切警標）は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  image: railroad_crossbuck.png
- id: 370
  category: signs_and_signals
  question: この標識はカーブの標識とどう違いますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: より大きな減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。このカーブの手前では、より大幅に速度を落とす必要があります。
  image: sharp_turn_right.png
- id: 371
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先に単一のカーブ
    C: 反対方向への2つの連続するカーブ
    D: この先にラウンドアバウト
  answer: C
  explanation: 背向カーブ（逆方向の連続カーブ）の標識は、この先に反対方向へ曲がる2つのカーブがあることを警告しています。減速し、道路が最初に一方へ、次に反対側へ曲がることに備えてください。
  image: reverse_curve.png
- id: 372
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 単一の急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブまたは曲がり角
    D: この先に上り坂
  answer: C
  explanation: 「曲がりくねった道」の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、変化する道路状況に注意してください。
  image: winding_road.png
- id: 373
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 他の道路からの交通の合流
    C: 中央分離帯のある道路の開始
    D: 1車線への道幅減少
  answer: B
  explanation: 黄色のひし形の合流標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度と位置を調整する準備をしてください。
  image: merge.png
- id: 374
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 中央分離帯のある道路の開始
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって対向車線と分離された道路（ディバイデッド・ハイウェイ）になることを警告しています。右側を通行してください。
  image: divided_highway.png
- id: 375
  category: signs_and_signals
  question: この標識はこの先に何を予測するよう伝えていますか？
  choices:
    A: 譲れ（Yield）の標識
    B: 交通信号機
    C: 停止しなければならない一時停止標識
    D: スピードバンプ
  answer: C
  explanation: この標識はこの先に一時停止標識があることを警告しています。減速を開始し、一時停止標識で完全に停止できるように準備してください。
  image: stop_ahead.png
- id: 376
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある同乗者がいるすべての運転手
  answer: C
  explanation: 車椅子マークの付いた青い標識は、障害者のために予約された駐車スペースであることを示しています。有効な障害者用駐車許可証またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反には高額な罰金が科せられます。
  image: handicap_parking.png
- id: 377
  category: driver_responsibility
  question: ノースカロライナ州の運転手ハンドブックによると、事故で1人が負傷した場合に必要な賠償責任保険の最低額はいくらですか？
  choices:
    A: $15,000
    B: $25,000
    C: $30,000
    D: $50,000
  answer: C
  explanation: ハンドブックには、賠償責任保険の最低必要額は「事故による1人の負傷につき30,000ドル」と記載されています。
- id: 378
  category: driver_responsibility
  question: ノースカロライナ州において、商用車（CMV）に必要な賠償責任保険の最低額はいくらですか？
  choices:
    A: $100,000
    B: $250,000
    C: $500,000
    D: $750,000
  answer: D
  explanation: ハンドブックには、最低賠償責任保険額のリストの中に「商用車については750,000ドル」と記載されています。
- id: 379
  category: driver_responsibility
  question: ノースカロライナ州で賠償責任保険を解約またはキャンセルする場合、罰金や罰則を避けるために何をすべきですか？
  choices:
    A: 30日以内にDMVに通知する
    B: 保険の解約またはキャンセル前に、車両の有効なナンバープレートを返納する
    C: 保険会社に書面で通知を送る
    D: 運転免許証をDMVに返納する
  answer: B
  explanation: ハンドブックには、「罰金や罰則を避けるために、賠償責任保険の解約またはキャンセル前に、車両の有効なナンバープレートを返納してください」と記載されています。
- id: 380
  category: driver_responsibility
  question: ノースカロライナ州では、どのような場合に警察に事故を報告しなければなりませんか？
  choices:
    A: 死亡者が出た場合のみ
    B: 死亡者もしくは負傷者が出た場合、または損害総額が1,000ドル以上に達すると思われる場合
    C: 損害総額が5,000ドルを超える場合のみ
    D: 救急隊が出動した場合のみ
  answer: B
  explanation: ハンドブックには、「死亡者もしくは負傷者が出た場合、または車両やその他の財産への損害総額が1,000ドル以上に達すると思われる事故については、法律により直ちに最寄りの警察官または警察機関に報告することが義務付けられています」と記載されています。
- id: 381
  category: driver_responsibility
  question: ノースカロライナ州で交通事故に遭った場合、しなければならない3つのことは何ですか？
  choices:
    A: 弁護士に電話し、車両を移動させ、現場を離れる
    B: 自分の氏名、住所、免許証番号、車両登録番号、保険会社名を提供し、相手からも同様の情報を取得する。また、所有者不明の物件に損害を与えた場合は法執行機関に情報を残す
    C: 写真を撮り、保険会社に電話し、病院へ行く
    D: 警察を待ち、弁護士が到着するまで情報の提供を拒否し、車両を移動させる
  answer: B
  explanation: ハンドブックには3つの義務が記載されています。自分の個人情報と保険情報を提供すること、事故に関与した他者から同様の情報を取得すること、そして、負傷者や損害を受けた財産の所有者が不明な場合は、すべての情報を書き留めて最寄りの法執行官に提出することです。
- id: 382
  category: driver_responsibility
  question: ノースカロライナ州の新しい居住者は、州の運転免許証を取得するまでにどのくらいの期間の猶予がありますか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 120日
  answer: B
  explanation: ハンドブックには、「新しい居住者は、居住を開始してから60日以内にノースカロライナ州の免許証または学習許可証（learner permit）を取得しなければならない」と記されています。
- id: 383
  category: driver_responsibility
  question: ノースカロライナ州の運転免許証に記載されている住所から変更があった場合、何日以内にDMV（車両管理局）に通知しなければなりませんか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: C
  explanation: ハンドブックには、「運転免許証に記載されている住所から変更があった場合、60日以内にその変更を局に通知し、重複免許証（再発行）を取得しなければならない」と記されています。
- id: 384
  category: driver_responsibility
  question: ノースカロライナ州法において、1件の事故におけるすべての対人傷害（personal injuries）に対して義務付けられている最低賠償責任保険（liability
    insurance）の金額はいくらですか？
  choices:
    A: $30,000
    B: $50,000
    C: $60,000
    D: $100,000
  answer: C
  explanation: ハンドブックには、最低賠償責任保険には「1件の事故におけるすべての対人傷害に対して$60,000」が含まれると記されています。
- id: 385
  category: driver_responsibility
  question: ノースカロライナ州の車両所有者が、適切な賠償責任保険に加入せずに自動車を運転していることが判明した場合、どうなる可能性がありますか？
  choices:
    A: 運転免許証が永久に失効する
    B: 車両のナンバープレートが30日間取り消される可能性がある
    C: 車両が直ちに押収される
    D: 所有者は運転免許試験を再受験しなければならない
  answer: B
  explanation: ハンドブックには、「車両所有者が適切な賠償責任保険なしに自動車を運転していることがDMVに通知された場合、継続的な保険適用の証明が提供されない限り、その車両のナンバープレートは30日間取り消される可能性がある」と記されています。
- id: 386
  category: driver_responsibility
  question: ノースカロライナ州において、アルコール関連の免許取り消し後の再交付手数料（restoration fee）はいくらですか？
  choices:
    A: $83.50
    B: $100.00
    C: $167.25
    D: $250.00
  answer: C
  explanation: ハンドブックには「再交付手数料（アルコール関連）」は$167.25と記載されており、そのうち「$25分」は「州全体の化学検査基金（Chemical
    Testing Fund）」に充てられます。
