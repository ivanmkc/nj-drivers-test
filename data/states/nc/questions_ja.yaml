  explanation: トレーラーを牽引している車両に接近する際は、急ブレーキによってトレーラーがジャックナイフ現象を起こす可能性があることに注意してください。
- id: 319
  category: vehicle_information
  question: モペッドの運転者が製造者証明書（MCO）を持っていない場合、所有権の証明として使用できる書類は何ですか？
  choices:
    A: 販売店からの公証済み売買証書
    B: モペッド登録のための事実申立書（MVR-58）
    C: 有効なノースカロライナ州の運転免許証
    D: 前所有者の登録カード
