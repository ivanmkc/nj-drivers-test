questions:
- id: 1
  category: safe_driving_rules
  question: ノースカロライナ州には、州が管理する道路が約何マイルありますか？
  choices:
    A: 50,000マイル
    B: 80,000マイル
    C: 100,000マイル
    D: 284,000マイル
  answer: B
  explanation: ハンドブックの序文によると、ノースカロライナ州には80,000マイル以上の州管理道路があります。
- id: 2
  category: driver_responsibility
  question: ノースカロライナ州の道路では、毎年約何件の交通事故が発生していますか？
  choices:
    A: 80,000件
    B: 150,000件
    C: 284,000件
    D: 760万件
  answer: C
  explanation: マニュアルには、ノースカロライナ州の道路では毎年約284,000件の交通事故が発生していると記載されています。
- id: 3
  category: license_system
  question: 24時間自動音声案内を利用できるDMVdirectAccessの電話番号は何番ですか？
  choices:
    A: 919-615-6131
    B: 919-715-7000
    C: 919-814-1779
    D: 919-707-4670
  answer: B
  explanation: プッシュ回線の電話から919-715-7000にダイヤルするとDMVdirectAccessに繋がり、24時間365日いつでも情報にアクセスできます。
- id: 4
  category: license_system
  question: DMVdirectAccessの電話システムを使用して、お住まいの地域の運転免許営業所または車両登録営業所の場所を調べるにはどうすればよいですか？
  choices:
    A: 郵便番号を入力する
    B: 市の名前を音声で伝える
    C: 運転免許証番号を入力する
    D: ナンバープレートの番号を入力する
  answer: A
  explanation: マニュアルには、郵便番号を入力することで、DMVdirectAccessシステムがお住まいの地域の運転免許営業所または車両登録営業所の場所を案内できると記載されています。
- id: 5
  category: license_system
  question: MyNCDMV.govでオンライン利用可能なサービスは次のうちどれですか？
  choices:
    A: 運転技能試験の受験
    B: パーソナライズド・プレート（希望ナンバープレート）の注文
    C: 初めてのREAL IDの取得
    D: 視力検査の受験
  answer: B
  explanation: パーソナライズド・プレートの注文は、MyNCDMV.govの「利用可能なオンラインサービス」セクションに記載されています。
- id: 6
  category: license_system
  question: オンラインで運転免許証または身分証明書の再発行を申請する場合の手数料はいくらですか？
  choices:
    A: $10.00
    B: $15.50
    C: $16.75
    D: $20.00
  answer: C
  explanation: オンラインで運転免許証または身分証明書の再発行を申請するには、16.75ドルの手数料がかかります。
- id: 7
  category: license_system
  question: オンラインで運転免許証の再発行を申請する正当な理由は、次のうちどれですか？
  choices:
    A: 法的氏名を変更するため
    B: 商用運転免許証（CDL）にアップグレードするため
    C: 汚損または破損した免許証を交換するため
    D: 視力矯正レンズの制限を解除するため
  answer: C
  explanation: マニュアルによると、紛失または盗難に遭った免許証の交換、居住地や郵送先住所の変更、または汚損・破損した免許証の交換のために、オンラインで再発行を申請することができます。
- id: 8
  category: license_system
  question: 運転免許証の有効期限のどれくらい前からオンラインで更新手続きができますか？
  choices:
    A: 最大3ヶ月前
    B: 最大6ヶ月前
    C: 最大9ヶ月前
    D: 最大12ヶ月前
  answer: B
  explanation: 運転免許証のオンライン更新手続きは、免許証の有効期限の最大6ヶ月前から行うことができます。
- id: 9
  category: license_system
  question: 運転者はどのくらいの頻度でオンラインでの運転免許証更新手続きを利用できますか？
  choices:
    A: 更新のたびに毎回
    B: 更新1回おきに（2回に1回）
    C: 生涯に1回のみ
    D: 更新3回に1回
  answer: B
  explanation: マニュアルには、運転者は免許更新の1回おきに（2回に1回）オンラインでの運転免許証手続きを利用できると記載されています。
- id: 10
  category: license_system
  question: 運転者の年齢に応じて、更新された運転免許証は何年間有効ですか？
  choices:
    A: 4年または6年
    B: 5年または8年
    C: 3年または5年
    D: 6年または10年
  answer: B
  explanation: 新しい免許証は7〜14営業日以内に郵送され、運転者の年齢に応じて5年間または8年間有効となります。
- id: 11
  category: license_system
  question: 以下のうち、オンラインで運転免許証の更新手続きができないのは誰ですか？
  choices:
    A: 視力矯正レンズの条件付き免許を持つ運転手
    B: 商用運転免許証（CDL）の更新をしようとしている運転手
    C: 免許の有効期限が5ヶ月後に切れる運転手
    D: 前回直接窓口で更新した運転手
  answer: B
  explanation: 商用運転免許証の更新にはオンラインサービスを利用できません。DMV（車両管理局）の免許センターで手続きを完了する必要があります。
- id: 12
  category: license_system
  question: オンラインでの更新手続き完了後、新しい運転免許証はいつ郵送されますか？
  choices:
    A: 1〜3営業日
    B: 3〜5営業日
    C: 7〜14営業日
    D: 15〜30営業日
  answer: C
  explanation: マニュアルには、オンライン更新手続き完了後、7〜14営業日以内に新しい免許証が郵送されると記載されています。
- id: 13
  category: sharing_the_road
  question: お住まいの地域の公共交通機関の選択肢について詳しく知るには、どの部門に連絡すべきですか？
  choices:
    A: 交通記録課 (Traffic Records Section)
    B: ノースカロライナ州運輸省 公共交通局 (N.C. Department of Transportation Public Transportation
      Division)
    C: 国際登録計画課 (International Registration Plan Section)
    D: タグ・アンド・タックス・トゥギャザー (Tag and Tax Together)
  answer: B
  explanation: お住まいの地域の公共交通機関の選択肢について詳しく知るには、ノースカロライナ州運輸省 公共交通局（919-707-4670）に電話でお問い合わせください。
- id: 14
  category: license_system
  question: 初めてREAL ID（リアルID）を取得する際、オンラインシステムを利用できますか？
  choices:
    A: はい、有効な社会保障番号（SSN）を持っていれば可能です。
    B: はい、追加料金を支払えば可能です。
    C: いいえ、初めてのREAL ID発行はオンラインではできません。
    D: いいえ、REAL IDは商用運転手にのみ発行されます。
  answer: C
  explanation: マニュアルには明確に次のように記載されています。「初めての免許証やIDカードの取得にオンラインシステムを利用することはできません。これは初めてのREAL
    ID発行にも適用されます。」
- id: 15
  category: license_system
  question: 有効な運転免許証を持たずに、エンジンがかかっている自動車の運転席に座ることは合法ですか？
  choices:
    A: はい、車両が駐車されていれば合法です。
    B: はい、免許を持った運転手が助手席にいれば合法です。
    C: いいえ、違法です。
    D: いいえ、私有地にいない限り違法です。
  answer: C
  explanation: 有効な運転免許証を持たずに、エンジンがかかっている自動車の運転席に座ることや、他の車両に押されたり牽引されたりしている自動車のハンドルを操作することは違法です。
- id: 16
  category: penalties_and_points
  question: 免許証に視力矯正レンズの着用が義務付けられている場合、適切なレンズを着用せずに運転した際の罰則は何ですか？
  choices:
    A: 初回違反の場合は警告。
    B: 50ドルの罰金。
    C: 無免許運転と同じ罰則。
    D: 車両登録の即時停止。
  answer: C
  explanation: 適切な視力矯正レンズを着用せずに運転した場合の罰則は、無免許運転と同じです。
- id: 17
  category: driver_testing
  question: 18歳以上の人が標準の仮免許（learner permit）を取得する際、不要なテストは次のうちどれですか？
  choices:
    A: 視力テスト
    B: 道路標識テスト
    C: 自動車法規の知識テスト（筆記試験）
    D: 運転技能テスト（路上試験）
  answer: D
  explanation: 仮免許の取得に必要なテストには、視力、道路標識、自動車法規の知識が含まれます。仮免許の取得に運転技能テストは必要ありません。
- id: 18
  category: license_system
  question: 仮免許（learner permit）所持者が自動車を運転する際、誰が同乗しなければなりませんか？
  choices:
    A: 21歳以上の大人。
    B: 運転中の自動車を運転する免許を持ち、仮免許所持者の隣に座る人。
    C: 親または法定後見人。
    D: 認定された運転指導員。
  answer: B
  explanation: 仮免許所持者が公道で自動車を運転する際は、運転中の自動車を運転する免許を持ち、仮免許所持者の隣に座る人が同乗しなければなりません。
- id: 19
  category: license_system
  question: オートバイの仮免許（motorcycle learner permit）の有効期間はどのくらいですか？
  choices:
    A: 6ヶ月
    B: 12ヶ月
    C: 2年
    D: 5年
  answer: B
  explanation: オートバイの仮免許の有効期間は12ヶ月で、さらに6ヶ月間、1回のみ更新することができます。
- id: 20
  category: license_system
  question: 18歳未満の申請者がオートバイの仮免許を申請する前に所持していなければならないものは何ですか？
  choices:
    A: 標準の仮免許（learner permit）
    B: 車両管理局（DMV）が発行した正式な暫定免許（full provisional license）
    C: 商用運転免許証（CDL）
    D: 高校の卒業証書
  answer: B
  explanation: 申請者が16歳以上18歳未満の場合、車両管理局（DMV）が発行した正式な暫定免許（full provisional license）を所持している必要があります。
- id: 21
  category: license_system
  question: オートバイの仮免許（motorcycle learner permit）でオートバイを運転する場合、同乗者を乗せることは許可されていますか？
  choices:
    A: はい。同乗者が18歳以上であれば許可されます。
    B: はい。同乗者がオートバイの免許を持っていれば許可されます。
    C: いいえ。この仮免許は同乗者なしでの運転のみを許可するものです。
    D: はい。同乗者がヘルメットを着用していれば許可されます。
  answer: C
  explanation: オートバイの仮免許は、同乗者なしでオートバイを運転することを許可するものです。
- id: 22
  category: driver_testing
  question: 交通標識テスト（traffic signs test）に合格するには何をしなければなりませんか？
  choices:
    A: 色と形で標識を識別し、それぞれの意味を説明する。
    B: 記憶を頼りに標識を描く。
    C: 50フィートの距離から標識を声に出して読む。
    D: 道路上の配置によって標識を識別する。
  answer: A
  explanation: 標識テストに合格するには、色と形で交通標識を識別し、それぞれの意味を説明しなければなりません。
- id: 23
  category: driver_testing
  question: 読むことが困難な人のために、学科試験（knowledge test）ではどのような配慮が用意されていますか？
  choices:
    A: 持ち帰り試験
    B: 持ち込み可の試験（オープンブック・テスト）
    C: 要望に応じた音声テスト
    D: 筆記試験の代わりの実技試験
  answer: C
  explanation: 読むことが困難な人のために、要望に応じて音声テストを利用することができます。
- id: 24
  category: license_system
  question: オートバイの仮免許の申請者が18歳未満の場合、どのコースを修了しなければなりませんか？
  choices:
    A: 防衛運転コース
    B: オートバイ安全財団（Motorcycle Safety Foundation）のベーシック・ライダー・コース、またはノースカロライナ州オートバイ安全教育プログラム（NC
      Motorcycle Safety Education Program）のベーシック・ライダー・コース
    C: 高校の運転者教育コース
    D: 上級高速道路安全コース
  answer: B
  explanation: 申請者が18歳未満の場合、オートバイ安全財団のベーシック・ライダー・コース、またはノースカロライナ州オートバイ安全教育プログラムのベーシック・ライダー・コースを修了しなければなりません。
- id: 25
  category: license_system
  question: 有効な運転免許証を持っていない場合、他の車両に押されたり牽引されたりしている自動車のハンドルを操作することは合法ですか？
  choices:
    A: はい。エンジンがかかっていないため合法です。
    B: はい。牽引する車両を免許を持った運転者が運転していれば合法です。
    C: いいえ。違法です。
    D: はい。ただし、主要道路以外の道路（secondary roads）でのみ合法です。
  answer: C
  explanation: 有効な運転免許証を持っていない場合、エンジンがかかっている自動車の運転席に座ることや、他の車両に押されたり牽引されたりしている自動車のハンドルを操作することは違法です。
- id: 26
  category: driver_testing
  question: 次のうち、いかなる種類の新規運転免許証（original driver license）の試験要件としても記載されていないものはどれですか？
  choices:
    A: 視力
    B: 自動車法規の知識
    C: 交通標識
    D: 縦列駐車の技能
  answer: D
  explanation: いかなる種類の新規運転免許証であっても、視力、自動車法規の知識、交通標識、および運転技能（路上テスト）が試験される場合があります。縦列駐車は特定の試験要件として記載されていません。
- id: 27
  category: alcohol_drugs_health
  question: 障害のある人でも運転免許証を交付されることはありますか？
  choices:
    A: いいえ。障害のある人は免許を取得できません。
    B: はい。その状態が安全な運転の妨げにならない限り、条件付き免許（restricted license）が交付される場合があります。
    C: はい。ただし、特別に改造された商用車の運転に限られます。
    D: はい。ただし、6ヶ月ごとに運転免許試験を再受験しなければなりません。
  answer: B
  explanation: 障害のある人でも、その状態が安全な運転の妨げにならない限り、条件付き免許が交付される場合があります。
- id: 28
  category: license_system
  question: オートバイの仮免許は何回更新できますか？
  choices:
    A: 更新できません。
    B: さらに6ヶ月間、1回のみ更新できます。
    C: 毎年更新できます。
    D: さらに12ヶ月間、1回のみ更新できます。
  answer: B
  explanation: オートバイの仮免許の有効期間は12ヶ月であり、さらに6ヶ月間、1回のみ更新することができます。
- id: 29
  category: driver_testing
  question: 運転技能（路上）テスト（driving skills (on-the-road) test）はいつ必要ですか？
  choices:
    A: 免許を更新する時のみ。
    B: 初めて免許を申請する時、および場合によっては更新時。
    C: 免許を更新するたび毎回。
    D: 仮免許を申請する時。
  answer: B
  explanation: 初めて免許を申請する際は、運転テストを受けなければなりません。また、免許の更新時に受験が必要になる場合もあります。仮免許の申請時には必要ありません。
- id: 30
  category: driver_testing
  question: 次のうち、路上運転テストで観察および採点される技能はどれですか？
  choices:
    A: 2台の車両間での縦列駐車
    B: パンクしたタイヤの交換
    C: 指示された時に、できるだけ早く安全に停止すること
    D: エンジンオイルの量の確認
  answer: C
  explanation: マニュアルには、「急停止 — 指示された時に、できるだけ早く安全に停止すること」が路上運転テストで観察および採点される技能であると記載されています。
- id: 31
  category: license_system
  question: ほとんどの運転手が自家用車や小型トラックを運転するために必要な普通免許のクラスはどれですか？
  choices:
    A: クラスA
    B: クラスB
    C: クラスC
    D: 商用クラスC
  answer: C
  explanation: マニュアルによると、「ほとんどの運転手は、自家用車や小型トラックを運転するために普通クラスC免許（Regular Class C license）のみを必要とします。」
- id: 32
  category: safe_driving_rules
  question: スリーポイントターン（Uターンの一種）を始める際、車両をどこからスタートさせるべきですか？
  choices:
    A: 道路の中央線から
    B: 道路の右端から
    C: 道路の左端から
    D: 指定された転回車線から
  answer: B
  explanation: マニュアルでは、スリーポイントターンの最初のステップを行う際、「道路の右端からスタートする」よう指示しています。
- id: 33
  category: license_system
  question: 次の車両のうち、運転に商用運転免許証（CDL）が必要なものはどれですか？
  choices:
    A: キャンピングカー（RV）
    B: 軍用車両
    C: 16人以上の乗客を輸送するように設計された車両
    D: 消防および緊急車両
  answer: C
  explanation: 「運転手を含めて16人以上の乗客を輸送するように設計された」クラスCの自動車にはCDLが必要です。RV、軍用車両、消防・緊急車両は免除されます。
- id: 34
  category: license_system
  question: スクールバスの運転手になるには、どのくらいの運転経験が必要ですか？
  choices:
    A: 少なくとも3ヶ月
    B: 少なくとも6ヶ月
    C: 少なくとも1年
    D: 少なくとも5年
  answer: B
  explanation: マニュアルには、スクールバスの運転手は18歳以上であり、「少なくとも6ヶ月の運転経験がある」必要があると記載されています。
- id: 35
  category: license_system
  question: ノースカロライナ州でレベル1限定仮免許（Level One Limited Learner Permit）を申請するための最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: B
  explanation: レベル1限定仮免許の申請について、マニュアルには「15歳以上18歳未満でなければならない」と記載されています。
- id: 36
  category: license_system
  question: レベル1限定仮免許を取得してからの最初の6ヶ月間、監督する運転手が同乗している場合、何時から何時まで運転が許可されていますか？
  choices:
    A: 午前6時から午後8時
    B: 午前5時から午後9時
    C: 午前7時から午後7時
    D: 昼夜を問わずいつでも
  answer: B
  explanation: 最初の6ヶ月間、レベル1の仮免許では「監督する運転手が同乗している場合、午前5時から午後9時の間」の運転が許可されています。
- id: 37
  category: license_system
  question: 監督する運転手は、免許を取得してからどのくらいの期間が経過している必要がありますか？
  choices:
    A: 少なくとも1年
    B: 少なくとも3年
    C: 少なくとも5年
    D: 少なくとも10年
  answer: C
  explanation: マニュアルには、監督する運転手は「有効な運転免許証を保持し、免許を取得してから少なくとも5年が経過していなければならない」と記載されています。
- id: 38
  category: license_system
  question: 限定暫定免許（Limited Provisional License）を申請する前に、運転記録（Driving Log）に合計何時間の運転時間を記録する必要がありますか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: D
  explanation: レベル1限定仮免許では、「最低60時間の運転時間を詳細に記録する」ための運転記録（Driving Log）が渡されます。
- id: 39
  category: safe_driving_rules
  question: レベル1限定仮免許で自動車を運転中、携帯電話の使用が許可されるのはどのような場合ですか？
  choices:
    A: ハンズフリー機器を使用する場合
    B: 赤信号で停車している場合
    C: 緊急事態に関する電話をかける場合のみ
    D: 監督する運転手と連絡を取る場合
  answer: C
  explanation: 自動車の運転中に携帯電話を使用することは許可されていませんが、「緊急事態に関して電話をかける場合」は例外として使用できます。
- id: 40
  category: license_system
  question: レベル2限定暫定免許（Level Two Limited Provisional License）の最低年齢要件は何歳ですか？
  choices:
    A: 15歳
    B: 16歳
    C: 17歳
    D: 18歳
  answer: B
  explanation: レベル2限定暫定免許について、マニュアルには「運転手は16歳以上18歳未満でなければならない」と記載されています。
- id: 41
  category: license_system
  question: レベル2限定暫定免許（Level Two Limited Provisional License）を持つ運転者は、次の場所へ直接運転して向かう、またはそこから帰る場合、いつでも監督者なしで運転することができます：
  choices:
    A: 学校主催のスポーツイベント
    B: 職場、またはボランティアの消防、救助、救急医療サービス（EMS）
    C: 家族の家
    D: 運転者教育コース
  answer: B
  explanation: レベル2の運転者は、午前5時から午後9時まで監督者なしで運転できます。「また、職場、またはボランティアの消防、救助、救急医療サービスへ直接向かう、またはそこから帰る場合はいつでも」監督者なしで運転できます。
- id: 42
  category: license_system
  question: レベル2限定暫定免許（Level Two Limited Provisional License）で監督者なしで運転する場合、運転者と同居していない21歳未満の同乗者に関する制限は何ですか？
  choices:
    A: 21歳未満の同乗者を乗せることはできない
    B: そのような同乗者は1名のみ乗せることができる
    C: そのような同乗者は最大2名まで乗せることができる
    D: 同乗者の人数に制限はない
  answer: B
  explanation: マニュアルには、「監督者なしで運転する場合、運転者と同居していない21歳未満の同乗者を1名乗せることができる」と記載されています。
- id: 43
  category: license_system
  question: レベル1限定仮免許（Level One Limited Learner Permit）を持つ人が運転する車両の助手席（フロントシート）に座ることが許可されているのは誰ですか？
  choices:
    A: 運転者と監督運転者のみ
    B: 運転者と18歳以上の同乗者
    C: 運転者と最大2名の同乗者
    D: シートベルトを着用していれば誰でも
  answer: A
  explanation: マニュアルには、レベル1の仮免許について「運転者と監督運転者以外はフロントシート（前席）に座ることはできない」と明記されています。
- id: 44
  category: license_system
  question: ノースカロライナ州法によると、車両管理局（Division）は、次のいずれかに該当する人物に対して「P」または「S」の免種追加（endorsement）を含む商用運転免許証を発行してはなりません：
  choices:
    A: 運転経験が1年未満である
    B: 性犯罪者および公衆保護登録プログラムに基づく登録が義務付けられている
    C: 過去6ヶ月以内に交通違反（moving violation）を受けた
    D: 21歳未満である
  answer: B
  explanation: マニュアルには、「車両管理局（Division）は、性犯罪者および公衆保護登録プログラムに基づく登録が義務付けられている人物に対し、『P』または『S』の免種追加（endorsement）を反映した商用運転免許証の発行または更新を行ってはならない」と記されています。
- id: 45
  category: license_system
  question: 監督運転者（supervising driver）の要件は何ですか？
  choices:
    A: 21歳以上であり、無事故無違反の運転記録を持っていること
    B: 有効な運転免許証を保持し、免許取得から少なくとも5年が経過していること
    C: 18歳以上の兄弟姉妹であること
    D: 商用運転免許証を持っていること
  answer: B
  explanation: 監督運転者は、有効な運転免許証を保持し、免許取得から少なくとも5年が経過している必要があります。
- id: 46
  category: penalties_and_points
  question: 暫定免許保持者（18歳未満）が、いかなる量であれアルコールまたは薬物を摂取した後に運転して有罪判決を受けた場合、どのような罰則がありますか？
  choices:
    A: 30日間の免許停止
    B: 500ドルの罰金
    C: 1年間の免許取り消し
    D: 義務的な社会奉仕活動
  answer: C
  explanation: 暫定免許保持者が、いかなる量であれアルコールまたは薬物を摂取した後、または摂取中に自動車を運転することは違法であり、そのような違反で有罪判決を受けた場合、1年間の免許取り消しとなります。
- id: 47
  category: driver_testing
  question: 18歳未満の運転者向けの認可された運転者教育コースでは、座学と実技（behind-the-wheel）の指導がそれぞれ何時間必要ですか？
  choices:
    A: 座学20時間、実技4時間
    B: 座学30時間、実技6時間
    C: 座学40時間、実技10時間
    D: 座学50時間、実技12時間
  answer: B
  explanation: 18歳未満の運転者は、少なくとも30時間の座学と6時間の実技指導からなる認可された運転者教育コースに合格したことを示す証明書を提示する必要があります。
- id: 48
  category: license_system
  question: 18歳未満の人物が運転資格証明書（Driving Eligibility Certificate）の要件を満たさなくなったという通知をDMV（車両管理局）が受け取った場合、どうなりますか？
  choices:
    A: 救済運転許可証（hardship driving permit）が発行される
    B: 18歳の誕生日を迎えるか、証明書/卒業証書を取得するまで運転免許が取り消される
    C: 免許復帰手数料を支払わなければならない
    D: 職場への往復の運転のみに制限される
  answer: B
  explanation: DMVは、18歳未満の人物が運転資格証明書の要件を満たさなくなったという通知を受け取った場合、その運転免許を取り消さなければなりません。この取り消しは、運転資格証明書、高校の卒業証書、またはGED（高卒認定）を取得しない限り、その人物の18歳の誕生日まで有効です。
- id: 49
  category: safe_driving_rules
  question: 暫定免許保持者が自動車の運転中に携帯電話を使用することが許可されるのは、どのような状況ですか？
  choices:
    A: ハンズフリー機器を使用する場合
    B: 赤信号で停止している場合
    C: 緊急事態に関して緊急対応オペレーターに電話する場合
    D: GPSアプリで道順を確認する場合
  answer: C
  explanation: 暫定免許保持者は、緊急事態に関して緊急対応オペレーター、病院、消防署、法執行機関、親、法定後見人、または配偶者に電話する場合を除き、携帯電話の使用は許可されていません。
- id: 50
  category: license_system
  question: ノースカロライナ州では、18歳未満の個人に対して救済運転許可証または免許証（hardship driving permit or license）を発行していますか？
  choices:
    A: はい、職場への往復の運転に限り発行されます
    B: はい、学校の管理者の承認があれば発行されます
    C: いいえ、ノースカロライナ州では救済運転許可証または免許証は発行していません
    D: はい、ただし医療上の緊急事態に限り発行されます
  answer: C
  explanation: マニュアルには、「ノースカロライナ州では救済運転許可証または免許証は発行していません」と明記されています。
- id: 51
  category: penalties_and_points
  question: 学生が10日以上連続して停学処分を受けた場合、免許の喪失期間はどのくらい続きますか？
  choices:
    A: 30日間
    B: 6ヶ月間
    C: 12ヶ月間、または運転資格証明書（Driving Eligibility Certificate）を取得するまで
    D: 学生が21歳になるまで
  answer: C
  explanation: 10日以上連続する停学処分による免許の喪失は、12ヶ月間、または運転資格証明書（Driving Eligibility Certificate）を取得するまで有効です。
- id: 52
  category: license_system
  question: レベル3の完全仮免許（Level Three Full Provisional License）に移行する前の過去6ヶ月間に、どのような運転記録の要件を満たさなければなりませんか？
  choices:
    A: 走行中の交通違反が2回以下であること
    B: 自動車の走行中の交通違反、シートベルト違反、または携帯電話違反による有罪判決がないこと
    C: 上級防衛運転講習を修了していること
    D: 駐車違反切符がゼロであること
  answer: B
  explanation: レベル3に移行する前の過去6ヶ月間は、自動車の走行中の交通違反、シートベルト違反、または携帯電話違反による有罪判決を受けていてはなりません。
- id: 53
  category: license_system
  question: 制限付き運転免許証の制限範囲外で運転した場合の法的な結果は何ですか？
  choices:
    A: 警告切符を受け取る
    B: 無免許運転とみなされる
    C: 車両が直ちに押収される
    D: 学科試験を再受験しなければならない
  answer: B
  explanation: 免許証に制限がある場合、その制限の範囲内でのみ運転しなければなりません。そうでない場合は無免許運転とみなされます。
- id: 54
  category: license_system
  question: ノースカロライナ州で初めて運転免許証を申請する際、次のうちどれが必要ですか？
  choices:
    A: 自動車損害賠償責任保険の証明書
    B: 有権者登録カード
    C: 雇用主からの推薦状
    D: 医療記録の証明書付きの写し
  answer: A
  explanation: 運転免許証を申請する際は、自動車損害賠償責任保険の証明書を提出する必要があります。
- id: 55
  category: license_system
  question: 2025年5月7日以降、「連邦政府の身分証明用ではない（Not for Federal Identification）」という記載がある運転免許証は、所持者にとって何を意味しますか？
  choices:
    A: 州間高速道路を運転できない
    B: 民間航空機に搭乗したり、連邦施設に入場したりするには、追加の書類が必要になる
    C: アップグレードするまで免許が停止される
    D: ノースカロライナ州内でのみ運転が制限される
  answer: B
  explanation: 2025年5月7日以降、「連邦政府の身分証明用ではない（Not for Federal Identification）」と記載された運転免許証では、民間航空機への搭乗や連邦施設への入場に追加の書類を提示する必要があります。
- id: 56
  category: license_system
  question: 身元および生年月日の証明として出生証明書を使用する場合、次のうち受け入れられないものはどれですか？
  choices:
    A: 州の人口動態統計局に提出された証明書付きの写し
    B: ラミネート加工されたコピーまたはプラスチック製のレプリカ
    C: 出生州の同等機関からの証明書付きの写し
    D: 発行機関によって証明されたコピー
  answer: B
  explanation: 表1には、出生証明書について「ラミネート加工されたコピーやプラスチック製のレプリカは不可」と記載されています。
- id: 57
  category: safe_driving_rules
  question: 仮免許所持者が走行中の車両を運転している場合、誰がシートベルトを適切に着用しなければなりませんか？
  choices:
    A: 運転手と助手席の乗客のみ
    B: 18歳未満の乗客のみ
    C: 車両に乗車しているすべての人
    D: 運転手のみ
  answer: C
  explanation: マニュアルには仮免許所持者について、「車両が走行中の場合、乗車しているすべての人がシートベルトを適切に着用しなければならない」と記載されています。
- id: 58
  category: license_system
  question: レベル1およびレベル2の制限のうち、レベル3の完全仮免許（Level Three Full Provisional License）には適用されないものはどれですか？
  choices:
    A: シートベルトの要件
    B: 運転時間、監督、および同乗者の制限
    C: 飲酒・薬物影響下での運転の禁止
    D: 保険証明書の携帯義務
  answer: B
  explanation: レベル1およびレベル2における運転時間、監督、および同乗者の制限は、完全仮免許（Full Provisional License）には適用されません。
- id: 59
  category: license_system
  question: 身元証明として他州の運転免許証を使用する場合、失効してから最大どのくらいの期間まで認められますか？
  choices:
    A: 失効しているものは一切認められない
    B: 1年未満
    C: 2年未満
    D: 5年未満
  answer: C
  explanation: 表1には、運転免許証、仮免許証、またはIDカードは有効であるか、失効から2年未満でなければならないと記載されています。
- id: 60
  category: license_system
  question: 運転免許証を取得するためにソーシャルセキュリティカード（社会保障カード）を提示する場合、次のうち正しいものはどれですか？
  choices:
    A: 公証されていればコピーでも受け入れられる。
    B: ラミネート加工されたカードでも受け入れられる。
    C: コピーおよびラミネート加工されたカードは認められない。
    D: カードのデジタル画像でも受け入れられる。
  answer: C
  explanation: ソーシャルセキュリティ番号の要件に関する表2によると、ソーシャルセキュリティカードを提示する場合、「コピーおよびラミネート加工されたカードは不可」とされています。
- id: 61
  category: license_system
  question: メディケイド（Medicaid）またはメディケア（Medicare）カードが、社会保障番号（SSN）の証明として認められなくなったのはなぜですか？
  choices:
    A: 簡単に偽造できるため。
    B: 2019年にカードから社会保障番号が削除されたため。
    C: 申請者の本名が記載されていないため。
    D: 連邦法により、州の身分証明書としての使用が禁止されているため。
  answer: B
  explanation: マニュアルには、メディケイド/メディケアカードには社会保障番号が印字されなくなったと記載されています。2019年に加入者に新しい識別番号が記載された新しいカードが発行された際に削除されました。
- id: 62
  category: license_system
  question: 近代化法（Modernization Act）により、成人がRID（通常身分証明書）を取得するために必要なノースカロライナ州の居住証明書はいくつですか？
  choices:
    A: 1つ
    B: 2つ
    C: 3つ
    D: 4つ
  answer: A
  explanation: 表3には、近代化法により、RIDの取得に必要なノースカロライナ州の居住証明書は1つだけであると記載されています。
- id: 63
  category: license_system
  question: 18歳未満の未成年者がノースカロライナ州の居住を証明するために有効な書類は、次のうちどれですか？
  choices:
    A: デジタル保険証明書
    B: 雑誌の定期購読の郵便物
    C: ラミネート加工された社会保障カード
    D: 2020年に発行されたメディケイドカード
  answer: B
  explanation: 表4には、18歳未満の未成年者の居住を証明する有効な書類として「雑誌の定期購読の郵便物（Magazine subscriptions）」が挙げられています。
- id: 64
  category: license_system
  question: 運転免許証を取得するために自動車損害賠償責任保険の加入証明を提出する際、認められない形式はどれですか？
  choices:
    A: 保険代理店が発行するDL-123書式
    B: 保険引受証（バインダー）
    C: 印刷された自動車保険証券
    D: モバイル端末上のデジタル保険証明書
  answer: D
  explanation: マニュアルには、デジタル保険証明書は認められず、モバイル端末上の画像は自動車損害賠償責任保険の証明として受け付けられないと明記されています。
- id: 65
  category: license_system
  question: 法的盲人（legally blind）の申請者が無料で身分証明書（IDカード）を取得するには、どのような追加書類を提出する必要がありますか？
  choices:
    A: かかりつけ医からの手紙
    B: 医師からの手紙（診断書）
    C: ホームレスシェルターからの手紙
    D: 有効期限内の米国軍人ID
  answer: B
  explanation: 表8には、無料ID（No Fee ID）を取得するためには、法的盲人の申請者は医師からの手紙（診断書）を提示しなければならないと記載されています。
- id: 66
  category: license_system
  question: 追加の書類なしで無料ID（No Fee ID）カードを取得できるのは何歳からですか？
  choices:
    A: 60歳以上
    B: 65歳以上
    C: 70歳以上
    D: 75歳以上
  answer: C
  explanation: 表8には、70歳以上の申請者は追加の書類なしで無料IDを取得できると示されています。
- id: 67
  category: license_system
