- id: 356
  category: license_system
  question: ノースカロライナ州ドライバー・ハンドブックに関する記述として正しいものはどれですか？
  choices:
    A: 印刷版のみで提供されている
    B: MyNCDMV.govでオンラインで見つけることができる
    C: 毎年すべての登録ドライバーに郵送される
    D: 一般市民はアクセスできない
