- id: 340
  category: vehicle_information
  question: ノースカロライナ州において、固定資産税の目的で車両の価値を決定する責任を負うのは誰ですか？
  choices:
    A: ノースカロライナ州車両管理局（DMV）
    B: 地元の郡査定局（county assessment office）
