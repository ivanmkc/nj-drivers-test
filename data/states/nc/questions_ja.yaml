- id: 349
  category: license_system
  question: ノースカロライナ州DMVの本部はどの都市にありますか？
  choices:
    A: ローリー（Raleigh）
    B: シャーロット（Charlotte）
    C: ロッキーマウント（Rocky Mount）
    D: グリーンズボロ（Greensboro）
  answer: C
  explanation: DMVの本部は、1515 N. Church Street, Rocky Mount, NC 27804に位置しています。
- id: 350
  category: license_system
  question: ノースカロライナ州DMV本部の所在地（番地）は何ですか？
  choices:
    A: 1515 N. Church Street
