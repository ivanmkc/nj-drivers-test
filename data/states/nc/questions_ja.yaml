- id: 322
  category: sharing_the_road
  question: アダプト・ア・ハイウェイ・プログラム（Adopt-A-Highway Program）に参加する際、ボランティア団体はどのくらいの頻度でごみ拾いを行うことに同意しますか？
  choices:
    A: 月に1回
