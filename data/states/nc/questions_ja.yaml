- id: 328
  category: vehicle_information
  question: ノースカロライナ州で新車を登録するために必要な公式の譲渡書類は何ですか？
  choices:
    A: 公証済みの売買証書
    B: 製造証明書（Manufacturer's certificate of origin）
    C: 自己保険証明書
    D: 非認証の全履歴記録
  answer: B
  explanation: 車両を登録する前に、適切な所有権の証明が必要です。新車の場合、製造証明書（Manufacturer's certificate of
    origin）が公式の譲渡書類となります。
- id: 329
  category: driver_responsibility
  question: ノースカロライナ州内での転居後、免許証または身分証明書（ID）の保持者は何日以内にDMVで現住所を更新しなければなりませんか？
  choices:
    A: 15日
    B: 30日
    C: 60日
    D: 120日
  answer: C
  explanation: ノースカロライナ州内で転居してから60日以内に、免許証または身分証明書（ID）の保持者はDMVで現住所を更新し、免許証または身分証明書の再発行を受ける必要があります。
- id: 330
  category: penalties_and_points
  question: 車両所有者が適切な賠償責任保険なしで自動車を運転していることがDMVに通知された場合、どのような罰則がありますか？
  choices:
    A: 車両が60日間押収される
    B: 車両のナンバープレートが30日間取り消される可能性がある
    C: 運転免許が永久に停止される
    D: 所有者は最低1,000ドルの罰金を支払わなければならない
