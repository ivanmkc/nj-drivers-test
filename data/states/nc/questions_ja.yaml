- image: stop.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（止まれ）」の標識は、停止線、横断歩道、または交差点に進入する前に完全に停止しなければならないことを意味します。交通状況や歩行者を確認してから進んでください。
  id: 359
- image: yield.png
  category: signs_and_signals
  question: この標識はあなたに何を求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通に合流する
    C: 減速し、他の車両や歩行者に優先権（通行権）を譲る
    D: 止まらずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（ゆずれ）」の標識は、減速して他の車両や歩行者に優先権（通行権）を譲らなければならないことを意味します。他の人や車が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 360
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路への進入禁止
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「DO NOT ENTER（進入禁止）」の標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路で見られ、進入すると対向車と衝突する危険がある場所に設置されています。
  id: 361
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見たら、どうするべきですか？
  choices:
    A: Uターンする
    B: 注意して運転を続ける
    C: 停止して後退するか、方向転換する（逆走しているため）
    D: 早くそのエリアを抜けるために加速する
  answer: C
  explanation: 赤と白の「WRONG WAY（逆走）」の標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に方向転換するか後退してください。
  id: 362
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方向（左方向）に流れている
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」の標識は、この道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 363
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、この場所でのUターン（転回）が禁止されていることを意味します。
  id: 364
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行動は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、この交差点での左折が禁止されていることを意味します。
  id: 365
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、この場所での右折が禁止されていることを意味します。
  id: 366
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道路が狭くなる
    B: この区間では他の車両を追い越してはならない
    C: この先、対面通行
    D: 右側を通行する
  answer: B
  explanation: 白黒のペナント型（横向きの三角形）の「NO PASSING ZONE（追い越し禁止区間）」の標識は、このエリアで他の車両を追い越してはならないことを意味します。これは追い越し禁止区間の始まりを示しています。
  id: 367
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転手に何を指示していますか？
  choices:
    A: 右に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線減少
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 368
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色から判断して、これはどのような種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事用標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。制限速度の標識は、理想的な条件下でのそのエリアの法定最高速度を示しています。
  id: 369
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先、動物園やアニマルパークがある
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先、狩猟エリア
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。特に夜明けや夕暮れ時は、速度を落として動物に注意してください。
  id: 370
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先にスクールゾーンあり
    B: この先に横断歩道あり
    C: 近くにハイキングコースあり
    D: この先にバス停あり
  answer: B
  explanation: 歩行者のマークが描かれた黄色のひし形の標識は、この先に横断歩道があることを警告しています。道路を横断する歩行者のために停止する準備をしてください。
  id: 371
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは学校近くの横断歩道
    D: 病院周辺の区域
  answer: C
  explanation: 五角形の蛍光黄緑色の標識は、スクールゾーンまたは学校近くの横断歩道を示しています。減速し、子供に注意してください。
  id: 372
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色の丸い標識は何を警告していますか？
  choices:
    A: この先にラウンドアバウト（環状交差点）あり
    B: 病院周辺の区域
    C: この先に踏切あり
    D: 追い越し禁止区間
  answer: C
  explanation: 黒い「X」と2つの「R」が描かれた黄色の丸い標識は、この先に踏切があることを事前に警告する標識です。減速し、列車の接近を目と耳で確認してください。
  id: 373
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 学校近くの横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型の踏切標識（クロスバック）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が接近している場合は、停止しなければなりません。
  id: 374
- image: curve_right.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を示していますか？
  choices:
    A: この先行き止まり
    B: 右折必須
    C: この先右カーブあり
    D: この先迂回路あり
  answer: C
  explanation: 曲がった矢印が描かれた黄色のひし形の標識は、この先にカーブがあることを警告しています。カーブに入る前に減速してください。
  id: 375
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどう違いますか？
  choices:
    A: より緩やかな曲がり角であることを示している
    B: より大幅な減速が必要な急カーブを警告している
    C: 右折専用を意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に減速する必要があります。
  id: 376
