- id: 136
  category: defensive_driving
  question: 注意散漫になると、衝突を避けるための予防的または回避的な行動をとるのが難しくなるのはなぜですか？
  choices:
    A: 運転者の視野が広がるため
    B: 車両のブレーキの反応が遅くなるため
    C: 多くの注意散漫な行動は、運転者が少なくとも片手をハンドルから離すことを強いるため
    D: 運転者が過度に慎重になるため
  answer: C
  explanation: マニュアルには、多くの注意散漫な行動が運転者に少なくとも片手をハンドルから離すことを強いるため、衝突を避けるための予防的または回避的な行動をとるのが難しくなると記載されています。
