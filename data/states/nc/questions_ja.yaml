- id: 339
  category: vehicle_information
  question: 「Tag & Tax Together（ナンバープレートと税金の一括支払い）」プログラムでは、車両所有者に何が義務付けられていますか？
  choices:
    A: 登録更新のタグ（ステッカー）と車両の固定資産税を1回の支払いで済ませること。
    B: 車両検査と登録更新を1回の支払いで済ませること。
    C: 権利証の再発行とナンバープレートの移行を同時に支払うこと。
