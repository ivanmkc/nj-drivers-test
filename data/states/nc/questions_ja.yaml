questions:
- id: 1
  category: safe_driving_rules
  question: ノースカロライナ州には、州が管理する道路がおよそ何マイルありますか？
  choices:
    A: 50,000マイル
    B: 80,000マイル
    C: 100,000マイル
    D: 284,000マイル
  answer: B
  explanation: ハンドブックの導入部によると、ノースカロライナ州には80,000マイル以上の州管理道路があります。
- id: 2
  category: driver_responsibility
  question: ノースカロライナ州の道路では、毎年およそ何件の事故が発生していますか？
  choices:
    A: 80,000
    B: 150,000
    C: 284,000
    D: 760万
  answer: C
  explanation: マニュアルによると、ノースカロライナ州では毎年道路上で約284,000件の事故が発生しています。
- id: 3
  category: license_system
  question: 24時間自動音声案内で情報を取得できるDMVdirectAccessの電話番号は何番ですか？
  choices:
    A: 919-615-6131
    B: 919-715-7000
    C: 919-814-1779
    D: 919-707-4670
  answer: B
  explanation: DMVdirectAccessは、プッシュ回線の電話から919-715-7000にダイヤルすることで、24時間365日情報にアクセスできます。
- id: 4
  category: license_system
  question: DMVdirectAccessの電話システムを使用して、お住まいの地域の運転免許試験場または車両登録事務所の場所を確認するにはどうすればよいですか？
  choices:
    A: 郵便番号を入力する
    B: 都市名を話す
    C: 運転免許証番号を入力する
    D: ナンバープレート番号を入力する
  answer: A
  explanation: マニュアルには、郵便番号を入力することで、DMVdirectAccessシステムがお住まいの地域の運転免許試験場または車両登録事務所の場所を案内できると記載されています。
- id: 5
  category: license_system
  question: MyNCDMV.govでオンライン利用可能なサービスは次のうちどれですか？
  choices:
    A: 運転技能試験の受験
    B: パーソナライズ・プレート（希望ナンバー）の注文
    C: 初めてのREAL IDの取得
    D: 視力検査の受検
  answer: B
  explanation: パーソナライズ・プレートの注文は、MyNCDMV.govの「利用可能なオンラインサービス」セクションに記載されています。
- id: 6
  category: license_system
  question: オンラインで運転免許証または身分証明書の再発行を申請する場合の手数料はいくらですか？
  choices:
    A: $10.00
    B: $15.50
    C: $16.75
    D: $20.00
  answer: C
  explanation: オンラインでの運転免許証/身分証明書の再発行申請には、16.75ドルの手数料がかかります。
- id: 7
  category: license_system
  question: オンラインで運転免許証の再発行を申請する正当な理由は、次のうちどれですか？
  choices:
    A: 法的な氏名を変更するため
    B: 商業運転免許証（CDL）にアップグレードするため
    C: 汚損または破損した免許証を交換するため
    D: 矯正眼鏡の使用制限を解除するため
  answer: C
  explanation: マニュアルによると、免許証の紛失や盗難、住所の変更、または免許証の汚損や破損の場合に、オンラインで再発行を申請することができます。
- id: 8
  category: license_system
  question: 運転免許証の有効期限のどのくらい前からオンラインで更新手続きができますか？
  choices:
    A: 最大3ヶ月前
    B: 最大6ヶ月前
    C: 最大9ヶ月前
    D: 最大12ヶ月前
  answer: B
  explanation: オンラインでの運転免許証更新手続きは、有効期限の6ヶ月前から可能です。
- id: 9
  category: license_system
  question: 運転免許証のオンライン更新手続きは、どのくらいの頻度で利用できますか？
  choices:
    A: 更新のたびに毎回
    B: 更新2回につき1回
    C: 生涯に1回のみ
    D: 更新3回につき1回
  answer: B
  explanation: マニュアルには、オンラインでの運転免許証更新手続きは、免許更新2回につき1回利用可能であると記載されています。
- id: 10
  category: license_system
  question: 運転者の年齢によりますが、更新された運転免許証の有効期間は何年ですか？
  choices:
    A: 4年または6年
    B: 5年または8年
    C: 3年または5年
    D: 6年または10年
  answer: B
  explanation: 新しい免許証は7〜14営業日以内に郵送され、運転者の年齢に応じて5年または8年間有効となります。
- id: 11
  category: license_system
  question: 次のうち、オンラインで運転免許証の更新ができないのは誰ですか？
  choices:
    A: 矯正レンズの使用制限がある運転者
    B: 商業用運転免許証（CDL）を更新しようとしている運転者
    C: 免許証の有効期限が5ヶ月以内に切れる運転者
    D: 前回対面で更新した運転者
  answer: B
  explanation: 商業用運転免許証（CDL）を更新する場合、オンラインサービスは利用できません。DMVの免許事務所で手続きを完了させる必要があります。
- id: 12
  category: license_system
  question: オンライン更新手続きの完了後、新しい運転免許証はいつ頃郵送されますか？
  choices:
    A: 1-3営業日
    B: 3-5営業日
    C: 7-14営業日
    D: 15-30営業日
  answer: C
  explanation: マニュアルには、オンライン更新の完了後、7-14営業日以内に新しい免許証が郵送されると記載されています。
- id: 13
  category: sharing_the_road
  question: お住まいの地域の公共交通機関の選択肢について詳しく知るには、どの部門に連絡すべきですか？
  choices:
    A: 交通記録課（Traffic Records Section）
    B: ノースカロライナ州運輸局 公共交通部門（N.C. Department of Transportation Public Transportation
      Division）
    C: 国際登録計画課（International Registration Plan Section）
    D: タグ・アンド・タックス・トゥギャザー（Tag and Tax Together）
  answer: B
  explanation: お住まいの地域の公共交通機関の選択肢について詳しく知るには、ノースカロライナ州運輸局 公共交通部門（919-707-4670）に電話してください。
- id: 14
  category: license_system
  question: 初めてREAL IDを取得する場合、オンラインシステムを利用できますか？
  choices:
    A: はい、有効な社会保障番号があれば可能です
    B: はい、追加料金を支払えば可能です
    C: いいえ、初めてのREAL ID発行はオンラインでは行えません
    D: いいえ、REAL IDは商業用ドライバーにのみ発行されます
  answer: C
  explanation: マニュアルには、「利用者はオンラインシステムを使用して初めての免許証やIDカードを取得することはできません。これは初めてのREAL ID発行にも適用されます」と明記されています。
- id: 15
  category: license_system
  question: 有効な運転免許証を持たずに、エンジンのかかった自動車の運転席に座ることは合法ですか？
  choices:
    A: はい、車両が停車していれば合法です。
    B: はい、免許を持つ運転者が助手席にいれば合法です。
    C: いいえ、違法です。
    D: いいえ、私有地でない限り違法です。
  answer: C
  explanation: 有効な運転免許証を持たずに、エンジンのかかった自動車の運転席に座ることや、他の車両に押されたり牽引されたりしている自動車を操縦することは違法です。
- id: 16
  category: penalties_and_points
  question: 免許証に矯正レンズの使用が義務付けられているにもかかわらず、適切なレンズを使用せずに運転した場合の罰則は何ですか？
  choices:
    A: 初回違反は警告。
    B: 50ドルの罰金。
    C: 無免許運転と同じ罰則。
    D: 車両登録の即時停止。
  answer: C
  explanation: 適切な矯正レンズを使用せずに運転した場合の罰則は、無免許運転と同じです。
- id: 17
  category: driver_testing
  question: 18歳以上の人が標準的な学習許可証（ラーナーパーミット）を取得するために必要のないテストはどれですか？
  choices:
    A: 視力検査
    B: 交通標識テスト
    C: 自動車法規の知識テスト
    D: 運転技能テスト（路上試験）
  answer: D
  explanation: 学習許可証に必要なテストには、視力、交通標識、自動車法規の知識が含まれます。学習許可証の段階では、運転技能テスト（路上試験）は必要ありません。
- id: 18
  category: license_system
  question: 学習許可証（ラーナーパーミット）の保持者が自動車を運転する際、誰が同乗しなければなりませんか？
  choices:
    A: 21歳以上のすべての成人。
    B: 運転中の車両を運転する資格のある免許保持者で、許可証保持者の隣に座っている人。
    C: 親または法的保護者。
    D: 認定された教習指導員。
  answer: B
  explanation: 許可証保持者が公道で自動車を運転する際は、運転中の車両を運転する資格のある免許保持者が同乗し、許可証保持者の隣に座っていなければなりません。
- id: 19
  category: license_system
  question: 二輪車学習許可証（モーターサイクル・ラーナーパーミット）の有効期間はどのくらいですか？
  choices:
    A: 6ヶ月
    B: 12ヶ月
    C: 2年
    D: 5年
  answer: B
  explanation: 二輪車学習許可証の有効期間は12ヶ月で、さらに6ヶ月間、一度だけ更新することができます。
- id: 20
  category: license_system
  question: 18歳未満の申請者が二輪車学習許可証（モーターサイクル・ラーナーパーミット）を申請する前に、何を所持している必要がありますか？
  choices:
    A: 標準的な学習許可証（ラーナーパーミット）
    B: 当局が発行したフル暫定免許証（Full provisional license）
    C: 商業用運転免許証（CDL）
    D: 高校の卒業証書
  answer: B
  explanation: 申請者が16歳以上18歳未満の場合、当局が発行したフル暫定免許証（Full provisional license）を所持している必要があります。
- id: 21
  category: license_system
  question: 二輪車学習許可証（モーターサイクル・ラーナー・パーミット）で二輪車を運転する際、同乗者は認められますか？
  choices:
    A: はい、同乗者が18歳以上であれば可能です。
    B: はい、同乗者が二輪車免許の保持者であれば可能です。
    C: いいえ、この許可証は同乗者なしでの運転のみを認めています。
    D: はい、同乗者がヘルメットを着用していれば可能です。
  answer: C
  explanation: 二輪車学習許可証は、同乗者なしで二輪車を運転することを許可するものです。
- id: 22
  category: driver_testing
  question: 道路標識テストに合格するには、何をしなければなりませんか？
  choices:
    A: 色と形で標識を識別し、それぞれの意味を説明する。
    B: 記憶を頼りに標識を描く。
    C: 50フィートの距離から標識を音読する。
    D: 道路上の配置によって標識を識別する。
  answer: A
  explanation: 標識テストに合格するには、道路標識を色と形で識別し、それぞれの意味を説明できなければなりません。
- id: 23
  category: driver_testing
  question: 読解が困難な人のために、知識テスト（学科試験）ではどのような配慮がなされていますか？
  choices:
    A: 持ち帰り試験
    B: 教本持ち込み可の試験
    C: 要望に応じた音声テスト
    D: 筆記試験の代わりの実技デモンストレーション
  answer: C
  explanation: 読解が困難な方には、要望に応じて音声テストが用意されています。
- id: 24
  category: license_system
  question: 二輪車学習許可証の申請者が18歳未満の場合、どのコースを修了しなければなりませんか？
  choices:
    A: 防衛運転（ディフェンシブ・ドライビング）コース
    B: モーターサイクル安全財団（MSF）基本ライダーコース、またはノースカロライナ州二輪車安全教育プログラム基本ライダーコース
    C: 高校の運転教育コース
    D: 高度高速道路安全コース
  answer: B
  explanation: 申請者が18歳未満の場合、モーターサイクル安全財団（MSF）基本ライダーコース、またはノースカロライナ州二輪車安全教育プログラム基本ライダーコースを修了する必要があります。
- id: 25
  category: license_system
  question: 有効な運転免許証を持っていない場合、他の車両に押されたり牽引されたりしている自動車を操縦することは合法ですか？
  choices:
    A: はい、エンジンがかかっていないため合法です。
    B: はい、牽引する車両を免許保持者が運転していれば合法です。
    C: いいえ、それは違法です。
    D: はい、ただし二次道路（secondary roads）に限ります。
  answer: C
  explanation: 有効な運転免許証を持っていない場合、エンジンがかかっている自動車の運転席に座ること、または他の車両に押されたり牽引されたりしている自動車を操縦することは違法です。
- id: 26
  category: driver_testing
  question: あらゆる種類の新規運転免許証の試験要件として「含まれていない」ものはどれですか？
  choices:
    A: 視力
    B: 自動車法に関する知識
    C: 道路標識
    D: 縦列駐車の習熟度
  answer: D
  explanation: あらゆる種類の新規運転免許証では、視力、自動車法に関する知識、道路標識、および運転技能（路上試験）がテストされる場合があります。縦列駐車は特定の試験要件として記載されていません。
- id: 27
  category: alcohol_drugs_health
  question: 障がいのある人に運転免許証を発行することはできますか？
  choices:
    A: いいえ、障がいのある人は免許を取得できません。
    B: はい、その状態が安全な運転を妨げない限り、限定免許が発行される場合があります。
    C: はい、ただし特別に改造された商用車の運転に限ります。
    D: はい、ただし6ヶ月ごとに運転試験を再受験しなければなりません。
  answer: B
  explanation: 障がいのある方でも、その状態が安全な運転を妨げない限り、限定免許が発行される場合があります。
- id: 28
  category: license_system
  question: 二輪車学習許可証は何回更新できますか？
  choices:
    A: 更新できません。
    B: さらに6ヶ月間、1回だけ更新できます。
    C: 毎年更新できます。
    D: さらに12ヶ月間、1回だけ更新できます。
  answer: B
  explanation: 二輪車学習許可証の有効期間は12ヶ月で、さらに6ヶ月間、1回だけ更新することができます。
- id: 29
  category: driver_testing
  question: 運転技能（路上）試験はいつ必要ですか？
  choices:
    A: 免許更新時のみ。
    B: 初めて免許を申請するとき、および更新時に必要な場合があります。
    C: 免許を更新するたびに毎回。
    D: 学習許可証を申請するとき。
  answer: B
  explanation: 初めて免許を申請するときは、運転試験を受ける必要があります。また、免許の更新時に受ける必要がある場合もあります。学習許可証の申請時には必要ありません。
- id: 30
  category: driver_testing
  question: 路上運転試験中に観察され、採点される技能は次のうちどれですか？
  choices:
    A: 2台の車両の間への縦列駐車
    B: パンクしたタイヤの交換
    C: 指示されたときに、可能な限り迅速かつ安全に停止すること
    D: エンジンオイルの量の確認
  answer: C
  explanation: マニュアルには、「クイックストップ（Quick stops） — 指示されたときに、可能な限り迅速かつ安全に停止すること」が路上運転試験中に観察され、採点される技能として記載されています。
- id: 31
  category: license_system
  question: 自家用車や小型トラックを運転するために、ほとんどのドライバーが必要とする普通免許の区分はどれですか？
  choices:
    A: クラスA
    B: クラスB
    C: クラスC
    D: 営業用クラスC
  answer: C
  explanation: マニュアルによると、「ほとんどのドライバーは、自家用車や小型トラックを運転するために普通クラスC免許のみを必要とします」とあります。
- id: 32
  category: safe_driving_rules
  question: 3点ターン（three-point turnabout）を開始するとき、車両はどこから出発すべきですか？
  choices:
    A: 道路の中央線から
    B: 道路の右端から
    C: 道路の左端から
    D: 指定された右左折車線から
  answer: B
  explanation: マニュアルでは、3点ターンの最初のステップを実行する際、「道路の右端から開始する」よう指示されています。
- id: 33
  category: license_system
  question: 次の車両のうち、運転に商業運転免許（CDL）が必要なものはどれですか？
  choices:
    A: レクリエーション用車両（RV）
    B: 軍用機器
    C: 16人以上の乗客を運ぶように設計された車両
    D: 消防および緊急用機器
  answer: C
  explanation: 商業運転免許（CDL）は、「運転手を含め16人以上の乗客を運ぶように設計された」クラスC自動車に必要です。RV、軍用機器、消防・緊急用機器は免除されます。
- id: 34
  category: license_system
  question: スクールバスの運転手になるには、どのくらいの運転経験が必要ですか？
  choices:
    A: 少なくとも3ヶ月
    B: 少なくとも6ヶ月
    C: 少なくとも1年
    D: 少なくとも5年
  answer: B
  explanation: マニュアルには、スクールバスの運転手は18歳以上であり、「少なくとも6ヶ月の運転経験があること」と記載されています。
- id: 35
  category: license_system
  question: ノースカロライナ州でレベル1限定学習許可証（Level One Limited Learner Permit）を申請できる最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: B
  explanation: レベル1限定学習許可証を申請するには、マニュアルに「15歳以上18歳未満である必要があります」と記載されています。
- id: 36
  category: license_system
  question: レベル1限定学習許可証を取得してからの最初の6ヶ月間、監督ドライバーと同乗して運転が許可される時間帯はいつですか？
  choices:
    A: 午前6時から午後8時まで
    B: 午前5時から午後9時まで
    C: 午前7時から午後7時まで
    D: 昼夜を問わずいつでも
  answer: B
  explanation: 最初の6ヶ月間、レベル1許可証では「監督ドライバーが同乗している間、午前5時から午後9時までの間」の運転が許可されます。
- id: 37
  category: license_system
  question: 監督ドライバーは、少なくとも何年間免許を保有している必要がありますか？
  choices:
    A: 少なくとも1年間
    B: 少なくとも3年間
    C: 少なくとも5年間
    D: 少なくとも10年間
  answer: C
  explanation: マニュアルには、監督ドライバーは「有効な運転免許を保持しており、少なくとも5年間免許を保有している必要があります」と記載されています。
- id: 38
  category: license_system
  question: 限定仮免許（Limited Provisional License）を申請する前に、運転記録簿（Driving Log）に詳細を記載する必要がある合計運転時間は何時間ですか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: D
  explanation: レベル1限定学習許可証の場合、「最低60時間の運転」の詳細を記載するための運転記録簿（Driving Log）が渡されます。
- id: 39
  category: safe_driving_rules
  question: レベル1限定学習許可証の下で、自動車の運転中に携帯電話の使用が許可されるのはどのような場合ですか？
  choices:
    A: ハンズフリー機器を使用しているとき
    B: 赤信号で停止しているとき
    C: 緊急事態に関する電話をかけるときのみ
    D: 監督ドライバーと連絡を取るとき
  answer: C
  explanation: 自動車の運転中に携帯電話を使用することは許可されていませんが、「緊急事態に関して電話をかける場合」という例外があります。
- id: 40
  category: license_system
  question: レベル2限定仮免許（Level Two Limited Provisional License）の最低年齢要件は何歳ですか？
  choices:
    A: 15歳
    B: 16歳
    C: 17歳
    D: 18歳
  answer: B
  explanation: レベル2限定仮免許について、マニュアルには「ドライバーは16歳以上18歳未満である必要があります」と記載されています。
- id: 41
  category: license_system
  question: レベル2限定仮免許（Level Two Limited Provisional License）を保持する運転者が、同乗者なしでいつでも運転できるのは、以下のどこへ直接向かう、またはどこから直接帰宅する場合ですか？
  choices:
    A: 学校が主催するスポーツイベント
    B: 職場、またはボランティアの消防・救助・救急サービス（EMS）の活動場所
    C: 家族の家
    D: 運転教育コース
  answer: B
  explanation: レベル2の運転者は、午前5時から午後9時までの間、および「仕事、またはボランティアの消防・救助・救急サービスの活動場所へ直接向かう、またはそこから直接帰宅する場合」は、いつでも同乗者なしで運転することができます。
- id: 42
  category: license_system
  question: レベル2限定仮免許で同乗者なしで運転する場合、運転者の同居家族ではない21歳未満の同乗者に関する制限はどうなっていますか？
  choices:
    A: 21歳未満の同乗者を乗せることはできない
    B: そのような同乗者は1名に限られる
    C: そのような同乗者は2名まで認められる
    D: 同乗者の人数に制限はない
  answer: B
  explanation: マニュアルには、「同乗者なしで運転する場合、運転者と同じ世帯の家族ではない21歳未満の同乗者は1名まで認められる」と記載されています。
- id: 43
  category: license_system
  question: レベル1限定学習許可証（Level One Limited Learner Permit）を保持する者が運転する車両の助手席に座ることが許されているのは誰ですか？
  choices:
    A: 運転者と指導運転者（supervising driver）のみ
    B: 運転者と18歳以上の同乗者
    C: 運転者と最大2名までの同乗者
    D: シートベルトを着用していれば誰でもよい
  answer: A
  explanation: レベル1許可証について、マニュアルには「運転者と指導運転者以外は、助手席（前部座席）に座ることはできない」と明記されています。
- id: 44
  category: license_system
  question: ノースカロライナ州法に基づき、免許局（Division）が「P（旅客）」または「S（スクールバス）」のエンドースメント（資格）付きの商用運転免許証を発行してはならない対象者は誰ですか？
  choices:
    A: 運転経験が1年未満の者
    B: 性犯罪者および公衆保護登録プログラムへの登録が義務付けられている者
    C: 過去6ヶ月以内に交通違反（moving violation）を犯した者
    D: 21歳未満の者
  answer: B
  explanation: マニュアルには、「免許局は、性犯罪者および公衆保護登録プログラムへの登録が義務付けられている者に対し、『P』または『S』のエンドースメントを反映した商用運転免許証の発行または更新を行ってはならない」と記されています。
- id: 45
  category: license_system
  question: 指導運転者（supervising driver）の要件は何ですか？
  choices:
    A: 21歳以上であり、違反歴がないこと
    B: 有効な運転免許証を保持しており、免許取得後少なくとも5年が経過していること
    C: 18歳以上の兄弟姉妹であること
    D: 商用運転免許証（CDL）を保持していること
  answer: B
  explanation: 指導運転者は、有効な運転免許証を保持しており、かつ免許取得後少なくとも5年が経過している必要があります。
- id: 46
  category: penalties_and_points
  question: 微量のアルコールまたは薬物を摂取した後に運転し、有罪判決を受けた仮免許保持者（18歳未満）に対する罰則は何ですか？
  choices:
    A: 30日間の免許停止
    B: 500ドルの罰金
    C: 1年間の免許取り消し
    D: 義務的な社会奉仕活動
  answer: C
  explanation: 仮免許保持者が微量のアルコールまたは薬物を摂取した後、あるいは摂取しながら自動車を運転することは違法であり、このような違反で有罪判決を受けると、1年間の免許取り消しとなります。
- id: 47
  category: driver_testing
  question: 18歳未満の運転者が認定運転教育コースで義務付けられている、学科講習と実技講習（路上練習）の時間はそれぞれ何時間ですか？
  choices:
    A: 学科20時間、実技4時間
    B: 学科30時間、実技6時間
    C: 学科40時間、実技10時間
    D: 学科50時間、実技12時間
  answer: B
  explanation: 18歳未満の運転者は、少なくとも30時間の学科講習と6時間の実技講習からなる認定運転教育コースを修了したことを示す証明書を提示しなければなりません。
- id: 48
  category: license_system
  question: 18歳未満の者が「運転資格証明書（Driving Eligibility Certificate）」の資格を失ったという通知をDMVが受け取った場合、どうなりますか？
  choices:
    A: 困窮時運転許可証（hardship driving permit）が発行される
    B: 18歳の誕生日を迎えるか、証明書または卒業証書を取得するまで運転免許が取り消される
    C: 免許再発行手数料を支払わなければならない
    D: 職場への往復のみの運転に制限される
  answer: B
  explanation: DMVは、18歳未満の者が運転資格証明書の要件を満たさなくなったという通知を受けた場合、その者の運転免許を取り消さなければなりません。この取り消しは、その者が18歳になるまで有効ですが、運転資格証明書、高校卒業証書、またはGED（高卒認定）を取得した場合はその時点で解除されます。
- id: 49
  category: safe_driving_rules
  question: 仮免許保持者が自動車の運転中に携帯電話を使用することが許可されるのは、どのような状況ですか？
  choices:
    A: ハンズフリー機器を使用している場合
    B: 赤信号で停車している場合
    C: 緊急事態について緊急通報オペレーターに電話をかける場合
    D: GPSアプリから経路案内を受ける場合
  answer: C
  explanation: 仮免許保持者は、緊急通報オペレーター、病院、消防署、警察、親、法的保護者、または配偶者に対して緊急事態の連絡をする場合を除き、携帯電話の使用は禁止されています。
- id: 50
  category: license_system
  question: ノースカロライナ州では、18歳未満の個人に対して困窮時運転許可証（hardship driving permit）や免許を発行していますか？
  choices:
    A: はい、職場への往復のみを目的とする場合に発行される
    B: はい、学校管理者の承認がある場合に発行される
    C: いいえ、ノースカロライナ州では困窮時運転許可証や免許は発行していない
    D: はい、ただし医療上の緊急事態に限られる
  answer: C
  explanation: マニュアルには、「ノースカロライナ州では、困窮時運転許可証（hardship driving permit）や免許は発行していない」と明記されています。
- id: 51
  category: penalties_and_points
  question: 生徒が10日以上連続で停学処分を受けた場合、免許の喪失期間はどのくらい継続しますか？
  choices:
    A: 30日
    B: 6ヶ月
    C: 12ヶ月間、または運転資格証明書（Driving Eligibility Certificate）を取得するまで
    D: 生徒が21歳になるまで
  answer: C
  explanation: 10日以上連続の停学による免許の喪失は、12ヶ月間、または運転資格証明書（Driving Eligibility Certificate）を取得するまで継続します。
- id: 52
  category: license_system
  question: レベル3フル暫定免許（Level Three Full Provisional License）に昇格する前の6ヶ月間に満たさなければならない運転記録の要件は何ですか？
  choices:
    A: 走行中の違反が2回以内であること
    B: 自動車の走行中の違反、シートベルトまたは携帯電話の違反による有罪判決がないこと
    C: 高度な防衛運転講習を修了していること
    D: 駐車違反がゼロであること
  answer: B
  explanation: レベル3に昇格する前には、過去6ヶ月間に自動車の走行中の違反、シートベルトまたは携帯電話の違反による有罪判決がないことが条件となります。
- id: 53
  category: license_system
  question: 制限付き運転免許の制限範囲外で運転した場合の法的結果は何ですか？
  choices:
    A: 警告票が交付される
    B: 無免許運転とみなされる
    C: 車両が直ちに押収される
    D: 筆記試験を再受験しなければならない
  answer: B
  explanation: 免許に制限がある場合、その制限の範囲内でのみ運転しなければなりません。そうでない場合は、無免許運転とみなされます。
- id: 54
  category: license_system
  question: ノースカロライナ州で初めて運転免許を申請する際、以下のうちどれが必要ですか？
  choices:
    A: 車両賠償責任保険の証明
    B: 有権者登録証
    C: 雇用主からの推薦状
    D: 医療記録の認証コピー
  answer: A
  explanation: 運転免許を申請する際には、車両賠償責任保険の証明を提示する必要があります。
- id: 55
  category: license_system
  question: 2025年5月7日以降、「連邦識別用ではない（Not for Federal Identification）」という表記のある運転免許証は、所持者にとってどのような意味を持ちますか？
  choices:
    A: 州間高速道路を走行できない
    B: 民間航空機への搭乗や連邦施設への立ち入りに、追加の書類が必要になる
    C: 免許をアップグレードするまで停止される
    D: ノースカロライナ州内での運転のみに制限される
  answer: B
  explanation: 2025年5月7日以降、「連邦識別用ではない（Not for Federal Identification）」という表記のある運転免許証は、民間航空機への搭乗や連邦施設への立ち入りに際して、追加の書類を提示する必要があることを意味します。
- id: 56
  category: license_system
  question: 身分および生年月日の証明として出生証明書を使用する場合、以下のうち認められないものはどれですか？
  choices:
    A: 州人口動態統計局に提出された認証コピー
    B: ラミネート加工されたコピーまたはプラスチック製の複製
    C: 出生地の州の同等の機関が発行した認証コピー
    D: 発行機関によって認証されたフォトコピー（複写）
  answer: B
  explanation: 表1によると、出生証明書については「ラミネート加工されたコピーまたはプラスチック製の複製」は認められていません。
- id: 57
  category: safe_driving_rules
  question: 暫定免許保持者が車両を運転している際、誰がシートベルトを適切に着用する必要がありますか？
  choices:
    A: 運転者と助手席の乗員のみ
    B: 18歳未満の乗員のみ
    C: 車両に乗車している全員
    D: 運転者のみ
  answer: C
  explanation: マニュアルには、暫定免許保持者について「車両の走行中、乗車している全員がシートベルトを適切に着用しなければならない」と記載されています。
- id: 58
  category: license_system
  question: レベル1およびレベル2の制限のうち、レベル3フル暫定免許（Full Provisional License）に適用されないものはどれですか？
  choices:
    A: シートベルトの要件
    B: 運転時間、監督、および乗員制限
    C: 酒気帯び運転の禁止
    D: 保険証明の携帯義務
  answer: B
  explanation: 運転時間、監督、および乗員制限に関するレベル1およびレベル2の制限は、フル暫定免許（Full Provisional License）には適用されません。
- id: 59
  category: license_system
  question: 他州の運転免許証を身分証明として使用する場合、有効期限が切れてから最大でどのくらいの期間まで認められますか？
  choices:
    A: 期限切れは一切認められない
    B: 1年未満
    C: 2年未満
    D: 5年未満
  answer: C
  explanation: 表1には、運転免許証、学習許可証、または身分証明書は、有効であるか、期限切れから2年未満である必要があると記載されています。
- id: 60
  category: license_system
  question: 運転免許取得のために社会保障カードを提示する際、以下のうち正しいものはどれですか？
  choices:
    A: 公証されていればフォトコピー（複写）も認められる。
    B: ラミネート加工されたカードも認められる。
    C: フォトコピーおよびラミネート加工されたカードはどちらも認められない。
    D: カードのデジタル画像が認められる。
  answer: C
  explanation: 社会保障番号の要件に関する表2によると、社会保障カードを提示する場合、「フォトコピーおよびラミネート加工されたカードは不可」とされています。
- id: 61
  category: license_system
  question: なぜMedicaid（メディケイド）やMedicare（メディケア）のカードは、社会保障番号（SSN）の証明書類として認められなくなったのですか？
  choices:
    A: 偽造が容易であるため。
    B: 2019年にカードから社会保障番号が削除されたため。
    C: 申請者の法的氏名が記載されていないため。
    D: 連邦法により、州の身分証明への使用が禁止されているため。
  answer: B
  explanation: マニュアルによると、Medicaid/Medicareカードには社会保障番号が印刷されなくなりました。2019年に利用者に新しい識別番号が記載された新カードが発行された際、番号が削除されました。
- id: 62
  category: license_system
  question: 近代化法（Modernization Act）に基づき、成人がRID（REAL ID）を取得するために必要なノースカロライナ州の居住証明は何通ですか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: A
  explanation: 表3によると、近代化法により、RIDの取得に必要なノースカロライナ州の居住証明は1通のみとなっています。
- id: 63
  category: license_system
  question: 18歳未満の未成年者がノースカロライナ州の居住を証明するために使用できる書類は、次のうちどれですか？
  choices:
    A: デジタル形式の保険証明
    B: 雑誌の定期購読
    C: ラミネート加工された社会保障カード
    D: 2020年に発行されたMedicaidカード
  answer: B
  explanation: 表4では、18歳未満の未成年者の居住証明として認められる書類として「雑誌の定期購読」が挙げられています。
- id: 64
  category: license_system
  question: 運転免許証を取得するために賠償責任保険（Liability Insurance）の加入証明を提示する際、認められない形式はどれですか？
  choices:
    A: 保険代理店発行のDL-123フォーム
    B: 仮保険証書（バインダー）
    C: 印刷された自動車保険証券
    D: モバイルデバイス上のデジタル保険証明
  answer: D
  explanation: マニュアルには、デジタル形式の保険証明は認められず、モバイルデバイス上の画像も賠償責任保険の証明としては受理されないと明記されています。
- id: 65
  category: license_system
  question: 法的盲目の申請者が無料で身分証明書（No Fee ID）を取得するために提示しなければならない追加書類は何ですか？
  choices:
    A: かかりつけ医からの手紙
    B: 医師（Physician）からの手紙
    C: ホームレスシェルターからの手紙
    D: 有効な期限内の米国軍人ID
  answer: B
  explanation: 表8によると、無料IDを取得するために、法的盲目の申請者は医師からの手紙を提示する必要があります。
- id: 66
  category: license_system
  question: 追加書類なしで無料IDカード（No Fee ID）を受け取ることができる申請者の年齢は何歳からですか？
  choices:
    A: 60歳以上
    B: 65歳以上
    C: 70歳以上
    D: 75歳以上
  answer: C
  explanation: 表8は、70歳以上の申請者は追加書類なしで無料IDを取得できることを示しています。
- id: 67
  category: license_system
  question: 印刷された自動車賠償責任保険の加入証明を提示する必要があるのは、次のうちどの申請者ですか？
  choices:
    A: 期限内のノースカロライナ州運転免許証を更新する人
    B: 他州からの転入を含む、新規免許を申請する人
    C: 無料IDカードを申請する人
    D: 有権者登録を更新する人
  answer: B
  explanation: 賠償責任保険の加入証明は、他州からの転入を含む新規免許の申請者に義務付けられています。
- id: 68
  category: license_system
