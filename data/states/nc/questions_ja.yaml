- id: 139
  category: alcohol_drugs_health
  question: 全交通事故死者数のうち、アルコールが関与している割合は約何パーセントですか？
  choices:
    A: 15パーセント
    B: 25パーセント
    C: 38パーセント
    D: 50パーセント
  answer: C
  explanation: マニュアルによると、全交通事故死者数の約38パーセントにアルコールが関与しています。
- id: 140
  category: alcohol_drugs_health
  question: アルコールは抑制剤（デプレッサント）ですが、運転行動にどのような影響を与えますか？
  choices:
    A: 距離を判断する能力を鋭くする
    B: 脳の機能と反応時間を速める
    C: 誤った自信を与え、より大きなリスクを冒させる可能性がある
    D: 一度に複数のことを行うのを容易にする
  answer: C
  explanation: アルコールは抑制剤であり、誤った自信を与えます。そのため、自分の運転が実際よりも優れていると思い込み、より大きなリスクを冒す可能性があります。
- id: 141
  category: alcohol_drugs_health
  question: 飲酒後に酔いを覚ますための唯一の効果的な方法は何ですか？
  choices:
    A: 濃いコーヒーを飲む
    B: 冷たいシャワーを浴びる
    C: たくさん食べる
    D: 時間が経過するのを待つ
  answer: D
  explanation: マニュアルには、「飲酒者の酔いを覚ます唯一のものは時間です。コーヒー、大量の食事、または冷たいシャワーは効果がありません」と明記されています。
- id: 142
  category: safe_driving_rules
  question: シートベルトとエアバッグに関する記述のうち、正しいものはどれですか？
  choices:
    A: 車両にフロントエアバッグが装備されている場合、シートベルトの着用は任意である
    B: 車両にエアバッグが装備されている場合、運転者のみがシートベルトを着用しなければならない
    C: 車両にエアバッグが装備されていても、すべての乗員がシートベルトを着用しなければならない
    D: フロントエアバッグがある場合、後部座席の乗員はシートベルトを着用する必要はない
  answer: C
  explanation: シートベルト法に基づき、車両にエアバッグが装備されている場合でも、すべての乗員がシートベルトを着用しなければなりません。
- id: 143
  category: safe_driving_rules
  question: ノースカロライナ州のシートベルト法における免除規定に該当するのは、次のうちどれですか？
  choices:
    A: 頻繁に配達のために停車し、停車間の速度が時速20マイル（mph）を超えない運転者
    B: 乗用車の後部座席に乗っている乗員
    C: 2010年以降に製造された車両を運転する運転者
    D: 自宅から5マイル未満の距離を走行している運転者
  answer: A
  explanation: シートベルト法の免除対象には、頻繁に停車して降車したり荷物を配達したりする運転者または乗員で、停車間の車両速度が時速20マイルを超えない場合が含まれます。
- id: 144
  category: driver_responsibility
  question: 幼い子供の命に対する最大の脅威は何ですか？
  choices:
    A: 家庭内の毒物
    B: 自動車事故
    C: 溺死
    D: 火災
  answer: B
  explanation: マニュアルには、幼い子供の命に対する最大の脅威は自動車事故であると記載されています。
- id: 145
  category: safe_driving_rules
  question: 子供が体重に適したチャイルドシート（乳幼児用補助乗車装置）で適切に固定されなければならないのは、何歳未満かつ何ポンド未満の場合ですか？
  choices:
    A: 6歳未満かつ60ポンド未満
    B: 7歳未満かつ70ポンド未満
    C: 8歳未満かつ80ポンド未満
    D: 9歳未満かつ90ポンド未満
  answer: C
  explanation: 8歳未満かつ体重80ポンド未満の子供は、体重に適したチャイルドシートで適切に固定されなければなりません。
- id: 146
  category: safe_driving_rules
  question: 作動可能な助手席エアバッグと後部座席がある車両において、5歳未満かつ体重40ポンド未満の子供はどこに固定しなければなりませんか？
  choices:
    A: 助手席を一番後ろまで下げた状態の助手席
    B: 後部座席
    C: 腰ベルトのみを使用した助手席
    D: SUVの荷室エリア
  answer: B
  explanation: 作動可能な助手席エアバッグが装備されており、後部座席がある車両の場合、5歳未満かつ体重40ポンド未満の子供は、後部座席に適切に固定されなければなりません（チャイルドシートが助手席エアバッグとの併用を想定して設計されている場合を除きます）。
- id: 147
  category: driver_responsibility
  question: 生涯の運転を通じて、自動車事故で重傷を負ったり死亡したりする確率は、およそどのくらいですか？
  choices:
    A: 2分の1
    B: 3分の1
    C: 5分の1
    D: 10分の1
  answer: B
  explanation: 生涯の運転を通じて、自動車事故で重傷を負ったり死亡したりする確率は、約3分の1にのぼります。
- id: 148
  category: safe_driving_rules
  question: 衝突時、エアバッグはダッシュボードから最高時速何マイルで飛び出しますか？
  choices:
    A: 最高時速50マイル
    B: 最高時速100マイル
    C: 最高時速150マイル
    D: 最高時速200マイル
  answer: D
  explanation: その重要な役割を果たすため、エアバッグは瞬きよりも速い、最高時速200マイルでダッシュボードから飛び出します。
- id: 149
  category: safe_driving_rules
  question: マニュアルによると、何歳以下の子供が後部座席でシートベルトを着用して乗車すべきですか？
  choices:
    A: 8歳以下
    B: 10歳以下
    C: 12歳以下
    D: 15歳以下
  answer: C
  explanation: チャイルドセーフティのポイントとして、12歳以下の子供は後部座席でシートベルトを着用して乗車すべきであるとされています。
- id: 150
  category: vehicle_information
  question: 合法的なオートバイ用ヘルメットの特徴は、次のうちどれですか？
  choices:
    A: 薄くて柔らかいフォームパッド
    B: オートバイ運転者が別途購入して貼り付けたDOTステッカー
    C: 厚さ約1インチのポリスチレンフォーム（発泡スチロール）の厚いインナーライナー
    D: 軽量化のために製造者ラベルがない
  answer: C
  explanation: 合法的なヘルメットには、厚さ約1インチの硬いポリスチレンフォームを含む厚いインナーライナーが備わっています。
- id: 151
  category: safe_driving_rules
  question: ノースカロライナ州の法律では、通常、何歳未満の子供がピックアップトラックの荷台に乗ることを禁止していますか？
  choices:
    A: 12歳
    B: 14歳
    C: 16歳
    D: 18歳
  answer: C
  explanation: ノースカロライナ州の法律では、16歳未満の子供がピックアップトラックの荷台に乗ることを禁止しています。
- id: 152
  category: penalties_and_points
  question: 子供をピックアップトラックの荷台に乗せて輸送することに関する法律に違反した場合の罰則は何ですか？
  choices:
    A: 25ドルの罰金と運転免許の点数
    B: 25ドルの罰金（裁判費用や運転免許の点数はなし）
    C: 100ドルの罰金と保険料の割増
    D: 50ドルの罰金と裁判費用
  answer: B
  explanation: 違反者にはチケットが発行され、25ドルの罰金が科せられます。この法律の違反は「軽微な違反（infractions）」と定義されており、裁判費用、運転免許の点数、または保険料の割増は発生しません。
- id: 153
  category: safe_driving_rules
  question: 子供をピックアップトラックの荷台に乗せることを禁止する法律の例外に当たるのは、次のうちどれですか？
  choices:
    A: 車両が時速25マイル（25 mph）未満で走行している場合
    B: 車両がパレードに参加している場合
    C: 子供がテールゲートに座っている場合
    D: 移動距離が5マイル未満の場合
  answer: B
  explanation: 車両がパレードに参加している場合、子供の適切な固定に関する規定は適用されません。
- id: 154
  category: safe_driving_rules
  question: 駐車中の車内の温度は、外気温と比べて最大で何度高くなる可能性がありますか？
  choices:
    A: 10〜20度
    B: 20〜30度
    C: 40〜50度
    D: 60〜70度
  answer: C
  explanation: 車内の温度は、外気温よりも約40〜50度（華氏）高くなることがあります。
- id: 155
  category: vehicle_information
  question: 雪で排気管（エキゾーストパイプ）が塞がれた場合、車内に逆流する可能性がある、無色・無臭で有毒なガスは何ですか？
  choices:
    A: 二酸化炭素
    B: 窒素酸化物
    C: 硫化水素
    D: 一酸化炭素
  answer: D
  explanation: 冬の間、雪が車の排気管を塞ぐことがあり、暖機運転をすると一酸化炭素が車内に逆流する可能性があります。一酸化炭素は、臭い、味、色がありませんが、有毒な目に見えないガスです。
- id: 156
  category: sharing_the_road
  question: 歩行者が道路にいる間に信号が黄色または赤に変わった場合、運転者はどうしなければなりませんか？
  choices:
    A: クラクションを鳴らして進む
    B: 歩行者を避けて走行する
    C: 歩行者が安全に渡り終えるのを待つ
    D: 歩行者にスペースを空けるためにバックする
  answer: C
  explanation: 歩行者が道路にいる間に信号が黄色または赤に変わった場合、運転者は歩行者が安全に横断を完了できるようにしなければなりません。
- id: 157
  category: sharing_the_road
  question: 信号機のない交差点において、法律は視覚障害のある歩行者に対してどのような特別な配慮を定めていますか？
  choices:
    A: 他の人が同行している場合にのみ優先権がある
    B: 白い杖を差し出しているか、盲導犬を連れている場合に優先権がある
    C: 横断する前に車両が停止してクラクションを鳴らすのを待たなければならない
    D: 優先権を得るために反射材付きの服を着用しなければならない
  answer: B
  explanation: 信号機のない交差点において、歩行者が白い杖（または先端が赤色の白い杖）を差し出しているか、盲導犬を連れている場合、法律は視覚障害のある歩行者に特別な配慮（優先権）を与えています。
- id: 158
  category: defensive_driving
  question: 駐車状態からの右左折、停止、または発進によって歩行者に影響が及ぶ可能性がある場合、法律は運転者に何をすることを義務付けていますか？
  choices:
    A: ヘッドライトを点滅させる
    B: クラクションを鳴らす
    C: 窓を開けて叫ぶ
    D: ハザードランプを点灯させる
  answer: B
  explanation: 法律は、駐車状態からの右左折、停止、または発進によって歩行者に影響が及ぶ可能性がある場合、運転者がクラクションを使用することを義務付けています。
- id: 159
  category: safe_driving_rules
  question: ノースカロライナ州におけるスクールバスの最高速度制限はいくらですか？
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: スクールバスの最高速度制限は時速45マイル（45 mph）です。
- id: 160
  category: sharing_the_road
  question: 2車線の道路でスクールバスが乗客のために停車した場合、誰が停止しなければなりませんか？
  choices:
    A: バスに続く車両のみ
    B: 反対方向からバスに近づく車両のみ
    C: 両方向からのすべての車両
    D: 時速35マイル（35 mph）以上で走行している車両
  answer: C
  explanation: 2車線の道路では、スクールバスが乗客のために停車した際、両方向からのすべての車両が停止しなければなりません。
- id: 161
  category: safe_driving_rules
  question: 大人用シートベルトの腰ベルト（ラップベルト）はどのように着用すべきですか？
  choices:
    A: 腹部をしっかり締めるように
    B: 腹部の下、腰の低い位置に
    C: 太ももの上に緩めに
    D: 肋骨の上に
  answer: B
  explanation: 腰ベルトは腹部の下、腰の低い位置に着用する必要があります。
- id: 162
  category: sharing_the_road
  question: 中央分離帯のない4車線道路で、スクールバスが乗客のために停車した場合、車両はどうしなければなりませんか？
  choices:
    A: バスに続く車両のみが停止しなければならない。
    B: 両方向からのすべての車両が停止しなければならない。
    C: 対向車線の車両は時速15マイル（15 mph）まで減速しなければならない。
    D: 隣接する車線の車両は譲らなければならない。
  answer: B
  explanation: マニュアルによると、中央分離帯のない4車線道路でスクールバスが乗客のために停車した場合、両方向からのすべての車両が停止しなければなりません。
- id: 163
  category: sharing_the_road
  question: 中央右左折車線がある4車線以上の道路で、スクールバスが乗客のために停車した場合、どの車両が停止しなければなりませんか？
  choices:
    A: 両方向からのすべての車両。
    B: 対向車線を走行している車両のみ。
    C: バスに続く車両のみ。
    D: バスが右側車線にいる場合、停止する必要のある車両はない。
  answer: C
  explanation: マニュアルには、中央右左折車線がある4車線以上の道路では、スクールバスが乗客のために停車した際、バスに続く車両のみが停止しなければならないと記載されています。
- id: 164
  category: safe_driving_rules
  question: 事故の調査や救護のために停車している緊急車両から、どのくらい離して駐車しなければなりませんか？
  choices:
    A: 少なくとも50フィート。
    B: 少なくとも100フィート。
    C: 少なくとも200フィート。
    D: 少なくとも500フィート。
  answer: B
  explanation: マニュアルには「事故の調査や救護のために停車している緊急車両の100フィート以内に駐車してはならない」と明記されています。
- id: 165
  category: safe_driving_rules
  question: 火災報知に対応中の消防車の近くを走行または駐車する場合、維持しなければならない最小距離はどれくらいですか？
  choices:
    A: 100フィート。
    B: 500フィート。
    C: 1ブロック。
    D: 2ブロック。
  answer: C
  explanation: ドライバーズマニュアルによると、運転者は「火災報知に対応中の消防車から1ブロック以上離れて走行または駐車しなければならない」とされています。
- id: 166
  category: sharing_the_road
  question: 接近してくる緊急車両に対して、優先権を譲る必要が「ない」のはどのような場合ですか？
  choices:
    A: 2車線道路で対向方向を走行しているとき。
    B: 中央分離帯のある4車線のアクセス制限道路（高速道路など）で対向方向を走行しているとき。
    C: 分離帯のある道路で同じ方向を走行しているとき。
    D: 商用車を運転しているとき。
  answer: B
  explanation: 接近する緊急車両に道を譲る義務は、中央分離帯のある4車線のアクセス制限道路で対向方向を走行している車両には適用されません。
- id: 167
  category: safe_driving_rules
  question: 同一方向に2車線以上ある道路で、警告灯を点灯させて停車している緊急車両に近づく場合、どうしなければなりませんか？
  choices:
    A: 緊急車両がライトを消すまで完全に停止する。
    B: その車両に最も近い車線以外の車線に移動し、安全に通り過ぎるまで走行を続ける。
    C: 緊急作業員に知らせるためにクラクションを鳴らし、速度を維持する。
    D: 右側の路肩に寄せて停車し、指示を待つ。
  answer: B
  explanation: 同一方向に2車線以上ある道路では、停車中の緊急車両に最も近い車線以外の車線に車両を移動させ、安全に通り過ぎるまで走行を続けなければなりません。
- id: 168
  category: safe_driving_rules
  question: 警察官から車を寄せるよう合図されたが、すぐに停車できる明らかな安全な場所がない場合、どうすべきですか？
  choices:
    A: 最寄りの出口に早く着くように加速する。
    B: 走行車線内に直ちに停車する。
    C: 4方向フラッシャー（ハザードランプ）を点け、速度を約10マイル（10 mph）落として警察官に合図を送り、安全な場所まで進む。
    D: ヘッドライトを消して芝生の上に停車する。
  answer: C
  explanation: 安全に停車できる場所がない場合は、非常用4方向フラッシャー（ハザードランプ）を点灯させ、速度を約10マイル（10 mph）落として警察官に意思を示し、最寄りの安全な場所まで走行を続けてください。
- id: 169
  category: defensive_driving
  question: 覆面パトカーに止められ、それが本物の警察官であるかどうか正当な懸念がある場合、推奨される行動は何ですか？
  choices:
    A: 停車を拒否して自宅まで運転する。
    B: 車を寄せる前に9-1-1に電話し、警察官を確認する。
    C: 車を寄せるが、窓を開けるのを拒否する。
    D: 最寄りの警察署まで加速して向かう。
  answer: B
  explanation: 覆面パトカーに止められ、正当な懸念がある場合は、車を寄せる前に9-1-1に電話して、実際に警察官が取り締まりを行っているか確認することができます。
- id: 170
  category: safe_driving_rules
  question: 夜間に警察官に止められた場合、視認性を助けるために何をすべきですか？
  choices:
    A: ヘッドライトをハイビームにする。
    B: 停車したらすぐに車内灯を点ける。
    C: 窓から懐中電灯を外に向かって照らす。
    D: 車両のすべてのライトを消す。
  answer: B
  explanation: 夜間の場合は、警察官が車内を確認しやすくするために、停車後すぐに車内灯を点灯させる必要があります。
- id: 171
  category: driver_responsibility
  question: 隠匿携帯許可証（concealed weapon permit）を持っており、交通検問中に車内に武器がある場合、どうしなければなりませんか？
  choices:
    A: 座席の下に武器を隠す。
    B: すぐに警察官に武器を手渡す。
    C: その事実を警察官に伝える。
    D: 警察官が近づく前にグローブボックスに武器を入れる。
  answer: C
  explanation: あなたまたは同乗者が隠匿携帯許可証を持っており、車内に武器がある場合は、その事実を警察官に伝えなければなりません。
- id: 172
  category: penalties_and_points
  question: 交通違反切符への承諾と署名は、何を示していますか？
  choices:
    A: 罪を認めたことになる。
    B: 法廷審問を受ける権利を放棄することになる。
    C: 罪を認めたことにはならない。
    D: 警察官の判断に同意することを意味する。
  answer: C
  explanation: マニュアルには、交通違反切符への承諾と署名は、罪を認めたことにはならないと明記されています。
- id: 173
  category: penalties_and_points
  question: ノースカロライナ州法によると、交通検問中に法執行官に対して抵抗、遅延、または妨害を行うことは、次のように分類されます：
  choices:
    A: 第1級重罪（Class 1 felony）。
    B: 第2級軽罪（Class 2 misdemeanor）。
    C: 交通違反（Traffic infraction）。
    D: 警告対象の違反。
  answer: B
  explanation: 交通検問中に法執行官に対して抵抗、遅延、または妨害を行うことは、第2級軽罪（N.C.G.S. §14-223）となります。
- id: 174
  category: sharing_the_road
  question: 農耕用機器が関与する事故の多くは、どのような条件下で発生しますか？
  choices:
    A: 未舗装路での激しい雨や雪の時。
    B: 照明の少ない田舎道の夜間。
    C: 晴れた日の日中、乾燥した舗装路面。
    D: 砂利道での霧の出た朝。
  answer: C
  explanation: 農耕用機器が関与する事故の多くは、晴れた日の日中、および/または乾燥した舗装路面で発生します。
- id: 175
  category: sharing_the_road
  question: 農耕用機器との事故で典型的な種類は何ですか？
  choices:
    A: 正面衝突と追突事故。
    B: 側面接触（sideswipes）と斜め衝突（angle crashes）。
    C: 横転事故と単独事故。
    D: 後退時の事故と駐車場での衝突。
  answer: B
  explanation: 農耕用機器との典型的な事故には、側面接触や斜め衝突が含まれます。これらは機器が左折している際によく発生します。
- id: 176
  category: safe_driving_rules
  question: 交通検問中、後部座席の同乗者はどこに手を置くべきですか？
  choices:
    A: ポケットの中。
    B: 車の天井。
    C: 前部座席の背もたれ。
    D: 窓の外。
  answer: C
  explanation: 交通検問中、後部座席の同乗者は、警察官からはっきりと見えるように、前部座席の背もたれの上に手を置く必要があります。
- id: 177
  category: sharing_the_road
  question: ノースカロライナ州において、農耕用機器の走行が法律で禁止されている道路の種類はどれですか？
  choices:
    A: 郊外の道路
    B: 州間高速道路（Interstates）
    C: 2車線の田舎の幹線道路
    D: 未舗装の公道
  answer: B
  explanation: マニュアルによると、農耕用機器は州間高速道路を除き、ノースカロライナ州のほとんどの道路を走行する法的権利があります。
- id: 178
  category: vehicle_information
  question: 道路を走行する農耕用機器にはどのような照明が必要ですか？
  choices:
    A: 1000フィート先から見える前方の白色灯2個と後方の赤色灯2個
    B: 最大500フィート先から見える前方の白色灯1個と後方の赤色灯1個
    C: 屋根の黄色い点滅灯
    D: 常に後方の赤色反射板のみが必要
  answer: B
  explanation: 農耕用機器には、最大500フィート先から見える前方の白色灯1個と後方の赤色灯1個（または直径4インチ以上の赤色反射板2個）が必要です。
- id: 179
  category: sharing_the_road
  question: 葬列（funeral procession）に加わっているすべての車両は何を点灯させなければなりませんか？
  choices:
    A: ハイビームのヘッドライトのみ
    B: ヘッドライトと非常点滅表示灯（ハザードランプ）
    C: 車内灯
    D: 左折信号（ウィンカー）
  answer: B
  explanation: 葬列に加わっているすべての車両はヘッドライトを点灯させなければならず、装備されている場合は非常点滅表示灯（ハザードランプ）も点灯させなければなりません。
- id: 180
  category: sharing_the_road
  question: 同じ方向に走行している運転者が葬列を追い越すことが合法となるのはどのような時ですか？
  choices:
    A: 葬列が時速20マイル（20 mph）未満で走行している時
    B: 道路に同じ方向へ進む車線が2車線以上ある時
    C: 追い越す前にクラクションを鳴らした時
    D: 葬列を追い越すことはいかなる場合も違法である
  answer: B
  explanation: 同じ方向に走行している車両の運転者は、道路に同じ方向へ進む車線が2車線以上ある場合を除き、葬列を追い越してはなりません。
- id: 181
  category: safe_driving_rules
  question: 複数車線の高速道路で、掲示されている制限速度よりも遅く走行する場合、どこを走行すべきですか？
  choices:
    A: 一番左の車線
    B: 中央車線
    C: 一番右の車線
    D: 右車線と中央車線にまたがって
  answer: C
  explanation: 複数車線の道路で制限速度より遅く走行する場合は、追い越し、左折、または障害物を避ける場合を除き、一番右の車線を走行してください。
- id: 182
  category: safe_driving_rules
  question: 理想的な条件下で、時速55マイルで走行している車両が完全に停止するまでに約何フィート必要ですか？
  choices:
    A: 100フィート
    B: 150フィート
    C: 211フィート
    D: 300フィート
  answer: C
  explanation: 理想的な条件下であっても、時速55マイルで走行している場合、車両が完全に停止するには約211フィート必要です。
- id: 183
  category: safe_driving_rules
  question: 特に標識がない限り、市街地や町中での最高速度制限は何マイルですか？
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: 特に標識がない限り、市街地や町中での速度制限は時速35マイル（35 mph）です。
- id: 184
  category: defensive_driving
  question: カーブに近づく際のブレーキ操作として、最善の方法は何ですか？
  choices:
    A: カーブの途中で強くブレーキをかける
    B: カーブ内でのブレーキを避けるため、進入前に減速する
    C: カーブに向けて加速し、抜ける時にブレーキをかける
    D: カーブの間ずっとポンピングブレーキを繰り返す
  answer: B
  explanation: カーブに対処する最善の方法は、カーブ内でブレーキをかける必要がないように、進入前に減速することです。
- id: 185
  category: defensive_driving
  question: 下り坂を走行中にカーブに差し掛かった場合、どうすべきですか？
  choices:
    A: 下り坂に入る前に高いギアにシフトする
    B: ニュートラルに入れて惰性でカーブを曲がる
    C: 下り坂に入る前に低いギアにシフトする
    D: 燃料を節約するためにエンジンを切る
  answer: C
  explanation: 下り坂でカーブに差し掛かる場合は、下り坂に入る前に低いギアにシフトし、早めにブレーキをかけ始める必要があります。
- id: 186
  category: safe_driving_rules
  question: 「2秒ルール」は何を決定するために使用されますか？
  choices:
    A: 一時停止標識で待機しなければならない時間
    B: 自車と前走車との間の安全な車間距離
    C: 車線変更の前にウィンカーを出しておく時間
    D: 道路から目を離してもよい最大時間
  answer: B
  explanation: 「2秒ルール」とは、前走車がある地点を通過してから自車が同じ地点に到達するまでに2秒間の余裕を持たせることで、安全な車間距離を確保するものです。
- id: 187
  category: defensive_driving
  question: 車線変更の前に肩越しに目視確認することが重要なのはなぜですか？
  choices:
    A: 警察車両が追尾していないか確認するため
    B: バックミラーが正しく調整されているか確認するため
    C: 死角に車両がいないことを確実にするため
    D: 後続車の速度を確認するため
  answer: C
  explanation: 車線変更に関する重要なルールには、死角に車両がいないことを確実にするために肩越しに目視確認することが含まれます。
- id: 188
  category: safe_driving_rules
  question: マニュアルによると、他車を追い越す前にクラクションを鳴らす目的は何ですか？
  choices:
    A: 対向車に道を譲るよう警告するため
    B: 前方のドライバーに追い越しを助ける法的義務を負わせるため
    C: 歩行者に道路を空けるよう合図するため
    D: 制限速度を超えて走行していることを示すため
  answer: B
  explanation: マニュアルには、前方のドライバーに合図するためにクラクションを鳴らすよう記載されています。この合図により、追い越される車両のドライバーには追い越しを助ける法的義務が生じます。
- id: 189
  category: safe_driving_rules
  question: 右折する際、道路の右端に寄るべきなのはなぜですか？
  choices:
    A: 速い車が左側を追い越せるようにするため
    B: 自車と縁石の間に他の車両が入り込むのを防ぐため
    C: 対向車をよりよく見えるようにするため
    D: 信号機のセンサーが反応しなくなるのを防ぐため
  answer: B
  explanation: 右折の際は、自車と縁石の間に他の車両が入り込めないように、道路の右端に寄って走行してください。
- id: 190
  category: safe_driving_rules
  question: 追い越す車両の左側に維持しなければならない最小距離はどれくらいですか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 4フィート
  answer: B
  explanation: 法律では、追い越しを行うドライバーは、追い越される車両の左側を少なくとも2フィート離れて通過することが義務付けられています。
- id: 191
  category: safe_driving_rules
  question: カーブや坂道で他車を追い越すことが違法となるのはどのような場合ですか？
  choices:
    A: 前方が少なくとも500フィート先まで見通せない場合
    B: 前方が少なくとも200フィート先まで見通せない場合
    C: 前方が少なくとも100フィート先まで見通せない場合
    D: 前方が少なくとも300フィート先まで見通せない場合
  answer: A
  explanation: 追い越しは常に危険であり、通常、ドライバーが前方を少なくとも500フィート先まで見通すことができないカーブや坂道では違法となります。
- id: 192
  category: safe_driving_rules
  question: 次の状況のうち、右側からの追い越しが許可されるのはどれですか？
  choices:
    A: 黄色の実線がある2車線道路
    B: 左折車線にいる車両を追い越すとき
    C: 田舎のあらゆる交差点
    D: 前方の車両が非常に低速で走行しているとき
  answer: B
  explanation: 右側からの追い越しが許可される例外には、左折車線にいる車両を追い越す場合などが含まれます。
- id: 193
  category: penalties_and_points
  question: 追い越そうとしている車両に対して速度を上げ、道を譲らなかった結果、人身傷害や物損を伴う衝突事故が発生した場合の罰則は何ですか？
  choices:
    A: 書面による警告
    B: 重罪（felony）の起訴
    C: 軽罪（misdemeanor）の起訴
    D: 即時の免許取消
  answer: C
  explanation: 速度を上げて追い越し車両に道を譲らず、人身傷害や物損を伴う衝突事故が発生した場合、軽罪（misdemeanor）に問われます。
- id: 194
  category: safe_driving_rules
  question: 車両を後退（バック）させる際の最大速度はどれくらいにすべきですか？
  choices:
    A: 時速5マイル
    B: 時速10マイル
    C: 時速15マイル
    D: 時速20マイル
  answer: B
  explanation: 車両を後退させるときは、車両の制御や停止が難しくなるため、時速10マイルを超えないよう、非常にゆっくりと後退させる必要があります。
- id: 195
  category: safe_driving_rules
  question: 後退中に車両の後方を完全に見渡すための適切な技術は何ですか？
  choices:
    A: バックミラーとサイドミラーだけに頼る
    B: 右手でハンドルを操作し、運転席側の窓から外を見る
    C: 左手でハンドルを操作し、右肩越しにリアウィンドウから後方を見る
    D: 前方を向いたまま、同乗者に誘導してもらう
  answer: C
  explanation: 車両の後方を完全に見渡すには、左手でハンドルを操作し、右肩越しにリアウィンドウから後方を確認します。ミラーだけに頼ってはいけません。
- id: 196
  category: safe_driving_rules
  question: 消火栓からどれくらい離れて駐車しなければなりませんか？
  choices:
    A: 少なくとも10フィート
    B: 少なくとも15フィート
    C: 少なくとも20フィート
    D: 少なくとも25フィート
  answer: B
  explanation: 消火栓または消防署の出入り口から15フィート以内に駐車してはいけません。
- id: 197
  category: safe_driving_rules
  question: ハイウェイの路肩に駐車する場合、駐車した車両は両方向から接近してくるドライバーから少なくともどれくらいの距離で見える必要がありますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 路肩への駐車は、駐車した車両が両方向から接近するドライバーから少なくとも200フィートの距離で見える場合を除き、法律で禁止されています。
- id: 198
  category: defensive_driving
  question: 自動車が関与する致命的な交通事故の3分の1以上はどこで発生していますか？
  choices:
    A: 州間高速道路（インターステート）上
    B: 踏切
    C: 交差点
    D: 駐車場
  answer: C
  explanation: 事故は交差点で最も頻繁に発生しており、自動車が関与する致命的な交通事故の3分の1以上が交差点で発生しています。
- id: 199
  category: safe_driving_rules
  question: 交通標識や信号のない交差点に2台の車両が同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の車両
    B: 右側の車両
    C: より速く走行している車両
    D: 左折する車両
  answer: B
  explanation: 交通標識や信号のない交差点において、2台以上の車両が同時に交差点に到着した場合、右側の車両に優先権があります。
- id: 200
  category: safe_driving_rules
  question: 向かい合った2台の車両が同時に交差点に接近し、一方のドライバーが直進を希望し、もう一方が左折を希望する場合、どちらに優先権がありますか？
  choices:
    A: 左折するドライバー
    B: 直進するドライバー
    C: 先に合図を出したドライバー
    D: どちらのドライバーにもない
  answer: B
  explanation: 一方のドライバーが直進し、もう一方が左折しようとしている場合、左折しようとするドライバーは待たなければなりません。したがって、直進するドライバーに優先権があります。
- id: 201
  category: safe_driving_rules
  question: 交差点を直進している間、決して行ってはいけないことは何ですか？
  choices:
    A: 車線変更
    B: 一定の速度を維持する
    C: 歩行者を探す
    D: ハンドルに両手を置いておく
  answer: A
  explanation: マニュアルには「交差点を直進している間は、決して車線変更をしてはいけません」と明記されています。
- id: 202
  category: safe_driving_rules
  question: トラフィックサークルやラウンドアバウト（環状交差点）内では、すべての車両はどの方向に進みますか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 直進
    D: 8の字型
  answer: B
  explanation: トラフィックサークル内のすべての車両は、サークルに沿って右方向に、反時計回りに進みます。
- id: 203
  category: safe_driving_rules
  question: ラウンドアバウトやトラフィックサークルでは、誰に優先権がありますか？
  choices:
    A: ラウンドアバウトに進入しようとしている車両
    B: すでにラウンドアバウト内にいる車両
    C: ラウンドアバウトから出ようとしている車両
    D: より高速で走行している車両
  answer: B
  explanation: すでにサークル内にいる車両に優先権があり、進入するドライバーは、すでにラウンドアバウト内にいる車両や自転車に道を譲らなければなりません。
- id: 204
  category: safe_driving_rules
  question: 近代的なラウンドアバウトでの一般的な走行速度はどれくらいですか？
  choices:
    A: 時速5〜10マイル (5-10 mph)
    B: 時速15〜20マイル (15-20 mph)
    C: 時速25〜30マイル (25-30 mph)
    D: 時速35〜40マイル (35-40 mph)
  answer: B
  explanation: 近代的なラウンドアバウトは古いトラフィックサークルよりもはるかに小さく、車両は低速（時速15〜20マイル）で走行する必要があるため、より安全です。
- id: 205
  category: sharing_the_road
  question: ラウンドアバウトで優先権を持つのは誰ですか？
  choices:
    A: ラウンドアバウトに進入しようと近づいている車両
    B: すでにラウンドアバウト内にいる車両および自転車
    C: ラウンドアバウトの中央を歩いている歩行者
    D: 右側から進入してくる車両
  answer: B
  explanation: マニュアルには、ドライバーはすでにラウンドアバウト内にいる車両や自転車に道を譲らなければならず、すでに中にいる車両は近づいてくる車両に道を譲る必要はないと記されています。
- id: 206
  category: safe_driving_rules
  question: 複数車線のあるラウンドアバウトで、左折またはUターンをするにはどの車線を使用すべきですか？
  choices:
    A: 右車線
    B: 中央車線
    C: 左車線
    D: トラックエプロン（大型車用路肩）
  answer: C
  explanation: 複数車線のあるラウンドアバウトでは、直進、左折、またはUターンをする場合は左車線にとどまります。
- id: 207
  category: defensive_driving
  question: すでにラウンドアバウト内にいるときに、赤色灯をつけサイレンを鳴らした緊急車両が近づいてきた場合、どうすべきですか？
  choices:
    A: 緊急車両を通過させるため、ラウンドアバウト内ですぐに停止する
    B: ラウンドアバウトの内側のアイランド（中央島）に寄せる
    C: 速度を上げ、曲がりきってから出口を出る
    D: まずラウンドアバウトを出てから、車を寄せる
  answer: D
  explanation: 緊急車両が近づいてきたときにすでにラウンドアバウト内にいる場合は、まず出口を出てから、緊急車両を通過させるために車を端に寄せなければなりません。
- id: 208
  category: safe_driving_rules
  question: 踏切で停止する必要がある場合、最も近いレールから何フィートの距離で停止しなければなりませんか？
  choices:
    A: 25フィート以内、かつ10フィート以上
    B: 50フィート以内、かつ15フィート以上
    C: 100フィート以内、かつ25フィート以上
    D: 正確に15フィート
  answer: B
  explanation: 車両の運転者は、鉄道の最も近いレールから50フィート以内、かつ15フィート以上の場所で停止しなければならず、安全に進行できるようになるまで進んではいけません。
- id: 209
  category: sharing_the_road
  question: 列車は以下のどの車両に対して優先権を譲らなければなりませんか？
  choices:
    A: サイレンを鳴らしている警察車両
    B: 緊急通報に対応中の救急車
    C: 赤色灯を点滅させている消防車
    D: 上記のいずれでもない。列車は常に優先権を持つ
  answer: D
  explanation: 列車は、警察、消防、救急などの緊急車両を含むすべての道路交通に対して優先権を持ちます。
- id: 210
  category: defensive_driving
  question: 時速55マイルで走行している列車が完全に停止するまでに、およそどれくらいの距離が必要ですか？
  choices:
    A: 0.5マイル（約800メートル）未満
    B: 約1500フィート
    C: 1マイル（約1.6キロメートル）以上
    D: 正確に500フィート
  answer: C
  explanation: 時速55マイルで走行している列車が停止するには、1マイル以上の距離が必要です。
- id: 211
  category: safe_driving_rules
  question: 踏切を横断中に警報機が点滅し始めたり、遮断機が下り始めたりした場合はどうすべきですか？
  choices:
    A: 直ちに停止してバックする
    B: そのまま進み続け、踏切を通り抜ける
    C: 停車して車両を放棄する
    D: ギアをバックに入れ、慎重に後退して出る
  answer: B
  explanation: 踏切を横断中に警報機が点滅し始めたり、遮断機が下り始めたりした場合は、停止したりバックしたりせず、そのまま進み続けてください。警告信号は、横断を完了するのに十分な時間的余裕を持って作動するようになっています。
- id: 212
  category: defensive_driving
  question: 踏切を渡りきる前に、反対側の遮断機が下りてきた場合はどうすべきですか？
  choices:
    A: 線路上で停止し、列車を待つ
    B: 遮断機を避けるためにギアをバックに入れる
    C: 遮断機は柔軟性があるため、そのまま突き抜けて進む
    D: 車から降りて、手動で遮断機を持ち上げる
  answer: C
  explanation: 踏切の遮断機によって車両が閉じ込められることはありません。そのまま遮断機を押し切って進んでください。遮断機は柔軟性があるため、進路を完全に塞ぐものではありません。
- id: 213
  category: signs_and_signals
  question: 踏切にある緊急通知システム（ENS）の「青い標識」にはどのような情報が記載されていますか？
  choices:
    A: 列車の時刻表と制限速度
    B: 踏切識別番号、鉄道会社名、および緊急連絡先電話番号
    C: 次の高速道路出口までの距離
    D: 地元警察署の非緊急用電話番号
  answer: B
  explanation: 「青い標識」として知られるENS標識には、緊急事態を報告するための踏切識別番号、鉄道会社名、および緊急連絡先電話番号が記載されています。
- id: 214
  category: defensive_driving
  question: 踏切内またはその付近で車両が動かなくなった（エンストした）場合、まず最初にすべきことは何ですか？
  choices:
    A: 少なくとも1分間はエンジンの再始動を試みる
    B: 車内に座ったままレッカー車を呼ぶ
    C: 直ちに車から降りて、線路から離れる
    D: クラクションを鳴らして、接近してくる列車に警告する
  answer: C
  explanation: 線路上またはその付近で車両が動かなくなった場合は、直ちに車から降りてください。車両と線路から遠ざかるように避難してください。
- id: 215
  category: sharing_the_road
  question: 自転車利用者は、複数車線のラウンドアバウト（環状交差点）をどのように通行すべきですか？
  choices:
    A: ラウンドアバウトの路肩に沿って走行する
    B: 適切な車線を選び、その車線の中央を走行する
    C: 常にトラックエプロンを使用する
    D: 自転車から降りて、中央島を歩いて通り抜ける
  answer: B
  explanation: 自転車利用者は、複数車線のラウンドアバウトに入る前に適切な車線を選択し、選んだ車線の中央を走行する必要があります。路肩に沿って走行してはいけません。
- id: 216
  category: safe_driving_rules
  question: 列車が踏切を通過した後、すぐに動き出してはいけないのはなぜですか？
  choices:
    A: 警察官が通過の合図を送るまで待たなければならないため
    B: 遮断機のセンサーがリセットされるまで時間が必要なため
    C: 反対方向から来る別の列車や、最初の列車に続く別の列車があるかもしれないため
    D: 横断する前に正確に3分間待たなければならないため
  answer: C
  explanation: 列車が通過した直後に動き出してはいけません。反対方向から来る列車や、最初の列車に続いて走行してくる別の列車がある可能性があります。
- id: 217
  category: sharing_the_road
  question: ラウンドアバウトにあるコンクリートのアイランド、またはトラックエプロンの目的は何ですか？
  choices:
    A: 緊急車両用の指定駐車エリア
    B: 歩行者が横断するための安全地帯
    C: 大型トラックがラウンドアバウトを曲がりやすくするための補助スペース
    D: 自転車専用の車線
  answer: C
  explanation: 大型トラックは、ラウンドアバウト内での操縦を容易にするために、トラックエプロンと呼ばれるコンクリートのアイランド部分を利用することができます。
- id: 218
  category: defensive_driving
  question: 踏切で一時停止が義務付けられているため、その後ろで停止する準備をしておくべき車両は次のうちどれですか？
  choices:
    A: オートバイと自転車
    B: スクールバスと危険物輸送車両
    C: 配送用バンとピックアップトラック
    D: サイレンを鳴らしていない緊急車両
  answer: B
  explanation: スクールバス、旅客輸送車両、賃貸車両、または爆発物や危険物を輸送する車両など、踏切での停止が義務付けられている車両の後ろでは、いつでも停止できる準備をしておいてください。
- id: 219
  category: safe_driving_rules
  question: 歩行者はラウンドアバウトを通行する際、どこを歩くべきですか？
  choices:
    A: ラウンドアバウトの中央を通り抜ける
    B: トラックエプロンに沿って歩く
    C: ラウンドアバウトの外側に設置された横断歩道を歩く
    D: ラウンドアバウトの左車線を歩く
  answer: C
  explanation: 歩行者はラウンドアバウトの外側に沿って設置された横断歩道を使用すべきであり、中央を通り抜けてはいけません。
- id: 220
  category: sharing_the_road
  question: 交差点に接近したり通過したりする際、なぜ自転車に特に注意を払う必要があるのですか？
  choices:
    A: 自転車はすべての自動車に道を譲る義務があるため
    B: 自転車は交差点で歩道を走行する義務があるため
    C: 直進する自転車と右折する自動車の間で衝突が起こる可能性があるため
    D: 自転車は交差点内を自動車よりも速く走行するため
  answer: C
  explanation: 自転車は自動車の右側（右側通行の場合）を走行するため、交差点を直進しようとする自転車と、右折しようとする自動車の間で衝突が発生する可能性があります。
- id: 221
  category: safe_driving_rules
  question: 市街地で右左折しようとした際、適切な車線にいないことに気づいた場合、どうすべきですか？
  choices:
    A: 停車し、交通が途切れるのを待ってから車線変更する。
    B: 次の交差点まで進み、そこで曲がる。
    C: 方向指示器（ウィンカー）を使えば、素早く車線変更してよい。
    D: 前の交差点までバックする。
  answer: B
  explanation: マニュアルによれば、右左折しようとした際に適切な車線にいない場合は、そのまま次の交差点まで進んでそこで曲がるべきであるとされています。
- id: 222
  category: defensive_driving
  question: 他の車の死角を走行しているかどうかを、どのように判断できますか？
  choices:
    A: 中央車線を走行している。
    B: 前方の車のルームミラーが見えない。
    C: 前方の車両が大型の商用トラックである。
    D: 車間距離が2秒未満である。
  answer: B
  explanation: 並走、特に他のドライバーの死角での走行は避けてください。前方の車のルームミラーが見えない場合、おそらくそのドライバーの死角に入っています。
- id: 223
  category: safe_driving_rules
  question: 一方通行の道路を走行中、直進（通過）するにはどの車線を使用すべきですか？
  choices:
    A: 一番右の車線。
    B: 一番左の車線。
    C: 中央の車線。
    D: 外側の車線。
  answer: C
  explanation: 一方通行の道路では、直進（通過交通）には中央の車線を、右左折には外側の車線を使用してください。
- id: 224
  category: defensive_driving
  question: なぜ田舎道での運転は、都市部の激しい交通の中での運転よりも危険であるとされることが多いのですか？
  choices:
    A: 一時停止標識や信号機が多いから。
    B: 道幅が狭く、照明が不十分なことが多いから。
    C: 商用トラックの交通量が多いから。
    D: 一般的に制限速度が低いから。
  answer: B
  explanation: 田舎道での運転は、道幅が狭かったり、照明が不十分であったり、走行速度が高かったりするため、しばしばより危険です。
- id: 225
  category: safe_driving_rules
  question: 州間高速道路（インターステート）に進入する際の適切な手順は何ですか？
  choices:
    A: ランプの端で停車し、交通が途切れるのを待つ。
    B: 加速車線を使用して周囲の交通の流れと同じ速度まで加速し、安全に合流する。
    C: 低速の車を避けるため、左側の車線に直接合流する。
    D: 加速車線で減速し、高速道路上の車に道を譲る。
  answer: B
  explanation: 高速道路に進入する際は、加速車線を使用して自車の速度を周囲の交通の流れに合わせ、その後安全に合流してください。
- id: 226
  category: defensive_driving
  question: 故障により州間高速道路上で停車せざるを得なくなった場合、助けを求めるためにどのような合図をすべきですか？
  choices:
    A: 走行車線に立ち、手を振る。
    B: ラジオアンテナまたは左側のドアハンドルに白い布を縛り付け、ボンネットを上げる。
    C: リアバンパーに赤い旗を置く。
    D: 助けが来るまでクラクションを鳴らし続ける。
  answer: B
  explanation: 故障により停車せざるを得ない場合は、道路から十分離れた場所に移動してください。ラジオアンテナまたは左側のドアハンドルに白い布を縛り付け、ボンネットを上げます。
- id: 227
  category: safe_driving_rules
  question: 州間高速道路から出る際、どのようにすべきですか？
  choices:
    A: 減速車線に入る前に、走行車線で減速する。
    B: 十分に余裕を持って合図（ウィンカー）を出し、先に減速することなく減速車線に入る。
    C: 減速車線に入ったらすぐに急ブレーキをかける。
    D: 減速車線に入るまで合図（ウィンカー）を出すのを待つ。
  answer: B
  explanation: 高速道路から出る際は、十分に余裕を持って合図を出し、減速せずに減速車線に入ってください。その後、掲示されている出口の制限速度に従って進んでください。
- id: 228
  category: safe_driving_rules
  question: 州間高速道路で予定していた出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 次の出口まで進み、そこで高速道路を降りる。
    B: 減速し、路肩を慎重にバックする。
    C: 中央分離帯を横切ってUターンする。
    D: 走行車線で停車し、交通が途切れるのを待ってからバックする。
  answer: A
  explanation: 出口を通り過ぎてしまった場合、減速したり、バックしたり、転回しようとしたりしないでください。代わりに次の出口まで進み、そこで高速道路を降りてください。
- id: 229
  category: vehicle_information
  question: 夜間にハイビーム（走行用前照灯）を点灯した際、何フィート先にいる人を確認できる必要がありますか？
  choices:
    A: 75フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: C
  explanation: 夜間にハイビームを点灯した際、200フィート（約61メートル）先にいる人を確認できる必要があります。
- id: 230
  category: vehicle_information
  question: ノースカロライナ州の法律によれば、テールランプは赤色で、少なくとも何フィート先から見える必要がありますか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: D
  explanation: テールランプは赤色で、少なくとも500フィート（約152メートル）先から見える必要があります。
- id: 231
  category: vehicle_information
  question: 運転を開始する前に、車両のサイドミラーをどのように調整すべきですか？
  choices:
    A: 車両の真後ろの様子が見えるように調整する。
    B: 左右後方の様子が見え、車両の側面がわずかに映る程度に調整する。
    C: すべての死角を完全になくすように調整する。
    D: 車両の前輪が見えるように調整する。
  answer: B
  explanation: サイドミラーは、車両の左右後方の様子が見えるように調整してください。ミラーには車両の側面がわずかに映る程度にするのが適切です。
- id: 232
  category: vehicle_information
  question: 足で踏んでいる間にブレーキペダルが徐々に沈み込む場合、何を示していますか？
  choices:
    A: アンチロック・ブレーキ・システム（ABS）が作動している。
    B: ブレーキパッドが新品である。
    C: 油圧系統の点検が必要である。
    D: タイヤの空気圧が不足している。
  answer: C
  explanation: 足の圧力でペダルが徐々に沈み込む場合は、油圧系統の点検を行う必要があります。
- id: 233
  category: vehicle_information
  question: 停車時にアンチロック・ブレーキ・システム（ABS）を使用する正しい方法は何ですか？
  choices:
    A: ブレーキペダルを素早くポンピングする（断続的に踏む）。
    B: ブレーキを強く踏み、ペダルに一定の強い圧力をかけ続ける。
    C: ブレーキペダルを軽く何度も叩くように踏む。
    D: ペダルが振動し始めたら、ブレーキペダルを緩める。
  answer: B
  explanation: ABS装着車では、停車時にブレーキを強く踏み、ペダルに一定の強い圧力をかけ続けることが重要です。ブレーキペダルをポンピングしたり、圧力を緩めたりすると、ABSの効果が低下します。
- id: 234
  category: vehicle_information
  question: ノースカロライナ州で安全とみなされるタイヤの溝の深さの最低許容範囲はどれくらいですか？
  choices:
    A: 1/32インチ
    B: 1/16インチ
    C: 1/8インチ
    D: 1/4インチ
  answer: B
  explanation: マニュアルによると、タイヤの溝の深さが1/16インチ未満の場合、そのタイヤは安全ではないとみなされます。
- id: 235
  category: vehicle_information
  question: タイヤの空気圧が高すぎる（過充填）状態で走行することによる悪影響は何ですか？
  choices:
    A: タイヤの外側の縁がより早く摩耗する。
    B: バースト（破裂）の可能性が高まる。
    C: トラクション（摩擦力）が低下し、トレッドの中央部が激しく摩耗する。
    D: 燃費が10%向上する。
  answer: C
  explanation: マニュアルには、空気圧が高すぎるタイヤはトラクションを低下させ、トレッドの中央部を激しく摩耗させると記載されています。
- id: 236
  category: safe_driving_rules
  question: 排気漏れによる一酸化炭素中毒を防ぐために、マニュアルでは何を推奨していますか？
  choices:
    A: 常にエアコンを最強にしておく。
    B: 走行中、窓を1インチ（約2.5cm）ほど開けておく。
    C: 10,000マイルごとにマフラーを交換する。
    D: ハザードランプを点灯させて走行する。
  answer: B
  explanation: 排気システムの漏れによって有毒な一酸化炭素ガスが車内に侵入する可能性があるため、走行中は窓を1インチほど開けておくことが推奨されています。
- id: 237
  category: vehicle_information
  question: 車両のサスペンションシステムに問題がある可能性を示す兆候は次のうちどれですか？
  choices:
    A: 車体が自由に揺れる、右左折時に片側に大きく傾く、または跳ね続ける。
    B: 数分以上アイドリングしているとエンジンが止まる。
    C: 時速60マイル以上で走行するとハンドルが振動する。
    D: 排気システムから過度な煙や騒音が出る。
  answer: A
  explanation: 車両が自由に揺れたり、曲がるときに片側に大きく傾いたり、あるいは跳ね続けたりする場合は、サスペンションシステムに問題がある可能性があります。
- id: 238
  category: safe_driving_rules
  question: 「ドライブ・グリーン（環境に優しい運転）」のセクションによると、急発進や急ブレーキは燃料消費量を最大で何パーセント増加させますか？
  choices:
    A: 10%
    B: 20%
    C: 30%
    D: 40%
  answer: D
  explanation: 環境に優しい運転とは簡単な習慣を取り入れることです。マニュアルでは、急発進や急ブレーキによって燃料消費量が40%増加する可能性があると指摘しています。
- id: 239
  category: safe_driving_rules
  question: 時速60マイルを超えて時速5マイル速度を上げるごとに、ガソリン1ガロンあたり最大でいくらの追加費用がかかりますか？
  choices:
    A: 10セント
    B: 15セント
    C: 30セント
    D: 50セント
  answer: C
  explanation: マニュアルによると、時速60マイルを超えて時速5マイル速度を上げるごとに、ガソリン1ガロンあたり最大30セントの追加費用がかかる計算になります。
- id: 240
  category: defensive_driving
  question: 優れたドライバーは、前方の道路をどのくらい先まで確認するように努めるべきですか？
  choices:
    A: 3〜5秒先
    B: 5〜10秒先
    C: 10〜15秒先
    D: 20〜30秒先
  answer: C
  explanation: 優れたドライバーは、直前の急な操作を避けるために、道路の10〜15秒先（市街地の約1ブロック先）を見るように努めます。
- id: 241
  category: defensive_driving
  question: 後続車が車間距離を詰めすぎていないか確認するために、どのくらいの頻度でミラーをチェックすべきですか？
  choices:
    A: 5秒ごと
    B: 10秒ごと
    C: 30秒ごと
    D: 60秒ごと
  answer: B
  explanation: マニュアルでは、後続車が車間距離を詰めすぎていないかを確認するために、約10秒ごとにミラーをチェックすることを推奨しています。
- id: 242
  category: defensive_driving
  question: 車線変更をする前に死角を確認する適切な方法は何ですか？
  choices:
    A: バックミラー（ルームミラー）だけに頼る。
    B: 素早く首を回して肩越しに目視する。
    C: ヘッドライトを点滅させて反応を待つ。
    D: クラクションを鳴らして死角にいる車両に警告する。
  answer: B
  explanation: ミラーには死角があるため、車線変更や右左折を行う前に、素早く首を回して肩越しに目視し、死角に何があるかを確認する必要があります。
- id: 243
  category: safe_driving_rules
  question: 制限速度が時速45マイル（45 mph）以上の場合、少なくとも曲がる手前何フィートから合図を出さなければなりませんか？
  choices:
    A: 50フィート手前
    B: 100フィート手前
    C: 200フィート手前
    D: 500フィート手前
  answer: C
  explanation: 通常は曲がる手前少なくとも100フィートで合図を出しますが、制限速度が時速45マイル以上の場合は、少なくとも200フィート手前から合図を出さなければなりません。
- id: 244
  category: signs_and_signals
  question: 右折の正しい手信号は何ですか？
  choices:
    A: 左腕と手を真っ直ぐ外に出し、人差し指で指す。
    B: 左腕を真っ直ぐ外に出し、前腕と手を垂直に上げ、手のひらを前に向ける。
    C: 左腕と手を下に向け、手のひらを後ろに向ける。
    D: 左手を円を描くように振る。
  answer: B
  explanation: 手信号で右折を知らせるには、左腕を真っ直ぐ外に出し、前腕と手を垂直に上げ、手のひらを前に向けます。
- id: 245
  category: signs_and_signals
  question: 停止または徐行することを示すために、どのように手信号を使いますか？
  choices:
    A: 左腕と手を下に向け、手のひらを後ろに向ける。
    B: 左腕を真っ直ぐ外に出し、人差し指で指す。
    C: 左腕を真っ直ぐ外に出し、前腕を垂直に上げる。
    D: ブレーキランプを3回点滅させる。
  answer: A
  explanation: 停止や徐行を知らせるには、左腕と手を下に向け、手のひらを後ろに向けます。
- id: 246
  category: defensive_driving
  question: 左側に接近してくる車両があり、右側に自転車に乗った子供がいる場合、どのように車両を調整すべきですか？
  choices:
    A: 両方の危険に対して均等にスペースを空ける。
    B: 車両を避けるために、自転車に乗った子供の方に近づく。
    C: 危険がなくなるまでクラクションを鳴らし続ける。
    D: 対向車に近づくことになっても、子供に対してより多くのスペースを空ける。
  answer: D
  explanation: 避けられない危険が2つ以上ある場合は、最大または最も可能性の高い危険に対して最も多くのスペースを空けます。子供は突然動く可能性が最も高いため、対向車に近づくことになっても、子供に対してより多くのスペースを空けてください。
- id: 247
  category: signs_and_signals
  question: ハイウェイの工事区域（ワークゾーン）を特定するために厳密に使用される警戒標識の色は何色ですか？
  choices:
    A: 黄色の地に黒の文字
    B: オレンジ色の地に黒の文字
    C: 白の地に黒の文字
    D: 赤の地に白の文字
  answer: B
  explanation: ハイウェイの工事区域は、黒の文字でメッセージが書かれた独特のオレンジ色の警戒標識によって簡単に特定できます。この色は工事区域を特定するために厳密に予約されています。
- id: 248
  category: vehicle_information
  question: 車両のクラクションは、どのくらいの距離まで聞こえる大きさでなければなりませんか？
  choices:
    A: 少なくとも50フィート
    B: 少なくとも100フィート
    C: 少なくとも200フィート
    D: 少なくとも500フィート
  answer: C
  explanation: 認可されたすべての自動車には、少なくとも200フィート先まで聞こえる大きさのクラクションを装備しなければなりません。
- id: 249
  category: safe_driving_rules
  question: 工事区域（ワークゾーン）における追突事故の主な原因は何ですか？
  choices:
    A: 掲示された制限速度よりも速く走ること
    B: 周囲の交通の流れよりも遅く走ること
    C: 車線変更時に方向指示器を使用しないこと
    D: ハイビームを使用すること
  answer: B
  explanation: マニュアルによると、周囲の交通の流れよりも遅く走ることは、工事区域における追突事故の主な原因です。
- id: 250
  category: safe_driving_rules
  question: ノースカロライナ州の法律では、いつヘッドライトの使用が義務付けられていますか？
  choices:
    A: 日没から日の出まで、および視界が400フィート以下の場合
    B: 夕暮れから夜明けまで、および視界が500フィート以下の場合
    C: 夜間に照明のない田舎道を走行する場合のみ
    D: 天候に関わらず午後8時から午前6時まで
  answer: A
  explanation: 法律では、日没から日の出まで、および視界が400フィート以下の場合にヘッドライトの使用を義務付けています。
- id: 251
  category: defensive_driving
  question: 夜間、対向車がヘッドライトをロービームに切り替えない場合、どうすべきですか？
  choices:
    A: ハイビームを点灯し、対向車が通り過ぎるまで点灯したままにする
    B: 距離を測るために、対向車のヘッドライトを直視する
    C: ハイビームを1回点滅させて合図を送り、それでも相手が切り替えない場合は、視線を少し右側にそらす
    D: 直ちに道路脇に停車し、すべてのライトを消す
  answer: C
  explanation: マニュアルでは、ハイビームを1回点滅させることで相手のドライバーに注意を促すことができるとしています。それでも相手がライトを下げない場合は、自分のライトはロービームのままにし、ヘッドライトを直視しないよう視線を少し右側にそらしてください。
- id: 252
  category: safe_driving_rules
  question: 滑りやすい路面での停止距離は、乾燥した路面と比較してどのくらい長くなりますか？
  choices:
    A: アンチロック・ブレーキ（ABS）を装備していれば変わらない
    B: 2倍から10倍長くなる
    C: 正確に50パーセント長くなる
    D: 15倍から20倍長くなる
  answer: B
  explanation: 滑りやすい路面での停止距離は、乾燥した路面よりも2倍から10倍長くなります。
- id: 253
  category: defensive_driving
  question: 雨が降り始めてからの10〜15分間、道路がより危険とされるのはなぜですか？
  choices:
    A: 雨によって車線の反射塗料が洗い流されるため
    B: 雨がオイル、汚れ、ほこり、ゴムと混ざり合い、滑りやすい路面を作るため
    C: ドライバーが嵐が悪化する前に目的地に到着しようとスピードを上げる傾向があるため
    D: 水によって、いかなる速度でも直ちに深刻なハイドロプレーニング現象が発生するため
  answer: B
  explanation: 雨が降り始めてからの10〜15分間は、雨がアスファルトや車両からのオイル、そして汚れ、ほこり、ゴムと混ざり合い、滑りやすい路面を作り出します。
- id: 254
  category: safe_driving_rules
  question: ハイドロプレーニング現象は何マイルから発生する可能性がありますか？
  choices:
    A: 時速15マイルという低速から
    B: 時速30マイルという低速から
    C: 時速45マイルという低速から
    D: 時速55マイルという低速から
  answer: B
  explanation: ハイドロプレーニング現象は、時速30マイル（約48km/h）という低速から、またわずか1/8インチ（約3mm）以上の深さの水たまりでも発生する可能性があります。
- id: 255
  category: defensive_driving
  question: 車両がハイドロプレーニング現象を起こし始めた場合、推奨される行動は何ですか？
  choices:
    A: トラクションを回復させるために、直ちに急ブレーキをかける
    B: ステアリングホイールを右に急に切る
    C: アクセルペダルから足を離し、ブレーキを踏みたい衝動を抑える
    D: 一定の速度を維持するためにクルーズコントロールをオンにする
  answer: C
  explanation: ハイドロプレーニング現象が始まったら、アクセルペダルから足を離してください。ブレーキを踏みたい衝動を抑え、ステアリングホイールをまっすぐに保ち、車の勢いが自然に衰えるのを待ちます。
- id: 256
  category: vehicle_information
  question: ハイドロプレーニング現象の可能性を高めるタイヤの状態はどれですか？
  choices:
    A: 溝が深く開いているタイヤ
    B: メーカー指定値の高めの空気圧が充填されたタイヤ
    C: トレッド（溝）が摩耗し、空気圧が不足しているタイヤ
    D: 夏場に使用されるスノータイヤ
  answer: C
  explanation: トレッドが摩耗したタイヤや空気圧が不足しているタイヤは、路面とのグリップ力が低下し、ハイドロプレーニング現象が起こる可能性が高まります。
- id: 257
  category: safe_driving_rules
  question: マニュアルによると、走行中の車を道路から押し流すのに必要な、流れの速い水の深さはどれくらいですか？
  choices:
    A: 2インチ
    B: 6インチ
    C: 18インチ
    D: 24インチ
  answer: B
  explanation: 6インチ（約15cm）の流れの速い水で車が道路から押し流される可能性があり、12インチ（約30cm）の流れの速い水では車が浮いたり、横転したりする可能性があるという報告があります。
- id: 258
  category: safe_driving_rules
  question: ノースカロライナ州の運転者は、悪天候でワイパーを使用する際、何をしなければなりませんか？
  choices:
    A: 非常点滅表示灯（ハザードランプ）を点灯する
    B: 掲示された制限速度より少なくとも時速15マイル以上減速して走行する
    C: ヘッドライトを点灯する
    D: 右側の車線のみを走行する
  answer: C
  explanation: ノースカロライナ州のすべての運転者は、悪天候によりワイパーを使用する場合は常にヘッドライトを点灯することが義務付けられています。
- id: 259
  category: defensive_driving
  question: 霧の中を走行する際、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: 車幅灯（パーキングライト）のみ
    D: 非常点滅表示灯（ハザードランプ）のみ
  answer: B
  explanation: 霧の中を走行しなければならない場合は、ロービームを点灯してください。
- id: 260
  category: defensive_driving
  question: 霧の中の走行で視界が極端に悪い場合、どうすべきですか？
  choices:
    A: 車線の真ん中で停車し、霧が晴れるのを待つ
    B: ハイビームを点灯し、霧の層を早く抜けるためにスピードを上げる
    C: 道路から十分に離れた場所に停車し、車両を固定して、ハザードランプを点灯させる
    D: 窓を下ろし、走行中ずっとクラクションを鳴らし続ける
  answer: C
  explanation: 視界が極端に悪い場合は、以下の対応が必要です：道路から十分に離れた場所に停車する。停車後、車両を固定し、ハザードランプを点灯させる。助手席側から車外に出て、道路から離れた場所で待機する。
- id: 261
  category: safe_driving_rules
  question: 気温が下がったときに、道路のどの部分が最初に凍結しやすいですか？
  choices:
    A: 交差点や横断歩道
    B: 日陰、橋、高架橋
    C: 交通量の多い高速道路
    D: トンネルや地下道
  answer: B
  explanation: 走行中は、日陰、橋、高架橋に注意してください。これらの場所は気温が下がると最初に凍結することが多いためです。
- id: 262
  category: defensive_driving
  question: 雪道や凍結した道路で減速する場合、停止距離をどのくらい長くする必要がありますか？
  choices:
    A: 通常の停止距離の少なくとも2倍の余裕を持つ
    B: 通常の停止距離の少なくとも3倍の余裕を持つ
    C: 通常の停止距離の少なくとも5倍の余裕を持つ
    D: 通常の停止距離の少なくとも10倍の余裕を持つ
  answer: B
  explanation: 雪道や凍結した道路で発進または停止する場合、減速するために通常の停止距離の少なくとも3倍の余裕を持ってください。
- id: 263
  category: safe_driving_rules
  question: 氷や圧雪の上を走行する場合、どのくらいの停止距離を確保すべきですか？
  choices:
    A: 通常の停止距離の2倍
    B: 通常の停止距離の少なくとも3倍
    C: 通常の停止距離の4倍
    D: 通常の停止距離と同じ
  answer: B
  explanation: マニュアルによると、氷や圧雪の上を走行する場合、減速するために通常の停止距離の少なくとも3倍の余裕を持つ必要があります。
- id: 264
  category: defensive_driving
  question: 野生動物が最も活発で、道路上に現れる可能性が高いのは一日のうちのどの時間帯ですか？
  choices:
    A: 午前中と午後の早い時間
    B: 夜間の最も暗い時間帯のみ
    C: 夜明け、夕暮れ、および日没後の数時間
    D: 正午と午後の遅い時間
  answer: C
  explanation: マニュアルによると、野生動物はいつでもどこでも現れる可能性がありますが、夜明け、夕暮れ、および日没後の数時間に最も活発になります。
- id: 265
  category: defensive_driving
  question: 動物が目の前にいるときにハイビームの使用に注意すべきなのはなぜですか？
  choices:
    A: ハイビームは一部の動物を混乱させたり、「すくませたり」することがあるため。
    B: ハイビームは動物が車両に突進する原因となるため。
    C: ハイビームはドライバーが動物の目の輝きを確認するのを難しくするため。
    D: ハイビームは動物を永久に失明させるため。
  answer: A
  explanation: マニュアルでは、対向車がなく、目の前に動物がいない場合にのみハイビームを使用することを推奨しています。ハイビームは一部の動物を混乱させたり、「すくませたり」して、いわゆる「ヘッドライトを浴びたシカ」のような状態に陥らせることがあるためです。
- id: 266
  category: safe_driving_rules
  question: 動物と衝突し、道路の脇に停車した場合、次に何をすべきですか？
  choices:
    A: 動物に近づき、怪我の状態を確認する。
    B: 車内にとどまり、ドアをロックして、ハザードランプを点灯させる。
    C: すぐに動物を道路外へ引きずる。
    D: 車から降りて、他のドライバーに合図を送って助けを求める。
  answer: B
  explanation: 動物と衝突した場合は、安全に道路の脇に停車し、車内にとどまり、ドアをロックして、ハザードランプを点灯させるようマニュアルに記載されています。動物は危険な場合があるため、近づかないでください。
- id: 267
  category: vehicle_information
  question: オートマチック車（AT車）でブレーキが故障した場合、どうすべきですか？
  choices:
    A: パーキングに入れ、エンジンを切る。
    B: アクセルペダルを何度も踏んでブレーキ液の圧力を高める。
    C: 非常用ブレーキ（パーキングブレーキ）をかけ、ギアレバーを低速（L）レンジに入れる。
    D: ニュートラルに入れ、車両が止まるまで惰性で走行する。
  answer: C
  explanation: オートマチック車でブレーキが故障した場合は、非常用ブレーキをかけ、ギアレバーを低速レンジに入れてください。
- id: 268
  category: vehicle_information
  question: 濡れたブレーキを乾かすにはどうすればよいですか？
  choices:
    A: 数マイルの間、高速で走行する。
    B: 短距離を走行しながら、ブレーキペダルを軽く踏む。
    C: ニュートラルの状態でブレーキペダルを素早く何度も踏む。
    D: 車を停めて、1時間ほど自然乾燥させる。
  answer: B
  explanation: 短距離を走行しながらブレーキペダルを軽く踏むことで、濡れたブレーキを乾かすことができます。摩擦によって熱が発生し、水分が蒸発します。
- id: 269
  category: safe_driving_rules
  question: 長い下り坂や急勾配を下る際にブレーキの過度な摩耗を防ぐためには、どうすべきですか？
  choices:
    A: 下りきるまでずっとブレーキペダルを踏み続ける。
    B: ニュートラルに入れて坂を下る。
    C: 速度を下げるためにエンジンを切る。
    D: 坂を下り始める前に、頂上で低いギアにシフトダウンする。
  answer: D
  explanation: 長い下り坂や急勾配を下る際のブレーキの過度な摩耗を防ぐには、ブレーキペダルの代わりに低いギアを使用して速度を制御してください。下り始める前に、坂の頂上で低いギアにシフトするのが最善です。
- id: 270
  category: defensive_driving
  question: アクセルペダルが戻らなくなった（固着した）場合に取るべき手順の一つは何ですか？
  choices:
    A: ニュートラルに入れ、車輪をロックさせないようにブレーキを強く踏む。
    B: すぐにイグニッションを切り、キーを抜く。
    C: 前進する動きに対抗するために、バック（リバース）に入れる。
    D: 車輪をロックさせるために、できるだけ強くブレーキを踏みつける。
  answer: A
  explanation: アクセルペダルが戻らなくなった場合、マニュアルでは、ニュートラルに入れ、車輪をロックさせないようにブレーキを強く踏むこと、またペダルを軽く叩いたり、安全に停車できる場所を見つけたりすることを推奨しています。
- id: 271
  category: defensive_driving
  question: 走行中にタイヤがパンク（バースト）した場合、まず何をすべきですか？
  choices:
    A: すぐに急ブレーキをかけて素早く停止する。
    B: ハンドルをしっかりと握り、車両を直進させるように努める。
    C: ハンドルを路肩側に急に切る。
    D: 車両の制御を維持するために、わずかに加速する。
  answer: B
  explanation: タイヤのパンクが発生した場合は、ハンドルをしっかりと握り、道路の自車線側で車両を直進させるように努めてください。すぐにブレーキを踏むのではなく、アクセルから足を離して速度を落とします。
- id: 272
  category: safe_driving_rules
  question: 車両が故障し、助けが必要な場合、他のドライバーにどのように合図を送るべきですか？
  choices:
    A: 道路の真ん中に立ち、腕を振る。
    B: 左側のドアハンドルまたはラジオアンテナに白い布を縛り付け、ボンネットを上げる。
    C: ハイビームを連続的に点滅させる。
    D: リアバンパーに赤い旗を置き、車両の後ろに立つ。
  answer: B
  explanation: 車両が故障して助けが必要な場合、マニュアルでは、左側のドアハンドルまたはラジオアンテナに白い布を縛り付け、車両のボンネットを上げるように定められています。
- id: 273
  category: defensive_driving
  question: 対向車がセンターラインを越えて自車の進路に入ってきた場合、どうすべきですか？
  choices:
    A: 避けるために左車線へハンドルを切る。
    B: 素早く通り過ぎるために加速する。
    C: 直ちに減速し、クラクションを鳴らし、右側（路肩側）に寄る。
    D: 自車線内で直ちに停止し、ヘッドライトを点滅させる。
  answer: C
  explanation: 対向車がセンターラインを越えて進路に入ってきた場合は、直ちに減速し、クラクションを鳴らし、たとえ道路外に出ることになっても右側（路肩側）に寄ってください。
- id: 274
  category: defensive_driving
  question: 車両が舗装路から外れて路肩に脱輪した場合、どうすべきですか？
  choices:
    A: 直ちにブレーキをかけ、ハンドルを道路側に急に引き戻す。
    B: ゆっくりとアクセルから足を離し、そのまま直進する。
    C: 舗装路に素早く戻るために加速する。
    D: ニュートラルに入れ、停止するまで惰性で進む。
  answer: B
  explanation: 車両が舗装路から外れた場合、すぐにブレーキをかけたり、無理にハンドルを戻そうとしたりしてはいけません。代わりに、ゆっくりとアクセルから足を離し、そのまま直進してください。
- id: 275
  category: defensive_driving
  question: スリップ（横滑り）が発生した場合、ハンドルをどの方向に切るべきですか？
  choices:
    A: 車両の後部が滑っている方向とは逆の方向。
    B: ハンドルを完全に真っ直ぐに保つ。
    C: 車両の後部が滑っている方向。
    D: スリップの方向に関わらず、道路の右側の路肩方向。
  answer: C
  explanation: スリップが発生した場合は、アクセルから足を離し、車両の後部が滑っている方向にハンドルを切ってください。
- id: 276
  category: defensive_driving
  question: 後方から追突されそうになり、かつ前方に車両がいない場合、どうすべきですか？
  choices:
    A: アクセルを踏み、できるだけ素早く離れる。
    B: 衝撃に備えて急ブレーキをかける。
    C: バック（後退）ギアに入れて後退する。
    D: エンジンを切り、シートベルトを外す。
  answer: A
  explanation: 後方から追突されそうになり、前方に車両がいない場合、マニュアルではアクセルを強く踏んでできるだけ素早く離れることが推奨されています。
- id: 277
  category: driver_responsibility
  question: 事故現場で停止して救護活動を行う個人を、法律はどのように保護していますか？
  choices:
    A: 活動に費やした時間に対する金銭的補償を保証する。
    B: 意図的な不正行為や乱暴な行為を除き、民事責任から保護する。
    C: 将来のすべての交通違反に対する免責を与える。
    D: 過失のあるドライバーの保険会社から報酬を支払うよう義務付ける。
  answer: B
  explanation: 法律は、事故現場で停止して救護活動を行う人を、意図的な不正行為や乱暴な行為がある場合を除き、民事責任から保護しています。
- id: 278
  category: defensive_driving
  question: スリップ（横滑り）が発生した場合、どうすべきですか？
  choices:
    A: ブレーキをしっかりかけ、ハンドルを真っ直ぐに保つ。
    B: 後部が滑っている方向とは逆の方向にハンドルを切る。
    C: 車両の後部が滑っている方向にハンドルを切る。
    D: トラクションを回復させるために素早く加速する。
  answer: C
  explanation: スリップが発生した場合は、アクセルから足を離し、車両の後部が滑っている方向にハンドルを切ってください。
- id: 279
  category: safe_driving_rules
  question: 死傷者のいない本線上での事故に巻き込まれた場合、車両をどうすべきですか？
  choices:
    A: 警察が到着するまで、そのままの場所に放置する。
    B: 安全に運転できる状態であれば、走行車線から路肩へ移動させる。
    C: 直ちに最寄りの修理工場まで運転していく。
    D: 車両を放棄して安全な場所まで歩く。
  answer: B
  explanation: 本線上で事故が発生し、死傷者がいない場合、自力で安全に走行できるのであれば、各車両を走行車線から路肩へ移動させる必要があります。
- id: 280
  category: penalties_and_points
  question: 法律により、警察へ事故の即時報告が義務付けられているのはどのような場合ですか？
  choices:
    A: 死亡者が出た場合のみ。
    B: 物損額が5,000ドルを超える場合のみ。
    C: 死傷者が出た場合、または物損の総額が1,000ドル以上と思われる場合。
    D: 3台以上の車両が事故に関与した場合。
  answer: C
  explanation: 死傷者が出た場合、または車両やその他の財産の損害総額が1,000ドル以上に達すると思われる場合は、法律により、直ちに最寄りの警察官または警察機関に報告することが義務付けられています。
- id: 281
  category: driver_responsibility
  question: 事故で物件を損壊し、所有者が不明な場合、どうしなければなりませんか？
  choices:
    A: 直ちに現場を離れる。
    B: 現場でちょうど1時間待つ。
    C: 収集できるすべての情報を書き留め、最寄りの警察官に提出する。
    D: 損壊した物件に電話番号を記したメモを残す。
  answer: C
  explanation: 他の車両の同乗者や損壊した物件の所有者がわからない場合は、収集できるすべての情報を書き留め、最寄りの警察官に提出してください。
- id: 282
  category: penalties_and_points
  question: 赤信号で右折する際、歩行者に道を譲らなかった場合の罰則は何ですか？
  choices:
    A: 初回違反は警告。
    B: 100ドル以上500ドル以下の罰金。
    C: 30日間の免許停止（義務的）。
    D: ちょうど50ドルの罰金。
  answer: B
  explanation: このような状況で歩行者に道を譲らなかった場合、100ドル以上500ドル以下の罰金が科せられます。
- id: 283
  category: signs_and_signals
  question: 黄色の矢印の信号は何を示していますか？
  choices:
    A: 「保護された」青の矢印信号が、通常の円形の青信号、円形の赤信号、または赤の矢印信号に変わろうとしていること。
    B: 道を譲ることなく右左折する優先権があること。
    C: 直ちに停止し、青に変わるまで進んではならないこと。
    D: 信号機が故障していること。
  answer: A
  explanation: 黄色の矢印は、「保護された」青の矢印信号が、通常の円形の青信号、円形の赤信号、または赤の矢印信号に変わろうとしていることを示します。
- id: 284
  category: signs_and_signals
  question: 停電により信号機が故障している交差点に近づく際、どのように進むべきですか？
  choices:
    A: 右側の車両に道を譲り、停止せずに進む。
    B: すべての進入路に一時停止標識がある交差点として扱う。
    C: 警察官が到着するまで待つ。
    D: 交差点を「譲れ（yield）」の標識があるものとして扱う。
  answer: B
  explanation: 停電により信号機が故障している交差点に近づく際は、すべての進入路に一時停止標識がある交差点であるかのように進む必要があります。
- id: 285
  category: signs_and_signals
  question: 赤の点滅信号は何を意味しますか？
  choices:
    A: 減速し、注意して進む。
    B: 停止し、信号が青に変わるのを待つ。
    C: 一時停止標識と同じ意味。
    D: 対向車に道を譲るが、停止はしない。
  answer: C
  explanation: 赤の点滅信号は一時停止標識と同じ意味です。停止し、接近する車両の妨げにならずに交差点に進入できるようになるまで進んではいけません。
- id: 286
  category: signs_and_signals
  question: 右左折時に黄色の点滅矢印が表示されている場合、運転者はどうしなければなりませんか？
  choices:
    A: 停止し、点灯した青の矢印を待つ。
    B: 右左折は許可されているが、運転者は対向車や歩行者に道を譲らなければならない。
    C: 運転者に優先権があり、対向車が道を譲らなければならない。
    D: 信号が赤に変わるため、停止の準備をする。
  answer: B
  explanation: 黄色の点滅矢印が表示されている場合、示された方向への右左折は許可されますが、運転者は対向車や歩行者に道を譲らなければなりません。
- id: 287
  category: signs_and_signals
  question: 点灯した青の矢印信号でUターン（転回）をする際、どうしなければなりませんか？
  choices:
    A: 両方の進行方向にそれぞれの青の矢印が出ている場合、対向する右折車に道を譲る。
    B: どの車両にも道を譲らずに進む。
    C: 停止し、円形の青信号を待つ。
    D: 後方のすべての車両に道を譲る。
  answer: A
  explanation: Uターンする車両は、両方の動きに同時にそれぞれの青の矢印信号が出ている場合、対向する右折車に道を譲る必要があります。
- id: 288
  category: signs_and_signals
  question: ランプメーターの信号が消灯している、または光を発していない場合、どうすべきですか？
  choices:
    A: 停止し、信号が青に変わるのを待つ。
    B: 4方向一時停止として扱う。
    C: 停止せずに進み、通常通り合流または譲り合いを行ってフリーウェイに進入する。
    D: 路肩に停車し、故障した信号を報告する。
  answer: C
  explanation: 表示が消灯している、または赤や青の表示が出ていない場合、車両は停止せずに進み、通常の状況が許す限り合流または譲り合いを行ってフリーウェイに進入することができます。
- id: 289
  category: signs_and_signals
  question: 歩行者によって最初に作動した際、ハイブリッド・ビーコンはどのように動作しますか？
  choices:
    A: 直ちに赤の点灯に変わる。
    B: 黄色に点滅し、次に黄色に点灯、その後赤に点灯して、車両が安全に停止できるようにする。
    C: 歩行者が横断を終えるまで赤に点滅し続ける。
    D: 歩行者用に青の矢印を表示する。
  answer: B
  explanation: 作動すると、ビーコンは数秒間黄色に点滅し、その後数秒間黄色に点灯、さらに赤に点灯して、走行中の車両が安全に停止できるようにします。
- id: 290
  category: signs_and_signals
  question: 一時停止標識は通常どこに設置されていますか？
  choices:
    A: 交差点のラインのちょうど真上。
    B: 交差点から6〜50フィートの場所。
    C: 交差点の手前100フィート。
    D: 交差点から50〜100フィートの場所。
  answer: B
  explanation: 一時停止標識は通常、交差点から6〜50フィートの場所に設置されています。
- id: 291
  category: signs_and_signals
  question: 一時停止標識の場所に停止線や横断歩道の標示がない場合、運転者はどこで停止しなければなりませんか？
  choices:
    A: 一時停止標識の真横。
    B: 交差する道路の10フィート手前。
    C: 交差する道路が見渡せる、交差点に入る直前。
    D: 交通状況を確認するために交差点の中央。
  answer: C
  explanation: 停止線や横断歩道の標示がない場合、運転者は交差する道路が見渡せる、交差点に入る直前で停止しなければなりません。
- id: 292
  category: signs_and_signals
  question: 「譲れ（YIELD）」の標識の形と色は何ですか？
  choices:
    A: 八角形で赤と白
    B: 頂点が下を向いた三角形で赤と白
    C: ひし形で黒と黄色
    D: ペナント型（三角旗型）で黄色と黒
  answer: B
  explanation: マニュアルによると、「譲れ」の標識は頂点が下を向いた三角形で、赤と白の色をしており、大きな文字で「YIELD」と書かれています。
- id: 293
  category: signs_and_signals
  question: ペナント型（三角旗型）の黄色い「追い越し禁止（DO NOT PASS）」の警告標識はどこに設置されていますか？
  choices:
    A: 道路の右側
    B: 交差点の中央上空に吊り下げられている
    C: 道路の左側
    D: カーブの手前の右側の路肩
  answer: C
  explanation: マニュアルには、ペナント型の黄色い警告標識は道路の左側に設置され、追い越し禁止区間の始まりを示していると記載されています。
- id: 294
  category: signs_and_signals
  question: オレンジ色に黒の文字が書かれたひし形の標識は、運転者に何を警告していますか？
  choices:
    A: 踏切
    B: スクールゾーン
    C: 工事または保守区域
    D: 追い越し禁止区間
  answer: C
  explanation: オレンジ色に黒の文字が書かれたひし形の注意・警告標識は、工事または保守区域について警告しています。
- id: 295
  category: signs_and_signals
  question: 踏切の事前警告を行う標識はどれですか？
  choices:
    A: 黄色の背景に黒の十字と「RR」の文字が書かれた円形の標識
    B: 白地に黒で「RAILROAD CROSSING」と書かれたX字型の標識
    C: 黄色のひし形で黒い列車のシンボルが描かれた標識
    D: 黒い十字が描かれた五角形の標識
  answer: A
  explanation: 黄色の背景に黒の十字と黒の「RR」の文字が書かれた円形の標識が、踏切の事前警告を行います。
- id: 296
  category: signs_and_signals
  question: 五角形の標識は運転者に何を警告していますか？
  choices:
    A: 病院区域
    B: スクールゾーンまたは通学路の横断歩道
    C: 歩行者用横断歩道
    D: この先の停止標識
  answer: B
  explanation: 五角形の標識は、スクールゾーンや通学路の横断歩道を警告しており、運転者は特に子供に注意を払う必要があります。
- id: 297
  category: signs_and_signals
  question: マニュアルによると、奇数番号のハイウェイは一般的にどの方向に走っていますか？
  choices:
    A: 東西
    B: 南北
    C: 都市の周りを回る環状線
    D: 州を斜めに横断する
  answer: B
  explanation: マニュアルには、奇数番号のハイウェイは一般的に南北に走っていると記載されています。
- id: 298
  category: signs_and_signals
  question: ノースカロライナ（N.C.）州道のルートマーカー（路線番号標識）はどのような形をしていますか？
  choices:
    A: 盾型
    B: 長方形
    C: ひし形
    D: 円形
  answer: C
  explanation: 案内・情報標識のセクションによると、ノースカロライナ州のルートマーカーはひし形です。
- id: 299
  category: safe_driving_rules
  question: 道路上の黄色の路面標示の目的は何ですか？
  choices:
    A: 同じ方向に進む車線を分けるため
    B: 道路の右端を示すため
    C: 横断歩道を示すため
    D: 反対方向に進む車線を分けるため
  answer: D
  explanation: 黄色の線は反対方向に進む車線を分け、白の線は同じ方向に進む車線を分けます。
- id: 300
  category: safe_driving_rules
  question: 双方向の左折専用に予約された中央車線に関して、正しいものはどれですか？
  choices:
    A: 遅い車両を追い越すために使用できる
    B: 追い越しや交通への合流に使用してはならない
    C: 緊急車両専用である
    D: ラッシュアワー時に通常の走行車線として使用できる
  answer: B
  explanation: マニュアルには、双方向左折車線は他車の追い越しや交通への合流目的で使用してはならないと明記されています。
- id: 301
  category: safe_driving_rules
  question: 道路にある赤色の反射式道路鋲（ロードマーカー）は、運転者に何を示していますか？
  choices:
    A: 近くの消火栓の場所
    B: 学校区域の接近
    C: 逆走（進入禁止方向への走行）
    D: 踏切の接近
  answer: C
  explanation: 赤色のマーカーは、運転者に逆走を示します。青色の反射式道路鋲は、近くの消火栓の場所を示します。
- id: 302
  category: safe_driving_rules
  question: 信号機が作動している交差点で交通警察官が交通整理を行っている場合、どうすべきですか？
  choices:
    A: 信号機に従う
    B: 信号機ではなく、警察官の手信号に従う
    C: 交差点を全方向一時停止（4-way stop）として扱う
    D: 警察官に合図するためにクラクションを鳴らす
  answer: B
  explanation: 特別な状況下では、警察官が交通の流れを誘導することがあります。その場合、通常の信号機や標識ではなく、警察官の手信号に従わなければなりません。
- id: 303
  category: sharing_the_road
  question: 自転車利用者は、酒気帯び・薬物影響下運転（DWI）に関する法律の対象となりますか？
  choices:
    A: いいえ、自転車は原動機付き車両ではないため
    B: はい、州法で自転車は車両とみなされるため
    C: 州道を走行している場合のみ
    D: 衝突事故を起こした場合のみ
  answer: B
  explanation: 自転車は車両であるため、自転車利用者は他の運転者と同様の交通法規を守らなければならず、これにはDWI法も含まれます。
- id: 304
  category: sharing_the_road
  question: 夜間に自転車に乗る際、法律で義務付けられている灯火装置は何ですか？
  choices:
    A: 少なくとも300フィート先から見える前照灯と、少なくとも200フィート先から見える赤色の尾灯または反射板
    B: 500フィート先から見える前照灯と、500フィート先から見える赤色の尾灯
    C: 100フィート先から見える赤色の反射板のみ
    D: 反射材付きの衣類とヘルメットの点滅ライト
  answer: A
  explanation: 夜間、法律では自転車に少なくとも300フィートの距離から見える前照灯と、少なくとも200フィートの距離から見える赤色の尾灯または反射板を装備することが義務付けられています。
- id: 305
  category: sharing_the_road
  question: 自転車は車道のどちらの方向に進むべきですか？
  choices:
    A: 対向車が見えるように、交通の流れに逆らって進む
    B: 道路の左側を進む
    C: 交通の流れに沿って、道路の右側を進む
    D: 可能な限り歩道を進む
  answer: C
  explanation: 自転車利用者が交通の流れに逆らわず、流れに沿って進むことは特に重要です。交通の流れと同じ右側を走行しなければなりません。
- id: 306
  category: sharing_the_road
  question: 法律により、承認された保護用自転車ヘルメットの着用が義務付けられているのは誰ですか？
  choices:
    A: 年齢に関わらずすべての自転車利用者
    B: 州間高速道路を走行する自転車利用者のみ
    C: 16歳未満のすべての自転車運転者および同乗者
    D: 自転車用座席に乗っている同乗者のみ
  answer: C
  explanation: 16歳未満のすべての自転車運転者および同乗者は、承認された保護用自転車ヘルメットを着用し、サドル席に座らなければなりません。
- id: 307
  category: sharing_the_road
  question: 同乗者が自転車用チャイルドシート（拘束座席）に座る必要がある体重と身長の要件は何ですか？
  choices:
    A: 体重30ポンド未満または身長30インチ未満
    B: 体重40ポンド未満または身長40インチ未満
    C: 体重50ポンド未満または身長48インチ未満
    D: 体重60ポンド未満または身長50インチ未満
  answer: B
  explanation: マニュアルによると、体重40ポンド未満または身長40インチ未満の同乗者は、自転車用チャイルドシートに座らせなければなりません。
- id: 308
  category: safe_driving_rules
  question: 歩行者として道路を歩く際、どこを歩くべきですか？
  choices:
    A: 交通の流れと同じ方向に、道路の右側を歩く
    B: 対向車に向き合うように、道路の右側を歩く
    C: 対向車に向き合うように、道路の左側を歩く
    D: 交通の流れと同じ方向に、道路の左側を歩く
  answer: C
  explanation: マニュアルには、歩行者は常に対向車と向き合うように道路の左側を歩くべきであると記載されています。
- id: 309
  category: sharing_the_road
  question: マニュアルによると、自動車事故で死亡する歩行者の大部分を占めるのはどのグループですか？
  choices:
    A: ティーンエイジャーと若年成人
    B: 建設作業員とジョギング中の人
    C: 横断歩道や交差点を歩いている人
    D: 子供、高齢者、またはアルコール飲料を飲んでいた人
  answer: D
  explanation: マニュアルでは、死亡する歩行者の多くは子供、高齢者、またはアルコール飲料を飲んでいた人であると指摘しています。
- id: 310
  category: sharing_the_road
  question: セミトレーラーの後方の死角（ノーゾーン/NO-ZONE）は、後方にどのくらいの距離まで及んでいますか？
  choices:
    A: 最大50フィート
    B: 最大100フィート
    C: 最大200フィート
    D: 最大300フィート
  answer: C
  explanation: トラック運転手には、乗用車が視界から消えてしまう深刻な死角（ノーゾーン）があり、それには後方最大200フィートまでが含まれます。
- id: 311
  category: defensive_driving
  question: トラクター・トレーラーと道路を共有する際の一般的なルールは何ですか？
  choices:
    A: トラックのタイヤが見えれば、安全な距離にいます
    B: サイドミラーにトラックの運転手が見えない場合、運転手からもあなたが見えていません
    C: 大型トラックを追い越すときは、常に右側から追い越してください
    D: 空気抵抗を減らし燃費を向上させるために、トラックに車間距離を詰め（テールゲート）て走行してください
  answer: B
  explanation: トラクター・トレーラーと道路を共有する際の一般的なルールは、「サイドミラーにトラックの運転手が見えない場合、運転手からもあなたが見えていない」というものです。
- id: 312
  category: sharing_the_road
  question: トレーラーと牽引車を安全に追い越すには、どのくらいの距離の空き道路が必要ですか？
  choices:
    A: 1/4マイル
    B: 1/2マイル
    C: 3/4マイル
    D: 1マイル
  answer: B
  explanation: トレーラーと牽引車を追い越す際は、安全に追い越すために1/2マイル（約800メートル）の空き道路が必要になる場合があるため、細心の注意を払う必要があります。
- id: 313
  category: safe_driving_rules
  question: モペッド（原動機付自転車）を追い越す際、左側に少なくともどのくらいの距離を空けなければなりませんか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 4フィート
  answer: B
  explanation: モペッドは車線の右側を走行する必要があります。モペッドを追い越す際は、左側に少なくとも2フィート（約60センチメートル）の距離を空けなければなりません。
- id: 314
  category: sharing_the_road
  question: ノースカロライナ州における乗用車が関与するオートバイ事故のほとんどにおいて、通常どちらに過失がありますか？
  choices:
    A: オートバイの運転手
    B: 乗用車の運転手
    C: 両方の運転手に等しく過失がある
    D: どちらでもない（通常は天候が主な要因であるため）
  answer: B
  explanation: ノースカロライナ州のオートバイ事故の約3分の2には乗用車が関与しています。これらの事故のほとんどは、通常「オートバイが見えなかった」と主張する乗用車の運転手に過失があります。
- id: 315
  category: license_system
  question: ノースカロライナ州の公道でモペッドを運転するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
