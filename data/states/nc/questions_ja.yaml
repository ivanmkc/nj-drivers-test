    B: 走行車線で直ちに停止する。
    C: ハザードランプ（4方向フラッシャー）を点灯させ、速度を約10 mph落として、安全な場所まで走行を続ける。
    D: ヘッドライトを消して芝生の上に車を寄せる。
  answer: C
  explanation: 明らかな安全な停止場所がない場合は、ハザードランプ（緊急4方向フラッシャー）を点灯させ、速度を約10 mph落として警察官に合図を送り、最寄りの安全な場所まで走行を続けてください。
- id: 169
  category: defensive_driving
  question: 覆面パトカーに停止を求められ、それが本物の警察官であるかどうかについて正当な懸念がある場合、推奨される行動は何ですか？
  choices:
    A: 車を寄せるのを拒否して家に帰る。
    B: 車を寄せる前に9-1-1に電話して、警察官であることを確認する。
    C: 車を寄せるが、窓を開けるのを拒否する。
    D: 最寄りの警察署まで加速する。
  answer: B
  explanation: 覆面パトカーに停止を求められ、正当な懸念がある場合は、車を寄せる前に9-1-1に電話して、本物の警察官が停止を行っているか確認することができます。
- id: 170
  category: safe_driving_rules
  question: 夜間に警察官に停止させられた場合、視認性を高めるために何をすべきですか？
  choices:
    A: ハイビームのヘッドライトを点灯する。
    B: 停止したらすぐに車内のルームランプを点灯する。
    C: 窓から懐中電灯を照らす。
    D: 車両のすべてのライトを消す。
  answer: B
  explanation: 夜間の場合は、警察官が車内を見やすくするために、停止したらすぐに車内のルームランプ（室内灯）を点灯する必要があります。
- id: 171
  category: driver_responsibility
  question: 交通違反の取り締まり（トラフィックストップ）で停車させられた際、あなたが隠し武器の携帯許可証（concealed weapon permit）を持っており、車内に武器がある場合、どうしなければなりませんか？
  choices:
    A: 武器を座席の下に隠す。
    B: すぐに警察官に武器を渡す。
    C: その事実を警察官に伝える。
    D: 警察官が近づいてくる前に、武器をグローブボックスに入れる。
  answer: C
  explanation: あなたまたは同乗者が隠し武器の携帯許可証を持っており、車内に武器がある場合、その事実を警察官に伝えなければなりません。
- id: 172
  category: penalties_and_points
  question: 交通違反切符（トラフィックチケット）の受け取りと署名は何を意味しますか？
  choices:
    A: 罪を認めたこと。
    B: 裁判所の審問を受ける権利を放棄したこと。
    C: 罪を認めたことにはならない。
    D: 警察官の決定に同意したこと。
  answer: C
  explanation: マニュアルには、交通違反切符の受け取りと署名は罪を認めるものではないと明記されています。
- id: 173
  category: penalties_and_points
  question: ノースカロライナ州法によれば、交通違反の取り締まり中に法執行官（警察官）に抵抗、遅延、または妨害する行為は、どのように分類されますか？
  choices:
    A: 第1級重罪（Class 1 felony）。
    B: 第2級軽犯罪（Class 2 misdemeanor）。
    C: 交通違反（Traffic infraction）。
    D: 警告対象の違反（Warning offense）。
  answer: B
  explanation: 交通違反の取り締まり中に法執行官に抵抗、遅延、または妨害する行為は、第2級軽犯罪（Class 2 misdemeanor）となります（N.C.G.S.
    §14-223）。
- id: 174
  category: sharing_the_road
  question: 農業用機械が関与する衝突事故の多くは、どのような状況で発生しますか？
  choices:
    A: 未舗装道路での大雨や大雪の時。
    B: 照明の不十分な田舎道の夜間。
    C: 晴れた日の日中、乾燥した舗装路面。
    D: 砂利道での霧の深い朝。
  answer: C
  explanation: 農業用機械が関与する衝突事故の多くは、晴れた日の日中、および/または乾燥した舗装路面で発生しています。
- id: 175
  category: sharing_the_road
  question: 農業用機械で発生する典型的な衝突事故の種類は何ですか？
  choices:
    A: 正面衝突と追突事故。
    B: 側面衝突（こすり合わせ）と角度のある衝突（交差衝突）。
    C: 横転と単独事故。
    D: 後退時の衝突と駐車場での衝突。
  answer: B
  explanation: 農業用機械の典型的な衝突事故には、側面衝突（こすり合わせ）や角度のある衝突（交差衝突）が含まれ、これらは機械が左折する際によく発生します。
- id: 176
  category: safe_driving_rules
  question: 交通違反の取り締まりで停車させられた際、後部座席の同乗者は手をどこに置くべきですか？
  choices:
    A: ポケットの中。
    B: 車の天井。
    C: 前部座席の背もたれ。
    D: 窓の外。
  answer: C
  explanation: 交通違反の取り締まり中、後部座席の同乗者は、警察官からはっきりと見えるように、前部座席の背もたれに手を置く必要があります。
- id: 177
  category: sharing_the_road
  question: ノースカロライナ州において、農業用機械の走行が法的に禁止されているのはどの種類の道路ですか？
  choices:
    A: 郊外の道路
    B: 州間高速道路（Interstates）
    C: 2車線の田舎の幹線道路
    D: 未舗装の公道
  answer: B
  explanation: マニュアルには、農業用機械は州間高速道路（Interstates）を除くノースカロライナ州のほとんどの道路を走行する法的権利があると記載されています。
- id: 178
  category: vehicle_information
  question: 道路を走行する農業用機械には、どのような照明が必要ですか？
  choices:
    A: 1000フィート先から見える前部の白色灯2つと後部の赤色灯2つ
    B: 最大500フィート先から見える前部の白色灯1つと後部の赤色灯1つ
    C: 屋根の上の点滅する黄色いビーコン
    D: 常に後部の赤色反射板のみが必要
  answer: B
  explanation: 農業用機械には、前部の白色灯1つと、最大500フィート先から見える後部の赤色灯1つ（または直径4インチ以上の赤色反射板2つ）の装備が義務付けられています。
- id: 179
  category: sharing_the_road
  question: 葬列（funeral procession）に参加するすべての車両は、何を点灯させなければなりませんか？
  choices:
    A: ハイビームのヘッドライトのみ
    B: ヘッドライトとハザードランプ
    C: 車内のルームランプ
    D: 左折シグナル（ウィンカー）
  answer: B
  explanation: 葬列に参加するすべての車両はヘッドライトを点灯させなければならず、装備されている場合はハザードランプも点灯させなければなりません。
- id: 180
  category: sharing_the_road
  question: 同じ方向に進行している運転手が、葬列を追い越すことが合法となるのはどのような場合ですか？
  choices:
    A: 葬列が20 mph未満の速度で進んでいる場合
    B: 幹線道路に、同じ方向に進む交通用の車線が2車線以上標示されている場合
    C: 運転手が追い越す前にクラクションを鳴らした場合
    D: 葬列を追い越すことはいかなる場合も違法である
  answer: B
  explanation: 同じ方向に進行している車両の運転手は、幹線道路に同じ方向に進む交通用の車線が2車線以上標示されている場合を除き、葬列を追い越してはなりません。
- id: 181
  category: safe_driving_rules
  question: 複数車線の幹線道路（ハイウェイ）で、標識に示された制限速度より遅い速度で運転している場合、どこを走行すべきですか？
  choices:
    A: 一番左の車線
    B: 中央の車線
    C: 一番右の車線
    D: 右車線と中央車線をまたいで
  answer: C
  explanation: 複数車線の幹線道路で制限速度より遅い速度で走行している場合は、追い越し、左折、または障害物を避ける場合を除き、一番右の車線を走行してください。
- id: 182
  category: safe_driving_rules
  question: 理想的な条件下で、時速55マイルで走行している車両が完全に停止するまでに、およそ何フィート必要ですか？
  choices:
    A: 100フィート
    B: 150フィート
    C: 211フィート
    D: 300フィート
  answer: C
  explanation: 理想的な条件であっても、時速55マイルで走行している場合、車両が完全に停止するには約211フィートの距離が必要です。
- id: 183
  category: safe_driving_rules
  question: 別の標識がない限り、市街地や町での最高制限速度は時速何マイルですか？
  choices:
    A: 時速25マイル (25 mph)
    B: 時速35マイル (35 mph)
    C: 時速45マイル (45 mph)
    D: 時速55マイル (55 mph)
  answer: B
  explanation: 別の標識がない限り、市街地や町での制限速度は時速35マイル（35 mph）です。
- id: 184
  category: defensive_driving
  question: カーブに近づく際のブレーキ操作として、最も適切な方法は何ですか？
  choices:
    A: カーブの途中でしっかりとブレーキをかける
    B: カーブ内でブレーキをかけずに済むよう、カーブに入る前に減速する
    C: 加速してカーブに入り、出口でブレーキをかける
    D: カーブを曲がっている間、継続的にポンピングブレーキを行う
  answer: B
  explanation: カーブに対処する最善の方法は、カーブ内でブレーキをかける必要がないように、カーブに入る前に減速することです。
- id: 185
  category: defensive_driving
  question: 下り坂を走行中にカーブに差し掛かった場合、どうすべきですか？
  choices:
    A: 下り坂を進む前に高いギアに変速する
    B: ニュートラルに変速して惰性でカーブを通過する
    C: 下り坂を進む前に低いギアに変速する
    D: 燃料を節約するためにエンジンを切る
  answer: C
  explanation: 下り坂を走行中にカーブに差し掛かった場合は、下り坂を進む前に低いギアに変速し、早めにブレーキをかけ始める必要があります。
- id: 186
  category: safe_driving_rules
  question: 「2秒ルール」は何を判断するために使用されますか？
  choices:
    A: 一時停止標識で待機しなければならない時間
    B: 自分の車と前方の車との間の安全な車間距離
    C: 車線変更前に方向指示器（ウィンカー）を出しておくべき時間
    D: 道路から目を離してもよい最大時間
  answer: B
  explanation: 「2秒ルール」とは、前方の車がある地点を通過してから自分の車が同じ地点に到達するまでに2秒の間隔を空けるべきであるというもので、これにより安全な車間距離を確保します。
- id: 187
  category: defensive_driving
  question: 車線変更をする前に、肩越しに後方を確認することが重要なのはなぜですか？
  choices:
    A: 警察車両が後ろから来ていないか確認するため
    B: ルームミラーが正しく調整されているか確認するため
    C: 死角に他の車両がいないことを確認するため
    D: 後続車の速度を確認するため
  answer: C
  explanation: 車線変更に関する重要なルールには、死角に他の車両がいないことを確認するために肩越しに後方を確認することが含まれます。
- id: 188
  category: safe_driving_rules
  question: マニュアルによると、他の車両を追い越す前にクラクションを鳴らす目的は何ですか？
  choices:
    A: 対向車に道を譲るよう警告するため
    B: 前方の運転手に、追い越しを協力する法的な義務を負わせるため
    C: 歩行者に道路を空けるよう合図するため
    D: 自分が制限速度を超えて走行していることを示すため
  answer: B
  explanation: マニュアルには、前方の運転手に合図するためにクラクションを鳴らすよう記載されています。クラクションの合図により、追い越される車両の運転手には、追い越しに協力する法的な義務が生じるためです。
- id: 189
  category: safe_driving_rules
  question: 右折する際、道路の右端に寄るべきなのはなぜですか？
  choices:
    A: より速い車両が自分の左側を追い越せるようにするため
    B: 自分の車と縁石の間に他の車両が入り込むのを防ぐため
    C: 対向車の視界を良くするため
    D: 信号機のセンサーを反応させないようにするため
  answer: B
  explanation: 右折の際は、自分の車と縁石の間に他の車両が入り込めないように、道路の右端に寄ってください。
- id: 190
  category: safe_driving_rules
  question: 追い越しをする際、追い越す車両の左側と最低限どれだけの距離を保たなければなりませんか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 4フィート
  answer: B
  explanation: 法律により、追い越しをする運転手は、追い越される車両の左側から少なくとも2フィート離れて通過することが義務付けられています。
- id: 191
  category: safe_driving_rules
  question: カーブや坂道で他の車両を追い越すことが違法となるのはどのような場合ですか？
  choices:
    A: 前方が少なくとも500フィート見えない場合
    B: 前方が少なくとも200フィート見えない場合
    C: 前方が少なくとも100フィート見えない場合
    D: 前方が少なくとも300フィート見えない場合
  answer: A
  explanation: 運転手が前方を少なくとも500フィート見通せないカーブや坂道での追い越しは、常に危険であり、通常は違法です。
- id: 192
  category: safe_driving_rules
  question: 右側からの追い越しが許可されているのは、次のどの状況ですか？
  choices:
    A: 黄色の実線がある2車線道路
    B: 左折車線にいる車両を追い越す場合
    C: 地方のすべての交差点
    D: 前方の車両の走行が遅すぎる場合
  answer: B
  explanation: 右側からの追い越しが許可される例外として、左折車線にいる車両を追い越す場合が含まれます。
- id: 193
  category: penalties_and_points
  question: 追い越し車両に進路を譲らずに速度を上げ、その結果、人身傷害または器物損壊を伴う衝突事故を引き起こした場合の罰則は何ですか？
  choices:
    A: 書面による警告
    B: 重罪（Felony）の告発
    C: 軽罪（Misdemeanor）の告発
    D: 即時の免許取り消し
  answer: C
  explanation: 追い越し車両に進路を譲らずに速度を上げ、人身傷害または器物損壊を伴う衝突事故が発生した場合、軽罪（Misdemeanor）として告発されます。
- id: 194
  category: safe_driving_rules
  question: 車両を後退（バック）させるときの最高速度はどれくらいですか？
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: 車両を後退させるときは、車両の制御や停止が難しくなるため、10 mphを超えないように非常にゆっくりと後退する必要があります。
- id: 195
  category: safe_driving_rules
  question: 後退中に車両の後方を完全に見渡すための正しいテクニックは何ですか？
  choices:
    A: ルームミラーとサイドミラーに完全に頼る
    B: 右手でハンドルを握り、運転席側の窓から外を見る
    C: 左手でハンドルを握り、右肩越しに後ろの窓から外を見る
    D: まっすぐ前を見たまま、同乗者に誘導を頼む
  answer: C
  explanation: 車両の後方を完全に見渡すには、左手でハンドルを握り、右肩越しに後ろの窓から外を見ます。ミラーだけに頼ってはいけません。
- id: 196
  category: safe_driving_rules
  question: 消火栓からどのくらい離れて駐車しなければなりませんか？
  choices:
    A: 少なくとも10フィート
    B: 少なくとも15フィート
    C: 少なくとも20フィート
    D: 少なくとも25フィート
  answer: B
  explanation: 消火栓や消防署の入り口から15フィート以内に駐車してはいけません。
- id: 197
  category: safe_driving_rules
  question: 高速道路の路肩に駐車する場合、駐車した車両は両方向から接近する運転手から少なくともどの距離から見える必要がありますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 駐車した車両が両方向から接近する運転手から少なくとも200フィートの距離から見えない限り、路肩への駐車は法律違反となります。
- id: 198
  category: defensive_driving
  question: 自動車が関与する死亡交通事故の3分の1以上はどこで発生していますか？
  choices:
    A: 州間高速道路
    B: 踏切
    C: 交差点
    D: 駐車場
  answer: C
  explanation: 交通事故は交差点で最も頻繁に発生し、自動車が関与する死亡交通事故の3分の1以上が交差点で発生しています。
- id: 199
  category: safe_driving_rules
  question: 標識や信号のない交差点に2台の車両が同時に到達した場合、どちらに優先権がありますか？
  choices:
    A: 左側の車両
    B: 右側の車両
    C: 速度が速い車両
    D: 左折する車両
  answer: B
  explanation: 標識や信号のない交差点で、2台以上の車両が同時に交差点に到達した場合、右側の車両に優先権があります。
- id: 200
  category: safe_driving_rules
  question: 対向する2台の車両が同時に交差点に接近し、一方が直進、もう一方が左折しようとしている場合、どちらに優先権がありますか？
  choices:
    A: 左折する運転手
    B: 直進する運転手
    C: 先に合図を出した運転手
    D: どちらの運転手にもない
  answer: B
  explanation: 一方の運転手が直進し、もう一方が左折しようとしている場合、左折しようとする運転手は待たなければなりません。したがって、直進する運転手に優先権があります。
- id: 201
  category: safe_driving_rules
  question: 交差点を直進している間、絶対にやってはいけないことは何ですか？
  choices:
    A: 車線変更
    B: 一定の速度を保つ
    C: 歩行者に注意する
    D: ハンドルから手を離さない
  answer: A
  explanation: マニュアルには「交差点を直進している間は、絶対に車線変更をしてはいけない」と明記されています。
- id: 202
  category: safe_driving_rules
  question: トラフィックサークルまたはラウンドアバウト（環状交差点）内のすべての車両は、どの方向に進みますか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: まっすぐ横切る
    D: 8の字を描くように
  answer: B
  explanation: トラフィックサークル内のすべての車両は、サークルの右側を反時計回りに進みます。
- id: 203
  category: safe_driving_rules
  question: ラウンドアバウトまたはトラフィックサークルでは、誰に優先権がありますか？
  choices:
    A: ラウンドアバウトに進入する車両
    B: すでにラウンドアバウト内にいる車両
    C: ラウンドアバウトから退出する車両
    D: より速い速度で走行している車両
  answer: B
  explanation: すでにサークル内にいる車両に優先権があり、進入する運転手は、すでにラウンドアバウト内にいる車両や自転車に道を譲らなければなりません。
- id: 204
  category: safe_driving_rules
  question: 現代のラウンドアバウトで通常要求される走行速度はどれくらいですか？
  choices:
    A: 5〜10 mph
    B: 15〜20 mph
    C: 25〜30 mph
    D: 35〜40 mph
  answer: B
  explanation: 現代のラウンドアバウトは古いトラフィックサークルよりもはるかに小さく、車両はより低い速度（15〜20 mph）で走行する必要があるため、より安全になっています。
- id: 205
  category: sharing_the_road
  question: ラウンドアバウトでは誰に優先権がありますか？
  choices:
    A: ラウンドアバウトに進入しようと接近している車両
    B: すでにラウンドアバウト内にいる車両と自転車
    C: ラウンドアバウトの中央を歩いている歩行者
    D: 右側から進入する車両
  answer: B
  explanation: マニュアルには、運転手はすでにラウンドアバウト内にいる車両や自転車に道を譲らなければならず、すでに内にいる者は接近してくる車両に道を譲る必要はないと記載されています。
- id: 206
  category: safe_driving_rules
  question: 複数車線のラウンドアバウトで左折またはUターンをする場合、どの車線を使用すべきですか？
  choices:
    A: 右車線
    B: 中央車線
    C: 左車線
    D: トラックエプロン
  answer: C
  explanation: 複数車線のラウンドアバウトでは、直進、左折、またはUターンをするために左車線を維持します。
- id: 207
  category: defensive_driving
  question: すでにラウンドアバウト内にいるときに、点滅するライトとサイレンを鳴らした緊急車両が接近してきた場合、どうすべきですか？
  choices:
    A: 通過させるために、ラウンドアバウト内ですぐに停止する
    B: ラウンドアバウトの内側の島（中央島）に幅寄せして停車する
    C: 速度を上げて、退出する前に曲がり切る
    D: まずラウンドアバウトから退出し、その後、幅寄せして停車する
  answer: D
  explanation: 緊急車両が接近してきたときにすでにラウンドアバウト内にいる場合、運転手はまず退出し、その後、緊急車両を通過させるために幅寄せして停車しなければなりません。
- id: 208
  category: safe_driving_rules
  question: 踏切で停止することが義務付けられている場合、最も近いレールからどれくらいの距離で停止する必要がありますか？
  choices:
    A: 25フィート以内、ただし10フィート以上
    B: 50フィート以内、ただし15フィート以上
    C: 100フィート以内、ただし25フィート以上
    D: ちょうど15フィート
  answer: B
  explanation: 車両の運転手は、踏切の最も近いレールから50フィート以内、ただし15フィート以上の距離で停止しなければならず、安全に進行できるようになるまで進んではなりません。
- id: 209
  category: sharing_the_road
  question: 列車は、次のどの車両に優先権を譲らなければなりませんか？
  choices:
    A: サイレンを鳴らしている警察車両
    B: 緊急事態に対応している救急車
    C: ライトを点滅させている消防車
    D: 上記のいずれでもない。列車は常に優先権を持つ
  answer: D
  explanation: 列車は、警察、消防、救急の緊急車両を含むすべての道路交通に対して優先権を持っています。
- id: 210
  category: defensive_driving
  question: 55 mphで走行している列車が完全に停止するまでに、およそどれくらいの距離が必要ですか？
  choices:
    A: 0.5マイル未満
    B: 約1500フィート
    C: 1マイル以上
    D: ちょうど500フィート
  answer: C
  explanation: 55 mphで走行している列車が停止するまでには、1マイル以上の距離が必要です。
- id: 211
  category: safe_driving_rules
  question: 踏切を渡っている途中で、警告灯が点滅し始めたり、遮断機が下り始めたりした場合はどうすればよいですか？
  choices:
    A: 直ちに停止して後退する
    B: そのまま進み続けて踏切を渡り切る
    C: 停止して車を乗り捨てる
    D: 車をバックギアに入れ、慎重に後退して出る
  answer: B
  explanation: 踏切を渡っている途中で警告灯が点滅し始めたり、遮断機が下り始めたりした場合は、停止したり後退したりせず、そのまま進み続けてください。警告信号は、渡り切るのに十分な時間的余裕をもって作動します。
- id: 212
  category: defensive_driving
  question: 踏切を渡り切る前に、向こう側の遮断機が下りてきた場合はどうすればよいですか？
  choices:
    A: 線路の上で停止し、電車を待つ
    B: 遮断機を避けるために車を後退させる
    C: 遮断機は柔軟な素材でできているため、そのまま押し切って進む
    D: 車から降りて手動で遮断機を持ち上げる
  answer: C
  explanation: 踏切の遮断機があなたや車を閉じ込めることはありません。そのまま遮断機を押し切って進んでください。遮断機は柔軟な素材でできており、進行を妨げることはありません。
- id: 213
  category: signs_and_signals
  question: 踏切にある緊急通報システム（ENS）の「青い標識（Blue Sign）」には、どのような情報が記載されていますか？
  choices:
    A: 電車の時刻表と制限速度
    B: 踏切の識別番号、鉄道会社名、および緊急連絡先の電話番号
    C: 次の高速道路の出口までの距離
    D: 地元の警察署の非緊急電話番号
  answer: B
  explanation: 「青い標識」として知られるENS標識には、踏切の識別番号、鉄道会社の名前、および緊急事態を報告するための緊急連絡先の電話番号が記載されています。
- id: 214
  category: defensive_driving
  question: 車が線路上またはその近くでエンストした場合、最初にすべきことは何ですか？
  choices:
    A: 少なくとも1分間はエンジンの再始動を試みる
    B: 車内に座ったままレッカー車を呼ぶ
    C: 直ちに車から降りて線路から離れる
    D: クラクションを鳴らして接近する電車に警告する
  answer: C
  explanation: 車が線路上またはその近くでエンストした場合は、直ちに車から降りてください。車および線路から離れてください。
- id: 215
  category: sharing_the_road
  question: 自転車は複数車線のラウンドアバウト（環状交差点）をどのように通行すべきですか？
  choices:
    A: ラウンドアバウトの路肩に沿って走る
    B: 適切な車線を選び、その車線の中央を走る
    C: 常にトラックエプロンを使用する
    D: 自転車から降りて、中央島を歩いて通り抜ける
  answer: B
  explanation: 自転車は複数車線のラウンドアバウトに進入する前に適切な車線を選び、選択した車線の中央を走行する必要があります。路肩に沿って走ってはいけません。
- id: 216
  category: safe_driving_rules
  question: 電車が踏切を通過した直後に、すぐに発進してはいけないのはなぜですか？
  choices:
    A: 警察官が手信号で通過を許可するのを待たなければならないため
    B: 遮断機のセンサーがリセットされるのに時間が必要なため
    C: 反対方向から別の電車が来ているか、最初の電車に続いて別の電車が来ている可能性があるため
    D: 踏切を渡る前に正確に3分間待たなければならないため
  answer: C
  explanation: 電車が通過した直後にすぐに発進してはいけません。反対方向から別の電車が来ているか、最初の電車に続いて別の電車が来ている可能性があります。
- id: 217
  category: sharing_the_road
  question: ラウンドアバウトにあるコンクリートの島、またはトラックエプロンの目的は何ですか？
  choices:
    A: 緊急車両用の指定駐車スペースである
    B: 歩行者が横断するための安全地帯である
    C: 大型トラックがラウンドアバウトを走行しやすくするためである
    D: 自転車専用の車線である
  answer: C
  explanation: 大型トラックは、ラウンドアバウトを走行しやすくするために、トラックエプロンと呼ばれるコンクリートの島を使用する必要があります。
- id: 218
  category: defensive_driving
  question: 次のうち、踏切での一時停止が義務付けられており、その後ろで停止する準備をしておくべき車両はどれですか？
  choices:
    A: オートバイと自転車
    B: スクールバスと危険物を輸送する車両
    C: 配達用バンとピックアップトラック
    D: サイレンを消している緊急車両
  answer: B
  explanation: スクールバス、乗客を乗せた自動車、ハイヤーなどの旅客運送車両、または爆発物や危険物を輸送する車両など、踏切で一時停止しなければならない車両のために停止する準備をしておいてください。
- id: 219
  category: safe_driving_rules
  question: 歩行者がラウンドアバウトを通行する際、どこを歩くべきですか？
  choices:
    A: ラウンドアバウトの中央を通り抜ける
    B: トラックエプロンに沿って歩く
    C: ラウンドアバウトの外側に沿って標示された横断歩道を歩く
    D: ラウンドアバウトの左車線を歩く
  answer: C
  explanation: 歩行者はラウンドアバウトの外側に沿って標示された横断歩道を使用し、中央を通り抜けてはいけません。
- id: 220
  category: sharing_the_road
  question: 交差点に接近し、通過する際に、自転車に特に注意を払うべきなのはなぜですか？
  choices:
    A: 自転車はすべての自動車に道を譲る義務があるため。
    B: 自転車は交差点で歩道を使用する義務があるため。
    C: 直進する自転車と右折する自動車の間で衝突事故が起こる可能性があるため。
    D: 交差点では自転車の方が自動車よりも速く移動するため。
  answer: C
  explanation: 自転車は自動車の右側を走行するため、交差点を直進する自転車と右折する自動車の間で衝突事故が発生する可能性があります。
- id: 221
  category: safe_driving_rules
  question: 市街地で曲がるつもりで、自分が適切な車線にいないことに気づいた場合、どうするべきですか？
  choices:
    A: 停止し、交通が途切れるのを待ってから車線変更する。
    B: 次の交差点まで進み、そこで曲がる。
    C: 方向指示器（ウィンカー）を使えば、素早く車線変更してよい。
    D: 前の交差点まで後退する。
  answer: B
  explanation: マニュアルには、曲がるつもりで適切な車線にいないことに気づいた場合は、次の交差点まで進み、そこで曲がるべきであると記載されています。
- id: 222
  category: defensive_driving
  question: 自分が他の運転手の死角を走行しているかどうかは、どうすればわかりますか？
  choices:
    A: 中央車線を走行している。
    B: 前方の車のルームミラーが見えない。
    C: 前方の車が大型の商用トラックである。
    D: 車間距離を2秒未満にして追従している。
  answer: B
  explanation: 並走、特に他の運転手の死角での走行は避けてください。前方の車のルームミラーが見えない場合、あなたはおそらくその運転手の死角にいます。
- id: 223
  category: safe_driving_rules
  question: 一方通行の道路を走行する際、直進（通過）にはどの車線を使用するべきですか？
  choices:
    A: 一番右の車線。
    B: 一番左の車線。
    C: 中央の車線。
    D: 外側の車線。
  answer: C
  explanation: 一方通行の道路では、直進（通過）には中央の車線を使用し、右左折には外側の車線を使用します。
- id: 224
  category: defensive_driving
  question: 地方の道路での運転が、交通量の多い市街地での運転よりも危険であるとよく考えられているのはなぜですか？
  choices:
    A: 一時停止標識や信号機が多いから。
    B: 道路の幅が狭いことがあり、照明も十分でないことが多いから。
    C: 商用トラックの交通量が多いから。
    D: 制限速度が一般的に低いから。
  answer: B
  explanation: 地方の道路での運転は、道路の幅が狭いことや、照明が十分でないことが多いこと、また走行速度がより高いことがあるため、より危険であることがよくあります。
- id: 225
  category: safe_driving_rules
  question: 州間高速道路（インターステート）に進入する際の適切な手順は何ですか？
  choices:
    A: ランプ（進入路）の終わりで停止し、車列が途切れるのを待つ。
    B: 加速車線を使用して他の車の速度と合わせ、その後安全に合流する。
    C: 遅い車を避けるため、直接左車線に合流する。
    D: 加速車線で減速し、州間高速道路上の車に道を譲る。
  answer: B
  explanation: 州間高速道路に進入する際は、自分の車の速度が他の車の速度と一致するまで加速車線を使用し、その後安全に合流してください。
- id: 226
  category: defensive_driving
  question: 車の故障により州間高速道路で停止せざるを得なくなった場合、助けを求めるためにどうするべきですか？
  choices:
    A: 走行車線に立ち、腕を振る。
    B: ラジオのアンテナまたは左側のドアハンドルに白い布を結びつけ、ボンネットを開ける。
    C: リアバンパーに赤い旗を立てる。
    D: 助けが来るまでクラクションを鳴らし続ける。
  answer: B
  explanation: 車の故障で停止せざるを得ない場合は、道路から遠く離れた場所に移動してください。ラジオのアンテナまたは左側のドアハンドルに白い布を結びつけ、ボンネットを開けてください。
- id: 227
  category: safe_driving_rules
  question: 州間高速道路を降りる際、どうするべきですか？
  choices:
    A: 減速車線に入る前に、走行車線で減速する。
    B: 十分に前から方向指示器を出し、減速せずに減速車線に入る。
    C: 減速車線に入ったらすぐに急ブレーキをかける。
    D: 減速車線に入るまで方向指示器の使用を待つ。
  answer: B
  explanation: 高速道路を降りる際は、十分に前から方向指示器を出し、減速せずに減速車線に入ってください。その後、掲示されている出口の制限速度で進んでください。
- id: 228
  category: safe_driving_rules
  question: 州間高速道路で目的の出口を通り過ぎてしまった場合、どうするべきですか？
  choices:
    A: 次の出口まで進み、そこで高速道路を降りる。
    B: 減速し、路肩を慎重に後退する。
    C: 中央分離帯を通ってUターンする。
    D: 走行車線で停止し、交通が途切れるのを待ってから後退する。
  answer: A
  explanation: 出口を通り過ぎてしまった場合は、減速したり、後退したり、方向転換しようとしたりしないでください。代わりに、次の出口まで進み、そこで高速道路を降りてください。
- id: 229
  category: vehicle_information
  question: 夜間にハイビームのヘッドライトを点灯させた場合、どれくらい離れた場所にいる人が見えるべきですか？
  choices:
    A: 75フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: C
  explanation: 夜間にハイビームのヘッドライトを点灯させた場合、200フィート離れた場所にいる人が見えるべきです。
- id: 230
  category: vehicle_information
  question: ノースカロライナ州法によると、テールライトは赤色で、少なくともどれくらい離れた場所から見える必要がありますか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: D
  explanation: テールライトは赤色で、少なくとも500フィート離れた場所から見える必要があります。
- id: 231
  category: vehicle_information
  question: 運転を始める前に、車のサイドミラーをどのように調整すべきですか？
  choices:
    A: 車の真後ろの景色が見えるようにする。
    B: 車の側面がわずかに映る程度で、左右の後方の景色が見えるようにする。
    C: 死角を完全に無くすようにする。
    D: 車の前輪が見えるようにする。
  answer: B
  explanation: サイドミラーは、車の左右の後方の景色が見えるように調整します。ミラーには車の側面がわずかに映る程度にする必要があります。
- id: 232
  category: vehicle_information
  question: 足で踏み込んでいるブレーキペダルが徐々に下がっていく場合、何を示していますか？
  choices:
    A: アンチロック・ブレーキ・システム（ABS）が作動している。
    B: ブレーキパッドが新品である。
    C: 油圧システムを点検する必要がある。
    D: タイヤの空気圧が不足している。
  answer: C
  explanation: 足で踏み込んでいるペダルが徐々に下がっていく場合は、油圧システムを点検する必要があります。
- id: 233
  category: vehicle_information
  question: 停止する際、アンチロック・ブレーキ・システム（ABS）の正しい使い方はどれですか？
  choices:
    A: ブレーキペダルを素早くポンピングする（何度も踏み込む）。
    B: ブレーキを強く踏み込み、ブレーキペダルにしっかりと一定の圧力をかけ続ける。
    C: ブレーキペダルを軽く何度も叩くように踏む。
    D: 振動を感じたらブレーキペダルの圧力を緩める。
  answer: B
  explanation: ABSを装備している場合、停止する際はブレーキを強く踏み込み、ブレーキペダルにしっかりと一定の圧力をかけ続けることが重要です。ブレーキペダルをポンピングしたり、一定の圧力を緩めたりすると、ABSの効果が低下します。
- id: 234
  category: vehicle_information
  question: ノースカロライナ州でタイヤが安全と見なされるための、許容される最小の溝の深さはどれくらいですか？
  choices:
    A: 1/32インチ
    B: 1/16インチ
    C: 1/8インチ
    D: 1/4インチ
  answer: B
  explanation: マニュアルによると、タイヤの溝の深さが1/16インチ未満の場合、そのタイヤは安全ではないと見なされます。
- id: 235
  category: vehicle_information
  question: 空気圧が高すぎるタイヤで走行することの悪影響は何ですか？
  choices:
    A: 外側の縁がより早く摩耗する。
    B: パンク（バースト）の可能性が高まる。
    C: トラクション（牽引力）が低下し、トレッド（接地面）の中央部分が激しく摩耗する。
    D: 燃費が10%向上する。
  answer: C
  explanation: マニュアルには、空気圧が高すぎるタイヤはトラクションを低下させ、トレッドの中央部分を激しく摩耗させると記載されています。
- id: 236
  category: safe_driving_rules
  question: 排気漏れの可能性による一酸化炭素中毒を防ぐために、マニュアルでは何を推奨していますか？
  choices:
    A: 常にエアコンを強にしておく。
    B: 走行中は窓を約1インチ開けておく。
    C: 10,000マイルごとにマフラーを交換する。
    D: ハザードランプを点灯させて走行する。
  answer: B
  explanation: 排気システムの漏れにより有毒な一酸化炭素ガスが車内に侵入する可能性があるため、走行中は窓を約1インチ開けておくことが推奨されています。
- id: 237
  category: vehicle_information
  question: 車のサスペンションシステムに問題がある可能性を示す兆候は、次のうちどれですか？
  choices:
    A: 車が大きく揺れたり、曲がる際に片側に大きく傾いたり、継続的に跳ねたりする。
    B: 数分以上アイドリングするとエンジンがエンストする。
    C: 時速60マイル以上で走行するとハンドルが振動する。
    D: 排気システムから過剰な煙と騒音が出る。
  answer: A
  explanation: 車が大きく揺れたり、曲がる際に片側に大きく傾いたり、継続的に跳ねるように感じる場合は、サスペンションシステムに問題がある可能性があります。
- id: 238
  category: safe_driving_rules
  question: 「エコドライブ（Drive Green）」のセクションによると、急発進や急ブレーキは燃料消費量を最大でどれくらい増加させる可能性がありますか？
  choices:
    A: 10%
    B: 20%
    C: 30%
    D: 40%
  answer: D
  explanation: エコドライブとは簡単な習慣を取り入れることです。マニュアルには、急発進や急ブレーキは燃料消費量を40%増加させる可能性があると記されています。
- id: 239
  category: safe_driving_rules
  question: 時速60マイルを超えて時速5マイル速度を上げるごとに、最大でどれくらいの追加コストがかかる可能性がありますか？
  choices:
    A: 1ガロンあたり10セント
    B: 1ガロンあたり15セント
    C: 1ガロンあたり30セント
    D: 1ガロンあたり50セント
  answer: C
  explanation: マニュアルには、時速60マイルを超えて時速5マイル速度を上げるごとに、1ガロンあたり最大30セントの追加コストがかかる可能性があると記載されています。
- id: 240
  category: defensive_driving
  question: 優秀なドライバーは、道路のどれくらい先をスキャン（確認）するように努めるべきですか？
  choices:
    A: 3〜5秒先
    B: 5〜10秒先
    C: 10〜15秒先
    D: 20〜30秒先
  answer: C
  explanation: 優秀なドライバーは、直前の急な動きを避けるために、道路の10〜15秒先（約1区画分）を見るように努めます。
- id: 241
  category: defensive_driving
  question: 後続車が車間距離を詰めすぎていないか確認するために、どのくらいの頻度でミラーをチェックするべきですか？
  choices:
    A: 5秒ごと
    B: 10秒ごと
    C: 30秒ごと
    D: 60秒ごと
  answer: B
  explanation: マニュアルでは、後続車が車間距離を詰めすぎていないか確認するために、約10秒ごとにミラーをチェックすることを推奨しています。
- id: 242
  category: defensive_driving
  question: 車線変更をする前に死角を確認する正しい方法は何ですか？
  choices:
    A: バックミラー（ルームミラー）のみに頼る。
    B: 素早く頭を回し、肩越しに目視する。
    C: ヘッドライトを点滅させ、反応を待つ。
    D: クラクションを鳴らして死角にいる車両に警告する。
  answer: B
  explanation: ミラーには死角ができるため、車線変更や右左折をする前には、素早く頭を回して肩越しに目視し、死角に何があるかを確認する必要があります。
- id: 243
  category: safe_driving_rules
  question: 制限速度が45mph以上の場合、少なくとも右左折するどれくらい前から合図（ウィンカー）を出さなければなりませんか？
  choices:
    A: 右左折の50フィート前
    B: 右左折の100フィート前
    C: 右左折の200フィート前
    D: 右左折の500フィート前
  answer: C
  explanation: 通常は右左折する少なくとも100フィート前から合図を出しますが、制限速度が45mph以上の場合は、少なくとも200フィート前から合図を出さなければなりません。
- id: 244
  category: signs_and_signals
  question: 右折の正しい手信号（ハンドシグナル）はどれですか？
  choices:
    A: 左腕と手をまっすぐ横に伸ばし、人差し指を指す。
    B: 左腕をまっすぐ横に伸ばし、肘から先と手をまっすぐ上に向け、手のひらを前に向ける。
    C: 左腕と手を下に向け、手のひらを後ろに向ける。
    D: 左手を円を描くように振る。
  answer: B
  explanation: 手信号で右折の合図をするには、左腕をまっすぐ横に伸ばし、肘から先と手をまっすぐ上に向け、手のひらを前に向けます。
- id: 245
  category: signs_and_signals
  question: 停止または減速することを示す手信号（ハンドシグナル）はどのように行いますか？
  choices:
    A: 左腕と手を下に向け、手のひらを後ろに向ける。
    B: 左腕をまっすぐ横に伸ばし、人差し指を指す。
    C: 左腕をまっすぐ横に伸ばし、肘から先をまっすぐ上に向ける。
    D: ブレーキランプを3回点滅させる。
  answer: A
  explanation: 停止および減速の合図をするには、左腕と手を下に向け、手のひらを後ろに向けます。
- id: 246
  category: defensive_driving
  question: 左側から対向車が接近しており、右側に自転車に乗った子供がいる状況に直面した場合、どのように車両を調整すべきですか？
  choices:
    A: 両方の危険に対して等しいスペースを空ける。
    B: 対向車を避けるため、自転車の子供に近づく。
    C: 危険がなくなるまでクラクションを鳴らし続ける。
    D: 対向車に近づくことになっても、子供との間隔をより広く取る。
  answer: D
  explanation: 2つ以上の避けられない危険に対処する場合、最も大きい危険、または最も起こり得る危険に対して最大のスペースを確保します。子供は突然動く可能性が最も高いため、対向車に近づくことになっても、子供との間隔をより広く取ります。
- id: 247
  category: signs_and_signals
  question: 道路工事区域（ワークゾーン）を明確に示すために使用される警告標識は何色ですか？
  choices:
    A: 黄色地に黒字の標識
    B: オレンジ色地に黒字の標識
    C: 白地に黒字の標識
    D: 赤地に白字の標識
  answer: B
  explanation: 道路工事区域は、黒字でメッセージが書かれた特有のオレンジ色の警告標識によって簡単に識別できます。この色は工事区域を示すためだけに専用で使用されます。
- id: 248
  category: vehicle_information
  question: 車両のクラクションは、少なくともどのくらい離れた場所から聞こえる音量でなければなりませんか？
  choices:
    A: 少なくとも50フィート
    B: 少なくとも100フィート
    C: 少なくとも200フィート
    D: 少なくとも500フィート
  answer: C
  explanation: 認可されたすべての自動車には、少なくとも200フィート離れた場所から聞こえる十分な音量のクラクションを装備しなければなりません。
- id: 249
  category: safe_driving_rules
  question: 工事区域（ワークゾーン）における追突事故の主な原因は何ですか？
  choices:
    A: 制限速度を超えて運転すること
    B: 周囲の交通よりも遅く運転すること
    C: 車線変更時にウィンカーを使用しないこと
    D: ハイビームを使用すること
  answer: B
  explanation: マニュアルによると、周囲の交通よりも遅く運転することが、工事区域における追突事故の主な原因です。
- id: 250
  category: safe_driving_rules
  question: ノースカロライナ州法では、いつヘッドライトを使用することが義務付けられていますか？
  choices:
    A: 日没から日の出まで、および視界が400フィート以下の場合
    B: 夕暮れから夜明けまで、および視界が500フィート以下の場合
    C: 夜間に照明のない田舎道を運転する場合のみ
    D: 天候に関係なく午後8時から午前6時まで
  answer: A
  explanation: 法律により、日没から日の出まで、および視界が400フィート以下の場合はヘッドライトの使用が義務付けられています。
- id: 251
  category: defensive_driving
  question: 夜間、対向車がヘッドライトを減光（ロービームに）しない場合、どうすべきですか？
  choices:
    A: ハイビームを点灯し、すれ違うまでそのままにする
    B: 対向車のヘッドライトを直視して距離を測る
    C: ハイビームを1回点滅させ、それでも減光しない場合は少し右側を見る
    D: すぐに道路脇に車を停め、すべてのライトを消す
  answer: C
  explanation: マニュアルでは、ハイビームを1回点滅させて相手のドライバーに注意を促すことができるとアドバイスしています。それでも減光しない場合は、自分の車はロービームのままにし、ヘッドライトを直視しないように少し右側を見てください。
- id: 252
  category: safe_driving_rules
  question: 滑りやすい路面での停止距離は、乾いた路面と比べてどのくらい増加しますか？
  choices:
    A: アンチロックブレーキ（ABS）が装備されていれば変わらない
    B: 2倍から10倍長くなる
    C: ちょうど50パーセント増加する
    D: 15倍から20倍長くなる
  answer: B
  explanation: 滑りやすい路面での停止距離は、乾いた路面に比べて2倍から10倍長くなります。
- id: 253
  category: defensive_driving
  question: 雨が降り始めてからの最初の10〜15分間、道路がより危険だと考えられているのはなぜですか？
  choices:
    A: 雨で車線の反射塗料が洗い流されるため
    B: 雨が油、泥、ほこり、ゴムと混ざり合い、滑りやすい路面になるため
    C: 嵐がひどくなる前に目的地に着こうと、ドライバーがスピードを上げる傾向があるため
    D: どんな速度でも、水がすぐに深刻なハイドロプレーニング現象を引き起こすため
  answer: B
  explanation: 最初の10〜15分間は、雨がアスファルトや車両から出た油、泥、ほこり、ゴムと混ざり合い、滑りやすい路面を作り出すためです。
- id: 254
  category: safe_driving_rules
  question: ハイドロプレーニング現象はどのくらいの速度で発生し始めますか？
  choices:
    A: 時速15マイルという低速から
    B: 時速30マイルという低速から
    C: 時速45マイルという低速から
    D: 時速55マイルという低速から
  answer: B
  explanation: ハイドロプレーニング現象は、時速30マイルという低速で、水深が1/8インチ（約3mm）を少し超えた程度の水たまりでも発生し始める可能性があります。
- id: 255
  category: defensive_driving
  question: 車がハイドロプレーニング現象を起こし始めた場合、推奨される行動は何ですか？
  choices:
    A: トラクション（駆動力）を取り戻すためにすぐに急ブレーキをかける
    B: ハンドルを急に右に切る
    C: アクセルペダルから足を離し、ブレーキを踏みたくなる衝動を抑える
    D: 一定の速度を保つためにクルーズコントロールをオンにする
  answer: C
  explanation: ハイドロプレーニング現象が起き始めたら、アクセルペダルから足を離してください。ブレーキを踏みたくなる衝動を抑えましょう。ハンドルをまっすぐに保ち、車の勢いが落ちるのを待ちます。
- id: 256
  category: vehicle_information
  question: ハイドロプレーニング現象の発生確率を高めるタイヤの状態はどれですか？
  choices:
    A: 溝が深く開いたタイヤ
    B: メーカー指定値の上限まで空気圧を入れたタイヤ
    C: 溝が摩耗し、空気圧が不足しているタイヤ
    D: 夏に使用されるスノータイヤ
  answer: C
  explanation: 溝が摩耗したタイヤや空気圧が不足しているタイヤは、路面へのグリップ力が低下するため、ハイドロプレーニング現象の発生確率が高まります。
- id: 257
  category: safe_driving_rules
  question: マニュアルによると、車が高速道路から押し流されるには、どのくらいの深さの急流が必要ですか？
  choices:
    A: 2インチ
    B: 6インチ
    C: 18インチ
    D: 24インチ
  answer: B
  explanation: 6インチの急流で車が高速道路から押し流され、12インチの急流で車が浮いたり横転したりする可能性があると報告されています。
- id: 258
  category: safe_driving_rules
  question: ノースカロライナ州のドライバーは、悪天候のためにワイパーを使用する際、必ず何をしなければなりませんか？
  choices:
    A: ハザードランプを点灯させる
    B: 制限速度より少なくとも時速15マイル遅く走る
    C: ヘッドライトを点灯させる
    D: 右側の車線のみを走行する
  answer: C
  explanation: ノースカロライナ州のすべてのドライバーは、悪天候のためにワイパーを使用する際、ヘッドライトの点灯が義務付けられています。
- id: 259
  category: defensive_driving
  question: 霧の中で運転する場合、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: パーキングライトのみ
    D: ハザードランプのみ
  answer: B
  explanation: 霧の中で運転しなければならない場合は、ロービームのヘッドライトを点灯させてください。
- id: 260
  category: defensive_driving
  question: 霧の中での運転中、視界が極端に悪くなった場合はどうすべきですか？
  choices:
    A: 車線の中央に停止し、霧が晴れるのを待つ
    B: ハイビームを点灯し、スピードを上げて霧の塊から早く抜け出す
    C: 道路から大きく離れた場所に車を停め、安全を確保してハザードランプを点灯させる
    D: 窓を開け、運転しながらクラクションを鳴らし続ける
  answer: C
  explanation: 視界が極端に悪くなった場合は、道路から大きく離れた場所に車を停め、安全を確保してハザードランプを点灯させ、助手席側から車を降りて道路から離れる必要があります。
- id: 261
  category: safe_driving_rules
  question: 気温が下がったとき、道路上で最初に凍結しやすい場所はどこですか？
  choices:
    A: 交差点と横断歩道
    B: 日陰、橋、高架橋
    C: 交通量の多い高速道路
    D: トンネルと地下道
  answer: B
  explanation: 運転中は、日陰、橋、高架橋に注意してください。これらの場所は気温が下がったときに最初に凍結することが多いからです。
- id: 262
  category: defensive_driving
  question: 雪道や凍結した道路で減速する際、停止距離をどのくらい増やすべきですか？
  choices:
    A: 通常の停止距離の少なくとも2倍をとる
    B: 通常の停止距離の少なくとも3倍をとる
    C: 通常の停止距離の少なくとも5倍をとる
    D: 通常の停止距離の少なくとも10倍をとる
  answer: B
  explanation: 雪道や凍結した道路で発進または停止する場合、減速するために通常の停止距離の少なくとも3倍の距離をとる必要があります。
- id: 263
  category: safe_driving_rules
  question: 凍結した道路や圧雪路を運転する際、どのくらいの停止距離をとるべきですか？
  choices:
    A: 通常の停止距離の2倍
    B: 通常の停止距離の少なくとも3倍
    C: 通常の停止距離の4倍
    D: 通常の停止距離と同じ
  answer: B
  explanation: マニュアルには、凍結した道路や圧雪路を運転する際は、減速するために通常の停止距離の少なくとも3倍の距離をとるべきであると記載されています。
- id: 264
  category: defensive_driving
  question: 野生動物が最も活動的になり、道路に現れやすいのは1日のうちどの時間帯ですか？
  choices:
    A: 午前中半ばと午後早い時間
    B: 夜間の最も暗い時間帯のみ
    C: 夜明け、夕暮れ、および日没後の数時間
    D: 正午と午後遅い時間
  answer: C
  explanation: マニュアルによると、野生動物はいつでもどこでも現れる可能性がありますが、夜明け、夕暮れ、および日没後の数時間が最も活動的になります。
- id: 265
  category: defensive_driving
  question: 前方に動物がいる場合、ハイビームの使用に注意すべきなのはなぜですか？
  choices:
    A: ハイビームは一部の動物を混乱させたり、「すくませたり」する可能性があるため。
    B: ハイビームは動物が車に向かって突進する原因となるため。
    C: ハイビームは運転手が動物の目の反射を見えにくくするため。
    D: ハイビームは動物の目を永久に失明させるため。
  answer: A
  explanation: マニュアルでは、対向車がなく、前方に動物がいない場合にのみハイビームを使用するよう推奨しています。ハイビームは一部の動物を混乱させたり「すくませたり」して、「ヘッドライトに照らされた鹿（すくんで動けない状態）」の行動を引き起こす可能性があるためです。
- id: 266
  category: safe_driving_rules
  question: 動物をはねてしまい、道路の端に車を停めた場合、次に何をすべきですか？
  choices:
    A: 動物に近づき、怪我の具合を確認する。
    B: 車内に留まり、ドアをロックしてハザードランプを点灯させる。
    C: すぐに動物を道路外に引きずり出す。
    D: 車から降りて、他の運転手に手を振って助けを求める。
  answer: B
  explanation: 動物をはねてしまった場合、マニュアルでは安全に道路の端に車を停め、車内に留まり、ドアをロックしてハザードランプを点灯させるよう指示しています。危険な場合があるため、動物には近づかないでください。
- id: 267
  category: vehicle_information
  question: オートマチック（AT）車を運転中にブレーキが効かなくなった場合、どうすべきですか？
  choices:
    A: パーキング（P）に入れ、エンジンを切る。
    B: アクセルペダルをポンピングしてブレーキ液の圧力を高める。
    C: エマージェンシーブレーキ（パーキングブレーキ）をかけ、シフトレバーをローギア（低速ギア）に入れる。
    D: ニュートラル（N）に入れ、車が止まるまで惰性で進む。
  answer: C
  explanation: オートマチック車でブレーキが故障した場合、エマージェンシーブレーキ（パーキングブレーキ）をかけ、シフトレバーをローギア（低速ギア）に入れる必要があります。
- id: 268
  category: vehicle_information
  question: 濡れたブレーキを乾かすにはどうすればよいですか？
  choices:
    A: 数マイルにわたって高速で走行する。
    B: 短い距離を走行し、ブレーキペダルを軽く踏む。
    C: ニュートラルの状態でブレーキペダルを素早くポンピングする。
    D: 車を停め、1時間自然乾燥させる。
  answer: B
  explanation: 短い距離を走行し、ブレーキペダルを軽く踏むことで、濡れたブレーキを乾かすことができます。摩擦によって熱が発生し、水分が蒸発します。
- id: 269
  category: safe_driving_rules
  question: 長い下り坂や急な坂道を下る際、ブレーキの過度な摩耗を防ぐためにすべきことは何ですか？
  choices:
    A: 下っている間ずっとブレーキペダルを踏み続ける。
    B: ニュートラルに入れ、惰性で坂を下る。
    C: 速度を落とすためにエンジンを切る。
    D: 坂を下る前、頂上で低速ギアにシフトダウンする。
  answer: D
  explanation: 長い下り坂や急な坂道を下る際のブレーキの過度な摩耗を防ぐには、ブレーキペダルの代わりに低速ギアを使用して速度をコントロールします。下り始める前、坂の頂上で低速ギアにシフトダウンするのが最善です。
- id: 270
  category: defensive_driving
  question: アクセルペダルが戻らなくなった（引っかかった）場合にとるべき手順の1つは何ですか？
  choices:
    A: ニュートラルに入れ、車輪をロックさせないようにブレーキをしっかりと踏む。
    B: すぐにエンジンを切り、キーを抜く。
    C: 前進する動きを相殺するためにリバース（R）に入れる。
    D: 車輪をロックさせるために、できるだけ強くブレーキを踏み込む。
  answer: A
  explanation: アクセルペダルが戻らなくなった場合、マニュアルでは、ニュートラルに入れて車輪をロックさせないようにブレーキをしっかりと踏むこと、またペダルを軽く叩くか、安全な場所に車を停めることを推奨しています。
- id: 271
  category: defensive_driving
  question: 運転中にタイヤがパンク（バースト）した場合、まず何をすべきですか？
  choices:
    A: すぐにブレーキを強く踏んで急停止する。
    B: ハンドルをしっかりと握り、車をまっすぐに保つようにする。
    C: ハンドルを路肩に向かって急に切る。
    D: 車のコントロールを保つために少し加速する。
  answer: B
  explanation: パンク（バースト）が発生した場合は、ハンドルをしっかりと握り、車線内で車をまっすぐに保つように努め、すぐにはブレーキを踏まずにアクセルから足を離して減速する必要があります。
- id: 272
  category: safe_driving_rules
  question: 車が故障して助けが必要な場合、他の運転手にどのように合図を送るべきですか？
  choices:
    A: 道路の真ん中に立って腕を振る。
    B: 左側のドアハンドルまたはラジオのアンテナに白い布を結びつけ、ボンネットを開ける。
    C: ハイビームを連続して点滅させる。
    D: リアバンパーに赤い旗を置き、車の後ろに立つ。
  answer: B
  explanation: 車が故障して助けが必要な場合、マニュアルには、左側のドアハンドルまたはラジオのアンテナに白い布を結びつけ、車のボンネットを開けるべきだと記載されています。
- id: 273
  category: defensive_driving
  question: 対向車がセンターラインを越えてあなたの車の進路に入ってきた場合、どうすべきですか？
  choices:
    A: 避けるために左車線にハンドルを切る。
    B: 早く通り過ぎるために加速する。
    C: すぐに減速し、クラクションを鳴らし、右側に寄る。
    D: 自分の車線ですぐに停止し、ヘッドライトを点滅させる。
  answer: C
  explanation: 対向車がセンターラインを越えてあなたの進路に入ってきた場合は、たとえ道路から外れることになっても、すぐに減速し、クラクションを鳴らし、右側に寄る必要があります。
- id: 274
  category: defensive_driving
  question: 車が舗装道路から外れて路肩に乗り上げてしまった場合、どうすべきですか？
  choices:
    A: すぐにブレーキを踏み、ハンドルを道路に向かって急に切る。
    B: ゆっくりとアクセルから足を離し、まっすぐ前方にハンドルを切る。
    C: 早く舗装道路に戻るために加速する。
    D: ニュートラルに入れ、停止するまで惰性で進む。
  answer: B
  explanation: 車が舗装道路から外れた場合、すぐにブレーキを踏んだり、急に戻ろうとしたりしてはいけません。代わりに、ゆっくりとアクセルから足を離し、まっすぐ前方にハンドルを切る必要があります。
- id: 275
  category: defensive_driving
  question: 車がスキッド（横滑り）した場合、どの方向にハンドルを切るべきですか？
  choices:
    A: 車の後部が滑っているのとは反対の方向。
    B: ハンドルを完全にまっすぐに保つ。
    C: 車の後部が滑っている方向。
    D: 滑っている方向に関係なく、道路の右側の路肩に向かって。
  answer: C
  explanation: 車がスキッド（横滑り）した場合は、アクセルからゆっくりと足を離し、車の後部が滑っている方向にハンドルを切る必要があります。
- id: 276
  category: defensive_driving
  question: 後方から追突されそうになっており、前方に車がいない場合、どうすべきですか？
  choices:
    A: アクセルを踏んで、できるだけ早くその場から離れる。
    B: 衝撃に備えるために急ブレーキを踏む。
    C: リバース（後退）に入れてバックする。
    D: エンジンを切り、シートベルトを外す。
  answer: A
  explanation: 後方から追突されそうになっており、前方に車がいない場合、マニュアルではアクセルを踏んでできるだけ早くその場から離れるよう推奨しています。
- id: 277
  category: driver_responsibility
  question: 事故現場で停止して救護活動を行う人を、法律はどのように保護していますか？
  choices:
    A: 費やした時間に対する金銭的な補償を保証する。
    B: 故意の不正行為や乱暴な行為を除き、民事責任から保護する。
    C: 将来のすべての交通違反に対する免責を与える。
    D: 過失のある運転手の保険会社に報酬の支払いを義務付ける。
  answer: B
  explanation: 法律は、事故現場で停止して救護を行う者を、故意の不正行為や乱暴な行為を除き、民事責任から保護しています。
- id: 278
  category: defensive_driving
  question: 車がスキッド（横滑り）した場合、どうすべきですか？
  choices:
    A: しっかりとブレーキを踏み、ハンドルをまっすぐに保つ。
    B: 車の後部が滑っているのとは反対の方向にハンドルを切る。
    C: 車の後部が滑っている方向にハンドルを切る。
    D: トラクション（駆動力）を取り戻すために急加速する。
  answer: C
  explanation: 車がスキッド（横滑り）した場合は、アクセルからゆっくりと足を離し、車の後部が滑っている方向にハンドルを切る必要があります。
- id: 279
  category: safe_driving_rules
  question: 本線上で死傷者のいない交通事故に巻き込まれた場合、車をどうすべきですか？
  choices:
    A: 警察が到着するまで、そのままの場所に置いておく。
    B: 安全に運転できる場合は、走行車線から路肩に移動させる。
    C: すぐに最寄りの修理工場まで運転する。
    D: 車を乗り捨てて安全な場所まで歩く。
  answer: B
  explanation: 事故が本線上で発生し、死傷者がいない場合、自力で安全に運転できるのであれば、各車両は走行車線から路肩に移動させる必要があります。
- id: 280
  category: penalties_and_points
  question: 法律により、交通事故を直ちに警察（法執行機関）に報告することが義務付けられているのはどのような場合ですか？
  choices:
    A: 人が死亡した場合のみ。
    B: 物的損害が5,000ドルを超える場合のみ。
    C: 人が死亡または負傷した場合、あるいは総物的損害が1,000ドル以上と見込まれる場合。
    D: 事故に3台以上の車両が関与している場合は常に。
  answer: C
  explanation: 人が死亡または負傷した場合、あるいは車両やその他の財産への総損害額が1,000ドル以上に上ると見込まれる場合、法律により、最寄りの警察官または法執行機関に直ちに事故の報告を行うことが義務付けられています。
- id: 281
  category: driver_responsibility
  question: 衝突事故で他人の所有物を破損し、その所有者がわからない場合、どうしなければなりませんか？
  choices:
    A: 直ちに現場を離れる。
    B: 現場で正確に1時間待つ。
    C: 収集できるすべての情報を書き留め、最寄りの警察官に提出する。
    D: 破損した所有物に自分の電話番号を書いたメモを残す。
  answer: C
  explanation: 相手の車両の乗員や破損した所有物の所有者がわからない場合は、収集できるすべての情報を書き留め、最寄りの警察官（法執行官）に提出してください。
- id: 282
  category: penalties_and_points
  question: 赤信号での右折時に歩行者に道を譲らなかった場合の罰則は何ですか？
  choices:
    A: 初回違反に対する警告。
    B: 100ドル以上500ドル以下の罰金。
    C: 義務的な30日間の免許停止。
    D: 正確に50ドルの罰金。
  answer: B
  explanation: このような状況で歩行者に道を譲らなかった場合、100ドル以上500ドル以下の罰則が科せられます。
- id: 283
  category: signs_and_signals
  question: 黄色の矢印信号は何を示していますか？
  choices:
    A: 保護された緑の矢印信号が、通常の青（緑）の円形信号、赤の円形信号、または赤の矢印信号に変わろうとしている。
    B: 譲ることなく曲がる優先権がある。
    C: 直ちに停止し、青（緑）になるまで進んではならない。
    D: 信号機が故障している。
  answer: A
  explanation: 黄色の矢印は、「保護された」緑の矢印信号が、通常の青（緑）の円形信号、赤の円形信号、または赤の矢印信号に変わろうとしていることを示しています。
- id: 284
  category: signs_and_signals
  question: 停電により信号機が故障している交差点に近づいた場合、どのように進むべきですか？
  choices:
    A: 右側の車両に道を譲り、停止せずに進む。
    B: 交差点のすべての進入路に一時停止標識があるかのように進む。
    C: 警察官が到着するまで待つ。
    D: 交差点を「ゆずれ（Yield）」の標識として扱う。
  answer: B
  explanation: 停電により信号機が故障している交差点に近づく場合、交差点のすべての進入路に一時停止標識があるかのように交差点に接近し、進む必要があります。
- id: 285
  category: signs_and_signals
  question: 赤の点滅信号は何を意味しますか？
  choices:
    A: 減速し、注意して進む。
    B: 停止し、信号が青（緑）になるのを待つ。
    C: 一時停止標識と同じ意味を持つ。
    D: 対向車に道を譲るが、停止はしない。
  answer: C
  explanation: 赤の点滅信号は一時停止標識と同じ意味を持ちます。停止し、接近する交通を妨げることなく交差点に進入できるようになるまで進んではなりません。
- id: 286
  category: signs_and_signals
  question: 曲がる方向に黄色の点滅矢印信号が出ている場合、運転者はどうしなければなりませんか？
  choices:
    A: 停止し、点灯している緑の矢印を待つ。
    B: 曲がることは許可されているが、運転者は対向車や歩行者に道を譲らなければならない。
    C: 運転者に優先権があり、対向車が道を譲らなければならない。
    D: 信号が赤に変わるため、停止する準備をする。
  answer: B
  explanation: 黄色の点滅矢印が表示されている場合、指示された方向へ曲がることは許可されていますが、運転者は対向車や歩行者に道を譲らなければなりません。
- id: 287
  category: signs_and_signals
  question: 点灯している緑の矢印信号でUターンする場合、どうしなければなりませんか？
  choices:
    A: 双方に緑の矢印が出ている場合、対向の右折車両に道を譲る。
    B: どの車両にも道を譲らずに進む。
    C: 停止し、青（緑）の円形信号を待つ。
    D: 後方のすべての車両に道を譲る。
  answer: A
  explanation: Uターンする車両は、双方の進行方向に同時にそれぞれの緑の矢印が出ている場合、対向の右折車両に道を譲る必要があります。
- id: 288
  category: signs_and_signals
  question: ランプメーター（高速道路入口の信号機）が消灯している、または光を発していない場合、どうすべきですか？
  choices:
    A: 停止し、信号が青（緑）になるのを待つ。
    B: 4方向一時停止として扱う。
    C: 停止せずに進み、通常通り合流または道を譲りながら高速道路に進入する。
    D: 路肩に車を止め、信号機の故障を報告する。
  answer: C
  explanation: 表示が消灯している、または赤や緑の表示を発していない場合、車両は停止せずに進み、通常の状況が許す限り合流または道を譲りながら高速道路に進入することができます。
- id: 289
  category: signs_and_signals
  question: 歩行者によって最初に作動されたとき、ハイブリッドビーコン（歩行者用信号機）はどのように動作しますか？
  choices:
    A: 直ちに赤の点灯に変わる。
    B: 車両が安全に停止できるように、黄色の点滅から黄色の点灯、そして赤の点灯に変わる。
    C: 歩行者が渡り終えるまで赤の点滅を続ける。
    D: 歩行者用の緑の矢印を表示する。
  answer: B
  explanation: 作動すると、ビーコンは数秒間黄色に点滅し、その後黄色の点灯、さらに数秒間赤の点灯に変わり、走行中の車両が安全に停止できるようにします。
- id: 290
  category: signs_and_signals
  question: 一時停止標識は通常どこに設置されていますか？
  choices:
    A: 交差点の停止線と正確に同じ位置。
    B: 交差点から6〜50フィート手前。
    C: 交差点の100フィート手前。
    D: 交差点から50〜100フィート手前。
  answer: B
  explanation: 一時停止標識は通常、交差点から6〜50フィート手前に設置されています。
- id: 291
  category: signs_and_signals
  question: 止まれ（Stop）の標識に停止線や横断歩道の標示がない場合、運転手はどこで停止しなければなりませんか？
  choices:
    A: 止まれの標識と同じ位置。
    B: 交差する道路の10フィート手前。
    C: 交差点に入る手前で、交差する道路が見渡せる場所。
    D: 交通状況を確認するため、交差点の中央。
  answer: C
  explanation: 停止線や横断歩道の標示がない場合、運転手は交差点に入る手前で、交差する道路が見渡せる場所で停止しなければなりません。
- id: 292
  category: signs_and_signals
  question: ゆずりあい（Yield）の標識の形と色は何ですか？
  choices:
    A: 八角形で、赤と白
    B: 逆三角形（頂点が下）で、赤と白
    C: ひし形で、黒と黄色
    D: ペナント型（横向きの三角形）で、黄色と黒
  answer: B
  explanation: マニュアルによると、ゆずりあい（Yield）の標識は頂点が下を向いた三角形（逆三角形）で、赤と白の背景に「YIELD」という文字が大きく書かれています。
- id: 293
  category: signs_and_signals
  question: ペナント型（横向きの三角形）の黄色い「追い越し禁止（DO NOT PASS）」の警戒標識はどこに設置されていますか？
  choices:
    A: 道路の右側
    B: 交差点の中央上部に吊り下げられている
    C: 道路の左側
    D: カーブの手前の右側路肩
  answer: C
  explanation: マニュアルには、ペナント型の黄色い警戒標識は道路の左側に設置されており、追い越し禁止区間の始まりを指し示していると記載されています。
- id: 294
  category: signs_and_signals
  question: オレンジ色の背景に黒字でメッセージが書かれたひし形の標識は、運転手に何を警告していますか？
  choices:
    A: 踏切
    B: スクールゾーン
    C: 工事または保守作業エリア
    D: 追い越し禁止区間
  answer: C
  explanation: オレンジ色の背景に黒字でメッセージが書かれたひし形の注意または警戒標識は、工事や保守作業エリアについて警告しています。
- id: 295
  category: signs_and_signals
  question: 踏切の事前警告を行う標識はどれですか？
  choices:
    A: 黄色の背景に黒いバツ印（X）と「RR」の文字が書かれた丸い標識
    B: 白いクロスバック（X型）の標識に黒字で「RAILROAD CROSSING」と書かれたもの
    C: 黄色のひし形の標識に黒い電車のシンボルが描かれたもの
    D: 五角形の標識に黒い十字が描かれたもの
  answer: A
  explanation: 黄色の背景に黒いバツ印（X）と黒字の「RR」が書かれた丸い標識は、踏切の事前警告を行います。
- id: 296
  category: signs_and_signals
  question: 5角形（ペンタゴン）の標識は、運転手に何を警告していますか？
  choices:
    A: 病院ゾーン
    B: スクールゾーンまたは学校の横断歩道
    C: 歩行者用横断歩道
    D: この先にある「止まれ」の標識
  answer: B
  explanation: 5角形（ペンタゴン）の標識は、スクールゾーンや学校の横断歩道を警告するものであり、運転手は特に子供に注意を払う必要があります。
- id: 297
  category: signs_and_signals
  question: マニュアルによると、奇数番号の幹線道路（ハイウェイ）は一般的にどの方向に走っていますか？
  choices:
    A: 東西
    B: 南北
    C: 都市の周囲を環状に回る
    D: 州を斜めに横断する
  answer: B
  explanation: マニュアルには、奇数番号の幹線道路は一般的に南北に走っていると記載されています。
- id: 298
  category: signs_and_signals
  question: ノースカロライナ州（N.C.）の幹線道路のルートマーカー（路線番号標識）はどのような形をしていますか？
  choices:
    A: 盾型
    B: 長方形
    C: ひし形
    D: 丸型
  answer: C
  explanation: 案内/情報標識のセクションによると、ノースカロライナ州のルートマーカーはひし形です。
- id: 299
  category: safe_driving_rules
  question: 道路上の黄色い舗装標示（ライン）の目的は何ですか？
  choices:
    A: 同じ方向に進む車線を分けるため
    B: 道路の右端を示すため
    C: 横断歩道を示すため
    D: 反対方向に進む車線を分けるため
  answer: D
  explanation: 黄色い線は反対方向に進む車線を分け、白い線は同じ方向に進む車線を分けます。
- id: 300
  category: safe_driving_rules
  question: 双方向の左折専用に設けられた特殊な中央車線について、正しいものは次のうちどれですか？
  choices:
    A: 遅い車両を追い越すために使用できる
    B: 追い越しや交通への合流のために使用してはならない
    C: 緊急車両専用である
    D: ラッシュアワー時には通常の走行車線として使用できる
  answer: B
  explanation: マニュアルには、双方向左折車線を他の車両の追い越しや交通への合流の目的で使用してはならないと明記されています。
- id: 301
  category: safe_driving_rules
  question: 赤色の反射道路鋲（リフレクター）は運転手に何を示していますか？
  choices:
    A: 近くの消火栓の場所
    B: スクールゾーンが近づいていること
    C: 逆走していること
    D: 前方に踏切があること
  answer: C
  explanation: 赤色の道路鋲は運転手が逆走していることを示します。青色の反射道路鋲は近くに消火栓があることを示します。
- id: 302
  category: safe_driving_rules
  question: 信号機が作動している交差点で警察官が交通整理をしている場合、どうするべきですか？
  choices:
    A: 信号機に従う
    B: 信号機ではなく、警察官の手信号に従う
    C: その交差点を四方向一時停止（フォーウェイ・ストップ）として扱う
    D: 警察官に合図するためにクラクションを鳴らす
  answer: B
  explanation: 特別な状況下では、警察官が交通の流れを誘導している場合があります。その場合、通常の信号機や標識ではなく、警察官の手信号に従わなければなりません。
- id: 303
  category: sharing_the_road
  question: 自転車の運転者は飲酒・薬物影響下での運転（DWI）に関する法律の対象になりますか？
  choices:
    A: いいえ。自転車は原動機付車両ではないため
    B: はい。州法では自転車も車両とみなされるため
    C: 州道を走行している場合のみ
    D: 衝突事故に関与した場合のみ
  answer: B
  explanation: 自転車は車両であるため、自転車の運転者は他の運転手と同じ交通法規に従わなければならず、これにはDWI（飲酒・薬物影響下での運転）法も含まれます。
- id: 304
  category: sharing_the_road
  question: 夜間に自転車に乗る場合、法律で義務付けられている照明器具は何ですか？
  choices:
    A: 少なくとも300フィート先から見える前照灯と、少なくとも200フィート先から見える後部の赤色灯または反射板
    B: 500フィート先から見える前照灯と、500フィート先から見える後部の赤色灯
    C: 100フィート先から見える後部の赤色反射板のみ
    D: 反射材付きの衣服と点滅するヘルメットライト
  answer: A
  explanation: 夜間の場合、法律により、自転車には少なくとも300フィートの距離から見える前照灯と、少なくとも200フィートの距離から見える後部の赤色灯または反射板を装備することが義務付けられています。
- id: 305
  category: sharing_the_road
  question: 自転車は車道のどの方向に進むべきですか？
  choices:
    A: 対向車を見るために、交通の流れに逆らって進む
    B: 道路の左側を進む
    C: 交通の流れに沿って、道路の右側を進む
    D: 可能な限り歩道を進む
  answer: C
  explanation: 自転車にとって、交通の流れに逆らうのではなく、流れに沿って進むことは特に重要です。交通の流れに合わせて右側を走行しなければなりません。
- id: 306
  category: sharing_the_road
  question: 承認された自転車用保護ヘルメットの着用が法律で義務付けられているのは誰ですか？
  choices:
    A: 年齢に関係なく、すべての自転車の運転者
    B: 州間高速道路を走行する自転車の運転者のみ
    C: 16歳未満のすべての自転車の運転者および同乗者
    D: 自転車の座席に乗っている同乗者のみ
  answer: C
  explanation: 16歳未満のすべての自転車の運転者および同乗者は、承認された自転車用保護ヘルメットを着用し、サドルシートに座らなければなりません。
- id: 307
  category: sharing_the_road
  question: 同乗者が自転車の固定式幼児用座席（レストレイン・シート）に座ることが義務付けられる体重と身長の要件は何ですか？
  choices:
    A: 体重30ポンド未満、または身長30インチ未満
    B: 体重40ポンド未満、または身長40インチ未満
    C: 体重50ポンド未満、または身長48インチ未満
    D: 体重60ポンド未満、または身長50インチ未満
  answer: B
  explanation: マニュアルによると、体重40ポンド未満、または身長40インチ未満の同乗者は、自転車の固定式幼児用座席に座らなければなりません。
- id: 308
  category: safe_driving_rules
  question: 歩行者として道路沿いを歩く場合、どこを歩くべきですか？
  choices:
    A: 交通の流れに沿って、道路の右側
    B: 交通と対面するように、道路の右側
    C: 交通と対面するように、道路の左側
    D: 交通の流れに沿って、道路の左側
  answer: C
  explanation: マニュアルには、歩行者は常に交通と対面するように道路の左側を歩くべきであると記載されています。
- id: 309
  category: sharing_the_road
  question: マニュアルによると、自動車事故で死亡する歩行者の大半を占めるのはどのグループですか？
  choices:
    A: 10代の若者と若い成人
    B: 建設作業員とジョギング中の人
    C: 横断歩道や交差点を歩いている人
    D: 子供、高齢者、またはアルコール飲料を飲んでいる人
  answer: D
  explanation: マニュアルには、死亡した歩行者の大半は子供、高齢者、またはアルコール飲料を飲んでいる人であると記されています。
- id: 310
  category: sharing_the_road
  question: トラクター・トレーラー（大型トラック）の後方の死角（ノーゾーン）は、後方にどのくらいまで広がっていますか？
  choices:
    A: 最大50フィート
    B: 最大100フィート
    C: 最大200フィート
    D: 最大300フィート
  answer: C
  explanation: トラック運転手には、車が視界から消えてしまう深刻な死角、すなわち「ノーゾーン（NO-ZONE）」があり、これには後方最大200フィートの範囲も含まれます。
- id: 311
  category: defensive_driving
  question: トラクター・トレーラー（大型トラック）と道路を共有する運転手の一般的なルールは何ですか？
  choices:
    A: トラックのタイヤが見えれば、安全な距離にいる
    B: サイドミラーにトラックの運転手が映っていなければ、運転手からもあなたは見えていない
    C: 大型トラックを追い越すときは、常に右側から行う
    D: 空気抵抗を減らして燃費を良くするため、トラックに車間距離を詰めて追従する
  answer: B
  explanation: トラクター・トレーラーと道路を共有する運転手の一般的なルールは、「サイドミラーにトラックの運転手が映っていなければ、運転手からもあなたは見えていない」というものです。
- id: 312
  category: sharing_the_road
  question: トレーラーおよびそれを牽引している車両を安全に追い越すには、見通しの良い直線道路がどのくらい必要になる場合がありますか？
  choices:
    A: 1/4マイル
    B: 1/2マイル
    C: 3/4マイル
    D: 1マイル
  answer: B
  explanation: トレーラーおよびそれを牽引している車両を追い越す際は、安全に追い越すために1/2マイルの見通しの良い直線道路が必要になる場合があるため、細心の注意を払う必要があります。
- id: 313
  category: safe_driving_rules
  question: モペッド（原動機付自転車）を追い越す際、少なくとも左側にどのくらいの間隔を空けなければなりませんか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 4フィート
  answer: B
  explanation: モペッドは車線の右側を走行する必要があります。モペッドを追い越す際は、少なくとも左側に2フィートの間隔を空けなければなりません。
- id: 314
  category: sharing_the_road
  question: ノースカロライナ州で発生する、自動車が関与するオートバイ事故の大部分において、通常どちらに過失がありますか？
  choices:
    A: オートバイの運転手
    B: 自動車の運転手
    C: 両方の運転手に同等の過失がある
    D: どちらでもない（通常、天候が主な要因であるため）
  answer: B
  explanation: ノースカロライナ州のオートバイ事故の約3分の2には自動車が関与しています。これらの事故の大部分において、自動車の運転手に過失があり、通常「オートバイが見えなかった」と主張します。
- id: 315
  category: license_system
  question: ノースカロライナ州の公道でモペッドを運転するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: C
  explanation: ノースカロライナ州では、公道または公共の車両通行区域でモペッドを運転するには、16歳以上である必要があります。
- id: 316
  category: sharing_the_road
  question: 大型トラックが曲がる際、より広いスペースを必要とするのはなぜですか？
  choices:
    A: 下り坂でブレーキがすぐに熱くなるため
    B: 後輪が前輪と同じ軌道を通らないため
    C: 乗用車よりも死角が大きいため
    D: 乗用車よりも加速がはるかに遅いため
  answer: B
  explanation: 大型トラックは、後輪が前輪と同じ軌道を通らない（内輪差がある）ため、曲がる際により広いスペースを必要とします。
- id: 317
  category: alcohol_drugs_health
  question: モペッドの運転手と飲酒・薬物影響下での運転（DWI）に関する法律について、正しい記述は次のうちどれですか？
  choices:
    A: モペッドは自動車とみなされないため、モペッドの運転手はDWI法の対象外である。
    B: DWI法は、モペッドの運転手が時速20マイルを超えて走行している場合にのみ適用される。
    C: 他の自動車の運転手に適用される飲酒・薬物影響下での運転に関する法律は、モペッドの運転手にも適用される。
    D: モペッドの運転手は、自動車の運転手よりもDWIに対する罰則が軽い。
  answer: C
  explanation: マニュアルには、他の自動車の運転手に適用される飲酒・薬物影響下での運転に関する法律が、モペッドの運転手にも適用されると明記されています。
- id: 318
  category: defensive_driving
  question: トレーラーを牽引している車両が急ブレーキをかけた際、注意すべき潜在的な危険は何ですか？
  choices:
    A: トレーラーが牽引車両から外れる可能性がある
    B: 急ブレーキにより、トレーラーがジャックナイフ現象を起こす可能性がある
    C: 牽引車両のエンジンがエンストする可能性が高い
    D: トレーラーのブレーキが過熱して発火する
  answer: B
  explanation: トレーラーを牽引している車両に近づく際は、急ブレーキによってトレーラーがジャックナイフ現象（牽引車とトレーラーが「く」の字に折れ曲がる現象）を起こす可能性があることに注意してください。
- id: 319
  category: vehicle_information
  question: 運転手が製造証明書（MCO）を持っていない場合、モペッドの所有権の証明として使用できる書類は何ですか？
  choices:
    A: 販売店からの公証された売買契約書
    B: モペッド登録のための事実宣誓書（MVR-58）
    C: 有効なノースカロライナ州の運転免許証
    D: 前の所有者の登録証
  answer: B
  explanation: マニュアルには、運転手が車両のMCOを持っていない場合、モペッド登録のための事実宣誓書（MVR-58）に記入することで、所有権の証明として使用できると記載されています。
- id: 320
  category: penalties_and_points
  question: ノースカロライナ州で初めてポイ捨てで有罪判決を受けた場合の最低罰金はいくらですか？
  choices:
    A: 最低100ドルの罰金
    B: 最低250ドルの罰金
    C: 最低500ドルの罰金
    D: 最低1,000ドルの罰金
  answer: B
  explanation: 車両からゴミが投げ捨てられたり、吹き飛ばされたりした場合、運転手が責任を問われます。有罪判決を受けた場合、最低罰金は250ドル、最高罰金は1,000ドルです。
- id: 321
  category: penalties_and_points
  question: 過去の違反から3年以内に2回目のポイ捨て違反が発生した場合、有罪判決を受けた際の最大罰金はいくらですか？
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: 過去の違反日から3年以内に2回目以降のポイ捨て違反で有罪判決を受けた場合、500ドル以上2,000ドル以下の罰金が科せられます。
- id: 322
  category: sharing_the_road
  question: アドプト・ア・ハイウェイ・プログラム（Adopt-A-Highway Program）に参加する際、ボランティアグループはどのくらいの頻度でポイ捨てされたゴミを拾うことに同意しますか？
  choices:
    A: 月に1回
    B: 年に2回
    C: 少なくとも年に4回
    D: 年に6回
  answer: C
  explanation: アドプト・ア・ハイウェイ・プログラムに参加するには、グループは州が管理する道路の2マイルの区間に沿って、少なくとも年に4回ゴミ拾いをすることに同意する必要があります。
- id: 323
  category: license_system
  question: 出廷する際、通常どのタイプの運転免許記録証明が必要ですか？
  choices:
    A: 非公認の全履歴
    B: 公認の記録の写し
    C: 非公認の3年間の履歴
    D: 住所履歴の写し
  answer: B
  explanation: マニュアルには、出廷時には通常、公認の運転免許記録証明（certified driver license record check）が必要であると明記されています。
- id: 324
  category: vehicle_information
  question: 次のうち、車両管理局（DMV）への登録が免除されている車両はどれですか？
  choices:
    A: モペッド
    B: モーターホーム（キャンピングカー）
    C: 免除対象の道路建設機械
    D: フリート車両（社用車群）
  answer: C
  explanation: 免除対象の農業用車両および免除対象の道路建設機械の所有者を除き、すべての車両所有者は車両管理局（DMV）に自動車を登録しなければなりません。
- id: 325
  category: vehicle_information
  question: 州外から引っ越してきたノースカロライナ州の新しい居住者が、車両の権原（タイトル）取得と登録を行うために提出しなければならないものは何ですか？
  choices:
    A: 有効な州外の運転免許証とノースカロライナ州の一時運転証明書（TDC）
    B: 運転記録の公認コピー
    C: 事実宣誓供述書（MVR-58）
    D: ノースカロライナ州の有権者登録カード
  answer: A
  explanation: 州外から引っ越してきたノースカロライナ州の新しい居住者の場合、車両の権原取得と登録には、有効な州外の運転免許証とノースカロライナ州の一時運転証明書（TDC）が必要になります。
- id: 326
  category: vehicle_information
  question: ノースカロライナ州法によると、ナンバープレートに関して禁止されているのは次のうちどれですか？
  choices:
    A: 車両の後部にプレートを表示すること
    B: プラスチック製のナンバープレートカバーを使用すること
    C: プレートに有効期限ステッカーを貼ること
    D: 有効期限を表示すること
  answer: B
  explanation: マニュアルには、GS 20-63gに基づき、プラスチック製のナンバープレートカバーは禁止されていると明記されています。
- id: 327
  category: vehicle_information
  question: オンラインで車両登録の現住所を変更するには、どのような情報が必要ですか？
  choices:
    A: 社会保障番号と生年月日
    B: 車両のナンバープレート番号、車両権原（タイトル）番号の最後の5文字、および有効なメールアドレス
    C: 運転記録の公認コピーと保険の証明書
    D: 州外の運転免許証と一時運転証明書
  answer: B
  explanation: オンラインで住所を変更するには、車両のナンバープレート番号、車両権原（タイトル）番号の最後の5文字、および有効なメールアドレスが必要です。
- id: 328
  category: vehicle_information
  question: ノースカロライナ州で新車を登録する際に必要な公式の譲渡書類は何ですか？
  choices:
    A: 公証された売買契約書
    B: 製造元の原産地証明書
    C: 自己保険証明書
    D: 非公認の全履歴記録
  answer: B
  explanation: 車両を登録する前に、適切な所有権の証明が必要です。新車の場合、製造元の原産地証明書（manufacturer's certificate
    of origin）が公式の譲渡書類となります。
- id: 329
  category: driver_responsibility
  question: ノースカロライナ州内で引っ越しをした場合、免許証またはIDの保持者は何日以内にDMVで現住所を更新しなければなりませんか？
  choices:
    A: 15日
    B: 30日
    C: 60日
    D: 120日
  answer: C
  explanation: ノースカロライナ州内で引っ越しをしてから60日以内に、免許証またはIDの保持者はDMVで現住所を更新し、免許証またはIDの再発行（複製）を受けなければなりません。
- id: 330
  category: penalties_and_points
  question: 車両の所有者が適切な賠償責任保険に加入せずに自動車を運転していることがDMVに通知された場合、どのような罰則がありますか？
  choices:
