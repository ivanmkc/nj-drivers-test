  explanation: ノースカロライナ州では、公道または公共の車両区域でモペッドを運転するには、16歳以上である必要があります。
- id: 316
  category: sharing_the_road
  question: 大型トラックが曲がる際に追加のスペースを必要とするのはなぜですか？
  choices:
    A: 下り坂でブレーキがすぐに加熱するため
    B: 後輪が前輪の軌道を通らないため
    C: 乗用車よりも死角が広いため
    D: 乗用車よりも加速が大幅に遅いため
  answer: B
  explanation: 大型トラックは、後輪が前輪の軌道を通らないため、曲がる際に追加のスペースを必要とします。
- id: 317
  category: alcohol_drugs_health
  question: モペッドの運転者と酒気帯び・薬物影響下運転（DWI）法に関する記述のうち、正しいものはどれですか？
  choices:
    A: モペッドは自動車とみなされないため、DWI法の適用外である
    B: 時速20マイル以上で走行している場合にのみ適用される
    C: 他の自動車の運転者に適用されるDWI法は、モペッドの運転者にも適用される
    D: モペッドの運転者は乗用車の運転手よりも軽い罰則を受ける
  answer: C
  explanation: マニュアルには、他の自動車の運転者に適用される酒気帯び・薬物影響下運転（DWI）法は、モペッドの運転者にも適用されると明記されています。
- id: 318
  category: defensive_driving
  question: トレーラーを牽引している車両が急ブレーキをかけた際に注意すべき潜在的な危険は何ですか？
  choices:
    A: トレーラーが牽引車から外れる可能性がある
    B: 急ブレーキによってトレーラーがジャックナイフ現象（折れ曲がり）を起こす可能性がある
