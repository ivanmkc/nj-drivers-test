- id: 331
  category: vehicle_information
  question: ノースカロライナ州では、自己保険証明書（certificate of self-insurance）を自動車損害賠償責任保険（liability
    insurance）の証明として使用できるのは、少なくとも何台以上の車両を保有している場合ですか？
