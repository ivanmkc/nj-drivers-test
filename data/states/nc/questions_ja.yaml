- id: 351
  category: license_system
  question: ロッキーマウントにあるDMV本部で提供されているサービスは次のうちどれですか？
  choices:
    A: 運転免許証の発行
    B: 車両登録
    C: タイトル（所有権）移転
    D: 上記のいずれでもない
  answer: D
  explanation: マニュアルには、DMV本部では運転免許証/IDの発行、およびタイトル/車両登録サービスは提供されていないと明記されています。
- id: 352
  category: vehicle_information
  question: 新しく購入した車両を登録する必要がある場合、1515 N. Church StreetにあるDMV本部に行くべきですか？
  choices:
    A: はい、そこが主要な処理センターです
    B: はい、ただし平日のみです
    C: いいえ、この場所ではタイトルおよび登録サービスは提供されていません
    D: いいえ、そこでは運転免許証のみを処理しています
  answer: C
  explanation: マニュアルには、DMV本部ではタイトル/車両登録サービスは提供されていないと記載されています。
- id: 353
  category: license_system
  question: ロッキーマウントにあるDMV本部でノースカロライナ州のIDカードを取得できますか？
  choices:
    A: はい、そこでIDカードが発行されます
    B: いいえ、この場所では運転免許証およびIDサービスは提供されていません
    C: はい、ただし更新のみです
    D: はい、ただし初めて申請する場合のみです
  answer: B
