    B: 運転記録の認証済みコピー
    C: 事実申立書（MVR-58）
    D: ノースカロライナ州の有権者登録証
  answer: A
  explanation: 他州から転入したノースカロライナ州の新規居住者の場合、車両の所有権登録と車両登録には、有効な他州の運転免許証とノースカロライナ州の仮運転証明書（TDC）が必要になります。
- id: 326
  category: vehicle_information
  question: ノースカロライナ州の法律に基づき、ナンバープレートに関して禁止されていることは次のうちどれですか？
  choices:
    A: 車両の後部にプレートを表示すること
