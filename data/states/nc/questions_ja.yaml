- id: 332
  category: vehicle_information
  question: ノースカロライナ州の事故において、対物賠償（財物損害）に最低限必要な賠償責任保険の金額はいくらですか？
  choices:
    A: $25,000
    B: $30,000
    C: $60,000
    D: $750,000
  answer: A
  explanation: 1回の事故におけるすべての対物賠償（財物損害）に必要な賠償責任保険の最低額は$25,000です。
- id: 333
  category: vehicle_information
  question: ノースカロライナ州では、期限切れの賠償責任保険契約に対してどのくらいの猶予期間が認められていますか？
  choices:
    A: 15日間
    B: 30日間
    C: 60日間
    D: ノースカロライナ州では猶予期間は認められていない。
  answer: D
  explanation: ノースカロライナ州では猶予期間は認められていません。猶予期間は、被保険者と保険会社の間のみの合意事項です。
- id: 334
  category: vehicle_information
  question: 車両の登録期限が切れる何日前までに、安全点検または安全・排ガス検査を受ける必要がありますか？
  choices:
    A: 30日前
    B: 60日前
    C: 90日前
    D: 120日前
  answer: C
  explanation: 登録を更新するには、登録期限の90日前までに、すべての自走式車両が安全点検または安全・排ガス検査を受ける必要があります。
- id: 335
  category: driver_responsibility
  question: 車両の賠償責任保険を解約またはキャンセルする前に、罰金や罰則を避けるために何をすべきですか？
  choices:
    A: 地元の郡査定事務所に通知する。
    B: 有効な車両のナンバープレートを返納する。
    C: 権利証（タイトル）の再発行を申請する。
    D: Tag & Tax Together（タグと税金の一括払い）料金を支払う。
  answer: B
  explanation: 罰金や罰則を避けるためには、賠償責任保険を解約またはキャンセルする前に、車両の有効なナンバープレートを返納してください。
- id: 336
  category: vehicle_information
  question: 自動車の所有権を移転する際、権利証（タイトル）上の所有権の再譲渡は誰の立ち会いのもとで行われなければなりませんか？
  choices:
    A: DMVの検査官
    B: 法執行官（警察官など）
    C: 公証人（Notary Public）
    D: 保険代理店
  answer: C
  explanation: 譲渡を有効にするには、公証人（Notary Public）の立ち会いのもとで再譲渡が行われ、かつ新しい所有者への実際の車両の引き渡しが行われなければなりません。
- id: 337
  category: vehicle_information
  question: どのような条件下で、ナンバープレートをある車両から別の車両へ移し替えることができますか？
  choices:
    A: 車両が同じカテゴリーであり、所有者名義が同一で、保険が継続している場合。
    B: 新しい車両が3年未満で、走行距離が70,000マイル未満の場合。
    C: 新しい車両を購入してから15日以内に移し替えが行われる場合。
    D: ノースカロライナ州では、車両間でナンバープレートを移し替えることは一切できない。
  answer: A
  explanation: 所有者名義が同一であり、保険が継続している場合に限り、ナンバープレートを同じカテゴリーの別の車両に移し替えることができます。
- id: 338
  category: vehicle_information
  question: 権利証（タイトル）を紛失または盗難された場合、申請書と手数料が受理されてから再発行されるまで、どのくらいの期間待つ必要がありますか？
  choices:
    A: 5日間
    B: 10日間
    C: 15日間
    D: 30日間
  answer: C
  explanation: DMVが申請書と手数料を受理してから15日経過するまで、権利証の再発行（複製）は行われません。
- id: 339
  category: vehicle_information
  question: 「Tag & Tax Together（タグと税金の一括払い）」プログラムでは、車両所有者は何をすることが求められますか？
  choices:
    A: 登録更新タグの費用と車両固定資産税を一度に支払う。
    B: 車両点検費用と登録更新費用を一度に支払う。
    C: 権利証の再発行とナンバープレートの移し替えを同時に支払う。
    D: 賠償責任保険料と車両固定資産税を一度に支払う。
  answer: A
  explanation: 「Tag & Tax Together」プログラムでは、両方の請求を一度に支払うことが求められます。車両の年間登録を更新するには、タグの更新料と税金の両方を全額支払う必要があります。
- id: 340
  category: vehicle_information
  question: ノースカロライナ州において、固定資産税の目的で車両の価値を決定する責任があるのは誰ですか？
  choices:
    A: ノースカロライナ州自動車局（N.C. DMV）
    B: 地元の郡査定事務所
    C: DMV免許・盗難局（License & Theft Bureau）
    D: 車両の保険会社
  answer: B
  explanation: DMVは、固定資産税のための車両価値の決定には関与していません。地元の郡査定事務所が、登録された車両のメーカーとモデルに基づいて税額を決定します。
- id: 341
  category: vehicle_information
  question: 次の車両のうち、「Tag & Tax Together」（登録証と税金の一括支払い）法の対象外となるのはどれですか？
  choices:
    A: 乗用車
    B: モペッド（原動機付自転車）
    C: 小型トラック
    D: オートバイ
  answer: B
  explanation: 「Tag & Tax Together」法は、以下の車両を除くすべての自動車に適用されます：登録を免除されている車両、製造住宅（マニュファクチャード・ホーム）、移動式の教室およびオフィス、複数年単位で登録されているセミトレーラー、公共サービス会社が所有またはリースしている自動車、パークモデルトレーラー、およびモペッド。
- id: 342
  category: vehicle_information
  question: 車両が年次検査に不合格となった場合、何日以内であれば同じ検査場で追加の検査費用を支払わずに再検査を受けることができますか？
  choices:
    A: 15日
    B: 30日
    C: 60日
    D: 90日
  answer: C
  explanation: 検査に不合格となった車両は、60日以内であれば、同じ検査場で追加の検査費用を支払うことなく再検査を受ける権利があります。
- id: 343
  category: vehicle_information
  question: 小型（ライトデューティー）、ガソリン車、最新の3モデルイヤー以内で、走行距離計（オドメーター）が何マイル未満であれば、排出ガス検査が免除される可能性がありますか？
  choices:
    A: 30,000マイル
    B: 50,000マイル
    C: 70,000マイル
    D: 100,000マイル
  answer: C
  explanation: 法律により、ノースカロライナ州で登録または販売される車両のうち、最新の3モデルイヤー以内で、かつ走行距離が70,000マイル未満の車両は、排出ガス検査が免除されます。
- id: 344
  category: vehicle_information
  question: ノースカロライナ州において、着色ウィンドウ（ティンテッドウィンドウ）の許容される可視光線透過率はどれくらいですか？
  choices:
    A: 20%以上
    B: 35%以上
    C: 50%以上
    D: 75%以上
  answer: B
  explanation: 着色ウィンドウの許容される可視光線透過率は35%以上です。
- id: 345
  category: vehicle_information
  question: ノースカロライナ州において、自動車法および手数料を変更する権限を持っているのは誰ですか？
  choices:
    A: 州知事
    B: ノースカロライナ州議会
    C: DMV局長
    D: 運輸省（DOT）
  answer: B
  explanation: マニュアルには、自動車法および手数料はノースカロライナ州議会によって変更される可能性があると記載されています。
- id: 346
  category: vehicle_information
  question: ハンドブックによると、ノースカロライナ州議会によって変更される可能性があるものは何ですか？
  choices:
    A: 自動車法のみ
    B: DMVの手数料のみ
    C: 自動車法および手数料
    D: 連邦高速道路規制
  answer: C
  explanation: マニュアルには、自動車法および手数料はノースカロライナ州議会によって変更される可能性があると記されています。
- id: 347
  category: license_system
  question: ノースカロライナ州のドライバー・ハンドブック（運転教本）は、オンラインのどこでアクセスできますか？
  choices:
