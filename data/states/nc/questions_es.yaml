questions:
- id: 1
  category: safe_driving_rules
  question: ¿Aproximadamente cuántas millas de carreteras mantenidas por el estado
    hay en Carolina del Norte?
  choices:
    A: 50,000 millas
    B: 80,000 millas
    C: 100,000 millas
    D: 284,000 millas
  answer: B
  explanation: Según la introducción del manual, Carolina del Norte tiene más de 80,000
    millas de carreteras mantenidas por el estado.
- id: 2
  category: driver_responsibility
  question: ¿Aproximadamente cuántos choques ocurren en las carreteras de Carolina
    del Norte cada año?
  choices:
    A: 80,000
    B: 150,000
    C: 284,000
    D: 7.6 millones
  answer: C
  explanation: El manual establece que en el estado de Carolina del Norte, ocurren
    aproximadamente 284,000 choques en las carreteras cada año.
- id: 3
  category: license_system
  question: ¿Cuál es el número de teléfono de DMVdirectAccess para obtener información
    automatizada las 24 horas del día?
  choices:
    A: 919-615-6131
    B: 919-715-7000
    C: 919-814-1779
    D: 919-707-4670
  answer: B
  explanation: Se puede contactar a DMVdirectAccess marcando el 919-715-7000 desde
    un teléfono de tonos para acceder a información las 24 horas del día, los siete
    días de la semana.
- id: 4
  category: license_system
  question: ¿Cómo puede encontrar la ubicación de una oficina de licencias de conducir
    o de registro de vehículos en su área utilizando el sistema telefónico DMVdirectAccess?
  choices:
    A: Ingresando su código postal
    B: Diciendo el nombre de su ciudad
    C: Ingresando su número de licencia de conducir
    D: Ingresando su número de placa
  answer: A
  explanation: El manual establece que al ingresar su código postal, el sistema DMVdirectAccess
    puede darle la ubicación de una oficina de licencias de conducir o de registro
    de vehículos en su área.
- id: 5
  category: license_system
  question: ¿Cuál de los siguientes servicios está disponible en línea en MyNCDMV.gov?
  choices:
    A: Realizar el examen de habilidades de conducción
    B: Solicitar placas personalizadas
    C: Obtener una REAL ID por primera vez
    D: Realizar el examen de la vista
  answer: B
  explanation: Solicitar placas personalizadas aparece en la sección de 'Servicios
    en línea disponibles' de MyNCDMV.gov.
- id: 6
  category: license_system
  question: ¿Cuál es la tarifa para solicitar un duplicado de la licencia de conducir
    o de la tarjeta de identificación en línea?
  choices:
    A: $10.00
    B: $15.50
    C: $16.75
    D: $20.00
  answer: C
  explanation: Se cobra una tarifa de $16.75 para solicitar un duplicado de la licencia
    de conducir o tarjeta de identificación en línea.
- id: 7
  category: license_system
  question: ¿Cuál de las siguientes es una razón válida para solicitar un duplicado
    de la licencia de conducir en línea?
  choices:
    A: Para cambiar su nombre legal
    B: Para actualizar a una Licencia de Conducir Comercial (CDL)
    C: Para reemplazar una licencia que esté deteriorada o dañada
    D: Para eliminar una restricción de lentes correctivos
  answer: C
  explanation: Según el manual, se puede solicitar un duplicado de la licencia en
    línea para reemplazar una licencia perdida o robada, cambiar una dirección de
    residencia o postal, o reemplazar una licencia que esté deteriorada o dañada.
- id: 8
  category: license_system
  question: ¿Con cuánta anticipación puede renovar su licencia de conducir en línea
    antes de su fecha de vencimiento?
  choices:
    A: Hasta 3 meses
    B: Hasta 6 meses
    C: Hasta 9 meses
    D: Hasta 12 meses
  answer: B
  explanation: El proceso de renovación de la licencia de conducir en línea se permite
    hasta seis meses antes de la fecha de vencimiento de la licencia.
- id: 9
  category: license_system
  question: ¿Con qué frecuencia se le permite a un conductor utilizar el proceso de
    renovación de la licencia de conducir en línea?
  choices:
    A: Cada vez que renueve
    B: Una de cada dos veces que renueve
    C: Solo una vez en su vida
    D: Una de cada tres veces que renueve
  answer: B
  explanation: El manual establece que el proceso de licencia de conducir en línea
    está disponible para los conductores una de cada dos veces que renuevan su licencia.
- id: 10
  category: license_system
  question: Dependiendo de la edad del conductor, ¿por cuántos años será válida una
    licencia de conducir renovada?
  choices:
    A: 4 o 6 años
    B: 5 u 8 años
    C: 3 o 5 años
    D: 6 o 10 años
  answer: B
  explanation: La nueva licencia se enviará por correo en un plazo de 7 a 14 días
    hábiles y será válida por 5 u 8 años, dependiendo de la edad del conductor.
- id: 11
  category: license_system
  question: ¿Quién de los siguientes NO es elegible para renovar su licencia de conducir
    en línea?
  choices:
    A: Un conductor con una restricción de lentes correctivos
    B: Un conductor que intenta renovar una licencia de conducir comercial (CDL)
    C: Un conductor cuya licencia vence en 5 meses
    D: Un conductor que renovó en persona la última vez
  answer: B
  explanation: El servicio en línea no está disponible si un conductor intenta renovar
    una licencia de conducir comercial; debe completar el proceso en una oficina de
    licencias del DMV.
- id: 12
  category: license_system
  question: Después de completar el proceso de renovación en línea, ¿cuándo se le
    enviará por correo la nueva licencia de conducir al cliente?
  choices:
    A: 1-3 días hábiles
    B: 3-5 días hábiles
    C: 7-14 días hábiles
    D: 15-30 días hábiles
  answer: C
  explanation: El manual establece que la nueva licencia se enviará por correo en
    un plazo de 7 a 14 días hábiles después de completar la renovación en línea.
- id: 13
  category: sharing_the_road
  question: ¿Con qué división debe comunicarse para obtener más información sobre
    las opciones de transporte público en su área?
  choices:
    A: Sección de Registros de Tráfico (Traffic Records Section)
    B: División de Transporte Público del Departamento de Transporte de Carolina del
      Norte (N.C. Department of Transportation Public Transportation Division)
    C: Sección del Plan de Registro Internacional (International Registration Plan
      Section)
    D: Tag and Tax Together
  answer: B
  explanation: Para obtener más información sobre las opciones de transporte público
    en su área, debe llamar a la División de Transporte Público del Departamento de
    Transporte de Carolina del Norte al 919-707-4670.
- id: 14
  category: license_system
  question: ¿Se puede utilizar el sistema en línea para obtener una REAL ID por primera
    vez?
  choices:
    A: Sí, si tiene un número de seguro social válido
    B: Sí, si paga una tarifa adicional
    C: No, las emisiones de REAL ID por primera vez no se pueden realizar en línea
    D: No, las REAL ID solo se emiten a conductores comerciales
  answer: C
  explanation: 'El manual establece explícitamente: ''Los clientes no pueden utilizar
    el sistema en línea para obtener licencias o tarjetas de identificación por primera
    vez. Esto también se aplica a las emisiones de REAL ID por primera vez''.'
- id: 15
  category: license_system
  question: ¿Es legal sentarse en el asiento del conductor de un vehículo motorizado
    mientras el motor está en marcha sin una licencia de conducir válida?
  choices:
    A: Sí, siempre que el vehículo esté estacionado.
    B: Sí, si un conductor con licencia está en el asiento del pasajero.
    C: No, es ilegal.
    D: No, a menos que se encuentre en una propiedad privada.
  answer: C
  explanation: Es ilegal sentarse en el asiento del conductor de un vehículo motorizado
    mientras el motor está en marcha o dirigir un vehículo motorizado mientras es
    empujado o remolcado por otro vehículo si no se tiene una licencia de conducir
    válida.
- id: 16
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir sin los lentes correctivos adecuados
    si estos son requeridos en su licencia?
  choices:
    A: Una advertencia por la primera infracción.
    B: Una multa de $50.
    C: La misma sanción que conducir sin licencia.
    D: Suspensión inmediata del registro de su vehículo.
  answer: C
  explanation: La sanción por conducir sin los lentes correctivos adecuados es la
    misma que conducir sin licencia.
- id: 17
  category: driver_testing
  question: ¿Cuál de las siguientes pruebas NO es obligatoria para obtener un permiso
    de aprendizaje estándar para personas de 18 años o más?
  choices:
    A: Prueba de visión
    B: Prueba de señales de tráfico
    C: Conocimiento de las leyes de vehículos motorizados
    D: Habilidad de conducción (prueba en carretera)
  answer: D
  explanation: Las pruebas requeridas para un permiso de aprendizaje incluyen visión,
    señales de tráfico y conocimiento de las leyes de vehículos motorizados. La prueba
    de conducción no es obligatoria para un permiso de aprendizaje.
- id: 18
  category: license_system
  question: ¿Quién debe acompañar al titular de un permiso de aprendizaje mientras
    opera un vehículo motorizado?
  choices:
    A: Cualquier adulto mayor de 21 años.
    B: Una persona con licencia para operar el vehículo motorizado que se conduce,
      sentada al lado del titular del permiso.
    C: Un padre o tutor legal.
    D: Un instructor de conducción certificado.
  answer: B
  explanation: El titular del permiso debe, mientras opera un vehículo motorizado
    por las carreteras, estar acompañado por una persona que tenga licencia para operar
    el vehículo motorizado que se conduce y que esté sentada al lado del titular del
    permiso.
- id: 19
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de aprendizaje de motocicleta?
  choices:
    A: 6 meses
    B: 12 meses
    C: 2 años
    D: 5 años
  answer: B
  explanation: El permiso de aprendizaje de motocicleta es válido por 12 meses y puede
    renovarse por un período adicional de seis meses.
- id: 20
  category: license_system
  question: ¿Qué debe poseer un solicitante menor de 18 años antes de solicitar un
    permiso de aprendizaje de motocicleta?
  choices:
    A: Un permiso de aprendizaje estándar
    B: Una licencia provisional completa emitida por la división
    C: Una licencia de conducir comercial (CDL)
    D: Un diploma de escuela secundaria
  answer: B
  explanation: Si un solicitante tiene al menos 16 años pero menos de 18 años, debe
    poseer una licencia provisional completa emitida por la división.
- id: 21
  category: license_system
  question: ¿Se permiten pasajeros al operar una motocicleta con un permiso de aprendizaje
    de motocicleta?
  choices:
    A: Sí, si el pasajero es mayor de 18 años.
    B: Sí, si el pasajero es un conductor de motocicleta con licencia.
    C: No, el permiso autoriza la operación sin pasajeros.
    D: Sí, si el pasajero usa casco.
  answer: C
  explanation: El permiso de aprendizaje de motocicleta autoriza a una persona a operar
    una motocicleta sin pasajeros.
- id: 22
  category: driver_testing
  question: ¿Qué debe hacer para aprobar el examen de señales de tráfico?
  choices:
    A: Identificar las señales por color y forma y explicar qué significa cada una.
    B: Dibujar las señales de memoria.
    C: Leer las señales en voz alta desde una distancia de 50 pies.
    D: Identificar las señales por su ubicación en la carretera.
  answer: A
  explanation: Para aprobar el examen de señales, debe identificar las señales de
    tráfico por color y forma y explicar qué significa cada una.
- id: 23
  category: driver_testing
  question: ¿Qué adaptación está disponible para el examen de conocimientos para aquellos
    que tienen dificultad para leer?
  choices:
    A: Un examen para llevar a casa
    B: Un examen a libro abierto
    C: Exámenes de audio a petición
    D: Una demostración práctica en lugar de un examen escrito
  answer: C
  explanation: Los exámenes de audio están disponibles, a petición, para aquellos
    que tienen dificultad para leer.
- id: 24
  category: license_system
  question: Si un solicitante de un permiso de aprendizaje de motocicleta es menor
    de 18 años, ¿qué curso debe completar con éxito?
  choices:
    A: Un curso de conducción defensiva
    B: El Curso Básico para Motociclistas de la Fundación para la Seguridad en Motocicletas
      (Motorcycle Safety Foundation Basic Rider Course) o el Curso Básico para Motociclistas
      del Programa de Educación sobre Seguridad en Motocicletas de Carolina del Norte
      (NC Motorcycle Safety Education Program)
    C: Un curso de educación vial de la escuela secundaria
    D: Un curso avanzado de seguridad vial
  answer: B
  explanation: Si un solicitante es menor de 18 años, debe completar con éxito el
    Curso Básico para Motociclistas de la Fundación para la Seguridad en Motocicletas
    o el Curso Básico para Motociclistas del Programa de Educación sobre Seguridad
    en Motocicletas de Carolina del Norte.
- id: 25
  category: license_system
  question: ¿Es legal dirigir un vehículo motorizado mientras es empujado o remolcado
    por otro vehículo si no tiene una licencia de conducir válida?
  choices:
    A: Sí, porque el motor no está funcionando.
    B: Sí, si el vehículo que remolca es conducido por un conductor con licencia.
    C: No, es ilegal.
    D: Sí, pero solo en carreteras secundarias.
  answer: C
  explanation: Es ilegal sentarse en el asiento del conductor de un vehículo motorizado
    mientras el motor está funcionando o dirigir un vehículo motorizado mientras es
    empujado o remolcado por otro vehículo si no tiene una licencia de conducir válida.
- id: 26
  category: driver_testing
  question: ¿Cuál de los siguientes NO figura como un requisito de examen para una
    licencia de conducir original de cualquier tipo?
  choices:
    A: Visión
    B: Conocimiento de las leyes de vehículos motorizados
    C: Señales de tráfico
    D: Habilidad para estacionar en paralelo
  answer: D
  explanation: 'Para una licencia de conducir original de cualquier tipo, se le puede
    examinar sobre: Visión, Conocimiento de las leyes de vehículos motorizados, Señales
    de tráfico y Habilidad de conducción (examen en carretera). El estacionamiento
    en paralelo no figura como un requisito de examen específico.'
- id: 27
  category: alcohol_drugs_health
  question: ¿Se le puede emitir una licencia de conducir a una persona con una discapacidad?
  choices:
    A: No, las personas con discapacidades no pueden obtener una licencia.
    B: Sí, se puede emitir una licencia restringida siempre que la condición no les
      impida conducir de manera segura.
    C: Sí, pero solo para operar vehículos comerciales especialmente modificados.
    D: Sí, pero deben volver a tomar el examen de conducir cada 6 meses.
  answer: B
  explanation: A una persona con una discapacidad se le puede emitir una licencia
    restringida siempre que la condición no le impida conducir de manera segura.
- id: 28
  category: license_system
  question: ¿Cuántas veces se puede renovar un permiso de aprendizaje de motocicleta?
  choices:
    A: No se puede renovar.
    B: Se puede renovar por un período adicional de seis meses.
    C: Se puede renovar anualmente.
    D: Se puede renovar por un período adicional de 12 meses.
  answer: B
  explanation: El permiso de aprendizaje de motocicleta es válido por 12 meses y se
    puede renovar por un período adicional de seis meses.
- id: 29
  category: driver_testing
  question: ¿Cuándo se requiere el examen de habilidades de conducción (en carretera)?
  choices:
    A: Solo al renovar una licencia.
    B: La primera vez que solicita una licencia, y posiblemente para la renovación.
    C: Cada vez que renueva su licencia.
    D: Al solicitar un permiso de aprendizaje.
  answer: B
  explanation: La primera vez que solicita una licencia, debe realizar el examen de
    conducir. También es posible que deba realizarlo para renovar su licencia. No
    se requiere para un permiso de aprendizaje.
- id: 30
  category: driver_testing
  question: ¿Cuál de las siguientes es una habilidad observada y calificada durante
    el examen de conducción en carretera?
  choices:
    A: Estacionamiento en paralelo entre dos vehículos
    B: Cambiar una llanta desinflada
    C: Detenerse tan rápida y seguramente como sea posible cuando se le indique
    D: Revisar los niveles de aceite del motor
  answer: C
  explanation: 'El manual establece que las ''Paradas rápidas: detenerse tan rápida
    y seguramente como sea posible cuando se le indique'' es una habilidad observada
    y calificada durante el examen de conducción en carretera.'
- id: 31
  category: license_system
  question: ¿Qué clase de licencia regular necesitan la mayoría de los conductores
    para operar automóviles personales y camiones pequeños?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase C Comercial
  answer: C
  explanation: Según el manual, 'La mayoría de los conductores solo necesitan una
    licencia Regular Clase C para operar automóviles personales y camiones pequeños'.
- id: 32
  category: safe_driving_rules
  question: Al comenzar un giro de tres puntos (three-point turnabout), ¿dónde debe
    posicionar su vehículo para empezar?
  choices:
    A: Desde la línea central de la carretera
    B: Desde el extremo derecho de la carretera
    C: Desde el extremo izquierdo de la carretera
    D: Desde un carril de giro designado
  answer: B
  explanation: El manual indica 'Comenzar desde el extremo derecho de la carretera'
    al realizar el primer paso de un giro de tres puntos.
- id: 33
  category: license_system
  question: ¿Cuál de los siguientes vehículos requiere una Licencia de Conducir Comercial
    (CDL) para ser operado?
  choices:
    A: Un vehículo recreativo (RV)
    B: Equipo militar
    C: Un vehículo diseñado para transportar a 16 o más pasajeros
    D: Equipo de bomberos y emergencias
  answer: C
  explanation: Se requiere una CDL para un vehículo de motor Clase C que 'esté diseñado
    para transportar a 16 o más pasajeros, incluido el conductor'. Los vehículos recreativos
    (RV), el equipo militar y el equipo de bomberos/emergencias están exentos.
- id: 34
  category: license_system
  question: ¿Cuánta experiencia de conducción debe tener una persona para convertirse
    en conductor de autobús escolar?
  choices:
    A: Al menos tres meses
    B: Al menos seis meses
    C: Al menos un año
    D: Al menos cinco años
  answer: B
  explanation: El manual establece que el conductor de un autobús escolar debe tener
    al menos 18 años de edad y 'tener al menos seis meses de experiencia de conducción'.
- id: 35
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un Permiso de Aprendiz Limitado
    de Nivel Uno en Carolina del Norte?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: B
  explanation: 'Para solicitar un Permiso de Aprendiz Limitado de Nivel Uno, el manual
    establece: ''Debe tener al menos 15 años pero menos de 18 años''.'
- id: 36
  category: license_system
  question: Durante los primeros seis meses de tener un Permiso de Aprendiz Limitado
    de Nivel Uno, ¿en qué horario está autorizado a conducir con un conductor supervisor?
  choices:
    A: De 6 a.m. a 8 p.m.
    B: De 5 a.m. a 9 p.m.
    C: De 7 a.m. a 7 p.m.
    D: A cualquier hora del día o de la noche
  answer: B
  explanation: Durante los primeros seis meses, un permiso de nivel uno le autoriza
    a conducir 'entre las 5 a.m. y las 9 p.m., mientras esté acompañado por su conductor
    supervisor'.
- id: 37
  category: license_system
  question: ¿Durante cuánto tiempo debe haber tenido su licencia un conductor supervisor?
  choices:
    A: Al menos un año
    B: Al menos tres años
    C: Al menos cinco años
    D: Al menos diez años
  answer: C
  explanation: El manual establece que un conductor supervisor 'debe poseer una licencia
    de conducir válida y debe haber tenido licencia durante al menos cinco años'.
- id: 38
  category: license_system
  question: ¿Cuántas horas totales de operación deben detallarse en el Registro de
    Conducción (Driving Log) antes de solicitar una Licencia Provisional Limitada?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: D
  explanation: Para un Permiso de Aprendiz Limitado de Nivel Uno, se le entregará
    un Registro de Conducción para completar 'detallando un mínimo de 60 horas de
    operación'.
- id: 39
  category: safe_driving_rules
  question: Bajo un Permiso de Aprendiz Limitado de Nivel Uno, ¿cuándo se le permite
    usar un teléfono celular mientras opera un vehículo motorizado?
  choices:
    A: Cuando usa un dispositivo de manos libres
    B: Cuando está detenido en un semáforo en rojo
    C: Solo para llamar con respecto a una situación de emergencia
    D: Cuando se comunica con su conductor supervisor
  answer: C
  explanation: No se le permite usar un teléfono celular mientras opera un vehículo
    motorizado, con la excepción de que 'puede usarlo para llamar a lo siguiente con
    respecto a una situación de emergencia...'.
- id: 40
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para una Licencia Provisional Limitada
    de Nivel Dos?
  choices:
    A: 15 años
    B: 16 años
    C: 17 años
    D: 18 años
  answer: B
  explanation: 'Para una Licencia Provisional Limitada de Nivel Dos, el manual establece:
    ''Los conductores deben tener al menos 16 años, pero menos de 18''.'
- id: 41
  category: license_system
  question: 'Un conductor con una Licencia Provisional Limitada de Nivel Dos puede
    conducir sin supervisión en cualquier momento cuando se dirija directamente hacia
    o desde:'
  choices:
    A: Un evento atlético patrocinado por la escuela
    B: El trabajo o cualquier servicio voluntario de bomberos, rescate o servicios
      médicos de emergencia (EMS)
    C: La casa de un miembro de la familia
    D: Un curso de educación vial
  answer: B
  explanation: Un conductor de Nivel Dos puede conducir sin supervisión desde las
    5 a.m. hasta las 9 p.m. 'y en cualquier momento cuando conduzca directamente hacia
    o desde el trabajo o cualquier servicio voluntario de bomberos, rescate o servicio
    médico de emergencia...'
- id: 42
  category: license_system
  question: Al conducir sin supervisión con una Licencia Provisional Limitada de Nivel
    Dos, ¿cuál es la restricción sobre los pasajeros menores de 21 años que no son
    miembros del hogar del conductor?
  choices:
    A: No puede haber pasajeros menores de 21 años
    B: Puede haber exactamente un pasajero de este tipo
    C: Puede haber hasta dos pasajeros de este tipo
    D: No hay restricción en el número de pasajeros
  answer: B
  explanation: 'El manual establece: ''Al conducir sin supervisión, puede haber un
    pasajero menor de 21 años que no sea miembro del mismo hogar que el conductor''.'
- id: 43
  category: license_system
  question: ¿Quién tiene permitido sentarse en el asiento delantero de un vehículo
    conducido por una persona que posee un Permiso de Aprendiz Limitado de Nivel Uno?
  choices:
    A: Solo el conductor y el conductor supervisor
    B: El conductor y cualquier pasajero mayor de 18 años
    C: El conductor y hasta dos pasajeros
    D: Cualquier persona, siempre que use el cinturón de seguridad
  answer: A
  explanation: 'El manual establece explícitamente para los permisos de Nivel Uno:
    ''Nadie, excepto el conductor y el conductor supervisor, tiene permitido estar
    en el asiento delantero''.'
- id: 44
  category: license_system
  question: 'Según la ley de Carolina del Norte, la División no emitirá una licencia
    de conducir comercial con un endoso ''P'' o ''S'' a nadie que:'
  choices:
    A: Tenga menos de un año de experiencia en la conducción
    B: Esté obligado a registrarse bajo los programas de registro de delincuentes
      sexuales y protección pública
    C: Haya recibido una infracción de tránsito en los últimos seis meses
    D: Sea menor de 21 años
  answer: B
  explanation: 'El manual señala: ''la División no emitirá ni renovará una licencia
    de conducir comercial que refleje un endoso “P” o “S” a ninguna persona obligada
    a registrarse bajo los programas de registro de delincuentes sexuales y protección
    pública''.'
- id: 45
  category: license_system
  question: ¿Cuáles son los requisitos para un conductor supervisor?
  choices:
    A: Debe tener al menos 21 años y un historial de conducción limpio
    B: Debe poseer una licencia de conducir válida y haber tenido licencia durante
      al menos cinco años
    C: Debe ser un hermano mayor de 18 años
    D: Debe tener una licencia de conducir comercial
  answer: B
  explanation: Un conductor supervisor debe poseer una licencia de conducir válida
    y debe haber tenido licencia durante al menos cinco años.
- id: 46
  category: penalties_and_points
  question: ¿Cuál es la sanción para un titular de licencia provisional (menor de
    18 años) condenado por conducir después de consumir cualquier cantidad de alcohol
    o drogas?
  choices:
    A: Una suspensión de la licencia por 30 días
    B: Una multa de $500
    C: Una revocación de la licencia por un año
    D: Servicio comunitario obligatorio
  answer: C
  explanation: Es ilegal que un titular de licencia provisional conduzca un vehículo
    motorizado después de o mientras consume cualquier cantidad de alcohol o drogas;
    una condena por tal infracción resultará en una revocación de la licencia por
    un año.
- id: 47
  category: driver_testing
  question: ¿Cuántas horas de instrucción en el aula y al volante se requieren en
    un curso de educación vial aprobado para conductores menores de 18 años?
  choices:
    A: 20 horas de aula, 4 horas al volante
    B: 30 horas de aula, 6 horas al volante
    C: 40 horas de aula, 10 horas al volante
    D: 50 horas de aula, 12 horas al volante
  answer: B
  explanation: Los conductores menores de 18 años deben presentar un certificado que
    demuestre que han aprobado un curso de educación vial aprobado que consiste en
    al menos 30 horas de instrucción en el aula y seis horas de instrucción al volante.
- id: 48
  category: license_system
  question: ¿Qué sucede si el DMV recibe una notificación de que una persona menor
    de 18 años ya no es elegible para un Certificado de Elegibilidad de Conducción?
  choices:
    A: Se les emite un permiso de conducir por dificultades económicas
    B: Su licencia de conducir es revocada hasta que cumplan 18 años o hasta que obtengan
      un certificado/diploma
    C: Deben pagar una tarifa de restablecimiento
    D: Se les restringe a conducir solo hacia y desde el trabajo
  answer: B
  explanation: El DMV debe revocar la licencia de conducir de cualquier persona menor
    de 18 años cuando reciba una notificación de que ya no es elegible para un Certificado
    de Elegibilidad de Conducción. Esta revocación permanece en efecto hasta que la
    persona cumpla 18 años, a menos que se obtenga un Certificado de Elegibilidad
    de Conducción, un diploma de escuela secundaria o un GED.
- id: 49
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia se le permite a un titular de licencia provisional
    usar un teléfono celular mientras opera un vehículo motorizado?
  choices:
    A: Cuando usa un dispositivo de manos libres
    B: Cuando está detenido en un semáforo en rojo
    C: Para llamar a un operador de respuesta a emergencias con respecto a una situación
      de emergencia
    D: Para obtener direcciones de una aplicación de GPS
  answer: C
  explanation: Los titulares de licencias provisionales no tienen permitido usar un
    teléfono celular, excepto para llamar con respecto a una situación de emergencia
    a un operador de respuesta a emergencias, hospital, departamento de bomberos,
    fuerzas del orden, padre, tutor legal o cónyuge.
- id: 50
  category: license_system
  question: ¿Emite Carolina del Norte un permiso o licencia de conducir por dificultades
    (hardship) para personas menores de 18 años?
  choices:
    A: Sí, solo para conducir hacia y desde el trabajo
    B: Sí, si es aprobado por un administrador escolar
    C: No, Carolina del Norte no emite un permiso o licencia de conducir por dificultades
    D: Sí, pero solo para emergencias médicas
  answer: C
  explanation: 'El manual establece explícitamente: ''Carolina del Norte no emite
    un permiso o licencia de conducir por dificultades''.'
- id: 51
  category: penalties_and_points
  question: ¿Por cuánto tiempo permanece vigente la pérdida de la licencia si un estudiante
    recibe una suspensión escolar de más de 10 días consecutivos?
  choices:
    A: 30 días
    B: 6 meses
    C: 12 meses o hasta que se obtenga un Certificado de Elegibilidad para Conducir
    D: Hasta que el estudiante cumpla 21 años
  answer: C
  explanation: La pérdida de la licencia debido a una suspensión de más de 10 días
    consecutivos permanece vigente durante 12 meses o hasta que se obtenga un Certificado
    de Elegibilidad para Conducir.
- id: 52
  category: license_system
  question: ¿Qué requisito del historial de conducción debe cumplirse dentro de los
    seis meses anteriores antes de pasar a una Licencia Provisional Completa de Nivel
    Tres?
  choices:
    A: No más de dos infracciones de tránsito en movimiento
    B: Ninguna condena por infracciones de tránsito en movimiento, infracciones de
      cinturón de seguridad o de teléfono celular
    C: Finalización de un curso avanzado de conducción defensiva
    D: Cero multas de estacionamiento
  answer: B
  explanation: Antes de pasar al nivel tres, no debe tener condenas por infracciones
    de tránsito en movimiento, infracciones de cinturón de seguridad o de teléfono
    celular dentro de los seis meses anteriores.
- id: 53
  category: license_system
  question: ¿Cuál es la consecuencia legal de conducir fuera de los límites de una
    licencia de conducir restringida?
  choices:
    A: Recibirá una multa de advertencia
    B: Se considera que está conduciendo sin licencia
    C: Su vehículo será confiscado de inmediato
    D: Debe volver a tomar el examen de conocimientos escrito
  answer: B
  explanation: Si su licencia está restringida, solo debe conducir dentro de los límites
    de la restricción; de lo contrario, se considera que está conduciendo sin licencia.
- id: 54
  category: license_system
  question: ¿Cuál de los siguientes es obligatorio al solicitar una licencia de conducir
    por primera vez en Carolina del Norte?
  choices:
    A: Comprobante de seguro de responsabilidad civil del vehículo
    B: Una tarjeta de registro de votante
    C: Una carta de recomendación de un empleador
    D: Una copia certificada de sus registros médicos
  answer: A
  explanation: Deberá proporcionar un comprobante de seguro de responsabilidad civil
    del vehículo al solicitar una licencia de conducir.
- id: 55
  category: license_system
  question: A partir del 7 de mayo de 2025, ¿qué significará para el titular una licencia
    de conducir con la anotación 'Not for Federal Identification' (No apta para identificación
    federal)?
  choices:
    A: No pueden conducir en autopistas interestatales
    B: Necesitarán documentación adicional para volar en una aerolínea comercial o
      ingresar a instalaciones federales
    C: Su licencia queda suspendida hasta que la actualicen
    D: Están restringidos a conducir solo dentro de Carolina del Norte
  answer: B
  explanation: A partir del 7 de mayo de 2025, una licencia de conducir con la leyenda
    'Not for Federal Identification' significa que deberá proporcionar documentación
    adicional para volar en una aerolínea comercial e ingresar a cualquier instalación
    federal.
- id: 56
  category: license_system
  question: Al utilizar un certificado de nacimiento como prueba de identidad y fecha
    de nacimiento, ¿cuál de los siguientes no es aceptable?
  choices:
    A: Una copia certificada presentada ante una Oficina Estatal de Estadísticas Vitales
    B: Una copia laminada o réplica de plástico
    C: Una copia certificada de una agencia equivalente en el estado de nacimiento
    D: Una fotocopia certificada por la agencia emisora
  answer: B
  explanation: La Tabla 1 establece que para un certificado de nacimiento, no se permiten
    'copias laminadas ni réplicas de plástico'.
- id: 57
  category: safe_driving_rules
  question: ¿Quién está obligado a tener el cinturón de seguridad debidamente abrochado
    cuando un titular de licencia provisional opera un vehículo en movimiento?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: Todas las personas que ocupen el vehículo
    D: Solo el conductor
  answer: C
  explanation: 'El manual establece para un titular de licencia provisional: ''Toda
    persona que ocupe un vehículo en movimiento debe tener el cinturón de seguridad
    debidamente abrochado cuando el vehículo esté en movimiento''.'
- id: 58
  category: license_system
  question: ¿Qué restricciones del Nivel Uno y Nivel Dos NO se aplican a una Licencia
    Provisional Completa de Nivel Tres?
  choices:
    A: Requisitos del cinturón de seguridad
    B: Limitaciones de horario de conducción, supervisión y pasajeros
    C: La prohibición de conducir bajo los efectos del alcohol o drogas
    D: El requisito de portar comprobante de seguro
  answer: B
  explanation: Las restricciones del nivel uno y nivel dos relativas al horario de
    conducción, la supervisión y las limitaciones de pasajeros no se aplican a una
    Licencia Provisional Completa.
- id: 59
  category: license_system
  question: Si se utiliza una licencia de conducir de otro estado como prueba de identidad,
    ¿cuál es el tiempo máximo que puede estar vencida?
  choices:
    A: No puede estar vencida en absoluto
    B: Menos de 1 año
    C: Menos de 2 años
    D: Menos de 5 años
  answer: C
  explanation: La Tabla 1 establece que una licencia de conducir, permiso de aprendizaje
    o tarjeta de identificación debe ser válida o haber vencido hace menos de 2 años.
- id: 60
  category: license_system
  question: Al presentar una tarjeta de Seguro Social para obtener una licencia de
    conducir, ¿cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Se aceptan fotocopias si están notarizadas.
    B: Las tarjetas laminadas son aceptables.
    C: No se permiten fotocopias ni tarjetas laminadas.
    D: Se acepta una imagen digital de la tarjeta.
  answer: C
  explanation: Según la Tabla 2 sobre los requisitos del Número de Seguro Social,
    al presentar una tarjeta de Seguro Social, 'no se permiten fotocopias ni tarjetas
    laminadas'.
- id: 61
  category: license_system
  question: ¿Por qué ya no se aceptan las tarjetas de Medicaid o Medicare como prueba
    del Número de Seguro Social?
  choices:
    A: Se falsifican fácilmente.
    B: Los números de seguro social se eliminaron de las tarjetas en 2019.
    C: No contienen el nombre legal del solicitante.
    D: La ley federal prohíbe su uso para identificación estatal.
  answer: B
  explanation: El manual establece que los números de seguro social ya no se imprimen
    en las tarjetas de Medicaid/Medicare; se eliminaron en 2019 cuando se emitieron
    nuevas tarjetas a los participantes con nuevos números de identificación.
- id: 62
  category: license_system
  question: Debido a la Ley de Modernización (Modernization Act), ¿cuántas pruebas
    de residencia en Carolina del Norte se requieren para que un adulto obtenga una
    RID?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: A
  explanation: La Tabla 3 establece que, debido a la Ley de Modernización, solo se
    requiere una prueba de residencia en Carolina del Norte para la RID.
- id: 63
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para demostrar la residencia
    en Carolina del Norte de un menor de 18 años?
  choices:
    A: Un comprobante digital de seguro
    B: Suscripciones a revistas
    C: Una tarjeta de Seguro Social laminada
    D: Una tarjeta de Medicaid emitida en 2020
  answer: B
  explanation: La Tabla 4 enumera las 'Suscripciones a revistas' como un documento
    aceptable para demostrar la residencia de un menor de 18 años.
- id: 64
  category: license_system
  question: Al proporcionar una prueba de cobertura de seguro de responsabilidad civil
    para obtener una licencia de conducir, ¿qué formato NO se acepta?
  choices:
    A: Formulario DL-123 de un agente de seguros
    B: Un contrato de seguro provisional (insurance binder)
    C: Una póliza de seguro de vehículo impresa
    D: Un comprobante digital de seguro en un dispositivo móvil
  answer: D
  explanation: El manual establece explícitamente que no se acepta un comprobante
    digital de seguro, y no se aceptarán imágenes en un dispositivo móvil como prueba
    de seguro de responsabilidad civil.
- id: 65
  category: license_system
  question: ¿Qué documentación adicional debe proporcionar un solicitante legalmente
    ciego para obtener una tarjeta de identificación sin costo?
  choices:
    A: Una carta de un proveedor de atención primaria
    B: Una carta de un médico
    C: Una carta de un refugio para personas sin hogar
    D: Una identificación militar de los EE. UU. válida y no vencida
  answer: B
  explanation: La Tabla 8 establece que para obtener una identificación sin costo
    (No Fee ID), un solicitante legalmente ciego debe presentar una carta de un médico.
- id: 66
  category: license_system
  question: ¿A qué edad es elegible un solicitante para una tarjeta de identificación
    sin costo (No Fee ID) sin necesidad de documentación adicional?
  choices:
    A: 60 años de edad o más
    B: 65 años de edad o más
    C: 70 años de edad o más
    D: 75 años de edad o más
  answer: C
  explanation: La Tabla 8 indica que los solicitantes de 70 años de edad o más pueden
    obtener una identificación sin costo sin necesidad de documentación adicional.
- id: 67
  category: license_system
  question: ¿Cuál de los siguientes solicitantes debe proporcionar una prueba impresa
    de cobertura de seguro de responsabilidad civil automotriz?
  choices:
    A: Una persona que renueva una licencia de conducir de Carolina del Norte no vencida
    B: Una persona que solicita una licencia original, incluidas las transferencias
      de fuera del estado
    C: Una persona que solicita una tarjeta de identificación sin costo (No Fee ID)
    D: Una persona que actualiza su registro de votante
  answer: B
  explanation: La prueba de cobertura de seguro de responsabilidad civil se aplica
    a quienes solicitan una licencia original, incluidas las transferencias de fuera
    del estado.
- id: 68
  category: license_system
  question: ¿Por cuánto tiempo son válidos el Formulario DL-123, los contratos de
    seguro provisionales y los certificados a partir de la fecha de emisión?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: El manual establece que el Formulario DL-123, los contratos provisionales
    y los certificados son válidos solo por 30 días a partir de la fecha de emisión.
- id: 69
  category: license_system
  question: Si un solicitante firma una certificación de exención (DL-123A) porque
    no posee un vehículo motorizado registrado, ¿qué restricción se coloca en su licencia
    de conducir?
  choices:
    A: Conducción solo durante el día
    B: Acompañado por un conductor con licencia
    C: Solo vehículos de flota (Fleet Vehicles Only)
    D: Solo transmisión automática
  answer: C
  explanation: La exención restringe al conductor a la operación de 'Solo vehículos
    de flota' (Fleet Vehicles Only).
- id: 70
  category: license_system
  question: ¿Qué debe hacer un conductor para eliminar la restricción de 'Solo vehículos
    de flota' (Fleet Vehicles Only) de su licencia?
  choices:
    A: Pagar una tarifa de duplicado de $16.75 y presentar una prueba de responsabilidad
      financiera
    B: Aprobar un nuevo examen de carretera y pagar una tarifa de $20
    C: Esperar 30 días y presentar un nuevo formulario DL-123A
    D: Entregar su licencia y solicitar un privilegio de conducción limitado
  answer: A
  explanation: Para eliminar la restricción, el conductor debe pagar una tarifa de
    duplicado de $16.75 y presentar una prueba de responsabilidad financiera.
- id: 71
  category: license_system
  question: ¿Qué categoría debe reflejarse en un Documento de Autorización de Empleo
    para que un solicitante de Acción Diferida para los Llegados en la Infancia (DACA)
    demuestre su presencia legal?
  choices:
    A: Categoría A12
    B: Categoría C33
    C: Categoría F1
    D: Categoría J2
  answer: B
  explanation: La Tabla 6 establece que los solicitantes de DACA deben presentar un
    Documento de Autorización de Empleo que refleje la Categoría C33.
- id: 72
  category: license_system
  question: Si utiliza un formulario W-2 para demostrar su número de Seguro Social,
    ¿cuál es un requisito específico para el formulario?
  choices:
    A: Debe estar notarizado por un funcionario estatal
    B: Debe tener menos de 30 días de antigüedad
    C: No debe estar redactado (censurado) y debe contener el número de seguro social
      completo
    D: Debe ir acompañado de un comprobante de pago
  answer: C
  explanation: La Tabla 2 establece que un formulario W-2 no debe estar redactado
    y debe contener el número de seguro social completo.
- id: 73
  category: license_system
  question: ¿Qué documentación se requiere para obtener una tarjeta de identificación
    sin costo (No Fee ID) basada en una discapacidad del desarrollo?
  choices:
    A: Una carta de un proveedor de atención primaria
    B: Una carta de un médico
    C: Una identificación militar de los EE. UU. válida y no vencida
    D: Un Registro de Vehículos Motorizados de Carolina del Norte (NC Motor Vehicle
      Record) certificado
  answer: A
  explanation: La Tabla 8 establece que un solicitante con una discapacidad del desarrollo
    debe presentar una carta de un proveedor de atención primaria para obtener una
    identificación sin costo (No Fee ID).
- id: 74
  category: license_system
  question: ¿Se requiere prueba de seguro de responsabilidad civil para alguien a
    quien el tribunal le ha otorgado un Privilegio de Conducción Limitado?
  choices:
    A: No, solo se requiere para licencias originales
    B: Sí, se requiere una prueba impresa del seguro de responsabilidad civil automotriz
    C: No, la orden judicial sirve como prueba de seguro
    D: Sí, pero solo si poseen un vehículo de flota
  answer: B
  explanation: El manual establece que el requisito de prueba de cobertura de seguro
    de responsabilidad civil se aplica a quienes el tribunal les ha otorgado un Privilegio
    de Conducción Limitado.
- id: 75
  category: license_system
  question: ¿Qué restricción se le impone a un conductor que firma una certificación
    de exención (DL-123A)?
  choices:
    A: Conducción diurna únicamente
    B: Solo vehículos de flota (Fleet Vehicles Only)
    C: Transmisión automática únicamente
    D: No conducir en carreteras interestatales
  answer: B
  explanation: Según el manual, la exención DL-123A restringe al conductor a la operación
    de 'Solo vehículos de flota' (Fleet Vehicles Only).
- id: 76
  category: license_system
  question: ¿Cómo se puede identificar visualmente una licencia de conducir o tarjeta
    de identificación REAL ID de Carolina del Norte?
  choices:
    A: Tiene un borde dorado
    B: Tiene una estrella
    C: Está impresa verticalmente
    D: Muestra un holograma del sello del estado
  answer: B
  explanation: El manual establece que una REAL ID es una licencia de conducir, permiso
    de aprendizaje o tarjeta de identificación con una estrella.
- id: 77
  category: license_system
  question: ¿Qué texto exige la ley federal que aparezca en el anverso de una licencia
    o tarjeta de identificación que no sea REAL ID?
  choices:
    A: NO ES VÁLIDA PARA VOTAR
    B: SOLO PARA USO ESTATAL
    C: NO PARA IDENTIFICACIÓN FEDERAL (NOT FOR FEDERAL IDENTIFICATION)
    D: IDENTIFICACIÓN TEMPORAL
  answer: C
  explanation: Según lo exige la ley federal, las licencias y tarjetas de identificación
    que no sean REAL ID mostrarán 'NOT FOR FEDERAL IDENTIFICATION' en el anverso de
    la tarjeta.
- id: 78
  category: license_system
  question: ¿Cuántos días tiene un nuevo residente para obtener una licencia de conducir
    o un permiso de aprendizaje de Carolina del Norte después de establecer su residencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Un nuevo residente tiene 60 días después de establecer su residencia
    para obtener una licencia o permiso de aprendizaje de Carolina del Norte.
- id: 79
  category: license_system
  question: Si posee una licencia de conducir comercial (CDL) de otra jurisdicción,
    ¿cuánto tiempo tiene para solicitar una CDL de Carolina del Norte después de convertirse
    en residente?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Si posee una licencia de conducir comercial de otra jurisdicción, debe
    solicitar y recibir una licencia comercial de Carolina del Norte dentro de los
    30 días posteriores a convertirse en residente.
- id: 80
  category: driver_testing
  question: ¿Cuál de los siguientes NO figura como un posible requisito de examen
    para un nuevo residente que solicita una licencia Clase C?
  choices:
    A: Examen de la vista
    B: Examen de reconocimiento de señales de tráfico
    C: Examen de ensayo escrito
    D: Examen de conocimientos
  answer: C
  explanation: El manual enumera el examen de conocimientos, el examen de la vista,
    el examen de reconocimiento de señales de tráfico y el examen de habilidades de
    conducción como posibles requisitos. No se requiere un examen de ensayo escrito.
- id: 81
  category: license_system
  question: ¿Cuál de las siguientes personas se considera no residente de Carolina
    del Norte?
  choices:
    A: Una persona que ha vivido en Carolina del Norte durante 2 años
    B: Un estudiante universitario de otro estado que tiene la intención de regresar
      a su estado de origen
    C: Una persona que recientemente compró una casa permanente en Carolina del Norte
    D: Un conductor comercial que acaba de transferir su licencia de conducir comercial
      (CDL) a Carolina del Norte
  answer: B
  explanation: Los ejemplos de no residentes incluyen a los estudiantes universitarios
    de otros estados que tienen la intención de regresar a sus estados de origen al
    finalizar su educación en Carolina del Norte.
- id: 82
  category: license_system
  question: Cuando realiza los exámenes requeridos y se toma la fotografía en una
    oficina local de licencias de conducir, ¿por cuánto tiempo es válido su certificado
    de conducción temporal?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: D
  explanation: Los clientes que realicen los exámenes requeridos y se tomen las fotografías
    en la oficina local de licencias de conducir recibirán un certificado de conducción
    temporal válido por 60 días.
- id: 83
  category: license_system
  question: ¿Qué formato utiliza el DMV para las licencias de conducir y tarjetas
    de identificación emitidas a solicitantes menores de 21 años?
  choices:
    A: Formato horizontal
    B: Formato vertical
    C: Formato cuadrado
    D: Formato en blanco y negro
  answer: B
  explanation: El DMV emite una licencia o tarjeta de identificación vertical a los
    solicitantes menores de 21 años.
- id: 84
  category: license_system
  question: ¿Qué indican las barras de color rojo y amarillo en una licencia emitida
    a un solicitante menor de 18 años?
  choices:
    A: Las fechas en que cumplen 18 y 21 años
    B: Su elegibilidad para una licencia comercial
    C: Su estatus como conductor aprendiz
    D: Las fechas en que vence el registro de su vehículo
  answer: A
  explanation: Los solicitantes menores de 18 años reciben licencias o tarjetas de
    identificación con dos barras de colores, rojo y amarillo, junto a su foto, que
    indican sus cumpleaños número 18 y 21.
- id: 85
  category: license_system
  question: ¿Con cuánta antelación se puede renovar una licencia de conducir de Carolina
    del Norte antes de su fecha de vencimiento?
  choices:
    A: Hasta 30 días
    B: Hasta 60 días
    C: Hasta 180 días
    D: Hasta 365 días
  answer: C
  explanation: Una licencia de conducir puede renovarse en cualquier momento dentro
    de los 180 días anteriores a su vencimiento.
- id: 86
  category: license_system
  question: Para ser elegible para renovar una licencia estándar de Clase C por correo,
    ¿un residente NO debe ser mayor de qué edad en la fecha de la solicitud?
  choices:
    A: '65'
    B: '70'
    C: '72'
    D: '75'
  answer: C
  explanation: Uno de los requisitos para renovar por correo es que el cliente no
    debe ser mayor de 72 años en la fecha de la solicitud de renovación por correo.
- id: 87
  category: license_system
  question: ¿Cuántas veces durante la vida del titular de la licencia se puede renovar
    por correo una licencia de conducir con una designación militar?
  choices:
    A: Una vez
    B: No más de dos veces
    C: Hasta tres veces
    D: Veces ilimitadas
  answer: B
  explanation: Una licencia de conducir con designación militar no puede renovarse
    más de dos veces durante la vida del titular de la licencia.
- id: 88
  category: license_system
  question: ¿Qué documento puede presentar un veterano militar en su oficina local
    de licencias de conducir para demostrar su baja honorable y recibir la designación
    de 'VETERANO' (VETERAN)?
  choices:
    A: Un talón de pago reciente
    B: Un formulario de baja DD-214
    C: Una tarjeta de registro de votante
    D: Un certificado de nacimiento
  answer: B
  explanation: Los veteranos interesados en solicitar la designación deben llevar
    su formulario de baja DD-214 a su oficina local de licencias de conducir para
    demostrar que han sido dados de baja honorablemente.
- id: 89
  category: license_system
  question: ¿Cuál es el costo adicional para obtener una REAL ID de Carolina del Norte
    en comparación con una licencia de conducir estándar?
  choices:
    A: $10.00
    B: $15.50
    C: $16.75
    D: No hay costo adicional
  answer: D
  explanation: El manual establece explícitamente que todas las tarifas actuales para
    nuevas emisiones, renovaciones y duplicados son las mismas, y no hay un costo
    adicional por una REAL ID de Carolina del Norte.
- id: 90
  category: license_system
  question: ¿Cuál es la tarifa de una tarjeta de identificación estatal para un residente
    que tiene 17 años o más?
  choices:
    A: $6.50
    B: $16.75
    C: $25.50
    D: No hay tarifa
  answer: D
  explanation: Según el manual, no hay tarifa por una tarjeta de identificación estatal
    para los residentes que tengan al menos 17 años, sean legalmente ciegos o no tengan
    hogar.
- id: 91
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir para una persona
    que tiene 66 años al momento de la emisión?
  choices:
    A: 3 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: B
  explanation: El manual establece que para una persona de 66 años o más al momento
    de la emisión, la duración de la licencia es de 5 años.
- id: 92
  category: license_system
  question: ¿Cuántos días tiene para notificar al DMV y obtener un duplicado de la
    licencia si cambia su dirección?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Si su dirección cambia con respecto a la dirección en su licencia de
    conducir, debe notificar a la división sobre el cambio dentro de los 60 días y
    obtener un duplicado de la licencia.
- id: 93
  category: license_system
  question: Antes de cambiar su nombre en el DMV, ¿cuánto tiempo debe esperar después
    de visitar su oficina local de la Administración del Seguro Social?
  choices:
    A: Al menos 24 horas
    B: Al menos 48 horas
    C: Al menos 7 días
    D: Al menos 30 días
  answer: A
  explanation: El manual instruye a los conductores a visitar su oficina local de
    la Administración del Seguro Social al menos 24 horas antes de cambiar su nombre
    en el DMV para que el sistema de verificación en línea pueda actualizarse.
- id: 94
  category: alcohol_drugs_health
  question: Según las investigaciones, ¿a qué concentración de alcohol en sangre (BAC)
    comienza a aumentar el riesgo de verse involucrado en un choque?
  choices:
    A: 0.02 por ciento
    B: 0.04 por ciento
    C: 0.05 por ciento
    D: 0.08 por ciento
  answer: C
  explanation: Las investigaciones muestran que el riesgo de verse involucrado en
    un choque aumenta cuando el nivel de alcohol es del 0.05 por ciento.
- id: 95
  category: penalties_and_points
  question: ¿Cuál es la sanción por negarse a realizar una prueba química obligatoria
    de aliento o sangre?
  choices:
    A: Revocación inmediata por 10 días y una multa de $500
    B: Revocación inmediata por al menos 30 días y una revocación adicional mínima
      de 12 meses
    C: Una advertencia por la primera infracción y una suspensión de 6 meses por la
      segunda
    D: Revocación inmediata por 6 meses sin posibilidad de privilegios de conducción
      limitados
  answer: B
  explanation: La negativa a realizar cualquier prueba requerida resultará en la revocación
    inmediata de su licencia de conducir por al menos 30 días y una revocación adicional
    mínima de 12 meses por parte del DMV.
- id: 96
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    un conductor que opera un Vehículo Motorizado Comercial?
  choices:
    A: 0.02 por ciento
    B: 0.04 por ciento
    C: 0.06 por ciento
    D: 0.08 por ciento
  answer: B
  explanation: Conducir bajo los efectos del alcohol se puede demostrar mediante una
    concentración de alcohol en sangre de 0.08 por ciento o más, o de 0.04 o más si
    conduce un Vehículo Motorizado Comercial.
- id: 97
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes acciones está prohibida bajo las leyes de DWI
    de Carolina del Norte?
  choices:
    A: Transportar un recipiente abierto de una bebida alcohólica en el maletero de
      un automóvil
    B: Transportar un recipiente abierto de una bebida alcohólica en el área de pasajeros
      de un automóvil
    C: Transportar recipientes cerrados de alcohol en un vehículo personal
    D: Consumir bebidas no alcohólicas mientras conduce
  answer: B
  explanation: Las leyes de DWI prohíben el transporte de un recipiente abierto de
    cualquier bebida alcohólica, incluso en el área de pasajeros del automóvil.
- id: 98
  category: penalties_and_points
  question: ¿Cuál es un requisito obligatorio para una persona condenada por un DWI
    por segunda vez?
  choices:
    A: Deben entregar su vehículo al estado
    B: Deben cumplir una sentencia de cárcel
    C: Deben perder permanentemente su licencia de conducir
    D: Deben pagar una multa de $10,000
  answer: B
  explanation: Las leyes de DWI de Carolina del Norte requieren que las personas condenadas
    por DWI por segunda vez cumplan una sentencia de cárcel.
- id: 99
  category: license_system
  question: ¿Cómo se indica la participación en el Programa de Donantes de Órganos
    en una licencia de conducir o tarjeta de identificación de Carolina del Norte?
  choices:
    A: Un símbolo de cruz roja en la parte posterior
    B: Un símbolo de corazón en la parte delantera
    C: La palabra 'DONOR' impresa en letras rojas en negrita
    D: Un símbolo de cinta verde en la parte delantera
  answer: B
  explanation: Las licencias de conducir y las tarjetas de identificación de los donantes
    llevan un símbolo de corazón en la parte delantera de sus tarjetas, lo que representa
    su consentimiento para ser donantes de órganos y ojos.
- id: 100
  category: license_system
  question: ¿Cuántos documentos de identificación aprobados por el DMV debe mostrar
    a un examinador para reemplazar una licencia de conducir perdida o robada en persona?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para reemplazar una licencia perdida o robada, puede mostrar al examinador
    dos documentos de identificación aprobados por el DMV.
- id: 101
  category: alcohol_drugs_health
  question: ¿Qué estableció la Ley de Caminos Seguros (Safe Roads Act) de 1983 en
    Carolina del Norte?
  choices:
    A: Creó delitos separados para la conducción bajo los efectos del alcohol y la
      conducción bajo los efectos de drogas
    B: Reemplazó todas las leyes anteriores sobre conducción en estado de ebriedad
      con un solo delito de Conducir Bajo los Efectos del Alcohol o Drogas (DWI)
    C: Legalizó el transporte de contenedores abiertos en el área de pasajeros
    D: Redujo el límite legal de BAC para todos los conductores al 0.04 por ciento
  answer: B
  explanation: La Ley de Caminos Seguros derogó todas las leyes anteriores sobre conducción
    en estado de ebriedad en Carolina del Norte y las reemplazó con un solo delito
    de 'Conducir Bajo los Efectos del Alcohol o Drogas (DWI)'.
- id: 102
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restauración por una suspensión de licencia relacionada
    con el alcohol?
  choices:
    A: $25.50
    B: $51.50
    C: $83.50
    D: $167.25
  answer: D
  explanation: De acuerdo con la Lista de Tarifas, la Tarifa de Restauración (alcohol)
    es de $167.25.
- id: 103
  category: alcohol_drugs_health
  question: ¿Cuál es la regla con respecto a las bebidas alcohólicas en el área de
    pasajeros de un vehículo motorizado comercial?
  choices:
    A: Solo se permiten contenedores cerrados
    B: Solo están prohibidos los contenedores abiertos
    C: Tanto los contenedores abiertos como los cerrados están prohibidos
    D: Se permiten si se guardan en una hielera
  answer: C
  explanation: Las leyes de DWI prohíben la posesión de bebidas alcohólicas (abiertas
    o cerradas) en el área de pasajeros de un vehículo motorizado comercial mientras
    se encuentre en cualquier carretera, calle o área vehicular pública.
- id: 104
  category: license_system
  question: ¿Por cuántos años es válida una licencia de conducir si se le expide a
    una persona que tiene 30 años?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Para las personas de 18 a 65 años en el momento de la expedición, la
    duración de la licencia es de 8 años.
- id: 105
  category: license_system
  question: Según la ley de Carolina del Norte, ¿qué solicitantes deben dar su consentimiento
    para el registro en el Sistema de Servicio Selectivo (Selective Service System)
    al solicitar una licencia de conducir o tarjeta de identificación?
  choices:
    A: Todos los ciudadanos hombres y mujeres menores de 30 años
    B: Cualquier ciudadano estadounidense o inmigrante varón entre las edades de 18
      y 25 años
    C: Cualquier ciudadano varón mayor de 21 años
    D: Solo inmigrantes varones entre las edades de 18 y 25 años
  answer: B
  explanation: El manual establece que el DMV está obligado a notificar a cualquier
    ciudadano estadounidense o inmigrante varón entre las edades de 18 y 25 años que
    su solicitud sirve como su consentimiento para ser registrado en el Sistema de
    Servicio Selectivo.
- id: 106
  category: license_system
  question: Si el DMV verifica que una persona está registrada actualmente como delincuente
    sexual, ¿cuál de los siguientes endosos NO se le otorgará en una Licencia de Conducir
    Comercial (CDL)?
  choices:
    A: Materiales Peligrosos (H) o Vehículo Tanque (N)
    B: Pasajeros (P) o Autobús Escolar (S)
    C: Remolques Dobles/Triples (T)
    D: Frenos de Aire (L)
  answer: B
  explanation: Si la División verifica que la persona está registrada actualmente
    como delincuente sexual en Carolina del Norte o cualquier otro estado, la División
    no emitirá una Licencia de Conducir Comercial con un endoso de Pasajeros (P) o
    Autobús Escolar (S).
- id: 107
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera condena por Conducir Bajo los Efectos
    del Alcohol o Drogas (DWI) en Carolina del Norte?
  choices:
    A: Revocación obligatoria de su licencia de conducir por un período de un año
    B: Revocación obligatoria de su licencia de conducir por seis meses
    C: Una suspensión de 60 días de su privilegio de conducir
    D: Instalación obligatoria de un dispositivo de bloqueo de encendido por dos años
  answer: A
  explanation: Según el manual, una primera condena por DWI resulta en una revocación
    obligatoria de su licencia de conducir por un período de un año.
- id: 108
  category: penalties_and_points
  question: 'Una cuarta condena por DWI se considera un delito grave (felony) si las
    tres condenas previas por DWI ocurrieron dentro de los últimos:'
  choices:
    A: 3 años
    B: 5 años
    C: 7 años
    D: 10 años
  answer: C
  explanation: 'El manual establece: ''Cuarta condena: Revocación obligatoria permanente
    de la licencia de conducir. La cuarta condena se considera un delito grave si
    las tres condenas previas por DWI ocurrieron dentro de los últimos siete años''.'
- id: 109
  category: alcohol_drugs_health
  question: ¿Cuál será la restricción de concentración de alcohol en sangre (BAC)
    en la primera restauración de una licencia tras una suspensión por DWI?
  choices:
    A: '0.00'
    B: '0.04'
    C: '0.08'
    D: '0.15'
  answer: B
  explanation: En la primera restauración tras una suspensión por DWI, la restricción
    de concentración de alcohol será de 0.04.
- id: 110
  category: penalties_and_points
  question: 'Se requiere la instalación de un dispositivo de bloqueo de encendido
    (ignition interlock device) en el vehículo si un conductor es condenado por Conducir
    Bajo los Efectos del Alcohol o Drogas (DWI) con un BAC de al menos:'
  choices:
    A: '0.04'
    B: '0.08'
    C: '0.10'
    D: '0.15'
  answer: D
  explanation: Una condena por Conducir Bajo los Efectos del Alcohol o Drogas con
    un BAC de 0.15 o más, u otra condena dentro de los últimos siete años, requerirá
    la instalación de un dispositivo de bloqueo de encendido en el vehículo.
- id: 111
  category: alcohol_drugs_health
  question: 'Si un conductor menor de 21 años es condenado por conducir con cualquier
    cantidad de alcohol o drogas en su cuerpo, su licencia será revocada por:'
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Si un conductor menor de 21 años es condenado por una infracción de
    conducir con cualquier cantidad de alcohol o drogas en su cuerpo, su licencia
    será revocada por un año.
- id: 112
  category: penalties_and_points
  question: ¿Cuántos puntos en la licencia de conducir debe acumular antes de que
    se le asigne a una clínica de mejora para conductores?
  choices:
    A: 5 puntos
    B: 7 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Si acumula siete puntos, se le puede asignar a una clínica de mejora
    para conductores.
- id: 113
  category: penalties_and_points
  question: ¿Su licencia de conducir puede ser suspendida si acumula cuántos puntos
    en un período de tres años?
  choices:
    A: 7 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: Si acumula hasta 12 puntos en un período de tres años, su licencia
    puede ser suspendida.
- id: 114
  category: penalties_and_points
  question: Si su licencia de conducir es suspendida por el sistema de puntos por
    primera vez, ¿por cuánto tiempo se le puede retirar?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 12 meses
  answer: B
  explanation: Si su licencia de conducir es suspendida por el sistema de puntos,
    se le puede retirar por 60 días en la primera suspensión.
- id: 115
  category: penalties_and_points
  question: ¿Cuántos puntos de la licencia de conducir se otorgan por una condena
    por rebasar a un autobús escolar detenido en un vehículo motorizado estándar (no
    comercial)?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 8 puntos
  answer: C
  explanation: De acuerdo con el programa regular de valores de puntos, rebasar a
    un autobús escolar detenido conlleva un valor de 5 puntos.
- id: 116
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por rebasar a un autobús escolar detenido mientras
    se opera un vehículo motorizado comercial?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: De acuerdo con el programa de valores de puntos para infracciones al
    operar un vehículo motorizado comercial, rebasar a un autobús escolar detenido
    conlleva un valor de 8 puntos.
- id: 117
  category: penalties_and_points
  question: ¿Por cuál de las siguientes infracciones NO se asignarán puntos en la
    licencia de conducir?
  choices:
    A: Seguir demasiado de cerca
    B: Estacionamiento ilegal
    C: Pasarse una señal de alto
    D: No sujetar adecuadamente a un niño con el cinturón de seguridad
  answer: B
  explanation: El manual enumera varias infracciones por las cuales no se asignarán
    puntos, incluyendo el 'Estacionamiento ilegal'.
- id: 118
  category: penalties_and_points
  question: ¿Cuál es la sanción para cualquier persona que permita que su licencia
    de conducir sea utilizada por una persona menor de edad para comprar una bebida
    alcohólica?
  choices:
    A: Una suspensión de la licencia por 30 días
    B: Una suspensión de la licencia por 6 meses
    C: Una revocación de la licencia de conducir por un año
    D: Una revocación permanente de la licencia de conducir
  answer: C
  explanation: La ley exige una revocación de la licencia de conducir por un año tras
    la condena de cualquier persona que permita que su licencia de conducir o cualquier
    otra identificación sea utilizada por una persona menor de edad para comprar o
    intentar comprar una bebida alcohólica.
- id: 119
  category: penalties_and_points
  question: El DMV puede suspender su licencia de conducir si recibe dos condenas
    en un período de 12 meses por ¿cuál de las siguientes infracciones?
  choices:
    A: Exceso de velocidad a más de 55 mph
    B: Seguir demasiado de cerca
    C: Pasarse un semáforo en rojo
    D: Conducir por el lado equivocado de la carretera
  answer: A
  explanation: El DMV puede suspender su licencia por dos condenas de exceso de velocidad
    a más de 55 mph en un período de 12 meses.
- id: 120
  category: penalties_and_points
  question: Bajo la ley de Carolina del Norte, el DMV puede suspender su licencia
    por ¿cuál de los siguientes motivos?
  choices:
    A: Una condena por exceso de velocidad a más de 45 mph
    B: Dos condenas por exceso de velocidad a más de 55 mph en un período de 12 meses
    C: Una condena por exceso de velocidad a más de 50 mph en 6 meses
    D: Tres condenas por exceso de velocidad a más de 40 mph en 2 años
  answer: B
  explanation: El DMV puede suspender su licencia por dos condenas de exceso de velocidad
    a más de 55 mph en un período de 12 meses.
- id: 121
  category: penalties_and_points
  question: 'Su privilegio de conducir será revocado por al menos 30 días si es condenado
    por conducir cualquier vehículo a más de 15 millas por hora sobre el límite de
    velocidad, siempre que conduzca a una velocidad superior a:'
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: Su privilegio de conducir será revocado por al menos 30 días si es
    condenado por conducir cualquier vehículo a más de 15 millas por hora sobre el
    límite de velocidad, si conduce a una velocidad superior a 55 mph.
- id: 122
  category: penalties_and_points
  question: ¿Cuál es el tiempo de suspensión por una condena de carreras preacordadas
    con otro vehículo motorizado en la carretera?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: D
  explanation: Una condena por carreras preacordadas con otro vehículo motorizado
    en la carretera resulta en una suspensión de 3 años.
- id: 123
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por homicidio involuntario mientras se está bajo la
    influencia de una sustancia que altera las facultades?
  choices:
    A: Suspensión de 1 año
    B: Suspensión de 3 años
    C: Suspensión de 5 años
    D: Suspensión permanente
  answer: D
  explanation: De acuerdo con la tabla de tiempos de suspensión, el homicidio involuntario
    bajo la influencia de una sustancia que altera las facultades resulta en una suspensión
    permanente.
- id: 124
  category: penalties_and_points
  question: ¿Cuál es la sanción por no ceder el paso al entrar en una intersección
    que resulte en lesiones corporales graves?
  choices:
    A: 30 días de suspensión y multa de $100
    B: 60 días de suspensión y multa de $250
    C: 90 días de suspensión y multa de $500
    D: 1 año de suspensión y multa de $1000
  answer: C
  explanation: No ceder el paso resultando en lesiones corporales graves conlleva
    una sanción de 90 días de suspensión y una multa de $500.
- id: 125
  category: driver_responsibility
  question: Si cree que su privilegio de conducir no debería haber sido revocado y
    una audiencia del DMV no le brinda ayuda, ¿cuánto tiempo tiene para apelar la
    decisión ante el Tribunal Superior?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Puede apelar la decisión del DMV dentro de los 30 días ante el Tribunal
    Superior del condado donde vive.
- id: 126
  category: penalties_and_points
  question: ¿Cómo maneja el DMV de Carolina del Norte las condenas de tráfico que
    ocurren fuera del estado?
  choices:
    A: Se ignoran a menos que involucren una fatalidad.
    B: Pueden resultar en la suspensión o revocación de su licencia tal como si las
      infracciones hubieran ocurrido en Carolina del Norte.
    C: Solo añaden puntos a su licencia pero no pueden causar una suspensión.
    D: Requieren que vuelva a tomar el examen de conducir pero no conllevan otras
      sanciones.
  answer: B
  explanation: Las condenas que ocurren fuera de Carolina del Norte pueden resultar
    en la suspensión o revocación de su licencia, tal como si las infracciones hubieran
    ocurrido en este estado.
- id: 127
  category: license_system
  question: 'Si usted es titular de una licencia provisional (menor de 18 años), su
    licencia puede ser suspendida por 90 días al ser condenado por:'
  choices:
    A: Una primera infracción de movimiento dentro de un período de 12 meses.
    B: Una segunda infracción de movimiento dentro de un período de 12 meses.
    C: Una tercera infracción de movimiento dentro de un período de 12 meses.
    D: Una cuarta infracción de movimiento dentro de un período de 12 meses.
  answer: C
  explanation: La licencia de un titular de licencia provisional puede ser suspendida
    por 90 días al ser condenado por una tercera infracción de movimiento ocurrida
    dentro de un período de 12 meses.
- id: 128
  category: penalties_and_points
  question: ¿Cuál es la tarifa estándar de restauración requerida por la ley de Carolina
    del Norte para anular una suspensión o revocación (excluyendo condenas por DWI
    o razones médicas)?
  choices:
    A: $50.00
    B: $83.50
    C: $167.25
    D: $200.00
  answer: B
  explanation: La ley de Carolina del Norte requiere que se pague una tarifa de restauración
    de $83.50 al DMV antes de que se pueda anular una suspensión o revocación.
- id: 129
  category: alcohol_drugs_health
  question: ¿De cuánto es la tarifa de restauración cuando la revocación de la licencia
    de conducir es el resultado de una condena por DWI?
  choices:
    A: $50.00
    B: $83.50
    C: $167.25
    D: $250.00
  answer: C
  explanation: Se requiere una tarifa de restauración de $167.25 cuando la revocación
    es el resultado de una condena por DWI.
- id: 130
  category: penalties_and_points
  question: 'Al restaurar una licencia de conducir revocada o suspendida, se requiere
    una tarifa de servicio de $50 A MENOS QUE:'
  choices:
    A: El conductor complete un curso de conducción defensiva.
    B: El conductor sea menor de 18 años.
    C: La licencia haya sido entregada al tribunal o enviada por correo al DMV antes
      de la fecha de entrada en vigor de la suspensión.
    D: El conductor pague la tarifa de restauración en efectivo.
  answer: C
  explanation: Se requiere una tarifa de servicio de $50 al momento de la restauración,
    a menos que la licencia haya sido entregada al tribunal o enviada por correo al
    DMV antes de la fecha de entrada en vigor de la suspensión o revocación.
- id: 131
  category: defensive_driving
  question: Según el manual, a 55 mph, ¿en cuánto tiempo recorre un vehículo la longitud
    de un campo de fútbol americano?
  choices:
    A: 2.5 segundos
    B: 3.7 segundos
    C: 4.2 segundos
    D: 5.0 segundos
  answer: B
  explanation: A 55 mph, un vehículo recorre la longitud de un campo de fútbol americano
    en 3.7 segundos.
- id: 132
  category: defensive_driving
  question: ¿Cuál de las siguientes es una señal de advertencia de conducción con
    somnolencia?
  choices:
    A: No puede recordar las últimas millas recorridas.
    B: Está sujetando el volante con demasiada fuerza.
    C: Está revisando sus espejos con más frecuencia de lo habitual.
    D: Siente la necesidad de aumentar su velocidad.
  answer: A
  explanation: Una señal de advertencia de conducción con somnolencia es que no puede
    recordar las últimas millas recorridas.
- id: 133
  category: penalties_and_points
  question: Si no puede permitirse pagar una multa de tráfico, ¿cuál es el primer
    paso en la Opción A para pedir al tribunal que reduzca o exonere el monto adeudado?
  choices:
    A: Llamar al DMV para solicitar un plan de pagos.
    B: Completar la Moción de Alivio (Motion for Relief, AOC-CR-415).
    C: Entregar su licencia de conducir en la estación de policía local.
    D: Enviar por correo una carta de explicación al Tribunal Superior.
  answer: B
  explanation: El paso 1 de la Opción A (NO PUEDO pagar ahora) es completar la Moción
    de Alivio (Motion for Relief), AOC-CR-415.
- id: 134
  category: safe_driving_rules
  question: Para ayudar a prevenir la conducción con somnolencia, ¿cuál es el límite
    diario de conducción recomendado?
  choices:
    A: 100-200 millas
    B: 300-400 millas
    C: 500-600 millas
    D: 700-800 millas
  answer: B
  explanation: El manual recomienda intentar establecer un límite de 300-400 millas
    de conducción por día para prevenir la conducción con somnolencia.
- id: 135
  category: defensive_driving
  question: Al conducir largas distancias, ¿con qué frecuencia debe detenerse para
    salir del automóvil, estirarse y caminar a paso ligero?
  choices:
    A: Al menos cada 2 horas
    B: Al menos cada 4 horas
    C: Solo cuando necesite cargar combustible
    D: Cada 100 millas
  answer: A
  explanation: Para prevenir la conducción con somnolencia, el manual aconseja detenerse
    regularmente al conducir largas distancias y salir del automóvil al menos cada
    2 horas para estirarse y caminar a paso ligero.
- id: 136
  category: defensive_driving
  question: ¿Por qué las distracciones dificultan la realización de maniobras preventivas
    o evasivas para evitar un choque?
  choices:
    A: Aumentan el campo de visión del conductor
    B: Hacen que los frenos del vehículo respondan más lentamente
    C: Muchas distracciones obligan al conductor a quitar al menos una mano del volante
    D: Hacen que el conductor sea excesivamente cauteloso
  answer: C
  explanation: El manual establece que las distracciones dificultan la realización
    de maniobras preventivas o evasivas para evitar un choque porque muchas distracciones
    obligan al conductor a quitar al menos una mano del volante.
- id: 137
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia puede un conductor menor de 18 años usar un teléfono
    celular mientras el vehículo está en movimiento?
  choices:
    A: Al llamar a un padre o tutor legal
    B: Al usar un dispositivo de manos libres
    C: Al llamar al 911 en una emergencia
    D: Cuando está detenido en un semáforo en rojo
  answer: C
  explanation: A los conductores menores de 18 años no se les permite usar un teléfono
    celular mientras el vehículo está en movimiento, con la excepción de llamar al
    911 en una emergencia.
- id: 138
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones es ilegal mientras se opera un vehículo
    en una calle o carretera pública?
  choices:
    A: Escuchar la radio
    B: Usar un teléfono celular para enviar correos electrónicos o mensajes de texto
    C: Hablar con los pasajeros
    D: Usar el sistema de control de clima del vehículo
  answer: B
  explanation: El manual establece que es ilegal usar un teléfono celular para enviar
    correos electrónicos o mensajes de texto mientras se opera un vehículo en una
    calle o carretera pública o en un área vehicular pública.
- id: 139
  category: alcohol_drugs_health
  question: ¿Aproximadamente qué porcentaje de todas las muertes por accidentes de
    tráfico involucran alcohol?
  choices:
    A: 15 por ciento
    B: 25 por ciento
    C: 38 por ciento
    D: 50 por ciento
  answer: C
  explanation: Según el manual, aproximadamente el 38 por ciento de todas las muertes
    por accidentes de tráfico involucran alcohol.
- id: 140
  category: alcohol_drugs_health
  question: Debido a que el alcohol es un depresor, ¿cómo puede afectar su comportamiento
    al conducir?
  choices:
    A: Agudiza su capacidad para juzgar la distancia
    B: Acelera sus funciones cerebrales y tiempos de reacción
    C: Le da una falsa confianza y puede hacer que corra mayores riesgos
    D: Facilita hacer más de una cosa a la vez
  answer: C
  explanation: El alcohol es un depresor que le da una falsa confianza, lo que significa
    que puede correr mayores riesgos porque piensa que su conducción es mejor de lo
    que realmente es.
- id: 141
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de recuperar la sobriedad después de
    beber alcohol?
  choices:
    A: Beber café cargado
    B: Tomar una ducha fría
    C: Comer una comida abundante
    D: Dejar que pase el tiempo
  answer: D
  explanation: 'El manual establece explícitamente: ''Lo único que hace que un bebedor
    recupere la sobriedad es el tiempo. El café, una comida abundante o las duchas
    frías no funcionarán''.'
- id: 142
  category: safe_driving_rules
  question: ¿Qué afirmación es verdadera con respecto a los cinturones de seguridad
    y las bolsas de aire (air bags)?
  choices:
    A: Los cinturones de seguridad son opcionales si el vehículo tiene bolsas de aire
      delanteras
    B: Solo el conductor debe usar el cinturón de seguridad si el vehículo tiene bolsas
      de aire
    C: Todos los ocupantes deben usar cinturones de seguridad incluso si el vehículo
      está equipado con bolsas de aire
    D: Los pasajeros en el asiento trasero no necesitan cinturones de seguridad si
      hay bolsas de aire delanteras
  answer: C
  explanation: Según la ley de cinturones de seguridad, todos los ocupantes DEBEN
    usar cinturones de seguridad incluso si el vehículo está equipado con bolsas de
    aire.
- id: 143
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una exención a la ley de cinturones de seguridad
    de Carolina del Norte?
  choices:
    A: Un conductor que realiza paradas de entrega frecuentes cuya velocidad entre
      paradas no exceda las 20 mph
    B: Un pasajero que viaja en el asiento trasero de un automóvil de pasajeros
    C: Un conductor que opera un vehículo fabricado después de 2010
    D: Un conductor que viaja a menos de 5 millas de su hogar
  answer: A
  explanation: Una exención a la ley del cinturón de seguridad incluye a un conductor
    o pasajero que se detiene y sale del vehículo con frecuencia o que entrega bienes
    si la velocidad del vehículo entre paradas no excede las 20 millas por hora.
- id: 144
  category: driver_responsibility
  question: ¿Cuál es la amenaza número uno para la vida de los niños pequeños?
  choices:
    A: Venenos domésticos
    B: Accidentes automovilísticos
    C: Ahogamiento
    D: Peligros de incendio
  answer: B
  explanation: El manual establece que la amenaza número uno para la vida de los niños
    pequeños es el accidente automovilístico.
- id: 145
  category: safe_driving_rules
  question: ¿Un niño debe estar debidamente asegurado en un sistema de retención infantil
    apropiado para su peso si es menor de qué edad y peso?
  choices:
    A: Menor de 6 años y con un peso inferior a 60 libras
    B: Menor de 7 años y con un peso inferior a 70 libras
    C: Menor de 8 años y con un peso inferior a 80 libras
    D: Menor de 9 años y con un peso inferior a 90 libras
  answer: C
  explanation: Un niño menor de 8 años y que pese menos de 80 libras debe estar debidamente
    asegurado en un sistema de retención infantil apropiado para su peso.
- id: 146
  category: safe_driving_rules
  question: ¿Dónde debe asegurarse a un niño menor de 5 años y que pese menos de 40
    libras si el vehículo tiene una bolsa de aire (air bag) delantera activa en el
    lado del pasajero y un asiento trasero?
  choices:
    A: En el asiento del pasajero delantero con el asiento echado totalmente hacia
      atrás
    B: En el asiento trasero
    C: En el asiento del pasajero delantero usando solo un cinturón de regazo
    D: En el área de carga de un SUV
  answer: B
  explanation: Si el vehículo está equipado con una bolsa de aire delantera activa
    en el lado del pasajero y tiene un asiento trasero, un niño menor de 5 años y
    que pese menos de 40 libras debe estar debidamente asegurado en el asiento trasero
    (a menos que el sistema de retención esté diseñado para usarse con una bolsa de
    aire delantera).
- id: 147
  category: driver_responsibility
  question: ¿Durante una vida promedio de conducción, cuál es la probabilidad aproximada
    de sufrir lesiones graves o morir en un choque de vehículo motorizado?
  choices:
    A: Una en dos
    B: Una en tres
    C: Una en cinco
    D: Una en diez
  answer: B
  explanation: Durante una vida promedio de conducción, enfrentamos aproximadamente
    una probabilidad de una en tres de sufrir lesiones graves o morir en un choque
    de vehículo motorizado.
- id: 148
  category: safe_driving_rules
  question: ¿A qué velocidad puede salir una bolsa de aire (air bag) del tablero durante
    un choque?
  choices:
    A: Hasta 50 millas por hora
    B: Hasta 100 millas por hora
    C: Hasta 150 millas por hora
    D: Hasta 200 millas por hora
  answer: D
  explanation: Para cumplir con su importante función, una bolsa de aire sale del
    tablero a una velocidad de hasta 200 millas por hora, más rápido que un parpadeo.
- id: 149
  category: safe_driving_rules
  question: Según el manual, ¿los niños de qué edad deben viajar con el cinturón abrochado
    en un asiento trasero?
  choices:
    A: 8 años o menos
    B: 10 años o menos
    C: 12 años o menos
    D: 15 años o menos
  answer: C
  explanation: Los Puntos de Seguridad Infantil establecen que los niños de 12 años
    o menos deben viajar con el cinturón abrochado en un asiento trasero.
- id: 150
  category: vehicle_information
  question: ¿Cuál de las siguientes es una característica de un casco legal para motocicleta?
  choices:
    A: Un acolchado de espuma suave y delgada
    B: Una calcomanía del DOT comprada por separado y colocada por el motociclista
    C: Un forro interior grueso de espuma de poliestireno de aproximadamente una pulgada
      de grosor
    D: Sin etiqueta del fabricante para reducir el peso
  answer: C
  explanation: Un casco legal incluye un forro interior grueso que incluye un forro
    interior firme de espuma de poliestireno de aproximadamente una pulgada de grosor.
- id: 151
  category: safe_driving_rules
  question: Según la ley de Carolina del Norte, ¿a los niños menores de qué edad se
    les prohíbe generalmente viajar en la caja abierta de una camioneta (pick-up)?
  choices:
    A: 12 años
    B: 14 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: La ley de Carolina del Norte prohíbe que los niños menores de 16 años
    viajen en la caja abierta de una camioneta (pick-up).
- id: 152
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar la ley relativa al transporte de niños
    en la parte trasera de una camioneta (pick-up)?
  choices:
    A: Una multa de $25 y puntos en la licencia de conducir
    B: Una multa de $25, sin costos judiciales ni puntos en la licencia de conducir
    C: Una multa de $100 y un recargo en el seguro
    D: Una multa de $50 y costos judiciales
  answer: B
  explanation: A los infractores se les emiten multas y están sujetos a una sanción
    de $25. Las violaciones de esta ley se definen como 'infracciones' y no incurren
    en costos judiciales, puntos en la licencia de conducir ni recargos en el seguro.
- id: 153
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una exención a la ley que prohíbe a los niños
    viajar en la caja abierta de una camioneta (pick-up)?
  choices:
    A: Si el vehículo viaja a menos de 25 mph
    B: Si el vehículo está participando en un desfile
    C: Si el niño está sentado en la puerta trasera (tailgate)
    D: Si el viaje es de menos de 5 millas
  answer: B
  explanation: Las disposiciones para la sujeción adecuada de los niños no se aplican
    si el vehículo está participando en un desfile.
- id: 154
  category: safe_driving_rules
  question: ¿Cuánto más puede subir la temperatura dentro de un vehículo estacionado
    en comparación con la temperatura exterior?
  choices:
    A: 10-20 grados
    B: 20-30 grados
    C: 40-50 grados
    D: 60-70 grados
  answer: C
  explanation: La temperatura dentro de un vehículo puede subir aproximadamente entre
    40 y 50 grados más que la temperatura exterior.
- id: 155
  category: vehicle_information
  question: ¿Qué gas invisible, inodoro y venenoso puede acumularse dentro de un automóvil
    si la nieve bloquea el tubo de escape?
  choices:
    A: Dióxido de carbono
    B: Óxido de nitrógeno
    C: Sulfuro de hidrógeno
    D: Monóxido de carbono
  answer: D
  explanation: Durante los meses de invierno, la nieve puede bloquear el tubo de escape
    de un automóvil, y calentar el vehículo puede hacer que el monóxido de carbono
    se acumule en su interior. El monóxido de carbono es un gas invisible que no tiene
    olor, sabor ni color, pero es venenoso.
- id: 156
  category: sharing_the_road
  question: Cuando un semáforo cambia a amarillo o rojo mientras un peatón permanece
    en la calle, ¿qué deben hacer los conductores?
  choices:
    A: Tocar la bocina y avanzar
    B: Esquivar al peatón
    C: Permitir que el peatón complete el cruce de manera segura
    D: Retroceder para darle más espacio al peatón
  answer: C
  explanation: Si un semáforo cambia a amarillo o rojo mientras algún peatón permanece
    en la calle, los conductores deben permitir que el peatón complete el cruce de
    manera segura.
- id: 157
  category: sharing_the_road
  question: ¿Cómo otorga la ley una consideración especial a un peatón ciego en una
    intersección sin semáforos?
  choices:
    A: Tienen el derecho de paso solo si están acompañados por otra persona
    B: Tienen el derecho de paso cuando extienden un bastón blanco o llevan un perro
      guía
    C: Deben esperar a que un vehículo se detenga y toque la bocina antes de cruzar
    D: Se les requiere usar ropa reflectante para tener el derecho de paso
  answer: B
  explanation: La ley otorga una consideración especial a un peatón ciego en una intersección
    donde no hay semáforos cuando el peatón extiende un bastón blanco, o un bastón
    blanco con punta roja, o lleva un perro guía.
- id: 158
  category: defensive_driving
  question: ¿Qué exige la ley que hagan los conductores siempre que un peatón pueda
    verse afectado por un giro, una parada o un arranque desde una posición de estacionamiento?
  choices:
    A: Parpadear sus faros
    B: Usar la bocina
    C: Bajar la ventanilla y gritar
    D: Encender sus luces de emergencia
  answer: B
  explanation: La ley exige que los conductores usen la bocina siempre que un peatón
    pueda verse afectado por un giro, una parada o un arranque desde una posición
    de estacionamiento.
- id: 159
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo para un autobús escolar en Carolina
    del Norte?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: El límite de velocidad máximo para un autobús escolar es de 45 mph.
- id: 160
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene para recoger o dejar pasajeros en
    una carretera de dos carriles, ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se aproxima al autobús desde la dirección opuesta
    C: Todo el tráfico de ambas direcciones
    D: Los vehículos que viajan a más de 35 mph
  answer: C
  explanation: 'Carretera de dos carriles: Cuando un autobús escolar se detiene para
    recoger o dejar pasajeros, todo el tráfico de ambas direcciones debe detenerse.'
- id: 161
  category: safe_driving_rules
  question: ¿Cómo debe usarse la parte abdominal del cinturón de seguridad para adultos?
  choices:
    A: Ajustada sobre el estómago
    B: Debajo del abdomen y a una altura baja sobre las caderas
    C: Floja sobre los muslos
    D: Sobre la caja torácica
  answer: B
  explanation: El cinturón abdominal debe usarse debajo del abdomen y a una altura
    baja sobre las caderas.
- id: 162
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene para recoger o dejar pasajeros en
    una carretera de cuatro carriles sin una separación de mediana, ¿qué debe hacer
    el tráfico?
  choices:
    A: Solo el tráfico que sigue al autobús debe detenerse.
    B: Todo el tráfico de ambas direcciones debe detenerse.
    C: El tráfico en la dirección opuesta debe reducir la velocidad a 15 mph.
    D: El tráfico en el carril adyacente debe ceder el paso.
  answer: B
  explanation: Según el manual, en una carretera de cuatro carriles sin una separación
    de mediana, cuando un autobús escolar se detiene para recoger o dejar pasajeros,
    todo el tráfico de ambas direcciones debe detenerse.
- id: 163
  category: sharing_the_road
  question: En una carretera de cuatro carriles o más con un carril central para girar,
    ¿qué vehículos deben detenerse cuando un autobús escolar se detiene para recoger
    o dejar pasajeros?
  choices:
    A: Todo el tráfico de ambas direcciones.
    B: Solo el tráfico que viaja en la dirección opuesta.
    C: Solo el tráfico que sigue al autobús.
    D: No se requiere que ningún vehículo se detenga si el autobús está en el carril
      derecho.
  answer: C
  explanation: El manual establece que en una carretera de cuatro carriles o más con
    un carril central para girar, solo el tráfico que sigue al autobús debe detenerse
    cuando un autobús escolar se detiene para recoger o dejar pasajeros.
- id: 164
  category: safe_driving_rules
  question: ¿A qué distancia debe estacionarse de un vehículo de emergencia que se
    ha detenido para investigar un accidente o brindar asistencia?
  choices:
    A: Al menos 50 pies.
    B: Al menos 100 pies.
    C: Al menos 200 pies.
    D: Al menos 500 pies.
  answer: B
  explanation: 'El manual establece explícitamente: ''No se estacione a menos de 100
    pies de un vehículo de emergencia que se haya detenido para investigar un accidente
    o para brindar asistencia''.'
- id: 165
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener al conducir o estacionarse
    cerca de camiones de bomberos que responden a una alarma de incendio?
  choices:
    A: 100 pies.
    B: 500 pies.
    C: Una cuadra.
    D: Dos cuadras.
  answer: C
  explanation: Los conductores 'no deben conducir ni estacionarse a menos de una cuadra
    de los camiones de bomberos que responden a una alarma de incendio', según el
    manual del conductor.
- id: 166
  category: sharing_the_road
  question: ¿Cuándo NO se requiere que usted ceda el derecho de paso a un vehículo
    de emergencia que se aproxima?
  choices:
    A: Cuando viaja en la dirección opuesta en una carretera de dos carriles.
    B: Cuando viaja en la dirección opuesta en una carretera de acceso limitado de
      cuatro carriles con una mediana central.
    C: Cuando viaja en la misma dirección en una carretera dividida.
    D: Cuando conduce un vehículo comercial.
  answer: B
  explanation: El requisito de ceder el paso a un vehículo de emergencia que se aproxima
    no se aplica a los vehículos que viajan en la dirección opuesta en una carretera
    de acceso limitado de cuatro carriles con una mediana central.
- id: 167
  category: safe_driving_rules
  question: ¿Qué debe hacer al acercarse a un vehículo de emergencia estacionado con
    las luces de advertencia activadas en una carretera con al menos dos carriles
    de tráfico en su dirección?
  choices:
    A: Detenerse por completo hasta que el vehículo de emergencia apague sus luces.
    B: Cambiarse a un carril que no sea el más cercano al vehículo y continuar hasta
      estar a una distancia segura.
    C: Tocar la bocina para alertar a los trabajadores de emergencia y mantener su
      velocidad.
    D: Detenerse en el arcén derecho y esperar instrucciones.
  answer: B
  explanation: En una carretera con al menos dos carriles en la misma dirección, debe
    mover su vehículo a un carril que no sea el carril más cercano al vehículo de
    emergencia estacionado y continuar hasta estar a una distancia segura.
- id: 168
  category: safe_driving_rules
  question: Si un oficial de la ley le indica que se detenga pero no hay un lugar
    seguro obvio para detenerse de inmediato, ¿qué debe hacer?
  choices:
    A: Acelerar para llegar rápidamente a la salida más cercana.
    B: Detenerse inmediatamente en el carril de circulación.
    C: Encender las luces intermitentes de emergencia (4-way flashers), reducir la
      velocidad en unas 10 mph y continuar hasta un área segura.
    D: Apagar los faros y detenerse en el césped.
  answer: C
  explanation: Si no hay un lugar seguro obvio para detenerse, encienda sus luces
    intermitentes de emergencia y reduzca su velocidad en unas 10 mph para indicárselo
    al oficial, luego continúe hasta el área segura más cercana.
- id: 169
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si un automóvil sin distintivos lo detiene
    y usted tiene una preocupación legítima sobre si se trata de un oficial de la
    ley real?
  choices:
    A: Negarse a detenerse y conducir a casa.
    B: Llamar al 9-1-1 antes de detenerse para verificar al oficial.
    C: Detenerse pero negarse a bajar la ventanilla.
    D: Acelerar hasta la estación de policía más cercana.
  answer: B
  explanation: Si un automóvil sin distintivos lo detiene y tiene una preocupación
    legítima, puede llamar al 9-1-1 antes de detenerse para verificar que un oficial
    de la ley real esté realizando la parada.
- id: 170
  category: safe_driving_rules
  question: Si un oficial de la ley lo detiene por la noche, ¿qué debe hacer para
    ayudar con la visibilidad?
  choices:
    A: Encender las luces altas de los faros.
    B: Encender las luces interiores tan pronto como se detenga.
    C: Apuntar con una linterna por la ventana.
    D: Apagar todas las luces del vehículo.
  answer: B
  explanation: Si es de noche, debe encender las luces interiores tan pronto como
    se detenga para ayudar al oficial a ver el interior de su vehículo.
- id: 171
  category: driver_responsibility
  question: Si tiene un permiso de portación de armas ocultas y hay un arma en el
    vehículo durante una parada de tráfico, ¿qué debe hacer?
  choices:
    A: Esconder el arma debajo del asiento.
    B: Entregar el arma al oficial de inmediato.
    C: Informar al oficial de ese hecho.
    D: Colocar el arma en la guantera antes de que el oficial se acerque.
  answer: C
  explanation: Si usted o su(s) pasajero(s) tienen un permiso de portación de armas
    ocultas y hay un arma en el vehículo, debe informar al oficial de ese hecho.
- id: 172
  category: penalties_and_points
  question: ¿Qué indica su aceptación y firma en una multa de tráfico?
  choices:
    A: Es una admisión de culpabilidad.
    B: Renuncia a su derecho a una audiencia judicial.
    C: No es una admisión de culpabilidad.
    D: Significa que está de acuerdo con la decisión del oficial.
  answer: C
  explanation: El manual especifica que su aceptación y firma en una multa de tráfico
    no es una admisión de culpabilidad.
- id: 173
  category: penalties_and_points
  question: 'De acuerdo con la ley de Carolina del Norte, resistirse, retrasar u obstruir
    a un oficial de la ley durante una parada de tráfico se clasifica como un:'
  choices:
    A: Delito grave (felony) de Clase 1.
    B: Delito menor (misdemeanor) de Clase 2.
    C: Infracción de tráfico.
    D: Ofensa de advertencia.
  answer: B
  explanation: Resistirse, retrasar u obstruir a un oficial de la ley durante una
    parada de tráfico es un delito menor de clase 2 (N.C.G.S. §14-223).
- id: 174
  category: sharing_the_road
  question: ¿Bajo qué condiciones ocurren la mayoría de los choques que involucran
    equipo agrícola?
  choices:
    A: Durante lluvia intensa o nieve en caminos no pavimentados.
    B: Por la noche en caminos rurales mal iluminados.
    C: En un día despejado, durante las horas del día, sobre una superficie pavimentada
      seca.
    D: Durante mañanas con niebla en caminos de grava.
  answer: C
  explanation: La mayoría de los choques que involucran equipo agrícola ocurren en
    un día despejado, durante las horas del día y/o sobre una superficie pavimentada
    que está seca.
- id: 175
  category: sharing_the_road
  question: ¿Cuáles son los tipos típicos de choques que ocurren con el equipo agrícola?
  choices:
    A: Colisiones frontales y choques por alcance.
    B: Raspaduras laterales (sideswipes) y choques en ángulo.
    C: Vuelcos y choques de un solo vehículo.
    D: Choques al dar marcha atrás y colisiones en estacionamientos.
  answer: B
  explanation: Los choques típicos con equipo agrícola incluyen raspaduras laterales
    y choques en ángulo, que a menudo ocurren mientras el equipo está girando a la
    izquierda.
- id: 176
  category: safe_driving_rules
  question: Durante una parada de tráfico, ¿dónde deben colocar sus manos los pasajeros
    del asiento trasero?
  choices:
    A: En sus bolsillos.
    B: En el techo del vehículo.
    C: En el respaldo del asiento delantero.
    D: Fuera de la ventana.
  answer: C
  explanation: Durante una parada de tráfico, los pasajeros en el asiento trasero
    deben colocar sus manos en el respaldo del asiento delantero para que sean claramente
    visibles para el oficial.
- id: 177
  category: sharing_the_road
  question: ¿En qué tipo de carretera está legalmente prohibido que circule el equipo
    agrícola en Carolina del Norte?
  choices:
    A: Caminos suburbanos
    B: Interestatales
    C: Carreteras rurales de dos carriles
    D: Caminos públicos no pavimentados
  answer: B
  explanation: El manual establece que el equipo agrícola tiene derecho legal a circular
    por la mayoría de las carreteras de Carolina del Norte, excepto las interestatales.
- id: 178
  category: vehicle_information
  question: ¿Qué iluminación se requiere para el equipo agrícola que opera en la carretera?
  choices:
    A: Dos luces blancas delanteras y dos luces rojas traseras visibles a 1000 pies
    B: Una luz blanca delantera y una luz roja trasera visible hasta 500 pies
    C: Una baliza amarilla intermitente en el techo
    D: Solo se requieren reflectores rojos traseros en todo momento
  answer: B
  explanation: El equipo agrícola debe tener una luz blanca delantera, así como una
    luz roja trasera que sea visible hasta 500 pies (o dos reflectores rojos que tengan
    al menos cuatro pulgadas de diámetro).
- id: 179
  category: sharing_the_road
  question: ¿Qué debe tener encendido cada vehículo en un cortejo fúnebre?
  choices:
    A: Solo las luces altas de los faros
    B: Los faros delanteros y las señales de advertencia de peligro (intermitentes)
    C: Las luces interiores del techo
    D: Las señales de giro a la izquierda
  answer: B
  explanation: Cada vehículo en un cortejo fúnebre debe tener sus faros encendidos,
    y las señales de advertencia de peligro también deben estar encendidas, si el
    vehículo está equipado con ellas.
- id: 180
  category: sharing_the_road
  question: ¿Cuándo es legal que un conductor que viaja en la misma dirección pase
    a un cortejo fúnebre?
  choices:
    A: Cuando el cortejo se mueve a menos de 20 mph
    B: Cuando la carretera está marcada con dos o más carriles de tráfico en movimiento
      en la misma dirección
    C: Cuando el conductor toca la bocina antes de pasar
    D: Nunca es legal pasar a un cortejo fúnebre
  answer: B
  explanation: El conductor de un vehículo que viaja en la misma dirección no debe
    pasar a un cortejo fúnebre, excepto cuando la carretera haya sido marcada con
    dos o más carriles de tráfico en movimiento en la misma dirección.
- id: 181
  category: safe_driving_rules
  question: Si conduce más lento que el límite de velocidad indicado en una carretera
    de varios carriles, ¿por dónde debe circular?
  choices:
    A: En el carril del extremo izquierdo
    B: En el carril central
    C: En el carril del extremo derecho
    D: Entre el carril derecho y el central
  answer: C
  explanation: Cuando circule más lento que el límite de velocidad indicado en una
    carretera de varios carriles, conduzca por el carril del extremo derecho, a menos
    que esté rebasando, girando a la izquierda o evitando una obstrucción.
- id: 182
  category: safe_driving_rules
  question: En condiciones ideales, ¿aproximadamente cuántos pies se necesitan para
    detener por completo un vehículo que viaja a 55 millas por hora?
  choices:
    A: 100 pies
    B: 150 pies
    C: 211 pies
    D: 300 pies
  answer: C
  explanation: Incluso en condiciones ideales, si viaja a 55 millas por hora, su vehículo
    requiere aproximadamente 211 pies para detenerse por completo.
- id: 183
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en ciudades y pueblos a menos que
    se indique lo contrario?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: A menos que se indique lo contrario, el límite de velocidad es de 35
    mph en ciudades y pueblos.
- id: 184
  category: defensive_driving
  question: ¿Cuál es la mejor práctica para frenar al acercarse a una curva?
  choices:
    A: Frenar firmemente mientras está en medio de la curva
    B: Reducir la velocidad antes de entrar en la curva para evitar frenar dentro
      de ella
    C: Acelerar al entrar en la curva y frenar al salir
    D: Bombear los frenos continuamente durante toda la curva
  answer: B
  explanation: La mejor manera de manejar una curva es reducir la velocidad antes
    de entrar en ella para no tener que frenar mientras está en la curva.
- id: 185
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra con una curva mientras viaja cuesta abajo?
  choices:
    A: Cambiar a una marcha más alta antes de bajar
    B: Poner punto muerto para avanzar por inercia en la curva
    C: Cambiar a una marcha más baja antes de bajar
    D: Apagar el motor para ahorrar combustible
  answer: C
  explanation: Si se encuentra con una curva mientras viaja cuesta abajo, debe cambiar
    a una marcha más baja antes de bajar y comenzar a frenar antes.
- id: 186
  category: safe_driving_rules
  question: ¿Para qué se utiliza la "regla de los dos segundos"?
  choices:
    A: El tiempo que debe esperar en una señal de alto
    B: Una distancia de seguimiento segura entre su vehículo y el que va delante
    C: La duración que debe estar encendida la luz de giro antes de cambiar de carril
    D: El tiempo máximo que puede apartar la vista de la carretera
  answer: B
  explanation: La "regla de los dos segundos" establece que debe dejar pasar dos segundos
    entre el momento en que el vehículo delante de usted pasa por un punto determinado
    y el momento en que su vehículo llega al mismo punto, garantizando una distancia
    de seguimiento segura.
- id: 187
  category: defensive_driving
  question: ¿Por qué es importante mirar por encima del hombro antes de cambiar de
    carril?
  choices:
    A: Para ver si la policía lo está siguiendo
    B: Para asegurarse de que su espejo retrovisor esté ajustado correctamente
    C: Para estar seguro de que el punto ciego está despejado
    D: Para comprobar la velocidad del vehículo que viene detrás
  answer: C
  explanation: Las reglas importantes sobre el cambio de carril incluyen mirar por
    encima del hombro para asegurarse de que el punto ciego esté despejado.
- id: 188
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el propósito de tocar la bocina antes de rebasar
    a otro vehículo?
  choices:
    A: Para advertir al tráfico que viene en sentido contrario que se mueva
    B: Para poner al conductor de adelante bajo la obligación legal de ayudarle a
      pasar
    C: Para indicar a los peatones que despejen la calzada
    D: Para indicar que viaja por encima del límite de velocidad
  answer: B
  explanation: El manual establece que se debe tocar la bocina para avisar al conductor
    de adelante, ya que la señal de la bocina pone al conductor del vehículo que está
    rebasando bajo la obligación legal de ayudarle a pasar.
- id: 189
  category: safe_driving_rules
  question: Al girar a la derecha, ¿por qué debe mantenerse cerca del borde derecho
    de la carretera?
  choices:
    A: Para permitir que los vehículos más rápidos pasen por su izquierda
    B: Para evitar que otro vehículo se mueva entre su vehículo y la acera
    C: Para tener una mejor vista del tráfico que viene en sentido contrario
    D: Para evitar activar los sensores de los semáforos
  answer: B
  explanation: Para los giros a la derecha, manténgase cerca del borde derecho de
    la carretera, de modo que otro vehículo no pueda situarse entre su vehículo y
    la acera.
- id: 190
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener a la izquierda del vehículo
    que está rebasando?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 4 pies
  answer: B
  explanation: La ley exige que el conductor que rebasa pase al menos a dos pies a
    la izquierda del vehículo que está siendo rebasado.
- id: 191
  category: safe_driving_rules
  question: ¿Cuándo es ilegal rebasar a otro vehículo en una curva o colina?
  choices:
    A: Cuando no puede ver al menos 500 pies adelante
    B: Cuando no puede ver al menos 200 pies adelante
    C: Cuando no puede ver al menos 100 pies adelante
    D: Cuando no puede ver al menos 300 pies adelante
  answer: A
  explanation: Rebasar siempre es inseguro y generalmente ilegal en cualquier curva
    o colina donde el conductor no pueda ver al menos 500 pies adelante.
- id: 192
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones se permite rebasar por la derecha?
  choices:
    A: En una carretera de dos carriles con una línea amarilla continua
    B: Al rebasar a un vehículo que se encuentra en el carril de giro a la izquierda
    C: En cualquier intersección en una zona rural
    D: Cuando el vehículo de adelante circula demasiado lento
  answer: B
  explanation: Las excepciones en las que se permite rebasar por la derecha incluyen
    cuando se rebasa a un vehículo que se encuentra en el carril de giro a la izquierda.
- id: 193
  category: penalties_and_points
  question: ¿Cuál es la sanción por aumentar su velocidad y no ceder el paso a un
    vehículo que lo está rebasando si esto resulta en un choque que cause lesiones
    corporales o daños a la propiedad?
  choices:
    A: Una advertencia por escrito
    B: Un cargo por delito grave (felony)
    C: Un cargo por delito menor (misdemeanor)
    D: Revocación inmediata de la licencia
  answer: C
  explanation: Si aumenta la velocidad y no cede el paso a un vehículo que lo está
    rebasando, se le acusará de un delito menor (misdemeanor) si ocurre un choque
    que resulte en lesiones corporales o daños a la propiedad.
- id: 194
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima a la que debe circular al retroceder su vehículo?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: Al retroceder su vehículo, debe hacerlo muy lentamente, a no más de
    10 mph, porque su vehículo es más difícil de controlar y de detener.
- id: 195
  category: safe_driving_rules
  question: ¿Cuál es la técnica adecuada para mantener una visión completa de lo que
    hay detrás de su vehículo al retroceder?
  choices:
    A: Depender totalmente de sus espejos retrovisores y laterales
    B: Girar el volante con la mano derecha y mirar por la ventana del lado del conductor
    C: Girar el volante con la mano izquierda y mirar por encima de su hombro derecho
      a través de la ventana trasera
    D: Pedir a un pasajero que lo guíe mientras usted mira hacia adelante
  answer: C
  explanation: Para mantener una visión completa de lo que hay detrás del vehículo,
    gire el volante con la mano izquierda y mire por encima de su hombro derecho a
    través de la ventana trasera; no dependa únicamente de los espejos.
- id: 196
  category: safe_driving_rules
  question: ¿A qué distancia de un hidrante de incendios debe estacionarse?
  choices:
    A: Al menos 10 pies
    B: Al menos 15 pies
    C: Al menos 20 pies
    D: Al menos 25 pies
  answer: B
  explanation: No debe estacionarse a menos de 15 pies de un hidrante de incendios
    o de la entrada de una estación de bomberos.
- id: 197
  category: safe_driving_rules
  question: 'Al estacionarse en el acotamiento de una carretera, su vehículo estacionado
    debe ser visible para los conductores que se aproximan desde ambas direcciones
    a una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Estacionarse en el acotamiento es ilegal a menos que el vehículo estacionado
    pueda ser visto por los conductores que se aproximan desde ambas direcciones a
    una distancia de al menos 200 pies.
- id: 198
  category: defensive_driving
  question: ¿Dónde ocurren más de un tercio de los choques de tráfico fatales que
    involucran vehículos motorizados?
  choices:
    A: En carreteras interestatales
    B: En cruces de ferrocarril
    C: En intersecciones
    D: En estacionamientos
  answer: C
  explanation: Los choques ocurren con mayor frecuencia en las intersecciones, y más
    de un tercio de los choques de tráfico fatales que involucran vehículos motorizados
    ocurren en las intersecciones.
- id: 199
  category: safe_driving_rules
  question: Si dos vehículos llegan al mismo tiempo a una intersección sin señales
    de tráfico ni semáforos, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo a la izquierda
    B: El vehículo a la derecha
    C: El vehículo que viaja más rápido
    D: El vehículo que gira a la izquierda
  answer: B
  explanation: En intersecciones sin señales de tráfico ni semáforos, cuando dos o
    más vehículos llegan a una intersección al mismo tiempo, el vehículo de la derecha
    tiene el derecho de paso.
- id: 200
  category: safe_driving_rules
  question: Cuando dos vehículos enfrentados se aproximan a una intersección al mismo
    tiempo, y un conductor quiere seguir recto mientras el otro quiere girar a la
    izquierda, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor que gira a la izquierda
    B: El conductor que sigue recto
    C: El conductor que señaliza primero
    D: Ninguno de los dos conductores
  answer: B
  explanation: Si un conductor va recto mientras el otro quiere girar a la izquierda,
    el conductor que quiere girar debe esperar. Por lo tanto, el conductor que viaja
    recto tiene el derecho de paso.
- id: 201
  category: safe_driving_rules
  question: ¿Qué es lo que NUNCA debe hacer mientras avanza en línea recta a través
    de una intersección?
  choices:
    A: Cambiar de carril
    B: Mantener una velocidad constante
    C: Buscar peatones
    D: Mantener las manos en el volante
  answer: A
  explanation: 'El manual establece explícitamente: ''Nunca cambie de carril mientras
    avanza en línea recta a través de una intersección''.'
- id: 202
  category: safe_driving_rules
  question: ¿En qué dirección circulan todos los vehículos en una glorieta o rotonda?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En línea recta
    D: En un patrón de figura en ocho
  answer: B
  explanation: Todos los vehículos en una glorieta circulan hacia la derecha alrededor
    del círculo en sentido contrario a las agujas del reloj.
- id: 203
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso en una rotonda o glorieta?
  choices:
    A: Los vehículos que entran a la rotonda
    B: Los vehículos que ya están en la rotonda
    C: Los vehículos que salen de la rotonda
    D: Los vehículos que circulan a mayor velocidad
  answer: B
  explanation: Los vehículos que ya están en el círculo tienen el derecho de paso,
    y los conductores que entran deben ceder el paso a cualquier vehículo o ciclista
    que ya se encuentre en la rotonda.
- id: 204
  category: safe_driving_rules
  question: ¿Cuál es la velocidad de circulación típica requerida en una rotonda moderna?
  choices:
    A: 5-10 mph
    B: 15-20 mph
    C: 25-30 mph
    D: 35-40 mph
  answer: B
  explanation: La rotonda moderna es mucho más pequeña que las glorietas antiguas
    y requiere que los vehículos circulen a velocidades más bajas (15–20 mph), lo
    que las hace más seguras.
- id: 205
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en una rotonda?
  choices:
    A: Los vehículos que se aproximan para entrar a la rotonda
    B: Los vehículos y ciclistas que ya están en la rotonda
    C: Los peatones que caminan por el centro de la rotonda
    D: Los vehículos que entran por el lado derecho
  answer: B
  explanation: El manual establece que los conductores deben ceder el paso a cualquier
    vehículo o ciclista que ya esté en la rotonda, y quienes ya están en ella no ceden
    el paso a los vehículos que se aproximan.
- id: 206
  category: safe_driving_rules
  question: ¿Qué carril debe utilizar para girar a la izquierda o dar una vuelta en
    U en una rotonda de varios carriles?
  choices:
    A: El carril derecho
    B: El carril central
    C: El carril izquierdo
    D: El área de rebasamiento para camiones (truck apron)
  answer: C
  explanation: En una rotonda de varios carriles, debe permanecer en el carril izquierdo
    para seguir recto a través de la rotonda o para girar a la izquierda o dar una
    vuelta en U.
- id: 207
  category: defensive_driving
  question: ¿Qué debe hacer si ya se encuentra dentro de una rotonda y se aproxima
    un vehículo de emergencia con luces intermitentes y sirenas?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda para dejarlos pasar
    B: Orillarse hacia la isla interior de la rotonda
    C: Acelerar y completar su giro antes de salir
    D: Salir primero de la rotonda y luego orillarse
  answer: D
  explanation: Si los conductores ya están en la rotonda cuando se aproxima un vehículo
    de emergencia, deben salir primero y luego orillarse para dejar pasar al vehículo
    de emergencia.
- id: 208
  category: safe_driving_rules
  question: Cuando se requiere detenerse en un cruce de ferrocarril, ¿cuál es la distancia
    de parada requerida desde el riel más cercano?
  choices:
    A: A menos de 25 pies, pero no a menos de 10 pies
    B: A menos de 50 pies, pero no a menos de 15 pies
    C: A menos de 100 pies, pero no a menos de 25 pies
    D: Exactamente 15 pies
  answer: B
  explanation: El conductor del vehículo debe detenerse a menos de 50 pies, pero no
    a menos de 15 pies del riel más cercano del ferrocarril y no debe avanzar hasta
    que pueda hacerlo de manera segura.
- id: 209
  category: sharing_the_road
  question: ¿A cuál de los siguientes vehículos debe cederle el paso un tren?
  choices:
    A: Vehículos de policía con las sirenas encendidas
    B: Ambulancias que responden a una emergencia
    C: Camiones de bomberos con luces intermitentes
    D: Ninguno de los anteriores; los trenes siempre tienen el derecho de paso
  answer: D
  explanation: Los trenes tienen el derecho de paso sobre todo el tráfico de la carretera,
    incluidos los vehículos de emergencia de la policía, bomberos y ambulancias.
- id: 210
  category: defensive_driving
  question: ¿Aproximadamente qué distancia necesita un tren que viaja a 55 mph para
    detenerse por completo?
  choices:
    A: Menos de media milla
    B: Unos 1500 pies
    C: Más de una milla
    D: Exactamente 500 pies
  answer: C
  explanation: Un tren que viaja a 55 mph tarda más de una milla en detenerse.
- id: 211
  category: safe_driving_rules
  question: ¿Qué debe hacer si está cruzando las vías del tren y las luces de advertencia
    comienzan a parpadear o las barreras comienzan a bajar?
  choices:
    A: Detenerse inmediatamente y retroceder
    B: Seguir avanzando para terminar de cruzar
    C: Detenerse y abandonar su vehículo
    D: Poner su vehículo en reversa y retroceder con cuidado
  answer: B
  explanation: Si se encuentra cruzando las vías y las luces de advertencia comienzan
    a parpadear o las barreras comienzan a bajar, no se detenga, no retroceda, SIGA
    AVANZANDO. Las señales de advertencia dan tiempo suficiente para terminar de cruzar.
- id: 212
  category: defensive_driving
  question: ¿Qué debe hacer si la barrera del cruce ferroviario del lado opuesto de
    las vías baja antes de que usted termine de cruzar?
  choices:
    A: Detenerse en las vías y esperar al tren
    B: Poner su vehículo en reversa para evitar la barrera
    C: Atravesar la barrera porque es flexible
    D: Salir de su vehículo y levantar la barrera manualmente
  answer: C
  explanation: Las barreras de los cruces ferroviarios no pueden atraparlo a usted
    ni a su vehículo; atraviese la barrera. Es flexible y no lo dejará encerrado.
- id: 213
  category: signs_and_signals
  question: ¿Qué información se encuentra en la "señal azul" del Sistema de Notificación
    de Emergencia (ENS) en un cruce ferroviario?
  choices:
    A: El horario del tren y el límite de velocidad
    B: El número de identificación del cruce, el nombre de la compañía ferroviaria
      y el número de teléfono de emergencia
    C: La distancia hasta la próxima salida de la autopista
    D: El número de no emergencia del departamento de policía local
  answer: B
  explanation: La señal ENS, conocida como la "señal azul", contiene el número de
    identificación del cruce ferroviario, el nombre de la compañía ferroviaria y un
    número de teléfono de emergencia para reportar emergencias.
- id: 214
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si su vehículo se apaga o se queda varado
    sobre o cerca de las vías del tren?
  choices:
    A: Intentar arrancar el motor durante al menos un minuto
    B: Llamar a una grúa mientras permanece sentado en el vehículo
    C: Salir de inmediato y alejarse de las vías
    D: Tocar la bocina para advertir al tren que se acerca
  answer: C
  explanation: Si su vehículo se apaga o se queda varado sobre o cerca de las vías,
    SALGA DE INMEDIATO. Aléjese de su vehículo y de las vías.
- id: 215
  category: sharing_the_road
  question: ¿Cómo debe circular un ciclista en una rotonda de varios carriles?
  choices:
    A: Circular por el acotamiento de la rotonda
    B: Elegir el carril adecuado y permanecer en el centro de este
    C: Usar siempre la plataforma para camiones (truck apron)
    D: Bajarse y llevar la bicicleta caminando por la isla central
  answer: B
  explanation: Los ciclistas deben elegir el carril adecuado antes de entrar en una
    rotonda de varios carriles y permanecer en el centro del carril elegido. No deben
    circular por el acotamiento.
- id: 216
  category: safe_driving_rules
  question: ¿Por qué no debe avanzar inmediatamente después de que un tren haya pasado
    por un cruce?
  choices:
    A: Debe esperar a que un oficial de policía le indique que pase
    B: Las barreras del cruce necesitan tiempo para restablecer sus sensores
    C: Puede haber otro tren moviéndose en la dirección opuesta o siguiendo al primer
      tren
    D: Debe esperar exactamente tres minutos antes de cruzar
  answer: C
  explanation: No avance inmediatamente después de que el tren haya pasado; puede
    haber otro tren moviéndose en la dirección opuesta o siguiendo al primer tren.
- id: 217
  category: sharing_the_road
  question: ¿Cuál es el propósito de la isleta de concreto, o plataforma para camiones
    (truck apron), en una rotonda?
  choices:
    A: Es un área de estacionamiento designada para vehículos de emergencia
    B: Es una zona segura para que los peatones crucen
    C: Ayuda a los camiones grandes a maniobrar en la rotonda
    D: Es un carril específicamente para ciclistas
  answer: C
  explanation: Los camiones grandes deben usar la isleta de concreto, llamada plataforma
    para camiones (truck apron), para ayudar a los conductores a maniobrar en la rotonda.
- id: 218
  category: defensive_driving
  question: ¿Cuáles de los siguientes vehículos están obligados a detenerse en los
    cruces ferroviarios, lo que significa que usted debe estar preparado para detenerse
    detrás de ellos?
  choices:
    A: Motocicletas y bicicletas
    B: Autobuses escolares y vehículos que transportan materiales peligrosos
    C: Furgonetas de reparto y camionetas pickup
    D: Vehículos de emergencia con las sirenas apagadas
  answer: B
  explanation: Esté preparado para detenerse ante los vehículos que deben hacerlo
    en los cruces, como autobuses escolares, vehículos motorizados que transportan
    pasajeros, vehículos de alquiler o vehículos que transportan explosivos o materiales
    peligrosos.
- id: 219
  category: safe_driving_rules
  question: ¿Por dónde deben caminar los peatones al circular por una rotonda?
  choices:
    A: Por el centro de la rotonda
    B: Por la plataforma para camiones (truck apron)
    C: Por los pasos de peatones marcados en la parte exterior de la rotonda
    D: Por el carril izquierdo de la rotonda
  answer: C
  explanation: Los peatones deben usar los pasos de peatones marcados en la parte
    exterior de la rotonda y no caminar por el centro de la misma.
- id: 220
  category: sharing_the_road
  question: ¿Por qué debe prestar especial atención a los ciclistas al acercarse y
    circular por una intersección?
  choices:
    A: Están obligados a ceder el paso a todos los vehículos motorizados.
    B: Están obligados a usar la acera en las intersecciones.
    C: Puede ocurrir un choque entre un ciclista que sigue recto y un automovilista
      que gira a la derecha.
    D: Viajan más rápido que los vehículos motorizados en las intersecciones.
  answer: C
  explanation: Debido a que los ciclistas circulan a la derecha del tráfico de vehículos
    motorizados, existe la posibilidad de un choque entre el ciclista que sigue recto
    en la intersección y el automovilista que gira a la derecha.
- id: 221
  category: safe_driving_rules
  question: Si tiene la intención de girar en una ciudad y descubre que no está en
    el carril adecuado, ¿qué debe hacer?
  choices:
    A: Detenerse y esperar a que el tráfico se despeje antes de cambiar de carril.
    B: Continuar hasta la siguiente intersección y girar allí.
    C: Cambiar de carril rápidamente si usa su señal de giro.
    D: Retroceder hasta la intersección anterior.
  answer: B
  explanation: El manual establece que si tiene la intención de girar y descubre que
    no está en el carril adecuado, debe continuar hasta la siguiente intersección
    y girar allí.
- id: 222
  category: defensive_driving
  question: ¿Cómo puede saber si está conduciendo en el punto ciego de otro conductor?
  choices:
    A: Está conduciendo en el carril central.
    B: No puede ver el espejo retrovisor interior del automóvil que va delante.
    C: El vehículo de adelante es un camión comercial grande.
    D: Está siguiendo a menos de dos segundos de distancia.
  answer: B
  explanation: Evite conducir al lado de otros vehículos, especialmente en el punto
    ciego de otro conductor. Si no puede ver el espejo retrovisor interior del automóvil
    que va delante, probablemente se encuentre en el punto ciego del conductor.
- id: 223
  category: safe_driving_rules
  question: Al conducir en una calle de sentido único, ¿qué carriles debe utilizar
    para el tráfico directo (de paso)?
  choices:
    A: El carril de la extrema derecha.
    B: El carril de la extrema izquierda.
    C: El carril o carriles centrales.
    D: Los carriles exteriores.
  answer: C
  explanation: En una calle de sentido único, use el carril o carriles centrales para
    el tráfico directo y los carriles exteriores para girar.
- id: 224
  category: defensive_driving
  question: ¿Por qué a menudo se considera que conducir por carreteras rurales es
    más peligroso que conducir en el tráfico intenso de la ciudad?
  choices:
    A: Hay más señales de alto y semáforos.
    B: Es posible que las carreteras no sean tan anchas y la iluminación a menudo
      no sea tan buena.
    C: Hay un mayor volumen de tráfico de camiones comerciales.
    D: El límite de velocidad es generalmente más bajo.
  answer: B
  explanation: Conducir por carreteras rurales suele ser más peligroso porque la carretera
    puede no ser tan ancha, la iluminación a menudo no es tan buena y/o las velocidades
    de viaje pueden ser más altas.
- id: 225
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado para entrar en una autopista interestatal?
  choices:
    A: Detenerse al final de la rampa y esperar un hueco en el tráfico.
    B: Utilice el carril de aceleración hasta que su velocidad coincida con la del
      resto del tráfico y luego incorpórese de forma segura.
    C: Incorpórese directamente al carril izquierdo para evitar el tráfico lento.
    D: Ceda el paso al tráfico de la interestatal reduciendo la velocidad en el carril
      de aceleración.
  answer: B
  explanation: Al entrar en la interestatal, utilice el carril de aceleración hasta
    que la velocidad de su vehículo coincida con la del resto del tráfico y luego
    incorpórese de forma segura.
- id: 226
  category: defensive_driving
  question: Si una avería del vehículo le obliga a detenerse en la interestatal, ¿qué
    debe hacer para pedir ayuda?
  choices:
    A: Pararse en el carril de circulación y agitar los brazos.
    B: Ate un paño blanco en la antena del radio o en la manija de la puerta izquierda
      y levante el capó.
    C: Coloque una bandera roja en el parachoques trasero.
    D: Toque la bocina continuamente hasta que llegue ayuda.
  answer: B
  explanation: Si una avería del vehículo le obliga a detenerse, aléjese bastante
    de la carretera. Ate un paño blanco en la antena del radio o en la manija de la
    puerta izquierda y levante el capó.
- id: 227
  category: safe_driving_rules
  question: 'Al salir de una autopista interestatal, usted debe:'
  choices:
    A: Reducir la velocidad en el carril de circulación antes de entrar en el carril
      de desaceleración.
    B: Señalizar su giro con suficiente antelación y entrar en el carril de desaceleración
      sin reducir la velocidad primero.
    C: Frenar bruscamente tan pronto como entre en el carril de desaceleración.
    D: Esperar hasta estar en el carril de desaceleración para usar la señal de giro.
  answer: B
  explanation: Al salir de la autopista, señalice su giro con suficiente antelación
    y, sin reducir la velocidad, entre en el carril de desaceleración. Continúe a
    la velocidad de salida indicada.
- id: 228
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa la salida deseada en una autopista interestatal?
  choices:
    A: Continúe hasta la siguiente salida y salga de la autopista allí.
    B: Reduzca la velocidad y retroceda con cuidado por el arcén.
    C: Haga un giro en U a través de la mediana.
    D: Deténgase en el carril de circulación y espere a que el tráfico se despeje
      antes de retroceder.
  answer: A
  explanation: Si se pasa una salida, no reduzca la velocidad, no retroceda ni intente
    dar la vuelta. En su lugar, continúe hasta la siguiente salida y salga de la autopista
    allí.
- id: 229
  category: vehicle_information
  question: Cuando enciende las luces altas (luces de carretera) por la noche, ¿a
    qué distancia debería poder ver a una persona?
  choices:
    A: 75 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Cuando enciende las luces altas por la noche, debería poder ver a una
    persona que se encuentre a 200 pies de distancia.
- id: 230
  category: vehicle_information
  question: 'Según la ley de Carolina del Norte, las luces traseras deben ser de color
    rojo y visibles desde al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: D
  explanation: Las luces traseras deben ser de color rojo y visibles desde al menos
    500 pies.
- id: 231
  category: vehicle_information
  question: ¿Cómo debe ajustar los espejos laterales de su vehículo antes de empezar
    a conducir?
  choices:
    A: Para mostrar la escena directamente detrás del vehículo.
    B: Para mostrar la escena a la parte trasera izquierda y derecha, reflejando apenas
      el costado del vehículo.
    C: Para eliminar por completo todos los puntos ciegos.
    D: Para mostrar los neumáticos delanteros del vehículo.
  answer: B
  explanation: Ajuste los espejos laterales para mostrar la escena a la parte trasera
    izquierda y derecha del vehículo. Los espejos deben reflejar apenas el costado
    del vehículo.
- id: 232
  category: vehicle_information
  question: ¿Qué indica si el pedal del freno baja gradualmente bajo la presión de
    su pie?
  choices:
    A: El sistema de frenos antibloqueo se está activando.
    B: Las pastillas de freno son nuevas.
    C: El sistema hidráulico debe ser revisado.
    D: Los neumáticos están desinflados.
  answer: C
  explanation: Si el pedal baja gradualmente bajo la presión de su pie, el sistema
    hidráulico debe ser revisado.
- id: 233
  category: vehicle_information
  question: ¿Cuál es la forma correcta de usar un Sistema de Frenos Antibloqueo (ABS)
    al detenerse?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Frenar con fuerza y mantener una presión firme y constante en el pedal del
      freno.
    C: Tocar ligeramente el pedal del freno varias veces.
    D: Liberar la presión sobre el pedal del freno si siente que vibra.
  answer: B
  explanation: Con el ABS, es importante frenar con fuerza y mantener una presión
    firme y constante en el pedal del freno al detenerse. Bombear el pedal del freno
    o liberar la presión constante reducirá la efectividad del ABS.
- id: 234
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima permitida de la banda de rodadura para
    que los neumáticos se consideren seguros en Carolina del Norte?
  choices:
    A: 1/32 de pulgada
    B: 1/16 de pulgada
    C: 1/8 de pulgada
    D: 1/4 de pulgada
  answer: B
  explanation: Según el manual, los neumáticos se consideran inseguros si tienen menos
    de 1/16 de pulgada de profundidad en la banda de rodadura.
- id: 235
  category: vehicle_information
  question: ¿Cuál es una consecuencia negativa de conducir con neumáticos demasiado
    inflados?
  choices:
    A: Se desgastan más rápidamente en los bordes exteriores.
    B: Aumentan la probabilidad de un reventón.
    C: Reducen la tracción y se desgastan mucho en el centro de la banda de rodadura.
    D: Mejoran el ahorro de combustible en un 10%.
  answer: C
  explanation: El manual establece que los neumáticos demasiado inflados reducen la
    tracción y se desgastan mucho en el centro de la banda de rodadura.
- id: 236
  category: safe_driving_rules
  question: Para ayudar a prevenir la intoxicación por monóxido de carbono debido
    a una posible fuga en el escape, ¿qué sugiere el manual?
  choices:
    A: Mantener el aire acondicionado al máximo en todo momento.
    B: Mantener una ventana abierta aproximadamente una pulgada mientras viaja.
    C: Reemplazar el silenciador cada 10,000 millas.
    D: Conducir con las luces de emergencia encendidas.
  answer: B
  explanation: Debido a que una fuga en el sistema de escape puede permitir que el
    gas venenoso de monóxido de carbono entre al vehículo, se sugiere mantener una
    ventana abierta aproximadamente una pulgada mientras viaja.
- id: 237
  category: vehicle_information
  question: ¿Cuál de los siguientes es una señal de que su vehículo puede tener un
    problema con su sistema de suspensión?
  choices:
    A: El vehículo se balancea libremente, se inclina mucho hacia un lado durante
      un giro o rebota continuamente.
    B: El motor se apaga cuando está en ralentí durante más de un par de minutos.
    C: El volante vibra cuando se viaja a más de 60 mph.
    D: El sistema de escape libera humo y ruido excesivos.
  answer: A
  explanation: Si un vehículo se balancea libremente, se inclina mucho hacia un lado
    durante un giro o parece rebotar continuamente, puede haber un problema con el
    sistema de suspensión.
- id: 238
  category: safe_driving_rules
  question: 'Según la sección ''Conduzca Verde'' (Drive Green), los arranques bruscos
    y las paradas repentinas pueden aumentar el consumo de combustible hasta en un:'
  choices:
    A: 10%
    B: 20%
    C: 30%
    D: 40%
  answer: D
  explanation: Conducir de forma ecológica significa adoptar hábitos sencillos; el
    manual señala que los arranques bruscos y las paradas repentinas pueden aumentar
    el consumo de combustible en un 40%.
- id: 239
  category: safe_driving_rules
  question: 'Cada cinco millas por hora que conduzca a más de 60 mph puede costarle
    hasta un adicional de:'
  choices:
    A: 10 centavos por galón
    B: 15 centavos por galón
    C: 30 centavos por galón
    D: 50 centavos por galón
  answer: C
  explanation: El manual establece que cada cinco millas por encima de las 60 mph
    puede costarle hasta 30 centavos adicionales por galón.
- id: 240
  category: defensive_driving
  question: ¿Qué tan adelante debe intentar observar un buen conductor en la carretera?
  choices:
    A: 3 a 5 segundos adelante
    B: 5 a 10 segundos adelante
    C: 10 a 15 segundos adelante
    D: 20 a 30 segundos adelante
  answer: C
  explanation: Los buenos conductores intentan ver de 10 a 15 segundos adelante en
    la carretera (aproximadamente una cuadra de la ciudad) para evitar maniobras de
    último minuto.
- id: 241
  category: defensive_driving
  question: ¿Con qué frecuencia debe revisar sus espejos para ver si un vehículo lo
    sigue demasiado de cerca?
  choices:
    A: Cada 5 segundos
    B: Cada 10 segundos
    C: Cada 30 segundos
    D: Cada 60 segundos
  answer: B
  explanation: El manual aconseja revisar los espejos aproximadamente cada 10 segundos
    para ver si algún vehículo lo sigue demasiado de cerca.
- id: 242
  category: defensive_driving
  question: ¿Cuál es la forma adecuada de revisar sus puntos ciegos antes de realizar
    un cambio de carril?
  choices:
    A: Confiar totalmente en su espejo retrovisor.
    B: Girar rápidamente la cabeza y mirar por encima del hombro.
    C: Hacer destellos con los faros y esperar una respuesta.
    D: Tocar la bocina para advertir a los vehículos en su punto ciego.
  answer: B
  explanation: Debido a que los espejos dejan puntos ciegos, antes de realizar cualquier
    cambio de carril o giro, debe girar rápidamente la cabeza y mirar por encima del
    hombro para ver qué hay en el punto ciego.
- id: 243
  category: safe_driving_rules
  question: 'Si el límite de velocidad es de 45 mph o más, debe indicar su giro al
    menos:'
  choices:
    A: 50 pies antes de girar
    B: 100 pies antes de girar
    C: 200 pies antes de girar
    D: 500 pies antes de girar
  answer: C
  explanation: Normalmente se señaliza al menos los últimos 100 pies antes de girar,
    pero si el límite de velocidad es de 45 mph o más, debe señalizar al menos los
    últimos 200 pies antes de girar.
- id: 244
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para un giro a la derecha?
  choices:
    A: Mantener el brazo y la mano izquierda extendidos hacia afuera y apuntar con
      el dedo índice.
    B: Mantener el brazo izquierdo extendido hacia afuera y el antebrazo y la mano
      hacia arriba, con la palma hacia adelante.
    C: Apuntar el brazo y la mano izquierda hacia abajo, con la palma hacia atrás.
    D: Mover la mano izquierda en movimiento circular.
  answer: B
  explanation: Para señalizar un giro a la derecha usando señales manuales, mantenga
    el brazo izquierdo extendido hacia afuera y el antebrazo y la mano hacia arriba,
    con la palma hacia adelante.
- id: 245
  category: signs_and_signals
  question: ¿Cómo se utiliza una señal manual para indicar que se va a detener o a
    disminuir la velocidad?
  choices:
    A: Apuntar el brazo y la mano izquierda hacia abajo, con la palma hacia atrás.
    B: Mantener el brazo izquierdo extendido hacia afuera y apuntar con el dedo índice.
    C: Mantener el brazo izquierdo extendido hacia afuera y el antebrazo hacia arriba.
    D: Hacer destellos con las luces de freno tres veces.
  answer: A
  explanation: Para señalizar que se detiene o disminuye la velocidad, apunte el brazo
    y la mano izquierda hacia abajo, con la palma hacia atrás.
- id: 246
  category: defensive_driving
  question: Si se enfrenta a vehículos que se aproximan por su izquierda y a un niño
    en bicicleta a su derecha, ¿cómo debe ajustar su vehículo?
  choices:
    A: Dar el mismo espacio a ambos peligros.
    B: Acercarse más al niño en la bicicleta para evitar los vehículos.
    C: Tocar la bocina continuamente hasta que los peligros desaparezcan.
    D: Darle más espacio al niño, incluso si eso significa acercarse más a los vehículos
      que vienen en sentido contrario.
  answer: D
  explanation: Cuando se trata de dos o más peligros inevitables, dé el mayor espacio
    al peligro más grande o más probable. Es más probable que el niño realice un movimiento
    repentino, por lo que debe darle más espacio al niño, incluso si eso significa
    acercarse más a los vehículos que vienen en sentido contrario.
- id: 247
  category: signs_and_signals
  question: ¿De qué color son las señales de advertencia utilizadas estrictamente
    para identificar zonas de obras en la carretera?
  choices:
    A: Señales amarillas con letras negras
    B: Señales naranjas con letras negras
    C: Señales blancas con letras negras
    D: Señales rojas con letras blancas
  answer: B
  explanation: Una zona de obras en la carretera se puede identificar fácilmente por
    las señales de advertencia naranjas únicas con mensajes en letras negras, que
    se reservan estrictamente para identificar zonas de obras.
- id: 248
  category: vehicle_information
  question: ¿A qué distancia debe ser lo suficientemente fuerte la bocina de su vehículo
    para ser escuchada?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: C
  explanation: Todo vehículo de motor con licencia debe estar equipado con una bocina
    que sea lo suficientemente fuerte como para ser escuchada a una distancia de al
    menos 200 pies.
- id: 249
  category: safe_driving_rules
  question: ¿Cuál es una de las principales causas de choques por alcance en zonas
    de obras?
  choices:
    A: Conducir más rápido que el límite de velocidad indicado
    B: Conducir más lento que el tráfico circundante
    C: No usar las señales de giro al cambiar de carril
    D: Usar las luces altas
  answer: B
  explanation: Según el manual, conducir más lento que el tráfico circundante es una
    de las principales causas de choques por alcance (traseros) en zonas de obras.
- id: 250
  category: safe_driving_rules
  question: Según la ley de Carolina del Norte, ¿cuándo se requiere que use sus faros?
  choices:
    A: Desde la puesta del sol hasta el amanecer y cuando la visibilidad es de 400
      pies o menos
    B: Desde el anochecer hasta el amanecer y cuando la visibilidad es de 500 pies
      o menos
    C: Solo cuando se conduce por carreteras rurales sin iluminación por la noche
    D: De 8 PM a 6 AM independientemente de las condiciones climáticas
  answer: A
  explanation: La ley exige el uso de faros desde la puesta del sol hasta el amanecer
    y cuando la visibilidad es de 400 pies o menos.
- id: 251
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo que se aproxima no baja sus luces delanteras
    por la noche?
  choices:
    A: Encender sus luces altas y dejarlas encendidas hasta que pase
    B: Mirar directamente a las luces delanteras que vienen de frente para calcular
      su distancia
    C: Hacer un cambio de luces una vez, y mirar ligeramente hacia la derecha si todavía
      no las bajan
    D: Salirse de la carretera inmediatamente y apagar todas sus luces
  answer: C
  explanation: El manual aconseja que puede recordárselo al conductor haciendo un
    cambio de luces (parpadeando las luces altas) una vez. Si aún no bajan las luces,
    mantenga las suyas en luces bajas y mire ligeramente hacia la derecha para no
    mirar directamente a los faros.
- id: 252
  category: safe_driving_rules
  question: ¿Cuánto aumenta la distancia de frenado en pavimento resbaladizo en comparación
    con el pavimento seco?
  choices:
    A: Permanece igual si tiene frenos antibloqueo
    B: Aumenta de dos a 10 veces más
    C: Aumenta exactamente un 50 por ciento
    D: Aumenta de 15 a 20 veces más
  answer: B
  explanation: Las distancias de frenado en pavimento resbaladizo aumentan de dos
    a 10 veces más que en pavimento seco.
- id: 253
  category: defensive_driving
  question: ¿Por qué se considera que las carreteras son más peligrosas durante los
    primeros 10 a 15 minutos después de que ha comenzado a llover?
  choices:
    A: La lluvia borra la pintura reflectante de las marcas de los carriles
    B: La lluvia se combina con el aceite, la suciedad, el polvo y el caucho para
      crear una superficie resbaladiza
    C: Los conductores tienden a acelerar para llegar a sus destinos antes de que
      la tormenta empeore
    D: El agua causa inmediatamente un hidroplaneo severo a cualquier velocidad
  answer: B
  explanation: Durante los primeros 10 a 15 minutos, la lluvia se combina con el aceite
    del asfalto y de los vehículos, y con la suciedad, el polvo y el caucho para crear
    una superficie resbaladiza.
- id: 254
  category: safe_driving_rules
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hydroplaning)?
  choices:
    A: Tan baja como 15 millas por hora
    B: Tan baja como 30 millas por hora
    C: Tan baja como 45 millas por hora
    D: Tan baja como 55 millas por hora
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 30 millas
    por hora y en agua de poco más de 1/8 de pulgada de profundidad.
- id: 255
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si su vehículo comienza a hidroplanear?
  choices:
    A: Pisar los frenos a fondo inmediatamente para recuperar la tracción
    B: Girar el volante bruscamente hacia la derecha
    C: Quitar el pie del acelerador y resistir el instinto de usar los frenos
    D: Encender el control de crucero para mantener una velocidad constante
  answer: C
  explanation: Si comienza a hidroplanear, quite el pie del acelerador. Resista su
    instinto de usar los frenos. Mantenga el volante recto y deje que el impulso del
    automóvil disminuya.
- id: 256
  category: vehicle_information
  question: ¿Qué condición de los neumáticos aumenta su probabilidad de hidroplaneo?
  choices:
    A: Neumáticos con surcos profundos y abiertos
    B: Neumáticos inflados al límite superior de las especificaciones del fabricante
    C: Neumáticos con la banda de rodadura desgastada y que están poco inflados
    D: Neumáticos para nieve utilizados durante el verano
  answer: C
  explanation: Los neumáticos con la banda de rodadura desgastada y los que están
    poco inflados tienen menos agarre en la superficie de la carretera, lo que aumenta
    la probabilidad de hidroplaneo.
- id: 257
  category: safe_driving_rules
  question: Según el manual, ¿cuánta agua de corriente rápida se necesita para arrastrar
    un automóvil fuera de la carretera?
  choices:
    A: 2 pulgadas
    B: 6 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Se ha informado que seis pulgadas de agua de corriente rápida pueden
    arrastrar un automóvil fuera de la carretera y 12 pulgadas de agua de corriente
    rápida pueden hacer flotar un automóvil o hacer que se vuelque.
- id: 258
  category: safe_driving_rules
  question: ¿Qué deben hacer los automovilistas de Carolina del Norte siempre que
    utilicen los limpiaparabrisas debido al mal tiempo?
  choices:
    A: Encender sus luces de emergencia
    B: Conducir al menos 15 mph por debajo del límite de velocidad indicado
    C: Encender sus luces delanteras
    D: Conducir únicamente por el carril derecho
  answer: C
  explanation: Todos los automovilistas de Carolina del Norte están obligados a usar
    las luces delanteras siempre que utilicen los limpiaparabrisas debido al mal tiempo.
- id: 259
  category: defensive_driving
  question: ¿Qué luces delanteras debe usar al conducir con niebla?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Únicamente las luces de estacionamiento
    D: Únicamente las luces de emergencia
  answer: B
  explanation: 'Si debe conducir durante la niebla: Encienda las luces delanteras
    de cruce (luces bajas).'
- id: 260
  category: defensive_driving
  question: ¿Qué debe hacer si tiene dificultades extremas para ver mientras conduce
    con niebla?
  choices:
    A: Detenerse en medio de su carril y esperar a que la niebla se disipe
    B: Encender las luces altas y acelerar para salir rápidamente del banco de niebla
    C: Salirse completamente de la calzada, detenerse, asegurar el vehículo y encender
      las luces de emergencia
    D: Bajar las ventanillas y tocar la bocina continuamente mientras conduce
  answer: C
  explanation: 'Si tiene dificultades extremas para ver, debe: Salirse completamente
    de la calzada; detenerse, asegurar el vehículo y encender sus luces de emergencia;
    y salir del vehículo por el lado del pasajero y mantenerse alejado de la carretera.'
- id: 261
  category: safe_driving_rules
  question: ¿Qué áreas de la carretera suelen ser las primeras en congelarse cuando
    baja la temperatura?
  choices:
    A: Intersecciones y cruces de peatones
    B: Lugares sombreados, puentes y pasos elevados
    C: Autopistas con mucho tráfico
    D: Túneles y pasos inferiores
  answer: B
  explanation: Al conducir, preste atención a los lugares sombreados, puentes y pasos
    elevados, ya que estos lugares suelen ser los primeros en congelarse cuando baja
    la temperatura.
- id: 262
  category: defensive_driving
  question: ¿Cuánto debe aumentar su distancia de frenado al reducir la velocidad
    en carreteras con nieve o hielo?
  choices:
    A: Permita al menos el doble de la distancia de frenado normal
    B: Permita al menos tres veces la distancia de frenado normal
    C: Permita al menos cinco veces la distancia de frenado normal
    D: Permita al menos diez veces la distancia de frenado normal
  answer: B
  explanation: 'Al arrancar o detenerse en carreteras con nieve o hielo: permita al
    menos tres veces la distancia de frenado normal para reducir la velocidad.'
- id: 263
  category: safe_driving_rules
  question: Al conducir sobre hielo y nieve compacta, ¿cuánta distancia de frenado
    debe permitir?
  choices:
    A: El doble de la distancia de frenado normal
    B: Al menos tres veces la distancia de frenado normal
    C: Cuatro veces la distancia de frenado normal
    D: La misma que la distancia de frenado normal
  answer: B
  explanation: El manual establece que al conducir sobre hielo y nieve compacta, debe
    permitir al menos tres veces la distancia de frenado normal para reducir la velocidad.
- id: 264
  category: defensive_driving
  question: ¿En qué momentos del día la fauna silvestre está más activa y es más probable
    que se encuentre en la carretera?
  choices:
    A: A media mañana y a primera hora de la tarde
    B: Solo durante las horas más oscuras de la noche
    C: Al amanecer, al atardecer y en las primeras horas después de oscurecer
    D: Al mediodía y al final de la tarde
  answer: C
  explanation: Según el manual, la fauna silvestre puede aparecer en cualquier lugar
    y en cualquier momento; sin embargo, están más activos al amanecer, al atardecer
    y en las primeras horas después de oscurecer.
- id: 265
  category: defensive_driving
  question: ¿Por qué debe tener precaución al usar las luces altas cuando hay animales
    directamente adelante?
  choices:
    A: Las luces altas pueden confundir o "congelar" a algunos animales.
    B: Las luces altas harán que el animal embista al vehículo.
    C: Las luces altas dificultan que el conductor vea el brillo de los ojos.
    D: Las luces altas cegarán permanentemente al animal.
  answer: A
  explanation: El manual aconseja usar las luces altas solo cuando no haya tráfico
    en sentido contrario ni animales directamente adelante, porque las luces altas
    pueden confundir o "congelar" a algunos animales, provocando el comportamiento
    de "ciervo ante los faros".
- id: 266
  category: safe_driving_rules
  question: Si atropella a un animal y se detiene a un lado de la carretera, ¿qué
    debe hacer a continuación?
  choices:
    A: Acercarse al animal para comprobar sus heridas.
    B: Permanecer en su automóvil, cerrar las puertas con seguro y encender las luces
      de emergencia.
    C: Arrastrar al animal fuera de la calzada inmediatamente.
    D: Salir del vehículo y hacer señas a otros conductores para pedir ayuda.
  answer: B
  explanation: Si atropella a un animal, el manual le indica que se detenga a un lado
    de la carretera de forma segura, permanezca en su automóvil, cierre las puertas
    con seguro y encienda las luces de emergencia. No debe acercarse al animal, ya
    que puede ser peligroso.
- id: 267
  category: vehicle_information
  question: Si su vehículo está equipado con transmisión automática y los frenos fallan,
    ¿qué debe hacer?
  choices:
    A: Poner el vehículo en estacionamiento (Park) y apagar el motor.
    B: Bombear el pedal del acelerador para aumentar la presión del líquido de frenos.
    C: Aplicar el freno de emergencia y mover la palanca de cambios a la posición
      de rango bajo (Low).
    D: Poner el vehículo en punto muerto (Neutral) y avanzar por inercia hasta que
      el vehículo se detenga.
  answer: C
  explanation: En caso de falla de los frenos en un vehículo con transmisión automática,
    debe aplicar el freno de emergencia y mover la palanca de cambios a la posición
    de rango bajo.
- id: 268
  category: vehicle_information
  question: ¿Cómo puede ayudar a secar los frenos mojados?
  choices:
    A: Conducir a alta velocidad durante varias millas.
    B: Conducir una distancia corta y aplicar una ligera presión al pedal del freno.
    C: Bombear el pedal del freno rápidamente mientras está en punto muerto (Neutral).
    D: Detenerse a un lado y dejar que los frenos se sequen al aire durante una hora.
  answer: B
  explanation: Puede ayudar a secar los frenos mojados conduciendo una distancia corta
    y aplicando una ligera presión al pedal del freno. La fricción genera calor que
    evapora el agua.
- id: 269
  category: safe_driving_rules
  question: 'Para evitar el desgaste excesivo de los frenos al bajar una colina larga
    o una pendiente pronunciada, usted debe:'
  choices:
    A: Mantener presionado el pedal del freno durante todo el descenso.
    B: Poner el vehículo en punto muerto (Neutral) y bajar la colina por inercia.
    C: Apagar el motor para reducir la velocidad.
    D: Cambiar a una marcha más baja en la cima de la colina antes de descender.
  answer: D
  explanation: Para evitar el desgaste excesivo de los frenos al bajar una colina
    larga o una pendiente pronunciada, use una marcha más baja en lugar del pedal
    del freno para controlar la velocidad. Lo mejor es cambiar a la marcha más baja
    en la cima de la colina antes de descender.
- id: 270
  category: defensive_driving
  question: ¿Cuál es uno de los pasos que debe seguir si se le atasca el pedal del
    acelerador?
  choices:
    A: Cambiar a punto muerto (Neutral) y aplicar una presión firme a los frenos sin
      bloquear las ruedas.
    B: Apagar el encendido inmediatamente y retirar la llave.
    C: Cambiar a reversa para contrarrestar el movimiento hacia adelante.
    D: Pisar los frenos lo más fuerte posible para bloquear las ruedas.
  answer: A
  explanation: Si el pedal del acelerador se atasca, el manual recomienda cambiar
    a punto muerto (Neutral) y aplicar una presión firme a los frenos sin bloquear
    las ruedas, así como dar golpecitos al pedal o buscar un lugar seguro para detenerse.
- id: 271
  category: defensive_driving
  question: Si ocurre un reventón de neumático mientras conduce, ¿qué debe hacer primero?
  choices:
    A: Aplicar los frenos con fuerza inmediatamente para detenerse rápido.
    B: Sujetar el volante con firmeza e intentar mantener el vehículo recto.
    C: Girar el volante bruscamente hacia el acotamiento.
    D: Acelerar ligeramente para mantener el control del vehículo.
  answer: B
  explanation: Si ocurre un reventón, debe sujetar el volante con firmeza e intentar
    mantener el vehículo recto en su lado de la carretera, y reducir la velocidad
    levantando el pie del acelerador sin aplicar los frenos de inmediato.
- id: 272
  category: safe_driving_rules
  question: Si su vehículo se avería y necesita ayuda, ¿cómo debe avisar a otros conductores?
  choices:
    A: Pararse en medio de la carretera y agitar los brazos.
    B: Atar un paño blanco a la manija de la puerta izquierda o a la antena de radio
      y levantar el capó.
    C: Encender y apagar las luces altas continuamente.
    D: Colocar una bandera roja en el parachoques trasero y pararse detrás del vehículo.
  answer: B
  explanation: Si su vehículo se avería y necesita ayuda, el manual establece que
    debe atar un paño blanco a la manija de la puerta izquierda o a la antena de radio
    y levantar el capó del vehículo.
- id: 273
  category: defensive_driving
  question: 'Si un vehículo que se aproxima cruza la línea central hacia la trayectoria
    de su vehículo, usted debe:'
  choices:
    A: Girar hacia el carril izquierdo para evitarlos.
    B: Aumentar la velocidad para pasarlos rápidamente.
    C: Reducir la velocidad de inmediato, tocar la bocina y mantenerse a la derecha.
    D: Detenerse de inmediato en su carril y encender y apagar los faros.
  answer: C
  explanation: Si un vehículo que se aproxima cruza la línea central hacia su trayectoria,
    debe reducir la velocidad de inmediato, tocar la bocina y mantenerse a la derecha,
    incluso si esto significa salirse de la carretera.
- id: 274
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo se sale del pavimento hacia el acotamiento?
  choices:
    A: Aplicar los frenos de inmediato y dar un volantazo hacia la carretera.
    B: Retirar lentamente el pie del acelerador y conducir recto hacia adelante.
    C: Acelerar para volver al pavimento rápidamente.
    D: Poner el vehículo en punto muerto (neutral) y avanzar por inercia hasta detenerse.
  answer: B
  explanation: Si su vehículo se sale del pavimento, no debe aplicar los frenos de
    inmediato ni intentar girar de vuelta. En su lugar, retire lentamente el pie del
    acelerador y conduzca recto hacia adelante.
- id: 275
  category: defensive_driving
  question: Si se encuentra en un derrape, ¿en qué dirección debe girar el volante?
  choices:
    A: En la dirección opuesta a la que derrapa la parte trasera del vehículo.
    B: Mantener el volante perfectamente recto.
    C: En la dirección en la que derrapa la parte trasera del vehículo.
    D: Hacia el acotamiento derecho de la carretera, independientemente de la dirección
      del derrape.
  answer: C
  explanation: Si se encuentra en un derrape, debe levantar el pie del acelerador
    y girar el volante en la dirección en la que derrapa la parte trasera del vehículo.
- id: 276
  category: defensive_driving
  question: 'Si está a punto de ser golpeado por detrás y no hay vehículos delante
    de usted, debe:'
  choices:
    A: Presionar el acelerador y alejarse lo más rápido posible.
    B: Frenar bruscamente para prepararse para el impacto.
    C: Poner la marcha atrás y retroceder.
    D: Apagar el motor y soltarse el cinturón de seguridad.
  answer: A
  explanation: Si está a punto de ser golpeado por detrás y no hay vehículos delante
    de usted, el manual aconseja presionar el acelerador y alejarse lo más rápido
    posible.
- id: 277
  category: driver_responsibility
  question: ¿Cómo protege la ley a las personas que se detienen y prestan ayuda en
    la escena de un accidente?
  choices:
    A: Les garantiza una compensación económica por su tiempo.
    B: Los protege de responsabilidad civil, excepto por actos ilícitos intencionales
      o conducta rebelde.
    C: Les otorga inmunidad frente a todas las futuras infracciones de tráfico.
    D: Exige que el seguro del conductor culpable les pague una recompensa.
  answer: B
  explanation: La ley protege a las personas que se detienen y prestan ayuda en la
    escena de un accidente de la responsabilidad civil, excepto por actos ilícitos
    intencionales o conducta rebelde.
- id: 278
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra en un derrape?
  choices:
    A: Frenar con firmeza y mantener el volante recto.
    B: Girar el volante en la dirección opuesta a la que derrapa la parte trasera.
    C: Girar el volante en la dirección en la que derrapa la parte trasera del vehículo.
    D: Acelerar rápidamente para recuperar la tracción.
  answer: C
  explanation: Si se encuentra en un derrape, debe levantar el pie del acelerador
    y girar el volante en la dirección en la que derrapa la parte trasera del vehículo.
- id: 279
  category: safe_driving_rules
  question: Si se ve involucrado en un choque en un carril principal sin heridos ni
    víctimas mortales, ¿qué debe hacer con su vehículo?
  choices:
    A: Dejarlo exactamente donde está hasta que llegue la policía.
    B: Sacarlo del carril de circulación hacia el acotamiento si se puede conducir
      de forma segura.
    C: Conducirlo inmediatamente al taller de reparación más cercano.
    D: Abandonar el vehículo y caminar hacia un lugar seguro.
  answer: B
  explanation: Si el choque ocurrió en un carril principal y no hay heridos ni víctimas
    mortales, cada vehículo debe ser retirado del carril de circulación hacia el acotamiento
    de la carretera, siempre que pueda conducirse de manera segura por sus propios
    medios.
- id: 280
  category: penalties_and_points
  question: ¿Cuándo le exige la ley informar de inmediato sobre un choque a las autoridades?
  choices:
    A: Solo cuando muere una persona.
    B: Solo cuando los daños a la propiedad superan los $5,000.
    C: Cuando cualquier persona muere o resulta herida, o el daño total a la propiedad
      parece ser de $1,000 o más.
    D: Siempre que el choque involucre a más de dos vehículos.
  answer: C
  explanation: La ley le exige informar de inmediato al oficial o agencia de la ley
    más cercana sobre cualquier choque cuando alguna persona muera o resulte herida,
    o cuando el daño total a los vehículos y otra propiedad parezca ascender a $1,000
    o más.
- id: 281
  category: driver_responsibility
  question: ¿Qué debe hacer si daña una propiedad en un choque y no conoce al propietario?
  choices:
    A: Abandonar la escena de inmediato.
    B: Esperar en la escena exactamente una hora.
    C: Anotar toda la información que pueda reunir y entregarla al oficial de la ley
      más cercano.
    D: Dejar una nota con su número de teléfono en la propiedad dañada.
  answer: C
  explanation: Si no conoce a los ocupantes del otro vehículo o al propietario de
    la propiedad dañada, anote toda la información que pueda reunir y entréguela al
    oficial de la ley más cercano.
- id: 282
  category: penalties_and_points
  question: ¿Cuál es la sanción por no ceder el paso a un peatón al realizar un giro
    a la derecha con luz roja?
  choices:
    A: Una advertencia por la primera infracción.
    B: Una sanción de no más de $500 y no menos de $100.
    C: Una suspensión obligatoria de la licencia por 30 días.
    D: Una multa de exactamente $50.
  answer: B
  explanation: No ceder el paso a un peatón bajo estas circunstancias resultará en
    una sanción de no más de $500 y no menos de $100.
- id: 283
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico con flecha amarilla?
  choices:
    A: La señal de flecha verde protegida está a punto de cambiar a una señal verde
      circular normal, roja circular o flecha roja.
    B: Usted tiene el derecho de paso para realizar el giro sin ceder el paso.
    C: Debe detenerse de inmediato y no avanzar hasta que cambie a verde.
    D: El semáforo está funcionando mal.
  answer: A
  explanation: Una flecha amarilla indica que la señal de flecha verde "protegida"
    está a punto de cambiar a una señal verde circular normal, una señal roja circular
    o una señal de flecha roja.
- id: 284
  category: signs_and_signals
  question: ¿Cómo debe proceder al acercarse a una intersección con un semáforo que
    no funciona debido a un corte de energía?
  choices:
    A: Ceder el paso al vehículo a su derecha y avanzar sin detenerse.
    B: Proceder como si la intersección estuviera controlada por una señal de alto
      (stop) en todos los accesos.
    C: Esperar hasta que llegue un oficial de la ley.
    D: Tratar la intersección como una señal de ceda el paso (yield).
  answer: B
  explanation: Al acercarse a una intersección con un semáforo que ha dejado de funcionar
    debido a un corte de energía... debe acercarse a la intersección y proceder como
    si la intersección estuviera controlada por una señal de alto (stop) en todos
    los accesos.
- id: 285
  category: signs_and_signals
  question: ¿Qué significa una señal roja intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución.
    B: Detenerse y esperar a que la luz cambie a verde.
    C: Tiene el mismo significado que una señal de alto (stop).
    D: Ceder el paso al tráfico que viene en sentido contrario pero no detenerse.
  answer: C
  explanation: 'La señal roja intermitente tiene el mismo significado que la señal
    de alto (stop): detenerse y no avanzar hasta que pueda entrar en la intersección
    sin interferir con el tráfico que se aproxima.'
- id: 286
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor cuando se enfrenta a una flecha amarilla
    intermitente para realizar un giro?
  choices:
    A: Detenerse y esperar a una flecha verde fija.
    B: El giro está permitido, pero el conductor debe ceder el paso al tráfico que
      viene en sentido contrario y a los peatones.
    C: El conductor tiene el derecho de paso y el tráfico que viene en sentido contrario
      debe ceder el paso.
    D: Prepararse para detenerse porque la luz está cambiando a rojo.
  answer: B
  explanation: Cuando se muestra la flecha amarilla intermitente, el giro indicado
    está permitido, pero los conductores deben ceder el paso al tráfico que viene
    en sentido contrario y a los peatones.
- id: 287
  category: signs_and_signals
  question: Al realizar un giro en U con una flecha verde fija, ¿qué debe hacer?
  choices:
    A: Ceder el paso al tráfico opuesto que gira a la derecha cuando ambos tienen
      una flecha verde.
    B: Proceder sin ceder el paso a ningún tráfico.
    C: Detenerse y esperar a una luz verde circular.
    D: Ceder el paso a todo el tráfico detrás de usted.
  answer: A
  explanation: El tráfico que gira en U debe ceder el paso al tráfico opuesto que
    gira a la derecha cuando ambos movimientos tienen simultáneamente su respectiva
    flecha verde.
- id: 288
  category: signs_and_signals
  question: ¿Qué debe hacer si una señal de control de rampa (ramp meter) está apagada
    o no emite ninguna luz?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Tratarla como una parada de cuatro vías.
    C: Proceder sin detenerse y entrar en la autopista incorporándose o cediendo el
      paso de forma normal.
    D: Detenerse en el arcén y reportar la señal averiada.
  answer: C
  explanation: Cuando la pantalla está oscura o no emite una señal roja o verde, un
    vehículo puede proceder sin detenerse y entrar en la autopista incorporándose
    o cediendo el paso según lo permitan las condiciones normales.
- id: 289
  category: signs_and_signals
  question: ¿Cómo funcionan las balizas híbridas cuando un peatón las activa por primera
    vez?
  choices:
    A: Cambian inmediatamente a rojo fijo.
    B: Parpadean en amarillo, luego pasan a amarillo fijo y después a rojo fijo para
      permitir que los vehículos se detengan de manera segura.
    C: Parpadean en rojo continuamente hasta que el peatón termina de cruzar.
    D: Muestran una flecha verde para los peatones.
  answer: B
  explanation: Una vez activadas, las balizas parpadearán en amarillo durante unos
    segundos, luego pasarán a amarillo fijo y rojo fijo durante unos segundos más
    para permitir que los vehículos en movimiento se detengan de manera segura.
- id: 290
  category: signs_and_signals
  question: ¿Dónde se coloca habitualmente una señal de alto (stop)?
  choices:
    A: Exactamente en la línea de la intersección.
    B: De 6 a 50 pies de la intersección.
    C: 100 pies antes de la intersección.
    D: De 50 a 100 pies de la intersección.
  answer: B
  explanation: La señal de alto (stop) se coloca habitualmente de seis a 50 pies de
    la intersección.
- id: 291
  category: signs_and_signals
  question: ¿Si no hay una línea de parada o un cruce de peatones marcado en una señal
    de alto, dónde debe detenerse el conductor?
  choices:
    A: Al nivel de la propia señal de alto.
    B: 10 pies antes de la calle transversal.
    C: Antes de entrar en la intersección donde tenga visibilidad de la calle transversal.
    D: En medio de la intersección para revisar el tráfico.
  answer: C
  explanation: Si no hay una línea de parada o un cruce de peatones marcado, el conductor
    debe detenerse antes de entrar en la intersección donde tenga visibilidad de la
    calle transversal.
- id: 292
  category: signs_and_signals
  question: ¿Cuál es la forma y el color de una señal de ceda el paso (yield)?
  choices:
    A: Forma octagonal, roja y blanca
    B: Forma triangular con la punta hacia abajo, roja y blanca
    C: Forma de diamante, negra y amarilla
    D: Forma de banderín, amarilla y negra
  answer: B
  explanation: Según el manual, la señal de ceda el paso es de forma triangular con
    la punta hacia abajo, y es roja y blanca con la palabra 'YIELD' en letras grandes.
- id: 293
  category: signs_and_signals
  question: ¿Dónde se ubica la señal de advertencia amarilla en forma de banderín
    que dice 'DO NOT PASS' (no rebasar)?
  choices:
    A: En el lado derecho de la carretera
    B: Suspendida sobre el centro de la intersección
    C: En el lado izquierdo de la carretera
    D: En el acotamiento derecho antes de una curva
  answer: C
  explanation: El manual establece que la señal de advertencia amarilla en forma de
    banderín se ubica en el lado izquierdo de la carretera y señala el inicio de la
    zona de no rebasar.
- id: 294
  category: signs_and_signals
  question: ¿De qué advierten a los conductores las señales en forma de diamante que
    son de color naranja con mensajes en negro?
  choices:
    A: Cruces de ferrocarril
    B: Zonas escolares
    C: Zonas de construcción o mantenimiento
    D: Zonas de no rebasar
  answer: C
  explanation: Las señales de precaución o advertencia en forma de diamante que son
    de color naranja con mensajes en negro advierten sobre zonas de construcción o
    mantenimiento.
- id: 295
  category: signs_and_signals
  question: ¿Qué señal advierte con anticipación sobre un cruce de ferrocarril?
  choices:
    A: Una señal circular con una cruz negra y las letras 'RR' sobre un fondo amarillo
    B: Una señal de aspa blanca con las palabras 'RAILROAD CROSSING' en negro
    C: Una señal amarilla en forma de diamante con el símbolo de un tren en negro
    D: Una señal en forma de pentágono con una cruz negra
  answer: A
  explanation: Una señal circular, con una cruz negra y las letras negras 'RR' sobre
    un fondo amarillo, advierte con anticipación sobre un cruce de ferrocarril.
- id: 296
  category: signs_and_signals
  question: ¿De qué advierte a los conductores una señal de cinco lados (pentágono)?
  choices:
    A: Una zona de hospital
    B: Una zona escolar o un cruce escolar
    C: Un cruce de peatones
    D: Una próxima señal de alto
  answer: B
  explanation: La señal de cinco lados (o pentágono) advierte de una zona escolar
    o un cruce escolar, donde los conductores deben estar especialmente atentos a
    los niños.
- id: 297
  category: signs_and_signals
  question: Según el manual, ¿cómo se trazan generalmente las carreteras con números
    impares?
  choices:
    A: Este y oeste
    B: Norte y sur
    C: En un circuito circular alrededor de una ciudad
    D: Diagonalmente a través del estado
  answer: B
  explanation: El manual establece que las carreteras con números impares generalmente
    corren de norte a sur.
- id: 298
  category: signs_and_signals
  question: ¿Qué forma tiene el marcador de ruta para una carretera de Carolina del
    Norte (N.C.)?
  choices:
    A: Escudo
    B: Rectángulo
    C: Diamante
    D: Círculo
  answer: C
  explanation: Según la sección de señales de guía/informativas, los marcadores de
    ruta de Carolina del Norte tienen forma de diamante.
- id: 299
  category: safe_driving_rules
  question: ¿Cuál es el propósito de las líneas amarillas en el pavimento de una calzada?
  choices:
    A: Separar los carriles de circulación que se mueven en la misma dirección
    B: Marcar el borde derecho de la calzada
    C: Indicar un cruce de peatones
    D: Separar los carriles de circulación que se mueven en direcciones opuestas
  answer: D
  explanation: Las líneas amarillas separan los carriles de circulación que se mueven
    en direcciones opuestas, mientras que las líneas blancas separan los carriles
    que se mueven en la misma dirección.
- id: 300
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a un carril
    central especial reservado para giros a la izquierda en ambos sentidos?
  choices:
    A: Puede usarse para rebasar vehículos más lentos
    B: No debe usarse para rebasar o para incorporarse al tráfico
    C: Está reservado exclusivamente para vehículos de emergencia
    D: Puede usarse como un carril de circulación normal durante las horas pico
  answer: B
  explanation: El manual establece explícitamente que el carril de giro a la izquierda
    en ambos sentidos no debe usarse para rebasar a otro vehículo ni con el propósito
    de incorporarse al tráfico.
- id: 301
  category: safe_driving_rules
  question: ¿Qué indican los marcadores reflectantes rojos en el pavimento a un automovilista?
  choices:
    A: La ubicación de un hidrante de incendios cercano
    B: Que se aproxima una zona escolar
    C: Movimientos en sentido contrario
    D: Que hay un cruce de ferrocarril más adelante
  answer: C
  explanation: Los marcadores rojos indican movimientos en sentido contrario para
    los automovilistas. Los marcadores reflectantes azules en el pavimento indican
    hidrantes de incendios cercanos.
- id: 302
  category: safe_driving_rules
  question: Si un oficial de tránsito está dirigiendo el tráfico en una intersección
    con un semáforo que funciona, ¿qué debe hacer usted?
  choices:
    A: Obedecer el semáforo
    B: Obedecer las señales manuales del oficial en lugar del semáforo
    C: Tratar la intersección como una parada de cuatro vías
    D: Tocar la bocina para reconocer al oficial
  answer: B
  explanation: Bajo circunstancias especiales, un oficial puede estar dirigiendo el
    flujo del tráfico. Si es así, debe obedecer las señales manuales del oficial en
    lugar de las señales o letreros de tránsito normales.
- id: 303
  category: sharing_the_road
  question: ¿Están los ciclistas sujetos a las leyes de Conducir Bajo los Efectos
    del Alcohol o Drogas (DWI)?
  choices:
    A: No, porque las bicicletas no son vehículos motorizados
    B: Sí, porque la ley estatal considera que las bicicletas son vehículos
    C: Solo si están circulando por una carretera estatal
    D: Solo si están involucrados en una colisión
  answer: B
  explanation: Debido a que las bicicletas son vehículos, los ciclistas deben obedecer
    las mismas leyes de tránsito que los demás conductores, lo que incluye las leyes
    de DWI.
- id: 304
  category: sharing_the_road
  question: ¿Qué equipo de iluminación exige la ley para una bicicleta que se conduce
    de noche?
  choices:
    A: Una luz delantera visible desde al menos 300 pies y una luz roja trasera o
      reflector visible desde al menos 200 pies
    B: Una luz delantera visible desde 500 pies y una luz roja trasera visible desde
      500 pies
    C: Solo un reflector rojo trasero visible desde 100 pies
    D: Ropa reflectante y una luz intermitente en el casco
  answer: A
  explanation: Por la noche, la ley exige que la bicicleta esté equipada con una luz
    en la parte delantera visible a una distancia de al menos 300 pies y una luz roja
    o reflector en la parte trasera visible a una distancia de al menos 200 pies.
- id: 305
  category: sharing_the_road
  question: ¿En qué dirección deben circular los ciclistas por la calzada?
  choices:
    A: En contra del flujo del tráfico para ver los autos que vienen de frente
    B: En el lado izquierdo de la carretera
    C: Con el flujo del tráfico, en el lado derecho de la carretera
    D: Por la acera siempre que sea posible
  answer: C
  explanation: Es especialmente importante que los ciclistas vayan con el flujo del
    tráfico, NO en contra. Deben circular por la derecha, con el tráfico.
- id: 306
  category: sharing_the_road
  question: ¿Quién está obligado por ley a usar un casco protector de bicicleta aprobado?
  choices:
    A: Todos los ciclistas independientemente de su edad
    B: Solo los ciclistas que circulan por autopistas interestatales
    C: Todos los ciclistas y pasajeros menores de 16 años
    D: Solo los pasajeros que viajan en un asiento de bicicleta
  answer: C
  explanation: Todos los ciclistas y pasajeros menores de 16 años deben usar un casco
    protector de bicicleta aprobado y deben estar sentados en un asiento de silla
    de montar.
- id: 307
  category: sharing_the_road
  question: ¿Cuáles son los requisitos de peso y altura para que un pasajero deba
    sentarse en un asiento de sujeción para bicicleta?
  choices:
    A: Menos de 30 libras o menos de 30 pulgadas de altura
    B: Menos de 40 libras o menos de 40 pulgadas de altura
    C: Menos de 50 libras o menos de 48 pulgadas de altura
    D: Menos de 60 libras o menos de 50 pulgadas de altura
  answer: B
  explanation: Según el manual, un pasajero que pese menos de 40 libras o mida menos
    de 40 pulgadas de altura debe estar sentado en un asiento de sujeción para bicicleta.
- id: 308
  category: safe_driving_rules
  question: Al caminar por una carretera como peatón, ¿por dónde debe caminar?
  choices:
    A: En el lado derecho de la carretera moviéndose con el tráfico
    B: En el lado derecho de la carretera de frente al tráfico
    C: En el lado izquierdo de la carretera de frente al tráfico
    D: En el lado izquierdo de la carretera moviéndose con el tráfico
  answer: C
  explanation: El manual establece que los peatones siempre deben caminar por el lado
    izquierdo de la carretera de frente al tráfico.
- id: 309
  category: sharing_the_road
  question: Según el manual, ¿qué grupos constituyen la mayoría de los peatones que
    mueren en choques de vehículos motorizados?
  choices:
    A: Adolescentes y adultos jóvenes
    B: Trabajadores de la construcción y personas que corren (joggers)
    C: Personas que caminan en cruces peatonales e intersecciones
    D: Niños, personas mayores o aquellos que han estado bebiendo bebidas alcohólicas
  answer: D
  explanation: El manual señala que la mayoría de los peatones que mueren son niños,
    personas mayores o aquellos que han estado bebiendo bebidas alcohólicas.
- id: 310
  category: sharing_the_road
  question: ¿Hasta qué distancia detrás de un camión con remolque se extiende el punto
    ciego trasero (NO-ZONE)?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 200 pies
    D: Hasta 300 pies
  answer: C
  explanation: Los camioneros tienen puntos ciegos graves o 'NO-ZONES' en los que
    un automóvil puede desaparecer de la vista, incluyendo hasta 200 pies en la parte
    trasera.
- id: 311
  category: defensive_driving
  question: ¿Cuál es una regla general para los automovilistas que comparten la carretera
    con un camión con remolque (tractor-trailer)?
  choices:
    A: Si puede ver las llantas del camión, está a una distancia segura
    B: Si no puede ver al conductor del camión en su espejo retrovisor lateral, él
      no puede verlo a usted
    C: Siempre rebase a un camión grande por el lado derecho
    D: Siga de cerca al camión para reducir la resistencia al viento y mejorar el
      consumo de gasolina
  answer: B
  explanation: 'Una regla general para los automovilistas que comparten la carretera
    con un camión con remolque es: "si no puede ver al conductor del camión en su
    espejo retrovisor lateral, él no puede verlo a usted".'
- id: 312
  category: sharing_the_road
  question: ¿Cuánta carretera despejada puede ser necesaria para rebasar de manera
    segura un remolque y el vehículo que lo remolca?
  choices:
    A: Un cuarto de milla
    B: Media milla
    C: Tres cuartos de milla
    D: Una milla completa
  answer: B
  explanation: Debe tener extrema precaución al rebasar un remolque y el vehículo
    que lo remolca, ya que puede necesitar media milla de carretera despejada para
    rebasar de manera segura.
- id: 313
  category: safe_driving_rules
  question: Al rebasar un ciclomotor (moped), ¿qué tan a la izquierda debe mantenerse
    como mínimo?
  choices:
    A: Un pie
    B: Dos pies
    C: Tres pies
    D: Cuatro pies
  answer: B
  explanation: Un ciclomotor debe circular por el lado derecho del carril. Para rebasar
    un ciclomotor, debe mantenerse al menos a dos pies a la izquierda.
- id: 314
  category: sharing_the_road
  question: En la mayoría de los choques de motocicletas que involucran un automóvil
    en Carolina del Norte, ¿quién suele tener la culpa?
  choices:
    A: El motociclista
    B: El conductor del automóvil
    C: Ambos conductores por igual
    D: Ninguno, ya que el clima suele ser el factor principal
  answer: B
  explanation: Aproximadamente dos tercios de los choques de motocicletas en Carolina
    del Norte involucran un automóvil. En la mayoría de estos choques, el conductor
    del automóvil tiene la culpa, alegando generalmente que no vio la motocicleta.
- id: 315
  category: license_system
  question: ¿Cuál es la edad mínima requerida para operar un ciclomotor (moped) en
    una vía pública en Carolina del Norte?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: En Carolina del Norte, debe tener al menos 16 años para operar un ciclomotor
    en una vía pública o área vehicular pública.
- id: 316
  category: sharing_the_road
  question: ¿Por qué los camiones grandes requieren espacio adicional para girar?
  choices:
    A: Porque sus frenos se calientan rápidamente en pendientes cuesta abajo
    B: Porque sus ruedas traseras no siguen la trayectoria de sus ruedas delanteras
    C: Porque tienen puntos ciegos más grandes que los automóviles de pasajeros
    D: Porque aceleran mucho más lento que los vehículos de pasajeros
  answer: B
  explanation: Los camiones grandes requieren espacio adicional para girar porque
    sus ruedas traseras no siguen la trayectoria de sus ruedas delanteras.
- id: 317
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los operadores
    de ciclomotores (moped) y las leyes de conducir bajo los efectos del alcohol o
    drogas (DWI)?
  choices:
    A: Los operadores de ciclomotores están exentos de las leyes de DWI porque los
      ciclomotores no se consideran vehículos motorizados.
    B: Las leyes de DWI solo se aplican a los operadores de ciclomotores si viajan
      a más de 20 mph.
    C: Las leyes de conducir bajo los efectos del alcohol o drogas que se aplican
      a los conductores de otros vehículos motorizados también se aplican a los operadores
      de ciclomotores.
    D: Los operadores de ciclomotores enfrentan sanciones menores por DWI que los
      conductores de automóviles.
  answer: C
  explanation: El manual establece explícitamente que las leyes de conducir bajo los
    efectos del alcohol o drogas (DWI) que se aplican a los conductores de otros vehículos
    motorizados también se aplican a los operadores de ciclomotores.
- id: 318
  category: defensive_driving
  question: ¿De qué peligro potencial debe estar consciente cuando un vehículo que
    remolca un tráiler frena repentinamente?
  choices:
    A: El remolque puede desprenderse del vehículo que lo remolca
    B: El frenado repentino podría causar que el remolque se pliegue en forma de tijera
      (jackknife)
    C: Es probable que el motor del vehículo que remolca se apague
    D: Los frenos del remolque se sobrecalentarán y se incendiarán
  answer: B
  explanation: Cuando se acerque a un vehículo que remolca un tráiler, tenga en cuenta
    que un frenado repentino podría causar que el remolque se pliegue en forma de
    tijera (jackknife).
- id: 319
  category: vehicle_information
  question: ¿Qué documento puede servir como prueba de propiedad de un ciclomotor
    (moped) si el operador no tiene un Certificado de Origen del Fabricante (MCO)?
  choices:
    A: Una factura de venta notariada del concesionario
    B: Un formulario de Declaración Jurada de Hechos para el Registro de un Ciclomotor
      (MVR-58)
    C: Una licencia de conducir válida de Carolina del Norte
    D: Una tarjeta de registro del propietario anterior
  answer: B
  explanation: El manual establece que si un operador no tiene un MCO para su vehículo,
    puede completar un formulario de Declaración Jurada de Hechos para el Registro
    de un Ciclomotor (MVR-58) para que sirva como prueba de propiedad.
- id: 320
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por una primera condena por tirar basura (littering)
    en Carolina del Norte?
  choices:
    A: Una multa mínima de $100
    B: Una multa mínima de $250
    C: Una multa mínima de $500
    D: Una multa mínima de $1,000
  answer: B
  explanation: Cuando se tira o se vuela basura desde un vehículo, el conductor es
    el responsable. Si es condenado, la multa mínima es de $250 y la multa máxima
    es de $1,000.
- id: 321
  category: penalties_and_points
  question: Si ocurre una segunda infracción por arrojar basura dentro de los tres
    años posteriores a una infracción previa, ¿cuál es la multa máxima al ser condenado?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Cualquier segunda infracción o posterior por arrojar basura dentro
    de los tres años posteriores a la fecha de una infracción previa se castiga con
    una multa no menor de $500 ni mayor de $2,000, si se le condena.
- id: 322
  category: sharing_the_road
  question: ¿Con qué frecuencia acepta un grupo de voluntarios recoger basura al unirse
    al Programa Adopt-A-Highway?
  choices:
    A: Una vez al mes
    B: Dos veces al año
    C: Al menos cuatro veces al año
    D: Seis veces al año
  answer: C
  explanation: Para unirse al programa Adopt-A-Highway, un grupo acepta recoger basura
    al menos cuatro veces al año a lo largo de una sección de dos millas de una carretera
    mantenida por el estado.
- id: 323
  category: license_system
  question: ¿Qué tipo de verificación del historial de la licencia de conducir se
    requiere generalmente para las comparecencias ante el tribunal?
  choices:
    A: Un historial completo no certificado
    B: Una copia certificada del historial
    C: Un historial de tres años no certificado
    D: Una copia del historial de direcciones
  answer: B
  explanation: El manual especifica que generalmente se requiere una verificación
    certificada del historial de la licencia de conducir para las comparecencias ante
    el tribunal.
- id: 324
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos está exento de ser registrado en la
    División de Vehículos Motorizados (DMV)?
  choices:
    A: Ciclomotores
    B: Casas rodantes
    C: Equipo de construcción de carreteras exento
    D: Vehículos de flota
  answer: C
  explanation: A excepción de los propietarios de vehículos agrícolas exentos y equipos
    de construcción de carreteras exentos, cada propietario de un vehículo debe registrar
    su vehículo motorizado en la División de Vehículos Motorizados.
- id: 325
  category: vehicle_information
  question: ¿Qué debe proporcionar un nuevo residente de Carolina del Norte que se
    muda desde otro estado para titular y registrar su vehículo?
  choices:
    A: Una licencia de conducir válida de otro estado y un Certificado de Conducción
      Temporal (TDC) de Carolina del Norte
    B: Una copia certificada de su historial de conducción
    C: Una Declaración Jurada de Hechos (MVR-58)
    D: Una tarjeta de registro de votante de Carolina del Norte
  answer: A
  explanation: Si usted es un nuevo residente de Carolina del Norte que se muda desde
    otro estado, se requerirá su licencia de conducir válida de fuera del estado,
    junto con su Certificado de Conducción Temporal (TDC) de Carolina del Norte, para
    titular y registrar su vehículo.
- id: 326
  category: vehicle_information
  question: De acuerdo con la ley de Carolina del Norte, ¿cuál de las siguientes acciones
    está prohibida con respecto a las placas de matrícula?
  choices:
    A: Mostrar la placa en la parte trasera del vehículo
    B: Usar cubiertas de plástico para las placas de matrícula
    C: Tener calcomanías de validación en la placa
    D: Mostrar la fecha de vencimiento
  answer: B
  explanation: El manual establece explícitamente que las cubiertas de plástico para
    las placas de matrícula están prohibidas bajo la norma GS 20-63g.
- id: 327
  category: vehicle_information
  question: ¿Qué información se requiere para cambiar la dirección física en el registro
    de su vehículo en línea?
  choices:
    A: Su número de seguro social y fecha de nacimiento
    B: Su número de placa de matrícula, los últimos cinco caracteres del número de
      título del vehículo y un correo electrónico válido
    C: Una copia certificada de su historial de conducción y prueba de seguro
    D: Su licencia de conducir de otro estado y un Certificado de Conducción Temporal
  answer: B
  explanation: Para cambiar su dirección en línea, necesitará su número de placa de
    matrícula del vehículo, los últimos cinco caracteres del número de título del
    vehículo y una dirección de correo electrónico válida.
- id: 328
  category: vehicle_information
  question: ¿Cuál es el documento de transferencia oficial requerido para registrar
    un vehículo nuevo en Carolina del Norte?
  choices:
    A: Una factura de venta notarizada
    B: El certificado de origen del fabricante
    C: Un certificado de autoseguro
    D: Un historial completo no certificado
  answer: B
  explanation: Antes de que un vehículo pueda ser registrado, se requiere la prueba
    de propiedad adecuada. Para vehículos nuevos, el certificado de origen del fabricante
    es el documento oficial de transferencia.
- id: 329
  category: driver_responsibility
  question: ¿Dentro de cuántos días debe el titular de una licencia o identificación
    actualizar su dirección física ante el DMV después de mudarse dentro de Carolina
    del Norte?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 120 días
  answer: C
  explanation: Dentro de los 60 días posteriores a una mudanza dentro de Carolina
    del Norte, el titular de una licencia o identificación debe actualizar su dirección
    física ante el DMV y obtener un duplicado de su licencia o identificación.
- id: 330
  category: penalties_and_points
  question: ¿Cuál es la sanción si se notifica al DMV que el propietario de un vehículo
    está operando un vehículo motorizado sin el seguro de responsabilidad civil adecuado?
  choices:
    A: El vehículo será incautado por 60 días
    B: La placa de matrícula del vehículo podría ser revocada por 30 días
    C: La licencia de conducir será suspendida permanentemente
    D: El propietario debe pagar una multa mínima de $1,000
  answer: B
  explanation: Si se notifica al DMV que el propietario de un vehículo está operando
    un vehículo motorizado sin el seguro de responsabilidad civil adecuado, la placa
    de matrícula del vehículo podría ser revocada por 30 días.
- id: 331
  category: vehicle_information
  question: ¿En Carolina del Norte, se puede utilizar un certificado de autoseguro
    como prueba de seguro de responsabilidad civil para flotas de al menos cuántos
    vehículos?
  choices:
    A: 5 o más vehículos
    B: 10 o más vehículos
    C: 15 o más vehículos
    D: 25 o más vehículos
  answer: D
  explanation: El seguro de responsabilidad civil puede presentarse en forma de una
    póliza de una compañía autorizada, efectivo o fianza depositada ante el Tesorero
    del Estado, o un certificado de autoseguro para flotas de 25 o más vehículos.
- id: 332
  category: vehicle_information
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad civil requerido
    para daños a la propiedad en un choque en Carolina del Norte?
  choices:
    A: $25,000
    B: $30,000
    C: $60,000
    D: $750,000
  answer: A
  explanation: El monto mínimo de seguro de responsabilidad civil requerido es de
    $25,000 para todos los daños a la propiedad en un choque.
- id: 333
  category: vehicle_information
  question: ¿De cuánto tiempo es el período de gracia que reconoce Carolina del Norte
    para las pólizas de seguro de responsabilidad civil vencidas?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: Carolina del Norte no reconoce un período de gracia.
  answer: D
  explanation: Carolina del Norte no reconoce un período de gracia. Un período de
    gracia es un acuerdo únicamente entre el asegurado y la compañía de seguros.
- id: 334
  category: vehicle_information
  question: ¿Dentro de cuántos días antes del vencimiento del registro de un vehículo
    debe este recibir una inspección de seguridad o de seguridad y emisiones?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Dentro de los 90 días anteriores al vencimiento del registro, todos
    los vehículos autopropulsados deben recibir una inspección de seguridad o de seguridad
    y emisiones para renovar su registro.
- id: 335
  category: driver_responsibility
  question: ¿Qué debe hacer para evitar una multa o sanción antes de terminar o cancelar
    el seguro de responsabilidad civil de su vehículo?
  choices:
    A: Notificar a la oficina de evaluación de su condado local.
    B: Entregar la placa de matrícula válida del vehículo.
    C: Solicitar un duplicado del título.
    D: Pagar la tarifa de Tag & Tax Together (Etiqueta e Impuestos Juntos).
  answer: B
  explanation: Para evitar una multa o sanción, entregue la placa de matrícula válida
    de un vehículo antes de la terminación o cancelación del seguro de responsabilidad
    civil.
- id: 336
  category: vehicle_information
  question: 'Al transferir la propiedad de un vehículo motorizado, la reasignación
    de la propiedad en el certificado de título debe realizarse en presencia de:'
  choices:
    A: Un inspector del DMV
    B: Un oficial de la ley
    C: Un Notario Público
    D: Un agente de seguros
  answer: C
  explanation: Para que la transferencia sea válida, la reasignación debe realizarse
    en presencia de un Notario Público y debe realizarse la entrega real del vehículo
    al nuevo propietario.
- id: 337
  category: vehicle_information
  question: ¿Bajo qué condiciones se pueden transferir las placas de matrícula de
    un vehículo a otro?
  choices:
    A: Si los vehículos son de la misma categoría, la propiedad está a nombre de la
      misma persona y la cobertura del seguro ha sido continua.
    B: Si el vehículo nuevo tiene menos de tres años y tiene menos de 70,000 millas.
    C: Si la transferencia se realiza dentro de los 15 días posteriores a la compra
      del vehículo nuevo.
    D: Las placas de matrícula nunca se pueden transferir entre vehículos en Carolina
      del Norte.
  answer: A
  explanation: Las placas de matrícula se pueden transferir de un vehículo a otro
    de la misma categoría, siempre que la propiedad esté a nombre de la misma persona
    y la cobertura del seguro haya sido continua.
- id: 338
  category: vehicle_information
  question: Si un certificado de título se pierde o es robado, ¿cuánto tiempo debe
    esperar antes de que se pueda emitir un duplicado del título después de recibir
    la solicitud y la tarifa?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: No se puede emitir un duplicado del título hasta 15 días después de
    que el DMV reciba la solicitud y la tarifa.
- id: 339
  category: vehicle_information
  question: ¿Qué requiere el programa "Tag & Tax Together" (Etiqueta e Impuestos Juntos)
    que hagan los propietarios de vehículos?
  choices:
    A: Pagar las etiquetas de renovación del registro y los impuestos sobre la propiedad
      del vehículo en un solo pago.
    B: Pagar la inspección del vehículo y la renovación del registro en un solo pago.
    C: Pagar por un duplicado del título y la transferencia de la placa al mismo tiempo.
    D: Pagar el seguro de responsabilidad civil y los impuestos sobre la propiedad
      del vehículo en un solo pago.
  answer: A
  explanation: El programa "Tag & Tax Together" requiere un solo pago para ambas facturas.
    Tanto las renovaciones de etiquetas como los pagos de impuestos deben pagarse
    en su totalidad para renovar el registro anual de un vehículo.
- id: 340
  category: vehicle_information
  question: ¿Quién es responsable de establecer el valor de un vehículo para fines
    de impuestos sobre la propiedad en Carolina del Norte?
  choices:
    A: La División de Vehículos Motorizados de Carolina del Norte (N.C. DMV)
    B: La oficina de evaluación del condado local
    C: La Oficina de Licencias y Robo del DMV
    D: La compañía de seguros del vehículo
  answer: B
  explanation: El DMV no participa en el establecimiento del valor de un vehículo
    para fines de impuestos sobre la propiedad. La oficina de evaluación del condado
    local determina el impuesto basándose en la marca y el modelo del vehículo registrado.
- id: 341
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos está exento de la ley "Tag & Tax Together"
    (Placa e Impuesto Juntos)?
  choices:
    A: Autos de pasajeros
    B: Ciclomotores (Mopeds)
    C: Camionetas ligeras
    D: Motocicletas
  answer: B
  explanation: 'La ley Tag & Tax Together cubre todos los vehículos de motor excepto:
    vehículos exentos de registro, casas prefabricadas, aulas y oficinas móviles,
    semirremolques registrados de forma plurianual, vehículos de motor propiedad de
    o arrendados por empresas de servicios públicos, remolques tipo "Park Model" y
    ciclomotores.'
- id: 342
  category: vehicle_information
  question: Si un vehículo no pasa su inspección anual, ¿dentro de cuántos días tiene
    derecho a ser inspeccionado nuevamente en la misma estación sin pagar otra tarifa
    de inspección?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Un vehículo que no pasa la inspección tiene derecho a ser inspeccionado
    nuevamente en la misma estación dentro de los 60 días sin pagar otra tarifa de
    inspección.
- id: 343
  category: vehicle_information
  question: ¿Un vehículo puede estar exento de una inspección de emisiones si es de
    carga ligera, funciona con gasolina, pertenece a los tres años de modelo más recientes
    y tiene menos de cuántas millas en el odómetro?
  choices:
    A: 30,000 millas
    B: 50,000 millas
    C: 70,000 millas
    D: 100,000 millas
  answer: C
  explanation: La ley exime de las pruebas de emisiones a los vehículos registrados
    o vendidos en Carolina del Norte si se encuentran dentro de los tres años de modelo
    más recientes y tienen menos de 70,000 millas en el odómetro.
- id: 344
  category: vehicle_information
  question: ¿Cuál es la transmitancia de luz permitida para las ventanas polarizadas
    en Carolina del Norte?
  choices:
    A: No menos del 20%
    B: No menos del 35%
    C: No menos del 50%
    D: No menos del 75%
  answer: B
  explanation: La transmitancia de luz permitida para las ventanas polarizadas no
    debe ser inferior al 35%.
- id: 345
  category: vehicle_information
  question: ¿Quién tiene la autoridad para cambiar las leyes y tarifas de vehículos
    de motor en Carolina del Norte?
  choices:
    A: El Gobernador
    B: La Asamblea General de Carolina del Norte
    C: El Comisionado del DMV
    D: El Departamento de Transporte
  answer: B
  explanation: El manual establece que las leyes y tarifas de vehículos de motor están
    sujetas a cambios por parte de la Asamblea General de Carolina del Norte.
- id: 346
  category: vehicle_information
  question: Según el manual, ¿qué está sujeto a cambios por parte de la Asamblea General
    de Carolina del Norte?
  choices:
    A: Solo las leyes de vehículos de motor
    B: Solo las tarifas del DMV
    C: Las leyes y tarifas de vehículos de motor
    D: Las regulaciones federales de carreteras
  answer: C
  explanation: El manual señala que las leyes y tarifas de vehículos de motor están
    sujetas a cambios por parte de la Asamblea General de Carolina del Norte.
- id: 347
  category: license_system
  question: ¿Dónde puede acceder al Manual del Conductor de Carolina del Norte en
    línea?
  choices:
    A: NCDOT.gov
    B: MyNCDMV.gov
    C: NCHighwayPatrol.org
    D: NorthCarolina.gov
  answer: B
  explanation: El Manual del Conductor de Carolina del Norte está disponible en línea
    en MyNCDMV.gov.
- id: 348
  category: license_system
  question: ¿Qué término de búsqueda se recomienda para encontrar el manual en MyNCDMV.gov?
  choices:
    A: Driving Rules (Reglas de conducción)
    B: License Guide (Guía de licencia)
    C: Driver Handbook (Manual del conductor)
    D: DMV Manual (Manual del DMV)
  answer: C
  explanation: El manual está disponible en línea en MyNCDMV.gov buscando "Driver
    Handbook" (Manual del conductor).
- id: 349
  category: license_system
  question: ¿En qué ciudad se encuentra la sede central del DMV de Carolina del Norte?
  choices:
    A: Raleigh
    B: Charlotte
    C: Rocky Mount
    D: Greensboro
  answer: C
  explanation: La sede central del DMV se encuentra en 1515 N. Church Street, Rocky
    Mount, NC 27804.
- id: 350
  category: license_system
  question: ¿Cuál es la dirección de la sede central del DMV de Carolina del Norte?
  choices:
    A: 1515 N. Church Street
    B: 100 E. Main Street
    C: 500 Capital Blvd
    D: 1200 DMV Drive
  answer: A
  explanation: La sede central del DMV se encuentra en 1515 N. Church Street, Rocky
    Mount, NC 27804.
- id: 351
  category: license_system
  question: ¿Cuál de los siguientes servicios se ofrece en la sede central del DMV
    en Rocky Mount?
  choices:
    A: Emisión de licencias de conducir
    B: Registro de vehículos
    C: Transferencias de títulos
    D: Ninguno de los anteriores
  answer: D
  explanation: El manual establece explícitamente que no se brindan servicios de licencia
    de conducir/identificación (ID) ni de título/registro en la ubicación de la sede
    central del DMV.
- id: 352
  category: vehicle_information
  question: Si necesita registrar un vehículo recién comprado, ¿debería visitar la
    sede central del DMV en 1515 N. Church Street?
  choices:
    A: Sí, es el centro de procesamiento principal
    B: Sí, pero solo de lunes a viernes
    C: No, los servicios de título y registro no se brindan en esta ubicación
    D: No, allí solo se procesan licencias de conducir
  answer: C
  explanation: El manual establece que no se brindan servicios de título/registro
    en la ubicación de la sede central del DMV.
- id: 353
  category: license_system
  question: ¿Puede obtener una tarjeta de identificación (ID) de Carolina del Norte
    en la sede central del DMV en Rocky Mount?
  choices:
    A: Sí, allí se emiten tarjetas de identificación
    B: No, los servicios de licencia de conducir e identificación (ID) no se brindan
      en esta ubicación
    C: Sí, pero solo para renovaciones
    D: Sí, pero solo para solicitantes por primera vez
  answer: B
  explanation: El manual señala claramente que no se brindan servicios de licencia
    de conducir/identificación (ID) en la ubicación de la sede central del DMV.
- id: 354
  category: driver_responsibility
  question: ¿Cómo fomenta el DMV de Carolina del Norte que los conductores se mantengan
    conectados y participen en línea?
  choices:
    A: Suscribiéndose a una revista mensual
    B: Manteniéndose activos en las redes sociales
    C: Llamando a una línea directa semanal
    D: Asistiendo a reuniones públicas
  answer: B
  explanation: El manual incluye una invitación a "MANTENERSE ACTIVO EN LAS REDES
    SOCIALES".
- id: 355
  category: vehicle_information
  question: ¿Cuál es la dirección web oficial proporcionada para el DMV de Carolina
    del Norte?
  choices:
    A: NCDMV.com
    B: MyNCDMV.gov
    C: NCDOT.gov
    D: DriveNC.org
  answer: B
  explanation: El sitio web oficial que figura en el manual es MyNCDMV.gov.
- id: 356
  category: license_system
  question: ¿Qué afirmación es verdadera con respecto al Manual del Conductor de Carolina
    del Norte?
  choices:
    A: Solo está disponible en formato impreso
    B: Se puede encontrar en línea en MyNCDMV.gov
    C: Se envía por correo a todos los conductores registrados anualmente
    D: El público en general no puede acceder a él
  answer: B
  explanation: 'El manual establece: "El Manual del Conductor de Carolina del Norte
    está disponible en línea en MyNCDMV.gov buscando Driver Handbook".'
- id: 357
  category: license_system
  question: Si un conductor necesita renovar su licencia de conducir en persona, ¿por
    qué la sede central del DMV en Rocky Mount es un destino incorrecto?
  choices:
    A: Está cerrada permanentemente al público
    B: Solo gestiona licencias de conducir comerciales
    C: No se brindan servicios de licencia de conducir ni de identificación (ID) en
      esta ubicación
    D: Requiere una cita con seis meses de antelación
  answer: C
  explanation: 'El texto establece explícitamente: "(No se brindan servicios de licencia
    de conducir/ID ni de título/registro en esta ubicación)" con respecto a la sede
    central del DMV.'
- id: 358
  category: vehicle_information
  question: ¿Cuál es la fecha de revisión del Manual del Conductor de Carolina del
    Norte que se proporciona en este texto?
  choices:
    A: Enero de 2024
    B: Mayo de 2025
    C: Diciembre de 2023
    D: Julio de 2025
  answer: B
  explanation: El texto indica que el manual fue "Revisado en mayo de 2025".
- id: 359
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  image: stop.png
- id: 360
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen con seguridad.
  image: yield.png
- id: 361
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  image: wrong_way.png
- id: 362
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal en blanco y negro de UNA VÍA (ONE WAY) con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  image: one_way_left.png
- id: 363
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  image: no_u_turn.png
- id: 364
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  image: no_left_turn.png
- id: 365
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  image: keep_right.png
- id: 366
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  image: speed_limit_25.png
- id: 367
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  image: deer_crossing.png
- id: 368
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  image: school_zone.png
- id: 369
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces ferroviarios. Significa que debe ceder el paso a los trenes.
    Si se acerca un tren, debe detenerse.
  image: railroad_crossbuck.png
- id: 370
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  image: sharp_turn_right.png
- id: 371
  category: signs_and_signals
  question: ¿Qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    gire primero en un sentido y luego en el otro.
  image: reverse_curve.png
- id: 372
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  image: winding_road.png
- id: 373
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  image: merge.png
- id: 374
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: Fin de la carretera
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  image: divided_highway.png
- id: 375
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso (yield)
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  image: stop_ahead.png
- id: 376
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    vigente pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  image: handicap_parking.png
- id: 377
  category: driver_responsibility
  question: Según el Manual del Conductor de Carolina del Norte, ¿cuál es el monto
    mínimo de seguro de responsabilidad civil requerido por lesiones a cualquier persona
    en un choque?
  choices:
    A: $15,000
    B: $25,000
    C: $30,000
    D: $50,000
  answer: C
  explanation: El manual establece que el monto mínimo de seguro de responsabilidad
    civil requerido es de "$30,000 por lesiones a cualquier persona en un choque".
- id: 378
  category: driver_responsibility
  question: ¿Cuál es el seguro de responsabilidad civil mínimo requerido para un vehículo
    motorizado comercial en Carolina del Norte?
  choices:
    A: $100,000
    B: $250,000
    C: $500,000
    D: $750,000
  answer: D
  explanation: El manual enumera los montos mínimos de seguro de responsabilidad civil,
    incluyendo "$750,000 para un vehículo motorizado comercial".
- id: 379
  category: driver_responsibility
  question: ¿Qué debe hacer para evitar una multa o sanción si va a terminar o cancelar
    su seguro de responsabilidad civil en Carolina del Norte?
  choices:
    A: Notificar al DMV dentro de los 30 días
    B: Entregar la placa de matrícula vigente del vehículo antes de la terminación
      o cancelación
    C: Enviar una notificación por escrito a su compañía de seguros
    D: Devolver su licencia de conducir al DMV
  answer: B
  explanation: 'El manual establece: "Para evitar una multa o sanción, entregue la
    placa de matrícula vigente de un vehículo antes de la terminación o cancelación
    del seguro de responsabilidad civil".'
- id: 380
  category: driver_responsibility
  question: ¿Cuándo debe reportar un choque a las autoridades policiales en Carolina
    del Norte?
  choices:
    A: Solo cuando alguien muere
    B: Cuando cualquier persona muere o resulta herida, o el daño total parece ascender
      a $1,000 o más
    C: Solo cuando el daño total excede los $5,000
    D: Solo cuando responden los servicios médicos de emergencia
  answer: B
  explanation: 'El manual establece: "La ley le exige que informe de inmediato al
    oficial o agencia de la ley más cercana sobre cualquier choque cuando alguna persona
    muera o resulte herida, o cuando el daño total a los vehículos y otras propiedades
    parezca ascender a $1,000 o más".'
- id: 381
  category: driver_responsibility
  question: ¿Qué tres cosas debe hacer si se ve involucrado en un choque en Carolina
    del Norte?
  choices:
    A: Llamar a su abogado, mover su vehículo e irse de la escena
    B: Proporcionar su nombre, dirección, número de licencia, número de registro y
      compañía de seguros; obtener lo mismo de los demás; y dejar la información para
      propietarios desconocidos con las autoridades policiales
    C: Tomar fotos, llamar a su compañía de seguros e ir al hospital
    D: Esperar a la policía, negarse a dar información hasta que llegue su abogado
      y mover su vehículo
  answer: B
  explanation: 'El manual enumera tres requisitos: proporcionar su información personal
    y de seguro, obtener la misma de los demás involucrados y, si no conoce a los
    ocupantes o al propietario de la propiedad dañada, anotar toda la información
    y entregarla al oficial de policía más cercano.'
- id: 382
  category: driver_responsibility
  question: ¿Cuánto tiempo tiene un nuevo residente de Carolina del Norte para obtener
    una licencia de conducir de Carolina del Norte?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: 'El manual establece: "Un nuevo residente tiene 60 días después de
    establecer su residencia para obtener una licencia o permiso de aprendizaje de
    Carolina del Norte".'
- id: 383
  category: driver_responsibility
  question: Si su dirección cambia de la dirección que figura en su licencia de conducir
    de Carolina del Norte, ¿dentro de cuántos días debe notificar al DMV?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: 'El manual establece: "Si su dirección cambia de la dirección que figura
    en su licencia de conducir, debe notificar a la división sobre el cambio dentro
    de los 60 días y obtener un duplicado de la licencia".'
- id: 384
  category: driver_responsibility
  question: Según la ley de Carolina del Norte, ¿cuál es el seguro de responsabilidad
    civil mínimo requerido para todas las lesiones personales en un solo choque?
  choices:
    A: $30,000
    B: $50,000
    C: $60,000
    D: $100,000
  answer: C
  explanation: El manual establece que el seguro de responsabilidad civil mínimo incluye
    "$60,000 por todas las lesiones personales en un choque".
- id: 385
  category: driver_responsibility
  question: ¿Qué puede suceder si se descubre que el propietario de un vehículo en
    Carolina del Norte está operando un vehículo motorizado sin el seguro de responsabilidad
    civil adecuado?
  choices:
    A: La licencia del conductor es revocada permanentemente
    B: La placa del vehículo podría ser revocada por 30 días
    C: El vehículo es confiscado de inmediato
    D: El propietario debe volver a tomar el examen de conducir
  answer: B
  explanation: 'El manual establece: "Si se notifica al DMV que el propietario de
    un vehículo está operando un vehículo motorizado sin el seguro de responsabilidad
    civil adecuado, la placa del vehículo podría ser revocada por 30 días, a menos
    que se proporcione una prueba de cobertura de seguro continua".'
- id: 386
  category: driver_responsibility
  question: ¿Cuál es la tarifa de restauración por una revocación de licencia relacionada
    con el alcohol en Carolina del Norte?
  choices:
    A: $83.50
    B: $100.00
    C: $167.25
    D: $250.00
  answer: C
  explanation: El manual enumera la "Tarifa de restauración (alcohol)" como $167.25,
    de la cual una "parte de $25" se destina al "Fondo estatal de pruebas químicas".
