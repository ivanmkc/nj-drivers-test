metadata:
  source: 2025 New Mexico Driver's Manual
  total_questions: 254
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In New Mexico, what is the minimum age to apply for an Instructional Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: B
  explanation: According to the New Mexico Driver's Manual, an individual must be
    at least 15 years of age to apply for an Instructional Permit and must be enrolled
    in or have completed a state-approved driver education program.
- id: 2
  category: license_system
  question: Under the New Mexico Graduated Licensing (GDL) system, how long must a
    driver hold an Instructional Permit before applying for a Provisional License?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: New Mexico law requires teen drivers to hold an Instructional Permit
    for a minimum of six months before they are eligible to move to the Provisional
    License stage.
- id: 3
  category: license_system
  question: To obtain a Provisional License in New Mexico, how many hours of supervised
    driving practice must be logged, including nighttime hours?
  choices:
    A: 40 total hours, 5 at night
    B: 50 total hours, 10 at night
    C: 60 total hours, 15 at night
    D: 30 total hours, 10 at night
  answer: B
  explanation: Applicants for a Provisional License must complete 50 hours of supervised
    driving, 10 of which must be at night, and these hours must be certified by a
    parent or guardian.
- id: 4
  category: license_system
  question: A New Mexico Provisional License holder is restricted from driving between
    which hours, unless for work or school?
  choices:
    A: 10:00 PM and 4:00 AM
    B: 11:00 PM and 5:00 AM
    C: Midnight and 5:00 AM
    D: Midnight and 6:00 AM
  answer: C
  explanation: Provisional License holders in New Mexico may not drive between the
    hours of midnight and 5:00 AM unless accompanied by a licensed adult or for specific
    reasons like employment or school activities.
- id: 5
  category: license_system
  question: Under New Mexico GDL laws, how many passengers under the age of 21 (who
    are not immediate family members) can a Provisional License holder have in the
    vehicle?
  choices:
    A: None
    B: No more than one
    C: No more than two
    D: No more than three
  answer: B
  explanation: A Provisional License holder may not have more than one passenger under
    the age of 21 who is not an immediate family member in the vehicle.
- id: 6
  category: license_system
  question: To graduate from a Provisional License to an Unrestricted License in New
    Mexico, the driver must have been citation-free for how many days prior to application?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: New Mexico requires that a driver must not have been convicted of a
    traffic violation in the 90 days immediately preceding the application for an
    Unrestricted License.
- id: 7
  category: license_system
  question: What is the minimum amount of property damage liability insurance required
    by law in New Mexico?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: B
  explanation: New Mexico's Mandatory Financial Responsibility Act requires minimum
    liability limits of $25,000 for bodily injury to or death of one person, $50,000
    for bodily injury to or death of two or more persons, and $10,000 for property
    damage (25/50/10).
- id: 8
  category: license_system
  question: If you move to a new address within New Mexico, how many days do you have
    to notify the Motor Vehicle Division (MVD)?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: New Mexico law requires that you notify the MVD of any change of address
    within 10 days of moving.
- id: 9
  category: license_system
  question: In New Mexico, your driver's license will be suspended for 12 months if
    you accumulate how many points within a 12-month period?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: If a driver accumulates 12 or more points on their driving record within
    a 12-month period, their license will be suspended for 12 months.
- id: 10
  category: license_system
  question: For drivers under the age of 21 in New Mexico, what is the Blood Alcohol
    Concentration (BAC) limit that results in a license revocation?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: B
  explanation: New Mexico has a 'Zero Tolerance' law for minors; a BAC of 0.02% or
    higher for a driver under 21 will result in license revocation.
- id: 11
  category: license_system
  question: What does the New Mexico 'Implied Consent Act' mean for drivers?
  choices:
    A: You agree to carry insurance at all times.
    B: You agree to a breath or blood test if a police officer suspects you are driving
      under the influence.
    C: You agree to allow passengers in your vehicle.
    D: You agree to yield to all emergency vehicles.
  answer: B
  explanation: The Implied Consent Act means that by driving in New Mexico, you have
    given consent to a chemical test of your breath or blood to determine alcohol
    or drug content.
- id: 12
  category: license_system
  question: Standard New Mexico driver's licenses are typically issued for which of
    the following periods?
  choices:
    A: 2 or 4 years
    B: 4 or 8 years
    C: 5 or 10 years
    D: Yearly
  answer: B
  explanation: In New Mexico, drivers have the option to renew their license for either
    a 4-year or an 8-year period, with fees adjusted accordingly.
- id: 13
  category: license_system
  question: To apply for a REAL ID-compliant New Mexico driver's license, how many
    documents proving New Mexico residency are required?
  choices:
    A: One
    B: Two
    C: Three
    D: None, if you have a birth certificate
  answer: B
  explanation: To obtain a REAL ID in New Mexico, you must provide proof of identification,
    proof of Social Security Number, and two documents showing New Mexico residency.
- id: 14
  category: license_system
  question: If a New Mexico driver is under 18 and receives a traffic citation, who
    is notified by the MVD?
  choices:
    A: The driver's school principal
    B: The driver's insurance company only
    C: The driver's parent or legal guardian
    D: No one is notified except the driver
  answer: C
  explanation: New Mexico law requires the MVD to notify the parent or legal guardian
    of any driver under age 18 who receives a traffic citation.
- id: 15
  category: license_system
  question: What is the minimum age a driver can obtain an Unrestricted License in
    New Mexico, provided they have met all GDL requirements?
  choices:
    A: 16 years old
    B: 16 and a half years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: A driver who has held a Provisional License for at least 12 months
    and met all other requirements (including 90 days citation-free) can obtain an
    Unrestricted License at age 16.5.
- id: 16
  category: license_system
  question: In New Mexico, first-time driver's license applicants between the ages
    of 18 and 24 must provide proof of having completed which specific program?
  choices:
    A: The National Safety Council Defensive Driving Course
    B: The 'None for the Road' DWI Awareness Class
    C: A 50-hour behind-the-wheel log
    D: The AAA Roadwise Driver program
  answer: B
  explanation: New Mexico law requires all first-time license applicants between 18
    and 24 to complete the 'None for the Road' DWI awareness program, which is administered
    by UNM.
- id: 17
  category: license_system
  question: To meet the minimum vision requirements for a New Mexico driver's license,
    an applicant must have at least what visual acuity in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to the New Mexico Driver Manual, applicants must have at
    least 20/40 vision in at least one eye, with or without corrective lenses.
- id: 18
  category: license_system
  question: If a New Mexico resident's driver's license has been expired for more
    than ______, they must retake both the written and road tests.
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: If a license has been expired for one year or more, the applicant must
    successfully complete the knowledge (written) and skills (road) tests again.
- id: 19
  category: license_system
  question: Which of the following is a requirement for obtaining a New Mexico Driving
    Authorization Card (DAC) that differs from a REAL ID license?
  choices:
    A: You must be at least 21 years old
    B: You do not need to provide proof of lawful status in the United States
    C: You do not need to take a road test
    D: It is valid for 10 years instead of 8
  answer: B
  explanation: The Driving Authorization Card (DAC) is available to New Mexico residents
    who cannot or do not wish to provide proof of lawful status or a Social Security
    number.
- id: 20
  category: license_system
  question: When applying for a New Mexico driver's license, how many documents are
    required to prove your Social Security Number for a REAL ID-compliant license?
  choices:
    A: One document
    B: Two documents
    C: Three documents
    D: None, it can be verbal
  answer: A
  explanation: For a REAL ID-compliant license in New Mexico, you must provide one
    document as proof of your Social Security Number (such as a Social Security card,
    W-2, or 1099 form).
- id: 21
  category: license_system
  question: If you change your name legally, New Mexico law requires you to apply
    for a corrected driver's license within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: A
  explanation: New Mexico law (Section 66-5-22 NMSA 1978) requires drivers to notify
    the MVD of a name change and obtain a replacement license within 10 days.
- id: 22
  category: license_system
  question: Under the New Mexico point system, if you accumulate between 6 and 11
    points within a 12-month period, what action does the MVD take?
  choices:
    A: Immediate 30-day suspension
    B: Mandatory driving school
    C: Sends a warning letter
    D: Requires a new road test
  answer: C
  explanation: The New Mexico MVD sends a warning letter to drivers who accumulate
    6 to 11 points within a year to alert them of their driving record status.
- id: 23
  category: license_system
  question: What is the standard fee for reinstating a New Mexico driver's license
    that was suspended for reasons other than DWI or child support?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: The general reinstatement fee for a suspended license in New Mexico
    is $25, though fees for DWI-related revocations are significantly higher.
- id: 24
  category: license_system
  question: In New Mexico, a person must be at least what age to apply for a Commercial
    Driver's License (CDL) to drive in interstate commerce?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: While a person can get a CDL for intrastate (within NM) driving at
    18, federal and state laws require a driver to be at least 21 to drive in interstate
    commerce.
- id: 25
  category: license_system
  question: New Mexico residents who are 75 years of age or older must renew their
    driver's license how often?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 4 years
    D: Every 8 years
  answer: A
  explanation: Drivers 75 years of age and older must renew their New Mexico driver's
    license annually, and the renewal fee is waived.
- id: 26
  category: license_system
  question: Which of the following is a mandatory requirement for any driver convicted
    of a DWI in New Mexico who wishes to obtain a restricted license to drive to work?
  choices:
    A: A letter from their employer
    B: An Ignition Interlock License
    C: A $500 cash bond
    D: A psychological evaluation
  answer: B
  explanation: New Mexico requires an Ignition Interlock License for any person whose
    driving privileges have been revoked for a DWI, allowing them to drive vehicles
    equipped with an interlock device.
- id: 27
  category: license_system
  question: How many days before your current New Mexico driver's license expires
    are you allowed to renew it?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: In New Mexico, you may renew your driver's license up to 90 days before
    the expiration date.
- id: 28
  category: license_system
  question: 'To obtain a motorcycle endorsement (Class M) in New Mexico, applicants
    under the age of 18 must:'
  choices:
    A: Have a parent ride with them for 50 hours
    B: Complete a basic motorcycle rider safety course
    C: Only pass a written test
    D: Wait until they have an unrestricted Class D license
  answer: B
  explanation: New Mexico requires applicants under 18 to successfully complete a
    motorcycle rider safety course approved by the MVD to receive a motorcycle endorsement.
- id: 29
  category: license_system
  question: If you are under 18 and applying for a New Mexico Instructional Permit,
    whose signature is required on the application?
  choices:
    A: Only the applicant's
    B: A school principal's
    C: A parent or legal guardian's
    D: A notary public's only
  answer: C
  explanation: For applicants under 18, a parent or legal guardian must sign the application,
    accepting financial responsibility for the minor's driving.
- id: 30
  category: license_system
  question: Which of the following is NOT a valid reason for the New Mexico MVD to
    refuse to issue or renew a driver's license?
  choices:
    A: Failure to pay child support
    B: Outstanding traffic warrants
    C: Lack of a high school diploma
    D: Medical conditions that make driving unsafe
  answer: C
  explanation: New Mexico does not require a high school diploma to hold a driver's
    license. However, child support delinquency, warrants, and medical safety concerns
    are legal grounds for refusal.
- id: 31
  category: driver_testing
  question: In addition to the 20/40 visual acuity requirement, what is the minimum
    field of vision required to pass the New Mexico vision screening?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 140 degrees
  answer: C
  explanation: To pass the New Mexico vision screening, an applicant must have a field
    of vision of at least 120 degrees in at least one eye or both eyes together.
- id: 32
  category: driver_testing
  question: If an applicant fails the New Mexico road (skills) test, how long must
    they wait before they are eligible to retake it?
  choices:
    A: 24 hours
    B: 3 days
    C: 1 week
    D: 30 days
  answer: C
  explanation: According to the New Mexico MVD, if you do not pass the road test,
    you must wait at least one week before you can take the test again.
- id: 33
  category: driver_testing
  question: What is the minimum passing score for the New Mexico written knowledge
    test?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: The New Mexico written test consists of 25 questions; an applicant
    must answer at least 20 correctly (80%) to pass.
- id: 34
  category: driver_testing
  question: New Mexico law requires a minimum of how much 'Bodily Injury' liability
    insurance for the death or injury of one person in any one accident?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The Mandatory Financial Responsibility Act requires minimum bodily
    injury coverage of $25,000 for one person and $50,000 for two or more people.
- id: 35
  category: driver_testing
  question: Under the New Mexico point system, how many points are assessed against
    your driving record for speeding 26 mph or more over the posted speed limit?
  choices:
    A: 3 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: D
  explanation: Speeding 26 mph or more over the limit is one of the highest point
    violations in New Mexico, resulting in 8 points.
- id: 36
  category: driver_testing
  question: How many points are added to a New Mexico driving record for the violation
    of 'Passing a school bus' while its red lights are flashing and stop arm is extended?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Passing a school bus that is stopped to pick up or let off children
    is a serious offense in New Mexico and carries a 6-point penalty.
- id: 37
  category: driver_testing
  question: In New Mexico, 'Reckless Driving' carries a penalty of how many points
    on your driving record?
  choices:
    A: 3 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Reckless driving is categorized as a 6-point violation in the New Mexico
    point system.
- id: 38
  category: driver_testing
  question: If you legally change your name (e.g., through marriage or court order),
    you must apply for a replacement New Mexico license within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: New Mexico law requires you to notify the MVD and update your license
    within 30 days of a legal name change.
- id: 39
  category: driver_testing
  question: The 'None for the Road' DWI awareness course, required for certain New
    Mexico applicants, is administered by which institution?
  choices:
    A: New Mexico State Police
    B: University of New Mexico (UNM)
    C: Department of Transportation
    D: MVD Headquarters
  answer: B
  explanation: The 'None for the Road' DWI awareness course is a self-study program
    administered by the University of New Mexico Continuing Education department.
- id: 40
  category: driver_testing
  question: If you pass the vision screening only while wearing glasses or contact
    lenses, which restriction code will be placed on your New Mexico license?
  choices:
    A: Restriction A
    B: Restriction B
    C: Restriction C
    D: Restriction G
  answer: B
  explanation: Restriction B is the standard code used in New Mexico to indicate that
    the driver is required to wear corrective lenses while operating a vehicle.
- id: 41
  category: driver_testing
  question: Before beginning the New Mexico road test, the examiner will conduct a
    vehicle safety inspection. Which of the following would cause the test to be postponed?
  choices:
    A: A missing radio
    B: Broken turn signals or brake lights
    C: A small dent in the bumper
    D: Empty windshield washer fluid
  answer: B
  explanation: The vehicle used for the road test must be in safe operating condition.
    Non-functioning turn signals or brake lights are safety hazards that will result
    in the postponement of the test.
- id: 42
  category: driver_testing
  question: For drivers under age 18, who has the legal authority to request that
    the MVD cancel the minor's license or permit at any time?
  choices:
    A: The minor's school principal
    B: The minor's insurance agent
    C: The person who signed the parental consent form
    D: Any adult relative over age 21
  answer: C
  explanation: The person who signs the financial responsibility/consent form for
    a minor can withdraw their consent at any time by filing a written request, which
    leads to the cancellation of the minor's driving privileges.
- id: 43
  category: driver_testing
  question: If a New Mexico resident is on active military duty outside the state,
    their driver's license remains valid until how many days after their discharge
    from the service?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New Mexico provides an extension for active-duty military personnel;
    their license remains valid until 30 days after they are discharged or return
    to the state.
- id: 44
  category: driver_testing
  question: What is the fee for the 'None for the Road' DWI awareness self-study course
    required for first-time New Mexico licensees between ages 18 and 24?
  choices:
    A: $10
    B: $25
    C: $50
    D: $75
  answer: B
  explanation: The 'None for the Road' course fee is $25, which covers the study materials
    and the administration of the program by UNM.
- id: 45
  category: driver_testing
  question: Before beginning the New Mexico road skills test, what documents must
    the applicant provide for the vehicle being used?
  choices:
    A: The vehicle's title and a bill of sale
    B: Valid vehicle registration and proof of current liability insurance
    C: A notarized letter from the vehicle owner
    D: The vehicle's maintenance records for the last 12 months
  answer: B
  explanation: To take the road test in New Mexico, you must provide a vehicle that
    is in safe operating condition, along with its valid registration and proof of
    current liability insurance.
- id: 46
  category: driver_testing
  question: To pass the New Mexico written knowledge exam, an applicant must correctly
    answer at least how many questions out of 25?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '22'
  answer: B
  explanation: The New Mexico MVD written test consists of 25 questions, and a passing
    score is 72%, which requires correctly answering at least 18 questions.
- id: 47
  category: driver_testing
  question: If you are convicted of speeding 16 to 25 miles per hour over the posted
    speed limit in New Mexico, how many points will be added to your driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: New Mexico's point system assigns 5 points for speeding 16-25 mph over
    the limit. Speeding 6-15 mph over results in 3 points.
- id: 48
  category: driver_testing
  question: New residents to New Mexico must register their vehicles within how many
    days of establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to New Mexico law, new residents are required to register
    their vehicles and obtain a New Mexico license plate within 30 days of establishing
    residency.
- id: 49
  category: driver_testing
  question: During the New Mexico road skills test, which of the following actions
    will result in an immediate failure?
  choices:
    A: Failing to use a turn signal once
    B: Striking a curb or sidewalk
    C: Adjusting the mirrors before starting
    D: Driving 2 mph under the speed limit
  answer: B
  explanation: Striking a curb, sidewalk, or any other object, as well as committing
    any traffic violation or dangerous maneuver, results in an immediate failure of
    the New Mexico road test.
- id: 50
  category: driver_testing
  question: Which specific maneuver is a standard requirement of the New Mexico road
    skills test for a Class D license?
  choices:
    A: High-speed merging
    B: Parallel parking
    C: Off-road recovery
    D: Driving in a roundabout
  answer: B
  explanation: Parallel parking is a mandatory component of the New Mexico road skills
    test to demonstrate the driver's ability to control the vehicle in tight spaces.
- id: 51
  category: driver_testing
  question: In New Mexico, how many points are assessed for 'Failure to Yield' the
    right-of-way?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: B
  explanation: Failure to yield the right-of-way in New Mexico results in 3 points
    being added to your driving record.
- id: 52
  category: driver_testing
  question: What is the point penalty in New Mexico for 'Following Too Closely' (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: Following too closely, or tailgating, is a 2-point violation in the
    state of New Mexico.
- id: 53
  category: driver_testing
  question: When renewing a New Mexico driver's license, how many days before the
    expiration date are you permitted to apply for renewal?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: New Mexico residents may renew their driver's license up to 90 days
    before the current license expires.
- id: 54
  category: driver_testing
  question: If a vehicle used for the New Mexico road test has a windshield crack
    that obstructs the driver's view, what will happen?
  choices:
    A: The examiner will ignore it if it is small
    B: The applicant will be allowed to take the test but must fix it later
    C: The vehicle will be rejected, and the test will be postponed
    D: The applicant will receive an automatic 10-point deduction
  answer: C
  explanation: The vehicle used for the road test must be in safe operating condition.
    Cracks in the windshield that obstruct the driver's or examiner's view are grounds
    for rejecting the vehicle for the test.
- id: 55
  category: driver_testing
  question: In New Mexico, how many points are assessed for a conviction of 'Failure
    to Signal' when turning or changing lanes?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failure to use a turn signal when required results in 2 points being
    added to your New Mexico driving record.
- id: 56
  category: driver_responsibility
  question: In New Mexico, you must immediately notify the police of an accident if
    it results in injury, death, or property damage exceeding what amount?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: According to the New Mexico Driver's Manual, any accident resulting
    in bodily injury, death, or property damage of $500 or more must be reported to
    the police immediately.
- id: 57
  category: driver_responsibility
  question: Under the New Mexico Mandatory Financial Responsibility Act, what is the
    minimum amount of bodily injury liability insurance required for one person?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: D
  explanation: New Mexico law requires a minimum of $25,000 for bodily injury to or
    death of one person in any one accident.
- id: 58
  category: driver_responsibility
  question: When you purchase a vehicle from a private party in New Mexico, how many
    days do you have to register the vehicle and transfer the title?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: In New Mexico, you must apply for a certificate of title and registration
    within 30 days of purchasing a vehicle from a private party.
- id: 59
  category: driver_responsibility
  question: 'A first-time DWI conviction in New Mexico can result in a jail sentence
    of up to:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: A first-time DWI conviction is a misdemeanor that can result in a jail
    sentence of up to 90 days, along with fines and other penalties.
- id: 60
  category: driver_responsibility
  question: In New Mexico, for how long must a driver convicted of a first-offense
    DWI use an ignition interlock device?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: New Mexico law requires all first-time DWI offenders to install and
    use an ignition interlock device for a period of one year.
- id: 61
  category: driver_responsibility
  question: What is the maximum fine for a first-offense littering conviction from
    a vehicle in New Mexico?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Littering in New Mexico is a petty misdemeanor and can result in a
    fine of up to $1,000 and/or up to 90 days in jail.
- id: 62
  category: driver_responsibility
  question: 'Under the New Mexico Parental Responsibility Act, your driver''s license
    can be suspended for:'
  choices:
    A: Failing to attend a parent-teacher conference
    B: Failure to pay child support
    C: Allowing a minor to drive without a permit
    D: Failing to sign a child's report card
  answer: B
  explanation: The Parental Responsibility Act allows the MVD to suspend the driver's
    license of any person who is not in compliance with a child support order.
- id: 63
  category: driver_responsibility
  question: If you fail to renew your vehicle registration in New Mexico within 30
    days of its expiration, what is the late penalty fee?
  choices:
    A: $10 flat fee
    B: 25% of the registration fee
    C: 50% of the registration fee
    D: 75% of the registration fee
  answer: D
  explanation: New Mexico law imposes a penalty of 75% of the registration fee if
    the renewal is more than 30 days late.
- id: 64
  category: driver_responsibility
  question: If you are involved in an accident in New Mexico and the police do not
    investigate, you must file a written report (Form MVD-10279) within how many days?
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: If an accident is not investigated by a law enforcement officer and
    results in injury or damage over $500, you must file a written report with the
    MVD within 5 days.
- id: 65
  category: driver_responsibility
  question: 'In New Mexico, a conviction for ''Open Container'' (first offense) can
    result in a fine of up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: A first-offense open container violation is a misdemeanor punishable
    by a fine of up to $500 and/or up to 90 days in jail.
- id: 66
  category: driver_responsibility
  question: How many points are assessed for 'Following too closely' (tailgating)
    in New Mexico?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Following too closely is a 3-point offense on the New Mexico driving
    record.
- id: 67
  category: driver_responsibility
  question: In New Mexico, what is the minimum liability insurance coverage required
    for bodily injury to or death of two or more persons in any one accident?
  choices:
    A: $30,000
    B: $40,000
    C: $50,000
    D: $60,000
  answer: C
  explanation: The New Mexico Mandatory Financial Responsibility Act requires a minimum
    of $50,000 for bodily injury to or death of two or more persons in any one accident.
- id: 68
  category: driver_responsibility
  question: If you are involved in a motor vehicle accident in New Mexico that results
    in property damage, at what dollar amount must the accident be reported to the
    police immediately?
  choices:
    A: Over $100
    B: Over $250
    C: Over $500
    D: Over $1,000
  answer: C
  explanation: According to New Mexico law (66-7-207), any accident resulting in bodily
    injury, death, or property damage of $500 or more must be reported to the police
    immediately.
- id: 69
  category: driver_responsibility
  question: What is the maximum fine for a first-time offense of failing to provide
    evidence of financial responsibility (insurance) in New Mexico?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: A first-time conviction for driving without insurance in New Mexico
    can result in a fine of up to $300 and the suspension of the vehicle's registration.
- id: 70
  category: driver_responsibility
  question: If you change your name due to marriage or a court order, how many days
    do you have to notify the New Mexico MVD and obtain a corrected license?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: New Mexico law requires drivers to notify the MVD of a name or address
    change within 10 days.
- id: 71
  category: driver_responsibility
  question: In New Mexico, how many points are assessed against your driving record
    for a conviction of 'Reckless Driving'?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Reckless driving is considered a serious offense in New Mexico and
    results in 6 points being added to the driver's record.
- id: 72
  category: driver_responsibility
  question: Points assessed against a New Mexico driver's license for traffic violations
    generally remain on the driving record for how long?
  choices:
    A: 6 months
    B: 12 months
    C: 24 months
    D: 36 months
  answer: B
  explanation: In New Mexico, points for most traffic violations are removed from
    the driving record 12 months after the date of the violation.
- id: 73
  category: driver_responsibility
  question: Which of the following is true regarding the registration of a vehicle
    in New Mexico?
  choices:
    A: The registration certificate must be kept in the vehicle or carried by the
      driver.
    B: The registration certificate should be kept at home in a safe place.
    C: Only the insurance card is required to be in the vehicle.
    D: Registration is only required for vehicles driven on interstate highways.
  answer: A
  explanation: New Mexico law requires that the registration certificate be carried
    in the vehicle or by the person driving the vehicle at all times.
- id: 74
  category: driver_responsibility
  question: If a New Mexico driver is convicted of a DUI, they are required to obtain
    which of the following to continue driving legally during their revocation period?
  choices:
    A: A restricted work permit
    B: An Ignition Interlock License
    C: A temporary paper permit
    D: A hardship waiver
  answer: B
  explanation: New Mexico requires all DUI offenders to obtain an Ignition Interlock
    License and install an interlock device in any vehicle they drive.
- id: 75
  category: driver_responsibility
  question: In New Mexico, what happens if you fail to appear (FTA) in court for a
    traffic citation?
  choices:
    A: Your insurance rates will automatically double.
    B: The MVD will suspend your driving privilege.
    C: The points for the violation will be doubled.
    D: Nothing happens until you try to renew your license.
  answer: B
  explanation: Failure to appear in court or failure to pay a fine for a traffic citation
    in New Mexico will result in the suspension of your driver's license.
- id: 76
  category: driver_responsibility
  question: 'Under New Mexico''s ''Open Container'' law, it is illegal to:'
  choices:
    A: Have any alcoholic beverage in the trunk of the car.
    B: Have an open container of alcohol in the glove compartment.
    C: Transport unopened beer in the passenger area.
    D: Have an open container of alcohol in the passenger area of a motor vehicle
      on a public highway.
  answer: D
  explanation: New Mexico law prohibits any person from having an open container of
    an alcoholic beverage in the passenger area of a motor vehicle while on a public
    highway.
- id: 77
  category: driver_responsibility
  question: If you are a New Mexico resident and you buy a vehicle from a dealer,
    who is typically responsible for submitting the title and registration application?
  choices:
    A: The buyer must always do it personally.
    B: The dealer is required to submit the documents to the MVD.
    C: The local police department.
    D: The insurance company.
  answer: B
  explanation: In New Mexico, when a vehicle is purchased from a licensed dealer,
    the dealer is required by law to handle the title and registration paperwork for
    the buyer.
- id: 78
  category: driver_responsibility
  question: In New Mexico, if your license is suspended due to the accumulation of
    12 points in 12 months, how long is the suspension period?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: If a driver accumulates 12 or more points within a 12-month period,
    their New Mexico driver's license will be suspended for a period of 12 months.
- id: 79
  category: safe_driving_rules
  question: In New Mexico, what is the standard speed limit in a school zone when
    children are present or when indicated by signs?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: According to the New Mexico Driver's Manual, the speed limit in a school
    zone is 15 mph unless otherwise posted.
- id: 80
  category: safe_driving_rules
  question: When parking your vehicle near a fire hydrant in New Mexico, what is the
    minimum distance you must maintain?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: New Mexico law prohibits parking within 15 feet of a fire hydrant.
- id: 81
  category: safe_driving_rules
  question: In New Mexico, you are prohibited from parking within how many feet of
    a stop sign, yield sign, or traffic control signal?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Under New Mexico law, you may not park within 30 feet of any flashing
    beacon, stop sign, yield sign, or traffic control signal located at the side of
    a roadway.
- id: 82
  category: safe_driving_rules
  question: According to the New Mexico 'Move Over' law, what must a driver do when
    approaching a stationary emergency vehicle with its lights flashing on a multi-lane
    highway?
  choices:
    A: Stop completely until the emergency vehicle leaves.
    B: Maintain speed but honk to alert the emergency responders.
    C: Move into a lane not adjacent to the vehicle, or slow down if changing lanes
      is unsafe.
    D: Speed up to pass the area as quickly as possible.
  answer: C
  explanation: New Mexico's Move Over law requires drivers to move to a lane not adjacent
    to the emergency vehicle if possible; if not, they must slow down and proceed
    with caution.
- id: 83
  category: safe_driving_rules
  question: When a school bus is stopped on a highway with a physical median or divider,
    which vehicles are required to stop for the bus's flashing red lights?
  choices:
    A: All vehicles in both directions.
    B: Only vehicles traveling in the same direction as the bus.
    C: Only vehicles traveling in the opposite direction of the bus.
    D: No vehicles are required to stop if there is a median.
  answer: B
  explanation: In New Mexico, if a bus is stopped on a divided highway with a physical
    median, only traffic following the bus must stop. Traffic on the other side of
    the median does not need to stop.
- id: 84
  category: safe_driving_rules
  question: When passing a bicycle in New Mexico, what is the minimum legal distance
    a motorist must maintain between their vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: New Mexico law requires motorists to leave at least three feet of space
    when passing a bicycle.
- id: 85
  category: safe_driving_rules
  question: What is the penalty for speeding in a posted construction zone in New
    Mexico when workers are present?
  choices:
    A: A flat $500 fine.
    B: Mandatory license suspension.
    C: Fines are doubled.
    D: Community service is required.
  answer: C
  explanation: In New Mexico, traffic fines are doubled for violations occurring in
    a designated highway work zone when workers are present.
- id: 86
  category: safe_driving_rules
  question: How many feet before turning must you activate your turn signal in New
    Mexico?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: New Mexico law requires drivers to signal their intention to turn at
    least 100 feet before the actual turn.
- id: 87
  category: safe_driving_rules
  question: 'In New Mexico, it is illegal to make a U-turn on a curve or near the
    crest of a hill if your vehicle cannot be seen by other drivers approaching from
    either direction within:'
  choices:
    A: 500 feet
    B: 750 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: New Mexico statute 66-7-323 states that U-turns are prohibited on curves
    or hills where visibility is less than 1,000 feet in either direction.
- id: 88
  category: safe_driving_rules
  question: 'A driver in New Mexico must file an accident report with the police if
    the crash results in injury, death, or property damage exceeding:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,500
  answer: B
  explanation: New Mexico law requires an immediate report to the police for any accident
    involving injury, death, or property damage of $500 or more.
- id: 89
  category: safe_driving_rules
  question: When driving at night in New Mexico, you must dim your high-beam headlights
    when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: New Mexico law requires drivers to dim their high beams when an oncoming
    vehicle is within 500 feet.
- id: 90
  category: safe_driving_rules
  question: When parking a vehicle headed downhill on a two-way street with a curb,
    how should the front wheels be turned?
  choices:
    A: Toward the curb.
    B: Away from the curb.
    C: Parallel to the curb.
    D: To the left.
  answer: A
  explanation: When parking downhill, you should turn your wheels toward the curb
    so that if the vehicle rolls, it will roll into the curb rather than into traffic.
- id: 91
  category: safe_driving_rules
  question: In New Mexico, what is the 'Three-Second Rule' used for?
  choices:
    A: The time allowed to pass through a yellow light.
    B: The time you should wait after a light turns green.
    C: Determining a safe following distance behind the vehicle in front of you.
    D: The time allowed to remain stopped at a stop sign.
  answer: C
  explanation: The New Mexico Driver's Manual recommends a three-second following
    distance to ensure you have enough time to react to hazards.
- id: 92
  category: safe_driving_rules
  question: Under New Mexico law, when are you allowed to turn right on a red light?
  choices:
    A: Never.
    B: Only if there is a green arrow.
    C: After coming to a complete stop and yielding to pedestrians and cross-traffic,
      unless a sign prohibits it.
    D: Only during daylight hours.
  answer: C
  explanation: In New Mexico, you may turn right on red after a full stop and yielding
    to traffic and pedestrians, provided there is no sign prohibiting the turn.
- id: 93
  category: safe_driving_rules
  question: In New Mexico, what is the maximum speed limit for a business or residential
    district unless otherwise posted?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: According to New Mexico state law (66-7-301 NMSA), the speed limit
    in any business or residence district is 25 mph unless a different speed is posted.
- id: 94
  category: safe_driving_rules
  question: Under New Mexico law, how many feet must you park away from a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: New Mexico law prohibits parking within 15 feet of a fire hydrant.
- id: 95
  category: safe_driving_rules
  question: When passing another vehicle in New Mexico, you must not come within how
    many feet of an oncoming vehicle before returning to your lane?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: When passing, you must return to your lane before coming within 200
    feet of any vehicle approaching from the opposite direction.
- id: 96
  category: safe_driving_rules
  question: According to the New Mexico Driver's Manual, what is the minimum distance
    a motorist must maintain when passing a bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: C
  explanation: New Mexico law requires motorists to give bicyclists at least 5 feet
    of space when passing.
- id: 97
  category: safe_driving_rules
  question: In New Mexico, what happens to the fines for speeding violations committed
    in a designated highway construction or maintenance zone?
  choices:
    A: They are waived for first offenses
    B: They are reduced by half
    C: They are doubled
    D: They remain the same as standard fines
  answer: C
  explanation: Under New Mexico law, fines for speeding are doubled when the violation
    occurs within a posted construction or maintenance zone where workers are present.
- id: 98
  category: safe_driving_rules
  question: 'New Mexico law requires you to turn on your headlights from:'
  choices:
    A: Sunset to sunrise
    B: One hour after sunset to one hour before sunrise
    C: 1/2 hour after sunset to 1/2 hour before sunrise
    D: Whenever you use your windshield wipers
  answer: C
  explanation: Headlights must be used in New Mexico from 1/2 hour after sunset to
    1/2 hour before sunrise, and at any other time when visibility is less than 500
    feet.
- id: 99
  category: safe_driving_rules
  question: What is the maximum speed limit on most interstate highways in rural New
    Mexico?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: C
  explanation: The maximum speed limit on rural interstate highways in New Mexico
    is 75 mph unless otherwise posted.
- id: 100
  category: safe_driving_rules
  question: 'In New Mexico, you do NOT have to stop for a school bus with its red
    lights flashing and stop arm extended if:'
  choices:
    A: You are traveling in the opposite direction on a divided highway with a physical
      median
    B: You are in a hurry and the bus has been stopped for more than 5 minutes
    C: The bus is stopped in a residential area
    D: You are traveling in the opposite direction on a two-lane road
  answer: A
  explanation: Drivers traveling in the opposite direction on a divided highway with
    a physical barrier or median (such as a concrete wall or unpaved strip) are not
    required to stop for a school bus.
- id: 101
  category: safe_driving_rules
  question: New Mexico's 'Move Over' law requires drivers to do what when approaching
    an emergency vehicle with flashing lights on the shoulder?
  choices:
    A: Stop immediately in the travel lane
    B: Change lanes away from the vehicle if safe, or slow down significantly if a
      lane change is not possible
    C: Maintain speed but honk to alert the emergency workers
    D: Speed up to pass the area as quickly as possible
  answer: B
  explanation: The Move Over law requires drivers to move into a non-adjacent lane
    if safe to do so. If not safe, the driver must slow down and be prepared to stop.
- id: 102
  category: safe_driving_rules
  question: In New Mexico, it is illegal to park within how many feet of a crosswalk
    at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Parking is prohibited within 20 feet of a crosswalk at an intersection
    in New Mexico.
- id: 103
  category: safe_driving_rules
  question: If your vehicle's turn signals are not working, what is the correct hand
    signal for a left turn in New Mexico?
  choices:
    A: Arm extended upward
    B: Arm extended downward
    C: Arm extended horizontally out the window
    D: Waving the arm in a circular motion
  answer: C
  explanation: To signal a left turn using hand signals, the driver should extend
    their left arm horizontally out the window.
- id: 104
  category: safe_driving_rules
  question: 'Under normal weather and road conditions, the New Mexico Driver''s Manual
    recommends a following distance of at least:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: New Mexico recommends the 'three-second rule' to maintain a safe following
    distance behind the vehicle in front of you.
- id: 105
  category: defensive_driving
  question: According to the New Mexico Driver's Manual, what is the recommended following
    distance behind the vehicle in front of you under normal driving conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The New Mexico Driver's Manual recommends using the 'three-second rule'
    to maintain a safe following distance under normal conditions.
- id: 106
  category: defensive_driving
  question: To be a safe driver in New Mexico, how far ahead should you scan the road
    to identify potential hazards?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 to 40 seconds
  answer: B
  explanation: New Mexico's defensive driving guidelines state that you should look
    ahead 10 to 15 seconds to allow enough time to react to changing traffic conditions.
- id: 107
  category: defensive_driving
  question: At what speed can hydroplaning (tires losing contact with the road due
    to water) begin in New Mexico's rainy conditions?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Only above 65 mph
    D: At any speed over 20 mph
  answer: A
  explanation: The New Mexico Driver's Manual warns that hydroplaning can start at
    speeds as low as 35 mph, and at 55 mph, tires may lose all contact with the road.
- id: 108
  category: defensive_driving
  question: Under New Mexico law, when are you required to have your headlights turned
    on?
  choices:
    A: Only between sunset and sunrise
    B: Whenever you cannot see clearly for at least 500 feet
    C: Only when it is raining
    D: Only when driving on highways
  answer: B
  explanation: New Mexico law requires headlights to be on from 1/2 hour after sunset
    to 1/2 hour before sunrise, or whenever visibility is less than 500 feet due to
    weather or light conditions.
- id: 109
  category: defensive_driving
  question: If you encounter a dust storm while driving in New Mexico, which is the
    safest defensive driving action to take?
  choices:
    A: Turn on your high beams and continue at a slower speed
    B: Stop in the middle of the lane and turn on hazard lights
    C: Pull off the road as far as possible, turn off all lights, and take your foot
      off the brake
    D: Speed up to get through the dust cloud quickly
  answer: C
  explanation: In New Mexico dust storms, you should pull off the road, turn off all
    lights (including brake lights) so other drivers don't follow you off the road
    thinking you are still in a lane, and wait for visibility to improve.
- id: 110
  category: defensive_driving
  question: When driving on New Mexico mountain roads in winter, which areas are most
    likely to hide 'black ice'?
  choices:
    A: Open fields next to the road
    B: The middle of intersections
    C: Shaded areas and bridges
    D: Steep uphill grades
  answer: C
  explanation: The New Mexico Driver's Manual notes that bridges and shaded areas
    freeze first and stay frozen longer, often hiding dangerous black ice.
- id: 111
  category: defensive_driving
  question: If your vehicle begins to skid on a slippery New Mexico road, what is
    the correct defensive driving response?
  choices:
    A: Brake hard to stop the movement
    B: Turn the steering wheel in the opposite direction of the skid
    C: Stay off the brake and turn the steering wheel in the direction you want the
      vehicle to go
    D: Accelerate slightly to regain traction
  answer: C
  explanation: The New Mexico Driver's Manual instructs drivers to stay off the brakes
    and steer in the direction they want the front of the vehicle to go to recover
    from a skid.
- id: 112
  category: defensive_driving
  question: When driving in heavy fog in New Mexico, which light setting should you
    use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    fog and cause glare, making it harder to see.
- id: 113
  category: defensive_driving
  question: To avoid 'highway hypnosis' during long trips across New Mexico, how often
    does the state manual recommend taking a break?
  choices:
    A: Every hour
    B: Every 2 hours or every 100 miles
    C: Every 4 hours
    D: Only when you feel sleepy
  answer: B
  explanation: The New Mexico Driver's Manual suggests taking a break every 2 hours
    or every 100 miles to stay alert and avoid fatigue.
- id: 114
  category: defensive_driving
  question: 'In New Mexico, if you are driving and a tire suddenly blows out, you
    should:'
  choices:
    A: Slam on the brakes immediately
    B: Hold the steering wheel tightly and keep the vehicle going straight
    C: Shift into neutral immediately
    D: Turn sharply toward the shoulder
  answer: B
  explanation: If a tire blows out, you should hold the steering wheel firmly, keep
    the vehicle straight, and gradually slow down by taking your foot off the gas;
    do not brake until the vehicle is under control.
- id: 115
  category: defensive_driving
  question: When entering a roundabout in New Mexico, to whom must you yield the right-of-way?
  choices:
    A: Traffic entering from the right
    B: Traffic already in the roundabout
    C: No one; you have the right of way when entering
    D: Only to emergency vehicles
  answer: B
  explanation: In New Mexico roundabouts, entering traffic must always yield to the
    traffic already circulating in the roundabout.
- id: 116
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly in New Mexico,
    how far ahead should you scan the road?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 seconds
  answer: B
  explanation: The New Mexico Driver's Manual states that scanning 10 to 15 seconds
    ahead allows you to see hazards early and adjust your speed or position safely.
- id: 117
  category: defensive_driving
  question: 'When following another vehicle at night in New Mexico, you must dim your
    high beams when you are within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: Under New Mexico law, you must dim your high beams when following another
    vehicle within 200 feet so that your lights do not reflect in their rearview mirror.
- id: 118
  category: defensive_driving
  question: At what speed can hydroplaning begin on wet New Mexico roads when tires
    lose contact with the pavement?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Only above 65 mph
    D: Exactly 50 mph
  answer: A
  explanation: According to the New Mexico Driver's Manual, hydroplaning can begin
    at speeds as low as 35 mph in heavy rain, and tires may lose all contact with
    the road at 55 mph.
- id: 119
  category: defensive_driving
  question: 'When passing another vehicle on a two-lane road in New Mexico, you should
    not return to your lane until:'
  choices:
    A: You are 10 feet ahead of the vehicle.
    B: You can see both headlights of the passed vehicle in your rearview mirror.
    C: The other driver honks their horn.
    D: You have cleared their front bumper by one car length.
  answer: B
  explanation: The New Mexico Driver's Manual advises that you should see both headlights
    of the vehicle you passed in your rearview mirror before merging back into the
    lane.
- id: 120
  category: defensive_driving
  question: If your brakes stop working while driving, what is the first defensive
    action recommended by the New Mexico Driver's Manual?
  choices:
    A: Turn off the engine immediately.
    B: Shift the car into neutral.
    C: Pump the brake pedal several times to build up pressure.
    D: Jump out of the vehicle.
  answer: C
  explanation: If your brakes fail, you should pump the brake pedal several times.
    If that doesn't work, use the parking brake slowly and shift to a lower gear.
- id: 121
  category: defensive_driving
  question: When driving on New Mexico mountain roads in winter, why is 'black ice'
    particularly dangerous?
  choices:
    A: It is only found on dirt roads.
    B: It is invisible to the driver and makes the road look wet rather than icy.
    C: It only forms when the temperature is above 40 degrees.
    D: It provides extra traction for snow tires.
  answer: B
  explanation: Black ice is a thin, transparent layer of ice that is difficult to
    see, often appearing as a wet spot on the road, making it a major hazard in New
    Mexico winters.
- id: 122
  category: defensive_driving
  question: In New Mexico, a driver can be charged with 'Aggravated DWI' if their
    Blood Alcohol Concentration (BAC) is at or above what level?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.16%
    D: 0.20%
  answer: C
  explanation: Under New Mexico law, a BAC of 0.16% or higher is classified as Aggravated
    DWI, which carries mandatory higher penalties.
- id: 123
  category: alcohol_drugs_health
  question: 'In New Mexico, a driver 21 years of age or older is considered to be
    driving under the influence if their Blood Alcohol Concentration (BAC) is at or
    above:'
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: D
  explanation: According to New Mexico law, the legal limit for Blood Alcohol Concentration
    (BAC) for drivers 21 and older is 0.08%.
- id: 124
  category: alcohol_drugs_health
  question: 'If you are operating a commercial motor vehicle in New Mexico, you are
    considered legally intoxicated if your BAC is:'
  choices:
    A: 0.01% or higher
    B: 0.04% or higher
    C: 0.07% or higher
    D: 0.08% or higher
  answer: B
  explanation: For commercial drivers in New Mexico, the legal BAC limit is lower
    than for standard drivers, set at 0.04%.
- id: 125
  category: alcohol_drugs_health
  question: 'Under the New Mexico Implied Consent Act, if you refuse to take a breath
    or blood test when requested by an officer, your license will be revoked for:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Refusing a chemical test under New Mexico's Implied Consent Act results
    in an automatic one-year driver's license revocation.
- id: 126
  category: alcohol_drugs_health
  question: In New Mexico, how long is an Ignition Interlock License required for
    a first-time DWI conviction?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: New Mexico law requires all first-time DWI offenders to have an ignition
    interlock device installed in their vehicle for a period of one year.
- id: 127
  category: alcohol_drugs_health
  question: Which of the following is a mandatory penalty for a first DWI conviction
    in New Mexico?
  choices:
    A: A minimum of 10 days in jail
    B: A fine of at least $1,000
    C: Completion of a DWI school
    D: Permanent loss of driving privileges
  answer: C
  explanation: A first DWI conviction in New Mexico requires mandatory completion
    of a DWI school and a victim impact panel, along with other penalties like ignition
    interlock.
- id: 128
  category: alcohol_drugs_health
  question: In New Mexico, the 'None for the Road' DWI awareness class is required
    for which group of applicants?
  choices:
    A: Only drivers under the age of 18
    B: Drivers between 18 and 24 applying for a first-time NM license
    C: Only drivers with a previous out-of-state DUI
    D: All drivers over the age of 65
  answer: B
  explanation: New Mexico requires first-time license applicants between ages 18 and
    24 (or those 25+ with a prior DWI) to complete the 'None for the Road' self-study
    DWI awareness course.
- id: 129
  category: alcohol_drugs_health
  question: New Mexico's 'Open Container' law prohibits which of the following?
  choices:
    A: Any alcohol in the trunk of the car
    B: Unopened alcohol in the passenger area
    C: Open alcoholic beverage containers in the passenger area of a motor vehicle
    D: Transporting alcohol in a delivery truck
  answer: C
  explanation: New Mexico law prohibits any person from having an open container of
    alcohol in the passenger area of a motor vehicle while on a public highway.
- id: 130
  category: alcohol_drugs_health
  question: 'If a driver is convicted of a DWI in New Mexico and a minor under the
    age of 13 was in the vehicle, the driver may also be charged with:'
  choices:
    A: Reckless driving
    B: Child endangerment
    C: Vehicular assault
    D: Minor in possession
  answer: B
  explanation: Driving while intoxicated with a minor in the vehicle is considered
    child endangerment in New Mexico, which can lead to additional criminal charges.
- id: 131
  category: alcohol_drugs_health
  question: In New Mexico, what happens if you are caught driving a vehicle that is
    not equipped with an ignition interlock while your license is restricted to interlock-only
    driving?
  choices:
    A: You receive a warning
    B: Your vehicle can be seized and you face additional jail time
    C: You must pay a $50 fine
    D: Nothing, as long as you are sober
  answer: B
  explanation: Violating ignition interlock restrictions is a serious offense in New
    Mexico, potentially leading to vehicle immobilization/seizure and mandatory jail
    time.
- id: 132
  category: alcohol_drugs_health
  question: According to the New Mexico Driver's Manual, how long does it take for
    the body to get rid of the alcohol in one standard drink?
  choices:
    A: About 30 minutes
    B: About 1 hour
    C: About 2 hours
    D: About 3 hours
  answer: B
  explanation: The human body processes alcohol at a steady rate, typically taking
    about one hour to eliminate the alcohol from one standard drink.
- id: 133
  category: alcohol_drugs_health
  question: 'In New Mexico, a driver can be convicted of a DWI even if their BAC is
    below 0.08% if:'
  choices:
    A: They are driving a red car
    B: They are driving after midnight
    C: Their ability to drive safely is impaired by alcohol or drugs
    D: They do not have their license with them
  answer: C
  explanation: New Mexico law allows for a DWI conviction based on 'impairment to
    the slightest degree,' meaning you can be convicted if alcohol or drugs affect
    your driving, regardless of the specific BAC level.
- id: 134
  category: alcohol_drugs_health
  question: 'If you are under 21 years of age, New Mexico''s ''Zero Tolerance'' law
    means your license will be revoked if your BAC is as low as:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: New Mexico enforces a 'Zero Tolerance' policy for drivers under 21,
    where a BAC of 0.02% or higher results in license revocation.
- id: 135
  category: alcohol_drugs_health
  question: In New Mexico, which of the following is an automatic ground for an 'Aggravated
    DWI' charge, regardless of BAC level?
  choices:
    A: Driving with a minor in the car
    B: Refusing to submit to a chemical test
    C: Driving 20 mph over the speed limit while intoxicated
    D: Driving without insurance while intoxicated
  answer: B
  explanation: New Mexico law defines Aggravated DWI as having a BAC of 0.16% or higher,
    causing bodily injury while DWI, OR refusing to take a chemical test.
- id: 136
  category: alcohol_drugs_health
  question: What is the Blood Alcohol Concentration (BAC) limit for commercial drivers
    (CDL holders) in New Mexico?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: In New Mexico, commercial drivers are considered legally intoxicated
    if their BAC is 0.04% or higher while operating a commercial vehicle.
- id: 137
  category: alcohol_drugs_health
  question: If you are convicted of a second DWI in New Mexico, for how long will
    your driver's license be revoked?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: 10 years
  answer: B
  explanation: A second DWI conviction in New Mexico results in a mandatory 2-year
    license revocation.
- id: 138
  category: alcohol_drugs_health
  question: In New Mexico, if you have a medical condition such as epilepsy, how long
    must you be seizure-free before you can legally drive?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: New Mexico MVD guidelines generally require a driver to be seizure-free
    for at least 6 months, supported by a physician's statement, to maintain driving
    privileges.
- id: 139
  category: alcohol_drugs_health
  question: In New Mexico, a fourth or subsequent DWI conviction is classified as
    what type of crime?
  choices:
    A: Petty Misdemeanor
    B: Misdemeanor
    C: Felony
    D: Traffic Infraction
  answer: C
  explanation: A fourth or subsequent DWI conviction in New Mexico is a felony offense,
    carrying much more severe penalties and prison time.
- id: 140
  category: alcohol_drugs_health
  question: What does New Mexico's 'Indigent Interlock Fund' provide?
  choices:
    A: Free legal counsel for DWI defendants
    B: Financial assistance for ignition interlock costs for those who qualify
    C: Free transportation for intoxicated persons
    D: Payment for medical bills of DWI victims
  answer: B
  explanation: The Indigent Interlock Fund is a state program that helps low-income
    individuals pay for the costs associated with the mandatory ignition interlock
    device.
- id: 141
  category: alcohol_drugs_health
  question: How does marijuana use affect a driver in New Mexico?
  choices:
    A: It is legal to drive after use if you have a medical card
    B: It has no effect on reaction time
    C: It is illegal to drive if the drug impairs your ability to drive safely
    D: It only affects driving if combined with alcohol
  answer: C
  explanation: Under New Mexico's DWI laws, it is illegal to drive while under the
    influence of any drug, including marijuana, if it impairs your ability to operate
    a vehicle safely.
- id: 142
  category: alcohol_drugs_health
  question: In New Mexico, what is the only way to reduce your Blood Alcohol Concentration
    (BAC) after drinking?
  choices:
    A: Drinking strong black coffee
    B: Taking a cold shower
    C: Exercising or sweating
    D: Giving your body time to process the alcohol
  answer: D
  explanation: Only time can lower a person's BAC. Coffee, showers, and exercise do
    not speed up the elimination of alcohol from the bloodstream.
- id: 143
  category: alcohol_drugs_health
  question: If a New Mexico driver is convicted of a third DWI, how long is the mandatory
    license revocation period?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: Permanently
  answer: C
  explanation: A third DWI conviction in New Mexico results in a mandatory 3-year
    driver's license revocation.
- id: 144
  category: penalties_and_points
  question: Under New Mexico law, what is the point value for a 'Reckless Driving'
    violation?
  choices:
    A: 3 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Reckless driving is considered a serious offense in New Mexico and
    carries a penalty of 6 points on the driver's record.
- id: 145
  category: penalties_and_points
  question: How many points are assessed on a New Mexico driving record for failing
    to stop for a school bus that is displaying its stop signal?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Illegally passing a stopped school bus is a major safety violation
    in New Mexico and results in 6 points.
- id: 146
  category: penalties_and_points
  question: How many points are added to your New Mexico driving record for 'Following
    Too Closely' (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: A
  explanation: Following too closely is a 2-point violation in the New Mexico point
    system.
- id: 147
  category: penalties_and_points
  question: What is the point penalty for 'Failure to Yield Right-of-Way' in New Mexico?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: B
  explanation: Failure to yield the right-of-way results in 3 points being assessed
    against your New Mexico driver's license.
- id: 148
  category: penalties_and_points
  question: How many points are assessed for failing to stop at a red light or a stop
    sign in New Mexico?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failure to stop at a traffic signal (red light) or a stop sign is a
    3-point violation in New Mexico.
- id: 149
  category: penalties_and_points
  question: Under New Mexico law, what is the point penalty for 'Failure to yield
    the right-of-way to an emergency vehicle'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: Failure to yield to an emergency vehicle is considered a serious safety
    violation in New Mexico and carries a penalty of 6 points.
- id: 150
  category: penalties_and_points
  question: What is the base fine for a first-time offense of texting while driving
    in New Mexico?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: A
  explanation: In New Mexico, the first offense for texting while driving carries
    a $25 fine. Subsequent offenses carry a $50 fine.
- id: 151
  category: penalties_and_points
  question: At what point level will the New Mexico MVD send a driver an advisory
    letter warning of potential license suspension?
  choices:
    A: 3 to 5 points
    B: 6 points
    C: 7 to 11 points
    D: 12 points
  answer: C
  explanation: When a driver accumulates 7 to 11 points within a 12-month period,
    the MVD sends an advisory letter. At 12 points, the license is suspended.
- id: 152
  category: penalties_and_points
  question: How many points are assessed for a violation of the New Mexico seat belt
    law or child restraint law?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 0 points (fine only)
  answer: A
  explanation: New Mexico law assesses 2 points for failure to use a seat belt or
    for child restraint violations.
- id: 153
  category: penalties_and_points
  question: If you are convicted of an 'Open Container' violation (having an open
    alcoholic beverage in the passenger area) in New Mexico, how many points are added
    to your record?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: B
  explanation: An open container violation in New Mexico results in 3 points being
    assessed against the driver's license.
- id: 154
  category: sharing_the_road
  question: 'When following a large truck in New Mexico, if you cannot see the truck''s
    side-view mirrors, you are:'
  choices:
    A: In the truck's 'No-Zone' (blind spot)
    B: At a safe following distance
    C: In the truck's 'Safe-Zone'
    D: Required to turn on your high beams
  answer: A
  explanation: The New Mexico Driver's Manual states that if you cannot see the driver's
    face in their side-view mirror, they cannot see you, meaning you are in their
    blind spot or 'No-Zone'.
- id: 155
  category: sharing_the_road
  question: In New Mexico, what is the minimum distance you must maintain when following
    a fire apparatus (fire truck) that is responding to an alarm?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: NM Statute 66-7-333 prohibits drivers from following a fire apparatus
    traveling in response to a fire alarm closer than 500 feet.
- id: 156
  category: sharing_the_road
  question: 'When a pedestrian is crossing the street guided by a service animal or
    carrying a white cane, New Mexico law requires drivers to:'
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and take necessary precautions to avoid injury
    C: Drive around them if there is enough room
    D: Wait for a police officer to direct traffic
  answer: B
  explanation: NM Statute 66-7-334 requires drivers to yield the right-of-way to any
    pedestrian who is totally or partially blind and carrying a cane or using a service
    animal.
- id: 157
  category: sharing_the_road
  question: In New Mexico, are bicyclists permitted to ride on the shoulder of a highway?
  choices:
    A: No, they must always be in the travel lane
    B: Yes, they may ride on the shoulder
    C: Only if the shoulder is paved and at least 10 feet wide
    D: Only during daylight hours
  answer: B
  explanation: In New Mexico, bicyclists are generally permitted to ride on the shoulder
    of the road to stay safe and out of the way of faster motor vehicle traffic.
- id: 158
  category: sharing_the_road
  question: 'When turning left across a lane used by oncoming bicyclists, a New Mexico
    driver must:'
  choices:
    A: Yield to the bicyclist as they have the right-of-way
    B: Signal the bicyclist to stop
    C: Speed up to turn before the bicyclist arrives
    D: Expect the bicyclist to move to the sidewalk
  answer: A
  explanation: Bicycles are considered vehicles in New Mexico. Drivers must yield
    to oncoming traffic, including bicycles, when making a left turn.
- id: 159
  category: sharing_the_road
  question: What is the legal status of 'lane splitting' (motorcycles driving between
    rows of stopped or moving cars) in New Mexico?
  choices:
    A: It is explicitly legal
    B: It is legal only in traffic jams
    C: It is not authorized and is generally cited as a lane violation
    D: It is legal for motorcycles under 250cc
  answer: C
  explanation: New Mexico law requires vehicles to remain within a single lane (NM
    Statute 66-7-317). Lane splitting is not authorized and can result in a citation
    for failure to maintain a lane.
- id: 160
  category: sharing_the_road
  question: 'In New Mexico, if you are driving behind a slow-moving farm vehicle,
    you should:'
  choices:
    A: Honk your horn until they pull over
    B: Pass immediately, even if in a no-passing zone
    C: Be patient and wait until it is safe and legal to pass
    D: Follow as closely as possible to encourage them to speed up
  answer: C
  explanation: Farm machinery often travels at speeds of 25 mph or less. Drivers should
    remain patient and only pass when there is a legal passing zone and it is safe
    to do so.
- id: 161
  category: sharing_the_road
  question: According to the New Mexico Driver's Manual, how much space should you
    allow when following a motorcycle?
  choices:
    A: The same as a car
    B: Less than a car because they are smaller
    C: At least a four-second following distance
    D: Exactly 10 feet
  answer: C
  explanation: Because motorcycles can stop more quickly than cars and are more easily
    affected by road conditions, New Mexico recommends a following distance of at
    least four seconds.
- id: 162
  category: sharing_the_road
  question: When a pedestrian is in an unmarked crosswalk at an intersection in New
    Mexico, who has the right-of-way?
  choices:
    A: The driver of the vehicle
    B: The pedestrian
    C: Whoever arrived at the intersection first
    D: The pedestrian, but only if they are wearing reflective clothing
  answer: B
  explanation: NM Statute 66-7-334 states that drivers shall yield the right-of-way
    to a pedestrian crossing the roadway within any unmarked crosswalk at an intersection.
- id: 163
  category: sharing_the_road
  question: 'In New Mexico, a bicycle operated at night must be equipped with a lamp
    on the front that emits a white light visible from a distance of at least:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: NM Statute 66-3-707 requires bicycles used at night to have a front
    lamp visible from at least 500 feet and a red reflector on the rear visible from
    300 feet.
- id: 164
  category: sharing_the_road
  question: In New Mexico, when a school bus is stopped on an undivided highway with
    its red lights flashing and stop arm extended, who must stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching from the front
    C: Traffic in both directions
    D: No one, if there are at least three lanes
  answer: C
  explanation: According to the New Mexico Driver's Manual, on an undivided roadway,
    all traffic in both directions must stop for a school bus with flashing red lights
    and an extended stop arm.
- id: 165
  category: sharing_the_road
  question: What is the recommended following distance when driving behind a motorcycle
    in New Mexico to allow for a safe reaction time?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: The New Mexico Driver's Manual recommends a following distance of at
    least four seconds when behind a motorcycle, as they can stop much quicker than
    cars.
- id: 166
  category: sharing_the_road
  question: 'When an emergency vehicle with a siren and flashing lights is approaching
    from behind, New Mexico law requires you to:'
  choices:
    A: Stop immediately in your lane
    B: Pull to the right edge of the road and stop
    C: Speed up to stay ahead of the vehicle
    D: Move to the left shoulder and stop
  answer: B
  explanation: New Mexico law requires drivers to yield the right-of-way by pulling
    to the right-hand edge or curb of the roadway, clear of intersections, and stopping
    until the emergency vehicle has passed.
- id: 167
  category: sharing_the_road
  question: In New Mexico, it is illegal to follow closer than ______ feet behind
    any fire apparatus responding to a fire alarm.
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: NM Statute 66-7-332.1 prohibits following fire apparatus closer than
    500 feet when they are responding to an alarm.
- id: 168
  category: sharing_the_road
  question: According to New Mexico law, who is required to wear a safety helmet while
    operating or riding on a motorcycle?
  choices:
    A: Only the operator
    B: All riders regardless of age
    C: Only riders under the age of 18
    D: Only riders with a learner's permit
  answer: C
  explanation: New Mexico law (Statute 66-7-356) requires all persons under the age
    of 18 to wear a safety helmet when operating or riding on a motorcycle.
- id: 169
  category: sharing_the_road
  question: Large trucks have 'No-Zones' where the driver cannot see your vehicle.
    Where are these blind spots located?
  choices:
    A: Only directly behind the truck
    B: Only on the left side of the truck
    C: Directly in front, directly behind, and on both sides
    D: Only on the right side of the truck
  answer: C
  explanation: The 'No-Zones' for large trucks are located in the front, the rear,
    and on both sides of the vehicle where the truck driver's visibility is limited.
- id: 170
  category: sharing_the_road
  question: 'In New Mexico, if you are driving and a bicycle is traveling in your
    lane and there is not enough room to pass safely, you should:'
  choices:
    A: Wait behind the bicycle until it is safe to pass
    B: Honk until the cyclist moves to the sidewalk
    C: Force the cyclist off the road
    D: Pass as closely as possible to encourage them to move
  answer: A
  explanation: The New Mexico Driver's Manual states that if there is not enough room
    to pass a cyclist safely, you must wait behind them until it is safe to pass with
    at least five feet of clearance.
- id: 171
  category: sharing_the_road
  question: A 'Slow Moving Vehicle' emblem, which is an orange triangle with a red
    border, must be displayed on vehicles that travel at speeds of ______ or less.
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The slow-moving vehicle emblem is required for vehicles designed to
    travel at speeds of 25 mph or less, such as farm equipment or construction machinery.
- id: 172
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may:'
  choices:
    A: Turn from the left lane
    B: Stay entirely in the right lane
    C: Swing wide to the left to complete the turn
    D: Stop and wait for all traffic to clear both streets
  answer: C
  explanation: Large trucks often need to swing wide to the left to make a right turn
    without the trailer hitting the curb or other objects.
- id: 173
  category: sharing_the_road
  question: 'If you are turning left at an intersection and a bicyclist is approaching
    from the opposite direction, you should:'
  choices:
    A: Turn quickly before the bicyclist reaches the intersection
    B: Yield to the bicyclist as you would for any other vehicle
    C: Honk to warn the bicyclist to stop
    D: Assume the bicyclist will pull onto the sidewalk
  answer: B
  explanation: Bicyclists have the same rights and responsibilities as motorists.
    You must yield to an oncoming bicyclist when turning left, just as you would for
    a car.
- id: 174
  category: vehicle_information
  question: 'In New Mexico, you must turn on your headlights whenever you cannot see
    persons or vehicles clearly for a distance of:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: According to the New Mexico Driver's Manual, headlights must be turned
    on if you cannot see persons or vehicles ahead for 500 feet.
- id: 175
  category: vehicle_information
  question: What is the minimum legal tire tread depth for passenger vehicles in New
    Mexico?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe and illegal in New Mexico if they have
    less than 2/32 of an inch of tread depth.
- id: 176
  category: vehicle_information
  question: In which New Mexico county is an emissions test (Air Care) required for
    vehicle registration?
  choices:
    A: Santa Fe County
    B: Doña Ana County
    C: Bernalillo County
    D: Chaves County
  answer: C
  explanation: Vehicle emissions testing is currently required only for vehicles registered
    in Bernalillo County (Air Care New Mexico program).
- id: 177
  category: vehicle_information
  question: 'Under New Mexico law, every motor vehicle must be equipped with a horn
    that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: New Mexico equipment regulations state that a vehicle's horn must be
    audible under normal conditions from a distance of not less than 200 feet.
- id: 178
  category: vehicle_information
  question: 'New Mexico law requires that rearview mirrors allow a driver to see the
    highway for a distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: Vehicles must be equipped with a mirror so located as to reflect to
    the driver a view of the highway for a distance of at least 200 feet to the rear.
- id: 179
  category: vehicle_information
  question: In New Mexico, the service brake (foot brake) must be capable of stopping
    a vehicle traveling at 20 mph within how many feet?
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 50 feet
  answer: B
  explanation: New Mexico safety standards require that the foot brake be able to
    stop the vehicle within 25 feet when traveling at a speed of 20 mph on a dry,
    level pavement.
- id: 180
  category: vehicle_information
  question: According to New Mexico law, what is the maximum allowable light reduction
    (tint) for the side and rear windows?
  choices:
    A: No more than 10% light reduction
    B: No more than 35% light reduction
    C: Must allow at least 20% light transmission
    D: Must allow at least 50% light transmission
  answer: C
  explanation: New Mexico law prohibits window tinting that allows less than 20% light
    transmission through the glass.
- id: 181
  category: vehicle_information
  question: If a load extends ______ or more beyond the rear of the vehicle bed or
    body in New Mexico, a red flag must be attached to the extreme rear of the load.
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Whenever a load extends 4 feet or more beyond the rear of a vehicle,
    a red flag (at least 12 inches square) must be displayed at the end of the load.
- id: 182
  category: vehicle_information
  question: In New Mexico, who is required by law to wear a safety belt in a moving
    vehicle?
  choices:
    A: Only the driver and front-seat passengers
    B: Only passengers under the age of 18
    C: The driver and all passengers, regardless of seating position
    D: Only the driver
  answer: C
  explanation: New Mexico has a primary enforcement seat belt law, meaning the driver
    and all passengers in all seating positions must wear a seat belt.
- id: 183
  category: vehicle_information
  question: 'Under New Mexico law, children must be secured in a child passenger restraint
    system (car seat or booster) until they are at least:'
  choices:
    A: 5 years old
    B: 7 years old
    C: 9 years old
    D: 12 years old
  answer: B
  explanation: New Mexico law requires children to be in a child restraint system
    until they are at least 7 years old. Children 7 through 12 must use a booster
    seat until the adult seat belt fits properly.
- id: 184
  category: vehicle_information
  question: 'Every motor vehicle in New Mexico must have at least two tail lamps on
    the rear which emit a red light plainly visible from a distance of:'
  choices:
    A: 250 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Tail lights on vehicles in New Mexico must be visible from a distance
    of 500 feet to the rear.
- id: 185
  category: vehicle_information
  question: 'In New Mexico, the light that illuminates the rear registration plate
    (license plate) must make the plate clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: New Mexico law requires a white light to illuminate the rear license
    plate so that it is clearly legible from a distance of 50 feet.
- id: 186
  category: vehicle_information
  question: When must you use your headlights in New Mexico besides during the night?
  choices:
    A: Only when it is raining
    B: Only when it is snowing
    C: Whenever you use your windshield wipers
    D: Anytime visibility is less than 500 feet due to weather or other conditions
  answer: D
  explanation: In addition to the 1/2 hour after sunset to 1/2 hour before sunrise
    rule, New Mexico requires headlights whenever visibility is reduced to 500 feet
    or less by rain, snow, fog, or dust.
- id: 187
  category: vehicle_information
  question: According to New Mexico law, when must you turn on your headlights?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: Only when it is raining or snowing
    C: From 1/2 hour after sunset to 1/2 hour before sunrise
    D: Only when driving on unlit rural highways
  answer: C
  explanation: New Mexico law requires headlights to be on from a half-hour after
    sunset to a half-hour before sunrise, or whenever visibility is less than 500
    feet.
- id: 188
  category: vehicle_information
  question: Under New Mexico law, every motor vehicle must have a foot brake that
    is capable of stopping the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 15 feet
    B: 25 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: New Mexico Statute 66-3-840 requires that the service (foot) brake
    be able to stop the vehicle within 25 feet from a speed of 20 mph on a dry, level
    surface.
- id: 189
  category: vehicle_information
  question: In New Mexico, your vehicle's rear-view mirror must allow you to see the
    highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: New Mexico Statute 66-3-845 requires a mirror so located as to reflect
    to the driver a view of the highway for a distance of at least 200 feet to the
    rear.
- id: 190
  category: vehicle_information
  question: New Mexico law requires that window tinting on the side and rear windows
    must allow at least what percentage of light to pass through?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: A
  explanation: New Mexico Statute 66-3-846.1 specifies that window tinting must allow
    at least 20% light transmission on the front side, rear side, and rear windows.
- id: 191
  category: vehicle_information
  question: 'The tail lamp or a separate lamp on a vehicle in New Mexico must illuminate
    the rear registration plate so it is clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: New Mexico Statute 66-3-805 requires the rear license plate to be illuminated
    and visible from a distance of 50 feet.
- id: 192
  category: vehicle_information
  question: In New Mexico, turn signal lights must be visible from a distance of not
    less than ______ feet in normal sunlight.
  choices:
    A: 50 feet
    B: 100 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: New Mexico Statute 66-3-824 requires that signal lamps be visible from
    a distance of 100 feet both to the front and the rear in normal sunlight.
- id: 193
  category: vehicle_information
  question: In Bernalillo County, New Mexico, how often are most vehicles required
    to undergo an emissions (Air Care) inspection?
  choices:
    A: Every year
    B: Every two years
    C: Every five years
    D: Only when the vehicle is sold
  answer: B
  explanation: In Bernalillo County, vehicles must pass an emissions test every two
    years (biennially) or upon change of ownership.
- id: 194
  category: vehicle_information
  question: 'Under New Mexico law, it is illegal to operate a motor vehicle that is
    equipped with:'
  choices:
    A: A muffler cutout or bypass
    B: A factory-installed exhaust system
    C: Dual exhaust pipes
    D: A catalytic converter
  answer: A
  explanation: New Mexico Statute 66-3-844 prohibits the use of a muffler cutout,
    bypass, or similar device on any motor vehicle used on a highway.
- id: 195
  category: vehicle_information
  question: 'In New Mexico, a ''Slow Moving Vehicle'' emblem must be displayed on
    the rear of vehicles designed to operate at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: New Mexico Statute 66-3-887 requires the slow-moving vehicle emblem
    on vehicles designed for a maximum speed of 25 miles per hour or less.
- id: 196
  category: signs_and_signals
  question: In New Mexico, what does a flashing red traffic light signify?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to turn solid red
    C: Stop completely and proceed when it is safe to do so
    D: Yield to oncoming traffic but do not stop
  answer: C
  explanation: According to the New Mexico Driver's Manual, a flashing red light means
    the same as a stop sign. You must come to a full stop and then proceed when it
    is safe.
- id: 197
  category: signs_and_signals
  question: When a driver has their left arm extended straight out the window, which
    maneuver are they signaling?
  choices:
    A: A right turn
    B: A left turn
    C: Slowing down or stopping
    D: U-turn
  answer: B
  explanation: 'New Mexico law recognizes standard hand signals: arm straight out
    for a left turn, arm bent upward for a right turn, and arm bent downward for stopping
    or slowing.'
- id: 198
  category: signs_and_signals
  question: 'A pennant-shaped sign (isosceles triangle pointing right) found on the
    left side of the road indicates:'
  choices:
    A: A school zone ahead
    B: A yield requirement
    C: A no-passing zone
    D: A railroad crossing
  answer: C
  explanation: The pennant-shaped sign is unique because it is placed on the left
    side of the road to warn drivers that they are entering a no-passing zone.
- id: 199
  category: signs_and_signals
  question: In New Mexico, what does a steady yellow 'X' signal over a traffic lane
    mean?
  choices:
    A: The lane is for left turns only
    B: You must move out of this lane as soon as safe because the signal is about
      to change to red
    C: The lane is open for travel in your direction
    D: The lane is reserved for emergency vehicles
  answer: B
  explanation: A steady yellow 'X' over a lane indicates that the lane control signal
    is about to change to a red 'X', and you should safely vacate the lane.
- id: 200
  category: signs_and_signals
  question: What do yellow pavement markings signify on New Mexico roadways?
  choices:
    A: Traffic moving in the same direction
    B: The right edge of the roadway
    C: Traffic moving in opposite directions
    D: Pedestrian crossing zones
  answer: C
  explanation: Yellow lines separate lanes of traffic moving in opposite directions.
    White lines separate lanes of traffic moving in the same direction.
- id: 201
  category: signs_and_signals
  question: Under New Mexico law, when is a left turn on a red light permitted?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: Anytime there is no oncoming traffic
    D: Only between the hours of midnight and 5:00 AM
  answer: B
  explanation: New Mexico law allows a left turn on red only if you are turning from
    a one-way street onto another one-way street, provided you stop first and yield
    to pedestrians and other traffic.
- id: 202
  category: signs_and_signals
  question: 'In New Mexico, a diamond-shaped sign with an orange background is used
    for:'
  choices:
    A: General warnings about road conditions
    B: Service signs (gas, food, lodging)
    C: Construction and maintenance zones
    D: Recreational area guidance
  answer: C
  explanation: Orange is the standard color for construction and maintenance signs
    in New Mexico. These signs alert drivers to workers, equipment, or detours.
- id: 203
  category: signs_and_signals
  question: A 'crossbuck' sign at a railroad crossing should be treated the same as
    which other traffic sign?
  choices:
    A: A Stop sign
    B: A Yield sign
    C: A Speed Limit sign
    D: A Do Not Enter sign
  answer: B
  explanation: A railroad crossbuck sign is a regulatory sign that must be treated
    like a yield sign. You must yield to any approaching trains.
- id: 204
  category: signs_and_signals
  question: What is the purpose of a shared center lane marked with solid and broken
    yellow lines on both sides?
  choices:
    A: Passing slower vehicles
    B: High-occupancy vehicle travel
    C: Making left turns only
    D: Emergency parking only
  answer: C
  explanation: Shared center lanes are reserved for making left turns and can be used
    by vehicles traveling in either direction, but they cannot be used for passing
    or through travel.
- id: 205
  category: signs_and_signals
  question: 'If you are approaching a roundabout in New Mexico, you must yield the
    right-of-way to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one; you have the right of way when entering
    D: Only emergency vehicles
  answer: B
  explanation: When entering a roundabout, New Mexico law requires you to yield to
    traffic already circulating in the roundabout, which will be coming from your
    left.
- id: 206
  category: signs_and_signals
  question: What does a solid white line painted across a traffic lane at an intersection
    represent?
  choices:
    A: A crosswalk
    B: A stop line
    C: A bicycle lane boundary
    D: A 'no-parking' zone
  answer: B
  explanation: A solid white line across a lane is a stop line, indicating the exact
    point where a vehicle must stop for a red light or stop sign.
- id: 207
  category: signs_and_signals
  question: A New Mexico state highway sign is easily identified by which symbol?
  choices:
    A: A silhouette of a Yucca plant
    B: A Roadrunner
    C: The Zia sun symbol
    D: A silhouette of a hot air balloon
  answer: C
  explanation: New Mexico state road markers feature the Zia sun symbol, which is
    also found on the state flag.
- id: 208
  category: signs_and_signals
  question: What does a steady red arrow signal mean in New Mexico?
  choices:
    A: You may turn after coming to a complete stop
    B: You must stop and cannot turn in the direction of the arrow
    C: The arrow is about to turn green
    D: Yield to pedestrians, then you may turn
  answer: B
  explanation: A steady red arrow means you must stop and you cannot make a turn in
    the direction the arrow is pointing until the signal changes to a green arrow
    or a green light.
- id: 209
  category: signs_and_signals
  question: In New Mexico, what does a pennant-shaped sign located on the left side
    of the road indicate?
  choices:
    A: School Zone
    B: No Passing Zone
    C: Yield Ahead
    D: Railroad Crossing
  answer: B
  explanation: According to the New Mexico Driver's Manual, a pennant-shaped sign
    is placed on the left side of the road to mark the beginning of a No Passing Zone.
- id: 210
  category: signs_and_signals
  question: When you see a flashing yellow light at an intersection in New Mexico,
    what should you do?
  choices:
    A: Stop completely and wait for it to turn green
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: Treat it like a four-way stop
  answer: C
  explanation: A flashing yellow light means you should slow down and proceed with
    caution, as outlined in the New Mexico Driver's Manual.
- id: 211
  category: signs_and_signals
  question: If you are extending your left arm straight out the window, which maneuver
    are you signaling in New Mexico?
  choices:
    A: Right turn
    B: Stop or slow down
    C: Left turn
    D: U-turn
  answer: C
  explanation: Standard hand signals in New Mexico define a left arm extended straight
    out as a signal for a left turn.
- id: 212
  category: signs_and_signals
  question: What do 'Service Signs' (such as those for gas, food, or lodging) look
    like in New Mexico?
  choices:
    A: Green with white letters
    B: Blue with white letters
    C: Brown with white letters
    D: Yellow with black letters
  answer: B
  explanation: In New Mexico and across the US, blue signs with white lettering provide
    information about motorist services like fuel, food, and medical facilities.
- id: 213
  category: signs_and_signals
  question: In New Mexico, what does a solid white line between lanes of traffic moving
    in the same direction indicate?
  choices:
    A: You are encouraged to change lanes
    B: You should stay in your lane; lane changes are discouraged or restricted
    C: The road is about to become a one-way street
    D: You must stop immediately
  answer: B
  explanation: A solid white line indicates that drivers should stay in their lane
    and that lane changes are discouraged because they may be hazardous.
- id: 214
  category: signs_and_signals
  question: What is the meaning of a fluorescent pink sign in New Mexico?
  choices:
    A: School zone warning
    B: Public recreation and scenic guidance
    C: Incident management (accidents, floods, or emergency scenes)
    D: Construction or maintenance warning
  answer: C
  explanation: Fluorescent pink signs are used specifically for incident management
    to warn drivers of emergency scenes like crashes or natural disasters.
- id: 215
  category: signs_and_signals
  question: When approaching a railroad crossing with a 'Crossbuck' sign and no signals,
    what does New Mexico law require?
  choices:
    A: Always come to a complete stop
    B: Yield to any approaching trains and proceed only when safe
    C: Speed up to cross the tracks before a train arrives
    D: Stop only if there are more than two tracks
  answer: B
  explanation: A Crossbuck sign should be treated as a yield sign; you must slow down
    and yield to any approaching trains.
- id: 216
  category: signs_and_signals
  question: In New Mexico, what does a curb painted yellow usually indicate?
  choices:
    A: Loading zone or other restriction
    B: No parking allowed at any time
    C: Parking for disabled persons only
    D: Unrestricted public parking
  answer: A
  explanation: Yellow curbs in New Mexico typically indicate a loading zone or other
    specific parking restrictions defined by local ordinances.
- id: 217
  category: signs_and_signals
  question: What does a diamond-shaped sign signify in New Mexico?
  choices:
    A: Regulatory information
    B: Yield right-of-way
    C: Warning or hazard ahead
    D: Destination and distance
  answer: C
  explanation: Diamond-shaped signs are used as warning signs to alert drivers to
    existing or potentially hazardous conditions on or adjacent to the road.
- id: 218
  category: signs_and_signals
  question: If you are at an intersection with a red light and a green arrow pointing
    right, what are you allowed to do in New Mexico?
  choices:
    A: Stop and wait for the main light to turn green
    B: Turn right only after coming to a complete stop
    C: Turn right without stopping, yielding to pedestrians in the crosswalk
    D: Turn right only if there is no 'No Turn on Red' sign
  answer: C
  explanation: A green arrow means you have a 'protected' turn. You may proceed in
    the direction of the arrow, though you must still yield to pedestrians already
    in the intersection.
- id: 219
  category: signs_and_signals
  question: A center lane marked on both sides by a solid yellow line and a broken
    yellow line is used for what purpose in New Mexico?
  choices:
    A: Passing slower traffic on the left
    B: Emergency parking only
    C: Left turns only (Shared Turn Lane)
    D: High Occupancy Vehicles (HOV) only
  answer: C
  explanation: This marking indicates a shared left turn lane, which is used by vehicles
    traveling in either direction to make left turns.
- id: 220
  category: signs_and_signals
  question: In New Mexico, what is the proper hand signal for a right turn?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at the elbow.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 221
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 222
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 223
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 224
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 225
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 226
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 227
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 228
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 229
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 230
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 231
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 232
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 233
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 234
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 235
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
