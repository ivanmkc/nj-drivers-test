metadata:
  source: MVD Driver's License Manuals (mvd.newmexico.gov)
  total_questions: 230
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: Under the Graduated License System in New Mexico, which of the following is a recognized
    type of license?
  choices:
    A: Commercial License
    B: Chauffeur License
    C: Provisional License
    D: Hardship License
  answer: C
  explanation: According to the manual's section on the Graduated License System, the types of driver
    licenses include the Instructional Permit, Provisional License, and Unrestricted Driver License.
- id: 2
  category: signs_and_signals
  question: Which of the following are classified as Traffic Control Devices?
  choices:
    A: Speed limits and parking rules
    B: Traffic signals, signs, and pavement markings
    C: Reversible lanes and shared center lanes
    D: Safety belts and child restraints
  answer: B
  explanation: The manual categorizes Traffic Signals, Traffic Signs, and Pavement Markings under the
    'Traffic Control Devices' section.
- id: 3
  category: safe_driving_rules
  question: Which of the following is listed as an example of a lane control?
  choices:
    A: One-way streets
    B: Shared center lane
    C: Pavement markings
    D: Traffic circles
  answer: B
  explanation: The manual lists Reversible Lanes, Reserved Lanes, and Shared Center Lanes under the 'Other
    Lane Controls' section.
- id: 4
  category: safe_driving_rules
  question: According to the manual, which of the following is a key component of 'Basic Driving'?
  choices:
    A: Adjusting to traffic
    B: Scanning
    C: Sharing space
    D: Checking blind spots
  answer: B
  explanation: The 'Basic Driving' section includes fundamental skills such as Starting, Accelerating,
    Steering, Speeding, Stopping, Scanning, and Use Your Lights.
- id: 5
  category: defensive_driving
  question: When adjusting to road conditions, drivers should specifically keep which of the following
    in mind to avoid causing harm?
  choices:
    A: Potholes
    B: Wildlife
    C: Bicycles
    D: Large trucks
  answer: B
  explanation: The section on Adjusting to Road Conditions specifically includes the topics 'Driving
    with Wildlife in Mind' and 'To Avoid Hurting an Animal.'
- id: 6
  category: vehicle_information
  question: Which of the following is classified as a vehicle emergency?
  choices:
    A: Fatigue
    B: Power failure
    C: Cellular phone usage
    D: Speeding
  answer: B
  explanation: The manual lists Brake Failure, Tire Blowout, and Power Failure under 'Vehicle Emergencies.'
- id: 7
  category: sharing_the_road
  question: When sharing the road with large trucks and RVs, what specific hazard must drivers be aware
    of?
  choices:
    A: Wide turns
    B: Trucker's blind spots
    C: Air brakes
    D: Cargo spills
  answer: B
  explanation: The section on Large Trucks and RVs specifically highlights the danger of 'Trucker's Blind
    Spots.'
- id: 8
  category: alcohol_drugs_health
  question: Which of the following factors is discussed under the requirement to 'Be In Shape to Drive'?
  choices:
    A: Vehicle maintenance
    B: Safety belts
    C: Emotions
    D: Scanning
  answer: C
  explanation: The 'Be In Shape to Drive' section covers personal factors including Vision, Fatigue,
    Drinking and Driving, Health, Emotions, and Cellular Phone Usage.
- id: 9
  category: license_system
  question: The Graduated License System consists of three types of licenses/permits. Two of them are
    the Instructional Permit and the Provisional License. What is the third?
  choices:
    A: Restricted Driver License
    B: Unrestricted Driver License
    C: Commercial Driver License
    D: Motorcycle License
  answer: B
  explanation: The Graduated License System includes the Instructional Permit, Provisional License, and
    Unrestricted Driver License.
- id: 10
  category: defensive_driving
  question: Which of the following is a specific area of space management discussed in the 'Sharing Space'
    section?
  choices:
    A: Space to park
    B: Space to merge
    C: Space to turn
    D: Space to reverse
  answer: B
  explanation: The 'Sharing Space' section covers Space Ahead, Space Behind, Space to the Side, Space
    to Merge, Space to Cross or Enter, and Space to Pass.
- id: 11
  category: alcohol_drugs_health
  question: 'In addition to alcohol, the ''Drinking and Driving'' section also addresses the effects
    of:'
  choices:
    A: Fatigue
    B: Other drugs
    C: Cellular phone usage
    D: Poor vision
  answer: B
  explanation: The 'Drinking and Driving' section includes a specific subsection titled 'Other Drugs
    And Driving.'
- id: 12
  category: vehicle_information
  question: Which of the following is considered a vehicle emergency alongside power failure and tire
    blowouts?
  choices:
    A: Brake failure
    B: Engine overheating
    C: Dead battery
    D: Broken windshield wiper
  answer: A
  explanation: The manual lists Brake Failure, Tire Blowout, and Power Failure under 'Vehicle Emergencies.'
- id: 13
  category: defensive_driving
  question: 'The manual''s section on ''Communicating'' is divided into letting others know what you
    are doing and:'
  choices:
    A: Letting others know you are there
    B: Letting others know you are turning
    C: Letting others know you are stopping
    D: Letting others know you are passing
  answer: A
  explanation: 'The ''Communicating'' section covers two main concepts: ''Letting Others Know You Are
    There'' and ''Letting Others Know What You Are Doing.'''
- id: 14
  category: safe_driving_rules
  question: Which of the following is listed as a specific type of lane control alongside reserved lanes
    and shared center lanes?
  choices:
    A: Passing lanes
    B: Reversible lanes
    C: Turning lanes
    D: Bicycle lanes
  answer: B
  explanation: The 'Other Lane Controls' section includes Reversible Lanes, Reserved Lanes, and Shared
    Center Lanes.
- id: 15
  category: license_system
  question: Who is required to have a New Mexico driver license?
  choices:
    A: Only residents of New Mexico who own a vehicle
    B: Anyone operating a motor vehicle or motorcycle on public roadways in New Mexico
    C: Only drivers under the age of 18
    D: Anyone operating a commercial vehicle
  answer: B
  explanation: According to the manual, anyone operating a motor vehicle or motorcycle on public roadways
    in the State of New Mexico must have a driver license, and residents are required to have a New Mexico
    driver license.
- id: 16
  category: license_system
  question: What are the three levels of the Graduated Driver License (GDL) system in New Mexico?
  choices:
    A: Learner's Permit, Intermediate License, Commercial License
    B: Student Permit, Restricted License, Full License
    C: Instructional Permit, Provisional License, Unrestricted Drivers License
    D: Basic Permit, Advanced Permit, Unrestricted License
  answer: C
  explanation: The three different levels of the Graduated driver license (GDL) system are the Instructional
    Permit, Provisional License, and Unrestricted Drivers License.
- id: 17
  category: license_system
  question: What is the minimum age to obtain an instructional permit in New Mexico?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 15 years and 6 months of age
    D: 16 years of age
  answer: B
  explanation: The manual states that the minimum age for an instructional permit is 15 years of age.
- id: 18
  category: driver_responsibility
  question: When driving a car with an instructional permit, where must the supervising licensed driver
    sit?
  choices:
    A: In the back seat
    B: In the right front seat
    C: Anywhere in the vehicle
    D: In a separate vehicle following closely
  answer: B
  explanation: In all vehicles except motorcycles, the licensed driver supervising a learner with an
    instructional permit must sit in the right front seat.
- id: 19
  category: driver_responsibility
  question: How must a learner on a motorcycle be supervised when holding an instructional permit?
  choices:
    A: The licensed driver must ride as a passenger on the learner's motorcycle
    B: The licensed driver must follow the learner
    C: The licensed driver must lead the learner
    D: The learner must ride in a sidecar attached to the supervisor's motorcycle
  answer: B
  explanation: The manual specifies that on motorcycles, the licensed driver must follow the learner.
- id: 20
  category: license_system
  question: What are the age and experience requirements for a non-instructor supervising driver when
    a learner is driving with an instructional permit?
  choices:
    A: At least 18 years old and licensed for 1 year
    B: At least 21 years old and licensed for at least 3 years
    C: At least 25 years old and licensed for 5 years
    D: Any licensed driver regardless of age
  answer: B
  explanation: The driver must be with a licensed driver 21 years of age or older who has been licensed
    for at least three years in this state or any other state.
- id: 21
  category: license_system
  question: How long must a driver retain an instructional permit before they can apply for a provisional
    license?
  choices:
    A: At least 3 months
    B: At least 6 months
    C: At least 9 months
    D: At least 12 months
  answer: B
  explanation: The driver must retain the instructional permit for at least six months.
- id: 22
  category: driver_testing
  question: How many hours of practice driving must be completed to obtain a provisional license?
  choices:
    A: 30 hours total, including 5 hours at night
    B: 40 hours total, including 10 hours at night
    C: 50 hours total, including 10 hours at night
    D: 60 hours total, including 15 hours at night
  answer: C
  explanation: The driver must complete not less than 50 hours of practice driving, including not less
    than 10 hours of nighttime driving.
- id: 23
  category: safe_driving_rules
  question: During what hours is a driver with a provisional license generally prohibited from operating
    a motor vehicle on public highways?
  choices:
    A: 10:00 PM and 6:00 AM
    B: 11:00 PM and 5:00 AM
    C: Midnight and 5:00 AM
    D: Midnight and 6:00 AM
  answer: C
  explanation: The driver may not operate a motor vehicle upon public highways between the hours of midnight
    and 5:00 AM, unless an exception applies.
- id: 24
  category: safe_driving_rules
  question: Which of the following is a valid exception for a provisional licensee to drive between midnight
    and 5:00 AM?
  choices:
    A: Driving to a friend's house for a study group
    B: Driving to and from work as evidenced by a signed statement from an employer
    C: Driving to a 24-hour gym
    D: Driving home from a late-night movie
  answer: B
  explanation: A provisional licensee may drive at any hour if driving to and from work as evidenced
    by a signed statement from the licensee’s employer.
- id: 25
  category: safe_driving_rules
  question: What is the passenger restriction for a driver with a provisional license, unless accompanied
    by a licensed driver 21 or older?
  choices:
    A: No passengers under 21 are allowed
    B: No more than one passenger under 21 who is not immediate family
    C: No more than two passengers under 21 who are not immediate family
    D: Only immediate family members are allowed as passengers
  answer: B
  explanation: Unless a licensed driver that is 21 years old or older is in the vehicle, you may not
    have more than one other passenger under the age of 21 who is not a member of your immediate family
    in the vehicle.
- id: 26
  category: license_system
  question: To obtain an unrestricted driver license, how long must a driver have held a provisional
    license?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: The driver must have held a provisional license for the 12-month period immediately preceding
    the date of application for a driver license.
- id: 27
  category: penalties_and_points
  question: A driver applying for an unrestricted driver license must not have been convicted of a traffic
    violation within how many days prior to applying?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: The driver must not have been convicted of a traffic violation 90 days prior to applying
    for a driver license.
- id: 28
  category: license_system
  question: For how many years is a New Mexico driver license valid upon renewal?
  choices:
    A: 2 or 4 years
    B: 3 or 5 years
    C: 4 or 8 years
    D: 5 or 10 years
  answer: C
  explanation: Your driver license is valid for either 4 or 8 years.
- id: 29
  category: license_system
  question: What is the time frame during which you can renew your driver license?
  choices:
    A: Up to 30 days before or 30 days after it expires
    B: Up to 60 days before or 15 days after it expires
    C: Up to 90 days before or 30 days after it expires
    D: Up to 120 days before or 60 days after it expires
  answer: C
  explanation: You may renew the license anytime up to 90 days before or 30 days after it expires.
- id: 30
  category: penalties_and_points
  question: Which of the following actions can result in the loss of your driving privileges?
  choices:
    A: Failing to settle a financial judgment made against you for damages resulting from a motor vehicle
      accident
    B: Receiving a single parking ticket
    C: Renewing your license 10 days after it expires
    D: Driving 5 mph under the speed limit
  answer: A
  explanation: You can lose your driving privileges for failing to settle a financial judgment made against
    you for damages resulting from a motor vehicle accident.
- id: 31
  category: safe_driving_rules
  question: If your vehicle has an automatic shoulder belt, what else must you do to ensure your safety?
  choices:
    A: Disconnect the shoulder belt if you are driving at low speeds
    B: Buckle your lap belt as well
    C: Move your seat as far forward as possible
    D: You do not need to do anything else
  answer: B
  explanation: If you have an automatic shoulder belt, be sure to buckle your lap belt as well. Otherwise,
    in a collision you could slide out of the belt and be hurt or killed.
- id: 32
  category: safe_driving_rules
  question: Under what conditions must a child be secured in an approved safety device in New Mexico?
  choices:
    A: If the child is under the age of 5 years
    B: If the child is under the age of 24 months, or weighing less than 60 pounds
    C: If the child is under the age of 36 months, or weighing less than 40 pounds
    D: If the child is sitting in the front passenger seat
  answer: B
  explanation: Children under the age of 24 months, or weighing less than 60 pounds, must be secured
    in an approved safety device.
- id: 33
  category: signs_and_signals
  question: What should you do if you are stopped at an intersection and the traffic light turns green?
  choices:
    A: Accelerate immediately to claim the right-of-way
    B: Honk your horn to alert crossing traffic
    C: Allow crossing traffic to clear the intersection before you go ahead
    D: Turn right immediately without checking for pedestrians
  answer: C
  explanation: If you are stopped and then the light turns green, you must allow crossing traffic to
    clear the intersection before you go ahead.
- id: 34
  category: signs_and_signals
  question: What does a flashing YELLOW traffic light mean?
  choices:
    A: Stop completely and wait for a green light
    B: The traffic light is about to change to red
    C: Slow down and proceed with caution
    D: Yield to all traffic on your right
  answer: C
  explanation: A flashing YELLOW traffic light means slow down and proceed with caution.
- id: 35
  category: signs_and_signals
  question: How should a driver treat a flashing RED traffic light?
  choices:
    A: The same as a yield sign
    B: The same as a stop sign
    C: Proceed without stopping if the intersection is clear
    D: Stop only if pedestrians are present
  answer: B
  explanation: A flashing RED traffic light means the same as a stop sign. You must come to a full stop
    and then may proceed when it is safe to do so.
- id: 36
  category: signs_and_signals
  question: What is the typical shape and color of a warning sign?
  choices:
    A: Square and white with black lettering
    B: Diamond shaped and yellow with black lettering or symbols
    C: Rectangular and green with white lettering
    D: Round and red with white symbols
  answer: B
  explanation: Warning signs are usually yellow with black lettering or symbols and most are diamond
    shaped.
- id: 37
  category: signs_and_signals
  question: What does a white, X-shaped sign or "crossbuck" at a railroad crossing mean?
  choices:
    A: It has the same meaning as a "Yield" sign
    B: It has the same meaning as a "Stop" sign
    C: It indicates that the tracks are no longer in use
    D: It warns that a train is currently approaching
  answer: A
  explanation: A white, X-shaped sign or "crossbuck" with "Railroad Crossing" on it is located at the
    railroad crossing. This sign has the same meaning as a "Yield" sign. You must yield to crossing trains.
- id: 38
  category: sharing_the_road
  question: Which of the following vehicles is required to stop at least 15 feet from a railroad crossing
    before proceeding?
  choices:
    A: A passenger car with more than four occupants
    B: A motorcycle
    C: A school bus
    D: A pickup truck towing a boat
  answer: C
  explanation: School buses, taxis and other vehicles for hire that carry passengers and trucks that
    transport explosives, gasoline or other dangerous materials must stop at least 15 feet from a railroad
    crossing before proceeding.
- id: 39
  category: signs_and_signals
  question: What colors are generally used for construction, maintenance, or emergency operations signs?
  choices:
    A: Yellow with black letters
    B: Orange with black letters or symbols
    C: Red with white letters
    D: Green with white symbols
  answer: B
  explanation: Work area signs are generally diamond or rectangular shaped, orange with black letters
    or symbols and warn you that people are working on or near the roadway.
- id: 40
  category: signs_and_signals
  question: What does a regulatory sign with a red circle and a red slash over a symbol indicate?
  choices:
    A: A hazard is ahead
    B: The indicated action is prohibited
    C: You must yield the right-of-way
    D: A detour is required
  answer: B
  explanation: Some regulatory signs have a red circle with a red slash over a symbol. These signs prohibit
    certain actions, i.e., no left turn, no right turn, no U-turn, etc.
- id: 41
  category: safe_driving_rules
  question: When should you drive at the maximum speed indicated on a speed limit sign?
  choices:
    A: At all times to maintain traffic flow
    B: Only when passing another vehicle
    C: Only in ideal driving conditions
    D: Whenever you are driving in the left lane
  answer: C
  explanation: The maximum limit should be driven only in ideal driving conditions and you must reduce
    your speed when conditions require it.
- id: 42
  category: signs_and_signals
  question: If you are turning left and have a steady green traffic light, what must you do?
  choices:
    A: Turn immediately because you have the right-of-way
    B: Wait for a green arrow before turning
    C: Turn only when safe to do so, yielding to oncoming traffic
    D: Stop completely before making the turn
  answer: C
  explanation: If you are turning left, a steady green traffic light means you may turn but only when
    safe to do so. Oncoming traffic has the right-of-way.
- id: 43
  category: safe_driving_rules
  question: When is it appropriate to drive at the maximum posted speed limit?
  choices:
    A: At all times to prevent traffic backups.
    B: Only in ideal driving conditions.
    C: Whenever you are driving in the left-most lane.
    D: During rain, snow, or icy conditions.
  answer: B
  explanation: According to the manual, the maximum limit should be driven only in ideal driving conditions
    and you must reduce your speed when conditions require it, such as when the roadway is slippery or
    visibility is poor.
- id: 44
  category: signs_and_signals
  question: What does a square sign with a white horizontal line inside a red ball indicate?
  choices:
    A: You must come to a full stop.
    B: You cannot enter.
    C: The lane is reserved for high occupancy vehicles.
    D: You are approaching a school zone.
  answer: B
  explanation: A square sign with a white horizontal line inside a red ball is a 'Do Not Enter' sign,
    meaning you cannot enter that roadway opening.
- id: 45
  category: vehicle_information
  question: What does a reflective orange triangle on the rear of a vehicle mean?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle is a high occupancy vehicle.
    C: The vehicle is traveling less than 25 mph.
    D: The vehicle is broken down and waiting for a tow.
  answer: C
  explanation: A reflective orange triangle on the rear of a vehicle means it is a Slow Moving Vehicle
    traveling less than 25 mph.
- id: 46
  category: signs_and_signals
  question: Which type of guide sign is square or rectangular, blue with white letters or symbols, and
    shows the location of gas stations or hospitals?
  choices:
    A: Destination Signs
    B: Service Signs
    C: Route Number Signs
    D: Regulatory Signs
  answer: B
  explanation: Service Signs are square or rectangular shaped and are blue with white letters or symbols.
    They show the location of various services such as rest areas, gas stations, campgrounds or hospitals.
- id: 47
  category: signs_and_signals
  question: What does a solid white line between lanes of traffic moving in the same direction mean?
  choices:
    A: You may cross it freely to pass other vehicles.
    B: You should stay in your lane unless a special situation requires you to change lanes.
    C: The lane is ending and you must merge left.
    D: You are entering a reversible lane.
  answer: B
  explanation: A solid white line between lanes of traffic means that you should stay in your lane unless
    a special situation requires you to change lanes.
- id: 48
  category: safe_driving_rules
  question: When there is both a solid and a dashed yellow line between opposing lanes of traffic, when
    are you permitted to pass?
  choices:
    A: Only if the solid yellow line is on your side.
    B: Only if the dashed yellow line is on your side and it is safe to do so.
    C: You may pass regardless of which line is on your side.
    D: Passing is strictly prohibited for both directions.
  answer: B
  explanation: Where there is both a solid and a dashed yellow line between opposing lanes of traffic,
    you may not pass if the solid yellow line is on your side. If the dashed line is on your side, you
    may pass if it is safe to do so.
- id: 49
  category: safe_driving_rules
  question: Is it legal to cross a solid yellow line?
  choices:
    A: No, it is never legal to cross a solid yellow line.
    B: Yes, but only to pass a slow-moving vehicle.
    C: Yes, you may cross a solid yellow line to turn into a driveway if it is safe to do so.
    D: Yes, but only during daylight hours.
  answer: C
  explanation: 'The manual states: ''You may cross a solid yellow line to turn into a drive way if it
    safe to do so.'''
- id: 50
  category: signs_and_signals
  question: In a reversible lane, what does a flashing yellow 'X' indicate?
  choices:
    A: You can use the lane beneath it for regular travel.
    B: The lane is only for turning.
    C: You cannot use the lane.
    D: The use of the lane is changing and you should move out.
  answer: B
  explanation: In reversible lanes, special lights are often used. A flashing yellow 'X' means the lane
    is only for turning.
- id: 51
  category: sharing_the_road
  question: What does a sign indicating 'HOV 3' mean for a reserved lane?
  choices:
    A: There must be at least three people in the vehicle to use the lane.
    B: The speed limit in the lane is 30 mph.
    C: Only hybrid or electric vehicles may use the lane.
    D: The lane is reserved for heavy commercial vehicles with 3 or more axles.
  answer: A
  explanation: HOV stands for 'High Occupancy Vehicles'. The manual explains that 'HOV 3' means there
    must be at least three people in the vehicle.
- id: 52
  category: signs_and_signals
  question: How is a shared center lane, which is reserved for making left turns by vehicles traveling
    in both directions, marked on each side?
  choices:
    A: By double solid white lines.
    B: By a solid yellow and dashed yellow line.
    C: By a single dashed white line.
    D: By double-dashed yellow lines.
  answer: B
  explanation: Shared center lanes are marked on each side by a solid yellow and dashed yellow line.
- id: 53
  category: safe_driving_rules
  question: According to general driving rules, when is the only time you should back a vehicle in any
    travel lane?
  choices:
    A: When you miss your turn or exit.
    B: When you need to let out a passenger.
    C: When you are parallel parking.
    D: When you are in a shared center lane.
  answer: C
  explanation: 'The manual states: ''Never back a vehicle in any travel lane except to parallel park.
    It is illegal and unsafe to do so.'''
- id: 54
  category: safe_driving_rules
  question: On a road with three or more lanes traveling in the same direction, which lane should you
    use if there is a lot of entering or exiting traffic?
  choices:
    A: The right lane.
    B: The left-most lane.
    C: The center travel lane.
    D: The shoulder.
  answer: C
  explanation: On a road with three or more lanes traveling in the same direction, if there is a lot
    of entering or exiting traffic, you should use the center travel lane.
- id: 55
  category: safe_driving_rules
  question: When making a turn where there are no signs or lane markings to control turning, how should
    you proceed?
  choices:
    A: Turn from the center lane into the right-most lane.
    B: Turn from the lane closest to the direction you want to go and turn into the lane closest to the
      one you came from.
    C: Swing wide to the opposite side before making the turn.
    D: Always turn into the left-most lane regardless of your starting position.
  answer: B
  explanation: Where there are no signs or lane markings to control turning, you should turn from the
    lane that is closest to the direction you want to go and turn into the lane closest to the one you
    came from to cross the fewest lanes of traffic.
- id: 56
  category: defensive_driving
  question: Why should you avoid swinging wide to the left before making a right turn?
  choices:
    A: It will cause your vehicle to lose traction.
    B: The driver behind you may think you are changing lanes or turning left and try to pass you on
      the right.
    C: It is illegal to cross the center line while turning right.
    D: It requires you to use a shared center lane inappropriately.
  answer: B
  explanation: On right turns, avoid swinging wide to the left before turning because the driver behind
    you may think you are changing lanes or going to turn left and may try to pass you on the right.
- id: 57
  category: safe_driving_rules
  question: What should you avoid doing when making a right turn?
  choices:
    A: Using your turn signal
    B: Swinging wide to the left before turning
    C: Staying in your designated lane
    D: Slowing down before the intersection
  answer: B
  explanation: On right turns, avoid swinging wide to the left before turning. If you swing wide, the
    driver behind you may think you are changing lanes or going to turn left and may try to pass you
    on the right.
- id: 58
  category: sharing_the_road
  question: Under the White Cane Law, what must a driver do when approaching a blind pedestrian carrying
    a white or metallic cane?
  choices:
    A: Honk the horn to alert the pedestrian of the vehicle's presence
    B: Yield only if the pedestrian is in a marked crosswalk
    C: Take all necessary precautions to avoid injury to the pedestrian
    D: Maintain speed but steer around the pedestrian
  answer: C
  explanation: The driver of a vehicle approaching a totally or partially blind pedestrian carrying a
    white or metallic cane (or using a guide dog) shall take all necessary precautions to avoid injury
    to such blind pedestrian.
- id: 59
  category: safe_driving_rules
  question: If two vehicles arrive at a 4-way stop at the exact same time, who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a faster speed
    D: The vehicle that intends to turn left
  answer: B
  explanation: At a 4-way stop, the driver reaching the intersection first goes first. If more than one
    vehicle arrives at the same time, the vehicle on the right goes first.
- id: 60
  category: safe_driving_rules
  question: What should you do if you are in the middle of an intersection when an emergency vehicle
    approaches with its siren and flashing lights on?
  choices:
    A: Stop immediately in the center of the intersection
    B: Pull over to the right edge of the intersection
    C: Drive through the intersection before you pull over to the right
    D: Put your vehicle in reverse and back out of the intersection
  answer: C
  explanation: If you are in an intersection, drive through the intersection before you pull over for
    an approaching emergency vehicle.
- id: 61
  category: sharing_the_road
  question: When are you NOT required to stop for a school bus with its red lights flashing?
  choices:
    A: When the bus is on the opposite side of a standard two-lane road
    B: When you are approaching the bus at an intersection
    C: When the bus is traveling towards you and the roadway is separated by a median or physical barrier
    D: When you are traveling at a speed of less than 15 mph
  answer: C
  explanation: You are not required to stop if the bus is traveling towards you and the roadway is separated
    by a median or other physical barrier.
- id: 62
  category: safe_driving_rules
  question: What is the maximum speed limit in a business or residential area in New Mexico, unless posted
    otherwise?
  choices:
    A: 15 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: The maximum speed limit is 30 mph in business or residential areas, unless posted otherwise.
- id: 63
  category: safe_driving_rules
  question: What is the maximum speed limit on rural interstate highways, unless posted otherwise?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: D
  explanation: The maximum speed limit is 75 mph on rural interstate highways, unless posted otherwise.
- id: 64
  category: vehicle_information
  question: How should you position your vehicle's wheels when parking on a hill?
  choices:
    A: Keep them perfectly straight
    B: Turn them sharply towards the side of the road or curb
    C: Turn them sharply away from the curb
    D: Turn them slightly towards the center of the road
  answer: B
  explanation: When you park on a hill, turn your wheels sharply towards the side of the road or curb.
    This way, if your vehicle starts to roll downhill, it will roll away from traffic.
- id: 65
  category: safe_driving_rules
  question: You may not legally park your vehicle within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: According to the No-Parking Zones rules, you may not park within 15 ft. of a fire hydrant.
- id: 66
  category: safe_driving_rules
  question: What is the maximum distance your parked vehicle can be from the curb?
  choices:
    A: 12 inches
    B: 15 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: You may not park more than 18 in. from the curb.
- id: 67
  category: signs_and_signals
  question: What does a red painted curb indicate?
  choices:
    A: Only short stops are permitted
    B: It is a loading zone
    C: Handicap parking only
    D: A fire zone with no parking or standing permitted
  answer: D
  explanation: A red painted curb indicates a fire zone with no parking or standing permitted.
- id: 68
  category: penalties_and_points
  question: What is the penalty if a driver accumulates twelve or more points on their driving record
    within a twelve-month period?
  choices:
    A: A 30-day license suspension
    B: A 6-month license suspension
    C: A one-year license suspension
    D: Permanent revocation of the driver's license
  answer: C
  explanation: If a driver has twelve or more points within a twelve-month period, their driver's license
    will be suspended for one year.
- id: 69
  category: defensive_driving
  question: According to the manual, what are the recommended balanced positions for your hands on the
    steering wheel?
  choices:
    A: 10 o'clock and 2 o'clock, or 9 o'clock and 3 o'clock
    B: 11 o'clock and 1 o'clock
    C: 8 o'clock and 4 o'clock
    D: One hand at the 12 o'clock position
  answer: A
  explanation: One balanced position for steering control is at the 10 o'clock and 2 o'clock positions.
    Some drivers prefer placing their hands at 9 and 3 o'clock.
- id: 70
  category: safe_driving_rules
  question: What must you do before entering an intersection if traffic ahead is backed up?
  choices:
    A: Enter the intersection and wait for traffic to clear
    B: Honk your horn to encourage traffic to move faster
    C: Wait until traffic ahead clears so you do not block the intersection
    D: Pull into the crosswalk and stop
  answer: C
  explanation: Drivers may not enter an intersection unless they can get through it without having to
    stop. You should wait until traffic ahead clears so that you are not blocking the intersection.
- id: 71
  category: safe_driving_rules
  question: At an intersection where there is no stop sign, yield sign, or traffic signal, who must you
    yield to?
  choices:
    A: Vehicles coming from the left
    B: Vehicles coming from the right
    C: Vehicles turning left
    D: Vehicles traveling at a faster speed
  answer: B
  explanation: At an intersection where there is no stop sign, yield sign or traffic signal, drivers
    must yield to vehicles coming from the right.
- id: 72
  category: vehicle_information
  question: When completing a sharp turn, how should you straighten the steering wheel?
  choices:
    A: Let it slip through your fingers
    B: Straighten it out by hand
    C: Use only your left hand
    D: Take your hands off the wheel briefly
  answer: B
  explanation: According to the manual, when you complete a turn, you should straighten out the steering
    wheel by hand. Letting it slip through your fingers could be dangerous.
- id: 73
  category: safe_driving_rules
  question: Why is it important to check your speedometer often?
  choices:
    A: To ensure your vehicle is not running out of gas
    B: Because people are not very good at judging how fast they are going
    C: To calibrate your dashboard lights
    D: Because speedometers frequently malfunction on local roads
  answer: B
  explanation: The manual advises checking the speedometer often because people are not very good at
    judging how fast they are going, making it easy to travel much faster than you think.
- id: 74
  category: defensive_driving
  question: What is a potential consequence of braking quickly and stopping suddenly?
  choices:
    A: You will save on fuel
    B: You could skid and lose control of your vehicle
    C: You will improve your steering alignment
    D: You will make it easier for drivers behind you to stop
  answer: B
  explanation: The manual warns that when you brake quickly, you could skid and lose control of your
    vehicle, and it makes it harder for drivers behind you to stop without hitting you.
- id: 75
  category: defensive_driving
  question: How far ahead do safer drivers tend to look when driving?
  choices:
    A: At least 2 seconds ahead
    B: At least 5 seconds ahead
    C: At least 10 seconds ahead
    D: At least 20 seconds ahead
  answer: C
  explanation: The manual states that safer drivers tend to look at least 10 seconds ahead of their vehicle.
- id: 76
  category: defensive_driving
  question: 'When driving in city traffic, looking 10 seconds ahead is equivalent to looking about:'
  choices:
    A: One car length
    B: One block
    C: One mile
    D: Three blocks
  answer: B
  explanation: According to the manual, in the city, 10 seconds is about one block. When driving in city
    traffic, you should try to look at least one block ahead.
- id: 77
  category: safe_driving_rules
  question: If you are stopped at an intersection and your view of a cross street is blocked, what should
    you do?
  choices:
    A: Accelerate quickly to clear the intersection
    B: Honk your horn and proceed at normal speed
    C: Edge forward slowly until you can see
    D: Wait for another vehicle to turn first
  answer: C
  explanation: The manual instructs that if you are stopped and your view of a cross street is blocked,
    you should edge forward slowly until you can see, giving crossing drivers a chance to see you.
- id: 78
  category: safe_driving_rules
  question: According to the manual, when are you allowed to turn left from a one-way street into another
    one-way street?
  choices:
    A: Only on a green arrow
    B: Unless it is prohibited
    C: Only if there are no pedestrians present
    D: Never
  answer: B
  explanation: The manual states, "You may also turn left from a one-way street into another one-way
    street unless prohibited."
- id: 79
  category: safe_driving_rules
  question: What should you do at a railroad crossing with more than one track after a train has passed?
  choices:
    A: Cross immediately behind the train to save time
    B: Wait until the passing train is well down the track before starting to cross
    C: Proceed at the posted speed limit without stopping
    D: Honk your horn to warn any hidden trains
  answer: B
  explanation: At crossings with more than one track, the manual advises to wait until the passing train
    is well down the track before starting to cross because another train may be hidden by the one that
    just passed.
- id: 80
  category: defensive_driving
  question: Why must you turn your head and look over your shoulder before changing lanes?
  choices:
    A: To check for vehicles in your blind spots that you cannot see through your mirrors
    B: To ensure your rear window is clear of debris
    C: To communicate with drivers behind you
    D: To check the speed of the vehicle directly behind you
  answer: A
  explanation: The manual explains that you must turn your head and look over your shoulder to see vehicles
    in your "blind spots" because you cannot see these areas through your mirrors.
- id: 81
  category: defensive_driving
  question: 'When checking traffic to the sides, rear, or over your shoulder to change lanes, you should:'
  choices:
    A: Stare at the blind spot until it is completely clear
    B: Check quickly so you do not take your eyes off the road ahead for more than an instant
    C: Rely solely on your rearview mirror
    D: Turn your whole body around in the driver's seat
  answer: B
  explanation: The manual advises to "Check quickly. Do not take your eyes off the road ahead for more
    than an instant" because traffic ahead could stop suddenly.
- id: 82
  category: vehicle_information
  question: What is the proper technique for looking behind your vehicle when backing up?
  choices:
    A: Rely entirely on your rearview and side mirrors
    B: Use your backup camera exclusively
    C: Place your right arm on the back of the seat and turn around to look directly through the rear
      window
    D: Open the driver's side door and look backward
  answer: C
  explanation: The manual instructs drivers to place their right arm on the back of the seat and turn
    around to look directly through the rear window, rather than depending on mirrors.
- id: 83
  category: defensive_driving
  question: 'Before you get into your vehicle to back up, you should:'
  choices:
    A: Honk your horn twice
    B: Check behind your vehicle because children or small objects cannot be seen from the driver's seat
    C: Turn on your hazard lights
    D: Rev the engine to warn pedestrians
  answer: B
  explanation: The manual states you should check behind your vehicle before you get in because children
    or small objects cannot be seen from the driver's seat.
- id: 84
  category: defensive_driving
  question: When going down a long or steep hill, why is it important to check your mirrors?
  choices:
    A: To admire the scenery behind you
    B: Because vehicles, especially large trucks and buses, often build up speed and may be going too
      fast
    C: To see if your brake lights are working
    D: Because it is illegal to coast down a hill
  answer: B
  explanation: The manual advises checking mirrors when going down hills because vehicles often build
    up speed, and you should be alert for large trucks and buses that may be going too fast.
- id: 85
  category: defensive_driving
  question: 'Looking well down the road helps you do all of the following EXCEPT:'
  choices:
    A: Avoid last minute braking
    B: Save on fuel
    C: Steer straighter with less weaving
    D: Eliminate your vehicle's blind spots
  answer: D
  explanation: The manual states that looking well ahead helps you avoid last minute braking, save on
    fuel, keep traffic moving, and steer straighter. It does not eliminate blind spots, which must be
    checked by looking over your shoulder.
- id: 86
  category: safe_driving_rules
  question: When should you dim your high beam headlights when an oncoming vehicle is approaching?
  choices:
    A: Within 500 feet of the vehicle
    B: Within about a one-block distance
    C: Within 200 feet of the vehicle
    D: Only when the other driver flashes their headlights
  answer: B
  explanation: The manual states to dim your high beams whenever you come within about a one-block distance
    of an oncoming vehicle.
- id: 87
  category: safe_driving_rules
  question: Why should you use low beam headlights instead of high beams in fog, snow, or hard rain?
  choices:
    A: High beams will drain the battery faster in cold weather.
    B: Low beams are required by law in all precipitation.
    C: Light from high beams will reflect back, causing glare and making it harder to see.
    D: High beams can temporarily blind drivers behind you.
  answer: C
  explanation: The manual explains that in fog, snow, or hard rain, light from high beams will reflect
    back, causing glare and making it more difficult to see ahead.
- id: 88
  category: safe_driving_rules
  question: What is a good rule of thumb regarding headlights on rainy, snowy, or foggy days?
  choices:
    A: If you turn on your wipers, turn on your headlights.
    B: Only use parking lights to save battery power.
    C: Use high beams to cut through the precipitation.
    D: Turn on your hazard lights while driving.
  answer: A
  explanation: 'The manual states that on rainy, snowy, or foggy days, headlights make your vehicle easier
    to see, and reminds drivers: ''if you turn on your wipers, turn on your headlights.'''
- id: 89
  category: defensive_driving
  question: In which of the following situations should you use a SHARP BLAST on your horn?
  choices:
    A: When you are passing a driver who starts to turn into your lane.
    B: When coming to a place where you cannot see what is ahead.
    C: When a child or older person is about to walk, run or ride into the street.
    D: When a person on a bike appears to be moving into your lane.
  answer: C
  explanation: The manual advises using a sharp blast on your horn when there is danger, such as when
    a child or older person is about to walk, run, or ride into the street. The other situations only
    require a light tap.
- id: 90
  category: defensive_driving
  question: If your vehicle breaks down and you have to stop, where should you try to place your vehicle?
  choices:
    A: Just over a hill so it is out of the way of the wind.
    B: Just around a curve to avoid straight-line traffic.
    C: In the traffic lane with your emergency flashers on.
    D: Off the road and away from traffic if at all possible.
  answer: D
  explanation: If you are having vehicle trouble, the manual instructs to get your vehicle off the road
    and away from traffic if at all possible, and to avoid stopping just over a hill or around a curve.
- id: 91
  category: sharing_the_road
  question: Why should you never stay alongside a large vehicle such as a truck or bus?
  choices:
    A: They travel at much higher speeds than passenger cars.
    B: These vehicles have large blind spots and it is hard for their drivers to see you.
    C: They are more likely to have tire blowouts.
    D: They emit exhaust fumes that can obscure your vision.
  answer: B
  explanation: The manual warns to never stay alongside a large vehicle such as a truck or bus because
    these vehicles have large blind spots and it is hard for drivers of large vehicles to see you.
- id: 92
  category: safe_driving_rules
  question: How far in advance should you signal before you make a turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: According to the manual, you should signal at least 100 feet before you make your turn.
- id: 93
  category: defensive_driving
  question: If another vehicle is about to enter the street between you and where you plan to turn, when
    should you signal?
  choices:
    A: As soon as you see the other vehicle.
    B: At least 500 feet before the intersection.
    C: Wait until you have passed the other vehicle to signal your turn.
    D: Signal immediately and honk your horn.
  answer: C
  explanation: The manual states that if another vehicle is about to enter the street between you and
    your turn, you should wait until you have passed it to signal. Otherwise, the other driver may think
    you plan to turn where they are and pull into your path.
- id: 94
  category: vehicle_information
  question: When navigating a curve, when is the best time to slow down?
  choices:
    A: While you are in the middle of the curve.
    B: Just as you begin to exit the curve.
    C: Always slow down before you enter the curve.
    D: You should maintain a constant speed throughout the curve.
  answer: C
  explanation: The manual advises to always slow down before you enter a curve so you do not have to
    brake in the curve, which can cause the vehicle to skid.
- id: 95
  category: safe_driving_rules
  question: How much should you reduce your speed when driving on a wet road?
  choices:
    A: About 5 mph
    B: About 10 mph
    C: Cut your speed in half
    D: Slow to a crawl
  answer: B
  explanation: The manual states that on a wet road you should reduce your speed about 10 mph. Packed
    snow requires cutting speed in half, and ice requires slowing to a crawl.
- id: 96
  category: defensive_driving
  question: Why can overpasses and bridges be icy even when other pavement is not?
  choices:
    A: They are usually made of concrete instead of asphalt.
    B: They collect more moisture from the air.
    C: They do not have earth underneath them to help insulate against the cold.
    D: They are exposed to more direct sunlight which melts and refreezes ice.
  answer: C
  explanation: The manual explains that bridges do not have earth underneath them to help insulate them
    against the cold, so they can be colder and icier than other roadways.
- id: 97
  category: defensive_driving
  question: Why can the pavement be very slippery for the first few minutes when it starts to rain on
    a hot day?
  choices:
    A: The rain mixes with dust to form a thick mud.
    B: Heat causes the oil in the asphalt to come to the surface.
    C: The sudden temperature change causes the asphalt to contract.
    D: The water boils on the hot surface, creating a vapor barrier.
  answer: B
  explanation: According to the manual, if it starts to rain on a hot day, heat causes the oil in the
    asphalt to come to the surface, making the road more slippery until the oil is washed off.
- id: 98
  category: vehicle_information
  question: At what speed can your tires lose all traction with the road during a heavy rain (hydroplaning)?
  choices:
    A: About 35 mph
    B: About 45 mph
    C: About 50 mph
    D: About 65 mph
  answer: C
  explanation: The manual states that in a heavy rain, your tires can lose all traction with the road
    at about 50 mph. Hydroplaning starts around 35 mph.
- id: 99
  category: safe_driving_rules
  question: When is it appropriate to drive with only your parking lights on?
  choices:
    A: When driving in heavy fog.
    B: Just before sunrise or just after sunset.
    C: When approaching another car within 500 feet.
    D: Never; parking lights are for parking only.
  answer: D
  explanation: 'The manual explicitly states: ''Do not drive at any time with only your parking lights
    on. Parking lights are for parking only.'''
- id: 100
  category: safe_driving_rules
  question: Which of the following is a recommended practice when backing up your vehicle?
  choices:
    A: Back up quickly to minimize the time spent in reverse.
    B: Rely solely on your rearview mirror.
    C: Use a person outside the vehicle to help you back whenever possible.
    D: Turn on your high beams to see better behind you.
  answer: C
  explanation: The manual recommends to back slowly because the vehicle is harder to steer, and to 'whenever
    possible, use a person outside the vehicle to help you back.'
- id: 101
  category: defensive_driving
  question: What should you do if it feels like your tires have lost traction with the road surface?
  choices:
    A: Slam on the brakes immediately
    B: Ease your foot off the gas pedal and keep the steering wheel straight
    C: Turn the steering wheel sharply to regain control
    D: Accelerate to push through the water
  answer: B
  explanation: If your tires lose traction, the manual advises to ease your foot off the gas pedal, keep
    the steering wheel straight, and not try to stop or turn until your tires grip the road again.
- id: 102
  category: defensive_driving
  question: At what times of day are many wild animals most active and likely to cross the road?
  choices:
    A: Mid-morning and early afternoon
    B: High noon
    C: Dawn, dusk, and the first few hours after darkness
    D: Only during the darkest hours of midnight to 3 AM
  answer: C
  explanation: The manual states to be especially watchful for wildlife at dawn, dusk, and in the first
    few hours after darkness falls, as many animals are most active at these times.
- id: 103
  category: safe_driving_rules
  question: How do animals with hooves, such as deer, typically react on slick road surfaces?
  choices:
    A: They speed up to cross faster
    B: They often slow down
    C: They completely freeze and lie down
    D: They immediately turn around and run back
  answer: B
  explanation: The manual notes that animals with hooves, such as deer, often slow down on slick surfaces,
    so drivers should be ready to slow down to let them cross.
- id: 104
  category: safe_driving_rules
  question: When using a ramp to enter a high-speed roadway, why should you avoid driving to the end
    of the ramp and stopping?
  choices:
    A: You will not have enough room to get up to the speed of traffic
    B: It is illegal to stop on any highway ramp
    C: Your vehicle's brakes will overheat
    D: You will be forced to exit the highway immediately
  answer: A
  explanation: The manual warns not to drive to the end of the ramp and stop, or you will not have enough
    room to get up to the speed of traffic and drivers behind you will not expect you to stop.
- id: 105
  category: safe_driving_rules
  question: When leaving a main road that has exit ramps, when is the best time to slow down?
  choices:
    A: A quarter-mile before the exit ramp
    B: As soon as you see the exit sign
    C: Only after you move onto the exit ramp
    D: While you are still in the main traffic lane
  answer: C
  explanation: The manual instructs that if the road you are traveling has exit ramps, do not slow down
    until you move onto the exit ramp.
- id: 106
  category: safe_driving_rules
  question: Under good conditions, approximately how many feet does it take to react and bring your vehicle
    to a complete stop when traveling at 50 mph?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 400 feet
  answer: D
  explanation: The manual states that at 50 mph, it can take about 400 feet to react to something you
    see and bring your vehicle to a stop.
- id: 107
  category: safe_driving_rules
  question: About how many feet does it take to stop your vehicle when driving at 30 mph on dry pavement?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 400 feet
  answer: C
  explanation: According to the manual, at 30 mph, it can take about 200 feet to stop, which is almost
    half a city block in length.
- id: 108
  category: vehicle_information
  question: Approximately how far ahead will your headlights let you see at night?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 600 feet
  answer: C
  explanation: The manual explains that your headlights will let you see about 400 feet ahead, and you
    should drive at a speed that allows you to stop within this distance.
- id: 109
  category: safe_driving_rules
  question: If heavy rain, snow, or thick fog limits your visibility to 200 feet ahead, what is the maximum
    safe driving speed?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: When you cannot see any farther than 200 feet ahead due to heavy rain, snowstorm, or thick
    fog, you cannot safely drive faster than 30 mph.
- id: 110
  category: defensive_driving
  question: Which rule should you use to determine if you are driving too fast for your sight-distance
    conditions?
  choices:
    A: The Two-Second Rule
    B: The Three-Second Rule
    C: The Four-Second Sight Distance Rule
    D: The One-Car-Length Rule
  answer: C
  explanation: To tell if you are driving too fast for conditions, the manual recommends using the 'Four
    Second Sight Distance Rule'.
- id: 111
  category: safe_driving_rules
  question: What rule should you use to ensure you are not following the vehicle ahead of you too closely?
  choices:
    A: The two-second rule
    B: The three-second rule
    C: The four-second sight distance rule
    D: The ten-second rule
  answer: B
  explanation: To avoid rear-end crashes and tell if you are following too closely, the manual states
    to use the 'three-second rule,' which works at any speed.
- id: 112
  category: sharing_the_road
  question: What should you do if you are driving slower than other traffic and vehicles begin to pile
    up behind you?
  choices:
    A: Speed up to exceed the speed limit
    B: Tap your brakes repeatedly to warn them to back off
    C: Pull over when safe to do so and let them pass
    D: Maintain your speed and stay in the center of the lane
  answer: C
  explanation: The manual advises that if vehicles are piled-up behind you because you are going slower
    than other traffic, you should pull over when safe to do so and let them pass.
- id: 113
  category: defensive_driving
  question: Why are toll plazas considered 'trouble spots' where you may need to slow down?
  choices:
    A: Because toll booths are often unstaffed
    B: Because vehicles are frequently changing lanes, stopping, and speeding up again
    C: Because the speed limit automatically drops to 10 mph
    D: Because pedestrians are usually crossing the highway
  answer: B
  explanation: Toll plazas are trouble spots because vehicles are changing lanes, preparing to stop,
    and then speeding up again when leaving the plaza.
- id: 114
  category: safe_driving_rules
  question: What is the recommended method to determine if you are following a vehicle too closely?
  choices:
    A: The two-car-length rule
    B: The three-second rule
    C: The four-second rule
    D: The five-second rule
  answer: B
  explanation: The manual states there is an easy way to tell if you are following too closely called
    the 'three-second rule,' which works at any speed.
- id: 115
  category: safe_driving_rules
  question: In which of the following situations should you increase your following distance to at least
    four seconds?
  choices:
    A: When driving on a newly paved road
    B: When following a motorcycle
    C: When driving in a residential neighborhood
    D: When passing a large truck
  answer: B
  explanation: The manual specifies that you may need a four-second following distance to be safe in
    certain situations, such as when following motorcycles, driving on slippery roads, or pulling a trailer.
- id: 116
  category: defensive_driving
  question: How large of a gap do you need whenever you want to merge with other traffic, change lanes,
    or enter a roadway?
  choices:
    A: About two seconds
    B: About three seconds
    C: About four seconds
    D: About six seconds
  answer: C
  explanation: According to the manual, anytime you want to merge with other traffic, change lanes, or
    enter a roadway, you need a gap of about four seconds.
- id: 117
  category: safe_driving_rules
  question: What should you do if you have a green light but there are vehicles blocking the intersection
    ahead?
  choices:
    A: Proceed into the intersection and wait for the vehicles to move.
    B: Honk your horn to alert the blocking vehicles.
    C: Do not start across the intersection until the vehicles clear your way.
    D: Turn right instead of going straight.
  answer: C
  explanation: The manual states, 'Even if you have the green light, do not start across the intersection
    if there are vehicles blocking your way.'
- id: 118
  category: safe_driving_rules
  question: At a speed of 55 mph, approximately how much time do you need to pass an oncoming vehicle
    safely?
  choices:
    A: 3 seconds
    B: 5 seconds
    C: 10 seconds
    D: 15 seconds
  answer: C
  explanation: The manual notes that at a speed of 55 mph, you need about 10 seconds to pass, meaning
    you need a 10-second gap in oncoming traffic.
- id: 119
  category: defensive_driving
  question: You should not start to pass a vehicle if you are within what distance of a hill or curve?
  choices:
    A: One-quarter of a mile
    B: One-third of a mile
    C: One-half of a mile
    D: One mile
  answer: B
  explanation: The manual states you should not start to pass if you are within one-third of a mile of
    a hill or curve, as you must be able to see at least that far ahead.
- id: 120
  category: safe_driving_rules
  question: When is it safe to return to the driving lane after passing another vehicle?
  choices:
    A: When you are one car length ahead of the passed vehicle.
    B: When you can see both headlights of the passed vehicle in your rear-view mirror.
    C: As soon as your rear bumper clears the front of the passed vehicle.
    D: When the driver of the passed vehicle flashes their headlights.
  answer: B
  explanation: The manual instructs that it is safe to return to the driving lane when you can see both
    headlights of the vehicle you just passed in your rear-view mirror.
- id: 121
  category: sharing_the_road
  question: What is the minimum safe distance motor vehicle drivers should try to keep when passing a
    bicyclist?
  choices:
    A: Two feet
    B: Three feet
    C: Four feet
    D: Five feet
  answer: D
  explanation: Motor vehicle drivers are required to keep a safe distance when passing a bicyclist, trying
    for at least five feet.
- id: 122
  category: sharing_the_road
  question: What should you do if you need to make a right turn immediately after passing a bicyclist
    on your right?
  choices:
    A: Speed up and make a sudden right turn in front of the bicyclist.
    B: Honk to warn the bicyclist before making the turn.
    C: Slow down and merge behind the bicyclist before turning.
    D: Stop in the travel lane and wait for the bicyclist to turn first.
  answer: C
  explanation: 'The manual explicitly states: ''Do not make a sudden right turn after passing a bicyclist
    on your right. Instead, slow down and merge behind the bicyclist before turning.'''
- id: 123
  category: sharing_the_road
  question: What do 'sharrows' painted on the pavement indicate?
  choices:
    A: The road is closed to bicycle traffic.
    B: Bicyclists must ride on the sidewalk.
    C: The road is too narrow for side-by-side sharing and bicyclists are encouraged to take the whole
      lane.
    D: Motorists have the exclusive right-of-way in that lane.
  answer: C
  explanation: Sharrows indicate that a road is too narrow for side-by-side road sharing, bicyclists
    are encouraged to take the whole travel lane, and motorists shall yield to them.
- id: 124
  category: vehicle_information
  question: Approximately how long could it take a large truck going 55 mph to stop?
  choices:
    A: 200 feet
    B: 400 feet
    C: 600 feet
    D: Almost 800 feet
  answer: D
  explanation: According to the manual, while an average car going 55 mph can stop in about 400 feet,
    a large truck could take almost 800 feet to stop.
- id: 125
  category: sharing_the_road
  question: Why should you wait a second and check a large truck's turn signals again if you think it
    is turning left?
  choices:
    A: The truck may be swinging wide to make a right turn.
    B: The truck driver may be signaling for a lane change instead.
    C: The truck's turn signals are often broken.
    D: The truck is preparing to stop and back up.
  answer: A
  explanation: Big trucks often swing wide to make a right turn. The manual advises to check the signals
    again because the driver may really be turning right, even if it looks like they are turning left.
- id: 126
  category: sharing_the_road
  question: What is a good general rule to determine if you are driving in a trucker's blind spot?
  choices:
    A: If you are within 50 feet of the rear of the truck, you are in a blind spot.
    B: If you cannot see the driver in the truck's side mirror, the driver cannot see you.
    C: If you are driving on the left side of the truck, you are in a blind spot.
    D: If you can see the truck's headlights in your rearview mirror, you are in a blind spot.
  answer: B
  explanation: The manual states, 'In general, if you can’t see the driver in the side mirror, the driver
    can’t see you.'
- id: 127
  category: sharing_the_road
  question: On which side should you always pass a large truck or RV?
  choices:
    A: On the right side
    B: On the left side
    C: On the side with the widest shoulder
    D: On whichever side has the least traffic
  answer: B
  explanation: The manual explicitly instructs drivers to 'Always pass a large truck or RV on the left
    side.'
- id: 128
  category: sharing_the_road
  question: What is the rule regarding bicycle helmets in New Mexico?
  choices:
    A: Only adults are required to wear helmets.
    B: Helmets are optional for all riders.
    C: Adults should, and minors must, wear a well-fitting helmet.
    D: Helmets are only required when riding at night.
  answer: C
  explanation: The manual states under Special Considerations for Bicycling in Traffic that 'Adults should,
    and minors must, wear a well-fitting helmet.'
- id: 129
  category: sharing_the_road
  question: What is the proper way to pass a large truck or RV?
  choices:
    A: Pass on the right and stay in the blind spot.
    B: Pass on the left and move ahead of it.
    C: Tailgate until the truck changes lanes.
    D: Honk your horn and pass on either side.
  answer: B
  explanation: The manual states to always pass a large truck or RV on the left side, and after passing,
    move ahead of it without staying in the driver's blind spot.
- id: 130
  category: sharing_the_road
  question: 'When driving near a big truck or RV, you should remember that:'
  choices:
    A: They can stop much faster than passenger cars.
    B: They may look like they are going more slowly than they actually are.
    C: They have smaller blind spots than standard vehicles.
    D: They always have the right-of-way on highways.
  answer: B
  explanation: The manual notes to remember that a big truck or RV may look like it is going more slowly
    than it actually is.
- id: 131
  category: driver_testing
  question: To pass the vision test for a New Mexico driver license, what is the minimum visual acuity
    required?
  choices:
    A: 20/20 in both eyes
    B: 20/30 in at least one eye
    C: 20/40 in at least one eye
    D: 20/50 in both eyes
  answer: C
  explanation: New Mexico requires that you have at least 20/40 vision in at least one eye, with or without
    corrective lenses.
- id: 132
  category: safe_driving_rules
  question: Why should you avoid wearing dark glasses or tinted contact lenses at night?
  choices:
    A: They increase the glare from oncoming headlights.
    B: They cut down the light that you need to see clearly.
    C: They cause your eyes to become fatigued more quickly.
    D: They are illegal to wear while driving in New Mexico.
  answer: B
  explanation: The manual states to avoid using dark glasses or tinted contact lenses at night because
    they cut down the light that you need to see clearly.
- id: 133
  category: defensive_driving
  question: 'To help prevent getting tired on a long trip, the manual recommends that you:'
  choices:
    A: Eat a large meal before you leave so you don't get hungry.
    B: Eat lightly, as some people get sleepy after a big meal.
    C: Rely on coffee and energy drinks to stay awake.
    D: Drive as fast as legally possible to shorten the trip.
  answer: B
  explanation: The manual advises to eat lightly and not to eat a large meal before you leave, because
    some people get sleepy after they eat a big meal.
- id: 134
  category: alcohol_drugs_health
  question: How long does it typically take for alcohol to reach your brain after consumption?
  choices:
    A: 5 to 10 minutes
    B: 20 to 40 minutes
    C: 1 to 2 hours
    D: 3 to 4 hours
  answer: B
  explanation: According to the manual, alcohol goes from your stomach into your blood and reaches your
    brain in 20 to 40 minutes.
- id: 135
  category: alcohol_drugs_health
  question: Which of the following contains the same amount of alcohol as a 12 oz. can of beer?
  choices:
    A: A 5 oz. glass of wine
    B: An 8 oz. glass of wine
    C: A 3 oz. shot of 80-proof liquor
    D: A 12 oz. wine cooler
  answer: A
  explanation: The manual states that one alcoholic drink is 1 1/2 oz. of 80-proof liquor, 12 oz. of
    beer, or a 5 oz. glass of wine.
- id: 136
  category: alcohol_drugs_health
  question: What is the only effective way to sober up after drinking alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Getting fresh air and exercise
    D: Allowing time to pass
  answer: D
  explanation: The manual explicitly states that coffee, fresh air, exercise, or cold showers will not
    help, and that time is the only thing that will sober you up.
- id: 137
  category: penalties_and_points
  question: 'In New Mexico, if you are under 21 years of age, you can be arrested for driving with a
    blood alcohol content (BAC) of at least:'
  choices:
    A: .00%
    B: .02%
    C: .04%
    D: .08%
  answer: B
  explanation: The manual states that in New Mexico, if you are under 21, you can be arrested for a BAC
    at .02%.
- id: 138
  category: penalties_and_points
  question: What is the penalty if a police officer asks you to take a BAC test and you refuse?
  choices:
    A: You will receive a warning ticket.
    B: You will be fined $500 but keep your license.
    C: You can lose your driver license for one year.
    D: You will be required to take a defensive driving course.
  answer: C
  explanation: If a police or traffic officer asks you to take a BAC test and you refuse to do so, you
    can lose your driver license for one year.
- id: 139
  category: penalties_and_points
  question: How long will a DWI conviction remain on your driving record in New Mexico?
  choices:
    A: 5 years
    B: 10 years
    C: 15 years
    D: 25 years
  answer: D
  explanation: The manual states that any DWI conviction will remain on your driving record for twenty-five
    years.
- id: 140
  category: alcohol_drugs_health
  question: What is a potential danger of taking "uppers" or diet pills before driving?
  choices:
    A: They permanently improve your reflexes.
    B: They can cause you to become nervous, dizzy, and unable to concentrate later on.
    C: They lower your blood alcohol content.
    D: They cure motion sickness but cause temporary blindness.
  answer: B
  explanation: The manual explains that while pep pills and uppers can make a driver feel more alert
    for a short time, later they can cause a person to be nervous, dizzy, unable to concentrate, and
    affect vision.
- id: 141
  category: alcohol_drugs_health
  question: In New Mexico, what is required for a person with epilepsy to be issued a driver's license?
  choices:
    A: They must drive only during daylight hours.
    B: They must be stable and seizure-free for a 6-month period.
    C: They must have a licensed driver over 21 in the passenger seat.
    D: They must install an ignition interlock device.
  answer: B
  explanation: People with epilepsy must be stable and seizure-free for a 6-month period before being
    issued a driver's license.
- id: 142
  category: driver_responsibility
  question: What does the manual advise regarding cellular phone usage while driving?
  choices:
    A: It is safe as long as you keep one hand on the steering wheel.
    B: You should pull over to the side of the road to place or take a call whenever possible.
    C: You may only use a cell phone while driving on interstate highways.
    D: Texting is permitted if you are stopped at a red light.
  answer: B
  explanation: The manual advises to pull over to the side of the road to place or take a call whenever
    possible, as dialing or talking can be a dangerous distraction.
- id: 143
  category: penalties_and_points
  question: Which of the following is a consequence of your first DWI conviction?
  choices:
    A: You will be ordered to install an ignition interlock device on your vehicle.
    B: Your vehicle will be permanently confiscated by the state.
    C: You will only receive a warning if your BAC was under .10%.
    D: Your driving record will be cleared after 5 years of safe driving.
  answer: A
  explanation: For a first DWI conviction, you will pay stiff fines, could be sentenced to jail, and
    will be ordered to treatment and to install an ignition interlock device on your vehicle.
- id: 144
  category: safe_driving_rules
  question: What is the recommended action if you must use a cell phone while driving?
  choices:
    A: Drive slower while talking on the phone.
    B: Pull over to the side of the road to place or take a call whenever possible.
    C: Hold the phone with your left hand and steer with your right.
    D: Only dial numbers while stopped at a red light or stop sign.
  answer: B
  explanation: 'The manual states: ''Pull over to the side of the road to place or take a call whenever
    possible.'' It also notes that dialing or talking on a cell phone can be a dangerous distraction.'
- id: 145
  category: vehicle_information
  question: What is the first step you should take if your brakes suddenly stop working?
  choices:
    A: Shift into neutral immediately.
    B: Pull on the parking brake as hard and fast as you can.
    C: Pump the brake pedal several times.
    D: Turn off the engine to stop the vehicle.
  answer: C
  explanation: If your brakes stop working, the manual instructs to first 'Pump the brake pedal several
    times. This will often build up enough brake pressure to allow you to stop.'
- id: 146
  category: defensive_driving
  question: 'If a tire suddenly goes flat while you are driving, you should:'
  choices:
    A: Slam on the brakes to stop as quickly as possible.
    B: Hold the steering wheel tightly and keep the vehicle going straight.
    C: Turn the steering wheel sharply toward the shoulder of the road.
    D: Accelerate slightly to maintain control of the vehicle.
  answer: B
  explanation: In the event of a tire blowout, the manual advises to 'Hold the steering wheel tightly
    and keep the vehicle going straight,' and to slow down gradually by taking your foot off the gas
    and using the brakes lightly.
- id: 147
  category: vehicle_information
  question: What happens to your vehicle's controls if the engine dies while you are driving?
  choices:
    A: The steering wheel will lock completely and cannot be turned.
    B: The brakes will stop working entirely.
    C: The steering may be difficult to turn, but you can still turn it.
    D: The gas pedal will automatically apply the brakes.
  answer: C
  explanation: If there is a power failure and the engine dies, you should 'Keep a strong grip on the
    steering wheel. Be aware that the steering may be difficult to turn, but you can turn it.' The brakes
    will also still work but may require a very hard push.
- id: 148
  category: defensive_driving
  question: If your motor keeps going faster and faster because the gas pedal sticks, what should you
    do first?
  choices:
    A: Turn off the ignition immediately.
    B: Quickly shift to neutral.
    C: Apply the parking brake.
    D: Pump the gas pedal to unstick it.
  answer: B
  explanation: 'If the gas pedal sticks, the manual lists the steps in order: ''Keep your eyes on the
    road. Quickly shift to neutral. Pull off the road when safe to do so. Turn off the engine.'''
- id: 149
  category: defensive_driving
  question: When it looks like a collision may happen, what are a driver's three options to avoid it?
  choices:
    A: Stop, turn, or speed up.
    B: Brake, honk, or swerve.
    C: Stop, reverse, or honk.
    D: Accelerate, brake, or brace for impact.
  answer: A
  explanation: 'According to the manual, ''In avoiding a collision, drivers have three options: stop,
    turn or speed up.'''
- id: 150
  category: vehicle_information
  question: How should you brake if you need to stop quickly and your vehicle is equipped with an Antilock
    Braking System (ABS)?
  choices:
    A: Pump the brake pedal rapidly.
    B: Press on the brake pedal as hard as you can and keep pressing on it.
    C: Apply the brakes lightly and let up if you feel the pedal pushing back.
    D: Step on the brake pedal, let up, and then turn the steering wheel.
  answer: B
  explanation: With ABS, if you need to stop quickly, you should 'Press on the brake pedal as hard as
    you can and keep pressing on it.' You should not let up on the brake pedal even if you feel it pushing
    back.
- id: 151
  category: defensive_driving
  question: 'If your vehicle does NOT have ABS and you need to turn quickly to avoid a collision, you
    should:'
  choices:
    A: Lock up the front wheels while braking and turning.
    B: Step on the brake pedal, let up, and then turn the steering wheel.
    C: Turn the steering wheel as sharply as possible while holding the brake down.
    D: Accelerate while turning the steering wheel.
  answer: B
  explanation: Without ABS, to turn quickly you must 'step on the brake pedal, then let-up and turn the
    steering wheel. Braking will slow the vehicle, put more weight on the front tires, and allow for
    a quicker turn.'
- id: 152
  category: safe_driving_rules
  question: What is the primary cause of vehicle skids?
  choices:
    A: Under-inflated tires.
    B: Drivers traveling too fast for conditions.
    C: Pumping the brakes too slowly.
    D: Shifting gears too quickly.
  answer: B
  explanation: 'The manual explicitly states: ''Skids are caused by drivers traveling too fast for conditions.'''
- id: 153
  category: defensive_driving
  question: If your vehicle begins to skid, what should you do with the brakes?
  choices:
    A: Pump them rapidly.
    B: Press them firmly and hold them down.
    C: Stay off the brake until the vehicle slows.
    D: Apply the parking brake.
  answer: C
  explanation: If your vehicle begins to skid, the manual advises to 'Stay off the brake. Until the vehicle
    slows, your brakes will not work and could cause you to skid more.'
- id: 154
  category: defensive_driving
  question: If your vehicle is about to be hit from the front, what should you try to do?
  choices:
    A: Turn the vehicle to try and have a 'glancing blow.'
    B: Take your hands off the steering wheel to protect your face.
    C: Shift into reverse and accelerate.
    D: Unbuckle your seatbelt so you can exit quickly.
  answer: A
  explanation: If your vehicle is about to be hit from the front, 'it is important to try and have a
    "glancing blow" rather than being struck head on. This means that if a collision is going to happen,
    you should try to turn the vehicle.'
- id: 155
  category: driver_responsibility
  question: What should you do if you are involved in an accident and your vehicle can still move?
  choices:
    A: Leave it exactly where it is until the police arrive.
    B: Get it off the road so that it does not block traffic.
    C: Drive it to the nearest police station immediately.
    D: Park it across the traffic lanes to protect the scene.
  answer: B
  explanation: At the accident scene, you should 'Stop your vehicle at or near the accident site. If
    your vehicle can move, get it off the road so that it does not block traffic or cause another crash.'
- id: 156
  category: driver_responsibility
  question: If someone is injured in an accident, when is the ONLY time you should move them?
  choices:
    A: If they are blocking the roadway.
    B: If they ask you to help them stand up.
    C: If they are in a burning vehicle or other immediate danger.
    D: If you need to place them in your vehicle to keep them warm.
  answer: C
  explanation: 'The manual instructs: ''Do not move the injured unless they are in a burning vehicle
    or in other immediate danger of being hit by another vehicle. Moving a person can make their injuries
    worse.'''
- id: 157
  category: driver_responsibility
  question: How should you treat a person who is bleeding severely at an accident scene?
  choices:
    A: Give them plenty of water to drink.
    B: Apply pressure directly on the wound with your hand or a cloth.
    C: Move them to a sitting position immediately.
    D: Tie a tight tourniquet above the wound and leave it.
  answer: B
  explanation: If there is bleeding, 'apply pressure directly on the wound with your hand or with a cloth.
    Even severe bleeding can almost always be stopped or slowed by putting pressure on the wound.'
- id: 158
  category: defensive_driving
  question: How should you position your body if you are about to be hit from the rear?
  choices:
    A: Lean forward over the steering wheel.
    B: Turn your body to the side to brace for impact.
    C: Press yourself against the back of your seat and put your head against the head restraint.
    D: Duck down below the dashboard.
  answer: C
  explanation: If your vehicle is hit from the rear, your body will be thrown backwards. You should 'Press
    yourself against the back of your seat and put your head against the head restraint.'
- id: 159
  category: driver_responsibility
  question: What should you do to help prevent an injured person from going into shock after an accident?
  choices:
    A: Give them plenty of water to drink
    B: Cover them with a blanket or coat to keep them warm
    C: Have them stand up and walk around
    D: Apply a tourniquet above the injury
  answer: B
  explanation: To help prevent an injured person from going into shock, the manual advises to cover them
    with a blanket or coat to keep them warm.
- id: 160
  category: driver_responsibility
  question: 'If you are involved in an accident with a parked vehicle and cannot find the owner, you
    must:'
  choices:
    A: Wait by the vehicle until the owner returns
    B: Call a tow truck to remove the vehicle
    C: Leave a note in a visible place with your contact information and the date and time
    D: Drive away and report it to your insurance company later
  answer: C
  explanation: Should the accident involve a parked vehicle and you cannot find the owner, you must leave
    a note in a place where it can be seen with information on how the owner can reach you and the date
    and time of the accident.
- id: 161
  category: driver_responsibility
  question: Under New Mexico's Mandatory Financial Responsibility Act, what is the minimum insurance
    coverage required for injury to or destruction of property of others in any one accident?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: The minimum amount of coverage for injury to or destruction of property of others in any
    one accident is $10,000.
- id: 162
  category: driver_responsibility
  question: What is the minimum required liability insurance for bodily injury to or death of two or
    more persons in any one accident in New Mexico?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $75,000
  answer: C
  explanation: The law specifies a minimum coverage of $50,000 for bodily injury to or death of two or
    more persons in any one accident.
- id: 163
  category: penalties_and_points
  question: Which of the following is a possible consequence of failing to have motor vehicle liability
    insurance?
  choices:
    A: Mandatory community service
    B: Suspension of your vehicle registration and surrender of license plates
    C: Immediate revocation of your driver's license for five years
    D: Confiscation of your vehicle by the state
  answer: B
  explanation: Failure to have insurance could result in non-issuance or suspension of your vehicle registration,
    and surrender of the license plates, as well as possible criminal penalties.
- id: 164
  category: vehicle_information
  question: How much of a motorcycle's total stopping power can the front brake provide?
  choices:
    A: One-quarter
    B: One-half
    C: Three-quarters
    D: All of it
  answer: C
  explanation: The front brake is more powerful and can provide as much as three-quarters of your total
    stopping power.
- id: 165
  category: safe_driving_rules
  question: 'When slowing or stopping a motorcycle, you should:'
  choices:
    A: Use only the rear brake for normal stops
    B: Use only the front brake to prevent skidding
    C: Apply both the front and rear brakes at the same time
    D: Apply the rear brake first, followed by the front brake
  answer: C
  explanation: You should use both brakes every time you slow or stop, and apply both brakes at the same
    time.
- id: 166
  category: defensive_driving
  question: Why should motorcyclists avoid riding next to cars or trucks in other lanes?
  choices:
    A: It reduces the motorcycle's fuel efficiency
    B: The motorcycle might be in the car's blind spot and have its escape route blocked
    C: It is illegal to ride parallel to a car in New Mexico
    D: The wind blast from the car will cause the motorcycle to stall
  answer: B
  explanation: You might be in the blind spot of a car in the next lane, which could switch into your
    lane without warning. Cars in the next lane also block your escape if you come upon danger.
- id: 167
  category: defensive_driving
  question: When passing parked cars on a motorcycle, where is it usually best to position yourself if
    oncoming traffic is present?
  choices:
    A: Toward the right of your lane
    B: In the center lane position
    C: Toward the left of your lane
    D: On the shoulder of the road
  answer: B
  explanation: If oncoming traffic is present when passing parked cars, it is usually best to remain
    in the center lane position to maximize your space cushion.
- id: 168
  category: sharing_the_road
  question: How can a motorcyclist discourage other drivers from attempting to share their lane?
  choices:
    A: By riding on the far right edge of the lane
    B: By keeping a center of the lane position
    C: By weaving back and forth within the lane
    D: By riding on the far left edge of the lane
  answer: B
  explanation: Discourage lane sharing by others by keeping a center of the lane position whenever drivers
    might be tempted to squeeze by you.
- id: 169
  category: safe_driving_rules
  question: What is a potential hazard of riding a motorcycle in the center of a lane?
  choices:
    A: It is illegal on multi-lane highways
    B: It prevents the rider from seeing traffic signals
    C: It can be oily from car drippings, particularly at intersections
    D: It makes the motorcycle invisible to vehicles behind it
  answer: C
  explanation: The center of a lane can be oily. It collects the drippings from cars, particularly at
    intersections.
- id: 170
  category: safe_driving_rules
  question: When should a motorcyclist use their turn signals?
  choices:
    A: Only when other vehicles are visible
    B: Only when turning at a major intersection
    C: Anytime they plan to change lanes, even if no one else is around
    D: Only when riding at night or in poor visibility
  answer: C
  explanation: Use your signals anytime you plan to change lanes. Use them even though you think no one
