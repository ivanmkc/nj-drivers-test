questions:
- id: 1
  category: license_system
  question: Bajo el Sistema de Licencia Graduada (GDL) en Nuevo México, ¿cuál de los
    siguientes es un tipo de licencia reconocido?
  choices:
    A: Licencia comercial
    B: Licencia de chofer
    C: Licencia provisional
    D: Licencia por dificultades económicas
  answer: C
  explanation: Según la sección del manual sobre el Sistema de Licencia Graduada,
    los tipos de licencias de conducir incluyen el Permiso de Instrucción, la Licencia
    Provisional y la Licencia de Conducir Sin Restricciones.
- id: 2
  category: signs_and_signals
  question: ¿Cuáles de los siguientes se clasifican como Dispositivos de Control de
    Tráfico?
  choices:
    A: Límites de velocidad y reglas de estacionamiento
    B: Semáforos, señales y marcas en el pavimento
    C: Carriles reversibles y carriles centrales compartidos
    D: Cinturones de seguridad y sistemas de retención infantil
  answer: B
  explanation: El manual categoriza los Semáforos, las Señales de Tráfico y las Marcas
    en el Pavimento bajo la sección de 'Dispositivos de Control de Tráfico'.
- id: 3
  category: safe_driving_rules
  question: ¿Cuál de los siguientes se enumera como un ejemplo de control de carril?
  choices:
    A: Calles de un solo sentido
    B: Carril central compartido
    C: Marcas en el pavimento
    D: Glorietas (rotondas)
  answer: B
  explanation: El manual enumera los Carriles Reversibles, los Carriles Reservados
    y los Carriles Centrales Compartidos bajo la sección de 'Otros Controles de Carril'.
- id: 4
  category: safe_driving_rules
  question: Según el manual, ¿cuál de los siguientes es un componente clave de la
    'Conducción Básica'?
  choices:
    A: Ajustarse al tráfico
    B: Exploración visual (Scanning)
    C: Compartir el espacio
    D: Revisar los puntos ciegos
  answer: B
  explanation: La sección de 'Conducción Básica' incluye habilidades fundamentales
    como Arrancar, Acelerar, Maniobrar el volante, Velocidad, Detenerse, Exploración
    visual (Scanning) y el Uso de las luces.
- id: 5
  category: defensive_driving
  question: Al ajustarse a las condiciones de la carretera, ¿qué deben tener en cuenta
    específicamente los conductores para evitar causar daños?
  choices:
    A: Baches
    B: Vida silvestre
    C: Bicicletas
    D: Camiones grandes
  answer: B
  explanation: La sección sobre Ajuste a las Condiciones de la Carretera incluye específicamente
    los temas 'Conducir teniendo en cuenta la vida silvestre' y 'Para evitar lastimar
    a un animal'.
- id: 6
  category: vehicle_information
  question: ¿Cuál de los siguientes se clasifica como una emergencia del vehículo?
  choices:
    A: Fatiga
    B: Falla de energía (eléctrica)
    C: Uso del teléfono celular
    D: Exceso de velocidad
  answer: B
  explanation: El manual enumera la Falla de Frenos, el Reventón de Neumático y la
    Falla de Energía bajo 'Emergencias del Vehículo'.
- id: 7
  category: sharing_the_road
  question: Al compartir la carretera con camiones grandes y vehículos recreativos
    (RV), ¿de qué peligro específico deben estar conscientes los conductores?
  choices:
    A: Giros amplios
    B: Puntos ciegos del camionero
    C: Frenos de aire
    D: Derrame de carga
  answer: B
  explanation: La sección sobre Camiones Grandes y Vehículos Recreativos (RV) destaca
    específicamente el peligro de los 'Puntos ciegos del camionero'.
- id: 8
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes factores se analiza bajo el requisito de 'Estar
    en condiciones para conducir'?
  choices:
    A: Mantenimiento del vehículo
    B: Cinturones de seguridad
    C: Emociones
    D: Exploración visual (Scanning)
  answer: C
  explanation: La sección 'Estar en condiciones para conducir' cubre factores personales
    que incluyen la Visión, la Fatiga, Beber y Conducir, la Salud, las Emociones y
    el Uso del teléfono celular.
- id: 9
  category: license_system
  question: El Sistema de Licencia Graduada consta de tres tipos de licencias/permisos.
    Dos de ellos son el Permiso de Instrucción y la Licencia Provisional. ¿Cuál es
    el tercero?
  choices:
    A: Licencia de conducir restringida
    B: Licencia de conducir sin restricciones
    C: Licencia de conducir comercial
    D: Licencia de motocicleta
  answer: B
  explanation: El Sistema de Licencia Graduada incluye el Permiso de Instrucción,
    la Licencia Provisional y la Licencia de Conducir Sin Restricciones.
- id: 10
  category: defensive_driving
  question: ¿Cuál de las siguientes es un área específica de gestión del espacio analizada
    en la sección 'Compartir el espacio'?
  choices:
    A: Espacio para estacionar
    B: Espacio para incorporarse
    C: Espacio para girar
    D: Espacio para retroceder
  answer: B
  explanation: La sección 'Compartir el espacio' cubre el Espacio Adelante, el Espacio
    Atrás, el Espacio a los Lados, el Espacio para Incorporarse, el Espacio para Cruzar
    o Entrar y el Espacio para Rebasar.
- id: 11
  category: alcohol_drugs_health
  question: 'Además del alcohol, la sección ''Beber y conducir'' también aborda los
    efectos de:'
  choices:
    A: La fatiga
    B: Otras drogas
    C: El uso del teléfono celular
    D: La visión deficiente
  answer: B
  explanation: La sección 'Beber y conducir' incluye una subsección específica titulada
    'Otras drogas y la conducción'.
- id: 12
  category: vehicle_information
  question: ¿Cuál de las siguientes se considera una emergencia del vehículo junto
    con la falla de energía y los reventones de neumáticos?
  choices:
    A: Falla de los frenos
    B: Sobrecalentamiento del motor
    C: Batería descargada
    D: Limpiaparabrisas roto
  answer: A
  explanation: El manual enumera la falla de los frenos, el reventón de neumáticos
    y la falla de energía en la sección 'Emergencias del vehículo'.
- id: 13
  category: defensive_driving
  question: 'La sección del manual sobre ''Comunicación'' se divide en informar a
    los demás lo que usted está haciendo e:'
  choices:
    A: Informar a los demás que usted está allí
    B: Informar a los demás que va a girar
    C: Informar a los demás que se va a detener
    D: Informar a los demás que va a rebasar
  answer: A
  explanation: 'La sección ''Comunicación'' cubre dos conceptos principales: ''Informar
    a los demás que usted está allí'' e ''Informar a los demás lo que usted está haciendo''.'
- id: 14
  category: safe_driving_rules
  question: ¿Cuál de los siguientes se enumera como un tipo específico de control
    de carriles junto con los carriles reservados y los carriles centrales compartidos?
  choices:
    A: Carriles de rebase
    B: Carriles reversibles
    C: Carriles de giro
    D: Carriles para bicicletas
  answer: B
  explanation: La sección 'Otros controles de carriles' incluye carriles reversibles,
    carriles reservados y carriles centrales compartidos.
- id: 15
  category: license_system
  question: ¿Quién está obligado a tener una licencia de conducir de Nuevo México?
  choices:
    A: Solo los residentes de Nuevo México que poseen un vehículo
    B: Cualquier persona que opere un vehículo motorizado o una motocicleta en las
      vías públicas de Nuevo México
    C: Solo los conductores menores de 18 años
    D: Cualquier persona que opere un vehículo comercial
  answer: B
  explanation: Según el manual, cualquier persona que opere un vehículo motorizado
    o una motocicleta en las vías públicas del estado de Nuevo México debe tener una
    licencia de conducir, y los residentes están obligados a tener una licencia de
    conducir de Nuevo México.
- id: 16
  category: license_system
  question: ¿Cuáles son los tres niveles del sistema de Licencia de Conducir Graduada
    (GDL) en Nuevo México?
  choices:
    A: Permiso de aprendizaje, licencia intermedia, licencia comercial
    B: Permiso de estudiante, licencia restringida, licencia completa
    C: Permiso de instrucción, licencia provisional, licencia de conducir sin restricciones
    D: Permiso básico, permiso avanzado, licencia sin restricciones
  answer: C
  explanation: Los tres niveles diferentes del sistema de licencia de conducir graduada
    (GDL) son el permiso de instrucción, la licencia provisional y la licencia de
    conducir sin restricciones.
- id: 17
  category: license_system
  question: ¿Cuál es la edad mínima para obtener un permiso de instrucción en Nuevo
    México?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 15 años y 6 meses de edad
    D: 16 años de edad
  answer: B
  explanation: El manual establece que la edad mínima para un permiso de instrucción
    es de 15 años.
- id: 18
  category: driver_responsibility
  question: Al conducir un automóvil con un permiso de instrucción, ¿dónde debe sentarse
    el conductor con licencia que supervisa?
  choices:
    A: En el asiento trasero
    B: En el asiento delantero derecho
    C: En cualquier lugar del vehículo
    D: En un vehículo separado que lo siga de cerca
  answer: B
  explanation: En todos los vehículos, excepto en las motocicletas, el conductor con
    licencia que supervisa a un aprendiz con un permiso de instrucción debe sentarse
    en el asiento delantero derecho.
- id: 19
  category: driver_responsibility
  question: ¿Cómo debe ser supervisado un aprendiz en una motocicleta cuando tiene
    un permiso de instrucción?
  choices:
    A: El conductor con licencia debe viajar como pasajero en la motocicleta del aprendiz
    B: El conductor con licencia debe seguir al aprendiz
    C: El conductor con licencia debe ir delante del aprendiz
    D: El aprendiz debe viajar en un sidecar acoplado a la motocicleta del supervisor
  answer: B
  explanation: El manual especifica que en las motocicletas, el conductor con licencia
    debe seguir al aprendiz.
- id: 20
  category: license_system
  question: ¿Cuáles son los requisitos de edad y experiencia para un conductor supervisor
    que no es instructor cuando un aprendiz conduce con un permiso de instrucción?
  choices:
    A: Al menos 18 años de edad y con licencia por 1 año
    B: Al menos 21 años de edad y con licencia durante al menos 3 años
    C: Al menos 25 años de edad y con licencia por 5 años
    D: Cualquier conductor con licencia independientemente de su edad
  answer: B
  explanation: El conductor debe estar acompañado por un conductor con licencia de
    21 años de edad o más que haya tenido licencia durante al menos tres años en este
    estado o en cualquier otro estado.
- id: 21
  category: license_system
  question: ¿Cuánto tiempo debe conservar un conductor un permiso de instrucción antes
    de poder solicitar una licencia provisional?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 9 meses
    D: Al menos 12 meses
  answer: B
  explanation: El conductor debe conservar el permiso de instrucción durante al menos
    seis meses.
- id: 22
  category: driver_testing
  question: ¿Cuántas horas de práctica de conducción se deben completar para obtener
    una licencia provisional?
  choices:
    A: 30 horas en total, incluyendo 5 horas de noche
    B: 40 horas en total, incluyendo 10 horas de noche
    C: 50 horas en total, incluyendo 10 horas de noche
    D: 60 horas en total, incluyendo 15 horas de noche
  answer: C
  explanation: El conductor debe completar no menos de 50 horas de práctica de conducción,
    incluyendo no menos de 10 horas de conducción nocturna.
- id: 23
  category: safe_driving_rules
  question: ¿Durante qué horas se le prohíbe generalmente a un conductor con licencia
    provisional operar un vehículo motorizado en las vías públicas?
  choices:
    A: 10:00 PM y 6:00 AM
    B: 11:00 PM y 5:00 AM
    C: Medianoche y 5:00 AM
    D: Medianoche y 6:00 AM
  answer: C
  explanation: El conductor no puede operar un vehículo motorizado en las vías públicas
    entre las horas de la medianoche y las 5:00 AM, a menos que se aplique una excepción.
- id: 24
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción válida para que el titular de
    una licencia provisional conduzca entre la medianoche y las 5:00 AM?
  choices:
    A: Conducir a la casa de un amigo para un grupo de estudio
    B: Conducir hacia y desde el trabajo según lo demuestre una declaración firmada
      por el empleador
    C: Conducir a un gimnasio de 24 horas
    D: Conducir a casa después de una película nocturna
  answer: B
  explanation: El titular de una licencia provisional puede conducir a cualquier hora
    si se dirige hacia o desde el trabajo, según lo demuestre una declaración firmada
    por el empleador del titular.
- id: 25
  category: safe_driving_rules
  question: ¿Cuál es la restricción de pasajeros para un conductor con licencia provisional,
    a menos que esté acompañado por un conductor con licencia de 21 años o más?
  choices:
    A: No se permiten pasajeros menores de 21 años
    B: No más de un pasajero menor de 21 años que no sea de la familia inmediata
    C: No más de dos pasajeros menores de 21 años que no sean de la familia inmediata
    D: Solo se permiten miembros de la familia inmediata como pasajeros
  answer: B
  explanation: A menos que un conductor con licencia de 21 años o más esté en el vehículo,
    no puede tener más de un pasajero menor de 21 años que no sea miembro de su familia
    inmediata en el vehículo.
- id: 26
  category: license_system
  question: Para obtener una licencia de conducir sin restricciones, ¿cuánto tiempo
    debe haber tenido un conductor una licencia provisional?
  choices:
    A: 6 meses
    B: 9 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: El conductor debe haber tenido una licencia provisional durante el
    período de 12 meses inmediatamente anterior a la fecha de solicitud de una licencia
    de conducir.
- id: 27
  category: penalties_and_points
  question: Un conductor que solicita una licencia de conducir sin restricciones no
    debe haber sido condenado por una infracción de tráfico dentro de ¿cuántos días
    antes de la solicitud?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: El conductor no debe haber sido condenado por una infracción de tráfico
    90 días antes de solicitar una licencia de conducir.
- id: 28
  category: license_system
  question: ¿Por cuántos años es válida una licencia de conducir de Nuevo México al
    renovarla?
  choices:
    A: 2 o 4 años
    B: 3 o 5 años
    C: 4 u 8 años
    D: 5 o 10 años
  answer: C
  explanation: Su licencia de conducir es válida por 4 u 8 años.
- id: 29
  category: license_system
  question: ¿Cuál es el plazo durante el cual puede renovar su licencia de conducir?
  choices:
    A: Hasta 30 días antes o 30 días después de que expire
    B: Hasta 60 días antes o 15 días después de que expire
    C: Hasta 90 días antes o 30 días después de que expire
    D: Hasta 120 días antes o 60 días después de que expire
  answer: C
  explanation: Puede renovar la licencia en cualquier momento hasta 90 días antes
    o 30 días después de su vencimiento.
- id: 30
  category: penalties_and_points
  question: ¿Cuál de las siguientes acciones puede resultar en la pérdida de sus privilegios
    de conducir?
  choices:
    A: No liquidar una sentencia financiera dictada en su contra por daños resultantes
      de un accidente de vehículo motorizado
    B: Recibir una sola multa de estacionamiento
    C: Renovar su licencia 10 días después de que expire
    D: Conducir a 5 mph por debajo del límite de velocidad
  answer: A
  explanation: Puede perder sus privilegios de conducir por no liquidar una sentencia
    financiera dictada en su contra por daños resultantes de un accidente de vehículo
    motorizado.
- id: 31
  category: safe_driving_rules
  question: ¿Si su vehículo tiene un cinturón de hombro automático, qué más debe hacer
    para garantizar su seguridad?
  choices:
    A: Desconectar el cinturón de hombro si conduce a bajas velocidades
    B: Abrocharse también el cinturón de regazo
    C: Mover su asiento lo más adelante posible
    D: No necesita hacer nada más
  answer: B
  explanation: Si tiene un cinturón de hombro automático, asegúrese de abrocharse
    también el cinturón de regazo. De lo contrario, en una colisión podría deslizarse
    fuera del cinturón y resultar herido o morir.
- id: 32
  category: safe_driving_rules
  question: ¿Bajo qué condiciones debe un niño estar asegurado en un dispositivo de
    seguridad aprobado en Nuevo México?
  choices:
    A: Si el niño es menor de 5 años
    B: Si el niño es menor de 24 meses, o pesa menos de 60 libras
    C: Si el niño es menor de 36 meses, o pesa menos de 40 libras
    D: Si el niño está sentado en el asiento del pasajero delantero
  answer: B
  explanation: Los niños menores de 24 meses, o que pesen menos de 60 libras, deben
    estar asegurados en un dispositivo de seguridad aprobado.
- id: 33
  category: signs_and_signals
  question: ¿Qué debe hacer si está detenido en una intersección y el semáforo se
    pone en verde?
  choices:
    A: Acelerar inmediatamente para reclamar el derecho de paso
    B: Tocar la bocina para alertar al tráfico que cruza
    C: Permitir que el tráfico que cruza despeje la intersección antes de avanzar
    D: Girar a la derecha inmediatamente sin fijarse en los peatones
  answer: C
  explanation: Si está detenido y luego la luz se pone verde, debe permitir que el
    tráfico que cruza despeje la intersección antes de avanzar.
- id: 34
  category: signs_and_signals
  question: ¿Qué significa una luz de semáforo AMARILLA intermitente?
  choices:
    A: Detenerse por completo y esperar a la luz verde
    B: El semáforo está a punto de cambiar a rojo
    C: Reducir la velocidad y proceder con precaución
    D: Ceder el paso a todo el tráfico a su derecha
  answer: C
  explanation: Una luz de semáforo AMARILLA intermitente significa reducir la velocidad
    y proceder con precaución.
- id: 35
  category: signs_and_signals
  question: ¿Cómo debe tratar un conductor una luz de semáforo ROJA intermitente?
  choices:
    A: Igual que una señal de ceda el paso
    B: Igual que una señal de alto
    C: Proceder sin detenerse si la intersección está despejada
    D: Detenerse solo si hay peatones presentes
  answer: B
  explanation: Una luz de semáforo ROJA intermitente significa lo mismo que una señal
    de alto. Debe detenerse por completo y luego puede proceder cuando sea seguro
    hacerlo.
- id: 36
  category: signs_and_signals
  question: ¿Cuál es la forma y el color típicos de una señal de advertencia?
  choices:
    A: Cuadrada y blanca con letras negras
    B: En forma de diamante y amarilla con letras o símbolos negros
    C: Rectangular y verde con letras blancas
    D: Redonda y roja con símbolos blancos
  answer: B
  explanation: Las señales de advertencia suelen ser amarillas con letras o símbolos
    negros y la mayoría tiene forma de diamante.
- id: 37
  category: signs_and_signals
  question: ¿Qué significa una señal blanca en forma de X o "crossbuck" en un cruce
    de ferrocarril?
  choices:
    A: Tiene el mismo significado que una señal de "Ceda el paso"
    B: Tiene el mismo significado que una señal de "Alto"
    C: Indica que las vías ya no están en uso
    D: Advierte que un tren se está aproximando en ese momento
  answer: A
  explanation: Una señal blanca en forma de X o "crossbuck" con la leyenda "Railroad
    Crossing" se encuentra en el cruce de ferrocarril. Esta señal tiene el mismo significado
    que una señal de "Ceda el paso". Debe ceder el paso a los trenes que cruzan.
- id: 38
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está obligado a detenerse al menos a
    15 pies de un cruce de ferrocarril antes de proceder?
  choices:
    A: Un automóvil de pasajeros con más de cuatro ocupantes
    B: Una motocicleta
    C: Un autobús escolar
    D: Una camioneta remolcando un bote
  answer: C
  explanation: Los autobuses escolares, taxis y otros vehículos de alquiler que transportan
    pasajeros, y los camiones que transportan explosivos, gasolina u otros materiales
    peligrosos deben detenerse al menos a 15 pies de un cruce de ferrocarril antes
    de proceder.
- id: 39
  category: signs_and_signals
  question: ¿Qué colores se utilizan generalmente para las señales de construcción,
    mantenimiento u operaciones de emergencia?
  choices:
    A: Amarillo con letras negras
    B: Naranja con letras o símbolos negros
    C: Rojo con letras blancas
    D: Verde con símbolos blancos
  answer: B
  explanation: Las señales de zona de trabajo suelen tener forma de diamante o rectangular,
    son de color naranja con letras o símbolos negros y le advierten que hay personas
    trabajando en la calzada o cerca de ella.
- id: 40
  category: signs_and_signals
  question: ¿Qué indica una señal reglamentaria con un círculo rojo y una barra diagonal
    roja sobre un símbolo?
  choices:
    A: Hay un peligro adelante
    B: La acción indicada está prohibida
    C: Debe ceder el derecho de paso
    D: Se requiere un desvío
  answer: B
  explanation: Algunas señales reglamentarias tienen un círculo rojo con una barra
    diagonal roja sobre un símbolo. Estas señales prohíben ciertas acciones, por ejemplo,
    no girar a la izquierda, no girar a la derecha, no dar vuelta en U, etc.
- id: 41
  category: safe_driving_rules
  question: ¿Cuándo debe conducir a la velocidad máxima indicada en una señal de límite
    de velocidad?
  choices:
    A: En todo momento para mantener el flujo del tráfico
    B: Solo al adelantar a otro vehículo
    C: Solo en condiciones de conducción ideales
    D: Siempre que esté conduciendo en el carril izquierdo
  answer: C
  explanation: El límite máximo debe respetarse solo en condiciones de conducción
    ideales y usted debe reducir su velocidad cuando las condiciones lo requieran.
- id: 42
  category: signs_and_signals
  question: Si va a girar a la izquierda y tiene una luz verde fija, ¿qué debe hacer?
  choices:
    A: Girar inmediatamente porque tiene el derecho de paso
    B: Esperar a una flecha verde antes de girar
    C: Girar solo cuando sea seguro hacerlo, cediendo el paso al tráfico que viene
      en sentido contrario
    D: Detenerse por completo antes de realizar el giro
  answer: C
  explanation: Si va a girar a la izquierda, una luz verde fija significa que puede
    girar, pero solo cuando sea seguro hacerlo. El tráfico que viene en sentido contrario
    tiene el derecho de paso.
- id: 43
  category: safe_driving_rules
  question: ¿Cuándo es apropiado conducir al límite de velocidad máximo señalizado?
  choices:
    A: En todo momento para evitar congestiones de tráfico.
    B: Solo en condiciones de conducción ideales.
    C: Siempre que esté conduciendo en el carril del extremo izquierdo.
    D: Durante condiciones de lluvia, nieve o hielo.
  answer: B
  explanation: Según el manual, el límite máximo debe respetarse solo en condiciones
    de conducción ideales y debe reducir su velocidad cuando las condiciones lo requieran,
    como cuando la calzada está resbaladiza o la visibilidad es deficiente.
- id: 44
  category: signs_and_signals
  question: ¿Qué indica una señal cuadrada con una línea horizontal blanca dentro
    de un círculo rojo?
  choices:
    A: Debe detenerse por completo.
    B: No puede entrar.
    C: El carril está reservado para vehículos de alta ocupación (HOV).
    D: Se está acercando a una zona escolar.
  answer: B
  explanation: Una señal cuadrada con una línea horizontal blanca dentro de un círculo
    rojo es una señal de "No Entrar" (Do Not Enter), lo que significa que no puede
    entrar en esa apertura de la vía.
- id: 45
  category: vehicle_information
  question: ¿Qué significa un triángulo naranja reflectante en la parte trasera de
    un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo es un vehículo de alta ocupación.
    C: El vehículo viaja a menos de 25 mph.
    D: El vehículo está averiado y espera una grúa.
  answer: C
  explanation: Un triángulo naranja reflectante en la parte trasera de un vehículo
    significa que es un Vehículo de Movimiento Lento (Slow Moving Vehicle) que viaja
    a menos de 25 mph.
- id: 46
  category: signs_and_signals
  question: ¿Qué tipo de señal de guía es cuadrada o rectangular, azul con letras
    o símbolos blancos, y muestra la ubicación de gasolineras u hospitales?
  choices:
    A: Señales de destino
    B: Señales de servicio
    C: Señales de número de ruta
    D: Señales reglamentarias
  answer: B
  explanation: Las señales de servicio tienen forma cuadrada o rectangular y son azules
    con letras o símbolos blancos. Muestran la ubicación de diversos servicios, como
    áreas de descanso, gasolineras, campamentos u hospitales.
- id: 47
  category: signs_and_signals
  question: ¿Qué significa una línea blanca continua entre carriles de tráfico que
    se mueven en la misma dirección?
  choices:
    A: Puede cruzarla libremente para adelantar a otros vehículos.
    B: Debe permanecer en su carril a menos que una situación especial requiera que
      cambie de carril.
    C: El carril está terminando y debe incorporarse a la izquierda.
    D: Está entrando en un carril reversible.
  answer: B
  explanation: Una línea blanca continua entre carriles de tráfico significa que debe
    permanecer en su carril a menos que una situación especial requiera que cambie
    de carril.
- id: 48
  category: safe_driving_rules
  question: Cuando hay una línea amarilla continua y una discontinua entre carriles
    de tráfico opuestos, ¿cuándo se le permite adelantar?
  choices:
    A: Solo si la línea amarilla continua está de su lado.
    B: Solo si la línea amarilla discontinua está de su lado y es seguro hacerlo.
    C: Puede adelantar independientemente de qué línea esté de su lado.
    D: Adelantar está estrictamente prohibido para ambas direcciones.
  answer: B
  explanation: Donde hay una línea amarilla continua y una discontinua entre carriles
    de tráfico opuestos, no puede adelantar si la línea amarilla continua está de
    su lado. Si la línea discontinua está de su lado, puede adelantar si es seguro
    hacerlo.
- id: 49
  category: safe_driving_rules
  question: ¿Es legal cruzar una línea amarilla continua?
  choices:
    A: No, nunca es legal cruzar una línea amarilla continua.
    B: Sí, pero solo para adelantar a un vehículo de movimiento lento.
    C: Sí, puede cruzar una línea amarilla continua para girar hacia una entrada privada
      si es seguro hacerlo.
    D: Sí, pero solo durante las horas del día.
  answer: C
  explanation: 'El manual establece: "Puede cruzar una línea amarilla continua para
    girar hacia una entrada privada si es seguro hacerlo".'
- id: 50
  category: signs_and_signals
  question: En un carril reversible, ¿qué indica una 'X' amarilla intermitente?
  choices:
    A: Puede usar el carril debajo de ella para el tránsito regular.
    B: El carril es solo para girar.
    C: No puede usar el carril.
    D: El uso del carril está cambiando y debe salir de él.
  answer: B
  explanation: En los carriles reversibles, a menudo se utilizan luces especiales.
    Una 'X' amarilla intermitente significa que el carril es solo para girar.
- id: 51
  category: sharing_the_road
  question: ¿Qué significa una señal que indica 'HOV 3' para un carril reservado?
  choices:
    A: Debe haber al menos tres personas en el vehículo para usar el carril.
    B: El límite de velocidad en el carril es de 30 mph.
    C: Solo los vehículos híbridos o eléctricos pueden usar el carril.
    D: El carril está reservado para vehículos comerciales pesados con 3 o más ejes.
  answer: A
  explanation: HOV significa 'Vehículos de Alta Ocupación' (High Occupancy Vehicles).
    El manual explica que 'HOV 3' significa que debe haber al menos tres personas
    en el vehículo.
- id: 52
  category: signs_and_signals
  question: ¿Cómo está marcado a cada lado un carril central compartido, el cual está
    reservado para realizar giros a la izquierda por vehículos que viajan en ambas
    direcciones?
  choices:
    A: Por líneas blancas sólidas dobles.
    B: Por una línea amarilla sólida y una línea amarilla discontinua.
    C: Por una sola línea blanca discontinua.
    D: Por líneas amarillas discontinuas dobles.
  answer: B
  explanation: Los carriles centrales compartidos están marcados a cada lado por una
    línea amarilla sólida y una línea amarilla discontinua.
- id: 53
  category: safe_driving_rules
  question: De acuerdo con las reglas generales de conducción, ¿cuál es el único momento
    en el que debe retroceder un vehículo en cualquier carril de circulación?
  choices:
    A: Cuando se pasa de su giro o salida.
    B: Cuando necesita dejar a un pasajero.
    C: Cuando se está estacionando en paralelo.
    D: Cuando se encuentra en un carril central compartido.
  answer: C
  explanation: 'El manual establece: ''Nunca retroceda un vehículo en ningún carril
    de circulación, excepto para estacionarse en paralelo. Es ilegal e inseguro hacerlo''.'
- id: 54
  category: safe_driving_rules
  question: En una carretera con tres o más carriles que viajan en la misma dirección,
    ¿qué carril debe usar si hay mucho tráfico entrando o saliendo?
  choices:
    A: El carril derecho.
    B: El carril del extremo izquierdo.
    C: El carril de circulación central.
    D: El acotamiento (arcén).
  answer: C
  explanation: En una carretera con tres o más carriles que viajan en la misma dirección,
    si hay mucho tráfico entrando o saliendo, debe usar el carril de circulación central.
- id: 55
  category: safe_driving_rules
  question: Al realizar un giro donde no hay señales ni marcas en el carril para controlar
    el giro, ¿cómo debe proceder?
  choices:
    A: Girar desde el carril central hacia el carril del extremo derecho.
    B: Girar desde el carril más cercano a la dirección a la que desea ir y girar
      hacia el carril más cercano al que venía.
    C: Abrirse hacia el lado opuesto antes de realizar el giro.
    D: Girar siempre hacia el carril del extremo izquierdo, independientemente de
      su posición inicial.
  answer: B
  explanation: Donde no hay señales ni marcas en el carril para controlar el giro,
    debe girar desde el carril que esté más cerca de la dirección a la que desea ir
    y girar hacia el carril más cercano al que venía para cruzar la menor cantidad
    de carriles de tráfico.
- id: 56
  category: defensive_driving
  question: ¿Por qué debe evitar abrirse hacia la izquierda antes de realizar un giro
    a la derecha?
  choices:
    A: Hará que su vehículo pierda tracción.
    B: El conductor detrás de usted puede pensar que está cambiando de carril o girando
      a la izquierda e intentar rebasarlo por la derecha.
    C: Es ilegal cruzar la línea central mientras se gira a la derecha.
    D: Requiere que use un carril central compartido de manera inapropiada.
  answer: B
  explanation: En los giros a la derecha, evite abrirse hacia la izquierda antes de
    girar porque el conductor detrás de usted puede pensar que está cambiando de carril
    o que va a girar a la izquierda y puede intentar rebasarlo por la derecha.
- id: 57
  category: safe_driving_rules
  question: ¿Qué debe evitar hacer al realizar un giro a la derecha?
  choices:
    A: Usar su luz direccional
    B: Abrirse hacia la izquierda antes de girar
    C: Permanecer en su carril designado
    D: Reducir la velocidad antes de la intersección
  answer: B
  explanation: En los giros a la derecha, evite abrirse hacia la izquierda antes de
    girar. Si se abre, el conductor detrás de usted puede pensar que está cambiando
    de carril o que va a girar a la izquierda y puede intentar rebasarlo por la derecha.
- id: 58
  category: sharing_the_road
  question: Bajo la Ley del Bastón Blanco (White Cane Law), ¿qué debe hacer un conductor
    al acercarse a un peatón ciego que lleva un bastón blanco o metálico?
  choices:
    A: Tocar la bocina para alertar al peatón de la presencia del vehículo
    B: Ceder el paso solo si el peatón está en un cruce de peatones marcado
    C: Tomar todas las precauciones necesarias para evitar lesiones al peatón
    D: Mantener la velocidad pero maniobrar alrededor del peatón
  answer: C
  explanation: El conductor de un vehículo que se acerque a un peatón total o parcialmente
    ciego que lleve un bastón blanco o metálico (o que use un perro guía) deberá tomar
    todas las precauciones necesarias para evitar lesiones a dicho peatón ciego.
- id: 59
  category: safe_driving_rules
  question: Si dos vehículos llegan a una parada de 4 vías (4-way stop) exactamente
    al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo a la izquierda
    B: El vehículo a la derecha
    C: El vehículo que viaja a una velocidad más rápida
    D: El vehículo que tiene la intención de girar a la izquierda
  answer: B
  explanation: En una parada de 4 vías, el conductor que llega primero a la intersección
    pasa primero. Si más de un vehículo llega al mismo tiempo, el vehículo a la derecha
    pasa primero.
- id: 60
  category: safe_driving_rules
  question: ¿Qué debe hacer si se encuentra en medio de una intersección cuando se
    acerca un vehículo de emergencia con su sirena y luces intermitentes encendidas?
  choices:
    A: Detenerse inmediatamente en el centro de la intersección
    B: Hacerse a un lado hacia el borde derecho de la intersección
    C: Cruzar la intersección antes de hacerse a un lado a la derecha
    D: Poner su vehículo en reversa y retroceder para salir de la intersección
  answer: C
  explanation: Si se encuentra en una intersección, crúcela antes de hacerse a un
    lado para permitir el paso de un vehículo de emergencia que se aproxima.
- id: 61
  category: sharing_the_road
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar que tiene
    sus luces rojas intermitentes?
  choices:
    A: Cuando el autobús está en el lado opuesto de una carretera estándar de dos
      carriles
    B: Cuando se está aproximando al autobús en una intersección
    C: Cuando el autobús viaja hacia usted y la calzada está separada por una mediana
      o barrera física
    D: Cuando usted viaja a una velocidad inferior a 15 mph
  answer: C
  explanation: No es obligatorio detenerse si el autobús viaja hacia usted y la calzada
    está separada por una mediana u otra barrera física.
- id: 62
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en una zona comercial o residencial
    en Nuevo México, a menos que se indique lo contrario?
  choices:
    A: 15 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: El límite de velocidad máximo es de 30 mph en zonas comerciales o residenciales,
    a menos que se indique lo contrario.
- id: 63
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en las autopistas interestatales
    rurales, a menos que se indique lo contrario?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: D
  explanation: El límite de velocidad máximo es de 75 mph en las autopistas interestatales
    rurales, a menos que se indique lo contrario.
- id: 64
  category: vehicle_information
  question: ¿Cómo debe colocar las ruedas de su vehículo al estacionar en una colina?
  choices:
    A: Mantenerlas perfectamente rectas
    B: Girarlas bruscamente hacia el lado de la carretera o el bordillo
    C: Girarlas bruscamente en dirección contraria al bordillo
    D: Girarlas ligeramente hacia el centro de la carretera
  answer: B
  explanation: Cuando estacione en una colina, gire las ruedas bruscamente hacia el
    lado de la carretera o el bordillo. De esta manera, si su vehículo comienza a
    rodar cuesta abajo, se alejará del tráfico.
- id: 65
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios no se permite legalmente estacionar
    su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: De acuerdo con las reglas de zonas donde no se permite estacionar,
    no puede estacionar a menos de 15 pies de un hidrante de incendios.
- id: 66
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima a la que puede estar su vehículo estacionado
    del bordillo?
  choices:
    A: 12 pulgadas
    B: 15 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: No puede estacionar a más de 18 pulgadas del bordillo.
- id: 67
  category: signs_and_signals
  question: ¿Qué indica un bordillo pintado de rojo?
  choices:
    A: Solo se permiten paradas cortas
    B: Es una zona de carga
    C: Estacionamiento exclusivo para personas con discapacidad
    D: Una zona de incendios donde no se permite estacionar ni permanecer detenido
  answer: D
  explanation: Un bordillo pintado de rojo indica una zona de incendios donde no se
    permite estacionar ni permanecer detenido.
- id: 68
  category: penalties_and_points
  question: ¿Cuál es la sanción si un conductor acumula doce o más puntos en su historial
    de conducción dentro de un período de doce meses?
  choices:
    A: Una suspensión de la licencia por 30 días
    B: Una suspensión de la licencia por 6 meses
    C: Una suspensión de la licencia por un año
    D: Revocación permanente de la licencia de conducir
  answer: C
  explanation: Si un conductor acumula doce o más puntos en un período de doce meses,
    su licencia de conducir será suspendida por un año.
- id: 69
  category: defensive_driving
  question: Según el manual, ¿cuáles son las posiciones equilibradas recomendadas
    para las manos en el volante?
  choices:
    A: Las 10 y las 2, o las 9 y las 3 (según las manecillas del reloj)
    B: Las 11 y la 1
    C: Las 8 y las 4
    D: Una mano en la posición de las 12
  answer: A
  explanation: Una posición equilibrada para el control de la dirección es a las 10
    y a las 2. Algunos conductores prefieren colocar las manos a las 9 y a las 3.
- id: 70
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de entrar en una intersección si el tráfico de adelante
    está congestionado?
  choices:
    A: Entrar en la intersección y esperar a que el tráfico avance
    B: Tocar la bocina para animar al tráfico a moverse más rápido
    C: Esperar hasta que el tráfico de adelante avance para no bloquear la intersección
    D: Avanzar hasta el paso de peatones y detenerse
  answer: C
  explanation: Los conductores no deben entrar en una intersección a menos que puedan
    atravesarla sin tener que detenerse. Debe esperar hasta que el tráfico de adelante
    avance para no bloquear la intersección.
- id: 71
  category: safe_driving_rules
  question: ¿En una intersección donde no hay una señal de alto, una señal de ceda
    el paso o un semáforo, a quién debe cederle el paso?
  choices:
    A: A los vehículos que vienen de la izquierda
    B: A los vehículos que vienen de la derecha
    C: A los vehículos que giran a la izquierda
    D: A los vehículos que viajan a una velocidad más rápida
  answer: B
  explanation: En una intersección donde no hay una señal de alto, una señal de ceda
    el paso o un semáforo, los conductores deben ceder el paso a los vehículos que
    vienen de la derecha.
- id: 72
  category: vehicle_information
  question: Al completar un giro cerrado, ¿cómo debe enderezar el volante?
  choices:
    A: Dejar que se deslice entre sus dedos
    B: Enderezarlo a mano
    C: Usar solo su mano izquierda
    D: Quitar las manos del volante brevemente
  answer: B
  explanation: Según el manual, cuando completa un giro, debe enderezar el volante
    a mano. Dejar que se deslice entre sus dedos podría ser peligroso.
- id: 73
  category: safe_driving_rules
  question: ¿Por qué es importante revisar su velocímetro con frecuencia?
  choices:
    A: Para asegurar que su vehículo no se esté quedando sin gasolina
    B: Porque las personas no son muy buenas juzgando a qué velocidad van
    C: Para calibrar las luces de su tablero
    D: Porque los velocímetros fallan con frecuencia en las carreteras locales
  answer: B
  explanation: El manual aconseja revisar el velocímetro con frecuencia porque las
    personas no son muy buenas juzgando a qué velocidad van, lo que facilita viajar
    mucho más rápido de lo que uno piensa.
- id: 74
  category: defensive_driving
  question: ¿Cuál es una consecuencia potencial de frenar rápidamente y detenerse
    de repente?
  choices:
    A: Ahorrará combustible
    B: Podría patinar y perder el control de su vehículo
    C: Mejorará la alineación de su dirección
    D: Facilitará que los conductores detrás de usted se detengan
  answer: B
  explanation: El manual advierte que cuando frena rápidamente, podría patinar y perder
    el control de su vehículo, y hace que sea más difícil para los conductores detrás
    de usted detenerse sin golpearlo.
- id: 75
  category: defensive_driving
  question: ¿A qué distancia hacia adelante suelen mirar los conductores más seguros
    al conducir?
  choices:
    A: Al menos 2 segundos hacia adelante
    B: Al menos 5 segundos hacia adelante
    C: Al menos 10 segundos hacia adelante
    D: Al menos 20 segundos hacia adelante
  answer: C
  explanation: El manual establece que los conductores más seguros tienden a mirar
    al menos 10 segundos por delante de su vehículo.
- id: 76
  category: defensive_driving
  question: 'Al conducir en el tráfico de la ciudad, mirar 10 segundos hacia adelante
    equivale a mirar aproximadamente:'
  choices:
    A: El largo de un automóvil
    B: Una cuadra
    C: Una milla
    D: Tres cuadras
  answer: B
  explanation: Según el manual, en la ciudad, 10 segundos es aproximadamente una cuadra.
    Al conducir en el tráfico de la ciudad, debe intentar mirar al menos una cuadra
    hacia adelante.
- id: 77
  category: safe_driving_rules
  question: Si está detenido en una intersección y su vista de una calle transversal
    está bloqueada, ¿qué debe hacer?
  choices:
    A: Acelerar rápidamente para despejar la intersección
    B: Tocar la bocina y avanzar a velocidad normal
    C: Avanzar lentamente poco a poco hasta que pueda ver
    D: Esperar a que otro vehículo gire primero
  answer: C
  explanation: El manual indica que si está detenido y su vista de una calle transversal
    está bloqueada, debe avanzar lentamente poco a poco hasta que pueda ver, dando
    a los conductores que cruzan la oportunidad de verlo.
- id: 78
  category: safe_driving_rules
  question: Según el manual, ¿cuándo se le permite girar a la izquierda desde una
    calle de un solo sentido hacia otra calle de un solo sentido?
  choices:
    A: Solo con una flecha verde
    B: A menos que esté prohibido
    C: Solo si no hay peatones presentes
    D: Nunca
  answer: B
  explanation: 'El manual establece: "También puede girar a la izquierda desde una
    calle de un solo sentido hacia otra calle de un solo sentido, a menos que esté
    prohibido".'
- id: 79
  category: safe_driving_rules
  question: ¿Qué debe hacer en un cruce de ferrocarril con más de una vía después
    de que haya pasado un tren?
  choices:
    A: Cruzar inmediatamente detrás del tren para ahorrar tiempo
    B: Esperar hasta que el tren que pasa esté bien lejos en la vía antes de comenzar
      a cruzar
    C: Avanzar al límite de velocidad indicado sin detenerse
    D: Tocar la bocina para advertir a cualquier tren oculto
  answer: B
  explanation: En los cruces con más de una vía, el manual aconseja esperar hasta
    que el tren que pasa esté bien lejos en la vía antes de comenzar a cruzar porque
    otro tren podría estar oculto por el que acaba de pasar.
- id: 80
  category: defensive_driving
  question: ¿Por qué debe girar la cabeza y mirar por encima del hombro antes de cambiar
    de carril?
  choices:
    A: Para revisar si hay vehículos en sus puntos ciegos que no puede ver a través
      de sus espejos
    B: Para asegurarse de que su ventana trasera esté libre de escombros
    C: Para comunicarse con los conductores detrás de usted
    D: Para verificar la velocidad del vehículo que está directamente detrás de usted
  answer: A
  explanation: El manual explica que debe girar la cabeza y mirar por encima del hombro
    para ver los vehículos en sus "puntos ciegos" porque no puede ver estas áreas
    a través de sus espejos.
- id: 81
  category: defensive_driving
  question: 'Al revisar el tráfico a los lados, atrás o sobre su hombro para cambiar
    de carril, usted debe:'
  choices:
    A: Mirar fijamente el punto ciego hasta que esté completamente despejado
    B: Revisar rápidamente para no apartar la vista del camino adelante por más de
      un instante
    C: Confiar únicamente en su espejo retrovisor
    D: Girar todo su cuerpo en el asiento del conductor
  answer: B
  explanation: El manual aconseja "Revisar rápidamente. No aparte la vista del camino
    adelante por más de un instante" porque el tráfico de adelante podría detenerse
    repentinamente.
- id: 82
  category: vehicle_information
  question: ¿Cuál es la técnica adecuada para mirar detrás de su vehículo al retroceder?
  choices:
    A: Confiar totalmente en sus espejos retrovisores y laterales
    B: Usar exclusivamente su cámara de reversa
    C: Colocar su brazo derecho en el respaldo del asiento y girar para mirar directamente
      a través de la ventana trasera
    D: Abrir la puerta del lado del conductor y mirar hacia atrás
  answer: C
  explanation: El manual instruye a los conductores a colocar su brazo derecho en
    el respaldo del asiento y girar para mirar directamente a través de la ventana
    trasera, en lugar de depender de los espejos.
- id: 83
  category: defensive_driving
  question: 'Antes de subir a su vehículo para retroceder, usted debe:'
  choices:
    A: Tocar la bocina dos veces
    B: Revisar detrás de su vehículo porque los niños u objetos pequeños no se pueden
      ver desde el asiento del conductor
    C: Encender sus luces de emergencia
    D: Acelerar el motor para advertir a los peatones
  answer: B
  explanation: El manual establece que debe revisar detrás de su vehículo antes de
    subir porque los niños u objetos pequeños no se pueden ver desde el asiento del
    conductor.
- id: 84
  category: defensive_driving
  question: Al bajar una colina larga o empinada, ¿por qué es importante revisar sus
    espejos?
  choices:
    A: Para admirar el paisaje detrás de usted
    B: Porque los vehículos, especialmente los camiones grandes y autobuses, a menudo
      aumentan la velocidad y pueden ir demasiado rápido
    C: Para ver si sus luces de freno funcionan
    D: Porque es ilegal bajar una colina en punto muerto (coasting)
  answer: B
  explanation: El manual aconseja revisar los espejos al bajar colinas porque los
    vehículos a menudo aumentan la velocidad, y usted debe estar alerta a los camiones
    grandes y autobuses que puedan ir demasiado rápido.
- id: 85
  category: defensive_driving
  question: 'Mirar bien hacia adelante en el camino le ayuda a hacer todo lo siguiente,
    EXCEPTO:'
  choices:
    A: Evitar frenazos de último minuto
    B: Ahorrar combustible
    C: Conducir más recto con menos zigzagueo
    D: Eliminar los puntos ciegos de su vehículo
  answer: D
  explanation: El manual establece que mirar bien hacia adelante ayuda a evitar frenazos
    de último minuto, ahorrar combustible, mantener el tráfico en movimiento y conducir
    más recto. No elimina los puntos ciegos, los cuales deben revisarse mirando sobre
    el hombro.
- id: 86
  category: safe_driving_rules
  question: ¿Cuándo debe bajar las luces altas cuando se aproxima un vehículo en sentido
    contrario?
  choices:
    A: A menos de 500 pies del vehículo
    B: A una distancia aproximada de una cuadra
    C: A menos de 200 pies del vehículo
    D: Solo cuando el otro conductor haga cambio de luces
  answer: B
  explanation: El manual establece que debe bajar las luces altas siempre que se encuentre
    a una distancia aproximada de una cuadra de un vehículo que viene en sentido contrario.
- id: 87
  category: safe_driving_rules
  question: ¿Por qué debería usar las luces bajas en lugar de las altas en condiciones
    de niebla, nieve o lluvia intensa?
  choices:
    A: Las luces altas agotarán la batería más rápido en climas fríos.
    B: La ley exige luces bajas en todas las precipitaciones.
    C: La luz de las luces altas se reflejará, causando deslumbramiento y dificultando
      la visión.
    D: Las luces altas pueden cegar temporalmente a los conductores que vienen detrás.
  answer: C
  explanation: El manual explica que en condiciones de niebla, nieve o lluvia intensa,
    la luz de las luces altas se reflejará, causando deslumbramiento y dificultando
    la visión hacia adelante.
- id: 88
  category: safe_driving_rules
  question: ¿Cuál es una buena regla general con respecto a los faros delanteros en
    días de lluvia, nieve o niebla?
  choices:
    A: Si enciende los limpiaparabrisas, encienda los faros delanteros.
    B: Use solo las luces de estacionamiento para ahorrar energía de la batería.
    C: Use las luces altas para atravesar la precipitación.
    D: Encienda sus luces de emergencia mientras conduce.
  answer: A
  explanation: 'El manual establece que en días de lluvia, nieve o niebla, los faros
    delanteros hacen que su vehículo sea más fácil de ver, y recuerda a los conductores:
    ''si enciende los limpiaparabrisas, encienda los faros delanteros''.'
- id: 89
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones debería usar un TOQUE FUERTE de
    su bocina?
  choices:
    A: Cuando está pasando a un conductor que comienza a meterse en su carril.
    B: Al llegar a un lugar donde no puede ver lo que hay adelante.
    C: Cuando un niño o una persona mayor está a punto de caminar, correr o cruzar
      la calle.
    D: Cuando una persona en bicicleta parece estarse moviendo hacia su carril.
  answer: C
  explanation: El manual aconseja usar un toque fuerte de bocina cuando hay peligro,
    como cuando un niño o una persona mayor está a punto de caminar, correr o cruzar
    la calle. Las otras situaciones solo requieren un toque ligero.
- id: 90
  category: defensive_driving
  question: Si su vehículo se avería y tiene que detenerse, ¿dónde debería intentar
    ubicar su vehículo?
  choices:
    A: Justo después de una colina para que esté fuera del camino del viento.
    B: Justo después de una curva para evitar el tráfico en línea recta.
    C: En el carril de tráfico con las luces de emergencia encendidas.
    D: Fuera de la carretera y lejos del tráfico si es posible.
  answer: D
  explanation: Si tiene problemas con el vehículo, el manual indica que debe sacar
    su vehículo de la carretera y alejarlo del tráfico si es posible, y evitar detenerse
    justo después de una colina o una curva.
- id: 91
  category: sharing_the_road
  question: ¿Por qué nunca debe permanecer al lado de un vehículo grande, como un
    camión o un autobús?
  choices:
    A: Viajan a velocidades mucho más altas que los automóviles de pasajeros.
    B: Estos vehículos tienen grandes puntos ciegos y es difícil para sus conductores
      verlo.
    C: Tienen más probabilidades de sufrir reventones de neumáticos.
    D: Emiten gases de escape que pueden oscurecer su visión.
  answer: B
  explanation: El manual advierte que nunca debe permanecer al lado de un vehículo
    grande, como un camión o un autobús, porque estos vehículos tienen grandes puntos
    ciegos y es difícil para los conductores de vehículos grandes verlo.
- id: 92
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalizar antes de realizar un giro?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: Según el manual, debe señalizar al menos 100 pies antes de realizar
    su giro.
- id: 93
  category: defensive_driving
  question: Si otro vehículo está a punto de entrar en la calle entre usted y el lugar
    donde planea girar, ¿cuándo debe señalizar?
  choices:
    A: Tan pronto como vea al otro vehículo.
    B: Al menos 500 pies antes de la intersección.
    C: Espere hasta haber pasado el otro vehículo para señalizar su giro.
    D: Señalice inmediatamente y toque la bocina.
  answer: C
  explanation: El manual establece que si otro vehículo está a punto de entrar en
    la calle entre usted y su giro, debe esperar hasta haberlo pasado para señalizar.
    De lo contrario, el otro conductor puede pensar que planea girar donde él se encuentra
    y cruzarse en su camino.
- id: 94
  category: vehicle_information
  question: Al navegar por una curva, ¿cuál es el mejor momento para reducir la velocidad?
  choices:
    A: Mientras se encuentra en medio de la curva.
    B: Justo cuando comienza a salir de la curva.
    C: Reduzca siempre la velocidad antes de entrar en la curva.
    D: Debe mantener una velocidad constante durante toda la curva.
  answer: C
  explanation: El manual aconseja reducir siempre la velocidad antes de entrar en
    una curva para no tener que frenar dentro de ella, lo que puede hacer que el vehículo
    patine.
- id: 95
  category: safe_driving_rules
  question: ¿Cuánto debe reducir su velocidad al conducir en una carretera mojada?
  choices:
    A: Aproximadamente 5 mph
    B: Aproximadamente 10 mph
    C: Reducir su velocidad a la mitad
    D: Reducir la velocidad al mínimo (a paso de tortuga)
  answer: B
  explanation: El manual establece que en una carretera mojada debe reducir su velocidad
    aproximadamente 10 mph. La nieve compactada requiere reducir la velocidad a la
    mitad, y el hielo requiere reducirla al mínimo.
- id: 96
  category: defensive_driving
  question: ¿Por qué los pasos elevados y los puentes pueden estar helados incluso
    cuando el resto del pavimento no lo está?
  choices:
    A: Generalmente están hechos de concreto en lugar de asfalto.
    B: Recogen más humedad del aire.
    C: No tienen tierra debajo para ayudar a aislarlos contra el frío.
    D: Están expuestos a una luz solar más directa que derrite y vuelve a congelar
      el hielo.
  answer: C
  explanation: El manual explica que los puentes no tienen tierra debajo para ayudar
    a aislarlos contra el frío, por lo que pueden estar más fríos y helados que otras
    carreteras.
- id: 97
  category: defensive_driving
  question: ¿Por qué el pavimento puede estar muy resbaladizo durante los primeros
    minutos cuando empieza a llover en un día caluroso?
  choices:
    A: La lluvia se mezcla con el polvo para formar un lodo espeso.
    B: El calor hace que el aceite del asfalto suba a la superficie.
    C: El cambio repentino de temperatura hace que el asfalto se contraiga.
    D: El agua hierve sobre la superficie caliente, creando una barrera de vapor.
  answer: B
  explanation: Según el manual, si empieza a llover en un día caluroso, el calor hace
    que el aceite del asfalto suba a la superficie, lo que hace que la carretera sea
    más resbaladiza hasta que el aceite se lave.
- id: 98
  category: vehicle_information
  question: ¿A qué velocidad pueden sus neumáticos perder toda tracción con la carretera
    durante una lluvia intensa (hidroplaneo)?
  choices:
    A: Aproximadamente 35 mph
    B: Aproximadamente 45 mph
    C: Aproximadamente 50 mph
    D: Aproximadamente 65 mph
  answer: C
  explanation: El manual establece que, en una lluvia intensa, sus neumáticos pueden
    perder toda tracción con la carretera a unas 50 mph. El hidroplaneo (hydroplaning)
    comienza alrededor de las 35 mph.
- id: 99
  category: safe_driving_rules
  question: ¿Cuándo es apropiado conducir solo con las luces de estacionamiento encendidas?
  choices:
    A: Al conducir con niebla densa.
    B: Justo antes del amanecer o justo después del atardecer.
    C: Al acercarse a otro automóvil a menos de 500 pies.
    D: Nunca; las luces de estacionamiento son solo para estacionar.
  answer: D
  explanation: 'El manual establece explícitamente: ''No conduzca en ningún momento
    solo con las luces de estacionamiento encendidas. Las luces de estacionamiento
    son solo para estacionar''.'
- id: 100
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una práctica recomendada al dar marcha atrás
    con su vehículo?
  choices:
    A: Retroceder rápidamente para minimizar el tiempo que se pasa en reversa.
    B: Confiar únicamente en su espejo retrovisor.
    C: Utilizar a una persona fuera del vehículo para que le ayude a retroceder siempre
      que sea posible.
    D: Encender las luces altas para ver mejor detrás de usted.
  answer: C
  explanation: El manual recomienda retroceder lentamente porque el vehículo es más
    difícil de maniobrar, y 'siempre que sea posible, utilice a una persona fuera
    del vehículo para que le ayude a retroceder'.
- id: 101
  category: defensive_driving
  question: ¿Qué debe hacer si siente que sus neumáticos han perdido tracción con
    la superficie de la carretera?
  choices:
    A: Frenar de golpe inmediatamente
    B: Levantar el pie del acelerador y mantener el volante recto
    C: Girar el volante bruscamente para recuperar el control
    D: Acelerar para atravesar el agua
  answer: B
  explanation: Si sus neumáticos pierden tracción, el manual aconseja levantar el
    pie del acelerador, mantener el volante recto y no intentar detenerse ni girar
    hasta que los neumáticos vuelvan a agarrarse a la carretera.
- id: 102
  category: defensive_driving
  question: ¿En qué momentos del día están más activos muchos animales salvajes y
    es más probable que crucen la carretera?
  choices:
    A: Media mañana y primeras horas de la tarde
    B: Al mediodía
    C: Al amanecer, al atardecer y en las primeras horas después de oscurecer
    D: Solo durante las horas más oscuras de la medianoche a las 3 AM
  answer: C
  explanation: El manual indica que se debe estar especialmente atento a la fauna
    silvestre al amanecer, al atardecer y en las primeras horas después de que oscurece,
    ya que muchos animales están más activos en esos momentos.
- id: 103
  category: safe_driving_rules
  question: ¿Cómo reaccionan normalmente los animales con pezuñas, como los ciervos,
    en superficies de carretera resbaladizas?
  choices:
    A: Aceleran para cruzar más rápido
    B: A menudo reducen la velocidad
    C: Se quedan completamente paralizados y se echan
    D: Inmediatamente dan la vuelta y regresan corriendo
  answer: B
  explanation: El manual señala que los animales con pezuñas, como los ciervos, a
    menudo reducen la velocidad en superficies resbaladizas, por lo que los conductores
    deben estar preparados para reducir la velocidad y permitirles cruzar.
- id: 104
  category: safe_driving_rules
  question: Al usar una rampa para entrar en una carretera de alta velocidad, ¿por
    qué debe evitar conducir hasta el final de la rampa y detenerse?
  choices:
    A: No tendrá suficiente espacio para alcanzar la velocidad del tráfico
    B: Es ilegal detenerse en cualquier rampa de una autopista
    C: Los frenos de su vehículo se sobrecalentarán
    D: Se verá obligado a salir de la autopista inmediatamente
  answer: A
  explanation: El manual advierte que no se debe conducir hasta el final de la rampa
    y detenerse, o no tendrá suficiente espacio para alcanzar la velocidad del tráfico
    y los conductores detrás de usted no esperarán que se detenga.
- id: 105
  category: safe_driving_rules
  question: Al salir de una carretera principal que tiene rampas de salida, ¿cuál
    es el mejor momento para reducir la velocidad?
  choices:
    A: Un cuarto de milla antes de la rampa de salida
    B: Tan pronto como vea la señal de salida
    C: Solo después de haber entrado en la rampa de salida
    D: Mientras todavía se encuentra en el carril de tráfico principal
  answer: C
  explanation: El manual indica que si la carretera por la que viaja tiene rampas
    de salida, no debe reducir la velocidad hasta que haya entrado en la rampa de
    salida.
- id: 106
  category: safe_driving_rules
  question: En buenas condiciones, ¿aproximadamente cuántos pies se necesitan para
    reaccionar y detener su vehículo por completo cuando viaja a 50 mph?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: D
  explanation: El manual establece que a 50 mph, puede tomar unos 400 pies reaccionar
    ante algo que ve y detener su vehículo por completo.
- id: 107
  category: safe_driving_rules
  question: ¿Aproximadamente cuántos pies se necesitan para detener su vehículo cuando
    conduce a 30 mph sobre pavimento seco?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 400 pies
  answer: C
  explanation: Según el manual, a 30 mph, puede tomar unos 200 pies detenerse, lo
    que equivale casi a la longitud de media manzana de la ciudad.
- id: 108
  category: vehicle_information
  question: ¿Aproximadamente a qué distancia le permitirán ver sus faros delanteros
    por la noche?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 600 pies
  answer: C
  explanation: El manual explica que sus faros le permitirán ver a unos 400 pies de
    distancia, y debe conducir a una velocidad que le permita detenerse dentro de
    esta distancia.
- id: 109
  category: safe_driving_rules
  question: Si la lluvia intensa, la nieve o la niebla espesa limitan su visibilidad
    a 200 pies de distancia, ¿cuál es la velocidad máxima de conducción segura?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: Cuando no puede ver a más de 200 pies de distancia debido a una lluvia
    intensa, una tormenta de nieve o niebla espesa, no puede conducir de manera segura
    a más de 30 mph.
- id: 110
  category: defensive_driving
  question: ¿Qué regla debe utilizar para determinar si está conduciendo demasiado
    rápido para sus condiciones de distancia de visibilidad?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de la distancia de visibilidad de cuatro segundos
    D: La regla de la longitud de un vehículo
  answer: C
  explanation: Para saber si está conduciendo demasiado rápido para las condiciones,
    el manual recomienda utilizar la 'Regla de la distancia de visibilidad de cuatro
    segundos'.
- id: 111
  category: safe_driving_rules
  question: ¿Qué regla debe utilizar para asegurarse de no seguir al vehículo que
    tiene delante demasiado de cerca?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de la distancia de visión de cuatro segundos
    D: La regla de los diez segundos
  answer: B
  explanation: Para evitar choques por alcance e identificar si está siguiendo demasiado
    de cerca, el manual establece que se debe usar la "regla de los tres segundos",
    la cual funciona a cualquier velocidad.
- id: 112
  category: sharing_the_road
  question: ¿Qué debe hacer si conduce más lento que el resto del tráfico y los vehículos
    comienzan a amontonarse detrás de usted?
  choices:
    A: Acelerar para exceder el límite de velocidad
    B: Presionar los frenos repetidamente para advertirles que se alejen
    C: Orillarse cuando sea seguro hacerlo y dejarlos pasar
    D: Mantener su velocidad y permanecer en el centro del carril
  answer: C
  explanation: El manual aconseja que si los vehículos se amontonan detrás de usted
    porque va más lento que el resto del tráfico, debe orillarse cuando sea seguro
    hacerlo y dejarlos pasar.
- id: 113
  category: defensive_driving
  question: ¿Por qué las plazas de peaje se consideran "puntos problemáticos" donde
    es posible que deba reducir la velocidad?
  choices:
    A: Porque las cabinas de peaje a menudo no tienen personal
    B: Porque los vehículos cambian de carril, se detienen y aceleran de nuevo con
      frecuencia
    C: Porque el límite de velocidad baja automáticamente a 10 mph
    D: Porque los peatones suelen cruzar la autopista
  answer: B
  explanation: Las plazas de peaje son puntos problemáticos porque los vehículos cambian
    de carril, se preparan para detenerse y luego aceleran de nuevo al salir de la
    plaza.
- id: 114
  category: safe_driving_rules
  question: ¿Cuál es el método recomendado para determinar si está siguiendo a un
    vehículo demasiado de cerca?
  choices:
    A: La regla de la longitud de dos autos
    B: La regla de los tres segundos
    C: La regla de los cuatro segundos
    D: La regla de los cinco segundos
  answer: B
  explanation: El manual establece que hay una forma sencilla de saber si está siguiendo
    demasiado de cerca llamada la "regla de los tres segundos", la cual funciona a
    cualquier velocidad.
- id: 115
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones debe aumentar su distancia de seguimiento
    a al menos cuatro segundos?
  choices:
    A: Al conducir por una carretera recién pavimentada
    B: Al seguir a una motocicleta
    C: Al conducir en un vecindario residencial
    D: Al rebasar un camión grande
  answer: B
  explanation: El manual especifica que es posible que necesite una distancia de seguimiento
    de cuatro segundos para estar seguro en ciertas situaciones, como al seguir motocicletas,
    conducir en carreteras resbaladizas o remolcar un tráiler.
- id: 116
  category: defensive_driving
  question: ¿Qué tan grande debe ser el espacio que necesita cada vez que quiera incorporarse
    al tráfico, cambiar de carril o entrar en una carretera?
  choices:
    A: Aproximadamente dos segundos
    B: Aproximadamente tres segundos
    C: Aproximadamente cuatro segundos
    D: Aproximadamente seis segundos
  answer: C
  explanation: Según el manual, cada vez que desee incorporarse al tráfico, cambiar
    de carril o entrar en una carretera, necesita un espacio de aproximadamente cuatro
    segundos.
- id: 117
  category: safe_driving_rules
  question: ¿Qué debe hacer si tiene la luz verde pero hay vehículos bloqueando la
    intersección más adelante?
  choices:
    A: Entrar en la intersección y esperar a que los vehículos se muevan.
    B: Tocar la bocina para alertar a los vehículos que bloquean el paso.
    C: No comenzar a cruzar la intersección hasta que los vehículos despejen su camino.
    D: Girar a la derecha en lugar de seguir recto.
  answer: C
  explanation: 'El manual establece: "Incluso si tiene la luz verde, no comience a
    cruzar la intersección si hay vehículos bloqueando su camino".'
- id: 118
  category: safe_driving_rules
  question: A una velocidad de 55 mph, ¿aproximadamente cuánto tiempo necesita para
    rebasar a un vehículo que viene en sentido contrario de manera segura?
  choices:
    A: 3 segundos
    B: 5 segundos
    C: 10 segundos
    D: 15 segundos
  answer: C
  explanation: El manual señala que a una velocidad de 55 mph, se necesitan unos 10
    segundos para rebasar, lo que significa que necesita un espacio de 10 segundos
    en el tráfico que viene en sentido contrario.
- id: 119
  category: defensive_driving
  question: ¿No debe comenzar a rebasar a un vehículo si se encuentra a qué distancia
    de una colina o curva?
  choices:
    A: Un cuarto de milla
    B: Un tercio de milla
    C: Media milla
    D: Una milla
  answer: B
  explanation: El manual establece que no debe comenzar a rebasar si se encuentra
    a menos de un tercio de milla de una colina o curva, ya que debe poder ver al
    menos a esa distancia hacia adelante.
- id: 120
  category: safe_driving_rules
  question: ¿Cuándo es seguro regresar al carril de conducción después de rebasar
    a otro vehículo?
  choices:
    A: Cuando esté a una distancia de un auto por delante del vehículo rebasado.
    B: Cuando pueda ver ambos faros delanteros del vehículo rebasado en su espejo
      retrovisor.
    C: Tan pronto como su parachoques trasero pase la parte delantera del vehículo
      rebasado.
    D: Cuando el conductor del vehículo rebasado parpadee sus faros delanteros.
  answer: B
  explanation: El manual indica que es seguro regresar al carril de conducción cuando
    pueda ver ambos faros delanteros del vehículo que acaba de rebasar en su espejo
    retrovisor.
- id: 121
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima de seguridad que los conductores de vehículos
    motorizados deben intentar mantener al rebasar a un ciclista?
  choices:
    A: Dos pies
    B: Tres pies
    C: Cuatro pies
    D: Cinco pies
  answer: D
  explanation: Los conductores de vehículos motorizados deben mantener una distancia
    de seguridad al rebasar a un ciclista, intentando que sea de al menos cinco pies.
- id: 122
  category: sharing_the_road
  question: ¿Qué debe hacer si necesita girar a la derecha inmediatamente después
    de rebasar a un ciclista que está a su derecha?
  choices:
    A: Acelerar y realizar un giro repentino a la derecha frente al ciclista.
    B: Tocar la bocina para advertir al ciclista antes de realizar el giro.
    C: Reducir la velocidad e incorporarse detrás del ciclista antes de girar.
    D: Detenerse en el carril de circulación y esperar a que el ciclista gire primero.
  answer: C
  explanation: 'El manual establece explícitamente: ''No realice un giro repentino
    a la derecha después de rebasar a un ciclista a su derecha. En su lugar, reduzca
    la velocidad e incorpórese detrás del ciclista antes de girar''.'
- id: 123
  category: sharing_the_road
  question: ¿Qué indican los 'sharrows' (flechas de carril compartido) pintados en
    el pavimento?
  choices:
    A: La carretera está cerrada al tráfico de bicicletas.
    B: Los ciclistas deben circular por la acera.
    C: La carretera es demasiado estrecha para compartirla lado a lado y se anima
      a los ciclistas a ocupar todo el carril.
    D: Los automovilistas tienen el derecho de paso exclusivo en ese carril.
  answer: C
  explanation: Los 'sharrows' indican que una carretera es demasiado estrecha para
    compartirla lado a lado, se anima a los ciclistas a ocupar todo el carril de circulación
    y los automovilistas deben cederles el paso.
- id: 124
  category: vehicle_information
  question: ¿Aproximadamente cuánto podría tardar en detenerse un camión grande que
    circula a 55 mph?
  choices:
    A: 200 pies
    B: 400 pies
    C: 600 pies
    D: Casi 800 pies
  answer: D
  explanation: Según el manual, mientras que un automóvil promedio que circula a 55
    mph puede detenerse en unos 400 pies, un camión grande podría tardar casi 800
    pies en detenerse.
- id: 125
  category: sharing_the_road
  question: ¿Por qué debería esperar un segundo y volver a revisar las luces direccionales
    de un camión grande si cree que está girando a la izquierda?
  choices:
    A: El camión puede estar abriéndose para realizar un giro a la derecha.
    B: El conductor del camión puede estar señalizando un cambio de carril en su lugar.
    C: Las luces direccionales del camión suelen estar rotas.
    D: El camión se está preparando para detenerse y retroceder.
  answer: A
  explanation: Los camiones grandes a menudo se abren para hacer un giro a la derecha.
    El manual aconseja revisar las señales nuevamente porque el conductor realmente
    podría estar girando a la derecha, incluso si parece que está girando a la izquierda.
- id: 126
  category: sharing_the_road
  question: ¿Cuál es una buena regla general para determinar si está conduciendo en
    el punto ciego de un camionero?
  choices:
    A: Si se encuentra a menos de 50 pies de la parte trasera del camión, está en
      un punto ciego.
    B: Si no puede ver al conductor en el espejo lateral del camión, el conductor
      no puede verlo a usted.
    C: Si conduce por el lado izquierdo del camión, está en un punto ciego.
    D: Si puede ver los faros del camión en su espejo retrovisor, está en un punto
      ciego.
  answer: B
  explanation: 'El manual establece: ''En general, si no puede ver al conductor en
    el espejo lateral, el conductor no puede verlo a usted''.'
- id: 127
  category: sharing_the_road
  question: ¿Por qué lado debe rebasar siempre a un camión grande o vehículo recreativo
    (RV)?
  choices:
    A: Por el lado derecho
    B: Por el lado izquierdo
    C: Por el lado con el arcén más ancho
    D: Por el lado que tenga menos tráfico
  answer: B
  explanation: 'El manual instruye explícitamente a los conductores: ''Siempre rebase
    a un camión grande o RV por el lado izquierdo''.'
- id: 128
  category: sharing_the_road
  question: ¿Cuál es la regla con respecto a los cascos de bicicleta en Nuevo México?
  choices:
    A: Solo los adultos están obligados a usar casco.
    B: Los cascos son opcionales para todos los ciclistas.
    C: Los adultos deberían, y los menores deben, usar un casco que ajuste bien.
    D: Los cascos solo son obligatorios cuando se circula de noche.
  answer: C
  explanation: El manual establece bajo Consideraciones Especiales para el Ciclismo
    en el Tráfico que 'Los adultos deberían, y los menores deben, usar un casco que
    ajuste bien'.
- id: 129
  category: sharing_the_road
  question: ¿Cuál es la forma adecuada de rebasar a un camión grande o vehículo recreativo
    (RV)?
  choices:
    A: Rebasar por la derecha y permanecer en el punto ciego.
    B: Rebasar por la izquierda y avanzar delante de él.
    C: Seguirlo muy de cerca hasta que el camión cambie de carril.
    D: Tocar la bocina y rebasar por cualquier lado.
  answer: B
  explanation: El manual indica que siempre se debe rebasar a un camión grande o RV
    por el lado izquierdo y, después de rebasarlo, avanzar delante de él sin permanecer
    en el punto ciego del conductor.
- id: 130
  category: sharing_the_road
  question: 'Al conducir cerca de un camión grande o RV, debe recordar que:'
  choices:
    A: Pueden detenerse mucho más rápido que los automóviles de pasajeros.
    B: Pueden parecer que van más despacio de lo que realmente van.
    C: Tienen puntos ciegos más pequeños que los vehículos estándar.
    D: Siempre tienen el derecho de paso en las autopistas.
  answer: B
  explanation: El manual señala que se debe recordar que un camión grande o RV puede
    parecer que va más despacio de lo que realmente va.
- id: 131
  category: driver_testing
  question: Para aprobar el examen de la vista para una licencia de conducir de Nuevo
    México, ¿cuál es la agudeza visual mínima requerida?
  choices:
    A: 20/20 en ambos ojos
    B: 20/30 en al menos un ojo
    C: 20/40 en al menos un ojo
    D: 20/50 en ambos ojos
  answer: C
  explanation: Nuevo México requiere que usted tenga una visión de al menos 20/40
    en al menos un ojo, con o sin lentes correctivos.
- id: 132
  category: safe_driving_rules
  question: ¿Por qué debe evitar el uso de gafas oscuras o lentes de contacto teñidos
    por la noche?
  choices:
    A: Aumentan el deslumbramiento de los faros de los vehículos que vienen en sentido
      contrario.
    B: Reducen la luz que usted necesita para ver con claridad.
    C: Hacen que sus ojos se fatiguen más rápidamente.
    D: Es ilegal usarlos mientras se conduce en Nuevo México.
  answer: B
  explanation: El manual indica que se debe evitar el uso de gafas oscuras o lentes
    de contacto teñidos por la noche porque reducen la luz que usted necesita para
    ver con claridad.
- id: 133
  category: defensive_driving
  question: 'Para ayudar a prevenir el cansancio en un viaje largo, el manual recomienda
    que usted:'
  choices:
    A: Coma una comida abundante antes de salir para no tener hambre.
    B: Coma ligero, ya que algunas personas se sienten somnolientas después de una
      comida abundante.
    C: Confíe en el café y las bebidas energéticas para mantenerse despierto.
    D: Conduzca tan rápido como sea legalmente posible para acortar el viaje.
  answer: B
  explanation: El manual aconseja comer ligero y no ingerir una comida abundante antes
    de salir, porque algunas personas sienten sueño después de comer mucho.
- id: 134
  category: alcohol_drugs_health
  question: ¿Cuánto tiempo tarda normalmente el alcohol en llegar al cerebro después
    de su consumo?
  choices:
    A: De 5 a 10 minutos
    B: De 20 a 40 minutos
    C: De 1 a 2 horas
    D: De 3 a 4 horas
  answer: B
  explanation: Según el manual, el alcohol pasa del estómago a la sangre y llega al
    cerebro en un periodo de 20 a 40 minutos.
- id: 135
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes contiene la misma cantidad de alcohol que una
    lata de cerveza de 12 oz?
  choices:
    A: Una copa de vino de 5 oz
    B: Una copa de vino de 8 oz
    C: Un trago (shot) de 3 oz de licor de 80 grados (80-proof)
    D: Un refresco de vino (wine cooler) de 12 oz
  answer: A
  explanation: El manual establece que una bebida alcohólica equivale a 1 1/2 oz de
    licor de 80 grados (80-proof), 12 oz de cerveza o una copa de vino de 5 oz.
- id: 136
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma eficaz de recuperar la sobriedad después de beber
    alcohol?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Tomar aire fresco y hacer ejercicio
    D: Permitir que pase el tiempo
  answer: D
  explanation: El manual establece explícitamente que el café, el aire fresco, el
    ejercicio o las duchas frías no ayudarán, y que el tiempo es lo único que le devolverá
    la sobriedad.
- id: 137
  category: penalties_and_points
  question: 'En Nuevo México, si es menor de 21 años, puede ser arrestado por conducir
    con un contenido de alcohol en la sangre (BAC) de al menos:'
  choices:
    A: .00%
    B: .02%
    C: .04%
    D: .08%
  answer: B
  explanation: El manual establece que en Nuevo México, si es menor de 21 años, puede
    ser arrestado por un BAC de .02%.
- id: 138
  category: penalties_and_points
  question: ¿Cuál es la sanción si un oficial de policía le pide que se someta a una
    prueba de BAC y usted se niega?
  choices:
    A: Recibirá una multa de advertencia.
    B: Se le multará con $500 pero conservará su licencia.
    C: Puede perder su licencia de conducir por un año.
    D: Se le requerirá tomar un curso de conducción defensiva.
  answer: C
  explanation: Si un oficial de policía o de tránsito le pide que se someta a una
    prueba de BAC y usted se niega a hacerlo, puede perder su licencia de conducir
    por un año.
- id: 139
  category: penalties_and_points
  question: ¿Cuánto tiempo permanecerá una condena por DWI en su historial de conducción
    en Nuevo México?
  choices:
    A: 5 años
    B: 10 años
    C: 15 años
    D: 25 años
  answer: D
  explanation: El manual establece que cualquier condena por DWI (conducir bajo la
    influencia) permanecerá en su historial de conducción durante veinticinco años.
- id: 140
  category: alcohol_drugs_health
  question: ¿Cuál es un peligro potencial de tomar estimulantes ("uppers") o pastillas
    para adelgazar antes de conducir?
  choices:
    A: Mejoran permanentemente sus reflejos.
    B: Pueden hacer que se sienta nervioso, mareado e incapaz de concentrarse más
      tarde.
    C: Reducen el contenido de alcohol en la sangre.
    D: Curan el mareo por movimiento pero causan ceguera temporal.
  answer: B
  explanation: El manual explica que, si bien las pastillas estimulantes pueden hacer
    que un conductor se sienta más alerta por un corto tiempo, más tarde pueden causar
    que la persona se sienta nerviosa, mareada, incapaz de concentrarse y afectar
    la visión.
- id: 141
  category: alcohol_drugs_health
  question: ¿En Nuevo México, qué se requiere para que una persona con epilepsia reciba
    una licencia de conducir?
  choices:
    A: Deben conducir únicamente durante las horas del día.
    B: Deben estar estables y sin convulsiones durante un período de 6 meses.
    C: Deben tener a un conductor con licencia mayor de 21 años en el asiento del
      pasajero.
    D: Deben instalar un dispositivo de interbloqueo de encendido.
  answer: B
  explanation: Las personas con epilepsia deben estar estables y sin convulsiones
    durante un período de 6 meses antes de que se les otorgue una licencia de conducir.
- id: 142
  category: driver_responsibility
  question: ¿Qué aconseja el manual con respecto al uso del teléfono celular mientras
    se conduce?
  choices:
    A: Es seguro siempre que mantenga una mano en el volante.
    B: Debe detenerse a un lado de la carretera para realizar o recibir una llamada
      siempre que sea posible.
    C: Solo puede usar un teléfono celular mientras conduce en autopistas interestatales.
    D: Se permite enviar mensajes de texto si está detenido en un semáforo en rojo.
  answer: B
  explanation: El manual aconseja detenerse a un lado de la carretera para realizar
    o recibir una llamada siempre que sea posible, ya que marcar o hablar puede ser
    una distracción peligrosa.
- id: 143
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una consecuencia de su primera condena por
    conducir bajo los efectos del alcohol o drogas (DWI)?
  choices:
    A: Se le ordenará instalar un dispositivo de interbloqueo de encendido en su vehículo.
    B: Su vehículo será confiscado permanentemente por el estado.
    C: Solo recibirá una advertencia si su nivel de alcohol en sangre (BAC) era inferior
      al .10%.
    D: Su historial de manejo se borrará después de 5 años de conducción segura.
  answer: A
  explanation: Por una primera condena de DWI, pagará multas elevadas, podría ser
    sentenciado a la cárcel y se le ordenará recibir tratamiento e instalar un dispositivo
    de interbloqueo de encendido en su vehículo.
- id: 144
  category: safe_driving_rules
  question: ¿Cuál es la acción recomendada si debe usar un teléfono celular mientras
    conduce?
  choices:
    A: Conducir más lento mientras habla por teléfono.
    B: Detenerse a un lado de la carretera para realizar o recibir una llamada siempre
      que sea posible.
    C: Sostener el teléfono con la mano izquierda y maniobrar el volante con la derecha.
    D: Solo marcar números mientras esté detenido en un semáforo en rojo o en una
      señal de alto.
  answer: B
  explanation: 'El manual establece: ''Deténgase a un lado de la carretera para realizar
    o recibir una llamada siempre que sea posible''. También señala que marcar o hablar
    por un teléfono celular puede ser una distracción peligrosa.'
- id: 145
  category: vehicle_information
  question: ¿Cuál es el primer paso que debe tomar si sus frenos dejan de funcionar
    repentinamente?
  choices:
    A: Cambiar a punto muerto (neutral) inmediatamente.
    B: Tirar del freno de estacionamiento tan fuerte y rápido como pueda.
    C: Bombear el pedal del freno varias veces.
    D: Apagar el motor para detener el vehículo.
  answer: C
  explanation: Si sus frenos dejan de funcionar, el manual indica que primero debe
    'Bombear el pedal del freno varias veces. Esto a menudo generará suficiente presión
    de frenado para permitirle detenerse'.
- id: 146
  category: defensive_driving
  question: 'Si un neumático se desinfla repentinamente mientras conduce, usted debe:'
  choices:
    A: Pisar los frenos a fondo para detenerse lo más rápido posible.
    B: Sujetar el volante con firmeza y mantener el vehículo en línea recta.
    C: Girar el volante bruscamente hacia el acotamiento de la carretera.
    D: Acelerar ligeramente para mantener el control del vehículo.
  answer: B
  explanation: En caso de que un neumático reviente, el manual aconseja 'Sujetar el
    volante con firmeza y mantener el vehículo en línea recta', y reducir la velocidad
    gradualmente quitando el pie del acelerador y usando los frenos ligeramente.
- id: 147
  category: vehicle_information
  question: ¿Qué sucede con los controles de su vehículo si el motor se apaga mientras
    conduce?
  choices:
    A: El volante se bloqueará por completo y no se podrá girar.
    B: Los frenos dejarán de funcionar por completo.
    C: La dirección puede ser difícil de girar, pero aún podrá girarla.
    D: El pedal del acelerador aplicará automáticamente los frenos.
  answer: C
  explanation: Si hay una falla de energía y el motor se apaga, debe 'Mantener un
    agarre firme en el volante. Tenga en cuenta que la dirección puede ser difícil
    de girar, pero puede girarla'. Los frenos también seguirán funcionando, pero pueden
    requerir un empuje muy fuerte.
- id: 148
  category: defensive_driving
  question: Si su motor sigue acelerando cada vez más porque el pedal del acelerador
    se queda pegado, ¿qué debe hacer primero?
  choices:
    A: Apagar el encendido inmediatamente.
    B: Cambiar rápidamente a punto muerto (neutral).
    C: Aplicar el freno de estacionamiento.
    D: Bombear el pedal del acelerador para despegarlo.
  answer: B
  explanation: 'Si el pedal del acelerador se queda pegado, el manual enumera los
    pasos en orden: ''Mantenga la vista en la carretera. Cambie rápidamente a punto
    muerto (neutral). Salga de la carretera cuando sea seguro hacerlo. Apague el motor''.'
- id: 149
  category: defensive_driving
  question: Cuando parece que puede ocurrir una colisión, ¿cuáles son las tres opciones
    de un conductor para evitarla?
  choices:
    A: Detenerse, girar o acelerar.
    B: Frenar, tocar la bocina o desviarse.
    C: Detenerse, dar marcha atrás o tocar la bocina.
    D: Acelerar, frenar o prepararse para el impacto.
  answer: A
  explanation: 'Según el manual, ''Para evitar una colisión, los conductores tienen
    tres opciones: detenerse, girar o acelerar''.'
- id: 150
  category: vehicle_information
  question: ¿Cómo debe frenar si necesita detenerse rápidamente y su vehículo está
    equipado con un Sistema de Frenos Antibloqueo (ABS)?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Presionar el pedal del freno tan fuerte como pueda y seguir presionándolo.
    C: Aplicar los frenos ligeramente y soltar si siente que el pedal retrocede.
    D: Pisar el pedal del freno, soltar y luego girar el volante.
  answer: B
  explanation: Con ABS, si necesita detenerse rápidamente, debe 'Presionar el pedal
    del freno tan fuerte como pueda y seguir presionándolo'. No debe soltar el pedal
    del freno incluso si siente que este retrocede.
- id: 151
  category: defensive_driving
  question: 'Si su vehículo NO tiene ABS y necesita girar rápidamente para evitar
    una colisión, usted debe:'
  choices:
    A: Bloquear las ruedas delanteras mientras frena y gira.
    B: Presionar el pedal del freno, soltarlo y luego girar el volante.
    C: Girar el volante lo más bruscamente posible mientras mantiene presionado el
      freno.
    D: Acelerar mientras gira el volante.
  answer: B
  explanation: Sin ABS, para girar rápidamente debe "presionar el pedal del freno,
    luego soltarlo y girar el volante. Frenar reducirá la velocidad del vehículo,
    pondrá más peso en los neumáticos delanteros y permitirá un giro más rápido".
- id: 152
  category: safe_driving_rules
  question: ¿Cuál es la causa principal de los derrapes de los vehículos?
  choices:
    A: Neumáticos con poco aire.
    B: Conductores que viajan demasiado rápido para las condiciones.
    C: Bombear los frenos con demasiada lentitud.
    D: Cambiar de marcha demasiado rápido.
  answer: B
  explanation: 'El manual establece explícitamente: "Los derrapes son causados por
    conductores que viajan demasiado rápido para las condiciones".'
- id: 153
  category: defensive_driving
  question: Si su vehículo comienza a derrapar, ¿qué debe hacer con los frenos?
  choices:
    A: Bombearlos rápidamente.
    B: Presionarlos firmemente y mantenerlos presionados.
    C: No tocar el freno hasta que el vehículo disminuya la velocidad.
    D: Aplicar el freno de mano.
  answer: C
  explanation: 'Si su vehículo comienza a derrapar, el manual aconseja: "No toque
    el freno. Hasta que el vehículo disminuya la velocidad, sus frenos no funcionarán
    y podrían hacer que derrape más".'
- id: 154
  category: defensive_driving
  question: Si su vehículo está a punto de ser golpeado por delante, ¿qué debería
    intentar hacer?
  choices:
    A: Girar el vehículo para intentar recibir un "golpe de refilón".
    B: Quitar las manos del volante para protegerse la cara.
    C: Poner la marcha atrás y acelerar.
    D: Desabrocharse el cinturón de seguridad para poder salir rápidamente.
  answer: A
  explanation: Si su vehículo está a punto de ser golpeado por delante, "es importante
    intentar recibir un 'golpe de refilón' en lugar de ser golpeado de frente. Esto
    significa que si va a ocurrir una colisión, debe intentar girar el vehículo".
- id: 155
  category: driver_responsibility
  question: ¿Qué debe hacer si se ve involucrado en un accidente y su vehículo aún
    puede moverse?
  choices:
    A: Dejarlo exactamente donde está hasta que llegue la policía.
    B: Sacarlo de la carretera para que no bloquee el tráfico.
    C: Conducirlo a la comisaría de policía más cercana de inmediato.
    D: Estacionarlo cruzado en los carriles de tráfico para proteger la escena.
  answer: B
  explanation: En la escena del accidente, debe "Detener su vehículo en el lugar del
    accidente o cerca de él. Si su vehículo puede moverse, sáquelo de la carretera
    para que no bloquee el tráfico ni cause otro choque".
- id: 156
  category: driver_responsibility
  question: Si alguien resulta herido en un accidente, ¿cuál es el ÚNICO momento en
    que debe moverlo?
  choices:
    A: Si están bloqueando la calzada.
    B: Si le piden que los ayude a ponerse de pie.
    C: Si están en un vehículo en llamas o en otro peligro inmediato.
    D: Si necesita colocarlos en su vehículo para mantenerlos calientes.
  answer: C
  explanation: 'El manual instruye: "No mueva a los heridos a menos que estén en un
    vehículo en llamas o en otro peligro inmediato de ser golpeados por otro vehículo.
    Mover a una persona puede empeorar sus lesiones".'
- id: 157
  category: driver_responsibility
  question: ¿Cómo debe tratar a una persona que sangra profusamente en la escena de
    un accidente?
  choices:
    A: Darles mucha agua para beber.
    B: Aplicar presión directamente sobre la herida con la mano o un paño.
    C: Moverlos a una posición sentada de inmediato.
    D: Atar un torniquete apretado por encima de la herida y dejarlo.
  answer: B
  explanation: Si hay hemorragia, "aplique presión directamente sobre la herida con
    la mano o con un paño. Incluso una hemorragia grave casi siempre puede detenerse
    o ralentizarse aplicando presión sobre la herida".
- id: 158
  category: defensive_driving
  question: ¿Cómo debe posicionar su cuerpo si está a punto de ser golpeado por detrás?
  choices:
    A: Inclinarse hacia adelante sobre el volante.
    B: Girar el cuerpo hacia un lado para prepararse para el impacto.
    C: Presionarse contra el respaldo de su asiento y poner la cabeza contra el reposacabezas.
    D: Agacharse debajo del tablero.
  answer: C
  explanation: Si su vehículo es golpeado por detrás, su cuerpo será lanzado hacia
    atrás. Debe "Presionarse contra el respaldo de su asiento y poner la cabeza contra
    el reposacabezas".
- id: 159
  category: driver_responsibility
  question: ¿Qué debe hacer para ayudar a evitar que una persona herida entre en estado
    de shock después de un accidente?
  choices:
    A: Darles mucha agua para beber.
    B: Cubrirlos con una manta o abrigo para mantenerlos calientes.
    C: Hacer que se pongan de pie y caminen.
    D: Aplicar un torniquete por encima de la lesión.
  answer: B
  explanation: Para ayudar a evitar que una persona herida entre en estado de shock,
    el manual aconseja cubrirla con una manta o abrigo para mantenerla caliente.
- id: 160
  category: driver_responsibility
  question: 'Si se ve involucrado en un accidente con un vehículo estacionado y no
    puede encontrar al propietario, usted debe:'
  choices:
    A: Esperar junto al vehículo hasta que regrese el dueño.
    B: Llamar a una grúa para retirar el vehículo.
    C: Dejar una nota en un lugar visible con su información de contacto y la fecha
      y hora.
    D: Irse y reportarlo a su compañía de seguros más tarde.
  answer: C
  explanation: En caso de que el accidente involucre a un vehículo estacionado y no
    pueda encontrar al propietario, debe dejar una nota en un lugar donde se pueda
    ver con información sobre cómo el propietario puede localizarlo y la fecha y hora
    del accidente.
- id: 161
  category: driver_responsibility
  question: Bajo la Ley de Responsabilidad Financiera Obligatoria de Nuevo México,
    ¿cuál es la cobertura mínima de seguro requerida por daños o destrucción de la
    propiedad de terceros en un solo accidente?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: El monto mínimo de cobertura por daños o destrucción de la propiedad
    de terceros en un solo accidente es de $10,000.
- id: 162
  category: driver_responsibility
  question: ¿Cuál es el seguro de responsabilidad civil mínimo requerido por lesiones
    corporales o muerte de dos o más personas en un solo accidente en Nuevo México?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $75,000
  answer: C
  explanation: La ley especifica una cobertura mínima de $50,000 por lesiones corporales
    o muerte de dos o más personas en un solo accidente.
- id: 163
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una posible consecuencia de no tener un seguro
    de responsabilidad civil para vehículos motorizados?
  choices:
    A: Servicio comunitario obligatorio
    B: Suspensión del registro de su vehículo y entrega de las placas de circulación
    C: Revocación inmediata de su licencia de conducir por cinco años
    D: Confiscación de su vehículo por parte del estado
  answer: B
  explanation: No tener seguro podría resultar en la no emisión o suspensión del registro
    de su vehículo y la entrega de las placas de circulación, así como posibles sanciones
    penales.
- id: 164
  category: vehicle_information
  question: ¿Qué parte de la potencia total de frenado de una motocicleta puede proporcionar
    el freno delantero?
  choices:
    A: Un cuarto
    B: La mitad
    C: Tres cuartos
    D: Toda
  answer: C
  explanation: El freno delantero es más potente y puede proporcionar hasta tres cuartas
    partes de su potencia total de frenado.
- id: 165
  category: safe_driving_rules
  question: 'Al reducir la velocidad o detener una motocicleta, usted debe:'
  choices:
    A: Usar solo el freno trasero para paradas normales
    B: Usar solo el freno delantero para evitar derrapes
    C: Aplicar tanto el freno delantero como el trasero al mismo tiempo
    D: Aplicar primero el freno trasero, seguido del freno delantero
  answer: C
  explanation: Debe usar ambos frenos cada vez que reduzca la velocidad o se detenga,
    y aplicar ambos frenos al mismo tiempo.
- id: 166
  category: defensive_driving
  question: ¿Por qué los motociclistas deben evitar conducir al lado de autos o camiones
    en otros carriles?
  choices:
    A: Reduce la eficiencia de combustible de la motocicleta
    B: La motocicleta podría estar en el punto ciego del auto y tener su ruta de escape
      bloqueada
    C: Es ilegal conducir en paralelo a un auto en Nuevo México
    D: La ráfaga de viento del auto hará que la motocicleta se apague
  answer: B
  explanation: Usted podría estar en el punto ciego de un auto en el carril de al
    lado, el cual podría cambiarse a su carril sin previo aviso. Los autos en el carril
    contiguo también bloquean su escape si se encuentra con un peligro.
- id: 167
  category: defensive_driving
  question: Al pasar autos estacionados en una motocicleta, ¿dónde es usualmente mejor
    posicionarse si hay tráfico en sentido contrario?
  choices:
    A: Hacia la derecha de su carril
    B: En la posición central del carril
    C: Hacia la izquierda de su carril
    D: En el acotamiento de la carretera
  answer: B
  explanation: Si hay tráfico en sentido contrario al pasar autos estacionados, generalmente
    es mejor permanecer en la posición central del carril para maximizar su margen
    de espacio.
- id: 168
  category: sharing_the_road
  question: ¿Cómo puede un motociclista disuadir a otros conductores de intentar compartir
    su carril?
  choices:
    A: Conduciendo en el extremo derecho del carril
    B: Manteniendo una posición en el centro del carril
    C: Zigzagueando de un lado a otro dentro del carril
    D: Conduciendo en el extremo izquierdo del carril
  answer: B
  explanation: Disuada a otros de compartir el carril manteniendo una posición en
    el centro del carril siempre que los conductores puedan verse tentados a pasar
    junto a usted.
- id: 169
  category: safe_driving_rules
  question: ¿Cuál es un peligro potencial de conducir una motocicleta en el centro
    de un carril?
  choices:
    A: Es ilegal en autopistas de varios carriles
    B: Impide que el conductor vea las señales de tráfico
    C: Puede estar aceitoso por los goteos de los autos, particularmente en las intersecciones
    D: Hace que la motocicleta sea invisible para los vehículos que vienen detrás
  answer: C
  explanation: El centro de un carril puede estar aceitoso. Acumula los goteos de
    los autos, particularmente en las intersecciones.
- id: 170
  category: safe_driving_rules
  question: ¿Cuándo debe un motociclista usar sus señales de giro?
  choices:
    A: Solo cuando otros vehículos sean visibles
    B: Solo al girar en una intersección principal
    C: Siempre que planee cambiar de carril, incluso si no hay nadie más cerca
    D: Solo cuando conduzca de noche o con poca visibilidad
  answer: C
  explanation: Use sus señales cada vez que planee cambiar de carril. Úselas aunque
    crea que no hay nadie más cerca.
- id: 171
  category: safe_driving_rules
  question: Según la ley de Nuevo México, ¿quién está obligado a usar casco de motocicleta?
  choices:
    A: Todos los conductores y pasajeros de motocicletas, independientemente de su
      edad
    B: Solo los conductores de motocicletas, pero no los pasajeros
    C: Todos los conductores y pasajeros de motocicletas menores de 18 años
    D: Solo los conductores que operan una motocicleta en una carretera interestatal
  answer: C
  explanation: La ley de Nuevo México exige que todos los conductores y pasajeros
    de motocicletas menores de 18 años usen casco.
- id: 172
  category: vehicle_information
  question: ¿Cuál es una característica de los espejos convexos que se encuentran
    en la mayoría de las motocicletas?
  choices:
    A: Proporcionan una visión más estrecha de la carretera detrás
    B: Hacen que los autos parezcan estar más lejos de lo que realmente están
    C: Eliminan todos los puntos ciegos para el conductor
    D: Hacen que los autos parezcan estar más cerca de lo que realmente están
  answer: B
  explanation: La mayoría de las motocicletas tienen espejos redondeados (convexos).
    Proporcionan una visión más amplia de la carretera detrás, pero también hacen
    que los autos parezcan estar más lejos de lo que realmente están.
- id: 173
  category: driver_responsibility
  question: Si alguien sangra profusamente en un accidente, ¿cuál es la mejor manera
    de disminuir o detener el sangrado?
  choices:
    A: Darle agua a la persona para mantenerla hidratada
    B: Aplicar presión directamente sobre la herida con la mano o un paño
    C: Elevar la cabeza de la persona por encima de su corazón
    D: Esperar a que lleguen los servicios de emergencia antes de tocar la herida
  answer: B
  explanation: Incluso un sangrado severo casi siempre puede detenerse o disminuirse
    aplicando presión directamente sobre la herida con la mano o con un paño.
- id: 174
  category: vehicle_information
  question: ¿Qué efecto tienen los espejos convexos de la mayoría de las motocicletas
    en la visión del conductor?
  choices:
    A: Proporcionan una visión más estrecha de la carretera detrás.
    B: Hacen que los autos parezcan estar más lejos de lo que realmente están.
    C: Hacen que los autos parezcan estar más cerca de lo que realmente están.
    D: Eliminan todos los puntos ciegos para el conductor.
  answer: B
  explanation: La mayoría de las motocicletas tienen espejos redondeados (convexos).
    Si bien proporcionan una visión más amplia de la carretera detrás, también hacen
    que los autos parezcan estar más lejos de lo que realmente están.
- id: 175
  category: safe_driving_rules
  question: ¿Qué distancia de seguimiento debe mantener un motociclista cuando conduce
    de noche?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: C
  explanation: Debido a que las distancias son más difíciles de juzgar por la noche,
    el manual aconseja a los motociclistas mantener una distancia de seguimiento de
    tres segundos y dejar más distancia para rebasar.
- id: 176
  category: safe_driving_rules
  question: Al conducir una motocicleta de noche, ¿cuándo debe usar la luz alta?
  choices:
    A: Solo en carreteras rurales sin iluminación.
    B: Siempre que no esté siguiendo o encontrándose con un automóvil.
    C: En todo momento, incluso cuando siga a un automóvil.
    D: Solo cuando conduzca en formación escalonada.
  answer: B
  explanation: Para obtener toda la luz posible por la noche, debe usar la luz alta
    siempre que no esté siguiendo o encontrándose con un automóvil.
- id: 177
  category: sharing_the_road
  question: ¿Cuál es la mejor formación para que un grupo cercano de motocicletas
    mantenga un margen de espacio adecuado?
  choices:
    A: Formación en fila india
    B: Formación en paralelo (lado a lado)
    C: Formación escalonada
    D: Formación en V
  answer: C
  explanation: La formación escalonada es la mejor manera de mantener las filas cerradas
    y, al mismo tiempo, mantener un margen de espacio adecuado entre los conductores.
- id: 178
  category: sharing_the_road
  question: En una formación de motocicletas escalonada, ¿dónde debe posicionarse
    el segundo conductor?
  choices:
    A: En el lado izquierdo del carril, un segundo detrás del líder.
    B: En el lado derecho del carril, un segundo detrás del líder.
    C: En el lado derecho del carril, dos segundos detrás del líder.
    D: Directamente al lado del líder en el lado derecho del carril.
  answer: B
  explanation: En una formación escalonada, el líder conduce en el lado izquierdo
    del carril, mientras que el segundo conductor se mantiene un segundo detrás en
    el lado derecho del carril.
- id: 179
  category: sharing_the_road
  question: ¿Cómo deben rebasar a otro vehículo los motociclistas en una formación
    escalonada?
  choices:
    A: Todo el grupo debe rebasar al mismo tiempo.
    B: Los conductores deben rebasar en parejas.
    C: Los conductores deben rebasar de uno en uno.
    D: El líder rebasa y luego se mueve al lado derecho del carril para dejar que
      los demás rebasen.
  answer: C
  explanation: Los conductores en una formación escalonada deben rebasar de uno en
    uno. El conductor líder debe salir y rebasar cuando sea seguro, regresar a la
    posición izquierda y continuar a velocidad de rebase para abrir espacio al siguiente
    conductor.
- id: 180
  category: safe_driving_rules
  question: ¿Cuándo es mejor que un grupo de motocicletas cambie a una formación en
    fila india?
  choices:
    A: Al conducir en carreteras rectas y llanas.
    B: Al tomar curvas, girar o entrar/salir de una carretera.
    C: Al conducir de noche con tráfico pesado.
    D: Al rebasar a otro vehículo.
  answer: B
  explanation: Es mejor cambiar a una formación en fila india al tomar curvas, girar,
    entrar o salir de una carretera.
- id: 181
  category: defensive_driving
  question: ¿Qué debe hacer si un perro persigue su motocicleta?
  choices:
    A: Patear al animal para ahuyentarlo.
    B: Detener la motocicleta y esperar a que el animal se vaya.
    C: Virar bruscamente hacia el carril de al lado para evitarlo.
    D: Reducir la marcha, acercarse lentamente y luego acelerar para dejar atrás al
      animal.
  answer: D
  explanation: Si un perro lo persigue, reduzca la marcha y acérquese al animal lentamente.
    Al acercarse, acelere y deje atrás al animal. No patee al animal.
- id: 182
  category: defensive_driving
  question: ¿Dónde existe el mayor potencial de conflicto entre una motocicleta y
    el resto del tráfico?
  choices:
    A: En autopistas de varios carriles
    B: En las intersecciones
    C: En curvas cerradas
    D: En entradas residenciales
  answer: B
  explanation: El mayor potencial de conflicto entre usted y el resto del tráfico
    se encuentra en las intersecciones, donde el tráfico puede cruzarse en su trayectoria.
- id: 183
  category: defensive_driving
  question: 'Según el manual, más de la mitad de las colisiones entre motocicletas
    y automóviles son causadas por:'
  choices:
    A: Motociclistas que aceleran en luces amarillas.
    B: Conductores que invaden el derecho de paso de un motociclista.
    C: Motociclistas que conducen en los puntos ciegos de camiones grandes.
    D: Conductores que siguen demasiado de cerca a las motocicletas.
  answer: B
  explanation: Más de la mitad de las colisiones entre motocicletas y automóviles
    son causadas por conductores que invaden el derecho de paso de un motociclista,
    como autos que vienen en sentido contrario y giran a la izquierda o autos que
    salen de calles laterales.
- id: 184
  category: defensive_driving
  question: Al acercarse a una intersección en una motocicleta, ¿qué debe hacer para
    reducir el tiempo de reacción?
  choices:
    A: Hacer destellos con las luces altas al tráfico que viene en sentido contrario.
    B: Moverse al extremo derecho del carril.
    C: Cubrir el embrague (clutch) y ambos frenos.
    D: Acelerar ligeramente para despejar la intersección rápidamente.
  answer: C
  explanation: Al acercarse a la intersección, seleccione una posición en el carril
    para aumentar su visibilidad y cubra el embrague y ambos frenos para reducir el
    tiempo de reacción.
- id: 185
  category: safe_driving_rules
  question: Cuando se detiene en una intersección sin visibilidad (intersección ciega),
    ¿cómo puede verificar de manera segura el tráfico transversal?
  choices:
    A: Avanzar poco a poco hacia el carril transversal hasta que pueda ver claramente.
    B: Avanzar poco a poco, detenerse justo antes del carril transversal e inclinar
      el cuerpo hacia adelante para mirar.
    C: Ponerse de pie sobre los reposapiés para mirar por encima de los autos estacionados.
    D: Atravesar la intersección a una velocidad lenta y constante.
  answer: B
  explanation: En una intersección sin visibilidad, avance poco a poco y deténgase
    nuevamente justo antes de donde el carril de tráfico transversal se cruza con
    el suyo. Incline su cuerpo hacia adelante para mirar alrededor de los obstáculos,
    asegurándose de que su rueda delantera permanezca fuera del carril transversal.
- id: 186
  category: defensive_driving
  question: Si su motocicleta experimenta un "tambaleo" (wobble), ¿cuál es la acción
    correcta a tomar?
  choices:
    A: Acelerar para salir del tambaleo.
    B: Aplicar el freno delantero con firmeza.
    C: Cerrar el acelerador gradualmente para reducir la velocidad de la motocicleta.
    D: Desplazar su peso lo más atrás posible.
  answer: C
  explanation: Si ocurre un tambaleo, debe cerrar el acelerador gradualmente para
    reducir la velocidad de la motocicleta. Intentar acelerar para salir de él la
    hará más inestable.
- id: 187
  category: defensive_driving
  question: ¿Qué NO debe hacer si su motocicleta comienza a tambalearse?
  choices:
    A: Sujetar el manubrio con firmeza.
    B: Aplicar los frenos.
    C: Cerrar el acelerador gradualmente.
    D: Desplazar su peso hacia adelante y hacia abajo.
  answer: B
  explanation: Al experimentar un tambaleo, no debe aplicar los frenos, ya que frenar
    podría empeorar el tambaleo.
- id: 188
  category: sharing_the_road
  question: ¿En qué parte del carril debe posicionar su motocicleta cuando lo están
    rebasando por detrás?
  choices:
    A: En la parte central de su carril.
    B: En la parte del carril más alejada del vehículo que lo rebasa.
    C: En la parte del carril más cercana al vehículo que lo rebasa.
    D: En el acotamiento derecho de la carretera.
  answer: A
  explanation: Cuando lo rebase un vehículo por detrás o uno que viene en sentido
    contrario, permanezca en la parte central de su carril. Moverse a la parte más
    alejada podría invitar al otro conductor a volver a su carril demasiado pronto.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 189
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar pasar a otros de forma segura.
  id: 190
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRE (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar le pondría en el camino del tráfico en sentido contrario.
  id: 191
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 192
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: El tráfico fluye en una sola dirección — hacia la izquierda
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección — la dirección
    que señala la flecha.
  id: 193
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 194
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 195
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 196
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro en forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 197
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 198
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 199
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta área
    C: Área de caza adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 200
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de rombo con una figura de un peatón advierte
    sobre un cruce de peatones más adelante. Esté preparado para detenerse ante los
    peatones que crucen la calle.
  id: 201
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 202
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 203
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 204
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de rombo?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de rombo con una flecha curva advierte
    sobre una curva en el camino más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 205
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 206
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y esté preparado para que el camino
    curve primero hacia un lado y luego hacia el otro.
  id: 207
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte sobre una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 208
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: Inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de rombo de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 209
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Fin de la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción del ancho de la vía y ajuste su
    posición en el carril.
  id: 210
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en direcciones
    opuestas. Manténgase a la derecha.
  id: 211
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Esté preparado para
    el tráfico de doble sentido.
  id: 212
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 213
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 214
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente empinada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente empinada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 215
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está roja o amarilla. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 216
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 217
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 218
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de un camino lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la autopista desde el camino lateral.
  id: 219
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril — no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir una incorporación. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 220
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 221
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo ciudadanos de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de discapacidad válida pueden estacionarse en estos
    espacios. Las infracciones conllevan multas elevadas.
  id: 222
