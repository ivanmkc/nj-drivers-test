questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar un Permiso de Aprendizaje
    (Learner's Permit) en Guam?
  choices:
    A: 15 años de edad
    B: 15 años y 6 meses
    C: 16 años de edad
    D: 14 años y 9 meses
  answer: B
  explanation: De acuerdo con el Manual del Conductor de Guam, un solicitante debe
    tener al menos 15 años y 6 meses de edad para ser elegible para un Permiso de
    Aprendizaje.
- id: 2
  category: license_system
  question: Bajo la ley de Licencia de Conducir Graduada (GDL) de Guam, ¿cuánto tiempo
    debe un titular de permiso mantener un historial de manejo 'limpio' antes de ser
    elegible para una Licencia Intermedia?
  choices:
    A: 3 meses consecutivos
    B: 6 meses consecutivos
    C: 12 meses consecutivos
    D: 2 años
  answer: B
  explanation: El titular de un permiso debe tener al menos 16 años de edad y haber
    mantenido su permiso durante al menos 6 meses consecutivos sin infracciones de
    tránsito ni choques antes de pasar a la etapa Intermedia.
- id: 3
  category: license_system
  question: Una persona que posee un Permiso de Aprendizaje de Guam debe estar acompañada
    por un conductor con licencia completa que tenga al menos ¿cuántos años de edad?
  choices:
    A: 18 años de edad
    B: 21 años de edad
    C: 25 años de edad
    D: 30 años de edad
  answer: B
  explanation: El conductor acompañante de un titular de permiso debe tener al menos
    21 años de edad y debe poseer una licencia válida para el mismo tipo de vehículo
    que se está conduciendo.
- id: 4
  category: license_system
  question: ¿Cuáles son las restricciones de conducción nocturna para el titular de
    una Licencia Intermedia en las noches de semana (de domingo a jueves) en Guam?
  choices:
    A: No conducir entre las 10:00 PM y las 6:00 AM
    B: No conducir entre las 11:00 PM y las 5:00 AM
    C: No conducir entre las 12:00 AM y las 6:00 AM
    D: No hay restricciones para los titulares de Licencia Intermedia
  answer: A
  explanation: Los titulares de una Licencia Intermedia tienen restringido conducir
    entre las 10:00 PM y las 6:00 AM en las noches de semana (de domingo por la noche
    a jueves por la noche), a menos que estén acompañados por un padre o tutor.
- id: 5
  category: license_system
  question: En las noches de fin de semana (viernes y sábado), ¿cuáles son las horas
    de restricción de conducción para un titular de Licencia Intermedia de Guam?
  choices:
    A: 10:00 PM a 6:00 AM
    B: 11:00 PM a 5:00 AM
    C: 12:00 AM a 6:00 AM
    D: 1:00 AM a 7:00 AM
  answer: C
  explanation: Los viernes y sábados por la noche, el toque de queda para los titulares
    de Licencia Intermedia es de las 12:00 AM (medianoche) a las 6:00 AM.
- id: 6
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una Licencia Completa (Etapa 3) en
    Guam?
  choices:
    A: 16 años de edad
    B: 17 años de edad
    C: 18 años de edad
    D: 21 años de edad
  answer: B
  explanation: Para obtener una Licencia Completa en Guam, el solicitante debe tener
    al menos 17 años de edad y haber completado la etapa de Licencia Intermedia durante
    al menos 12 meses consecutivos sin infracciones.
- id: 7
  category: license_system
  question: En Guam, ¿cuál es el límite de Contenido de Alcohol en Sangre (BAC) para
    un conductor menor de 21 años?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: Guam tiene una política de tolerancia cero para menores; el límite
    de BAC para conductores menores de 21 años es de 0.02%.
- id: 8
  category: license_system
  question: Si cambia su nombre o dirección, debe notificar al Departamento de Impuestos
    e Ingresos (DMV) dentro de ¿cuántos días?
  choices:
    A: 5 días
    B: 10 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: La ley de Guam exige que los conductores notifiquen al DMV cualquier
    cambio de nombre o dirección dentro de los 10 días posteriores al cambio.
- id: 9
  category: license_system
  question: Bajo el sistema de puntos de Guam, la licencia de un conductor puede ser
    suspendida si acumula ¿cuántos puntos en un período de 12 meses?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: C
  explanation: Un conductor que acumula 10 o más puntos en un período de 12 meses
    está sujeto a la suspensión de su licencia en Guam.
- id: 10
  category: license_system
  question: ¿Cuál de los siguientes es un requisito obligatorio para todos los propietarios
    de vehículos en Guam con respecto al seguro?
  choices:
    A: Solo se requiere seguro de cobertura amplia (comprehensive)
    B: Solo se requiere seguro de colisión
    C: El seguro de responsabilidad civil (liability) es obligatorio
    D: No se requiere seguro si usted es el dueño total del automóvil
  answer: C
  explanation: La ley de Guam exige que todos los vehículos de motor estén cubiertos
    por una póliza de seguro de responsabilidad civil para proteger contra daños a
    la propiedad y lesiones personales.
- id: 11
  category: license_system
  question: Para solicitar una licencia de conducir de Guam que cumpla con la ley
    Real ID, ¿qué documento NO se requiere normalmente?
  choices:
    A: Comprobante de número de Seguro Social
    B: Comprobante de ciudadanía o presencia legal
    C: Dos comprobantes de residencia en Guam
    D: Una copia de su diploma de escuela secundaria
  answer: D
  explanation: Los requisitos de Real ID incluyen comprobante de identidad, número
    de Seguro Social (SSN) y residencia. Un diploma de escuela secundaria no es un
    requisito estándar para establecer la identidad o la residencia para una licencia
    de conducir.
- id: 12
  category: license_system
  question: ¿Cuál es la sanción para el titular de una Licencia Intermedia que es
    condenado por una infracción de tránsito por primera vez?
  choices:
    A: Pérdida permanente de la licencia
    B: El periodo de 12 meses de 'récord limpio' para la Licencia Completa se reinicia
    C: Solo una multa obligatoria de $500
    D: Ninguna sanción si es la primera infracción
  answer: B
  explanation: Bajo la ley de Licencia de Conducir Graduada (GDL) de Guam, cualquier
    infracción o accidente con culpabilidad durante la etapa Intermedia provoca que
    el periodo de espera obligatorio de 12 meses se reinicie.
- id: 13
  category: license_system
  question: En Guam, ¿cuántas horas de instrucción en el aula se requieren como parte
    de un curso certificado de Educación Vial?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 45 horas
  answer: C
  explanation: La ley de Guam requiere 40 horas de instrucción en el aula y 8 horas
    de entrenamiento al volante en una escuela de manejo autorizada.
- id: 14
  category: license_system
  question: ¿Cuál es el límite de velocidad máximo en las carreteras de Guam a menos
    que se indique lo contrario?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El límite de velocidad máximo general en Guam es de 35 mph, aunque
    puede ser menor en zonas residenciales o escolares, o mayor en áreas específicamente
    señalizadas.
- id: 15
  category: license_system
  question: Una person que se ha mudado a Guam y posee una licencia de conducir válida
    de un estado de los EE. UU. debe solicitar una licencia de Guam ¿dentro de cuántos
    días después de su llegada?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes que tengan una licencia de conducir válida de
    un estado o territorio de los EE. UU. deben obtener una licencia de conducir de
    Guam dentro de los 30 días posteriores al establecimiento de su residencia.
- id: 16
  category: license_system
  question: Para cumplir con el requisito de la vista para una licencia de conducir
    de Guam, ¿qué agudeza visual debe tener el solicitante como mínimo en ambos ojos?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Según el Manual del Conductor de Guam, los solicitantes deben tener
    una agudeza visual de al menos 20/40 en ambos ojos, con o sin lentes correctivos.
- id: 17
  category: license_system
  question: Una licencia de conducir estándar de Guam suele ser válida por ¿cuántos
    años?, dependiendo de la tarifa pagada y la elección del solicitante.
  choices:
    A: 2 o 4 años
    B: 3 o 5 años
    C: 4 o 8 años
    D: 5 o 10 años
  answer: C
  explanation: Bajo la ley actual de Guam, los residentes tienen la opción de renovar
    su licencia de conducir por un periodo de 4 u 8 años.
- id: 18
  category: license_system
  question: Además de la instrucción en el aula, ¿cuántas horas de entrenamiento al
    volante debe completar un estudiante con una escuela de capacitación de conductores
    certificada en Guam?
  choices:
    A: 4 horas
    B: 6 horas
    C: 10 horas
    D: 12 horas
  answer: B
  explanation: La ley de Licencia de Conducir Graduada (GDL) de Guam requiere 30 horas
    de instrucción en el aula y 6 horas de entrenamiento real al volante en una escuela
    de manejo autorizada.
- id: 19
  category: license_system
  question: Mientras se tiene una Licencia Intermedia (Etapa 2), ¿cuántos pasajeros
    que no sean familiares pueden viajar en el vehículo si no hay un padre o tutor
    presente?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Los titulares de una Licencia Intermedia tienen restringido el transporte
    a solo miembros de la familia inmediata, o un pasajero que no sea familiar, a
    menos que estén acompañados por un padre o tutor.
- id: 20
  category: license_system
  question: ¿Cuántos días antes de la fecha de vencimiento se le permite renovar su
    licencia de conducir de Guam?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: La ley de Guam permite a los conductores renovar su licencia hasta
    90 días antes de la fecha de vencimiento.
- id: 21
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar una Licencia de Chofer
    de Guam (Tipo B, C o D)?
  choices:
    A: 16 años
    B: 18 años
    C: 21 años
    D: 25 años
  answer: B
  explanation: Para solicitar una Licencia de Chofer en Guam, el solicitante debe
    tener al menos 18 años de edad.
- id: 22
  category: license_system
  question: ¿Cuál de los siguientes se considera un documento 'Primario' al solicitar
    una licencia de conducir o tarjeta de identificación de Guam?
  choices:
    A: Un Certificado de Nacimiento de EE. UU. certificado
    B: Una factura de servicios públicos con su nombre y dirección
    C: Un diploma de escuela secundaria
    D: Un estado de cuenta de tarjeta de crédito
  answer: A
  explanation: Un Certificado de Nacimiento de EE. UU. certificado o un Pasaporte
    de EE. UU. válido se considera un documento primario para fines de identificación
    en el DMV de Guam.
- id: 23
  category: license_system
  question: Si el titular de una Licencia Intermedia debe conducir durante las horas
    nocturnas restringidas por motivos de empleo, ¿qué debe llevar consigo?
  choices:
    A: Una copia de su certificado de nacimiento
    B: Una declaración firmada de su empleador en papel con membrete de la empresa
    C: Un certificado de antecedentes policiales
    D: El permiso por escrito de un padre en una servilleta
  answer: B
  explanation: Los conductores con una Licencia Intermedia pueden conducir durante
    las horas restringidas por motivos de trabajo si llevan una declaración firmada
    de su empleador que verifique el empleo y el horario.
- id: 24
  category: license_system
  question: ¿Qué clase de licencia se requiere en Guam para operar una motocicleta?
  choices:
    A: Clase A
    B: Clase B
    C: Clase F
    D: Clase M
  answer: C
  explanation: En Guam, el endoso o licencia de motocicleta se designa como Tipo F
    (o Clase F).
- id: 25
  category: license_system
  question: Según la ley de Guam, la 'Familia Inmediata' para los fines de las restricciones
    de pasajeros de la GDL incluye ¿cuál de los siguientes?
  choices:
    A: Solo los padres
    B: Padres, hermanos e hijos del conductor
    C: Cualquier pariente que viva en el mismo pueblo
    D: Amigos que conocen al conductor desde hace más de 5 años
  answer: B
  explanation: La familia inmediata se define como el cónyuge, hijos, padres, padrastros,
    hermanos, hermanas y abuelos del conductor.
- id: 26
  category: license_system
  question: Si pierde su licencia de conducir de Guam, ¿cuál es el primer paso que
    debe tomar según el manual oficial?
  choices:
    A: Esperar hasta que expire para obtener una nueva
    B: Solicitar un duplicado en el Departamento de Impuestos y Gravámenes (Department
      of Revenue and Taxation)
    C: Conducir usando su certificado de nacimiento en su lugar
    D: Llamar a la oficina del Gobernador
  answer: B
  explanation: Si una licencia se pierde o se destruye, el titular debe solicitar
    un duplicado en el Departamento de Impuestos y Gravámenes, División de Vehículos
    Motorizados, y pagar la tarifa requerida.
- id: 27
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para un solicitante de 'Licencia
    Completa' (Etapa 3) que es menor de 18 años?
  choices:
    A: Deben haber completado 100 horas de conducción nocturna
    B: Deben haber tenido una Licencia Intermedia durante al menos 12 meses sin ninguna
      condena de tráfico
    C: Deben estar casados
    D: Deben ser dueños de su propio vehículo
  answer: B
  explanation: Para progresar a una Licencia Completa, el conductor debe haber tenido
    la Licencia Intermedia durante al menos 12 meses y haber permanecido libre de
    condenas durante todo ese período.
- id: 28
  category: license_system
  question: En Guam, ¿qué es la ley de 'Consentimiento Implícito' (Implied Consent)?
  choices:
    A: Usted consiente que su vehículo sea registrado en cualquier momento
    B: Usted consiente en seguir todos los límites de velocidad
    C: Usted consiente una prueba química de su sangre, aliento u orina si es arrestado
      por DUI
    D: Usted consiente en pagar todas las multas de inmediato
  answer: C
  explanation: La ley de Consentimiento Implícito significa que al conducir por las
    carreteras de Guam, usted ya ha dado su consentimiento para ser sometido a pruebas
    de alcohol o drogas si un oficial de la ley tiene una causa razonable.
- id: 29
  category: license_system
  question: Una persona que es un 'Conductor Seguro' en Guam y no tiene infracciones
    de tráfico durante un período determinado, ¿para qué puede ser elegible?
  choices:
    A: Un registro de vehículo gratuito
    B: Una exención del examen escrito al renovar
    C: Un descuento en la tarifa de su licencia de conducir
    D: Permiso para ignorar los límites de velocidad en zonas escolares
  answer: B
  explanation: La ley de Guam permite que el Director de Impuestos y Gravámenes exima
    del examen escrito para la renovación si el solicitante tiene un historial de
    conducción limpio durante el período anterior.
- id: 30
  category: driver_testing
  question: En Guam, ¿cuál es la distancia mínima a la que debe estacionar su vehículo
    de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: Según el Manual del Conductor de Guam, es ilegal estacionar un vehículo
    a menos de 15 pies de un hidrante de incendios.
- id: 31
  category: driver_testing
  question: Al intentar girar, ¿debe dar una señal continua durante al menos cuántos
    pies antes de realizar el giro?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: La ley de Guam exige que los conductores indiquen su intención de girar
    durante al menos 100 pies antes de realizar el giro.
- id: 32
  category: driver_testing
  question: En Guam, ¿cuándo se le permite hacer un giro en U en un distrito comercial?
  choices:
    A: En cualquier lugar, siempre que sea seguro
    B: Solo en las intersecciones
    C: Solo entre intersecciones
    D: Los giros en U nunca están permitidos en los distritos comerciales
  answer: B
  explanation: Según la ley de Guam, los giros en U en los distritos comerciales están
    prohibidos, excepto en las intersecciones o donde lo permitan específicamente
    las señales.
- id: 33
  category: driver_testing
  question: Según el Manual del Conductor de Guam, ¿cuál es la distancia de seguimiento
    recomendada detrás de otro vehículo?
  choices:
    A: La longitud de un automóvil por cada 10 mph de velocidad
    B: La longitud de dos automóviles independientemente de la velocidad
    C: 50 pies en todo momento
    D: La longitud de un automóvil por cada 20 mph de velocidad
  answer: A
  explanation: El Manual del Conductor de Guam sugiere mantener una distancia de seguimiento
    de al menos la longitud de un automóvil por cada 10 millas por hora (mph) de velocidad.
- id: 34
  category: driver_testing
  question: Cuando un autobús escolar se detiene en una carretera de dos carriles
    con sus luces rojas intermitentes y el brazo de parada extendido, ¿quién debe
    detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se aproxima por delante
    C: El tráfico de ambas direcciones
    D: Nadie, si hay al menos dos carriles
  answer: C
  explanation: En las carreteras no divididas de Guam, el tráfico que circula en ambas
    direcciones debe detenerse cuando un autobús escolar está cargando o descargando
    estudiantes con luces rojas intermitentes.
- id: 35
  category: driver_testing
  question: ¿Cuál es la multa mínima por una primera infracción de la ley de cinturón
    de seguridad obligatorio de Guam?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: La ley de Guam (16 GCA § 1102) exige una multa de $100 por la primera
    infracción del requisito del cinturón de seguridad.
- id: 36
  category: driver_testing
  question: Al estacionar un vehículo cuesta abajo en una calle de doble sentido con
    bordillo, ¿hacia dónde deben girarse las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: Lejos del bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: A
  explanation: Al estacionar cuesta abajo, las ruedas deben girarse hacia el bordillo
    para que, si el vehículo rueda, choque contra el bordillo y se detenga.
- id: 37
  category: driver_testing
  question: En Guam, ¿se debe presentar un informe de accidente si hay daños a la
    propiedad que superen qué cantidad?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: La ley de Guam exige que se presente un informe de accidente ante el
    Departamento de Policía si el accidente resulta en lesiones, muerte o daños a
    la propiedad de $250 o más.
- id: 38
  category: driver_testing
  question: ¿Cuál es el rango de multa por tirar basura desde un vehículo motorizado
    en Guam?
  choices:
    A: Entre $50 y $100
    B: Entre $100 y $200
    C: Entre $200 y $500
    D: Entre $500 y $1,000
  answer: C
  explanation: Según la ley de Guam y el manual del conductor, tirar basura es una
    infracción castigada con una multa no menor de $200 ni mayor de $500.
- id: 39
  category: driver_testing
  question: ¿Qué señal manual es la forma correcta de indicar un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia afuera y doblado hacia arriba por el codo
    C: Brazo izquierdo extendido hacia afuera y doblado hacia abajo por el codo
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: Para indicar un giro a la derecha mediante señales manuales, el conductor
    debe extender el brazo izquierdo por la ventana y doblarlo hacia arriba por el
    codo.
- id: 40
  category: driver_testing
  question: Cuando dos vehículos entran en una intersección desde diferentes carreteras
    aproximadamente al mismo tiempo, ¿qué conductor tiene la preferencia de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja a una velocidad mayor
    D: El conductor de la carretera más grande
  answer: B
  explanation: En Guam, cuando dos vehículos llegan a una intersección no controlada
    al mismo tiempo, el conductor del vehículo de la izquierda debe ceder la preferencia
    de paso al vehículo de la derecha.
- id: 41
  category: driver_testing
  question: ¿A cuántos pies de distancia debe estacionarse de una señal de alto (stop
    sign), una baliza intermitente o una señal de control de tráfico?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Guam prohíbe estacionarse a menos de 30 pies de cualquier
    baliza intermitente oficial, señal de alto o señal de control de tráfico ubicada
    al costado de una carretera.
- id: 42
  category: driver_testing
  question: 'Una línea amarilla continua en su lado de la línea central significa:'
  choices:
    A: Puede rebasar si es seguro hacerlo
    B: Se encuentra en una zona de construcción
    C: Está prohibido rebasar
    D: La carretera más adelante es de un solo sentido
  answer: C
  explanation: Una línea amarilla continua en su lado de la carretera indica una "zona
    de no rebasar" donde es inseguro e ilegal adelantar a otros vehículos.
- id: 43
  category: driver_testing
  question: ¿Cuál es el límite de velocidad en una zona escolar de Guam cuando hay
    niños presentes o las luces están parpadeando?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad en las zonas escolares de Guam es de 15 millas
    por hora (mph) cuando hay niños presentes o cuando las señales de la zona escolar
    están activas.
- id: 44
  category: driver_testing
  question: Bajo la ley de "Consentimiento Implícito" (Implied Consent) de Guam, al
    conducir por las carreteras de Guam, se considera que usted ha dado su consentimiento
    para ¿qué?
  choices:
    A: Un registro de su vehículo en cualquier momento
    B: Una prueba química de su sangre, aliento u orina para detectar alcohol o drogas
    C: La instalación de un dispositivo de control de velocidad
    D: Un nuevo examen de conducción obligatorio cada dos años
  answer: B
  explanation: La ley de Consentimiento Implícito significa que se considera que cualquier
    persona que opere un vehículo motorizado en Guam ha dado su consentimiento para
    una prueba química de su aliento, sangre u orina para determinar el contenido
    de alcohol o drogas si es arrestada por conducir bajo la influencia (DUI).
- id: 45
  category: driver_testing
  question: En Guam, ¿es ilegal estacionar un vehículo a menos de cuántos pies de
    un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: De acuerdo con las regulaciones de estacionamiento de Guam, no se puede
    estacionar un vehículo a menos de 15 pies de un hidrante de incendios.
- id: 46
  category: driver_testing
  question: En Guam, ¿en cuál de las siguientes áreas está específicamente prohibido
    dar una vuelta en U (U-turn)?
  choices:
    A: En un distrito residencial
    B: En un distrito comercial, excepto en una intersección
    C: En cualquier carretera de dos carriles
    D: A menos de 500 pies de un semáforo
  answer: B
  explanation: La ley de Guam prohíbe dar una vuelta en U en un distrito comercial,
    excepto en una intersección donde dicho giro esté permitido.
- id: 47
  category: driver_testing
  question: Cuando un vehículo de emergencia (ambulancia, camión de bomberos o patrulla
    de policía) se aproxima con sirenas y luces intermitentes, ¿qué debe hacer usted?
  choices:
    A: Acelerar para salir del camino
    B: Detenerse exactamente donde está
    C: Ceder el paso y moverse al borde derecho de la carretera y detenerse
    D: Seguir al vehículo para ver a dónde va
  answer: C
  explanation: Al acercarse un vehículo de emergencia que utiliza señales auditivas
    o visuales, los conductores deben ceder el paso, moverse al borde derecho de la
    carretera y detenerse hasta que el vehículo haya pasado.
- id: 48
  category: driver_testing
  question: ¿Cuál es la distancia de seguimiento recomendada detrás del vehículo que
    va delante de usted bajo condiciones normales de conducción en Guam?
  choices:
    A: La longitud de un automóvil
    B: Dos segundos
    C: Cinco segundos
    D: 50 pies
  answer: B
  explanation: El Manual del Conductor de Guam recomienda mantener una distancia de
    seguimiento de "dos segundos" para asegurar suficiente tiempo para reaccionar
    ante el vehículo de adelante.
- id: 49
  category: driver_testing
  question: En Guam, ¿quién está obligado a usar el cinturón de seguridad en un vehículo
    motorizado en movimiento?
  choices:
    A: Solo el conductor
    B: Solo el conductor y el pasajero del asiento delantero
    C: El conductor y todos los pasajeros
    D: Solo los pasajeros menores de 18 años
  answer: C
  explanation: La ley de Guam exige que el conductor y todos los pasajeros de un vehículo
    motorizado estén debidamente sujetos por un cinturón de seguridad o un sistema
    de retención infantil.
- id: 50
  category: driver_responsibility
  question: En Guam, ¿debe informar un accidente al Departamento de Policía de Guam
    inmediatamente si los daños a la propiedad exceden qué cantidad?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Según el Manual del Conductor de Guam, cualquier accidente que involucre
    daños a la propiedad de $250 o más debe informarse al Departamento de Policía
    de Guam de inmediato.
- id: 51
  category: driver_responsibility
  question: ¿Bajo la Ley de Responsabilidad Financiera de Vehículos de Guam, cuáles
    son los requisitos mínimos de seguro de responsabilidad civil?
  choices:
    A: $10,000/$20,000/$5,000
    B: $15,000/$30,000/$10,000
    C: $20,000/$40,000/$10,000
    D: $25,000/$50,000/$20,000
  answer: C
  explanation: La ley de Guam exige una cobertura mínima de responsabilidad civil
    de $20,000 por lesiones corporales a una persona, $40,000 por lesiones corporales
    a dos o más personas y $10,000 por daños a la propiedad (20/40/10).
- id: 52
  category: driver_responsibility
  question: ¿Con qué frecuencia debe someterse a una inspección de seguridad obligatoria
    un vehículo registrado en Guam?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Todos los vehículos en Guam deben aprobar una inspección de seguridad
    anualmente en una estación de inspección autorizada antes de que se pueda renovar
    el registro.
- id: 53
  category: driver_responsibility
  question: Para conductores de 21 años de edad o más, es ilegal operar un vehículo
    de motor en Guam con un Contenido de Alcohol en Sangre (BAC) de ____ o más.
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En Guam, el límite legal de Contenido de Alcohol en Sangre (BAC) para
    conductores adultos (21 años o más) es de 0.08%.
- id: 54
  category: driver_responsibility
  question: ¿Cuál es la multa para una persona no autorizada que se estacione en un
    espacio designado para personas con discapacidades en Guam?
  choices:
    A: Entre $50 y $100
    B: Entre $100 y $200
    C: Entre $300 y $500
    D: Exactamente $1,000
  answer: C
  explanation: Según la ley de Guam (16 GCA § 3401.1), la multa por estacionarse ilegalmente
    en un espacio para personas con discapacidad no es menor de $300 ni mayor de $500.
- id: 55
  category: driver_responsibility
  question: 'Según la ley de Guam, los niños entre las edades de 4 y 11 años que midan
    menos de 4 pies y 9 pulgadas de altura deben estar asegurados en:'
  choices:
    A: Solo un asiento infantil orientado hacia atrás
    B: Un asiento elevador (booster seat)
    C: El asiento delantero con un cinturón de seguridad estándar
    D: Cualquier asiento con solo un cinturón de regazo
  answer: B
  explanation: La Ley de Retención Infantil de Guam exige que los niños de 4 a 11
    años (de menos de 4'9" de altura) usen un asiento elevador para garantizar que
    los cinturones de regazo y hombro del vehículo ajusten correctamente.
- id: 56
  category: driver_responsibility
  question: Si usted está involucrado en un accidente donde un oficial de policía
    no asiste a la escena, ¿cuánto tiempo tiene para presentar un informe por escrito
    al Departamento de Ingresos e Impuestos (Department of Revenue and Taxation)?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 10 días
  answer: A
  explanation: Si un oficial de policía no está presente para investigar un accidente
    que involucre lesiones o daños a la propiedad superiores a $250, el conductor
    debe presentar un informe por escrito dentro de las 24 horas.
- id: 57
  category: driver_responsibility
  question: 'En Guam, los faros delanteros del vehículo deben encenderse desde:'
  choices:
    A: La puesta del sol hasta la salida del sol
    B: Una hora después de la puesta del sol hasta una hora antes de la salida del
      sol
    C: Media hora después de la puesta del sol hasta media hora antes de la salida
      del sol
    D: De 6:00 PM a 6:00 AM
  answer: C
  explanation: La ley de Guam especifica que los faros delanteros deben usarse desde
    media hora después de la puesta del sol hasta media hora antes de la salida del
    sol, o siempre que la visibilidad sea inferior a 500 pies.
- id: 58
  category: driver_responsibility
  question: ¿Qué significa la ley de 'Consentimiento Implícito' (Implied Consent)
    de Guam para los conductores?
  choices:
    A: Usted consiente que su vehículo sea registrado en cualquier momento
    B: Usted consiente a una prueba química de su sangre, aliento u orina si es sospechoso
      de conducir bajo los efectos del alcohol (DUI)
    C: Usted acepta llevar al menos tres pasajeros en todo momento
    D: Usted acepta pagar todas las multas de tráfico en un plazo de 10 días
  answer: B
  explanation: El Consentimiento Implícito significa que, al poseer una licencia de
    conducir de Guam y operar un vehículo, usted ya ha dado su consentimiento para
    ser sometido a pruebas de alcohol o drogas si un oficial de la ley tiene una causa
    razonable.
- id: 59
  category: driver_responsibility
  question: 'Al seguir a otro vehículo, el manual de Guam recomienda mantener una
    distancia de seguimiento de al menos:'
  choices:
    A: La longitud de un automóvil
    B: Dos segundos
    C: La longitud de tres automóviles
    D: Cinco segundos
  answer: B
  explanation: El Manual del Conductor de Guam recomienda la 'regla de los dos segundos'
    para mantener una distancia de seguimiento segura en condiciones normales de conducción.
- id: 60
  category: driver_responsibility
  question: 'El mes de renovación del registro de su vehículo en Guam se determina
    por:'
  choices:
    A: El mes de nacimiento del propietario
    B: La fecha en que se compró el vehículo
    C: El último dígito de la placa (matrícula) del vehículo
    D: La primera letra del apellido del propietario
  answer: C
  explanation: En Guam, los meses de renovación del registro de vehículos se escalonan
    en función del último dígito del número de la placa de circulación.
- id: 61
  category: driver_responsibility
  question: ¿Cuál es la sanción para el propietario de un vehículo en Guam que no
    mantiene el seguro de responsabilidad civil obligatorio?
  choices:
    A: Solo una advertencia verbal
    B: Servicio comunitario obligatorio
    C: Suspensión de la licencia de conducir y del registro del vehículo
    D: Una multa de $10
  answer: C
  explanation: El no mantener el seguro requerido en Guam puede llevar a la suspensión
    tanto de la licencia de conducir como del registro del vehículo hasta que se proporcione
    prueba de responsabilidad financiera.
- id: 62
  category: driver_responsibility
  question: En Guam, si usted se ve involucrado en un accidente de tráfico que resulte
    en daños a la propiedad de al menos qué cantidad, ¿debe presentar un informe por
    escrito al Departamento de Ingresos y Tributación (Department of Revenue and Taxation)?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Según el Manual del Conductor de Guam, cualquier accidente que resulte
    en daños a la propiedad de $250 o más requiere que se presente un informe por
    escrito al Departamento de Ingresos y Tributación dentro de los 10 días.
- id: 63
  category: driver_responsibility
  question: Bajo la Ley de Responsabilidad Financiera de Guam, ¿cuál es la cobertura
    mínima requerida de seguro de responsabilidad civil por lesiones corporales o
    muerte de una persona en cualquier accidente?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: La ley de Guam exige un mínimo de $20,000 por lesiones corporales o
    muerte de una persona en cualquier accidente.
- id: 64
  category: driver_responsibility
  question: ¿Cuál es la cobertura mínima de seguro de responsabilidad civil requerida
    por la ley de Guam para daños a la propiedad en cualquier accidente?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $20,000
  answer: B
  explanation: La ley de seguro obligatorio de Guam (16 GCA § 19103) requiere al menos
    $10,000 en cobertura para daños a la propiedad resultantes de cualquier accidente.
- id: 65
  category: driver_responsibility
  question: Cuando vende o transfiere un vehículo en Guam, ¿dentro de cuántos días
    debe notificar al Departamento de Ingresos y Tributación?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: El vendedor de un vehículo debe notificar al Departamento de Ingresos
    y Tributación sobre la venta o transferencia dentro de los 10 días para evitar
    una posible responsabilidad por el uso futuro del vehículo.
- id: 66
  category: driver_responsibility
  question: Si se ve involucrado en un accidente en el que alguien resulta herido
    o muerto, ¿a qué autoridad debe notificar de inmediato?
  choices:
    A: Al Departamento de Obras Públicas
    B: Al Departamento de Policía de Guam (GPD)
    C: A la Oficina del Gobernador
    D: Al Departamento de Gestión de Tierras
  answer: B
  explanation: La ley de Guam exige que cualquier accidente que involucre lesiones
    personales o muerte debe ser reportado de inmediato al Departamento de Policía
    de Guam (GPD).
- id: 67
  category: driver_responsibility
  question: 'Al dejar un vehículo de motor desatendido en una carretera de Guam, la
    ley exige que el conductor haga todo lo siguiente EXCEPTO:'
  choices:
    A: Apagar el motor
    B: Poner los frenos de manera efectiva
    C: Girar las ruedas hacia el bordillo (curb)
    D: Dejar las luces de emergencia parpadeando
  answer: D
  explanation: La ley de Guam (16 GCA § 3343) exige que los conductores apaguen el
    motor, bloqueen el encendido, retiren la llave y pongan los frenos. Las luces
    de emergencia no son un requisito para dejar un vehículo desatendido.
- id: 68
  category: driver_responsibility
  question: Si compra un vehículo en Guam, ¿dentro de cuántos días de la compra debe
    solicitar una transferencia de registro?
  choices:
    A: 5 días
    B: 10 días
    C: 20 días
    D: 30 días
  answer: B
  explanation: El comprador de un vehículo debe presentar el certificado de propiedad
    endosado y solicitar un nuevo registro dentro de los 10 días posteriores a la
    transferencia.
- id: 69
  category: driver_responsibility
  question: Según la ley de cinturones de seguridad de Guam, ¿quién es responsable
    de asegurar que los pasajeros menores de 16 años estén debidamente sujetos?
  choices:
    A: El pasajero mismo
    B: El conductor del vehículo
    C: El propietario del vehículo
    D: Solo los padres del pasajero
  answer: B
  explanation: El conductor es legalmente responsable de asegurar que todos los pasajeros,
    especialmente los menores de 16 años, usen el cinturón de seguridad o estén en
    sistemas de retención infantil apropiados.
- id: 70
  category: driver_responsibility
  question: Una persona que abandona a sabiendas la escena de un accidente en Guam
    que involucra solo daños a la propiedad es culpable de ¿qué?
  choices:
    A: Una falta leve (petty misdemeanor)
    B: Un delito menor (misdemeanor)
    C: Un delito grave de tercer grado (third-degree felony)
    D: Ningún delito, siempre que llamen más tarde
  answer: B
  explanation: Según la ley de Guam, abandonar la escena de un accidente que involucra
    daños a la propiedad sin seguir los procedimientos de informe adecuados se clasifica
    como un delito menor (misdemeanor).
- id: 71
  category: safe_driving_rules
  question: Según la ley de Guam, ¿en cuál de las siguientes áreas están estrictamente
    prohibidos los giros en U?
  choices:
    A: En cualquier carretera de dos carriles
    B: Dentro de un distrito comercial
    C: En una zona residencial
    D: Cerca de un parque público
  answer: B
  explanation: El Manual del Conductor de Guam establece que los giros en U están
    prohibidos en los distritos comerciales, excepto donde las señales lo permitan
    específicamente.
- id: 72
  category: safe_driving_rules
  question: 'En Guam, el carril central de una carretera de tres o cinco carriles,
    marcado con líneas amarillas continuas y discontinuas, está reservado para:'
  choices:
    A: Rebasar el tráfico más lento
    B: Solo vehículos de emergencia
    C: Solo giros a la izquierda
    D: Solo giros en U
  answer: C
  explanation: El carril central es un "carril de giro a la izquierda de dos sentidos"
    y debe utilizarse exclusivamente para vehículos que giran a la izquierda.
- id: 73
  category: safe_driving_rules
  question: ¿A cuántos pies de la entrada de una estación de bomberos en el mismo
    lado de la calle no se permite estacionar su vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: A
  explanation: La ley de Guam establece que no se puede estacionar a menos de 15 pies
    de la entrada de cualquier estación de bomberos. Si se estaciona en el lado opuesto
    de la calle, el límite es de 75 pies.
- id: 74
  category: safe_driving_rules
  question: Al estacionar su vehículo cuesta arriba en una calle de doble sentido
    con bordillo (acera), ¿cómo debe colocar las ruedas delanteras?
  choices:
    A: Hacia adelante (rectas)
    B: Hacia el bordillo
    C: En dirección contraria al bordillo
    D: Paralelas al bordillo
  answer: C
  explanation: Al estacionar cuesta arriba con bordillo, gire las ruedas en dirección
    contraria al bordillo para que el vehículo ruede hacia este si fallan los frenos.
- id: 75
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    las zonas residenciales de Guam?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: A
  explanation: Según el Manual del Conductor de Guam, el límite de velocidad en las
    zonas residenciales es de 15 mph, a menos que se indique lo contrario.
- id: 76
  category: safe_driving_rules
  question: Al conducir por las carreteras de Guam, ¿cuál es la distancia de seguimiento
    recomendada detrás de otro vehículo?
  choices:
    A: La longitud de un automóvil por cada 10 mph de velocidad
    B: Exactamente 50 pies en todo momento
    C: La longitud de dos automóviles independientemente de la velocidad
    D: 10 pies por cada 5 mph de velocidad
  answer: A
  explanation: Las reglas de conducción segura de Guam sugieren mantener una distancia
    de seguimiento de al menos la longitud de un automóvil por cada 10 millas por
    hora de velocidad.
- id: 77
  category: safe_driving_rules
  question: En Guam, ¿se prohíbe rebasar a otro vehículo cuando se encuentra a menos
    de cuántos pies de una intersección o un cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Está prohibido rebasar al acercarse a menos de 100 pies de cualquier
    intersección o cruce ferroviario a nivel, o al atravesarlos.
- id: 78
  category: safe_driving_rules
  question: ¿Cuándo debe usar los faros delanteros al conducir en Guam?
  choices:
    A: Solo cuando está lloviendo
    B: Desde una hora después de la puesta del sol hasta una hora antes del amanecer
    C: Desde media hora después de la puesta del sol hasta media hora antes del amanecer
    D: Solo cuando la visibilidad es inferior a 100 pies
  answer: C
  explanation: La ley de Guam exige que los faros estén encendidos desde media hora
    después de la puesta del sol hasta media hora antes del amanecer, o siempre que
    la visibilidad sea deficiente.
- id: 79
  category: safe_driving_rules
  question: Al usar señales manuales para indicar sus intenciones, ¿qué significa
    que el brazo izquierdo esté extendido por la ventana y apuntando hacia abajo?
  choices:
    A: Giro a la izquierda
    B: Giro a la derecha
    C: Detenerse o disminuir la velocidad
    D: Giro en U
  answer: C
  explanation: La señal manual para detenerse o disminuir la velocidad es el brazo
    izquierdo extendido hacia abajo.
- id: 80
  category: safe_driving_rules
  question: En Guam, ¿a cuántos pies de un paso de peatones en una intersección no
    se permite estacionar su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: La ley de Guam prohíbe estacionar a menos de 20 pies de un paso de
    peatones en una intersección.
- id: 81
  category: safe_driving_rules
  question: ¿En Guam, cuál es el límite de velocidad estándar en un distrito residencial
    o comercial si no hay otro límite de velocidad señalizado?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: Según el Manual del Conductor de Guam, el límite de velocidad en distritos
    residenciales y comerciales es de 25 millas por hora, a menos que se indique lo
    contrario.
- id: 82
  category: safe_driving_rules
  question: Al pasar por una escuela mientras los niños entran o salen de ella, ¿cuál
    es el límite de velocidad máximo en Guam?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad en una zona escolar en Guam es de 15 millas
    por hora cuando hay niños presentes o cuando las luces de la zona escolar están
    parpadeando.
- id: 83
  category: safe_driving_rules
  question: ¿A cuántos pies antes de un giro debe señalizar su intención de girar
    en Guam?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: La ley de Guam exige que los conductores señalicen su intención de
    girar al menos 100 pies antes de realizar el giro.
- id: 84
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima que debe mantener al estacionar cerca de
    un paso de peatones en una intersección en Guam?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: En Guam, está prohibido estacionar a menos de 20 pies de un paso de
    peatones en una intersección.
- id: 85
  category: safe_driving_rules
  question: Al estacionar cerca de una señal de alto (stop), una baliza intermitente
    o una señal de tráfico, ¿cuál es la distancia mínima requerida por la ley de Guam?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: No debe estacionar a menos de 30 pies de cualquier baliza intermitente
    oficial, señal de alto o señal de control de tráfico ubicada al costado de una
    carretera.
- id: 86
  category: safe_driving_rules
  question: Si las luces direccionales de su vehículo no funcionan, ¿cuál es la señal
    manual correcta para un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia afuera y doblado hacia arriba en el codo
    C: Brazo izquierdo extendido hacia afuera y doblado hacia abajo en el codo
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: La señal manual para un giro a la derecha es el brazo izquierdo extendido
    por la ventana y doblado hacia arriba en un ángulo de 90 grados.
- id: 87
  category: safe_driving_rules
  question: ¿En Guam, es ilegal seguir a un vehículo de emergencia (como una ambulancia
    o un camión de bomberos) a una distancia menor de cuántos pies?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Guam prohíbe seguir a cualquier aparato de bomberos o vehículo
    de emergencia que viaje en respuesta a una alarma a una distancia menor de 500
    pies.
- id: 88
  category: safe_driving_rules
  question: ¿Cuál es el propósito principal del carril central (pintado con líneas
    amarillas continuas y discontinuas) en las carreteras de varios carriles de Guam?
  choices:
    A: Rebasar vehículos lentos
    B: Viajar a alta velocidad
    C: Solo para giros a la izquierda
    D: Solo para estacionamiento de emergencia
  answer: C
  explanation: El carril central está reservado exclusivamente para vehículos que
    giran a la izquierda. Nunca debe usarse para rebasar ni como un carril de circulación
    normal.
- id: 89
  category: safe_driving_rules
  question: ¿Se permite el 'Giro a la derecha en rojo' en Guam?
  choices:
    A: No, está estrictamente prohibido
    B: Sí, pero solo entre las 9:00 PM y las 6:00 AM
    C: Sí, después de detenerse por completo y ceder el paso al tráfico/peatones,
      a menos que una señal lo prohíba
    D: Sí, pero solo si no hay otros autos en la intersección
  answer: C
  explanation: En Guam, puede girar a la derecha con luz roja después de detenerse
    por completo y ceder el paso a los peatones y a otros vehículos, siempre que no
    haya una señal que diga 'No Right Turn on Red' (No girar a la derecha en rojo).
- id: 90
  category: safe_driving_rules
  question: ¿Cuándo es legal rebasar a otro vehículo por la derecha en Guam?
  choices:
    A: Cuando el vehículo de adelante está haciendo o está a punto de hacer un giro
      a la izquierda y hay suficiente pavimento
    B: Siempre que el vehículo de adelante conduzca demasiado lento
    C: En una carretera de dos carriles usando el acotamiento (shoulder)
    D: Nunca es legal rebasar por la derecha
  answer: A
  explanation: Se permite rebasar por la derecha cuando el vehículo que se está adelantando
    está realizando un giro a la izquierda y hay un carril despejado o suficiente
    ancho de pavimento sin obstrucciones a la derecha.
- id: 91
  category: safe_driving_rules
  question: ¿Según la ley de retención infantil de Guam, los niños menores de qué
    edad deben estar asegurados en un sistema de retención infantil (asiento de seguridad)?
  choices:
    A: Menores de 2 años
    B: Menores de 4 años
    C: Menores de 8 años
    D: Menores de 12 años
  answer: B
  explanation: La ley de Guam exige que los niños menores de 4 años estén asegurados
    en un sistema de retención infantil. Los niños entre 4 y 11 años (que midan menos
    de 4 pies y 9 pulgadas de altura) deben usar un asiento elevador (booster seat).
- id: 92
  category: defensive_driving
  question: ¿Por qué las carreteras de Guam son particularmente resbaladizas cuando
    empieza a llover?
  choices:
    A: El calor hace que el asfalto se derrita
    B: Las carreteras están hechas de coral triturado, que se vuelve muy resbaladizo
      al mezclarse con aceite y agua
    C: Guam utiliza un revestimiento de cera especial en las carreteras para evitar
      daños por la sal
    D: La alta humedad impide que el agua se evapore
  answer: B
  explanation: Muchas de las carreteras de Guam están pavimentadas con una mezcla
    que contiene coral triturado. Este material se vuelve excepcionalmente resbaladizo
    cuando empieza a llover, ya que se mezcla con los depósitos de aceite y caucho
    en la superficie de la carretera.
- id: 93
  category: defensive_driving
  question: Para practicar una conducción defensiva adecuada en Guam, ¿con cuánta
    antelación debe observar la carretera en busca de posibles peligros?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: Solo el vehículo que está directamente delante de usted
  answer: B
  explanation: Se recomienda a los conductores mirar de 10 a 15 segundos hacia adelante
    para identificar los peligros a tiempo y evitar la necesidad de frenar o girar
    en el último momento.
- id: 94
  category: defensive_driving
  question: En Guam, ¿cuándo es obligatorio encender los faros delanteros?
  choices:
    A: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la
      salida del sol
    B: Desde una hora antes de la puesta del sol hasta una hora después de la salida
      del sol
    C: Solo cuando está lloviendo
    D: Entre las 8:00 PM y las 6:00 AM
  answer: B
  explanation: La ley de Guam exige que los faros delanteros estén encendidos desde
    una hora antes de la puesta del sol hasta una hora después de la salida del sol,
    o siempre que la visibilidad sea inferior a 500 pies.
- id: 95
  category: defensive_driving
  question: Si su vehículo comienza a hidroplanear en una carretera mojada de Guam,
    ¿cuál es la acción más segura a tomar?
  choices:
    A: Pisar los frenos a fondo inmediatamente
    B: Girar el volante bruscamente hacia el arcén
    C: Reducir la velocidad gradualmente soltando el pedal del acelerador
    D: Poner el coche en punto muerto (neutral)
  answer: C
  explanation: Si ocurre un hidroplaneo, no debe frenar ni girar bruscamente. En su
    lugar, suelte el acelerador para permitir que el vehículo reduzca la velocidad
    hasta que los neumáticos recuperen el contacto con la carretera.
- id: 96
  category: defensive_driving
  question: Al conducir de noche, debe atenuar las luces altas cuando un vehículo
    que viene en sentido contrario se encuentre a menos de cuántos pies?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Guam exige que los conductores atenúen sus luces altas cuando
    un vehículo que viene en sentido contrario esté a menos de 500 pies para evitar
    deslumbrar al otro conductor.
- id: 97
  category: defensive_driving
  question: Al seguir a otro vehículo de noche en Guam, ¿a cuántos pies de distancia
    del vehículo de adelante debe atenuar sus luces altas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Debe cambiar a luces bajas cuando siga a otro vehículo a una distancia
    de 300 pies o menos, para que sus luces no se reflejen en el espejo retrovisor
    del otro conductor.
- id: 98
  category: defensive_driving
  question: Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima por detrás, ¿qué debe hacer?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Acelerar para salir del camino
    C: Ceder el paso, moverse hacia el borde derecho de la carretera y detenerse
    D: Moverse hacia el arcén izquierdo y detenerse
  answer: C
  explanation: Los conductores deben hacerse a un lado hacia el borde derecho de la
    carretera y detenerse hasta que el vehículo de emergencia haya pasado.
- id: 99
  category: defensive_driving
  question: Al estacionar en una colina en Guam que tiene bordillo, mirando hacia
    abajo (cuesta abajo), ¿en qué dirección debe girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: A
  explanation: Al estacionar cuesta abajo, gire las ruedas hacia el bordillo para
    que, si el vehículo rueda, sea detenido por el bordillo.
- id: 100
  category: defensive_driving
  question: Bajo la Ley de Consentimiento Implícito de Guam, ¿cuál es la sanción por
    negarse por primera vez a someterse a una prueba de aliento o de sangre cuando
    se sospecha de DUI?
  choices:
    A: Una advertencia verbal
    B: Una multa de $50
    C: El oficial confiscará su licencia y esta podrá ser suspendida por 6 meses
    D: 48 horas obligatorias de cárcel
  answer: C
  explanation: Al conducir por las carreteras de Guam, usted da su consentimiento
    para realizarse pruebas químicas. La negativa resulta en la confiscación inmediata
    de su licencia y una posible suspensión de 6 meses por la primera infracción.
- id: 101
  category: defensive_driving
  question: ¿Qué es el "punto ciego" en la terminología de conducción defensiva?
  choices:
    A: Un área alrededor del vehículo que no se puede ver en los espejos
    B: El área directamente frente al parachoques
    C: Conducir durante un eclipse solar
    D: El área bloqueada por el espejo retrovisor
  answer: A
  explanation: Los puntos ciegos son áreas a la izquierda y derecha de la parte trasera
    de su vehículo que no son visibles en sus espejos; debe girar la cabeza para revisar
    estas áreas antes de cambiar de carril.
- id: 102
  category: defensive_driving
  question: Si se ve involucrado en un accidente de tráfico en Guam donde los daños
    a la propiedad superan los $250, ¿qué debe hacer?
  choices:
    A: Intercambiar información e irse
    B: Esperar 24 horas antes de reportarlo
    C: Reportar el accidente al Departamento de Policía de Guam inmediatamente
    D: Solo reportarlo si alguien resulta herido
  answer: C
  explanation: La ley de Guam exige que cualquier accidente que resulte en lesiones,
    muerte o daños a la propiedad superiores a $250 debe reportarse a la policía de
    inmediato.
- id: 103
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar a último momento, ¿con cuánta
    anticipación debe observar el camino mientras conduce en Guam?
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: Solo el auto que está inmediatamente delante de usted
  answer: B
  explanation: La conducción defensiva requiere mirar hacia adelante al menos de 10
    a 15 segundos para identificar peligros potenciales antes de llegar a ellos.
- id: 104
  category: defensive_driving
  question: 'Si nota que su vehículo está experimentando hidroplaneo (deslizándose
    sobre una capa delgada de agua) durante una fuerte tormenta en Guam, usted debe:'
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar el volante bruscamente hacia el arcén
    C: Mantener el pie en el acelerador y conducir recto
    D: Reducir la velocidad gradualmente levantando el pie del pedal del acelerador
  answer: D
  explanation: Si ocurre hidroplaneo, no debe frenar fuerte ni girar bruscamente.
    En su lugar, suelte el pedal del acelerador para permitir que el auto disminuya
    la velocidad hasta que los neumáticos recuperen el contacto con la carretera.
- id: 105
  category: defensive_driving
  question: Al entrar en una intersección, ¿cuál es la secuencia correcta de observación
    de conducción defensiva?
  choices:
    A: Mirar hacia adelante y avanzar
    B: Mirar a la izquierda, luego a la derecha y luego a la izquierda otra vez
    C: Mirar a la derecha, luego a la izquierda y luego a la derecha otra vez
    D: Revisar solo el espejo retrovisor
  answer: B
  explanation: Debido a que el primer vehículo que podría golpearlo viene de la izquierda,
    debe mirar a la izquierda, luego a la derecha y luego a la izquierda nuevamente
    antes de entrar en una intersección.
- id: 106
  category: defensive_driving
  question: Si un vehículo lo sigue demasiado de cerca (tailgating) en una carretera
    de dos carriles en Guam, ¿cuál es la acción más segura a tomar?
  choices:
    A: Tocar los frenos repetidamente para advertirles
    B: Aumentar la velocidad para incrementar la distancia
    C: Reducir la velocidad y hacerse a la derecha cuando sea seguro para dejarlos
      pasar
    D: Detenerse abruptamente para darles una lección
  answer: C
  explanation: Si alguien lo sigue muy de cerca, la maniobra defensiva más segura
    es reducir la velocidad gradualmente y moverse a la derecha para animar al conductor
    de atrás a que lo pase.
- id: 107
  category: defensive_driving
  question: Al conducir con niebla densa o humo espeso en Guam, ¿qué luces debe usar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia
  answer: B
  explanation: Se deben usar las luces bajas en condiciones de niebla o humo. Las
    luces altas se reflejan en la humedad o las partículas, lo que provoca deslumbramiento
    y dificulta la visión.
- id: 108
  category: defensive_driving
  question: ¿Qué es el "punto ciego" de un vehículo?
  choices:
    A: El área directamente frente al parachoques
    B: El área que se muestra en el espejo retrovisor
    C: El área a la izquierda o derecha del vehículo que no es visible en los espejos
    D: El área bloqueada por el parasol
  answer: C
  explanation: Los puntos ciegos son áreas alrededor del vehículo que el conductor
    no puede ver usando solo los espejos; los conductores deben girar la cabeza para
    revisar estas áreas.
- id: 109
  category: defensive_driving
  question: 'En Guam, si se ve involucrado en un derrape, debe:'
  choices:
    A: Girar el volante en la dirección opuesta al derrape
    B: Girar el volante en la dirección en la que derrapa la parte trasera del vehículo
    C: Bloquear los frenos de inmediato
    D: Poner el auto en punto muerto (Neutral)
  answer: B
  explanation: Para recuperarse de un derrape, debe girar el volante en la dirección
    en la que se desliza la parte trasera del vehículo para recuperar el control.
- id: 110
  category: defensive_driving
  question: ¿Cuándo debe aumentar su distancia de seguimiento a más de dos segundos
    en las carreteras de Guam?
  choices:
    A: Cuando las carreteras están mojadas o resbaladizas
    B: Al seguir a un camión grande o autobús
    C: Cuando la visibilidad es escasa
    D: Todas las anteriores
  answer: D
  explanation: La regla de los dos segundos es para condiciones ideales. Debe aumentar
    esta distancia durante la lluvia, al seguir vehículos grandes que bloquean su
    vista o cuando hay poca visibilidad.
- id: 111
  category: defensive_driving
  question: ¿Cuál es la mejor manera de manejar la 'hipnosis de carretera' o la fatiga
    durante viajes largos en Guam?
  choices:
    A: Subir el volumen de la radio a un nivel muy alto
    B: Beber varias tazas de café
    C: Mantener los ojos en movimiento y tomar descansos
    D: Mirar fijamente la línea central para mantenerse en el carril
  answer: C
  explanation: Para prevenir la fatiga y la hipnosis de carretera, mantenga los ojos
    en movimiento (escaneando) y deténgase para tomar descansos si se siente somnoliento.
- id: 112
  category: alcohol_drugs_health
  question: Según la ley de Guam, una persona condenada por una primera infracción
    de DUI (conducir bajo la influencia) enfrenta una pena mínima obligatoria de cárcel
    de ¿cuántas horas?
  choices:
    A: 12 horas
    B: 24 horas
    C: 48 horas
    D: 72 horas
  answer: C
  explanation: Una condena por primera infracción de DUI en Guam conlleva una sentencia
    mínima obligatoria de no menos de 48 horas de cárcel.
- id: 113
  category: alcohol_drugs_health
  question: Si un conductor en Guam se niega a someterse a una prueba química de alcohol,
    ¿cuál es la sanción administrativa inmediata con respecto a su licencia?
  choices:
    A: Solo una multa de $100
    B: La licencia será confiscada y suspendida por 6 meses
    C: La licencia será confiscada y suspendida por 2 años
    D: Ninguna sanción si es la primera vez que se niega
  answer: B
  explanation: Si se niega a una prueba química en Guam, el oficial confiscará su
    licencia y sus privilegios de conducir serán suspendidos por 6 meses (por una
    primera negativa).
- id: 114
  category: alcohol_drugs_health
  question: Con respecto a los recipientes abiertos de alcohol en un vehículo motorizado
    en Guam, ¿cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Es legal si el pasajero está bebiendo y el conductor no.
    B: Es legal siempre que el recipiente esté en la guantera.
    C: Es ilegal tener cualquier recipiente abierto de alcohol en el compartimento
      de pasajeros de un vehículo.
    D: Es legal solo durante los días festivos públicos autorizados.
  answer: C
  explanation: La ley de Guam prohíbe la posesión de un recipiente abierto de una
    bebida alcohólica en el compartimento de pasajeros de un vehículo motorizado ubicado
    en una vía pública.
- id: 115
  category: alcohol_drugs_health
  question: Si una persona es condenada por un segundo DUI en Guam dentro de los cinco
    años posteriores a una infracción anterior, ¿cuál es la sentencia mínima obligatoria
    de cárcel?
  choices:
    A: 48 horas
    B: 72 horas
    C: 7 días
    D: 30 días
  answer: C
  explanation: Para una segunda condena por DUI dentro de cinco años, la ley de Guam
    exige una sentencia mínima obligatoria de 7 días de cárcel.
- id: 116
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados y estos afectan su capacidad para
    conducir, ¿puede ser acusado de DUI en Guam?
  choices:
    A: No, porque el medicamento fue recetado legalmente por un médico.
    B: No, el DUI solo se aplica a drogas ilegales y alcohol.
    C: Sí, es ilegal conducir bajo la influencia de cualquier droga que afecte su
      capacidad para conducir de manera segura.
    D: Sí, pero solo si también tiene alcohol en su sistema.
  answer: C
  explanation: Las leyes de DUI de Guam se aplican a cualquier persona bajo la influencia
    del alcohol, cualquier droga o una combinación de ambos, que los vuelva incapaces
    de operar un vehículo de manera segura, independientemente de si la droga es legal
    o ilegal.
- id: 117
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto principal del alcohol en las capacidades físicas de
    un conductor?
  choices:
    A: Acelera el tiempo de reacción.
    B: Mejora la visión y el enfoque.
    C: Ralentiza el tiempo de reacción y la coordinación.
    D: No tiene efecto en las capacidades físicas si el conductor tiene experiencia.
  answer: C
  explanation: El alcohol es un depresor que ralentiza el sistema nervioso central,
    lo que resulta en tiempos de reacción más lentos, reducción de la coordinación
    y alteración del juicio.
- id: 118
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es lo primero que se ve afectado por el consumo
    de alcohol?
  choices:
    A: La visión
    B: La coordinación
    C: El juicio
    D: El habla
  answer: C
  explanation: El juicio es la primera facultad que se ve alterada por el alcohol,
    lo que a menudo lleva a los conductores a creer que son capaces de conducir de
    manera segura cuando no lo son.
- id: 119
  category: alcohol_drugs_health
  question: ¿Qué sucede cuando se combina el alcohol con otras drogas, como medicamentos
    para el resfriado o marihuana?
  choices:
    A: Los efectos de ambos se cancelan.
    B: Los efectos se multiplican, creando un nivel de deterioro mucho mayor.
    C: La droga hará que la persona recupere la sobriedad del alcohol.
    D: No hay ningún efecto adicional en el conductor.
  answer: B
  explanation: Combinar alcohol con otras drogas (efecto sinérgico) puede multiplicar
    los efectos de ambos, lo que lleva a un deterioro extremo incluso con pequeñas
    cantidades de cada uno.
- id: 120
  category: alcohol_drugs_health
  question: 'A una persona condenada por una primera infracción de DUI en Guam se
    le suspenderá la licencia de conducir por un período de:'
  choices:
    A: 30 a 60 días
    B: 90 días a 6 meses
    C: 6 meses a 1 año
    D: 2 años a 5 años
  answer: C
  explanation: Según la ley de Guam, una condena por primera infracción de DUI resulta
    en una suspensión de la licencia de no menos de 6 meses y no más de 1 año.
- id: 121
  category: alcohol_drugs_health
  question: 'En Guam, si un conductor se ve involucrado en un accidente por conducir
    bajo la influencia (DUI) que causa lesiones corporales a otra persona, la infracción
    se clasifica como:'
  choices:
    A: Infracción
    B: Delito menor
    C: Delito grave (Felony)
    D: Infracción civil
  answer: C
  explanation: Un DUI que resulte en lesiones corporales a cualquier persona que no
    sea el conductor es un delito grave (felony) en Guam, lo que conlleva sanciones
    mucho más severas que un DUI estándar.
- id: 122
  category: alcohol_drugs_health
  question: 'Si tiene una condición médica (como epilepsia o diabetes) que podría
    afectar su capacidad para conducir de manera segura, usted debe:'
  choices:
    A: No volver a conducir nunca más.
    B: Informar al DMV y proporcionar un informe médico de un médico.
    C: Solo conducir durante las horas del día.
    D: Mantenerlo en secreto para evitar perder su licencia.
  answer: B
  explanation: Los conductores en Guam están obligados a revelar las condiciones médicas
    que puedan afectar la conducción. El Departamento de Ingresos e Impuestos puede
    requerir una evaluación médica para determinar si la persona puede operar un vehículo
    de manera segura.
- id: 123
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    un conductor comercial (titular de CDL) que opera un vehículo comercial en Guam?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: De acuerdo con las regulaciones federales y la ley de Guam, el límite
    de BAC para los conductores comerciales que operan un vehículo motorizado comercial
    es de 0.04%.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál es la multa mínima obligatoria por una primera condena por conducir
    bajo la influencia (DUI) en Guam?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $5,000
  answer: C
  explanation: Según la ley de Guam (16 GCA § 18105), una persona condenada por una
    primera infracción de DUI será castigada con una multa no menor de $1,000 y no
    mayor de $5,000.
- id: 125
  category: alcohol_drugs_health
  question: ¿Una persona condenada por una primera infracción de DUI en Guam debe
    cumplir un mínimo de cuántas horas en la cárcel?
  choices:
    A: 12 horas
    B: 24 horas
    C: 48 horas
    D: 72 horas
  answer: C
  explanation: La ley de Guam exige que un infractor de DUI por primera vez cumpla
    un mínimo de 48 horas en la cárcel, y el tribunal no puede suspender esta sentencia
    mínima.
- id: 126
  category: alcohol_drugs_health
  question: 'Si un conductor se niega a someterse a una prueba química cuando lo solicita
    un oficial de la ley en Guam, su licencia será incautada y enfrentará una suspensión
    obligatoria de:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 2 años
  answer: C
  explanation: Si un conductor rechaza una prueba química bajo la ley de Consentimiento
    Implícito, el oficial incautará la licencia y los privilegios de conducción de
    la persona serán suspendidos por 6 meses por una primera negativa.
- id: 127
  category: alcohol_drugs_health
  question: En Guam, ¿en qué parte del vehículo es ilegal poseer un recipiente abierto
    de una bebida alcohólica?
  choices:
    A: El maletero
    B: El compartimento de pasajeros
    C: Una guantera cerrada con llave
    D: Detrás del último asiento vertical de un vehículo sin maletero
  answer: B
  explanation: La ley de Guam prohíbe la posesión de un recipiente abierto de alcohol
    en el compartimento de pasajeros de un vehículo motorizado mientras se encuentre
    en una vía pública.
- id: 128
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los medicamentos
    recetados y la conducción en Guam?
  choices:
    A: No puede ser arrestado por DUI si el medicamento fue recetado legalmente por
      un médico
    B: Los medicamentos recetados solo afectan la conducción si se toman con alcohol
    C: Puede ser acusado de DUI si un medicamento recetado afecta su capacidad para
      conducir de manera segura
    D: Solo los narcóticos ilegales se consideran en los casos de DUI
  answer: C
  explanation: En Guam, conducir bajo la influencia de cualquier droga —incluidos
    los medicamentos recetados o de venta libre— que lo incapacite para conducir de
    manera segura es una violación de la ley.
- id: 129
  category: alcohol_drugs_health
  question: ¿Qué es el 'efecto sinérgico' cuando se refiere al alcohol y las drogas?
  choices:
    A: Las drogas anulan los efectos del alcohol
    B: El alcohol hace que las drogas sean menos potentes
    C: La combinación de alcohol y drogas produce un efecto mucho más fuerte que cualquiera
      de los dos por separado
    D: El efecto de las sustancias es exactamente el mismo que tomarlas por separado
  answer: C
  explanation: El efecto sinérgico significa que cuando se mezclan el alcohol y otras
    drogas, interactúan para multiplicar el deterioro, lo que lo hace mucho más peligroso
    que usar cualquiera de las sustancias individualmente.
- id: 130
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol primero la capacidad de un conductor?
  choices:
    A: Mejora la coordinación
    B: Afecta el juicio y el razonamiento
    C: Agudiza la visión
    D: Acelera el tiempo de reacción
  answer: B
  explanation: El alcohol afecta primero las funciones superiores del cerebro, lo
    que significa que el juicio y la capacidad de razonamiento de un conductor se
    ven afectados antes de que su coordinación física o su tiempo de reacción fallen
    notablemente.
- id: 131
  category: alcohol_drugs_health
  question: ¿En Guam, cuál es el límite legal de contenido de alcohol en la sangre
    (BAC) para los operadores de vehículos motorizados comerciales?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: De acuerdo con los estándares federales adoptados por Guam, el límite
    de BAC para los conductores comerciales (titulares de CDL) que operan un vehículo
    comercial es de 0.04%.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su contenido de alcohol en
    la sangre (BAC) después de beber?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Darle tiempo a su cuerpo para procesar el alcohol
  answer: D
  explanation: Solo el tiempo permite que el cuerpo (específicamente el hígado) metabolice
    el alcohol. El café, las duchas y el ejercicio no aceleran la eliminación del
    alcohol del torrente sanguíneo.
- id: 133
  category: alcohol_drugs_health
  question: Si está tomando un nuevo medicamento de venta libre, ¿qué debe hacer antes
    de conducir?
  choices:
    A: Conducir solo por calles secundarias para probar su reacción
    B: Leer la etiqueta para ver las advertencias sobre somnolencia o el manejo de
      maquinaria
    C: Beber una bebida con cafeína para mantenerse alerta
    D: Asumir que es seguro porque no requiere receta médica
  answer: B
  explanation: Muchos medicamentos de venta libre (como los antihistamínicos o los
    medicamentos para el resfriado) pueden causar somnolencia. Los conductores son
    responsables de saber cómo les afecta su medicación leyendo las etiquetas de advertencia.
- id: 134
  category: alcohol_drugs_health
  question: En Guam, ¿cuál de los siguientes requisitos debe completar una persona
    condenada por conducir bajo los efectos del alcohol o drogas (DUI) antes de que
    se le puedan restaurar por completo sus privilegios de conducir?
  choices:
    A: Un diploma de escuela secundaria
    B: Un programa de rehabilitación de alcohol y drogas aprobado por el tribunal
    C: 100 horas de acompañamiento policial
    D: Un nuevo examen escrito cada mes durante un año
  answer: B
  explanation: La ley de Guam exige que los infractores por DUI completen un programa
    de educación o tratamiento de alcohol/drogas ordenado por el tribunal como parte
    de su sentencia y del proceso de reinstalación de la licencia.
- id: 135
  category: penalties_and_points
  question: Bajo la Ley de Consentimiento Implícito de Guam, si se niega a someterse
    a una prueba química de alcohol o sustancias controladas, ¿por cuánto tiempo se
    suspenderán automáticamente sus privilegios de conducir por una primera negativa?
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Según 16 GCA § 18102, se considera que cualquier persona que opere
    un vehículo motorizado en las carreteras de Guam ha dado su consentimiento para
    una prueba química. La negativa resulta en una suspensión obligatoria de la licencia
    por 6 meses por la primera infracción.
- id: 136
  category: penalties_and_points
  question: ¿Cuál es la multa obligatoria por no usar el cinturón de seguridad o por
    no asegurar adecuadamente a un niño pasajero en Guam?
  choices:
    A: 25 por persona
    B: 50 por persona
    C: 100 por persona
    D: 200 por persona
  answer: C
  explanation: La ley de Guam (16 GCA § 1102) exige una multa de $100 por cada ocupante
    que no esté debidamente sujeto por un cinturón de seguridad o un sistema de retención
    infantil.
- id: 137
  category: penalties_and_points
  question: Bajo la ley de 'Manos Libres' de Guam, ¿cuál es la multa por una primera
    infracción por usar un teléfono móvil mientras conduce sin un dispositivo de manos
    libres?
  choices:
    A: '50'
    B: '100'
    C: '250'
    D: '500'
  answer: B
  explanation: 16 GCA § 3346 prohíbe el uso de un teléfono móvil mientras se conduce,
    a menos que esté en modo de manos libres. La multa por la primera infracción es
    de $100.
- id: 138
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por rebasar un autobús escolar detenido mientras
    sus luces rojas parpadean y su brazo de parada está extendido en Guam?
  choices:
    A: '100'
    B: '250'
    C: '500'
    D: '1000'
  answer: C
  explanation: Rebasar un autobús escolar mientras está cargando o descargando pasajeros
    es una infracción grave en Guam, que conlleva una multa de hasta $500.
- id: 139
  category: penalties_and_points
  question: Bajo el sistema de puntos de Guam, ¿cuántos puntos se asignan a su historial
    de conducción por una condena de conducción temeraria (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción temeraria se considera una infracción mayor en Guam y
    resulta en la adición de 6 puntos al historial del conductor.
- id: 140
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a un historial de conducción de Guam por exceso
    de velocidad entre 1 y 15 millas por hora sobre el límite establecido?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: A
  explanation: Exceder el límite de velocidad de 1 a 15 mph en Guam resulta en 2 puntos
    en el historial del conductor.
- id: 141
  category: penalties_and_points
  question: Por una primera condena por DUI (conducir bajo la influencia) en Guam,
    ¿cuál es la multa mínima que se debe pagar?
  choices:
    A: '500'
    B: '750'
    C: '1000'
    D: '2000'
  answer: C
  explanation: De acuerdo con 16 GCA § 18105, la multa por una primera infracción
    de DUI no es inferior a $1,000 ni superior a $5,000.
- id: 142
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'seguir demasiado de cerca' (tailgating)
    en el historial de un conductor de Guam?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Seguir demasiado de cerca es una infracción que resulta en 2 puntos
    bajo el sistema de puntos del Departamento de Impuestos y Gravámenes de Guam.
- id: 143
  category: penalties_and_points
  question: 'No ceder el paso a un vehículo de emergencia (ambulancia, camión de bomberos,
    policía) que utiliza sirenas y luces en Guam puede resultar en una multa de hasta:'
  choices:
    A: '100'
    B: '250'
    C: '500'
    D: '1000'
  answer: C
  explanation: Los conductores deben hacerse a la derecha y detenerse ante los vehículos
    de emergencia. No hacerlo puede resultar en una multa de hasta $500.
- id: 144
  category: penalties_and_points
  question: 'En Guam, a una persona condenada por participar en una competencia de
    velocidad ilegal (carreras clandestinas o drag racing) en una vía pública se le
    revocará la licencia por al menos:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Participar en una competencia de velocidad es una infracción grave
    en Guam, y la ley exige un período de revocación de la licencia de 6 meses por
    la primera infracción.
- id: 145
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por una infracción de no detenerse ante una
    luz roja o una señal de alto (stop) en Guam?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: No detenerse ante una luz roja o una señal de alto es una infracción
    de 3 puntos en el sistema de puntos de tráfico de Guam.
- id: 146
  category: penalties_and_points
  question: 'En Guam, estacionarse en un espacio designado para personas con discapacidades
    sin el cartel (placard) o la placa correspondiente conlleva una multa mínima de:'
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: C
  explanation: Según la ley de Guam, la multa por estacionamiento no autorizado en
    un espacio reservado para personas con discapacidades es de un mínimo de $300
    y puede llegar hasta los $500.
- id: 147
  category: penalties_and_points
  question: Si se le condena por exceso de velocidad de 1 a 15 millas por hora sobre
    el límite de velocidad establecido en Guam, ¿cuántos puntos se añaden a su historial?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: A
  explanation: Exceder el límite de velocidad entre 1 y 15 mph en Guam generalmente
    resulta en 2 puntos en su historial de manejo.
- id: 148
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de la ley de Guam que prohíbe
    el uso de un teléfono móvil mientras se conduce (a menos que sea con manos libres)?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: La ley de conducción distraída de Guam prohíbe el uso de dispositivos
    electrónicos portátiles. Una primera infracción conlleva una multa de $100.
- id: 149
  category: penalties_and_points
  question: No detenerse ante un autobús escolar con sus luces rojas parpadeando y
    el brazo de parada extendido en Guam resulta en ¿cuántos puntos en su licencia?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar es una infracción de seguridad
    grave en Guam y conlleva una penalización de 4 puntos.
- id: 150
  category: penalties_and_points
  question: 'En Guam, abandonar la escena de un accidente (atropello y fuga o Hit
    and Run) que resulte en lesiones o muerte se clasifica como un:'
  choices:
    A: Delito menor leve (Petty misdemeanor)
    B: Infracción solamente
    C: Delito grave (Felony)
    D: Infracción civil
  answer: C
  explanation: Abandonar la escena de un accidente que involucre lesiones personales
    o la muerte es un delito grave en Guam, clasificado como una felonía (felony),
    lo que puede llevar a la cárcel y a la revocación permanente de la licencia.
- id: 151
  category: penalties_and_points
  question: 'Una primera condena por conducir bajo la influencia (DUI) en Guam puede
    resultar en un periodo de suspensión de la licencia de hasta:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Para una primera condena por DUI en Guam, el tribunal puede suspender
    la licencia de conducir por un periodo que oscila entre 6 meses y 1 año.
- id: 152
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su historial de conducción de Guam por 'seguir
    demasiado de cerca' (tailgating)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Seguir demasiado de cerca es una infracción de tránsito en Guam que
    resulta en la adición de 2 puntos a su historial de conducción.
- id: 153
  category: penalties_and_points
  question: En Guam, ¿con qué frecuencia debe un vehículo someterse a una inspección
    de seguridad obligatoria para mantener un registro válido?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Todos los vehículos registrados en Guam deben aprobar una inspección
    de seguridad en una estación autorizada una vez al año antes de que se pueda renovar
    el registro.
- id: 154
  category: penalties_and_points
  question: Si lo sorprenden conduciendo mientras su licencia está suspendida o revocada
    en Guam, ¿cuál es una consecuencia probable?
  choices:
    A: Una advertencia verbal
    B: Una extensión automática de 1 año de la suspensión
    C: Una multa de $10
    D: Ninguna sanción si es una emergencia
  answer: B
  explanation: Conducir con una licencia suspendida o revocada es una ofensa grave
    en Guam. Por lo general, resulta en una extensión del periodo de suspensión y
    posible tiempo en la cárcel.
- id: 155
  category: penalties_and_points
  question: La ley de 'Recipiente Abierto' (Open Container) de Guam prohíbe ¿cuál
    de los siguientes?
  choices:
    A: Solo que el conductor tenga un recipiente de alcohol abierto
    B: Solo que los pasajeros en el asiento delantero tengan un recipiente de alcohol
      abierto
    C: Que cualquier persona en un vehículo motorizado en una vía pública posea un
      recipiente abierto de alcohol
    D: Recipientes abiertos en el maletero del coche
  answer: C
  explanation: La ley de Guam prohíbe que cualquier persona (conductor o pasajero)
    posea un recipiente abierto de una bebida alcohólica mientras se encuentre en
    un vehículo motorizado en una vía pública.
- id: 156
  category: sharing_the_road
  question: En Guam, si se aproxima a una intersección donde un peatón está cruzando
    en un paso de peatones no marcado, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor, porque el paso de peatones no está marcado.
    B: El peatón tiene el derecho de paso.
    C: Quien haya llegado primero a la intersección.
    D: El peatón, pero solo si está usando un bastón blanco.
  answer: B
  explanation: Los peatones tienen el derecho de paso en todas las intersecciones,
    ya sea que el paso de peatones esté marcado o no.
- id: 157
  category: sharing_the_road
  question: ¿Cuál es el estatus legal de pedir aventón o 'hacer autostop' (solicitar
    un viaje) en las vías públicas de Guam?
  choices:
    A: Es legal si la persona se para en el arcén.
    B: Es legal solo durante las horas del día.
    C: Es ilegal que cualquier persona se pare en una calzada con el propósito de
      solicitar un viaje.
    D: Solo es legal para el personal militar uniformado.
  answer: C
  explanation: Según el Manual del Conductor de Guam, es ilegal que cualquier persona
    se pare en una calzada con el propósito de solicitar un viaje al ocupante de cualquier
    vehículo.
- id: 158
  category: sharing_the_road
  question: Al seguir a un camión o autobús grande, ¿por qué debería aumentar su distancia
    de seguimiento?
  choices:
    A: Para permitir que el conductor del camión lo vea en sus espejos laterales.
    B: Porque los camiones se detienen mucho más rápido que los autos.
    C: Para evitar que el camión ruede hacia atrás hacia usted.
    D: Para evitar los gases de escape del camión.
  answer: A
  explanation: Los camiones grandes tienen puntos ciegos significativos (No-Zones).
    Aumentar su distancia de seguimiento asegura que el conductor del camión pueda
    ver su vehículo en sus espejos laterales.
- id: 159
  category: sharing_the_road
  question: En Guam, ¿cuándo se le permite 'dividir el carril' (conducir una motocicleta
    entre filas de vehículos detenidos o en movimiento)?
  choices:
    A: Cuando el tráfico se mueve a menos de 20 mph.
    B: Solo durante la hora pico.
    C: Nunca es legal dividir el carril en Guam.
    D: Solo si es un mensajero en motocicleta con licencia.
  answer: C
  explanation: Dividir el carril es ilegal en Guam; las motocicletas deben ocupar
    un carril completo y seguir las mismas reglas de la carretera que otros vehículos
    motorizados.
- id: 160
  category: sharing_the_road
  question: Cuando un peatón utiliza un bastón blanco o un perro guía en una intersección,
    ¿qué debe hacer un conductor?
  choices:
    A: Tocar la bocina para avisarles que está allí.
    B: Reducir la velocidad y proceder con precaución.
    C: Detenerse por completo y tomar precauciones para evitar herir al peatón.
    D: Solo detenerse si hay una señal de 'Pare' (Stop).
  answer: C
  explanation: Los conductores deben tener especial cuidado y detenerse por completo
    ante peatones total o parcialmente ciegos que utilicen un bastón blanco o un perro
    guía.
- id: 161
  category: sharing_the_road
  question: ¿Si conduce por una carretera de tres o más carriles y un autobús escolar
    se detiene en la dirección opuesta con las luces rojas intermitentes, debe detenerse?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar.
    B: No, no es necesario detenerse si hay una barrera física o un carril central
      de giro que separe las direcciones.
    C: Sí, pero solo si hay niños cruzando.
    D: No, pero debe reducir la velocidad a 5 mph.
  answer: B
  explanation: En Guam, no es necesario detenerse ante un autobús escolar si usted
    se encuentra en el lado opuesto de una carretera dividida (separada por una barrera
    física o un carril central de giro).
- id: 162
  category: sharing_the_road
  question: Al rebasar una bicicleta en una carretera de Guam, ¿cuál es la distancia
    de seguridad recomendada que se debe mantener?
  choices:
    A: Al menos 1 pie.
    B: Al menos 3 pies.
    C: Al menos 5 pies.
    D: Al menos 10 pies.
  answer: B
  explanation: Al rebasar a un ciclista, los conductores deben dejar al menos 3 pies
    de espacio libre para garantizar la seguridad del ciclista.
- id: 163
  category: sharing_the_road
  question: ¿Dónde debe caminar un peatón si no hay aceras disponibles a lo largo
    de una carretera en Guam?
  choices:
    A: En el lado derecho de la carretera, a favor del flujo del tráfico.
    B: En medio de la carretera, donde sea más visible.
    C: En el lado izquierdo de la carretera, de frente al tráfico que viene en sentido
      contrario.
    D: No se permiten peatones en carreteras sin aceras.
  answer: C
  explanation: Si no hay aceras, los peatones deben caminar por el lado izquierdo
    de la carretera de frente al tráfico para que puedan ver los vehículos que se
    aproximan.
- id: 164
  category: sharing_the_road
  question: 'Cuando un camión grande está girando a la derecha en una intersección,
    usted debe tener en cuenta que:'
  choices:
    A: Girará más rápido que un automóvil.
    B: Puede necesitar abrirse hacia la izquierda para no subir al bordillo.
    C: Tiene el derecho de paso sobre todos los demás vehículos.
    D: Siempre se detendrá antes de girar.
  answer: B
  explanation: Los vehículos grandes, como camiones y autobuses, a menudo necesitan
    abrirse hacia la izquierda para realizar un giro a la derecha sin golpear el bordillo
    u otros objetos.
- id: 165
  category: sharing_the_road
  question: 'Al seguir a una motocicleta, debe mantener una distancia de seguimiento
    de al menos:'
  choices:
    A: 1 segundo.
    B: 2 segundos.
    C: 3 segundos.
    D: La misma que con un automóvil.
  answer: C
  explanation: Se recomienda una distancia de seguimiento de al menos 3 segundos al
    seguir motocicletas para permitir su capacidad de detenerse más rápidamente y
    por los peligros de la carretera que podrían afectarles.
- id: 166
  category: sharing_the_road
  question: Según la ley de Guam, ¿qué debe hacer al acercarse a un vehículo de emergencia
    autorizado que esté estacionado y con las luces intermitentes encendidas?
  choices:
    A: Mantener la velocidad pero cambiarse al carril izquierdo.
    B: Detenerse inmediatamente en su carril.
    C: Reducir la velocidad y, si es seguro hacerlo, cambiarse a un carril que no
      sea adyacente al vehículo.
    D: Acelerar para rebasar el vehículo rápidamente.
  answer: C
  explanation: Los requisitos de 'Hacerse a un lado' (Move Over) de Guam dictan que
    los conductores deben reducir la velocidad y cambiar de carril si es posible para
    proporcionar un margen de seguridad a los socorristas.
- id: 167
  category: sharing_the_road
  question: 'Los ciclistas en las calles públicas de Guam están obligados a:'
  choices:
    A: Circular por la acera en todo momento.
    B: Seguir las mismas reglas de la carretera que los vehículos de motor.
    C: Circular en contra del flujo del tráfico.
    D: Solo circular en carriles designados para bicicletas.
  answer: B
  explanation: Los ciclistas tienen los mismos derechos y responsabilidades que los
    conductores de vehículos de motor y deben obedecer todas las señales de tráfico,
    semáforos y leyes.
- id: 168
  category: sharing_the_road
  question: ¿Cómo es el emblema de vehículo de movimiento lento (que suele encontrarse
    en equipos agrícolas o vehículos de construcción)?
  choices:
    A: Un círculo azul.
    B: Una señal cuadrada verde.
    C: Una señal triangular naranja-roja.
    D: Un diamante amarillo.
  answer: C
  explanation: Los vehículos de movimiento lento (aquellos que viajan a 25 mph o menos)
    están obligados a mostrar un emblema triangular reflectante de color naranja-rojo
    en la parte trasera.
- id: 169
  category: sharing_the_road
  question: Los camiones grandes tienen 'No-Zones' (Zonas Prohibidas). ¿A qué se refiere
    este término?
  choices:
    A: Áreas donde los camiones no tienen permitido circular
    B: Los tanques de combustible del camión
    C: Puntos ciegos alrededor del camión donde el conductor no puede ver su vehículo
    D: El regulador de velocidad del motor de un camión
  answer: C
  explanation: Las 'No-Zones' son grandes puntos ciegos alrededor de la parte delantera,
    trasera y los lados de los camiones donde los automóviles pueden desaparecer de
    la vista del conductor del camión, aumentando el riesgo de una colisión.
- id: 170
  category: sharing_the_road
  question: 'Según la ley de Guam, toda persona que circule en bicicleta por una calzada
    tiene:'
  choices:
    A: Ningún derecho en absoluto
    B: El derecho a usar la acera únicamente
    C: Todos los derechos y todos los deberes aplicables al conductor de un vehículo
    D: El derecho de paso sobre todos los vehículos motorizados
  answer: C
  explanation: Los ciclistas en Guam están sujetos a las mismas leyes de tráfico que
    los operadores de vehículos de motor, lo que significa que deben obedecer las
    señales de alto, los semáforos y las reglas de dirección.
- id: 171
  category: sharing_the_road
  question: Al seguir a una motocicleta, debe dejar ________ distancia de seguimiento
    que la que dejaría para un automóvil de pasajeros.
  choices:
    A: Menos
    B: Más
    C: La misma
    D: Exactamente 10 pies
  answer: B
  explanation: Las motocicletas pueden detenerse mucho más rápido que los automóviles
    y son más susceptibles a los peligros de la carretera como la grava o el pavimento
    mojado. Los conductores deben permitir una mayor distancia de seguimiento (al
    menos 3-4 segundos) para garantizar la seguridad.
- id: 172
  category: sharing_the_road
  question: 'Un peatón que utiliza un bastón blanco o un perro guía debe ser:'
  choices:
    A: Se le debe ceder el paso en todo momento
    B: Se le debe indicar cuándo es seguro cruzar tocando la bocina
    C: Evitado conduciendo por el arcén (shoulder)
    D: Ignorado si no se encuentra en un paso de peatones marcado
  answer: A
  explanation: Los conductores deben extremar las precauciones y ceder el paso a los
    peatones ciegos o con discapacidad visual que utilicen un bastón blanco o un perro
    guía, independientemente de si se encuentran en un paso de peatones.
- id: 173
  category: sharing_the_road
  question: ¿Cuál es el requisito para los operadores y pasajeros de motocicletas
    con respecto a los cascos en Guam?
  choices:
    A: Los cascos solo son obligatorios para los menores de 18 años
    B: Los cascos son opcionales si se tiene seguro
    C: Tanto el operador como el pasajero deben llevar un casco de seguridad bien
      abrochado
    D: Los cascos solo son obligatorios en las autopistas
  answer: C
  explanation: La ley de Guam (16 GCA § 3301) exige que cualquier persona que opere
    o viaje en una motocicleta o bicicleta motorizada debe usar un casco de seguridad.
- id: 174
  category: sharing_the_road
  question: 'Cuando un peatón está cruzando la calzada dentro de cualquier paso de
    peatones marcado o no marcado en una intersección, el conductor de un vehículo
    debe:'
  choices:
    A: Tocar la bocina para advertirles que se den prisa
    B: Ceder el paso al peatón
    C: Mantener la velocidad y conducir alrededor de ellos
    D: Solo detenerse si el peatón es un niño
  answer: B
  explanation: La ley de tránsito de Guam exige que los conductores cedan el paso
    a los peatones que cruzan dentro de cualquier paso de peatones marcado o cualquier
    paso de peatones no marcado en una intersección.
- id: 175
  category: sharing_the_road
  question: En Guam, ¿cuál es el requisito legal para una bicicleta que se opera de
    noche?
  choices:
    A: No se necesita equipo especial
    B: Debe tener una luz blanca en la parte delantera y una luz roja o reflector
      en la parte trasera
    C: Solo debe tener un timbre
    D: No se permite operar bicicletas por la noche
  answer: B
  explanation: Por seguridad y visibilidad, la ley de Guam exige que las bicicletas
    que se operen durante la oscuridad estén equipadas con una lámpara en la parte
    delantera que emita una luz blanca y un reflector o lámpara roja en la parte trasera.
- id: 176
  category: sharing_the_road
  question: Si está siguiendo a un camión grande y no puede ver los espejos laterales
    del camión, ¿qué indica esto?
  choices:
    A: El conductor del camión puede verle mejor
    B: Usted se encuentra en el punto ciego del conductor del camión (No-Zone)
    C: El camión está a punto de girar
    D: Usted se encuentra a una distancia de seguimiento segura
  answer: B
  explanation: 'Una buena regla general para compartir la carretera con camiones es:
    ''Si no puede ver los espejos del conductor, el conductor no puede verle a usted''.'
- id: 177
  category: sharing_the_road
  question: 'Al caminar por una carretera donde no hay aceras, la ley de Guam exige
    que los peatones caminen:'
  choices:
    A: En el lado derecho con el flujo del tráfico
    B: En el lado izquierdo de frente al tráfico que viene en sentido contrario
    C: En medio de la carretera
    D: Solo durante las horas del día
  answer: B
  explanation: Se requiere que los peatones caminen por el lado izquierdo de la calzada
    de frente al tráfico cuando no haya aceras, para que puedan ver los vehículos
    que se aproximan.
- id: 178
  category: sharing_the_road
  question: ¿Cuál es el número máximo de personas permitidas para viajar en una motocicleta
    en Guam?
  choices:
    A: Tantas como quepan
    B: Solo el operador, a menos que la motocicleta esté diseñada para transportar
      a un pasajero
    C: Siempre dos personas
    D: Tres personas, si una es un niño
  answer: B
  explanation: Un operador de motocicleta no debe transportar a ninguna otra persona
    a menos que la motocicleta esté diseñada para transportar a más de una persona
    y esté equipada con reposapiés para el pasajero.
- id: 179
  category: vehicle_information
  question: Según el Manual del Conductor de Guam, ¿cuándo es obligatorio tener encendidos
    los faros delanteros?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde una hora después del atardecer hasta una hora antes del amanecer
    C: Desde 30 minutos después del atardecer hasta 30 minutos antes del amanecer
    D: Solo cuando está lloviendo o hay niebla
  answer: B
  explanation: La ley de Guam exige específicamente que los faros se utilicen desde
    una hora después del atardecer hasta una hora antes del amanecer, y en cualquier
    otro momento en que la visibilidad no sea suficiente para ver claramente a personas
    o vehículos a una distancia de 500 pies.
- id: 180
  category: vehicle_information
  question: Al seguir a otro vehículo por detrás por la noche en Guam, ¿a qué distancia
    debe bajar las luces altas (cambiar a luces de cruce)?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Las regulaciones de tránsito de Guam exigen que los conductores bajen
    sus luces altas cuando sigan a otro vehículo a menos de 300 pies.
- id: 181
  category: vehicle_information
  question: 'Todo vehículo de motor operado en las carreteras de Guam debe estar equipado
    con una bocina que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Guam exige una bocina en buen estado de funcionamiento capaz
    de emitir un sonido audible en condiciones normales desde una distancia no inferior
    a 200 pies.
- id: 182
  category: vehicle_information
  question: ¿La ley de Guam exige que los espejos retrovisores permitan al conductor
    ver la carretera a una distancia de al menos cuántos pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los vehículos deben estar equipados con un espejo ubicado de tal manera
    que refleje al conductor una vista de la carretera a una distancia de al menos
    200 pies hacia atrás.
- id: 183
  category: vehicle_information
  question: Según las leyes de equipamiento de vehículos de Guam, ¿cuál es el porcentaje
    mínimo de transmisión de luz permitido para las ventanas laterales delanteras?
  choices:
    A: 15%
    B: 20%
    C: 35%
    D: 50%
  answer: C
  explanation: La ley de Guam (16 GCA § 3209) exige que el polarizado de las ventanas
    laterales delanteras debe permitir el paso de al menos el 35% (más o menos el
    3%) de la luz.
- id: 184
  category: vehicle_information
  question: Para un vehículo de pasajeros estándar en Guam, ¿dónde deben exhibirse
    las placas de matrícula?
  choices:
    A: Solo en el parachoques trasero
    B: Solo en el parachoques delantero
    C: Una en la parte delantera y otra en la trasera
    D: Dentro del parabrisas trasero
  answer: C
  explanation: 'La ley de Guam exige que se coloquen dos placas de matrícula en el
    vehículo: una en la parte delantera y otra en la parte trasera.'
- id: 185
  category: vehicle_information
  question: Con respecto a los sistemas de escape, ¿cuál de los siguientes es ilegal
    en las vías públicas de Guam?
  choices:
    A: Un silenciador que reduzca el ruido
    B: Un recorte de silenciador (muffler cutout) o derivación (bypass)
    C: Un sistema de escape doble
    D: Una punta de escape cromada
  answer: B
  explanation: La ley de Guam prohíbe el uso de un recorte de silenciador, derivación
    o dispositivo similar que impida que el silenciador funcione para reducir el ruido.
- id: 186
  category: vehicle_information
  question: ¿Qué tipo de equipamiento de neumáticos está generalmente prohibido en
    las carreteras pavimentadas de Guam porque puede dañar la superficie?
  choices:
    A: Neumáticos radiales
    B: Neumáticos con menos de 2/32 de pulgada de banda de rodadura
    C: Pernos metálicos o protuberancias en la periferia del neumático
    D: Neumáticos para todo clima
  answer: C
  explanation: La ley de Guam prohíbe los neumáticos con cualquier bloque, perno,
    pestaña, taco o espiga de cualquier metal u otro material duro que sobresalga
    de la banda de rodadura de la superficie de tracción.
- id: 187
  category: vehicle_information
  question: ¿Con cuántos medios independientes para aplicar los frenos debe estar
    equipado cada vehículo de motor en Guam?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: La ley de Guam exige que los vehículos tengan dos medios independientes
    para aplicar los frenos (el freno de servicio y el freno de estacionamiento/emergencia),
    cada uno de los cuales debe ser eficaz y capaz de detener el vehículo.
- id: 188
  category: vehicle_information
  question: ¿Cuál es la regla con respecto a las calcomanías o letreros en el parabrisas
    de un vehículo en Guam?
  choices:
    A: Se permiten en cualquier lugar siempre que sean pequeños
    B: Solo se permiten si son para publicidad
    C: Están prohibidos si obstruyen la visión clara del conductor de la carretera
    D: Deben colocarse en el centro del parabrisas
  answer: C
  explanation: La ley de Guam prohíbe cualquier letrero, póster u otro material no
    transparente sobre el parabrisas delantero, las aletas laterales o las ventanas
    laterales o traseras que obstruya la visión clara del conductor de la carretera
    o de cualquier carretera que se cruce.
- id: 189
  category: vehicle_information
  question: Las luces de las señales de giro en un vehículo en Guam deben ser visibles
    desde una distancia de al menos ¿cuántos pies?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: El código de vehículos de Guam exige que las señales de giro sean visibles
    y comprensibles desde una distancia de 100 pies, tanto de día como de noche.
- id: 190
  category: vehicle_information
  question: 'En Guam, todo vehículo de motor debe tener al menos una luz trasera que
    emita una luz roja claramente visible desde una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Las luces traseras de los vehículos de Guam deben ser rojas y visibles
    desde una distancia de 500 pies hacia atrás.
- id: 191
  category: vehicle_information
  question: 'La luz utilizada para iluminar la placa (matrícula) trasera en Guam debe
    hacer que la placa sea legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Guam exige una luz blanca para iluminar la placa trasera
    de modo que sea claramente legible desde una distancia de 50 pies.
- id: 192
  category: vehicle_information
  question: De acuerdo con los estándares de equipamiento de vehículos de Guam, ¿dentro
    de cuántos pies debe ser capaz de detener el vehículo su freno de pie cuando viaja
    a 20 mph en una carretera seca y nivelada?
  choices:
    A: 15 pies
    B: 25 pies
    C: 35 pies
    D: 50 pies
  answer: B
  explanation: Las regulaciones de Guam especifican que el freno de servicio (freno
    de pie) debe poder detener el vehículo dentro de los 25 pies cuando el vehículo
    se mueve a una velocidad de 20 millas por hora.
- id: 193
  category: vehicle_information
  question: En Guam, ¿con cuántos espejos retrovisores como mínimo debe estar equipado
    cada vehículo de motor?
  choices:
    A: Un espejo que refleje una vista de al menos 200 pies hacia atrás
    B: Dos espejos, uno a cada lado
    C: Tres espejos, incluyendo uno interior y dos exteriores
    D: Los espejos solo son obligatorios si el vehículo es un camión
  answer: A
  explanation: La ley de Guam exige al menos un espejo ubicado de tal manera que refleje
    al conductor una vista de la carretera a una distancia de al menos 200 pies hacia
    la parte trasera de dicho vehículo.
- id: 194
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es VERDADERA con respecto a los requisitos
    de las placas (matrículas) para vehículos de pasajeros en Guam?
  choices:
    A: Solo se requiere una placa en la parte trasera
    B: Solo se requiere una placa en la parte delantera
    C: Se requieren dos placas, una en la parte delantera y otra en la trasera
    D: Las placas son opcionales si la calcomanía de registro está en el parabrisas
  answer: C
  explanation: 'La ley de Guam exige que los vehículos de motor (excepto las motocicletas)
    exhiban dos placas: una firmemente sujeta a la parte delantera y otra a la trasera.'
- id: 195
  category: vehicle_information
  question: En Guam, ¿las luces de las señales de giro deben ser visibles desde una
    distancia no menor a cuántos pies bajo la luz solar normal?
  choices:
    A: 50 pies
    B: 100 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las luces de las señales de giro en Guam deben ser visibles desde una
    distancia no menor a 100 pies, tanto hacia adelante como hacia atrás, bajo la
    luz solar normal.
- id: 196
  category: vehicle_information
  question: 'Todo vehículo de motor en Guam debe estar equipado con un silenciador
    (muffler) que evite:'
  choices:
    A: Todo el humo del escape
    B: Ruido excesivo o inusual
    C: Cualquier sonido del motor
    D: Emisiones de dióxido de carbono
  answer: B
  explanation: La ley de Guam exige que cada vehículo de motor tenga un silenciador
    en funcionamiento constante para evitar ruidos excesivos o inusuales y humo molesto.
- id: 197
  category: vehicle_information
  question: 'En Guam, las luces traseras deben ser de color rojo y visibles desde
    una distancia de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Las luces traseras de los vehículos en Guam deben ser rojas y claramente
    visibles desde una distancia de 500 pies hacia atrás.
- id: 198
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima requerida de la banda de rodadura de los
    neumáticos en un vehículo de pasajeros en Guam?
  choices:
    A: 1/32 de pulgada
    B: 2/32 (1/16) de pulgada
    C: 4/32 (1/8) de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Por seguridad y para aprobar la inspección anual en Guam, los neumáticos
    deben tener una profundidad mínima de la banda de rodadura de 2/32 de pulgada.
- id: 199
  category: vehicle_information
  question: Según la ley de Guam, ¿cuándo se requiere que encienda las luces delanteras
    de su vehículo?
  choices:
    A: Desde una hora después del atardecer hasta una hora antes del amanecer
    B: Solo cuando está lloviendo
    C: Desde el atardecer hasta el amanecer y siempre que la visibilidad sea inferior
      a 500 pies
    D: Solo durante las horas de medianoche a 5:00 AM
  answer: C
  explanation: Las luces delanteras deben usarse desde el atardecer hasta el amanecer
    y en cualquier otro momento en que la visibilidad no sea suficiente para ver claramente
    a una distancia de 500 pies.
- id: 200
  category: vehicle_information
  question: 'En Guam, es ilegal operar un vehículo de motor si el parabrisas:'
  choices:
    A: Está hecho de vidrio de seguridad
    B: Tiene alguna calcomanía
    C: Tiene una grieta o defecto que obstruye la vista clara del conductor
    D: Está teñido en el borde superior
  answer: C
  explanation: La ley de Guam prohíbe operar un vehículo con un parabrisas que esté
    agrietado, rayado o tenga defectos que obstruyan la vista del conductor de la
    carretera.
- id: 201
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos NO es obligatorio para un automóvil de
    pasajeros registrado en Guam?
  choices:
    A: Limpiaparabrisas
    B: Un velocímetro que funcione
    C: Un neumático de repuesto y un gato
    D: Un freno de estacionamiento
  answer: C
  explanation: Aunque se recomienda encarecidamente por seguridad, las leyes de equipo
    obligatorio para el registro e inspección de vehículos en Guam no exigen estrictamente
    un neumático de repuesto y un gato, mientras que los limpiaparabrisas, el velocímetro
    y el freno de estacionamiento son elementos de seguridad obligatorios.
- id: 202
  category: signs_and_signals
  question: Cuando vea una luz de tráfico roja intermitente en una intersección en
    Guam, ¿qué debe hacer?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse solo si se aproximan otros vehículos
    C: Detenerse por completo y proceder cuando sea seguro hacerlo
    D: Ceder el paso únicamente al tráfico que viene por la derecha
  answer: C
  explanation: En Guam, una luz roja intermitente se trata igual que una señal de
    alto (pare). Debe detenerse por completo y proceder solo cuando el camino esté
    despejado.
- id: 203
  category: signs_and_signals
  question: ¿Qué señal manual se utiliza para indicar que está reduciendo la velocidad
    o deteniéndose?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Agitar el brazo izquierdo de arriba hacia abajo
  answer: C
  explanation: Para señalar una parada o una disminución de velocidad mediante señales
    manuales, el conductor debe extender el brazo izquierdo hacia afuera y hacia abajo
    con la palma de la mano mirando hacia atrás.
- id: 204
  category: signs_and_signals
  question: 'En Guam, una señal ''en forma de banderín'' (un triángulo isósceles que
    apunta a la derecha) se utiliza específicamente para indicar:'
  choices:
    A: Una zona escolar
    B: Un requisito de ceder el paso
    C: Una zona de no rebasar
    D: Un cruce de ferrocarril
  answer: C
  explanation: La señal en forma de banderín se coloca en el lado izquierdo de la
    carretera para advertir a los conductores que están entrando en una zona de no
    rebasar.
- id: 205
  category: signs_and_signals
  question: ¿Cuál es el significado de una luz amarilla intermitente en una intersección?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Reducir la velocidad y proceder con precaución
    C: Acelerar para despejar la intersección rápidamente
    D: La señal está averiada; trátela como una parada de cuatro vías
  answer: B
  explanation: Una luz amarilla intermitente advierte a los conductores que deben
    reducir la velocidad, mantenerse alerta y cruzar la intersección con precaución.
- id: 206
  category: signs_and_signals
  question: Según la ley de Guam, ¿cuándo se permite girar a la derecha con luz roja?
  choices:
    A: Nunca, debe esperar a la luz verde
    B: Solo si hay una flecha verde apuntando a la derecha
    C: Después de detenerse por completo y ceder el paso al tráfico y a los peatones,
      a menos que una señal lo prohíba
    D: Solo entre las 10:00 PM y las 6:00 AM
  answer: C
  explanation: La ley de Guam permite girar a la derecha en rojo después de una parada
    completa, siempre que el camino esté despejado y no haya señales publicadas que
    prohíban el giro.
- id: 207
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas sólidas dobles pintadas en el pavimento?
  choices:
    A: Puede cruzar para cambiar de carril si es seguro
    B: Separan el tráfico que se mueve en direcciones opuestas
    C: Está prohibido cambiar de carril
    D: El borde de la calzada
  answer: C
  explanation: Las líneas blancas sólidas dobles se utilizan para separar carriles
    de tráfico que se mueven en la misma dirección donde el cambio de carril es peligroso
    y está prohibido.
- id: 208
  category: signs_and_signals
  question: 'Una señal en forma de rombo en las carreteras de Guam se utiliza generalmente
    para:'
  choices:
    A: Información reglamentaria como límites de velocidad
    B: Advertir a los conductores sobre condiciones peligrosas existentes o potenciales
    C: Información de guía para destinos
    D: Instrucciones de ceder el paso
  answer: B
  explanation: Las señales en forma de rombo son señales de advertencia estándar que
    se utilizan para alertar a los conductores sobre peligros, como curvas, intersecciones
    o tráfico que se incorpora.
- id: 209
  category: signs_and_signals
  question: ¿Qué significa una señal roja circular con una línea horizontal blanca
    en el medio?
  choices:
    A: No estacionarse
    B: No entrar
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Calle de un solo sentido más adelante
  answer: B
  explanation: La señal de 'No entrar' es un cuadrado con un círculo rojo y una barra
    horizontal blanca, lo que indica que el tráfico tiene prohibido entrar en la carretera
    en esa dirección.
- id: 210
  category: signs_and_signals
  question: En Guam, ¿de qué color son las señales utilizadas para proporcionar información
    sobre servicios como hospitales, gasolineras y cabinas telefónicas?
  choices:
    A: Verde
    B: Azul
    C: Marrón
    D: Amarillo
  answer: B
  explanation: Las señales azules se utilizan para los servicios al automovilista,
    proporcionando información sobre hospitales, comida, gasolina y alojamiento.
- id: 211
  category: signs_and_signals
  question: ¿Qué representa una línea blanca continua pintada a través de una intersección?
  choices:
    A: Un cruce peatonal
    B: Una línea de parada
    C: Un carril para bicicletas
    D: Un límite de estacionamiento
  answer: B
  explanation: Una línea blanca continua a través de un carril en una intersección
    es una línea de parada, que indica el punto antes del cual un vehículo debe detenerse
    ante una señal de alto o una luz roja.
- id: 212
  category: signs_and_signals
  question: Cuando un semáforo se pone en verde, pero la intersección está bloqueada
    por otros vehículos, ¿qué debe hacer?
  choices:
    A: Entrar en la intersección y esperar a que el tráfico se mueva
    B: Tocar la bocina hasta que los vehículos se muevan
    C: Permanecer fuera de la intersección hasta que pueda pasar completamente
    D: Girar a la derecha para evitar el tráfico
  answer: C
  explanation: Según las normas de tránsito de Guam, no debe entrar en una intersección
    si está bloqueada, incluso si la luz está en verde. Debe esperar hasta que haya
    suficiente espacio para despejar la intersección por completo.
- id: 213
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de una señal de color amarillo en la carretera?
  choices:
    A: Proporcionar instrucciones reglamentarias
    B: Indicar zonas de construcción
    C: Advertir sobre peligros generales o cambios en las condiciones de la carretera
    D: Mostrar la distancia al siguiente pueblo
  answer: C
  explanation: Las señales amarillas se utilizan como señales de advertencia general
    para alertar a los conductores sobre posibles peligros o cambios en la trayectoria
    del viaje más adelante.
- id: 214
  category: signs_and_signals
  question: Al usar señales manuales para indicar un giro, ¿cuál es la posición correcta
    para un giro a la izquierda?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana
    B: Brazo extendido hacia arriba
    C: Brazo extendido hacia abajo
    D: Brazo moviéndose en forma circular
  answer: A
  explanation: Según el Manual del Conductor de Guam, un giro a la izquierda se indica
    extendiendo el brazo izquierdo horizontalmente hacia afuera de la ventana.
- id: 215
  category: signs_and_signals
  question: Para señalar un giro a la derecha mediante señales manuales, ¿cómo debe
    colocarse el brazo del conductor?
  choices:
    A: Extendido recto hacia afuera de la ventana
    B: Extendido hacia arriba con el codo doblado en un ángulo de 90 grados
    C: Extendido hacia abajo con la palma hacia atrás
    D: Golpeando el techo del auto
  answer: B
  explanation: El Manual del Conductor de Guam establece que un giro a la derecha
    se indica extendiendo el brazo izquierdo hacia afuera y doblándolo hacia arriba
    a la altura del codo.
- id: 216
  category: signs_and_signals
  question: En Guam, ¿qué significa una luz roja intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: La luz está a punto de ponerse en verde
    C: Detenerse por completo y proceder solo cuando sea seguro hacerlo
    D: El semáforo está averiado; ignórelo
  answer: C
  explanation: Una luz roja intermitente en Guam tiene el mismo significado que una
    señal de alto. Debe detenerse por completo y avanzar cuando sea seguro.
- id: 217
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor al acercarse a una luz amarilla intermitente
    en Guam?
  choices:
    A: Detenerse y esperar a que se ponga verde
    B: Acelerar para despejar la intersección
    C: Reducir la velocidad y proceder con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente es una advertencia para reducir la velocidad
    y estar especialmente alerta mientras avanza por la intersección.
- id: 218
  category: signs_and_signals
  question: ¿Qué indican las líneas amarillas continuas dobles en el centro de la
    calzada?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: No se permite rebasar en ninguna dirección
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas continuas dobles significan que está prohibido
    rebasar para el tráfico que se mueve en ambas direcciones.
- id: 219
  category: signs_and_signals
  question: 'Una línea blanca discontinua en una calzada de varios carriles en Guam
    significa:'
  choices:
    A: El tráfico se mueve en direcciones opuestas
    B: El tráfico se mueve en la misma dirección y se permiten cambios de carril
    C: No debe cruzar la línea bajo ninguna circunstancia
    D: El carril está reservado solo para vehículos de emergencia
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección e indican que puede cruzarlas para cambiar de
    carril si es seguro.
- id: 220
  category: signs_and_signals
  question: ¿Cuál es el significado de una línea amarilla continua junto a una línea
    amarilla discontinua en el centro de la carretera?
  choices:
    A: Está prohibido rebasar para ambos lados
    B: Se permite rebasar para ambos lados
    C: Se permite rebasar solo para el lado contiguo a la línea discontinua
    D: Se permite rebasar solo para el lado contiguo a la línea continua
  answer: C
  explanation: Cuando hay una línea amarilla continua y una discontinua, solo el tráfico
    del lado de la línea discontinua puede rebasar cuando sea seguro hacerlo.
- id: 221
  category: signs_and_signals
  question: ¿En Guam, de qué color y forma es una señal estándar de 'Ceda el paso'
    (Yield)?
  choices:
    A: Amarilla y en forma de diamante
    B: Roja y blanca, un triángulo que apunta hacia abajo
    C: Blanca y rectangular
    D: Roja y octagonal
  answer: B
  explanation: Una señal de ceda el paso es un triángulo equilátero rojo y blanco
    con una punta hacia abajo.
- id: 222
  category: signs_and_signals
  question: 'Una señal en forma de banderín (triángulo lateral) colocada en el lado
    izquierdo de la carretera indica:'
  choices:
    A: Una zona escolar
    B: Una zona de construcción
    C: Una zona de no rebasar
    D: Un cruce de ferrocarril
  answer: C
  explanation: La señal en forma de banderín se utiliza para marcar el inicio de una
    zona de no rebasar y se coloca en el lado izquierdo de la carretera de frente
    al conductor.
- id: 223
  category: signs_and_signals
  question: ¿Qué forma tienen la mayoría de las señales de advertencia utilizadas
    en Guam para alertar a los conductores sobre peligros o cambios en las condiciones
    de la carretera?
  choices:
    A: Cuadrada
    B: Redonda
    C: De diamante
    D: Rectangular
  answer: C
  explanation: Las señales de advertencia suelen tener forma de diamante con símbolos
    o letras negras sobre un fondo amarillo.
- id: 224
  category: signs_and_signals
  question: ¿Qué indica un símbolo de diamante blanco pintado en un carril en Guam?
  choices:
    A: Un cruce de peatones
    B: Un carril para vehículos de alta ocupación (HOV) o carril restringido
    C: Una zona de estacionamiento
    D: Un reductor de velocidad (tope) más adelante
  answer: B
  explanation: El símbolo de diamante en el pavimento suele designar un carril reservado
    para vehículos específicos, como autobuses o vehículos compartidos (HOV).
- id: 225
  category: signs_and_signals
  question: 'Una señal de cinco lados (pentágono) indica que usted está cerca de:'
  choices:
    A: Un hospital
    B: Una escuela
    C: Una base militar
    D: Un parque público
  answer: B
  explanation: Una señal en forma de pentágono se utiliza exclusivamente para advertir
    a los conductores que se aproximan a una zona escolar o a un cruce escolar.
- id: 226
  category: signs_and_signals
  question: Cuando un semáforo está apagado (no funciona debido a un corte de energía),
    ¿cómo debe tratar la intersección en Guam?
  choices:
    A: Como una parada de dos vías
    B: Como una intersección no controlada donde el vehículo más grande tiene el derecho
      de paso
    C: Como una parada de cuatro vías
    D: Mantener la velocidad y proceder con precaución
  answer: C
  explanation: Si los semáforos no funcionan, la intersección debe tratarse como una
    parada de múltiples vías, donde los conductores deben detenerse y ceder el derecho
    de paso a los vehículos que llegaron primero.
