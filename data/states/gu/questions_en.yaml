metadata:
  source: Guam Driver Manual
  total_questions: 226
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What is the minimum age required to apply for a Learner's Permit in Guam?
  choices:
    A: 15 years old
    B: 15 years and 6 months
    C: 16 years old
    D: 14 years and 9 months
  answer: B
  explanation: According to the Guam Driver's Handbook, an applicant must be at least
    15 years and 6 months old to be eligible for a Learner's Permit.
- id: 2
  category: license_system
  question: Under Guam's Graduated Driver's License (GDL) law, how long must a permit
    holder maintain a 'clean' driving record before being eligible for an Intermediate
    License?
  choices:
    A: 3 consecutive months
    B: 6 consecutive months
    C: 12 consecutive months
    D: 2 years
  answer: B
  explanation: A permit holder must be at least 16 years old and have held their permit
    for at least 6 consecutive months without any traffic violations or crashes before
    moving to the Intermediate stage.
- id: 3
  category: license_system
  question: A person holding a Guam Learner's Permit must be accompanied by a fully
    licensed driver who is at least how old?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: B
  explanation: The accompanying driver for a permit holder must be at least 21 years
    of age and must have a valid license for the same type of vehicle being driven.
- id: 4
  category: license_system
  question: What are the nighttime driving restrictions for an Intermediate License
    holder on weeknights (Sunday through Thursday) in Guam?
  choices:
    A: No driving between 10:00 PM and 6:00 AM
    B: No driving between 11:00 PM and 5:00 AM
    C: No driving between 12:00 AM and 6:00 AM
    D: There are no restrictions for Intermediate holders
  answer: A
  explanation: Intermediate License holders are restricted from driving between 10:00
    PM and 6:00 AM on weeknights (Sunday night through Thursday night) unless accompanied
    by a parent or guardian.
- id: 5
  category: license_system
  question: On weekend nights (Friday and Saturday), what are the driving restriction
    hours for a Guam Intermediate License holder?
  choices:
    A: 10:00 PM to 6:00 AM
    B: 11:00 PM to 5:00 AM
    C: 12:00 AM to 6:00 AM
    D: 1:00 AM to 7:00 AM
  answer: C
  explanation: On Friday and Saturday nights, the curfew for Intermediate License
    holders is from 12:00 AM (midnight) to 6:00 AM.
- id: 6
  category: license_system
  question: What is the minimum age to obtain a Full License (Stage 3) in Guam?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: To obtain a Full License in Guam, the applicant must be at least 17
    years old and have completed the Intermediate License stage for at least 12 consecutive
    months without violations.
- id: 7
  category: license_system
  question: In Guam, what is the Blood Alcohol Content (BAC) limit for a driver under
    the age of 21?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: Guam has a zero-tolerance policy for minors; the BAC limit for drivers
    under 21 is 0.02%.
- id: 8
  category: license_system
  question: If you change your name or address, you must notify the Department of
    Revenue and Taxation (DMV) within how many days?
  choices:
    A: 5 days
    B: 10 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: Guam law requires drivers to notify the DMV of any change in name or
    address within 10 days of the change.
- id: 9
  category: license_system
  question: Under the Guam point system, a driver's license may be suspended if they
    accumulate how many points within a 12-month period?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: C
  explanation: A driver who accumulates 10 or more points within a 12-month period
    is subject to license suspension in Guam.
- id: 10
  category: license_system
  question: Which of the following is a mandatory requirement for all vehicle owners
    in Guam regarding insurance?
  choices:
    A: Only comprehensive insurance is required
    B: Only collision insurance is required
    C: Liability insurance is mandatory
    D: No insurance is required if you own the car outright
  answer: C
  explanation: Guam law requires all motor vehicles to be covered by a liability insurance
    policy to protect against property damage and personal injury.
- id: 11
  category: license_system
  question: To apply for a Guam Real ID-compliant driver's license, which document
    is NOT typically required?
  choices:
    A: Proof of Social Security Number
    B: Proof of Citizenship or Legal Presence
    C: Two proofs of Guam Residency
    D: A copy of your high school diploma
  answer: D
  explanation: Real ID requirements include proof of identity, SSN, and residency.
    A high school diploma is not a standard requirement for establishing identity
    or residency for a driver's license.
- id: 12
  category: license_system
  question: What is the penalty for an Intermediate License holder who is convicted
    of a traffic violation for the first time?
  choices:
    A: Permanent loss of license
    B: The 12-month 'clean record' period for the Full License resets
    C: A mandatory $500 fine only
    D: No penalty if it is the first offense
  answer: B
  explanation: Under Guam's GDL law, any violation or at-fault crash during the Intermediate
    stage causes the 12-month mandatory waiting period to restart.
- id: 13
  category: license_system
  question: In Guam, how many hours of classroom instruction are required as part
    of a certified Driver's Education course?
  choices:
    A: 20 hours
    B: 30 hours
    C: 40 hours
    D: 45 hours
  answer: C
  explanation: Guam law requires 40 hours of classroom instruction and 8 hours of
    behind-the-wheel training from a licensed driving school.
- id: 14
  category: license_system
  question: What is the maximum speed limit on Guam's highways unless otherwise posted?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The general maximum speed limit on Guam is 35 mph, though it may be
    lower in residential or school zones, or higher in specifically marked areas.
- id: 15
  category: license_system
  question: A person who has moved to Guam and possesses a valid U.S. state driver's
    license must apply for a Guam license within how many days of arrival?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents who hold a valid driver's license from a U.S. state or
    territory must obtain a Guam driver's license within 30 days of establishing residency.
- id: 16
  category: license_system
  question: To satisfy the vision requirement for a Guam driver's license, an applicant
    must have at least what visual acuity in both eyes?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to the Guam Driver's Handbook, applicants must have a visual
    acuity of at least 20/40 in both eyes, with or without corrective lenses.
- id: 17
  category: license_system
  question: A standard Guam driver's license is typically valid for how many years,
    depending on the fee paid and the applicant's choice?
  choices:
    A: 2 or 4 years
    B: 3 or 5 years
    C: 4 or 8 years
    D: 5 or 10 years
  answer: C
  explanation: Under current Guam law, residents have the option to renew their driver's
    license for a period of either 4 years or 8 years.
- id: 18
  category: license_system
  question: In addition to classroom instruction, how many hours of behind-the-wheel
    training must a student complete with a certified driver training school in Guam?
  choices:
    A: 4 hours
    B: 6 hours
    C: 10 hours
    D: 12 hours
  answer: B
  explanation: Guam's GDL law requires 30 hours of classroom instruction and 6 hours
    of actual behind-the-wheel training from a licensed driving school.
- id: 19
  category: license_system
  question: While holding an Intermediate License (Stage 2), how many non-family passengers
    are allowed to ride in the vehicle if no parent or guardian is present?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Intermediate License holders are restricted to carrying only immediate
    family members, or one non-family passenger, unless accompanied by a parent or
    guardian.
- id: 20
  category: license_system
  question: How many days prior to the expiration date are you allowed to renew your
    Guam driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Guam law allows drivers to renew their license up to 90 days before
    the expiration date.
- id: 21
  category: license_system
  question: What is the minimum age required to apply for a Guam Chauffeur's License
    (Type B, C, or D)?
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 25 years old
  answer: B
  explanation: To apply for a Chauffeur's License in Guam, an applicant must be at
    least 18 years of age.
- id: 22
  category: license_system
  question: Which of the following is considered a 'Primary' document when applying
    for a Guam driver's license or ID card?
  choices:
    A: A certified U.S. Birth Certificate
    B: A utility bill with your name and address
    C: A high school diploma
    D: A credit card statement
  answer: A
  explanation: A certified U.S. Birth Certificate or a valid U.S. Passport is considered
    a primary document for identification purposes at the Guam DMV.
- id: 23
  category: license_system
  question: If an Intermediate License holder must drive during restricted nighttime
    hours for employment, what must they carry in their possession?
  choices:
    A: A copy of their birth certificate
    B: A signed statement from their employer on company letterhead
    C: A police clearance
    D: A parent's written permission on a napkin
  answer: B
  explanation: Drivers with an Intermediate License may drive during restricted hours
    for work purposes if they carry a signed statement from their employer verifying
    the employment and hours.
- id: 24
  category: license_system
  question: Which license class is required in Guam to operate a motorcycle?
  choices:
    A: Class A
    B: Class B
    C: Class F
    D: Class M
  answer: C
  explanation: In Guam, the motorcycle endorsement or license is designated as Type
    F (or Class F).
- id: 25
  category: license_system
  question: Under Guam law, 'Immediate Family' for the purpose of GDL passenger restrictions
    includes which of the following?
  choices:
    A: Only parents
    B: Parents, siblings, and children of the driver
    C: Any relative living in the same village
    D: Friends who have known the driver for 5+ years
  answer: B
  explanation: Immediate family is defined as the spouse, children, parents, stepparents,
    brothers, sisters, and grandparents of the driver.
- id: 26
  category: license_system
  question: If you lose your Guam driver's license, what is the first step you should
    take according to the official manual?
  choices:
    A: Wait until it expires to get a new one
    B: Apply for a duplicate at the Department of Revenue and Taxation
    C: Drive using your birth certificate instead
    D: Call the Governor's office
  answer: B
  explanation: If a license is lost or destroyed, the licensee must apply for a duplicate
    at the Department of Revenue and Taxation, Motor Vehicle Division, and pay the
    required fee.
- id: 27
  category: license_system
  question: Which of the following is a requirement for a 'Full License' (Stage 3)
    applicant who is under 18?
  choices:
    A: They must have completed 100 hours of night driving
    B: They must have held an Intermediate License for at least 12 months without
      any traffic convictions
    C: They must be married
    D: They must own their own vehicle
  answer: B
  explanation: To progress to a Full License, the driver must have held the Intermediate
    License for at least 12 months and remained conviction-free for that entire period.
- id: 28
  category: license_system
  question: In Guam, what is the 'Implied Consent' law?
  choices:
    A: You consent to have your vehicle searched at any time
    B: You consent to follow all speed limits
    C: You consent to a chemical test of your blood, breath, or urine if arrested
      for DUI
    D: You consent to pay all fines immediately
  answer: C
  explanation: The Implied Consent law means that by driving on Guam's roads, you
    have already given consent to be tested for alcohol or drugs if a law enforcement
    officer has reasonable cause.
- id: 29
  category: license_system
  question: A person who is a 'Safe Driver' in Guam and has no traffic violations
    for a certain period may be eligible for what?
  choices:
    A: A free car registration
    B: A waiver of the written test upon renewal
    C: A discount on their driver's license fee
    D: Permission to ignore school zone speed limits
  answer: B
  explanation: Guam law allows the Director of Revenue and Taxation to waive the written
    examination for renewal if the applicant has a clear driving record for the previous
    period.
- id: 30
  category: driver_testing
  question: In Guam, what is the minimum distance you must park your vehicle from
    a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: According to the Guam Driver's Manual, it is illegal to park a vehicle
    within 15 feet of a fire hydrant.
- id: 31
  category: driver_testing
  question: When intending to turn, you must give a continuous signal for at least
    how many feet before turning?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: Guam law requires drivers to signal their intent to turn for at least
    100 feet before the turn is made.
- id: 32
  category: driver_testing
  question: In Guam, when are you allowed to make a U-turn in a business district?
  choices:
    A: Anywhere, as long as it is safe
    B: Only at intersections
    C: Only between intersections
    D: U-turns are never allowed in business districts
  answer: B
  explanation: Under Guam law, U-turns in business districts are prohibited except
    at intersections or where specifically permitted by signs.
- id: 33
  category: driver_testing
  question: According to the Guam Driver's Manual, what is the recommended following
    distance behind another vehicle?
  choices:
    A: One car length for every 10 mph of speed
    B: Two car lengths regardless of speed
    C: 50 feet at all times
    D: One car length for every 20 mph of speed
  answer: A
  explanation: The Guam Driver's Manual suggests maintaining a following distance
    of at least one car length for every 10 miles per hour of speed.
- id: 34
  category: driver_testing
  question: When a school bus is stopped on a two-lane highway with its red lights
    flashing and stop arm extended, who must stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching from the front
    C: Traffic from both directions
    D: No one, if there are at least two lanes
  answer: C
  explanation: On Guam's undivided highways, traffic moving in both directions must
    stop when a school bus is loading or unloading students with flashing red lights.
- id: 35
  category: driver_testing
  question: What is the minimum fine for a first-time violation of Guam's mandatory
    seat belt law?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: Guam law (16 GCA § 1102) mandates a fine of $100 for the first violation
    of the seat belt requirement.
- id: 36
  category: driver_testing
  question: When parking a vehicle facing downhill on a two-way street with a curb,
    how should the front wheels be turned?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: A
  explanation: When parking downhill, wheels should be turned toward the curb so that
    if the vehicle rolls, it will roll into the curb and stop.
- id: 37
  category: driver_testing
  question: In Guam, an accident report must be filed if there is property damage
    exceeding what amount?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Guam law requires an accident report to be filed with the Police Department
    if the accident results in injury, death, or property damage of $250 or more.
- id: 38
  category: driver_testing
  question: What is the fine range for littering from a motor vehicle in Guam?
  choices:
    A: Between $50 and $100
    B: Between $100 and $200
    C: Between $200 and $500
    D: Between $500 and $1,000
  answer: C
  explanation: According to Guam law and the driver's manual, littering is a violation
    punishable by a fine of not less than $200 and not more than $500.
- id: 39
  category: driver_testing
  question: Which hand signal is the correct way to indicate a right turn?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended out and bent upward at the elbow
    C: Left arm extended out and bent downward at the elbow
    D: Right arm extended straight out the window
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at the elbow.
- id: 40
  category: driver_testing
  question: When two vehicles enter an intersection from different highways at approximately
    the same time, which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling at a higher speed
    D: The driver on the larger road
  answer: B
  explanation: In Guam, when two vehicles reach an uncontrolled intersection at the
    same time, the driver of the vehicle on the left must yield the right-of-way to
    the vehicle on the right.
- id: 41
  category: driver_testing
  question: How many feet must you park away from a stop sign, flashing beacon, or
    traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Guam law prohibits parking within 30 feet of any official flashing
    beacon, stop sign, or traffic control signal located at the side of a highway.
- id: 42
  category: driver_testing
  question: 'A solid yellow line on your side of the center line means:'
  choices:
    A: You may pass if it is safe to do so
    B: You are in a construction zone
    C: Passing is prohibited
    D: The road ahead is one-way
  answer: C
  explanation: A solid yellow line on your side of the road indicates a 'no-passing
    zone' where it is unsafe and illegal to pass other vehicles.
- id: 43
  category: driver_testing
  question: What is the speed limit in a Guam school zone when children are present
    or lights are flashing?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The speed limit in school zones on Guam is 15 miles per hour when children
    are present or when school zone signals are active.
- id: 44
  category: driver_testing
  question: Under Guam's 'Implied Consent' law, by driving on Guam's roads, you are
    deemed to have given consent to what?
  choices:
    A: A search of your vehicle at any time
    B: A chemical test of your blood, breath, or urine for alcohol or drugs
    C: The installation of a speed monitoring device
    D: A mandatory driving re-test every two years
  answer: B
  explanation: The Implied Consent law means that any person who operates a motor
    vehicle on Guam is deemed to have given consent to a chemical test of their breath,
    blood, or urine to determine alcohol or drug content if arrested for DUI.
- id: 45
  category: driver_testing
  question: In Guam, it is illegal to park a vehicle within how many feet of a fire
    hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: According to Guam's parking regulations, you may not park a vehicle
    within 15 feet of a fire hydrant.
- id: 46
  category: driver_testing
  question: In Guam, making a U-turn is specifically prohibited in which of the following
    areas?
  choices:
    A: In a residential district
    B: In a business district, except at an intersection
    C: On any two-lane road
    D: Within 500 feet of a traffic light
  answer: B
  explanation: Guam law prohibits making a U-turn in a business district except at
    an intersection where such a turn is permitted.
- id: 47
  category: driver_testing
  question: When an emergency vehicle (ambulance, fire truck, or police car) is approaching
    with sirens and flashing lights, what must you do?
  choices:
    A: Speed up to get out of the way
    B: Stop exactly where you are
    C: Yield the right-of-way and move to the right edge of the road and stop
    D: Follow the vehicle to see where it is going
  answer: C
  explanation: Upon the approach of an emergency vehicle using audible or visual signals,
    drivers must yield the right-of-way, move to the right-hand edge of the highway,
    and stop until the vehicle has passed.
- id: 48
  category: driver_testing
  question: What is the recommended following distance behind the vehicle in front
    of you under normal driving conditions in Guam?
  choices:
    A: One car length
    B: Two seconds
    C: Five seconds
    D: 50 feet
  answer: B
  explanation: The Guam Driver's Manual recommends maintaining a 'two-second' following
    distance to ensure enough time to react to the vehicle ahead.
- id: 49
  category: driver_testing
  question: In Guam, who is required to wear a seat belt in a moving motor vehicle?
  choices:
    A: Only the driver
    B: Only the driver and front-seat passenger
    C: The driver and all passengers
    D: Only passengers under the age of 18
  answer: C
  explanation: Guam law requires the driver and all passengers in a motor vehicle
    to be properly restrained by a seat belt or child restraint system.
- id: 50
  category: driver_responsibility
  question: In Guam, you must report an accident to the Guam Police Department immediately
    if the property damage exceeds what amount?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: According to the Guam Driver's Handbook, any accident involving property
    damage of $250 or more must be reported to the Guam Police Department immediately.
- id: 51
  category: driver_responsibility
  question: Under Guam's Vehicle Financial Responsibility Act, what are the minimum
    liability insurance requirements?
  choices:
    A: $10,000/$20,000/$5,000
    B: $15,000/$30,000/$10,000
    C: $20,000/$40,000/$10,000
    D: $25,000/$50,000/$20,000
  answer: C
  explanation: Guam law requires minimum liability coverage of $20,000 for bodily
    injury to one person, $40,000 for bodily injury to two or more persons, and $10,000
    for property damage (20/40/10).
- id: 52
  category: driver_responsibility
  question: How often must a vehicle registered in Guam undergo a mandatory safety
    inspection?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: All vehicles in Guam are required to pass a safety inspection annually
    at an authorized inspection station before the registration can be renewed.
- id: 53
  category: driver_responsibility
  question: For drivers 21 years of age or older, it is illegal to operate a motor
    vehicle in Guam with a Blood Alcohol Content (BAC) of ____ or higher.
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In Guam, the legal limit for Blood Alcohol Content (BAC) for adult
    drivers (21 and over) is 0.08%.
- id: 54
  category: driver_responsibility
  question: What is the fine for an unauthorized person parking in a space designated
    for persons with disabilities in Guam?
  choices:
    A: Between $50 and $100
    B: Between $100 and $200
    C: Between $300 and $500
    D: Exactly $1,000
  answer: C
  explanation: Under Guam law (16 GCA § 3401.1), the fine for illegally parking in
    a disabled spot is no less than $300 and no more than $500.
- id: 55
  category: driver_responsibility
  question: 'According to Guam law, children between the ages of 4 and 11 who are
    less than 4 feet 9 inches tall must be secured in:'
  choices:
    A: A rear-facing infant seat only
    B: A booster seat
    C: The front seat with a standard seatbelt
    D: Any seat with a lap belt only
  answer: B
  explanation: Guam's Child Restraint Law requires children ages 4 to 11 (under 4'9"
    tall) to use a booster seat to ensure the vehicle's lap and shoulder belts fit
    correctly.
- id: 56
  category: driver_responsibility
  question: If you are involved in an accident where a police officer does not attend
    the scene, how long do you have to file a written report with the Department of
    Revenue and Taxation?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 10 days
  answer: A
  explanation: If a police officer is not present to investigate an accident involving
    injury or property damage over $250, the driver must file a written report within
    24 hours.
- id: 57
  category: driver_responsibility
  question: 'In Guam, vehicle headlights must be turned on from:'
  choices:
    A: Sunset to sunrise
    B: One hour after sunset to one hour before sunrise
    C: One-half hour after sunset to one-half hour before sunrise
    '0': 6:00 PM to 6:00 AM
  answer: C
  explanation: Guam law specifies that headlights must be used from one-half hour
    after sunset to one-half hour before sunrise, or whenever visibility is less than
    500 feet.
- id: 58
  category: driver_responsibility
  question: What does Guam's 'Implied Consent' law mean for drivers?
  choices:
    A: You consent to have your vehicle searched at any time
    B: You consent to a chemical test of your blood, breath, or urine if suspected
      of DUI
    C: You agree to carry at least three passengers at all times
    D: You agree to pay all traffic fines within 10 days
  answer: B
  explanation: Implied Consent means that by holding a Guam driver's license and operating
    a vehicle, you have already given consent to be tested for alcohol or drugs if
    a law enforcement officer has reasonable cause.
- id: 59
  category: driver_responsibility
  question: 'When following another vehicle, Guam''s manual recommends maintaining
    a following distance of at least:'
  choices:
    A: One car length
    B: Two seconds
    C: Three car lengths
    D: Five seconds
  answer: B
  explanation: The Guam Driver's Handbook recommends the 'two-second rule' to maintain
    a safe following distance under normal driving conditions.
- id: 60
  category: driver_responsibility
  question: 'The month of your vehicle''s registration renewal in Guam is determined
    by:'
  choices:
    A: The owner's birth month
    B: The date the vehicle was purchased
    C: The last digit of the vehicle's license plate
    D: The first letter of the owner's last name
  answer: C
  explanation: In Guam, vehicle registration renewal months are staggered based on
    the final digit of the license plate number.
- id: 61
  category: driver_responsibility
  question: What is the penalty for a vehicle owner in Guam who fails to maintain
    the required liability insurance?
  choices:
    A: A verbal warning only
    B: Mandatory community service
    C: Suspension of the driver's license and vehicle registration
    D: A $10 fine
  answer: C
  explanation: Failure to maintain required insurance in Guam can lead to the suspension
    of both the driver's license and the vehicle's registration until proof of financial
    responsibility is provided.
- id: 62
  category: driver_responsibility
  question: In Guam, if you are involved in a traffic accident resulting in property
    damage of at least what amount, must you file a written report with the Department
    of Revenue and Taxation?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: According to the Guam Driver's Handbook, any accident resulting in
    property damage of $250 or more requires a written report to be filed with the
    Department of Revenue and Taxation within 10 days.
- id: 63
  category: driver_responsibility
  question: Under Guam's Financial Responsibility Law, what is the minimum required
    liability insurance coverage for bodily injury to or death of one person in any
    one accident?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: Guam law requires a minimum of $20,000 for bodily injury to or death
    of one person in any one accident.
- id: 64
  category: driver_responsibility
  question: What is the minimum liability insurance coverage required by Guam law
    for property damage in any one accident?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $20,000
  answer: B
  explanation: Guam's mandatory insurance law (16 GCA § 19103) requires at least $10,000
    in coverage for property damage resulting from any one accident.
- id: 65
  category: driver_responsibility
  question: When you sell or transfer a vehicle in Guam, within how many days must
    you notify the Department of Revenue and Taxation?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: The seller of a vehicle must notify the Department of Revenue and Taxation
    of the sale or transfer within 10 days to avoid potential liability for the vehicle's
    future use.
- id: 66
  category: driver_responsibility
  question: If you are involved in an accident in which someone is injured or killed,
    you must immediately notify which authority?
  choices:
    A: The Department of Public Works
    B: The Guam Police Department
    C: The Governor's Office
    D: The Department of Land Management
  answer: B
  explanation: Guam law requires that any accident involving personal injury or death
    must be reported immediately to the Guam Police Department (GPD).
- id: 67
  category: driver_responsibility
  question: 'When leaving a motor vehicle unattended on a Guam highway, the law requires
    the driver to do all of the following EXCEPT:'
  choices:
    A: Stop the engine
    B: Effectively set the brakes
    C: Turn the wheels toward the curb
    D: Leave the hazard lights flashing
  answer: D
  explanation: Guam law (16 GCA § 3343) requires drivers to stop the engine, lock
    the ignition, remove the key, and set the brakes. Hazard lights are not a requirement
    for leaving a vehicle unattended.
- id: 68
  category: driver_responsibility
  question: If you purchase a vehicle in Guam, you must apply for a transfer of registration
    within how many days of the purchase?
  choices:
    A: 5 days
    B: 10 days
    C: 20 days
    D: 30 days
  answer: B
  explanation: The buyer of a vehicle must present the endorsed certificate of ownership
    and apply for a new registration within 10 days of the transfer.
- id: 69
  category: driver_responsibility
  question: According to Guam's seatbelt law, who is responsible for ensuring that
    passengers under the age of 16 are properly restrained?
  choices:
    A: The passenger themselves
    B: The driver of the vehicle
    C: The owner of the vehicle
    D: The parents of the passenger only
  answer: B
  explanation: The driver is legally responsible for ensuring all passengers, especially
    those under 16, are wearing seatbelts or are in appropriate child restraint systems.
- id: 70
  category: driver_responsibility
  question: A person who knowingly leaves the scene of an accident in Guam involving
    property damage only is guilty of what?
  choices:
    A: A petty misdemeanor
    B: A misdemeanor
    C: A third-degree felony
    D: No crime, as long as they call later
  answer: B
  explanation: Under Guam law, leaving the scene of an accident involving property
    damage without following proper reporting procedures is classified as a misdemeanor.
- id: 71
  category: safe_driving_rules
  question: Under Guam law, U-turns are strictly prohibited in which of the following
    areas?
  choices:
    A: On any two-lane highway
    B: Within a business district
    C: In a residential area
    D: Near a public park
  answer: B
  explanation: The Guam Driver's Handbook states that U-turns are prohibited in business
    districts except where specifically permitted by signs.
- id: 72
  category: safe_driving_rules
  question: 'On Guam, the center lane of a three-lane or five-lane highway, marked
    by solid and broken yellow lines, is reserved for:'
  choices:
    A: Passing slower traffic
    B: Emergency vehicles only
    C: Left turns only
    D: U-turns only
  answer: C
  explanation: The center lane is a 'two-way left turn lane' and must be used exclusively
    for vehicles turning left.
- id: 73
  category: safe_driving_rules
  question: You may not park your vehicle within how many feet of the entrance to
    a fire station on the same side of the street?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: A
  explanation: Guam law states you cannot park within 15 feet of the driveway entrance
    to any fire station. If parking on the opposite side of the street, the limit
    is 75 feet.
- id: 74
  category: safe_driving_rules
  question: When parking your vehicle headed uphill on a two-way street with a curb,
    how should you set your front wheels?
  choices:
    A: Straight ahead
    B: Toward the curb
    C: Away from the curb
    D: Parallel to the curb
  answer: C
  explanation: When parking uphill with a curb, turn the wheels away from the curb
    so the vehicle will roll into the curb if the brakes fail.
- id: 75
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in residential areas
    on Guam?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: A
  explanation: According to the Guam Driver's Handbook, the speed limit in residential
    areas is 15 mph unless otherwise posted.
- id: 76
  category: safe_driving_rules
  question: When driving on Guam's roads, what is the recommended following distance
    behind another vehicle?
  choices:
    A: One car length for every 10 mph of speed
    B: Exactly 50 feet at all times
    C: Two car lengths regardless of speed
    D: 10 feet for every 5 mph of speed
  answer: A
  explanation: Guam's safe driving rules suggest maintaining a following distance
    of at least one car length for every 10 miles per hour of speed.
- id: 77
  category: safe_driving_rules
  question: In Guam, you are prohibited from passing another vehicle when you are
    within how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Passing is prohibited when approaching within 100 feet of or traversing
    any intersection or railroad grade crossing.
- id: 78
  category: safe_driving_rules
  question: When must you use your headlights while driving on Guam?
  choices:
    A: Only when it is raining
    B: From one hour after sunset to one hour before sunrise
    C: From one-half hour after sunset to one-half hour before sunrise
    D: Only when visibility is less than 100 feet
  answer: C
  explanation: Guam law requires headlights to be on from one-half hour after sunset
    to one-half hour before sunrise, or whenever visibility is poor.
- id: 79
  category: safe_driving_rules
  question: When using hand signals to indicate your intentions, what does it mean
    when your left arm is extended out the window and pointing downward?
  choices:
    A: Left turn
    B: Right turn
    C: Stop or decrease speed
    D: U-turn
  answer: C
  explanation: The hand signal for stopping or decreasing speed is the left arm extended
    downward.
- id: 80
  category: safe_driving_rules
  question: In Guam, you may not park your vehicle within how many feet of a crosswalk
    at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: Guam law prohibits parking within 20 feet of a crosswalk at an intersection.
- id: 81
  category: safe_driving_rules
  question: In Guam, what is the standard speed limit in a residential or business
    district if no other speed limit is posted?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: According to the Guam Driver's Handbook, the speed limit in residential
    and business districts is 25 miles per hour unless otherwise posted.
- id: 82
  category: safe_driving_rules
  question: When passing a school while children are going to or leaving school, what
    is the maximum speed limit in Guam?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The speed limit in a school zone on Guam is 15 miles per hour when
    children are present or when the school zone lights are flashing.
- id: 83
  category: safe_driving_rules
  question: How many feet before a turn must you signal your intention to turn in
    Guam?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: Guam law requires drivers to signal their intention to turn at least
    100 feet before the turn is made.
- id: 84
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when parking near a crosswalk
    at an intersection in Guam?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: On Guam, you are prohibited from parking within 20 feet of a crosswalk
    at an intersection.
- id: 85
  category: safe_driving_rules
  question: When parking near a stop sign, flashing beacon, or traffic signal, what
    is the minimum distance required by Guam law?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: You must not park within 30 feet of any official flashing beacon, stop
    sign, or traffic control signal located at the side of a highway.
- id: 86
  category: safe_driving_rules
  question: If your vehicle's turn signals are not working, what is the correct hand
    signal for a right turn?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended out and bent upward at the elbow
    C: Left arm extended out and bent downward at the elbow
    D: Right arm extended straight out the window
  answer: B
  explanation: The hand signal for a right turn is the left arm extended out the window
    and bent upward at a 90-degree angle.
- id: 87
  category: safe_driving_rules
  question: In Guam, it is illegal to follow an emergency vehicle (such as an ambulance
    or fire truck) closer than how many feet?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Guam law prohibits following any fire apparatus or emergency vehicle
    traveling in response to an alarm closer than 500 feet.
- id: 88
  category: safe_driving_rules
  question: What is the primary purpose of the center lane (painted with solid and
    broken yellow lines) on Guam's multi-lane roads?
  choices:
    A: Passing slow-moving vehicles
    B: High-speed travel
    C: Left turns only
    D: Emergency parking only
  answer: C
  explanation: The center lane is reserved exclusively for vehicles turning left.
    It should never be used for passing or as a regular through-lane.
- id: 89
  category: safe_driving_rules
  question: Is a 'Right Turn on Red' permitted in Guam?
  choices:
    A: No, it is strictly prohibited
    B: Yes, but only between the hours of 9:00 PM and 6:00 AM
    C: Yes, after a complete stop and yielding to traffic/pedestrians, unless a sign
      prohibits it
    D: Yes, but only if there are no other cars at the intersection
  answer: C
  explanation: In Guam, you may turn right on a red light after coming to a complete
    stop and yielding to pedestrians and other traffic, provided there is no sign
    posted that says 'No Right Turn on Red'.
- id: 90
  category: safe_driving_rules
  question: When is it legal to pass another vehicle on the right in Guam?
  choices:
    A: When the vehicle ahead is making or about to make a left turn and there is
      sufficient pavement
    B: Whenever the vehicle in front is driving too slowly
    C: On a two-lane road by using the shoulder
    D: It is never legal to pass on the right
  answer: A
  explanation: Passing on the right is permitted when the vehicle being overtaken
    is making a left turn and there is a clear lane or sufficient width of unobstructed
    pavement on the right.
- id: 91
  category: safe_driving_rules
  question: According to Guam's child restraint law, children under what age must
    be secured in a child passenger restraint system (car seat)?
  choices:
    A: Under 2 years old
    B: Under 4 years old
    C: Under 8 years old
    D: Under 12 years old
  answer: B
  explanation: Guam law requires that children under 4 years of age be secured in
    a child passenger restraint system. Children between 4 and 11 (who are less than
    4 feet 9 inches tall) must use a booster seat.
- id: 92
  category: defensive_driving
  question: Why are Guam's roads particularly slippery when it first begins to rain?
  choices:
    A: The heat causes the asphalt to melt
    B: The roads are made of crushed coral which becomes very slick when mixed with
      oil and water
    C: Guam uses a special wax coating on the roads to prevent salt damage
    D: The high humidity prevents water from evaporating
  answer: B
  explanation: Many of Guam's roads are paved with a mixture containing crushed coral.
    This material becomes exceptionally slippery when it first rains as it mixes with
    oil and rubber deposits on the road surface.
- id: 93
  category: defensive_driving
  question: To practice proper defensive driving in Guam, how far ahead should you
    scan the road for potential hazards?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: Only the car directly in front of you
  answer: B
  explanation: Drivers are encouraged to look 10 to 15 seconds ahead to identify hazards
    early and avoid the need for last-minute braking or turning.
- id: 94
  category: defensive_driving
  question: In Guam, when are you required to turn on your headlights?
  choices:
    A: From 30 minutes after sunset to 30 minutes before sunrise
    B: From one hour before sunset to one hour after sunrise
    C: Only when it is raining
    D: Between the hours of 8:00 PM and 6:00 AM
  answer: B
  explanation: Guam law requires headlights to be on from one hour before sunset to
    one hour after sunrise, or whenever visibility is less than 500 feet.
- id: 95
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet Guam highway, what is the
    safest action to take?
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel sharply toward the shoulder
    C: Slow down gradually by easing off the gas pedal
    D: Shift the car into neutral
  answer: C
  explanation: If hydroplaning, you should not brake or turn suddenly. Instead, ease
    off the accelerator to allow the vehicle to slow down until the tires regain contact
    with the road.
- id: 96
  category: defensive_driving
  question: When driving at night, you must dim your high beam headlights when an
    oncoming vehicle is within how many feet?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Guam law requires drivers to dim their high beams when an oncoming
    vehicle is within 500 feet to avoid blinding the other driver.
- id: 97
  category: defensive_driving
  question: When following another vehicle at night in Guam, you must dim your high
    beams when you are within how many feet of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: You must switch to low beams when following another vehicle within
    300 feet so that your lights do not reflect in their rearview mirror.
- id: 98
  category: defensive_driving
  question: When an emergency vehicle with sirens and flashing lights approaches from
    behind, what should you do?
  choices:
    A: Stop immediately in your lane
    B: Speed up to get out of the way
    C: Yield the right-of-way and move to the right edge of the road and stop
    D: Move to the left shoulder and stop
  answer: C
  explanation: Drivers must pull over to the right-hand edge of the road and stop
    until the emergency vehicle has passed.
- id: 99
  category: defensive_driving
  question: When parking on a hill in Guam with a curb, facing downhill, in which
    direction should you turn your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: A
  explanation: When parking downhill, turn your wheels toward the curb so that if
    the vehicle rolls, it will be stopped by the curb.
- id: 100
  category: defensive_driving
  question: Under Guam's Implied Consent Law, what is the penalty for a first-time
    refusal to submit to a breath or blood test when suspected of DUI?
  choices:
    A: A verbal warning
    B: A fine of $50
    C: The officer will seize your license and it may be suspended for 6 months
    D: Mandatory 48 hours in jail
  answer: C
  explanation: By driving on Guam's roads, you consent to chemical testing. Refusal
    results in the immediate seizure of your license and a potential 6-month suspension
    for the first offense.
- id: 101
  category: defensive_driving
  question: What is the 'blind spot' in defensive driving terminology?
  choices:
    A: An area around the vehicle that cannot be seen in the mirrors
    B: The area directly in front of the bumper
    C: Driving during a solar eclipse
    D: The area blocked by the rearview mirror
  answer: A
  explanation: Blind spots are areas to the left and right rear of your vehicle that
    are not visible in your mirrors; you must turn your head to check these areas
    before changing lanes.
- id: 102
  category: defensive_driving
  question: If you are involved in a traffic accident in Guam where property damage
    exceeds $250, what must you do?
  choices:
    A: Exchange information and leave
    B: Wait 24 hours before reporting it
    C: Report the accident to the Guam Police Department immediately
    D: Only report it if someone is injured
  answer: C
  explanation: Guam law requires that any accident resulting in injury, death, or
    property damage over $250 must be reported to the police immediately.
- id: 103
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning, how far ahead should
    you scan the road while driving in Guam?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: Only the car immediately in front of you
  answer: B
  explanation: Defensive driving requires looking ahead at least 10 to 15 seconds
    to identify potential hazards before you reach them.
- id: 104
  category: defensive_driving
  question: 'If you find your vehicle is hydroplaning (sliding on a thin layer of
    water) during a heavy Guam rainstorm, you should:'
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel sharply toward the shoulder
    C: Keep your foot on the gas and steer straight
    D: Gradually slow down by easing your foot off the gas pedal
  answer: D
  explanation: If hydroplaning, you should not brake hard or turn sharply. Instead,
    ease off the gas pedal to allow the car to slow down until the tires regain contact
    with the road.
- id: 105
  category: defensive_driving
  question: When entering an intersection, what is the correct defensive driving scanning
    sequence?
  choices:
    A: Look straight ahead and go
    B: Look left, then right, then left again
    C: Look right, then left, then right again
    D: Check your rearview mirror only
  answer: B
  explanation: Because the first vehicle that could hit you is coming from the left,
    you should look left, then right, and then left again before entering an intersection.
- id: 106
  category: defensive_driving
  question: If a vehicle is following you too closely (tailgating) on a two-lane road
    in Guam, what is the safest action to take?
  choices:
    A: Tap your brakes repeatedly to warn them
    B: Speed up to increase the gap
    C: Slow down and pull to the right when safe to let them pass
    D: Stop abruptly to teach them a lesson
  answer: C
  explanation: If being tailgated, the safest defensive move is to slow down gradually
    and move to the right to encourage the tailgater to pass.
- id: 107
  category: defensive_driving
  question: When driving in heavy fog or thick smoke on Guam, which lights should
    you use?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard flashers only
  answer: B
  explanation: Low beams should be used in fog or smoke. High beams reflect off the
    moisture or particles, causing glare and making it harder to see.
- id: 108
  category: defensive_driving
  question: What is the 'blind spot' of a vehicle?
  choices:
    A: The area directly in front of the bumper
    B: The area shown in the rearview mirror
    C: The area to the left or right of the vehicle not visible in mirrors
    D: The area blocked by the sun visor
  answer: C
  explanation: Blind spots are areas around the vehicle that cannot be seen by the
    driver using mirrors alone; drivers must turn their heads to check these areas.
- id: 109
  category: defensive_driving
  question: 'In Guam, if you are involved in a skid, you should:'
  choices:
    A: Turn the steering wheel in the opposite direction of the skid
    B: Turn the steering wheel in the direction the rear of the vehicle is skidding
    C: Lock the brakes immediately
    D: Shift the car into Neutral
  answer: B
  explanation: To recover from a skid, you should steer in the direction the rear
    of the vehicle is sliding to regain control.
- id: 110
  category: defensive_driving
  question: When should you increase your following distance to more than two seconds
    on Guam roads?
  choices:
    A: When the roads are wet or slippery
    B: When following a large truck or bus
    C: When visibility is poor
    D: All of the above
  answer: D
  explanation: The two-second rule is for ideal conditions. You should increase this
    distance during rain, when following large vehicles that block your view, or in
    poor visibility.
- id: 111
  category: defensive_driving
  question: What is the best way to handle 'highway hypnosis' or fatigue during long
    drives on Guam?
  choices:
    A: Turn the radio to a very high volume
    B: Drink several cups of coffee
    C: Keep your eyes moving and take rest breaks
    D: Stare fixedly at the center line to stay on track
  answer: C
  explanation: To prevent fatigue and highway hypnosis, keep your eyes moving (scanning)
    and stop for rest breaks if you feel drowsy.
- id: 112
  category: alcohol_drugs_health
  question: Under Guam law, a person convicted of a first-offense DUI faces a mandatory
    minimum jail term of how many hours?
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: C
  explanation: A first-offense DUI conviction in Guam carries a mandatory minimum
    sentence of not less than 48 hours in jail.
- id: 113
  category: alcohol_drugs_health
  question: If a driver in Guam refuses to submit to a chemical test for alcohol,
    what is the immediate administrative penalty regarding their license?
  choices:
    A: A $100 fine only
    B: The license will be seized and suspended for 6 months
    C: The license will be seized and suspended for 2 years
    D: No penalty if it is the first time they refused
  answer: B
  explanation: If you refuse a chemical test in Guam, the officer will seize your
    license and your driving privileges will be suspended for 6 months (for a first
    refusal).
- id: 114
  category: alcohol_drugs_health
  question: Regarding open containers of alcohol in a motor vehicle on Guam, which
    of the following is true?
  choices:
    A: It is legal if the passenger is drinking and the driver is not.
    B: It is legal as long as the container is in the glove compartment.
    C: It is illegal to have any open container of alcohol in the passenger compartment
      of a vehicle.
    D: It is legal only during sanctioned public holidays.
  answer: C
  explanation: Guam law prohibits the possession of an open container of an alcoholic
    beverage in the passenger compartment of a motor vehicle located on a public highway.
- id: 115
  category: alcohol_drugs_health
  question: If a person is convicted of a second DUI in Guam within five years of
    a prior offense, what is the mandatory minimum jail sentence?
  choices:
    A: 48 hours
    B: 72 hours
    C: 7 days
    D: 30 days
  answer: C
  explanation: For a second DUI conviction within five years, Guam law requires a
    mandatory minimum sentence of 7 days in jail.
- id: 116
  category: alcohol_drugs_health
  question: If you are taking prescription medication and it impairs your driving
    ability, can you be charged with a DUI in Guam?
  choices:
    A: No, because the drug was legally prescribed by a doctor.
    B: No, DUI only applies to illegal drugs and alcohol.
    C: Yes, it is illegal to drive under the influence of any drug that impairs your
      ability to drive safely.
    D: Yes, but only if you also have alcohol in your system.
  answer: C
  explanation: Guam's DUI laws apply to any person under the influence of alcohol,
    any drug, or a combination of both, which renders them incapable of safely operating
    a vehicle, regardless of whether the drug is legal or illegal.
- id: 117
  category: alcohol_drugs_health
  question: What is the primary effect of alcohol on a driver's physical abilities?
  choices:
    A: It speeds up reaction time.
    B: It improves vision and focus.
    C: It slows down reaction time and coordination.
    D: It has no effect on physical abilities if the driver is experienced.
  answer: C
  explanation: Alcohol is a depressant that slows down the central nervous system,
    resulting in slower reaction times, reduced coordination, and impaired judgment.
- id: 118
  category: alcohol_drugs_health
  question: Which of the following is the first thing affected by the consumption
    of alcohol?
  choices:
    A: Vision
    B: Coordination
    C: Judgment
    D: Speech
  answer: C
  explanation: Judgment is the first faculty to be impaired by alcohol, often leading
    drivers to believe they are capable of driving safely when they are not.
- id: 119
  category: alcohol_drugs_health
  question: What happens when alcohol is combined with other drugs, such as cold medicine
    or marijuana?
  choices:
    A: The effects of both are cancelled out.
    B: The effects are multiplied, creating a much higher level of impairment.
    C: The drug will sober the person up from the alcohol.
    D: There is no additional effect on the driver.
  answer: B
  explanation: Combining alcohol with other drugs (synergistic effect) can multiply
    the effects of both, leading to extreme impairment even with small amounts of
    each.
- id: 120
  category: alcohol_drugs_health
  question: 'A person convicted of a first-offense DUI in Guam will have their driver''s
    license suspended for a period of:'
  choices:
    A: 30 to 60 days
    B: 90 days to 6 months
    C: 6 months to 1 year
    D: 2 years to 5 years
  answer: C
  explanation: Under Guam law, a first-offense DUI conviction results in a license
    suspension of not less than 6 months and not more than 1 year.
- id: 121
  category: alcohol_drugs_health
  question: 'In Guam, if a driver is involved in a DUI accident that causes bodily
    injury to another person, the offense is classified as a:'
  choices:
    A: Violation
    B: Misdemeanor
    C: Felony
    D: Civil infraction
  answer: C
  explanation: A DUI that results in bodily injury to any person other than the driver
    is a felony in Guam, carrying much harsher penalties than a standard DUI.
- id: 122
  category: alcohol_drugs_health
  question: 'If you have a medical condition (such as epilepsy or diabetes) that might
    affect your ability to drive safely, you must:'
  choices:
    A: Never drive again.
    B: Inform the DMV and provide a medical report from a physician.
    C: Only drive during daylight hours.
    D: Keep it a secret to avoid losing your license.
  answer: B
  explanation: Drivers in Guam are required to disclose medical conditions that may
    impair driving. The Department of Revenue and Taxation may require a medical evaluation
    to determine if the person can safely operate a vehicle.
- id: 123
  category: alcohol_drugs_health
  question: What is the legal BAC limit for a commercial driver (CDL holder) operating
    a commercial vehicle in Guam?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: In alignment with federal regulations and Guam law, the BAC limit for
    commercial drivers operating a commercial motor vehicle is 0.04%.
- id: 124
  category: alcohol_drugs_health
  question: What is the minimum mandatory fine for a first-time conviction of Driving
    Under the Influence (DUI) in Guam?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $5,000
  answer: C
  explanation: Under Guam law (16 GCA § 18105), a person convicted of a first DUI
    offense shall be punished by a fine of not less than $1,000 and not more than
    $5,000.
- id: 125
  category: alcohol_drugs_health
  question: A person convicted of a first DUI offense in Guam must serve a minimum
    of how many hours in jail?
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: C
  explanation: Guam law mandates that a first-time DUI offender must serve a minimum
    of 48 hours in jail, and the court may not suspend this minimum sentence.
- id: 126
  category: alcohol_drugs_health
  question: 'If a driver refuses to submit to a chemical test when requested by a
    law enforcement officer in Guam, their license will be seized and they face a
    mandatory suspension of:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 2 years
  answer: C
  explanation: If a driver refuses a chemical test under the Implied Consent law,
    the officer shall seize the license and the person's driving privileges will be
    suspended for 6 months for a first refusal.
- id: 127
  category: alcohol_drugs_health
  question: In Guam, it is illegal to possess an open container of an alcoholic beverage
    in which part of the vehicle?
  choices:
    A: The trunk
    B: The passenger compartment
    C: A locked glove box
    D: Behind the last upright seat of a vehicle without a trunk
  answer: B
  explanation: Guam law prohibits the possession of an open container of alcohol in
    the passenger compartment of a motor vehicle while on a public highway.
- id: 128
  category: alcohol_drugs_health
  question: Which of the following is true regarding prescription drugs and driving
    in Guam?
  choices:
    A: You cannot be arrested for DUI if the drug was legally prescribed by a doctor
    B: Prescription drugs only affect driving if taken with alcohol
    C: You can be charged with DUI if a prescription drug impairs your ability to
      drive safely
    D: Only illegal narcotics are considered in DUI cases
  answer: C
  explanation: In Guam, driving under the influence of any drug—including prescription
    or over-the-counter medications—that renders you incapable of safe driving is
    a violation of the law.
- id: 129
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' when referring to alcohol and drugs?
  choices:
    A: The drugs cancel out the effects of the alcohol
    B: The alcohol makes the drugs less potent
    C: The combination of alcohol and drugs produces a much stronger effect than either
      alone
    D: The effect of the substances is exactly the same as taking them separately
  answer: C
  explanation: The synergistic effect means that when alcohol and other drugs are
    mixed, they interact to multiply the impairment, making it much more dangerous
    than using either substance individually.
- id: 130
  category: alcohol_drugs_health
  question: How does alcohol first affect a driver's ability?
  choices:
    A: It improves coordination
    B: It impairs judgment and reason
    C: It sharpens the vision
    D: It speeds up reaction time
  answer: B
  explanation: Alcohol affects the brain's higher functions first, meaning a driver's
    judgment and ability to reason are impaired before their physical coordination
    or reaction time noticeably fails.
- id: 131
  category: alcohol_drugs_health
  question: In Guam, what is the legal BAC limit for operators of commercial motor
    vehicles?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Consistent with federal standards adopted by Guam, the BAC limit for
    commercial drivers (CDL holders) operating a commercial vehicle is 0.04%.
- id: 132
  category: alcohol_drugs_health
  question: What is the only effective way to lower your Blood Alcohol Content (BAC)
    after drinking?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Giving your body time to process the alcohol
  answer: D
  explanation: Only time allows the body (specifically the liver) to metabolize alcohol.
    Coffee, showers, and exercise do not speed up the elimination of alcohol from
    the bloodstream.
- id: 133
  category: alcohol_drugs_health
  question: If you are taking a new over-the-counter medication, what should you do
    before driving?
  choices:
    A: Drive only on side streets to test your reaction
    B: Read the label for warnings about drowsiness or operating machinery
    C: Drink a caffeinated beverage to stay alert
    D: Assume it is safe because it does not require a prescription
  answer: B
  explanation: Many over-the-counter medications (like antihistamines or cold medicine)
    can cause drowsiness. Drivers are responsible for knowing how their medication
    affects them by reading the warning labels.
- id: 134
  category: alcohol_drugs_health
  question: In Guam, a person convicted of DUI must complete which of the following
    before their driving privileges can be fully restored?
  choices:
    A: A high school diploma
    B: A court-approved alcohol and drug rehabilitation program
    C: 100 hours of police ride-alongs
    D: A new written test every month for a year
  answer: B
  explanation: Guam law requires DUI offenders to complete a court-mandated alcohol/drug
    education or treatment program as part of their sentencing and license reinstatement
    process.
- id: 135
  category: penalties_and_points
  question: Under Guam's Implied Consent Law, if you refuse to submit to a chemical
    test for alcohol or controlled substances, your driving privileges will be automatically
    suspended for how long for a first refusal?
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: According to 16 GCA § 18102, any person who operates a motor vehicle
    on Guam's highways is deemed to have given consent to a chemical test. Refusal
    results in a mandatory 6-month license suspension for the first offense.
- id: 136
  category: penalties_and_points
  question: What is the mandatory fine for failing to wear a seat belt or failing
    to properly secure a child passenger in Guam?
  choices:
    A: 25 per person
    B: 50 per person
    C: 100 per person
    D: 200 per person
  answer: C
  explanation: Guam law (16 GCA § 1102) mandates a fine of $100 for each occupant
    not properly restrained by a seat belt or child restraint system.
- id: 137
  category: penalties_and_points
  question: Under Guam's 'Hands-Free' law, what is the fine for a first-time offense
    of using a mobile phone while driving without a hands-free device?
  choices:
    A: '50'
    B: '100'
    C: '250'
    D: '500'
  answer: B
  explanation: 16 GCA § 3346 prohibits the use of a mobile phone while driving unless
    it is in hands-free mode. The fine for the first offense is $100.
- id: 138
  category: penalties_and_points
  question: What is the maximum fine for passing a stopped school bus while its red
    lights are flashing and its stop arm is extended in Guam?
  choices:
    A: '100'
    B: '250'
    C: '500'
    D: '1000'
  answer: C
  explanation: Passing a school bus while it is loading or unloading passengers is
    a serious violation in Guam, carrying a fine of up to $500.
- id: 139
  category: penalties_and_points
  question: Under the Guam point system, how many points are assessed against your
    driving record for a conviction of Reckless Driving?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Reckless driving is considered a major violation in Guam and results
    in 6 points being added to the driver's record.
- id: 140
  category: penalties_and_points
  question: How many points are added to a Guam driving record for speeding between
    1 and 15 miles per hour over the posted limit?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Speeding 1 to 15 mph over the limit in Guam results in 2 points on
    the driver's record.
- id: 141
  category: penalties_and_points
  question: For a first-time DUI conviction in Guam, what is the minimum fine that
    must be paid?
  choices:
    A: '500'
    B: '750'
    C: '1000'
    D: '2000'
  answer: C
  explanation: According to 16 GCA § 18105, the fine for a first-offense DUI is not
    less than $1,000 and not more than $5,000.
- id: 142
  category: penalties_and_points
  question: How many points are assessed for 'Following too closely' (tailgating)
    on a Guam driver's record?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Following too closely is a violation that results in 2 points under
    the Guam Department of Revenue and Taxation point system.
- id: 143
  category: penalties_and_points
  question: 'Failure to yield the right-of-way to an emergency vehicle (ambulance,
    fire truck, police) using sirens and lights in Guam can result in a fine of up
    to:'
  choices:
    A: '100'
    B: '250'
    C: '500'
    D: '1000'
  answer: C
  explanation: Drivers must pull to the right and stop for emergency vehicles. Failure
    to do so can result in a fine of up to $500.
- id: 144
  category: penalties_and_points
  question: 'In Guam, a person convicted of participating in an illegal speed contest
    (drag racing) on a public highway will have their license revoked for at least:'
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Engaging in a speed contest is a serious offense in Guam, and the law
    mandates a license revocation period of 6 months for the first offense.
- id: 145
  category: penalties_and_points
  question: How many points are assessed for a violation of failing to stop at a red
    light or a stop sign in Guam?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Failing to stop for a red light or stop sign is a 3-point violation
    in Guam's traffic point system.
- id: 146
  category: penalties_and_points
  question: 'In Guam, parking in a space designated for persons with disabilities
    without a proper placard or license plate carries a minimum fine of:'
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: C
  explanation: Under Guam law, the fine for unauthorized parking in a space reserved
    for persons with disabilities is a minimum of $300 and can go up to $500.
- id: 147
  category: penalties_and_points
  question: If you are convicted of speeding 1 to 15 miles per hour over the posted
    speed limit in Guam, how many points are added to your record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Speeding between 1 and 15 mph over the limit in Guam typically results
    in 2 points on your driving record.
- id: 148
  category: penalties_and_points
  question: What is the fine for a first-time violation of Guam's law prohibiting
    the use of a mobile phone while driving (unless hands-free)?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Guam's distracted driving law prohibits the use of handheld electronic
    devices. A first-time violation carries a fine of $100.
- id: 149
  category: penalties_and_points
  question: Failing to stop for a school bus with its red lights flashing and stop
    arm extended in Guam results in how many points on your license?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failing to stop for a school bus is a serious safety violation in Guam
    and carries a penalty of 4 points.
- id: 150
  category: penalties_and_points
  question: 'In Guam, leaving the scene of an accident (Hit and Run) that results
    in injury or death is classified as a:'
  choices:
    A: Petty misdemeanor
    B: Violation only
    C: Felony
    D: Civil infraction
  answer: C
  explanation: Leaving the scene of an accident involving personal injury or death
    is a serious crime in Guam, classified as a felony, which can lead to imprisonment
    and permanent license revocation.
- id: 151
  category: penalties_and_points
  question: 'A first-time DUI conviction in Guam can lead to a license suspension
    period of up to:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: For a first DUI conviction in Guam, the court may suspend the driver's
    license for a period ranging from 6 months to 1 year.
- id: 152
  category: penalties_and_points
  question: How many points are added to your Guam driving record for 'Following too
    closely' (tailgating)?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Following too closely is a moving violation in Guam that results in
    2 points being added to your driving record.
- id: 153
  category: penalties_and_points
  question: In Guam, how often must a vehicle undergo a mandatory safety inspection
    to maintain valid registration?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: All vehicles registered in Guam must pass a safety inspection at an
    authorized station once every year before the registration can be renewed.
- id: 154
  category: penalties_and_points
  question: If you are caught driving while your license is suspended or revoked in
    Guam, what is a likely consequence?
  choices:
    A: A verbal warning
    B: An automatic 1-year extension of the suspension
    C: A $10 fine
    D: No penalty if it's an emergency
  answer: B
  explanation: Driving with a suspended or revoked license is a serious offense in
    Guam. It typically results in an extension of the suspension period and potential
    jail time.
- id: 155
  category: penalties_and_points
  question: Guam's 'Open Container' law prohibits which of the following?
  choices:
    A: Only the driver having an open alcohol container
    B: Only passengers in the front seat having an open alcohol container
    C: Any person in a motor vehicle on a public highway from possessing an open container
      of alcohol
    D: Open containers in the trunk of the car
  answer: C
  explanation: Guam law prohibits any person (driver or passenger) from possessing
    an open container of an alcoholic beverage while in a motor vehicle on a public
    highway.
- id: 156
  category: sharing_the_road
  question: In Guam, if you are approaching an intersection where a pedestrian is
    crossing in an unmarked crosswalk, who has the right-of-way?
  choices:
    A: The driver, because the crosswalk is not marked.
    B: The pedestrian has the right-of-way.
    C: Whoever reached the intersection first.
    D: The pedestrian, but only if they are using a white cane.
  answer: B
  explanation: Pedestrians have the right-of-way at all intersections, whether the
    crosswalk is marked or unmarked.
- id: 157
  category: sharing_the_road
  question: What is the legal status of hitchhiking (soliciting a ride) on Guam's
    public highways?
  choices:
    A: It is legal if the person stands on the shoulder.
    B: It is legal during daylight hours only.
    C: It is illegal for any person to stand in a roadway for the purpose of soliciting
      a ride.
    D: It is only legal for military personnel in uniform.
  answer: C
  explanation: According to the Guam Driver's Manual, it is illegal for any person
    to stand in a roadway for the purpose of soliciting a ride from the occupant of
    any vehicle.
- id: 158
  category: sharing_the_road
  question: When following a large truck or bus, why should you increase your following
    distance?
  choices:
    A: To allow the truck driver to see you in their side mirrors.
    B: Because trucks stop much faster than cars.
    C: To prevent the truck from rolling backward into you.
    D: To avoid the truck's exhaust fumes.
  answer: A
  explanation: Large trucks have significant blind spots (No-Zones). Increasing your
    following distance ensures the truck driver can see your vehicle in their side
    mirrors.
- id: 159
  category: sharing_the_road
  question: In Guam, when are you allowed to 'lane split' (drive a motorcycle between
    rows of stopped or moving vehicles)?
  choices:
    A: When traffic is moving slower than 20 mph.
    B: Only during rush hour.
    C: It is never legal to lane split in Guam.
    D: Only if you are a licensed motorcycle courier.
  answer: C
  explanation: Lane splitting is illegal in Guam; motorcycles must occupy a full lane
    and follow the same rules of the road as other motor vehicles.
- id: 160
  category: sharing_the_road
  question: When a pedestrian is using a white cane or a guide dog at an intersection,
    what must a driver do?
  choices:
    A: Honk to let them know you are there.
    B: Slow down and proceed with caution.
    C: Come to a complete stop and take precautions to avoid injuring the pedestrian.
    D: Only stop if there is a 'Stop' sign.
  answer: C
  explanation: Drivers must take special care and come to a complete stop for totally
    or partially blind pedestrians using a white cane or guide dog.
- id: 161
  category: sharing_the_road
  question: If you are driving on a highway with three or more lanes and a school
    bus is stopped in the opposite direction with red lights flashing, do you need
    to stop?
  choices:
    A: Yes, you must always stop for a school bus.
    B: No, you do not need to stop if there is a physical barrier or a center turning
      lane separating the directions.
    C: Yes, but only if there are children crossing.
    D: No, but you must slow down to 5 mph.
  answer: B
  explanation: On Guam, you do not need to stop for a school bus if you are on the
    opposite side of a divided highway (separated by a physical barrier or a center
    turning lane).
- id: 162
  category: sharing_the_road
  question: When passing a bicycle on a Guam roadway, what is the recommended safe
    distance to maintain?
  choices:
    A: At least 1 foot.
    B: At least 3 feet.
    C: At least 5 feet.
    D: At least 10 feet.
  answer: B
  explanation: While passing a cyclist, drivers should allow at least 3 feet of clearance
    to ensure the safety of the rider.
- id: 163
  category: sharing_the_road
  question: Where should a pedestrian walk if there are no sidewalks available along
    a Guam road?
  choices:
    A: On the right side of the road, with the flow of traffic.
    B: In the middle of the road where they are most visible.
    C: On the left side of the road, facing oncoming traffic.
    D: Pedestrians are not allowed on roads without sidewalks.
  answer: C
  explanation: If no sidewalks are provided, pedestrians should walk on the left side
    of the road facing traffic so they can see approaching vehicles.
- id: 164
  category: sharing_the_road
  question: 'When a large truck is making a right turn at an intersection, you should
    be aware that:'
  choices:
    A: It will turn faster than a car.
    B: It may need to swing wide to the left to clear the curb.
    C: It has the right-of-way over all other vehicles.
    D: It will always stop before turning.
  answer: B
  explanation: Large vehicles like trucks and buses often need to swing wide to the
    left to make a right turn without hitting the curb or other objects.
- id: 165
  category: sharing_the_road
  question: 'When following a motorcycle, you should maintain a following distance
    of at least:'
  choices:
    A: 1 second.
    B: 2 seconds.
    C: 3 seconds.
    D: The same as a car.
  answer: C
  explanation: A following distance of at least 3 seconds is recommended when following
    motorcycles to allow for their ability to stop more quickly and for road hazards
    that might affect them.
- id: 166
  category: sharing_the_road
  question: Under Guam law, what must you do when approaching a stationary authorized
    emergency vehicle that is displaying flashing lights?
  choices:
    A: Maintain speed but move to the left lane.
    B: Stop immediately in your lane.
    C: Slow down and, if safe to do so, move to a lane that is not adjacent to the
      vehicle.
    D: Speed up to pass the vehicle quickly.
  answer: C
  explanation: Guam's 'Move Over' requirements dictate that drivers should slow down
    and change lanes if possible to provide a safety buffer for emergency responders.
- id: 167
  category: sharing_the_road
  question: 'Bicyclists on Guam''s public streets are required to:'
  choices:
    A: Ride on the sidewalk at all times.
    B: Follow the same rules of the road as motor vehicles.
    C: Ride against the flow of traffic.
    D: Only ride in designated bike lanes.
  answer: B
  explanation: Bicyclists have the same rights and responsibilities as drivers of
    motor vehicles and must obey all traffic signs, signals, and laws.
- id: 168
  category: sharing_the_road
  question: What does a slow-moving vehicle emblem look like (typically found on farm
    equipment or construction vehicles)?
  choices:
    A: A blue circle.
    B: A square green sign.
    C: A triangular orange-red sign.
    D: A yellow diamond.
  answer: C
  explanation: Slow-moving vehicles (those traveling 25 mph or less) are required
    to display a reflective triangular orange-red emblem on the rear.
- id: 169
  category: sharing_the_road
  question: Large trucks have 'No-Zones.' What does this term refer to?
  choices:
    A: Areas where trucks are not allowed to drive
    B: The truck's fuel tanks
    C: Blind spots around the truck where the driver cannot see your vehicle
    D: The speed governor on a truck engine
  answer: C
  explanation: No-Zones are large blind spots around the front, back, and sides of
    trucks where cars can disappear from the truck driver's view, increasing the risk
    of a collision.
- id: 170
  category: sharing_the_road
  question: 'Under Guam law, every person riding a bicycle upon a roadway has:'
  choices:
    A: No rights at all
    B: The right to use the sidewalk only
    C: All the rights and all the duties applicable to the driver of a vehicle
    D: The right-of-way over all motorized vehicles
  answer: C
  explanation: Bicyclists on Guam are subject to the same traffic laws as motor vehicle
    operators, meaning they must obey stop signs, signals, and directional rules.
- id: 171
  category: sharing_the_road
  question: When following a motorcycle, you should allow for ________ following distance
    than you would for a passenger car.
  choices:
    A: Less
    B: More
    C: The same
    D: Exactly 10 feet
  answer: B
  explanation: Motorcycles can stop much quicker than cars and are more susceptible
    to road hazards like gravel or wet pavement. Drivers should allow a larger following
    distance (at least 3-4 seconds) to ensure safety.
- id: 172
  category: sharing_the_road
  question: 'A pedestrian using a white cane or a guide dog must be:'
  choices:
    A: Given the right-of-way at all times
    B: Told when it is safe to cross by honking your horn
    C: Avoided by driving onto the shoulder
    D: Ignored if they are not in a marked crosswalk
  answer: A
  explanation: Drivers must exercise extreme caution and yield the right-of-way to
    blind or visually impaired pedestrians using a white cane or a guide dog, regardless
    of whether they are in a crosswalk.
- id: 173
  category: sharing_the_road
  question: What is the requirement for motorcycle operators and passengers regarding
    helmets on Guam?
  choices:
    A: Helmets are only required for those under 18
    B: Helmets are optional if you have insurance
    C: Both the operator and passenger must wear a safety helmet securely fastened
    D: Helmets are only required on highways
  answer: C
  explanation: Guam law (16 GCA § 3301) requires that any person operating or riding
    a motorcycle or motor-run bicycle must wear a safety helmet.
- id: 174
  category: sharing_the_road
  question: 'When a pedestrian is crossing the roadway within any marked or unmarked
    crosswalk at an intersection, the driver of a vehicle must:'
  choices:
    A: Honk to warn them to hurry
    B: Yield the right-of-way to the pedestrian
    C: Maintain speed and drive around them
    D: Only stop if the pedestrian is a child
  answer: B
  explanation: Guam traffic law requires drivers to yield the right-of-way to pedestrians
    crossing within any marked crosswalk or any unmarked crosswalk at an intersection.
- id: 175
  category: sharing_the_road
  question: In Guam, what is the legal requirement for a bicycle being operated at
    night?
  choices:
    A: No special equipment is needed
    B: It must have a white light on the front and a red light or reflector on the
      rear
    C: It must only have a bell
    D: Bicycles are not allowed to be operated at night
  answer: B
  explanation: For safety and visibility, Guam law requires bicycles operated during
    darkness to be equipped with a lamp on the front emitting a white light and a
    red reflector or lamp on the rear.
- id: 176
  category: sharing_the_road
  question: If you are following a large truck and cannot see the truck's side mirrors,
    what does this indicate?
  choices:
    A: The truck driver can see you better
    B: You are in the truck driver's blind spot (No-Zone)
    C: The truck is about to turn
    D: You are at a safe following distance
  answer: B
  explanation: 'A good rule of thumb for sharing the road with trucks is: ''If you
    can''t see the driver''s mirrors, the driver can''t see you.'''
- id: 177
  category: sharing_the_road
  question: 'When walking along a highway where there are no sidewalks, Guam law requires
    pedestrians to walk:'
  choices:
    A: On the right side with the flow of traffic
    B: On the left side facing oncoming traffic
    C: In the middle of the road
    D: Only during daylight hours
  answer: B
  explanation: Pedestrians are required to walk on the left side of the roadway facing
    traffic when sidewalks are not provided, so they can see approaching vehicles.
- id: 178
  category: sharing_the_road
  question: What is the maximum number of people allowed to ride on a motorcycle on
    Guam?
  choices:
    A: As many as can fit
    B: Only the operator, unless the motorcycle is designed to carry a passenger
    C: Always two people
    D: Three people, if one is a child
  answer: B
  explanation: A motorcycle operator shall not carry any other person unless the motorcycle
    is designed to carry more than one person and is equipped with footrests for the
    passenger.
- id: 179
  category: vehicle_information
  question: According to the Guam Driver's Handbook, when are you required to have
    your headlights turned on?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From 30 minutes after sunset to 30 minutes before sunrise
    D: Only when it is raining or foggy
  answer: B
  explanation: Guam law specifically requires headlights to be used from one hour
    after sunset to one hour before sunrise, and at any other time when visibility
    is not sufficient to clearly see persons or vehicles at a distance of 500 feet.
- id: 180
  category: vehicle_information
  question: When following another vehicle from behind at night in Guam, at what distance
    must you dim your high beams?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Guam traffic regulations require drivers to dim their high beams when
    following another vehicle within 300 feet.
- id: 181
  category: vehicle_information
  question: 'Every motor vehicle operated on Guam''s highways must be equipped with
    a horn that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Guam law requires a horn in good working order capable of emitting
    sound audible under normal conditions from a distance of not less than 200 feet.
- id: 182
  category: vehicle_information
  question: Guam law requires that rearview mirrors allow a driver to see the highway
    for a distance of at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Vehicles must be equipped with a mirror so located as to reflect to
    the driver a view of the highway for a distance of at least 200 feet to the rear.
- id: 183
  category: vehicle_information
  question: Under Guam's vehicle equipment laws, what is the minimum percentage of
    light transmission allowed for the front side windows?
  choices:
    A: 15%
    B: 20%
    C: 35%
    D: 50%
  answer: C
  explanation: Guam law (16 GCA § 3209) mandates that window tinting on the front
    side windows must allow at least 35% (plus or minus 3%) of light to pass through.
- id: 184
  category: vehicle_information
  question: For a standard passenger vehicle in Guam, where must the license plates
    be displayed?
  choices:
    A: On the rear bumper only
    B: On the front bumper only
    C: One on the front and one on the rear
    D: Inside the rear windshield
  answer: C
  explanation: 'Guam law requires two license plates to be attached to the vehicle:
    one in the front and one in the rear.'
- id: 185
  category: vehicle_information
  question: Regarding exhaust systems, which of the following is illegal on Guam's
    public roads?
  choices:
    A: A muffler that reduces noise
    B: A muffler cutout or bypass
    C: A dual exhaust system
    D: A chrome exhaust tip
  answer: B
  explanation: Guam law prohibits the use of a muffler cutout, bypass, or similar
    device that prevents the muffler from operating to reduce noise.
- id: 186
  category: vehicle_information
  question: Which type of tire equipment is generally prohibited on Guam's paved roads
    because it may damage the surface?
  choices:
    A: Radial tires
    B: Tires with less than 2/32 inch tread
    C: Metal studs or protuberances on the tire periphery
    D: All-weather tires
  answer: C
  explanation: Guam law prohibits tires with any block, stud, flange, cleat, or spike
    of any metal or other hard material that projects beyond the tread of the traction
    surface.
- id: 187
  category: vehicle_information
  question: Every motor vehicle on Guam must be equipped with how many separate means
    of applying brakes?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Guam law requires vehicles to have two separate means of applying brakes
    (the service brake and the parking/emergency brake), each of which must be effective
    and able to stop the vehicle.
- id: 188
  category: vehicle_information
  question: What is the rule regarding stickers or signs on a vehicle's windshield
    in Guam?
  choices:
    A: They are allowed anywhere as long as they are small
    B: They are only allowed if they are for advertising
    C: They are prohibited if they obstruct the driver's clear view of the highway
    D: They must be placed in the center of the windshield
  answer: C
  explanation: Guam law prohibits any sign, poster, or other non-transparent material
    upon the front windshield, side wings, or side or rear windows that obstructs
    the driver's clear view of the highway or any intersecting highway.
- id: 189
  category: vehicle_information
  question: Turn signal lamps on a vehicle in Guam must be visible from a distance
    of at least how many feet?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Guam vehicle code requires that turn signals be visible and understandable
    from a distance of 100 feet both day and night.
- id: 190
  category: vehicle_information
  question: 'In Guam, every motor vehicle must have at least one tail lamp that emits
    a red light plainly visible from a distance of:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Tail lamps on Guam vehicles must be red and visible from a distance
    of 500 feet to the rear.
- id: 191
  category: vehicle_information
  question: 'The light used to illuminate the rear license plate in Guam must make
    the plate legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Guam law requires a white light to illuminate the rear license plate
    so that it is clearly legible from a distance of 50 feet.
- id: 192
  category: vehicle_information
  question: According to Guam's vehicle equipment standards, your foot brake must
    be capable of stopping the vehicle within how many feet when traveling at 20 mph
    on a dry, level road?
  choices:
    A: 15 feet
    B: 25 feet
    C: 35 feet
    D: 50 feet
  answer: B
  explanation: Guam regulations specify that the service brake (foot brake) must be
    able to stop the vehicle within 25 feet when the vehicle is moving at a speed
    of 20 miles per hour.
- id: 193
  category: vehicle_information
  question: In Guam, every motor vehicle must be equipped with at least how many rear-view
    mirrors?
  choices:
    A: One mirror that reflects a view of at least 200 feet to the rear
    B: Two mirrors, one on each side
    C: Three mirrors including one inside and two outside
    D: Mirrors are only required if the vehicle is a truck
  answer: A
  explanation: Guam law requires at least one mirror so located as to reflect to the
    driver a view of the highway for a distance of at least 200 feet to the rear of
    such vehicle.
- id: 194
  category: vehicle_information
  question: Which of the following is TRUE regarding license plate requirements for
    passenger vehicles in Guam?
  choices:
    A: Only one plate is required on the rear
    B: Only one plate is required on the front
    C: Two plates are required, one on the front and one on the rear
    D: License plates are optional if the registration sticker is on the windshield
  answer: C
  explanation: 'Guam law requires that motor vehicles (except motorcycles) display
    two license plates: one firmly attached to the front and one to the rear.'
- id: 195
  category: vehicle_information
  question: In Guam, turn signal lights must be visible from a distance of not less
    than how many feet in normal sunlight?
  choices:
    A: 50 feet
    B: 100 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Turn signal lamps in Guam must be visible from a distance of not less
    than 100 feet both to the front and the rear in normal sunlight.
- id: 196
  category: vehicle_information
  question: 'Every motor vehicle in Guam must be equipped with a muffler that prevents:'
  choices:
    A: All exhaust smoke
    B: Excessive or unusual noise
    C: Any sound from the engine
    D: Carbon dioxide emissions
  answer: B
  explanation: Guam law requires every motor vehicle to have a muffler in constant
    operation to prevent excessive or unusual noise and annoying smoke.
- id: 197
  category: vehicle_information
  question: 'In Guam, tail lights must be red in color and visible from a distance
    of:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Tail lights on vehicles in Guam must be red and clearly visible from
    a distance of 500 feet to the rear.
- id: 198
  category: vehicle_information
  question: What is the minimum required tread depth for tires on a passenger vehicle
    in Guam?
  choices:
    A: 1/32 of an inch
    B: 2/32 (1/16) of an inch
    C: 4/32 (1/8) of an inch
    D: 6/32 of an inch
  answer: B
  explanation: For safety and to pass the annual inspection in Guam, tires must have
    a minimum tread depth of 2/32 of an inch.
- id: 199
  category: vehicle_information
  question: Under Guam law, when are you required to display your vehicle's headlights?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: Only when it is raining
    C: From sunset to sunrise and whenever visibility is less than 500 feet
    D: Only during the hours of midnight to 5:00 AM
  answer: C
  explanation: Headlights must be used from sunset to sunrise and at any other time
    when visibility is not sufficient to see clearly at a distance of 500 feet.
- id: 200
  category: vehicle_information
  question: 'In Guam, it is illegal to operate a motor vehicle if the windshield:'
  choices:
    A: Is made of safety glass
    B: Has any stickers on it
    C: Has a crack or defect that obstructs the driver's clear view
    D: Is tinted at the very top edge
  answer: C
  explanation: Guam law prohibits operating a vehicle with a windshield that is cracked,
    scarred, or has defects that obstruct the driver's view of the highway.
- id: 201
  category: vehicle_information
  question: Which of the following equipment is NOT mandatory for a passenger car
    registered in Guam?
  choices:
    A: Windshield wipers
    B: A working speedometer
    C: A spare tire and jack
    D: A parking brake
  answer: C
  explanation: While highly recommended for safety, Guam's mandatory vehicle equipment
    laws for registration and inspection do not strictly require a spare tire and
    jack, whereas wipers, a speedometer, and a parking brake are required safety items.
- id: 202
  category: signs_and_signals
  question: When you see a flashing red traffic light at an intersection in Guam,
    what must you do?
  choices:
    A: Slow down and proceed with caution
    B: Stop only if other vehicles are approaching
    C: Stop completely and proceed when it is safe to do so
    D: Yield to traffic on the right only
  answer: C
  explanation: In Guam, a flashing red light is treated the same as a stop sign. You
    must come to a complete stop and proceed only when the way is clear.
- id: 203
  category: signs_and_signals
  question: Which hand signal is used to indicate that you are slowing down or stopping?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward with palm to the rear
    D: Waving the left arm up and down
  answer: C
  explanation: To signal a stop or a decrease in speed using hand signals, the driver
    should extend the left arm out and downward with the palm facing the rear.
- id: 204
  category: signs_and_signals
  question: 'In Guam, a ''pennant-shaped'' sign (an isosceles triangle pointing right)
    is used specifically to indicate:'
  choices:
    A: A school zone
    B: A yield requirement
    C: A no-passing zone
    D: A railroad crossing
  answer: C
  explanation: The pennant-shaped sign is placed on the left side of the road to warn
    drivers that they are entering a no-passing zone.
- id: 205
  category: signs_and_signals
  question: What is the meaning of a flashing yellow light at an intersection?
  choices:
    A: Stop and wait for the light to turn green
    B: Slow down and proceed with caution
    C: Speed up to clear the intersection quickly
    D: The signal is broken; treat it as a four-way stop
  answer: B
  explanation: A flashing yellow light warns drivers to slow down, stay alert, and
    proceed through the intersection with caution.
- id: 206
  category: signs_and_signals
  question: Under Guam law, when are you allowed to turn right on a red light?
  choices:
    A: Never, you must wait for a green light
    B: Only if there is a green arrow pointing right
    C: After coming to a complete stop and yielding to traffic and pedestrians, unless
      a sign prohibits it
    D: Only between the hours of 10:00 PM and 6:00 AM
  answer: C
  explanation: Guam law permits a right turn on red after a full stop, provided the
    way is clear and there are no signs posted that prohibit the turn.
- id: 207
  category: signs_and_signals
  question: What do double solid white lines painted on the pavement indicate?
  choices:
    A: You may cross to change lanes if it is safe
    B: They separate traffic moving in opposite directions
    C: Lane changing is prohibited
    D: The edge of the roadway
  answer: C
  explanation: Double solid white lines are used to separate lanes of traffic moving
    in the same direction where lane changing is hazardous and prohibited.
- id: 208
  category: signs_and_signals
  question: 'A diamond-shaped sign on Guam''s roads is generally used for:'
  choices:
    A: Regulatory information like speed limits
    B: Warning drivers of existing or potentially hazardous conditions
    C: Guide information for destinations
    D: Yielding instructions
  answer: B
  explanation: Diamond-shaped signs are standard warning signs used to alert drivers
    to hazards, such as curves, intersections, or merging traffic.
- id: 209
  category: signs_and_signals
  question: What does a circular red sign with a white horizontal line across the
    middle mean?
  choices:
    A: No Parking
    '0': Do Not Enter
    C: Yield to oncoming traffic
    D: One-way street ahead
  answer: B
  explanation: The 'Do Not Enter' sign is a square with a red circle and a white horizontal
    bar, indicating that traffic is prohibited from entering the road in that direction.
- id: 210
  category: signs_and_signals
  question: In Guam, what color are signs used to provide information about services
    like hospitals, gas stations, and telephone booths?
  choices:
    A: Green
    B: Blue
    C: Brown
    D: Yellow
  answer: B
  explanation: Blue signs are used for motorist services, providing information about
    hospitals, food, gas, and lodging.
- id: 211
  category: signs_and_signals
  question: What does a solid white line painted across an intersection represent?
  choices:
    A: A pedestrian crosswalk
    B: A stop line
    C: A bicycle lane
    D: A parking boundary
  answer: B
  explanation: A solid white line across a lane at an intersection is a stop line,
    indicating the point before which a vehicle must stop at a stop sign or red light.
- id: 212
  category: signs_and_signals
  question: When a traffic signal turns green, but the intersection is blocked by
    other vehicles, what should you do?
  choices:
    A: Enter the intersection and wait for traffic to move
    B: Honk your horn until the vehicles move
    C: Stay out of the intersection until you can pass through completely
    D: Turn right to avoid the traffic
  answer: C
  explanation: Under Guam's traffic rules, you should not enter an intersection if
    it is blocked, even if the light is green. You must wait until there is enough
    space to clear the intersection entirely.
- id: 213
  category: signs_and_signals
  question: What is the primary purpose of a yellow-colored sign on the road?
  choices:
    A: To provide regulatory instructions
    B: To indicate construction zones
    C: To warn of general hazards or changes in road conditions
    D: To show distance to the next village
  answer: C
  explanation: Yellow signs are used as general warning signs to alert drivers to
    potential hazards or changes in the path of travel ahead.
- id: 214
  category: signs_and_signals
  question: When using hand signals to indicate a turn, what is the correct position
    for a left turn?
  choices:
    A: Arm extended straight out the window
    B: Arm extended upward
    C: Arm extended downward
    D: Arm waving in a circular motion
  answer: A
  explanation: According to the Guam Driver's Handbook, a left turn is signaled by
    extending the left arm horizontally out the window.
- id: 215
  category: signs_and_signals
  question: To signal a right turn using hand signals, how should the driver's arm
    be positioned?
  choices:
    A: Extended straight out the window
    B: Extended upward with the elbow bent at a 90-degree angle
    C: Extended downward with the palm facing the rear
    D: Tapping the roof of the car
  answer: B
  explanation: The Guam Driver's Handbook states that a right turn is signaled by
    extending the left arm out and bending it upward at the elbow.
- id: 216
  category: signs_and_signals
  question: In Guam, what does a flashing red traffic light signify?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to turn green
    C: Stop completely and proceed only when it is safe to do so
    D: The traffic signal is broken; ignore it
  answer: C
  explanation: A flashing red light in Guam has the same meaning as a stop sign. You
    must come to a complete stop and proceed when safe.
- id: 217
  category: signs_and_signals
  question: What should a driver do when approaching a flashing yellow traffic light
    in Guam?
  choices:
    A: Stop and wait for it to turn green
    B: Speed up to clear the intersection
    C: Slow down and proceed with caution
    D: Treat it as a four-way stop
  answer: C
  explanation: A flashing yellow light is a warning to slow down and be especially
    alert as you proceed through the intersection.
- id: 218
  category: signs_and_signals
  question: What do double solid yellow lines in the center of the roadway indicate?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: No passing is allowed in either direction
    D: The road is one-way
  answer: C
  explanation: Double solid yellow lines mean that passing is prohibited for traffic
    moving in both directions.
- id: 219
  category: signs_and_signals
  question: 'A broken white line on a multi-lane roadway in Guam means:'
  choices:
    A: Traffic is moving in opposite directions
    B: Traffic is moving in the same direction and lane changes are permitted
    C: You must not cross the line under any circumstances
    D: The lane is reserved for emergency vehicles only
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction
    and indicate that you may cross them to change lanes if it is safe.
- id: 220
  category: signs_and_signals
  question: What is the meaning of a solid yellow line next to a broken yellow line
    in the center of the road?
  choices:
    A: Passing is prohibited for both sides
    B: Passing is permitted for both sides
    C: Passing is permitted only for the side next to the broken line
    D: Passing is permitted only for the side next to the solid line
  answer: C
  explanation: When there is a solid and a broken yellow line, only the traffic on
    the side of the broken line may pass when it is safe to do so.
- id: 221
  category: signs_and_signals
  question: In Guam, what color and shape is a standard 'Yield' sign?
  choices:
    A: Yellow and diamond-shaped
    B: Red and white, downward-pointing triangle
    C: White and rectangular
    D: Red and octagonal
  answer: B
  explanation: A yield sign is a red and white equilateral triangle with one point
    downward.
- id: 222
  category: signs_and_signals
  question: 'A pennant-shaped sign (sideways triangle) placed on the left side of
    the road indicates:'
  choices:
    A: A school zone
    B: A construction zone
    C: A no-passing zone
    D: A railroad crossing
  answer: C
  explanation: The pennant-shaped sign is used to mark the beginning of a no-passing
    zone and is placed on the left side of the road facing the driver.
- id: 223
  category: signs_and_signals
  question: Most warning signs used in Guam to alert drivers to hazards or changes
    in road conditions are what shape?
  choices:
    A: Square
    B: Round
    C: Diamond
    D: Rectangular
  answer: C
  explanation: Warning signs are typically diamond-shaped with black symbols or lettering
    on a yellow background.
- id: 224
  category: signs_and_signals
  question: What does a white diamond symbol painted on a lane in Guam indicate?
  choices:
    A: A pedestrian crossing
    B: A high-occupancy vehicle (HOV) or restricted lane
    C: A parking zone
    D: A speed bump ahead
  answer: B
  explanation: The diamond symbol on the pavement usually designates a lane reserved
    for specific vehicles, such as buses or carpools (HOV).
- id: 225
  category: signs_and_signals
  question: 'A five-sided (pentagon) sign indicates that you are near:'
  choices:
    A: A hospital
    B: A school
    C: A military base
    D: A public park
  answer: B
  explanation: A pentagon-shaped sign is used exclusively to warn drivers that they
    are approaching a school zone or a school crossing.
- id: 226
  category: signs_and_signals
  question: When a traffic signal is dark (not working due to a power outage), how
    should you treat the intersection in Guam?
  choices:
    A: As a two-way stop
    B: As an uncontrolled intersection where the largest vehicle has the right-of-way
    C: As a four-way stop
    D: Maintain speed and proceed with caution
  answer: C
  explanation: If traffic signals are not operating, the intersection should be treated
    as a multi-way stop, where drivers must stop and yield the right-of-way to vehicles
    that arrived first.
