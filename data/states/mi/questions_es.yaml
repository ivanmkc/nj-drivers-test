questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima en Michigan para solicitar una Licencia de Aprendiz
    de Nivel 1?
  choices:
    A: 14 años
    B: 14 años y 9 meses
    C: 15 años
    D: 15 años y 6 meses
  answer: B
  explanation: De acuerdo con el sistema de Licencia Graduada para Conductores (GDL)
    de Michigan, un adolescente debe tener al menos 14 años y 9 meses para solicitar
    una Licencia de Aprendiz de Nivel 1 después de completar el Segmento 1 de la educación
    vial.
- id: 2
  category: license_system
  question: Bajo la Licencia Intermedia de Nivel 2 de Michigan, ¿cuáles son las horas
    restringidas para conducir sin un padre, tutor o adulto con licencia mayor de
    21 años?
  choices:
    A: De medianoche a 5:00 AM
    B: De 11:00 PM a 6:00 AM
    C: De 10:00 PM a 5:00 AM
    D: De 9:00 PM a 4:00 AM
  answer: C
  explanation: Los titulares de una licencia de Nivel 2 en Michigan tienen prohibido
    conducir entre las 10:00 PM y las 5:00 AM, a menos que se dirijan hacia o desde
    su lugar de trabajo, una actividad autorizada, o que vayan acompañados por un
    padre, tutor o adulto con licencia mayor de 21 años.
- id: 3
  category: license_system
  question: ¿Cuántos pasajeros menores de 21 años tiene permitido llevar el titular
    de una licencia de Nivel 2 de Michigan, excluyendo a los miembros de la familia
    inmediata?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: La ley de Michigan restringe a los titulares de licencias de Nivel
    2 a no más de un pasajero menor de 21 años, a menos que los pasajeros sean miembros
    de la familia inmediata o que el conductor se dirija hacia o desde el trabajo
    o un evento sancionado por la escuela.
- id: 4
  category: license_system
  question: Para calificar para una Licencia Intermedia de Nivel 2 en Michigan, ¿cuántas
    horas de experiencia al volante debe registrar un adolescente y cuántas deben
    ser de noche?
  choices:
    A: 40 horas en total, 5 de noche
    B: 50 horas en total, 10 de noche
    C: 30 horas en total, 2 de noche
    D: 60 horas en total, 15 de noche
  answer: B
  explanation: Antes de realizar el examen de habilidades de conducción para una licencia
    de Nivel 2, un adolescente debe registrar 50 horas de conducción, incluyendo al
    menos 10 horas de noche.
- id: 5
  category: license_system
  question: En Michigan, ¿cuánto tiempo debe tener un adolescente una Licencia de
    Aprendiz de Nivel 1 antes de ser elegible para realizar el examen de habilidades
    de conducción?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 1 año
  answer: B
  explanation: La ley de Michigan exige que un adolescente mantenga una Licencia de
    Aprendiz de Nivel 1 por un mínimo de seis meses antes de poder realizar el examen
    de habilidades de conducción para una licencia de Nivel 2.
- id: 6
  category: license_system
  question: ¿Cuál es la concentración máxima de alcohol en sangre (BAC) permitida
    para un conductor menor de 21 años en Michigan bajo la ley de 'Tolerancia Cero'?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: La ley de Tolerancia Cero de Michigan para conductores menores de 21
    años prohíbe conducir con un BAC de 0.02% o superior, o cualquier presencia de
    alcohol en el cuerpo proveniente de su consumo.
- id: 7
  category: license_system
  question: ¿Cuántos puntos se añaden al historial de conducción de Michigan por Operar
    un vehículo bajo los efectos del alcohol o drogas (OWI)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: En Michigan, una condena por OWI (Operating While Intoxicated) resulta
    en la adición de 6 puntos al historial de conducción del conductor.
- id: 8
  category: license_system
  question: Si cambia su dirección dentro de Michigan, ¿dentro de cuántos días debe
    notificar al Secretario de Estado?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: Inmediatamente
  answer: D
  explanation: La ley de Michigan exige que notifique al Secretario de Estado inmediatamente
    cuando cambie su dirección. Esto puede hacerse en línea, por correo o en una oficina
    sucursal.
- id: 9
  category: license_system
  question: Bajo la ley de Consentimiento Implícito de Michigan, ¿cuál es la sanción
    por negarse por primera vez a realizar una prueba química (aliento, sangre u orina)?
  choices:
    A: Una multa de $100
    B: 6 puntos y la suspensión de la licencia por 1 año
    C: 2 puntos y una suspensión de 30 días
    D: Sin puntos, pero una suspensión obligatoria de 6 meses
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito de Michigan, si se niega a
    una prueba química por primera vez, se añaden 6 puntos a su historial y su licencia
    se suspende por un año.
- id: 10
  category: license_system
  question: ¿Cuántos puntos se asignan por una infracción de exceso de velocidad de
    1 a 10 mph sobre el límite legal en Michigan?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: En Michigan, conducir a un exceso de velocidad de 1 a 10 mph sobre
    el límite señalizado resulta en 2 puntos en su historial de conducción.
- id: 11
  category: license_system
  question: ¿A qué edad un conductor adolescente de Michigan obtiene automáticamente
    una Licencia Completa de Nivel 3 si ha cumplido con todos los requisitos?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: B
  explanation: Un adolescente es elegible para una Licencia Completa de Nivel 3 a
    los 17 años, siempre que haya tenido una licencia de Nivel 2 durante al menos
    seis meses y no haya tenido infracciones ni accidentes durante 12 meses consecutivos.
- id: 12
  category: license_system
  question: En Michigan, ¿cuántos puntos se asignan por 'Conducción descuidada' (Careless
    Driving)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: La conducción descuidada (Careless Driving) es una infracción de 3
    puntos en Michigan, mientras que la conducción temeraria (Reckless Driving) es
    una infracción de 6 puntos.
- id: 13
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para inscribirse en el Segmento
    2 de la Educación Vial de Michigan?
  choices:
    A: Tener una licencia de Nivel 1 durante al menos 3 meses
    B: Completar 30 horas de conducción, incluyendo 2 horas nocturnas
    C: Tanto A como B
    D: Tener una licencia de Nivel 1 durante 6 meses
  answer: C
  explanation: Para inscribirse en el Segmento 2, el estudiante debe haber tenido
    una Licencia de Aprendiz de Nivel 1 durante al menos 3 meses continuos y haber
    completado 30 horas de conducción (incluyendo 2 horas de noche).
- id: 14
  category: license_system
  question: ¿La ley 'Super Drunk' de Michigan se aplica a conductores con una concentración
    de alcohol en sangre (BAC) de qué nivel o superior?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.17%
  answer: D
  explanation: La ley de 'BAC alto' de Michigan, a menudo llamada ley 'Super Drunk',
    conlleva sanciones agravadas para los conductores con un BAC de 0.17% o superior.
- id: 15
  category: license_system
  question: ¿Qué tipo de seguro es obligatorio para todos los vehículos motorizados
    registrados en Michigan?
  choices:
    A: Seguro de colisión
    B: Seguro a todo riesgo (integral)
    C: Seguro sin culpa (No-fault)
    D: Cobertura de conductor sin seguro
  answer: C
  explanation: Michigan es un estado con seguro sin culpa (no-fault). Todos los vehículos
    registrados deben estar cubiertos por una póliza sin culpa que incluya el Seguro
    de Protección Personal (PIP), el Seguro de Protección de la Propiedad (PPI) y
    el Seguro de Responsabilidad Residual.
- id: 16
  category: license_system
  question: En Michigan, ¿cuántos puntos se añaden a su historial de conducción por
    una condena de 'Conducción temeraria' (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: D
  explanation: Según el Departamento de Estado de Michigan, la conducción temeraria
    (Reckless Driving) es una infracción mayor que resulta en la adición de 6 puntos
    al historial del conductor.
- id: 17
  category: license_system
  question: ¿Cuántos puntos se asignan en un historial de conducción de Michigan por
    'Carreras de aceleración' (Drag Racing)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 0 puntos, pero se revoca la licencia
  answer: B
  explanation: La ley de Michigan asigna 4 puntos al historial de un conductor por
    la infracción de carreras de aceleración (drag racing).
- id: 18
  category: license_system
  question: ¿A partir de qué límite de puntos se requiere que un conductor de Michigan
    se presente a un reexamen de conducir para determinar su aptitud para manejar?
  choices:
    A: 6 puntos
    B: 9 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: El Secretario de Estado de Michigan requiere que un conductor se presente
    a un reexamen si acumula 12 o más puntos en un periodo de dos años.
- id: 19
  category: license_system
  question: ¿Cuál es la duración del periodo de prueba (probatorio) para todos los
    nuevos conductores en Michigan, incluidos aquellos que se han graduado del programa
    GDL?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: D
  explanation: En Michigan, todos los conductores nuevos (independientemente de su
    edad) están en periodo de prueba durante al menos tres años.
- id: 20
  category: license_system
  question: Para obtener una licencia de conducir de Michigan que sea compatible con
    REAL ID, ¿cuántos documentos debe presentar para demostrar la residencia en Michigan?
  choices:
    A: Un documento
    B: Dos documentos
    C: Tres documentos
    D: No se requieren documentos si tiene una tarjeta de Seguro Social
  answer: B
  explanation: Michigan requiere dos documentos válidos (como una factura de servicios
    públicos o un estado de cuenta bancario) para demostrar la residencia en Michigan
    para una licencia compatible con REAL ID.
- id: 21
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar una licencia de chofer
    en el estado de Michigan?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: C
  explanation: Para ser elegible para una licencia de chofer de Michigan, el solicitante
    debe tener al menos 18 años de edad.
- id: 22
  category: license_system
  question: ¿Cuántos puntos se añaden al historial de conducción de Michigan por tener
    un recipiente de alcohol abierto en un vehículo?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: A
  explanation: Según la ley de Michigan, una condena por tener un recipiente de alcohol
    abierto en un vehículo resulta en 2 puntos en el historial del conductor.
- id: 23
  category: license_system
  question: ¿Cuánto tiempo permanecen los puntos en un historial de conducción de
    Michigan a partir de la fecha de la condena?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: Permanentemente
  answer: B
  explanation: En Michigan, los puntos por infracciones de tráfico permanecen en su
    historial de conducción durante dos años a partir de la fecha de la condena.
- id: 24
  category: license_system
  question: En Michigan, ¿cuántos puntos se asignan por huir o eludir a un oficial
    de policía?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Huir o eludir a un oficial de policía es una infracción grave que conlleva
    6 puntos en Michigan.
- id: 25
  category: license_system
  question: ¿Cuántos puntos se añaden a su historial de Michigan si no se detiene
    ante un autobús escolar?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: No detenerse ante un autobús escolar o ante un guardia de cruce escolar
    resulta en 3 puntos en el historial de conducción de Michigan.
- id: 26
  category: license_system
  question: Si un conductor menor de 21 años se niega a someterse a una prueba preliminar
    de aliento (PBT) en Michigan, ¿cuántos puntos se añaden a su historial?
  choices:
    A: 0 puntos
    B: 2 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: Mientras que la negativa a la PBT para adultos es una infracción civil
    sin puntos, la ley de Michigan añade específicamente 2 puntos al historial de
    un conductor menor de 21 años que se niega a una PBT.
- id: 27
  category: license_system
  question: ¿Cuál es la tarifa estándar para una renovación de cuatro años de una
    licencia de operador de Michigan (si se renueva a tiempo)?
  choices:
    A: $10
    B: $18
    C: $25
    D: $45
  answer: B
  explanation: La tarifa estándar de renovación para una licencia de operador de Michigan
    es de $18.
- id: 28
  category: license_system
  question: ¿Por cuántos años es válida normalmente una licencia de conducir estándar
    de Michigan?
  choices:
    A: 2 años
    B: 4 años
    C: 5 años
    D: 8 años
  answer: B
  explanation: Las licencias de conducir estándar de Michigan son válidas por hasta
    cuatro años y vencen en el cumpleaños del conductor.
- id: 29
  category: license_system
  question: ¿Cuántos puntos se asignan por conducir mientras su licencia está suspendida
    o revocada (DWLS) en Michigan?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: A
  explanation: Conducir mientras su licencia está suspendida o revocada (DWLS) resulta
    en la adición de 2 puntos a su historial de conducción de Michigan.
- id: 30
  category: driver_testing
  question: Para aprobar el examen de la vista para una licencia de conducir de Michigan,
    ¿cuál es la agudeza visual mínima requerida en al menos un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Michigan requiere una agudeza visual mínima de 20/40 en al menos un
    ojo para calificar para una licencia sin restricciones.
- id: 31
  category: driver_testing
  question: ¿Durante el examen de habilidades de conducción de Michigan, cuál de las
    siguientes situaciones resultará en una reprobación automática?
  choices:
    A: No usar la señal de giro una vez
    B: Conducir sobre el bordillo (curb) durante la maniobra de estacionamiento
    C: Una infracción de tráfico o un accidente en el que usted sea el culpable
    D: Ajustar sus espejos mientras el vehículo está en movimiento
  answer: C
  explanation: Según el Departamento de Estado de Michigan, cualquier infracción de
    tráfico, acción peligrosa o accidente con culpa durante el examen de carretera
    resulta en una reprobación automática.
- id: 32
  category: driver_testing
  question: Bajo la "Ley de Moverse a un Lado" (Move Over Law) de Michigan, ¿cuántos
    puntos se asignan por no ceder el paso o no reducir la velocidad ante un vehículo
    de emergencia estacionado con sus luces parpadeando?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: La ley de Michigan asigna 2 puntos por no mostrar el debido cuidado
    (moverse a un lado o reducir la velocidad) al acercarse a un vehículo de emergencia
    estacionado.
- id: 33
  category: driver_testing
  question: A partir de la ley de manos libres de 2023 de Michigan, ¿cuál es la multa
    por una primera infracción por sujetar o usar un dispositivo móvil mientras se
    conduce?
  choices:
    A: $50
    B: $100 o 16 horas de servicio comunitario
    C: $500 y suspensión de la licencia
  answer: B
  explanation: La ley de manos libres de Michigan (vigente desde junio de 2023) establece
    una multa de $100 o 16 horas de servicio comunitario por una primera infracción.
- id: 34
  category: driver_testing
  question: ¿Cuántos puntos se añaden al historial de conducción de Michigan por una
    infracción de exceso de velocidad de 11 a 15 mph sobre el límite establecido?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: El sistema de puntos de Michigan asigna 3 puntos por conducir a un
    exceso de velocidad de 11 a 15 mph sobre el límite legal.
- id: 35
  category: driver_testing
  question: En Michigan, ¿cuántos puntos se asignan por no detenerse ante un autobús
    escolar con sus luces rojas parpadeando?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: No detenerse ante un autobús escolar en Michigan resulta en la adición
    de 3 puntos al historial del conductor.
- id: 36
  category: driver_testing
  question: ¿Cuándo vence normalmente el registro de un vehículo (placa/matrícula)
    en Michigan?
  choices:
    A: El 31 de diciembre de cada año
    B: En el cumpleaños del propietario
    C: Exactamente un año después de la fecha de compra
    D: El último día del mes en que se compró el vehículo
  answer: B
  explanation: En Michigan, los registros de vehículos para individuos vencen en el
    cumpleaños del propietario.
- id: 37
  category: driver_testing
  question: Si se requiere que un conductor de Michigan asista a un reexamen de conducción
    pero no se presenta, ¿cuál es la consecuencia inmediata?
  choices:
    A: Una multa de $500
    B: Una sentencia de cárcel obligatoria de 10 días
    C: Suspensión de la licencia hasta que el conductor se presente
    D: Los puntos del conductor se duplican
  answer: C
  explanation: Si no se presenta a un reexamen de conducción programado en Michigan,
    su licencia será suspendida hasta que asista a la audiencia.
- id: 38
  category: driver_testing
  question: Bajo la ley de Tolerancia Cero de Michigan, ¿cuál es la sanción para un
    conductor menor de 21 años que se niega a una prueba preliminar de aliento (PBT)?
  choices:
    A: 1 punto en el historial de conducción
    B: 2 puntos en el historial de conducción
    C: Revocación inmediata de la licencia por 1 año
    D: Sin puntos, pero una multa de $500
  answer: B
  explanation: Un conductor menor de 21 años que se niega a una PBT recibirá 2 puntos
    en su historial de conducción, ya que se considera una infracción civil.
- id: 39
  category: driver_testing
  question: ¿Cuál es la edad mínima que debe tener un adolescente para inscribirse
    en el Segmento 1 de un curso de educación vial en Michigan?
  choices:
    A: 14 años
    B: 14 años y 8 meses
    C: 14 años y 9 meses
    D: 15 años
  answer: B
  explanation: La ley de Michigan exige que un estudiante tenga al menos 14 años y
    8 meses para comenzar el Segmento 1 de educación vial.
- id: 40
  category: driver_testing
  question: En Michigan, ¿cuall es el límite de velocidad en una zona de obras en
    la carretera donde un carril está cerrado, a menos que se indique lo contrario?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: La ley de Michigan establece un límite de velocidad de 45 mph en las
    zonas de obras en carreteras donde un carril está cerrado, a menos que se indique
    un límite de velocidad diferente.
- id: 41
  category: driver_testing
  question: Al comprar un vehículo en una venta privada, ¿cuántos días tiene el comprador
    para transferir el título a su nombre en Michigan?
  choices:
    A: 7 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: En Michigan, el comprador de un vehículo debe solicitar un nuevo título
    en una oficina de la Secretaría de Estado (Secretary of State) dentro de los 15
    días posteriores a la fecha de compra.
- id: 42
  category: driver_testing
  question: ¿Cuántos puntos se asignan por no ceder el paso a un vehículo de emergencia
    en Michigan?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: A
  explanation: No ceder el paso a un vehículo de emergencia resulta en 2 puntos en
    el historial de conducción de Michigan.
- id: 43
  category: driver_testing
  question: Al presentarse para un examen de habilidades de conducción en Michigan,
    ¿qué documentos se deben proporcionar para el vehículo que se utilizará?
  choices:
    A: El título del vehículo y un registro de mantenimiento
    B: Registro válido del vehículo y comprobante de seguro sin culpa de Michigan
      (Michigan No-Fault insurance)
    C: El manual del propietario y una factura de venta
    D: Solo una licencia de conducir válida del adulto acompañante
  answer: B
  explanation: La ley de Michigan exige que cualquier vehículo utilizado para un examen
    de habilidades de conducción debe tener un registro válido y un comprobante vigente
    de seguro sin culpa de Michigan (Michigan No-Fault insurance).
- id: 44
  category: driver_testing
  question: En Michigan, ¿cuál es el límite de velocidad predeterminado dentro de
    un parque de casas móviles a menos que se indique lo contrario?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Según el Código de Vehículos de Michigan (MCL 257.627), el límite de
    velocidad en un parque de casas móviles es de 15 mph.
- id: 45
  category: driver_testing
  question: 'En Michigan, debe informar de inmediato un accidente de tráfico a la
    policía si este resulta en lesiones, muerte o daños a la propiedad de al menos:'
  choices:
    A: $400
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: La ley de Michigan exige que los conductores informen los accidentes
    a la policía si hay una lesión, una fatalidad o si los daños a la propiedad parecen
    ser de $1,000 o más.
- id: 46
  category: driver_testing
  question: En Michigan, ¿es ilegal estacionarse a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Michigan prohíbe estacionar un vehículo a menos de 15 pies
    de un hidrante de incendios.
- id: 47
  category: driver_testing
  question: Si reprueba el examen de habilidades de conducción de Michigan, ¿cuánto
    tiempo debe esperar antes de ser elegible para intentar el examen nuevamente?
  choices:
    A: 24 horas
    B: 48 horas
    C: 7 días
    D: 30 días
  answer: A
  explanation: Las regulaciones de Michigan exigen un período de espera mínimo de
    24 horas antes de que un conductor pueda volver a realizar un examen de habilidades
    de conducción reprobado.
- id: 48
  category: driver_testing
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    las autopistas y caminos rurales pavimentados de Michigan?
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 70 mph
  answer: B
  explanation: En Michigan, el límite de velocidad predeterminado en autopistas y
    caminos rurales pavimentados es de 55 mph, a menos que las señales indiquen lo
    contrario.
- id: 49
  category: driver_responsibility
  question: 'Conducir un vehículo en Michigan sin un seguro sin culpa (no-fault insurance)
    válido es un:'
  choices:
    A: Infracción civil sin multa
    B: Delito grave (Felony)
    C: Delito menor (Misdemeanor)
    D: Infracción menor que no aparece en el historial de conducción
  answer: C
  explanation: En Michigan, conducir sin seguro es un delito menor (misdemeanor).
    Los conductores condenados pueden enfrentar multas, tiempo en la cárcel y la suspensión
    de la licencia de conducir.
- id: 50
  category: driver_responsibility
  question: Según la ley de Seguro Sin Culpa (No-Fault Insurance) de Michigan, ¿qué
    parte de la póliza paga sus gastos médicos si resulta herido en un accidente automovilístico?
  choices:
    A: Protección de la propiedad (PPI)
    B: Protección contra lesiones personales (PIP)
    C: Seguro de responsabilidad residual
    D: Cobertura de colisión
  answer: B
  explanation: La Protección contra lesiones personales (PIP) es el componente del
    seguro sin culpa de Michigan que paga los costos médicos, los salarios perdidos
    y los servicios de reemplazo si usted resulta herido en un accidente automovilístico.
- id: 51
  category: driver_responsibility
  question: Cuando compra un vehículo a un particular (venta privada) en Michigan,
    ¿dentro de cuántos días debe transferir el título?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: La ley de Michigan exige que el título de un vehículo se transfiera
    dentro de los 15 días posteriores a la fecha de compra para evitar un cargo por
    pago atrasado.
- id: 52
  category: driver_responsibility
  question: En Michigan, cuando vende su automóvil, ¿qué debe hacer con la placa (matrícula)?
  choices:
    A: Dejarla en el auto para el nuevo dueño
    B: Devolverla a la Secretaría de Estado inmediatamente
    C: Conservar la placa para su próximo vehículo o destruirla
    D: Entregarla a la policía para su eliminación
  answer: C
  explanation: En Michigan, las placas pertenecen al propietario, no al vehículo.
    Cuando se vende un vehículo, el propietario debe quitar la placa y puede transferirla
    a otro vehículo de su propiedad.
- id: 53
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan a su historial de manejo de Michigan por no
    ceder el paso a un vehículo de emergencia (Ley de Moverse a un Lado o Move Over
    Law)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: A
  explanation: No ceder el paso a un vehículo de emergencia autorizado, o no moverse
    a un lado/reducir la velocidad ante un vehículo de emergencia estacionado con
    las luces intermitentes, resulta en 2 puntos en su historial de manejo de Michigan.
- id: 54
  category: driver_responsibility
  question: En Michigan, si es declarado culpable de una infracción de tránsito en
    una zona de obras cuando hay trabajadores presentes, ¿qué sucede con la multa?
  choices:
    A: Se exonera para quienes cometen la infracción por primera vez
    B: Se duplica
    C: Se triplica
    D: Se incrementa con una tarifa fija de $500
  answer: B
  explanation: La ley de Michigan dicta que las multas de tránsito se duplican por
    infracciones cometidas en zonas de obras cuando hay trabajadores presentes.
- id: 55
  category: driver_responsibility
  question: El 'Seguro de Protección de Propiedad' (PPI) de Michigan cubre hasta cuánto
    en daños que su vehículo cause a la propiedad de otras personas (como edificios
    o vehículos correctamente estacionados) dentro del estado?
  choices:
    A: $10,000
    B: $50,000
    C: $100,000
    D: $1,000,000
  answer: D
  explanation: El PPI paga hasta $1 millón por los daños que su vehículo cause en
    Michigan a la propiedad de otras personas, como edificios y cercas, y a vehículos
    correctamente estacionados.
- id: 56
  category: driver_responsibility
  question: Para la mayoría de los vehículos de pasajeros en Michigan, ¿cuándo vence
    el registro del vehículo (placa)?
  choices:
    A: El 31 de diciembre de cada año
    B: El día del cumpleaños del propietario
    C: Exactamente un año después de la fecha de compra
    D: El último día del mes en que fue emitido
  answer: B
  explanation: En Michigan, los registros de vehículos para individuos vencen el día
    del cumpleaños del propietario.
- id: 57
  category: driver_responsibility
  question: 'Si usted es residente de Michigan y posee un automóvil, debe tener un
    ''Seguro de Responsabilidad Residual'' para cubrir:'
  choices:
    A: Sus propias facturas médicas
    B: Daños a su propio auto si usted tiene la culpa
    C: Demandas legales si es demandado a causa de un accidente
    D: Robo o vandalismo del vehículo
  answer: C
  explanation: El Seguro de Responsabilidad Residual lo protege de ser demandado si
    se ve involucrado en un accidente que cause lesiones graves, la muerte o ciertos
    tipos de daños a la propiedad.
- id: 58
  category: driver_responsibility
  question: Si un conductor de Michigan menor de 21 años es condenado bajo la ley
    de 'Tolerancia Cero' (Zero Tolerance) por tener cualquier contenido de alcohol
    en el cuerpo, ¿cuántos puntos se agregan a su historial?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 0 puntos
  answer: B
  explanation: Una condena para una persona menor de 21 años con cualquier contenido
    de alcohol en el cuerpo (Tolerancia Cero) resulta en 4 puntos en el historial
    de manejo.
- id: 59
  category: driver_responsibility
  question: Si se ve involucrado en un accidente en Michigan y no se detiene en la
    escena (Chocar y Huir / Hit and Run) donde ocurrió una lesión, ¿cuántos puntos
    se agregan a su historial?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: No detenerse y no revelar su identidad en la escena de un accidente
    donde ocurrió una lesión personal o la muerte es una infracción grave que conlleva
    6 puntos.
- id: 60
  category: driver_responsibility
  question: 'En Michigan, una persona que se niega a una Prueba Preliminar de Aliento
    (PBT) solicitada por un oficial de policía por primera vez está sujeta a:'
  choices:
    A: Una suspensión de la licencia por 6 meses
    B: Una infracción civil y una multa
    C: Cárcel automática de 48 horas
    D: 6 puntos en su historial
  answer: B
  explanation: Negarse a una Prueba Preliminar de Aliento (PBT) en la carretera es
    una infracción civil. Esto es diferente a negarse a una prueba química en la estación
    de policía, lo cual se rige bajo la ley de Consentimiento Implícito.
- id: 61
  category: driver_responsibility
  question: ¿Bajo el seguro sin culpa de Michigan (No-Fault insurance), cuánto paga
    el Seguro de Protección de Propiedad (PPI) por los daños que su vehículo cause
    a una propiedad fija (como edificios o cercas) dentro del estado?
  choices:
    A: $50,000
    B: $100,000
    C: $500,000
    D: $1 millón
  answer: D
  explanation: El seguro sin culpa de Michigan incluye el Seguro de Protección de
    Propiedad (PPI), el cual proporciona hasta $1 millón en cobertura por daños que
    su vehículo cause a la propiedad de otras personas (como edificios, cercas y vehículos
    estacionados correctamente) en Michigan.
- id: 62
  category: driver_responsibility
  question: A partir de julio de 2020, ¿cuáles son los límites predeterminados del
    seguro de responsabilidad civil residual de Michigan por lesiones corporales o
    muerte de una persona en un accidente?
  choices:
    A: $20,000
    B: $50,000
    C: $100,000
    D: $250,000
  answer: D
  explanation: A partir del 2 de julio de 2020, la ley de Michigan estableció los
    límites de responsabilidad residual predeterminados en $250,000 por lesiones corporales
    o muerte de una persona en cualquier accidente, aunque los conductores pueden
    optar por comprar límites más bajos de hasta $50,000.
- id: 63
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al comprobante
    de seguro durante una parada de tráfico en Michigan?
  choices:
    A: Solo un certificado en papel es legalmente válido
    B: Los conductores pueden mostrar una copia electrónica de su certificado de seguro
      en un dispositivo móvil
    C: El seguro se verifica automáticamente por la computadora de la policía, por
      lo que no se necesita comprobante
    D: Los conductores tienen 48 horas para llevar una copia en papel a la estación
      de policía
  answer: B
  explanation: La ley de Michigan permite a los conductores proporcionar un comprobante
    de seguro a un oficial de la ley al mostrar una copia electrónica del certificado
    en un teléfono inteligente u otro dispositivo electrónico.
- id: 64
  category: driver_responsibility
  question: Cuando se vende un vehículo en Michigan, ¿dentro de cuántos días debe
    el comprador solicitar un nuevo título a su nombre?
  choices:
    A: 7 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: La Secretaría de Estado de Michigan requiere que el comprador de un
    vehículo solicite la transferencia del título dentro de los 15 días posteriores
    a la fecha de venta para evitar cargos por mora.
- id: 65
  category: driver_responsibility
  question: Si usted golpea y mata o lesiona a un animal doméstico en Michigan y no
    puede encontrar al dueño, ¿cuál es su responsabilidad legal?
  choices:
    A: Usted no tiene ninguna responsabilidad legal por los animales
    B: Debe dejar una nota en la casa más cercana
    C: Debe reportar el accidente a la policía
    D: Debe llevar al animal al veterinario más cercano
  answer: C
  explanation: La ley de Michigan establece que si golpea a un animal doméstico, debe
    intentar encontrar al dueño. Si no se puede encontrar al dueño, debe reportar
    el accidente a la policía.
- id: 66
  category: driver_responsibility
  question: En Michigan, ¿qué símbolo se coloca en su licencia de conducir para indicar
    que se ha unido al Registro de Donantes de Órganos del estado?
  choices:
    A: Una cruz roja
    B: Una hoja verde
    C: Un corazón con el logotipo de 'donors'
    D: Una estrella azul
  answer: C
  explanation: Cuando se une al Registro de Donantes de Órganos de Michigan, se coloca
    un símbolo de corazón en su licencia de conducir o tarjeta de identificación estatal
    para indicar su decisión.
- id: 67
  category: safe_driving_rules
  question: Según la ley de Michigan, ¿cuándo es legal girar a la izquierda con luz
    roja?
  choices:
    A: Nunca, los giros a la izquierda en rojo siempre están prohibidos.
    B: Solo cuando se gira desde una calle de un solo sentido hacia otra calle de
      un solo sentido.
    C: Al girar desde una calle de uno o dos sentidos hacia una calle de un solo sentido
      en la dirección del tráfico.
    D: Solo durante situaciones de emergencia.
  answer: C
  explanation: En Michigan, puede girar a la izquierda con luz roja al girar desde
    una calle de uno o dos sentidos hacia una calle de un solo sentido que vaya hacia
    la izquierda, después de detenerse por completo y ceder el paso al tráfico y a
    los peatones.
- id: 68
  category: safe_driving_rules
  question: Cuando un autobús escolar se detiene con sus luces rojas intermitentes
    encendidas y el brazo de parada extendido, ¿a qué distancia mínima del autobús
    requiere la ley de Michigan que se detengan los conductores?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: C
  explanation: La ley de Michigan exige que los conductores se detengan al menos a
    20 pies de un autobús escolar que tenga sus luces rojas intermitentes encendidas
    y el brazo de parada extendido.
- id: 69
  category: safe_driving_rules
  question: 'De acuerdo con la ley de ''hacerse a un lado'' (Move Over law) de Michigan,
    si se aproxima a un vehículo de emergencia estacionado con sus luces intermitentes
    encendidas y no puede cambiarse de carril de manera segura, usted debe:'
  choices:
    A: Mantener su velocidad pero tocar la bocina.
    B: Detenerse por completo hasta que el vehículo de emergencia se retire.
    C: Reducir su velocidad a al menos 10 mph por debajo del límite de velocidad indicado.
    D: Aumentar la velocidad para pasar el vehículo lo más rápido posible.
  answer: C
  explanation: Si no puede cambiarse de carril de manera segura para un vehículo de
    emergencia, la ley de Michigan le exige reducir la velocidad a al menos 10 mph
    por debajo del límite de velocidad indicado y pasar con precaución.
- id: 70
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad no señalizado en las zonas de obras de
    Michigan donde hay trabajadores presentes, a menos que otros letreros indiquen
    lo contrario?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: En Michigan, el límite de velocidad en una zona de obras en la carretera
    es de 45 mph donde hay trabajadores presentes, a menos que se indique lo contrario.
- id: 71
  category: safe_driving_rules
  question: 'Al realizar un "Giro a la izquierda de Michigan" (Michigan Left, un giro
    en U usando un cruce de mediana), generalmente debe:'
  choices:
    A: Girar a la derecha y luego inmediatamente a la izquierda a través de todos
      los carriles.
    B: Seguir recto por la intersección y luego usar el cruce designado para dar la
      vuelta.
    C: Esperar en medio de la intersección y girar cuando esté despejado.
    D: Solo realizar el giro si hay un oficial de policía presente.
  answer: B
  explanation: Un "Giro a la izquierda de Michigan" implica conducir a través de una
    intersección o girar a la derecha en ella, y luego usar un cruce de mediana para
    completar la maniobra de giro en U o giro a la izquierda.
- id: 72
  category: safe_driving_rules
  question: En Michigan, ¿está prohibido estacionar a menos de cuántos pies de una
    señal de alto, una baliza intermitente o una señal de control de tráfico?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Michigan establece que no se puede estacionar a menos de
    30 pies de cualquier baliza intermitente, señal de alto o señal de control de
    tráfico ubicada al costado de una carretera.
- id: 73
  category: safe_driving_rules
  question: Al rebasar a un ciclista en Michigan, ¿cuál es la distancia mínima legal
    que debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Michigan exige que los automovilistas dejen al menos 3 pies
    de espacio al rebasar a un ciclista.
- id: 74
  category: safe_driving_rules
  question: 'Al entrar en una glorieta (roundabout) de varios carriles en Michigan,
    debe ceder el paso al tráfico en:'
  choices:
    A: Solo el carril derecho.
    B: Solo el carril izquierdo.
    C: Ambos carriles de la glorieta.
    D: Solo los vehículos que están saliendo.
  answer: C
  explanation: Al entrar en una glorieta de varios carriles, debe ceder el paso a
    los vehículos en todos los carriles de la glorieta, no solo en el carril más cercano
    a usted.
- id: 75
  category: safe_driving_rules
  question: 'La ley de Michigan exige que encienda los faros delanteros desde:'
  choices:
    A: El atardecer hasta el amanecer.
    B: Una hora después del atardecer hasta una hora antes del amanecer.
    C: 30 minutos después del atardecer hasta 30 minutos antes del amanecer.
    D: Siempre que esté nublado.
  answer: C
  explanation: Los faros delanteros deben encenderse desde media hora después del
    atardecer hasta media hora antes del amanecer, y en cualquier momento en que la
    visibilidad sea inferior a 500 pies.
- id: 76
  category: safe_driving_rules
  question: ¿A qué velocidad puede comenzar el hidroplaneo (donde los neumáticos pierden
    contacto con la carretera y flotan sobre una capa de agua) en las condiciones
    climáticas de Michigan?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Según el manual del conductor de Michigan, el hidroplaneo puede comenzar
    a velocidades tan bajas como 35 mph bajo lluvia intensa.
- id: 77
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada para la mayoría de las
    condiciones de conducción en Michigan?
  choices:
    A: El largo de 1 vehículo por cada 10 mph.
    B: 2 segundos.
    C: 3 a 4 segundos.
    D: 50 pies.
  answer: C
  explanation: El Secretario de Estado de Michigan recomienda una distancia de seguimiento
    de 3 a 4 segundos en condiciones normales de conducción.
- id: 78
  category: safe_driving_rules
  question: En Michigan, ¿debe bajar las luces altas de sus faros cuando se encuentre
    a cuántos pies de un vehículo que viene en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Michigan exige que baje las luces altas cuando se encuentre
    a menos de 500 pies de un vehículo que viene en sentido contrario.
- id: 79
  category: safe_driving_rules
  question: En Michigan, ¿cuál es el límite de velocidad máximo para vehículos en
    un parque de casas móviles?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Según el Código de Vehículos de Michigan, el límite de velocidad dentro
    de los parques de casas móviles es de 15 mph.
- id: 80
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    caminos no pavimentados (de grava) en Michigan?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: En Michigan, el límite de velocidad general para caminos de grava sin
    señalización es de 55 mph, aunque los conductores siempre deben ajustarse a las
    condiciones.
- id: 81
  category: safe_driving_rules
  question: En Michigan, ¿cuándo se le permite girar a la izquierda con luz roja?
  choices:
    A: Nunca
    B: Solo cuando se gira desde una calle de sentido único hacia otra calle de sentido
      único
    C: Desde una calle de doble sentido hacia una calle de sentido único
    D: Desde una calle de sentido único hacia una calle de sentido único o de doble
      sentido
  answer: B
  explanation: La ley de Michigan permite girar a la izquierda en rojo solo cuando
    se gira de una calle de sentido único a otra calle de sentido único, después de
    detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 82
  category: safe_driving_rules
  question: Bajo la ley de 'Move Over' (Hacerse a un lado) de Michigan, si no puede
    cambiarse de carril de manera segura ante un vehículo de emergencia con luces
    intermitentes, ¿qué debe hacer?
  choices:
    A: Mantener la velocidad pero tocar la bocina
    B: Detenerse inmediatamente en su carril
    C: Reducir la velocidad al menos 10 mph por debajo del límite de velocidad indicado
    D: Aumentar la velocidad para rebasar el vehículo rápidamente
  answer: C
  explanation: Si no puede cambiarse de carril de manera segura para un vehículo de
    emergencia, de mantenimiento o de servicios públicos, la ley de Michigan exige
    que reduzca la velocidad al menos 10 mph por debajo del límite de velocidad indicado.
- id: 83
  category: safe_driving_rules
  question: Cuando un autobús escolar tiene sus luces rojas intermitentes y el brazo
    de parada extendido, ¿a cuántos pies de distancia debe detener su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: C
  explanation: La ley de Michigan exige que los conductores se detengan al menos a
    20 pies de un autobús escolar cuando este tiene sus luces rojas intermitentes
    y el brazo de parada extendido.
- id: 84
  category: safe_driving_rules
  question: Bajo la 'Ley de Andy' (Andy's Law) de Michigan, ¿cuál es la pena máxima
    por lesionar a un trabajador en una zona de construcción?
  choices:
    A: Una multa de $500 y 90 días de cárcel
    B: Una multa de $1,000 y 1 año de cárcel
    C: Una multa de $7,500 y 15 años de prisión
    D: Una multa de $5,000 y 1 año de cárcel
  answer: D
  explanation: La Ley de Andy establece una multa de hasta $5,000 y hasta un año de
    cárcel por lesionar a un trabajador en una zona de construcción. Si un trabajador
    muere, la pena aumenta a una multa de $7,500 y hasta 15 años de prisión.
- id: 85
  category: safe_driving_rules
  question: ¿Cuál es el propósito de un giro a la izquierda estilo Michigan ('Michigan
    Left')?
  choices:
    A: Permitir que los conductores giren a la izquierda directamente a través de
      varios carriles de tráfico
    B: Reducir accidentes al obligar a los conductores a pasar una intersección y
      hacer un giro en U en una apertura designada de la mediana
    C: Permitir giros a la izquierda en rojo desde cualquier carril
    D: Dar prioridad a los vehículos que giran a la izquierda sobre el tráfico que
      viene en sentido contrario
  answer: B
  explanation: El 'Michigan Left' está diseñado para mejorar el flujo del tráfico
    y la seguridad al evitar giros directos a la izquierda en intersecciones concurridas,
    requiriendo en su lugar que los conductores realicen un giro en U en un cruce
    de la mediana.
- id: 86
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad mínima en las autopistas de Michigan,
    a menos que se indique lo contrario?
  choices:
    A: 40 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: B
  explanation: En las autopistas de Michigan, el límite de velocidad mínima es de
    45 mph, a menos que el clima o las condiciones de la carretera hagan que sea inseguro
    conducir a esa velocidad.
- id: 87
  category: safe_driving_rules
  question: En Michigan, ¿con cuántos pies de antelación debe activar su señal de
    giro antes de virar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Michigan exige que los conductores indiquen su intención
    de girar al menos 100 pies antes de realizar el giro.
- id: 88
  category: safe_driving_rules
  question: Al detenerse en un cruce de ferrocarril con las barreras bajadas o luces
    intermitentes, ¿dentro de qué distancia del riel más cercano debe detener su vehículo?
  choices:
    A: De 5 a 25 pies
    B: De 10 a 30 pies
    C: De 15 a 50 pies
    D: De 20 a 60 pies
  answer: C
  explanation: La ley de Michigan exige que los conductores se detengan entre 15 y
    50 pies del riel más cercano en un cruce de ferrocarril cuando las señales indican
    que se aproxima un tren.
- id: 89
  category: defensive_driving
  question: Según el manual de Michigan 'Lo que cada conductor debe saber', ¿cuál
    es la distancia de seguimiento recomendada detrás del vehículo que va delante
    de usted bajo condiciones ideales?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: De 3 a 4 segundos
    D: Al menos 6 segundos
  answer: C
  explanation: El manual oficial del conductor de Michigan recomienda una distancia
    de seguimiento de 3 a 4 segundos para permitir suficiente tiempo para reaccionar
    ante peligros bajo condiciones ideales.
- id: 90
  category: defensive_driving
  question: En Michigan, ¿con cuánta anticipación debe observar la carretera para
    identificar posibles peligros al conducir en la ciudad?
  choices:
    A: 5 segundos
    B: 12 segundos
    C: 25 segundos
    D: Una cuadra completa
  answer: B
  explanation: Las pautas de conducción defensiva de Michigan sugieren observar al
    menos 12 segundos por delante de su vehículo para anticipar el flujo del tráfico
    y los peligros.
- id: 91
  category: defensive_driving
  question: 'Según la ley de Michigan, debe encender los faros delanteros si no puede
    ver claramente a personas o vehículos en la carretera a una distancia de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Michigan (MCL 257.684) exige que los faros estén encendidos
    desde media hora después de la puesta del sol hasta media hora antes de la salida
    del sol, o siempre que la visibilidad se reduzca a 500 pies o menos.
- id: 92
  category: defensive_driving
  question: 'En Michigan, debe atenuar las luces altas (cambiar a luces bajas) cuando
    siga a otro vehículo a una distancia de:'
  choices:
    A: 200 pies
    B: 350 pies
    C: 500 pies
    D: 800 pies
  answer: C
  explanation: El manual del conductor de Michigan establece que debe atenuar las
    luces altas cuando se encuentre a menos de 500 pies del vehículo que tiene delante.
- id: 93
  category: defensive_driving
  question: 'La ley ''Move Over'' (hacerse a un lado) de Michigan exige que los conductores
    se cambien de carril o reduzcan la velocidad ante vehículos de emergencia detenidos.
    Si no puede cambiarse de carril, debe reducir la velocidad a:'
  choices:
    A: El límite de velocidad indicado
    B: 10 mph por debajo del límite de velocidad indicado
    C: 20 mph por debajo del límite de velocidad indicado
    D: Una parada completa
  answer: B
  explanation: La ley de Michigan exige que los conductores despejen el carril más
    cercano a los vehículos de emergencia detenidos con las luces intermitentes encendidas.
    Si no es seguro cambiarse de carril, debe reducir la velocidad al menos 10 mph
    por debajo del límite de velocidad indicado.
- id: 94
  category: defensive_driving
  question: El hidroplaneo (hydroplaning) puede ocurrir en las carreteras de Michigan
    durante lluvias intensas. ¿A qué velocidad pueden los neumáticos perder todo contacto
    con la superficie de la carretera?
  choices:
    A: 25 mph
    B: 35 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: Aunque el hidroplaneo puede comenzar a velocidades más bajas (alrededor
    de 35 mph), el manual de Michigan señala que a 55 mph, los neumáticos pueden perder
    por completo todo contacto con la carretera.
- id: 95
  category: defensive_driving
  question: 'Michigan tiene una alta tasa de choques entre vehículos y ciervos. Si
    un ciervo salta frente a su automóvil, la recomendación oficial del estado es:'
  choices:
    A: Dar un volantazo rápido hacia la izquierda
    B: Dar un volantazo rápido hacia la derecha
    C: Frenar firmemente pero no dar un volantazo
    D: Acelerar para minimizar el impacto
  answer: C
  explanation: Los funcionarios de seguridad de Michigan aconsejan a los conductores
    'frenar y permanecer en su carril'. Dar un volantazo puede causar un choque más
    grave con otro vehículo o un objeto fijo como un árbol.
- id: 96
  category: defensive_driving
  question: Al conducir con niebla densa en Michigan, ¿qué ajuste de luces debe utilizar?
  choices:
    A: Luces altas (faros de largo alcance)
    B: Luces bajas (faros de corto alcance)
    C: Solo las luces de estacionamiento
    D: Solo las luces de emergencia (intermitentes)
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en las gotas de niebla, creando un efecto de 'pared blanca' y reduciendo
    aún más la visibilidad.
- id: 97
  category: defensive_driving
  question: En Michigan, ¿cuál de los siguientes elementos es un requisito legal limpiar
    de su vehículo antes de conducir en invierno?
  choices:
    A: Solo el lado del conductor del parabrisas
    B: Solo el parabrisas y las ventanas laterales delanteras
    C: Todas las ventanas, incluyendo la luneta trasera y los espejos laterales
    D: Solo los faros delanteros y las luces traseras
  answer: C
  explanation: La ley de Michigan exige que la visión del conductor no esté obstruida.
    Debe limpiar la nieve y el hielo de todas las ventanas para garantizar un campo
    de visión completo.
- id: 98
  category: defensive_driving
  question: Cuando las temperaturas están cerca del punto de congelación, ¿cuál de
    las siguientes superficies de las carreteras de Michigan es probable que se congele
    primero?
  choices:
    A: Caminos de grava
    B: Autopistas de asfalto
    C: Puentes y pasos elevados
    D: Intersecciones con semáforos
  answer: C
  explanation: Los puentes y pasos elevados se congelan antes que otras superficies
    de la carretera porque el aire frío circula tanto por encima como por debajo de
    la plataforma de la carretera.
- id: 99
  category: defensive_driving
  question: 'Para evitar una colisión con un vehículo en su punto ciego al cambiar
    de carril en Michigan, debe:'
  choices:
    A: Revisar solo el espejo retrovisor
    B: Revisar solo los espejos laterales
    C: Girar la cabeza y mirar por encima del hombro
    D: Tocar la bocina antes de moverse
  answer: C
  explanation: Los espejos no lo muestran todo. Es necesario mirar por encima del
    hombro para ver los vehículos en los 'puntos ciegos' que no cubren los espejos.
- id: 100
  category: defensive_driving
  question: 'Si su vehículo comienza a derrapar en una carretera resbaladiza de Michigan,
    debe:'
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar el volante en la dirección opuesta al derrape
    C: Girar el volante en la dirección en la que desea que vaya el vehículo
    D: Poner el vehículo en punto muerto (neutral)
  answer: C
  explanation: Si derrapa, quite el pie del acelerador y gire en la dirección en la
    que desea que vaya la parte delantera del vehículo. Esto a menudo se describe
    como 'girar hacia el derrape'.
- id: 101
  category: defensive_driving
  question: 'La distancia total de parada es la suma de la distancia de percepción,
    la distancia de reacción y la distancia de frenado. A 55 mph, la distancia total
    de parada de un vehículo promedio es aproximadamente:'
  choices:
    A: 100 pies
    B: 150 pies
    C: 290 pies
    D: 500 pies
  answer: C
  explanation: Según el manual del conductor de Michigan, a 55 mph, se necesitan unos
    290 pies para detenerse por completo (aproximadamente la longitud de un campo
    de fútbol americano).
- id: 102
  category: defensive_driving
  question: Para mantener una "búsqueda visual" adecuada mientras conduce en Michigan,
    ¿con cuánta anticipación debe mirar hacia adelante para identificar posibles problemas?
  choices:
    A: 5 segundos
    B: 12 segundos
    C: 20 segundos
    D: 30 segundos
  answer: B
  explanation: El manual de conducción de Michigan instruye a los conductores a mirar
    al menos 12 segundos por delante de su vehículo para anticipar el flujo del tráfico
    y los peligros.
- id: 103
  category: defensive_driving
  question: En Michigan, ¿a qué velocidad puede comenzar a ocurrir el hidroplaneo
    (hydroplaning) en carreteras mojadas?
  choices:
    A: Tan baja como 20 mph
    B: Tan baja como 35 mph
    C: Solo por encima de 55 mph
    D: Solo por encima de 70 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph bajo
    lluvia intensa. A 55 mph, los neumáticos pueden perder todo contacto con la carretera.
- id: 104
  category: defensive_driving
  question: Al seguir a otro vehículo por la noche en Michigan, ¿a cuántos pies del
    vehículo que va delante debe bajar las luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 800 pies
  answer: C
  explanation: La ley de Michigan exige que los conductores bajen sus luces altas
    cuando sigan a otro vehículo a menos de 500 pies para evitar cegar al conductor
    de adelante.
- id: 105
  category: defensive_driving
  question: La "Ley de Moverse a un Lado" (Move Over Law) de Michigan exige que los
    conductores se cambien a un carril alejado de los vehículos de emergencia estacionados
    con las luces intermitentes encendidas. Si no es posible cambiarse de carril,
    ¿qué debe hacer el conductor?
  choices:
    A: Mantener la velocidad pero tocar la bocina
    B: Reducir la velocidad al menos 10 mph por debajo del límite de velocidad indicado
    C: Detenerse por completo hasta que se le indique pasar
    D: Aumentar la velocidad para pasar el área rápidamente
  answer: B
  explanation: Según la ley de Michigan (MCL 257.653a), si no puede cambiarse de carril
    para un vehículo de emergencia autorizado, debe reducir la velocidad al menos
    10 mph por debajo del límite de velocidad indicado y proceder con precaución.
- id: 106
  category: defensive_driving
  question: Michigan tiene una gran población de ciervos. Si un ciervo salta frente
    a su vehículo, ¿cuál es la acción defensiva más segura?
  choices:
    A: Virar bruscamente hacia el otro carril
    B: Virar hacia el acotamiento de la carretera
    C: Frenar firmemente pero no virar bruscamente
    D: Aumentar la velocidad para minimizar el impacto
  answer: C
  explanation: 'Los expertos en seguridad de Michigan aconsejan a los conductores:
    "Frene, manténgase en su carril y no vire bruscamente". Virar bruscamente puede
    provocar colisiones frontales más graves o volcaduras.'
- id: 107
  category: defensive_driving
  question: Al entrar en una zona de construcción en Michigan, ¿qué sucede con las
    multas por infracciones de tránsito en movimiento?
  choices:
    A: Se reducen a la mitad
    B: Permanecen iguales
    C: Se duplican
    D: Se triplican
  answer: C
  explanation: En Michigan, las multas de tráfico se duplican por infracciones en
    movimiento cometidas en zonas de obras.
- id: 108
  category: defensive_driving
  question: ¿Qué es la "Ley de Velocidad Básica" (Basic Speed Law) en Michigan?
  choices:
    A: Conducir siempre al límite de velocidad indicado
    B: Conducir a una velocidad que sea cuidadosa y prudente para las condiciones
      actuales
    C: Nunca conducir a menos de 45 mph en las autopistas
    D: El límite de velocidad es de 55 mph en todos los caminos rurales
  answer: B
  explanation: La Ley de Velocidad Básica de Michigan exige que los conductores manejen
    a una velocidad cuidadosa y prudente en todas las condiciones de conducción, incluso
    si eso significa conducir más lento que el límite indicado.
- id: 109
  category: defensive_driving
  question: 'En Michigan, si conduce por una carretera de tres o más carriles y un
    vehículo de emergencia con luces intermitentes está detenido en el acotamiento
    derecho, usted debe:'
  choices:
    A: Detenerse en su carril
    B: Moverse al menos un carril hacia la izquierda
    C: Mantener su velocidad y permanecer en el carril derecho
    D: Encender sus luces de emergencia y detenerse
  answer: B
  explanation: La Ley de Moverse a un Lado de Michigan exige que los conductores se
    muevan al menos un carril para los vehículos de emergencia estacionarios si hay
    al menos dos carriles disponibles en esa dirección.
- id: 110
  category: defensive_driving
  question: Al conducir en condiciones invernales en Michigan, ¿por qué son particularmente
    peligrosos los puentes y pasos elevados?
  choices:
    A: Suelen ser más estrechos que la carretera
    B: Se congelan antes que el resto de la calzada
    C: Tienen un límite de velocidad más alto
    D: No son salados por las cuadrillas de mantenimiento vial
  answer: B
  explanation: Los puentes y pasos elevados carecen del aislamiento del suelo debajo,
    lo que hace que se congelen más rápido que las carreteras normales, creando a
    menudo "hielo negro" (black ice).
- id: 111
  category: defensive_driving
  question: 'Si su vehículo está equipado con frenos antibloqueo (ABS) y necesita
    detenerse rápidamente en una carretera resbaladiza en Michigan, usted debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante al pedal del freno
    C: Tocar los frenos ligeramente
    D: Poner el vehículo en punto muerto (neutral) y usar el freno de emergencia
  answer: B
  explanation: Con el sistema ABS, debe aplicar una presión firme y constante. El
    sistema bombeará automáticamente los frenos por usted para evitar que las ruedas
    se bloqueen.
- id: 112
  category: defensive_driving
  question: En Michigan, ¿para qué se utiliza la 'regla de los 3 segundos'?
  choices:
    A: Determinar cuánto tiempo esperar en una señal de alto
    B: Medir una distancia de seguimiento segura
    C: Calcular cuánto tiempo usar la señal de giro antes de un cambio de carril
    D: Calcular el tiempo necesario para cruzar una intersección
  answer: B
  explanation: La regla de los 3 segundos es una técnica de conducción defensiva que
    se utiliza para garantizar una distancia de seguimiento segura detrás del vehículo
    que va adelante.
- id: 113
  category: alcohol_drugs_health
  question: En Michigan, ¿cuál es el límite legal de concentración de alcohol en sangre
    (BAC) para un conductor de 21 años o más?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Para conductores de 21 años o más, es ilegal conducir con un BAC de
    0.08% o superior en Michigan.
- id: 114
  category: alcohol_drugs_health
  question: Según la ley de Michigan, ¿cuál es la sanción en puntos por conducir con
    cualquier presencia de una sustancia controlada de la Lista 1 (Schedule 1) o cocaína
    en su cuerpo?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: Ningún punto, solo una multa
  answer: C
  explanation: Operar un vehículo con la presencia de una droga de la Lista 1 o cocaína
    resulta en la adición de 6 puntos a su historial de conducción de Michigan.
- id: 115
  category: alcohol_drugs_health
  question: Si es menor de 21 años, ¿dónde debe guardarse el alcohol sin abrir en
    un vehículo si no está acompañado por un padre o tutor?
  choices:
    A: En la guantera
    B: En el piso del asiento trasero
    C: En el maletero (cajuela)
    D: Debajo del asiento del conductor
  answer: C
  explanation: Los conductores menores de 21 años no pueden transportar alcohol a
    menos que estén acompañados por un adulto de 21 años o más; si lo hacen, el alcohol
    debe estar en el maletero o en un compartimento que no sea fácilmente accesible
    desde el área de pasajeros si no hay maletero.
- id: 116
  category: alcohol_drugs_health
  question: La ley de 'Contenedor Abierto' (Open Container) de Michigan prohíbe ¿cuál
    de las siguientes acciones?
  choices:
    A: Llevar un contenedor de alcohol sin sellar en el área de pasajeros de un vehículo
    B: Llevar una botella de cerveza vacía en el maletero
    C: Transportar vino sellado en el asiento trasero
    D: Beber agua mientras conduce
  answer: A
  explanation: Es ilegal transportar o poseer un contenedor de alcohol abierto en
    el área de pasajeros de un vehículo en las carreteras de Michigan, independientemente
    de si el vehículo está en movimiento o estacionado.
- id: 117
  category: alcohol_drugs_health
  question: Un conductor condenado bajo la ley 'Super Drunk' de Michigan (BAC de 0.17
    o superior) debe usar un Dispositivo de Interbloqueo de Encendido (IID) para conducir
    durante su período restringido. ¿Quién es responsable de los costos de este dispositivo?
  choices:
    A: El Estado de Michigan
    B: El Secretario de Estado
    C: El conductor
    D: La compañía de seguros del conductor
  answer: C
  explanation: El conductor es responsable de todos los costos asociados con la instalación
    y el mantenimiento de un Dispositivo de Interbloqueo de Encendido (IID).
- id: 118
  category: alcohol_drugs_health
  question: De acuerdo con el Manual del Conductor de Michigan, si tiene una condición
    médica como la epilepsia, ¿cuánto tiempo debe transcurrir sin convulsiones antes
    de que pueda ser considerado para una licencia?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Michigan requiere que los conductores con condiciones como la epilepsia
    estén libres de convulsiones durante al menos 6 meses antes de ser elegibles para
    una licencia de conducir.
- id: 119
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de mezclar alcohol con otras drogas, como medicamentos
    para el resfriado o recetas médicas?
  choices:
    A: Los efectos de cada uno se cancelan
    B: El alcohol evitará que el medicamento funcione
    C: El efecto combinado suele ser mayor que la suma de los dos
    D: No hay un efecto combinado en la capacidad de conducción
  answer: C
  explanation: Mezclar alcohol y drogas puede causar un efecto sinérgico, lo que significa
    que el deterioro es mucho peor que si se hubiera usado solo una sustancia.
- id: 120
  category: alcohol_drugs_health
  question: Bajo la ley de Michigan, ¿cómo afecta la legalización de la marihuana
    recreativa a las reglas de conducción?
  choices:
    A: Es legal conducir mientras se usa marihuana
    B: Es legal conducir siempre que tenga una tarjeta médica
    C: Sigue siendo ilegal conducir bajo la influencia de la marihuana
    D: El uso de marihuana no afecta la capacidad de conducción
  answer: C
  explanation: A pesar de la legalización de la marihuana en Michigan, sigue siendo
    estrictamente ilegal operar un vehículo motorizado mientras se está bajo los efectos
    de la marihuana.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál es el período de suspensión obligatoria ("hard suspension") para
    una primera condena por OWI (sin BAC alto) en Michigan antes de que se pueda emitir
    una licencia restringida?
  choices:
    A: Ninguno; la conducción restringida comienza de inmediato
    B: 30 días
    C: 45 días
    D: 90 días
  answer: B
  explanation: Una primera condena por OWI resulta en una suspensión de la licencia
    de 180 días, sin permiso para conducir (suspensión obligatoria) durante los primeros
    30 días, seguidos de 150 días de conducción restringida.
- id: 122
  category: alcohol_drugs_health
  question: ¿Cuántos puntos se asignan por una condena de homicidio involuntario o
    homicidio por negligencia que involucre el uso de un vehículo motorizado en Michigan?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: El homicidio involuntario, el homicidio por negligencia o cualquier
    delito grave que involucre un vehículo motorizado resulta en 6 puntos en el registro
    de conducción de Michigan.
- id: 123
  category: alcohol_drugs_health
  question: En Michigan, ¿cuál es el período de suspensión obligatoria ("hard suspension")
    para una primera infracción por "BAC alto" (Super Drunk) antes de que se pueda
    otorgar una licencia restringida con un dispositivo de interbloqueo de encendido
    (IID)?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 1 año
  answer: B
  explanation: Para una infracción por "BAC alto" (0.17 o superior), la licencia se
    suspende por 1 año. No se permite conducir durante los primeros 45 días, seguidos
    de 320 días de conducción restringida con un dispositivo de interbloqueo de encendido
    (IID).
- id: 124
  category: alcohol_drugs_health
  question: 'Bajo la ley de Michigan, una persona menor de 21 años solo puede transportar
    alcohol en un vehículo si:'
  choices:
    A: El contenedor está cerrado y en el asiento trasero.
    B: Está acompañada por una persona de al menos 21 años de edad.
    C: El vehículo es un vehículo comercial.
    D: El alcohol es para una ceremonia religiosa.
  answer: B
  explanation: La ley de Michigan prohíbe que las personas menores de 21 años transporten
    alcohol a menos que estén acompañadas por una persona de 21 años o más (como un
    padre o tutor). Si no están acompañadas, pueden ser procesadas incluso si el contenedor
    está cerrado.
- id: 125
  category: alcohol_drugs_health
  question: ¿Cuál es el tiempo máximo de cárcel por una primera infracción estándar
    de Operar Bajo la Influencia (OWI) en Michigan?
  choices:
    A: 30 días
    B: 93 días
    C: 180 días
    D: 1 año
  answer: B
  explanation: Una primera infracción de OWI (BAC inferior a 0.17) en Michigan conlleva
    una posible sentencia de cárcel de hasta 93 días.
- id: 126
  category: alcohol_drugs_health
  question: Para una primera condena por "BAC alto" (Super Drunk) en Michigan, ¿cuál
    es la multa máxima que se puede imponer?
  choices:
    A: $300
    B: $500
    C: $700
    D: $1,000
  answer: C
  explanation: Una condena por "BAC alto" (0.17 o superior) conlleva una multa que
    oscila entre $200 y $700 por una primera infracción, la cual es más alta que la
    multa estándar por OWI.
- id: 127
  category: alcohol_drugs_health
  question: ¿Cuántos puntos se añaden a un registro de conducción de Michigan por
    operar un vehículo con cualquier presencia de una sustancia controlada de la Lista
    1?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: No se añaden puntos, solo una multa
  answer: C
  explanation: Michigan tiene una política de tolerancia cero para las drogas de la
    Lista 1. Operar con cualquier cantidad de estas sustancias en su sistema resulta
    en 6 puntos, lo mismo que un OWI.
- id: 128
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de Michigan, ¿cuál es la única forma de
    reducir su concentración de alcohol en sangre (BAC)?
  choices:
    A: Beber café negro
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Dejar que pase el tiempo
  answer: D
  explanation: Solo el tiempo puede reducir el BAC. El cuerpo procesa el alcohol a
    un ritmo constante, y los estimulantes como el café o el agua fría no aceleran
    el proceso de desintoxicación.
- id: 129
  category: alcohol_drugs_health
  question: En Michigan, ¿una condena por Operar Bajo la Influencia (OWI) que cause
    lesiones graves a otra persona resulta en cuántos puntos?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Cualquier condena por OWI que involucre lesiones o muerte resulta en
    la adición de 6 puntos al registro del conductor, junto con severas sanciones
    penales.
- id: 130
  category: alcohol_drugs_health
  question: Bajo la ley de Tolerancia Cero de Michigan, ¿una condena por primera infracción
    para un conductor menor de 21 años puede incluir hasta cuántas horas de servicio
    comunitario?
  choices:
    A: 40 horas
    B: 100 horas
    C: 360 horas
    D: 500 horas
  answer: C
  explanation: Una condena por primera infracción de Tolerancia Cero (BAC de 0.02
    a 0.07) para un menor puede incluir hasta 360 horas de servicio comunitario.
- id: 131
  category: alcohol_drugs_health
  question: ¿Cuántos días debe esperar una persona condenada por una infracción de
    'BAC alto' (Super Drunk) en Michigan antes de ser elegible para una licencia restringida
    con un dispositivo de bloqueo de encendido?
  choices:
    A: 30 días
    B: 45 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Por una infracción de BAC alto, la licencia se suspende por un año.
    El conductor no es elegible para una licencia restringida hasta después de 45
    días de suspensión 'total' (hard suspension), y solo con un dispositivo de bloqueo
    de encendido por alcohol en el aliento (BAIID).
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es generalmente la primera capacidad de conducción
    afectada por el consumo de alcohol?
  choices:
    A: Coordinación
    B: Visión
    C: Juicio
    D: Tiempo de reacción
  answer: C
  explanation: El juicio es la primera capacidad que se ve afectada por el alcohol,
    lo que a menudo lleva a los conductores a correr riesgos que de otro modo no correrían,
    incluso antes de que la coordinación física se vea notablemente afectada.
- id: 133
  category: alcohol_drugs_health
  question: En Michigan, ¿cuál es la pena máxima de cárcel por una primera infracción
    de OWI con un pasajero menor de 16 años (Peligro para un menor)?
  choices:
    A: 93 días
    B: 180 días
    C: 1 año
    D: 5 años
  answer: C
  explanation: Operar un vehículo bajo la influencia (OWI) con un menor de 16 años
    en el vehículo es un delito menor castigado con hasta 1 año de cárcel por la primera
    infracción.
- id: 134
  category: alcohol_drugs_health
  question: 'Si un conductor adulto (mayor de 21 años) se niega a una prueba preliminar
    de aliento (PBT) solicitada por un oficial de policía en Michigan, se considera:'
  choices:
    A: Un delito grave (felony)
    B: Una infracción de 6 puntos
    C: Una infracción civil
    D: Legal, ya que no es la prueba de evidencia
  answer: C
  explanation: Negarse a un PBT (el alcoholímetro de carretera) es una infracción
    civil para los adultos. Esto es independiente de negarse a la prueba química en
    la estación (Consentimiento Implícito), que conlleva sanciones mucho más severas.
- id: 135
  category: alcohol_drugs_health
  question: 'La ley exige que los conductores de Michigan informen sobre cualquier
    condición física o mental que pueda afectar su capacidad para conducir de manera
    segura a:'
  choices:
    A: Su compañía de seguros
    B: El departamento de policía local
    C: La Secretaría de Estado (Secretary of State)
    D: El Departamento de Transporte
  answer: C
  explanation: La ley de Michigan exige que los conductores informen sobre cualquier
    condición médica que pueda afectar su conducción a la Secretaría de Estado al
    solicitar o renovar una licencia.
- id: 136
  category: alcohol_drugs_health
  question: ¿Cuál es la diferencia principal entre OWI y OWVI en Michigan?
  choices:
    A: OWI es para drogas, OWVI es para alcohol.
    B: OWVI significa que su capacidad para conducir se vio visiblemente afectada
      por el alcohol, independientemente del BAC.
    C: OWI solo se aplica a conductores menores de 21 años.
    D: OWVI no resulta en ningún punto en el historial.
  answer: B
  explanation: Operar un vehículo con deterioro visible (OWVI) significa que, debido
    al consumo de alcohol o drogas, su capacidad para operar un vehículo motorizado
    se redujo visiblemente. Puede ser condenado por OWVI incluso si su BAC es inferior
    a 0.08.
- id: 137
  category: penalties_and_points
  question: Si un conductor de Michigan es condenado por exceso de velocidad de 16
    mph o más sobre el límite legal, ¿cuántos puntos se añaden a su historial?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 6 puntos
  answer: B
  explanation: Exceder el límite de velocidad por 16 mph o más resulta en la adición
    de 4 puntos al historial de conducción de Michigan.
- id: 138
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan en un historial de conducción de Michigan por
    no detenerse y revelar su identidad en la escena de un accidente?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: No detenerse y revelar la identidad después de un accidente es una
    infracción grave en Michigan y conlleva una sanción de 6 puntos.
- id: 139
  category: penalties_and_points
  question: En Michigan, ¿una condena por 'Seguir demasiado de cerca' (tailgating)
    resulta en cuántos puntos?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 0 puntos
  answer: A
  explanation: Seguir demasiado de cerca se considera una infracción de tránsito en
    Michigan y se le asignan 2 puntos.
- id: 140
  category: penalties_and_points
  question: En Michigan, ¿cuántos puntos se asignan por operar un vehículo con cualquier
    presencia de una droga de la Lista 1 (Schedule 1) o cocaína en su cuerpo?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: Revocación de la licencia con 0 puntos
  answer: C
  explanation: Operar con la presencia de una droga de la Lista 1 o cocaína (OWPD)
    se trata de manera similar al OWI y resulta en 6 puntos.
- id: 141
  category: penalties_and_points
  question: Si un conductor de Michigan menor de 21 años se niega a realizar una prueba
    preliminar de aliento (PBT) cuando lo solicita un oficial de la ley, ¿cuál es
    la consecuencia legal?
  choices:
    A: Es un delito grave
    B: Es una infracción civil con una multa de hasta $100
    C: Revocación automática de la licencia por 2 años
    '0': No hay penalización si el conductor no está realmente ebrio
  answer: B
  explanation: Para conductores menores de 21 años, negarse a una prueba PBT es una
    infracción civil que resulta en una multa de hasta $100 y se agregará al registro
    de conducción.
- id: 142
  category: penalties_and_points
  question: Según las leyes de conducción distraída de Michigan de 2023, ¿en qué infracción
    por el uso de un dispositivo móvil manual mientras se conduce se comienzan a asignar
    puntos?
  choices:
    A: La primera infracción
    B: La segunda infracción
    C: La tercera infracción
    D: Nunca se asignan puntos por enviar mensajes de texto
  answer: C
  explanation: Según la ley vigente desde el 30 de junio de 2023, la primera y segunda
    infracción por el uso de dispositivos manuales conllevan multas o servicio comunitario,
    pero no puntos. La tercera infracción y las subsiguientes resultan en 2 puntos.
- id: 143
  category: penalties_and_points
  question: En Michigan, ¿cuál de las siguientes infracciones resulta en la adición
    de 6 puntos a su registro de conducción?
  choices:
    A: Rebase inadecuado
    B: Huir o eludir a un oficial de policía
    C: Operar un vehículo con un alto nivel de alcohol en sangre (BAC) (Super Ebrio)
    '0': Tanto B como C
  answer: D
  explanation: Tanto las condenas por huir o eludir a la policía como por 'Super Ebrio'
    (BAC de 0.17 o más) resultan en 6 puntos en un registro de conducción de Michigan.
- id: 144
  category: penalties_and_points
  question: ¿Cuántos puntos se agregan a un registro de conducción de Michigan por
    homicidio involuntario u homicidio negligente que involucre un vehículo motorizado?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: El homicidio involuntario, el homicidio negligente o cualquier delito
    grave que involucre el uso de un vehículo motorizado resulta en 6 puntos en Michigan.
- id: 145
  category: penalties_and_points
  question: En Michigan, no detenerse y revelar su identidad en la escena de un accidente
    resulta en ¿cuántos puntos?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: Los puntos solo se asignan si hay una lesión
  answer: C
  explanation: No detenerse y no proporcionar identificación en la escena de un accidente
    (atropello y fuga) es una infracción grave que conlleva 6 puntos.
- id: 146
  category: penalties_and_points
  question: 'Un conductor de Michigan con GDL de Nivel 1 o Nivel 2 que sea responsable
    de un accidente de tráfico puede estar obligado a:'
  choices:
    A: Pagar un recargo de $1,000
    B: Asistir a un reexamen de conductor
    C: Reiniciar el Segmento 1 de la Educación Vial
    D: Esperar hasta los 21 años para obtener una licencia de Nivel 3
  answer: B
  explanation: Bajo el programa de Licencia de Conducir Graduada (GDL), los conductores
    con una licencia de Nivel 1 o Nivel 2 que estén involucrados en un accidente con
    culpa o reciban una multa deben asistir a un reexamen de conductor.
- id: 147
  category: penalties_and_points
  question: Según la ley de Consentimiento Implícito de Michigan, ¿cuántos puntos
    se agregan al registro de un conductor por negarse a una prueba química por primera
    vez?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: No se asignan puntos, pero se suspende la licencia
  answer: C
  explanation: Negarse a una prueba química (aliento, sangre u orina) bajo la ley
    de Consentimiento Implícito resulta en 6 puntos y una suspensión de la licencia
    por un año.
- id: 148
  category: sharing_the_road
  question: Según la 'Ley de Moverse a un Lado' (Move Over Law) de Michigan, ¿qué
    debe hacer al acercarse a un vehículo de emergencia estacionado con sus luces
    intermitentes en una carretera con al menos dos carriles en su dirección?
  choices:
    A: Mantener su velocidad pero moverse al carril izquierdo
    B: Moverse un carril, o si no es posible, reducir la velocidad a al menos 10 mph
      por debajo del límite indicado
    C: Detenerse por completo hasta que el vehículo de emergencia se mueva
    D: Acelerar para pasar el vehículo lo más rápido posible
  answer: B
  explanation: La ley de Michigan exige que los conductores se muevan un carril ante
    vehículos de emergencia estacionados. Si no es posible o seguro moverse, el conductor
    debe reducir la velocidad a al menos 10 mph por debajo del límite de velocidad
    indicado.
- id: 149
  category: sharing_the_road
  question: 'En Michigan, NO es obligatorio detenerse ante un autobús escolar con
    luces rojas intermitentes si:'
  choices:
    A: Usted viaja en la dirección opuesta en una carretera dividida por una barrera
      o mediana
    B: El autobús está detenido en un carril de giro
    C: Usted se encuentra en una zona residencial
    D: Hay más de cuatro carriles de tráfico
  answer: A
  explanation: Los conductores que viajan en la dirección opuesta en una carretera
    dividida por una barrera física o mediana (como un muro de concreto o una franja
    de césped) no están obligados a detenerse ante un autobús escolar.
- id: 150
  category: sharing_the_road
  question: Para conducir legalmente una motocicleta sin casco en Michigan, un conductor
    debe tener al menos 21 años y contar con al menos ¿cuánto en beneficios médicos
    de primera parte?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $50,000
  answer: C
  explanation: La ley de Michigan permite que los conductores de 21 años o más conduzcan
    sin casco si tienen al menos $20,000 en beneficios médicos de primera parte y
    han tenido un endoso de motocicleta durante al menos dos años o han aprobado un
    curso de seguridad.
- id: 151
  category: sharing_the_road
  question: Al seguir a un camión grande, ¿por qué debería aumentar su distancia de
    seguimiento a más de los 3-4 segundos estándar?
  choices:
    A: Los camiones tienen puntos ciegos más pequeños que los automóviles
    B: Para permitir que el conductor del camión lo vea en sus espejos laterales
    C: Los camiones están obligados a detenerse en todos los cruces de ferrocarril
    D: Los camiones siempre viajan más rápido que el límite de velocidad
  answer: B
  explanation: Si no puede ver la cara del conductor del camión en sus espejos laterales,
    él no puede verlo a usted. Aumentar la distancia de seguimiento garantiza que
    esté fuera de la 'No-Zone' (punto ciego).
- id: 152
  category: sharing_the_road
  question: En Michigan, ¿qué debe hacer cuando ve a un peatón con un bastón blanco
    o un perro guía en una intersección?
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Detenerse y permanecer detenido hasta que el peatón haya terminado de cruzar
      la calle
    C: Rodearlo si hay suficiente espacio
    D: Reducir la velocidad y proceder con precaución
  answer: B
  explanation: La ley de Michigan exige que los conductores se detengan por completo
    y cedan el derecho de paso a cualquier peatón ciego que lleve un bastón blanco
    o utilice un perro guía.
- id: 153
  category: sharing_the_road
  question: Cuando un cortejo fúnebre utiliza una bandera de color naranja fluorescente,
    blanco o púrpura con un símbolo religioso, ¿cuál es la regla con respecto al derecho
    de paso en Michigan?
  choices:
    A: El cortejo debe ceder el paso a todo el resto del tráfico
    B: El cortejo tiene el derecho de paso en las intersecciones, independientemente
      de los semáforos
    C: Solo el vehículo que encabeza tiene el derecho de paso
    D: Los cortejos solo están permitidos los domingos
  answer: B
  explanation: Según la ley de Michigan (MCL 257.654), un cortejo fúnebre tiene el
    derecho de paso sobre todos los demás vehículos (excepto los vehículos de emergencia)
    en cualquier intersección cuando los vehículos del cortejo exhiben las banderas
    correspondientes.
- id: 154
  category: sharing_the_road
  question: ¿Qué indica una luz amarilla intermitente en un autobús escolar a los
    conductores de Michigan?
  choices:
    A: El autobús está a punto de detenerse y los conductores deben prepararse para
      parar
    B: El autobús está descargando niños y usted debe detenerse inmediatamente
    C: El autobús está averiado
    D: El autobús está girando a la izquierda
  answer: A
  explanation: Las luces amarillas intermitentes en un autobús escolar son una advertencia
    de que el autobús se está preparando para detenerse para subir o bajar niños.
    Los conductores deben reducir la velocidad y estar preparados para detenerse cuando
    las luces cambien a rojo.
- id: 155
  category: sharing_the_road
  question: En Michigan, ¿cuáles de los siguientes vehículos están cubiertos por la
    'Ley de Ceder el Paso' (Move Over Law) cuando están detenidos con luces intermitentes?
  choices:
    A: Solo vehículos de policía y bomberos
    B: Solo ambulancias y grúas
    C: Vehículos de policía, bomberos, rescate, servicio vial (grúas) y de servicios
      públicos
    D: Solo vehículos con luces azules y rojas
  answer: C
  explanation: La Ley de Ceder el Paso de Michigan se aplica a todos los vehículos
    de emergencia autorizados que estén detenidos, incluidos los de policía, bomberos,
    rescate, grúas y vehículos de servicios públicos con luces intermitentes.
- id: 156
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, es posible que el camión necesite:'
  choices:
    A: Permanecer totalmente en el carril derecho
    B: Abrirse ampliamente hacia la izquierda antes de girar a la derecha
    C: Girar desde el carril izquierdo
    D: Detenerse y esperar a que el tráfico se despeje en ambas direcciones
  answer: B
  explanation: Los camiones grandes tienen un radio de giro amplio y a menudo necesitan
    abrirse hacia la izquierda para no subir al bordillo (curva) al realizar un giro
    a la derecha.
- id: 157
  category: sharing_the_road
  question: 'Según la ley de Michigan, es ilegal rebasar a una bicicleta por la derecha
    a menos que:'
  choices:
    A: El ciclista esté señalizando un giro a la izquierda
    B: El ciclista viaje a menos de 10 mph
    C: Haya un carril exclusivo para bicicletas
    D: Nunca es legal rebasar a una bicicleta por la derecha
  answer: A
  explanation: Al igual que al rebasar a otros vehículos, puede rebasar a un ciclista
    por la derecha solo si este está realizando o está a punto de realizar un giro
    a la izquierda y hay suficiente pavimento para hacerlo de manera segura.
- id: 158
  category: sharing_the_road
  question: 'En Michigan, si usted se ve involucrado en un choque con un vehículo
    de emergencia detenido porque no se cambió de carril, y esto resulta en una lesión
    para el personal de emergencia, la sanción puede incluir:'
  choices:
    A: Una multa de $500 y sin tiempo de cárcel
    B: Un cargo por delito grave (felony) y hasta 2 años de prisión
    C: Una simple multa de tráfico
    D: Solo una suspensión de la licencia por 30 días
  answer: B
  explanation: Violar la Ley de Ceder el Paso (Move Over Law) y causar lesiones al
    personal de respuesta a emergencias es un delito grave en Michigan, punible con
    hasta 2 años de prisión y/o una multa de hasta $1,000.
- id: 159
  category: sharing_the_road
  question: Bajo la 'Ley de Ceder el Paso' (Move Over Law) de Michigan, si no puede
    cambiarse de carril ante un vehículo de emergencia detenido con sus luces intermitentes,
    ¿qué debe hacer?
  choices:
    A: Mantener su velocidad pero tocar la bocina
    B: Reducir la velocidad al menos 10 mph por debajo del límite de velocidad establecido
    C: Reducir la velocidad a 25 mph independientemente del límite establecido
    D: Detenerse por completo hasta que el vehículo de emergencia se retire
  answer: B
  explanation: La ley de Michigan exige que los conductores se muevan un carril para
    alejarse de los vehículos de emergencia detenidos. Si cambiarse de carril no es
    seguro, el conductor debe reducir la velocidad al menos 10 mph por debajo del
    límite de velocidad establecido.
- id: 160
  category: sharing_the_road
  question: En Michigan, usted se aproxima a un autobús escolar detenido en el lado
    opuesto de una carretera que está dividida por una barrera o mediana. ¿Qué se
    le exige hacer?
  choices:
    A: Detenerse al menos a 20 pies de distancia
    B: Detenerse solo si hay niños cruzando
    C: No se le exige detenerse
    D: Reducir la velocidad a 10 mph
  answer: C
  explanation: En una carretera dividida por una barrera o mediana, los conductores
    que circulan por el lado opuesto de la vía a un autobús escolar detenido no están
    obligados a detenerse.
- id: 161
  category: sharing_the_road
  question: ¿Cuál es la sanción en Michigan por no ceder el paso a una persona que
    usa un bastón blanco o un perro guía?
  choices:
    A: Una infracción civil y una multa
    B: Una suspensión de la licencia por 30 días
    C: Un cargo por delito menor (misdemeanor)
    D: Sin sanción si el peatón estaba fuera de un cruce peatonal
  answer: C
  explanation: Según la ley de Michigan, no ceder el paso a un peatón ciego que lleva
    un bastón blanco o utiliza un perro guía es un delito menor (misdemeanor).
- id: 162
  category: sharing_the_road
  question: 'Según la ley de Michigan, una persona menor de 21 años puede operar una
    motocicleta sin casco solo si:'
  choices:
    A: Tiene 5 años de experiencia en conducción
    B: Conduce en una carretera con un límite de velocidad inferior a 45 mph
    C: No pueden; todos los conductores menores de 21 años deben usar casco
    D: Tienen un seguro médico de $100,000
  answer: C
  explanation: En Michigan, aunque algunos conductores mayores de 21 años pueden optar
    por no usar casco si cumplen con requisitos específicos de seguro y licencia,
    todos los operadores y pasajeros menores de 21 años deben usar casco.
- id: 163
  category: sharing_the_road
  question: 'Al seguir a una motocicleta en Michigan, debe mantener una distancia
    de seguimiento de al menos:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 a 4 segundos
    D: 10 segundos
  answer: C
  explanation: Debido a que las motocicletas pueden detenerse más rápido que los automóviles
    y se ven más afectadas por las condiciones de la carretera, se recomienda una
    distancia de seguimiento de 3 a 4 segundos.
- id: 164
  category: sharing_the_road
  question: ¿Cómo es la señal de vehículo de movimiento lento en Michigan?
  choices:
    A: Una señal azul cuadrada
    B: Una señal amarilla circular
    C: Una señal triangular de color naranja fluorescente con un borde rojo reflectante
    D: Una señal verde en forma de diamante
  answer: C
  explanation: Los vehículos de movimiento lento, como equipos agrícolas o carruajes
    tirados por caballos, deben mostrar una señal triangular de color naranja fluorescente
    con un borde rojo reflectante cuando circulan por vías públicas.
- id: 165
  category: sharing_the_road
  question: En Michigan, ¿cuándo se le permite conducir entre vehículos que forman
    parte de un cortejo fúnebre?
  choices:
    A: Cuando el cortejo se mueve más lento que el límite de velocidad
    B: Nunca, a menos que lo indique un oficial de policía
    C: Solo si su giro está cerca
    D: Si hay un espacio de más de 20 pies
  answer: B
  explanation: La ley de Michigan otorga a los cortejos fúnebres el derecho de paso
    en las intersecciones. Es ilegal atravesar o interrumpir un cortejo fúnebre a
    menos que lo indique un oficial de la ley.
- id: 166
  category: sharing_the_road
  question: 'Cuando un autobús escolar tiene sus luces amarillas superiores parpadeando,
    significa:'
  choices:
    A: El autobús está a punto de detenerse y usted debe prepararse para detenerse
    B: El autobús está acelerando
    C: Debe detenerse inmediatamente
    D: Hay una emergencia mecánica
  answer: A
  explanation: Las luces amarillas intermitentes en un autobús escolar son una advertencia
    para los automovilistas de que el autobús se está preparando para detenerse para
    subir o bajar estudiantes.
- id: 167
  category: sharing_the_road
  question: 'Si se ve involucrado en un choque con un vehículo de emergencia estacionado
    en Michigan y esto resulta en la lesión de un socorrista, podría enfrentar:'
  choices:
    A: Solo una multa de $100
    B: Un cargo por delito grave (felony) castigado con hasta 2 años de prisión
    C: Un delito menor sin tiempo en la cárcel
    D: Una revocación obligatoria de la licencia por 10 años
  answer: B
  explanation: Violar la Ley de Moverse a un Lado (Move Over Law) y causar lesiones
    al personal de respuesta a emergencias es un delito grave (felony) en Michigan,
    castigado con hasta 2 años de prisión y/o una multa de hasta $1,000.
- id: 168
  category: sharing_the_road
  question: 'En Michigan, los ciclistas deben circular:'
  choices:
    A: En contra del flujo del tráfico
    B: Solo por las aceras
    C: Con el flujo del tráfico, tan cerca del lado derecho de la carretera como sea
      seguro
    D: En el centro del carril en todo momento
  answer: C
  explanation: La ley de Michigan exige que los ciclistas circulen con el flujo del
    tráfico y tan cerca del lado derecho de la carretera como sea factible y seguro.
- id: 169
  category: vehicle_information
  question: Según el Código de Vehículos de Michigan, ¿cuál es la profundidad mínima
    legal de la banda de rodadura para los neumáticos de un vehículo de pasajeros?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Michigan exige que los neumáticos tengan una profundidad
    de banda de rodadura de al menos 2/32 de pulgada en las ranuras principales para
    que se consideren seguros y legales.
- id: 170
  category: vehicle_information
  question: En Michigan, ¿cuándo le exige la ley el uso de los faros delanteros de
    su vehículo?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde una hora después del atardecer hasta una hora antes del amanecer
    C: Desde media hora después del atardecer hasta media hora antes del amanecer
    D: Solo cuando la visibilidad es inferior a 100 pies
  answer: C
  explanation: La ley de Michigan (MCL 257.684) exige que los faros se enciendan desde
    media hora después del atardecer hasta media hora antes del amanecer, y en cualquier
    momento en que la visibilidad no sea suficiente para ver claramente a una distancia
    de 500 pies.
- id: 171
  category: vehicle_information
  question: ¿Cuáles son las restricciones de Michigan con respecto al polarizado de
    las ventanas laterales delanteras (a la izquierda y derecha del conductor)?
  choices:
    A: No se permite ningún tipo de polarizado.
    B: Se permite el polarizado siempre que transmita al menos el 35% de la luz.
    C: Se permite el polarizado únicamente en las 4 pulgadas superiores de la ventana.
    D: Se permite el polarizado total si el conductor tiene una nota médica por cualquier
      motivo.
  answer: C
  explanation: La ley de Michigan prohíbe el polarizado en las ventanas laterales
    delanteras, excepto en las 4 pulgadas superiores. Puede aplicarse una excepción
    médica para condiciones específicas, pero la regla estándar es la franja de 4
    pulgadas.
- id: 172
  category: vehicle_information
  question: Según la ley de Michigan, todo vehículo motorizado debe estar equipado
    con un espejo situado de manera que refleje al conductor una vista de la carretera
    a una distancia de al menos ¿cuántos pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Michigan (MCL 257.708) exige un espejo retrovisor que proporcione
    una vista de la carretera de al menos 200 pies hacia la parte trasera del vehículo.
- id: 173
  category: vehicle_information
  question: En Michigan, si una carga se extiende más de ¿cuántos pies más allá de
    la parte trasera de la carrocería de su vehículo, debe marcarse con una bandera
    roja durante el día?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: La norma MCL 257.693 establece que siempre que una carga se extienda
    4 pies o más allá de la parte trasera de la plataforma o carrocería de un vehículo,
    se debe exhibir una bandera roja (de 12 pulgadas cuadradas) durante el día, y
    se debe usar una luz roja por la noche.
- id: 174
  category: vehicle_information
  question: 'En Michigan, los frenos de servicio de un vehículo de pasajeros deben
    ser capaces de detener el vehículo desde una velocidad de 20 mph dentro de una
    distancia de:'
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 45 pies
  answer: C
  explanation: Los estándares de equipamiento de Michigan exigen que los frenos de
    servicio de un vehículo de pasajeros puedan detener el automóvil en un máximo
    de 30 pies cuando viaja a 20 mph sobre una superficie seca y nivelada.
- id: 175
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las leyes
    de Michigan sobre silenciadores y sistemas de escape de vehículos?
  choices:
    A: Los recortes o derivaciones del silenciador son legales solo para uso fuera
      de carretera.
    B: Los sistemas de escape pueden producir cualquier cantidad de ruido siempre
      que vengan instalados de fábrica.
    C: Un vehículo debe tener un silenciador en buen estado de funcionamiento para
      evitar ruidos excesivos o inusuales.
    D: Los silenciadores solo son obligatorios en vehículos fabricados después de
      2010.
  answer: C
  explanation: La norma MCL 257.707 exige que todo vehículo motorizado esté equipado
    con un silenciador en buen estado de funcionamiento para evitar ruidos y humo
    excesivos. Se prohíben los recortes, derivaciones (bypasses) o dispositivos similares.
- id: 176
  category: vehicle_information
  question: 'La ley de Michigan prohíbe colgar objetos del espejo retrovisor o colocar
    calcomanías en el parabrisas si estos:'
  choices:
    A: No están relacionados con el registro del vehículo.
    B: Obstruyen la vista clara del conductor de la carretera.
    C: Son más grandes que 2 pulgadas por 2 pulgadas.
    D: Son visibles para otros conductores.
  answer: B
  explanation: La norma MCL 257.709 prohíbe cualquier objeto que obstruya la vista
    clara del conductor de la carretera o de cualquier carretera que se cruce. Esto
    incluye adornos colgantes y materiales no transparentes.
- id: 177
  category: vehicle_information
  question: 'En Michigan, la placa de matrícula trasera debe estar iluminada por una
    luz blanca para que sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Michigan exige una luz blanca para iluminar la placa de matrícula
    trasera de modo que sea visible y legible desde una distancia de 50 pies hacia
    atrás.
- id: 178
  category: vehicle_information
  question: 'Todo vehículo motorizado en Michigan debe estar equipado con una bocina
    que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Según la norma MCL 257.706, un vehículo motorizado debe tener una bocina
    en buen estado de funcionamiento capaz de emitir un sonido audible en condiciones
    normales desde una distancia no menor a 200 pies.
- id: 179
  category: vehicle_information
  question: En Michigan, ¿cuál es el requisito de altura para el montaje de los faros
    delanteros en un vehículo motorizado (medido desde el centro de la lámpara hasta
    el suelo nivelado)?
  choices:
    A: Entre 12 y 36 pulgadas
    B: Entre 24 y 54 pulgadas
    C: Entre 15 y 48 pulgadas
    D: No existe un requisito de altura.
  answer: B
  explanation: La norma MCL 257.685 especifica que los faros delanteros de los vehículos
    motorizados deben estar ubicados a una altura no mayor de 54 pulgadas ni menor
    de 24 pulgadas sobre el suelo.
- id: 180
  category: vehicle_information
  question: La ley de Michigan exige que las luces direccionales sean visibles desde
    una distancia de al menos ¿cuántos pies hacia adelante y hacia atrás bajo la luz
    solar normal?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Las luces direccionales en Michigan deben ser visibles desde una distancia
    de 100 pies tanto hacia la parte delantera como hacia la trasera del vehículo
    durante la luz solar normal.
- id: 181
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos es obligatorio para todos los remolques
    o semirremolques en Michigan que tengan un peso bruto de 3,000 libras o más?
  choices:
    A: Una cámara de reversa
    B: Frenos que actúen en todas las ruedas
    C: Parachoques cromados
    D: Luces antiniebla
  answer: B
  explanation: El MCL 257.705 exige que todo remolque o semirremolque con un peso
    bruto de 3,000 libras o más esté equipado con frenos que actúen en todas las ruedas.
- id: 182
  category: vehicle_information
  question: Según el Código de Vehículos de Michigan, ¿cuándo debe un conductor encender
    sus faros delanteros?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde una hora después del atardecer hasta una hora antes del amanecer
    C: Desde media hora después del atardecer hasta media hora antes del amanecer
    D: Solo cuando esté lloviendo o nevando
  answer: C
  explanation: En Michigan, los faros delanteros deben encenderse desde media hora
    después del atardecer hasta media hora antes del amanecer, y en cualquier momento
    en que la visibilidad sea inferior a 500 pies.
- id: 183
  category: vehicle_information
  question: 'Según la ley de Michigan, debe bajar las luces altas cuando siga a otro
    vehículo desde atrás a una distancia de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 150 pies
  answer: C
  explanation: La ley de Michigan exige que los conductores bajen las luces altas
    cuando sigan a otro vehículo a una distancia de 500 pies o menos.
- id: 184
  category: vehicle_information
  question: 'Se debe exhibir un emblema de "Vehículo de movimiento lento" (un triángulo
    naranja) en la parte trasera de cualquier vehículo en Michigan que esté diseñado
    para operar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de Vehículo de Movimiento Lento (SMV) es obligatorio en
    todos los vehículos diseñados para viajar a velocidades de 25 mph o menos en carreteras
    públicas.
- id: 185
  category: vehicle_information
  question: Según la ley de Michigan, si una carga se extiende más de cuántos pies
    más allá de la parte trasera de la carrocería del vehículo, ¿se debe colocar una
    bandera roja (día) o una luz roja (noche) en el extremo posterior de la carga?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: Siempre que una carga se extienda 4 pies o más más allá de la parte
    trasera de la plataforma o carrocería de un vehículo, se debe exhibir una bandera
    roja o una luz roja al final de la carga.
- id: 186
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los requisitos
    de Michigan para los lavaparabrisas?
  choices:
    A: Solo son obligatorios para vehículos comerciales
    B: Se recomiendan pero no son obligatorios por ley
    C: Todo vehículo de motor fabricado después del 1 de enero de 1956 debe estar
      equipado con ellos
    D: Solo son obligatorios si el vehículo no tiene limpiaparabrisas
  answer: C
  explanation: La ley de Michigan exige que todos los vehículos de motor fabricados
    después del 1 de enero de 1956 estén equipados con un sistema de lavaparabrisas
    en buen estado de funcionamiento.
- id: 187
  category: vehicle_information
  question: 'En Michigan, los niños deben estar debidamente sujetos en un asiento
    elevado (booster seat) hasta que tengan:'
  choices:
    A: 6 años de edad o 4 pies de altura
    B: 8 años de edad o 4 pies y 9 pulgadas de altura
    C: 10 años de edad o 5 pies de altura
    D: 12 años de edad o 4 pies y 9 pulgadas de altura
  answer: B
  explanation: La ley de Michigan exige que los niños usen un asiento elevado hasta
    que cumplan 8 años o midan 4'9" de altura, lo que ocurra primero.
- id: 188
  category: vehicle_information
  question: ¿La ley de Michigan prohíbe el uso de qué equipo en un vehículo de pasajeros
    a menos que sea un vehículo de emergencia?
  choices:
    A: Luces antiniebla
    B: Luces de estribo
    C: Una sirena, silbato o campana
    D: Faros LED
  answer: C
  explanation: Según la ley de Michigan, ningún vehículo estará equipado con una sirena,
    silbato o campana, ni ninguna persona los utilizará en un vehículo, excepto en
    los vehículos de emergencia autorizados.
- id: 189
  category: vehicle_information
  question: En Michigan, ¿cuál es el requisito legal para el sistema de escape de
    un vehículo?
  choices:
    A: Debe ser lo suficientemente fuerte como para ser escuchado desde 100 pies
    B: Debe tener un silenciador en buen estado de funcionamiento para evitar el ruido
      excesivo
    C: Se permiten recortes de escape para uso en carretera
    D: Los silenciadores solo son obligatorios en vehículos con más de 4 cilindros
  answer: B
  explanation: La ley de Michigan exige que cada vehículo de motor tenga un silenciador
    en buen estado de funcionamiento y en operación constante para evitar ruidos excesivos
    o inusuales y humo molesto.
- id: 190
  category: signs_and_signals
  question: 'Según la ley de Michigan, un giro a la izquierda con luz roja es legal
    cuando se gira desde una calle de un solo sentido o de doble sentido hacia:'
  choices:
    A: Una calle de doble sentido
    B: Una calle de un solo sentido que lleve el tráfico en la dirección del giro
    C: Cualquier calle, siempre que no venga tráfico
    D: Un giro a la izquierda en rojo nunca es legal en Michigan
  answer: B
  explanation: La ley de Michigan (MCL 257.612) es única en el sentido de que permite
    a los conductores girar a la izquierda con luz roja desde una calle de un solo
    sentido o de doble sentido hacia una calle de un solo sentido que lleve el tráfico
    en la dirección del giro, después de detenerse por completo y ceder el paso.
- id: 191
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a un semáforo con luz roja intermitente en
    Michigan?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo y avanzar solo cuando sea seguro hacerlo
    C: Detenerse y esperar a que la luz cambie a verde
    D: Ceder el paso únicamente al tráfico que viene por la derecha
  answer: B
  explanation: En Michigan, una luz roja intermitente se trata igual que una señal
    de alto (STOP). Debe detenerse por completo y puede avanzar solo cuando sea seguro.
- id: 192
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico amarilla intermitente a un conductor
    en Michigan?
  choices:
    A: La luz está a punto de cambiar a roja; deténgase si puede hacerlo de manera
      segura
    B: Detenerse y ceder el paso a todo el tráfico transversal
    C: Avanzar con precaución a través de la intersección
    D: Hay peatones presentes en el cruce peatonal
  answer: C
  explanation: Una luz amarilla intermitente significa que debe avanzar con precaución.
    No es necesario detenerse, pero debe estar alerta y preparado para posibles peligros.
- id: 193
  category: signs_and_signals
  question: ¿Cuál es la forma y el color estándar de una señal de Ceda el paso (Yield)
    en Michigan?
  choices:
    A: Un triángulo equilátero que apunta hacia abajo, rojo y blanco
    B: Forma de diamante, amarillo y negro
    C: Un octágono, rojo y blanco
    D: Un rectángulo, blanco y negro
  answer: A
  explanation: Las señales de Ceda el paso (Yield) son triángulos que apuntan hacia
    abajo con un borde rojo e interior blanco.
- id: 194
  category: signs_and_signals
  question: 'Una señal de cinco lados (pentágono) que es de color amarillo-verde fluorescente
    indica:'
  choices:
    A: Una zona de construcción
    B: Una zona de no adelantar
    C: Una zona escolar o cruce escolar
    D: Un hospital cercano
  answer: C
  explanation: La forma de pentágono está reservada para advertencias relacionadas
    con escuelas, como zonas escolares o cruces escolares, y suele ser de color amarillo-verde
    fluorescente.
- id: 195
  category: signs_and_signals
  question: 'En Michigan, una línea blanca continua entre carriles de tráfico que
    se mueven en la misma dirección indica:'
  choices:
    A: Los cambios de carril están estrictamente prohibidos
    B: Los cambios de carril se desaconsejan pero se permiten con precaución
    C: El inicio de un carril para bicicletas
    D: Se está acercando a una señal de alto
  answer: B
  explanation: El Manual del Conductor de Michigan establece que las líneas blancas
    continuas separan los carriles de tráfico que se mueven en la misma dirección
    y se utilizan para desaconsejar los cambios de carril en áreas de alto riesgo,
    aunque no están estrictamente prohibidos como lo estarían las líneas continuas
    dobles.
- id: 196
  category: signs_and_signals
  question: 'Una línea amarilla doble continua en el centro de una carretera de Michigan
    significa:'
  choices:
    A: Se permite adelantar si no viene tráfico
    B: Se permite adelantar solo durante las horas del día
    C: Está prohibido adelantar en ambas direcciones
    D: Se permite adelantar solo para motocicletas
  answer: C
  explanation: Las líneas amarillas dobles continuas indican que está prohibido adelantar
    para el tráfico que se mueve en ambas direcciones.
- id: 197
  category: signs_and_signals
  question: Si las luces direccionales de su vehículo no funcionan, ¿cómo debe indicar
    un giro a la izquierda usando señales manuales?
  choices:
    A: Extender el brazo izquierdo recto hacia afuera de la ventana
    B: Extender el brazo izquierdo hacia arriba
    C: Extender el brazo izquierdo hacia abajo
    D: Mover la mano en movimiento circular
  answer: A
  explanation: Para indicar un giro a la izquierda, el conductor debe extender el
    brazo izquierdo horizontalmente hacia afuera de la ventana.
- id: 198
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para reducir la velocidad o detenerse?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho extendido por la ventana del pasajero
  answer: C
  explanation: Para indicar una parada o disminución de velocidad, extienda el brazo
    izquierdo hacia abajo con la palma de la mano hacia atrás.
- id: 199
  category: signs_and_signals
  question: ¿De qué color son las señales de control de tráfico temporal de Michigan
    utilizadas en zonas de trabajo de construcción y mantenimiento?
  choices:
    A: Amarillo
    B: Naranja
    C: Rojo
    D: Azul
  answer: B
  explanation: El naranja es el color estándar para las señales de advertencia en
    zonas de construcción, mantenimiento y trabajos de servicios públicos.
- id: 200
  category: signs_and_signals
  question: En Michigan, ¿qué significa una flecha amarilla intermitente en una intersección?
  choices:
    A: Tiene un giro protegido; el tráfico en sentido contrario está detenido
    B: Debe detenerse y esperar a una flecha verde
    C: Puede girar a la izquierda después de ceder el paso al tráfico en sentido contrario
      y a los peatones
    D: La intersección está cerrada para giros a la izquierda
  answer: C
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero no están protegidos. Debe ceder el paso al tráfico en sentido
    contrario y a los peatones antes de completar el giro.
- id: 201
  category: signs_and_signals
  question: ¿Qué indican las luces amarillas intermitentes en la parte superior de
    un autobús escolar de Michigan?
  choices:
    A: El autobús está cargando o descargando niños; usted debe detenerse
    B: El autobús se está preparando para detenerse; usted debe prepararse para detenerse
    C: El autobús tiene una falla mecánica
    D: Puede rebasar al autobús con precaución
  answer: B
  explanation: Las luces amarillas intermitentes en la parte superior de un autobús
    escolar advierten a los conductores que el autobús está a punto de detenerse para
    cargar o descargar niños. Los conductores deben prepararse para detenerse.
- id: 202
  category: signs_and_signals
  question: 'Una señal amarilla redonda con una ''X'' negra y las letras ''RR'' se
    coloca:'
  choices:
    A: En las vías de un cruce de ferrocarril
    B: Antes de un cruce de ferrocarril
    C: Solo en intersecciones rurales
    D: Donde una carretera termina en una intersección en 'T'
  answer: B
  explanation: La señal amarilla redonda de advertencia anticipada indica a los conductores
    que hay un cruce de ferrocarril más adelante.
- id: 203
  category: signs_and_signals
  question: 'En Michigan, una señal que muestra una flecha blanca en forma de ''U''
    apuntando hacia un cruce de mediana se utiliza para:'
  choices:
    A: Solo vehículos de emergencia
    B: Un giro a la izquierda indirecto, comúnmente conocido como 'Giro a la izquierda
      de Michigan' (Michigan Left)
    C: Indicar una calle sin salida
    D: Advertir de una curva cerrada más adelante
  answer: B
  explanation: Michigan utiliza giros a la izquierda indirectos (Michigan Lefts) en
    muchas intersecciones. Los conductores deben pasar la intersección, usar un cruce
    de mediana y luego girar a la derecha o seguir recto.
- id: 204
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente en una intersección de
    Michigan?
  choices:
    A: Detenerse y esperar a una flecha verde
    B: El giro está protegido; el tráfico en sentido contrario tiene un semáforo en
      rojo
    C: Ceder el paso al tráfico en sentido contrario y a los peatones, luego girar
      con precaución
    D: Acelerar para completar el giro antes de que cambie la luz
  answer: C
  explanation: Una flecha amarilla intermitente significa que puede girar en la dirección
    de la flecha después de ceder el paso al tráfico en sentido contrario y a los
    peatones. El tráfico en sentido contrario tiene luz verde.
- id: 205
  category: signs_and_signals
  question: 'Cuando vea una luz roja intermitente en Michigan, usted debe:'
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo y proceder solo cuando sea seguro hacerlo
    C: Detenerse y esperar a que la luz cambie a verde
    D: Ceder el paso solo si hay otros vehículos presentes
  answer: B
  explanation: Una luz roja intermitente debe tratarse igual que una señal de alto.
    Debe detenerse por completo y puede proceder solo cuando sea seguro.
- id: 206
  category: signs_and_signals
  question: En Michigan, ¿qué indican los 'sharrows' (marcas en el pavimento que muestran
    una bicicleta con dos flechas arriba)?
  choices:
    A: Un carril reservado exclusivamente para bicicletas
    B: Un carril donde los automovilistas tienen prohibido circular
    C: Un carril compartido tanto por automovilistas como por ciclistas
    D: Una zona solo para peatones
  answer: C
  explanation: Los 'sharrows', o marcas de carril compartido, indican que los ciclistas
    pueden usar el carril completo y ayudan a los automovilistas y ciclistas a compartir
    la carretera de manera segura.
- id: 207
  category: signs_and_signals
  question: Al acercarse a un 'Giro a la izquierda de Michigan' (Michigan Left), ¿cuál
    es el primer paso que debe dar un conductor para girar a la izquierda?
  choices:
    A: Girar a la izquierda directamente en la intersección
    B: Pasar la intersección, luego girar a la derecha hacia el área designada para
      el giro en U
    C: Pasar la intersección, realizar un giro en U en medio de la cuadra
    D: Girar a la derecha en la intersección, luego hacer un giro en U
  answer: B
  explanation: Para realizar un Giro a la izquierda de Michigan, normalmente se atraviesa
    o se gira a la derecha en la intersección, luego se utiliza un cruce de mediana
    designado para completar el giro en U y dirigirse en la dirección deseada.
- id: 208
  category: signs_and_signals
  question: 'Según la ley de Michigan, debe detenerse ante un autobús escolar con
    sus luces rojas superiores intermitentes, a menos que:'
  choices:
    A: El autobús esté en el lado opuesto de una carretera dividida separada por una
      barrera
    B: El autobús esté detenido en una zona residencial
    C: Usted esté viajando a menos de 25 mph
    D: No haya niños visibles
  answer: A
  explanation: Los conductores no están obligados a detenerse ante un autobús escolar
    con luces rojas intermitentes si viajan en la dirección opuesta en una carretera
    dividida separada por una barrera o una isla central (mediana).
- id: 209
  category: signs_and_signals
  question: ¿Qué indica una señal en forma de pentágono en Michigan?
  choices:
    A: Ceder el paso
    B: Cruce de ferrocarril
    C: Zona escolar o cruce escolar
    D: Zona de no rebasar
  answer: C
  explanation: Una señal de cinco lados (pentágono) se utiliza exclusivamente para
    advertir a los conductores que se acercan a una zona escolar o a un cruce peatonal
    escolar.
- id: 210
  category: signs_and_signals
  question: 'Al acercarse a un vehículo de emergencia estacionado con sus luces intermitentes
    a un lado de una carretera de Michigan con al menos dos carriles moviéndose en
    su dirección, usted debe:'
  choices:
    A: Detenerse y esperar a que el vehículo se mueva
    B: Mantener la velocidad pero cambiarse al carril izquierdo
    C: Cambiarse de carril, o si no es seguro, reducir la velocidad y pasar con precaución
    D: Tocar la bocina para alertar a los trabajadores de emergencia
  answer: C
  explanation: La ley 'Move Over' de Michigan exige que los conductores se cambien
    de carril ante vehículos de emergencia estacionados con luces intermitentes. Si
    cambiarse de carril no es seguro, el conductor debe reducir la velocidad y pasar
    con precaución.
- id: 211
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para indicar una parada o una disminución
    de velocidad?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho extendido recto hacia afuera
  answer: C
  explanation: Para señalar una parada o disminución de velocidad usando señales manuales,
    extienda el brazo izquierdo hacia abajo con la palma hacia atrás.
- id: 212
  category: signs_and_signals
  question: 'En Michigan, una señal de "Multas dobles en zonas de obras" (Double Fines
    in Work Zones) significa que las multas de tráfico se duplican por:'
  choices:
    A: Todas las infracciones cometidas dentro de la zona de obras
    B: Solo infracciones por exceso de velocidad cuando hay trabajadores presentes
    C: Todas las infracciones de movimiento cuando hay trabajadores presentes
    D: Infracciones de estacionamiento dentro de la zona de obras
  answer: C
  explanation: Según la ley de Michigan, las multas se duplican por infracciones de
    movimiento en zonas de obras cuando hay trabajadores presentes.
- id: 213
  category: signs_and_signals
  question: 'Cuando un semáforo está apagado (sin luz) debido a un corte de energía
    en Michigan, debe tratar la intersección como:'
  choices:
    A: Una parada de dos vías
    B: Una señal de ceder el paso (yield)
    C: Una parada de cuatro vías (four-way stop)
    D: Una carretera abierta
  answer: C
  explanation: Si un semáforo no funciona debido a una falla de energía, la ley de
    Michigan exige que los conductores traten la intersección como una parada de cuatro
    vías (four-way stop).
- id: 214
  category: signs_and_signals
  question: 'Una línea amarilla continua en su lado de una línea central amarilla
    discontinua significa:'
  choices:
    A: Puede rebasar si es seguro
    B: Rebasar está prohibido en su lado
    C: La carretera adelante es de un solo sentido
    D: Debe detenerse antes de continuar
  answer: B
  explanation: Una línea amarilla continua en su lado de la línea central indica una
    zona de no rebasar para su dirección de viaje.
- id: 215
  category: signs_and_signals
  question: En Michigan, al acercarse a un cruce de ferrocarril con luces rojas intermitentes
    y campanas, debe detenerse a una distancia no menor de cuántos pies del riel más
    cercano?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: B
  explanation: La ley de Michigan exige que los conductores se detengan al menos a
    15 pies, pero no más de 50 pies, del riel más cercano en un cruce de ferrocarril
    cuando las señales indican que se acerca un tren.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 216
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 217
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en rampas de salida de autopistas o calles de un solo sentido donde entrar
    lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 218
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Dar una vuelta en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 219
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda únicamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 220
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 221
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 222
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 223
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín de color blanco y negro que dice "NO
    PASSING ZONE" significa que no se le permite rebasar a otros vehículos en esta
    área. Marca el inicio de una zona de no rebasar.
  id: 224
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "KEEP RIGHT" (Manténgase a la derecha)
    con una flecha significa que debe mantenerse al lado derecho de una isla de tráfico,
    mediana u obstrucción.
  id: 225
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 226
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 227
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la carretera.
  id: 228
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 229
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras "R" es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 230
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 231
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 232
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 233
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 234
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 235
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 236
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 237
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 238
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Una zona de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 239
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 240
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Camino sinuoso más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 241
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 242
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 243
