metadata:
  source: What Every Driver Must Know (Oct 2025 ed.) (Michigan.gov/SOS)
  source_original: What Every Driver Must Know (Oct 2025 ed.) (Michigan.gov/SOS)
  total_questions: 350
  language: es
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: safe_driving_rules
  question: ¿Según el manual, cuál es la regla con respecto al uso del teléfono celular
    mientras se conduce?
  choices:
    A: Está permitido para adultos pero prohibido para adolescentes.
    B: Está prohibido para todos los conductores, incluidos los adolescentes.
    C: Está permitido solo en emergencias.
    D: Se permite si se utiliza un dispositivo de manos libres.
  answer: B
  explanation: El manual establece explícitamente en su sección de leyes de tránsito
    que el uso del teléfono celular está 'prohibido para todos los conductores, incluidos
    los adolescentes'.
- id: 2
  category: license_system
  question: ¿Qué programa de licencias se aplica específicamente a los conductores
    menores de 18 años?
  choices:
    A: El Programa de Licencia Probatoria
    B: El Programa de Licencia de Chofer
    C: Licencia de Conducir Graduada (GDL)
    D: El Programa de Licencia de Conducir Comercial
  answer: C
  explanation: El manual incluye una sección específica en el Capítulo 1 titulada
    'Menores de 18 años – Licencia de conducir graduada'.
- id: 3
  category: safe_driving_rules
  question: ¿Qué establece explícitamente el manual sobre el uso del cinturón de seguridad?
  choices:
    A: Es recomendado pero opcional.
    B: Solo es obligatorio para pasajeros menores de 18 años.
    C: Solo es obligatorio en autopistas.
    D: Abrocharse el cinturón es la ley.
  answer: D
  explanation: El manual contiene una sección bajo las Leyes de Tránsito titulada
    explícitamente '¡Abróchese el cinturón, es la ley!'.
- id: 4
  category: penalties_and_points
  question: ¿En qué capítulo del manual encontraría información sobre el sistema de
    puntos de Michigan?
  choices:
    A: 'Capítulo 1: Su licencia de conducir'
    B: 'Capítulo 2: Su historial de conducción'
    C: 'Capítulo 4: Leyes de tránsito'
    D: 'Capítulo 5: Señales, marcas viales y semáforos'
  answer: B
  explanation: 'Según el índice, el ''Sistema de puntos de Michigan'' se trata en
    el Capítulo 2: Su historial de conducción.'
- id: 5
  category: license_system
  question: Según el manual, ¿por qué razón específica podría un conductor recibir
    una licencia restringida?
  choices:
    A: Una condición de salud
    B: Multas de estacionamiento no pagadas
    C: Falta de seguro del vehículo
    D: Reprobar el examen de la vista
  answer: A
  explanation: El Capítulo 1 del manual incluye una sección titulada 'Licencia restringida
    debido a una condición de salud'.
- id: 6
  category: sharing_the_road
  question: ¿Qué frase utiliza el manual para describir la relación entre los trenes
    y los vehículos en los cruces a nivel?
  choices:
    A: Los trenes y los vehículos siempre tienen el derecho de paso
    B: Los trenes y los vehículos NO SE MEZCLAN
    C: Los vehículos deben acelerar para ganarle a los trenes
    D: Los trenes deben ceder el paso a los vehículos
  answer: B
  explanation: El manual incluye una sección específica de consejos de seguridad en
    cruces a nivel titulada 'Los trenes y los vehículos NO SE MEZCLAN'.
- id: 7
  category: sharing_the_road
  question: ¿Cuál de las siguientes situaciones específicas de derecho de paso se
    cubre explícitamente en el Capítulo 4 del manual?
  choices:
    A: Derecho de paso y bicicletas
    B: Derecho de paso y equipo agrícola
    C: Derecho de paso y funerales
    D: Derecho de paso y desfiles
  answer: C
  explanation: El Capítulo 4 (Leyes de tránsito) incluye una sección específica titulada
    'Derecho de paso y funerales'.
- id: 8
  category: signs_and_signals
  question: ¿Dónde buscaría un conductor en el manual para aprender sobre los colores
    de las señales de tráfico?
  choices:
    A: Capítulo 1
    B: Capítulo 2
    C: Capítulo 3
    D: Capítulo 5
  answer: D
  explanation: 'El tema ''Colores de las señales de tráfico'' se encuentra en el Capítulo
    5: Señales, marcas viales y semáforos.'
- id: 9
  category: license_system
  question: Al solicitar una licencia, ¿cuál de los siguientes requisitos se enumera
    explícitamente en el manual?
  choices:
    A: Prueba de empleo
    B: Prueba de propiedad del vehículo
    C: Prueba de presencia legal
    D: Prueba de graduación de la escuela secundaria
  answer: C
  explanation: El Capítulo 1 enumera varios requisitos para obtener la licencia, incluyendo
    'Proporcionar prueba de presencia legal'.
- id: 10
  category: driver_responsibility
  question: Junto con las identificaciones estatales, ¿qué otro tema se trata en el
    Capítulo 3?
  choices:
    A: Registro de vehículos
    B: Registro de votantes
    C: Donación de órganos
    D: Servicio de jurado
  answer: B
  explanation: El Capítulo 3 se titula 'Registro de votantes e identificaciones estatales'.
- id: 11
  category: signs_and_signals
  question: ¿Qué tipo de señal se menciona específicamente en el manual con respecto
    a los cruces de ferrocarril?
  choices:
    A: Señal del Sistema de Notificación de Emergencia (ENS)
    B: Señal de advertencia de tren de alta velocidad
    C: Señal de zona de silencio
    D: Señal de prohibido el paso
  answer: A
  explanation: El manual incluye una sección bajo Cruces de ferrocarril titulada "¿Qué
    es una señal del Sistema de Notificación de Emergencia?".
- id: 12
  category: safe_driving_rules
  question: ¿Qué tipo específico de estacionamiento para personas con discapacidad
    se destaca en la sección de leyes de tránsito del manual?
  choices:
    A: Estacionamiento para personas con discapacidad accesible para motocicletas
    B: Estacionamiento para personas con discapacidad accesible para furgonetas (vans)
    C: Estacionamiento para personas con discapacidad accesible para vehículos recreativos
      (RV)
    D: Estacionamiento para personas con discapacidad accesible para vehículos comerciales
  answer: B
  explanation: En la sección de Estacionamiento del Capítulo 4, hay un encabezado
    específico para "Estacionamiento para personas con discapacidad accesible para
    furgonetas".
- id: 13
  category: signs_and_signals
  question: ¿En qué dos tipos categoriza el manual los sistemas de control de cruces
    de ferrocarril?
  choices:
    A: Manuales y automáticos
    B: Primarios y secundarios
    C: Pasivos y activos
    D: Iluminados y no iluminados
  answer: C
  explanation: 'El manual enumera dos secciones específicas para estos sistemas: "Sistemas
    pasivos de control de cruces de ferrocarril" y "Sistemas activos de control de
    cruces de ferrocarril".'
- id: 14
  category: license_system
  question: ¿Qué tipo específico de Permiso de Instrucción Temporal (TIP) se enumera
    explícitamente en el manual?
  choices:
    A: El TIP comercial
    B: El TIP para motocicletas
    C: El TIP agrícola
    D: El TIP para choferes
  answer: B
  explanation: En la sección "Permiso de instrucción temporal" del Capítulo 1, el
    manual enumera específicamente "El TIP para motocicletas".
- id: 15
  category: license_system
  question: ¿El manual contiene una sección específica para personas que nunca han
    tenido licencia a partir de qué edad?
  choices:
    A: 16 años o más
    B: 18 años o más
    C: 21 años o más
    D: 25 años o más
  answer: B
  explanation: El Capítulo 1 incluye una sección específica titulada "18 años o más
    – nunca ha tenido licencia".
- id: 16
  category: signs_and_signals
  question: ¿Cuál de los siguientes es un tipo específico de cabezal de señal de giro
    a la izquierda mencionado en el manual?
  choices:
    A: Flecha roja intermitente
    B: Flecha amarilla intermitente
    C: Flecha roja fija
    D: Flecha verde intermitente
  answer: B
  explanation: El manual enumera específicamente el "Cabezal de señal de giro a la
    izquierda con flecha amarilla intermitente" en la sección de señales de tránsito.
- id: 17
  category: signs_and_signals
  question: ¿De qué color son los símbolos triangulares utilizados en las marcas del
    pavimento?
  choices:
    A: Amarillo
    B: Rojo
    C: Blanco
    D: Naranja
  answer: C
  explanation: La sección de marcas en el pavimento del manual menciona específicamente
    "Símbolos triangulares blancos".
- id: 18
  category: signs_and_signals
  question: ¿Qué tipo de baliza se asocia específicamente con los cruces de peatones
    en el manual?
  choices:
    A: Baliza Híbrida para Peatones (PHB)
    B: Baliza intermitente de paso de peatones
    C: Baliza roja fija
    D: Baliza de advertencia para peatones
  answer: A
  explanation: El manual enumera la "Baliza Híbrida para Peatones" (Pedestrian Hybrid
    Beacon) en la sección de señales para peatones.
- id: 19
  category: signs_and_signals
  question: Según la sección del manual sobre señales de tránsito, ¿cuál de las siguientes
    es una configuración de cabezal de señal reconocida?
  choices:
    A: La señal de cabezal de 3 secciones
    B: La señal de cabezal de 4 secciones
    C: La señal de cabezal de 5 secciones
    D: La señal de cabezal de 6 secciones
  answer: C
  explanation: La sección de señales de tránsito del manual cubre específicamente
    "La señal de cabezal de 5 secciones".
- id: 20
  category: defensive_driving
  question: ¿Qué tipo específico de choque con animales se destaca en la sección de
    emergencias del manual?
  choices:
    A: Choques vehículo-oso
    B: Choques vehículo-perro
    C: Choques vehículo-alce
    D: Choques vehículo-venado
  answer: D
  explanation: El Capítulo 7 trata sobre emergencias y analiza específicamente los
    "Choques entre vehículos y venados" y su mejor defensa contra ellos.
- id: 21
  category: safe_driving_rules
  question: ¿Cuál de las siguientes condiciones climáticas se agrupan específicamente
    en la sección del manual sobre mal tiempo?
  choices:
    A: Viento y granizo
    B: Lluvia y niebla
    C: Nieve y aguanieve
    D: Tornados e inundaciones
  answer: B
  explanation: En la sección sobre mal tiempo, el manual agrupa específicamente 'Lluvia
    y niebla'.
- id: 22
  category: safe_driving_rules
  question: ¿Qué condición específica se enumera como un peligro de conducir en autopistas?
  choices:
    A: Fatiga en la autopista
    B: Hipnosis de carretera
    C: Retrasos en las cabinas de peaje
    D: Exceso de velocidad en las rampas de salida
  answer: A
  explanation: El manual enumera la 'Fatiga en la autopista' como un tema específico
    dentro de la conducción en autopistas.
- id: 23
  category: signs_and_signals
  question: ¿Bajo qué categoría de marcas en el pavimento se analizan los 'carriles
    centrales solo para girar a la izquierda'?
  choices:
    A: Líneas blancas
    B: Líneas amarillas
    C: Líneas rojas
    D: Líneas azules
  answer: B
  explanation: En la sección de marcas en el pavimento, el 'carril central solo para
    girar a la izquierda' se clasifica bajo 'Líneas amarillas'.
- id: 24
  category: signs_and_signals
  question: ¿Cuál de las siguientes se enumera como un tipo de marca de línea blanca
    en el pavimento?
  choices:
    A: Líneas blancas discontinuas
    B: Líneas blancas onduladas
    C: Líneas blancas en zigzag
    D: Líneas blancas punteadas
  answer: A
  explanation: El manual enumera las 'Líneas blancas discontinuas' como un tipo específico
    de marca de línea blanca en el pavimento.
- id: 25
  category: sharing_the_road
  question: ¿Qué tipo de vehículo se menciona específicamente junto con las motocicletas,
    motonetas (scooters) y ciclomotores (mopeds) en el capítulo sobre compartir la
    carretera?
  choices:
    A: Tablas flotantes (hoverboards)
    B: Bicicletas
    C: Carritos de golf
    D: Vehículos todo terreno (ATVs)
  answer: B
  explanation: El Capítulo 6 sobre compartir la carretera agrupa 'Motocicletas, motonetas,
    ciclomotores y bicicletas'.
- id: 26
  category: sharing_the_road
  question: ¿Cuál de los siguientes es un vehículo categorizado específicamente en
    el capítulo 'Compartir la carretera'?
  choices:
    A: Triciclos
    B: Autociclos (autocycles)
    C: Sidecars
    D: Tri-bikes
  answer: B
  explanation: 'El manual incluye una sección específica sobre ''Autociclos'' en el
    Capítulo 6: Compartir la carretera.'
- id: 27
  category: signs_and_signals
  question: ¿Qué tipo de flecha se enumera específicamente como una señal de tráfico
    fija?
  choices:
    A: Flecha roja fija
    B: Flecha amarilla fija
    C: Flecha verde fija
    D: Flecha azul fija
  answer: C
  explanation: La sección de señales de tráfico enumera específicamente la 'Flecha
    verde fija'.
- id: 28
  category: signs_and_signals
  question: Según el manual, ¿qué tipo de líneas se utilizan para los cruces peatonales
    y las líneas de parada?
  choices:
    A: Líneas amarillas
    B: Líneas blancas
    C: Líneas rojas
    D: Líneas verdes
  answer: B
  explanation: El manual clasifica tanto las 'Líneas de cruce peatonal' como las 'Líneas
    de parada' bajo la sección de 'Líneas blancas' de las marcas en el pavimento.
- id: 29
  category: defensive_driving
  question: ¿Cuál de los siguientes es un tema específico cubierto en 'Emergencias
    y situaciones especiales'?
  choices:
    A: Conducción agresiva
    B: Estacionamiento en paralelo
    C: Renovación de su licencia
    D: Compra de un vehículo
  answer: A
  explanation: El Capítulo 7, que trata sobre Emergencias y situaciones especiales,
    incluye una sección sobre 'Conducción agresiva'.
- id: 30
  category: driver_responsibility
  question: 'Según el manual del conductor de Michigan, conducir se considera:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio y no un derecho
    C: Un derecho para los residentes mayores de 18 años
    D: Un privilegio opcional para los no residentes
  answer: B
  explanation: El manual establece explícitamente en la Introducción que 'Conducir
    es un privilegio y no un derecho'.
- id: 31
  category: driver_responsibility
  question: ¿En 2023, cuántos choques en Michigan fueron el resultado de que un conductor,
    peatón o ciclista usara un teléfono celular?
  choices:
    A: 1,021
    B: 1,725
    C: 2,284
    D: 51,097
  answer: C
  explanation: Según los datos de choques de Michigan de 2023, un total de 2,284 choques
    fueron el resultado de que un conductor, peatón o ciclista usara un teléfono celular.
- id: 32
  category: alcohol_drugs_health
  question: ¿Qué porcentaje de los choques fatales en Michigan en 2023 estuvieron
    relacionados con el alcohol?
  choices:
    A: 6.6%
    B: 10.1%
    C: 26.6%
    D: 50.0%
  answer: C
  explanation: El manual establece que de los 1,021 choques fatales que ocurrieron
    en Michigan, 272 (26.6%) estuvieron relacionados con el alcohol.
- id: 33
  category: driver_responsibility
  question: Aunque los conductores con licencia de entre 15 y 20 años representan
    solo el 6.6 por ciento de la población de conductores de Michigan, ¿qué porcentaje
    de conductores representan en todos los choques?
  choices:
    A: 6.6%
    B: 8.2%
    C: 10.1%
    D: 26.6%
  answer: C
  explanation: Los datos de choques de 2023 señalan que los conductores en el grupo
    de edad de 15 a 20 años representaron el 10.1 por ciento de los conductores en
    todos los choques.
- id: 34
  category: driver_responsibility
  question: Al inscribirse en el Registro de Donantes de Órganos de Michigan, ¿usted
    acepta convertirse en donante para salvar hasta cuántas vidas?
  choices:
    A: 4 vidas
    B: 8 vidas
    C: 12 vidas
    D: 125 vidas
  answer: B
  explanation: Inscribirse en el Registro de Donantes de Órganos de Michigan significa
    que usted acepta convertirse en donante de órganos, ojos y tejidos para salvar
    hasta 8 vidas y, potencialmente, sanar hasta a otras 125 personas.
- id: 35
  category: driver_responsibility
  question: ¿Cuál es el límite de edad para inscribirse en el Registro de Donantes
    de Órganos de Michigan?
  choices:
    A: Debe tener al menos 16 años.
    B: Debe tener al menos 18 años.
    C: Debe ser menor de 65 años.
    D: No hay límite de edad para la donación de órganos y tejidos.
  answer: D
  explanation: El manual establece, bajo los datos sobre la donación de órganos, que
    'No hay límite de edad para la donación de órganos y tejidos'.
- id: 36
  category: license_system
  question: ¿Qué sucede con su licencia de conducir de otro estado cuando se acepta
    su solicitud para una licencia de Michigan?
  choices:
    A: Es destruida por la Secretaría de Estado.
    B: Se invalida y se le devuelve.
    C: Sigue siendo válida por 30 días.
    D: Se envía de vuelta a su estado de residencia anterior.
  answer: B
  explanation: Cuando se acepta su solicitud para una licencia de Michigan, su licencia
    de conducir de otro estado será invalidada y se le devolverá.
- id: 37
  category: license_system
  question: Si usted es un nuevo residente de Michigan y su licencia de conducir de
    otro estado está suspendida o revocada, ¿qué debe hacer antes de solicitar una
    licencia de Michigan?
  choices:
    A: Pagar una multa a la Secretaría de Estado de Michigan.
    B: Esperar 36 meses antes de presentar la solicitud.
    C: Contactar a su estado anterior para resolver cualquier problema pendiente.
    D: Tomar un curso de conducción correctiva en Michigan.
  answer: C
  explanation: Si su licencia de conducir de otro estado está suspendida o revocada,
    debe contactar a su estado anterior para resolver cualquier problema pendiente
    antes de que se acepte su solicitud para una licencia de Michigan.
- id: 38
  category: license_system
  question: NO se le otorgará una licencia de conducir de Michigan si nunca se le
    ha emitido una licencia y tiene ¿cuántas condenas por infracciones de tránsito
    (moving violations) en su historial de manejo dentro de los tres años anteriores
    a la solicitud?
  choices:
    A: Una o más
    B: Dos o más
    C: Tres o más
    D: Cuatro o más
  answer: B
  explanation: No se le otorgará una licencia de Michigan si nunca se le ha emitido
    una licencia de conducir en ningún estado o país Y tiene dos o más condenas por
    infracciones de tránsito en su historial de manejo dentro de los tres años anteriores
    a la fecha en que realice la solicitud.
- id: 39
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener una licencia de chofer
    en Michigan?
  choices:
    A: '14'
    B: '16'
    C: '18'
    D: '21'
  answer: B
  explanation: 'En la sección de la licencia de chofer, el manual establece: ''Debe
    tener al menos 16 años de edad''.'
- id: 40
  category: license_system
  question: 'Se requiere una licencia de chofer si usted es empleado con el propósito
    principal de operar un vehículo motorizado con una Clasificación de Peso Bruto
    Vehicular (GVWR) de al menos:'
  choices:
    A: 5,000 libras
    B: 10,000 libras
    C: 15,000 libras
    D: 26,001 libras
  answer: B
  explanation: Se requiere una licencia de chofer si usted es empleado con el propósito
    principal de operar un vehículo motorizado con una Clasificación de Peso Bruto
    Vehicular (GVWR) de 10,000 libras o más.
- id: 41
  category: license_system
  question: ¿Qué edad mínima debe tener antes de poder operar un vehículo motorizado
    comercial a través de las fronteras estatales?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: 'El manual establece: ''Debe tener al menos 21 años para conducir un
    vehículo a través de las fronteras estatales o para transportar materiales peligrosos
    en cantidades que requieran señalización (placarding)''.'
- id: 42
  category: license_system
  question: 'Los conductores de entre 18 y 21 años que poseen una licencia de conducir
    comercial (CDL) están restringidos a operar un vehículo comercial:'
  choices:
    A: Solo durante las horas del día
    B: Solo en Michigan
    C: Solo con un pasajero con licencia mayor de 21 años
    D: Solo para fines agrícolas
  answer: B
  explanation: Según la sección de Licencia de conducir comercial, 'Los conductores
    de entre 18 y 21 años pueden operar un vehículo comercial solo en Michigan'.
- id: 43
  category: license_system
  question: ¿Durante cuántos meses debe haber estado libre de suspensiones antes de
    la fecha de solicitud para poder operar vehículos motorizados comerciales?
  choices:
    A: 12 meses
    B: 24 meses
    C: 36 meses
    D: 48 meses
  answer: C
  explanation: Antes de poder operar vehículos motorizados comerciales, debe tener
    al menos 18 años, haber estado libre de suspensiones durante 36 meses antes de
    la fecha de solicitud y tener la designación de grupo de CDL de Michigan correspondiente.
- id: 44
  category: license_system
  question: Según la ley de Michigan, ¿cuántas licencias de conducir válidas se le
    permite tener a un conductor a la vez?
  choices:
    A: Una
    B: Dos (una personal, una comercial)
    C: Una de cada estado de residencia
    D: Hasta tres
  answer: A
  explanation: 'El manual establece explícitamente: ''La ley de Michigan permite que
    los conductores tengan solo una licencia de conducir válida a la vez''.'
- id: 45
  category: license_system
  question: ¿Qué edad debe tener para conducir un vehículo comercial a través de las
    fronteras estatales o transportar materiales peligrosos que requieran señalización
    (placarding)?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: Según el manual, debe tener al menos 21 años para conducir un vehículo
    comercial a través de las fronteras estatales o para transportar materiales peligrosos
    en cantidades que requieran señalización (placarding).
- id: 46
  category: license_system
  question: ¿Desde cuál de los siguientes lugares le permite una licencia de conducir
    mejorada (Enhanced driver's license) volver a ingresar a los Estados Unidos por
    tierra o mar sin documentos de identidad adicionales?
  choices:
    A: Europa y Asia
    B: Canadá, México, Bermudas y el Caribe
    C: América del Sur y América Central
    D: Cualquier país extranjero
  answer: B
  explanation: La licencia de conducir mejorada le permite volver a ingresar a los
    Estados Unidos por tierra o mar desde Canadá, México, Bermudas y el Caribe sin
    la necesidad de presentar ningún documento de identidad adicional.
- id: 47
  category: license_system
  question: ¿A qué edad puede un adolescente sin licencia solicitar una licencia de
    ciclomotor (moped) con la aprobación de los padres?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: B
  explanation: Los adolescentes sin licencia de 15 años o más con aprobación de los
    padres pueden solicitar una licencia de ciclomotor en una oficina de la Secretaría
    de Estado.
- id: 48
  category: driver_testing
  question: ¿Cuándo se requiere un curso de educación para motociclistas para un solicitante
    adulto?
  choices:
    A: Cuando nunca han conducido un automóvil
    B: Cuando reprueban el examen de habilidades de motocicleta dos veces
    C: Cuando tienen más de 65 años
    D: Cuando quieren conducir una motocicleta de tres ruedas
  answer: B
  explanation: Se requiere un curso de educación para motociclistas para adolescentes
    de 16 a 17 años y para adultos que reprueban el examen de habilidades de motocicleta
    dos veces.
- id: 49
  category: license_system
  question: ¿Qué endoso se requiere para una camioneta pickup que remolca un remolque
    de quinta rueda diseñado para vivienda recreativa, con un segundo remolque enganchado
    en la parte trasera?
  choices:
    A: Endoso de agricultor (Farmer endorsement)
    B: Licencia de conducir comercial (CDL)
    C: Endoso recreativo doble "R" (Recreational Double "R")
    D: Restricción CY 3W
  answer: C
  explanation: El endoso recreativo doble "R" es necesario para una camioneta pickup
    que remolca un remolque de quinta rueda diseñado para fines de vivienda recreativa,
    con un segundo remolque enganchado en la parte trasera.
- id: 50
  category: license_system
  question: A partir del 7 de mayo de 2025, ¿qué tipo de documento deben presentar
    los residentes de Michigan para abordar un vuelo nacional en los Estados Unidos?
  choices:
    A: Una licencia de conducir estándar de Michigan
    B: Un documento que cumpla con REAL ID
    C: Un certificado de nacimiento
    D: Una tarjeta de registro de votante
  answer: B
  explanation: A partir del 7 de mayo de 2025, los residentes de Michigan que aborden
    un avión para viajes nacionales en los Estados Unidos deben presentar un documento
    que cumpla con REAL ID.
- id: 51
  category: license_system
  question: ¿Cómo puede saber si una licencia de conducir estándar de Michigan o una
    tarjeta de identificación estatal cumple con la ley REAL ID?
  choices:
    A: Tiene un código de barras en la parte delantera
    B: Está impresa en plástico azul
    C: Tiene una estrella en un círculo dorado o una estrella en una imagen de Michigan
    D: Tiene un microchip incrustado
  answer: C
  explanation: Sabrá que una licencia de conducir de Michigan o una tarjeta de identificación
    estatal cumple con REAL ID porque tiene una estrella en un círculo dorado o una
    estrella en una imagen de Michigan impresa en la esquina superior derecha.
- id: 52
  category: license_system
  question: Si decide no obtener una tarjeta que cumpla con REAL ID, ¿qué se imprimirá
    en su licencia estándar de Michigan?
  choices:
    A: No válida para conducir (Invalid for Driving)
    B: No para identificación federal (Not for Federal Identification)
    C: Solo para uso estatal (State Use Only)
    D: Identificación temporal (Temporary ID)
  answer: B
  explanation: Si decide no obtener una tarjeta que cumpla con REAL ID, su licencia
    estándar de Michigan o tarjeta de identificación estatal tendrá impreso "Not for
    Federal Identification" (No para identificación federal).
- id: 53
  category: driver_testing
  question: Si se muda a Michigan desde Alemania, ¿qué exámenes se omiten al convertir
    su licencia de conducir?
  choices:
    A: Solo el examen de la vista
    B: El examen de conocimientos por escrito, el TIP y el examen de habilidades de
      conducción
    C: Solo el examen de habilidades de conducción
    D: No se omite ningún examen
  answer: B
  explanation: Si usted es de otro estado de EE. UU., Canadá, Alemania o la República
    de Corea (Corea del Sur), puede convertir su licencia de conducir a una de Michigan
    sin realizar el examen de conocimientos por escrito, el TIP o el examen de habilidades
    de conducción.
- id: 54
  category: driver_testing
  question: ¿Cuál es la edad mínima para solicitar el Segmento 1 de educación vial?
  choices:
    A: 14 años
    B: 14 años y 8 meses
    C: 15 años
    D: 16 años
  answer: B
  explanation: Para solicitar el Segmento 1 de educación vial, debe tener al menos
    14 años y 8 meses y contar con el permiso de su padre, madre o tutor.
- id: 55
  category: safe_driving_rules
  question: Bajo una Licencia de Aprendiz de Nivel 1 del sistema GDL, ¿quién debe
    estar sentado en el asiento delantero junto al conductor adolescente?
  choices:
    A: Cualquier conductor con licencia de 18 años o más
    B: Un padre, tutor o adulto designado con licencia de 21 años o más
    C: Un hermano con una licencia de Nivel 2
    D: Solo un instructor de manejo certificado
  answer: B
  explanation: Una vez que se emite la Licencia de Aprendiz de Nivel 1, solo puede
    conducir con un padre, tutor o adulto designado con licencia de 21 años o más
    sentado en el asiento delantero junto a usted.
- id: 56
  category: safe_driving_rules
  question: ¿Qué prohíbe la Ley de Kelsey (Kelsey's Law) para los conductores que
    tienen una Licencia de Aprendiz de Nivel 1?
  choices:
    A: Conducir entre la medianoche y las 5 a. m.
    B: Tener más de un pasajero en el vehículo
    C: Usar un teléfono celular mientras conduce
    D: Conducir en autopistas interestatales
  answer: C
  explanation: La Ley de Kelsey le prohíbe usar un teléfono celular mientras conduce
    si tiene una Licencia de Aprendiz de Nivel 1.
- id: 57
  category: driver_testing
  question: ¿Cuántas horas de tiempo de conducción supervisada deben registrarse antes
    de solicitar el Segmento 2 de educación vial?
  choices:
    A: 20 horas
    B: 30 horas (incluyendo 2 horas de noche)
    C: 40 horas
    D: 50 horas (incluyendo 10 horas de noche)
  answer: B
  explanation: Para solicitar el Segmento 2, debe presentar un registro de conducción
    de al menos 30 horas de tiempo de conducción supervisada (incluyendo un mínimo
    de 2 horas de noche).
- id: 58
  category: driver_testing
  question: ¿Cuál es la edad mínima para solicitar el examen de habilidades de conducción
    bajo el programa de Licencia de Conducir Graduada (GDL)?
  choices:
    A: 14 años y 9 meses
    B: 15 años
    C: 15 años y 6 meses
    D: 16 años
  answer: B
  explanation: Para solicitar el examen de habilidades de conducción, debe tener al
    menos 15 años y haber completado el Segmento 2, además de un mínimo de 50 horas
    de tiempo de conducción supervisada.
- id: 59
  category: license_system
  question: ¿Cuánto tiempo debe un adolescente tener una Licencia de Aprendiz de Nivel
    1 antes de poder solicitar una Licencia Intermedia de Nivel 2 del GDL?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 9 meses
    D: Al menos 12 meses
  answer: B
  explanation: Para solicitar una Licencia Intermedia de Nivel 2 del GDL, debe tener
    al menos 16 años y haber tenido su Licencia de Aprendiz de Nivel 1 durante al
    menos 6 meses.
- id: 60
  category: license_system
  question: ¿Cuáles son los requisitos de edad mínima y periodo de tenencia para solicitar
    una Licencia Intermedia de Nivel 2 del GDL?
  choices:
    A: 15 años de edad, haber tenido el Nivel 1 por 3 meses
    B: 16 años de edad, haber tenido el Nivel 1 por 6 meses
    C: 16 años de edad, haber tenido el Nivel 1 por 12 meses
    D: 17 años de edad, haber tenido el Nivel 1 por 6 meses
  answer: B
  explanation: Según el manual, para solicitar una Licencia Intermedia de Nivel 2
    del GDL, debe tener al menos 16 años y haber tenido su Licencia de Aprendiz de
    Nivel 1 durante al menos 6 meses.
- id: 61
  category: license_system
  question: Bajo una Licencia Intermedia de Nivel 2 (GDL), ¿entre qué horas se le
    prohíbe generalmente conducir a menos que se aplique una excepción?
  choices:
    A: 9 p.m. y 6 a.m.
    B: 10 p.m. y 5 a.m.
    C: 11 p.m. y 5 a.m.
    D: Medianoche y 6 a.m.
  answer: B
  explanation: Las restricciones de la Licencia Intermedia de Nivel 2 le prohíben
    conducir entre las 10 p.m. y las 5 a.m., a menos que esté acompañado por un adulto
    designado o que conduzca por motivos de empleo o actividades autorizadas.
- id: 62
  category: license_system
  question: ¿Cuántos pasajeros menores de 21 años se le permite tener en el vehículo
    mientras conduce con una Licencia Intermedia de Nivel 2, asumiendo que no se aplican
    excepciones?
  choices:
    A: Cero
    B: No más de uno
    C: No más de dos
    D: No más de tres
  answer: B
  explanation: El manual establece que no puede tener más de un pasajero menor de
    21 años en el vehículo con usted en cualquier momento, a menos que se aplique
    una excepción (como familiares directos o estar acompañado por un adulto).
- id: 63
  category: safe_driving_rules
  question: ¿Qué prohíbe la Ley de Kelsey (Kelsey's Law)?
  choices:
    A: Conducir entre las 10 p.m. y las 5 a.m.
    B: Tener más de un pasajero menor de 21 años
    C: Usar un teléfono mientras conduce, excepto en emergencias
    D: Conducir sin un adulto con licencia mayor de 21 años
  answer: C
  explanation: Bajo la Ley de Kelsey, no puede usar un teléfono mientras conduce,
    excepto en casos de emergencia. Los infractores podrían enfrentar una infracción
    civil.
- id: 64
  category: license_system
  question: Para ser elegible para una Licencia Completa de Nivel 3 (GDL), ¿cuántos
    meses consecutivos debe haber conducido sin una infracción de tránsito en movimiento,
    un accidente con culpabilidad o una violación de las restricciones de la GDL?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: D
  explanation: Para ser elegible para una Licencia Completa de Nivel 3 (GDL), debe
    haber conducido durante 12 meses consecutivos sin una infracción de tránsito en
    movimiento, un accidente con culpabilidad, una suspensión de licencia o una violación
    de cualquier restricción de la GDL.
- id: 65
  category: driver_testing
  question: Si tiene 18 años o más y nunca ha tenido una licencia, ¿cuánto tiempo
    debe practicar la conducción con un Permiso de Instrucción Temporal (TIP) antes
    de realizar un examen de habilidades de conducción?
  choices:
    A: Al menos 14 días
    B: Al menos 30 días
    C: Al menos 60 días
    D: Al menos 90 días
  answer: B
  explanation: El manual establece que si tiene 18 años o más y nunca ha tenido una
    licencia, debe practicar la conducción con un adulto con licencia durante al menos
    30 días antes de realizar un examen de habilidades de conducción.
- id: 66
  category: license_system
  question: Si no tiene un número de Seguro Social, debe presentar una carta de inelegibilidad
    de la Administración del Seguro Social. ¿Qué antigüedad máxima puede tener esta
    carta?
  choices:
    A: No más de 30 días de antigüedad
    B: No más de 60 días de antigüedad
    C: No más de 90 días de antigüedad
    D: No más de 1 año de antigüedad
  answer: B
  explanation: Se debe presentar una carta de inelegibilidad de la Administración
    del Seguro Social si no tiene un número de Seguro Social, y la carta no puede
    tener más de 60 días de antigüedad.
- id: 67
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los documentos
    que proporciona como prueba de identidad al solicitar una licencia de conducir?
  choices:
    A: Se aceptan fotocopias de alta calidad
    B: Se aceptan faxes si se envían directamente desde una agencia gubernamental
    C: Solo se aceptarán documentos originales
    D: Se permiten fotos digitales de los documentos en su teléfono inteligente
  answer: C
  explanation: 'Al proporcionar una prueba de identidad, el manual establece explícitamente:
    "Solo se aceptarán documentos originales. No se pueden utilizar fotocopias ni
    faxes".'
- id: 68
  category: license_system
  question: ¿Cuántos documentos que prueben la residencia en Michigan se requieren
    antes de que se pueda procesar su solicitud de licencia de conducir?
  choices:
    A: Al menos uno
    B: Al menos dos
    C: Al menos tres
    D: Al menos cuatro
  answer: B
  explanation: Antes de que se pueda procesar su solicitud de licencia de conducir
    o tarjeta de identificación estatal, debe presentar pruebas de que es residente
    de Michigan, y se requieren al menos dos documentos.
- id: 69
  category: driver_testing
  question: ¿Qué debe hacer si reprueba el examen de la vista en la oficina de la
    Secretaría de Estado?
  choices:
    A: Volver a realizar el examen inmediatamente usando una máquina diferente
    B: Esperar 30 días antes de volver a solicitar la licencia
    C: Hacer que un especialista de la vista complete una declaración de visión
    D: Pagar una tarifa para eximirse del requisito de visión
  answer: C
  explanation: Si reprueba el examen de la vista, su especialista de la vista debe
    completar una declaración de visión que documente que usted cumple con los estándares
    de visión.
- id: 70
  category: driver_testing
  question: Si necesita realizar un examen de conocimientos en una oficina de la Secretaría
    de Estado, ¿cuándo debe llegar?
  choices:
    A: Al menos 30 minutos antes del cierre
    B: Al menos una hora antes del cierre
    C: Al menos dos horas antes del cierre
    D: Exactamente a la hora del cierre
  answer: B
  explanation: Si se requiere que realice un examen de conocimientos, debe llegar
    a la oficina de la Secretaría de Estado al menos una hora antes del cierre para
    permitir suficiente tiempo para completar el examen.
- id: 71
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Instrucción Temporal (TIP)?
  choices:
    A: 60 días
    B: 90 días
    C: 180 días
    D: 365 días
  answer: C
  explanation: Según el manual, un permiso de instrucción temporal (TIP) es válido
    por 180 días.
- id: 72
  category: driver_testing
  question: ¿Cuál es el costo de realizar el examen escrito de conocimientos en línea
    desde casa?
  choices:
    A: Es gratuito
    B: $6.50
    C: $10.00
    D: $15.50
  answer: B
  explanation: Aunque el examen escrito de conocimientos es gratuito en las oficinas
    de la Secretaría de Estado, realizar la versión en línea en casa desde su propia
    computadora o laptop requiere una tarifa de conveniencia de $6.50.
- id: 73
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción permitida para conducir entre
    las 10 p.m. y las 5 a.m. con una Licencia Intermedia de Nivel 2?
  choices:
    A: Conducir a la casa de un amigo para una reunión social
    B: Conducir en el transcurso de su empleo
    C: Conducir a una película nocturna
    D: Conducir solo para practicar para el examen de carretera
  answer: B
  explanation: Las restricciones de la Licencia Intermedia de Nivel 2 prohíben conducir
    entre las 10 p.m. y las 5 a.m., a menos que se esté acompañado por un adulto de
    21 años o más, o si se opera el vehículo en el transcurso del empleo o una actividad
    autorizada.
- id: 74
  category: license_system
  question: Si utiliza una licencia de conducir de otro estado como prueba de identidad,
    ¿cuál es el tiempo máximo que puede estar vencida para que aún sea aceptada?
  choices:
    A: No puede estar vencida en absoluto
    B: Menos de un año
    C: Menos de dos años
    D: Menos de cuatro años
  answer: D
  explanation: Los solicitantes de otros estados y de Canadá pueden usar su licencia
    de conducir de otro estado o canadiense como prueba de identidad, siempre que
    la licencia haya estado vencida por menos de cuatro años.
- id: 75
  category: driver_testing
  question: ¿Cuántos días de práctica de conducción debe completar con un permiso
    de instrucción temporal (TIP) antes de realizar el examen de habilidades de conducción?
  choices:
    A: 14 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Según el manual, debe completar un mínimo de 30 días de práctica de
    conducción con un TIP antes de realizar el examen de habilidades de conducción.
- id: 76
  category: license_system
  question: ¿Por cuánto tiempo se coloca en periodo de prueba a los conductores que
    obtienen su licencia por primera vez?
  choices:
    A: Un mínimo de un año
    B: Un mínimo de dos años
    C: Un mínimo de tres años
    D: Un mínimo de cuatro años
  answer: C
  explanation: Los conductores con licencia por primera vez se colocan en periodo
    de prueba por un mínimo de tres años para supervisar su desempeño al conducir.
- id: 77
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una restricción impuesta a un conductor con
    un permiso de instrucción temporal (TIP) para motocicletas?
  choices:
    A: No se le permite conducir de noche ni llevar pasajeros.
    B: No puede conducir en vías públicas.
    C: Debe conducir solo en áreas designadas fuera de la carretera.
    D: Está restringido a conducir motocicletas de menos de 250 cc.
  answer: A
  explanation: Un TIP de motocicleta impone ciertas restricciones para su seguridad,
    incluyendo que no se le permite conducir de noche ni llevar pasajeros.
- id: 78
  category: license_system
  question: Al conducir con un permiso de instrucción temporal (TIP) para motocicletas,
    ¿debe estar bajo la supervisión visual constante de un operador de motocicleta
    con licencia que tenga al menos qué edad?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Siempre que conduzca con un TIP de motocicleta, debe estar bajo la
    supervisión visual constante de un operador de motocicleta con licencia que tenga
    al menos 18 años de edad.
- id: 79
  category: driver_testing
  question: 'Deberá realizar un examen de habilidades de conducción si su última licencia
    de conducir ha estado vencida por más de:'
  choices:
    A: Un año
    B: Dos años
    C: Tres años
    D: Cuatro años
  answer: D
  explanation: Deberá realizar un examen de habilidades de conducción si su última
    licencia de conducir ha estado vencida por más de cuatro años.
- id: 80
  category: driver_testing
  question: Si es menor de 18 años, ¿cuántas horas de conducción supervisada debe
    haber completado antes de realizar un examen de habilidades de conducción?
  choices:
    A: 30 horas, incluyendo 5 de noche
    B: 40 horas, incluyendo 10 de noche
    C: 50 horas, incluyendo 10 de noche
    D: 60 horas, incluyendo 15 de noche
  answer: C
  explanation: Si es menor de 18 años, debe tener un registro que demuestre que ha
    completado al menos 50 horas de conducción supervisada, incluyendo 10 horas de
    noche.
- id: 81
  category: driver_testing
  question: 'Para ser elegible para un examen de habilidades de conducción, un solicitante
    menor de 18 años no debe haber tenido condenas, infracciones civiles, suspensiones
    de licencia o choques con culpa durante los precedentes:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Los solicitantes menores de 18 años no deben haber tenido condenas,
    infracciones civiles, suspensiones de licencia o choques con culpa durante los
    90 días inmediatamente anteriores al examen de habilidades de conducción.
- id: 82
  category: driver_testing
  question: ¿Quién establece las tarifas y las políticas de precios para los exámenes
    de habilidades de conducción en Michigan?
  choices:
    A: La Secretaría de Estado (Secretary of State)
    B: Las empresas independientes de evaluación de conductores
    C: El Departamento de Transporte
    D: La oficina del secretario del condado local
  answer: B
  explanation: Los exámenes de habilidades de conducción son administrados por empresas
    independientes de evaluación de conductores, y la Secretaría de Estado no establece
    las tarifas ni las políticas de precios de dichos exámenes.
- id: 83
  category: driver_testing
  question: ¿En cuál de los siguientes exámenes NO se permite un intérprete?
  choices:
    A: El examen de conocimientos escritos para una licencia de conducir estándar
    B: El examen de habilidades de conducción para una licencia de conducir estándar
    C: El examen de habilidades de conducción para una licencia de conducir comercial
      (CDL)
    D: El examen de la vista para una licencia de conducir estándar
  answer: C
  explanation: No se permiten intérpretes ni en los exámenes de conocimientos escritos
    ni en el examen de habilidades de conducción para una licencia de conducir comercial
    (CDL).
- id: 84
  category: driver_testing
  question: ¿Qué requiere que apruebe la primera parte del examen de habilidades de
    conducción?
  choices:
    A: Un examen de conducción en carretera en una zona residencial
    B: Una serie de maniobras fuera de la vía pública en un circuito cerrado
    C: Un examen de conocimientos escrito
    D: Una simulación de incorporación a la autopista
  answer: B
  explanation: La primera parte del examen de habilidades de conducción requiere que
    apruebe una serie de maniobras fuera de la vía pública en un circuito cerrado,
    seguidas de un examen de habilidades de conducción en carretera.
- id: 85
  category: alcohol_drugs_health
  question: 'Se requiere una declaración del médico si la Secretaría de Estado (Secretary
    of State) tiene motivos para creer que usted ha tenido un desmayo, pérdida de
    conocimiento o convulsión en los precedentes:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Se requiere una declaración del médico si la Secretaría de Estado tiene
    motivos para creer que usted ha tenido un desmayo, pérdida de conocimiento, convulsión
    u otra pérdida de conciencia en los seis meses anteriores.
- id: 86
  category: alcohol_drugs_health
  question: 'Para obtener una licencia de chofer o una licencia de conducir comercial
    (CDL), no debe haber tenido pérdidas de conocimiento, desmayos o convulsiones
    dentro de los últimos:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 2 años
    D: 3 años
  answer: B
  explanation: Para una licencia de chofer o una licencia de conducir comercial (CDL),
    no debe haber tenido pérdidas de conocimiento, desmayos o convulsiones dentro
    de los últimos 12 meses.
- id: 87
  category: license_system
  question: Si necesita cambiar su nombre en su licencia de conducir, ¿qué debe hacer
    primero?
  choices:
    A: Visitar una oficina de la Secretaría de Estado con su certificado de matrimonio
    B: Cambiar su nombre ante la Administración del Seguro Social (Social Security
      Administration)
    C: Presentar un formulario de cambio de domicilio en línea
    D: Pagar la tarifa de cambio de nombre en el sitio web Michigan.gov
  answer: B
  explanation: Si necesita cambiar su nombre en su licencia de conducir, primero debe
    cambiar su nombre ante la Administración del Seguro Social (Social Security Administration)
    y esperar al menos tres días hábiles antes de visitar una oficina de la Secretaría
    de Estado.
- id: 88
  category: license_system
  question: ¿Cuánto cuesta presentar un cambio de dirección para su licencia de conducir?
  choices:
    A: $5
    B: $10
    C: $15
    D: No tiene costo
  answer: D
  explanation: Puede presentar un cambio de dirección en línea, en una oficina de
    la Secretaría de Estado o por correo. No hay ningún cargo por este servicio.
- id: 89
  category: license_system
  question: ¿Con qué frecuencia debe renovar su licencia de conducir en persona en
    una oficina de la Secretaría de Estado?
  choices:
    A: Cada 4 años
    B: Cada 8 años
    C: Cada 10 años
    D: Cada 12 años
  answer: D
  explanation: Según el manual, debe renovar su licencia de conducir cada 12 años
    en una oficina de la Secretaría de Estado, donde se le realizará un examen de
    la vista y se le tomará una nueva fotografía.
- id: 90
  category: license_system
  question: ¿Cuándo vence una licencia de conducir si el conductor es menor de 21
    años?
  choices:
    A: En su cumpleaños número 18
    B: En su cumpleaños número 21
    C: Exactamente cuatro años después de la fecha de emisión
    D: Cada año en su cumpleaños
  answer: B
  explanation: 'El manual establece: ''Si usted es menor de 21 años, su licencia de
    conducir vence al cumplir los 21 años''.'
- id: 91
  category: penalties_and_points
  question: ¿Cuánto tiempo permanecen los puntos en su historial de conducción?
  choices:
    A: Dos años a partir de la fecha de la condena
    B: Cuatro años a partir de la fecha de la infracción
    C: Siete años a partir de la fecha de la condena
    D: Permanentemente
  answer: A
  explanation: Los puntos colocados en su historial de conducción permanecen allí
    durante dos años a partir de la fecha de la condena.
- id: 92
  category: penalties_and_points
  question: ¿Cuántos puntos se añadirán a su historial de conducción por una condena
    por carreras de velocidad (drag racing)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Bajo el sistema de puntos de Michigan, las carreras de velocidad son
    una infracción de cuatro puntos.
- id: 93
  category: penalties_and_points
  question: ¿Cuál de las siguientes condenas permanece en su historial de conducción
    de forma permanente?
  choices:
    A: Conducción descuidada
    B: Carreras de velocidad (drag racing)
    C: Conducir con facultades disminuidas (impaired driving)
    D: Conducir a 16 mph o más sobre el límite de velocidad legal
  answer: C
  explanation: El manual especifica que una condena por un accidente fatal o por conducir
    con facultades disminuidas permanece en su historial de conducción de forma permanente.
- id: 94
  category: driver_responsibility
  question: ¿Cuál es una posible consecuencia si no cambia su dirección ante la Secretaría
    de Estado (Secretary of State)?
  choices:
    A: Se le cobrará un cargo por pago atrasado.
    B: Su licencia de conducir puede ser suspendida o revocada.
    C: Recibirá 2 puntos en su historial de conducción.
    D: Tendrá que volver a tomar el examen de habilidades de conducción.
  answer: B
  explanation: Su licencia de conducir puede ser suspendida o revocada si no cambia
    su dirección ante la Secretaría de Estado.
- id: 95
  category: penalties_and_points
  question: ¿Bajo qué circunstancias se le requerirá someterse a una reevaluación
    de conductor (driver assessment reexamination)?
  choices:
    A: Si recibe 6 o más puntos en un período de cuatro años
    B: Si tiene 12 o más puntos en su historial de conducción dentro de un período
      de dos años
    C: Si recibe cualquier infracción de tránsito mientras su licencia está suspendida
    D: Si es condenado por una infracción de 2 puntos
  answer: B
  explanation: Si tiene seis o más infracciones de un punto, o 12 o más puntos en
    su historial de conducción dentro de un período de dos años, se le requerirá someterse
    a una reevaluación de conductor.
- id: 96
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por huir o eludir a un oficial de policía?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: D
  explanation: Huir o eludir a un oficial de policía se clasifica en la categoría
    de seis puntos para infracciones de tránsito.
- id: 97
  category: penalties_and_points
  question: ¿Qué sucede en la mayoría de los casos si no se encarga de una multa de
    tráfico?
  choices:
    A: Su licencia de conducir será suspendida.
    B: Se le prohibirá conducir permanentemente.
    C: La multa será desestimada después de dos años.
    D: Sus tarifas de seguro se duplicarán automáticamente.
  answer: A
  explanation: En la mayoría de los casos, si no se encarga de una multa de tráfico,
    su licencia de conducir será suspendida.
- id: 98
  category: license_system
  question: ¿Quién es elegible para recibir una tarjeta de identificación estatal
    gratuita?
  choices:
    A: Cualquier conductor que renueve su licencia en línea
    B: Conductores de 65 años o más que renuncien voluntariamente a su licencia de
      conducir
    C: Cualquier persona que solicite un cambio de dirección
    D: Conductores que tengan cero puntos en su historial de conducción
  answer: B
  explanation: Se proporcionan tarjetas de identificación gratuitas a quienes son
    legalmente ciegos, a conductores de 65 años o más que renuncian voluntariamente
    a su licencia de conducir, y a conductores cuyo privilegio de conducir está suspendido,
    revocado o denegado debido a una discapacidad física o mental.
- id: 99
  category: penalties_and_points
  question: ¿Cuántos puntos se colocan en su historial de conducción por desobedecer
    una señal de tráfico o una señal de alto?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: Desobedecer una señal de tráfico o una señal de alto, o rebasar de
    manera inadecuada, resulta en tres puntos en su historial de conducción.
- id: 100
  category: driver_responsibility
  question: ¿Cuánto tiempo permanecen la mayoría de las condenas en su historial de
    conducción?
  choices:
    A: Al menos dos años
    B: Al menos cuatro años
    C: Al menos siete años
    D: Permanentemente
  answer: C
  explanation: La mayoría de las condenas permanecen en su historial de conducción
    durante al menos siete años, aunque ciertas condenas permanecen durante 10 años
    o de forma permanente.
- id: 101
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resulta en 2 puntos en su historial
    de conducción?
  choices:
    A: Contenedor de alcohol abierto en el vehículo
    B: Conducción descuidada
    C: Conducción bajo los efectos de sustancias
    D: Conducción temeraria
  answer: A
  explanation: Tener un contenedor de alcohol abierto en un vehículo es una infracción
    de dos puntos.
- id: 102
  category: license_system
  question: ¿Qué se requiere cuando renueva su licencia de conducir en persona cada
    12 años?
  choices:
    A: Un examen de conocimientos por escrito y una prueba de habilidades de conducción
    B: Un examen de la vista y una fotografía nueva
    C: Un examen médico y una verificación de antecedentes
    D: Una reevaluación del conductor
  answer: B
  explanation: Al renovar su licencia de conducir cada 12 años en una oficina de la
    Secretaría de Estado, se le realizará un examen de la vista y se le tomará una
    fotografía nueva.
- id: 103
  category: driver_responsibility
  question: Bajo la Ley de Protección de la Privacidad del Conductor de Michigan,
    ¿cuál de los siguientes es un uso permitido para divulgar la información de su
    historial personal de conducción?
  choices:
    A: Campañas de marketing de empresas locales
    B: Verificaciones de antecedentes públicas por parte de ciudadanos particulares
    C: Retiradas de vehículos del mercado (recalls)
    D: Evaluación de empleo para trabajos que no requieren conducir
  answer: C
  explanation: La información personal es privada a menos que exista un uso permitido
    prescrito por la ley. Los ejemplos de usos permitidos incluyen la calificación
    de seguros, retiradas de vehículos del mercado y la verificación de conductores
    para empresas de alquiler de autos.
- id: 104
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su historial de conducción por tener un contenedor
    de alcohol abierto en el vehículo?
  choices:
    A: Dos puntos
    B: Tres puntos
    C: Cuatro puntos
    D: Six puntos
  answer: A
  explanation: Según el manual, tener un contenedor de alcohol abierto en el vehículo
    resulta en dos puntos en su historial de conducción.
- id: 105
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes porciones estándar contiene la mayor cantidad
    de alcohol?
  choices:
    A: Una lata de cerveza de 12 onzas
    B: Una copa de vino de 5 onzas
    C: Un trago (shot) de whisky de 1.5 onzas
    D: Todas contienen la misma cantidad de alcohol
  answer: D
  explanation: Los efectos del alcohol son los mismos ya sea que beba cerveza, vino
    o whisky. Una lata de cerveza de 12 onzas, una copa de vino de 5 onzas y un trago
    de whisky de 1.5 onzas contienen la misma cantidad de alcohol.
- id: 106
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de recuperar la sobriedad después de
    consumir alcohol?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Dejar que pase el tiempo
    D: Tomar aire fresco y hacer ejercicio
  answer: C
  explanation: Muchas personas creen erróneamente que el café, una ducha fría, el
    ejercicio o el aire fresco pueden hacer que recuperen la sobriedad. Lo único que
    le devuelve la sobriedad es el tiempo.
- id: 107
  category: penalties_and_points
  question: Si no tiene infracciones previas por drogas, ¿por cuánto tiempo se suspenderá
    su licencia de conducir por una condena por drogas?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Si no hay infracciones previas por drogas, su licencia de conducir
    se suspende por seis meses por una condena por drogas.
- id: 108
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento de la licencia de conducir tras
    una suspensión por una condena por drogas?
  choices:
    A: $50
    B: $125
    C: $250
    D: $500
  answer: B
  explanation: La tarifa de restablecimiento de la licencia de conducir por una suspensión
    por condena por drogas es de $125.
- id: 109
  category: alcohol_drugs_health
  question: Bajo la ley de Michigan, ¿cuánta marihuana es legal que transporte una
    persona de 21 años o más?
  choices:
    A: 1 onza o menos
    B: 2.5 onzas o menos
    C: 5 onzas o menos
    D: 15 onzas o menos
  answer: B
  explanation: Es legal transportar 2.5 onzas o menos de marihuana si tiene 21 años
    o más.
- id: 110
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes acciones con respecto a la marihuana es ilegal
    en Michigan?
  choices:
    A: Transportar 2.5 onzas si tiene 21 años o más
    B: Tener 10 gramos de concentrado de marihuana
    C: Transportar marihuana a Canadá
    D: Usar marihuana para aplicaciones medicinales legítimas
  answer: C
  explanation: Según el manual, es ilegal transportar marihuana a Canadá.
- id: 111
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por operar un vehículo bajo la influencia de
    la marihuana?
  choices:
    A: $125
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Las sanciones por operar bajo la influencia de la marihuana son las
    mismas que por alcohol y pueden incluir una multa de hasta $500.
- id: 112
  category: penalties_and_points
  question: ¿Qué sucede si se niega a someterse a una prueba química solicitada por
    un oficial de policía?
  choices:
    A: Se le emitirá una advertencia
    B: Su licencia de conducir será suspendida
    C: Recibirá 2 puntos en su registro
    D: Debe pagar una multa de $125 de inmediato
  answer: B
  explanation: Negarse a someterse a una prueba química resultará en la suspensión
    de la licencia de acuerdo con la ley de consentimiento implícito de Michigan.
- id: 113
  category: driver_testing
  question: La Secretaría de Estado puede requerir un reexamen de conducir si usted
    ha acumulado ¿cuántos puntos en un período de dos años?
  choices:
    A: 6 puntos o más
    B: 8 puntos o más
    C: 10 puntos o más
    D: 12 puntos o más
  answer: D
  explanation: La ley de Michigan permite un reexamen de conducir si ha acumulado
    12 puntos o más en un período de dos años.
- id: 114
  category: driver_testing
  question: ¿Cuál de los siguientes criterios permite que la ley de Michigan requiera
    un reexamen de conducir?
  choices:
    A: Estar involucrado en un accidente de tráfico que resulte en daños a la propiedad
      en los últimos dos años
    B: Estar involucrado en tres o más accidentes de tráfico que resulten en lesiones
      personales o daños a la propiedad en los últimos dos años
    C: Recibir una sola multa de estacionamiento
    D: Transportar 2.5 onzas de marihuana legalmente
  answer: B
  explanation: Se puede requerir un reexamen de conducir si ha estado involucrado
    en tres o más accidentes de tráfico que resulten en lesiones personales o daños
    a la propiedad en los últimos dos años.
- id: 115
  category: license_system
  question: Para registrarse para votar en Michigan, debe ser residente de la ciudad
    o municipio donde está solicitando durante al menos ¿cuántos días antes de votar?
  choices:
    A: 14 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Para registrarse para votar, debe ser residente de la ciudad o municipio
    donde solicita el registro durante al menos 30 días (al momento de votar).
- id: 116
  category: license_system
  question: Si se va a celebrar una elección en los próximos 14 días, ¿a dónde debe
    acudir para registrarse para votar en esa elección?
  choices:
    A: Cualquier oficina de la Secretaría de Estado
    B: En línea en Michigan.gov/Vote
    C: A la oficina del secretario de su ciudad o municipio
    D: A una agencia designada para el registro de votantes
  answer: C
  explanation: Si se celebra una elección en los próximos 14 días y desea votar en
    ella, debe registrarse para votar en la oficina del secretario de su ciudad o
    municipio hasta el mismo día de la elección inclusive.
- id: 117
  category: penalties_and_points
  question: Si tiene una o más condenas previas por drogas en siete años, su licencia
    de conducir será suspendida por un año. ¿Cuándo se puede emitir una licencia restringida
    durante esta suspensión?
  choices:
    A: Después de los primeros 14 días
    B: Después de los primeros 30 días
    C: Después de los primeros 60 días
    D: Después de 6 meses
  answer: C
  explanation: Por una o más condenas previas por drogas en siete años, su licencia
    de conducir será suspendida por un año y no se emitirá una licencia restringida
    durante los primeros 60 días de la suspensión.
- id: 118
  category: driver_responsibility
  question: ¿Qué debe hacer con respecto a su registro de votante si se muda a una
    ciudad o municipio diferente en Michigan?
  choices:
    A: Actualizar su dirección en línea sin volver a registrarse.
    B: Registrarse para votar en su nueva jurisdicción para seguir siendo elegible.
    C: Informar a su secretario anterior por teléfono.
    D: Esperar hasta la próxima elección para actualizar su dirección.
  answer: B
  explanation: Según el manual, si se muda a otra ciudad o municipio, debe registrarse
    para votar en esa jurisdicción para seguir siendo elegible para votar.
- id: 119
  category: license_system
  question: ¿Bajo qué circunstancia puede tener una licencia de conducir de Michigan
    y una tarjeta de identificación estatal al mismo tiempo?
  choices:
    A: Si es mayor de 65 años.
    B: Si viaja con frecuencia por trabajo.
    C: Si su licencia de conducir ha sido restringida, suspendida o revocada.
    D: Nunca puede tener ambas bajo ninguna circunstancia.
  answer: C
  explanation: El manual establece que no puede tener una tarjeta de identificación
    estatal y una licencia de conducir de Michigan al mismo tiempo, a menos que su
    licencia haya sido restringida, suspendida o revocada.
- id: 120
  category: license_system
  question: ¿Por cuánto tiempo es válida una tarjeta de identificación estándar del
    estado de Michigan antes de que expire?
  choices:
    A: Dos años a partir de la fecha de emisión.
    B: Cuatro años a partir de su último cumpleaños.
    C: Cinco años a partir de la fecha de emisión.
    D: Diez años a partir de su último cumpleaños.
  answer: B
  explanation: Su tarjeta de identificación estatal vence cuatro años después de su
    último cumpleaños, a menos que presente documentos de presencia legal temporal.
- id: 121
  category: license_system
  question: ¿Cómo se puede identificar una tarjeta de identificación del estado de
    Michigan que cumpla con la ley REAL ID?
  choices:
    A: Tiene un holograma del sello del estado.
    B: Tiene una estrella dentro de un círculo dorado en la esquina superior derecha.
    C: Está impresa en plástico azul.
    D: Dice "Federal Identification" (Identificación Federal) en la parte superior.
  answer: B
  explanation: Michigan emite tarjetas de identificación estatal que cumplen con la
    ley REAL ID. Estas tarjetas tienen una estrella dentro de un círculo dorado impresa
    en la esquina superior derecha.
- id: 122
  category: license_system
  question: Al volar a nivel nacional con un acompañante, ¿necesitan los menores (menores
    de 18 años) un documento que cumpla con la ley REAL ID?
  choices:
    A: Sí, todos los pasajeros deben tener una REAL ID.
    B: Sí, a menos que tengan una identificación de estudiante válida.
    C: No, los menores no necesitan una REAL ID cuando vuelan con un acompañante dentro
      de los Estados Unidos.
    D: No, pero deben presentar un acta de nacimiento.
  answer: C
  explanation: Solicitar una tarjeta de identificación estatal que cumpla con la ley
    REAL ID es opcional. Los menores (niños menores de 18 años) no necesitan un documento
    que cumpla con la ley REAL ID cuando vuelan con un acompañante dentro de los Estados
    Unidos.
- id: 123
  category: penalties_and_points
  question: ¿Cuál es la sanción por la primera infracción por usar un teléfono celular
    con la mano mientras se conduce en Michigan?
  choices:
    A: Una multa de $50.
    B: Una multa de $100.
    C: Una multa de $250.
    D: Una multa de $500 y suspensión de la licencia.
  answer: B
  explanation: Usar un teléfono celular con la mano mientras se conduce es ilegal
    en Michigan. Los conductores se enfrentan a una multa de $100 por la primera infracción
    y de $250 por violaciones posteriores.
- id: 124
  category: defensive_driving
  question: ¿Qué distancia recorre un automóvil que viaja a 65 mph en el cuarto de
    segundo que le toma al cerebro cambiar de atención?
  choices:
    A: 10 pies.
    B: 24 pies.
    C: 45 pies.
    D: 65 pies.
  answer: B
  explanation: En el cuarto de segundo estimado que le toma al cerebro cambiar la
    atención entre dos tareas, un automóvil que se desplaza a 65 mph recorre 24 pies.
- id: 125
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia se le permite legalmente a un conductor usar un
    dispositivo móvil mientras conduce?
  choices:
    A: Para consultar las direcciones del GPS manualmente.
    B: Para contestar una llamada de un familiar.
    C: Para reportar un choque de tráfico o una emergencia médica al 9-1-1.
    D: Para leer un mensaje de texto mientras está detenido en un semáforo en rojo.
  answer: C
  explanation: Las excepciones de emergencia permiten a los conductores usar un dispositivo
    móvil para enviar mensajes de texto al 9-1-1 o llamar a los servicios de emergencia
    para reportar una emergencia médica, un choque de tráfico, un peligro vial grave,
    un incendio o una situación de materiales peligrosos.
- id: 126
  category: safe_driving_rules
  question: ¿Qué prohíbe la Ley de Kelsey (Kelsey's Law) para los adolescentes con
    una Licencia de Conducir Graduada (GDL) de Nivel 1 o Nivel 2?
  choices:
    A: Conducir entre la medianoche y las 5 a.m.
    B: Hacer o recibir llamadas telefónicas que no sean de emergencia mientras conducen.
    C: Tener más de un pasajero menor de 21 años.
    D: Usar un sistema GPS de manos libres.
  answer: B
  explanation: La Ley de Kelsey (MCL 257.602c) prohíbe a los adolescentes con una
    GDL 1 o GDL 2 realizar o recibir llamadas telefónicas que no sean de emergencia.
- id: 127
  category: safe_driving_rules
  question: ¿Cómo pueden los conductores (que no sean adolescentes con GDL 1 y 2)
    interactuar legalmente con un dispositivo móvil de manos libres mientras conducen?
  choices:
    A: Escribiendo únicamente mensajes de texto cortos.
    B: Presionando, tocando o deslizando un solo botón para activar una función.
    C: Sosteniendo el teléfono cerca de su cara para usar el altavoz.
    D: Desplazándose por una lista de reproducción con una mano.
  answer: B
  explanation: Se permite a los conductores usar un dispositivo en modo manos libres
    o activado por voz, siempre que no sigan usando las manos después de presionar,
    tocar o deslizar un solo botón para activar o desactivar una función.
- id: 128
  category: defensive_driving
  question: ¿Cuál de las siguientes es una forma recomendada de minimizar las distracciones
    dentro del vehículo?
  choices:
    A: Realizar el aseo personal mientras está detenido en los semáforos.
    B: Completar el aseo personal antes de empezar a conducir o después de llegar
      a su destino.
    C: Mantener el teléfono en su regazo para un fácil acceso.
    D: Solo comer comidas complejas mientras conduce por la autopista.
  answer: B
  explanation: Para minimizar las distracciones antes de conducir, el manual recomienda
    completar cualquier aseo personal antes de comenzar a conducir o después de llegar
    a su destino.
- id: 129
  category: alcohol_drugs_health
  question: ¿Qué departamento de policía administró la primera prueba química para
    identificar a presuntos conductores ebrios en 1945?
  choices:
    A: Departamento de Policía de Saginaw
    B: Departamento de Policía de Lansing
    C: Departamento de Policía de Grand Rapids
    D: Departamento de Policía de Detroit
  answer: D
  explanation: En 1945, la primera prueba química para identificar a presuntos conductores
    ebrios fue administrada por el Departamento de Policía de Detroit.
- id: 130
  category: safe_driving_rules
  question: Según la ley de Michigan, ¿quién debe usar el cinturón de seguridad en
    todas las posiciones de asiento?
  choices:
    A: Solo los pasajeros del asiento delantero
    B: Todos los pasajeros menores de 16 años
    C: Solo los pasajeros menores de 8 años
    D: Todos los pasajeros sin importar la edad
  answer: B
  explanation: De acuerdo con la ley de Michigan, todos los pasajeros menores de 16
    años deben estar abrochados con el cinturón de seguridad en todas las posiciones
    de asiento.
- id: 131
  category: safe_driving_rules
  question: ¿Cómo debe usarse correctamente el cinturón de seguridad para brindar
    la protección más segura?
  choices:
    A: El cinturón de hombro cruzando el cuello, el cinturón de regazo sobre el estómago
    B: El cinturón de hombro detrás de la espalda, el cinturón de regazo bajo a través
      de las caderas
    C: El cinturón de hombro a través del centro del pecho, el cinturón de regazo
      bajo a través de las caderas por debajo del estómago
    D: El cinturón de hombro debajo del brazo, el cinturón de regazo sobre el estómago
  answer: C
  explanation: 'Todos en el vehículo estarán más seguros cuando los cinturones de
    seguridad se usen correctamente: el cinturón de hombro a través del centro del
    pecho lejos del cuello, con el cinturón de regazo usado bajo a través de las caderas
    por debajo del estómago.'
- id: 132
  category: safe_driving_rules
  question: Según la ley de seguridad de niños pasajeros de Michigan, ¿hasta qué edad
    o estatura deben los niños estar debidamente sujetos en un asiento de seguridad
    o asiento elevado (booster)?
  choices:
    A: 6 años de edad o 4 pies 6 pulgadas de estatura
    B: 8 años de edad o 4 pies 9 pulgadas de estatura
    C: 10 años de edad o 5 pies de estatura
    D: 12 años de edad o 4 pies 9 pulgadas de estatura
  answer: B
  explanation: Los niños deben estar debidamente sujetos en un asiento de seguridad
    o asiento elevado (booster) hasta que cumplan 8 años o midan 4 pies 9 pulgadas
    de estatura.
- id: 133
  category: safe_driving_rules
  question: ¿Cuándo se permite colocar a un niño en un sistema de retención infantil
    orientado hacia atrás en el asiento del pasajero delantero?
  choices:
    A: Solo si el niño es mayor de 2 años
    B: Solo si la bolsa de aire del pasajero delantero está desactivada
    C: Solo si el vehículo viaja a menos de 35 mph
    D: Nunca se permiten asientos infantiles orientados hacia atrás en el asiento
      delantero
  answer: B
  explanation: Un niño en un sistema de retención infantil orientado hacia atrás solo
    puede colocarse en el asiento delantero si la bolsa de aire del pasajero delantero
    está desactivada.
- id: 134
  category: safe_driving_rules
  question: ¿Cuál es la ley con respecto a viajar en la caja abierta de una camioneta
    pickup en Michigan?
  choices:
    A: Se prohíbe que cualquier persona menor de 18 años viaje en la caja abierta
      si se viaja a más de 15 mph.
    B: Se prohíbe que cualquier persona menor de 21 años viaje en la caja abierta
      a cualquier velocidad.
    C: Los pasajeros de cualquier edad pueden viajar en la caja abierta si están sentados
      en el piso.
    D: Está estrictamente prohibido que cualquier persona viaje en la caja abierta
      de una camioneta pickup.
  answer: A
  explanation: Se prohíbe que cualquier persona menor de 18 años viaje en la caja
    abierta de una camioneta pickup que viaje a más de 15 mph, con ciertas excepciones
    para agricultores, trabajadores de la construcción, militares, etc.
- id: 135
  category: driver_responsibility
  question: 'Según la ley de Michigan, es ilegal dejar a un niño sin supervisión en
    un vehículo si esto representa un riesgo irrazonable de daño. Esto se aplica a
    niños menores de:'
  choices:
    A: 4 años de edad
    B: 6 años de edad
    C: 8 años de edad
    D: 10 años de edad
  answer: B
  explanation: Según la ley de Michigan, es ilegal dejar a niños menores de 6 años
    sin supervisión en un vehículo si la cantidad de tiempo o las circunstancias en
    las que se les deja representan un riesgo irrazonable de daño o lesión.
- id: 136
  category: driver_responsibility
  question: 'Un niño menor de 6 años puede ser dejado en un vehículo sin violar la
    ley si está bajo la supervisión de alguien que no esté legalmente incapacitado
    y tenga al menos:'
  choices:
    A: 10 años de edad
    B: 12 años de edad
    C: 13 años de edad
    D: 16 años de edad
  answer: C
  explanation: Los padres o tutores que dejan a sus hijos en un vehículo bajo la supervisión
    de alguien de 13 años o más que no esté legalmente incapacitado no violan la ley.
- id: 137
  category: vehicle_information
  question: ¿Cuánto espacio se recomienda entre el centro del esternón del conductor
    y el centro del volante para evitar lesiones por la bolsa de aire?
  choices:
    A: Al menos 6 pulgadas
    B: Al menos 10 pulgadas
    C: Al menos 12 pulgadas
    D: Al menos 15 pulgadas
  answer: B
  explanation: Se recomienda que los conductores se sienten con al menos 10 pulgadas
    de espacio entre el centro de su esternón y el centro del volante.
- id: 138
  category: vehicle_information
  question: 'Para evitar posibles lesiones por una bolsa de aire en caso de un choque,
    se recomienda a los padres sentar a todos los niños en el asiento trasero si tienen:'
  choices:
    A: 8 años o menos
    B: 10 años o menos
    C: 12 años o menos
    D: 15 años o menos
  answer: C
  explanation: Se recomienda a los padres o tutores sentar a todos los niños de 12
    años o menos en el asiento trasero del vehículo para evitar posibles lesiones
    por una bolsa de aire en caso de un choque.
- id: 139
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad estándar en los parques de casas móviles
    y algunos parques municipales en Michigan?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad estándar es de 15 mph en parques de casas móviles
    y algunos parques municipales.
- id: 140
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    subdivisiones parceladas y complejos de condominios?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El límite de velocidad estándar es de 25 mph en subdivisiones parceladas
    y complejos de condominios.
- id: 141
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo para autobuses escolares y camiones
    en autopistas con un límite señalizado de 70 mph?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: C
  explanation: En todas las autopistas, a menos que se indique lo contrario, la velocidad
    máxima es de 70 mph, pero los autobuses escolares y los camiones están limitados
    a 65 mph.
- id: 142
  category: penalties_and_points
  question: ¿Cuántos puntos se asignarán a su historial de conducción por exceder
    el límite de velocidad en más de 15 mph en una zona de obras?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: Según la ley, se le asignarán cinco puntos por exceder el límite de
    velocidad en más de 15 mph en una zona de obras.
- id: 143
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima por causar lesiones o la muerte a cualquier
    persona en una zona de obras?
  choices:
    A: Una multa de hasta $1,000 y 1 año de prisión
    B: Una multa de hasta $5,000 y 5 años de prisión
    C: Una multa de hasta $7,500 y hasta 15 años de prisión
    D: Una multa de hasta $10,000 y hasta 20 años de prisión
  answer: C
  explanation: Si causa lesiones o la muerte a cualquier persona en una zona de obras,
    puede enfrentarse a multas de hasta $7,500 y penas de prisión de hasta 15 años.
- id: 144
  category: signs_and_signals
  question: ¿Cómo son las señales de advertencia en áreas de construcción, mantenimiento
    u otras zonas de trabajo designadas?
  choices:
    A: Rectangulares con letras negras sobre un fondo blanco
    B: En forma de diamante con letras negras sobre un fondo naranja o amarillo
    C: Circulares con letras blancas sobre un fondo rojo
    D: En forma de banderín con letras negras sobre un fondo amarillo
  answer: B
  explanation: Las señales de advertencia en áreas de construcción, mantenimiento
    u otras zonas de trabajo designadas tienen forma de diamante con letras negras
    sobre un fondo naranja o amarillo.
- id: 145
  category: vehicle_information
  question: ¿Qué color de luces se les permite usar a las agencias de carreteras estatales
    y locales en Michigan en los vehículos de mantenimiento, además de las tradicionales
    luces ámbar?
  choices:
    A: Luces rojas intermitentes
    B: Luces azules intermitentes
    C: Luces blancas intermitentes
    D: Luces verdes intermitentes
  answer: D
  explanation: La ley de Michigan permite que las agencias de carreteras estatales
    y locales equipen sus vehículos de mantenimiento con luces verdes intermitentes
    u oscilantes, además de las tradicionales luces ámbar.
- id: 146
  category: vehicle_information
  question: ¿Se les permite a los contratistas privados mostrar luces verdes en sus
    vehículos de mantenimiento?
  choices:
    A: Sí, pero solo durante tormentas de nieve.
    B: Sí, si están trabajando en una carretera estatal.
    C: No, a los contratistas privados no se les permite mostrar luces verdes.
    D: No, a menos que tengan un permiso especial de la policía.
  answer: C
  explanation: Según el manual, a los contratistas privados no se les permite mostrar
    luces verdes en sus vehículos.
- id: 147
  category: safe_driving_rules
  question: ¿Qué debe hacer al acercarse a un vehículo de emergencia detenido con
    sus luces intermitentes encendidas?
  choices:
    A: Mantener su velocidad y permanecer en su carril.
    B: Reducir la velocidad a 15 mph y tocar la bocina.
    C: Reducir la velocidad al menos 10 mph por debajo del límite de velocidad señalizado
      y cambiarse de carril si es posible.
    D: Detenerse inmediatamente y esperar a que el vehículo de emergencia se retire.
  answer: C
  explanation: La ley exige que reduzca la velocidad al menos 10 mph por debajo del
    límite de velocidad señalizado y se cambie de carril si el tráfico y las condiciones
    lo permiten.
- id: 148
  category: safe_driving_rules
  question: ¿A qué distancia debe mantenerse detrás de un vehículo de emergencia en
    movimiento que muestra luces de advertencia intermitentes y hace sonar una sirena?
  choices:
    A: Al menos 100 pies
    B: Al menos 200 pies
    C: Al menos 300 pies
    D: Al menos 500 pies
  answer: D
  explanation: Debe mantenerse al menos a 500 pies de distancia de cualquier vehículo
    de emergencia en movimiento que muestre luces de advertencia intermitentes y haga
    sonar una sirena.
- id: 149
  category: defensive_driving
  question: ¿Qué debe hacer con los frenos después de orillarse y detenerse ante un
    vehículo de emergencia que se aproxima?
  choices:
    A: Poner el vehículo en estacionamiento (P) y quitar el pie del freno.
    B: Mantener un pie en el freno para que las luces de freno informen al conductor
      de emergencia que usted se ha detenido.
    C: Bombear los frenos para que sus luces parpadeen.
    D: Aplicar únicamente el freno de estacionamiento de emergencia.
  answer: B
  explanation: Mantenga un pie en el freno para que las luces de freno informen a
    los conductores de vehículos de emergencia que usted se ha detenido.
- id: 150
  category: sharing_the_road
  question: ¿A qué distancia debe detenerse de un autobús escolar que tiene sus luces
    rojas superiores intermitentes?
  choices:
    A: Al menos 10 pies
    B: Al menos 15 pies
    C: Al menos 20 pies
    D: Al menos 50 pies
  answer: C
  explanation: Deténgase al menos a 20 pies de un autobús escolar con sus luces rojas
    superiores intermitentes; esto indica que está recogiendo o dejando pasajeros.
- id: 151
  category: sharing_the_road
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar que tiene
    sus luces rojas superiores parpadeando?
  choices:
    A: Cuando usted viaja en la dirección opuesta en una carretera estándar de dos
      carriles.
    B: Cuando el autobús está detenido al otro lado de una carretera dividida por
      una barrera o mediana.
    C: Cuando se le hace tarde para el trabajo y el autobús está vacío.
    D: Cuando el autobús está detenido en una intersección de cuatro vías.
  answer: B
  explanation: No es necesario detenerse ante un autobús escolar detenido al otro
    lado de una carretera dividida por una barrera, como una mediana de concreto o
    césped, una isleta u otras estructuras que separan el flujo del tráfico.
- id: 152
  category: signs_and_signals
  question: ¿Qué significa cuando un autobús escolar tiene sus luces AMARILLAS superiores
    parpadeando?
  choices:
    A: Proceda con precaución
    B: Prepárese para detenerse
    C: Deténgase inmediatamente
    D: El autobús está acelerando
  answer: B
  explanation: Cuando las luces AMARILLAS superiores están parpadeando, prepárese
    para detenerse.
- id: 153
  category: safe_driving_rules
  question: Si dos vehículos llegan al mismo tiempo a una intersección con parada
    en las cuatro direcciones (four-way stop), ¿quién tiene la prioridad de paso?
  choices:
    A: El vehículo de la izquierda debe ceder el paso al vehículo a su derecha.
    B: El vehículo de la derecha debe ceder el paso al vehículo a su izquierda.
    C: El vehículo que viaja más rápido tiene la prioridad de paso.
    D: El vehículo que gira a la izquierda tiene la prioridad de paso.
  answer: A
  explanation: Si dos o más vehículos llegan a la intersección al mismo tiempo, el
    vehículo de la izquierda debe ceder el paso al vehículo a su derecha.
- id: 154
  category: safe_driving_rules
  question: ¿Cómo debe actuar en una intersección con un semáforo que no funciona
    correctamente?
  choices:
    A: Proceda sin detenerse si el camino parece estar despejado.
    B: Deténgase por completo y ceda el paso a los vehículos que ya están en la intersección.
    C: Trátelo como una señal de ceda el paso y reduzca la velocidad a 15 mph.
    D: Espere a que lleguen las autoridades antes de cruzar.
  answer: B
  explanation: Si llega a una intersección con un semáforo que no funciona correctamente,
    deténgase por completo y ceda el paso a los vehículos que ya están en la intersección.
- id: 155
  category: safe_driving_rules
  question: En una intersección en T sin señales ni semáforos, ¿quién tiene la prioridad
    de paso?
  choices:
    A: Los vehículos en la carretera que termina en la intersección.
    B: Los vehículos que giran a la izquierda.
    C: Los vehículos que circulan por la carretera continua (vía principal).
    D: Cualquier vehículo que llegue primero.
  answer: C
  explanation: En una intersección en T sin señales ni semáforos, ceda el paso a los
    vehículos que circulan por la carretera continua.
- id: 156
  category: penalties_and_points
  question: ¿Cuál es la sanción por no obedecer la ley con respecto a los vehículos
    de emergencia autorizados que están detenidos, suponiendo que nadie resulte herido
    o muerto?
  choices:
    A: Una advertencia
    B: Una infracción civil
    C: Un delito menor (misdemeanor)
    D: Un delito grave (felony)
  answer: B
  explanation: 'El incumplimiento de la ley conlleva las siguientes sanciones en relación
    con vehículos de emergencia autorizados: Una infracción civil, a menos que lesione
    o cause la muerte al personal de emergencia, en cuyo caso el cargo es un delito
    grave (felony).'
- id: 157
  category: safe_driving_rules
  question: Al realizar un giro a la izquierda en una intersección con luz verde,
    ¿qué debe hacer si todavía se encuentra en la intersección cuando la luz cambia
    a rojo?
  choices:
    A: Retroceder hasta el paso de peatones.
    B: Detenerse inmediatamente en la intersección y esperar a la siguiente luz verde.
    C: Complete su giro de la manera más rápida y segura posible.
    D: Toque la bocina y ábrase paso a la fuerza a través del tráfico.
  answer: C
  explanation: Si todavía se encuentra en la intersección cuando la luz cambia a rojo,
    complete su giro de la manera más rápida y segura posible.
- id: 158
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando se aproxima un vehículo de emergencia con sus luces
    rojas o azules parpadeando y la sirena sonando?
  choices:
    A: Acelerar para salir de su camino.
    B: Detenerse inmediatamente en medio de la intersección.
    C: Conducir hacia el borde derecho de la calzada, fuera de la intersección, y
      detenerse.
    D: Moverse al carril izquierdo y reducir la velocidad.
  answer: C
  explanation: El manual establece que cuando se aproxima un vehículo de emergencia
    con luces parpadeantes y sirena, usted debe conducir inmediatamente a una posición
    paralela y lo más cerca posible del borde o bordillo derecho, fuera de la intersección,
    y detenerse.
- id: 159
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos tiene prioridad de paso sobre un cortejo
    fúnebre?
  choices:
    A: Un autobús de transporte público.
    B: Un camión de bomberos con sus luces y sirena encendidas.
    C: Un camión de reparto postal.
    D: Un autobús escolar cargando pasajeros.
  answer: B
  explanation: Según el manual, los cortejos fúnebres tienen prioridad de paso sobre
    todos los demás vehículos, excepto los camiones de bomberos, ambulancias y vehículos
    policiales.
- id: 160
  category: safe_driving_rules
  question: Al adelantar a otro vehículo por la izquierda, ¿debe regresar a su carril
    antes de estar a cuántos pies de distancia de cualquier vehículo que venga en
    sentido contrario?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: El manual especifica que, al adelantar, debe regresar a su carril antes
    de estar a menos de 200 pies de cualquier vehículo que venga en sentido contrario.
- id: 161
  category: safe_driving_rules
  question: ¿Cuándo es seguro volver al carril derecho después de rebasar a otro vehículo
    por la izquierda?
  choices:
    A: Tan pronto como su parachoques delantero esté por delante del otro vehículo.
    B: Cuando pueda ver el vehículo completo que está rebasando en su espejo retrovisor.
    C: Cuando el conductor al que está rebasando haga parpadear sus faros.
    D: Tres segundos después de haber rebasado al vehículo.
  answer: B
  explanation: El manual aconseja que una vez que haya comenzado a rebasar un vehículo,
    no debe volver al carril derecho hasta que pueda ver el vehículo completo que
    está rebasando en su espejo retrovisor.
- id: 162
  category: safe_driving_rules
  question: ¿A cuántos pies de una intersección o cruce de ferrocarril está prohibido
    rebasar a otro vehículo por la izquierda?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: El manual establece que no debe rebasar cuando se encuentre a menos
    de 100 pies de una intersección o un cruce de ferrocarril.
- id: 163
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes circunstancias es legalmente permisible rebasar
    a un vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante circula por debajo del límite de velocidad en
      una carretera de un solo carril.
    B: Conduciendo por el arcén derecho pavimentado si el vehículo de adelante está
      girando a la izquierda.
    C: Cuando hay suficiente espacio en una carretera de dos carriles y el vehículo
      de adelante está girando a la izquierda.
    D: Siempre que tenga prisa y el arcén derecho esté despejado.
  answer: C
  explanation: Rebasar por la derecha está permitido cuando hay suficiente espacio
    en una carretera de dos carriles y el vehículo que desea rebasar está girando
    a la izquierda. Sin embargo, no debe conducir por el arcén ni fuera de la carretera
    para hacerlo.
- id: 164
  category: safe_driving_rules
  question: Al conducir en una autopista interestatal, generalmente debe conducir
    en el carril derecho. ¿Cuál de las siguientes es una excepción a esta regla?
  choices:
    A: Cuando desea conducir más rápido que el límite de velocidad establecido.
    B: Cuando las condiciones climáticas hacen necesario conducir en el carril izquierdo.
    C: Cuando conduce un vehículo comercial.
    D: Cuando se encuentra a menos de 5 millas de su salida.
  answer: B
  explanation: Las excepciones para conducir en el carril izquierdo en una interestatal
    incluyen cuando las condiciones climáticas hacen necesario conducir en el carril
    izquierdo, entre otras situaciones específicas como la congestión del tráfico
    o ceder el paso a vehículos de emergencia.
- id: 165
  category: defensive_driving
  question: ¿Qué debe hacer con las ruedas delanteras de su vehículo mientras espera
    para girar a la izquierda en una intersección?
  choices:
    A: Girarlas ligeramente hacia la izquierda para prepararse para el giro.
    B: Girarlas ligeramente hacia la derecha para evitar rodar hacia el tráfico.
    C: Mantenerlas apuntando recto hacia adelante hasta que comience su giro.
    D: Apuntarlas en la dirección del carril de tráfico que viene en sentido contrario.
  answer: C
  explanation: Al prepararse para un giro a la izquierda, el manual instruye a los
    conductores a mantener las ruedas delanteras apuntando recto hacia adelante hasta
    que comiencen el giro.
- id: 166
  category: sharing_the_road
  question: Si tiene el semáforo en verde pero un peatón se encuentra actualmente
    en el paso de peatones delante de usted, ¿qué debe hacer?
  choices:
    A: Tocar la bocina para advertir al peatón que se mueva más rápido.
    B: Continuar a través de la intersección ya que usted tiene el derecho de paso.
    C: Maniobrar alrededor del peatón para mantener el flujo del tráfico.
    D: Ceder el paso al peatón en el paso de peatones.
  answer: D
  explanation: Como conductor, debe ceder el paso a un peatón en el paso de peatones,
    incluso si su semáforo está en verde.
- id: 167
  category: penalties_and_points
  question: ¿Cuál es la sanción por atravesar un cortejo fúnebre?
  choices:
    A: Es un delito grave (felony).
    B: Es una infracción civil.
    C: Es un delito menor (misdemeanor).
    D: Resulta en una suspensión automática de la licencia.
  answer: B
  explanation: El manual establece explícitamente que es una infracción civil atravesar
    un cortejo fúnebre.
- id: 168
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo lo está rebasando por la izquierda?
  choices:
    A: Aumentar su velocidad para que puedan incorporarse detrás de usted.
    B: Moverse al carril izquierdo para bloquearlos.
    C: No aumentar su velocidad y permitirles completar el adelantamiento de manera
      segura.
    D: Tocar la bocina para alertarlos de su presencia.
  answer: C
  explanation: Si otro vehículo lo está rebasando, el manual establece que no debe
    aumentar su velocidad ni competir con el conductor. Debe permitir que el otro
    conductor complete la maniobra de adelantamiento de manera segura.
- id: 169
  category: safe_driving_rules
  question: Al realizar un giro en una intersección con múltiples carriles de giro
    a la derecha, ¿cómo debe completar su giro?
  choices:
    A: Entrar en el carril que tenga la menor cantidad de tráfico.
    B: Entrar siempre en el carril del extremo derecho, independientemente de su carril
      de inicio.
    C: Entrar en el carril que corresponda a su carril de giro.
    D: Incorporarse al carril central inmediatamente después de girar.
  answer: C
  explanation: Cuando hay varios carriles de giro a la derecha, debe completar su
    giro entrando en el carril que corresponda a su carril de giro para evitar obstruir
    el tráfico.
- id: 170
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones sobre conducir a través de franjas
    divisorias y barreras es verdadera?
  choices:
    A: Es legal solo si se pasó su salida de la autopista.
    B: Es ilegal conducir a través de franjas divisorias y barreras.
    C: Es legal si conduce un vehículo con tracción en las cuatro ruedas.
    D: Es legal durante embotellamientos de tráfico severos.
  answer: B
  explanation: El manual establece claramente que es ilegal conducir a través de franjas
    divisorias y barreras.
- id: 171
  category: sharing_the_road
  question: ¿Es legal rebasar a un vehículo que se ha detenido en un paso de peatones
    para permitir que un peatón cruce?
  choices:
    A: Sí, si rebasa por la derecha.
    B: Sí, si no hay tráfico en sentido contrario.
    C: No, está prohibido rebasar a un vehículo detenido por un peatón.
    D: Sí, pero solo si toca la bocina primero.
  answer: C
  explanation: Está prohibido rebasar cuando un vehículo se ha detenido en un paso
    de peatones o intersección para permitir que un peatón cruce.
- id: 172
  category: safe_driving_rules
  question: ¿Cómo debe reaccionar al acercarse a un vehículo de recolección de residuos
    o de servicios públicos detenido con sus luces intermitentes encendidas?
  choices:
    A: Mantener su velocidad y rebasar lo más rápido posible.
    B: Detenerse inmediatamente y esperar a que el vehículo apague sus luces.
    C: Proceder con precaución y estar preparado para ceder el paso.
    D: Tocar la bocina y rebasar por el acotamiento derecho.
  answer: C
  explanation: Debe proceder con precaución y estar preparado para ceder el paso siempre
    que se acerque o rebase a un vehículo de recolección de residuos, de servicios
    públicos o de mantenimiento de carreteras detenido con sus luces intermitentes
    encendidas.
- id: 173
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso en una glorieta (roundabout)?
  choices:
    A: Los vehículos que entran a la glorieta
    B: Los vehículos que circulan dentro de la glorieta
    C: Los peatones que esperan para cruzar fuera de la glorieta
    D: Los vehículos que salen de la glorieta
  answer: B
  explanation: Según el manual, "Los vehículos que están en la glorieta tienen el
    derecho de paso".
- id: 174
  category: safe_driving_rules
  question: ¿Qué debe hacer si se acerca un vehículo de emergencia mientras usted
    circula por una glorieta?
  choices:
    A: Detenerse inmediatamente dentro de la glorieta para dejarlo pasar
    B: Acelerar para salir de la glorieta lo más rápido posible
    C: Salir de la glorieta por la salida más cercana, hacerse a la derecha y detenerse
    D: Hacerse hacia la isla central y detenerse
  answer: C
  explanation: 'El manual establece: "Si se escucha o se ve que se acerca un vehículo
    de emergencia, no se detenga. Salga de la glorieta por la salida más cercana,
    hágase a la derecha y deténgase, permitiendo que el vehículo de emergencia pase".'
- id: 175
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado si se pasa de su salida mientras circula
    por una glorieta?
  choices:
    A: Detenerse y retroceder con cuidado hasta su salida
    B: Hacer un giro en U sobre la isla central
    C: Tomar la siguiente salida disponible y cambiar de ruta usando calles laterales
    D: Dar la vuelta a la glorieta hasta llegar a su salida nuevamente
  answer: D
  explanation: 'El manual aconseja: "Si se pasa de su salida, dé la vuelta a la glorieta
    hasta llegar a su salida nuevamente".'
- id: 176
  category: safe_driving_rules
  question: Cuando viene un tren, ¿cuál es la distancia de parada requerida desde
    las vías del ferrocarril?
  choices:
    A: No más de 50 pies ni menos de 15 pies
    B: No más de 100 pies ni menos de 25 pies
    C: Exactamente 10 pies de las vías
    D: Entre 5 y 10 pies de las vías
  answer: A
  explanation: 'El manual establece: "Si viene un tren, todos los vehículos deben
    detenerse a no más de 50 pies ni menos de 15 pies de las vías".'
- id: 177
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos debe detenerse en un cruce de ferrocarril
    incluso si no hay una señal de alto o una señal de cruce?
  choices:
    A: Motocicletas y ciclomotores
    B: Autobuses escolares y vehículos que transportan materiales peligrosos
    C: Camiones de entrega y furgonetas comerciales
    D: Vehículos de pasajeros que remolcan remolques
  answer: B
  explanation: El manual señala que se debe tener en cuenta que "los autobuses escolares,
    los vehículos que transportan pasajeros por contrato, los camiones de gasolina
    y otros vehículos que transportan materiales peligrosos deben detenerse y asegurarse
    de que no venga ningún tren, incluso si no hay una señal de alto o una señal de
    cruce de ferrocarril".
- id: 178
  category: safe_driving_rules
  question: Al acercarse a un cruce de ferrocarril donde el tráfico está congestionado,
    ¿cuánto espacio debe tener al otro lado de las vías antes de cruzar?
  choices:
    A: Al menos 3 pies de espacio libre
    B: Al menos 6 pies de espacio libre
    C: Al menos 10 pies de espacio libre
    D: Al menos 15 pies de espacio libre
  answer: B
  explanation: 'El manual advierte: "nunca cruce las vías a menos que haya suficiente
    espacio para que su vehículo despeje completamente el otro lado de las vías por
    al menos 6 pies".'
- id: 179
  category: safe_driving_rules
  question: ¿Qué debe hacer INMEDIATAMENTE si su vehículo se queda atascado en las
    vías del ferrocarril y las barreras de cruce se activan?
  choices:
    A: Permanecer en el vehículo y llamar al 911
    B: Intentar arrancar el motor durante al menos 30 segundos
    C: Hacer que todos salgan del vehículo y se alejen lo más posible de las vías,
      luego llamar al 911
    D: Llamar al número del ENS en el letrero azul antes de salir del vehículo
  answer: C
  explanation: 'El manual instruye: "Si las barreras de cruce se activan, o si un
    tren se acerca claramente, haga que todos salgan del vehículo INMEDIATAMENTE y
    se alejen lo más posible de las vías. Llame al 911".'
- id: 180
  category: signs_and_signals
  question: ¿Qué información se proporciona en un letrero del Sistema de Notificación
    de Emergencia (ENS) en un cruce a nivel de carretera y ferrocarril?
  choices:
    A: El límite de velocidad para los trenes que se acercan
    B: Un número de teléfono y el número de US DOT del cruce
    C: La distancia al siguiente cruce de ferrocarril
    D: La frecuencia de radio para contactar a los maquinistas del tren
  answer: B
  explanation: 'El manual establece: "Un letrero del Sistema de Notificación de Emergencia
    (ENS)... indica un número de teléfono junto con el número de US DOT del cruce
    y se utiliza para notificar al ferrocarril sobre una emergencia..."'
- id: 181
  category: sharing_the_road
  question: ¿Por qué debería usar su mano derecha para abrir la puerta del lado del
    conductor al salir de un vehículo estacionado?
  choices:
    A: Evita que la puerta se abra demasiado rápido con el viento
    B: Automáticamente le hace mirar sobre su hombro izquierdo para ver si vienen
      ciclistas y peatones
    C: Es un requisito legal para todos los conductores en Michigan
    D: Mantiene su mano izquierda libre para sujetar el volante
  answer: B
  explanation: 'El manual aconseja: ''Use su mano derecha para abrir la puerta, de
    modo que automáticamente mire sobre su hombro izquierdo para ver si vienen ciclistas
    y peatones''.'
- id: 182
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar las ruedas de su vehículo al estacionar cuesta
    abajo?
  choices:
    A: Gire las ruedas en dirección contraria al bordillo (acera)
    B: Mantenga las ruedas perfectamente rectas
    C: Gire las ruedas hacia el bordillo (acera)
    D: Gire las ruedas hacia la izquierda
  answer: C
  explanation: 'El manual establece explícitamente: ''Gire las ruedas hacia el bordillo
    al estacionar cuesta abajo''.'
- id: 183
  category: safe_driving_rules
  question: Al estacionar en paralelo, ¿cuál es la distancia máxima a la que debe
    estar su vehículo del bordillo (acera)?
  choices:
    A: No más de 6 a 12 pulgadas
    B: No más de 12 a 18 pulgadas
    C: Exactamente 2 pies
    D: Entre 2 y 5 pies
  answer: A
  explanation: 'Las instrucciones del manual para el estacionamiento en paralelo indican:
    ''No estacione a más de 6-12 pulgadas del bordillo''.'
- id: 184
  category: safe_driving_rules
  question: Al entrar en una rotonda (glorieta), ¿en qué dirección debe ceder el paso
    al tráfico que se aproxima?
  choices:
    A: Ceda el paso al tráfico que se aproxima por la derecha
    B: Ceda el paso al tráfico que se aproxima por la izquierda
    C: Ceda el paso únicamente a los vehículos comerciales
    D: No es necesario ceder el paso; los vehículos que entran tienen la prioridad
  answer: B
  explanation: 'El manual establece: ''Los vehículos que entran desde cada ramal de
    la intersección deben ceder el paso al tráfico que se aproxima por la izquierda''.'
- id: 185
  category: safe_driving_rules
  question: ¿Cuánto suelen sobresalir los trenes de las vías del ferrocarril?
  choices:
    A: Al menos un pie de cada lado
    B: Al menos tres pies de cada lado
    C: Exactamente cinco pies de cada lado
    D: Los trenes no sobresalen de las vías
  answer: B
  explanation: 'El manual advierte: ''Los trenes sobresalen de las vías al menos tres
    pies de cada lado y pueden llevar carga que se extienda aún más''.'
- id: 186
  category: safe_driving_rules
  question: ¿Cómo debe acercarse a su vehículo cuando regrese a él si está estacionado
    en una calle?
  choices:
    A: Camine de espaldas al tráfico que se aproxima
    B: Mire hacia el tráfico que se aproxima mientras se acerca al lado del conductor
    C: Acérquese únicamente por el lado del pasajero
    D: Camine por el centro de la carretera para ser visible
  answer: B
  explanation: 'El manual aconseja: ''Al regresar a su vehículo, mire hacia el tráfico
    que se aproxima mientras se acerca al lado del conductor''.'
- id: 187
  category: safe_driving_rules
  question: ¿Cuál es un consejo de seguridad recomendado con respecto a las marchas
    (cambios) de su vehículo al cruzar las vías del ferrocarril?
  choices:
    A: Cambie a una marcha más alta para cruzar rápidamente
    B: Cambie a una marcha más baja para tener más potencia
    C: Ponga el vehículo en punto muerto (neutral) mientras cruza
    D: Evite cambiar de marcha mientras cruza las vías del ferrocarril
  answer: D
  explanation: 'Bajo los consejos de seguridad para cruces a nivel, el manual establece:
    ''Evite cambiar de marcha mientras cruza las vías del ferrocarril''.'
- id: 188
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante (toma de agua) de incendios es ilegal estacionar
    su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: Según la sección de infracciones de estacionamiento, nunca debe estacionar
    a menos de 15 pies de un hidrante de incendios.
- id: 189
  category: signs_and_signals
  question: ¿Qué forma se utiliza exclusivamente para una señal escolar?
  choices:
    A: Diamante (rombo)
    B: Pentágono
    C: Banderín
    D: Octágono
  answer: B
  explanation: El manual indica que se utiliza una forma de pentágono para significar
    una zona escolar o un cruce escolar.
- id: 190
  category: signs_and_signals
  question: ¿Qué color de señal de tráfico se utiliza para indicar un incidente, emergencia
    o evento no planificado?
  choices:
    A: Naranja
    B: Amarillo-verde fluorescente
    C: Rosa fluorescente
    D: Marrón
  answer: C
  explanation: El rosa fluorescente es el color designado para las señales de incidentes,
    emergencias o eventos no planificados.
- id: 191
  category: safe_driving_rules
  question: ¿Por qué es sumamente importante no estacionarse en el área con franjas
    azules de un espacio de estacionamiento para personas con discapacidad accesible
    para furgonetas?
  choices:
    A: Está reservado únicamente para vehículos de emergencia.
    B: Proporciona espacio para el elevador de sillas de ruedas y la rampa de la furgoneta.
    C: Es una zona de carga designada para camiones de reparto.
    D: Es un cruce de peatones.
  answer: B
  explanation: El área con franjas azules proporciona espacio para el elevador de
    sillas de ruedas y la rampa de la furgoneta, lo que permite que la persona con
    discapacidad entre y salga del vehículo con facilidad.
- id: 192
  category: safe_driving_rules
  question: ¿A cuántos pies del riel más cercano de un cruce ferroviario está prohibido
    estacionarse?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: D
  explanation: El manual establece que nunca debe estacionarse a menos de 50 pies
    del riel más cercano de un cruce ferroviario.
- id: 193
  category: signs_and_signals
  question: ¿Qué tipo de vehículo muestra un triángulo naranja montado en la parte
    trasera?
  choices:
    A: Un vehículo que transporta materiales peligrosos.
    B: Un vehículo que no circula a más de 25 mph.
    C: Un vehículo de emergencia autorizado.
    D: Un camión de reparto comercial.
  answer: B
  explanation: El triángulo naranja es una señal de Vehículo de Movimiento Lento montada
    en la parte trasera de los vehículos que no circulan a más de 25 mph, como las
    cosechadoras agrícolas y los carruajes Amish.
- id: 194
  category: signs_and_signals
  question: 'Una señal de tráfico en forma de banderín se utiliza para indicar:'
  choices:
    A: Un cruce ferroviario.
    B: Una zona escolar.
    C: Una advertencia o zona de no rebasar.
    D: Direcciones y guía.
  answer: C
  explanation: La tabla de formas de señales de tráfico del manual indica que una
    señal en forma de banderín significa ADVERTENCIA/NO REBASAR.
- id: 195
  category: safe_driving_rules
  question: ¿A cuántos pies de una señal de alto, semáforo o baliza intermitente es
    ilegal estacionarse?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El manual establece que nunca debe estacionarse a menos de 30 pies
    de una señal de alto, semáforo o baliza intermitente, incluyendo una señal de
    advertencia.
- id: 196
  category: driver_responsibility
  question: Si un vehículo arrendado (leased) se estaciona ilegalmente, ¿quién es
    responsable de la multa de estacionamiento?
  choices:
    A: El concesionario que vendió el vehículo.
    B: La persona que arrienda el vehículo.
    C: El propietario registrado de la empresa de arrendamiento.
    D: El conductor que lo estacionó, solo si es sorprendido en el acto.
  answer: B
  explanation: El manual establece que el propietario de un vehículo estacionado ilegalmente
    es responsable de cualquier multa de estacionamiento, y si el vehículo está arrendado,
    la persona que lo arrienda es la responsable.
- id: 197
  category: signs_and_signals
  question: ¿Qué debe hacer si se pasa de su salida de la autopista y ve un cruce
    de emergencia marcado como "Solo vehículos autorizados"?
  choices:
    A: Usar el cruce rápidamente si no viene tráfico.
    B: Usar el cruce solo si conduce un vehículo comercial.
    C: Conducir hasta la siguiente salida, salir y volver a entrar en la autopista
      en la otra dirección.
    D: Detenerse en la mediana y esperar un hueco en el tráfico para dar la vuelta.
  answer: C
  explanation: Nunca conduzca a través de la mediana o el cruce de emergencia de una
    autopista. Para cambiar de dirección, conduzca hasta la siguiente salida, salga
    y vuelva a entrar en la autopista en la otra dirección.
- id: 198
  category: signs_and_signals
  question: ¿Qué indica una señal de "Rebasar con cuidado" (Pass With Care)?
  choices:
    A: Se está acercando a una zona escolar.
    B: Marca el final de una zona de no rebasar.
    C: Debe ceder el paso al tráfico que viene en sentido contrario antes de rebasar.
    D: Rebasar está estrictamente prohibido en esta área.
  answer: B
  explanation: La señal de "Rebasar con cuidado" (Pass With Care) sigue a la señal
    de "No rebasar". Se encuentra en el lado derecho de la carretera y marca el final
    de una zona de no rebasar, lo que significa que puede rebasar cuando sea seguro
    hacerlo.
- id: 199
  category: safe_driving_rules
  question: ¿A cuántos pies de la entrada de una estación de bomberos en el mismo
    lado de la calle no se puede estacionar?
  choices:
    A: 15 pies
    B: 20 pies
    C: 50 pies
    D: 75 pies
  answer: B
  explanation: Nunca debe estacionarse a menos de 20 pies de la entrada de una estación
    de bomberos en el mismo lado de la calle.
- id: 200
  category: signs_and_signals
  question: ¿Cuál es el propósito de las señales de tráfico de color marrón?
  choices:
    A: Proporcionar precaución por construcción o mantenimiento.
    B: Indicar leyes reglamentarias.
    C: Proporcionar direcciones a hospitales y servicios.
    D: Informarle sobre la ubicación de un lugar de interés cultural o recreativo.
  answer: D
  explanation: Las señales de color marrón le informan sobre la ubicación de un lugar
    de interés cultural o recreativo (recreación/interés cultural).
- id: 201
  category: safe_driving_rules
  question: ¿Qué se requiere para estacionar legalmente en un espacio de estacionamiento
    para personas con discapacidad?
  choices:
    A: Una calcomanía amarilla de estacionamiento gratuito en cualquier placa de matrícula.
    B: Una placa de matrícula para personas con discapacidad o un cartel de estacionamiento.
    C: Una nota del médico exhibida en el tablero.
    D: Una silla de ruedas visible dentro del vehículo.
  answer: B
  explanation: Para estacionar en un espacio de estacionamiento para personas con
    discapacidad, debe tener una placa de matrícula para personas con discapacidad
    o un cartel de estacionamiento, y usted o su pasajero deben tener una discapacidad
    calificada.
- id: 202
  category: signs_and_signals
  question: ¿Dónde se ubica típicamente una señal de banderín amarillo de "Zona de
    no rebasar" (No Passing Zone)?
  choices:
    A: En el lado derecho de la calzada.
    B: Suspendida sobre el centro de la intersección.
    C: En el lado izquierdo de la calzada.
    D: En la parte trasera de un vehículo de movimiento lento.
  answer: C
  explanation: La señal de banderín amarillo de "Zona de no rebasar" (No Passing Zone)
    se ubica en el lado izquierdo de la calzada para advertir a los conductores que
    no rebasen porque las condiciones lo hacen peligroso.
- id: 203
  category: safe_driving_rules
  question: ¿Qué precaución deben tomar los conductores, especialmente los de camiones
    grandes, al encontrarse con una señal de "Colina" (Hill)?
  choices:
    A: Acelerar para mantener el impulso.
    B: Moverse al carril izquierdo.
    C: Asegurarse de que los frenos funcionen correctamente y reducir la marcha si
      es necesario.
    D: Encender las luces de emergencia y detenerse.
  answer: C
  explanation: Una señal de "Colina" (Hill) indica una pendiente pronunciada más adelante.
    Todos los vehículos, especialmente los camiones grandes, deben tomar precauciones
    para asegurarse de que sus frenos funcionen correctamente y reducir la marcha
    si es necesario.
- id: 204
  category: signs_and_signals
  question: ¿Cuál es el propósito de las líneas blancas continuas pintadas en el borde
    derecho de la carretera?
  choices:
    A: Separan el tráfico que se mueve en direcciones opuestas.
    B: Indican una zona de rebase designada.
    C: Ayudan a los conductores a mantenerse en la carretera por la noche o con mal
      tiempo.
    D: Marcan un cruce peatonal.
  answer: C
  explanation: Las líneas blancas continuas marcan el borde derecho de la carretera.
    A menudo llamadas líneas de niebla, estas líneas le ayudan a mantenerse en la
    carretera por la noche o con mal tiempo.
- id: 205
  category: signs_and_signals
  question: ¿Qué indica una doble línea blanca continua?
  choices:
    A: El tráfico se mueve en direcciones opuestas y se permite rebasar.
    B: Se permite conducir en la misma dirección en ambos lados, pero está prohibido
      cruzar la línea.
    C: El carril está terminando y los conductores deben incorporarse a la izquierda.
    D: Los conductores deben detenerse antes de avanzar por la intersección.
  answer: B
  explanation: Se utiliza una doble línea blanca continua para mostrar una trayectoria
    de viaje donde se permite conducir en la misma dirección en ambos lados de la
    línea, pero está prohibido cruzar la línea.
- id: 206
  category: safe_driving_rules
  question: ¿Dónde debe detener su vehículo si una intersección no tiene líneas de
    parada ni cruces peatonales?
  choices:
    A: En medio de la intersección.
    B: Antes de entrar en la intersección.
    C: Directamente al lado de la señal de pare.
    D: Al menos 50 pies antes de la intersección.
  answer: B
  explanation: Si no hay líneas de parada ni cruces peatonales, detenga el vehículo
    antes de entrar en la intersección.
- id: 207
  category: sharing_the_road
  question: ¿Qué indica un carril verde para bicicletas?
  choices:
    A: Una zona segura donde los ciclistas tienen el derecho de paso sobre los peatones.
    B: Un carril donde los vehículos pueden detenerse temporalmente para realizar
      una entrega.
    C: Un punto potencial de conflicto entre automóviles y bicicletas, generalmente
      en intersecciones y entradas privadas.
    D: Un carril compartido donde los automóviles y las bicicletas pueden viajar uno
      al lado del otro.
  answer: C
  explanation: Un carril verde para bicicletas indica un punto potencial de conflicto
    entre automóviles y bicicletas, generalmente en intersecciones y entradas privadas.
- id: 208
  category: sharing_the_road
  question: ¿Cuál de las siguientes acciones es legal que realice el conductor de
    un vehículo motorizado en un carril para bicicletas?
  choices:
    A: Girar a la derecha.
    B: Detenerse a un lado para esperar a alguien.
    C: Rebasar a otro vehículo.
    D: Ninguna de estas acciones es legal.
  answer: D
  explanation: Es ilegal usar los carriles para bicicletas para conducir, rebasar,
    girar a la derecha, estacionarse o como un lugar para detenerse a esperar a alguien
    o realizar una entrega.
- id: 209
  category: signs_and_signals
  question: ¿Qué indican las líneas amarillas en el pavimento?
  choices:
    A: Separan los carriles de tráfico que se mueven en la misma dirección.
    B: Separan los carriles de tráfico que se mueven en direcciones opuestas.
    C: Marcan el borde derecho de la calzada.
    D: Indican un cruce peatonal de zona escolar.
  answer: B
  explanation: Las líneas amarillas separan los carriles de tráfico que se mueven
    en direcciones opuestas. Incluyen líneas continuas, discontinuas y de carril central.
- id: 210
  category: safe_driving_rules
  question: ¿Cuándo se permite cruzar una doble línea amarilla continua en medio de
    una calzada de dos carriles?
  choices:
    A: Al rebasar un vehículo de movimiento lento.
    B: Cuando el vehículo de adelante viaja por debajo del límite de velocidad.
    C: Al girar hacia una entrada privada, hacia un camino transversal o para acceder
      a un lugar de estacionamiento.
    D: Nunca se permite cruzar una doble línea amarilla continua.
  answer: C
  explanation: Una doble línea amarilla continua significa que no se permite rebasar,
    pero se permite cruzar en algunas situaciones, como al girar hacia una entrada
    privada, hacia un camino transversal o para acceder a un lugar de estacionamiento.
- id: 211
  category: signs_and_signals
  question: ¿Cómo está marcado un carril central exclusivo para girar a la izquierda?
  choices:
    A: Con líneas blancas continuas dobles en ambos lados.
    B: Con una línea amarilla continua en el borde exterior y líneas amarillas discontinuas
      en el borde interior.
    C: Con líneas blancas discontinuas en el exterior y líneas amarillas continuas
      en el interior.
    D: Con una sola línea amarilla discontinua en el centro.
  answer: B
  explanation: Cada borde exterior del carril central exclusivo para girar a la izquierda
    está marcado con una línea amarilla continua y líneas amarillas discontinuas en
    los bordes interiores.
- id: 212
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un uso ilegal de un carril central exclusivo
    para girar a la izquierda?
  choices:
    A: Realizar un giro a la izquierda desde cualquier dirección.
    B: Usar el carril para rebasar a otros vehículos o como carril de incorporación.
    C: Entrar al carril para prepararse para un próximo giro a la izquierda.
    D: Esperar en el carril hasta que el tráfico en sentido contrario se despeje.
  answer: B
  explanation: Usar un carril central exclusivo para girar a la izquierda para rebasar
    a otros vehículos o como carril de incorporación es ilegal y peligroso.
- id: 213
  category: safe_driving_rules
  question: ¿Cómo se completa un giro a la izquierda en una intersección diseñada
    como un "Giro a la izquierda de Michigan" (Michigan Left)?
  choices:
    A: Realizar un giro a la izquierda directo cuando el semáforo se ponga en verde.
    B: Girar a la derecha y luego realizar inmediatamente un giro en U en medio de
      la carretera.
    C: Seguir derecho a través de la intersección o girar a la derecha, y luego realizar
      un giro en U en un cruce de la mediana.
    D: Esperar en el carril central exclusivo para girar a la izquierda hasta que
      el tráfico se despeje.
  answer: C
  explanation: Para girar a la izquierda en un "Giro a la izquierda de Michigan",
    una persona debe seguir derecho a través de la intersección, o girar a la derecha,
    y luego realizar un giro en U en un cruce de la mediana.
- id: 214
  category: safe_driving_rules
  question: ¿Por qué un cruce de mediana de un solo carril en un "Giro a la izquierda
    de Michigan" podría parecer lo suficientemente ancho como para que quepan varios
    vehículos de pasajeros uno al lado del otro?
  choices:
    A: Para permitir que los vehículos de pasajeros se rebasen entre sí durante el
      giro.
    B: Para acomodar vehículos más grandes, como camiones con remolque, que necesitan
      un radio de giro más amplio.
    C: Para proporcionar un área segura para que los vehículos averiados se detengan.
    D: Para permitir que los ciclistas compartan el cruce con los vehículos motorizados.
  answer: B
  explanation: Aunque algunos cruces pueden parecer lo suficientemente anchos como
    para que quepan varios vehículos de pasajeros uno al lado del otro, ese espacio
    adicional está ahí para acomodar vehículos más grandes, como camiones con remolque
    y vehículos recreativos, que necesitan un radio de giro más amplio.
- id: 215
  category: safe_driving_rules
  question: ¿Cómo debe tratar un conductor un cruce de mediana no señalizado en un
    "Giro a la izquierda de Michigan"?
  choices:
    A: Como un cruce de varios carriles.
    B: Como una zona de rebase designada.
    C: Como un cruce de un solo carril.
    D: Como un área restringida solo para vehículos de emergencia.
  answer: C
  explanation: Un cruce de mediana no señalizado siempre debe tratarse como un cruce
    de un solo carril.
- id: 216
  category: signs_and_signals
  question: ¿Qué indican los símbolos triangulares blancos pintados a través de un
    carril de tráfico?
  choices:
    A: Se está aproximando a un cruce de ferrocarril.
    B: Debe estar preparado para detenerse y ceder el paso a los peatones.
    C: Debe aumentar su velocidad para incorporarse.
    D: Está entrando en una zona escolar.
  answer: B
  explanation: Según el manual, los triángulos blancos pintados a través de un carril
    de tráfico indican que debe estar preparado para detenerse y ceder el paso a los
    peatones.
- id: 217
  category: signs_and_signals
  question: ¿Cuál es el significado de las líneas blancas discontinuas pintadas a
    través de un carril de tráfico en una glorieta?
  choices:
    A: Indican el borde del carril circular de la glorieta.
    B: Marcan un cruce de peatones.
    C: Indican una parada obligatoria antes de entrar.
    D: Indican un carril designado solo para vehículos comerciales.
  answer: A
  explanation: El manual establece que las líneas blancas discontinuas pintadas a
    través de un carril de tráfico en una glorieta indican el borde del carril circular
    de la glorieta.
- id: 218
  category: safe_driving_rules
  question: ¿Es legal conducir a través de una propiedad privada, como el estacionamiento
    de una tienda, para evitar un dispositivo de control de tráfico?
  choices:
    A: Sí, pero solo si el semáforo está en rojo.
    B: Sí, si no hay peatones presentes.
    C: No, es ilegal conducir a través de propiedad pública o privada para evitar
      un dispositivo de control de tráfico.
    D: No, a menos que esté conduciendo un vehículo comercial.
  answer: C
  explanation: 'El manual establece explícitamente: "Es ilegal conducir a través de
    propiedad pública o privada, como el estacionamiento de una tienda, para evitar
    un dispositivo de control de tráfico".'
- id: 219
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a una intersección y el semáforo se pone
    en amarillo?
  choices:
    A: Acelerar para despejar la intersección rápidamente.
    B: Detenerse inmediatamente, incluso si se encuentra en medio de la intersección.
    C: Se requiere que se detenga, pero si no puede detenerse de manera segura, conduzca
      con precaución a través de la intersección.
    D: Tocar la bocina y continuar sin reducir la velocidad.
  answer: C
  explanation: Una luz amarilla significa que la señal está a punto de cambiar a rojo.
    Se requiere que se detenga, pero si no puede detenerse de manera segura, no debe
    acelerar, sino conducir con precaución a través de la intersección.
- id: 220
  category: safe_driving_rules
  question: ¿Cómo debe proceder si se acerca a una intersección donde el semáforo
    no funciona y no hay presencia de autoridades de la ley?
  choices:
    A: Tratar la intersección como una señal de ceder el paso y continuar sin detenerse.
    B: Detenerse por completo y ceder el paso a los vehículos que ya se encuentran
      en la intersección.
    C: El vehículo de la izquierda siempre tiene el derecho de paso.
    D: Esperar a que llegue un oficial de la ley antes de cruzar.
  answer: B
  explanation: Si un semáforo no funciona y no hay oficiales de la ley presentes,
    debe detenerse por completo y ceder el paso a los vehículos que ya se encuentran
    en la intersección.
- id: 221
  category: safe_driving_rules
  question: Si un semáforo no funciona y dos vehículos llegan a la intersección al
    mismo tiempo, ¿quién debe ceder el paso?
  choices:
    A: El vehículo de la derecha debe ceder el paso al vehículo de la izquierda.
    B: El vehículo de la izquierda debe ceder el paso al vehículo de la derecha.
    C: El vehículo que viaja a mayor velocidad tiene la preferencia de paso.
    D: El vehículo más grande tiene la preferencia de paso.
  answer: B
  explanation: En una intersección con un semáforo averiado, debe ceder el paso a
    los vehículos a su derecha si ambos llegan a la intersección al mismo tiempo.
- id: 222
  category: signs_and_signals
  question: ¿Qué indica una flecha verde encendida en un semáforo de 5 secciones?
  choices:
    A: Debe ceder el paso al tráfico que viene en sentido contrario antes de girar.
    B: Tiene un giro protegido y todo el tráfico que viene en sentido contrario o
      en conflicto está detenido.
    C: Solo puede girar a la derecha.
    D: La señal está a punto de cambiar a rojo.
  answer: B
  explanation: Cuando la flecha verde está encendida, los conductores que giran tienen
    un "giro protegido", lo que significa que todo el tráfico que viene en sentido
    contrario o en conflicto está detenido.
- id: 223
  category: signs_and_signals
  question: ¿Qué le permite hacer una flecha amarilla intermitente?
  choices:
    A: Girar a la izquierda solo después de detenerse por completo.
    B: Girar a la izquierda cuando el tráfico que viene en sentido contrario, que
      tiene luz verde, esté despejado.
    C: Continuar recto a través de la intersección sin ceder el paso.
    D: Realizar un giro a la izquierda protegido mientras el tráfico en sentido contrario
      está detenido.
  answer: B
  explanation: Una flecha amarilla intermitente le permite girar a la izquierda cuando
    el tráfico que viene en sentido contrario, que tiene luz verde, esté despejado.
- id: 224
  category: signs_and_signals
  question: ¿Cuál es la respuesta adecuada ante una luz roja intermitente?
  choices:
    A: Detenerse por completo y avanzar cuando el camino esté despejado.
    B: Reducir la velocidad y avanzar con cuidado a través de la intersección.
    C: Detenerse solo si hay peatones en el cruce peatonal.
    D: Ceder el paso al tráfico de la izquierda y avanzar.
  answer: A
  explanation: Una luz roja intermitente significa detenerse por completo. Avance
    cuando el camino esté despejado.
- id: 225
  category: sharing_the_road
  question: Aproximadamente, ¿cuántos pies le toma detenerse a un vehículo comercial
    que viaja a 55 mph?
  choices:
    A: 130 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: D
  explanation: Según el manual, un vehículo comercial que viaja a 55 mph tarda unos
    400 pies en detenerse.
- id: 226
  category: sharing_the_road
  question: ¿Qué son las "zonas prohibidas" (no zones) alrededor de un vehículo comercial?
  choices:
    A: Áreas donde los vehículos comerciales no tienen permitido estacionarse.
    B: Espacios donde los automovilistas no deben permanecer porque están ocultos
      a la vista del conductor del camión.
    C: Zonas donde los vehículos de pasajeros deben circular a una velocidad reducida.
    D: Carriles reservados exclusivamente para camiones comerciales.
  answer: B
  explanation: Las "zonas prohibidas" (no zones) son puntos ciegos o espacios en los
    que los automovilistas no deben permanecer porque no son fácilmente visibles para
    el conductor comercial.
- id: 227
  category: sharing_the_road
  question: Por visibilidad y seguridad al viajar de noche, ¿qué debe hacer cuando
    sigue a un camión o autobús?
  choices:
    A: Usar las luces altas para iluminar la parte trasera del camión.
    B: Apagar los faros delanteros.
    C: Usar las luces bajas.
    D: Parpadear sus faros repetidamente.
  answer: C
  explanation: El manual aconseja que, por visibilidad y seguridad al viajar de noche,
    debe usar las luces bajas cuando siga a un camión o autobús.
- id: 228
  category: sharing_the_road
  question: ¿Por qué un vehículo comercial podría abrirse hacia la izquierda en una
    intersección?
  choices:
    A: Para realizar con seguridad un giro a la derecha.
    B: Para permitir que los vehículos de pasajeros pasen por la derecha.
    C: Para prepararse para un giro en U.
    D: Para evitar detenerse en la línea blanca de parada.
  answer: A
  explanation: Los vehículos comerciales necesitan espacio para realizar giros a la
    derecha y pueden abrirse hacia la izquierda para realizar con seguridad un giro
    a la derecha.
- id: 229
  category: signs_and_signals
  question: ¿Qué deben hacer los peatones si están en el cruce peatonal y la señal
    para peatones comienza a parpadear?
  choices:
    A: Detenerse inmediatamente y esperar en medio de la carretera.
    B: Dar la vuelta y regresar a la acera de donde partieron.
    C: Completar su cruce.
    D: Correr lo más rápido posible hacia el otro lado.
  answer: C
  explanation: La señal comenzará a parpadear cuando el tiempo para cruzar con seguridad
    esté llegando a su fin. Cualquier peatón que se encuentre en el cruce en ese momento
    debe completar su cruce.
- id: 230
  category: sharing_the_road
  question: ¿Por qué nunca debe cruzar por detrás de un vehículo comercial que se
    está preparando para dar marcha atrás?
  choices:
    A: Los gases de escape del camión son peligrosos a corta distancia.
    B: La mayoría de los remolques miden ocho pies y medio de ancho y pueden ocultar
      un automóvil de la vista del conductor del camión.
    C: El camión podría acelerar repentinamente hacia adelante.
    D: Los vehículos comerciales tienen la preferencia de paso al dar marcha atrás
      en todas las situaciones.
  answer: B
  explanation: Nunca debe cruzar por detrás de un vehículo comercial que está dando
    marcha atrás porque la mayoría de los remolques miden ocho pies y medio de ancho
    y pueden ocultar un automóvil de la vista, impidiendo que el conductor del camión
    vea su vehículo.
- id: 231
  category: sharing_the_road
  question: Al rebasar un vehículo comercial, ¿cuándo es seguro volver al carril delante
    de él?
  choices:
    A: Cuando esté a una distancia de un automóvil por delante del camión.
    B: Tan pronto como pase el parachoques delantero del camión.
    C: Cuando pueda ver toda la cabina del camión en su espejo retrovisor.
    D: Cuando el conductor del camión parpadee sus luces delanteras para indicar que
      es seguro.
  answer: C
  explanation: El manual establece que, al rebasar, debe asegurarse de poder ver toda
    la cabina del camión en su espejo retrovisor antes de señalizar y volver al carril.
- id: 232
  category: defensive_driving
  question: ¿Qué debe hacer si un camión grande o un autobús lo está rebasando durante
    el mal tiempo?
  choices:
    A: Acelerar para evitar que lo rebasen y salpiquen su parabrisas.
    B: Moverse hacia el acotamiento de la carretera hasta que pasen.
    C: Tocar la bocina para advertirles de su presencia en su punto ciego.
    D: Reducir la velocidad y encender los limpiaparabrisas.
  answer: D
  explanation: El manual aconseja reducir la velocidad si un camión o autobús lo está
    rebasando, especialmente durante el mal tiempo, y encender los limpiaparabrisas
    antes de que el vehículo lo pase, ya que las salpicaduras o el rocío de sus neumáticos
    pueden reducir la visibilidad.
- id: 233
  category: vehicle_information
  question: ¿Cuál de los siguientes NO se considera un vehículo de movimiento lento
    según el manual?
  choices:
    A: Un carrito de golf
    B: Un carruaje Amish
    C: Un tractor tirando de un vagón
    D: Equipo industrial y de construcción
  answer: A
  explanation: El manual establece explícitamente que las cuatrimotos (four-wheelers)
    y los carritos de golf no se consideran vehículos de movimiento lento.
- id: 234
  category: sharing_the_road
  question: 'Los vehículos de movimiento lento se definen como aquellos que no pueden
    viajar a más de:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: Según el manual, los vehículos de movimiento lento son aquellos que
    no pueden viajar a una velocidad superior a 25 mph.
- id: 235
  category: safe_driving_rules
  question: 'Al seguir a un jinete a caballo o un carruaje tirado por caballos, debe
    mantener una distancia de seguridad de al menos:'
  choices:
    A: 10 pies
    B: 20 pies
    C: 50 pies
    D: 100 pies
  answer: B
  explanation: El manual indica reducir la velocidad a 15-20 mph y mantener una distancia
    de seguridad de al menos 20 pies entre su vehículo y el jinete o carruaje para
    no asustar al caballo.
- id: 236
  category: safe_driving_rules
  question: 'Si otro vehículo se ha detenido para que un peatón cruce la calle, usted
    debe:'
  choices:
    A: Tocar la bocina para alertar al peatón de que se dé prisa.
    B: Rebasar al vehículo detenido por el lado derecho.
    C: Nunca intentar rebasar al vehículo detenido.
    D: Rebasar con cuidado al vehículo por la izquierda a baja velocidad.
  answer: C
  explanation: 'El manual establece explícitamente: ''Nunca intente rebasar a otro
    vehículo que se haya detenido por un peatón''.'
- id: 237
  category: sharing_the_road
  question: Si una calle no tiene acera, ¿cómo deben caminar los peatones por el borde
    de la carretera?
  choices:
    A: De frente al tráfico que viene en sentido contrario
    B: De espaldas al tráfico que viene en sentido contrario
    C: En el centro del carril
    D: Solo en el lado derecho de la carretera
  answer: A
  explanation: El manual establece que si una calle no tiene acera, los peatones deben
    caminar de frente al tráfico que viene en sentido contrario si deciden caminar
    por el borde de la carretera.
- id: 238
  category: driver_responsibility
  question: ¿Por qué debe evitar tocar la bocina o acelerar el motor cerca de un peatón
    con un bastón blanco o un perro guía?
  choices:
    A: Es ilegal usar la bocina en cualquier cruce de peatones.
    B: Puede hacer que el perro guía se vuelva agresivo.
    C: Estos ruidos distraen y tapan señales auditivas importantes utilizadas por
      personas con discapacidades visuales.
    D: Hará que el peatón camine más rápido y posiblemente tropiece.
  answer: C
  explanation: El manual explica que debe evitar tocar la bocina o acelerar el motor
    porque estos ruidos distraen y tapan señales auditivas importantes utilizadas
    por personas con discapacidades visuales.
- id: 239
  category: safe_driving_rules
  question: ¿Cuánto espacio de seguimiento debe dejar entre su vehículo y un motociclista,
    operador de scooter o ciclista?
  choices:
    A: Al menos 1 o 2 segundos
    B: Al menos 3 o 4 segundos
    C: Al menos 5 o 6 segundos
    D: Al menos 10 segundos
  answer: B
  explanation: El manual establece que seguir demasiado cerca (tailgating) es ilegal
    y que debe dejar al menos 3 o 4 segundos de espacio de seguimiento entre su vehículo
    y un motociclista, operador de scooter o ciclista.
- id: 240
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a rebasar
    a un motociclista?
  choices:
    A: Puede rebasarlos en el mismo carril si hay suficiente espacio.
    B: Es ilegal conducir al lado de ellos o rebasarlos en el mismo carril.
    C: Debe tocar la bocina antes de rebasarlos en el mismo carril.
    D: Solo puede rebasar a un motociclista en una carretera de varios carriles.
  answer: B
  explanation: 'El manual establece: ''Es ilegal que los automovilistas conduzcan
    al lado de los motociclistas o los rebasen en el mismo carril. Rebase utilizando
    un carril adyacente cuando sea legal y seguro hacerlo''.'
- id: 241
  category: vehicle_information
  question: 'Los motociclistas tienen permitido legalmente conducir en autopistas
    y carreteras de acceso limitado si su vehículo tiene un motor de un tamaño de
    al menos:'
  choices:
    A: 50cc
    B: 100cc
    C: 125cc
    D: 250cc
  answer: C
  explanation: Según el manual, los motociclistas que operan vehículos con motores
    de 125 cc o más tienen permitido legalmente conducir en autopistas y carreteras
    de acceso limitado.
- id: 242
  category: sharing_the_road
  question: ¿Por qué podría un motociclista reducir la velocidad sin que se activen
    sus luces de freno?
  choices:
    A: Es probable que sus luces de freno estén funcionando mal debido al pequeño
      tamaño del vehículo.
    B: Están usando el freno de motor y reduciendo de marcha.
    C: Están aplicando ligeramente el freno de emergencia.
    D: Las motocicletas no están obligadas legalmente a tener luces de freno.
  answer: B
  explanation: El manual señala que los motociclistas utilizan con frecuencia el freno
    de motor y la reducción de marchas, técnicas que ralentizan el vehículo sin activar
    las luces de freno.
- id: 243
  category: defensive_driving
  question: ¿Qué maniobra presenta un mayor riesgo de choques con motocicletas, motonetas
    (scooters) y bicicletas en las intersecciones?
  choices:
    A: Girar a la derecha en rojo
    B: Girar a la izquierda
    C: Seguir recto con el semáforo en verde
    D: Detenerse en una señal de alto
  answer: B
  explanation: El manual indica que se debe tener extrema precaución al girar a la
    izquierda en una intersección, ya que los giros a la izquierda presentan un mayor
    riesgo de choques porque es fácil juzgar mal la velocidad y la distancia de los
    vehículos más pequeños.
- id: 244
  category: sharing_the_road
  question: ¿Por qué es importante mantener un espacio adicional entre su vehículo
    y un motociclista?
  choices:
    A: Los motociclistas utilizan con frecuencia el freno de motor, el cual no activa
      las luces de freno.
    B: Las motocicletas deben detenerse en todos los cruces de ferrocarril.
    C: A los motociclistas no se les permite usar el carril izquierdo.
    D: Las motocicletas tienen un radio de giro más amplio que los automóviles.
  answer: A
  explanation: Los motociclistas utilizan con frecuencia el freno de motor y la reducción
    de marchas para reducir la velocidad sin activar sus luces de freno, por lo que
    es necesario mantener un espacio adicional para estar seguro.
- id: 245
  category: sharing_the_road
  question: Según la ley de Michigan, ¿cuál de los siguientes es un requisito para
    que un vehículo sea definido como un ciclomotor (moped)?
  choices:
    A: Debe tener un motor que supere los 150 cc.
    B: No puede propulsarse a una velocidad superior a 30 mph en una superficie nivelada.
    C: Debe estar equipado con una transmisión manual que requiera cambios de marcha.
    D: Debe tener cuatro ruedas.
  answer: B
  explanation: Un ciclomotor (moped) se define como un vehículo motorizado que no
    puede propulsarse a una velocidad superior a 30 mph en una superficie nivelada,
    tiene un motor que no supera los 100 cc y no requiere cambios de marcha.
- id: 246
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima para rebasar que la ley de Michigan exige
    dejar entre su vehículo y un ciclista?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Michigan exige que deje al menos 3 pies de espacio entre
    su vehículo y un ciclista al rebasarlo.
- id: 247
  category: sharing_the_road
  question: ¿Cuándo se les permite a los ciclistas salir de un carril para bicicletas
    designado?
  choices:
    A: Solo cuando lo indique un oficial de policía.
    B: Solo cuando viajan cuesta arriba.
    C: Para girar a la izquierda o para evitar peligros.
    D: A los ciclistas nunca se les permite salir de un carril para bicicletas.
  answer: C
  explanation: Los ciclistas no están obligados a usar un carril para bicicletas y
    pueden salir de él para girar a la izquierda o para evitar peligros.
- id: 248
  category: sharing_the_road
  question: ¿En qué se diferencia un autociclo (autocycle) de una motocicleta estándar?
  choices:
    A: Tiene cuatro ruedas y una plataforma de carga.
    B: Está equipado con un asiento tipo montura y manubrios.
    C: Tiene cinturones de seguridad, volante y no está equipado con un asiento tipo
      montura.
    D: Solo se permite en autopistas de acceso limitado.
  answer: C
  explanation: Un autociclo es una motocicleta que tiene cinturones de seguridad,
    una barra o arcos antivuelco, un volante, tres ruedas y no está equipado con un
    asiento tipo montura.
- id: 249
  category: safe_driving_rules
  question: Según la Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA), ¿qué porcentaje de todas las muertes por accidentes de tráfico se estima
    que son causadas por comportamientos de conducción agresiva?
  choices:
    A: 25 por ciento
    B: 40 por ciento
    C: 50 por ciento
    D: 66 por ciento
  answer: D
  explanation: La Administración Nacional de Seguridad del Tráfico en las Carreteras
    ha estimado que el 66 por ciento de todas las muertes por accidentes de tráfico
    son causadas por comportamientos de conducción agresiva.
- id: 250
  category: defensive_driving
  question: Si conduce por el carril izquierdo para rebasar el tráfico más lento y
    alguien lo sigue muy de cerca (tailgating), ¿cuál es la acción más segura?
  choices:
    A: Tocar los frenos para advertir al conductor que lo sigue.
    B: Acelerar para igualar la velocidad del conductor que lo sigue.
    C: Regresar al carril derecho cuando sea seguro hacerlo.
    D: Hacer un gesto manual apropiado para indicarles que se alejen.
  answer: C
  explanation: Si alguien lo sigue muy de cerca mientras está en el carril izquierdo,
    regrese al carril derecho cuando sea seguro hacerlo y permita que el tráfico más
    rápido siga adelante.
- id: 251
  category: defensive_driving
  question: ¿Qué debe hacer si su visión de la carretera o del tráfico transversal
    está bloqueada por árboles o edificios en una intersección?
  choices:
    A: Avanzar lentamente hasta que pueda ver más allá de la obstrucción.
    B: Tocar la bocina y continuar al límite de velocidad normal.
    C: Esperar a que otro vehículo salga primero y seguirlo.
    D: Encender las luces altas para advertir al tráfico que viene en sentido contrario.
  answer: A
  explanation: Si no puede ver con claridad en una intersección debido a obstrucciones,
    avance lentamente hasta que pueda ver más allá de lo que bloquea su visión.
- id: 252
  category: safe_driving_rules
  question: ¿Cuáles de los siguientes NO tienen permitido circular por las autopistas
    de Michigan?
  choices:
    A: Motocicletas con motores de más de 250 cc.
    B: Camiones semirremolque comerciales.
    C: Peatones, bicicletas y ciclomotores (mopeds).
    D: Vehículos de pasajeros que remolcan tráileres.
  answer: C
  explanation: Los peatones, las motocicletas pequeñas de 124 cc o menos, los ciclomotores
    (mopeds), las bicicletas, los vehículos todo terreno y los vehículos de movimiento
    lento no están permitidos en las autopistas.
- id: 253
  category: defensive_driving
  question: ¿Cuál es la forma recomendada de manejar una confrontación con un conductor
    agresivo?
  choices:
    A: Hacer contacto visual para demostrar que no está intimidado.
    B: Intentar apartarse del camino, evitar el contacto visual e ignorar los gestos.
    C: Seguir al conductor para obtener su número de placa.
    D: Devolver sus gestos para hacerles saber que cometieron un error.
  answer: B
  explanation: Si se enfrenta a un conductor agresivo, intente apartarse del camino,
    evite el contacto visual e ignore los gestos o ataques verbales.
- id: 254
  category: sharing_the_road
  question: Al rebasar a un ciclista, ¿es legal hacerlo en una zona de no rebasar?
  choices:
    A: Sí, siempre que sea seguro hacerlo.
    B: Sí, pero solo si el ciclista le indica que pase.
    C: No, siempre debe esperar hasta que termine la zona de no rebasar.
    D: No, rebasar a un ciclista está estrictamente prohibido en carreteras de dos
      carriles.
  answer: A
  explanation: Puede rebasar a un ciclista en una zona de no rebasar siempre que sea
    seguro hacerlo.
- id: 255
  category: sharing_the_road
  question: ¿Por qué el perfil más pequeño de una motocicleta en el tráfico puede
    ser peligroso?
  choices:
    A: Hace que la motocicleta sea más pesada y difícil de detener.
    B: Distorsiona la percepción del automovilista sobre la velocidad y distancia
      reales del motociclista.
    C: Hace que la motocicleta se desvíe hacia otros carriles.
    D: Evita que la motocicleta utilice el frenado de motor.
  answer: B
  explanation: El perfil más pequeño de una motocicleta en el tráfico puede distorsionar
    la percepción de un automovilista sobre la velocidad y distancia reales del motociclista,
    haciendo que parezca que el automovilista tiene más tiempo del que realmente tiene.
- id: 256
  category: defensive_driving
  question: ¿Cómo puede afectar el conducir en 'piloto automático' a los conductores
    de mediana edad?
  choices:
    A: Mejora su tiempo de reacción en situaciones de emergencia.
    B: Les ayuda a ahorrar combustible en viajes largos.
    C: Los deja vulnerables porque no están atentos a su entorno de conducción.
    D: Les permite predecir mejor las acciones de los conductores agresivos.
  answer: C
  explanation: Conducir en 'piloto automático' puede dejar a los conductores de mediana
    edad vulnerables en la carretera porque no están realmente atentos a su entorno
    de conducción y sus riesgos potenciales.
- id: 257
  category: sharing_the_road
  question: ¿Qué debe hacer antes de girar a la derecha en una intersección o hacia
    una entrada privada?
  choices:
    A: Tocar la bocina para advertir a los ciclistas en el área.
    B: Buscar ciclistas que vengan desde atrás por el arcén de la carretera o en un
      carril para bicicletas.
    C: Acelerar rápidamente para girar antes de que un ciclista pueda llegar a la
      intersección.
    D: Mover su vehículo completamente al carril de bicicletas para bloquear a los
      ciclistas que intenten pasar.
  answer: B
  explanation: Busque ciclistas que vengan desde atrás por el arcén de la carretera
    o en un carril para bicicletas antes de girar a la derecha en una intersección,
    hacia una entrada privada o al salir de la carretera.
- id: 258
  category: vehicle_information
  question: ¿Qué característica de seguridad fue introducida por Fisher Body en 1930
    para reducir el deslumbramiento del tráfico que viene en sentido contrario por
    la noche?
  choices:
    A: Cinturones de seguridad instalados de fábrica
    B: Bolsas de aire producidas en masa
    C: El parabrisas inclinado
    D: Faros halógenos
  answer: C
  explanation: En 1930, Fisher Body introdujo el parabrisas inclinado para reducir
    el deslumbramiento de las luces del tráfico que viene en sentido contrario por
    la noche.
- id: 259
  category: safe_driving_rules
  question: Según el manual, ¿cuáles de los siguientes vehículos tienen prohibido
    usar las autopistas?
  choices:
    A: Motocicletas de más de 125 cc
    B: Vehículos de alta ocupación (HOV)
    C: Motocicletas pequeñas de 124 cc o menos
    D: Camiones comerciales
  answer: C
  explanation: El manual establece que los peatones, las motocicletas pequeñas de
    124 cc o menos, los ciclomotores (mopeds), las bicicletas, los vehículos todo
    terreno y los vehículos de movimiento lento no están permitidos en las autopistas.
- id: 260
  category: safe_driving_rules
  question: Al entrar en una autopista desde una carretera o calle de incorporación,
    ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo que se incorpora a la autopista
    B: Los vehículos que ya están en la autopista
    C: El vehículo que viaje más rápido
    D: El vehículo en el carril de la extrema derecha debe ceder el paso al vehículo
      que se incorpora
  answer: B
  explanation: Al incorporarse al tráfico, debe ceder el derecho de paso a los vehículos
    que ya están en la autopista. Debe ajustar su velocidad y ubicación para incorporarse
    de manera segura.
- id: 261
  category: sharing_the_road
  question: ¿Cuál es un requisito para usar un carril para vehículos de alta ocupación
    (HOV) durante las horas pico de operación?
  choices:
    A: El vehículo debe tener tres o más ocupantes.
    B: El vehículo debe ser un automóvil híbrido o eléctrico.
    C: El vehículo debe tener dos o más ocupantes.
    D: El vehículo debe ser una camioneta de pasajeros comercial.
  answer: C
  explanation: Los carriles para vehículos de alta ocupación (HOV) se utilizan durante
    las horas pico de operación, y los vehículos deben tener dos o más ocupantes para
    usar el carril HOV.
- id: 262
  category: sharing_the_road
  question: ¿Cuándo se les permite a las motocicletas usar los carriles para vehículos
    de alta ocupación (HOV)?
  choices:
    A: Solo durante las horas pico de operación
    B: Solo cuando llevan un pasajero
    C: En cualquier momento
    D: Solo fuera de las horas pico designadas
  answer: C
  explanation: El manual establece explícitamente que fuera de las horas designadas,
    los carriles HOV están abiertos a todos los automovilistas, y las motocicletas
    pueden usarlos en cualquier momento.
- id: 263
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su rampa de salida en la autopista?
  choices:
    A: Usar el cruce de la mediana para dar la vuelta.
    B: Retroceder con cuidado por el acotamiento derecho.
    C: Detenerse y esperar un espacio en el tráfico para dar marcha atrás.
    D: Conducir hasta la siguiente salida y regresar a la salida que desea.
  answer: D
  explanation: Si se pasa de su rampa de salida, nunca retroceda, dé la vuelta ni
    use un cruce de mediana. En su lugar, conduzca hasta la siguiente salida, vuelva
    a entrar en la autopista y regrese a la salida que desea.
- id: 264
  category: defensive_driving
  question: Para prevenir la fatiga en la autopista en viajes largos, ¿con qué frecuencia
    recomienda el manual detenerse para tomar un descanso de 10 minutos?
  choices:
    A: Al menos cada hora
    B: Al menos cada dos horas
    C: Al menos cada tres horas
    D: Al menos cada cuatro horas
  answer: B
  explanation: Si se siente cansado, el manual le aconseja detenerse y tomar un descanso
    de 10 minutos al menos cada dos horas.
- id: 265
  category: vehicle_information
  question: ¿Qué acción cancelará la configuración del control de crucero de su vehículo?
  choices:
    A: Presionar el pedal del acelerador
    B: Presionar el pedal del freno
    C: Encender los limpiaparabrisas
    D: Usar las luces direccionales
  answer: B
  explanation: La aceleración no cancela la configuración del control de crucero,
    pero presionar el pedal del freno sí lo hará.
- id: 266
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones NO se recomienda usar el control
    de crucero?
  choices:
    A: En carreteras rurales con muy poco tráfico
    B: Al conducir en autopistas secas y despejadas
    C: Cuando las carreteras están resbaladizas por la lluvia, la nieve o el hielo
    D: Al conducir largas distancias a la luz del día
  answer: C
  explanation: No se recomienda usar el control de crucero en tráfico pesado, cerca
    de un gran número de rampas de salida/entrada, o cuando las carreteras están resbaladizas
    por la lluvia, la nieve o el hielo.
- id: 267
  category: defensive_driving
  question: Si un vehículo que viene en sentido contrario está en su carril, ¿dónde
    debería buscar una ruta de escape?
  choices:
    A: En el borde izquierdo de la carretera
    B: En el borde derecho de la carretera
    C: En el carril de tráfico en sentido contrario
    D: En el cruce de la mediana
  answer: B
  explanation: Si un vehículo que viene en sentido contrario está en su carril, debe
    buscar una ruta de escape en el borde derecho de la carretera e intentar no ir
    hacia la izquierda.
- id: 268
  category: safe_driving_rules
  question: Cuando empieza a llover, ¿por qué las carreteras están más resbaladizas
    durante la primera media hora?
  choices:
    A: La lluvia se mezcla con la sal de la carretera del invierno.
    B: El aceite derramado por los vehículos que pasan aún no ha sido lavado.
    C: El agua crea una capa gruesa de fluido de hidroplaneo.
    D: La banda de rodadura de los neumáticos se vuelve más blanda cuando se expone
      por primera vez al agua.
  answer: B
  explanation: Cuando empieza a llover, las carreteras están más resbaladizas durante
    la primera media hora porque el aceite derramado por los vehículos que pasan no
    ha sido lavado.
- id: 269
  category: vehicle_information
  question: ¿Qué debe hacer si sus frenos se mojan después de conducir a través de
    agua profunda?
  choices:
    A: Bombear los frenos rápida y con fuerza.
    B: Poner el vehículo en punto muerto (neutral) y avanzar por inercia hasta que
      se sequen.
    C: Conducir a alta velocidad para secar al aire las pastillas de freno.
    D: Reducir la velocidad y presionar suavemente el pedal del freno hasta que vuelvan
      a funcionar correctamente.
  answer: D
  explanation: Los frenos pueden mojarse después de conducir a través de agua profunda.
    Debe probarlos, reducir la velocidad y presionar suavemente el pedal del freno
    hasta que los frenos vuelvan a funcionar correctamente.
- id: 270
  category: safe_driving_rules
  question: ¿Qué luces delanteras debe usar al conducir con niebla?
  choices:
    A: Luces altas (intensas)
    B: Luces bajas (cortas)
    C: Solo las luces de estacionamiento
    D: Solo las luces de circulación diurna
  answer: B
  explanation: El manual instruye a los conductores a conducir despacio en la niebla,
    encender las luces bajas y estar preparados para detenerse rápidamente.
- id: 271
  category: defensive_driving
  question: Si su vehículo comienza a derrapar, ¿cuál es el primer paso que debe tomar?
  choices:
    A: Frenar bruscamente de inmediato.
    B: Girar el volante bruscamente en la dirección opuesta.
    C: Quitar el pie del acelerador.
    D: Poner el vehículo en punto muerto (neutral).
  answer: C
  explanation: Si su vehículo comienza a derrapar, el primer paso indicado en el manual
    es quitar el pie del acelerador.
- id: 272
  category: defensive_driving
  question: ¿Cómo debe maniobrar el volante si su vehículo comienza a derrapar?
  choices:
    A: Gire las ruedas delanteras en la dirección a la que desea ir.
    B: Gire las ruedas delanteras en la dirección opuesta al derrape.
    C: Mantenga el volante perfectamente recto.
    D: Gire las ruedas bruscamente hacia el arcén derecho.
  answer: A
  explanation: Al derrapar, debe girar las ruedas delanteras solo lo suficiente para
    mantenerlas apuntando en la dirección a la que desea ir y no más allá.
- id: 273
  category: safe_driving_rules
  question: ¿Qué áreas de la carretera tienden a congelarse antes que el resto de
    la vía en climas fríos?
  choices:
    A: Intersecciones y cruces peatonales
    B: Puentes y pasos inferiores
    C: Rampas de entrada y salida
    D: Carriles para vehículos de alta ocupación (HOV)
  answer: B
  explanation: El manual señala que, en climas fríos, los puentes y pasos inferiores
    se congelan antes que el resto de la carretera.
- id: 274
  category: vehicle_information
  question: ¿Cómo debe aplicar los frenos en una parada de emergencia si su vehículo
    está equipado con frenos antibloqueo (ABS)?
  choices:
    A: Bombee los frenos rápidamente para evitar que las ruedas se bloqueen.
    B: Aplique una presión fuerte y firme desde el principio y manténgala.
    C: Presione el pedal del freno ligeramente y suéltelo repetidamente.
    D: Aplique los frenos con la fuerza justa para no bloquear las ruedas.
  answer: B
  explanation: Con frenos antibloqueo (ABS), debe aplicar el freno con una presión
    fuerte y firme desde el principio y mantener esta presión hasta que se haya detenido.
- id: 275
  category: vehicle_information
  question: ¿Cuál es el método de frenado recomendado para un vehículo sin frenos
    antibloqueo (ABS) durante una parada de emergencia?
  choices:
    A: Aplique una presión fuerte y firme y manténgala hasta detenerse.
    B: Bombee el pedal del freno lo más rápido posible.
    C: Aplique los frenos con la fuerza justa para no bloquear las ruedas, soltando
      y volviendo a aplicar si se bloquean.
    D: Presione el pedal del freno hasta el fondo y manténgalo así.
  answer: C
  explanation: En un vehículo sin frenos antibloqueo (ABS), aplique los frenos con
    la fuerza justa para no bloquear las ruedas. Si se bloquean, libere la presión
    y aplíquela de nuevo, lo que se conoce como frenado de umbral o controlado.
- id: 276
  category: safe_driving_rules
  question: Bajo condiciones normales de conducción en pavimento seco o mojado, ¿cuál
    es la distancia de seguimiento mínima recomendada?
  choices:
    A: 1 a 2 segundos
    B: 3 a 4 segundos
    C: 5 a 6 segundos
    D: 7 a 8 segundos
  answer: B
  explanation: Se requiere una distancia de seguimiento de 3 a 4 segundos para estimar
    cuánto tiempo y espacio tiene para detenerse, ya sea en pavimento seco o mojado.
- id: 277
  category: defensive_driving
  question: Para detectar peligros potenciales y evitar reacciones de último segundo,
    ¿qué tan adelante en la carretera debe mirar?
  choices:
    A: 5 a 10 segundos adelante
    B: 10 a 15 segundos adelante
    C: 20 a 30 segundos adelante
    D: 40 a 50 segundos adelante
  answer: C
  explanation: El manual indica mirar hacia adelante en la carretera de 20 a 30 segundos
    para detectar peligros potenciales y evitar reacciones de último segundo.
- id: 278
  category: safe_driving_rules
  question: ¿Cuándo está legalmente obligado a encender sus faros delanteros?
  choices:
    A: Una hora después de la puesta del sol hasta una hora antes del amanecer.
    B: Media hora después de la puesta del sol hasta media hora antes del amanecer.
    C: Solo cuando esté completamente oscuro afuera.
    D: De 8:00 PM a 6:00 AM.
  answer: B
  explanation: Los faros delanteros deben encenderse media hora después de la puesta
    del sol hasta media hora antes del amanecer, y en otros momentos cuando la visibilidad
    sea reducida.
- id: 279
  category: safe_driving_rules
  question: ¿A qué distancia de un vehículo que viene en sentido contrario es ilegal
    usar o hacer destellos con las luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Es ilegal usar o incluso hacer destellos con las luces altas a menos
    de 500 pies de un vehículo que se aproxima en sentido contrario.
- id: 280
  category: defensive_driving
  question: ¿Qué debe hacer si un conductor que viene en sentido contrario no baja
    sus luces (cambia a luces bajas) por la noche?
  choices:
    A: Haga destellos con sus luces altas continuamente hasta que el otro conductor
      baje las suyas.
    B: Mire directamente a los faros del vehículo que viene para calcular su distancia.
    C: Mantenga la vista en el borde derecho de la carretera adelante.
    D: Encienda la luz interior del techo para ajustar sus ojos.
  answer: C
  explanation: Si los conductores que vienen en sentido contrario no bajan sus luces,
    mantenga la vista en el borde derecho de la carretera adelante y no mire directamente
    a los faros que se aproximan para evitar ser cegado por el resplandor.
- id: 281
  category: defensive_driving
  question: Generalmente, ¿qué es lo más seguro que puede hacer si se ve involucrado
    en una emergencia en la carretera?
  choices:
    A: Pararse en el acotamiento de la carretera y pedir ayuda con la mano.
    B: Permanecer en su vehículo con el cinturón de seguridad abrochado hasta que
      llegue la ayuda.
    C: Caminar por la autopista hasta la estación de servicio más cercana.
    D: Intentar detener a los automovilistas que pasan desde la mediana central.
  answer: B
  explanation: Generalmente, lo más seguro que puede hacer si se ve involucrado en
    una emergencia en la carretera es permanecer en su vehículo, con el cinturón de
    seguridad abrochado, hasta que llegue la ayuda.
- id: 282
  category: driver_responsibility
  question: ¿Cuándo debe retirar su vehículo de la calzada principal después de un
    choque?
  choices:
    A: Solo después de que la policía haya llegado y tomado un informe.
    B: Nunca; los vehículos deben permanecer exactamente donde colisionaron.
    C: Si el choque no resulta en lesiones graves o muerte y el vehículo puede conducirse
      de manera segura.
    D: Solo si el daño a la propiedad se estima en menos de $500.
  answer: C
  explanation: Los vehículos involucrados en choques que no resulten en lesiones graves
    o muerte deberán ser retirados de la calzada principal por el conductor o un pasajero
    si el vehículo puede conducirse y es seguro hacerlo.
- id: 283
  category: driver_responsibility
  question: ¿Debe notificar a la policía después de un choque si hay heridos o si
    los daños a la propiedad superan qué cantidad?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: Debe notificar a la policía si hay heridos o si los daños a la propiedad
    superan los $1,000.
- id: 284
  category: defensive_driving
  question: ¿Qué debe hacer si un choque entre un vehículo y un ciervo es inevitable?
  choices:
    A: Virar bruscamente hacia el carril opuesto para esquivar al ciervo.
    B: Tocar la bocina y encender las luces altas para ahuyentar al ciervo.
    C: No se desvíe; permanezca en su carril y frene con firmeza.
    D: Acelerar para reducir el tiempo de impacto.
  answer: C
  explanation: Si un choque entre un vehículo y un ciervo es inevitable, no se desvíe
    por el ciervo; permanezca en su carril, frene con firmeza y sujete el volante
    con ambas manos.
- id: 285
  category: defensive_driving
  question: ¿Cuál de las siguientes es una forma eficaz de disuadir a los ciervos
    de cruzar delante de su vehículo?
  choices:
    A: Usar silbatos para ciervos.
    B: Hacer destellos con las luces altas.
    C: Tocar la bocina con fuerza.
    D: Ninguna de las anteriores; no confíe en trucos.
  answer: D
  explanation: 'El manual establece: "No confíe en trucos. Los silbatos para ciervos,
    los destellos de las luces altas o tocar la bocina no disuadirán a los ciervos".'
- id: 286
  category: vehicle_information
  question: ¿Por qué nunca debe girar el encendido a la posición de "bloqueo" (lock)
    mientras su vehículo está en movimiento?
  choices:
    A: Hará que el motor se sobrecaliente de inmediato.
    B: El volante se bloqueará, lo que hará que pierda el control del vehículo.
    C: Dañará permanentemente el sistema de frenos antibloqueo (ABS).
    D: Las bolsas de aire se desplegarán automáticamente.
  answer: B
  explanation: Nunca gire el encendido a la posición de "bloqueo" (lock) mientras
    su vehículo esté en movimiento o el volante se bloqueará. Una vez que el volante
    se bloquee, perderá el control del vehículo.
- id: 287
  category: safe_driving_rules
  question: ¿Cuál es la acción recomendada si se le poncha una llanta mientras conduce
    en una zona de alto riesgo o de noche?
  choices:
    A: Detenerse de inmediato y cambiar la llanta en el acotamiento.
    B: Detenerse en medio de la carretera y encender las luces de emergencia.
    C: Intentar conducir lentamente hasta una estación de servicio o tienda con un
      estacionamiento bien iluminado.
    D: Abandonar el vehículo y caminar para buscar ayuda.
  answer: C
  explanation: No salga a reparar una llanta ponchada. Intente conducir lentamente
    hasta una estación de servicio o tienda con un estacionamiento bien iluminado
    y llame por teléfono para solicitar servicio.
- id: 288
  category: safe_driving_rules
  question: ¿Qué debe hacer si su automóvil queda averiado en la calzada?
  choices:
    A: Pararse detrás del automóvil para advertir al tráfico que se aproxima.
    B: Retirarse lo más posible de la parte transitada de la calzada y activar las
      luces de emergencia de cuatro vías.
    C: Salir de su vehículo inmediatamente y caminar por la autopista para buscar
      ayuda.
    D: Apagar todas las luces para ahorrar batería y esperar a la policía.
  answer: B
  explanation: Si su automóvil queda averiado, retírese lo más posible de la parte
    transitada de la calzada, active las luces de emergencia de cuatro vías y permanezca
    dentro de su vehículo con el cinturón de seguridad bien abrochado.
- id: 289
  category: defensive_driving
  question: Si un asaltante de vehículos (carjacker) lo amenaza y le exige su vehículo,
    ¿cuál es la acción recomendada?
  choices:
    A: Luchar contra el asaltante para proteger su propiedad.
    B: Negarse a abrir las puertas y tocar la bocina continuamente.
    C: Entregar el vehículo sin luchar.
    D: Intentar alejarse conduciendo lo más rápido posible.
  answer: C
  explanation: Si un asaltante quiere el vehículo, entréguelo sin luchar. Un automóvil
    puede ser reemplazado, pero la seguridad personal no tiene precio.
- id: 290
  category: safe_driving_rules
  question: Cuando un oficial de la ley lo detenga, ¿dónde debe mantener las manos?
  choices:
    A: En sus bolsillos o en su regazo.
    B: Buscando en la guantera para sacar su registro.
    C: Vacías y a la vista sobre el volante.
    D: Fuera de la ventana del lado del conductor.
  answer: C
  explanation: Durante una parada de tráfico, debe mantener ambas manos vacías y a
    la vista sobre el volante.
- id: 291
  category: driver_responsibility
  question: ¿Cuándo debe sacar su licencia, registro y tarjeta de seguro durante una
    parada de tráfico?
  choices:
    A: Tan pronto como se detenga, antes de que el oficial se acerque.
    B: Solo cuando el oficial se los pida.
    C: Mientras el oficial camina hacia su vehículo.
    D: No necesita proporcionarlos a menos que esté bajo arresto.
  answer: B
  explanation: Saque su licencia, registro y tarjeta de seguro solo cuando el oficial
    se los pida. Informe al oficial dónde se encuentran estos artículos antes de sacarlos.
- id: 292
  category: driver_responsibility
  question: ¿Qué debe hacer si cree que la parada de tráfico o la multa emitida por
    un oficial es inapropiada?
  choices:
    A: Discutir con el oficial sobre el motivo de la parada.
    B: Negarse a aceptar la multa del oficial.
    C: Discutir el asunto con el tribunal, no con el oficial.
    D: Conducir alejándose antes de que el oficial termine de escribir la multa.
  answer: C
  explanation: Si considera que la parada o la multa es inapropiada, discuta el asunto
    con el tribunal, no con el oficial. No discuta sobre el motivo de la parada.
- id: 293
  category: signs_and_signals
  question: Si las instrucciones de un oficial de la ley entran en conflicto con un
    dispositivo de control de tráfico, ¿cuál debe seguir?
  choices:
    A: El dispositivo de control de tráfico.
    B: Las órdenes del oficial de la ley.
    C: Lo que parezca más seguro en ese momento.
    D: Debe detenerse y esperar a que el dispositivo de control de tráfico cambie.
  answer: B
  explanation: Siempre obedezca las órdenes de un oficial de la ley. Las instrucciones
    de un oficial tienen prioridad sobre otros dispositivos de control de tráfico.
- id: 294
  category: safe_driving_rules
  question: Según la ley de Michigan, ¿está permitido usar un teléfono móvil mientras
    se conduce para informar una emergencia?
  choices:
    A: No, el uso del teléfono móvil está estrictamente prohibido en todo momento.
    B: Sí, pero solo si conduce a menos de 30 mph.
    C: Sí, se permite el uso de un teléfono móvil mientras se conduce para informar
      emergencias.
    D: No, primero debe detenerse a un lado y apagar el motor.
  answer: C
  explanation: Si tiene problemas, pida ayuda con su teléfono móvil. El uso de un
    teléfono móvil mientras se conduce para informar emergencias está permitido según
    la ley de Michigan.
- id: 295
  category: defensive_driving
  question: ¿Por qué la conducción en la ciudad se considera generalmente más peligrosa
    que la conducción en autopistas?
  choices:
    A: Debido a los límites de velocidad más bajos.
    B: Debido a los carriles de conducción más estrechos.
    C: Debido al tráfico cruzado y a los peatones.
    D: Debido a las peores condiciones de la carretera en mal tiempo.
  answer: C
  explanation: Según la prueba de conocimientos de conducción segura, la conducción
    en la ciudad es más peligrosa que la conducción en autopistas debido al tráfico
    cruzado y a los peatones.
- id: 296
  category: signs_and_signals
  question: ¿Qué debe hacer cuando llega a una intersección con una luz roja intermitente?
  choices:
    A: Reducir la velocidad y conducir con cuidado a través de la intersección.
    B: Girar a la derecha o a la izquierda ya que el camino está bloqueado más adelante.
    C: Detenerse en la intersección y esperar una luz verde intermitente.
    D: Detenerse en la intersección y luego avanzar según lo permita el tráfico.
  answer: D
  explanation: Cuando llegue a una intersección con una luz roja intermitente, debe
    detenerse en la intersección y luego avanzar según lo permita el tráfico.
- id: 297
  category: safe_driving_rules
  question: 'Cuando conduce por el carril derecho en una autopista, probablemente
    debería cambiarse al carril izquierdo cuando:'
  choices:
    A: El tráfico es pesado pero se mueve de manera constante.
    B: El clima es malo y las carreteras están resbaladizas.
    C: El tráfico es lento en su carril y hay autos en el carril izquierdo.
    D: El tráfico es ligero y hay autos incorporándose a la autopista desde la derecha.
  answer: D
  explanation: Probablemente debería cambiarse al carril izquierdo cuando el tráfico
    es ligero y hay autos incorporándose a la autopista desde la derecha para permitirles
    espacio para entrar de manera segura.
- id: 298
  category: defensive_driving
  question: Para reducir los efectos del resplandor de los faros por la noche, ¿hacia
    dónde debe mirar?
  choices:
    A: Directamente hacia adelante.
    B: Por encima de su hombro.
    C: Al centro de la carretera.
    D: Hacia el borde derecho de la carretera.
  answer: D
  explanation: Para reducir los efectos del resplandor de los faros por la noche,
    debe mirar hacia el borde derecho de la carretera.
- id: 299
  category: safe_driving_rules
  question: ¿Cuál es la forma adecuada de revisar su punto ciego al cambiar de carril?
  choices:
    A: Usando el espejo retrovisor interior.
    B: Usando el espejo retrovisor exterior.
    C: Usando tanto el espejo retrovisor interior como el exterior.
    D: Girando la cabeza y mirando por encima del hombro.
  answer: D
  explanation: Al cambiar de carril, puede revisar su punto ciego girando la cabeza
    y mirando por encima del hombro.
- id: 300
  category: signs_and_signals
  question: Al acercarse a una zona de obras con una señal de '45 cuando haya trabajadores
    presentes' (Where Workers Present 45), ¿qué deben hacer los conductores?
  choices:
    A: Reducir la velocidad inmediatamente a 25 mph.
    B: Conducir a una velocidad segura para las condiciones, estar atento a los trabajadores
      y reducir la velocidad a 45 mph o menos donde haya trabajadores presentes.
    C: Incorporarse al carril derecho de inmediato.
    D: Detenerse y esperar a que un trabajador de la construcción le indique que pase.
  answer: B
  explanation: Los conductores deben conducir a una velocidad segura para las condiciones
    (hasta el límite de velocidad indicado), estar atentos a los trabajadores de la
    construcción y reducir la velocidad a 45 mph o menos donde haya trabajadores presentes.
- id: 301
  category: sharing_the_road
  question: ¿Cuál es la forma más segura de rebasar a un ciclista que viaja en la
    misma dirección mientras conduce por una carretera de dos carriles sin carriles
    para bicicletas?
  choices:
    A: Reduzca la velocidad, espere hasta que no haya tráfico aproximándose y rebase
      dejando suficiente espacio.
    B: Continúe conduciendo en línea recta; es responsabilidad del ciclista moverse.
    C: No rebase al ciclista hasta llegar a un semáforo o una señal de alto.
    D: Toque la bocina para avisarle al ciclista que está a punto de rebasarlo de
      cerca.
  answer: A
  explanation: La forma más segura de rebasar a un ciclista en una carretera de dos
    carriles es reducir la velocidad y esperar hasta que no haya tráfico aproximándose,
    luego rebasar al ciclista dejándole suficiente espacio.
- id: 302
  category: defensive_driving
  question: Para mantener la conciencia de una conducción segura, ¿cuánto tiempo debe
    mirar cualquier objeto mientras conduce?
  choices:
    A: Hasta que lo haya pasado por completo.
    B: Por no más de unos pocos segundos.
    C: Al menos cinco segundos para asegurarse de reconocer el peligro.
    D: Solo debe mirar hacia adelante en todo momento.
  answer: B
  explanation: Para ayudar a mantenerse seguro, debe evitar mirar cualquier objeto
    por más de unos pocos segundos.
- id: 303
  category: vehicle_information
  question: ¿Cuál de los siguientes servicios relacionados con vehículos se puede
    realizar en línea en Michigan.gov/SOS?
  choices:
    A: Obtener una inspección de vehículo por primera vez
    B: Reemplazar el registro o el título de un vehículo
    C: Impugnar una multa de estacionamiento
    D: Reportar un vehículo abandonado
  answer: B
  explanation: Según el manual, puede reemplazar el registro o el título de un vehículo
    en línea en Michigan.gov/SOS.
- id: 304
  category: driver_testing
  question: ¿De cuánto es la tarifa de conveniencia para realizar el examen escrito
    de conocimientos para la licencia de conducir en línea desde casa?
  choices:
    A: $5.00
    B: $6.50
    C: $10.00
    D: $15.50
  answer: B
  explanation: El examen escrito de conocimientos para la licencia de conducir está
    disponible en línea para realizarse en casa por una tarifa de conveniencia de
    $6.50.
- id: 305
  category: driver_testing
  question: ¿En qué formatos están disponibles los exámenes originales de licencia
    de conducir para personas que no son hablantes nativos?
  choices:
    A: Formatos electrónicos, en papel o de audio
    B: Solo en formato de papel
    C: Solo a través de un traductor en vivo
    D: Solo en formato electrónico
  answer: A
  explanation: Los exámenes originales de licencia de conducir están disponibles en
    muchos idiomas extranjeros en formatos electrónicos, en papel o de audio.
- id: 306
  category: license_system
  question: Si un cliente con problemas de audición o sordo necesita comunicarse con
    la Secretaría de Estado, ¿qué servicio debe utilizar?
  choices:
    A: El Michigan Relay Center al 711
    B: El Centro de Información al 888-SOS-MICH
    C: El portal de chat en línea en Michigan.gov
    D: El departamento de policía local
  answer: A
  explanation: Los clientes con problemas de audición o sordos deben comunicarse con
    el Michigan Relay Center al 711.
- id: 307
  category: license_system
  question: ¿Cuál de los siguientes servicios de licencia de conducir está disponible
    en línea en Michigan.gov/SOS?
  choices:
    A: Realizar el examen de habilidades de conducción en carretera
    B: Pre-solicitar una licencia de conducir original
    C: Tomarse una fotografía por primera vez
    D: Entregar una licencia revocada
  answer: B
  explanation: Los servicios disponibles en Michigan.gov/SOS incluyen la pre-solicitud
    de una licencia de conducir original.
- id: 308
  category: license_system
  question: ¿Cuál es el número de teléfono del Centro de Información del Departamento
    de Estado de Michigan?
  choices:
    A: 800-MICH-SOS
    B: 888-SOS-MICH
    C: '911'
    D: 877-DRIVE-MI
  answer: B
  explanation: Si tiene preguntas o necesita más información sobre cualquier servicio
    ofrecido por la Secretaría de Estado, llame al Centro de Información del Departamento
    de Estado de Michigan al 888-SOS-MICH (767-6424).
- id: 309
  category: license_system
  question: ¿Cuál de los siguientes datos puede actualizar en línea a través del sitio
    web de la Secretaría de Estado?
  choices:
    A: El registro de emisiones de su vehículo
    B: Su información de contacto de emergencia
    C: Su puntaje del examen de conducir
    D: Su historial de citaciones de tráfico
  answer: B
  explanation: Puede actualizar su información de contacto de emergencia en línea
    en Michigan.gov/SOS.
- id: 310
  category: driver_responsibility
  question: ¿Dónde puede encontrar el Centro de Información para Votantes de Michigan
    en línea?
  choices:
    A: Michigan.gov/Vote
    B: Michigan.gov/Elections
    C: Michigan.gov/SOS
    D: Michigan.gov/VoterInfo
  answer: A
  explanation: El manual establece que el Centro de Información para Votantes de Michigan
    se encuentra en Michigan.gov/Vote.
- id: 311
  category: license_system
  question: ¿Cuál de los siguientes es un servicio en línea proporcionado por la Secretaría
    de Estado con respecto al Registro de Donantes de Órganos de Michigan?
  choices:
    A: Programar una cirugía de donación de órganos
    B: Unirse al registro y reemplazar su calcomanía de corazón de donante de órganos
    C: Solicitar una evaluación médica para la donación
    D: Ver los registros médicos de los donantes de órganos
  answer: B
  explanation: Los servicios en línea incluyen unirse al Registro de Donantes de Órganos
    de Michigan y reemplazar su calcomanía de corazón de donante de órganos.
- id: 312
  category: penalties_and_points
  question: ¿Se pueden pagar las tarifas de restablecimiento de la licencia en línea?
  choices:
    A: No, deben pagarse en persona en una oficina sucursal.
    B: No, deben enviarse por correo al Departamento de Estado.
    C: Sí, puede pagar las tarifas de restablecimiento de la licencia en línea en
      Michigan.gov/SOS.
    D: Sí, pero solo a través de un procesador de pagos de terceros.
  answer: C
  explanation: El pago de las tarifas de restablecimiento de la licencia figura como
    uno de los "Más servicios" disponibles en línea en Michigan.gov/SOS.
- id: 313
  category: license_system
  question: ¿Qué material de recursos está designado como SOS-194?
  choices:
    A: Manual de Licencia de Conducir Comercial de Michigan
    B: Guía de Estudio para el Examen de Habilidades de Conducción
    C: Guía de Michigan para Conductores de Edad Avanzada y sus Familias
    D: La Guía de Conducción Supervisada
  answer: C
  explanation: La lista de materiales de recursos identifica la "Guía de Michigan
    para Conductores de Edad Avanzada y sus Familias" como SOS-194.
- id: 314
  category: vehicle_information
  question: Además de renovar el registro de su automóvil, motocicleta o camión en
    línea, ¿qué más le recuerda el manual que no olvide?
  choices:
    A: Su comprobante de seguro
    B: Su Pasaporte Recreativo (Recreation Passport)
    C: Su certificado de emisiones
    D: Su recibo de impuestos sobre la propiedad
  answer: B
  explanation: Bajo los servicios de vehículos en línea, dice "Renueve su automóvil,
    motocicleta o camión (Y no olvide su Pasaporte Recreativo)".
- id: 315
  category: license_system
  question: ¿Cuál de los siguientes endosos se puede agregar a su licencia en línea
    si es elegible?
  choices:
    A: Endoso de Conductor Comercial (CDL)
    B: Endoso de Chofer
    C: Endoso de Motocicleta
    D: Endoso de Materiales Peligrosos (Hazmat)
  answer: C
  explanation: La lista de servicios en línea incluye "Agregar un endoso de motocicleta
    (si es elegible)".
- id: 316
  category: license_system
  question: Si necesita solicitar su historial de conducción, ¿cómo puede hacerlo
    según el manual?
  choices:
    A: Visitando una estación de policía
    B: Enviando una solicitud en línea en Michigan.gov/SOS
    C: Llamando a la Comisión de Seguridad del Estado de Michigan
    D: Contactando al Centro de Michigan para la Seguridad de Camiones
  answer: B
  explanation: '"Solicitar su historial de conducción" figura en la lista de servicios
    en línea disponibles en Michigan.gov/SOS.'
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de ingresar a
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 317
- image: yield.png
  category: signs_and_signals
  question: ¿Qué requiere que haga esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 318
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 319
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 320
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: El tráfico fluye en una sola dirección — hacia la izquierda
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: Una señal de sentido único (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección — la dirección
    que señala la flecha.
  id: 321
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 322
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 323
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 324
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de "ZONA DE NO REBASAR"
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 325
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "MANTÉNGASE A LA DERECHA" (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 326
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 327
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta área
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan la carretera con frecuencia en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 328
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 329
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal de forma pentagonal (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 330
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 331
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de trenes. Significa que debe ceder el paso a los trenes. Si se
    aproxima un tren, debe detenerse.
  id: 332
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 333
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 334
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 335
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 336
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: Inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 337
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 338
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 339
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 340
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que circulan en la dirección opuesta.
  id: 341
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 342
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 343
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo
    donde el semáforo puede no ser visible desde la distancia.
  id: 344
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 345
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las carreteras
    laterales.
  id: 346
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la carretera principal desde la carretera
    lateral.
  id: 347
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: 'Se está añadiendo un nuevo carril: no es necesario incorporarse'
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de fusionarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 348
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 349
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que muestren un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 350
