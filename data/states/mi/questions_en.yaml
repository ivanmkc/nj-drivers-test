metadata:
  source: What Every Driver Must Know (Oct 2025 ed.) (Michigan.gov/SOS)
  total_questions: 350
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: safe_driving_rules
  question: According to the manual, what is the rule regarding cell phone use while
    driving?
  choices:
    A: It is allowed for adults but prohibited for teens.
    B: It is prohibited for all drivers, including teens.
    C: It is allowed only in emergencies.
    D: It is permitted if using a hands-free device.
  answer: B
  explanation: The manual explicitly states in its traffic laws section that cell
    phone use is 'prohibited for all drivers – including teens'.
- id: 2
  category: license_system
  question: Which licensing program applies specifically to drivers who are under
    18 years old?
  choices:
    A: The Probationary License Program
    B: The Chauffeur License Program
    C: Graduated Driver Licensing
    D: The Commercial Driver Licensing Program
  answer: C
  explanation: The manual includes a specific section in Chapter 1 titled 'Under 18
    – Graduated Driver Licensing'.
- id: 3
  category: safe_driving_rules
  question: What does the manual explicitly state about wearing a seatbelt?
  choices:
    A: It is recommended but optional.
    B: It is only required for passengers under 18.
    C: It is only required on highways.
    D: It is the law to buckle up.
  answer: D
  explanation: The manual contains a section under Traffic Laws explicitly titled
    'Buckle up, it’s the law!'.
- id: 4
  category: penalties_and_points
  question: In which chapter of the manual would you find information about Michigan's
    point system?
  choices:
    A: 'Chapter 1: Your Driver''s License'
    B: 'Chapter 2: Your Driving Record'
    C: 'Chapter 4: Traffic Laws'
    D: 'Chapter 5: Signs, Pavement Markings and Signals'
  answer: B
  explanation: 'According to the Table of Contents, ''Michigan''s point system'' is
    covered in Chapter 2: Your Driving Record.'
- id: 5
  category: license_system
  question: According to the manual, a driver may receive a restricted license due
    to what specific reason?
  choices:
    A: A health condition
    B: Unpaid parking tickets
    C: Lack of vehicle insurance
    D: Failing the vision test
  answer: A
  explanation: Chapter 1 of the manual includes a section titled 'Restricted license
    due to a health condition'.
- id: 6
  category: sharing_the_road
  question: What phrase does the manual use to describe the relationship between trains
    and vehicles at grade crossings?
  choices:
    A: Trains and vehicles always have the right of way
    B: Trains and vehicles DO NOT MIX
    C: Vehicles must speed up to beat trains
    D: Trains must yield to vehicles
  answer: B
  explanation: The manual includes a specific grade crossing safety tip section titled
    'Trains and vehicles DO NOT MIX'.
- id: 7
  category: sharing_the_road
  question: Which of the following specific right-of-way situations is explicitly
    covered in Chapter 4 of the manual?
  choices:
    A: Right of way and bicycles
    B: Right of way and farm equipment
    C: Right of way and funerals
    D: Right of way and parades
  answer: C
  explanation: Chapter 4 (Traffic Laws) includes a specific section titled 'Right
    of way and funerals'.
- id: 8
  category: signs_and_signals
  question: Where would a driver look in the manual to learn about traffic sign colors?
  choices:
    A: Chapter 1
    B: Chapter 2
    C: Chapter 3
    D: Chapter 5
  answer: D
  explanation: 'The topic ''Traffic sign colors'' is listed under Chapter 5: Signs,
    Pavement Markings and Signals.'
- id: 9
  category: license_system
  question: When applying for a license, which of the following is explicitly listed
    in the manual as a requirement to provide?
  choices:
    A: Proof of employment
    B: Proof of vehicle ownership
    C: Proof of legal presence
    D: Proof of high school graduation
  answer: C
  explanation: Chapter 1 lists several requirements for licensing, including 'Providing
    proof of legal presence'.
- id: 10
  category: driver_responsibility
  question: Along with State IDs, what other topic is covered in Chapter 3?
  choices:
    A: Vehicle Registration
    B: Voter Registration
    C: Organ Donation
    D: Jury Duty
  answer: B
  explanation: Chapter 3 is titled 'Voter Registration and State IDs'.
- id: 11
  category: signs_and_signals
  question: What type of sign is specifically mentioned in the manual regarding railroad
    crossings?
  choices:
    A: Emergency Notification System sign
    B: High Speed Train Warning sign
    C: Quiet Zone sign
    D: No Trespassing sign
  answer: A
  explanation: The manual includes a section under Railroad crossings titled 'What
    is an Emergency Notification System sign?'.
- id: 12
  category: safe_driving_rules
  question: What specific type of disability parking is highlighted in the manual's
    traffic laws section?
  choices:
    A: Motorcycle-accessible disability parking
    B: Van-accessible disability parking
    C: RV-accessible disability parking
    D: Commercial-accessible disability parking
  answer: B
  explanation: Under the Parking section in Chapter 4, there is a specific heading
    for 'Van-accessible disability parking'.
- id: 13
  category: signs_and_signals
  question: The manual categorizes railroad crossing control systems into which two
    types?
  choices:
    A: Manual and automatic
    B: Primary and secondary
    C: Passive and active
    D: Lighted and unlighted
  answer: C
  explanation: 'The manual lists two specific sections for these systems: ''Passive
    railroad crossing control systems'' and ''Active railroad crossing control systems''.'
- id: 14
  category: license_system
  question: What specific type of Temporary Instruction Permit (TIP) is explicitly
    listed in the manual?
  choices:
    A: The commercial TIP
    B: The motorcycle TIP
    C: The agricultural TIP
    D: The chauffeur TIP
  answer: B
  explanation: Under the 'Temporary instruction permit' section in Chapter 1, the
    manual specifically lists 'The motorcycle TIP'.
- id: 15
  category: license_system
  question: The manual contains a specific section for individuals who have never
    been licensed starting at what age?
  choices:
    A: 16 and older
    B: 18 and older
    C: 21 and older
    D: 25 and older
  answer: B
  explanation: Chapter 1 includes a specific section titled '18 and older – never
    been licensed'.
- id: 16
  category: signs_and_signals
  question: Which of the following is a specific type of left-turn signal head mentioned
    in the manual?
  choices:
    A: Flashing red arrow
    B: Flashing yellow arrow
    C: Steady red arrow
    D: Flashing green arrow
  answer: B
  explanation: The manual specifically lists the 'Flashing yellow arrow left-turn
    signal head' in the traffic signals section.
- id: 17
  category: signs_and_signals
  question: What color are the triangular symbols used in pavement markings?
  choices:
    A: Yellow
    B: Red
    C: White
    D: Orange
  answer: C
  explanation: The pavement markings section of the manual specifically mentions 'White
    triangular symbols'.
- id: 18
  category: signs_and_signals
  question: What type of beacon is specifically associated with pedestrian crossings
    in the manual?
  choices:
    A: Pedestrian Hybrid Beacon
    B: Flashing Crosswalk Beacon
    C: Steady Red Beacon
    D: Pedestrian Warning Beacon
  answer: A
  explanation: The manual lists the 'Pedestrian Hybrid Beacon' under the pedestrian
    signals section.
- id: 19
  category: signs_and_signals
  question: According to the manual's section on traffic signals, which of the following
    is a recognized signal head configuration?
  choices:
    A: The 3-section-head signal
    B: The 4-section-head signal
    C: The 5-section-head signal
    D: The 6-section-head signal
  answer: C
  explanation: The traffic signals section of the manual specifically covers 'The
    5-section-head signal'.
- id: 20
  category: defensive_driving
  question: Which specific type of animal crash is highlighted in the emergencies
    section of the manual?
  choices:
    A: Vehicle – bear crashes
    B: Vehicle – dog crashes
    C: Vehicle – moose crashes
    D: Vehicle – deer crashes
  answer: D
  explanation: Chapter 7 covers emergencies and specifically discusses 'Vehicle –
    deer crashes' and your best defense against them.
- id: 21
  category: safe_driving_rules
  question: Which of the following weather conditions are specifically grouped together
    in the manual's section on bad weather?
  choices:
    A: Wind and hail
    B: Rain and fog
    C: Snow and sleet
    D: Tornadoes and floods
  answer: B
  explanation: In the section on bad weather, the manual specifically groups 'Rain
    and fog' together.
- id: 22
  category: safe_driving_rules
  question: What specific condition is listed as a hazard of freeway driving?
  choices:
    A: Freeway fatigue
    B: Highway hypnosis
    C: Tollbooth delays
    D: Off-ramp speeding
  answer: A
  explanation: The manual lists 'Freeway fatigue' as a specific topic under freeway
    driving.
- id: 23
  category: signs_and_signals
  question: Under which category of pavement markings are 'Left turn only center lanes'
    discussed?
  choices:
    A: White lines
    B: Yellow lines
    C: Red lines
    D: Blue lines
  answer: B
  explanation: In the pavement markings section, the 'Left turn only center lane'
    is categorized under 'Yellow lines'.
- id: 24
  category: signs_and_signals
  question: Which of the following is listed as a type of white line pavement marking?
  choices:
    A: Broken white lines
    B: Wavy white lines
    C: Zig-zag white lines
    D: Dotted white lines
  answer: A
  explanation: The manual lists 'Broken white lines' as a specific type of white line
    pavement marking.
- id: 25
  category: sharing_the_road
  question: What type of vehicle is specifically mentioned alongside motorcycles,
    scooters, and mopeds in the sharing the road chapter?
  choices:
    A: Hoverboards
    B: Bicycles
    C: Golf carts
    D: ATVs
  answer: B
  explanation: Chapter 6 on sharing the road groups 'Motorcycles, scooters, mopeds
    and bicycles' together.
- id: 26
  category: sharing_the_road
  question: Which of the following is a vehicle specifically categorized in the 'Sharing
    the Road' chapter?
  choices:
    A: Tricycles
    B: Autocycles
    C: Sidecars
    D: Tri-bikes
  answer: B
  explanation: 'The manual includes a specific section on ''Autocycles'' in Chapter
    6: Sharing the Road.'
- id: 27
  category: signs_and_signals
  question: What type of arrow is specifically listed as a steady traffic signal?
  choices:
    A: Steady red arrow
    B: Steady yellow arrow
    C: Steady green arrow
    D: Steady blue arrow
  answer: C
  explanation: The traffic signals section specifically lists the 'Steady green arrow'.
- id: 28
  category: signs_and_signals
  question: According to the manual, what type of lines are used for crosswalks and
    stop lines?
  choices:
    A: Yellow lines
    B: White lines
    C: Red lines
    D: Green lines
  answer: B
  explanation: The manual categorizes both 'Crosswalk lines' and 'Stop lines' under
    the 'White lines' section of pavement markings.
- id: 29
  category: defensive_driving
  question: Which of the following is a specific topic covered under 'Emergencies
    and Special Situations'?
  choices:
    A: Aggressive driving
    B: Parallel parking
    C: Renewing your license
    D: Buying a vehicle
  answer: A
  explanation: Chapter 7, which covers Emergencies and Special Situations, includes
    a section on 'Aggressive driving'.
- id: 30
  category: driver_responsibility
  question: 'According to the Michigan driver''s manual, driving is considered:'
  choices:
    A: A constitutional right
    B: A privilege and not a right
    C: A right for residents over 18
    D: An optional privilege for non-residents
  answer: B
  explanation: The manual explicitly states in the Introduction that 'Driving is a
    privilege and not a right.'
- id: 31
  category: driver_responsibility
  question: In 2023, how many crashes in Michigan resulted from a driver, pedestrian,
    or bicyclist using a cell phone?
  choices:
    A: 1,021
    B: 1,725
    C: 2,284
    D: 51,097
  answer: C
  explanation: According to the 2023 Michigan crash facts, a total of 2,284 crashes
    resulted from a driver, pedestrian, or bicyclist using a cell phone.
- id: 32
  category: alcohol_drugs_health
  question: What percentage of fatal crashes in Michigan in 2023 were alcohol-involved?
  choices:
    A: 6.6%
    B: 10.1%
    C: 26.6%
    D: 50.0%
  answer: C
  explanation: The manual states that of the 1,021 fatal crashes that occurred in
    Michigan, 272 (26.6%) were alcohol-involved.
- id: 33
  category: driver_responsibility
  question: While licensed drivers ages 15-20 represent only 6.6 percent of Michigan's
    driving population, they represent what percentage of drivers in all crashes?
  choices:
    A: 6.6%
    B: 8.2%
    C: 10.1%
    D: 26.6%
  answer: C
  explanation: The 2023 crash facts note that drivers in the 15-20 age group represented
    10.1 percent of drivers in all crashes.
- id: 34
  category: driver_responsibility
  question: When you join the Michigan Organ Donor Registry, you agree to become a
    donor to save up to how many lives?
  choices:
    A: 4 lives
    B: 8 lives
    C: 12 lives
    D: 125 lives
  answer: B
  explanation: Joining the Michigan Organ Donor Registry means you agree to become
    an organ, eye and tissue donor to save up to 8 lives, and potentially heal up
    to 125 others.
- id: 35
  category: driver_responsibility
  question: What is the age limit for joining the Michigan Organ Donor Registry?
  choices:
    A: You must be at least 16 years old.
    B: You must be at least 18 years old.
    C: You must be under 65 years old.
    D: There is no age limit for organ and tissue donation.
  answer: D
  explanation: The manual states under the facts about organ donation that 'There
    is no age limit for organ and tissue donation.'
- id: 36
  category: license_system
  question: What happens to your out-of-state driver's license when your application
    for a Michigan license is accepted?
  choices:
    A: It is destroyed by the Secretary of State.
    B: It is invalidated and returned to you.
    C: It remains valid for 30 days.
    D: It is sent back to your previous home state.
  answer: B
  explanation: When your application for a Michigan license is accepted, your out-of-state
    driver's license will be invalidated and returned to you.
- id: 37
  category: license_system
  question: If you are a new Michigan resident and your out-of-state driver's license
    is suspended or revoked, what must you do before applying for a Michigan license?
  choices:
    A: Pay a fine to the Michigan Secretary of State.
    B: Wait 36 months before applying.
    C: Contact your previous state to clear any outstanding issues.
    D: Take a remedial driving course in Michigan.
  answer: C
  explanation: If your out-of-state driver's license is suspended or revoked, you
    must contact your previous state to clear any outstanding issues before your application
    for a Michigan license will be accepted.
- id: 38
  category: license_system
  question: You will NOT be issued a Michigan driver's license if you have never been
    issued a license and have how many convictions for moving violations on your driving
    record within three years of applying?
  choices:
    A: One or more
    B: Two or more
    C: Three or more
    D: Four or more
  answer: B
  explanation: You will not be issued a Michigan license if you have never been issued
    a driver's license by any state or country AND you have two or more convictions
    for moving violations on your driving record within three years of the date that
    you apply.
- id: 39
  category: license_system
  question: What is the minimum age required to obtain a Michigan chauffeur's license?
  choices:
    A: '14'
    B: '16'
    C: '18'
    D: '21'
  answer: B
  explanation: 'Under the Chauffeur''s license section, the manual states: ''You must
    be at least age 16.'''
- id: 40
  category: license_system
  question: 'A chauffeur''s license is required if you are employed for the principal
    purpose of operating a motor vehicle with a Gross Vehicle Weight Rating (GVWR)
    of at least:'
  choices:
    A: 5,000 pounds
    B: 10,000 pounds
    C: 15,000 pounds
    D: 26,001 pounds
  answer: B
  explanation: A chauffeur's license is required if you are employed for the principal
    purpose of operating a motor vehicle with a Gross Vehicle Weight Rating (GVWR)
    of 10,000 pounds or more.
- id: 41
  category: license_system
  question: Before you can operate a commercial motor vehicle across state lines,
    you must be at least what age?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: 'The manual states: ''You must be at least age 21 to drive a vehicle
    across state lines or to transport hazardous materials in amounts that require
    placarding.'''
- id: 42
  category: license_system
  question: 'Drivers between the ages of 18 and 21 who hold a commercial driver''s
    license (CDL) are restricted to operating a commercial vehicle:'
  choices:
    A: Only during daylight hours
    B: Only in Michigan
    C: Only with a licensed passenger over 21
    D: Only for agricultural purposes
  answer: B
  explanation: According to the Commercial driver's license section, 'Drivers between
    ages 18 and 21 can operate a commercial vehicle only in Michigan.'
- id: 43
  category: license_system
  question: To operate commercial motor vehicles, you must have been suspension-free
    for how many months before the date of application?
  choices:
    A: 12 months
    B: 24 months
    C: 36 months
    D: 48 months
  answer: C
  explanation: Before you can operate commercial motor vehicles, you must be at least
    age 18, have been suspension free for 36 months before the date of application,
    and have the appropriate Michigan CDL group designation.
- id: 44
  category: license_system
  question: Under Michigan law, how many valid driver's licenses is a driver allowed
    to hold at one time?
  choices:
    A: One
    B: Two (one personal, one commercial)
    C: One from each state of residence
    D: Up to three
  answer: A
  explanation: 'The manual explicitly states: ''Michigan law allows drivers to hold
    only one valid driver''s license at a time.'''
- id: 45
  category: license_system
  question: How old must you be to drive a commercial vehicle across state lines or
    transport hazardous materials requiring placarding?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: According to the manual, you must be at least age 21 to drive a commercial
    vehicle across state lines or to transport hazardous materials in amounts that
    require placarding.
- id: 46
  category: license_system
  question: An Enhanced driver's license allows you to re-enter the United States
    by land or sea from which of the following locations without additional identity
    documents?
  choices:
    A: Europe and Asia
    B: Canada, Mexico, Bermuda and the Caribbean
    C: South America and Central America
    D: Any foreign country
  answer: B
  explanation: The Enhanced driver's license allows you to re-enter the United States
    by land or sea from Canada, Mexico, Bermuda and the Caribbean without the need
    to present any additional identity documents.
- id: 47
  category: license_system
  question: At what age can an unlicensed teen apply for a moped license with parental
    approval?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: B
  explanation: Unlicensed teens age 15 or older with parental approval may apply for
    a moped license at a Secretary of State office.
- id: 48
  category: driver_testing
  question: When is a motorcycle rider education course required for an adult applicant?
  choices:
    A: When they have never driven a car
    B: When they fail the motorcycle skills test twice
    C: When they are over the age of 65
    D: When they want to ride a three-wheeled motorcycle
  answer: B
  explanation: A motorcycle rider education course is required for teens ages 16-17
    and for adults who fail the motorcycle skills test twice.
- id: 49
  category: license_system
  question: What endorsement is required for a pickup truck pulling a fifth-wheel
    trailer designed for recreational living, with a second trailer attached to the
    rear?
  choices:
    A: Farmer endorsement
    B: Commercial Driver's License (CDL)
    C: Recreational Double "R" endorsement
    D: CY 3W restriction
  answer: C
  explanation: The Recreational Double "R" endorsement is required for a pickup truck
    pulling a fifth-wheel trailer designed for recreational living purposes, with
    a second trailer attached to the rear.
- id: 50
  category: license_system
  question: Beginning May 7, 2025, what type of document must Michigan residents present
    to board a domestic flight in the United States?
  choices:
    A: A standard Michigan driver's license
    B: A REAL ID-compliant document
    C: A birth certificate
    D: A voter registration card
  answer: B
  explanation: Beginning May 7, 2025, Michigan residents boarding a plane for domestic
    travel in the United States must present a REAL ID-compliant document.
- id: 51
  category: license_system
  question: How can you tell if a standard Michigan driver's license or state ID card
    is REAL ID compliant?
  choices:
    A: It has a barcode on the front
    B: It is printed on blue plastic
    C: It has a star in a gold circle or a star in an image of Michigan
    D: It has a microchip embedded in it
  answer: C
  explanation: You will know that a Michigan driver's license or state ID card is
    REAL ID compliant because it has either a star in a gold circle or a star in an
    image of Michigan printed in the upper right-hand corner.
- id: 52
  category: license_system
  question: If you choose not to get a REAL ID-compliant card, what will be printed
    on your standard Michigan license?
  choices:
    A: Invalid for Driving
    B: Not for Federal Identification
    C: State Use Only
    D: Temporary ID
  answer: B
  explanation: If you choose not to get a REAL ID-compliant card, your standard Michigan
    license or state ID card will have "Not for Federal Identification" printed on
    it.
- id: 53
  category: driver_testing
  question: If you move to Michigan from Germany, what tests are waived when converting
    your driver's license?
  choices:
    A: The vision test only
    B: The written knowledge test, TIP, and driving skills test
    C: The driving skills test only
    D: No tests are waived
  answer: B
  explanation: If you are from another U.S. state, Canada, Germany or the Republic
    of Korea (South Korea), you may convert your driver's license to a Michigan license
    without the written knowledge test, TIP or driving skills test.
- id: 54
  category: driver_testing
  question: What is the minimum age to apply for driver education Segment 1?
  choices:
    A: 14 years
    B: 14 years, 8 months
    C: 15 years
    D: 16 years
  answer: B
  explanation: To apply for driver education Segment 1, you must be at least 14 years,
    8 months and have your parent or guardian's permission.
- id: 55
  category: safe_driving_rules
  question: Under a GDL Level 1 Learner's License, who must be seated in the front
    seat next to the teen driver?
  choices:
    A: Any licensed driver age 18 or older
    B: A licensed parent, guardian, or designated licensed adult age 21 or older
    C: A sibling with a Level 2 license
    D: A certified driving instructor only
  answer: B
  explanation: Once the Level 1 Learner's License is issued, you may only drive with
    a licensed parent, guardian or designated, licensed adult age 21 or older seated
    in the front seat next to you.
- id: 56
  category: safe_driving_rules
  question: What does Kelsey's Law prohibit for drivers holding a Level 1 Learner's
    License?
  choices:
    A: Driving between midnight and 5 a.m.
    B: Having more than one passenger in the vehicle
    C: Using a cell phone while driving
    D: Driving on interstate highways
  answer: C
  explanation: Kelsey's Law prohibits you from using a cell phone while driving if
    you hold a Level 1 Learner's License.
- id: 57
  category: driver_testing
  question: How many hours of supervised driving time must be logged before applying
    for driver education Segment 2?
  choices:
    A: 20 hours
    B: 30 hours (including 2 hours at night)
    C: 40 hours
    D: 50 hours (including 10 hours at night)
  answer: B
  explanation: To apply for Segment 2, you must present a driving log of at least
    30 hours of supervised driving time (including a minimum of 2 hours at night).
- id: 58
  category: driver_testing
  question: What is the minimum age to apply for the driving skills test under the
    Graduated Driver Licensing program?
  choices:
    A: 14 years, 9 months
    B: 15 years
    C: 15 years, 6 months
    D: 16 years
  answer: B
  explanation: To apply for the driving skills test, you must be at least age 15 and
    have completed Segment 2, along with a minimum of 50 hours of supervised driving
    time.
- id: 59
  category: license_system
  question: How long must a teen hold a Level 1 Learner's License before they can
    apply for a GDL Level 2 Intermediate License?
  choices:
    A: At least 3 months
    B: At least 6 months
    C: At least 9 months
    D: At least 12 months
  answer: B
  explanation: To apply for a GDL Level 2 Intermediate License, you must be at least
    age 16 and have held your Level 1 Learner's License for at least 6 months.
- id: 60
  category: license_system
  question: What are the minimum age and holding period requirements to apply for
    a GDL Level 2 Intermediate License?
  choices:
    A: Age 15, held Level 1 for 3 months
    B: Age 16, held Level 1 for 6 months
    C: Age 16, held Level 1 for 12 months
    D: Age 17, held Level 1 for 6 months
  answer: B
  explanation: According to the manual, to apply for a GDL Level 2 Intermediate License,
    you must be at least age 16 and have held your Level 1 Learner's License for at
    least 6 months.
- id: 61
  category: license_system
  question: Under a GDL Level 2 Intermediate License, between what hours are you generally
    prohibited from driving unless an exception applies?
  choices:
    A: 9 p.m. and 6 a.m.
    B: 10 p.m. and 5 a.m.
    C: 11 p.m. and 5 a.m.
    D: Midnight and 6 a.m.
  answer: B
  explanation: Level 2 Intermediate License restrictions prohibit you from driving
    between 10 p.m. and 5 a.m. unless accompanied by a designated adult or driving
    for employment/authorized activities.
- id: 62
  category: license_system
  question: How many passengers under the age of 21 are you allowed to have in the
    vehicle while driving with a Level 2 Intermediate License, assuming no exceptions
    apply?
  choices:
    A: Zero
    B: No more than one
    C: No more than two
    D: No more than three
  answer: B
  explanation: The manual states that you may not have more than one passenger under
    the age of 21 in the vehicle with you at any time unless an exception applies
    (like immediate family or accompanied by an adult).
- id: 63
  category: safe_driving_rules
  question: What does Kelsey's Law prohibit?
  choices:
    A: Driving between 10 p.m. and 5 a.m.
    B: Having more than one passenger under 21
    C: Using a phone while driving, except for emergencies
    D: Driving without a licensed adult over age 21
  answer: C
  explanation: Under Kelsey's Law, you may not use a phone while driving, except for
    emergencies. Violators could face a civil infraction.
- id: 64
  category: license_system
  question: To be eligible for a GDL Level 3 Full License, how many consecutive months
    must you have driven without a moving violation, at-fault crash, or GDL restriction
    violation?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: D
  explanation: To be eligible for a GDL Level 3 Full License, you must have driven
    12 consecutive months without a moving violation, an at-fault crash, a license
    suspension, or a violation of any GDL restrictions.
- id: 65
  category: driver_testing
  question: If you are 18 or older and have never been licensed, how long must you
    practice driving on a Temporary Instruction Permit (TIP) before taking a driving
    skills test?
  choices:
    A: At least 14 days
    B: At least 30 days
    C: At least 60 days
    D: At least 90 days
  answer: B
  explanation: The manual states that if you are age 18 or older and have never been
    licensed, you must practice driving with a licensed adult for at least 30 days
    before taking a driving skills test.
- id: 66
  category: license_system
  question: If you do not have a Social Security number, you must present a letter
    of ineligibility from the Social Security Administration. How old can this letter
    be?
  choices:
    A: No more than 30 days old
    B: No more than 60 days old
    C: No more than 90 days old
    D: No more than 1 year old
  answer: B
  explanation: A letter of ineligibility from the Social Security Administration must
    be presented if you do not have a Social Security number, and the letter can be
    no more than 60 days old.
- id: 67
  category: license_system
  question: Which of the following is true regarding the documents you provide for
    proof of identity when applying for a driver's license?
  choices:
    A: High-quality photocopies are acceptable
    B: Faxes are accepted if sent directly from a government agency
    C: Only original documents will be accepted
    D: Digital photos of documents on your smartphone are permitted
  answer: C
  explanation: 'When providing proof of identity, the manual explicitly states: "Only
    original documents will be accepted. Photocopies or faxes cannot be used."'
- id: 68
  category: license_system
  question: How many documents proving Michigan residency are required before your
    driver's license application can be processed?
  choices:
    A: At least one
    B: At least two
    C: At least three
    D: At least four
  answer: B
  explanation: Before your driver's license or state ID card application can be processed,
    you must present proof that you are a Michigan resident, and at least two documents
    are required.
- id: 69
  category: driver_testing
  question: What must you do if you fail the vision test at the Secretary of State
    office?
  choices:
    A: Retake the test immediately using a different machine
    B: Wait 30 days before reapplying for a license
    C: Have an eye-care specialist complete a vision statement
    D: Pay a fee to waive the vision requirement
  answer: C
  explanation: If you fail the vision test, your eye-care specialist must complete
    a vision statement documenting that you meet the vision standards.
- id: 70
  category: driver_testing
  question: If you need to take a knowledge test at a Secretary of State office, when
    should you arrive?
  choices:
    A: At least 30 minutes before closing
    B: At least one hour before closing
    C: At least two hours before closing
    D: Right at closing time
  answer: B
  explanation: If you are required to take a knowledge test, you should arrive at
    the Secretary of State office at least one hour before closing to allow enough
    time to complete the test.
- id: 71
  category: license_system
  question: How long is a Temporary Instruction Permit (TIP) valid for?
  choices:
    A: 60 days
    B: 90 days
    C: 180 days
    D: 365 days
  answer: C
  explanation: According to the manual, a temporary instruction permit (TIP) is valid
    for 180 days.
- id: 72
  category: driver_testing
  question: What is the cost of taking the written knowledge test online at home?
  choices:
    A: It is free
    B: $6.50
    C: $10.00
    D: $15.50
  answer: B
  explanation: While the written knowledge test is free at Secretary of State offices,
    taking the online version at home on your own computer or laptop requires a $6.50
    convenience fee.
- id: 73
  category: safe_driving_rules
  question: Which of the following is an allowed exception for driving between 10
    p.m. and 5 a.m. with a Level 2 Intermediate License?
  choices:
    A: Driving to a friend's house for a social gathering
    B: Driving in the course of your employment
    C: Driving to a late-night movie
    D: Driving alone to practice for the road test
  answer: B
  explanation: Level 2 Intermediate License restrictions prohibit driving between
    10 p.m. and 5 a.m. unless accompanied by an adult 21 or older, or if operating
    the vehicle in the course of employment or an authorized activity.
- id: 74
  category: license_system
  question: If using an out-of-state driver's license as proof of identity, what is
    the maximum amount of time it can be expired and still be accepted?
  choices:
    A: It cannot be expired at all
    B: Less than one year
    C: Less than two years
    D: Less than four years
  answer: D
  explanation: Out-of-state and Canadian applicants may use their out-of-state or
    Canadian driver's license as proof of identity, provided the license has been
    expired for less than four years.
- id: 75
  category: driver_testing
  question: How many days of practice driving must you complete on a temporary instruction
    permit (TIP) before taking the driving skills test?
  choices:
    A: 14 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to the manual, you must complete a minimum of 30 days of
    practice driving on a TIP before taking the driving skills test.
- id: 76
  category: license_system
  question: For how long are drivers who are licensed for the first time placed on
    probation?
  choices:
    A: A minimum of one year
    B: A minimum of two years
    C: A minimum of three years
    D: A minimum of four years
  answer: C
  explanation: Drivers licensed for the first time are placed on probation for a minimum
    of three years to monitor their driving performance.
- id: 77
  category: safe_driving_rules
  question: Which of the following is a restriction placed on a rider with a motorcycle
    temporary instruction permit (TIP)?
  choices:
    A: You are not allowed to ride at night or carry passengers.
    B: You cannot ride on public roads.
    C: You must ride only in designated off-road areas.
    D: You are restricted to riding motorcycles under 250cc.
  answer: A
  explanation: A motorcycle TIP places certain restrictions for your safety, including
    that you are not allowed to ride at night or carry passengers.
- id: 78
  category: license_system
  question: When riding with a motorcycle temporary instruction permit (TIP), you
    must be under the constant visual supervision of a licensed motorcycle operator
    who is at least what age?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Whenever you ride with a motorcycle TIP, you must be under the constant
    visual supervision of a licensed motorcycle operator who is at least age 18.
- id: 79
  category: driver_testing
  question: 'You will need to take a driving skills test if your last driver''s license
    has been expired for more than:'
  choices:
    A: One year
    B: Two years
    C: Three years
    D: Four years
  answer: D
  explanation: You will need to take a driving skills test if your last driver's license
    has been expired for more than four years.
- id: 80
  category: driver_testing
  question: If you are younger than age 18, how many hours of supervised driving must
    you have completed before taking a driving skills test?
  choices:
    A: 30 hours, including 5 at night
    B: 40 hours, including 10 at night
    C: 50 hours, including 10 at night
    D: 60 hours, including 15 at night
  answer: C
  explanation: If you are younger than age 18, you must have a log showing you have
    completed at least 50 hours of supervised driving, including 10 hours at night.
- id: 81
  category: driver_testing
  question: 'To be eligible for a driving skills test, an applicant under age 18 must
    not have had any convictions, civil infractions, license suspensions, or at-fault
    crashes during the preceding:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Applicants under 18 must not have had any convictions, civil infractions,
    license suspensions or at-fault crashes during the 90 days immediately preceding
    the driving skills test.
- id: 82
  category: driver_testing
  question: Who sets the fees and pricing policies for driving skills tests in Michigan?
  choices:
    A: The Secretary of State
    B: The independent driver testing businesses
    C: The Department of Transportation
    D: The local county clerk's office
  answer: B
  explanation: Driving skills tests are administered by independent driver testing
    businesses, and the Secretary of State does not set driving skills test fees or
    pricing policies.
- id: 83
  category: driver_testing
  question: During which of the following tests is an interpreter NOT allowed?
  choices:
    A: The written knowledge test for a standard driver's license
    B: The driving skills test for a standard driver's license
    C: The driving skills test for a commercial driver's license (CDL)
    D: The vision test for a standard driver's license
  answer: C
  explanation: Interpreters are not allowed during either the written knowledge tests
    or the driving skills test for a commercial driver's license (CDL).
- id: 84
  category: driver_testing
  question: What does the first part of the driving skills test require you to pass?
  choices:
    A: An on-road driving test in a residential area
    B: A series of off-street, closed-course maneuvers
    C: A written knowledge exam
    D: A highway merging simulation
  answer: B
  explanation: The first part of the driving skills test requires you to pass a series
    of off-street, closed-course maneuvers followed by an on-road driving skills test.
- id: 85
  category: alcohol_drugs_health
  question: 'A physician''s statement is required if the Secretary of State has reason
    to believe you have had a fainting spell, blackout, or seizure in the preceding:'
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A physician's statement is required if the Secretary of State has reason
    to believe you have had a fainting spell, blackout, seizure or other loss of consciousness
    in the preceding six months.
- id: 86
  category: alcohol_drugs_health
  question: 'To obtain a chauffeur''s license or a commercial driver''s license, you
    must not have had any blackouts, fainting spells, or seizures within the last:'
  choices:
    A: 6 months
    B: 12 months
    C: 2 years
    D: 3 years
  answer: B
  explanation: For a chauffeur's license or a commercial driver's license, you must
    not have had any blackouts, fainting spells or seizures within the last 12 months.
- id: 87
  category: license_system
  question: If you need to change your name on your driver's license, what must you
    do first?
  choices:
    A: Visit a Secretary of State office with your marriage certificate
    B: Change your name with the Social Security Administration
    C: Submit a change of address form online
    D: Pay the name change fee on the Michigan.gov website
  answer: B
  explanation: If you need to change your name on your driver's license, you must
    first change your name with the Social Security Administration and allow at least
    three business days before visiting a Secretary of State office.
- id: 88
  category: license_system
  question: How much does it cost to submit a change of address for your driver's
    license?
  choices:
    A: $5
    B: $10
    C: $15
    D: There is no charge
  answer: D
  explanation: You may submit a change of address online, at a Secretary of State
    office, or by mail. There is no charge for this service.
- id: 89
  category: license_system
  question: How often must you renew your driver's license in person at a Secretary
    of State office?
  choices:
    A: Every 4 years
    B: Every 8 years
    C: Every 10 years
    D: Every 12 years
  answer: D
  explanation: According to the manual, you must renew your driver's license every
    12 years at a Secretary of State office, where a vision screening will be given
    and a new photograph taken.
- id: 90
  category: license_system
  question: When does a driver's license expire if the driver is under age 21?
  choices:
    A: On their 18th birthday
    B: On their 21st birthday
    C: Exactly four years from the date of issue
    D: Every year on their birthday
  answer: B
  explanation: 'The manual states: ''If you are under age 21, your driver''s license
    expires on your 21st birthday.'''
- id: 91
  category: penalties_and_points
  question: How long do points placed on your driving record remain there?
  choices:
    A: Two years from the date of conviction
    B: Four years from the date of the violation
    C: Seven years from the date of conviction
    D: Permanently
  answer: A
  explanation: Points placed on your driving record remain there for two years from
    the date of conviction.
- id: 92
  category: penalties_and_points
  question: How many points will be added to your driving record for a drag racing
    conviction?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Under Michigan's point system, drag racing is a Four-Point violation.
- id: 93
  category: penalties_and_points
  question: Which of the following convictions remains on your driving record permanently?
  choices:
    A: Careless driving
    B: Drag racing
    C: Impaired driving
    D: Driving 16 mph or more over the legal speed limit
  answer: C
  explanation: The manual specifies that a conviction for a fatality or for impaired
    driving remains on your driving record permanently.
- id: 94
  category: driver_responsibility
  question: What is a possible consequence if you fail to change your address with
    the Secretary of State?
  choices:
    A: You will be charged a late fee.
    B: Your driver's license may be suspended or revoked.
    C: You will receive 2 points on your driving record.
    D: You will have to retake the driving skills test.
  answer: B
  explanation: Your driver's license may be suspended or revoked if you fail to change
    your address with the Secretary of State.
- id: 95
  category: penalties_and_points
  question: Under what circumstances will you be required to undergo a driver assessment
    reexamination?
  choices:
    A: If you receive 6 or more points in a four-year period
    B: If you have 12 or more points on your driving record within a two-year period
    C: If you receive any moving violation while your license is suspended
    D: If you are convicted of a 2-point violation
  answer: B
  explanation: If you have six or more one-point violations, or 12 or more points
    on your driving record within a two-year period, you will be required to undergo
    a driver assessment reexamination.
- id: 96
  category: penalties_and_points
  question: How many points are assessed for fleeing or eluding a police officer?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: Fleeing or eluding a police officer is listed under the Six Points
    category for traffic violations.
- id: 97
  category: penalties_and_points
  question: What happens in most cases if you do not take care of a traffic ticket?
  choices:
    A: Your driver's license will be suspended.
    B: You will be permanently banned from driving.
    C: The ticket will be dismissed after two years.
    D: Your insurance rates will automatically double.
  answer: A
  explanation: In most cases, if you do not take care of a traffic ticket, your driver's
    license will be suspended.
- id: 98
  category: license_system
  question: Who is eligible to receive a free state ID card?
  choices:
    A: Any driver who renews their license online
    B: Drivers 65 or older who voluntarily relinquish their driver's license
    C: Anyone who applies for a change of address
    D: Drivers who have zero points on their driving record
  answer: B
  explanation: Free ID cards are provided to those who are legally blind, drivers
    65 or older who voluntarily relinquish their driver's license, and drivers whose
    driving privilege is suspended, revoked or denied due to a physical or mental
    disability.
- id: 99
  category: penalties_and_points
  question: How many points are placed on your driving record for disobeying a traffic
    signal or stop sign?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Disobeying a traffic signal or stop sign, or improper passing, results
    in Three Points on your driving record.
- id: 100
  category: driver_responsibility
  question: How long do most convictions stay on your driving record?
  choices:
    A: At least two years
    B: At least four years
    C: At least seven years
    D: Permanently
  answer: C
  explanation: Most convictions stay on your driving record for at least seven years,
    though certain convictions stay for 10 years or permanently.
- id: 101
  category: penalties_and_points
  question: Which of the following violations results in 2 points on your driving
    record?
  choices:
    A: Open alcohol container in vehicle
    B: Careless driving
    C: Impaired driving
    D: Reckless driving
  answer: A
  explanation: Having an open alcohol container in a vehicle is a Two-Point violation.
- id: 102
  category: license_system
  question: What is required when you renew your driver's license in person every
    12 years?
  choices:
    A: A written knowledge test and a driving skills test
    B: A vision screening and a new photograph
    C: A medical examination and a background check
    D: A driver assessment reexamination
  answer: B
  explanation: When renewing your driver's license every 12 years at a Secretary of
    State office, a vision screening will be given and a new photograph will be taken.
- id: 103
  category: driver_responsibility
  question: Under Michigan's Driver Privacy Protection Act, which of the following
    is a permissible use for releasing your personal driving record information?
  choices:
    A: Marketing campaigns by local businesses
    B: Public background checks by private citizens
    C: Automobile recalls
    D: Employment screening for non-driving jobs
  answer: C
  explanation: Personal information is private unless there is a permissible use prescribed
    by law. Examples of permissible uses include insurance rating, automobile recalls,
    and driver verification for car rental companies.
- id: 104
  category: penalties_and_points
  question: How many points are added to your driving record for having an open alcohol
    container in the vehicle?
  choices:
    A: Two points
    B: Three points
    C: Four points
    D: Six points
  answer: A
  explanation: According to the manual, having an open alcohol container in the vehicle
    results in two points on your driving record.
- id: 105
  category: alcohol_drugs_health
  question: Which of the following standard servings contains the most alcohol?
  choices:
    A: A 12-ounce can of beer
    B: A 5-ounce glass of wine
    C: A 1.5-ounce shot of whiskey
    D: They all contain the same amount of alcohol
  answer: D
  explanation: The effects of alcohol are the same whether you drink beer, wine, or
    whiskey. A 12-ounce can of beer, a 5-ounce glass of wine, and a 1.5-ounce shot
    of whiskey all contain the same amount of alcohol.
- id: 106
  category: alcohol_drugs_health
  question: What is the only effective way to sober up after consuming alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Allowing time to pass
    D: Getting fresh air and exercise
  answer: C
  explanation: Many people mistakenly believe that coffee, a cold shower, exercise,
    or fresh air can sober them up. The only thing that sobers you up is time.
- id: 107
  category: penalties_and_points
  question: If you have no prior drug violations, how long will your driver's license
    be suspended for a drug conviction?
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: If there are no prior drug violations, your driver's license is suspended
    for six months for a drug conviction.
- id: 108
  category: penalties_and_points
  question: What is the driver's license reinstatement fee following a suspension
    for a drug conviction?
  choices:
    A: $50
    B: $125
    C: $250
    D: $500
  answer: B
  explanation: The driver's license reinstatement fee for a drug conviction suspension
    is $125.
- id: 109
  category: alcohol_drugs_health
  question: Under Michigan law, how much marijuana is legal for a person age 21 or
    older to transport?
  choices:
    A: 1 ounce or less
    B: 2.5 ounces or less
    C: 5 ounces or less
    D: 15 ounces or less
  answer: B
  explanation: It is legal to transport 2.5 ounces or less of marijuana if you are
    age 21 or older.
- id: 110
  category: alcohol_drugs_health
  question: Which of the following actions regarding marijuana is illegal in Michigan?
  choices:
    A: Transporting 2.5 ounces if you are 21 or older
    B: Having 10 grams of marijuana concentrate
    C: Transporting marijuana into Canada
    D: Using marijuana for legitimate medicinal applications
  answer: C
  explanation: According to the manual, it is illegal to transport marijuana into
    Canada.
- id: 111
  category: penalties_and_points
  question: What is the maximum fine for operating a vehicle under the influence of
    marijuana?
  choices:
    A: $125
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: The penalties for operating under the influence of marijuana are the
    same as alcohol and can include up to a $500 fine.
- id: 112
  category: penalties_and_points
  question: What happens if you refuse to submit to a chemical test requested by a
    police officer?
  choices:
    A: You will be issued a warning
    B: Your driver's license will be suspended
    C: You will receive 2 points on your record
    D: You must pay a $125 fine immediately
  answer: B
  explanation: Refusing to submit to a chemical test will result in a license suspension
    pursuant to Michigan's implied consent law.
- id: 113
  category: driver_testing
  question: The Secretary of State may require a driver reexamination if you have
    accumulated how many points within a two-year period?
  choices:
    A: 6 or more points
    B: 8 or more points
    C: 10 or more points
    D: 12 or more points
  answer: D
  explanation: Michigan law allows for a driver reexamination if you have accumulated
    12 or more points within a two-year period.
- id: 114
  category: driver_testing
  question: Which of the following criteria allows Michigan law to require a driver
    reexamination?
  choices:
    A: Being involved in one traffic crash resulting in property damage over the past
      two years
    B: Being involved in three or more traffic crashes resulting in personal injury
      or property damage over the past two years
    C: Receiving a single parking ticket
    D: Transporting 2.5 ounces of marijuana legally
  answer: B
  explanation: A driver reexamination may be required if you have been in three or
    more traffic crashes resulting in personal injury or property damage over the
    past two years.
- id: 115
  category: license_system
  question: To register to vote in Michigan, you must be a resident of the city or
    township where you are applying for at least how many days before you vote?
  choices:
    A: 14 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: To register to vote, you must be a resident of the city or township
    where you are applying to register to vote for at least 30 days (when you vote).
- id: 116
  category: license_system
  question: If an election is being held within the next 14 days, where must you go
    to register to vote for that election?
  choices:
    A: Any Secretary of State office
    B: Online at Michigan.gov/Vote
    C: Your city or township clerk's office
    D: A designated voter-registration agency
  answer: C
  explanation: If an election is being held within the next 14 days and you wish to
    vote in that election, you must register to vote at your city or township clerk's
    office up to and on Election Day.
- id: 117
  category: penalties_and_points
  question: If you have one or more prior drug convictions in seven years, your driver's
    license will be suspended for one year. When can a restricted license be issued
    during this suspension?
  choices:
    A: After the first 14 days
    B: After the first 30 days
    C: After the first 60 days
    D: After 6 months
  answer: C
  explanation: For one or more prior drug convictions in seven years, your driver's
    license will be suspended for one year, and a restricted license will not be issued
    during the first 60 days of the suspension.
- id: 118
  category: driver_responsibility
  question: What must you do regarding your voter registration if you move to a different
    city or township in Michigan?
  choices:
    A: Update your address online without re-registering.
    B: Register to vote in your new jurisdiction to remain eligible.
    C: Inform your previous clerk by phone.
    D: Wait until the next election to update your address.
  answer: B
  explanation: According to the manual, if you move to another city or township, you
    must register to vote in that jurisdiction to remain eligible to vote.
- id: 119
  category: license_system
  question: Under what circumstance can you hold both a Michigan driver's license
    and a state ID card at the same time?
  choices:
    A: If you are over the age of 65.
    B: If you travel frequently for work.
    C: If your driver's license has been restricted, suspended, or revoked.
    D: You can never hold both under any circumstances.
  answer: C
  explanation: The manual states that you may not have both a state ID card and a
    Michigan driver’s license unless your license has been restricted, suspended or
    revoked.
- id: 120
  category: license_system
  question: How long is a standard Michigan state ID card valid before it expires?
  choices:
    A: Two years from the date of issue.
    B: Four years from your last birthday.
    C: Five years from the date of issue.
    D: Ten years from your last birthday.
  answer: B
  explanation: Your state ID card expires four years from your last birthday, unless
    you are presenting temporary legal presence documents.
- id: 121
  category: license_system
  question: How can you identify a REAL ID-compliant Michigan state ID card?
  choices:
    A: It has a hologram of the state seal.
    B: It has a star in a gold circle in the upper right-hand corner.
    C: It is printed on blue plastic.
    D: It says "Federal Identification" across the top.
  answer: B
  explanation: Michigan issues state ID cards that are REAL ID compliant. These cards
    have a star in a gold circle printed in the upper right-hand corner.
- id: 122
  category: license_system
  question: When flying domestically with a companion, do minors (under age 18) need
    a REAL ID-compliant document?
  choices:
    A: Yes, all passengers must have a REAL ID.
    B: Yes, unless they have a valid student ID.
    C: No, minors do not need a REAL ID when flying with a companion in the U.S.
    D: No, but they must present a birth certificate.
  answer: C
  explanation: Applying for a REAL ID-compliant state ID card is optional. Minors
    (children under age 18) do not need a REAL ID-compliant document when flying with
    a companion in the United States.
- id: 123
  category: penalties_and_points
  question: What is the penalty for a first offense of using a hand-held phone while
    driving in Michigan?
  choices:
    A: A $50 fine.
    B: A $100 fine.
    C: A $250 fine.
    D: A $500 fine and license suspension.
  answer: B
  explanation: Using a hand-held phone while driving is illegal in Michigan. Drivers
    face a fine of $100 for a first offense and $250 for subsequent violations.
- id: 124
  category: defensive_driving
  question: How far does a car traveling at 65 mph move in the quarter of a second
    it takes the brain to shift attention?
  choices:
    A: 10 feet.
    B: 24 feet.
    C: 45 feet.
    D: 65 feet.
  answer: B
  explanation: In the estimated quarter of a second it takes the brain to shift attention
    between two tasks, a car moving at 65 mph covers 24 feet.
- id: 125
  category: safe_driving_rules
  question: Under what circumstance is a driver legally allowed to use a mobile device
    while driving?
  choices:
    A: To check GPS directions manually.
    B: To answer a call from a family member.
    C: To report a traffic crash or medical emergency to 9-1-1.
    D: To read a text message while stopped at a red light.
  answer: C
  explanation: Emergency exceptions allow drivers to use a mobile device to text 9-1-1
    or call emergency services to report a medical emergency, traffic crash, serious
    road hazard, fire, or hazardous materials situation.
- id: 126
  category: safe_driving_rules
  question: What does Kelsey's Law prohibit for teens with a Level 1 or Level 2 Graduated
    Driver License (GDL)?
  choices:
    A: Driving between midnight and 5 a.m.
    B: Making or receiving non-emergency phone calls while driving.
    C: Having more than one passenger under the age of 21.
    D: Using a hands-free GPS system.
  answer: B
  explanation: Kelsey’s Law (MCL 257.602c) prohibits teens with a GDL 1 or GDL 2 from
    making or receiving non-emergency phone calls.
- id: 127
  category: safe_driving_rules
  question: How may drivers (other than GDL 1 and 2 teens) legally interact with a
    hands-free mobile device while driving?
  choices:
    A: By typing short text messages only.
    B: By pressing, tapping, or swiping a single button to activate a function.
    C: By holding the phone near their face to use the speakerphone.
    D: By scrolling through a playlist with one hand.
  answer: B
  explanation: Drivers are allowed to use a device in a voice-operated or hands-free
    mode as long as they do not continue to use their hands after pressing, tapping,
    or swiping a single button to activate or deactivate a function.
- id: 128
  category: defensive_driving
  question: Which of the following is a recommended way to minimize in-vehicle distractions?
  choices:
    A: Complete personal grooming while stopped at traffic lights.
    B: Complete personal grooming before you start driving or after you reach your
      destination.
    C: Keep your phone in your lap for easy access.
    D: Only eat complex meals while driving on the highway.
  answer: B
  explanation: To minimize distractions before driving, the manual recommends that
    you complete any personal grooming before you start driving or after you reach
    your destination.
- id: 129
  category: alcohol_drugs_health
  question: Which police department administered the first chemical test to identify
    suspected drunken drivers in 1945?
  choices:
    A: Saginaw Police Department
    B: Lansing Police Department
    C: Grand Rapids Police Department
    D: Detroit Police Department
  answer: D
  explanation: In 1945, the first chemical test to identify suspected drunken drivers
    was administered by the Detroit Police Department.
- id: 130
  category: safe_driving_rules
  question: Who is required by Michigan law to be buckled up in all seating positions?
  choices:
    A: Only front seat passengers
    B: All passengers younger than age 16
    C: Only passengers younger than age 8
    D: All passengers regardless of age
  answer: B
  explanation: According to Michigan law, all passengers younger than age 16 must
    be buckled up in all seating positions.
- id: 131
  category: safe_driving_rules
  question: How should a seat belt be worn correctly to provide the safest protection?
  choices:
    A: Shoulder belt across the neck, lap belt over the stomach
    B: Shoulder belt behind the back, lap belt low across the hips
    C: Shoulder belt across the middle of the chest, lap belt low across the hips
      below the stomach
    D: Shoulder belt under the arm, lap belt over the stomach
  answer: C
  explanation: Everyone in the vehicle will be safer when seat belts are worn correctly
    – shoulder belt across the middle of the chest away from the neck, with the lap
    belt worn low across the hips below the stomach.
- id: 132
  category: safe_driving_rules
  question: Under Michigan's child passenger safety law, children must be properly
    buckled in a car seat or booster seat until they reach what age or height?
  choices:
    A: 6 years old or 4 feet 6 inches tall
    B: 8 years old or 4 feet 9 inches tall
    C: 10 years old or 5 feet tall
    D: 12 years old or 4 feet 9 inches tall
  answer: B
  explanation: Children are to be properly buckled up in a car seat or booster seat
    until they are 8 years old or 4 feet 9 inches tall.
- id: 133
  category: safe_driving_rules
  question: When is a child in a rear-facing child-restraint system allowed to be
    placed in the front passenger seat?
  choices:
    A: Only if the child is older than 2 years
    B: Only if the front passenger air bag is deactivated
    C: Only if the vehicle is traveling under 35 mph
    D: Rear-facing child seats are never allowed in the front seat
  answer: B
  explanation: A child in a rear-facing child-restraint system may only be placed
    in the front seat if the front passenger air bag is deactivated.
- id: 134
  category: safe_driving_rules
  question: What is the law regarding riding in the open bed of a pickup truck in
    Michigan?
  choices:
    A: Anyone under 18 is prohibited from riding in the open bed traveling more than
      15 mph.
    B: Anyone under 21 is prohibited from riding in the open bed at any speed.
    C: Passengers of any age may ride in the open bed if they are seated flat.
    D: It is strictly prohibited for anyone to ride in the open bed of a pickup truck.
  answer: A
  explanation: Anyone under 18 years old is prohibited from riding in the open bed
    of a pickup truck traveling more than 15 mph, with certain exceptions for farmers,
    construction workers, military, etc.
- id: 135
  category: driver_responsibility
  question: 'Under Michigan law, it is illegal to leave a child unattended in a vehicle
    if it poses an unreasonable risk of harm. This applies to children younger than:'
  choices:
    A: 4 years old
    B: 6 years old
    C: 8 years old
    D: 10 years old
  answer: B
  explanation: Under Michigan law, it is illegal to leave children younger than 6
    years old unattended in a vehicle if the amount of time or circumstances in which
    they are left poses an unreasonable risk of harm or injury.
- id: 136
  category: driver_responsibility
  question: 'A child younger than 6 may be left in a vehicle without violating the
    law if they are under the supervision of someone who is not legally incapacitated
    and is at least:'
  choices:
    A: 10 years old
    B: 12 years old
    C: 13 years old
    D: 16 years old
  answer: C
  explanation: Parents or guardians who leave their children in a vehicle under the
    supervision of someone age 13 or older who is not legally incapacitated are not
    in violation of the law.
- id: 137
  category: vehicle_information
  question: How much space is recommended between the center of the driver's breastbone
    and the center of the steering wheel to avoid air bag injuries?
  choices:
    A: At least 6 inches
    B: At least 10 inches
    C: At least 12 inches
    D: At least 15 inches
  answer: B
  explanation: It is recommended that drivers sit with at least 10 inches of space
    between the center of their breastbone and the center of the steering wheel.
- id: 138
  category: vehicle_information
  question: 'To avoid potential injury from an air bag in the event of a crash, parents
    are encouraged to seat all children in the rear seat if they are:'
  choices:
    A: Ages 8 and younger
    B: Ages 10 and younger
    C: Ages 12 and younger
    D: Ages 15 and younger
  answer: C
  explanation: Parents or guardians are encouraged to seat all children ages 12 and
    younger in the rear seat of the vehicle to avoid potential injury from an air
    bag in the event of a crash.
- id: 139
  category: safe_driving_rules
  question: What is the standard speed limit in mobile home parks and some municipal
    parks in Michigan?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The standard speed limit is 15 mph in mobile home parks and some municipal
    parks.
- id: 140
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in platted subdivisions
    and condominium complexes?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The standard speed limit is 25 mph in platted subdivisions and condominium
    complexes.
- id: 141
  category: safe_driving_rules
  question: What is the maximum speed limit for school buses and trucks on freeways
    with a posted limit of 70 mph?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: C
  explanation: On all freeways unless posted otherwise, the maximum speed is 70 mph,
    but school buses and trucks are restricted to 65 mph.
- id: 142
  category: penalties_and_points
  question: How many points will be assessed on your driving record for speeding more
    than 15 mph over the limit in a work zone?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: D
  explanation: Under the law, you will be assessed five points for speeding more than
    15 mph over the limit in a work zone.
- id: 143
  category: penalties_and_points
  question: What is the maximum penalty for causing injury or death to any person
    in a work zone?
  choices:
    A: A fine of up to $1,000 and 1 year imprisonment
    B: A fine of up to $5,000 and 5 years imprisonment
    C: A fine of up to $7,500 and up to 15 years imprisonment
    D: A fine of up to $10,000 and up to 20 years imprisonment
  answer: C
  explanation: If you cause the injury or death to any person in a work zone, you
    may face fines of up to $7,500, and imprisonment of up to 15 years.
- id: 144
  category: signs_and_signals
  question: What do warning signs in construction, maintenance, or other designated
    work areas look like?
  choices:
    A: Rectangular with black lettering on a white background
    B: Diamond-shaped with black lettering on an orange or yellow background
    C: Circular with white lettering on a red background
    D: Pennant-shaped with black lettering on a yellow background
  answer: B
  explanation: Warning signs in construction, maintenance or other designated work
    areas are diamond-shaped with black lettering on an orange or yellow background.
- id: 145
  category: vehicle_information
  question: Which color lights are state and local road agencies in Michigan allowed
    to use on maintenance vehicles in addition to traditional amber lights?
  choices:
    A: Flashing red lights
    B: Flashing blue lights
    C: Flashing white lights
    D: Flashing green lights
  answer: D
  explanation: Michigan law allows state and local road agencies to equip their maintenance
    vehicles with flashing or oscillating green lights in addition to the traditional
    amber lights.
- id: 146
  category: vehicle_information
  question: Are private contractors allowed to display green lights on their maintenance
    vehicles?
  choices:
    A: Yes, but only during snowstorms.
    B: Yes, if they are working on a state highway.
    C: No, private contractors are not allowed to display green lights.
    D: No, unless they have a special permit from the police.
  answer: C
  explanation: According to the manual, private contractors are not allowed to display
    green lights on their vehicles.
- id: 147
  category: safe_driving_rules
  question: What must you do when approaching a stopped emergency vehicle with its
    lights flashing?
  choices:
    A: Maintain your speed and stay in your lane.
    B: Slow down to 15 mph and honk your horn.
    C: Slow down at least 10 mph below the posted speed limit and move over a lane
      if possible.
    D: Stop immediately and wait for the emergency vehicle to leave.
  answer: C
  explanation: The law requires you to slow down at least 10 mph below the posted
    speed limit and move over a lane if traffic and conditions allow.
- id: 148
  category: safe_driving_rules
  question: How far behind a moving emergency vehicle displaying flashing warning
    lights and sounding a siren must you stay?
  choices:
    A: At least 100 feet
    B: At least 200 feet
    C: At least 300 feet
    D: At least 500 feet
  answer: D
  explanation: You must stay at least 500 feet behind any moving emergency vehicle
    displaying flashing warning lights and sounding a siren.
- id: 149
  category: defensive_driving
  question: What should you do with your brakes after pulling over and stopping for
    an approaching emergency vehicle?
  choices:
    A: Shift into park and take your foot off the brake.
    B: Keep a foot on the brake so the brake lights let the emergency driver know
      you have stopped.
    C: Pump the brakes to flash your lights.
    D: Apply the emergency parking brake only.
  answer: B
  explanation: Keep a foot on the brake so the brake lights let emergency vehicle
    drivers know you have stopped.
- id: 150
  category: sharing_the_road
  question: How far away must you stop from a school bus with its red overhead lights
    flashing?
  choices:
    A: At least 10 feet
    B: At least 15 feet
    C: At least 20 feet
    D: At least 50 feet
  answer: C
  explanation: Stop at least 20 feet from a school bus with its red overhead lights
    flashing; it is picking up or dropping off passengers.
- id: 151
  category: sharing_the_road
  question: When are you NOT required to stop for a school bus with its red overhead
    lights flashing?
  choices:
    A: When you are traveling in the opposite direction on a standard two-lane road.
    B: When the bus is stopped on the other side of a highway divided by a barrier
      or median.
    C: When you are running late for work and the bus is empty.
    D: When the bus is stopped at a four-way intersection.
  answer: B
  explanation: It is not necessary to stop for a school bus stopped on the other side
    of a highway divided by a barrier such as a concrete or grass median, island or
    other structures that separate the flow of traffic.
- id: 152
  category: signs_and_signals
  question: What does it mean when a school bus has its YELLOW overhead lights flashing?
  choices:
    A: Proceed with caution
    B: Be prepared to stop
    C: Stop immediately
    D: The bus is accelerating
  answer: B
  explanation: When the YELLOW overhead lights are flashing, be prepared to stop.
- id: 153
  category: safe_driving_rules
  question: If two vehicles reach a four-way stop intersection at the same time, who
    has the right of way?
  choices:
    A: The vehicle on the left should yield to the vehicle on its right.
    B: The vehicle on the right should yield to the vehicle on its left.
    C: The vehicle traveling faster has the right of way.
    D: The vehicle turning left has the right of way.
  answer: A
  explanation: If two or more vehicles reached the intersection at the same time,
    the vehicle on the left should yield to the vehicle on its right.
- id: 154
  category: safe_driving_rules
  question: How should you treat an intersection with a malfunctioning traffic signal?
  choices:
    A: Proceed without stopping if the road looks clear.
    B: Come to a complete stop and yield to vehicles already at the intersection.
    C: Treat it as a yield sign and slow down to 15 mph.
    D: Wait for law enforcement to arrive before crossing.
  answer: B
  explanation: You reach an intersection with a malfunctioning traffic signal. Come
    to a complete stop and yield to vehicles already at the intersection.
- id: 155
  category: safe_driving_rules
  question: At a T-intersection without any signals or signs, who has the right of
    way?
  choices:
    A: Vehicles on the road ending at the intersection.
    B: Vehicles turning left.
    C: Vehicles on the through road.
    D: Whichever vehicle arrives first.
  answer: C
  explanation: At a T-intersection without any signals or signs, yield the right of
    way to vehicles on the through road.
- id: 156
  category: penalties_and_points
  question: What is the penalty for failing to obey the law regarding stopped authorized
    emergency vehicles, assuming no one is injured or killed?
  choices:
    A: A warning
    B: A civil infraction
    C: A misdemeanor
    D: A felony
  answer: B
  explanation: 'Failure to obey the law carries the following penalties: Involving
    authorized emergency vehicles: A civil infraction, unless you injure or kill emergency
    personnel, then the charge is a felony.'
- id: 157
  category: safe_driving_rules
  question: When making a left turn at an intersection on a green light, what must
    you do if you are still in the intersection when the light turns red?
  choices:
    A: Back up to the crosswalk.
    B: Stop immediately in the intersection and wait for the next green light.
    C: Complete your turn as quickly and safely as possible.
    D: Honk your horn and force your way through traffic.
  answer: C
  explanation: If you are still in the intersection when the light turns red, complete
    your turn as quickly and safely as possible.
- id: 158
  category: safe_driving_rules
  question: What should you do when an emergency vehicle is approaching with its red
    or blue lights flashing and siren sounding?
  choices:
    A: Speed up to get out of its way.
    B: Stop immediately in the middle of the intersection.
    C: Drive to the right edge of the roadway, clear of an intersection, and stop.
    D: Move to the left lane and slow down.
  answer: C
  explanation: The manual states that when an emergency vehicle is approaching with
    flashing lights and a siren, you must immediately drive to a position parallel
    to and as close as possible to the right-hand edge or curb, clear of an intersection,
    and stop.
- id: 159
  category: sharing_the_road
  question: Which of the following vehicles has the right of way over a funeral procession?
  choices:
    A: A public transit bus.
    B: A fire truck with its lights and siren on.
    C: A postal delivery truck.
    D: A school bus loading passengers.
  answer: B
  explanation: According to the manual, funeral processions have the right of way
    over all other vehicles, except for fire trucks, ambulances, and police vehicles.
- id: 160
  category: safe_driving_rules
  question: When passing another vehicle on the left, you must return to your lane
    before you get within how many feet of any oncoming vehicles?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: The manual specifies that you must return to your lane before you get
    within 200 feet of any oncoming vehicles when passing.
- id: 161
  category: safe_driving_rules
  question: When is it safe to return to the right-hand lane after passing another
    vehicle on the left?
  choices:
    A: As soon as your front bumper is ahead of the other vehicle.
    B: When you can see the entire vehicle you are passing in your rearview mirror.
    C: When the driver you are passing flashes their headlights.
    D: Three seconds after you have passed the vehicle.
  answer: B
  explanation: The manual advises that once you have started passing a vehicle, you
    should not cut back into the right-hand lane until you can see the entire vehicle
    you are passing in your rearview mirror.
- id: 162
  category: safe_driving_rules
  question: Passing another vehicle on the left is prohibited when you are within
    how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: The manual states that you must not pass when you are within 100 feet
    of an intersection or railroad crossing.
- id: 163
  category: safe_driving_rules
  question: Under which of the following circumstances is it legally permissible to
    pass a vehicle on the right?
  choices:
    A: When the vehicle ahead is driving below the speed limit on a single-lane road.
    B: By driving on the paved right shoulder if the vehicle ahead is turning left.
    C: When there is enough room on a two-lane road and the vehicle ahead is turning
      left.
    D: Whenever you are in a hurry and the right shoulder is clear.
  answer: C
  explanation: Passing on the right is allowed when there is enough room on a two-lane
    road and the vehicle you want to pass is turning left. However, you must not drive
    on the shoulder or off the road to do so.
- id: 164
  category: safe_driving_rules
  question: When driving on an interstate highway, you must generally drive in the
    right-hand lane. Which of the following is an exception to this rule?
  choices:
    A: When you want to drive faster than the posted speed limit.
    B: When weather conditions make it necessary to drive in the left lane.
    C: When you are driving a commercial vehicle.
    D: When you are within 5 miles of your exit.
  answer: B
  explanation: Exceptions for driving in the left lane on an interstate include when
    weather conditions make it necessary to drive in the left lane, among other specific
    situations like traffic congestion or yielding to emergency vehicles.
- id: 165
  category: defensive_driving
  question: What should you do with your vehicle's front wheels while waiting to make
    a left turn at an intersection?
  choices:
    A: Turn them slightly to the left to prepare for the turn.
    B: Turn them slightly to the right to prevent rolling into traffic.
    C: Keep them pointed straight ahead until you start your turn.
    D: Point them in the direction of the oncoming traffic lane.
  answer: C
  explanation: When preparing for a left turn, the manual instructs drivers to keep
    their front wheels pointed straight ahead until they start the turn.
- id: 166
  category: sharing_the_road
  question: If you have a green traffic light but a pedestrian is currently in the
    crosswalk ahead of you, what must you do?
  choices:
    A: Honk your horn to warn the pedestrian to move faster.
    B: Proceed through the intersection since you have the right of way.
    C: Steer around the pedestrian to keep traffic flowing.
    D: Yield to the pedestrian in the crosswalk.
  answer: D
  explanation: As a driver, you must yield to a pedestrian in the crosswalk, even
    if your traffic light is green.
- id: 167
  category: penalties_and_points
  question: What is the penalty for cutting through a funeral procession?
  choices:
    A: It is a felony.
    B: It is a civil infraction.
    C: It is a misdemeanor.
    D: It results in an automatic license suspension.
  answer: B
  explanation: The manual explicitly states that it is a civil infraction to cut through
    a funeral procession.
- id: 168
  category: defensive_driving
  question: What should you do if another vehicle is passing you on the left?
  choices:
    A: Increase your speed so they can merge behind you.
    B: Move into the left lane to block them.
    C: Do not increase your speed and allow them to complete the pass safely.
    D: Honk your horn to alert them of your presence.
  answer: C
  explanation: If you are being passed by another vehicle, the manual states you should
    not increase your speed or race the driver. You must allow the other driver to
    complete the passing maneuver safely.
- id: 169
  category: safe_driving_rules
  question: When making a turn at an intersection with multiple right-turn lanes,
    how should you complete your turn?
  choices:
    A: Enter the lane that has the least amount of traffic.
    B: Always enter the far-right lane, regardless of your starting lane.
    C: Enter the lane that corresponds to your turn lane.
    D: Merge into the center lane immediately after turning.
  answer: C
  explanation: When multiple right-turn lanes are present, you must complete your
    turn by entering the lane that corresponds to your turn lane to avoid cutting
    off traffic.
- id: 170
  category: safe_driving_rules
  question: Which of the following statements about driving across median strips and
    barriers is true?
  choices:
    A: It is legal only if you missed your freeway exit.
    B: It is illegal to drive across median strips and through barriers.
    C: It is legal if you are driving a four-wheel-drive vehicle.
    D: It is legal during severe traffic jams.
  answer: B
  explanation: The manual states clearly that it is illegal to drive across median
    strips and through barriers.
- id: 171
  category: sharing_the_road
  question: Is it legal to pass a vehicle that has stopped at a crosswalk to allow
    a pedestrian to cross?
  choices:
    A: Yes, if you pass on the right.
    B: Yes, if there is no oncoming traffic.
    C: No, it is prohibited to pass a vehicle stopped for a pedestrian.
    D: Yes, but only if you honk your horn first.
  answer: C
  explanation: Passing is prohibited when a vehicle has stopped at a crosswalk or
    intersection to allow a pedestrian to cross.
- id: 172
  category: safe_driving_rules
  question: How should you react when approaching a stopped waste collection or utility
    service vehicle with its lights flashing?
  choices:
    A: Maintain your speed and pass as quickly as possible.
    B: Stop immediately and wait for the vehicle to turn off its lights.
    C: Proceed with caution and be ready to yield.
    D: Honk your horn and pass on the right shoulder.
  answer: C
  explanation: You must proceed with caution and be ready to yield whenever you are
    approaching or passing a stopped waste collection, utility service, or road maintenance
    vehicle with its lights flashing.
- id: 173
  category: safe_driving_rules
  question: Who has the right of way in a roundabout?
  choices:
    A: Vehicles entering the roundabout
    B: Vehicles traveling in the roundabout
    C: Pedestrians waiting to cross outside the roundabout
    D: Vehicles exiting the roundabout
  answer: B
  explanation: According to the manual, 'Vehicles in the roundabout have the right
    of way.'
- id: 174
  category: safe_driving_rules
  question: What should you do if an emergency vehicle approaches while you are traveling
    in a roundabout?
  choices:
    A: Stop immediately inside the roundabout to let them pass
    B: Speed up to exit the roundabout as quickly as possible
    C: Leave the roundabout at the nearest exit, pull over to the right and stop
    D: Pull over to the center island and stop
  answer: C
  explanation: 'The manual states: ''If an emergency vehicle is heard or seen approaching,
    do not stop. Leave the roundabout at the nearest exit, pull over to the right
    and stop, allowing the emergency vehicle to pass.'''
- id: 175
  category: safe_driving_rules
  question: What is the proper procedure if you miss your exit while navigating a
    roundabout?
  choices:
    A: Stop and back up carefully to your exit
    B: Make a U-turn over the center island
    C: Take the next available exit and reroute using side streets
    D: Drive around the roundabout to your exit again
  answer: D
  explanation: 'The manual advises: ''If you miss your exit, drive around the roundabout
    to your exit again.'''
- id: 176
  category: safe_driving_rules
  question: When a train is coming, what is the required stopping distance from the
    railroad tracks?
  choices:
    A: No more than 50 feet or less than 15 feet
    B: No more than 100 feet or less than 25 feet
    C: Exactly 10 feet from the tracks
    D: Between 5 and 10 feet from the tracks
  answer: A
  explanation: 'The manual states: ''If a train is coming, all vehicles must stop
    no more than 50 feet or less than 15 feet from the tracks.'''
- id: 177
  category: sharing_the_road
  question: Which of the following vehicles must stop at a railroad crossing even
    if there is no stop sign or crossing signal?
  choices:
    A: Motorcycles and mopeds
    B: School buses and vehicles carrying hazardous materials
    C: Delivery trucks and commercial vans
    D: Passenger vehicles towing trailers
  answer: B
  explanation: The manual notes to be aware that 'school buses, vehicles carrying
    passengers for hire, gasoline trucks and other vehicles carrying hazardous materials
    must stop and make sure no train is coming, even if there is no stop sign or railroad
    crossing signal.'
- id: 178
  category: safe_driving_rules
  question: When approaching a railroad crossing where traffic has backed up, how
    much space must you have on the far side of the tracks before crossing?
  choices:
    A: At least 3 feet of clearance
    B: At least 6 feet of clearance
    C: At least 10 feet of clearance
    D: At least 15 feet of clearance
  answer: B
  explanation: 'The manual warns: ''never cross the tracks unless there is enough
    space for your vehicle to completely clear the far side of the tracks by at least
    6 feet.'''
- id: 179
  category: safe_driving_rules
  question: What should you do IMMEDIATELY if your vehicle is stuck on railroad tracks
    and the crossing gates activate?
  choices:
    A: Stay in the vehicle and call 911
    B: Try to restart the engine for at least 30 seconds
    C: Get everyone out of the vehicle and as far away from the tracks as possible,
      then call 911
    D: Call the ENS number on the blue sign before exiting the vehicle
  answer: C
  explanation: 'The manual instructs: ''If the crossing gates are activated, or a
    train is clearly approaching, IMMEDIATELY get everyone out of the vehicle and
    as far away from the tracks as possible. Call 911.'''
- id: 180
  category: signs_and_signals
  question: What information is provided on an Emergency Notification System (ENS)
    sign at a highway-rail grade crossing?
  choices:
    A: The speed limit for approaching trains
    B: A telephone number and the crossing's US DOT number
    C: The distance to the next railroad crossing
    D: The radio frequency to contact train engineers
  answer: B
  explanation: 'The manual states: ''An Emergency Notification System (ENS) sign...
    lists a telephone number along with the crossing’s US DOT number and is used to
    notify the railroad of an emergency...'''
- id: 181
  category: sharing_the_road
  question: Why should you use your right hand to open the driver's side door when
    exiting a parked vehicle?
  choices:
    A: It prevents the door from swinging open too fast in the wind
    B: It automatically makes you look over your left shoulder for oncoming cyclists
      and pedestrians
    C: It is required by law for all drivers in Michigan
    D: It keeps your left hand free to hold the steering wheel
  answer: B
  explanation: 'The manual advises: ''Use your right hand to open the door, so you
    will automatically look over your left shoulder for oncoming cyclists and pedestrians.'''
- id: 182
  category: safe_driving_rules
  question: Which way should you turn your vehicle's wheels when parking downhill?
  choices:
    A: Turn the wheels away from the curb
    B: Keep the wheels perfectly straight
    C: Turn the wheels toward the curb
    D: Turn the wheels to the left
  answer: C
  explanation: 'The manual explicitly states: ''Turn wheels toward the curb when parking
    downhill.'''
- id: 183
  category: safe_driving_rules
  question: When parallel parking, what is the maximum distance your vehicle should
    be from the curb?
  choices:
    A: No more than 6-12 inches
    B: No more than 12-18 inches
    C: Exactly 2 feet
    D: Between 2 and 5 feet
  answer: A
  explanation: 'The manual''s instructions for parallel parking state: ''Do not park
    more than 6-12 inches from the curb.'''
- id: 184
  category: safe_driving_rules
  question: When entering a roundabout, which direction must you yield to approaching
    traffic?
  choices:
    A: Yield to traffic approaching from the right
    B: Yield to traffic approaching from the left
    C: Yield only to commercial vehicles
    D: You do not need to yield; entering vehicles have the right of way
  answer: B
  explanation: 'The manual states: ''Vehicles entering from each leg of the intersection
    must yield to traffic approaching from the left.'''
- id: 185
  category: safe_driving_rules
  question: How far do trains typically overhang the railroad tracks?
  choices:
    A: At least one foot on each side
    B: At least three feet on each side
    C: Exactly five feet on each side
    D: Trains do not overhang the tracks
  answer: B
  explanation: 'The manual warns: ''Trains overhang the tracks by at least three feet
    on each side and may have cargo that extends even farther.'''
- id: 186
  category: safe_driving_rules
  question: How should you approach your vehicle when returning to it parked on a
    street?
  choices:
    A: Walk with your back to oncoming traffic
    B: Face oncoming traffic as you approach the driver's side
    C: Approach from the passenger side only
    D: Walk in the center of the road to be visible
  answer: B
  explanation: 'The manual advises: ''When returning to your vehicle, face oncoming
    traffic as you approach the driver’s side.'''
- id: 187
  category: safe_driving_rules
  question: What is a recommended safety tip regarding your vehicle's gears when crossing
    railroad tracks?
  choices:
    A: Shift to a higher gear to cross quickly
    B: Shift to a lower gear for more power
    C: Put the vehicle in neutral while crossing
    D: Avoid changing gears while crossing railroad tracks
  answer: D
  explanation: 'Under Grade crossing safety tips, the manual states: ''Avoid changing
    gears while crossing railroad tracks.'''
- id: 188
  category: safe_driving_rules
  question: It is illegal to park your vehicle within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: According to the parking violations section, you must never park within
    15 feet of a fire hydrant.
- id: 189
  category: signs_and_signals
  question: What shape is used exclusively for a school sign?
  choices:
    A: Diamond
    B: Pentagon
    C: Pennant
    D: Octagon
  answer: B
  explanation: The manual indicates that a pentagon shape is used to signify a school
    zone or school crossing.
- id: 190
  category: signs_and_signals
  question: Which traffic sign color is used to indicate an incident, emergency, or
    unplanned event?
  choices:
    A: Orange
    B: Fluorescent yellow-green
    C: Fluorescent pink
    D: Brown
  answer: C
  explanation: Fluorescent pink is the designated color used for incident, emergency,
    or unplanned event signs.
- id: 191
  category: safe_driving_rules
  question: Why is it extremely important not to park on the blue-striped area of
    a van-accessible disability parking space?
  choices:
    A: It is reserved for emergency vehicles only.
    B: It provides room for the van's wheelchair lift and ramp.
    C: It is a designated loading zone for delivery trucks.
    D: It is a crosswalk for pedestrians.
  answer: B
  explanation: The blue-striped area provides room for the van's wheelchair lift and
    ramp, allowing the person with a disability to easily exit and enter the vehicle.
- id: 192
  category: safe_driving_rules
  question: You are prohibited from parking within how many feet of the nearest rail
    of a railroad crossing?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: D
  explanation: The manual states you must never park within 50 feet of the nearest
    rail of a railroad crossing.
- id: 193
  category: signs_and_signals
  question: What type of vehicle displays an orange triangle mounted on the back?
  choices:
    A: A vehicle carrying hazardous materials.
    B: A vehicle that does not move faster than 25 mph.
    C: An authorized emergency vehicle.
    D: A commercial delivery truck.
  answer: B
  explanation: The orange triangle is a Slow-Moving Vehicle sign mounted on the back
    of vehicles that do not move faster than 25 mph, such as farm combines and Amish
    buggies.
- id: 194
  category: signs_and_signals
  question: 'A pennant-shaped traffic sign is used to indicate:'
  choices:
    A: A railroad crossing.
    B: A school zone.
    C: A warning or no passing zone.
    D: Directions and guidance.
  answer: C
  explanation: The manual's traffic sign shapes chart indicates that a pennant-shaped
    sign means WARNING/NO PASSING.
- id: 195
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a stop sign, traffic light,
    or flashing beacon?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: The manual states you must never park within 30 feet of a stop sign,
    traffic light or flashing beacon, including a warning sign.
- id: 196
  category: driver_responsibility
  question: If a leased vehicle is parked illegally, who is responsible for the parking
    ticket?
  choices:
    A: The dealership that sold the vehicle.
    B: The person leasing the vehicle.
    C: The registered owner of the leasing company.
    D: The driver who parked it, only if they are caught in the act.
  answer: B
  explanation: The manual states that the owner of a vehicle parked illegally is responsible
    for any parking tickets, and if the vehicle is being leased, the person leasing
    it is responsible.
- id: 197
  category: signs_and_signals
  question: What should you do if you miss your freeway exit and see an emergency
    crossover marked "Authorized Vehicles Only"?
  choices:
    A: Use the crossover quickly if no traffic is coming.
    B: Use the crossover only if you are driving a commercial vehicle.
    C: Drive to the next exit, get off, and re-enter the freeway in the other direction.
    D: Pull onto the median and wait for a gap in traffic to turn around.
  answer: C
  explanation: Never drive across the median or emergency crossover of a freeway.
    To change directions, drive to the next exit, get off and re-enter the freeway
    in the other direction.
- id: 198
  category: signs_and_signals
  question: What does a "Pass With Care" sign indicate?
  choices:
    A: You are approaching a school zone.
    B: It marks the end of a no-passing zone.
    C: You must yield to oncoming traffic before passing.
    D: Passing is strictly prohibited in this area.
  answer: B
  explanation: The "Pass With Care" sign follows the Do Not Pass sign. It is on the
    right side of the road and marks the end of a no-passing zone, meaning you can
    pass when it is safe to do so.
- id: 199
  category: safe_driving_rules
  question: You may not park within how many feet of a fire station driveway on the
    same side of the street?
  choices:
    A: 15 feet
    B: 20 feet
    C: 50 feet
    D: 75 feet
  answer: B
  explanation: You must never park within 20 feet of a fire station driveway on the
    same side of the street.
- id: 200
  category: signs_and_signals
  question: What is the purpose of brown-colored traffic signs?
  choices:
    A: To provide caution for construction or maintenance.
    B: To indicate regulatory laws.
    C: To provide directions to hospitals and services.
    D: To inform you about the location of a cultural or recreational place of interest.
  answer: D
  explanation: Brown-colored signs inform you about the location of a cultural or
    recreational place of interest (Recreation/cultural interest).
- id: 201
  category: safe_driving_rules
  question: Which of the following is required to legally park in a disability parking
    space?
  choices:
    A: A yellow free-parking sticker on any license plate.
    B: A disability license plate or parking placard.
    C: A doctor's note displayed on the dashboard.
    D: A wheelchair visible inside the vehicle.
  answer: B
  explanation: To park in a disability parking space, you must have a disability license
    plate or parking placard, and you or your passenger must have a qualifying disability.
- id: 202
  category: signs_and_signals
  question: Where is a yellow pennant 'No Passing Zone' sign typically located?
  choices:
    A: On the right side of the roadway.
    B: Suspended above the center of the intersection.
    C: On the left side of the roadway.
    D: On the back of a slow-moving vehicle.
  answer: C
  explanation: The yellow pennant 'No Passing Zone' sign is located on the left side
    of the roadway to caution drivers against passing because conditions make it hazardous.
- id: 203
  category: safe_driving_rules
  question: What precaution should drivers, especially of large trucks, take when
    encountering a 'Hill' sign?
  choices:
    A: Accelerate to maintain momentum.
    B: Move to the left lane.
    C: Make sure brakes are working properly and gear down if necessary.
    D: Turn on hazard lights and stop.
  answer: C
  explanation: A 'Hill' sign indicates a steep downslope ahead. All vehicles, especially
    large trucks, should take precautions to make sure their brakes are working properly
    and gear down if necessary.
- id: 204
  category: signs_and_signals
  question: What is the purpose of solid white lines painted on the right edge of
    the road?
  choices:
    A: They separate traffic moving in opposite directions.
    B: They indicate a designated passing zone.
    C: They help drivers stay on the road at night or in bad weather.
    D: They mark a pedestrian crosswalk.
  answer: C
  explanation: Solid white lines mark the right edge of the road. Often called fog
    lines, these lines help you stay on the road at night or in bad weather.
- id: 205
  category: signs_and_signals
  question: What does a double solid white line indicate?
  choices:
    A: Traffic is moving in opposite directions and passing is allowed.
    B: Driving in the same direction is permitted on both sides, but crossing the
      line is prohibited.
    C: The lane is ending and drivers must merge left.
    D: Drivers must stop before proceeding through the intersection.
  answer: B
  explanation: A double solid white line is used to show a travel path where driving
    in the same direction is permitted on both sides of the line but crossing the
    line is prohibited.
- id: 206
  category: safe_driving_rules
  question: Where should you stop your vehicle if an intersection has no stop lines
    or crosswalks?
  choices:
    A: In the middle of the intersection.
    B: Before entering the intersection.
    C: Directly next to the stop sign.
    D: At least 50 feet before the intersection.
  answer: B
  explanation: If there are no stop lines or crosswalks, stop the vehicle before entering
    the intersection.
- id: 207
  category: sharing_the_road
  question: What does a green bicycle lane indicate?
  choices:
    A: A safe zone where bicyclists have the right-of-way over pedestrians.
    B: A lane where vehicles can temporarily pull over to make a delivery.
    C: A potential point of conflict between cars and bicycles, usually at intersections
      and driveways.
    D: A shared lane where cars and bicycles can travel side-by-side.
  answer: C
  explanation: A green bicycle lane indicates a potential point of conflict between
    cars and bicycles, usually intersections and driveways.
- id: 208
  category: sharing_the_road
  question: Which of the following actions is legal for a motor vehicle driver to
    perform in a bicycle lane?
  choices:
    A: Making a right turn.
    B: Pulling over to wait for someone.
    C: Passing another vehicle.
    D: None of these actions are legal.
  answer: D
  explanation: It is illegal to use bicycle lanes for driving, passing, making right
    turns, parking, or as a pull-over to wait for someone or make a delivery.
- id: 209
  category: signs_and_signals
  question: What do yellow lines on the pavement indicate?
  choices:
    A: They separate traffic lanes moving in the same direction.
    B: They separate traffic lanes moving in opposite directions.
    C: They mark the right edge of the roadway.
    D: They indicate a school zone crosswalk.
  answer: B
  explanation: Yellow lines separate traffic lanes moving in opposite directions.
    They include solid, broken and center-lane lines.
- id: 210
  category: safe_driving_rules
  question: When is it permitted to cross a double solid yellow line down the middle
    of a two-lane roadway?
  choices:
    A: When passing a slow-moving vehicle.
    B: When the vehicle ahead is traveling below the speed limit.
    C: When turning into a driveway, onto a crossroad, or accessing a parking spot.
    D: It is never permitted to cross a double solid yellow line.
  answer: C
  explanation: A double solid yellow line means passing is not allowed, but crossing
    is permitted in some situations, such as when turning into a driveway, onto a
    crossroad, or accessing a parking spot.
- id: 211
  category: signs_and_signals
  question: How is a left-turn-only center lane marked?
  choices:
    A: With double solid white lines on both sides.
    B: With a solid yellow line on the outside edge and broken yellow lines on the
      inside edge.
    C: With broken white lines on the outside and solid yellow lines on the inside.
    D: With a single broken yellow line down the center.
  answer: B
  explanation: Each outside edge of the left turn only center lane is marked with
    a solid yellow line with broken yellow lines on the inside edges.
- id: 212
  category: safe_driving_rules
  question: Which of the following is an illegal use of a left-turn-only center lane?
  choices:
    A: Making a left turn from either direction.
    B: Using the lane to pass other vehicles or as a merge lane.
    C: Entering the lane to prepare for an upcoming left turn.
    D: Waiting in the lane until oncoming traffic clears.
  answer: B
  explanation: Using a left-turn-only center lane to pass other vehicles or as a merge
    lane is illegal and dangerous.
- id: 213
  category: safe_driving_rules
  question: How do you complete a left turn at an intersection designed as a 'Michigan
    Left'?
  choices:
    A: Make a direct left turn when the traffic light turns green.
    B: Turn right, then immediately make a U-turn in the middle of the road.
    C: Drive straight through the intersection or turn right, then make a U-turn at
      a median crossover.
    D: Wait in the left-turn-only center lane until traffic clears.
  answer: C
  explanation: To turn left at a Michigan Left, a person must drive straight through
    the intersection, or turn right, then make a U-turn at a median crossover.
- id: 214
  category: safe_driving_rules
  question: Why might a single-lane median crossover in a Michigan Left appear wide
    enough to fit multiple passenger vehicles side-by-side?
  choices:
    A: To allow passenger vehicles to pass each other during the turn.
    B: To accommodate larger vehicles, like tractor trailers, that need a wider turning
      radius.
    C: To provide a safe area for broken-down vehicles to pull over.
    D: To allow bicyclists to share the crossover with motor vehicles.
  answer: B
  explanation: While some crossovers may appear to be wide enough to fit multiple
    passenger vehicles side-by-side, that extra room is actually there to accommodate
    larger vehicles, like tractor trailers and recreational vehicles, that need a
    wider turning radius.
- id: 215
  category: safe_driving_rules
  question: How should a driver treat an unmarked median crossover in a Michigan Left?
  choices:
    A: As a multi-lane crossover.
    B: As a designated passing zone.
    C: As a single-lane crossover.
    D: As a restricted area for emergency vehicles only.
  answer: C
  explanation: An unmarked median crossover should always be treated as a single-lane
    crossover.
- id: 216
  category: signs_and_signals
  question: What do white triangular symbols painted across a traffic lane indicate?
  choices:
    A: You are approaching a railroad crossing.
    B: You should be ready to stop and yield to pedestrians.
    C: You must increase your speed to merge.
    D: You are entering a school zone.
  answer: B
  explanation: According to the manual, white triangles painted across a traffic lane
    indicate you should be ready to stop and yield to pedestrians.
- id: 217
  category: signs_and_signals
  question: What is the meaning of dashed white lines painted across a traffic lane
    in a roundabout?
  choices:
    A: They indicate the edge of the roundabout's circular lane.
    B: They mark a pedestrian crosswalk.
    C: They signal a mandatory stop before entering.
    D: They indicate a lane designated for commercial vehicles only.
  answer: A
  explanation: The manual states that dashed white lines painted across a traffic
    lane in a roundabout indicate the edge of the roundabout's circular lane.
- id: 218
  category: safe_driving_rules
  question: Is it legal to drive across private property, such as a store parking
    lot, to avoid a traffic-control device?
  choices:
    A: Yes, but only if the traffic light is red.
    B: Yes, if there are no pedestrians present.
    C: No, it is illegal to drive across public or private property to avoid a traffic-control
      device.
    D: No, unless you are driving a commercial vehicle.
  answer: C
  explanation: 'The manual explicitly states: "It is illegal to drive across public
    or private property, such as a store parking lot, to avoid a traffic-control device."'
- id: 219
  category: signs_and_signals
  question: What must you do when approaching an intersection and the traffic signal
    turns yellow?
  choices:
    A: Speed up to clear the intersection quickly.
    B: Stop immediately, even if you are in the middle of the intersection.
    C: You are required to stop, but if you cannot stop safely, drive cautiously through
      the intersection.
    D: Honk your horn and proceed without reducing speed.
  answer: C
  explanation: A yellow light means the signal is about to turn red. You are required
    to stop, but if you cannot stop safely, you should not speed up but drive cautiously
    through the intersection.
- id: 220
  category: safe_driving_rules
  question: How should you proceed if you approach an intersection where the traffic
    signal is not working and no law enforcement is present?
  choices:
    A: Treat the intersection as a yield sign and proceed without stopping.
    B: Come to a complete stop and yield to vehicles already at the intersection.
    C: The vehicle on the left always has the right-of-way.
    D: Wait for a law enforcement officer to arrive before crossing.
  answer: B
  explanation: If a traffic signal is not working and there are no law enforcement
    officers present, you must come to a complete stop and yield to vehicles already
    at the intersection.
- id: 221
  category: safe_driving_rules
  question: If a traffic signal is not working and two vehicles reach the intersection
    at the same time, who must yield?
  choices:
    A: The vehicle on the right must yield to the vehicle on the left.
    B: The vehicle on the left must yield to the vehicle on the right.
    C: The vehicle traveling at a higher speed has the right-of-way.
    D: The larger vehicle has the right-of-way.
  answer: B
  explanation: At an intersection with a broken traffic signal, you must yield to
    vehicles on your right if you both reach the intersection at the same time.
- id: 222
  category: signs_and_signals
  question: What does a lit green arrow on a 5-section-head signal indicate?
  choices:
    A: You must yield to oncoming traffic before turning.
    B: You have a protected turn and all oncoming or conflicting traffic is stopped.
    C: You may only turn right.
    D: The signal is about to turn red.
  answer: B
  explanation: When the green arrow is lit, turning drivers have a "protected turn,"
    meaning all oncoming or conflicting traffic is stopped.
- id: 223
  category: signs_and_signals
  question: What does a flashing yellow arrow allow you to do?
  choices:
    A: Turn left only after coming to a complete stop.
    B: Turn left when the oncoming traffic, which has a green light, is clear.
    C: Proceed straight through the intersection without yielding.
    D: Make a protected left turn while oncoming traffic is stopped.
  answer: B
  explanation: A flashing yellow arrow allows you to turn left when the oncoming traffic,
    which has a green light, is clear.
- id: 224
  category: signs_and_signals
  question: What is the proper response to a flashing red traffic light?
  choices:
    A: Come to a full stop and proceed when the road is clear.
    B: Slow down and proceed carefully through the intersection.
    C: Stop only if pedestrians are in the crosswalk.
    D: Yield to traffic on the left and proceed.
  answer: A
  explanation: A flashing red light means come to a full stop. Proceed when the road
    is clear.
- id: 225
  category: sharing_the_road
  question: Approximately how many feet does it take for a commercial vehicle traveling
    at 55 mph to stop?
  choices:
    A: 130 feet
    B: 200 feet
    C: 300 feet
    D: 400 feet
  answer: D
  explanation: According to the manual, a commercial vehicle traveling at 55 mph takes
    about 400 feet to stop.
- id: 226
  category: sharing_the_road
  question: What are the "no zones" around a commercial vehicle?
  choices:
    A: Areas where commercial vehicles are not allowed to park.
    B: Spaces where motorists should not linger because they are hidden from the truck
      driver's view.
    C: Zones where passenger vehicles must travel at a reduced speed.
    D: Lanes exclusively reserved for commercial trucks.
  answer: B
  explanation: '"No zones" are blind spots or spaces in which motorists should not
    linger because they are not readily visible to the commercial driver.'
- id: 227
  category: sharing_the_road
  question: For visibility and safety when traveling at night, what should you do
    when following a truck or bus?
  choices:
    A: Use your high beams to illuminate the truck's rear.
    B: Turn off your headlights.
    C: Use your low beams.
    D: Flash your headlights repeatedly.
  answer: C
  explanation: The manual advises that for visibility and safety when traveling at
    night, you should use your low beams when following a truck or bus.
- id: 228
  category: sharing_the_road
  question: Why might a commercial vehicle swing wide to the left at an intersection?
  choices:
    A: To safely negotiate a right turn.
    B: To allow passenger vehicles to pass on the right.
    C: To prepare for a U-turn.
    D: To avoid stopping at the white stopping line.
  answer: A
  explanation: Commercial vehicles need room to make right turns and may swing wide
    to the left to safely negotiate a right turn.
- id: 229
  category: signs_and_signals
  question: What should pedestrians do if they are in the crosswalk and the pedestrian
    signal begins flashing?
  choices:
    A: Stop immediately and wait in the middle of the road.
    B: Turn around and return to the curb they started from.
    C: Complete their crossing.
    D: Run as fast as possible to the other side.
  answer: C
  explanation: The signal will begin flashing when the time to cross safely is nearing
    its end. Any pedestrians in the crosswalk at that time should complete their crossing.
- id: 230
  category: sharing_the_road
  question: Why should you never cross behind a commercial vehicle that is preparing
    to back up?
  choices:
    A: The truck's exhaust fumes are dangerous at close range.
    B: Most trailers are eight-and-a-half feet wide and can hide a car from the truck
      driver's view.
    C: The truck may suddenly accelerate forward.
    D: Commercial vehicles have the right-of-way when backing up in all situations.
  answer: B
  explanation: You should never cross behind a commercial vehicle that is backing
    up because most trailers are eight-and-a-half feet wide and can hide a car from
    view, preventing the truck driver from seeing your vehicle.
- id: 231
  category: sharing_the_road
  question: When passing a commercial vehicle, when is it safe to pull back into the
    lane in front of it?
  choices:
    A: When you are one car length ahead of the truck.
    B: As soon as you clear the truck's front bumper.
    C: When you can see the entire cab of the truck in your rearview mirror.
    D: When the truck driver flashes their headlights to signal it is safe.
  answer: C
  explanation: The manual states that as you pass, you must be sure you can see the
    entire cab of the truck in your rearview mirror before signaling and pulling back
    into the lane.
- id: 232
  category: defensive_driving
  question: What should you do if a large truck or bus is passing you during bad weather?
  choices:
    A: Speed up to prevent them from passing and splashing your windshield.
    B: Move onto the shoulder of the road until they pass.
    C: Honk your horn to warn them of your presence in their blind spot.
    D: Slow down and start your windshield wipers.
  answer: D
  explanation: The manual advises to slow down if a truck or bus is passing you, especially
    during bad weather, and to start your wipers before the vehicle passes because
    splash or spray from their tires can reduce visibility.
- id: 233
  category: vehicle_information
  question: Which of the following is NOT considered a slow-moving vehicle according
    to the manual?
  choices:
    A: A golf cart
    B: An Amish buggy
    C: A tractor pulling a wagon
    D: Industrial and construction equipment
  answer: A
  explanation: The manual explicitly states that 'Four-wheelers' and golf carts are
    not considered slow-moving vehicles.
- id: 234
  category: sharing_the_road
  question: 'Slow-moving vehicles are defined as those that cannot travel faster than:'
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: According to the manual, slow-moving vehicles are those that cannot
    travel faster than 25 mph.
- id: 235
  category: safe_driving_rules
  question: 'When following a horse and rider or a horse-drawn buggy, you should maintain
    a safe distance of at least:'
  choices:
    A: 10 feet
    B: 20 feet
    C: 50 feet
    D: 100 feet
  answer: B
  explanation: The manual states to reduce your speed to 15-20 mph and maintain a
    safe distance of at least 20 feet between your vehicle and the rider or buggy
    so as not to spook the horse.
- id: 236
  category: safe_driving_rules
  question: 'If another vehicle has stopped for a pedestrian crossing the street,
    you should:'
  choices:
    A: Honk your horn to alert the pedestrian to hurry.
    B: Pass the stopped vehicle on the right side.
    C: Never attempt to pass the stopped vehicle.
    D: Carefully pass the vehicle on the left at a slow speed.
  answer: C
  explanation: The manual explicitly states, 'Never attempt to pass another vehicle
    that has stopped for a pedestrian.'
- id: 237
  category: sharing_the_road
  question: If a street does not have a sidewalk, how should pedestrians walk along
    the road's edge?
  choices:
    A: Facing oncoming traffic
    B: With their backs to oncoming traffic
    C: In the center of the lane
    D: On the right side of the road only
  answer: A
  explanation: The manual states that if a street does not have a sidewalk, pedestrians
    should face oncoming traffic if they choose to walk along the road’s edge.
- id: 238
  category: driver_responsibility
  question: Why should you avoid honking your horn or revving your engine near a pedestrian
    with a white cane or guide dog?
  choices:
    A: It is illegal to use your horn in any crosswalk.
    B: It can cause the guide dog to become aggressive.
    C: These noises are distracting and cover important audible cues used by people
      with visual impairments.
    D: It will cause the pedestrian to walk faster and potentially trip.
  answer: C
  explanation: The manual explains that you should avoid honking or revving the engine
    because these noises are distracting and cover important audible cues used by
    people with visual impairments.
- id: 239
  category: safe_driving_rules
  question: How much travel space should you leave between your vehicle and a motorcyclist,
    scooter operator, or bicyclist?
  choices:
    A: At least 1 or 2 seconds
    B: At least 3 or 4 seconds
    C: At least 5 or 6 seconds
    D: At least 10 seconds
  answer: B
  explanation: The manual states that tailgating is illegal and you should leave at
    least 3 or 4 seconds of travel space between your vehicle and a motorcyclist,
    scooter operator, or bicyclist.
- id: 240
  category: sharing_the_road
  question: Which of the following is true regarding passing a motorcyclist?
  choices:
    A: You may pass them in the same lane if there is enough room.
    B: It is illegal to drive beside them or pass them in the same lane.
    C: You should honk your horn before passing them in the same lane.
    D: You can only pass a motorcyclist on a multi-lane highway.
  answer: B
  explanation: The manual states, 'It is illegal for motorists to drive beside motorcyclists
    or pass them in the same lane. Pass by using an adjacent lane when it is legal
    and safe to do so.'
- id: 241
  category: vehicle_information
  question: 'Motorcyclists are legally allowed to drive on freeways and limited-access
    highways if their vehicle has an engine size of at least:'
  choices:
    A: 50cc
    B: 100cc
    C: 125cc
    D: 250cc
  answer: C
  explanation: According to the manual, motorcyclists operating vehicles with engine
    sizes of 125cc or greater are legally allowed to drive on freeways and limited-access
    highways.
- id: 242
  category: sharing_the_road
  question: Why might a motorcyclist slow down without their brake lights activating?
  choices:
    A: Their brake lights are likely malfunctioning due to the vehicle's small size.
    B: They are using engine braking and downshifting.
    C: They are lightly applying the emergency brake.
    D: Motorcycles are not legally required to have brake lights.
  answer: B
  explanation: The manual notes that motorcyclists frequently use engine braking and
    downshifting, techniques that slow down the vehicle without activating the brake
    lights.
- id: 243
  category: defensive_driving
  question: Which maneuver presents a higher risk for crashes with motorcycles, scooters,
    and bicycles at intersections?
  choices:
    A: Making a right turn on red
    B: Making a left turn
    C: Proceeding straight through a green light
    D: Stopping at a stop sign
  answer: B
  explanation: The manual states to exercise extreme caution when making a left turn
    at an intersection, as left turns present a higher risk for crashes because it
    is easy to misjudge the speed and distance of smaller vehicles.
- id: 244
  category: sharing_the_road
  question: Why is it important to keep extra space between your vehicle and a motorcyclist?
  choices:
    A: Motorcyclists frequently use engine braking which does not activate brake lights.
    B: Motorcycles are required to stop at all railroad crossings.
    C: Motorcyclists are not allowed to use the left lane.
    D: Motorcycles have a wider turning radius than cars.
  answer: A
  explanation: Motorcyclists frequently use engine braking and downshifting to slow
    down without activating their brake lights, so keeping extra space is necessary
    to be safe.
- id: 245
  category: sharing_the_road
  question: According to Michigan law, which of the following is a requirement for
    a vehicle to be defined as a moped?
  choices:
    A: It must have an engine exceeding 150 cc.
    B: It cannot propel itself at a speed greater than 30 mph on a level surface.
    C: It must be equipped with a manual transmission requiring gear shifts.
    D: It must have four wheels.
  answer: B
  explanation: A moped is defined as a motor vehicle that cannot propel itself at
    a speed greater than 30 mph on a level surface, has an engine not exceeding 100
    cc, and does not require shifting gears.
- id: 246
  category: sharing_the_road
  question: What is the minimum passing distance Michigan law requires you to leave
    between your vehicle and a bicyclist?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Michigan law requires that you leave at least 3 feet of space between
    your vehicle and a bicyclist when passing.
- id: 247
  category: sharing_the_road
  question: When are bicyclists permitted to leave a designated bicycle lane?
  choices:
    A: Only when directed by a police officer.
    B: Only when traveling uphill.
    C: To turn left or to avoid hazards.
    D: Bicyclists are never permitted to leave a bicycle lane.
  answer: C
  explanation: Bicyclists are not required to use a bicycle lane and may leave a bicycle
    lane to turn left or to avoid hazards.
- id: 248
  category: sharing_the_road
  question: How does an autocycle differ from a standard motorcycle?
  choices:
    A: It has four wheels and a truck bed.
    B: It is equipped with a straddle seat and handlebars.
    C: It has safety belts, a steering wheel, and is not equipped with a straddle
      seat.
    D: It is only allowed on limited access freeways.
  answer: C
  explanation: An autocycle is a motorcycle that has safety belts, a roll bar or hoops,
    a steering wheel, three wheels, and is not equipped with a straddle seat.
- id: 249
  category: safe_driving_rules
  question: According to the National Highway Traffic Safety Administration, what
    percentage of all traffic fatalities are estimated to be caused by aggressive
    driving behaviors?
  choices:
    A: 25 percent
    B: 40 percent
    C: 50 percent
    D: 66 percent
  answer: D
  explanation: The National Highway Traffic Safety Administration has estimated that
    66 percent of all traffic fatalities are caused by aggressive driving behaviors.
- id: 250
  category: defensive_driving
  question: If you are driving in the left-hand lane to pass slower traffic and someone
    tailgates you, what is the safest course of action?
  choices:
    A: Tap your brakes to warn the tailgater.
    B: Speed up to match the tailgater's speed.
    C: Move back into the right-hand lane when it is safe to do so.
    D: Make an appropriate hand gesture to signal them to back off.
  answer: C
  explanation: If someone tailgates you while you are in the left-hand lane, move
    back into the right-hand lane when it is safe to do so and allow the faster traffic
    to move ahead.
- id: 251
  category: defensive_driving
  question: What should you do if your view of the road or cross traffic is blocked
    by trees or buildings at an intersection?
  choices:
    A: Edge forward slowly until you can see past the obstruction.
    B: Sound your horn and proceed at the normal speed limit.
    C: Wait for another vehicle to pull out first and follow them.
    D: Turn on your high beams to warn oncoming traffic.
  answer: A
  explanation: If you cannot see clearly at an intersection because of obstructions,
    edge forward slowly until you can see past whatever is blocking your view.
- id: 252
  category: safe_driving_rules
  question: Which of the following are NOT allowed to travel on Michigan freeways?
  choices:
    A: Motorcycles with engines larger than 250 cc.
    B: Commercial semi-trucks.
    C: Pedestrians, bicycles, and mopeds.
    D: Passenger vehicles towing trailers.
  answer: C
  explanation: Pedestrians, small motorcycles of 124 cc or less, mopeds, bicycles,
    all-terrain vehicles and slow-moving vehicles are not allowed on freeways.
- id: 253
  category: defensive_driving
  question: What is the recommended way to handle a confrontation with an aggressive
    driver?
  choices:
    A: Make eye contact to show you are not intimidated.
    B: Attempt to get out of the way, avoid eye contact, and ignore gestures.
    C: Follow the driver to get their license plate number.
    D: Return their gestures to let them know they made a mistake.
  answer: B
  explanation: If confronted by an aggressive driver, attempt to get out of the way,
    avoid eye contact and ignore gestures or verbal attacks.
- id: 254
  category: sharing_the_road
  question: When passing a bicyclist, is it legal to pass in a no-passing zone?
  choices:
    A: Yes, as long as it is safe to do so.
    B: Yes, but only if the bicyclist signals you to pass.
    C: No, you must always wait until the no-passing zone ends.
    D: No, passing a bicyclist is strictly prohibited on two-lane roads.
  answer: A
  explanation: You may pass a bicyclist in a no-passing zone as long as it is safe
    to do so.
- id: 255
  category: sharing_the_road
  question: Why can a motorcycle's smaller profile in traffic be dangerous?
  choices:
    A: It makes the motorcycle heavier and harder to stop.
    B: It distorts a motorist's perception of the motorcyclist's true speed and distance.
    C: It causes the motorcycle to drift into other lanes.
    D: It prevents the motorcycle from using engine braking.
  answer: B
  explanation: A motorcycle's smaller profile in traffic can distort a motorist’s
    perception of the motorcyclist’s true speed and distance, making it appear that
    the motorist has more time than they really do.
- id: 256
  category: defensive_driving
  question: How can driving on 'autopilot' affect middle-aged drivers?
  choices:
    A: It improves their reaction time in emergency situations.
    B: It helps them save fuel on long trips.
    C: It leaves them vulnerable because they are not attuned to their driving environment.
    D: It allows them to better predict the actions of aggressive drivers.
  answer: C
  explanation: Driving on 'autopilot' may leave middle-aged drivers vulnerable on
    the road because they are not really attuned to their driving environment and
    its potential risks.
- id: 257
  category: sharing_the_road
  question: What should you do before turning right at an intersection or into a driveway?
  choices:
    A: Honk your horn to warn any bicyclists in the area.
    B: Look for bicyclists riding from behind on the road shoulder or in a bike lane.
    C: Accelerate quickly to turn before a bicyclist can reach the intersection.
    D: Move your vehicle entirely into the bicycle lane to block passing cyclists.
  answer: B
  explanation: Look for bicyclists riding from behind on the road shoulder or in a
    bike lane before turning right at an intersection, into a driveway or pulling
    off the road.
- id: 258
  category: vehicle_information
  question: What safety feature was introduced by Fisher Body in 1930 to reduce glare
    from oncoming traffic at night?
  choices:
    A: Factory-installed seat belts
    B: Mass-produced air bags
    C: The slanted windshield
    D: Halogen headlights
  answer: C
  explanation: In 1930, Fisher Body introduced the slanted windshield to reduce glare
    from the lights of oncoming traffic at night.
- id: 259
  category: safe_driving_rules
  question: According to the manual, which of the following vehicles are prohibited
    from using freeways?
  choices:
    A: Motorcycles over 125 cc
    B: High Occupancy Vehicles
    C: Small motorcycles of 124 cc or less
    D: Commercial trucks
  answer: C
  explanation: The manual states that pedestrians, small motorcycles of 124 cc or
    less, mopeds, bicycles, all-terrain vehicles, and slow-moving vehicles are not
    allowed on freeways.
- id: 260
  category: safe_driving_rules
  question: When entering a freeway from a merging highway or street, who has the
    right of way?
  choices:
    A: The vehicle merging onto the freeway
    B: Vehicles already on the freeway
    C: Whichever vehicle is traveling faster
    D: The vehicle in the rightmost lane must yield to the merging vehicle
  answer: B
  explanation: When merging into traffic, you must yield the right of way to vehicles
    already on the freeway. You must adjust your speed and placement to merge safely.
- id: 261
  category: sharing_the_road
  question: What is a requirement for using a High Occupancy Vehicle (HOV) lane during
    peak hours of operation?
  choices:
    A: The vehicle must have three or more occupants.
    B: The vehicle must be a hybrid or electric car.
    C: The vehicle must have two or more occupants.
    D: The vehicle must be a commercial passenger van.
  answer: C
  explanation: High Occupancy Vehicle (HOV) lanes are used during peak hours of operation,
    and vehicles must have two or more occupants to use the HOV lane.
- id: 262
  category: sharing_the_road
  question: When are motorcycles permitted to use High Occupancy Vehicle (HOV) lanes?
  choices:
    A: Only during peak hours of operation
    B: Only when carrying a passenger
    C: At any time
    D: Only outside of designated rush hours
  answer: C
  explanation: The manual explicitly states that outside of designated hours, HOV
    lanes are open to all motorists, and motorcycles may use them at any time.
- id: 263
  category: safe_driving_rules
  question: What should you do if you miss your exit ramp on the freeway?
  choices:
    A: Use the median crossover to turn around.
    B: Back up carefully on the right shoulder.
    C: Stop and wait for a gap in traffic to reverse.
    D: Drive to the next exit and return to the exit you want.
  answer: D
  explanation: If you miss your exit ramp, never back up, turn around, or use a median
    crossover. Instead, drive to the next exit, get back on the freeway, and return
    to the exit you want.
- id: 264
  category: defensive_driving
  question: To prevent freeway fatigue on long trips, how often does the manual recommend
    stopping to take a 10-minute break?
  choices:
    A: At least every hour
    B: At least every two hours
    C: At least every three hours
    D: At least every four hours
  answer: B
  explanation: If you feel tired, the manual advises you to stop and take a 10-minute
    break at least every two hours.
- id: 265
  category: vehicle_information
  question: Which action will cancel your vehicle's cruise control setting?
  choices:
    A: Depressing the accelerator pedal
    B: Depressing the brake pedal
    C: Turning on the windshield wipers
    D: Using the turn signals
  answer: B
  explanation: Acceleration does not cancel the cruise control setting, but depressing
    the brake pedal will.
- id: 266
  category: defensive_driving
  question: In which of the following situations is it NOT recommended to use cruise
    control?
  choices:
    A: On rural roads with very little traffic
    B: When driving on dry, clear freeways
    C: When roads are slippery from rain, snow, or ice
    D: When driving long distances in daylight
  answer: C
  explanation: Using cruise control in heavy traffic, near large numbers of exit/entrance
    ramps, or when roads are slippery from rain, snow, or ice is not recommended.
- id: 267
  category: defensive_driving
  question: If an oncoming vehicle is in your lane, where should you look for an escape
    route?
  choices:
    A: On the left edge of the road
    B: On the right edge of the road
    C: In the oncoming traffic lane
    D: In the median crossover
  answer: B
  explanation: If an oncoming vehicle is in your lane, you should look for an escape
    route on the right edge of the road and try not to go to the left.
- id: 268
  category: safe_driving_rules
  question: When it begins to rain, why are the roads most slippery during the first
    half hour?
  choices:
    A: The rain mixes with road salt from the winter.
    B: Oil dropped from passing vehicles has not yet been washed away.
    C: The water creates a thick layer of hydroplaning fluid.
    D: Tire tread becomes softer when first exposed to water.
  answer: B
  explanation: When it begins to rain, the roads are most slippery during the first
    half hour because oil dropped from passing vehicles has not been washed away.
- id: 269
  category: vehicle_information
  question: What should you do if your brakes become wet after driving through deep
    water?
  choices:
    A: Pump the brakes rapidly and forcefully.
    B: Shift into neutral and coast until they dry.
    C: Drive at a high speed to air-dry the brake pads.
    D: Slow down and gently push on the brake pedal until they work properly again.
  answer: D
  explanation: Brakes may become wet after driving through deep water. You should
    test them, slow down, and gently push on the brake pedal until the brakes work
    properly again.
- id: 270
  category: safe_driving_rules
  question: Which headlights should you use when driving in fog?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Daytime running lights only
  answer: B
  explanation: The manual instructs drivers to drive slowly in fog, turn on the low-beam
    headlights, and be prepared to stop quickly.
- id: 271
  category: defensive_driving
  question: If your vehicle begins skidding, what is the first step you should take?
  choices:
    A: Slam on the brakes immediately.
    B: Turn the steering wheel sharply in the opposite direction.
    C: Take your foot off the accelerator.
    D: Shift the vehicle into neutral.
  answer: C
  explanation: If your vehicle begins skidding, the first step listed in the manual
    is to take your foot off the accelerator.
- id: 272
  category: defensive_driving
  question: How should you steer if your vehicle begins to skid?
  choices:
    A: Turn the front wheels in the direction you want to go.
    B: Turn the front wheels in the opposite direction of the skid.
    C: Keep the steering wheel perfectly straight.
    D: Turn the wheels sharply toward the right shoulder.
  answer: A
  explanation: When skidding, you should turn the front wheels only enough to keep
    them pointed in the direction you want to go and no farther.
- id: 273
  category: safe_driving_rules
  question: Which areas of the road tend to freeze before the rest of the road in
    cold weather?
  choices:
    A: Intersections and crosswalks
    B: Bridges and underpasses
    C: Entrance and exit ramps
    D: High Occupancy Vehicle (HOV) lanes
  answer: B
  explanation: The manual notes that in cold weather, bridges and underpasses freeze
    before the road does.
- id: 274
  category: vehicle_information
  question: How should you apply the brakes in an emergency stop if your vehicle is
    equipped with anti-lock brakes?
  choices:
    A: Pump the brakes rapidly to avoid locking the wheels.
    B: Apply hard, firm pressure from the start and maintain it.
    C: Press the brake pedal lightly and release it repeatedly.
    D: Apply the brakes just hard enough to not lock the wheels.
  answer: B
  explanation: With anti-lock brakes, you should apply the brake with hard, firm pressure
    from the start and maintain this pressure until you have stopped.
- id: 275
  category: vehicle_information
  question: What is the recommended braking method for a vehicle without anti-lock
    brakes during an emergency stop?
  choices:
    A: Apply hard, firm pressure and maintain it until stopped.
    B: Pump the brake pedal as fast as possible.
    C: Apply the brakes just hard enough to not lock the wheels, releasing and reapplying
      if they lock.
    D: Press the brake pedal all the way to the floor and hold it.
  answer: C
  explanation: In a vehicle without anti-lock brakes, apply the brakes just hard enough
    to not lock the wheels. If they lock, release pressure and apply again, which
    is known as threshold or controlled braking.
- id: 276
  category: safe_driving_rules
  question: Under normal driving conditions on dry or wet pavement, what is the recommended
    minimum following distance?
  choices:
    A: 1 to 2 seconds
    B: 3 to 4 seconds
    C: 5 to 6 seconds
    D: 7 to 8 seconds
  answer: B
  explanation: A 3- to 4-second following distance is required to estimate how much
    time and space you have for stopping on either dry or wet pavement.
- id: 277
  category: defensive_driving
  question: To spot potential hazards and avoid last-second reactions, how far down
    the road should you look?
  choices:
    A: 5 to 10 seconds ahead
    B: 10 to 15 seconds ahead
    C: 20 to 30 seconds ahead
    D: 40 to 50 seconds ahead
  answer: C
  explanation: The manual states to look down the road 20-30 seconds to spot potential
    hazards and avoid last-second reactions.
- id: 278
  category: safe_driving_rules
  question: When are you legally required to turn on your headlights?
  choices:
    A: One hour after sunset until one hour before sunrise.
    B: One half-hour after sunset until one half-hour before sunrise.
    C: Only when it is completely dark outside.
    D: From 8:00 PM to 6:00 AM.
  answer: B
  explanation: Headlights must be turned on one half-hour after sunset until one half-hour
    before sunrise and at other times when visibility is reduced.
- id: 279
  category: safe_driving_rules
  question: It is illegal to use or flash your high-beam headlights within what distance
    of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: It is illegal to use or even flash high-beam headlights within 500
    feet of an oncoming vehicle.
- id: 280
  category: defensive_driving
  question: What should you do if an oncoming driver does not dim their headlights
    at night?
  choices:
    A: Flash your high beams continuously until they dim theirs.
    B: Look directly into the oncoming headlights to gauge their distance.
    C: Keep your eyes on the right edge of the road ahead.
    D: Turn on your interior dome light to adjust your eyes.
  answer: C
  explanation: If oncoming drivers do not dim their headlights, keep your eyes on
    the right edge of the road ahead and do not look directly into oncoming headlights
    to avoid being blinded by the glare.
- id: 281
  category: defensive_driving
  question: Generally, what is the safest thing to do if you are involved in a roadside
    emergency?
  choices:
    A: Stand on the shoulder of the road and wave for help.
    B: Stay in your car with your seat belt buckled until help arrives.
    C: Walk along the highway to the nearest service station.
    D: Attempt to flag down passing motorists from the center median.
  answer: B
  explanation: Generally, the safest thing to do if you are involved in a roadside
    emergency is to stay in your car, with your seat belt buckled, until help arrives.
- id: 282
  category: driver_responsibility
  question: When should you move your vehicle from the main roadway after a crash?
  choices:
    A: Only after the police have arrived and taken a report.
    B: Never; vehicles must remain exactly where they collided.
    C: If the crash does not result in serious injury or death and the vehicle can
      be driven safely.
    D: Only if the property damage is estimated to be less than $500.
  answer: C
  explanation: Vehicles involved in crashes that do not result in serious injury or
    death shall be moved from the main roadway by the driver or a passenger if the
    vehicle can be driven and it is safe to do so.
- id: 283
  category: driver_responsibility
  question: You must notify the police after a crash if there are injuries or if property
    damage exceeds what amount?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: You must notify the police if there are injuries or property damage
    exceeding $1,000.
- id: 284
  category: defensive_driving
  question: What should you do if a vehicle-deer crash is unavoidable?
  choices:
    A: Swerve sharply into the opposite lane to avoid the deer.
    B: Honk your horn and flash your high beams to scare the deer away.
    C: Do not veer; stay in your lane and brake firmly.
    D: Accelerate to reduce the impact time.
  answer: C
  explanation: If a vehicle-deer crash is unavoidable, do not veer for deer; stay
    in your lane, brake firmly, and hold onto the steering wheel with both hands.
- id: 285
  category: defensive_driving
  question: Which of the following is an effective way to deter deer from crossing
    in front of your vehicle?
  choices:
    A: Using deer whistles.
    B: Flashing your high-beam headlights.
    C: Honking your horn loudly.
    D: None of the above; do not rely on gimmicks.
  answer: D
  explanation: 'The manual states: "Do not rely on gimmicks. Deer whistles, flashing
    your high-beam headlights or honking your horn will not deter deer."'
- id: 286
  category: vehicle_information
  question: Why should you never turn the ignition to the 'lock' position while your
    vehicle is in motion?
  choices:
    A: It will cause the engine to overheat immediately.
    B: The steering will lock, causing you to lose control of the vehicle.
    C: It will permanently damage the anti-lock braking system.
    D: The airbags will deploy automatically.
  answer: B
  explanation: Never turn the ignition to the 'lock' position while your vehicle is
    in motion or the steering will lock. Once the steering locks, you will lose control
    of the vehicle.
- id: 287
  category: safe_driving_rules
  question: What is the recommended action if you get a flat tire while driving in
    a high-risk area or at night?
  choices:
    A: Pull over immediately and change the tire on the shoulder.
    B: Stop in the middle of the road and turn on your hazard lights.
    C: Try to drive slowly to a service station or store with a well-lighted parking
      lot.
    D: Abandon the vehicle and walk to find help.
  answer: C
  explanation: Do not get out to fix a flat tire. Try to drive slowly to a service
    station or store with a well-lighted parking lot and telephone for service.
- id: 288
  category: safe_driving_rules
  question: What should you do if your car becomes disabled on the roadway?
  choices:
    A: Stand behind the car to warn approaching traffic.
    B: Pull as far off the traveled portion of the roadway as possible and activate
      your four-way emergency lights.
    C: Leave your vehicle immediately and walk along the freeway to find help.
    D: Turn off all lights to save your battery and wait for police.
  answer: B
  explanation: If your car becomes disabled, pull as far off the traveled portion
    of the roadway as possible, activate your four-way emergency lights, and stay
    inside your vehicle with your seat belt securely fastened.
- id: 289
  category: defensive_driving
  question: If a carjacker threatens you and demands your vehicle, what is the recommended
    action?
  choices:
    A: Fight the carjacker to protect your property.
    B: Refuse to unlock the doors and sound the horn continuously.
    C: Give up the vehicle without a fight.
    D: Attempt to drive away as quickly as possible.
  answer: C
  explanation: If a carjacker wants the vehicle, give it up without a fight. A car
    can be replaced but personal safety is priceless.
- id: 290
  category: safe_driving_rules
  question: When pulled over by a law enforcement officer, where should you keep your
    hands?
  choices:
    A: In your pockets or lap.
    B: Reaching for your glove compartment to get your registration.
    C: Empty and in plain sight on the steering wheel.
    D: Outside the driver's side window.
  answer: C
  explanation: During a traffic stop, you should keep both hands empty and in plain
    sight on the steering wheel.
- id: 291
  category: driver_responsibility
  question: When should you retrieve your license, registration, and insurance card
    during a traffic stop?
  choices:
    A: As soon as you pull over, before the officer approaches.
    B: Only when the officer asks for them.
    C: While the officer is walking up to your vehicle.
    D: You do not need to provide them unless you are being arrested.
  answer: B
  explanation: Take your license, registration, and insurance card out only when the
    officer asks for them. Let the officer know where these items are located before
    you retrieve them.
- id: 292
  category: driver_responsibility
  question: What should you do if you believe the traffic stop or the ticket issued
    by an officer is inappropriate?
  choices:
    A: Argue with the officer about the reason for the stop.
    B: Refuse to accept the ticket from the officer.
    C: Discuss the matter with the court, not the officer.
    D: Drive away before the officer finishes writing the ticket.
  answer: C
  explanation: If you feel the stop or the ticket is inappropriate, discuss the matter
    with the court, not the officer. Do not argue about the reason for the stop.
- id: 293
  category: signs_and_signals
  question: If a law enforcement officer's directions conflict with a traffic control
    device, which should you follow?
  choices:
    A: The traffic control device.
    B: The law enforcement officer's orders.
    C: Whichever seems safer at the time.
    D: You should stop and wait for the traffic control device to change.
  answer: B
  explanation: Always obey a law enforcement officer's orders. An officer's directions
    take priority over other traffic control devices.
- id: 294
  category: safe_driving_rules
  question: Under Michigan law, is it permissible to use a mobile phone while driving
    to report an emergency?
  choices:
    A: No, mobile phone use is strictly prohibited at all times.
    B: Yes, but only if you are driving under 30 mph.
    C: Yes, use of a mobile phone while driving to report emergencies is allowed.
    D: No, you must pull over and turn off the engine first.
  answer: C
  explanation: If you are in trouble, call for assistance on your mobile phone. Use
    of a mobile phone while driving to report emergencies is allowed under Michigan
    law.
- id: 295
  category: defensive_driving
  question: Why is city driving generally considered more dangerous than expressway
    driving?
  choices:
    A: Because of the lower speed limits.
    B: Because of narrower driving lanes.
    C: Because of cross traffic and pedestrians.
    D: Because of worse road conditions in bad weather.
  answer: C
  explanation: According to the safe driving knowledge test, city driving is more
    dangerous than expressway driving because of cross traffic and pedestrians.
- id: 296
  category: signs_and_signals
  question: What must you do when you come to an intersection with a flashing red
    light?
  choices:
    A: Slow down and drive carefully through the intersection.
    B: Turn either right or left since the road is blocked ahead.
    C: Stop at the intersection and wait for a flashing green light.
    D: Stop at the intersection, then proceed as traffic allows.
  answer: D
  explanation: When you come to an intersection with a flashing red light, you must
    stop at the intersection, then proceed as traffic allows.
- id: 297
  category: safe_driving_rules
  question: 'When driving in the right lane on an expressway, you should probably
    move into the left lane when:'
  choices:
    A: Traffic is heavy but moving steadily.
    B: The weather is bad and roads are slippery.
    C: Traffic is slow in your lane and cars are in the left lane.
    D: Traffic is light and cars are merging onto the expressway from the right.
  answer: D
  explanation: You should probably move into the left lane when traffic is light and
    cars are merging onto the expressway from the right to allow them room to enter
    safely.
- id: 298
  category: defensive_driving
  question: To reduce the effects of headlight glare at night, where should you look?
  choices:
    A: Straight ahead.
    B: Over your shoulder.
    C: At the center of the road.
    D: To the right edge of the road.
  answer: D
  explanation: To reduce the effects of headlight glare at night, you should look
    to the right edge of the road.
- id: 299
  category: safe_driving_rules
  question: What is the proper way to check your blind spot when changing lanes?
  choices:
    A: Using the inside rearview mirror.
    B: Using the outside rearview mirror.
    C: Using both inside and outside rearview mirrors.
    D: Turning your head and looking over your shoulder.
  answer: D
  explanation: When changing lanes, you can check your blind spot by turning your
    head and looking over your shoulder.
- id: 300
  category: signs_and_signals
  question: When approaching a work zone with a 'Where Workers Present 45' sign, what
    should drivers do?
  choices:
    A: Slow down immediately to 25 mph.
    B: Drive at a safe speed for conditions, watch for workers, and slow down to 45
      mph or lower where workers are present.
    C: Merge to the right lane immediately.
    D: Stop and wait for a construction worker to wave you through.
  answer: B
  explanation: Drivers should drive at a safe speed for conditions (up to the posted
    speed limit), watch for construction workers, and slow down to 45 mph or lower
    where workers are present.
- id: 301
  category: sharing_the_road
  question: While driving on a two-lane road without bicycle lanes, what is the safest
    way to pass a bicyclist traveling in the same direction?
  choices:
    A: Slow down, wait until there is no approaching traffic, and pass leaving sufficient
      space.
    B: Continue driving straight; it is the bicyclist's responsibility to move.
    C: Do not pass the bicyclist until you come to a traffic signal or stop sign.
    D: Honk to let the bicyclist know you are about to pass closely.
  answer: A
  explanation: The safest way to pass a bicyclist on a two-lane road is to slow down
    and wait until there is no traffic approaching, then pass the bicyclist leaving
    him or her sufficient space.
- id: 302
  category: defensive_driving
  question: To maintain safe driving awareness, how long should you look at any one
    thing while driving?
  choices:
    A: Until you have completely passed it.
    B: For no more than a few seconds.
    C: At least five seconds to ensure you recognize the hazard.
    D: You should only look straight ahead at all times.
  answer: B
  explanation: To help keep safe, you should avoid looking at any one thing for more
    than a few seconds.
- id: 303
  category: vehicle_information
  question: Which of the following vehicle-related services can be completed online
    at Michigan.gov/SOS?
  choices:
    A: Getting a first-time vehicle inspection
    B: Replacing a vehicle registration or title
    C: Disputing a parking ticket
    D: Reporting an abandoned vehicle
  answer: B
  explanation: According to the manual, you can replace a vehicle registration or
    title online at Michigan.gov/SOS.
- id: 304
  category: driver_testing
  question: How much is the convenience fee to take the written driver's license knowledge
    test online at home?
  choices:
    A: $5.00
    B: $6.50
    C: $10.00
    D: $15.50
  answer: B
  explanation: The written driver's license knowledge test is available online to
    take at home for a $6.50 convenience fee.
- id: 305
  category: driver_testing
  question: In what formats are original driver's license tests available for non-native
    speakers?
  choices:
    A: Electronic, paper, or audio formats
    B: Only in paper format
    C: Only through a live translator
    D: Electronic format only
  answer: A
  explanation: Original driver's license tests are available in many foreign languages
    in electronic, paper, or audio formats.
- id: 306
  category: license_system
  question: If a hard-of-hearing or deaf customer needs to contact the Secretary of
    State, which service should they use?
  choices:
    A: The Michigan Relay Center at 711
    B: The Information Center at 888-SOS-MICH
    C: The online chat portal at Michigan.gov
    D: The local police department
  answer: A
  explanation: Hard-of-hearing and deaf customers should contact the Michigan Relay
    Center at 711.
- id: 307
  category: license_system
  question: Which of the following driver's license services is available online at
    Michigan.gov/SOS?
  choices:
    A: Taking the driving skills road test
    B: Pre-applying for an original driver's license
    C: Getting a first-time photograph taken
    D: Surrendering a revoked license
  answer: B
  explanation: Services available at Michigan.gov/SOS include pre-applying for an
    original driver's license.
- id: 308
  category: license_system
  question: What is the phone number for the Michigan Department of State Information
    Center?
  choices:
    A: 800-MICH-SOS
    B: 888-SOS-MICH
    C: '911'
    D: 877-DRIVE-MI
  answer: B
  explanation: If you have questions or need more information about any service offered
    by the Secretary of State, call the Michigan Department of State Information Center
    at 888-SOS-MICH (767-6424).
- id: 309
  category: license_system
  question: Which of the following can you update online through the Secretary of
    State's website?
  choices:
    A: Your vehicle's emissions record
    B: Your emergency contact information
    C: Your driving test score
    D: Your traffic citation history
  answer: B
  explanation: You can update your emergency contact information online at Michigan.gov/SOS.
- id: 310
  category: driver_responsibility
  question: Where can you find the Michigan Voter Information Center online?
  choices:
    A: Michigan.gov/Vote
    B: Michigan.gov/Elections
    C: Michigan.gov/SOS
    D: Michigan.gov/VoterInfo
  answer: A
  explanation: The manual states that the Michigan Voter Information Center is located
    at Michigan.gov/Vote.
- id: 311
  category: license_system
  question: Which of the following is an online service provided by the Secretary
    of State regarding the Michigan Organ Donor Registry?
  choices:
    A: Scheduling an organ donation surgery
    B: Joining the registry and replacing your organ donor heart sticker
    C: Requesting a medical evaluation for donation
    D: Viewing the medical records of organ donors
  answer: B
  explanation: Online services include joining the Michigan Organ Donor Registry and
    replacing your organ donor heart sticker.
- id: 312
  category: penalties_and_points
  question: Can you pay licensing reinstatement fees online?
  choices:
    A: No, they must be paid in person at a branch office.
    B: No, they must be mailed to the Department of State.
    C: Yes, you can pay licensing reinstatement fees online at Michigan.gov/SOS.
    D: Yes, but only through a third-party payment processor.
  answer: C
  explanation: Paying licensing reinstatement fees is listed as one of the 'More services'
    available online at Michigan.gov/SOS.
- id: 313
  category: license_system
  question: Which resource material is designated as SOS-194?
  choices:
    A: Michigan Commercial Driver License Manual
    B: Driving Skills Test Study Guide
    C: Michigan's Guide for Aging Drivers and Their Families
    D: The Supervised Driving Guide
  answer: C
  explanation: The resource materials list identifies 'Michigan's Guide for Aging
    Drivers and Their Families' as SOS-194.
- id: 314
  category: vehicle_information
  question: In addition to renewing your car, motorcycle, or truck registration online,
    what else does the manual remind you not to forget?
  choices:
    A: Your proof of insurance
    B: Your Recreation Passport
    C: Your emissions certificate
    D: Your property tax receipt
  answer: B
  explanation: Under vehicle online services, it says 'Renew your car, motorcycle
    or truck (And don't forget your Recreation Passport)'.
- id: 315
  category: license_system
  question: Which of the following endorsements can be added to your license online
    if you are eligible?
  choices:
    A: Commercial Driver (CDL) endorsement
    B: Chauffeur endorsement
    C: Motorcycle endorsement
    D: Hazmat endorsement
  answer: C
  explanation: The online services list includes 'Add a motorcycle endorsement (if
    eligible)'.
- id: 316
  category: license_system
  question: If you need to request your driving record, how can you do this according
    to the manual?
  choices:
    A: By visiting a police station
    B: By submitting a request online at Michigan.gov/SOS
    C: By calling the Michigan State Safety Commission
    D: By contacting the Michigan Center for Truck Safety
  answer: B
  explanation: '''Request your driving record'' is listed under the online services
    available at Michigan.gov/SOS.'
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 317
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 318
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 319
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 320
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 321
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 322
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 323
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 324
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 325
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 326
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 327
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 328
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 329
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 330
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 331
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 332
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 333
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 334
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 335
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 336
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 337
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 338
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 339
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 340
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 341
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 342
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 343
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 344
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
