    A: The motorist, because there is no marked crosswalk
    B: The pedestrian, as every intersection is considered an 'unmarked crosswalk'
    C: The person who arrives at the intersection first
    D: The motorist, but only if they are turning right
  answer: B
  explanation: In Nunavut, pedestrians have the right of way at all intersections,
    whether the crosswalk is marked or unmarked, unless otherwise regulated by traffic
    signals.
- id: 170
  category: sharing_the_road
  question: When passing a cyclist on a road in Nunavut, what is the recommended minimum
    safe distance you should maintain between your vehicle and the cyclist?
  choices:
    A: 0.5 meters
    B: 1 meter
    C: 3 meters
    D: The width of one car
  answer: B
  explanation: To ensure the safety of cyclists, drivers should provide at least one
    meter of space when passing. Cyclists may need to swerve to avoid potholes or
    debris.
- id: 171
  category: sharing_the_road
  question: If you are driving behind a large commercial truck, why should you increase
    your following distance more than you would for a passenger car?
  choices:
    A: Trucks are required to drive slower than the speed limit
    B: To allow yourself a better view of the road ahead which the truck is blocking
    C: Because trucks have better brakes and stop faster than cars
    D: So the truck driver can see your headlights in their rearview mirror
  answer: B
  explanation: Following too closely behind a large truck (tailgating) puts you in
    the truck's 'No-Zone' (blind spot) and severely limits your vision of the road
    and traffic conditions ahead.
- id: 172
  category: sharing_the_road
  question: In Nunavut, what must you do when you see a person with a white cane or
    a guide dog at a crosswalk?
  choices:
    A: Honk to let them know you are there
    B: Slow down and proceed with caution
    C: Stop and give them the right of way, as they are visually impaired
    D: Drive around them if there is enough space
  answer: C
  explanation: Drivers must exercise extreme caution and yield the right of way to
    pedestrians with white canes or guide dogs, as these indicate the person is visually
    impaired.
- id: 173
  category: sharing_the_road
  question: 'When a large truck is turning right at an intersection, you should be
    aware that:'
  choices:
    A: The truck will always stay in the right-most lane
    B: The truck may need to swing wide to the left to clear the curb
    C: The truck has the same turning radius as a car
    D: You should speed up to pass the truck on the right before it turns
  answer: B
  explanation: Large vehicles have a much wider turning radius. Drivers should never
    attempt to pass a truck on the right at an intersection because the truck may
    swing left before turning right.
- id: 174
  category: sharing_the_road
  question: In many Nunavut communities, you may share the road with snowmobiles or
    ATVs. What is a key rule for motor vehicle drivers regarding these vehicles?
  choices:
    A: Snowmobiles always have the right of way on public roads
    B: Motor vehicles must yield to snowmobiles at all times
    C: Be alert for snowmobiles crossing the road and treat them with the same respect
      as other motor vehicles
    D: Snowmobiles are not allowed to cross public roads
  answer: C
  explanation: Snowmobiles and ATVs are common in Nunavut. While they have specific
    rules for crossing roads, car drivers must remain alert for them and share the
    road safely.
- id: 175
  category: sharing_the_road
  question: When following a motorcycle, why should you maintain a greater following
    distance than when following a car?
  choices:
    A: Motorcycles are much heavier and take longer to stop
    B: Motorcycles can stop very quickly and are more easily affected by road hazards
      like gravel or ice
    C: Motorcyclists are required by law to be followed by at least 4 seconds
    D: Motorcycles have very bright brake lights that can blind you
  answer: B
  explanation: Motorcycles are light and can stop rapidly. Additionally, hazards like
    loose gravel or slippery patches (common in Nunavut) can cause a motorcyclist
    to fall, requiring you to have enough space to react.
- id: 176
  category: sharing_the_road
  question: If you are stopped behind a school bus with its red lights flashing, when
    are you permitted to proceed?
  choices:
    A: As soon as the last child has stepped off the bus
    B: When the driver of the bus waves you on
    C: Only when the red lights stop flashing and the stop arm is retracted
    D: After waiting for at least 30 seconds
  answer: C
  explanation: It is illegal and dangerous to pass a school bus until the red lights
    have completely stopped flashing and the stop arm has been pulled back.
- id: 177
  category: sharing_the_road
  question: During Nunavut's periods of extended darkness, what is the most important
    thing a driver can do to protect pedestrians?
  choices:
    A: Drive with high beams on at all times
    B: Only drive on main roads
    C: Scan the sides of the road carefully and reduce speed in residential areas
    D: Honk at every intersection to warn pedestrians
  answer: C
  explanation: Visibility is low during the dark season. Drivers must be extra vigilant,
    scanning for pedestrians who may be wearing dark clothing and reducing speed to
    allow for more reaction time.
- id: 178
  category: sharing_the_road
  question: 'When a pilot vehicle (escort vehicle) with amber flashing lights is leading
    a wide load or oversized vehicle, you should:'
  choices:
    A: Pass the oversized vehicle as quickly as possible
    B: Increase your following distance and be prepared to pull over or stop
    C: Drive between the pilot vehicle and the oversized load
    D: Ignore the pilot vehicle as it has no legal authority
  answer: B
  explanation: Pilot vehicles warn of an oversized load that may take up more than
    one lane. Drivers should slow down, stay back, and follow instructions from the
    pilot vehicle driver or flaggers.
- id: 179
  category: sharing_the_road
  question: What should you do if you are in an intersection and hear an emergency
    siren?
  choices:
    A: Stop immediately in the middle of the intersection
    B: Back up out of the intersection
    C: Clear the intersection by proceeding through it, then pull over to the right
      and stop
    D: Turn left to get out of the way
  answer: C
  explanation: Never stop in the middle of an intersection. If an emergency vehicle
    approaches, complete your turn or go through the intersection first, then pull
    over to the right as soon as it is safe.
- id: 180
  category: sharing_the_road
  question: 'When sharing the road with heavy equipment like loaders or graders (common
    in Nunavut for snow removal), you should:'
  choices:
    A: Assume the operator can see you because they sit high up
    B: Give them plenty of space as they have large blind spots and may move unpredictably
    C: Follow closely to stay in the path they have cleared
    D: Pass them on the right side only
  answer: B
  explanation: Heavy equipment operators have limited visibility and the machines
    can be noisy, making it hard for them to hear other vehicles. Always give them
    a wide berth.
- id: 181
  category: sharing_the_road
  question: In Nunavut, what is the rule regarding funeral processions?
  choices:
    A: You must speed up to pass the entire procession
    B: You should not break through or interfere with a funeral procession
    C: Funeral processions must follow all normal right-of-way rules at stop signs
    D: You are required to pull over and stop until the procession passes
  answer: B
  explanation: It is a matter of courtesy and safety in many jurisdictions, including
    Nunavut, to not cut through or interfere with a funeral procession led by a lead
    vehicle with flashing lights.
- id: 182
  category: sharing_the_road
  question: In Nunavut, how many demerit points are assigned to a driver's record
    for failing to stop for a school bus with flashing red lights?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: Failing to stop for a school bus is considered a serious safety violation
    in Nunavut and results in 6 demerit points.
- id: 183
  category: sharing_the_road
  question: When passing a cyclist on a roadway in Nunavut, what is the recommended
    safe following and passing practice?
  choices:
    A: Share the lane side-by-side with the cyclist
    B: Give the cyclist at least one meter of space between your vehicle and the bike
    C: Honk your horn continuously until the cyclist pulls off the road
    D: Pass as closely as possible to encourage the cyclist to use the sidewalk
  answer: B
  explanation: Drivers should treat cyclists as other vehicles and provide at least
    one meter of space when passing to ensure safety.
- id: 184
  category: sharing_the_road
  question: 'Large commercial trucks have ''blind spots'' where the driver cannot
    see other vehicles. These areas are commonly referred to as:'
  choices:
    A: Safe Zones
    B: No-Zones
    C: Clear Zones
    D: Buffer Zones
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around the front, back,
    and sides of a truck where passenger vehicles can disappear from the truck driver's
    view.
- id: 185
  category: sharing_the_road
  question: If you are driving on a road with a median (divided highway) and see a
    school bus stopped on the opposite side of the median with red lights flashing,
    do you need to stop?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, drivers on the opposite side of a divided highway do not need to stop
    C: Yes, but only if there are children visible
    D: No, but you must speed up to clear the area
  answer: B
  explanation: On a divided highway where there is a physical median or barrier, traffic
    approaching from the opposite direction of the school bus is not required to stop.
- id: 186
  category: sharing_the_road
  question: In Nunavut, what must you do when approaching a stationary emergency vehicle
    or tow truck that has its lights flashing on the side of the road?
  choices:
    A: Maintain your speed and stay in your lane
    B: Slow down to a safe speed and move to the left lane if it is safe to do so
    C: Stop immediately in the roadway
    D: Turn on your high beams to alert the emergency workers
  answer: B
  explanation: Drivers are required to slow down and, if the road has multiple lanes,
    move over to the lane furthest from the emergency vehicle to provide a safety
    buffer.
- id: 187
  category: sharing_the_road
  question: When a pedestrian is using a white cane or is accompanied by a guide dog
    at a crosswalk, what does this indicate to the driver?
  choices:
    A: The pedestrian is a government official
    B: The pedestrian has a visual impairment and has the right of way
    C: The pedestrian is training a dog and should be ignored
    D: The driver should honk to let the pedestrian know it is safe to cross
  answer: B
  explanation: A white cane or guide dog indicates the pedestrian is blind or visually
    impaired. Drivers must exercise extreme caution and yield the right of way.
- id: 188
  category: sharing_the_road
  question: Under Nunavut law, what is the minimum distance you must maintain when
    following an emergency vehicle that has its lights or sirens activated?
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: It is illegal to follow within 150 meters of an emergency vehicle responding
    to an alarm.
- id: 189
  category: sharing_the_road
  question: Why should you avoid cutting in front of a large truck immediately after
    passing it?
  choices:
    A: Trucks have a smaller fuel tank
    B: Trucks require a much longer distance to stop than cars
    C: Truck drivers are legally allowed to ram cars that cut them off
    D: It is considered a 'No-Zone' violation punishable by license suspension
  answer: B
  explanation: Because of their weight, large trucks need significantly more distance
    to stop. Cutting in front of them removes their safety cushion.
- id: 190
  category: sharing_the_road
  question: In many Nunavut communities, snowmobiles and ATVs share the road or cross
    them frequently. What is a driver's primary responsibility regarding these vehicles?
  choices:
    A: Assume the snowmobile will always stop
    B: Expect them to travel at the same speed as cars
    C: Exercise extra caution and yield as they may be less stable or visible
    D: Force them off the road as they are not 'real' vehicles
  answer: C
  explanation: In the North, off-road vehicles are common. Drivers must be vigilant,
    especially at trail crossings, as these vehicles may be operated by younger drivers
    or be less visible in snowy conditions.
- id: 191
  category: sharing_the_road
  question: If you are stopped at a red light and an emergency vehicle with sirens
    approaches from behind, what should you do?
  choices:
    A: Run the red light to get out of the way
    B: Stay put if you cannot safely move to the right without entering the intersection
    C: Turn left immediately
    D: Back up into the car behind you
  answer: B
  explanation: You should never move into an intersection against a red light to clear
    a path. If you cannot safely pull to the right, stay stopped until the light changes
    or the emergency vehicle finds a way around.
- id: 192
  category: vehicle_information
  question: In Nunavut, what is the minimum legal tread depth for tires on a passenger
    vehicle?
  choices:
    A: 0.5 millimeters
    B: 1.0 millimeters
    C: 1.6 millimeters
    D: 3.2 millimeters
  answer: C
  explanation: According to vehicle safety standards in Nunavut, tires must have a
    minimum tread depth of 1.6 millimeters (approximately 2/32 of an inch) to be considered
    safe and legal.
- id: 193
  category: vehicle_information
  question: According to the Nunavut Motor Vehicles Act, when must a vehicle's headlights
    be turned on?
  choices:
    A: Only between 11:00 PM and 5:00 AM
    B: From one hour after sunset to one hour before sunrise
    C: Whenever you are driving on a gravel road
    D: From a half hour after sunset to a half hour before sunrise, or when visibility
      is less than 150 meters
  answer: D
  explanation: Headlights must be used from 30 minutes after sunset to 30 minutes
    before sunrise, and at any time when atmospheric conditions (fog, snow, etc.)
    reduce visibility to less than 150 meters.
- id: 194
  category: vehicle_information
  question: When approaching an oncoming vehicle at night, at what distance must you
    switch from high-beam to low-beam headlights?
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 300 meters
  answer: C
  explanation: You must dim your high beams to low beams at least 150 meters before
    meeting an oncoming vehicle.
- id: 195
  category: vehicle_information
  question: Every motor vehicle operated on Nunavut highways must be equipped with
    how many separate braking systems?
  choices:
    A: One hydraulic system
    B: Two, including a service brake and a parking/emergency brake
    C: Three, including an anti-lock system
    D: One, provided it is a dual-circuit system
  answer: B
  explanation: 'The law requires two independent braking systems: the service brake
    (foot brake) and the parking or emergency brake.'
- id: 196
  category: vehicle_information
  question: If a vehicle's interior rearview mirror is obstructed by a load or a trailer,
    what is the legal requirement for side mirrors in Nunavut?
  choices:
    A: No additional mirrors are required if the driver uses a spotter
    B: Only a left-hand exterior mirror is required
    C: Mirrors must be attached to both the left and right sides providing a clear
      view 60 meters to the rear
    D: The vehicle cannot be legally driven until the obstruction is removed
  answer: C
  explanation: If the interior mirror does not provide a clear view of the highway
    to the rear, the vehicle must be equipped with mirrors on both the left and right
    sides.
- id: 197
  category: vehicle_information
  question: 'In Nunavut, a motor vehicle''s horn must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 200 meters
  answer: B
  explanation: A motor vehicle must have a horn in good working order capable of emitting
    sound audible under normal conditions from a distance of not less than 60 meters.
- id: 198
  category: vehicle_information
  question: Regarding window tinting in Nunavut, which of the following is prohibited?
  choices:
    A: Any tinting on the rear window
    B: Tinting on the rear side windows
    C: Aftermarket tinting on the windshield and the windows to the immediate left
      and right of the driver
    D: Factory-installed tinting on any window
  answer: C
  explanation: For safety and visibility, aftermarket tinting is generally prohibited
    on the windshield and the front side windows (driver and passenger side).
- id: 199
  category: vehicle_information
  question: What is the regulation regarding a vehicle's exhaust system and mufflers
    in Nunavut?
  choices:
    A: Mufflers are optional on vehicles older than 20 years
    B: A muffler cut-out or bypass is permitted for off-road use only
    C: Every motor vehicle must have a muffler in good working order to prevent excessive
      noise
    D: Exhaust pipes must exit from the front of the vehicle
  answer: C
  explanation: The Motor Vehicles Act requires all vehicles to have an effective muffler.
    Devices like 'muffler cut-outs' or bypasses that increase noise are illegal.
- id: 200
  category: vehicle_information
  question: In Nunavut, a child must be secured in a rear-facing infant seat until
    they reach what minimum weight?
  choices:
    A: 5 kg (11 lbs)
    B: 10 kg (22 lbs)
    C: 18 kg (40 lbs)
    D: 25 kg (55 lbs)
  answer: B
  explanation: Safety regulations require infants to be in a rear-facing seat until
    they weigh at least 10 kg (22 lbs) and are able to walk unassisted (though keeping
    them rear-facing longer is recommended).
- id: 201
  category: vehicle_information
  question: 'At night, the rear license plate of a vehicle in Nunavut must be illuminated
    by a white light so that it is legible from a distance of at least:'
  choices:
    A: 5 meters
    B: 10 meters
    C: 15 meters
    D: 30 meters
  answer: C
  explanation: The rear license plate must be illuminated so that it is clearly visible
    from a distance of 15 meters to the rear.
- id: 202
  category: vehicle_information
  question: Vehicles wider than 2.05 meters (80 inches) must have clearance lights.
    What color must the clearance lights at the front of the vehicle be?
  choices:
    A: White
    B: Amber
    C: Red
    D: Blue
  answer: B
  explanation: Front clearance lights must be amber, while rear clearance lights must
    be red, to indicate the width of the vehicle to other drivers.
- id: 203
  category: vehicle_information
  question: While not a legal requirement for the vehicle's mechanical operation,
    what does the Nunavut Driver's Manual strongly recommend all drivers carry for
    winter travel?
  choices:
    A: An extra set of spark plugs
    B: A full-sized spare engine block
    C: An emergency survival kit including blankets, food, and a shovel
    D: A satellite television receiver
  answer: C
  explanation: Due to extreme weather and isolation in Nunavut, the manual emphasizes
    carrying an emergency survival kit for safety.
- id: 204
  category: vehicle_information
  question: Under Nunavut law, what is the requirement for windshield wipers on a
    motor vehicle?
  choices:
    A: They are only required during the summer months
    B: A vehicle must have at least one manually operated wiper
    C: Every motor vehicle (except motorcycles) must have a power-driven windshield
      wiper system
    D: Wipers are not required if the windshield is treated with water-repellent chemicals
  answer: C
  explanation: Motor vehicles must be equipped with a power-driven windshield wiper
    system that can be controlled by the driver to ensure clear vision.
- id: 205
  category: vehicle_information
  question: In Nunavut, when must a vehicle's headlights be turned on?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: Only when it is snowing or foggy
    C: From one-half hour after sunset to one-half hour before sunrise, and whenever
      visibility is less than 150 meters
    D: Only between the hours of 10:00 PM and 6:00 AM
  answer: C
  explanation: According to the Nunavut Driver's Manual, headlights must be used from
    one-half hour after sunset to one-half hour before sunrise, and at any time when
    atmospheric conditions (like snow or fog) reduce visibility to less than 150 meters.
- id: 206
  category: vehicle_information
  question: Regarding vehicle windows, which of the following is illegal in Nunavut?
  choices:
    A: Having any tint on the rear side windows
    B: Using clear glass on the windshield
    C: Applying a tinted film to the windshield that obstructs the driver's view
    D: Having a crack in the windshield that is less than 2 cm long
  answer: C
  explanation: It is illegal to apply any film or tint to the windshield that interferes
    with the driver's view or to have a windshield so cracked or clouded that it obstructs
    vision.
- id: 207
  category: vehicle_information
  question: What are the requirements for rearview mirrors in Nunavut if the interior
    mirror's view is obstructed by a trailer or load?
  choices:
    A: No additional mirrors are required if you use a spotter
    B: You must install a camera system
    C: You must have an outside mirror on both the left and right sides of the vehicle
    D: You only need a left-side exterior mirror
  answer: C
  explanation: If the interior rearview mirror does not provide a clear view of the
    highway at least 60 meters to the rear, the vehicle must be equipped with mirrors
    on both the left and right exterior sides.
- id: 208
  category: vehicle_information
  question: Which of the following is a requirement for a vehicle's exhaust system
    in Nunavut?
  choices:
    A: It must be equipped with a muffler that prevents excessive or unusual noise
      and smoke
    B: It must have a 'straight pipe' for better fuel efficiency
    C: It must be modified to be as loud as possible for safety
    D: Mufflers are optional on vehicles older than 20 years
  answer: A
  explanation: Every motor vehicle must have a muffler in good working order to prevent
    excessive noise and smoke. Muffler cut-outs or bypasses are prohibited.
- id: 209
  category: vehicle_information
  question: 'A vehicle''s turn signal lights must be visible in normal sunlight from
    a distance of at least:'
  choices:
    A: 15 meters
    B: 30 meters
    C: 60 meters
    D: 100 meters
  answer: B
  explanation: Turn signal lamps must be visible from a distance of 30 meters in normal
    sunlight.
- id: 210
  category: vehicle_information
  question: Which of the following equipment is mandatory for all motor vehicles operated
    in Nunavut to ensure the windshield remains clear?
  choices:
    A: A manual hand-scraper only
    B: A windshield wiper system and a defrosting/defogging system
    C: An automated brush system
    D: Heated wiper blades
  answer: B
  explanation: Vehicles must be equipped with functional windshield wipers and a defrosting
    or defogging system to maintain a clear view through the windshield.
- id: 211
  category: vehicle_information
  question: What is the requirement for the 'Slow Moving Vehicle' sign in Nunavut?
  choices:
    A: It must be displayed on any vehicle traveling faster than 60 km/h
    B: It must be displayed on the front of all tractors
    C: It must be displayed on the rear of vehicles designed to travel at speeds of
      40 km/h or less
    D: It is only required for vehicles driving at night
  answer: C
  explanation: A 'Slow Moving Vehicle' sign (an orange triangle with a red border)
    must be attached to the rear of any vehicle that is not capable of maintaining
    a speed greater than 40 km/h.
- id: 212
  category: vehicle_information
  question: 'In Nunavut, the parking brake must be capable of holding the vehicle:'
  choices:
    A: Only on flat ground
    B: On any grade (slope) upon which it is operated
    C: Only when the engine is running
    D: For a maximum of 10 minutes
  answer: B
  explanation: The parking brake must be adequate to hold the vehicle on any grade
    on which it is operated, regardless of the load conditions.
- id: 213
  category: signs_and_signals
  question: In Nunavut, what does a flashing red light at an intersection signify?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to change to solid red
    C: Stop completely and proceed only when it is safe to do so
    D: Yield to all traffic coming from the right only
  answer: C
  explanation: 'According to the Nunavut Motor Vehicles Act, a flashing red light
    has the same meaning as a stop sign: drivers must come to a complete stop and
    proceed only when safe.'
- id: 214
  category: signs_and_signals
  question: 'When you encounter a flashing amber (yellow) light at an intersection
    in Nunavut, you should:'
  choices:
    A: Stop and wait for the light to turn green
    B: Slow down and proceed with caution
    C: Speed up to clear the intersection quickly
    D: Treat it as a four-way stop
  answer: B
  explanation: A flashing amber light indicates that drivers should reduce speed and
    proceed through the intersection with caution, yielding to pedestrians or other
    vehicles already in the intersection.
- id: 215
  category: signs_and_signals
  question: In Nunavut, what does a solid yellow line on your side of the center of
    the highway indicate?
  choices:
    A: Passing is permitted if the road is clear
    B: Passing is prohibited
    C: You are on a one-way street
    D: The shoulder is unsafe for parking
  answer: B
  explanation: A solid yellow line on your side of the center line means that passing
    is prohibited because it is unsafe to see far enough ahead to pass.
- id: 216
  category: signs_and_signals
  question: Which hand signal is the correct way to indicate a right turn in Nunavut?
  choices:
    A: Left arm extended straight out the window
    B: Left arm out and bent upward at the elbow
    C: Left arm out and bent downward at the elbow
    D: Right arm extended straight out the window
  answer: B
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at a 90-degree angle.
- id: 217
  category: signs_and_signals
  question: What does a pentagon-shaped (five-sided) sign indicate in Nunavut?
  choices:
    A: Railway crossing
    B: Yield right-of-way
    C: School zone or school crossing
    D: Construction zone
  answer: C
  explanation: A five-sided sign (pentagon) is specifically used to warn drivers that
    they are entering a school zone or approaching a school crossing.
- id: 218
  category: signs_and_signals
  question: When a school bus in Nunavut is stopped with its red lights flashing and
    stop arm extended, what must a driver do?
  choices:
    A: Stop only if traveling in the same direction as the bus
    B: Slow down to 15 km/h and pass carefully
    C: Stop at least 5 meters from the bus regardless of the direction of travel
    D: Honk to warn pedestrians and proceed slowly
  answer: C
  explanation: In Nunavut, drivers approaching a school bus with flashing red lights
    from either direction must stop and remain stopped until the lights stop flashing
    and the arm is retracted.
- id: 219
  category: signs_and_signals
  question: What is the meaning of a white diamond marking on a specific lane in Nunavut?
  choices:
    A: The lane is for emergency vehicles only
    B: The lane is reserved for specific types of vehicles (e.g., buses or high-occupancy
      vehicles)
    C: The lane is ending shortly
    D: The lane is for snowmobiles only
  answer: B
  explanation: A white diamond symbol on the pavement indicates a reserved lane, typically
    for buses, taxis, or high-occupancy vehicles (HOV).
- id: 220
  category: signs_and_signals
  question: 'If you are approaching an intersection and the traffic light changes
    from green to amber (yellow), you should:'
  choices:
    A: Speed up to clear the intersection
    B: Stop before entering the intersection unless you are too close to stop safely
    C: Stop immediately, even if you are in the middle of the intersection
    D: Continue through at the same speed
  answer: B
  explanation: A solid amber light means the signal is about to turn red. Drivers
    must stop if they can do so safely; otherwise, they should proceed with caution.
