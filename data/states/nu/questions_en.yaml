metadata:
  source: Nunavut Driver Handbook
  total_questions: 239
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What is the minimum age required to apply for a Class 7 Learner's License
    in Nunavut?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: In Nunavut, an individual must be at least 15 years of age to apply
    for a Class 7 Learner's License.
- id: 2
  category: license_system
  question: A Class 7 learner driver in Nunavut must be accompanied by a supervisor
    who has held a valid Class 5 license (or higher) for at least how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: The supervising driver for a Class 7 learner must have held a valid
    Class 5 license for at least two years.
- id: 3
  category: license_system
  question: What is the permitted Blood Alcohol Concentration (BAC) for a driver in
    the Graduated Driver Licensing (GDL) program in Nunavut?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Drivers in Nunavut's GDL program (Class 7 and Class 5P) must maintain
    a zero (0.00%) blood alcohol level while operating a vehicle.
- id: 4
  category: license_system
  question: How long must a driver hold a Class 7 Learner's License before they are
    eligible to take the road test for a Class 5P (Probationary) license?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: A driver must hold a Class 7 Learner's License for at least 12 months
    before they can attempt the road test for a probationary license.
- id: 5
  category: license_system
  question: Which of the following is a restriction for a Class 7 Learner driver in
    Nunavut regarding passengers?
  choices:
    A: No passengers are allowed in the vehicle at any time.
    B: Only one passenger is allowed in the vehicle.
    C: The only passenger allowed in the front seat is the supervising driver.
    D: Passengers are only allowed during daylight hours.
  answer: C
  explanation: According to Nunavut's GDL rules, the only passenger allowed in the
    front seat with a Class 7 driver is the qualified supervising driver.
- id: 6
  category: license_system
  question: Under the Nunavut GDL program, what are the restricted hours during which
    a Class 7 Learner is NOT permitted to drive?
  choices:
    A: 10:00 PM to 5:00 AM
    B: 11:00 PM to 7:00 AM
    C: Midnight to 6:00 AM
    D: There are no hourly restrictions for Class 7 drivers.
  answer: C
  explanation: Class 7 Learner drivers in Nunavut are prohibited from driving between
    the hours of midnight and 6:00 AM.
- id: 7
  category: license_system
  question: How long is the probationary period (Class 5P) in Nunavut before a driver
    can obtain a full Class 5 license?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: Drivers must remain in the Class 5P (Probationary) stage for at least
    12 months without any suspensions before graduating to a full Class 5 license.
- id: 8
  category: license_system
  question: In Nunavut, at what demerit point total will a fully licensed driver receive
    a notice of interview or a warning letter?
  choices:
    A: 3 to 5 points
    B: 6 to 8 points
    C: 9 to 14 points
    D: 15 or more points
  answer: B
  explanation: In Nunavut, when a driver accumulates 6 to 8 demerit points, they typically
    receive a warning letter regarding their driving record.
- id: 9
  category: license_system
  question: A driver's license in Nunavut is suspended automatically if a driver accumulates
    how many demerit points within a 2-year period?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: D
  explanation: A driver's license will be suspended in Nunavut if they accumulate
    15 or more demerit points within a 24-month period.
- id: 10
  category: license_system
  question: If you move to a new residence within Nunavut, how many days do you have
    to notify the Registrar of Motor Vehicles of your change of address?
  choices:
    A: 7 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: Residents of Nunavut are required by law to notify the Registrar of
    a change of address within 15 days.
- id: 11
  category: license_system
  question: Which license class is required in Nunavut to operate a motorcycle?
  choices:
    A: Class 4
    B: Class 5
    C: Class 6
    D: Class 8
  answer: C
  explanation: Class 6 is the specific license class required to operate a motorcycle
    in Nunavut.
- id: 12
  category: license_system
  question: To apply for a Class 1, 2, 3, or 4 commercial license in Nunavut, what
    additional document is mandatory?
  choices:
    A: A high school diploma
    B: A medical examination report
    C: A letter of intent from an employer
    D: A criminal record check
  answer: B
  explanation: Applicants for commercial license classes (1, 2, 3, and 4) must submit
    a medical examination report to ensure they meet the physical standards for operating
    large or commercial vehicles.
- id: 13
  category: license_system
  question: Which of the following vehicles can be operated with a standard Class
    5 license in Nunavut?
  choices:
    A: A bus with a seating capacity of 40
    ',B': A two-axle vehicle other than a motorcycle or taxi
    C: An ambulance
    D: A semi-trailer truck
  answer: B
  explanation: A Class 5 license allows the operation of a two-axle vehicle, such
    as a car, van, or light truck, but does not permit driving motorcycles, taxis,
    ambulances, or large commercial vehicles.
- id: 14
  category: license_system
  question: If a GDL driver in Nunavut violates the zero-alcohol condition, what is
    the immediate administrative penalty?
  choices:
    A: A verbal warning
    B: A 24-hour suspension
    C: A 30-day license suspension
    D: Permanent revocation of the license
  answer: C
  explanation: Under Nunavut's Traffic Safety Act, GDL drivers who consume any amount
    of alcohol are subject to an immediate 30-day license suspension.
- id: 15
  category: license_system
  question: A standard Nunavut driver's license is typically valid for how many years
    before it must be renewed?
  choices:
    A: 2 years
    B: 3 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: In Nunavut, a driver's license is generally valid for a period of five
    years, expiring on the driver's birthday.
- id: 16
  category: license_system
  question: If you become a resident of Nunavut, how long are you permitted to drive
    with a valid out-of-territory license before you must obtain a Nunavut driver's
    license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: New residents of Nunavut who hold a valid driver's license from another
    Canadian jurisdiction must exchange it for a Nunavut license within 90 days.
- id: 17
  category: license_system
  question: While operating a motorcycle with a Class 6 Learner's permit in Nunavut,
    how many passengers are you allowed to carry?
  choices:
    A: Zero passengers
    B: One passenger, provided they have a Class 6 license
    C: One passenger, provided they are over 18
    D: Two passengers if the motorcycle has a sidecar
  answer: A
  explanation: A driver with a Class 6 Learner's permit is strictly prohibited from
    carrying any passengers on the motorcycle.
- id: 18
  category: license_system
  question: What is the maximum number of passengers allowed in a vehicle driven by
    a Class 5P (Probationary) driver in Nunavut?
  choices:
    A: One passenger
    B: Two passengers
    C: Only immediate family members
    D: As many passengers as there are working seatbelts
  answer: D
  explanation: Under the Nunavut GDL program, Class 5P drivers are restricted to carrying
    only as many passengers as there are functioning seatbelts in the vehicle.
- id: 19
  category: license_system
  question: For drivers holding a Class 1, 2, 3, or 4 license who are under the age
    of 45, how often must a medical examination report be submitted to the Registrar?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Only upon initial application
  answer: C
  explanation: Commercial drivers in Nunavut under age 45 must submit a medical report
    every 5 years. The frequency increases to every 2 years after age 45, and annually
    after age 65.
- id: 20
  category: license_system
  question: In Nunavut, which letter code is added to a driver's license to indicate
    the driver is authorized to operate vehicles equipped with air brakes?
  choices:
    A: Code A
    B: Code Q
    C: Code Z
    D: Code S
  answer: B
  explanation: The 'Q' endorsement on a Nunavut driver's license indicates that the
    holder is qualified to operate vehicles equipped with air brakes.
- id: 21
  category: license_system
  question: If your Nunavut driver's license has been expired for more than two years,
    what is required to renew it?
  choices:
    A: Pay a double renewal fee
    B: Simply provide new identification
    C: You must pass the written and road tests again
    D: Provide a letter of reference from a previous employer
  answer: C
  explanation: If a license has been expired for more than 24 months (2 years), the
    applicant is treated as a new driver and must pass all required examinations again.
- id: 22
  category: license_system
  question: If you change your legal name, within how many days must you notify the
    Registrar of Motor Vehicles and apply for a replacement license?
  choices:
    A: 7 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: According to the Nunavut Motor Vehicles Act, any change of name or
    address must be reported to the Registrar within 15 days.
- id: 23
  category: license_system
  question: Where must the supervising driver sit when a Class 7 Learner is operating
    a motor vehicle in Nunavut?
  choices:
    A: Anywhere in the vehicle
    B: Directly behind the driver
    C: In the front passenger seat
    D: In the seat with the best view of the mirrors
  answer: C
  explanation: The supervisor for a Class 7 learner must occupy the seat immediately
    beside the driver (the front passenger seat).
- id: 24
  category: license_system
  question: Which license class is specifically required in Nunavut to operate a taxi,
    ambulance, or a bus with a seating capacity of 24 passengers or less?
  choices:
    A: Class 3
    B: Class 4
    C: Class 5
    D: Class 5P
  answer: B
  explanation: A Class 4 license is required for taxis, ambulances, and small buses
    (up to 24 passengers) in Nunavut.
- id: 25
  category: license_system
  question: If you fail a road test in Nunavut, what is the minimum waiting period
    before you are eligible to attempt the test again?
  choices:
    A: 24 hours
    B: 7 days
    C: 14 days
    D: 30 days
  answer: C
  explanation: Drivers who fail the road test must wait a minimum of 14 days before
    they can take another road test.
- id: 26
  category: license_system
  question: To graduate from the Class 5P (Probationary) stage to a full Class 5 license,
    a driver must remain suspension-free for how long?
  choices:
    A: The entire 12-month probationary period
    B: The last 6 months of the probationary period
    C: 24 consecutive months
    D: There is no suspension-free requirement
  answer: A
  explanation: To progress to a full Class 5 license, the driver must complete the
    12-month probationary period without any license suspensions.
- id: 27
  category: license_system
  question: When applying for a first-time Nunavut driver's license, how many pieces
    of identification are generally required to prove your legal name, date of birth,
    and signature?
  choices:
    A: One piece of photo ID only
    B: Two pieces of valid identification
    C: Three pieces of identification
    D: A verbal confirmation from a resident
  answer: B
  explanation: Applicants must provide at least two pieces of identification that
    establish their legal name, date of birth, and signature.
- id: 28
  category: driver_testing
  question: What is the minimum visual acuity required in the better eye, with or
    without corrective lenses, to pass the vision test for a Class 5 license in Nunavut?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to Nunavut driver licensing standards, an applicant must
    have a minimum visual acuity of 20/40 in at least one eye to qualify for a standard
    driver's license.
- id: 29
  category: driver_testing
  question: Which of the following is a mandatory requirement for the vehicle provided
    by an applicant for a Nunavut road test?
  choices:
    A: It must be a rental vehicle
    B: It must have a manual transmission
    C: It must have a valid registration and insurance certificate
    D: It must be less than 5 years old
  answer: C
  explanation: Applicants must provide a safe, road-worthy vehicle for the test that
    is properly registered and insured in accordance with the Nunavut Motor Vehicles
    Act.
- id: 30
  category: driver_testing
  question: 'In Nunavut, you must report an accident to the nearest police officer
    immediately if the total property damage to all vehicles and property appears
    to exceed:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Under the Nunavut Motor Vehicles Act, any accident involving injury,
    death, or property damage exceeding $2,000 must be reported to the police immediately.
- id: 31
  category: driver_testing
  question: How many demerit points are recorded against a driver's record for failing
    to wear a seatbelt in Nunavut?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failing to wear a seatbelt or failing to ensure a passenger under 16
    is properly restrained results in 2 demerit points in Nunavut.
- id: 32
  category: driver_testing
  question: In Nunavut, how many demerit points are assigned for a conviction of distracted
    driving (using a hand-held electronic device)?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Distracted driving, such as using a cell phone while operating a vehicle,
    carries a penalty of 3 demerit points in Nunavut.
- id: 33
  category: driver_testing
  question: When approaching a school bus that is stopped with red lights flashing
    and the stop arm extended, how far back must you stop your vehicle?
  choices:
    A: 5 meters
    B: 10 meters
    C: 20 meters
    D: 50 meters
  answer: C
  explanation: Drivers must stop at least 20 meters away from a school bus when its
    red lights are flashing and the stop arm is out, whether approaching from the
    front or rear.
- id: 34
  category: driver_testing
  question: Unless otherwise posted, what is the maximum speed limit in a school zone
    in Nunavut when children are present?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: The standard speed limit in school zones within Nunavut communities
    is 30 km/h unless signs indicate a different limit.
- id: 35
  category: driver_testing
  question: In Nunavut, between which dates are drivers permitted to use studded tires
    on their vehicles?
  choices:
    A: September 1 to April 30
    B: October 1 to May 31
    C: November 1 to March 31
    D: Year-round
  answer: B
  explanation: To protect road surfaces while ensuring winter safety, studded tires
    are permitted in Nunavut from October 1st to May 31st.
- id: 36
  category: driver_testing
  question: What is the minimum amount of third-party liability insurance coverage
    required for all motor vehicles in Nunavut?
  choices:
    A: $50,000
    B: $100,000
    C: $200,000
    D: $500,000
  answer: C
  explanation: The Motor Vehicles Act of Nunavut requires all vehicle owners to carry
    a minimum of $200,000 in third-party liability insurance.
- id: 37
  category: driver_testing
  question: During a road test in Nunavut, which of the following actions will result
    in an immediate and automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: Crossing a solid yellow line to avoid a hazard
    C: Requiring the examiner to intervene to prevent a collision
    D: Driving 2 km/h under the speed limit
  answer: C
  explanation: Any action that requires the examiner to take control of the vehicle
    or intervene to prevent an accident results in an automatic failure of the road
    test.
- id: 38
  category: driver_testing
  question: Under ideal road and weather conditions, what is the recommended minimum
    following distance behind the vehicle in front of you?
  choices:
    A: 1 car length
    B: 2 seconds
    C: 4 seconds
    D: 10 meters
  answer: B
  explanation: The 'two-second rule' is the recommended minimum following distance
    under ideal conditions in Nunavut to allow for adequate reaction time.
- id: 39
  category: driver_testing
  question: When an emergency vehicle (ambulance, fire truck, or police car) is approaching
    with its siren and flashing lights activated, what must you do?
  choices:
    A: Speed up to get out of the way
    B: Stop exactly where you are
    C: Pull to the right as far as possible and stop
    D: Follow the vehicle to see where it is going
  answer: C
  explanation: Drivers must immediately pull to the right-hand curb or edge of the
    road and remain stopped until the emergency vehicle has passed.
- id: 40
  category: driver_testing
  question: At an intersection where there are no traffic lights or marked crosswalks
    (an unmarked crosswalk), what is the driver's responsibility toward pedestrians?
  choices:
    A: The driver has the right of way
    B: The driver must yield the right of way to pedestrians
    C: Pedestrians must wait for all traffic to clear
    D: The driver should honk to warn the pedestrian
  answer: B
  explanation: In Nunavut, pedestrians have the right of way at both marked and unmarked
    crosswalks at intersections.
- id: 41
  category: driver_testing
  question: To meet the vision requirements for a Class 5 driver's license in Nunavut,
    an applicant must have a visual acuity of at least what in their best eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to Nunavut driver licensing standards, an applicant must
    have a minimum visual acuity of 20/40 in at least one eye, with or without corrective
    lenses.
- id: 42
  category: driver_testing
  question: In Nunavut, a motor vehicle accident must be reported to the police if
    it results in injury, death, or property damage exceeding what total amount?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Under the Nunavut Motor Vehicles Act, any accident involving personal
    injury, death, or combined property damage of $2,000 or more must be reported
    to the police immediately.
- id: 43
  category: driver_testing
  question: When driving at night, you must dim your high-beam headlights when you
    are within how many meters of an oncoming vehicle?
  choices:
    A: 100 meters
    B: 150 meters
    C: 200 meters
    D: 300 meters
  answer: B
  explanation: Nunavut regulations require drivers to switch to low-beam headlights
    when an oncoming vehicle is within 150 meters to avoid blinding the other driver.
- id: 44
  category: driver_testing
  question: In Nunavut, when following another vehicle, what is the recommended minimum
    following distance under ideal road conditions?
  choices:
    A: 1 car length
    B: 2 seconds
    C: 4 seconds
    D: 10 seconds
  answer: B
  explanation: The 'two-second rule' is the recommended minimum following distance
    in Nunavut for ideal conditions; this should be increased significantly in icy
    or snowy conditions.
- id: 45
  category: driver_testing
  question: You are prohibited from parking your vehicle within how many meters of
    a fire hydrant in Nunavut?
  choices:
    A: 2 meters
    B: 3 meters
    C: 5 meters
    D: 10 meters
  answer: C
  explanation: According to Nunavut's traffic rules, you must not park a vehicle within
    5 meters of a fire hydrant.
- id: 46
  category: driver_testing
  question: When parking a vehicle on a roadway, you must not park within how many
    meters of a stop sign or yield sign?
  choices:
    A: 3 meters
    B: 6 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: In Nunavut, it is illegal to park a vehicle within 6 meters of the
    approach side of a stop sign or yield sign.
- id: 47
  category: driver_testing
  question: 'In Nunavut, you must use your headlights whenever atmospheric conditions
    (fog, snow, rain) make it impossible to see clearly for a distance of:'
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: Headlights must be turned on in Nunavut if visibility is reduced to
    150 meters or less due to weather or light conditions.
- id: 48
  category: driver_testing
  question: When approaching an intersection where the traffic lights are not working,
    how should you proceed?
  choices:
    A: Yield to the vehicle on the left
    B: Treat the intersection as a four-way stop
    C: Maintain speed if you are on a main road
    D: Wait for a police officer to arrive
  answer: B
  explanation: If traffic signals are dark or malfunctioning in Nunavut, drivers must
    treat the intersection as a multi-way stop.
- id: 49
  category: driver_testing
  question: 'U-turns are prohibited in Nunavut on a curve or near the crest of a hill
    where the driver cannot be seen by other drivers approaching from either direction
    within:'
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 250 meters
  answer: C
  explanation: U-turns are illegal on hills or curves where there is not at least
    150 meters of clear visibility in both directions.
- id: 50
  category: driver_testing
  question: For a fully licensed driver (non-GDL) in Nunavut, what is the legal Blood
    Alcohol Concentration (BAC) limit that constitutes a criminal offense?
  choices:
    A: '0.02'
    B: '0.05'
    C: '0.08'
    D: '0.10'
  answer: C
  explanation: While administrative penalties may begin at lower levels (0.05), the
    Criminal Code of Canada limit for all territories, including Nunavut, is 0.08
    BAC.
- id: 51
  category: driver_responsibility
  question: In Nunavut, you must report a motor vehicle accident to the nearest RCMP
    detachment if the total property damage exceeds what amount?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: According to the Nunavut Motor Vehicles Act, any accident involving
    injury, death, or property damage apparently exceeding $2,000 must be reported
    to the police immediately.
- id: 52
  category: driver_responsibility
  question: Which of the following documents must a driver carry at all times while
    operating a motor vehicle in Nunavut?
  choices:
    A: Driver's license and birth certificate
    B: Driver's license, vehicle registration, and proof of insurance
    C: Vehicle registration and bill of sale
    D: Driver's license and a copy of the Motor Vehicles Act
  answer: B
  explanation: Drivers in Nunavut are legally required to produce a valid driver's
    license, the vehicle's registration certificate, and valid proof of insurance
    upon the request of a peace officer.
- id: 53
  category: driver_responsibility
  question: When selling a vehicle in Nunavut, within how many days must the seller
    notify the Registrar of Motor Vehicles of the transfer of ownership?
  choices:
    A: Immediately
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: Under the Motor Vehicles Act, the seller of a vehicle must notify the
    Registrar within 10 days of the sale or transfer of the vehicle.
- id: 54
  category: driver_responsibility
  question: If you purchase a vehicle in Nunavut, how many days do you have to apply
    for a new registration in your name?
  choices:
    A: 10 days
    B: 14 days
    C: 21 days
    D: 30 days
  answer: A
  explanation: The new owner of a vehicle must apply to the Registrar for a transfer
    of registration within 10 days of acquiring the vehicle.
- id: 55
  category: driver_responsibility
  question: What is the maximum fine for a first-time offense of operating a motor
    vehicle without valid insurance in Nunavut?
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: C
  explanation: Driving without insurance is a serious offense in Nunavut; a first-time
    conviction can result in a fine of up to $2,500.
- id: 56
  category: driver_responsibility
  question: In Nunavut, the driver is legally responsible for ensuring that all passengers
    under what age are properly secured by a seatbelt or child restraint system?
  choices:
    A: Under 12 years old
    B: Under 14 years old
    C: Under 16 years old
    D: Under 18 years old
  answer: C
  explanation: The driver is responsible for ensuring that any passenger under the
    age of 16 is properly wearing a seatbelt or is secured in an approved child safety
    seat.
- id: 57
  category: driver_responsibility
  question: If you collide with an unattended vehicle and cannot locate the owner,
    what is your legal responsibility in Nunavut?
  choices:
    A: Leave a note with your name, address, and license number and report it to the
      police immediately
    B: Wait at the scene for at least two hours
    C: Only report it if the damage appears to be over $2,000
    D: Leave a note only if there is visible paint damage
  answer: A
  explanation: If the owner of a damaged vehicle or property cannot be found, you
    must leave a written notice with your contact information and report the accident
    to the RCMP immediately.
- id: 58
  category: driver_responsibility
  question: How often must most commercial vehicles in Nunavut undergo a mandatory
    mechanical safety inspection?
  choices:
    A: Every 6 months
    B: Every 12 months
    C: Every 24 months
    D: Only when the vehicle is sold
  answer: B
  explanation: Commercial vehicles and buses in Nunavut are generally required to
    undergo a mechanical safety inspection every 12 months to ensure they meet safety
    standards.
- id: 59
  category: driver_responsibility
  question: What happens to your Nunavut driver's license if you fail to pay a court-ordered
    judgment for damages resulting from a motor vehicle accident?
  choices:
    A: Nothing, it only affects your credit score
    B: Your license will be suspended until the judgment is satisfied
    C: You will be required to retake your road test
    D: Your registration is suspended, but your license remains valid
  answer: B
  explanation: The Registrar may suspend a driver's license and vehicle registration
    if the person fails to satisfy a judgment rendered by a court for damages caused
    by a motor vehicle.
- id: 60
  category: driver_responsibility
  question: 'In Nunavut, vehicle registration renewal dates are typically determined
    by:'
  choices:
    A: The driver's date of birth
    B: The date the vehicle was originally purchased
    C: The first letter of the owner's last name
    D: A fixed date of April 1st for everyone
  answer: C
  explanation: Nunavut uses a staggered registration system where the expiry month
    is determined by the first letter of the owner's surname (or company name).
- id: 61
  category: driver_responsibility
  question: 'A peace officer in Nunavut may issue an immediate 24-hour roadside license
    suspension if they have reasonable grounds to believe the driver:'
  choices:
    A: Is driving more than 20 km/h over the limit
    B: Has not paid their registration fees
    C: Is impaired by alcohol or a drug
    D: Is driving with an expired license
  answer: C
  explanation: Under the Motor Vehicles Act, a peace officer can suspend a driver's
    license for 24 hours if they suspect the driver's ability to operate a vehicle
    is affected by alcohol or drugs.
- id: 62
  category: driver_responsibility
  question: For most private passenger vehicles in Nunavut, where must the license
    plate be displayed?
  choices:
    A: On the front of the vehicle only
    B: On the rear of the vehicle only
    C: On both the front and the rear of the vehicle
    D: Inside the rear window
  answer: B
  explanation: In Nunavut, most motor vehicles are only required to display one license
    plate, which must be attached to the rear of the vehicle.
- id: 63
  category: driver_responsibility
  question: In Nunavut, how many demerit points are assigned to a driver's record
    for the offense of 'Failing to remain at the scene of an accident'?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 10 points
  answer: C
  explanation: Failing to remain at the scene of an accident is a serious offense
    and results in 7 demerit points being added to a driver's record in Nunavut.
- id: 64
  category: driver_responsibility
  question: When you sell a vehicle in Nunavut, what must you do with the license
    plates?
  choices:
    A: Leave them on the vehicle for the new owner.
    B: Remove them and keep them for your own use on another vehicle (after proper
      transfer).
    C: Give them to the new owner to return to the Registrar.
    D: Destroy them immediately.
  answer: B
  explanation: License plates in Nunavut are issued to the owner, not the vehicle.
    When a vehicle is sold, the seller must remove the plates.
- id: 65
  category: driver_responsibility
  question: In Nunavut, how is the expiry date for a private vehicle's registration
    determined?
  choices:
    A: It expires on the owner's birthday.
    B: It expires one year from the date of purchase.
    C: It expires on December 31st of every year.
    D: It expires on the last day of a specific month assigned based on the first
      letter of the owner's surname.
  answer: D
  explanation: Nunavut uses a staggered registration system where the expiry month
    is determined by the first letter of the owner's last name.
- id: 66
  category: driver_responsibility
  question: Who is legally responsible for ensuring that a passenger under the age
    of 16 is properly restrained by a seatbelt or child safety seat in Nunavut?
  choices:
    A: The passenger.
    B: The passenger's parents, even if they are not in the vehicle.
    C: The driver of the vehicle.
    D: The owner of the vehicle.
  answer: C
  explanation: The driver is responsible for ensuring all passengers under the age
    of 16 are properly secured in the vehicle.
- id: 67
  category: driver_responsibility
  question: What is the 'Financial Responsibility Card' commonly referred to as in
    Nunavut?
  choices:
    A: The Green Slip.
    B: The Pink Card.
    C: The Blue Form.
    D: The Gold Shield.
  answer: B
  explanation: The 'Pink Card' is the standard proof of insurance document that drivers
    must carry in their vehicle at all times.
- id: 68
  category: driver_responsibility
  question: If you are involved in a reportable motor vehicle accident in Nunavut,
    how soon must you report it to the police?
  choices:
    A: Within 24 hours.
    B: Within 48 hours.
    C: Immediately.
    D: Within 7 days.
  answer: C
  explanation: The Nunavut Motor Vehicles Act requires drivers to report collisions
    involving injury or significant property damage to the RCMP immediately.
- id: 69
  category: driver_responsibility
  question: Operating a motor vehicle in Nunavut without valid insurance can result
    in which of the following penalties?
  choices:
    A: A fine only.
    B: Vehicle impoundment only.
    C: A fine, vehicle impoundment, and potential license suspension.
    D: A verbal warning for the first offense.
  answer: C
  explanation: Driving without insurance is a serious offense in Nunavut that carries
    heavy fines, the possibility of vehicle impoundment, and license sanctions.
- id: 70
  category: driver_responsibility
  question: If you purchase a vehicle from a private seller, how many days do you
    have to register the vehicle in your name with the Nunavut Motor Vehicles Division?
  choices:
    A: 24 hours.
    B: 7 days.
    C: 14 days.
    D: 30 days.
  answer: B
  explanation: When a vehicle is transferred, the new owner must register the vehicle
    within 7 days of the date of purchase.
- id: 71
  category: driver_responsibility
  question: A person visiting Nunavut may operate a vehicle with valid out-of-territory
    license plates for a maximum of how many days?
  choices:
    A: 30 days.
    B: 60 days.
    C: 90 days.
    D: 180 days.
  answer: C
  explanation: Visitors are permitted to use their out-of-territory vehicle registration
    and plates for up to 90 days before they must register the vehicle in Nunavut.
- id: 72
  category: driver_responsibility
  question: In Nunavut, if a fully licensed driver is found to have a Blood Alcohol
    Concentration (BAC) between 0.05 and 0.08, what is the immediate administrative
    penalty for a first offense?
  choices:
    A: A 24-hour roadside license suspension.
    '|B': A 90-day license suspension.
    C: Permanent revocation of the license.
    D: There is no penalty if it is under 0.08.
  answer: A
  explanation: Nunavut enforces a 24-hour roadside suspension for drivers caught in
    the 'warn' range (0.05 to 0.08 BAC).
- id: 73
  category: driver_responsibility
  question: Which of the following documents is NOT required to be produced upon the
    request of a peace officer in Nunavut?
  choices:
    A: A valid driver's license.
    B: The vehicle's original bill of sale.
    C: A valid motor vehicle registration.
    D: A valid liability insurance card (Pink Card).
  answer: B
  explanation: Drivers must carry and produce their license, registration, and proof
    of insurance. The bill of sale is not required to be kept in the vehicle once
    it is registered.
- id: 74
  category: driver_responsibility
  question: If you fail to stop at the scene of an accident you are involved in (Hit
    and Run), how many demerit points will be added to your Nunavut driving record?
  choices:
    A: 2 points.
    B: 3 points.
    C: 5 points.
    D: 7 points.
  answer: D
  explanation: Failing to remain at the scene of an accident is a major offense in
    Nunavut and results in 7 demerit points.
- id: 75
  category: driver_responsibility
  question: 'In Nunavut, it is illegal to use a hand-held electronic communication
    device while driving. This includes:'
  choices:
    A: Only when the vehicle is moving.
    B: Only when the vehicle is on a highway.
    C: Even when the vehicle is stopped at a red light or stop sign.
    D: Only if you are talking, but texting is allowed.
  answer: C
  explanation: Distracted driving laws apply whenever the driver is in care and control
    of the vehicle, including while stopped in traffic or at signals.
- id: 76
  category: driver_responsibility
  question: 'If your Nunavut driver''s license is suspended, you are:'
  choices:
    A: Allowed to drive only to and from work.
    B: Allowed to drive if a licensed driver is in the passenger seat.
    C: Not allowed to drive any motor vehicle under any circumstances on public roads.
    D: Allowed to drive only during daylight hours.
  answer: C
  explanation: A license suspension means your driving privileges are completely revoked
    for the duration of the suspension; there are no automatic 'work permits' in Nunavut.
- id: 77
  category: safe_driving_rules
  question: In Nunavut, what is the default speed limit within a municipality or settlement
    unless otherwise posted?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: According to the Nunavut Motor Vehicles Act, the statutory speed limit
    within a municipality is 50 km/h unless signs indicate a different limit.
- id: 78
  category: safe_driving_rules
  question: When parking your vehicle near a fire hydrant in Nunavut, what is the
    minimum required distance you must maintain?
  choices:
    A: 1 metre
    B: 3 metres
    C: 5 metres
    D: 10 metres
  answer: B
  explanation: Drivers in Nunavut must not park a vehicle within 3 metres of a fire
    hydrant.
- id: 79
  category: safe_driving_rules
  question: You are approaching a school bus from the front or rear that has its red
    lights flashing and stop arm extended. What must you do?
  choices:
    A: Slow down to 20 km/h and pass carefully
    B: Stop at least 5 metres away and wait until the lights stop flashing
    C: Stop only if children are currently crossing the road
    D: Honk your horn and proceed slowly
  answer: B
  explanation: In Nunavut, you must stop at least 5 metres from a school bus when
    its red lights are flashing, regardless of which direction you are approaching
    from, and stay stopped until the lights are turned off.
- id: 80
  category: safe_driving_rules
  question: In Nunavut, when are you permitted to turn right on a red traffic light?
  choices:
    A: Never; you must wait for a green light
    B: Only if there is a dedicated turn lane
    C: After coming to a complete stop and yielding to pedestrians and other traffic,
      unless a sign prohibits it
    D: Only between the hours of midnight and 6:00 AM
  answer: C
  explanation: Drivers may turn right on a red light after a complete stop and yielding
    to traffic/pedestrians, provided no signs are posted prohibiting the turn.
- id: 81
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when parking near a stop
    sign or a marked crosswalk in Nunavut?
  choices:
    A: 2 metres
    B: 5 metres
    C: 10 metres
    D: 15 metres
  answer: B
  explanation: The Nunavut Motor Vehicles Act prohibits parking within 5 metres of
    a stop sign, yield sign, or a marked crosswalk.
- id: 82
  category: safe_driving_rules
  question: Under Nunavut law, where is a U-turn strictly prohibited even if no sign
    is present?
  choices:
    A: On any gravel road
    B: On a curve or near the crest of a hill where visibility is less than 150 metres
    C: In a residential driveway
    D: At any intersection with a traffic light
  answer: B
  explanation: U-turns are prohibited on curves or hills where the driver cannot be
    seen by other drivers approaching from either direction within 150 metres.
- id: 83
  category: safe_driving_rules
  question: When two vehicles arrive at an uncontrolled intersection (no signs or
    signals) at approximately the same time, who has the right-of-way?
  choices:
    A: The vehicle on the left must yield to the vehicle on the right
    B: The vehicle on the right must yield to the vehicle on the left
    C: The vehicle traveling at the higher speed has the right-of-way
    D: The larger vehicle always has the right-of-way
  answer: A
  explanation: At an uncontrolled intersection, the driver of the vehicle on the left
    must yield the right-of-way to the vehicle on the right.
- id: 84
  category: safe_driving_rules
  question: What is the recommended following distance behind another vehicle under
    normal driving conditions in Nunavut?
  choices:
    A: One car length
    B: Two seconds
    C: Five seconds
    D: 10 metres
  answer: B
  explanation: The 'two-second rule' is the standard recommended minimum following
    distance for normal conditions; this should be increased in poor weather or on
    gravel roads common in Nunavut.
- id: 85
  category: safe_driving_rules
  question: Before making a turn or changing lanes, how far in advance should you
    signal your intention?
  choices:
    A: At least 5 metres before the turn
    B: At least 30 metres before the turn
    C: Only when you see another car behind you
    D: Exactly as you begin to turn the steering wheel
  answer: B
  explanation: Drivers should signal at least 30 metres in advance of a turn or lane
    change to give other road users sufficient warning.
- id: 86
  category: safe_driving_rules
  question: In Nunavut, when is it legal to pass another vehicle on the right side?
  choices:
    A: When the vehicle ahead is turning left and there is a clear paved shoulder
      or lane
    B: Whenever you are in a hurry and the left lane is blocked
    C: Only on one-way streets with three or more lanes
    D: It is never legal to pass on the right
  answer: A
  explanation: Passing on the right is permitted if the vehicle being overtaken is
    making or signaling a left turn and there is available space on the roadway to
    do so safely.
- id: 87
  category: safe_driving_rules
  question: When entering a public roadway from a private driveway or an alley, what
    must a driver do?
  choices:
    A: Honk and proceed
    B: Stop before the sidewalk and yield to all pedestrians and vehicles
    C: Speed up to merge with traffic quickly
    D: Yield only to vehicles coming from the left
  answer: B
  explanation: Drivers must come to a full stop before crossing a sidewalk or entering
    the road from a driveway and must yield to all approaching traffic and pedestrians.
- id: 88
  category: safe_driving_rules
  question: According to safe driving practices in Nunavut's winter conditions, what
    must you do before operating your vehicle?
  choices:
    A: Clear snow and ice from only the driver's side of the windshield
    B: Clear snow and ice from all windows, mirrors, and lights
    C: Wait for the engine to reach full operating temperature for 20 minutes
    D: Deflate the tires slightly for better traction
  answer: B
  explanation: For safety and visibility, Nunavut law and safe driving practices require
    that all windows, mirrors, and lights be clear of snow and ice before driving.
- id: 89
  category: safe_driving_rules
  question: In an urban area of Nunavut, how far in advance should you signal before
    making a turn?
  choices:
    A: 15 meters
    B: 30 meters
    C: 50 meters
    D: 100 meters
  answer: B
  explanation: In urban areas, you should signal at least 30 meters before you intend
    to turn to give other drivers sufficient warning.
- id: 90
  category: safe_driving_rules
  question: In Nunavut, it is illegal to park within how many meters of a stop sign
    or yield sign?
  choices:
    A: 2 meters
    B: 5 meters
    C: 8 meters
    D: 10 meters
  answer: B
  explanation: Parking is prohibited within 5 meters of a stop sign, yield sign, or
    a marked crosswalk.
- id: 91
  category: safe_driving_rules
  question: Under Nunavut law, who is responsible for ensuring that a passenger under
    the age of 16 is wearing a seatbelt?
  choices:
    A: The passenger
    B: The passenger's parents (even if not in the car)
    C: The driver
    D: The owner of the vehicle
  answer: C
  explanation: The driver of the vehicle is legally responsible for ensuring all passengers
    under the age of 16 are properly buckled up.
- id: 92
  category: safe_driving_rules
  question: 'You are prohibited from making a U-turn in Nunavut if you cannot be seen
    by other drivers approaching from either direction within a distance of:'
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: U-turns are prohibited on curves or near the crest of a hill where
    the driver cannot be seen by other traffic within 150 meters.
- id: 93
  category: safe_driving_rules
  question: When parking a vehicle uphill on a street with a curb, how should you
    position your front wheels?
  choices:
    A: Turned toward the curb
    B: Turned away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    (to the left) so that if the vehicle rolls, the back of the tire will hit the
    curb and stop.
- id: 94
  category: safe_driving_rules
  question: When driving in heavy fog or snow at night, which headlight setting should
    you use to maintain the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights
  answer: B
  explanation: Low beams should be used in fog or snow because high beams reflect
    off the moisture/flakes, causing glare and reducing visibility.
- id: 95
  category: defensive_driving
  question: When driving on snow-covered or icy roads in Nunavut, how should you adjust
    your following distance?
  choices:
    A: Maintain the standard 2-second rule
    B: Decrease it to 1 second to stay in the tracks of the lead vehicle
    C: Increase it to at least 4 to 6 seconds
    D: Increase it to exactly 15 seconds
  answer: C
  explanation: Adverse conditions like ice and snow significantly increase stopping
    distances. Drivers in Nunavut are advised to increase their following distance
    to at least 4-6 seconds to ensure safety.
- id: 96
  category: defensive_driving
  question: To maintain proper situational awareness, how far ahead should a driver
    scan the road in a residential area in Nunavut?
  choices:
    A: 5 seconds
    B: 12 to 15 seconds
    C: 25 to 30 seconds
    D: Only as far as the vehicle directly in front
  answer: B
  explanation: Defensive driving manuals for Nunavut recommend scanning 12 to 15 seconds
    ahead of your vehicle to identify potential hazards before they become immediate
    problems.
- id: 97
  category: defensive_driving
  question: In Nunavut, you must dim your high beam headlights when you are within
    what distance of an oncoming vehicle?
  choices:
    A: 100 meters
    B: 150 meters
    C: 300 meters
    D: 500 meters
  answer: C
  explanation: According to Nunavut traffic regulations, you must switch to low beams
    when an oncoming vehicle is within 300 meters to avoid blinding the other driver.
- id: 98
  category: defensive_driving
  question: When following another vehicle at night in Nunavut, at what distance must
    you dim your high beam headlights?
  choices:
    A: 50 meters
    B: 150 meters
    C: 200 meters
    D: 300 meters
  answer: B
  explanation: When following another vehicle from behind at night, you must dim your
    high beams when you are within 150 meters of that vehicle.
- id: 99
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a rare patch of standing water
    in Nunavut, what is the correct defensive action?
  choices:
    A: Brake hard to stop the sliding
    B: Accelerate to regain traction
    C: Ease off the accelerator and steer in the direction you want to go
    D: Turn the steering wheel sharply to the left
  answer: C
  explanation: If hydroplaning occurs, you should not brake or accelerate. Instead,
    ease off the gas and keep the steering wheel straight or steer gently in the desired
    direction until traction is regained.
- id: 100
  category: defensive_driving
  question: When driving a vehicle equipped with Anti-lock Braking System (ABS) on
    an icy Nunavut road, how should you apply the brakes in an emergency?
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, continuous pressure to the brake pedal
    C: Lightly tap the brakes once
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. The system will automatically
    'pump' the brakes much faster than a human can to prevent wheel lock-up.
- id: 101
  category: defensive_driving
  question: In the event of a total 'whiteout' blizzard while driving in Nunavut,
    what is the safest course of action?
  choices:
    A: Speed up to get to your destination faster
    B: Stop in the middle of the road and turn off all lights
    C: Pull as far off the road as possible, turn on hazard lights, and stay with
      the vehicle
    D: Exit the vehicle and walk toward the nearest light source
  answer: C
  explanation: In whiteout conditions, visibility is zero. The safest action is to
    pull off the road, use hazard lights to remain visible to others, and stay inside
    the vehicle for warmth and protection until conditions improve.
- id: 102
  category: defensive_driving
  question: If you see a caribou or other large animal on or near a road in Nunavut,
    what should you do?
  choices:
    A: Honk your horn continuously to scare it away
    B: Flash your high beams repeatedly
    C: Slow down, stay alert, and be prepared to stop as animals often travel in groups
    D: Speed up to pass the animal before it moves onto the road
  answer: C
  explanation: Wildlife is common in Nunavut. If you see one animal, there are likely
    others nearby. Slowing down and being prepared to stop is the safest defensive
    driving practice.
- id: 103
  category: defensive_driving
  question: In Nunavut, what is the penalty for a first-time conviction of using a
    hand-held electronic device while driving (distracted driving)?
  choices:
    A: A $100 fine and 0 demerit points
    B: A $575 fine and 3 demerit points
    C: A $1,000 fine and 6 demerit points
    D: Immediate permanent license revocation
  answer: B
  explanation: Under Nunavut's Traffic Safety Act, distracted driving carries a significant
    fine (currently $575) and 3 demerit points to discourage the behavior.
- id: 104
  category: defensive_driving
  question: When approaching an emergency vehicle stopped on the side of a Nunavut
    road with its lights flashing, what must you do?
  choices:
    A: Maintain your speed but move to the left lane
    B: Slow down to 30 km/h (or the posted limit if lower) and pass with caution
    C: Stop completely until the emergency vehicle leaves
    D: Speed up to clear the area quickly
  answer: B
  explanation: Nunavut's 'Move Over' laws require drivers to slow down to 30 km/h
    when passing emergency vehicles with flashing lights stopped on the side of the
    road.
- id: 105
  category: defensive_driving
  question: How does extreme cold in Nunavut affect tire pressure, and how does this
    impact defensive driving?
  choices:
    A: Cold increases tire pressure, making tires more likely to blow out
    B: Cold decreases tire pressure, which can lead to poor handling and reduced traction
    C: Cold has no effect on tire pressure
    D: Cold makes tires softer, providing better grip on ice
  answer: B
  explanation: Tire pressure drops in cold weather. Under-inflated tires reduce the
    vehicle's handling capabilities and traction, making defensive maneuvers more
    difficult.
- id: 106
  category: defensive_driving
  question: In Nunavut, what is the demerit point penalty for failing to wear a seatbelt?
  choices:
    A: 1 demerit point
    B: 2 demerit points
    C: 3 demerit points
    D: 5 demerit points
  answer: B
  explanation: Failing to wear a seatbelt in Nunavut results in a fine and the assessment
    of 2 demerit points against your driving record.
- id: 107
  category: defensive_driving
  question: What is 'Black Ice' and why is it a major defensive driving concern in
    Nunavut?
  choices:
    A: Ice that has been covered by dirt and gravel
    B: A thick layer of visible white snow
    C: A thin, transparent layer of ice that looks like a wet road
    D: Ice that only forms during the night
  answer: C
  explanation: Black ice is a thin, transparent coating of ice on the road surface.
    Because it is transparent, the black asphalt shows through, making it look like
    a harmless wet patch, which often leads to unexpected skidding.
- id: 108
  category: defensive_driving
  question: How far ahead should a driver scan the road for potential hazards when
    driving in a community or town in Nunavut?
  choices:
    A: 2 to 5 seconds
    B: 5 to 8 seconds
    C: 12 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Defensive driving principles in Nunavut require scanning 12 to 15 seconds
    ahead to identify hazards before they become immediate problems.
- id: 109
  category: defensive_driving
  question: 'In Nunavut, during winter conditions or when roads are icy, the recommended
    following distance should be increased to at least:'
  choices:
    A: 3 seconds
    B: 4 seconds
    C: 5 seconds
    D: 8 seconds
  answer: B
  explanation: Because stopping distances increase significantly on ice and snow,
    the standard 2-second rule should be doubled to at least 4 seconds in winter conditions.
- id: 110
  category: defensive_driving
  question: If you experience a 'whiteout' while driving in Nunavut due to blowing
    snow, what is the safest defensive driving action?
  choices:
    A: Speed up to get through the patch quickly
    B: Turn on high beam headlights to see further
    C: Reduce speed, use low beams, and look for a safe place to pull off the road
    D: Stop immediately in the middle of the driving lane
  answer: C
  explanation: In whiteout conditions, visibility is near zero. You should slow down,
    use low beams (high beams reflect off the snow), and pull completely off the road
    if it is safe to do so.
- id: 111
  category: defensive_driving
  question: 'If your vehicle begins to hydroplane on a rare patch of standing water,
    you should:'
  choices:
    A: Brake hard to stop the sliding
    B: Turn the steering wheel sharply to the left
    C: Ease off the accelerator and steer in the direction you want to go
    D: Shift the vehicle into neutral immediately
  answer: C
  explanation: To recover from hydroplaning, you should take your foot off the gas
    to slow down naturally and maintain a firm grip on the steering wheel, steering
    straight or in the desired direction.
- id: 112
  category: defensive_driving
  question: 'When encountering wildlife such as caribou or muskox on or near a Nunavut
    road, a defensive driver should:'
  choices:
    A: Honk the horn repeatedly to scare them away
    B: Flash high beams to blind the animal
    C: Slow down or stop, and wait for the animal to pass
    D: Speed up to pass them before they move onto the road
  answer: C
  explanation: Wildlife in Nunavut can be unpredictable. Honking may startle them
    into the path of the car. The safest action is to slow down or stop and allow
    them to clear the area.
- id: 113
  category: defensive_driving
  question: In Nunavut, failing to wear a seatbelt or ensuring a passenger under 16
    is buckled results in how many demerit points?
  choices:
    A: 1 demerit point
    B: 2 demerit points
    C: 3 demerit points
    D: 4 demerit points
  answer: B
  explanation: Under the Nunavut demerit point system, a conviction for failing to
