- id: 226
  category: signs_and_signals
  question: When approaching a steady yellow traffic light in Nunavut, what must a
    driver do?
  choices:
    A: Speed up to clear the intersection before it turns red
    B: Stop before entering the intersection unless it is unsafe to do so
    C: Stop immediately, even if in the middle of the intersection
    D: Continue through the intersection at the same speed
  answer: B
  explanation: A steady yellow light means the signal is about to turn red. Drivers
    must stop before the intersection unless they are already so close that stopping
    would be unsafe.
