  question: What is the meaning of a flashing yellow light at an intersection?
  choices:
    A: Stop and wait for a green light
    B: Speed up to clear the area
    C: Proceed with caution after slowing down
    D: Yield to all traffic coming from the right only
  answer: C
  explanation: A flashing yellow light is a warning to slow down and proceed through
