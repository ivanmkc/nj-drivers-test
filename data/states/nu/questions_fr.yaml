questions:
- id: 1
  category: license_system
  question: Quel est l'âge minimum requis pour demander un permis d'apprenti conducteur
    de classe 7 au Nunavut ?
  choices:
    A: 14 ans
    B: 15 ans
    C: 16 ans
    D: 18 ans
  answer: B
  explanation: Au Nunavut, une personne doit être âgée d'au moins 15 ans pour demander
    un permis d'apprenti conducteur de classe 7.
- id: 2
  category: license_system
  question: Un apprenti conducteur de classe 7 au Nunavut doit être accompagné d'un
    superviseur qui détient un permis de classe 5 valide (ou supérieur) depuis au
    moins combien d'années ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: B
  explanation: Le conducteur superviseur d'un apprenti de classe 7 doit détenir un
    permis de classe 5 valide depuis au moins deux ans.
- id: 3
  category: license_system
  question: Quel est le taux d'alcoolémie (BAC) autorisé pour un conducteur participant
    au programme de permis de conduire progressif (GDL) au Nunavut ?
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Les conducteurs du programme GDL du Nunavut (classe 7 et classe 5P)
    doivent maintenir un taux d'alcoolémie de zéro (0,00 %) lorsqu'ils conduisent
    un véhicule.
- id: 4
  category: license_system
  question: Pendant combien de temps un conducteur doit-il détenir un permis d'apprenti
    conducteur de classe 7 avant de pouvoir passer l'examen de conduite pour un permis
    de classe 5P (probatoire) ?
  choices:
    A: 6 mois
    B: 9 mois
    C: 12 mois
    D: 24 mois
  answer: C
  explanation: Un conducteur doit détenir un permis d'apprenti conducteur de classe
    7 pendant au moins 12 mois avant de pouvoir se présenter à l'examen de conduite
    pour un permis probatoire.
- id: 5
  category: license_system
  question: Laquelle des options suivantes est une restriction concernant les passagers
    pour un apprenti conducteur de classe 7 au Nunavut ?
  choices:
    A: Aucun passager n'est autorisé dans le véhicule en tout temps.
    B: Un seul passager est autorisé dans le véhicule.
    C: Le seul passager autorisé sur le siège avant est le conducteur superviseur.
    D: Les passagers ne sont autorisés que pendant les heures de clarté.
  answer: C
  explanation: Selon les règles du programme GDL du Nunavut, le seul passager autorisé
    sur le siège avant avec un conducteur de classe 7 est le conducteur superviseur
    qualifié.
- id: 6
  category: license_system
  question: Dans le cadre du programme GDL du Nunavut, quelles sont les heures de
    restriction pendant lesquelles un apprenti de classe 7 n'est PAS autorisé à conduire
    ?
  choices:
    A: De 22 h 00 à 5 h 00
    B: De 23 h 00 à 7 h 00
    C: De minuit à 6 h 00
    D: Il n'y a pas de restrictions horaires pour les conducteurs de classe 7.
  answer: C
  explanation: Les apprentis conducteurs de classe 7 au Nunavut ont l'interdiction
    de conduire entre minuit et 6 h 00.
- id: 7
  category: license_system
  question: Quelle est la durée de la période probatoire (classe 5P) au Nunavut avant
    qu'un conducteur puisse obtenir un permis complet de classe 5 ?
  choices:
    A: 6 mois
    B: 12 mois
    C: 18 mois
    D: 24 mois
  answer: B
  explanation: Les conducteurs doivent rester à l'étape de la classe 5P (probatoire)
    pendant au moins 12 mois sans aucune suspension avant d'obtenir un permis complet
    de classe 5.
- id: 8
  category: license_system
  question: Au Nunavut, à partir de quel total de points d'inaptitude un conducteur
    titulaire d'un permis complet recevra-t-il un avis d'entrevue ou une lettre d'avertissement
    ?
  choices:
    A: 3 à 5 points
    B: 6 à 8 points
    C: 9 à 14 points
    D: 15 points ou plus
  answer: B
  explanation: Au Nunavut, lorsqu'un conducteur accumule de 6 à 8 points d'inaptitude,
    il reçoit généralement une lettre d'avertissement concernant son dossier de conduite.
- id: 9
  category: license_system
  question: Le permis de conduire d'un conducteur au Nunavut est suspendu automatiquement
    si celui-ci accumule combien de points d'inaptitude sur une période de 2 ans ?
  choices:
    A: 8 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: D
  explanation: Un permis de conduire sera suspendu au Nunavut si le conducteur accumule
    15 points d'inaptitude ou plus sur une période de 24 mois.
- id: 10
  category: license_system
  question: Si vous déménagez dans une nouvelle résidence au Nunavut, de combien de
    jours disposez-vous pour informer le registraire des véhicules automobiles de
    votre changement d'adresse ?
  choices:
    A: 7 jours
    B: 15 jours
    C: 30 jours
    D: 60 jours
  answer: B
  explanation: Les résidents du Nunavut sont tenus par la loi d'informer le registraire
    d'un changement d'adresse dans les 15 jours.
- id: 11
  category: license_system
  question: Quelle classe de permis est requise au Nunavut pour conduire une motocyclette
    ?
  choices:
    A: Classe 4
    B: Classe 5
    C: Classe 6
    D: Classe 8
  answer: C
  explanation: La classe 6 est la classe de permis spécifique requise pour conduire
    une motocyclette au Nunavut.
- id: 12
  category: license_system
  question: Pour demander un permis commercial de classe 1, 2, 3 ou 4 au Nunavut,
    quel document supplémentaire est obligatoire ?
  choices:
    A: Un diplôme d'études secondaires
    B: Un rapport d'examen médical
    C: Une lettre d'intention d'un employeur
    D: Une vérification de casier judiciaire
  answer: B
  explanation: Les candidats aux classes de permis commerciaux (1, 2, 3 et 4) doivent
    soumettre un rapport d'examen médical pour s'assurer qu'ils respectent les normes
    physiques pour la conduite de véhicules lourds ou commerciaux.
- id: 13
  category: license_system
  question: Lequel des véhicules suivants peut être conduit avec un permis de classe
    5 standard au Nunavut ?
  choices:
    A: Un autobus d'une capacité de 40 places
    B: Un véhicule à deux essieux autre qu'une motocyclette ou un taxi
    C: Une ambulance
    D: Un camion semi-remorque
  answer: B
  explanation: Un permis de classe 5 permet de conduire un véhicule à deux essieux,
    comme une voiture, une fourgonnette ou un camion léger, mais ne permet pas de
    conduire des motocyclettes, des taxis, des ambulances ou des véhicules commerciaux
    de grande taille.
- id: 14
  category: license_system
  question: Si un conducteur du programme de permis de conduire progressif (GDL) au
    Nunavut enfreint la condition de tolérance zéro alcool, quelle est la sanction
    administrative immédiate ?
  choices:
    A: Un avertissement verbal
    B: Une suspension de 24 heures
    C: Une suspension de permis de 30 jours
    D: Une révocation permanente du permis
  answer: C
  explanation: En vertu de la Loi sur la sécurité routière du Nunavut, les conducteurs
    du programme GDL qui consomment une quelconque quantité d'alcool sont passibles
    d'une suspension immédiate de permis de 30 jours.
- id: 15
  category: license_system
  question: Un permis de conduire standard du Nunavut est généralement valide pendant
    combien d'années avant de devoir être renouvelé ?
  choices:
    A: 2 ans
    B: 3 ans
    C: 5 ans
    D: 10 ans
  answer: C
  explanation: Au Nunavut, un permis de conduire est généralement valide pour une
    période de cinq ans et expire le jour de l'anniversaire du conducteur.
- id: 16
  category: license_system
  question: Si vous devenez résident du Nunavut, pendant combien de temps êtes-vous
    autorisé à conduire avec un permis valide provenant de l'extérieur du territoire
    avant de devoir obtenir un permis de conduire du Nunavut ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 180 jours
  answer: C
  explanation: Les nouveaux résidents du Nunavut qui détiennent un permis de conduire
    valide d'une autre province ou d'un autre territoire canadien doivent l'échanger
    contre un permis du Nunavut dans les 90 jours.
- id: 17
  category: license_system
  question: Lorsque vous conduisez une motocyclette avec un permis d'apprenti conducteur
    de classe 6 au Nunavut, combien de passagers êtes-vous autorisé à transporter
    ?
  choices:
    A: Zéro passager
    B: Un passager, à condition qu'il détienne un permis de classe 6
    C: Un passager, à condition qu'il ait plus de 18 ans
    D: Deux passagers si la motocyclette possède un side-car
  answer: A
  explanation: Un conducteur titulaire d'un permis d'apprenti de classe 6 a l'interdiction
    formelle de transporter des passagers sur la motocyclette.
- id: 18
  category: license_system
  question: Quel est le nombre maximum de passagers autorisés dans un véhicule conduit
    par un conducteur de classe 5P (probatoire) au Nunavut ?
  choices:
    A: Un passager
    B: Deux passagers
    C: Uniquement les membres de la famille immédiate
    D: Autant de passagers qu'il y a de ceintures de sécurité fonctionnelles
  answer: D
  explanation: Dans le cadre du programme GDL du Nunavut, les conducteurs de classe
    5P ne peuvent transporter qu'un nombre de passagers correspondant au nombre de
    ceintures de sécurité fonctionnelles dans le véhicule.
- id: 19
  category: license_system
  question: Pour les conducteurs titulaires d'un permis de classe 1, 2, 3 ou 4 âgés
    de moins de 45 ans, à quelle fréquence un rapport d'examen médical doit-il être
    soumis au registraire ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 5 ans
    D: Uniquement lors de la demande initiale
  answer: C
  explanation: Les conducteurs commerciaux du Nunavut de moins de 45 ans doivent soumettre
    un rapport médical tous les 5 ans. La fréquence passe à tous les 2 ans après 45
    ans, et chaque année après 65 ans.
- id: 20
  category: license_system
  question: Au Nunavut, quel code alphabétique est ajouté au permis de conduire pour
    indiquer que le conducteur est autorisé à conduire des véhicules équipés de freins
    à air ?
  choices:
    A: Code A
    B: Code Q
    C: Code Z
    D: Code S
  answer: B
  explanation: La mention « Q » sur un permis de conduire du Nunavut indique que le
    titulaire est qualifié pour conduire des véhicules équipés de freins à air.
- id: 21
  category: license_system
  question: Si votre permis de conduire du Nunavut est expiré depuis plus de deux
    ans, que faut-il faire pour le renouveler ?
  choices:
    A: Payer des frais de renouvellement doubles
    B: Fournir simplement une nouvelle pièce d'identité
    C: Vous devez réussir à nouveau les examens écrit et de conduite
    D: Fournir une lettre de recommandation d'un ancien employeur
  answer: C
  explanation: Si un permis est expiré depuis plus de 24 mois (2 ans), le demandeur
    est traité comme un nouveau conducteur et doit réussir à nouveau tous les examens
    requis.
- id: 22
  category: license_system
  question: Si vous changez de nom légal, dans quel délai devez-vous en informer le
    registraire des véhicules automobiles et demander un permis de remplacement ?
  choices:
    A: 7 jours
    B: 15 jours
    C: 30 jours
    D: 60 jours
  answer: B
  explanation: Selon la Loi sur les véhicules automobiles du Nunavut, tout changement
    de nom ou d'adresse doit être signalé au registraire dans les 15 jours.
- id: 23
  category: license_system
  question: Où le conducteur superviseur doit-il s'asseoir lorsqu'un titulaire de
    permis d'apprenti conducteur de classe 7 conduit un véhicule automobile au Nunavut
    ?
  choices:
    A: N'importe où dans le véhicule
    B: Directement derrière le conducteur
    C: Sur le siège passager avant
    D: Sur le siège offrant la meilleure vue sur les rétroviseurs
  answer: C
  explanation: Le superviseur d'un apprenti de classe 7 doit occuper le siège situé
    immédiatement à côté du conducteur (le siège passager avant).
- id: 24
  category: license_system
  question: Quelle classe de permis est spécifiquement requise au Nunavut pour conduire
    un taxi, une ambulance ou un autobus d'une capacité de 24 passagers ou moins ?
  choices:
    A: Classe 3
    B: Classe 4
    C: Classe 5
    D: Classe 5P
  answer: B
  explanation: Un permis de classe 4 est requis pour les taxis, les ambulances et
    les petits autobus (jusqu'à 24 passagers) au Nunavut.
- id: 25
  category: license_system
  question: Si vous échouez à un examen de conduite au Nunavut, quel est le délai
    d'attente minimal avant de pouvoir tenter l'examen à nouveau ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: C
  explanation: Les conducteurs qui échouent à l'examen de conduite doivent attendre
    un minimum de 14 jours avant de pouvoir passer un autre examen de conduite.
- id: 26
  category: license_system
  question: Pour passer du stade de la classe 5P (probatoire) à un permis complet
    de classe 5, pendant combien de temps un conducteur doit-il rester sans suspension
    ?
  choices:
    A: Toute la période probatoire de 12 mois
    B: Les 6 derniers mois de la période probatoire
    C: 24 mois consécutifs
    D: Il n'y a pas d'exigence d'absence de suspension
  answer: A
  explanation: Pour obtenir un permis complet de classe 5, le conducteur doit terminer
    la période probatoire de 12 mois sans aucune suspension de permis.
- id: 27
  category: license_system
  question: Lors d'une première demande de permis de conduire au Nunavut, combien
    de pièces d'identité sont généralement requises pour prouver votre nom légal,
    votre date de naissance et votre signature ?
  choices:
    A: Une seule pièce d'identité avec photo uniquement
    B: Deux pièces d'identité valides
    C: Trois pièces d'identité
    D: Une confirmation verbale d'un résident
  answer: B
  explanation: Les demandeurs doivent fournir au moins deux pièces d'identité établissant
    leur nom légal, leur date de naissance et leur signature.
- id: 28
  category: driver_testing
  question: Quelle est l'acuité visuelle minimale requise dans le meilleur œil, avec
    ou sans lentilles correctrices, pour réussir le test de vision pour un permis
    de classe 5 au Nunavut ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Selon les normes de délivrance des permis de conduire du Nunavut, un
    demandeur doit avoir une acuité visuelle minimale de 20/40 dans au moins un œil
    pour être admissible à un permis de conduire standard.
- id: 29
  category: driver_testing
  question: Laquelle des conditions suivantes est obligatoire pour le véhicule fourni
    par un candidat à un examen de conduite au Nunavut ?
  choices:
    A: Il doit s'agir d'un véhicule de location
    B: Il doit être équipé d'une transmission manuelle
    C: Il doit posséder un certificat d'immatriculation et d'assurance valide
    D: Il doit avoir moins de 5 ans
  answer: C
  explanation: Les candidats doivent fournir pour l'examen un véhicule sûr et en bon
    état de marche, correctement immatriculé et assuré conformément à la Loi sur les
    véhicules automobiles du Nunavut.
- id: 30
  category: driver_testing
  question: 'Au Nunavut, vous devez signaler immédiatement un accident à l''agent
    de police le plus proche si les dommages matériels totaux à tous les véhicules
    et à la propriété semblent dépasser :'
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: En vertu de la Loi sur les véhicules automobiles du Nunavut, tout accident
    impliquant des blessures, un décès ou des dommages matériels dépassant 2 000 $
    doit être signalé immédiatement à la police.
- id: 31
  category: driver_testing
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    pour défaut de port de la ceinture de sécurité au Nunavut ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Le défaut de port de la ceinture de sécurité ou le fait de ne pas s'assurer
    qu'un passager de moins de 16 ans est correctement attaché entraîne 2 points d'inaptitude
    au Nunavut.
- id: 32
  category: driver_testing
  question: Au Nunavut, combien de points d'inaptitude sont attribués pour une condamnation
    pour conduite distraite (utilisation d'un appareil électronique portatif) ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: La conduite distraite, comme l'utilisation d'un téléphone cellulaire
    pendant la conduite d'un véhicule, entraîne une pénalité de 3 points d'inaptitude
    au Nunavut.
- id: 33
  category: driver_testing
  question: Lorsque vous approchez d'un autobus scolaire arrêté avec ses feux rouges
    clignotants et son bras d'arrêt déployé, à quelle distance devez-vous arrêter
    votre véhicule ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 20 mètres
    D: 50 mètres
  answer: C
  explanation: Les conducteurs doivent s'arrêter à au moins 20 mètres d'un autobus
    scolaire lorsque ses feux rouges clignotent et que le bras d'arrêt est sorti,
    qu'ils s'en approchent par l'avant ou par l'arrière.
- id: 34
  category: driver_testing
  question: Sauf indication contraire, quelle est la limite de vitesse maximale dans
    une zone scolaire au Nunavut lorsque des enfants sont présents ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: La limite de vitesse standard dans les zones scolaires des collectivités
    du Nunavut est de 30 km/h, à moins que des panneaux n'indiquent une limite différente.
- id: 35
  category: driver_testing
  question: Au Nunavut, entre quelles dates les conducteurs sont-ils autorisés à utiliser
    des pneus à crampons sur leurs véhicules ?
  choices:
    A: Du 1er septembre au 30 avril
    B: Du 1er octobre au 31 mai
    C: Du 1er novembre au 31 mars
    D: Toute l'année
  answer: B
  explanation: Pour protéger la surface des routes tout en assurant la sécurité hivernale,
    les pneus à crampons sont autorisés au Nunavut du 1er octobre au 31 mai.
- id: 36
  category: driver_testing
  question: Quel est le montant minimum de la couverture d'assurance responsabilité
    civile envers les tiers requis pour tous les véhicules à moteur au Nunavut ?
  choices:
    A: 50 000 $
    B: 100 000 $
    C: 200 000 $
    D: 500 000 $
  answer: C
  explanation: La Loi sur les véhicules automobiles du Nunavut exige que tous les
    propriétaires de véhicules détiennent une assurance responsabilité civile minimale
    de 200 000 $.
- id: 37
  category: driver_testing
  question: Lors d'un examen de conduite au Nunavut, laquelle des actions suivantes
    entraînera un échec immédiat et automatique ?
  choices:
    A: Oublier d'utiliser un clignotant une seule fois
    B: Franchir une ligne jaune continue pour éviter un danger
    C: Nécessiter l'intervention de l'examinateur pour prévenir une collision
    D: Conduire à 2 km/h sous la limite de vitesse
  answer: C
  explanation: Toute action qui oblige l'examinateur à prendre le contrôle du véhicule
    ou à intervenir pour prévenir un accident entraîne un échec automatique à l'examen
    de conduite.
- id: 38
  category: driver_testing
  question: Dans des conditions routières et météorologiques idéales, quelle est la
    distance de suivi minimale recommandée derrière le véhicule qui vous précède ?
  choices:
    A: La longueur d'une voiture
    B: 2 secondes
    C: 4 secondes
    D: 10 mètres
  answer: B
  explanation: La « règle des deux secondes » est la distance de suivi minimale recommandée
    dans des conditions idéales au Nunavut pour permettre un temps de réaction adéquat.
- id: 39
  category: driver_testing
  question: Lorsqu'un véhicule d'urgence (ambulance, camion de pompiers ou voiture
    de police) approche avec sa sirène et ses feux clignotants activés, que devez-vous
    faire ?
  choices:
    A: Accélérer pour libérer le passage
    B: S'arrêter exactement là où vous êtes
    C: Se ranger le plus possible vers la droite et s'arrêter
    D: Suivre le véhicule pour voir où il va
  answer: C
  explanation: Les conducteurs doivent immédiatement se ranger sur le bord droit de
    la chaussée ou sur l'accotement et rester à l'arrêt jusqu'à ce que le véhicule
    d'urgence soit passé.
- id: 40
  category: driver_testing
  question: À une intersection où il n'y a ni feux de circulation ni passages pour
    piétons balisés (un passage pour piétons non marqué), quelle est la responsabilité
    du conducteur envers les piétons ?
  choices:
    A: Le conducteur a la priorité
    B: Le conducteur doit céder le passage aux piétons
    C: Les piétons doivent attendre que la circulation soit dégagée
    D: Le conducteur doit klaxonner pour avertir le piéton
  answer: B
  explanation: Au Nunavut, les piétons ont la priorité aux passages pour piétons balisés
    et non marqués aux intersections.
- id: 41
  category: driver_testing
  question: Pour satisfaire aux exigences de vision pour un permis de conduire de
    classe 5 au Nunavut, un candidat doit avoir une acuité visuelle d'au moins combien
    dans son meilleur œil ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Selon les normes de délivrance des permis de conduire du Nunavut, un
    candidat doit avoir une acuité visuelle minimale de 20/40 dans au moins un œil,
    avec ou sans lentilles correctrices.
- id: 42
  category: driver_testing
  question: Au Nunavut, un accident de la route doit être signalé à la police s'il
    entraîne des blessures, un décès ou des dommages matériels dépassant quel montant
    total ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: En vertu de la Loi sur les véhicules automobiles du Nunavut, tout accident
    impliquant des blessures corporelles, un décès ou des dommages matériels combinés
    de 2 000 $ ou plus doit être signalé immédiatement à la police.
- id: 43
  category: driver_testing
  question: Lorsque vous conduisez de nuit, vous devez passer de vos feux de route
    aux feux de croisement lorsque vous vous trouvez à moins de combien de mètres
    d'un véhicule venant en sens inverse ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: La réglementation du Nunavut exige que les conducteurs passent aux
    feux de croisement lorsqu'un véhicule venant en sens inverse se trouve à moins
    de 150 mètres afin d'éviter d'éblouir l'autre conducteur.
- id: 44
  category: driver_testing
  question: Au Nunavut, lorsque vous suivez un autre véhicule, quelle est la distance
    de suivi minimale recommandée dans des conditions routières idéales ?
  choices:
    A: 1 longueur de voiture
    B: 2 secondes
    C: 4 secondes
    D: 10 secondes
  answer: B
  explanation: La « règle des deux secondes » est la distance de suivi minimale recommandée
    au Nunavut pour des conditions idéales ; celle-ci doit être augmentée considérablement
    dans des conditions de glace ou de neige.
- id: 45
  category: driver_testing
  question: Il est interdit de stationner votre véhicule à moins de combien de mètres
    d'une borne fontaine au Nunavut ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: C
  explanation: Selon les règles de circulation du Nunavut, vous ne devez pas stationner
    un véhicule à moins de 5 mètres d'une borne fontaine.
- id: 46
  category: driver_testing
  question: Lorsque vous stationnez un véhicule sur une chaussée, vous ne devez pas
    vous garer à moins de combien de mètres d'un panneau d'arrêt ou d'un panneau de
    cédez le passage ?
  choices:
    A: 3 mètres
    B: 6 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Au Nunavut, il est illégal de stationner un véhicule à moins de 6 mètres
    du côté de l'approche d'un panneau d'arrêt ou d'un panneau de cédez le passage.
- id: 47
  category: driver_testing
  question: 'Au Nunavut, vous devez utiliser vos phares chaque fois que les conditions
    atmosphériques (brouillard, neige, pluie) rendent impossible une vision claire
    à une distance de :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Les phares doivent être allumés au Nunavut si la visibilité est réduite
    à 150 mètres ou moins en raison des conditions météorologiques ou de luminosité.
- id: 48
  category: driver_testing
  question: Lorsque vous approchez d'une intersection où les feux de circulation ne
    fonctionnent pas, comment devez-vous procéder ?
  choices:
    A: Céder le passage au véhicule à gauche
    B: Traiter l'intersection comme un arrêt obligatoire dans toutes les directions
    C: Maintenir votre vitesse si vous êtes sur une route principale
    D: Attendre l'arrivée d'un agent de police
  answer: B
  explanation: Si les feux de circulation sont éteints ou fonctionnent mal au Nunavut,
    les conducteurs doivent traiter l'intersection comme un arrêt multidirectionnel.
- id: 49
  category: driver_testing
  question: 'Les demi-tours sont interdits au Nunavut dans un virage ou près du sommet
    d''une côte où le conducteur ne peut pas être vu par les autres conducteurs arrivant
    de l''une ou l''autre direction à moins de :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 250 mètres
  answer: C
  explanation: Les demi-tours sont illégaux sur les collines ou dans les virages lorsqu'il
    n'y a pas au moins 150 mètres de visibilité claire dans les deux directions.
- id: 50
  category: driver_testing
  question: Pour un conducteur titulaire d'un permis complet (non visé par le GDL)
    au Nunavut, quelle est la limite légale du taux d'alcoolémie (BAC) qui constitue
    une infraction criminelle ?
  choices:
    A: 0,02
    B: 0,05
    C: 0,08
    D: 0,10
  answer: C
  explanation: Bien que les sanctions administratives puissent commencer à des niveaux
    inférieurs (0,05), la limite du Code criminel du Canada pour tous les territoires,
    y compris le Nunavut, est un taux d'alcoolémie (BAC) de 0,08.
- id: 51
  category: driver_responsibility
  question: Au Nunavut, vous devez signaler un accident de la route au détachement
    de la GRC le plus proche si les dommages matériels totaux dépassent quel montant
    ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: Selon la Loi sur les véhicules automobiles du Nunavut, tout accident
    impliquant des blessures, un décès ou des dommages matériels dépassant apparemment
    2 000 $ doit être signalé immédiatement à la police.
- id: 52
  category: driver_responsibility
  question: Lequel des documents suivants un conducteur doit-il avoir sur lui en tout
    temps lorsqu'il conduit un véhicule automobile au Nunavut ?
  choices:
    A: Permis de conduire et certificat de naissance
    B: Permis de conduire, certificat d'immatriculation du véhicule et preuve d'assurance
    C: Certificat d'immatriculation et acte de vente
    D: Permis de conduire et une copie de la Loi sur les véhicules automobiles
  answer: B
  explanation: Les conducteurs au Nunavut sont légalement tenus de présenter un permis
    de conduire valide, le certificat d'immatriculation du véhicule et une preuve
    d'assurance valide à la demande d'un agent de la paix.
- id: 53
  category: driver_responsibility
  question: Lors de la vente d'un véhicule au Nunavut, dans quel délai le vendeur
    doit-il informer le registraire des véhicules automobiles du transfert de propriété
    ?
  choices:
    A: Immédiatement
    B: 10 jours
    C: 15 jours
    D: 30 jours
  answer: B
  explanation: En vertu de la Loi sur les véhicules automobiles, le vendeur d'un véhicule
    doit aviser le registraire dans les 10 jours suivant la vente ou le transfert
    du véhicule.
- id: 54
  category: driver_responsibility
  question: Si vous achetez un véhicule au Nunavut, de combien de jours disposez-vous
    pour demander une nouvelle immatriculation à votre nom ?
  choices:
    A: 10 jours
    B: 14 jours
    C: 21 jours
    D: 30 jours
  answer: A
  explanation: Le nouveau propriétaire d'un véhicule doit demander au registraire
    un transfert d'immatriculation dans les 10 jours suivant l'acquisition du véhicule.
- id: 55
  category: driver_responsibility
  question: Quelle est l'amende maximale pour une première infraction de conduite
    d'un véhicule automobile sans assurance valide au Nunavut ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 500 $
    D: 5 000 $
  answer: C
  explanation: Conduire sans assurance est une infraction grave au Nunavut ; une première
    condamnation peut entraîner une amende allant jusqu'à 2 500 $.
- id: 56
  category: driver_responsibility
  question: Au Nunavut, le conducteur est légalement responsable de s'assurer que
    tous les passagers de moins de quel âge sont correctement attachés par une ceinture
    de sécurité ou un système de retenue pour enfants ?
  choices:
    A: Moins de 12 ans
    B: Moins de 14 ans
    C: Moins de 16 ans
    D: Moins de 18 ans
  answer: C
  explanation: Le conducteur est responsable de s'assurer que tout passager de moins
    de 16 ans porte correctement sa ceinture de sécurité ou est attaché dans un siège
    de sécurité pour enfant approuvé.
- id: 57
  category: driver_responsibility
  question: Si vous entrez en collision avec un véhicule sans surveillance et que
    vous ne parvenez pas à localiser le propriétaire, quelle est votre responsabilité
    légale au Nunavut ?
  choices:
    A: Laisser une note avec votre nom, votre adresse et votre numéro de permis et
      signaler l'accident immédiatement à la police
    B: Attendre sur les lieux pendant au moins deux heures
    C: Ne le signaler que si les dommages semblent dépasser 2 000 $
    D: Laisser une note uniquement s'il y a des dommages visibles à la peinture
  answer: A
  explanation: Si le propriétaire d'un véhicule ou d'un bien endommagé ne peut être
    trouvé, vous devez laisser un avis écrit avec vos coordonnées et signaler immédiatement
    l'accident à la GRC.
- id: 58
  category: driver_responsibility
  question: À quelle fréquence la plupart des véhicules commerciaux au Nunavut doivent-ils
    subir une inspection mécanique de sécurité obligatoire ?
  choices:
    A: Tous les 6 mois
    B: Tous les 12 mois
    C: Tous les 24 mois
    D: Uniquement lors de la vente du véhicule
  answer: B
  explanation: Les véhicules commerciaux et les autobus au Nunavut sont généralement
    tenus de subir une inspection mécanique de sécurité tous les 12 mois pour s'assurer
    qu'ils respectent les normes de sécurité.
- id: 59
  category: driver_responsibility
  question: Qu'advient-il de votre permis de conduire du Nunavut si vous ne payez
    pas un jugement ordonné par le tribunal pour des dommages résultant d'un accident
    de véhicule automobile ?
  choices:
    A: Rien, cela n'affecte que votre cote de crédit
    B: Votre permis sera suspendu jusqu'à ce que le jugement soit réglé
    C: Vous devrez repasser votre examen de conduite
    D: Votre immatriculation est suspendue, mais votre permis reste valide
  answer: B
  explanation: Le registraire peut suspendre le permis de conduire et l'immatriculation
    du véhicule d'une personne si celle-ci ne satisfait pas à un jugement rendu par
    un tribunal pour des dommages causés par un véhicule automobile.
- id: 60
  category: driver_responsibility
  question: 'Au Nunavut, les dates de renouvellement de l''immatriculation des véhicules
    sont généralement déterminées par :'
  choices:
    A: La date de naissance du conducteur
    B: La date d'achat initial du véhicule
    C: La première lettre du nom de famille du propriétaire
    D: Une date fixe au 1er avril pour tout le monde
  answer: C
  explanation: Le Nunavut utilise un système d'immatriculation échelonné où le mois
    d'expiration est déterminé par la première lettre du nom de famille du propriétaire
    (ou du nom de l'entreprise).
- id: 61
  category: driver_responsibility
  question: 'Un agent de la paix au Nunavut peut suspendre immédiatement un permis
    de conduire pour une période de 24 heures sur le bord de la route s''il a des
    motifs raisonnables de croire que le conducteur :'
  choices:
    A: Conduit à plus de 20 km/h au-dessus de la limite
    B: N'a pas payé ses frais d'immatriculation
    C: A les facultés affaiblies par l'alcool ou une drogue
    D: Conduit avec un permis expiré
  answer: C
  explanation: En vertu de la Loi sur les véhicules automobiles, un agent de la paix
    peut suspendre le permis d'un conducteur pendant 24 heures s'il soupçonne que
    la capacité du conducteur à manœuvrer un véhicule est affectée par l'alcool ou
    la drogue.
- id: 62
  category: driver_responsibility
  question: Pour la plupart des véhicules de tourisme privés au Nunavut, où la plaque
    d'immatriculation doit-elle être apposée ?
  choices:
    A: À l'avant du véhicule seulement
    B: À l'arrière du véhicule seulement
    C: À la fois à l'avant et à l'arrière du véhicule
    D: À l'intérieur de la lunette arrière
  answer: B
  explanation: Au Nunavut, la plupart des véhicules à moteur ne sont tenus d'arborer
    qu'une seule plaque d'immatriculation, qui doit être fixée à l'arrière du véhicule.
- id: 63
  category: driver_responsibility
  question: Au Nunavut, combien de points d'inaptitude sont inscrits au dossier d'un
    conducteur pour l'infraction « Défaut de rester sur les lieux d'un accident »
    ?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 10 points
  answer: C
  explanation: Le fait de ne pas rester sur les lieux d'un accident est une infraction
    grave qui entraîne l'ajout de 7 points d'inaptitude au dossier d'un conducteur
    au Nunavut.
- id: 64
  category: driver_responsibility
  question: Lorsque vous vendez un véhicule au Nunavut, que devez-vous faire des plaques
    d'immatriculation ?
  choices:
    A: Les laisser sur le véhicule pour le nouveau propriétaire.
    B: Les retirer et les conserver pour votre propre usage sur un autre véhicule
      (après un transfert approprié).
    C: Les donner au nouveau propriétaire pour qu'il les remette au registraire.
    D: Les détruire immédiatement.
  answer: B
  explanation: Au Nunavut, les plaques d'immatriculation sont délivrées au propriétaire
    et non au véhicule. Lorsqu'un véhicule est vendu, le vendeur doit retirer les
    plaques.
- id: 65
  category: driver_responsibility
  question: Au Nunavut, comment la date d'expiration de l'immatriculation d'un véhicule
    privé est-elle déterminée ?
  choices:
    A: Elle expire le jour de l'anniversaire du propriétaire.
    B: Elle expire un an après la date d'achat.
    C: Elle expire le 31 décembre de chaque année.
    D: Elle expire le dernier jour d'un mois spécifique attribué en fonction de la
      première lettre du nom de famille du propriétaire.
  answer: D
  explanation: Le Nunavut utilise un système d'immatriculation échelonné où le mois
    d'expiration est déterminé par la première lettre du nom de famille du propriétaire.
- id: 66
  category: driver_responsibility
  question: Qui est légalement responsable de s'assurer qu'un passager de moins de
    16 ans est correctement attaché par une ceinture de sécurité ou un siège d'enfant
    au Nunavut ?
  choices:
    A: Le passager.
    B: Les parents du passager, même s'ils ne sont pas dans le véhicule.
    C: Le conducteur du véhicule.
    D: Le propriétaire du véhicule.
  answer: C
  explanation: Le conducteur est responsable de s'assurer que tous les passagers de
    moins de 16 ans sont correctement attachés dans le véhicule.
- id: 67
  category: driver_responsibility
  question: Comment appelle-t-on couramment la « carte de responsabilité financière
    » au Nunavut ?
  choices:
    A: Le feuillet vert.
    B: La carte rose.
    C: Le formulaire bleu.
    D: Le bouclier d'or.
  answer: B
  explanation: La « carte rose » est le document de preuve d'assurance standard que
    les conducteurs doivent avoir en tout temps dans leur véhicule.
- id: 68
  category: driver_responsibility
  question: Si vous êtes impliqué dans un accident de véhicule à moteur devant être
    signalé au Nunavut, dans quel délai devez-vous le signaler à la police ?
  choices:
    A: Dans les 24 heures.
    B: Dans les 48 heures.
    C: Immédiatement.
    D: Dans les 7 jours.
  answer: C
  explanation: La Loi sur les véhicules automobiles du Nunavut exige que les conducteurs
    signalent immédiatement à la GRC les collisions impliquant des blessures ou des
    dommages matériels importants.
- id: 69
  category: driver_responsibility
  question: Le fait de conduire un véhicule à moteur au Nunavut sans assurance valide
    peut entraîner laquelle des sanctions suivantes ?
  choices:
    A: Une amende seulement.
    B: La mise en fourrière du véhicule seulement.
    C: Une amende, la mise en fourrière du véhicule et une suspension potentielle
      du permis.
    D: Un avertissement verbal pour la première infraction.
  answer: C
  explanation: Conduire sans assurance est une infraction grave au Nunavut qui entraîne
    de lourdes amendes, la possibilité de mise en fourrière du véhicule et des sanctions
    relatives au permis.
- id: 70
  category: driver_responsibility
  question: Si vous achetez un véhicule auprès d'un vendeur privé, de combien de jours
    disposez-vous pour immatriculer le véhicule à votre nom auprès de la Division
    des véhicules automobiles du Nunavut ?
  choices:
    A: 24 heures.
    B: 7 jours.
    C: 14 jours.
    D: 30 jours.
  answer: B
  explanation: Lorsqu'un véhicule est transféré, le nouveau propriétaire doit immatriculer
    le véhicule dans les 7 jours suivant la date d'achat.
- id: 71
  category: driver_responsibility
  question: Une personne visitant le Nunavut peut conduire un véhicule muni de plaques
    d'immatriculation valides provenant de l'extérieur du territoire pendant un maximum
    de combien de jours ?
  choices:
    A: 30 jours.
    B: 60 jours.
    C: 90 jours.
    D: 180 jours.
  answer: C
  explanation: Les visiteurs sont autorisés à utiliser l'immatriculation et les plaques
    de leur véhicule provenant de l'extérieur du territoire pendant une période maximale
    de 90 jours avant de devoir immatriculer le véhicule au Nunavut.
- id: 72
  category: driver_responsibility
  question: Au Nunavut, si un conducteur titulaire d'un permis complet présente une
    alcoolémie (BAC) comprise entre 0,05 et 0,08, quelle est la sanction administrative
    immédiate pour une première infraction ?
  choices:
    A: Une suspension immédiate du permis de 24 heures sur le bord de la route.
    B: Une suspension de permis de 90 jours.
    C: La révocation permanente du permis.
    D: Il n'y a pas de sanction si le taux est inférieur à 0,08.
  answer: A
  explanation: Le Nunavut applique une suspension immédiate de 24 heures sur le bord
    de la route pour les conducteurs se trouvant dans la zone d'avertissement (alcoolémie
    de 0,05 à 0,08).
- id: 73
  category: driver_responsibility
  question: Lequel des documents suivants n'est PAS obligatoire de présenter à la
    demande d'un agent de la paix au Nunavut ?
  choices:
    A: Un permis de conduire valide.
    B: L'acte de vente original du véhicule.
    C: Un certificat d'immatriculation de véhicule automobile valide.
    D: Une carte d'assurance responsabilité civile valide (carte rose).
  answer: B
  explanation: Les conducteurs doivent avoir sur eux et présenter leur permis de conduire,
    leur certificat d'immatriculation et leur preuve d'assurance. L'acte de vente
    n'est pas requis dans le véhicule une fois que celui-ci a été immatriculé.
- id: 74
  category: driver_responsibility
  question: Si vous ne vous arrêtez pas sur les lieux d'un accident dans lequel vous
    êtes impliqué (délit de fuite), combien de points d'inaptitude seront ajoutés
    à votre dossier de conduite du Nunavut ?
  choices:
    A: 2 points.
    B: 3 points.
    C: 5 points.
    D: 7 points.
  answer: D
  explanation: Le fait de ne pas rester sur les lieux d'un accident est une infraction
    majeure au Nunavut et entraîne l'ajout de 7 points d'inaptitude.
- id: 75
  category: driver_responsibility
  question: 'Au Nunavut, il est illégal d''utiliser un appareil de communication électronique
    portatif en conduisant. Cela inclut :'
  choices:
    A: Uniquement lorsque le véhicule est en mouvement.
    B: Uniquement lorsque le véhicule se trouve sur une route de grande circulation.
    C: Même lorsque le véhicule est arrêté à un feu rouge ou à un panneau d'arrêt.
    D: Uniquement si vous parlez, mais l'envoi de textos est autorisé.
  answer: C
  explanation: Les lois sur la conduite distraite s'appliquent dès que le conducteur
    a la garde et le contrôle du véhicule, y compris lorsqu'il est arrêté dans la
    circulation ou aux feux de signalisation.
- id: 76
  category: driver_responsibility
  question: 'Si votre permis de conduire du Nunavut est suspendu, vous :'
  choices:
    A: Êtes autorisé à conduire uniquement pour aller au travail et en revenir.
    B: Êtes autorisé à conduire si un conducteur titulaire d'un permis est assis sur
      le siège passager.
    C: N'êtes autorisé à conduire aucun véhicule à moteur, quelles que soient les
      circonstances, sur les voies publiques.
    D: Êtes autorisé à conduire uniquement pendant les heures de clarté.
  answer: C
  explanation: Une suspension de permis signifie que vos privilèges de conduite sont
    complètement révoqués pour la durée de la suspension ; il n'existe pas de « permis
    de travail » automatique au Nunavut.
- id: 77
  category: safe_driving_rules
  question: Au Nunavut, quelle est la limite de vitesse par défaut à l'intérieur d'une
    municipalité ou d'un établissement, à moins d'indication contraire ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: Selon la Loi sur les véhicules automobiles du Nunavut, la limite de
    vitesse réglementaire dans une municipalité est de 50 km/h, à moins que des panneaux
    n'indiquent une limite différente.
- id: 78
  category: safe_driving_rules
  question: Lorsque vous stationnez votre véhicule près d'une borne d'incendie au
    Nunavut, quelle est la distance minimale requise que vous devez respecter ?
  choices:
    A: 1 mètre
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: B
  explanation: Au Nunavut, les conducteurs ne doivent pas stationner un véhicule à
    moins de 3 mètres d'une borne d'incendie.
- id: 79
  category: safe_driving_rules
  question: Vous approchez d'un autobus scolaire par l'avant ou par l'arrière dont
    les feux rouges clignotent et dont le bras d'arrêt est déployé. Que devez-vous
    faire ?
  choices:
    A: Ralentir à 20 km/h et dépasser prudemment
    B: S'arrêter à au moins 5 mètres de distance et attendre que les feux cessent
      de clignoter
    C: S'arrêter uniquement si des enfants traversent actuellement la route
    D: Klaxonner et avancer lentement
  answer: B
  explanation: Au Nunavut, vous devez vous arrêter à au moins 5 mètres d'un autobus
    scolaire lorsque ses feux rouges clignotent, peu importe la direction d'où vous
    venez, et rester à l'arrêt jusqu'à ce que les feux soient éteints.
- id: 80
  category: safe_driving_rules
  question: Au Nunavut, quand êtes-vous autorisé à tourner à droite à un feu rouge
    ?
  choices:
    A: Jamais ; vous devez attendre le feu vert
    B: Uniquement s'il y a une voie de virage réservée
    C: Après avoir marqué un arrêt complet et cédé le passage aux piétons et aux autres
      véhicules, à moins qu'un panneau ne l'interdise
    D: Uniquement entre minuit et 6 h 00 du matin
  answer: C
  explanation: Les conducteurs peuvent tourner à droite au feu rouge après un arrêt
    complet et après avoir cédé le passage à la circulation et aux piétons, à condition
    qu'aucun panneau n'interdise le virage.
- id: 81
  category: safe_driving_rules
  question: Quelle est la distance minimale à respecter pour stationner près d'un
    panneau d'arrêt ou d'un passage pour piétons marqué au Nunavut ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: La Loi sur les véhicules automobiles du Nunavut interdit de stationner
    à moins de 5 mètres d'un panneau d'arrêt, d'un panneau de cédez-le-passage ou
    d'un passage pour piétons marqué.
- id: 82
  category: safe_driving_rules
  question: Selon la loi du Nunavut, où le demi-tour est-il strictement interdit,
    même en l'absence de signalisation ?
  choices:
    A: Sur n'importe quelle route de gravier
    B: Dans un virage ou près du sommet d'une côte où la visibilité est inférieure
      à 150 mètres
    C: Dans une entrée de cour résidentielle
    D: À toute intersection munie de feux de circulation
  answer: B
  explanation: Les demi-tours sont interdits dans les virages ou sur les côtes où
    le conducteur ne peut pas être vu par les autres conducteurs arrivant de l'une
    ou l'autre direction à moins de 150 mètres.
- id: 83
  category: safe_driving_rules
  question: Lorsque deux véhicules arrivent à une intersection non réglementée (sans
    panneaux ni signaux) à peu près en même temps, qui a la priorité ?
  choices:
    A: Le véhicule de gauche doit céder le passage au véhicule de droite
    B: Le véhicule de droite doit céder le passage au véhicule de gauche
    C: Le véhicule circulant à la vitesse la plus élevée a la priorité
    D: Le véhicule le plus gros a toujours la priorité
  answer: A
  explanation: À une intersection non réglementée, le conducteur du véhicule situé
    à gauche doit céder le passage au véhicule situé à sa droite.
- id: 84
  category: safe_driving_rules
  question: Quelle est la distance de suivi recommandée derrière un autre véhicule
    dans des conditions de conduite normales au Nunavut ?
  choices:
    A: La longueur d'une voiture
    B: Deux secondes
    C: Cinq secondes
    D: 10 mètres
  answer: B
  explanation: La « règle des deux secondes » est la distance de suivi minimale standard
    recommandée pour des conditions normales ; celle-ci doit être augmentée par mauvais
    temps ou sur les routes de gravier courantes au Nunavut.
- id: 85
  category: safe_driving_rules
  question: Avant d'effectuer un virage ou un changement de voie, à quelle distance
    d'avance devez-vous signaler votre intention ?
  choices:
    A: Au moins 5 mètres avant le virage
    B: Au moins 30 mètres avant le virage
    C: Seulement quand vous voyez une autre voiture derrière vous
    D: Exactement au moment où vous commencez à tourner le volant
  answer: B
  explanation: Les conducteurs doivent signaler leur intention au moins 30 mètres
    avant un virage ou un changement de voie pour avertir suffisamment les autres
    usagers de la route.
- id: 86
  category: safe_driving_rules
  question: Au Nunavut, quand est-il légal de dépasser un autre véhicule par la droite
    ?
  choices:
    A: Lorsque le véhicule devant tourne à gauche et qu'il y a un accotement revêtu
      ou une voie libre
    B: Chaque fois que vous êtes pressé et que la voie de gauche est bloquée
    C: Uniquement dans les rues à sens unique comportant trois voies ou plus
    D: Il n'est jamais légal de dépasser par la droite
  answer: A
  explanation: Le dépassement par la droite est autorisé si le véhicule dépassé effectue
    ou signale un virage à gauche et qu'il y a suffisamment d'espace sur la chaussée
    pour le faire en toute sécurité.
- id: 87
  category: safe_driving_rules
  question: En s'engageant sur une voie publique à partir d'une entrée privée ou d'une
    ruelle, que doit faire un conducteur ?
  choices:
    A: Klaxonner et avancer
    B: S'arrêter avant le trottoir et céder le passage à tous les piétons et véhicules
    C: Accélérer pour s'insérer rapidement dans la circulation
    D: Céder le passage uniquement aux véhicules venant de la gauche
  answer: B
  explanation: Les conducteurs doivent marquer un arrêt complet avant de traverser
    un trottoir ou de s'engager sur la route à partir d'une entrée, et doivent céder
    le passage à toute la circulation et aux piétons qui approchent.
- id: 88
  category: safe_driving_rules
  question: Selon les pratiques de conduite sécuritaire dans les conditions hivernales
    du Nunavut, que devez-vous faire avant d'utiliser votre véhicule ?
  choices:
    A: Dégager la neige et la glace uniquement du côté conducteur du pare-brise
    B: Dégager la neige et la glace de toutes les vitres, des rétroviseurs et des
      phares
    C: Attendre que le moteur atteigne sa pleine température de fonctionnement pendant
      20 minutes
    D: Dégonfler légèrement les pneus pour une meilleure traction
  answer: B
  explanation: Pour des raisons de sécurité et de visibilité, la loi du Nunavut et
    les pratiques de conduite sécuritaire exigent que toutes les vitres, les rétroviseurs
    et les phares soient exempts de neige et de glace avant de conduire.
- id: 89
  category: safe_driving_rules
  question: Dans une zone urbaine du Nunavut, à quelle distance d'avance devez-vous
    signaler avant d'effectuer un virage ?
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 50 mètres
    D: 100 mètres
  answer: B
  explanation: Dans les zones urbaines, vous devez signaler au moins 30 mètres avant
    l'endroit où vous avez l'intention de tourner pour avertir suffisamment les autres
    conducteurs.
- id: 90
  category: safe_driving_rules
  question: Au Nunavut, il est illégal de stationner à moins de combien de mètres
    d'un panneau d'arrêt ou d'un panneau de cédez-le-passage ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 8 mètres
    D: 10 mètres
  answer: B
  explanation: Le stationnement est interdit à moins de 5 mètres d'un panneau d'arrêt,
    d'un panneau de cédez-le-passage ou d'un passage pour piétons marqué.
- id: 91
  category: safe_driving_rules
  question: Selon la loi du Nunavut, qui est responsable de s'assurer qu'un passager
    de moins de 16 ans porte sa ceinture de sécurité ?
  choices:
    A: Le passager
    B: Les parents du passager (même s'ils ne sont pas dans la voiture)
    C: Le conducteur
    D: Le propriétaire du véhicule
  answer: C
  explanation: Le conducteur du véhicule est légalement responsable de s'assurer que
    tous les passagers de moins de 16 ans sont correctement attachés.
- id: 92
  category: safe_driving_rules
  question: 'Il est interdit de faire un demi-tour au Nunavut si vous ne pouvez pas
    être vu par les autres conducteurs arrivant de l''une ou l''autre direction à
    une distance de :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Les demi-tours sont interdits dans les virages ou près du sommet d'une
    côte où le conducteur ne peut pas être vu par les autres usagers de la route à
    moins de 150 mètres.
- id: 93
  category: safe_driving_rules
  question: Lorsque vous stationnez un véhicule en montée sur une rue avec une bordure
    de trottoir, comment devez-vous positionner vos roues avant ?
  choices:
    A: Tournées vers la bordure
    B: Tournées à l'opposé de la bordure
    C: Parallèles à la bordure
    D: Cela n'a pas d'importance
  answer: B
  explanation: Lors d'un stationnement en montée avec une bordure, tournez vos roues
    à l'opposé de la bordure (vers la gauche) de sorte que si le véhicule recule,
    l'arrière du pneu frappe la bordure et s'arrête.
- id: 94
  category: safe_driving_rules
  question: Lorsque vous conduisez dans un brouillard épais ou sous la neige la nuit,
    quel réglage de phares devez-vous utiliser pour maintenir la meilleure visibilité
    ?
  choices:
    A: Feux de route
    B: Feux de croisement
    C: Feux de stationnement uniquement
    D: Aucun feu
  answer: B
  explanation: Les feux de croisement doivent être utilisés dans le brouillard ou
    la neige car les feux de route se reflètent sur l'humidité ou les flocons, provoquant
    un éblouissement et réduisant la visibilité.
- id: 95
  category: defensive_driving
  question: Lorsque vous conduisez sur des routes enneigées ou glacées au Nunavut,
    comment devez-vous ajuster votre distance de sécurité ?
  choices:
    A: Maintenir la règle standard des 2 secondes
    B: La réduire à 1 seconde pour rester dans les traces du véhicule de tête
    C: L'augmenter à au moins 4 à 6 secondes
    D: L'augmenter à exactement 15 secondes
  answer: C
  explanation: Les conditions défavorables comme la glace et la neige augmentent considérablement
    les distances de freinage. Il est conseillé aux conducteurs du Nunavut d'augmenter
    leur distance de sécurité à au moins 4 à 6 secondes pour assurer la sécurité.
- id: 96
  category: defensive_driving
  question: Pour maintenir une bonne conscience de la situation, à quelle distance
    vers l'avant un conducteur doit-il balayer la route du regard dans une zone résidentielle
    au Nunavut ?
  choices:
    A: 5 secondes
    B: 12 à 15 secondes
    C: 25 à 30 secondes
    D: Seulement jusqu'au véhicule qui précède immédiatement
  answer: B
  explanation: Les manuels de conduite préventive du Nunavut recommandent de balayer
    du regard 12 à 15 secondes devant votre véhicule pour identifier les dangers potentiels
    avant qu'ils ne deviennent des problèmes immédiats.
- id: 97
  category: defensive_driving
  question: Au Nunavut, vous devez passer des feux de route aux feux de croisement
    lorsque vous vous trouvez à quelle distance d'un véhicule venant en sens inverse
    ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 300 mètres
    D: 500 mètres
  answer: C
  explanation: Selon le règlement de la circulation du Nunavut, vous devez passer
    aux feux de croisement lorsqu'un véhicule venant en sens inverse se trouve à moins
    de 300 mètres pour éviter d'éblouir l'autre conducteur.
- id: 98
  category: defensive_driving
  question: Lorsque vous suivez un autre véhicule la nuit au Nunavut, à quelle distance
    devez-vous passer des feux de route aux feux de croisement ?
  choices:
    A: 50 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: Lorsque vous suivez un autre véhicule par l'arrière la nuit, vous devez
    baisser vos feux de route lorsque vous vous trouvez à moins de 150 mètres de ce
    véhicule.
- id: 99
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une rare nappe
    d'eau stagnante au Nunavut, quelle est la bonne action préventive ?
  choices:
    A: Freiner brusquement pour arrêter le glissement
    B: Accélérer pour regagner de la traction
    C: Relâcher l'accélérateur et diriger le volant dans la direction où vous voulez
      aller
    D: Tourner le volant brusquement vers la gauche
  answer: C
  explanation: En cas d'aquaplanage, vous ne devez ni freiner ni accélérer. Au lieu
    de cela, relâchez l'accélérateur et gardez le volant droit ou dirigez-le doucement
    dans la direction souhaitée jusqu'à ce que la traction soit rétablie.
- id: 100
  category: defensive_driving
  question: Lorsque vous conduisez un véhicule équipé d'un système de freinage antiblocage
    (ABS) sur une route glacée du Nunavut, comment devez-vous actionner les freins
    en cas d'urgence ?
  choices:
    A: Pomper les freins rapidement
    B: Appliquer une pression ferme et continue sur la pédale de frein
    C: Appuyer légèrement une seule fois sur les freins
    D: Passer au point mort et utiliser le frein d'urgence
  answer: B
  explanation: Avec l'ABS, vous devez appliquer une pression ferme et constante. Le
    système « pompera » automatiquement les freins beaucoup plus rapidement qu'un
    humain ne pourrait le faire pour empêcher le blocage des roues.
- id: 101
  category: defensive_driving
  question: En cas de blizzard blanc total (« whiteout ») pendant que vous conduisez
    au Nunavut, quelle est la mesure la plus sûre à prendre ?
  choices:
    A: Accélérer pour arriver plus rapidement à destination
    B: S'arrêter au milieu de la route et éteindre tous les feux
    C: Se ranger le plus loin possible de la route, allumer les feux de détresse et
      rester dans le véhicule
    D: Sortir du véhicule et marcher vers la source de lumière la plus proche
  answer: C
  explanation: Dans des conditions de voile blanc, la visibilité est nulle. La mesure
    la plus sûre consiste à se ranger sur le côté, à utiliser les feux de détresse
    pour rester visible des autres et à rester à l'intérieur du véhicule pour se protéger
    du froid jusqu'à ce que les conditions s'améliorent.
- id: 102
  category: defensive_driving
  question: Si vous voyez un caribou ou un autre gros animal sur la route ou à proximité
    au Nunavut, que devez-vous faire ?
  choices:
    A: Klaxonner continuellement pour l'effrayer
    B: Faire des appels de phares (feux de route) de façon répétée
    C: Ralentir, rester vigilant et se tenir prêt à s'arrêter, car les animaux voyagent
      souvent en groupe
    D: Accélérer pour dépasser l'animal avant qu'il ne s'engage sur la route
  answer: C
  explanation: La faune est omniprésente au Nunavut. Si vous voyez un animal, il y
    en a probablement d'autres à proximité. Ralentir et se tenir prêt à s'arrêter
    est la pratique de conduite préventive la plus sûre.
- id: 103
  category: defensive_driving
  question: Au Nunavut, quelle est la sanction pour une première condamnation pour
    utilisation d'un appareil électronique portatif au volant (distraction au volant)
    ?
  choices:
    A: Une amende de 100 $ et 0 point d'inaptitude
    B: Une amende de 575 $ et 3 points d'inaptitude
    C: Une amende de 1 000 $ et 6 points d'inaptitude
    D: Révocation immédiate et permanente du permis
  answer: B
  explanation: En vertu de la Loi sur la sécurité routière du Nunavut, la distraction
    au volant entraîne une amende importante (actuellement 575 $) et 3 points d'inaptitude
    pour décourager ce comportement.
- id: 104
  category: defensive_driving
  question: Lorsque vous approchez d'un véhicule d'urgence arrêté sur le bord d'une
    route au Nunavut avec ses gyrophares allumés, que devez-vous faire ?
  choices:
    A: Maintenir votre vitesse mais changer pour la voie de gauche
    B: Ralentir à 30 km/h (ou à la limite affichée si elle est inférieure) et dépasser
      avec prudence
    C: S'arrêter complètement jusqu'à ce que le véhicule d'urgence reparte
    D: Accélérer pour dégager la zone rapidement
  answer: B
  explanation: Les lois sur le corridor de sécurité du Nunavut exigent que les conducteurs
    ralentissent à 30 km/h lorsqu'ils dépassent des véhicules d'urgence dont les gyrophares
    clignotent et qui sont arrêtés sur le bord de la route.
- id: 105
  category: defensive_driving
  question: Comment le froid extrême au Nunavut affecte-t-il la pression des pneus,
    et quel est l'impact sur la conduite préventive ?
  choices:
    A: Le froid augmente la pression des pneus, ce qui accroît le risque d'éclatement
    B: Le froid diminue la pression des pneus, ce qui peut entraîner une mauvaise
      tenue de route et une réduction de l'adhérence
    C: Le froid n'a aucun effet sur la pression des pneus
    D: Le froid rend les pneus plus mous, offrant une meilleure adhérence sur la glace
  answer: B
  explanation: La pression des pneus chute par temps froid. Des pneus sous-gonflés
    réduisent les capacités de maniabilité et l'adhérence du véhicule, ce qui rend
    les manœuvres défensives plus difficiles.
- id: 106
  category: defensive_driving
  question: Au Nunavut, quelle est la pénalité en points d'inaptitude pour le non-port
    de la ceinture de sécurité ?
  choices:
    A: 1 point d'inaptitude
    B: 2 points d'inaptitude
    C: 3 points d'inaptitude
    D: 5 points d'inaptitude
  answer: B
  explanation: Le fait de ne pas porter sa ceinture de sécurité au Nunavut entraîne
    une amende et l'inscription de 2 points d'inaptitude à votre dossier de conduite.
- id: 107
  category: defensive_driving
  question: Qu'est-ce que la « glace noire » (black ice) et pourquoi est-ce une préoccupation
    majeure de conduite préventive au Nunavut ?
  choices:
    A: De la glace qui a été recouverte de terre et de gravier
    B: Une épaisse couche de neige blanche visible
    C: Une fine couche de glace transparente qui ressemble à une route mouillée
    D: De la glace qui ne se forme que pendant la nuit
  answer: C
  explanation: La glace noire est une fine couche de glace transparente sur la surface
    de la route. Comme elle est transparente, l'asphalte noir transparaît, lui donnant
    l'apparence d'une plaque d'eau inoffensive, ce qui entraîne souvent des dérapages
    inattendus.
- id: 108
  category: defensive_driving
  question: À quelle distance un conducteur doit-il scruter la route pour détecter
    des dangers potentiels lorsqu'il conduit dans une communauté ou une ville au Nunavut
    ?
  choices:
    A: 2 à 5 secondes devant lui
    B: 5 à 8 secondes devant lui
    C: 12 à 15 secondes devant lui
    D: 20 à 30 secondes devant lui
  answer: C
  explanation: Les principes de conduite préventive au Nunavut exigent de scruter
    la route de 12 à 15 secondes à l'avance pour identifier les dangers avant qu'ils
    ne deviennent des problèmes immédiats.
- id: 109
  category: defensive_driving
  question: 'Au Nunavut, dans des conditions hivernales ou lorsque les routes sont
    glacées, la distance de suivi recommandée doit être augmentée à au moins :'
  choices:
    A: 3 secondes
    B: 4 secondes
    C: 5 secondes
    D: 8 secondes
  answer: B
  explanation: Étant donné que les distances de freinage augmentent considérablement
    sur la glace et la neige, la règle standard des 2 secondes doit être doublée pour
    atteindre au moins 4 secondes en conditions hivernales.
- id: 110
  category: defensive_driving
  question: Si vous faites face à un voile blanc (« whiteout ») à cause de la poudrerie
    en conduisant au Nunavut, quelle est l'action de conduite préventive la plus sûre
    ?
  choices:
    A: Accélérer pour traverser la zone rapidement
    B: Allumer les feux de route pour voir plus loin
    C: Réduire la vitesse, utiliser les feux de croisement et chercher un endroit
      sûr pour se ranger
    D: S'arrêter immédiatement au milieu de la voie de circulation
  answer: C
  explanation: Dans des conditions de voile blanc, la visibilité est presque nulle.
    Vous devez ralentir, utiliser les feux de croisement (les feux de route se reflètent
    sur la neige) et vous ranger complètement hors de la route si vous pouvez le faire
    en toute sécurité.
- id: 111
  category: defensive_driving
  question: 'Si votre véhicule commence à faire de l''aquaplanage sur une plaque d''eau
    stagnante, vous devriez :'
  choices:
    A: Freiner brusquement pour arrêter le glissement
    B: Tourner le volant brusquement vers la gauche
    C: Relâcher l'accélérateur et diriger le volant dans la direction où vous voulez
      aller
    D: Mettre immédiatement le véhicule au point mort (neutral)
  answer: C
  explanation: Pour vous rétablir d'un aquaplanage, vous devez lever le pied de l'accélérateur
    pour ralentir naturellement et maintenir fermement le volant, en le dirigeant
    tout droit ou dans la direction souhaitée.
- id: 112
  category: defensive_driving
  question: 'Lorsque vous rencontrez des animaux sauvages tels que des caribous ou
    des bœufs musqués sur ou près d''une route du Nunavut, un conducteur défensif
    doit :'
  choices:
    A: Klaxonner à plusieurs reprises pour les effrayer
    B: Faire des appels de phares (feux de route) pour éblouir l'animal
    C: Ralentir ou s'arrêter, et attendre que l'animal passe
    D: Accélérer pour les dépasser avant qu'ils ne s'engagent sur la route
  answer: C
  explanation: La faune au Nunavut peut être imprévisible. Le klaxon peut les effrayer
    et les pousser sur la trajectoire de la voiture. La mesure la plus sûre est de
    ralentir ou de s'arrêter pour leur permettre de libérer la zone.
- id: 113
  category: defensive_driving
  question: Au Nunavut, le fait de ne pas porter sa ceinture de sécurité ou de ne
    pas s'assurer qu'un passager de moins de 16 ans est attaché entraîne combien de
    points d'inaptitude ?
  choices:
    A: 1 point d'inaptitude
    B: 2 points d'inaptitude
    C: 3 points d'inaptitude
    D: 4 points d'inaptitude
  answer: B
  explanation: Selon le système de points d'inaptitude du Nunavut, une condamnation
    pour défaut de port de la ceinture de sécurité entraîne une pénalité de 2 points
    d'inaptitude.
- id: 114
  category: defensive_driving
  question: Quelle est la manière la plus sûre de vérifier vos angles morts avant
    de changer de voie ?
  choices:
    A: Vérifier uniquement votre rétroviseur intérieur
    B: Vérifier uniquement vos rétroviseurs extérieurs
    C: Tourner la tête et regarder par-dessus votre épaule dans la direction où vous
      prévoyez de vous déplacer
    D: Klaxonner pour voir si quelqu'un s'y trouve
  answer: C
  explanation: Les rétroviseurs ne montrent pas tout. Une vérification par-dessus
    l'épaule est le seul moyen de s'assurer que votre angle mort est libre avant un
    changement de voie.
- id: 115
  category: defensive_driving
  question: Lorsque vous conduisez sur de la « glace noire » au Nunavut, qui est souvent
    invisible, quel est le meilleur moyen de garder le contrôle ?
  choices:
    A: Effectuer des corrections de direction soudaines
    B: Éviter tout freinage, accélération ou mouvement de direction brusque
    C: Conduire à la limite de vitesse maximale affichée
    D: Garder le pied au-dessus de la pédale de frein en tout temps
  answer: B
  explanation: Sur la glace noire, tout mouvement brusque peut provoquer une perte
    d'adhérence. Des manœuvres douces et graduelles sont nécessaires pour maintenir
    le contrôle du véhicule.
- id: 116
  category: defensive_driving
  question: 'Si vous conduisez et que vous vous sentez somnolent ou fatigué, la meilleure
    stratégie de conduite défensive est de :'
  choices:
    A: Augmenter le volume de la radio
    B: Ouvrir la fenêtre pour avoir de l'air frais
    C: Boire une boisson caféinée et continuer
    D: Se ranger dans un endroit sûr et se reposer
  answer: D
  explanation: La fatigue est une cause majeure d'accidents. Les solutions temporaires
    comme la musique ou l'air ne remplacent pas le besoin de sommeil ; s'arrêter pour
    se reposer est la seule option sécuritaire.
- id: 117
  category: defensive_driving
  question: Avant de faire marche arrière avec votre véhicule, que devriez-vous faire
    pour assurer la sécurité ?
  choices:
    A: Se fier uniquement à votre caméra de recul
    B: Klaxonner deux fois puis reculer rapidement
    C: Faire le tour du véhicule à pied pour vérifier s'il y a des obstacles ou des
      enfants
    D: Vérifier uniquement vos rétroviseurs extérieurs
  answer: C
  explanation: Le manuel du conducteur du Nunavut souligne l'importance de faire le
    tour du véhicule avant d'y monter pour s'assurer que la voie est libre, car les
    rétroviseurs et les caméras ont des angles morts importants.
- id: 118
  category: alcohol_drugs_health
  question: Au Nunavut, un conducteur expérimenté (hors GDL) est considéré comme étant
    dans la zone d'avertissement (« warn range ») si son taux d'alcoolémie (BAC) se
    situe dans quelle fourchette ?
  choices:
    A: 0,01 % à 0,04 %
    B: 0,05 % à 0,08 %
    C: 0,08 % à 0,10 %
    D: 0,02 % à 0,05 %
  answer: B
  explanation: Au Nunavut, bien que 0,08 % soit la limite criminelle, les conducteurs
    ayant un taux d'alcoolémie (BAC) compris entre 0,05 % et 0,08 % se situent dans
    la zone d'avertissement et sont passibles de sanctions administratives immédiates.
- id: 119
  category: alcohol_drugs_health
  question: Si un conducteur détenant un permis complet au Nunavut est pris avec un
    taux d'alcoolémie (BAC) de 0,08 % ou plus pour la première fois, il s'expose à
    une suspension administrative immédiate de son permis de combien de jours ?
  choices:
    A: 24 heures
    B: 30 jours
    C: 90 jours
    D: 1 an
  answer: C
  explanation: En vertu du programme de suspension administrative du permis du Nunavut,
    un conducteur pris avec un taux d'alcoolémie supérieur à 0,08 % ou qui refuse
    de se soumettre à un alcootest reçoit une suspension immédiate de son permis de
    90 jours.
- id: 120
  category: alcohol_drugs_health
  question: En vertu du Code criminel du Canada, qui s'applique au Nunavut, quelle
    est la limite légale maximale de taux d'alcoolémie (BAC) pour un conducteur détenant
    un permis complet avant que des poursuites criminelles ne s'appliquent ?
  choices:
    A: 0,04 %
    B: 0,05 %
    C: 0,08 %
    D: 0,10 %
  answer: C
  explanation: Le Code criminel du Canada fixe la limite légale à 0,08 %. Conduire
    à ce taux ou au-dessus constitue une infraction criminelle fédérale.
- id: 121
  category: alcohol_drugs_health
  question: Si un agent de police au Nunavut exige légalement un échantillon d'haleine
    et que le conducteur refuse, quelles sont les conséquences juridiques ?
  choices:
    A: Une petite amende et une suspension de 24 heures
    B: Aucune sanction s'il s'agit de la première fois pour le conducteur
    C: Les mêmes sanctions administratives et criminelles que pour un taux d'alcoolémie
      (BAC) supérieur à 0,08 %
    D: Une peine d'emprisonnement obligatoire de 10 jours seulement
  answer: C
  explanation: Le refus de fournir un échantillon d'haleine ou de sang suite à une
    demande légale de la police entraîne les mêmes conséquences et sanctions que la
    conduite avec un taux d'alcoolémie (BAC) supérieur à 0,08 %.
- id: 122
  category: alcohol_drugs_health
  question: Au Nunavut, qui est légalement responsable de s'assurer qu'un conducteur
    est physiquement et médicalement apte à conduire un véhicule à moteur ?
  choices:
    A: Uniquement le médecin du conducteur
    B: Uniquement le registraire des véhicules automobiles
    C: Le conducteur lui-même
    D: L'employeur du conducteur
  answer: C
  explanation: Il incombe au conducteur la responsabilité légale de s'assurer qu'il
    est apte à conduire et de signaler au registraire tout problème de santé susceptible
    d'affecter sa capacité à conduire en toute sécurité.
- id: 123
  category: alcohol_drugs_health
  question: Quelle est la politique concernant la consommation de cannabis pour les
    conducteurs du programme de permis de conduire progressif (GDL) du Nunavut ?
  choices:
    A: Ils peuvent conduire avec une petite quantité de THC dans leur organisme
    B: Il existe une politique de tolérance zéro pour le THC
    C: Ils ont seulement l'interdiction de fumer du cannabis en conduisant
    D: Les mêmes limites que pour l'alcool s'appliquent (0,05 %)
  answer: B
  explanation: Le Nunavut applique une politique de tolérance zéro pour les drogues
    (y compris le cannabis/THC) pour tous les conducteurs du programme GDL, quel que
    soit l'âge légal de consommation.
- id: 124
  category: alcohol_drugs_health
  question: Si un conducteur expérimenté se trouve dans la zone d'avertissement (taux
    d'alcoolémie de 0,05 % à 0,08 %) pour la première fois au Nunavut, quelle est
    la sanction administrative immédiate ?
  choices:
    A: Une suspension immédiate du permis de conduire de 24 heures sur le bord de
      la route
    B: Une suspension de permis de 90 jours
    C: Une révocation permanente du permis
    D: Une amende obligatoire de 5 000 $
  answer: A
  explanation: Une première infraction dans la zone d'avertissement (0,05 % à 0,08
    %) entraîne une suspension immédiate de 24 heures des privilèges de conduite sur
    le bord de la route.
- id: 125
  category: alcohol_drugs_health
  question: Lorsqu'il prend des médicaments sur ordonnance ou en vente libre, que
    doit faire un conducteur du Nunavut avant de conduire un véhicule ?
  choices:
    A: Conduire uniquement pendant les heures de clarté
    B: Vérifier l'étiquette ou demander à un pharmacien les effets secondaires tels
      que la somnolence
    C: Attendre au moins une heure après avoir pris n'importe quel comprimé
    D: Boire une tasse de café pour contrer toute somnolence potentielle
  answer: B
  explanation: De nombreux médicaments provoquent de la somnolence ou altèrent le
    jugement. Les conducteurs sont responsables de savoir comment leurs médicaments
    les affectent avant de prendre le volant.
- id: 126
  category: alcohol_drugs_health
  question: Au Nunavut, si un conducteur est accusé d'une infraction de conduite liée
    à l'alcool, qu'est-ce qui peut arriver au véhicule qu'il conduisait ?
  choices:
    A: Il est vendu aux enchères immédiatement
    B: Il peut être saisi et mis en fourrière aux frais du conducteur
    C: Il est ramené au domicile du conducteur par la police
    D: Rien ne se passe pour le véhicule
  answer: B
  explanation: Les véhicules utilisés lors d'infractions pour conduite avec facultés
    affaiblies peuvent être saisis et mis en fourrière. Le propriétaire ou le conducteur
    est responsable de tous les frais de remorquage et d'entreposage.
- id: 127
  category: alcohol_drugs_health
  question: Qu'est-ce que l'« effet synergique » dans le contexte de la sécurité routière
    ?
  choices:
    A: L'effet de la conduite d'un véhicule hybride
    B: L'augmentation des facultés affaiblies causée par le mélange d'alcool et de
      drogues
    C: L'amélioration de la vision lors du port de verres polarisants
    D: L'amélioration du temps de réaction grâce à la caféine
  answer: B
  explanation: Le mélange d'alcool et de drogues (même sur ordonnance) crée un effet
    synergique, ce qui signifie que l'affaiblissement combiné des facultés est bien
    plus important que la somme des effets individuels.
- id: 128
  category: alcohol_drugs_health
  question: 'Si vous vous sentez extrêmement fatigué ou épuisé alors que vous conduisez
    sur le territoire ou entre des communautés au Nunavut, vous devriez :'
  choices:
    A: Monter le son de la radio et ouvrir la fenêtre
    B: Conduire plus vite pour arriver à destination plus tôt
    C: Vous arrêter pour vous reposer ou changer de conducteur si possible
    D: Boire plusieurs boissons énergisantes et continuer
  answer: C
  explanation: La fatigue est une forme d'affaiblissement des facultés. Le seul remède
    à la somnolence est le sommeil ; les « astuces » comme la musique forte ou l'air
    froid ne sont que temporaires et ne rétablissent pas la capacité de conduire en
    toute sécurité.
- id: 129
  category: alcohol_drugs_health
  question: Au Nunavut, quelle est l'exigence visuelle minimale (avec ou sans lentilles
    correctrices) pour détenir un permis de conduire standard de classe 5 ?
  choices:
    A: 20/20 dans les deux yeux
    B: 20/40 dans au moins un œil
    C: 20/60 dans les deux yeux
    D: 20/100 dans au moins un œil
  answer: B
  explanation: Pour répondre aux normes médicales d'un permis de classe 5 au Nunavut,
    un conducteur doit avoir une vision d'au moins 20/40 dans le meilleur œil.
- id: 130
  category: alcohol_drugs_health
  question: Laquelle des conditions médicales suivantes doit être signalée au registraire
    des véhicules automobiles du Nunavut ?
  choices:
    A: Un rhume banal
    B: Un doigt cassé qui a guéri
    C: Toute condition provoquant une perte soudaine de conscience ou de contrôle
      musculaire
    D: Des allergies saisonnières
  answer: C
  explanation: Les conditions telles que l'épilepsie, le diabète (en cas de tendance
    à l'hypoglycémie) ou les maladies cardiaques provoquant des évanouissements doivent
    être signalées car elles ont un impact direct sur la sécurité routière.
- id: 131
  category: alcohol_drugs_health
  question: Si le permis de conduire d'un conducteur est suspendu en raison d'une
    condamnation en vertu du Code criminel pour conduite avec facultés affaiblies,
    que doit-il généralement faire pour le récupérer après la période de suspension
    ?
  choices:
    A: Attendre simplement que la date soit passée
    B: Payer des frais de rétablissement et éventuellement suivre un programme de
      sensibilisation à l'alcool
    C: Acheter un nouveau véhicule
    D: Rien ; le permis est renvoyé par la poste automatiquement
  answer: B
  explanation: Le rétablissement d'un permis après une suspension liée à l'alcool
    implique le paiement de frais et peut exiger que le conducteur prouve qu'il a
    traité son problème de consommation de substances par le biais de programmes.
- id: 132
  category: alcohol_drugs_health
  question: Comment l'alcool affecte-t-il la vision périphérique (latérale) d'un conducteur
    ?
  choices:
    A: Il rend la vision périphérique plus nette
    B: Il n'a aucun effet sur la vision périphérique
    C: Il rétrécit le champ de vision (vision en tunnel)
    D: Il augmente uniquement la portée de l'angle mort
  answer: C
  explanation: La consommation d'alcool entraîne une « vision en tunnel », réduisant
    considérablement la capacité du conducteur à voir les dangers venant des côtés.
- id: 133
  category: alcohol_drugs_health
  question: Au Nunavut, quel est le taux d'alcoolémie (BAC) de la « zone d'avertissement
    » pour les conducteurs titulaires d'un permis complet qui entraîne une suspension
    immédiate sur le bord de la route ?
  choices:
    A: 0,02 % à 0,05 %
    B: 0,05 % à 0,08 %
    C: 0,08 % à 0,10 %
    D: 0,01 % à 0,04 %
  answer: B
  explanation: Au Nunavut, les conducteurs titulaires d'un permis complet dont le
    taux d'alcoolémie se situe entre 0,05 % et 0,08 % se trouvent dans la « zone d'avertissement
    » et s'exposent à des sanctions administratives immédiates, y compris la suspension
    du permis.
- id: 134
  category: alcohol_drugs_health
  question: En vertu de la Loi sur les véhicules automobiles du Nunavut, quelle est
    la sanction pour un conducteur qui refuse de fournir un échantillon d'haleine
    ou de sang à la suite d'une demande légale d'un agent de la paix ?
  choices:
    A: Une petite amende et une suspension de 24 heures
    B: Aucune sanction s'il s'agit d'une première demande
    C: Les mêmes sanctions criminelles et suspensions de permis que pour un taux d'alcoolémie
      supérieur à 0,08 %
    D: Un avertissement et l'obligation de suivre un cours de sécurité
  answer: C
  explanation: Le refus de fournir un échantillon d'haleine ou de sang est une infraction
    criminelle en vertu du Code criminel du Canada et entraîne le même poids et les
    mêmes sanctions que la conduite avec facultés affaiblies ou avec un taux supérieur
    à la limite légale.
- id: 135
  category: alcohol_drugs_health
  question: Si un conducteur titulaire d'un permis complet au Nunavut est pris avec
    un taux d'alcoolémie dans la « zone d'avertissement » (0,05 % à 0,08 %) pour la
    première fois, quelle est la durée de la suspension immédiate du permis sur le
    bord de la route ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: A
  explanation: Une première infraction dans la « zone d'avertissement » (0,05 % à
    0,08 %) au Nunavut entraîne généralement une suspension administrative immédiate
    du permis de 24 heures.
- id: 136
  category: alcohol_drugs_health
  question: Laquelle des affirmations suivantes est vraie concernant la conduite sous
    l'influence de médicaments sur ordonnance ou en vente libre au Nunavut ?
  choices:
    A: C'est toujours légal tant que le médicament a été prescrit par un médecin
    B: C'est illégal seulement si le médicament est un opioïde
    C: Il est illégal de conduire si le médicament affecte votre capacité à conduire
      un véhicule en toute sécurité
    D: Les médicaments en vente libre sont exemptés des lois sur la conduite avec
      facultés affaiblies
  answer: C
  explanation: En vertu des lois du Nunavut, l'affaiblissement des facultés ne se
    limite pas à l'alcool ou aux drogues illégales. Si un médicament sur ordonnance
    ou en vente libre altère vos capacités motrices ou votre jugement, vous pouvez
    être accusé de conduite avec facultés affaiblies.
- id: 137
  category: alcohol_drugs_health
  question: Au Nunavut, qui est légalement responsable de signaler un problème de
    santé susceptible d'affecter la capacité d'une personne à conduire en toute sécurité
    ?
  choices:
    A: Uniquement l'employeur du conducteur
    B: Uniquement la compagnie d'assurance du conducteur
    C: Le conducteur et son médecin traitant ou son optométriste
    D: Uniquement les membres de la famille immédiate du conducteur
  answer: C
  explanation: Le conducteur et les professionnels de la santé (médecins et optométristes)
    ont l'obligation légale de signaler les conditions qui pourraient rendre dangereuse
    la conduite d'un véhicule à moteur par une personne.
- id: 138
  category: alcohol_drugs_health
  question: Quel est l'âge légal pour la consommation de cannabis au Nunavut, qui
    dicte également les règles de tolérance zéro pour les jeunes conducteurs ?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: B
  explanation: L'âge légal pour le cannabis au Nunavut est de 19 ans. Les conducteurs
    de moins de cet âge, ainsi que tous les conducteurs du programme de permis progressif
    (GDL), sont soumis à des lois de tolérance zéro concernant le cannabis (THC) dans
    leur organisme.
- id: 139
  category: alcohol_drugs_health
  question: Si un conducteur est accusé d'un taux d'alcoolémie supérieur à 0,08 %
    ou de conduite avec facultés affaiblies au Nunavut, qu'advient-il de son véhicule
    sur le bord de la route ?
  choices:
    A: Il est laissé sur place pour qu'un ami vienne le chercher
    B: Il est immédiatement mis en fourrière aux frais du propriétaire
    C: Il est vendu par le gouvernement
    D: Il est ramené au domicile du conducteur par la police
  answer: B
  explanation: Les conducteurs accusés d'infractions de conduite liées à l'alcool
    ou aux drogues au Nunavut font face à une mise en fourrière immédiate du véhicule,
    et le propriétaire est responsable de tous les frais de remorquage et d'entreposage.
- id: 140
  category: alcohol_drugs_health
  question: Au Nunavut, si un conducteur est reconnu coupable d'une première infraction
    au Code criminel pour conduite avec facultés affaiblies, quelle est l'interdiction
    de conduire minimale ordonnée par le tribunal ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 1 an
    D: 3 ans
  answer: C
  explanation: En vertu du Code criminel du Canada, qui s'applique au Nunavut, une
    première condamnation pour conduite avec facultés affaiblies entraîne une interdiction
    de conduire minimale d'un an.
- id: 141
  category: alcohol_drugs_health
  question: Quel est le seul moyen efficace d'éliminer l'alcool de votre organisme
    avant de conduire ?
  choices:
    A: Boire du café noir
    B: Prendre une douche froide
    C: Faire de l'exercice vigoureusement
    D: Laisser le temps passer
  answer: D
  explanation: Seul le temps peut faire baisser votre taux d'alcoolémie (BAC). Le
    foie traite l'alcool à un rythme régulier, et les stimulants comme le café ou
    l'eau froide n'accélèrent pas ce processus.
- id: 142
  category: alcohol_drugs_health
  question: Au Nunavut, quelle est la période de suspension administrative du permis
    pour un conducteur dont le taux d'alcoolémie (BAC) est égal ou supérieur à 0,08
    % pour la première fois ?
  choices:
    A: 24 heures
    B: 30 jours
    C: 90 jours
    D: Indéfinie jusqu'à la date d'audience
  answer: C
  explanation: Au Nunavut, les conducteurs qui fournissent un échantillon d'haleine
    égal ou supérieur à 0,08 % de taux d'alcoolémie reçoivent une suspension administrative
    immédiate de 90 jours, laquelle est distincte de toute interdiction future ordonnée
    par le tribunal.
- id: 143
  category: alcohol_drugs_health
  question: Quel est le principal danger de combiner l'alcool et les drogues (même
    les médicaments sur ordonnance) avant de conduire ?
  choices:
    A: Ils s'annulent mutuellement
    B: L'effet combiné (synergie) est beaucoup plus important que l'effet de l'un
      ou l'autre seul
    C: Cela rend le conducteur plus vigilant
    D: Il n'y a pas de danger supplémentaire par rapport à l'alcool seul
  answer: B
  explanation: La combinaison d'alcool et de drogues peut créer un effet synergique,
    où l'affaiblissement des facultés est nettement plus grave que si les substances
    étaient prises individuellement.
- id: 144
  category: alcohol_drugs_health
  question: Un conducteur au Nunavut souffrant d'une condition médicale comme l'épilepsie
    doit généralement ne pas avoir eu de crises pendant combien de temps avant de
    pouvoir détenir un permis de conduire standard ?
  choices:
    A: 1 mois
    B: 3 mois
    C: 6 à 12 mois, selon l'évaluation médicale
    D: 5 ans
  answer: C
  explanation: En général, les conducteurs souffrant de conditions comme l'épilepsie
    ne doivent pas avoir eu de crises pendant 6 à 12 mois et doivent fournir un rapport
    médical favorable pour être admissibles à un permis au Nunavut.
- id: 145
  category: alcohol_drugs_health
  question: Si vous ressentez de la fatigue en conduisant lors d'un long voyage au
    Nunavut, quelle est la mesure la plus sûre à prendre ?
  choices:
    A: Monter le son de la radio et ouvrir la fenêtre
    B: Boire plusieurs tasses de café
    C: Se garer dans un endroit sûr et dormir
    D: Accélérer pour atteindre votre destination plus rapidement
  answer: C
  explanation: La fatigue altère la conduite de la même manière que l'alcool. Le seul
    remède sûr à la somnolence est le sommeil ; les mesures temporaires comme le café
    ou la musique ne résolvent pas l'affaiblissement des facultés sous-jacent.
- id: 146
  category: alcohol_drugs_health
  question: Au Nunavut, à quel âge un conducteur doit-il commencer à soumettre un
    rapport d'examen médical au registraire des véhicules automobiles pour conserver
    un permis de classe 5 ?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: B
  explanation: Au Nunavut, les conducteurs doivent soumettre un rapport d'examen médical
    lorsqu'ils atteignent l'âge de 70 ans, puis périodiquement par la suite (à 75
    ans, 80 ans, et annuellement après 80 ans).
- id: 147
  category: penalties_and_points
  question: Au Nunavut, combien de points d'inaptitude sont inscrits à votre dossier
    de conduite pour « conduite imprudente » ?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Selon le système de points d'inaptitude de la Loi sur les véhicules
    automobiles du Nunavut, la conduite imprudente est une infraction grave qui entraîne
    6 points d'inaptitude.
- id: 148
  category: penalties_and_points
  question: Si un conducteur au Nunavut ne reste pas sur les lieux d'un accident,
    combien de points d'inaptitude seront ajoutés à son dossier ?
  choices:
    A: 5 points
    B: 6 points
    C: 7 points
    D: 10 points
  answer: C
  explanation: Le fait de ne pas rester sur les lieux d'un accident est l'une des
    infractions les plus lourdement sanctionnées en points au Nunavut, entraînant
    7 points d'inaptitude.
- id: 149
  category: penalties_and_points
  question: Quelle est la pénalité en points d'inaptitude pour avoir omis de s'arrêter
    pour un autobus scolaire dont les feux rouges clignotent au Nunavut ?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: D
  explanation: Pour assurer la sécurité des enfants, l'omission de s'arrêter pour
    un autobus scolaire aux feux rouges clignotants entraîne 6 points d'inaptitude.
- id: 150
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour avoir dépassé la limite
    de vitesse de plus de 25 km/h au Nunavut ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Un excès de vitesse de plus de 25 km/h au-dessus de la limite affichée
    entraîne 4 points d'inaptitude au Nunavut.
- id: 151
  category: penalties_and_points
  question: Si un conducteur titulaire d'un permis complet accumule 15 points d'inaptitude
    ou plus sur une période de deux ans pour la deuxième fois, quelle est la durée
    de la suspension du permis ?
  choices:
    A: 1 mois
    B: 3 mois
    C: 6 mois
    D: 1 an
  answer: B
  explanation: Au Nunavut, une deuxième suspension sur une période de deux ans pour
    avoir accumulé 15 points dure 3 mois.
- id: 152
  category: penalties_and_points
  question: 'Au Nunavut, un agent de la paix peut imposer une suspension immédiate
    de 24 heures si le taux d''alcoolémie (BAC) d''un conducteur est égal ou supérieur
    à :'
  choices:
    A: 0,03
    B: 0,05
    C: 0,08
    D: 0,10
  answer: B
  explanation: Un agent de la paix peut imposer une suspension de 24 heures s'il a
    des motifs raisonnables de croire qu'un conducteur a un taux d'alcoolémie (BAC)
    de 0,05 ou plus (la zone d'avertissement).
- id: 153
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour avoir « suivi de trop
    près » au Nunavut ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Suivre un autre véhicule de trop près (talonner) entraîne 4 points
    d'inaptitude au Nunavut.
- id: 154
  category: penalties_and_points
  question: Au Nunavut, si vous êtes reconnu coupable de conduite sans assurance de
    responsabilité civile valide, quelle est l'amende maximale pour une première infraction
    ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 500 $
    D: 5 000 $
  answer: C
  explanation: Conduire sans assurance est une infraction grave au Nunavut et peut
    entraîner une amende allant jusqu'à 2 500 $ pour une première infraction.
- id: 155
  category: penalties_and_points
  question: Combien de points d'inaptitude sont appliqués pour la « conduite acrobatique
    » ou les « courses » sur une route du Nunavut ?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Faire la course avec un véhicule à moteur sur une route est une infraction
    majeure et entraîne 6 points d'inaptitude.
- id: 156
  category: penalties_and_points
  question: Au Nunavut, pendant combien de temps les points d'inaptitude restent-ils
    à votre dossier de conduite à compter de la date de la condamnation ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: B
  explanation: Les points d'inaptitude sont retirés de votre dossier deux ans après
    la date de la condamnation.
- id: 157
  category: penalties_and_points
  question: Quelle est la pénalité en points d'inaptitude pour avoir omis d'obéir
    à un panneau d'arrêt ou à un signal de circulation au Nunavut ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: L'omission d'obéir à un panneau d'arrêt ou à un feu de circulation
    entraîne 3 points d'inaptitude.
- id: 158
  category: penalties_and_points
  question: Si le permis d'un conducteur est suspendu pour la troisième fois en deux
    ans en raison de points d'inaptitude, quelle sera la durée de la suspension ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 12 mois
    D: Indéfiniment
  answer: B
  explanation: Une troisième suspension pour avoir accumulé 15 points d'inaptitude
    sur une période de deux ans entraîne une suspension de 6 mois au Nunavut.
- id: 159
  category: penalties_and_points
  question: Au Nunavut, quelle est la pénalité en points d'inaptitude pour l'utilisation
    d'un appareil de communication électronique portatif (conduite distraite) au volant
    d'un véhicule ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: La conduite distraite, comme l'utilisation d'un téléphone portable
    tenu à la main, entraîne 3 points d'inaptitude au Nunavut.
- id: 160
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués à un conducteur au Nunavut
    pour une condamnation pour « conduite imprudente » ?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: D
  explanation: La conduite imprudente est considérée comme une infraction grave au
    Nunavut et entraîne une pénalité de 6 points d'inaptitude.
- id: 161
  category: penalties_and_points
  question: Si un conducteur est reconnu coupable d'une première infraction au Code
    criminel liée à la conduite d'un véhicule à moteur, quelle est la période de suspension
    de permis obligatoire minimale au Nunavut ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 1 an
    D: 2 ans
  answer: C
  explanation: En vertu de la Loi sur les véhicules automobiles du Nunavut, une première
    condamnation pour une infraction au Code criminel liée à un véhicule à moteur
    entraîne une suspension de permis obligatoire de 12 mois (1 an).
- id: 162
  category: penalties_and_points
  question: L'utilisation d'un appareil de communication électronique portatif au
    volant au Nunavut entraîne combien de points d'inaptitude ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: La conduite distraite, comme l'utilisation d'un téléphone portable
    tenu à la main pendant la conduite d'un véhicule, entraîne 3 points d'inaptitude
    au Nunavut.
- id: 163
  category: penalties_and_points
  question: Au Nunavut, le fait de ne pas céder le passage à un piéton dans un passage
    pour piétons entraîne combien de points d'inaptitude ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Le fait de ne pas céder le passage à un piéton à un passage pour piétons
    est passible d'une pénalité de 3 points d'inaptitude.
- id: 164
  category: penalties_and_points
  question: Combien de points d'inaptitude sont imposés pour avoir omis de signaler
    un virage ou un changement de voie au Nunavut ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Le fait de ne pas utiliser de clignotant lors d'un virage ou d'un changement
    de voie entraîne 2 points d'inaptitude.
- id: 165
  category: penalties_and_points
  question: Au Nunavut, combien de points d'inaptitude sont ajoutés à votre dossier
    pour avoir suivi un autre véhicule de trop près ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Suivre de trop près (talonner) est une infraction entraînant 4 points
    d'inaptitude au Nunavut.
- id: 166
  category: penalties_and_points
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    qui ne reste pas sur les lieux d'un accident ?
  choices:
    A: 5 points
    B: 6 points
    C: 7 points
    D: 8 points
  answer: C
  explanation: Le fait de ne pas rester sur les lieux d'un accident est l'une des
    infractions les plus graves au Nunavut, entraînant 7 points d'inaptitude.
- id: 167
  category: penalties_and_points
  question: Le fait de ne pas s'arrêter à un panneau d'arrêt ou à un feu rouge au
    Nunavut entraîne combien de points d'inaptitude ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Le non-respect d'un panneau d'arrêt ou d'un feu rouge entraîne 3 points
    d'inaptitude.
- id: 168
  category: penalties_and_points
  question: Pour un conducteur titulaire d'un permis complet au Nunavut, à quel taux
    d'alcoolémie (BAC) pouvez-vous être accusé d'une infraction au Code criminel ?
  choices:
    A: 0,02 % (20 mg)
    B: 0,05 % (50 mg)
    C: 0,08 % (80 mg)
    D: 0,10 % (100 mg)
  answer: C
  explanation: Bien que les sanctions administratives puissent commencer à des niveaux
    inférieurs (la zone d'avertissement), 0,08 % est la limite légale pour les accusations
    de conduite avec facultés affaiblies en vertu du Code criminel au Nunavut et dans
    tout le Canada.
- id: 169
  category: sharing_the_road
  question: À une intersection où il n'y a pas de passages pour piétons marqués ni
    de signaux « traversez », qui a la priorité ?
  choices:
    A: L'automobiliste, car il n'y a pas de passage pour piétons marqué
    B: Le piéton, car chaque intersection est considérée comme un « passage pour piétons
      non marqué »
    C: La personne qui arrive à l'intersection en premier
    D: L'automobiliste, mais seulement s'il tourne à droite
  answer: B
  explanation: Au Nunavut, les piétons ont la priorité à toutes les intersections,
    que le passage pour piétons soit marqué ou non, à moins que la circulation ne
    soit réglée autrement par des signaux routiers.
- id: 170
  category: sharing_the_road
  question: Lorsque vous dépassez un cycliste sur une route au Nunavut, quelle est
    la distance de sécurité minimale recommandée que vous devez maintenir entre votre
    véhicule et le cycliste ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 3 mètres
    D: La largeur d'une voiture
  answer: B
  explanation: Pour assurer la sécurité des cyclistes, les conducteurs doivent laisser
    au moins un mètre d'espace lors d'un dépassement. Les cyclistes peuvent avoir
    besoin de faire un écart pour éviter des nids-de-poule ou des débris.
- id: 171
  category: sharing_the_road
  question: Si vous conduisez derrière un gros camion commercial, pourquoi devriez-vous
    augmenter votre distance de sécurité plus que vous ne le feriez pour une voiture
    de tourisme ?
  choices:
    A: Les camions sont tenus de rouler plus lentement que la limite de vitesse
    B: Pour vous permettre d'avoir une meilleure vue de la route devant vous, que
      le camion bloque
    C: Parce que les camions ont de meilleurs freins et s'arrêtent plus vite que les
      voitures
    D: Pour que le conducteur du camion puisse voir vos phares dans son rétroviseur
      intérieur
  answer: B
  explanation: Suivre de trop près un gros camion (talonner) vous place dans la «
    zone d'ombre » (angle mort) du camion et limite considérablement votre vision
    de la route et des conditions de circulation à venir.
- id: 172
  category: sharing_the_road
  question: Au Nunavut, que devez-vous faire lorsque vous voyez une personne avec
    une canne blanche ou un chien-guide à un passage pour piétons ?
  choices:
    A: Klaxonner pour lui signaler votre présence
    B: Ralentir et avancer avec prudence
    C: S'arrêter et lui céder le passage, car elle est malvoyante
    D: La contourner s'il y a assez d'espace
  answer: C
  explanation: Les conducteurs doivent faire preuve d'une extrême prudence et céder
    le passage aux piétons munis d'une canne blanche ou d'un chien-guide, car cela
    indique que la personne est malvoyante.
- id: 173
  category: sharing_the_road
  question: 'Lorsqu''un gros camion tourne à droite à une intersection, vous devez
    savoir que :'
  choices:
    A: Le camion restera toujours dans la voie la plus à droite
    B: Le camion peut avoir besoin de faire un large écart vers la gauche pour éviter
      le trottoir
    C: Le camion a le même rayon de braquage qu'une voiture
    D: Vous devriez accélérer pour dépasser le camion par la droite avant qu'il ne
      tourne
  answer: B
  explanation: Les gros véhicules ont un rayon de braquage beaucoup plus large. Les
    conducteurs ne devraient jamais tenter de dépasser un camion par la droite à une
    intersection, car le camion peut dévier vers la gauche avant de tourner à droite.
- id: 174
  category: sharing_the_road
  question: Dans de nombreuses communautés du Nunavut, vous pouvez partager la route
    avec des motoneiges ou des VTT. Quelle est la règle clé pour les conducteurs de
    véhicules à moteur concernant ces véhicules ?
  choices:
    A: Les motoneiges ont toujours la priorité sur les routes publiques
    B: Les véhicules à moteur doivent céder le passage aux motoneiges en tout temps
    C: Soyez attentif aux motoneiges qui traversent la route et traitez-les avec le
      même respect que les autres véhicules à moteur
    D: Les motoneiges ne sont pas autorisées à traverser les routes publiques
  answer: C
  explanation: Les motoneiges et les VTT sont courants au Nunavut. Bien qu'ils aient
    des règles spécifiques pour traverser les routes, les conducteurs de voitures
    doivent rester vigilants à leur égard et partager la route en toute sécurité.
- id: 175
  category: sharing_the_road
  question: Lorsque vous suivez une moto, pourquoi devriez-vous maintenir une distance
    de sécurité plus grande que lorsque vous suivez une voiture ?
  choices:
    A: Les motos sont beaucoup plus lourdes et mettent plus de temps à s'arrêter
    B: Les motos peuvent s'arrêter très rapidement et sont plus facilement affectées
      par les dangers de la route comme le gravier ou la glace
    C: La loi exige que les motocyclistes soient suivis à une distance d'au moins
      4 secondes
    D: Les motos ont des feux de freinage très brillants qui peuvent vous éblouir
  answer: B
  explanation: Les motos sont légères et peuvent s'arrêter rapidement. De plus, des
    dangers comme le gravier meuble ou les plaques glissantes (courants au Nunavut)
    peuvent faire tomber un motocycliste, ce qui nécessite que vous ayez suffisamment
    d'espace pour réagir.
- id: 176
  category: sharing_the_road
  question: Si vous êtes arrêté derrière un autobus scolaire dont les feux rouges
    clignotent, quand êtes-vous autorisé à repartir ?
  choices:
    A: Dès que le dernier enfant est descendu de l'autobus
    B: Lorsque le conducteur de l'autobus vous fait signe de passer
    C: Seulement lorsque les feux rouges cessent de clignoter et que le bras d'arrêt
      est rétracté
    D: Après avoir attendu au moins 30 secondes
  answer: C
  explanation: Il est illégal et dangereux de dépasser un autobus scolaire tant que
    les feux rouges n'ont pas complètement cessé de clignoter et que le bras d'arrêt
    n'a pas été retiré.
- id: 177
  category: sharing_the_road
  question: Pendant les périodes d'obscurité prolongée au Nunavut, quelle est la chose
    la plus importante qu'un conducteur puisse faire pour protéger les piétons ?
  choices:
    A: Conduire avec les feux de route allumés en tout temps
    B: Ne conduire que sur les routes principales
    C: Surveiller attentivement les abords de la route et réduire la vitesse dans
      les zones résidentielles
    D: Klaxonner à chaque intersection pour avertir les piétons
  answer: C
  explanation: La visibilité est faible pendant la saison sombre. Les conducteurs
    doivent être extrêmement vigilants, en surveillant les piétons qui pourraient
    porter des vêtements sombres et en réduisant leur vitesse pour permettre un temps
    de réaction plus long.
- id: 178
  category: sharing_the_road
  question: 'Lorsqu''un véhicule d''escorte (véhicule pilote) muni de feux clignotants
    ambrés précède un chargement large ou un véhicule hors normes, vous devez :'
  choices:
    A: Dépasser le véhicule hors normes le plus rapidement possible
    B: Augmenter votre distance de sécurité et vous préparer à vous ranger sur le
      côté ou à vous arrêter
    C: Conduire entre le véhicule d'escorte et le chargement hors normes
    D: Ignorer le véhicule d'escorte car il n'a aucune autorité légale
  answer: B
  explanation: Les véhicules d'escorte signalent un chargement hors normes qui peut
    occuper plus d'une voie. Les conducteurs doivent ralentir, rester en retrait et
    suivre les instructions du conducteur du véhicule d'escorte ou des signaleurs.
- id: 179
  category: sharing_the_road
  question: Que devez-vous faire si vous vous trouvez dans une intersection et que
    vous entendez une sirène d'urgence ?
  choices:
    A: S'arrêter immédiatement au milieu de l'intersection
    B: Reculer pour sortir de l'intersection
    C: Dégager l'intersection en la traversant, puis se ranger sur la droite et s'arrêter
    D: Tourner à gauche pour libérer le passage
  answer: C
  explanation: Ne vous arrêtez jamais au milieu d'une intersection. Si un véhicule
    d'urgence s'approche, terminez votre virage ou traversez d'abord l'intersection,
    puis rangez-vous sur la droite dès que cela est sécuritaire.
- id: 180
  category: sharing_the_road
  question: 'Lorsque vous partagez la route avec de l''équipement lourd comme des
    chargeuses ou des niveleuses (courantes au Nunavut pour le déneigement), vous
    devez :'
  choices:
    A: Supposer que l'opérateur peut vous voir car il est assis en hauteur
    B: Leur laisser beaucoup d'espace car ils ont de grands angles morts et peuvent
      se déplacer de manière imprévisible
    C: Suivre de près pour rester dans le chemin qu'ils ont déblayé
    D: Les dépasser uniquement par le côté droit
  answer: B
  explanation: Les opérateurs d'équipement lourd ont une visibilité limitée et les
    machines peuvent être bruyantes, ce qui les empêche d'entendre les autres véhicules.
    Laissez-leur toujours une large marge de manœuvre.
- id: 181
  category: sharing_the_road
  question: Au Nunavut, quelle est la règle concernant les cortèges funèbres ?
  choices:
    A: Vous devez accélérer pour dépasser l'ensemble du cortège
    B: Vous ne devez pas interrompre ou gêner un cortège funèbre
    C: Les cortèges funèbres doivent respecter toutes les règles normales de priorité
      aux panneaux d'arrêt
    D: Vous êtes tenu de vous ranger sur le côté et de vous arrêter jusqu'à ce que
      le cortège passe
  answer: B
  explanation: C'est une question de courtoisie et de sécurité dans de nombreuses
    juridictions, y compris au Nunavut, de ne pas couper ou gêner un cortège funèbre
    dirigé par un véhicule de tête muni de feux clignotants.
- id: 182
  category: sharing_the_road
  question: Au Nunavut, combien de points d'inaptitude sont inscrits au dossier d'un
    conducteur qui ne s'arrête pas pour un autobus scolaire dont les feux rouges clignotent
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: Le fait de ne pas s'arrêter pour un autobus scolaire est considéré
    comme une infraction grave à la sécurité au Nunavut et entraîne l'inscription
    de 6 points d'inaptitude.
- id: 183
  category: sharing_the_road
  question: Lorsque vous dépassez un cycliste sur une chaussée au Nunavut, quelle
    est la pratique de suivi et de dépassement sécuritaire recommandée ?
  choices:
    A: Partager la voie côte à côte avec le cycliste
    B: Laisser au moins un mètre d'espace entre votre véhicule et le vélo
    C: Klaxonner continuellement jusqu'à ce que le cycliste quitte la route
    D: Passer aussi près que possible pour encourager le cycliste à utiliser le trottoir
  answer: B
  explanation: Les conducteurs doivent traiter les cyclistes comme les autres véhicules
    et laisser un espace d'au moins un mètre lors du dépassement pour assurer la sécurité.
- id: 184
  category: sharing_the_road
  question: 'Les gros camions commerciaux ont des « angles morts » où le conducteur
    ne peut pas voir les autres véhicules. Ces zones sont couramment appelées :'
  choices:
    A: Zones de sécurité
    B: No-Zones (Zones de danger)
    C: Zones dégagées
    D: Zones tampons
  answer: B
  explanation: La « No-Zone » fait référence aux angles morts importants situés à
    l'avant, à l'arrière et sur les côtés d'un camion, où les véhicules de tourisme
    peuvent disparaître de la vue du conducteur du camion.
- id: 185
  category: sharing_the_road
  question: Si vous conduisez sur une route avec un terre-plein central (route à chaussées
    séparées) et que vous voyez un autobus scolaire arrêté de l'autre côté du terre-plein
    avec ses feux rouges clignotants, devez-vous vous arrêter ?
  choices:
    A: Oui, vous devez toujours vous arrêter pour un autobus scolaire
    B: Non, les conducteurs circulant de l'autre côté d'une route à chaussées séparées
      n'ont pas besoin de s'arrêter
    C: Oui, mais seulement si des enfants sont visibles
    D: Non, mais vous devez accélérer pour dégager la zone
  answer: B
  explanation: Sur une route à chaussées séparées où il y a un terre-plein central
    physique ou une barrière, la circulation venant de la direction opposée à l'autobus
    scolaire n'est pas tenue de s'arrêter.
- id: 186
  category: sharing_the_road
  question: Au Nunavut, que devez-vous faire à l'approche d'un véhicule d'urgence
    ou d'une dépanneuse immobilisé sur le bord de la route avec ses gyrophares allumés
    ?
  choices:
    A: Maintenir votre vitesse et rester dans votre voie
    B: Ralentir à une vitesse sécuritaire et se déporter sur la voie de gauche si
      cela peut se faire en toute sécurité
    C: S'arrêter immédiatement sur la chaussée
    D: Allumer vos feux de route pour alerter les intervenants d'urgence
  answer: B
  explanation: Les conducteurs sont tenus de ralentir et, si la route comporte plusieurs
    voies, de se déplacer vers la voie la plus éloignée du véhicule d'urgence pour
    créer une zone tampon de sécurité.
- id: 187
  category: sharing_the_road
  question: Lorsqu'un piéton utilise une canne blanche ou est accompagné d'un chien-guide
    à un passage pour piétons, qu'est-ce que cela indique au conducteur ?
  choices:
    A: Le piéton est un représentant du gouvernement
    B: Le piéton a une déficience visuelle et a la priorité
    C: Le piéton dresse un chien et doit être ignoré
    D: Le conducteur doit klaxonner pour faire savoir au piéton qu'il peut traverser
      en toute sécurité
  answer: B
  explanation: Une canne blanche ou un chien-guide indique que le piéton est aveugle
    ou malvoyant. Les conducteurs doivent faire preuve d'une extrême prudence et céder
    le passage.
- id: 188
  category: sharing_the_road
  question: Selon la loi du Nunavut, quelle est la distance minimale que vous devez
    maintenir lorsque vous suivez un véhicule d'urgence dont les gyrophares ou les
    sirènes sont activés ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Il est illégal de suivre à moins de 150 mètres un véhicule d'urgence
    répondant à un appel.
- id: 189
  category: sharing_the_road
  question: Pourquoi devriez-vous éviter de vous rabattre brusquement devant un gros
    camion immédiatement après l'avoir dépassé ?
  choices:
    A: Les camions ont un réservoir de carburant plus petit
    B: Les camions nécessitent une distance d'arrêt beaucoup plus longue que les voitures
    C: Les conducteurs de camions sont légalement autorisés à percuter les voitures
      qui leur coupent la route
    D: C'est considéré comme une violation de la « No-Zone » passible d'une suspension
      de permis
  answer: B
  explanation: En raison de leur poids, les gros camions ont besoin de beaucoup plus
    de distance pour s'arrêter. Se rabattre brusquement devant eux supprime leur marge
    de sécurité.
- id: 190
  category: sharing_the_road
  question: Dans de nombreuses communautés du Nunavut, les motoneiges et les VTT partagent
    la route ou la traversent fréquemment. Quelle est la responsabilité principale
    d'un conducteur concernant ces véhicules ?
  choices:
    A: Supposer que la motoneige s'arrêtera toujours
    B: S'attendre à ce qu'ils circulent à la même vitesse que les voitures
    C: Faire preuve d'une prudence accrue et céder le passage car ils peuvent être
      moins stables ou moins visibles
    D: Les forcer à quitter la route car ce ne sont pas de « vrais » véhicules
  answer: C
  explanation: Dans le Nord, les véhicules hors route sont courants. Les conducteurs
    doivent être vigilants, en particulier aux croisements de sentiers, car ces véhicules
    peuvent être conduits par de jeunes conducteurs ou être moins visibles dans des
    conditions de neige.
- id: 191
  category: sharing_the_road
  question: Si vous êtes arrêté à un feu rouge et qu'un véhicule d'urgence avec des
    sirènes s'approche par derrière, que devez-vous faire ?
  choices:
    A: Brûler le feu rouge pour dégager la voie
    B: Rester sur place si vous ne pouvez pas vous déplacer en toute sécurité vers
      la droite sans entrer dans l'intersection
    C: Tourner immédiatement à gauche
    D: Reculer dans la voiture derrière vous
  answer: B
  explanation: Vous ne devez jamais vous engager dans une intersection contre un feu
    rouge pour dégager le passage. Si vous ne pouvez pas vous ranger en toute sécurité
    sur la droite, restez arrêté jusqu'à ce que le feu change ou que le véhicule d'urgence
    trouve un moyen de contourner.
- id: 192
  category: vehicle_information
  question: Au Nunavut, quelle est la profondeur de sculpture minimale légale pour
    les pneus d'un véhicule de tourisme ?
  choices:
    A: 0,5 millimètre
    B: 1,0 millimètre
    C: 1,6 millimètre
    D: 3,2 millimètres
  answer: C
  explanation: Selon les normes de sécurité des véhicules au Nunavut, les pneus doivent
    avoir une profondeur de sculpture minimale de 1,6 millimètre (environ 2/32 de
    pouce) pour être considérés comme sûrs et légaux.
- id: 193
  category: vehicle_information
  question: Selon la Loi sur les véhicules automobiles du Nunavut, quand les phares
    d'un véhicule doivent-ils être allumés ?
  choices:
    A: Uniquement entre 23 h 00 et 5 h 00
    B: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    C: Chaque fois que vous conduisez sur une route de gravier
    D: D'une demi-heure après le coucher du soleil à une demi-heure avant le lever
      du soleil, ou lorsque la visibilité est inférieure à 150 mètres
  answer: D
  explanation: Les phares doivent être utilisés de 30 minutes après le coucher du
    soleil à 30 minutes avant le lever du soleil, et à tout moment lorsque les conditions
    atmosphériques (brouillard, neige, etc.) réduisent la visibilité à moins de 150
    mètres.
- id: 194
  category: vehicle_information
  question: À l'approche d'un véhicule venant en sens inverse la nuit, à quelle distance
    devez-vous passer des feux de route aux feux de croisement ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 300 mètres
  answer: C
  explanation: Vous devez passer de vos feux de route (pleins phares) aux feux de
    croisement au moins 150 mètres avant de croiser un véhicule venant en sens inverse.
- id: 195
  category: vehicle_information
  question: Tout véhicule automobile circulant sur les routes du Nunavut doit être
    équipé de combien de systèmes de freinage distincts ?
  choices:
    A: Un système hydraulique
    B: Deux, comprenant un frein de service et un frein de stationnement/d'urgence
    C: Trois, incluant un système antiblocage (ABS)
    D: Un seul, à condition qu'il s'agisse d'un système à double circuit
  answer: B
  explanation: 'La loi exige deux systèmes de freinage indépendants : le frein de
    service (frein au pied) et le frein de stationnement ou d''urgence.'
- id: 196
  category: vehicle_information
  question: Si le rétroviseur intérieur d'un véhicule est obstrué par un chargement
    ou une remorque, quelle est l'exigence légale pour les rétroviseurs latéraux au
    Nunavut ?
  choices:
    A: Aucun rétroviseur supplémentaire n'est requis si le conducteur utilise un signaleur
    B: Seul un rétroviseur extérieur gauche est requis
    C: Des rétroviseurs doivent être fixés sur les côtés gauche et droit, offrant
      une vue dégagée sur 60 mètres vers l'arrière
    D: Le véhicule ne peut pas être conduit légalement tant que l'obstruction n'est
      pas retirée
  answer: C
  explanation: Si le rétroviseur intérieur ne permet pas une vue dégagée de la route
    vers l'arrière, le véhicule doit être équipé de rétroviseurs sur les côtés gauche
    et droit.
- id: 197
  category: vehicle_information
  question: 'Au Nunavut, le klaxon d''un véhicule automobile doit être audible dans
    des conditions normales à une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 200 mètres
  answer: B
  explanation: Un véhicule automobile doit être muni d'un klaxon en bon état de fonctionnement
    capable d'émettre un son audible dans des conditions normales à une distance d'au
    moins 60 mètres.
- id: 198
  category: vehicle_information
  question: En ce qui concerne la teinte des vitres au Nunavut, laquelle des situations
    suivantes est interdite ?
  choices:
    A: Toute teinte sur la lunette arrière
    B: La teinte sur les vitres latérales arrière
    C: La teinte non d'origine sur le pare-brise et les vitres situées immédiatement
      à gauche et à droite du conducteur
    D: La teinte installée en usine sur n'importe quelle vitre
  answer: C
  explanation: Pour des raisons de sécurité et de visibilité, la teinte non d'origine
    (après-vente) est généralement interdite sur le pare-brise et les vitres latérales
    avant (côtés conducteur et passager).
- id: 199
  category: vehicle_information
  question: Quelle est la réglementation concernant le système d'échappement et les
    silencieux des véhicules au Nunavut ?
  choices:
    A: Les silencieux sont facultatifs sur les véhicules de plus de 20 ans
    B: Un dispositif de dérivation ou de coupure du silencieux est autorisé pour un
      usage hors route uniquement
    C: Tout véhicule automobile doit être muni d'un silencieux en bon état de fonctionnement
      pour éviter un bruit excessif
    D: Les tuyaux d'échappement doivent sortir par l'avant du véhicule
  answer: C
  explanation: La Loi sur les véhicules automobiles exige que tous les véhicules soient
    équipés d'un silencieux efficace. Les dispositifs tels que les « dérivations de
    silencieux » ou les « bypass » qui augmentent le bruit sont illégaux.
- id: 200
  category: vehicle_information
  question: Au Nunavut, un enfant doit être attaché dans un siège d'auto pour nouveau-né
    orienté vers l'arrière jusqu'à ce qu'il atteigne quel poids minimal ?
  choices:
    A: 5 kg (11 lb)
    B: 10 kg (22 lb)
    C: 18 kg (40 lb)
    D: 25 kg (55 lb)
  answer: B
  explanation: Les règlements de sécurité exigent que les nourrissons soient dans
    un siège orienté vers l'arrière jusqu'à ce qu'ils pèsent au moins 10 kg (22 lb)
    et qu'ils soient capables de marcher sans aide (bien qu'il soit recommandé de
    les garder orientés vers l'arrière plus longtemps).
- id: 201
  category: vehicle_information
  question: 'La nuit, la plaque d''immatriculation arrière d''un véhicule au Nunavut
    doit être éclairée par une lumière blanche de manière à être lisible à une distance
    d''au moins :'
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 30 mètres
  answer: C
  explanation: La plaque d'immatriculation arrière doit être éclairée de manière à
    être clairement visible à une distance de 15 mètres vers l'arrière.
- id: 202
  category: vehicle_information
  question: Les véhicules d'une largeur supérieure à 2,05 mètres (80 pouces) doivent
    être munis de feux de gabarit. De quelle couleur doivent être les feux de gabarit
    à l'avant du véhicule ?
  choices:
    A: Blanc
    B: Ambre
    C: Rouge
    D: Bleu
  answer: B
  explanation: Les feux de gabarit avant doivent être de couleur ambre, tandis que
    les feux de gabarit arrière doivent être rouges, afin d'indiquer la largeur du
    véhicule aux autres conducteurs.
- id: 203
  category: vehicle_information
  question: Bien qu'il ne s'agisse pas d'une exigence légale pour le fonctionnement
    mécanique du véhicule, que recommande vivement le Manuel du conducteur du Nunavut
    à tous les conducteurs d'emporter pour les déplacements hivernaux ?
  choices:
    A: Un jeu de bougies d'allumage supplémentaire
    B: Un bloc-moteur de rechange complet
    C: Une trousse de survie d'urgence comprenant des couvertures, de la nourriture
      et une pelle
    D: Un récepteur de télévision par satellite
  answer: C
  explanation: En raison des conditions météorologiques extrêmes et de l'isolement
    au Nunavut, le manuel insiste sur le transport d'une trousse de survie d'urgence
    pour des raisons de sécurité.
- id: 204
  category: vehicle_information
  question: Selon la loi du Nunavut, quelle est l'exigence relative aux essuie-glaces
    sur un véhicule à moteur ?
  choices:
    A: Ils ne sont requis que pendant les mois d'été
    B: Un véhicule doit avoir au moins un essuie-glace manuel
    C: Tout véhicule à moteur (sauf les motocyclettes) doit être équipé d'un système
      d'essuie-glace motorisé
    D: Les essuie-glaces ne sont pas requis si le pare-brise est traité avec des produits
      hydrofuges
  answer: C
  explanation: Les véhicules à moteur doivent être équipés d'un système d'essuie-glace
    motorisé pouvant être commandé par le conducteur pour assurer une vision claire.
- id: 205
  category: vehicle_information
  question: Au Nunavut, quand les phares d'un véhicule doivent-ils être allumés ?
  choices:
    A: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    B: Uniquement lorsqu'il neige ou qu'il y a du brouillard
    C: D'une demi-heure après le coucher du soleil à une demi-heure avant le lever
      du soleil, et chaque fois que la visibilité est inférieure à 150 mètres
    D: Uniquement entre 22 h 00 et 6 h 00
  answer: C
  explanation: Selon le Manuel du conducteur du Nunavut, les phares doivent être utilisés
    d'une demi-heure après le coucher du soleil à une demi-heure avant le lever du
    soleil, et à tout moment lorsque les conditions atmosphériques (comme la neige
    ou le brouillard) réduisent la visibilité à moins de 150 mètres.
- id: 206
  category: vehicle_information
  question: En ce qui concerne les vitres des véhicules, laquelle des situations suivantes
    est illégale au Nunavut ?
  choices:
    A: Avoir une teinte sur les vitres latérales arrière
    B: Utiliser du verre clair sur le pare-brise
    C: Appliquer un film teinté sur le pare-brise qui obstrue la vue du conducteur
    D: Avoir une fissure dans le pare-brise de moins de 2 cm de long
  answer: C
  explanation: Il est illégal d'appliquer tout film ou teinte sur le pare-brise qui
    gêne la vue du conducteur ou d'avoir un pare-brise tellement fissuré ou embué
    qu'il obstrue la vision.
- id: 207
  category: vehicle_information
  question: Quelles sont les exigences relatives aux rétroviseurs au Nunavut si la
    vue du rétroviseur intérieur est obstruée par une remorque ou un chargement ?
  choices:
    A: Aucun rétroviseur supplémentaire n'est requis si vous utilisez un signaleur
    B: Vous devez installer un système de caméra
    C: Vous devez avoir un rétroviseur extérieur sur les côtés gauche et droit du
      véhicule
    D: Vous n'avez besoin que d'un rétroviseur extérieur côté gauche
  answer: C
  explanation: Si le rétroviseur intérieur ne permet pas une vue claire de la route
    sur au moins 60 mètres vers l'arrière, le véhicule doit être équipé de rétroviseurs
    extérieurs sur les côtés gauche et droit.
- id: 208
  category: vehicle_information
  question: Laquelle des conditions suivantes est une exigence pour le système d'échappement
    d'un véhicule au Nunavut ?
  choices:
    A: Il doit être équipé d'un silencieux qui empêche le bruit et la fumée excessifs
      ou inhabituels
    B: Il doit avoir un « tuyau direct » pour une meilleure efficacité énergétique
    C: Il doit être modifié pour être aussi bruyant que possible pour la sécurité
    D: Les silencieux sont facultatifs sur les véhicules de plus de 20 ans
  answer: A
  explanation: Tout véhicule à moteur doit être muni d'un silencieux en bon état de
    fonctionnement pour éviter les bruits et la fumée excessifs. Les dispositifs de
    dérivation ou de coupure du silencieux sont interdits.
- id: 209
  category: vehicle_information
  question: 'Les feux de signalisation (clignotants) d''un véhicule doivent être visibles
    en plein soleil à une distance d''au moins :'
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 60 mètres
    D: 100 mètres
  answer: B
  explanation: Les feux de signalisation doivent être visibles à une distance de 30
    mètres en plein soleil.
- id: 210
  category: vehicle_information
  question: Lequel des équipements suivants est obligatoire pour tous les véhicules
    à moteur circulant au Nunavut afin de garantir que le pare-brise reste dégagé
    ?
  choices:
    A: Un grattoir manuel uniquement
    B: Un système d'essuie-glace et un système de dégivrage/désembuage
    C: Un système de brosses automatisé
    D: Des balais d'essuie-glace chauffants
  answer: B
  explanation: Les véhicules doivent être équipés d'essuie-glaces fonctionnels et
    d'un système de dégivrage ou de désembuage pour maintenir une vue claire à travers
    le pare-brise.
- id: 211
  category: vehicle_information
  question: Quelle est l'exigence concernant le panneau « Véhicule lent » au Nunavut
    ?
  choices:
    A: Il doit être affiché sur tout véhicule circulant à plus de 60 km/h
    B: Il doit être affiché à l'avant de tous les tracteurs
    C: Il doit être affiché à l'arrière des véhicules conçus pour circuler à des vitesses
      de 40 km/h ou moins
    D: Il n'est requis que pour les véhicules circulant de nuit
  answer: C
  explanation: Un panneau « Véhicule lent » (un triangle orange avec une bordure rouge)
    doit être fixé à l'arrière de tout véhicule qui n'est pas capable de maintenir
    une vitesse supérieure à 40 km/h.
- id: 212
  category: vehicle_information
  question: 'Au Nunavut, le frein de stationnement doit être capable de maintenir
    le véhicule :'
  choices:
    A: Uniquement sur un terrain plat
    B: Sur n'importe quelle pente (inclinaison) sur laquelle il est utilisé
    C: Uniquement lorsque le moteur tourne
    D: Pendant un maximum de 10 minutes
  answer: B
  explanation: Le frein de stationnement doit être adéquat pour maintenir le véhicule
    sur n'importe quelle pente sur laquelle il est utilisé, quelles que soient les
    conditions de charge.
- id: 213
  category: signs_and_signals
  question: Au Nunavut, que signifie un feu rouge clignotant à une intersection ?
  choices:
    A: Ralentir et avancer avec prudence
    B: Le feu est sur le point de passer au rouge fixe
    C: S'arrêter complètement et ne repartir que lorsqu'on peut le faire en toute
      sécurité
    D: Céder le passage à toute la circulation venant de la droite uniquement
  answer: C
  explanation: 'Selon la Loi sur les véhicules automobiles du Nunavut, un feu rouge
    clignotant a la même signification qu''un panneau d''arrêt : les conducteurs doivent
    marquer un arrêt complet et ne repartir que lorsque c''est sécuritaire.'
- id: 214
  category: signs_and_signals
  question: 'Lorsque vous rencontrez un feu jaune (orangé) clignotant à une intersection
    au Nunavut, vous devez :'
  choices:
    A: S'arrêter et attendre que le feu passe au vert
    B: Ralentir et avancer avec prudence
    C: Accélérer pour dégager l'intersection rapidement
    D: Le traiter comme un arrêt multidirectionnel (4-way stop)
  answer: B
  explanation: Un feu jaune clignotant indique que les conducteurs doivent réduire
    leur vitesse et traverser l'intersection avec prudence, en cédant le passage aux
    piétons ou aux autres véhicules déjà engagés dans l'intersection.
- id: 215
  category: signs_and_signals
  question: Au Nunavut, qu'indique une ligne jaune continue de votre côté de la ligne
    centrale de la chaussée ?
  choices:
    A: Le dépassement est autorisé si la route est libre
    B: Le dépassement est interdit
    C: Vous êtes sur une rue à sens unique
    D: L'accotement est dangereux pour le stationnement
  answer: B
  explanation: Une ligne jaune continue de votre côté de la ligne centrale signifie
    que le dépassement est interdit car la visibilité est insuffisante pour effectuer
    la manœuvre en toute sécurité.
- id: 216
  category: signs_and_signals
  question: Quel signal manuel est la manière correcte d'indiquer un virage à droite
    au Nunavut ?
  choices:
    A: Le bras gauche tendu horizontalement par la fenêtre
    B: Le bras gauche sorti et plié vers le haut au niveau du coude
    C: Le bras gauche sorti et plié vers le bas au niveau du coude
    D: Le bras droit tendu horizontalement par la fenêtre
  answer: B
  explanation: Pour signaler un virage à droite à l'aide de signaux manuels, le conducteur
    doit sortir son bras gauche par la fenêtre et le plier vers le haut à un angle
    de 90 degrés.
- id: 217
  category: signs_and_signals
  question: Que signifie un panneau en forme de pentagone (cinq côtés) au Nunavut
    ?
  choices:
    A: Passage à niveau
    B: Céder le passage
    C: Zone scolaire ou passage pour écoliers
    D: Zone de travaux
  answer: C
  explanation: Un panneau à cinq côtés (pentagone) est spécifiquement utilisé pour
    avertir les conducteurs qu'ils entrent dans une zone scolaire ou qu'ils approchent
    d'un passage pour écoliers.
- id: 218
  category: signs_and_signals
  question: Lorsqu'un autobus scolaire au Nunavut est arrêté avec ses feux rouges
    clignotants et son bras d'arrêt déployé, que doit faire un conducteur ?
  choices:
    A: S'arrêter uniquement s'il circule dans la même direction que l'autobus
    B: Ralentir à 15 km/h et dépasser prudemment
    C: S'arrêter à au moins 5 mètres de l'autobus, quelle que soit la direction de
      circulation
    D: Klaxonner pour avertir les piétons et avancer lentement
  answer: C
  explanation: Au Nunavut, les conducteurs approchant d'un autobus scolaire avec des
    feux rouges clignotants, quelle que soit leur direction, doivent s'arrêter et
    rester à l'arrêt jusqu'à ce que les feux cessent de clignoter et que le bras soit
    rétracté.
- id: 219
  category: signs_and_signals
  question: Quelle est la signification d'un marquage en forme de losange blanc sur
    une voie spécifique au Nunavut ?
  choices:
    A: La voie est réservée aux véhicules d'urgence uniquement
    B: 'La voie est réservée à des types spécifiques de véhicules (ex. : autobus ou
      véhicules multioccupants)'
    C: La voie se termine bientôt
    D: La voie est réservée aux motoneiges uniquement
  answer: B
  explanation: Un symbole de losange blanc sur la chaussée indique une voie réservée,
    généralement pour les autobus, les taxis ou les véhicules multioccupants (VMO).
- id: 220
  category: signs_and_signals
  question: 'Si vous approchez d''une intersection et que le feu de signalisation
    passe du vert au jaune (orangé), vous devez :'
  choices:
    A: Accélérer pour dégager l'intersection
    B: S'arrêter avant d'entrer dans l'intersection, à moins d'être trop près pour
      le faire en toute sécurité
    C: S'arrêter immédiatement, même si vous êtes au milieu de l'intersection
    D: Continuer à la même vitesse
  answer: B
  explanation: Un feu jaune fixe signifie que le signal est sur le point de passer
    au rouge. Les conducteurs doivent s'arrêter s'ils peuvent le faire en toute sécurité
    ; sinon, ils doivent traverser avec prudence.
- id: 221
  category: signs_and_signals
  question: De quelle couleur sont les panneaux d'avertissement de travaux et d'entretien
    au Nunavut ?
  choices:
    A: Jaune
    B: Rouge
    C: Orange
    D: Vert
  answer: C
  explanation: Les panneaux de construction et d'entretien au Nunavut (et partout
    au Canada) utilisent un fond orange avec des symboles ou des lettres noirs pour
    alerter les conducteurs des zones de travaux.
- id: 222
  category: signs_and_signals
  question: Au Nunavut, que représente un panneau en forme de « croix de Saint-André
    » (un panneau en forme de X) ?
  choices:
    A: Une intersection dangereuse
    B: Un passage à niveau
    C: Entrée interdite
    D: Un hôpital à proximité
  answer: B
  explanation: Le panneau en croix de Saint-André est un panneau de signalisation
    réglementaire indiquant un passage à niveau. Les conducteurs doivent regarder
    et écouter si des trains approchent.
- id: 223
  category: signs_and_signals
  question: Quel est le signal manuel pour ralentir ou s'arrêter au Nunavut ?
  choices:
    A: Bras gauche tendu horizontalement
    B: Bras gauche sorti et plié vers le haut
    C: Bras gauche sorti et plié vers le bas
    D: Agiter le bras dans un mouvement circulaire
  answer: C
  explanation: Pour signaler que vous ralentissez ou que vous vous arrêtez, le bras
    gauche doit être tendu par la fenêtre et plié vers le bas au niveau du coude.
- id: 224
  category: signs_and_signals
  question: 'Un panneau comportant un cercle rouge avec une barre horizontale blanche
    au milieu signifie :'
  choices:
    A: Cédez le passage
    B: Entrée interdite
    C: Arrêt
    D: Stationnement interdit
  answer: B
  explanation: Le panneau « Entrée interdite » est un cercle rouge avec une barre
    blanche. Il est utilisé pour empêcher les conducteurs d'entrer dans une route
    ou une bretelle de sortie dans le mauvais sens.
- id: 225
  category: signs_and_signals
  question: Au Nunavut, que séparent les lignes blanches discontinues sur une chaussée
    ?
  choices:
    A: La circulation circulant dans des directions opposées
    B: La partie circulable de la route de l'accotement
    C: Les voies de circulation circulant dans la même direction
    D: Les passages pour piétons des voies pour véhicules
  answer: C
  explanation: Les lignes blanches discontinues séparent les voies de circulation
    circulant dans la même direction. Les conducteurs peuvent franchir ces lignes
    pour changer de voie lorsque cela est sécuritaire.
- id: 226
  category: signs_and_signals
  question: En approchant d'un feu jaune fixe au Nunavut, que doit faire un conducteur
    ?
  choices:
    A: Accélérer pour dégager l'intersection avant qu'il ne devienne rouge
    B: S'arrêter avant d'entrer dans l'intersection à moins que cela ne soit dangereux
    C: S'arrêter immédiatement, même au milieu de l'intersection
    D: Continuer à travers l'intersection à la même vitesse
  answer: B
  explanation: Un feu jaune fixe signifie que le signal est sur le point de passer
    au rouge. Les conducteurs doivent s'arrêter avant l'intersection, à moins qu'ils
    ne soient déjà si proches que l'arrêt serait dangereux.
- id: 227
  category: signs_and_signals
  question: Quelle est la signification d'un feu jaune clignotant à une intersection
    ?
  choices:
    A: S'arrêter et attendre le feu vert
    B: Accélérer pour dégager la zone
    C: Avancer avec prudence après avoir ralenti
    D: Céder le passage à toute la circulation venant de la droite uniquement
  answer: C
  explanation: Un feu jaune clignotant est un avertissement de ralentir et de traverser
    l'intersection avec prudence, en étant prêt à s'arrêter si nécessaire.
- id: 228
  category: signs_and_signals
  question: Au Nunavut, qu'indique un panneau avec un cercle rouge et une barre diagonale
    sur un symbole ?
  choices:
    A: Un avertissement d'un danger à venir
    B: Que l'action illustrée est autorisée avec prudence
    C: Que l'action illustrée est interdite
    D: Une zone scolaire ou un passage pour piétons
  answer: C
  explanation: Dans le système uniforme canadien utilisé au Nunavut, un cercle rouge
    avec une barre diagonale signifie que l'action spécifique (comme un virage ou
    une entrée) est interdite.
- id: 229
  category: signs_and_signals
  question: Qu'indique un panneau en forme de pentagone (cinq côtés) avec un fond
    jaune-vert fluorescent ?
  choices:
    A: Passage à niveau
    B: Zone de travaux
    C: Zone scolaire ou passage pour écoliers
    D: Zone hospitalière
  answer: C
  explanation: Un panneau en forme de pentagone est utilisé exclusivement pour avertir
    les conducteurs qu'ils approchent d'une zone scolaire ou d'un passage pour écoliers
    où des enfants peuvent être présents.
- id: 230
  category: signs_and_signals
  question: Si les clignotants de votre véhicule ne fonctionnent pas, comment devez-vous
    signaler un virage à gauche à l'aide de signaux manuels ?
  choices:
    A: Tendre le bras gauche par la fenêtre et le pointer vers le haut
    B: Tendre le bras gauche par la fenêtre et le pointer horizontalement
    C: Tendre le bras gauche par la fenêtre et le pointer vers le bas
    D: Agiter la main dans un mouvement circulaire
  answer: B
  explanation: Le signal manuel standard pour un virage à gauche consiste à tendre
    le bras gauche horizontalement par la fenêtre.
- id: 231
  category: signs_and_signals
  question: Pour signaler un virage à droite à l'aide de signaux manuels, quelle est
    la position correcte de votre bras ?
  choices:
    A: Le bras gauche tendu horizontalement vers l'extérieur
    B: Le bras gauche tendu vers l'extérieur et plié vers le haut au niveau du coude
    C: Le bras gauche tendu vers l'extérieur et plié vers le bas au niveau du coude
    D: Le bras droit tendu horizontalement par la fenêtre du passager
  answer: B
  explanation: Le signal manuel standard pour un virage à droite consiste à tendre
    le bras gauche par la fenêtre et à le plier vers le haut à un angle de 90 degrés.
- id: 232
  category: signs_and_signals
  question: Que signifie une ligne blanche continue peinte sur la chaussée entre deux
    voies de circulation circulant dans la même direction ?
  choices:
    A: Le dépassement est encouragé
    B: Le changement de voie est déconseillé ou interdit
    C: La route est à sens unique seulement
    D: Vous devez tourner à gauche
  answer: B
  explanation: Les lignes blanches continues sont utilisées pour décourager les changements
    de voie dans les zones où cela pourrait être dangereux, comme à l'approche des
    intersections ou dans les tunnels.
- id: 233
  category: signs_and_signals
  question: Quelle est la signification d'une ligne jaune discontinue de votre côté
    de la route ?
  choices:
    A: Vous pouvez dépasser si la voie est libre
    B: Le dépassement est strictement interdit
    C: Vous êtes dans une zone à sens unique
    D: Vous devez ralentir à 30 km/h
  answer: A
  explanation: Une ligne jaune discontinue indique que le dépassement est autorisé
    lorsqu'il peut se faire en toute sécurité et que la route devant est libre.
- id: 234
  category: signs_and_signals
  question: Au Nunavut, qu'indique un panneau orange en forme de losange ?
  choices:
    A: Une information réglementaire
    B: Un avertissement de travaux de construction ou d'entretien
    C: Un guidage directionnel
    D: Une zone scolaire
  answer: B
  explanation: Les panneaux orange en forme de losange sont utilisés pour avertir
    les conducteurs de travaux de construction, d'entretien ou de services publics
    sur ou à proximité de la chaussée.
- id: 235
  category: signs_and_signals
  question: Lorsque vous voyez un panneau « Cédez le passage » (Yield) à une intersection,
    que devez-vous faire ?
  choices:
    A: Toujours marquer un arrêt complet, peu importe la circulation
    B: Accélérer pour s'insérer rapidement dans la circulation
    C: Ralentir et s'arrêter si nécessaire pour céder le passage aux autres usagers
    D: Klaxonner pour avertir les autres que vous vous engagez
  answer: C
  explanation: Un panneau de céder le passage signifie que vous devez ralentir et
    être prêt à vous arrêter. Vous devez céder le passage aux piétons et aux véhicules
    déjà engagés dans l'intersection ou s'approchant sur la route transversale.
- id: 236
  category: signs_and_signals
  question: Que signifie une flèche verte affichée en même temps qu'un feu rouge ?
  choices:
    A: Vous devez vous arrêter et attendre que le feu rouge passe au vert
    B: Vous pouvez avancer prudemment dans la direction de la flèche
    C: La flèche est un avertissement que le feu est sur le point de passer au vert
    D: Vous pouvez tourner dans n'importe quelle direction
  answer: B
  explanation: Une flèche verte combinée à un feu rouge signifie que vous bénéficiez
    d'un virage « protégé » dans la direction de la flèche, bien que vous deviez toujours
    céder le passage aux piétons dans le passage pour piétons.
- id: 237
  category: signs_and_signals
  question: Au Nunavut, que représente généralement un panneau rectangulaire blanc
    avec des inscriptions ou des symboles noirs ?
  choices:
    A: Un panneau d'avertissement
    B: Un panneau de construction
    C: Un panneau de réglementation
    D: Un panneau de service routier
  answer: C
  explanation: Les panneaux rectangulaires blancs sont des panneaux de réglementation
    qui informent les conducteurs des lois et règlements de la circulation, tels que
    les limites de vitesse ou les restrictions de virage.
- id: 238
  category: signs_and_signals
  question: Que doit faire un conducteur à l'approche d'un panneau de passage à niveau
    (la croix de Saint-André) ?
  choices:
    A: Accélérer pour traverser les voies rapidement
    B: S'arrêter seulement s'il y a plus de deux voies ferrées
    C: Ralentir, regarder et écouter si un train approche
    D: Toujours s'arrêter, même si aucun train n'est visible
  answer: C
  explanation: Le panneau de passage à niveau est un avertissement incitant à ralentir,
    à regarder des deux côtés et à écouter si un train arrive. Les conducteurs doivent
    s'arrêter si un train approche ou si les signaux clignotent.
- id: 239
  category: signs_and_signals
  question: Quel est le signal manuel pour « ralentir » ou « s'arrêter » ?
  choices:
    A: Le bras gauche tendu horizontalement vers l'extérieur
    B: Le bras gauche tendu vers l'extérieur et plié vers le haut
    C: Le bras gauche tendu vers l'extérieur et plié vers le bas
    D: Le bras droit agitant de haut en bas
  answer: C
  explanation: Pour signaler que vous ralentissez ou que vous vous arrêtez, tendez
    votre bras gauche par la fenêtre et pointez-le vers le bas, la paume tournée vers
    l'arrière.
