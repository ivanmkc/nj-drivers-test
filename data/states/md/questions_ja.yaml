questions:
- id: 1
  category: driver_responsibility
  question: メリーランド州自動車局（MVA）が掲げる、メリーランド州の道路における死亡事故に関する目標は何ですか？
  choices:
    A: 死亡事故を50%削減する
    B: 死亡事故をゼロにする
    C: 死亡事故を年間100件未満に抑える
    D: 作業区間（ワークゾーン）での死亡事故のみを減らす
  answer: B
  explanation: 局長のメッセージには、「私たちの目標は、メリーランド州の道路での死亡事故をゼロにすることです。なぜなら、失われてよい命など一つもないからです」と記載されています。
- id: 2
  category: safe_driving_rules
  question: 局長のメッセージによると、ハンドルを握るたびに果たすべき責任は次のうちどれですか？
  choices:
    A: 飲酒や薬物の影響がない状態（シラフ）で運転する
    B: 制限速度より少なくとも10 mph（マイル/時）遅く運転する
    C: 高速道路でのみシートベルトを着用する
    D: 夜間のみオートバイに道を譲る
  answer: A
  explanation: 局長のメッセージでは、すべての運転者がハンドルを握るたびに果たすべき責任の一つとして、「飲酒や薬物の影響がない状態（シラフ）で運転する（Drive
    sober）」ことが明記されています。
- id: 3
  category: driver_responsibility
  question: 局長のメッセージでは、新規運転者に対して、運転とはどのようなものと見なされていると念押ししていますか？
  choices:
    A: 憲法上の権利
    B: 特権（Privilege）
    C: 市民権の要件
    D: 連邦政府の義務
  answer: B
  explanation: 局長のメッセージには、「運転は特権（privilege）であることを忘れないでください。そして、あなたは道路上の全員の安全を確保する役割を担っています」と記載されています。
- id: 4
  category: sharing_the_road
  question: 道路上の全員の安全を守るため、局長のメッセージでは、オートバイがいないか何回確認するよう具体的にアドバイスしていますか？
  choices:
    A: 1回
    B: 2回
    C: 3回
    D: 車線変更時のみ
  answer: B
  explanation: 局長のメッセージには、運転中の安全な選択のための責任リストに「オートバイがいないか2回確認する（Look twice for motorcycles）」が含まれています。
- id: 5
  category: driver_testing
  question: 交通規則の理解度をテストするためのオンライン運転テストチュートリアル（Online Driver Test Tutorial）はどこで見つけることができますか？
  choices:
    A: MVAのモバイルアプリ
    B: 地域の公共図書館
    C: MVAのウェブサイト（mva.maryland.gov/drivers）
    D: TTY番号に電話する
  answer: C
  explanation: 局長のメッセージには、オンライン運転テストチュートリアルはMVAのウェブサイト（mva.maryland.gov/drivers）にあると記載されています。
- id: 6
  category: license_system
  question: 目次によると、「初心者ドライバー／段階的運転免許制度（Rookie Driver/Graduated Licensing System）」について記載されているのはどのセクションですか？
  choices:
    A: セクション1
    B: セクション2
    C: セクション3
    D: セクション4
  answer: B
  explanation: 目次によると、セクション2のタイトルは「免許取得の要件と手続き（Licensing Requirements and Process）」であり、その中に「初心者ドライバー／段階的運転免許制度（Rookie
    Driver/Graduated Licensing System）」が含まれています。
- id: 7
  category: defensive_driving
  question: マニュアルのセクション6「危険な運転行動（Dangerous Driving Behaviors）」に分類されているトピックは次のうちどれですか？
  choices:
    A: ハイドロプレーニング現象
    B: 脇見運転（Distracted Driving）
    C: 踏切（Highway-Railroad Crossings）
    D: 追い越し（Passing）
  answer: B
  explanation: 目次では、セクション6「危険な運転行動（Dangerous Driving Behaviors）」の下に「脇見運転（Distracted
    Driving）」がリストされています。
- id: 8
  category: penalties_and_points
  question: 「薬物およびアルコール検査 – 黙示の同意（Drug and Alcohol Test – Implied Consent）」の規則は、マニュアルのどのセクションで説明されていますか？
  choices:
    A: セクション6：危険な運転行動
    B: セクション8：衝突事故と交通取り締まり
    C: セクション9：その他の制限、違反、および罰則
    D: セクション10：その他の重要な情報
  answer: C
  explanation: 目次では、セクション9「その他の制限、違反、および罰則（Other Restrictions, Violations and Penalties）」の下に「薬物およびアルコール検査
    – 黙示の同意（Drug and Alcohol Test – Implied Consent）」がリストされています。
- id: 9
  category: sharing_the_road
  question: セクション7「道路の共有（Sharing the Road）」には、次のうちどれとの関わり方に関する情報が含まれていますか？
  choices:
    A: 低速走行車両
    B: 葬儀の車列
    C: スクールバス
    D: ロータリー（Traffic Circles）
  answer: C
  explanation: 目次によると、セクション7「道路の共有（Sharing the Road）」には、「スクールバス（School Buses）」に関する具体的なサブセクションが含まれています。
- id: 10
  category: safe_driving_rules
  question: 霧や悪天候時の運転について学ぶ必要がある場合、マニュアルのどのセクションを参照すべきですか？
  choices:
    A: セクション3：基本的な運転
    B: セクション4：標識、信号、および路面標示
    C: セクション5：運転状況と条件
    D: セクション8：衝突事故と交通取り締まり
  answer: C
  explanation: 目次には、「霧の中での運転（Driving in Fog）」および「悪天候時の運転（Driving in Inclement Weather）」がセクション5「運転状況と条件（Driving
    Situations and Conditions）」で説明されていることが示されています。
- id: 11
  category: license_system
  question: 聴覚障害者がメリーランド州MVA（自動車局）に連絡するために提供されているTTY（テレタイプライター）の電話番号は何ですか？
  choices:
    A: 410-768-7000
    B: 1-800-492-4575
    C: 1-800-555-1234
    D: 410-768-7001
  answer: B
  explanation: マニュアルの最初のページにある連絡先情報には、聴覚障害者向けのTTY番号として1-800-492-4575が記載されています。
- id: 12
  category: driver_responsibility
  question: 局長からのメッセージ（Administrator's Message）によると、初心運転者はどのようにして運転が上達しますか？
  choices:
    A: 日中のみ運転することによって
    B: さまざまな道路や異なる条件下でより多くの経験を積むことによって
    C: 渋滞を完全に避けることによって
    D: 監督する運転手と同乗している場合のみ運転することによって
  answer: B
  explanation: 局長からのメッセージには、「さまざまな道路、異なる条件、そして異なる環境でより多くの経験を積むことで、運転が上達するでしょう」と記載されています。
- id: 13
  category: safe_driving_rules
  question: 「ムーブ・オーバー法（車線変更義務法）」は、メリーランド州運転マニュアルのどのセクションで説明されていますか？
  choices:
    A: セクション3：基本的な運転
    B: セクション6：危険な運転行動
    C: セクション7：道路の共有
    D: セクション8：衝突事故と交通違反取締り
  answer: D
  explanation: 目次によると、「ムーブ・オーバー法」はセクション8：衝突事故と交通違反取締りに記載されています。
- id: 14
  category: driver_testing
  question: 「セクション1：運転免許試験の要件」の要件として記載されているのは次のうちどれですか？
  choices:
    A: 視力検査
    B: 連帯保証人の申請
    C: 仮免許（プロビジョナル・ライセンス）
    D: 臓器提供者（ドナー）
  answer: A
  explanation: 目次には、「セクション1：運転免許試験の要件」のサブセクションAとして「視力検査」が記載されています。
- id: 15
  category: license_system
  question: マニュアルの著作権情報によると、次のうち禁止されている行為はどれですか？
  choices:
    A: メリーランド州車両法を学ぶためにコンテンツを無料で使用すること
    B: マニュアルをオンラインで読むこと
    C: 資料の無断転載、使用、配布、または販売
    D: 運転指導員とマニュアルを共有すること
  answer: C
  explanation: 著作権のセクションには、「本資料の無断転載、使用、配布、または販売は禁止されています」と明記されています。
- id: 16
  category: driver_testing
  question: メリーランド州の運転免許証を取得するために必要な、両眼それぞれの最低視力はどれくらいですか？
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: 運転免許証を取得するには、申請者は両眼それぞれで少なくとも20/40の視力を持っている必要があります。
- id: 17
  category: driver_testing
  question: メリーランド州の運転知識テスト（学科試験）は何問ありますか？また、制限時間はどれくらいですか？
  choices:
    A: 20問、15分
    B: 25問、20分
    C: 30問、25分
    D: 50問、45分
  answer: B
  explanation: 知識テスト（学科試験）は25問あり、試験時間は20分です。
- id: 18
  category: driver_testing
  question: 運転技能テスト（実技試験）のためにMVAに車両を持ち込む場合、その車両には少なくとも以下のものが必要です：
  choices:
    A: 燃料が4分の1タンク
    B: 燃料が半分（ハーフタンク）
    C: 燃料が4分の3タンク
    D: 満タンの燃料
  answer: B
  explanation: 運転技能テストに使用される車両は、安全に運転でき、視界に影響を与えるフロントガラスのひび割れがなく、少なくとも半分（ハーフタンク）の燃料が入っている必要があります。
- id: 19
  category: driver_testing
  question: 運転技能テスト中、車両に同乗できるのは誰ですか？
  choices:
    A: あなたとMVAの試験官のみ（必要な場合は承認された通訳者も可）
    B: あなた、MVAの試験官、および監督する運転手
    C: あなた、MVAの試験官、および家族1名
    D: あなた、MVAの試験官、および運転指導員
  answer: A
  explanation: テスト中、車両に同乗できるのはあなたと試験官のみです。通訳が必要な場合は、MVAが承認した通訳者も同乗することができます。
- id: 20
  category: penalties_and_points
  question: メリーランド州の州道でのポイ捨てに対する最大罰則は何ですか？
  choices:
    A: 500ドルの罰金
    B: 1000ドルの罰金および15日間の禁錮
    C: 1500ドルの罰金または30日間の禁錮
    D: 2000ドルの罰金または60日間の禁錮
  answer: C
  explanation: ポイ捨ての罰則は、最大1500ドルの罰金または30日間の禁錮となる場合があります。
- id: 21
  category: license_system
  question: 非商用運転免許証を申請する際、メリーランド州に居住していることを証明するために、いくつの書類を持参する必要がありますか？
  choices:
    A: 1つ
    B: 2つ
    C: 3つ
    D: 4つ
  answer: B
  explanation: 申請時には、メリーランド州に居住していることを証明する書類を2つ持参する必要があります。
- id: 22
  category: license_system
  question: 運転免許証を申請する際、MVA（メリーランド州自動車局）が受け付ける書類の種類は次のうちどれですか？
  choices:
    A: 原本または認証済みコピー
    B: 公証されたコピー
    C: 高品質のカラーコピー
    D: 情報が消去・修正された書類
  answer: A
  explanation: 原本、または発行機関によって認証されたコピーを持参する必要があります。MVAは、単なるコピー、公証されたコピー、または情報が変更・消去された書類は受け付けません。
- id: 23
  category: license_system
  question: 普通乗用車、ピックアップトラック、バンに使用される標準的な非商用運転免許証のクラスは何ですか？
  choices:
    A: クラスA
    B: クラスB
    C: クラスC
    D: クラスM
  answer: C
  explanation: 非商用運転免許証を取得すると、乗用車、ピックアップトラック、バンなどの通常の車両を運転することができます。これはクラスC運転免許証とも呼ばれます。
- id: 24
  category: license_system
  question: タイプ1学習者用仮免許証（Type 1 Learner's Instructional Permit）の有効期間はどのくらいですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 18ヶ月
    D: 最大2年
  answer: D
  explanation: これまでに非商用運転免許証を取得したことがない場合は、タイプ1学習者用仮免許証を取得する必要があります。この仮免許証の有効期間は最大2年です。
- id: 25
  category: license_system
  question: タイプ2学習者用仮免許証（Type 2 Learner's Instructional Permit）が必要になるのは次の場合です：
  choices:
    A: これまでに運転免許証を取得したことがない場合
    B: すでに運転免許証を持っており、異なるクラスの免許証を取得したい場合
    C: 16歳未満の場合
    D: 交通違反により免許停止処分を受けた場合
  answer: B
  explanation: すでに運転免許証を持っており、異なるクラスの運転免許証を取得したい場合は、タイプ2学習者用仮免許証を申請する必要があります。
- id: 26
  category: license_system
  question: 25歳未満の場合、学習者用仮免許証を申請するために必要な最低年齢は何歳ですか？
  choices:
    A: 15歳6ヶ月
    B: 15歳9ヶ月
    C: 16歳
    D: 16歳3ヶ月
  answer: B
  explanation: 25歳未満の申請者は、15歳9ヶ月以上である必要があります。
- id: 27
  category: driver_testing
  question: 25歳未満の申請者は、監督する運転手と同乗して合計何時間の運転練習を完了する必要がありますか？
  choices:
    A: 14時間
    B: 30時間
    C: 45時間
    D: 60時間
  answer: D
  explanation: 25歳未満の申請者は、監督する運転手と同乗して少なくとも60時間の運転練習を行う必要があります。
- id: 28
  category: driver_testing
  question: 申請者が25歳以上の場合、運転技能試験を受ける前に何時間の運転練習を完了する必要がありますか？
  choices:
    A: 14時間
    B: 30時間
    C: 45時間
    D: 60時間
  answer: A
  explanation: 25歳以上の申請者は、監督する運転手と同乗して少なくとも14時間の運転練習を完了する必要があります。
- id: 29
  category: license_system
  question: 25歳以上の申請者が暫定免許証（Provisional License）の取得資格を得るには、学習者用仮免許証をどのくらいの期間保持する必要がありますか？
  choices:
    A: 少なくとも14日間
    B: 少なくとも30日間
    C: 少なくとも45日間
    D: 少なくとも9ヶ月間
  answer: C
  explanation: 25歳以上の申請者が暫定免許証の取得資格を得るには、仮免許証を少なくとも45日間保持する必要があります。
- id: 30
  category: penalties_and_points
  question: 学習者用仮免許証の保持中に交通違反（moving violation）で有罪判決を受けた場合、暫定免許証の取得資格を得るには、有罪判決の日からどのくらいの期間、仮免許証を保持し続ける必要がありますか？
  choices:
    A: 45日間
    B: 3ヶ月間
    C: 6ヶ月間
    D: 9ヶ月間
  answer: D
  explanation: 年齢に関係なく、交通違反で有罪判決を受けた場合、または判決前保護観察（PBJ）を受けた場合、直近の有罪判決日から少なくとも9ヶ月間、学習者用仮免許証を保持する必要があります。
- id: 31
  category: license_system
  question: 18歳未満の運転者が暫定免許（Provisional License）を取得する資格を得るには、無違反で仮運転免許証（Learner's Instructional
    Permit）をどのくらいの期間保持しなければなりませんか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 9ヶ月
    D: 18ヶ月
  answer: C
  explanation: マニュアルによると、18歳未満の場合、暫定免許（Provisional License）を取得する資格を得るには、無違反で少なくとも9ヶ月間、仮運転免許証（Permit）を保持しなければなりません。
- id: 32
  category: license_system
  question: 25歳以上の場合、暫定免許（Provisional License）を取得するには、運転練習・技能記録（Practice and Skills
    Log）に何時間の運転練習を記録する必要がありますか？
  choices:
    A: 14時間
    B: 30時間
    C: 45時間
    D: 60時間
  answer: A
  explanation: マニュアルには、監督する運転手と同乗して少なくとも60時間（25歳以上の場合は14時間）の運転練習を完了したことを示す運転練習・技能記録（Practice
    and Skills Log）を提出しなければならないと記載されています。
- id: 33
  category: license_system
  question: 暫定免許（Provisional License）から正規の運転免許証（Driver's License）へ移行するためのすべての要件を満たした場合、どうなりますか？
  choices:
    A: 運転技能試験を再受験しなければならない。
    B: MVA（車両管理局）の支局に行き、アップグレードの申請をしなければならない。
    C: MVAが自動的に免許証を切り替え、新しいカードを郵送してくる。
    D: さらに60時間の監督付き運転を完了しなければならない。
  answer: C
  explanation: すべての要件を満たすと、MVA（車両管理局）は自動的に暫定免許（Provisional License）を正規の運転免許証（Driver's
    License）に切り替え、切り替えを示すカードが郵送されます。
- id: 34
  category: driver_responsibility
  question: 未成年者が結婚している場合、その未成年者の免許申請に共同署名できるのは誰ですか？
  choices:
    A: 21歳以上の免許を持った運転手。
    B: 未成年者の夫または妻（18歳以上の場合）。
    C: 親または法定後見人のみ。
    D: MVAが承認した運転指導員。
  answer: B
  explanation: マニュアルには次のように記載されています。「結婚しており、夫または妻が18歳以上であれば、共同署名することができます。結婚していることの証明を提出する必要があります。」
- id: 35
  category: driver_responsibility
  question: 共同署名者は、未成年者の運転免許証をどのようにして取り消すことができますか？
  choices:
    A: MVAの支局で口頭で取り消しを要求する。
    B: MVAの行政裁定部門（Administrative Adjudication Division）に書面による要求を提出する。
    C: 未成年者の物理的な免許証カードを没収する。
    D: 自動車保険の契約から未成年者を外す。
  answer: B
  explanation: 共同署名者は、MVAの行政裁定部門（Administrative Adjudication Division）に書面による要求を提出することで、未成年者の免許を取り消すことができます。
- id: 36
  category: driver_testing
  question: 米国外の運転免許証を持っている場合、メリーランド州の免許証を取得するために必要なものは次のうちどれですか？
  choices:
    A: 3時間の道路安全運転教育プログラム。
    B: 14時間の監督付き運転記録。
    C: 大使館からの推薦状。
    D: メリーランド州での最低18ヶ月の運転経験。
  answer: A
  explanation: 米国外の免許証からメリーランド州の免許証を取得するには、視力検査、学科試験、運転技能試験、およびMVAが承認した3時間の道路安全運転教育プログラムを無事に修了する必要があります。
- id: 37
  category: driver_testing
  question: MVAがあなたの話す言語で学科試験を提供している場合、通訳の利用が許可されるまでに何回試験を受けなければなりませんか？
  choices:
    A: 2回
    B: 3回
    C: 5回
    D: あなたの言語で試験が提供されている場合、通訳を利用することはできない。
  answer: C
  explanation: マニュアルには次のように記載されています。「あなたの話す言語で学科試験が提供されている場合、通訳を利用する前に少なくとも5回試験を受けなければなりません。」
- id: 38
  category: driver_testing
  question: MVAでの学科試験または技能試験でサービスを提供する通訳に関する規則は、次のうちどれですか？
  choices:
    A: MVAは通訳サービスに対して標準料金を請求する。
    B: 通訳は申請者の家族でなければならない。
    C: 通訳は顧客の居住地を証明することもできる。
    D: 通訳は、試験を受ける顧客に対して他のサービスを提供してはならない。
  answer: D
  explanation: 学科試験や技能試験でサービスを提供する通訳は、居住地の証明や自動車学校の業務など、試験を受ける顧客に対して他のサービスを提供することはできません。
- id: 39
  category: alcohol_drugs_health
  question: 発達障害開示カード（Developmental Disability Disclosure Card）を取得するために、MVAはどのような書類の提出を求めますか？
  choices:
    A: 免許を持った医師の署名入り診断書。
    B: 法定後見人を証明する裁判所の書類。
    C: 特定の障害の詳細を記した医療記録。
    D: MVAは障害に関する書類の提出を求めることはない。
  answer: D
  explanation: 発達障害開示カード（Developmental Disability Disclosure Card）の携帯は任意であり、マニュアルには「MVAがこのカードを取得するために障害に関する情報や書類の提出を求めることはありません」と明記されています。
- id: 40
  category: safe_driving_rules
  question: 車を運転する前に、どのような書類を携帯していなければなりませんか？
  choices:
    A: 有効な仮運転免許証または運転免許証、および車両登録証。
    B: 有効な仮運転免許証または運転免許証、および出生証明書。
    C: 車両の権利書（タイトル）と保険の証明書。
    D: 発達障害開示カードと有効な運転免許証。
  answer: A
  explanation: 運転する前に、有効な仮運転免許証（Learner's Permit）または運転免許証、および車両登録証を携帯していなければなりません。
- id: 41
  category: defensive_driving
  question: マニュアルでは「防衛運転 (defensive driving)」をどのように説明していますか？
  choices:
    A: 他の運転手が常に交通規則に従うと思い込むこと。
    B: 前方を確認し、危険を察知するために速度や車線を変更する準備をしておくこと。
    C: 信号機で指示された場合にのみ通行優先権を譲ること。
    D: 道路状況に関わらず一定の速度で運転すること。
  answer: B
  explanation: マニュアルでは防衛運転を次のように定義しています。「前方を確認し、速度や車線を変更する準備をしておくことで、より安全に運転でき、危険を察知する時間を持つことができます。これを防衛運転と呼びます。」
- id: 42
  category: safe_driving_rules
  question: あなたと他の運転手が同時に交差点に到着した場合、誰に通行優先権を譲るべきですか？
  choices:
    A: 左側の運転手。
    B: 右側の運転手。
    C: 直進する運転手。
    D: 左折する運転手。
  answer: B
  explanation: 両者が同時に交差点に到着した場合は、右側の運転手に通行優先権を譲らなければなりません。
- id: 43
  category: defensive_driving
  question: 自動車を運転する際、リスクを管理するために推奨される対策は次のうちどれですか？
  choices:
    A: 他の運転手が当然すべき行動をとると思い込む。
    B: 周囲の状況に反応するための時間を減らす。
    C: 自分の車と道路を利用している他の人々との間に安全な距離を保つ。
    D: 車の周囲で何が起きているかを知るために、ミラーのみに頼る。
  answer: C
  explanation: リスクを管理するため、マニュアルでは「自分の車と道路を利用している他の人々との間に安全な距離を保つ」ことを推奨しており、「他の運転手が当然すべき行動をとると思い込んではならない」と明記しています。
- id: 44
  category: license_system
  question: 暫定運転免許 (Provisional Driver's License) に課される制限は何ですか？
  choices:
    A: 常に監督する運転手と同乗して運転しなければならない。
    B: 州間高速道路の運転は許可されていない。
    C: 同乗者を乗せることや夜間の運転が制限されている。
    D: 追加で60時間の運転練習を記録しなければならない。
  answer: C
  explanation: 暫定運転免許では監督者なしでの運転が許可されますが、同乗者の禁止や夜間運転の禁止などの制限が伴います。
- id: 45
  category: safe_driving_rules
  question: 左折する際、誰に通行優先権を譲らなければなりませんか？
  choices:
    A: 対向車線の運転手
    B: 後方の運転手
    C: 交差する道路から右折してくる運転手
    D: 誰にも譲る必要はない（自動的に優先権がある）
  answer: A
  explanation: 左折する際は、対向車線の運転手に通行優先権を譲らなければなりません。
- id: 46
  category: safe_driving_rules
  question: 標識に掲示されている制限速度は何を表していますか？
  choices:
    A: あらゆる天候条件における推奨速度
    B: 走行可能な法定最低速度
    C: 理想的な条件下で走行可能な法定最高速度
    D: 交通状況に関わらず維持しなければならない速度
  answer: C
  explanation: 標識に掲示されている制限速度は、理想的（完璧）な条件下で道路を走行できる法定最高速度です。
- id: 47
  category: defensive_driving
  question: 他の車両より極端に遅い速度で運転することが危険なのはなぜですか？
  choices:
    A: ブレーキの過度な摩耗を引き起こすため
    B: 他の車が絶えず追い越しをするようになり、衝突の可能性が高まるため
    C: メリーランド州のすべての道路で違法であるため
    D: カーブに対応する能力が低下するため
  answer: B
  explanation: 他の車両より遅い速度で運転すると、他の車が絶えず追い越しをするようになり、衝突の可能性が高まります。
- id: 48
  category: safe_driving_rules
  question: 理想的な運転条件下において、MVA（自動車局）が推奨する最小車間距離はどれくらいですか？
  choices:
    A: 1〜2秒
    B: 3〜4秒
    C: 5〜6秒
    D: 10秒
  answer: B
  explanation: MVAは、理想的な運転条件下での最小車間距離として3〜4秒を推奨しています。
- id: 49
  category: defensive_driving
  question: バスや配達用バンなど、頻繁に停車する車両の後ろを走る場合、車間距離をどのくらいに増やすべきですか？
  choices:
    A: 2〜3秒
    B: 3〜4秒
    C: 4〜5秒
    D: 7〜8秒
  answer: C
  explanation: 頻繁に停車する車両の後ろを走る場合は、前方の車両との車間距離を4〜5秒に増やし、必要であればさらに距離を取るべきです。
- id: 50
  category: safe_driving_rules
  question: 道路の中央より左側を走行することが一般的に許容されるのはどのような場合ですか？
  choices:
    A: 同じ方向に進んでいる他の車両を追い越す場合
    B: 見通しの悪いカーブに近づいている場合
    C: 住宅街を運転している場合
    D: 右側の路肩に駐車する準備をしている場合
  answer: A
  explanation: 同じ方向に進んでいる他の車両を追い越す場合、標識や信号で許可されている場合、または障害物がある場合を除き、車両は道路の中央より右側を走行しなければなりません。
- id: 51
  category: safe_driving_rules
  question: 合法的なUターンを行う場合、どの車線に入らなければなりませんか？
  choices:
    A: 反対方向へ進む内側または左側の車線
    B: 反対方向へ進む外側または右側の車線
    C: 中央の右左折車線
    D: 利用可能な任意の車線
  answer: B
  explanation: Uターンを行う際は、他の交通に道を譲り、安全を確認した後、反対方向へ進む外側または右側の車線に入ります。
- id: 52
  category: safe_driving_rules
  question: 他の車両を追い越した後、元の車線に戻る前にすべきことは次のうちどれですか？
  choices:
    A: クラクションを鳴らして他の運転手に警告する
    B: ルームミラーで追い越した車両の両方のヘッドライトが見えるようにする
    C: ハイビームを点滅させる
    D: 追い越した車両から少なくとも10フィート前方にいることを確認する
  answer: B
  explanation: 追い越しを行う際、元の車線に戻る前に、ルームミラーで追い越した車両の両方のヘッドライトが見えなければなりません。
- id: 53
  category: safe_driving_rules
  question: 次の状況のうち、他の車両を追い越すことが違法となるのはどれですか？
  choices:
    A: 障害物のない2車線以上の一定方向の道路（一方通行路）にいるとき
    B: 他の車両が左折しようとしているとき
    C: 交差点を通過中、または交差点から100フィート以内の場所にいるとき
    D: 同じ方向に進む2車線以上の障害物のない道路にいるとき
  answer: C
  explanation: 交差点や踏切を通過中、またはそれらから100フィート以内の場所では、追い越しをしてはいけません。
- id: 54
  category: sharing_the_road
  question: 他の車両があなたを追い越そうとしているとき、何をしなければなりませんか？
  choices:
    A: 速度を上げて道を譲る
    B: 右側の路肩に移動する
    C: 他の車両に道を譲り、速度を上げない
    D: クラクションを鳴らして認識したことを伝える
  answer: C
  explanation: 他の車両に追い越される際は、その車両に道を譲り、自分の速度を上げてはいけません。
- id: 55
  category: vehicle_information
  question: マニュアルトランスミッション（MT）車を駐車する際、パーキングブレーキをかけ、さらにどうするべきですか？
  choices:
    A: ギアをニュートラルに入れる
    B: ギアを入れた状態にする
    C: ギアを「パーキング（P）」に入れる
    D: ハンドルを左に急に切る
  answer: B
  explanation: 駐車する際は、パーキングブレーキをかけ、マニュアルトランスミッション車の場合はギアを入れた状態に（オートマチックトランスミッション車の場合は「パーキング（P）」に）しなければなりません。
- id: 56
  category: signs_and_signals
  question: 交通管制装置（信号や標識など）に従わなくてもよいのはどのような場合ですか？
  choices:
    A: 緊急事態で急いでいるとき
    B: 警察官から異なる指示を受けたとき
    C: 周囲に他の交通がないとき
    D: 商用車を運転しているとき
  answer: B
  explanation: すべての交通管制装置に従わなくてもよい唯一の例外は、警察官、その他の緊急要員、または学童擁護員（スクールクロッシングガード）から異なる指示を受けた場合です。
- id: 57
  category: signs_and_signals
  question: 標識で禁止されていない限り、赤の点灯信号で右折することができますが、その条件は次のうちどれですか？
  choices:
    A: 交差点に他の車両がいなければ、停止せずに右折できる
    B: 最も右側の車線にいて、クラクションを鳴らした場合のみ右折できる
    C: 完全に停止し、歩行者や他の交通に道を譲った後
    D: 午前6時から午後6時の間のみ右折できる
  answer: C
  explanation: 赤信号での右折を禁止する標識がない限り、完全に停止した後であれば右折することができます。その際、歩行者やすべての他の交通に優先権を譲らなければなりません。
- id: 58
  category: signs_and_signals
  question: 信号機が機能していない交差点に近づいた場合、どうするべきですか？
  choices:
    A: 優先権がある場合は、停止せずに交差点を通過する
    B: 明確に表示された停止線、または横断歩道に入る前で停止する
    C: 交差点を「譲れ（Yield）」の標識があるものとして扱う
    D: 警察官が到着するのを待つ
  answer: B
  explanation: 信号機が機能していない場合、明確に表示された停止線で停止しなければなりません。明確な停止線がない場合は、横断歩道に入る前で停止する必要があります。
- id: 59
  category: signs_and_signals
  question: 蛍光ピンク色の交通標識は何を示していますか？
  choices:
    A: スクールゾーンおよび横断歩道
    B: 緊急の交通事故・事象
    C: 建設および維持管理の作業区域
    D: レクリエーションおよび文化的関心地域
  answer: B
  explanation: マニュアルによると、蛍光ピンク色の標識は緊急の交通事故・事象を示すために使用されます。
- id: 60
  category: signs_and_signals
  question: 黄色の「X」の点灯による車線利用信号は何を意味していますか？
  choices:
    A: その車線を左折に使用できる。
    B: その車線を絶対に走行してはならない。
    C: 安全が確認でき次第、速やかにその車線から出なければならない。
    D: その車線を走行してもよいが、減速しなければならない。
  answer: C
  explanation: 黄色の「X」の点灯信号は、安全が確認でき次第、速やかにその車線から出るべきであることを意味します。
- id: 61
  category: signs_and_signals
  question: スクールゾーンの警告や学校の横断歩道を示すために専用に使われる標識の形はどれですか？
  choices:
    A: ひし形
    B: 五角形
    C: ペナント型
    D: 八角形
  answer: B
  explanation: 五角形の標識は、スクールゾーンの警告や学校の横断歩道を示します。
- id: 62
  category: signs_and_signals
  question: 赤の点滅信号に対して、運転手はどのように対応すべきですか？
  choices:
    A: 停止せずに減速し、注意して進む。
    B: 完全に停止し、他の車両や歩行者に道を譲り、安全が確認できたら進む。
    C: 他の車両が交差点に近づいている場合のみ停止する。
    D: 完全に停止せず、右側の車両に道を譲る。
  answer: B
  explanation: 赤の点滅信号では、停止線で完全に停止し、他のすべての車両や歩行者に道を譲り、安全が確認できた後に進まなければなりません。
- id: 63
  category: signs_and_signals
  question: 茶色の交通標識には、通常どのような情報が記載されていますか？
  choices:
    A: 目的地、距離、方向
    B: 食事、ガソリン、休憩所などのサービス
    C: レクリエーションおよび文化的な名所
    D: 建設および維持管理の作業エリア
  answer: C
  explanation: 茶色の交通標識は、レクリエーションや文化的な名所を示しています。
- id: 64
  category: signs_and_signals
  question: リバーシブルレーン（中央線変移区間）の上にある黄色の「X」の点滅信号は、何を示していますか？
  choices:
    A: その車線はすべての車両に対して閉鎖されている。
    B: 直ちにその車線から出なければならない。
    C: 対向車と共有しながら、左折のためにその車線を使用できる。
    D: 直進するための優先権を独占している。
  answer: C
  explanation: 黄色の「X」の点滅信号、または双方向の左折矢印は、左折のためにその車線を使用できることを意味し、対向方向から左折してくる車両とその車線を共有することになります。
- id: 65
  category: safe_driving_rules
  question: 交差点に近づいているときに、信号が黄色の点灯に変わった場合、どうすべきですか？
  choices:
    A: 赤信号になる前に通り抜けるために加速する。
    B: 交差点の真ん中にいても、直ちに停止する。
    C: 安全に停止するには交差点に近すぎる場合、注意してそのまま通過する。
    D: 横断歩道を空けるために車を後退させる。
  answer: C
  explanation: 黄色の点灯信号は、安全に停止するための時間を与えます。安全に停止するには交差点に近すぎる場合は、注意してそのまま交差点を通過してください。
- id: 66
  category: signs_and_signals
  question: 学校、歩行者、自転車の横断を警告する標識には何色が使われますか？
  choices:
    A: 黄色
    B: 蛍光黄緑色
    C: 白色
    D: オレンジ色
  answer: B
  explanation: 蛍光黄緑色は、学校、歩行者、自転車の標識に使用される色です。
- id: 67
  category: signs_and_signals
  question: 州間高速道路（インターステート・ハイウェイ）に設置されているマイルマーカー標識の目的は何ですか？
  choices:
    A: 現在の最高制限速度を示す。
    B: 緊急援助が必要な場合に備えて位置情報を提供する。
    C: 次のガソリンスタンドや休憩所までの正確な距離を示す。
    D: 新しい郡や州境の始まりを示す。
  answer: B
  explanation: マイルマーカー標識は、レッカー車や救急隊員などに自分を見つけてもらう必要がある場合に使用できる位置情報を提供します。
- id: 68
  category: sharing_the_road
  question: 横断歩道の信号が運転手に対して赤の点灯を示している場合、運転手はどうしなければなりませんか？
  choices:
    A: 停止し、信号が変わるまで待つ。
    B: 減速し、歩行者が見えなければ進む。
    C: 停止した後、注意して進む。
    D: 通過する前にクラクションを鳴らして歩行者に警告する。
  answer: A
  explanation: 横断歩道信号の規則によると、運転手に対する赤の点灯は「止まれ！」を意味し、歩行者が横断している間は待たなければなりません。
- id: 69
  category: signs_and_signals
  question: 道路と鉄道の踏切の位置を示すために使用される標識の形はどれですか？
  choices:
    A: 丸型
    B: クロスバック（X字型）
    C: 台形
    D: ひし形
  answer: B
  explanation: クロスバック（X字型）は、道路と鉄道の踏切の位置を示します。
- id: 70
  category: safe_driving_rules
  question: 黄色の点滅信号に近づいたときの正しい行動は何ですか？
  choices:
    A: 完全に停止し、青信号を待つ。
    B: 4方向一時停止（フォーウェイ・ストップ）として扱う。
    C: 減速し、注意して進む。
    D: 交差点を早く通り抜けるために加速する。
  answer: C
  explanation: 黄色の点滅信号は、減速して注意しながら進まなければならないことを意味します。
- id: 71
  category: signs_and_signals
  question: 白地に黒字の長方形の標識は、通常何を示していますか？
  choices:
    A: 前方の危険に対する一般的な警告
    B: 従わなければならない規制情報や交通法規
    C: 病院や空港への道順
    D: 緊急の交通事故
  answer: B
  explanation: 白地に黒字の長方形（4辺）の標識は交通を規制するものです。これらは交通法規に関するものであり、必ず従わなければなりません。
- id: 72
  category: signs_and_signals
  question: サービス情報および案内標識（Service Information and Guide Signs）は、どのような情報を提供しますか？
  choices:
    A: この先の道路の制限速度
    B: 特定の出口を降りた場所にある店舗やサービス
    C: 路線番号と道路の種類
    D: 駐車が厳しく禁止されている区域
  answer: B
  explanation: マニュアルによると、サービス情報および案内標識は、特定の出口を降りた場所にある店舗やサービス（宿泊施設、病院、ガソリンスタンド、飲食店など）を示しています。
- id: 73
  category: signs_and_signals
  question: 道路上の1本の黄色い破線は、何を示していますか？
  choices:
    A: 車両が同じ方向に進んでおり、車線変更が禁止されている。
    B: 車両が対面通行（反対方向）で進んでおり、注意して追い越すことが許可されている。
    C: 道路の右端を示している。
    D: 交通の流れの方向が変わるリバーシブルレーン（可逆車線）を示している。
  answer: B
  explanation: 1本の黄色い破線は、車両が反対方向に進む車線を区切るものであり、どちらの方向からでも注意して追い越すことが許可されています。
- id: 74
  category: signs_and_signals
  question: 1本の黄色い実線は、通常どこで使用されますか？
  choices:
    A: 対面通行道路の右端
    B: 一般車線とHOV（相乗り）車線を区切るため
    C: 中央分離帯のある幹線道路、一方通行路、およびランプ（出入口）の左端の線を示すため
    D: 追い越しが許可されている対面通行道路の中央
  answer: C
  explanation: マニュアルには、1本の黄色い実線は、中央分離帯のある幹線道路、一方通行路、およびランプの左端の線を示すと記載されています。
- id: 75
  category: signs_and_signals
  question: 2本並んだ黄色い破線の目的は何ですか？
  choices:
    A: リバーシブルレーン（可逆車線）の端を示している。
    B: 共有の対面左折車線を示している。
    C: 横断歩道を示している。
    D: 自転車専用通行帯と自動車車線を区切っている。
  answer: A
  explanation: 2本並んだ黄色い破線は、時間帯によって交通の進行方向が変わるリバーシブルレーン（可逆車線）の端を示しています。
- id: 76
  category: safe_driving_rules
  question: 2本の黄色い実線を越えて左折することは許可されていますか？
  choices:
    A: いいえ、いかなる状況でも2本の黄色い実線を越えることは厳しく禁止されています。
    B: はい、ただし低速車両を追い越す場合のみです。
    C: はい、私道（ドライブウェイ）に入る場合など、線を越えて左折することができます。
    D: はい、ただし日中のみです。
  answer: C
  explanation: どちらの方向からも追い越しは許可されていませんが、マニュアルには、私道（ドライブウェイ）に入る場合など、2本の黄色い実線を越えて左折することは許可されていると明記されています。
- id: 77
  category: signs_and_signals
  question: 譲れ（Yield）の線は、路面にどのように標示されていますか？
  choices:
    A: 1本の白い実線として
    B: 車線を横切る小さな三角形の列として
    C: 2本の黄色い実線として
    D: 1本の白い点線として
  answer: B
  explanation: 譲れ（Yield）の線は、車線を横切る小さな三角形の列として標示されており、車両が他の車両や歩行者に道を譲らなければならない場所を示しています。
- id: 78
  category: sharing_the_road
  question: 自転車用の共有車線標示（Shared-use lane markings）の目的の一つは何ですか？
  choices:
    A: 自動車がその車線を使用するのを禁止するため
    B: 自転車の駐輪場所を示すため
    C: 逆走（間違った方向への自転車走行）を抑制するため
    D: この先にある踏切を自転車利用者に警告するため
  answer: C
  explanation: 共有車線標示は、道路上に自転車がいる可能性があることをドライバーに警告し、自転車利用者に走るべき場所を伝え、逆走を抑制する役割があります。
- id: 79
  category: defensive_driving
  question: 米国運輸省道路交通安全局（NHTSA）によると、制限速度が65 mphの道路での衝突事故が死亡事故につながる確率は、制限速度が45 mphまたは50
    mphの道路と比べてどのくらい高くなりますか？
  choices:
    A: 確率は同じである
    B: 2倍以上高い
    C: 約5倍高い
    D: 10倍高い
  answer: B
  explanation: 制限速度が65 mph以上の道路での衝突事故は、制限速度が45 mphまたは50 mphの道路での衝突事故に比べて、死亡事故につながる確率が2倍以上高くなります。
- id: 80
  category: safe_driving_rules
  question: 視界が悪い状況で運転する場合、車線を維持するために何をガイドとして使用すべきですか？
  choices:
    A: 前方の車両のテールランプ
    B: 中央の2本の黄色い線
    C: 道路の端、または道路の右側の線
    D: 対向車のヘッドライト
  answer: C
  explanation: 視界が悪い状況で運転する場合は、道路の端、または道路の右側の線をガイドとして使用する必要があります。
- id: 81
  category: safe_driving_rules
  question: メリーランド州法では、車両の前方が少なくともどのくらいの距離まで明確に見えない場合、ヘッドライトを点灯しなければなりませんか？
  choices:
    A: 300フィート
    B: 500フィート
    C: 1,000フィート
    D: 1,500フィート
  answer: C
  explanation: 車両の前方が少なくとも1,000フィート先まで明確に見える十分な光がない場合は、常にヘッドライトを点灯しなければなりません。
- id: 82
  category: safe_driving_rules
  question: メリーランド州法により、次の場合にヘッドライトの点灯が義務付けられています：
  choices:
    A: 分離道路の左車線を走行しているとき
    B: 悪天候でワイパーを使用しているとき
    C: 踏切に近づいているとき
    D: 夜間に道路脇に駐車しているとき
  answer: B
  explanation: メリーランド州法では、悪天候でワイパーを使用する際にはヘッドライトを点灯することが義務付けられています。
- id: 83
  category: safe_driving_rules
  question: ハイビームのヘッドライトを使用している場合、他の車両の後ろを走行する際、どのくらいの距離でロービームに切り替えなければなりませんか？
  choices:
    A: 100フィート以下
    B: 200フィート以下
    C: 300フィート以下
    D: 500フィート以下
  answer: C
  explanation: 前方を走る車両との距離が300フィート以下になった場合は、ロービームに切り替えなければなりません。
- id: 84
  category: defensive_driving
  question: 夜間、対向車のヘッドライトで目が眩むのを防ぐために、どうすればよいですか？
  choices:
    A: よりよく見えるようにハイビームを点灯する
    B: 走行している車線の少し右側を見る
    C: 車両が通り過ぎるまで片目を閉じる
    D: 道路のセンターラインを直視する
  answer: B
  explanation: 向かってくる対向車のヘッドライトを直視してはいけません。代わりに、前方の道路を見るか、走行している車線の少し右側を見るようにしてください。
- id: 85
  category: safe_driving_rules
  question: 霧の中で運転する場合、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビームのヘッドライトのみ
    B: ロービームのヘッドライトのみ
    C: パーキングライトのみ
    D: ハザードランプとハイビーム
  answer: B
  explanation: 霧の中で運転する際は、ロービームのヘッドライトのみを使用し、フォグランプが装備されている場合はそれも使用してください。
- id: 86
  category: defensive_driving
  question: 霧が非常に濃く、安全に運転できない場合はどうすればよいですか？
  choices:
    A: 車線の中央に停止し、霧が晴れるのを待つ
    B: ハイビームを点灯し、時速10マイルで走行する
    C: 道路から完全に離れた安全な場所に車を停め、ハザードランプを点灯する
    D: 大型トラックのすぐ後ろを走り、そのテールランプを目印にする
  answer: C
  explanation: 霧が非常に濃く、安全に運転できない場合は、道路から完全に離れた安全な場所に車を停め、ハザードランプ（非常点滅表示灯）を点灯してください。
- id: 87
  category: vehicle_information
  question: 車両にアンチロック・ブレーキ・システム（ABS）が装備されていない場合、濡れた道路や凍結した道路でのスリップを防ぐためにどうすればよいですか？
  choices:
    A: ブレーキを強く踏み込む。
    B: ポンピングブレーキ（ブレーキを何度か踏み込む）を行う。
    C: サイドブレーキ（パーキングブレーキ）を引く。
    D: ニュートラルに入れて惰性で進む。
  answer: B
  explanation: マニュアルによると、「車両にアンチロック・ブレーキ・システムが装備されていない場合は、スリップを防ぐためにポンピングブレーキを行ってください」とされています。
- id: 88
  category: defensive_driving
  question: 道路の他の部分よりも先に凍結しやすいのはどの場所ですか？
  choices:
    A: 交差点と横断歩道
    B: ランプ（出入口の傾斜路）と橋
    C: トンネルと地下道
    D: 直線道路と路肩
  answer: B
  explanation: マニュアルでは、「ランプや橋は通常の道路よりも先に凍結する」と警告しています。
- id: 89
  category: defensive_driving
  question: 「ブラックアイス」とは何ですか？
  choices:
    A: 夜間にのみ形成される氷
    B: 泥が混ざった厚い雪の層
    C: アスファルトの道路上にできる、見えにくい薄い氷の層
    D: 橋や高架橋にのみ形成される氷
  answer: C
  explanation: マニュアルでは、ブラックアイスを「氷や雪が溶けて再凍結することによってアスファルトの道路上にできる、非常に見えにくい、あるいは全く見えない薄い氷の層」と説明しています。
- id: 90
  category: vehicle_information
  question: 雪や氷の上でのトラクション（駆動力）を確保するために、車の緊急キットに入れておくことが推奨されているものは次のうちどれですか？
  choices:
    A: 猫砂または砂
    B: 予備のエンジンオイル
    C: スペアタイヤ
    D: 発炎筒
  answer: A
  explanation: マニュアルの緊急キットの備品リストには、「猫砂または砂（雪や氷の上でのトラクション確保のため）」が含まれています。
- id: 91
  category: defensive_driving
  question: 車がスリップ（横滑り）し始めた場合、コントロールを取り戻すための基本的なルールは何ですか？
  choices:
    A: すぐに急ブレーキをかける。
    B: スリップしている方向とは逆の方向にハンドルを切る。
    C: スリップしている方向にハンドルを切る。
    D: 目を閉じて衝撃に備える。
  answer: C
  explanation: 車がスリップし始めた場合の基本ルールには、「スリップしている方向にハンドルを切る」ことや、アクセルまたはブレーキペダルから足を離すことが含まれます。
- id: 92
  category: defensive_driving
  question: 車がハイドロプレーニング現象を起こし始めた場合、どうすればよいですか？
  choices:
    A: しっかりとブレーキをかける。
    B: アクセルから足を離し、車をまっすぐ進ませる。
    C: トラクション（グリップ）を取り戻すためにハンドルを急に切る。
    D: 加速して水を押し退ける。
  answer: B
  explanation: ハイドロプレーニング現象によりコントロールを失い始めた場合、マニュアルには次のように指示されています。「アクセルから足を離します。ブレーキをかけてはいけません。車をまっすぐ進ませます。コントロールを取り戻すまで減速してください。」
- id: 93
  category: sharing_the_road
  question: 次のうち、すべての踏切の手前で一時停止することが義務付けられている車両はどれですか？
  choices:
    A: オートバイと原動機付自転車（モペッド）
    B: 乗用車とSUV
    C: バス、スクールバス、および危険物を積載したトラック
    D: 点滅灯をつけている緊急車両
  answer: C
  explanation: マニュアルには、「バス、スクールバス、および危険物を積載したトラックは、すべての踏切の手前で一時停止しなければならない」と記載されています。
- id: 94
  category: safe_driving_rules
  question: 踏切内またはその近くで緊急事態が発生した場合、まず何をすべきですか？
  choices:
    A: 車内にとどまり、911に電話する。
    B: 車から降りて線路から離れる。
    C: 自分で車を線路から押し出そうとする。
    D: 旗を振って接近してくる列車を止める。
  answer: B
  explanation: マニュアルでは、「踏切内またはその近くで緊急事態が発生した場合は、車から降りて線路から離れてください」とアドバイスしています。
- id: 95
  category: signs_and_signals
  question: 作業区間（工事現場）を示す標識は何色ですか？
  choices:
    A: 緑色
    B: 青色
    C: オレンジ色
    D: 赤色
  answer: C
  explanation: マニュアルによると、「オレンジ色は作業区間を示す色です。運転中にオレンジ色の標識を見かけたら、十分に注意を払ってください…」とされています。
- id: 96
  category: signs_and_signals
  question: 作業区間において、青色の点滅灯は何を示していますか？
  choices:
    A: 作業員がいること
    B: 前方に道路維持作業車がいること
    C: 速度違反取締カメラが稼働中であること
    D: 迂回路が近づいていること
  answer: C
  explanation: マニュアルの「作業区間におけるライト」のセクションでは、「青色の点滅灯」は「速度違反取締カメラが稼働中であること」を示すと規定されています。
- id: 97
  category: signs_and_signals
  question: 作業区間における琥珀色（アンバー）または黄色の点滅灯は何を意味しますか？
  choices:
    A: 速度違反取締カメラが稼働中であること
    B: 作業区間が稼働中である、または作業員がいること
    C: 道路維持作業車
    D: 作業区間が終了したこと
  answer: B
  explanation: マニュアルには、「琥珀色/黄色の点滅灯」は「作業区間が稼働中である/作業員がいること」を意味すると記載されています。
- id: 98
  category: safe_driving_rules
  question: トラフィックサークル（ラウンドアバウト/環状交差点）に接近する際、誰に優先権がありますか？
  choices:
    A: トラフィックサークルに進入しようとしている車両
    B: すでにサークル内を通行している車両
    C: 右側にいる車両
    D: トラックやバスなどの大型車両
  answer: B
  explanation: マニュアルには、「トラフィックサークルに進入する際は、常にすでにサークル内を通行している車両に道を譲らなければならない」と規定されています。
- id: 99
  category: safe_driving_rules
  question: 複数車線のあるトラフィックサークルから退出する準備をする際、どうすればよいですか？
  choices:
    A: 左折の合図（ウィンカー）を出し、停止する。
    B: 自分が退出する一つ前の出口を過ぎたら、右折の合図を出し、外側の車線に移動する。
    C: 急加速して他の車両の前に割り込む。
    D: クラクションを鳴らして、自分が退出することを他の運転手に警告する。
  answer: B
  explanation: マニュアルでは、「退出する準備をする際は、自分が利用する予定の出口の一つ前の出口を過ぎた後に、右折の合図を出して外側の車線に移動してください」と説明されています。
- id: 100
  category: safe_driving_rules
  question: 州間高速道路（インターステート）に進入する際の加速車線の目的は何ですか？
  choices:
    A: 右側から遅い車両を追い越すため。
    B: すでに州間高速道路を走っている車の流れに自分の速度を合わせるため。
    C: 緊急時に車を駐車するため。
    D: 高速道路から安全に退出するため。
  answer: B
  explanation: マニュアルによると、加速車線は、すでに州間高速道路を走っている車の流れに自分の速度を合わせるために使用します。
- id: 101
  category: safe_driving_rules
  question: 州間高速道路（インターステート）で間違った出口で降りてしまった場合、どうすればよいですか？
  choices:
    A: 路肩に停止して後退（バック）する。
    B: 出口ランプ（降り口）でUターンする。
    C: 出口ランプを降りきるまで進み、再び本線に入る方法を探す。
    D: 減速車線で停止し、他の車がいなくなるのを待つ。
  answer: C
  explanation: マニュアルには次のように記載されています。「間違った場所で降りてしまった場合は、出口ランプを降りきるまで進んでください。その後、再び道路に入る方法を探してください。高速道路のいかなる場所でも、絶対に停止したり後退（バック）したりしないでください。」
- id: 102
  category: safe_driving_rules
  question: 州間高速道路や自動車専用道路の路肩に停止することが許可されるのはどのような場合ですか？
  choices:
    A: 携帯電話の電話に出る必要があるとき。
    B: 休憩を取りたいとき。
    C: 車両が故障したとき、またはその他の緊急事態が発生したときのみ。
    D: GPS（カーナビ）を確認する必要があるとき。
  answer: C
  explanation: 路肩に停止することは可能ですが、車両が故障した（動かなくなった）場合や、その他の緊急事態が発生した場合に限られます。
- id: 103
  category: sharing_the_road
  question: 葬儀の車列に対して、他の車両はどのように対応しなければなりませんか？
  choices:
    A: 青信号であっても、優先権を譲らなければならない。
    B: 青信号であれば、通常通り進行してよい。
    C: 敬意を表すためにクラクションを鳴らすべきである。
    D: 車列の右側から追い越してもよい。
  answer: A
  explanation: マニュアルには次のように記載されています。「青信号であっても、他の車両は葬儀の車列の車両に優先権を譲らなければなりません。」
- id: 104
  category: signs_and_signals
  question: 車両の後部にある低速車マーク（slow-moving vehicle sign）は、その車両がどのくらいの速度で走行していることを警告していますか？
  choices:
    A: 時速15マイル以下
    B: 時速25マイル以下
    C: 時速35マイル以下
    D: 時速45マイル以下
  answer: B
  explanation: 一部の低速車両は、時速25マイル以下でしか走行していないことを警告するために、後部に低速車マークを付けている場合があります。
- id: 105
  category: alcohol_drugs_health
  question: メリーランド州では、血中アルコール濃度（BAC）がどのレベル以上の場合、飲酒運転（DUI）とみなされますか？
  choices:
    A: '.04'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: C
  explanation: メリーランド州では、血中アルコール濃度（BAC）が.08以上の場合、飲酒運転とみなされます。
- id: 106
  category: penalties_and_points
  question: 21歳未満の運転者が警察に止められ、飲酒していた場合、法的にどのような結果になりますか？
  choices:
    A: 初犯の場合は警告を受ける。
    B: 運転免許が停止または取り消される。
    C: 免許を失うことなく、義務付けられた安全運転講習を受講しなければならない。
    D: BACが.08以上の場合にのみ罰金を科される。
  answer: B
  explanation: 21歳未満で警察に止められ、飲酒していた場合、運転免許は停止または取り消されます。
- id: 107
  category: alcohol_drugs_health
  question: 蓋の開いたアルコール飲料の容器を置くことが違法となる「乗客エリア（passenger area）」に含まれるのは、次のうちどれですか？
  choices:
    A: 運転席のみ。
    B: 車のトランク。
    C: 運転者や同乗者が座っている場所から簡単に手が届くすべての場所。
    D: 車の後部座席のみ。
  answer: C
  explanation: 車両の乗客エリアには、運転席と同乗者席、および運転者や同乗者が座っている場所から簡単に手が届くすべての場所が含まれます。
- id: 108
  category: penalties_and_points
  question: 子供を車に乗せた状態で飲酒または薬物影響下の運転違反で有罪判決を受けた場合、どうなる可能性がありますか？
  choices:
    A: 裁判官によって罰金と懲役刑が2倍にされる可能性がある。
    B: 車両が永久に没収される。
    C: 生涯運転が禁止される。
    D: 通常の交通違反切符を切られる。
  answer: A
  explanation: 子供を車に乗せた状態で飲酒または薬物影響下の運転違反で有罪判決を受けた場合、裁判官は罰金と懲役刑を2倍にすることができます。
- id: 109
  category: defensive_driving
  question: 次のうち、攻撃的な運転（アグレッシブ・ドライビング）の例はどれですか？
  choices:
    A: 歩行者に優先権を譲る。
    B: 車線変更の前に方向指示器（ウィンカー）を使用する。
    C: 危険な車線変更や車間距離を詰める行為（テールゲーティング）をする。
    D: 他の車より遅く走る際に右側車線を走行する。
  answer: C
  explanation: 攻撃的な運転の例には、スピード違反、車間距離を詰める行為（テールゲーティング）、交通信号や標識の無視、危険な車線変更、優先権を譲らないこと、危険または違法な追い越しなどがあります。
- id: 110
  category: safe_driving_rules
  question: 18歳未満の運転者に対する携帯電話の使用規則は何ですか？
  choices:
    A: いつでもハンズフリーで携帯電話を使用できる。
    B: 赤信号で停止中であればテキストメッセージを送信できる。
    C: 911への緊急通報を行う場合を除き、運転中に携帯電話を使用してはならない。
    D: 親が同乗していれば、手持ちの携帯電話を使用できる。
  answer: C
  explanation: 18歳未満の場合、ハンズフリーであっても運転中に携帯電話を使用することはできません。唯一の例外は、911への緊急通報を行うために使用する場合です。
- id: 111
  category: safe_driving_rules
  question: メリーランド州における成人の運転中の携帯電話使用について、正しい記述は次のうちどれですか？
  choices:
    A: 州間高速道路を走行中であれば、運転中のテキストメッセージ送信は合法である。
    B: 手持ち（ハンドヘルド）の携帯電話の使用は違法だが、ハンズフリーでの使用は許可されている。
    C: ハンズフリーを含め、すべての運転手にとって携帯電話の使用は完全に違法である。
    D: 制限速度以下で運転している場合、電話をかけるために携帯電話を手に持ってもよい。
  answer: B
  explanation: 運転中に手持ちの携帯電話を使用すること（テキストメッセージの送信を含む）は違法です。手に持たない状態（ハンズフリー）であれば、運転中に電話を使用することができます。
- id: 112
  category: alcohol_drugs_health
  question: 睡眠不足は運転能力にどのような影響を与えますか？
  choices:
    A: 反応時間が長くなり、注意力が高まる。
    B: 反応が遅れ、注意力が低下し、判断力が鈍る。
    C: 視覚にのみ影響を与え、判断力には影響しない。
    D: 攻撃的な運転をしやすくなるが、運動機能は損なわれない。
  answer: B
  explanation: 眠気は、薬物やアルコールと同様に、反応を遅らせ、注意力を低下させ、判断力を鈍らせます。
- id: 113
  category: defensive_driving
  question: 居眠り運転（眠気を催しながらの運転）の危険信号とされるのは、次のうちどれですか？
  choices:
    A: 過去数マイルの運転をはっきりと覚えている。
    B: 一定の速度を保っている。
    C: 考えがまとまらず、上の空になる。
    D: 頻繁にミラーを確認している。
  answer: C
  explanation: マニュアルによると、眠気を催している運転手の危険信号には、考えがまとまらず上の空になること、過去数マイルの運転を覚えていないこと、速度が変動し続けることなどがあります。
- id: 114
  category: penalties_and_points
  question: メリーランド州で飲酒・薬物運転（impaired driving）で逮捕された場合、どのような結果を招く可能性がありますか？
  choices:
    A: 初犯の場合は警告のみ。
    B: 高額な罰金、懲役刑の可能性、および数千ドルの裁判費用。
    C: 一時的な免許停止のみ。
    D: 罰金なしの義務的な社会奉仕活動。
  answer: B
  explanation: マニュアルには、飲酒・薬物運転で逮捕されると、高額な罰金、懲役刑の可能性、数千ドルの裁判費用など、深刻な結果を招くと記載されています。
- id: 115
  category: defensive_driving
  question: マニュアルによると、死亡事故のうち、わき見運転（ながら運転）が原因である割合はどれくらいですか？
  choices:
    A: 4分の1
    B: 3分の1
    C: 2分の1
    D: 3分の2
  answer: B
  explanation: マニュアルには、死亡事故の3分の1がわき見運転（ながら運転）によって引き起こされていると明記されています。
- id: 116
  category: sharing_the_road
  question: 前方の車両が横断歩道で停止している場合、あなたはどうしなければなりませんか？
  choices:
    A: その車両の左側を追い越す。
    B: クラクションを鳴らして歩行者に警告する。
    C: スペースがあれば、その車両の右側を追い越す。
    D: 停止している車両を追い越さない。
  answer: D
  explanation: マニュアルには横断歩道の基本ルールとして、「横断歩道で停止している車両を追い越してはならない」と記載されています。
- id: 117
  category: safe_driving_rules
  question: サイレンや赤色灯を使用しながら接近してくる緊急車両を見たり聞いたりした直後、あなたはどうしなければなりませんか？
  choices:
    A: 速度を上げて進路を譲る。
    B: できるだけ道路の端に寄って停止する。
    C: 交差点の真ん中で直ちに停止する。
    D: 現在の速度を維持したまま右車線に移動する。
  answer: B
  explanation: 緊急車両がサイレンや赤色灯を使用して接近してきた場合、できるだけ道路の端に寄り、交差点を避けて、緊急車両が通過するまで停止していなければなりません。
- id: 118
  category: safe_driving_rules
  question: 道路脇に停止しているレッカー車に近づいた際、隣接していない車線へ安全に移動できない場合、どうすべきですか？
  choices:
    A: 速度を維持し、クラクションを鳴らす。
    B: レッカー車が離れるまで完全に停止する。
    C: 安全な速度まで減速し、必要に応じて停止する準備をする。
    D: 加速して素早くその車両を通り過ぎる。
  answer: C
  explanation: 停止している緊急車両や作業車両に隣接していない車線へ移動することが不可能な場合は、安全な速度まで減速し、必要に応じて停止する準備をしなければなりません。
- id: 119
  category: sharing_the_road
  question: 交差点に近づく際、大型トラックの右側を追い越すのが危険なのはなぜですか？
  choices:
    A: トラックが大回りをして右折する準備をしている可能性があるため。
    B: トラックは交差点での右折が禁止されているため。
    C: トラックは乗用車よりも早く加速するため。
    D: トラックは常に右車線から左折するため。
  answer: A
  explanation: トラックは右折時に大回りをするため、右折する前に左に寄ることがよくあります。右側を追い越すと、右折するトラックと縁石の間に挟まれる可能性があるため危険です。
- id: 120
  category: vehicle_information
  question: 完全に積載された80,000ポンドのトラックが完全に停止するまでに、およそどのくらいの距離が必要ですか？
  choices:
    A: 標準的な乗用車の長さ
    B: 50フィート
    C: アメリカンフットボールのフィールドの長さ
    D: 半マイル
  answer: C
  explanation: マニュアルには、完全に積載されたトラックは80,000ポンドを超えることがあり、停止するまでにアメリカンフットボールのフィールドの長さほどの距離を要すると記載されています。
- id: 121
  category: sharing_the_road
  question: 大型トラックを追い越す際、トラックの前方の車線に戻るのが安全なのはいつですか？
  choices:
    A: 自分の車のリアバンパーがトラックのフロントバンパーを通り過ぎたらすぐ
    B: ルームミラーにトラックの両方のヘッドライトが見えたとき
    C: トラックの運転手がハイビームを点滅させたとき
    D: 追い越し速度を10秒間維持した後
  answer: B
  explanation: ルームミラーにトラックの両方のヘッドライトが見えるようになってから、トラックの前方の車線に戻るべきです。これにより、トラックの前方の死角（フロント・ノーゾーン）に割り込むことを防ぎます。
- id: 122
  category: safe_driving_rules
  question: 赤いライトを点滅させて道路上に停車しているスクールバスから、どのくらい離れて停止しなければなりませんか？
  choices:
    A: 少なくとも10フィート
    B: 少なくとも15フィート
    C: 少なくとも20フィート
    D: 少なくとも50フィート
  answer: C
  explanation: スクールバスが赤いライトを点滅させて道路上に停車している場合、運転手はバスの前方または後方から少なくとも20フィート離れて停止しなければなりません。
- id: 123
  category: safe_driving_rules
  question: 赤いライトを点滅させているスクールバスに対して、停止しなくてもよいのはどのような場合ですか？
  choices:
    A: 2車線道路で反対方向に向かって走行している場合
    B: 物理的な分離帯で区切られた多車線道路を走行しており、バスが反対側にいる場合
    C: 仕事に遅刻しそうな場合
    D: バスが踏切で停車している場合
  answer: B
  explanation: 物理的な分離帯で区切られた多車線道路を走行している場合、バスが分離帯の反対側にいるのであれば停止する必要はありません。
- id: 124
  category: sharing_the_road
  question: オートバイが関与する自動車事故の半数以上において、過失があるのは誰ですか？
  choices:
    A: オートバイの運転手
    B: 自動車の運転手
    C: 両方の運転手に同等の過失がある
    D: 歩行者
  answer: B
  explanation: マニュアルによると、オートバイとの自動車事故の半数以上で自動車の運転手に過失があり、特に左折時に優先権（right-of-way）を譲らないケースが目立ちます。
- id: 125
  category: safe_driving_rules
  question: オートバイの後ろを走行する際、推奨される最小車間距離はどのくらいですか？
  choices:
    A: 1〜2秒
    B: 3〜4秒
    C: 5〜6秒
    D: 10秒
  answer: B
  explanation: 自分の車と前方のオートバイとの間には、少なくとも3〜4秒の車間距離を空けるべきです。
- id: 126
  category: sharing_the_road
  question: オートバイと同じ車線を共有（並走）してはならないのはなぜですか？
  choices:
    A: オートバイは路肩を走行することが義務付けられているため
    B: オートバイの運転手は車線全体を使用することが許可されており、危険を避けるために車線内を移動することがあるため
    C: 自動車が右側車線を走行することは違法であるため
    D: オートバイは音が大きすぎて気を散らすため
  answer: B
  explanation: オートバイの運転手は車線全体を使用することが許可されており、道路上の危険や風を避けたり、他から見えやすくしたりするために車線内を頻繁に移動するため、オートバイと車線を共有するべきではありません。
- id: 127
  category: sharing_the_road
  question: メリーランド州法では、自転車はどのように分類されていますか？
  choices:
    A: 歩行者の付属品として
    B: 娯楽用の玩具として
    C: すべての交通信号に従わなければならない車両として
    D: 電動スクーターとして
  answer: C
  explanation: メリーランド州法によれば、自転車は車両です。自転車の運転手は道路を使用することが許可されており、すべての交通信号に従わなければなりません。
- id: 128
  category: sharing_the_road
  question: 自転車の走行が想定されていない、または許可されていない場所はどこですか？
  choices:
    A: 住宅街の道路
    B: 州間高速道路および有料橋
    C: 路肩のない道路
    D: ロータリー（環状交差点）
  answer: B
  explanation: マニュアルによると、州間高速道路や有料の橋・トンネルを除く、あらゆる種類の道路で自転車が走行していることを想定しておく必要があります。
- id: 129
  category: sharing_the_road
  question: 自転車を追い越す際、自分の車と自転車との間に空けなければならない最小距離はどのくらいですか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 5フィート
  answer: B
  explanation: マニュアルには、追い越す際には自分の車と自転車との間に少なくとも3フィートの距離を空けなければならないと記載されています。
- id: 130
  category: safe_driving_rules
  question: 自転車が横断歩道を走行している場合、どのような優先権のルールが適用されますか？
  choices:
    A: すべての自動車に道を譲らなければならない。
    B: 歩行者と同じ優先権を持つ。
    C: 自転車から降りた場合にのみ優先権を持つ。
    D: 横断歩道の使用は許可されていない。
  answer: B
  explanation: マニュアルには、横断歩道において自転車は歩行者と同じ優先権（right-of-way）を持つと明記されています。
- id: 131
  category: defensive_driving
  question: 自転車が右端ではなく、走行車線の中央を合法的に走行することがあるのはなぜですか？
  choices:
    A: 後続の交通を意図的に遅らせるため。
    B: 道路が狭いか、障害物を避けるため。
    C: Uターンの準備をしている時のみ。
    D: 自転車が走行車線の中央を走行することは決して許可されていない。
  answer: B
  explanation: 自転車は、道路が狭い場合、障害物や路面の危険を避ける場合、または右側に車が駐車されている場合、自身の安全のために走行車線に出て走行することがあります。
- id: 132
  category: sharing_the_road
  question: 後方から自転車に近づく際、どうするべきですか？
  choices:
    A: クラクションを鳴らして自分の存在を知らせる。
    B: スピードを上げてできるだけ早く追い越す。
    C: 減速し、クラクションは鳴らさない。
    D: ハイビームを繰り返し点滅させる。
  answer: C
  explanation: 自転車に近づく際は、減速し、クラクションを鳴らしてはいけません。大きな音は自転車に乗っている人を驚かせ、衝突事故を引き起こす原因となるためです。
- id: 133
  category: sharing_the_road
  question: モペッドやモータースクーターはどのような種類の道路で走行することが許可されていますか？
  choices:
    A: 制限速度が35 mph以下の道路のみ。
    B: 標識で示された最高制限速度が50 mph以下のすべての道路。
    C: すべての州間高速道路。
    D: 指定された自転車専用レーンがある道路のみ。
  answer: B
  explanation: モペッドやスクーターは、標識で示された最高制限速度が50 mph（時速50マイル）以下の道路であれば走行することができます。
- id: 134
  category: vehicle_information
  question: 先進運転支援システム（ADAS）の既知の限界は何ですか？
  choices:
    A: 日中のみ機能する。
    B: 雨、雪、霧、丘陵地帯、およびカーブでは適切に機能しない場合がある。
    C: ドライバーがミラーを確認する必要性を完全に代替する。
    D: 衝突事故を100%防ぐことが保証されている。
  answer: B
  explanation: マニュアルでは、ADAS技術には限界があり、雨、雪、霧、丘陵地帯、およびカーブでは適切に機能しない場合があることが警告されています。
- id: 135
  category: driver_responsibility
  question: 負傷者がいる衝突事故に巻き込まれた場合、車両をどうしなければなりませんか？
  choices:
    A: すぐに路肩に移動させる。
    B: 最寄りの警察署まで運転する。
    C: 車両を動かさない。
    D: 私道（ドライブウェイ）を塞いでいる場合のみ移動させる。
  answer: C
  explanation: 負傷者がいる衝突事故に巻き込まれた場合、現場に留まり、911に通報し、車両を動かしてはいけません。
- id: 136
  category: penalties_and_points
  question: 死亡者がいる衝突事故の現場から立ち去った（ひき逃げした）場合の罰則は何ですか？
  choices:
    A: 軽犯罪および500ドルの罰金。
    B: 重罪、最長10年の懲役、および最高10,000ドルの罰金。
    C: 最長5年の懲役および5,000ドルの罰金。
    D: 警告および免許証への3点の加点。
  answer: B
  explanation: 死亡者がいる衝突事故の現場から立ち去ることは重罪です。最長10年の懲役、および最高10,000ドルの罰金が科せられる可能性があります。
- id: 137
  category: driver_responsibility
  question: 負傷者がおらず、車両が動かせる衝突事故に遭った場合、あなたの最初の責任は何ですか？
  choices:
    A: 警察が到着するまで、車両をそのままの場所に残しておく。
    B: 事故が発生した場所にできるだけ近い道路外へ車両を移動させる。
    C: 交通を止めて、道路上の車両の写真を撮る。
    D: 家に帰り、翌日事故を報告する。
  answer: B
  explanation: 負傷者がおらず、車両が動かせる場合は、全員の安全を確保し渋滞を防ぐため、事故が発生した場所にできるだけ近い道路外へ車両を移動させる必要があります。
- id: 138
  category: driver_responsibility
  question: 衝突事故の後、常に警察を呼ばなければならないのは次のどの状況ですか？
  choices:
    A: 損害額が1,000ドルを超える場合のみ。
    B: ドライバーがアルコールや薬物の影響下にあると思われる場合。
    C: 事故が州間高速道路で発生した場合のみ。
    D: 動物をひいた時はいつでも。
  answer: B
  explanation: 負傷者がいる場合、車両が動かせない場合、またはドライバーがアルコールや薬物の影響下にあると思われる場合は、常に警察を呼ばなければなりません。
- id: 139
  category: safe_driving_rules
  question: 右折の準備をする際、自転車に関してどうするべきですか？
  choices:
    A: 自転車を追い越した直後に、直進車線から右折する。
    B: クラクションを鳴らして自転車を歩道に強制的に移動させてから右折する。
    C: 自転車専用レーン、路肩、または右折専用レーン内の可能な限り右側に寄る。
    D: 自転車を避けるために、常に代わりに左折する。
  answer: C
  explanation: 右折を始める前に、自転車専用レーン、路肩、または右折専用レーン内の可能な限り右側に寄る必要があります。
- id: 140
  category: defensive_driving
  question: 夜間、道路上に薄暗く反射する物体を見た場合、どうするべきですか？
  choices:
    A: ハイビームを点灯して自転車の目をくらませる。
    B: 道路外にあると判断し、速度を維持する。
    C: 道路外にあると思い込まず、近づく際はロービームのヘッドライトを使用する。
    D: 通り過ぎるまでクラクションを鳴らし続ける。
  answer: C
  explanation: 夜間に薄暗く反射する物体を見た場合、それが道路外にあると思い込んではいけません。自転車である可能性があります。自転車に近づく際は、ロービームのヘッドライトを使用してください。
- id: 141
  category: sharing_the_road
  question: 自転車が歩道を走行する場合、どのような規則に従わなければなりませんか？
  choices:
    A: 最低でも時速15マイルで走行しなければならない。
    B: すべての歩行者に対して優先権がある。
    C: 歩行者および移動補助器具を使用している人に優先権を譲らなければならない。
    D: 車両の進行方向とは逆の方向に走行しなければならない。
  answer: C
  explanation: 歩道で自転車に乗る場合、自転車の運転者は歩行者や移動補助器具を使用している人に優先権を譲ることを忘れてはなりません。
- id: 142
  category: vehicle_information
  question: マニュアルによると、先進運転支援システム（ADAS）を適切に使用した場合、事故の何パーセントを防ぐことができますか？
  choices:
    A: 10%
    B: 25%
    C: 40%
    D: 75%
  answer: C
  explanation: マニュアルには、ADAS技術を適切に使用した場合、事故の40%を防ぐことができると記載されています。
- id: 143
  category: driver_responsibility
  question: 駐車中の無人車両に衝突し、その所有者が見つからない場合、何をしなければなりませんか？
  choices:
    A: 所有者が戻るまで車両のそばで待つ。
    B: レッカー車を呼んで車両を移動させる。
    C: 連絡先を記載したメモを、見つけやすい場所に残す。
    D: 24時間以内に保険会社に事故を報告し、現場を離れる。
  answer: C
  explanation: 衝突した無人の所有物の持ち主が見つからない場合は、何が起こったかと自分の連絡先を記載したメモを、相手が見つけやすい場所に残さなければなりません。
- id: 144
  category: safe_driving_rules
  question: 車で犬や牛などの家畜・ペットをはねて怪我をさせてしまった場合、直ちに何をしなければなりませんか？
  choices:
    A: 警察に電話する。
    B: 動物を道路の端に移動させる。
    C: 動物の飼い主を探す。
    D: 動物を最寄りの獣医に連れて行く。
  answer: A
  explanation: マニュアルには、車で家畜やペットをはねて怪我をさせた場合は、直ちに警察に通報しなければならないと記載されています。
- id: 145
  category: defensive_driving
  question: 路上での緊急時において、絶対に車両を停車または駐車してはいけない場所はどこですか？
  choices:
    A: 道路の路肩。
    B: 近くの駐車場。
    C: 出口ランプ（オフランプ）。
    D: ランプが道路から分岐する場所にある、三角形にペイントされたゼブラゾーン（導流帯）。
  answer: D
  explanation: マニュアルには、「ランプが道路から分岐する場所にある、三角形にペイントされたゾーンには絶対に停車または駐車してはならない」と明記されています。
- id: 146
  category: defensive_driving
  question: 路上での緊急時に車内に留まることが安全でない場合、車外でどのように待機すべきですか？
  choices:
    A: 他の車に警告するため、自分の車の真後ろに立つ。
    B: 防護柵やガードレールの後ろに移動し、対向車（接近してくる車）の方向を向く。
    C: 助けを呼ぶために、最も近い車線に立って手を振る。
    D: 車の進行方向とは逆を向いて路肩に座る。
  answer: B
  explanation: 車内に留まることができない場合は、速やかに道路から離れ、土手やガードレールの後ろに移動し、接近してくる車の方向を向いて待機する必要があります。
- id: 147
  category: safe_driving_rules
  question: 警察官に車を止められた際、両手をどこに置いておくのが最も良いですか？
  choices:
    A: ポケットの中。
    B: グローブボックスに手を伸ばす。
    C: よく見えるようにハンドルの上。
    D: 運転席側の窓の外。
  answer: C
  explanation: 交通取締りで止められた際は、両手をよく見える場所に置いておく必要があり、マニュアルには「ハンドルの上が最適である」と記されています。
- id: 148
  category: safe_driving_rules
  question: メリーランド州の「ムーブ・オーバー法（車線変更義務法）」によると、点滅灯をつけて停車している車両のために車線を変更することが安全ではない、または不可能な場合、何をしなければなりませんか？
  choices:
    A: 点滅灯が消えるまで車両を完全に停止させる。
    B: 停車している車両に警告するためにクラクションを鳴らす。
    C: 速度を維持したまま、車線の端に寄る。
    D: 安全な速度まで減速する。
  answer: D
  explanation: 点滅灯をつけている車両のために車線を変更することが安全ではない、または不可能な場合、ムーブ・オーバー法により安全な速度まで減速することが義務付けられています。
- id: 149
  category: penalties_and_points
  question: ムーブ・オーバー法（車線変更義務法）に違反し、その違反が原因で事故を引き起こした場合の罰則は何ですか？
  choices:
    A: 罰金110ドルおよび免許の違反点数1点。
    B: 罰金150ドルおよび免許の違反点数3点。
    C: 罰金750ドルおよび免許の違反点数3点。
    D: 罰金500ドルおよび免許停止。
  answer: B
  explanation: ムーブ・オーバー法違反は軽犯罪であり、違反が原因で事故を引き起こした場合は、150ドルの罰金と3点の違反点数が科せられます。
- id: 150
  category: sharing_the_road
  question: 自動車とオートバイが絡む事故において、半数以上のケースで過失があるのは誰ですか？
  choices:
    A: オートバイの運転手。
    B: 自動車の運転手。
    C: 両方の運転手に同等の過失がある。
    D: どちらの運転手にも過失はない。
  answer: B
  explanation: マニュアルには、自動車とオートバイが絡む事故が発生した場合、半数以上のケースで自動車の運転手に過失があると記載されています。
- id: 151
  category: license_system
  question: 暫定免許 (Provisional License) を取得して最初の151日間（18歳未満の場合）、大人の同乗なしで誰を乗せて運転することが許可されていますか？
  choices:
    A: 18歳未満のすべての同乗者
    B: 直系家族のみ
    C: 最大3人の友人
    D: いかなる状況でも同乗者は許可されない
  answer: B
  explanation: 18歳未満で暫定免許を持っている場合、最初の151日間は、直系家族でない限り、18歳未満の同乗者を乗せて大人の同乗なしで運転することはできません。
- id: 152
  category: license_system
  question: 暫定免許の所持者が、午前0時から午前5時までの間に大人の同乗なしで運転できるのはどのような条件のときですか？
  choices:
    A: 公式な学校行事への行き帰りの運転時
    B: 友人の家から帰宅する運転時
    C: 親のお使いをしている時
    D: 空いている道路で運転の練習をしている時
  answer: A
  explanation: 暫定免許の所持者が午前0時から午前5時までの間に大人の同乗なしで運転できるのは、仕事、ボランティアプログラム、公式な学校行事、またはスポーツイベント/トレーニングへの行き帰りの場合「のみ」です。
- id: 153
  category: safe_driving_rules
  question: 仮免許 (Learner's Permit) または暫定免許 (Provisional License) を持つ運転者に対するワイヤレス機器の制限は何ですか？
  choices:
    A: 運転中はハンズフリー機器のみ使用できる
    B: 赤信号で停車している時のみワイヤレス機器を使用できる
    C: 911の緊急通報を除き、運転中にいかなるワイヤレス通信機器も使用してはならない
    D: GPSナビゲーションの目的でのみワイヤレス機器を使用できる
  answer: C
  explanation: 暫定免許または仮免許の所持者は、911の緊急通報という唯一の例外を除き、運転中にいかなるワイヤレス通信機器（ハンズフリーを含む）も使用してはなりません。
- id: 154
  category: alcohol_drugs_health
  question: メリーランド州のみなし同意法 (Implied Consent law) では、何をすることが義務付けられていますか？
  choices:
    A: 交通検問時に車両の捜索に同意すること
    B: 警察官に求められた場合、薬物またはアルコール検査を受けることに同意すること
    C: 逮捕された場合、車両がレッカー移動されることに同意すること
    D: 弁護士の立ち会いなしで、すべての質問に答えることに同意すること
  answer: B
  explanation: メリーランド州では、公道を運転することは、警察官から求められた場合に薬物またはアルコール検査を受けることに同意したとみなされます。
- id: 155
  category: alcohol_drugs_health
  question: メリーランド州では、血中アルコール濃度 (BAC) が何パーセントになると運転免許が停止されますか？
  choices:
    A: 0.04パーセント以上
    B: 0.06パーセント以上
    C: 0.08パーセント以上
    D: 0.10パーセント以上
  answer: C
  explanation: 血中アルコール濃度が0.08パーセント以上の場合、運転免許は停止されます。
- id: 156
  category: penalties_and_points
  question: 運転免許が停止または取消しとなった場合、その停止または取消しの期間は正式にいつから始まりますか？
  choices:
    A: 違反切符が発行された日
    B: 裁判所の審問日
    C: 郵送で通知を受け取った時
    D: MVAがあなたの免許証を受領した時
  answer: D
  explanation: マニュアルによると、免許が停止、取消し、拒否、または無効化された場合、免許証をMVAに返納しなければならず、停止または取消しの期間はMVAが免許証を受領した時点から始まります。
- id: 157
  category: penalties_and_points
  question: 暫定免許を持つ18歳未満の運転者が、初めて交通違反 (moving violation) を犯した場合の罰則は何ですか？
  choices:
    A: 運転免許の30日間停止
    B: 運転改善プログラムの修了
    C: 即時の免許取消し
    D: 運転免許の180日間停止
  answer: B
  explanation: マニュアルによると、暫定免許を持つ18歳未満の運転者が初めて交通違反を犯した場合、運転改善プログラムを修了することが義務付けられています。
- id: 158
  category: penalties_and_points
  question: 暫定免許を持つ18歳未満の運転者が、4回以上の交通違反を犯した場合、どうなりますか？
  choices:
    A: 免許が180日間停止される
    B: 免許が30日間停止される
    C: 免許が取り消され、再取得するにはすべての免許試験に合格しなければならない
    D: 運転の特権が永久に無効化される
  answer: C
  explanation: マニュアルによると、暫定免許を持つ未成年者が4回以上の違反を犯した場合、免許は取り消され、再取得するためにはすべての免許試験に合格しなければなりません。
- id: 159
  category: license_system
  question: MVAが運転免許を無効化 (cancel) する理由として、次のうちどれが該当しますか？
  choices:
    A: 免許の申請または取得時に不正行為を行った
    B: 商業地域で駐車違反切符を切られた
    C: 制限速度を5 mph超過して運転した
    D: 車両登録の更新を期限内に行わなかった
  answer: A
  explanation: 運転免許の無効化とは、運転の特権が終了することを意味します。免許の申請または取得時に不正行為を行ったと判断された場合、MVAは免許を無効化することがあります。
- id: 160
  category: penalties_and_points
  question: 暫定免許を持つ成人（18歳以上）が、2回目の交通違反で有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 免許の180日間停止
    B: 免許の取消し
    C: 免許の30日間停止
    D: MVAからの義務的な警告状
  answer: C
  explanation: 暫定免許を持つ18歳以上の成人の場合、2回目の違反で免許が30日間停止されます。
- id: 161
  category: driver_responsibility
  question: 有効な障害者用駐車許可証（プラカード）を持っている場合、障害者用駐車スペースの隣にあるアクセスアイル（乗降用スペース）に駐車することは合法ですか？
  choices:
    A: はい、障害を持つ本人が車に乗っている場合は合法です
    B: はい、ただし最大15分間のみです
    C: いいえ、障害者用のナンバープレートや許可証を持っていても違反になります
    D: はい、他に利用できる障害者用駐車スペースがない場合は合法です
  answer: C
  explanation: 障害者用のナンバープレートや許可証（プラカード）を持っていても、障害者用駐車スペースの隣にあるアクセスアイル（乗降用スペース）のいかなる部分に駐車しても、交通違反切符を切られる場合があります。
- id: 162
  category: alcohol_drugs_health
  question: 飲酒運転で捕まった場合、車にどのような装置を取り付ける必要がありますか？
  choices:
    A: GPS追跡装置
    B: 速度制限装置（スピードリミッター）
    C: 呼気検査式イグニッションインターロック（アルコール検知式エンジン始動ロック装置）
    D: 電子運行記録計（電子ログブック）
  answer: C
  explanation: 飲酒運転で捕まった場合、アルコールが検知されると車のエンジンがかからなくなる呼気検査式イグニッションインターロックを取り付ける必要があります。
- id: 163
  category: alcohol_drugs_health
  question: 運転免許証の申請または更新時に、MVA（車両管理局）に報告しなければならない病状は次のうちどれですか？
  choices:
    A: 5年前に完治した腕の骨折
    B: 高血圧
    C: 過去6ヶ月以内に意識喪失を引き起こした心臓疾患
    D: 季節性アレルギー
  answer: C
  explanation: 過去6ヶ月以内に意識喪失を引き起こした心臓疾患がある場合、運転能力に影響を与える可能性があるため、MVAに報告しなければなりません。
- id: 164
  category: license_system
  question: メリーランド州の仮免許（Learner's Permit）を所持している場合、同乗する監督ドライバーの要件は何ですか？
  choices:
    A: 18歳以上で、免許取得から1年以上経過していること
    B: 21歳以上で、同じクラスの車両を運転できる有効な免許を3年以上所持していること
    C: 25歳以上で、免許取得から5年以上経過していること
    D: 年齢や経験に関係なく、免許を持つすべてのドライバー
  answer: B
  explanation: 監督ドライバーは21歳以上であり、メリーランド州または他の州で同じクラスの車両を運転できる有効な免許を3年以上所持し、あなたの隣の席に座っている必要があります。
- id: 165
  category: driver_responsibility
  question: メリーランド州では、16歳の未成年者は臓器提供者（臓器ドナー）になることができますか？
  choices:
    A: いいえ、臓器提供者になるには18歳以上である必要があります
    B: はい、ただし特定の臓器に限られます
    C: はい、親または保護者が書面で同意した場合は可能です
    D: はい、制限や同意なしで可能です
  answer: C
  explanation: 16歳以上の未成年者は、親または保護者が書面で同意した場合、臓器提供者になることができます。
- id: 166
  category: driver_responsibility
  question: 車両の保険証（保険IDカード）に関して、正しいものは次のうちどれですか？
  choices:
    A: 物理的な紙のカードでなければならず、電子フォーマットは認められません
    B: 事故に巻き込まれた場合にのみ、法執行機関に提示する必要があります
    C: 運転中は常に携帯しなければならず、電子フォーマットでも構いません
    D: 車両が適切に登録されていれば、携帯は任意です
  answer: C
  explanation: 自動車を運転する際は、常に有効な保険証（保険IDカード）を携帯しなければならず、このカードは電子フォーマットでも認められます。
- id: 167
  category: safe_driving_rules
  question: メリーランド州のシートベルト法によると、シートベルトの着用またはチャイルドシートの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転手と助手席の乗客のみ
    B: 18歳未満の乗客のみ
    C: 自動車の運転手とすべての乗客
    D: 運転手のみ
  answer: C
  explanation: 法律により、自動車の運転手とすべての乗客は、シートベルトを着用するか、チャイルドシートに固定されなければなりません。
- id: 168
  category: safe_driving_rules
  question: 法律により、子供がチャイルドシートに乗る義務がなくなるのは、何歳および身長何インチですか？
  choices:
    A: 6歳または身長4フィート5インチ（約135cm）
    B: 8歳または身長4フィート9インチ（約145cm）
    C: 10歳または身長5フィート0インチ（約152cm）
    D: 5歳または体重40ポンド（約18kg）
  answer: B
  explanation: 8歳未満のすべての子供は、身長が4フィート9インチ（約145cm）以上でない限り、チャイルドシートに乗らなければなりません。
- id: 169
  category: safe_driving_rules
  question: 子供はいつまで後ろ向きのチャイルドシートに乗らなければなりませんか？
  choices:
    A: 1歳になるまで
    B: 2歳未満で、メーカーが指定する身長または体重に達するまで
    C: 3歳になるまで
    D: 体重が20ポンド（約9kg）になるまで
  answer: B
  explanation: 2歳未満の子供は、メーカーが指定する身長または体重に達するまで、連邦ガイドラインを満たす後ろ向きのチャイルドシートに乗らなければなりません。
- id: 170
  category: vehicle_information
  question: エアバッグから最大限の保護を得るために、ハンドルからどのくらい離れて座るようにすべきですか？
  choices:
    A: 5〜7インチ（約13〜18cm）
    B: 10〜12インチ（約25〜30cm）
    C: 15〜18インチ（約38〜46cm）
    D: 20〜24インチ（約51〜61cm）
  answer: B
  explanation: 衝突時に最大限の保護を得るために、ハンドルと胸の間に10〜12インチ（約25〜30cm）の距離を保つようにすべきです。
- id: 171
  category: license_system
  question: 免許停止（サスペンション）と免許取消（リボケーション）の違いは何ですか？
  choices:
    A: 免許停止は永久的であり、免許取消は一時的である。
    B: 免許取消は運転特権が終了し、二度と回復されないことを意味する。
    C: 免許取消は免許停止よりも重い処分であり、再交付を申請する前に最低限の待機期間が必要である。
    D: 免許停止はすべての免許試験を再受験する必要があるが、免許取消はその必要がない。
  answer: C
  explanation: メリーランド州の運転免許取消は、免許停止よりも重い処分です。取り消された場合、MVA（自動車局）に再交付を申請できるようになるまで、最低限の待機期間が設けられています。
- id: 172
  category: safe_driving_rules
  question: 何歳未満の子供は、後部座席でチャイルドシートまたはシートベルトを着用して乗車する必要がありますか？
  choices:
    A: 8歳
    B: 10歳
    C: 12歳
    D: 13歳
  answer: D
  explanation: マニュアルには、13歳未満の子供は後部座席でチャイルドシートまたはシートベルトを着用して乗車すべきであると記載されています。
- id: 173
  category: vehicle_information
  question: アンチロック・ブレーキ・システム（ABS）が作動したとき、どのようなことが起こると予想されますか？
  choices:
    A: ハンドルが固定されて動かなくなる。
    B: 足元のブレーキペダルが振動する。
    C: 車両が直ちに完全に停止する。
    D: ブレーキペダルが床まで沈み込む。
  answer: B
  explanation: ABSが作動すると、ブレーキからゴロゴロという音が聞こえることがあり、ロックを防ぐためにブレーキをポンピングするため、足元のブレーキペダルが振動します。
- id: 174
  category: safe_driving_rules
  question: 運転中のヘッドセット、イヤホン、耳栓の使用に関するメリーランド州の法律はどのようなものですか？
  choices:
    A: 両耳に装着して運転してはならない。
    B: GPSデバイスの音声を聞く場合であれば使用できる。
    C: 高速道路でのみ許可されている。
    D: 音量が小さければ使用できる。
  answer: A
  explanation: 両耳に耳栓、ヘッドセット、またはイヤホンを装着して運転することはできません。補聴器の使用は許可されています。
- id: 175
  category: driver_testing
  question: メリーランド州の運転免許試験で、現在要求されなくなった駐車操作はどれですか？
  choices:
    A: 前向き駐車
    B: バック駐車
    C: 縦列駐車
    D: 後退による2点ターン
  answer: C
  explanation: 運転免許試験において縦列駐車は要求されなくなりましたが、同じスキルが後退による2点ターンで評価されます。
- id: 176
  category: driver_testing
  question: 運転免許試験中、前向き駐車およびバック駐車の操作はどのくらいの広さのスペースで行われますか？
  choices:
    A: 8フィート × 15フィート
    B: 10フィート × 20フィート
    C: 12フィート × 24フィート
    D: 16フィート × 20フィート
  answer: B
  explanation: 試験中の駐車は10フィート × 20フィートのスペースで行われ、3点ターンは16フィート × 20フィートのスペースで行われます。
- id: 177
  category: sharing_the_road
  question: 道路で自転車に乗る際、自転車の運転者は以下のことをしなければなりません：
  choices:
    A: 対向車に向かって走行する。
    B: 可能な限り歩道を走行する。
    C: 常に交通の流れと同じ右側を走行する。
    D: 遅い車を避けるために車線間を縫うように走行する。
  answer: C
  explanation: 自転車の運転者は交通の流れに沿って走行しなければなりません。つまり、常に右側を走行する必要があります。
- id: 178
  category: penalties_and_points
  question: 自動車保険に加入せずに運転した場合、車両1台につき年間で科される最大罰金はいくらですか？
  choices:
    A: 500ドル
    B: 1,000ドル
    C: 1,500ドル
    D: 2,500ドル
  answer: D
  explanation: すべての車両に保険をかけていない場合、車両1台につき年間最大2,500ドルの罰金が科されます。
- id: 179
  category: sharing_the_road
  question: 法律により、自転車に乗る際にヘルメットの着用が義務付けられているのは何歳未満の人ですか？
  choices:
    A: 12歳
    B: 14歳
    C: 16歳
    D: 18歳
  answer: C
  explanation: 操縦していない同乗者を含め、自転車に乗る16歳未満のすべての人にヘルメットの着用が義務付けられています。
- id: 180
  category: vehicle_information
  question: 法律により、すべての自転車は、乾燥した平坦で清潔な舗装路において、どの速度で走行しているときに15フィート以内で停止できるブレーキを備えていなければなりませんか？
  choices:
    A: 時速10マイル
    B: 時速15マイル
    C: 時速20マイル
    D: 時速25マイル
  answer: A
  explanation: 自転車は、乾燥した平坦で清潔な舗装路を時速10マイルで走行しているときに、15フィート以内で停止できるブレーキを備えていなければなりません。
- id: 181
  category: sharing_the_road
  question: メリーランド州法では、夜間に自転車に乗る際、少なくともどのくらい離れた場所から見える赤い後部反射板（リフレクター）を装着することが義務付けられていますか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 600フィート
  answer: D
  explanation: メリーランド州法では、自転車の前面に白いヘッドライト、後部に少なくとも600フィート離れた場所から見える赤い反射板（リフレクター）を装着することが義務付けられています。
- id: 182
  category: vehicle_information
  question: クラス1の電動自転車は、運転者がペダルを漕いでいるときのみアシストを提供するモーターを備えていますが、自転車がどの速度に達するとアシストが停止しますか？
  choices:
    A: 時速15マイル
    B: 時速20マイル
    C: 時速25マイル
    D: 時速28マイル
  answer: B
  explanation: クラス1の電動自転車は、運転者がペダルを漕いでいるときのみアシストを提供するモーターを備えており、自転車が時速20マイルに達するとアシストが停止します。
- id: 183
  category: vehicle_information
  question: 電動低速車両（Electric Low-Speed Vehicle）の特徴は次のうちどれですか？
  choices:
    A: 最大2人まで輸送できるように設計されている。
    B: 重量が150ポンド以上ある。
    C: 運転者が立つためのプラットフォーム（足場）がある。
    D: 最高時速35マイルで走行できる。
  answer: C
  explanation: 電動低速車両（電動キックボードなど）には、ハンドルバーと運転者が立つためのプラットフォームがあります。運転者のみを輸送するように設計されており、重量は100ポンド未満で、最高時速20マイルで走行します。
- id: 184
  category: safe_driving_rules
  question: 妊娠中の女性は、シートベルトのラップベルト（腰ベルト）をどのように着用するべきですか？
  choices:
    A: お腹の膨らみの上。
    B: 腹部の下で、腰の骨の可能な限り低い位置から太ももの上部にかけて。
    C: お腹の中央に緩くかける。
    D: 妊娠中の女性はラップベルトの着用を免除されている。
  answer: B
  explanation: 妊娠中の女性は、シートベルトのラップベルト（腰ベルト）を腹部の下で、腰の骨の可能な限り低い位置から太ももの上部にかけて着用する必要があります。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（止まれ）」の標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に交通や歩行者を確認してください。
  id: 185
- image: yield.png
  category: signs_and_signals
  question: この標識はあなたに何を求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通に合流する
    C: 減速し、他の車両や歩行者に優先権を譲る
    D: 止まらずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」の標識は、減速して他の車両や歩行者に優先権を譲らなければならないことを意味します。他の人が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 186
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路への進入禁止
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「DO NOT ENTER（進入禁止）」の標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路で見られ、進入すると対向車と正面衝突する危険がある場所に設置されています。
  id: 187
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見た場合、どうするべきですか？
  choices:
    A: Uターンする
    B: 注意して運転を続ける
    C: 停止して後退するか方向転換する — 逆走しています
    D: 加速してそのエリアから素早く抜け出す
  answer: C
  explanation: 赤と白の「WRONG WAY（逆走）」の標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に方向転換するか後退してください。
  id: 188
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方向（左方向）に流れている
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」の標識は、この道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 189
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 他の車両の追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、この場所でのUターンが禁止されていることを意味します。
  id: 190
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行動は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、この交差点での左折が禁止されていることを意味します。
  id: 191
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、この場所での右折が禁止されていることを意味します。
  id: 192
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、車線減少（道路が狭くなる）
    B: この区間では他の車両を追い越してはいけない
    C: この先、対面通行
    D: 右側通行
  answer: B
  explanation: 白黒のペナント型（三角旗型）の「NO PASSING ZONE（追い越し禁止区間）」標識は、このエリアで他の車両を追い越すことが禁止されていることを意味します。これは追い越し禁止区間の始まりを示しています。
  id: 193
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転手に何を指示していますか？
  choices:
    A: 右へ合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線減少
  answer: C
  explanation: 矢印が描かれた白い「KEEP RIGHT（右側通行）」の規制標識は、安全地帯、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 194
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色から判断して、これはどのような種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事用標識
  answer: C
  explanation: 白地に黒文字の長方形の標識は規制標識です。制限速度の標識は、理想的な条件下でのそのエリアの法定最高速度を示しています。
  id: 195
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先、動物園またはアニマルパークあり
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先、狩猟エリア
    D: 近くに野生動物保護区あり
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。特に夜明けや夕暮れ時は、速度を落として動物に注意してください。
