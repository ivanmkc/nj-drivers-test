questions:
- id: 1
  category: driver_responsibility
  question: ¿Cuál es el objetivo de la Administración de Vehículos Motorizados de
    Maryland con respecto a las muertes en las carreteras de Maryland?
  choices:
    A: Reducir las muertes en un 50%
    B: Alcanzar cero muertes
    C: Limitar las muertes a menos de 100 por año
    D: Disminuir las muertes solo en zonas de trabajo
  answer: B
  explanation: 'El Mensaje del Administrador establece: ''Nuestro objetivo es alcanzar
    cero muertes (ningún fallecimiento) en las carreteras de Maryland, porque incluso
    una vida perdida es demasiado''.'
- id: 2
  category: safe_driving_rules
  question: Según el Mensaje del Administrador, ¿cuál de las siguientes es una responsabilidad
    cada vez que se pone al volante?
  choices:
    A: Conducir sobrio
    B: Conducir al menos 10 mph por debajo del límite de velocidad
    C: Usar el cinturón de seguridad solo en las autopistas
    D: Ceder el paso a las motocicletas solo de noche
  answer: A
  explanation: El Mensaje del Administrador enumera explícitamente 'Conducir sobrio'
    como una de las responsabilidades que tiene todo conductor cada vez que se pone
    al volante.
- id: 3
  category: driver_responsibility
  question: 'El Mensaje del Administrador recuerda a los nuevos conductores que conducir
    se considera un:'
  choices:
    A: Derecho constitucional
    B: Privilegio
    C: Requisito para la ciudadanía
    D: Mandato federal
  answer: B
  explanation: 'El Mensaje del Administrador establece: ''Es importante recordar que
    conducir es un privilegio, y usted juega un papel importante para asegurarse de
    que todos se mantengan seguros en nuestras carreteras''.'
- id: 4
  category: sharing_the_road
  question: Para ayudar a mantener a todos seguros en la carretera, ¿cuántas veces
    aconseja específicamente el Mensaje del Administrador que los conductores miren
    para detectar motocicletas?
  choices:
    A: Una vez
    B: Dos veces
    C: Tres veces
    D: Solo al cambiar de carril
  answer: B
  explanation: El Mensaje del Administrador incluye 'Mirar dos veces para detectar
    motocicletas' en su lista de responsabilidades para tomar decisiones seguras al
    volante.
- id: 5
  category: driver_testing
  question: ¿Dónde puede encontrar el Tutorial del Examen de Conducir en Línea para
    evaluar su comprensión de las reglas de tránsito?
  choices:
    A: En la aplicación móvil de la MVA
    B: En cualquier biblioteca pública local
    C: En el sitio web de la MVA en mva.maryland.gov/drivers
    D: Llamando al número TTY
  answer: C
  explanation: El Mensaje del Administrador indica que el Tutorial del Examen de Conducir
    en Línea se encuentra en el sitio web de la MVA, mva.maryland.gov/drivers.
- id: 6
  category: license_system
  question: Según el Índice, ¿qué sección cubre el Sistema de Licencias Graduadas/Conductor
    Novato (Rookie Driver/Graduated Licensing System)?
  choices:
    A: Sección 1
    B: Sección 2
    C: Sección 3
    D: Sección 4
  answer: B
  explanation: Según el Índice, la Sección 2 se titula 'Requisitos y Proceso de Licencia'
    e incluye el 'Sistema de Licencias Graduadas/Conductor Novato'.
- id: 7
  category: defensive_driving
  question: ¿Cuál de los siguientes temas está categorizado bajo 'Comportamientos
    Peligrosos al Conducir' en la Sección 6 del manual?
  choices:
    A: Deslizamiento sobre el agua (Hydroplaning)
    B: Conducción distraída
    C: Cruces de ferrocarril en carreteras
    D: Rebasar
  answer: B
  explanation: 'El Índice enumera ''Conducción distraída'' bajo la Sección 6: Comportamientos
    Peligrosos al Conducir.'
- id: 8
  category: penalties_and_points
  question: ¿En qué sección del manual se cubre la regla de 'Prueba de Drogas y Alcohol
    - Consentimiento Implícito'?
  choices:
    A: 'Sección 6: Comportamientos Peligrosos al Conducir'
    B: 'Sección 8: Choques y Paradas de Tráfico'
    C: 'Sección 9: Otras Restricciones, Infracciones y Sanciones'
    D: 'Sección 10: Otra Información Importante'
  answer: C
  explanation: 'El Índice enumera ''Prueba de Drogas y Alcohol - Consentimiento Implícito''
    bajo la Sección 9: Otras Restricciones, Infracciones y Sanciones.'
- id: 9
  category: sharing_the_road
  question: La Sección 7, 'Compartir la Carretera', incluye información sobre cómo
    interactuar con ¿cuál de los siguientes?
  choices:
    A: Vehículos de movimiento lento
    B: Procesiones fúnebres
    C: Autobuses escolares
    D: Rotondas (Traffic Circles)
  answer: C
  explanation: 'Según el Índice, la Sección 7: Compartir la Carretera incluye una
    subsección específicamente sobre ''Autobuses escolares''.'
- id: 10
  category: safe_driving_rules
  question: Si necesita aprender sobre cómo conducir en la niebla o en condiciones
    climáticas adversas, ¿qué sección del manual debe consultar?
  choices:
    A: 'Sección 3: Conducción Básica'
    B: 'Sección 4: Señales, Semáforos y Marcas en el Pavimento'
    C: 'Sección 5: Situaciones y Condiciones de Conducción'
    D: 'Sección 8: Choques y Paradas de Tráfico'
  answer: C
  explanation: 'El Índice muestra que ''Conducir en la Niebla'' y ''Conducir en Condiciones
    Climáticas Adversas'' se cubren en la Sección 5: Situaciones y Condiciones de
    Conducción.'
- id: 11
  category: license_system
  question: ¿Cuál es el número de teléfono TTY proporcionado para que las personas
    con discapacidad auditiva se comuniquen con la MVA de Maryland?
  choices:
    A: 410-768-7000
    B: 1-800-492-4575
    C: 1-800-555-1234
    D: 410-768-7001
  answer: B
  explanation: La información de contacto en la primera página del manual indica que
    el número TTY para personas con discapacidad auditiva es 1-800-492-4575.
- id: 12
  category: driver_responsibility
  question: Según el Mensaje del Administrador, ¿cómo mejorará un conductor nuevo
    en la conducción?
  choices:
    A: Conduciendo solo durante las horas de luz diurna
    B: Con más experiencia en diferentes carreteras y bajo diferentes condiciones
    C: Evitando por completo el tráfico pesado
    D: Conduciendo solo con un conductor supervisor
  answer: B
  explanation: 'El Mensaje del Administrador establece: ''mejorará en la conducción
    con más experiencia en diferentes carreteras, bajo diferentes condiciones y en
    diferentes entornos''.'
- id: 13
  category: safe_driving_rules
  question: ¿En qué sección del Manual del Conductor de Maryland se explica la 'Ley
    de Hacerse a un Lado' (Move Over Law)?
  choices:
    A: 'Sección 3: Conducción básica'
    B: 'Sección 6: Comportamientos de conducción peligrosos'
    C: 'Sección 7: Compartir la carretera'
    D: 'Sección 8: Choques y paradas de tráfico'
  answer: D
  explanation: 'Según el Índice, la ''Ley de Hacerse a un Lado'' (Move Over Law) se
    encuentra en la Sección 8: Choques y paradas de tráfico.'
- id: 14
  category: driver_testing
  question: '¿Cuál de los siguientes se enumera como un requisito en la Sección 1:
    Requisitos para los exámenes de manejo?'
  choices:
    A: Examen de la vista
    B: Solicitud de un cosignatario
    C: Licencia provisional
    D: Donante de órganos
  answer: A
  explanation: 'El Índice enumera el ''Examen de la vista'' como la subsección A bajo
    la Sección 1: Requisitos para los exámenes de manejo.'
- id: 15
  category: license_system
  question: Según la información de derechos de autor en el manual, ¿cuál de las siguientes
    acciones está prohibida?
  choices:
    A: Usar el contenido de forma gratuita para estudiar la Ley de Vehículos de Maryland
    B: Leer el manual en línea
    C: Cualquier reimpresión, uso, distribución o venta no autorizada del material
    D: Compartir el manual con un instructor de manejo
  answer: C
  explanation: 'La sección de derechos de autor establece explícitamente: ''Cualquier
    reimpresión, uso, distribución o venta no autorizada de este material está prohibida''.'
- id: 16
  category: driver_testing
  question: ¿Cuál es la agudeza visual mínima requerida en cada ojo para calificar
    para una licencia de conducir de Maryland?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Para calificar para una licencia de conducir, el solicitante debe tener
    una agudeza visual de al menos 20/40 en cada ojo.
- id: 17
  category: driver_testing
  question: ¿Cuántas preguntas tiene el examen de conocimientos de manejo de Maryland
    y cuánto tiempo tiene para completarlo?
  choices:
    A: 20 preguntas, 15 minutos
    B: 25 preguntas, 20 minutos
    C: 30 preguntas, 25 minutos
    D: 50 preguntas, 45 minutos
  answer: B
  explanation: Hay 25 preguntas en el examen de conocimientos y tendrá 20 minutos
    para realizar la prueba.
- id: 18
  category: driver_testing
  question: 'Al llevar un vehículo a la MVA para su examen de habilidades de manejo,
    el vehículo debe tener al menos:'
  choices:
    A: Un cuarto de tanque de gasolina
    B: Medio tanque de gasolina
    C: Tres cuartos de tanque de gasolina
    D: Un tanque lleno de gasolina
  answer: B
  explanation: El vehículo utilizado para el examen de habilidades de manejo debe
    ser seguro para conducir, no tener grietas en el parabrisas que afecten la visión
    y tener al menos medio tanque de gasolina.
- id: 19
  category: driver_testing
  question: ¿A quién se le permite estar en el vehículo con usted durante el examen
    de habilidades de manejo?
  choices:
    A: Solo usted y el examinador de la MVA, además de un intérprete aprobado si es
      necesario
    B: Usted, el examinador de la MVA y su conductor supervisor
    C: Usted, el examinador de la MVA y un familiar
    D: Usted, el examinador de la MVA y su instructor de educación vial
  answer: A
  explanation: Solo usted y la persona que le realiza el examen pueden estar en el
    vehículo durante la prueba. Un intérprete aprobado por la MVA también puede estar
    en el automóvil si lo necesita.
- id: 20
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima por tirar basura en las carreteras estatales
    de Maryland?
  choices:
    A: Una multa de $500
    B: Una multa de $1000 y 15 días de prisión
    C: Una multa de $1500 o 30 días de prisión
    D: Una multa de $2000 o 60 días de prisión
  answer: C
  explanation: Las multas por tirar basura pueden costar hasta $1500 o 30 días de
    prisión.
- id: 21
  category: license_system
  question: Al solicitar una licencia de conducir no comercial, ¿cuántos documentos
    debe presentar para demostrar que vive en Maryland?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Al presentar la solicitud, debe llevar dos documentos que demuestren
    que vive en Maryland.
- id: 22
  category: license_system
  question: ¿Cuáles de los siguientes tipos de documentos aceptará la MVA al solicitar
    una licencia de conducir?
  choices:
    A: Documentos originales o copias certificadas
    B: Fotocopias notariadas
    C: Fotocopias a color de alta calidad
    D: Documentos con información borrada y corregida
  answer: A
  explanation: Debe presentar documentos originales o copias certificadas por la agencia
    que se los proporcionó. La MVA no aceptará fotocopias, copias notariadas ni documentos
    con información alterada o borrada.
- id: 23
  category: license_system
  question: ¿Qué clase de licencia es una licencia de conducir no comercial estándar
    utilizada para automóviles regulares, camionetas y furgonetas?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase M
  answer: C
  explanation: Una licencia de conducir no comercial le permite conducir vehículos
    regulares como automóviles, camionetas y furgonetas. También se le llama licencia
    de conducir Clase C.
- id: 24
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Aprendizaje de Instrucción
    Tipo 1 (Type 1 Learner's Instructional Permit)?
  choices:
    A: 6 meses
    B: 1 año
    C: 18 meses
    D: Hasta 2 años
  answer: D
  explanation: Si nunca ha tenido una licencia de conducir no comercial, debe obtener
    un Permiso de Aprendizaje de Instrucción Tipo 1. El permiso dura hasta 2 años.
- id: 25
  category: license_system
  question: 'Se requiere un Permiso de Aprendizaje de Instrucción Tipo 2 (Type 2 Learner''s
    Instructional Permit) si usted:'
  choices:
    A: Nunca ha tenido una licencia de conducir antes
    B: Ya tiene una licencia de conducir y desea una clase de licencia diferente
    C: Tiene menos de 16 años
    D: Ha tenido su licencia suspendida por una infracción de tránsito (moving violation)
  answer: B
  explanation: Si ya tiene una licencia de conducir y desea una clase diferente de
    licencia de conducir, debe solicitar un Permiso de Aprendizaje de Instrucción
    Tipo 2.
- id: 26
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar un Permiso de Aprendizaje
    de Instrucción si tiene menos de 25 años?
  choices:
    A: 15 años y 6 meses
    B: 15 años y 9 meses
    C: 16 años
    D: 16 años y 3 meses
  answer: B
  explanation: Los solicitantes menores de 25 años deben tener al menos 15 años y
    9 meses de edad.
- id: 27
  category: driver_testing
  question: ¿Cuántas horas totales de práctica de manejo debe completar un solicitante
    menor de 25 años con un conductor supervisor?
  choices:
    A: 14 horas
    B: 30 horas
    C: 45 horas
    D: 60 horas
  answer: D
  explanation: Los solicitantes menores de 25 años deben practicar la conducción durante
    al menos 60 horas con un conductor supervisor.
- id: 28
  category: driver_testing
  question: Si un solicitante tiene 25 años o más, ¿cuántas horas de práctica de manejo
    debe completar antes de tomar el examen de habilidades de manejo?
  choices:
    A: 14 horas
    B: 30 horas
    C: 45 horas
    D: 60 horas
  answer: A
  explanation: Los solicitantes de 25 años o más deben completar al menos 14 horas
    de práctica con un conductor supervisor.
- id: 29
  category: license_system
  question: ¿Por cuánto tiempo debe un solicitante de 25 años o más mantener su Permiso
    de Aprendizaje de Instrucción antes de ser elegible para una Licencia Provisional?
  choices:
    A: Al menos 14 días
    B: Al menos 30 días
    C: Al menos 45 días
    D: Al menos 9 meses
  answer: C
  explanation: Los solicitantes de 25 años o más deben tener su permiso durante al
    menos 45 días antes de ser elegibles para una Licencia Provisional.
- id: 30
  category: penalties_and_points
  question: Si es condenado por una infracción de tránsito (moving violation) mientras
    tiene un Permiso de Aprendizaje de Instrucción, ¿por cuánto tiempo debe mantener
    el permiso desde la fecha de la condena antes de ser elegible para una Licencia
    Provisional?
  choices:
    A: 45 días
    B: 3 meses
    C: 6 meses
    D: 9 meses
  answer: D
  explanation: A cualquier edad, si ha sido condenado o se le ha otorgado Libertad
    Condicional Antes del Juicio (PBJ, por sus siglas en inglés) por una infracción
    de tránsito, debe mantener el Permiso de Aprendizaje de Instrucción al menos 9
    meses después de la fecha más reciente en que fue condenado.
- id: 31
  category: license_system
  question: ¿Por cuánto tiempo debe un conductor menor de 18 años mantener su permiso
    de aprendizaje (Learner's Instructional Permit) sin cometer infracciones antes
    de ser elegible para una licencia provisional?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 18 meses
  answer: C
  explanation: Según el manual, si usted es menor de 18 años, debe mantener el permiso
    durante al menos 9 meses sin cometer infracciones antes de ser elegible para una
    licencia provisional.
- id: 32
  category: license_system
  question: Si usted tiene 25 años o más, ¿cuántas horas de práctica de manejo deben
    registrarse en su Registro de práctica y habilidades (Practice and Skills Log)
    para obtener una licencia provisional?
  choices:
    A: 14 horas
    B: 30 horas
    C: 45 horas
    D: 60 horas
  answer: A
  explanation: El manual establece que debe presentar un Registro de práctica y habilidades
    que demuestre que completó al menos 60 horas de práctica de manejo con un conductor
    supervisor, o 14 horas si tiene 25 años o más.
- id: 33
  category: license_system
  question: ¿Qué sucede cuando cumple con todos los requisitos para pasar de una licencia
    provisional a una licencia de conducir regular?
  choices:
    A: Debe volver a tomar el examen de habilidades de manejo.
    B: Debe visitar una sucursal de la MVA para solicitar la actualización.
    C: La MVA cambiará automáticamente su licencia y le enviará una tarjeta por correo.
    D: Debe completar otras 60 horas de manejo supervisado.
  answer: C
  explanation: Cuando haya cumplido con todos los requisitos, la MVA cambiará automáticamente
    su licencia provisional a una licencia de conducir y se le enviará por correo
    una tarjeta que muestre el cambio.
- id: 34
  category: driver_responsibility
  question: ¿Quién es elegible para firmar conjuntamente (como aval) la solicitud
    de licencia de un menor si el menor está casado?
  choices:
    A: Cualquier conductor con licencia mayor de 21 años.
    B: El esposo o esposa del menor, si tienen 18 años o más.
    C: Solo un padre o tutor legal.
    D: Un instructor de manejo aprobado por la MVA.
  answer: B
  explanation: 'El manual establece: ''Si está casado y su esposo o esposa tiene 18
    años o más, pueden firmar conjuntamente. Debe proporcionar prueba de que está
    casado''.'
- id: 35
  category: driver_responsibility
  question: ¿Cómo puede un cofirmante (aval) cancelar la licencia de conducir de un
    menor?
  choices:
    A: Solicitando verbalmente la cancelación en cualquier sucursal de la MVA.
    B: Presentando una solicitud por escrito a la División de Adjudicación Administrativa
      de la MVA.
    C: Confiscando la tarjeta física de la licencia del menor.
    D: Eliminando al menor de su póliza de seguro de automóvil.
  answer: B
  explanation: El cofirmante puede cancelar la licencia de un menor presentando una
    solicitud por escrito a la División de Adjudicación Administrativa de la MVA.
- id: 36
  category: driver_testing
  question: Si tiene una licencia de otro país, ¿cuál de los siguientes requisitos
    es necesario para obtener una licencia de Maryland?
  choices:
    A: Un programa de educación vial de seguridad en las carreteras de 3 horas.
    B: Un registro de manejo supervisado de 14 horas.
    C: Una carta de recomendación de la embajada.
    D: Un mínimo de 18 meses de experiencia de manejo en Maryland.
  answer: A
  explanation: Para obtener una licencia de Maryland con una licencia de otro país,
    debe aprobar un examen de la vista, un examen de conocimientos, un examen de habilidades
    de manejo y un programa de educación vial de seguridad en las carreteras de tres
    horas aprobado por la MVA.
- id: 37
  category: driver_testing
  question: Si la MVA ofrece el examen de conocimientos en su idioma hablado, ¿cuántas
    veces debe tomarlo antes de que se le permita usar un intérprete?
  choices:
    A: 2 veces
    B: 3 veces
    C: 5 veces
    D: No puede usar un intérprete si el examen se ofrece en su idioma.
  answer: C
  explanation: 'El manual establece: ''Si ofrecemos el examen de conocimientos en
    el idioma que usted habla, debe tomarlo al menos 5 veces antes de usar un intérprete''.'
- id: 38
  category: driver_testing
  question: ¿Cuál de las siguientes es una regla sobre los intérpretes que brindan
    servicios para los exámenes de conocimientos o habilidades en la MVA?
  choices:
    A: La MVA cobra una tarifa estándar por los servicios del intérprete.
    B: El intérprete debe ser un familiar del solicitante.
    C: El intérprete también puede certificar la residencia del cliente.
    D: El intérprete no puede brindar otros servicios al cliente que está siendo evaluado.
  answer: D
  explanation: Los intérpretes que brindan servicios para los exámenes de conocimientos/habilidades
    no pueden brindar otros servicios al cliente que está siendo evaluado, como certificar
    la residencia o realizar negocios de escuelas de manejo.
- id: 39
  category: alcohol_drugs_health
  question: ¿Qué documentación le pedirá la MVA que proporcione para obtener una Tarjeta
    de divulgación de discapacidad del desarrollo (Developmental Disability Disclosure
    Card)?
  choices:
    A: Una carta firmada por un médico con licencia.
    B: Documentos judiciales que prueben la tutela legal.
    C: Registros médicos que detallen su discapacidad específica.
    D: La MVA NO le pedirá que proporcione documentación sobre su discapacidad.
  answer: D
  explanation: 'Llevar una Tarjeta de divulgación de discapacidad del desarrollo es
    voluntario, y el manual establece explícitamente: ''La MVA NO le pedirá que proporcione
    información o documentación sobre su discapacidad para obtener esta tarjeta''.'
- id: 40
  category: safe_driving_rules
  question: ¿Qué documentos debe tener con usted antes de conducir un vehículo?
  choices:
    A: Un permiso o licencia válida y la tarjeta de registro del vehículo.
    B: Un permiso o licencia válida y su certificado de nacimiento.
    C: El título del vehículo y el comprobante de seguro.
    D: Una Tarjeta de divulgación de discapacidad del desarrollo y una licencia válida.
  answer: A
  explanation: Antes de conducir, debe tener con usted un permiso de aprendizaje o
    una licencia de conducir válida, y la tarjeta de registro del vehículo.
- id: 41
  category: defensive_driving
  question: ¿Qué describe el manual como "manejo defensivo"?
  choices:
    A: Asumir que los demás conductores siempre seguirán las reglas de tránsito.
    B: Mirar hacia adelante y estar preparado para cambiar de velocidad o de carril
      para identificar riesgos.
    C: Ceder el derecho de paso solo cuando lo indique una señal de tránsito.
    D: Conducir a una velocidad constante sin importar las condiciones del camino.
  answer: B
  explanation: 'El manual define el manejo defensivo como: "Al mirar hacia adelante
    y estar preparado para cambiar de velocidad o de carril, puede conducir de manera
    más segura y tener tiempo para identificar riesgos. A esto se le llama manejo
    defensivo".'
- id: 42
  category: safe_driving_rules
  question: ¿A quién debe ceder el derecho de paso si usted y otro conductor llegan
    a una intersección al mismo tiempo?
  choices:
    A: Al conductor a su izquierda.
    B: Al conductor a su derecha.
    C: Al conductor que va en línea recta.
    D: Al conductor que gira a la izquierda.
  answer: B
  explanation: Debe ceder el derecho de paso al conductor a su derecha si ambos llegan
    a una intersección al mismo tiempo.
- id: 43
  category: defensive_driving
  question: ¿Cuál de los siguientes es un paso recomendado para manejar el riesgo
    al operar un vehículo motorizado?
  choices:
    A: Asumir que los demás conductores harán lo que se supone que deben hacer.
    B: Disminuir el tiempo que tiene para responder a su entorno.
    C: Mantener una distancia segura entre su vehículo y otras personas que usan la
      vía.
    D: Depender únicamente de sus espejos para saber qué sucede alrededor de su vehículo.
  answer: C
  explanation: Para manejar el riesgo, el manual recomienda que "Mantenga una distancia
    segura entre su vehículo y otras personas que usan la vía" y dice explícitamente
    "No asuma que los demás conductores harán lo que se supone que deben hacer".
- id: 44
  category: license_system
  question: ¿Cuál es una restricción impuesta a una Licencia de Conducir Provisional?
  choices:
    A: Debe conducir con un conductor supervisor en todo momento.
    B: No se le permite conducir en autopistas interestatales.
    C: Tiene restringido llevar pasajeros y conducir de noche.
    D: Debe registrar 60 horas adicionales de práctica de manejo.
  answer: C
  explanation: Una Licencia de Conducir Provisional le permite conducir sin supervisión
    pero con restricciones, como no llevar pasajeros y no conducir de noche.
- id: 45
  category: safe_driving_rules
  question: 'Al hacer un giro a la izquierda, debe ceder el derecho de paso a:'
  choices:
    A: Los conductores en el carril de tráfico en sentido contrario.
    B: Los conductores detrás de usted.
    C: Los conductores que giran a la derecha desde la vía que se cruza.
    D: Nadie, usted tiene automáticamente el derecho de paso.
  answer: A
  explanation: Debe ceder el derecho de paso a los conductores en el carril de tráfico
    en sentido contrario cuando esté haciendo un giro a la izquierda.
- id: 46
  category: safe_driving_rules
  question: ¿Qué representa el límite de velocidad publicado?
  choices:
    A: La velocidad sugerida para todas las condiciones climáticas.
    B: La velocidad mínima legal a la que puede viajar.
    C: La velocidad máxima legal a la que puede viajar bajo condiciones ideales.
    D: La velocidad que debe mantener sin importar el tráfico.
  answer: C
  explanation: El límite de velocidad publicado es la velocidad máxima legal a la
    que puede viajar en una vía bajo condiciones ideales (perfectas).
- id: 47
  category: defensive_driving
  question: ¿Por qué es peligroso conducir a una velocidad significativamente menor
    que el resto del tráfico?
  choices:
    A: Causa un desgaste excesivo en sus frenos.
    B: Anima a otros vehículos a rebasarlo constantemente, aumentando las posibilidades
      de un choque.
    C: Es ilegal en todas las carreteras de Maryland.
    D: Disminuye su capacidad para manejar curvas.
  answer: B
  explanation: Conducir a una velocidad menor que el resto del tráfico anima a otros
    vehículos a rebasarlo constantemente, lo que aumenta las posibilidades de un choque.
- id: 48
  category: safe_driving_rules
  question: Bajo condiciones ideales de manejo, ¿cuál es la distancia mínima de seguimiento
    recomendada por la MVA?
  choices:
    A: 1 a 2 segundos
    B: 3 a 4 segundos
    C: 5 a 6 segundos
    D: 10 segundos
  answer: B
  explanation: La MVA recomienda una distancia mínima de seguimiento de 3 a 4 segundos
    bajo condiciones ideales de manejo.
- id: 49
  category: defensive_driving
  question: 'Al seguir a vehículos que se detienen con frecuencia, como autobuses
    o camionetas de reparto, debe aumentar su distancia de seguimiento a:'
  choices:
    A: Dos o tres segundos
    B: Tres o cuatro segundos
    C: Cuatro o cinco segundos
    D: Siete u ocho segundos
  answer: C
  explanation: Al seguir a vehículos que se detienen con frecuencia, debe aumentar
    la distancia entre su vehículo y el que va adelante a cuatro o cinco segundos,
    y posiblemente más si es necesario.
- id: 50
  category: safe_driving_rules
  question: ¿Cuándo es generalmente aceptable conducir a la izquierda del centro de
    la vía?
  choices:
    A: Cuando está rebasando a otro vehículo que va en la misma dirección.
    B: Cuando se acerca a una curva ciega.
    C: Cuando conduce en una zona residencial.
    D: Cuando se prepara para estacionar en el arcén derecho.
  answer: A
  explanation: Debe mantener su vehículo a la derecha del centro de la vía a menos
    que esté rebasando a otro vehículo que va en la misma dirección, una señal/semáforo
    lo permita, o haya un obstáculo.
- id: 51
  category: safe_driving_rules
  question: Al hacer un giro en U legal, ¿a qué carril debe incorporarse?
  choices:
    A: Al carril interior o izquierdo que viaja en dirección opuesta
    B: Al carril exterior o derecho que viaja en dirección opuesta
    C: Al carril central de giro
    D: A cualquier carril disponible
  answer: B
  explanation: Al hacer un giro en U, después de ceder el paso al tráfico y asegurarse
    de que la vía esté despejada, incorpórese al carril exterior o derecho que viaja
    en dirección opuesta.
- id: 52
  category: safe_driving_rules
  question: 'Antes de regresar a su carril original después de rebasar a otro vehículo,
    usted debe:'
  choices:
    A: Tocar la bocina para alertar al otro conductor
    B: Ver ambos faros delanteros del vehículo rebasado en su espejo retrovisor
    C: Parpadear las luces altas
    D: Asegurarse de estar al menos a 10 pies por delante del vehículo rebasado
  answer: B
  explanation: Al rebasar, debe ver ambos faros delanteros del vehículo rebasado en
    su espejo retrovisor antes de regresar al carril de donde venía.
- id: 53
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es ilegal rebasar a otro vehículo?
  choices:
    A: En una vía de un solo sentido sin obstrucciones con dos o más carriles
    B: Cuando el otro vehículo está a punto de girar a la izquierda
    C: Al cruzar o a menos de 100 pies de una intersección
    D: Cuando se encuentra en una vía sin obstrucciones con dos o más carriles que
      se mueven en la misma dirección
  answer: C
  explanation: No puede rebasar al cruzar o a menos de 100 pies de una intersección
    o un cruce de ferrocarril a nivel.
- id: 54
  category: sharing_the_road
  question: ¿Qué debe hacer cuando otro vehículo lo está rebasando?
  choices:
    A: Acelerar para apartarse de su camino
    B: Moverse hacia el arcén derecho
    C: Ceder el paso al otro vehículo y no aumentar su velocidad
    D: Tocar la bocina para reconocerlos
  answer: C
  explanation: Al ser rebasado por otro vehículo, debe ceder el paso al otro vehículo
    y no aumentar su velocidad.
- id: 55
  category: vehicle_information
  question: 'Al estacionar un vehículo con transmisión manual, debe poner el freno
    de estacionamiento y:'
  choices:
    A: Poner el vehículo en punto muerto (neutral)
    B: Poner el vehículo en marcha (engranado)
    C: Poner el vehículo en 'park' (estacionamiento)
    D: Girar el volante bruscamente hacia la izquierda
  answer: B
  explanation: Al estacionar, debe poner el freno de estacionamiento y dejar el vehículo
    en marcha si tiene transmisión manual (o en 'park' si tiene transmisión automática).
- id: 56
  category: signs_and_signals
  question: ¿Cuándo se le permite desobedecer un dispositivo de control de tráfico?
  choices:
    A: Cuando llega tarde a una emergencia
    B: Cuando un oficial de policía le indica que haga algo diferente
    C: Cuando no hay otro tráfico alrededor
    D: Cuando conduce un vehículo comercial
  answer: B
  explanation: La única vez que no tiene que obedecer todos los dispositivos de control
    de tráfico es cuando un oficial de policía, otro personal de emergencia o un guardia
    de cruce escolar le indica que haga algo diferente.
- id: 57
  category: signs_and_signals
  question: 'A menos que una señal lo prohíba, puede girar a la derecha con un semáforo
    en rojo fijo:'
  choices:
    A: Sin detenerse si la intersección está despejada
    B: Solo si está en el carril más a la derecha y toca la bocina
    C: Después de detenerse por completo y ceder el paso a los peatones y a otros
      vehículos
    D: Solo entre las 6 AM y las 6 PM
  answer: C
  explanation: A menos que una señal prohíba girar en rojo, después de detenerse por
    completo, puede girar a la derecha. Debe ceder el derecho de paso a los peatones
    y a todo el demás tráfico.
- id: 58
  category: signs_and_signals
  question: ¿Qué debe hacer si se acerca a una intersección donde el semáforo no funciona?
  choices:
    A: Avanzar por la intersección sin detenerse si tiene el derecho de paso
    B: Detenerse en una línea de pare claramente marcada o antes de entrar al cruce
      peatonal
    C: Tratar la intersección como una señal de ceda el paso
    D: Esperar a que llegue un oficial de policía
  answer: B
  explanation: Cuando un semáforo no funciona, debe detenerse en una línea de pare
    claramente marcada. Si no hay una línea de pare claramente marcada, debe detenerse
    antes de entrar a un cruce peatonal.
- id: 59
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico de color rosa fluorescente?
  choices:
    A: Zonas escolares y cruces peatonales
    B: Incidentes de tráfico de emergencia
    C: Áreas de trabajo de construcción y mantenimiento
    D: Áreas de recreación e interés cultural
  answer: B
  explanation: Según el manual, las señales de color rosa fluorescente se utilizan
    para indicar incidentes de tráfico de emergencia.
- id: 60
  category: signs_and_signals
  question: ¿Qué significa una señal de uso de carril con una 'X' amarilla fija?
  choices:
    A: Puede usar el carril para girar a la izquierda.
    B: Nunca debe conducir en ese carril.
    C: Debe salir del carril tan pronto como pueda hacerlo de manera segura.
    D: Puede conducir en el carril pero debe reducir su velocidad.
  answer: C
  explanation: Una señal de 'X' amarilla fija significa que debe salir del carril
    tan pronto como pueda hacerlo de manera segura.
- id: 61
  category: signs_and_signals
  question: ¿Qué forma de señal se utiliza exclusivamente para advertir sobre zonas
    escolares y marcar cruces escolares?
  choices:
    A: Diamante
    B: Pentágono
    C: Banderín
    D: Octágono
  answer: B
  explanation: La forma de pentágono (cinco lados) le advierte sobre zonas escolares
    y marca los cruces escolares.
- id: 62
  category: signs_and_signals
  question: ¿Cómo debe responder un conductor a un semáforo en rojo intermitente?
  choices:
    A: Reducir la velocidad y continuar con precaución sin detenerse.
    B: Detenerse por completo, ceder el paso al tráfico y a los peatones, y continuar
      cuando sea seguro.
    C: Detenerse solo si otros vehículos se acercan a la intersección.
    D: Ceder el paso al tráfico de la derecha sin detenerse por completo.
  answer: B
  explanation: Ante una luz roja intermitente, debe detenerse por completo en la línea
    de alto, ceder el paso a todo el tráfico y a los peatones, y continuar cuando
    la vía esté despejada.
- id: 63
  category: signs_and_signals
  question: ¿Qué tipo de información se encuentra típicamente en las señales de tráfico
    marrones?
  choices:
    A: Destinos, distancias y direcciones
    B: Servicios como comida, gasolina y áreas de descanso
    C: Áreas de recreación e interés cultural
    D: Áreas de trabajo de construcción y mantenimiento
  answer: C
  explanation: Las señales de tráfico marrones indican áreas de recreación e interés
    cultural.
- id: 64
  category: signs_and_signals
  question: ¿Qué indica una señal de 'X' amarilla intermitente sobre un carril reversible?
  choices:
    A: El carril está cerrado a todo el tráfico.
    B: Debe salir del carril inmediatamente.
    C: Puede usar el carril para girar a la izquierda, compartiéndolo con el tráfico
      en sentido contrario.
    D: Tiene el derecho de paso exclusivo para seguir recto.
  answer: C
  explanation: Una señal de 'X' amarilla intermitente o flechas de giro a la izquierda
    de doble sentido significan que puede usar el carril para girar a la izquierda,
    y probablemente compartirá el carril con vehículos que giran a la izquierda desde
    la dirección opuesta.
- id: 65
  category: safe_driving_rules
  question: ¿Qué debe hacer si se acerca a una intersección y el semáforo cambia a
    una luz amarilla fija?
  choices:
    A: Acelerar para ganarle a la luz roja.
    B: Detenerse inmediatamente, incluso si está en medio de la intersección.
    C: Continuar con cuidado si está demasiado cerca de la intersección para detenerse
      de manera segura.
    D: Dar marcha atrás a su vehículo para despejar el cruce peatonal.
  answer: C
  explanation: Una luz amarilla fija le da tiempo para detenerse de manera segura.
    Si está demasiado cerca de la intersección para detenerse de forma segura, continúe
    con cuidado a través de la intersección.
- id: 66
  category: signs_and_signals
  question: ¿Qué color se utiliza para las señales que advierten sobre cruces escolares,
    peatonales y de bicicletas?
  choices:
    A: Amarillo
    B: Amarillo-verde fluorescente
    C: Blanco
    D: Naranja
  answer: B
  explanation: El amarillo-verde fluorescente es el color utilizado para las señales
    escolares, peatonales y de bicicletas.
- id: 67
  category: signs_and_signals
  question: ¿Cuál es el propósito de las señales de marcadores de millas ubicadas
    en las autopistas interestatales?
  choices:
    A: Indican el límite de velocidad máximo actual.
    B: Proporcionan información de ubicación en caso de que necesite asistencia de
      emergencia.
    C: Muestran la distancia exacta a la próxima gasolinera o área de descanso.
    D: Marcan el comienzo de una nueva línea de condado o estado.
  answer: B
  explanation: Las señales de marcadores de millas proporcionan información de ubicación
    que puede usar si necesita que alguien lo encuentre, como una grúa o personal
    de emergencia.
- id: 68
  category: sharing_the_road
  question: Cuando una señal de cruce peatonal muestra una luz roja fija a los conductores,
    ¿qué debe hacer el conductor?
  choices:
    A: Detenerse y esperar hasta que la luz cambie.
    B: Reducir la velocidad y continuar si no hay peatones a la vista.
    C: Detenerse, luego continuar con precaución.
    D: Tocar la bocina para advertir a los peatones antes de cruzar.
  answer: A
  explanation: Según la tabla de señales de cruce peatonal, una luz roja fija para
    los conductores significa '¡Alto!' y deben esperar mientras los peatones cruzan.
- id: 69
  category: signs_and_signals
  question: ¿Qué forma se utiliza para identificar la ubicación de un cruce a nivel
    de carretera y ferrocarril?
  choices:
    A: Redonda
    B: Cruz de San Andrés (Crossbuck)
    C: Trapezoide
    D: Diamante
  answer: B
  explanation: La forma de Cruz de San Andrés (Crossbuck) identifica la ubicación
    de un cruce a nivel de carretera y ferrocarril.
- id: 70
  category: safe_driving_rules
  question: ¿Cuál es la acción correcta al acercarse a un semáforo en amarillo intermitente?
  choices:
    A: Detenerse por completo y esperar la luz verde.
    B: Tratarlo como una parada de cuatro vías (four-way stop).
    C: Reducir la velocidad y continuar con precaución.
    D: Acelerar para despejar la intersección rápidamente.
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y continuar con precaución.
- id: 71
  category: signs_and_signals
  question: ¿Qué indican típicamente las señales rectangulares con letras negras sobre
    un fondo blanco?
  choices:
    A: Advertencias generales de peligros más adelante
    B: Información reglamentaria y leyes de tránsito que debe obedecer
    C: Direcciones a hospitales y aeropuertos
    D: Incidentes de tráfico de emergencia
  answer: B
  explanation: Las señales rectangulares (de 4 lados) con letras negras sobre fondo
    blanco regulan el tráfico. Tratan sobre las leyes de tránsito y usted debe obedecerlas.
- id: 72
  category: signs_and_signals
  question: ¿Qué tipo de información proporcionan las señales de guía y de información
    de servicios?
  choices:
    A: El límite de velocidad en la vía más adelante
    B: Negocios y servicios que puede encontrar si toma ciertas salidas
    C: El número de ruta y el tipo de vía
    D: Áreas donde está estrictamente prohibido estacionar
  answer: B
  explanation: Según el manual, las señales de guía y de información de servicios
    identifican los negocios y servicios (como alojamiento, hospitales, gasolina y
    comida) que puede encontrar si toma ciertas salidas.
- id: 73
  category: signs_and_signals
  question: ¿Qué indica una sola línea amarilla discontinua en la carretera?
  choices:
    A: El tráfico viaja en la misma dirección y está prohibido cambiar de carril.
    B: El tráfico viaja en direcciones opuestas y se permite rebasar con precaución.
    C: Marca el borde derecho de la calzada.
    D: Indica un carril reversible donde el flujo de tráfico cambia de dirección.
  answer: B
  explanation: Una sola línea amarilla discontinua separa los carriles donde los vehículos
    viajan en direcciones opuestas, y se permite rebasar con precaución en ambas direcciones.
- id: 74
  category: signs_and_signals
  question: ¿Dónde se utilizan típicamente las líneas amarillas continuas simples?
  choices:
    A: En el borde derecho de una vía de doble sentido
    B: Para separar los carriles generales de los carriles para vehículos de alta
      ocupación (HOV)
    C: Para marcar las líneas del borde izquierdo en autopistas divididas, vías de
      un solo sentido y rampas
    D: En el centro de una vía de doble sentido donde se permite rebasar
  answer: C
  explanation: El manual establece que una sola línea amarilla continua marca las
    líneas del borde izquierdo en autopistas divididas, vías de un solo sentido y
    rampas.
- id: 75
  category: signs_and_signals
  question: ¿Cuál es el propósito de las líneas amarillas discontinuas dobles (una
    al lado de la otra)?
  choices:
    A: Marcan los bordes de los carriles reversibles.
    B: Indican un carril central compartido para dar vuelta a la izquierda en ambos
      sentidos.
    C: Marcan un cruce peatonal.
    D: Separan los carriles para bicicletas de los carriles para vehículos motorizados.
  answer: A
  explanation: Las líneas amarillas discontinuas dobles marcan los bordes de los carriles
    reversibles, que son carriles donde el tráfico fluye en una dirección a veces
    y en la dirección opuesta en otras ocasiones.
- id: 76
  category: safe_driving_rules
  question: ¿Se le permite dar vuelta a la izquierda cruzando una doble línea amarilla
    continua?
  choices:
    A: No, cruzar una doble línea amarilla continua está estrictamente prohibido bajo
      cualquier circunstancia.
    B: Sí, pero solo si está rebasando a un vehículo que se mueve lentamente.
    C: Sí, puede dar vuelta a la izquierda cruzándola, como al entrar a una entrada
      de vehículos (driveway).
    D: Sí, pero solo durante las horas del día.
  answer: C
  explanation: Aunque no se permite rebasar en ninguna dirección, el manual especifica
    que puede dar vuelta a la izquierda cruzando una doble línea amarilla continua,
    por ejemplo, al entrar a una entrada de vehículos.
- id: 77
  category: signs_and_signals
  question: ¿Cómo se marcan las líneas de ceder el paso en el pavimento?
  choices:
    A: Como una sola línea blanca continua
    B: Como filas de pequeños triángulos a lo ancho del carril
    C: Como líneas amarillas continuas dobles
    D: Como una sola línea blanca punteada
  answer: B
  explanation: Las líneas de ceder el paso se marcan como filas de pequeños triángulos
    a lo ancho del carril que muestran dónde un vehículo debe ceder el paso a otros
    vehículos o peatones.
- id: 78
  category: sharing_the_road
  question: ¿Cuál es uno de los propósitos de las marcas de carril de uso compartido
    para bicicletas?
  choices:
    A: Prohibir que los vehículos motorizados usen el carril
    B: Indicar dónde deben estacionarse las bicicletas
    C: Desalentar el uso de bicicletas en la dirección equivocada
    D: Advertir a los ciclistas de un cruce de ferrocarril más adelante
  answer: C
  explanation: Las marcas de carril de uso compartido alertan a los conductores de
    que puede haber ciclistas en la vía, indican a los ciclistas por dónde circular
    y desalientan el uso de bicicletas en la dirección equivocada.
- id: 79
  category: defensive_driving
  question: Según la Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA), ¿cuánto más probable es que un choque resulte en muerte en una carretera
    con un límite de velocidad de 65 mph en comparación con un límite de 45 o 50 mph?
  choices:
    A: Es igualmente probable
    B: Más del doble de probable
    C: Casi cinco veces más probable
    D: Diez veces más probable
  answer: B
  explanation: Un choque en una carretera con un límite de velocidad de 65 mph o más
    es más del doble de probable que resulte en muerte que un choque en una carretera
    con un límite de velocidad de 45 o 50 mph.
- id: 80
  category: safe_driving_rules
  question: Al conducir en situaciones de visibilidad reducida, ¿qué debe usar como
    guía para mantenerse en su carril?
  choices:
    A: Las luces traseras del vehículo delante de usted
    B: La doble línea amarilla central
    C: Las líneas en el borde de la carretera o el lado derecho de la carretera
    D: Los faros del tráfico en sentido contrario
  answer: C
  explanation: Al conducir en situaciones de visibilidad reducida, debe usar las líneas
    en el borde de la carretera o el lado derecho de la carretera como guía.
- id: 81
  category: safe_driving_rules
  question: Según la ley de Maryland, ¿debe encender los faros siempre que no haya
    suficiente luz para ver claramente al menos a qué distancia frente a su vehículo?
  choices:
    A: 300 pies
    B: 500 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Debe encender los faros siempre que no haya suficiente luz para ver
    claramente al menos a 1,000 pies frente a su vehículo.
- id: 82
  category: safe_driving_rules
  question: 'La ley de Maryland requiere que encienda los faros cuando:'
  choices:
    A: Conduce en el carril izquierdo de una carretera dividida
    B: Usa los limpiaparabrisas en condiciones climáticas adversas
    C: Se acerca a un cruce de ferrocarril
    D: Se estaciona a un lado de la carretera por la noche
  answer: B
  explanation: La ley de Maryland requiere que encienda los faros cuando use los limpiaparabrisas
    en condiciones climáticas adversas.
- id: 83
  category: safe_driving_rules
  question: Al usar las luces altas, ¿a qué distancia debe cambiar a luces bajas cuando
    sigue a otro vehículo?
  choices:
    A: 100 pies o menos
    B: 200 pies o menos
    C: 300 pies o menos
    D: 500 pies o menos
  answer: C
  explanation: Debe cambiar a luces bajas cuando siga a un vehículo que esté a 300
    pies o menos delante de usted.
- id: 84
  category: defensive_driving
  question: ¿Qué debe hacer para evitar ser cegado por los faros del tráfico en sentido
    contrario por la noche?
  choices:
    A: Encender sus luces altas para ver mejor
    B: Mirar ligeramente hacia la derecha del carril por el que transita
    C: Cerrar un ojo hasta que pase el vehículo
    D: Mirar fijamente la línea central de la carretera
  answer: B
  explanation: No mire fijamente los faros del tráfico que se aproxima. En su lugar,
    mire hacia la carretera frente a usted, o ligeramente hacia la derecha del carril
    por el que transita.
- id: 85
  category: safe_driving_rules
  question: ¿Qué luces debe usar al conducir en la niebla?
  choices:
    A: Solo luces altas
    B: Solo luces bajas
    C: Solo luces de estacionamiento
    D: Luces intermitentes de emergencia y luces altas
  answer: B
  explanation: Al conducir en la niebla, debe usar solo las luces bajas y también
    usar las luces antiniebla si las tiene.
- id: 86
  category: defensive_driving
  question: ¿Qué debe hacer si la niebla es tan espesa que no puede conducir su vehículo
    de manera segura?
  choices:
    A: Detenerse en medio de su carril y esperar a que se despeje
    B: Encender sus luces altas y conducir a 10 mph
    C: Salir completamente de la carretera hacia un lugar seguro y encender las luces
      intermitentes de emergencia
    D: Seguir de cerca a un camión grande para usar sus luces traseras como guía
  answer: C
  explanation: Si la niebla es tan espesa que no puede conducir su vehículo de manera
    segura, salga completamente de la carretera hacia un lugar seguro y encienda las
    luces intermitentes de emergencia.
- id: 87
  category: vehicle_information
  question: Si su vehículo NO tiene un sistema de frenos antibloqueo (ABS), ¿qué debe
    hacer para evitar patinar en carreteras mojadas o heladas?
  choices:
    A: Pisar los frenos firmemente de golpe.
    B: Bombear los frenos.
    C: Tirar del freno de emergencia.
    D: Cambiar a neutral y dejarse llevar.
  answer: B
  explanation: Según el manual, 'Si su vehículo no tiene un sistema de frenos antibloqueo
    (ABS), bombee los frenos para evitar patinar'.
- id: 88
  category: defensive_driving
  question: ¿Qué áreas de la carretera tienden a congelarse antes que el resto de
    la vía?
  choices:
    A: Intersecciones y cruces peatonales
    B: Rampas y puentes
    C: Túneles y pasos subterráneos
    D: Tramos rectos y arcenes
  answer: B
  explanation: El manual advierte que 'Las rampas y los puentes se congelan antes
    que las carreteras'.
- id: 89
  category: defensive_driving
  question: ¿Qué es el 'hielo negro' (black ice)?
  choices:
    A: Hielo que se forma exclusivamente por la noche
    B: Una capa gruesa de nieve mezclada con tierra
    C: Una fina capa de hielo en carreteras de asfalto que es difícil de ver
    D: Hielo que se forma solo en puentes y pasos elevados
  answer: C
  explanation: El manual describe el hielo negro como una fina capa de hielo en carreteras
    de asfalto que puede ser muy difícil o imposible de ver, causada por el derretimiento
    y posterior recongelamiento del hielo o la nieve.
- id: 90
  category: vehicle_information
  question: ¿Cuál de los siguientes artículos se recomienda mantener en el kit de
    emergencia de su automóvil para tener tracción en la nieve y el hielo?
  choices:
    A: Arena para gatos o arena
    B: Aceite de motor adicional
    C: Una llanta de repuesto
    D: Bengalas de carretera
  answer: A
  explanation: La lista de suministros del kit de emergencia en el manual incluye
    'Arena para gatos o arena (para tracción en nieve y hielo)'.
- id: 91
  category: defensive_driving
  question: Si su vehículo comienza a patinar, ¿cuál es una regla básica para ayudar
    a recuperar el control?
  choices:
    A: Pisar los frenos de golpe inmediatamente.
    B: Girar el volante en la dirección opuesta al patinazo.
    C: Girar el volante en la dirección en la que está patinando.
    D: Cerrar los ojos y prepararse para el impacto.
  answer: C
  explanation: Si su vehículo comienza a patinar, las reglas básicas incluyen 'Girar
    el volante en la dirección en la que está patinando' y soltar el pedal del acelerador
    o del freno.
- id: 92
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a hidroplanear?
  choices:
    A: Aplicar los frenos firmemente.
    B: Quitar el pie del acelerador y mantener el vehículo en línea recta.
    C: Girar el volante bruscamente para recuperar la tracción.
    D: Acelerar para atravesar el agua.
  answer: B
  explanation: 'Si comienza a perder el control debido al hidroplaneo, el manual indica:
    ''Quite el pie del acelerador. No aplique los frenos. Mantenga su vehículo en
    línea recta. Disminuya la velocidad hasta que recupere el control''.'
- id: 93
  category: sharing_the_road
  question: ¿Cuáles de los siguientes vehículos están obligados a detenerse antes
    de cada cruce de ferrocarril?
  choices:
    A: Motocicletas y ciclomotores.
    B: Automóviles de pasajeros y vehículos utilitarios deportivos (SUV).
    C: Autobuses, autobuses escolares y camiones que transportan materiales peligrosos.
    D: Vehículos de emergencia con luces intermitentes.
  answer: C
  explanation: 'El manual establece: ''Los autobuses, autobuses escolares y camiones
    que transportan materiales peligrosos deben detenerse antes de cada cruce de ferrocarril''.'
- id: 94
  category: safe_driving_rules
  question: Si tiene una emergencia en o cerca de un cruce de ferrocarril, ¿qué debe
    hacer primero?
  choices:
    A: Quedarse en el vehículo y llamar al 911.
    B: Salir del vehículo y alejarse de las vías.
    C: Intentar empujar el vehículo fuera de las vías usted mismo.
    D: Agitar una bandera para detener el tren que se aproxima.
  answer: B
  explanation: 'El manual aconseja: ''Si tiene una emergencia en o cerca de un cruce
    de ferrocarril, salga del vehículo y aléjese de las vías''.'
- id: 95
  category: signs_and_signals
  question: ¿De qué color son las señales que indican una zona de trabajo?
  choices:
    A: Verde
    B: Azul
    C: Naranja
    D: Rojo
  answer: C
  explanation: Según el manual, 'El naranja es el color para las zonas de trabajo.
    Si ve señales naranjas al conducir, preste mucha atención...'.
- id: 96
  category: signs_and_signals
  question: En una zona de trabajo, ¿qué indican las luces azules intermitentes?
  choices:
    A: Presencia de trabajadores.
    B: Vehículos de mantenimiento de carreteras más adelante.
    C: Cámaras de velocidad activas.
    D: Se aproxima un desvío.
  answer: C
  explanation: La sección del manual sobre Luces en Zonas de Trabajo especifica que
    las 'Luces azules intermitentes' indican 'Cámaras de velocidad activas'.
- id: 97
  category: signs_and_signals
  question: ¿Qué significan las luces ámbar o amarillas intermitentes en una zona
    de trabajo?
  choices:
    A: Cámaras de velocidad activas.
    B: Zona de trabajo activa o presencia de trabajadores.
    C: Vehículos de mantenimiento de carreteras.
    D: La zona de trabajo ha terminado.
  answer: B
  explanation: El manual establece que las 'Luces ámbar/amarillas intermitentes' significan
    'Zona de trabajo activa/presencia de trabajadores'.
- id: 98
  category: safe_driving_rules
  question: Al acercarse a una rotonda (círculo de tráfico), ¿quién tiene el derecho
    de paso?
  choices:
    A: Los vehículos que entran a la rotonda.
    B: El tráfico que ya está en la rotonda.
    C: Los vehículos en el lado derecho.
    D: Los vehículos más grandes, como camiones y autobuses.
  answer: B
  explanation: 'El manual dicta: ''Cuando llegue a una rotonda, siempre debe ceder
    el paso al tráfico que ya está en la rotonda''.'
- id: 99
  category: safe_driving_rules
  question: Al prepararse para salir de una rotonda de varios carriles, ¿qué debe
    hacer?
  choices:
    A: Encender la luz direccional izquierda y detenerse.
    B: Encender la luz direccional derecha y moverse al carril exterior después de
      pasar la salida anterior a la suya.
    C: Acelerar rápidamente para adelantarse a otros vehículos.
    D: Tocar la bocina para advertir a otros conductores que va a salir.
  answer: B
  explanation: 'El manual explica: ''Al prepararse para salir, encienda la luz direccional
    derecha y muévase al carril exterior después de pasar la salida anterior a la
    que planea tomar''.'
- id: 100
  category: safe_driving_rules
  question: ¿Cuál es el propósito de un carril de aceleración al entrar a una autopista
    interestatal?
  choices:
    A: Para rebasar a los vehículos más lentos por la derecha.
    B: Para ajustar su velocidad al flujo del tráfico que ya está en la autopista
      interestatal.
    C: Para estacionar su vehículo en caso de emergencia.
    D: Para salir de la autopista de manera segura.
  answer: B
  explanation: Según el manual, usted usa el carril de aceleración para ajustar su
    velocidad al flujo del tráfico que ya está en la autopista interestatal.
- id: 101
  category: safe_driving_rules
  question: ¿Qué debe hacer si sale de una autopista interestatal en el lugar equivocado?
  choices:
    A: Detenerse y dar marcha atrás en el arcén.
    B: Hacer un giro en U en la rampa de salida.
    C: Continuar hasta salir de la rampa de salida y buscar una forma de volver a
      entrar.
    D: Detenerse en el carril de desaceleración y esperar a que el tráfico se despeje.
  answer: C
  explanation: 'El manual indica: ''Si sale en el lugar equivocado, continúe hasta
    salir de la rampa de salida. Luego, busque una forma de volver a entrar a la carretera.
    Nunca se detenga ni dé marcha atrás en ninguna parte de la autopista.'''
- id: 102
  category: safe_driving_rules
  question: ¿Cuándo se le permite detenerse en el arcén de una autopista interestatal
    o de acceso limitado?
  choices:
    A: Cuando necesite contestar una llamada de teléfono celular.
    B: Cuando desee tomar un descanso.
    C: Solo cuando su vehículo esté averiado o tenga otra emergencia.
    D: Cuando necesite revisar su GPS.
  answer: C
  explanation: Puede detenerse en el arcén, pero solo cuando su vehículo esté averiado
    (deje de funcionar) o tenga otra emergencia.
- id: 103
  category: sharing_the_road
  question: ¿Cómo deben reaccionar los demás vehículos ante un cortejo fúnebre?
  choices:
    A: Deben ceder el derecho de paso incluso si tienen luz verde.
    B: Pueden continuar normalmente si tienen luz verde.
    C: Deben tocar la bocina para mostrar respeto.
    D: Pueden rebasar al cortejo por el lado derecho.
  answer: A
  explanation: 'El manual indica: ''Incluso si tienen luz verde, los demás vehículos
    deben ceder el derecho de paso a los vehículos en un cortejo fúnebre.'''
- id: 104
  category: signs_and_signals
  question: ¿A qué velocidad advierte que viaja un vehículo la señal de vehículo de
    movimiento lento en su parte trasera?
  choices:
    A: 15 millas por hora o menos
    B: 25 millas por hora o menos
    C: 35 millas por hora o menos
    D: 45 millas por hora o menos
  answer: B
  explanation: Algunos vehículos de movimiento lento pueden tener la señal de movimiento
    lento en la parte trasera para advertirle que solo van a 25 millas por hora o
    menos.
- id: 105
  category: alcohol_drugs_health
  question: En Maryland, ¿se considera que un conductor maneja bajo la influencia
    del alcohol cuando su concentración de alcohol en la sangre (BAC) es igual o superior
    a qué nivel?
  choices:
    A: '.04'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: C
  explanation: Maryland considera que los conductores manejan bajo la influencia del
    alcohol cuando su concentración de alcohol en la sangre (BAC) es de .08 o más.
- id: 106
  category: penalties_and_points
  question: ¿Cuál es la consecuencia legal si un conductor menor de 21 años es detenido
    por la policía y ha estado bebiendo?
  choices:
    A: Recibirá una advertencia por la primera infracción.
    B: Su licencia será suspendida o revocada.
    C: Debe asistir a una clase obligatoria de manejo defensivo sin perder su licencia.
    D: Solo será multado si su BAC es de .08 o más.
  answer: B
  explanation: Si aún no tiene 21 años y la policía lo detiene y ha estado bebiendo,
    su licencia será suspendida o revocada.
- id: 107
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes opciones se considera parte del 'área de pasajeros'
    donde los envases abiertos de alcohol son ilegales?
  choices:
    A: Solo el asiento del conductor.
    B: El maletero (baúl) del vehículo.
    C: Cualquier lugar que el conductor o los pasajeros puedan alcanzar fácilmente
      desde donde están sentados.
    D: Solo los asientos traseros del vehículo.
  answer: C
  explanation: El área de pasajeros de un vehículo incluye los asientos del conductor
    y de los pasajeros, y cualquier lugar que el conductor o los pasajeros puedan
    alcanzar fácilmente desde donde están sentados.
- id: 108
  category: penalties_and_points
  question: ¿Qué puede suceder si es condenado por una infracción de manejo en estado
    de ebriedad o bajo los efectos de drogas con un niño en su vehículo?
  choices:
    A: El juez puede duplicar su multa y tiempo en la cárcel.
    B: Su vehículo será confiscado permanentemente.
    C: Se le prohibirá conducir de por vida.
    D: Recibirá una multa de tráfico estándar.
  answer: A
  explanation: Si es condenado por una infracción de manejo en estado de ebriedad
    o bajo los efectos de drogas con un niño en su vehículo, el juez puede duplicar
    su multa y tiempo en la cárcel.
- id: 109
  category: defensive_driving
  question: ¿Cuál de las siguientes opciones es un ejemplo de manejo agresivo?
  choices:
    A: Ceder el derecho de paso a los peatones.
    B: Usar las luces direccionales antes de cambiar de carril.
    C: Hacer cambios de carril inseguros y seguir muy de cerca a otro vehículo.
    D: Conducir en el carril derecho cuando se viaja más lento que el tráfico.
  answer: C
  explanation: 'Los ejemplos de manejo agresivo incluyen: exceso de velocidad, seguir
    muy de cerca a otro vehículo, ignorar las señales y dispositivos de tráfico, hacer
    cambios de carril inseguros, no ceder el derecho de paso y rebasar de manera insegura
    o ilegal.'
- id: 110
  category: safe_driving_rules
  question: ¿Cuál es la regla de uso del teléfono celular para los conductores menores
    de 18 años?
  choices:
    A: Pueden usar un teléfono celular con manos libres en cualquier momento.
    B: Pueden enviar mensajes de texto mientras están detenidos en un semáforo en
      rojo.
    C: No pueden usar un teléfono celular mientras conducen, excepto para hacer una
      llamada de emergencia al 911.
    D: Pueden usar un teléfono celular de mano si tienen a uno de sus padres en el
      auto.
  answer: C
  explanation: Si es menor de 18 años, no puede usar un teléfono celular mientras
    conduce, ni siquiera con manos libres. La única excepción es que puede usarlo
    para hacer una llamada de emergencia al 911.
- id: 111
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    del teléfono celular mientras se conduce para adultos en Maryland?
  choices:
    A: Es legal enviar mensajes de texto mientras conduce si se encuentra en una autopista
      interestatal.
    B: Es ilegal usar un teléfono celular de mano, pero se permite el uso de manos
      libres.
    C: Todo uso del teléfono celular, incluido el manos libres, es completamente ilegal
      para todos los conductores.
    D: Puede sostener su teléfono para hacer una llamada si conduce por debajo del
      límite de velocidad.
  answer: B
  explanation: Es ilegal usar un teléfono celular de mano, lo que incluye enviar mensajes
    de texto, mientras se conduce. Puede usar su teléfono para hacer llamadas mientras
    conduce si no lo sostiene en la mano (manos libres).
- id: 112
  category: alcohol_drugs_health
  question: ¿Cómo afecta a su capacidad para conducir el no dormir lo suficiente?
  choices:
    A: Aumenta su tiempo de reacción y mejora su nivel de alerta.
    B: Ralentiza el tiempo de reacción, disminuye el nivel de alerta y afecta el juicio.
    C: Solo afecta su visión pero no su juicio.
    D: Lo hace más propenso a conducir de manera agresiva pero no afecta la coordinación.
  answer: B
  explanation: La somnolencia ralentiza el tiempo de reacción, disminuye el nivel
    de alerta y afecta el juicio, al igual que las drogas o el alcohol.
- id: 113
  category: defensive_driving
  question: ¿Cuál de las siguientes opciones se considera una señal de peligro de
    que está conduciendo con somnolencia?
  choices:
    A: Recordar claramente las últimas millas.
    B: Mantener una velocidad constante.
    C: Tener pensamientos divagantes y desconectados.
    D: Revisar los espejos con frecuencia.
  answer: C
  explanation: Según el manual, las señales de peligro para los conductores somnolientos
    incluyen tener pensamientos divagantes y desconectados, no recordar haber conducido
    las últimas millas y cambiar constantemente de velocidad.
- id: 114
  category: penalties_and_points
  question: ¿Cuáles son las posibles consecuencias de ser arrestado por conducir bajo
    los efectos del alcohol o las drogas (impaired driving) en Maryland?
  choices:
    A: Una advertencia por la primera infracción.
    B: Grandes multas, posible tiempo en la cárcel y miles de dólares en costos judiciales.
    C: Solo una suspensión temporal de la licencia.
    D: Servicio comunitario obligatorio sin multas.
  answer: B
  explanation: El manual establece que ser arrestado por conducir bajo los efectos
    del alcohol o las drogas tiene graves consecuencias, que incluyen grandes multas,
    posible tiempo en la cárcel y miles de dólares en costos judiciales.
- id: 115
  category: defensive_driving
  question: Según el manual, ¿qué proporción de los accidentes fatales son causados
    por la conducción distraída?
  choices:
    A: Un cuarto
    B: Un tercio
    C: La mitad
    D: Dos tercios
  answer: B
  explanation: El manual establece explícitamente que un tercio de los accidentes
    fatales son causados por la conducción distraída.
- id: 116
  category: sharing_the_road
  question: Si un vehículo delante de usted está detenido en un cruce peatonal, ¿qué
    debe hacer?
  choices:
    A: Rebasar al vehículo por la izquierda.
    B: Tocar la bocina para alertar a los peatones.
    C: Rebasar al vehículo por la derecha si hay espacio.
    D: No rebasar al vehículo detenido.
  answer: D
  explanation: 'El manual establece como regla básica para los cruces peatonales:
    ''No puede rebasar a ningún vehículo que esté detenido en un cruce peatonal''.'
- id: 117
  category: safe_driving_rules
  question: ¿Qué debe hacer inmediatamente después de ver o escuchar que se acerca
    un vehículo de emergencia usando sus señales?
  choices:
    A: Acelerar para apartarse de su camino.
    B: Moverse lo más cerca posible del borde de la vía y detenerse.
    C: Detenerse inmediatamente en medio de la intersección.
    D: Continuar a su velocidad actual pero moverse al carril derecho.
  answer: B
  explanation: Cuando un vehículo de emergencia se acerca usando sus señales, debe
    moverse lo más cerca posible del borde de la vía, mantenerse fuera de las intersecciones
    y permanecer detenido hasta que haya pasado.
- id: 118
  category: safe_driving_rules
  question: ¿Qué debe hacer si se acerca a una grúa detenida a un lado de la carretera
    y no puede moverse de manera segura a un carril no adyacente?
  choices:
    A: Mantener su velocidad y tocar la bocina.
    B: Detenerse por completo hasta que la grúa se vaya.
    C: Reducir la velocidad a una velocidad segura y prepararse para detenerse si
      es necesario.
    D: Acelerar para rebasar al vehículo rápidamente.
  answer: C
  explanation: Si no es posible cambiarse a un carril que no sea inmediatamente adyacente
    a un vehículo de emergencia o de servicio detenido, debe reducir la velocidad
    a una velocidad segura y prepararse para detenerse si es necesario.
- id: 119
  category: sharing_the_road
  question: ¿Por qué es riesgoso rebasar a un camión grande por la derecha al acercarse
    a una intersección?
  choices:
    A: El camión podría estar preparándose para hacer un giro amplio a la derecha.
    B: A los camiones no se les permite girar a la derecha en las intersecciones.
    C: El camión acelerará más rápido que un automóvil.
    D: Los camiones siempre giran a la izquierda desde el carril derecho.
  answer: A
  explanation: Los camiones hacen giros amplios y a menudo se mueven hacia la izquierda
    antes de hacer un giro a la derecha. Rebasar por la derecha es riesgoso porque
    podría quedar atrapado entre el camión que gira y el bordillo (acera).
- id: 120
  category: vehicle_information
  question: Aproximadamente, ¿cuánta distancia necesita un camión completamente cargado
    de 80,000 libras para detenerse por completo?
  choices:
    A: La longitud de un automóvil estándar.
    B: 50 pies.
    C: La longitud de un campo de fútbol americano.
    D: Media milla.
  answer: C
  explanation: El manual establece que los camiones completamente cargados pueden
    pesar más de 80,000 libras y necesitan la longitud de un campo de fútbol americano
    para detenerse.
- id: 121
  category: sharing_the_road
  question: Al rebasar a un camión grande, ¿cuándo es seguro regresar al carril delante
    del camión?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del camión
    B: Cuando pueda ver ambos faros del camión en su espejo retrovisor
    C: Cuando el conductor del camión parpadee sus luces altas
    D: Después de haber mantenido su velocidad de rebase durante 10 segundos
  answer: B
  explanation: Solo debe regresar al carril del camión cuando pueda ver ambos faros
    en su espejo retrovisor, asegurándose de no meterse en su zona ciega delantera
    (Front No-Zone).
- id: 122
  category: safe_driving_rules
  question: ¿A qué distancia debe detenerse de un autobús escolar que se ha detenido
    en la carretera con sus luces rojas intermitentes encendidas?
  choices:
    A: Al menos 10 pies
    B: Al menos 15 pies
    C: Al menos 20 pies
    D: Al menos 50 pies
  answer: C
  explanation: Los conductores deben detenerse al menos a 20 pies de la parte delantera
    o trasera de un autobús escolar si este se ha detenido en la carretera con sus
    luces rojas intermitentes encendidas.
- id: 123
  category: safe_driving_rules
  question: ¿Cuándo NO está obligado a detenerse ante un autobús escolar con luces
    rojas intermitentes?
  choices:
    A: Cuando viaja en dirección opuesta en una carretera de dos carriles
    B: Cuando se encuentra en una carretera de múltiples carriles dividida por una
      barrera física y el autobús está en el otro lado
    C: Cuando llega tarde al trabajo
    D: Cuando el autobús está detenido en un cruce de ferrocarril
  answer: B
  explanation: Si se encuentra en una carretera de múltiples carriles dividida por
    una barrera física, no debe detenerse si el autobús está al otro lado de la barrera.
- id: 124
  category: sharing_the_road
  question: En más de la mitad de los accidentes automovilísticos que involucran motocicletas,
    ¿quién tiene la culpa?
  choices:
    A: El motociclista
    B: El conductor del automóvil
    C: Ambos conductores por igual
    D: Los peatones
  answer: B
  explanation: El manual señala que los conductores de automóviles tienen la culpa
    en más de la mitad de los accidentes con motocicletas, particularmente al no ceder
    el derecho de paso durante los giros a la izquierda.
- id: 125
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima de seguimiento recomendada que debe dejar
    al conducir detrás de una motocicleta?
  choices:
    A: 1 a 2 segundos
    B: 3 a 4 segundos
    C: 5 a 6 segundos
    D: 10 segundos
  answer: B
  explanation: Debe dejar al menos una distancia de seguimiento de 3 a 4 segundos
    entre su vehículo y la motocicleta que va delante de usted.
- id: 126
  category: sharing_the_road
  question: ¿Por qué nunca debe compartir un carril con una motocicleta?
  choices:
    A: Las motocicletas están obligadas a permanecer en el arcén (hombro)
    B: A los motociclistas se les permite usar todo el carril y pueden moverse para
      evitar peligros
    C: Es ilegal que los automóviles conduzcan en el carril derecho
    D: Las motocicletas son demasiado ruidosas y lo distraerán
  answer: B
  explanation: No debe compartir un carril con una motocicleta porque a los motociclistas
    se les permite usar todo el carril y a menudo se mueven para evitar peligros en
    la carretera, el viento, o para ser vistos.
- id: 127
  category: sharing_the_road
  question: ¿Cómo clasifica la ley de Maryland a las bicicletas?
  choices:
    A: Como accesorios para peatones
    B: Como juguetes recreativos
    C: Como vehículos que deben obedecer todas las señales de tránsito
    D: Como scooters motorizados
  answer: C
  explanation: Según la ley de Maryland, las bicicletas son vehículos. A los ciclistas
    se les permite usar la carretera y deben obedecer todas las señales de tránsito.
- id: 128
  category: sharing_the_road
  question: ¿Dónde NO se espera ni se permite que circulen los ciclistas?
  choices:
    A: Calles residenciales
    B: Autopistas interestatales y puentes de peaje
    C: Carreteras sin arcén (hombro)
    D: Rotondas (círculos de tráfico)
  answer: B
  explanation: Según el manual, debe esperar encontrar ciclistas en todo tipo de carreteras,
    excepto en autopistas interestatales, y en puentes y túneles con peaje.
- id: 129
  category: sharing_the_road
  question: Al rebasar a un ciclista, ¿cuál es la distancia mínima que debe dejar
    entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: El manual establece que debe dejar al menos 3 pies de distancia entre
    su vehículo y la bicicleta al rebasar.
- id: 130
  category: safe_driving_rules
  question: Cuando un ciclista circula por un cruce peatonal, ¿qué reglas de derecho
    de paso se aplican?
  choices:
    A: Deben ceder el paso a todos los vehículos de motor.
    B: Tienen el mismo derecho de paso que los peatones.
    C: Solo tienen derecho de paso si se bajan de su bicicleta.
    D: No se les permite usar los cruces peatonales.
  answer: B
  explanation: El manual especifica que las bicicletas tienen el mismo derecho de
    paso que los peatones en un cruce peatonal.
- id: 131
  category: defensive_driving
  question: ¿Por qué un ciclista podría circular legalmente en el centro del carril
    de circulación en lugar de en el borde derecho?
  choices:
    A: Para ralentizar intencionalmente el tráfico detrás de ellos.
    B: Porque la carretera es estrecha o para evitar obstáculos.
    C: Solo cuando se preparan para dar una vuelta en U.
    D: A los ciclistas nunca se les permite circular en el centro del carril de circulación.
  answer: B
  explanation: Los ciclistas pueden circular en el carril de circulación por su propia
    seguridad porque la carretera es estrecha, para evitar obstáculos o peligros en
    el pavimento, o cuando hay autos estacionados en el lado derecho.
- id: 132
  category: sharing_the_road
  question: ¿Qué debe hacer al acercarse a un ciclista por detrás?
  choices:
    A: Tocar la bocina para hacerles saber que usted está ahí.
    B: Acelerar para rebasarlos lo más rápido posible.
    C: Reducir la velocidad y no tocar la bocina.
    D: Parpadear las luces altas repetidamente.
  answer: C
  explanation: Al acercarse a un ciclista, debe reducir la velocidad y no tocar la
    bocina, ya que los ruidos fuertes pueden asustarlos y causar un choque.
- id: 133
  category: sharing_the_road
  question: ¿En qué tipos de carreteras se permite conducir ciclomotores (mopeds)
    y motonetas (motor scooters)?
  choices:
    A: Solo en carreteras con un límite de velocidad de 35 mph o menos.
    B: Cualquier carretera con un límite de velocidad máximo publicado de 50 mph o
      menos.
    C: Todas las autopistas interestatales.
    D: Solo en carreteras con carriles designados para bicicletas.
  answer: B
  explanation: Los ciclomotores y motonetas pueden conducirse en cualquier carretera
    con un límite de velocidad máximo publicado de 50 millas por hora o menos.
- id: 134
  category: vehicle_information
  question: ¿Cuál es una limitación conocida de los Sistemas Avanzados de Asistencia
    al Conductor (ADAS)?
  choices:
    A: Solo funcionan durante las horas del día.
    B: Es posible que no funcionen correctamente con lluvia, nieve, niebla, en colinas
      y en curvas.
    C: Reemplazan por completo la necesidad de que el conductor revise los espejos.
    D: Se garantiza que previenen el 100% de los choques.
  answer: B
  explanation: El manual advierte que la tecnología ADAS tiene limitaciones y es posible
    que no funcione correctamente con lluvia, nieve, niebla, en colinas y en curvas.
- id: 135
  category: driver_responsibility
  question: Si está involucrado en un choque donde alguien ha resultado herido, ¿qué
    debe hacer con los vehículos?
  choices:
    A: Moverlos al arcén inmediatamente.
    B: Conducirlos a la estación de policía más cercana.
    C: No mover los vehículos.
    D: Moverlos solo si están bloqueando una entrada.
  answer: C
  explanation: Si está involucrado en un choque donde alguien ha resultado herido,
    debe permanecer en el lugar, llamar al 911 y no mover los vehículos.
- id: 136
  category: penalties_and_points
  question: ¿Cuál es la sanción por abandonar el lugar de un choque donde alguien
    muere?
  choices:
    A: Un delito menor y una multa de $500.
    B: Un delito grave (felony), hasta 10 años de prisión y una multa de hasta $10,000.
    C: Hasta 5 años de prisión y una multa de $5,000.
    D: Una advertencia y 3 puntos en su licencia.
  answer: B
  explanation: Abandonar el lugar de un choque donde alguien muere es un delito grave
    (felony). Podría ir a prisión por hasta 10 años y recibir una multa de hasta $10,000.
- id: 137
  category: driver_responsibility
  question: Si está en un choque donde no hay heridos y su vehículo SÍ se puede mover,
    ¿cuál es su primera responsabilidad?
  choices:
    A: Dejar el vehículo exactamente donde está hasta que llegue la policía.
    B: Mover su vehículo fuera de la carretera lo más cerca posible de donde ocurrió
      el choque.
    C: Detener el tráfico para tomar fotos de los vehículos en la vía.
    D: Conducir a casa y reportar el choque al día siguiente.
  answer: B
  explanation: Si no hay heridos y su vehículo se puede mover, debe mover su vehículo
    fuera de la carretera lo más cerca posible de donde ocurrió el choque para mantener
    a todos a salvo y evitar embotellamientos.
- id: 138
  category: driver_responsibility
  question: ¿En cuál de las siguientes situaciones SIEMPRE debe llamar a la policía
    después de un choque?
  choices:
    A: Solo cuando los daños superan los $1,000.
    B: Cuando un conductor parece estar bajo la influencia del alcohol o las drogas.
    C: Solo si el choque ocurre en una autopista interestatal.
    D: Siempre que atropelle a un animal.
  answer: B
  explanation: Siempre debe llamar a la policía cuando alguien ha resultado herido,
    un vehículo no se puede mover o un conductor parece estar bajo la influencia del
    alcohol o las drogas.
- id: 139
  category: safe_driving_rules
  question: Al prepararse para dar una vuelta a la derecha, ¿qué debe hacer con respecto
    a los ciclistas?
  choices:
    A: Dar la vuelta desde el carril de circulación inmediatamente después de rebasar
      a la bicicleta.
    B: Tocar la bocina para obligar al ciclista a subirse a la acera antes de dar
      la vuelta.
    C: Moverse lo más a la derecha posible dentro del carril para bicicletas, el arcén
      o el carril para dar vuelta a la derecha.
    D: Siempre dar la vuelta a la izquierda en su lugar para evitar al ciclista.
  answer: C
  explanation: Antes de comenzar a dar una vuelta a la derecha, debe moverse lo más
    a la derecha posible dentro del carril para bicicletas, el arcén o el carril para
    dar vuelta a la derecha.
- id: 140
  category: defensive_driving
  question: ¿Qué debe hacer si ve un objeto reflectante tenue en la carretera por
    la noche?
  choices:
    A: Encender las luces altas para cegar al ciclista.
    B: Asumir que está fuera de la carretera y mantener su velocidad.
    C: No asumir que está fuera de la carretera y usar las luces bajas al acercarse.
    D: Tocar la bocina continuamente hasta rebasarlo.
  answer: C
  explanation: Si ve un objeto reflectante tenue por la noche, no asuma que está fuera
    de la carretera; podría ser una bicicleta. Al acercarse a una bicicleta, use las
    luces bajas.
- id: 141
  category: sharing_the_road
  question: Cuando un ciclista circula por una acera, ¿qué regla debe seguir?
  choices:
    A: Debe circular al menos a 15 mph.
    B: Tiene el derecho de paso sobre todos los peatones.
    C: Debe ceder el derecho de paso a los peatones y a las personas en dispositivos
      de movilidad asistida.
    D: Debe circular en dirección contraria al tráfico.
  answer: C
  explanation: Al andar en bicicleta por una acera, los ciclistas deben recordar ceder
    el derecho de paso a los peatones y a las personas en dispositivos de movilidad
    asistida.
- id: 142
  category: vehicle_information
  question: Según el manual, ¿qué porcentaje de choques previenen los Sistemas Avanzados
    de Asistencia al Conductor (ADAS) cuando se usan correctamente?
  choices:
    A: 10%
    B: 25%
    C: 40%
    D: 75%
  answer: C
  explanation: El manual indica que, cuando se usan correctamente, las tecnologías
    ADAS previenen el 40% de los choques.
- id: 143
  category: driver_responsibility
  question: Si choca contra un vehículo desatendido y no puede encontrar al propietario,
    ¿qué debe hacer?
  choices:
    A: Esperar junto al vehículo hasta que regrese el propietario
    B: Llamar a una grúa para mover el vehículo
    C: Dejar una nota con su información de contacto en un lugar donde se pueda encontrar
      fácilmente
    D: Reportar el incidente a su compañía de seguros dentro de 24 horas y abandonar
      la escena
  answer: C
  explanation: Si no puede encontrar al propietario de la propiedad desatendida contra
    la que chocó, debe dejarle una nota explicando lo sucedido con su información
    de contacto en un lugar donde pueda encontrarla fácilmente.
- id: 144
  category: safe_driving_rules
  question: ¿Qué debe hacer inmediatamente si golpea y lastima a un animal doméstico,
    como un perro o una vaca, con su vehículo?
  choices:
    A: Llamar a la policía
    B: Mover al animal a un lado de la carretera
    C: Localizar al dueño del animal
    D: Llevar al animal al veterinario más cercano
  answer: A
  explanation: El manual indica que si golpea y lastima a un animal doméstico con
    su vehículo, debe llamar inmediatamente a la policía.
- id: 145
  category: defensive_driving
  question: Durante una emergencia en la carretera, ¿dónde NUNCA debe detener o estacionar
    su vehículo?
  choices:
    A: En el arcén (hombro) de la carretera
    B: En un estacionamiento cercano
    C: En una rampa de salida
    D: En las zonas pintadas en forma de triángulo donde una rampa sale de la carretera
  answer: D
  explanation: 'El manual establece explícitamente: "Nunca se detenga ni se estacione
    en las zonas pintadas en forma de triángulo donde una rampa sale de la carretera".'
- id: 146
  category: defensive_driving
  question: Si no es seguro permanecer en su vehículo durante una emergencia en la
    carretera, ¿cómo debe posicionarse afuera?
  choices:
    A: Pararse directamente detrás de su vehículo para advertir a los demás
    B: Moverse detrás de una barrera de tráfico o barandilla y mirar hacia el tráfico
      que se aproxima
    C: Pararse en el carril de tráfico más cercano para pedir ayuda con la mano
    D: Sentarse en el arcén de la carretera de espaldas al tráfico
  answer: B
  explanation: Si no puede permanecer en su vehículo, debe alejarse rápidamente de
    la carretera, ubicarse detrás de un terraplén o barandilla, y mirar hacia el tráfico
    que se aproxima.
- id: 147
  category: safe_driving_rules
  question: ¿Cuál es el mejor lugar para mantener las manos cuando es detenido por
    un oficial de la ley?
  choices:
    A: En sus bolsillos
    B: Alcanzando la guantera
    C: A plena vista sobre el volante
    D: Fuera de la ventana del lado del conductor
  answer: C
  explanation: Durante una parada de tráfico, debe mantener las manos a plena vista,
    y el manual señala que "sobre el volante es lo mejor".
- id: 148
  category: safe_driving_rules
  question: Según la Ley de Hacerse a un Lado (Move Over Law) de Maryland, ¿qué debe
    hacer si no es seguro o posible cambiar de carril al acercarse a un vehículo detenido
    con luces intermitentes?
  choices:
    A: Detener su vehículo por completo hasta que se apaguen las luces intermitentes
    B: Tocar la bocina para alertar al vehículo detenido
    C: Mantener su velocidad pero moverse al borde de su carril
    D: Reducir la velocidad a una velocidad segura
  answer: D
  explanation: Si no es seguro o posible cambiar de carril al acercarse a un vehículo
    con luces intermitentes, la Ley de Hacerse a un Lado (Move Over Law) requiere
    que reduzca la velocidad a una velocidad segura.
- id: 149
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar la Ley de Hacerse a un Lado (Move Over
    Law) si la infracción causa un choque?
  choices:
    A: Una multa de $110 y un punto en su licencia
    B: Una multa de $150 y tres puntos en su licencia
    C: Una multa de $750 y tres puntos en su licencia
    D: Una multa de $500 y la suspensión de la licencia
  answer: B
  explanation: Violar la Ley de Hacerse a un Lado (Move Over Law) es un delito menor
    que conlleva una multa de $150 y tres puntos si la infracción causa un choque.
- id: 150
  category: sharing_the_road
  question: En los choques que involucran a un automóvil y una motocicleta, ¿quién
    tiene la culpa más de la mitad de las veces?
  choices:
    A: El motociclista
    B: El conductor del automóvil
    C: Ambos conductores por igual
    D: Ningún conductor
  answer: B
  explanation: El manual indica que cuando hay un choque que involucra a un automóvil
    y una motocicleta, el conductor del automóvil tiene la culpa más de la mitad de
    las veces.
- id: 151
  category: license_system
  question: Durante los primeros 151 días de tener una Licencia Provisional (siendo
    menor de 18 años), ¿con quién se le permite conducir sin supervisión?
  choices:
    A: Cualquier pasajero menor de 18 años
    B: Solo miembros de la familia inmediata
    C: Hasta tres amigos
    D: No se permiten pasajeros bajo ninguna circunstancia
  answer: B
  explanation: Si tiene una Licencia Provisional y es menor de 18 años, no puede conducir
    sin supervisión con pasajeros menores de 18 años durante los primeros 151 días,
    a menos que sean miembros de la familia inmediata.
- id: 152
  category: license_system
  question: ¿Bajo qué condición se le permite a un titular de una Licencia Provisional
    conducir sin supervisión entre las 12:00 de la medianoche y las 5:00 a.m.?
  choices:
    A: Al conducir hacia o desde una actividad escolar oficial
    B: Al conducir a casa desde la casa de un amigo
    C: Al hacer mandados para uno de los padres
    D: Al practicar habilidades de manejo en calles vacías
  answer: A
  explanation: Los titulares de una Licencia Provisional pueden conducir sin supervisión
    entre la medianoche y las 5:00 a.m. SOLO si conducen hacia o desde un trabajo,
    programa de voluntariado, actividad escolar oficial o evento/entrenamiento atlético.
- id: 153
  category: safe_driving_rules
  question: ¿Cuál es la restricción de dispositivos inalámbricos para los conductores
    que tienen un Permiso de Aprendizaje o una Licencia Provisional?
  choices:
    A: Solo pueden usar dispositivos de manos libres mientras conducen
    B: Pueden usar dispositivos inalámbricos solo cuando están detenidos en un semáforo
      en rojo
    C: No pueden usar ningún dispositivo de comunicación inalámbrica mientras conducen,
      excepto para una llamada de emergencia al 911
    D: Pueden usar dispositivos inalámbricos solo para navegación GPS
  answer: C
  explanation: Los titulares de una Licencia Provisional o un Permiso de Aprendizaje
    no pueden usar ningún dispositivo de comunicación inalámbrica (incluidos los de
    manos libres) mientras conducen, con la única excepción de una llamada de emergencia
    al 911.
- id: 154
  category: alcohol_drugs_health
  question: ¿Qué le exige hacer la ley de Consentimiento Implícito de Maryland?
  choices:
    A: Dar su consentimiento para una búsqueda del vehículo en cualquier parada de
      tráfico
    B: Aceptar someterse a una prueba de drogas o alcohol si se lo pide un oficial
      de la ley
    C: Dar su consentimiento para que remolquen su vehículo si es arrestado
    D: Aceptar responder a todas las preguntas sin la presencia de un abogado
  answer: B
  explanation: En Maryland, conducir en una vía pública significa que usted da su
    consentimiento para someterse a una prueba de drogas o alcohol si un oficial de
    la ley se lo solicita.
- id: 155
  category: alcohol_drugs_health
  question: ¿A qué concentración de alcohol en la sangre (BAC) se suspenderá su licencia
    de conducir en Maryland?
  choices:
    A: 0.04 por ciento o más
    B: 0.06 por ciento o más
    C: 0.08 por ciento o más
    D: 0.10 por ciento o más
  answer: C
  explanation: Su licencia será suspendida si su concentración de alcohol en la sangre
    es de 0.08 por ciento o más.
- id: 156
  category: penalties_and_points
  question: Si su licencia de conducir es suspendida o revocada, ¿cuándo comienza
    oficialmente el período de suspensión o revocación?
  choices:
    A: En la fecha en que se emitió la citación
    B: En la fecha de su audiencia en la corte
    C: Cuando recibe la notificación por correo
    D: Cuando la MVA recibe su licencia
  answer: D
  explanation: El manual establece que si su licencia es suspendida, revocada, denegada
    o cancelada, debe entregar su licencia a la MVA, y los períodos de suspensión
    o revocación comienzan cuando la MVA recibe su licencia.
- id: 157
  category: penalties_and_points
  question: ¿Cuál es la sanción por una PRIMERA infracción de tránsito en movimiento
    para un conductor menor de 18 años con una Licencia Provisional?
  choices:
    A: Una suspensión de 30 días de la licencia de conducir
    B: Finalización de un programa de mejora del conductor
    C: Revocación inmediata de la licencia
    D: Una suspensión de 180 días de la licencia de conducir
  answer: B
  explanation: Según el manual, si es menor de 18 años y tiene una Licencia Provisional,
    la PRIMERA ofensa por una infracción de tránsito en movimiento requiere que complete
    un programa de mejora del conductor.
- id: 158
  category: penalties_and_points
  question: Si es menor de 18 años y tiene una Licencia Provisional, ¿qué sucede si
    comete una CUARTA o más infracciones de tránsito en movimiento?
  choices:
    A: Su licencia es suspendida por 180 días
    B: Su licencia es suspendida por 30 días
    C: Su licencia es revocada y debe aprobar todos los exámenes de licencia para
      recuperarla
    D: Sus privilegios de conducir son cancelados permanentemente
  answer: C
  explanation: El manual establece que para los menores con una Licencia Provisional,
    una CUARTA o MÁS ofensas resultará en la revocación de su licencia, y deberá aprobar
    todos los exámenes de licencia para recuperarla.
- id: 159
  category: license_system
  question: ¿Cuál de las siguientes es una razón por la que la MVA puede cancelar
    su licencia de conducir?
  choices:
    A: Cometió fraude cuando solicitó u obtuvo su licencia
    B: Recibió una multa de estacionamiento en una zona comercial
    C: Condujo 5 mph por encima del límite de velocidad publicado
    D: No renovó el registro de su vehículo a tiempo
  answer: A
  explanation: La cancelación de una licencia de conducir significa que su privilegio
    de conducir ha terminado. La MVA puede cancelarla si determina que usted cometió
    fraude cuando solicitó u obtuvo su licencia.
- id: 160
  category: penalties_and_points
  question: Para un adulto (de 18 años o más) que tiene una Licencia Provisional,
    ¿cuál es la sanción por una SEGUNDA condena por infracción de tránsito en movimiento?
  choices:
    A: Una suspensión de 180 días de la licencia
    B: Revocación de la licencia
    C: Una suspensión de 30 días de la licencia
    D: Una carta de advertencia obligatoria de la MVA
  answer: C
  explanation: Para los adultos de 18 años o más con una Licencia Provisional, una
    SEGUNDA ofensa resultará en una suspensión de 30 días de su licencia.
- id: 161
  category: driver_responsibility
  question: ¿Es legal estacionarse en un pasillo de acceso junto a un espacio de estacionamiento
    para personas con discapacidades si tiene un cartel de discapacidad válido?
  choices:
    A: Sí, si la persona con discapacidad está presente en el vehículo
    B: Sí, pero solo por un máximo de 15 minutos
    C: No, es una infracción incluso si tiene una placa o cartel de discapacidad
    D: Sí, si no hay otros espacios de estacionamiento para personas con discapacidades
      disponibles
  answer: C
  explanation: Se pueden emitir multas por estacionarse en cualquier parte de un pasillo
    de acceso junto a un espacio de estacionamiento para personas con discapacidades,
    incluso si tiene una placa o cartel de discapacidad.
- id: 162
  category: alcohol_drugs_health
  question: ¿Qué dispositivo tendrá que instalar en su vehículo si lo sorprenden bebiendo
    y conduciendo?
  choices:
    A: Un dispositivo de rastreo GPS
    B: Un limitador de velocidad
    C: Un dispositivo de bloqueo de encendido con alcoholímetro
    D: Un libro de registro electrónico
  answer: C
  explanation: Si lo sorprenden bebiendo y conduciendo, tendrá que instalar un dispositivo
    de bloqueo de encendido con alcoholímetro que le impedirá arrancar el vehículo
    si se detecta alcohol.
- id: 163
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes condiciones médicas debe informarse a la MVA al
    solicitar o renovar una licencia de conducir?
  choices:
    A: Un brazo roto que sanó hace 5 años
    B: Presión arterial alta
    C: Una afección cardíaca que ha causado pérdida de conocimiento en los últimos
      6 meses
    D: Alergias estacionales
  answer: C
  explanation: Debe notificar a la MVA si tiene una afección cardíaca que ha causado
    pérdida de conocimiento en los últimos 6 meses, ya que podría afectar su capacidad
    para conducir.
- id: 164
  category: license_system
  question: ¿Cuáles son los requisitos para un conductor supervisor cuando usted tiene
    un Permiso de Aprendizaje de Maryland?
  choices:
    A: Tener al menos 18 años y tener licencia por 1 año
    B: Tener al menos 21 años y tener una licencia vigente por al menos tres años
      para conducir la misma clase de vehículo
    C: Tener al menos 25 años y tener licencia por 5 años
    D: Cualquier conductor con licencia, independientemente de su edad o experiencia
  answer: B
  explanation: Un conductor supervisor debe tener al menos 21 años, tener una licencia
    vigente por al menos tres años en Maryland u otro estado para conducir la misma
    clase de vehículos, y estar sentado a su lado.
- id: 165
  category: driver_responsibility
  question: ¿Puede un menor de 16 años convertirse en donante de órganos en Maryland?
  choices:
    A: No, debe tener 18 años o más para ser donante de órganos
    B: Sí, pero solo para ciertos órganos específicos
    C: Sí, si un padre o tutor da su consentimiento por escrito
    D: Sí, sin restricciones ni necesidad de consentimiento
  answer: C
  explanation: Los menores de al menos 16 años pueden ser donantes de órganos si un
    padre o tutor da su consentimiento (acepta) por escrito.
- id: 166
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es cierta con respecto a la tarjeta
    de identificación del seguro de su vehículo?
  choices:
    A: Debe ser una tarjeta física de papel; no se aceptan formatos electrónicos
    B: Solo necesita mostrarla a las autoridades si está involucrado en un choque
    C: Debe llevarla siempre consigo al conducir, y puede estar en formato electrónico
    D: Es opcional llevarla siempre que el vehículo esté debidamente registrado
  answer: C
  explanation: Debe llevar siempre consigo una tarjeta de identificación de seguro
    válida al conducir un vehículo motorizado, y esta tarjeta puede estar en formato
    electrónico.
- id: 167
  category: safe_driving_rules
  question: Según la ley de cinturones de seguridad de Maryland, ¿quién debe usar
    el cinturón de seguridad o estar abrochado en un asiento de seguridad para niños?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero
    B: Solo los pasajeros menores de 18 años
    C: El conductor y todos los pasajeros de un vehículo motorizado
    D: Solo el conductor
  answer: C
  explanation: Por ley, el conductor y todos los pasajeros de un vehículo motorizado
    deben usar el cinturón de seguridad o estar abrochados en un asiento de seguridad
    para niños.
- id: 168
  category: safe_driving_rules
  question: ¿A qué edad y altura un niño ya no está obligado por ley a viajar en un
    asiento de seguridad para niños?
  choices:
    A: 6 años o 4'5" de altura
    B: 8 años o 4'9" de altura
    C: 10 años o 5'0" de altura
    D: 5 años o 40 libras
  answer: B
  explanation: Todos los niños menores de 8 años deben viajar en un asiento de seguridad
    para niños, a menos que el niño mida 4'9" o más.
- id: 169
  category: safe_driving_rules
  question: ¿Cuánto tiempo debe viajar un niño en un asiento de seguridad para niños
    orientado hacia atrás?
  choices:
    A: Hasta que tengan 1 año de edad
    B: Mientras sean menores de 2 años y hasta que alcancen la altura o el peso especificados
      por el fabricante
    C: Hasta que tengan 3 años de edad
    D: Hasta que pesen 20 libras
  answer: B
  explanation: Los niños menores de 2 años deben viajar en un asiento de seguridad
    para niños orientado hacia atrás que cumpla con las pautas federales hasta que
    alcancen la altura o el peso especificados por el fabricante.
- id: 170
  category: vehicle_information
  question: Para obtener la mejor protección de las bolsas de aire, ¿a qué distancia
    del volante debe intentar sentarse?
  choices:
    A: De 5 a 7 pulgadas
    B: De 10 a 12 pulgadas
    C: De 15 a 18 pulgadas
    D: De 20 a 24 pulgadas
  answer: B
  explanation: Para obtener la mejor protección en caso de choques, debe intentar
    mantener de 10 a 12 pulgadas entre el volante y su pecho.
- id: 171
  category: license_system
  question: ¿Cuál es la diferencia entre la suspensión y la revocación de una licencia?
  choices:
    A: Una suspensión es permanente, mientras que una revocación es temporal.
    B: Una revocación significa que su privilegio de conducir se termina y no se restablece.
    C: Una revocación es más severa que una suspensión y requiere un período de espera
      mínimo antes de solicitar el restablecimiento.
    D: Una suspensión requiere que vuelva a tomar todos los exámenes de la licencia,
      mientras que una revocación no.
  answer: C
  explanation: La revocación de una licencia de conducir de Maryland es más severa
    que una suspensión. Si es revocada, hay un período de espera mínimo antes de que
    pueda solicitar a la MVA que la restablezca.
- id: 172
  category: safe_driving_rules
  question: ¿Los niños menores de qué edad deben viajar abrochados en el asiento trasero
    en un asiento de seguridad para niños o con un cinturón de seguridad?
  choices:
    A: 8 años
    B: 10 años
    C: 12 años
    D: 13 años
  answer: D
  explanation: El manual indica que los niños menores de 13 años deben viajar abrochados
    en el asiento trasero en un asiento de seguridad para niños o con un cinturón
    de seguridad.
- id: 173
  category: vehicle_information
  question: ¿Qué debe esperar que suceda cuando se activa su Sistema de Frenos Antibloqueo
    (ABS)?
  choices:
    A: El volante se bloqueará en su lugar.
    B: El pedal del freno vibrará bajo su pie.
    C: El vehículo se detendrá por completo inmediatamente.
    D: El pedal del freno caerá hasta el piso.
  answer: B
  explanation: Cuando el ABS se activa, es posible que escuche un ruido sordo proveniente
    de los frenos y el pedal del freno vibrará bajo su pie mientras bombea los frenos
    para evitar que se bloqueen.
- id: 174
  category: safe_driving_rules
  question: ¿Cuál es la ley de Maryland con respecto al uso de auriculares, audífonos
    y tapones para los oídos mientras se conduce?
  choices:
    A: No puede conducir con ellos puestos en ambos oídos.
    B: Puede usarlos si está escuchando un dispositivo GPS.
    C: Solo están permitidos en las autopistas.
    D: Puede usarlos siempre que el volumen esté bajo.
  answer: A
  explanation: No puede conducir con tapones para los oídos, auriculares o audífonos
    en ambos oídos. Se permiten los dispositivos de asistencia auditiva (audífonos
    para sordera).
- id: 175
  category: driver_testing
  question: ¿Qué maniobra de estacionamiento ya no es obligatoria cuando toma su examen
    de manejo de Maryland?
  choices:
    A: Estacionamiento de frente
    B: Estacionamiento en reversa
    C: Estacionamiento en paralelo
    D: Vuelta de dos puntos en reversa
  answer: C
  explanation: El estacionamiento en paralelo ya no es obligatorio cuando toma su
    examen de manejo, aunque las mismas habilidades se evalúan en una vuelta de dos
    puntos en reversa.
- id: 176
  category: driver_testing
  question: Durante el examen de manejo, ¿en un espacio de qué tamaño se realizan
    las maniobras de estacionamiento de frente y en reversa?
  choices:
    A: 8' por 15'
    B: 10' por 20'
    C: 12' por 24'
    D: 16' por 20'
  answer: B
  explanation: El estacionamiento se realiza en un espacio de 10' por 20' durante
    el examen, y la vuelta de tres puntos se realiza en un espacio de 16' por 20'.
- id: 177
  category: sharing_the_road
  question: 'Al andar en bicicleta por la calle, los ciclistas deben:'
  choices:
    A: Circular de frente al tráfico que se aproxima.
    B: Circular por la acera siempre que sea posible.
    C: Circular siempre por el lado derecho en la misma dirección que el tráfico.
    D: Zigzaguear entre carriles para evitar vehículos lentos.
  answer: C
  explanation: Los ciclistas deben circular en la misma dirección que el tráfico,
    lo que significa que siempre deben circular por el lado derecho.
- id: 178
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por vehículo cada año por conducir sin seguro
    de vehículo?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: D
  explanation: Si no mantiene el seguro en todos sus vehículos, será multado con hasta
    $2,500 por vehículo cada año.
- id: 179
  category: sharing_the_road
  question: 'Por ley, se requieren cascos de bicicleta para cualquier persona que
    ande en bicicleta y sea menor de:'
  choices:
    A: 12 años
    B: 14 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: Se requieren cascos para cualquier persona menor de 16 años que ande
    en bicicleta, incluidos los pasajeros que no van conduciendo.
- id: 180
  category: vehicle_information
  question: Por ley, todas las bicicletas deben tener frenos que puedan detener la
    bicicleta en un espacio de 15 pies cuando viajan a qué velocidad sobre pavimento
    seco, nivelado y limpio?
  choices:
    A: 10 millas por hora
    B: 15 millas por hora
    C: 20 millas por hora
    D: 25 millas por hora
  answer: A
  explanation: Las bicicletas deben tener frenos que puedan detener la bicicleta en
    un espacio de 15 pies cuando va a 10 millas por hora sobre pavimento seco, nivelado
    y limpio.
- id: 181
  category: sharing_the_road
  question: Al andar en bicicleta de noche, la ley de Maryland requiere un reflector
    trasero rojo que pueda verse desde al menos ¿qué distancia?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: D
  explanation: La ley del estado de Maryland requiere un faro blanco en la parte delantera
    y un reflector rojo en la parte trasera que deben ser visibles desde al menos
    600 pies de distancia.
- id: 182
  category: vehicle_information
  question: Una bicicleta eléctrica de Clase 1 tiene un motor que proporciona asistencia
    solo cuando el ciclista está pedaleando y deja de proporcionar asistencia cuando
    la bicicleta alcanza ¿qué velocidad?
  choices:
    A: 15 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 28 millas por hora
  answer: B
  explanation: Las bicicletas eléctricas de Clase 1 tienen un motor que proporciona
    asistencia solo cuando el ciclista está pedaleando, y deja de proporcionar asistencia
    cuando la bicicleta alcanza una velocidad de 20 millas por hora.
- id: 183
  category: vehicle_information
  question: ¿Cuál de las siguientes es una característica de un vehículo eléctrico
    de baja velocidad?
  choices:
    A: Está diseñado para transportar hasta dos personas.
    B: Pesa más de 150 libras.
    C: Tiene una plataforma sobre la que el conductor se pone de pie.
    D: Puede operar a velocidades de hasta 35 millas por hora.
  answer: C
  explanation: Los vehículos eléctricos de baja velocidad tienen manubrios y una plataforma
    sobre la que el conductor se pone de pie. Están diseñados para transportar solo
    al operador, pesan menos de 100 libras y operan a velocidades de hasta 20 mph.
- id: 184
  category: safe_driving_rules
  question: ¿Cómo debe colocar una mujer embarazada la parte del regazo de su cinturón
    de seguridad?
  choices:
    A: Sobre la parte redondeada del vientre.
    B: Debajo del abdomen, lo más bajo posible sobre las caderas y cruzando la parte
      superior de los muslos.
    C: Holgadamente cruzando el medio del estómago.
    D: Las mujeres embarazadas están exentas de usar la parte del regazo del cinturón.
  answer: B
  explanation: Las mujeres embarazadas deben colocar la parte del regazo del cinturón
    de seguridad debajo del abdomen, lo más bajo posible sobre las caderas y cruzando
    la parte superior de los muslos.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal roja octagonal de ALTO (STOP) significa que debe detenerse
    por completo en la línea de alto, el cruce peatonal o antes de ingresar a la intersección.
    Verifique si hay tráfico y peatones antes de continuar.
  id: 185
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 186
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre a esta vía
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe ingresar a la calle o rampa donde está colocada esta señal. Por lo general,
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde ingresar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 187
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que viaja en contra del tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 188
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: El tráfico fluye en una sola dirección — hacia la izquierda
    C: Manténgase a la izquierda de la mediana
    D: Salida de autopista a la izquierda
  answer: B
  explanation: Una señal blanca y negra de UN SOLO SENTIDO (ONE WAY) con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección — la dirección
    a la que apunta la flecha.
  id: 189
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en esta ubicación.
  id: 190
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 191
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 192
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde se prohíbe rebasar.
  id: 193
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye a hacer esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un separador u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
  id: 194
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 195
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta área
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 196
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminar cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con la figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que cruzan la carretera.
  id: 197
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal de color amarillo verdoso fluorescente en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 198
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 199
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 200
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Se requiere girar a la derecha
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    sobre una curva en el camino más adelante. Reduzca la velocidad antes de entrar
    a la curva.
  id: 201
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar solo a la derecha
    D: Solo se usa en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 202
