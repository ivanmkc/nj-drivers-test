questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar un permiso de aprendizaje
    en Puerto Rico?
  choices:
    A: 15 años
    B: 16 años
    C: 17 años
    D: 18 años
  answer: B
  explanation: Según la Ley 22-2000 de Puerto Rico (Ley de Vehículos y Tránsito),
    la edad mínima para obtener un permiso de aprendizaje es de 16 años, siempre que
    el solicitante cuente con el consentimiento de sus padres o tutor legal.
- id: 2
  category: license_system
  question: Una persona con un permiso de aprendizaje en Puerto Rico debe estar acompañada
    por un conductor con licencia que tenga al menos ¿qué edad?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: B
  explanation: La Ley 22 exige que una persona con un permiso de aprendizaje debe
    estar acompañada por un conductor que tenga al menos 21 años de edad y posea una
    licencia de conducir válida.
- id: 3
  category: license_system
  question: En Puerto Rico, ¿cuántos puntos acumulados en el historial de conducir
    dentro de un periodo de dos años resultarán en una suspensión obligatoria de la
    licencia?
  choices:
    A: 12 puntos
    B: 15 puntos
    C: 20 puntos
    D: 25 puntos
  answer: D
  explanation: Bajo el sistema de puntos de Puerto Rico, si un conductor acumula 25
    puntos o más en un periodo de dos años, su privilegio de conducir será suspendido.
- id: 4
  category: license_system
  question: ¿Por cuántos años es válida una licencia de conducir estándar en Puerto
    Rico antes de que deba ser renovada?
  choices:
    A: 4 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: C
  explanation: Las licencias de conducir de Puerto Rico son generalmente válidas por
    un periodo de 8 años a partir de la fecha de expedición.
- id: 5
  category: license_system
  question: ¿Cuál es el límite legal máximo de concentración de alcohol en la sangre
    (BAC) para un conductor menor de 21 años en Puerto Rico?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Puerto Rico tiene una política de tolerancia cero para menores; el
    límite legal de BAC para conductores menores de 21 años es de 0.02%.
- id: 6
  category: license_system
  question: Si cambia su dirección residencial, ¿cuántos días tiene para notificar
    al Departamento de Transportación y Obras Públicas (DTOP)?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: La Ley 22-2000 estipula que cualquier persona que posea una licencia
    de conducir debe notificar al DTOP sobre un cambio de dirección dentro de los
    10 días posteriores al cambio.
- id: 7
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de aprendizaje en Puerto Rico?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Un permiso de aprendizaje (Certificado de Licencia de Aprendizaje)
    es válido por un periodo máximo de dos años.
- id: 8
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para obtener una licencia de conducir
    por primera vez en Puerto Rico?
  choices:
    A: Un diploma de escuela superior
    B: Un certificado médico emitido por un médico licenciado
    C: Prueba de propiedad del vehículo
    D: Una carta de recomendación
  answer: B
  explanation: Para solicitar una licencia, Puerto Rico requiere un certificado médico
    (Certificado Médico) para asegurar que el solicitante esté físicamente apto para
    conducir.
- id: 9
  category: license_system
  question: ¿Entre qué horas tiene prohibido conducir una persona con un permiso de
    aprendizaje en Puerto Rico?
  choices:
    A: 9:00 PM a 6:00 AM
    B: 10:00 PM a 5:00 AM
    C: 11:00 PM a 4:00 AM
    D: 12:00 AM a 6:00 AM
  answer: B
  explanation: Los conductores con un permiso de aprendizaje tienen restringido conducir
    entre las 10:00 PM y las 5:00 AM.
- id: 10
  category: license_system
  question: ¿Cuál es la multa por no usar el cinturón de seguridad en Puerto Rico
    para el conductor o cualquier pasajero?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: La multa por no usar el cinturón de seguridad en Puerto Rico es de
    $100 por cada persona que no esté debidamente sujeta.
- id: 11
  category: license_system
  question: ¿Para qué se utiliza la categoría de licencia de 'Chofer' en Puerto Rico?
  choices:
    A: Solo para conducir motocicletas
    B: Para conducir camiones pesados de más de 10 toneladas
    C: Para conducir vehículos privados y vehículos comerciales que no excedan las
      10,000 libras
    D: Solo para conducir autobuses escolares
  answer: C
  explanation: La licencia de 'Chofer' es un nivel superior a la licencia estándar
    de 'Conductor', permitiendo la operación de vehículos de motor con un peso bruto
    vehicular (GVW) de hasta 10,000 libras, incluyendo aquellos utilizados para fines
    comerciales.
- id: 12
  category: license_system
  question: ¿Cuál es el límite legal de alcohol en la sangre (BAC) para un conductor
    de un vehículo comercial (vehículo de motor pesado) en Puerto Rico?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: Para los conductores de vehículos comerciales o pesados, el límite
    legal de alcohol en la sangre (BAC) es más estricto que para los conductores privados,
    estableciéndose en 0.02%.
- id: 13
  category: license_system
  question: ¿Cuánto tiempo debe una persona poseer un permiso de aprendizaje antes
    de poder tomar el examen práctico (de conducir) en Puerto Rico?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 6 meses
  answer: B
  explanation: Un solicitante debe esperar al menos 30 días después de obtener su
    permiso de aprendizaje antes de ser elegible para tomar el examen práctico de
    conducir.
- id: 14
  category: license_system
  question: Si una licencia de conducir se pierde o es robada, ¿qué se requiere para
    obtener un duplicado en Puerto Rico?
  choices:
    A: Una declaración verbal al empleado del DTOP
    B: Una declaración jurada (affidavit) ante un Notario Público
    C: Solo una carta del departamento de policía
    D: Un nuevo certificado médico
  answer: B
  explanation: Para obtener un duplicado de la licencia por pérdida o robo, el solicitante
    debe presentar una declaración jurada (affidavit) explicando las circunstancias
    de la pérdida.
- id: 15
  category: license_system
  question: ¿Qué documento es obligatorio llevar en el vehículo en todo momento en
    Puerto Rico?
  choices:
    A: El título del vehículo
    B: La licencia del vehículo (registro)
    C: La factura de compra del vehículo
    D: Una copia del certificado de nacimiento del conductor
  answer: B
  explanation: La Ley 22 exige que la licencia del vehículo original se mantenga dentro
    del vehículo o sea portada por el conductor en todo momento mientras opera el
    vehículo.
- id: 16
  category: license_system
  question: Si renueva su licencia de conducir de Puerto Rico más de 30 días después
    de que haya expirado, ¿cuál es el cargo de penalidad adicional que debe pagar?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: De acuerdo con el Artículo 3.14 de la Ley 22 (Ley de Vehículos y Tránsito),
    se impone una penalidad de $20 si la licencia se renueva más de 30 días después
    de su fecha de expiración.
- id: 17
  category: license_system
  question: En Puerto Rico, ¿cuántos puntos se asignan a su historial de conducir
    por la infracción de 'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: C
  explanation: Bajo el reglamento del sistema de puntos de Puerto Rico, la conducción
    temeraria se considera una infracción grave y conlleva una penalidad de 6 puntos.
- id: 18
  category: license_system
  question: ¿Cuántos días antes de su fecha de expiración se le permite comenzar el
    proceso de renovación de su licencia de conducir de Puerto Rico?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: El DTOP (Departamento de Transportación y Obras Públicas) permite a
    los conductores iniciar el proceso de renovación de la licencia hasta 60 días
    antes de la fecha de expiración.
- id: 19
  category: license_system
  question: ¿Qué agencia gubernamental en Puerto Rico puede solicitar la suspensión
    de una licencia de conducir por incumplimiento del pago de la pensión alimentaria?
  choices:
    A: Hacienda
    B: ASUME
    C: AEE
    D: AAA
  answer: B
  explanation: ASUME (Administración para el Sustento de Menores) tiene la autoridad
    legal para solicitar la suspensión de una licencia de conducir si la persona tiene
    deudas atrasadas en los pagos de pensión alimentaria.
- id: 20
  category: license_system
  question: ¿Cuál es el requisito mínimo de agudeza visual (con o sin lentes correctores)
    para obtener una licencia de conducir estándar en Puerto Rico?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Para calificar para una licencia de conducir en Puerto Rico, el solicitante
    debe tener una agudeza visual de al menos 20/40.
- id: 21
  category: license_system
  question: En Puerto Rico, ¿para qué tipo de vehículo se requiere específicamente
    una licencia de conducir de 'Categoría 4'?
  choices:
    A: Motocicletas
    B: Vehículos de pasajeros privados
    C: Vehículos pesados de motor (Camiones pesados)
    D: Solo vehículos de emergencia
  answer: C
  explanation: La Ley 22 clasifica las licencias por categorías; la Categoría 4 está
    designada para conductores de vehículos pesados de motor.
- id: 22
  category: license_system
  question: Si usted es veterano, ¿qué debe presentar al DTOP para que se imprima
    la palabra 'Veterano' en su licencia de conducir de Puerto Rico?
  choices:
    A: Una carta de su alcalde local
    B: El Formulario DD-214 (Documentos de licenciamiento/baja)
    C: Un pasaporte estadounidense válido
    D: Una tarjeta de registro electoral
  answer: B
  explanation: Para recibir la designación de veterano en una licencia de Puerto Rico,
    el solicitante debe proporcionar el formulario DD-214 que acredite el licenciamiento
    honorable.
- id: 23
  category: license_system
  question: Bajo la Ley 22, ¿cuál es el estatus legal de la licencia en la aplicación
    móvil 'CESCO Digital' en Puerto Rico?
  choices:
    A: Es solo para ver multas y no puede usarse como identificación
    B: Es un sustituto legal válido de la licencia física
    C: Solo es válida para conductores mayores de 65 años
    D: Solo es válida si también lleva una copia en papel
  answer: B
  explanation: La Ley 144-2019 autorizó que la licencia digital a través de la aplicación
    CESCO Digital sea tan legalmente válida como la licencia física de plástico para
    todos los propósitos en Puerto Rico.
- id: 24
  category: license_system
  question: ¿Cuál es el código de endoso requerido en una licencia de conducir de
    Puerto Rico para operar legalmente una motocicleta?
  choices:
    A: Categoría M
    B: Categoría 1
    C: Categoría 5
    D: Categoría A
  answer: A
  explanation: Para operar una motocicleta en Puerto Rico, un conductor debe tener
    el endoso o categoría 'M' (Motocicleta) en su licencia.
- id: 25
  category: license_system
  question: Al solicitar una licencia que cumpla con REAL ID en Puerto Rico, ¿cuál
    de estos es un documento obligatorio para probar la identidad del Seguro Social?
  choices:
    A: Una fotocopia de la tarjeta de Seguro Social
    B: La tarjeta de Seguro Social original o un formulario W-2
    C: Una declaración verbal del número
    D: Un estado de cuenta de una tarjeta de crédito
  answer: B
  explanation: Para el cumplimiento de REAL ID en Puerto Rico, los solicitantes deben
    presentar documentos originales como la tarjeta de Seguro Social, un W-2 o un
    formulario SSA-1099.
- id: 26
  category: license_system
  question: Si un conductor es sorprendido conduciendo con una licencia suspendida
    o revocada, ¿cuál es la multa mínima por una primera infracción en Puerto Rico?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: Conducir con una licencia suspendida o revocada es una violación grave
    en Puerto Rico, que conlleva una multa mínima de $300 por la primera infracción.
- id: 27
  category: license_system
  question: En Puerto Rico, ¿cuánto tiempo tiene un turista de un estado de EE. UU.
    para usar su licencia de fuera del estado antes de que deba solicitar una licencia
    local?
  choices:
    A: 30 días
    B: 90 días
    C: 120 días
    D: 180 días
  answer: C
  explanation: Bajo la Ley 22, una persona con una licencia válida de una jurisdicción
    de EE. UU. se considera 'transeúnte' y puede conducir en Puerto Rico hasta por
    120 días.
- id: 28
  category: license_system
  question: ¿Qué sucede si un conductor no paga una multa de tránsito dentro de los
    30 días posteriores a la citación en Puerto Rico?
  choices:
    A: La multa se cancela automáticamente
    B: El conductor es arrestado inmediatamente
    C: Se añade un recargo/interés al monto de la multa
    D: El vehículo es confiscado
  answer: C
  explanation: Si las multas de tránsito no se pagan dentro de los 30 días, se aplican
    intereses y recargos al monto original del boleto.
- id: 29
  category: license_system
  question: Para una licencia de 'Categoría 8' (Vehículo Pesado de Motor - Arrastre),
    ¿cuál es el requisito de edad mínima en Puerto Rico?
  choices:
    A: 18 años
    B: 19 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: Para obtener una licencia de Categoría 8 para vehículos de motor pesados
    de tipo arrastre (remolque), el solicitante debe tener al menos 21 años de edad.
- id: 30
  category: driver_testing
  question: En Puerto Rico, ¿cuál es el límite de velocidad máximo en una zona escolar
    urbana?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: De acuerdo con la Ley de Vehículos y Tránsito de Puerto Rico (Ley 22),
    el límite de velocidad en una zona escolar urbana es de 15 mph.
- id: 31
  category: driver_testing
  question: ¿Según la ley de Puerto Rico, cuál es el porcentaje mínimo de transmisión
    de luz requerido para el tinte de los cristales en el parabrisas y las ventanas
    laterales delanteras?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: La Ley 22, Artículo 10.05, especifica que los tintes de las ventanas
    deben permitir al menos el 35% de transmisión de luz.
- id: 32
  category: driver_testing
  question: ¿Cuál es la multa por estacionar un vehículo en un espacio designado para
    personas con discapacidades sin un permiso válido en Puerto Rico?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Estacionarse en un lugar reservado para personas con discapacidades
    sin el permiso adecuado conlleva una multa de $250.
- id: 33
  category: driver_testing
  question: En Puerto Rico, ¿cuál es la multa por utilizar un teléfono móvil de forma
    manual mientras se conduce?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: B
  explanation: La multa por utilizar un teléfono móvil de forma manual mientras se
    opera un vehículo de motor es de $100.
- id: 34
  category: driver_testing
  question: ¿Cuántos puntos se asignan al récord de un conductor por rebasar ilegalmente
    un autobús escolar que está detenido para recoger o dejar estudiantes?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Rebasar ilegalmente un autobús escolar resulta en la adición de 4 puntos
    al récord del conductor.
- id: 35
  category: driver_testing
  question: ¿Cuál es el límite de velocidad máximo en una zona rural en Puerto Rico,
    a menos que se indique lo contrario?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: En zonas rurales, el límite de velocidad predeterminado es de 45 mph,
    a menos que las señales indiquen un límite diferente.
- id: 36
  category: driver_testing
  question: Si lo sorprenden por exceso de velocidad en Puerto Rico, la multa es de
    $100 más una cantidad adicional por cada milla por hora sobre el límite. ¿Cuál
    es esa cantidad adicional?
  choices:
    A: $5 por milla
    B: $10 por milla
    C: $20 por milla
    D: $50 por milla
  answer: B
  explanation: La multa básica por exceso de velocidad es de $100, más $10 por cada
    milla por hora en exceso del límite de velocidad.
- id: 37
  category: driver_testing
  question: ¿Cuál es la multa estándar por una primera condena de DUI (conducir bajo
    la influencia) en Puerto Rico?
  choices:
    A: $100 a $300
    B: $300 a $500
    C: $500 a $750
    D: $1,000 a $2,000
  answer: B
  explanation: Una primera ofensa de DUI conlleva una multa que oscila entre $300
    y $500, más cargos adicionales para el fondo de trauma y la asistencia obligatoria
    a un programa de educación sobre el alcohol.
- id: 38
  category: driver_testing
  question: En Puerto Rico, ¿es ilegal estacionar un vehículo a menos de cuántos metros
    de un hidrante de incendios?
  choices:
    A: 2 metros
    B: 5 metros
    C: 10 metros
    D: 15 metros
  answer: B
  explanation: La Ley 22 prohíbe estacionarse a menos de 5 metros (aproximadamente
    16 pies) de un hidrante de incendios.
- id: 39
  category: driver_testing
  question: ¿Cuál es el límite de velocidad máximo permitido en las autopistas en
    Puerto Rico?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 75 mph
  answer: C
  explanation: El límite de velocidad máximo en las autopistas de Puerto Rico es de
    65 mph.
- id: 40
  category: driver_testing
  question: ¿Cuántos puntos se añaden a su récord de conducir por no detenerse ante
    una luz roja?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: No detenerse ante una luz roja resulta en la adición de 3 puntos al
    récord del conductor.
- id: 41
  category: driver_testing
  question: Al solicitar una licencia de conducir en Puerto Rico, ¿dentro de cuántos
    días previos a la solicitud debe haber sido emitido el certificado médico requerido?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: El certificado médico requerido para la solicitud de la licencia tiene
    una validez de 30 días a partir de la fecha del examen físico.
- id: 42
  category: driver_testing
  question: ¿Cuál es la multa mínima por tirar basura o desperdicios desde un vehículo
    hacia una vía pública en Puerto Rico?
  choices:
    A: $50
    B: $110
    C: $250
    D: $500
  answer: B
  explanation: Bajo la Ley 22, la multa por tirar basura desde un vehículo comienza
    en $110.
- id: 43
  category: driver_testing
  question: En Puerto Rico, ¿con cuántos pies de antelación debe indicar su intención
    de doblar antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Se requiere que los conductores den una señal continua durante al menos
    100 pies antes de doblar.
- id: 44
  category: driver_testing
  question: Según la ley de Puerto Rico, ¿entre qué horas se le permite a un conductor
    tratar una luz roja como una señal de 'Pare' (detenerse y luego continuar si el
    camino está despejado)?
  choices:
    A: 10:00 PM a 4:00 AM
    B: 11:00 PM a 5:00 AM
    C: 12:00 AM a 5:00 AM
    D: Esto nunca está permitido en Puerto Rico
  answer: C
  explanation: La Ley 22 permite a los conductores pasar una luz roja después de detenerse
    y asegurarse de que es seguro entre las 12:00 AM y las 5:00 AM.
- id: 45
  category: driver_testing
  question: En Puerto Rico, ¿cuál es la distancia mínima a la que debe estacionarse
    un vehículo de un hidrante de incendios?
  choices:
    A: 5 pies (1.5 metros)
    B: 10 pies (3 metros)
    C: 16 pies (5 metros)
    D: 20 pies (6 metros)
  answer: C
  explanation: La ley de tránsito de Puerto Rico exige que los vehículos se estacionen
    a una distancia mínima de 5 metros (aproximadamente 16 pies) de un hidrante de
    incendios.
- id: 46
  category: driver_testing
  question: Al estacionar un vehículo paralelo a la acera en Puerto Rico, ¿cuál es
    la distancia máxima permitida entre los neumáticos y la acera?
  choices:
    A: 6 pulgadas (15 cm)
    B: 12 pulgadas (30 cm)
    C: 18 pulgadas (45 cm)
    D: 24 pulgadas (60 cm)
  answer: B
  explanation: Los conductores deben estacionar paralelos a la acera y a no más de
    12 pulgadas (30 centímetros) de distancia de la misma.
- id: 47
  category: driver_testing
  question: Según la Ley 22, ¿los niños de qué edad o menores deben estar asegurados
    en un sistema de retención infantil (asiento protector) aprobado federalmente
    en Puerto Rico?
  choices:
    A: Menores de 4 años
    B: Menores de 6 años
    C: Menores de 8 años
    D: Menores de 10 años
  answer: A
  explanation: En Puerto Rico, los niños menores de 4 años deben usar un sistema de
    retención infantil. Los niños entre 4 y 9 años deben usar un asiento elevado (booster
    seat).
- id: 48
  category: driver_testing
  question: En Puerto Rico, el 'Marbete' (sello de registro del vehículo) debe renovarse
    anualmente. ¿Cuándo vence?
  choices:
    A: En el cumpleaños del propietario
    B: El 31 de diciembre de cada año
    C: Al final del mes en que el vehículo fue registrado originalmente
    D: Exactamente un año después de la fecha de compra
  answer: C
  explanation: El Marbete vence el último día del mes en que el vehículo fue registrado
    originalmente en el sistema de Puerto Rico.
- id: 49
  category: driver_testing
  question: ¿Cuál es la multa por rebasar un autobús escolar mientras está detenido
    para recoger o dejar niños en Puerto Rico?
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: C
  explanation: Rebasar ilegalmente un autobús escolar que está cargando o descargando
    niños resulta en una multa de $300 en Puerto Rico.
- id: 50
  category: driver_responsibility
  question: En Puerto Rico, ¿cuál es la cobertura máxima por daños a la propiedad
    que ofrece el Seguro de Responsabilidad Obligatorio (SRO)?
  choices:
    A: $3,000
    B: $4,000
    C: $5,000
    D: $10,000
  answer: B
  explanation: De acuerdo con la Ley 253-1995 (Seguro de Responsabilidad Obligatorio),
    el SRO cubre hasta $4,000 por daños causados a vehículos o propiedad de terceros
    en un solo accidente.
- id: 51
  category: driver_responsibility
  question: Según la Ley 22 de Puerto Rico, si usted está involucrado en un accidente
    de tránsito donde los daños a la propiedad exceden ¿qué cantidad?, ¿debe informarlo
    a la Policía?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: La Ley 22 de Puerto Rico (Ley de Vehículos y Tránsito) requiere que
    cualquier accidente que resulte en lesiones, muerte o daños a la propiedad que
    excedan los $500 debe ser informado a la Policía de inmediato.
- id: 52
  category: driver_responsibility
  question: ¿Cuál es la multa por conducir un vehículo de motor en las vías públicas
    de Puerto Rico con un sello de registro (marbete) vencido?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: El Artículo 10.05 de la Ley 22 establece una multa de $500 por operar
    un vehículo con un sello de registro (marbete) vencido.
- id: 53
  category: driver_responsibility
  question: Al vender un vehículo en Puerto Rico, ¿dentro de cuántos días debe el
    vendedor notificar al DTOP sobre la transferencia de propiedad?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: El vendedor de un vehículo es responsable de notificar al Departamento
    de Transportación y Obras Públicas (DTOP) dentro de los 10 días posteriores a
    la venta para asegurar que el registro se actualice y no se le considere responsable
    de futuras multas.
- id: 54
  category: driver_responsibility
  question: ¿A cuánto asciende la prima anual estándar del Seguro de Responsabilidad
    Obligatorio (SRO) para un vehículo de pasajeros privado en Puerto Rico?
  choices:
    A: $65
    B: $99
    C: $148
    D: $200
  answer: B
  explanation: La prima estándar actual del Seguro de Responsabilidad Obligatorio
    (SRO) para vehículos de pasajeros privados es de $99, la cual se paga al momento
    de renovar el sello de registro anual (marbete).
- id: 55
  category: driver_responsibility
  question: Bajo la ley de 'Consentimiento Implícito' en Puerto Rico, ¿qué sucede
    si un conductor se niega a someterse a una prueba química de alcohol o drogas?
  choices:
    A: No hay sanción si es la primera vez
    B: Solo una multa de $100
    C: Suspensión inmediata de la licencia y posible arresto
    D: Se le permite al conductor llamar a un abogado antes de decidir
  answer: C
  explanation: Al conducir en Puerto Rico, usted otorga su 'consentimiento implícito'
    para realizarse pruebas químicas. La negativa resulta en la suspensión inmediata
    de la licencia y el conductor puede ser detenido para que se le administre la
    prueba mediante orden judicial.
- id: 56
  category: driver_responsibility
  question: En caso de un accidente leve sin heridos donde los vehículos obstruyen
    el tránsito, ¿qué exige la ley de Puerto Rico?
  choices:
    A: Dejar los vehículos exactamente donde están hasta que llegue la policía
    B: Mover los vehículos al paseo o a un área segura para restablecer el flujo del
      tránsito
    C: Esperar a que lleguen los ajustadores de seguros antes de moverlos
    D: Solo la policía está autorizada a mover los vehículos
  answer: B
  explanation: La Ley 22 exige que los conductores muevan los vehículos si están obstruyendo
    el tránsito y no hay lesiones graves. No hacerlo puede resultar en una multa.
- id: 57
  category: driver_responsibility
  question: Si el propietario de un vehículo en Puerto Rico tiene un seguro de responsabilidad
    privado que cumple o excede los requisitos del SRO, ¿qué debe hacer para evitar
    pagar la cuota del SRO?
  choices:
    A: Nada, el SRO es obligatorio para todos independientemente del seguro privado
    B: Presentar prueba de seguro privado al DTOP o al banco durante la renovación
      del registro
    C: Solicitar un reembolso al Departamento de Hacienda después de pagarlo
    D: Solo los vehículos comerciales pueden optar por no participar en el SRO
  answer: B
  explanation: Los propietarios de vehículos con seguro privado pueden optar por no
    participar en el SRO presentando un 'Voucher' válido o comprobante de seguro durante
    el proceso de renovación del registro (marbete).
- id: 58
  category: driver_responsibility
  question: ¿Cuál es la multa por conducir un vehículo en Puerto Rico con una placa
    (tablilla) que esté intencionalmente oscurecida o sea ilegible?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: C
  explanation: La Ley 22 estipula una multa de $100 por conducir con placas que estén
    oscurecidas, alteradas o que no sean claramente visibles.
- id: 59
  category: driver_responsibility
  question: En Puerto Rico, ¿a qué edad debe un vehículo someterse a una inspección
    mecánica obligatoria antes de renovar su registro?
  choices:
    A: Todos los años independientemente de la edad
    B: Después del primer año de fabricación
    C: Después de más de dos años de fabricación
    D: Solo después de cinco años de fabricación
  answer: C
  explanation: Los vehículos en Puerto Rico que tienen más de dos años de fabricación
    deben aprobar una inspección mecánica en un centro autorizado antes de que se
    pueda renovar el registro anual (marbete).
- id: 60
  category: driver_responsibility
  question: ¿Cuál es la multa por no notificar al DTOP un cambio de dirección residencial
    dentro del plazo legalmente requerido?
  choices:
    A: $30
    B: $50
    C: $100
    D: $200
  answer: A
  explanation: No notificar al DTOP un cambio de dirección dentro de los 30 días resulta
    en una multa administrativa de $30.
- id: 61
  category: driver_responsibility
  question: ¿Cuántos días tiene un conductor para presentar una reclamación al Seguro
    de Responsabilidad Obligatorio (SRO) después de un accidente?
  choices:
    A: 24 horas
    B: 5 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Para beneficiarse del Seguro de Responsabilidad Obligatorio (SRO),
    el accidente debe ser reportado a la aseguradora dentro de los 5 días siguientes
    al suceso.
- id: 62
  category: driver_responsibility
  question: En Puerto Rico, ¿quién es financieramente responsable de cualquier daño
    causado a la propiedad pública (como semáforos o postes de luz) durante un accidente?
  choices:
    A: El gobierno cubre todos los daños a la propiedad pública
    B: El conductor que causó el daño
    C: La ACAA (Administración de Compensaciones por Accidentes de Automóviles)
    D: Solo el seguro privado del conductor, de lo contrario no se paga
  answer: B
  explanation: El conductor responsable del accidente es responsable de los daños
    a la propiedad pública. El SRO o el seguro privado pueden cubrir estos costos
    hasta el límite de la póliza, pero el conductor es el responsable final.
- id: 63
  category: driver_responsibility
  question: ¿Qué certificado se requiere para demostrar que el dueño de un vehículo
    no le debe dinero a la Administración de Compensaciones por Accidentes de Automóviles
    (ACAA) antes de renovar el marbete?
  choices:
    A: Certificado de Antecedentes Penales
    B: Certificado de Deuda de ACAA
    C: Certificado de Inspección
    D: No se necesita un certificado específico; se verifica electrónicamente
  answer: D
  explanation: Aunque los propietarios deben estar libres de deudas, el sistema del
    DTOP verifica electrónicamente el estado de "No Deuda" con la ACAA, ASUME y multas
    de tránsito durante el proceso de renovación digital del marbete.
- id: 64
  category: driver_responsibility
  question: Si usted se ve involucrado en un accidente de tránsito en Puerto Rico
    donde ocurren daños a la propiedad y las partes no pueden ponerse de acuerdo,
    ¿a partir de qué valor estimado de daños mínimo se debe notificar a la policía?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Según la Ley 22 de Puerto Rico (Ley de Vehículos y Tránsito), los accidentes
    que involucren daños a la propiedad estimados en $100 o más deben ser reportados
    a la policía si las partes involucradas no llegan a un acuerdo.
- id: 65
  category: driver_responsibility
  question: Cuando se vende un vehículo en Puerto Rico, ¿cuántos días tiene el comprador
    para notificar al DTOP y completar el traspaso del título del vehículo?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: La ley de Puerto Rico exige que el traspaso de propiedad de un vehículo
    de motor se complete dentro de los 10 días siguientes a la venta.
- id: 66
  category: driver_responsibility
  question: ¿Cuál es la función principal de la cuota de la ACAA (Administración de
    Compensaciones por Accidentes de Automóviles) que se paga durante el registro
    del vehículo?
  choices:
    A: Cubrir los daños a la carrocería del vehículo
    B: Proporcionar cobertura médica sin culpa por lesiones sufridas en accidentes
      de tránsito
    C: Pagar los honorarios legales en caso de una demanda
    D: Cubrir el costo de los servicios de grúa
  answer: B
  explanation: La ACAA es un sistema de seguro "sin culpa" (no-fault) en Puerto Rico
    que brinda beneficios médicos y hospitalarios a las víctimas de accidentes de
    tránsito, independientemente de quién haya tenido la culpa.
- id: 67
  category: driver_responsibility
  question: Al renovar el registro de un vehículo (marbete), ¿puede el propietario
    optar por no participar en el Seguro de Responsabilidad Obligatorio (SRO) del
    gobierno?
  choices:
    A: No, es obligatorio para todos sin excepción
    B: Sí, pero solo si el vehículo tiene más de 10 años
    C: Sí, si proporcionan prueba de una póliza de responsabilidad privada con cobertura
      igual o mayor
    D: Sí, si firman una renuncia de responsabilidad financiera
  answer: C
  explanation: Los propietarios de vehículos pueden elegir una póliza de seguro privada
    en lugar del SRO, siempre que la póliza privada cumpla con los requisitos mínimos
    de cobertura exigidos por la ley.
- id: 68
  category: driver_responsibility
  question: Si usted se ve involucrado en un accidente leve sin heridos y los vehículos
    están obstruyendo el tránsito en una carretera principal, ¿qué le exige la ley
    de Puerto Rico que haga?
  choices:
    A: Dejar los vehículos exactamente donde están hasta que llegue la policía
    B: Mover los vehículos al paseo o a un área segura para evitar obstruir el tránsito
    C: Esperar a que llegue un ajustador de seguros antes de moverlos
    D: Abandonar el vehículo y caminar hasta la estación de policía más cercana
  answer: B
  explanation: La Ley 22 exige que los conductores muevan los vehículos involucrados
    en accidentes leves (sin heridos) a un lugar seguro o al paseo para mantener el
    flujo del tránsito y la seguridad.
- id: 69
  category: driver_responsibility
  question: ¿Cuál es la multa por no transportar a un niño menor de 4 años en un asiento
    protector para niños certificado federalmente en Puerto Rico?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: No utilizar un asiento protector adecuado para niños menores de 4 años
    conlleva una multa de $500.
- id: 70
  category: driver_responsibility
  question: ¿Cuál es la multa por una primera infracción al participar en carreras
    clandestinas (regateo) en Puerto Rico?
  choices:
    A: $500
    B: $1,000
    C: $3,000
    D: $5,000
  answer: D
  explanation: Las carreras clandestinas (regateo) son una infracción grave en Puerto
    Rico, que conlleva una multa de $5,000 y una suspensión obligatoria de la licencia
    por 6 meses en la primera infracción.
- id: 71
  category: driver_responsibility
  question: ¿En Puerto Rico, cómo se determina el mes de vencimiento del marbete (sello
    de registro) de un vehículo?
  choices:
    A: Siempre vence en diciembre
    B: Vence en el cumpleaños del dueño
    C: Se basa en el mes en que el vehículo fue registrado originalmente en el sistema
    D: Se basa en el último dígito de la tablilla
  answer: C
  explanation: El vencimiento del registro (marbete) se determina por el mes en que
    el vehículo fue registrado por primera vez en Puerto Rico y permanece igual para
    ese vehículo anualmente.
- id: 72
  category: safe_driving_rules
  question: ¿En Puerto Rico, cuál es el límite de velocidad estándar en una zona urbana
    a menos que se indique lo contrario?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: Según la Ley de Vehículos y Tránsito de Puerto Rico (Ley 22), el límite
    de velocidad en zonas urbanas es de 25 mph, a menos que las señales indiquen lo
    contrario.
- id: 73
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una zona escolar ubicada dentro de
    una zona urbana durante el horario escolar?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: En Puerto Rico, el límite de velocidad en una zona escolar urbana es
    de 15 mph durante las horas especificadas por el Departamento de Transportación.
- id: 74
  category: safe_driving_rules
  question: De acuerdo con la estructura de multas por exceso de velocidad en Puerto
    Rico, ¿cuál es la multa base por exceso de velocidad, más el costo adicional por
    cada milla por hora sobre el límite?
  choices:
    A: $50 base + $5 por milla
    B: $100 base + $5 por milla
    C: $100 base + $10 por milla
    D: $200 base + $20 por milla
  answer: C
  explanation: En Puerto Rico, la multa por exceso de velocidad es de $100 más $10
    por cada milla por hora en exceso del límite de velocidad.
- id: 75
  category: safe_driving_rules
  question: ¿Cuál es la multa específica en Puerto Rico por conducir un vehículo a
    una velocidad de 100 mph o más?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: Bajo la Ley 22 de Puerto Rico, conducir a 100 mph o más se considera
    una violación grave y conlleva una multa fija de $1,000.
- id: 76
  category: safe_driving_rules
  question: Al estacionar un vehículo en una vía pública en Puerto Rico, ¿a cuántos
    pies de distancia debe mantenerse de un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: Es ilegal estacionar un vehículo a menos de 15 pies (aproximadamente
    5 metros) de un hidrante de incendios en Puerto Rico.
- id: 77
  category: safe_driving_rules
  question: ¿En Puerto Rico, entre qué horas se permite pasar una luz roja después
    de detenerse y asegurarse de que es seguro, de manera similar a una señal de pare?
  choices:
    A: 10:00 PM a 4:00 AM
    B: 11:00 PM a 5:00 AM
    C: 12:00 AM a 5:00 AM
    D: 1:00 AM a 6:00 AM
  answer: C
  explanation: Entre las 12:00 AM y las 5:00 AM, los conductores en Puerto Rico pueden
    tratar una luz roja como una señal de pare, continuando solo después de detenerse
    por completo y asegurarse de que no se aproximen otros vehículos o peatones.
- id: 78
  category: safe_driving_rules
  question: ¿Cuál es la multa por estacionarse en una línea amarilla en Puerto Rico?
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: C
  explanation: Estacionarse en una línea amarilla es una violación de las leyes de
    tránsito en Puerto Rico y resulta en una multa de $50.
- id: 79
  category: safe_driving_rules
  question: ¿En Puerto Rico, los niños entre las edades de 4 y 9 años deben usar un
    asiento elevado (booster seat) a menos que alcancen qué estatura?
  choices:
    A: 4 pies 5 pulgadas
    B: 4 pies 9 pulgadas
    C: 5 pies
    D: 5 pies 2 pulgadas
  answer: B
  explanation: Los niños de 4 a 9 años deben usar un asiento elevado a menos que midan
    al menos 4 pies y 9 pulgadas de estatura.
- id: 80
  category: safe_driving_rules
  question: Al acercarse a un vehículo de motor pesado (camión) o autobús desde la
    dirección opuesta, ¿a cuántos pies de distancia debe bajar las luces largas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Los conductores deben cambiar de luces largas a luces cortas cuando
    un vehículo que viene en dirección contraria está a menos de 500 pies para evitar
    cegar al otro conductor.
- id: 81
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe activar la señal de giro antes de realizar
    un viraje en Puerto Rico?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 150 pies
  answer: C
  explanation: Los conductores deben indicar su intención de virar al menos 100 pies
    antes de llegar a la intersección o al punto de viraje.
- id: 82
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una zona escolar en Puerto Rico durante
    las horas en que los estudiantes están llegando o saliendo?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad en zonas escolares es de 15 mph, según lo establecido
    por los reglamentos de tránsito de Puerto Rico.
- id: 83
  category: safe_driving_rules
  question: ¿A qué distancia debe estacionarse de un hidrante (bomba de incendio)
    en Puerto Rico?
  choices:
    A: 2 metros (aprox. 6 pies)
    B: 3 metros (aprox. 10 pies)
    C: 5 metros (aprox. 16 pies)
    D: 10 metros (aprox. 32 pies)
  answer: C
  explanation: La Ley 22 prohíbe estacionarse a menos de 5 metros (aproximadamente
    16 pies) de un hidrante de incendios.
- id: 84
  category: safe_driving_rules
  question: Al estacionarse paralelamente a un bordillo (acera) en Puerto Rico, ¿a
    qué distancia máxima en pulgadas debe estar el vehículo de la acera/bordillo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Los vehículos deben estacionarse paralelamente al bordillo y a no más
    de 12 pulgadas (aproximadamente 30 cm) de distancia de este.
- id: 85
  category: safe_driving_rules
  question: En Puerto Rico, ¿cuál es la multa por conducir ilegalmente por el paseo
    de la carretera?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Conducir por el paseo para evitar el tráfico es una infracción que
    conlleva una multa de $250.
- id: 86
  category: safe_driving_rules
  question: ¿Bajo qué condición se permite un viraje a la derecha con luz roja en
    Puerto Rico?
  choices:
    A: Nunca está permitido.
    B: Solo entre las 12:00 AM y las 5:00 AM.
    C: Después de hacer una parada completa y ceder el paso a peatones y tráfico,
      a menos que una señal lo prohíba.
    D: Solo si no hay otros autos en la intersección.
  answer: C
  explanation: Los virajes a la derecha en rojo están permitidos después de una parada
    completa y de ceder el paso, siempre que no haya señales que indiquen 'No virar
    en rojo'.
- id: 87
  category: safe_driving_rules
  question: Cuando un vehículo de emergencia (ambulancia, policía, bomberos) se aproxima
    con sirenas y luces, ¿qué debe hacer un conductor en Puerto Rico?
  choices:
    A: Acelerar para mantenerse delante del vehículo.
    B: Detenerse inmediatamente en el carril en el que se encuentra.
    C: Moverse hacia la derecha lo más posible y detenerse.
    D: Moverse hacia el paseo izquierdo y detenerse.
  answer: C
  explanation: Los conductores deben ceder el paso moviéndose hacia el borde derecho
    de la carretera y deteniéndose hasta que el vehículo de emergencia haya pasado.
- id: 88
  category: safe_driving_rules
  question: En Puerto Rico, ¿cuántos metros debe mantener como distancia mínima al
    estacionarse de la entrada de una estación de bomberos?
  choices:
    A: 3 metros
    B: 6 metros
    C: 10 metros
    D: 15 metros
  answer: B
  explanation: El estacionamiento está prohibido a menos de 6 metros (aproximadamente
    20 pies) de la entrada de una estación de bomberos.
- id: 89
  category: safe_driving_rules
  question: ¿Qué sucede con las multas de tránsito incurridas en una zona de construcción
    o mantenimiento de carreteras donde hay trabajadores presentes en Puerto Rico?
  choices:
    A: Se exoneran para quienes cometen la infracción por primera vez.
    B: Se reducen a la mitad.
    C: Se duplican.
    D: Se mantienen iguales a las multas estándar.
  answer: C
  explanation: Según la ley de Puerto Rico, las multas por infracciones de tránsito
    cometidas en zonas de trabajo mientras hay trabajadores presentes se duplican.
- id: 90
  category: safe_driving_rules
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección sin señales
    ni semáforos, ¿qué conductor tiene el derecho de paso en Puerto Rico?
  choices:
    A: El conductor de la izquierda.
    B: El conductor de la derecha.
    C: El conductor que viaja a mayor velocidad.
    D: El conductor del vehículo más grande.
  answer: B
  explanation: En intersecciones sin señales ni semáforos, el conductor del vehículo
    de la izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 91
  category: defensive_driving
  question: De acuerdo con la Ley de Vehículos y Tránsito de Puerto Rico, ¿a qué distancia
    debe atenuar las luces largas (intensas) cuando se aproxima un vehículo en dirección
    contraria?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: En Puerto Rico, los conductores deben cambiar de luces largas a luces
    cortas cuando un vehículo que se aproxima en dirección contraria esté a menos
    de 500 pies para evitar cegar al otro conductor.
- id: 92
  category: defensive_driving
  question: En Puerto Rico, al seguir a otro vehículo por detrás durante la noche,
    ¿a qué distancia debe cambiar a luces cortas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Bajo las leyes de tránsito de Puerto Rico, debe atenuar sus luces largas
    cuando siga a otro vehículo a una distancia de 200 pies o menos.
- id: 93
  category: defensive_driving
  question: ¿Cuál es la multa básica por exceder el límite de velocidad en una zona
    escolar en Puerto Rico?
  choices:
    A: $50 más $5 por cada milla adicional
    B: $100 más $10 por cada milla adicional
    C: $200 más $10 por cada milla adicional
    D: $250 más $20 por cada milla adicional
  answer: C
  explanation: El exceso de velocidad en una zona escolar en Puerto Rico conlleva
    una penalidad mayor de $200 como multa base, más $10 por cada milla por hora sobre
    el límite.
- id: 94
  category: defensive_driving
  question: Al conducir bajo lluvia intensa o niebla en Puerto Rico, ¿qué luces debe
    utilizar para mantener la mejor visibilidad y seguridad?
  choices:
    A: Luces largas (intensas)
    B: Luces cortas (bajas)
    C: Solo las luces de estacionamiento
    D: No se requieren luces durante el día
  answer: B
  explanation: Las luces cortas deben usarse en condiciones de lluvia o niebla. Las
    luces largas se reflejan en las gotas de agua o la niebla, creando un resplandor
    que reduce la visibilidad del conductor.
- id: 95
  category: defensive_driving
  question: En Puerto Rico, ¿cuál es la regla de "distancia de seguimiento" recomendada
    entre su auto y el vehículo delante de usted bajo condiciones normales?
  choices:
    A: La regla de la longitud de un auto
    B: La regla de los dos segundos
    C: La regla de los cinco segundos
    D: 10 pies por cada 10 mph
  answer: B
  explanation: El manual del conductor de Puerto Rico recomienda la "regla de los
    dos segundos" como una distancia de seguimiento segura bajo condiciones normales
    de manejo para permitir suficiente tiempo de reacción ante peligros.
- id: 96
  category: defensive_driving
  question: Si su vehículo comienza a hidroplanear en una carretera mojada en Puerto
    Rico, ¿cuál es la respuesta correcta de conducción defensiva?
  choices:
    A: Frenar a fondo inmediatamente para recuperar la tracción
    B: Girar el volante bruscamente hacia el paseo (hombro de la carretera)
    C: Retirar gradualmente el pie del acelerador y mantener una trayectoria recta
    D: Acelerar ligeramente para atravesar el agua
  answer: C
  explanation: Si ocurre hidroplaneo, no debe frenar ni girar repentinamente. Suelte
    gradualmente el acelerador para reducir la velocidad hasta que los neumáticos
    recuperen el contacto con la carretera.
- id: 97
  category: defensive_driving
  question: Para practicar una exploración visual y conciencia situacional adecuadas,
    ¿cuántos segundos hacia adelante debe mirar un conductor en Puerto Rico?
  choices:
    A: 3 a 5 segundos
    B: 5 a 8 segundos
    C: 10 a 15 segundos
    D: 20 a 30 segundos
  answer: C
  explanation: Las guías de conducción defensiva en Puerto Rico sugieren mirar de
    10 a 15 segundos hacia adelante para identificar posibles peligros antes de llegar
    a ellos.
- id: 98
  category: defensive_driving
  question: Según la Ley de Vehículos y Tránsito de Puerto Rico, ¿cuál es la penalidad
    por exceso de velocidad en una zona de construcción designada cuando hay trabajadores
    presentes?
  choices:
    A: La multa estándar se triplica
    B: La multa estándar se duplica
    C: Una tarifa fija de $500
    D: Suspensión obligatoria de la licencia por 30 días
  answer: B
  explanation: Bajo el Artículo 5.02 de la Ley 22, las multas por infracciones de
    tránsito en zonas de construcción se duplican para proteger a los trabajadores
    y conductores.
- id: 99
  category: defensive_driving
  question: 'Cuando un vehículo de emergencia con sirenas activadas y luces intermitentes
    se aproxima por detrás en una carretera de Puerto Rico, usted debe:'
  choices:
    A: Aumentar la velocidad para mantenerse delante de él
    B: Detenerse exactamente donde está en el carril
    C: Moverse al borde derecho de la carretera y detenerse
    D: Encender las luces de emergencia y continuar a la misma velocidad
  answer: C
  explanation: Los conductores deben ceder el paso a los vehículos de emergencia moviéndose
    lo más a la derecha posible y deteniéndose hasta que el vehículo haya pasado.
- id: 100
  category: defensive_driving
  question: Bajo la ley de Puerto Rico, ¿en cuál de los siguientes horarios deben
    encenderse las luces delanteras?
  choices:
    A: Solo desde la medianoche hasta las 6:00 AM
    B: Desde la puesta del sol hasta el amanecer
    C: Solo cuando está lloviendo fuertemente
    D: Desde una hora después de la puesta del sol hasta una hora antes del amanecer
  answer: B
  explanation: Se requiere que las luces delanteras estén encendidas desde la puesta
    del sol hasta el amanecer, o siempre que la visibilidad sea deficiente (menos
    de 500 pies).
- id: 101
  category: defensive_driving
  question: De acuerdo con la Ley de Vehículos y Tránsito de Puerto Rico, ¿cuál es
    la distancia de seguimiento recomendada detrás del vehículo que le precede bajo
    condiciones normales?
  choices:
    A: El largo de un auto por cada 20 mph
    B: Al menos tres segundos
    C: Exactamente 50 pies
    D: El largo de dos autos independientemente de la velocidad
  answer: B
  explanation: El manual del conductor de Puerto Rico recomienda mantener una distancia
    de seguimiento mínima de al menos tres segundos para permitir suficiente tiempo
    para reaccionar ante emergencias.
- id: 102
  category: defensive_driving
  question: En Puerto Rico, al conducir de noche, ¿a cuántos pies de distancia de
    un vehículo que viene en dirección contraria debe atenuar sus luces largas (cambiar
    a luces cortas)?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Bajo la Ley 22 (Ley de Vehículos y Tránsito de Puerto Rico), los conductores
    deben cambiar a luces cortas cuando un vehículo se aproxima en dirección contraria
    a una distancia de 500 pies para evitar cegar al otro conductor.
- id: 103
  category: defensive_driving
  question: Al seguir a otro vehículo de noche en Puerto Rico, ¿a qué distancia debe
    atenuar sus luces largas para evitar cegar al conductor de adelante a través de
    su espejo retrovisor?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Las leyes de tránsito de Puerto Rico exigen que los conductores atenúen
    las luces largas cuando siguen a otro vehículo a una distancia de 200 pies.
- id: 104
  category: defensive_driving
  question: Durante una lluvia tropical fuerte en Puerto Rico, puede ocurrir el hidroplaneo
    (hydroplaning). ¿A qué velocidad pueden los neumáticos comenzar a perder contacto
    con la superficie de la carretera en pavimento mojado?
  choices:
    A: A partir de las 35 mph
    B: Solo por encima de las 65 mph
    C: A partir de las 55 mph
    D: Solo al frenar repentinamente
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph cuando
    el agua en la carretera hace que los neumáticos pierdan contacto con el pavimento.
- id: 105
  category: defensive_driving
  question: Para mantener un buen 'liderazgo visual' y practicar la conducción defensiva
    en Puerto Rico, ¿con cuánta anticipación debe explorar la carretera?
  choices:
    A: De 2 a 5 segundos
    B: De 5 to 8 segundos
    C: De 10 a 15 segundos
    D: De 20 a 30 segundos
  answer: C
  explanation: Los manuales de conducción defensiva en Puerto Rico sugieren explorar
    de 10 a 15 segundos hacia adelante para identificar peligros potenciales antes
    de llegar a ellos.
- id: 106
  category: defensive_driving
  question: Si conduce por una autopista de Puerto Rico y experimenta una falla mecánica,
    ¿dónde debe colocar los triángulos de advertencia de emergencia o las luces de
    bengala?
  choices:
    A: Solo directamente detrás del parachoques
    B: A 10 pies y 100 pies detrás del vehículo
    C: A 50, 100 y 150 pies detrás del vehículo
    D: Sobre el techo del auto
  answer: B
  explanation: Para mayor seguridad en carreteras de alta velocidad, se recomienda
    colocar dispositivos de advertencia a intervalos (típicamente a 10 y 100 pies)
    para dar al tránsito que se aproxima suficiente tiempo para reaccionar.
- id: 107
  category: defensive_driving
  question: Al entrar en una glorieta en Puerto Rico, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo que entra a la glorieta
    B: El vehículo que ya está dentro de la glorieta
    C: El vehículo que viaja a la mayor velocidad
    D: El vehículo que se aproxima por la izquierda
  answer: B
  explanation: En Puerto Rico, los vehículos que ya están circulando dentro de la
    glorieta tienen el derecho de paso sobre aquellos que intentan entrar.
- id: 108
  category: defensive_driving
  question: En Puerto Rico, ¿cuál es la multa base por exceso de velocidad general
    (no en zona escolar)?
  choices:
    A: $50 más $5 por cada milla de exceso
    B: $100 más $10 por cada milla de exceso
    C: $150 más $20 por cada milla de exceso
    D: $25 más $5 por cada milla de exceso
  answer: B
  explanation: La multa estándar por exceso de velocidad en Puerto Rico es de $100
    como base, más $10 adicionales por cada milla por hora excedida.
- id: 109
  category: defensive_driving
  question: Si su vehículo comienza a patinar en una carretera resbaladiza en Puerto
    Rico, ¿cuál es la técnica correcta de conducción defensiva?
  choices:
    A: Frenar fuerte inmediatamente
    B: Girar el volante en la dirección opuesta al patinazo
    C: Girar el volante en la misma dirección en la que se desliza la parte trasera
      del auto
    D: Acelerar para recuperar la tracción
  answer: C
  explanation: Para recuperarse de un patinazo, debe girar el volante en la dirección
    en la que se desliza la parte trasera del vehículo y evitar frenar bruscamente.
- id: 110
  category: defensive_driving
  question: En Puerto Rico, al acercarse a un cruce de ferrocarril, ¿cuál es la distancia
    mínima a la que debe detenerse del riel más cercano si una señal está parpadeando?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 50 pies
  answer: C
  explanation: Los conductores deben detenerse a una distancia no menor de 15 pies
    y no mayor de 50 pies del riel más cercano en un cruce de ferrocarril cuando las
    advertencias están activas.
- id: 111
  category: alcohol_drugs_health
  question: ¿Cuál es la multa base por una primera convicción de conducir bajo los
    efectos del alcohol (DUI) en Puerto Rico (excluyendo recargos adicionales basados
    en el nivel de BAC)?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: C
  explanation: Para una primera infracción de DUI en Puerto Rico, la multa base es
    de $500, más $50 adicionales por cada centésima de porcentaje por encima del límite
    legal.
- id: 112
  category: alcohol_drugs_health
  question: ¿Cuál es la multa por tener un envase abierto de una bebida alcohólica
    en el compartimiento de pasajeros de un vehículo de motor en una vía pública en
    Puerto Rico?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: La Ley 22 de Puerto Rico prohíbe los envases abiertos de alcohol en
    el área de pasajeros de un vehículo, con una multa de $100 por cada infracción.
- id: 113
  category: alcohol_drugs_health
  question: Una segunda convicción de DUI dentro de un período de cinco años en Puerto
    Rico conlleva una pena de cárcel obligatoria de ¿cuántos días?
  choices:
    A: 1 a 5 días
    B: 5 a 10 días
    C: 15 a 30 días
    D: 60 a 90 días
  answer: C
  explanation: Una segunda infracción de DUI dentro de cinco años en Puerto Rico resulta
    en una sentencia de cárcel obligatoria que oscila entre 15 y 30 días.
- id: 114
  category: alcohol_drugs_health
  question: En Puerto Rico, si una persona es convicta de conducir bajo los efectos
    del alcohol y causa 'daño corporal grave' a otra persona, ¿cuál es el término
    de encarcelamiento potencial?
  choices:
    A: 6 meses fijos
    B: 18 meses fijos
    C: 5 años fijos
    D: 10 años fijos
  answer: B
  explanation: Bajo la Ley 22, un DUI que resulte en daño corporal grave es un delito
    grave con una pena de reclusión fija de 18 meses.
- id: 115
  category: alcohol_drugs_health
  question: ¿Cuál es la penalidad para un conductor en Puerto Rico que es sorprendido
    conduciendo bajo los efectos del alcohol con un pasajero menor de 15 años en el
    vehículo?
  choices:
    A: La multa se reduce debido al pasajero.
    B: La multa y las penalidades se duplican.
    C: Se aplica una multa fija de $1,000 independientemente del BAC.
    D: La licencia de conducir se suspende por solo 10 días.
  answer: B
  explanation: Si se comete un DUI mientras un menor de 15 años (o una persona con
    discapacidad física o mental) está en el vehículo, las multas y penalidades establecidas
    por ley se duplican.
- id: 116
  category: alcohol_drugs_health
  question: ¿Qué sucede con la licencia de conducir de una persona convicta de una
    tercera infracción de DUI en Puerto Rico?
  choices:
    A: Se suspende por 1 año
    B: Se suspende por 2 años
    C: Se suspende por 5 años
    D: Revocación permanente
  answer: D
  explanation: Una tercera convicción de DUI en Puerto Rico resulta en la revocación
    permanente de la licencia de conducir.
- id: 117
  category: alcohol_drugs_health
  question: 'En Puerto Rico, conducir bajo los efectos de sustancias controladas (drogas)
    conlleva las mismas penalidades que:'
  choices:
    A: Una simple multa de tránsito
    B: Un delito grave de primer grado
    C: La infracción del nivel más alto de BAC (alcohol)
    D: Una infracción por el uso del cinturón de seguridad
  answer: C
  explanation: Conducir bajo los efectos de drogas o sustancias controladas en Puerto
    Rico se penaliza con la misma severidad que el nivel más alto de las infracciones
    de DUI relacionadas con el alcohol.
- id: 118
  category: alcohol_drugs_health
  question: Para una primera infracción de DUI en Puerto Rico, ¿cuál es el período
    de suspensión obligatoria de la licencia?
  choices:
    A: 15 días
    B: 30 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: Una primera convicción de DUI en Puerto Rico incluye una suspensión
    obligatoria de la licencia de 30 días.
- id: 119
  category: alcohol_drugs_health
  question: Si el BAC de un conductor es de 0.12%, ¿cuánto adicional se le multará
    en Puerto Rico además de la multa base de $500 por una primera infracción?
  choices:
    A: $50
    B: $100
    C: $200
    D: $400
  answer: C
  explanation: La ley añade $50 por cada 0.01% por encima del límite de 0.08%. Dado
    que 0.12% es 0.04% sobre el límite (4 unidades de 0.01%), la multa adicional es
    4 x $50 = $200.
- id: 120
  category: alcohol_drugs_health
  question: Al solicitar o renovar una licencia en Puerto Rico, se requiere un certificado
    médico. ¿Por cuánto tiempo es válido este certificado desde la fecha de su emisión?
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: El certificado médico requerido para la licencia de conducir en Puerto
    Rico debe ser emitido dentro de los 6 meses anteriores a la fecha de la solicitud.
- id: 121
  category: alcohol_drugs_health
  question: 'En Puerto Rico, si usted está tomando medicamentos recetados que afectan
    su capacidad para conducir de manera segura, debe:'
  choices:
    A: Conducir solo durante el día
    B: Conducir solo por carreteras secundarias
    C: No conducir en absoluto
    D: Beber café para contrarrestar los efectos
  answer: C
  explanation: Es ilegal e inseguro operar un vehículo de motor en Puerto Rico bajo
    la influencia de cualquier sustancia, incluyendo medicamentos recetados, que afecte
    su capacidad física o mental.
- id: 122
  category: alcohol_drugs_health
  question: ¿Quién es responsable si se encuentra a un pasajero con un envase de alcohol
    abierto en un vehículo en Puerto Rico?
  choices:
    A: Solo el pasajero
    B: Solo el conductor
    C: Tanto el conductor como el pasajero
    D: Solo el dueño del vehículo
  answer: B
  explanation: Bajo la Ley 22 de Puerto Rico, el conductor es considerado responsable
    y multado si se encuentra a cualquier persona en el compartimiento de pasajeros
    del vehículo con un envase abierto de alcohol.
- id: 123
  category: alcohol_drugs_health
  question: ¿Cuál es la pena de reclusión obligatoria en Puerto Rico por una condena
    de DUI que resulte en la muerte de otra persona?
  choices:
    A: 2 a 5 años
    B: 5 a 10 años
    C: 8 a 15 años
    D: 20 a 30 años
  answer: C
  explanation: Un DUI que resulta en una fatalidad es un delito grave en Puerto Rico,
    con una pena de reclusión fija de 8 a 15 años.
- id: 124
  category: alcohol_drugs_health
  question: 'Si un conductor en Puerto Rico es convicto por DUI que resulte en ''daño
    corporal grave'' a otra persona, se clasifica como:'
  choices:
    A: Un delito menos grave
    B: Un delito grave con una sentencia de prisión obligatoria
    C: Solo una multa de tránsito
    D: Una infracción que solo conlleva una multa
  answer: B
  explanation: Bajo la Ley 22, un DUI que cause daño corporal grave es un delito grave
    (de tercer grado) y conlleva una sentencia de prisión obligatoria de 18 meses.
- id: 125
  category: alcohol_drugs_health
  question: Para una segunda condena por DUI dentro de un periodo de cinco años en
    Puerto Rico, ¿cuál es el tiempo de cárcel obligatorio?
  choices:
    A: Sin tiempo de cárcel, solo servicio comunitario
    B: 24 horas
    C: 15 a 30 días
    D: 6 meses a 1 año
  answer: C
  explanation: Una segunda condena por DUI en Puerto Rico dentro de un periodo de
    cinco años requiere una pena de cárcel obligatoria de 15 a 30 días.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cuál es la penalidad con respecto a los privilegios de conducir por una
    tercera condena de DUI en Puerto Rico?
  choices:
    A: Suspensión de 1 año
    B: Suspensión de 2 años
    C: Suspensión de 5 años
    D: Revocación permanente de la licencia de conducir
  answer: D
  explanation: Una tercera condena por DUI en Puerto Rico resulta en la revocación
    permanente de la licencia de conducir de la persona.
- id: 127
  category: alcohol_drugs_health
  question: Además de la multa estándar, toda persona convicta por DUI en Puerto Rico
    debe pagar una contribución obligatoria al Fondo de Trauma. ¿De cuánto es este
    cargo?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: B
  explanation: Cualquier persona convicta por conducir bajo la influencia debe pagar
    una contribución de $50 al Fondo de Trauma de la Administración de Servicios Médicos.
- id: 128
  category: alcohol_drugs_health
  question: Si el BAC (concentración de alcohol en la sangre) de un conductor es de
    0.15% o más en Puerto Rico, está sujeto a penalidades por 'DUI Agravado'. ¿Cuál
    de las siguientes es una consecuencia de esto?
  choices:
    A: La multa se mantiene en $500
    B: El conductor está exento de tiempo de cárcel
    C: El conductor debe realizar servicio comunitario obligatorio
    D: Se aplican multas más altas y penalidades más estrictas en comparación con
      el límite de 0.08%
  answer: D
  explanation: Un BAC de 0.15% o más se considera un factor agravante en Puerto Rico,
    lo que conlleva un aumento en las multas y una aplicación más estricta de las
    penalidades.
- id: 129
  category: alcohol_drugs_health
  question: ¿Qué programa es obligatorio para cualquier persona cuya licencia sea
    suspendida por una infracción de DUI en Puerto Rico antes de que pueda recuperar
    sus privilegios de conducir?
  choices:
    A: Un curso estándar de 5 horas previo a la licencia
    B: El Programa de Concientización sobre Alcohol y Drogas (ADAP/C.R.E.A.)
    C: Un equivalente de diploma de escuela superior
    D: Un curso de conducción defensiva por exceso de velocidad
  answer: B
  explanation: Los conductores convictos por DUI deben completar un programa obligatorio
    de rehabilitación/educación sobre alcohol y drogas (a menudo referido como C.R.E.A.
    o ADAP) como parte de su sentencia y para reinstalar su licencia.
- id: 130
  category: alcohol_drugs_health
  question: En Puerto Rico, si una persona padece una condición como la epilepsia,
    ¿qué se requiere para mantener la licencia de conducir?
  choices:
    A: Se les prohíbe conducir permanentemente.
    B: Deben proporcionar un certificado médico cada año que indique que la condición
      está controlada.
    C: Solo pueden conducir durante las horas del día.
    D: No existen requisitos especiales para condiciones médicas.
  answer: B
  explanation: Los conductores con condiciones médicas que puedan afectar la conducción,
    como la epilepsia, deben proporcionar certificaciones médicas periódicas (usualmente
    anuales) al DTOP para demostrar que su condición está bajo control.
- id: 131
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol sus habilidades de conducción en el clima tropical
    de Puerto Rico?
  choices:
    A: El calor puede acelerar los efectos del alcohol y la deshidratación, afectando
      aún más el juicio.
    B: La humedad anula los efectos del alcohol.
    C: El alcohol no tiene efecto en la conducción si se está acostumbrado al calor.
    D: Beber agua mientras se consume alcohol hace que sea legal conducir.
  answer: A
  explanation: Factores ambientales como el calor y la deshidratación pueden intensificar
    los efectos del alcohol en la coordinación y el juicio del conductor.
- id: 132
  category: penalties_and_points
  question: En Puerto Rico, ¿cuál es la multa base por exceder el límite de velocidad
    de 1 a 14 millas por hora?
  choices:
    A: $50 más $5 por cada milla adicional
    B: $100 más $10 por cada milla adicional
    C: $150 más $20 por cada milla adicional
    D: $200 de tarifa fija
  answer: B
  explanation: De acuerdo con la Ley de Vehículos y Tránsito de Puerto Rico (Ley 22),
    la penalidad por exceso de velocidad es una multa base de $100 más $10 por cada
    milla por hora sobre el límite.
- id: 133
  category: penalties_and_points
  question: ¿Cuál es la multa por tener tintes en los cristales que no cumplen con
    el límite legal (menos del 35% de transmisión de luz) en Puerto Rico?
  choices:
    A: $50
    B: $100
    C: $200
    D: $300
  answer: B
  explanation: Violar las leyes de tintes de cristales en Puerto Rico (que requieren
    al menos un 35% de transmisión de luz) conlleva una multa de $100.
- id: 134
  category: penalties_and_points
  question: ¿Cuál es la multa por no utilizar un asiento protector para un niño que,
    por ley, está obligado a usarlo?
  choices:
    A: $100
    B: $250
    C: $500
    D: $750
  answer: C
  explanation: No asegurar adecuadamente a un niño en un asiento protector según lo
    requiere la ley resulta en una multa de $500.
- id: 135
  category: penalties_and_points
  question: ¿Cuál es la multa en Puerto Rico por transportar a un niño menor de 4
    años sin un asiento protector aprobado federalmente?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: B
  explanation: El Artículo 13.03 de la Ley 22-2000 establece una multa de $100 por
    no utilizar un asiento protector adecuado para niños menores de 4 años.
- id: 136
  category: penalties_and_points
  question: En Puerto Rico, ¿cuál es la multa por operar un vehículo con tintes en
    los cristales que permitan menos del 35% de transmisión de luz?
  choices:
    A: $50
    B: $100
    C: $150
    D: $250
  answer: B
  explanation: La ley requiere al menos un 35% de transmisión de luz para los tintes
    de los cristales; las violaciones resultan en una multa de $100.
- id: 137
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden al récord de un conductor por conducir ilegalmente
    por el paseo de la carretera?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: D
  explanation: Conducir por el paseo de la carretera es una violación grave en Puerto
    Rico y conlleva una penalidad de 6 puntos.
- id: 138
  category: penalties_and_points
  question: Si una multa de tránsito en Puerto Rico no se paga dentro de los 30 días,
    ¿cuál es el recargo adicional que se añade a la multa?
  choices:
    A: $5
    B: $10
    C: $25
    D: $50
  answer: A
  explanation: De acuerdo con el Artículo 23.05, si una multa no se paga dentro de
    los 30 días, se añade un recargo de $5 al monto total.
- id: 139
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan al récord de un conductor por realizar un viraje
    en 'U' ilegal?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: El Departamento de Transportación y Obras Públicas (DTOP) de Puerto
    Rico asigna 2 puntos al récord de un conductor por un viraje en 'U' ilegal.
- id: 140
  category: penalties_and_points
  question: ¿Cuál es la multa para un conductor o pasajero de motocicleta que no use
    casco protector?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: B
  explanation: El Artículo 12.02 requiere el uso de casco tanto para conductores como
    para pasajeros de motocicletas, con una multa de $100 por incumplimiento.
- id: 141
  category: penalties_and_points
  question: ¿Cuando un conductor es citado por un oficial de policía por no detenerse
    ante una luz roja, cuántos puntos se añaden a su récord de conducir?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: B
  explanation: No detenerse ante una luz roja cuando es observado por un oficial de
    la ley resulta en 3 puntos en el récord del conductor.
- id: 142
  category: sharing_the_road
  question: Al rebasar a un ciclista en Puerto Rico, ¿cuál es la distancia lateral
    mínima que un conductor de vehículo de motor debe mantener entre el vehículo y
    el ciclista?
  choices:
    A: 1 pie
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La Ley 22, Artículo 11.03 requiere que los conductores mantengan una
    distancia mínima de 3 pies (aproximadamente 1 metro) al rebasar a un ciclista
    para garantizar su seguridad.
- id: 143
  category: sharing_the_road
  question: En Puerto Rico, ¿cuál es la multa para un peatón que no utiliza un puente
    peatonal o paso de cebra cuando hay uno disponible cerca?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: Bajo el Artículo 10.02 de la Ley 22, los peatones que no utilicen los
    pasos de cebra o puentes provistos están sujetos a una multa de $100 por violar
    las regulaciones de seguridad.
- id: 144
  category: sharing_the_road
  question: En Puerto Rico, ¿cuál es el estatus legal de un ciclista en las vías públicas?
  choices:
    A: Siempre deben circular por la acera
    B: Tienen los mismos derechos y deberes que el conductor de un vehículo de motor
    C: Siempre deben circular en contra del flujo del tránsito
    D: No se les permite circular en carreteras con un límite de velocidad superior
      a 25 mph
  answer: B
  explanation: Bajo la Ley 22, los ciclistas son considerados vehículos y tienen los
    mismos derechos en la carretera y responsabilidades que los conductores de vehículos
    de motor.
- id: 145
  category: sharing_the_road
  question: Cuando dos o más vehículos de motor pesados (camiones) viajan en la misma
    dirección en una carretera de Puerto Rico, ¿cuál es la distancia mínima que deben
    mantener entre sí?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: El Artículo 6.18 de la Ley 22 requiere que los vehículos de motor pesados
    mantengan una distancia mínima de 100 pies entre ellos para permitir que otros
    vehículos rebasen de manera segura.
- id: 146
  category: sharing_the_road
  question: En Puerto Rico, si un peatón está cruzando la calle en una intersección
    donde no hay señales de tránsito, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo de motor
    B: El peatón
    C: Quien haya llegado primero a la intersección
    D: El peatón, pero solo si está en un paso de cebra marcado
  answer: B
  explanation: Los conductores deben ceder el derecho de paso a los peatones que cruzan
    la calzada dentro de cualquier paso de cebra marcado o no marcado en una intersección.
- id: 147
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es cierta con respecto al uso del
    casco de motocicleta en Puerto Rico?
  choices:
    A: Solo el conductor está obligado a usar casco
    B: El uso del casco es opcional para conductores mayores de 21 años
    C: Tanto el conductor como el pasajero deben usar un casco aprobado por el DOT
    D: Los cascos solo son obligatorios en las autopistas
  answer: C
  explanation: La Ley 22 requiere que tanto el operador como el pasajero de una motocicleta
    usen un casco protector que cumpla con los estándares del Departamento de Transportación
    (DOT).
- id: 148
  category: sharing_the_road
  question: ¿Cuándo NO se requiere que un conductor se detenga ante un autobús escolar
    que está detenido con sus luces de advertencia encendidas en Puerto Rico?
  choices:
    A: Cuando el conductor tiene prisa
    B: Cuando la carretera tiene cuatro o más carriles y el autobús está al lado opuesto
      de una mediana física
    C: Cuando el autobús está detenido en una zona residencial
    D: Los conductores siempre deben detenerse independientemente del tipo de carretera
  answer: B
  explanation: Los conductores que viajan en la dirección opuesta en una carretera
    dividida con una barrera física o mediana no están obligados a detenerse ante
    un autobús escolar.
- id: 149
  category: sharing_the_road
  question: En Puerto Rico, ¿cuál es la multa para un conductor que estacione o detenga
    su vehículo de manera que obstruya un carril de bicicletas?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Obstruir un carril de bicicletas designado es una violación de la Ley
    22 y conlleva una multa de $100.
- id: 150
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima que un conductor debe mantener al seguir
    a un vehículo de emergencia que tiene sus sirenas y luces activadas en Puerto
    Rico?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Artículo 6.20 de la Ley 22 prohíbe a los conductores seguir a un
    vehículo de emergencia a una distancia menor de 500 pies cuando este se encuentra
    respondiendo a una emergencia.
- id: 151
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor en Puerto Rico si un peatón está usando un
    bastón blanco o un perro guía en una intersección?
  choices:
    A: Tocar la bocina para avisarles que usted está allí
    B: Detenerse por completo y ceder el paso
    C: Conducir lentamente a su alrededor
    D: Ceder el paso solo si hay una señal de peatones ("Walk")
  answer: B
  explanation: Los conductores deben tomar las precauciones necesarias y detenerse
    por completo para ceder el paso a los peatones ciegos o con impedimentos visuales
    que utilicen un bastón blanco o un perro guía.
- id: 152
  category: sharing_the_road
  question: 'En Puerto Rico, las motocicletas deben tener sus faros delanteros encendidos:'
  choices:
    A: Solo de noche
    B: Solo durante lluvia o neblina
    C: En todo momento cuando la motocicleta esté en movimiento
    D: Solo en autopistas
  answer: C
  explanation: Por seguridad y visibilidad, la Ley 22 exige que las motocicletas operen
    con sus faros encendidos en todo momento, incluso durante las horas del día.
- id: 153
  category: sharing_the_road
  question: Al conducir una bicicleta de noche en Puerto Rico, ¿qué equipo es legalmente
    requerido?
  choices:
    A: Una luz blanca delantera y una luz roja o reflector trasero
    B: Un timbre y una canasta
    C: Solo ropa reflectante
    D: Un espejo retrovisor y una bocina
  answer: A
  explanation: El Artículo 11.05 de la Ley 22 exige que las bicicletas utilizadas
    de noche estén equipadas con una lámpara delantera que emita luz blanca y una
    luz roja o reflector trasero visible desde al menos 500 pies.
- id: 154
  category: sharing_the_road
  question: En Puerto Rico, ¿cuál es la multa para un conductor que no se detiene
    cuando un autobús escolar está recogiendo o dejando niños?
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: C
  explanation: Según el Artículo 6.21 de la Ley 22 de Puerto Rico (Ley de Vehículos
    y Tránsito), cualquier conductor que no se detenga ante un autobús escolar mientras
    este carga o descarga estudiantes está sujeto a una multa de $300.
- id: 155
  category: sharing_the_road
  question: ¿Cuál es el requisito legal para los pasajeros de motocicletas en Puerto
    Rico con respecto al equipo de seguridad?
  choices:
    A: Los cascos son opcionales para pasajeros mayores de 21 años
    B: Solo el conductor está obligado a usar casco
    C: Tanto el conductor como el pasajero deben usar un casco aprobado por el DOT
    D: Los pasajeros solo están obligados a usar casco en las autopistas
  answer: C
  explanation: El Artículo 12.02 de la Ley 22 establece que tanto el operador como
    cualquier pasajero de una motocicleta deben usar un casco protector que cumpla
    con los estándares establecidos por el Departamento de Transportación.
- id: 156
  category: sharing_the_road
  question: Al conducir cerca de vehículos de motor pesados (camiones), ¿qué es la
    "Zona de No Visibilidad" (No-Zone)?
  choices:
    A: El área donde no se permite circular a los camiones
    B: Los puntos ciegos alrededor del camión donde el conductor no puede ver otros
      vehículos
    C: El carril designado para camiones en la autopista
    D: El área directamente frente al camión solamente
  answer: B
  explanation: La "Zona de No Visibilidad" (No-Zone) se refiere a los grandes puntos
    ciegos alrededor de un camión (frente, atrás y lados) donde la visibilidad del
    conductor del camión es limitada. Si no puede ver los espejos laterales del camión,
    el conductor no puede verlo a usted.
- id: 157
  category: sharing_the_road
  question: En Puerto Rico, ¿en qué dirección deben circular los ciclistas en la carretera?
  choices:
    A: En contra del flujo del tránsito (frente a los vehículos)
    B: En la misma dirección que el flujo del tránsito
    C: Solo por la acera
    D: En el medio del carril en todo momento
  answer: B
  explanation: Los ciclistas en Puerto Rico son considerados vehículos y deben seguir
    las mismas reglas que los vehículos de motor, lo que incluye circular en la misma
    dirección que el tránsito.
- id: 158
  category: sharing_the_road
  question: 'Si un peatón debe caminar por una carretera en Puerto Rico donde no hay
    aceras, debe caminar:'
  choices:
    A: Por el lado derecho, con el flujo del tránsito
    B: Por el lado izquierdo, de frente al tránsito que se aproxima
    C: En el centro de la carretera
    D: Por el lado que tenga más sombra
  answer: B
  explanation: El Artículo 10.03 de la Ley 22 exige que los peatones caminen por el
    lado izquierdo de la carretera de frente al tránsito cuando no haya aceras disponibles,
    lo que les permite ver los vehículos que se aproximan.
- id: 159
  category: sharing_the_road
  question: 'Cuando un camión pesado está girando a la derecha en una intersección,
    el conductor de un automóvil debe:'
  choices:
    A: Meterse en el espacio entre el camión y el borde de la acera
    B: Quedarse atrás y esperar a que el camión complete el giro
    C: Tocar la bocina para que el conductor del camión sepa que está allí
    D: Rebasar al camión por la izquierda mientras está girando
  answer: B
  explanation: Los camiones pesados a menudo necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha. Los conductores nunca deben intentar rebasar
    por la derecha ni meterse en el hueco, ya que el conductor del camión no puede
    verlos y las ruedas traseras pueden acortar la esquina.
- id: 160
  category: sharing_the_road
  question: De noche, ¿con cuál de los siguientes elementos debe estar equipada una
    bicicleta en Puerto Rico?
  choices:
    A: Una luz blanca al frente y una luz roja o reflector en la parte trasera
    B: Solo un timbre o bocina
    C: Solo cinta reflectante en las ruedas
    D: No se requiere equipo especial si se circula por el paseo
  answer: A
  explanation: El Artículo 11.05 de la Ley 22 exige que las bicicletas utilizadas
    de noche tengan una lámpara delantera que emita una luz blanca visible desde 500
    pies y un reflector o lámpara roja en la parte trasera visible desde 600 pies.
- id: 161
  category: vehicle_information
  question: ¿En Puerto Rico, a qué distancia debe cambiar de luces largas a luces
    cortas al acercarse a un vehículo que viene en dirección contraria?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Puerto Rico exige que los conductores atenúen sus luces largas
    cuando un vehículo que se aproxima está a menos de 500 pies para evitar cegar
    al otro conductor.
- id: 162
  category: vehicle_information
  question: Al seguir a otro vehículo por detrás en Puerto Rico, ¿a cuántos pies de
    distancia debe cambiar sus luces largas a luces cortas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Los conductores deben cambiar a luces cortas cuando sigan a otro vehículo
    a una distancia de 300 pies para evitar reflejar el resplandor en los espejos
    del conductor delantero.
- id: 163
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodamiento de los
    neumáticos para un vehículo de motor que transita por las vías públicas de Puerto
    Rico?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros e ilegales en Puerto Rico si
    la profundidad de la banda de rodamiento es inferior a 2/32 de pulgada.
- id: 164
  category: vehicle_information
  question: 'Según la ley de Puerto Rico, todo vehículo de motor debe estar equipado
    con una bocina que sea audible desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El Artículo 14.05 de la Ley 22 exige una bocina capaz de emitir un
    sonido audible en condiciones normales desde una distancia no menor de 200 pies.
- id: 165
  category: vehicle_information
  question: ¿Cuál es la multa en Puerto Rico por operar un vehículo con un sistema
    de escape modificado (recortes, derivaciones o ruido amplificado)?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Modificar un sistema de escape para aumentar el ruido o evadir los
    controles de emisiones es una violación de la Ley 22 y conlleva una multa de $100.
- id: 166
  category: vehicle_information
  question: 'En Puerto Rico, la tablilla (placa) trasera debe estar iluminada por
    una luz blanca de modo que sea legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley exige que la tablilla trasera esté iluminada y sea claramente
    visible desde una distancia de 50 pies.
- id: 167
  category: vehicle_information
  question: Si la carga de un vehículo sobresale más de cuatro pies de la parte posterior
    de la carrocería, ¿qué debe fijarse al extremo de la carga durante el día en Puerto
    Rico?
  choices:
    A: Una bandera roja de al menos 12 pulgadas cuadradas
    B: Una bandera amarilla de al menos 18 pulgadas cuadradas
    C: Un paño blanco
    D: Una bandera roja de al menos 16 pulgadas cuadradas
  answer: A
  explanation: La Ley 22 exige que se coloque una bandera roja (de al menos 12x12
    pulgadas) al final de cualquier carga que sobresalga más de 4 pies de la parte
    trasera del vehículo.
- id: 168
  category: vehicle_information
  question: 'De acuerdo con los reglamentos de Puerto Rico, es ilegal utilizar un
    sistema de sonido en un vehículo que sea audible desde una distancia de:'
  choices:
    A: 50 pies o más
    B: 100 pies o más
    C: 200 pies o más
    D: 500 pies o más
  answer: B
  explanation: El Artículo 14.05 prohíbe el uso de sistemas de amplificación de sonido
    que sean audibles a una distancia de 100 pies o más del vehículo en las vías públicas.
- id: 169
  category: vehicle_information
  question: En Puerto Rico, ¿cuántas luces rojas de freno se requieren en la parte
    trasera de todos los vehículos de motor modernos?
  choices:
    A: Al menos una
    B: Al menos dos
    C: Al menos tres
    D: Ninguna, solo se requieren señales de giro
  answer: B
  explanation: La Ley 22 exige que todo vehículo de motor tenga al menos dos luces
    rojas de freno en la parte trasera que se activen al aplicar el freno de servicio.
- id: 170
  category: vehicle_information
  question: ¿Qué color de luces intermitentes o rotativas está estrictamente reservado
    para el Negociado de la Policía de Puerto Rico?
  choices:
    A: Rojo
    B: Verde
    C: Azul
    D: Ámbar
  answer: C
  explanation: En Puerto Rico, las luces azules están reservadas exclusivamente para
    los vehículos de la policía. Las luces rojas son utilizadas por ambulancias y
    camiones de bomberos.
- id: 171
  category: vehicle_information
  question: ¿De qué dos sistemas de frenos independientes debe estar equipado todo
    vehículo de motor en Puerto Rico?
  choices:
    A: Frenos delanteros y frenos traseros
    B: Freno de servicio y freno de estacionamiento (emergencia)
    C: Freno manual y freno automático
    D: Frenos de disco y frenos de tambor
  answer: B
  explanation: 'La ley requiere dos medios separados para aplicar los frenos: un freno
    de servicio (pedal) y un freno de estacionamiento (palanca de mano o pie).'
- id: 172
  category: vehicle_information
  question: ¿Cuál es la multa por tener objetos, calcomanías o anuncios en el parabrisas
    que obstruyan la visibilidad clara del conductor en Puerto Rico?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: Colocar objetos o calcomanías no autorizadas que obstruyan la visibilidad
    del conductor a través del parabrisas o las ventanas laterales conlleva una multa
    de $100.
- id: 173
  category: vehicle_information
  question: En Puerto Rico, ¿con qué frecuencia debe un vehículo de más de dos años
    de antigüedad someterse a una inspección mecánica (inspección técnica) para renovar
    el marbete?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Los vehículos con más de dos años de antigüedad deben aprobar una inspección
    mecánica y de emisiones anual para obtener el sello de registro anual (marbete).
- id: 174
  category: vehicle_information
  question: 'Si el espejo retrovisor de un vehículo está obstruido por una carga o
    un remolque, la ley de Puerto Rico exige que el vehículo tenga:'
  choices:
    A: Un sistema de cámaras
    B: Un pasajero para guiar al conductor
    C: Dos espejos laterales exteriores (uno a cada lado)
    D: Un espejo interior más ancho
  answer: C
  explanation: Si la visión del espejo interior está obstruida, el vehículo debe estar
    equipado con espejos exteriores tanto en el lado izquierdo como en el derecho
    para asegurar la visibilidad hacia atrás.
- id: 175
  category: vehicle_information
  question: 'La ley de Puerto Rico exige que el freno de servicio (freno de pie) debe
    ser capaz de detener un vehículo de pasajeros que viaje a 20 mph en una distancia
    máxima de:'
  choices:
    A: 15 pies
    B: 25 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: Según el Artículo 14.01, el sistema de frenado debe ser lo suficientemente
    eficiente para detener un vehículo de motor que viaje a 20 mph en 25 pies sobre
    una superficie seca y nivelada.
- id: 176
  category: vehicle_information
  question: En Puerto Rico, todo vehículo de motor debe estar equipado con un silenciador
    (muffler) en buen estado de funcionamiento. ¿Qué está específicamente prohibido
    con respecto al sistema de escape?
  choices:
    A: Usar un silenciador de acero inoxidable
    B: Tener un tubo de escape que se extienda más allá del parachoques
    C: Usar 'cutouts', derivaciones (bypasses) o dispositivos similares que aumenten
      el ruido
    D: Pintar el tubo de escape
  answer: C
  explanation: El Artículo 14.03 prohíbe el uso de cualquier dispositivo que evite
    el silenciador o aumente el nivel de ruido del sistema de escape del vehículo.
- id: 177
  category: vehicle_information
  question: ¿Cuál es la multa en Puerto Rico por operar un vehículo con un tinte de
    ventanas ilegal que no cumpla con el requisito de transmisión del 35%?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: La multa estándar por violar las regulaciones de tinte de ventanas
    (Artículo 14.16) en Puerto Rico es de $100.
- id: 178
  category: vehicle_information
  question: ¿Cuál de las siguientes combinaciones de colores se requiere para las
    luces direccionales delanteras de un vehículo en Puerto Rico?
  choices:
    A: Blanco o Ámbar
    B: Rojo o Ámbar
    C: Azul o Blanco
    D: Verde o Ámbar
  answer: A
  explanation: Las señales de giro delanteras deben ser blancas o ámbar, mientras
    que las señales de giro traseras deben ser rojas o ámbar.
- id: 179
  category: vehicle_information
  question: En Puerto Rico, ¿con qué frecuencia debe un vehículo someterse típicamente
    a una inspección mecánica y de emisiones para renovar su marbete (sello de registro)?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Los vehículos en Puerto Rico deben aprobar una inspección anual (inspección
    técnica) para asegurar que cumplen con los estándares de seguridad y emisiones
    antes de que se pueda renovar el registro (marbete).
- id: 180
  category: vehicle_information
  question: ¿Cuál es la altura máxima permitida para el parachoques delantero de un
    automóvil de pasajeros estándar en Puerto Rico?
  choices:
    A: 18 pulgadas
    B: 20 pulgadas
    C: 22 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: Las regulaciones de Puerto Rico especifican que la altura máxima del
    parachoques para automóviles de pasajeros es de 22 pulgadas desde el suelo hasta
    la parte inferior del parachoques.
- id: 181
  category: vehicle_information
  question: En Puerto Rico, ¿es ilegal conducir un vehículo de motor si está equipado
    con cuál de los siguientes en la parte delantera?
  choices:
    A: Luces de niebla
    B: Señales de giro color ámbar
    C: Luces rojas visibles desde el frente
    D: Faros halógenos
  answer: C
  explanation: El Artículo 14.05 prohíbe que los vehículos privados muestren luces
    rojas visibles desde el frente, ya que las luces rojas están reservadas para la
    parte trasera de los vehículos o para vehículos de emergencia.
- id: 182
  category: vehicle_information
  question: ¿Cuál es el requisito legal para los limpiaparabrisas en Puerto Rico?
  choices:
    A: Solo se requieren durante la temporada de lluvias
    B: Deben ser controlados por una palanca manual
    C: Deben estar en buen estado de funcionamiento y ser capaces de limpiar la lluvia
      u otra humedad
    D: Solo es obligatorio el limpiaparabrisas del lado del conductor
  answer: C
  explanation: La Ley 22 exige que todos los vehículos de motor (excepto las motocicletas)
    tengan un dispositivo para limpiar la lluvia o la humedad del parabrisas que se
    mantenga en buen estado de funcionamiento.
- id: 183
  category: signs_and_signals
  question: En Puerto Rico, ¿cuál es la multa por no detenerse ante una luz roja de
    semáforo?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: De acuerdo con la Ley de Vehículos y Tránsito de Puerto Rico (Ley 22),
    la multa por no detenerse ante una luz roja es de $500.
- id: 184
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente en una intersección en Puerto
    Rico?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: La luz está a punto de cambiar a verde
    C: Detenerse por completo y proceder solo cuando sea seguro
    D: El semáforo está averiado; ignórelo
  answer: C
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de PARE. Debe detenerse por completo y ceder el paso al tráfico antes de continuar.
- id: 185
  category: signs_and_signals
  question: En Puerto Rico, ¿cuál es la multa por estacionarse ilegalmente en un espacio
    designado para personas con discapacidades (marcado con un bordillo azul o señal)?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,000
  answer: C
  explanation: Bajo la ley de Puerto Rico, la multa por estacionarse en un espacio
    reservado para personas con discapacidades sin un permiso válido es de $1,000.
- id: 186
  category: signs_and_signals
  question: Cuando un autobús escolar se detiene para recoger o dejar niños y activa
    sus luces rojas y la señal de 'PARE' (STOP), ¿qué debe hacer un conductor en una
    carretera de dos carriles?
  choices:
    A: Reducir la velocidad a 10 mph y pasar con cuidado
    B: Detenerse solo si está detrás del autobús
    C: Detenerse por completo hasta que el autobús desactive las señales
    D: Tocar la bocina y continuar
  answer: C
  explanation: Los conductores en ambas direcciones deben detenerse ante un autobús
    escolar con luces rojas y señales de pare activadas. La multa por violar esto
    en Puerto Rico es de $300.
- id: 187
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla continua en su lado del centro de la carretera?
  choices:
    A: Se permite rebasar
    B: Está prohibido rebasar
    C: Está en una calle de una sola vía
    D: Puede girar a la izquierda pero no rebasar
  answer: B
  explanation: Una línea amarilla continua en su lado de la carretera indica que está
    prohibido rebasar a otros vehículos.
- id: 188
  category: signs_and_signals
  question: Para indicar un giro a la derecha usando señales manuales en Puerto Rico,
    ¿cómo debe posicionarse el brazo del conductor?
  choices:
    A: Extendido recto hacia afuera de la ventana
    B: Extendido hacia arriba en un ángulo de 90 grados
    C: Extendido hacia abajo hacia el suelo
    D: Agitando en movimiento circular
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido por la ventana y doblado hacia arriba en un ángulo de 90 grados.
- id: 189
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de 'Ceda el Paso'?
  choices:
    A: Detenerse y esperar por 3 segundos
    B: Ceder el derecho de paso al tráfico en la intersección o vía principal
    C: Tráfico de una sola vía solamente
    D: No se permite la entrada
  answer: B
  explanation: '''Ceda el Paso'' es el término en español para ''Yield''. Requiere
    que los conductores reduzcan la velocidad y den el derecho de paso a otros vehículos.'
- id: 190
  category: signs_and_signals
  question: Bajo la ley de Puerto Rico, ¿se permite un giro a la derecha en rojo después
    de una parada completa?
  choices:
    A: No, nunca está permitido
    B: Sí, pero solo entre las 12:00 AM y las 5:00 AM
    C: Sí, a menos que una señal lo prohíba específicamente
    D: Sí, pero solo en zonas rurales
  answer: C
  explanation: En Puerto Rico, los conductores pueden girar a la derecha en rojo después
    de detenerse por completo y ceder el paso al tráfico/peatones, siempre que no
    haya una señal que diga 'No virar en rojo'.
- id: 191
  category: signs_and_signals
  question: ¿Qué significan las líneas amarillas dobles continuas en el centro de
    la carretera?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se prohíbe rebasar en ambas direcciones
    C: La carretera es solo para vehículos de emergencia
    D: Se está acercando a una zona escolar
  answer: B
  explanation: Las líneas amarillas dobles continuas indican que está prohibido rebasar
    para el tráfico que circula en ambas direcciones.
- id: 192
  category: signs_and_signals
  question: ¿Qué indica una línea blanca continua en el borde derecho de la autopista?
  choices:
    A: El borde del carril de circulación (línea de niebla)
    B: Un carril reservado para autobuses
    C: Una zona para rebasar
    D: Un carril exclusivo para peatones
  answer: A
  explanation: Una línea blanca continua en el lado derecho de la carretera marca
    el borde exterior del pavimento, a menudo llamada línea de niebla, y ayuda a guiar
    a los conductores por la noche o en condiciones climáticas adversas.
- id: 193
  category: signs_and_signals
  question: En Puerto Rico, ¿qué significa una flecha verde que se muestra junto con
    una luz roja?
  choices:
    A: Debe detenerse y esperar a que la luz roja cambie a verde
    B: Puede proceder con precaución en la dirección de la flecha
    C: La flecha es solo para peatones
    D: El semáforo está funcionando mal
  answer: B
  explanation: Una flecha verde significa que usted tiene un giro protegido en esa
    dirección, incluso si la luz circular principal está en rojo.
- id: 194
  category: signs_and_signals
  question: 'Las líneas blancas entrecortadas en una autopista de varios carriles
    en Puerto Rico indican:'
  choices:
    A: Tráfico moviéndose en direcciones opuestas
    B: Tráfico moviéndose en la misma dirección, y se permiten los cambios de carril
    C: Un área donde se permite el estacionamiento
    D: Un carril para vehículos de alta ocupación (HOV)
  answer: B
  explanation: Las líneas blancas entrecortadas separan los carriles de tráfico que
    se mueven en la misma dirección donde se permiten los cambios de carril cuando
    es seguro hacerlo.
- id: 195
  category: signs_and_signals
  question: Según la ley de Puerto Rico, entre las 12:00 AM y las 5:00 AM, ¿qué debe
    hacer un conductor ante una luz roja?
  choices:
    A: Esperar a que la luz cambie a verde sin importar la hora.
    B: Detenerse y puede continuar si la intersección está despejada y no se aproximan
      otros vehículos.
    C: Tratarla como una luz amarilla intermitente y reducir la velocidad.
    D: Solo detenerse si hay un oficial de policía presente.
  answer: B
  explanation: La Ley 22 de Puerto Rico permite a los conductores pasar una luz roja
    entre las 12:00 AM y las 5:00 AM después de detenerse por completo y asegurarse
    de que es seguro cruzar.
- id: 196
  category: signs_and_signals
  question: Cuando un conductor extiende su brazo izquierdo horizontalmente fuera
    de la ventana, ¿qué señal está dando?
  choices:
    A: Viraje a la derecha
    B: Viraje a la izquierda
    C: Detenerse o reducir la velocidad
    D: Viraje en U
  answer: B
  explanation: Las señales manuales estándar utilizadas en Puerto Rico dictan que
    un brazo izquierdo extendido horizontalmente significa un viraje a la izquierda.
- id: 197
  category: signs_and_signals
  question: 'En Puerto Rico, un encintado (acera) pintado de amarillo indica:'
  choices:
    A: Se permite estacionar por un máximo de 15 minutos.
    B: Está prohibido estacionar, pero puede usarse para carga y descarga.
    C: El estacionamiento está reservado solo para vehículos de emergencia.
    D: El estacionamiento está permitido solo para residentes.
  answer: B
  explanation: Los encintados amarillos en Puerto Rico generalmente indican una zona
    donde está prohibido estacionar, aunque a menudo se designa para la carga y descarga
    de mercancías o pasajeros.
- id: 198
  category: signs_and_signals
  question: En Puerto Rico, ¿cuál es el significado de un encintado o marca de pavimento
    pintada de azul?
  choices:
    A: Zona de carga para vehículos comerciales.
    B: Estacionamiento solo para vehículos gubernamentales.
    C: Estacionamiento para personas con discapacidades.
    D: Zona de parada de autobuses.
  answer: C
  explanation: Las marcas azules se utilizan para designar espacios de estacionamiento
    reservados específicamente para personas con discapacidades.
- id: 199
  category: signs_and_signals
  question: 'Una línea blanca entrecortada en el pavimento en Puerto Rico indica:'
  choices:
    A: El tráfico se mueve en direcciones opuestas; se permite rebasar.
    B: El tráfico se mueve en la misma dirección; se permiten los cambios de carril.
    C: El borde de la carretera.
    D: Una zona de cruce peatonal.
  answer: B
  explanation: Las líneas blancas entrecortadas separan los carriles de tráfico que
    se mueven en la misma dirección donde se permiten los cambios de carril.
- id: 200
  category: signs_and_signals
  question: Al acercarse a una señal de 'Pare' en Puerto Rico, ¿dónde debe detenerse
    el conductor si no hay una línea de pare pintada en la carretera?
  choices:
    A: En el punto más cercano a la vía que cruza donde el conductor tenga visibilidad
      del tráfico que se aproxima.
    B: 15 pies antes de la señal.
    C: Solo si hay tráfico cruzando.
    D: Después de la señal, en medio de la intersección.
  answer: A
  explanation: Si no hay una línea de pare o un cruce de peatones, el conductor debe
    detenerse en el punto más cercano a la carretera que cruza que permita una visión
    clara del tráfico antes de entrar en la intersección.
