metadata:
  source: Manual del Conductor de Puerto Rico
  total_questions: 200
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What is the minimum age required to apply for a learner's permit in Puerto
    Rico?
  choices:
    A: 15 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: According to Puerto Rico Law 22-2000 (Vehicle and Traffic Law), the
    minimum age to obtain a learner's permit is 16 years old, provided the applicant
    has parental or legal guardian consent.
- id: 2
  category: license_system
  question: A person with a learner's permit in Puerto Rico must be accompanied by
    a licensed driver who is at least what age?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: B
  explanation: Law 22 requires that a person with a learner's permit must be accompanied
    by a driver who is at least 21 years of age and holds a valid driver's license.
- id: 3
  category: license_system
  question: In Puerto Rico, how many points accumulated on a driving record within
    a two-year period will result in a mandatory license suspension?
  choices:
    A: 12 points
    B: 15 points
    C: 20 points
    D: 25 points
  answer: D
  explanation: Under the Puerto Rico point system, if a driver accumulates 25 points
    or more within a period of two years, their driving privilege will be suspended.
- id: 4
  category: license_system
  question: For how many years is a standard driver's license valid in Puerto Rico
    before it must be renewed?
  choices:
    A: 4 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: C
  explanation: Puerto Rico driver's licenses are generally valid for a period of 8
    years from the date of issuance.
- id: 5
  category: license_system
  question: What is the maximum legal Blood Alcohol Concentration (BAC) limit for
    a driver under the age of 21 in Puerto Rico?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Puerto Rico has a zero-tolerance policy for minors; the legal BAC limit
    for drivers under 21 years of age is 0.02%.
- id: 6
  category: license_system
  question: If you change your residential address, how many days do you have to notify
    the Department of Transportation and Public Works (DTOP)?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: Law 22-2000 stipulates that any person holding a driver's license must
    notify DTOP of a change of address within 10 days of the change.
- id: 7
  category: license_system
  question: A learner's permit in Puerto Rico is valid for how long?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: A learner's permit (Certificado de Licencia de Aprendizaje) is valid
    for a maximum period of two years.
- id: 8
  category: license_system
  question: Which of the following is a requirement for obtaining a driver's license
    for the first time in Puerto Rico?
  choices:
    A: A high school diploma
    B: A medical certificate issued by a licensed physician
    C: Proof of vehicle ownership
    D: A letter of recommendation
  answer: B
  explanation: To apply for a license, Puerto Rico requires a medical certificate
    (Certificado Médico) to ensure the applicant is physically fit to drive.
- id: 9
  category: license_system
  question: Between what hours is a person with a learner's permit prohibited from
    driving in Puerto Rico?
  choices:
    A: 9:00 PM to 6:00 AM
    B: 10:00 PM to 5:00 AM
    C: 11:00 PM to 4:00 AM
    D: 12:00 AM to 6:00 AM
  answer: B
  explanation: Drivers with a learner's permit are restricted from driving between
    the hours of 10:00 PM and 5:00 AM.
- id: 10
  category: license_system
  question: What is the fine for failing to use a seat belt in Puerto Rico for the
    driver or any passenger?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: The fine for not wearing a seat belt in Puerto Rico is $100 per person
    who is not properly restrained.
- id: 11
  category: license_system
  question: In Puerto Rico, what is the 'Chofer' (Chauffeur) license category used
    for?
  choices:
    A: Only for driving motorcycles
    B: For driving heavy trucks over 10 tons
    C: For driving private vehicles and commercial vehicles not exceeding 10,000 lbs
    D: Only for driving school buses
  answer: C
  explanation: The 'Chofer' license is a step above the standard 'Conductor' license,
    allowing the operation of motor vehicles with a gross vehicle weight (GVW) up
    to 10,000 lbs, including those used for commercial purposes.
- id: 12
  category: license_system
  question: What is the legal BAC limit for a driver of a commercial vehicle (heavy
    motor vehicle) in Puerto Rico?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: For commercial or heavy vehicle drivers, the legal BAC limit is stricter
    than for private drivers, set at 0.02%.
- id: 13
  category: license_system
  question: How long must a person hold a learner's permit before they can take the
    practical (driving) exam in Puerto Rico?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 6 months
  answer: B
  explanation: An applicant must wait at least 30 days after obtaining their learner's
    permit before they are eligible to take the practical driving test.
- id: 14
  category: license_system
  question: If a driver's license is lost or stolen, what is required to obtain a
    duplicate in Puerto Rico?
  choices:
    A: A verbal statement to the DTOP clerk
    B: A sworn statement (affidavit) before a Notary Public
    C: A letter from the police department only
    D: A new medical certificate
  answer: B
  explanation: To obtain a duplicate license due to loss or theft, the applicant must
    present a sworn statement (affidavit) explaining the circumstances of the loss.
- id: 15
  category: license_system
  question: Which document is mandatory to carry in the vehicle at all times in Puerto
    Rico?
  choices:
    A: The vehicle's title
    B: The vehicle's registration (Licencia del Vehículo)
    C: The vehicle's purchase invoice
    D: A copy of the driver's birth certificate
  answer: B
  explanation: Law 22 requires that the original vehicle registration (Licencia del
    Vehículo) must be kept inside the vehicle or carried by the driver at all times
    while operating the vehicle.
- id: 16
  category: license_system
  question: If you renew your Puerto Rico driver's license more than 30 days after
    it has expired, what is the additional penalty fee you must pay?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: According to Article 3.14 of Law 22 (Ley de Vehículos y Tránsito),
    a penalty of $20 is imposed if the license is renewed more than 30 days after
    its expiration date.
- id: 17
  category: license_system
  question: In Puerto Rico, how many points are assigned to your driving record for
    the violation of 'Reckless Driving' (Conducción Temeraria)?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Under the Puerto Rico point system regulations, reckless driving is
    considered a serious violation and carries a penalty of 6 points.
- id: 18
  category: license_system
  question: How many days before its expiration date are you allowed to begin the
    renewal process for your Puerto Rico driver's license?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: DTOP (Departamento de Transportación y Obras Públicas) allows drivers
    to start the license renewal process up to 60 days before the expiration date.
- id: 19
  category: license_system
  question: Which government agency in Puerto Rico can request the suspension of a
    driver's license due to failure to comply with child support payments?
  choices:
    A: Hacienda
    B: ASUME
    C: AEE
    D: AAA
  answer: B
  explanation: ASUME (Administración para el Sustento de Menores) has the legal authority
    to request the suspension of a driver's license if the individual is in arrears
    with child support payments.
- id: 20
  category: license_system
  question: What is the minimum visual acuity requirement (with or without corrective
    lenses) to obtain a standard driver's license in Puerto Rico?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: To qualify for a driver's license in Puerto Rico, the applicant must
    have a visual acuity of at least 20/40.
- id: 21
  category: license_system
  question: In Puerto Rico, a 'Category 4' driver's license is specifically required
    for operating which type of vehicle?
  choices:
    A: Motorcycles
    B: Private passenger cars
    C: Heavy motor vehicles (Heavy Trucks)
    D: Emergency vehicles only
  answer: C
  explanation: Law 22 classifies licenses by categories; Category 4 is designated
    for drivers of heavy motor vehicles (Vehículos Pesados de Motor).
- id: 22
  category: license_system
  question: If you are a veteran, what must you present to DTOP to have the word 'Veterano'
    printed on your Puerto Rico driver's license?
  choices:
    A: A letter from your local Mayor
    B: Form DD-214 (Discharge Papers)
    C: A valid US Passport
    D: A voter registration card
  answer: B
  explanation: To receive the veteran designation on a Puerto Rico license, the applicant
    must provide the DD-214 form proving honorable discharge.
- id: 23
  category: license_system
  question: Under Law 22, what is the legal status of the 'CESCO Digital' mobile application
    license in Puerto Rico?
  choices:
    A: It is only for viewing fines and cannot be used as ID
    B: It is a valid legal substitute for the physical license
    C: It is only valid for drivers over age 65
    D: It is only valid if you also carry a paper copy
  answer: B
  explanation: Law 144-2019 authorized the digital license via the CESCO Digital app
    to be as legally valid as the physical plastic license for all purposes in Puerto
    Rico.
- id: 24
  category: license_system
  question: What is the required endorsement code on a Puerto Rico driver's license
    to legally operate a motorcycle?
  choices:
    A: Category M
    B: Category 1
    C: Category 5
    D: Category A
  answer: A
  explanation: To operate a motorcycle in Puerto Rico, a driver must have the 'M'
    (Motorcycle) endorsement or category on their license.
- id: 25
  category: license_system
  question: When applying for a REAL ID-compliant license in Puerto Rico, which of
    these is a mandatory document to prove Social Security identity?
  choices:
    A: A photocopy of the Social Security card
    B: The original Social Security card or a W-2 form
    C: A verbal statement of the number
    D: A credit card statement
  answer: B
  explanation: For REAL ID compliance in PR, applicants must present original documents
    such as the Social Security card, a W-2, or an SSA-1099 form.
- id: 26
  category: license_system
  question: If a driver is caught driving with a license that has been suspended or
    revoked, what is the minimum fine for a first offense in Puerto Rico?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: Driving with a suspended or revoked license is a serious violation
    in Puerto Rico, carrying a minimum fine of $300 for the first offense.
- id: 27
  category: license_system
  question: In Puerto Rico, how long does a tourist from a US State have to use their
    out-of-state license before they must apply for a local license?
  choices:
    A: 30 days
    B: 90 days
    C: 120 days
    D: 180 days
  answer: C
  explanation: Under Law 22, a person with a valid license from a US jurisdiction
    is considered a 'transient' and can drive in Puerto Rico for up to 120 days.
- id: 28
  category: license_system
  question: What happens if a driver fails to pay a traffic fine within 30 days of
    the citation in Puerto Rico?
  choices:
    A: The fine is automatically cancelled
    B: The driver is arrested immediately
    C: A surcharge/interest is added to the fine amount
    D: The vehicle is impounded
  answer: C
  explanation: If traffic fines are not paid within 30 days, interest and surcharges
    are applied to the original amount of the ticket.
- id: 29
  category: license_system
  question: For a 'Category 8' license (Heavy Motor Vehicle - Trailer), what is the
    minimum age requirement in Puerto Rico?
  choices:
    A: 18 years old
    B: 19 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: To obtain a Category 8 license for heavy trailer-type motor vehicles,
    the applicant must be at least 21 years of age.
- id: 30
  category: driver_testing
  question: In Puerto Rico, what is the maximum speed limit in an urban school zone?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: According to Puerto Rico Vehicle and Traffic Law (Law 22), the speed
    limit in an urban school zone is 15 mph.
- id: 31
  category: driver_testing
  question: According to Puerto Rico law, what is the minimum percentage of light
    transmission required for window tinting on the windshield and front side windows?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: Law 22, Article 10.05, specifies that window tints must allow at least
    35% of light transmission.
- id: 32
  category: driver_testing
  question: What is the fine for parking a vehicle in a designated space for people
    with disabilities without a valid permit in Puerto Rico?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Parking in a spot reserved for persons with disabilities without a
    proper permit results in a $250 fine.
- id: 33
  category: driver_testing
  question: In Puerto Rico, what is the fine for using a handheld mobile phone while
    driving?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: B
  explanation: The fine for using a handheld mobile phone while operating a motor
    vehicle is $100.
- id: 34
  category: driver_testing
  question: How many points are assigned to a driver's record for illegally passing
    a school bus that is stopped to pick up or drop off students?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Illegally passing a school bus results in 4 points being added to the
    driver's record.
- id: 35
  category: driver_testing
  question: What is the maximum speed limit in a rural area in Puerto Rico unless
    otherwise posted?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: In rural areas, the default speed limit is 45 mph unless signs indicate
    a different limit.
- id: 36
  category: driver_testing
  question: If you are caught speeding in Puerto Rico, the fine is $100 plus an additional
    amount for every mile per hour over the limit. What is that additional amount?
  choices:
    A: $5 per mile
    B: $10 per mile
    C: $20 per mile
    D: $50 per mile
  answer: B
  explanation: The basic fine for speeding is $100, plus $10 for each mile per hour
    in excess of the speed limit.
- id: 37
  category: driver_testing
  question: What is the standard fine for a first-time DUI (Driving Under the Influence)
    conviction in Puerto Rico?
  choices:
    A: $100 to $300
    B: $300 to $500
    C: $500 to $750
    D: $1,000 to $2,000
  answer: B
  explanation: A first DUI offense carries a fine ranging from $300 to $500, plus
    additional fees for the trauma fund and mandatory attendance at an alcohol education
    program.
- id: 38
  category: driver_testing
  question: In Puerto Rico, it is illegal to park a vehicle within how many meters
    of a fire hydrant?
  choices:
    A: 2 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: Law 22 prohibits parking within 5 meters (approximately 16 feet) of
    a fire hydrant.
- id: 39
  category: driver_testing
  question: What is the maximum speed limit allowed on expressways in Puerto Rico?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 75 mph
  answer: C
  explanation: The maximum speed limit on expressways in Puerto Rico is 65 mph.
- id: 40
  category: driver_testing
  question: How many points are added to your driving record for failing to stop at
    a red light?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Failing to stop at a red light results in 3 points being added to the
    driver's record.
- id: 41
  category: driver_testing
  question: When applying for a driver's license in Puerto Rico, the required medical
    certificate must have been issued within how many days of the application?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: The medical certificate required for the license application is valid
    for 30 days from the date of the physical examination.
- id: 42
  category: driver_testing
  question: What is the minimum fine for throwing litter or trash from a vehicle onto
    a public road in Puerto Rico?
  choices:
    A: $50
    B: $110
    C: $250
    D: $500
  answer: B
  explanation: Under Law 22, the fine for littering from a vehicle starts at $110.
- id: 43
  category: driver_testing
  question: In Puerto Rico, you must signal your intention to turn at least how many
    feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Drivers are required to give a continuous signal for at least 100 feet
    before turning.
- id: 44
  category: driver_testing
  question: Under Puerto Rico law, between what hours is a driver permitted to treat
    a red light as a 'Stop' sign (stop and then proceed if clear)?
  choices:
    A: 10:00 PM to 4:00 AM
    B: 11:00 PM to 5:00 AM
    C: 12:00 AM to 5:00 AM
    D: This is never permitted in Puerto Rico
  answer: C
  explanation: Law 22 allows drivers to proceed through a red light after stopping
    and ensuring it is safe between the hours of 12:00 AM and 5:00 AM.
- id: 45
  category: driver_testing
  question: In Puerto Rico, what is the minimum distance a vehicle must be parked
    from a fire hydrant?
  choices:
    A: 5 feet (1.5 meters)
    B: 10 feet (3 meters)
    C: 16 feet (5 meters)
    D: 20 feet (6 meters)
  answer: C
  explanation: Puerto Rico traffic law requires vehicles to be parked at least 5 meters
    (approximately 16 feet) away from a fire hydrant.
- id: 46
  category: driver_testing
  question: When parking a vehicle parallel to a curb in Puerto Rico, what is the
    maximum allowable distance between the tires and the curb?
  choices:
    A: 6 inches (15 cm)
    B: 12 inches (30 cm)
    C: 18 inches (45 cm)
    D: 24 inches (60 cm)
  answer: B
  explanation: Drivers must park parallel to the curb and no more than 12 inches (30
    centimeters) away from it.
- id: 47
  category: driver_testing
  question: According to Law 22, children of what age and younger must be secured
    in a federally approved child restraint system (car seat) in Puerto Rico?
  choices:
    A: Under 4 years old
    B: Under 6 years old
    C: Under 8 years old
    D: Under 10 years old
  answer: A
  explanation: In Puerto Rico, children under 4 years old must use a child restraint
    system. Children between 4 and 9 years old must use a booster seat.
- id: 48
  category: driver_testing
  question: In Puerto Rico, the 'Marbete' (vehicle registration sticker) must be renewed
    annually. When does it expire?
  choices:
    A: On the owner's birthday
    B: On December 31st of every year
    C: At the end of the month in which the vehicle was originally registered
    D: Exactly one year from the date of purchase
  answer: C
  explanation: The Marbete expires on the last day of the month in which the vehicle
    was first registered in the Puerto Rico system.
- id: 49
  category: driver_testing
  question: What is the fine for passing a school bus while it is stopped to pick
    up or drop off children in Puerto Rico?
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: C
  explanation: Illegally passing a school bus that is loading or unloading children
    results in a $300 fine in Puerto Rico.
- id: 50
  category: driver_responsibility
  question: In Puerto Rico, what is the maximum property damage coverage provided
    by the Compulsory Liability Insurance (Seguro de Responsabilidad Obligatorio -
    SRO)?
  choices:
    A: $3,000
    B: $4,000
    C: $5,000
    D: $10,000
  answer: B
  explanation: According to Law 253-1995 (Compulsory Liability Insurance), the SRO
    covers up to $4,000 for damages caused to third-party vehicles or property in
    a single accident.
- id: 51
  category: driver_responsibility
  question: Under Puerto Rico Law 22, if you are involved in a traffic accident where
    property damage exceeds what amount, must you report it to the Police?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Puerto Rico Law 22 (Vehicle and Traffic Law) requires that any accident
    resulting in injury, death, or property damage exceeding $500 must be reported
    to the Police immediately.
- id: 52
  category: driver_responsibility
  question: What is the fine for driving a motor vehicle on Puerto Rico public roads
    with an expired registration sticker (marbete)?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Article 10.05 of Law 22 establishes a fine of $500 for operating a
    vehicle with an expired registration sticker (marbete).
- id: 53
  category: driver_responsibility
  question: When selling a vehicle in Puerto Rico, within how many days must the seller
    notify the DTOP of the transfer of ownership?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: The seller of a vehicle is responsible for notifying the Department
    of Transportation and Public Works (DTOP) within 10 days of the sale to ensure
    the record is updated and they are not held liable for future fines.
- id: 54
  category: driver_responsibility
  question: How much is the standard annual premium for the Compulsory Liability Insurance
    (SRO) for a private passenger vehicle in Puerto Rico?
  choices:
    A: $65
    B: $99
    C: $148
    D: $200
  answer: B
  explanation: The current standard premium for the Compulsory Liability Insurance
    (SRO) for private passenger vehicles is $99, which is paid at the time of renewing
    the annual registration sticker (marbete).
- id: 55
  category: driver_responsibility
  question: Under the 'Implied Consent' law in Puerto Rico, what happens if a driver
    refuses to submit to a chemical test for alcohol or drugs?
  choices:
    A: No penalty if it is the first time
    B: A fine of $100 only
    C: Immediate license suspension and potential arrest
    D: The driver is allowed to call a lawyer before deciding
  answer: C
  explanation: By driving in Puerto Rico, you give 'implied consent' to chemical testing.
    Refusal results in immediate license suspension and the driver can be detained
    for the test to be administered by judicial order.
- id: 56
  category: driver_responsibility
  question: In the event of a minor accident with no injuries where the vehicles are
    obstructing traffic, what does Puerto Rico law require?
  choices:
    A: Leave the vehicles exactly where they are until the police arrive
    B: Move the vehicles to the shoulder or a safe area to restore traffic flow
    C: Wait for the insurance adjusters to arrive before moving
    D: Only the police are authorized to move the vehicles
  answer: B
  explanation: Law 22 requires drivers to move vehicles if they are obstructing traffic
    and there are no serious injuries. Failure to do so can result in a fine.
- id: 57
  category: driver_responsibility
  question: If a vehicle owner in Puerto Rico has private liability insurance that
    meets or exceeds the SRO requirements, what must they do to avoid paying the SRO
    fee?
  choices:
    A: Nothing, the SRO is mandatory for everyone regardless of private insurance
    B: Present proof of private insurance to the DTOP or bank during registration
      renewal
    C: Request a refund from the Treasury Department after paying it
    D: Only commercial vehicles can opt out of SRO
  answer: B
  explanation: Vehicle owners with private insurance can opt out of the SRO by presenting
    a valid 'Voucher' or proof of insurance during the registration (marbete) renewal
    process.
- id: 58
  category: driver_responsibility
  question: What is the fine for driving a vehicle in Puerto Rico with a license plate
    (tablilla) that is intentionally obscured or unreadable?
  choices:
    A: $25
    B: $50
    C: $100
    D: $150
  answer: C
  explanation: Law 22 stipulates a fine of $100 for driving with license plates that
    are obscured, altered, or not clearly visible.
- id: 59
  category: driver_responsibility
  question: In Puerto Rico, at what age must a vehicle undergo a mandatory mechanical
    inspection (inspección) before renewing its registration?
  choices:
    A: Every year regardless of age
    B: After the first year of manufacture
    C: After more than two years of manufacture
    D: Only after five years of manufacture
  answer: C
  explanation: Vehicles in Puerto Rico that have more than two years of manufacture
    are required to pass a mechanical inspection at an authorized center before the
    annual registration (marbete) can be renewed.
- id: 60
  category: driver_responsibility
  question: What is the fine for failing to notify the DTOP of a change of residential
    address within the legally required timeframe?
  choices:
    A: $30
    B: $50
    C: $100
    D: $200
  answer: A
  explanation: Failure to notify the DTOP of an address change within 30 days results
    in an administrative fine of $30.
- id: 61
  category: driver_responsibility
  question: How many days does a driver have to file a claim with the Compulsory Liability
    Insurance (SRO) after an accident?
  choices:
    A: 24 hours
    B: 5 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: To benefit from the Compulsory Liability Insurance (SRO), the accident
    must be reported to the insurer within 5 days of the occurrence.
- id: 62
  category: driver_responsibility
  question: In Puerto Rico, who is financially responsible for any damage caused to
    public property (such as traffic lights or lamp posts) during an accident?
  choices:
    A: The government covers all public property damage
    B: The driver who caused the damage
    C: The ACAA (Automobile Accident Compensation Administration)
    D: Only the driver's private insurance, otherwise it is not paid
  answer: B
  explanation: The driver responsible for the accident is liable for damages to public
    property. The SRO or private insurance may cover these costs up to the policy
    limit, but the driver is ultimately responsible.
- id: 63
  category: driver_responsibility
  question: What certificate is required to prove that a vehicle owner does not owe
    money to the Automobile Accident Compensation Administration (ACAA) before renewing
    the marbete?
  choices:
    A: Certificado de Antecedentes Penales
    B: Certificado de Deuda de ACAA
    C: Certificado de Inspección
    D: No specific certificate is needed; it is checked electronically
  answer: D
  explanation: While owners must be clear of debts, the DTOP system electronically
    verifies 'No Deuda' (No Debt) status for ACAA, ASUME, and traffic fines during
    the digital marbete renewal process.
- id: 64
  category: driver_responsibility
  question: If you are involved in a traffic accident in Puerto Rico where property
    damage occurs and the parties cannot agree, at what minimum estimated damage value
    must the police be notified?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Under Puerto Rico Law 22 (Vehicle and Traffic Law), accidents involving
    property damage estimated at $100 or more must be reported to the police if the
    involved parties do not reach an agreement.
- id: 65
  category: driver_responsibility
  question: When a vehicle is sold in Puerto Rico, how many days does the purchaser
    have to notify the DTOP and complete the transfer of the vehicle's title?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: Puerto Rico law requires that the transfer of ownership of a motor
    vehicle be completed within 10 days of the sale.
- id: 66
  category: driver_responsibility
  question: What is the primary function of the ACAA (Administración de Compensaciones
    por Accidentes de Automóviles) fee paid during vehicle registration?
  choices:
    A: To cover damages to the vehicle's bodywork
    B: To provide no-fault medical coverage for injuries sustained in traffic accidents
    C: To pay for legal fees in case of a lawsuit
    D: To cover the cost of towing services
  answer: B
  explanation: ACAA is a 'no-fault' insurance system in Puerto Rico that provides
    medical and hospital benefits to victims of traffic accidents, regardless of who
    was at fault.
- id: 67
  category: driver_responsibility
  question: When renewing a vehicle's registration (marbete), can the owner opt out
    of the government's Compulsory Liability Insurance (SRO)?
  choices:
    A: No, it is mandatory for everyone without exception
    B: Yes, but only if the vehicle is more than 10 years old
    C: Yes, if they provide proof of a private liability policy with equal or greater
      coverage
    D: Yes, if they sign a waiver of financial responsibility
  answer: C
  explanation: Vehicle owners can choose a private insurance policy instead of the
    SRO, provided the private policy meets the minimum coverage requirements required
    by law.
- id: 68
  category: driver_responsibility
  question: If you are involved in a minor accident with no injuries and the vehicles
    are obstructing traffic on a main highway, what does Puerto Rico law require you
    to do?
  choices:
    A: Leave the vehicles exactly where they are until the police arrive
    B: Move the vehicles to the shoulder or a safe area to avoid obstructing traffic
    C: Wait for an insurance adjuster to arrive before moving
    D: Abandon the vehicle and walk to the nearest police station
  answer: B
  explanation: Law 22 requires drivers to move vehicles involved in minor accidents
    (no injuries) to a safe location or the shoulder to maintain traffic flow and
    safety.
- id: 69
  category: driver_responsibility
  question: What is the fine for failing to transport a child under the age of 4 in
    a federally certified child safety seat in Puerto Rico?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Failure to use a proper child safety seat for children under 4 years
    old results in a $500 fine.
- id: 70
  category: driver_responsibility
  question: What is the fine for a first-time offense of participating in illegal
    street racing (regateo) in Puerto Rico?
  choices:
    A: $500
    B: $1,000
    C: $3,000
    D: $5,000
  answer: D
  explanation: Illegal street racing (regateo) is a serious offense in Puerto Rico,
    carrying a $5,000 fine and a mandatory 6-month license suspension for the first
    offense.
- id: 71
  category: driver_responsibility
  question: In Puerto Rico, how is the expiration month of a vehicle's 'marbete' (registration
    sticker) determined?
  choices:
    A: It always expires in December
    '|B': It expires on the owner's birthday
    C: It is based on the month the vehicle was originally registered in the system
    D: It is based on the last digit of the license plate
  answer: C
  explanation: The registration (marbete) expiration is determined by the month the
    vehicle was first registered in Puerto Rico and remains the same for that vehicle
    annually.
- id: 72
  category: safe_driving_rules
  question: In Puerto Rico, what is the standard speed limit in an urban zone (zona
    urbana) unless otherwise posted?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: According to Puerto Rico Vehicle and Traffic Law (Law 22), the speed
    limit in urban zones is 25 mph unless signs indicate otherwise.
- id: 73
  category: safe_driving_rules
  question: What is the speed limit in a school zone located within an urban area
    during school hours?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: In Puerto Rico, the speed limit in an urban school zone is 15 mph during
    the hours specified by the Department of Transportation.
- id: 74
  category: safe_driving_rules
  question: According to Puerto Rico's speeding fine structure, what is the base fine
    for speeding, plus the additional cost for every mile per hour over the limit?
  choices:
    A: $50 base + $5 per mile
    B: $100 base + $5 per mile
    C: $100 base + $10 per mile
    D: $200 base + $20 per mile
  answer: C
  explanation: In Puerto Rico, the fine for speeding is $100 plus $10 for every mile
    per hour in excess of the speed limit.
- id: 75
  category: safe_driving_rules
  question: What is the specific fine in Puerto Rico for driving a vehicle at a speed
    of 100 mph or greater?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: Under Puerto Rico Law 22, driving at 100 mph or more is considered
    a serious violation and carries a flat fine of $1,000.
- id: 76
  category: safe_driving_rules
  question: When parking a vehicle on a public road in Puerto Rico, how many feet
    must you maintain from a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: It is illegal to park a vehicle within 15 feet (approximately 5 meters)
    of a fire hydrant in Puerto Rico.
- id: 77
  category: safe_driving_rules
  question: In Puerto Rico, between what hours is it permitted to proceed through
    a red light after stopping and ensuring it is safe, similar to a stop sign?
  choices:
    A: 10:00 PM to 4:00 AM
    B: 11:00 PM to 5:00 AM
    C: 12:00 AM to 5:00 AM
    D: 1:00 AM to 6:00 AM
  answer: C
  explanation: Between 12:00 AM and 5:00 AM, drivers in Puerto Rico may treat a red
    light as a stop sign, proceeding only after coming to a complete stop and ensuring
    no other vehicles or pedestrians are approaching.
- id: 78
  category: safe_driving_rules
  question: What is the fine for parking on a yellow line in Puerto Rico?
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: C
  explanation: Parking on a yellow line is a violation of traffic laws in Puerto Rico
    and results in a $50 fine.
- id: 79
  category: safe_driving_rules
  question: In Puerto Rico, children between the ages of 4 and 9 must use a booster
    seat unless they reach what height?
  choices:
    A: 4 feet 5 inches
    B: 4 feet 9 inches
    C: 5 feet
    D: 5 feet 2 inches
  answer: B
  explanation: Children aged 4 to 9 must use a booster seat unless they are at least
    4 feet 9 inches tall.
- id: 80
  category: safe_driving_rules
  question: When approaching a heavy motor vehicle (truck) or bus from the opposite
    direction, you must dim your high beams when you are within how many feet?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Drivers must switch from high beams to low beams when an oncoming vehicle
    is within 500 feet to avoid blinding the other driver.
- id: 81
  category: safe_driving_rules
  question: How far in advance must you activate your turn signal before making a
    turn in Puerto Rico?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 150 feet
  answer: C
  explanation: Drivers are required to signal their intent to turn at least 100 feet
    before reaching the intersection or turn point.
- id: 82
  category: safe_driving_rules
  question: What is the speed limit in a school zone in Puerto Rico during hours when
    students are arriving or leaving?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The speed limit in school zones is 15 mph as established by Puerto
    Rico traffic regulations.
- id: 83
  category: safe_driving_rules
  question: How far must you park from a fire hydrant (bomba de incendio) in Puerto
    Rico?
  choices:
    A: 2 meters (approx. 6 feet)
    B: 3 meters (approx. 10 feet)
    C: 5 meters (approx. 16 feet)
    D: 10 meters (approx. 32 feet)
  answer: C
  explanation: Law 22 prohibits parking within 5 meters (approximately 16 feet) of
    a fire hydrant.
- id: 84
  category: safe_driving_rules
  question: When parking parallel to a curb in Puerto Rico, the vehicle must be no
    further than how many inches from the sidewalk/curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: Vehicles must be parked parallel to the curb and no more than 12 inches
    (approximately 30 cm) away from it.
- id: 85
  category: safe_driving_rules
  question: In Puerto Rico, what is the fine for driving on the shoulder of the road
    (el paseo) illegally?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Driving on the shoulder (paseo) to bypass traffic is a violation that
    carries a $250 fine.
- id: 86
  category: safe_driving_rules
  question: Under what condition is a right turn on a red light permitted in Puerto
    Rico?
  choices:
    A: It is never permitted.
    B: Only between 12:00 AM and 5:00 AM.
    C: After coming to a complete stop and yielding to pedestrians/traffic, unless
      a sign prohibits it.
    D: Only if there are no other cars at the intersection.
  answer: C
  explanation: Right turns on red are permitted after a full stop and yielding, provided
    there is no signage indicating 'No Turn on Red'.
- id: 87
  category: safe_driving_rules
  question: When an emergency vehicle (ambulance, police, fire) is approaching with
    sirens and lights, what should a driver in Puerto Rico do?
  choices:
    A: Speed up to stay ahead of the vehicle.
    B: Stop immediately in the lane they are currently in.
    C: Move to the right as far as possible and stop.
    D: Move to the left shoulder and stop.
  answer: C
  explanation: Drivers must yield the right of way by moving to the right-hand edge
    of the road and stopping until the emergency vehicle has passed.
- id: 88
  category: safe_driving_rules
  question: In Puerto Rico, how many meters must you maintain as a minimum distance
    when parking from the entrance of a fire station?
  choices:
    A: 3 meters
    B: 6 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: Parking is prohibited within 6 meters (approximately 20 feet) of the
    entrance to a fire station.
- id: 89
  category: safe_driving_rules
  question: What happens to traffic fines incurred in a highway construction or maintenance
    zone where workers are present in Puerto Rico?
  choices:
    A: They are waived for first-time offenders.
    B: They are reduced by half.
    C: They are doubled.
    D: They remain the same as standard fines.
  answer: C
  explanation: Under Puerto Rico law, fines for traffic violations committed in work
    zones while workers are present are doubled.
- id: 90
  category: safe_driving_rules
  question: When two vehicles arrive at an intersection without signals or signs at
    the same time, which driver has the right of way in Puerto Rico?
  choices:
    A: The driver on the left.
    B: The driver on the right.
    C: The driver traveling at a higher speed.
    D: The driver of the larger vehicle.
  answer: B
  explanation: At intersections with no signals or signs, the driver of the vehicle
    on the left must yield the right of way to the vehicle on the right.
- id: 91
  category: defensive_driving
  question: According to the Puerto Rico Vehicle and Traffic Law, at what distance
    must you dim your high-beam headlights when approaching an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: In Puerto Rico, drivers must switch from high beams to low beams when
    an oncoming vehicle is within 500 feet to avoid blinding the other driver.
- id: 92
  category: defensive_driving
  question: In Puerto Rico, when following another vehicle from behind at night, at
    what distance should you switch to low-beam headlights?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: Under Puerto Rico traffic laws, you must dim your high beams when following
    another vehicle within a distance of 200 feet.
- id: 93
  category: defensive_driving
  question: What is the basic fine for exceeding the speed limit in a school zone
    in Puerto Rico?
  choices:
    A: $50 plus $5 for each additional mile
    B: $100 plus $10 for each additional mile
    C: $200 plus $10 for each additional mile
    D: $250 plus $20 for each additional mile
  answer: C
  explanation: Speeding in a school zone in Puerto Rico carries a higher penalty of
    $200 as a base fine, plus $10 for every mile per hour over the limit.
- id: 94
  category: defensive_driving
  question: When driving in heavy rain or fog in Puerto Rico, which headlights should
    you use to maintain the best visibility and safety?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: No lights are required during the day
  answer: B
  explanation: Low beams should be used in rain or fog. High beams reflect off the
    water droplets or fog, creating glare and reducing visibility for the driver.
- id: 95
  category: defensive_driving
  question: In Puerto Rico, what is the recommended 'following distance' rule to maintain
    between your car and the vehicle in front of you under normal conditions?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The five-second rule
    D: 10 feet for every 10 mph
  answer: B
  explanation: The Puerto Rico driver's manual recommends the 'two-second rule' as
    a safe following distance under normal driving conditions to allow enough time
    to react to hazards.
- id: 96
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet Puerto Rico highway, what
    is the correct defensive driving response?
  choices:
    A: Brake hard immediately to regain traction
    B: Turn the steering wheel sharply toward the shoulder
    C: Ease your foot off the accelerator and maintain a straight course
    D: Accelerate slightly to push through the water
  answer: C
  explanation: If hydroplaning, you should not brake or turn suddenly. Gradually release
    the accelerator to slow down until the tires regain contact with the road.
- id: 97
  category: defensive_driving
  question: To practice proper scanning and situational awareness, a driver in Puerto
    Rico should look ahead at least how many seconds?
  choices:
    A: 3 to 5 seconds
    B: 5 to 8 seconds
    C: 10 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Defensive driving guidelines in Puerto Rico suggest looking 10 to 15
    seconds ahead to identify potential hazards before you reach them.
- id: 98
  category: defensive_driving
  question: According to Puerto Rico's Ley de Vehículos y Tránsito, what is the penalty
    for speeding in a designated construction zone when workers are present?
  choices:
    A: The standard fine is tripled
    B: The standard fine is doubled
    C: A flat fee of $500
    D: Mandatory license suspension for 30 days
  answer: B
  explanation: Under Article 5.02 of Law 22, fines for traffic violations in construction
    zones are doubled to protect workers and drivers.
- id: 99
  category: defensive_driving
  question: 'When an emergency vehicle with activated sirens and flashing lights approaches
    you from behind on a Puerto Rico road, you must:'
  choices:
    A: Speed up to stay ahead of it
    B: Stop exactly where you are in the lane
    C: Move to the right edge of the road and stop
    D: Turn on your hazard lights and continue at the same speed
  answer: C
  explanation: Drivers must yield the right of way to emergency vehicles by moving
    as far to the right as possible and stopping until the vehicle has passed.
- id: 100
  category: defensive_driving
  question: Under Puerto Rico law, headlights must be turned on during which of the
    following times?
  choices:
    A: Only from midnight to 6:00 AM
    B: From sunset to sunrise
    C: Only when it is raining heavily
    D: From one hour after sunset to one hour before sunrise
  answer: B
  explanation: Headlights are required to be on from sunset to sunrise, or whenever
    visibility is poor (less than 500 feet).
- id: 101
  category: defensive_driving
  question: According to the Puerto Rico Vehicle and Traffic Law, what is the recommended
    following distance behind the vehicle in front of you under normal conditions?
  choices:
    A: One car length for every 20 mph
    B: At least three seconds
    C: Exactly 50 feet
    D: Two car lengths regardless of speed
  answer: B
  explanation: The Puerto Rico driver's manual recommends maintaining a minimum following
    distance of at least three seconds to allow enough time to react to emergencies.
- id: 102
  category: defensive_driving
  question: In Puerto Rico, when driving at night, you must dim your high-beam headlights
    when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Under Act 22 (Vehicle and Traffic Law of Puerto Rico), drivers must
    switch to low beams when an oncoming vehicle is within 500 feet to avoid blinding
    the other driver.
- id: 103
  category: defensive_driving
  question: When following another vehicle at night in Puerto Rico, at what distance
    should you dim your high beams to avoid blinding the driver ahead through their
    rearview mirror?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: Puerto Rico traffic laws require drivers to dim high beams when following
    another vehicle within a distance of 200 feet.
- id: 104
  category: defensive_driving
  question: During heavy tropical rain in Puerto Rico, hydroplaning can occur. At
    what speed can tires start to lose contact with the road surface on wet pavement?
  choices:
    A: Starting at 35 mph
    B: Only above 65 mph
    C: Starting at 55 mph
    D: Only when braking suddenly
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph when water on the
    road causes the tires to lose contact with the pavement.
- id: 105
  category: defensive_driving
  question: To maintain good 'visual lead' and practice defensive driving in Puerto
    Rico, how far ahead should you scan the road?
  choices:
    A: 2 to 5 seconds
    B: 5 to 8 seconds
    C: 10 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: Defensive driving manuals in Puerto Rico suggest scanning 10 to 15
    seconds ahead to identify potential hazards before you reach them.
- id: 106
  category: defensive_driving
  question: If you are driving on a Puerto Rico highway and experience a mechanical
    failure, where should you place emergency warning triangles or flares?
  choices:
    A: Only directly behind the bumper
    B: 10 feet and 100 feet behind the vehicle
    C: At 50, 100, and 150 feet behind the vehicle
    D: On top of the roof of the car
  answer: B
  explanation: For safety on high-speed roads, it is recommended to place warning
    devices at intervals (typically 10 and 100 feet) to give oncoming traffic sufficient
    time to react.
- id: 107
  category: defensive_driving
  question: When entering a 'Glorieta' (roundabout) in Puerto Rico, who has the right
    of way?
  choices:
    A: The vehicle entering the roundabout
    B: The vehicle already inside the roundabout
    C: The vehicle traveling at the highest speed
    D: The vehicle approaching from the left
  answer: B
  explanation: In Puerto Rico, vehicles already circulating within the roundabout
    have the right of way over those attempting to enter.
- id: 108
  category: defensive_driving
  question: In Puerto Rico, what is the base fine for general speeding (not in a school
    zone)?
  choices:
    A: $50 plus $5 per mile over
    B: $100 plus $10 per mile over
    C: $150 plus $20 per mile over
    D: $25 plus $5 per mile over
  answer: B
  explanation: The standard fine for speeding in Puerto Rico is $100 as a base, plus
    an additional $10 for every mile per hour exceeded.
- id: 109
  category: defensive_driving
  question: If your vehicle starts to skid on a slippery road in Puerto Rico, what
    is the correct defensive driving technique?
  choices:
    A: Brake hard immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Turn the steering wheel in the same direction the rear of the car is sliding
    D: Accelerate to regain traction
  answer: C
  explanation: To recover from a skid, you should steer in the direction the rear
    of the vehicle is sliding and avoid slamming on the brakes.
- id: 110
  category: defensive_driving
  question: In Puerto Rico, when approaching a railroad crossing, what is the minimum
    distance you must stop from the nearest rail if a signal is flashing?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 50 feet
  answer: C
  explanation: Drivers must stop at a distance of no less than 15 feet and no more
    than 50 feet from the nearest rail at a railroad crossing when warnings are active.
- id: 111
  category: alcohol_drugs_health
  question: What is the base fine for a first-time DUI conviction in Puerto Rico (excluding
    additional surcharges based on BAC level)?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: C
  explanation: For a first DUI offense in Puerto Rico, the base fine is $500, plus
    an additional $50 for every hundredth of a percent over the legal limit.
- id: 112
  category: alcohol_drugs_health
  question: What is the fine for having an open container of an alcoholic beverage
    in the passenger compartment of a motor vehicle on a public highway in Puerto
    Rico?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Puerto Rico Law 22 prohibits open containers of alcohol in the passenger
    area of a vehicle, carrying a fine of $100 for each violation.
- id: 113
  category: alcohol_drugs_health
  question: A second DUI conviction within a five-year period in Puerto Rico carries
    a mandatory jail term of how many days?
  choices:
    A: 1 to 5 days
    B: 5 to 10 days
    C: 15 to 30 days
    D: 60 to 90 days
  answer: C
  explanation: A second DUI offense within five years in Puerto Rico results in a
    mandatory jail sentence ranging from 15 to 30 days.
- id: 114
  category: alcohol_drugs_health
  question: In Puerto Rico, if a person is convicted of driving under the influence
    and causes 'serious bodily harm' to another person, what is the potential imprisonment
    term?
  choices:
    A: 6 months fixed
    B: 18 months fixed
    C: 5 years fixed
    D: 10 years fixed
  answer: B
  explanation: Under Law 22, a DUI resulting in serious bodily harm is a felony with
    a fixed imprisonment term of 18 months.
- id: 115
  category: alcohol_drugs_health
  question: What is the penalty for a driver in Puerto Rico who is caught driving
    under the influence with a passenger under the age of 15 in the vehicle?
  choices:
    A: The fine is reduced because of the passenger.
    B: The fine and penalties are doubled.
    C: A flat fine of $1,000 is applied regardless of BAC.
    D: The driver's license is suspended for only 10 days.
  answer: B
  explanation: If a DUI is committed while a minor under 15 (or a person with physical/mental
    disabilities) is in the vehicle, the fines and penalties established by law are
    doubled.
- id: 116
  category: alcohol_drugs_health
  question: What happens to the driver's license of a person convicted of a third
    DUI offense in Puerto Rico?
  choices:
    A: Suspended for 1 year
    )B: Suspended for 2 years
    C: Suspended for 5 years
    D: Permanent revocation
  answer: D
  explanation: A third DUI conviction in Puerto Rico results in the permanent revocation
    of the driver's license.
- id: 117
  category: alcohol_drugs_health
  question: 'In Puerto Rico, driving under the influence of controlled substances
    (drugs) carries the same penalties as:'
  choices:
    A: A simple traffic ticket
    B: A first-degree felony
    C: The highest level of BAC (alcohol) violation
    D: A seat belt violation
  answer: C
  explanation: Driving under the influence of drugs or controlled substances in Puerto
    Rico is penalized with the same severity as the highest tier of alcohol-related
    DUI offenses.
- id: 118
  category: alcohol_drugs_health
  question: For a first-time DUI offense in Puerto Rico, what is the mandatory license
    suspension period?
  choices:
    A: 15 days
    B: 30 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: A first-time DUI conviction in Puerto Rico includes a mandatory license
    suspension of 30 days.
- id: 119
  category: alcohol_drugs_health
  question: If a driver's BAC is 0.12%, how much extra will they be fined in Puerto
    Rico on top of the base $500 fine for a first offense?
  choices:
    A: $50
    B: $100
    C: $200
    D: $400
  answer: C
  explanation: The law adds $50 for every 0.01% over the 0.08% limit. Since 0.12%
    is 0.04% over the limit (4 units of 0.01%), the additional fine is 4 x $50 = $200.
- id: 120
  category: alcohol_drugs_health
  question: When applying for or renewing a license in Puerto Rico, a medical certificate
    is required. How long is this certificate valid from the date of issuance?
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: The medical certificate required for driver licensing in Puerto Rico
    must be issued within 6 months prior to the application date.
- id: 121
  category: alcohol_drugs_health
  question: 'In Puerto Rico, if you are taking prescription medication that impairs
    your ability to drive safely, you should:'
  choices:
    A: Drive only during the daytime
    B: Drive only on secondary roads
    C: Not drive at all
    D: Drink coffee to counteract the effects
  answer: C
  explanation: It is illegal and unsafe to operate a motor vehicle in Puerto Rico
    while under the influence of any substance, including prescription drugs, that
    impairs your physical or mental capacity.
- id: 122
  category: alcohol_drugs_health
  question: Who is responsible if a passenger is found with an open alcoholic container
    in a vehicle in Puerto Rico?
  choices:
    A: Only the passenger
    B: Only the driver
    C: Both the driver and the passenger
    D: The owner of the vehicle only
  answer: B
  explanation: Under Puerto Rico Law 22, the driver is held responsible and fined
    if any person in the passenger compartment of the vehicle is found with an open
    container of alcohol.
- id: 123
  category: alcohol_drugs_health
  question: What is the mandatory imprisonment term in Puerto Rico for a DUI conviction
    that results in the death of another person?
  choices:
    A: 2 to 5 years
    B: 5 to 10 years
    C: 8 to 15 years
    D: 20 to 30 years
  answer: C
  explanation: A DUI resulting in a fatality is a serious felony in Puerto Rico, carrying
    a fixed imprisonment term of 8 to 15 years.
- id: 124
  category: alcohol_drugs_health
  question: 'If a driver in Puerto Rico is convicted of a DUI that results in ''serious
    bodily injury'' to another person, it is classified as:'
  choices:
    A: A minor misdemeanor
    B: A felony with a mandatory prison sentence
    C: A traffic ticket only
    D: A violation that only carries a fine
  answer: B
  explanation: Under Law 22, a DUI causing serious bodily injury is a felony (third-degree)
    and carries a mandatory prison sentence of 18 months.
- id: 125
  category: alcohol_drugs_health
  question: For a second DUI conviction within five years in Puerto Rico, what is
    the mandatory jail time?
  choices:
    A: No jail time, only community service
    B: 24 hours
    C: 15 to 30 days
    D: 6 months to 1 year
  answer: C
  explanation: A second DUI conviction in Puerto Rico within a five-year period requires
    a mandatory jail term of 15 to 30 days.
- id: 126
  category: alcohol_drugs_health
  question: What is the penalty regarding driving privileges for a third DUI conviction
    in Puerto Rico?
  choices:
    A: 1-year suspension
    B: 2-year suspension
    C: 5-year suspension
    D: Permanent revocation of the driver's license
  answer: D
  explanation: A third DUI conviction in Puerto Rico results in the permanent revocation
    of the individual's driver's license.
- id: 127
  category: alcohol_drugs_health
  question: In addition to the standard fine, every person convicted of DUI in Puerto
    Rico must pay a mandatory contribution to the Trauma Fund. How much is this fee?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: B
  explanation: Any person convicted of driving under the influence must pay a $50
    contribution to the Trauma Fund of the Medical Services Administration.
- id: 128
  category: alcohol_drugs_health
  question: If a driver's BAC is 0.15% or higher in Puerto Rico, they are subject
    to 'Aggravated DUI' penalties. Which of the following is a consequence of this?
  choices:
    A: The fine remains $500
    B: The driver is exempt from jail time
    C: The driver must serve mandatory community service
    D: Higher fines and stricter penalties apply compared to the 0.08% limit
  answer: D
  explanation: A BAC of 0.15% or higher is considered an aggravating factor in Puerto
    Rico, leading to increased fines and stricter enforcement of penalties.
- id: 129
  category: alcohol_drugs_health
  question: Which program is mandatory for any person whose license is suspended for
    a DUI violation in Puerto Rico before they can regain their driving privileges?
  choices:
    A: A standard 5-hour pre-licensing course
    B: The Alcohol and Drug Awareness Program (ADAP/C.R.E.A.)
    C: A high school diploma equivalency
    D: A defensive driving course for speeding
  answer: B
  explanation: Drivers convicted of DUI must complete a mandatory alcohol and drug
    rehabilitation/education program (often referred to as C.R.E.A. or ADAP) as part
    of their sentence and to reinstate their license.
- id: 130
  category: alcohol_drugs_health
  question: In Puerto Rico, if a person suffers from a condition like epilepsy, what
    is required to maintain a driver's license?
  choices:
    A: They are permanently banned from driving.
    B: They must provide a medical certificate every year stating the condition is
      controlled.
    C: They can only drive during daylight hours.
    D: No special requirements exist for medical conditions.
  answer: B
  explanation: Drivers with medical conditions that may affect driving, such as epilepsy,
    must provide periodic medical certifications (usually annually) to DTOP to prove
    their condition is under control.
- id: 131
  category: alcohol_drugs_health
  question: How does alcohol affect your driving abilities in the tropical climate
    of Puerto Rico?
  choices:
    A: Heat can speed up the effects of alcohol and dehydration, further impairing
      judgment.
    B: The humidity cancels out the effects of alcohol.
    C: Alcohol has no effect on driving if you are used to the heat.
    D: Drinking water while drinking alcohol makes it legal to drive.
  answer: A
  explanation: Environmental factors like heat and dehydration can intensify the impairing
    effects of alcohol on a driver's coordination and judgment.
- id: 132
  category: penalties_and_points
  question: In Puerto Rico, what is the base fine for exceeding the speed limit by
    1 to 14 miles per hour?
  choices:
    A: $50 plus $5 for each additional mile
    B: $100 plus $10 for each additional mile
    C: $150 plus $20 for each additional mile
    D: $200 flat fee
  answer: B
  explanation: According to the Puerto Rico Vehicle and Traffic Law (Ley 22), the
    penalty for speeding is a $100 base fine plus $10 for every mile per hour over
    the limit.
- id: 133
  category: penalties_and_points
  question: What is the fine for having window tints that do not comply with the legal
    limit (less than 35% light transmission) in Puerto Rico?
  choices:
    A: $50
    B: $100
    C: $200
    D: $300
  answer: B
  explanation: Violating the window tint laws in Puerto Rico (which require at least
    35% light transmission) carries a fine of $100.
- id: 134
  category: penalties_and_points
  question: What is the fine for failing to use a child safety seat for a child who
    is required by law to use one?
  choices:
    A: $100
    B: $250
    C: $500
    D: $750
  answer: C
  explanation: Failure to properly secure a child in a safety seat as required by
    law results in a $500 fine.
- id: 135
  category: penalties_and_points
  question: What is the fine in Puerto Rico for transporting a child under the age
    of 4 without a federally approved protective car seat?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: B
  explanation: Article 13.03 of Law 22-2000 mandates a $100 fine for failing to use
    a proper child safety seat for children under 4 years old.
- id: 136
  category: penalties_and_points
  question: In Puerto Rico, what is the fine for operating a vehicle with window tints
    that allow less than 35% light transmission?
  choices:
    A: $50
    B: $100
    C: $150
    D: $250
  answer: B
  explanation: The law requires at least 35% light transmission for window tints;
    violations result in a $100 fine.
- id: 137
  category: penalties_and_points
  question: How many points are added to a driver's record for illegally driving on
    the shoulder (paseo) of the road?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: Driving on the shoulder (paseo) of the road is a serious violation
    in Puerto Rico and carries a penalty of 6 points.
- id: 138
  category: penalties_and_points
  question: If a traffic fine in Puerto Rico is not paid within 30 days, what is the
    additional surcharge added to the fine?
  choices:
    A: $5
    B: $10
    C: $25
    D: $50
  answer: A
  explanation: According to Article 23.05, if a fine is not paid within 30 days, a
    $5 surcharge is added to the total amount.
- id: 139
  category: penalties_and_points
  question: How many points are assigned to a driver's record for making an illegal
    U-turn?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: The Puerto Rico Department of Transportation (DTOP) assigns 2 points
    to a driver's record for an illegal U-turn.
- id: 140
  category: penalties_and_points
  question: What is the fine for a motorcycle driver or passenger who fails to wear
    a protective helmet?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: B
  explanation: Article 12.02 requires the use of a helmet for both operators and passengers
    of motorcycles, with a fine of $100 for non-compliance.
- id: 141
  category: penalties_and_points
  question: When a driver is cited by a police officer for failing to stop at a red
    light, how many points are added to their driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: B
  explanation: Failing to stop at a red light when observed by a law enforcement officer
    results in 3 points on the driver's record.
- id: 142
  category: sharing_the_road
  question: When passing a cyclist in Puerto Rico, what is the minimum lateral distance
    a motor vehicle driver must maintain between the vehicle and the cyclist?
  choices:
    A: 1 foot
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Law 22, Article 11.03 requires drivers to maintain a minimum distance
    of 3 feet (approximately 1 meter) when passing a cyclist to ensure their safety.
- id: 143
  category: sharing_the_road
  question: In Puerto Rico, what is the fine for a pedestrian who fails to use a pedestrian
    bridge or crosswalk when one is available nearby?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: Under Article 10.02 of Law 22, pedestrians who do not use provided
    crosswalks or bridges are subject to a $100 fine for violating safety regulations.
- id: 144
  category: sharing_the_road
  question: In Puerto Rico, what is the legal status of a cyclist on public roads?
  choices:
    A: They must always ride on the sidewalk
    B: They have the same rights and duties as a motor vehicle driver
    C: They must always ride against the flow of traffic
    D: They are not allowed on roads with a speed limit over 25 mph
  answer: B
  explanation: Under Law 22, cyclists are considered vehicles and have the same rights
    to the road and responsibilities as motor vehicle drivers.
- id: 145
  category: sharing_the_road
  question: When two or more heavy motor vehicles (trucks) are traveling in the same
    direction on a Puerto Rico highway, what is the minimum distance they must maintain
    between each other?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Article 6.18 of Law 22 requires heavy motor vehicles to maintain a
    minimum distance of 100 feet between them to allow other vehicles to pass safely.
- id: 146
  category: sharing_the_road
  question: In Puerto Rico, if a pedestrian is crossing the street at an intersection
    where there are no traffic signals, who has the right of way?
  choices:
    A: The motor vehicle
    B: The pedestrian
    C: Whoever arrived at the intersection first
    D: The pedestrian, but only if they are in a marked crosswalk
  answer: B
  explanation: Drivers must yield the right of way to pedestrians crossing the roadway
    within any marked or unmarked crosswalk at an intersection.
- id: 147
  category: sharing_the_road
  question: Which of the following is true regarding motorcycle helmet use in Puerto
    Rico?
  choices:
    A: Only the driver is required to wear a helmet
    B: Helmets are optional for riders over 21
    C: Both the driver and passenger must wear a DOT-approved helmet
    D: Helmets are only required on highways
  answer: C
  explanation: Law 22 requires both the operator and the passenger of a motorcycle
    to wear a protective helmet that meets the standards of the Department of Transportation.
- id: 148
  category: sharing_the_road
  question: When is a driver NOT required to stop for a school bus that is stopped
    with its warning lights on in Puerto Rico?
  choices:
    A: When the driver is in a hurry
    B: When the road has four or more lanes and the bus is on the opposite side of
      a physical median
    C: When the bus is stopped in a residential zone
    D: Drivers must always stop regardless of the road type
  answer: B
  explanation: Drivers traveling in the opposite direction on a divided highway with
    a physical barrier or median are not required to stop for a school bus.
- id: 149
  category: sharing_the_road
  question: In Puerto Rico, what is the fine for a driver who parks or stops their
    vehicle in a way that obstructs a bicycle lane?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Obstructing a designated bicycle lane is a violation of Law 22 and
    carries a fine of $100.
- id: 150
  category: sharing_the_road
  question: What is the minimum distance a driver must maintain when following an
    emergency vehicle that has its sirens and lights activated in Puerto Rico?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Article 6.20 of Law 22 prohibits drivers from following an emergency
    vehicle closer than 500 feet when it is responding to an emergency.
- id: 151
  category: sharing_the_road
  question: If a pedestrian is using a white cane or a guide dog at an intersection,
    what must a driver do in Puerto Rico?
  choices:
    A: Honk to let them know you are there
    B: Come to a complete stop and yield the right of way
    C: Drive slowly around them
    D: Yield only if there is a 'Walk' signal
  answer: B
  explanation: Drivers must take necessary precautions and come to a complete stop
    to yield to blind or visually impaired pedestrians using a white cane or guide
    dog.
- id: 152
  category: sharing_the_road
  question: 'In Puerto Rico, motorcycles must have their headlights turned on:'
  choices:
    A: Only at night
    B: Only during rain or fog
    C: At all times when the motorcycle is in motion
    D: Only on highways
  answer: C
  explanation: For safety and visibility, Law 22 requires motorcycles to operate with
    their headlights on at all times, even during daylight hours.
- id: 153
  category: sharing_the_road
  question: When riding a bicycle at night in Puerto Rico, which equipment is legally
    required?
  choices:
    A: A front white light and a rear red light or reflector
    B: A bell and a basket
    C: Reflective clothing only
    D: A rear-view mirror and a horn
  answer: A
  explanation: Article 11.05 of Law 22 requires bicycles used at night to be equipped
    with a front lamp emitting white light and a rear red light or reflector visible
    from at least 500 feet.
- id: 154
  category: sharing_the_road
  question: In Puerto Rico, what is the fine for a driver who fails to stop when a
    school bus is picking up or dropping off children?
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: C
  explanation: According to Article 6.21 of Puerto Rico's Law 22 (Vehicle and Traffic
    Law), any driver who fails to stop for a school bus while it is loading or unloading
    students is subject to a $300 fine.
- id: 155
  category: sharing_the_road
  question: What is the legal requirement for motorcycle passengers in Puerto Rico
    regarding safety gear?
  choices:
    A: Helmets are optional for passengers over 21
    B: Only the driver is required to wear a helmet
    C: Both the driver and the passenger must wear a DOT-approved helmet
    D: Passengers are only required to wear helmets on highways
  answer: C
  explanation: Article 12.02 of Law 22 mandates that both the operator and any passenger
    of a motorcycle must wear a protective helmet that meets the standards established
    by the Department of Transportation.
- id: 156
  category: sharing_the_road
  question: When driving near heavy motor vehicles (trucks), what is the 'No-Zone'?
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the truck where the driver cannot see other vehicles
    C: The designated lane for trucks on the highway
    D: The area directly in front of the truck only
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck (front,
    back, and sides) where the truck driver's visibility is limited. If you cannot
    see the truck's side mirrors, the driver cannot see you.
- id: 157
  category: sharing_the_road
  question: In Puerto Rico, cyclists are required to ride in which direction on the
    road?
  choices:
    A: Against the flow of traffic (facing vehicles)
    B: In the same direction as the flow of traffic
    C: On the sidewalk only
    D: In the middle of the lane at all times
  answer: B
  explanation: Cyclists in Puerto Rico are considered vehicles and must follow the
    same rules as motor vehicles, which includes riding in the same direction as traffic.
- id: 158
  category: sharing_the_road
  question: 'If a pedestrian must walk on a road in Puerto Rico where there are no
    sidewalks, they should walk:'
  choices:
    A: On the right side, with the flow of traffic
    B: On the left side, facing oncoming traffic
    C: In the center of the road
    D: On whichever side has more shade
  answer: B
  explanation: Article 10.03 of Law 22 requires pedestrians to walk on the left side
    of the road facing traffic when sidewalks are not available, allowing them to
    see approaching vehicles.
- id: 159
  category: sharing_the_road
  question: 'When a heavy truck is turning right at an intersection, a car driver
    should:'
  choices:
    A: Squeeze into the space between the truck and the curb
    B: Stay back and wait for the truck to complete the turn
    C: Honk to let the truck driver know they are there
    D: Pass the truck on the left while it is turning
  answer: B
  explanation: Heavy trucks often need to swing wide to the left to make a right turn.
    Drivers should never try to pass on the right or squeeze into the gap, as the
    truck driver cannot see them and the rear wheels may cut the corner.
- id: 160
  category: sharing_the_road
  question: At night, a bicycle in Puerto Rico must be equipped with which of the
    following?
  choices:
    A: A white light in front and a red light or reflector in the back
    B: A bell or horn only
    C: Reflective tape on the wheels only
    D: No special equipment is required if riding on the shoulder
  answer: A
  explanation: Article 11.05 of Law 22 requires bicycles used at night to have a front
    lamp emitting a white light visible from 500 feet and a red reflector or lamp
    on the rear visible from 600 feet.
- id: 161
  category: vehicle_information
  question: In Puerto Rico, at what distance must you switch from high beams to low
    beams when approaching an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Puerto Rico law requires drivers to dim their high beams when an oncoming
    vehicle is within 500 feet to prevent blinding the other driver.
- id: 162
  category: vehicle_information
  question: When following another vehicle from behind in Puerto Rico, you must dim
    your high beams when you are within how many feet of that vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Drivers must switch to low beams when following another vehicle within
    a distance of 300 feet to avoid reflecting glare into the lead driver's mirrors.
- id: 163
  category: vehicle_information
  question: What is the legal minimum tread depth for tires on a motor vehicle operating
    on Puerto Rico public roads?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe and illegal in Puerto Rico if the tread
    depth is less than 2/32 of an inch.
- id: 164
  category: vehicle_information
  question: 'Under Puerto Rico law, every motor vehicle must be equipped with a horn
    that is audible from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Article 14.05 of Law 22 requires a horn capable of emitting sound audible
    under normal conditions from a distance of not less than 200 feet.
- id: 165
  category: vehicle_information
  question: What is the fine in Puerto Rico for operating a vehicle with a modified
    exhaust system (cut-outs, bypasses, or amplified noise)?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Modifying an exhaust system to increase noise or bypass emissions controls
    is a violation of Law 22 and carries a $100 fine.
- id: 166
  category: vehicle_information
  question: 'In Puerto Rico, the rear license plate must be illuminated by a white
    light so that it is legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The law requires the rear license plate to be illuminated and clearly
    visible from a distance of 50 feet.
- id: 167
  category: vehicle_information
  question: If a vehicle's load extends more than four feet beyond the rear of the
    body, what must be attached to the end of the load during the day in Puerto Rico?
  choices:
    A: A red flag at least 12 inches square
    B: A yellow flag at least 18 inches square
    C: A white cloth
    D: A red flag at least 16 inches square
  answer: A
  explanation: Law 22 requires a red flag (at least 12x12 inches) to be placed at
    the end of any load that extends more than 4 feet beyond the rear of the vehicle.
- id: 168
  category: vehicle_information
  question: 'According to Puerto Rico regulations, it is illegal to use a sound system
    in a vehicle that is audible from a distance of:'
  choices:
    A: 50 feet or more
    B: 100 feet or more
    C: 200 feet or more
    D: 500 feet or more
  answer: B
  explanation: Article 14.05 prohibits the use of sound amplification systems that
    are audible at a distance of 100 feet or more from the vehicle on public roads.
- id: 169
  category: vehicle_information
  question: In Puerto Rico, how many red brake lights (stop lights) are required on
    the rear of all modern motor vehicles?
  choices:
    A: At least one
    B: At least two
    C: At least three
    D: None, only turn signals are required
  answer: B
  explanation: Law 22 requires every motor vehicle to have at least two red brake
    lights on the rear that activate when the service brake is applied.
- id: 170
  category: vehicle_information
  question: What color of flashing or revolving lights is strictly reserved for the
    Puerto Rico Police Department?
  choices:
    A: Red
    B: Green
    C: Blue
    D: Amber
  answer: C
  explanation: In Puerto Rico, blue lights are reserved exclusively for police vehicles.
    Red lights are used by ambulances and fire trucks.
- id: 171
  category: vehicle_information
  question: Every motor vehicle in Puerto Rico must be equipped with which two independent
    braking systems?
  choices:
    A: Front brakes and rear brakes
    B: Service brake and parking (emergency) brake
    C: Manual brake and automatic brake
    D: Disc brakes and drum brakes
  answer: B
  explanation: 'The law requires two separate means of applying brakes: a service
    brake (pedal) and a parking brake (hand or foot lever).'
- id: 172
  category: vehicle_information
  question: What is the fine for having objects, stickers, or advertisements on the
    windshield that obstruct the driver's clear view in Puerto Rico?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: C
  explanation: Placing objects or non-authorized stickers that obstruct the driver's
    visibility through the windshield or side windows carries a $100 fine.
- id: 173
  category: vehicle_information
  question: In Puerto Rico, how often must a vehicle that is more than two years old
    undergo a mechanical inspection (inspección técnica) to renew the 'marbete'?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: Vehicles older than two years must pass an annual mechanical and emissions
    inspection to obtain the yearly registration sticker (marbete).
- id: 174
  category: vehicle_information
  question: 'If a vehicle''s rear-view mirror is obstructed by a load or a trailer,
    Puerto Rico law requires the vehicle to have:'
  choices:
    A: A camera system
    B: A passenger to guide the driver
    C: Two exterior side mirrors (one on each side)
    D: A wider interior mirror
  answer: C
  explanation: If the interior mirror's view is obstructed, the vehicle must be equipped
    with both a left-side and right-side exterior mirror to ensure visibility to the
    rear.
- id: 175
  category: vehicle_information
  question: 'Puerto Rico law requires that the service brake (foot brake) must be
    capable of stopping a passenger vehicle traveling at 20 mph within a maximum distance
    of:'
  choices:
    A: 15 feet
    B: 25 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Under Article 14.01, the braking system must be efficient enough to
    stop a motor vehicle traveling at 20 mph within 25 feet on a dry, level surface.
- id: 176
  category: vehicle_information
  question: In Puerto Rico, every motor vehicle must be equipped with a muffler in
    good working order. What is specifically prohibited regarding the exhaust system?
  choices:
    A: Using a muffler made of stainless steel
    B: Having an exhaust pipe that extends past the bumper
    C: Using 'cutouts,' bypasses, or similar devices that increase noise
    D: Painting the exhaust pipe
  answer: C
  explanation: Article 14.03 prohibits the use of any device that bypasses the muffler
    or increases the noise level of the vehicle's exhaust system.
- id: 177
  category: vehicle_information
  question: What is the fine in Puerto Rico for operating a vehicle with an illegal
    window tint that does not meet the 35% transmittance requirement?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: The standard fine for violating window tint regulations (Article 14.16)
    in Puerto Rico is $100.
- id: 178
  category: vehicle_information
  question: Which of the following color combinations is required for the front turn
    signal lights of a vehicle in Puerto Rico?
  choices:
    A: White or Amber
    B: Red or Amber
    C: Blue or White
    D: Green or Amber
  answer: A
  explanation: Front turn signals must be white or amber, while rear turn signals
    must be red or amber.
- id: 179
  category: vehicle_information
  question: In Puerto Rico, how often must a vehicle typically undergo a mechanical
    and emissions inspection to renew its 'Marbete' (registration sticker)?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: Vehicles in Puerto Rico must pass an annual inspection (inspección
    técnica) to ensure they meet safety and emissions standards before the registration
    (Marbete) can be renewed.
- id: 180
  category: vehicle_information
  question: What is the maximum height allowed for the front bumper of a standard
    passenger car in Puerto Rico?
  choices:
    A: 18 inches
    B: 20 inches
    C: 22 inches
    D: 24 inches
  answer: C
  explanation: Puerto Rico regulations specify that the maximum bumper height for
    passenger cars is 22 inches from the ground to the bottom of the bumper.
- id: 181
  category: vehicle_information
  question: In Puerto Rico, it is illegal to drive a motor vehicle if it is equipped
    with which of the following on the front?
  choices:
    A: Fog lights
    B: Amber turn signals
    C: Red lights visible from the front
    D: Halogen headlights
  answer: C
  explanation: Article 14.05 prohibits private vehicles from displaying red lights
    visible from the front, as red lights are reserved for the rear of vehicles or
    emergency vehicles.
- id: 182
  category: vehicle_information
  question: What is the legal requirement for windshield wipers in Puerto Rico?
  choices:
    A: They are only required during the rainy season
    B: They must be controlled by a manual hand lever
    C: They must be in good working order and capable of clearing rain or other moisture
    D: Only the driver's side wiper is mandatory
  answer: C
  explanation: Law 22 requires all motor vehicles (except motorcycles) to have a device
    for cleaning rain or moisture from the windshield that is maintained in good working
    order.
- id: 183
  category: signs_and_signals
  question: In Puerto Rico, what is the fine for failing to stop at a red traffic
    light?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: According to the Puerto Rico Vehicle and Traffic Law (Ley 22), the
    fine for failing to stop at a red light is $500.
- id: 184
  category: signs_and_signals
  question: What does a flashing red light at an intersection mean in Puerto Rico?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to turn green
    C: Stop completely and proceed only when it is safe
    D: The traffic signal is broken; ignore it
  answer: C
  explanation: A flashing red light has the same meaning as a stop sign (PARE). You
    must come to a complete stop and yield to traffic before proceeding.
- id: 185
  category: signs_and_signals
  question: In Puerto Rico, what is the fine for illegally parking in a space designated
    for persons with disabilities (marked with a blue curb or sign)?
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,000
  answer: C
  explanation: Under Puerto Rico law, the fine for parking in a space reserved for
    people with disabilities without a valid permit is $1,000.
- id: 186
  category: signs_and_signals
  question: When a school bus stops to pick up or drop off children and activates
    its red lights and 'STOP' sign, what must a driver do on a two-lane road?
  choices:
    A: Slow down to 10 mph and pass carefully
    B: Stop only if they are behind the bus
    C: Stop completely until the bus deactivates the signals
    D: Honk the horn and proceed
  answer: C
  explanation: Drivers in both directions must stop for a school bus with activated
    red lights and stop signals. The fine for violating this in Puerto Rico is $300.
- id: 187
  category: signs_and_signals
  question: What does a solid yellow line on your side of the center of the road indicate?
  choices:
    A: Passing is permitted
    B: Passing is prohibited
    C: You are on a one-way street
    D: You may turn left but not pass
  answer: B
  explanation: A solid yellow line on your side of the road indicates that passing
    other vehicles is prohibited.
- id: 188
  category: signs_and_signals
  question: To indicate a right turn using hand signals in Puerto Rico, how should
    the driver's arm be positioned?
  choices:
    A: Extended straight out the window
    B: Extended upward at a 90-degree angle
    C: Extended downward toward the ground
    D: Waving in a circular motion
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out the window and bent upward at a 90-degree angle.
- id: 189
  category: signs_and_signals
  question: What is the meaning of a 'Ceda el Paso' sign?
  choices:
    A: Stop and wait for 3 seconds
    B: Yield the right of way to traffic in the intersection or main road
    C: One-way traffic only
    D: No entry allowed
  answer: B
  explanation: '''Ceda el Paso'' is the Spanish term for ''Yield''. It requires drivers
    to slow down and give the right of way to other traffic.'
- id: 190
  category: signs_and_signals
  question: Under Puerto Rico law, is a right turn on red permitted after a full stop?
  choices:
    A: No, it is never permitted
    B: Yes, but only between 12:00 AM and 5:00 AM
    C: Yes, unless a sign specifically prohibits it
    D: Yes, but only in rural areas
  answer: C
  explanation: In Puerto Rico, drivers may turn right on red after coming to a complete
    stop and yielding to traffic/pedestrians, provided there is no sign stating 'No
    virar en rojo'.
- id: 191
  category: signs_and_signals
  question: What do double solid yellow lines in the center of the road signify?
  choices:
    A: Passing is allowed from either side
    B: Passing is prohibited from both directions
    C: The road is for emergency vehicles only
    D: You are approaching a school zone
  answer: B
  explanation: Double solid yellow lines indicate that passing is prohibited for traffic
    moving in both directions.
- id: 192
  category: signs_and_signals
  question: What does a solid white line on the right edge of the highway indicate?
  choices:
    A: The edge of the travel lane (fog line)
    B: A lane reserved for buses
    C: A passing zone
    D: A pedestrian-only lane
  answer: A
  explanation: A solid white line on the right side of the road marks the outer edge
    of the pavement, often called the fog line, and helps guide drivers at night or
    in poor weather.
- id: 193
  category: signs_and_signals
  question: In Puerto Rico, what does a green arrow shown with a red light mean?
  choices:
    A: You must stop and wait for the red light to turn green
    B: You may proceed cautiously in the direction of the arrow
    C: The arrow is for pedestrians only
    D: The signal is malfunctioning
  answer: B
  explanation: A green arrow means you have a protected turn in that direction, even
    if the main circular light is red.
- id: 194
  category: signs_and_signals
  question: 'Broken white lines on a multi-lane highway in Puerto Rico indicate:'
  choices:
    A: Traffic moving in opposite directions
    B: Traffic moving in the same direction, and lane changes are permitted
    C: An area where parking is allowed
    D: A high-occupancy vehicle (HOV) lane
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction
    where lane changes are allowed when safe.
- id: 195
  category: signs_and_signals
  question: Under Puerto Rico law, between 12:00 AM and 5:00 AM, what must a driver
    do when facing a red light?
  choices:
    A: Wait for the light to turn green regardless of the time.
    B: Stop and may proceed if the intersection is clear and no other vehicles are
      approaching.
    C: Treat it as a flashing yellow light and slow down.
    D: Only stop if there is a police officer present.
  answer: B
  explanation: Puerto Rico Law 22 allows drivers to proceed through a red light between
    12:00 AM and 5:00 AM after coming to a complete stop and ensuring it is safe to
    cross.
- id: 196
  category: signs_and_signals
  question: When a driver extends their left arm horizontally out of the window, what
    signal are they giving?
  choices:
    A: Right turn
    B: Left turn
    C: Stop or decrease speed
    D: U-turn
  answer: B
  explanation: Standard hand signals used in Puerto Rico dictate that a left arm extended
    horizontally signifies a left turn.
- id: 197
  category: signs_and_signals
  question: 'In Puerto Rico, a curb painted yellow indicates:'
  choices:
    A: Parking is allowed for a maximum of 15 minutes.
    B: Parking is prohibited, but it may be used for loading and unloading.
    C: Parking is reserved for emergency vehicles only.
    D: Parking is allowed for residents only.
  answer: B
  explanation: Yellow curbs in Puerto Rico generally indicate a zone where parking
    is prohibited, though it is often designated for loading and unloading of merchandise
    or passengers.
- id: 198
  category: signs_and_signals
  question: In Puerto Rico, what is the meaning of a blue painted curb or pavement
    marking?
  choices:
    A: Loading zone for commercial vehicles.
    B: Parking for government vehicles only.
    C: Parking for persons with disabilities.
    D: Bus stop zone.
  answer: C
  explanation: Blue markings are used to designate parking spaces reserved specifically
    for persons with disabilities.
- id: 199
  category: signs_and_signals
  question: 'A white broken line on the pavement in Puerto Rico indicates:'
  choices:
    A: Traffic is moving in opposite directions; passing is allowed.
    B: Traffic is moving in the same direction; lane changes are permitted.
    C: The edge of the road.
    D: A pedestrian crossing zone.
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction
    where lane changes are permitted.
- id: 200
  category: signs_and_signals
  question: When approaching a 'Pare' sign in Puerto Rico, where should the driver
    stop if there is no stop line painted on the road?
  choices:
    A: At the point nearest the intersecting roadway where the driver has a view of
      approaching traffic.
    B: 15 feet before the sign.
    C: Only if there is cross traffic.
    D: After the sign, in the middle of the intersection.
  answer: A
  explanation: If no stop line or crosswalk is present, the driver must stop at the
    point nearest the intersecting road that allows a clear view of traffic before
    entering the intersection.
