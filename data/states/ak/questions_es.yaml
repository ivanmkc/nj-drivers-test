questions:
- id: 1
  category: license_system
  question: ¿Qué departamento estatal preparó el Manual del Conductor de Alaska?
  choices:
    A: Departamento de Transporte
    B: Departamento de Seguridad Pública
    C: Departamento de Administración
    D: Departamento de Educación
  answer: C
  explanation: El manual indica en su portada que fue preparado por el Departamento
    de Administración de Alaska, División de Vehículos Motorizados (DMV).
- id: 2
  category: driver_responsibility
  question: ¿El Manual del Conductor de Alaska tiene como objetivo servir como una
    declaración precisa de todos los estatutos y regulaciones de tráfico del estado?
  choices:
    A: Sí, cubre cada ley exactamente como está escrita.
    B: No, solo tiene como objetivo proporcionar una familiaridad general con la operación
      segura y legal.
    C: Sí, pero solo para conductores de vehículos comerciales.
    D: No, solo cubre las leyes federales de conducción.
  answer: B
  explanation: 'El Prefacio 1 establece: ''El contenido de este manual NO tiene como
    objetivo servir como una declaración precisa de todos los Estatutos y Regulaciones
    del Estado de Alaska relacionados con la operación de un vehículo motorizado...'''
- id: 3
  category: driver_testing
  question: ¿Se le permite usar el Manual del Conductor de Alaska mientras realiza
    su examen de conducir?
  choices:
    A: Sí, solo para el examen escrito.
    B: Sí, solo para el examen de conducción.
    C: No, el manual no puede utilizarse durante el examen.
    D: Sí, si paga una tarifa de examen a libro abierto.
  answer: C
  explanation: 'El Prefacio 3 establece explícitamente en letras mayúsculas: ''ESTE
    MANUAL NO PUEDE SER UTILIZADO DURANTE EL EXAMEN''.'
- id: 4
  category: safe_driving_rules
  question: Según el manual, ¿qué debe demostrar constantemente un conductor seguro?
  choices:
    A: Comportamiento agresivo para mantener el derecho de paso.
    B: Una actitud cortés y buen juicio.
    C: La capacidad de conducir a los límites máximos de velocidad.
    D: Conocimiento avanzado de mecánica de motores.
  answer: B
  explanation: 'El Prefacio 3 establece: ''...un conductor seguro debe demostrar constantemente
    una actitud cortés y ejercer un buen juicio''.'
- id: 5
  category: defensive_driving
  question: ¿Cómo describe el Manual del Conductor de Alaska a un conductor no informado
    y sin habilidades?
  choices:
    A: Un peligro para el tráfico
    B: Un principiante típico
    C: Un inconveniente menor
    D: Un operador cauteloso
  answer: A
  explanation: 'El Prefacio 3 establece: ''UN CONDUCTOR NO INFORMADO y sin habilidades
    es un peligro para el tráfico''.'
- id: 6
  category: license_system
  question: ¿Cuál de los siguientes es un servicio al que puede acceder a través de
    los Servicios en Línea del DMV de Alaska?
  choices:
    A: Registrarse para votar
    B: Renovar una licencia o permiso
    C: Pagar una multa de tráfico
    D: Comprar un seguro de vehículo
  answer: B
  explanation: La página 1 enumera 'Renovar una licencia o permiso' como uno de los
    Servicios en Línea del DMV de Alaska disponibles.
- id: 7
  category: license_system
  question: ¿Dónde puede verificar el estado del envío por correo de una licencia
    o permiso emitido?
  choices:
    A: Solo visitando una oficina física del DMV.
    B: Llamando al departamento de policía local.
    C: A través de los Servicios en Línea del DMV de Alaska.
    D: Enviando una solicitud formal por correo a la capital del estado.
  answer: C
  explanation: La página 1 enumera 'Ver el estado del envío por correo de una licencia
    o permiso emitido' bajo los Servicios en Línea del DMV de Alaska.
- id: 8
  category: license_system
  question: ¿Cuál de los siguientes NO figura como un servicio en línea proporcionado
    por el DMV de Alaska?
  choices:
    A: Programar un examen de conducción
    B: Obtener un registro de conducción certificado
    C: Realizar un examen de conocimientos de práctica
    D: Pagar una multa de estacionamiento
  answer: D
  explanation: La página 1 enumera programar exámenes, obtener registros de conducción
    y realizar exámenes de práctica como servicios en línea, pero no enumera el pago
    de multas de estacionamiento.
- id: 9
  category: alcohol_drugs_health
  question: Según el índice del manual, ¿en qué páginas puede encontrar información
    sobre 'Alcohol y la conducción'?
  choices:
    A: Páginas 5-7
    B: Páginas 14-19
    C: Páginas 38-53
    D: Páginas 68-69
  answer: B
  explanation: El índice en el Prefacio 2 enumera 'Alcohol y la conducción' en las
    páginas 14-19.
- id: 10
  category: vehicle_information
  question: Si necesita encontrar información sobre 'Sistemas de retención infantil'
    y 'Cinturones de seguridad', ¿qué páginas debe consultar según el índice?
  choices:
    A: Páginas 2-3
    B: Páginas 10-11
    C: Páginas 20-23
    D: Páginas 54-55
  answer: C
  explanation: El índice en el Prefacio 2 enumera 'Sistemas de retención infantil,
    cinturones de seguridad' en las páginas 20-23.
- id: 11
  category: penalties_and_points
  question: ¿Según el índice, dónde se encuentra la información relativa al 'Sistema
    de Puntos'?
  choices:
    A: Página 9
    B: Página 11
    C: Página 13
    D: Página 17
  answer: B
  explanation: El índice en el Prefacio 2 dirige a los lectores a la página 11 para
    obtener información sobre el 'Sistema de Puntos'.
- id: 12
  category: signs_and_signals
  question: Según el índice, ¿qué tema se trata ampliamente en las páginas 38-53?
  choices:
    A: Señales
    B: Estacionamiento
    C: Bicicletas
    D: Derrapes
  answer: A
  explanation: El índice en el Prefacio 2 indica que las 'Señales' se cubren en las
    páginas 38-53.
- id: 13
  category: safe_driving_rules
  question: Si desea leer sobre 'Conducción Distraída' y 'Envío de Mensajes de Texto',
    ¿a qué página le dirige el índice?
  choices:
    A: Página 11
    B: Página 19
    C: Página 24
    D: Página 30
  answer: C
  explanation: El índice en el Prefacio 2 incluye tanto 'Conducción Distraída' como
    'Envío de Mensajes de Texto' en la página 24.
- id: 14
  category: driver_responsibility
  question: ¿Qué representa el privilegio de conducir para un conductor principiante,
    según el manual?
  choices:
    A: Un derecho constitucional garantizado.
    B: Un paso importante en su vida.
    C: Una exención de las leyes de tránsito.
    D: Una carga financiera.
  answer: B
  explanation: 'El Prefacio 3 establece: ''Como conductor principiante, el privilegio
    de conducir representa un paso importante en su vida''.'
- id: 15
  category: license_system
  question: ¿Cuánto tiempo tiene un no residente con una licencia válida de otro estado
    para obtener una licencia de conducir de Alaska después de ingresar al estado?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: El manual establece que se debe obtener una licencia de conducir de
    Alaska al final de un período de 90 días después de ingresar al estado.
- id: 16
  category: license_system
  question: ¿Cuál de los siguientes familiares de militares está exento de obtener
    una licencia de conducir de Alaska si tiene una licencia válida de otro estado
    y mantiene su residencia permanente allí?
  choices:
    A: Un hijo dependiente de 16 años
    B: Un cónyuge mayor de 18 años
    C: Un hijo dependiente de 18 años
    D: Todos los dependientes del miembro militar
  answer: B
  explanation: Un miembro de las fuerzas armadas y su cónyuge mayor de 18 años están
    exentos. El manual señala específicamente que los dependientes de un miembro no
    están exentos.
- id: 17
  category: license_system
  question: ¿Qué clase de licencia de conducir se requiere para operar vehículos de
    pasajeros estándar en Alaska?
  choices:
    A: Clase A
    B: Clase C
    C: Clase D
    D: Clase M1
  answer: C
  explanation: Según el manual, la Clase D es la licencia utilizada para operar vehículos
    de pasajeros.
- id: 18
  category: license_system
  question: Un joven de 14 años desea operar una motoneta (scooter) con una cilindrada
    de motor inferior a 50 cc. ¿Qué clase de licencia debe obtener?
  choices:
    A: Clase D
    B: Clase M1
    C: Clase M2
    D: Clase M3
  answer: C
  explanation: Las personas de 14 o 15 años de edad pueden obtener una licencia Clase
    M2 para motonetas con una cilindrada de motor inferior a 50 cc.
- id: 19
  category: license_system
  question: Al solicitar una licencia de conducir original, ¿cuál de los siguientes
    es un documento aceptable para demostrar su fecha de nacimiento?
  choices:
    A: Un certificado de nacimiento emitido por un hospital
    B: Un certificado de bautismo
    C: Una tarjeta de identificación militar de dependiente
    D: Un certificado de nacimiento certificado de los Estados Unidos con sello en
      relieve
  answer: D
  explanation: Un certificado de nacimiento certificado de los Estados Unidos con
    sello en relieve es aceptable. El manual establece explícitamente que los certificados
    emitidos por hospitales, los certificados de bautismo y las identificaciones militares
    de dependientes no son aceptables.
- id: 20
  category: driver_responsibility
  question: ¿Cuál es una posible consecuencia legal para un padre o tutor que firma
    el formulario de consentimiento paterno para que un menor de 18 años obtenga una
    licencia de conducir?
  choices:
    A: Deben viajar en el vehículo con el menor en todo momento.
    B: Pueden ser responsables de los daños en un choque de vehículo motorizado causado
      por el menor.
    C: Deben pagar una tarifa de registro más alta para el vehículo del menor.
    D: Se les requiere realizar una prueba de conocimientos escrita junto con el menor.
  answer: B
  explanation: La ley establece que cualquier negligencia o conducta dolosa de un
    menor de 18 años puede atribuirse a la persona que firmó el consentimiento, haciéndola
    responsable de los daños en un choque de vehículo motorizado.
- id: 21
  category: license_system
  question: ¿Quién está autorizado para retirar el consentimiento paterno para la
    licencia o permiso de conducir de un menor?
  choices:
    A: Cualquier conductor con licencia mayor de 21 años
    B: Cualquier tutor legal designado por el tribunal
    C: Solo la persona que firmó originalmente el formulario de consentimiento paterno
    D: Un empleado del DMV
  answer: C
  explanation: El manual establece que el padre o tutor puede retirar el consentimiento;
    sin embargo, solo la persona que firmó el formulario de consentimiento paterno
    puede retirar el consentimiento.
- id: 22
  category: driver_testing
  question: ¿Cuáles son los requisitos de edad y experiencia para el conductor con
    licencia que acompaña a una persona que está aprendiendo a conducir con un permiso
    de instrucción?
  choices:
    A: Al menos 18 años de edad con 6 meses de experiencia de conducción
    B: Al menos 21 años de edad con al menos un año de experiencia de conducción para
      la misma clase de vehículo
    C: Al menos 25 años de edad con un historial de conducción limpio
    D: Al menos 21 años de edad con al menos cinco años de experiencia de conducción
  answer: B
  explanation: Mientras aprende a conducir, debe estar acompañado por un conductor
    con licencia que tenga al menos 21 años de edad y cuente con al menos un año de
    experiencia de conducción para el mismo tipo o clase de vehículo.
- id: 23
  category: license_system
  question: ¿Cuánto tiempo debe tener un joven de 16 o 17 años un permiso de instrucción
    válido antes de que el DMV pueda emitir una licencia provisional Clase D?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Si tiene 16 o 17 años, debe tener un permiso de instrucción válido
    durante 6 meses antes de que el DMV pueda emitirle una licencia provisional Clase
    D.
- id: 24
  category: license_system
  question: ¿Cuántas veces se puede renovar un permiso de instrucción no comercial?
  choices:
    A: No se puede renovar
    B: Una vez
    C: Dos veces
    D: Veces ilimitadas siempre que se pague la tarifa
  answer: B
  explanation: Cada tipo de permiso de instrucción no comercial emitido es válido
    por 2 años y solo se puede renovar una vez.
- id: 25
  category: license_system
  question: ¿Cuál es la tarifa para obtener un permiso de instrucción original en
    Alaska?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $25.00
  answer: B
  explanation: El manual establece que la tarifa para un permiso de instrucción original
    es de $15.00.
- id: 26
  category: alcohol_drugs_health
  question: ¿Qué debe hacer un conductor menor de 21 años antes de renovar su licencia
    de conducir cuando esta vence 90 días después de su cumpleaños número 21?
  choices:
    A: Aprobar un examen de habilidades viales
    B: Aprobar un examen de concientización sobre el alcohol
    C: Entregar su licencia actual a un oficial de policía
    D: Completar un curso de conducción defensiva
  answer: B
  explanation: Si es menor de 21 años, su licencia de conducir vencerá 90 días después
    de su cumpleaños número 21, y debe aprobar un examen de concientización sobre
    el alcohol antes de renovarla.
- id: 27
  category: license_system
  question: 'Para que una licencia de conducir de Alaska se considere válida, debe
    estar:'
  choices:
    A: Laminada por un notario público
    B: Acompañada de un certificado de nacimiento en todo momento
    C: Firmada por el titular de la licencia
    D: En posesión durante al menos 30 días
  answer: C
  explanation: 'Según la sección de Requisitos de la Licencia de Conducir, la regla
    número 3 establece: ''Una licencia debe estar firmada por el titular para ser
    válida''.'
- id: 28
  category: penalties_and_points
  question: ¿Cuál es la sanción mínima por una condena por conducir mientras su licencia
    está cancelada, suspendida o revocada?
  choices:
    A: Una multa de $500
    B: Una sentencia de cárcel de no menos de 10 días
    C: Servicio comunitario durante 40 horas
    D: Revocación permanente de los privilegios de conducción
  answer: B
  explanation: La condena por conducir mientras una licencia está cancelada, suspendida,
    revocada o en violación de una licencia limitada resultará en una sentencia de
    cárcel de no menos de 10 días.
- id: 29
  category: safe_driving_rules
  question: Al practicar la conducción de una motocicleta o motoneta con un permiso
    de instrucción, ¿cuál es el requisito para el conductor con licencia que supervisa?
  choices:
    A: Debe viajar como pasajero en la motocicleta.
    B: Debe estar en un vehículo de pasajeros conduciendo directamente delante del
      aprendiz.
    C: Usted debe estar a la vista y bajo la supervisión inmediata del conductor con
      licencia.
    D: Debe estar conectado con el aprendiz a través de un sistema de radio de dos
      vías.
  answer: C
  explanation: Para motocicletas o motonetas, el manual establece que usted debe estar
    a la vista y bajo la supervisión inmediata del conductor con licencia.
- id: 30
  category: license_system
  question: ¿Cuánto tiempo debe tener un solicitante de 16 o 17 años un permiso de
    instrucción válido antes de que se le pueda emitir una licencia de conducir de
    Alaska?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: El manual establece que los solicitantes que tengan 16 o 17 años de
    edad deben tener un permiso de instrucción válido durante al menos 6 meses antes
    de que se les pueda emitir una licencia.
- id: 31
  category: safe_driving_rules
  question: ¿Durante la etapa de la licencia provisional, entre qué horas tiene prohibido
    un conductor operar un vehículo motorizado sin un padre, tutor legal o conductor
    con licencia que tenga al menos 21 años de edad?
  choices:
    A: 10:00 pm y 4:00 am
    B: 11:00 pm y 5:00 am
    C: 12:00 am y 6:00 am
    D: 1:00 am y 5:00 am
  answer: D
  explanation: Un titular de licencia provisional no puede operar un vehículo motorizado
    entre las 1:00 am y las 5:00 am a menos que esté acompañado por un padre, tutor
    legal o una persona de al menos 21 años de edad que tenga licencia para conducir.
- id: 32
  category: safe_driving_rules
  question: 'Un conductor con una licencia provisional puede llevar pasajeros sin
    un padre o tutor en el vehículo ÚNICAMENTE si los pasajeros son:'
  choices:
    A: Compañeros de clase
    B: Hermanos
    C: Compañeros de trabajo
    D: Mayores de 18 años
  answer: B
  explanation: El manual especifica que durante la etapa de la licencia provisional,
    USTED PUEDE llevar pasajeros sin un padre en el vehículo si son hermanos.
- id: 33
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia puede un conductor con una licencia provisional
    operar un vehículo entre la 1:00 am y las 5:00 am sin estar acompañado por un
    padre, tutor o conductor con licencia mayor de 21 años?
  choices:
    A: Al conducir hacia o desde su lugar de empleo por la ruta más directa
    B: Al conducir a casa desde un evento patrocinado por la escuela
    C: Al conducir a una cita médica
    D: Al conducir con hermanos en el vehículo
  answer: A
  explanation: Una excepción al toque de queda permite a los conductores provisionales
    operar un vehículo motorizado entre la 1:00 am y las 5:00 am hacia o desde su
    lugar de empleo o dentro del ámbito del empleo por la ruta más directa.
- id: 34
  category: license_system
  question: Antes de obtener una licencia provisional, un padre, tutor o empleador
    debe certificar que un solicitante menor de 18 años ha tenido al menos ¿cuántas
    horas de experiencia de manejo?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 50 horas
  answer: C
  explanation: El manual requiere la certificación de que el solicitante ha tenido
    al menos 40 horas de experiencia de manejo, incluyendo al menos 10 horas en circunstancias
    progresivamente desafiantes.
- id: 35
  category: driver_testing
  question: Para aprobar el examen de la vista para una licencia de conducir de Alaska,
    ¿qué agudeza visual debe tener al menos en cada ojo o con ambos ojos a la vez?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Los estándares de visión establecen que para calificar, debe tener,
    en cada ojo o con ambos ojos a la vez, una visión de al menos 20/40.
- id: 36
  category: driver_testing
  question: ¿Qué examen escrito específico debe realizarse después de cumplir 21 años
    antes de recibir una licencia de conducir original o una renovación?
  choices:
    A: Un examen de conducción defensiva
    B: Un examen escrito de concientización sobre el alcohol
    C: Un examen de conducción en clima invernal
    D: Un examen de reconocimiento de señales de carretera
  answer: B
  explanation: 'El manual establece: "Se debe realizar un examen escrito de concientización
    sobre el alcohol después de cumplir 21 años antes de una licencia de conducir
    original o de renovación".'
- id: 37
  category: driver_testing
  question: Si reprueba el examen de manejo, ¿cuánto tiempo debe esperar normalmente
    antes de poder volver a tomarlo?
  choices:
    A: Un día hábil
    B: Dos días hábiles
    C: Una semana
    D: Diez días
  answer: B
  explanation: Según el manual, si reprueba el examen de manejo, normalmente debe
    esperar dos días hábiles para volver a tomar el examen.
- id: 38
  category: driver_testing
  question: ¿A quién se le permite acompañarlo a usted y al examinador en el vehículo
    durante su examen de manejo?
  choices:
    A: A un padre o tutor legal
    B: A un instructor de manejo con licencia
    C: A un hermano mayor de 21 años
    D: A nadie se le permite acompañarlo
  answer: D
  explanation: 'El manual establece explícitamente: "A nadie se le permite acompañarlo
    a usted y al examinador durante el examen de manejo".'
- id: 39
  category: driver_testing
  question: ¿Cuál de las siguientes situaciones resultará en una reprobación automática
    del examen de manejo?
  choices:
    A: Hacerle una pregunta al examinador antes de que comience el examen
    B: Una violación de una ley de tránsito
    C: Usar el vehículo de un evaluador externo
    D: Realizar el examen en condiciones climáticas adversas
  answer: B
  explanation: El manual enumera la "Violación de una ley de tránsito" como una de
    las razones por las que reprobará automáticamente el examen de manejo.
- id: 40
  category: driver_testing
  question: El DMV NO le reembolsará el cargo del examen de manejo si cancela su cita
    dentro de ¿cuántas horas antes del examen?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 96 horas
  answer: C
  explanation: 'El manual establece: "El DMV no reembolsará el cargo del examen de
    manejo si cancela su cita dentro de las 72 horas previas al examen..."'
- id: 41
  category: driver_testing
  question: ¿Si reprueba el examen de conocimientos escrito, cuándo se le permite
    volver a tomarlo?
  choices:
    A: Inmediatamente
    B: Al día siguiente
    C: Después de dos días hábiles
    D: Después de una semana
  answer: B
  explanation: 'Para el examen escrito, el manual indica: "Si se reprueba, el examen
    puede volver a tomarse al día siguiente".'
- id: 42
  category: license_system
  question: ¿Cuál es el cargo para eliminar una restricción provisional de su licencia
    de conducir después de cumplir con los requisitos?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $25.00
  answer: B
  explanation: Para eliminar una restricción provisional, se debe proporcionar un
    nuevo consentimiento de los padres y se debe emitir una nueva licencia de conducir
    por un cargo de $15.00.
- id: 43
  category: license_system
  question: ¿Cuál de las siguientes personas asociadas con el ejército debe obtener
    una licencia de conducir de Alaska si planea conducir en el estado?
  choices:
    A: Solo personal militar en servicio activo
    B: El cónyuge del personal militar
    C: Dependientes del personal militar (que no sean el cónyuge)
    D: Personal militar estacionado en Alaska por menos de 30 días
  answer: C
  explanation: 'El manual establece: "Los dependientes del personal militar (que no
    sean el cónyuge) que planeen conducir en este estado deben obtener una licencia
    de Alaska".'
- id: 44
  category: license_system
  question: ¿Cuántos días tiene para notificar por escrito a la División de Vehículos
    Motorizados (DMV) si cambia su nombre o dirección?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 90 días
  answer: C
  explanation: Las personas que tengan una licencia o permiso y que hayan cambiado
    su nombre o dirección deben notificar a la División de Vehículos Motorizados,
    por escrito, dentro de los 30 días posteriores al cambio.
- id: 45
  category: license_system
  question: Al obtener una fotografía para su licencia de conducir, ¿cuál es la regla
    con respecto a las prendas para cubrir la cabeza que se usan por motivos religiosos
    o médicos?
  choices:
    A: Están estrictamente prohibidas y deben retirarse por completo.
    B: Pueden permanecer, pero deben moverse por encima de la frente para permitir
      una fotografía facial completa.
    C: Se permiten solo si combinan con el color de su camisa.
    D: Deben ser reemplazadas temporalmente por una prenda para la cabeza aprobada
      por el estado.
  answer: B
  explanation: Las prendas para cubrir la cabeza por motivos religiosos o médicos
    pueden permanecer, pero deben moverse por encima de la frente para permitir que
    se tome una fotografía facial completa.
- id: 46
  category: penalties_and_points
  question: ¿La acumulación de cuántos puntos requiere la suspensión o revocación
    obligatoria de su privilegio de conducir?
  choices:
    A: 6 puntos en 12 meses o 9 puntos en 24 meses
    B: 10 puntos en 12 meses o 15 puntos en 24 meses
    C: 12 puntos en 12 meses o 18 puntos en 24 meses
    D: 15 puntos en 12 meses o 20 puntos en 24 meses
  answer: C
  explanation: Acumular 12 puntos en 12 meses o 18 puntos en 24 meses requiere la
    suspensión o revocación obligatoria del privilegio de conducir, independientemente
    de las dificultades involucradas.
- id: 47
  category: penalties_and_points
  question: ¿Cuántos puntos debe acumular el titular de una licencia provisional para
    que se le exija completar un curso aprobado de mejoramiento para conductores?
  choices:
    A: 4 o más puntos en un período de 12 meses
    B: 6 o más puntos en un período de 12 meses
    C: 10 o más puntos en un período de 12 meses
    D: 12 o más puntos en un período de 12 meses
  answer: B
  explanation: El titular de una licencia provisional que acumule 6 o más puntos en
    un período de 12 meses o 9 o más puntos en un período de 24 meses debe completar
    un curso de mejoramiento para conductores aprobado por la División.
- id: 48
  category: vehicle_information
  question: ¿Cuál es el monto mínimo de cobertura de seguro de responsabilidad civil
    requerido para daños a la propiedad bajo la Ley de Seguro Obligatorio de Alaska?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: El monto mínimo de cobertura de seguro de responsabilidad civil es
    de $50,000/$100,000 por lesiones corporales o muerte y $25,000 por daños a la
    propiedad.
- id: 49
  category: driver_responsibility
  question: Si ocurre un choque dentro de un municipio, involucra una lesión o resulta
    en daños totales a la propiedad de $2,000 o más, ¿qué debe hacer de inmediato?
  choices:
    A: Comunicarse con el departamento de policía local marcando el 911.
    B: Comunicarse con los Troperos del Estado de Alaska (Alaska State Troopers).
    C: Enviar un informe por correo a la División de Vehículos Motorizados.
    D: Comunicarse con su compañía de seguros.
  answer: A
  explanation: Si hay una lesión, o el daño total a la propiedad es de $2,000 o más,
    y el choque ocurrió dentro de un municipio, comuníquese de inmediato con el departamento
    de policía local marcando el 911.
- id: 50
  category: driver_responsibility
  question: ¿Cuántos días tiene para informar un choque a la División de Vehículos
    Motorizados si el choque NO fue investigado por un oficial de policía?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Informe el choque al Departamento de Administración, División de Vehículos
    Motorizados, dentro de los 10 días. Este informe no es necesario si el choque
    fue investigado por un oficial de policía.
- id: 51
  category: driver_responsibility
  question: 'Si usted se ve involucrado en un choque que resulte en daños a la propiedad
    que excedan los $501, debe proporcionar prueba de seguro al DMV dentro de los
    15 días:'
  choices:
    A: Solo si usted causó el choque.
    B: Solo si se le emitió una citación de tráfico.
    C: Independientemente de quién haya causado el choque.
    D: Solo si hubo lesiones corporales.
  answer: C
  explanation: Se requiere prueba de seguro de todos los conductores involucrados
    en el choque, independientemente de quién lo haya causado. Esto significa que
    debe proporcionar la prueba de seguro incluso si usted no causó el choque.
- id: 52
  category: penalties_and_points
  question: ¿Cuál es la sanción por la primera vez que no se proporciona prueba de
    seguro dentro de los 15 días posteriores a un choque reportable?
  choices:
    A: Una multa de $500
    B: Una suspensión de la licencia por 30 días
    C: Una suspensión de la licencia por 90 días
    D: Una suspensión de la licencia por 1 año
  answer: C
  explanation: Si no tenía seguro o no proporciona la prueba dentro de los 15 días,
    su licencia de conducir será suspendida por 90 días en la primera incidencia y
    por 1 año en la segunda incidencia.
- id: 53
  category: safe_driving_rules
  question: ¿Qué debe hacer si choca contra un vehículo desatendido o una propiedad
    privada, como una cerca?
  choices:
    A: Esperar a que llegue la policía antes de abandonar la escena.
    B: Detenerse e intentar localizar al propietario, o dejar una nota escrita con
      su nombre, dirección y número de teléfono.
    C: Abandonar la escena inmediatamente si el daño parece ser inferior a $500.
    D: Tocar la bocina tres veces y continuar si no sale nadie.
  answer: B
  explanation: Al chocar contra un vehículo desatendido o una propiedad privada como
    una cerca, deténgase e intente localizar al propietario. Si no puede hacerlo,
    deje una nota escrita que contenga su nombre, dirección y número de teléfono.
- id: 54
  category: driver_testing
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los evaluadores
    externos (Third Party Testers) para los exámenes de manejo?
  choices:
    A: Solo están disponibles para licencias de conducir comerciales.
    B: Normalmente ofrecen vehículos para su uso y proporcionan horarios de examen
      más flexibles.
    C: Son policías estatales que realizan exámenes en las oficinas del DMV.
    D: No pueden administrar exámenes a menos que un empleado del DMV esté presente
      en el vehículo.
  answer: B
  explanation: Los evaluadores externos normalmente ofrecen vehículos para su uso
    durante el examen y proporcionan horarios de examen más flexibles en comparación
    con el DMV.
- id: 55
  category: penalties_and_points
  question: Si su privilegio de conducir es suspendido o revocado debido a la acumulación
    de demasiados puntos, ¿puede obtener una licencia limitada para "fines laborales"?
  choices:
    A: Sí, pero solo si puede demostrar una dificultad financiera grave.
    B: Sí, si completa un curso de conducción defensiva.
    C: No, no hay disponible una licencia limitada para "fines laborales".
    D: No, a menos que sea su primera suspensión.
  answer: C
  explanation: No hay disponible ninguna licencia limitada para “fines laborales”
    en caso de que se requiera una suspensión o revocación del privilegio de conducir.
- id: 56
  category: penalties_and_points
  question: ¿Con qué frecuencia puede un conductor tomar un curso de conducción defensiva
    (DDC) para una reducción de puntos en su historial de manejo?
  choices:
    A: Una vez cada 6 meses
    B: Una vez cada 12 meses
    C: Una vez cada 24 meses
    D: Una vez cada 5 años
  answer: B
  explanation: Se puede tomar un curso de conducción defensiva (DDC) una vez cada
    12 meses para obtener una reducción de puntos.
- id: 57
  category: license_system
  question: Si sus privilegios de conducir han sido suspendidos por otro estado, ¿qué
    debe hacer antes de que se le pueda emitir una licencia de Alaska?
  choices:
    A: Pagar una tarifa de transferencia de otro estado de $100.
    B: Volver a tomar los exámenes escrito y de manejo en Alaska.
    C: Esperar 90 días después de establecer la residencia en Alaska.
    D: Obtener una prueba por escrito de ese estado que demuestre que la suspensión
      ha terminado.
  answer: D
  explanation: Si sus privilegios de conducir han sido suspendidos, cancelados o revocados
    por otro estado, debe obtener una prueba por escrito de ese estado que demuestre
    que la suspensión o revocación ha terminado antes de que se le pueda emitir una
    licencia de Alaska.
- id: 58
  category: driver_responsibility
  question: 'Bajo la Ley de Responsabilidad Financiera, si existe una posibilidad
    razonable de que se le declare responsable en un tribunal civil por una colisión,
    su privilegio de conducir será suspendido por hasta:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Si existe una posibilidad razonable de que se le declare responsable
    en un tribunal civil, su privilegio para conducir será suspendido por hasta tres
    años.
- id: 59
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su historial de manejo por huir o intentar
    eludir a un oficial de policía?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 9 puntos
    D: 10 puntos
  answer: D
  explanation: De acuerdo con el programa de asignación de puntos de la licencia de
    conducir, huir o intentar eludir a un oficial de policía resulta en 10 puntos.
- id: 60
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en la adición de exactamente
    9 puntos a su historial de manejo?
  choices:
    A: Abandonar la escena de un choque
    B: Conducción temeraria
    C: Conducir sin seguro
    D: Seguir demasiado de cerca
  answer: A
  explanation: Abandonar la escena de un choque tiene asignado un valor de 9 puntos.
    La conducción temeraria son 10 puntos, conducir sin seguro son 6 puntos y seguir
    demasiado de cerca son 4 puntos.
- id: 61
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por exceder el límite de velocidad establecido
    entre 10 y 19 mph?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Exceder el límite de velocidad entre 10 y 19 mph resulta en la anotación
    de 4 puntos en su historial de conducción.
- id: 62
  category: driver_responsibility
  question: ¿Qué formulario se presenta generalmente a la División de Vehículos Motorizados
    para proporcionar prueba de responsabilidad financiera para el futuro después
    de una suspensión o revocación de la licencia?
  choices:
    A: FR-44
    B: SR22
    C: DMV-100
    D: SR-1
  answer: B
  explanation: La prueba de responsabilidad financiera para el futuro generalmente
    se proporciona a la División de Vehículos Motorizados mediante la presentación
    de un formulario de presentación de seguro "SR22".
- id: 63
  category: penalties_and_points
  question: ¿Cuál es la diferencia entre una suspensión de licencia y una revocación
    de licencia?
  choices:
    A: Una suspensión es permanente, mientras que una revocación es temporal.
    B: Una suspensión requiere una orden judicial, mientras que una revocación es
      administrativa.
    C: Una suspensión retira temporalmente los privilegios de conducir, mientras que
      una revocación los retira por completo y requiere obtener una licencia nueva.
    D: No hay diferencia; ambos términos significan lo mismo.
  answer: C
  explanation: Una suspensión retira temporalmente el privilegio de conducir y usted
    solicita un duplicado de la licencia al finalizar. Una revocación retira el privilegio
    por completo, lo que requiere obtener una licencia nueva cuando se cumplan los
    requisitos de reinstalación.
- id: 64
  category: penalties_and_points
  question: ¿Por cuál de las siguientes razones deben suspenderse sus privilegios
    de conducir?
  choices:
    A: Operar un vehículo no asegurado involucrado en un choque
    B: Perjurio relacionado con vehículos motorizados
    C: Fuga ilegal para evitar el arresto
    D: Conducción temeraria
  answer: A
  explanation: Los privilegios de conducir deben suspenderse por operar o ser propietario
    de un vehículo no asegurado involucrado en un choque. Las otras opciones son motivos
    para la revocación de la licencia.
- id: 65
  category: penalties_and_points
  question: ¿Qué condena judicial resultará en la revocación obligatoria de sus privilegios
    de conducir?
  choices:
    A: Seguir a otro vehículo demasiado cerca
    B: No detenerse y prestar ayuda en la escena de un choque con lesiones personales
    C: Conducir en violación de las restricciones de la licencia
    D: Exceder el límite de velocidad por 20 mph
  answer: B
  explanation: Los privilegios de conducir deben ser revocados por una condena judicial
    por no detenerse y prestar ayuda en la escena cuando se está involucrado en un
    choque con lesiones personales.
- id: 66
  category: penalties_and_points
  question: ¿Por cuál de las siguientes infracciones debe la División de Vehículos
    Motorizados revocar administrativamente los privilegios de conducir de un menor
    (menor de 21 años)?
  choices:
    A: Usar una licencia de conducir falsa para obtener alcohol
    B: Exceder el límite de velocidad entre 3 y 9 mph
    C: Conducir entre la medianoche y las 5 AM
    D: Tener más de un pasajero menor de 21 años
  answer: A
  explanation: El DMV debe revocar administrativamente los privilegios de conducir
    a los menores (menores de 21 años) que utilicen una licencia de conducir falsa
    para obtener alcohol.
- id: 67
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de consentimiento implícito (implied consent) de
    Alaska para los conductores?
  choices:
    A: Usted consiente que su vehículo sea registrado en cualquier momento.
    B: Usted consiente una prueba química de su aliento para determinar la concentración
      de alcohol al operar un vehículo motorizado.
    C: Usted consiente pagar todas las multas de tráfico en un plazo de 30 días.
    D: Usted consiente compartir sus registros médicos con el DMV.
  answer: B
  explanation: Cuando usted opera un vehículo motorizado en Alaska, está dando su
    consentimiento para una prueba química de su aliento con el fin de determinar
    la concentración de alcohol en su sangre o aliento. Esto se conoce como consentimiento
    implícito (implied consent).
- id: 68
  category: alcohol_drugs_health
  question: Según la ley de consentimiento implícito (implied consent), ¿cuándo puede
    un oficial de la ley exigir una muestra de su sangre u orina para realizar pruebas?
  choices:
    A: Durante cualquier parada de tráfico de rutina
    B: Si lo sorprenden excediendo el límite de velocidad por más de 20 mph
    C: Si está involucrado en un choque que cause la muerte o lesiones físicas graves
      a otra persona
    D: Si se niega a proporcionar su licencia de conducir y registro
  answer: C
  explanation: La ley de consentimiento implícito permite a los oficiales exigir una
    muestra de sangre u orina si usted está involucrado en un choque que cause la
    muerte o lesiones físicas graves a otra persona.
- id: 69
  category: alcohol_drugs_health
  question: ¿Qué sucede si se niega a someterse a una prueba química después de un
    arresto legal por conducir bajo la influencia (DUI)?
  choices:
    A: Solo será acusado de Negativa (Refusal).
    B: Se le dará una advertencia y se le permitirá conducir a casa.
    C: 'Enfrentará dos cargos penales separados: DUI y Negativa (Refusal).'
    D: Su vehículo será confiscado permanentemente.
  answer: C
  explanation: 'La negativa a someterse a una prueba química resultará en dos cargos
    penales: DUI y Negativa (Refusal), los cuales el tribunal puede tratar por separado.'
- id: 70
  category: alcohol_drugs_health
  question: Si su licencia es revocada por negarse a someterse a una prueba química,
    ¿puede obtener privilegios de conducir limitados para "fines laborales"?
  choices:
    A: Sí, pero solo durante las horas del día.
    B: Sí, si paga una tarifa de reinstalación adicional.
    C: No, no existen privilegios de conducir limitados para "fines laborales" durante
      un período de revocación por negativa.
    D: No, a menos que sea la primera vez que comete la infracción.
  answer: C
  explanation: Durante un período de revocación, no existen privilegios de conducir
    limitados para "fines laborales" para una persona que se niega a someterse a una
    prueba química.
- id: 71
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por negarse a someterse a una prueba de aliento preliminar
    (portátil) en el lugar de un incidente?
  choices:
    A: Es un delito grave (felony).
    B: Es un delito menor (misdemeanor).
    C: Es una infracción.
    D: Resulta en una revocación automática de la licencia por 10 años.
  answer: C
  explanation: Negarse a someterse a una prueba de aliento preliminar en el lugar
    de un incidente es una infracción.
- id: 72
  category: penalties_and_points
  question: ¿Cuántos puntos se registrarán en su historial de conducción por no detenerse
    ante un autobús escolar mientras este está cargando o descargando pasajeros?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar mientras el autobús está cargando
    o descargando pasajeros resulta en la asignación de 6 puntos a su historial de
    conducción.
- id: 73
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su historial de conducción por un DUI (conducir
    bajo la influencia) y cuánto tiempo permanece un DUI en su historial?
  choices:
    A: 6 puntos; 5 años
    B: 10 puntos; para siempre
    C: 8 puntos; 10 años
    D: 12 puntos; para siempre
  answer: B
  explanation: El manual establece que un DUI resulta en 10 puntos en su historial
    de conducción y que los DUI permanecen en su historial para siempre.
- id: 74
  category: penalties_and_points
  question: ¿Cuál es el periodo de revocación por una primera infracción al usar una
    licencia de conducir falsa o fraudulenta para obtener alcohol?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: La ley de Alaska permite que la División de Vehículos Motorizados revoque
    el privilegio de conducir por 60 días por una primera infracción al usar una licencia
    de conducir falsa o fraudulenta para obtener alcohol.
- id: 75
  category: alcohol_drugs_health
  question: Si es menor de 21 años, ¿qué cantidad de alcohol consumido puede resultar
    en un arresto o citación por operar un vehículo motorizado?
  choices:
    A: Una concentración de alcohol en sangre (BAC) de .08 o más
    B: Una concentración de alcohol en sangre (BAC) de .04 o más
    C: Cualquier cantidad de alcohol
    D: Solo una cantidad que cause un deterioro visible
  answer: C
  explanation: Es ilegal en Alaska que una persona menor de 21 años consuma alcohol.
    Operar un vehículo motorizado después de consumir alcohol en cualquier cantidad
    puede resultar en un arresto o citación.
- id: 76
  category: penalties_and_points
  question: ¿Cuál es el periodo de revocación administrativa por una primera infracción
    de un menor que opera un vehículo después de consumir alcohol?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: A
  explanation: Para un menor que opera un vehículo motorizado después de consumir
    alcohol, el periodo de revocación administrativa es de 30 días por una primera
    infracción.
- id: 77
  category: penalties_and_points
  question: ¿Cuál es el periodo de revocación administrativa por una primera infracción
    de conducir con una concentración de alcohol en el aliento de .08 o más?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Si opera un vehículo motorizado con una concentración de alcohol en
    el aliento o en la sangre de .08 o más, el periodo de revocación administrativa
    es de 90 días por una primera infracción.
- id: 78
  category: penalties_and_points
  question: ¿Con cuánta antigüedad revisa el estado las condenas previas por DUI o
    por negarse a la prueba (Refusal) para determinar su periodo de revocación administrativa?
  choices:
    A: 5 años
    B: 7 años
    C: 10 años
    D: 15 años
  answer: D
  explanation: Las condenas previas por DWI/DUI o por negarse a la prueba (Refusal)
    ocurridas en Alaska u otro estado dentro de los últimos 15 años pueden usarse
    para determinar el periodo de revocación.
- id: 79
  category: driver_responsibility
  question: ¿De cuántos días dispone para solicitar una audiencia administrativa para
    impugnar una revocación de licencia?
  choices:
    A: 7 días
    B: 10 días
    C: 14 días
    D: 30 días
  answer: A
  explanation: Debe solicitar una audiencia administrativa por escrito dentro de los
    siete (7) días posteriores a la 'Fecha de emisión' que figura en el anverso de
    la notificación.
- id: 80
  category: alcohol_drugs_health
  question: ¿Cuál es la primera capacidad que se ve afectada por el consumo de alcohol?
  choices:
    A: La visión
    B: El equilibrio
    C: El juicio
    D: La audición
  answer: C
  explanation: Según los datos sobre el alcohol en el manual, el juicio de una persona
    es la primera capacidad que se ve afectada por el consumo de alcohol.
- id: 81
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones sobre el alcohol es verdadera?
  choices:
    A: El alcohol es un estimulante que aumenta el estado de alerta.
    B: El alcohol es un depresor que ralentiza los reflejos normales.
    C: El alcohol mejora su tiempo de reacción.
    D: El alcohol no tiene ningún efecto en su visión.
  answer: B
  explanation: El manual establece que el alcohol es un depresor, no un estimulante.
    Ralentiza los reflejos normales, interfiere con el juicio, reduce el estado de
    alerta y afecta la visión.
- id: 82
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes bebidas contiene la misma cantidad de alcohol
    que una cerveza de 12 onzas?
  choices:
    A: 8 onzas de vino
    B: Un trago (shot) de 1.5 onzas de alcohol de 80 grados (80 proof)
    C: 24 onzas de un refresco de vino (wine cooler)
    D: Un trago (shot) de 3 onzas de alcohol de 80 grados (80 proof)
  answer: B
  explanation: La misma cantidad de alcohol está presente en 12 onzas de cerveza que
    en un solo trago (1 1/2 onza) de alcohol de 80 grados o 4 onzas de vino.
- id: 83
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de recuperar la sobriedad después de
    beber alcohol?
  choices:
    A: Beber café solo (negro)
    B: Tomar una ducha fría
    C: Tomar aire fresco
    D: Dejar que pase el tiempo
  answer: D
  explanation: El café solo, el aire fresco, la comida o una ducha fría pueden despertarlo,
    pero no le devolverán la sobriedad. El hígado elimina el alcohol del cuerpo; solo
    el tiempo ayudará.
- id: 84
  category: alcohol_drugs_health
  question: En promedio, ¿cuánto tiempo le toma al cuerpo cancelar los efectos de
    una bebida alcohólica?
  choices:
    A: 30 minutos
    B: 1 hora
    C: 2 horas
    D: 4 horas
  answer: B
  explanation: Toma un promedio de una hora cancelar los efectos de una bebida.
- id: 85
  category: penalties_and_points
  question: Si es declarado culpable de su primer DUI o rechazo (Refusal), ¿cuál es
    el período mínimo que debe tener instalado un dispositivo de bloqueo de encendido
    (IID)?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 18 meses
  answer: B
  explanation: Si ha sido condenado por solo un DUI o rechazo, deberá tener instalado
    el IID por un mínimo de seis (6) meses.
- id: 86
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol el sentido de confianza de un conductor?
  choices:
    A: Disminuye la confianza y hace que los conductores sean excesivamente cautelosos.
    B: Crea una falsa sensación de confianza.
    C: No tiene ningún efecto en la confianza del conductor.
    D: Hace que los conductores sean conscientes con precisión de sus capacidades
      disminuidas.
  answer: B
  explanation: El alcohol crea una falsa sensación de confianza y la sensación de
    que su conducción no se ve afectada, mientras que simultáneamente reduce su eficacia
    al volante.
- id: 87
  category: alcohol_drugs_health
  question: ¿Qué porcentaje de todas las muertes por accidentes de tráfico cada año
    en Alaska involucran alcohol?
  choices:
    A: Casi el 25 por ciento
    B: Casi el 45 por ciento
    C: Casi el 60 por ciento
    D: Casi el 80 por ciento
  answer: B
  explanation: Según el manual, el consumo de alcohol es un factor significativo en
    los choques fatales de vehículos motorizados en Alaska, y casi el 45 por ciento
    de todas las muertes por accidentes de tráfico cada año involucran alcohol.
- id: 88
  category: alcohol_drugs_health
  question: ¿A qué nivel de concentración de alcohol en sangre (BAC) experimenta un
    conductor un 'deterioro grave en el rendimiento de la conducción'?
  choices:
    A: 0.02%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: La tabla de BAC del manual indica que un BAC de 0.08% resulta en un
    deterioro grave en el rendimiento de la conducción.
- id: 89
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir bajo la influencia de una sustancia controlada
    en Alaska?
  choices:
    A: Una advertencia por la primera infracción
    B: Una multa de $15
    C: Las mismas sanciones que por conducir bajo la influencia del alcohol
    D: Dos puntos de demérito en la licencia del operador
  answer: C
  explanation: La ley de Alaska prohíbe conducir bajo la influencia de cualquier sustancia
    controlada, y las sanciones son las mismas que las descritas para conducir bajo
    la influencia del alcohol.
- id: 90
  category: safe_driving_rules
  question: ¿Cuánto llega a pesar repentinamente un bebé de 15 libras debido a las
    fuerzas desatadas en una colisión a 30 mph?
  choices:
    A: 150 libras
    B: 300 libras
    C: 450 libras
    D: 600 libras
  answer: C
  explanation: El manual establece que sostener a un niño en sus brazos no lo protegerá,
    ya que un bebé de 15 libras pesará repentinamente 450 libras debido a las fuerzas
    desatadas en una colisión de solo 30 mph.
- id: 91
  category: safe_driving_rules
  question: ¿Cuáles son sus probabilidades de morir si sale despedido de un vehículo
    durante una colisión?
  choices:
    A: Casi 5 veces mayores
    B: Casi 10 veces mayores
    C: Casi 25 veces mayores
    D: Casi 50 veces mayores
  answer: C
  explanation: De acuerdo con los datos sobre los cinturones de seguridad, las probabilidades
    de morir son casi 25 veces mayores si usted sale despedido del automóvil.
- id: 92
  category: safe_driving_rules
  question: Según el manual, ¿qué porcentaje de todas las colisiones ocurren a velocidades
    inferiores a 40 millas por hora?
  choices:
    A: Más del 45%
    B: Más del 60%
    C: Más del 80%
    D: Más del 95%
  answer: C
  explanation: El manual señala que más del 80% de todas las colisiones ocurren a
    velocidades inferiores a 40 millas por hora.
- id: 93
  category: vehicle_information
  question: ¿Por qué los cinturones de seguridad fabricados después de 1974 a veces
    se sienten flojos?
  choices:
    A: Están inoperantes y deben ser reemplazados.
    B: Utilizan un carrete de inercia diseñado para la comodidad del pasajero que
      se bloquea cuando el automóvil reduce la velocidad rápidamente.
    C: Se estiran con el tiempo debido al uso y desgaste.
    D: Están diseñados para permitir que los pasajeros salgan despedidos del vehículo.
  answer: B
  explanation: Los cinturones flojos no indican que estén inoperantes. Los cinturones
    fabricados después de 1974 utilizan un carrete de inercia que hace que el sistema
    del cinturón sea 'sensible al automóvil', lo que significa que se bloquean cuando
    el automóvil reduce la velocidad demasiado rápido, y fueron diseñados para la
    comodidad del pasajero.
- id: 94
  category: safe_driving_rules
  question: ¿Qué tipo de sistema de retención se requiere para un niño menor de un
    año de edad o que pesa menos de 20 libras?
  choices:
    A: Un asiento de seguridad para niños orientado hacia adelante
    B: Un asiento elevado (booster seat) asegurado por un cinturón de seguridad
    C: Un cinturón estándar de regazo y hombro
    D: Un asiento de seguridad para niños orientado hacia atrás
  answer: D
  explanation: Un niño menor de un año de edad o que pese menos de 20 libras debe
    estar debidamente asegurado en un asiento de seguridad para niños orientado hacia
    atrás.
- id: 95
  category: safe_driving_rules
  question: 'Un niño mayor de cuatro años, de menos de 57 pulgadas de estatura y que
    pesa entre 20 y 65 libras debe estar asegurado en:'
  choices:
    A: Un asiento de seguridad para niños orientado hacia atrás
    B: Un asiento elevado (booster seat)
    C: Solo un cinturón de regazo estándar
    D: Los brazos de un adulto sin restricciones
  answer: B
  explanation: Un niño mayor de cuatro años pero menor de ocho años, que mida menos
    de 57 pulgadas de estatura y pese entre 20 y 65 libras, debe estar debidamente
    asegurado en un asiento elevado (booster seat).
- id: 96
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima para un conductor que no sujeta adecuadamente
    a un pasajero menor de 16 años?
  choices:
    A: Una multa de $15 y un punto de demérito
    B: Una multa de $50 y dos puntos de demérito
    C: Una multa de $100 y la suspensión de la licencia
    D: Una multa de $500 y tres puntos de demérito
  answer: B
  explanation: Un conductor puede ser multado con hasta $50 y puede recibir dos puntos
    de demérito en su licencia de conducir por no sujetar a los pasajeros menores
    de 16 años.
- id: 97
  category: penalties_and_points
  question: ¿Cómo puede un infractor adulto lograr que el tribunal le exonere de la
    multa de $15 por el cinturón de seguridad?
  choices:
    A: Realizando una prueba de concientización sobre el alcohol en línea
    B: Donando $15 a una organización de Servicios Médicos de Emergencia (EMS) aprobada
    C: Asistiendo a un curso de conducción defensiva
    D: Comprando un nuevo dispositivo de retención infantil aprobado por el gobierno
      federal
  answer: B
  explanation: Una disposición de la ley permite al tribunal exonerar la multa de
    $15 si la persona condenada dona $15 a una organización de EMS que figure en el
    Directorio de Servicios Médicos de Emergencia de Alaska.
- id: 98
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción a la ley de cinturones de seguridad
    de Alaska?
  choices:
    A: Pasajeros en un vehículo fabricado en 1975
    B: Operadores de vehículos que entregan correo desde el interior del vehículo
      a buzones al borde de la carretera
    C: Pasajeros en un taxi
    D: Niños menores de 16 años que viajan en el asiento trasero
  answer: B
  explanation: Una de las excepciones a la ley del cinturón de seguridad es para los
    operadores de vehículos que actúan en el curso de su empleo entregando correo
    o periódicos desde el interior del vehículo a buzones al borde de la carretera.
- id: 99
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la combinación
    de alcohol y medicamentos recetados?
  choices:
    A: Los medicamentos recetados anulan los efectos del alcohol.
    B: La combinación aumenta los efectos de cada fármaco individual y puede ser fatal.
    C: Solo las drogas ilegales interactúan peligrosamente con el alcohol.
    D: El alcohol solo interactúa con las anfetaminas y las pastillas para adelgazar.
  answer: B
  explanation: El manual establece que la combinación de otras drogas y alcohol aumenta
    los efectos de cada fármaco individual, y tales combinaciones pueden ser fatales,
    especialmente si se está conduciendo.
- id: 100
  category: safe_driving_rules
  question: Según el manual, ¿qué porcentaje de todas las colisiones de tráfico involucran
    fuego o sumersión?
  choices:
    A: Menos de 1/2 del 1%
    B: Aproximadamente el 5%
    C: Más del 10%
    D: Casi el 25%
  answer: A
  explanation: Las colisiones que involucran fuego o sumersión representan menos de
    1/2 del 1% de todas las colisiones de tráfico.
- id: 101
  category: driver_responsibility
  question: ¿Quién es legalmente responsable de asegurar que todos los pasajeros menores
    de 16 años estén debidamente sujetos en un vehículo?
  choices:
    A: Los pasajeros mismos
    B: Los padres de los pasajeros, incluso si no están presentes
    C: El conductor del vehículo
    D: El propietario del vehículo
  answer: C
  explanation: El manual establece explícitamente que el conductor es responsable
    de todos los pasajeros menores de 16 años y debe asegurarse de que estén debidamente
    sujetos.
- id: 102
  category: safe_driving_rules
  question: Según la ley de Alaska, ¿qué tipo de sistema de sujeción se requiere para
    un niño menor de 1 año de edad?
  choices:
    A: Asiento de seguridad orientado hacia adelante
    B: Asiento de seguridad orientado hacia atrás
    C: Asiento elevado (booster seat)
    D: Cinturón de seguridad estándar
  answer: B
  explanation: La ley de Alaska exige que los niños menores de 1 año, o los niños
    mayores de 1 año pero que pesen menos de 20 libras, estén asegurados en un asiento
    de seguridad orientado hacia atrás.
- id: 103
  category: safe_driving_rules
  question: 'Según la ley de Alaska, un niño debe estar debidamente asegurado en un
    asiento de seguridad o asiento elevado (booster seat) si tiene entre 4 y 8 años,
    mide menos de 4''9" de estatura y pesa menos de:'
  choices:
    A: 40 libras
    B: 50 libras
    C: 65 libras
    D: 80 libras
  answer: C
  explanation: La ley de Alaska exige que los niños mayores de 4 años y menores de
    8 años que midan menos de 4’9” y pesen menos de 65 libras estén debidamente asegurados
    en un asiento de seguridad o asiento elevado.
- id: 104
  category: safe_driving_rules
  question: Según las recomendaciones de mejores prácticas de la Academia Americana
    de Pediatría, ¿dónde deben estar sujetos todos los niños menores de 13 años?
  choices:
    A: En el asiento del pasajero delantero
    B: En los asientos traseros del vehículo
    C: En un asiento de seguridad orientado hacia adelante
    D: En el asiento delantero central
  answer: B
  explanation: Las recomendaciones de mejores prácticas establecen que todos los niños
    menores de 13 años deben estar sujetos en los asientos traseros de los vehículos
    para una protección óptima.
- id: 105
  category: driver_responsibility
  question: ¿Cuál de las siguientes actividades se menciona explícitamente como contraria
    a la ley mientras se conduce en Alaska?
  choices:
    A: Hablar con los pasajeros
    B: Escuchar la radio
    C: Enviar mensajes de texto y conducir
    D: Beber agua
  answer: C
  explanation: 'El manual establece: ''Nunca envíe mensajes de texto y conduzca, navegue
    por la web o lea su correo electrónico mientras conduce. Es peligroso y contra
    la ley en Alaska''.'
- id: 106
  category: safe_driving_rules
  question: ¿Cómo debe manejar a las mascotas cuando se prepara para conducir?
  choices:
    A: Dejar que se sienten en el asiento del pasajero delantero
    B: Sostenerlas en su regazo para mantenerlas tranquilas
    C: Permitirles deambular libremente en el asiento trasero
    D: Asegurarlas adecuadamente antes de empezar a conducir
  answer: D
  explanation: El manual aconseja 'asegurar siempre a sus mascotas adecuadamente antes
    de empezar a conducir' porque las mascotas pueden ser una gran distracción en
    el automóvil.
- id: 107
  category: defensive_driving
  question: ¿Bajo cuál de las siguientes condiciones ocurren la mayoría de los choques
    fatales?
  choices:
    A: Durante lluvia intensa o tormentas de nieve
    B: Por la noche en carreteras sin iluminación
    C: Durante las horas del día con clima despejado y superficies normales
    D: Cuando los vehículos tienen malas condiciones mecánicas
  answer: C
  explanation: Según el manual, ocurrieron más choques fatales durante las horas del
    día con superficie normal, condiciones climáticas despejadas y el vehículo en
    buenas condiciones mecánicas que bajo cualquier otra condición.
- id: 108
  category: driver_responsibility
  question: ¿Qué se identifica como la mayor causa individual de choques de tráfico?
  choices:
    A: Malas condiciones de la carretera
    B: El conductor
    C: Falla mecánica
    D: Mal clima
  answer: B
  explanation: El manual establece explícitamente que 'El conductor es la mayor causa
    individual de choques de tráfico'.
- id: 109
  category: signs_and_signals
  question: ¿Qué indican las banderas y señales anaranjadas en la carretera?
  choices:
    A: Una zona escolar
    B: Una zona de alto peligro, como mantenimiento y construcción
    C: Un cruce de ferrocarril más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Las banderas y señales anaranjadas indican una 'zona de alto peligro',
    que incluye zonas de mantenimiento y construcción.
- id: 110
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima sugerida al retroceder su vehículo?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: A
  explanation: El manual sugiere que su velocidad no debe exceder las 5 mph al retroceder.
- id: 111
  category: safe_driving_rules
  question: ¿Cuál es la técnica adecuada para dar marcha atrás con un vehículo?
  choices:
    A: Confiar totalmente en los espejos retrovisores y laterales
    B: Mantener ambas manos en la parte inferior del volante y mirar directamente
      hacia adelante
    C: Colocar la mano izquierda en la parte superior del volante, girar el cuerpo
      y la cabeza hacia la derecha y mirar por la ventana trasera
    D: Abrir la puerta del lado del conductor y mirar hacia atrás mientras gira el
      volante con la mano derecha
  answer: C
  explanation: Al dar marcha atrás, no debe depender de los espejos. En su lugar,
    con la mano izquierda en la parte superior del volante, gire el cuerpo y la cabeza
    hacia la derecha y mire por la ventana trasera.
- id: 112
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto al número de pasajeros en el asiento delantero?
  choices:
    A: Puede llevar tantos pasajeros como quepan cómodamente
    B: No puede conducir con más personas en el asiento delantero de las que el asiento
      fue diseñado para albergar
    C: Siempre se permite un máximo de tres pasajeros en el asiento delantero
    D: Solo se permite al conductor en el asiento delantero en todo momento
  answer: B
  explanation: Una persona no puede conducir con más personas en el asiento delantero
    de las que el asiento fue diseñado para albergar, ya que esto puede obstruir la
    vista del conductor o interferir con el control del vehículo.
- id: 113
  category: sharing_the_road
  question: En una carretera de dos carriles fuera de una zona urbana, ¿cuándo le
    exige la ley orillarse de forma segura para dejar pasar a otros vehículos?
  choices:
    A: Cuando hay un vehículo siguiéndole muy de cerca
    B: Cuando hay tres o más vehículos inmediatamente detrás de usted
    C: Cuando hay cinco o más vehículos inmediatamente detrás de usted
    D: Nunca se le exige orillarse por los vehículos que le siguen
  answer: C
  explanation: La ley AS 28.35.140 exige que los conductores en una carretera de dos
    carriles fuera de una zona urbana se orillen de forma segura cuando haya cinco
    o más vehículos inmediatamente detrás.
- id: 114
  category: defensive_driving
  question: Si está utilizando la regla de los cuatro segundos para la distancia de
    seguimiento, ¿qué debe hacer al remolcar un remolque o conducir en una carretera
    mojada?
  choices:
    A: Disminuir la distancia de seguimiento a dos segundos
    B: Mantener la distancia de seguimiento de cuatro segundos
    C: Aumentar la distancia de seguimiento a seis o más segundos
    D: Confiar únicamente en sus luces de freno para advertir al conductor que viene
      detrás
  answer: C
  explanation: Al remolcar un remolque o si la superficie de la carretera está mojada
    o resbaladiza, debe aumentar los cuatro segundos a seis o más.
- id: 115
  category: safe_driving_rules
  question: Aunque el manual recomienda una distancia de seguimiento de cuatro segundos,
    ¿cuál es la distancia mínima de seguimiento requerida por la ley de Alaska (13
    AAC 02.090)?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 4 segundos
  answer: B
  explanation: 'El manual señala: ''Si bien esta tabla recomienda el uso de la regla
    de los 4 segundos, la norma 13 AAC 02.090 exige como mínimo la regla de los 2
    segundos''.'
- id: 116
  category: defensive_driving
  question: ¿Cuál es una forma recomendada de disminuir la probabilidad de ser golpeado
    por detrás al prepararse para detenerse?
  choices:
    A: Frenar bruscamente de repente
    B: Hacer parpadear las luces de freno
    C: Encender las luces altas
    D: Virar bruscamente hacia el carril adyacente
  answer: B
  explanation: Para disminuir la probabilidad de un choque por alcance al detenerse,
    debe asegurarse de que sus luces de freno estén limpias y funcionen correctamente,
    y hacer parpadear las luces de freno cuando se prepare para detenerse.
- id: 117
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en un distrito comercial bajo condiciones
    favorables si no se indica lo contrario?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: De acuerdo con los límites de velocidad establecidos por la ley, la
    velocidad máxima para conducir en un distrito comercial bajo condiciones favorables
    es de 20 mph cuando no hay otra señalización.
- id: 118
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad no señalizado en un callejón?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad máximo establecido para un callejón bajo condiciones
    favorables, si no se indica lo contrario, es de 15 mph.
- id: 119
  category: defensive_driving
  question: Si duplica su velocidad de 20 mph a 40 mph, ¿cuánto mayores son el impacto
    y la distancia de frenado de su vehículo?
  choices:
    A: 2 veces mayores
    B: 3 veces mayores
    C: 4 veces mayores
    D: 8 veces mayores
  answer: C
  explanation: El manual establece que cuando duplica su velocidad de 20 a 40 mph,
    el impacto es 4 veces mayor y la distancia de frenado también es 4 veces más larga.
- id: 120
  category: safe_driving_rules
  question: 'Bajo la Ley de Limitación de Velocidad, una persona no puede conducir
    un vehículo a una velocidad mayor que la que le permita:'
  choices:
    A: Mantener el ritmo del tráfico que se mueve más rápido
    B: Detenerse dentro de la distancia despejada asegurada adelante
    C: Rebasar vehículos más lentos de forma segura
    D: Mantener una distancia de seguimiento de 4 segundos
  answer: B
  explanation: La Ley de Limitación de Velocidad dicta que una persona no puede conducir
    un vehículo en una carretera a una velocidad mayor que la que le permita detenerse
    dentro de la distancia despejada asegurada adelante.
- id: 121
  category: vehicle_information
  question: ¿Si el faro delantero de una motocicleta motorizada solo revela a una
    persona o vehículo a 100 pies, cuál es su velocidad máxima permitida?
  choices:
    A: 15 mph o menos
    B: 20 mph o menos
    C: 25 mph o menos
    D: 30 mph o menos
  answer: B
  explanation: La velocidad de una motocicleta motorizada está limitada por la intensidad
    del faro delantero. Si las luces revelan a una persona o vehículo a 100 pies,
    la velocidad se limita a 20 mph o menos.
- id: 122
  category: penalties_and_points
  question: ¿Cuál es la sanción por una condena por conducción temeraria?
  choices:
    A: Una advertencia
    B: Una multa de $500
    C: Revocación de la licencia
    D: Tiempo de cárcel obligatorio
  answer: C
  explanation: La conducción temeraria se define como un desprecio deliberado por
    la seguridad de las personas o la propiedad, y una condena resultará en la revocación
    de la licencia.
- id: 123
  category: sharing_the_road
  question: Al conducir en una carretera de varios carriles, ¿qué debe hacer ante
    los vehículos de emergencia que se encuentran en el arcén (shoulder)?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Acelerar para pasarlos rápidamente
    C: Tocar la bocina para reconocerlos
    D: Brindarles seguridad adicional cambiándose de carril
  answer: D
  explanation: El manual establece que se debe brindar seguridad adicional a los vehículos
    de emergencia en el arcén 'Cambiándose de Carril' (Moving Over), ya que es la
    ley (AS 28.35.185).
- id: 124
  category: penalties_and_points
  question: ¿Qué sucede con las multas por infracciones de tránsito que ocurren en
    los Corredores de Seguridad Vial (Traffic Safety Corridors) designados?
  choices:
    A: Se exoneran para los infractores por primera vez
    B: Se reducen a la mitad
    C: Se duplican
    D: Se triplican
  answer: C
  explanation: Para promover la seguridad vial, ciertas partes de la carretera pueden
    ser designadas como corredores de seguridad vial, donde las multas por infracciones
    de tránsito se duplican.
- id: 125
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe señalizar continuamente su intención de girar
    o moverse a la derecha o a la izquierda?
  choices:
    A: Durante los últimos 50 pies
    B: Durante los últimos 100 pies
    C: Durante los últimos 200 pies
    D: Durante los últimos 300 pies
  answer: B
  explanation: Se debe dar una señal direccional de la intención de girar o mover
    un vehículo a la derecha o a la izquierda de forma continua durante los últimos
    100 pies recorridos por el vehículo antes de girar.
- id: 126
  category: safe_driving_rules
  question: Al esperar para realizar un giro a la izquierda en una intersección, ¿cómo
    debe posicionar sus ruedas delanteras?
  choices:
    A: Mantenerlas apuntando hacia la izquierda
    B: Mantenerlas apuntando hacia la derecha
    C: Mantenerlas rectas
    D: Girarlas en dirección a la acera
  answer: C
  explanation: Al prepararse para un giro a la izquierda, debe esperar a los vehículos
    que vienen en sentido contrario antes de entrar en la intersección y mantener
    las ruedas delanteras rectas mientras espera.
- id: 127
  category: vehicle_information
  question: Para remolcar legalmente más de un vehículo en la vía pública, el vehículo
    remolcador debe pesar más de 15,000 libras, tener un sistema de frenos de aire
    y ¿tener al menos cuántos ejes?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Ninguna persona puede operar un vehículo motorizado que remolque más
    de un vehículo a menos que el vehículo remolcador pese más de 15,000 libras, tenga
    tres o más ejes y esté equipado con un sistema de frenos de aire.
- id: 128
  category: safe_driving_rules
  question: Cuando dos vehículos se aproximan al mismo tiempo a una intersección no
    controlada y existe peligro de colisión, ¿quién debe ceder el paso?
  choices:
    A: El conductor del vehículo de la derecha debe ceder el paso al vehículo de la
      izquierda
    B: El conductor del vehículo de la izquierda debe ceder el paso al vehículo de
      la derecha
    C: El vehículo más grande debe ceder el paso al vehículo más pequeño
    D: El vehículo que viaja más rápido tiene el derecho de paso
  answer: B
  explanation: Según la Ley de Derecho de Paso para intersecciones no controladas,
    cuando dos vehículos se aproximan en tal posición y tiempo que existe peligro
    de colisión, el conductor del vehículo de la izquierda debe ceder el paso al conductor
    del vehículo de la derecha.
- id: 129
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en una intersección no controlada?
  choices:
    A: Los vehículos motorizados sobre los usuarios no motorizados
    B: Los usuarios no motorizados sobre los vehículos motorizados
    C: El vehículo que llega al último
    D: El vehículo que viaja por la carretera más ancha
  answer: B
  explanation: El manual establece explícitamente que un usuario no motorizado tiene
    el derecho de paso en intersecciones no controladas frente a los vehículos motorizados.
- id: 130
  category: sharing_the_road
  question: Según el manual, ¿cuál de las siguientes afirmaciones es verdadera con
    respecto a los ciclistas y la señalización?
  choices:
    A: Los ciclistas no están obligados a señalizar los giros
    B: Los ciclistas deben usar señales de giro electrónicas
    C: Los ciclistas están obligados a usar señales manuales para indicar un giro
    D: Los ciclistas solo necesitan señalizar cuando giran a la izquierda
  answer: C
  explanation: La sección de señalización del manual especifica que los ciclistas
    también están obligados a usar señales manuales para indicar un giro.
- id: 131
  category: safe_driving_rules
  question: ¿Qué debe hacer si usted y otro vehículo se aproximan a una intersección
    no controlada al mismo tiempo?
  choices:
    A: Ceder el paso al vehículo de la izquierda.
    B: Ceder el paso al vehículo de la derecha.
    C: El vehículo más grande tiene el derecho de paso.
    D: Acelerar para despejar la intersección primero.
  answer: B
  explanation: Si los vehículos se aproximan a una intersección al mismo tiempo, el
    conductor del vehículo de la izquierda debe ceder el paso al conductor del vehículo
    de la derecha.
- id: 132
  category: safe_driving_rules
  question: ¿Cuál es la velocidad de diseño típica para la mayoría de las rotondas?
  choices:
    A: 10-15 mph
    B: 15-20 mph
    C: 25-30 mph
    D: 35-40 mph
  answer: B
  explanation: La mayoría de las rotondas están diseñadas para velocidades de aproximadamente
    15-20 mph. Debe reducir la velocidad al acercarse al círculo.
- id: 133
  category: safe_driving_rules
  question: Al conducir dentro de una rotonda, ¿cuál es una regla importante a seguir?
  choices:
    A: Detenerse para dejar entrar al tráfico que ingresa.
    B: Circular siempre en el sentido de las agujas del reloj alrededor de la isla
      central.
    C: Una vez dentro, no se detenga.
    D: Cambiar de carril con frecuencia para encontrar la ruta más rápida.
  answer: C
  explanation: Una vez dentro de una rotonda, no se detenga. Los vehículos circulan
    en sentido contrario a las agujas del reloj y el tráfico que se aproxima debe
    ceder el paso al tráfico que ya está en el círculo.
- id: 134
  category: signs_and_signals
  question: ¿Dónde debe detenerse al acercarse a una señal de alto (STOP)?
  choices:
    A: Solo cuando haya otros vehículos presentes.
    B: Diez pies antes de la señal de alto.
    C: Detrás del paso de peatones, en la línea de parada pintada o detrás de la línea
      del arcén de la carretera que se cruza.
    D: En medio de la intersección para tener una mejor vista.
  answer: C
  explanation: En una señal de alto, debe detenerse detrás del paso de peatones, en
    la línea de parada pintada o detrás de la línea del arcén de la carretera que
    se cruza.
- id: 135
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a una luz roja intermitente?
  choices:
    A: Reducir la velocidad y continuar sin detenerse si el camino está despejado.
    B: Detenerse, luego continuar cuando el camino esté despejado y sea seguro hacerlo.
    C: Tratarla como una señal de ceda el paso y solo detenerse para los peatones.
    D: Esperar hasta que la luz se ponga verde antes de continuar.
  answer: B
  explanation: Al acercarse a una luz roja intermitente, debe detenerse y luego continuar
    cuando el camino esté despejado y sea seguro hacerlo.
- id: 136
  category: safe_driving_rules
  question: ¿Cuál es el uso adecuado de un carril central?
  choices:
    A: Rebasar vehículos más lentos en una calle de doble sentido.
    B: Desacelerar antes de girar a la izquierda.
    C: Acelerar para incorporarse al tráfico de la autopista.
    D: Estacionarse temporalmente para entregas.
  answer: B
  explanation: Los carriles centrales están reservados para desacelerar antes de girar
    a la izquierda. No puede usar un carril central para rebasar.
- id: 137
  category: safe_driving_rules
  question: ¿Qué indica el final de una 'zona de no rebasar' (no passing zone)?
  choices:
    A: Es seguro rebasar inmediatamente.
    B: Debe aumentar su velocidad.
    C: Hay mayor visibilidad más adelante.
    D: El límite de velocidad ha aumentado.
  answer: C
  explanation: El final de una 'zona de no rebasar' no significa que sea seguro rebasar.
    Significa que hay mayor visibilidad más adelante.
- id: 138
  category: defensive_driving
  question: Cuando otro vehículo lo está rebasando, ¿qué es ilegal hacer?
  choices:
    A: Mantener su velocidad actual.
    B: Moverse ligeramente hacia la derecha.
    C: Aumentar su velocidad.
    D: Revisar sus espejos.
  answer: C
  explanation: Cuando lo están rebasando, es ilegal aumentar su velocidad.
- id: 139
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones está prohibido rebasar?
  choices:
    A: En una carretera recta y nivelada con una línea amarilla discontinua.
    B: A menos de 100 pies de una intersección o cruce de ferrocarril.
    C: Cuando el vehículo de adelante circula por debajo del límite de velocidad.
    D: En una autopista de varios carriles con líneas blancas discontinuas.
  answer: B
  explanation: No debe rebasar al acercarse a menos de 100 pies de una intersección
    o cruce de ferrocarril, ni al atravesarlos, ni al acercarse a menos de 100 pies
    de un puente estrecho, viaducto o túnel señalizado.
- id: 140
  category: signs_and_signals
  question: ¿Qué indican las señales de advertencia (negro sobre amarillo)?
  choices:
    A: Servicios para su conveniencia, como gasolina o alojamiento.
    B: Destino, guía de ruta y nombres de lugares.
    C: Condiciones peligrosas reales o potenciales más adelante.
    D: Instrucciones respaldadas por estatutos estatales que deben obedecerse.
  answer: C
  explanation: Las señales de advertencia alertan a los conductores sobre condiciones
    peligrosas reales o potenciales más adelante. Se debe tener precaución adicional
    y los conductores generalmente deben disminuir su velocidad.
- id: 141
  category: signs_and_signals
  question: ¿De qué color y forma son las señales escolares que advierten sobre zonas
    escolares y cruces peatonales?
  choices:
    A: Negro sobre naranja, en forma de diamante
    B: Blanco sobre verde, rectangulares
    C: Negro sobre amarillo, de cinco lados
    D: Blanco sobre azul, circulares
  answer: C
  explanation: Las señales escolares son señales de cinco lados de color negro sobre
    amarillo, que advierten sobre zonas escolares y cruces peatonales escolares que
    requieren una velocidad reducida.
- id: 142
  category: signs_and_signals
  question: ¿Qué indica un círculo rojo con una franja diagonal en una señal de tráfico?
  choices:
    A: Que hay un cruce de ferrocarril más adelante.
    B: Movimiento prohibido.
    C: Que se requiere una parada.
    D: La carretera está cerrada por construcción.
  answer: B
  explanation: Un círculo rojo con una franja diagonal indica un movimiento prohibido.
- id: 143
  category: signs_and_signals
  question: ¿Qué tipo de información proporciona una señal de guía (blanco sobre verde)?
  choices:
    A: Condiciones peligrosas reales o potenciales más adelante.
    B: Condiciones temporales que requieren una alerta especial.
    C: Destino, guía de ruta y nombres de lugares.
    D: Servicios como comida, alojamiento y áreas de descanso.
  answer: C
  explanation: El destino, la guía de ruta y los nombres de lugares se le proporcionan
    en las señales de guía, que son de color blanco sobre verde.
- id: 144
  category: safe_driving_rules
  question: En una intersección con semáforo, ¿qué debe hacer cuando la luz cambia
    a verde?
  choices:
    A: Avanzar inmediatamente sin verificar el tráfico.
    B: Ceder el paso a los peatones y vehículos atrapados en la intersección.
    C: Tocar la bocina para alertar a los vehículos en la intersección.
    D: Girar a la derecha en rojo si el camino está despejado.
  answer: B
  explanation: En una intersección con semáforo, cuando la luz cambia a verde, debe
    ceder el paso a los peatones y vehículos atrapados en la intersección.
- id: 145
  category: signs_and_signals
  question: Según el manual, ¿cuál es el límite de velocidad requerido al acercarse
    a cruces peatonales escolares marcados?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El manual establece que los conductores deben reducir su velocidad
    a 20 mph según lo marcado para los cruces peatonales escolares.
- id: 146
  category: sharing_the_road
  question: ¿Cuál es la tasa de supervivencia aproximada de un peatón golpeado por
    un automóvil de pasajeros a una velocidad de colisión de 25 mph?
  choices:
    A: Casi el 100%
    B: Aproximadamente el 90%
    C: Menos del 50%
    D: Solo el 10%
  answer: B
  explanation: Según el manual, aproximadamente el 90% de los peatones sobreviven
    a un choque con un automóvil de pasajeros a una velocidad de colisión de 25 mph.
- id: 147
  category: safe_driving_rules
  question: ¿Qué debe hacer si un vehículo está detenido en un cruce peatonal delante
    de usted?
  choices:
    A: Rebasar el vehículo por la izquierda si el carril está despejado.
    B: Tocar la bocina para advertir a los peatones antes de rebasar.
    C: Nunca rebasar al vehículo detenido.
    D: Rebasar el vehículo lentamente mientras verifica si hay peatones.
  answer: C
  explanation: 'El manual establece explícitamente: "Nunca rebase a los vehículos
    detenidos en un cruce peatonal. Puede haber personas cruzando donde usted no puede
    ver".'
- id: 148
  category: sharing_the_road
  question: Al caminar por una carretera como peatón, ¿por dónde debe caminar?
  choices:
    A: En el lado derecho de la carretera moviéndose con el tráfico.
    B: En el lado izquierdo de la carretera de frente al tráfico que viene en sentido
      contrario.
    C: En la mediana central siempre que sea posible.
    D: En el lado que tenga un arcén más ancho.
  answer: B
  explanation: Su responsabilidad como peatón incluye caminar en el lado izquierdo
    de la carretera de frente al tráfico que viene en sentido contrario.
- id: 149
  category: sharing_the_road
  question: ¿Cómo puede un ciclista señalizar correctamente un giro a la derecha usando
    señales manuales?
  choices:
    A: Extendiendo el brazo izquierdo completamente hacia la izquierda.
    B: Extendiendo el brazo izquierdo y doblándolo hacia abajo por el codo.
    C: Extendiendo el brazo izquierdo y doblándolo hacia arriba por el codo.
    D: Extendiendo el brazo derecho y doblándolo hacia abajo por el codo.
  answer: C
  explanation: Un ciclista puede señalizar un giro a la derecha extendiendo el brazo
    derecho recto hacia la derecha, o teniendo el brazo izquierdo extendido y doblado
    hacia arriba por el codo.
- id: 150
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su licencia de conducir por una infracción
    de tráfico cometida mientras conduce una bicicleta en Alaska?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: El mismo número de puntos que una infracción en un vehículo motorizado.
    D: No se asignan puntos.
  answer: D
  explanation: La ley de Alaska AS 28.15.231 (b) establece que no se asignan puntos
    por infracciones de tráfico cuando se utiliza una bicicleta.
- id: 151
  category: sharing_the_road
  question: ¿Cuál es la recomendación de seguridad para los ciclistas que deciden
    usar auriculares mientras conducen?
  choices:
    A: Es ilegal usar cualquier tipo de auriculares mientras se anda en bicicleta.
    B: Siempre debe mantener un auricular fuera del oído.
    C: Puede usar ambos auriculares si el volumen se mantiene bajo.
    D: Solo se permiten auriculares que cubren toda la oreja.
  answer: B
  explanation: 'El manual aconseja: "Si va a usar auriculares mientras anda en bicicleta,
    asegúrese de mantener siempre un auricular fuera del oído" para que pueda escuchar
    a los peatones, el tráfico y otros peligros.'
- id: 152
  category: sharing_the_road
  question: ¿Cuál de las siguientes situaciones causa un gran porcentaje de choques
    entre automóviles y motocicletas?
  choices:
    A: Motociclistas que exceden el límite de velocidad en la autopista.
    B: Conductores que giran a la izquierda frente a motociclistas que vienen en sentido
      contrario.
    C: Motociclistas que siguen muy de cerca a los vehículos de pasajeros.
    D: Conductores que rebasan motocicletas por el lado derecho.
  answer: B
  explanation: El manual señala que los conductores que giran a la izquierda frente
    a motociclistas que vienen en sentido contrario causan un gran porcentaje de choques
    entre automóviles y motocicletas porque los conductores a menudo no ven al ciclista
    o juzgan mal su velocidad.
- id: 153
  category: defensive_driving
  question: 'Al revisar sus puntos ciegos en busca de ciclistas antes de realizar
    un giro o abrir una puerta, usted debe:'
  choices:
    A: Confiar únicamente en sus espejos retrovisores y laterales.
    B: Girar la cabeza para buscar ciclistas que puedan estar acercándose.
    C: Tocar la bocina para advertir a cualquier ciclista en su punto ciego.
    D: Acelerar para pasar el punto ciego rápidamente.
  answer: B
  explanation: 'El manual instruye a los conductores: "No dependa solo de sus espejos;
    gire la cabeza para buscar ciclistas que puedan estar al lado de ellos o acercándose".'
- id: 154
  category: signs_and_signals
  question: ¿Qué equipo utilizan generalmente los banderilleros (flag persons) para
    dirigir el tráfico de manera segura a través de las zonas de obra?
  choices:
    A: Banderas verdes o paletas de "siga/pare".
    B: Cascos amarillos y silbatos.
    C: Banderas rojas o paletas de "pare/despacio" (stop/slow).
    D: Paneles de flechas secuenciales intermitentes.
  answer: C
  explanation: Los banderilleros generalmente usan chalecos, camisas o chaquetas de
    color naranja, y utilizan banderas rojas o paletas de "pare/despacio" (stop/slow)
    para dirigir el tráfico a través de las zonas de obra.
- id: 155
  category: safe_driving_rules
  question: Como peatón, ¿qué debe hacer si se acerca a una intersección con un semáforo
    en verde "viejo" (stale) al que casi se le acaba el tiempo?
  choices:
    A: Correr rápidamente para cruzar antes de que cambie a rojo.
    B: Nunca cruzar la calle con un semáforo en verde "viejo".
    C: Cruzar solo si no hay vehículos girando.
    D: Ceder el paso a los vehículos en la intersección y luego cruzar.
  answer: B
  explanation: La responsabilidad de un peatón incluye "Nunca cruzar una calle con
    un semáforo en verde 'viejo' (stale) al que se le ha acabado el tiempo o cuando
    aparece una señal fija o intermitente de 'No caminar' (Don't Walk) o una mano
    levantada".
- id: 156
  category: sharing_the_road
  question: ¿Por qué los conductores deben tener especial cuidado al conducir cerca
    de niños que andan en bicicleta?
  choices:
    A: Se requiere que los niños circulen en sentido contrario al tráfico.
    B: Los niños menores de nueve años carecen del desarrollo físico y mental para
      interactuar de manera segura en el tráfico.
    C: A los niños se les permite legalmente ignorar las señales de tráfico.
    D: Las bicicletas de los niños no están equipadas con reflectores.
  answer: B
  explanation: 'El manual establece: "Los menores de nueve años carecen del desarrollo
    físico y mental para interactuar de manera segura en ese entorno, por lo que debe
    tener cuidado al conducir cerca de niños que andan en bicicleta".'
- id: 157
  category: signs_and_signals
  question: ¿Qué acción se requiere de los camiones cuando se enfrentan a una señal
    que indica una pendiente descendente pronunciada más adelante?
  choices:
    A: Los camiones deben acelerar para mantener el impulso.
    B: Los camiones deben detenerse a un lado e inspeccionar sus frenos.
    C: Los camiones deben cambiar a una marcha más alta.
    D: Los camiones deben reducir la velocidad y cambiar a una marcha más baja.
  answer: D
  explanation: La descripción de la señal para una pendiente descendente pronunciada
    indica que "requiere que los camiones reduzcan la velocidad y cambien a una marcha
    más baja".
- id: 158
  category: sharing_the_road
  question: ¿Cuál es una regla de seguridad clave para los ciclistas con respecto
    a los vehículos que giran?
  choices:
    A: Rebasar a los vehículos que giran por el lado hacia el cual están realizando
      el giro.
    B: Rebasar a los vehículos que giran solo por el lado izquierdo.
    C: No rebasar cuando los vehículos están girando, especialmente por el lado hacia
      el cual están realizando el giro.
    D: Tocar la bocina ruidosamente y rebasar al vehículo que gira por la derecha.
  answer: C
  explanation: Se aconseja a los ciclistas mantenerse fuera de los puntos ciegos y
    "No rebasar cuando los vehículos están girando, especialmente por el lado hacia
    el cual están realizando el giro".
- id: 159
  category: defensive_driving
  question: ¿Por qué las motocicletas son particularmente peligrosas para que otros
    conductores interactúen con ellas en la carretera?
  choices:
    A: Siempre viajan mucho más rápido que el límite de velocidad indicado.
    B: Es difícil juzgar a qué distancia se encuentran o a qué velocidad viajan.
    C: No están obligadas a seguir las mismas reglas de derecho de paso que los automóviles.
    D: Su único faro las hace completamente invisibles durante el día.
  answer: B
  explanation: El manual establece que las motocicletas no se identifican fácilmente
    en el tráfico, e incluso cuando los conductores las ven, "muchos dicen que es
    difícil juzgar a qué distancia están los motociclistas o a qué velocidad viajan".
- id: 160
  category: sharing_the_road
  question: Según el manual, ¿cuál es una de las principales causas de choques entre
    automóviles y motocicletas?
  choices:
    A: Motociclistas que exceden la velocidad en carreteras abiertas
    B: Conductores que giran a la izquierda frente a motociclistas que vienen en sentido
      contrario
    C: Motociclistas que no utilizan sus señales de giro
    D: Conductores que siguen muy de cerca a las motocicletas en mal tiempo
  answer: B
  explanation: El manual establece que los conductores que giran a la izquierda frente
    a motociclistas que vienen en sentido contrario causan un gran porcentaje de choques
    entre automóviles y motocicletas porque los conductores a menudo no logran distinguir
    al ciclista en la escena del tráfico o juzgan su velocidad de manera inexacta.
- id: 161
  category: sharing_the_road
  question: ¿Qué distancia de seguimiento debe mantener cuando conduce detrás de una
    motocicleta?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: C
  explanation: El manual especifica que se debe mantener la misma distancia de seguimiento
    de cuatro segundos con los motociclistas que con otros vehículos.
- id: 162
  category: sharing_the_road
  question: 'Si un motociclista circula por un lado de un carril ancho, usted debe:'
  choices:
    A: Moverse al mismo carril para rebasarlo de forma segura
    B: Compartir el carril solo si conduce un automóvil compacto
    C: Tocar la bocina para avisarle que lo está rebasando en su carril
    D: Nunca moverse al mismo carril con la motocicleta
  answer: D
  explanation: Las motocicletas necesitan el ancho completo de un carril. El manual
    establece explícitamente que nunca se debe entrar en el mismo carril que una motocicleta,
    incluso si el carril es ancho y el conductor circula por un lado, ya que es ilegal
    y extremadamente peligroso.
- id: 163
  category: sharing_the_road
  question: 'Antes de girar frente a un motociclista que tiene una luz direccional
    parpadeando, usted debe:'
  choices:
    A: Asumir que va a girar y proceder con su giro
    B: Asegurarse de que el conductor realmente esté girando y no continúe recto con
      una señal olvidada
    C: Acelerar para completar su giro antes de que llegue a la intersección
    D: Hacer un cambio de luces para advertirle de su giro
  answer: B
  explanation: Las luces direccionales no se apagan automáticamente en la mayoría
    de las motocicletas. Debe asegurarse de que el conductor esté girando y no continúe
    recto en su camino con una señal de giro olvidada que aún parpadea.
- id: 164
  category: safe_driving_rules
  question: 'Al acercarse por detrás a un autobús escolar que tiene sus luces rojas
    intermitentes encendidas, usted debe:'
  choices:
    A: Reducir la velocidad a 10 mph y pasar con precaución
    B: Detener su vehículo por completo antes de llegar al autobús
    C: Tocar la bocina y pasar por el lado izquierdo
    D: Detenerse solo si hay niños cruzando activamente la calle
  answer: B
  explanation: Los conductores que se acerquen a un autobús escolar por detrás no
    pueden rebasarlo cuando las luces rojas intermitentes están encendidas y deben
    detener sus vehículos por completo antes de llegar al autobús escolar.
- id: 165
  category: safe_driving_rules
  question: ¿Bajo qué condición NO se requiere que se detenga ante un autobús escolar
    con luces rojas intermitentes?
  choices:
    A: Cuando llega tarde a una emergencia documentada
    B: Al acercarse desde la dirección opuesta en una carretera con calzadas separadas
      que tengan dos o más carriles en cada dirección
    C: Cuando el autobús escolar está detenido en una zona escolar designada
    D: Cuando conduce un vehículo comercial
  answer: B
  explanation: Los conductores en una carretera con calzadas separadas que tengan
    dos o más carriles en cada dirección no necesitan detenerse cuando se acercan
    a un autobús escolar que se dirige en la dirección opuesta.
- id: 166
  category: vehicle_information
  question: 'El emblema de Vehículo de Movimiento Lento (SMV) es obligatorio en todos
    los vehículos que viajan a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de Vehículo de Movimiento Lento (SMV) es un dispositivo
    de seguridad requerido en todos los vehículos de movimiento lento (25 mph o menos).
- id: 167
  category: signs_and_signals
  question: ¿Cómo se ve un emblema de Vehículo de Movimiento Lento (SMV) durante el
    día?
  choices:
    A: Un triángulo sólido de color naranja fluorescente brillante
    B: Un triángulo hueco rojo reflectante
    C: Un diamante amarillo con letras negras
    D: Un rectángulo blanco con un borde rojo
  answer: A
  explanation: Durante el día, el triángulo sólido de color naranja fluorescente brillante
    en el centro del emblema SMV es altamente visible.
- id: 168
  category: signs_and_signals
  question: 'Al estar frente a una señal de tráfico de LUZ ROJA fija, se permiten
    los giros a la derecha:'
  choices:
    A: En cualquier momento sin detenerse, siempre que la intersección esté despejada
    B: Solo después de una parada completa, cuando sea seguro y no esté restringido
      por una señal
    C: Solo si se encuentra en un carril designado para girar a la derecha
    D: Los giros a la derecha en rojo nunca están permitidos
  answer: B
  explanation: Los giros a la derecha están permitidos solo después de una parada
    completa, cuando el giro se puede realizar de manera segura y no está restringido
    por una señal de 'No girar en rojo'.
- id: 169
  category: signs_and_signals
  question: ¿Qué debe hacer cuando se enfrenta a una señal de tráfico de FLECHA ROJA?
  choices:
    A: Detenerse, luego proceder con precaución en la dirección de la flecha
    B: Ceder el paso al tráfico que viene en sentido contrario y realizar el giro
    C: Detenerse y no realizar el movimiento indicado hasta que la flecha cambie a
      verde o amarillo intermitente
    D: Realizar el giro solo si no hay peatones en el cruce peatonal
  answer: C
  explanation: Una flecha roja significa que no debe realizar el movimiento indicado.
    No se permiten giros hasta que la flecha cambie a verde o amarillo intermitente.
- id: 170
  category: signs_and_signals
  question: ¿Qué acción se requiere al acercarse a una señal de tráfico de LUZ ROJA
    INTERMITENTE?
  choices:
    A: Reducir la velocidad y ceder el paso a los peatones
    B: Detenerse detrás del cruce peatonal o la línea de parada y proceder solo cuando
      sea seguro
    C: Pasar por la intersección sin detenerse si está despejada
    D: Esperar a que la luz se ponga verde fija antes de avanzar
  answer: B
  explanation: Ante una luz roja intermitente, debe detenerse detrás del cruce peatonal
    o la línea de parada, mirar en todas las direcciones para ver si se acercan vehículos
    y peatones, y proceder solo cuando sea seguro hacerlo.
- id: 171
  category: signs_and_signals
  question: 'Si se aproxima a una intersección donde el semáforo está completamente
    apagado y nadie está dirigiendo el tráfico, usted debe:'
  choices:
    A: Tratarlo como una señal de ceder el paso y avanzar lentamente
    B: Detenerse y ceder el paso al tráfico que se aproxima a la intersección por
      su derecha
    C: Mantener su velocidad si viaja por la carretera más grande
    D: Esperar en la intersección hasta que el semáforo se encienda de nuevo
  answer: B
  explanation: Si un semáforo no tiene ninguna de sus bombillas funcionando, la intersección
    se considera no controlada. Debe detenerse y ceder el paso al tráfico que se aproxima
    a la intersección por su derecha.
- id: 172
  category: safe_driving_rules
  question: 'Si un oficial de policía está dirigiendo el tráfico en una intersección
    con un semáforo que funciona, usted debe:'
  choices:
    A: Seguir las luces del semáforo
    B: Seguir las instrucciones del oficial de policía independientemente del semáforo
    C: Detenerse y esperar a que el semáforo se ponga en verde antes de seguir las
      instrucciones del oficial
    D: Tocar la bocina para llamar la atención del oficial antes de avanzar
  answer: B
  explanation: Debe seguir las instrucciones de un oficial de policía, bombero o personal
    autorizado con banderas, independientemente de las señales o semáforos.
- id: 173
  category: signs_and_signals
  question: ¿Qué significa una señal peatonal de MANO LEVANTADA NARANJA FIJA?
  choices:
    A: Los peatones pueden cruzar la calzada con cuidado
    B: Los peatones no deben bajar de la acera ni entrar en la calzada
    C: Los peatones tienen el derecho de paso sobre todos los vehículos que giran
    D: Los peatones deben correr por la calle rápidamente
  answer: B
  explanation: La mano levantada naranja fija significa que los peatones no deben
    bajar de la acera ni entrar en la calzada en la dirección de la señal.
- id: 174
  category: sharing_the_road
  question: ¿Cómo podría reaccionar un motociclista al cruzar las vías del tren?
  choices:
    A: Acelerar para cruzar las vías lo más rápido posible
    B: Virar bruscamente para evitar las vías por completo
    C: Reducir la velocidad, levantarse del asiento y cambiar de dirección para cruzar
      de frente
    D: Detenerse por completo y llevar la motocicleta caminando a través de las vías
  answer: C
  explanation: Los cruces ferroviarios a nivel suelen hacer que el motociclista reduzca
    la velocidad y se levante del asiento para ayudar a amortiguar el impacto. El
    conductor también puede cambiar de dirección para que las vías se puedan cruzar
    de frente.
- id: 175
  category: signs_and_signals
  question: ¿Qué debe hacer un peatón si ya está en la calzada cuando aparece la señal
    naranja intermitente de 'DON'T WALK' (NO CAMINE)?
  choices:
    A: Detenerse inmediatamente y esperar a la siguiente señal de caminar.
    B: Dar la vuelta y regresar a la acera original.
    C: Continuar hasta el otro lado de la calzada.
    D: Correr lo más rápido posible hacia la mediana más cercana.
  answer: C
  explanation: Según el manual, cuando la señal naranja intermitente de DON'T WALK
    está activa, los peatones no pueden entrar en la calzada, pero aquellos que ya
    están en ella pueden continuar hasta el otro lado.
- id: 176
  category: signs_and_signals
  question: Al conducir en un carril reversible, ¿qué indica una señal de X amarilla
    fija?
  choices:
    A: Puede usar el carril pero debe reducir su velocidad.
    B: Debe despejar el carril de manera segura porque está a punto de aparecer una
      X roja.
    C: Actualmente se permite que el tráfico en sentido contrario use el carril.
    D: Se está aproximando a un cruce de ferrocarril.
  answer: B
  explanation: Una X amarilla fija indica que debe despejar el carril de manera segura
    porque está a punto de aparecer una señal de X roja.
- id: 177
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las marcas
    en el pavimento?
  choices:
    A: Son solo sugerencias y no tienen fuerza de ley.
    B: Tienen la misma fuerza de ley que las señales o semáforos.
    C: Solo se aplican durante las horas del día.
    D: Son secundarias a las instrucciones verbales de los pasajeros.
  answer: B
  explanation: El manual establece que debe leer las marcas de tráfico, saber qué
    significan y obedecerlas, ya que las marcas en el pavimento tienen la misma fuerza
    de ley que las señales o semáforos.
- id: 178
  category: signs_and_signals
  question: ¿Cuál es la principal diferencia entre las marcas viales amarillas y blancas?
  choices:
    A: Las líneas amarillas separan el tráfico que va en direcciones opuestas, mientras
      que las líneas blancas separan el tráfico que va en la misma dirección.
    B: Las líneas amarillas indican zonas de estacionamiento, mientras que las líneas
      blancas indican carriles de circulación.
    C: Las líneas blancas separan el tráfico que va en direcciones opuestas, mientras
      que las líneas amarillas separan el tráfico que va en la misma dirección.
    D: Las líneas amarillas se usan solo en autopistas, mientras que las líneas blancas
      se usan en calles de la ciudad.
  answer: A
  explanation: Las marcas amarillas separan el flujo de tráfico que va en direcciones
    opuestas, mientras que las marcas blancas separan el tráfico que va en la misma
    dirección.
- id: 179
  category: safe_driving_rules
  question: ¿Qué maniobra está legalmente permitida a través de una línea central
    amarilla continua?
  choices:
    A: Rebasar a un vehículo que circula despacio.
    B: Acelerar para incorporarse al tráfico.
    C: Girar hacia una entrada privada o camino de entrada.
    D: Usar el carril contrario para evitar un atasco de tráfico.
  answer: C
  explanation: Las líneas centrales amarillas continuas indican dónde no se permite
    rebasar; sin embargo, se permite girar hacia una entrada privada a través de ellas.
- id: 180
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones está prohibida al usar un carril compartido
    de giro a la izquierda en ambos sentidos?
  choices:
    A: Ceder el paso al tráfico que viene en sentido contrario.
    B: Ceder el paso a los peatones.
    C: Usar el carril para realizar un giro a la izquierda.
    D: Usar el carril para conducir, acelerar o rebasar.
  answer: D
  explanation: El manual especifica que no está permitido usar el carril central de
    giro a la izquierda como carril para conducir, acelerar o rebasar.
- id: 181
  category: defensive_driving
  question: ¿Qué debe hacer si se da cuenta de que está en el carril equivocado para
    girar justo al entrar en una intersección?
  choices:
    A: Detenerse y esperar a que el tráfico se despeje para poder cambiar de carril.
    B: Hacer el giro de todos modos si usa su señal de giro.
    C: Continuar recto y dar la vuelta a la manzana.
    D: Retroceder lentamente hasta que pueda entrar en el carril correcto.
  answer: C
  explanation: Si se encuentra en el carril equivocado para girar al entrar en una
    intersección, no gire ni obstaculice el paso para poder girar. Debe continuar
    y dar la vuelta a la manzana.
- id: 182
  category: vehicle_information
  question: Si conduce un vehículo con transmisión manual, ¿qué debe hacer al cruzar
    las vías del tren?
  choices:
    A: Poner punto muerto (neutral) mientras cruza las vías.
    B: Reducir la marcha antes del cruce y no cambiar de velocidad mientras cruza.
    C: Cambiar a una marcha superior para cruzar las vías más rápidamente.
    D: Detenerse en las vías para cambiar de marcha de forma segura.
  answer: B
  explanation: El manual aconseja nunca cambiar de marcha en el cruce. Si su vehículo
    tiene transmisión manual, reduzca la marcha de antemano y no cambie de velocidad
    mientras cruza las vías.
- id: 183
  category: safe_driving_rules
  question: ¿Debe estar preparado para detenerse en un cruce de ferrocarril si un
    tren se encuentra a qué distancia?
  choices:
    A: 500 pies
    B: 1000 pies
    C: 1500 pies
    D: 2000 pies
  answer: C
  explanation: Deténgase siempre cuando un tren esté cerca de un cruce. Esté preparado
    para detenerse si un tren se encuentra a menos de 1500 pies del cruce.
- id: 184
  category: defensive_driving
  question: Si su vehículo se queda atascado en las vías del tren y se aproxima un
    tren, ¿en qué dirección debe correr después de salir del vehículo?
  choices:
    A: Correr en la misma dirección en la que viaja el tren.
    B: Correr alejándose directamente de las vías en línea perpendicular.
    C: Correr en la dirección de donde viene el tren.
    D: Correr hacia la barrera del cruce de ferrocarril más cercana.
  answer: C
  explanation: Si se queda atascado en las vías, debe salir y alejarse tanto de las
    vías como del vehículo. Debe correr en la dirección de donde viene el tren para
    evitar los escombros que salgan volando si el vehículo es golpeado.
- id: 185
  category: signs_and_signals
  question: ¿Qué información se proporciona en la señal azul del Sistema de Notificación
    de Emergencia (ENS) en un cruce de ferrocarril para ayudar a los despachadores
    a identificar su ubicación exacta?
  choices:
    A: Un código de coordenadas GPS.
    B: Un número del Departamento de Transporte (DOT).
    C: El nombre de la carretera secundaria más cercana.
    D: El número de precinto del departamento de policía local.
  answer: B
  explanation: Directamente debajo del número de despacho en la señal ENS hay un número
    del Departamento de Transporte (DOT) que identifica la ubicación exacta del cruce
    en cuestión.
- id: 186
  category: signs_and_signals
  question: ¿Qué requieren de un automovilista las leyendas especiales en el pavimento
    como 'STOP AHEAD', 'SCHOOL' y 'R X R'?
  choices:
    A: Requieren que el conductor se detenga a un lado de la carretera inmediatamente.
    B: Requieren precaución extrema y preparación para detenerse.
    C: Requieren que el conductor aumente la velocidad para despejar el área rápidamente.
    D: Indican que el conductor tiene el derecho de paso.
  answer: B
  explanation: Las leyendas especiales indican condiciones especiales al conductor
    y se utilizan donde las condiciones requieren precaución extrema por parte del
    automovilista, quien debe estar preparado para detenerse.
- id: 187
  category: signs_and_signals
  question: ¿Cuál es el propósito de una línea de parada blanca pintada a través de
    un carril de tráfico en una intersección?
  choices:
    A: Marca el área donde los peatones deben esperar.
    B: Indica el punto máximo que un vehículo puede extenderse hacia la intersección.
    C: Muestra dónde cambia el límite de velocidad.
    D: Designa un área de estacionamiento reservada para vehículos de emergencia.
  answer: B
  explanation: Las líneas de parada indican el punto más alejado dentro de la intersección
    hasta el cual puede extenderse un automóvil para permitir que el conductor tenga
    una visión clara del tráfico que se aproxima.
- id: 188
  category: defensive_driving
  question: Al acercarse a un cruce de ferrocarril con tráfico denso, ¿cuál es la
    acción más segura?
  choices:
    A: Avanzar hacia las vías para mantener el flujo del tráfico.
    B: Esperar en el acceso hasta estar seguro de que puede despejar completamente
      el cruce.
    C: Tocar la bocina para animar a los vehículos de adelante a moverse más rápido.
    D: Conducir alrededor de las barreras del cruce si están levantadas en ese momento.
  answer: B
  explanation: Nunca se quede atrapado en un cruce. Cuando el tráfico sea denso, espere
    en el acceso a un cruce hasta que esté seguro de que puede despejar el cruce por
    completo.
- id: 189
  category: safe_driving_rules
  question: ¿Qué es el 'tiempo de recuperación del deslumbramiento' en el contexto
    de la conducción nocturna?
  choices:
    A: El tiempo que se tarda en reemplazar un faro roto.
    B: El tiempo que tardan los ojos en adaptarse a la oscuridad después de quitarse
      las gafas de sol.
    C: El intervalo de tiempo que tarda la pupila en reajustarse después de que pasan
      los faros de un vehículo que viene en sentido contrario.
    D: El tiempo necesario para limpiar un parabrisas sucio por la noche.
  answer: C
  explanation: El tiempo de recuperación del deslumbramiento es el intervalo de tiempo
    que tarda la pupila del ojo en reajustarse a una luz menos intensa después de
    que ha pasado el resplandor de los faros que vienen en sentido contrario.
- id: 190
  category: safe_driving_rules
  question: Según las leyes de iluminación, ¿cuándo deben encenderse los faros delanteros?
  choices:
    A: Desde el atardecer hasta el amanecer.
    B: Desde 1/2 hora después del atardecer hasta 1/2 hora antes del amanecer.
    C: Desde 1 hora después del atardecer hasta 1 hora antes del amanecer.
    D: Solo cuando está completamente oscuro afuera.
  answer: B
  explanation: Los faros delanteros deben encenderse desde 1/2 hora después del atardecer
    hasta 1/2 hora antes del amanecer.
- id: 191
  category: safe_driving_rules
  question: ¿A qué distancia de visibilidad reducida por niebla, lluvia o nieve debe
    encender las luces delanteras durante el día?
  choices:
    A: 500 pies o menos
    B: 1000 pies o menos
    C: 1500 pies o menos
    D: 2000 pies o menos
  answer: B
  explanation: Las luces delanteras deben encenderse durante el día cuando la visibilidad
    se reduce a 1000 pies o menos debido a la niebla, lluvia, nieve, humo o polvo.
- id: 192
  category: safe_driving_rules
  question: ¿A qué distancia debe cambiar sus luces a luz de cruce (bajas) al acercarse
    a un vehículo en sentido contrario?
  choices:
    A: 200 pies o más
    B: 300 pies o más
    C: 400 pies o más
    D: 500 pies o más
  answer: D
  explanation: Debe cambiar las luces delanteras a luz de cruce (bajas) a una distancia
    de 500 pies o más de un vehículo que se aproxima en sentido contrario.
- id: 193
  category: vehicle_information
  question: ¿Cuándo es legal conducir únicamente con las luces de estacionamiento
    encendidas?
  choices:
    A: Durante el día con clima despejado
    B: Al conducir por una calle de la ciudad bien iluminada por la noche
    C: Justo antes del amanecer o justo después del atardecer
    D: Nunca es legal conducir solo con las luces de estacionamiento encendidas
  answer: D
  explanation: Las luces de estacionamiento indican un vehículo estacionado. No utilice
    únicamente las luces de estacionamiento, ya sea de día o de noche, cuando el vehículo
    esté en movimiento.
- id: 194
  category: safe_driving_rules
  question: Si su vehículo queda averiado en una carretera principal, ¿cómo puede
    indicar a otros conductores que necesita ayuda?
  choices:
    A: Pararse en medio de la carretera y agitar los brazos
    B: Atar un paño blanco o un pañuelo en la manija de la puerta izquierda o en la
      antena del radio
    C: Parpadear las luces altas repetidamente
    D: Tocar la bocina de forma continua
  answer: B
  explanation: Si su vehículo está averiado, debe levantar el capó o atar un paño
    blanco o un pañuelo en la manija de la puerta izquierda o en la antena del radio.
- id: 195
  category: driver_responsibility
  question: Para ayudar a prevenir la somnolencia en un viaje largo, ¿con qué frecuencia
    debe tomar un descanso y salir del vehículo?
  choices:
    A: Cada 50 millas
    B: Cada 100 millas
    C: Cada 200 millas
    D: Cada 300 millas
  answer: B
  explanation: Para combatir la somnolencia, debe tomar un descanso y salir del vehículo
    cada 100 millas.
- id: 196
  category: safe_driving_rules
  question: Si conduce por debajo del límite de velocidad, ¿a partir de cuántos vehículos
    retenidos está obligado a salir de la calzada en la primera oportunidad segura?
  choices:
    A: 3 o más vehículos
    B: 4 o más vehículos
    C: 5 o más vehículos
    D: 7 o más vehículos
  answer: C
  explanation: Está obligado a retirar su vehículo motorizado de la calzada en la
    primera oportunidad para detenerse de manera segura si hay cinco o más vehículos
    detrás de usted y no está viajando al límite de velocidad (AS 28.35.140).
- id: 197
  category: sharing_the_road
  question: ¿Por qué un conductor de camión podría no escuchar su bocina cuando intenta
    adelantarlo?
  choices:
    A: Los camiones están obligados por ley a tener cabinas insonorizadas
    B: Un vacío parcial a menudo impide que los conductores de camiones escuchen su
      bocina en su 'punto sordo'
    C: El ruido del motor de un camión siempre ahoga las bocinas de los vehículos
      de pasajeros
    D: Se instruye a los conductores de camiones a ignorar las bocinas en la carretera
  answer: B
  explanation: Tenga en cuenta el 'punto sordo' de un camión. Un vacío parcial a menudo
    impide que los conductores de camiones escuchen su bocina.
- id: 198
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de entrar en una autopista o carretera de acceso
    controlado?
  choices:
    A: Detenerse al final de la rampa y esperar un espacio en el tráfico
    B: Usar el carril de aceleración para alcanzar la velocidad de crucero antes de
      incorporarse
    C: Conducir lentamente en el carril de aceleración hasta que un vehículo le permita
      entrar
    D: Incorporarse inmediatamente al carril izquierdo para evitar el tráfico más
      lento
  answer: B
  explanation: Utilice el carril de aceleración para alcanzar la velocidad de crucero
    antes de intentar incorporarse al flujo de tráfico.
- id: 199
  category: defensive_driving
  question: ¿Qué debe hacer si se pasa la salida deseada en una autopista?
  choices:
    A: Detenerse y retroceder con cuidado por el arcén
    B: Hacer un giro en U a través de la mediana
    C: Ir a la siguiente salida
    D: Detenerse en el arcén y esperar a que el tráfico se despeje antes de retroceder
  answer: C
  explanation: Si se pasa una salida, no retroceda. Vaya a la siguiente salida.
- id: 200
  category: safe_driving_rules
  question: ¿Por qué las carreteras de superficie dura suelen estar resbaladizas durante
    la primera media hora después de que empieza a llover?
  choices:
    A: La lluvia hace que el asfalto se derrita temporalmente
    B: El aceite, la suciedad y el polvo de los neumáticos se mezclan con el agua
      para formar una combinación resbaladiza
    C: La lluvia elimina la capa superior de material de tracción
    D: Los neumáticos se enfrían y pierden su agarre en la carretera
  answer: B
  explanation: La primera media hora después de una lluvia a menudo hace que las carreteras
    de superficie dura sean resbaladizas porque el polvo, la película de la carretera,
    el aceite, la suciedad y el polvo de los neumáticos mezclados con agua forman
    una combinación resbaladiza.
- id: 201
  category: vehicle_information
  question: ¿Por qué se recomienda mantener el tanque de combustible lleno en climas
    fríos?
  choices:
    A: Para añadir peso extra a la parte trasera del vehículo para una mejor tracción
    B: Para evitar la condensación de humedad en el tanque de combustible
    C: Para mantener el motor funcionando a una temperatura más alta
    D: Para asegurar que la calefacción funcione de manera más eficiente
  answer: B
  explanation: Mantenga su tanque de combustible lleno en climas fríos para evitar
    la condensación de humedad en el tanque de combustible.
- id: 202
  category: safe_driving_rules
  question: ¿Qué debe hacer si un animal corre directamente frente a su vehículo?
  choices:
    A: Virar bruscamente hacia el carril contrario para evitarlo
    B: Frenar firmemente pero no virar bruscamente
    C: Acelerar para ahuyentar al animal
    D: Tocar la bocina y virar bruscamente hacia la derecha
  answer: B
  explanation: Si un animal corre frente a su vehículo, frene firmemente pero no vire
    bruscamente. Virar bruscamente puede causar una colisión entre vehículos o hacer
    que el vehículo golpee a un peatón o a un objeto fijo potencialmente mortal.
- id: 203
  category: defensive_driving
  question: ¿Cuál es la técnica de dirección adecuada para recuperarse de un derrape?
  choices:
    A: Gire las ruedas delanteras en la dirección opuesta al derrape
    B: Mantenga el volante perfectamente recto
    C: Gire las ruedas delanteras en la dirección del derrape
    D: Sobrevire para recuperar la tracción lo más rápido posible
  answer: C
  explanation: Para recuperarse de un derrape, no debe entrar en pánico y debe girar
    las ruedas delanteras en la dirección del derrape. No sobrevire ni corrija en
    exceso.
- id: 204
  category: safe_driving_rules
  question: Al estacionar en una pendiente cuesta abajo, ¿hacia qué lado debe girar
    las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Hacia adelante en línea recta
    D: Paralelas a la línea central
  answer: A
  explanation: Al estacionar cuesta abajo, gire las ruedas delanteras hacia el bordillo.
    Al estacionar cuesta arriba, gire las ruedas delanteras en dirección contraria
    al bordillo.
- id: 205
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima a la que pueden estar sus ruedas del bordillo
    al estacionar en paralelo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Al estacionar en paralelo, las ruedas deben estar a menos de 12 pulgadas
    del bordillo cercano.
- id: 206
  category: safe_driving_rules
  question: ¿A qué distancia debe estacionarse de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: Es ilegal estacionar a menos de 15 pies de un hidrante de incendios.
- id: 207
  category: sharing_the_road
  question: ¿Qué debe hacer ante la aproximación de un vehículo de emergencia autorizado
    que muestre luces rojas y/o azules intermitentes?
  choices:
    A: Acelerar para apartarse del camino antes de que lo alcance
    B: Detenerse inmediatamente en su carril actual
    C: Ceder el paso disminuyendo la velocidad, moviéndose hacia el borde derecho
      de la calzada y deteniéndose
    D: Moverse hacia el borde izquierdo de la calzada y detenerse
  answer: C
  explanation: Ante la aproximación de un vehículo de emergencia autorizado que muestre
    una luz roja y/o azul intermitente... el conductor de cada vehículo que circule
    en cualquier dirección deberá ceder el paso disminuyendo la velocidad y moviéndose
    hacia el borde derecho de la calzada, fuera de una intersección, y deteniéndose.
- id: 208
  category: sharing_the_road
  question: ¿A qué distancia se le permite legalmente seguir a un vehículo de emergencia
    que viaja en respuesta a una emergencia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Un vehículo no puede seguir a un vehículo de emergencia que viaja en
    respuesta a una emergencia a una distancia menor de 500 pies.
- id: 209
  category: driver_responsibility
  question: Si un oficial de policía lo detiene y usted lleva un arma mortal oculta
    en su persona, ¿qué debe hacer?
  choices:
    A: Mantenerla oculta y no mencionarla a menos que se le pregunte
    B: Notificar al oficial de inmediato
    C: Esperar a que el oficial pregunte si tiene alguna arma
    D: Colocar el arma en el asiento del pasajero antes de que el oficial se acerque
  answer: B
  explanation: Si un oficial se pone en contacto con usted y tiene un arma mortal
    oculta en su persona, debe notificar al oficial de inmediato.
- id: 210
  category: defensive_driving
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los encuentros
    con animales en las carreteras de Alaska?
  choices:
    A: Los silbatos para ciervos y los reflectores adicionales son la mejor defensa
      contra los animales
    B: La mayoría de los accidentes entre vehículos y alces ocurren al mediodía
    C: Los ciervos y los alces a menudo viajan en parejas o grupos
    D: Si atropella a un animal de caza mayor, puede llevárselo a casa como su propiedad
  answer: C
  explanation: Los ciervos y los alces a menudo viajan en parejas o grupos, por lo
    que si se ve a un animal cruzando la carretera, disminuya la velocidad y esté
    alerta a otros que puedan seguirlo.
- id: 211
  category: defensive_driving
  question: ¿Qué áreas de la carretera se vuelven resbaladizas primero durante el
    clima gélido?
  choices:
    A: Intersecciones y cruces de peatones
    B: Áreas sombreadas, áreas protegidas y puentes
    C: Los carriles centrales de una autopista de cuatro carriles
    D: Pendientes cuesta arriba y curvas cerradas
  answer: B
  explanation: Las áreas sombreadas, las áreas protegidas y los puentes se vuelven
    resbaladizos antes que el resto de la superficie de la carretera y permanecen
    así por más tiempo.
- id: 212
  category: safe_driving_rules
  question: ¿Quién tiene la responsabilidad principal de evitar una colisión cuando
    un vehículo está saliendo de un espacio de estacionamiento?
  choices:
    A: El conductor que circula por la vía principal
    B: El conductor que está saliendo del espacio de estacionamiento
    C: Ambos conductores por igual
    D: Los peatones en el área
  answer: B
  explanation: La responsabilidad principal de evitar una colisión recae en el conductor
    que está saliendo de un espacio de estacionamiento.
- id: 213
  category: sharing_the_road
  question: Al encontrarse con un vehículo de emergencia estacionado con luces intermitentes
    encendidas en una carretera de cuatro carriles, ¿qué debe hacer?
  choices:
    A: Detenerse y esperar a que el vehículo de emergencia apague sus luces
    B: Tocar la bocina para alertar a los trabajadores de emergencia de su presencia
    C: Cambiarse al carril opuesto al vehículo de emergencia si es seguro hacerlo
    D: Mantener su velocidad y permanecer en su carril actual
  answer: C
  explanation: Al encontrarse con vehículos de emergencia o grúas estacionados con
    luces intermitentes encendidas en una carretera de cuatro carriles, los conductores
    deben cambiarse al carril opuesto al vehículo de emergencia o grúa si es seguro
    hacerlo.
- id: 214
  category: driver_responsibility
  question: Cuando lo detiene la policía, ¿cuál de las siguientes es una forma aceptable
    de presentar el comprobante de seguro?
  choices:
    A: Una confirmación verbal de su número de póliza
    B: Una visualización en un dispositivo móvil
    C: Una carta de su banco
    D: Una copia del título de su vehículo
  answer: B
  explanation: Los conductores deben tener en su posesión su licencia de conducir,
    comprobante de seguro y comprobante de registro vigente, y mostrarlos al oficial
    cuando se les solicite. El comprobante de seguro puede mostrarse en un dispositivo
    móvil.
- id: 215
  category: safe_driving_rules
  question: ¿A qué distancia mínima de una señal de alto es ilegal estacionarse?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: 'Es ilegal estacionarse a una distancia menor a las indicadas de lo
    siguiente: ... 30 pies de una señal de alto.'
- id: 216
  category: safe_driving_rules
  question: ¿Qué debe hacer si la policía le ordena detenerse mientras conduce en
    el carril izquierdo de una carretera de cuatro carriles?
  choices:
    A: Detenerse inmediatamente en el carril izquierdo para evitar el tráfico en movimiento.
    B: Señalizar inmediatamente y orillarse a la derecha tan pronto como sea seguro.
    C: Orillarse en el acotamiento izquierdo y esperar al oficial.
    D: Esperar hasta que la carretera se reduzca a dos carriles antes de intentar
      detenerse.
  answer: B
  explanation: Si le ordenan detenerse, debe señalizar inmediatamente para mostrar
    sus intenciones al oficial y orillarse a la derecha tan pronto como sea seguro
    hacerlo, incluso si se encuentra en el carril izquierdo de una carretera de cuatro
    carriles.
- id: 217
  category: defensive_driving
  question: ¿Cuál de las siguientes acciones debe EVITAR hacer si se le revienta un
    neumático mientras conduce?
  choices:
    A: Frenar bruscamente
    B: Concentrarse en la dirección
    C: Reducir la velocidad gradualmente
    D: Salirse completamente del pavimento
  answer: A
  explanation: 'Si se revienta un neumático, el manual instruye a los conductores:
    ''No frene bruscamente''. En su lugar, debe concentrarse en la dirección, reducir
    la velocidad gradualmente, frenar suavemente y salirse completamente del pavimento.'
- id: 218
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si el acelerador de su vehículo se queda
    atascado?
  choices:
    A: Apagar el motor inmediatamente y avanzar por inercia hasta detenerse.
    B: Cambiar a reversa para reducir la velocidad del vehículo.
    C: Golpear el pedal con fuerza con el pie, cambiar a neutral y usar los frenos.
    D: Aplicar el freno de mano únicamente mientras maniobra el volante.
  answer: C
  explanation: Si su acelerador está atascado, debe golpear el pedal con fuerza con
    el pie, usar los frenos, cambiar a neutral y concentrarse en la dirección.
- id: 219
  category: defensive_driving
  question: Si sus frenos fallan mientras conduce, ¿cuál de las siguientes es una
    maniobra de emergencia recomendada?
  choices:
    A: Cambiar a una marcha superior para ganar impulso.
    B: Cambiar a neutral y avanzar por inercia hasta detenerse.
    C: Rozar sus neumáticos contra el bordillo para reducir la velocidad.
    D: Bombear el pedal del acelerador repetidamente.
  answer: C
  explanation: Si sus frenos fallan, el manual recomienda usar el freno de mano, cambiar
    a una marcha inferior y rozar los neumáticos contra el bordillo.
- id: 220
  category: defensive_driving
  question: Si sus ruedas se salen de la carretera, ¿cómo debe regresar al pavimento
    de manera segura?
  choices:
    A: Regresar al pavimento a alta velocidad para mantener el impulso.
    B: Girar el volante bruscamente hacia la izquierda.
    C: Frenar fuerte y detenerse por completo en el acotamiento antes de moverse.
    D: Frenar ligera e intermitentemente, y regresar al pavimento a baja velocidad.
  answer: D
  explanation: Si sus ruedas están fuera de la carretera, debe mantener el control
    del automóvil, frenar ligera e intermitentemente, y regresar al pavimento a baja
    velocidad cuando no haya vehículos en su vecindad inmediata.
- id: 221
  category: safe_driving_rules
  question: 'Al circular en una pendiente descendente, es ilegal:'
  choices:
    A: Usar los frenos de manera intermitente.
    B: Bajar en punto muerto (neutral) o con el embrague (clutch) desacoplado.
    C: Cambiar a una marcha más baja para controlar su velocidad.
    D: Conducir por debajo del límite de velocidad establecido.
  answer: B
  explanation: Bajar por inercia está prohibido. El conductor de un vehículo motorizado,
    al circular en una pendiente descendente, no puede bajar con las marchas del vehículo
    en punto muerto o con el embrague desacoplado.
- id: 222
  category: safe_driving_rules
  question: 'No debe dar la vuelta cerca de una curva o colina cuando no pueda ver
    los vehículos que se aproximan por al menos:'
  choices:
    A: 200 pies en cada dirección.
    B: 300 pies en cada dirección.
    C: 500 pies en cada dirección.
    D: 1,000 pies en cada dirección.
  answer: C
  explanation: No dé la vuelta cerca de una curva o colina cuando el conductor no
    pueda ver a 500 pies o más en cada dirección.
- id: 223
  category: safe_driving_rules
  question: ¿Cuándo es legal dar marcha atrás en una autopista de acceso controlado
    o en sus rampas de entrada o salida?
  choices:
    A: Cuando se pasa su salida y no hay tráfico detrás de usted.
    B: Solo durante las horas del día cuando la visibilidad es clara.
    C: Cuando lo indique el personal de policía, bomberos o personal de señalización
      de construcción.
    D: Nunca es legal bajo ninguna circunstancia.
  answer: C
  explanation: A menos que lo indique el personal de policía, bomberos o personal
    de señalización de construcción, es ilegal dar marcha atrás en una autopista de
    'acceso controlado' o en sus rampas de entrada o salida.
- id: 224
  category: vehicle_information
  question: 'En Alaska, los vehículos registrados no comerciales deben mostrar:'
  choices:
    A: Placas de matrícula tanto delanteras como traseras con calcomanías válidas.
    B: Una sola placa de matrícula trasera con calcomanías de año y mes válidas.
    C: Una sola placa de matrícula delantera con calcomanías de año y mes válidas.
    D: Una placa de matrícula trasera y una calcomanía de registro en el parabrisas.
  answer: B
  explanation: Los vehículos registrados no comerciales de Alaska deben tener una
    sola placa de matrícula trasera con calcomanías de año y mes válidas.
- id: 225
  category: vehicle_information
  question: 'El freno de pie de un vehículo de pasajeros debe ser adecuado para detener
    el vehículo dentro de 25 pies cuando viaja a una velocidad de:'
  choices:
    A: 15 millas por hora.
    B: 20 millas por hora.
    C: 25 millas por hora.
    D: 30 millas por hora.
  answer: B
  explanation: El freno de pie debe ser adecuado para detener un vehículo de pasajeros
    dentro de 25 pies a una velocidad de 20 millas por hora.
- id: 226
  category: vehicle_information
  question: 'La bocina de su vehículo debe ser capaz de emitir un sonido audible en
    condiciones normales desde una distancia no menor de:'
  choices:
    A: 100 pies.
    B: 200 pies.
    C: 300 pies.
    D: 500 pies.
  answer: B
  explanation: La bocina de un vehículo debe ser capaz de emitir un sonido audible
    en condiciones normales desde no menos de 200 pies.
- id: 227
  category: alcohol_drugs_health
  question: ¿Cuáles de los siguientes son síntomas de intoxicación por monóxido de
    carbono?
  choices:
    A: Zumbido en los oídos y visión borrosa
    B: Dolor de cabeza, mareos, náuseas y vómitos
    C: Latidos cardíacos rápidos y dificultad para respirar
    D: Fiebre y dolores musculares
  answer: B
  explanation: Los síntomas de la intoxicación por monóxido de carbono incluyen dolor
    de cabeza, mareos, náuseas y vómitos. Es un gas venenoso, incoloro e inodoro que
    paraliza antes de matar.
- id: 228
  category: sharing_the_road
  question: ¿Por qué es peligroso meterse delante de un camión grande y frenar repentinamente?
  choices:
    A: Los camiones tienen una distancia de frenado mucho más corta que los automóviles.
    B: Un camión que viaja a 55 mph necesita unos 400 pies para detenerse.
    C: El conductor del camión no podrá ver sus luces de freno.
    D: Los camiones no están equipados con sistemas de frenos antibloqueo.
  answer: B
  explanation: Los camiones y autobuses tardan mucho más en detenerse en comparación
    con los automóviles. Un automóvil que viaja a 55 mph puede detenerse en unos 130
    a 140 pies; sin embargo, un camión necesita 400 pies para detenerse.
- id: 229
  category: sharing_the_road
  question: ¿Qué es la 'Zona Prohibida' (No-Zone) alrededor de camiones grandes y
    autobuses?
  choices:
    A: El área de estacionamiento designada para vehículos comerciales.
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales donde
      los choques son más probables.
    C: El carril restringido solo para vehículos de alta ocupación.
    D: El área directamente frente a un camión donde el conductor puede verlo mejor.
  answer: B
  explanation: La 'No-Zone' representa los puntos ciegos alrededor de la parte delantera,
    trasera y laterales de los camiones y autobuses donde es más probable que ocurran
    choques porque los conductores de camiones tienen visibilidad limitada.
- id: 230
  category: defensive_driving
  question: ¿Cómo debe secar los frenos después de conducir por agua profunda?
  choices:
    A: Conducir a alta velocidad para secar al aire las pastillas de freno.
    B: Bombear los frenos rápidamente mientras baja en punto muerto.
    C: Conducir lentamente en una marcha baja y aplicar los frenos ligeramente.
    D: Estacionar el vehículo y esperar a que los frenos se sequen naturalmente.
  answer: C
  explanation: Si sus frenos se mojan, debe secarlos conduciendo lentamente en una
    marcha baja y aplicando los frenos ligeramente.
- id: 231
  category: sharing_the_road
  question: Mientras que un automóvil que viaja a 55 mph puede detenerse en unos 130
    a 140 pies, ¿cuánta distancia necesita un camión grande para detenerse a la misma
    velocidad?
  choices:
    A: 150 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: D
  explanation: Según el manual, un automóvil que viaja a 55 mph puede detenerse en
    unos 130 a 140 pies; sin embargo, un camión necesita 400 pies para detenerse.
- id: 232
  category: sharing_the_road
  question: Al rebasar un camión grande, ¿cuándo es seguro volver a incorporarse delante
    del camión?
  choices:
    A: Cuando pueda ver la parte delantera completa del camión en su espejo retrovisor
    B: Tan pronto como su parachoques trasero pase el parachoques delantero del camión
    C: Cuando pueda ver los faros del camión en su espejo lateral
    D: Cuando el conductor del camión le haga señales con las luces altas
  answer: A
  explanation: 'El manual establece: ''Al rebasar, busque ver la parte delantera completa
    del camión en su espejo retrovisor antes de incorporarse delante del camión, ¡y
    luego no disminuya la velocidad!'''
- id: 233
  category: sharing_the_road
  question: ¿Por qué debe evitar meterse entre un camión grande y la acera cuando
    el camión está girando a la derecha?
  choices:
    A: El camión puede acelerar repentinamente para completar el giro.
    B: Los conductores de camiones a veces necesitan abrirse hacia la izquierda para
      realizar un giro a la derecha de manera segura.
    C: El escape del camión oscurecerá su visión.
    D: Es ilegal rebasar a un camión por la derecha en cualquier circunstancia.
  answer: B
  explanation: Los conductores de camiones a veces necesitan abrirse hacia la izquierda
    para poder realizar un giro a la derecha de manera segura. Si se mete entre el
    camión y la acera, quedará atrapado en un 'apretón' y puede sufrir una colisión
    grave.
- id: 234
  category: safe_driving_rules
  question: ¿Cuánta agua en una carretera inundada se necesita para llegar a la parte
    inferior de la mayoría de los automóviles de pasajeros, lo que podría causar la
    pérdida de control o el apagado del motor?
  choices:
    A: 3 pulgadas
    B: 6 pulgadas
    C: 12 pulgadas
    D: 2 pies
  answer: B
  explanation: El manual advierte que debe recordar que 6 pulgadas de agua llegarán
    a la parte inferior de la mayoría de los automóviles de pasajeros, causando la
    pérdida de control o un posible apagado del motor.
- id: 235
  category: safe_driving_rules
  question: ¿Cuál es el peligro de conducir a través de dos pies de agua de inundación
    en movimiento?
  choices:
    A: Solo afectará a los automóviles de pasajeros pequeños y ligeros.
    B: Se puede cruzar con seguridad si se conduce a una velocidad muy lenta.
    C: Puede arrastrar a la mayoría de los vehículos, incluidos los vehículos utilitarios
      deportivos y las camionetas pick-up.
    D: Hará que sus frenos antibloqueo se bloqueen permanentemente.
  answer: C
  explanation: Dos pies de agua en movimiento pueden arrastrar a la mayoría de los
    vehículos, incluidos los vehículos utilitarios deportivos (SUV) y las camionetas
    pick-up.
- id: 236
  category: vehicle_information
  question: ¿El consumo de combustible aumenta aproximadamente un 5% por cada cinco
    millas por hora que se conduzca por encima de qué velocidad?
  choices:
    A: 50 mph
    B: 55 mph
    C: 60 mph
    D: 65 mph
  answer: C
  explanation: El consumo de combustible aumenta aproximadamente un 5% por cada cinco
    millas por hora que se conduzca por encima de las 60 mph.
- id: 237
  category: vehicle_information
  question: Al conducir a más de 40 mph en verano, ¿cuál es la forma más eficiente
    de ahorrar combustible para mantenerse fresco?
  choices:
    A: Bajar todas las ventanas para crear una brisa cruzada.
    B: Usar el aire acondicionado de su automóvil.
    C: Apagar el motor mientras baja una pendiente por inercia.
    D: Abrir únicamente el techo corredizo.
  answer: B
  explanation: Use el aire acondicionado de su automóvil cuando conduzca a más de
    40 mph. Los aires acondicionados actuales crean menos resistencia al motor que
    conducir con las ventanas abiertas.
- id: 238
  category: safe_driving_rules
  question: ¿Qué regla debe utilizar para asegurarse de mantener suficiente distancia
    entre usted y el vehículo que tiene delante?
  choices:
    A: La regla de 'la longitud de un automóvil'
    B: La regla de los 'dos segundos'
    C: La regla de los 'tres segundos'
    D: La regla de los 'cuatro segundos'
  answer: B
  explanation: 'El manual recomienda la regla de los ''dos segundos'': elija un objeto
    delante de usted y, si llega al objeto antes de contar hasta dos, está demasiado
    cerca.'
- id: 239
  category: defensive_driving
  question: A 50 mph, ¿aproximadamente qué distancia recorrerá su vehículo en los
    tres cuartos de segundo que tarda en reaccionar y pisar el pedal del freno?
  choices:
    A: 25 pies
    B: 55 pies
    C: 100 pies
    D: 160 pies
  answer: B
  explanation: Se tarda unos tres cuartos de segundo en reaccionar ante una situación
    y pisar el pedal del freno. A 50 mph, su vehículo recorrerá otros 55 pies en los
    tres cuartos de segundo que tarda en reaccionar.
- id: 240
  category: vehicle_information
  question: Si su vehículo está equipado con frenos antibloqueo (ABS), ¿qué debe evitar
    hacer en una emergencia de frenado?
  choices:
    A: Presionar el pedal del freno con firmeza
    B: Bombear los frenos
    C: Maniobrar el volante mientras frena
    D: Mantener el pie en el pedal del freno
  answer: B
  explanation: 'El manual establece explícitamente: ''Nunca bombee los frenos si su
    vehículo tiene frenos antibloqueo (ABS)''.'
- id: 241
  category: safe_driving_rules
  question: 'Como regla general para ahorrar combustible, debe apagar su automóvil
    en paradas previstas de más de:'
  choices:
    A: 10-15 segundos
    B: 30-60 segundos
    C: 2-3 minutos
    D: 5 minutos
  answer: B
  explanation: Como regla general, apague su automóvil en paradas que se prevea que
    duren más de 30 a 60 segundos para evitar desperdiciar combustible al ralentí.
- id: 242
  category: safe_driving_rules
  question: Al combinar recados para ahorrar tiempo y gasolina, ¿a qué destino debe
    dirigirse primero?
  choices:
    A: El destino más cercano a su casa
    B: El destino con más estacionamiento
    C: Su destino más lejano
    D: El destino con el tráfico más pesado
  answer: C
  explanation: Cuando necesite hacer varias paradas, diríjase primero a su destino
    más lejano para que el motor se caliente más rápido y obtenga un mejor ahorro
    de combustible.
- id: 243
  category: vehicle_information
  question: 'Los neumáticos deben tener una profundidad mínima de la banda de rodadura
    de al menos:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/4 de pulgada
  answer: B
  explanation: Los neumáticos deben tener al menos 2/32 de pulgada de profundidad
    de la banda de rodadura. Puede comprobarlo deslizando una moneda de un centavo
    (penny) en una ranura de la banda; si puede ver la parte superior de la cabeza
    de Lincoln, sus neumáticos están desgastados.
- id: 244
  category: vehicle_information
  question: 'Un filtro de aire obstruido puede reducir el rendimiento de la gasolina
    de su vehículo hasta en un:'
  choices:
    A: 2%
    B: 4%
    C: 7%
    D: 10%
  answer: D
  explanation: De acuerdo con las prácticas de mantenimiento del manual, los filtros
    obstruidos reducen el rendimiento en un 10%.
- id: 245
  category: vehicle_information
  question: ¿Cuál es una consecuencia de conducir con un tapón del tanque de combustible
    flojo, dañado o faltante?
  choices:
    A: Hace que el combustible se evapore, desperdiciando dinero y gasolina.
    B: Aumenta la potencia del vehículo.
    C: Activa el sistema de frenos antibloqueo (ABS).
    D: Hace que el motor se sobrecaliente inmediatamente.
  answer: A
  explanation: Los tapones del tanque de combustible flojos, dañados o faltantes causan
    la evaporación de 147 millones de galones de combustible cada año. Asegurarse
    de que el tapón esté bien apretado puede ahorrar unos $120 al año.
- id: 246
  category: vehicle_information
  question: ¿En qué porcentaje puede mejorar su ahorro de combustible el uso del grado
    de aceite de motor recomendado por el fabricante?
  choices:
    A: 1-2%
    B: 4%
    C: 5-7%
    D: 10%
  answer: A
  explanation: Puede mejorar su ahorro de combustible entre un 1% y un 2% utilizando
    el grado de aceite de motor recomendado por el fabricante.
- id: 247
  category: vehicle_information
  question: En promedio, ¿cuánto puede mejorar el rendimiento de la gasolina una puesta
    a punto (tune-up) del vehículo?
  choices:
    A: 1-2%
    B: 4%
    C: 10%
    D: 12%
  answer: B
  explanation: Una puesta a punto puede mejorar el rendimiento de la gasolina en un
    promedio del 4%.
- id: 248
  category: safe_driving_rules
  question: ¿Cuál es la causa número uno de muerte entre los adolescentes en los Estados
    Unidos?
  choices:
    A: Sobredosis de drogas
    B: Accidentes automovilísticos
    C: Ahogamiento
    D: Intoxicación por alcohol
  answer: B
  explanation: Los accidentes automovilísticos son la causa número uno de muerte entre
    los adolescentes en los Estados Unidos.
- id: 249
  category: vehicle_information
  question: Al revisar la banda de rodadura de sus neumáticos con una moneda de un
    centavo (penny), ¿cómo sabe si sus neumáticos están demasiado desgastados y necesitan
    ser reemplazados?
  choices:
    A: Si no puede ver la cabeza de Lincoln en absoluto
    B: Si puede ver toda la cabeza de Lincoln
    C: Si la moneda se cae de la ranura
    D: Si la cabeza de Lincoln está completamente cubierta por la banda de rodadura
  answer: B
  explanation: Coloque la cabeza de Lincoln primero en la ranura que parezca más profunda.
    Si puede ver toda su cabeza, sus neumáticos están demasiado desgastados; no conduzca
    con ellos y cámbielos.
- id: 250
  category: vehicle_information
  question: ¿Cuál es el mejor momento para revisar la presión de los neumáticos?
  choices:
    A: Inmediatamente después de un viaje largo
    B: Cuando los neumáticos están fríos
    C: Cuando los neumáticos están calientes
    D: Mientras el motor está en marcha
  answer: B
  explanation: Use el manómetro para revisar sus neumáticos y asegúrese de hacerlo
    cuando estén fríos.
- id: 251
  category: vehicle_information
  question: ¿Con qué frecuencia debe reemplazar las escobillas de los limpiaparabrisas
    si vive en una región polvorienta o seca?
  choices:
    A: Una vez al mes
    B: Dos veces al año
    C: Una vez al año
    D: Cada dos años
  answer: B
  explanation: Reemplácelas al menos una vez al año si vive en una región soleada/calurosa
    o fría, y dos veces al año si vive en una región polvorienta o seca.
- id: 252
  category: vehicle_information
  question: ¿Cuál es una advertencia de seguridad importante con respecto a la revisión
    del refrigerante de su vehículo?
  choices:
    A: Nunca revise el refrigerante mientras el motor esté en marcha
    B: Nunca abra la tapa del radiador en un automóvil caliente
    C: Use siempre 100% agua para llenar el tanque
    D: Solo revise el refrigerante en temperaturas bajo cero
  answer: B
  explanation: 'ADVERTENCIA: ¡Nunca abra la tapa del radiador en un automóvil caliente!
    Espere hasta que el automóvil se haya enfriado primero.'
- id: 253
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por tirar basura en Alaska?
  choices:
    A: $100
    B: $500
    C: $1000
    D: $2000
  answer: C
  explanation: La sanción por tirar basura en Alaska es una multa de hasta $1000;
    un máximo de 90 días de prisión y una posible sanción impuesta por el tribunal
    de recolectar basura.
- id: 254
  category: sharing_the_road
  question: 'Hasta el 45% de la basura de Alaska proviene de:'
  choices:
    A: Peatones que tiran basura en las aceras
    B: Cargas de camiones descubiertas o no aseguradas
    C: Estacionamientos de restaurantes de comida rápida
    D: Vertido ilegal en parques estatales
  answer: B
  explanation: Hasta el 45% de la basura de Alaska proviene de cargas de camiones
    descubiertas o no aseguradas.
- id: 255
  category: driver_responsibility
  question: 'Según el manual del conductor de Alaska, conducir se considera:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio, no un derecho
    C: Un requisito para todos los ciudadanos mayores de 18 años
    D: Un derecho opcional
  answer: B
  explanation: Privilegio - Conducir es un privilegio, no un derecho.
- id: 256
  category: safe_driving_rules
  question: 'Las investigaciones muestran que los conductores cansados pueden ser
    tan peligrosos como:'
  choices:
    A: Conductores sin experiencia
    B: Conductores distraídos
    C: Conductores ebrios
    D: Conductores agresivos
  answer: C
  explanation: Conducir cansado - Las investigaciones muestran que los conductores
    cansados pueden ser tan peligrosos como los conductores ebrios.
- id: 257
  category: defensive_driving
  question: ¿Cuál de los siguientes se considera una característica de la furia al
    volante o la conducción agresiva?
  choices:
    A: Conducir por debajo del límite de velocidad
    B: Cambios frecuentes de carril y cerrarse frente a otros conductores
    C: Usar un teléfono celular mientras conduce
    D: Poner la radio a un volumen extremadamente alto
  answer: B
  explanation: Furia al volante / Conducción agresiva - Las características incluyen
    el exceso de velocidad, cambios frecuentes de carril, meterse y cerrarse frente
    a otros conductores, forzar el paso y ser competitivo con su vehículo.
- id: 258
  category: penalties_and_points
  question: 'Infringir las leyes de tránsito y las reglas de la carretera puede resultar
    en:'
  choices:
    A: Acumular puntos en su historial de manejo
    B: Multas y sanciones
    C: La pérdida de su licencia de conducir
    D: Todas las anteriores
  answer: D
  explanation: Infringir la ley significa acumular puntos en su historial de manejo,
    multas y sanciones, e incluso la pérdida de su licencia de conducir.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de ingresar a la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 259
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Deténgase por completo
    B: Aumente la velocidad para incorporarse al tráfico
    C: Reduzca la velocidad y ceda el paso al tráfico y a los peatones
    D: Continúe sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) roja y blanca de forma triangular
    significa que debe reducir la velocidad y ceder el paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 260
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRE (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico en sentido contrario.
  id: 261
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 262
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal en blanco y negro de UNA VÍA (ONE WAY) con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 263
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 264
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 265
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 266
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro en forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 267
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 268
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 269
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta área
    C: Área de caza adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta área. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 270
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que crucen la calle.
  id: 271
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 272
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 273
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 274
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 275
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 276
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera curve
    primero en un sentido y luego en el otro.
  id: 277
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 278
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: Inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 279
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Fin de la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción del ancho de la vía y ajuste su
    posición en el carril.
  id: 280
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica que hay más adelante esta señal?
  choices:
    A: El camino termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que el camino más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 281
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Área de incorporación más adelante
    D: Construcción vial más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 282
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 283
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Camino sinuoso más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 284
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en el camino
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción vial
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 285
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 286
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 287
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 288
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 289
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 290
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse momentáneamente o dejar el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 291
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válido
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 292
- category: driver_testing
  question: ¿Qué sucede si el vehículo que trae para el examen de conducir de Alaska
    tiene defectos mecánicos?
  choices:
    A: Se le permitirá realizar el examen pero se le deducirán puntos
    B: El examen de conducir puede ser rechazado o retrasado hasta que se corrijan
      los defectos
    C: Debe pagar una tarifa adicional para que el examinador inspeccione el vehículo
    D: Se le dará un pase temporal para regresar dentro de los 30 días
  answer: B
  explanation: Se revisará que el vehículo cuente con el equipo requerido, el cual
    debe estar en buenas condiciones de funcionamiento y debidamente ajustado. El
    examen de conducir puede ser rechazado o retrasado hasta que se corrijan los defectos
    mecánicos. (Cap. 1, sección Examen de Conducir)
  id: 293
- category: vehicle_information
  question: Bajo la Ley de Seguro Obligatorio de Alaska, ¿cuáles son los montos mínimos
    de cobertura por lesiones corporales o muerte que debe tener un conductor?
  choices:
    A: $25,000/$50,000
    B: $50,000/$100,000
    C: $100,000/$300,000
    D: $15,000/$30,000
  answer: B
  explanation: El monto mínimo de cobertura de seguro de responsabilidad civil es
    de $50,000/$100,000 por lesiones corporales o muerte. El primer número es el límite
    por persona y el segundo es el límite por accidente. (Cap. 2, Ley de Seguro Obligatorio)
  id: 294
- category: penalties_and_points
  question: ¿Cuántos puntos se asignan por exceso de velocidad en una zona escolar
    o en un cruce peatonal de un parque infantil en Alaska?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: C
  explanation: El exceso de velocidad en una zona escolar o en un cruce peatonal de
    un parque infantil resulta en la asignación de 6 puntos en su historial de conducción
    de Alaska. (Cap. 2, Programa de Asignación de Puntos de la Licencia de Conducir)
  id: 295
