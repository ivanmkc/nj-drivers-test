metadata:
  source: Alaska Driver Manual (Oct 2025) (dmv.alaska.gov)
  total_questions: 295
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: Which state department prepared the Alaska Driver Manual?
  choices:
    A: Department of Transportation
    B: Department of Public Safety
    C: Department of Administration
    D: Department of Education
  answer: C
  explanation: The manual states on its cover page that it is prepared by the Alaska
    Department of Administration, Division of Motor Vehicles.
- id: 2
  category: driver_responsibility
  question: Is the Alaska Driver Manual intended to serve as a precise statement of
    all state traffic statutes and regulations?
  choices:
    A: Yes, it covers every law exactly as written.
    B: No, it is only intended to provide a general familiarity with safe and lawful
      operation.
    C: Yes, but only for commercial vehicle drivers.
    D: No, it only covers federal driving laws.
  answer: B
  explanation: 'Preface 1 states: ''The contents of this manual are NOT intended to
    serve as a precise statement of all the Statutes and Regulations of the State
    of Alaska pertaining to the operation of a motor vehicle...'''
- id: 3
  category: driver_testing
  question: Are you allowed to use the Alaska Driver Manual while taking your driver's
    test?
  choices:
    A: Yes, for the written test only.
    B: Yes, for the driving test only.
    C: No, the manual may not be used during the test.
    D: Yes, if you pay an open-book testing fee.
  answer: C
  explanation: 'Preface 3 explicitly states in capital letters: ''THIS MANUAL MAY
    NOT BE USED DURING THE TEST''.'
- id: 4
  category: safe_driving_rules
  question: According to the manual, what must a safe driver constantly demonstrate?
  choices:
    A: Aggressive behavior to maintain right-of-way.
    B: A courteous attitude and sound judgment.
    C: The ability to drive at maximum speed limits.
    D: Advanced knowledge of engine mechanics.
  answer: B
  explanation: 'Preface 3 states: ''...a safe driver must constantly demonstrate a
    courteous attitude and exercise sound judgment.'''
- id: 5
  category: defensive_driving
  question: How does the Alaska Driver Manual describe an uninformed, unskilled driver?
  choices:
    A: A traffic hazard
    B: A typical beginner
    C: A minor inconvenience
    D: A cautious operator
  answer: A
  explanation: 'Preface 3 states: ''AN UNINFORMED, unskilled driver is a traffic hazard.'''
- id: 6
  category: license_system
  question: Which of the following is a service you can access through the Alaska
    DMV Online Services?
  choices:
    A: Registering to vote
    B: Renewing a license or permit
    C: Paying a traffic ticket
    D: Purchasing vehicle insurance
  answer: B
  explanation: Page 1 lists 'Renew a license or permit' as one of the available Alaska
    DMV Online Services.
- id: 7
  category: license_system
  question: Where can you check the mailing status for an issued license or permit?
  choices:
    A: Only by visiting a physical DMV office.
    B: By calling the local police department.
    C: Through the Alaska DMV Online Services.
    D: By mailing a formal request to the state capital.
  answer: C
  explanation: Page 1 lists 'See the mailing status for an issued license or permit'
    under the Alaska DMV Online Services.
- id: 8
  category: license_system
  question: Which of the following is NOT listed as an online service provided by
    the Alaska DMV?
  choices:
    A: Scheduling a driving test
    B: Getting a certified driving record
    C: Taking a practice knowledge test
    D: Paying a parking ticket
  answer: D
  explanation: Page 1 lists scheduling tests, getting driving records, and taking
    practice tests as online services, but does not list paying parking tickets.
- id: 9
  category: alcohol_drugs_health
  question: According to the manual's index, on which pages can you find information
    about 'Alcohol and Driving'?
  choices:
    A: Pages 5-7
    B: Pages 14-19
    C: Pages 38-53
    D: Pages 68-69
  answer: B
  explanation: The index on Preface 2 lists 'Alcohol and Driving' on pages 14-19.
- id: 10
  category: vehicle_information
  question: If you need to find information about 'Child Restraints' and 'Safety Belts,'
    which pages should you consult according to the index?
  choices:
    A: Pages 2-3
    B: Pages 10-11
    C: Pages 20-23
    D: Pages 54-55
  answer: C
  explanation: The index on Preface 2 lists 'Child Restraints, Safety Belts' on pages
    20-23.
- id: 11
  category: penalties_and_points
  question: According to the index, where is information regarding the 'Point System'
    located?
  choices:
    A: Page 9
    B: Page 11
    C: Page 13
    D: Page 17
  answer: B
  explanation: The index on Preface 2 directs readers to page 11 for information on
    the 'Point System'.
- id: 12
  category: signs_and_signals
  question: Based on the index, which topic is covered extensively on pages 38-53?
  choices:
    A: Signs
    B: Parking
    C: Bicycles
    D: Skids
  answer: A
  explanation: The index on Preface 2 lists 'Signs' as being covered on pages 38-53.
- id: 13
  category: safe_driving_rules
  question: If you want to read about 'Distracted Driving' and 'Texting,' which page
    does the index direct you to?
  choices:
    A: Page 11
    B: Page 19
    C: Page 24
    D: Page 30
  answer: C
  explanation: The index on Preface 2 lists both 'Distracted Driving' and 'Texting'
    on page 24.
- id: 14
  category: driver_responsibility
  question: What does the privilege to drive represent for a beginning driver, according
    to the manual?
  choices:
    A: A guaranteed constitutional right.
    B: A steppingstone in your life.
    C: An exemption from traffic laws.
    D: A financial burden.
  answer: B
  explanation: 'Preface 3 states: ''As a beginning driver the privilege to drive represents
    a steppingstone in your life.'''
- id: 15
  category: license_system
  question: How long does a non-resident with a valid out-of-state license have to
    obtain an Alaska driver's license after entering the state?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: The manual states that an Alaska driver's license must be obtained
    by the end of a 90-day period after entry into the state.
- id: 16
  category: license_system
  question: Which of the following military family members is exempt from obtaining
    an Alaska driver's license if they have a valid out-of-state license and maintain
    permanent residence there?
  choices:
    A: A dependent child who is 16 years old
    B: A spouse who is over the age of 18
    C: A dependent child who is 18 years old
    D: All dependents of the military member
  answer: B
  explanation: A member of the armed forces and their spouse who is over the age of
    18 are exempt. The manual specifically notes that a member's dependents are not
    exempt.
- id: 17
  category: license_system
  question: What class of driver's license is required to operate standard passenger
    vehicles in Alaska?
  choices:
    A: Class A
    B: Class C
    C: Class D
    D: Class M1
  answer: C
  explanation: According to the manual, Class D is the license used for operating
    passenger vehicles.
- id: 18
  category: license_system
  question: A 14-year-old wishes to operate a motor scooter with an engine displacement
    of less than 50cc. Which license class should they obtain?
  choices:
    A: Class D
    B: Class M1
    C: Class M2
    D: Class M3
  answer: C
  explanation: Individuals who are 14 or 15 years of age may obtain a Class M2 license
    for motor scooters with an engine displacement of less than 50 cc.
- id: 19
  category: license_system
  question: When applying for an original driver's license, which of the following
    is an acceptable document to prove your date of birth?
  choices:
    A: A hospital-issued birth certificate
    B: A baptismal certificate
    C: A dependent military ID card
    D: A certified United States birth certificate with a raised seal
  answer: D
  explanation: A certified United States birth certificate with a raised seal is acceptable.
    The manual explicitly states that hospital-issued certificates, baptismal certificates,
    and dependent military IDs are not acceptable.
- id: 20
  category: driver_responsibility
  question: What is a potential legal consequence for a parent or guardian who signs
    the parental consent form for a minor under 18 to get a driver's license?
  choices:
    A: They must ride in the vehicle with the minor at all times.
    B: They may become liable for damages in a motor vehicle crash caused by the minor.
    C: They must pay a higher registration fee for the minor's vehicle.
    D: They are required to take a written knowledge test alongside the minor.
  answer: B
  explanation: The law provides that any negligence or willful misconduct of a minor
    under 18 may be attributed to the person who signed the consent, making them liable
    for damages in a motor vehicle crash.
- id: 21
  category: license_system
  question: Who is authorized to withdraw parental consent for a minor's driver's
    license or permit?
  choices:
    A: Any licensed driver over the age of 21
    B: Any legal guardian appointed by the court
    C: Only the person who originally signed the parental consent form
    D: A DMV employee
  answer: C
  explanation: The manual states that the parent or guardian may withdraw consent;
    however, only the person who signed the parental consent form can withdraw consent.
- id: 22
  category: driver_testing
  question: What are the age and experience requirements for the licensed driver who
    accompanies a person learning to drive with an instruction permit?
  choices:
    A: At least 18 years of age with 6 months of driving experience
    B: At least 21 years of age with at least one year of driving experience for the
      same class of vehicle
    C: At least 25 years of age with a clean driving record
    D: At least 21 years of age with at least five years of driving experience
  answer: B
  explanation: While learning to drive, you must be accompanied by a licensed driver
    who is at least 21 years of age and has at least one year of driving experience
    for the same type or class of vehicle.
- id: 23
  category: license_system
  question: How long must a 16- or 17-year-old hold a valid instruction permit before
    the DMV can issue a provisional Class D license?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: If you are 16 or 17, you must have a valid instruction permit for 6
    months before the DMV can issue you a provisional Class D license.
- id: 24
  category: license_system
  question: How many times can a non-commercial instruction permit be renewed?
  choices:
    A: It cannot be renewed
    B: One time
    C: Two times
    D: Unlimited times as long as the fee is paid
  answer: B
  explanation: Each type of non-commercial instruction permit issued is valid for
    2 years and can only be renewed one time.
- id: 25
  category: license_system
  question: What is the fee for obtaining an original instruction permit in Alaska?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $25.00
  answer: B
  explanation: The manual states that the fee for an original instruction permit is
    $15.00.
- id: 26
  category: alcohol_drugs_health
  question: What must a driver under the age of 21 do prior to renewing their driver's
    license when it expires 90 days after their 21st birthday?
  choices:
    A: Pass a road skills test
    B: Pass an alcohol awareness test
    C: Surrender their current license to a police officer
    D: Complete a defensive driving course
  answer: B
  explanation: If you are under 21 years of age, your driver's license will expire
    90 days after your 21st birthday, and an alcohol awareness test must be passed
    prior to renewing.
- id: 27
  category: license_system
  question: 'In order for an Alaska driver''s license to be considered valid, it must
    be:'
  choices:
    A: Laminated by a notary public
    B: Accompanied by a birth certificate at all times
    C: Signed by the licensee
    D: Held for at least 30 days
  answer: C
  explanation: 'Under the Driver''s License Requirements section, rule number 3 states:
    ''A license must be signed by the licensee to be valid.'''
- id: 28
  category: penalties_and_points
  question: What is the minimum penalty for a conviction of driving while your license
    is cancelled, suspended, or revoked?
  choices:
    A: A fine of $500
    B: A jail sentence of not less than 10 days
    C: Community service for 40 hours
    D: Permanent revocation of driving privileges
  answer: B
  explanation: Conviction of driving while a license is cancelled, suspended, revoked,
    or in violation of a limited license will result in a jail sentence of not less
    than 10 days.
- id: 29
  category: safe_driving_rules
  question: When practicing driving a motorcycle or motor scooter with an instruction
    permit, what is the requirement for the supervising licensed driver?
  choices:
    A: They must ride as a passenger on the motorcycle.
    B: They must be in a passenger vehicle driving directly in front of the learner.
    C: You must be within visual sight and under the immediate supervision of the
      licensed driver.
    D: They must be connected to the learner via a two-way radio system.
  answer: C
  explanation: For motorcycles or motor scooters, the manual states that you must
    be within visual sight and under the immediate supervision of the licensed driver.
- id: 30
  category: license_system
  question: How long must an applicant who is 16 or 17 years old hold a valid instruction
    permit before they can be issued an Alaska driver's license?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: The manual states that applicants who are 16 or 17 years of age must
    have a valid instruction permit for at least 6 months before they can be issued
    a license.
- id: 31
  category: safe_driving_rules
  question: During the provisional license stage, between what hours is a driver prohibited
    from operating a motor vehicle without a parent, legal guardian, or licensed driver
    who is at least 21 years of age?
  choices:
    A: 10:00 pm and 4:00 am
    B: 11:00 pm and 5:00 am
    C: 12:00 am and 6:00 am
    D: 1:00 am and 5:00 am
  answer: D
  explanation: A provisional licensee may not operate a motor vehicle between the
    hours of 1:00 am and 5:00 am unless accompanied by a parent, legal guardian, or
    a person at least 21 years of age who is licensed to drive.
- id: 32
  category: safe_driving_rules
  question: 'A driver with a provisional license may carry passengers without a parent
    or guardian in the vehicle ONLY if the passengers are:'
  choices:
    A: Classmates
    B: Siblings
    C: Co-workers
    D: Over 18 years old
  answer: B
  explanation: The manual specifies that during the provisional license stage, you
    MAY carry passengers without a parent in the vehicle if they are siblings.
- id: 33
  category: safe_driving_rules
  question: Under what circumstance may a driver with a provisional license operate
    a vehicle between 1:00 am and 5:00 am without being accompanied by a parent, guardian,
    or licensed driver over 21?
  choices:
    A: When driving to or from their place of employment along the most direct route
    B: When driving home from a school-sponsored event
    C: When driving to a medical appointment
    D: When driving with siblings in the vehicle
  answer: A
  explanation: An exception to the curfew allows provisional drivers to operate a
    motor vehicle between 1:00 am and 5:00 am to or from their place of employment
    or within the scope of employment along the most direct route.
- id: 34
  category: license_system
  question: Before obtaining a provisional license, a parent, guardian, or employer
    must certify that an applicant under 18 has had at least how many hours of driving
    experience?
  choices:
    A: 20 hours
    B: 30 hours
    C: 40 hours
    D: 50 hours
  answer: C
  explanation: The manual requires certification that the applicant has had at least
    40 hours of driving experience, including at least 10 hours in progressively challenging
    circumstances.
- id: 35
  category: driver_testing
  question: To pass the vision test for an Alaska driver's license, you must have
    at least what visual acuity in each eye or with both eyes together?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: The vision standards state that to qualify, you must have, in each
    eye or with both eyes together, at least 20/40 vision.
- id: 36
  category: driver_testing
  question: What specific written test must be taken after your 21st birthday prior
    to receiving an original or renewal driver's license?
  choices:
    A: A defensive driving test
    B: An alcohol awareness written test
    C: A winter weather driving test
    D: A highway sign recognition test
  answer: B
  explanation: 'The manual states: "An alcohol awareness written test must be taken
    after your 21st birthday prior to an original or renewal driver license."'
- id: 37
  category: driver_testing
  question: If you fail the driving test, how long must you normally wait before you
    can retake it?
  choices:
    A: One business day
    B: Two business days
    C: One week
    D: Ten days
  answer: B
  explanation: According to the manual, if you fail the driving test, you must normally
    wait two business days to retake the test.
- id: 38
  category: driver_testing
  question: Who is allowed to accompany you and the examiner in the vehicle during
    your driving test?
  choices:
    A: A parent or legal guardian
    B: A licensed driving instructor
    C: A sibling over the age of 21
    D: No one is allowed to accompany you
  answer: D
  explanation: 'The manual explicitly states: "No one is allowed to accompany you
    and the examiner during the driving test."'
- id: 39
  category: driver_testing
  question: Which of the following will result in an automatic failure of the driving
    test?
  choices:
    A: Asking the examiner a question before the test begins
    B: A violation of a traffic law
    C: Using a third-party tester's vehicle
    D: Taking the test in inclement weather
  answer: B
  explanation: The manual lists "Violation of a traffic law" as one of the reasons
    you will automatically fail the driving test.
- id: 40
  category: driver_testing
  question: The DMV will NOT refund your driver's test fee if you cancel your appointment
    within how many hours of the test?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 96 hours
  answer: C
  explanation: 'The manual states: "DMV will not refund the driver''s test fee if
    you cancel your appointment within 72 hours of the test..."'
- id: 41
  category: driver_testing
  question: If you fail the written knowledge test, when are you allowed to retake
    it?
  choices:
    A: Immediately
    B: The following day
    C: After two business days
    D: After one week
  answer: B
  explanation: 'For the written test, the manual notes: "If failed, the test may be
    retaken the following day."'
- id: 42
  category: license_system
  question: What is the fee to have a provisional restriction removed from your driver's
    license after meeting the requirements?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $25.00
  answer: B
  explanation: To remove a provisional restriction, a new parental consent must be
    provided, and a new driver license issued for a fee of $15.00.
- id: 43
  category: license_system
  question: Which of the following individuals associated with the military must obtain
    an Alaskan driver's license if they plan to drive in the state?
  choices:
    A: Active duty military personnel only
    B: The spouse of military personnel
    C: Dependents of military personnel (other than the spouse)
    D: Military personnel stationed in Alaska for less than 30 days
  answer: C
  explanation: 'The manual states: "Dependents of military personnel (other than the
    spouse) who plan to drive in this state must obtain an Alaskan license."'
- id: 44
  category: license_system
  question: How many days do you have to notify the Division of Motor Vehicles in
    writing if you change your name or address?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 90 days
  answer: C
  explanation: Individuals who have a license or permit and who have changed their
    name or address must notify the Division of Motor Vehicles, in writing, within
    30 days of the change.
- id: 45
  category: license_system
  question: When obtaining a photograph for your driver's license, what is the rule
    regarding head coverings worn for religious or medical reasons?
  choices:
    A: They are strictly prohibited and must be completely removed.
    B: They may remain but must be moved above the forehead to allow a full facial
      picture.
    C: They are allowed only if they match the color of your shirt.
    D: They must be temporarily replaced by a state-approved head covering.
  answer: B
  explanation: Head coverings for religious or medical reasons may remain but must
    be moved above the forehead to allow a full facial picture to be taken.
- id: 46
  category: penalties_and_points
  question: Accumulating how many points requires the mandatory suspension or revocation
    of your driving privilege?
  choices:
    A: 6 points in 12 months or 9 points in 24 months
    B: 10 points in 12 months or 15 points in 24 months
    C: 12 points in 12 months or 18 points in 24 months
    D: 15 points in 12 months or 20 points in 24 months
  answer: C
  explanation: Accumulating 12 points in 12 months or 18 points in 24 months requires
    the mandatory suspension or revocation of the driving privilege, regardless of
    the hardships involved.
- id: 47
  category: penalties_and_points
  question: A provisional license holder must complete an approved driver improvement
    course if they accumulate how many points?
  choices:
    A: 4 or more points in a 12-month period
    B: 6 or more points in a 12-month period
    C: 10 or more points in a 12-month period
    D: 12 or more points in a 12-month period
  answer: B
  explanation: A provisional license holder who accumulates 6 or more points in a
    12-month period or 9 or more points in a 24-month period must complete a driver
    improvement course approved by the Division.
- id: 48
  category: vehicle_information
  question: What is the minimum amount of liability insurance coverage required for
    property damage under Alaska's Mandatory Insurance Law?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The minimum amount of liability insurance coverage is $50,000/$100,000
    for bodily injury or death and $25,000 for property damage.
- id: 49
  category: driver_responsibility
  question: If a crash occurs within a municipality, involves an injury, or results
    in total property damage of $2,000 or more, what must you immediately do?
  choices:
    A: Contact the local police department by dialing 911.
    B: Contact the Alaska State Troopers.
    C: Mail a report to the Division of Motor Vehicles.
    D: Contact your insurance company.
  answer: A
  explanation: If there is an injury, or total property damage is $2000 or more, and
    the crash occurred within a municipality, immediately contact the local police
    department by dialing 911.
- id: 50
  category: driver_responsibility
  question: How many days do you have to report a crash to the Division of Motor Vehicles
    if the crash was NOT investigated by a police officer?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: Report the crash to the Department of Administration, Division of Motor
    Vehicles, within 10 days. This report is not required if the crash was investigated
    by a police officer.
- id: 51
  category: driver_responsibility
  question: 'If you are involved in a crash resulting in property damage in excess
    of $501, you must provide proof of insurance to the DMV within 15 days:'
  choices:
    A: Only if you caused the crash.
    B: Only if you were issued a traffic citation.
    C: Regardless of who caused the crash.
    D: Only if there were bodily injuries.
  answer: C
  explanation: Proof of insurance is required from all the drivers involved in the
    crash regardless of who caused the crash. This means you must provide the proof
    of insurance even if you did not cause the crash.
- id: 52
  category: penalties_and_points
  question: What is the penalty for a first occurrence of failing to provide proof
    of insurance within 15 days of a reportable crash?
  choices:
    A: A $500 fine
    B: A 30-day license suspension
    C: A 90-day license suspension
    D: A 1-year license suspension
  answer: C
  explanation: If you were uninsured or fail to provide the proof within 15 days,
    your driver’s license will be suspended for 90 days for a first occurrence and
    1 year for a second occurrence.
- id: 53
  category: safe_driving_rules
  question: What must you do if you strike an unattended vehicle or private property
    such as a fence?
  choices:
    A: Wait for the police to arrive before leaving the scene.
    B: Stop and attempt to locate the owner, or leave a written note with your name,
      address, and phone number.
    C: Leave the scene immediately if the damage appears to be less than $500.
    D: Honk your horn three times and proceed if no one comes out.
  answer: B
  explanation: Upon striking an unattended vehicle or private property such as a fence,
    stop and attempt to locate the owner. If unable to do so leave a written note
    containing your name, address, and telephone number.
- id: 54
  category: driver_testing
  question: Which of the following is true regarding Third Party Testers for road
    tests?
  choices:
    A: They are only available for commercial driver licenses.
    B: They typically offer vehicles for your use and provide more flexible testing
      hours.
    C: They are state troopers who conduct tests at DMV offices.
    D: They cannot administer tests unless a DMV employee is present in the vehicle.
  answer: B
  explanation: Third Party testers typically offer vehicles for your use during the
    test and provide more flexible testing hours compared to the DMV.
- id: 55
  category: penalties_and_points
  question: If your driving privilege is suspended or revoked due to accumulating
    too many points, can you obtain a limited "work purpose" license?
  choices:
    A: Yes, but only if you can prove severe financial hardship.
    B: Yes, if you complete a defensive driving course.
    C: No, a limited "work purpose" license is not available.
    D: No, unless it is your first suspension.
  answer: C
  explanation: No limited “work purpose” license is available should a suspension
    or revocation of the driving privilege be required.
- id: 56
  category: penalties_and_points
  question: How often can a driver take a defensive driver course (DDC) for a point
    reduction on their driving record?
  choices:
    A: Once every 6 months
    B: Once every 12 months
    C: Once every 24 months
    D: Once every 5 years
  answer: B
  explanation: A DDC may be taken once every 12 months for a point reduction.
- id: 57
  category: license_system
  question: If your driving privileges have been suspended by another state, what
    must you do before an Alaska license can be issued?
  choices:
    A: Pay a $100 out-of-state transfer fee.
    B: Retake the written and road tests in Alaska.
    C: Wait 90 days after establishing residency in Alaska.
    D: Obtain written proof from that state showing the suspension has terminated.
  answer: D
  explanation: If your driving privileges have been suspended, canceled, or revoked
    by another state, you must obtain written proof from that state showing the suspension
    or revocation has terminated before an Alaska license can be issued.
- id: 58
  category: driver_responsibility
  question: 'Under the Financial Responsibility Law, if there is a reasonable possibility
    you may be found liable in a civil court for a collision, your driving privilege
    will be suspended for up to:'
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: If there is a reasonable possibility that you may be found liable in
    a civil court, your privilege to drive will be suspended for up to three years.
- id: 59
  category: penalties_and_points
  question: How many points are assigned to your driving record for fleeing or attempting
    to elude a Police Officer?
  choices:
    A: 4 points
    B: 6 points
    C: 9 points
    D: 10 points
  answer: D
  explanation: According to the driver's license point assignment schedule, fleeing
    or attempting to elude a Police Officer results in 10 points.
- id: 60
  category: penalties_and_points
  question: Which of the following violations will result in exactly 9 points being
    added to your driving record?
  choices:
    A: Leaving the scene of a crash
    B: Reckless driving
    C: Driving without insurance
    D: Following too close
  answer: A
  explanation: Leaving the scene of a crash is assigned a point value of 9. Reckless
    driving is 10 points, driving without insurance is 6 points, and following too
    close is 4 points.
- id: 61
  category: penalties_and_points
  question: How many points are assigned for speeding 10 to 19 mph over the posted
    speed limit?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Speeding 10 to 19 mph over the limit results in 4 points being entered
    on your driving record.
- id: 62
  category: driver_responsibility
  question: What form is usually submitted to the Division of Motor Vehicles to provide
    proof of financial responsibility for the future after a license suspension or
    revocation?
  choices:
    A: FR-44
    B: SR22
    C: DMV-100
    D: SR-1
  answer: B
  explanation: Proof of financial responsibility for the future is usually provided
    to the Division of Motor Vehicles by submitting an "SR22" insurance filing form.
- id: 63
  category: penalties_and_points
  question: What is the difference between a license suspension and a license revocation?
  choices:
    A: A suspension is permanent, while a revocation is temporary.
    B: A suspension requires a court order, while a revocation is administrative.
    C: A suspension temporarily takes away driving privileges, while a revocation
      takes them away completely and requires obtaining a new license.
    D: There is no difference; both terms mean the same thing.
  answer: C
  explanation: A suspension temporarily takes away the privilege to drive, and you
    apply for a duplicate license at the end. A revocation takes the privilege away
    completely, requiring a new license to be obtained when reinstatement requirements
    are met.
- id: 64
  category: penalties_and_points
  question: For which of the following reasons must your driving privileges be suspended?
  choices:
    A: Operating an uninsured vehicle involved in a crash
    B: Perjury relating to motor vehicles
    C: Unlawful flight to avoid arrest
    D: Reckless driving
  answer: A
  explanation: Driving privileges must be suspended for operating or owning an uninsured
    vehicle involved in a crash. The other options are grounds for license revocation.
- id: 65
  category: penalties_and_points
  question: Which court conviction will result in the mandatory revocation of your
    driving privileges?
  choices:
    A: Following too close
    B: Failure to stop and render aid at the scene of a personal injury crash
    C: Driving in violation of license restrictions
    D: Speeding 20 mph over the limit
  answer: B
  explanation: Driving privileges must be revoked for a court conviction of failure
    to stop and render aid at the scene when involved in a personal injury crash.
- id: 66
  category: penalties_and_points
  question: The Division of Motor Vehicles must administratively revoke the driving
    privileges of a minor (under 21) for which of the following offenses?
  choices:
    A: Using a false driver's license to obtain alcohol
    B: Speeding 3 to 9 mph over the limit
    C: Driving between midnight and 5 AM
    D: Having more than one passenger under 21
  answer: A
  explanation: The DMV must revoke driving privileges administratively for minors
    (under 21) using a false driver's license to obtain alcohol.
- id: 67
  category: alcohol_drugs_health
  question: What does Alaska's implied consent law mean for drivers?
  choices:
    A: You consent to having your vehicle searched at any time.
    B: You consent to a chemical test of your breath to determine alcohol concentration
      when operating a motor vehicle.
    C: You consent to paying all traffic fines within 30 days.
    D: You consent to sharing your medical records with the DMV.
  answer: B
  explanation: When you operate a motor vehicle in Alaska, you are consenting to a
    chemical test of your breath for the purpose of determining the alcohol concentration
    of your blood or breath. This is known as implied consent.
- id: 68
  category: alcohol_drugs_health
  question: Under the implied consent law, when can a law enforcement officer require
    a sample of your blood or urine for testing?
  choices:
    A: During any routine traffic stop
    B: If you are caught speeding more than 20 mph over the limit
    C: If you are involved in a crash that causes death or serious physical injury
      to another person
    D: If you refuse to provide your driver's license and registration
  answer: C
  explanation: The implied consent law allows officers to require a blood or urine
    sample if you are involved in a crash that causes death or serious physical injury
    to another person.
- id: 69
  category: alcohol_drugs_health
  question: What happens if you refuse to submit to chemical testing after a lawful
    arrest for Driving Under the Influence (DUI)?
  choices:
    A: You will only be charged with Refusal.
    B: You will be issued a warning and allowed to drive home.
    C: 'You will face two separate criminal charges: DUI and Refusal.'
    D: Your vehicle will be permanently confiscated.
  answer: C
  explanation: Refusal to submit to chemical testing will result in two criminal charges
    – DUI and Refusal – which the court can treat separately.
- id: 70
  category: alcohol_drugs_health
  question: If your license is revoked for refusing to submit to chemical testing,
    can you get limited "work purpose" driving privileges?
  choices:
    A: Yes, but only during daylight hours.
    B: Yes, if you pay an additional reinstatement fee.
    C: No, there are no limited "work purpose" driving privileges during a revocation
      period for refusal.
    D: No, unless you are a first-time offender.
  answer: C
  explanation: During a revocation period, there is no limited "work purpose" driving
    privileges for a person who refuses to submit to chemical testing.
- id: 71
  category: alcohol_drugs_health
  question: What is the penalty for refusing to submit to a preliminary (portable)
    breath test at the scene of an incident?
  choices:
    A: It is a felony.
    B: It is a misdemeanor.
    C: It is an infraction.
    D: It results in an automatic 10-year license revocation.
  answer: C
  explanation: Refusal to submit to preliminary breath testing at the scene of an
    incident is an infraction.
- id: 72
  category: penalties_and_points
  question: How many points will be entered on your driving record for failing to
    stop for a school bus while it is loading or unloading?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Failure to stop for a school bus while the bus is loading or unloading
    results in 6 points being assigned to your driving record.
- id: 73
  category: penalties_and_points
  question: How many points are added to your driving record for a DUI, and how long
    does a DUI stay on your record?
  choices:
    A: 6 points; 5 years
    B: 10 points; forever
    C: 8 points; 10 years
    D: 12 points; forever
  answer: B
  explanation: The manual states that a DUI results in 10 points on your driving record
    and that DUIs stay on your record forever.
- id: 74
  category: penalties_and_points
  question: What is the revocation period for a first offense of using a false or
    fraudulent driver's license to obtain alcohol?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: Alaska law allows the Division of Motor Vehicles to revoke the driving
    privilege for 60 days for a first offense of using a false or fraudulent driver's
    license to obtain alcohol.
- id: 75
  category: alcohol_drugs_health
  question: If you are under 21, what amount of consumed alcohol can result in an
    arrest or citation for operating a motor vehicle?
  choices:
    A: A blood alcohol concentration of .08 or more
    B: A blood alcohol concentration of .04 or more
    C: Any amount of alcohol
    D: Only an amount that causes visible impairment
  answer: C
  explanation: It is illegal in Alaska for a person under 21 to consume alcohol. Operating
    a motor vehicle after consuming alcohol in any amount can result in an arrest
    or citation.
- id: 76
  category: penalties_and_points
  question: What is the administrative revocation period for a first offense of a
    minor operating a vehicle after consuming alcohol?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: A
  explanation: For a minor operating a motor vehicle after consuming alcohol, the
    administrative revocation period is 30 days for a first offense.
- id: 77
  category: penalties_and_points
  question: What is the administrative revocation period for a first offense of driving
    with a breath alcohol concentration of .08 or more?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: If you operate a motor vehicle with a breath or blood alcohol concentration
    of .08 or more, the administrative revocation period is 90 days for a first offense.
- id: 78
  category: penalties_and_points
  question: How far back does the state look at prior DUI or Refusal convictions to
    determine your administrative revocation period?
  choices:
    A: 5 years
    B: 7 years
    C: 10 years
    D: 15 years
  answer: D
  explanation: Prior convictions of DWI/DUI or Refusal occurring in Alaska or another
    state within the last 15 years can be used to determine the revocation period.
- id: 79
  category: driver_responsibility
  question: How many days do you have to request an administrative hearing to contest
    a license revocation?
  choices:
    A: 7 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: A
  explanation: You must apply for an administrative hearing in writing within seven
    (7) days of the 'Date Issued' on the front side of the notice.
- id: 80
  category: alcohol_drugs_health
  question: What is the first ability impaired by drinking alcohol?
  choices:
    A: Vision
    B: Balance
    C: Judgment
    D: Hearing
  answer: C
  explanation: According to the facts about alcohol in the manual, a person's judgment
    is the first ability impaired by drinking alcohol.
- id: 81
  category: alcohol_drugs_health
  question: Which of the following statements about alcohol is true?
  choices:
    A: Alcohol is a stimulant that increases alertness.
    B: Alcohol is a depressant that slows normal reflexes.
    C: Alcohol improves your reaction time.
    D: Alcohol has no effect on your vision.
  answer: B
  explanation: The manual states that alcohol is a depressant, not a stimulant. It
    slows normal reflexes, interferes with judgment, reduces alertness, and impairs
    vision.
- id: 82
  category: alcohol_drugs_health
  question: Which of the following drinks contains the same amount of alcohol as a
    12-ounce beer?
  choices:
    A: 8 ounces of wine
    B: A 1.5-ounce shot of 80 proof alcohol
    C: 24 ounces of a wine cooler
    D: A 3-ounce shot of 80 proof alcohol
  answer: B
  explanation: The same amount of alcohol is present in 12 ounces of beer as in a
    single shot (1 1/2 ounce) of 80 proof alcohol or 4 ounces of wine.
- id: 83
  category: alcohol_drugs_health
  question: What is the only effective way to sober up after drinking alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Getting fresh air
    D: Allowing time to pass
  answer: D
  explanation: Black coffee, fresh air, food, or a cold shower might wake you up,
    but they won't sober you up. Alcohol is burned up by the liver and eliminated
    from the body; only time will help.
- id: 84
  category: alcohol_drugs_health
  question: On average, how long does it take for the body to cancel the effects of
    one alcoholic drink?
  choices:
    A: 30 minutes
    B: 1 hour
    C: 2 hours
    D: 4 hours
  answer: B
  explanation: It takes an average of one hour to cancel the effects of one drink.
- id: 85
  category: penalties_and_points
  question: If you are convicted of your first DUI or Refusal, what is the minimum
    period you must have an Ignition Interlock Device (IID) installed?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 18 months
  answer: B
  explanation: If you have been convicted of only one DUI or Refusal, you will need
    to have the IID installed for a minimum of six (6) months.
- id: 86
  category: alcohol_drugs_health
  question: How does alcohol affect a driver's sense of confidence?
  choices:
    A: It decreases confidence and makes drivers overly cautious.
    B: It creates a false sense of confidence.
    C: It has no effect on a driver's confidence.
    D: It makes drivers accurately aware of their impaired abilities.
  answer: B
  explanation: Alcohol creates a false sense of confidence, and a feeling your driving
    is not affected, while simultaneously lowering your effectiveness behind the wheel.
- id: 87
  category: alcohol_drugs_health
  question: What percentage of all traffic deaths each year in Alaska involve alcohol?
  choices:
    A: Almost 25 percent
    B: Almost 45 percent
    C: Almost 60 percent
    D: Almost 80 percent
  answer: B
  explanation: According to the manual, alcohol use is a significant factor in fatal
    motor vehicle crashes in Alaska, and almost 45 percent of all traffic deaths each
    year involve alcohol.
- id: 88
  category: alcohol_drugs_health
  question: At what Blood Alcohol Concentration (BAC) level does a driver experience
    'serious deterioration in driving performance'?
  choices:
    A: 0.02%
    B: 0.06%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: The manual's BAC chart indicates that a BAC of 0.08% results in serious
    deterioration in driving performance.
- id: 89
  category: penalties_and_points
  question: What is the penalty for driving under the influence of a controlled substance
    in Alaska?
  choices:
    A: A warning for the first offense
    B: A fine of $15
    C: The same penalties as driving under the influence of alcohol
    D: Two demerit points on the operator's license
  answer: C
  explanation: Alaska law forbids driving under the influence of any controlled substance,
    and the penalties are the same as outlined for driving under the influence of
    alcohol.
- id: 90
  category: safe_driving_rules
  question: How much does a 15-pound infant suddenly weigh due to the forces unleashed
    in a 30-mph collision?
  choices:
    A: 150 pounds
    B: 300 pounds
    C: 450 pounds
    D: 600 pounds
  answer: C
  explanation: The manual states that holding a child in your arms will not protect
    them, as a 15-pound infant will suddenly weigh 450 pounds because of the forces
    unleashed in just a 30-mph collision.
- id: 91
  category: safe_driving_rules
  question: What are your chances of being killed if you are thrown from a vehicle
    during a collision?
  choices:
    A: Almost 5 times greater
    B: Almost 10 times greater
    C: Almost 25 times greater
    D: Almost 50 times greater
  answer: C
  explanation: According to the facts about safety belts, the chances of being killed
    are almost 25 times greater if you're thrown from the car.
- id: 92
  category: safe_driving_rules
  question: According to the manual, what percentage of all collisions occur at speeds
    less than 40 miles per hour?
  choices:
    A: More than 45%
    B: More than 60%
    C: More than 80%
    D: More than 95%
  answer: C
  explanation: The manual notes that more than 80% of all collisions occur at speeds
    less than 40 miles per hour.
- id: 93
  category: vehicle_information
  question: Why do safety belts manufactured after 1974 sometimes feel loose?
  choices:
    A: They are inoperative and need to be replaced.
    B: They utilize an inertia reel designed for passenger comfort that locks when
      the car slows quickly.
    C: They stretch over time due to wear and tear.
    D: They are designed to allow passengers to be thrown clear of the vehicle.
  answer: B
  explanation: Loose belts do not indicate they are inoperative. Belts manufactured
    after 1974 utilize an inertia reel that makes the belt system 'car sensitive,'
    meaning they lock when the car slows down too quickly, and were designed for passenger
    comfort.
- id: 94
  category: safe_driving_rules
  question: What type of restraint is required for a child who is less than one year
    of age or weighs less than 20 pounds?
  choices:
    A: A forward-facing child safety seat
    B: A booster seat secured by a seat belt
    C: A standard lap and shoulder belt
    D: A rear-facing child safety seat
  answer: D
  explanation: A child less than one year of age or who weighs less than 20 pounds
    shall be properly secured in a rear-facing child safety seat.
- id: 95
  category: safe_driving_rules
  question: 'A child who is over four years old, less than 57 inches tall, and weighs
    between 20 and 65 pounds must be secured in:'
  choices:
    A: A rear-facing child safety seat
    B: A booster seat
    C: A standard lap belt only
    D: The arms of an unrestricted adult
  answer: B
  explanation: A child over four years of age but less than eight years of age who
    is less than 57 inches in height and weighs 20 to 65 pounds must be properly secured
    in a booster seat.
- id: 96
  category: penalties_and_points
  question: What is the maximum penalty for a driver who fails to properly restrain
    a passenger under the age of 16?
  choices:
    A: A $15 fine and one demerit point
    B: A $50 fine and two demerit points
    C: A $100 fine and license suspension
    D: A $500 fine and three demerit points
  answer: B
  explanation: A driver may be fined up to $50 and may receive two demerit points
    on their operator's license for failure to restrain passengers under age 16.
- id: 97
  category: penalties_and_points
  question: How can an adult violator have their $15 seat belt fine waived by the
    court?
  choices:
    A: By taking an online alcohol awareness test
    B: By donating $15 to an approved Emergency Medical Services (EMS) organization
    C: By attending a defensive driving course
    D: By purchasing a new federally approved child restraint device
  answer: B
  explanation: A provision of the law allows the court to waive the $15 fine if the
    convicted person donates $15 to an EMS organization listed in the Alaska Emergency
    Medical Services Directory.
- id: 98
  category: safe_driving_rules
  question: Which of the following is an exception to the Alaska seat belt law?
  choices:
    A: Passengers in a vehicle built in 1975
    B: Vehicle operators delivering mail from inside the vehicle to roadside boxes
    C: Passengers in a taxi cab
    D: Children under the age of 16 riding in the back seat
  answer: B
  explanation: One of the exceptions to the seat belt law is for vehicle operators
    acting in the course of employment delivering mail or newspapers from inside the
    vehicle to roadside boxes.
- id: 99
  category: alcohol_drugs_health
  question: Which of the following is a true statement regarding the combination of
    alcohol and prescription drugs?
  choices:
    A: Prescription drugs cancel out the effects of alcohol.
    B: The combination increases the effects of each individual drug and can be fatal.
    C: Only illegal drugs interact dangerously with alcohol.
    D: Alcohol only interacts with amphetamines and diet pills.
  answer: B
  explanation: The manual states that the combination of other drugs and alcohol increases
    the effects of each individual drug, and such combinations can be fatal, especially
    if you're driving.
- id: 100
  category: safe_driving_rules
  question: According to the manual, what percentage of all traffic collisions involve
    fire or submersion?
  choices:
    A: Less than 1/2 of 1%
    B: Approximately 5%
    C: More than 10%
    D: Almost 25%
  answer: A
  explanation: Collisions involving fire or submersion make up less than 1/2 of 1%
    of all traffic collisions.
- id: 101
  category: driver_responsibility
  question: Who is legally responsible for ensuring that all passengers under the
    age of 16 are properly restrained in a vehicle?
  choices:
    A: The passengers themselves
    B: The parents of the passengers, even if not present
    C: The driver of the vehicle
    D: The owner of the vehicle
  answer: C
  explanation: The manual explicitly states that the driver is responsible for all
    passengers under the age of 16 years and must ensure they are properly restrained.
- id: 102
  category: safe_driving_rules
  question: According to Alaska law, what type of restraint is required for a child
    who is under 1 year of age?
  choices:
    A: Forward-facing car seat
    B: Rear-facing car seat
    C: Booster seat
    D: Standard seat belt
  answer: B
  explanation: Alaska Law requires children less than 1 year of age, or children older
    than 1 year but less than 20 pounds, to be secured in a rear-facing car seat.
- id: 103
  category: safe_driving_rules
  question: 'Under Alaska law, a child must be properly secured in a car seat or booster
    seat if they are between 4 and 8 years old, under 4''9" tall, and weigh less than:'
  choices:
    A: 40 pounds
    B: 50 pounds
    C: 65 pounds
    D: 80 pounds
  answer: C
  explanation: Alaska law requires children over 4 and less than 8 years of age who
    are under 4’9” and less than 65 pounds to be properly secured in a car seat or
    booster seat.
- id: 104
  category: safe_driving_rules
  question: According to the American Academy of Pediatrics best practice recommendations,
    where should all children younger than 13 years old be restrained?
  choices:
    A: In the front passenger seat
    B: In the rear seats of the vehicle
    C: In a forward-facing car seat
    D: In the middle front seat
  answer: B
  explanation: Best Practice Recommendations state that all children younger than
    13 years old should be restrained in the rear seats of vehicles for optimal protection.
- id: 105
  category: driver_responsibility
  question: Which of the following activities is explicitly mentioned as being against
    the law while driving in Alaska?
  choices:
    A: Talking to passengers
    B: Listening to the radio
    C: Texting and driving
    D: Drinking water
  answer: C
  explanation: 'The manual states: ''Don''t ever text and drive, surf the web or read
    your email while driving. It is dangerous and against the law in Alaska.'''
- id: 106
  category: safe_driving_rules
  question: How should you handle pets when preparing to drive?
  choices:
    A: Let them sit in the front passenger seat
    B: Hold them in your lap to keep them calm
    C: Allow them to roam freely in the back seat
    D: Secure them properly before you start to drive
  answer: D
  explanation: The manual advises to 'Always secure your pets properly before you
    start to drive' because pets can be a big distraction in the car.
- id: 107
  category: defensive_driving
  question: Under which of the following conditions do the majority of fatal crashes
    occur?
  choices:
    A: During heavy rain or snowstorms
    B: At night on unlit roads
    C: During daylight hours with clear weather and normal surfaces
    D: When vehicles have poor mechanical conditions
  answer: C
  explanation: According to the manual, more fatal crashes occurred during daylight
    hours with normal surface, clear weather conditions, and the vehicle in good mechanical
    condition than under any other condition.
- id: 108
  category: driver_responsibility
  question: What is identified as the greatest singular cause of traffic crashes?
  choices:
    A: Poor road conditions
    B: The driver
    C: Mechanical failure
    D: Bad weather
  answer: B
  explanation: The manual explicitly states that 'The driver is the greatest singular
    cause of traffic crashes.'
- id: 109
  category: signs_and_signals
  question: What do orange flags and signs indicate on the roadway?
  choices:
    A: A school zone
    B: A high hazard area such as maintenance and construction
    C: A railroad crossing ahead
    D: A pedestrian crossing
  answer: B
  explanation: Orange flags and signs indicate a 'high hazard area' which includes
    maintenance and construction zones.
- id: 110
  category: safe_driving_rules
  question: What is the suggested maximum speed when backing up your vehicle?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: A
  explanation: The manual suggests that your speed should not exceed 5 mph when backing.
- id: 111
  category: safe_driving_rules
  question: What is the proper technique for backing up a vehicle?
  choices:
    A: Rely entirely on your rearview and side mirrors
    B: Keep both hands on the bottom of the steering wheel and look straight ahead
    C: Put your left hand at the top of the steering wheel, turn your body and head
      to the right, and look out the rear window
    D: Open the driver's side door and look backward while steering with your right
      hand
  answer: C
  explanation: When backing, you should not depend on mirrors. Instead, with your
    left hand at the top of the steering wheel, turn your body and head to the right
    and look out the rear window.
- id: 112
  category: safe_driving_rules
  question: What is the rule regarding the number of passengers in the front seat?
  choices:
    A: You may have as many passengers as can fit comfortably
    B: You may not drive with more people in the front seat than the seat was designed
      for
    C: A maximum of three passengers is always allowed in the front seat
    D: Only the driver is allowed in the front seat at all times
  answer: B
  explanation: A person may not drive with more people in the front seat than the
    seat was designed for, as it can obstruct the driver's view or interfere with
    control.
- id: 113
  category: sharing_the_road
  question: On a two-lane roadway outside of an urban area, when are you required
    by law to safely pull over to let other vehicles pass?
  choices:
    A: When there is one vehicle tailgating you
    B: When there are three or more vehicles immediately behind you
    C: When there are five or more vehicles immediately behind you
    D: You are never required to pull over for following vehicles
  answer: C
  explanation: AS 28.35.140 requires drivers on a two-lane roadway outside of an urban
    area to safely pull over when there are five or more vehicles immediately behind.
- id: 114
  category: defensive_driving
  question: If you are using the four-second rule for following distance, what should
    you do when towing a trailer or driving on a wet road?
  choices:
    A: Decrease the following distance to two seconds
    B: Maintain the four-second following distance
    C: Increase the following distance to six or more seconds
    D: Rely solely on your brake lights to warn the driver behind you
  answer: C
  explanation: When towing a trailer or if the road surface is wet or slippery, you
    should increase the four seconds to six or more.
- id: 115
  category: safe_driving_rules
  question: While the manual recommends a four-second following distance, what is
    the minimum following distance required by Alaska law (13 AAC 02.090)?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 4 seconds
  answer: B
  explanation: 'The manual notes: ''While this chart recommends the use of the 4 second
    rule, 13 AAC 02.090 requires at a minimum the 2 second rule.'''
- id: 116
  category: defensive_driving
  question: What is one recommended way to lessen the likelihood of being struck from
    behind when preparing to stop?
  choices:
    A: Slam on your brakes suddenly
    B: Flash your brake lights
    C: Turn on your high beam headlights
    D: Swerve into the adjacent lane
  answer: B
  explanation: To lessen the likelihood of a rear-end crash when stopping, you should
    be sure your brake lights are clean and working properly, and flash your brake
    lights when preparing to stop.
- id: 117
  category: safe_driving_rules
  question: What is the maximum speed limit in a business district under favorable
    conditions if not otherwise posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: According to the speed limits established by law, the maximum speed
    to be driven in a business district under favorable conditions is 20 mph when
    not otherwise posted.
- id: 118
  category: safe_driving_rules
  question: What is the unposted speed limit in an alley?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The established maximum speed limit for an alley under favorable conditions,
    if not otherwise posted, is 15 mph.
- id: 119
  category: defensive_driving
  question: If you double your speed from 20 mph to 40 mph, how much greater is the
    impact and braking distance of your vehicle?
  choices:
    A: 2 times greater
    B: 3 times greater
    C: 4 times greater
    D: 8 times greater
  answer: C
  explanation: The manual states that when you double your speed from 20 to 40 mph,
    the impact is 4 times greater and the braking distance is also 4 times longer.
- id: 120
  category: safe_driving_rules
  question: 'Under the Speed Limitation Law, a person may not drive a vehicle at a
    speed greater than will permit them to:'
  choices:
    A: Keep pace with the fastest moving traffic
    B: Stop within the assured clear distance ahead
    C: Pass slower vehicles safely
    D: Maintain a 4-second following distance
  answer: B
  explanation: The Speed Limitation Law dictates that a person may not drive a vehicle
    upon a highway at a speed greater than will permit them to stop within the assured
    clear distance ahead.
- id: 121
  category: vehicle_information
  question: If a motor driven cycle's headlamp only reveals a person or vehicle at
    100 feet, what is its maximum allowed speed?
  choices:
    A: 15 mph or less
    B: 20 mph or less
    C: 25 mph or less
    D: 30 mph or less
  answer: B
  explanation: Motor driven cycle speed is limited by the intensity of the headlamp.
    If lamps reveal a person or vehicle at 100 feet, the speed is limited to 20 mph
    or less.
- id: 122
  category: penalties_and_points
  question: What is the penalty for a reckless driving conviction?
  choices:
    A: A warning
    B: A fine of $500
    C: License revocation
    D: Mandatory jail time
  answer: C
  explanation: Reckless driving is defined as a willful disregard for the safety of
    persons or property, and a conviction will result in a license revocation.
- id: 123
  category: sharing_the_road
  question: When driving on a multi-lane highway, what must you do for emergency vehicles
    on the shoulder?
  choices:
    A: Stop immediately in your lane
    B: Speed up to pass them quickly
    C: Honk your horn to acknowledge them
    D: Give them additional safety by moving over
  answer: D
  explanation: The manual states to give emergency vehicles on the shoulder additional
    safety by 'Moving Over', as it is the law (AS 28.35.185).
- id: 124
  category: penalties_and_points
  question: What happens to fines for traffic offenses occurring in designated Traffic
    Safety Corridors?
  choices:
    A: They are waived for first-time offenders
    B: They are reduced by half
    C: They are doubled
    D: They are tripled
  answer: C
  explanation: To promote traffic safety, certain portions of the highway may be designated
    as traffic safety corridors, where fines for traffic offenses are doubled.
- id: 125
  category: safe_driving_rules
  question: How far in advance must you continuously signal your intention to turn
    or move right or left?
  choices:
    A: During the last 50 feet
    B: During the last 100 feet
    C: During the last 200 feet
    D: During the last 300 feet
  answer: B
  explanation: A directional signal of intention to turn or move a vehicle right or
    left must be given continuously during the last 100 feet traveled by the vehicle
    before turning.
- id: 126
  category: safe_driving_rules
  question: When waiting to make a left turn at an intersection, how should you position
    your front wheels?
  choices:
    A: Keep them pointed to the left
    B: Keep them pointed to the right
    C: Keep them straight
    D: Turn them in the direction of the curb
  answer: C
  explanation: When preparing for a left turn, you should wait for oncoming vehicles
    before entering the intersection and keep your front wheels straight while waiting.
- id: 127
  category: vehicle_information
  question: To legally tow more than one vehicle on the roadway, the towing vehicle
    must weigh more than 15,000 pounds, have an air brake system, and have at least
    how many axles?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: No person may operate a motor vehicle towing more than one vehicle
    unless the towing vehicle weighs more than 15,000 pounds, has three or more axles,
    and is equipped with an air brake system.
- id: 128
  category: safe_driving_rules
  question: When two vehicles approach an uncontrolled intersection at the same time
    and there is danger of collision, who must yield?
  choices:
    A: The driver of the vehicle on the right must yield to the vehicle on the left
    B: The driver of the vehicle on the left must yield to the vehicle on the right
    C: The larger vehicle must yield to the smaller vehicle
    D: The vehicle traveling faster has the right of way
  answer: B
  explanation: Under the Right of Way Law for uncontrolled intersections, when two
    vehicles approach at such position and time that there is danger of collision,
    the driver of the vehicle on the left must yield to the driver of the vehicle
    on the right.
- id: 129
  category: sharing_the_road
  question: Who has the right of way through an uncontrolled intersection?
  choices:
    A: Motorized vehicles over non-motorized users
    B: Non-motorized users over motorized vehicles
    C: The vehicle that arrives last
    D: The vehicle traveling on the wider road
  answer: B
  explanation: The manual explicitly states that a non-motorized user has the right
    of way through uncontrolled intersections to motorized vehicles.
- id: 130
  category: sharing_the_road
  question: According to the manual, which of the following is true regarding bicyclists
    and signaling?
  choices:
    A: Bicyclists are not required to signal turns
    B: Bicyclists must use electronic turn signals
    C: Bicyclists are required to use hand signals to signal a turn
    D: Bicyclists only need to signal when turning left
  answer: C
  explanation: The signaling section of the manual specifies that bicyclists are also
    required to use hand signals to signal a turn.
- id: 131
  category: safe_driving_rules
  question: What should you do if you and another vehicle approach an uncontrolled
    intersection at the same time?
  choices:
    A: Yield to the vehicle on the left.
    B: Yield to the vehicle on the right.
    C: The larger vehicle has the right of way.
    D: Speed up to clear the intersection first.
  answer: B
  explanation: If vehicles approach an intersection at the same time, the driver of
    the vehicle on the left must yield to the driver of the vehicle on the right.
- id: 132
  category: safe_driving_rules
  question: What is the typical designed speed for most roundabouts?
  choices:
    A: 10-15 mph
    B: 15-20 mph
    C: 25-30 mph
    D: 35-40 mph
  answer: B
  explanation: Most roundabouts are designed for speeds of about 15-20 mph. You should
    slow down as you approach the circle.
- id: 133
  category: safe_driving_rules
  question: When driving inside a roundabout, what is an important rule to follow?
  choices:
    A: Stop to let entering traffic in.
    B: Always travel clockwise around the center island.
    C: Once inside, do not stop.
    D: Change lanes frequently to find the fastest route.
  answer: C
  explanation: Once inside a roundabout, do not stop. Vehicles travel counterclockwise
    and approaching traffic must yield to traffic already in the circle.
- id: 134
  category: signs_and_signals
  question: Where must you stop when approaching a stop sign?
  choices:
    A: Only when other vehicles are present.
    B: Ten feet before the stop sign.
    C: Behind the crosswalk, at the painted stop line, or behind the intersecting
      roadway shoulder line.
    D: In the middle of the intersection to get a better view.
  answer: C
  explanation: At a stop sign, you must stop behind the crosswalk, at the painted
    stop line, or behind the intersecting roadway shoulder line.
- id: 135
  category: signs_and_signals
  question: What should you do when approaching a red flashing light?
  choices:
    A: Slow down and proceed without stopping if the way is clear.
    B: Stop, then proceed when the way is clear and it is safe to do so.
    C: Treat it as a yield sign and only stop for pedestrians.
    D: Wait until the light turns green before proceeding.
  answer: B
  explanation: When approaching a red flashing light, you must stop, then proceed
    when the way is clear and it is safe to do so.
- id: 136
  category: safe_driving_rules
  question: What is the proper use of a center lane?
  choices:
    A: Passing slower vehicles on a two-way street.
    B: Decelerating in advance of turning left.
    C: Accelerating to merge into highway traffic.
    D: Parking temporarily for deliveries.
  answer: B
  explanation: Center lanes are reserved for decelerating in advance of turning left.
    You may not use a center lane for passing.
- id: 137
  category: safe_driving_rules
  question: What does the end of a 'no passing zone' indicate?
  choices:
    A: It is immediately safe to pass.
    B: You must increase your speed.
    C: There is increased visibility ahead.
    D: The speed limit has increased.
  answer: C
  explanation: The end of a 'no passing zone' does not mean it is safe to pass. It
    means there is increased visibility ahead.
- id: 138
  category: defensive_driving
  question: When another vehicle is passing you, what is unlawful to do?
  choices:
    A: Maintain your current speed.
    B: Move slightly to the right.
    C: Increase your speed.
    D: Check your mirrors.
  answer: C
  explanation: When being passed, it is unlawful to increase your speed.
- id: 139
  category: safe_driving_rules
  question: In which of the following situations is passing prohibited?
  choices:
    A: On a straight, level road with a dashed yellow line.
    B: Within 100 feet of an intersection or railroad crossing.
    C: When the vehicle ahead is traveling below the speed limit.
    D: On a multi-lane highway with dashed white lines.
  answer: B
  explanation: You must not pass when approaching within 100 feet of or when traversing
    an intersection or railroad crossing, or when approaching within 100 feet of a
    posted narrow bridge, viaduct, or tunnel.
- id: 140
  category: signs_and_signals
  question: What do warning signs (black on yellow) indicate?
  choices:
    A: Services for your convenience such as gas or lodging.
    B: Destination, route guidance, and place names.
    C: Actual or potentially dangerous conditions ahead.
    D: Instructions backed by state statute that must be obeyed.
  answer: C
  explanation: Warning signs alert drivers to actual or potentially dangerous conditions
    ahead. Extra caution should be observed and drivers should generally decrease
    their speed.
- id: 141
  category: signs_and_signals
  question: What color and shape are school signs that warn of school areas and crosswalks?
  choices:
    A: Black on orange, diamond-shaped
    B: White on green, rectangular
    C: Black on yellow, five-sided
    D: White on blue, circular
  answer: C
  explanation: School signs are five-sided signs that are black on yellow, warning
    of school areas and school crosswalks requiring reduced speed.
- id: 142
  category: signs_and_signals
  question: What does a red circle with a diagonal slash on a traffic sign indicate?
  choices:
    A: A railroad crossing is ahead.
    B: Prohibited movement.
    C: A stop is required.
    D: The road is closed for construction.
  answer: B
  explanation: A red circle with a diagonal slash indicates prohibited movement.
- id: 143
  category: signs_and_signals
  question: What type of information is provided by a guide sign (white on green)?
  choices:
    A: Actual or potentially dangerous conditions ahead.
    B: Temporary conditions requiring special alertness.
    C: Destination, route guidance, and place names.
    D: Services such as food, lodging, and rest areas.
  answer: C
  explanation: Destination, route guidance, and place names are provided to you on
    guide signs, which are white on green.
- id: 144
  category: safe_driving_rules
  question: At a signaled intersection, what must you do when the light turns green?
  choices:
    A: Proceed immediately without checking for traffic.
    B: Yield to pedestrians and vehicles caught in the intersection.
    C: Sound your horn to alert vehicles in the intersection.
    D: Turn right on red if the way is clear.
  answer: B
  explanation: At a signaled intersection, when the light turns green, you must yield
    to pedestrians and vehicles caught in the intersection.
- id: 145
  category: signs_and_signals
  question: According to the manual, what is the required speed limit when approaching
    marked school crosswalks?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The manual states that drivers must reduce their speed to 20 as marked
    for school crosswalks.
- id: 146
  category: sharing_the_road
  question: What is the approximate survival rate of a pedestrian struck by a passenger
    car at a collision speed of 25 mph?
  choices:
    A: Nearly 100%
    B: About 90%
    C: Less than 50%
    D: Only 10%
  answer: B
  explanation: According to the manual, about 90% of pedestrians survive a crash with
    a passenger car at a collision speed of 25 mph.
- id: 147
  category: safe_driving_rules
  question: What should you do if a vehicle is stopped at a crosswalk ahead of you?
  choices:
    A: Pass the vehicle on the left if the lane is clear.
    B: Honk your horn to warn pedestrians before passing.
    C: Never pass the stopped vehicle.
    D: Pass the vehicle slowly while checking for pedestrians.
  answer: C
  explanation: 'The manual explicitly states: "Never pass vehicles stopped at a crosswalk.
    There may be people crossing where you can''t see."'
- id: 148
  category: sharing_the_road
  question: When walking along a highway as a pedestrian, where should you walk?
  choices:
    A: On the right side of the highway moving with traffic.
    B: On the left side of the highway facing oncoming traffic.
    C: In the center median whenever possible.
    D: On whichever side has a wider shoulder.
  answer: B
  explanation: Your responsibility as a pedestrian includes walking on the left side
    of the highway facing oncoming traffic.
- id: 149
  category: sharing_the_road
  question: How can a bicyclist properly signal a right turn using hand signals?
  choices:
    A: By extending the left arm fully to the left.
    B: By extending the left arm and bending it down at the elbow.
    C: By extending the left arm and bending it up at the elbow.
    D: By extending the right arm and bending it down at the elbow.
  answer: C
  explanation: A bicyclist can signal a right turn by extending the right arm straight
    out to the right, or by having the left arm extended and bent up at the elbow.
- id: 150
  category: penalties_and_points
  question: How many points are assessed to your driver's license for a traffic violation
    committed while riding a bicycle in Alaska?
  choices:
    A: 2 points
    B: 4 points
    C: The same number of points as a motor vehicle violation.
    D: No points are assessed.
  answer: D
  explanation: Alaska Law AS 28.15.231 (b) states that no points are assessed for
    traffic violations when using a bicycle.
- id: 151
  category: sharing_the_road
  question: What is the safety recommendation for bicyclists who choose to wear headphones
    while riding?
  choices:
    A: It is illegal to wear any headphones while biking.
    B: You must always keep one earbud out.
    C: You may wear both earbuds if the volume is kept low.
    D: Only over-the-ear headphones are permitted.
  answer: B
  explanation: 'The manual advises: "If you''re going to wear headphones while biking
    be sure to always keep one earbud out" so you can hear pedestrians, traffic, and
    other hazards.'
- id: 152
  category: sharing_the_road
  question: Which of the following situations causes a large percentage of car and
    motorcycle crashes?
  choices:
    A: Motorcyclists speeding on the highway.
    B: Drivers turning left in front of oncoming motorcyclists.
    C: Motorcyclists tailgating passenger vehicles.
    D: Drivers passing motorcycles on the right side.
  answer: B
  explanation: The manual notes that drivers turning left in front of oncoming motorcyclists
    cause a large percentage of car/cycle crashes because drivers often fail to see
    the cyclist or misjudge their speed.
- id: 153
  category: defensive_driving
  question: 'When checking your blind spots for bicyclists before making a turn or
    opening a door, you should:'
  choices:
    A: Rely solely on your rearview and side mirrors.
    B: Turn your head to look for bicyclists that may be approaching.
    C: Honk your horn to warn any bicyclists in your blind spot.
    D: Speed up to pass the blind spot quickly.
  answer: B
  explanation: 'The manual instructs drivers: "Do not depend on only your mirrors-
    turn your head to look for bicyclists that may be next to them or approaching."'
- id: 154
  category: signs_and_signals
  question: What equipment do flag persons generally use to direct traffic safely
    through work zones?
  choices:
    A: Green flags or go/stop paddles.
    B: Yellow hard hats and whistles.
    C: Red flags or stop/slow paddles.
    D: Flashing sequencing arrow panels.
  answer: C
  explanation: Flag persons generally wear orange vests, shirts or jackets, and use
    red flags or stop/slow paddles to direct traffic through work zones.
- id: 155
  category: safe_driving_rules
  question: As a pedestrian, what should you do if you approach an intersection with
    a "stale" green traffic light that has almost run out of time?
  choices:
    A: Run quickly to make it across before it turns red.
    B: Never cross the street on a "stale" green traffic light.
    C: Cross only if there are no turning vehicles.
    D: Yield to vehicles in the intersection and then cross.
  answer: B
  explanation: A pedestrian's responsibility includes to "Never cross a street on
    a 'stale' green traffic light that has about run out of time or when a steady
    or flashing 'Don't Walk' or upraised hand appears."
- id: 156
  category: sharing_the_road
  question: Why must drivers be especially careful when driving near children riding
    bikes?
  choices:
    A: Children are required to ride against the flow of traffic.
    B: Children under age nine lack the physical and mental development to interact
      safely in traffic.
    C: Children are legally permitted to ignore traffic signals.
    D: Children's bicycles are not equipped with reflectors.
  answer: B
  explanation: 'The manual states: "Youngsters under age nine lack the physical and
    mental development to interact safely in that environment so be careful when driving
    near children riding bikes."'
- id: 157
  category: signs_and_signals
  question: What action is required of trucks when facing a sign indicating a steep
    downgrade ahead?
  choices:
    A: Trucks must speed up to maintain momentum.
    B: Trucks must pull over and inspect their brakes.
    C: Trucks should shift to a higher gear.
    D: Trucks must slow down and shift to a lower gear.
  answer: D
  explanation: The sign description for a steep downgrade ahead states it "requires
    trucks to slow and shift to lower gear."
- id: 158
  category: sharing_the_road
  question: What is a key safety rule for bicyclists regarding turning vehicles?
  choices:
    A: Pass turning vehicles on the side to which they are making the turn.
    B: Pass turning vehicles only on the left side.
    C: Do not pass when vehicles are turning, especially on the side to which they
      are making the turn.
    D: Honk loudly and pass the turning vehicle on the right.
  answer: C
  explanation: Bicyclists are advised to stay out of blind spots and "Do not pass
    when vehicles are turning, especially on the side to which they are making the
    turn."
- id: 159
  category: defensive_driving
  question: Why are motorcycles particularly dangerous for other drivers to interact
    with on the road?
  choices:
    A: They always travel much faster than the posted speed limit.
    B: It is difficult to judge how far away they are or how fast they are traveling.
    C: They are not required to follow the same right-of-way rules as cars.
    D: Their single headlight makes them completely invisible during the day.
  answer: B
  explanation: The manual states that motorcycles are not easily identified in traffic,
    and even when drivers see them, "many say it's difficult to judge how far away
    motorcyclists are or how fast they are traveling."
- id: 160
  category: sharing_the_road
  question: According to the manual, what is a major cause of crashes between cars
    and motorcycles?
  choices:
    A: Motorcyclists speeding on open highways
    B: Drivers turning left in front of oncoming motorcyclists
    C: Motorcyclists failing to use their turn signals
    D: Drivers tailgating motorcycles in bad weather
  answer: B
  explanation: The manual states that drivers turning left in front of oncoming motorcyclists
    cause a large percentage of car/cycle crashes because drivers often fail to pick
    the cyclist out of the traffic scene or inaccurately judge their speed.
- id: 161
  category: sharing_the_road
  question: What following distance should you maintain when driving behind a motorcycle?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: C
  explanation: The manual specifies that the same four second following distance should
    be given to motorcyclists as given to other vehicles.
- id: 162
  category: sharing_the_road
  question: 'If a motorcyclist is riding to one side of a wide lane, you should:'
  choices:
    A: Move into the same lane to pass them safely
    B: Share the lane only if you are driving a compact car
    C: Honk your horn to let them know you are passing in their lane
    D: Never move into the same lane with the motorcycle
  answer: D
  explanation: Motorcycles need a full lane width. The manual explicitly states to
    never move into the same lane with a motorcycle, even if the lane is wide and
    the cyclist is riding to one side, as it is illegal and extremely hazardous.
- id: 163
  category: sharing_the_road
  question: 'Before making a turn in front of a motorcyclist who has a blinking turn
    signal, you should:'
  choices:
    A: Assume they are turning and proceed with your turn
    B: Be sure the rider is actually turning and not continuing straight with a forgotten
      signal
    C: Speed up to complete your turn before they reach the intersection
    D: Flash your headlights to warn them of your turn
  answer: B
  explanation: Turn signals do not turn off automatically on most motorcycles. You
    must be sure the rider is turning and not continuing straight into your path with
    a forgotten turn signal still blinking.
- id: 164
  category: safe_driving_rules
  question: 'When approaching a school bus from the rear that has its red signal lights
    flashing, you must:'
  choices:
    A: Slow down to 10 mph and pass cautiously
    B: Bring your vehicle to a complete stop before reaching the bus
    C: Honk your horn and pass on the left side
    D: Stop only if children are actively crossing the street
  answer: B
  explanation: Drivers approaching a school bus from the rear may not pass when red
    signal lights are flashing and shall bring their vehicles to a complete stop before
    reaching the school bus.
- id: 165
  category: safe_driving_rules
  question: Under what condition are you NOT required to stop for a school bus with
    flashing red lights?
  choices:
    A: When you are running late for a documented emergency
    B: When approaching from the opposite direction on a highway with separated roadways
      providing two or more lanes in each direction
    C: When the school bus is stopped in a designated school zone
    D: When you are driving a commercial vehicle
  answer: B
  explanation: Drivers upon a highway with separated roadways providing two or more
    lanes in each direction need not stop when approaching a school bus which is headed
    in the opposite direction.
- id: 166
  category: vehicle_information
  question: 'The Slow Moving Vehicle (SMV) emblem is required on all vehicles that
    travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The Slow Moving Vehicle emblem is a safety device required on all slow-moving
    (25 mph or less) vehicles.
- id: 167
  category: signs_and_signals
  question: What does a Slow Moving Vehicle (SMV) emblem look like during daylight?
  choices:
    A: A bright fluorescent orange solid triangle
    B: A reflective red hollow triangle
    C: A yellow diamond with black lettering
    D: A white rectangle with a red border
  answer: A
  explanation: During daylight, the bright fluorescent orange solid triangle in the
    center of the SMV emblem is highly visible.
- id: 168
  category: signs_and_signals
  question: 'When facing a steady RED BALL traffic signal, right turns are permitted:'
  choices:
    A: At any time without stopping, provided the intersection is clear
    B: Only after a full stop, when safe, and not restricted by a sign
    C: Only if you are in a designated right-turn lane
    D: Right turns on red are never permitted
  answer: B
  explanation: Right turns are permitted only after a full stop, when the turn can
    be made safely, and is not restricted by a 'No turn on red' sign.
- id: 169
  category: signs_and_signals
  question: What must you do when facing a RED ARROW traffic signal?
  choices:
    A: Stop, then proceed with caution in the direction of the arrow
    B: Yield to oncoming traffic and make the turn
    C: Stop and do not make the movement indicated until the arrow changes to green
      or flashing yellow
    D: Make the turn only if there are no pedestrians in the crosswalk
  answer: C
  explanation: A red arrow means do not make the movement indicated. No turns are
    allowed until the arrow changes to green or flashing yellow.
- id: 170
  category: signs_and_signals
  question: What action is required when approaching a FLASHING RED BALL traffic signal?
  choices:
    A: Reduce your speed and yield to pedestrians
    B: Stop behind the crosswalk or stop line and proceed only when safe
    C: Proceed through the intersection without stopping if it is clear
    D: Wait for the light to turn solid green before moving
  answer: B
  explanation: For a flashing red ball, you must stop behind the crosswalk or stop
    line, look in all directions for approaching traffic and pedestrians, and proceed
    only when it is safe to do so.
- id: 171
  category: signs_and_signals
  question: 'If you approach an intersection where the traffic signal is completely
    unlit and no one is directing traffic, you must:'
  choices:
    A: Treat it as a yield sign and proceed slowly
    B: Stop and yield to traffic approaching the intersection on your right
    C: Maintain your speed if you are traveling on the larger road
    D: Wait at the intersection until the signal turns back on
  answer: B
  explanation: If a signal does not have any of its bulbs functioning, the intersection
    is uncontrolled. You must stop and yield to traffic approaching the intersection
    on your right.
- id: 172
  category: safe_driving_rules
  question: 'If a police officer is directing traffic at an intersection with a working
    traffic signal, you must:'
  choices:
    A: Follow the traffic signal's lights
    B: Follow the directions of the police officer regardless of the signal
    C: Stop and wait for the signal to turn green before following the officer's directions
    D: Honk to get the officer's attention before proceeding
  answer: B
  explanation: You must follow the directions of a police officer, fireperson, or
    authorized flag person regardless of signs or signals.
- id: 173
  category: signs_and_signals
  question: What does a STEADY ORANGE UPRAISED HAND pedestrian signal mean?
  choices:
    A: Pedestrians may cross the roadway carefully
    B: Pedestrians shall not leave the sidewalk or enter the roadway
    C: Pedestrians have the right-of-way over all turning vehicles
    D: Pedestrians should run across the street quickly
  answer: B
  explanation: The steady orange upraised hand means pedestrians shall not leave the
    sidewalk or enter the roadway in the direction of the signal.
- id: 174
  category: sharing_the_road
  question: How might a motorcyclist react when crossing railroad tracks?
  choices:
    A: Speed up to cross the tracks as quickly as possible
    B: Swerve sharply to avoid the tracks entirely
    C: Slow down, rise off the seat, and change direction to cross head-on
    D: Stop completely and walk the motorcycle across the tracks
  answer: C
  explanation: Railroad grade crossings usually cause the motorcyclist to slow down
    and rise off the seat to help cushion the shock. The rider also may change direction
    so the tracks can be crossed head on.
- id: 175
  category: signs_and_signals
  question: What should a pedestrian do if they are already in the roadway when the
    flashing orange 'DON'T WALK' signal appears?
  choices:
    A: Stop immediately and wait for the next walk signal.
    B: Turn around and return to the original sidewalk.
    C: Proceed to the other side of the roadway.
    D: Run as fast as possible to the nearest median.
  answer: C
  explanation: According to the manual, when the FLASHING ORANGE DON'T WALK signal
    is active, pedestrians may not enter the roadway, but those already in the roadway
    may proceed to the other side.
- id: 176
  category: signs_and_signals
  question: When driving in a reversible lane, what does a steady yellow X signal
    indicate?
  choices:
    A: You may use the lane but must reduce your speed.
    B: You must clear the lane in a safe manner because a red X is about to appear.
    C: Opposing traffic is currently permitted to use the lane.
    D: You are approaching a railroad crossing.
  answer: B
  explanation: A Steady Yellow X indicates that you should clear the lane in a safe
    manner because a Red X signal is about to appear.
- id: 177
  category: safe_driving_rules
  question: Which of the following is true regarding pavement markings?
  choices:
    A: They are only suggestions and do not have the force of law.
    B: They have the same force of law as signs or signals.
    C: They are only enforced during daylight hours.
    D: They are secondary to verbal instructions from passengers.
  answer: B
  explanation: The manual states that you must read the traffic markings, know what
    they mean, and obey them, as pavement markings have the same force of law as signs
    or signals.
- id: 178
  category: signs_and_signals
  question: What is the primary difference between yellow and white pavement markings?
  choices:
    A: Yellow lines separate traffic going in opposite directions, while white lines
      separate traffic going in the same direction.
    B: Yellow lines indicate parking zones, while white lines indicate driving lanes.
    C: White lines separate traffic going in opposite directions, while yellow lines
      separate traffic going in the same direction.
    D: Yellow lines are used only on highways, while white lines are used on city
      streets.
  answer: A
  explanation: Yellow markings separate traffic flow going in opposite directions,
    whereas white markings separate traffic going in the same direction.
- id: 179
  category: safe_driving_rules
  question: Which maneuver is legally permitted across a solid yellow center line?
  choices:
    A: Passing a slow-moving vehicle.
    B: Accelerating to merge into traffic.
    C: Turning into a driveway.
    D: Using the opposing lane to bypass a traffic jam.
  answer: C
  explanation: Solid yellow center lines indicate where passing is not permitted;
    although, turning into a driveway across them is allowed.
- id: 180
  category: safe_driving_rules
  question: Which of the following actions is prohibited when using a shared two-way
    left turn lane?
  choices:
    A: Yielding to oncoming traffic.
    B: Yielding to pedestrians.
    C: Using the lane to make a left turn.
    D: Using the lane for driving, accelerating, or passing.
  answer: D
  explanation: The manual specifies that it is not permissible to use the center left
    turn lane as a driving, accelerating, or passing lane.
- id: 181
  category: defensive_driving
  question: What should you do if you realize you are in the wrong lane to make a
    turn just as you enter an intersection?
  choices:
    A: Stop and wait for traffic to clear so you can change lanes.
    B: Make the turn anyway if you use your turn signal.
    C: Continue straight and go around the block.
    D: Back up slowly until you can enter the correct lane.
  answer: C
  explanation: If you find you are in the wrong lane to turn when entering an intersection,
    do not turn or impede so you can turn. You should continue around the block.
- id: 182
  category: vehicle_information
  question: If you are driving a vehicle with a manual transmission, what should you
    do when crossing railroad tracks?
  choices:
    A: Shift into neutral while crossing the tracks.
    B: Shift down before the crossing and do not change gears while crossing.
    C: Shift to a higher gear to cross the tracks more quickly.
    D: Stop on the tracks to shift gears safely.
  answer: B
  explanation: The manual advises to never shift gears on the crossing. If your vehicle
    has a manual transmission, shift down beforehand and do not change gears while
    crossing the tracks.
- id: 183
  category: safe_driving_rules
  question: You must be prepared to stop at a railroad crossing if a train is within
    what distance?
  choices:
    A: 500 feet
    B: 1000 feet
    C: 1500 feet
    D: 2000 feet
  answer: C
  explanation: Always stop when a train is close to a crossing. Be prepared to stop
    if a train is within 1500 feet of the crossing.
- id: 184
  category: defensive_driving
  question: If your vehicle gets stuck on railroad tracks and a train is approaching,
    in which direction should you run after exiting the vehicle?
  choices:
    A: Run in the same direction the train is traveling.
    B: Run directly away from the tracks in a perpendicular line.
    C: Run in the direction that the train is coming from.
    D: Run toward the nearest railroad crossing gate.
  answer: C
  explanation: If stuck on the tracks, you must get out and run away from both the
    tracks and the vehicle. You should run in the direction that the train is coming
    from to avoid flying debris if the vehicle is struck.
- id: 185
  category: signs_and_signals
  question: What information is provided on the blue Emergency Notification System
    (ENS) sign at a railroad crossing to help dispatchers identify your exact location?
  choices:
    A: A GPS coordinate code.
    B: A Department of Transportation (DOT) number.
    C: The name of the nearest intersecting highway.
    D: The local police department's precinct number.
  answer: B
  explanation: Directly below the dispatch number on the ENS sign is a Department
    of Transportation number that identifies the exact location of the crossing in
    question.
- id: 186
  category: signs_and_signals
  question: What do special pavement legends like 'STOP AHEAD,' 'SCHOOL,' and 'R X
    R' require from a motorist?
  choices:
    A: They require the driver to pull over immediately.
    B: They require extreme caution and preparation to stop.
    C: They require the driver to increase speed to clear the area quickly.
    D: They indicate that the driver has the right-of-way.
  answer: B
  explanation: Special legends indicate special conditions to the driver and are used
    where conditions require extreme caution on the part of the motorist, who should
    be prepared to stop.
- id: 187
  category: signs_and_signals
  question: What is the purpose of a white stop line painted across a traffic lane
    at an intersection?
  choices:
    A: It marks the area where pedestrians are required to wait.
    B: It indicates the farthest point a vehicle may extend into the intersection.
    C: It shows where the speed limit changes.
    D: It designates a reserved parking area for emergency vehicles.
  answer: B
  explanation: Stop lines indicate the farthest point into the intersection an automobile
    may extend to allow the driver a clear view of approaching traffic.
- id: 188
  category: defensive_driving
  question: When approaching a railroad crossing in heavy traffic, what is the safest
    course of action?
  choices:
    A: Move onto the tracks to keep traffic flowing.
    B: Wait on the approach until you are sure you can completely clear the crossing.
    C: Honk your horn to encourage the vehicles ahead to move faster.
    D: Drive around the crossing gates if they are currently raised.
  answer: B
  explanation: Never get trapped on a crossing. When traffic is heavy, wait on the
    approach to a crossing until you are sure you can clear the crossing completely.
- id: 189
  category: safe_driving_rules
  question: What is 'glare recovery time' in the context of night driving?
  choices:
    A: The time it takes to replace a broken headlight
    B: The time it takes for your eyes to adjust to the dark after removing sunglasses
    C: The interval of time it takes for the pupil to readjust after an oncoming vehicle's
      headlights pass
    D: The time required to clean a dirty windshield at night
  answer: C
  explanation: Glare recovery time is the interval of time it takes for the pupil
    of the eye to readjust to less intense light after the glare from oncoming headlights
    has passed.
- id: 190
  category: safe_driving_rules
  question: According to lighting laws, when must your headlights be turned on?
  choices:
    A: From sunset to sunrise
    B: From 1/2 hour after sunset to 1/2 hour before sunrise
    C: From 1 hour after sunset to 1 hour before sunrise
    D: Only when it is completely dark outside
  answer: B
  explanation: Headlights must be turned on from 1/2 hour after sunset to 1/2 hour
    before sunrise.
- id: 191
  category: safe_driving_rules
  question: You must turn on your headlights during the daytime when visibility is
    reduced to what distance by fog, rain, or snow?
  choices:
    A: 500 feet or less
    B: 1000 feet or less
    C: 1500 feet or less
    D: 2000 feet or less
  answer: B
  explanation: Headlights must be turned on in daytime when visibility is reduced
    to 1000 feet or less by fog, rain, snow, smoke, or dust.
- id: 192
  category: safe_driving_rules
  question: At what distance must you dim your headlights to low beam when approaching
    an oncoming vehicle?
  choices:
    A: 200 feet or more
    B: 300 feet or more
    C: 400 feet or more
    D: 500 feet or more
  answer: D
  explanation: You must change headlights to low beam (dim) 500 feet or more from
    an oncoming vehicle.
- id: 193
  category: vehicle_information
  question: When is it legal to drive with only your parking lights on?
  choices:
    A: During the daytime in clear weather
    B: When driving through a well-lit city street at night
    C: Just before sunrise or just after sunset
    D: It is never legal to drive with only parking lights on
  answer: D
  explanation: Parking lights denote a parked vehicle. Do not use only parking lights,
    day or night, when the vehicle is in motion.
- id: 194
  category: safe_driving_rules
  question: If your vehicle becomes disabled on a major road, how can you signal to
    other drivers that you need help?
  choices:
    A: Stand in the middle of the road and wave your arms
    B: Tie a white cloth or handkerchief on the left door handle or radio antenna
    C: Flash your high beams repeatedly
    D: Sound your horn in a continuous pattern
  answer: B
  explanation: If your vehicle is disabled, you should raise the hood or tie a white
    cloth or handkerchief on the left door handle or radio antenna.
- id: 195
  category: driver_responsibility
  question: To help prevent drowsiness on a long trip, how often should you take a
    break and get out of the vehicle?
  choices:
    A: Every 50 miles
    B: Every 100 miles
    C: Every 200 miles
    D: Every 300 miles
  answer: B
  explanation: To combat drowsiness, you should take a break and get out from the
    vehicle every 100 miles.
- id: 196
  category: safe_driving_rules
  question: If you are driving below the speed limit, you are required to pull off
    the roadway at the first safe opportunity if you are holding up how many vehicles?
  choices:
    A: 3 or more vehicles
    B: 4 or more vehicles
    C: 5 or more vehicles
    D: 7 or more vehicles
  answer: C
  explanation: You are required to pull your motor vehicle off the roadway at the
    first opportunity to pull over safely if there are five or more vehicles behind
    you and you are not traveling at the speed limit (AS 28.35.140).
- id: 197
  category: sharing_the_road
  question: Why might a truck driver fail to hear your horn when you are attempting
    to pass them?
  choices:
    A: Trucks are legally required to have soundproof cabins
    B: A partial vacuum often prevents truck drivers from hearing your horn in their
      'deaf spot'
    C: The engine noise of a truck always drowns out passenger vehicle horns
    D: Truck drivers are instructed to ignore horns on the highway
  answer: B
  explanation: Be aware of a truck's 'deaf spot.' A partial vacuum often prevents
    truck drivers from hearing your horn.
- id: 198
  category: safe_driving_rules
  question: What is the proper way to enter a controlled-access highway or freeway?
  choices:
    A: Stop at the end of the ramp and wait for a gap in traffic
    B: Use the acceleration lane to get up to cruising speed before merging
    C: Drive slowly in the acceleration lane until a vehicle lets you in
    D: Merge immediately into the left lane to avoid slower traffic
  answer: B
  explanation: Use the acceleration lane to get up to cruising speed before attempting
    to merge into the traffic stream.
- id: 199
  category: defensive_driving
  question: What should you do if you miss your intended exit on an expressway?
  choices:
    A: Stop and carefully back up on the shoulder
    B: Make a U-turn through the median
    C: Go to the next exit
    D: Pull over to the shoulder and wait for traffic to clear before backing up
  answer: C
  explanation: If you miss an exit don't back up. Go to the next exit.
- id: 200
  category: safe_driving_rules
  question: Why are hard surface roads often slippery during the first half hour after
    it begins to rain?
  choices:
    A: The rain causes the asphalt to temporarily melt
    B: Oil, dirt, and tire dust mix with the water to form a slippery combination
    C: The rain washes away the top layer of traction material
    D: Tires become cold and lose their grip on the road
  answer: B
  explanation: The first half hour after a rain often makes hard surface roads slippery
    because dust, road film, oil, dirt, and tire dust mixed with water forms a slippery
    combination.
- id: 201
  category: vehicle_information
  question: Why is it recommended to keep your fuel tank full in cold weather?
  choices:
    A: To add extra weight to the rear of the vehicle for better traction
    B: To prevent moisture condensation in the fuel tank
    C: To keep the engine running at a higher temperature
    D: To ensure the heater works more efficiently
  answer: B
  explanation: Keep your fuel tank full in cold weather to prevent moisture condensation
    in the fuel tank.
- id: 202
  category: safe_driving_rules
  question: What should you do if an animal runs directly in front of your vehicle?
  choices:
    A: Swerve into the oncoming lane to avoid it
    B: Brake firmly but do not swerve
    C: Accelerate to scare the animal away
    D: Honk your horn and swerve to the right
  answer: B
  explanation: If an animal does run in front of your vehicle, brake firmly but do
    not swerve. Swerving can cause a vehicle-vehicle collision or cause the vehicle
    to strike a pedestrian or potentially deadly fixed object.
- id: 203
  category: defensive_driving
  question: What is the proper steering technique to recover from a skid?
  choices:
    A: Turn the front wheels in the opposite direction of the skid
    B: Keep the steering wheel perfectly straight
    C: Turn the front wheels in the direction of the skid
    D: Oversteer to regain traction as quickly as possible
  answer: C
  explanation: To recover from a skid, you should not panic, and turn the front wheels
    in the direction of the skid. Do not oversteer or overcorrect.
- id: 204
  category: safe_driving_rules
  question: When parking on a downhill slope, which way should you turn your front
    wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Straight ahead
    D: Parallel to the center line
  answer: A
  explanation: When parking on a downhill, turn front wheels toward curb. On an uphill,
    turn front wheels away from curb.
- id: 205
  category: safe_driving_rules
  question: What is the maximum distance your wheels can be from the curb when parallel
    parking?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: In parallel parking the wheels must be within 12 inches of near curb.
- id: 206
  category: safe_driving_rules
  question: How far must you park from a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: It is illegal to park closer than 15 ft. from a fire hydrant.
- id: 207
  category: sharing_the_road
  question: What must you do upon the approach of an authorized emergency vehicle
    displaying flashing red and/or blue lights?
  choices:
    A: Speed up to get out of the way before it reaches you
    B: Stop immediately in your current lane
    C: Yield the right-of-way by slowing, pulling to the right-hand edge of the roadway,
      and stopping
    D: Pull to the left-hand edge of the roadway and stop
  answer: C
  explanation: Upon the approach of an authorized emergency vehicle displaying a flashing
    red light and/or blue light... the driver of every vehicle proceeding in any direction
    shall yield the right-of-way by slowing and pulling to the right-hand edge of
    the roadway, clear of an intersection and stopping.
- id: 208
  category: sharing_the_road
  question: How close are you legally allowed to follow an emergency vehicle traveling
    in response to an emergency?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: A vehicle may not follow an emergency vehicle traveling in response
    to an emergency closer than 500 feet.
- id: 209
  category: driver_responsibility
  question: If you are stopped by a police officer and have a concealed deadly weapon
    on your person, what must you do?
  choices:
    A: Keep it hidden and do not mention it unless asked
    B: Notify the officer immediately
    C: Wait for the officer to ask if you have any weapons
    D: Place the weapon on the passenger seat before the officer approaches
  answer: B
  explanation: If you are contacted by an officer and you have a deadly weapon concealed
    on your person, you must notify the officer immediately.
- id: 210
  category: defensive_driving
  question: Which of the following is true regarding animal encounters on Alaskan
    roads?
  choices:
    A: Deer whistles and extra reflectors are the best defense against animals
    B: Most vehicle-moose accidents occur at midday
    C: Deer and moose often travel in pairs or groups
    D: If you hit a big game animal, you may take it home as your property
  answer: C
  explanation: Deer and moose often travel in pairs or groups, so if an animal is
    spotted crossing the road, slow down and be alert for others that may follow.
- id: 211
  category: defensive_driving
  question: Which areas of the road become slippery first during freezing weather?
  choices:
    A: Intersections and crosswalks
    B: Shaded areas, protected areas, and bridges
    C: The center lanes of a four-lane highway
    D: Uphill grades and sharp curves
  answer: B
  explanation: Shaded areas, protected areas, and bridges become slippery before the
    balance of the road surface and stay so longer.
- id: 212
  category: safe_driving_rules
  question: Who bears the chief responsibility for avoiding a collision when a vehicle
    is leaving a parking space?
  choices:
    A: The driver traveling on the main roadway
    B: The driver who is leaving the parking space
    C: Both drivers equally
    D: Pedestrians in the area
  answer: B
  explanation: The chief responsibility for avoiding a collision lies with the driver
    who is leaving a parking space.
- id: 213
  category: sharing_the_road
  question: When encountering a stationary emergency vehicle with overhead flashing
    lights on a four-lane road, what must you do?
  choices:
    A: Stop and wait for the emergency vehicle to turn off its lights
    B: Honk your horn to alert the emergency workers of your presence
    C: Pull to the lane opposite the emergency vehicle if it is safe to do so
    D: Maintain your speed and stay in your current lane
  answer: C
  explanation: When encountering stationary emergency vehicles or tow trucks with
    overhead flashing lights on a four-lane road, drivers must pull to the lane opposite
    the emergency vehicle/tow truck if it is safe to do so.
- id: 214
  category: driver_responsibility
  question: When stopped by law enforcement, which of the following is an acceptable
    way to provide proof of insurance?
  choices:
    A: A verbal confirmation of your policy number
    B: A display on a mobile device
    C: A letter from your bank
    D: A copy of your vehicle's title
  answer: B
  explanation: Drivers must have their driver’s license in their possession, proof
    of insurance, proof of current registration and show it to the officer upon request.
    Proof of insurance may be displayed on a mobile device.
- id: 215
  category: safe_driving_rules
  question: It is illegal to park closer than what distance from a stop sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: 'It is illegal to park closer than the indicated distances from the
    following: ... 30 ft. from stop sign.'
- id: 216
  category: safe_driving_rules
  question: What should you do if you are being pulled over by law enforcement while
    driving in the left lane of a four-lane roadway?
  choices:
    A: Stop immediately in the left lane to avoid moving traffic.
    B: Signal immediately and pull over to the right as soon as it is safe.
    C: Pull over to the left shoulder and wait for the officer.
    D: Wait until the roadway narrows to two lanes before attempting to stop.
  answer: B
  explanation: If you are being pulled over, you should signal immediately to show
    the officer your intentions and pull over to the right as soon as it is safe to
    do so, even if you are in the left lane of a four-lane roadway.
- id: 217
  category: defensive_driving
  question: Which of the following should you AVOID doing if your tire blows out while
    driving?
  choices:
    A: Applying the brakes hard
    B: Concentrating on steering
    C: Slowing down gradually
    D: Pulling completely off the pavement
  answer: A
  explanation: 'If a tire blows out, the manual instructs drivers: ''Don''t apply
    brakes.'' Instead, you should concentrate on steering, slow down gradually, brake
    softly, and pull completely off the pavement.'
- id: 218
  category: defensive_driving
  question: What is the recommended action if your vehicle's accelerator becomes jammed?
  choices:
    A: Turn off the ignition immediately and coast to a stop.
    B: Shift into reverse to slow the vehicle down.
    C: Slap the pedal hard with your foot, shift to neutral, and use the brakes.
    D: Apply the parking brake only while steering.
  answer: C
  explanation: If your accelerator is jammed, you should slap the pedal hard with
    your foot, use the brakes, shift to neutral, and concentrate on steering.
- id: 219
  category: defensive_driving
  question: If your brakes fail while driving, which of the following is a recommended
    emergency maneuver?
  choices:
    A: Shift to a higher gear to gain momentum.
    B: Shift to neutral and coast until you stop.
    C: Rub your tires on the curb to slow down.
    D: Pump the accelerator pedal repeatedly.
  answer: C
  explanation: If your brakes fail, the manual recommends that you use the parking
    brake, shift to a lower gear, and rub your tires on the curb.
- id: 220
  category: defensive_driving
  question: If your wheels veer off the roadway, how should you safely return to the
    pavement?
  choices:
    A: Turn back onto the pavement at a high speed to maintain momentum.
    B: Jerk the steering wheel sharply to the left.
    C: Brake hard and stop completely on the shoulder before moving.
    D: Brake lightly and intermittently, and turn back onto the pavement at a slow
      speed.
  answer: D
  explanation: If your wheels are off the roadway, you should maintain car control,
    brake lightly and intermittently, and turn back onto the pavement at a slow speed
    when there are no cars in your immediate vicinity.
- id: 221
  category: safe_driving_rules
  question: 'When traveling on a downgrade, it is illegal to:'
  choices:
    A: Use your brakes intermittently.
    B: Coast with the gears in neutral or the clutch disengaged.
    C: Shift into a lower gear to control your speed.
    D: Drive below the posted speed limit.
  answer: B
  explanation: Coasting is prohibited. A driver of a motor vehicle when traveling
    on a downgrade may not coast with the gears of the vehicle in neutral, or with
    the clutch disengaged.
- id: 222
  category: safe_driving_rules
  question: 'You should not turn around near a curve or hill when you cannot see approaching
    vehicles for at least:'
  choices:
    A: 200 feet in each direction.
    B: 300 feet in each direction.
    C: 500 feet in each direction.
    D: 1,000 feet in each direction.
  answer: C
  explanation: Do not turn around near a curve or hill when the driver cannot see
    500 feet or more in each direction.
- id: 223
  category: safe_driving_rules
  question: When is it legal to back up on a controlled access highway or its entrance/exit
    ramps?
  choices:
    A: When you miss your exit and there is no traffic behind you.
    B: Only during daylight hours when visibility is clear.
    C: When directed by police, fire, or construction flag personnel.
    D: It is never legal under any circumstances.
  answer: C
  explanation: Unless directed by police, fire or construction flag personnel, it
    is illegal to back on a 'controlled access' highway, or on its entrance or exit
    ramps.
- id: 224
  category: vehicle_information
  question: 'In Alaska, non-commercial registered vehicles are required to display:'
  choices:
    A: Both front and rear license plates with valid tabs.
    B: A single rear license plate with valid year and month tabs.
    C: A single front license plate with valid year and month tabs.
    D: A rear license plate and a windshield registration sticker.
  answer: B
  explanation: Alaska non-commercial registered vehicles must have a single rear license
    plate with valid year and month tabs.
- id: 225
  category: vehicle_information
  question: 'A passenger vehicle''s foot brake must be adequate to stop the vehicle
    within 25 feet when traveling at a speed of:'
  choices:
    A: 15 miles per hour.
    B: 20 miles per hour.
    C: 25 miles per hour.
    D: 30 miles per hour.
  answer: B
  explanation: The foot brake must be adequate to stop a passenger vehicle within
    25 feet at a speed of 20 miles per hour.
- id: 226
  category: vehicle_information
  question: 'Your vehicle''s horn must be capable of emitting a sound audible under
    normal conditions from a distance of not less than:'
  choices:
    A: 100 feet.
    B: 200 feet.
    C: 300 feet.
    D: 500 feet.
  answer: B
  explanation: A vehicle's horn must be capable of emitting sound audible under normal
    conditions from not less than 200 feet.
- id: 227
  category: alcohol_drugs_health
  question: Which of the following are symptoms of carbon monoxide poisoning?
  choices:
    A: Ringing in the ears and blurred vision
    B: Headache, dizziness, nausea, and vomiting
    C: Rapid heartbeat and shortness of breath
    D: Fever and muscle aches
  answer: B
  explanation: Symptoms of carbon monoxide poisoning include headache, dizziness,
