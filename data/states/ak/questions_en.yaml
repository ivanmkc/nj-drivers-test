- category: driver_testing
  question: What happens if the vehicle you bring for the Alaska driving test has
    mechanical defects?
  choices:
    A: You will be allowed to test but points will be deducted
    B: The driving test may be refused or delayed until the defects are corrected
    C: You must pay an additional fee for the examiner to inspect the vehicle
    D: You will be given a temporary pass to return within 30 days
  answer: B
