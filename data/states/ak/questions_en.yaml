  question: Under Alaska's Mandatory Insurance Law, what are the minimum bodily injury
    or death coverage amounts a driver must carry?
  choices:
    A: $25,000/$50,000
    B: $50,000/$100,000
    C: $100,000/$300,000
    D: $15,000/$30,000
  answer: B
  explanation: The minimum amount of liability insurance coverage is $50,000/$100,000
    for bodily injury or death. The first number is the per-person limit and the second
    is the per-accident limit. (Ch. 2, Mandatory Insurance Law)
