questions:
- id: 1
  category: license_system
  question: En el estado de Washington, si está inscrito en un curso de educación
    vial aprobado, ¿cuál es la edad mínima a la que puede solicitar un permiso de
    instrucción?
  choices:
    A: 15 años
    B: 15 años y medio
    C: 16 años
    D: 14 años y medio
  answer: A
  explanation: En Washington, puede obtener un permiso de instrucción a los 15 años
    si está inscrito en un curso de educación vial aprobado. Si no está inscrito,
    debe esperar hasta tener 15 años y medio.
- id: 2
  category: license_system
  question: ¿Cuántos días tiene para notificar al Departamento de Licencias (DOL)
    de Washington después de cambiar su nombre legal o dirección?
  choices:
    A: 30 días
    B: 15 días
    C: 10 días
    D: 45 días
  answer: C
  explanation: La ley de Washington exige que notifique al DOL dentro de los 10 días
    posteriores a cualquier cambio en su nombre o dirección.
- id: 3
  category: license_system
  question: ¿Cuál es la restricción de conducción nocturna para un conductor de Washington
    que posee una Licencia de Conducir Intermedia (IDL)?
  choices:
    A: No conducir entre las 10 PM y las 4 AM
    B: No conducir entre la medianoche y las 6 AM
    C: No conducir entre la 1 AM y las 5 AM
    D: No conducir entre las 11 PM y las 5 AM
  answer: C
  explanation: Los titulares de una Licencia de Conducir Intermedia tienen prohibido
    conducir entre la 1 AM y las 5 AM, a menos que estén acompañados por un padre,
    tutor o conductor con licencia de al menos 25 años de edad.
- id: 4
  category: license_system
  question: Si un conductor de Washington con una Licencia de Conducir Intermedia
    (IDL) comete una segunda infracción de tráfico, ¿cuál es la sanción?
  choices:
    A: Se envía una carta de advertencia a los padres
    B: La licencia se suspende por 6 meses
    C: La licencia se revoca hasta los 18 años
    D: Una multa obligatoria de $500
  answer: B
  explanation: Por una segunda infracción de tráfico bajo una IDL, la licencia se
    suspende por seis meses (o hasta los 18 años, lo que ocurra primero).
- id: 5
  category: license_system
  question: Para supervisar a un conductor con un permiso de instrucción en Washington,
    ¿cuántos años de experiencia al volante debe tener como mínimo el conductor con
    licencia?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: 10 años
  answer: C
  explanation: La persona que supervisa al titular de un permiso debe tener al menos
    cinco años de experiencia al volante y estar sentada en el asiento del pasajero
    delantero derecho.
- id: 6
  category: license_system
  question: 'Antes de solicitar una Licencia de Conducir Intermedia en Washington,
    un adolescente debe haber tenido un permiso de instrucción durante al menos:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Washington exige que los adolescentes tengan un permiso de
    instrucción durante al menos seis meses antes de ser elegibles para una Licencia
    de Conducir Intermedia.
- id: 7
  category: license_system
  question: ¿Cuántas horas de práctica de conducción supervisada, incluyendo horas
    nocturnas, se requieren para obtener una Licencia de Conducir Intermedia de Washington?
  choices:
    A: 40 horas en total, 5 por la noche
    B: 50 horas en total, 10 por la noche
    C: 60 horas en total, 15 por la noche
    D: 30 horas en total, 10 por la noche
  answer: B
  explanation: Los solicitantes de una IDL deben certificar que han tenido al menos
    50 horas de experiencia al volante, 10 de las cuales deben ser por la noche.
- id: 8
  category: license_system
  question: Después de los primeros seis meses de tener una Licencia de Conducir Intermedia,
    ¿a cuántos pasajeros menores de 20 años (que no sean familiares) está restringido
    un conductor de Washington?
  choices:
    A: Ninguno
    B: Uno
    C: Dos
    D: Tres
  answer: D
  explanation: Después de los primeros seis meses, la restricción de pasajeros cambia
    para permitir no más de tres pasajeros menores de 20 años que no sean miembros
    de la familia inmediata.
- id: 9
  category: license_system
  question: ¿Dentro de cuántos días después de mudarse al estado deben los nuevos
    residentes de Washington obtener una licencia de conducir del estado de Washington?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Si se muda a Washington y tiene una licencia válida de otro estado,
    debe obtener una licencia de Washington dentro de los 30 días posteriores a convertirse
    en residente.
- id: 10
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    por daños a la propiedad en una sola colisión en Washington?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: B
  explanation: La ley de Washington exige un seguro de responsabilidad civil mínimo
    de $25,000 por lesiones corporales a una persona, $50,000 por lesiones corporales
    a dos o más personas y $10,000 por daños a la propiedad.
- id: 11
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción de Washington?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Un permiso de instrucción del estado de Washington es válido por un
    año y puede renovarse.
- id: 12
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que un adolescente reciba
    una Licencia de Conducir Intermedia (IDL) en Washington?
  choices:
    A: No tener infracciones de tránsito en los últimos 6 meses
    B: Aprobar un examen de la vista
    C: Aprobar un examen de conocimientos y de habilidades de conducción
    D: Todas las anteriores
  answer: D
  explanation: Para obtener una IDL, debe tener entre 16 y 17 años, haber tenido un
    permiso durante 6 meses, tener 50 horas de práctica, no tener infracciones de
    tránsito en los últimos 6 meses y aprobar todos los exámenes requeridos.
- id: 13
  category: license_system
  question: 'En Washington, el uso de un dispositivo electrónico personal (como un
    teléfono celular) mientras se tiene una Licencia de Conducir Intermedia es:'
  choices:
    A: Permitido si se utiliza un dispositivo de manos libres
    B: Permitido solo para el GPS
    C: Prohibido en todo momento, incluyendo el uso de manos libres, excepto en emergencias
    D: Permitido solo cuando se está detenido en un semáforo en rojo
  answer: C
  explanation: Los titulares de una Licencia de Conducir Intermedia tienen prohibido
    el uso de cualquier dispositivo de comunicación inalámbrica mientras conducen,
    incluso si es manos libres, a menos que sea para una emergencia.
- id: 14
  category: license_system
  question: 'Si es menor de 21 años, puede ser arrestado por un DUI en Washington
    si su nivel de THC (marihuana) es superior a:'
  choices:
    A: 5.00 nanogramos por mililitro
    B: 2.00 nanogramos por mililitro
    C: 0.00 nanogramos por mililitro
    D: 0.05 nanogramos por mililitro
  answer: C
  explanation: Washington tiene una política de "tolerancia cero" para menores. Si
    es menor de 21 años, puede ser arrestado por un nivel de THC superior a 0.00 nanogramos
    por mililitro.
- id: 15
  category: license_system
  question: ¿Por cuántos años es válida normalmente una licencia de conducir estándar
    del estado de Washington antes de que expire?
  choices:
    A: 4 años
    B: 5 años
    C: 6 años
    D: 8 años
  answer: D
  explanation: Según las actualizaciones recientes de la ley de Washington, las licencias
    de conducir estándar y las tarjetas de identificación se emiten ahora por un período
    de ocho años.
- id: 16
  category: license_system
  question: 'Cuando vende o transfiere un vehículo en Washington, debe informar la
    venta al Departamento de Licencias (DOL) dentro de:'
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: A
  explanation: La ley de Washington exige que el vendedor de un vehículo presente
    un Informe de Venta dentro de los 5 días posteriores a la transacción.
- id: 17
  category: license_system
  question: 'Después de comprar un vehículo a un particular en Washington, el comprador
    debe transferir el título dentro de:'
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 20 días
  answer: C
  explanation: El comprador debe transferir el título del vehículo a su nombre dentro
    de los 15 días para evitar un cargo por penalización por retraso.
- id: 18
  category: license_system
  question: 'Bajo la Ley de Consentimiento Implícito de Washington, si se niega a
    hacerse una prueba de aliento o de sangre para determinar su concentración de
    alcohol o drogas, su licencia será revocada por al menos:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Al conducir en Washington, usted ha dado su consentimiento para una
    prueba de aliento. Negarse a la prueba resulta en una revocación obligatoria de
    la licencia por 1 año por la primera infracción.
- id: 19
  category: license_system
  question: En Washington, una persona es considerada un "Infractor de Tránsito Habitual"
    si acumula ¿cuántas infracciones de movimiento en un período de cinco años?
  choices:
    A: '10'
    B: '15'
    C: '20'
    D: '25'
  answer: C
  explanation: Bajo la ley de Infractores de Tránsito Habituales, a una persona que
    recibe 20 o más infracciones de movimiento en un período de cinco años se le revocará
    la licencia por siete años.
- id: 20
  category: license_system
  question: 'Una Licencia de Conducir Mejorada (EDL) de Washington es una alternativa
    aceptable al pasaporte para:'
  choices:
    A: Viajes aéreos internacionales a cualquier país
    B: Reingresar a los EE. UU. desde Canadá o México por tierra o mar
    C: Registrarse para votar en un estado diferente
    D: Operar un vehículo comercial de más de 26,001 libras
  answer: B
  explanation: Una Licencia de Conducir Mejorada (EDL) o una Identificación Mejorada
    (EID) permite a los residentes de Washington reingresar a los EE. UU. desde Canadá,
    México o el Caribe por tierra o mar sin necesidad de un pasaporte.
- id: 21
  category: license_system
  question: La ley de Washington exige que los automovilistas tengan un seguro de
    responsabilidad civil. ¿Cuál es la cobertura mínima requerida por lesiones corporales
    a una persona en una sola colisión?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: Los requisitos mínimos de seguro de responsabilidad civil en Washington
    son $25,000 por lesiones corporales a una persona y $50,000 por lesiones corporales
    a dos o más personas.
- id: 22
  category: license_system
  question: ¿Cuál es la cobertura mínima requerida de seguro de responsabilidad civil
    por lesiones corporales a dos o más personas en una sola colisión en Washington?
  choices:
    A: $25,000
    B: $30,000
    C: $50,000
    D: $60,000
  answer: C
  explanation: La ley de seguro obligatorio de Washington exige al menos $50,000 por
    lesiones corporales o muerte de dos o más personas en cualquier colisión.
- id: 23
  category: license_system
  question: Para los conductores de 21 años o más en Washington, es ilegal conducir
    con un nivel de THC (marihuana) de ____ nanogramos por mililitro de sangre o más.
  choices:
    A: '1.00'
    B: '2.00'
    C: '5.00'
    D: '8.00'
  answer: C
  explanation: En Washington, el límite legal de THC en la sangre para conductores
    de 21 años o más es de 5.00 nanogramos por mililitro.
- id: 24
  category: license_system
  question: 'En Washington, se considera que un conductor de 21 años o más está conduciendo
    bajo la influencia (DUI) si su contenido de alcohol en la sangre (BAC) es:'
  choices:
    A: 0.02% o más
    B: 0.04% o más
    C: 0.05% o más
    D: 0.08% o más
  answer: D
  explanation: El límite legal de BAC para conductores adultos (21+) en el estado
    de Washington es de 0.08%.
- id: 25
  category: license_system
  question: ¿A qué edad puede un residente de Washington preinscribirse para votar
    en una oficina del Departamento de Licencias?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: En Washington, los jóvenes de 16 y 17 años pueden preinscribirse para
    votar cuando solicitan su licencia de conducir o permiso; se registrarán automáticamente
    cuando cumplan 18 años.
- id: 26
  category: license_system
  question: Si recibe una notificación de una infracción de tráfico, ¿dentro de cuántos
    días debe responder al tribunal?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: No responder a una infracción de tráfico dentro de los 15 días resultará
    en que el tribunal notifique al Departamento de Licencias (DOL), lo que puede
    llevar a la suspensión de la licencia.
- id: 27
  category: license_system
  question: Después de una condena por DUI y la subsiguiente suspensión de la licencia,
    ¿por cuántos años se le requiere a un conductor de Washington tener una 'Licencia
    Probatoria'?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 7 años
  answer: C
  explanation: Un conductor condenado por DUI debe tener una licencia probatoria durante
    cinco años después de que termine su período de suspensión.
- id: 28
  category: license_system
  question: 'En Washington, es posible que no pueda renovar el registro de su vehículo
    (calcomanías o ''tabs'') si tiene:'
  choices:
    A: Seguro de auto vencido
    B: Multas de estacionamiento o infracciones de peaje sin pagar
    C: Un parabrisas agrietado
    D: Más de dos pasajeros en el vehículo
  answer: B
  explanation: El Departamento de Licencias no renovará las calcomanías del vehículo
    si el propietario tiene multas de estacionamiento pendientes, infracciones de
    peaje u otras sanciones civiles específicas.
- id: 29
  category: driver_testing
  question: 'Para cumplir con los requisitos mínimos de visión para una licencia de
    conducir de Washington, su agudeza visual debe ser de al menos:'
  choices:
    A: 20/20 en ambos ojos
    B: 20/40 en al menos un ojo
    C: 20/50 en ambos ojos
    D: 20/30 en al menos un ojo
  answer: B
  explanation: Según la Guía del Conductor de Washington, debe tener una agudeza visual
    de al menos 20/40 en al menos un ojo, con o sin lentes correctivos, para aprobar
    el examen de la vista.
- id: 30
  category: driver_testing
  question: El examen de conocimientos del estado de Washington consta de 40 preguntas
    de opción múltiple. ¿Cuál es el número mínimo de preguntas que debe responder
    correctamente para aprobar?
  choices:
    A: '25'
    B: '30'
    C: '32'
    D: '35'
  answer: C
  explanation: El examen de conocimientos de Washington requiere una puntuación de
    aprobación del 80%, lo que significa que debe responder correctamente al menos
    32 de las 40 preguntas.
- id: 31
  category: driver_testing
  question: Al realizar el examen de habilidades (conducción) en Washington, ¿cuál
    de los siguientes NO es un equipo obligatorio para su vehículo?
  choices:
    A: Luces de giro y de freno en funcionamiento
    B: Un parabrisas sin ninguna grieta
    C: Comprobante válido de seguro de responsabilidad civil
    D: Cinturones de seguridad tanto para el conductor como para el examinador
  answer: B
  explanation: Si bien el parabrisas debe proporcionar una visión sin obstrucciones,
    no necesariamente tiene que estar "libre de grietas", siempre que las grietas
    no interfieran con la visión o la seguridad del conductor. Sin embargo, el seguro,
    las luces en funcionamiento y los cinturones de seguridad son obligatorios para
    el examen.
- id: 32
  category: driver_testing
  question: ¿A qué edad una Licencia de Conducir Intermedia (IDL) de Washington pasa
    automáticamente a ser una licencia de conducir regular (básica)?
  choices:
    A: '17'
    B: '18'
    C: '21'
    D: '19'
  answer: B
  explanation: Las restricciones de una Licencia de Conducir Intermedia (IDL) vencen
    al cumplir el conductor 18 años, momento en el cual se convierte en una licencia
    de conducir básica.
- id: 33
  category: driver_testing
  question: Si reprueba el examen de habilidades (conducción) de Washington en su
    primer intento, ¿cuánto tiempo debe esperar antes de ser elegible para volver
    a tomarlo?
  choices:
    A: 24 horas
    B: 3 días
    C: 1 semana
    D: 2 semanas
  answer: C
  explanation: En Washington, si reprueba el examen de habilidades, debe esperar al
    menos una semana (7 días) antes de poder tomar el examen nuevamente por primera
    vez.
- id: 34
  category: driver_testing
  question: Una vez que haya aprobado con éxito el examen de conocimientos de Washington,
    ¿por cuánto tiempo son válidos los resultados?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Los resultados del examen de conocimientos del estado de Washington
    son válidos por dos años a partir de la fecha del examen.
- id: 35
  category: driver_testing
  question: Para obtener una Licencia de Conducir Intermedia en Washington, un adolescente
    debe completar un curso de educación vial aprobado que incluya ¿al menos cuántas
    horas de instrucción en el aula?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 50 horas
  answer: B
  explanation: La ley de Washington exige que los adolescentes menores de 18 años
    completen un curso de educación vial aprobado que consista en al menos 30 horas
    de instrucción en el aula.
- id: 36
  category: driver_testing
  question: Además de las horas de aula, un curso de educación vial aprobado en Washington
    debe incluir ¿cuántas horas de instrucción al volante?
  choices:
    A: 4 horas
    B: 6 horas
    C: 8 horas
    D: 10 horas
  answer: B
  explanation: El plan de estudios de educación vial de Washington requiere un mínimo
    de 6 horas de práctica al volante y 1 hora de observación.
- id: 37
  category: driver_testing
  question: ¿Cuál de las siguientes situaciones resultaría en una reprobación automática
    durante el examen de habilidades (conducción) de Washington?
  choices:
    A: No usar una luz de giro una vez
    B: Estacionar a más de 12 pulgadas de la acera
    C: Realizar una "parada incompleta" (rolling stop) en una señal de alto
    D: Conducir a 2 mph por debajo del límite de velocidad
  answer: C
  explanation: Realizar una "parada incompleta" (no detenerse por completo) es una
    violación de las leyes de tránsito y, por lo general, resulta en una reprobación
    automática del examen de habilidades.
- id: 38
  category: driver_testing
  question: ¿Cuál es la diferencia principal entre una licencia de conducir estándar
    de Washington y una Licencia de Conducir Mejorada (EDL)?
  choices:
    A: Una EDL le permite conducir vehículos comerciales
    B: Una EDL se puede utilizar para viajes aéreos internacionales a Europa
    C: Una EDL es una alternativa aceptable al pasaporte para cruces fronterizos terrestres
      y marítimos hacia Canadá y México
    D: Una EDL no requiere un examen de la vista para su renovación
  answer: C
  explanation: La Licencia de Conducir Mejorada (EDL) de Washington es un documento
    que cumple con la ley REAL ID y permite cruces fronterizos terrestres y marítimos
    hacia Canadá, México y el Caribe sin necesidad de un pasaporte por separado.
- id: 39
  category: driver_testing
  question: 'Al solicitar una licencia de conducir de Washington, también puede registrarse
    para votar si tiene al menos:'
  choices:
    A: 15 años
    B: 16 años
    C: 17 años
    D: 18 años
  answer: B
  explanation: En Washington, puede pre-registrarse para votar a los 16 o 17 años
    cuando solicita su licencia, y se le registrará automáticamente para votar cuando
    cumpla 18 años.
- id: 40
  category: driver_testing
  question: 'Si tiene una condición médica que podría afectar su capacidad para conducir
    de manera segura, usted debe:'
  choices:
    A: Solo informarle a su compañía de seguros
    B: Entregar su licencia de inmediato
    C: Informar sobre la condición al Departamento de Licencias (DOL) al solicitar
      o renovar su licencia
    D: Mantenerlo en privado, ya que está protegido por las leyes HIPAA
  answer: C
  explanation: La ley de Washington exige que los conductores informen al DOL sobre
    cualquier condición física o mental que pueda afectar su capacidad para operar
    un vehículo motorizado de manera segura.
- id: 41
  category: driver_testing
  question: ¿Cuántos años antes de que expire su licencia de conducir de Washington
    se le permite renovarla?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 90 días
  answer: B
  explanation: En el estado de Washington, puede renovar su licencia de conducir hasta
    un año antes de que expire.
- id: 42
  category: driver_testing
  question: Para aprobar el examen de la vista para una licencia de conducir de Washington,
    su agudeza visual debe ser de al menos ________ en al menos un ojo, con o sin
    lentes correctivos.
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Según la Guía del Conductor de Washington, los solicitantes deben tener
    una visión de al menos 20/40 en al menos un ojo, con o sin lentes correctivos,
    para aprobar el examen de la vista.
- id: 43
  category: driver_testing
  question: Durante el examen de habilidades de conducción de Washington, ¿cuál de
    las siguientes es una razón para reprobar de inmediato?
  choices:
    A: No usar una luz de giro una vez
    B: Conducir sobre un bordillo (acera)
    C: Ajustar los espejos mientras está detenido
    D: Conducir a 2 mph por debajo del límite de velocidad
  answer: B
  explanation: En Washington, realizar una acción peligrosa como conducir sobre un
    bordillo, causar una colisión o desobedecer una señal de tráfico resulta en la
    reprobación inmediata del examen de habilidades.
- id: 44
  category: driver_testing
  question: En Washington, si una colisión resulta en lesiones, muerte o daños a la
    propiedad de ________ o más a la propiedad de una persona, y un oficial de policía
    no presenta un informe, usted debe presentar un Informe de Colisión.
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,500
  answer: C
  explanation: La ley de Washington exige que los conductores presenten un informe
    de colisión en un plazo de 4 días si hay lesiones, muerte o daños a la propiedad
    de $1,000 o más a la propiedad de cualquier persona.
- id: 45
  category: driver_testing
  question: En Washington, ¿a cuántos pies de un hidrante de incendios está prohibido
    estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: Según la ley del estado de Washington (RCW 46.61.570), no se puede
    estacionar un vehículo a menos de 15 pies de un hidrante de incendios.
- id: 46
  category: driver_testing
  question: En Washington, ¿a cuántos pies de una señal de alto (pare), señal de ceda
    el paso o señal de control de tráfico no se puede estacionar?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Washington prohíbe estacionarse a menos de 30 pies de cualquier
    señal intermitente, señal de alto (pare), señal de ceda el paso o señal de control
    de tráfico ubicada al costado de una calzada.
- id: 47
  category: driver_testing
  question: Al conducir de noche en Washington, debe bajar las luces altas cuando
    se encuentre a ________ pies de un vehículo que viene en sentido contrario.
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Washington (RCW 46.37.230) exige que los conductores usen
    las luces bajas al acercarse a un vehículo que viene en sentido contrario a menos
    de 500 pies.
- id: 48
  category: driver_testing
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    una zona escolar en el estado de Washington?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: En Washington, el límite de velocidad estándar en una zona escolar
    es de 20 mph cuando las luces están parpadeando o hay niños presentes.
- id: 49
  category: driver_testing
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad legal
    en las calles de ciudades y pueblos en Washington?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: Según el RCW 46.61.400, el límite de velocidad máximo en las calles
    de ciudades o pueblos es de 25 mph, a menos que se indique lo contrario.
- id: 50
  category: driver_testing
  question: ¿A menos que se indique lo contrario, cuál es el límite de velocidad legal
    en los caminos del condado de Washington?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: B
  explanation: Según el RCW 46.61.400, el límite máximo de velocidad en los caminos
    del condado es de 50 mph, a menos que se indique lo contrario.
- id: 51
  category: driver_testing
  question: La Guía del Conductor de Washington recomienda mantener una distancia
    de seguimiento de al menos ________ detrás del vehículo que va delante de usted
    a velocidades superiores a 30 mph.
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: La Guía del Conductor de Washington recomienda la "regla de los cuatro
    segundos" para proporcionar una distancia de seguimiento segura en condiciones
    normales de conducción.
- id: 52
  category: driver_responsibility
  question: 'En el estado de Washington, debe presentar un Informe de Colisión si
    hay una lesión, muerte o daños a la propiedad de cualquier persona de al menos:'
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,500
  answer: C
  explanation: Según la Guía del Conductor de Washington, se debe presentar un informe
    por escrito (Informe de Colisión de Vehículos Motorizados) en un plazo de cuatro
    días si hay una lesión, muerte o daños a la propiedad de $1,000 o más a la propiedad
    de una persona.
- id: 53
  category: driver_responsibility
  question: Si ocurre una colisión que debe reportarse y un oficial de la ley no presenta
    un informe, ¿cuántos días tiene para presentar un Informe de Colisión de Tráfico
    de Washington?
  choices:
    A: 24 horas
    B: 4 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: Si una colisión resulta en lesiones, muerte o daños a la propiedad
    superiores a $1,000 y ningún oficial presenta un informe, usted debe presentar
    uno por su cuenta en un plazo de 4 días.
- id: 54
  category: driver_responsibility
  question: ¿Dónde debe guardarse el certificado de registro del vehículo en el estado
    de Washington?
  choices:
    A: En la residencia del propietario
    B: En el vehículo
    C: En la billetera o bolso del propietario
    D: En el Departamento de Licencias
  answer: B
  explanation: La ley de Washington exige que el certificado de registro del vehículo
    se lleve en el vehículo siempre que este se encuentre en funcionamiento.
- id: 55
  category: driver_responsibility
  question: Para conductores de 21 años de edad o más, ¿cuál es el límite legal de
    contenido de alcohol en la sangre (BAC) en Washington?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En Washington, es ilegal que una persona de 21 años o más conduzca
    con un BAC de 0.08% o superior.
- id: 56
  category: driver_responsibility
  question: En Washington, ¿cuál es el límite legal de THC (marihuana) en la sangre
    para un conductor de 21 años de edad o más?
  choices:
    A: 1.00 nanogramo por mililitro
    B: 2.00 nanogramos por mililitro
    C: 5.00 nanogramos por mililitro
    D: 10.00 nanogramos por mililitro
  answer: C
  explanation: Para conductores de 21 años o más, el límite legal de THC es de 5.00
    nanogramos por mililitro de sangre.
- id: 57
  category: driver_responsibility
  question: Si un oficial de la ley lo detiene y no puede mostrar un comprobante de
    seguro de vehículo motorizado, ¿cuál es el resultado?
  choices:
    A: Recibirá una infracción de tráfico
    B: Su vehículo será confiscado de inmediato
    C: Su licencia será revocada por un año
    D: No hay sanción si tiene seguro pero olvidó la tarjeta
  answer: A
  explanation: No proporcionar un comprobante de seguro cuando lo solicita un oficial
    de la ley es una infracción de tráfico en Washington.
- id: 58
  category: driver_responsibility
  question: Según la ley de Washington, ¿en qué parte del vehículo es ilegal tener
    un recipiente de alcohol abierto?
  choices:
    A: El maletero
    B: El compartimiento de pasajeros
    C: Detrás del último asiento vertical de un vehículo sin maletero
    D: Una guantera con llave
  answer: B
  explanation: Es una infracción de tráfico mantener un recipiente de alcohol abierto
    en el compartimiento de pasajeros de un vehículo motorizado en una carretera.
- id: 59
  category: driver_responsibility
  question: 'Si choca con un vehículo estacionado y no puede encontrar al propietario,
    la ley de Washington le exige:'
  choices:
    A: Esperar al menos dos horas a que regrese el propietario
    B: Dejar una nota con su nombre, dirección y una descripción de lo sucedido
    C: Llamar a una grúa para mover el otro vehículo
    D: Irse si el daño parece ser inferior a $500
  answer: B
  explanation: Si choca contra un vehículo desatendido, debe intentar encontrar al
    propietario. Si no puede, debe dejar una nota en un lugar visible con su nombre,
    dirección y la fecha/hora de la colisión.
- id: 60
  category: driver_responsibility
  question: Si su privilegio de conducir es suspendido debido a la falta de responsabilidad
    financiera, ¿por cuánto tiempo debe mantener típicamente un certificado SR-22
    (Prueba de Responsabilidad Financiera)?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: En Washington, si se le requiere presentar una prueba de responsabilidad
    financiera (SR-22), generalmente debe mantenerla durante tres años.
- id: 61
  category: driver_responsibility
  question: 'La ley del estado de Washington exige que la mayoría de los vehículos
    de pasajeros exhiban placas de matrícula en:'
  choices:
    A: Solo en la parte trasera del vehículo
    B: Solo en la parte delantera del vehículo
    C: Tanto en la parte delantera como en la trasera del vehículo
    D: En la parte trasera y en el tablero
  answer: C
  explanation: La ley de Washington exige que la mayoría de los vehículos motorizados
    exhiban placas de matrícula tanto en la parte delantera como en la trasera del
    vehículo.
- id: 62
  category: driver_responsibility
  question: 'En Washington, arrojar un cigarrillo encendido o cualquier otro ''residuo
    encendido'' desde un vehículo en movimiento es un delito castigado con una multa
    de hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,025
  answer: D
  explanation: Washington tiene leyes estrictas contra el arrojo de basura; específicamente,
    arrojar productos de tabaco encendidos u otros residuos encendidos es un delito
    que puede resultar en una multa de $1,025.
- id: 63
  category: driver_responsibility
  question: 'Por una primera condena por DUI (conducir bajo la influencia) en Washington,
    su licencia de conducir será suspendida por al menos:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Una primera condena por DUI en Washington resulta en una suspensión
    de la licencia de al menos 90 días.
- id: 64
  category: driver_responsibility
  question: La ley 'Move Over' (hacerse a un lado) de Washington exige que los conductores
    se muevan al carril izquierdo o reduzcan la velocidad al acercarse a vehículos
    de emergencia estacionados. ¿Qué sucede con la multa por una infracción de tráfico
    en esta zona?
  choices:
    A: La multa se exonera para los infractores por primera vez
    B: La multa se reduce a la mitad
    C: La multa se duplica
    D: La multa se triplica
  answer: C
  explanation: Bajo la ley 'Move Over' (ley de Zona de Emergencia), las multas se
    duplican por las infracciones cometidas en una zona de emergencia.
- id: 65
  category: driver_responsibility
  question: 'Si usted se ve involucrado en una colisión y no tiene el seguro de responsabilidad
    civil requerido, el Departamento de Licencias puede suspender su licencia por
    hasta:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Si usted está en una colisión y no tiene seguro, su licencia puede
    ser suspendida por hasta tres años si no paga los daños o llega a un acuerdo.
- id: 66
  category: driver_responsibility
  question: En el estado de Washington, si usted se ve involucrado en una colisión
    que resulte en lesiones, muerte o daños a la propiedad de $1,000 o más, ¿dentro
    de cuántos días debe presentar un informe de accidente?
  choices:
    A: 2 días
    B: 4 días
    C: 7 días
    D: 10 días
  answer: B
  explanation: De acuerdo con la Guía del Conductor de Washington, debe presentar
    un Informe de Colisión de Vehículos Motorizados dentro de los cuatro días si hay
    una lesión, muerte o daños a la propiedad de $1,000 o más para la propiedad de
    cualquier persona.
- id: 67
  category: driver_responsibility
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad civil requerido
    en Washington por lesiones corporales o muerte de una persona en cualquier colisión?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: D
  explanation: La ley de Washington exige que los automovilistas tengan un mínimo
    de $25,000 por lesiones corporales o muerte de una persona en cualquier colisión.
- id: 68
  category: driver_responsibility
  question: En Washington, ¿quién es legalmente responsable de asegurar que los pasajeros
    menores de 16 años estén debidamente abrochados o asegurados en un asiento de
    seguridad para niños?
  choices:
    A: Los propios pasajeros
    B: El conductor del vehículo
    C: Los padres de los pasajeros (incluso si no están en el auto)
    D: Nadie; es una elección personal
  answer: B
  explanation: En Washington, el conductor es responsable y será citado por cualquier
    pasajero menor de 16 años que no use debidamente el cinturón de seguridad o no
    esté en un asiento de seguridad para niños.
- id: 69
  category: driver_responsibility
  question: En Washington, ¿qué sucede con la multa por una infracción de tráfico
    cometida en una 'Zona de Emergencia' (adyacente a vehículos de emergencia estacionados
    con sirenas/luces)?
  choices:
    A: La multa se exonera para los infractores por primera vez
    B: La multa se duplica
    C: La multa se triplica
    D: La multa sigue siendo la misma pero los puntos se triplican
  answer: B
  explanation: Bajo la ley de Washington (RCW 46.61.212), las multas por infracciones
    de tráfico cometidas en una zona de emergencia se duplican.
- id: 70
  category: driver_responsibility
  question: Si no cumple con una notificación de una infracción de tránsito, como
    no comparecer ante el tribunal o no pagar una multa, ¿qué medida tomará el DOL
    de Washington?
  choices:
    A: Solo aumentarán sus tarifas de seguro
    B: Solo emitirán una orden de arresto
    C: Pueden suspender su privilegio de conducir
    D: Confiscarán su vehículo
  answer: C
  explanation: No responder a una notificación de infracción de tránsito o no pagar
    una multa puede resultar en la suspensión de su licencia de conducir.
- id: 71
  category: driver_responsibility
  question: En Washington, ¿es ilegal estacionar un vehículo a menos de cuántos pies
    de un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: La ley de Washington prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 72
  category: driver_responsibility
  question: 'La ley de Washington exige que encienda sus faros delanteros desde:'
  choices:
    A: Una hora después de la puesta del sol hasta una hora antes del amanecer
    B: Media hora después de la puesta del sol hasta media hora antes del amanecer
    C: Desde la puesta del sol hasta el amanecer
    D: De 8:00 PM a 6:00 AM
  answer: B
  explanation: La ley de Washington exige que los faros se enciendan desde media hora
    después de la puesta del sol hasta media hora antes del amanecer.
- id: 73
  category: driver_responsibility
  question: En Washington, ¿a cuántos pies de un vehículo que viene en dirección contraria
    debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Debe bajar las luces altas siempre que se encuentre a menos de 500
    pies de un vehículo que se aproxima en dirección contraria.
- id: 74
  category: driver_responsibility
  question: En Washington, ¿cuál es la multa máxima por 'basura potencialmente peligrosa',
    como un cigarrillo encendido o vidrio?
  choices:
    A: $103
    B: $250
    C: $500
    D: $1,025
  answer: D
  explanation: En Washington, la multa por tirar basura con artículos potencialmente
    peligrosos, como cigarrillos encendidos o vidrio, es de $1,025.
- id: 75
  category: safe_driving_rules
  question: Al estacionar su vehículo en Washington, ¿a cuántas pulgadas del bordillo
    (curb) debe estar?
  choices:
    A: 6 pulgadas
    B: 10 pulgadas
    C: 12 pulgadas
    D: 18 pulgadas
  answer: C
  explanation: La Guía del Conductor de Washington establece que cuando se estaciona
    junto a un bordillo, las ruedas deben estar a menos de 12 pulgadas del mismo.
- id: 76
  category: safe_driving_rules
  question: 'Al seguir a otro vehículo en Washington, debe bajar sus luces altas cuando
    se encuentre a menos de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Según la Guía del Conductor de Washington, debe usar sus luces bajas
    cuando siga a un vehículo a menos de 300 pies.
- id: 77
  category: safe_driving_rules
  question: En Washington, ¿con cuántos pies de antelación debe señalizar antes de
    girar o cambiar de carril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Washington exige que los conductores señalicen al menos 100
    pies antes de realizar un giro o un cambio de carril.
- id: 78
  category: safe_driving_rules
  question: Al estacionar en una colina en Washington con bordillo y mirando hacia
    arriba, ¿hacia qué lado debe girar el volante?
  choices:
    A: Hacia el bordillo
    B: Lejos del bordillo
    C: Mantener las ruedas rectas
    D: Hacia el centro de la carretera
  answer: B
  explanation: Al estacionar cuesta arriba con un bordillo, debe girar el volante
    en dirección opuesta al bordillo para que el vehículo ruede hacia el bordillo
    si fallan los frenos.
- id: 79
  category: safe_driving_rules
  question: 'En Washington, no es obligatorio detenerse ante un autobús escolar que
    viaja en la dirección opuesta si la calzada tiene:'
  choices:
    A: Dos carriles
    B: Un carril de giro en el medio
    C: Tres o más carriles de tráfico marcados
    D: Un límite de velocidad superior a 35 mph
  answer: C
  explanation: El RCW 46.61.370 establece que no es necesario detenerse ante un autobús
    escolar en la dirección opuesta si la carretera tiene tres o más carriles de tráfico
    marcados.
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada detrás del vehículo delante
    de usted a velocidades superiores a 30 mph en Washington?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: La Guía del Conductor de Washington recomienda una distancia de seguimiento
    de al menos cuatro segundos para velocidades superiores a 30 mph.
- id: 81
  category: safe_driving_rules
  question: 'Al entrar en una rotonda en Washington, debe ceder el derecho de paso
    a:'
  choices:
    A: El tráfico que entra por su derecha
    B: El tráfico que ya está en el círculo y viene por su izquierda
    C: A nadie; usted tiene el derecho de paso
    D: Solo a los peatones en la acera
  answer: B
  explanation: En una rotonda, debe ceder el paso al tráfico que ya se encuentra en
    el círculo circulando desde su izquierda.
- id: 82
  category: safe_driving_rules
  question: Según la ley 'Move Over' (hacerse a un lado) de Washington, ¿qué debe
    hacer al acercarse a un vehículo de emergencia con sirenas o luces intermitentes
    en una autopista con dos o más carriles en su dirección?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Cambiarse al carril izquierdo si es seguro hacerlo
    C: Acelerar para pasar rápidamente
    D: Mantener la velocidad y permanecer en su carril
  answer: B
  explanation: La ley Move Over de Washington exige que los conductores se muevan
    al carril izquierdo si hay dos o más carriles en la misma dirección, o que reduzcan
    la velocidad si no pueden cambiarse de carril.
- id: 83
  category: safe_driving_rules
  question: En Washington, ¿qué sucede con las multas de tráfico por infracciones
    de movimiento cometidas en una zona de obras designada?
  choices:
    A: Se exoneran para quienes cometen la infracción por primera vez
    B: Se reducen a la mitad
    C: Se duplican
    D: Siguen siendo las mismas que las multas estándar
  answer: C
  explanation: Según la Guía del Conductor de Washington, las multas de tráfico se
    duplican por las infracciones cometidas en zonas de obras viales.
- id: 84
  category: safe_driving_rules
  question: 'En Washington, debe ceder el derecho de paso a un autobús de tránsito
    cuando:'
  choices:
    A: El autobús está detenido en una parada de autobús designada
    B: El autobús ha señalizado y se está reincorporando al flujo del tráfico
    C: El autobús circula por el carril HOV
    D: El autobús está detrás de usted y parpadea sus luces altas
  answer: B
  explanation: La ley de Washington exige que los conductores cedan el paso a cualquier
    vehículo de tránsito (autobús) que haya señalizado y se esté reincorporando a
    la calzada.
- id: 85
  category: safe_driving_rules
  question: Al estacionar un vehículo en Washington, ¿a cuántas pulgadas deben estar
    los neumáticos del bordillo (curb) para que se considere legalmente estacionado?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 10 pulgadas
    C: A menos de 12 pulgadas
    D: A menos de 18 pulgadas
  answer: C
  explanation: La ley de Washington exige que un vehículo se estacione con sus ruedas
    paralelas y a no más de 12 pulgadas del bordillo.
- id: 86
  category: safe_driving_rules
  question: Al seguir a otro vehículo en Washington, ¿cuál es la distancia de seguimiento
    mínima recomendada para velocidades superiores a 30 mph en condiciones ideales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: C
  explanation: La Guía del Conductor de Washington recomienda una distancia de seguimiento
    de al menos cuatro segundos para permitir suficiente tiempo para reaccionar ante
    posibles peligros.
- id: 87
  category: safe_driving_rules
  question: Usted viaja por una autopista con tres o más carriles. Un autobús escolar
    que viene en sentido contrario está detenido con sus luces rojas intermitentes
    y la señal de pare extendida en el lado opuesto de la carretera. ¿Necesita detenerse?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar con luces rojas intermitentes.
    B: No, no es necesario detenerse si hay tres o más carriles de tráfico marcados.
    C: Sí, pero solo si no hay una mediana física.
    D: No, pero debe reducir la velocidad a 15 mph.
  answer: B
  explanation: En Washington, no es necesario detenerse ante un autobús escolar que
    viaja en la dirección opuesta si la calzada tiene tres o más carriles de tráfico
    marcados y está separada por una mediana o barrera física.
- id: 88
  category: safe_driving_rules
  question: Para conductores de 21 años o más en Washington, ¿cuál es el límite legal
    de concentración de THC (marihuana) en la sangre?
  choices:
    A: 1.00 nanogramos por mililitro
    B: 2.00 nanogramos por mililitro
    C: 5.00 nanogramos por mililitro
    D: Tolerancia cero
  answer: C
  explanation: En Washington, los adultos de 21 años o más pueden ser arrestados por
    DUI si su nivel de THC es de 5.00 nanogramos por mililitro de sangre o superior.
- id: 89
  category: safe_driving_rules
  question: Al adelantar a otro vehículo en una carretera de dos carriles en Washington,
    ¿debe regresar a su carril al menos a cuántos pies antes de encontrarse con un
    vehículo que viene en sentido contrario?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Según la Guía del Conductor de Washington, debe regresar a su carril
    derecho al menos 200 pies antes de estar dentro del alcance de un vehículo que
    viene en sentido contrario.
- id: 90
  category: safe_driving_rules
  question: 'En Washington, una bicicleta que se use de noche debe estar equipada
    con un faro delantero visible desde al menos:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 600 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Washington exige que las bicicletas que circulen de noche
    tengan una luz delantera blanca visible desde al menos 500 pies.
- id: 91
  category: defensive_driving
  question: Según la Guía del Conductor de Washington, ¿con cuánta antelación debe
    observar hacia adelante para estar preparado ante cualquier cosa que ocurra en
    la carretera?
  choices:
    A: 5 segundos
    B: 10 segundos
    C: 15 segundos
    D: 30 segundos
  answer: C
  explanation: La Guía del Conductor de Washington recomienda observar al menos 15
    segundos hacia adelante para ver los peligros con anticipación y evitar maniobras
    de último momento.
- id: 92
  category: defensive_driving
  question: En Washington, ¿a qué velocidad pueden sus neumáticos empezar a perder
    todo contacto con la carretera (hidroplaneo) durante una lluvia intensa?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 60 mph
  answer: C
  explanation: La Guía del Conductor de Washington establece que, en caso de lluvia
    intensa, los neumáticos pueden perder todo contacto con la carretera a velocidades
    tan bajas como 50 mph.
- id: 93
  category: defensive_driving
  question: Si está conduciendo en Washington y su vehículo comienza a hidroplanear,
    ¿cuál es la respuesta correcta de conducción defensiva?
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar el volante bruscamente
    C: Levantar el pie del pedal del acelerador
    D: Poner el coche en punto muerto (neutral)
  answer: C
  explanation: Si ocurre un hidroplaneo, debe levantar el pie del acelerador y mantener
    el volante recto. No intente detenerse ni girar hasta que los neumáticos vuelvan
    a agarrarse a la carretera.
- id: 94
  category: defensive_driving
  question: En Washington, al rebasar a una persona que va en bicicleta o a un peatón
    en el arcén (shoulder), ¿cuál es la distancia mínima que debe mantener si el límite
    de velocidad es de 35 mph o superior?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La norma RCW 46.61.110 exige que los conductores mantengan al menos
    tres pies de distancia al rebasar a una persona en bicicleta o a un peatón.
- id: 95
  category: defensive_driving
  question: ¿A cuántas pulgadas del bordillo (curb) como máximo debe estacionar cuando
    lo hace en una vía pública en Washington?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: La ley de Washington (RCW 46.61.575) exige que ambas ruedas del lado
    derecho de un vehículo estacionado estén paralelas y a menos de 12 pulgadas del
    bordillo.
- id: 96
  category: defensive_driving
  question: Al conducir con niebla en Washington, ¿qué ajuste de luces debe utilizar
    para mantener la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Sin luces
  answer: B
  explanation: La Guía del Conductor de Washington aconseja utilizar las luces bajas
    en condiciones de niebla porque las luces altas se reflejan en la niebla y provocan
    deslumbramiento, lo que dificulta la visión.
- id: 97
  category: defensive_driving
  question: En Washington, ¿cuál es el límite de velocidad estándar en una zona escolar
    cuando las luces están parpadeando o hay niños presentes?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: C
  explanation: La norma RCW 46.61.440 establece el límite de velocidad en zonas escolares
    o de juegos señalizadas en 20 mph.
- id: 98
  category: defensive_driving
  question: Según la ley de 'Zona de Emergencia' de Washington, ¿qué sucede con la
    multa por exceso de velocidad en un área donde hay vehículos de emergencia detenidos
    con sirenas o luces intermitentes?
  choices:
    A: La multa se exonera para los infractores por primera vez
    B: La multa se reduce a la mitad
    C: La multa se duplica
    D: La multa se triplica
  answer: C
  explanation: La norma RCW 46.61.212 establece que la sanción monetaria por una infracción
    de tráfico en una zona de emergencia (dentro de los 200 pies de un vehículo de
    emergencia estacionado) se duplica.
- id: 99
  category: defensive_driving
  question: Según la Guía del Conductor de Washington, ¿cuántos segundos de distancia
    de seguimiento debe mantener con respecto al vehículo que tiene delante a velocidades
    superiores a 30 mph?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: La Guía del Conductor de Washington recomienda una distancia de seguimiento
    de al menos cuatro segundos para velocidades superiores a 30 mph para permitir
    suficiente tiempo para reaccionar ante peligros.
- id: 100
  category: defensive_driving
  question: En el estado de Washington, para ser un conductor seguro, ¿cuántos segundos
    como mínimo debe observar el camino por delante de usted?
  choices:
    A: 5 segundos
    B: 10 segundos
    C: 15 segundos
    D: 20 segundos
  answer: C
  explanation: La ley de Washington y las pautas de seguridad establecen que debe
    mirar al menos 15 segundos hacia adelante para evitar frenar o girar en el último
    momento.
- id: 101
  category: defensive_driving
  question: Según la Guía del Conductor de Washington, ¿a qué velocidad pueden sus
    neumáticos comenzar a experimentar hidroplaneo (perder todo contacto con la carretera)
    bajo una lluvia intensa?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 60 mph
  answer: C
  explanation: La Guía del Conductor de Washington establece que, bajo una lluvia
    intensa, sus neumáticos pueden perder toda tracción con la carretera a velocidades
    tan bajas como 50 mph.
- id: 102
  category: defensive_driving
  question: Al estacionar cerca de un semáforo, una señal de alto (stop) o una señal
    de ceda el paso (yield) en Washington, ¿cuál es la distancia mínima requerida
    que debe mantener?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El RCW 46.61.570 establece que no se puede estacionar a menos de 30
    pies de cualquier señal intermitente, señal de alto, señal de ceda el paso o señal
    de control de tráfico ubicada al costado de una carretera.
- id: 103
  category: defensive_driving
  question: En Washington, ¿a cuántos pies de distancia como mínimo debe mantenerse
    al seguir a un camión de bomberos que responde a una alarma?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Según el RCW 46.61.635, es ilegal seguir a un equipo de bomberos que
    responde a una alarma de incendio a una distancia menor de 500 pies.
- id: 104
  category: defensive_driving
  question: Cuando un autobús escolar se detiene en una carretera con tres o más carriles
    de tráfico marcados y tiene sus luces rojas intermitentes, ¿qué conductores deben
    detenerse?
  choices:
    A: Todos los conductores en ambas direcciones
    B: Solo los conductores que viajan en la misma dirección que el autobús
    C: Solo los conductores en la dirección opuesta
    D: Nadie está obligado a detenerse si hay una mediana
  answer: B
  explanation: Según el RCW 46.61.370, si la carretera tiene tres o más carriles de
    tráfico marcados, los conductores que viajan en la dirección opuesta a un autobús
    escolar no necesitan detenerse. Solo deben detenerse aquellos que siguen al autobús.
- id: 105
  category: defensive_driving
  question: Según la ley de Washington, ¿cuál es el contenido máximo legal de alcohol
    en la sangre (BAC) para un conductor menor de 21 años?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Washington tiene una política de 'tolerancia cero' para menores; el
    límite legal para conductores menores de 21 años es de 0.02%.
- id: 106
  category: defensive_driving
  question: En Washington, debe encender sus faros delanteros desde ______ hasta ______.
  choices:
    A: El atardecer; El amanecer
    B: Una hora después del atardecer; Una hora antes del amanecer
    C: Media hora después del atardecer; Media hora antes del amanecer
    D: 6:00 PM; 6:00 AM
  answer: C
  explanation: El RCW 46.37.020 requiere que los faros se enciendan desde media hora
    después del atardecer hasta media hora antes del amanecer, o siempre que la visibilidad
    sea inferior a 1,000 pies.
- id: 107
  category: alcohol_drugs_health
  question: Para los conductores menores de 21 años en Washington, ¿cuál es el límite
    específico de BAC que resultará en la suspensión o revocación de la licencia?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Washington tiene una política de 'tolerancia cero' para menores; un
    BAC de 0.02% o superior para un conductor menor de 21 años es motivo de suspensión
    de la licencia.
- id: 108
  category: alcohol_drugs_health
  question: En Washington, un conductor de 21 años o más puede ser arrestado por DUI
    si su nivel de THC (marihuana) es igual o superior a ¿cuántos nanogramos por mililitro
    de sangre?
  choices:
    A: 1.00 nanogramos
    B: 2.00 nanogramos
    C: 5.00 nanogramos
    D: 10.00 nanogramos
  answer: C
  explanation: La ley de Washington establece el límite per se de THC en 5.00 nanogramos
    por mililitro de sangre para conductores de 21 años o más.
- id: 109
  category: alcohol_drugs_health
  question: El alcohol llega al cerebro poco después de ser consumido. Según el manual
    del conductor de Washington, ¿cuánto tiempo tarda normalmente el alcohol en llegar
    al cerebro?
  choices:
    A: De 5 a 10 minutos
    B: De 20 a 40 minutos
    C: De 60 a 90 minutos
    D: De 2 a 3 horas
  answer: B
  explanation: La Guía del Conductor de Washington establece que el alcohol se absorbe
    en el torrente sanguíneo y llega al cerebro en un lapso de 20 a 40 minutos.
- id: 110
  category: alcohol_drugs_health
  question: Si es condenado por un primer DUI en Washington, ¿por cuántos días como
    mínimo se suspenderá su licencia de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Una primera condena por DUI en Washington resulta en una suspensión
    obligatoria de la licencia de al menos 90 días.
- id: 111
  category: alcohol_drugs_health
  question: Según la Guía del Conductor de Washington, ¿cuánto tiempo pueden durar
    los efectos de la marihuana al conducir (como el tiempo de reacción lento)?
  choices:
    A: Hasta 1 hora
    B: Hasta 2 horas
    C: Hasta 5 horas
    D: Hasta 24 horas
  answer: C
  explanation: La Guía del Conductor de Washington señala que la marihuana puede afectar
    el desempeño al conducir hasta por cinco horas.
- id: 112
  category: alcohol_drugs_health
  question: En Washington, es ilegal beber alcohol o tener un recipiente abierto de
    alcohol en un vehículo motorizado en una carretera. ¿Cuál es el único lugar legal
    para guardar un recipiente abierto?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: En el maletero o en un área que no sea ocupada normalmente por los pasajeros
    D: En la consola central
  answer: C
  explanation: La Ley de Recipientes Abiertos de Washington exige que las bebidas
    alcohólicas abiertas se guarden en el maletero o en un área del vehículo no ocupada
    por el conductor o los pasajeros (si el vehículo no tiene maletero).
- id: 113
  category: alcohol_drugs_health
  question: ¿Al consumir marihuana en forma comestible (como galletas o caramelos),
    cuánto tiempo podría tardar el conductor en sentir los efectos?
  choices:
    A: Inmediatamente
    B: De 5 a 10 minutos
    C: Hasta 2 horas
    D: Al menos 4 horas
  answer: C
  explanation: Debido a que los comestibles deben ser digeridos, la Guía del Conductor
    de Washington advierte que los efectos pueden tardar hasta dos horas en sentirse.
- id: 114
  category: alcohol_drugs_health
  question: 'Si es arrestado por DUI en Washington y es su primera infracción, es
    posible que se le exija la instalación de un dispositivo de interbloqueo de encendido
    (IID) durante al menos:'
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: La ley de Washington generalmente exige que quien comete una infracción
    de DUI por primera vez instale un dispositivo de interbloqueo de encendido por
    un período de un año.
- id: 115
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de mezclar alcohol con otra droga, como un remedio
    para el resfriado o un medicamento recetado?
  choices:
    A: Los efectos del alcohol se anulan
    B: Los efectos de la droga se anulan
    C: No tiene ningún efecto en la capacidad de conducción
    D: Puede multiplicar los efectos de ambos, aumentando significativamente el deterioro
  answer: D
  explanation: La Guía del Conductor de Washington explica que mezclar alcohol y drogas
    a menudo causa un efecto sinérgico, lo que significa que el impacto combinado
    es mucho mayor que el de cualquiera de las sustancias por separado.
- id: 116
  category: alcohol_drugs_health
  question: Para aprobar el examen de la vista en Washington, ¿qué agudeza visual
    debe tener como mínimo en al menos un ojo (con o sin lentes correctivos)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: El estado de Washington exige que los conductores tengan una visión
    de al menos 20/40 en al menos un ojo para calificar para una licencia de conducir.
- id: 117
  category: alcohol_drugs_health
  question: Después de que termine una suspensión de la licencia relacionada con un
    DUI, ¿por cuántos años se le expedirá a un conductor de Washington una 'licencia
    probatoria'?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 10 años
  answer: C
  explanation: Tras una condena por DUI y la restitución de la licencia, Washington
    exige que el conductor mantenga una licencia probatoria durante cinco años.
- id: 118
  category: alcohol_drugs_health
  question: Según la Guía del Conductor de Washington, ¿cuántas bebidas se necesitan
    normalmente para que el alcohol comience a afectar su conducción?
  choices:
    A: Una bebida
    B: Dos bebidas
    C: Tres bebidas
    D: Cuando alcanza un 0.08 de BAC
  answer: A
  explanation: El manual enfatiza que el alcohol comienza a afectar su juicio y coordinación
    desde la primera bebida.
- id: 119
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado y un médico no le ha dicho si
    afectará su conducción, ¿qué debe hacer antes de conducir en Washington?
  choices:
    A: Conducir solo durante las horas del día
    B: Revisar la etiqueta o preguntar a un farmacéutico sobre los efectos secundarios
    C: Conducir solo si se siente bien
    D: Beber café para mantenerse alerta mientras toma el medicamento
  answer: B
  explanation: La ley de Washington responsabiliza a los conductores por el deterioro
    causado por cualquier droga. Debe revisar las etiquetas o consultar a un profesional
    para asegurarse de que un medicamento no afecte su capacidad para conducir.
- id: 120
  category: alcohol_drugs_health
  question: 'Si un conductor es condenado por un primer DUI en Washington y su contenido
    de alcohol en la sangre (BAC) era inferior a 0.15, su licencia será suspendida
    por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Para una primera condena por DUI con un BAC inferior a 0.15, el Departamento
    de Licencias de Washington suspenderá la licencia del conductor por 90 días.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única manera de reducir su contenido de
    alcohol en la sangre (BAC) y 'recuperar la sobriedad' antes de conducir?
  choices:
    A: Beber café negro cargado
    B: Tomar una ducha fría
    C: Hacer ejercicio o correr
    D: Permitir que pase el tiempo para que el cuerpo procese el alcohol
  answer: D
  explanation: La Guía del Conductor de Washington enfatiza que solo el tiempo permite
    que el cuerpo procese y elimine el alcohol del sistema; el café, la comida y las
    duchas no reducen el BAC.
- id: 122
  category: alcohol_drugs_health
  question: Al consumir alcohol, ¿cuál de los siguientes se ve afectado típicamente
    primero?
  choices:
    A: La coordinación muscular
    B: El juicio y el razonamiento
    C: La visión y la audición
    D: El equilibrio y el habla
  answer: B
  explanation: El alcohol afecta la capacidad del cerebro para tomar decisiones y
    ejercer un buen juicio mucho antes de que afecte la coordinación física.
- id: 123
  category: alcohol_drugs_health
  question: ¿Por cuánto tiempo, como mínimo, se requiere que una persona condenada
    por un DUI en Washington tenga instalado un dispositivo de bloqueo de encendido
    (IID) por una primera infracción?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 5 años
  answer: C
  explanation: La ley de Washington exige que un infractor de DUI por primera vez
    instale un dispositivo de bloqueo de encendido (IID) por al menos un año.
- id: 124
  category: alcohol_drugs_health
  question: Si un conductor de Washington es arrestado por DUI mientras un pasajero
    menor de 16 años está en el vehículo, ¿qué sanción adicional se aplica?
  choices:
    A: El vehículo del conductor es desguazado inmediatamente
    B: El conductor enfrenta requisitos adicionales de bloqueo de encendido y posibles
      multas
    C: La licencia del conductor es revocada de por vida
    D: No hay sanciones adicionales por los pasajeros
  answer: B
  explanation: La ley de Washington impone sanciones mayores por DUI con un pasajero
    menor de 16 años, incluyendo 6 meses adicionales de requisito de dispositivo de
    bloqueo de encendido (IID) y multas más altas.
- id: 125
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado y este afecta su capacidad para
    conducir, ¿puede ser arrestado por DUI en Washington?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, el DUI solo se aplica a drogas ilegales y alcohol
    C: Sí, es ilegal conducir bajo los efectos de cualquier droga que afecte su capacidad
    D: Solo si el medicamento es un narcótico
  answer: C
  explanation: Las leyes de DUI de Washington se aplican a cualquier sustancia que
    afecte su capacidad para conducir, incluidos los medicamentos recetados y los
    de venta libre.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cómo afecta específicamente el consumo de alcohol la visión de un conductor?
  choices:
    A: Mejora la visión nocturna
    B: Reduce la visión periférica (lateral)
    C: Hace que los colores parezcan más vivos
    D: No tiene ningún efecto en la visión
  answer: B
  explanation: El alcohol causa 'visión de túnel' al reducir la visión periférica,
    lo que dificulta que los conductores vean los peligros que vienen de los lados.
- id: 127
  category: alcohol_drugs_health
  question: Si tiene una condición médica como epilepsia o diabetes que podría afectar
    su conducción, ¿cuál es su responsabilidad en Washington?
  choices:
    A: No debe volver a conducir nunca más
    B: Debe notificar al Departamento de Licencias (DOL)
    C: Solo necesita decírselo a su compañía de seguros
    D: No necesita hacer nada si se siente bien
  answer: B
  explanation: La ley de Washington exige que los conductores informen al DOL sobre
    cualquier condición física o mental que pueda afectar su capacidad para operar
    un vehículo motorizado de manera segura.
- id: 128
  category: alcohol_drugs_health
  question: 'Según la Guía del Conductor de Washington, se ha demostrado que la marihuana:'
  choices:
    A: Mejora la concentración en la carretera
    B: Disminuye el tiempo de reacción
    C: Aumenta el tiempo de reacción
    D: No tiene efecto en el desempeño al conducir
  answer: C
  explanation: El uso de marihuana aumenta el tiempo de reacción y afecta la capacidad
    del conductor para estimar la distancia y la velocidad.
- id: 129
  category: alcohol_drugs_health
  question: En términos de contenido de alcohol, ¿cuál de los siguientes contiene
    la mayor cantidad de alcohol?
  choices:
    A: 12 onzas de cerveza al 5%
    B: 5 onzas de vino al 12%
    C: 1.5 onzas de licor de 80 grados (80-proof)
    D: Todos contienen aproximadamente la misma cantidad de alcohol
  answer: D
  explanation: Una bebida estándar se define como 12 oz de cerveza, 5 oz de vino o
    1.5 oz de licor de 80 grados; cada una contiene aproximadamente 0.6 onzas de alcohol
    puro.
- id: 130
  category: penalties_and_points
  question: ¿En Washington, cuál es la multa estándar por una primera infracción por
    usar un dispositivo electrónico personal portátil (E-PIC) mientras conduce?
  choices:
    A: $50
    B: $101
    C: $136
    D: $250
  answer: C
  explanation: La primera infracción de la ley de Washington sobre 'Conducir mientras
    se usa un dispositivo electrónico personal' resulta en una multa estándar de $136.
- id: 131
  category: penalties_and_points
  question: 'Si un conductor de Washington recibe una segunda citación por conducción
    distraída (E-PIC) en un plazo de cinco años, la multa aumenta a aproximadamente:'
  choices:
    A: $150
    B: $234
    C: $500
    D: $1,000
  answer: B
  explanation: Para una segunda o subsiguiente infracción por conducción distraída
    en un plazo de cinco años en Washington, la multa aumenta a al menos $234.
- id: 132
  category: penalties_and_points
  question: En Washington, si es condenado por un DUI, se le requerirá tener una 'licencia
    probatoria' (probationary license) por ¿cuántos años?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: 10 años
  answer: C
  explanation: Después de una suspensión o revocación relacionada con un DUI, Washington
    requiere que el conductor mantenga una licencia probatoria durante 5 años.
- id: 133
  category: penalties_and_points
  question: Bajo la ley de 'Zona de Emergencia' de Washington, las multas por exceso
    de velocidad se ______ cuando la infracción ocurre en una zona donde hay vehículos
    de emergencia presentes con las luces intermitentes.
  choices:
    A: Triplican
    B: Duplican
    C: Aumentan en $100
    D: Eximen para infractores por primera vez
  answer: B
  explanation: Las multas por infracciones de tránsito se duplican en Washington cuando
    ocurren en una zona de emergencia (los 200 pies antes y después de un vehículo
    de emergencia estacionario con luces).
- id: 134
  category: penalties_and_points
  question: La 'Ley de Contenedor Abierto' de Washington prohíbe la posesión de un
    contenedor de bebida alcohólica abierto en el compartimiento de pasajeros de un
    vehículo. ¿Dónde debe guardarse un contenedor abierto para cumplir con la ley?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: En el maletero
    D: En un portavasos con tapa
  answer: C
  explanation: Los contenedores abiertos de alcohol deben mantenerse en el maletero
    o en un área del vehículo que no esté ocupada normalmente por el conductor o los
    pasajeros si el vehículo no tiene maletero.
- id: 135
  category: penalties_and_points
  question: En Washington, el Departamento de Licencias (DOL) enviará una carta de
    advertencia a un conductor que acumule ¿cuántas infracciones de tránsito en movimiento
    en un período de 12 meses?
  choices:
    A: '1'
    B: '2'
    C: '4'
    D: '6'
  answer: B
  explanation: El programa de suspensión discrecional de Washington activa una carta
    de advertencia después de que se cometen 2 infracciones de tránsito en movimiento
    en un período de 12 meses.
- id: 136
  category: penalties_and_points
  question: La licencia de conducir de Washington será suspendida por 60 días si se
    acumulan ____ infracciones de tránsito en movimiento en un período de 12 meses.
  choices:
    A: '3'
    B: '4'
    C: '6'
    D: '10'
  answer: C
  explanation: Acumular 6 infracciones de tránsito en movimiento en un período de
    12 meses resulta en una suspensión de la licencia de 60 días en Washington.
- id: 137
  category: penalties_and_points
  question: ¿En Washington, cuál es la multa por estacionarse en un espacio reservado
    para personas con discapacidades sin el cartel (placard) o la placa de matrícula
    adecuada?
  choices:
    A: $100
    B: $250
    C: $450
    D: $1,000
  answer: C
  explanation: La multa estándar por estacionamiento no autorizado en un espacio para
    personas con discapacidades en Washington es de $450.
- id: 138
  category: penalties_and_points
  question: 'Si un conductor de Washington es condenado por un DUI por primera vez,
    generalmente se le requiere instalar un Dispositivo de Bloqueo de Encendido (IID)
    por al menos:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 3 años
  answer: C
  explanation: Para una primera condena por DUI en Washington, el conductor generalmente
    debe instalar y usar un IID durante al menos un año.
- id: 139
  category: penalties_and_points
  question: En Washington, si no cumple con una citación de tránsito (como no pagar
    una multa o no comparecer ante el tribunal), el DOL suspenderá su licencia después
    de ¿cuántos días?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: A
  explanation: Si no cumple con un aviso de una infracción de tránsito en un plazo
    de 15 días, el tribunal notifica al DOL, que luego iniciará el proceso de suspensión
    de la licencia.
- id: 140
  category: penalties_and_points
  question: 'En Washington, una persona menor de 21 años puede ser arrestada por conducir
    bajo la influencia (DUI) si su contenido de alcohol en el aliento (BAC) es igual
    o superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Washington tiene una política de 'tolerancia cero' para menores. Los
    conductores menores de 21 años pueden ser arrestados por DUI con un BAC de 0.02%
    o superior.
- id: 141
  category: penalties_and_points
  question: Según la ley de Washington, un conductor es clasificado como un 'Infractor
    de Tránsito Habitual' si acumula ¿cuántas infracciones de tránsito 'graves' (como
    DUI o conducción temeraria) en un período de cinco años?
  choices:
    A: '2'
    B: '3'
    C: '5'
    D: '7'
  answer: B
  explanation: Según el RCW 46.65.020, un Infractor de Tránsito Habitual es alguien
    que acumula 3 o más infracciones graves o 20 o más infracciones de movimiento
    en un período de 5 años.
- id: 142
  category: penalties_and_points
  question: 'Para una primera condena por DUI en Washington con un nivel de BAC inferior
    a 0.15, el período de suspensión obligatoria de la licencia de conducir es de:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Una primera condena por DUI para un adulto con un BAC inferior a 0.15
    resulta en una suspensión obligatoria de la licencia por 90 días.
- id: 143
  category: penalties_and_points
  question: Según la ley de envases abiertos de Washington, ¿dónde es legal llevar
    un envase de alcohol abierto en un vehículo?
  choices:
    A: En la guantera
    B: En la consola central
    C: Debajo del asiento del conductor
    D: En el maletero
  answer: D
  explanation: Los envases de alcohol abiertos deben guardarse en el maletero o en
    un área del vehículo que no esté ocupada normalmente por el conductor o los pasajeros
    si el vehículo no tiene maletero. Es específicamente ilegal guardarlos en la guantera.
- id: 144
  category: penalties_and_points
  question: 'Para restablecer una licencia de conducir de Washington después de una
    suspensión no relacionada con el alcohol, el conductor debe pagar una tarifa de:'
  choices:
    A: $25
    B: $50
    C: $75
    D: $150
  answer: C
  explanation: La tarifa estándar de restablecimiento para una suspensión no relacionada
    con el alcohol en Washington es de $75. Los restablecimientos relacionados con
    el alcohol suelen costar $150.
- id: 145
  category: penalties_and_points
  question: 'En Washington, un adulto (mayor de 21 años) puede ser arrestado por DUI
    si su nivel de THC (marihuana) en la sangre es igual o superior a:'
  choices:
    A: 1.00 nanogramos por mililitro
    B: 2.00 nanogramos por mililitro
    C: 5.00 nanogramos por mililitro
    D: 8.00 nanogramos por mililitro
  answer: C
  explanation: Para conductores de 21 años o más, el límite legal de THC en Washington
    es de 5.00 nanogramos por mililitro de sangre.
- id: 146
  category: penalties_and_points
  question: ¿Qué tipo de licencia restringida permite a un conductor de Washington
    operar un vehículo mientras su licencia está suspendida por una infracción relacionada
    con drogas o alcohol?
  choices:
    A: Licencia de Conducir Restringida por Ocupación (ORL)
    B: Licencia de Dispositivo de Bloqueo de Encendido (IIL)
    C: Licencia de Conducir Comercial (CDL)
    D: Licencia de Conducir Intermedia (IDL)
  answer: B
  explanation: La Licencia de Dispositivo de Bloqueo de Encendido (IIL) permite específicamente
    a los conductores con suspensiones relacionadas con el alcohol o las drogas conducir
    vehículos equipados con un dispositivo de bloqueo de encendido.
- id: 147
  category: penalties_and_points
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la multa
    por no detenerse ante un autobús escolar con sus luces rojas parpadeando y la
    señal de alto extendida en Washington?
  choices:
    A: La multa puede ser reducida por un juez si es la primera infracción
    B: La multa puede ser exonerada si asiste a una escuela de tránsito
    C: La multa no puede ser reducida, exonerada ni suspendida
    D: La multa es de solo $50
  answer: C
  explanation: La ley de Washington (RCW 46.61.370) estipula que la multa por rebasar
    un autobús escolar detenido (aproximadamente $419) no puede ser reducida, exonerada
    ni suspendida.
- id: 148
  category: penalties_and_points
  question: Si un conductor adulto en Washington recibe ¿cuántas infracciones de movimiento
    en un período de 12 meses, será puesto en un período de prueba de un año?
  choices:
    A: '3'
    B: '4'
    C: '6'
    D: '8'
  answer: C
  explanation: El Departamento de Licencias de Washington pondrá a un conductor en
    período de prueba por un año si acumula 6 infracciones de movimiento en un período
    de 12 meses.
- id: 149
  category: sharing_the_road
  question: Al rebasar una bicicleta en Washington en una carretera de dos carriles
    y un límite de velocidad de 35 mph o superior, ¿qué debe hacer el conductor?
  choices:
    A: Tocar la bocina para alertar al ciclista y mantener la velocidad.
    B: Rebasar con al menos 2 pies de distancia.
    C: Cambiarse al carril izquierdo para rebasar si es seguro hacerlo.
    D: Esperar hasta que el ciclista le haga una señal para pasar.
  answer: C
  explanation: Según el RCW 46.61.110, en una carretera de dos carriles y un límite
    de velocidad de 35 mph o superior, el conductor debe cambiarse al carril izquierdo
    para rebasar a un ciclista. Si no es posible, debe dejar al menos 3 pies de distancia.
- id: 150
  category: sharing_the_road
  question: Según la ley de 'Hacerse a un lado' (Move Over) de Washington, ¿cuál es
    la sanción por no cambiarse de carril o no reducir la velocidad ante un vehículo
    de emergencia con sus luces intermitentes encendidas?
  choices:
    A: Una multa fija de $500.
    B: Una suspensión obligatoria de la licencia por 30 días.
    C: La multa monetaria se duplica.
    D: Servicio comunitario y una advertencia.
  answer: C
  explanation: El RCW 46.61.212 establece que la sanción monetaria por una infracción
    de tránsito en una zona de emergencia (dentro de los 200 pies de un vehículo de
    emergencia estacionado) se duplica.
- id: 151
  category: sharing_the_road
  question: ¿Cuál es la distancia de seguimiento recomendada al viajar detrás de una
    motocicleta en el estado de Washington?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: La Guía del Conductor de Washington recomienda una distancia de seguimiento
    de al menos 4 segundos detrás de las motocicletas porque estas pueden detenerse
    mucho más rápido que otros vehículos.
- id: 152
  category: sharing_the_road
  question: En Washington, ¿cuándo debe un conductor detenerse ante un peatón en un
    cruce de peatones no pintado?
  choices:
    A: Solo si el peatón está directamente frente al automóvil.
    B: Cuando el peatón se encuentra a menos de un carril de la mitad de la calzada
      del conductor.
    C: Solo si el peatón lleva un bastón blanco.
    D: Solo si el conductor está girando a la derecha.
  answer: B
  explanation: La ley de Washington exige que los conductores se detengan ante los
    peatones si estos se encuentran en la mitad de la calzada del conductor o a menos
    de un carril de la mitad de la calzada del conductor.
- id: 153
  category: sharing_the_road
  question: 'Los camiones comerciales grandes tienen puntos ciegos donde el conductor
    no puede verlo. Estos se conocen comúnmente como:'
  choices:
    A: Zonas de Peligro (Danger Zones)
    B: Zonas No (No-Zones)
    C: Puntos de Visibilidad Cero (Zero-Visibility Spots)
    D: Brechas de Camión (Truck Gaps)
  answer: B
  explanation: La Guía del Conductor de Washington se refiere a los grandes puntos
    ciegos alrededor de la parte delantera, trasera y laterales de los camiones comerciales
    como 'No-Zones'.
- id: 154
  category: sharing_the_road
  question: En Washington, ¿un vehículo de movimiento lento debe salirse de la calzada
    en un apartadero (turnout) seguro cuando tiene cuántos vehículos siguiéndolo detrás?
  choices:
    A: 3 o más
    B: 5 o más
    C: 10 o más
    D: Solo si el límite de velocidad es superior a 50 mph.
  answer: B
  explanation: El RCW 46.61.427 requiere que los vehículos de movimiento lento se
    salgan de la calzada en un apartadero seguro si hay 5 o más vehículos siguiéndolos
    en fila.
- id: 155
  category: sharing_the_road
  question: Según la ley de Washington, ¿cuál de las siguientes afirmaciones es verdadera
    con respecto a las motocicletas que comparten un carril?
  choices:
    A: A las motocicletas nunca se les permite compartir un carril.
    B: Una motocicleta puede compartir un carril con un automóvil.
    C: Dos motocicletas pueden circular una al lado de la otra en un solo carril.
    D: Las motocicletas solo pueden compartir un carril al adelantar.
  answer: C
  explanation: El RCW 46.61.608 permite que dos motocicletas operen en paralelo (una
    al lado de la otra) en un solo carril, pero prohíbe que las motocicletas compartan
    un carril con un automóvil o que realicen 'lane splitting' (división de carril)
    entre filas de automóviles.
- id: 156
  category: sharing_the_road
  question: En una carretera de dos carriles (un carril en cada dirección), cuando
    un autobús escolar se detiene con las luces rojas intermitentes y la señal de
    alto (stop paddle) extendida, ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús.
    B: Solo el tráfico que viene de frente al autobús.
    C: El tráfico en ambas direcciones.
    D: Nadie, a menos que haya niños cruzando en ese momento.
  answer: C
  explanation: En una calzada de dos carriles donde solo hay un carril de tráfico
    en cada dirección, todo el tráfico de ambas direcciones debe detenerse ante un
    autobús escolar con sus luces rojas intermitentes y la señal de alto extendida.
- id: 157
  category: sharing_the_road
  question: Una 'Zona de Emergencia' en Washington se define como los carriles adyacentes
    de la calzada dentro de ¿cuántos pies de un vehículo de emergencia estacionario
    con sirenas o luces intermitentes?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: El RCW 46.61.212 define una zona de emergencia como el área de 200
    pies antes y después de un vehículo de emergencia estacionario con luces intermitentes.
- id: 158
  category: sharing_the_road
  question: En el estado de Washington, una persona que monta en bicicleta puede tratar
    una señal de alto como una señal de ceder el paso, siempre que reduzca la velocidad
    y ceda el paso al tráfico. Esto se conoce como 'Parada de Seguridad' (Safety Stop).
    ¿Cuándo NO está permitido esto?
  choices:
    A: En todas las señales de alto.
    B: En las señales de alto de los autobuses escolares o en los cruces ferroviarios.
    C: Durante las horas nocturnas.
    D: Al circular por una acera.
  answer: B
  explanation: El RCW 46.61.190 permite a los ciclistas tratar las señales de alto
    como ceder el paso, pero aún deben detenerse por completo ante las señales de
    alto en los autobuses escolares y en los cruces ferroviarios.
- id: 159
  category: sharing_the_road
  question: En Washington, ¿a cuántos pies debe mantenerse detrás de un vehículo de
    emergencia (como un camión de bomberos) que está respondiendo a una alarma?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El RCW 46.61.635 prohíbe a los conductores seguir a un camión de bomberos
    a menos de 500 pies o conducir o estacionar dentro de la cuadra donde el camión
    de bomberos se ha detenido en respuesta a una alarma de incendio.
- id: 160
  category: sharing_the_road
  question: 'Cuando un camión grande está girando a la derecha en una calle con dos
    carriles en cada dirección, el camión puede necesitar:'
  choices:
    A: Permanecer completamente en el carril derecho.
    B: Abrirse hacia la izquierda antes de girar.
    C: Acelerar para despejar la intersección.
    D: Girar únicamente desde el carril izquierdo.
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha sin que las ruedas traseras golpeen el bordillo
    u otros objetos.
- id: 161
  category: sharing_the_road
  question: 'Al rebasar a un "usuario vulnerable" (como un peatón o ciclista) en una
    carretera con tres o más carriles, la ley de Washington le exige:'
  choices:
    A: Permanecer en su carril y reducir la velocidad a 15 mph.
    B: Cambiarse a un carril que no sea adyacente al usuario vulnerable.
    C: Tocar la bocina dos veces antes de rebasar.
    D: Esperar a que el usuario salga completamente de la carretera.
  answer: B
  explanation: El RCW 46.61.110 exige que, en una carretera con dos o más carriles
    en la misma dirección, el conductor debe cambiarse a un carril que no sea adyacente
    al usuario vulnerable si es seguro hacerlo.
- id: 162
  category: sharing_the_road
  question: 'En el estado de Washington, en una carretera con tres o más carriles
    de tráfico marcados, usted debe detenerse ante un autobús escolar con luces rojas
    intermitentes y la señal de pare extendida solo si:'
  choices:
    A: Viaja en la dirección opuesta al autobús.
    B: Viaja en la misma dirección que el autobús.
    C: El autobús está detenido en una intersección.
    D: Hay más de cinco vehículos detrás del autobús.
  answer: B
  explanation: Según la ley de Washington (RCW 46.61.370), en carreteras con tres
    o más carriles de tráfico marcados, los conductores que viajan en la dirección
    opuesta no necesitan detenerse ante un autobús escolar. Sin embargo, los conductores
    que viajan en la misma dirección que el autobús siempre deben detenerse.
- id: 163
  category: sharing_the_road
  question: Bajo la ley de "Parada de Seguridad" (Safety Stop) de Washington, ¿cómo
    se les permite a los ciclistas tratar las señales de pare cuando no hay otro tráfico
    presente?
  choices:
    A: Como una luz verde
    B: Como una señal de ceda el paso
    C: Como una parada obligatoria de 3 segundos
    D: Como una luz de precaución
  answer: B
  explanation: A partir de 2020, la ley de Washington (RCW 46.61.190) permite a los
    ciclistas tratar las señales de pare como señales de ceda el paso, siempre que
    reduzcan la velocidad y cedan el paso a cualquier tráfico o peatón que ya se encuentre
    en la intersección.
- id: 164
  category: sharing_the_road
  question: 'En Washington, si se aproxima a un vehículo de emergencia estacionado
    con luces intermitentes en una autopista con al menos dos carriles en su dirección,
    usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril.
    B: Cambiarse al carril izquierdo si es seguro hacerlo.
    C: Mantener su velocidad y permanecer en su carril.
    D: Acelerar para rebasar el vehículo rápidamente.
  answer: B
  explanation: La "Ley de hacerse a un lado" (Move Over Law) de Washington (RCW 46.61.212)
    exige que los conductores se cambien al carril izquierdo si es seguro. Si no es
    posible cambiarse de carril, el conductor debe reducir la velocidad a al menos
    10 mph por debajo del límite establecido.
- id: 165
  category: sharing_the_road
  question: 'En Washington, cuando un peatón está esperando en un paso de peatones
    que no está marcado con pintura, usted debe:'
  choices:
    A: Continuar conduciendo porque es un paso de peatones no marcado.
    B: Detenerse y ceder el derecho de paso al peatón.
    C: Tocar la bocina para advertir al peatón que no se va a detener.
    D: Solo detenerse si el peatón es un niño o un anciano.
  answer: B
  explanation: En Washington, cada intersección se considera un paso de peatones legal,
    ya sea que esté marcado o no. Los conductores deben detenerse ante los peatones
    en todas las intersecciones.
- id: 166
  category: sharing_the_road
  question: Al seguir a un camión comercial grande, ¿cuál es la mejor manera de asegurarse
    de que no se encuentra en la "Zona No-Zone" del conductor?
  choices:
    A: Si puede ver el parachoques delantero del camión en su espejo retrovisor.
    B: Si puede ver los espejos laterales del camión.
    C: Si se encuentra al menos a 10 pies detrás del remolque.
    D: Si puede ver la cara del conductor en su espejo lateral.
  answer: B
  explanation: La "Zona No-Zone" representa los puntos ciegos alrededor de un camión.
    Si no puede ver los espejos laterales del conductor del camión, el conductor no
    puede verlo a usted.
- id: 167
  category: sharing_the_road
  question: ¿Cuál es la distancia de seguimiento recomendada detrás de una motocicleta
    en el estado de Washington para tener en cuenta su menor distancia de frenado
    y posibles peligros?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: La Guía del Conductor de Washington recomienda una distancia de seguimiento
    de al menos 4 segundos detrás de las motocicletas porque pueden detenerse mucho
    más rápido que los autos y pueden necesitar virar bruscamente para evitar peligros
    como baches o grava.
- id: 168
  category: sharing_the_road
  question: En Washington, si conduce un vehículo de movimiento lento y tiene cuántos
    vehículos siguiéndolo detrás, ¿debe hacerse a un lado y dejarlos pasar?
  choices:
    A: 3 o más
    B: 5 o más
    C: 7 o más
    D: 10 o más
  answer: B
  explanation: Según el RCW 46.61.427, si conduce un vehículo de movimiento lento
    en una carretera de dos carriles donde rebasar no es seguro, y se forma una fila
    de 5 o más vehículos detrás de usted, debe hacerse a un lado en el próximo apartadero
    seguro para dejarlos pasar.
- id: 169
  category: sharing_the_road
  question: 'Usted viaja por una autopista dividida por una barrera física (como una
    mediana o un muro). Un autobús escolar está detenido en el lado opuesto de la
    barrera con las luces rojas intermitentes. Usted debe:'
  choices:
    A: Detenerse y esperar a que las luces dejen de parpadear.
    B: Reducir la velocidad a 15 mph y proceder con precaución.
    C: Continuar conduciendo; no es necesario detenerse.
    D: Detenerse solo si hay niños cruzando la barrera.
  answer: C
  explanation: Según el RCW 46.61.370, los conductores no necesitan detenerse ante
    un autobús escolar si el autobús se encuentra al otro lado de una autopista dividida
    con una barrera física o una mediana sin pavimentar.
- id: 170
  category: sharing_the_road
  question: En Washington, es ilegal seguir a menos de ____ pies de distancia a un
    camión de bomberos que responde a una alarma de incendio.
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El RCW 46.61.635 establece que es ilegal seguir a un camión de bomberos
    a una distancia menor de 500 pies o conducir o estacionarse dentro de la cuadra
    donde el camión de bomberos se ha detenido en respuesta a una alarma de incendio.
- id: 171
  category: sharing_the_road
  question: 'Cuando vea a un peatón con un bastón blanco o un perro guía en Washington,
    usted debe:'
  choices:
    A: Tocar la bocina para hacerles saber que usted está allí.
    B: Cederles el paso y detener su vehículo.
    C: Rodearlos lentamente con el vehículo.
    D: Esperar a que le hagan una señal para pasar.
  answer: B
  explanation: La ley de Washington exige que los conductores tomen precauciones adicionales
    y cedan el paso a los peatones ciegos que utilicen un bastón blanco o un perro
    guía. Usted debe detenerse por completo para garantizar la seguridad de ellos.
- id: 172
  category: sharing_the_road
  question: 'En Washington, al circular en bicicleta por una acera o en un cruce peatonal,
    un ciclista:'
  choices:
    A: Tiene los mismos derechos y deberes que un peatón.
    B: Debe ceder siempre el paso a los vehículos motorizados.
    C: Debe mantener una velocidad de al menos 10 mph.
    D: Está cometiendo una infracción de tránsito.
  answer: A
  explanation: En Washington, generalmente se permite a los ciclistas circular por
    las aceras, a menos que las ordenanzas locales lo prohíban. Al hacerlo, tienen
    los mismos derechos y responsabilidades que los peatones, pero deben ceder el
    paso a los peatones que ya se encuentren en la acera.
- id: 173
  category: vehicle_information
  question: En el estado de Washington, ¿cuál es la profundidad mínima legal de la
    banda de rodadura de los neumáticos de un vehículo de pasajeros?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/16 de pulgada
  answer: B
  explanation: Según la ley de Washington (RCW 46.37.425), es ilegal operar un vehículo
    con neumáticos que tengan menos de 2/32 de pulgada de profundidad en la banda
    de rodadura.
- id: 174
  category: vehicle_information
  question: Según la Guía del Conductor de Washington, ¿cuándo debe encender las luces
    delanteras?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes del amanecer
    B: Solo cuando esté lloviendo o nevando
    C: Desde media hora después de la puesta del sol hasta media hora antes del amanecer
    D: Solo cuando no pueda ver a más de 500 pies de distancia
  answer: C
  explanation: La ley de Washington exige que las luces delanteras se enciendan desde
    media hora después de la puesta del sol hasta media hora antes del amanecer, y
    en cualquier otro momento en que la visibilidad sea baja.
- id: 175
  category: vehicle_information
  question: En el estado de Washington, ¿en qué período de tiempo es legal el uso
    de neumáticos con clavos?
  choices:
    A: Del 1 de octubre al 30 de abril
    B: Del 1 de noviembre al 31 de marzo
    C: Del 1 de diciembre al 28 de febrero
    D: Del 15 de noviembre al 1 de abril
  answer: B
  explanation: Los neumáticos con clavos son legales en Washington solo del 1 de noviembre
    al 31 de marzo. Usarlos fuera de estas fechas puede resultar en una multa.
- id: 176
  category: vehicle_information
  question: La ley de Washington exige que el espejo retrovisor proporcione una visión
    de la carretera de al menos ¿cuántos pies hacia la parte trasera del vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Según el RCW 46.37.400, todos los vehículos deben tener un espejo que
    permita al conductor ver al menos 200 pies hacia la parte trasera.
- id: 177
  category: vehicle_information
  question: En Washington, ¿cuál es el nivel máximo legal de polarizado de ventanas
    permitido en las ventanas laterales delanteras?
  choices:
    A: Debe permitir el paso de más del 35% de la luz
    B: Debe permitir el paso de más del 24% de la luz
    C: Debe permitir el paso de más del 50% de la luz
    D: No se permite ningún tipo de polarizado en las ventanas laterales delanteras
  answer: B
  explanation: La ley del estado de Washington (RCW 46.37.430) especifica que el polarizado
    de las ventanas debe permitir el paso de al menos el 24% de la luz.
- id: 178
  category: vehicle_information
  question: En Washington, si una carga se extiende más de ____ pies más allá de la
    parte trasera del centro del último eje de un vehículo, se debe mostrar una bandera
    o tela roja.
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: Según el RCW 46.37.140, si una carga se extiende 4 pies o más allá
    de la parte trasera del vehículo, debe marcarse con una bandera fluorescente roja
    o naranja durante el día.
- id: 179
  category: vehicle_information
  question: 'En Washington, todo vehículo motorizado debe estar equipado con una bocina
    que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El RCW 46.37.380 exige una bocina audible bajo condiciones normales
    desde una distancia no menor a 200 pies.
- id: 180
  category: vehicle_information
  question: 'Según la ley de sistemas de retención infantil de Washington, un niño
    debe permanecer en un sistema de seguridad (asiento de seguridad o asiento elevador/booster)
    hasta que tenga:'
  choices:
    A: 6 años de edad o 4'6" de estatura
    B: 8 años de edad o 4'9" de estatura
    C: 10 años de edad o 5'0" de estatura
    D: 12 años de edad
  answer: B
  explanation: La ley de Washington exige que los niños usen un asiento elevador (booster)
    o un sistema de retención infantil adecuado hasta que cumplan 8 años o alcancen
    una estatura de 4 pies y 9 pulgadas.
- id: 181
  category: vehicle_information
  question: ¿Cuándo se le permite usar la bocina en el estado de Washington?
  choices:
    A: Para saludar a amigos al pasar junto a ellos
    B: Para decirle al conductor de adelante que se dé prisa
    C: Solo cuando sea razonablemente necesario para evitar un accidente
    D: Para notificar a un conductor que está a punto de rebasarlo por la derecha
  answer: C
  explanation: La ley de Washington establece que la bocina solo debe usarse cuando
    sea necesario para garantizar una operación segura o para advertir a otros conductores
    sobre un peligro.
- id: 182
  category: vehicle_information
  question: En Washington, ¿cuál es el requisito para el sistema de escape de un vehículo?
  choices:
    A: Debe ser lo suficientemente fuerte como para ser escuchado a 50 pies
    B: Debe estar equipado con un silenciador en buen estado de funcionamiento para
      evitar ruidos excesivos
    C: Debe estar modificado para aumentar la potencia del motor
    D: Debe ventilarse por el costado del vehículo
  answer: B
  explanation: El código RCW 46.37.390 exige que cada vehículo tenga un silenciador
    en buen estado de funcionamiento para evitar ruidos y humo excesivos o inusuales.
- id: 183
  category: vehicle_information
  question: 'Al andar en bicicleta de noche en Washington, debe tener una luz delantera
    blanca visible desde al menos:'
  choices:
    A: 300 pies
    B: 500 pies
    C: 700 pies
    D: 1,000 pies
  answer: B
  explanation: El código RCW 46.61.780 exige que las bicicletas que circulen de noche
    tengan una lámpara delantera que emita una luz blanca visible desde una distancia
    de al menos 500 pies.
- id: 184
  category: vehicle_information
  question: En Washington, las luces direccionales de su vehículo deben ser visibles
    desde una distancia no menor a ____ pies bajo la luz solar normal.
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: A
  explanation: La ley de Washington (RCW 46.37.200) exige que las luces de señalización
    sean visibles desde una distancia no menor a 100 pies bajo la luz solar normal.
- id: 185
  category: vehicle_information
  question: ¿Cuál es el límite legal máximo de polarizado (tinte) de ventanas para
    las ventanas laterales y traseras de un automóvil de pasajeros en Washington?
  choices:
    A: Debe permitir el paso de más del 24% de la luz
    B: Debe permitir el paso de más del 35% de la luz
    C: Debe permitir el paso de más del 50% de la luz
    D: No se permite el polarizado en las ventanas laterales
  answer: A
  explanation: En Washington, el polarizado de las ventanas debe permitir el paso
    de más del 24% de la luz (RCW 46.37.430).
- id: 186
  category: vehicle_information
  question: 'En Washington, la bocina de un vehículo debe ser audible en condiciones
    normales desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El código RCW 46.37.380 exige que todo vehículo motorizado esté equipado
    con una bocina capaz de emitir un sonido audible en condiciones normales desde
    una distancia no menor a 200 pies.
- id: 187
  category: vehicle_information
  question: Si una carga se extiende más de cuántos pies más allá de la parte trasera
    de un vehículo, ¿se debe colocar una bandera roja o una luz roja al final de la
    carga?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: El código RCW 46.37.140 exige que se muestre una bandera roja (durante
    el día) o una luz roja (durante la noche) si una carga se extiende 4 pies o más
    más allá de la parte trasera del vehículo.
- id: 188
  category: vehicle_information
  question: Según la ley de sistemas de retención infantil de Washington, ¿hasta qué
    edad debe estar un niño en un asiento infantil orientado hacia atrás?
  choices:
    A: 1 año de edad
    B: 2 años de edad
    C: 4 años de edad
    D: 6 años de edad
  answer: B
  explanation: El código RCW 46.61.687 exige que los niños permanezcan en un sistema
    de retención infantil orientado hacia atrás hasta que tengan dos años de edad
    o hasta que alcancen los límites de peso o estatura establecidos por el fabricante
    del asiento.
- id: 189
  category: vehicle_information
  question: En Washington, ¿hasta qué estatura mínima deben los niños usar un asiento
    elevador (booster)?
  choices:
    A: 4 pies 2 pulgadas
    B: 4 pies 5 pulgadas
    C: 4 pies 9 pulgadas
    D: 5 pies
  answer: C
  explanation: La ley de Washington exige que los niños usen un asiento elevador (booster)
    hasta que midan 4'9" de estatura o cumplan 8 años, lo que ocurra primero.
- id: 190
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los cinturones
    de seguridad en el estado de Washington?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero deben usarlos
    B: Solo los pasajeros menores de 18 años deben usarlos
    C: Cada persona en el vehículo debe usar un cinturón de seguridad o estar en un
      sistema de sujeción para niños
    D: Los cinturones de seguridad son opcionales para los adultos en el asiento trasero
  answer: C
  explanation: La ley RCW 46.61.688 (Ley del Cinturón de Seguridad de Washington)
    exige que cada persona en un vehículo motorizado use un sistema de cinturón de
    seguridad debidamente ajustado y abrochado.
- id: 191
  category: vehicle_information
  question: 'La ley de Washington exige que su vehículo esté equipado con un freno
    de estacionamiento que sea capaz de:'
  choices:
    A: Detener el vehículo a menos de 50 pies a 20 mph
    B: Mantener el vehículo en cualquier pendiente en la que se opere
    C: Bloquear únicamente las ruedas delanteras
    D: Funcionar automáticamente cuando se apaga el motor
  answer: B
  explanation: La ley RCW 46.37.310 exige un sistema de freno de estacionamiento adecuado
    para mantener el vehículo en cualquier pendiente en la que se opere, bajo todas
    las condiciones de carga.
- id: 192
  category: vehicle_information
  question: 'Si sus frenos fallan mientras conduce, el manual del conductor de Washington
    sugiere que primero debe:'
  choices:
    A: Apagar el motor inmediatamente
    B: Cambiar a neutral y usar el freno de emergencia
    C: Bombear el pedal del freno varias veces
    D: Saltar fuera del vehículo
  answer: C
  explanation: La Guía del Conductor de Washington recomienda bombear el pedal del
    freno varias veces para acumular suficiente presión hidráulica para detener el
    vehículo si los frenos fallan.
- id: 193
  category: signs_and_signals
  question: En el estado de Washington, ¿qué indica una 'X' roja fija colocada sobre
    un carril reversible?
  choices:
    A: El carril está a punto de cambiar de dirección.
    B: Puede usar el carril solo para girar a la izquierda.
    C: No se le permite usar el carril.
    D: El carril es solo para vehículos HOV.
  answer: C
  explanation: Según la Guía del Conductor de Washington, una 'X' roja fija sobre
    un carril reversible significa que no se le permite usar ese carril.
- id: 194
  category: signs_and_signals
  question: En Washington, ¿qué distancia se le permite recorrer en un carril compartido
    de giro a la izquierda de dos sentidos?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Washington (RCW 46.61.290) establece que un vehículo no puede
    viajar más de 300 pies en un carril de giro a la izquierda de dos sentidos.
- id: 195
  category: signs_and_signals
  question: Al acercarse a una señal de tráfico en Washington con una flecha amarilla
    intermitente, ¿qué debe hacer?
  choices:
    A: Detenerse y esperar una flecha verde.
    B: Girar inmediatamente ya que usted tiene el derecho de paso.
    C: Ceder el paso al tráfico que viene en sentido contrario y a los peatones, luego
      girar cuando sea seguro.
    D: La luz está descompuesta; trátela como una parada de cuatro vías.
  answer: C
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero primero debe ceder el paso al tráfico que viene en sentido
    contrario y a los peatones, y luego proceder con precaución.
- id: 196
  category: signs_and_signals
  question: Para indicar un giro a la derecha usando señales manuales en Washington,
    ¿cómo debe colocar su brazo?
  choices:
    A: Brazo extendido directamente por la ventana.
    B: Brazo hacia afuera y apuntando hacia abajo, hacia el suelo.
    C: Brazo hacia afuera y doblado hacia arriba en un ángulo de 90 grados.
    D: Brazo hacia afuera y moviéndose en círculos.
  answer: C
  explanation: La señal manual correcta para un giro a la derecha es el brazo izquierdo
    doblado hacia arriba en un ángulo de 90 grados.
- id: 197
  category: signs_and_signals
  question: En Washington, ¿qué sucede con la multa por exceso de velocidad en una
    'Zona de Emergencia' (el área 200 pies antes y después de un vehículo de emergencia
    estacionado con sirenas o luces)?
  choices:
    A: La multa se exonera para los infractores por primera vez.
    B: La multa se reduce a la mitad.
    C: La multa se duplica.
    D: La multa se triplica.
  answer: C
  explanation: Según la ley de Washington, las multas por infracciones de tráfico
    cometidas en una zona de emergencia se duplican.
- id: 198
  category: signs_and_signals
  question: ¿Qué marca en el pavimento se utiliza para indicar un carril reservado
    para vehículos de alta ocupación (HOV) en Washington?
  choices:
    A: Una línea roja continua.
    B: Un símbolo de diamante blanco.
    C: Una serie de triángulos amarillos.
    D: Un cuadrado pintado de verde.
  answer: B
  explanation: Los carriles HOV (carriles para viajes compartidos o carpool) están
    marcados con un símbolo de diamante blanco en el pavimento y señales a lo largo
    del costado de la carretera.
- id: 199
  category: signs_and_signals
  question: Al entrar en una rotonda en el estado de Washington, ¿a quién debe cederle
    el paso?
  choices:
    A: Al tráfico que entra por la derecha.
    B: Al tráfico que ya está en el círculo y a los peatones en los cruces peatonales.
    C: Solo a los vehículos de emergencia.
    D: A nadie; el tráfico en el círculo debe cederle el paso a usted.
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el paso al tráfico
    que ya está en el círculo y a los peatones o ciclistas en los cruces peatonales.
- id: 200
  category: signs_and_signals
  question: 'En Washington, una línea blanca continua pintada entre los carriles de
    tráfico significa:'
  choices:
    A: Está en una calle de sentido único.
    B: Debe permanecer en su carril y evitar cambios de carril a menos que sea necesario.
    C: Puede cruzar la línea en cualquier momento para rebasar.
    D: El carril termina inmediatamente.
  answer: B
  explanation: Una línea blanca continua se utiliza para marcar el borde de la carretera
    o para separar carriles de tráfico que se mueven en la misma dirección donde se
    desaconsejan los cambios de carril.
- id: 201
  category: signs_and_signals
  question: ¿Qué es una 'Caja de Bicicletas' (Bicycle Box) como las que se ven en
    algunas intersecciones de Washington?
  choices:
    A: Un área de estacionamiento para bicicletas en la acera.
    B: Un área pintada de verde en una intersección que permite a los ciclistas situarse
      delante de los autos detenidos.
    C: Un contenedor de almacenamiento para bicicletas de alquiler.
    D: Un carril específicamente para scooters motorizados únicamente.
  answer: B
  explanation: Una caja de bicicletas es un área pintada de verde con un símbolo de
    bicicleta blanco entre la línea de parada y el paso de peatones, lo que permite
    que los ciclistas sean más visibles para los conductores en un semáforo en rojo.
- id: 202
  category: signs_and_signals
  question: 'En Washington, una luz roja intermitente debe tratarse igual que:'
  choices:
    A: Una señal de ceda el paso (Yield).
    B: Una señal de alto (Stop).
    C: Una señal de advertencia.
    D: Una luz amarilla fija.
  answer: B
  explanation: Una luz roja intermitente significa que debe detenerse por completo,
    ceder el paso al tráfico transversal y a los peatones, y avanzar cuando sea seguro,
    al igual que una señal de alto.
- id: 203
  category: signs_and_signals
  question: En el estado de Washington, las multas de tráfico se __________ por infracciones
    cometidas en zonas de construcción vial.
  choices:
    A: Triplican
    B: Duplican
    C: Mantienen igual
    D: Reducen
  answer: B
  explanation: La ley de Washington dicta que las multas de tráfico se duplican en
    las zonas de construcción cuando hay trabajadores presentes.
- id: 204
  category: signs_and_signals
  question: ¿Qué significa una marca de 'Sharrow' (un símbolo de bicicleta con dos
    galones arriba) en una carretera de Washington?
  choices:
    A: Las bicicletas están prohibidas en esta carretera.
    B: El carril es un carril exclusivo para bicicletas.
    C: El carril es compartido; los ciclistas pueden ocupar el carril completo.
    D: Las bicicletas deben permanecer en el acotamiento (shoulder).
  answer: C
  explanation: Los 'sharrows', o marcas de carril compartido, indican que el carril
    es demasiado estrecho para que un auto y una bicicleta lo compartan de forma segura
    uno al lado del otro, y los ciclistas pueden usar el carril completo.
- id: 205
  category: signs_and_signals
  question: Según la ley de Washington, ¿cuándo puede girar a la derecha con luz roja?
  choices:
    A: Nunca.
    B: Solo si hay una flecha verde.
    C: Después de detenerse por completo y ceder el paso al tráfico y a los peatones,
      a menos que una señal lo prohíba.
    D: Sin detenerse, siempre que no venga tráfico.
  answer: C
  explanation: En Washington, puede girar a la derecha con luz roja después de detenerse
    por completo y ceder el paso a los demás, siempre que no haya una señal que diga
    'No Turn on Red' (No girar en rojo).
- id: 206
  category: signs_and_signals
  question: ¿Cuál es la forma y el color de una señal estándar de 'Ceda el paso' (Yield)
    utilizada en Washington?
  choices:
    A: Círculo amarillo con texto negro.
    B: Triángulo equilátero rojo y blanco que apunta hacia abajo.
    C: Diamante naranja con bordes negros.
    D: Rectángulo blanco con texto negro.
  answer: B
  explanation: Una señal de ceda el paso es un triángulo que apunta hacia abajo, de
    color rojo y blanco con letras rojas.
- id: 207
  category: signs_and_signals
  question: En el estado de Washington, ¿qué significa una flecha amarilla intermitente
    para un giro a la izquierda?
  choices:
    A: Usted tiene el derecho de paso para girar a la izquierda.
    B: Los giros a la izquierda están prohibidos; debe seguir recto.
    C: Se permiten los giros a la izquierda, pero primero debe ceder el paso al tráfico
      que viene en sentido contrario y a los peatones.
    D: La señal está a punto de cambiar a rojo; debe despejar la intersección de inmediato.
  answer: C
  explanation: Según la Guía del Conductor de Washington, una flecha amarilla intermitente
    significa que se permiten los giros a la izquierda, pero debe ceder el paso al
    tráfico que viene en sentido contrario y a los peatones, y luego proceder con
    precaución.
- id: 208
  category: signs_and_signals
  question: En Washington, ¿cuándo es legal girar a la izquierda con luz roja?
  choices:
    A: Nunca; los giros a la izquierda en rojo siempre son ilegales.
    B: Solo desde una calle de sentido único hacia otra calle de sentido único.
    C: Desde una calle de sentido único o de doble sentido hacia una calle de sentido
      único.
    D: Solo si hay una flecha verde presente.
  answer: C
  explanation: La ley de Washington (RCW 46.61.055) permite girar a la izquierda con
    luz roja desde una calle de sentido único o de doble sentido hacia una calle de
    sentido único, después de detenerse por completo y ceder el paso al tráfico y
    a los peatones.
- id: 209
  category: signs_and_signals
  question: En Washington, ¿qué indica una señal con un símbolo de diamante blanco
    sobre un fondo negro?
  choices:
    A: Una intersección peligrosa más adelante.
    B: Un carril reservado para vehículos específicos como autobuses o vehículos compartidos
      (HOV).
    C: Una zona de vehículos de movimiento lento.
    D: El inicio de una carretera dividida.
  answer: B
  explanation: El símbolo del diamante indica un 'carril restringido' o carril HOV
    (Vehículos de Alta Ocupación), reservado para autobuses, vehículos compartidos
    u otros vehículos especiales.
- id: 210
  category: signs_and_signals
  question: 'De acuerdo con la ley de Washington, usted debe ceder el paso a cualquier
    vehículo de tránsito (autobús) que haya señalizado y esté:'
  choices:
    A: Entrando a una autopista desde una rampa de salida.
    B: Detenido en un semáforo en rojo.
    C: Reincorporándose al flujo de tráfico desde una zona de parada o apartadero.
    D: Cambiando de carril en una autopista de varios carriles.
  answer: C
  explanation: El RCW 46.61.220 exige que los conductores cedan el derecho de paso
    a cualquier vehículo de tránsito que haya señalizado y se esté reincorporando
    al flujo de tráfico desde una parada de autobús o apartadero.
- id: 211
  category: signs_and_signals
  question: Al usar señales manuales, ¿cómo indica que está disminuyendo la velocidad
    o deteniéndose?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana.
    B: Brazo doblado hacia arriba en un ángulo de 90 grados.
    C: Brazo doblado hacia abajo en un ángulo de 90 grados.
    D: Moviendo el brazo en un movimiento circular.
  answer: C
  explanation: La señal manual estándar para disminuir la velocidad o detenerse es
    el brazo izquierdo extendido hacia afuera de la ventana y doblado hacia abajo
    a la altura del codo.
- id: 212
  category: signs_and_signals
  question: En una intersección donde no hay cruces peatonales pintados, ¿cuáles son
    las reglas con respecto a los peatones?
  choices:
    A: Los peatones solo tienen el derecho de paso en los cruces marcados.
    B: Los peatones deben ceder el paso a todos los vehículos.
    C: Cada intersección se considera un cruce peatonal legal, y usted debe ceder
      el paso a los peatones.
    D: Solo debe ceder el paso si el peatón está usando un bastón blanco o un perro
      guía.
  answer: C
  explanation: En Washington, cada intersección es un cruce peatonal legal, ya sea
    que esté marcado o no. Los conductores deben ceder el paso a los peatones que
    cruzan la calle en una intersección.
- id: 213
  category: signs_and_signals
  question: ¿Qué significan las marcas verdes en el pavimento en un carril para bicicletas
    en Washington?
  choices:
    A: El carril es solo para scooters eléctricos.
    B: Se permite el estacionamiento por menos de 5 minutos.
    C: Una zona de conflicto potencial donde se cruzan las trayectorias de los usuarios
      de la vía, como cerca de las intersecciones.
    D: El inicio de una zona escolar.
  answer: C
  explanation: Las marcas verdes en el pavimento se utilizan en Washington para aumentar
    la visibilidad de los carriles para bicicletas y resaltar las áreas donde los
    automovilistas y ciclistas pueden cruzarse.
- id: 214
  category: signs_and_signals
  question: 'Una línea blanca continua pintada en el borde derecho de la calzada se
    conoce como:'
  choices:
    A: Línea de parada.
    B: Línea de niebla (fog line).
    C: Línea de ceda el paso.
    D: Línea central.
  answer: B
  explanation: Una línea blanca continua en el lado derecho de la carretera se llama
    línea de niebla (fog line). Ayuda a los conductores a mantenerse en la carretera
    durante condiciones de poca visibilidad.
- id: 215
  category: signs_and_signals
  question: Cuando se aproxima a un cruce de ferrocarril con luces rojas intermitentes,
    ¿a cuántos pies del riel más cercano debe detener su vehículo?
  choices:
    A: Entre 5 y 25 pies.
    B: Entre 10 y 30 pies.
    C: Entre 15 y 50 pies.
    D: Exactamente 20 pies.
  answer: C
  explanation: La ley de Washington exige que los conductores se detengan al menos
    a 15 pies pero a no más de 50 pies del riel más cercano en un cruce de ferrocarril
    cuando las señales están parpadeando.
- id: 216
  category: signs_and_signals
  question: ¿Qué significa un triángulo naranja reflectante con un borde rojo en la
    parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo es de carga ancha.
    C: El vehículo viaja a velocidades de 25 mph o menos.
    D: El vehículo es una unidad de respuesta a emergencias.
  answer: C
  explanation: Este es el emblema de 'Vehículo de movimiento lento', requerido en
    vehículos diseñados para viajar a velocidades de 25 mph o menos, como tractores
    agrícolas o equipos de construcción.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) octogonal roja significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 217
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Deténgase por completo
    B: Aumente la velocidad para incorporarse al tráfico
    C: Reduzca la velocidad y ceda el derecho de paso al tráfico y a los peatones
    D: Continúe sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 218
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 219
- image: wrong_way.png
  category: signs_and_signals
  question: ¿Qué debe hacer si ve esta señal?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de forma
    segura.
  id: 220
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda únicamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Mantenerse a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 221
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 222
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 223
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 224
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona donde está prohibido adelantar.
  id: 225
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha únicamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 226
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 227
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 228
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 229
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o un cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal de forma pentagonal (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 230
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta (roundabout) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 231
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 232
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 233
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 234
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta (roundabout) más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino curve primero
    hacia un lado y luego hacia el otro.
  id: 235
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 236
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 237
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 238
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: El camino termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que el camino más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 239
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción vial más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Prepárese para el
    tráfico de doble sentido.
  id: 240
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de un solo sentido o de una autopista dividida y
    se encuentre con vehículos que viajan en la dirección opuesta.
  id: 241
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 242
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción vial
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 243
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Prepárese para detenerse
    si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde el semáforo
    puede no ser visible desde la distancia.
  id: 244
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 245
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 246
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 247
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: 'Se está añadiendo un nuevo carril: no es necesario incorporarse'
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 248
