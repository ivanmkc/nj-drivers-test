questions:
- id: 1
  category: license_system
  question: ¿Con qué letras suelen comenzar los números asignados de Washington en
    las licencias, permisos y tarjetas de identificación?
  choices:
    A: WA
    B: WDL
    C: DOL
    D: LIC
  answer: B
  explanation: Según el manual, todas las licencias, permisos y tarjetas de identificación
    de Washington tienen un número asignado de Washington que a menudo comienza con
    las letras WDL.
- id: 2
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la creación
    de una cuenta de License Express?
  choices:
    A: Puede usar la cuenta de un familiar para acceder a servicios para usted mismo.
    B: No necesita un número WDL para crear una cuenta.
    C: La cuenta debe pertenecerle a usted, y los nuevos conductores deben configurar
      su propia cuenta.
    D: Solo puede crear una cuenta si tiene 18 años de edad o más.
  answer: C
  explanation: El manual establece que los nuevos conductores deben configurar su
    propia cuenta, no puede obtener servicios para usted mismo usando la cuenta de
    otra persona y la cuenta debe pertenecerle a usted.
- id: 3
  category: license_system
  question: ¿A dónde debe acudir si necesita ayuda relacionada con el registro de
    su vehículo?
  choices:
    A: Una oficina de licencias de conducir
    B: Una oficina de licencias de vehículos
    C: Una oficina del Departamento de Servicios Sociales y de Salud
    D: Una escuela de formación de conductores
  answer: B
  explanation: El manual especifica visitar una oficina de licencias de vehículos
    para obtener ayuda relacionada con las licencias y el registro de vehículos, a
    diferencia de una oficina de licencias de conducir que se encarga de las licencias
    de conducir y las identificaciones.
- id: 4
  category: license_system
  question: ¿Cuántos días tienen los nuevos residentes que tienen 18 años o más y
    cuentan con una licencia de otro estado para obtener una licencia de conducir
    del estado de Washington?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes que tienen 18 años o más y cuentan con una licencia
    de otro estado tienen 30 días para obtener una licencia de conducir del estado
    de Washington.
- id: 5
  category: driver_testing
  question: ¿Qué debe hacer un nuevo residente (de 18 años o más) si su licencia de
    conducir de otro estado está vencida?
  choices:
    A: Pagar un cargo por demora para transferir la licencia sin realizar exámenes.
    B: Aprobar solo el Examen de Conocimientos de Conducción.
    C: Aprobar solo el Examen de Habilidades de Conducción.
    D: Aprobar tanto el Examen de Conocimientos de Conducción como el Examen de Habilidades
      de Conducción.
  answer: D
  explanation: Si su licencia de otro estado está vencida, deberá aprobar tanto el
    Examen de Conocimientos de Conducción como el Examen de Habilidades de Conducción
    antes de obtener una licencia de Washington.
- id: 6
  category: license_system
  question: Si se encuentra en una situación de falta de vivienda, ¿para cuál de las
    siguientes opciones podría ser elegible?
  choices:
    A: Una exención automática para el Examen de Habilidades de Conducción
    B: Una tarjeta de identificación sin costo o con tarifa reducida
    C: Una licencia de conducir mejorada gratuita
    D: Una licencia de conducir sin restricciones a los 16 años
  answer: B
  explanation: El manual establece que si se encuentra en una situación de falta de
    vivienda, es elegible para una identificación sin costo o una identificación con
    tarifa reducida.
- id: 7
  category: license_system
  question: ¿Para cuál de las siguientes actividades NO es adecuada una licencia de
    conducir o identificación mejorada (Enhanced)?
  choices:
    A: Viajes aéreos nacionales
    B: Cruce de fronteras internacionales por tierra o mar
    C: Viajes aéreos internacionales
    D: Acceso a instalaciones federales
  answer: C
  explanation: 'Si bien una licencia de conducir mejorada es adecuada para viajes
    aéreos nacionales, cruces fronterizos por tierra/mar y acceso a instalaciones
    federales, se indica explícitamente como ''No adecuada para: Viajes aéreos internacionales''.'
- id: 8
  category: license_system
  question: ¿Con cuánta anticipación puede solicitar un permiso de instrucción si
    se inscribe en un curso de formación de conductores aprobado?
  choices:
    A: 15 años
    B: 15 ½ años
    C: 16 años
    D: 18 años
  answer: A
  explanation: Si se inscribe en un curso de formación de conductores, puede solicitar
    su permiso a partir de los 15 años (de 1 a 10 días antes de que comience su curso).
- id: 9
  category: driver_testing
  question: Si NO se inscribe en un curso de formación de conductores, ¿a qué edad
    puede realizar el examen de conocimientos para obtener su permiso de instrucción?
  choices:
    A: 15 años
    B: 15 ½ años
    C: 16 años
    D: 18 años
  answer: B
  explanation: Si no se inscribe en un curso de formación de conductores, puede realizar
    el examen de conocimientos después de cumplir los 15 años y medio para obtener
    su permiso.
- id: 10
  category: driver_testing
  question: ¿Durante cuánto tiempo es válida una calificación aprobatoria en el Examen
    de Conocimientos de Conducción?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: El manual establece que la calificación de su examen de conocimientos
    solo es válida por 2 años.
- id: 11
  category: driver_responsibility
  question: Para obtener su primera licencia de conducir a los 16 o 17 años, ¿cuántas
    horas de práctica de manejo debe completar?
  choices:
    A: 30 horas de manejo diurno y 10 horas de manejo nocturno
    B: 40 horas de manejo diurno y 10 horas de manejo nocturno
    C: 50 horas de manejo diurno y 15 horas de manejo nocturno
    D: 60 horas en total de manejo supervisado
  answer: B
  explanation: Los adolescentes de 16 a 17 años deben completar al menos 40 horas
    de manejo diurno y 10 horas de manejo nocturno con un conductor con licencia.
- id: 12
  category: driver_responsibility
  question: Al completar las horas de práctica de manejo requeridas para una licencia
    de adolescente (edades 16-17), ¿cuántos años de experiencia al volante debe tener
    como mínimo el conductor con licencia que lo supervisa?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 10 años
  answer: B
  explanation: Para adolescentes de 16 a 17 años, la práctica de manejo debe realizarse
    con un conductor con licencia que tenga 3 o más años de experiencia.
- id: 13
  category: penalties_and_points
  question: Antes de solicitar una licencia de conducir a los 16 o 17 años, ¿durante
    cuánto tiempo debe estar sin infracciones de tránsito ni condenas?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Para obtener su primera licencia de conducir a los 16 o 17 años, debe
    estar sin infracciones de tránsito ni condenas durante los 6 meses previos a la
    solicitud de la licencia.
- id: 14
  category: license_system
  question: Cuando obtiene su licencia en persona en la oficina de licencias, recibirá
    una licencia temporal antes de irse. ¿Por cuánto tiempo es válida esta licencia
    temporal?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: C
  explanation: Antes de salir de la oficina, recibirá una licencia temporal que es
    válida por 45 días mientras se le envía por correo su licencia oficial.
- id: 15
  category: driver_responsibility
  question: Si tiene 18 años o más y elige obtener un permiso para practicar el manejo
    antes de realizar el examen de habilidades, ¿cuántos años de experiencia al volante
    debe tener como mínimo el conductor con licencia que lo supervisa?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 10 años
  answer: C
  explanation: Para las personas de 18 años o más que obtienen su primera licencia,
    una opción es obtener un permiso y practicar el manejo con un conductor con licencia
    que tenga 5 o más años de experiencia.
- id: 16
  category: license_system
  question: Durante los primeros 6 meses de tener una licencia de conducir intermedia,
    ¿cuál es la restricción sobre los pasajeros?
  choices:
    A: No se permiten pasajeros en el vehículo en ningún momento
    B: No se permiten pasajeros menores de 20 años, excepto miembros de la familia
      inmediata
    C: Se permiten hasta 3 pasajeros menores de 20 años
    D: Solo se permiten pasajeros mayores de 25 años
  answer: B
  explanation: Según el manual, durante los primeros 6 meses de una licencia de conducir
    intermedia, no puede llevar pasajeros menores de 20 años, excepto miembros de
    la familia inmediata.
- id: 17
  category: safe_driving_rules
  question: ¿Cuáles son las restricciones de manejo nocturno para un conductor con
    una licencia intermedia durante los primeros seis meses?
  choices:
    A: No se permite conducir entre las 10 p.m. y las 6 a.m.
    B: No se permite conducir entre la medianoche y las 5 a.m.
    C: No se permite conducir entre la 1 a.m. y las 5 a.m., a menos que esté acompañado
      por un conductor con licencia calificado
    D: No se permite conducir después de la puesta del sol
  answer: C
  explanation: Durante los primeros 6 meses, los titulares de licencias intermedias
    no pueden conducir entre la 1 a.m. y las 5 a.m., a menos que estén acompañados
    por un padre, tutor o conductor con licencia de al menos 25 años de edad.
- id: 18
  category: safe_driving_rules
  question: ¿Cuándo puede el titular de una licencia de conducir intermedia usar un
    dispositivo de comunicación inalámbrica mientras conduce?
  choices:
    A: Solo cuando se utiliza tecnología de manos libres
    B: Solo para informar una emergencia
    C: Cuando está detenido en un semáforo en rojo
    D: En cualquier momento después de los primeros 6 meses de manejo
  answer: B
  explanation: Las leyes de licencias intermedias restringen el uso de teléfonos celulares
    y dispositivos de comunicación inalámbrica mientras se conduce, incluso con tecnología
    de manos libres. Solo puede usar su teléfono para informar una emergencia.
- id: 19
  category: penalties_and_points
  question: ¿Cuál es la sanción por una segunda infracción de tránsito mientras se
    tiene una licencia de conducir intermedia?
  choices:
    A: La licencia se suspende por 6 meses o hasta que cumpla 18 años
    B: Las restricciones actuales se aplican hasta los 18 años
    C: La licencia se revoca permanentemente
    D: Se envía una carta de advertencia a los padres
  answer: A
  explanation: Por una segunda infracción con una licencia intermedia, la licencia
    se suspende por 6 meses o hasta que cumpla 18 años, lo que ocurra primero.
- id: 20
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los permisos
    agrícolas juveniles?
  choices:
    A: Eximen de los requisitos para obtener su primera licencia de conducir
    B: Actúan como una sustitución de un permiso de instrucción
    C: No hay un requisito de edad mínima para obtener uno
    D: Permiten conducir en cualquier lugar del estado en cualquier momento
  answer: C
  explanation: El manual establece que no hay un requisito de edad mínima para un
    permiso agrícola juvenil, y este permite a los conductores menores de 18 años
    conducir dentro de un área específica para trabajos agrícolas.
- id: 21
  category: driver_responsibility
  question: ¿Por qué el Departamento de Licencias (DOL) envía cartas de advertencia
    temprana a los conductores de 18 a 21 años que reciben su primera infracción de
    tránsito?
  choices:
    A: Para suspender sus privilegios de conducir de inmediato
    B: Porque las probabilidades de que un conductor choque se duplican después de
      su primera infracción
    C: Para exigirles que vuelvan a tomar el examen de habilidades de conducción
    D: Para notificarles sobre el próximo vencimiento de su licencia
  answer: B
  explanation: El DOL envía cartas de advertencia temprana porque las probabilidades
    de que un conductor choque se duplican después de recibir su primera infracción.
    El objetivo es ayudar a los conductores jóvenes a darse cuenta de los riesgos
    y reducir la reincidencia.
- id: 22
  category: license_system
  question: ¿Cuál de las siguientes designaciones médicas puede optar por agregar
    a su licencia de conducir o tarjeta de identificación para ayudar al personal
    de emergencia?
  choices:
    A: Tipo de sangre
    B: Sordo o con dificultades auditivas
    C: Alerta de asma
    D: Indicador de marcapasos
  answer: B
  explanation: Puede agregar designaciones médicas específicas a su registro, incluyendo
    discapacidad del desarrollo, sordo o con dificultades auditivas y alerta médica.
- id: 23
  category: license_system
  question: ¿Qué debe hacer para conducir legalmente una motocicleta o un vehículo
    motorizado comercial?
  choices:
    A: Obtener una licencia de conducir completamente separada
    B: Agregar un endoso (endorsement) adicional a su licencia de conducir personal
    C: Aprobar únicamente un examen de la vista
    D: Esperar hasta tener al menos 21 años
  answer: B
  explanation: Para conducir motocicletas o vehículos motorizados comerciales, debe
    agregar un endoso adicional a su licencia de conducir personal.
- id: 24
  category: driver_testing
  question: Después de aprobar el examen de conocimientos de conducción, ¿cuánto tiempo
    tiene para completar el examen de habilidades de conducción?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Después de aprobar el examen de conocimientos, tiene dos años para
    completar el examen de habilidades.
- id: 25
  category: driver_testing
  question: ¿Quién tiene permitido estar en el vehículo con usted durante el examen
    de habilidades de conducción?
  choices:
    A: Solo el examinador, con excepciones para animales de servicio e intérpretes
      de lenguaje de señas
    B: El examinador y uno de los padres o tutor
    C: El examinador y un conductor con licencia mayor de 25 años
    D: Hasta tres pasajeros menores de 20 años
  answer: A
  explanation: Usted y el examinador son las únicas personas permitidas en el vehículo
    durante el examen, con excepciones para animales de servicio e intérpretes de
    lenguaje de señas.
- id: 26
  category: driver_testing
  question: ¿Cuántas horas de práctica de conducción se explican en la clase de orientación
    para padres para estudiantes menores de 18 años?
  choices:
    A: 30 horas de día y 5 horas de conducción nocturna
    B: 40 horas de día y 10 horas de conducción nocturna
    C: 50 horas de día y 15 horas de conducción nocturna
    D: 60 horas en total de práctica de conducción
  answer: B
  explanation: Asistir a las sesiones de orientación para padres familiarizará a los
    mentores con el programa y explicará más a fondo el requisito de 40 horas de conducción
    diurna y 10 horas de conducción nocturna.
- id: 27
  category: license_system
  question: ¿Con cuánta antelación puede renovar su licencia de conducir antes de
    que venza?
  choices:
    A: Hasta 30 días antes
    B: Hasta 6 meses antes
    C: Hasta 1 año antes
    D: Hasta 2 años antes
  answer: C
  explanation: La fecha de vencimiento se encuentra cerca de la parte inferior de
    su licencia. Puede renovar su licencia hasta un año antes de que venza.
- id: 28
  category: license_system
  question: ¿Qué se requiere si su licencia de conducir ha estado vencida por 8 años
    o más?
  choices:
    A: Debe pagar un cargo por retraso, pero no se requieren exámenes
    B: Debe volver a tomar el examen de habilidades y el de conocimientos
    C: Debe completar un nuevo curso de capacitación para conductores
    D: Debe solicitar una licencia de conducir intermedia
  answer: B
  explanation: Si su licencia tiene 8 años o más de vencida, deberá volver a tomar
    el examen de habilidades y el de conocimientos.
- id: 29
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una razón por la que un conductor podría perder
    sus privilegios de conducir?
  choices:
    A: Recibir una sola multa de estacionamiento
    B: Ser un menor en posesión de armas de fuego
    C: Conducir con el registro del vehículo vencido
    D: No actualizar su dirección dentro de los 10 días
  answer: B
  explanation: Los conductores pueden perder los privilegios de conducir por varias
    razones, incluyendo ser un menor en posesión de alcohol, drogas o armas de fuego.
- id: 30
  category: safe_driving_rules
  question: ¿Bajo qué condición puede el titular de una licencia de conducir intermedia
    conducir a cualquier hora con pasajeros?
  choices:
    A: Cuando conduce hacia o desde un evento patrocinado por la escuela
    B: Para fines agrícolas
    C: Cuando viaja a un trabajo de medio tiempo
    D: Si ha tenido su permiso de instrucción durante al menos 6 meses
  answer: B
  explanation: Como excepción a las restricciones, los titulares de una licencia de
    conducir intermedia pueden conducir a cualquier hora, con pasajeros, para fines
    agrícolas.
- id: 31
  category: penalties_and_points
  question: ¿Los menores que cometen una infracción relacionada con el alcohol, las
    drogas o las armas de fuego corren el riesgo de que se les retrase la obtención
    de su licencia de conducir hasta qué edad?
  choices:
    A: 16 años de edad
    B: 17 años de edad
    C: 18 años de edad
    D: 21 años de edad
  answer: B
  explanation: Según el manual, los menores que cometen una infracción relacionada
    con el alcohol, las drogas o las armas de fuego corren el riesgo de que se les
    retrase la licencia hasta que cumplan los 17 años de edad.
- id: 32
  category: alcohol_drugs_health
  question: ¿Qué exige la Ley de Consentimiento Implícito (Implied Consent Law) en
    el estado de Washington a los conductores?
  choices:
    A: Aceptan que se registre su vehículo en cualquier parada de tráfico.
    B: Aceptan portar prueba de responsabilidad financiera en todo momento.
    C: Aceptan someterse a una prueba si un oficial sospecha que están bajo la influencia
      del alcohol o las drogas.
    D: Aceptan una suspensión obligatoria de la licencia si reciben una multa por
      exceso de velocidad.
  answer: C
  explanation: Bajo la Ley de Consentimiento Implícito (RCW 46.20.308), toda persona
    que conduce en Washington acepta someterse a una prueba si un oficial sospecha
    que está bajo la influencia del alcohol o las drogas.
- id: 33
  category: penalties_and_points
  question: ¿Cuál es la sanción por negarse a realizar una prueba de BAC o THC si
    se sospecha que conduce bajo la influencia?
  choices:
    A: Pérdida del privilegio de conducir por 30 días
    B: Pérdida del privilegio de conducir de 90 a 730 días, o hasta los 21 años, lo
      que sea más largo
    C: Una revocación permanente de su licencia de conducir
    D: Una sentencia de prisión obligatoria de 5 años
  answer: B
  explanation: Si se niega a someterse a la prueba, podría perder su privilegio de
    conducir de 90 a 730 días, o hasta que cumpla 21 años, lo que sea más largo.
- id: 34
  category: alcohol_drugs_health
  question: Para los conductores de 21 años o más, ¿qué nivel de concentración de
    alcohol en sangre (BAC) se considera un DUI?
  choices:
    A: 0.02% o superior
    B: 0.04% o superior
    C: 0.05% o superior
    D: 0.08% o superior
  answer: D
  explanation: Para los conductores de 21 años o más, tener un BAC de .08% o superior
    se considera un DUI (conducir bajo la influencia) y puede tener consecuencias
    legales.
- id: 35
  category: alcohol_drugs_health
  question: Para los conductores menores de 21 años, ¿qué nivel de THC activo por
    mililitro de sangre se considera un DUI?
  choices:
    A: Cualquier cantidad superior a 0 nanogramos
    B: 2.00 nanogramos o más
    C: 5.00 nanogramos o más
    D: 8.00 nanogramos o más
  answer: A
  explanation: Los conductores menores de 21 años enfrentan las mismas consecuencias
    potenciales por cualquier cantidad superior a 0 nanogramos de THC activo por mililitro
    de sangre en su sistema.
- id: 36
  category: safe_driving_rules
  question: Según la ley de envases abiertos (open container law), ¿dónde deben transportarse
    los productos de alcohol y cannabis abiertos en un vehículo?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: En el maletero o en la caja de la camioneta
    D: En el piso del asiento trasero
  answer: C
  explanation: Los productos de alcohol y cannabis abiertos solo pueden transportarse
    en el maletero o en la caja de la camioneta. No pueden guardarse en compartimentos
    de almacenamiento accesibles para el conductor.
- id: 37
  category: license_system
  question: Si su dirección cambia, ¿dentro de cuántos días debe actualizar su información
    en License Express?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Si su dirección cambia, debe actualizar su información en License Express
    dentro de los 10 días posteriores al cambio.
- id: 38
  category: vehicle_information
  question: ¿Dónde debe guardar el Certificado de Propiedad (título) de su vehículo?
  choices:
    A: En la guantera del vehículo
    B: Pegado al interior del parabrisas
    C: En un lugar seguro pero no en el vehículo
    D: Doblado dentro del manual del propietario del vehículo
  answer: C
  explanation: El título es un documento importante. El manual indica que debe guardarse
    en un lugar seguro pero no dentro del vehículo.
- id: 39
  category: vehicle_information
  question: ¿Cuánto tiempo tienen los nuevos residentes para completar el registro
    de su vehículo en Washington?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Los nuevos residentes tienen 30 días para completar el registro de
    su vehículo.
- id: 40
  category: vehicle_information
  question: Si vende o se deshace de su vehículo entregándolo a otra persona, ¿dentro
    de cuántos días debe presentar un Informe de Venta de Vehículo (Vehicle Report
    of Sale)?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: A
  explanation: Si vende, intercambia, regala o se deshace de su vehículo, debe presentar
    un formulario de Informe de Venta de Vehículo dentro de los cinco días.
- id: 41
  category: vehicle_information
  question: ¿Al comprar un vehículo a un particular, dentro de cuántos días debe el
    comprador transferir la propiedad para evitar cargos por penalización?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: El comprador debe llevar el título firmado a una oficina de licencias
    para transferir la propiedad dentro de los 15 días para evitar cargos por penalización.
- id: 42
  category: vehicle_information
  question: ¿Cuál es la regla con respecto a los marcos de las placas de matrícula
    en Washington?
  choices:
    A: Están estrictamente prohibidos en todos los vehículos motorizados.
    B: Solo se pueden usar en la placa de matrícula trasera.
    C: Deben estar hechos de plástico transparente.
    D: No pueden cubrir ni obstruir las letras, números o pestañas (tabs) de la placa.
  answer: D
  explanation: Puede tener un marco de placa de matrícula, pero no puede cubrir ni
    obstruir las letras, números o pestañas (tabs) de la placa.
- id: 43
  category: driver_responsibility
  question: ¿Cuál es la cobertura mínima requerida de seguro de responsabilidad civil
    por lesiones o destrucción de la propiedad de terceros en un solo choque?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: El estado de Washington requiere una prueba de seguro de responsabilidad
    civil que proporcione $10,000 o más, pagaderos por lesiones o destrucción de la
    propiedad de terceros en un solo choque.
- id: 44
  category: penalties_and_points
  question: ¿Por cuánto tiempo aparecen las infracciones relacionadas con el alcohol
    y las drogas en su historial de conducción?
  choices:
    A: 5 años
    B: 7 años
    C: 15 años
    D: De por vida
  answer: D
  explanation: Las infracciones relacionadas con el alcohol y las drogas aparecen
    en su historial de conducción de por vida.
- id: 45
  category: defensive_driving
  question: ¿Cuál es el propósito de la Tecnología de Seguridad del Vehículo (VST)
    y los Sistemas Avanzados de Asistencia al Conductor (ADAS)?
  choices:
    A: Reemplazar la necesidad de atención humana al conducir.
    B: Asistir sus hábitos de conducción ya saludables y reducir el impacto de los
      choques.
    C: Permitir que los conductores usen legalmente dispositivos móviles mientras
      operan un vehículo.
    D: Informar automáticamente las infracciones de tráfico a las autoridades locales.
  answer: B
  explanation: Están destinados a asistir sus hábitos de conducción ya saludables,
    no a reemplazarlos, y a reducir el impacto de los choques al tratar de evitar
    que ocurran.
- id: 46
  category: vehicle_information
  question: ¿Cuál de las siguientes es una limitación de los sistemas de detección
    de puntos ciegos mencionada en el manual?
  choices:
    A: No pueden detectar vehículos directamente detrás de usted.
    B: Dirigen automáticamente su vehículo lejos del peligro.
    C: No pueden detectar si un vehículo dos carriles más allá también se está preparando
      para incorporarse.
    D: Solo funcionan durante las horas del día.
  answer: C
  explanation: El manual señala que, si bien estos sistemas pueden alertarle sobre
    un vehículo en su punto ciego, no pueden detectar si hay un vehículo dos carriles
    más allá que también se esté preparando para incorporarse.
- id: 47
  category: vehicle_information
  question: 'Para evitar resbalones y deslizamientos, la banda de rodadura de sus
    neumáticos no debe ser inferior a:'
  choices:
    A: 1/16 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/8 de pulgada
  answer: B
  explanation: Según el manual, los neumáticos desgastados pueden causar resbalones
    y deslizamientos, y la banda de rodadura de los neumáticos no debe ser inferior
    a 2/32 de pulgada.
- id: 48
  category: vehicle_information
  question: ¿Dónde puede encontrar la presión de inflado adecuada para los neumáticos
    de su vehículo?
  choices:
    A: En el flanco del propio neumático.
    B: En la etiqueta de Información de Neumáticos y Carga en el borde de la puerta
      del lado del conductor.
    C: En el panel de instrumentos del tablero.
    D: En el interior de la tapa del combustible.
  answer: B
  explanation: La presión de inflado adecuada para sus neumáticos se puede encontrar
    en la etiqueta de Información de Neumáticos y Carga en el borde de la puerta del
    lado del conductor o en el manual del propietario.
- id: 49
  category: safe_driving_rules
  question: Según la ley de Washington, ¿cuándo es obligatorio tener encendidos los
    faros delanteros?
  choices:
    A: Desde la puesta del sol hasta el amanecer.
    B: Desde media hora después de la puesta del sol hasta media hora antes del amanecer.
    C: Desde media hora antes de la puesta del sol hasta media hora después del amanecer.
    D: Solo cuando la visibilidad es inferior a 500 pies.
  answer: B
  explanation: La ley de Washington establece que debe tener los faros encendidos
    desde media hora después de la puesta del sol hasta media hora antes del amanecer.
- id: 50
  category: safe_driving_rules
  question: ¿A cuántos pies de un vehículo que viene en sentido contrario debe cambiar
    de luces altas a faros regulares?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Debe recordar volver a los faros regulares cuando se encuentre a 500
    pies frente a un vehículo que viene en sentido contrario.
- id: 51
  category: safe_driving_rules
  question: 'Al seguir a otro vehículo, debe atenuar las luces altas cuando se encuentre
    a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Debe volver a las luces delanteras normales cuando se encuentre a 300
    pies de distancia al estar detrás de otro vehículo.
- id: 52
  category: vehicle_information
  question: 'Las luces de freno de su vehículo deben ser rojas y claramente visibles
    desde una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Sus luces de freno son rojas y deben ser claramente visibles desde
    100 pies de distancia.
- id: 53
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe usar la luz direccional antes de realizar
    un movimiento o cambiar de dirección?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: El manual instruye a los conductores a señalizar 100 pies antes de
    realizar su movimiento.
- id: 54
  category: safe_driving_rules
  question: Si sus luces direccionales no funcionan, ¿cuál es la señal manual correcta
    para un giro a la derecha?
  choices:
    A: Saque el brazo izquierdo por la ventana y apunte con los dedos hacia el suelo.
    B: Saque el brazo izquierdo por la ventana y apunte con los dedos directamente
      hacia la izquierda.
    C: Saque el brazo izquierdo por la ventana y doble el brazo de modo que sus dedos
      apunten hacia el cielo.
    D: Saque el brazo derecho por la ventana del pasajero y apunte en línea recta.
  answer: C
  explanation: Para la señal manual de giro a la derecha, saque el brazo izquierdo
    por la ventana y doble el brazo de modo que sus dedos apunten hacia el cielo.
- id: 55
  category: safe_driving_rules
  question: Para dejar un espacio adecuado para que la bolsa de aire se despliegue
    de forma segura, ¿a qué distancia mínima debe estar su pecho del volante?
  choices:
    A: 5 pulgadas
    B: 8 pulgadas
    C: 10 pulgadas
    D: 12 pulgadas
  answer: C
  explanation: Ajuste el respaldo de su asiento para que esté sentado cómodamente
    derecho. Su pecho debe estar al menos a 10 pulgadas del volante para dejar espacio
    para la bolsa de aire.
- id: 56
  category: safe_driving_rules
  question: ¿Cómo debe ajustar su reposacabezas para protegerse del latigazo cervical?
  choices:
    A: De modo que descanse en la base de su cuello.
    B: De modo que esté a la altura de sus orejas.
    C: De modo que esté al menos dos pulgadas por encima de su cabeza.
    D: De modo que toque la parte superior de su espalda.
  answer: B
  explanation: Protéjase del latigazo cervical asegurándose de que el reposacabezas
    esté a la altura de sus orejas.
- id: 57
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de usar el cinturón de seguridad?
  choices:
    A: El cinturón de hombro debe cruzar su cuello y el cinturón de regazo debe descansar
      sobre su estómago.
    B: El cinturón de hombro debe quedar ajustado a través del hombro y el pecho,
      y el cinturón de regazo debe sujetar firmemente las caderas por debajo del estómago.
    C: El cinturón de hombro debe colocarse debajo del brazo y el cinturón de regazo
      a través de los muslos.
    D: El cinturón de hombro debe colocarse detrás de la espalda si causa molestias.
  answer: B
  explanation: El cinturón de hombro debe quedar ajustado a través del hombro y el
    pecho, y no cruzar el cuello ni la cara. El cinturón de regazo debe sujetar las
    caderas de forma firme y ajustada, por debajo del estómago.
- id: 58
  category: safe_driving_rules
  question: Según el manual, ¿hasta qué edad deben viajar los niños en un asiento
    de seguridad orientado hacia atrás?
  choices:
    A: Hasta el primer año de edad
    B: Hasta los 2 años de edad
    C: Hasta los 3 años de edad
    D: Hasta los 4 años de edad
  answer: B
  explanation: Los niños hasta los 2 años de edad deben viajar en un asiento de seguridad
    orientado hacia atrás.
- id: 59
  category: safe_driving_rules
  question: ¿Qué señal manual debe usar para indicarle a la persona que viene detrás
    que usted está disminuyendo la velocidad y preparándose para detenerse?
  choices:
    A: Saque el brazo izquierdo por la ventana y apunte con los dedos hacia el cielo.
    B: Saque el brazo izquierdo por la ventana y apunte con los dedos directamente
      hacia la izquierda.
    C: Saque el brazo izquierdo por la ventana y apunte con los dedos hacia el suelo.
    D: Mueva su mano izquierda de arriba abajo fuera de la ventana.
  answer: C
  explanation: Para señalizar una parada, saque el brazo izquierdo por la ventana
    del lado del conductor y apunte con los dedos hacia el suelo. Esto le indica a
    la persona de atrás que disminuya la velocidad y se prepare para detenerse.
- id: 60
  category: safe_driving_rules
  question: ¿Por qué los niños menores de 13 años nunca deben viajar en el asiento
    delantero de un vehículo?
  choices:
    A: Son demasiado bajos para ver por la ventana.
    B: Podrían distraer al conductor.
    C: Podrían sufrir lesiones graves o morir si se despliega una bolsa de aire.
    D: Los cinturones de seguridad del asiento delantero no se bloquean.
  answer: C
  explanation: Las bolsas de aire son la razón por la que los niños menores de 13
    años nunca deben viajar en el asiento delantero, ya que podrían sufrir lesiones
    graves o morir si se despliega una bolsa de aire.
- id: 61
  category: vehicle_information
  question: ¿Al usar el método de dirección de manos juntas (hand-to-hand) o de manos
    cruzadas (hand-over-hand), dónde deben colocarse las manos en el volante?
  choices:
    A: En las 8 y las 4 o las 9 y las 3
    B: En las 9 y las 3 o las 10 y las 2
    C: En las 10 y las 2 o las 11 y las 1
    D: En las 7 y las 5 o las 8 y las 4
  answer: B
  explanation: Al usar los métodos de dirección de manos juntas o de manos cruzadas,
    sus manos deben estar en las posiciones de las 9 y las 3 o de las 10 y las 2.
- id: 62
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones debe utilizar el método de dirección
    de manos cruzadas (hand-over-hand)?
  choices:
    A: Al conducir a velocidades de autopista
    B: Al recuperarse de un derrape
    C: Al cambiar de carril en una autovía
    D: Al retroceder en línea recta
  answer: B
  explanation: El manual recomienda usar la dirección de manos cruzadas al girar a
    bajas velocidades, con visibilidad limitada, en una intersección, al estacionar
    el vehículo o al recuperarse de un derrape.
- id: 63
  category: vehicle_information
  question: ¿Cuándo se recomienda la posición de las manos a las 12 en punto en el
    volante?
  choices:
    A: Solo al retroceder un vehículo
    B: Al conducir en una carretera recta
    C: Al realizar un giro en U cerrado
    D: Al recuperarse de un derrape
  answer: A
  explanation: La posición de las 12 se recomienda solo al retroceder un vehículo,
    lo que le permite girar el cuerpo para ver la trayectoria de desplazamiento detrás
    de usted.
- id: 64
  category: vehicle_information
  question: ¿Cuál es la principal ventaja de seguridad de un Sistema de Frenos Antibloqueo
    (ABS)?
  choices:
    A: Acorta significativamente la distancia de frenado.
    B: Evita que el vehículo vibre durante una parada.
    C: Permite a los conductores maniobrar el volante durante una situación de frenado
      de emergencia.
    D: Aplica automáticamente los frenos si una colisión es inminente.
  answer: C
  explanation: El Sistema de Frenos Antibloqueo (ABS) de un vehículo ofrece una ventaja
    de seguridad importante al permitir que los conductores dirijan el volante durante
    una situación de frenado de emergencia. No acorta la distancia de frenado.
- id: 65
  category: vehicle_information
  question: ¿Cómo se llama el movimiento hacia adelante y hacia atrás de un vehículo
    causado por acelerar o detenerse abruptamente?
  choices:
    A: Balanceo (Roll)
    B: Guiñada (Yaw)
    C: Cabeceo (Pitch)
    D: Vaivén (Sway)
  answer: C
  explanation: Cuando acelera o se detiene abruptamente, el peso del vehículo se desplaza
    hacia atrás o hacia adelante. Este movimiento hacia adelante y hacia atrás se
    llama cabeceo (pitch).
- id: 66
  category: vehicle_information
  question: ¿Qué término describe el movimiento en zigzag que se crea cuando se gira
    el volante bruscamente de un lado a otro?
  choices:
    A: Cabeceo (Pitch)
    B: Balanceo (Roll)
    C: Guiñada (Yaw)
    D: Deriva (Drift)
  answer: C
  explanation: Cuando gira el volante bruscamente de un lado a otro, la parte delantera
    y trasera de su automóvil no se mantienen perfectamente alineadas, lo que crea
    un movimiento en zigzag llamado guiñada (yaw).
- id: 67
  category: safe_driving_rules
  question: En una intersección, si la línea de parada parece estar debajo de su espejo
    lateral, ¿a qué distancia aproximada se encuentra la parte delantera de su vehículo
    de la línea?
  choices:
    A: De 1 a 2 pulgadas
    B: De 3 a 6 pulgadas
    C: De 10 a 12 pulgadas
    D: De 1 a 2 pies
  answer: B
  explanation: En una intersección, detenerse cuando la línea de parada está debajo
    de su espejo lateral significa que está a unas 3 a 6 pulgadas de la línea.
- id: 68
  category: defensive_driving
  question: ¿Cuál es una regla importante que debe recordar al girar la cabeza para
    revisar sus zonas ciegas?
  choices:
    A: Mantener el volante recto.
    B: Acelerar ligeramente para rebasar vehículos rápidamente.
    C: Usar siempre la dirección con una sola mano.
    D: Girar el volante ligeramente en la dirección en la que está mirando.
  answer: A
  explanation: Al realizar una búsqueda visual completa y girar la cabeza para mirar
    sus zonas ciegas, debe mantener el volante recto.
- id: 69
  category: sharing_the_road
  question: ¿Cuál es una buena regla general al circular cerca de vehículos grandes
    como autobuses y vehículos motorizados comerciales?
  choices:
    A: Si puede ver sus neumáticos, ellos pueden verlo a usted.
    B: Si no puede ver sus espejos, el conductor no puede verlo a usted.
    C: Siempre rebáselos por el lado derecho.
    D: Sígalos de cerca para reducir la resistencia al viento.
  answer: B
  explanation: 'Al circular cerca de vehículos grandes, recuerde: si no puede ver
    sus espejos, el conductor no puede verlo a usted.'
- id: 70
  category: safe_driving_rules
  question: Según el manual, ¿a qué altura se considera generalmente que una persona
    es lo suficientemente alta como para usar un cinturón de seguridad que le ajuste
    correctamente sin un asiento elevado (booster seat)?
  choices:
    A: Más de 4'5"
    B: Más de 4'7"
    C: Más de 4'9"
    D: Más de 5'0"
  answer: C
  explanation: Todos los ocupantes con la edad y altura suficientes para usar un cinturón
    de seguridad deben tener un cinturón que les ajuste correctamente, lo cual se
    indica como una estatura de más de 4'9".
- id: 71
  category: safe_driving_rules
  question: ¿Cuál es un beneficio clave de utilizar el método de dirección de manos
    juntas (tirar/empujar)?
  choices:
    A: Permite realizar giros más rápidos a altas velocidades.
    B: Es el único método aprobado para retroceder.
    C: Mantiene los brazos alejados del área de la bolsa de aire (airbag) ya que las
      manos nunca se cruzan.
    D: Le permite conducir con una mano mientras opera el radio.
  answer: C
  explanation: Con la dirección de manos juntas, dado que sus manos nunca se cruzan
    sobre el volante, hay menos posibilidades de sufrir una lesión en la cara, las
    manos o los brazos si se despliega la bolsa de aire (airbag).
- id: 72
  category: defensive_driving
  question: ¿Por qué debe evitar el frenado firme o de emergencia innecesario al conducir?
  choices:
    A: Dañará permanentemente su Sistema de Frenos Antibloqueo (ABS).
    B: Podría sorprender a las personas detrás de usted que esperaban una parada suave.
    C: Hace que el vehículo se incline hacia un lado.
    D: Aumenta las zonas ciegas de su vehículo.
  answer: B
  explanation: El frenado firme o de emergencia innecesario podría sorprender a las
    personas detrás de usted que esperaban una parada suave.
- id: 73
  category: vehicle_information
  question: Cuando realiza un giro a la izquierda, la fuerza centrífuga transfiere
    el peso al exterior o al lado derecho de su vehículo. ¿Cómo se llama este movimiento
    de lado a lado?
  choices:
    A: Cabeceo (Pitch)
    B: Guiñada (Yaw)
    C: Balanceo (Roll)
    D: Inclinación (Lean)
  answer: C
  explanation: El movimiento de lado a lado de un vehículo, como cuando la fuerza
    centrífuga transfiere el peso durante un giro, se llama balanceo (roll).
- id: 74
  category: sharing_the_road
  question: ¿Cuál es una regla importante que debe recordar al circular cerca de vehículos
    grandes?
  choices:
    A: Pueden detenerse mucho más rápido que los autos pequeños.
    B: Si no puede ver sus espejos, el conductor no puede verlo a usted.
    C: Siempre debe rebasarlos por el lado derecho.
    D: No tienen zonas ciegas.
  answer: B
  explanation: 'El manual establece que se debe ser considerado y estar alerta al
    circular cerca de vehículos grandes, recordando: si no puede ver sus espejos,
    el conductor no puede verlo a usted.'
- id: 75
  category: vehicle_information
  question: ¿Cuál de las siguientes opciones es algo que debe revisar fuera de su
    vehículo antes de conducir?
  choices:
    A: Advertencias en el panel de instrumentos.
    B: Si los objetos sueltos están asegurados de forma segura.
    C: Fugas de líquidos debajo del vehículo.
    D: Si su teléfono está en silencio.
  answer: C
  explanation: Revisar el exterior de su vehículo incluye buscar objetos extraños
    en las llantas, vidrios rotos o fugas de líquidos debajo del vehículo.
- id: 76
  category: safe_driving_rules
  question: Al realizar los ajustes internos antes de conducir, ¿qué debe hacer con
    su teléfono celular?
  choices:
    A: Colocarlo en el asiento del pasajero para facilitar el acceso.
    B: Mantenerlo en su mano en caso de emergencias.
    C: Silenciarlo y guardarlo.
    D: Conectarlo a unos auriculares que cubran ambos oídos.
  answer: C
  explanation: Como parte de la revisión de todos los ajustes internos antes de partir,
    el manual pide asegurarse de que su teléfono esté silenciado y guardado.
- id: 77
  category: defensive_driving
  question: ¿Cuál es un hábito inteligente y seguro que debe desarrollar para revisar
    sus zonas ciegas?
  choices:
    A: Mirar siempre por encima del hombro.
    B: Confiar totalmente en su espejo retrovisor.
    C: Tocar la bocina antes de cambiar de carril.
    D: Acelerar para rebasar a otros vehículos rápidamente.
  answer: A
  explanation: El manual aconseja desarrollar hábitos inteligentes y seguros, como
    mirar siempre por encima del hombro para revisar sus zonas ciegas, de modo que
    se vuelva automático.
- id: 78
  category: driver_responsibility
  question: ¿Cómo pueden un resfriado fuerte o los factores estresantes diarios afectar
    su conducción?
  choices:
    A: Mejoran su tiempo de reacción.
    B: Ralentizan sus procesos mentales e impactan su capacidad para tomar decisiones
      acertadas.
    C: No tienen ningún efecto en su capacidad de conducción.
    D: Aumentan su visión periférica.
  answer: B
  explanation: Según el manual, un resfriado fuerte puede ralentizar sus procesos
    mentales y el estrés puede impactar su capacidad para tomar decisiones acertadas
    al volante.
- id: 79
  category: safe_driving_rules
  question: Si se le requiere usar lentes correctivos al conducir, ¿qué debe evitar
    hacer por la noche?
  choices:
    A: Usar sus faros delanteros.
    B: Mirar el borde derecho de la carretera.
    C: Usar lentes correctivos oscuros o teñidos.
    D: Revisar su visión periférica.
  answer: C
  explanation: El manual establece explícitamente que si se le requiere usar lentes
    correctivos, debe evitar el uso de lentes correctivos oscuros o teñidos por la
    noche.
- id: 80
  category: defensive_driving
  question: ¿Cómo puede evitar el deslumbramiento de los faros delanteros que vienen
    en sentido contrario al conducir en la oscuridad?
  choices:
    A: Mirar directamente a los faros del vehículo que se aproxima.
    B: Apagar sus faros temporalmente.
    C: Observar el borde derecho de la carretera y usarlo como guía de dirección.
    D: Encender sus luces altas para contrarrestar el deslumbramiento.
  answer: C
  explanation: Para evitar el deslumbramiento de las luces que vienen en sentido contrario,
    el manual aconseja observar el borde derecho de la carretera y usarlo como guía
    de dirección.
- id: 81
  category: defensive_driving
  question: 'Al conducir de noche, debe reducir su velocidad para poder:'
  choices:
    A: Detenerse dentro del área iluminada por sus faros delanteros.
    B: Llegar a su destino sin usar los frenos.
    C: Mantenerse al ritmo del flujo de vehículos comerciales.
    D: Evitar el uso de sus espejos.
  answer: A
  explanation: Al conducir de noche, debe reducir su velocidad y aumentar su distancia
    de seguimiento para poder detenerse dentro del área iluminada por sus faros delanteros.
- id: 82
  category: safe_driving_rules
  question: ¿Cuál es la ley con respecto al uso de auriculares o audífonos mientras
    se conduce?
  choices:
    A: Es legal siempre que el volumen sea bajo.
    B: Es ilegal usar auriculares o audífonos que transmitan sonido o cancelen el
      ruido.
    C: Es legal solo si está escuchando un dispositivo GPS.
    D: Es obligatorio para los conductores con problemas de audición.
  answer: B
  explanation: Es contra la ley conducir un vehículo mientras se usan auriculares,
    audífonos o cascos que transmitan sonido o cancelen el ruido.
- id: 83
  category: license_system
  question: Si tiene un permiso de instrucción o una licencia intermedia, ¿cuál es
    la regla con respecto al uso del teléfono celular mientras conduce?
  choices:
    A: Puede usar un teléfono celular solo si es con manos libres.
    B: No puede usar un teléfono celular ni ningún dispositivo electrónico móvil,
      incluso si es con manos libres.
    C: Puede usar un teléfono celular para enviar mensajes de texto pero no para llamar.
    D: Puede usar un teléfono celular si está detenido en un semáforo en rojo.
  answer: B
  explanation: 'El manual establece: Recuerde: si tiene un permiso de instrucción
    o una licencia intermedia, no puede usar un teléfono celular ni ningún dispositivo
    electrónico móvil mientras conduce, incluso si es con manos libres.'
- id: 84
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una posible sanción por conducir bajo los efectos
    del alcohol o las drogas?
  choices:
    A: Una advertencia por la primera infracción.
    B: Servicio comunitario obligatorio en lugar de multas.
    C: Multas costosas, suspensión de la licencia e incluso penas de cárcel.
    D: Una restricción temporal para conducir solo durante el día.
  answer: C
  explanation: 'Las sanciones por conducir bajo los efectos del alcohol o las drogas
    son muy severas: multas costosas, tarifas de seguro más altas, suspensión o retiro
    de la licencia e incluso penas de cárcel.'
- id: 85
  category: alcohol_drugs_health
  question: ¿Cuál es la regla legal con respecto a conducir después de consumir cannabis
    en Washington?
  choices:
    A: Es legal si tiene más de 21 años.
    B: Es legal siempre que consuma menos del límite seguro.
    C: Es ilegal para todas las edades, ya que no existe una cantidad segura de cannabis
      para conducir.
    D: Es legal solo si está usando cannabis medicinal.
  answer: C
  explanation: El uso recreativo de cannabis es legal para personas de 21 años o más,
    pero conducir después de consumir cualquier cantidad de cannabis es ilegal para
    todas las edades. No existe una cantidad segura de cannabis para conducir.
- id: 86
  category: alcohol_drugs_health
  question: ¿Qué debe hacer si acaba de empezar a tomar un nuevo medicamento recetado?
  choices:
    A: Conducir normalmente, ya que los medicamentos recetados son legales y seguros.
    B: Esperar hasta saber qué efecto tiene en su juicio, coordinación y tiempo de
      reacción antes de conducir.
    C: Solo conducir durante las horas del día.
    D: Beber una bebida con cafeína antes de conducir para contrarrestar cualquier
      somnolencia.
  answer: B
  explanation: No conduzca si acaba de empezar a tomar un nuevo medicamento recetado.
    Espere hasta saber qué efecto tiene en su juicio, coordinación y tiempo de reacción.
- id: 87
  category: alcohol_drugs_health
  question: ¿Cuál es el tipo de deterioro más común involucrado en accidentes fatales?
  choices:
    A: Conducir mientras se usa un dispositivo de manos libres.
    B: Conducir con un resfriado fuerte.
    C: El consumo de múltiples drogas (mezclar o tomar más de un tipo de droga).
    D: Conducir con los faros mal alineados.
  answer: C
  explanation: El manual establece que el consumo de múltiples drogas (mezclar o tomar
    más de un tipo de droga) es el tipo de deterioro más común involucrado en accidentes
    fatales.
- id: 88
  category: alcohol_drugs_health
  question: 'Al leer las etiquetas de advertencia en los medicamentos, las advertencias
    contra ''operar maquinaria pesada'' incluyen:'
  choices:
    A: Solo vehículos comerciales.
    B: Conducir un vehículo.
    C: Solo equipo agrícola.
    D: Bicicletas y patinetas.
  answer: B
  explanation: El manual aconseja leer todas las etiquetas de advertencia antes de
    conducir, señalando que las advertencias contra "operar maquinaria pesada" incluyen
    conducir un vehículo.
- id: 89
  category: alcohol_drugs_health
  question: ¿Qué debe hacer si viaja solo y comienza a sentirse cansado mientras conduce?
  choices:
    A: Beber una bebida con cafeína y seguir conduciendo.
    B: Salirse de la carretera y tomar una siesta de 20 minutos.
    C: Subir el volumen de la radio y bajar las ventanillas.
    D: Conducir más rápido para llegar antes a su destino.
  answer: B
  explanation: Según el manual, si viaja solo y comienza a sentirse cansado, debe
    salirse de la carretera y tomar una siesta de 20 minutos. Es mejor detenerse y
    dormir que arriesgarse a causar un accidente.
- id: 90
  category: defensive_driving
  question: Al planificar un viaje largo, ¿con qué frecuencia debe planear detenerse
    y tomar un descanso para evitar la fatiga?
  choices:
    A: Cada 50 millas o 1 hora.
    B: Cada 100 millas o 2 horas.
    C: Cada 200 millas o 4 horas.
    D: Solo cuando necesite reabastecer combustible al vehículo.
  answer: B
  explanation: Antes de un viaje, debe planear detenerse aproximadamente cada 100
    millas o 2 horas durante viajes largos para caminar, tomar aire fresco y beber
    agua.
- id: 91
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una técnica recomendada para calmarse y aliviar
    el estrés antes de salir a la carretera?
  choices:
    A: Escuchar música fuerte y de ritmo rápido.
    B: Contar hacia atrás desde 100 de tres en tres mientras está sentado en un vehículo
      estacionado.
    C: Conducir a baja velocidad hasta que se sienta mejor.
    D: Enfrentar la fuente de su estrés de inmediato.
  answer: B
  explanation: Para calmarse antes de conducir, el manual sugiere sentarse en un vehículo
    estacionado y contar lentamente del 1 al 20, o hacia atrás desde 100 de tres en
    tres, para silenciar todo lo demás en su cabeza.
- id: 92
  category: penalties_and_points
  question: Según la ley de Washington, ¿cómo se clasifican la conducción agresiva
    y la furia al volante (road rage)?
  choices:
    A: Ambas se consideran infracciones civiles menores.
    B: La conducción agresiva es un delito penal, mientras que la furia al volante
      es una infracción de tránsito.
    C: La conducción agresiva es una infracción de tránsito, mientras que la furia
      al volante es un delito penal.
    D: Ambos se consideran delitos penales.
  answer: C
  explanation: El manual establece explícitamente que la conducción agresiva es una
    infracción de tránsito, mientras que la furia al volante es un delito penal.
- id: 93
  category: safe_driving_rules
  question: ¿Cuál de los siguientes comportamientos se considera un ejemplo de conducción
    agresiva?
  choices:
    A: Conducir demasiado cerca de alguien que camina o anda en bicicleta por la carretera.
    B: Ceder el paso en una parada de cuatro vías.
    C: Usar la señal de giro antes de cambiar de carril.
    D: Conducir exactamente al límite de velocidad indicado.
  answer: A
  explanation: Los comportamientos asociados con la conducción agresiva incluyen el
    exceso de velocidad, seguir demasiado cerca, realizar cambios de carril inseguros
    y conducir demasiado cerca de alguien que camina o anda en bicicleta por la carretera.
- id: 94
  category: penalties_and_points
  question: ¿Quién puede enfrentar sanciones severas, incluyendo multas, tiempo en
    la cárcel y la confiscación del vehículo, por carreras callejeras no autorizadas?
  choices:
    A: Solo los conductores de los vehículos de carreras.
    B: Solo los organizadores del evento.
    C: Los conductores y cualquier otra persona que instigue o ayude con las actividades
      de carreras.
    D: Solo los participantes que tengan antecedentes penales previos.
  answer: C
  explanation: Las sanciones por carreras callejeras son severas y pueden aplicarse
    a los conductores y a cualquier otra persona que instigue o ayude con las actividades
    de carreras callejeras.
- id: 95
  category: driver_responsibility
  question: ¿Cuál de las siguientes acciones es una señal de que podría estar experimentando
    furia al volante?
  choices:
    A: Rebasar el tráfico y luego reducir la velocidad para darle una lección al otro
      conductor.
    B: Crear márgenes de espacio seguros alrededor de su vehículo.
    C: Permitir suficiente tiempo para su viaje.
    D: Detenerse a un lado del camino para tomar una siesta de 20 minutos.
  answer: A
  explanation: Las señales de experimentar furia al volante incluyen frenar para evitar
    que el conductor de atrás lo siga demasiado cerca, o rebasar el tráfico y luego
    reducir la velocidad para darle una lección al otro conductor.
- id: 96
  category: defensive_driving
  question: ¿Qué debe hacer si siente que un conductor enojado lo sigue o lo acosa?
  choices:
    A: Detener su automóvil y enfrentar al conductor.
    B: Conducir a un área con otras personas y negocios abiertos.
    C: Conducir a su casa lo más rápido posible.
    D: Frenar repentinamente para ahuyentar al conductor.
  answer: B
  explanation: Si usted es víctima de furia al volante y siente que lo siguen o lo
    acosan, debe conducir a un área donde haya otras personas y negocios abiertos.
- id: 97
  category: driver_responsibility
  question: ¿Cómo debe reportar un incidente de furia al volante en curso?
  choices:
    A: Esperar hasta llegar a casa y presentar un informe en línea.
    B: Llamar al 911 de inmediato.
    C: Tomar una foto del conductor y publicarla en las redes sociales.
    D: Seguir al conductor para obtener su dirección particular para la policía.
  answer: B
  explanation: El manual instruye a los conductores a reportar los incidentes de furia
    al volante en curso de inmediato llamando al 911.
- id: 98
  category: driver_responsibility
  question: ¿Por qué los conductores adolescentes podrían ser más propensos a correr
    riesgos o calcular mal las situaciones en la carretera?
  choices:
    A: Tienen tiempos de reacción más lentos que los conductores mayores.
    B: La parte de su cerebro responsable del juicio y la toma de decisiones aún se
      está desarrollando.
    C: Generalmente se les enseña a conducir de manera más agresiva.
    D: Tienen mala visión en comparación con los conductores mayores.
  answer: B
  explanation: Los conductores adolescentes deben recordar que la parte de su cerebro
    responsable del juicio y la toma de decisiones aún se está desarrollando, lo que
    los hace más propensos a correr riesgos o calcular mal las situaciones.
- id: 99
  category: driver_responsibility
  question: ¿Cuál es un factor de riesgo específico mencionado en el manual para los
    conductores mayores involucrados en choques de vehículos?
  choices:
    A: Es más probable que participen en carreras callejeras.
    B: Son más susceptibles a sufrir lesiones graves.
    C: Es más probable que experimenten furia al volante.
    D: Con frecuencia no utilizan sus señales de giro.
  answer: B
  explanation: El manual señala que las capacidades físicas y mentales cambian con
    la edad, y los conductores mayores pueden ser más susceptibles a sufrir lesiones
    graves en choques de vehículos.
- id: 100
  category: defensive_driving
  question: En la herramienta de resolución de problemas del Ciclo OODA (OODA Loop),
    ¿qué implica el paso 'Orientar' (Orient)?
  choices:
    A: Buscar obstáculos repentinos o cambios en el flujo del tráfico.
    B: Usar su conocimiento y experiencia para comprender qué significa un cambio
      para su seguridad.
    C: Elegir el curso de acción más seguro basado en sus observaciones.
    D: Ejecutar una maniobra física como cambiar de carril o frenar.
  answer: B
  explanation: El paso 'Orientar' del Ciclo OODA implica usar su conocimiento y experiencia
    para comprender qué significa un cambio y cómo afecta su seguridad y la de los
    demás.
- id: 101
  category: defensive_driving
  question: ¿Al utilizar el Ciclo OODA al conducir, cuál es el enfoque principal del
    paso 'Observar'?
  choices:
    A: Decidir si reducir la velocidad o cambiar de carril.
    B: Comprender los riesgos potenciales de una situación.
    C: Notar qué ha cambiado en su entorno, como un automóvil que se desvía.
    D: Comunicar sus intenciones a otros conductores.
  answer: C
  explanation: El paso 'Observar' se enfoca en observar la situación para ver qué
    cambió, como un automóvil desviándose, un obstáculo repentino o un cambio en el
    flujo del tráfico.
- id: 102
  category: safe_driving_rules
  question: ¿Al tomar decisiones y realizar maniobras en la carretera, qué tres cualidades
    debe buscar siempre?
  choices:
    A: Rápido, asertivo y dominante.
    B: Consciente, predecible y fluido.
    C: Cauteloso, vacilante y lento.
    D: Reactivo, espontáneo y rápido.
  answer: B
  explanation: Al aplicar enfoques de resolución de problemas a cualquier situación
    que requiera un cambio, siempre debe aspirar a ser consciente, predecible y fluido.
- id: 103
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un signo de fatiga del conductor?
  choices:
    A: Revisar los espejos con frecuencia.
    B: Mantener una velocidad y posición de carril constantes.
    C: Parpadear con frecuencia o tener los párpados pesados.
    D: Sentarse derecho y mantener la cabeza en alto.
  answer: C
  explanation: Los signos de fatiga incluyen dificultad para concentrarse, parpadear
    con frecuencia, tener los párpados pesados, salirse del carril y tener problemas
    para mantener la cabeza en alto.
- id: 104
  category: defensive_driving
  question: En el contexto del ciclo OODA, ¿qué implica la fase de 'Actuar'?
  choices:
    A: Comprender qué significa un cambio en el flujo del tráfico.
    B: Ejecutar de manera fluida y decisiva la acción elegida.
    C: Elegir el curso de acción más seguro basado en las observaciones.
    D: Buscar un obstáculo repentino o un automóvil desviándose.
  answer: B
  explanation: El manual establece que la fase de 'Actuar' del ciclo OODA requiere
    que usted ejecute de manera fluida y decisiva la acción elegida.
- id: 105
  category: safe_driving_rules
  question: Según el manual, soñar despierto, preocuparse y las emociones fuertes
    son ejemplos de ¿qué tipo de distracción?
  choices:
    A: Distracciones físicas
    B: Distracciones dentro del vehículo
    C: Distracciones mentales
    D: Distracciones fuera del vehículo
  answer: C
  explanation: El manual categoriza soñar despierto, preocuparse y las emociones fuertes
    específicamente como distracciones mentales.
- id: 106
  category: safe_driving_rules
  question: Bajo las leyes de conducción distraída de Washington, ¿quién tiene permitido
    sostener un dispositivo electrónico mientras conduce?
  choices:
    A: Conductores mayores de 21 años.
    B: Conductores con más de 5 años de experiencia.
    C: Conductores que utilizan una aplicación de navegación.
    D: Ningún conductor, independientemente de su edad o experiencia.
  answer: D
  explanation: La ley de Washington establece que no se puede sostener ningún dispositivo
    electrónico mientras se conduce, y esto se aplica a todos los conductores, independientemente
    de su edad o experiencia.
- id: 107
  category: penalties_and_points
  question: ¿Qué puede suceder con las multas por una infracción de conducción distraída
    en Washington después de su primera infracción?
  choices:
    A: Se anulan si toma un curso de seguridad.
    B: Pueden duplicarse.
    C: Se reducen a la mitad.
    D: Siguen siendo las mismas para todas las infracciones posteriores.
  answer: B
  explanation: El manual establece que las multas después de su primera infracción
    por conducción distraída pueden duplicarse.
- id: 108
  category: defensive_driving
  question: ¿Qué tipo de atención se utiliza cuando todo el cerebro se concentra en
    una sola tarea?
  choices:
    A: Atención alternante
    B: Atención dividida
    C: Atención sostenida
    D: Atención focalizada
  answer: D
  explanation: La atención focalizada se define en el manual como el momento en que
    todo el cerebro se concentra en una sola tarea.
- id: 109
  category: defensive_driving
  question: ¿En qué se diferencia el 'escaneo' (scanning) de la 'búsqueda visual'
    al conducir?
  choices:
    A: El escaneo solo implica usar los ojos, mientras que la búsqueda implica mover
      la cabeza.
    B: El escaneo implica mover la cabeza, el cuello y el cuerpo para ver lo más posible.
    C: El escaneo solo se realiza al mirar el tablero.
    D: El escaneo se refiere al uso de sensores electrónicos para detectar peligros.
  answer: B
  explanation: La búsqueda visual significa usar los ojos, mientras que el escaneo
    implica mover también la cabeza, el cuello y el cuerpo para poder ver lo más posible
    alrededor de su vehículo.
- id: 110
  category: defensive_driving
  question: ¿Por qué debería buscar pies, ruedas, sombras y movimiento debajo y alrededor
    de los vehículos estacionados?
  choices:
    A: Para comprobar si los vehículos están estacionados ilegalmente.
    B: Para anticipar situaciones potenciales y evitar frenazos o desvíos de último
      momento.
    C: Para determinar la marca y el modelo de los vehículos estacionados.
    D: Para ver si los vehículos tienen las luces encendidas.
  answer: B
  explanation: Escanear hacia adelante en busca de pies, ruedas, sombras y movimiento
    alrededor de los vehículos estacionados le permite anticipar situaciones potenciales
    y lo prepara para detenerse o cambiar de dirección si es necesario.
- id: 111
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones es esencial revisar el tráfico
    detrás de usted?
  choices:
    A: Al bajar por una colina larga o empinada.
    B: Al acelerar en una autopista recta.
    C: Al esperar en un semáforo en rojo.
    D: Al pasar frente a una valla publicitaria.
  answer: A
  explanation: El manual establece que es esencial mirar hacia atrás cuando cambia
    de carril, gira cruzando un carril para bicicletas, reduce la velocidad, retrocede
    o conduce por una colina larga o empinada.
- id: 112
  category: driver_responsibility
  question: ¿Por qué las multas por tirar basura en Washington son tan severas?
  choices:
    A: Porque tirar basura disminuye el valor de las propiedades locales.
    B: Porque la basura inflamable puede provocar incendios forestales y dañar el
      medio ambiente.
    C: Porque tirar basura causa atascos de tráfico en las principales autopistas.
    D: Porque el estado utiliza las multas por basura para financiar las escuelas
      públicas.
  answer: B
  explanation: Las multas por tirar basura son severas porque la basura inflamable
    o encendida puede provocar incendios forestales, dañando el medio ambiente y causando
    potencialmente víctimas mortales, además de crear riesgos de seguridad.
- id: 113
  category: vehicle_information
  question: ¿Qué gas dañino y potencialmente letal puede liberarse si deja su automóvil
    encendido mientras está estacionado en un garaje?
  choices:
    A: Dióxido de carbono
    B: Óxido de nitrógeno
    C: Monóxido de carbono
    D: Dióxido de azufre
  answer: C
  explanation: Dejar el automóvil encendido mientras está estacionado, especialmente
    en un garaje, puede liberar gases dañinos como el monóxido de carbono, que puede
    ser letal.
- id: 114
  category: vehicle_information
  question: ¿Cuál de las siguientes es una forma recomendada de ayudar a reducir las
    emisiones del vehículo?
  choices:
    A: Mantener los neumáticos ligeramente desinflados.
    B: Acelerar y frenar bruscamente para reducir el tiempo de viaje.
    C: Dejar el motor en ralentí cuando esté estacionado por un tiempo.
    D: Mantener los neumáticos inflados correctamente para un mejor rendimiento de
      combustible.
  answer: D
  explanation: Mantener los neumáticos inflados correctamente para un mejor rendimiento
    de combustible se menciona como un pequeño cambio que puede realizar para ayudar
    a reducir las emisiones del vehículo.
- id: 115
  category: vehicle_information
  question: ¿Qué exige la Ley de Autos Limpios (Clean Car Law) de Washington para
    los vehículos fabricados en 2009 y años posteriores?
  choices:
    A: Deben ser vehículos eléctricos o híbridos.
    B: Deben cumplir con estándares estrictos de aire limpio antes de ser registrados,
      licenciados o vendidos.
    C: Deben tener una eficiencia de combustible mínima de 40 millas por galón.
    D: Deben desecharse en un centro de reciclaje aprobado por el estado después de
      10 años.
  answer: B
  explanation: La Ley de Autos Limpios de Washington exige que los vehículos fabricados
    en 2009 y años posteriores cumplan con estándares estrictos de aire limpio antes
    de que puedan ser registrados, licenciados o vendidos.
- id: 116
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una pregunta que debería hacerse durante una
    autoevaluación de conducción?
  choices:
    A: ¿Llegué a mi destino más rápido de lo esperado?
    B: ¿Fue mi conducción legal, competente y fluida?
    C: ¿Cuántos avisos de tráfico escuché?
    D: ¿Utilicé mi dispositivo de manos libres correctamente?
  answer: B
  explanation: Durante una autoevaluación, debe hacerse preguntas como '¿Fue mi conducción
    legal, competente y fluida?' para ayudar a mejorar y mantener sus habilidades.
- id: 117
  category: safe_driving_rules
  question: ¿A cuál de los siguientes comportamientos son más propensos los conductores
    distraídos?
  choices:
    A: Revisar sus espejos laterales con demasiada frecuencia.
    B: Seguir demasiado de cerca a otros vehículos o ciclistas.
    C: Detenerse demasiado lejos de la línea de parada en las intersecciones.
    D: Ceder el paso innecesariamente.
  answer: B
  explanation: El manual enumera 'Seguir demasiado de cerca a otros vehículos o ciclistas
    en el carril' como un comportamiento al que los conductores distraídos son más
    propensos.
- id: 118
  category: defensive_driving
  question: ¿Qué debe hacer antes de girar para verificar si hay ciclistas o peatones
    que puedan estar a su lado?
  choices:
    A: Tocar la bocina para advertirles.
    B: Revisar sus espejos laterales y mirar por encima del hombro.
    C: Acelerar rápidamente para adelantarse a ellos.
    D: Confiar únicamente en su espejo retrovisor.
  answer: B
  explanation: El manual establece que antes de girar, debe revisar sus espejos laterales
    y mirar por encima del hombro para ver si hay ciclistas o peatones que puedan
    estar a su lado o a punto de cruzar la calle.
- id: 119
  category: sharing_the_road
  question: Cuando un peatón está cruzando la calle, ¿cuándo es seguro que usted continúe?
  choices:
    A: Tan pronto como salgan de su carril.
    B: Cuando hayan despejado su carril y un carril adicional.
    C: Cuando lleguen a la mitad de la calle.
    D: Cuando estén al menos a 10 pies de distancia de su vehículo.
  answer: B
  explanation: El manual establece que debe esperar hasta que un peatón haya despejado
    su carril y un carril adicional antes de continuar.
- id: 120
  category: sharing_the_road
  question: ¿Qué debe hacer si un peatón que usa un perro guía o una silla de ruedas
    está cruzando la calle?
  choices:
    A: Tocar la bocina suavemente para avisarles que usted está allí.
    B: Esperar hasta que hayan despejado su carril y un carril adicional.
    C: Esperar hasta que hayan cruzado completamente la calle antes de continuar.
    D: Conducir alrededor de ellos lentamente.
  answer: C
  explanation: Si el peatón utiliza una silla de ruedas, bastón, perro guía u otro
    animal de servicio, debe esperar hasta que haya cruzado completamente la calle
    antes de continuar.
- id: 121
  category: penalties_and_points
  question: ¿Cuál es la sanción por rebasar un autobús escolar detenido?
  choices:
    A: Se le suspende la licencia por 30 días.
    B: Recibe una advertencia por la primera infracción.
    C: Las multas se duplican.
    D: Debe completar un curso de conducción defensiva.
  answer: C
  explanation: Según el manual, las multas se duplican para cualquier persona que
    rebase un autobús escolar detenido.
- id: 122
  category: safe_driving_rules
  question: 'Cuando viaja en la dirección opuesta a un autobús escolar detenido con
    luces rojas intermitentes, NO es necesario detenerse si:'
  choices:
    A: Se encuentra en una carretera de 2 carriles.
    B: Viaja a menos de 15 mph.
    C: La carretera tiene tres o más carriles.
    D: Se encuentra en una zona escolar.
  answer: C
  explanation: Los conductores que viajan en la dirección opuesta al autobús no necesitan
    detenerse si hay tres o más carriles, o si los carriles están separados por una
    mediana o barrera.
- id: 123
  category: sharing_the_road
  question: ¿Cómo debe reaccionar ante un autobús de tránsito que viaja en la misma
    dirección, que ha señalizado y se está reincorporando a la calzada?
  choices:
    A: Acelerar para rebasar el autobús antes de que se incorpore.
    B: Tocar la bocina para advertir al conductor del autobús.
    C: Ceder el paso al vehículo de tránsito.
    D: Cambiar de carril sin señalizar.
  answer: C
  explanation: Debe ceder el paso a cualquier vehículo de tránsito que viaje en su
    misma dirección, que haya señalizado y se esté reincorporando a la calzada.
- id: 124
  category: vehicle_information
  question: ¿Qué distancia necesita un camión cargado con frenos ajustados correctamente
    que viaja a 55 mph para detenerse por completo?
  choices:
    A: 150 pies
    B: 250 pies
    C: 350 pies
    D: 450 pies
  answer: D
  explanation: Un camión cargado con frenos ajustados correctamente, que viaja a 55
    mph, necesita 450 pies para detenerse por completo.
- id: 125
  category: defensive_driving
  question: Al incorporarse delante de un vehículo grande, ¿cuánto espacio debe dejar?
  choices:
    A: El suficiente para ver su parachoques delantero en su espejo lateral.
    B: Esperar hasta que pueda ver claramente ambos faros delanteros en su espejo
      retrovisor.
    C: Al menos la longitud de un automóvil por cada 10 mph de velocidad.
    D: Esperar hasta estar al menos a 100 pies por delante del camión.
  answer: B
  explanation: Al entrar en el tráfico delante de un vehículo grande, espere hasta
    que pueda ver claramente ambos faros delanteros en su espejo retrovisor antes
    de incorporarse delante de ellos.
- id: 126
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en la zona ciega de un vehículo
    grande?
  choices:
    A: No puede ver los espejos del conductor.
    B: Se encuentra a menos de 50 pies de la parte trasera del camión.
    C: Las luces direccionales del camión están parpadeando.
    D: Está conduciendo en el carril izquierdo.
  answer: A
  explanation: Si está cerca de un vehículo grande y no puede ver los espejos del
    conductor, el conductor no puede verlo a usted porque se encuentra en su zona
    ciega.
- id: 127
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a compartir
    el carril con una motocicleta?
  choices:
    A: Puede compartir un carril si la motocicleta circula muy hacia un lado.
    B: Puede compartir un carril si el carril es excepcionalmente ancho.
    C: Nunca debe entrar en el mismo carril al lado de un motociclista.
    D: Puede compartir un carril solo al rebasar a bajas velocidades.
  answer: C
  explanation: Los motociclistas tienen derecho al mismo ancho de carril que todos
    los demás vehículos. Nunca debe entrar en el mismo carril al lado de un motociclista,
    incluso si el carril es ancho.
- id: 128
  category: vehicle_information
  question: ¿Por qué podrían NO ser visibles las luces de freno de un motociclista
    cuando está reduciendo la velocidad?
  choices:
    A: Las luces de freno de las motocicletas suelen ser demasiado pequeñas para verse.
    B: Podrían estar usando el acelerador para reducir la velocidad en lugar de sus
      frenos.
    C: Las luces de freno de las motocicletas solo se activan al detenerse por completo.
    D: Las luces de freno suelen estar ocultas por el conductor.
  answer: B
  explanation: Al reducir la velocidad, los motociclistas podrían usar el acelerador
    y no sus frenos, por lo que las luces de freno no serían visibles.
- id: 129
  category: sharing_the_road
  question: ¿Cuál es la cantidad mínima de espacio que debe dejar entre su vehículo
    y un ciclista al conducir detrás de él o al rebasarlo?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: Cuando conduce detrás de un ciclista o lo rebasa, debe dejar al menos
    3 pies de espacio entre el ciclista y la parte más ancha de su vehículo.
- id: 130
  category: safe_driving_rules
  question: ¿Cómo son tratados los ciclistas por la ley cuando están en un cruce peatonal?
  choices:
    A: Se consideran vehículos motorizados.
    B: Deben ceder el paso a todo el tráfico vehicular.
    C: Se consideran peatones.
    D: No se les permite estar en los cruces peatonales.
  answer: C
  explanation: Los ciclistas en los cruces peatonales se consideran peatones. Debe
    cederles el paso tanto en cruces peatonales e intersecciones marcadas como no
    marcadas.
- id: 131
  category: sharing_the_road
  question: ¿Cuánto espacio necesitan los vehículos grandes al navegar por una glorieta?
  choices:
    A: 1 carril de espacio
    B: 2 carriles de espacio
    C: 3 carriles de espacio
    D: No se les permite circular en glorietas
  answer: B
  explanation: Para evitar golpear algo, los vehículos grandes pueden requerir más
    de un carril para completar un giro, y necesitan 2 carriles de espacio en una
    glorieta.
- id: 132
  category: safe_driving_rules
  question: ¿Se le permite usar un carril central de giro para rebasar a un autobús
    escolar detenido con luces rojas intermitentes?
  choices:
    A: Sí, si no viene tráfico en sentido contrario.
    B: Sí, pero solo si viaja a menos de 15 mph.
    C: No, los conductores en todos los carriles de giro deben detenerse.
    D: No, a menos que el conductor del autobús escolar le indique que pase.
  answer: C
  explanation: No use un carril central de giro para rebasar a un autobús escolar.
    Los conductores en todos los carriles de giro deben detenerse cuando las luces
    rojas parpadean y la señal de alto está extendida.
- id: 133
  category: defensive_driving
  question: ¿Cómo podrían afectar a un motociclista las irregularidades en la superficie
    de la carretera, como la grava o las juntas del pavimento?
  choices:
    A: No tienen ningún efecto en las motocicletas debido a sus neumáticos especializados.
    B: Pueden obligar a un motociclista a cambiar de velocidad o de posición en el
      carril.
    C: Causan que las señales de giro de la motocicleta funcionen mal.
    D: Requieren que el motociclista se retire por completo de la carretera.
  answer: B
  explanation: Las superficies de carretera con baches e irregularidades como grava,
    escombros y juntas de pavimento pueden obligar a un motociclista a cambiar de
    velocidad o de posición en el carril.
- id: 134
  category: sharing_the_road
  question: ¿Cuánto espacio debe dejar entre su vehículo y un ciclista al rebasarlo?
  choices:
    A: Al menos 2 pies
    B: Al menos 3 pies
    C: Al menos 4 pies
    D: Al menos 5 pies
  answer: B
  explanation: El manual establece dejar al menos 3 pies entre el ciclista y la parte
    más ancha de su vehículo al rebasar.
- id: 135
  category: sharing_the_road
  question: ¿Qué debe hacer si se está preparando para girar a la derecha y hay un
    ciclista delante de usted?
  choices:
    A: Acelerar y rebasar al ciclista justo antes del giro.
    B: Tocar la bocina para advertir al ciclista que se mueva.
    C: Dejar que el ciclista despeje la intersección antes de realizar el giro.
    D: Moverse al carril de bicicletas para bloquear al ciclista antes de girar.
  answer: C
  explanation: 'El manual instruye a los conductores a dejar que el ciclista despeje
    la intersección antes de realizar un giro, y señala específicamente: "Si va a
    girar a la derecha, no rebase a un ciclista justo antes del giro".'
- id: 136
  category: sharing_the_road
  question: ¿Cuándo se le permite conducir en un carril para bicicletas marcado?
  choices:
    A: Al rebasar a un vehículo más lento por la derecha.
    B: Solo al girar o al cruzar el carril para estacionarse cerca del bordillo.
    C: Siempre que no haya ciclistas usando el carril en ese momento.
    D: Cuando necesite detenerse para dejar a un pasajero.
  answer: B
  explanation: Según el manual, debe "conducir en los carriles para bicicletas solo
    al girar o al cruzar el carril para estacionarse cerca del bordillo".
- id: 137
  category: sharing_the_road
  question: Cuando se acerca un tren, ¿cuál es la distancia de parada requerida desde
    el riel más cercano de un cruce?
  choices:
    A: Entre 10 y 30 pies
    B: Entre 15 y 50 pies
    C: Entre 20 y 60 pies
    D: Al menos 100 pies
  answer: B
  explanation: El manual requiere que los conductores se "detengan entre 15 y 50 pies
    de distancia del riel más cercano de un cruce" cuando una señal está parpadeando
    o se acerca un tren.
- id: 138
  category: sharing_the_road
  question: ¿Qué es lo primero que debe hacer si su vehículo se queda atascado en
    las vías del tren en un cruce?
  choices:
    A: Permanecer en el vehículo y llamar a una grúa.
    B: Intentar empujar el vehículo fuera de las vías usted mismo.
    C: Hacer que todos salgan del vehículo inmediatamente.
    D: Esperar a ver si las luces del cruce comienzan a parpadear.
  answer: C
  explanation: 'El manual establece explícitamente: "Si su vehículo se queda atascado
    en un cruce, haga que todos salgan de inmediato".'
- id: 139
  category: sharing_the_road
  question: ¿Qué identifica a un vehículo agrícola o de granja diseñado para viajar
    a 25 mph o menos?
  choices:
    A: Luces estroboscópicas amarillas intermitentes en el techo
    B: Una señal naranja cuadrada en los laterales
    C: Una señal o emblema triangular en la parte trasera
    D: Un cartel de "Movimiento Lento" en la puerta trasera
  answer: C
  explanation: El manual establece que "los vehículos agrícolas y de granja diseñados
    para ir a 25 mph o menos tendrán una señal o emblema triangular en la parte trasera".
- id: 140
  category: sharing_the_road
  question: ¿Cómo debe reaccionar cuando ve o escucha un vehículo de emergencia con
    sus luces y sirenas activadas?
  choices:
    A: Acelerar para mantenerse por delante del vehículo de emergencia.
    B: Moverse al carril izquierdo y reducir la velocidad.
    C: Detenerse inmediatamente en su carril actual.
    D: Dirigir inmediatamente su vehículo hacia el lado derecho de la carretera y
      deténgase.
  answer: D
  explanation: 'El manual instruye: "Tan pronto como vea o escuche las señales, dirija
    inmediatamente su vehículo hacia el lado derecho de la carretera y deténgase".'
- id: 141
  category: safe_driving_rules
  question: ¿Cuando se viaja por una carretera con varios carriles en la misma dirección,
    para qué se utiliza principalmente el carril izquierdo?
  choices:
    A: Viaje compartido (Carpooling)
    B: Viajar al límite de velocidad
    C: Rebasar el tráfico más lento
    D: Solo para vehículos de emergencia
  answer: C
  explanation: 'El manual establece: "Manténgase a la derecha excepto para rebasar.
    Cuando haya varios carriles que circulen en la misma dirección, conduzca por el
    carril derecho. Utilice el carril izquierdo para rebasar el tráfico más lento".'
- id: 142
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su giro o salida en una autopista?
  choices:
    A: Detenerse en el arcén y retroceder con cuidado hasta la salida.
    B: Siga avanzando, ya que es ilegal retroceder en un arcén o autopista.
    C: Detenerse en el carril derecho y esperar a que el tráfico se despeje antes
      de dar marcha atrás.
    D: Hacer un giro en U a través de la mediana.
  answer: B
  explanation: 'El manual establece: "Siga avanzando. No conduzca en reversa en la
    carretera, incluso si se pasa de su giro o salida. Es ilegal retroceder en un
    arcén o autopista".'
- id: 143
  category: signs_and_signals
  question: ¿Quién tiene la autoridad para anular las señales de tráfico?
  choices:
    A: Cualquier conductor con licencia en una emergencia
    B: Peatones en un paso de peatones marcado
    C: Agentes de la ley, trabajadores de la construcción y guardias de cruce escolar
    D: Conductores de vehículos motorizados comerciales
  answer: C
  explanation: El manual señala que "los agentes de la ley, los trabajadores de la
    construcción, el personal de mantenimiento y los guardias de cruce escolar pueden
    dirigir el tráfico. Estas personas pueden anular las señales de tráfico, y sus
    órdenes o instrucciones deben seguirse".
- id: 144
  category: signs_and_signals
  question: ¿Cómo debe proceder si se acerca a una intersección donde el semáforo
    está averiado y no funciona?
  choices:
    A: Trate la intersección como una parada de cuatro vías (four-way stop).
    B: Ceda el paso al tráfico a su izquierda.
    C: Continúe por la intersección sin detenerse si la carretera está despejada.
    D: Espere a que lleguen los agentes de la ley antes de cruzar.
  answer: A
  explanation: 'El manual establece: "Si un semáforo no funciona, trate la intersección
    como una parada de cuatro vías. Deténgase por completo. Ceda el paso al tráfico
    a su derecha".'
- id: 145
  category: signs_and_signals
  question: ¿Bajo qué condición se le permite girar a la izquierda con un semáforo
    en rojo fijo?
  choices:
    A: Nunca puede girar a la izquierda con luz roja.
    B: Al girar hacia una calle de sentido único, si no hay ninguna señal que lo prohíba
      y tiene espacio.
    C: Al girar desde una calle de sentido único hacia una calle de doble sentido.
    D: Solo entre las horas de medianoche y las 5 AM.
  answer: B
  explanation: El manual explica que "después de detenerse por completo en una luz
    roja, puede girar a la izquierda hacia una calle de sentido único si no ve una
    señal de 'no girar en rojo' y tiene suficiente espacio para incorporarse al tráfico".
- id: 146
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico amarilla intermitente?
  choices:
    A: Deténgase y espere a la luz verde.
    B: La luz está a punto de ponerse roja.
    C: Tiene el mismo significado que una señal de ceda el paso; reduzca la velocidad
      y proceda cuando tenga el derecho de paso.
    D: Debe detenerse por completo antes de continuar.
  answer: C
  explanation: 'El manual establece: "Una luz amarilla intermitente tiene el mismo
    significado que una señal de ceda el paso. Trate la intersección como una intersección
    no controlada. Proceda cuando tenga el derecho de paso".'
- id: 147
  category: signs_and_signals
  question: ¿Qué tipo de información indica una señal de tráfico naranja?
  choices:
    A: Acción prohibitiva o restringida
    B: Advertencia de construcción y mantenimiento
    C: Servicios viales más adelante
    D: Advertencia de zona escolar
  answer: B
  explanation: De acuerdo con la sección de señales del manual, "Naranja = Advertencia
    de construcción y mantenimiento".
- id: 148
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico de color amarillo verdoso fluorescente?
  choices:
    A: Advertencia de construcción y mantenimiento
    B: Guía de servicios para el automovilista
    C: Advertencia de actividad escolar, peatonal y de ciclistas
    D: Áreas recreativas públicas y culturales
  answer: C
  explanation: Según el manual, las señales de color amarillo verdoso fluorescente
    advierten sobre la actividad escolar, peatonal y de ciclistas.
- id: 149
  category: signs_and_signals
  question: ¿De qué color son las señales que proporcionan guía de servicios para
    el automovilista, como la ubicación de hospitales o áreas de descanso?
  choices:
    A: Verde
    B: Azul
    C: Marrón
    D: Blanco
  answer: B
  explanation: El manual establece que las señales azules proporcionan guía de servicios
    para el automovilista.
- id: 150
  category: safe_driving_rules
  question: ¿Puede recibir una multa por exceso de velocidad si conduce por debajo
    del límite de velocidad indicado?
  choices:
    A: No, siempre que conduzca por debajo del límite indicado.
    B: Sí, pero solo si conduce en una zona escolar.
    C: Sí, puede recibir una multa por viajar demasiado rápido para las condiciones
      de la carretera.
    D: No, los límites de velocidad son mínimos absolutos.
  answer: C
  explanation: El manual señala que incluso si conduce por debajo del límite de velocidad
    indicado, puede recibir una multa por viajar demasiado rápido para las condiciones
    de la carretera, como cuando está resbaladiza o hay niebla.
- id: 151
  category: penalties_and_points
  question: ¿Las cámaras automáticas de seguridad vial registran automáticamente imágenes
    de cuál de las siguientes infracciones?
  choices:
    A: No usar la señal de giro
    B: Conducir sin cinturón de seguridad
    C: Exceder el límite de velocidad en una zona escolar
    D: Hacer un giro en U ilegal
  answer: C
  explanation: Las cámaras automáticas de seguridad vial registran imágenes si usted
    no se detiene ante una luz roja continua, no se detiene ante una señal de cruce
    de ferrocarril o excede el límite de velocidad en una zona escolar.
- id: 152
  category: signs_and_signals
  question: ¿Qué significa una señal cuadrada con una línea horizontal blanca dentro
    de un círculo?
  choices:
    A: No entrar (Do Not Enter)
    B: Sentido contrario (Wrong Way)
    C: Zona de no adelantar
    D: Pare adelante
  answer: A
  explanation: Una señal cuadrada con una línea horizontal blanca dentro de un círculo
    es una señal de "No entrar" (Do Not Enter), lo que significa que no puede entrar
    a la calle desde esa dirección.
- id: 153
  category: safe_driving_rules
  question: ¿Cuál es el uso adecuado de un carril central compartido?
  choices:
    A: Adelantar vehículos que circulan despacio
    B: Tráfico directo durante la hora pico
    C: Vehículos que giran a la izquierda desde cualquier dirección
    D: Solo vehículos de emergencia
  answer: C
  explanation: Una señal de carril central compartido solo para girar a la izquierda
    indica un carril reservado para vehículos que giran a la izquierda desde cualquier
    dirección y no debe usarse para tráfico directo o para adelantar.
- id: 154
  category: penalties_and_points
  question: ¿Qué sucede con las multas por infracciones cometidas al conducir en una
    zona de construcción cuando hay trabajadores presentes?
  choices:
    A: Se exoneran para quienes cometen la infracción por primera vez
    B: Siguen siendo las mismas que las multas regulares
    C: Se reducen a la mitad
    D: Se duplican
  answer: D
  explanation: El manual establece explícitamente que las multas se duplican por las
    infracciones cometidas al conducir en zonas de construcción cuando hay trabajadores
    presentes.
- id: 155
  category: sharing_the_road
  question: Según el manual, ¿cuál de los siguientes se considera legalmente un cruce
    de peatones?
  choices:
    A: Solo las intersecciones con líneas blancas pintadas
    B: Cada intersección, ya sea marcada o no marcada
    C: Solo las intersecciones con señales de cruce de peatones
    D: Solo los cruces a mitad de cuadra
  answer: B
  explanation: El manual establece que cada intersección es legalmente un cruce de
    peatones, ya sea que esté marcada o no.
- id: 156
  category: defensive_driving
  question: ¿Qué debe hacer si se detiene en una línea de parada pero su vista de
    la calle transversal está bloqueada?
  choices:
    A: Acelerar rápidamente a través de la intersección para minimizar el tiempo en
      la zona de peligro
    B: Tocar la bocina y avanzar a su velocidad normal
    C: Avanzar lentamente hacia adelante hasta que pueda ver
    D: Retroceder y elegir una ruta diferente
  answer: C
  explanation: Si se detiene en la línea de parada pero su vista de una calle transversal
    está bloqueada, debe avanzar lentamente hacia adelante hasta que pueda ver. Esto
    permite que los conductores que cruzan vean la parte delantera de su vehículo.
- id: 157
  category: safe_driving_rules
  question: Si dos vehículos llegan a una parada de cuatro vías aproximadamente al
    mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo a la izquierda
    B: El vehículo a la derecha
    C: El vehículo que viaja más rápido
    D: El vehículo que gira a la izquierda
  answer: B
  explanation: En una parada de cuatro vías, si dos vehículos llegan aproximadamente
    al mismo tiempo, debe ceder el paso al vehículo de la derecha.
- id: 158
  category: safe_driving_rules
  question: En una parada de cuatro vías, ¿qué debe hacer un vehículo que gira a la
    izquierda?
  choices:
    A: Ceder el derecho de paso a los vehículos que siguen recto o giran a la derecha
    B: Avanzar primero antes que todo el resto del tráfico
    C: Ceder el paso solo a los peatones, pero no a otros vehículos
    D: Esperar hasta que la intersección esté completamente despejada de todos los
      autos
  answer: A
  explanation: El manual establece que en una parada de cuatro vías, cualquier vehículo
    que gire a la izquierda debe ceder el derecho de paso a los vehículos que siguen
    recto o giran a la derecha.
- id: 159
  category: safe_driving_rules
  question: Al girar a la izquierda o a la derecha en una intersección, ¿en qué carril
    debe entrar?
  choices:
    A: El carril más alejado de la dirección de la que viene
    B: El carril central
    C: El carril más cercano a la dirección de la que viene
    D: Cualquier carril disponible
  answer: C
  explanation: Ya sea que gire a la izquierda o a la derecha en una intersección,
    la ley estatal exige que gire en el carril más cercano a la dirección de la que
    proviene.
- id: 160
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe poner su señal de giro antes de girar a
    la izquierda o a la derecha a través del tráfico que viene en sentido contrario?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: Debe poner su señal de giro al menos 100 pies antes de girar a la izquierda
    o a la derecha a través del tráfico que viene en sentido contrario.
- id: 161
  category: safe_driving_rules
  question: En Washington, ¿cuándo se permiten generalmente los giros en U?
  choices:
    A: Solo en intersecciones de cuatro vías
    B: Solo cuando una señal lo permite explícitamente
    C: A menos que haya una señal que indique que el giro en U no está permitido
    D: Solo en autopistas divididas
  answer: C
  explanation: En Washington, los giros en U generalmente están permitidos a menos
    que haya una señal que indique que el giro en U no está permitido.
- id: 162
  category: safe_driving_rules
  question: ¿Dónde NO debe realizar un giro en U debido a las reglas de visibilidad?
  choices:
    A: En un vecindario residencial
    B: En una curva o al acercarse a la cima de una colina
    C: En una intersección en T
    D: En una calle de sentido único
  answer: B
  explanation: Debe tener visibilidad clara en todas las direcciones antes de realizar
    un giro en U. Por esa razón, no realice un giro en U en una curva o al acercarse
    a la cima de una colina.
- id: 163
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en un cruce a mitad de cuadra con un paso
    de peatones marcado?
  choices:
    A: Los vehículos que viajan al límite de velocidad indicado
    B: Los peatones
    C: Los ciclistas solo si se bajan de la bicicleta
    D: Los vehículos, a menos que haya una señal de alto
  answer: B
  explanation: Según el manual, los peatones siempre tienen el derecho de paso en
    un paso de peatones marcado en un cruce a mitad de cuadra, y los conductores deben
    detenerse independientemente de si hay una señal de alto (STOP).
- id: 164
  category: safe_driving_rules
  question: ¿Cómo debe reaccionar ante vehículos grandes, como camiones de bomberos
    o camiones de reparto, que circulan por una glorieta de moderación de tráfico?
  choices:
    A: Tocar la bocina para avisarles que usted tiene el derecho de paso
    B: Rebasarlos por el lado derecho
    C: Darles suficiente espacio, ya que podrían tener que circular en el sentido
      de las agujas del reloj para pasar
    D: Seguir muy de cerca al vehículo para pasar por la glorieta más rápido
  answer: C
  explanation: El manual indica que se debe dar suficiente espacio a los vehículos
    más grandes y tener en cuenta que podrían tener que circular en el sentido de
    las agujas del reloj para pasar por una glorieta de moderación de tráfico.
- id: 165
  category: safe_driving_rules
  question: ¿Cuál es la velocidad de diseño para conducir en una rotonda?
  choices:
    A: De 10 a 15 mph
    B: De 15 a 25 mph
    C: De 25 a 35 mph
    D: De 30 a 40 mph
  answer: B
  explanation: El manual establece que las rotondas están diseñadas para velocidades
    entre 15 y 25 mph.
- id: 166
  category: sharing_the_road
  question: ¿Cómo debe circular un ciclista por una rotonda cuando decide navegarla
    como un vehículo?
  choices:
    A: Circular por la berma para camiones (truck apron)
    B: Circular por el borde derecho del carril
    C: Circular por el centro del carril para aumentar la visibilidad
    D: Circular en sentido contrario al tráfico
  answer: C
  explanation: Al circular como un vehículo en una rotonda, los ciclistas deben ir
    por el centro del carril para aumentar su visibilidad ante los conductores.
- id: 167
  category: safe_driving_rules
  question: ¿Cuál es la principal ventaja de una intersección de diamante divergente?
  choices:
    A: Permite que los vehículos giren a la izquierda hacia la autopista sin detenerse
      ni ceder el paso al tráfico que viene en sentido contrario.
    B: Permite que los vehículos viajen a velocidades de autopista a través de intersecciones
      locales.
    C: Proporciona un carril exclusivo solo para giros en U.
    D: Elimina la necesidad de pasos de peatones.
  answer: A
  explanation: La principal ventaja de un diamante divergente es que le permite realizar
    giros a la izquierda hacia la autopista sin detenerse ni ceder el paso al tráfico
    que viene en sentido contrario.
- id: 168
  category: safe_driving_rules
  question: En una intersección no controlada, ¿en cuál de las siguientes situaciones
    debe ceder el derecho de paso?
  choices:
    A: Está entrando a una carretera pavimentada desde una carretera no pavimentada.
    B: Usted viaja en línea recta y un vehículo está girando a la izquierda frente
      a usted.
    C: Usted está en una carretera estatal y un vehículo está cruzando desde una carretera
      secundaria.
    D: Está entrando a una carretera no pavimentada desde una carretera pavimentada.
  answer: A
  explanation: En intersecciones no controladas, debe ceder el derecho de paso si
    entra a una carretera pavimentada desde una carretera no pavimentada.
- id: 169
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas más cortas en la calzada?
  choices:
    A: Hay un carril reversible más adelante.
    B: El carril está terminando y deberá incorporarse o salir.
    C: Se está acercando a una cabina de peaje.
    D: Está entrando en una zona escolar.
  answer: B
  explanation: Las líneas blancas discontinuas más cortas significan que el carril
    está terminando y usted tendrá que incorporarse o salir.
- id: 170
  category: signs_and_signals
  question: ¿Qué indica una línea blanca sólida doble entre carriles?
  choices:
    A: Puede cruzar para cambiar de carril si es seguro.
    B: Es una barrera entre carriles y es ilegal cruzarla.
    C: El carril está reservado solo para vehículos compartidos (carpools).
    D: Se encuentra en un carril central compartido para giros.
  answer: B
  explanation: Las líneas blancas sólidas dobles son una barrera entre carriles y
    es ilegal cruzarlas.
- id: 171
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima que se le permite recorrer en un carril central
    compartido para girar?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: No debe recorrer más de 300 pies en un carril central para girar.
- id: 172
  category: signs_and_signals
  question: ¿Qué símbolo se utiliza en las señales y el pavimento para identificar
    los carriles para vehículos de alta ocupación (HOV)?
  choices:
    A: Un círculo blanco
    B: Un triángulo amarillo
    C: Un símbolo de diamante
    D: Un cuadrado verde
  answer: C
  explanation: Los carriles HOV se identifican mediante el símbolo de diamante en
    las señales y en el pavimento.
- id: 173
  category: signs_and_signals
  question: Al conducir en un carril reversible, ¿qué significa una X amarilla fija
    en la señal elevada?
  choices:
    A: Puede usar el carril de manera segura.
    B: El carril está reservado solo para autobuses de tránsito.
    C: El carril está cambiando de dirección y debe salirse tan pronto como sea seguro.
    D: Debe detenerse inmediatamente.
  answer: C
  explanation: Una X amarilla fija significa que el carril está cambiando de dirección
    y usted debe salirse del carril tan pronto como sea seguro.
- id: 174
  category: safe_driving_rules
  question: Al entrar en una rotonda, ¿hacia qué dirección debe mirar para ceder el
    paso al tráfico que ya está en el círculo?
  choices:
    A: Derecha
    B: Izquierda
    C: Recto hacia adelante
    D: En su espejo retrovisor
  answer: B
  explanation: Al entrar en una rotonda, debe mirar a la izquierda y ceder el paso
    a todo el tráfico que ya esté en la rotonda, ya que ellos tienen el derecho de
    paso.
- id: 175
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a conducir sobre o a través de una mediana?
  choices:
    A: Está permitido si está haciendo un giro en U.
    B: Es ilegal conducir dentro, sobre o a través de las medianas.
    C: Se permite solo si la mediana es un espacio abierto.
    D: Se permite si está adelantando a un vehículo lento.
  answer: B
  explanation: El manual establece explícitamente que es ilegal conducir dentro, sobre
    o a través de las medianas.
- id: 176
  category: signs_and_signals
  question: Si conduce por una carretera de doble sentido con una línea amarilla continua
    y una línea amarilla discontinua en el centro, ¿cuándo se le permite adelantar?
  choices:
    A: Puede adelantar en cualquier momento si no hay tráfico en sentido contrario.
    B: Puede adelantar solo si la línea amarilla continua está de su lado de la carretera.
    C: Puede adelantar si la línea discontinua está de su lado de la carretera y es
      seguro hacerlo.
    D: Nunca se le permite adelantar en este tipo de carretera.
  answer: C
  explanation: Si la línea discontinua está de su lado de la carretera, puede adelantar
    si es seguro hacerlo. No se le permite adelantar cuando la línea amarilla continua
    está de su lado.
- id: 177
  category: safe_driving_rules
  question: ¿Existe legalmente un cruce de peatones en cada intersección, incluso
    si no está marcado?
  choices:
    A: No, los cruces de peatones deben estar marcados con líneas blancas continuas.
    B: Sí, cada intersección se define legalmente como un cruce de peatones independientemente
      de las marcas.
    C: No, los cruces de peatones solo están presentes donde hay luces en el pavimento.
    D: Sí, pero solo en zonas escolares designadas.
  answer: B
  explanation: Según el manual, no todos los cruces de peatones están marcados, y
    cada intersección se define legalmente como un cruce de peatones, independientemente
    de si hay una marca de cruce de peatones presente.
- id: 178
  category: sharing_the_road
  question: ¿Qué indica una zona de amortiguamiento que consiste en dos líneas blancas
    continuas con sombreado diagonal entre un carril de circulación y un carril para
    bicicletas?
  choices:
    A: Es un área de estacionamiento designada para bicicletas.
    B: Es un carril de adelantamiento para vehículos motorizados.
    C: Es parte del carril para bicicletas y no se debe entrar en él a menos que se
      realice un giro legal.
    D: Es una zona de seguridad para peatones.
  answer: C
  explanation: El manual establece que esta zona de amortiguamiento se considera parte
    del carril para bicicletas y no se debe entrar en ella a menos que esté realizando
    un giro legal después de verificar que es seguro hacerlo.
- id: 179
  category: sharing_the_road
  question: Al adelantar a una bicicleta en un carril marcado con flechas compartidas
    (sharrows), ¿cuánto espacio debe dejar?
  choices:
    A: Al menos 2 pies
    B: Al menos 3 pies
    C: Al menos 4 pies
    D: Al menos 5 pies
  answer: B
  explanation: Si ve marcas de flechas compartidas (sharrows), debe conducir despacio
    y dejar al menos 3 pies de espacio al adelantar.
- id: 180
  category: sharing_the_road
  question: ¿Cuál es la regla con respecto a girar a la derecha en rojo cerca de una
    caja para bicicletas (bicycle box)?
  choices:
    A: Puede girar a la derecha en rojo si cede el paso a las bicicletas.
    B: No puede girar a la derecha en rojo cerca de una caja para bicicletas.
    C: Puede girar a la derecha en rojo solo si la caja para bicicletas está vacía.
    D: Debe tocar la bocina antes de girar a la derecha en rojo.
  answer: B
  explanation: 'El manual establece explícitamente: "No puede girar a la derecha en
    rojo cerca de una caja para bicicletas. Manténgase detrás de la línea blanca hasta
    que la caja para bicicletas esté despejada".'
- id: 181
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una zona escolar?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El límite de velocidad en una zona escolar es de 20 mph porque las
    velocidades más altas aumentan el riesgo de accidentes fatales.
- id: 182
  category: safe_driving_rules
  question: Al acercarse a una zona de emergencia con un vehículo de respuesta en
    la carretera que utiliza luces intermitentes, ¿qué debe hacer si no puede cambiarse
    a un carril más alejado?
  choices:
    A: Mantener su velocidad y tocar la bocina.
    B: Detenerse por completo hasta que el vehículo de emergencia apague sus luces.
    C: Reducir la velocidad a por lo menos 10 mph por debajo del límite de velocidad
      establecido.
    D: Acelerar para pasar la zona de emergencia rápidamente.
  answer: C
  explanation: Tan pronto como vea un vehículo de respuesta en la carretera con luces
    intermitentes, debe cambiarse a un carril más alejado o reducir la velocidad a
    por lo menos 10 mph por debajo del límite de velocidad establecido.
- id: 183
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima a la que se le permite conducir en una zona
    de emergencia?
  choices:
    A: 30 mph
    B: 40 mph
    C: 50 mph
    D: 60 mph
  answer: C
  explanation: El manual establece que nunca debe conducir a más de 50 mph en una
    zona de emergencia.
- id: 184
  category: safe_driving_rules
  question: ¿A qué distancia de un semáforo, señal de alto (stop) o señal de ceda
    el paso (yield) debe estacionar su vehículo?
  choices:
    A: Al menos 15 pies
    B: Al menos 20 pies
    C: Al menos 30 pies
    D: Al menos 50 pies
  answer: C
  explanation: No debe estacionarse a menos de 30 pies de un semáforo, señal de alto
    o señal de ceda el paso.
- id: 185
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios es ilegal estacionarse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: El manual establece que no debe estacionarse a menos de 15 pies de
    un hidrante de incendios.
- id: 186
  category: safe_driving_rules
  question: Cuando se estaciona en paralelo al bordillo (acera), ¿su vehículo no debe
    estar a más de cuántas pulgadas del bordillo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: No se permite estacionar a más de 12 pulgadas del bordillo.
- id: 187
  category: defensive_driving
  question: ¿Para qué se utiliza el método "Dutch Reach" (alcance holandés)?
  choices:
    A: Maniobrar el volante con una mano mientras retrocede.
    B: Abrir la puerta de su vehículo con la mano más alejada de la puerta para ver
      a los ciclistas que se acercan.
    C: Alcanzar el freno de mano en una emergencia.
    D: Indicar un giro cuando las luces direccionales de su vehículo no funcionan.
  answer: B
  explanation: El método "Dutch Reach" consiste en abrir la puerta con la mano que
    está más alejada de ella. Esto obliga a su cuerpo a girar, lo que le permite ver
    a los ciclistas que se aproximan.
- id: 188
  category: driver_responsibility
  question: 'Es un delito dejar a un niño desatendido en un vehículo estacionado mientras
    el motor está en marcha si tiene menos de:'
  choices:
    A: 10 años
    B: 12 años
    C: 14 años
    D: 16 años
  answer: D
  explanation: Es un delito dejar a un niño menor de 16 años desatendido en un vehículo
    estacionado mientras el motor está en marcha.
- id: 189
  category: signs_and_signals
  question: Al estacionar, ¿qué indica un bordillo (acera) pintado de blanco?
  choices:
    A: Solo se permiten paradas cortas.
    B: Es una zona de carga.
    C: El estacionamiento está reservado para vehículos de emergencia.
    D: Se permite estacionar hasta por 2 horas.
  answer: A
  explanation: Las señales o los bordillos pintados pueden indicar otras restricciones
    de estacionamiento. El blanco significa que solo se permiten paradas cortas.
- id: 190
  category: safe_driving_rules
  question: ¿A cuántos pies de una entrada para autos (driveway), callejón o camino
    privado no debe estacionarse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: A
  explanation: El manual establece que no debe estacionarse a menos de 5 pies de una
    entrada para autos, callejón o camino privado.
- id: 191
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima a la que puede estar su vehículo del bordillo
    (acera) cuando se estaciona en paralelo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Al ajustar su vehículo en un espacio de estacionamiento en paralelo,
    debe asegurarse de que su vehículo no esté a más de 12 pulgadas del bordillo.
- id: 192
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante cuando se estaciona cuesta arriba
    junto a un bordillo (acera) alto?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Mantener las ruedas rectas
    D: Hacia el centro de la carretera
  answer: B
  explanation: En colinas con bordillos altos, gire el volante en dirección contraria
    al bordillo hasta que la parte posterior de la llanta delantera toque el bordillo.
    Si su vehículo comienza a rodar, rodará hacia atrás contra el bordillo.
- id: 193
  category: safe_driving_rules
  question: Al estacionar cuesta abajo, ¿cómo debe posicionar el volante?
  choices:
    A: Gírelo hacia el bordillo
    B: Gírelo en dirección contraria al bordillo
    C: Mantenga las ruedas perfectamente rectas
    D: Gírelo hacia la línea central
  answer: A
  explanation: Cuando esté cuesta abajo, gire el volante hacia el bordillo hasta que
    la parte delantera de la llanta delantera toque el bordillo, de modo que ruede
    hacia adelante contra el bordillo si comienza a moverse.
- id: 194
  category: safe_driving_rules
  question: ¿Por qué debe evitar colgar un cartel de estacionamiento para personas
    con discapacidad en su espejo retrovisor mientras conduce?
  choices:
    A: Es una distracción para otros conductores
    B: Obstruirá su visión
    C: Puede dañar el espejo
    D: Solo es válido cuando se coloca en el tablero
  answer: B
  explanation: 'El manual establece: ''No cuelgue el cartel de estacionamiento de
    su espejo retrovisor mientras conduce porque obstruirá su visión''.'
- id: 195
  category: safe_driving_rules
  question: ¿Cuál es el propósito de las franjas blancas junto a un espacio de estacionamiento
    reservado para personas con discapacidad?
  choices:
    A: Indican un cruce de peatones
    B: Son un pasillo de acceso que debe mantenerse despejado
    C: Marcan un área para el estacionamiento de motocicletas
    D: Muestran dónde deben colocarse los carritos de compra
  answer: B
  explanation: Las franjas blancas junto a un espacio reservado se denominan pasillo
    de acceso y deben mantenerse despejadas. Puede ser multado por bloquearlo.
- id: 196
  category: safe_driving_rules
  question: ¿Cuándo es legal estacionar un vehículo en una estación de carga para
    vehículos eléctricos?
  choices:
    A: En cualquier momento si conduce un vehículo eléctrico
    B: Solo por un máximo de 30 minutos
    C: Solo si el vehículo está conectado al equipo de carga
    D: Solo los fines de semana y días festivos
  answer: C
  explanation: Es ilegal estacionar un vehículo en cualquier estación de carga para
    vehículos eléctricos si el vehículo no está conectado al equipo de carga.
- id: 197
  category: driver_responsibility
  question: ¿Qué exige la ley si transporta a un animal en la caja de una camioneta
    (truck bed)?
  choices:
    A: El animal debe estar atado con una correa estándar
    B: El animal debe tener un arnés de protección o un recinto
    C: La camioneta debe tener una cubierta (canopy) instalada
    D: El animal debe estar acompañado por un pasajero en la caja
  answer: B
  explanation: Es ilegal transportar a un animal fuera de un vehículo (como en la
    caja de una camioneta) sin un arnés de protección o un recinto, para que el animal
    no pueda saltar o caerse.
- id: 198
  category: defensive_driving
  question: ¿Por qué se considera un problema que un animal viaje en el regazo del
    conductor?
  choices:
    A: Es una distracción potencial que desvía la atención de la conducción segura
    B: Bloquea el espejo del lado del pasajero
    C: Impide que se desplieguen las bolsas de aire (airbags)
    D: Viola las restricciones de peso del vehículo
  answer: A
  explanation: Es ilegal realizar cualquier actividad que desvíe su atención de la
    conducción segura de su vehículo. Los animales que están sueltos en un vehículo
    o que viajan en el regazo del conductor son una distracción potencial.
- id: 199
  category: penalties_and_points
  question: ¿Qué puede suceder si se adelanta en la fila en una terminal de ferry
    del estado de Washington?
  choices:
    A: Se le pedirá que embarque al final
    B: Se le cobrará el doble de la tarifa
    C: Es una infracción de tránsito que puede dar lugar a una multa
    D: Su vehículo será remolcado de inmediato
  answer: C
  explanation: Adelantarse en la fila del ferry es una infracción de tránsito que
    puede dar lugar a una multa.
- id: 200
  category: sharing_the_road
  question: ¿Cómo se maneja a los ciclistas en las terminales de ferry?
  choices:
    A: Deben esperar detrás de todos los vehículos motorizados
    B: Reciben prioridad de carga y tienen un área de espera delante de los vehículos
      motorizados
    C: No se permiten en los ferries estatales
    D: Deben embarcar exactamente al mismo tiempo que los peatones
  answer: B
  explanation: Los ciclistas reciben prioridad de carga en la mayoría de los ferries
    y tienen un área de espera para bicicletas delante de los vehículos motorizados.
    Pueden pasar a los vehículos que esperan en el carril de espera del ferry.
- id: 201
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad al conducir en las playas oceánicas permitidas
    en Washington?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: La playa se considera una carretera estatal, por lo que se aplican
    todas las leyes de conducción. El límite de velocidad es de 25 mph.
- id: 202
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en todo momento al conducir en una playa
    oceánica?
  choices:
    A: Vehículos motorizados
    B: Peatones y ciclistas
    C: Solo vehículos de emergencia
    D: Vehículos con tracción en las cuatro ruedas
  answer: B
  explanation: Al conducir en playas oceánicas, los peatones y ciclistas tienen el
    derecho de paso en todo momento.
- id: 203
  category: driver_responsibility
  question: Según el manual, ¿cuál es una de las principales causas de muerte para
    las personas de 16 a 25 años en Washington?
  choices:
    A: Ahogamiento
    B: Choques de vehículos
    C: Accidentes laborales
    D: Colisiones de peatones
  answer: B
  explanation: En Washington, los choques de vehículos son una de las principales
    causas de muerte para las personas de 16 a 25 años.
- id: 204
  category: defensive_driving
  question: ¿Qué debe hacer al acercarse a peligros para tener más espacio y tiempo
    para tomar decisiones seguras?
  choices:
    A: Acelerar para pasar el peligro rápidamente
    B: Tocar la bocina continuamente
    C: Conducir más lento
    D: Moverse al carril contrario
  answer: C
  explanation: Conduzca más lento al acercarse a peligros para tener más espacio y
    tiempo para tomar decisiones seguras.
- id: 205
  category: defensive_driving
  question: ¿Por qué es importante revisar detrás de usted después de detectar un
    peligro adelante?
  choices:
    A: Para ver si otros conductores están excediendo la velocidad
    B: Porque lo que sucede detrás de usted puede afectar su toma de decisiones
    C: Para asegurarse de que sus luces traseras funcionen
    D: Porque los peligros suelen venir de atrás
  answer: B
  explanation: Revise detrás de usted después de detectar un peligro que requiera
    que realice un cambio. Lo que sucede detrás de usted puede afectar su toma de
    decisiones.
- id: 206
  category: defensive_driving
  question: ¿Qué implica la conciencia situacional al conducir?
  choices:
    A: Enfocarse solo en el vehículo que está directamente delante de usted.
    B: Observar lo que sucede a su alrededor y predecir para qué debe prepararse a
      continuación.
    C: Confiar en sus reacciones rápidas para evitar peligros repentinos.
    D: Mantener una velocidad constante independientemente del entorno.
  answer: B
  explanation: La conciencia situacional consiste en observar lo que sucede a su alrededor
    y predecir para qué debe prepararse a continuación.
- id: 207
  category: defensive_driving
  question: ¿Cuál de las siguientes es la secuencia correcta para la rutina de gestión
    de peligros?
  choices:
    A: Revisar, Planificar, Ejecutar, Comunicar, Evaluar
    B: Planificar, Comunicar, Revisar, Ejecutar, Evaluar
    C: Evaluar, Planificar, Revisar, Comunicar, Ejecutar
    D: Comunicar, Ejecutar, Revisar, Planificar, Evaluar
  answer: B
  explanation: 'La rutina confiable para responder a los peligros requiere que usted:
    Planifique, Comunique, Revise, Ejecute y Evalúe.'
- id: 208
  category: safe_driving_rules
  question: ¿Cómo afecta el conducir a velocidades excesivas a los cinturones de seguridad?
  choices:
    A: Aumenta su capacidad para prevenir el latigazo cervical.
    B: No tiene efecto en su rendimiento.
    C: Disminuye su eficacia para protegerlo en un choque.
    D: Hace que se bloqueen prematuramente.
  answer: C
  explanation: Los cinturones de seguridad están diseñados para protegerlo en un choque,
    pero su eficacia disminuye a velocidades más altas.
- id: 209
  category: safe_driving_rules
  question: ¿Qué indican los límites de velocidad publicados?
  choices:
    A: La velocidad recomendada para todas las condiciones climáticas.
    B: La velocidad mínima que se le permite conducir.
    C: La velocidad máxima legal bajo condiciones ideales.
    D: La velocidad que debe mantener para asegurar el flujo del tráfico.
  answer: C
  explanation: Los límites de velocidad indican la velocidad máxima legal bajo condiciones
    ideales. La ley de Washington también exige que conduzca a velocidades que sean
    seguras para las condiciones actuales de la carretera.
- id: 210
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones debería reducir su velocidad por
    debajo del límite publicado?
  choices:
    A: Al conducir en una carretera recta y seca.
    B: Al conducir en áreas con mucho tráfico de peatones o centros comerciales.
    C: Cuando llega tarde a una cita.
    D: Cuando conduce en el carril izquierdo de una interestatal.
  answer: B
  explanation: Debe reducir su velocidad en condiciones como centros comerciales,
    estacionamientos y áreas con mucho tráfico de peatones.
- id: 211
  category: safe_driving_rules
  question: ¿Al conducir cerca de otros vehículos, cuál es la distancia mínima que
    debe dejar entre usted y el vehículo que va adelante?
  choices:
    A: Al menos la longitud de su vehículo.
    B: Al menos el doble de la longitud de su vehículo.
    C: Al menos tres veces la longitud de su vehículo.
    D: Al menos cuatro veces la longitud de su vehículo.
  answer: B
  explanation: Cuando conduce cerca de otros vehículos, es importante dejar una distancia
    que sea al menos el doble de la longitud de su vehículo entre usted y el vehículo
    que va adelante.
- id: 212
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso cuando usted se está incorporando a una
    autopista interestatal?
  choices:
    A: El vehículo que se incorpora a la interestatal.
    B: El vehículo que viaja a la velocidad más rápida.
    C: Los conductores que ya están en la interestatal.
    D: El vehículo a la derecha.
  answer: C
  explanation: Los conductores que ya están en la interestatal tienen el derecho de
    paso, por lo que crear espacio para incorporarse podría requerir que usted ajuste
    su velocidad.
- id: 213
  category: sharing_the_road
  question: ¿En qué medida puede la incorporación en cremallera (zipper merging) mejorar
    el flujo de tráfico?
  choices:
    A: 20 por ciento
    B: 40 por ciento
    C: 60 por ciento
    D: 80 por ciento
  answer: C
  explanation: La incorporación en cremallera (zipper merging) es una técnica que
    mejora el flujo de tráfico en un 60 por ciento.
- id: 214
  category: sharing_the_road
  question: ¿Cuál es la forma correcta de realizar una incorporación en cremallera
    (zipper merge)?
  choices:
    A: Incorporarse lo antes posible para salir del carril que se cierra.
    B: Acelerar para rebasar a tantos autos como sea posible antes de que termine
      el carril.
    C: Permanecer en su carril hasta el área de incorporación designada, luego turnarse
      alternadamente.
    D: Detenerse en el carril que se cierra y esperar un gran espacio en el tráfico.
  answer: C
  explanation: Para realizar una incorporación en cremallera, debe permanecer en su
    carril hasta llegar al área de incorporación designada, luego turnarse alternadamente
    con los vehículos del otro carril.
- id: 215
  category: defensive_driving
  question: ¿Cuál es el propósito de utilizar el tiempo de anticipación visual (eye-lead
    time) al conducir?
  choices:
    A: Enfocarse únicamente en el vehículo que está directamente frente a usted.
    B: Escanear la carretera adelante y a los lados para identificar peligros potenciales
      a tiempo.
    C: Estimar la velocidad de los vehículos detrás de usted.
    D: Leer las señales de tráfico con mayor claridad por la noche.
  answer: B
  explanation: El tiempo de anticipación visual le permite escanear la carretera adelante
    en busca de peligros potenciales. Le da tiempo para ver, analizar y responder
    a los peligros de manera temprana.
- id: 216
  category: defensive_driving
  question: Al practicar el ejercicio de "contar segundos" para juzgar el espacio,
    ¿a qué distancia por delante debe elegir una marca?
  choices:
    A: 5 segundos por delante de su vehículo.
    B: 10 segundos por delante de su vehículo.
    C: 15 segundos por delante de su vehículo.
    D: 20 segundos por delante de su vehículo.
  answer: C
  explanation: El manual sugiere elegir una marca, como una señal de tráfico o un
    poste de servicios públicos, que usted crea que está a 15 segundos por delante
    de su vehículo para practicar cómo juzgar el espacio.
- id: 217
  category: safe_driving_rules
  question: Cuando se prepara para girar frente al tráfico que viene en sentido contrario,
    ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo que realiza el giro.
    B: El tráfico que se aproxima.
    C: El vehículo que viaja a una velocidad más lenta.
    D: Quien llegue primero a la intersección.
  answer: B
  explanation: Al enfrentarse al tráfico que viene en sentido contrario y prepararse
    para girar, recuerde que el tráfico que se aproxima tiene el derecho de paso.
- id: 218
  category: driver_responsibility
  question: ¿Por qué es esencial eliminar las distracciones y prestar atención activamente
    mientras se conduce?
  choices:
    A: Porque su cerebro solo puede enfocarse en una cosa a la vez.
    B: Porque los vehículos modernos requieren más intervención manual que los autos
      antiguos.
    C: Porque es la única forma de evitar recibir una multa por exceso de velocidad.
    D: Porque la visión periférica se desactiva cuando usted está distraído.
  answer: A
  explanation: Su atención total es esencial para una conducción segura porque su
    cerebro solo puede enfocarse en una cosa a la vez.
- id: 219
  category: driver_responsibility
  question: ¿Qué tipo de visión le permite ver detalles directamente frente a usted?
  choices:
    A: Visión periférica
    B: Visión marginal (fringe vision)
    C: Visión central
    D: Visión focal
  answer: C
  explanation: La visión central le permite ver detalles directamente frente a usted.
    Es la visión que está utilizando para leer palabras.
- id: 220
  category: driver_responsibility
  question: ¿Cómo afectan las velocidades más altas a su campo de visión?
  choices:
    A: Mejoran su visión central.
    B: Reducen la calidad de cada tipo de visión.
    C: Amplían su visión marginal (fringe vision).
    D: No tienen ningún efecto en su visión.
  answer: B
  explanation: El manual establece que usted utiliza tres tipos de visión al conducir,
    y las velocidades más altas reducen la calidad de cada tipo de visión.
- id: 221
  category: safe_driving_rules
  question: ¿Al conducir de noche, debe conducir a una velocidad que le permita detenerse
    dentro de qué distancia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: D
  explanation: Al conducir de noche, debe conducir a una velocidad que le permita
    detenerse dentro del alcance de sus faros, que suele ser de 400 pies.
- id: 222
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo que viene en sentido contrario tiene las
    luces altas encendidas?
  choices:
    A: Parpadear sus luces altas repetidamente hasta que apaguen las suyas.
    B: Mirar directamente a los faros para calcular su distancia.
    C: Mirar hacia el lado derecho de la carretera.
    D: Cerrar un ojo para preservar su visión nocturna.
  answer: C
  explanation: Si un vehículo viene hacia usted con las luces altas encendidas, mire
    hacia el lado derecho de la carretera para evitar distraerse con los faros.
- id: 223
  category: safe_driving_rules
  question: ¿Cuál es el mejor momento para reducir la velocidad al tomar una curva?
  choices:
    A: Antes de entrar en la curva.
    B: Mientras está en medio de la curva.
    C: Justo cuando comienza a salir de la curva.
    D: Debe mantener una velocidad constante durante toda la curva.
  answer: A
  explanation: Debe reducir la velocidad antes de entrar en la curva. Esto ayuda a
    mantener la tracción y evita que su vehículo patine o se salga de la carretera.
- id: 224
  category: defensive_driving
  question: ¿Cuál es la posición recomendada en el carril al acercarse a una curva?
  choices:
    A: Ligeramente hacia el interior del carril.
    B: Ligeramente hacia el exterior del carril.
    C: Directamente en el centro del carril.
    D: A horcajadas sobre la línea central.
  answer: B
  explanation: Posicione su vehículo ligeramente hacia el exterior del carril al acercarse
    a la curva. Esto le da más espacio para maniobrar y mejora la visibilidad.
- id: 225
  category: vehicle_information
  question: ¿Qué fuerza intenta mantener su automóvil moviéndose en línea recta cuando
    gira repentinamente el volante en una curva?
  choices:
    A: Fricción
    B: Energía cinética
    C: Inercia
    D: Guiñada (Yaw)
  answer: C
  explanation: En una curva, si gira repentinamente el volante, la inercia intentará
    mantener el automóvil moviéndose en línea recta.
- id: 226
  category: defensive_driving
  question: ¿Por qué el pavimento puede estar muy resbaladizo durante los primeros
    minutos cuando empieza a llover en un día caluroso?
  choices:
    A: La lluvia se mezcla con el polvo para formar un lodo espeso.
    B: El calor hace que el aceite del asfalto suba a la superficie.
    C: El enfriamiento repentino de la carretera crea una capa de hielo negro.
    D: El agua crea un efecto de hidroplaneo instantáneo.
  answer: B
  explanation: Si empieza a llover en un día caluroso, el pavimento puede estar muy
    resbaladizo durante los primeros minutos porque el calor hace que el aceite del
    asfalto suba a la superficie.
- id: 227
  category: defensive_driving
  question: ¿Qué áreas de la carretera es probable que tengan placas de hielo incluso
    cuando el resto de la carretera no las tiene?
  choices:
    A: Túneles
    B: Intersecciones
    C: Pasos elevados y puentes
    D: Pendientes cuesta arriba
  answer: C
  explanation: Los pasos elevados y otros tipos de puentes pueden tener placas de
    hielo incluso cuando el resto de la carretera no las tiene.
- id: 228
  category: defensive_driving
  question: ¿Cómo afecta a las carreteras heladas el hecho de que la temperatura suba
    hasta niveles cercanos al punto de congelación?
  choices:
    A: Hace que la carretera sea menos resbaladiza al derretir el hielo por completo.
    B: Hace que la carretera sea más resbaladiza porque el hielo se moja.
    C: Aumenta significativamente la fricción de los neumáticos.
    D: No tiene ningún efecto sobre lo resbaladizo de la carretera.
  answer: B
  explanation: Cuando las temperaturas bajo cero suben hasta niveles cercanos al punto
    de congelación, el hielo puede derretirse y mojarse. Esto hace que la carretera
    sea más resbaladiza.
- id: 229
  category: safe_driving_rules
  question: ¿Qué debe hacer con el volante si su vehículo comienza a patinar?
  choices:
    A: Girar en la dirección opuesta a la que se mueve el vehículo.
    B: Mantener el volante perfectamente recto.
    C: Girar en la misma dirección en la que se mueve su vehículo.
    D: Girar el volante bruscamente de un lado a otro para recuperar la tracción.
  answer: C
  explanation: Si está patinando, debe girar el volante en la misma dirección en la
    que se mueve su vehículo y continuar corrigiendo la dirección hasta que los neumáticos
    recuperen la tracción.
- id: 230
  category: defensive_driving
  question: ¿Qué causa que un vehículo experimente hidroplaneo (hydroplaning)?
  choices:
    A: El aceite que sube a la superficie del asfalto en un día caluroso.
    B: El agua que se acumula entre los neumáticos y la superficie de la carretera.
    C: Conducir sobre hielo negro a altas velocidades.
    D: Frenado repentino en una carretera de grava seca.
  answer: B
  explanation: El hidroplaneo ocurre cuando el agua se acumula entre los neumáticos
    y la superficie de la carretera, lo que hace que los neumáticos pierdan tracción
    y patinen.
- id: 231
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es la acción correcta a tomar si su vehículo comienza
    a deslizarse sobre el agua (hydroplaning)?
  choices:
    A: Acelerar para atravesar el agua.
    B: Dar un tirón al volante hacia la derecha.
    C: Presionar el pedal del freno con fuerza.
    D: Quitar el pie del acelerador y mantener el volante firme.
  answer: D
  explanation: Si se desliza sobre el agua (hydroplane), debe quitar el pie del acelerador,
    presionar suavemente los frenos y mantener el volante firme sin sobrecorregir.
- id: 232
  category: safe_driving_rules
  question: ¿Por qué debe evitar el uso de gafas de sol o lentes tintados al conducir
    de noche o en días nublados?
  choices:
    A: Causan deslumbramiento por los faros de los vehículos que vienen en sentido
      contrario.
    B: Reducen su visión.
    C: Distorsionan los colores de las señales de tráfico.
    D: Aumentan demasiado su visión periférica.
  answer: B
  explanation: No use gafas de sol ni lentes de color al conducir de noche o en días
    nublados porque los lentes tintados o de color reducen su visión.
- id: 233
  category: vehicle_information
  question: ¿Cuál es la fuerza entre sus neumáticos y la carretera que permite que
    su vehículo se agarre a la superficie?
  choices:
    A: Inercia
    B: Momento
    C: Fricción
    D: Energía cinética
  answer: C
  explanation: La fricción es la fuerza entre los neumáticos y la carretera. Permite
    que su vehículo se agarre a la superficie, ayudándole a reducir la velocidad,
    acelerar o girar de forma segura.
- id: 234
  category: defensive_driving
  question: ¿A qué distancia detrás de su vehículo debe colocar bengalas de emergencia
    si tiene problemas con el vehículo en la carretera?
  choices:
    A: 50 a 100 pies
    B: 100 a 150 pies
    C: 200 a 300 pies
    D: 300 a 400 pies
  answer: C
  explanation: El manual indica que se debe advertir a otros usuarios de la carretera
    colocando bengalas de emergencia de 200 a 300 pies detrás del vehículo.
- id: 235
  category: vehicle_information
  question: ¿Qué debe hacer con los frenos si un neumático estalla repentinamente
    o se desinfla?
  choices:
    A: Bombear los frenos rápidamente para mantener el control.
    B: Frenar fuerte inmediatamente para detener el vehículo.
    C: No frenar, o frenar suavemente solo si es necesario.
    D: Aplicar el freno de mano de emergencia.
  answer: C
  explanation: 'Si un neumático estalla, el manual aconseja: ''No frene. Deje que
    el vehículo reduzca la velocidad por sí mismo, o frene suavemente si es necesario''.'
- id: 236
  category: defensive_driving
  question: ¿Cuál es el primer paso mecánico que debe tomar si el acelerador de su
    vehículo se queda atascado y el vehículo sigue yendo más rápido?
  choices:
    A: Apagar el motor inmediatamente.
    B: Cambiar rápidamente a punto muerto (neutral).
    C: Aplicar el freno de mano.
    D: Cambiar a una marcha inferior.
  answer: B
  explanation: Si el vehículo sigue yendo cada vez más rápido, debe mantener la vista
    en la carretera y cambiar rápidamente a punto muerto (neutral) antes de salirse
    de la carretera y apagar el motor.
- id: 237
  category: safe_driving_rules
  question: Según el manual, ¿cuál de las siguientes es una de las tres causas típicas
    de colisiones?
  choices:
    A: Conducir con neumáticos poco inflados
    B: Conciencia situacional insuficiente
    C: Malas condiciones climáticas
    D: Falla mecánica
  answer: B
  explanation: 'El manual establece que las colisiones suelen tener tres causas: Demasiada
    velocidad, Muy poco espacio y Conciencia situacional insuficiente.'
- id: 238
  category: driver_responsibility
  question: Si choca con un vehículo estacionado y no puede localizar al propietario,
    ¿qué información debe dejar en una nota?
  choices:
    A: Su número de licencia de conducir y el número de póliza de seguro.
    B: La fecha y hora de la colisión y su información de contacto.
    C: Solo su número de teléfono.
    D: El número de placa de su vehículo y su compañía de seguros.
  answer: B
  explanation: Si la colisión involucra a un vehículo estacionado y no puede localizar
    al propietario, debe dejar una nota que incluya la fecha y hora de la colisión
    y su información de contacto.
- id: 239
  category: driver_responsibility
  question: Si un oficial de la ley no presenta un informe de colisión por usted,
    ¿cuántos días tiene para presentar el formulario usted mismo?
  choices:
    A: 2 días
    B: 4 días
    C: 7 días
    D: 10 días
  answer: B
  explanation: Debe presentar un formulario de informe de colisión dentro de los 4
    días posteriores a un choque si un oficial de la ley no lo hace por usted.
- id: 240
  category: alcohol_drugs_health
  question: ¿Qué debe darle de beber a una persona lesionada después de un choque?
  choices:
    A: Una pequeña cantidad de agua.
    B: Una bebida azucarada para prevenir el shock.
    C: Solo líquidos calientes.
    D: Nada de beber, ni siquiera agua.
  answer: D
  explanation: 'Al ayudar a una persona lesionada después de un choque, el manual
    establece explícitamente: ''No dé nada de beber a las personas lesionadas, ni
    siquiera agua''.'
- id: 241
  category: alcohol_drugs_health
  question: ¿Por qué debería cubrir a una persona lesionada con una manta o abrigo
    después de una colisión?
  choices:
    A: Para mantenerlos ocultos del tráfico que pasa.
    B: Para evitar que se muevan.
    C: Para mantenerlos calientes y ayudar a evitar que entren en estado de choque
      (shock).
    D: Para detener cualquier sangrado activo.
  answer: C
  explanation: El manual indica cubrir a las personas lesionadas con una manta o abrigo
    para mantenerlas calientes y ayudar a evitar que entren en estado de choque (shock).
- id: 242
  category: safe_driving_rules
  question: ¿Qué debe hacer si un cable eléctrico entra en contacto con su vehículo
    después de una colisión y no hay fuego?
  choices:
    A: Salir del vehículo inmediatamente y alejarse corriendo.
    B: Apagar el motor, llamar al 911 y permanecer dentro de su vehículo.
    C: Salir del vehículo con cuidado asegurándose de no tocar el marco de metal.
    D: Conducir hacia adelante rápidamente para romper el cable eléctrico.
  answer: B
  explanation: Si una colisión involucra cables eléctricos, debe apagar el motor,
    llamar al 911 y permanecer dentro de su vehículo hasta que lleguen los servicios
    de emergencia.
- id: 243
  category: defensive_driving
  question: Si un cable eléctrico cae sobre su vehículo e inicia un incendio, ¿cómo
    debe alejarse después de saltar fuera del vehículo?
  choices:
    A: Correr lo más rápido posible durante al menos 100 pies.
    B: Dar pasos largos y saltos para minimizar el contacto con el suelo.
    C: Arrastrar los pies a 35 pies de distancia hacia un lugar seguro con ambos pies
      juntos.
    D: Gatear sobre sus manos y rodillas para evitar el humo.
  answer: C
  explanation: Si se inicia un incendio y debe evacuar, salte asegurándose de que
    ambos pies caigan juntos y, para evitar una descarga eléctrica, arrastre los pies
    a 35 pies de distancia hacia un lugar seguro.
- id: 244
  category: driver_responsibility
  question: ¿Qué debe hacer si la policía lo detiene por la noche?
  choices:
    A: Apagar sus faros delanteros.
    B: Encender las luces interiores.
    C: Salir del vehículo para que el oficial pueda verlo.
    D: Encender y apagar las luces altas para reconocer al oficial.
  answer: B
  explanation: Si lo detienen por la noche, debe encender las luces interiores para
    proporcionar visibilidad adicional al oficial.
- id: 245
  category: driver_responsibility
  question: Cuando un oficial de la ley le pide su licencia de conducir y los documentos
    del vehículo, ¿cuál es el procedimiento adecuado?
  choices:
    A: Alcanzar rápidamente la guantera para tenerlos listos antes de que el oficial
      se acerque.
    B: Salir del vehículo para entregar los documentos al oficial.
    C: Decirle al oficial dónde se encuentran los documentos antes de intentar alcanzarlos.
    D: Entregarle al oficial su billetera para que él mismo saque la licencia.
  answer: C
  explanation: Debe esperar las instrucciones del oficial antes de buscar los documentos
    y decirle al oficial dónde se encuentran estos documentos antes de intentar alcanzarlos.
- id: 246
  category: vehicle_information
  question: ¿Qué debe esperar con respecto a su volante si el motor se apaga repentinamente
    mientras conduce?
  choices:
    A: El volante se bloqueará por completo y no se podrá girar.
    B: El volante se volverá muy flojo y sensible.
    C: El volante podría ser difícil de girar, pero aún podrá girarlo.
    D: El volante dirigirá automáticamente el vehículo hacia la derecha.
  answer: C
  explanation: Si el motor se apaga, mantenga el volante firmemente sujeto. Tenga
    en cuenta que el volante podría ser difícil de girar, pero puede girarlo.
- id: 247
  category: defensive_driving
  question: ¿Cuál de las siguientes acciones debe realizar primero si sus faros delanteros
    se apagan repentinamente mientras conduce?
  choices:
    A: Frenar bruscamente y detenerse en su carril.
    B: Encender las luces de advertencia de peligro, las luces direccionales o las
      luces antiniebla.
    C: Acelerar para llegar a una zona bien iluminada.
    D: Apagar el motor para reiniciar el sistema eléctrico.
  answer: B
  explanation: Si sus faros se apagan repentinamente, debe encender las luces de advertencia
    de peligro, las luces direccionales o las luces antiniebla, si las tiene, y salir
    de la carretera lo antes posible.
- id: 248
  category: vehicle_information
  question: ¿Qué puede suceder si presiona con fuerza el pedal del freno mientras
    experimenta hidroplaneo (hydroplaning) en un vehículo sin frenos antibloqueo?
  choices:
    A: Ayudará a que el vehículo recupere el contacto con la carretera inmediatamente.
    B: Podría causar que hidroplanee más.
    C: Desplazará de forma segura el peso del vehículo hacia los neumáticos traseros.
    D: Activará automáticamente el sistema de frenado de emergencia.
  answer: B
  explanation: El manual advierte que si no tiene frenos antibloqueo, presionar con
    fuerza el pedal del freno podría causar que hidroplanee más.
- id: 249
  category: driver_responsibility
  question: ¿Qué debe hacer antes de intentar alcanzar sus documentos durante una
    parada de tráfico?
  choices:
    A: Desabrocharse el cinturón de seguridad para poder moverse libremente.
    B: Decirle al oficial dónde se encuentran los documentos.
    C: Salir del vehículo para entregarlos.
    D: Entregarle al oficial su arma primero.
  answer: B
  explanation: El manual establece que durante una parada de tráfico, debe decirle
    al oficial dónde se encuentran sus documentos antes de intentar alcanzarlos.
- id: 250
  category: penalties_and_points
  question: ¿Qué podría suceder si se niega a firmar una multa de tráfico?
  choices:
    A: Se le emitirá una advertencia en su lugar.
    B: Su vehículo será confiscado inmediatamente.
    C: Podría resultar en su arresto.
    D: Admite automáticamente su culpabilidad por la infracción de tráfico.
  answer: C
  explanation: Según el manual, su firma no es una admisión de culpabilidad, pero
    negarse a firmar una multa de tráfico podría resultar en su arresto.
- id: 251
  category: penalties_and_points
  question: ¿Cuántos días tiene para seguir las instrucciones al reverso de una multa
    para evitar que se le suspendan sus privilegios de conducir?
  choices:
    A: 10 días
    B: 15 días
    C: 20 días
    D: 30 días
  answer: B
  explanation: Debe seguir las instrucciones al reverso de la multa dentro de un plazo
    de 15 días para evitar que se le suspendan sus privilegios de conducir.
- id: 252
  category: alcohol_drugs_health
  question: ¿Qué exige la ley de consentimiento implícito (implied consent law) a
    los conductores?
  choices:
    A: Consentir el registro del vehículo durante cualquier parada de tráfico de rutina.
    B: Someterse a ciertas pruebas, como las de alcoholemia (breathalyzer), si se
      sospecha que conduce bajo la influencia.
    C: Aceptar pagar todas las multas dentro de los 15 días posteriores a la recepción
      de una multa de tráfico.
    D: Permitir que las autoridades confisquen su licencia de conducir sin una orden
      judicial.
  answer: B
  explanation: La ley de consentimiento implícito exige que los conductores se sometan
    a ciertas pruebas, como las de alcoholemia (breathalyzer), si se sospecha que
    conducen bajo la influencia.
- id: 253
  category: sharing_the_road
  question: 'Un carril para vehículos de alta ocupación (HOV) está reservado para
    vehículos con:'
  choices:
    A: Solo el conductor en su interior.
    B: 2 o más personas en su interior.
    C: 3 o más personas en su interior.
    D: Bienes comerciales siendo transportados.
  answer: B
  explanation: El glosario define un carril para vehículos de alta ocupación (HOV)
    como un carril reservado para vehículos de viaje compartido con 2 o más personas
    en su interior.
- id: 254
  category: safe_driving_rules
  question: ¿Cuál es la definición de hidroplaneo (hydroplaning)?
  choices:
    A: Cuando un vehículo pierde tracción en una carretera mojada y se desliza.
    B: Cuando los frenos de un vehículo dejan de funcionar correctamente debido a
      la exposición al agua.
    C: Cuando un conductor se queda dormido al volante durante una lluvia intensa.
    D: Cuando un vehículo se balancea de lado a lado sobre una superficie irregular.
  answer: A
  explanation: El hidroplaneo ocurre cuando un vehículo pierde tracción en una carretera
    mojada y se desliza.
- id: 255
  category: alcohol_drugs_health
  question: 'La ley de envases abiertos (open container law) prohíbe a los conductores
    y pasajeros:'
  choices:
    A: Dejar las ventanas del vehículo abiertas mientras se conduce por la autopista.
    B: Transportar cualquier material peligroso en la caja abierta de una camioneta.
    C: Tener envases abiertos de bebidas alcohólicas en un vehículo.
    D: Conducir con el maletero o la puerta trasera abierta.
  answer: C
  explanation: La ley de envases abiertos prohíbe a los conductores y pasajeros tener
    envases abiertos de bebidas alcohólicas en un vehículo, para prevenir el consumo
    de alcohol al conducir.
- id: 256
  category: safe_driving_rules
  question: ¿Cómo se define el 'derecho de paso' (right-of-way) en el manual del conductor?
  choices:
    A: El derecho legal a conducir por el lado derecho de la carretera.
    B: El derecho legal a avanzar primero en el tráfico.
    C: La capacidad de girar a la derecha en un semáforo en rojo.
    D: El requisito de ceder el paso a los peatones en todo momento.
  answer: B
  explanation: El derecho de paso se define como el derecho legal a avanzar primero
    en el tráfico; por ejemplo, el primer vehículo en detenerse en una intersección
    tiene el derecho de paso.
- id: 257
  category: alcohol_drugs_health
  question: ¿A qué se refiere el término 'uso de polidrogas' (polydrug use)?
  choices:
    A: Usar un medicamento recetado mientras se conduce.
    B: Consumir o usar más de un tipo de droga al mismo tiempo.
    C: Conducir bajo la influencia del alcohol únicamente.
    D: Transportar drogas ilegales en un vehículo motorizado.
  answer: B
  explanation: El uso de polidrogas se define como el consumo o uso de más de un tipo
    de droga al mismo tiempo.
- id: 258
  category: license_system
  question: ¿Para qué se utiliza License Express?
  choices:
    A: Para pagar multas de estacionamiento en línea.
    B: Para realizar el examen de conocimientos de conducir desde casa.
    C: Para renovar su licencia de conducir o informar la venta de un vehículo en
      línea.
    D: Para solicitar una escolta de vehículo de emergencia.
  answer: C
  explanation: License Express es un servicio en línea donde puede renovar su licencia
    de conducir, las calcomanías del vehículo, su licencia comercial o informar cuando
    vende un vehículo.
- id: 259
  category: defensive_driving
  question: ¿Qué significa ser un conductor 'proactivo'?
  choices:
    A: Responder a una situación que usted ve.
    B: Responder a una situación que usted anticipa.
    C: Conducir más rápido que el flujo del tráfico para evitar la congestión.
    D: Confiar únicamente en los Sistemas Avanzados de Asistencia al Conductor (ADAS).
  answer: B
  explanation: Ser proactivo significa responder a una situación que se anticipa,
    mientras que ser reactivo significa responder a una situación que se ve.
- id: 260
  category: safe_driving_rules
  question: 'La visión periférica se define como:'
  choices:
    A: La capacidad de ver claramente por la noche.
    B: Ver objetos a los lados mientras se mira hacia adelante.
    C: La capacidad de juzgar la distancia entre dos vehículos.
    D: Mirar a través del espejo retrovisor para ver lo que hay detrás de usted.
  answer: B
  explanation: La visión periférica se define como ver objetos a los lados mientras
    se mira hacia adelante.
- id: 261
  category: vehicle_information
  question: 'El movimiento de lado a lado de un vehículo se conoce como:'
  choices:
    A: Cabeceo (Pitch)
    B: Balanceo (Roll)
    C: Derrape (Skid)
    D: Hidroplaneo (Hydroplaning)
  answer: B
  explanation: El glosario define el 'Balanceo del vehículo' (Roll) como el movimiento
    de lado a lado de un vehículo.
- id: 262
  category: license_system
  question: 'Un permiso agrícola permite que una persona menor de 18 años pueda:'
  choices:
    A: Conducir cualquier vehículo comercial a través de las fronteras estatales.
    B: Conducir tractores y otros vehículos utilizados en la agricultura.
    C: Transportar productos agrícolas en un camión semirremolque.
    D: Ignorar los límites de velocidad estándar en zonas agrícolas rurales.
  answer: B
  explanation: Un permiso agrícola es la autorización para que una persona menor de
    18 años conduzca tractores y otros vehículos utilizados en la agricultura.
- id: 263
  category: signs_and_signals
  question: ¿Qué es una 'intersección no controlada'?
  choices:
    A: Una intersección donde las carreteras se cruzan en ángulos rectos.
    B: Una intersección con semáforos averiados.
    C: Una intersección sin señales de tráfico ni letreros.
    D: Una intersección con un gran volumen de tráfico.
  answer: C
  explanation: Una intersección no controlada es una intersección que no tiene señales
    de tráfico ni letreros.
- id: 264
  category: vehicle_information
  question: ¿Qué es el 'subviraje' (Understeer)?
  choices:
    A: Cuando un vehículo gira más de lo que el conductor pretende.
    B: Cuando un vehículo no gira tanto como el conductor pretende.
    C: El movimiento de lado a lado de un vehículo.
    D: La pérdida repentina de presión de aire en un neumático.
  answer: B
  explanation: El subviraje (Understeer) ocurre cuando un vehículo no gira tanto como
    el conductor pretende.
- id: 265
  category: vehicle_information
  question: ¿A qué se refiere el término 'guiñada' (Yaw) en la dinámica del vehículo?
  choices:
    A: El movimiento de arriba hacia abajo de un vehículo.
    B: El movimiento de lado a lado de un vehículo.
    C: El cabeceo hacia adelante de un vehículo durante un frenado brusco.
    D: La pérdida de tracción que provoca un derrape.
  answer: B
  explanation: La guiñada (Yaw) se define como el movimiento de lado a lado de un
    vehículo.
- id: 266
  category: vehicle_information
  question: ¿Qué es la 'Tecnología de Seguridad del Vehículo' (VST)?
  choices:
    A: Documentación oficial que acredita la propiedad de un vehículo.
    B: Cobertura que ayuda a pagar los daños o lesiones de los choques.
    C: Características del vehículo que utilizan sensores o cámaras para intervenir,
      advertir o ayudarle a conducir de forma segura.
    D: Una prueba para comprobar qué tan bien puede ver.
  answer: C
  explanation: La Tecnología de Seguridad del Vehículo (VST) se refiere a las características
    del vehículo que utilizan sensores o cámaras para intervenir, advertir o ayudarle
    a conducir de forma segura.
- id: 267
  category: license_system
  question: Si necesita asistencia en un idioma que no sea el inglés por parte del
    DOL, ¿con quién debe ponerse en contacto?
  choices:
    A: El Gerente de Cumplimiento de la ADA
    B: El Coordinador de Cumplimiento de Derechos Civiles
    C: El equipo de Acceso Lingüístico (Language Access)
    D: La oficina de licencias de vehículos
  answer: C
  explanation: Si necesita asistencia en un idioma que no sea el inglés, debe ponerse
    en contacto con el equipo de Acceso Lingüístico (Language Access) en languageaccess@dol.wa.gov.
- id: 268
  category: driver_responsibility
  question: ¿Puede la Guía del Conductor del Estado de Washington utilizarse como
    autoridad legal en un tribunal?
  choices:
    A: Sí, es la principal autoridad legal para las leyes de tránsito.
    B: Sí, pero solo para reclamaciones civiles.
    C: No, no es una autoridad legal y no puede utilizarse como base para reclamaciones
      legales.
    D: No, a menos que sea aprobada primero por un juez.
  answer: C
  explanation: La Guía del Conductor del Estado de Washington no es una autoridad
    legal y no está destinada a ser utilizada en los tribunales. No puede utilizarse
    como base para reclamaciones o acciones legales.
- id: 269
  category: driver_responsibility
  question: ¿Cuál es la relación entre las regulaciones de tránsito de las ciudades/pueblos
    y las leyes estatales?
  choices:
    A: Las regulaciones de la ciudad pueden entrar en conflicto con las leyes estatales
      si el alcalde las aprueba.
    B: Las regulaciones de la ciudad pueden ir más allá de las leyes estatales, pero
      no pueden entrar en conflicto con ellas.
    C: Las leyes estatales siempre reemplazan por completo las regulaciones de la
      ciudad.
    D: Las regulaciones de la ciudad son solo sugerencias y no se pueden hacer cumplir.
  answer: B
  explanation: Las regulaciones de tránsito en ciudades, pueblos y condados pueden
    ir más allá de las leyes estatales, pero no pueden entrar en conflicto con ellas.
- id: 270
  category: defensive_driving
  question: ¿Qué es una 'búsqueda visual'?
  choices:
    A: Una prueba para comprobar qué tan bien puede ver y si sus ojos están sanos.
    B: Buscar deliberadamente peligros actuales o potenciales.
    C: Usar las señales de giro para indicar las intenciones.
    D: Planificar la ruta para un viaje.
  answer: B
  explanation: La búsqueda visual se define como la acción de buscar deliberadamente
    peligros actuales o potenciales.
- id: 271
  category: license_system
  question: ¿A dónde debe acudir para obtener certificados de vehículos, calcomanías
    (tabs) y ayuda con el registro?
  choices:
    A: Una intersección tradicional
    B: El Gerente de Cumplimiento de la ADA
    C: Una oficina de licencias de vehículos
    D: El registro de gemelos
  answer: C
  explanation: La oficina de licencias de vehículos es el lugar al que debe acudir
    para obtener certificados de vehículos, calcomanías (tabs) y ayuda con el registro.
- id: 272
  category: signs_and_signals
  question: ¿Qué son los "dispositivos de control de tráfico"?
  choices:
    A: Señales, semáforos y marcas utilizadas para regular el tráfico.
    B: Reglas que rigen cómo deben operar los vehículos en las carreteras.
    C: Las luces intermitentes en la parte delantera y trasera de un vehículo.
    D: Velocidades máximas legales permitidas en las carreteras.
  answer: A
  explanation: Los dispositivos de control de tráfico son señales, semáforos y marcas
    utilizadas para regular el tráfico.
- id: 273
  category: driver_responsibility
  question: Si desea leer las leyes específicas relacionadas con la operación de vehículos
    motorizados y las licencias de conducir en Washington, ¿a qué debe referirse?
  choices:
    A: La Guía del Conductor del Estado de Washington
    B: El Título VI de la Ley de Derechos Civiles de 1964
    C: El Título 46 RCW, Vehículos Motorizados
    D: El manual de Tecnología de Seguridad Vehicular
  answer: C
  explanation: Si está interesado en las leyes específicas relacionadas con la operación
    de vehículos motorizados y las licencias de conducir, consulte el Título 46 RCW,
    Vehículos Motorizados.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 274
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 275
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 276
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda
    de manera segura.
  id: 277
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 278
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 279
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 280
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite dar vuelta en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 281
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 282
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse al lado derecho de una isla de tráfico,
    mediana u obstrucción.
  id: 283
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 284
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 285
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 286
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 287
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 288
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces de trenes. Significa que debe ceder el paso a los trenes.
    Si se acerca un tren, debe detenerse.
  id: 289
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 290
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 291
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 292
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 293
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal de incorporación amarilla en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 294
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la carretera y ajuste
    su posición en el carril.
  id: 295
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 296
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 297
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 298
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 299
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 300
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  id: 301
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (yield)
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 302
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 303
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 304
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando (merging)
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 305
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 306
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de estacionamiento para personas con discapacidad válida pueden
    estacionarse en estos espacios. Las infracciones conllevan multas elevadas.
  id: 307
