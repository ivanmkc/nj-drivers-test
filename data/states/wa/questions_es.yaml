questions:
- id: 1
  category: driver_responsibility
  question: ¿Quién está exento del requisito de portar un seguro de responsabilidad
    civil en Washington?
  choices:
    A: Conductores de autos de alquiler
    B: Conductores de ciclomotores (mopeds)
    C: Conductores menores de 18 años de edad
    D: Conductores de vehículos eléctricos
  answer: B
  explanation: Según el manual, los conductores de vehículos gubernamentales, ciclomotores
    (mopeds) y vehículos de transporte público o por contrato están exentos del requisito
    de seguro de responsabilidad civil.
- id: 2
  category: license_system
  question: ¿A partir de qué fecha las licencias de conducir estándar ya no serán
    aceptadas para abordar vuelos nacionales?
  choices:
    A: 7 de mayo de 2024
    B: 7 de mayo de 2025
    C: 1 de enero de 2025
    D: 1 de octubre de 2026
  answer: B
  explanation: Para el 7 de mayo de 2025, las licencias de conducir estándar ya no
    serán una forma aceptable de identificación para abordar vuelos nacionales e ingresar
    a algunas instalaciones federales seguras.
- id: 3
  category: safe_driving_rules
  question: ¿Cuál es el requisito de sujeción infantil para bebés y niños menores
    de dos años?
  choices:
    A: Deben usar un sistema de sujeción de seguridad infantil orientado hacia adelante.
    B: Deben usar un asiento elevado (booster seat).
    C: Deben usar un sistema de sujeción de seguridad infantil orientado hacia atrás.
    D: Pueden usar un cinturón de seguridad estándar si son lo suficientemente altos.
  answer: C
  explanation: El manual establece que los bebés y niños menores de dos años deben
    usar un sistema de sujeción de seguridad infantil en la posición orientada hacia
    atrás.
- id: 4
  category: safe_driving_rules
  question: ¿A qué estatura puede un niño normalmente dejar de usar un asiento elevado
    (booster seat) y usar un cinturón de seguridad estándar de regazo y hombro del
    vehículo?
  choices:
    A: 4'0"
    B: 4'5"
    C: 4'9"
    D: 5'0"
  answer: C
  explanation: Los niños de cuatro años o más deben usar un asiento elevado hasta
    que midan 4'9" de estatura y puedan ajustarse correctamente el cinturón de seguridad
    de regazo y hombro del vehículo.
- id: 5
  category: vehicle_information
  question: ¿Qué vehículos están exento del requisito de usar un asiento elevado (booster
    seat) para niños?
  choices:
    A: Vehículos equipados únicamente con cinturones de seguridad de regazo
    B: Vehículos fabricados antes de 2005
    C: Vehículos con bolsas de aire laterales
    D: Vehículos de transporte público o por contrato
  answer: A
  explanation: El manual especifica que los vehículos equipados únicamente con cinturones
    de seguridad de regazo están exentos del requisito de usar un asiento elevado.
- id: 6
  category: penalties_and_points
  question: ¿Qué puede suceder con las multas de tráfico en una zona de obras señalizada?
  choices:
    A: Se exoneran para quienes cometen la infracción por primera vez.
    B: Pueden duplicarse.
    C: Se reducen a la mitad.
    D: Resultan en una suspensión automática de la licencia.
  answer: B
  explanation: Los automovilistas deben obedecer todas las indicaciones y reducir
    la velocidad en cualquier zona de obras señalizada, y las multas de tráfico pueden
    duplicarse en un área de zona de obras.
- id: 7
  category: safe_driving_rules
  question: Bajo la ley de Moverse a otro carril/Reducir la velocidad (Move Over/Slow
    Down), si no puede cambiarse a otro carril al pasar un vehículo de emergencia
    con luces intermitentes, ¿qué debe hacer?
  choices:
    A: Detenerse por completo hasta que el vehículo se retire.
    B: Mantener su velocidad pero tocar la bocina.
    C: Reducir su velocidad a 10 mph por debajo del límite de velocidad indicado.
    D: Reducir su velocidad a 20 mph por debajo del límite de velocidad indicado.
  answer: C
  explanation: Al pasar vehículos de respuesta a emergencias con luces intermitentes,
    debe cambiarse a otro carril si es posible, y si no, reducir su velocidad a 10
    mph por debajo del límite de velocidad indicado.
- id: 8
  category: sharing_the_road
  question: ¿Cuál de los siguientes se considera un vehículo de respuesta a emergencias
    bajo la ley de Moverse a otro carril/Reducir la velocidad (Move Over/Slow Down)?
  choices:
    A: Autobuses escolares
    B: Camiones de residuos sólidos y grúas
    C: Camionetas de reparto
    D: Autobuses de transporte público
  answer: B
  explanation: Los vehículos de respuesta a emergencias incluyen los de las fuerzas
    del orden, bomberos/ambulancias, respuesta a incidentes, mantenimiento de carreteras,
    servicios públicos, residuos sólidos y grúas.
- id: 9
  category: signs_and_signals
  question: Además de las señales y semáforos, ¿quién de los siguientes puede proporcionar
    control de tráfico?
  choices:
    A: Peatones en un cruce peatonal
    B: Guardias de cruce escolar
    C: Cualquier conductor con licencia
    D: Voluntarios de vigilancia vecinal
  answer: B
  explanation: El control de tráfico también puede ser proporcionado por las fuerzas
    del orden, personal de construcción o mantenimiento de carreteras, o guardias
    de cruce escolar.
- id: 10
  category: license_system
  question: ¿Cuál de las siguientes NO es una forma de pago aceptable para los servicios
    en línea en el Departamento de Licencias (DOL)?
  choices:
    A: Tarjeta de débito Visa
    B: Tarjeta de crédito MasterCard
    C: American Express
    D: Tarjetas de regalo
  answer: D
  explanation: Las formas de pago aceptables para los servicios en línea incluyen
    tarjetas de débito o crédito Visa, MasterCard o American Express (no se aceptan
    tarjetas de regalo).
- id: 11
  category: driver_responsibility
  question: ¿Cuál de los siguientes elementos se incluye en el resumen de su historial
    de conducción?
  choices:
    A: Multas de estacionamiento
    B: Historial crediticio
    C: Avisos de falta de comparecencia (Failure-to-Appear)
    D: Registros de mantenimiento del vehículo
  answer: C
  explanation: El estado mantiene un registro de las solicitudes de licencia, infracciones
    de tránsito, condenas por violaciones de vehículos motorizados, participación
    en colisiones y avisos de falta de comparecencia (Failure-to-Appear).
- id: 12
  category: license_system
  question: ¿Qué tipo de identificación de Washington cumple con la ley REAL ID y
    es válida para viajes aéreos dentro de los Estados Unidos?
  choices:
    A: Licencia de conducir estándar
    B: Licencia de conducir mejorada (EDL)
    C: Permiso de conducir temporal
    D: Tarjeta de registro de votante
  answer: B
  explanation: Las licencias de conducir mejoradas (EDL) de Washington cumplen con
    la ley REAL ID y son válidas para viajes aéreos dentro de los Estados Unidos.
- id: 13
  category: safe_driving_rules
  question: ¿Cómo debe colocarse el cinturón de seguridad en un niño que ya es demasiado
    grande para un asiento elevado (booster seat)?
  choices:
    A: A través del área del estómago y el cuello
    B: Debajo del brazo o detrás de la espalda
    C: Sobre los huesos de la cadera y ajustado a través del hombro y el pecho
    D: Suelto a través de la cintura para permitir el movimiento
  answer: C
  explanation: El cinturón de seguridad debe quedar sobre los huesos de la cadera
    y estar ajustado a través del hombro y el pecho para sujetar al niño de forma
    segura en un choque. No debe apoyarse en el área del estómago ni en el cuello.
- id: 14
  category: signs_and_signals
  question: ¿De qué colores pueden ser las señales de advertencia de Cruce Escolar
    y Cruce de Peatones?
  choices:
    A: Rojo o naranja
    B: Verde fluorescente o amarillo
    C: Blanco o negro
    D: Azul o verde
  answer: B
  explanation: Según la sección de Señales de Advertencia, el color de las señales
    de Cruce Escolar y Cruce de Peatones puede ser verde fluorescente o amarillo.
- id: 15
  category: license_system
  question: Si tiene 15 años o más y va a obtener su primera licencia de conducir
    de Washington, ¿qué servicio en línea puede ahorrarle tiempo antes de visitar
    una oficina?
  choices:
    A: Examen de conducir en línea
    B: Servicio de presolicitud
    C: Examen de la vista virtual
    D: Toma de huellas dactilares en línea
  answer: B
  explanation: Si tiene 15 años o más, o es nuevo en el estado, use nuestro servicio
    de presolicitud en línea. Esto le ahorrará tiempo cuando visite nuestra oficina.
- id: 16
  category: vehicle_information
  question: Según el texto proporcionado, ¿cuál de las siguientes tareas de registro
    de vehículos se puede completar en línea?
  choices:
    A: Solicitar un diseño de placa (matrícula) personalizada
    B: Renovar las calcomanías (tabs) de su vehículo
    C: Impugnar una multa de estacionamiento
    D: Programar un examen de conducir
  answer: B
  explanation: El manual enumera 'Renovar las calcomanías (tabs) de su vehículo' en
    los servicios de Registro de Vehículos en línea.
- id: 17
  category: vehicle_information
  question: Si necesita estimar su impuesto especial de la Autoridad Regional de Tránsito
    (RTA), ¿cómo indica el manual que puede hacerlo?
  choices:
    A: En una estación de policía local
    B: A través de los servicios de registro de vehículos en línea
    C: Llamando al Departamento de Licencias
    D: En una estación de inspección de vehículos
  answer: B
  explanation: El texto enumera 'Estimar su impuesto especial de la Autoridad Regional
    de Tránsito (RTA)' como uno de los servicios de Registro de Vehículos en línea
    disponibles.
- id: 18
  category: vehicle_information
  question: Según los servicios en línea del manual, un cambio de dirección de 'Flota'
    se aplica a un mínimo de ¿cuántos vehículos?
  choices:
    A: 2 o más
    B: 3 o más
    C: 5 o más
    D: 10 o más
  answer: C
  explanation: 'La sección de servicios en línea especifica ''Cambio de dirección:
    Flotas (5 o más vehículos)''.'
- id: 19
  category: penalties_and_points
  question: ¿Cuál de las siguientes solicitudes de audiencia se puede enviar en línea
    según el manual?
  choices:
    A: Audiencia por multa de exceso de velocidad
    B: Solicitud de audiencia por DUI
    C: Audiencia por infracción de estacionamiento
    D: Audiencia por cámara de luz roja
  answer: B
  explanation: El texto enumera explícitamente 'Enviar su solicitud de audiencia por
    DUI' en los servicios de registros en línea.
- id: 20
  category: safe_driving_rules
  question: En la sección 'Antes de conducir', ¿cuál de los siguientes se enumera
    como un paso necesario?
  choices:
    A: Comprobar las emisiones de escape del vehículo
    B: Asegurar su carga
    C: Mejorar sus faros delanteros
    D: Rotar sus neumáticos
  answer: B
  explanation: El índice enumera 'Asegurar su carga' como un tema bajo el capítulo
    'Antes de conducir'.
- id: 21
  category: safe_driving_rules
  question: ¿Cuál de los siguientes temas se trata en la sección 'Reglas de la carretera'?
  choices:
    A: Reventón de neumático
    B: Carriles HOT y carriles de peaje exprés
    C: Falla de frenos
    D: Certificado de propiedad
  answer: B
  explanation: El índice enumera 'Carriles HOT y carriles de peaje exprés' en el capítulo
    'Reglas de la carretera'.
- id: 22
  category: vehicle_information
  question: Según el índice, ¿dónde buscaría información sobre 'Vehículos eléctricos
    de batería de baja velocidad'?
  choices:
    A: La licencia de conducir
    B: Reglas de la carretera
    C: En condiciones para conducir
    D: Licenciamiento de vehículos
  answer: B
  explanation: La información sobre 'Vehículos eléctricos de batería de baja velocidad'
    se encuentra en la sección 'Reglas de la carretera' del manual.
- id: 23
  category: safe_driving_rules
  question: ¿En qué sección del manual se encuentran los temas de 'Conducción distraída'
    y 'Dispositivos electrónicos personales'?
  choices:
    A: Consejos para una conducción segura
    B: Emergencias
    C: Licenciamiento de vehículos
    D: Antes de conducir
  answer: A
  explanation: El índice ubica 'Conducción distraída' y 'Dispositivos electrónicos
    personales' en el capítulo 'Consejos para una conducción segura'.
- id: 24
  category: defensive_driving
  question: Si experimenta una situación en la que el 'pedal del acelerador se queda
    pegado', ¿qué sección del manual ofrece orientación?
  choices:
    A: Reglas de la carretera
    B: Consejos para una conducción segura
    C: Emergencias
    D: En condiciones para conducir
  answer: C
  explanation: El tema 'El pedal del acelerador se queda pegado' aparece en el capítulo
    'Emergencias' del índice.
- id: 25
  category: alcohol_drugs_health
  question: Según la sección 'En condiciones para conducir', ¿cuál de los siguientes
    temas se aborda específicamente junto con el consumo de alcohol y la conducción?
  choices:
    A: Comer mientras se conduce
    B: Marihuana y otras drogas
    C: Escuchar música a alto volumen
    D: Hablar con los pasajeros
  answer: B
  explanation: El capítulo 'En condiciones para conducir' enumera específicamente
    'Marihuana' y 'Otras drogas' inmediatamente después de los temas de 'Consumo de
    alcohol y conducción'.
- id: 26
  category: vehicle_information
  question: ¿Cuál de los siguientes aparece como un tema específico bajo 'Licenciamiento
    de vehículos'?
  choices:
    A: Informe de venta
    B: Ajuste de asiento y espejos
    C: Carriles reversibles
    D: Cómo evitar colisiones
  answer: A
  explanation: El índice enumera 'Informe de venta' en el capítulo 'Licenciamiento
    de vehículos'.
- id: 27
  category: sharing_the_road
  question: En la sección 'Consejos para una conducción segura', ¿las responsabilidades
    de qué grupos específicos se destacan junto con el hecho de compartir la carretera?
  choices:
    A: Responsabilidades de los peatones
    B: Responsabilidades de ciclistas y motociclistas
    C: Responsabilidades de los conductores de camiones comerciales
    D: Responsabilidades de las fuerzas del orden
  answer: B
  explanation: El índice enumera 'Responsabilidades de los ciclistas' y 'Responsabilidades
    de los motociclistas' en el capítulo 'Consejos para una conducción segura'.
- id: 28
  category: license_system
  question: ¿En qué capítulo principal incluye el manual una sección específica sobre
    el 'Registro de delincuentes sexuales/delincuentes por secuestro'?
  choices:
    A: Reglas de la carretera
    B: La licencia de conducir
    C: En condiciones para conducir
    D: Emergencias
  answer: B
  explanation: El índice ubica el 'Registro de delincuentes sexuales/delincuentes
    por secuestro' en el capítulo 'La licencia de conducir'.
- id: 29
  category: defensive_driving
  question: Según el índice, ¿cuál de los siguientes se considera parte del capítulo
    'Emergencias'?
  choices:
    A: Ajustarse al tráfico
    B: Cómo lidiar con derrapes
    C: Mantenerse a la derecha excepto para rebasar
    D: Exploración visual (Scanning)
  answer: B
  explanation: El tema 'Cómo lidiar con derrapes' aparece en el capítulo 'Emergencias'.
- id: 30
  category: vehicle_information
  question: ¿Cuál de los siguientes documentos se analiza específicamente en la sección
    'Licenciamiento de vehículos'?
  choices:
    A: Prueba de identidad
    B: Certificado de propiedad (Título)
    C: Real ID
    D: Licencia probatoria
  answer: B
  explanation: El índice enumera 'Certificado de propiedad (Título)' en el capítulo
    'Licenciamiento de vehículos'.
- id: 31
  category: license_system
  question: ¿Cuántos días tienen los nuevos residentes para obtener una licencia de
    conducir del estado de Washington después de convertirse en residentes?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Según el manual, los nuevos residentes deben obtener una licencia de
    conducir del estado de Washington dentro de los 30 días posteriores a la fecha
    en que se conviertan en residentes.
- id: 32
  category: license_system
  question: ¿Cuál de las siguientes acciones lo convierte en residente del estado
    de Washington para fines de obtención de la licencia?
  choices:
    A: Visitar el estado para unas vacaciones de tres meses
    B: Registrarse para votar en el estado
    C: Alquilar una habitación de hotel por dos semanas
    D: Conducir a través del estado en un viaje por todo el país
  answer: B
  explanation: El manual establece que usted es residente si se registra para votar
    en este estado, entre otros criterios como pagar la matrícula estatal (in-state
    tuition) o recibir beneficios estatales.
- id: 33
  category: license_system
  question: ¿Qué edad debe tener un no residente o un visitante a corto plazo para
    operar un vehículo motorizado en Washington con una licencia válida de otro estado?
  choices:
    A: Al menos 15 años de edad
    B: Al menos 15 años y medio de edad
    C: Al menos 16 años de edad
    D: Al menos 18 años de edad
  answer: C
  explanation: Si usted es un no residente o un visitante a corto plazo, puede operar
    un vehículo motorizado en este estado si tiene una licencia de conducir válida
    de su estado de origen y tiene al menos 16 años de edad.
- id: 34
  category: license_system
  question: Después del 3 de mayo de 2023, ¿para qué sigue siendo válida una licencia
    de conducir estándar de Washington?
  choices:
    A: Abordar vuelos nacionales
    B: Ingresar a bases militares seguras
    C: Ingresar a plantas de energía nuclear
    D: Conducir a través de las fronteras estatales o viajar en tren
  answer: D
  explanation: Aunque una licencia estándar ya no será aceptable para abordar vuelos
    nacionales o ingresar a instalaciones federales seguras, seguirá funcionando para
    viajes dentro de los EE. UU., como conducir en Washington, cruzar fronteras estatales
    o viajar en tren.
- id: 35
  category: driver_responsibility
  question: ¿Quién debe supervisar a un conductor que opera un vehículo con un Permiso
    de instrucción (Instruction Permit)?
  choices:
    A: Cualquier conductor con licencia mayor de 18 años
    B: Un conductor con licencia que tenga al menos cinco años de experiencia en la
      conducción con licencia
    C: Un conductor con licencia que tenga al menos 25 años de edad
    D: Solo un padre o tutor legal
  answer: B
  explanation: Un Permiso de instrucción le permite operar un vehículo motorizado
    mientras es supervisado por un conductor con licencia que tenga al menos cinco
    años de experiencia en la conducción con licencia.
- id: 36
  category: safe_driving_rules
  question: ¿Dónde debe sentarse el conductor supervisor cuando acompaña a un conductor
    con un Permiso de instrucción?
  choices:
    A: En el asiento trasero directamente detrás del conductor
    B: En cualquier lugar del vehículo
    C: En el asiento del pasajero delantero derecho
    D: En el asiento trasero del lado del pasajero
  answer: C
  explanation: El manual especifica que el conductor con licencia que supervisa al
    titular de un Permiso de instrucción debe sentarse en el asiento del pasajero
    delantero derecho.
- id: 37
  category: license_system
  question: ¿A qué edad se le puede otorgar a un conductor una licencia de conducir
    intermedia en Washington?
  choices:
    A: 15 o 16 años de edad
    B: 16 o 17 años de edad
    C: 18 o 19 años de edad
    D: 21 años de edad
  answer: B
  explanation: Si tiene 16 o 17 años y cumple con los requisitos, Washington le otorgará
    una licencia intermedia con restricciones.
- id: 38
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir estándar de Washington?
  choices:
    A: Hasta 4 años a partir de la fecha de su último cumpleaños
    B: Hasta 5 años a partir de la fecha de su último cumpleaños
    C: Hasta 6 años a partir de la fecha de su último cumpleaños
    D: Hasta 8 años a partir de la fecha de su último cumpleaños
  answer: C
  explanation: Una licencia de conducir estándar es válida por hasta seis años a partir
    de la fecha de su último cumpleaños.
- id: 39
  category: license_system
  question: ¿Qué privilegio de viaje ofrece una Licencia de conducir mejorada (EDL)
    que una licencia estándar no ofrece?
  choices:
    A: Le permite abordar vuelos internacionales a Europa.
    B: Le permite cruzar las fronteras de Canadá y México por tierra o mar.
    C: Le permite conducir en países extranjeros sin un permiso internacional.
    D: Le permite evitar la aduana al regresar a los Estados Unidos.
  answer: B
  explanation: La licencia de conducir mejorada (EDL) de Washington cumple con la
    ley REAL ID, es válida para viajes aéreos dentro de los EE. UU. y puede usarse
    para cruzar las fronteras de Canadá y México por tierra o mar.
- id: 40
  category: license_system
  question: ¿Cuál es la edad mínima para obtener un permiso de instrucción si NO está
    inscrito en un curso de capacitación para conductores aprobado?
  choices:
    A: 15 años de edad
    B: 15 años y medio de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: B
  explanation: Para que se le otorgue un permiso de instrucción, debe tener al menos
    15 años y medio, o 15 años si está inscrito en un curso de capacitación para conductores
    aprobado.
- id: 41
  category: driver_testing
  question: ¿Cuántas horas de experiencia de conducción debe certificar un padre o
    tutor que usted ha completado antes de que pueda obtener una licencia intermedia?
  choices:
    A: 30 horas, incluyendo 5 horas por la noche
    B: 40 horas, incluyendo 10 horas por la noche
    C: 50 horas, incluyendo 10 horas por la noche
    D: 60 horas, incluyendo 15 horas por la noche
  answer: C
  explanation: Debe demostrar que su padre o tutor certifica que ha tenido al menos
    50 horas de experiencia de conducción, incluyendo 10 horas por la noche.
- id: 42
  category: driver_testing
  question: Para obtener una licencia intermedia, debe aprobar un curso de capacitación
    para conductores aprobado que incluya al menos ¿cuántas horas de instrucción en
    el aula?
  choices:
    A: 10 horas
    B: 20 horas
    C: 30 horas
    D: 40 horas
  answer: C
  explanation: Debe presentar un comprobante de que ha aprobado un curso de capacitación
    para conductores aprobado con al menos 30 horas de instrucción en el aula y seis
    horas de instrucción al volante.
- id: 43
  category: safe_driving_rules
  question: ¿Cuáles son las horas restringidas de conducción para el titular de una
    licencia de conducir intermedia, a menos que esté acompañado por una persona calificada?
  choices:
    A: De 10 p. m. a 5 a. m.
    B: De 11 p. m. a 6 a. m.
    C: De 12 a. m. a 5 a. m.
    D: De 1 a. m. a 5 a. m.
  answer: D
  explanation: Una licencia intermedia le prohíbe conducir entre la 1 a. m. y las
    5 a. m., a menos que esté con un padre, un tutor o un conductor con licencia que
    tenga al menos 25 años de edad.
- id: 44
  category: safe_driving_rules
  question: Durante los primeros seis meses de tener una licencia intermedia, ¿cuál
    es la restricción con respecto a los pasajeros?
  choices:
    A: No se permiten pasajeros bajo ninguna circunstancia.
    B: Ningún pasajero menor de 20 años puede estar con usted a menos que sea un miembro
      de su familia inmediata.
    C: Solo puede llevar a un pasajero menor de 20 años.
    D: Puede llevar a cualquier pasajero siempre que use el cinturón de seguridad.
  answer: B
  explanation: Durante los primeros seis meses de una licencia intermedia, ningún
    pasajero menor de 20 años puede estar con usted mientras conduce, a menos que
    esa persona sea un miembro de su familia inmediata.
- id: 45
  category: license_system
  question: Bajo una licencia intermedia, no puede conducir entre la 1 a. m. y las
    5 a. m. a menos que esté acompañado por un padre, tutor o un conductor con licencia
    que tenga al menos ¿qué edad?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: C
  explanation: El manual establece que con una licencia intermedia, no puede conducir
    entre la 1 a. m. y las 5 a. m. a menos que esté con un padre, un tutor o un conductor
    con licencia que tenga al menos 25 años de edad.
- id: 46
  category: license_system
  question: Durante los primeros seis meses de tener una licencia intermedia, ¿quién
    puede viajar como pasajero en su vehículo?
  choices:
    A: Hasta tres pasajeros menores de 20 años
    B: Ningún pasajero menor de 20 años a menos que sea familia inmediata
    C: Cualquier conductor con licencia menor de 20 años
    D: Solo pasajeros mayores de 25 años
  answer: B
  explanation: Según el manual, durante los primeros seis meses de una licencia intermedia,
    ningún pasajero menor de 20 años puede estar con usted mientras conduce, a menos
    que esa persona sea un miembro de su familia inmediata.
- id: 47
  category: penalties_and_points
  question: ¿Cuál es la sanción por una segunda infracción de las restricciones de
    la licencia intermedia durante el primer año?
  choices:
    A: Se envía una carta de advertencia a su padre o tutor
    B: Su licencia se suspende por seis meses o hasta los 18 años
    C: Su licencia se suspende hasta los 21 años
    D: Debe volver a tomar el examen de conducción
  answer: B
  explanation: El manual establece que por una segunda infracción, se le suspende
    la licencia por seis meses (o hasta los 18 años, lo que ocurra primero).
- id: 48
  category: safe_driving_rules
  question: ¿Cuándo se le permite a un conductor con una licencia intermedia usar
    un teléfono celular mientras opera un vehículo?
  choices:
    A: Cuando usa un dispositivo de manos libres
    B: Cuando está detenido en un semáforo en rojo
    C: Para denunciar una actividad ilegal o solicitar ayuda de emergencia
    D: Para obtener indicaciones de una aplicación de GPS
  answer: C
  explanation: Los titulares de licencias intermedias no pueden usar un teléfono celular
    a menos que utilicen el dispositivo para denunciar una actividad ilegal, solicitar
    ayuda médica o de otra emergencia, o para evitar lesiones a una persona o propiedad.
- id: 49
  category: license_system
  question: ¿A qué edad una licencia intermedia se convierte automáticamente en una
    licencia de conducir estándar sin restricciones?
  choices:
    A: '18'
    B: '19'
    C: '20'
    D: '21'
  answer: A
  explanation: 'El manual establece: "En su cumpleaños número 18, su licencia se convertirá
    en una licencia de conducir estándar sin las restricciones de la licencia intermedia".'
- id: 50
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el examen
    de conocimientos?
  choices:
    A: 25 de 30
    B: 32 de 40
    C: 35 de 40
    D: 40 de 50
  answer: B
  explanation: El examen de conocimientos es una prueba de opción múltiple con 40
    preguntas, y debe responder correctamente 32 de ellas para aprobar el examen.
- id: 51
  category: driver_testing
  question: ¿Por cuánto tiempo es válido el resultado aprobado del examen de conocimientos?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Según el manual, el resultado aprobado del examen de conocimientos
    tiene una validez de dos años.
- id: 52
  category: driver_testing
  question: ¿A quién se le permite estar en el vehículo con usted y el examinador
    durante el examen de conducción?
  choices:
    A: Un padre o tutor
    B: Un intérprete de idiomas extranjeros
    C: Un animal de servicio o un intérprete para personas sordas
    D: Un instructor de conducción con licencia
  answer: C
  explanation: El manual especifica que solo usted, el examinador, un animal de servicio
    y un intérprete para personas sordas o con dificultades auditivas están permitidos
    en el vehículo durante el examen.
- id: 53
  category: driver_testing
  question: ¿Qué debe hacer al retroceder su vehículo durante el examen de conducción?
  choices:
    A: Confiar únicamente en su espejo retrovisor
    B: Girar la cabeza y mirar hacia atrás
    C: Tocar la bocina antes de moverse
    D: Usar solo sus espejos laterales
  answer: B
  explanation: Durante el examen, debe girar la cabeza y mirar hacia atrás para detectar
    vehículos motorizados, ciclistas y peatones cuando esté retrocediendo su vehículo.
- id: 54
  category: license_system
  question: ¿Por cuánto tiempo puede ser válida una licencia de conducir de Washington
    renovada?
  choices:
    A: Hasta 4 años
    B: Hasta 5 años
    C: Hasta 6 años
    D: Hasta 8 años
  answer: C
  explanation: 'El manual establece: "Su licencia renovada puede ser válida hasta
    por seis años y vencerá en su cumpleaños".'
- id: 55
  category: license_system
  question: ¿Debe pagar un cargo por demora adicional si renueva su licencia más de
    cuántos días después de que haya vencido?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Según el manual, si renueva su licencia más de 60 días después de su
    vencimiento, debe pagar un cargo por demora adicional.
- id: 56
  category: license_system
  question: ¿Cuántos días tiene para notificar al Departamento de Licencias sobre
    un cambio de dirección o de nombre legal?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Debe notificar al Departamento dentro de los diez días posteriores
    a un cambio de dirección o un cambio de nombre legal.
- id: 57
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una razón por la que puede perder su licencia
    de conducir?
  choices:
    A: Recibir una sola multa de estacionamiento
    B: Negarse a permitir que un oficial de policía le realice una prueba de alcohol
    C: Conducir a 5 mph sobre el límite de velocidad
    D: No renovar su licencia un día después de su vencimiento
  answer: B
  explanation: El manual enumera "negarse a permitir que un oficial de policía le
    realice una prueba de alcohol" como una de las razones por las que puede perder
    su licencia.
- id: 58
  category: license_system
  question: Si decide no quitarse un artículo que obstruye la vista completa de su
    rostro para la foto de su licencia (y no tiene una excepción médica o religiosa),
    ¿qué sucederá?
  choices:
    A: Su licencia se marcará como "No válida para identificación"
    B: Se le negará la licencia de conducir por completo
    C: Deberá pagar un cargo adicional
    D: Se le emitirá un permiso temporal en su lugar
  answer: A
  explanation: El manual establece que si decide no retirar una obstrucción de su
    rostro y cabeza, su licencia se marcará como "No válida para identificación" (Not
    Valid for Identification).
- id: 59
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito para el vehículo que traiga a
    su examen de conducción?
  choices:
    A: Debe tener menos de 10 años de antigüedad
    B: Debe tener controles duales para el examinador
    C: Debe tener licencia y registro legales, y no tener partes defectuosas
    D: Debe tener transmisión automática
  answer: C
  explanation: Para el examen de conducción, debe traer un vehículo que tenga licencia
    y registro legales, y no debe tener partes defectuosas.
- id: 60
  category: penalties_and_points
  question: Si usted es un conductor sin seguro involucrado en una colisión, ¿por
    cuánto tiempo se le puede suspender la licencia?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 10 años
  answer: B
  explanation: El manual establece que el Departamento de Licencias puede suspender
    la licencia de un conductor sin seguro involucrado en una colisión por hasta tres
    años.
- id: 61
  category: penalties_and_points
  question: ¿No cumplir con una sentencia de un tribunal civil derivada de una colisión
    puede resultar en la suspensión de la licencia por cuántos años?
  choices:
    A: 3 o más años
    B: 5 o más años
    C: 10 o más años
    D: 13 o más años
  answer: D
  explanation: No cumplir con una sentencia de un tribunal civil derivada de una colisión
    puede resultar en una suspensión por 13 o más años.
- id: 62
  category: penalties_and_points
  question: ¿Cuál de las siguientes acciones puede resultar en la pérdida de su licencia
    de conducir?
  choices:
    A: Irse de una gasolinera sin pagar por el combustible que ha bombeado.
    B: Estacionarse a más de 12 pulgadas del bordillo.
    C: Conducir a 5 mph por encima del límite de velocidad en una autopista.
    D: No lavar su vehículo regularmente.
  answer: A
  explanation: Según el manual, usted puede perder su licencia por irse de una gasolinera
    sin pagar por el combustible que ha bombeado.
- id: 63
  category: penalties_and_points
  question: ¿Cuántas infracciones de tránsito debe recibir mientras conduce con una
    licencia intermedia para perder su privilegio de conducir?
  choices:
    A: Una o más
    B: Dos o más
    C: Tres o más
    D: Cuatro o más
  answer: B
  explanation: Usted puede perder su licencia por recibir dos o más infracciones de
    tránsito mientras conduce con una licencia intermedia.
- id: 64
  category: penalties_and_points
  question: Si recibe una multa y no cumple en un plazo de 15 días, el tribunal notifica
    al Departamento de Licencias. ¿Cuántos días tiene entonces para cumplir antes
    de que se suspenda su privilegio de conducir?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: C
  explanation: Si no cumple en un plazo de 15 días, el tribunal notifica al departamento
    y este envía por correo un Aviso de Suspensión. Luego tiene 45 días para cumplir
    o se le suspenderá su privilegio de conducir.
- id: 65
  category: driver_responsibility
  question: Los delincuentes sexuales y los delincuentes por secuestro en el estado
    de Washington deben registrarse con el alguacil del condado (sheriff) ¿dentro
    de cuántos días después de establecer su residencia?
  choices:
    A: Tres días hábiles
    B: Cinco días hábiles
    C: Diez días hábiles
    D: Treinta días
  answer: A
  explanation: Los delincuentes sexuales y los delincuentes por secuestro en el estado
    de Washington deben registrarse dentro de los tres días hábiles posteriores a
    establecer, o restablecer, su residencia.
- id: 66
  category: license_system
  question: Para registrarse para votar en una oficina de licencias de conducir, debe
    ser ciudadano de los Estados Unidos, residente del estado de Washington y tener
    al menos ¿qué edad?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Para registrarse para votar, debe ser ciudadano de los Estados Unidos
    cuyos derechos civiles no estén revocados actualmente, residente del estado de
    Washington y tener al menos 18 años.
- id: 67
  category: license_system
  question: ¿Qué sucede si un solicitante masculino menor de 26 años se niega a registrarse
    en el Sistema de Servicio Selectivo (SSS) al solicitar una licencia de conducir?
  choices:
    A: Su solicitud será denegada de inmediato.
    B: Se le otorgará una licencia restringida.
    C: No se le puede denegar el documento solicitado si cumple con todos los demás
      requisitos.
    D: Debe pagar una tarifa adicional para recibir su licencia.
  answer: C
  explanation: A un solicitante que se niegue a registrarse en el SSS no se le puede
    denegar el documento solicitado si cumple con todos los demás requisitos para
    recibir dicho documento.
- id: 68
  category: license_system
  question: ¿El Departamento de Licencias pregunta si usted es gemelo o trillizo en
    cooperación con qué institución para la investigación médica?
  choices:
    A: Washington State University
    B: University of Washington
    C: LifeCenter Northwest
    D: The Department of Health
  answer: B
  explanation: El departamento pregunta si usted es gemelo o trillizo en cooperación
    con la Universidad de Washington, que cuenta con el registro de gemelos más grande
    de los Estados Unidos.
- id: 69
  category: license_system
  question: ¿Cuál de las siguientes acciones está permitida con una Licencia de Conducir
    Mejorada (EDL) pero NO con una Licencia de Conducir Estándar?
  choices:
    A: Operar un vehículo motorizado
    B: Viajes aéreos nacionales
    C: Acceso a instalaciones federales que no requieren identificación
    D: Cruce de fronteras internacionales por tierra o mar
  answer: D
  explanation: Una Licencia de Conducir Mejorada permite el cruce de fronteras internacionales
    por tierra o mar, mientras que una Licencia de Conducir Estándar no lo permite.
- id: 70
  category: defensive_driving
  question: El riesgo es generado por los tres componentes del Sistema de Transporte
    por Carretera (HTS). ¿Cuáles son estos tres componentes?
  choices:
    A: El conductor, el vehículo y el entorno de la carretera
    B: El clima, el vehículo y el conductor
    C: Los peatones, la carretera y el clima
    D: El límite de velocidad, el conductor y el vehículo
  answer: A
  explanation: 'El riesgo es generado por los tres componentes del Sistema de Transporte
    por Carretera: el conductor, el vehículo y el entorno de la carretera.'
- id: 71
  category: safe_driving_rules
  question: Según los datos de accidentes de Washington de 2009 a 2011, ¿cuál fue
    el factor más común presente en los accidentes fatales?
  choices:
    A: Exceso de velocidad
    B: Salirse de la calzada
    C: Deterioro del conductor (impairment)
    D: Distracción del conductor
  answer: C
  explanation: El deterioro del conductor fue el factor más común, presente en el
    50.1% de los accidentes fatales.
- id: 72
  category: driver_responsibility
  question: ¿Cuál es la principal causa de muerte para los jóvenes de 16 a 25 años
    en Washington?
  choices:
    A: Sobredosis de drogas
    B: Accidentes de vehículos motorizados
    C: Ahogamiento
    D: Accidentes laborales
  answer: B
  explanation: Los accidentes de vehículos motorizados son la principal causa de muerte
    para los jóvenes de 16 a 25 años en Washington.
- id: 73
  category: penalties_and_points
  question: ¿Qué puede suceder si lo sorprenden conduciendo mientras su privilegio
    está suspendido debido a una infracción por falta de comparecencia (FTA)?
  choices:
    A: Se le dará una advertencia.
    B: Puede ser arrestado y su vehículo puede ser confiscado.
    C: Su vehículo será confiscado permanentemente.
    D: Se le requerirá volver a tomar el examen de conducir de inmediato.
  answer: B
  explanation: Si no cumple, su privilegio de conducir se suspende. Puede ser arrestado
    y su vehículo puede ser confiscado si lo sorprenden conduciendo mientras su privilegio
    está suspendido.
- id: 74
  category: license_system
  question: ¿Quién es elegible para que el Departamento de Licencias le emita una
    tarjeta de identificación con foto?
  choices:
    A: Solo personas mayores de 18 años.
    B: Solo personas que hayan aprobado un examen de conducir escrito.
    C: No conductores de cualquier edad.
    D: Solo personas que tengan una licencia de conducir suspendida.
  answer: C
  explanation: 'El manual establece: ''Emitimos tarjetas de identificación con foto
    a no conductores de cualquier edad''.'
- id: 75
  category: driver_responsibility
  question: ¿Cuál es el seguro de responsabilidad civil mínimo requerido para daños
    a la propiedad en cualquier colisión en Washington?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: Debe tener una póliza de responsabilidad civil para automóviles que
    proporcione $10,000 o más, pagaderos por lesiones o destrucción de la propiedad
    de terceros en cualquier colisión.
- id: 76
  category: driver_responsibility
  question: ¿Cuál de los siguientes vehículos está exento del requisito de seguro
    de responsabilidad civil del estado?
  choices:
    A: Automóviles de pasajeros fabricados después de 1993
    B: Ciclomotores (mopeds)
    C: Vehículos utilitarios deportivos (SUV)
    D: Camionetas de entrega comercial
  answer: B
  explanation: Los conductores de vehículos gubernamentales, ciclomotores y vehículos
    de transporte público o por contrato están exentos de este requisito de seguro.
- id: 77
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    en Washington?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: Si la banda de rodadura no llega al menos a la cabeza de Lincoln (2/32
    de pulgada) al verificar con una moneda de un centavo, el neumático es ilegal
    e inseguro y debe ser reemplazado.
- id: 78
  category: vehicle_information
  question: ¿Cuándo es el mejor momento para revisar la presión de aire de sus neumáticos?
  choices:
    A: Inmediatamente después de conducir por la autopista
    B: Cuando los neumáticos están fríos
    C: Durante la parte más calurosa del día
    D: Cuando los neumáticos están calientes al tacto
  answer: B
  explanation: El manual aconseja revisar la presión de aire de los neumáticos con
    un manómetro cuando los neumáticos están fríos.
- id: 79
  category: vehicle_information
  question: ¿Por qué nunca debe girar el encendido de su vehículo a la posición 'lock'
    (bloqueo) mientras está en movimiento?
  choices:
    A: Hará que el motor se sobrecaliente.
    B: Agotará la batería del vehículo.
    C: Hará que la dirección se bloquee y perderá el control.
    D: Dañará permanentemente la transmisión.
  answer: C
  explanation: Girar el encendido a la posición 'lock' mientras está en movimiento
    hará que la dirección se bloquee si intenta girar el volante, lo que resultará
    en una pérdida de control de su vehículo.
- id: 80
  category: vehicle_information
  question: ¿Cuál es un peligro potencial de un sistema de escape con fugas?
  choices:
    A: Puede hacer que el parabrisas se empañe.
    B: Puede causar la muerte dentro de un vehículo en muy poco tiempo.
    C: Hará que el volante vibre.
    D: Aumenta la posibilidad de un neumático desinflado.
  answer: B
  explanation: Los gases de un escape con fugas pueden causar la muerte dentro de
    un vehículo en muy poco tiempo. Nunca debe encender el motor en un garaje cerrado.
- id: 81
  category: vehicle_information
  question: 'Los vehículos de pasajeros fabricados después de 1993 deben tener:'
  choices:
    A: Una tercera luz de freno trasera montada en la parte superior central del vehículo.
    B: Limpiaparabrisas para las ventanas traseras y los faros delanteros.
    C: Un sistema de cámara de retroceso.
    D: Frenado de emergencia automático.
  answer: A
  explanation: Los camiones de pasajeros, automóviles, camionetas y vehículos utilitarios
    deportivos (SUV) fabricados después de 1993 deben tener una tercera luz de freno
    trasera montada en la parte superior central del vehículo.
- id: 82
  category: vehicle_information
  question: Si su vehículo continúa rebotando después de un bache o una parada, ¿qué
    sistema probablemente deba ser revisado por un mecánico?
  choices:
    A: Sistema de frenado
    B: Sistema de dirección
    C: Sistema de suspensión
    D: Sistema de escape
  answer: C
  explanation: Si el vehículo continúa rebotando después de un bache o una parada,
    o es difícil de controlar, es posible que necesite amortiguadores nuevos o piezas
    de suspensión y debe hacer que un mecánico lo revise.
- id: 83
  category: safe_driving_rules
  question: ¿Cuándo se considera legalmente asegurada una carga en un vehículo o remolque?
  choices:
    A: Cuando está amarrada con al menos una cuerda.
    B: Cuando nada puede deslizarse, desplazarse, caerse, filtrarse hacia la calzada
      o salir volando.
    C: Cuando está cubierta por una lona, incluso si puede desplazarse.
    D: Cuando el vehículo viaja a menos de 40 mph.
  answer: B
  explanation: Una carga debe estar bien sujeta y solo se considera segura cuando
    nada puede deslizarse, desplazarse, caerse o filtrarse hacia la calzada, ni salir
    volando.
- id: 84
  category: penalties_and_points
  question: Según la Ley de Maria (Maria's Law), ¿cuál es la pena máxima por no asegurar
    adecuadamente una carga que cause lesiones o la muerte?
  choices:
    A: Una multa de $500 y la suspensión de la licencia
    B: Un cargo por delito menor y 30 días de cárcel
    C: Un cargo por delito menor grave (gross misdemeanor), hasta un año de cárcel
      y una multa de $5,000
    D: Un cargo por delito grave (felony) y hasta cinco años de prisión
  answer: C
  explanation: Una persona que cause lesiones o la muerte por no asegurar una carga
    adecuadamente puede ser acusada de un delito menor grave (gross misdemeanor) y
    puede enfrentar una pena máxima de un año de cárcel y una multa de $5,000.
- id: 85
  category: penalties_and_points
  question: ¿A qué cargo puede enfrentarse un conductor si sus objetos no asegurados
    causan daños a la propiedad?
  choices:
    A: Una infracción de tráfico
    B: Un delito menor (misdemeanor)
    C: Un delito menor grave (gross misdemeanor)
    D: Un delito grave (felony)
  answer: B
  explanation: Un conductor cuyos objetos no asegurados causen daños a la propiedad
    puede ser acusado de un delito menor (misdemeanor).
- id: 86
  category: defensive_driving
  question: ¿Qué debe hacer si ve un vehículo conduciendo con una carga no asegurada?
  choices:
    A: Tocar la bocina continuamente hasta que se detengan a un lado.
    B: Acercarse mucho a su lado para advertir al conductor.
    C: Mantenerse lo más lejos posible y llamar al 911 cuando sea seguro.
    D: Usar las luces altas para llamar su atención.
  answer: C
  explanation: Si ve un vehículo conduciendo con una carga no asegurada, debe mantenerse
    lo más lejos posible y llamar al 911 cuando sea seguro para usted hacerlo.
- id: 87
  category: vehicle_information
  question: ¿Cuál es una consecuencia de conducir con neumáticos desequilibrados o
    con baja presión de aire?
  choices:
    A: Reduce el ahorro de combustible y hace que el vehículo sea más difícil de dirigir
      y detener.
    B: Hace que el motor pierda potencia y se apague.
    C: Mejora la tracción en carreteras mojadas.
    D: Hace que el sistema de escape se sobrecaliente.
  answer: A
  explanation: Los neumáticos desequilibrados y la baja presión causan un desgaste
    más rápido de los neumáticos, reducen el ahorro de combustible y hacen que el
    vehículo sea más difícil de dirigir y detener.
- id: 88
  category: driver_responsibility
  question: Según el manual, ¿qué porcentaje de la basura en las autopistas proviene
    de cargas no aseguradas?
  choices:
    A: 20%
    B: 30%
    C: 40%
    D: 50%
  answer: C
  explanation: Según el Departamento de Ecología del Estado de Washington, aproximadamente
    el 40% de la basura en las autopistas proviene de cargas no aseguradas, lo que
    causa cientos de choques al año.
- id: 89
  category: penalties_and_points
  question: ¿Cuál es la pena máxima por conducir con una carga no asegurada en el
    estado de Washington?
  choices:
    A: 6 meses de cárcel y una multa de $1,000
    B: 1 año de cárcel y una multa de $5,000
    C: 2 años de cárcel y una multa de $10,000
    D: Una multa de $500 y una suspensión de la licencia de 30 días
  answer: B
  explanation: El manual establece que conducir con una carga no asegurada conlleva
    una pena máxima de un año de cárcel y una multa de $5,000.
- id: 90
  category: vehicle_information
  question: ¿Cuánto puede reducir la luz emitida la suciedad en los lentes de sus
    faros delanteros, luces de retroceso, de freno y traseras?
  choices:
    A: 10 por ciento
    B: 25 por ciento
    C: 50 por ciento
    D: 75 por ciento
  answer: C
  explanation: Según el manual, la suciedad en los lentes puede reducir la luz en
    un 50 por ciento.
- id: 91
  category: safe_driving_rules
  question: Al ajustar su asiento y el volante antes de conducir, ¿qué parte del volante
    debe quedar, como mínimo, entre sus manos?
  choices:
    A: Un cuarto
    B: Un tercio
    C: La mitad
    D: Dos tercios
  answer: B
  explanation: Debe tener una visión clara en todas las direcciones, todos los controles
    deben estar a su alcance y al menos un tercio del volante debe estar entre sus
    manos.
- id: 92
  category: safe_driving_rules
  question: ¿Cómo debe posicionar su asiento en relación con la bolsa de aire (air
    bag) del vehículo?
  choices:
    A: De modo que la bolsa de aire le golpee en la cara
    B: De modo que la bolsa de aire le golpee en el pecho
    C: De modo que la bolsa de aire se despliegue por encima de su cabeza
    D: De modo que la bolsa de aire le golpee en el estómago
  answer: B
  explanation: Debe sentarse de modo que la bolsa de aire le golpee en el pecho en
    caso de que ocurra una colisión.
- id: 93
  category: vehicle_information
  question: ¿Cómo debe ajustar sus espejos laterales para ver mejor el tráfico detrás
    de usted?
  choices:
    A: De modo que no pueda ver ninguna parte de su propio vehículo
    B: De modo que pueda ver todo el costado de su vehículo mientras está sentado
      hacia atrás
    C: De modo que pueda ver una pequeña parte del costado de su vehículo cuando se
      incline ligeramente hacia adelante
    D: De modo que apunten directamente al suelo detrás de sus neumáticos traseros
  answer: C
  explanation: Ajuste los espejos laterales de modo que pueda ver una pequeña parte
    del costado de su vehículo cuando se incline ligeramente hacia adelante. Esto
    le ayudará a ver el tráfico detrás de usted.
- id: 94
  category: penalties_and_points
  question: ¿Quién es responsable de pagar la multa si se descubre a un pasajero de
    17 años sin el cinturón de seguridad puesto?
  choices:
    A: El conductor del vehículo
    B: El pasajero de 17 años
    C: Los padres del pasajero
    D: Tanto el conductor como el pasajero
  answer: B
  explanation: Los pasajeros mayores de 16 años son responsables de usar sus cinturones
    de seguridad y de pagar cualquier multa.
- id: 95
  category: driver_responsibility
  question: ¿Por cuál de los siguientes pasajeros sin sujeción puede un conductor
    ser citado y multado?
  choices:
    A: Solo pasajeros menores de 12 años
    B: Solo pasajeros menores de 16 años
    C: Solo pasajeros sentados en el asiento delantero
    D: Cualquier pasajero independientemente de su edad
  answer: B
  explanation: El conductor será multado por cualquier pasajero menor de 16 años que
    no use correctamente el cinturón de seguridad o no esté asegurado en un sistema
    de sujeción de seguridad para niños.
- id: 96
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de usar el cinturón de regazo de un vehículo?
  choices:
    A: A través del estómago
    B: A través de los huesos de la cadera, debajo del estómago
    C: Holgado a través de los muslos
    D: Metido debajo del brazo
  answer: B
  explanation: Para abrocharse correctamente y obtener la mejor seguridad, ajuste
    el cinturón de regazo a través de los huesos de la cadera, por debajo del estómago.
- id: 97
  category: safe_driving_rules
  question: Según la ley de Washington, ¿hasta qué edad o estatura deben los niños
    usar un sistema de sujeción de seguridad para niños?
  choices:
    A: Hasta su sexto cumpleaños o 4'5" de estatura
    B: Hasta su octavo cumpleaños o 4'9" de estatura
    C: Hasta su décimo cumpleaños o 5'0" de estatura
    D: Hasta su duodécimo cumpleaños o 4'9" de estatura
  answer: B
  explanation: Los niños hasta su octavo cumpleaños, a menos que midan 4'9" de estatura
    (lo que ocurra primero), deben usar un sistema de sujeción de seguridad para niños.
- id: 98
  category: safe_driving_rules
  question: Según la ley de sujeción de niños de Washington, ¿los niños menores de
    qué edad deben ser transportados en el asiento trasero cuando sea práctico hacerlo?
  choices:
    A: Menores de 8 años
    B: Menores de 10 años
    C: Menores de 12 años
    D: Menores de 13 años
  answer: D
  explanation: La ley de sujeción de niños de Washington exige que los niños menores
    de 13 años sean transportados en el asiento trasero cuando sea práctico hacerlo.
- id: 99
  category: vehicle_information
  question: ¿Qué tipo de sistema de sujeción de seguridad para niños se describe como
    el mejor asiento para un niño pequeño porque lo sostiene y se mueve con él para
    reducir la tensión en el cuello y la médula espinal frágiles?
  choices:
    A: Un asiento de seguridad orientado hacia adelante
    B: Un asiento elevado (booster seat)
    C: Un asiento de seguridad orientado hacia atrás
    D: Un cinturón de seguridad estándar
  answer: C
  explanation: Un asiento de seguridad orientado hacia atrás es el mejor asiento para
    su hijo pequeño. Tiene un arnés que, en un choque, sostiene y se mueve con su
    hijo para reducir la tensión en el cuello y la médula espinal frágiles del niño.
- id: 100
  category: license_system
  question: ¿Cuáles son las reglas con respecto al uso de dispositivos inalámbricos
    para adolescentes con licencias de conducir intermedias o permisos de aprendizaje?
  choices:
    A: Solo pueden usar dispositivos de manos libres mientras conducen.
    B: No pueden usar ningún dispositivo inalámbrico mientras conducen, a menos que
      informen una emergencia.
    C: Pueden enviar mensajes de texto mientras están detenidos en un semáforo en
      rojo.
    D: Pueden usar un teléfono celular de mano si conducen solos.
  answer: B
  explanation: Los adolescentes con licencias de conducir intermedias o permisos de
    aprendizaje no pueden usar ningún dispositivo inalámbrico mientras conducen, incluidos
    los dispositivos de manos libres, a menos que estén informando una emergencia.
- id: 101
  category: defensive_driving
  question: ¿Según el manual, qué beneficio de seguridad ofrecen los dispositivos
    de manos libres en comparación con los dispositivos portátiles?
  choices:
    A: Reducen el riesgo de un choque en un 50 por ciento.
    B: Permiten que el conductor mantenga un enfoque visual total en la carretera.
    C: No ofrecen ningún beneficio de seguridad.
    D: Son completamente seguros de usar en tráfico denso.
  answer: C
  explanation: 'El manual establece explícitamente: "Los dispositivos de manos libres
    no ofrecen ningún beneficio de seguridad. Guardar su teléfono es la única forma
    segura de conducir".'
- id: 102
  category: penalties_and_points
  question: La ley de Protección de los Ocupantes en el estado de Washington es una
    ley de "aplicación primaria" (primary enforcement). ¿Qué significa esto?
  choices:
    A: Los oficiales solo pueden emitir una advertencia por una primera infracción.
    B: Los oficiales pueden detener y citar a los conductores únicamente por no usar
      el cinturón de seguridad.
    C: Los oficiales deben observar otra infracción de tráfico antes de citar por
      una infracción de cinturón de seguridad.
    D: Solo el conductor principal del vehículo puede ser citado.
  answer: B
  explanation: La ley de Protección de los Ocupantes en el estado de Washington es
    de "aplicación primaria", lo que significa que un oficial de la ley puede detener
    y citar a los conductores cuando se observa que ellos o sus pasajeros no llevan
    puesto el cinturón de seguridad.
- id: 103
  category: safe_driving_rules
  question: ¿Cuál es el número máximo de personas permitidas en el asiento delantero
    si esto bloquea su vista o interfiere con el control de su vehículo?
  choices:
    A: Dos personas
    B: Tres personas
    C: Cuatro personas
    D: No hay límite
  answer: B
  explanation: 'El manual establece: "No puede conducir con más de tres personas en
    el asiento delantero si esto bloquea su vista o interfiere con el control de su
    vehículo".'
- id: 104
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias puede un conductor con un permiso de aprendizaje
    usar un dispositivo inalámbrico mientras conduce?
  choices:
    A: Cuando usa un dispositivo de manos libres.
    B: Solo cuando informa de una emergencia.
    C: Cuando se detiene en el arcén por una situación que no es de emergencia.
    D: Cuando se detiene en un semáforo en rojo.
  answer: B
  explanation: El manual establece que los conductores con permisos no pueden usar
    ningún dispositivo inalámbrico mientras conducen, incluidos los dispositivos de
    manos libres, a menos que estén informando de una emergencia.
- id: 105
  category: signs_and_signals
  question: ¿Qué debe hacer si se aproxima a una intersección donde el semáforo no
    funciona?
  choices:
    A: Reducir la velocidad y proceder con precaución.
    B: Ceder el paso al vehículo a su derecha sin detenerse.
    C: Detenerse por completo y ceder el paso como si fuera una parada de cuatro vías
      (four-way stop).
    D: Esperar a que llegue un oficial de policía antes de proceder.
  answer: C
  explanation: Si un semáforo no funciona, debe detenerse por completo y luego ceder
    el paso al tráfico como si fuera una parada de cuatro vías.
- id: 106
  category: signs_and_signals
  question: ¿Qué indica una luz amarilla fija en un semáforo?
  choices:
    A: La luz está a punto de cambiar a rojo y debe detenerse si es seguro hacerlo.
    B: Debe acelerar para despejar la intersección antes de que la luz cambie a rojo.
    C: Debe detenerse por completo de inmediato, independientemente del tráfico circundante.
    D: Los giros a la izquierda están protegidos y usted tiene el derecho de paso.
  answer: A
  explanation: Una luz amarilla fija significa que el semáforo está a punto de cambiar
    a rojo. Debe detenerse si es seguro hacerlo.
- id: 107
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente?
  choices:
    A: Los giros a la izquierda están prohibidos.
    B: Se permiten los giros a la izquierda, pero debe ceder el paso al tráfico que
      viene en sentido contrario, ciclistas y peatones.
    C: Tiene un giro a la izquierda protegido y el tráfico que viene en sentido contrario
      debe detenerse.
    D: El semáforo está averiado y debe tratarlo como una parada de cuatro vías.
  answer: B
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero debe ceder el paso al tráfico que viene en sentido contrario,
    incluidos ciclistas y peatones.
- id: 108
  category: safe_driving_rules
  question: ¿Cuándo es legal girar a la izquierda con una luz roja fija en el semáforo?
  choices:
    A: Siempre que no haya tráfico en sentido contrario.
    B: Solo cuando se gira desde una calle de un solo sentido hacia una calle de doble
      sentido.
    C: Al girar hacia una calle de un solo sentido con el tráfico moviéndose hacia
      la izquierda, después de detenerse por completo y si ninguna señal lo prohíbe.
    D: Nunca es legal girar a la izquierda con luz roja.
  answer: C
  explanation: Puede girar a la izquierda hacia una calle de un solo sentido con el
    tráfico moviéndose hacia la izquierda después de detenerse por completo si no
    hay ninguna señal que prohíba los giros con luz roja.
- id: 109
  category: sharing_the_road
  question: Al girar a la derecha o a la izquierda, ¿cuándo debe detenerse para los
    peatones y ciclistas que cruzan delante de su vehículo?
  choices:
    A: Solo si están en un cruce de peatones marcado.
    B: Si están en, o a menos de, un carril de su mitad de la calzada.
    C: Solo si tienen una señal de caminar.
    D: Si están en cualquier lugar de la calzada, independientemente de la distancia.
  answer: B
  explanation: Debe detenerse para los peatones y ciclistas si están en, o a menos
    de, un carril de su mitad de la calzada.
- id: 110
  category: signs_and_signals
  question: ¿Cómo son típicamente las señales de advertencia?
  choices:
    A: Cuadradas y blancas con letras negras.
    B: Redondas y amarillas con un símbolo de 'X'.
    C: En forma de diamante y amarillas con letras o símbolos negros.
    D: Rectangulares y naranjas con letras negras.
  answer: C
  explanation: Las señales de advertencia suelen ser amarillas con letras o símbolos
    negros y la mayoría tiene forma de diamante.
- id: 111
  category: safe_driving_rules
  question: ¿Aproximadamente cuánto tiempo puede tardar un tren con 100 vagones en
    detenerse por completo?
  choices:
    A: Un cuarto de milla.
    B: Media milla.
    C: Hasta una milla.
    D: Dos millas.
  answer: C
  explanation: Los trenes son grandes y pueden moverse más rápido de lo que parecen;
    un tren con 100 vagones puede tardar hasta una milla en detenerse por completo.
- id: 112
  category: signs_and_signals
  question: ¿Qué significa una señal blanca en forma de X ("crossbuck") en un cruce
    de ferrocarril?
  choices:
    A: Tiene el mismo significado que una señal de "Ceda el paso" (Yield).
    B: Indica una parada completa obligatoria.
    C: Advierte que hay más de una vía adelante.
    D: Significa que el cruce está actualmente cerrado al tráfico.
  answer: A
  explanation: Una señal blanca en forma de X o "crossbuck" con la leyenda "Railroad
    Crossing" se encuentra en el cruce de ferrocarril. Esta señal tiene el mismo significado
    que una señal de "Ceda el paso" (Yield).
- id: 113
  category: safe_driving_rules
  question: ¿Qué es lo primero que debe hacer si su vehículo queda averiado en un
    cruce de ferrocarril y no se aproxima ningún tren?
  choices:
    A: Intente empujar el vehículo fuera de las vías usted mismo.
    B: Llame al 911 de inmediato.
    C: Llame al Sistema de Notificación de Emergencias (ENS) usando el número que
      aparece en la señal azul del cruce.
    D: Camine por las vías para buscar un tren que se aproxime.
  answer: C
  explanation: Si su vehículo queda averiado en el cruce, debe llamar de inmediato
    al Sistema de Notificación de Emergencias (ENS). El número de teléfono se encuentra
    en la señal azul adherida a la barrera del cruce de vías férreas.
- id: 114
  category: vehicle_information
  question: ¿Qué indica un triángulo naranja reflectante en la parte trasera de un
    vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo viaja a menos de 25 mph.
    C: El vehículo es de respuesta a emergencias.
    D: El vehículo está averiado y esperando una grúa.
  answer: B
  explanation: Un triángulo naranja reflectante en la parte trasera de un vehículo
    significa que viaja a menos de 25 mph. Esto se conoce como una señal de Vehículo
    de Movimiento Lento (Slow Moving Vehicle).
- id: 115
  category: penalties_and_points
  question: ¿Qué sucede con las multas por infracciones de movimiento en zonas de
    construcción cuando hay trabajadores presentes?
  choices:
    A: Se reducen a la mitad.
    B: Siguen siendo las mismas que las infracciones normales.
    C: Se duplican.
    D: Resultan en una suspensión automática de la licencia.
  answer: C
  explanation: Las multas se duplican por infracciones de movimiento en zonas de construcción
    cuando hay trabajadores presentes.
- id: 116
  category: signs_and_signals
  question: ¿Cuál es el propósito de las señales reglamentarias?
  choices:
    A: Advertir a los conductores sobre curvas cerradas y peligros más adelante.
    B: Proporcionar información sobre las reglas de dirección del tráfico, uso de
      carriles, velocidad y estacionamiento.
    C: Indicar dónde se encuentran servicios como gasolina y comida.
    D: Advertir que hay personas trabajando en la calzada o cerca de ella.
  answer: B
  explanation: Las señales reglamentarias le brindan información sobre las reglas
    para la dirección del tráfico, el uso de carriles, los giros, la velocidad, el
    estacionamiento y otras situaciones especiales.
- id: 117
  category: safe_driving_rules
  question: ¿Cuándo debe conducir al límite de velocidad máximo indicado?
  choices:
    A: En todo momento para evitar congestiones de tráfico.
    B: Solo en condiciones de conducción ideales.
    C: Solo cuando conduzca en el carril izquierdo.
    D: Siempre que llegue tarde a una emergencia.
  answer: B
  explanation: El límite máximo debe conducirse solo en condiciones de conducción
    ideales y debe reducir su velocidad cuando las condiciones lo requieran.
- id: 118
  category: signs_and_signals
  question: ¿Cuál es una de las funciones principales de las señales de límite de
    velocidad variable?
  choices:
    A: Cambiar permanentemente el límite de velocidad de una autopista.
    B: Advertir a los conductores sobre congestiones más adelante y distribuir uniformemente
      el flujo de tráfico.
    C: Mostrar la velocidad actual de los vehículos que pasan.
    D: Indicar la velocidad mínima requerida para conducir en una autopista.
  answer: B
  explanation: Las señales de límite de velocidad variable son señales digitales que
    publican límites de velocidad variables que ayudan a advertir a los conductores
    sobre congestiones más adelante en un intento de distribuir uniformemente el flujo
    de tráfico.
- id: 119
  category: penalties_and_points
  question: ¿Cuál es la multa por no usar cadenas cuando lo requiere una señal de
    aviso de tracción (Traction Advisory)?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1000
  answer: C
  explanation: Según el manual, existe una multa de $500 por no usar cadenas cuando
    lo requieren las señales de aviso de tracción (Traction Advisory).
- id: 120
  category: signs_and_signals
  question: ¿Cómo es una señal triangular de zona de no adelantar (No Passing Zone)
    y dónde se coloca?
  choices:
    A: Es roja y blanca y se coloca en el lado derecho de la calzada.
    B: Es amarilla o naranja y se coloca en el lado izquierdo de la calzada.
    C: Es verde y blanca y se coloca en el lado izquierdo de la calzada.
    D: Es negra y blanca y se coloca en el lado derecho de la calzada.
  answer: B
  explanation: El manual establece que una señal triangular de zona de no adelantar
    (No Passing Zone) es amarilla o naranja y se coloca en el lado izquierdo de la
    calzada.
- id: 121
  category: penalties_and_points
  question: ¿Cuál es la multa por estacionarse en un espacio para personas con discapacidad
    sin exhibir el cartel o la placa requerida?
  choices:
    A: $100
    B: $250
    C: $500
    D: $750
  answer: B
  explanation: Existe una multa de $250 por estacionarse en espacios sin exhibir el
    cartel o la placa requerida y por bloquear el pasillo de acceso junto a un espacio
    reservado.
- id: 122
  category: safe_driving_rules
  question: ¿Qué significa una línea blanca discontinua entre los carriles de tráfico?
  choices:
    A: Puede cruzarla para cambiar de carril si es seguro.
    B: Debe permanecer en su carril a menos que una situación especial lo requiera.
    C: Se está acercando a una zona de no rebasar.
    D: Está conduciendo en un carril reversible.
  answer: A
  explanation: Una línea blanca discontinua entre los carriles de tráfico significa
    que puede cruzarla para cambiar de carril si es seguro.
- id: 123
  category: safe_driving_rules
  question: Cuando hay una línea amarilla continua y una discontinua entre carriles
    de tráfico opuestos, ¿cuándo se le permite rebasar?
  choices:
    A: Solo si la línea amarilla continua está de su lado.
    B: Solo si la línea discontinua está de su lado.
    C: Siempre que no haya tráfico en sentido contrario.
    D: Nunca se permite rebasar cuando hay una línea continua presente.
  answer: B
  explanation: Si la línea discontinua está de su lado, usted se encuentra en la zona
    de rebase y puede rebasar si es seguro. No puede rebasar si la línea amarilla
    continua está de su lado.
- id: 124
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor al acercarse a una intersección con una caja
    de bicicletas verde (bicycle box) con el semáforo en rojo?
  choices:
    A: Detenerse dentro de la caja de bicicletas.
    B: Detenerse detrás de la caja de bicicletas incluso cuando esté vacía.
    C: Avanzar a través de la caja de bicicletas para verificar el tráfico transversal.
    D: Ceder el paso a las bicicletas pero detenerse después de la caja.
  answer: B
  explanation: Los conductores deben detenerse detrás de la caja de bicicletas (incluso
    cuando esté vacía) y esperar a que la luz cambie a verde.
- id: 125
  category: safe_driving_rules
  question: ¿Cuál es la velocidad diseñada para conducir en una rotonda?
  choices:
    A: 10-15 mph
    B: 15-20 mph
    C: 20-25 mph
    D: 25-30 mph
  answer: B
  explanation: Reduzca la velocidad al acercarse a la intersección; las rotondas están
    diseñadas para velocidades de 15-20 mph.
- id: 126
  category: signs_and_signals
  question: ¿Qué indica una "X" amarilla fija sobre un carril reversible?
  choices:
    A: El carril es solo para girar.
    B: El carril está abierto solo para rebasar.
    C: El uso del carril está cambiando y debe salirse de él.
    D: Debe detenerse inmediatamente.
  answer: C
  explanation: Una "X" amarilla fija significa que el uso del carril está cambiando
    y debe salirse de él tan pronto como sea seguro hacerlo.
- id: 127
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones sobre los pasos de peatones es verdadera
    según el manual?
  choices:
    A: Los pasos de peatones solo están presentes donde están marcados con líneas
      blancas.
    B: Cada intersección se define legalmente como un paso de peatones, independientemente
      de las marcas.
    C: Los peatones deben ceder el paso a los vehículos en los pasos de peatones no
      marcados.
    D: Solo necesita ceder el paso si las luces en el pavimento están parpadeando.
  answer: B
  explanation: No todos los pasos de peatones están marcados; cada intersección se
    define legalmente como un paso de peatones, independientemente de si hay una marca
    de paso de peatones presente.
- id: 128
  category: signs_and_signals
  question: ¿Cuál es la forma y el color de una señal de Ceda el paso (Yield)?
  choices:
    A: Una señal roja de ocho lados con letras blancas.
    B: Una señal cuadrada con una línea horizontal blanca dentro de un círculo rojo.
    C: Un triángulo que apunta hacia abajo que es rojo y blanco.
    D: Una señal amarilla redonda con letras negras.
  answer: C
  explanation: Una señal de Ceda el paso es un triángulo que apunta hacia abajo. Es
    roja y blanca con letras rojas.
- id: 129
  category: safe_driving_rules
  question: ¿Cómo se marcan habitualmente los carriles reversibles en la calzada?
  choices:
    A: Líneas blancas continuas
    B: Líneas amarillas dobles discontinuas
    C: Líneas blancas discontinuas simples
    D: Líneas amarillas continuas con sombreado cruzado
  answer: B
  explanation: Los carriles reversibles están diseñados para llevar el tráfico en
    una dirección en ciertos momentos y en la dirección opuesta en otros momentos.
    Estos carriles suelen estar marcados por líneas amarillas dobles discontinuas.
- id: 130
  category: signs_and_signals
  question: Al conducir en un carril controlado por señales elevadas, ¿qué indica
    una 'X' amarilla parpadeante?
  choices:
    A: El carril está cerrado a todo el tráfico.
    B: El carril es solo para girar.
    C: El uso del carril está cambiando y debe salirse.
    D: El carril está reservado para vehículos de alta ocupación.
  answer: B
  explanation: Según el manual, una 'X' amarilla parpadeante significa que el carril
    es solo para girar.
- id: 131
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima que se le permite recorrer en un carril de
    giro a la izquierda de dos sentidos?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: El manual establece que los carriles de giro a la izquierda de dos
    sentidos no pueden utilizarse para rebasar y no pueden utilizarse para circular
    por más de 300 pies.
- id: 132
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en una autopista?
  choices:
    A: Detenerse y retroceder con cuidado por el acotamiento.
    B: Poner su vehículo en reversa y retroceder en el carril de circulación.
    C: Hacer un giro en U a través de la mediana central.
    D: Continuar hasta la siguiente salida o hasta donde pueda dar la vuelta de forma
      segura.
  answer: D
  explanation: Si se pasa de su giro o salida, no retroceda; continúe hasta el siguiente
    giro o salida, o hasta donde pueda dar la vuelta de forma segura. Es ilegal retroceder
    en un acotamiento o en una autopista.
- id: 133
  category: sharing_the_road
  question: En una carretera con tres o más carriles que circulan en la misma dirección,
    ¿qué carril debe utilizar si hay mucho tráfico entrando o saliendo?
  choices:
    A: El carril del extremo izquierdo
    B: El carril central de circulación
    C: El carril del extremo derecho
    D: El acotamiento
  answer: B
  explanation: En una carretera con tres o más carriles que circulan en la misma dirección,
    si hay mucho tráfico entrando o saliendo, utilice el carril central de circulación.
- id: 134
  category: safe_driving_rules
  question: Si un oficial de policía lo detiene por la noche, ¿qué debe hacer antes
    de que el oficial se acerque a su vehículo?
  choices:
    A: Salir del vehículo para saludar al oficial.
    B: Encender la luz interior del techo de su vehículo.
    C: Buscar en su guantera para sacar su registro.
    D: Apagar sus faros delanteros y encender sus luces de emergencia.
  answer: B
  explanation: Si está oscuro, encienda la luz interior del techo del vehículo después
    de detenerse y antes de que el oficial se acerque a su vehículo.
- id: 135
  category: penalties_and_points
  question: ¿Cuál es la sanción por poner en peligro de forma imprudente a un trabajador
    o a la propiedad en una zona de emergencia?
  choices:
    A: Una suspensión de la licencia por 30 días
    B: Una suspensión de la licencia por 60 días
    C: Una suspensión de la licencia por 90 días
    D: Revocación permanente de su licencia de conducir
  answer: B
  explanation: La licencia de conducir de una persona que pone en peligro de forma
    imprudente a un trabajador o a la propiedad en una zona de emergencia está sujeta
    a una suspensión de 60 días.
- id: 136
  category: penalties_and_points
  question: ¿Qué sucede con las multas por infracciones de tráfico por exceso de velocidad
    en una zona de emergencia?
  choices:
    A: Se anulan si es su primera infracción.
    B: Se reducen a la mitad.
    C: Se duplican.
    D: Se triplican.
  answer: C
  explanation: Las multas por infracciones de tráfico emitidas por exceso de velocidad
    en una zona de emergencia o por rebasar incorrectamente a un vehículo estacionado
    designado se duplican.
- id: 137
  category: vehicle_information
  question: En carreteras de acceso limitado con tres o más carriles en una dirección,
    ¿qué vehículos tienen generalmente prohibido usar el carril de la izquierda?
  choices:
    A: Vehículos que transportan más de tres pasajeros
    B: Motocicletas y bicicletas
    C: Vehículos que remolcan un tráiler o que pesan más de 10,000 libras
    D: Vehículos híbridos y eléctricos
  answer: C
  explanation: En carreteras de acceso limitado de tres o más carriles en una dirección,
    los vehículos que remolcan un tráiler o los vehículos de más de diez mil libras
    no pueden usar el carril de la izquierda a menos que se indique lo contrario.
- id: 138
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo al conducir en las playas oceánicas
    permitidas en Washington?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: Al conducir en playas oceánicas permitidas, el límite de velocidad
    es de 25 mph y los peatones y ciclistas tienen el derecho de paso en todo momento.
- id: 139
  category: safe_driving_rules
  question: ¿Cuál de los siguientes puentes de peaje permite a los conductores pagar
    en efectivo en las cabinas de peaje?
  choices:
    A: El puente de la Ruta Estatal 520 en ambas direcciones
    B: El puente Tacoma Narrows de la Ruta Estatal 16 viajando hacia el este
    C: El puente de la Ruta Estatal 520 viajando hacia el oeste únicamente
    D: El puente Tacoma Narrows de la Ruta Estatal 16 viajando hacia el oeste
  answer: B
  explanation: El puente Tacoma Narrows de la SR 16 tiene la opción adicional de cabinas
    de peaje, lo que permite a los conductores pagar en efectivo en el lugar cuando
    viajan hacia el este.
- id: 140
  category: penalties_and_points
  question: ¿Cómo se procesan las infracciones de las cámaras de seguridad de tráfico
    automatizadas?
  choices:
    A: Como una infracción de movimiento que suma puntos a su historial de conducción
    B: Como un delito menor
    C: Como una infracción de estacionamiento que no se incluye en su historial de
      conducción
    D: Como un delito grave si la velocidad superó las 20 mph sobre el límite
  answer: C
  explanation: Estas infracciones no se incluyen en el historial de conducción y,
    en su lugar, se procesan como una infracción de estacionamiento con una multa
    máxima de $250.
- id: 141
  category: sharing_the_road
  question: ¿Qué debe hacer si se encuentra con un carril de espera del ferry donde
    ya hay otros vehículos haciendo fila?
  choices:
    A: Meterse delante de la fila si tiene una reserva.
    B: Pasar la fila e incorporarse cerca de la entrada de la terminal.
    C: Buscar un lugar seguro para dar la vuelta e ir al final de la fila.
    D: Estacionar en el acotamiento y caminar hacia la terminal.
  answer: C
  explanation: Si otros vehículos ya han hecho fila en el carril de espera del ferry,
    no se meta delante de ellos; busque un lugar seguro para dar la vuelta e ir al
    final de la fila.
- id: 142
  category: driver_responsibility
  question: Cuando un oficial de la ley lo detiene, ¿cuándo debe mostrar su licencia
    de conducir y el registro del vehículo?
  choices:
    A: Inmediatamente después de detener el vehículo
    B: Solo cuando lo solicite el oficial
    C: Después de salir del vehículo
    D: Antes de apagar el motor
  answer: B
  explanation: Durante una parada de las fuerzas del orden, debe mostrar su licencia
    de conducir y/o el registro del vehículo solo cuando se le solicite.
- id: 143
  category: safe_driving_rules
  question: ¿Qué es un carril de peaje para vehículos de alta ocupación (HOT)?
  choices:
    A: Un carril exclusivo para vehículos de emergencia y grúas
    B: Un carril reservado solo para autobuses y motocicletas
    C: Un carril HOV abierto a conductores que viajan solos y eligen pagar un peaje
    D: Un carril donde todos los vehículos deben pagar un peaje en efectivo
  answer: C
  explanation: Los carriles de peaje para vehículos de alta ocupación (HOT) y los
    carriles de peaje exprés son carriles para vehículos de alta ocupación (HOV) destinados
    a viajes compartidos (carpools) que también están abiertos a conductores que viajan
    solos y eligen pagar un peaje.
- id: 144
  category: safe_driving_rules
  question: Al realizar un giro a la derecha, ¿por qué debe evitar abrirse hacia la
    izquierda antes de iniciar el giro?
  choices:
    A: Permite que los peatones crucen primero.
    B: El conductor detrás de usted puede pensar que está cambiando de carril o girando
      a la izquierda e intentar rebasarlo por la derecha.
    C: La ley exige mantenerse a menos de 12 pulgadas del bordillo.
    D: Le da una mejor vista del tráfico que viene en sentido contrario.
  answer: B
  explanation: 'El manual establece: ''En los giros a la derecha, evite abrirse hacia
    la izquierda antes de entrar en el giro. Si se abre demasiado, el conductor detrás
    de usted puede pensar que está cambiando de carril o girando a la izquierda y
    puede intentar rebasarlo por la derecha''.'
- id: 145
  category: safe_driving_rules
  question: ¿Bajo qué condiciones NO debe realizar un giro en U?
  choices:
    A: En cualquier autopista de varios carriles.
    B: En un vecindario residencial.
    C: En cualquier curva o al acercarse a la cima de una colina cuando otros no puedan
      ver su vehículo.
    D: En una intersección con semáforo.
  answer: C
  explanation: Según el manual, no se deben realizar giros en U en ninguna curva o
    al acercarse a la cima de una colina cuando otros conductores no puedan ver su
    vehículo.
- id: 146
  category: vehicle_information
  question: ¿En qué tipo de carreteras se permite generalmente operar Vehículos Eléctricos
    de Vecindario (NEV) y Vehículos Eléctricos Medianos (MEV)?
  choices:
    A: Solo en carreteras con un límite de velocidad señalizado de 25 mph o menos.
    B: En carreteras con un límite de velocidad señalizado de hasta 35 mph, a menos
      que lo prohíba la ley local.
    C: En cualquier sistema de carreteras estatales.
    D: En carreteras con un límite de velocidad señalizado de hasta 50 mph.
  answer: B
  explanation: Las personas que operan un NEV o MEV tienen permitido circular por
    carreteras con un límite de velocidad señalizado de hasta 35 mph, a menos que
    lo prohíba la ley local. Solo el condado de San Juan permite la operación hasta
    45 mph.
- id: 147
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por estacionar un vehículo en una estación de
    carga para vehículos eléctricos si el vehículo no está conectado al equipo de
    carga?
  choices:
    A: $50
    B: $124
    C: $250
    D: $500
  answer: B
  explanation: Es una infracción de estacionamiento con una multa mínima de $124 estacionar
    un vehículo en una estación de carga para vehículos eléctricos si el vehículo
    no está conectado al equipo de carga.
- id: 148
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones sobre las leyes de derecho de paso
    es verdadera?
  choices:
    A: La ley otorga el derecho de paso al vehículo más grande.
    B: La ley dice quién debe ceder el derecho de paso, pero no otorga el derecho
      de paso a nadie.
    C: Los peatones siempre tienen el derecho de paso, incluso cuando cruzan fuera
      de un paso de peatones.
    D: Los ciclistas siempre deben ceder el derecho de paso a los vehículos motorizados.
  answer: B
  explanation: 'El manual establece explícitamente: ''La ley dice quién debe ceder
    el derecho de paso, no otorga el derecho de paso a nadie''.'
- id: 149
  category: sharing_the_road
  question: ¿Cuándo debe un conductor detenerse ante un peatón o ciclista que cruza
    la calzada en una intersección?
  choices:
    A: Solo cuando el paso de peatones está marcado con líneas pintadas.
    B: Si el peatón o ciclista está en la mitad de la calzada del conductor o a un
      carril de distancia de su mitad.
    C: Solo si el peatón hace contacto visual con el conductor.
    D: Cuando el peatón está esperando en la acera.
  answer: B
  explanation: Los conductores deben detenerse si un peatón o ciclista se encuentra
    en su mitad de la calzada o si están a un carril de distancia de su mitad de la
    calzada.
- id: 150
  category: sharing_the_road
  question: ¿Qué debe hacer si se encuentra con un peatón que utiliza un perro guía
    o lleva un bastón blanco?
  choices:
    A: Toque la bocina ligeramente para que sepan que usted está allí.
    B: Ceda el derecho de paso solo si están en un paso de peatones marcado.
    C: Otórgueles el derecho de paso absoluto y no use la bocina.
    D: Conduzca alrededor de ellos lentamente.
  answer: C
  explanation: Los peatones que utilizan un perro guía u otro animal de servicio,
    o que llevan un bastón blanco, tienen el derecho de paso absoluto. No debe usar
    la bocina, ya que podría confundir o asustar al peatón o al animal de servicio.
- id: 151
  category: safe_driving_rules
  question: ¿A quién debe ceder el paso un conductor en una intersección donde no
    hay señal de alto (stop), señal de ceder el paso (yield) o semáforo?
  choices:
    A: A los vehículos que vienen por la izquierda.
    B: A los vehículos que ya están en la intersección y a los que vienen por la derecha.
    C: Solo a los vehículos que giran a la izquierda.
    D: Al vehículo que circula a mayor velocidad.
  answer: B
  explanation: En una intersección donde no hay señal de alto, señal de ceder el paso
    o semáforo, los conductores deben ceder el paso a los vehículos que ya se encuentran
    en la intersección y a los que se aproximan por la derecha.
- id: 152
  category: safe_driving_rules
  question: ¿Qué debe hacer si se encuentra en una intersección y se aproxima un vehículo
    de emergencia con sirena y luces intermitentes?
  choices:
    A: Detenerse inmediatamente en medio de la intersección.
    B: Orillarse al borde derecho de la intersección y detenerse.
    C: Cruzar la intersección antes de orillarse a la derecha y detenerse.
    D: Acelerar para despejar la intersección y continuar conduciendo.
  answer: C
  explanation: Si se encuentra en una intersección, cruce la intersección antes de
    orillarse al borde derecho de la carretera y detenerse para dejar pasar al vehículo
    de emergencia.
- id: 153
  category: sharing_the_road
  question: 'Usted NO está obligado a detenerse ante un autobús escolar con luces
    rojas intermitentes cuando el autobús circula en sentido contrario y la calzada:'
  choices:
    A: Tiene un límite de velocidad de 35 mph o más.
    B: Tiene tres o más carriles de circulación marcados.
    C: Se encuentra en un vecindario residencial.
    D: Tiene un carril designado para bicicletas.
  answer: B
  explanation: No es obligatorio detenerse ante un autobús escolar con luces rojas
    intermitentes cuando se viaja en la dirección opuesta si la calzada tiene tres
    o más carriles de tráfico marcados, está separada por una mediana o por una barrera
    física.
- id: 154
  category: penalties_and_points
  question: ¿Cuál es la sanción por rebasar un autobús escolar detenido con sus luces
    rojas intermitentes?
  choices:
    A: Una advertencia por la primera infracción.
    B: Las multas se duplican y la sanción no puede ser exonerada, reducida ni suspendida.
    C: El embargo inmediato de su vehículo.
    D: Una suspensión obligatoria de la licencia por 30 días.
  answer: B
  explanation: Las multas se duplican para cualquier persona que rebase a un autobús
    escolar detenido. La sanción por no detenerse ante un autobús escolar detenido
    no puede ser exonerada, reducida ni suspendida.
- id: 155
  category: sharing_the_road
  question: ¿Cuándo debe ceder el paso a un vehículo de transporte público (autobús)?
  choices:
    A: En todo momento, independientemente de la situación.
    B: Solo cuando el autobús circula por un carril exclusivo para autobuses.
    C: Cuando el autobús ha señalizado y se está reincorporando a la calzada.
    D: Solo cuando el autobús está recogiendo pasajeros.
  answer: C
  explanation: Debe ceder el paso a cualquier vehículo de transporte público (autobús)
    que haya señalizado y se esté reincorporando a la calzada.
- id: 156
  category: safe_driving_rules
  question: ¿Cuándo es legal entrar en una intersección?
  choices:
    A: Tan pronto como el semáforo cambie a verde, incluso si el tráfico está congestionado.
    B: Solo cuando pueda atravesarla sin tener que detenerse y bloquear la intersección.
    C: Cuando esté girando a la derecha en rojo.
    D: Si está siguiendo a un camión grande.
  answer: B
  explanation: Los conductores no deben entrar en una intersección a menos que puedan
    atravesarla sin tener que detenerse. Debe esperar hasta que el tráfico de adelante
    avance para no bloquear la intersección.
- id: 157
  category: penalties_and_points
  question: ¿Qué sucede si comete una infracción por no detenerse o no ceder el derecho
    de paso a un peatón en un cruce peatonal marcado con señales de zona de velocidad
    de escuela o parque infantil?
  choices:
    A: Recibe el doble de la multa programada.
    B: Su licencia se suspende automáticamente.
    C: Debe asistir a un curso obligatorio de conducción defensiva.
    D: Recibe una multa de estacionamiento estándar.
  answer: A
  explanation: Las infracciones por no detenerse o no ceder el derecho de paso a un
    peatón o ciclista dentro de un cruce peatonal que esté marcado con señales de
    zona de velocidad de escuela o parque infantil reciben el doble de la multa programada.
- id: 158
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para operar un carrito de golf
    en vías públicas en zonas aprobadas para carritos de golf?
  choices:
    A: Debe tener al menos 18 años de edad.
    B: Debe tener un endoso especial para carritos de golf en su licencia.
    C: Debe tener al menos 16 años de edad y haber completado un curso de educación
      vial o tener experiencia previa como conductor con licencia.
    D: Debe usar un casco aprobado por el DOT.
  answer: C
  explanation: Una persona puede operar un carrito de golf en vías públicas en zonas
    aprobadas para carritos de golf si tiene al menos 16 años de edad y ha completado
    un curso de educación vial o tiene experiencia previa conduciendo como conductor
    con licencia.
- id: 159
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un vehículo de transporte público (autobús) ha
    señalizado y se está reincorporando a la calzada?
  choices:
    A: Tocar la bocina y rebasar rápidamente.
    B: Ceder el paso al vehículo de transporte público.
    C: Mantener su velocidad y su derecho de paso.
    D: Moverse al carril izquierdo y acelerar.
  answer: B
  explanation: El manual establece que se debe ceder el paso a cualquier vehículo
    de transporte público (autobús) que haya señalizado y se esté reincorporando a
    la calzada.
- id: 160
  category: sharing_the_road
  question: ¿Cuál es el propósito principal de utilizar el método 'Dutch Reach' (alcance
    holandés) para abrir la puerta de su vehículo?
  choices:
    A: Evitar que la puerta se bloquee automáticamente.
    B: Forzar el giro de su cuerpo para que pueda ver mejor a los ciclistas que se
      aproximan.
    C: Estirar los músculos del brazo después de un viaje largo.
    D: Asegurarse de que los seguros para niños estén desactivados.
  answer: B
  explanation: El método 'Dutch Reach' consiste en abrir la puerta con la mano más
    alejada de la manija. Esto obliga a que su cuerpo gire, lo que le permitirá ver
    mejor a los ciclistas que se aproximan y evita que la puerta se abra demasiado
    rápido.
- id: 161
  category: driver_responsibility
  question: ¿Es ilegal dejar a niños solos en un automóvil estacionado con el motor
    encendido si son menores de qué edad?
  choices:
    A: 10 años de edad
    B: 12 años de edad
    C: 14 años de edad
    D: 16 años de edad
  answer: D
  explanation: El manual establece que es ilegal dejar a niños menores de 16 años
    solos en un automóvil estacionado con el motor encendido.
- id: 162
  category: safe_driving_rules
  question: ¿A cuántos pies de distancia de un hidrante de incendios no se le permite
    estacionar su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: El manual enumera las zonas donde no se permite estacionar, lo cual
    incluye una restricción contra el estacionamiento a menos de 15 pies de un hidrante
    de incendios.
- id: 163
  category: safe_driving_rules
  question: ¿A qué distancia debe estacionarse de un semáforo, una señal de pare (stop)
    o una señal de ceda el paso (yield)?
  choices:
    A: Al menos 15 pies
    B: Al menos 20 pies
    C: Al menos 30 pies
    D: Al menos 50 pies
  answer: C
  explanation: No puede estacionarse a menos de 30 pies de un semáforo, una señal
    de pare o una señal de ceda el paso.
- id: 164
  category: signs_and_signals
  question: ¿Qué indica un bordillo (curb) pintado de blanco?
  choices:
    A: Solo se permiten paradas breves.
    B: Es una zona de carga solo para vehículos comerciales.
    C: El estacionamiento está reservado para personas con discapacidad.
    D: No se permite detenerse ni estacionarse en ningún momento.
  answer: A
  explanation: Otras restricciones de estacionamiento pueden estar indicadas por bordillos
    pintados; el blanco indica que solo se permiten paradas breves.
- id: 165
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante al estacionar cuesta arriba con
    un bordillo (curb)?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Hacia adelante en línea recta
    D: Hacia el centro de la carretera
  answer: B
  explanation: Cuando estacione en una colina con bordillo y esté mirando hacia arriba,
    ponga el freno de mano y gire el volante en dirección contraria al bordillo. De
    esta manera, si su vehículo comienza a rodar, rodará hacia el bordillo.
- id: 166
  category: safe_driving_rules
  question: Al estacionar cuesta abajo, ¿en qué dirección debe girar el volante?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Hacia adelante en línea recta
    D: Paralelo a la calzada
  answer: A
  explanation: Cuando estacione en una colina mirando hacia abajo, ponga el freno
    de mano y gire el volante hacia el bordillo.
- id: 167
  category: safe_driving_rules
  question: Al estacionar en paralelo, ¿su vehículo debe estar a cuántas pulgadas
    del bordillo (curb)?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Cuando estacione en paralelo, debe estacionarse a menos de 12 pulgadas
    del bordillo.
- id: 168
  category: vehicle_information
  question: ¿Cuál es la posición recomendada de las manos en el volante?
  choices:
    A: Mano izquierda a las 10 y mano derecha a las 2 en punto
    B: Mano izquierda entre las 8 y las 9 y mano derecha entre las 3 y las 4 en punto
    C: Ambas manos apoyadas en la parte inferior del volante a las 6 en punto
    D: Mano izquierda a las 9 y mano derecha apoyada en la palanca de cambios
  answer: B
  explanation: Coloque las manos en lados opuestos del volante (la mano izquierda
    entre las 8 y las 9 en punto y la mano derecha entre las 3 y las 4 en punto).
    Esto le permite realizar giros sin quitar las manos del volante y las mantiene
    fuera del camino de la bolsa de aire (airbag).
- id: 169
  category: defensive_driving
  question: Para conducir de manera segura y anticipar situaciones, ¿qué tan adelante
    en la carretera debe mirar?
  choices:
    A: Al menos 5 segundos
    B: Al menos 10 segundos
    C: Al menos 15 segundos
    D: Al menos 20 segundos
  answer: C
  explanation: El manual aconseja a los conductores mirar bien hacia adelante en la
    carretera, al menos 15 segundos, y mirar a ambos lados de la carretera y hacia
    atrás.
- id: 170
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    las calles de ciudades y pueblos?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: Los límites de velocidad, a menos que se indique lo contrario, son
    de 25 mph en las calles de ciudades y pueblos.
- id: 171
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en los caminos del condado a menos
    que se indique lo contrario?
  choices:
    A: 40 mph
    B: 45 mph
    C: 50 mph
    D: 60 mph
  answer: C
  explanation: Los límites de velocidad, a menos que se indique lo contrario, son
    de 50 mph en los caminos del condado.
- id: 172
  category: defensive_driving
  question: ¿El exceso de velocidad es un factor en aproximadamente qué porcentaje
    de todas las muertes por accidentes de tráfico en Washington?
  choices:
    A: 15%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: Según el manual, el exceso de velocidad es un factor en casi el 40%
    de todas las muertes por accidentes de tráfico en Washington.
- id: 173
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por violar la ley de conducción distraída en
    Washington?
  choices:
    A: $100
    B: $124
    C: $150
    D: $250
  answer: B
  explanation: La multa mínima por violar una o más de estas restricciones es de $124
    y puede ser mayor si usted causa un choque.
- id: 174
  category: penalties_and_points
  question: ¿Qué sucede con la multa por una segunda infracción y todas las infracciones
    posteriores por conducción distraída?
  choices:
    A: Permanece igual
    B: Se duplica
    C: Se triplica
    D: Se suspende la licencia de conducir
  answer: B
  explanation: La segunda infracción y todas las posteriores están sujetas a que se
    duplique la multa.
- id: 175
  category: penalties_and_points
  question: ¿Cuándo puede un oficial de la ley emitir una infracción por "Conducción
    Peligrosamente Distraída"?
  choices:
    A: Solo si causa una colisión
    B: Como una infracción primaria cuando lo ven comiendo
    C: Como una acción secundaria cuando lo detienen por una presunta violación de
      una infracción de tráfico distinta
    D: Solo si está usando un teléfono celular
  answer: C
  explanation: Un oficial de la ley también puede incluir una infracción por Conducción
    Peligrosamente Distraída como una acción secundaria cuando un conductor de un
    vehículo motorizado ha sido detenido por una presunta violación de una infracción
    de tráfico distinta.
- id: 176
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes circunstancias es permisible usar un dispositivo
    electrónico personal mientras se conduce?
  choices:
    A: Para leer un mensaje de texto en un semáforo en rojo
    B: Para reportar una actividad ilegal o solicitar ayuda de emergencia
    C: Para consultar un mapa en su teléfono mientras está en la autopista
    D: Para cambiar la lista de reproducción de música
  answer: B
  explanation: Las actividades que pueden ser permisibles incluyen reportar una actividad
    ilegal y solicitar ayuda médica u otra ayuda de emergencia.
- id: 177
  category: license_system
  question: ¿Cuáles son las reglas con respecto a los dispositivos de comunicación
    inalámbrica para los conductores con un Permiso de Instrucción o una Licencia
    Intermedia?
  choices:
    A: Solo pueden usar dispositivos de manos libres
    B: Pueden usar dispositivos portátiles si están detenidos en un semáforo
    C: No pueden usar ningún dispositivo de comunicación inalámbrica a menos que sea
      en una emergencia
    D: Pueden usar dispositivos solo para navegación GPS
  answer: C
  explanation: Los conductores con un Permiso de Instrucción o una Licencia Intermedia
    no pueden usar ningún dispositivo de comunicación inalámbrica (independientemente
    de si es portátil o de manos libres) mientras conducen, a menos que se trate de
    una situación de emergencia.
- id: 178
  category: safe_driving_rules
  question: ¿Cuándo es legal tener una transmisión de televisión visible para el conductor
    mientras opera un vehículo motorizado en una vía pública?
  choices:
    A: Al conducir a menos de 25 mph
    B: Cuando el vehículo está en control de crucero
    C: Solo cuando proporciona video en vivo del vehículo motorizado retrocediendo
    D: Cuando la transmisión es un programa de noticias
  answer: C
  explanation: A ninguna persona se le permite operar un vehículo motorizado con equipo
    capaz de recibir una transmisión de televisión cuando las imágenes en movimiento
    son visibles para el conductor... Se proporciona una exención para el video en
    vivo del vehículo motorizado retrocediendo.
- id: 179
  category: safe_driving_rules
  question: ¿Cuál es la ley del estado de Washington con respecto al uso de auriculares
    mientras se conduce?
  choices:
    A: Puede usarlos si el volumen es bajo
    B: Puede usarlos en un solo oído
    C: Es ilegal conducir con cascos o auriculares que cubran o entren en sus oídos
    D: Son obligatorios para llamadas de manos libres
  answer: C
  explanation: No conduzca con cascos o auriculares que cubran o entren en sus oídos.
    Estos son ilegales en Washington y en muchos otros estados, y dificultan la audición
    de bocinas o sirenas de emergencia.
- id: 180
  category: defensive_driving
  question: ¿Cuál de las siguientes NO es una de las "5 D" de la conducción distraída
    mencionadas en el manual?
  choices:
    A: Peligrosa (Dangerous)
    B: Engañosa (Deceptive)
    C: Irrespetuosa (Disrespectful)
    D: Destructiva (Destructive)
  answer: C
  explanation: 'Las "5 D" de la conducción distraída son: Peligrosa (Dangerous), Engañosa
    (Deceptive), Destructiva (Destructive), Incapacitante (Disabling) y Mortal (Deadly).'
- id: 181
  category: defensive_driving
  question: ¿Según la NHTSA, más del 80% de todos los choques pueden evitarse si los
    conductores tienen cuánto tiempo adicional para reaccionar?
  choices:
    A: Un segundo adicional
    B: Dos segundos adicionales
    C: Tres segundos adicionales
    D: Cinco segundos adicionales
  answer: A
  explanation: Según la Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA), más del 80% de todos los choques pueden evitarse si los conductores tienen
    un segundo adicional de tiempo para reaccionar.
- id: 182
  category: defensive_driving
  question: ¿Qué tan adelante mira el conductor promedio mientras conduce?
  choices:
    A: 1-2 segundos
    B: 3-5 segundos
    C: 10-12 segundos
    D: 15 segundos
  answer: B
  explanation: El conductor promedio mira solo de 3 a 5 segundos por delante del vehículo.
- id: 183
  category: defensive_driving
  question: Para recopilar información crítica antes y responder más rápido a los
    peligros, ¿qué tan adelante debe observar?
  choices:
    A: Al menos 5 segundos
    B: Al menos 10 segundos
    C: Al menos 15 segundos
    D: Al menos 30 segundos
  answer: C
  explanation: Si observa al menos 15 segundos por delante, podrá recopilar información
    crítica antes y responder más rápido a los problemas y peligros.
- id: 184
  category: defensive_driving
  question: Al conducir en el tráfico de la ciudad, 15 segundos por delante equivalen
    aproximadamente a ¿qué distancia?
  choices:
    A: El largo de un vehículo
    B: Una cuadra
    C: Cuatro cuadras
    D: Media milla
  answer: B
  explanation: En la ciudad, mire 15 segundos hacia adelante; 15 segundos es aproximadamente
    una cuadra.
- id: 185
  category: defensive_driving
  question: ¿En qué rango de tiempo suelen cruzar o entrar en su camino los vehículos,
    peatones o ciclistas?
  choices:
    A: Un rango de dos segundos
    B: Un rango de cuatro segundos
    C: Un rango de ocho segundos
    D: Un rango de diez segundos
  answer: B
  explanation: Dado que otros vehículos, peatones o ciclistas pueden cruzar o entrar
    en su camino en cualquier momento, con mayor frecuencia dentro de un rango de
    cuatro segundos, mire hacia los lados para asegurarse de que no venga nadie.
- id: 186
  category: defensive_driving
  question: ¿Qué porcentaje de todos los choques en los Estados Unidos cada año ocurren
    en las intersecciones?
  choices:
    A: Más del 10%
    B: Más del 20%
    C: Más del 30%
    D: Más del 40%
  answer: C
  explanation: Según el manual, más del 30% de todos los choques que ocurren en los
    Estados Unidos cada año suceden en las intersecciones.
- id: 187
  category: safe_driving_rules
  question: Antes de girar a la izquierda o a la derecha cruzando el tráfico que viene
    en sentido contrario, ¿con cuánta anticipación debe activar su señal?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: 'El manual establece: "Antes de girar a la izquierda o a la derecha
    cruzando el tráfico que viene en sentido contrario, active su señal al menos 100
    pies antes y busque un espacio seguro en el tráfico".'
- id: 188
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a girar
    con luz roja después de detenerse?
  choices:
    A: Nunca puede girar a la izquierda con luz roja.
    B: Puede girar a la derecha en rojo a menos que esté prohibido.
    C: Solo puede girar a la derecha en rojo si una señal lo permite.
    D: Puede girar a la izquierda en rojo hacia cualquier calle de doble sentido.
  answer: B
  explanation: El manual establece que después de detenerse, puede girar a la derecha
    en rojo a menos que esté prohibido. También puede girar a la izquierda desde una
    calle de sentido único o de doble sentido hacia una calle de sentido único, a
    menos que esté prohibido.
- id: 189
  category: defensive_driving
  question: ¿Qué debe hacer si está detenido en una intersección y su visión de la
    calle transversal está bloqueada?
  choices:
    A: Toque la bocina y avance rápidamente.
    B: Espere a que otro vehículo se detenga a su lado.
    C: Avance lentamente hasta que pueda ver.
    D: Encienda sus luces altas antes de cruzar.
  answer: C
  explanation: Si está detenido y su visión de una calle transversal está bloqueada,
    debe avanzar lentamente hasta que pueda ver. Esto permite que los conductores
    que cruzan vean la parte delantera de su vehículo antes de que usted pueda verlos
    a ellos.
- id: 190
  category: safe_driving_rules
  question: 'Si se aproxima a un cruce de ferrocarril y no está seguro de si es seguro
    cruzar, debe:'
  choices:
    A: Acelerar para cruzar las vías rápidamente.
    B: Bajar el volumen de la radio, bajar la ventanilla y escuchar si viene un tren.
    C: Detenerse sobre las vías para tener una mejor vista.
    D: Confiar únicamente en las luces del cruce para que le adviertan.
  answer: B
  explanation: El manual aconseja que si no está seguro de si es seguro cruzar las
    vías, baje o apague la radio, deje de hablar, baje la ventanilla, y mire y escuche
    si viene un tren.
- id: 191
  category: defensive_driving
  question: En un cruce de ferrocarril con más de una vía, ¿por qué debe esperar hasta
    que el tren que pasa esté bien alejado de la vía antes de cruzar?
  choices:
    A: El tren puede cambiar de dirección repentinamente.
    B: Las barreras del cruce tardan mucho en restablecerse.
    C: El tren que pasa puede ocultar a otro tren detrás de él.
    D: Es ilegal cruzar antes de que pase un minuto después del paso de un tren.
  answer: C
  explanation: En los cruces con más de una vía, debe esperar hasta que el tren que
    pasa esté bien alejado de la vía porque un tren que acaba de pasar puede ocultar
    a otro tren detrás de él.
- id: 192
  category: defensive_driving
  question: ¿Por qué es necesario mirar por encima del hombro en la dirección en la
    que planea moverse al cambiar de carril?
  choices:
    A: Para revisar los puntos ciegos de su vehículo que no puede ver a través de
      sus espejos.
    B: Para asegurarse de que su señal de giro funcione correctamente.
    C: Para comunicar sus intenciones a los peatones.
    D: Para verificar la velocidad del vehículo que está directamente frente a usted.
  answer: A
  explanation: Debe mirar por encima del hombro porque hay "puntos ciegos" cerca de
    las esquinas traseras de su vehículo que no puede ver a través de sus espejos.
- id: 193
  category: sharing_the_road
  question: ¿Cuánto espacio se recomienda antes de intentar incorporarse delante de
    un vehículo comercial?
  choices:
    A: La longitud de un automóvil por cada 5 millas de velocidad.
    B: La longitud de un automóvil por cada 10 millas de velocidad.
    C: La longitud de dos automóviles independientemente de la velocidad.
    D: 100 pies de espacio en todo momento.
  answer: B
  explanation: Antes de intentar incorporarse delante de un vehículo comercial, se
    recomienda dejar el espacio equivalente a la longitud de un automóvil por cada
    10 millas de velocidad.
- id: 194
  category: safe_driving_rules
  question: ¿Cuál es la técnica recomendada para mirar detrás de su vehículo mientras
    retrocede?
  choices:
    A: Depender únicamente de su espejo retrovisor.
    B: Depender únicamente de sus espejos laterales.
    C: Colocar su brazo derecho en el respaldo del asiento y girarse para mirar directamente
      a través de la ventana trasera.
    D: Abrir la puerta del lado del conductor y mirar hacia atrás.
  answer: C
  explanation: Al retroceder, debe colocar su brazo derecho en el respaldo del asiento
    y girarse para poder mirar directamente a través de la ventana trasera, en lugar
    de depender únicamente de los espejos.
- id: 195
  category: safe_driving_rules
  question: Por ley, ¿cuándo deben estar encendidas las luces delanteras de su vehículo?
  choices:
    A: Desde el atardecer hasta el amanecer.
    B: Desde media hora después del atardecer hasta media hora antes del amanecer.
    C: Desde una hora después del atardecer hasta una hora antes del amanecer.
    D: Solo cuando esté completamente oscuro afuera.
  answer: B
  explanation: Por ley, las luces delanteras de su vehículo deben estar encendidas
    desde media hora después del atardecer hasta media hora antes del amanecer, o
    en cualquier momento en que las condiciones dificulten la visibilidad.
- id: 196
  category: safe_driving_rules
  question: ¿A qué distancia de un vehículo que viene en sentido contrario debe bajar
    sus luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: El manual establece que debe bajar sus luces altas siempre que se encuentre
    a menos de 500 pies de un vehículo que viene en sentido contrario.
- id: 197
  category: safe_driving_rules
  question: 'Debe usar sus luces bajas cuando sigue a otro vehículo a una distancia
    de:'
  choices:
    A: 100 pies o menos.
    B: 200 pies o menos.
    C: 300 pies o menos.
    D: 500 pies o menos.
  answer: C
  explanation: Debe usar sus luces bajas cuando siga a otro vehículo a una distancia
    de 300 pies o menos.
- id: 198
  category: defensive_driving
  question: ¿Por qué debería usar luces bajas en lugar de luces altas en condiciones
    de niebla, nieve o lluvia intensa?
  choices:
    A: Las luces altas agotarán la batería más rápido en climas fríos.
    B: La luz de las luces altas se reflejará, causando deslumbramiento y dificultando
      la visión.
    C: La ley exige el uso de luces bajas durante todas las horas del día.
    D: Las luces altas pueden derretir la nieve que cae sobre su parabrisas.
  answer: B
  explanation: En condiciones de niebla, nieve o lluvia intensa, la luz de las luces
    altas se reflejará, causando deslumbramiento y dificultando la visión hacia adelante.
    En su lugar, se deben usar las luces bajas.
- id: 199
  category: defensive_driving
  question: Si un vehículo viene hacia usted con las luces altas encendidas, ¿hacia
    dónde debe mirar para evitar ser deslumbrado?
  choices:
    A: Directamente a las luces delanteras que se aproximan.
    B: Hacia el lado izquierdo de la carretera.
    C: Hacia el lado derecho de la carretera.
    D: Hacia abajo, a su tablero de instrumentos.
  answer: C
  explanation: Si un vehículo viene hacia usted con las luces altas encendidas, mire
    hacia el lado opuesto de las luces y hacia el lado derecho de la carretera hasta
    que el automóvil haya pasado para evitar ser deslumbrado.
- id: 200
  category: defensive_driving
  question: ¿Cuándo es especialmente importante revisar detrás de su vehículo al reducir
    la velocidad?
  choices:
    A: Cuando está subiendo una colina empinada.
    B: Cuando reduce la velocidad rápidamente o en puntos donde el conductor que le
      sigue no lo esperaría.
    C: Cuando se aproxima a un semáforo en verde.
    D: Cuando conduce por el carril derecho de una autopista.
  answer: B
  explanation: Debe revisar detrás de su vehículo siempre que reduzca la velocidad,
    lo cual es muy importante cuando lo hace rápidamente o en puntos donde un conductor
    que le sigue no esperaría que redujera la velocidad, como entradas de garajes
    o espacios de estacionamiento.
- id: 201
  category: safe_driving_rules
  question: ¿Qué debe hacer con sus faros delanteros en días de lluvia, nieve o niebla?
  choices:
    A: Encenderlos solo si está oscureciendo.
    B: Usar sus luces de estacionamiento en su lugar.
    C: Encenderlos siempre que encienda los limpiaparabrisas.
    D: Hacer destellos con las luces altas continuamente.
  answer: C
  explanation: 'El manual establece que en condiciones de lluvia, nieve o niebla,
    los faros delanteros hacen que su vehículo sea más fácil de ver. Una buena regla
    para recordar es: si enciende los limpiaparabrisas, encienda los faros delanteros.'
- id: 202
  category: defensive_driving
  question: ¿Por qué debe encender sus faros delanteros cuando conduce alejándose
    de un sol naciente o poniente?
  choices:
    A: Le ayuda a ver el camino por delante con más claridad.
    B: Ayuda a los conductores que vienen hacia usted a ver su vehículo.
    C: Evita que el sol deslumbre en su espejo retrovisor.
    D: Indica a otros conductores que está disminuyendo la velocidad.
  answer: B
  explanation: Según el manual, al conducir alejándose de un sol naciente o poniente,
    los conductores que vienen hacia usted pueden tener dificultades para ver su vehículo,
    por lo que encender los faros delanteros les ayuda a verlo.
- id: 203
  category: sharing_the_road
  question: ¿En cuál de las siguientes situaciones debe evitar el uso de la bocina?
  choices:
    A: Cuando un niño está a punto de correr hacia la calle.
    B: Al rebasar a ciclistas o acercarse a caballos.
    C: Cuando un conductor no está prestando atención.
    D: Al salir de un callejón estrecho.
  answer: B
  explanation: El manual enumera varias ocasiones en las que no debe usar la bocina,
    lo que incluye cerca de peatones ciegos, al rebasar ciclistas y al acercarse a
    caballos.
- id: 204
  category: safe_driving_rules
  question: Si su vehículo se avería y necesita advertir a otros usuarios de la vía,
    ¿a qué distancia detrás de su vehículo debe colocar las bengalas de emergencia?
  choices:
    A: De 50 a 100 pies
    B: De 100 a 150 pies
    C: De 200 a 300 pies
    D: De 400 a 500 pies
  answer: C
  explanation: Si tiene problemas con el vehículo y tiene que detenerse, debe colocar
    bengalas de emergencia de 200 a 300 pies detrás del vehículo para permitir que
    otros conductores cambien de carril si es necesario.
- id: 205
  category: vehicle_information
  question: Si su vehículo se avería en la carretera y no tiene bengalas, ¿cómo puede
    señalar una emergencia?
  choices:
    A: Pararse en la calzada y agitar los brazos.
    B: Atar un paño blanco a la antena, al espejo lateral o a la manija de la puerta.
    C: Tocar la bocina en un estallido continuo.
    D: Encender solo las luces de estacionamiento.
  answer: B
  explanation: El manual aconseja que si no tiene bengalas, debe levantar el capó
    o atar un paño blanco a la antena, al espejo lateral o a la manija de la puerta
    para señalar una emergencia.
- id: 206
  category: sharing_the_road
  question: ¿Por qué nunca debe permanecer al lado de un vehículo grande, como un
    camión o un autobús?
  choices:
    A: Viajan a velocidades mucho más altas que los automóviles de pasajeros.
    B: Tienen grandes puntos ciegos conocidos como la Zona Prohibida (No-Zone).
    C: Con frecuencia realizan cambios repentinos de carril sin señalizar.
    D: Levantan más grava y suciedad de la carretera.
  answer: B
  explanation: Nunca debe permanecer al lado de un vehículo grande, como un camión
    o un autobús, porque estos vehículos tienen grandes puntos ciegos, a menudo denominados
    NO-ZONE.
- id: 207
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalizar antes de cambiar de carril, girar,
    incorporarse o estacionar?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: El manual establece que debe señalizar al menos 100 pies antes de realizar
    su movimiento.
- id: 208
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo está a punto de entrar en la calle entre
    usted y el lugar donde planea girar?
  choices:
    A: Señalizar con anticipación para advertir al otro conductor de su acercamiento.
    B: Esperar hasta haber pasado el vehículo para señalizar su giro.
    C: Tocar la bocina y señalizar de inmediato.
    D: Hacer destellos con los faros delanteros y frenar bruscamente.
  answer: B
  explanation: Si otro vehículo está a punto de entrar en la calle entre usted y el
    lugar donde planea girar, espere hasta haberlo pasado para señalizar. Si señaliza
    antes, el otro conductor puede pensar que planea girar donde él está y cruzarse
    en su camino.
- id: 209
  category: defensive_driving
  question: ¿Cómo puede advertir a los conductores detrás de usted que va a detenerse
    o disminuir la velocidad en un lugar que tal vez no esperen?
  choices:
    A: Encender las luces intermitentes de emergencia.
    B: Usar una señal manual para girar a la izquierda.
    C: Presionar el pedal del freno tres o cuatro veces rápidamente.
    D: Tocar la bocina con un sonido fuerte y seco.
  answer: C
  explanation: Si va a detenerse o disminuir la velocidad en un lugar donde otro conductor
    no lo espera, presione el pedal del freno tres o cuatro veces rápidamente para
    avisar a quienes vienen detrás que está a punto de reducir la velocidad.
- id: 210
  category: safe_driving_rules
  question: ¿Cómo se compara su distancia de frenado a 60 mph con su distancia de
    frenado a 30 mph?
  choices:
    A: Se necesita el doble de distancia para detenerse.
    B: Se necesita el triple de distancia para detenerse.
    C: Se necesita el cuádruple de distancia para detenerse.
    D: La distancia de frenado es exactamente la misma.
  answer: B
  explanation: Cuanto más rápido vaya su vehículo, más distancia le tomará detenerse.
    Por ejemplo, a 60 mph puede tomarle el triple de distancia detenerse que a 30
    mph.
- id: 211
  category: safe_driving_rules
  question: ¿Cuál es la forma más segura de circular por una curva en la carretera?
  choices:
    A: Mantener la velocidad y frenar suavemente mientras está en la curva.
    B: Acelerar ligeramente antes de entrar en la curva.
    C: Reducir la velocidad antes de entrar en la curva para no tener que frenar dentro
      de ella.
    D: Aplicar los frenos con firmeza en el vértice de la curva.
  answer: C
  explanation: Siempre reduzca la velocidad antes de entrar en una curva para no tener
    que frenar dentro de ella. Frenar en una curva puede hacer que el vehículo patine.
- id: 212
  category: safe_driving_rules
  question: ¿Cuánto debe reducir su velocidad al conducir en una carretera con nieve
    compactada?
  choices:
    A: Reducir su velocidad en 10 mph.
    B: Reducir su velocidad a la mitad.
    C: Reducir la velocidad al mínimo.
    D: Mantener el límite de velocidad indicado pero aumentar la distancia de seguimiento.
  answer: B
  explanation: Según el manual, en una carretera mojada debe reducir su velocidad
    en unas 10 mph, pero en nieve compactada, debe reducir su velocidad a la mitad.
- id: 213
  category: vehicle_information
  question: En Washington, ¿durante qué meses se permite legalmente el uso de neumáticos
    con clavos estándar en las carreteras?
  choices:
    A: Del 1 de octubre al 30 de abril
    B: Del 1 de noviembre al 31 de marzo
    C: Del 1 de diciembre al 28 de febrero
    D: Son ilegales durante todo el año
  answer: B
  explanation: En Washington, los neumáticos con clavos son legales durante los meses
    de invierno y solo pueden usarse entre el 1 de noviembre y el 31 de marzo.
- id: 214
  category: defensive_driving
  question: ¿Por qué los pasos elevados y los puentes suelen tener zonas con hielo
    incluso cuando el resto del pavimento está seco?
  choices:
    A: Están expuestos a más viento que las carreteras normales.
    B: No tienen tierra debajo que ayude a aislarlos del frío.
    C: Suelen estar construidos con un hormigón más liso.
    D: El agua drena hacia ellos desde las colinas circundantes.
  answer: B
  explanation: El pavimento de los puentes puede estar helado incluso cuando el resto
    del pavimento no lo está, porque los puentes no tienen tierra debajo que ayude
    a aislarlos del frío.
- id: 215
  category: defensive_driving
  question: ¿Por qué el pavimento puede estar muy resbaladizo durante los primeros
    minutos cuando empieza a llover en un día caluroso?
  choices:
    A: La lluvia se mezcla con el polvo para formar un lodo espeso.
    B: El calor hace que el aceite del asfalto suba a la superficie.
    C: El enfriamiento repentino hace que el asfalto se contraiga y se vuelva resbaladizo.
    D: El agua crea un efecto de hidroplaneo de inmediato.
  answer: B
  explanation: Si empieza a llover en un día caluroso, el pavimento puede estar muy
    resbaladizo durante los primeros minutos porque el calor hace que el aceite del
    asfalto suba a la superficie. La carretera está más resbaladiza hasta que el aceite
    se lava.
- id: 216
  category: safe_driving_rules
  question: ¿Por qué los puentes pueden estar helados incluso cuando el resto del
    pavimento no lo está?
  choices:
    A: Están expuestos a más viento.
    B: No tienen tierra debajo que ayude a aislarlos del frío.
    C: Están hechos de diferentes materiales de asfalto.
    D: Acumulan más humedad del aire.
  answer: B
  explanation: Según el manual, los puentes pueden estar helados incluso cuando el
    resto del pavimento no lo está porque no tienen tierra debajo que ayude a aislarlos
    del frío.
- id: 217
  category: safe_driving_rules
  question: ¿A qué velocidad pueden sus neumáticos perder toda tracción con la carretera
    durante una lluvia intensa (hidroplaneo)?
  choices:
    A: Aproximadamente 35 mph
    B: Aproximadamente 40 mph
    C: Aproximadamente 50 mph
    D: Aproximadamente 60 mph
  answer: C
  explanation: En una lluvia intensa, sus neumáticos pueden perder toda tracción con
    la carretera a unas 50 mph debido al hidroplaneo (hydroplaning).
- id: 218
  category: defensive_driving
  question: ¿Qué debe hacer si siente que sus neumáticos han perdido tracción con
    la superficie de la carretera?
  choices:
    A: Bombear los frenos rápidamente para recuperar la tracción.
    B: Girar el volante bruscamente en la dirección del derrape.
    C: Levantar suavemente el pie del acelerador y mantener el volante recto.
    D: Acelerar ligeramente para atravesar el agua.
  answer: C
  explanation: Si sus neumáticos pierden tracción, debe levantar suavemente el pie
    del acelerador, mantener el volante recto y no intentar detenerse ni girar hasta
    que los neumáticos vuelvan a agarrarse a la carretera.
- id: 219
  category: sharing_the_road
  question: Si conduce un vehículo de movimiento lento en una carretera de dos carriles
    donde no es seguro adelantar, ¿cuándo debe hacerse a un lado para dejar pasar
    a otros?
  choices:
    A: Cuando haya tres o más vehículos en fila detrás de usted.
    B: Cuando haya cinco o más vehículos en fila detrás de usted.
    C: Cuando el vehículo de atrás toque la bocina.
    D: Cuando viaje a 15 mph por debajo del límite de velocidad.
  answer: B
  explanation: Si conduce un vehículo de movimiento lento en una carretera de dos
    carriles donde no es seguro adelantar, y cinco o más vehículos están en fila detrás
    de usted, debe hacerse a un lado y detenerse cuando sea seguro para dejarlos pasar.
- id: 220
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado para incorporarse al tráfico desde
    una rampa de una carretera de alta velocidad?
  choices:
    A: Conducir hasta el final de la rampa, detenerse y esperar un espacio.
    B: Señalizar y entrar a la misma velocidad a la que se mueve el tráfico.
    C: Entrar en la carretera a una velocidad menor que la del tráfico para estar
      seguro.
    D: Ceder el paso al tráfico deteniéndose a mitad de la rampa.
  answer: B
  explanation: Cuando se incorpore al tráfico, señalice y entre a la misma velocidad
    a la que se mueve el tráfico. Las carreteras de alta velocidad generalmente tienen
    rampas para darle tiempo a aumentar su velocidad.
- id: 221
  category: safe_driving_rules
  question: ¿Cuándo debe reducir la velocidad al salir del tráfico a través de una
    rampa de salida en una carretera de alta velocidad?
  choices:
    A: Aproximadamente 100 pies antes de la rampa de salida.
    B: Tan pronto como encienda la señal de giro.
    C: No reduzca la velocidad hasta que se haya incorporado a la rampa de salida.
    D: Reduzca la velocidad gradualmente mientras aún se encuentra en el carril principal
      de tráfico.
  answer: C
  explanation: Si la carretera por la que viaja tiene rampas de salida, no reduzca
    la velocidad hasta que se haya incorporado a la rampa de salida.
- id: 222
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por poner en peligro de forma temeraria a
    los trabajadores u otros automovilistas en una zona de obras?
  choices:
    A: Una suspensión de la licencia por 30 días.
    B: Una suspensión de la licencia por 60 días.
    C: Una suspensión de la licencia por 90 días.
    D: Revocación permanente de su licencia de conducir.
  answer: B
  explanation: Poner en peligro de forma temeraria a los trabajadores, a otros automovilistas
    o a la propiedad en una zona de obras podría conllevar una suspensión de la licencia
    por 60 días.
- id: 223
  category: penalties_and_points
  question: ¿Cómo se ven afectadas las multas de tráfico si comete una infracción
    en una zona de obras?
  choices:
    A: Las multas son las mismas que en las carreteras normales.
    B: Las multas aumentan en $50.
    C: Las multas se duplican.
    D: Las multas se triplican.
  answer: C
  explanation: Las multas de tráfico se duplican en las zonas de obras.
- id: 224
  category: safe_driving_rules
  question: Si tiene buenos neumáticos y frenos y el pavimento está seco, ¿aproximadamente
    qué distancia se necesita para reaccionar y detener su vehículo a 50 mph?
  choices:
    A: Aproximadamente 100 pies
    B: Aproximadamente 200 pies
    C: Aproximadamente 300 pies
    D: Aproximadamente 400 pies
  answer: D
  explanation: A 50 mph, puede tomar unos 400 pies reaccionar ante algo que ve y detener
    su vehículo. Eso es aproximadamente la longitud de una manzana de la ciudad.
- id: 225
  category: vehicle_information
  question: Por la noche, ¿a qué distancia aproximada le permitirán ver sus faros
    delanteros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: C
  explanation: Sus faros delanteros le permitirán ver a unos 400 pies de distancia.
    Debe conducir a una velocidad que le permita detenerse dentro de esta distancia.
- id: 226
  category: defensive_driving
  question: ¿Qué regla debe utilizar para saber si está conduciendo demasiado rápido
    para las condiciones basándose en su distancia de visibilidad?
  choices:
    A: La regla de seguimiento de dos segundos
    B: La regla de espacio de tres segundos
    C: La regla de distancia de visibilidad de cuatro segundos
    D: La regla de reacción de cinco segundos
  answer: C
  explanation: Para saber si está conduciendo demasiado rápido para las condiciones,
    utilice la regla de distancia de visibilidad de cuatro segundos. Si llega al objeto
    estacionario elegido antes de terminar de contar, va demasiado rápido.
- id: 227
  category: safe_driving_rules
  question: ¿Puede recibir una multa por conducir por debajo del límite de velocidad
    indicado?
  choices:
    A: No, siempre que esté por debajo del límite indicado, está conduciendo legalmente.
    B: Sí, si viaja demasiado rápido para las condiciones, como carreteras mojadas
      o con hielo.
    C: Sí, pero solo si conduce a más de 15 mph por debajo del límite.
    D: No, los límites de velocidad tienen en cuenta todas las condiciones climáticas.
  answer: B
  explanation: Incluso si conduce por debajo del límite de velocidad indicado, puede
    recibir una multa por viajar demasiado rápido en condiciones tales como carreteras
    mojadas o con hielo, poca visibilidad o tráfico denso.
- id: 228
  category: safe_driving_rules
  question: En carreteras con múltiples carriles que van en la misma dirección, ¿qué
    exige la ley con respecto al uso de los carriles?
  choices:
    A: Debe permanecer en el carril central a menos que vaya a salir.
    B: Debe mantenerse a la derecha excepto para rebasar.
    C: Debe mantenerse a la izquierda excepto para rebasar.
    D: Puede circular por cualquier carril siempre que mantenga el límite de velocidad.
  answer: B
  explanation: En carreteras con múltiples carriles que van en la misma dirección,
    la ley exige que se mantenga a la derecha excepto para rebasar.
- id: 229
  category: safe_driving_rules
  question: ¿Cuál es la regla de distancia de seguimiento recomendada cuando se conduce
    a velocidades superiores a 30 mph?
  choices:
    A: La regla de los dos segundos
    B: La regla de los tres segundos
    C: La regla de los cuatro segundos
    D: La regla de los cinco segundos
  answer: C
  explanation: Según el manual, si conduce a velocidades superiores a 30 mph, la mejor
    regla a utilizar es la regla de los cuatro segundos para mantener una distancia
    de seguimiento segura.
- id: 230
  category: defensive_driving
  question: Si alguien lo sigue muy de cerca (tailgating) y no hay un carril derecho
    al cual cambiarse, ¿qué debe hacer?
  choices:
    A: Frenar rápidamente para desanimar al conductor que lo sigue
    B: Aumentar la velocidad para incrementar la distancia entre los vehículos
    C: Esperar hasta que el camino de adelante esté despejado y reducir la velocidad
      lentamente
    D: Encender las luces de emergencia y mantener su velocidad
  answer: C
  explanation: Si no hay un carril derecho, espere hasta que el camino de adelante
    esté despejado y luego reduzca la velocidad lentamente. Esto animará al conductor
    que lo sigue a rebasarlo. Nunca reduzca la velocidad rápidamente para desanimar
    a alguien que lo sigue de cerca.
- id: 231
  category: sharing_the_road
  question: ¿A qué distancia mínima se le permite legalmente seguir a un camión de
    bomberos?
  choices:
    A: A no menos de 200 pies
    B: A no menos de 300 pies
    C: A no menos de 400 pies
    D: A no menos de 500 pies
  answer: D
  explanation: El manual establece que los vehículos de la policía, las ambulancias
    y los camiones de bomberos necesitan espacio adicional para operar, y usted no
    debe seguir a un camión de bomberos a una distancia menor de 500 pies.
- id: 232
  category: defensive_driving
  question: ¿Por qué debe dejar espacio adicional cuando se detiene en una colina
    o pendiente detrás de otro vehículo?
  choices:
    A: Para mejorar su visibilidad del semáforo
    B: Porque el vehículo de adelante puede rodar hacia atrás al arrancar
    C: Para permitir que los peatones crucen entre los vehículos
    D: Porque reduce el desgaste de los frenos
  answer: B
  explanation: Debe dejar espacio adicional cuando se detiene en una colina o pendiente
    porque el vehículo de adelante puede rodar hacia atrás cuando comience a avanzar.
- id: 233
  category: safe_driving_rules
  question: Cuando desea incorporarse al tráfico, ¿qué tan grande debe ser generalmente
    el espacio (brecha) que necesita?
  choices:
    A: Aproximadamente dos segundos
    B: Aproximadamente tres segundos
    C: Aproximadamente cuatro segundos
    D: Aproximadamente seis segundos
  answer: C
  explanation: Cada vez que desee incorporarse al tráfico, necesita un espacio de
    unos cuatro segundos. Esto garantiza que tanto usted como el vehículo detrás de
    usted tengan una distancia de seguimiento de dos segundos.
- id: 234
  category: sharing_the_road
  question: ¿Qué debe hacer si está adelantando a una bicicleta y un vehículo viene
    en sentido contrario al mismo tiempo?
  choices:
    A: Acelerar para pasar la bicicleta antes de que el vehículo llegue a usted
    B: Tocar la bocina para que el ciclista se salga de la carretera
    C: Apretarse entre la bicicleta y el vehículo que viene en sentido contrario
    D: Reducir la velocidad y dejar que el vehículo que viene en sentido contrario
      pase primero
  answer: D
  explanation: Cuando sea posible, enfrente los peligros potenciales uno a la vez.
    Si está adelantando a una bicicleta y se aproxima un vehículo en sentido contrario,
    reduzca la velocidad y deje que el vehículo pase primero para poder darle espacio
    adicional al ciclista.
- id: 235
  category: safe_driving_rules
  question: ¿Cuál es la forma más segura de cambiar varios carriles?
  choices:
    A: Cruzar todos los carriles a la vez para minimizar el tiempo dedicado al cambio
    B: Hacerlo de uno en uno, como si subiera o bajara escaleras
    C: Reducir la velocidad drásticamente antes de cruzar varios carriles
    D: Situarse entre dos carriles hasta que se abra un espacio grande
  answer: B
  explanation: Si desea desplazarse a través de varios carriles, hágalo de uno en
    uno. Al igual que subir o bajar escaleras escalón por escalón, lo más seguro y
    fácil es incorporarse a un carril a la vez.
- id: 236
  category: penalties_and_points
  question: ¿Qué puede suceder si entra en una intersección con luz verde pero hay
    vehículos bloqueando su camino, lo que hace que quede atrapado en la intersección
    cuando la luz cambia a rojo?
  choices:
    A: Tiene el derecho de paso para retroceder
    B: Puede recibir una multa por bloquear una intersección
    C: El tráfico que viene en sentido contrario debe cederle el paso
    D: Su licencia será suspendida de inmediato
  answer: B
  explanation: Incluso si tiene luz verde, no comience a cruzar una intersección si
    hay vehículos bloqueando su camino. Si queda atrapado en la intersección cuando
    la luz cambia a rojo, bloqueará el tráfico y puede recibir una multa por bloquear
    una intersección.
- id: 237
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo lo sigue muy de cerca?
  choices:
    A: Pisar el freno repetidamente para advertir al conductor
    B: Disminuir su distancia de seguimiento con respecto al vehículo que va delante
      de usted
    C: Intentar dejar espacio adicional delante de su vehículo
    D: Moverse al carril del extremo izquierdo
  answer: C
  explanation: Cuando lo sigan de cerca, debe intentar dejar espacio adicional delante
    de usted. De esta manera, podrá detenerse sin ser golpeado por detrás.
- id: 238
  category: sharing_the_road
  question: Al acercarse a un vehículo de emergencia detenido con luces intermitentes
    en una carretera de menos de cuatro carriles, ¿qué debe hacer si es seguro?
  choices:
    A: Mantener su velocidad y permanecer en su carril
    B: Reducir la velocidad y pasar por la izquierda
    C: Detenerse en el arcén derecho y parar
    D: Tocar la bocina para alertar a los trabajadores de emergencia
  answer: B
  explanation: En carreteras de menos de cuatro carriles, reduzca la velocidad y pase
    por la izquierda, si es seguro hacerlo, al acercarse a un vehículo de asistencia
    en carretera, de emergencia o de la policía que esté detenido y utilice luces
    intermitentes.
- id: 239
  category: defensive_driving
  question: ¿Por qué es peligroso conducir en el carril del extremo izquierdo cuando
    no está adelantando?
  choices:
    A: Causa un desgaste excesivo en los neumáticos del lado izquierdo
    B: Frustra a otros conductores y puede contribuir a la conducción agresiva
    C: Dificulta la visión de las señales de tráfico a la derecha
    D: Aumenta el consumo de combustible de su vehículo
  answer: B
  explanation: Conducir en el carril del extremo izquierdo cuando no se está adelantando
    es peligroso porque frustra a otros conductores y puede contribuir a la 'furia
    al volante' y a comportamientos de conducción agresiva.
- id: 240
  category: sharing_the_road
  question: ¿Por qué necesita una distancia de seguimiento adicional cuando conduce
    detrás de una motocicleta en una carretera mojada o con hielo?
  choices:
    A: Las motocicletas tardan más en detenerse que los coches
    B: Las probabilidades de que un motociclista se caiga son mayores en estas superficies
    C: Las motocicletas rocían más agua sobre su parabrisas
    D: Las motocicletas están obligadas a conducir más despacio con mal tiempo
  answer: B
  explanation: Si el motociclista o ciclista se cayera, usted necesita una distancia
    adicional para evitar golpearlo. Las probabilidades de una caída son mayores en
    carreteras mojadas o con hielo, caminos de grava o superficies metálicas.
- id: 241
  category: defensive_driving
  question: ¿Qué debe hacer si está cruzando el tráfico y hay un divisor central (mediana)?
  choices:
    A: Detenerse a mitad del camino solo si el divisor central es lo suficientemente
      grande para su vehículo
    B: Detenerse siempre en el divisor central, independientemente de su tamaño
    C: Nunca detenerse en un divisor central bajo ninguna circunstancia
    D: Detenerse a mitad del camino incluso si parte de su vehículo sobresale hacia
      el tráfico
  answer: A
  explanation: Detenerse a mitad del camino solo es seguro cuando hay un divisor central
    lo suficientemente grande para su vehículo. No se detenga en un divisor donde
    parte de su vehículo sobresalga hacia el tráfico.
- id: 242
  category: safe_driving_rules
  question: Si desea estacionarse en paralelo y hay tráfico detrás de usted, ¿cuál
    es el procedimiento correcto?
  choices:
    A: Detenerse repentinamente en el carril y retroceder hacia el espacio
    B: Poner la luz de giro, colocarse junto al espacio y permitir que los vehículos
      que le siguen pasen antes de estacionarse
    C: Entrar en el espacio de frente para evitar retrasar el tráfico
    D: Hacer señas al tráfico para que lo rodee mientras retrocede lentamente
  answer: B
  explanation: Si desea estacionarse en paralelo y hay tráfico detrás de usted, ponga
    la luz de giro, colóquese junto al espacio y permita que los vehículos que le
    siguen pasen antes de estacionarse.
- id: 243
  category: defensive_driving
  question: ¿Cómo debe manejar la dirección entre dos peligros, como un camión con
    remolque que viene en sentido contrario y autos estacionados?
  choices:
    A: Dirigirse más cerca de los autos estacionados para evitar el vehículo en movimiento
    B: Seguir un curso intermedio, pero dejando un poco más de espacio del lado del
      camión con remolque
    C: Dirigirse más cerca del camión con remolque porque tiene mejores frenos
    D: Detenerse por completo hasta que el camión con remolque haya pasado
  answer: B
  explanation: Debe dividir la diferencia entre dos peligros. Sin embargo, si uno
    es más peligroso que el otro, deje un poco más de espacio en el lado peligroso.
    Por ejemplo, si el vehículo que viene en sentido contrario es un camión con remolque,
    deje un poco más de espacio en el lado por el que pasará el camión.
- id: 244
  category: safe_driving_rules
  question: ¿Qué debe hacer si tiene luz verde pero hay vehículos bloqueando la intersección
    más adelante?
  choices:
    A: Entrar en la intersección y esperar a que el tráfico se despeje.
    B: Tocar la bocina hasta que los vehículos se muevan.
    C: No comenzar a cruzar la intersección.
    D: Maniobrar lentamente entre los vehículos que bloquean el paso.
  answer: C
  explanation: Incluso si tiene luz verde, no comience a cruzar una intersección si
    hay vehículos bloqueando su camino. Si queda atrapado en la intersección cuando
    la luz cambia a rojo, bloqueará el tráfico y podría recibir una multa.
- id: 245
  category: defensive_driving
  question: ¿Por qué debe tener especial precaución cuando una motocicleta que se
    aproxima tiene encendida la luz de giro?
  choices:
    A: Las motocicletas deben mantener sus señales encendidas en todo momento.
    B: Las luces de giro de las motocicletas a menudo no se cancelan por sí solas.
    C: Las motocicletas giran mucho más rápido que los autos.
    D: Las señales de las motocicletas suelen ser más difíciles de ver.
  answer: B
  explanation: Debe esperar hasta que el otro conductor realmente comience a girar
    porque las señales de las motocicletas a menudo no se cancelan por sí solas, y
    el conductor puede haber olvidado apagarla después de un giro anterior.
- id: 246
  category: safe_driving_rules
  question: A una velocidad de 55 mph, ¿aproximadamente cuánta distancia necesita
    para rebasar de manera segura a otro vehículo en una carretera de dos carriles?
  choices:
    A: 400 pies
    B: 800 pies
    C: 1600 pies
    D: 3200 pies
  answer: C
  explanation: A 55 mph, usted y un vehículo que viene en sentido contrario recorrerán
    más de 800 pies en diez segundos. Eso significa que necesita más de 1600 pies
    o aproximadamente un tercio de milla para rebasar de manera segura.
- id: 247
  category: safe_driving_rules
  question: ¿No debe comenzar a rebasar a un vehículo si se encuentra a qué distancia
    de una colina o curva?
  choices:
    A: Un cuarto de milla
    B: Un tercio de milla
    C: Media milla
    D: Una milla
  answer: B
  explanation: Debe poder ver al menos a un tercio de milla o unos 15 segundos por
    delante. No comience a rebasar si se encuentra a menos de un tercio de milla de
    una colina o curva.
- id: 248
  category: safe_driving_rules
  question: ¿Cuándo es seguro regresar al carril de conducción después de rebasar
    a otro vehículo?
  choices:
    A: Cuando esté a la distancia de un auto por delante del vehículo rebasado.
    B: Cuando pueda ver ambos faros delanteros del vehículo rebasado en su espejo
      retrovisor.
    C: Tan pronto como active su luz de giro a la derecha.
    D: Cuando el conductor del vehículo rebasado le haga señales con sus faros.
  answer: B
  explanation: Cuando regrese al carril de conducción, asegúrese de dejar suficiente
    espacio. Cuando pueda ver ambos faros delanteros del vehículo que acaba de rebasar
    en su espejo retrovisor, es seguro regresar al carril de conducción.
- id: 249
  category: sharing_the_road
  question: ¿Bajo qué circunstancias se le permite al conductor de un vehículo motorizado
    conducir en un carril para bicicletas?
  choices:
    A: Al rebasar a un vehículo más lento por la derecha.
    B: Cuando el tráfico está muy congestionado.
    C: Solo al realizar un giro o al cruzarlo para estacionarse cerca de la acera.
    D: A los conductores nunca se les permite conducir en un carril para bicicletas
      bajo ninguna circunstancia.
  answer: C
  explanation: No conduzca en un carril para bicicletas excepto al realizar un giro
    o cuando necesite cruzar el carril para bicicletas para estacionarse cerca de
    la acera.
- id: 250
  category: sharing_the_road
  question: ¿Cuánto espacio debe dejar un conductor al alcanzar o rebasar a un ciclista?
  choices:
    A: Al menos un pie
    B: Al menos dos pies
    C: Al menos tres pies
    D: Al menos cinco pies
  answer: C
  explanation: Los conductores deben dejar al menos tres pies de espacio entre cualquier
    parte del vehículo y la bicicleta al alcanzar o rebasar a un ciclista.
- id: 251
  category: sharing_the_road
  question: ¿Qué debe hacer si está a punto de girar a la derecha y un ciclista circula
    delante de usted?
  choices:
    A: Aumentar la velocidad y rebasar al ciclista inmediatamente antes del giro.
    B: Tocar la bocina para advertir al ciclista que se quite del camino.
    C: Reducir la velocidad y dejar que el ciclista despeje la intersección antes
      de realizar el giro.
    D: Compartir el carril con el ciclista mientras realiza el giro.
  answer: C
  explanation: Si está a punto de girar a la derecha, no rebase a un ciclista inmediatamente
    antes del giro; reduzca la velocidad y deje que el ciclista despeje la intersección
    antes de realizar su giro en lugar de cruzarse delante del ciclista.
- id: 252
  category: sharing_the_road
  question: ¿Qué debe hacer un ciclista cuando circula por una carretera de dos carriles
    donde no es seguro rebasar y hay cinco o más vehículos en fila detrás de él?
  choices:
    A: Aumentar su velocidad para igualar el flujo del tráfico.
    B: Moverse al centro del carril para evitar rebases inseguros.
    C: Orillarse y detenerse cuando sea seguro para dejar pasar a los vehículos.
    D: Hacer señales a los vehículos para que lo rebasen por la derecha.
  answer: C
  explanation: Al circular por una carretera de dos carriles donde no es seguro rebasar
    y hay cinco o más vehículos en fila detrás, los ciclistas deben orillarse y detenerse
    cuando, a juicio del ciclista, sea seguro dejar pasar a los vehículos.
- id: 253
  category: sharing_the_road
  question: Cuando un ciclista decide circular por una acera, ¿qué debe hacer antes
    de rebasar a un peatón?
  choices:
    A: Moverse a la calzada temporalmente.
    B: Usar una señal audible para advertir al peatón.
    C: Encender una luz blanca montada en la parte delantera.
    D: Bajarse de la bicicleta y caminar junto a ella para pasar al peatón.
  answer: B
  explanation: Los ciclistas deben ceder el paso a los peatones en las aceras o en
    los cruces peatonales. Use una señal audible para advertir a los peatones antes
    de rebasarlos.
- id: 254
  category: vehicle_information
  question: Según la definición del estado de Washington, ¿una bicicleta con asistencia
    eléctrica tiene un motor capaz de propulsar la bicicleta a no más de qué velocidad
    en terreno llano?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: Las bicicletas con asistencia eléctrica se definen como bicicletas
    que pueden operarse con pedales, pero que también tienen un motor eléctrico capaz
    de propulsar la bicicleta a no más de 20 mph en terreno llano.
- id: 255
  category: sharing_the_road
  question: ¿Se les permite a los ciclistas circular por los acotamientos (shoulders)
    de las autopistas y otras carreteras?
  choices:
    A: Sí, excepto donde las señales indiquen que es ilegal.
    B: Sí, pero solo durante las horas del día.
    C: No, las bicicletas están estrictamente prohibidas en todas las autopistas.
    D: No, a menos que utilicen una bicicleta con asistencia eléctrica.
  answer: A
  explanation: Los ciclistas pueden usar los acotamientos de las autopistas y otras
    carreteras, excepto donde las señales indiquen que es ilegal.
- id: 256
  category: defensive_driving
  question: ¿Por qué un conductor debe evitar reducir la velocidad o detenerse rápidamente
    inmediatamente después de rebasar a un ciclista?
  choices:
    A: El ciclista podría quedar atrapado en la estela de succión del vehículo.
    B: Los frenos de un vehículo motorizado son más potentes que los de una bicicleta,
      lo que podría causar un choque.
    C: Es ilegal frenar a menos de 100 pies después de rebasar una bicicleta.
    D: El ciclista está obligado a rebasar al vehículo por la derecha.
  answer: B
  explanation: Tenga cuidado después de haber rebasado a un ciclista. No reduzca la
    velocidad ni se detenga rápidamente. Los frenos de un vehículo motorizado son
    más potentes que los de una bicicleta, y si se detiene repentinamente podría causar
    un choque.
- id: 257
  category: safe_driving_rules
  question: Al juzgar si tiene suficiente espacio para rebasar de manera segura, ¿cuál
    es la regla general con respecto al número de vehículos que debe rebasar?
  choices:
    A: Rebasar tantos vehículos como sea posible para mantener el flujo del tráfico.
    B: Rebasar no más de tres vehículos a la vez.
    C: Generalmente, solo rebasar un vehículo a la vez.
    D: Rebasar varios vehículos solo si conduce un camión grande.
  answer: C
  explanation: No cuente con tener suficiente tiempo para rebasar varios vehículos
    a la vez. Sea precavido. Generalmente, solo rebase un vehículo a la vez.
- id: 258
  category: sharing_the_road
  question: Cuando un ciclista circula por una calzada a una velocidad inferior al
    flujo normal del tráfico, ¿cuál de las siguientes afirmaciones es cierta con respecto
    a su posición en el carril?
  choices:
    A: Siempre deben circular por el acotamiento no pavimentado.
    B: Están legalmente obligados a circular por la acera si hay una disponible.
    C: La posición en el carril queda a juicio del ciclista, y este puede usar legalmente
      el carril completo.
    D: Deben circular exactamente sobre la línea blanca continua.
  answer: C
  explanation: La posición en el carril por seguridad queda a juicio del ciclista,
    y un ciclista puede usar legalmente el carril completo. Deben circular tan cerca
    de la derecha de la calzada como sea seguro, pero pueden usar el carril completo.
- id: 259
  category: sharing_the_road
  question: ¿Cuándo debe un ciclista orillarse y detenerse para dejar pasar a los
    vehículos?
  choices:
    A: Cuando hay 3 o más vehículos detrás de él
    B: Cuando hay 5 o más vehículos en fila detrás de él
    C: Siempre que un solo vehículo quiera rebasar
    D: Nunca se requiere que los ciclistas se orillen
  answer: B
  explanation: Según el manual, si cinco o más vehículos están en fila detrás de un
    ciclista, este debe orillarse y detenerse cuando sea seguro para dejar pasar a
    los vehículos.
- id: 260
  category: sharing_the_road
  question: ¿Qué debe hacer un ciclista antes de rebasar a un peatón en una acera?
  choices:
    A: Encender su faro delantero
    B: Rebasar solo por el lado derecho
    C: Usar una señal audible para advertir al peatón
    D: Bajarse de la bicicleta y caminar junto a ella para pasar al peatón
  answer: C
  explanation: Los ciclistas deben ceder el paso a los peatones en las aceras o en
    los cruces peatonales y deben usar una señal audible para advertir a los peatones
    antes de rebasarlos.
- id: 261
  category: vehicle_information
  question: ¿Qué equipo de iluminación se requiere para una bicicleta cuando se circula
    de noche?
  choices:
    A: Un faro delantero blanco visible a 300 pies y una luz trasera roja visible
      a 300 pies
    B: Un faro delantero blanco fijo visible a 500 pies y un reflector rojo visible
      a 600 pies hacia atrás
    C: Un faro delantero blanco intermitente y una luz trasera roja intermitente
    D: Cinta reflectante en los pedales y un reflector blanco en la parte delantera
  answer: B
  explanation: Al circular de noche, una bicicleta debe tener un faro delantero blanco
    fijo visible a 500 pies y un reflector rojo visible a 600 pies hacia atrás.
- id: 262
  category: vehicle_information
  question: ¿Cuál es el requisito legal para los frenos de las bicicletas?
  choices:
    A: Deben ser capaces de detener la bicicleta en un tramo de 15 pies a 10 mph
    B: Deben estar equipados con tecnología de frenado antibloqueo
    C: Deben hacer que las ruedas derrapen sobre pavimento seco, nivelado y limpio
    D: Deben operar en las ruedas delantera y trasera simultáneamente
  answer: C
  explanation: Cada bicicleta debe estar equipada con un freno que haga que las ruedas
    derrapen sobre pavimento seco, nivelado y limpio.
- id: 263
  category: safe_driving_rules
  question: ¿Bajo qué condición puede un ciclista llevar paquetes mientras conduce?
  choices:
    A: Solo si los paquetes están asegurados en una mochila
    B: Si el ciclista puede mantener al menos una mano en el manubrio en todo momento
    C: Solo si los paquetes pesan menos de 10 libras
    D: Los ciclistas tienen estrictamente prohibido llevar paquetes
  answer: B
  explanation: Los ciclistas no pueden llevar paquetes a menos que el conductor pueda
    mantener al menos una mano en el manubrio en todo momento.
- id: 264
  category: safe_driving_rules
  question: ¿Qué debe hacer con su casco de bicicleta si ha tenido un accidente?
  choices:
    A: Inspeccionarlo para ver si tiene grietas y volver a usarlo si parece estar
      bien
    B: Hacer que una tienda de bicicletas lo recertifique
    C: Siempre comprar un casco nuevo
    D: Lavarlo con agua y jabón suave antes de volver a usarlo
  answer: C
  explanation: El manual establece que siempre debe comprar un casco nuevo si el suyo
    ha estado en un accidente.
- id: 265
  category: defensive_driving
  question: ¿Cuánto espacio debe dejar un ciclista entre él y los autos estacionados
    para evitar las puertas abiertas?
  choices:
    A: Aproximadamente un pie
    B: Aproximadamente dos pies
    C: Aproximadamente tres pies
    D: At menos cinco pies
  answer: C
  explanation: Los ciclistas deben dejar aproximadamente tres pies entre ellos y los
    autos estacionados para que una puerta abierta no bloquee su camino.
- id: 266
  category: defensive_driving
  question: ¿Por qué los ciclistas deben evitar rebasar vehículos por el lado derecho
    en las intersecciones?
  choices:
    A: Es ilegal circular por el lado derecho de la carretera
    B: Los automovilistas que giran a la derecha pueden no buscar o ver una bicicleta
      que pasa por la derecha
    C: Las bicicletas siempre deben rebasar por la izquierda en todas las situaciones
    D: El lado derecho de la carretera suele tener más baches
  answer: B
  explanation: Los ciclistas no deben rebasar por el lado derecho de los vehículos
    en las intersecciones porque los automovilistas que giran a la derecha pueden
    no buscar, o ver, una bicicleta que pasa por la derecha.
- id: 267
  category: safe_driving_rules
  question: ¿Qué debe hacer un ciclista si un perro continúa persiguiéndolo después
    de haberle gritado?
  choices:
    A: Pedalear lo más rápido posible para dejar atrás al perro
    B: Patear al perro para ahuyentarlo
    C: Bajarse de la bicicleta y ponerla entre él y el perro
    D: Desviarse hacia el carril de tráfico para evitar al perro
  answer: C
  explanation: Si un perro comienza a perseguirlo y no se detiene cuando grita "¡NO!",
    debe bajarse de su bicicleta y ponerla entre usted y el perro.
- id: 268
  category: sharing_the_road
  question: ¿Cuál es una causa común de accidentes graves entre automóviles y motocicletas?
  choices:
    A: Motocicletas que chocan por detrás a los autos en las señales de alto
    B: Automóviles que giran a la izquierda frente a un motociclista que se aproxima
    C: Motocicletas que rebasan autos por el acotamiento derecho
    D: Automóviles y motocicletas que se rozan lateralmente en la autopista
  answer: B
  explanation: Los automóviles que giran a la izquierda frente a un motociclista que
    se aproxima pueden causar accidentes graves entre automóviles y motocicletas porque
    los conductores pueden no ver al motociclista o no juzgar correctamente su velocidad.
- id: 269
  category: defensive_driving
  question: ¿Qué debe hacer si está esperando para girar y ve una motocicleta que
    se aproxima con su señal de giro parpadeando?
  choices:
    A: Avanzar inmediatamente porque la motocicleta definitivamente va a girar
    B: Tocar la bocina para recordarle al motociclista que apague su señal
    C: Esperar para estar seguro de que la motocicleta realmente está girando antes
      de avanzar
    D: Hacer parpadear sus faros para advertir al motociclista
  answer: C
  explanation: La mayoría de las motocicletas no tienen señales de giro que se apaguen
    automáticamente. Antes de girar frente a una motocicleta con una señal intermitente,
    asegúrese de que la motocicleta realmente esté girando y no continúe recto.
- id: 270
  category: sharing_the_road
  question: ¿Cuándo es permisible que un automóvil comparta el mismo carril junto
    a una motocicleta?
  choices:
    A: Cuando el carril es extra ancho
    B: Cuando el motociclista circula por el extremo derecho del carril
    C: Cuando el tráfico se mueve a menos de 15 mph
    D: Nunca; los motociclistas tienen derecho al ancho completo del carril
  answer: D
  explanation: Los motociclistas tienen derecho al mismo ancho completo de carril
    que todos los demás vehículos. Nunca debe entrar en el mismo carril junto a un
    motociclista, incluso si el carril es ancho.
- id: 271
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada que debe dejar entre
    su vehículo y una motocicleta?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Más de cuatro segundos
    D: Al menos seis segundos
  answer: C
  explanation: Debe dejar más de cuatro segundos de distancia de seguimiento entre
    su vehículo y una motocicleta para tener suficiente tiempo para maniobrar o detenerse
    en caso de emergencia.
- id: 272
  category: sharing_the_road
  question: ¿Bajo qué condición puede un motociclista rebasar a un ciclista que ocupa
    el mismo carril?
  choices:
    A: Si rebasan por la derecha con al menos dos pies de espacio libre
    B: Si rebasan por la izquierda con al menos tres pies de distancia de rebase despejada
    C: Solo si el ciclista les hace una señal para pasar
    D: A los motociclistas nunca se les permite rebasar a un ciclista en el mismo
      carril
  answer: B
  explanation: Los motociclistas pueden adelantar y rebasar a un ciclista en el mismo
    carril siempre que lo hagan por la izquierda con al menos tres pies de distancia
    de rebase despejada.
- id: 273
  category: defensive_driving
  question: ¿Por qué los conductores deben tener precaución adicional y evitar seguir
    a los quitanieves demasiado de cerca?
  choices:
    A: Los quitanieves se detienen y retroceden con frecuencia sin previo aviso
    B: Los quitanieves dejan caer grandes cantidades de sal que pueden dañar los parabrisas
    C: Las cuchillas lanzan la nieve hacia arriba, lo que puede causar condiciones
      similares a una tormenta de nieve y visibilidad reducida
    D: Los quitanieves viajan a altas velocidades y pueden frenar repentinamente
  answer: C
  explanation: Debe tener precaución adicional cerca de los quitanieves porque sus
    cuchillas lanzan la nieve hacia arriba y fuera de la carretera, lo que puede causar
    condiciones similares a una tormenta de nieve y visibilidad reducida para los
    conductores que los siguen demasiado de cerca.
- id: 274
  category: sharing_the_road
  question: ¿Cuánta distancia necesita un camión cargado con frenos ajustados correctamente
    para detenerse por completo cuando viaja a 55 mph en una carretera seca?
  choices:
    A: 250 pies
    B: 300 pies
    C: 450 pies
    D: 500 pies
  answer: C
  explanation: Según el manual, un camión cargado con frenos ajustados correctamente
    necesita 450 pies para detenerse por completo cuando viaja a 55 mph en una carretera
    seca.
- id: 275
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego de un vehículo
    grande directamente detrás de él?
  choices:
    A: No puede ver las luces traseras del vehículo.
    B: No puede ver los espejos del conductor.
    C: Está siguiendo a menos de 200 pies.
    D: No puede ver la placa del vehículo.
  answer: B
  explanation: 'El manual establece: "Si está siguiendo a un vehículo grande y no
    puede ver los espejos del conductor, entonces el conductor tampoco puede verlo
    a usted".'
- id: 276
  category: sharing_the_road
  question: ¿Qué debe hacer si un vehículo grande delante de usted se inclina hacia
    el carril izquierdo mientras señala un giro a la derecha?
  choices:
    A: Rebasarlo rápidamente por el lado derecho.
    B: Tocar la bocina para advertirle que está en el carril equivocado.
    C: Quedarse detrás de él y no intentar pasar por el lado derecho.
    D: Moverse al carril de tráfico en sentido contrario para rebasarlo por la izquierda.
  answer: C
  explanation: 'Al girar a la derecha, los conductores de vehículos grandes pueden
    inclinarse hacia el carril izquierdo para realizar el giro sin golpear la acera.
    El manual advierte: "No intente pasar por el lado derecho cuando un vehículo grande
    esté haciendo un giro".'
- id: 277
  category: safe_driving_rules
  question: ¿Qué deben hacer todos los vehículos que transportan materiales peligrosos
    en los cruces de ferrocarril?
  choices:
    A: Acelerar para cruzar las vías rápidamente.
    B: Detenerse en todos los cruces de ferrocarril.
    C: Tocar la bocina antes de cruzar.
    D: Encender sus luces de emergencia y continuar sin detenerse.
  answer: B
  explanation: El manual establece explícitamente que "Todos los vehículos que transportan
    materiales peligrosos deben detenerse en todos los cruces de ferrocarril, así
    que prepárese para detenerse si sigue a uno".
- id: 278
  category: safe_driving_rules
  question: ¿Cuál es el propósito de las rampas de "escape" o "frenado" en pendientes
    largas y pronunciadas?
  choices:
    A: Proporcionar un lugar seguro para que los vehículos lentos dejen pasar a otros.
    B: Servir como área de descanso para conductores cansados.
    C: Detener vehículos cuyos frenos han fallado.
    D: Permitir que los camiones grandes pesen su carga.
  answer: C
  explanation: El manual señala que los conductores no deben estacionarse en o cerca
    de las rampas de escape o frenado, ya que "Estas rampas solo deben usarse para
    detener vehículos cuyos frenos han fallado".
- id: 279
  category: defensive_driving
  question: ¿Por qué debe dar espacio adicional a los peatones que caminan en la misma
    dirección que el flujo del tráfico?
  choices:
    A: La ley les exige tener el derecho de paso.
    B: Están de espaldas a usted y no pueden verlo acercarse.
    C: Es probable que crucen la calle de repente.
    D: Por lo general, están distraídos por dispositivos electrónicos.
  answer: B
  explanation: El manual enumera a los peatones que caminan en la misma dirección
    que el flujo del tráfico bajo "Aquellos que no pueden verlo", explicando que "Dado
    que están de espaldas a usted, no pueden verlo".
- id: 280
  category: defensive_driving
  question: ¿Qué debe hacer si otro conductor comete un error al intentar rebasarlo?
  choices:
    A: Acelerar para que puedan incorporarse detrás de usted.
    B: Tocar la bocina y mantener su velocidad.
    C: Moverse hacia el arcén de la carretera.
    D: Reducir la velocidad y dejar que regresen al carril de circulación de manera
      segura.
  answer: D
  explanation: 'En la sección "Conductores en problemas", el manual aconseja: "Si
    otro conductor comete un error al rebasarlo, no lo empeore. Reduzca la velocidad
    y deje que regrese al carril de circulación de manera segura".'
- id: 281
  category: safe_driving_rules
  question: ¿Aproximadamente qué porcentaje de todas las colisiones fatales involucran
    a un vehículo que se salió de la calzada?
  choices:
    A: 25%
    B: 44%
    C: 75%
    D: 90%
  answer: B
  explanation: El manual establece que "Casi el 44% de todas las colisiones fatales
    involucran a un vehículo que se salió de la calzada".
- id: 282
  category: safe_driving_rules
  question: ¿Cuál de los siguientes factores está involucrado en más de la mitad de
    todas las muertes por salida de la calzada?
  choices:
    A: Exceso de velocidad
    B: Falla en el equipo del vehículo
    C: Malas condiciones climáticas
    D: Cruce de animales
  answer: A
  explanation: Según el texto, "El exceso de velocidad estuvo involucrado en más de
    la mitad de las muertes por salida de la calzada y en poco menos de la mitad de
    las lesiones graves reportadas".
- id: 283
  category: defensive_driving
  question: ¿Cuántos vehículos suelen estar involucrados en colisiones por salida
    de la calzada que resultan en muertes y lesiones graves?
  choices:
    A: Más del 90% involucran a un solo vehículo.
    B: La mayoría involucra a dos vehículos chocando de frente.
    C: Aproximadamente el 50% involucra a un vehículo y un ciclista.
    D: Casi siempre involucran a un camión comercial grande.
  answer: A
  explanation: El manual señala que "Más del 90% de las colisiones por salida de la
    calzada con resultado de muerte y lesiones graves involucran a un solo vehículo".
- id: 284
  category: driver_responsibility
  question: ¿Qué período de conducción se considera el más crítico para cualquier
    conductor novato debido a una mayor probabilidad de chocar?
  choices:
    A: El primer mes
    B: Los primeros seis meses
    C: El primer año
    D: Los primeros dos años
  answer: B
  explanation: 'El manual establece: "Los primeros seis meses de conducción para cualquier
    conductor novato, independientemente de su edad, son los más críticos porque el
    nuevo conductor tiene más probabilidades de verse involucrado en un choque debido
    a la falta de experiencia".'
- id: 285
  category: driver_responsibility
  question: ¿Por qué es importante la flexibilidad del cuello y el torso para una
    conducción segura?
  choices:
    A: Le ayuda a sentarse cómodamente en viajes largos.
    B: Le permite usar su mejor visión posible para detectar peligros antes de girar
      o retroceder.
    C: Es necesario para aprobar la parte física del examen de conducir.
    D: Le ayuda a alcanzar los pedales y el volante con mayor facilidad.
  answer: B
  explanation: El manual explica que las capacidades físicas, incluida la flexibilidad
    del cuello y el torso, son importantes "al utilizar la mejor visión posible para
    detectar peligros de seguridad antes de girar, retroceder, cambiar de carril o
    incorporarse al tráfico".
- id: 286
  category: penalties_and_points
  question: ¿Qué podría pasar si su licencia de conducir requiere lentes correctivos
    y la policía lo detiene mientras conduce sin ellos?
  choices:
    A: Se le dará una advertencia.
    B: Su vehículo será confiscado de inmediato.
    C: Podría recibir una multa.
    D: Se le pedirá que vuelva a realizar el examen de la vista en el lugar.
  answer: C
  explanation: 'El manual advierte: "Si su licencia de conducir dice que debe usar
    lentes correctivos y lo detienen sin ellos, podría recibir una multa".'
- id: 287
  category: defensive_driving
  question: Debido a que no puede enfocar claramente las cosas en su visión lateral,
    ¿qué debe hacer para detectar vehículos y posibles problemas?
  choices:
    A: Girar la cabeza completamente cada pocos segundos.
    B: Confiar totalmente en su visión periférica.
    C: Usar sus espejos laterales y mirar hacia un lado si es necesario.
    D: Mantener la vista fija hacia adelante en todo momento.
  answer: C
  explanation: 'El manual establece con respecto a la visión lateral: "Debido a que
    no puede enfocar las cosas a los lados, también debe usar sus espejos laterales
    y mirar hacia un lado si es necesario".'
- id: 288
  category: defensive_driving
  question: ¿Por qué debería dejar espacio adicional para los conductores o ciclistas
    que reducen la velocidad sin motivo aparente?
  choices:
    A: Es probable que se estén preparando para dar una vuelta en U ilegal.
    B: Es posible que puedan ver un peligro que usted no puede ver desde su posición
      en el carril.
    C: Están tratando de obligarlo a rebasarlos.
    D: Están probando sus frenos.
  answer: B
  explanation: 'Al hablar de personas que pueden estar confundidas, el manual aconseja
    vigilar a quienes reducen la velocidad sin motivo aparente, señalando: "Recuerde
    que es posible que ellos puedan ver algo que usted no puede ver desde su posición
    en el carril".'
- id: 289
  category: safe_driving_rules
  question: ¿Por qué debe evitar el uso de anteojos oscuros o lentes de contacto teñidos
    por la noche?
  choices:
    A: Pueden causar daltonismo temporal.
    B: Reflejan demasiada luz hacia los ojos de los conductores que vienen en sentido
      contrario.
    C: Reducirán la luz que necesita para ver con claridad.
    D: Es ilegal usarlos mientras se conduce en todos los estados.
  answer: C
  explanation: El manual aconseja evitar el uso de anteojos oscuros o lentes de contacto
    teñidos por la noche porque reducirán la luz que necesita para ver con claridad.
- id: 290
  category: safe_driving_rules
  question: Según los estudios, ¿cómo se comparan los registros de conducción de los
    conductores con discapacidad auditiva con los de los conductores con buena audición?
  choices:
    A: Tienen significativamente más colisiones.
    B: Son tan buenos como los de los conductores con buena audición.
    C: Tienen menos accidentes leves pero más accidentes graves.
    D: Son ligeramente peores debido a la incapacidad de oír las sirenas.
  answer: B
  explanation: Los estudios han demostrado que los registros de conducción de los
    conductores con discapacidad auditiva son tan buenos como los de los conductores
    con buena audición porque aprenden a confiar más en su visión y a mantenerse alerta.
- id: 291
  category: safe_driving_rules
  question: ¿Con qué frecuencia debe tomar un descanso para ayudar a prevenir el cansancio
    en un viaje largo?
  choices:
    A: Cada hora aproximadamente.
    B: Cada tres horas.
    C: Solo cuando necesite cargar combustible.
    D: Cada 200 millas.
  answer: A
  explanation: El manual recomienda tomar descansos deteniéndose cada hora aproximadamente,
    o cuando lo necesite, para caminar un poco y tomar aire fresco.
- id: 292
  category: safe_driving_rules
  question: ¿Cómo afecta a su conducción el comer una comida pesada antes de un viaje?
  choices:
    A: Proporciona la energía necesaria para conducir largas distancias.
    B: Mejora su tiempo de reacción.
    C: Puede darle sueño.
    D: Le ayuda a mantenerse alerta durante la conducción nocturna.
  answer: C
  explanation: El manual aconseja comer ligero y no ingerir una comida pesada antes
    de salir, porque algunas personas sienten sueño después de comer mucho.
- id: 293
  category: alcohol_drugs_health
  question: ¿En qué porcentaje aproximado de colisiones de tráfico en las que alguien
    muere está involucrado el alcohol?
  choices:
    A: 15%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: Según el manual, el alcohol está involucrado en aproximadamente el
    40% de las colisiones de tráfico en las que alguien fallece.
- id: 294
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol al sistema nervioso central?
  choices:
    A: Actúa como un estimulante para acelerar la actividad cerebral.
    B: Actúa como un depresor para ralentizar la actividad del cerebro y la médula
      espinal.
    C: No tiene efecto en el sistema nervioso central hasta que se digiere.
    D: Mejora la coordinación y el tiempo de reacción temporalmente.
  answer: B
  explanation: El alcohol es una droga que deprime el sistema nervioso central, ralentizando
    la actividad del cerebro y la médula espinal.
- id: 295
  category: alcohol_drugs_health
  question: ¿Cuánto tiempo suele tardar el alcohol en absorberse directamente en el
    torrente sanguíneo a través del estómago y el intestino delgado?
  choices:
    A: De 5 a 10 minutos
    B: De 20 a 40 minutos
    C: De 1 a 2 horas
    D: De 3 a 4 horas
  answer: B
  explanation: Una vez ingerido, el alcohol se absorbe directamente en el torrente
    sanguíneo a través de las paredes del estómago y el intestino delgado, generalmente
    en un plazo de 20 a 40 minutos.
- id: 296
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes se considera una bebida alcohólica típica que
    contiene una cantidad igual de alcohol?
  choices:
    A: 12 oz de licor de 80 grados (80-proof)
    B: 5 oz de cerveza
    C: 1 1/2 oz de licor de 80 grados (80-proof)
    D: 12 oz de vino
  answer: C
  explanation: Una bebida alcohólica típica es 1 1/2 oz de licor de 80 grados (un
    vaso de chupito), 12 oz de cerveza o una copa de vino de 5 oz.
- id: 297
  category: alcohol_drugs_health
  question: ¿Cómo elimina el cuerpo humano la mayor parte del alcohol consumido?
  choices:
    A: A través del sudor y el aliento
    B: A través de la oxidación en el hígado
    C: A través del tracto digestivo
    D: A través de los riñones y la orina
  answer: B
  explanation: Aunque se eliminan cantidades muy pequeñas a través del sudor, el aliento
    y la orina, el cuerpo elimina la mayor parte del alcohol mediante la oxidación
    (quema) en el hígado.
- id: 298
  category: alcohol_drugs_health
  question: ¿Aproximadamente cuánto tiempo le toma a su cuerpo eliminar cada bebida
    alcohólica típica?
  choices:
    A: 30 minutos
    B: Una hora
    C: Dos horas
    D: Cuatro horas
  answer: B
  explanation: La oxidación del alcohol ocurre a un ritmo constante, y el cuerpo tarda
    aproximadamente una hora en eliminar cada bebida.
- id: 299
  category: alcohol_drugs_health
  question: ¿Por qué el consumo de alimentos con infusión de marihuana puede ser particularmente
    peligroso para los conductores?
  choices:
    A: Contienen un porcentaje de alcohol más alto que las bebidas típicas.
    B: Causan alucinaciones inmediatas y graves.
    C: Los efectos tardan más en sentirse, lo que facilita el consumo excesivo.
    D: Dañan permanentemente el sistema nervioso central.
  answer: C
  explanation: Consumir alimentos con infusión de marihuana puede ser peligroso porque
    los efectos tardan más en sentirse, lo que facilita consumir demasiado debido
    a que los efectos se retrasan.
- id: 300
  category: alcohol_drugs_health
  question: Según el manual, ¿durante cuánto tiempo se ha demostrado que la marihuana
    perjudica el desempeño en las tareas de conducción?
  choices:
    A: 1 hora
    B: 3 horas
    C: 5 horas
    D: 12 horas
  answer: C
  explanation: Se ha demostrado que la marihuana perjudica el desempeño en las tareas
    de conducción y en los circuitos de manejo hasta por 5 horas.
- id: 301
  category: alcohol_drugs_health
  question: ¿Cuál es un peligro potencial de tomar "estimulantes" (uppers) o bebidas
    energéticas para mantenerse despierto mientras conduce?
  choices:
    A: Mejoran permanentemente su tiempo de reacción.
    B: Más tarde pueden hacer que se sienta nervioso, mareado e incapaz de concentrarse.
    C: Retrasan la absorción de alcohol en el torrente sanguíneo.
    D: Actúan como un depresor del sistema nervioso central.
  answer: B
  explanation: Las pastillas estimulantes, los "uppers" y las bebidas energéticas
    pueden hacer que un conductor se sienta más alerta por un corto tiempo, pero más
    tarde pueden hacer que la persona se sienta nerviosa, mareada, incapaz de concentrarse
    y pueden afectar la visión.
- id: 302
  category: penalties_and_points
  question: ¿Cuáles son las sanciones por conducir bajo la influencia de medicamentos
    recetados o de venta libre?
  choices:
    A: Una simple advertencia por la primera infracción.
    B: Una clase obligatoria de mejoramiento para conductores.
    C: Las sanciones son las mismas que para cualquier infracción por alcohol.
    D: Una multa por infracción de tráfico menor.
  answer: C
  explanation: El manual establece que si usted es arrestado o condenado por conducir
    bajo la influencia de drogas, las sanciones son las mismas que para cualquier
    infracción por alcohol.
- id: 303
  category: alcohol_drugs_health
  question: ¿Qué sucede cuando se mezclan drogas y alcohol antes de conducir?
  choices:
    A: Los efectos de las drogas y el alcohol se anulan entre sí.
    B: Provoca un efecto compuesto donde los efectos de la droga se multiplican.
    C: Tiene exactamente el mismo efecto que beber alcohol solo.
    D: Solo afecta su conducción si toma drogas ilegales.
  answer: B
  explanation: Según el manual, mezclar drogas y alcohol puede causar un efecto compuesto,
    lo que significa que los efectos de la droga se multiplican para convertirse en
    algo más que 1+1.
- id: 304
  category: alcohol_drugs_health
  question: Si tiene 21 años o más, ¿puede ser arrestado por conducir con un Contenido
    de Alcohol en la Sangre (BAC) de qué cantidad o superior?
  choices:
    A: '.02'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: C
  explanation: El manual establece que usted puede ser arrestado por conducir con
    un BAC de .08 o más si tiene 21 años o más.
- id: 305
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años, puede ser arrestado por un nivel de THC/marihuana
    de más de:'
  choices:
    A: 0.00 nanogramos por mililitro de sangre
    B: 2.00 nanogramos por mililitro de sangre
    C: 5.00 nanogramos por mililitro de sangre
    D: 8.00 nanogramos por mililitro de sangre
  answer: A
  explanation: Si es menor de 21 años, puede ser arrestado por un nivel de THC/marihuana
    de más de 0.00 nanogramos por mililitro de sangre.
- id: 306
  category: penalties_and_points
  question: ¿Qué debe hacer el oficial que realiza el arresto si un padre es arrestado
    por una infracción de conducción relacionada con drogas o alcohol mientras un
    niño menor de 13 años está presente en el automóvil?
  choices:
    A: Confiscar el vehículo permanentemente.
    B: Notificar de inmediato a los servicios de protección infantil.
    C: Emitir una multa adicional de $5,000 en el acto.
    D: Revocar la licencia de conducir por 10 años adicionales.
  answer: B
  explanation: Cuando un niño menor de 13 años está presente en el automóvil de un
    padre/custodio legal/tutor que está siendo arrestado por una infracción de conducción
    relacionada con drogas o alcohol, el oficial de la ley que realiza el arresto
    debe notificar de inmediato a los servicios de protección infantil.
- id: 307
  category: sharing_the_road
  question: ¿Qué puede suceder con una bicicleta si se descubre que un ciclista conduce
    bajo la influencia y representa una amenaza para la seguridad pública?
  choices:
    A: La bicicleta será confiscada permanentemente y vendida de inmediato.
    B: El oficial debe destruir la bicicleta en el lugar.
    C: El oficial puede confiscar la bicicleta si no hay alternativas razonables.
    D: Al ciclista se le cobrará una tarifa de depósito de $500 para recuperarla.
  answer: C
  explanation: El oficial puede confiscar la bicicleta si determina que la retención
    es necesaria para reducir una amenaza a la seguridad pública y no existen alternativas
    razonables a la confiscación.
- id: 308
  category: driver_responsibility
  question: ¿Qué significa la Ley de Consentimiento Implícito (Implied Consent Law)?
  choices:
    A: Usted acepta permitir que la policía registre su vehículo en cualquier momento.
    B: Usted acepta realizar una prueba de aliento para determinar el contenido de
      alcohol en su sangre.
    C: Usted acepta declararse culpable de su primera infracción de DUI.
    D: Usted acepta pagar todas las multas asociadas con infracciones de tráfico.
  answer: B
  explanation: La Ley de Consentimiento Implícito significa que cuando usted opera
    un vehículo motorizado, ha aceptado someterse a una prueba de aliento para determinar
    el contenido de alcohol en su sangre.
- id: 309
  category: penalties_and_points
  question: ¿Cuál es la sanción si es su primer arresto y se niega a realizar una
    prueba de aliento de BAC?
  choices:
    A: Su licencia será revocada por un año.
    B: Su licencia será suspendida por 90 días.
    C: Se le multará con $5,000 pero conservará su licencia.
    D: Recibirá una advertencia por su primera negativa.
  answer: A
  explanation: Si es su primer arresto y se niega a realizar una prueba de aliento,
    su licencia será revocada por un año.
- id: 310
  category: penalties_and_points
  question: Si es su primer arresto en siete años, tiene 21 años o más, y su prueba
    de aliento muestra un BAC de .08 o más, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Si es su primer arresto dentro de un periodo de siete años, tiene 21
    años o más, y el resultado de la prueba de aliento o sangre muestra un BAC de
    .08 o más... su licencia será suspendida por 90 días.
- id: 311
  category: license_system
  question: ¿Qué tipo de licencia restringida le permite conducir al trabajo, a la
    escuela o para recibir atención médica continua mientras su privilegio de conducir
    está suspendido?
  choices:
    A: Licencia de Interbloqueo de Encendido (IIL)
    B: Licencia de Conducir Ocupacional/Restringida (ORL)
    C: Licencia de Prueba (Probationary License)
    D: Licencia de Procesamiento Diferido
  answer: B
  explanation: Una Licencia de Conducir Ocupacional/Restringida (ORL) le permite conducir
    al trabajo, a la escuela, a servicios ordenados por el tribunal, para recibir
    atención médica continua, para el apoyo continuo de un dependiente o para programas
    de empleo.
- id: 312
  category: penalties_and_points
  question: ¿Por cuánto tiempo aparecen las infracciones relacionadas con el alcohol
    o las drogas en su historial de conducción?
  choices:
    A: 5 años
    B: 7 años
    C: 10 años
    D: De por vida
  answer: D
  explanation: Según el manual, las infracciones relacionadas con el alcohol o las
    drogas aparecen en su historial de conducción de por vida.
- id: 313
  category: safe_driving_rules
  question: Bajo la "Ley de Contenedor Abierto" (Open Container Law), ¿dónde es legal
    llevar un recipiente abierto de alcohol en un vehículo en una carretera?
  choices:
    A: En la guantera
    B: En la consola central
    C: En un área que normalmente no esté ocupada por el conductor o los pasajeros
    D: Debajo del asiento del conductor
  answer: C
  explanation: Es una infracción de tráfico mantener un recipiente abierto de una
    bebida alcohólica en un vehículo en una carretera, a menos que esté en un área
    que normalmente no esté ocupada por el conductor o los pasajeros. No se puede
    guardar en ningún compartimento de almacenamiento accesible.
- id: 314
  category: license_system
  question: Si se le condena por conducir bajo la influencia (DUI) o se le concede
    un procesamiento diferido, ¿por cuánto tiempo se requerirá una licencia de prueba
    (probationary license)?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: 10 años
  answer: C
  explanation: Si se le condena por conducir o tener el control físico de un vehículo
    bajo la influencia, o si se le concede un procesamiento diferido, se requerirá
    una licencia de prueba durante cinco años.
- id: 315
  category: penalties_and_points
  question: ¿Cuántas veces en su vida puede utilizar el programa de procesamiento
    diferido para un cargo de DUI?
  choices:
    A: Una vez
    B: Dos veces
    C: Tres veces
    D: Ilimitado, siempre que hayan pasado 7 años entre los cargos
  answer: A
  explanation: 'El manual establece explícitamente: "Solo puede utilizar el programa
    de procesamiento diferido una vez en su vida".'
- id: 316
  category: penalties_and_points
  question: 'Si tiene entre 13 y 17 años y se le condena por una primera infracción
    relacionada con el alcohol o armas de fuego, su privilegio de conducir será revocado
    por:'
  choices:
    A: 90 días
    B: 6 meses
    C: Un año o hasta los 17 años, lo que sea más largo
    D: Dos años o hasta los 18 años, lo que sea más largo
  answer: C
  explanation: Si tiene entre 13 y 17 años y se le condena por una primera infracción
    relacionada con el alcohol o armas de fuego... su privilegio de conducir será
    revocado por un año o hasta los 17 años, lo que sea más largo.
- id: 317
  category: alcohol_drugs_health
  question: ¿Qué debe hacer si no se siente bien debido a un resfriado fuerte o tortícolis
    (cuello rígido) y necesita ir a algún lugar?
  choices:
    A: Tomar medicamentos de venta libre y conducir con cuidado.
    B: Conducir a una velocidad menor que el límite indicado.
    C: Dejar que otra persona conduzca.
    D: Beber una bebida con cafeína antes de conducir.
  answer: C
  explanation: El manual advierte que incluso problemas pequeños como tortícolis,
    tos o dolor en una pierna pueden afectar su conducción. Si no se siente bien y
    necesita ir a algún lugar, deje que otra persona conduzca.
- id: 318
  category: alcohol_drugs_health
  question: ¿Bajo qué condición puede conducir en Washington una persona con epilepsia?
  choices:
    A: Si no ha tenido una convulsión durante tres meses.
    B: Si no ha tenido una convulsión durante seis meses y está bajo atención médica.
    C: Solo durante las horas del día.
    D: Si tiene una licencia de conducir especializada.
  answer: B
  explanation: Según el manual, puede conducir en Washington si está bajo el cuidado
    de un médico, ha estado tomando su medicamento y no ha tenido una convulsión durante
    seis meses.
- id: 319
  category: alcohol_drugs_health
  question: ¿Por qué los conductores con diabetes deben revisarse los ojos con regularidad?
  choices:
    A: Para detectar una posible ceguera nocturna u otros problemas de visión.
    B: Para asegurarse de que pueden leer las señales de tráfico a 500 pies de distancia.
    C: Porque la insulina puede cambiar el color de sus ojos.
    D: Para calificar para una exención médica en su licencia.
  answer: A
  explanation: El manual establece que si tiene diabetes, debe revisarse los ojos
    con regularidad para detectar una posible ceguera nocturna u otros problemas de
    visión.
- id: 320
  category: driver_responsibility
  question: ¿Qué debe hacer si está enojado o emocionado antes de conducir?
  choices:
    A: Conducir ligeramente por debajo del límite de velocidad.
    B: Escuchar música a todo volumen para distraerse.
    C: Darse tiempo para calmarse y no salir a la carretera hasta estar tranquilo.
    D: Bajar las ventanillas para que entre aire fresco mientras conduce.
  answer: C
  explanation: Las emociones pueden afectar su capacidad para conducir de manera segura.
    Si está enojado o emocionado, dese tiempo para calmarse, dé un paseo corto si
    es necesario y no salga a la carretera hasta que se haya tranquilizado.
- id: 321
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si siente que otro conductor lo está siguiendo
    o acosando?
  choices:
    A: Detenga su vehículo inmediatamente y confronte al conductor.
    B: Conduzca hacia un área aislada para perderlo.
    C: Salga solo en un área donde haya otras personas y negocios abiertos.
    D: Frene repentinamente para asustar al otro conductor.
  answer: C
  explanation: Si siente que lo están siguiendo o acosando, busque ayuda y salga solo
    en un área donde haya otras personas y negocios abiertos a su alrededor.
- id: 322
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si sus frenos dejan de funcionar repentinamente?
  choices:
    A: Cambie a punto muerto (neutral) inmediatamente.
    B: Bombee el pedal del freno varias veces para aumentar la presión.
    C: Apague el encendido para detener el motor.
    D: Tire del freno de mano hacia arriba tan rápido y fuerte como sea posible.
  answer: B
  explanation: Si sus frenos dejan de funcionar, el primer paso es bombear el pedal
    del freno varias veces, lo que a menudo generará suficiente presión de frenado
    para permitirle detenerse.
- id: 323
  category: defensive_driving
  question: ¿Cómo debe frenar si un neumático se desinfla repentinamente (reventón)?
  choices:
    A: Pise los frenos a fondo para detenerse inmediatamente.
    B: Bombee los frenos rápidamente.
    C: Retire el pie del pedal del acelerador y use los frenos ligeramente.
    D: No use los frenos en absoluto hasta que el vehículo se detenga por sí solo.
  answer: C
  explanation: Durante el reventón de un neumático, debe reducir la velocidad gradualmente
    retirando el pie del pedal del acelerador y usando los frenos ligeramente.
- id: 324
  category: vehicle_information
  question: ¿Qué debe esperar si su motor se apaga (se cala) mientras conduce?
  choices:
    A: El volante se bloqueará por completo.
    B: Los frenos dejarán de funcionar por completo.
    C: El volante puede ser difícil de girar y es posible que deba presionar el pedal
      del freno con mucha fuerza.
    D: El vehículo cambiará automáticamente a punto muerto (neutral).
  answer: C
  explanation: Si el motor se apaga, el volante puede ser difícil de girar (aunque
    puede girarlo con más esfuerzo) y, aunque los frenos seguirán funcionando, es
    posible que deba presionar el pedal del freno con mucha fuerza.
- id: 325
  category: defensive_driving
  question: ¿Cuál es la secuencia correcta de acciones si el pedal del acelerador
    se atasca y el motor sigue acelerando?
  choices:
    A: Apague el motor, cambie a punto muerto, salga de la carretera.
    B: Cambie a punto muerto, salga de la carretera, apague el motor.
    C: Aplique el freno de mano, apague el motor, cambie a estacionamiento (P).
    D: Cambie a una marcha más baja, bombee los frenos, apague el motor.
  answer: B
  explanation: Si el pedal del acelerador se atasca, debe mantener la vista en la
    carretera, cambiar rápidamente a punto muerto (neutral), salir de la carretera
    cuando sea seguro hacerlo y luego apagar el motor.
- id: 326
  category: defensive_driving
  question: ¿Cuáles son las tres opciones de un conductor cuando intenta evitar una
    colisión?
  choices:
    A: Detenerse, girar o acelerar.
    B: Frenar, tocar la bocina o desviarse.
    C: Detenerse, dar marcha atrás o tocar la bocina.
    D: Acelerar, frenar o prepararse para el impacto.
  answer: A
  explanation: 'Para evitar una colisión, el manual establece que los conductores
    tienen tres opciones: detenerse, girar o acelerar.'
- id: 327
  category: vehicle_information
  question: ¿Cómo debe frenar en una emergencia si su vehículo está equipado con un
    sistema de frenos antibloqueo (ABS)?
  choices:
    A: Bombee el pedal del freno rápidamente para evitar derrapes.
    B: Presione el pedal del freno tan fuerte como pueda y manténgalo presionado.
    C: Aplique una presión ligera al pedal del freno y auméntela gradualmente.
    D: Pise el pedal del freno, suéltelo y luego gire el volante.
  answer: B
  explanation: Con el sistema ABS, si debe detenerse rápidamente, debe presionar el
    pedal del freno tan fuerte como pueda y mantenerlo presionado sin soltarlo.
- id: 328
  category: defensive_driving
  question: Si su vehículo NO tiene ABS, ¿cuál es el procedimiento adecuado para girar
    rápidamente y evitar una colisión?
  choices:
    A: Gire el volante bruscamente mientras presiona el pedal del freno con la mayor
      fuerza posible.
    B: Pise el pedal del freno, luego suéltelo y gire el volante.
    C: Cambie a punto muerto y gire el volante.
    D: Acelere ligeramente para transferir el peso a los neumáticos traseros antes
      de girar.
  answer: B
  explanation: 'Sin ABS, debe usar un procedimiento diferente para girar rápidamente:
    pise el pedal del freno, luego suéltelo y gire el volante.'
- id: 329
  category: safe_driving_rules
  question: ¿Cuál es la causa principal de los derrapes de los vehículos?
  choices:
    A: Viajar demasiado rápido para las condiciones existentes.
    B: Neumáticos con presión insuficiente.
    C: Bombear los frenos demasiado rápido.
    D: Conducir con una carga pesada en el maletero.
  answer: A
  explanation: El manual establece explícitamente que los derrapes son causados por
    conductores que viajan demasiado rápido para las condiciones existentes.
- id: 330
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a derrapar?
  choices:
    A: Pise los frenos a fondo para detener el vehículo rápidamente.
    B: Gire el volante en la dirección opuesta al derrape.
    C: No use el freno y gire el volante en la dirección en la que desea que vaya
      el vehículo.
    D: Cambie a una marcha más baja y aplique el freno de mano.
  answer: C
  explanation: Si su vehículo comienza a derrapar, no debe usar el freno y debe girar
    el volante en la dirección en la que desea que vaya el vehículo.
- id: 331
  category: defensive_driving
  question: ¿Cómo debe protegerse si está a punto de ser golpeado por detrás?
  choices:
    A: Inclínese hacia adelante hacia el volante.
    B: Presiónese contra el respaldo de su asiento y coloque la cabeza contra el reposacabezas.
    C: Desabroche su cinturón de seguridad para poder salir del vehículo rápidamente.
    D: Gire su cuerpo hacia un lado para evitar el latigazo cervical.
  answer: B
  explanation: Si lo golpean por detrás, su cuerpo será lanzado hacia atrás. Debe
    presionarse contra el respaldo de su asiento y colocar la cabeza contra el reposacabezas,
    y estar preparado para aplicar los frenos.
- id: 332
  category: vehicle_information
  question: ¿Por qué son especialmente importantes los cinturones de regazo y de hombro
    si su vehículo es golpeado por el costado?
  choices:
    A: Hacen que se desplieguen las bolsas de aire laterales.
    B: Evitan que las puertas del vehículo se hundan.
    C: Las bolsas de aire no ayudarán en esta situación, y los cinturones lo mantienen
      detrás del volante.
    D: Aplican automáticamente los frenos al producirse el impacto.
  answer: C
  explanation: Si lo golpean por el costado, su cuerpo es lanzado hacia el lado que
    recibe el impacto. El manual señala que las bolsas de aire no ayudarán en esta
    situación, por lo que se necesitan cinturones de regazo y de hombro para ayudar
    a mantenerlo detrás del volante.
- id: 333
  category: defensive_driving
  question: ¿Qué debe hacer si una colisión es inminente para minimizar el impacto?
  choices:
    A: Frene lo más fuerte posible y prepárese para un impacto frontal.
    B: Intente girar el vehículo para recibir un golpe de refilón en lugar de ser
      golpeado de frente.
    C: Acelere para pasar el vehículo antes de que lo golpee.
    D: Apague el motor inmediatamente para evitar un incendio.
  answer: B
  explanation: El manual establece que si va a ocurrir una colisión, debe intentar
    girar el vehículo para recibir un golpe de refilón en lugar de ser golpeado de
    frente.
- id: 334
  category: driver_responsibility
  question: ¿Por qué es ilegal pasar por encima de una manguera de bomberos en la
    escena de una colisión o un incendio?
  choices:
    A: Puede dañar la manguera, herir a los bomberos o dificultar sus esfuerzos.
    B: Hará que los neumáticos de su vehículo se desinflen instantáneamente.
    C: Activará automáticamente una multa de cámara de tráfico.
    D: Hace que la presión del agua baje en el vecindario circundante.
  answer: A
  explanation: Es ilegal pasar por encima de una manguera de bomberos porque hacerlo
    puede dañar la manguera, herir a los bomberos o dificultar sus esfuerzos.
- id: 335
  category: driver_responsibility
  question: Si se ve involucrado en una colisión que solo daña un vehículo u otra
    propiedad, ¿cuál es su responsabilidad inmediata con respecto a su vehículo?
  choices:
    A: Deje el vehículo exactamente donde está hasta que llegue la policía.
    B: Mueva el vehículo fuera de la carretera, autopista, arcén o mediana a un lugar
      adecuado lo antes posible.
    C: Espere a una grúa antes de intentar mover el vehículo.
    D: Encienda sus luces de emergencia y quédese en el carril de tráfico para advertir
      a los demás.
  answer: B
  explanation: Para todas las colisiones que solo dañen un vehículo u otra propiedad,
    el conductor debe mover el vehículo fuera de la carretera, autopista, arcén o
    mediana a un arcén de rampa de salida, calle transversal u otro lugar adecuado
    tan pronto como sea posible.
- id: 336
  category: safe_driving_rules
  question: Al ayudar a personas heridas en la escena de una colisión, ¿a quién debe
    ayudar primero?
  choices:
    A: A aquellos que están caminando y pidiendo ayuda.
    B: A cualquier persona que no esté ya caminando y hablando.
    C: Al conductor del otro vehículo.
    D: Solo a aquellos que están atrapados dentro de un vehículo en llamas.
  answer: B
  explanation: El manual indica que primero se debe ayudar a cualquier persona que
    no esté ya caminando y hablando. Verifique la respiración y luego verifique si
    hay sangrado.
- id: 337
  category: safe_driving_rules
  question: ¿Qué debe darle de beber a una persona herida en la escena de una colisión?
  choices:
    A: Solo agua para prevenir la deshidratación.
    B: Una bebida azucarada para prevenir el shock.
    C: Solo líquidos calientes.
    D: No dé nada de beber a las personas heridas.
  answer: D
  explanation: 'El manual establece explícitamente: "No dé nada de beber a las personas
    heridas, ni siquiera agua".'
- id: 338
  category: driver_responsibility
  question: ¿Bajo qué circunstancias debe completar un formulario de Informe de Colisión
    (Collision Report) en un plazo de cuatro días?
  choices:
    A: Si la colisión resulta en cualquier daño a la propiedad, independientemente
      del monto.
    B: Si la colisión resulta en lesiones, muerte o daños a la propiedad de $1,000
      o más a la propiedad de una persona y un oficial de la ley no realiza un informe.
    C: Solo si la colisión involucra a un conductor sin seguro.
    D: Si golpea un auto estacionado y no puede encontrar al dueño.
  answer: B
  explanation: Debe completar un formulario de Informe de Colisión en un plazo de
    cuatro días si la colisión resulta en lesiones, muerte o daños a la propiedad
    de $1,000 o más a la propiedad de una persona y un oficial de la ley no realiza
    un informe.
- id: 339
  category: signs_and_signals
  question: ¿Qué información se proporciona en la señal azul del Sistema de Notificación
    de Emergencia (ENS) en un cruce de ferrocarril?
  choices:
    A: El horario del tren para ese cruce específico.
    B: Un número del USDOT que identifica la ubicación física del cruce.
    C: El límite de velocidad para los trenes que pasan por el cruce.
    D: La distancia al hospital más cercano.
  answer: B
  explanation: La señal ENS contiene un número del USDOT que identifica la ubicación
    física del cruce a nivel del ferrocarril para que los equipos de emergencia o
    el personal ferroviario puedan responder.
- id: 340
  category: vehicle_information
  question: Si es un nuevo residente del estado de Washington, ¿cuánto tiempo tiene
    para registrar su vehículo?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Si es un nuevo residente, debe registrar su vehículo dentro de los
    30 días posteriores a convertirse en residente.
- id: 341
  category: vehicle_information
  question: 'Al llevar un vehículo a una oficina de licencias para ser titulado y
    registrado, se requiere una lectura del odómetro si el vehículo tiene:'
  choices:
    A: Menos de cinco años.
    B: Menos de diez años.
    C: Más de diez años.
    D: Fue comprado fuera del estado.
  answer: B
  explanation: Para titular y registrar su vehículo, traiga una lectura del odómetro
    en un formulario de odómetro seguro, si su vehículo tiene menos de diez años.
- id: 342
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos NO se titula en Washington, pero debe
    registrarse anualmente?
  choices:
    A: Ciclomotores (Mopeds)
    B: Casas móviles
    C: Motonieves (Snowmobiles)
    D: Vehículos todoterreno
  answer: C
  explanation: Las motonieves (snowmobiles) no se titulan en Washington, pero deben
    registrarse anualmente.
- id: 343
  category: vehicle_information
  question: ¿Dónde debe guardar el Certificado de Propiedad (título) de su vehículo?
  choices:
    A: En la guantera del vehículo.
    B: Pegado al interior del parabrisas.
    C: En un lugar seguro, pero no en el vehículo.
    D: Doblado dentro de su billetera.
  answer: C
  explanation: El título muestra al propietario o propietarios registrados y legales.
    Guárdelo en un lugar seguro, pero no en el vehículo.
- id: 344
  category: vehicle_information
  question: Cuando se transfiere la propiedad de un vehículo, ¿cuántos días tiene
    el comprador para transferir la propiedad y evitar cargos por penalización?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: El comprador debe transferir la propiedad dentro de los 15 días para
    evitar cargos por penalización.
- id: 345
  category: vehicle_information
  question: 'Cuando un vehículo se vende o se intercambia con un particular o un concesionario,
    el propietario debe informar la venta en un plazo de:'
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: A
  explanation: Cuando un vehículo se vende o se intercambia con un particular o un
    concesionario, el propietario debe informar la venta en un plazo de cinco días.
- id: 346
  category: vehicle_information
  question: ¿Dónde deben colocarse las calcomanías (tabs) de mes y año de renovación
    de la licencia en un vehículo registrado en Washington?
  choices:
    A: Tanto en la placa delantera como en la trasera.
    B: Solo en la placa delantera.
    C: Solo en la placa trasera.
    D: En el interior de la parte inferior del parabrisas del lado del conductor.
  answer: C
  explanation: Las calcomanías (tabs) de mes y año de renovación de la licencia se
    requieren únicamente en las placas traseras.
- id: 347
  category: signs_and_signals
  question: De acuerdo con las señales reglamentarias, ¿cuál es el límite de velocidad
    en una zona escolar cuando hay niños presentes?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: 'La sección de señales reglamentarias indica que la señal de zona escolar
    es: "Escuela: Límite de velocidad de 20 mph cuando hay niños presentes".'
- id: 348
  category: driver_responsibility
  question: ¿Aproximadamente cuántos jóvenes mueren cada año en las carreteras de
    Washington?
  choices:
    A: Menos de 50
    B: Exactamente 75
    C: Más de 100
    D: Más de 500
  answer: C
  explanation: El manual establece que más de 100 jóvenes mueren cada año en las carreteras
    de Washington.
- id: 349
  category: driver_responsibility
  question: ¿Qué grupo de edad tiene la tasa más alta de choques y las tasas más altas
    de exceso de velocidad, conducción bajo los efectos del alcohol o drogas y conducción
    distraída?
  choices:
    A: 16 a 25
    B: 26 a 35
    C: 36 a 45
    D: 65 años o más
  answer: A
  explanation: Los conductores de 16 a 25 años tienen la tasa más alta de choques
    y las tasas más altas de exceso de velocidad, conducción bajo los efectos del
    alcohol o drogas y conducción distraída de cualquier otro grupo de edad.
- id: 350
  category: driver_responsibility
  question: En los choques fatales, ¿cómo se compara el número de conductores masculinos
    con el de las conductoras femeninas?
  choices:
    A: Las conductoras femeninas superan a los conductores masculinos en una proporción
      de 2 a 1
    B: Los conductores masculinos superan a las conductoras femeninas en una proporción
      aproximada de 3 a 1
    C: Están involucrados en un número igual de choques fatales
    D: Los conductores masculinos superan a las conductoras femeninas en una proporción
      aproximada de 10 a 1
  answer: B
  explanation: Las estadísticas muestran que en los choques fatales, los conductores
    masculinos superan a las conductoras femeninas en una proporción aproximada de
    3 a 1.
- id: 351
  category: driver_responsibility
  question: Según las estadísticas de choques de Washington, ¿qué tenían más del doble
    de probabilidades de estar haciendo las conductoras de 16 a 17 años involucradas
    en colisiones fatales en comparación con los hombres?
  choices:
    A: Exceso de velocidad
    B: Conducir bajo los efectos de sustancias
    C: Conducir distraída
    D: Conducir sin cinturón de seguridad
  answer: C
  explanation: El manual señala que las conductoras de 16 a 17 años involucradas en
    colisiones fatales tenían más del doble de probabilidades de haber estado conduciendo
    distraídas que sus homólogos masculinos.
- id: 352
  category: signs_and_signals
  question: ¿Cuál de las siguientes se clasifica como una señal de zona de trabajo
    (Work Area)?
  choices:
    A: Hospital
    B: Banderillero (Flagger)
    C: No entrar (Do Not Enter)
    D: Solo salida (Exit Only)
  answer: B
  explanation: El manual incluye 'Desvío' (Detour) y 'Banderillero' (Flagger) bajo
    la categoría de señales de zona de trabajo.
- id: 353
  category: signs_and_signals
  question: ¿Cómo se clasifica una señal de 'Hospital'?
  choices:
    A: Señal reglamentaria
    B: Señal de zona de trabajo
    C: Señal de servicio
    D: Señal de destino
  answer: C
  explanation: Según el manual, las señales de 'Hospital' y 'Teléfono' se clasifican
    como señales de servicio.
- id: 354
  category: signs_and_signals
  question: ¿Bajo qué categoría cae una señal que indica 'Ciudad y millaje'?
  choices:
    A: Señales de servicio
    B: Señales de destino
    C: Señales reglamentarias
    D: Señales de zona de trabajo
  answer: B
  explanation: El manual categoriza 'Ciudad y millaje' como señales de destino.
- id: 355
  category: safe_driving_rules
  question: ¿Qué instruye a los conductores la señal reglamentaria sobre el tráfico
    más lento?
  choices:
    A: Tráfico lento manténgase a la derecha
    B: Tráfico lento use el acotamiento
    C: Tráfico lento salga de inmediato
    D: Tráfico lento encienda las luces de emergencia
  answer: A
  explanation: El manual incluye 'Tráfico lento manténgase a la derecha' como una
    señal reglamentaria estándar.
- id: 356
  category: safe_driving_rules
  question: Según la señal reglamentaria de 'Manténgase a la derecha', ¿cuál es la
    única excepción para mantenerse a la derecha?
  choices:
    A: Al salir de la autopista
    B: Excepto para rebasar
    C: Al conducir por debajo del límite de velocidad
    D: Al acercarse a una zona de trabajo
  answer: B
  explanation: La señal reglamentaria que figura en el manual establece específicamente
    'Manténgase a la derecha (excepto para rebasar)'.
- id: 357
  category: license_system
  question: ¿Cuál de las siguientes tareas puede completar en línea en el sitio web
    del Departamento de Licencias de Washington?
  choices:
    A: Pagar multas de tráfico
    B: Renovar el registro de su vehículo y embarcación
    C: Realizar su examen inicial de habilidades de conducción
    D: Disputar una reclamación de seguro
  answer: B
  explanation: El manual establece que puede ingresar en línea para gestionar las
    renovaciones de su vehículo, el registro de embarcaciones, la licencia de conducir
    y el cambio de dirección.
- id: 358
  category: defensive_driving
  question: 'Para ayudar a revertir las alarmantes estadísticas de choques de conductores
    jóvenes, el manual recomienda que usted haga su parte haciendo todo lo siguiente,
    EXCEPTO:'
  choices:
    A: Reducir la velocidad
    B: Conducir siempre sobrio
    C: No enviar mensajes de texto mientras conduce
    D: Conducir solo durante las horas del día
  answer: D
  explanation: 'El manual pide específicamente a los conductores que hagan su parte:
    reduciendo la velocidad, conduciendo siempre sobrios y no enviando mensajes de
    texto mientras conducen. No menciona restringir la conducción a las horas del
    día.'
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que se aproxima
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 359
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) roja y blanca en forma de triángulo
    significa que debe reducir la velocidad y ceder el paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 360
- image: do_not_enter.png
  category: signs_and_signals
  id: 361
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico en sentido contrario.
- image: wrong_way.png
  category: signs_and_signals
  id: 362
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
- image: one_way_left.png
  category: signs_and_signals
  id: 363
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
- image: no_u_turn.png
  category: signs_and_signals
  id: 364
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
- image: no_left_turn.png
  category: signs_and_signals
  id: 365
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
- image: no_right_turn.png
  category: signs_and_signals
  id: 366
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
- image: no_passing.png
  category: signs_and_signals
  id: 367
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
- image: keep_right.png
  category: signs_and_signals
  id: 368
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
- image: speed_limit_25.png
  category: signs_and_signals
  id: 369
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
- image: deer_crossing.png
  category: signs_and_signals
  id: 370
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de un peatón
    advierte sobre un cruce de peatones más adelante. Esté preparado para detenerse
    ante los peatones que crucen la calle.
  id: 371
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 372
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 373
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de trenes. Significa que debe ceder el paso a los trenes. Si se
    aproxima un tren, debe detenerse.
  id: 374
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 375
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 376
