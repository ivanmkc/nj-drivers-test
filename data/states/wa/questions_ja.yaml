- id: 350
  category: driver_responsibility
  question: 死亡事故において、男性ドライバーの数は女性ドライバーと比較してどうなっていますか？
  choices:
    A: 女性ドライバーが男性ドライバーを2対1で上回っている。
    B: 男性ドライバーが女性ドライバーを約3対1で上回っている。
    C: 死亡事故に関与する数は同等である。
    D: 男性ドライバーが女性ドライバーを約10対1で上回っている。
  answer: B
