questions:
- id: 1
  category: license_system
  question: ワシントン州の免許証、許可証、身分証明書（IDカード）に割り当てられる番号は、多くの場合どのアルファベットで始まりますか？
  choices:
    A: WA
    B: WDL
    C: DOL
    D: LIC
  answer: B
  explanation: マニュアルによると、ワシントン州のすべての免許証、許可証、身分証明書にはワシントン番号が割り当てられており、その多くはWDLというアルファベットで始まります。
- id: 2
  category: license_system
  question: License Expressアカウントの作成に関して、正しいものはどれですか？
  choices:
    A: 家族のアカウントを使用して、自分のサービスにアクセスできる。
    B: アカウントを作成するのにWDL番号は必要ない。
    C: アカウントは本人のものである必要があり、新規ドライバーは自身のアカウントを設定しなければならない。
    D: 18歳以上の場合のみアカウントを作成できる。
  answer: C
  explanation: マニュアルには、新規ドライバーは自身のアカウントを設定する必要があり、他人のアカウントを使用して自分のサービスを受けることはできず、アカウントは本人のものである必要があると記載されています。
- id: 3
  category: license_system
  question: 車両の登録に関するサポートが必要な場合、どこに行くべきですか？
  choices:
    A: 運転免許事務局 (driver licensing office)
    B: 車両免許事務局 (vehicle licensing office)
    C: 社会保健省 (DSHS) 事務所
    D: 運転教習所
  answer: B
  explanation: マニュアルでは、運転免許証やIDを扱う運転免許事務局とは異なり、車両の免許や登録に関するサポートについては車両免許事務局（vehicle
    licensing office）を訪れるよう指定されています。
- id: 4
  category: license_system
  question: 他州の免許を保持している18歳以上の新規居住者が、ワシントン州の運転免許証を取得しなければならない期間は何日以内ですか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: B
  explanation: 他州の免許を保持している18歳以上の新規居住者は、30日以内にワシントン州の運転免許証を取得する必要があります。
- id: 5
  category: driver_testing
  question: 他州の運転免許証が期限切れの場合、18歳以上の新規居住者は何をしなければなりませんか？
  choices:
    A: 試験なしで免許を移行するために遅延手数料を支払う。
    B: 知識試験（Driving Knowledge Exam）のみに合格する。
    C: 技能試験（Driving Skills Exam）のみに合格する。
    D: 知識試験と技能試験の両方に合格する。
  answer: D
  explanation: 他州の免許が期限切れの場合、ワシントン州の免許を取得する前に、知識試験と技能試験の両方に合格する必要があります。
- id: 6
  category: license_system
  question: ホームレス状態にある場合、以下のうちどれの対象となる可能性がありますか？
  choices:
    A: 技能試験の自動免除
    B: 無料または割引料金の身分証明書（IDカード）
    C: 無料の強化型運転免許証 (EDL)
    D: 16歳での無制限運転免許証
  answer: B
  explanation: マニュアルには、ホームレス状態にある場合、無料のIDまたは割引料金のIDを受け取る資格があると記載されています。
- id: 7
  category: license_system
  question: 強化型運転免許証（EDL）またはIDが適していない活動はどれですか？
  choices:
    A: 国内線の空路旅行
    B: 陸路または海路による国境越え
    C: 国際線の空路旅行
    D: 連邦施設への立ち入り
  answer: C
  explanation: 強化型運転免許証は、国内線の空路旅行、陸路・海路での国境越え、連邦施設への立ち入りには適していますが、「国際線の空路旅行には適さない」と明記されています。
- id: 8
  category: license_system
  question: 認定された運転教習コースに登録する場合、最短で何歳から仮免許（instruction permit）を申請できますか？
  choices:
    A: 15歳
    B: 15歳半
    C: 16歳
    D: 18歳
  answer: A
  explanation: 運転教習コースに登録する場合、最短で15歳から（コース開始の1〜10日前）仮免許を申請できます。
- id: 9
  category: driver_testing
  question: 運転教習コースに登録しない場合、仮免許を取得するための知識試験は何歳から受けることができますか？
  choices:
    A: 15歳
    B: 15歳半
    C: 16歳
    D: 18歳
  answer: B
  explanation: 運転教習コースに登録しない場合は、15歳半になってから知識試験を受けて仮免許を取得することができます。
- id: 10
  category: driver_testing
  question: 運転免許知識試験（Driving Knowledge Exam）の合格スコアの有効期間はどのくらいですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: C
  explanation: マニュアルには、知識試験のスコアの有効期間は2年間のみであると記載されています。
- id: 11
  category: driver_responsibility
  question: 16歳または17歳で初めての運転免許を取得する場合、何時間の運転練習を完了する必要がありますか？
  choices:
    A: 日中の運転30時間と夜間の運転10時間
    B: 日中の運転40時間と夜間の運転10時間
    C: 日中の運転50時間と夜間の運転15時間
    D: 合計60時間の監督下での運転
  answer: B
  explanation: 16歳から17歳のティーンエイジャーは、免許を持つ運転手の同乗のもと、少なくとも日中の運転40時間と夜間の運転10時間を完了する必要があります。
- id: 12
  category: driver_responsibility
  question: ティーン免許（16〜17歳）に必要な運転練習時間を完了する際、監督する免許保持者は少なくとも何年の運転経験が必要ですか？
  choices:
    A: 1年
    B: 3年
    C: 5年
    D: 10年
  answer: B
  explanation: 16歳から17歳のティーンエイジャーの場合、運転練習は3年以上の経験を持つ免許保持者の同乗のもとで行う必要があります。
- id: 13
  category: penalties_and_points
  question: 16歳または17歳で運転免許を申請する前に、どのくらいの期間、交通違反や有罪判決がない状態でなければなりませんか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 1年
    D: 2年
  answer: B
  explanation: 16歳または17歳で初めての運転免許を取得するには、免許申請前の6ヶ月間、交通違反や有罪判決がないことが条件となります。
- id: 14
  category: license_system
  question: 免許センターの窓口で免許を取得する際、帰宅前に仮免許（一時的な免許証）が交付されます。この仮免許の有効期間はどのくらいですか？
  choices:
    A: 15日間
    B: 30日間
    C: 45日間
    D: 60日間
  answer: C
  explanation: 窓口を離れる前に、正式な免許証が郵送されるまでの間、45日間有効な仮免許が交付されます。
- id: 15
  category: driver_responsibility
  question: 18歳以上で、技能試験を受ける前に練習用の許可証（パーミット）を取得する場合、監督する免許保持者は少なくとも何年の運転経験が必要ですか？
  choices:
    A: 1年
    B: 3年
    C: 5年
    D: 10年
  answer: C
  explanation: 初めて免許を取得する18歳以上の方の場合、選択肢の一つとして許可証を取得し、5年以上の経験を持つ免許保持者の同乗のもとで運転練習を行うことができます。
- id: 16
  category: license_system
  question: 中級運転免許（Intermediate Driver License）を取得してから最初の6ヶ月間、同乗者に関する制限は何ですか？
  choices:
    A: いかなる時も同乗者を乗せることはできない
    B: 近親者を除き、20歳未満の同乗者を乗せることはできない
    C: 20歳未満の同乗者は3人まで許可される
    D: 25歳以上の同乗者のみ許可される
  answer: B
  explanation: マニュアルによると、中級運転免許の最初の6ヶ月間は、近親者を除き、20歳未満の同乗者を乗せることはできません。
- id: 17
  category: safe_driving_rules
  question: 中級免許保持者の最初の6ヶ月間における夜間の運転制限は何ですか？
  choices:
    A: 午後10時から午前6時の間は運転禁止
    B: 午前0時から午前5時の間は運転禁止
    C: 資格のある免許保持者が同乗しない限り、午前1時から午前5時の間は運転禁止
    D: 日没後の運転禁止
  answer: C
  explanation: 最初の6ヶ月間、中級免許保持者は、親、保護者、または25歳以上の免許保持者が同乗していない限り、午前1時から午前5時の間に運転することはできません。
- id: 18
  category: safe_driving_rules
  question: 中級運転免許保持者が運転中に無線通信機器を使用できるのはどのような時ですか？
  choices:
    A: ハンズフリー技術を使用している場合のみ
    B: 緊急事態を通報する場合のみ
    C: 赤信号で停車している時
    D: 運転開始から6ヶ月が経過した後ならいつでも
  answer: B
  explanation: 中級免許の法律では、ハンズフリー技術を使用している場合でも、運転中の携帯電話や無線通信機器の使用が制限されています。電話を使用できるのは、緊急事態を通報する場合のみです。
- id: 19
  category: penalties_and_points
  question: 中級運転免許の保持期間中に2回目の交通違反を犯した場合の罰則は何ですか？
  choices:
    A: 免許は6ヶ月間、または18歳になるまで停止される
    B: 現在の制限が18歳まで適用される
    C: 免許が永久に取り消される
    D: 保護者に警告状が送付される
  answer: A
  explanation: 中級免許での2回目の違反の場合、免許は6ヶ月間、または18歳になるまでのいずれか早い方まで停止されます。
- id: 20
  category: license_system
  question: 青少年の農業用許可証（Juvenile Agricultural Permit）に関して、正しいものはどれですか？
  choices:
    A: 初めての運転免許取得に必要な要件が免除される
    B: 練習用許可証（Instruction Permit）の代わりとして機能する
    C: 取得のための最低年齢制限はない
    D: 州内のどこでも、いつでも運転することができる
  answer: C
  explanation: マニュアルには、青少年の農業用許可証には最低年齢制限がなく、18歳未満の運転者が農作業のために特定のエリア内で運転することを許可すると記載されています。
- id: 21
  category: driver_responsibility
  question: なぜ免許局（DOL）は、最初の交通違反を犯した18歳から21歳の運転者に対して早期警告の手紙を送るのですか？
  choices:
    A: すぐに運転免許を停止するため
    B: 最初の違反の後、運転者が事故を起こす確率が2倍になるため
    C: 運転技能試験の再受験を義務付けるため
    D: 免許の有効期限が近づいていることを通知するため
  answer: B
  explanation: DOLが早期警告の手紙を送るのは、最初の違反を受けた後、運転者が事故を起こす確率が2倍になるためです。その目的は、若い運転者にリスクを認識させ、再犯を減らすことにあります。
- id: 22
  category: license_system
  question: 救急隊員を支援するために、運転免許証または身分証明書に追加することを選択できる医療情報の指定は次のうちどれですか？
  choices:
    A: 血液型
    B: 聴覚障害または難聴
    C: ぜんそくのアラート
    D: ペースメーカーの表示
  answer: B
  explanation: 記録には、発達障害、聴覚障害または難聴、医療アラートなどの特定の医療情報を追加することができます。
- id: 23
  category: license_system
  question: オートバイや商用車を合法的に運転するためには、何をしなければなりませんか？
  choices:
    A: 完全に別の運転免許証を取得する
    B: 個人の運転免許証に追記（エンドースメント）を追加する
    C: 視力検査のみに合格する
    D: 少なくとも21歳になるまで待つ
  answer: B
  explanation: オートバイや商用車を運転するには、個人の運転免許証に追記（エンドースメント）を追加する必要があります。
- id: 24
  category: driver_testing
  question: 運転知識試験（学科試験）に合格した後、運転技能試験（実技試験）を完了するまでにどのくらいの期間がありますか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: C
  explanation: 知識試験に合格した後、技能試験を完了するまでに2年間の猶予があります。
- id: 25
  category: driver_testing
  question: 運転技能試験中、車両に同乗することが許可されているのは誰ですか？
  choices:
    A: 試験官のみ（介助犬や手話通訳者は例外）
    B: 試験官と親または保護者1名
    C: 試験官と25歳以上の免許保持者
    D: 20歳未満の同乗者最大3名
  answer: A
  explanation: 試験中に車両への同乗が許可されているのは、あなたと試験官のみです。ただし、介助犬や手話通訳者は例外として認められます。
- id: 26
  category: driver_testing
  question: 18歳未満の生徒向けの保護者オリエンテーションクラスでは、何時間の運転練習について説明されますか？
  choices:
    A: 日中30時間、夜間5時間の運転
    B: 日中40時間、夜間10時間の運転
    C: 日中50時間、夜間15時間の運転
    D: 合計60時間の運転練習
  answer: B
  explanation: 保護者オリエンテーションに参加することで、指導者はプログラムに慣れ、日中40時間および夜間10時間の運転練習の要件について詳しく理解することができます。
- id: 27
  category: license_system
  question: 運転免許証の有効期限が切れる前のいつから更新手続きができますか？
  choices:
    A: 30日前から
    B: 6ヶ月前から
    C: 1年前から
    D: 2年前から
  answer: C
  explanation: 有効期限は免許証の下部付近に記載されています。免許証は有効期限が切れる1年前から更新することができます。
- id: 28
  category: license_system
  question: 運転免許証の有効期限が切れてから8年以上経過している場合、何が必要ですか？
  choices:
    A: 遅延損害金を支払う必要があるが、試験は不要
    B: 技能試験と知識試験を再受験しなければならない
    C: 新しい運転者講習コースを修了しなければならない
    D: 中間運転免許（Intermediate Driver License）を申請しなければならない
  answer: B
  explanation: 免許の有効期限が切れてから8年以上経過している場合は、技能試験と知識試験を再受験する必要があります。
- id: 29
  category: penalties_and_points
  question: 運転者が運転資格を失う可能性がある理由は次のうちどれですか？
  choices:
    A: 1回の駐車違反切符を受け取ること
    B: 未成年者が銃器を所持していること
    C: 車両登録の有効期限が切れた状態で運転すること
    D: 10日以内に住所変更を行わないこと
  answer: B
  explanation: 運転者は、アルコール、薬物、または銃器を所持している未成年者である場合など、いくつかの理由で運転資格を失う可能性があります。
- id: 30
  category: safe_driving_rules
  question: 中間運転免許（Intermediate Driver License）の保持者が、時間帯を問わず同乗者を乗せて運転できるのはどのような条件の場合ですか？
  choices:
    A: 学校主催のイベントへの行き帰りの場合
    B: 農業目的の場合
    C: パートタイムの仕事への通勤の場合
    D: 学習許可証（Instruction Permit）を少なくとも6ヶ月間保持している場合
  answer: B
  explanation: 制限の例外として、中間運転免許の保持者は、農業目的であれば、時間帯を問わず同乗者を乗せて運転することができます。
- id: 31
  category: penalties_and_points
  question: 未成年者がアルコール、薬物、または銃器に関する違反を犯した場合、運転免許証の取得が何歳まで遅れる可能性がありますか？
  choices:
    A: 16歳
    B: 17歳
    C: 18歳
    D: 21歳
  answer: B
  explanation: マニュアルによると、アルコール、薬物、または銃器に関する違反を犯した未成年者は、17歳になるまで免許取得が遅れるリスクがあります。
- id: 32
  category: alcohol_drugs_health
  question: ワシントン州の黙示的同意法（Implied Consent Law）は、運転者に何を義務付けていますか？
  choices:
    A: 交通検問において車両の捜索を受けることに同意すること。
    B: 常に賠償責任保険の証明書を携帯することに同意すること。
    C: 警察官がアルコールや薬物の影響下にあると疑った場合に、検査を受けることに同意すること。
    D: スピード違反の切符を切られた場合に、強制的な免許停止に同意すること。
  answer: C
  explanation: 黙示的同意法（RCW 46.20.308）に基づき、ワシントン州で運転するすべての人は、警察官がアルコールや薬物の影響下にあると疑った場合に検査を受けることに同意したものとみなされます。
- id: 33
  category: penalties_and_points
  question: 酒気帯び運転の疑いがある場合に、血中アルコール濃度（BAC）またはTHC検査を拒否した場合の罰則は何ですか？
  choices:
    A: 30日間の運転免許停止
    B: 90日から730日間、または21歳になるまでのいずれか長い期間の運転免許停止
    C: 運転免許の永久取り消し
    D: 5年間の強制的な禁錮刑
  answer: B
  explanation: 検査を拒否した場合、90日から730日間、または21歳に達するまでのいずれか長い方の期間、運転資格を失う可能性があります。
- id: 34
  category: alcohol_drugs_health
