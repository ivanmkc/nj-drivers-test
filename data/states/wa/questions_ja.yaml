- id: 45
  category: defensive_driving
  question: 車両安全技術（VST）および先進運転支援システム（ADAS）の目的は何ですか？
  choices:
    A: 運転中の人間の注意力の必要性を置き換えるため。
    B: すでに身についている健全な運転習慣を補助し、衝突の影響を軽減するため。
    C: 運転者が車両の操作中に合法的にモバイルデバイスを使用できるようにするため。
    D: 交通違反を自動的に地元の法執行機関に報告するため。
  answer: B
  explanation: これらのシステムは、運転者の習慣を置き換えるものではなく、健全な運転習慣を補助し、事故を未然に防ぐことで衝突の影響を軽減することを目的としています。
- id: 46
