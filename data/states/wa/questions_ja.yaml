- id: 345
  category: vehicle_information
  question: 車両を個人またはディーラーに売却または下取りに出した場合、所有者は何日以内に売却を報告しなければなりませんか？
  choices:
    A: 5日
    B: 10日
    C: 15日
    D: 30日
  answer: A
  explanation: 車両を個人またはディーラーに売却または下取りに出した場合、所有者は5日以内に売却を報告しなければなりません。
- id: 346
  category: vehicle_information
  question: ワシントン州で登録されている車両において、免許更新の月と年のタブはどこに貼る必要がありますか？
  choices:
