  id: 359
- image: yield.png
  category: signs_and_signals
  question: この標識は何をすることを求めていますか？
  choices:
    A: 一時停止（完全に停止）する
    B: 加速して交通流に合流する
    C: 減速し、車両や歩行者に進路を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」標識は、減速し、車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 360
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: この先、通行止め
    B: 駐車禁止
    C: 進入禁止
    D: この先、行き止まり
  answer: C
  explanation: 赤と白の「進入禁止（DO NOT ENTER）」の標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや、進入すると対向車の進路に入ってしまう一方通行の道路で見られます。
  id: 361
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターン（転回）する
    B: 注意深く運転を続ける
    C: 停止して、バックするか向きを変える。あなたは逆走しています
    D: そのエリアを早く抜けるために加速する
  answer: C
  explanation: 赤と白の「逆走（WRONG WAY）」の標識は、一方通行の道路や高速道路のランプで、交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に向きを変えるかバックしてください。
  id: 362
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方通行（左方向）です
    C: 中央分離帯の左側を走行してください
    D: 左側に高速道路の出口があります
  answer: B
  explanation: 矢印が描かれた白黒の「一方通行（ONE WAY）」の標識は、その通りの交通が矢印の指す一方向にのみ進むことを示しています。
  id: 363
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所でのUターン（転回）が禁止されていることを意味します。
  id: 364
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  id: 365
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、その場所での右折が禁止されていることを意味します。
  id: 366
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道幅減少
    B: この区間では他車を追い越してはいけません
    C: この先、対面通行
    D: 右側通行
  answer: B
  explanation: 白黒の「追い越し禁止車線（NO PASSING ZONE）」のペナント型（三角形）の標識は、このエリアで他車を追い越すことが許可されていないことを意味します。これは追い越し禁止区間の始まりを示します。
  id: 367
- image: keep_right.png
  category: signs_and_signals
  question: この標識はドライバーに何を指示していますか？
  choices:
    A: 右側に合流してください
    B: 右折専用
    C: 分離帯や障害物の右側を通行してください
    D: この先、右車線終点
  answer: C
  explanation: 矢印が描かれた白い規制標識「右側通行（KEEP RIGHT）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 368
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。速度制限標識は、理想的な条件下においてそのエリアで認められる法定最高速度を示します。
  id: 369
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色い菱形の標識は何を警告していますか？
  choices:
    A: この先に動物園またはサファリパークがあります
    B: このエリアでは鹿が頻繁に道路を横断します
    C: この先、狩猟区域です
    D: 近くに野生動物保護区があります
  answer: B
  explanation: 鹿のシルエットが描かれた黄色い菱形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 370
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先にスクールゾーンがある
    B: この先に横断歩道がある
    C: 近くにハイキングコースがある
    D: この先にバス停がある
  answer: B
  explanation: 歩行者の姿が描かれた黄色いひし形の標識は、この先に横断歩道があることを警告しています。道路を横断する歩行者のために停止できるよう準備してください。
  id: 371
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区域
    C: スクールゾーンまたは学校周辺の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは学校周辺の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 372
- image: railroad_crossing.png
  category: signs_and_signals
  question: この円形の黄色い標識は何を警告していますか？
  choices:
    A: この先にラウンドアバウトがある
    B: 病院区域
    C: この先に踏切がある
    D: 追い越し禁止区域
  answer: C
  explanation: 黒いXと2つのRが描かれた円形の黄色い標識は、この先に踏切があることを知らせる事前警告標識です。速度を落とし、列車の音や姿を確認してください。
  id: 373
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 学校周辺の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型のクロスバック標識は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 374
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先で行き止まり
    B: 右折必須
    C: この先に右カーブがある
    D: この先に回り道（デトア）がある
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先の道路にカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 375
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角であることを示す
    B: 大幅な減速を必要とする急な曲がり角を警告している
    C: 右折専用であることを意味する
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急旋回（シャープターン）の標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 376
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先に1つのカーブがある
    C: 反対方向に曲がる2つの連続したカーブがある
    D: この先にラウンドアバウトがある
  answer: C
  explanation: 背向（リバース）カーブの標識は、この先に反対方向へ曲がる2つの連続したカーブがあることを警告しています。速度を落とし、道路がまず一方に曲がり、次に反対側に曲がることに備えてください。
  id: 377
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 1つの急なカーブ
    B: 滑りやすい路面
    C: この先に連続するカーブや曲がり角がある
    D: この先に坂道がある
  answer: C
  explanation: 「ワインディングロード（曲がりくねった道）」の標識は、この先に一連のカーブや曲がり角が続くことを警告しています。速度を落とし、変化する道路状況に注意してください。
  id: 378
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 他の道路からの交通の合流
    C: 中央分離帯のある道路の始まり
    D: 道幅が狭くなり1車線になる
  answer: B
  explanation: 黄色いひし形の合流（マージ）標識は、他の道路からの車両が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
  id: 379
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に橋がある
    B: この先で道幅が狭くなる
    C: 車線の終了
    D: 中央分離帯のある道路の終了
  answer: B
  explanation: この警告標識は、この先の道幅が狭くなることを示しています。道路の幅が減少することに備え、車線内の位置を調整してください。
  id: 380
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 分離道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって対向車線と分けられた分離道路（divided highway）になることを警告しています。右側を通行してください。
  id: 381
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 分離道路の始まり
    B: 分離道路が終わり、対面通行に戻る
    C: この先に合流地点あり
    D: この先に道路工事あり
  answer: B
  explanation: この標識は、分離道路が終了することを警告しています。対向車線が中央分離帯で区切られなくなります。対面通行に備えてください。
  id: 382
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 分離道路の始まり
    B: この先に追い越し区間あり
    C: この先に対面通行あり — 車両が双方向に通行する
    D: この先に車線移動あり
  answer: C
  explanation: この標識はこの先が対面通行であることを警告しています。一方通行の道路や分離道路から出て、反対方向に進む車両と遭遇する可能性があります。
  id: 383
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような路面状況について警告していますか？
  choices:
    A: 路面の凍結
    B: 濡れている時に滑りやすい
    C: この先に曲がりくねった道あり
    D: 路面の凹凸
  answer: B
  explanation: 「スリップ注意（slippery when wet）」の標識は、雨や路面が濡れている時に非常に滑りやすくなる可能性があることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 384
- image: hill.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 路面の隆起
    B: 路面の凹凸
    C: この先に急な下り坂または勾配あり
    D: 道路工事
  answer: C
  explanation: この標識はこの先に急な坂道や勾配があることを警告しています。特にトラックや牽引中の場合は、速度を調整し、低いギアにシフトダウンする必要があるかもしれません。
  id: 385
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: この先に一時停止の標識あり
    B: この先に信号機あり
    C: 通学路の横断歩道
    D: 検問所
  answer: B
  explanation: この標識はこの先に信号機があることを警告しています。赤信号や黄信号の場合に停止できるよう準備してください。この標識は、遠くから信号機が見えにくい場所に設置されることが多いです。
  id: 386
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 譲れ（yield）の標識
    B: 信号機
    C: 一時停止しなければならない停止標識
    D: スピードバンプ（段差）
  answer: C
  explanation: この標識はこの先に一時停止の標識があることを警告しています。減速を開始し、停止標識の場所で完全に停止できるよう準備してください。
  id: 387
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: この先に踏切あり
    B: この先に十字路または交差点あり
    C: この先に病院あり
    D: 歩行者用横断歩道
  answer: B
  explanation: この標識はこの先に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 388
- image: side_road.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: この先に丁字路（T字路）あり
    B: 右側から合流する脇道あり
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は右側から脇道が合流していることを警告しています。脇道から幹線道路に進入してくる車両に注意してください。
  id: 389
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線が合流している
    B: 車線が減少している
    C: 新しい車線が追加される — 合流の必要なし
    D: 右折が必要
  answer: C
  explanation: 「付加車線（added lane）」の標識は、合流を必要とせずに新しい車線が道路に加わることを意味します。ランプから進入する車両には、専用の新しい車線が用意されています。
  id: 390
- image: no_parking.png
  category: signs_and_signals
  id: 391
  question: この標識は何を禁止していますか？
  choices:
    A: いかなる時の停車
    B: この区域での駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「NO PARKING（駐車禁止）」の標識は、この区域に車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは許可されています。
- image: handicap_parking.png
  category: signs_and_signals
  id: 392
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な身体障害者用駐車標章またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転者
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、身体障害者専用の駐車場であることを示しています。有効な身体障害者用駐車標章またはライセンスプレート（ナンバープレート）を掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
