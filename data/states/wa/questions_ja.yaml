- id: 349
  category: driver_responsibility
  question: 事故率が最も高く、スピード違反、飲酒・薬物運転（インペアード・ドライビング）、および脇見運転の割合が最も高い年齢層はどれですか？
  choices:
    A: 16歳から25歳
