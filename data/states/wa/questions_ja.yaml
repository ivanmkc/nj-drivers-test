- id: 341
  category: vehicle_information
  question: 車両の所有権登録（タイトル）および登録（レジストレーション）のために免許センターに車両を持ち込む際、車両が何年未満であれば走行距離計（オドメーター）の読み取り値が必要ですか？
  choices:
