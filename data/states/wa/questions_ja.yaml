- id: 358
  category: defensive_driving
  question: 若年ドライバーの驚くべき事故統計を改善するために、マニュアルが推奨している行動として「誤っているもの」はどれですか？
  choices:
    A: スピードを落とす
    B: 常にしらふで運転する（飲酒・薬物運転をしない）
